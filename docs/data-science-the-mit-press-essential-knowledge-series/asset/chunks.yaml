    - Database management systems based on Edgar F. Codd’s relational data model.
    Relational databases store data in collection of tables where each table has a
    structure of one row per instance and one column per attribute. Links between
    tables can be created by having key attributes appear in multiple tables. This
    structure is suited for SQL queries which define operations on the data in the
    tables.


    ### Smart City

    - Smart-city projects generally try to integrate real-time data from many different
    data sources into a single data hub, where they are analyzed and used to inform
    city-management and planning decisions.


    ### Structured Data

    - Data that can be stored in a table. Every instance in the table has the same
    set of attributes. Contrast with `unstructured data`.


    ### Structured Query Language (SQL)

    - An international standard for defining database queries.


    ### Supervised Learning

    - A form of machine learning in which the goal is to learn a function that maps
    from a set of input attribute values for an instance to an estimate of the missing
    value for the target attribute of the same instance.


    ### Target Attribute

    - In a prediction task, the attribute that the prediction model is trained to
    estimate the value of.


    ### Transactional Data

    - Event information, such as the sale of an item, the issuing of an invoice, the
    delivery of goods, credit card payment, and so on.


    ### Unstructured Data

    - A type of data where each instance in the data set may have its own internal
    structure; that is, the structure is not necessarily the same in every instance.
    For example, text data are often unstructured and require a sequence of operations
    to be applied to them in order to extract a structured representation for each
    instance.


    ### Unsupervised Learning

    - A form of machine learning in which the goal is to identify regularities in
    the data. These regularities may include clusters of similar instances within
    the data or regularities between attributes. In contrast to `supervised learning`,
    in unsupervised learning no target attribute is defined in the data set.


