- raw: "    The developments in probability theory and statistics continued into the\
    \ twentieth century. Karl Pearson developed modern hypothesis testing, and R. A.\
    \ Fisher developed statistical methods for *multivariate analysis* and introduced\
    \ the idea of *maximum likelihood estimate* into statistical inference as a method\
    \ to draw conclusions based on the relative probability of events. The work of\
    \ Alan Turing in the Second World War led to the invention of the electronic computer,\
    \ which had a dramatic impact on statistics because it enabled much more complex\
    \ statistical calculations. Throughout the 1940s and subsequent decades, a number\
    \ of important computational models were developed that are still widely used\
    \ in data science. In 1943, Warren McCulloch and Walter Pitts proposed the first\
    \ mathematical model of a *neural network*. In 1948, Claude Shannon published\
    \ “A Mathematical Theory of Communication” and by doing so founded *information\
    \ theory*. In 1951, Evelyn Fix and Joseph Hodges proposed a model for *discriminatory\
    \ analysis* (what would now be called a *classification* or *pattern-recognition*\
    \ problem) that became the basis for modern *nearest-neighbor* *models*. These\
    \ postwar developments culminated in 1956 in the establishment of the field of\
    \ *artificial intelligence* at a workshop in Dartmouth College. Even at this early\
    \ stage in the development of artificial intelligence, the term *machine learning*\
    \ was beginning to be used to describe programs that gave a computer the ability\
    \ to learn from data. In the mid-1960s, three important contributions to ML were\
    \ made. In 1965, Nils Nilsson’s book titled *Learning Machines* showed how neural\
    \ networks could be used to learn linear models for classification. The following\
    \ year, 1966, Earl B. Hunt, Janet Marin, and Philip J. Stone developed the concept-learning\
    \ system framework, which was the progenitor of an important family of ML algorithms\
    \ that induced decision-tree models from data in a top-down fashion. Around the\
    \ same time, a number of independent researchers developed and published early\
    \ versions of the *k-means* clustering algorithm, now the standard algorithm used\
    \ for data (customer) segmentation.\n\n    The field of ML is at the core of modern\
    \ data science because it provides algorithms that are able to automatically analyze\
    \ large data sets to extract potentially interesting and useful patterns. Machine\
    \ learning has continued to develop and innovate right up to the present day.\
    \ Some of the most important developments include *ensemble models*, where predictions\
    \ are made using a set (or committee) of models, with each model voting on each\
    \ query, and *deep-learning neural networks*, which have multiple (i.e., more\
    \ than three) layers of neurons. These deeper layers in the network are able to\
    \ discover and learn complex attribute representations (composed of multiple,\
    \ interacting input attributes that have been processed by earlier layers), which\
    \ in turn enable the network to learn patterns that generalize across the input\
    \ data. Because of their ability to learn complex attributes, deep-learning networks\
    \ are particularly suitable to high-dimensional data and so have revolutionized\
    \ a number of fields, including *machine vision* and *natural-language processing*.\n\
    \n    As we discussed in our review of database history, the early 1970s marked\
    \ the beginning of modern database technology with Edgar F. Codd’s relational\
    \ data model and the subsequent explosion of data generation and storage that\
    \ led to the development of data warehousing in the 1990s and more recently to\
    \ the phenomenon of big data. However, well before the emergence of big data,\
    \ in fact by the late 1980s and early 1990s, the need for a field of research\
    \ specifically targeting the analysis of these large data sets was apparent. It\
    \ was around this time that the term *data mining* started to be used in the database\
    \ communities. As we have already discussed, one response to this need was the\
    \ development of data warehouses. However, other database researchers responded\
    \ by reaching out to other research fields, and in 1989 Gregory Piatetsky-Shapiro\
    \ organized the first workshop on *knowledge discovery in databases* (KDD). The\
    \ announcement of the first KDD workshop neatly sums how the workshop focused\
    \ on a multidisciplinary approach to the problem of analyzing large databases:\n\
    \n    > Knowledge discovery in databases poses many interesting problems, especially\
    \ when databases are large. Such databases are usually accompanied by substantial\
    \ domain knowledge which can significantly facilitate discovery. Access to large\
    \ databases is expensive—hence the need for sampling and other statistical methods.\
    \ Finally, knowledge discovery in databases can benefit from many available tools\
    \ and techniques from several different fields including expert systems, machine\
    \ learning, intelligent databases, knowledge acquisition, and statistics.[¹](#c11140_001.xhtml#FN1)\n\
    \n    In fact, the terms *knowledge discovery in databases* and *data mining*\
    \ describe the same concept, the distinction being that data mining is more prevalent\
    \ in the business communities and KDD more prevalent in academic communities.\
    \ Today, these terms are often used interchangeably,[²](#c11140_001.xhtml#FN2)\
    \ and many of the top academic venues use both. Indeed, the premier academic conference\
    \ in the field is the International Conference on Knowledge Discovery and Data\
    \ Mining.\n\n    ### The Emergence and Evolution of Data Science\n\n    The term\
    \ *data science* came to prominence in the late 1990s in discussions relating\
    \ to the need for statisticians to join with computer scientists to bring mathematical\
    \ rigor to the computational analysis of large data sets. In 1997, C. F. Jeff\
    \ Wu’s public lecture “Statistics = Data Science?” highlighted a number of promising\
    \ trends for statistics, including the availability of large/complex data sets\
    \ in massive databases and the growing use of computational algorithms and models.\
    \ He concluded the lecture by calling for statistics to be renamed “data science.”\n\
    \n    In 2001, William S. Cleveland published an action plan for creating a university\
    \ department in the field of data science (Cleveland 2001). The plan emphasizes\
    \ the need for data science to be a partnership between mathematics and computer\
    \ science. It also emphasizes the need for data science to be understood as a\
    \ multidisciplinary endeavor and for data scientists to learn how to work and\
    \ engage with subject-matter experts. In the same year, Leo Breiman published\
    \ “Statistical Modeling: The Two Cultures” (2001). In this paper, Breiman characterizes\
    \ the traditional approach to statistics as a data-modeling culture that views\
    \ the primary goal of data analysis as identifying the (hidden) stochastic data\
    \ model (e.g., *linear regression*) that explains how the data were generated.\
    \ He contrasts this culture with the algorithmic-modeling culture that focuses\
    \ on using computer algorithms to create prediction models that are accurate (rather\
    \ than explanatory in terms of how the data was generated). Breiman’s distinction\
    \ between a statistical focus on models that explain the data versus an algorithmic\
    \ focus on models that can accurately predict the data highlights a core difference\
    \ between statisticians and ML researchers. The debate between these approaches\
    \ is still ongoing within statistics (see, for example, Shmueli 2010). In general,\
    \ today most data science projects are more aligned with the ML approach of building\
    \ accurate prediction models and less concerned with the statistical focus on\
    \ explaining the data. So although data science became prominent in discussions\
    \ relating to statistics and still borrows methods and models from statistics,\
    \ it has over time developed its own distinct approach to data analysis."
