  trans: '


    大多数机器学习算法可以分为`supervised learning`（监督学习）或`unsupervised learning`（无监督学习）。监督学习的目标是学习一个函数，它从描述实例的属性值映射到该实例的另一个属性值，该属性被称为`target
    attribute`（目标属性）。例如，当使用监督学习来训练垃圾邮件过滤器时，算法尝试学习一个从描述电子邮件的属性映射到 `target attribute`
    值（垃圾邮件/非垃圾邮件）的函数；算法学习的函数就是算法返回的垃圾邮件过滤器模型。因此，在这种背景下，算法在数据中寻找的模式就是从输入属性值映射到 `target
    attribute` 值的函数，而算法返回的模型是实现该函数的计算机程序。监督学习的工作原理是通过搜索大量不同的函数，以找到最能映射输入和输出的函数。然而，对于任何具有合理复杂性的数据集，输入的组合和可能的输出映射都太多了，以至于算法无法尝试所有可能的函数。因此，每个机器学习算法的设计都是为了在搜索过程中查看或偏好某些类型的函数。这些偏好被称为算法的`learning
    bias`（学习偏差）。使用机器学习的真正挑战是找到学习偏差与特定数据集最匹配的算法。通常，这项任务涉及对许多不同算法进行实验，以找出哪一个在该数据集上效果最好。


    监督学习之所以被称为“监督”，是因为数据集中的每个实例都列出了每个实例的输入值和输出（目标）值。因此，学习算法可以通过检查其尝试的每个函数与数据集的匹配程度来引导其对最佳函数的搜索，同时数据集通过提供反馈充当学习过程的监督者。显然，为了进行监督学习，数据集中的每个实例都必须标记有
    `target attribute` 的值。然而，通常目标属性之所以变得，是因为它并不容易直接测量，因此无法轻松创建带有标记实例的数据集。在这些情况下，在可以使用监督学习训练模型之前，需要花费大量精力和创建一个带有目标值的数据集。


    在无监督学习中，没有`target attribute`。因此，可以使用无监督学习算法，而无需花费时间和精力的对数据集的实例标记 `target attribute`。然而，没有目标属性也意味着学习变得更加困难：算法的任务不再是寻找匹配数据的输入到输出映射的特定问题，而是更通用的任务——寻找数据中的规律性。最常见的无监督学习类型是`cluster
    analysis`（聚类分析），算法在该类中寻找彼此之间比数据中其他实例更相似的实例簇。这些聚类算法通常从猜测一组簇开始，然后迭代地更新簇（从一个簇中删除实例并将其添加到另一个簇中），以增加簇内相似性和簇间的多样性。


    聚类的一个挑战在于如何衡量相似性。如果数据中的所有属性都是数值型的且具有相似的范围，那么计算实例（或行）之间的`Euclidean distance`（欧几里得距离，也常称为直线距离）可能是合理的。在欧几里得空间中接近的行将被认为是相似的。然而，许多因素会使行之间的相似性计算变得复杂。在某些数据集中，不同的数值属性具有不同的范围，导致一个属性中的行值变化可能不如另一个属性中相同数量的变化显著。在这些情况下，应该对属性进行归一化，使它们具有相同的范围。计算相似性的另一个复杂因素是，事物可以用许多不同的方式被认为是相似。某些属性有时比其他属性重要，因此在距离计算中对某些属性进行加可能是合理的，或者数据集可能包含非数值数据。这些更复杂的场景可能需要为聚类算法设计定制的相似性指标。


    无监督学习可以用一个具体的例子来说明。假设我们对分析美国白人成年男性患二型糖尿病的原因感兴趣。我们将从构建一个数据集开始，每行代表一个人，每列代表一个我们认为与研究相关的属性。对于这个例子，我们将包含以下属性：个人的身高（米）和体重（公斤），他每周锻炼的分钟数，他的鞋码，以及根据一系列临床测试和生活方式调查以百分比表示的患糖尿病概率。`Table
    2`展示了该数据集的一个片段。显然，可以包含其他属性——例如一个人的年龄——并且可以移除某些属性——例如鞋码，这对于确定某人是否会患糖尿病并不特别相关。正如我们在第
    2 章中讨论的，选择数据集中包含和排除哪些属性是数据科学的一项关键任务，但为了讨论方便，我们将直接使用该数据集。


    ![Table 2 Diabetes Study Data Set](img/1114_004_T2.png)


    糖尿病研究数据集


    无监督聚类算法将寻找一组行，这些行彼此之间比与数据中的其他行更相似。这些相似行组的每组都定义了一个相似实例的簇。例如，算法可以通过寻找簇内相对频繁的属性值来识别疾病的原因或疾病共病（同时发生的疾病）。寻找相似行簇的简单想法非常强大，并应用到生活的许多领域。行聚类的另一个应用是为客户提供产品推荐。如果客户喜欢某本书、一首歌或一部电影，那么他可能喜欢来自同一簇的另一本书、一首歌或一部电影。


    ## 学习预测模型


    '
