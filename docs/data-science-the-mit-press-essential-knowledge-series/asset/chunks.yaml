- raw: "    This rule indicates that customers who are buying *hot dogs* and *ketchup*\
    \ are also likely to buy *beer*. A frequent example of the power of association-rule\
    \ mining is the *beer-diapers* example that describes how an unknown US supermarket\
    \ in the 1980s used an early computer system to analyze its checkout data and\
    \ identified an unusual association between diapers and beer in customer purchases.\
    \ The theory developed to understand this rule was that families with young children\
    \ were preparing for the weekend and knew that they would need diapers and would\
    \ have to socialize at home. The store placed the two items near each other, and\
    \ sales soared. The beer-and-diapers story has been debunked as apocryphal, but\
    \ it is still a useful example of the potential benefits of association-rule mining\
    \ for retail businesses.\n\n    Two main statistical measures are linked with\
    \ association rules: *support* and *confidence*. The *support* percentage of an\
    \ association rule—or the ratio of transactions that include both the antecedent\
    \ and consequent to the total number of transactions—indicates how frequently\
    \ the items in the rule occur together. The *confidence* percentage of an association\
    \ rule—or the ratio of the number of transactions that include both the antecedent\
    \ and consequent to the number of transactions that includes the antecedent—is\
    \ the conditional probability that the consequent will occur given the occurrence\
    \ of the antecedent. So, for example, a confidence of 75 percent for the association\
    \ rule relating *hot dogs* and *ketchup* with *beer* would indicate that in 75\
    \ percent of cases where customers purchased both *hot* *dogs* and *ketchup*,\
    \ they also purchased *beer*. The support score of a rule simply records the percentage\
    \ of baskets in the data set where the rule holds. For example, a support of 5\
    \ percent indicates that 5 percent of all the baskets in the data set contain\
    \ all three items in the rule “*hot dogs*, *ketchup*, and *beer*.”\n\n    Even\
    \ a small data set can result in the generation of a large number of association\
    \ rules. In order to control the complexity of the analysis of these rules, it\
    \ is usual to prune the generated rule set to include only rules that have both\
    \ a high support and a high confidence. Rules that don’t have high support or\
    \ confidence are not interesting either because the rule covers only a very small\
    \ percentage of baskets (low support) or because the relationship between the\
    \ items in the antecedent and the consequent is low (low confidence). Rules that\
    \ are trivial or inexplicable should also be pruned. Trivial rules represent associations\
    \ that are obvious and well known to anyone who understands the business domain.\
    \ An inexplicable rule represents associations that are so strange that it is\
    \ difficult to understand how to convert the rule into a useful action for the\
    \ company. It is likely that an inexplicable rule is the result of an odd data\
    \ sample (i.e., the rule represents a spurious correlation). Once the rule set\
    \ has been pruned, the data scientist can then analyze the remaining rules to\
    \ understand what products are associated with each other and apply this new information\
    \ in the organization. Organizations will typically use this new information to\
    \ determine store layout or to perform some targeted marketing campaigns to their\
    \ customers. These campaigns can involve updates to their websites to include\
    \ recommended products, in-store advertisements, direct mailings, the cross-selling\
    \ of other products by check-out staff, and so on.\n\n    Association mining becomes\
    \ more powerful if the baskets of items are connected to demographic data about\
    \ the customer. This is why so many retailers run loyalty-card schemes because\
    \ such schemes allow them not only to connect different baskets of goods to the\
    \ same customer through time but also to connect baskets of goods to the customer’s\
    \ demographics. Including this demographic information in the association analysis\
    \ enables the analysis to be focused on particular demographics, which can further\
    \ help marketing and targeted advertising. For example, demographic-based association\
    \ rules can be used with new customers, for whom the company has no buying-habit\
    \ information but does have demographic information. An example of an association\
    \ rule augmented with demographic information might be\n\n    *IF gender(male)\
    \ and age(< 35) and {hot-dogs, ketchup}, THEN {beer}.*\n\n    \\[*Support* = *2%,\
    \ Confidence* = *90%*.\\]\n\n    The standard application area for association-rule\
    \ mining focuses on what products are in the shopping basket and what products\
    \ are not in the shopping basket. This assumes that the products are purchased\
    \ in one visit to the store or website. This kind of scenario will probably work\
    \ in most retail and other related scenarios. However, association-rule mining\
    \ is also useful in a range of domains outside of retail. For example, in the\
    \ telecommunications industry, applying association-rule mining to customer usage\
    \ helps telecommunications companies to design how to bundle different services\
    \ together into packages. In the insurance industry, association-rule mining is\
    \ used to see if there are associations between products and claims. In the medical\
    \ domain, it is used to check if there are interactions between existing and new\
    \ treatments and medicines. And in banking and financial services, it is used\
    \ to see what products customers typically have and whether these products can\
    \ be applied to new or existing customers. Association-rule mining can also be\
    \ used to analyze purchasing behavior over a period of time. For example, customers\
    \ tend to buy product *X* and *Y* today, and in three months’ time they buy product\
    \ *Z*. This time period can be considered a shopping basket, although it is one\
    \ that spans three months. Applying association-rule mining to this kind of temporally\
    \ defined basket expands the applications areas of association-rule mining to\
    \ include maintenance schedules, the replacement of parts, service calls, financial\
    \ products, and so on.\n\n    ### Churn or No Churn, That Is the Question (Classification)\n\
    \n    A standard business task in customer-relationship management is to estimate\
    \ the likelihood that an individual customer will take an action. The term *propensity\
    \ modeling* is used to describe this task because the goal is to model an individual’s\
    \ propensity to do something. This action could be anything from responding to\
    \ marketing to defaulting on a loan or leaving a service. The ability to identify\
    \ customers who are likely to leave a service is particularly important to cell\
    \ phone service companies. It costs a cell phone service company a substantial\
    \ amount of money to attract new customers. In fact, it is estimated that it generally\
    \ costs five to six times more to attract a new customer than it does to retain\
    \ an established one (Verbeke et al. 2011). As a result, many cell phone service\
    \ companies are very keen to retain their current customers. However, they also\
    \ want to minimize costs. So although it would be easy to retain customers by\
    \ simply giving all customers reduced rates and great phone upgrades, this is\
    \ not a realistic option. Instead, they want to target the offers they give their\
    \ customers to just those customers who are likely to leave in the near future.\
    \ If they can identify a customer who is about to leave a service and persuade\
    \ that customer to stay, perhaps by offering her an upgrade or a new billing package,\
    \ then they can save the difference between the price of the enticement they gave\
    \ the customer and the cost of attracting a new customer."
