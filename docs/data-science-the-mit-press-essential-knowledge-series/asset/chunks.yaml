- raw: "    Finally, the world changes, and models don’t. Implicit in the ML process\
    \ of data set construction, model training, and model evaluation is the assumption\
    \ that the future will be the same as the past. This assumption is known as the\
    \ *stationarity assumption*: the processes or behaviors that are being modeled\
    \ are stationary through time (i.e., they don’t change). Data sets are intrinsically\
    \ historic in the sense that data are representations of observations that were\
    \ made in the past. So, in effect, ML algorithms search through the past for patterns\
    \ that might generalize to the future. Obviously, this assumption doesn’t always\
    \ hold. Data scientists use the term *concept drift* to describe how a process\
    \ or behavior can change, or drift, as time passes. This is why models go out\
    \ of date and need to be retrained and why the CRISP-DM process includes the outer\
    \ circle shown in [figure 4](#c11140_002.xhtml#fig_004) to emphasize that data\
    \ science is iterative. Processes need to put in place postmodel deployment to\
    \ ensure that a model has not gone stale, and when it has, it should be retrained.\
    \ The majority of these decisions cannot be automated and require human insight\
    \ and knowledge. A computer will answer the question it is posed, but unless care\
    \ is taken, it is very easy to pose the wrong question.\n\n    ## Notes\n\n  \
    \  # 5 Standard Data Science Tasks\n\n    One of the most important skills for\
    \ a data scientist is the ability to frame a real-world problem as a standard\
    \ data science task. Most data science projects can be classified as belonging\
    \ to one of four general classes of task:\n\n    *   Clustering (or segmentation)\n\
    \n    *   Anomaly (or outlier) detection\n\n    *   Association-rule mining\n\n\
    \    *   Prediction (including the subproblems of classification and regression)\n\
    \n    Understanding which task a project is targeting can help with many project\
    \ decisions. For example, training a prediction model requires that each of the\
    \ instances in the data set include the value of the target attribute. So knowing\
    \ that the project is doing prediction gives guidance (through requirements) in\
    \ terms of data set design. Understanding the task also informs which ML algorithm(s)\
    \ to use. Although there are a large number of ML algorithms, each algorithm is\
    \ designed for a particular data-mining task. For example, ML algorithms that\
    \ generate decision-tree models are designed primarily for prediction tasks. There\
    \ is a many-to-one relationship between ML algorithms and a task, so knowing the\
    \ task doesn’t tell you exactly which algorithm to use, but it does define a set\
    \ of algorithms that are designed for the task. Because the data science task\
    \ affects both the data set design and the selection of ML algorithms, the decision\
    \ regarding which task the project will target has to be made early on in the\
    \ project life cycle, ideally during the business-understanding phase of the CRISP-DM\
    \ life cycle. To provide a better understanding of each of these tasks, this chapter\
    \ describes how some standard business problems map to tasks.\n\n    ## Who Are\
