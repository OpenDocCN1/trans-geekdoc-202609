- raw: "    So at the moment public opinion is broadly negative toward both government\
    \ surveillance and Internet companies’ gathering, storing, and analyzing of personnel\
    \ data. Today, most commentators agree that data-privacy legislation needs to\
    \ be updated and that changes are happening. In 2012, both the EU and the United\
    \ States published reviews and updates relating to data-protection and privacy\
    \ policies (European Commission 2012; Federal Trade Commission 2012; Kitchin 2014a,\
    \ 173). In 2013, the OECD guidelines were extended to include, among other updates,\
    \ more details in relation to implementing the accountability principle. In particular,\
    \ the new guidelines define the data controller’s responsibilities to have a privacy-management\
    \ program in place and to define clearly what such a program entails and how it\
    \ should be framed in terms of risk management in relation to personal data (OECD\
    \ 2013). In 2014, a Spanish citizen, Mario Costeja Gonzalez, won a case in the\
    \ EU Court of Justice against Google (C-131/12 \\[2014\\]) asserting his right\
    \ to be forgotten. The court held that an individual could request, under certain\
    \ conditions, an Internet search engine to remove links to webpages that resulted\
    \ from searches on the individual’s name. The grounds for such a request included\
    \ that the data are inaccurate or out of date or that the data had been kept for\
    \ longer than was necessary for historical, statistical, or scientific purposes.\
    \ This ruling has major implications for all Internet search engines but may also\
    \ have implications for other big-data hoarders. For example, it is not clear\
    \ at present what the implications are for social media sites such as Facebook\
    \ and Twitter (Marr 2015). The concept of the right to be forgotten has been asserted\
    \ in other jurisdictions. For example, the California “eraser” law asserts a minor’s\
    \ right to have material he has posted on an Internet or mobile service removed\
    \ at his request. The law also prohibits Internet, online, or cell phone service\
    \ companies from compiling personal data relating to a minor for the purposes\
    \ of targeted advertising or allowing a third party to do so.[^(10)](#c11140_006.xhtml#FN34)\
    \ As a final example of the changes taking place, in 2016 the EU-US Privacy Shield\
    \ was signed and adopted (European Commission 2016). Its focus is on harmonizing\
    \ data-privacy obligations across the two jurisdictions. Its purpose is to strengthen\
    \ the data-protection rights for EU citizens in the context where their data have\
    \ been moved outside of the EU. This agreement imposed stronger obligations on\
    \ commercial companies with regard to transparency of data usage, strong oversight\
    \ mechanisms and possible sanctions, as well as limitations and oversight mechanisms\
    \ for public authorities in recording or accessing personal data. However, at\
    \ the time of writing, the strength and effectiveness of the EU-US Privacy Shield\
    \ is being tested in a legal case in the Irish courts. The reason why the Irish\
    \ legal system is at the center of this debate is that many of the large US multinational\
    \ Internet companies (Google, Facebook, Twitter, etc.) have their European, Middle\
    \ East, and Africa headquarters in Ireland. As a result, the data-protection commissioner\
    \ for Ireland is responsible for enforcing EU regulations on transnational data\
    \ transfers made by these companies. Recent history illustrates that it is possible\
    \ for legal cases to result in significant and swift changes in the regulation\
    \ of how personnel data are handled. In fact, the EU-US Privacy Shield is a direct\
    \ consequence of a suit filed by Max Schrems, an Austrian lawyer and privacy activist,\
    \ against Facebook. The outcome of Schrems’s case in 2015 was to invalidate the\
    \ existing EU-US Safe Harbor agreement with immediate effect, and the EU-US Privacy\
    \ Shield was developed as an emergency response to this outcome. Compared to the\
    \ original Safe Harbor agreement, the Privacy Shield has strengthened EU citizens’\
    \ data-privacy rights (O’Rourke and Kerr 2017), and it may well be that any new\
    \ framework would further strengthen these rights. For example, the EU General\
    \ Data Protection Regulations will provide legally enforceable data protection\
    \ to EU citizens from May 2018.\n\n    From a data science perspective, these\
    \ examples illustrate that the regulations around data privacy and protection\
    \ are in flux. Admittedly, the examples listed here are from the US and EU contexts,\
    \ but they are indicative of broader trends in relation to privacy and data regulation.\
    \ It is very difficult to predict how these changes will play out in the long\
    \ term. A range of vested interests exist in this domain: consider the differing\
    \ agendas of big Internet, advertising and insurances companies, intelligence\
    \ agencies, policing authorities, governments, medical and social science research,\
    \ and civil liberties groups. Each of these different sectors of society has differing\
    \ goals and needs with regard to data usage and consequently has different views\
    \ on how data-privacy regulation should be shaped. Furthermore, we as individuals\
    \ will probably have shifting views depending on the perspective we adopt. For\
    \ example, we might be quite happy for our personnel data to be shared and reused\
    \ in the context of medical research. However, as the public-opinion surveys in\
    \ Europe and the United States have reported, many of us have reservations about\
    \ data gathering, reuse, and sharing in the context of targeted advertising. Broadly\
    \ speaking, there are two themes in the discourse around the future of data privacy.\
    \ One view argues for the strengthening of regulations relating to the gathering\
    \ of personal data and in some cases empowering individuals to control how their\
    \ data are gathered, shared, and used. The other view argues for deregulation\
    \ in relation to the gathering of data but also for stronger laws to redress the\
    \ misuse of personnel data. With so many different stakeholders and perspectives,\
    \ there are no easy or obvious answers to the questions posed about privacy and\
    \ data. It is likely that the eventual solutions that are developed will be defined\
    \ on a sector-by-sector basis and consist of compromises negotiated between the\
    \ relevant stakeholders.\n\n    In such a fluid context, it is best to act conservatively\
    \ and ethically. As we work on developing new data science solutions to business\
    \ problems, we should consider ethical questions in relation to personal data.\
    \ There are good business reasons to do so. First, acting ethically and transparently\
    \ with personal data will ensure that a business will have good relationships\
    \ with its customers. Inappropriate practices around personal data can cause a\
    \ business severe reputational damage and cause its customer to move to competitors\
    \ (Buytendijk and Heiser 2013). Second, there is a risk that as data integration,\
    \ reuse, profiling, and targeting intensify, public opinion will harden around\
    \ data privacy in the coming years, which will lead to more-stringent regulations.\
    \ Consciously acting transparently and ethically is the best way to ensure that\
    \ the data science solutions we develop do not run afoul of current regulations\
    \ or of the regulations that may come into existence in the coming years."
