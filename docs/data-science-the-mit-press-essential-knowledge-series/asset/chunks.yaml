- raw: "    In the past 10 years there have also been major advances in ML. In particular,\
    \ deep learning has emerged and has revolutionized how computers can process language\
    \ and image data. The term *deep learning* describes a family of neural network\
    \ models with multiple layers of units in the network. Neural networks have been\
    \ around since the 1940s, but they work best with large, complex data sets and\
    \ take a great deal of computing resources to train. So the emergence of deep\
    \ learning is connected with growth in big data and computing power. It is not\
    \ an exaggeration to describe the impact of deep learning across a range of domains\
    \ as nothing less than extraordinary.\n\n    DeepMind’s computer program AlphaGo[⁷](#c11140_001.xhtml#FN7)\
    \ is an excellent example of how deep learning has transformed a field of research.\
    \ Go is a board game that originated in China 3,000 years ago. The rules of Go\
    \ are much simpler than chess; players take turns placing pieces on a board with\
    \ the goal of capturing their opponent’s pieces or surrounding empty territory.\
    \ However, the simplicity of the rules and the fact that Go uses a larger board\
    \ means that there are many more possible board configurations in Go then there\
    \ are in chess. In fact, there are more possible board configurations for Go than\
    \ there are atoms in the universe. This makes Go much more difficult than chess\
    \ for computers because of its much larger search space and difficulty in evaluating\
    \ each of these possible board configurations. The DeepMind team used deep-learning\
    \ models to enable AlphaGo to evaluate board configurations and to select the\
    \ next move to make. The result was that AlphaGo became the first computer program\
    \ to beat a professional Go player, and in March 2016 AlphaGo beat Led Sedol,\
    \ the 18-time Go world champion, in a match watched by more than 200 million people\
    \ worldwide. To put the impact of deep learning on Go in context, as recently\
    \ as 2009 the best Go computer program in the world was rated at the low end of\
    \ advanced amateur; seven years later AlphaGo beat the world champion. In 2016,\
    \ an article describing the deep-learning algorithms behind AlphaGo was published\
    \ in the world’s most prestigious academic science journal, *Nature* (Silver,\
    \ Huang, Maddison, et al. 2016).\n\n    Deep learning has also had a massive impact\
    \ on a range of high-profile consumer technologies. Facebook now uses deep learning\
    \ for face recognition and to analyze text in order to advertise directly to individuals\
    \ based on their online conversations. Both Google and Baidu use deep learning\
    \ for image recognition, captioning and search, and machine translation. Apple’s\
    \ virtual assistant Siri, Amazon’s Alexa, Microsoft’s Cortana, and Samsung’s Bixby\
    \ use speech recognition based on deep learning. Huawei is currently developing\
    \ a virtual assistant for the Chinese market, and it, too, will use deep-learning\
    \ speech recognition. In chapter 4, “Machine Learning 101,” we describe neural\
    \ networks and deep learning in more detail. However, although deep learning is\
    \ an important technical development, perhaps what is most significant about it\
    \ in terms of the growth of data science is the increased awareness of the capabilities\
    \ and benefits of data science and organization buy-in that has resulted from\
    \ these high-profile success stories.\n\n    ## Myths about Data Science\n\n \
    \   Data science has many advantages for modern organizations, but there is also\
    \ a great deal of hype around it, so we should understand what its limitations\
    \ are. One of the biggest myths is the belief that data science is an autonomous\
    \ process that we can let loose on our data to find the answers to our problems.\
    \ In reality, data science requires skilled human oversight throughout the different\
    \ stages of the process. Humans analysts are needed to frame the problem, to design\
    \ and prepare the data, to select which ML algorithms are most appropriate, to\
    \ critically interpret the results of the analysis, and to plan the appropriate\
    \ action to take based on the insight(s) the analysis has revealed. Without skilled\
    \ human oversight, a data science project will fail to meet its targets. The best\
    \ data science outcomes occur when human expertise and computer power work together,\
    \ as Gordon Linoff and Michael Berry put it: “Data mining lets computers do what\
    \ they do best—dig through lots of data. This, in turn, lets people do what people\
    \ do best, which is to set up the problem and understand the results” (2011, 3).\n\
    \n    The widespread and growing use of data science means that today the biggest\
    \ data science challenge for many organizations is locating qualified human analysts\
    \ and hiring them. Human talent in data science is at a premium, and sourcing\
    \ this talent is currently the main bottleneck in the adoption of data science.\
    \ To put this talent shortfall in context, in 2011 a McKinsey Global Institute\
    \ report projected a shortfall in the United States of between 140,000 and 190,000\
    \ people with data science and analytics skills and an even larger shortfall of\
    \ 1.5 million managers with the ability to understand data science and analytics\
    \ processes at a level that will enable them to interrogate and interpret the\
    \ results of data science appropriately (Manyika, Chui, Brown, et al. 2011). Five\
    \ years on, in their 2016 report, the institute remained convinced that data science\
    \ has huge untapped value potential across an expanding range of applications\
    \ but that the talent shortfall will remain, with a predicted shortfall of 250,000\
    \ data scientists in the near term (Henke, Bughin, Chui, et al. 2016).\n\n   \
    \ The second big myth of data science is that every data science project needs\
    \ big data and needs to use deep learning. In general, having more data helps,\
    \ but having the *right* data is the more important requirement. Data science\
    \ projects are frequently carried out in organizations that have significantly\
    \ less resources in terms of data and computing power than Google, Baidu, or Microsoft.\
    \ Examples indicative of the scale of smaller data science projects include claim\
    \ prediction in an insurance company that processes around 100 claims a month;\
    \ student dropout prediction for a university with less than 10,000 students;\
    \ membership dropout prediction for a union with several thousand members. So\
    \ an organization doesn’t need to be handling terabytes of data or to have massive\
    \ computing resources at its disposal to benefit from data science.\n\n    A third\
    \ data science myth is that modern data science software is easy to use, and so\
    \ data science is easy to do. It is true that data science software has become\
    \ more user-friendly. However, this ease of use can hide the fact that doing data\
    \ science properly requires both appropriate domain knowledge and the expertise\
    \ regarding the properties of the data and the assumptions underpinning the different\
    \ ML algorithms. In fact, it has never been easier to do data science badly. Like\
    \ everything else in life, if you don’t understand what you are doing when you\
    \ do data science, you are going to make mistakes. The danger with data science\
    \ is that people can be intimidated by the technology and believe whatever results\
    \ the software presents to them. They may, however, have unwittingly framed the\
    \ problem in the wrong way, entered the wrong data, or used analysis techniques\
    \ with inappropriate assumptions. So the results the software presents are likely\
    \ to be the answer to the wrong question or to be based on the wrong data or the\
    \ outcome of the wrong calculation."
