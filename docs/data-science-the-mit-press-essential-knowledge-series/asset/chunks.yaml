    虽然 Hadoop 是广为人知的大数据处理框架，但它绝不是唯一的一个。其他大数据处理框架包括 `Storm`、`Spark` 和 `Flink`。所有这些框架都是
    Apache 软件基金会项目。这些框架之间的区别在于 `Hadoop` 主要设计用于数据的批处理。当数据集在处理过程中是静态的，且处理结果不需要立即获得（或至少对时间不敏感）时，批处理是合适的。`Storm`
    框架为处理数据流而设计。在流式处理中，流中的每个元素在进入系统时都会被处理，因此处理操作被定义为作用于流中的每个元素，而不是作用于整个数据集。例如，批处理可能会返回一个数据集的平均值，而流式处理会为流中的每个元素返回一个单独的标签或值（例如为
    Twitter 流中的每条推文计算情感得分）。`Storm` 设计用于数据的实时处理，根据 `Storm` 网站，它的基准测试每节点秒可处理超过百万个元组。`Spark`
    和 `Flink` 都是混合（批处理和流处理）处理框架。`Spark` 从根本上是一个批处理框架，类似于 `Hadoop`，但同时也具有一些流处理能力；而
    `Flink` 是一个也可以用于批处理的流处理框架。尽管这些大数据处理框架为数据科学家提供了多种工具来满足其项目特定的大数据需求，但使用这些框架可能存在缺点，即现代数据科学家现在必须在两个不同的位置分析数据：传统的现代数据库和大数据存储器。下一节将介绍如何解决这一特定问题。


    ### 混合数据库世界


    如果一个组织的数据规模和程度未达到需要 `Hadoop` 解决方案的程度，那么它只需要传统的数据库软件来管理其数据。然而，一些文献认为，`Hadoop` 世界中可用的数据存储和处理工具将取代更传统的数据库。很难想象这种情况会发生，最近关于在所谓的“混合数据库世界”中采用更平衡的方法来管理数据，这已经引发了大量讨论。混合数据库世界是传统数据库与
    `Hadoop` 世界共存的地方。


    在混合数据库世界中，组织的数据库和存储在 `Hadoop` 中的数据连接并协同工作，允许对数据进行高效的处理、共享和分析。`图 8` 显示了一个传统的数据仓库，但并不是所有数据都存储在数据库或数据仓库中，大部分数据被移动到了
    `Hadoop`。数据库和 `Hadoop` 之间建立了连接，这允许数据科学家像所有数据都位于同一个位置一样查询数据。数据科学家不需要先查询数据库仓库中的数据部分，然后在单独的步骤中查询存储在
    `Hadoop` 中的部分。他可以像往常一样查询数据，解决方案将识别查询的哪些部分需要在每个位置运行。在每个位置得到的查询结果将合并在一起并呈现给他。同样，随着数据仓库的增长，一些旧数据被查询的频率会降低。混合数据库解决方案会将使用频率较低的数据移动到
    `Hadoop` 环境，将使用频率较高的数据移动到仓库。混合数据库根据访问频率和正在进行的数据科学类型自动平衡数据的位置。


    ![图 8 数据库、数据仓储与 Hadoop 的协同工作（灵感来自 Gluent 数据平台白皮书，2017 年，https://gluent.com/wp-content/uploads/2017/09/Gluent-Overview.pdf）。](img/11140_003_fig_008.jpg)


    `图 8` 数据库、数据仓储与 Hadoop 的协同工作（灵感来自 Gluent 数据平台白皮书，2017 年,[https://gluent.com/wp-content/uploads/2017/09/Gluent-Overview.pdf]）。


    这种混合解决方案的优势之一是数据科学家仍然使用 `SQL` 来查询数据。他不需要学习另一种数据查询语言，也不需要使用各种不同的工具。根据目前的趋势，主要的数据库供应商、数据集成解决方案供应商以及所有云数据存储供应商在未来都会推出与此类混合方案类似的解决方案。


    ### 数据准备与集成


    数据集成涉及从不同的数据源获取数据并合并，以提供整个组织数据的统一视图。这种集成的一个良好例子是医疗记录。理想情况下，每个人都应该有一份健康记录，每家医院、医疗机构和全科医生都使用相同的患者标识符或相同的单位、相同的评分系统等。遗憾的是，几乎每家医院都有自己独立的患者管理系统，医院内的每个医疗实验室也是如此。想想在寻找患者记录并将正确的结果分配给正确患者时面临的挑战。而这些仅仅是某一家医院面临的挑战。在多家医院共享患者数据的场景下，集成问题变得非常严峻。正因为这些挑战，`CRISP-DM`
    的前三个阶段占据了数据科学项目总时间的 70% 到 80%，其中大部分时间被分配给数据集成。


    即使数据是结构化的，从多个数据源集成数据也是困难的。然而，当涉及到一些较新的大数据源（半结构化或非结构化数据是常态）时，集成数据和管理架构的可能会变得巨大的。数据集成挑战的一个说明性例子是客户数据。客户数据可能存在许多不同的应用程序（以及应用程序相应的数据库）中。每个应用程序将包含略有不同的客户数据。例如，内部数据源可能包含客户信用评级、销售额、付款、呼叫中心联系信息等。外部数据源也可以提供有关客户的更多信息。在这种背景下，创建客户的集成视图需要从这些源的每个源提取并集成数据。


    典型的数据集成过程将涉及许多不同阶段，包括提取、清洗、标准化、转换，最后集成以创建一个单一的统一版本数据。从多个数据源提取数据具有挑战性，因为许多数据源只能通过特定于该源的接口访问。因此，数据科学家需要具备广泛的技能，以便与每个数据源交互以获取数据。


    '
