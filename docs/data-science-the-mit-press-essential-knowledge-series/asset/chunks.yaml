  trans: '


    CRISP-DM 过程中最后两个阶段——评估和部署，侧重于模型如何适应业务及其流程。在建模阶段运行的测试完全关注模型对数据集的准确性。评估阶段则涉及在业务需求定义的更广泛的背景下对模型进行评估。模型是否满足该流程的业务目标？是否存在任何业务原因导致模型不再适用？在流程的这一阶段，数据科学家对项目活动进行通用的质量保证审查也很有：是否遗漏了任何内容？是否有什么地方可以做得更好？基于对模型的总体评估，评估阶段做出的主要决策是应该将某些模型部署到业务中，还是需要进行
    CRISP-DM 流程的再次迭代以创建足够的模型。假设评估过程通过了某个或多个模型，项目将进入流程的最后一个阶段：部署。部署阶段涉及检查如何将选择的模型部署到业务环境中。这涉及到规划如何将模型集成到组织的技术基础设施和业务流程中。最好的模型是那些能够平滑融入当前实践的模型。符合当前实践的模型拥有一群自然用户，他们有明确定义的问题，而模型可以帮助他们解决。部署的另一个方面是制定一项计划，定期审查模型的性能。


    CRISP-DM 图形的外圈（图 4）突出了整个过程是如何迭代的。数据科学项目的迭代性质也许是数据科学讨论中最容易被忽视的方面。在项目开发并部署模型后，应该定期对模型进行审查，以检查其仍然符合业务需求以及是否已经过时。数据驱动模型变得过时的原因有很多：业务需求可能发生了变化；模型模拟并提供洞察的流程可能发生了变化（例如，客户行为的变化、垃圾邮件的变化等）；或者模型使用的数据流可能发生了变化（例如，向模型馈送信息的传感器可能已经更新，新版本的传感器提供的读数略有不同，导致模型性下降）。这种审查的频率取决于业务生态系统和模型使用的数据演化的速度。需要持续监控以确定再次执行该流程的最佳时机。这就是图
    4 所示的 CRISP-DM 流程外圈所代表的。例如，根据数据、业务问题和领域，你可能需要按每年、每季度、每月、每周甚至每天进行这种迭代过程。图 5 提供了数据科学项目流程不同阶段以及每个阶段涉及的主要任务总结。


    ![图 5 CRISP-DM 阶段和任务（基于 Chapman, Clinton, Kerber, et al. 1999 中的图 3）。](img/11140_002_fig_005.jpg)


    图 5 CRISP-DM 阶段和任务


    基于 Chapman, Clinton, Kerber, et al. 1999 中的图 3 的 CRISP-DM 阶段和任务。


    许多数据科学家犯的一个错误是匆忙通过各个阶段。然而，为了数据科学项目的成功，数据科学家需要对业务有深入了解。在获取数据方面，一些软件供应商提供了混合解决方案。2016
    年的一项调查显示，79% 的时间花在：

    - 收集数据：19%

    - 清洗和组织数据：60%

    - 构建训练集：3%

    - 挖掘数据：9%

    - 优化算法：5%


    这 79% 是收集和准备数据所花费的时间总和。这是一个一致的发现。


    ## 数据科学生态系统


    用于数据科学的技术 set 在不同组织间存在。组织规模越大或处理的数据越多（或两者如此），技术生态系统的复杂性就越高。在大多数情况下，这种生态系统包含来自多个不同供应商的工具和组件。组织在开发自己的数据生态系统时有一系列方法可供选择。在光谱的一端，组织可能决定投资一套商业化的集成工具
    set；在的另一端，它可能会通过整合一套开源工具和语言来构建一个定制的生态系统。在这两个极端之间，一些软件供应商提供了商业产品和开源产品的混合解决方案。然而，尽管特定的工具组合会随组织的不同而异，但在数据科学架构中存在的组件方面具有共性。


    图 6 提供了典型数据架构的高级概述。这种架构不仅适用于大数据环境，也适用于所有规模的数据环境。在图中，三个主要区域包括：

    - 数据源：组织中所有数据产生的地方；

    - 数据存储：数据存储和处理的地方；

    - 应用：与这些数据的消费者共享数据的地方。


    ![图 6 用于数据科学的典型小数据和大数据架构（灵感源自 Hortonworks 时事报，2013 年 4 月 23 日，https://hortonworks.com/blog/hadoop-and-the-data-warehouse-when-to-use-check）。](img/11140_003_fig_006.jpg)


    '
