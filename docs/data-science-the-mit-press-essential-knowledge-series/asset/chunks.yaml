    预测是指根据给定实例的其他属性（或输入属性）的值，估计该实例目标属性值的任务。这是监督机器学习（ML）算法所解决的问题：它们会生成预测模型。我们之前用于说明监督学习的垃圾过滤器示例也适用于此：我们使用监督学习来训练垃圾过滤器模型，而垃圾过滤器模型就是一种预测模型。预测模型的典型用例是对于不在训练数据集中的新实例估计其目标属性。继续我们关于垃圾邮件的例子，我们在旧邮件的数据集上训练垃圾过滤器（预测模型），然后使用该模型来预测新邮件是否为垃圾邮件或非垃圾邮件。预测问题可能是机器学习应用最广泛的问题类型，因此本章的其余部分将重点介绍预测作为引入机器学习的案例研究。在介绍预测模型时，我们从一个预测的基础概念开始：`相关性分析`。然后，我们将解释监督机器学习算法如何工作以创建不同类型的流行预测模型，包括线性回归模型、神经网络模型和决策树。


    ## 相关性不等于因果关系，但某些非常有用


    `相关性`描述了两个属性之间关联的强度。¹ 从通俗意义上说，相关性可以描述两个属性之间的任何类型的关联。“相关性”一词也有特定的统计学含义，通常用作“皮尔逊相关系数”的缩写。皮尔逊相关衡量的是两个数值属性之间线性关系的强度。它的取值范围在
    −1 到 +1 之间。用字母 `r` 表示两个属性之间的皮尔逊值或系数。系数 `r = 0` 表示两个属性不相关。系数 `r = +1` 表示两个属性之间存在完美的正相关，意味着一个属性的每一次变化都伴随着另一个属性在相同方向上的等量变化。系数
    `r = -1` 表示两个属性之间存在完美的负相关，意味着一个属性的每一次变化都伴随着另一个属性的相反变化。解释皮尔逊系数的通用指南是：`r ≈ ±0.7`
    表示属性之间存在强线性关系，`r ≈ ±0.5` 表示存在中等强度线性关系，`r ≈ ±0.3` 表示关系较弱，而 `r ≈ 0` 表示属性之间没有关系。


    在糖尿病研究中，根据我们对人类生理构造的了解，我们预计表 2 列出的某些属性之间将存在关系。例如，通常情况下，人的身高越高，鞋码就越大。我们还预计一个人运动得越多，体重就越轻，但前提是，高个的人可能比运动相同量但较矮的人重。我们还预计一个人的鞋码和运动量之间不会有明显的关系。图
    9 展示了三张散点图，说明了这些直觉是如何反映在数据中的。顶部的散点图显示了如果根据鞋码和身高绘图，数据将如何分布。该散点图中有一个清晰的模式：数据从左下角延伸到右上角，这表明这种关系是随着人的变高（或者我们在
    `x` 轴上向右移动），他们也倾向于穿更大的鞋（我们在 `y` 轴上向上）。数据从左下角到右上角的模式是两个属性之间正相关的。如果我们计算鞋码和身高之间的皮尔逊相关性，系数为
    `r = 0.898`，这表明这两个属性之间存在强正相关。中间的散点图显示了绘制体重和运动量时的数据分布。这里的趋势是反的，从左上角到右下角，这表示相关性：人们运动越多，体重越轻。这对属性的皮尔逊相关系数为
    `r = -0.710`，表明存在强负相关。底部的散点图绘制的是运动量和鞋码。数据在图中呈随机分布，这对属性的皮尔逊相关系数为 `r = -0.272`，表明没有实际相关性。


    ![图 9 鞋码与身高、运动量与鞋码的散点图。](img/11140_004_fig_009.jpg)


    图 9 鞋码与身高、运动量与鞋码的散点图。


    统计相关性的定义似乎限制了其在数据分析中应用于属性对。幸运的是，我们可以通过对属性使用函数来解决这个问题。在第 2 章中，我们将 `BMI` 引入为体重和高度的函数。具体来说，它是体重（公斤）除以身高（米）的平方。BMI
    由比利时一位十九世纪数学家阿多夫·奎特莱发明，用于将个人分类为体重轻、正常体重、肥胖或极胖。使用体重与高的比例是因为 BMI 的设计目的是让同一类别（体重轻、正常体重、肥胖或极胖）的人无论身高如何都具有相似的值。我们知道体重和身高正相关（通常越高越高），因此通过将体重除以身高来控制身高对体重的影响。我们除以身高平方是因为人在变高的同时也会变宽，因此身高平方是为了在计算中考虑人的总体。BMI
    的两个方面对于我们讨论多个属性之间的相关性很有意义。首先，BMI 是一个接收多个属性并映射到新值的函数。这种映射在数据中创建了一个新的派生（而非原始）属性。其次，由于人的
    BMI 是一个单一数值，我们可以计算它与其他属性之间的相关性。

    '
