  trans: '


    这些激活函数对多输入线性回归函数的输出应用非线性映射。两种常用的激活函数是`logistic function`（逻辑函数）和`tanh function`（tanh
    函数）（参见图 12）。这两个函数都接受单个值 `x` 作为输入；在神经元中，这个 `x` 值是该神经元对其输入所应用的多输入线性回归函数的输出。此外，这两个函数都使用了欧拉数
    `e`，其值约等于 2.71828182。这些函数有时被称为`squashing functions`（压缩函数），因为它们接受从正无穷大到负无穷大之间的任何值，并将其映射到一个较小的、预定义的范围内。logistic
    函数的输出范围是 0 到 1，而 tanh 函数的输出范围是 -1 到 1。因此，使用 logistic 函数作为激活函数的神经元，其输出始终在 0 到 1
    之间。由于 logistic 函数和 tanh 函数都应用了非线性映射，这一点从曲线的 S 形形状可以显而易见。在神经元中引入非线性映射的原因是，多输入线性回归函数的一个局限性是根据根据定义它是线性的，如果网络中的所有神经元都只实现线性映射，那么整个网络也将局限于学习线性函数。然而，在网络的神经元中引入非线性激活函数允许网络学习更复杂的（非线性）函数。


    ![图 12 应用于输入 x 的 logistic 函数和 tanh 函数映射。](img/11140_004_fig_012.jpg)


    图 12 应用于输入 `x` 的 logistic 函数和 tanh 函数。


    值得强调的是，神经网络中的每个神经元都在执行一组非常简单的操作：


    1.  将每个输入与权重相乘。

    2.  将所有乘法的结果相加。

    3.  将此结果通过激活函数。


    操作 1 和 2 只是对输入进行多输入回归函数的计算，而操作 3 是激活函数的应用。


    神经网络中神经元之间的所有连接都是有向的，并且都关联有一个权重。进入神经元的连接上的权重，是该神经元在计算其输入的多输入回归函数时，对在该连接接收到的输入所应用的权重。图
    13 展示了简单神经网络的拓扑结构。图中左侧标记为 `A` 和 `B` 的正方形表示我们用此向网络呈现输入数据的内存位置。这些位置上不对数据进行任何处理或转换。你可以将这些节点视为输入或感知神经元，它们的输出激活被设置为输入的值。⁵图
    13 圆圆（标记为 `C`、`D`、`E` 和 `F`）代表网络中的神经元。将网络中的神经元组织成层通常有用。这个网络有三层神经元：输入层包含 `A` 和
    `B`；一个隐藏层包含 `C`、`D` 和 `E`；输出层包含 `F`。`隐藏层`一词描述了层中的神经元既不在输入层也不在输出层，因此从这个意义上说它们是隐藏的。


    ![图 13 简单神经网络。](img/11140_004_fig_013.jpg)


    图 13 简单神经网络。


    神经网络中神经元之间的箭头代表了信息的流动。技术上讲，这种特定的网络是前馈神经网络，因为网络没有循环。此外，这种网络被认为是全连接的，因为每个神经元与下一层的神经元都连接。通过改变层数、神经元的数量、激活函数的类型和其他参数，可以创建许多不同的神经网络。事实上，开发用于特定任务网络的工作涉及对网络布局的实验。网络中的箭头代表了传递的权重。例如，连接
    `C` 与 `F` 的箭头表示 `C` 的输出作为 `F` 的输入，因此 `F` 将应用来自 `C` 的权重 `W`。


    如果我们假设图 13 网络中的神经元使用 `tanh` 激活函数，那么我们可以将神经元 `F` 处的处理定义为对一组函数的复合。


    ![11140_004_005.jpg](img/11140_004_005.jpg)


    神经元 `F` 处处理的数学定义显示，网络的最终输出是通过函数的复合计算的。“复合函数”这一短语意味着函数 `C`、`D` 和 `E` 的输出被用作另一个函数的输入。在这种情况下，`F`
    实现的函数复合了 `C`、`D` 和 `E` 的函数。


    图 14 使这种对神经网络的描述更加具体，展示了一个以一个人的脂肪百分比和 `VO[2]`（人每分钟可利用氧气最大量）作为输入的神经网络，并为这个人计算健身水平。⁶中间层中的每个神经元都根据脂肪百分比和
    `VO[2]` 计算一个函数：`f[1]()`、`f[2]()` 和 `f[3]()`。这些函数中的每一个都以不同的方式对输入交互进行建模。这些函数本质上代表了从网络输入派出的新属性。它们类似于早期描述的
    BMI 属性，BMI 是根据重量和高度计算的。有时可以解释网络中神经元的输出代表什么，只要能够为该派生属性提供领域理论描述并理解为什么这个派生属性对网络是有用的。然而，神经元计算出的派生属性对人类通常没有符号意义。这些属性捕捉了网络发现的有用属性之间的交互。网络中的最后一个节点
    `f[4]` 计算另一个函数——基于 `f[1][]`、`f[2][]` 和 `f[3][]` 的输出——其输出是网络返回的健身预测。再次，这个函数除了定义了网络发现的与目标属性具有高相关性的交互之外，对人类可能没有意义。


    '
