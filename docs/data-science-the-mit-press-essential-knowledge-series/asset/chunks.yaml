    数据科学在各个领域的应用增长受大数据、社交媒体的兴起、计算能力的提升、计算机成本的大幅降低以及用于数据分析和建模的更强大方法的驱动。与此同时，这些技术创新和数据科学更广泛的应用使得数据隐私问题变得前所未有的紧迫。本书的目的是对数据科学进行介绍，涵盖该领域的核心要素。


    ## 章节概述


    第 1 章介绍了数据科学领域，并简述了它的发展和演变历史。它还探讨了为什么数据科学在今天如此重要以及推动其采用的一些因素。本章通过回顾与数据科学相关的迷思结束。


    第 2 章介绍了与数据相关的概念，并描述了数据科学项目的标准阶段：业务理解、数据理解、数据准备、建模、评估和部署。


    第 3 章关注数据基础设施以及多源数据集成带来的挑战。数据的一个具有挑战性的方面是数据库和数据仓库通常存储在不同的分析服务器上。因此，在处理大型数据集时，可能会花费大量的时间在数据移动和机器学习上。第
    3 章从描述典型的数据科学基础设施开始，包括机器学习的使用、`Hadoop` 用于数据存储和处理，以及无缝结合传统数据库软件和 `Hadoop` 类解决方案的开发。本章通过强调将跨组织数据集成到统一表示中的挑战而结束。


    第 4 章介绍了机器学习领域，并解释了一些最流行的机器学习算法和模型，包括神经网络、深度学习和决策树模型。


    第 5 章关注将机器学习专业知识与现实问题相结合，通过回顾一系列标准业务问题并描述如何通过机器学习解决方案来解决。


    第 6 章回顾了数据科学的伦理影响、数据监管的进展，以及数据科学过程中保护个人隐私的一些计算方法。


    最后，第 7 章描述了数据科学在未来产生重大影响的一些领域，并提出了决定数据科学项目能否成功的某些原则。


    # 致谢


    John 和 Brendan 感谢 Paul McElroy 和 Brian Leahy 对早期草稿的阅读和评论。他们还感谢对手稿提供详细且有用反馈的两位匿名评审员，以及
    MIT 出版社员工的支持与指导。


    John 感谢他的家人和朋友在本书准备期间给予的支持与鼓励，并将本书献给他的父亲 John Bernard Kelleher，以感谢他的爱与友。


    Brendan 感谢 Grace、Daniel 和 Eleanor 在他写另一本书（他的第四本）、兼顾日常工作以及旅行期间给予的持续支持。


    # 1 什么是数据科学？


    数据科学涵盖了一系列原则、问题定义、算法和从大型数据集中提取显而易见且实用模式的过程。数据科学的许多元素已经在机器学习和数据挖掘等相关领域得到了发展。事实上，`data
    science`、`machine learning` 和 `data mining` 这术语经常互换使用。这些学科的共同点是关注通过数据分析来改进决策。然而，尽管数据科学借鉴了这些领域，但它的范围更广。机器学习（`ML`）专注于从数据中提取模式的算法的设计和评估。数据挖掘通常处理结构化数据的分析，并且往往强调商业应用。数据科学考虑了所有这些因素，但也承担了其他挑战，例如非结构化社交媒体和网页数据的捕获、清洗和转换；使用大数据技术存储和处理大型非结构化数据集；与数据伦理和监管相关的问题。


    使用数据科学，我们可以提取不同类型的模式。例如，我们可能想要提取帮助我们识别具有相似行为和口味的客户群的模式。在商业术语中，这项任务被称为`客户细分`，在数据科学术语中被称为`聚类`。或者，我们可能想要提取一种识别经常一起购买的产品的模式，这种过程被称为`关联规则挖掘`。或者我们可能想要提取识别奇怪或异常事件的模式，例如欺诈保险理赔，这种过程被称为`异常`或`离群值检测`。最后，我们可能想要识别帮助我们对事物分类的模式。例如，以下规则说明了从邮件数据集中提取的分类模式可能样子：如果一封邮件包含“轻松赚钱”短语，它很可能是一封垃圾邮件。识别这类分类规则被称为`预测`。“预测”这个词似乎是一个奇怪的选择，因为该规则并不预测未来将发生什么：该邮件已经是或不是垃圾邮件了。因此，最好将预测模式理解为预测属性的缺失值，而不是预测未来。在这个示例中，我们正在预测邮件分类属性是否应该具有“垃圾邮件”的值。

    '
