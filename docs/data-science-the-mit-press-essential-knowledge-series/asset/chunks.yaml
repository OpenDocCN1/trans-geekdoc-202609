    \ servers, and the partial results calculated on each server are then reduced\
    \ (merged) together.\n\n    ### A History of Data Analysis\n\n    Statistics is\
    \ the branch of science that deals with the collection and analysis of data. The\
    \ term *statistics* originally referred to the collection and analysis of data\
    \ about the state, such as demographics data or economic data. However, over time\
    \ the type of data that statistical analysis was applied to broadened so that\
    \ today statistics is used to analyze all types of data. The simplest form of\
    \ statistical analysis of data is the summarization of a data set in terms of\
    \ *summary* (*descriptive*) *statistics* (including measures of a central tendency,\
    \ such as the *arithmetic mean*, or measures of variation, such as the *range*).\
    \ However, in the seventeenth and eighteenth centuries the work of people such\
    \ as Gerolamo Cardano, Blaise Pascal, Jakob Bernoulli, Abraham de Moivre, Thomas\
    \ Bayes, and Richard Price laid the foundations of probability theory, and through\
    \ the nineteenth century many statisticians began to use probability distributions\
    \ as part of their analytic tool kit. These new developments in mathematics enabled\
    \ statisticians to move beyond descriptive statistics and to start doing *statistical\
    \ learning*. Pierre Simon de Laplace and Carl Friedrich Gauss are two of the most\
    \ important and famous nineteenth-century mathematicians, and both made important\
    \ contributions to statistical learning and modern data science. Laplace took\
    \ the intuitions of Thomas Bayes and Richard Price and developed them into the\
    \ first version of what we now call *Bayes’ Rule*. Gauss, in his search for the\
    \ missing dwarf planet Ceres, developed the *method of least squares*, which enables\
    \ us to find the best model that fits a data set such that the error in the fit\
    \ minimizes the sum of squared differences between the data points in the data\
    \ set and the model. The method of least squares provided the foundation for statistical\
    \ learning methods such as *linear regression* and *logistic regression* as well\
    \ as the development of *artificial neural network* models in artificial intelligence\
    \ (we will return to least squares, regression analysis, and neural networks in\
    \ chapter 4).\n\n    Between 1780 and 1820, around the same time that Laplace\
    \ and Gauss were making their contributions to statistical learning, a Scottish\
    \ engineer named William Playfair was inventing statistical graphics and laying\
    \ the foundations for modern *data visualization* and *exploratory data analysis*.\
    \ Playfair invented the *line chart* and *area chart* for time-series data, the\
    \ *bar chart* to illustrate comparisons between quantities of different categories,\
    \ and the *pie chart* to illustrate proportions within a set. The advantage of\
    \ visualizing quantitative data is that it allows us to use our powerful visual\
    \ abilities to summarize, compare, and interpret data. Admittedly, it is difficult\
    \ to visualize large (many data points) or complex (many attributes) data sets,\
    \ but data visualization is still an important part of data science. In particular,\
    \ it is useful in helping data scientists explore and understand the data they\
    \ are working with. Visualizations can also be useful to communicate the results\
    \ of a data science project. Since Playfair’s time, the variety of data-visualization\
    \ graphics has steadily grown, and today there is research ongoing into the development\
    \ of novel approaches to visualize large, multidimensional data sets. A recent\
    \ development is the *t-distributed stochastic neighbor embedding* (t-SNE) algorithm,\
    \ which is a useful technique for reducing high-dimensional data down to two or\
    \ three dimensions, thereby facilitating the visualization of those data."
  fmt: '

    Over the past couple of decades, our devices have become mobile and networked,
    and many of us now spend many hours online every day using social technologies,
    computer games, media platforms, and web search engines. These changes in technology
    and how we live have had a dramatic impact on the amount of data collected. It
    is estimated that the amount of data collected over the five millennia since the
    invention of writing up to 2003 is about 5 exabytes. Since 2013, humans generate
    and store this same amount of data every day. However, it is not only the amount
    of data collected that has grown dramatically but also the variety of data. Just
    consider the following list of online data sources: emails, blogs, photos, tweets,
    likes, shares, web searches, video uploads, online purchases, podcasts. And if
    we consider the metadata (data describing the structure and properties of the
    raw data) of these events, we can begin to understand the meaning of the term
    `big data`. Big data are often defined in terms of the three Vs: the extreme `volume`
    of data, the `variety` of the data types, and the `velocity` at which the data
    must be processed.


    The advent of big data has driven the development of a range of new database technologies.
    This new generation of databases is often referred to as “NoSQL databases`. They
    typically have a simpler data model than traditional relational databases. A NoSQL
    database stores data as objects with attributes, using an object notation language
    such as the `JavaScript Object Notation` (JSON). The advantage of using an object
    representation of data (in contrast to a relational table-based model) is that
    the set of attributes for each object is encapsulated within the object, which
    results in a flexible representation. For example, it may be that one of the objects
    in the database, compared to other objects, has only a subset of attributes. By
    contrast, in the standard tabular data structure used by a relational database,
    all the data points should have the same set of attributes (i.e., columns). This
    flexibility in object representation is important in contexts where the data cannot
    (due to variety or type) naturally be decomposed into a set of structured attributes.
    For example, it can be difficult to define the set of attributes that should be
    used to represent free text (such as tweets) or images. However, although this
    representational flexibility allows us to capture and store data in a variety
    of formats, these data still have to be extracted into a structured format before
    any analysis can be performed on them.


    The existence of big data has also led to the development of new data-processing
    frameworks. When you are dealing with large volumes of data at high speeds, it
    can be useful from a computational and speed perspective to distribute the data
    across multiple servers, process queries by calculating partial results of a query
    on each server, and then merge these results to generate the response to the query.
    This is the approach taken by the `MapReduce` framework on Hadoop. In the `MapReduce`
    framework, the data and queries are mapped onto (or distributed across) multiple
    servers, and the partial results calculated on each server are then reduced (merged)
    together.


    ### A History of Data Analysis


    Statistics is the branch of science that deals with the collection and analysis
    of data. The term `statistics` originally referred to the collection and analysis
    of data about the state, such as demographics data or economic data. However,
    over time the type of data that statistical analysis was applied to broadened
    so that today statistics is used to analyze all types of data. The simplest form
    of statistical analysis of data is the summarization of a data set in terms of
    `summary` (`descriptive`) `statistics` (including measures of a central tendency,
    such as the `arithmetic mean`, or measures of variation, such as the `range`).
    However, in the seventeenth and eighteenth centuries the work of people such as
    Gerolamo Cardano, Blaise Pascal, Jakob Bernoulli, Abraham de Moivre, Thomas Bayes,
    and Richard Price laid the foundations of probability theory, and through the
    nineteenth century many statisticians began to use probability distributions as
    part of their analytic tool kit. These new developments in mathematics enabled
    statisticians to move beyond descriptive statistics and to start doing `statistical
    learning`. Pierre Simon de Laplace and Carl Friedrich Gauss are two of the most
    important and famous nineteenth-century mathematicians, and both made important
    contributions to statistical learning and modern data science. Laplace took the
    intuitions of Thomas Bayes and Richard Price and developed them into the first
    version of what we now call `Bayes’ Rule`. Gauss, in his search for the missing
    dwarf planet Ceres, developed the `method of least squares`, which enables us
    to find the best model that fits a data set such that the error in the fit minimizes
    the sum of squared differences between the data points in the data set and the
    model. The method of least squares provided the foundation for statistical learning
    methods such as `linear regression` and `logistic regression` as well as the development
    of `artificial neural network` models in artificial intelligence (we will return
    to least squares, regression analysis, and neural networks in chapter 4).


    Between 1780 and 1820, around the same time that Laplace and Gauss were making
    their contributions to statistical learning, a Scottish engineer named William
    Playfair was inventing statistical graphics and laying the foundations for modern
    `data visualization` and `exploratory data analysis`. Playfair invented the `line
    chart` and `area chart` for time-series data, the `bar chart` to illustrate comparisons
    between quantities of different categories, and the `pie chart` to illustrate
    proportions within a set. The advantage of visualizing quantitative data is that
    it allows us to use our powerful visual abilities to summarize, compare, and interpret
    data. Admittedly, it is difficult to visualize large (many data points) or complex
    (many attributes) data sets, but data visualization is still an important part
    of data science. In particular, it is useful in helping data scientists explore
    and understand the data they are working with. Visualizations can also be useful
    to communicate the results of a data science project. Since Playfair’s time, the
    variety of data-visualization graphics has steadily grown, and today there is
    research ongoing into the development of novel approaches to visualize large,
    multidimensional data sets. A recent development is the `t-distributed stochastic
    neighbor embedding` (t-SNE) algorithm, which is a useful technique for reducing
    high-dimensional data down to two or three dimensions, thereby facilitating the
    visualization of those data.

    '
  trans: '

    在过去的几十年里，我们的设备已经变得移动化和网络化，我们许多人现在每天花费大量时间使用社交技术、电脑游戏、媒体平台和网络搜索引擎。这些技术以及我们生活方式的变化对数据收集的数量产生了巨大影响。据估计，从文字发明起到
    2003 年，这五千年间收集的数据总量约为 5 艾字节（exabytes）。从 2013 年以来，人类每天生成和存储的数据量就等同于此前。然而，增长不仅是收集的数据数量，还有数据的多样性。只需考虑以下在线数据源列表：电子邮件、博客、照片、推文、点赞、分享、网络搜索、视频上传、在线购物、播客。如果我们考虑这些事件的元数据（描述原始数据结构和属性的数据），我们就可以开始理解“大数据”一词的含义了。大数据通常由三个
    V 来定义：极大的数据`volume`（量性）、数据类型的`variety`（多样性）以及处理数据所需的`velocity`（速度性）。


    大数据的出现驱动了一系列新型数据库技术的发展。这一代数据库通常被称为“NoSQL 数据库”。它们通常比传统的关系型数据库具有更简单的数据模型。NoSQL 数据库将数据存储为带有属性的对象，并使用诸如
    `JavaScript Object Notation`（JSON）等对象表示语言。使用数据对象表示法（与基于关系型表的模型相比）的优势是，每个对象的属性集被封装在对象内部，从而实现了灵活的表示。例如，数据库中的某个对象与其他对象相比，可能只有属性的子集。相比之下，在关系型数据库使用的标准表格数据结构中，所有数据点都应该具有相同的属性集（即列）。在数据无法（由于多样性或类型原因）自然地分解为一组结构化属性的场景中，这种对象表示的灵活性至关重要。例如，要定义表示自由文本（如推文）或图像的属性集可能是困难的。然而，尽管这种表示上的灵活性允许我们以各种格式捕获和存储数据，但在这些数据进行任何分析之前，它们仍然必须被提取为结构化格式。


    大数据的存在也导致了新的数据处理框架的发展。当你以高速度处理大量数据时，从计算和速度的角度来看，将数据分布在多个服务器上，通过计算每个服务器上查询的局部结果来处理查询，然后合并这些结果以生成查询的响应，是非常有用的。这就是
    Hadoop 上的 `MapReduce` 框架所采用的方法。在 `MapReduce` 框架中，数据和查询被映射到（或分布在）多个服务器上，然后将每个服务器上计算出的部分结果进行归约（合并）。


    ### 数据分析的历史


    统计学是处理数据收集和分析的科学分支。`statistics` 一词最初指的是对状态数据（如人口统计数据或经济数据）的收集和分析。然而，随着时间的推移，统计分析应用的数据类型扩大了，如今统计学被用于分析所有类型的数据。数据统计分析的最简单形式是根据`summary`（描述性）`statistics`
    对数据集进行总结（包括中心趋势的量，如`arithmetic mean` 算术平均值，或变异量，如`range` 范围）。然而，在十七和十八世纪，Gerolamo
    Cardano、Blaise Pascal、Jakob Bernoulli、Abraham de Moivre、Thomas Bayes 和 Richard
    Price（注：此处可能指托马斯·贝斯或相关学者）等人物的工作奠定了概率论的基础，并在整个十九世纪，许多统计学家开始将概率分布作为其分析工具包的一部分。数学的这些新进展使统计学家能够超越描述统计，开始进行`statistical
    learning`（统计学习）。Pierre Simon de Laplace 和 Carl Friedrich Gauss 是十九世纪最重要、最著名的数学家，他们对统计学习和现代数据科学都做出了重要贡献。Laplace
    取了 Thomas Bayes 和 Richard Price 的直觉，并将其发展为我们现在称为 `Bayes’ Rule`（贝叶斯法则）的第一版本。Gauss
    在寻找丢失的矮行星谷神的过程中，开发了`method of least squares`（最小二乘法），这使得我们能够找到拟合数据集的最佳模型，使得拟合误差使数据点与模型之间差异的平方和最小。最小二乘法为`linear
    regression`（线性回归）和`logistic regression`（逻辑回归）等统计学习方法，以及人工智能中`artificial neural
    network`（人工神经网络）模型的发展提供了基础（我们将在第四章中回到最小二乘法、回归分析和神经网络）。


    在 1780 年到 1820 年之间，就在 Laplace 和 Gauss 为统计学习做出贡献的同时，一位名为 William Playfair 的苏格兰工程师发明了统计图表，并为现代`data
    visualization`（数据可视化）和`exploratory data analysis`（探索性数据分析）奠定了基础。Playfair 发明了用于序列数据的`line
    chart`（折线图）和`area chart`（面积图），用于说明不同类别数量比较的`bar chart`（柱状图），以及用于说明集合比例的`pie chart`（饼图）。可视化定量数据的优势在于它允许我们利用强大的视觉能力来总结、比较和解释数据。诚然，可视化大型（数据点多）或复杂（属性多）的数据是困难的，但数据可视化仍然是数据科学的重要部分。特别是，它对于帮助数据科学家探索和理解他们正在处理的数据非常有用。可视化对于传播数据科学项目的结果也有帮助。从
    Playfair 时代以来，数据可视化图表的种类不断增加，如今正在研究开发可视化大规模多维数据集的新方法。最近的一个进展是`t-distributed stochastic
    neighbor embedding`（t-分布随机邻嵌入）算法，这是一种将高维数据降至二维或三维的有用技术，从而促进了这些数据的可视化。

    '
