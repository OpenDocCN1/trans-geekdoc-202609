    `k`-means` 算法通过选择 `k` 个实例作为初始聚类中心开始。目前的最佳实践是使用一种名为“k-means++”的算法来选择初始聚类中心。`k-means++`
    的原理是尽可能地分散初始聚类中心是一个好主意。因此在 `k-means++` 中，第一个聚类中心通过从数据集中随机选择一个实例来设置。第二个及后续聚类中心通过从数据集中选择实例来设置，所选实例的概率与其最近现有聚类中心的距离平方成正比。一旦初始化了所有
    `k` 个聚类中心，算法通过迭代两个步骤来工作：首先，将每个实例分配给最近的聚类中心；其次，更新聚类中心使其位于分配给它的实例的中间位置。在第一次迭代中，实例被分配给
    `k-means++` 算法返回的最近聚类中心，然后移动这些聚类中心，使其处于分配给它们的实例的中心。移动聚类中心可能会让它们靠近某些实例，并远离其他实例（包括远离某些分配到该聚类中心的实例）。然后实例将再次重新分配给最近的更新后的聚类中心。某些实例将保持分配到同一个聚类中心，另一些可能会被重新分配到新的聚类中心。这种实例分配和中心更新的过程持续持续直到在一次迭代中没有实例被分配到新的聚类中心。`k`-means`
    算法是非确定性的，这意味着聚类中心的不同起始位置可能会产生不同的聚类。因此，该算法通常会运行几次，并对这些不同运行的结果进行比较，根据数据科学家的领域知识和理解查看哪些聚类看起来最合理。


    当一组用于客户画像（聚类被认为是有用的时，通常会给这些聚类命名，以反映该聚类画像的主要特征。每个聚类中心都定义了一个不同的客户画像，画像描述由从关联聚类中心的属性值生成。`k`-means`
    算法并不要求返回相同大小的聚类，事实上，它很可能返回不同大小的聚类。然而，聚类的大小是有用的，因为它们可以帮助指导营销。例如，聚类过程可能会揭示出当前营销活动遗漏的小型、集中的客户群体。或者另一种策略是关注包含产生大量收入客户的聚类。无论采用何种营销策略，理解客户群中的细分市场都是营销成功的前提。


    聚类作为一种分析方法的优势之一是，它可以应用于绝大多数类型的数据。由于其多功能性，聚类经常被用作许多数据科学项目数据理解阶段的数据探索工具。此外，聚类在广泛的领域也有用。例如，它被用于分析特定课程的学生，以识别出需要额外支持或偏好不同学习方法的学生群体。它还用于识别语料库中相似文档的组，在科学领域，它被用于生物信息学分析中的基因序列。


    ## 这是欺诈吗？（异常检测）


    异常检测或离值分析涉及搜索并识别不符合数据集中典型数据的实例。不符合的情况通常被称为 `anomalies`（异常）或 `outliers`（离值）。异常检测通常用于分析财务交易，以识别潜在的欺诈活动并触发调查。例如，异常检测可能通过识别发生在异常位置的交易，或与特定信用卡其他交易相比金额异常大的交易，发现欺诈性信用卡交易。


    大多数公司通常用于异常检测的第一种方法是根据领域知识手动定义一些规则，以帮助识别异常事件。这些规则集通常在 `SQL` 或另一种语言中定义，并在业务数据库或数据仓库的数据上运行。某些编程语言已开始包含特定的命令以方便此类规则的编码。例如，`SQL`
    的数据库实现现在包含一个 `MATCH_RECOGNIZE` 函数，以方便数据中的模式匹配。信用卡欺诈中的一种常见模式是，当信用卡被盗时，小偷首先通过在卡上购买小物品来检查卡是否是否正常，如果交易通过了，小偷就会在卡被注销之前，尽可能快地在某次购买之后购买一件昂贵的物品。`SQL`
    中的 `MATCH_RECOGNIZE` 函数允许数据库程序员编写脚本，以识别信用卡上符合此模式的交易序列，并自动封锁卡或向信用卡公司发出警告。随着时间的推移，随着更多的异常交易被识别（例如通过客户报告欺诈交易），识别异常交易的规则集会不断扩大，以处理这些新实例。


    基于规则的异常检测的主要缺点是，以这种方式定义规则意味着异常事件只有在它们发生并引起公司注意后才能被识别。理想情况下，大多数组织希望在异常首次发生或在已发生但尚未被报告时识别出它们。在某些方面，异常检测是聚类的反面：聚类的目标是识别相似实例的组，而异常检测的目标是找到与数据集中其余数据不同的实例。根据这种直觉，聚类也可以用于自动识别异常。使用聚类进行异常检测有两种方法：第一是正常数据将聚在一起，而异常记录将位于单独的聚类中。包含异常记录的聚类很小，因此将与包含主体记录的大型聚类明显区别开。第二种方法是测量每个实例与聚类中心之间的距离。实例离聚类中心越远，就越可能是异常，因此越需要调查。


    '
