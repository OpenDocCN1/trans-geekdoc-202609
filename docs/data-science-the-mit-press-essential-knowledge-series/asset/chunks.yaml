    概率论和统计学的发展持续到 20 世纪。卡尔·皮尔逊（Karl Pearson）开发了现代假设检验，而 R. A. 费舍（R. A. Fisher）开发了用于`multivariate
    analysis`的统计方法，并将`maximum likelihood estimate`的思想引入统计推断，将其作为一种基于事件相对概率得出结论的方法。艾伦·图灵（Alan
    Turing）在第二次大战期间的工作导致了电子计算机的发明，这对统计学产生了巨大影响，因为它使得更复杂的统计计算成为可能。在 20  40 年及后的几十年里，开发了许多在数据科学中仍被广泛的重要计算模型。1943
    年，沃伦·麦卡洛（Warren McCulloch）和沃尔特·皮茨斯（Walter Pitts）提出了第一个`neural network`数学模型。1948
    年，克劳德·香农（Claude Shannon）发表了《通信的数学理论》，并此创立了`information theory`。1951 年，伊芙林·菲克斯（Evelyn
    Fix）和约瑟夫·霍奇斯（Joseph Hodges）提出了一个`discriminatory analysis`模型。这些战后的发展在 1956 年于达特茅斯学院的一次研会上达到了顶峰，创立了`artificial
    intelligence`领域。即使在人工智能发展的早期，`machine learning`术语也开始用于描述赋予计算机从数据中学习能力的程序。20 世纪
    60 年代中期，机器学习做出了三项重要贡献。1965 年，尼尔斯·尼尔松（Nils Nilsson）的著作《Learning Machines》展示了神经网络如何用于学习`classification`的`linear
    models`。下一年，即 1966 年，埃尔·B. 亨特（Earl B. Hunt）、珍特·马林（Janet Marin）和菲利普·J. 斯通（Philip
    J. Stone）开发了学习系统框架，这是自上而下方式从数据中学习的重要的机器学习算法家族的先驱。同一时期，许多独立研究人员开发并发布了`k-means`聚类算法，该算法现在是用于`customer
    segmentation`的标准算法。


    机器学习领域处于现代数据科学的核心，因为它提供了能够自动分析大型数据集以提取潜在有趣有用模式的算法。机器学习一直发展和创新直到今天。一些最重要的进展包括`ensemble
    models`（即使用一组模型对每个查询进行投票做出预测），以及`deep-learning neural networks`，这些神经网络具有多个（即超过三层）处理输入属性的神经元，这些网络中的更深层能够学习跨输入属性的复杂表示。由于其学习复杂属性的能力，深度学习网络特别适用于高维数据，并改变了包括`machine
    vision`和`natural language processing`在内的许多领域。正如我们在回顾数据库历史时讨论的，20 世纪 70 年代标志着现代数据库技术的开始，埃德加·F.
    柯德（Edgar F. Codd）的关系数据模型以及随后数据生成和存储的爆炸导致了 90 年代`data warehousing`的发展，以及更近期的大数据现象。然而，在大数据出现很久以前，事实上在
    20 世纪 80 年代末和 90 年代初，专门针对这些大型数据集分析的研究领域的需求是显而易见的。正是在这段时间，`data mining`术语开始出现在数据库社区。正如我们已经讨论过的，对这种需求的反应是开发数据仓库。然而，其他数据库研究人员通过与其他研究领域接触做出回应，1989
    年，格雷高里·皮亚捷斯基-沙普罗（Gregory Piatetsky-Shapiro）组织了第一次`knowledge discovery in databases`（KDD）研讨会。第一次
    KDD 研讨会的公告完美地总结了针对分析大型数据库的多学科方法：


    > 数据库发现带来了许多有趣的问题，特别是当数据库很大时。此类数据库通常伴随着大量的领域知识，这可以显著促进发现。访问大型数据库是昂贵的——因此需要采样和其他统计方法。最后，数据库发现可以受益于来自专家系统、机器学习、智能数据库、知识获取和统计学等多个领域的可用工具和技术。¹


    事实上，`knowledge discovery in databases` 和`data mining` 描述的是同一个概念，区别在于数据挖掘在商业领域更流行，而
    KDD 在学术界更流行。今天，这些术语经常互换使用，²](#c11140_001.xhtml#FN2)，许多顶级学术会议都同时使用两者。事实上，该领域的顶级学术会议是知识发现与数据挖掘国际会议。


    ### 数据科学的兴与演变


    `data science` 术语在 20 世纪 90 年代末因有关统计学家需要与计算机科学家合作以为大型数据集的计算分析带来数学严谨性的讨论而闻名。1997
    年，吴杰（C. F. Jeff Wu）的公开演讲“统计学 = 数据科学？”强调了统计学的许多前景趋势，包括海量数据库中可用的大型/复杂数据集以及计算算法和模型日益增长的使用。他在结束演讲时呼吁将统计学更名为“数据科学”。


    2001 年，威廉·S. 莱利福德（William S. Cleveland）发布了一项关于在数据科学领域建立大学部门的行动计划（Cleveland 2001）。该计划强调数据科学需要数学与计算机科学之间的伙伴关系。它还强调数据科学需要被理解为一项多学科事业，并且数据科学家需要学习如何与领域专家合作。同年，利奥·布雷曼（Leo
    Breiman）发表了《统计建模：两种文化》（2001）。在这篇文章中，布雷曼将传统的统计学方法描述为一种数据建模文化，这种文化认为数据分析的首要目标是识别（隐藏的）随机数据模型（例如`linear
    regression`），以解释数据是如何生成的。他将这种文化与算法建模文化进行对比，后者侧于使用计算机算法创建准确的预测模型（而不是在数据生成方面具有解释性）。布雷曼将侧重于解释数据的统计模型与侧重于能够准确预测数据的算法模型进行区分，这凸显了统计学家与机器学习研究人员之间的核心差异。这些方法之间的争论在统计学内部仍在进行（例如参见
    Shmueli 2010）。总来说，今天大多数数据科学项目更符合机器学习构建准确预测模型的方法，而较少关注统计学对解释数据的关注。

    '
