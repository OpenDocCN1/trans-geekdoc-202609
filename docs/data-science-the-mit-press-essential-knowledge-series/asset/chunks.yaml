    The last two stages of the CRISP-DM process, evaluation and deployment, are focused
    on how the models fit the business and its processes. The tests run during the
    modeling stage are focused purely on the accuracy of the models for the data set.
    The evaluation phase involves assessing the models in the broader context defined
    by the business needs. Does a model meet the business objectives of the process?
    Is there any business reason why a model is inadequate? At this point in the process,
    it is also useful for the data scientist to do a general quality-assurance review
    on the project activities: Was anything missed? Could anything have been done
    better? Based on the general assessment of the models, the main decision made
    during the evaluation phase is whether any of the models should be deployed in
    the business or another iteration of the CRISP-DM process is required to create
    adequate models. Assuming the evaluation process approves a model or models, the
    project moves into the final stage of the process: deployment. The deployment
    phase involves examining how to deploy the selected models into the business environment.
    This involves planning how to integrate the models into the organization’s technical
    infrastructure and business processes. The best models are the ones that fit smoothly
    into current practices. Models that fit current practices have a natural set of
    users who have a clearly defined problem that the model helps them to solve. Another
    aspect of deployment is putting a plan in place to periodically review the performance
    of the model.


    The outer circle of the CRISP-DM diagram ([figure 4](#c11140_002.xhtml#fig_004))
    highlights how the whole process is iterative. The iterative nature of data science
    projects is perhaps the aspect of these projects that is most often overlooked
    in discussions of data science. After a project has developed and deployed a model,
    the model should be regularly reviewed to check that it still fits the business’s
    needs and that it hasn’t become obsolete. There are many reasons why a data-driven
    model can become obsolete: the business’s needs might have changed; the process
    the model emulates and provides insight into might have changed (for example,
    customer behavior changes, spam email changes, etc.); or the data streams the
    model uses might have changed (for example, a sensor that feeds information into
    a model may have been updated, and the new version of the sensor provides slightly
    different readings, causing the model to be less accurate). The frequency of this
    review is dependent on how quickly the business ecosystem and the data that the
    model uses evolve. Constant monitoring is needed to determine the best time to
    go through the process again. This is what the outer circle of the CRISP-DM process
    shown in [figure 4](#c11140_002.xhtml#fig_004) represents. For example, depending
    on the data, the business question, and the domain, you may have go through this
    iterative process on a yearly, quarterly, monthly, weekly, or even daily basis.
    [Figure 5](#c11140_002.xhtml#fig_005) gives a summary of the different stages
    of the data science project process and the major tasks involved in each phase.


    ![Figure 5 The CRISP-DM stages and tasks (based on figure 3 in Chapman, Clinton,
    Kerber, et al. 1999).](images/11140_002_fig_005.jpg)


    [Figure 5](#c11140_002.xhtml#fig_005a) The CRISP-DM stages and tasks


    ## The CRISP-DM stages and tasks based on [figure 3](#c11140_002.xhtml#fig_003)
    in Chapman, Clinton, Kerber, et al. 1999.


    A frequent mistake that many data scientists make is to rush through the stages.
    However, for a data science project to succeed, data scientist needs a clear understanding
    of the business. With regard to getting data, some software suppliers provide
    solutions that consist of a mixture. A survey in 2016 found that 79 percent of
    their time is spent on:

    - collecting data: 19%

    - cleaning and organizing data: 60%

    - building training sets: 3%

    - mining data: 9%

    - refining algorithms: 5%


    This 79 percent comes from summing the time spent on gathering and preparing data.
    This has been a consistent finding.


    ## A Data Science Ecosystem


    The set of technologies used to do data science varies across organizations. The
    larger the organization or the greater the amount of data being processed or both,
    the greater the complexity of the technology ecosystem. In most cases, this ecosystem
    contains tools and components from a number of different suppliers. There is a
    spectrum of approaches from which an organization can select when developing its
    own data ecosystem. At one end of the spectrum, the organization may decide to
    invest in a commercial integrated tool set. At the other end, it might build up
    a bespoke ecosystem by integrating a set of open-source tools and languages. In
    these two extremes, some software suppliers provide solutions that consist of
    a mixture of commercial and open-source products. However, although the particular
    mix of tools will vary from one organization to the next, there is a commonality
    in terms of the components that are present in data science architectures.


    [Figure 6](#c11140_003.xhtml#fig_006) gives a high-level overview of a typical
    data architecture. This architecture is not just for big-data environments, but
    for data environments of all sizes. In this diagram, the three main areas consist
    of:

    - data sources: where all the data in an organization are generated;

    - data storage: where the data are stored and processed;

    - applications: where the data are shared with consumers of these data.


    ![Figure 6 A typical small-data and big-data architecture for data science (inspired
    by a figure from the Hortonworks newsletter, April 23, 2013, https://hortonworks.com/blog/hadoop-and-the-data-warehouse-when-to-use-check).](images/11140_003_fig_006.jpg)

