    The last myth about data science we want to mention here is the belief that data
    science pays for itself quickly. The truth of this belief depends on the context
    of the organization. Adopting data science can require significant investment
    in terms of developing data infrastructure and hiring staff with data science
    expertise. Furthermore, data science will not give positive results on every project.
    Sometimes there is no hidden gem of insight in the data, and sometimes the organization
    is not in a position to act on the insight the analysis has revealed. However,
    in contexts where there is a well-understood business problem and the appropriate
    data and human expertise are available, then data science can (often) provide
    the actionable insight that gives an organization the competitive advantage it
    needs to succeed.


    # 2 What Are Data, and What Is a Data Set?


    As its name suggests, data science is fundamentally dependent on data. In its
    most basic form, a datum or a piece of information is an abstraction of a real-world
    entity (person, object, or event). The terms `variable`, `feature`, and `attribute`
    are often used interchangeably to denote an individual abstraction. Each entity
    is typically described by a number of attributes. For example, a book might have
    the following attributes: author, title, topic, genre, publisher, price, date
    published, word count, number of chapters, number of pages, edition, ISBN, and
    so on.


    A data set consists of the data relating to a collection of entities, with each
    entity described in terms of a set of attributes. In its most basic form,[¹](#c11140_002.xhtml#FN8)
    a data set is organized in an `n * m` data matrix called the `analytics record`,
    where `n` is the number of entities (rows) and `m` is the number of attributes
    (columns). In data science, the terms `data set` and `analytics record` are often
    used interchangeably, with the analytics record being a particular representation
    of a data set. [Table 1](#c11140_002.xhtml#T1) illustrates an analytics record
    for a data set of classic books. Each row in the table describes one book. The
    terms `instance`, `example`, `entity`, `object`, `case`, `individual`, and `record`
    are used in data science literature to refer to a row. So a data set contains
    a set of instances, and each instance is described by a set of attributes.


    ![Table 1 A Data Set of Classic Books](images/11140_002_T1.png)


    [Table 1](#c11140_002.xhtml#T1a) A Data Set of Classic Books


    The construction of the analytics record is a prerequisite of doing data science.
    In fact, the majority of the time and effort in data science projects is spent
    on creating, cleaning, and updating the analytics record. The analytics record
    is often constructed by merging information from many different sources: data
    may have to be extracted from multiple databases, data warehouses, or computer
    files in different formats (e.g., spreadsheets or `csv` files) or scraped from
    the web or social media streams.


    Four books are listed in the data set in [table 1](#c11140_002.xhtml#T1). Excluding
    the `ID` attribute—which is simply a label for each row and hence is not useful
    for analysis—each book is described using six attributes: title, author, year,
    cover, edition, and price. We could have included many more attributes for each
    book, but, as is typical of data science projects, we needed to make a choice
    when we were designing the data set. In this instance, we were constrained by
    the size of the page and the number of attributes we could fit onto it. In most
    data science projects, however, the constraints relate to what attributes we can
    actually gather and what attributes we believe, based on our domain knowledge,
    are relevant to the problem we are trying to solve. Including extra attributes
    in a data set does not come without cost. First, there is the extra time and effort
    in collecting and quality checking the attribute information for each instance
    in the data set and integrating these data into the analytics record. Second,
    including irrelevant or redundant attributes can have a negative effect on the
    performance of many of the algorithms used to analyze data. Including many attributes
    in a data set increases the probability that an algorithm will find irrelevant
    or spurious patterns in the data that appear to be statistically significant only
    because of the particular sample of instances in the data set. The problem of
    how to choose the correct attribute(s) is a challenge faced by all data science
    projects, and sometimes it comes down to an iterative process of trial-and-error
    experiments where each iteration checks the results achieved using different subsets
    of attributes.


    There are many different types of attributes, and for each attribute type different
    sorts of analysis are appropriate. So understanding and recognizing different
    attribute types is a fundamental skill for a data scientist. The standard types
    are `numeric`, `nominal`, and `ordinal`. Numeric attributes describe measurable
    quantities that are represented using integer or real values. Numeric attributes
    can be measured on either an `interval scale` or a `ratio scale`. Interval attributes
    are measured on a scale with a fixed but arbitrary interval and arbitrary origin—for
    example, date and time measurements. It is appropriate to apply ordering and subtraction
    operations to interval attributes, but other arithmetic operations (such as multiplication
    and division) are not appropriate. Ratio scales are similar to interval scales,
    but the scale of measurement possesses a true-zero origin. A value of zero indicates
    that none of the quantity is being measured. A consequence of a ratio scale having
    a true-zero origin is that we can describe a value on a ratio scale as being a
    multiple (or ratio) of another value. Temperature is a useful example for distinguishing
    between interval and ratio scales.[²](#c11140_002.xhtml#FN9) A temperature measurement
    on the Celsius or Fahrenheit scale is an interval measurement because 0 value
    on either of these scales does not indicate zero heat. So although we can compute
    differences between temperatures on these scales and compare these differences,
    we cannot say that 20° Celsius is twice as warm as 10° Celsius. By contrast, a
    temperature measurement in Kelvins is on a ratio scale because 0 K (absolute zero)
    is the temperature at which thermal motion ceases. Other common examples of ratio-scale
    measurements include money quantities, weight, height, and marks on an exam paper
    (scale 0–100). In [table 1](#c11140_002.xhtml#T1), the `year` attribute is an
    example of an interval-scale attribute, and the `price` attribute is an example
    of a ratio-scale attribute.


    Nominal (also known as categorical) attributes take values from a finite set.
    These values are names (hence “nominal”) for categories, classes, or states of
    things. Examples of nominal attributes include marital status (single, married,
    divorced) and beer type (ale, pale ale, pils, porter, stout, etc.). A binary attribute
    is a special case of a nominal attribute where the set of possible values is restricted
    to just two values. For example, we might have the binary attribute `spam`, which
    describes whether an email is spam (true) or not spam (false), or the binary attribute
    `smoker`, which describes whether an individual is a smoker (true) or not (false).
    Nominal attributes cannot have ordering or arithmetic operations applied to them.
    Note that a nominal attribute may be sorted alphabetically, but alphabetizing
    is a distinct operation from ordering. In [table 1](#c11140_002.xhtml#T1), `author`
    and `title` are examples of nominal attributes.


    ## Notes

