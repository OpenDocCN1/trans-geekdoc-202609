    branch descends from each node for each value in the domain of the attribute tested
    at the node. Numeric attributes, however, have an infinite number of values in
    their domains, with the implication that a tree would need an infinite number
    of branches. One solution to this problem is to transform numeric attributes into
    ordinal attributes, although doing so requires the definition of appropriate thresholds,
    which can also be difficult.


    Finally, because a decision-tree-learning algorithm repeatedly divides a data
    set as a tree becomes large, it becomes more sensitive to noise (such as mislabeled
    instances). The subset of examples on each branch becomes smaller, and so the
    data sample each classification rule is based on becomes smaller. The smaller
    the data sample used to define a classification rule, the more sensitive to noise
    the rule becomes. As a consequence, it is a good idea to keep decision trees shallow.
    One approach is to stop the growth of a branch when the number of instances on
    the branch is still less than a predefined threshold (e.g., 20 instances). Other
    approaches allow the tree to grow and then prune the tree back. These approaches
    typically use statistical tests or the performance of the model on a set of instances
    specifically chosen for this task to identify splits near the bottom of the tree
    that should be removed.


    ## Bias in Data Science


    The goal of ML is to create models that encode appropriate generalizations from
    data sets. Two major factors contribute to the generalization (or model) that
    an ML algorithm will generate from a data set. The first is the data set the algorithm
    is run on. If the data set is not representative of the population, then the model
    the algorithm generates won’t be accurate. For example, earlier we developed a
    regression model that predicted the likelihood that an individual will develop
    Type 2 diabetes based on his BMI. This model was generated from a data set of
    American white males. As a consequence, this model is unlikely to be accurate
    if used to predict the likelihood of diabetes for females or for males of different
    race or ethnic backgrounds. The term `sample bias` describes how the process used
    to select a data set can introduce biases into later analysis, be it a statistical
    analysis or the generation of predictive models using ML.

    '
