    Ordinal attributes are similar to nominal attributes, with the difference that
    it is possible to apply a rank order over the categories of ordinal attributes.
    For example, an attribute describing the response to a survey question might take
    values from the domain “strongly dislike, dislike, neutral, like, and strongly
    like.” There is a natural ordering over these values from “strongly dislike” to
    “strongly like” (or vice versa depending on the convention being used). However,
    an important feature of ordinal data is that there is no notion of equal distance
    between these values. For example, the cognitive distance between “dislike” and
    “neutral” may be different from the distance between “like” and “strongly like.”
    As a result, it is not appropriate to apply arithmetic operations (such as averaging)
    on ordinal attributes. In [table 1](#c11140_002.xhtml#T1), the “edition” attribute
    is an example of an ordinal attribute. The distinction between nominal and ordinal
    data is not always clear-cut. For example, consider an attribute that describes
    the weather and that can take the values “sunny,” “rainy,” “overcast.” One person
    might view this attribute as being nominal, with no natural order over the values,
    whereas another person might argue that the attribute is ordinal, with “overcast”
    being treated as an intermediate value between “sunny” and “rainy” (Hall, Witten,
    and Frank 2011).


    The data type of an attribute (numeric, ordinal, nominal) affects the methods
    we can use to analyze and understand the data, including both the basic statistics
    we can use to describe the distribution of values that an attribute takes and
    the more complex algorithms we use to identify the patterns of relationships between
    attributes. At the most basic level of analysis, numeric attributes allow arithmetic
    operations, and the typical statistical analysis applied to numeric attributes
    is to measure the central tendency (using the mean value of the attribute) and
    the dispersion of the attributes values (using the variance or standard deviation
    statistics). However, it does not make sense to apply arithmetic operations to
    nominal or ordinal attributes. So the basic analysis of these types of attributes
    involves counting the number of times each of the values occurs in the data set
    or calculating the proportion of occurrence of each value or both.


    Data are generated through a process of abstraction, so any data are the result
    of human decisions and choices. For every abstraction, somebody (or some set of
    people) will have made choices with regard to what to abstract from and what categories
    or measurements to use in the abstracted representation. The implication is that
    data are never an objective description of the world. They are instead always
    partial and biased. As Alfred Korzybski has observed, “A map is not the territory
    it represents, but, if correct, it has a similar structure to the territory which
    accounts for its usefulness” (1996, 58).


    In other words, the data we use for data science are not a perfect representation
    of the real-world entities and processes we are trying to understand, but if we
    are careful in how we design and gather the data that we use, then the results
    of our analysis will provide useful insights into our real-world problems. The
    moneyball story given in chapter 1 is a great example of how the determinant of
    success in many data science projects is figuring out the correct abstractions
    (attributes) to use for a given domain. Recall that the key to the moneyball story
    was that the Oakland A’s figured out that a player’s on-base percentage and slugging
    percentage are better attributes to use to predict a player’s offensive success
    than traditional baseball statistics such as batting average. Using different
    attributes to describe players gave the Oakland A’s a different and better model
    of baseball than the other teams had, which enabled it to identify undervalued
    players and to compete with larger franchises using a smaller budget.


    The moneyball story illustrates that the old computer science adage “garbage in,
    garbage out” is true for data science: if the inputs to a computational process
    are incorrect, then the outputs from the process will be incorrect. Indeed, two
    characteristics of data science cannot be overemphasized: (*a*) for data science
    to be successful, we need to pay a great deal of attention to how we create our
    data (in terms of both the choices we make in designing the data abstractions
    and the quality of the data captured by our abstraction processes), and (*b*)
    we also need to “sense check” the results of a data science process—that is, we
    need to understand that just because the computer identifies a pattern in the
    data this doesn’t mean that it is identifying a real insight in the processes
    we are trying to analyze; the pattern may simply be based on the biases in our
    data design and capture.


    ## Perspectives on Data


    Other than type of data (numeric, nominal, and ordinal), a number of other useful
    distinctions can be made regarding data. One such distinction is between `structured`
    and `unstructured` data. Structured data are data that can be stored in a table,
    and every instance in the table has the same structure (i.e., set of attributes).
    As an example, consider the demographic data for a population, where each row
    in the table describes one person and consists of the same set of demographic
    attributes (name, age, date of birth, address, gender, education level, job status,
    etc.). Structured data can be easily stored, organized, searched, reordered, and
    merged with other structured data. It is relatively easy to apply data science
    to structured data because, by definition, it is already in a format that is suitable
    for integration into an analytics record. `Unstructured data` are data where each
    instance in the data set may have its own internal structure, and this structure
    is not necessarily the same in every instance. For example, imagine a data set
    of webpages, with each webpage having a structure but this structure differing
    from one webpage to another. Unstructured data are much more common than structured
    data. For example, collections of human text (emails, tweets, text messages, posts,
    novels, etc.) can be considered unstructured data, as can collections of sound,
    image, music, video, and multimedia files. The variation in the structure between
    the different elements means that it is difficult to analyze unstructured data
    in its raw form. We can often extract structured data from unstructured data using
    techniques from artificial intelligence (such as natural-language processing and
    ML), digital signal processing, and computer vision. However, implementing and
    testing these data-transformation processes is expensive and time-consuming and
    can add significant financial overhead and time delays to a data science project.

