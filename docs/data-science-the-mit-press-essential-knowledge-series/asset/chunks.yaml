    所有组织都拥有应用程序，用于生成和捕获有关客户、交易以及与组织运营相关的一切运营数据。这些数据源和应用程序包括客户管理、订单、制造、交付、发票、银行、财务、客户关系管理（CRM）、呼叫中心、企业资源计划（ERP）应用程序等。这类应用程序通常被称为`online
    transaction processing`（OLTP）系统。对于许多数据科学项目，来自这些应用程序的数据将用于形成机器学习算法的初始输入数据集。随着时间的推移，组织内各种应用程序捕获的数据量变得越来越大，组织将开始扩展范围以捕获以前被忽略、此前未捕获或此前不可用的数据。这些较新的数据通常被称为“大数据源”，因为其捕获的数据量远高于组织的主要运营应用程序。一些常见的大数据源包括网络流量、各种应用程序的日志数据、传感器数据、网络日志数据、社交媒体数据、网站数据等。在传统数据源中，数据通常存储在数据库中。然而，由于与许多新大数据源相关的应用程序并非首要为了长期存储数据而设计的（例如，流式数据），这类数据的存储格式和结构随应用程序而异。


    随着数据源数量的增加，将这些数据用于分析以及在整个组织范围内共享的挑战也随之增加。图 6 所示的数据存储层通常用于解决组织的数据共享和数据分析问题。该层分为两个部分。第一部分涵盖大多数组织使用的典型数据共享软件。最流行的传统数据集成和存储软件是关系型数据库管理系统（RDBMS）。这些传统系统通常是组织内部业务智能（BI）解决方案的骨干。BI
    解决方案是一种用户友决策支持系统，提供数据聚合、集成、报告以及分析功能。根据 BI 架构的成熟程度，它可能包含从运营应用程序的基本副本到`operational
    data store`（ODS），再到`massively parallel processing`（MPP）BI 数据库解决方案和数据仓库的任何内容。


    数据仓库最好被理解为以支持决策为的数据聚合和分析过程。然而，这一过程的重点是创建一个设计良好的集中的数据存储，“data warehouse”一词有时用于指示这种数据仓库。从这个意义上说，数据仓库是数据科学的一项强大资源。从数据科学的角度来看，拥有数据仓库的一个主要优势是大大缩短了项目周期。任何数据科学过程的关键要素都是数据，因此在许多数据科学项目中，大部分的时间和精力都花在了分析之前的寻找、聚合和清洗数据上。如果公司有一个可用的数据仓库，那么单个数据科学项目在数据准备上的投入精力和时间通常会减少。然而，没有集中的数据仓库也可以进行数据科学。构建集中的数据仓库不仅仅是将多个运营数据库的数据简单地储到一个数据库中。


    合并来自多个数据库的数据通常需要大量的人工工作来解决源数据库之间的不一致问题。`Extraction, transformation, and load`（ETL）用于描述支持数据库之间映射、合并和移动数据的典型过程和工具。数据仓库中执行的典型操作与通常应用于标准关系数据模型数据库的简单操作不同。`online
    analytical processing`（OLAP）一词用于描述这些操作。OLAP 操作通常聚焦于生成历史数据的摘要，并涉及从多个源聚合数据。例如，我们可能会提出以下
    OLAP 请求（为了可读性此处用英文表示：“按地区和季度报告所有商店的销售情况，并将这些数字与去年的数字进行比较。”这个例子说明，OLAP 请求的结果通常类似于你看到的标准业务报告。OLAP
    操作本质上允许用户对仓库中的数据进行切片、切块和透视，并获取这些数据的不同视图。它们在构建在数据仓库之上的称为`data cube`的数据表示上。数据立方体有一组固定的、预定义的维度，每个维度代表数据的某个特定特征。对于之前提供的示例
    OLAP 请求，所需的数据立方体维度为`sales by stores`、`sales by region` 和 `sales by quarter`。使用具有固定维度集的数据立方体的主要优势是加快了
    OLAP 操作的响应时间。此外，由于数据立方体维度集被预编程到 OLAP 系统中，系统可以提供用户友好的图形界面来定义 OLAP 请求。然而，数据立方体的表示也限制了使用
    OLAP 进行的分析类型，仅限于使用预定义维度生成的查询。相比之下，SQL 提供了更灵活的查询接口。此外，尽管 OLAP 系统有助于数据探索和报告，但它们无法实现数据建模或从数据中自动提取模式。一旦跨整个组织的数据在
    BI 系统中完成聚合和分析，这些分析就可以作为输入提供给图 6 应用程序层中的范围消费者。


    '
