    This rule indicates that customers who are buying `hot dogs` and `ketchup` are
    also likely to buy `beer`. A frequent example of the power of association-rule
    mining is the `beer-diapers` example that describes how an unknown US supermarket
    in the 1980s used an early computer system to analyze its checkout data and identified
    an unusual association between diapers and beer in customer purchases. The theory
    developed to understand this rule was that families with young children were preparing
    for the weekend and knew that they would need diapers and would have to socialize
    at home. The store placed the two items near each other, and sales soared. The
    beer-and-diapers story story has been debunked as apocryphal, but it is still
    a useful example of the potential benefits of association-rule mining for retail
    businesses.


    Two main statistical measures are linked with association rules: `support` and
    `confidence`. The `support` percentage of an association rule—or the ratio of
    transactions that include both the antecedent and consequent to the total number
    of transactions—indicates how frequently the items in the rule occur together.
    The `confidence` percentage of an association rule—or the ratio of the number
    of transactions that include both the antecedent and consequent to the number
    of transactions that includes the antecedent—is the conditional probability that
    the consequent will occur given the occurrence of the antecedent. So, for example,
    a confidence of 75 percent for the association rule relating `hot dogs` and `ketchup`
    with `beer` would indicate that in 75 percent of cases where customers purchased
    both `hot` `dogs` and `ketchup`, they also purchased `beer`. The `support` score
    of a rule simply records the percentage of baskets in the data set where the rule
    holds. For example, a support of 5 percent indicates that 5 percent of all the
    baskets in the data set contain all three items in the rule “hot dogs`, `ketchup`,
    and `beer`.”


    Even a small data set can result in the generation of a large number of association
    rules. In order to control the complexity of the analysis of these rules, it is
    usual to prune the generated rule set to include only rules that have both a high
    support and a high confidence. Rules that don’t have high support or confidence
    are not interesting either because the rule covers only a very small percentage
    of baskets (low support) or because the relationship between the items in the
    antecedent and the consequent is low (low confidence). Rules that are trivial
    or inexplicable should also be pruned. Trivial rules represent associations that
    are obvious and well known to anyone who understands the business domain. An inexplicable
    rule represents associations that are so strange that it is difficult to understand
    how to convert the rule into a useful action for the company. It is likely that
    an inexplicable rule is the result of an odd data sample (i.e., the rule represents
    a spurious correlation). Once the rule set has been pruned, the data scientist
    can then analyze the remaining rules to understand what products are associated
    with each other and apply this new information in the organization. Organizations
    will typically use this new information to determine store layout or to perform
    some targeted marketing campaigns to their customers. These campaigns can involve
    updates to their websites to include recommended products, in-store advertisements,
    direct mailings, the cross-selling of other products by check-out staff, and so
    on.


    Association mining becomes more powerful if the baskets of items are connected
    to demographic data about the customer. This is why so many retailers run loyalty-card
    schemes because such schemes allow them not only to connect different baskets
    of goods to the same customer through time but also to connect baskets of goods
    to the customer’s demographics. Including this demographic information in the
    association analysis enables the analysis to be focused on particular demographics,
    which can further help marketing and targeted advertising. For example, demographic-based
    association rules can be used with new customers, for whom the company has no
    buying-habit information but does have demographic information. An example of
    an association rule augmented with demographic information might be


    IF gender(male) and age(< 35) and {hot-dogs, ketchup}, THEN {beer}.


    Support = 2%, Confidence = 90%




    The standard application area for association-rule mining focuses on what products
    are in the shopping basket and what products are not in the shopping basket. This
    assumes that the products are purchased in one visit to the store or website.
    This kind of scenario will probably work in most retail and other related scenarios.
    However, association-rule mining is also useful in a range of domains outside
    of retail. For example, in the telecommunications industry, applying association-rule
    mining to customer usage helps telecommunications companies to design how to bundle
    different services together into packages. In the insurance industry, association-rule
    mining is used to see if there are associations between products and claims. In
    the medical domain, it is used to check if there are interactions between existing
    and new treatments and medicines. And in banking and financial services, it is
    used to see what products customers typically have and whether these products
    can be applied to new or existing customers. Association-rule mining can also
    be used to analyze purchasing behavior over a period of time. For example, customers
    tend to buy product `X` and `Y` today, and in three months’ time they buy product
    `Z`. This time period can be considered a shopping basket, although it is one
    that spans three months. Applying association-rule mining to this kind of temporally
    defined basket expands the applications areas of association-rule mining to include
    maintenance schedules, the replacement of parts, service calls, financial products,
    and so on.


    ### Churn or No Churn, That Is the Question (Classification)


    A standard business task in customer-relationship management is to estimate the
    likelihood that an individual customer will take an action. The term `propensity
    modeling` is used to describe this task because the goal is to model an individual’s
    propensity to do something. This action could be anything from responding to marketing
    to defaulting on a loan or leaving a service. The ability to identify customers
    who are likely to leave a service is particularly important to cell phone service
    companies. It costs a cell phone service company a substantial amount of money
    to attract new customers. In fact, it is estimated that it generally costs five
    to six times more to attract a new customer than it does to retain an established
    one (Verbeke et al. 2011). As a result, many cell phone service companies are
    very keen to retain their current customers. However, they also want to minimize
    costs. So although it would be easy to retain customers by simply giving all customers
    reduced rates and great phone upgrades, this is not a realistic option. Instead,
    they want to target the offers they give their customers to just those customers
    who are likely to leave in the near future. If they can identify a customer who
    is about to leave a service and persuade that customer to stay, perhaps by offering
    her an upgrade or a new billing package, then they can save the difference between
    the price of the enticement they gave the customer and the cost of attracting
    a new customer.

    '
  trans: '

    这条规则表明，购买`hot dogs`（热狗）和`ketchup`（ ketchup）的客户也可能购买`beer`（啤酒）。关联规则挖掘威力的一个经典例子是`啤酒-尿布`案例，它描述了
    20 世纪 80 年代美国某无名超市如何利用早期的计算机系统分析其结账数据，并发现客户购买的尿布和啤酒之间存在一种不常的关联。理解这一规则而开发的理论是：家有幼儿童的家庭正在准备周末，他们知道自己需要尿布，并且会在家里进行社交。商店将这两件物品放在一起，销售额随之飙升。“啤酒与尿布”的故事已被证明是虚构的，但它仍然是关联规则挖掘对零售业务潜在益处的一个有用示例。


    关联规则与两个主要的统计指标相关：`support`（支持度）和`confidence`（置信度）。关联规则的`support` 百分比——即同时包含前件和后件的交易数占总交易数的比例——表示了该规则中的物品共同出现的频率。关联规则的`confidence`
    百分比——即同时包含前件和后件的交易数占包含前件的交易数的比例——是在给定前件发生的情况下，后件发生的条件概率。例如，对于与`hot dogs`、`ketchup`和`beer`相关的关联规则，75%的置信度意味着在客户同时购买了`hot`
    `dogs`和`ketchup`的 75%的案例中，他们也购买了`beer`。规则的`support`得分简单地记录了数据集中符合该规则篮子占的百分比。例如，5%的支持度表示数据集中所有篮子中有
    5%包含了“`hot dogs`、`ketchup`和`beer`”中的所有三件物品。


    即使是较小的数据集也可以产生大量的关联规则。为了控制这些规则分析的复杂性，通常会对生成的规则集进行剪枝，只保留同时具有高支持度和高置信度的规则。没有高支持度或高置信度的规则也没有意义，因为这些规则仅涵盖了极小比例的篮子（低支持度），或者因为前件与后件之间物品之间的关系很低（低置信度）。平庸或无法解释的规则也应该被剪枝。平庸的规则代表了对于任何理解业务领域的人来说显而易见且为人知的关联。无法解释的规则代表的关联非常奇怪，难以以理解如何将该规则转化为公司有用的行动。无法解释的规则可能是奇特数据样本的结果（即该规则代表了虚假相关）。一旦规则集完成剪枝，数据科学家就可以分析剩余规则，以理解哪些产品之间相互关联，并将这些新信息应用于组织中。组织通常会利用这些新信息来确定商店布局，或对客户进行某些针对性的营销活动。这些活动可能包括更新网站以包含推荐产品、店内广告、直邮、结账人员对其他产品的交叉销售等。


    如果将物品篮子与客户的人口统计数据联系起来，关联挖掘将变得更加强大。这就是为什么许多零售商运行忠诚卡计划，因为此类计划不仅让他们能够通过时间将不同的商品篮子与同一个客户，还能将商品篮子与客户的人口统计数据连接起来。在关联分析中包含这些人口统计信息可以使分析关注特定的人口特征，从而进一步帮助营销和定向广告。例如，基于人口统计的关联规则可以用于新客户，公司对这些客户没有购买习惯信息，但拥有人口统计信息。带有人口统计信息的增强关联规则示例可能是：


    IF gender(male) and age(< 35) and {hot-dogs, ketchup}, THEN {beer}.


    Support = 2%, Confidence = 90%




    关联规则挖掘的标准应用领域集中于购物篮中有哪些产品，这假设产品是在单次访问商店或网站时购买的。这种场景可能适用于零售和其他相关场景。然而，关联规则挖掘在零售之外的多个领域也有用。例如，在电信行业，将关联规则应用于客户使用有助于电信公司设计如何将不同的服务捆成包。在保险行业，关联规则被用于查看产品与理赔之间是否存在关联。在医学领域，它用于检查现有治疗方案与药物之间是否存在相互。而在银行和金融服务领域，它用于查看客户拥有哪些产品，以及这些产品是否适用。关联规则还可以用于分析一段时间内的购买行为。例如，客户倾向于购买产品`X`和`Y`，三个月后购买产品`Z`。这个时间段可以被视为一个篮子，尽管它是跨越三个月的。将关联规则应用于这种时间定义的篮子，可以将关联规则的应用领域扩展到维护计划、零件更换、服务电话、金融产品等。


    ### 流失还是不流失，这是一个问题（分类）


    客户关系管理中的一项标准业务任务是估计单个客户采取某种行动的概率。`propensity modeling`（倾向建模）一词被描述这项任务，因为目标是对个人采取某事的倾向建模。这种行动可以是从响应营销到贷款违约或离开服务的任何行为。识别可能流失服务的客户对于手机公司来说尤为重要。吸引新客户需要手机公司花费巨资。事实上，据估计，吸引新客户的成本通常是留住现有客户的五到六倍（Verbeke
    et al. 2011）。因此，许多手机公司非常渴望留住现有客户。

    '
