- raw: "    These profiles are constructed by integrating data from a number of different\
    \ noisy and partial data sources, so the profiles can often be misleading about\
    \ an individual. What is worse is that these marketing profiles are treated as\
    \ products and are often sold to other companies, with the result that a negative\
    \ marketing assessment of an individual can follow that individual across many\
    \ domains. We have already discussed the use of marketing data sets in insurance\
    \ underwriting (Batty, Tripathi, Kroll, et al. 2010), but these profiles can also\
    \ make their way into credit-risk assessments and many other decision processes\
    \ that affect people’s lives. Two aspects of these marketing profiles make them\
    \ particularly problematic. First, they are a black box, and, second, they are\
    \ persistent. The black-box nature of these profiles is apparent when one considers\
    \ that it is difficult for an individual to know what data are recorded about\
    \ them, where and when the data were recorded, and how the decision processes\
    \ that use these data work. As a result, if an individual ends up on a no-fly\
    \ list or a credit blacklist, it is “difficult to determine the grounds for discrimination\
    \ and to challenge them” (Kitchin 2014a, 177). What is more, in the modern world\
    \ data are often stored for a long time. So data recorded about an event in an\
    \ individual’s life persists long after an event. As Turow warns, “Turning individual\
    \ profiles into individual evaluations is what happens when a profile becomes\
    \ a reputation” (2013, 6).\n\n    Furthermore, unless used very carefully, data\
    \ science can actually perpetuate and reinforce prejudice. An argument is sometimes\
    \ made that data science is objective: it is based on numbers, so it doesn’t encode\
    \ or have the prejudicial views that affect human decisions. The truth is that\
    \ data science algorithms perform in an amoral manner more than in an objective\
    \ manner. Data science extracts patterns in data; however, if the data encode\
    \ a prejudicial relationship in society, then the algorithm is likely to identify\
    \ this pattern and base its outputs on the pattern. Indeed, the more consistent\
    \ a prejudice is in a society, the stronger that prejudicial pattern will appear\
    \ in the data about that society, and the more likely a data science algorithm\
    \ will extract and replicate that pattern of prejudice. For example, a study carried\
    \ out by academic researchers on the Google Online Advertising system found that\
    \ the system showed an ad relating to a high-paying job more frequently to participants\
    \ whose Google profile identified them as male compared to participants whose\
    \ profile identified them as female (Datta, Tschantz, and Datta 2015).\n\n   \
    \ The fact that data science algorithms can reinforce prejudice is particularly\
    \ troublesome when data science is applied to policing. Predictive Policing, or\
    \ PredPol,[⁴](#c11140_006.xhtml#FN28) is a data science tool designed to predict\
    \ when and where a crime is most likely to occur. When deployed in a city, PredPol\
    \ generates a daily report listing a number of hot spots on a map (small areas\
    \ 500 feet by 500 feet) where the system believes crimes are likely to occur and\
    \ tags each hot spot with the police shift during which the system believes the\
    \ crime will occur. Police departments in both the United States and the United\
    \ Kingdom have deployed PredPol. The idea behind this type of intelligent-policing\
    \ system is that policing resources can be efficiently deployed. On the surface,\
    \ this seems like a sensible application of data science, potentially resulting\
    \ in efficient targeting of crime and reducing policing costs. However, questions\
    \ have been raised about the accuracy of PredPol and the effectiveness of similar\
    \ predictive-policing initiatives (Hunt, Saunders, and Hollywood 2014; Oakland\
    \ Privacy Working Group 2015; Harkness 2016). The potential for these types of\
    \ systems to encode racial or class-based profiling in policing has also been\
    \ noted (Baldridge 2015). The deployment of police resources based on historic\
    \ data can result in a higher police presence in certain areas—typically economically\
    \ disadvantaged areas—which in turn results in higher levels of reported crime\
    \ in these areas. In other words, the prediction of crime becomes a self-fulfilling\
    \ prophesy. The result of this cycle is that some locations will be disproportionately\
    \ targeted by police surveillance, causing a breakdown in trust between the people\
    \ who live in those communities and policing institutions (Harkness 2016).\n\n\
    \    Another example of data-driven policing is the Strategic Subjects List (SSL)\
    \ used by the Chicago Police Department in an attempt to reduce gun crime. The\
    \ list was first created in 2013, and at that time it listed 426 people who were\
    \ estimated to be at a very high risk of gun violence. In an attempt to proactively\
    \ prevent gun crime, the Chicago Police Department contacted all the people on\
    \ the SSL to warn them that they were under surveillance. Some of the people on\
    \ the list were very surprised to be included on it because although they did\
    \ have criminal records for minor offenses, they had no violence on their records\
    \ (Gorner 2013). One question to ask about this type of data gathering to prevent\
    \ crime is, How accurate is the technology? A recent study found that the people\
    \ on the SSL for 2013 were “not more or less likely to become a victim of a homicide\
    \ or shooting than the comparison group” (Saunders, Hunt, and Hollywood 2016).\
    \ However, this study also found that individuals on the list were more likely\
    \ to be arrested for a shooting incident, although it did point out that this\
    \ greater likelihood could have been created by the fact that these individuals\
    \ were on the list, which resulted in increasing police officers’ awareness of\
    \ these individuals (Saunders, Hunt, and Hollywood 2016). Responding to this study,\
    \ the Chicago Police Department stated that it regularly updated the algorithm\
    \ used to compile the SSL and that the effectiveness of the SSL had improved since\
    \ 2013 (Rhee 2016). Another question about data-driven crime-prevention lists\
    \ is, How does an individual end up on the list? The 2013 version of the SSL appears\
    \ to have been compiled using, among other attributes of an individual, an analysis\
    \ of his or her social network, including the arrest and shooting histories of\
    \ his or her acquaintances (Dokoupil 2013; Gorner 2013). On the one hand, the\
    \ idea of using social network analysis makes sense, but it opens up the very\
    \ real problem of guilt by association. One problem with this type of approach\
    \ is that it can be difficult to define precisely what an association between\
    \ two individuals entails. Is living on the same street enough to be an association?\
    \ Furthermore, in the United States, where the vast majority of inmates in prison\
    \ are African American and Latino males, allowing predictive-policing algorithms\
    \ to use the concept of association as an input is likely to result in predictions\
    \ targeting mainly young men of color (Baldridge 2015).\n\n    The anticipatory\
    \ nature of predictive policing means that individuals may be treated differently\
    \ not because of what they have done but because of data-driven inferences about\
    \ what they might do. As a result, these types of systems may reinforce discriminatory\
    \ practices by replicating the patterns in historic data and may create self-fulfilling\
    \ prophecies.\n\n    ### Ethical Implications of Data Science: Creating a Panopticon"
