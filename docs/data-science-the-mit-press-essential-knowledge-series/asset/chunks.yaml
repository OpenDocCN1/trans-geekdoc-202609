- raw: "    In addition to predicting the classification label, prediction models\
    \ can also give a measure of how confident the model is in the prediction. This\
    \ measure is called the *prediction probability* and will have a value between\
    \ 0 and 1. The higher the value, the more likely the prediction is correct. The\
    \ prediction-probability value can be used to prioritize which customers to focus\
    \ on. For example, in customer-churn prediction the organization wants to concentrate\
    \ on the customers who are most likely to leave. By using the prediction probability\
    \ and sorting the churners based on this value, a business can focus on the key\
    \ customers (those most likely to leave) first before moving on to customers with\
    \ a lower prediction-probability score.\n\n    ## How Much Will It Cost? (Regression)\n\
    \n    Price prediction is the task of estimating the price that a product will\
    \ cost at a particular point in time. The product could be a car, a house, a barrel\
    \ of oil, a stock, or a medical procedure. Having a good estimate of what something\
    \ will cost is obviously valuable to anyone who is considering buying the item.\
    \ The accuracy of a price-prediction model is domain dependent. For example, due\
    \ to the variability in the stock market, predicting the price of a stock tomorrow\
    \ is very difficult. By comparison, it may be easier to predict the price of a\
    \ house at an auction because the variation in house prices fluctuates much more\
    \ slowly than stocks.\n\n    The fact that price prediction involves estimating\
    \ the value of a continuous attribute means that it is treated as a *regression\
    \ problem*. A regression problem is structurally very similar to a classification\
    \ problem; in both cases, the data science solution involves building a model\
    \ that can predict the missing value of an attribute given a set of input attributes.\
    \ The only difference is that classification involves estimating the value of\
    \ a categorical attribute and regression involves estimating the value of a continuous\
    \ attribute. Regression analysis requires a data set where the value of the target\
    \ attribute for each of the historic instances is listed. The multi-input linear-regression\
    \ model introduced in chapter 4 illustrated the basic structure of a regression\
    \ model, with most other regression models being variants of this approach. The\
    \ basic structure of a regression model for price prediction is the same no matter\
    \ what product it is applied to; all that varies are the name and number of the\
    \ attributes. For example, to predict the price of a house, the input would include\
    \ attributes such as the size of the house, the number of rooms, the number of\
    \ floors, the average house price in the area, the average house size in the area,\
    \ and so on. By comparison, to predict the price of a car, the attributes would\
    \ include the age of the car, the number of miles on the odometer, the engine\
    \ size, the make of the car, the number of doors, and so on. In each case, given\
    \ the appropriate data, the regression algorithm works out how each of the attributes\
    \ contributes to the final price.\n\n    As has been the case with all the examples\
    \ given throughout this chapter, the application example of using a regression\
    \ model for price prediction is illustrative only of the type of problem that\
    \ it is appropriate to frame as a regression-modeling task. Regression prediction\
    \ can be used in a wide variety of other real-world problems. Typical regression-prediction\
    \ problems include calculating profit, value and volume of sales, sizes, demand,\
    \ distances, and dosage.\n\n    ## Note\n\n    # 6 Privacy and Ethics\n\n    The\
    \ biggest unknown facing data science today is how societies will choose to answer\
    \ a new version of the old question regarding how best to balance the freedoms\
    \ and privacy of individuals and minorities against the security and interests\
    \ of society. In the context of data science, this old question is framed as follows:\
    \ What do we as a society view are reasonable ways to gather and use the data\
    \ relating to individuals in contexts as diverse as fighting terrorism, improving\
    \ medicine, supporting public-policy research, fighting crime, detecting fraud,\
    \ assessing credit risk, providing insurance underwriting, and advertising to\
    \ targeted groups?\n\n    The promise of data science is that it provides a way\
    \ to understand the world through data. In the current era of big data, this promise\
    \ is very tantalizing, and, indeed, a number of arguments can be used to support\
    \ the development and adoption of data-driven infrastructure and technologies.\
    \ One common argument relates to improving efficiency, effectiveness, and competiveness—an\
    \ argument that, at least in the business context, is backed by some academic\
    \ research. For example, a study involving 179 large publicly traded firms in\
    \ 2011 showed that the more data driven a firm’s decision making is, the more\
    \ productive the firm is: “We find that firms that adopt DDD \\[data-driven decision\
    \ making\\] have output and productivity that is 5–6% higher than what would be\
    \ expected given their other investments and information technology usage” (Brynjolfsson,\
    \ Hitt, and Kim 2011, 1).\n\n    Another argument for increased adoption of data\
    \ science technologies and practices relates to securitization. For a long time,\
    \ governments have used the argument that surveillance improves security. And\
    \ since the terrorist attacks in the United States on September 11, 2001, as well\
    \ as with each subsequent terrorist attack throughout the world, the argument\
    \ has gained traction. Indeed, it was frequently used in the public debate caused\
    \ by Edward Snowden’s revelations about the US National Security Agency’s PRISM\
    \ surveillance program and the data it routinely gathered on US citizens. A stark\
    \ example of the power of this argument is the agency’s US$1.7 billion investment\
    \ in a data center in Bluffdale, Utah, that has the ability to store huge amounts\
    \ of intercepted communications (Carroll 2013).\n\n    At the same time, however,\
    \ societies, governments, and business are struggling to understand the long-term\
    \ implications of data science in a big-data world. Given the rapid development\
    \ of technologies around data gathering, data storage, and data analysis, it is\
    \ not surprising that the legal frameworks in place and the broader ethical discussions\
    \ around data, in particular the question of individual privacy, are running behind\
    \ these advances. Notwithstanding this difficulty, basic legal principles around\
    \ data collection and usage are important to understand and are nearly always\
    \ applicable. Also, the ethical debate around data usage and privacy has highlighted\
    \ some worrying trends that we as individuals and citizens should be aware of.\n\
    \n    ## Commercial Interests versus Individual Privacy\n\n    Data science can\
    \ be framed as making the world a more prosperous and secure place to live. But\
    \ these same arguments can be used by very different organizations that have very\
    \ distinct agendas. For example, contrast calls by civil liberties groups for\
    \ government to be more open and transparent in the gathering, use, and availability\
    \ of data in the hope of empowering citizens to hold these same governments to\
    \ account with similar calls from business communities who hope to use these data\
    \ to increase their profits (Kitchin 2014a). In truth, data science is a double-edged\
    \ sword. It can be used to improve our lives through more efficient government,\
    \ improved medicine and health care, less-expensive insurance, smarter cities,\
    \ reduced crime, and many more ways. At the same time, however, it can also be\
    \ used to spy on our private lives, to target us with unwanted advertising, and\
    \ to control our behavior both overtly and covertly (the fear of surveillance\
    \ can affect us as much as the surveillance itself does)."
