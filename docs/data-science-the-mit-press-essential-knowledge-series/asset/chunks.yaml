    尽管我们可以使用数据科学来提取不同类型的模式，但我们总是希望这些模式既是不显而易见的，又有用的。上一段给出的电子邮件分类规则如此简单且显而易见，以至于如果它是数据科学过程提取的唯一规则，我们会感到非常失望。例如，这条电子邮件分类规则只检查邮件的一个属性：邮件中是否包含“轻松获钱”这个短语？如果一个人类专家可以很容易在自己的脑海中创建一个模式，那么通常不值得花费精力使用数据科学来“发现”它。总的来说，当我们拥有大量的数据示例，并且模式复杂到人类无法通过手动发现和提取时，数据科学就会变得有用。作为一种下限，我们可以将大量的数据示例定义为超过了人类专家可以轻松检查的数量。至于模式的复杂性，我们同样可以相对于人类的能力来定义它。我们人类非常擅长定义检查一个、两个甚至三个属性（也常称为
    `features` 或 `variables`）的规则，但当我们处理的属性超过三个时，我们就会开始难以处理它们之间的相互作用。相比之下，数据科学通常应用在这样的场景中：我们希望在数十、数百、数千，甚至在极端情况下数百万个属性中寻找模式。


    我们使用数据科学提取的模式只有在它们能让我们对问题产生洞察并使我们能够采取行动来帮助解决问题时才是有用的。`actionable insight`（可行的洞察）这个短语有时被用来描述我们希望提取出的模式提供的价值。`insight`（洞察）一词强调了模式应该为我们提供关于问题的非明显信息。`actionable`（可行的的）一词强调了我们获得的洞察应该是我们有能力以某种方式使用的。例如，想象我们为一家手机公司工作，试图解决客户
    `churn`（流失）问题——即有太多客户转到了其他公司。数据科学解决这一问题的一种方法是从以前客户的数据中提取模式，让我们能够识别出有流失风险的当前客户，然后联系这些客户并试图说服他们留下。一个能让我们识别可能流失客户的模式，只有在满足以下条件时对我们有用：(*a*)
    模式识别客户足够早，以便他们在流失之前有足够的时间联系他们，且 (*b*) 我们的公司能够安排一个团队来联系他们。为了让公司能够对模式提供的洞察采取行动，这两点都是必不可少的。


    ## 数据科学的简史


    `data science`（数据科学）一词有着特定的历史，可以追溯到 20 世纪 90 年代。然而，它所汲依托的领域拥有更悠久的历史。这段长期历史中的一个线索是数据收集历史；另一个线索是数据分析历史。在本节中，我们将回顾这些线索的主要进展，并描述它们是如何以及为何汇聚成数据科学领域的。由于需要，当我们描述和命名随着出现的重要技术创新时，这篇回顾将引入新的术语。对于每个新术语，我们都会提供其含义的简要解释；我们将在书的后面回到许多这些术语，并提供更详细的解释。我们将从数据收集的历史开始，然后给出数据分析的历史，最后涵盖数据科学的发展。


    ### 数据收集的历史


    最早的数据记录方法可能是通过木棒上刻刻痕来标记日期的流逝，或者在地面上插杆子来标记至日的日出。然而，随着文字的发展，我们记录自身经历和世界事件的能力大大增加，从而增加了我们收集的数据量。最早的文字形式发展于公元前
    3200 年左右的美索不达米亚，用于商业记录。这种记录类型捕获了所谓的 `transactional data`（事务型数据）。事务数据包括事件信息，例如商品销售、开具发票、货物交付、信用卡支付、保险理赔等。`Nontransactional
    data`（非事务型数据），如人口统计数据，也具有悠久的历史。已知最早的人口大普查发生在公元前 3000 年左右的法老埃及。早期国家投入大量精力和资源进行大规模数据收集操作的原因是，这些国家需要征税和征兵，因此这证明了本杰明·富兰林的说法：生命中只有两件事是确定的：死亡和税收。


    在过去的 150 年里，电子传感器的发展、数据的数字化以及计算机的发明，促进了收集和存储数据量的巨大增长。数据收集和存储的一个里程碑出现在 1970 年，当时埃德加·F·科德发表了一篇解释
    `relational data model`（关系型数据模型）的论文，这在设定数据（当时）如何存储、索引和检索方面具有革命性。关系型数据模型允许用户使用简单的查询从数据库中提取数据，这些查询定义了用户想要的数据，而不需要用户担心数据的底层结构或物理存储在何处。科德的论文为现代数据库以及
    `structured query language`（SQL，结构查询语言）的发展奠定了基础，SQL 是定义数据库查询的国际标准。关系数据库将数据存储在表中，结构为每个实例一行，每个属性一列。这种结构对于存储数据来说是理想的，因为它可以分解为自然属性。


    数据库是存储和检索结构化事务数据或 `operational` 数据（即运营数据，即公司日常运营产生的数据类型）的自然技术。然而，随着公司变得越来越大和自动化，这些公司不同部门产生的数据量和多样性剧增。在
    20 世纪 90 年代，公司意识到，尽管他们正在积累海量数据，但在分析这些数据时反复遇到困难。问题所在之一是数据通常存储在同一个组织内部的许多独立数据库中。另一个困难是，数据库针对数据的存储和检索进行了优化，这些活动的特点是具有大量的简单操作，如
    `SELECT`、`INSERT`、`UPDATE` 和 `DELETE`。为了分析数据，这些公司需要能够汇总并协调来自不同数据库的数据，并促进更复杂的分析数据操作的技术。这一业务挑战导致了
    `data warehouses`（数据仓库）的发展。在数据仓库中，数据从整个组织中提取并整合，从而为分析提供更全面的的数据集。

    '
