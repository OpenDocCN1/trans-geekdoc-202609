    Although Hadoop is the best known big-data processing framework, it is by no means
    the only one. Other big-data processing frameworks include `Storm`, `Spark`, and
    `Flink`. All of these frameworks are part of the Apache software foundation projects.
    The difference between these frameworks lies in the fact that `Hadoop` is primarily
    designed for batch processing of data. Batch processing is appropriate where the
    dataset is static during the processing and where the results of the processing
    are not required immediately (or at least are not particularly time sensitive).
    The `Storm` framework is designed for processing streams of data. In stream processing
    each element in the stream is processed as it enters the system, and consequently
    the processing operations are defined to work on each individual element in the
    stream rather than on the entire data set. For example, where a batch process
    might return an average over a data set of values, a stream process will return
    an individual label or value for each element in the stream (such as calculating
    a sentiment score for each tweet in a Twitter stream). `Storm` is designed for
    real-time processing of data and according to the `Storm` website, it has been
    benchmarked at processing over a million tuples per second per node. `Spark` and
    `Flink` are both hybrid (batch and stream) processing frameworks. `Spark` is fundamentally
    a batch processing framework, similar to `Hadoop`, but also has some stream processing
    capabilities whereas `Flink` is a stream processing framework that can also be
    used for batch processing. Although these big-data processing frameworks provide
    data scientists with a choice of tools to meet the specific big-data requirements
    of their project, using these frameworks can have the drawback that the modern
    data scientist now has to analyze data in two different locations, the traditional
    modern databases and in the big-data storage. The next section looks at how this
    particular issue is being addressed.


    ### The Hybrid Database World


    If an organization does not have data of the size and scale that require a `Hadoop`
    solution, then it will require only traditional database software to manage its
    data. However, some of the literature argues that the data-storage and processing
    tools available in the `Hadoop` world will replace the more traditional databases.
    It is very difficult to see this happening, and more recently there has been much
    discussion about having a more balanced approach to managing data in what is called
    the “hybrid database world.” The hybrid database world is where traditional databases
    and the `Hadoop` world coexist.


    In the hybrid database world, the organization’s databases and `Hadoop`-stored
    data are connected and work together, allowing the efficient processing, sharing,
    and analysis of the data. `Figure 8` shows a traditional data warehouse, but instead
    of all the data being stored in the database or the data warehouse, the majority
    of the data is moved to `Hadoop`. A connection is created between the database
    and `Hadoop`, which allows the data scientist to query the data as if they all
    are in one location. The data scientist does not need to query the portion of
    data that is in the database warehouse and then in a separate step query the portion
    that is stored in `Hadoop`. He can query the data as he always has done, and the
    solution will identify what parts of the query need to be run in each location.
    The results of the query arrived at in each location will be merged together and
    presented to him. Similarly, as the data warehouse grows, some the older data
    will not be queried as frequently. The hybrid database solution automatically
    moves the less frequently used data to the `Hadoop` environment and the more frequently
    used data to the warehouse. The hybrid database automatically balances the location
    of the data based on the frequency of access and the type of data science being
    performed.


    ![Figure 8 Databases, data warehousing, and Hadoop working together (inspired
    by a figure in the Gluent data platform white paper, 2017, https://gluent.com/wp-content/uploads/2017/09/Gluent-Overview.pdf).](images/11140_003_fig_008.jpg)


    `Figure 8` Databases, data warehousing, and Hadoop working together (inspired
    by a figure in the Gluent data platform white paper, 2017, [https://gluent.com/wp-content/uploads/2017/09/Gluent-Overview.pdf]).


    One of the advantages of this hybrid solution is that the data scientist still
    uses `SQL` to query the data. He does not have to learn another data-query language
    or have to use a variety of different tools. Based on current trends, the main
    database vendors, data-integration solution vendors, and all cloud data-storage
    vendors will have solutions similar to this hybrid one in the near future.


    ### Data Preparation and Integration


    Data integration involves taking the data from different data sources and merging
    them to give a unified view of the data from across the organization. A good example
    of such integration occurs with medical records. Ideally, every person would have
    one health record, and every hospital, medical facility, and general practice
    would use the same patient identifier or same units of measures, the same grading
    system, and so on. Unfortunately, nearly every hospital has its own independent
    patient-management system, as does each of the medical labs within the hospital.
    Think of the challenges in finding a patient’s record and assigning the correct
    results to the correct patient. And these are the challenges faced by just one
    hospital. In scenarios where multiple hospitals share patient data, the problem
    of integration becomes significant. It is because of these kind of challenges
    that the first three `CRISP-DM` stages take up to 70 to 80 percent of the total
    data science project time, with the majority of this time being allocated to data
    integration.


    Integrating data from multiple data sources is difficult even when the data are
    structured. However, when some of the newer big-data sources are involved, where
    semi- or unstructured data are the norm, then the cost of integrating the data
    and managing the architecture can become significant. An illustrative example
    of the challenges of data integration is customer data. Customer data can reside
    in many different applications (and the applications’ corresponding databases).
    Each application will contain a slightly different piece of customer data. For
    example, the internal data sources might contain the customer credit rating, customer
    sales, payments, call-center contact information, and so on. Additional data about
    the customer may also be available from external data sources. In this context,
    creating an integrated view of a customer requires the data from each of these
    sources to be extracted and integrated.


    The typical data-integration process will involve a number of different stages,
    consisting of extracting, cleaning, standardizing, transforming, and finally integrating
    to create a single unified version of the data. Extracting data from multiple
    data sources can be challenging because many data sources can be accessed only
    by using an interface particular to that data source. As a consequence, data scientists
    need to have a broad skill set to be able to interact with each of the data sources
    in order to obtain the data.

