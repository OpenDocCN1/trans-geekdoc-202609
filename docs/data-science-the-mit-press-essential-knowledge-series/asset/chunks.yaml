    data set. If the average BMI value in the data set (BMI = 24.0932) is entered,
    the model estimates a 4.29 percent likelihood for the diabetes attribute, which
    is the average value for diabetes in the data set.


    The weighting of the instances is based on the distance of the instance from the
    line: the farther an instance is away from the line, the larger the residual for
    that instance, and the algorithm will weight that instance by the residual squared.
    One consequence of this weighting is that instances that have extreme values (outliers)
    can have a disproportionately large impact on the line-fitting process, resulting
    in the line being dragged away from the other instances. Thus, it is important
    to check for outliers in a data set prior to fitting a line to the data set (or,
    in other words, training a linear regression function on the data set) using the
    least squares algorithm.


    Linear-regression models can be extended to take multiple inputs. A new parameter
    is added to the model for each new input attribute, and the equation for the model
    is updated to include the result of multiplying the new attribute by the new parameter
    within the summation. For example, to extend the model to include the exercise
    and weight attributes as input, the structure of the regression function becomes


    ![11140_e004_004.jpg](images/11140_e004_004.jpg).


    In statistics, a regression function that maps from multiple inputs to a single
    output in this way is known as a `multiple linear regression function`. The structure
    of a multi-input regression function is the basis for a range of ML algorithms,
    including neural networks.


    Correlation and regression are similar concepts insofar as both are techniques
    that focus on the relationship across columns in the data set. Correlation is
    focused on exploring whether a relationship exists between two attributes, and
    regression is focused on modeling an assumed relationship between attributes with
    the purpose of being able to estimate the value of one target attribute given
    the values of one or more input attributes.


    ### Neural Networks and Deep Learning


    A `neural network` consists of a set of neurons that are connected together. A
    neuron takes a set of numeric values as input and maps them to a single output
    value. At its core, a neuron is simply a multi-input linear-regression function.
    The only significant difference between the two is that in a neuron the output
    of the multi-input linear-regression function is passed through another function
    that is called the `activation function`.

    '
