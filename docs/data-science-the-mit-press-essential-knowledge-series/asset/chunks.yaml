    If you spend time absorbing some of the commercial boosterism that surrounds data
    science, you get a sense that any problem can be solved using data-science technology
    given enough of the right data. This marketing of the power of data science feeds
    into a view that a data-driven approach to governance is the best way to address
    complex social problems, such as crime, poverty, poor education, and poor public
    health: all we need to do to solve these problems is to put sensors into our societies
    to track everything, merge all the data, and run the algorithms to generate the
    key insights that provide the solution.


    When this argument is accepted, two processes are often intensified. The first
    is that society becomes more technocratic in nature, and aspects of life begin
    to be regulated by data-driven systems. Examples of this type of technological
    regulation already exist—for example, in some jurisdictions data science is currently
    used in parole hearings (Berk and Bleich 2013) and sentencing (Barry-Jester, Casselman,
    and Goldstein 2015). For an example outside of the judicial system, consider how
    smart-city technologies regulate traffic flows through cities with algorithms
    dynamically deciding which traffic flow gets priority at a junction at different
    times of day (Kitchin 2014b). A by-product of this technocratic regulation is
    the proliferation of the sensors that support the automated regulating systems.
    The second process is “control creep,” wherein data gathered for one purpose is
    repurposed and used to regulate in another way (Innes 2001). For example, road
    cameras that were installed in London with the primary purpose of regulating congestion
    and implementing congestion charges (the London congestion charge is a daily charge
    for driving a vehicle within London during peak times) have been repurposed for
    security tasks (Dodge and Kitchin 2007). Other examples of control creep include
    a technology called `ShotSpotter` that consists of a city-wide network of microphones
    designed to identify gunshots and report the locations of them but also records
    conversations, some of which were used to achieve criminal convictions (Weissman
    2015), and the use of in-car navigation systems to monitor and fine rental car
    drivers who drive out of state (Elliott 2004; Kitchin 2014a).


    An aspect of control creep is the drive to merge data from different sources so
    as to provide a more complete picture of a society and thereby potentially unlock
    deeper insights into the problems in the system. There are often good reasons
    for the repurposing of data. Indeed, calls are frequently made for data held by
    different branches of government to be merged for legitimate purposes—for example,
    to support health research and for the convenience of the state and its citizens.
    From a civil liberties perspective, however, these trends are very concerning.
    Heightened surveillance, the integration of data from multiple sources, control
    creep, and anticipatory governance (such as the predictive-policing programs)
    may result in a society where an individual may be treated with suspicion simply
    because a sequence of unrelated innocent actions or encounters matches a pattern
    deemed suspicious by a data-driven regulatory system. Living in this type of society
    would change each of us from free citizens into inmates in Bentham’s Panopticon,
    constantly self-disciplining our behaviors for fear of what inferences may be
    drawn from them. The distinction between individuals who believe and act as though
    they are free of surveillance and individuals who self-discipline out of fear
    that they inhabit a Panopticon is the primary difference between.


    ## Digital Footprint


    As individuals engage with and move through societies, they leave a trail. In
    the real world, the proliferation of cell phones means that data are gathered
    about an individual when they visit a shop, rate a restaurant, or use a date.
    The proliferation of cell phones means that data are gathered about an individual
    when they log in to websites, send an email, or like something on Facebook. The
    proliferation of cell phones means that data are gathered about an individual
    when they watch a lecture in a massive online course, use an e-book, or make withdrawals
    from ATMs. To put into perspective the amount of data that are gathered on the
    average individual, a report from the Dutch Data Authority in 2009 estimated that
    the average citizen was included in 250 to 500 databases, with this figure rising
    to 1,000 for socially active people (Koops 2011).


    The data in a digital footprint can be gathered in two contexts that are problematic
    from a privacy perspective. First, data can be collected about an individual without
    her knowledge. Second, in some contexts an individual may choose to share data
    but may have little or no control over how these are used or shared with third
    parties. The terms `data shadow` and `data footprint` are used to distinguish
    these two contexts of data gathering: an individual’s `data shadow` comprises
    the data gathered about an individual without her knowledge, consent, or awareness,
    and an individual’s `data footprint` consists of the pieces of data she knowingly
    makes public (Koops 2011).


    The collection of data about an individual without her knowledge or consent is
    of course worrying. However, the power of modern data science techniques to uncover
    hidden patterns in data coupled with the integration and repurposing of data from
    several sources means that even data collected with an individual’s knowledge
    and consent in one context can have negative effects on that individual that are
    impossible for them to predict.


    ## Computational Approaches to Preserving Privacy


    In recent years, there has been a growing interest in computational approaches
    to preserving individual privacy throughout a data-analysis process. Two of the
    best-known approaches are *differential privacy* and *federated learning*.

    '
  trans: '


    如果你花时间去吸收围绕数据科学的某些商业炒作，你就会觉得只要有足够正确的数据，任何问题都可以用数据科学技术来解决。这种对数据科学力量的营销助成了一种观点：数据驱动的治理方法是解决复杂社会问题（如犯罪、贫困、教育落后和公共卫生水平低下）的最佳方式：要解决这些问题，我们做的仅仅是在我们的社会中部署传感器以追踪一切，合并所有数据，并运行算法以生成提供解决方案的关键洞察。


    当这一观点被接受时，通常会有两个过程加强。第一个是社会在本质上变得更具有技术治国色彩，生活的各个方面开始受到数据驱动系统的监管。这类技术监管的例子已经存在——例如，在某些司法管辖区，数据科学目前已用于假释听证会（Berk
    and Bleich 2013）和判刑（Barry-Jester, Casselman, and Goldstein 2015）。司法系统之外的一个例子，可以考虑智能城市技术如何通过算法调节城市交通流，动态决定在一天中不同时间路口的哪个交通流优先优先（Kitchin
    2014b）。这种技术治国监管的副产品是支持自动化监管系统的传感器的激增。第二个过程是“控制蔓延”，即为某一目的收集的数据被重新利用并用于另一种方式的监管（Innes
    2001）。例如，在伦敦安装道路摄像头的初目的是调节拥堵和实施拥堵费（伦敦拥堵费是指在高峰时段伦敦市内驾驶车辆的每日费用），但这些摄像头已被转而用于安全任务（Dodge
    and Kitchin 2007）。控制蔓延的其他例子还包括一种名为 `ShotSpotter` 的技术，它由全市的麦克风网络组成，旨在识别枪声并报告其位置，但也会记录对话，其中一些对话被用于获得刑事定罪（Weissman
    2015），以及使用车载导航系统来监控并罚款在州外驾驶的租车驾驶员（Elliott 2004; Kitchin 2014a）。


    控制蔓延的一个方面是合并来自不同来源的数据，以便提供社会更完整的蓝图，从而可能对系统中的问题产生更深层次的洞察。数据的重新利用通常有充分的。事实上，人们经常要求合并政府不同部门持有的数据，以出于合法目的——例如支持健康研究以及为了国家及其公民的便利。然而，从公民自由的角度来看，这些趋势非常令人担忧。加强监控、多源数据整合、控制蔓延和预测性治理（如预测性警务计划）可能导致一种社会：个人可能仅仅因为一系列无关的无辜行为或遭遇符合数据驱动监管系统认为可疑模式的模式，而受到怀疑。生活在这样的社会中将把我们每个人从自由公民转变为边沁全景监狱中的囚犯，因为担心从这些行为中得出什么推论而不断地自我自律我们的行为。那些相信并表现得不受监控的人与那些由于担心自己生活在全景监狱中而自我自律的人之间，存在着主要的区别。


    ## 数字足迹


    当个人与社会互动并在其中穿行时，他们会留下痕迹。在现实世界中，手机的普及意味着当个人访问商店、评价餐厅或使用约会时，会收集关于他们的个人数据。手机的普及意味着当他们登录网站、发送电子邮件或在
    Facebook 上点赞某些内容时，会收集关于他们的个人数据。手机的普及意味着当他们在大型在线课程中观看讲座、使用电子书或从 ATM 机取款时，会收集关于他们的个人数据。为了直观了解平均个人收集的数据量，荷兰数据管理局
    2009 年的一份报告估计，平均公民包含在 250 到 500 个数据库中，对于社交活跃人士，这一数字上升到 1,000（Koops 2011）。


    数字足迹中的数据可以在两个从隐私角度来看是有问题的语文中收集。首先，可以在个人不知情的情况下收集其数据。其次，在某些语境下，个人可能会选择共享数据，但对这些数据如何被使用或与第三方共享可能很少或没有控制权。`data
    shadow`（数据影子）和 `data footprint`（数据足迹）这两个术用于区分这两种数据收集语境：个人的 `data shadow` 由在个人不知情、不同意或意识的情况下收集的个人数据组成，而个人的
    `data footprint` 由其明知公开的数据片段组成（Koops 2011）。


    在个人不知情或不同意的情况下收集个人数据无疑是令人的。然而，现代数据科学技术发现数据中隐藏模式的能力，结合多个源数据的整合和重新利用，意味着即使是在一个语境下经个人知情并同意收集的数据，也可能对该个人产生无法预测的负面影响。


    ## 保护隐私的计算方法


    近年来，人们对整个数据分析过程中保护个人隐私的计算方法越来越感兴趣。两种最为人知的方法是*差分隐私*（differential privacy）和*联邦学习*（federated
    learning）。


    '
