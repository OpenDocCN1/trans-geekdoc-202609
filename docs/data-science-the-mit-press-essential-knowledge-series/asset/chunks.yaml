  trans: '

    数据库供应商持续投入于开发其数据库的可扩展性、性能、安全性和功能。现代数据库比传统的关系型数据库先进得多。它们可以以多种不同的格式存储和查询数据。除了传统的关系型格式，还可以定义对象类型、存储文档，并存储和查询
    JSON 对象、空间数据等。大多数现代数据库还配备了大量的统计函数，使得某些数据库拥有的统计函数数量与大多数统计应用程序相当。例如，Oracle 数据库内置了超过
    300 种不同的统计函数以及内置的 SQL 语言。这些统计函数涵盖了数据科学项目所需的大部分统计分析，并包含了其他工具和语言（如 `R`）中提供的大部分或全部统计函数。利用组织数据库中现有的统计功能，可以使用
    `SQL` 以更高效、更具扩展性的方式进行数据分析。此外，大多数领先的数据库供应商（包括 Oracle、Microsoft、IBM 和 EnterpriseDB）已将许多机器学习算法集成到其数据库中，这些算法可以使用
    `SQL` 运行。内置在数据库引擎中并可以通过 `SQL` 访问的机器学习被称为`数据库内机器学习`（in-database machine learning）。数据库内机器学习可以更快速地开发模型，并更快地将模型和结果部署到应用程序和分析仪表板中。数据库内机器学习算法后的理念是：“将算法移动到数据处，而不是将数据移动到算法。”


    使用数据库内机器学习的主要优势是：


    - **无数据移动**。某些数据科学产品需要将数据从数据库导出并转换为特殊格式以输入机器学习算法。使用数据库内机器学习，不需要数据移动或转换。这使得整个过程变得不复杂、不耗时且更不容易出错。

    - **性能更快**。通过在数据库中执行分析操作且无数据移动，可以利用数据库服务器的计算能力，性能比传统方法快 100 倍。大多数数据库服务器具有高规格，拥有许多中央处理器（CPU）和高效的内存管理来处理包含十亿记录的数据集。

    - **高安全性**。数据库对数据提供了受控且可审计的访问，在维护数据安全的同时提高了数据科学家的效率。此外，数据库内机器学习避免了提取和下载数据到其他分析服务器时固有的物理安全风险。相比之下，传统流程会在组织内各个的数据孤岛中创建数据集的许多副本（可能还是不同的版本）。

    - **可扩展性**。如果将机器学习算法带入数据库，随着数据量的增加，数据库可以轻松扩展分析能力。数据库软件设计用于高效管理大量数据，利用服务器上的多个 CPU
    和内存允许机器学习算法并行运行。数据库在处理无法轻松装入内存的大数据集时也非常高效。数据库背后有 40 多年的开发工作支持，确保它们能够快速处理数据集。

    - **实时部署和环境**。使用数据库内机器学习算法开发的模型可以立即部署并用于实时环境。这允许将模型集成到日常应用程序中，为最终用户和客户提供实时预测。

    - **生产环境部署**。使用独立机器学习软件开发的模型在部署之前可能需要重新编码为其他语言。而数据库内机器学习则没有这种问题。


    许多组织正在利用数据库内机器学习的优势。它们涵盖了从小型到大型的各种组织。使用数据库内机器学习的组织示例包括：


    - **Fiserv**，一家美国金融服务提供商。Fiserv 从使用多个供应商进行欺诈检测和分析转为使用其自己的数据库。通过使用数据库内机器学习，更新模型的时间从近一周缩短到仅几小时。

    - **84.51°**（前身为 Dunhumby USA），一家客户科学公司。84.51° 使用许多不同的工具来创建模型。它通常每个月花费超过 318 小时将数据从数据库移动到机器学习。当它切换到数据库内机器学习时，不再需要移动数据。数据留在数据库中。由于它将其数据库作为计算引擎，它能够扩展其分析，生成模型的时间从每月
    67 多小时缩短到每月几小时。这为公司每月节省了十六天的时间。现在它能够获得快得的结果，并能够在客户购买后更早地为他们提供结果。

    - **Wargaming**，《坦克世界》及其他许多游戏的创制者。Wargaming 使用数据库内机器学习来建模并预测如何与他们的 1.2 亿客户进行交互。


    ### 大数据基础设施


    尽管传统的现代数据库在处理事务性数据方面极其高效，但在大数据时代，需要新的基础设施来管理所有其他形式的数据并对数据进行长久存储。现代传统数据库可以处理高达几
    PB（拍字节）的数据量，但对于这种规模的数据，传统的数据库解决方案可能会变得昂贵到无法接受。这种成本问题通常被称为垂直扩展（vertical scaling）。在传统数据范式中，组织需要在合理时间内存储和处理的数据越多，所需的数据库服务器就越大，反之服务器配置和数据库许可的成本就越高。组织可能可以使用传统数据库每天/每周摄入和查询十亿记录，但对于这种规模的处理，他们可能仅购买所需的硬件就需要投入超过
    100,000 美。


    Hadoop 是 Apache 软件基金会开发并发布的开源平台。它是一个经过证明的用于高效摄入和存储大量数据的平台，比传统的数据库方法便宜得多。在 Hadoop
    中，数据以多种方式进行划分和分区，这些分区或数据部分分布在 Hadoop 集群的节点上。与 Hadoop 协作的各种分析工具处理每个节点上的数据（在某些情况下这些数据可以驻留在内存中），从而通过跨节点并行分析允许快速处理数据。不需要数据提取或
    ETL（提取、转换、加载）过程。数据在存储处进行分析。

    '
