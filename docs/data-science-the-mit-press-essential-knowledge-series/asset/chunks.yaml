- raw: "    Differential privacy is a mathematical approach to the problem of learning\
    \ useful information about a population while at the same time learning nothing\
    \ about the individuals within the population. Differential privacy uses a particular\
    \ definition of privacy: the privacy of an individual has not been compromised\
    \ by the inclusion of his or her data in the data-analysis process if the conclusions\
    \ reached by the analysis would have been the same independent of whether the\
    \ individual’s data were included or not. A number of processes can be used to\
    \ implement differential privacy. At the core of these processes is the idea of\
    \ injecting noise either into the data-collection process or into the responses\
    \ to database queries. The noise protects the privacy of individuals but can be\
    \ removed from the data at an aggregate level so that useful population-level\
    \ statistics can be calculated. A useful example of a procedure for injecting\
    \ noise into data that provides an intuitive explanation of how differential privacy\
    \ processes can work is the randomized-response technique. The use case for this\
    \ technique is a survey that includes a sensitive yes/no question (e.g., relating\
    \ to law breaking, health conditions, etc.). Survey respondents are instructed\
    \ to answer the sensitive question using the following procedure:\n\n    1.  Flip\
    \ a coin and keep the result of the coin flip secret.\n\n    2.  If tails, respond\
    \ “Yes.”\n\n    3.  If heads, respond truthfully.\n\n    Half the respondents\
    \ will get tails and respond “Yes”; the other half will respond truthfully. Therefore,\
    \ the true number of “No” respondents in the total population is (approximately)\
    \ twice the number of “No” responses (the coin is fair and selects randomly, so\
    \ the distribution of yes/no responses among the respondents who got tails should\
    \ mirror the number of respondents who answered truthfully). Given the true count\
    \ for “No,” we can calculate the true count for “Yes.” However, although we now\
    \ have an accurate count for the population regarding the sensitive “Yes” condition,\
    \ it is not possible to identify for which of the “Yes” respondents the sensitive\
    \ condition actually holds. There is a trade-off between the amount of noise injected\
    \ into data and the usefulness of the data for data analysis. Differential privacy\
    \ addresses this trade-off by providing estimates of the amount of noise required\
    \ given factors such as the distribution of data within the database, the type\
    \ of database query that is being processed, and the number of queries through\
    \ which we wish to guarantee an individual’s privacy. Cynthia Dwork and Aaron\
    \ Roth (2014) provide an introduction to differential privacy and an overview\
    \ of several approaches to implementing differential privacy. Differential-privacy\
    \ techniques are now being deployed in a number of consumer products. For example,\
    \ Apple uses differential privacy in iOS 10 to protect the privacy of individual\
    \ users while at the same time learning usage patterns to improve predictive text\
    \ in the messaging application and to improve search functionality.\n\n    In\
    \ some scenarios, the data being used in a data science project are coming from\
    \ multiple disparate sources. For example, multiple hospitals may be contributing\
    \ to a single research project, or a company is collecting data from a large number\
    \ of users of a cell phone application. Rather than centralizing these data into\
    \ a single data repository and doing the analysis on the combined data, an alternative\
    \ approach is to train different models on the subsets of the data at the different\
    \ data sources (i.e., at the individual hospitals or on the phones of each individual\
    \ user) and then to merge the separately trained models. Google uses this federated-learning\
    \ approach to improve the query suggestions made by the Google keyboard on Android\
    \ (McMahan and Ramage 2017). In Google’s federated-learning framework, the mobile\
    \ device initially has a copy of the current application loaded. As the user uses\
    \ the application, the application data for that user are collected on his phone\
    \ and used by a learning algorithm that is local to the phone to update the local\
    \ version of the model. This local update of the model is then uploaded to the\
    \ cloud, where it is averaged with the model updates uploaded from other user\
    \ phones. The core model is then updated using this average. With the use of this\
    \ process, the core model can be improved, and individual users’ privacy can at\
    \ the same time be protected to the extent that only the model updates are shared—not\
    \ the users’ usage data.\n\n    ## Legal Frameworks for Regulating Data Use and\
    \ Protecting Privacy\n\n    There is variation across jurisdictions in the laws\
    \ relating to privacy protection and permissible data usage. However, two core\
    \ pillars are present across most democratic jurisdictions: antidiscrimination\
    \ legislation and personal-data-protection legislation.\n\n    In most jurisdictions,\
    \ antidiscrimination legislation forbids discrimination based on any of the following\
    \ grounds: disability, age, sex, race, ethnicity, nationality, sexual orientation,\
    \ and religious or political opinion. In the United States, the Civil Rights Act\
    \ of 1964[⁷](#c11140_006.xhtml#FN31) prohibits discrimination based on color,\
    \ race, sex, religion, or nationality. Later legislation has extended this list;\
    \ for example, the Americans with Disabilities Act of 1990[⁸](#c11140_006.xhtml#FN32)\
    \ extended protection to people against discrimination based on disabilities.\
    \ Similar legalization is in place in many other jurisdictions. For example, the\
    \ Charter of Fundamental Rights of the European Union prohibits discrimination\
    \ based on any grounds, including race, color, ethnic or social origin, genetic\
    \ features, sex, age, birth, disability, sexual orientation, religion or belief,\
    \ property, membership in a national minority, and political or any other opinion\
    \ (Charter 2000).\n\n    A similar situation of variation and overlap exists with\
    \ respect to privacy legislation across different jurisdictions. In the United\
    \ States, the Fair Information Practice Principles (1973)[⁹](#c11140_006.xhtml#FN33)\
    \ have provided the basis for much of the subsequent privacy legislation in that\
    \ jurisdiction. In the EU, the Data Protection Directive (Council of the European\
    \ Union and European Parliament 1995) is the basis for much of that jurisdiction’s\
    \ privacy legislation. The General Data Protection Regulations (Council of the\
    \ European Union and European Parliament 2016) expand on the data protection principles\
    \ in the Data Protection Directive and provide consistent and legally enforceable\
    \ data protection regulations across all EU member states. However, the most broadly\
    \ accepted principles relating to personal privacy and data are the Guidelines\
    \ on the Protection of Privacy and Transborder Flows of Personal Data published\
    \ by the Organisation for Economic Co-operation and Development (OECD 1980). Within\
    \ these guidelines, personal data are defined as records relating to an identifiable\
    \ individual, known as the *data subject*. The guidelines define eight (overlapping)\
    \ principles that are designed to protect a data subject’s privacy:\n\n    1.\
    \  Collection Limitation Principle: Personal data should only be obtained lawfully\
    \ and with the knowledge and consent of the data subject.\n\n    2.  Data Quality\
    \ Principle: Any personal data that are collected should be relevant to the purpose\
    \ for which they are used; they should be accurate, complete, and up to date.\n\
    \n    3.  Purpose Specification Principle: At or before the time that personal\
    \ data are collected, the data subject should be informed of the purpose for which\
    \ the data will be used. Furthermore, although changes of purpose are permissible,\
    \ they should not be introduced arbitrarily (new purposes must be compatible with\
    \ the original purpose) and should be specified to the data subject."
