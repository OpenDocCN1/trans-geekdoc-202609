  trans: '

    在过去的 10 年里，机器学习（ML）也取得了重大进展。特别是深度学习的出现，彻底改变了计算机处理语言和图像数据的方式。`deep learning`这一术语描述了一类在网络中具有多个层单元的神经网络模型。神经网络自
    20 世纪 40 年代以来一直存在着，但它们在处理大型、复杂数据集时效果最好，并且需要大量的计算资源进行训练。因此，深度学习的出现与大数据和计算能力的增长密不可分。将深度学习对各个领域的影响描述为“非同寻常”绝非夸张。


    DeepMind 的计算机程序`AlphaGo`7 是深度学习如何改变一个研究领域的绝佳案例。围棋是一种起源于 3000 年前中国的中国棋类。围棋的规则比国际象棋简单得多；玩家轮流在棋盘上下棋，目标是吃掉对方的棋子或围住空地。然而，规则的简单以及围棋使用的棋盘更大，意味着围棋中可能的棋盘配置比国际象棋多得多。事实上，围棋可能的棋盘配置比宇宙中的原子还要多。这使得围棋对计算机来说比国际象棋困难得多，因为它的搜索空间大得多，而且评估每一个可能的棋盘配置也非常困难。DeepMind
    团队使用深度学习模型使 AlphaGo 能够评估棋盘配置并选择下一步。结果是，AlphaGo 成为第一个击败职业围棋手的计算机程序，并在 2016 年 3
    月，AlphaGo 在一次全球 2 亿多观众观看的比赛中击败了曾 18 次围棋世界冠军李世石。为了直观理解深度学习对围棋的影响，直到 2009 年，世界上最好的围棋计算机程序仅被评为高级业余水平的低端；七年后，AlphaGo
    击败了世界冠军。2016 年，一篇描述 AlphaGo 背后深度学习算法的文章发表在世界上最有声誉的学术科学期刊《Nature》（自然杂志）上（Silver,
    Huang, Maddison, et al. 2016）。


    深度学习对一系列高关注的消费技术也产生了巨大影响。Facebook 现在使用深度学习进行人脸识别和文本分析，以便根据用户的在线对话直接向个人投放广告。谷歌和百度都使用深度学习进行图像识别、标注、搜索以及机器翻译。苹果的虚拟助手`Siri`、亚马逊的`Alexa`、微软的`Cortana`以及三星的`Bixby`都使用了基于深度学习的语音识别。华为目前正在开发面向中国市场的虚拟助手，它也将使用深度学习的语音识别。在第四章“机器学习
    101”中，我们将更详细地描述神经网络和深度学习。然而，尽管深度学习是一项重要的技术发展，但从数据科学增长的角度来看，它最有意义的可能是对数据科学能力和益处意识的增强，以及由于这些知名成功案例而带来的组织支持。


    ## 关于数据科学的误区


    数据科学对现代组织有很多优势，但周围也存在大量的炒作，因此我们应该了解它的局限性。最大的误区之一是认为数据科学是一个自动化的过程，我们可以将其释放到数据中以找到解决问题的答案。事实上，数据科学在过程的各个阶段都需要熟练的人工监督。需要人类分析师来定义问题、设计和准备数据、选择哪些`ML`算法最合适、批判性地解释分析结果，并根据分析揭示的洞察计划采取适当行动。如果没有熟练的人工监督，数据科学项目将无法实现其目标。最好的数据科学结果发生在人类专业知识和计算机力量协同工作时，正如
    Gordon Linoff 和 Michael Berry 所说：“数据让计算机执行它们擅长的工作——处理大量数据。这反过来让人们执行他们擅长的工作——设定问题并理解结果”（2011,3）。


    数据科学的广泛且日益增长的使用意味着，如今许多组织面临的最大数据科学挑战是寻找并聘佣合格的分析师。数据科学领域的人才是极度珍贵且稀缺的，寻觅这种人才是目前采用数据科学的主要瓶颈。为了直观说明这一人才缺口，2011
    年麦肯锡全球研究所的报告预计美国缺少 14 万至 19 万名具备数据科学和分析技能的人才，并缺少 150 万名能够以适当水平理解并质询数据科学分析流程的管理人员（Manyika,
    Chui, Brown, et al. 2011）。五年后，在他们 2016 年的报告中，该研究所仍然认为数据科学在不断的应用范围内具有巨大的待开发价值，但人才缺口将继续存在，预计将缺少
    25 万名数据科学家（Henke, Bughin, Chui, et al. 2016）。


    数据科学的第二个大误区是，每个数据科学项目都需要大数据并使用深度学习。通常情况下，更多数据是有帮助的，但`正确`的数据是更重要的要求。数据科学项目经常在数据和计算能力资源上远少于谷歌、百度或微软的组织中进行。小型数据科学项目的示例包括：每月处理约
    100 份理赔的保险公司的理赔预测；一所少于 10000 名学生的大学辍学预测；一个拥有数千名成员的工会的流失预测。因此，组织不需要处理 TB 级的数据或拥有海量的计算资源就能从数据科学中获益。


    第三个数据科学误区是现代数据科学软件很容易用，因此做数据科学很容易。数据科学软件确实变得更加易于使用了。然而，这种易用性可能会掩盖这样一个事实：正确进行数据科学既需要领域知识，需要对数据属性以及不同`ML`算法底层假设的专业知识。事实上，糟糕地做数据科学从未如此容易。就像生活的其他任何事情一样，如果你在做数据科学时不理解自己在做什么，你就会出错。数据科学的危险之处在于人们可能会被技术所震慑，相信软件呈现给他们的任何结果。然而，他们可能在无意中错误地定义了问题、输入了错误的数据或使用了假设不当的分析技术。因此，软件呈现的结果很可能是错误问题的答案，或者基于错误的数据或错误的计算结果。

    '
