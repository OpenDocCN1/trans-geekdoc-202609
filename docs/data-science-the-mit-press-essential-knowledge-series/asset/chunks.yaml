- raw: "    Prediction is the task of estimating the value of a target attribute for\
    \ a given instance based on the values of other attributes (or input attributes)\
    \ for that instance. It is the problem that supervised ML algorithms solve: they\
    \ generate prediction models. The spam-filter example we used to illustrate supervised\
    \ learning is also applicable here: we use supervised learning to train a spam-filter\
    \ model, and the spam-filter model is a prediction model. The typical use case\
    \ of a prediction model is to estimate the target attribute for new instances\
    \ that are not in the training data set. Continuing our spam example, we train\
    \ our spam filter (prediction model) on a data set of old emails and then use\
    \ the model to predict whether new emails are spam or not spam. Prediction problems\
    \ are possibly the most popular type of problem that ML is used for, so the rest\
    \ of this chapter focuses on prediction as the case study for introducing ML.\
    \ We begin our introduction to prediction models with a concept fundamental to\
    \ prediction: *correlation analysis*. Then we explain how supervised ML algorithms\
    \ work to create different types of popular prediction models, including linear-regression\
    \ models, neural network models, and decision trees.\n\n    ### Correlations Are\
    \ Not Causations, but Some Are Useful\n\n    A *correlation* describes the strength\
    \ of association between two attributes.[¹](#c11140_004.xhtml#FN11) In a general\
    \ sense, a correlation can describe any type of association between two attributes.\
    \ The term *correlation* also has a specific statistical meaning, in which it\
    \ is often used as shorthand for “Pearson correlation.” A Pearson correlation\
    \ measures the strength of a linear relationship between two numeric attributes.\
    \ It ranges in value from −1 to +1. The letter *r* is used to denote the Pearson\
    \ value or coefficient between two attributes. A coefficient of *r* = 0 indicates\
    \ that the two attributes are not correlated. A coefficient of *r* = +1 indicates\
    \ that the two attributes have a perfect positive correlation, meaning that every\
    \ change in one attribute is accompanied by an equivalent change in the other\
    \ attribute in the same direction. A coefficient of *r* = −1 indicates that the\
    \ two attributes have a perfect negative correlation, meaning that every change\
    \ in one attribute is accompanied by the opposite change in the other attribute.\
    \ The general guidelines for interpreting Pearson coefficients are that a value\
    \ of *r* ≈ ±0.7 indicates a strong linear relationship between the attributes,\
    \ *r* ≈ ±0.5 indicates a moderate linear relationship, *r* ≈ ±0.3 indicates a\
    \ weak relationship, and *r ≈* 0 indicates no relationship between the attributes.\n\
    \n    In the case of the diabetes study, from our knowledge of how humans are\
    \ physically made we would expect that there will be relationships between some\
    \ of the attributes listed in [table 2](#c11140_004.xhtml#T2). For example, it\
    \ is generally the case that the taller someone is, the larger her shoe size is.\
    \ We would also expect that the more someone exercises, the lighter she will be,\
    \ with the caveat that a tall person is likely to be heavier than a shorter person\
    \ who exercises the same amount. We would also expect that there will be no obvious\
    \ relationship between someone’s shoe size and the amount she exercises. [Figure\
    \ 9](#c11140_004.xhtml#fig_009) presents three scatterplots that illustrate how\
    \ these intuitions are reflected in the data. The scatterplot at the top shows\
    \ how the data spread out if the plotting is based on shoe size and height. There\
    \ is a clear pattern in this scatterplot: the data go from the bottom-left corner\
    \ to the top-right corner, indicating the relationship that as people get taller\
    \ (or as we move to the right on the *x* axis), they also tend to wear larger\
    \ shoes (we move up on the *y* axis). A pattern of data generally going from bottom\
    \ left to top right in a scatterplot is indicative of a positive correlation between\
    \ the two attributes. If we compute the Pearson correlation between shoe size\
    \ and height, the correlation coefficient is *r* = 0.898, indicating a strong\
    \ positive correlation between this pair of attributes. The middle scatterplot\
    \ shows how the data spread out when we plot weight and exercise. Here the general\
    \ pattern is in the opposite direction, from top left to bottom right, indicating\
    \ a negative correlation: the more people exercise, the lighter they are. The\
    \ Pearson correlation coefficient for this pair of attributes is *r* = −0.710,\
    \ indicating a strong negative correlation. The final scatterplot, at the bottom,\
    \ plots exercise and shoe size. The data are relatively randomly distributed in\
    \ this plot, and the Pearson correlation coefficient for this pair of attributes\
    \ is *r* = −0.272, indicating no real correlation.\n\n    ![Figure 9 Scatterplots\
    \ of shoe size and height, weight and exercise, and shoe size and exercise.](images/11140_004_fig_009.jpg)\n\
    \n    [Figure 9](#c11140_004.xhtml#fig_009a) Scatterplots of shoe size and height,\
    \ weight and exercise, and shoe size and exercise.\n\n    The fact that the definition\
    \ of a statistical Pearson correlation is between two attributes might appear\
    \ to limit the application of statistical correlation to data analysis to just\
    \ pairs of attributes. Fortunately, however, we can circumvent this problem by\
    \ using functions over sets of attributes. In chapter 2, we introduced BMI as\
    \ a function of a person’s weight and height. Specifically, it is the ratio of\
    \ his weight (in kilograms) divided by his height (in meters) squared. BMI was\
    \ invented in the nineteenth century by a Belgian mathematician, Adolphe Quetelet,\
    \ and is used to categorize individuals as underweight, normal weight, overweight,\
    \ or obese. The ratio of weight and height is used because BMI is designed to\
    \ have a similar value for people who are in the same category (underweight, normal\
    \ weight, overweight, or obese) irrespective of their height. We know that weight\
    \ and height are positively correlated (generally, the taller someone is, the\
    \ heavier he is), so by dividing weight by height, we control for the effect of\
    \ height on weight. We divide by the square of the height because people get wider\
    \ as they get taller, so squaring the height is an attempt to account for a person’s\
    \ total volume in the calculation. Two aspects of BMI are interesting for our\
    \ discussion about correlation between multiple attributes. First, BMI is a function\
    \ that takes a number of attributes as input and maps them to a new value. In\
    \ effect, this mapping creates a new derived (as opposed to raw) attribute in\
    \ the data. Second, because a person’s BMI is a single numeric value, we can calculate\
    \ the correlation between it and other attributes."
