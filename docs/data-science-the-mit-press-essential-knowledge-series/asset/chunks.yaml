    \ a model in a piecewise fashion (e.g. growing a decision tree one node at a time\
    \ beginning at the root node of the tree). In most data science projects it is\
    \ a model generated by an ML algorithm that is ultimately the software that is\
    \ deployed by an organization to help it solve the problem the data science project\
    \ is addressing. Each model is trained by a different type of ML algorithm, and\
    \ each algorithm looks for different types of patterns in the data. At this stage\
    \ in the project, the data scientist typically doesn’t know which patterns are\
    \ the best ones to look for in the data, so in this context it makes sense to\
    \ experiment with a number of different algorithms and see which algorithm returns\
    \ the most accurate models when run on the data set. In chapter 4 we will introduce\
    \ ML algorithms and models in much more detail and explain how to create a test\
    \ plan to evaluate model accuracy.\n\n    In the majority of data science projects,\
    \ the initial model test results will uncover problems in the data. These data\
    \ errors sometimes come to light when the data scientist investigates why the\
    \ performance of a model is lower than expected or notices that maybe the model’s\
    \ performance is suspiciously good. Or by examining the structure of the models,\
    \ the data scientist may find that the model is reliant on attributes that she\
