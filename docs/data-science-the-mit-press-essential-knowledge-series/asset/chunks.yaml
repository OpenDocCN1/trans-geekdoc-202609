    and the events in our world vastly increased the amount of data we collected.
    The earliest form of writing developed in Mesopotamia around 3200 BC and was used
    for commercial record keeping. This type of record keeping captures what is known
    as `transactional data`. Transactional data include event information such as
    the sale of an item, the issuing of an invoice, the delivery of goods, credit
    card payment, insurance claims, and so on. `Nontransactional data`, such as demographic
    data, also have a long history. The earliest-known censuses took place in pharaonic
    Egypt around 3000 BC. The reason that early states put so much effort and resources
    into large data-collection operations was that these states needed to raise taxes
    and armies, thus proving Benjamin Franklin’s claim that there are only two things
    certain in life: death and taxes.


    In the past 150 years, the development of the electronic sensor, the digitization
    of data, and the invention of the computer have contributed to a massive increase
    in the amount of data that are collected and stored. A milestone in data collection
    and storage occurred in 1970 when Edgar F. Codd published a paper explaining the
    `relational data model`, which was revolutionary in terms of setting out how data
    were (at the time) stored, indexed, and retrieved. The relational data model enabled
    users to extract data from a database using simple queries that defined what data
    the user wanted without requiring the user to worry about the underlying structure
    of the data or where they were physically stored. Codd’s paper provided the foundation
    for modern databases and the development of `structured query language` (`SQL`),
    an international standard for defining database queries. Relational databases
    store data in tables with a structure of one row per instance and one column per
    attribute. This structure is ideal for storing data because it can be decomposed
    into natural attributes.


    Databases are the natural technology to use for storing and retrieving structured
    transactional or `operational` data (i.e., the type of data generated by a company’s
