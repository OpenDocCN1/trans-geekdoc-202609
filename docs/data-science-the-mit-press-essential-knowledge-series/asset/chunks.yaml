- raw: "    Once data have been extracted from a data source, the quality of the data\
    \ needs to be checked. Data cleaning is a process that detects, cleans, or removes\
    \ corrupt or inaccurate data from the extracted data. For example, customer address\
    \ information may have to be cleaned in order to convert it into a standardized\
    \ format. In addition, there may be duplicate data in the data sources, in which\
    \ case it is necessary to identify the correct customer record that should be\
    \ used and to remove all the other records from the data sets. It is important\
    \ to ensure that the values used in a data set are consistent. For example, one\
    \ source application might use numeric values to represent a customer credit rating,\
    \ but another might have a mixture of numeric and character values. In such a\
    \ scenario, a decision regarding what value to use is needed, and then the other\
    \ representations should be mapped into the standardized representation. For example,\
    \ imagine one of the attributes in the data set is a customer’s shoe size. Customers\
    \ can buy shoes from various regions around the world, but the numbering system\
    \ used for shoe sizes in Europe, the United States, the United Kingdom, and other\
    \ countries are slightly different. Prior to doing data analysis and modeling,\
    \ these data values need to be standardized.\n\n    Data transformation involves\
    \ the changing or combining of the data from one value to another. A wide variety\
    \ of techniques can be used during this step and include data smoothing, binning,\
    \ and normalization as well as writing custom code to perform a particular transformation.\
    \ A common example of data transformation is with processing a customer’s age.\
    \ In many data science tasks, precisely distinguishing between customer ages is\
    \ not particularly helpful. The difference between a 42-year-old customer and\
    \ a 43-year-old customer is generally not significant, although differentiating\
    \ between a 42-year-old customer and a 52-year-old customer may be informative.\
    \ As a consequence, a customer’s age is often transformed from a raw age into\
    \ a general age range. This process of converting ages into age ranges is an example\
    \ of a data-transformation technique called *binning*. Although binning is relatively\
    \ straightforward from a technical perspective, the challenge here is to identify\
    \ the most appropriate range thresholds to apply during binning. Applying the\
    \ wrong thresholds may obscure important distinctions in the data. Finding appropriate\
    \ thresholds, however, may require domain specific knowledge or a process of trial-and-error\
    \ experimentation.\n\n    The final step in data integration involves creating\
    \ the data that are used as input to the ML algorithms. This data is known as\
    \ the *analytics base table*.\n\n    ## Creating the Analytics Base Table\n\n\
    \    The most important step in creating the analytics base table is the selection\
    \ of the attributes that will be included in the analysis. The selection is based\
    \ on domain knowledge and on an analysis of the relationships between attributes.\
    \ Consider, for example, a scenario where the analysis is focused on customers\
    \ of a service. In this scenario, some of the frequently used domain concepts\
    \ that will inform the design and selection of attributes include customer contract\
    \ details, demographics, usage, changes in usage, special usage, life-cycle phase,\
    \ network links, and so on. Furthermore, attributes that are found to have a high\
    \ correlation with other attributes are likely to be redundant, and so one of\
    \ the correlated attributes should be excluded. Removing redundant features can\
    \ result in simpler models which are easier to understand, and also reduces the\
    \ likelihood of an ML algorithm returning a model that is fitted to spurious patterns\
    \ in the data. The set of attributes selected for inclusion define what is known\
    \ as the *analytics record*. An analytics record typically includes both raw and\
    \ derived attributes. Each instance in the analytics base table is represented\
    \ by one analytics record, so the set of attributes included in the analytics\
    \ record defines the representation of the instances the analysis will be carried\
    \ out on.\n\n    After the analytics record has been designed, a set of records\
    \ needs to extracted and aggregated to create a data set for analysis. When these\
    \ records have been created and stored—for example, in a database—this data set\
    \ is commonly referred to as the *analytics base table*. The analytics base table\
    \ is the data set that is used as input to the ML algorithms. The next chapter\
    \ introduces the field of ML and describes some of the most popular ML algorithms\
    \ used in data science.\n\n    ## Note\n\n    # 4 Machine Learning 101\n\n   \
    \ Data science is best understood as a partnership between a data scientist and\
    \ a computer. In chapter 2, we described the process the data scientist follows:\
    \ the CRISP-DM life cycle. CRISP-DM defines a sequence of decisions the data scientist\
    \ has to make and the activities he should engage in to inform and implement these\
    \ decisions. In CRISP-DM, the major tasks for a data scientist are to define the\
    \ problem, design the data set, prepare the data, decide on the type of data analysis\
    \ to apply, and evaluate and interpret the results of the data analysis. What\
    \ the computer brings to this partnership is the ability to process data and search\
    \ for patterns in the data. Machine learning is the field of study that develops\
    \ the algorithms that the computers follow in order to identify and extract patterns\
    \ from data. ML algorithms and techniques are applied primarily during the modeling\
    \ stage of CRISP-DM. ML involves a two-step process.\n\n    First, an ML algorithm\
    \ is applied to a data set to identify useful patterns in the data. These patterns\
    \ can be represented in a number of different ways. We describe some popular representations\
    \ later in this chapter, but they include decision trees, regression models, and\
    \ neural networks. These representations of patterns are known as “models,” which\
    \ is why this stage of the CRISP-DM life cycle is known at the “modeling stage.”\
    \ Simply put, ML algorithms create models from data, and each algorithm is designed\
    \ to create models using a particular representation (neural network or decision\
    \ tree or other).\n\n    Second, once a model has been created, it is used for\
    \ analysis. In some cases, the structure of the model is what is important. A\
    \ model structure can reveal what the important attributes are in a domain. For\
    \ example, in a medical domain we might apply an ML algorithm to a data set of\
    \ stroke patients and use the structure of the model to identify the factors that\
    \ have a strong association with stroke. In other cases, a model is used to label\
    \ or classify new examples. For instance, the primary purpose of a spam-filter\
    \ model is to label new emails as either spam or not spam rather than to reveal\
    \ the defining attributes of spam email.\n\n    ## Supervised versus Unsupervised\
    \ Learning"
