  trans: '


    有时候，属性是事件或对象的原始抽象——例如，一个人的身高、邮件中的单词数、房间的温度、事件发生的时间或地点。但数据也可以从其他数据中衍生。考虑一家公司的平均薪资，或者房间温度在一段时间内的方差。在这两个例子中，生成的数据都是通过对原始原始数据（个人薪资或温度读数）应用函数从一组原始数据派生出来的。数据科学项目的价值往往在于识别出一个或多个重要的派生属性，这些属性能为问题提供洞察。


    想象一下我们正试图更好地理解人群中的肥胖问题，并试图理解识别某个体为肥胖的属性。我们将从检查个体的原始属性开始，例如他们的身高和体重，但在研究问题一段时间后，我们可能会设计出一个更具信息量的派生属性，例如体重指数（`BMI`）。`BMI`
    是人的体重与身高的比例。意识到原始属性“质量”和“身高”之间的相互作用所提供的关于肥胖的信息，比独立检查这两个属性中的任何一个所提供的要多，这将帮助我们识别人群中具有肥胖风险的人。显然，`BMI`只是我们在这里使用的一个说明派生属性重要性的简单例子。但考虑其他情况：对问题的洞察是通过多个派生属性提供的，其中每个属性又涉及两个（或可能更多）额外属性。正是在多个属性相互作用的背景下，数据科学为我们提供了真正的价值，因为我们使用的算法在某些情况下可以从原始数据中学习派生属性。


    ### 捕获数据与废弃数据


    收集的原始数据通常有两个术语：`captured data`（捕获数据）和`exhaust data`（废弃数据）（Kitchin 2014a）。`captured
    data`通过旨在收集数据的直接测量或观察来收集。例如，调查和实验的主要目的是收集有关感兴趣主题的特定数据。相比之下，exhaust 数据是某些过程的副产品，该过程的主要目的不是数据捕获。例如，许多社交媒体技术的主要目的是让用户与其他人联系。然而，每分享一张图片、发布的一篇博客、转发的一条推文或点赞的一个帖子，都会产生一系列废弃数据：谁分享的、谁查看了、使用了什么设备、一天中什么时候、使用了哪种设备、有多少人查看/点赞/转发等等。同样，亚马逊网站的主要目的是让用户在网站上进行购买。然而，每次购买都会产生大量的废弃数据：用户将哪些物品放入篮子、她在网站上停留了多久、她查看了其他哪些物品等等。


    ### 元数据


    废弃数据常见的类型之一是`metadata`（元数据）——即描述其他数据的数据。当德华·斯诺登（Edward Snowden）发布有关美国国家安全局监控计划`PRISM`的文件时，他揭露了该机构正在收集大量人们通话的元数据。这意味着该机构并没有记录人们通话的内容（它没有在进行监听），而是收集有关通话的数据，例如通话何时拨打的、接收者是谁、通话持续了多久等（Pomerantz
    2015）。这种类型的数据收集可能看起来并不阴险，但史丹福大学进行的 MetaPhone 研究强调了电话元数据可以揭示的关于个人的敏感洞察（Mayer and
    Mutchler 2014）。许多组织有非常特定的目的，事实使得根据他们给这些组织的电话相对容易地推断关于一个人的敏感信息。例如，MetaPhone 研究中的一些人曾给匿名戒酒会、离婚律师和专门治疗性传播疾病的医疗诊所打过电话。通话模式也可能具有揭示性。该研究的模式分析显示了通话模式如何揭示可能非常敏感的信息：


    > 参与者 A 与多个本地神经学小组、一家专科药房、一项罕见病管理服务以及一个专门治疗复发性多性硬化症的药物热线进行了交流……在三周内，参与者 D 联系了一家家居装潢商店、锁锁匠、一个水培经销商和一家大麻烟草店。（Mayer
    and Mutchler 2014）


    数据科学传统上关注于捕获数据。然而，正如 MetaPhone 研究所示，废弃数据可以用来揭示对情况的隐藏洞察。近年来，废弃数据变得越来越有用，特别是在客户参与领域，不同废弃数据集的关联有可能为企业提供更丰富的个人客户画像，从而使企业能够针对特定客户提供服务和营销。事实上，驱动今天商业领域数据科学增长的因素之一，是意识到废弃数据的价值，以及数据科学解锁企业这种价值的潜力。


    T. S. Eliot 的诗歌《岩石上的合唱》中的以下诗句描述了智慧、知识和信息的层级结构：


    > 我们在知识中丢失了智慧在哪里？

    > 我们在信息中丢失了知识在哪里？（Eliot 1934, 96）


    Eliot 的层级结构反映了智慧、知识、信息和数据之间结构关系的标准模型，被称为`DIKW 金字塔`（见图 2）。在 DIKW 金字塔中，数据领先于信息，信息领先于知识，知识领先于智慧。虽然层级顺序普遍认为，层之间的区别以及从一个层移动到下一层所需的过程通常存在争议。但广义上，


    ![图 2 DIKW 金字塔（改编 Kitchin 2014a）。](img/11140_002_fig_002.jpg)


    图 2 DIKW 金字塔（改编 Kitchin 2014a）。


    *   数据是通过对世界进行的抽象或测量创建的。

    *   信息是经过处理、结构化或语境化的数据，使其对人类具有意义。

    *   知识是经过人类解释和理解的信息，以便在需要时可以采取行动。

    *   智慧是以适当的方式对知识采取行动。


    数据科学过程中的活动也可以使用类似的金字塔层级表示，其中金字塔的宽度代表每个层级处理的数据量，金字塔的层级越高，活动结果对决策的信息量就越大。图 3 说明了数据科学活动的层级，从数据捕获和生成到数据预处理和聚合、数据理解和探索、使用`ML`
    进行模式发现和模型创建，以及使用在业务背景下部署的数据驱动模型进行决策支持。


