    影响从数据集生成的模型的第二个因素是机器学习（ML）算法的选择。有许多不同的机器学习算法，每种算法都编码了从数据集中泛化的不同方式。算法所编码的泛化类型被称为该算法的
    `learning bias`（学习偏置，有时也称为 `modeling` 或 `selection` 偏置）。例如，`linear-regression`
    算法编码了来自数据的线性泛化，结果忽略了可能更贴合数据的非线性关系。偏置通常被认为是一件坏事。例如，采样偏置是数据科学家会努力避免的偏置。然而，没有学习偏置就不可能学习，算法将仅仅能够记忆数据。


    然而，由于机器学习算法倾向于寻找不同类型的模式，而且由于没有一种适用于所有情况的学习偏置，因此不存在一种通用的机器学习算法。事实上，一个被称为“免费午餐定理”（`no
    free lunch` theorem，Wolpert and Macready 1997）的定理指出，不存在一种机器学习算法能够在所有可能的数据集上平均优于所有其他算法。因此，`CRISP-DM`
    流程的建模阶段通常涉及使用不同的算法构建多个模型，并比较这些模型以确定哪种算法生成的模型最好。实际上，这些实验是在测试哪种学习偏置平均而言能为给定的数据集和任务产生最好的模型。


    ## 模型评估：泛化而非记忆


    一旦数据科学家选择了一组机器学习算法在数据集上进行实验，下一个主要任务就是为如何评估这些算法生成的模型创建一个测试计划。测试计划的目标是确保评估结果能够对模型在未见数据上的性能提供真实实际的估计。一个仅仅记忆数据集的预测模型可能在估算新示例的值时表现良好。仅仅记忆数据的一个问题是，大多数数据集将包含噪声。因此，一个仅仅记忆数据的预测模型也在记忆数据中的噪声。仅仅记忆数据的另一个问题是，它将预测过程简化为了表查询，并留下了如何从训练数据泛化到不在表中的新示例的问题有待解决。


    测试计划的一个部分与如何使用数据集来训练和测试模型有关。数据集必须用于两个不同的目的。第一个是找到哪种算法生成的模型最好。第二个是估计最佳模型的泛化性能——即模型在未见数据上的表现可能如何。评估模型的黄金法则是：模型绝不能在用于训练的相同数据上进行测试。使用相同的数据对模型进行训练和测试等同于在考试前一天晚上给学生分发考试题。学生当然会在考试中表现非常好，他们的分数将无法反映他们对通用课程材料的真实熟练程度。机器学习模型也是如此：如果在与其训练的相同数据上评估模型，那么评估结果与模型的真实性能相比将是乐观的。确保模型在训练期间无法“偷看”测试数据的标准流程是将数据分为三部分：训练集、验证集和测试集。划分的比例在不同项目之间会有不同，但
    50:20:30 和 40:20:30 的划分是常见的。数据集的大小是划分中的关键因素：通常，数据集越大，划分的也越大。训练集用于训练模型。验证集则用于比较这些模型的性能。测试集用于估计最终模型的泛化性能。


    ## 总结


    本章开头指出，数据科学是数据科学家与计算机之间的伙伴关系。机器学习提供了一系列从大型数据集中生成模型的算法。然而，这些模型是否有用取决于数据科学家的专业知识。为了使数据科学项目成功，数据集应该具有领域代表性，并包含相关的属性。数据科学家应该评估一系列机器学习算法，以找到哪一种生成的模型最好。模型评估过程应该遵循黄金法则，即模型绝不能在用于训练的数据上对其进行评估。

    '
