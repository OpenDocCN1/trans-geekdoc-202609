    数据科学驱动着现代社会几乎所有领域的决策。在本节中，我们描述了三个案例研究，用来说明数据科学的影响：消费者公司利用数据科学进行销售和营销；政府利用数据科学改善医疗、刑事司法和城市规划；以及职业体育联盟利用数据科学进行球员招募。


    ### 销售与营销中的数据科学


    沃尔玛通过销售点（POS）系统、跟踪沃尔玛网站上的客户行为，以及跟踪有关沃尔玛及其产品的社交媒体评论，获取了关于其客户偏好的海数据集。十多年来，沃尔玛一直在使用数据科学优化商店的库存水平，一个著名的例子是它在弗朗西斯飓风路径上的商店补货了草莓味
    Pop-Tarts 饼（原文是：“2004 年根据几周前袭击查理飓风之前的销售数据分析，在弗朗西斯飓风路径上的商店补货了草莓味 Pop-Tarts”）。最近，沃尔玛还利用数据科学通过分析社交媒体趋势来引入新产品、分析信用卡活动为客户推荐产品，以及优化和个性化客户在沃尔玛网站上的在线体验来驱动其零售收入。沃尔玛将在线销售额
    10%15%的增长归功于数据科学优化（DeZyre 2015）。


    在线世界中向上销售和交叉销售的对应物是“推荐系统”。如果你在 Netflix 上看过电影或在 Amazon 上买过物品，你就会知道这些网站利用收集的数据对你下一步应该看什么或买什么提供建议。这些推荐系统可以设计以不同的方式引导你：有些引导你关注大片片和畅销品，而另一些则引导你关注符合你特定口味的小众物品。克里斯·安德森的书《*长尾理论*》（2008）认为，随着生产和分销成本的降低，市场正从销售少数热门商品的大量销量转向销售大量小众物品的小量销量。在推动热门产品或小众产品销售之间进行权衡，是推荐系统的一个基本设计决策，并影响用于实现这些系统的数据科学算法。


    ### 政府使用数据科学


    近年来，各国政府已经意识到采用数据科学的优势。例如，2015 年，美国政府任命 D. J. Patil 博士为首位首席数据科学家。美国政府主导的一些大型数据科学计划集中在健康领域。数据科学是“癌症登月计划”（Cancer
    Moonshot）和“精准医疗倡议”（Precision Medicine Initiatives）的核心。精准医疗倡议将人类基因组测序和数据科学相结合，为个体患者设计药物。该计划的一部分是“所有人”（All
    of Us）计划，它从超过一百万志愿者那里收集环境、生活方式和生物数据，创建全球最大的精准医疗数据集。数据科学还在彻底改变我们组织城市的方式：它被用于跟踪、分析和控制环境、能源和交通系统，并为长期城市规划提供信息（Kitchin
    2014a）。在第 7 章我们将回到医疗和智慧城市，讨论数据科学在未来几十年我们的生活中如何变得更加重要。


    美国政府的“警察数据计划”已被用于预测犯罪。然而，这也引发了对隐私和伦理的关注。许多组织使用数据科学识别热点地区，但数据偏差可能会导致问题。关键在于确保数据的使用符合伦理且透明。


    ### 职业体育中的数据科学


    电影《*点球法则》（2011）展示了数据科学如何在现代运动中提供优势。这种洞察力在于，上垒率和长打率等统计数据比传统强调的指标更能提供成功的信息指示。这使得奥克兰运动射人队能够招募到被低估的球员。许多其他团队现在也将类似的数据驱动的策略整合到他们的招募中。


    成功的关键在于获取正确的数据并识别模式。在《*经济学：一个流浪经济学家探秘万物的隐藏面*》中，斯蒂芬·D·列维特和斯蒂芬·杜布纳阐述了这一观察的重要性。正如他们所说，理解现代生活的关键在于“知道测量什么以及如何测量”（2009,
    14）。利用数据科学，我们可以发现重要的模式。


    ### 为什么是现在？


    许多因素促成了近期数据科学的增长。正如我们已经提到的，大数据的出现是由组织收集数据的相对便利性驱动的。无论是通过销售点交易记录、在线平台点击量、社交媒体帖子、智能手机应用程序，还是无数其他渠道，公司现在可以为单个客户建立更丰富的画像。另一个因素是数据存储的商品化和规模效应，使得存储数据的成本比以往任何时候都低。计算能力也经历了巨大的增长。显卡和图形处理器（GPU）最初是为计算机游戏的快速图形渲染而开发的。GPU
    的独特特征是它们可以执行快速矩阵乘法，而矩阵乘法不仅用于图形渲染，也用于机器学习（ML）。近年来，GPU 针对机器学习用途进行了调整和优化，这有助于数据处理和模型训练的大幅加速。用户友好的数据科学工具也变得并降低了进入数据科学的门槛。

