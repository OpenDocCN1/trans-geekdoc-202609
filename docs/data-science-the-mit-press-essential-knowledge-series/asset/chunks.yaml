- raw: "    Humans have always abstracted from the world and tried to understand it\
    \ by identifying patterns in their experiences of it. Data science is the latest\
    \ incarnation of this pattern-seeking behavior. However, although data science\
    \ has a long history, the breadth of its impact on modern life is without precedent.\
    \ In modern societies, the words *precision*, *smart, targeted*, and *personalized*\
