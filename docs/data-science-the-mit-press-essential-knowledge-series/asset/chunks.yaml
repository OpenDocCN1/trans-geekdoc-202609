    我们在这里想要提到的最后一个关于数据科学的迷言是：认为数据科学可以快速产生回报。这种说法的真伪取决于组织的具体背景。采用数据科学可能需要在开发数据基础设施和聘用具有数据科学专业知识的人员投入大量资金。此外，数据科学不会在每个项目中都产生积极结果。有时，数据中并不存在隐藏的洞察金矿，有时组织也无法对分析揭示的洞察采取行动。然而，在业务问题明确、且具备合适的数据和人类专业知识的背景下，数据科学可以（通常）提供可操作的洞察，从而为组织提供其成功所需的竞争优势。


    # 2 什么是数据，什么是数据集？


    正如其名称所示，数据科学从根本上依赖于数据。在最基本的范围内，一个数据（datum）或一条信息是现实世界实体（人、物体或事件）的抽象。`variable`（变量）、`feature`（特征）和`attribute`（属性）这些术语通常互换，以表示单个抽象对象。每个实体通常由若干属性描述。例如，一本书可能有以下属性：作者、标题、主题、类型、出版者、价格、出版日期、字数、章节数、页数、版本、ISBN
    等。


    数据集由与一组实体相关的数据组成，每个实体通过一组属性来描述。在最基本的形式下,¹一个数据集被组织成 `n * m` 的数据矩阵，称为 `analytics
    record`（分析记录），其中 `n` 是实体的数量（行），`m` 是属性的数量（列）。在数据科学中，`data set`（数据集）和 `analytics
    record`（分析记录）这两个术语通常互换，分析记录是数据集的一种特定表示形式。表 1 展示了一个经典书籍数据集的分析记录。表格中的每行描述一本书。数据科学文献中使用
    `instance`（实例）、`example`（示例）、`entity`（实体）、`object`（对象）、`case`（案例）、`individual`（个体）和
    `record`（记录）等术语来指代行。因此，数据集包含一组实例，每个实例都由一组属性描述。


    ![表 1 经典书籍数据集](img/11140_002_T1.png)


    表 1 经典书籍数据集


    构建分析记录是进行数据科学的前提。事实上，数据科学项目中的大部分时间和精力都花在了创建、清洗和更新分析记录上。分析记录通常通过合并许多不同来源的信息来构建：数据可能需要从多个数据库、数据仓库或不同格式的计算机文件（例如电子表格或
    `csv` 文件），或者从网络或社交媒体流中抓取。


    表 1 数据集中列出了四本书。排除 `ID` 属性——它仅仅是每行的标签，因此对分析没有用——每本书都使用六个属性描述：标题、作者、年份、封面、版本和价格。我们本为每本书包含更多属性，但正如数据科学项目的常态，我们在设计数据集时需要做出选择。在这个例子中，我们受到了页面大小以及能够排在页面上的属性数量的限制。然而，在大多数数据科学项目中，限制在于我们实际上能收集哪些属性，以及根据我们的领域知识认为哪些属性与我们尝试解决的问题相关。在数据集中包含额外属性并不是没有成本的。首先，收集和质量检查数据集中每个实例的属性信息并将这些数据整合到分析记录中需要额外的时间精精力。其次，包含无关或冗余的属性会对许多用于分析数据的算法性能产生负面影响。在数据集中包含许多属性会增加算法在数据中发现无关或伪模式的概率，这些模式仅仅因为数据集中特定的实例样本而显得具有统计学意义。如何选择正确属性的问题是所有数据科学项目面临的挑战，有时这归于一个迭代的试错实验过程，每次迭代检查使用不同属性子集获得的结果。


    属性有许多不同类型，对于每种属性类型都有相应的分析方法。因此，理解和识别不同的属性类型是数据科学家的一项基本技能。标准类型有 `numeric`（数值）、`nominal`（名型）和
    `ordinal`（序型）。数值属性描述用整数或实数值表示的可测量数量。数值属性可以在 `interval scale`（间隔尺度）或 `ratio scale`（比例尺度）上进行测量。间隔属性是在一个具有固定但任意间隔和任意起点的刻度上测量——例如日期和时间测量。对间隔属性应用排序和减法操作是合适的，但其他算术运算（如乘法和除法）是不合适的。比例尺度与间隔尺度相似，但测量刻度具有真正的零起始点。值为零表示没有测量到任何数量。比例尺度具有真正的零起始点的结果是，我们可以将比例尺度上的某个值描述为另一个值的倍数（或比例）。温度是区分间隔尺度和比例尺度的有用示例。²
    摄氏度或华氏度标上的温度测量是间隔测量，因为这两个刻度上的 0 值都不表示热量的。因此因此虽然我们可以计算这些刻度上的温度差并比较这些差异，但我们不能说 20
    摄氏度是 10 摄氏度的两倍。相比之下，开尔文温度测量是在比例尺度上的，因为 0 K（绝对零）是热运动停止的温度。比例尺量的常见例子包括金额、重量、身高和试卷分数（0-100
    分）。在表 1 中，`year` 属性是间隔尺度属性的示例，`price` 属性是比例尺度属性的示例。


    名型属性（也称为分类属性）从有限集合取值。这些值是类别、类或状态的名称（因此被称为“名型”）。名型属性的例子包括婚姻状况（单身、已婚、离婚）和啤酒类型（艾尔、淡色拉格、啤酒等）。二进制属性是名型属性的一种特例，其可能值被限制为仅两个。例如，我们可能有一个二进制属性
    `spam`描述电子邮件是否为垃圾邮件（是）或不是垃圾邮件（否），或者有一个二进制属性 `smoker`描述个体是否吸烟（是）或否（否）。名型属性不能应用排序或算术运算。注意名型属性可以按字母顺序排序，但字母排序与排序是不同的操作。在表
    1 中，`author` 和 `title` 是名型属性的示例。


    '
