  fmt: '

    Since 2001, the concept of data science has broadened well beyond that of a redefinition
    of statistics. For example, over the past 10 years there has been a tremendous
    growth in the amount of the data generated by online activity (online retail,
    social media, and online entertainment). Gathering and preparing these data for
    use in data science projects has resulted in the need for data scientists to develop
    the programming and hacking skills to scrape, merge, and clean data (sometimes
    unstructured data) from external web sources. Also, the emergence of big data
    has meant that data scientists need to be able to work with big-data technologies,
    such as `Hadoop`. In fact, today the role of a data scientist has become so broad
    that there is an ongoing debate regarding how to define the expertise and skills
    required to carry out this role.[³](#) It is, however, possible to list the expertise
    and skills that most people would agree are relevant to the role, which are shown
    in [figure 1]. It is difficult for an individual to master all of these areas,
    and, indeed, most data scientists usually have in-depth knowledge and real expertise
    in just a subset of them. However, it is important to understand and be aware
    of each area’s contribution to a data science project.


    ![Figure 1 A skills-set desideratum for a data scientist.](images/11140_001_fig_001.jpg)


    [Figure 1] A skills-set desideratum for a data scientist.


    ### Domain Expertise

    Data scientists should have some domain expertise. Most data science projects
    begin with a real-world, domain-specific problem and the need to design a data-driven
    solution to this problem. As a result, it is important for a data scientist to
    have enough domain expertise that they understand the problem, why it is important,
    and how a data science solution to the problem might fit into an organization’s
    processes. This domain expertise guides the data scientist as she works toward
    identifying an optimized solution. It also enables her to engage with real domain
    experts in a meaningful way so that she can illicit and understand relevant knowledge
    about the underlying problem. Also, having some experience of the project domain
    allows the data scientist to bring her experiences from working on similar projects
    in the same and related domains to bear on defining the project focus and scope.


    ### Data and Ethics

    Data are at the center of all data science projects. However, the fact that an
    organization has access to data does not mean that it can legally or should ethically
    use the data. In most jurisdictions, there is antidiscrimination and personal-data-protection
    legislation that regulates and controls the use of data usage. As a result, a
    data scientist needs to understand these regulations and also, more broadly, to
    have an ethical understanding of the implications of his work if he is to use
    data legally and appropriately. We return to this topic in chapter 6, where we
    discuss the legal regulations on data usage and the ethical questions related
    to data science.


    ### Data Integration

    In most organizations, a significant portion of the data will come from the databases
    in the organization. Furthermore, as the data architecture of an organization
    grows, data science projects will start incorporating data from a variety of other
    data sources, which are commonly referred to as “big-data sources.” The data in
    these data sources can exist in a variety of different formats, generally a database
    of some form—relational, `NoSQL`, or `Hadoop`. All of the data in these various
    databases and data sources will need to be integrated, cleansed, transformed,
    normalized, and so on. These tasks go by many names, such as `extraction, transformation,
    and load`, “data munging,” “data wrangling,” “data fusion,” “data crunching,”
    and so on. Like source data, the data generated from data science activities also
    need to be stored and managed. Again, a database is the typical storage location
    for the data generated by these activities because they can then be easily distributed
    and shared with different parts of the organization. As a consequence, data scientists
    need to have the skills to interface with and manipulate data in databases.


    ### Computer Science and HPC

    A range of computer science skills and tools allows data scientists to work with
    big data and to process it into new, meaningful information. `High-performance
    computing` (`HPC`) involves aggregating computing power to deliver higher performance
    than one can get from a stand-alone computer. Many data science projects work
    with a very large data set and `ML` algorithms that are computationally expensive.
    In these situations, having the skills required to access and use `HPC` resources
    is important. Beyond `HPC`, we have already mentioned the need for data scientists
    to be able to scrap, clean, and integrate web data as well as handle text and
    images. Furthermore, a data scientist may also end up writing in-house applications
    to perform a specific task or altering an existing application to tune it to the
    data being processed. Finally, computer science skills are also required to be
    able to understand and develop the models and integrate them into production.


    ### Data Visualization

    Presenting data in a graphical format makes it much easier to see and understand
    what is happening with the data. Data visualization applies to all phases of the
    data science process. When data are inspected in tabular form, it is easy to miss
    things such as outliers or trends in distributions or subtle changes in the data
    through time. However, when data are presented in the correct graphical form,
    these aspects of the data can pop out. Data visualization is an important and
    growing field, and we recommend two books, `The Visual Display of Quantitative
    Information` by Edward Tufte (2001) and `Show Me the Numbers: Designing Tables
    and Graphs to Enlighten` by Stephen Few (2012) as excellent introductions to the
    principles and techniques of effective data visualization.


    ### Statistics and Machine Learning

    Methods from statistics and probability are used throughout the data science process,
    from the initial gathering and investigation of the data right through to the
    comparing the results of different models and analyses produced during the project.
    Machine learning involves using a variety of advanced statistical and computing
    techniques to process data to find patterns. The data scientist who is involved
    in the applied aspects of `ML` does not have to write his own versions of `ML`
    algorithms. By understanding the `ML` algorithms, what they can be used for, what
    the results they generate mean, and what type of data particular algorithms can
    be run on, the data scientist can consider the `ML` algorithms as a gray box.
    This allows him to concentrate on the applied aspects of data science and to test
    the various `ML` algorithms to see which ones work best for the scenario and data
    he is concerned with.


    Finally, a key aspect of being a successful data scientist is being able to communicate
    the story in the data. This story might uncover the insight that the analysis
    of the data has revealed or how the models created during a project fit into an
    organization’s processes and the likely impact they will have on the organization’s
    functioning. There is no point executing a brilliant data science project unless
    the outputs from it are used and the results are communicated in such a way that
    colleagues with a nontechnical background can understand them and have confidence
    in them.


    ## Where Is Data Science Used?

    '
  trans: '


    自 2001 年以来，数据科学的概念已远远超越了对统计学的重新定义。例如，在过去的 10 年里，在线活动（在线零售、社交媒体和在线娱乐）产生的数据量呈惊人增长。为了在数据科学项目中使用收集并准备这些数据，数据科学家需要开发编程和黑客技能，以从外部网络源中抓取、合并和清洗数据（有时是非无结构化数据）。此外，大数据的出现意味着数据科学家需要能够处理大数据技术，例如
    `Hadoop`。事实上，如今数据科学家的角色已变得如此广泛，以至于对于如何定义执行这一角色所需的专业知识和技能仍在争论中。³


    [图 1] 数据科学家所需的技能 set 需求。


    ### 领域专业知识

    数据科学家应该具备某些领域专业知识。大多数数据科学项目始于现实世界的、特定领域的问题，并需要为该问题设计数据驱动的解决方案。因此，数据科学家具备足够的领域专业知识，使他们理解问题、为什么这个问题很重要，以及该问题的数据科学解决方案如何融入组织的流程中。这种领域专业知识将指导数据科学家识别优化解决方案。它还使她能够与真实的领域专家进行有意义的交流，从而诱出并理解有关底层问题的相关知识。此外，拥有项目领域的某些经验允许数据科学家将过去在相同及相关领域从事类似项目积累的经验应用到定义项目的重点和范围中。


    ### 数据与伦理

    数据是所有数据科学项目的核心。然而，组织拥有数据访问权限并不意味着它在法律上或在伦理上应该使用这些数据。在大多数司法管辖区，都有反歧视和个人数据保护立法来监管和控制数据的使用。因此，数据科学家需要理解这些规定，并且更广泛地说，如果他要合法且恰当地使用数据，就必须对其工作的影响有伦理上的理解。我们将在第
    6 章回到这个话题，讨论数据使用的法律规定以及与数据科学相关的伦理问题。


    ### 数据集成

    在大多数组织中，大部分数据来自组织内部数据库。此外，随着组织数据架构的增长，数据科学项目将开始整合来自各种其他数据源的数据，这些通常被称为“大数据源”。这些数据源中的数据以各种不同的格式存在，通常是某种形式的数据库——关系型、`NoSQL`
    或 `Hadoop`。这些各种数据库和数据源中的所有数据都需要整合、清洗、转换、规范化等。这些任务有许多名称，如 `extraction, transformation,
    and load`（提取、转换和加载，即 ETL、“data munging”、“data wrangling”、“data fusion”、“data crunching”等。与源数据一样，从数据科学活动产生的数据也需要存储和管理。同样，数据库是这些活动产生数据的典型存储位置，因为它们可以被轻松分发并与组织的不同部分共享。因此，数据科学家需要具备与数据库接口并操作数据的技能。


    ### 计算机科学与 HPC

    一系列计算机科学技能和工具允许数据科学家处理大数据并将其处理成新的、有意义的信息。`High-performance computing`（高性能计算，`HPC`）涉及聚合计算能力，以提供比独立计算机更高的性能。许多数据科学项目处理非常大的数据集以及计算开销巨大的
    `ML` 算法。在这些情况下，具备访问和使用 `HPC` 资源所需的技能至关重要。除了 `HPC` 之外，我们已经提到数据科学家需要能够抓取、清洗和集成网络数据，以及处理文本和图像。此外，数据科学家可能最终还会编写内部应用程序来执行特定任务，或修改现有应用程序以针对正在处理的数据进行调整。最后，还需要计算机科学技能来理解和开发模型，并将其集成到生产环境中。


    ### 数据可视化

    以图形化形式呈现数据可以让我们更容易看到和理解数据正在发生的情况。数据可视化适用于数据科学过程的所有阶段。当数据以表格形式进行检查时，很容易错过诸如离群值、分布趋势或数据随时间变化的细微变化。然而，当数据以正确的图形形式呈现时，数据的这些方面就会脱颖而出。数据可视化是一个重要且不断增长的领域，我们推荐两本书：Edward
    Tufte 的《The Visual Display of Quantitative Information》（2001）和 Stephen Few 的《Show
    Me the Numbers: Designing Tables and Graphs to Enlighten》（2012），作为有效数据可视化原则和技术的极佳入门。


    ### 统计学与机器学习

    统计学和概率方法贯穿整个数据科学过程，从最初的数据收集和调查，一直到对项目期间产生的不同模型和分析结果进行比较。机器学习涉及使用各种先进的统计和计算技术处理数据以发现模式。参与
    `ML` 应用方面的数据科学家并不需要编写他们自己的 `ML` 算法版本。通过理解 `ML` 算法、它们可以用于什么、它们生成的的结果意味着什么，以及特定算法可以在何种类型的数据上运行，数据科学家可以将
    `ML` 算法视为一个“灰盒”。这允许他专注于数据科学的各个方面，并测试各种 `ML` 算法以查看哪些算法最适用于他关注的场景和数据。


    最后，成为成功数据科学家的关键方面之一是能够讲述数据中的故事。这个故事可能揭示数据分析发现的洞察，或者在项目期间创建的模型如何融入组织的流程，以及它们对组织运作可能产生的影响。如果数据科学项目的产出没有被使用，或者结果没有以让非技术背景同事能够理解并信任的方式进行沟通，那么执行一个卓越的数据科学项目也是毫无意义的。


    '
