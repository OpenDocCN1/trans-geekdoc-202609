    差分隐私是一种数学方法，用于在学习有关群体有用信息的同时，不获取关于群体内特定个体的任何信息。差分隐私使用了一种特定的隐私定义：如果分析得出的结论无论是否包含某个人的数据都保持相同，那么该个体的隐私就没有因为其数据被纳入数据分析过程而受到泄露。可以使用多种过程来实现差分隐私。这些过程的核心思想是在向数据收集过程或对数据库查询的响应中注入噪声。噪声可以保护个人隐私，但可以从聚合层面从数据中移除，从而计算出有用的群体级统计数据。随机响应技术（randomized-response
    technique）是一个向数据中注入噪声的有用示例，直观地解释了差分隐私过程是如何工作的。该技术的应用场景是包含敏感“是/否”问题的调查（例如，涉及违法、健康状况等）。调查受访者被指示按照以下程序回答敏感问题：


    1. 抛掷硬币并对硬币结果保。

    2. 如果是反面，回答“是”。

    3. 如果是正面，如实回答。


    半数受访者将得到反面并回答“是”；另一半将如实回答。因此，总人口中回答“否”的受访者真实人数大约是回答“否”人数的两倍（硬币是公平且随机选择的，因此得到反面的受访者中“是/否”回答的分布应反映如实回答人数）。给定“否”的真实计数，我们可以计算出“是”的真实计数。然而，尽管我们现在有了群体关于敏感“是”条件的准确计数，但无法确定哪些回答“是”的受访者实际上符合敏感条件。注入数据中的噪声量与数据用于数据分析的有用性之间存在权衡。差分隐私通过提供所需噪声量的估计来解决这种权衡，这些估计取决于数据库内的数据分布、正在处理的数据库查询类型以及我们希望保证个人隐私的查询次数。Cynthia
    Dwork 和 Aaron Roth (2014) 提供了差分隐私的介绍，并概述了实现差分隐私的几种方法。差分隐私技术已部署在许多消费产品中。例如，Apple
    在 `iOS 10` 中使用差分隐私来保护单个用户的隐私，同时学习使用模式以改进消息应用程序中的预测性文本，并改进搜索功能。


    在某些情况下，数据科学项目中使用的数据可能来自多个不同的来源。例如，多所医院可能为一个单一的研究项目做出贡献，或者一家公司正在从大量手机应用程序的用户处收集数据。与其将这些数据集中到单个数据存储库并对合并后的数据进行分析，另一种方法是在不同数据源的数据子集上（即在各个医院或每个用户的手机上）训练不同的模型，然后合并这些单独训练的模型。Google
    使用这种联邦学习（federated-learning）方法来改进 Android 上 Google 键盘提供的查询建议（McMahan and Ramage
    2017）。在 Google 的联邦学习框架中，移动设备最初加载了当前应用程序的副本。当用户使用应用程序时，该用户的应用程序数据会被收集在其手机上，并由手机本地的学习算法使用，以更新本地版本的模型。然后，该模型的本地更新被上传到云端，并在那里与从其他用户手机上传的模型更新进行平均处理。最后使用该平均值更新核心模型。通过这一过程，核心模型可以得到改进，同时通过只共享模型更新而非用户使用数据，来保护个用户的用户的隐私。


    ## 监管数据使用和保护隐私的法律框架


    不同司法管辖区在涉及隐私保护和允许数据使用的法律方面存在差异。然而，大多数民主司法管辖区都存在两个核心支柱：反歧视立法和个人数据保护立法。


    在大多数司法管辖区，反歧视立法禁止基于以下任何标准的歧视：残疾、年龄、性别、种族、民族、国籍、性取向以及宗教或政治观点。在美国，《1964 年民权法案》禁止基于颜色、种族、性别、宗教或国籍的歧视。随后的法律扩展了名单；例如，《1990
    年美国残疾人法案》将保护扩展到防止基于残疾的歧视。许多其他司法管辖区也有类似的法律化措施。例如，《欧盟基本权利宪章》禁止基于任何理由的歧视，包括种族、颜色、民族或社会出身、遗传特征、性别、年龄、出生、残疾、性取向、宗教或信仰、财产、国家少数民族身份，以及政治或其他意见（宪章
    2000）。


    不同司法管辖区的隐私立法方面也存在类似的差异和重叠情况。在美国，《1973 年公平信息实践原则》为该司法管辖区随后的许多隐私立法提供了基础。在欧盟，《数据保护指令（欧洲理事会和欧洲议会
    1995 年）》是该司法管辖区许多隐私立法的基础。《通用数据保护条例（欧洲理事会和欧洲议会 2016 年）》扩展了《数据保护指令》中的数据保护原则，并在所有欧盟成员国范围内提供了一致且具有法律强制力的数据保护条例。然而，最广泛接受的与个人隐私和数据相关的原则是经济合作与发展组织（OECD）发布的《个人数据保护与跨境流动指南》（OECD
    1980）。在这些指南中，个人数据被定义为与可识别的个人相关的记录，称为 `数据主体`。该指南定义了八项（重叠的）原则，旨在保护数据主体的隐私：


    1. `收集限制原则`：个人数据应仅通过合法途径并在数据主体知情同意的情况下获得。

    2. `数据质量原则`：收集的任何个人数据都应与其用途相关；它们应该是是准确、完整且实时的。

    3. `目的明确原则`：在收集个人数据之前或期间，应告知数据主体数据将被使用的目的。此外，虽然允许改变目的，但不应随意引入（新目的必须与原始目的兼容），并应向数据主体说明。


    '
