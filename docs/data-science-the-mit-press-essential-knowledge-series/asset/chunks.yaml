    4. **目的限制原则**：个人数据的使用仅限于数据主体已获知的目的，且未经数据主体同意或法律授权，不应向第三方披露此类数据。


    5. **安全保障原则**：个人数据应通过安全保障措施受到保护，免受删除、盗窃、泄露、修改或未经授权的使用。


    6. **开放原则**：数据主体应当能够以相对方便的方式获取有关其个人数据收集、存储和使用的信息。


    7. **个人参与原则**：数据主体有权访问并对个人数据提出质疑。


    8. **问责原则**：数据控制者对遵守上述原则负责。


    包括欧盟和美国在内的许多国家都支持经济合作发展组织（OECD）指南。事实上，欧盟《通用数据保护条例》（GDPR）中的数据保护原则可以宽泛地追溯到 OECD
    指南。《通用数据保护条例》适用于欧盟境内对涉及欧盟公民的个人数据的收集、存储、传输和处理，并对此类数据流向欧盟境外产生影响。目前，有几个国家正在制定与《通用数据保护条例》相似且一致的数据保护法。


    ## 迈向伦理数据科学


    众所周知，尽管已有相关的法律框架，但国家经常以安全和情报的名义，收集其公民和外籍人士的个人数据，而这些人员往往并不知情。例子包括美国国家安全局的 PRISM
    计划；英国政府通信总部的 Tempora 计划（Shubber 2013）；以及俄罗斯政府的业务性侦查活动系统（Soldatov and Borogan 2012）。这些计划影响了公众对政府以及现代通信技术使用的看法。2015
    年皮尤研究中心（Pew）的“斯诺登后美国人的隐私策略”调查显示，87% 的受访者意识到政府对电话和互联网通信进行监控；在知晓这些计划的人中，61% 的人表示他们对这些计划是否符合公共利益失去了信心，25%
    的人报告，在获知这些计划后，他们改变了使用技术的方式（Rainie and Madden 2015）。欧洲的调查中也报告了类似的结果，超过半数的欧洲人意识到政府机构正在进行大规模数据收集，大多数受访者表示，这种监控对他们对在线个人数据使用方式的信任产生了负面影响（Eurobarometer
    2015）。


    同时，许多私人公司通过声称使用衍生、聚合或匿名化数据来规避围绕个人数据和隐私的监管。通过这些方式对数据进行重新包装，公司声称这些数据不再是个人数据；他们认为，这允许他们在个人不知情或未经同意的情况下、且在没有明确直接目的的情况下收集数据；长期持有数据；以及在出现商业机会时对数据进行重新利用或出售数据。许多数据科学和大数据商业机会的倡导者认为，数据的真实商业价值源于其重用或“可选价值”（Mayer-Schönberger
    and Cukier 2014）。数据重用的支持者强调了两项技术创新，使得数据收集和存储成为一种合理的商业策略：首先，现在的数据可以被被动收集，被追踪的个人几乎无需付出努力或无需察觉；其次，数据存储已变得相对廉价。在这种背景下，记录和存储数据具有商业意义，以防未来（可能无法预见的）的商业机会使其产生价值。


    这种囤积、重新利用和出售数据的现代商业行为，与 OECD 指南中的目的特定和使用限制原则完全背道而驰。此外，每当公司向消费者提供一份设计为不可读的隐私协议，或者保留在无需进一步咨询或通知（或两者都有）的情况下修改协议的权利时，收集限制原则就会遭到破坏。每当发生这种情况，通知和授予同意的过程就变成了一种毫无意义的勾选任务。与公众对以安全为名的政府监控意见相似，公众对商业网站收集和重新利用个人数据的态度也相当消极。再次以美国和欧洲的调查作为更广泛公众意见的试金石，2012
    年的一项针对美国互联网用户的调查发现，62% 的受访成年人表示他们不知道如何限制网站收集的关于自己的信息，68% 的人表示他们不喜欢定向广告的这种做法，因为他们不喜欢自己的在线行为被追踪和分析（Purcell,
    Brenner, and Rainie 2012）。最近对欧洲公民的一项调查发现了相似的结果：69% 的受访者认为收集他们的数据应该获得他们的明确批准，但只有
    18% 的受访者实际上完整通读了隐私声明。此外，67% 的受访者表示他们不读隐私声明是因为觉得它们太长了，38% 的人表示他们觉得内容不清晰或太难理解。调查还发现，69%
    的受访者担心他们的信息被用于与收集时不同的用途，53% 的受访者对互联网公司使用他们的个人信息来定制广告感到不适（Eurobarometer 2015）。


