- raw: "    Since 2001, the concept of data science has broadened well beyond that\
    \ of a redefinition of statistics. For example, over the past 10 years there has\
    \ been a tremendous growth in the amount of the data generated by online activity\
    \ (online retail, social media, and online entertainment). Gathering and preparing\
    \ these data for use in data science projects has resulted in the need for data\
    \ scientists to develop the programming and hacking skills to scrape, merge, and\
    \ clean data (sometimes unstructured data) from external web sources. Also, the\
    \ emergence of big data has meant that data scientists need to be able to work\
    \ with big-data technologies, such as Hadoop. In fact, today the role of a data\
    \ scientist has become so broad that there is an ongoing debate regarding how\
    \ to define the expertise and skills required to carry out this role.[³](#c11140_001.xhtml#FN3)\
    \ It is, however, possible to list the expertise and skills that most people would\
    \ agree are relevant to the role, which are shown in [figure 1](#c11140_001.xhtml#fig_001).\
    \ It is difficult for an individual to master all of these areas, and, indeed,\
    \ most data scientists usually have in-depth knowledge and real expertise in just\
    \ a subset of them. However, it is important to understand and be aware of each\
    \ area’s contribution to a data science project.\n\n    ![Figure 1 A skills-set\
    \ desideratum for a data scientist.](images/11140_001_fig_001.jpg)\n\n    [Figure\
    \ 1](#c11140_001.xhtml#fig_001a) A skills-set desideratum for a data scientist.\n\
    \n    Data scientists should have some domain expertise. Most data science projects\
    \ begin with a real-world, domain-specific problem and the need to design a data-driven\
    \ solution to this problem. As a result, it is important for a data scientist\
    \ to have enough domain expertise that they understand the problem, why it is\
    \ important, and how a data science solution to the problem might fit into an\
    \ organization’s processes. This domain expertise guides the data scientist as\
    \ she works toward identifying an optimized solution. It also enables her to engage\
    \ with real domain experts in a meaningful way so that she can illicit and understand\
    \ relevant knowledge about the underlying problem. Also, having some experience\
    \ of the project domain allows the data scientist to bring her experiences from\
    \ working on similar projects in the same and related domains to bear on defining\
    \ the project focus and scope.\n\n    Data are at the center of all data science\
    \ projects. However, the fact that an organization has access to data does not\
    \ mean that it can legally or should ethically use the data. In most jurisdictions,\
    \ there is antidiscrimination and personal-data-protection legislation that regulates\
    \ and controls the use of data usage. As a result, a data scientist needs to understand\
    \ these regulations and also, more broadly, to have an ethical understanding of\
    \ the implications of his work if he is to use data legally and appropriately.\
    \ We return to this topic in chapter 6, where we discuss the legal regulations\
    \ on data usage and the ethical questions related to data science.\n\n    In most\
    \ organizations, a significant portion of the data will come from the databases\
    \ in the organization. Furthermore, as the data architecture of an organization\
    \ grows, data science projects will start incorporating data from a variety of\
    \ other data sources, which are commonly referred to as “big-data sources.” The\
    \ data in these data sources can exist in a variety of different formats, generally\
    \ a database of some form—relational, NoSQL, or Hadoop. All of the data in these\
    \ various databases and data sources will need to be integrated, cleansed, transformed,\
    \ normalized, and so on. These tasks go by many names, such as *extraction, transformation,\
    \ and load*, “data munging,” “data wrangling,” “data fusion,” “data crunching,”\
    \ and so on. Like source data, the data generated from data science activities\
    \ also need to be stored and managed. Again, a database is the typical storage\
    \ location for the data generated by these activities because they can then be\
    \ easily distributed and shared with different parts of the organization. As a\
    \ consequence, data scientists need to have the skills to interface with and manipulate\
    \ data in databases.\n\n    A range of computer science skills and tools allows\
    \ data scientists to work with big data and to process it into new, meaningful\
    \ information. *High-performance computing* (HPC) involves aggregating computing\
    \ power to deliver higher performance than one can get from a stand-alone computer.\
    \ Many data science projects work with a very large data set and ML algorithms\
    \ that are computationally expensive. In these situations, having the skills required\
    \ to access and use HPC resources is important. Beyond HPC, we have already mentioned\
    \ the need for data scientists to be able to scrap, clean, and integrate web data\
    \ as well as handle and process unstructured text and images. Furthermore, a data\
    \ scientist may also end up writing in-house applications to perform a specific\
    \ task or altering an existing application to tune it to the data and domain being\
    \ processed. Finally, computer science skills are also required to be able to\
    \ understand and develop the ML models and integrate them into the production\
    \ or analytic or back-end applications in an organization.\n\n    Presenting data\
    \ in a graphical format makes it much easier to see and understand what is happening\
    \ with the data. Data visualization applies to all phases of the data science\
    \ process. When data are inspected in tabular form, it is easy to miss things\
    \ such as outliers or trends in distributions or subtle changes in the data through\
    \ time. However, when data are presented in the correct graphical form, these\
    \ aspects of the data can pop out. Data visualization is an important and growing\
    \ field, and we recommend two books, *The Visual Display of Quantitative Information*\
    \ by Edward Tufte (2001) and *Show Me the Numbers: Designing Tables and Graphs\
    \ to Enlighten* by Stephen Few (2012) as excellent introductions to the principles\
    \ and techniques of effective data visualization.\n\n    Methods from statistics\
    \ and probability are used throughout the data science process, from the initial\
    \ gathering and investigation of the data right through to the comparing of the\
    \ results of different models and analyses produced during the project. Machine\
    \ learning involves using a variety of advanced statistical and computing techniques\
    \ to process data to find patterns. The data scientist who is involved in the\
    \ applied aspects of ML does not have to write his own versions of ML algorithms.\
    \ By understanding the ML algorithms, what they can be used for, what the results\
    \ they generate mean, and what type of data particular algorithms can be run on,\
    \ the data scientist can consider the ML algorithms as a gray box. This allows\
    \ him to concentrate on the applied aspects of data science and to test the various\
    \ ML algorithms to see which ones work best for the scenario and data he is concerned\
    \ with.\n\n    Finally, a key aspect of being a successful data scientist is being\
    \ able to communicate the story in the data. This story might uncover the insight\
    \ that the analysis of the data has revealed or how the models created during\
    \ a project fit into an organization’s processes and the likely impact they will\
    \ have on the organization’s functioning. There is no point executing a brilliant\
    \ data science project unless the outputs from it are used and the results are\
    \ communicated in such a way that colleagues with a nontechnical background can\
    \ understand them and have confidence in them.\n\n    ## Where Is Data Science\
