    这些画像通过整合来自多个不同、嘈杂且不完整的数据源构建，因此这些画像往往会对个人的判断产生误导。更糟糕的是，这些营销画像被视为产品并经常被出售给其他公司，导致对某一个人的负面营销评估可能会伴随该个人跨越多个领域。我们已经讨论过营销数据集在保险承保中的应用（Batty,
    Tripathi, Kroll, et al. 2010），但这些画像也可能进入信用风险评估以及许多影响影响生活的决策过程中。这些营销画像有两个方面使得它们变得特别棘手：首先，它们是“黑箱”；其次，它们具有持久性。这些画像的黑箱性质显而易见，因为考虑到个人很难得知关于自己被记录了哪些数据、这些数据在何地和何时记录的，以及使用这些数据的决策过程是如何运作的。因此，如果一个个人最终被列入禁飞名单或信用黑名单，就“难以确定歧视的依据并对其提出挑战”（Kitchin
    2014a, 177）。此外，在现代世界，数据通常被存储很长时间。因此，关于个人生活中某个事件记录的数据在事件发生很久后仍然存在。正如 Turow 警告的那样，“将个人画像转化为个人评估，当画像变成声誉时就会发生这种情况”（2013,
    6）。


    此外，除非使用非常谨慎，否则数据科学实际上会延续并强化偏见。有时有人认为数据科学是客观的：它是基于数字的，因此它不会编码或带有影响人类决策的偏见观点。事实是，数据科学算法的执行方式更多是**不道德的**而非客观的。数据科学从数据中提取模式；然而，如果数据编码了社会中的偏见关系，那么算法很可能会识别出这种模式并基于该模式产生输出。事实上，一个社会中的偏见越是一致，这种偏见模式在关于该社会的数据中就会表现得越强烈，数据科学算法也就越可能提取并复制这种偏见模式。例如，学术研究人员对
    `Google Online Advertising` 系统进行的一项研究发现，与`Google profile` 将参与者识别为女性的参与者相比，该系统向`Google
    profile` 将其识别为男性的参与者更频繁地展示了与高薪工作有关的广告（Datta, Tschantz, and Datta 2015）。


    数据科学算法可以强化偏见，这一事实在数据科学应用于执法时尤为麻烦。预测性警务（或 `PredPol`）⁴是一种旨在预测犯罪最可能在何时何地发生的的数据科学工具。在城市中部署时，`PredPol`
    会生成一份每日报告，在地图上列出若干热点（500 英英乘以 500 英英的小区域），系统认为这些地方很可能发生犯罪，并为每个热点标记了系统认为犯罪可能发生的警务班次。美国和英国的警察部门都部署了
    `PredPol`。这种智能警务系统背后的理念是可以高效部署警务资源。从表面上看，这似乎是数据科学的一种合理应用，可能对犯罪进行高效打击并降低警务成本。然而，人们对
    `PredPol` 的准确性以及类似的预测性警务计划的有效性已产生疑问（Hunt, Saunders, and Hollywood 2014; Oakland
    Privacy Working Group 2015; Harkness 2016）。人们还注意到，这类系统在执法中编码种族或阶级画像分析的潜力（Baldridge
    2015）。基于历史数据的警务资源部署可能导致某些地区（通常是经济落后地区）的警察存在率更高，反过来又导致这些地区报告的犯罪水平更高。换句话说，对犯罪的预测变成了一种自我实现的预言。这种循环的结果是，某些地区会被过度的警察监视，导致这些社区居民与执法机构之间的信任破裂（Harkness
    2016）。


    数据驱动执法的另一个例子是芝加哥警察局为了减少枪击犯罪而使用的“战略主题列表”（`SSL`）。该列表首次创建于 2013 年，当时它列出了 426 名被认为暴力风险极高的人员。为了主动预防枪击犯罪，芝加哥警察局联系了
    `SSL` 上的所有人。`SSL` 上的某些人对被入名单感到非常惊讶，因为尽管他们有轻微的犯罪记录，但记录中并没有暴力行为（Gorner 2013）。关于数据驱动的犯罪预防列表的另一个问题是：个人是如何进入名单的？2013
    年版本的 `SSL` 似乎是利用个人的其他属性编制的，包括对其社交网络的分析，以及熟人的逮捕和中击历史（Dokoupil 2013; Gorner 2013）。一方面，使用社交网络分析的想法是有道理的，但它引发了真实的“连坐罪”问题。这种方法的一个问题是，很难准确地定义两个个人之间的关联究竟意味着什么。住在同一条街上就足以构成关联吗？此外，在美国，监狱中绝大多数囚犯是非裔裔和拉丁裔男性，允许预测性警务算法使用“关联”概念作为输入，很可能导致预测主要针对有色种族男性（Baldridge
    2015）。预测性警务的预见性意味着，人们受到不同的对待可能不是因为他们做了什么，而是基于对他们可能做什么做什么的数据推断。


    ### 数据科学的伦理影响：创建一个全景监狱


