    \ results: 69 percent of respondents felt that the collection of their data should\
    \ require their explicit approval, but only 18 percent of respondents actually\
    \ fully read privacy statements. Furthermore, 67 percent of respondents stated\
    \ that they don’t read privacy statements because they found them too long, and\
    \ 38 percent stated that they found them unclear or too difficult to understand.\
    \ The survey also found that 69 percent of respondents were concerned about their\
    \ information being used for different purposes from the one it was collected\
    \ for, and 53 percent of respondents were uncomfortable with Internet companies\
    \ using their personal information to tailor advertising (Eurobarometer 2015)."
