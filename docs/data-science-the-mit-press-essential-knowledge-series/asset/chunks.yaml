    Database vendors continuously invest in developing the scalability, performance,
    security, and functionality of their databases. Modern databases are far more
    advanced than traditional relational databases. They can store and query data
    in variety of different formats. In addition to the traditional relational formats,
    it is also possible to define object types, store documents, and store and query
    JSON objects, spatial data, and so on. Most modern databases also come with a
    large number of statistical functions, so that some have an equivalent number
    of statistical functions as most statistical applications. For example, the Oracle
    Database comes with more than 300 different statistical functions and the SQL
    language built into it. These statistical functions cover the majority of the
    statistical analyses needed by data science projects and include most if not all
    the statistical functions available in other tools and languages, such as `R`.
    Using the statistical functionality that is available in the databases in an organization
    may allow data analytics to be performed in a more efficient and scalable manner
    using `SQL`. Furthermore, most leading database vendors (including Oracle, Microsoft,
    IBM, and EnterpriseDB) have integrated many ML algorithms into their databases,
    and these algorithms can be run using `SQL`. ML that is built into the database
    engine and is accessible using `SQL` is known as `in-database machine learning`.
    In-database ML can lead to quicker development of models and quicker deployment
    of models and results to applications and analytic dashboards. The idea behind
    the in-database ML algorithms is captured in the following directive: “Move the
    algorithms to the data instead of the data to the algorithms.”


    The main advantages of using the in-database ML algorithms are:


    - **No data movement**. Some data science products require the data to be exported
    from the database and converted to a specialized format for input to the ML algorithms.
    With in-database ML, no data movement or conversion is needed. This makes the
    entire process less complex, less time-consuming, and less error prone.

    - **Faster performance**. With analytical operations performed in the database
    and with no data movement, it is possible to utilize the computing capabilities
    of the database server, delivering performance up to 100 times faster than the
    traditional approach. Most database servers have high specifications, with many
    central processing units (CPUs) and efficient memory management to process data
    sets containing more than one billion records.

    - **High security**. The database provides controlled and auditable access to
    the data in the database, accelerating the data scientist’s productivity while
    maintaining data security. Also, in-database ML avoids the physical security risks
    inherent in extracting and downloading data to alternative analytics servers.
    The traditional process, in contrast, results in the creation of many copies (and
    potentially different versions) of data sets in separate silos across the organization.

    - **Scalability**. A database can easily scale the analytics as the data volume
    increases if the ML algorithms are brought into the database. The database software
    is designed to manage large volumes of data efficiently, utilizing the multiple
    CPUs and memory on the server to allow the ML algorithms to run in parallel. Databases
    are also very efficient at processing large data sets that do not fit easily into
    memory. Databases have more than 40 years of development work behind them to ensure
    that they can process datasets quickly.

    - **Real-time deployment and environments**. The models that are developed using
    the in-database ML algorithms can be immediately deployed and used in real-time
    environments. This allows the integration of the models into everyday applications,
    providing real-time predictions to end users and customers.

    - **Production deployment**. Models developed using stand-alone ML software may
    have to be recoded into other languages before they can be deployed. This is not
    the case with in-database ML.


    Many organizations are exploiting the benefits of in-database ML. They range from
    small to large organizations. Some examples of organizations that use in-database
    ML are:


    - **Fiserv**, an American provider of financial services. Fiserv migrated from
    using multiple vendors for fraud detection and analysis to using its database.
    By using in-database ML, the time used for updating models went from nearly a
    week to just a few hours.

    - **84.51°** (formally Dunhumby USA), a customer science company. 84.51° used
    many different tools to create models. It typically would spend more than 318
    hours each month moving data from its database to ML. When it switched to in-database
    ML there was no more need for data movement. The data stayed in the database.
    Because it was using its database as compute engine, it was able to scale its
    analytics, and the time taken to generate models went from more than 67 hours
    to hour per month. This gave the company a saving of sixteen days each month.
    It is now able to get significantly quicker results and can now provide its customers
    with results much sooner after they have made a purchase.

    - **Wargaming**, the creators of *World of Tanks* and many other games. Wargaming
    uses in-database ML to model and predict how to interact with their 120 million
    customers.


    ### Big Data Infrastructure


    Although the traditional modern database is incredibly efficient at processing
    transactional data, in the age of big data new infrastructure is required to manage
    all the other forms of data and for longer-term storage of the data. The modern
    traditional database can cope with data volumes up to a few petabytes, but for
    this scale of data, traditional database solutions may become prohibitively expensive.
    This cost issue is commonly referred to as vertical scaling. In the traditional
    data paradigm, the more data an organization has to store and process within a
    reasonable amount of time, the larger the database server required and in turn
    the greater the cost for server configuration and database licensing. Organizations
    may be able to ingest and query one billion records on a daily/weekly bases using
    traditional databases, but for this scale of processing they may need to invest
    more than $100,000 just purchasing the required hardware.


    Hadoop is an open-source platform developed and released by the Apache Software
    Foundation. It is a well-proven platform for ingesting and storing large volumes
    of data in an efficient manner and can be much less expensive than the traditional
    database approach. In Hadoop, the data are divided up and partitioned in a variety
    of ways, and these partitions or portions of data are spread across the nodes
    of the Hadoop cluster. The various analytic tools that work with Hadoop process
    the data that reside on each of the nodes (in some instances these data can be
    memory resident), thus allowing for speedy processing of the data because the
    analytics is performed in parallel across the nodes. No data extraction or ETL
    process is needed. The data are analyzed where they are stored.

