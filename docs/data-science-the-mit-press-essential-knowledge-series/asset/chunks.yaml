    Sometimes attributes are raw abstractions from an event or object—for example,
    a person’s height, the number of words in an email, the temperature in a room,
    the time or location of an event. But data can also be derived from other pieces
    of data. Consider the average salary in a company or the variance in the temperature
    of a room across a period of time. In both of these examples, the resulting data
    are derived from an original set of data by applying a function to the original
    raw data (individual salaries or temperature readings). It is frequently the case
    that the real value of a data science project is the identification of one or
    more important derived attributes that provide insight into a problem.


    Imagine we are trying to get a better understanding of obesity within a population,
    and we are trying to understand the attributes of an individual that identify
    him as being obese. We would begin by examining the raw attributes of individuals,
    such as their height and weight, but after studying the problem for some time
    we might end up designing a more informative derived attribute such as the Body
    Mass Index (`BMI`). `BMI` is the ratio of a person’s mass and height. Recognizing
    that the interaction between the raw attributes “mass” and “height” provides more
    information about obesity then either of these two attributes can when examined
    independently will help us to identify people in the population who are at risk
    of obesity. Obviously, `BMI` is a simple example that we use here to illustrate
    the importance of derived attributes. But consider situations where the insight
    into the problem is given through multiple derived attributes, where each attribute
    involves two (or potentially more) additional attributes. It is in contexts where
    multiple attributes interact together that data science provides us with real
    benefits because the algorithms we use can, in some cases, learn the derived attributes
    from the raw data.


    ### Captured Data and Exhaust Data


    There are generally two terms for gathered raw data: `captured data` and `exhaust
    data` (Kitchin 2014a). `captured data` are collected through a direct measurement
    or observation that is designed to gather the data. For example, the primary purpose
    of surveys and experiments is to gather specific data on a particular topic of
    interest. By contrast, exhaust data are a by-product of a process whose primary
    purpose is something other than data capture. For example, the primary purpose
    of many social media technologies is to enable users to connect with other people.
    However, for every image shared, blog posted, tweet retweeted, or post liked,
    a range of exhaust data is generated: who shared, who viewed, what device was
    used, what time of day, which device was used, how many people viewed/liked/retweeted,
    and so on. Similarly, the primary purpose of the Amazon website is to enable users
    to make purchases from the site. However, each purchase generates volumes of exhaust
    data: what items the user put into her basket, how long she stayed on the site,
    what other items she viewed, and so on.


    ### Metadata


    One of the most common types of exhaust data is `metadata`—that is, data that
    describe other data. When Edward Snowden released documents about the US National
    Security Agency’s surveillance program `PRISM`, he revealed that the agency was
    collecting a large amount of metadata about people’s phone calls. This meant that
    the agency was not actually recording the content of peoples phone calls (it was
    not doing wiretapping) but rather collecting the data about the calls, such as
    when the call was made, who the recipient was, how long the call lasted, and so
    on (Pomerantz 2015). This type of data gathering may not appear ominous, but the
    MetaPhone study carried out at Stanford highlighted the types of sensitive insights
    that phone-call metadata can reveal about an individual (Mayer and Mutchler 2014).
    The fact that many organizations have very specific purposes makes it relatively
    easy to infer sensitive information about a person based on his phone calls to
    these organizations. For example, some of the people in the MetaPhone study made
    calls to Alcoholics Anonymous, divorce lawyers, and medical clinics specializing
    in sexually transmitted diseases. Patterns in calls can also be revealing. The
    pattern analysis from the study showed how patterns of calls reveal potentially
    very sensitive information:


    > Participant A communicated with multiple local neurology groups, a specialty
    pharmacy, a rare condition management service, and a hotline for a pharmaceutical
    used solely to treat relapsing multiple sclerosis. … In a span of three weeks,
    Participant D contacted a home improvement store, locksmiths, a hydroponics dealer,
    and a head shop. (Mayer and Mutchler 2014)


    Data science has traditionally focused on captured data. However, as the MetaPhone
    study shows, exhaust data can be used to reveal hidden insight into situations.
    In recent years, exhaust data have become more and more useful, particularly in
    the realm of customer engagement, where the linking of different exhaust data
    sets has the potential to provide a business with a richer profile of individual
    customers, thereby enabling the business to target its services and marketing
    to certain customers. In fact, one of the factors driving the growth in data science
    in business today is the recognition of the value of exhaust data and the potential
    that data science has to unlock this value for businesses.


    ## Data Accumulates, Wisdom Doesn’t!


    The goal of data science is to use data to get insight and understanding. The
    Bible urges us to attain understanding by seeking wisdom: “wisdom is the principal
    thing, therefore get wisdom and with all thy getting get understanding” (Proverbs
    4:7 [King James]). This advice is reasonable, but it does beg the question of
    how one should go about seeking wisdom. The following lines from T. S. Eliot’s
    poem “Choruses from The Rock” describes a hierarchy of wisdom, knowledge, and
    information:


    > Where is the wisdom we have lost in knowledge?

    > Where is the knowledge we have lost in information? (Eliot 1934, 96)


    Eliot’s hierarchy mirrors the standard model of the structural relationships between
    wisdom, knowledge, information, and data known as the `DIKW pyramid` (see [figure
    2](#c11140_002.xhtml#fig_002)). In the DIKW pyramid, data precedes information,
    which precedes knowledge, which precedes wisdom. Although the order of the layers
    in the hierarchy are generally agreed upon, the distinctions between the layers
    and the processes required to move from one layer to the next are often contested.
    Broadly speaking, however,


    ![Figure 2 The DIKW pyramid (adapted from Kitchin 2014a).](images/11140_002_fig_002.jpg)


    [Figure 2](#c11140_002.xhtml#fig_002a) The DIKW pyramid (adapted from Kitchin
    2014a).


    *   Data are created through abstractions or measurements taken from the world.

    *   Information is data that have been processed, structured, or contextualized
    so that it is meaningful to humans.

    *   Knowledge is information that has been interpreted and understood by a human
    so that she can act on it if required.

    *   Wisdom is acting on knowledge in an appropriate way.


    The activities in the data science process can also be represented using a similar
    pyramid hierarchy where the width of the pyramid represents the amount of data
    being processed at each level and where the higher the layer in the pyramid, the
    more informative the results of the activities are for decision making. [Figure
    3](#c11140_002.xhtml#fig_003) illustrates the hierarchy of data science activities
    from data capture and generation through data preprocessing and aggregation, data
    understanding and exploration, pattern discovery and model creation using `ML`,
    and decision support using data-driven models deployed in the business context.

