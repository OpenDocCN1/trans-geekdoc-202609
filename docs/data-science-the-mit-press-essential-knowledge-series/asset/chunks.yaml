- raw: "    In our case study of the causes of Type 2 diabetes in white American adult\
    \ males, we are interested in identifying if any of the attributes have a strong\
    \ correlation with the target attribute describing a person’s likelihood of developing\
    \ diabetes. [Figure 10](#c11140_004.xhtml#fig_010) presents three more scatterplots,\
    \ each plotting the correlation between the target attribute (diabetes) and another\
    \ attribute: height, weight, and BMI. In the scatterplot of height and diabetes,\
    \ there doesn’t appear to be any particular pattern in the data indicating that\
    \ there is no real correlation between these two attributes (the Pearson coefficient\
    \ is *r* = −0.277). The middle scatterplot shows the distribution of the data\
    \ plotted using weight and diabetes. The spread of the data indicates a positive\
    \ correlation between these two attributes: the more someone weighs, the more\
    \ likely she is to develop diabetes (the Pearson coefficient is *r* = 0.655).\
    \ The bottom scatterplot shows the data set plotted using BMI and diabetes. The\
    \ pattern in this scatterplot is similar to the middle scatterplot: the data spread\
    \ from bottom left to top right, indicating a positive correlation. In this scatterplot,\
    \ however, the instances are more tightly packed together, indicating that the\
    \ correlation between BMI and diabetes is stronger than the correlation between\
    \ weight and diabetes. In fact, the Pearson coefficient for diabetes and BMI for\
    \ this data set is *r* = 0.877.\n\n    ![Figure 10 Scatterplots of the likelihood\
    \ of diabetes with respect to height, weight, and BMI.](images/11140_004_fig_010.jpg)\n\
    \n    [Figure 10](#c11140_004.xhtml#fig_010a) Scatterplots of the likelihood of\
    \ diabetes with respect to height, weight, and BMI.\n\n    The BMI example illustrates\
    \ that it is possible to create a new derived attribute by defining a function\
    \ that takes multiple attributes as input. It also shows that it is possible to\
    \ calculate a Pearson correlation between this derived attribute and another attribute\
    \ in the data set. Furthermore, a derived attribute can actually have a higher\
    \ correlation with a target attribute than any of the attributes used to generate\
    \ the derived attribute have with the target. One way of understanding why BMI\
    \ has a higher correlation with the diabetes attribute compared to the correlation\
    \ for either height or weight is that the likelihood of someone developing diabetes\
    \ is dependent on the interaction between height and weight, and the BMI attribute\
    \ models this interaction appropriately for diabetes. Clinicians are interested\
    \ in people’s BMI because it gives them more information about the likelihood\
    \ of someone developing Type 2 diabetes than either just the person’s height or\
    \ just his weight does independently.\n\n    We have already noted that attribute\
    \ selection is a key task in data science. So is attribute design. Designing a\
    \ derived attribute that has a strong correlation with an attribute we are interested\
    \ in is often where the real value of data science is found. Once you know the\
    \ correct attributes to use to represent the data, you are able to build accurate\
    \ models relatively quickly. Uncovering and designing the right attributes is\
    \ the difficult part. In the case of BMI, a human designed this derived attribute\
    \ in the nineteenth century. However, ML algorithms can learn interactions between\
    \ attributes and create useful derived attributes by searching through different\
    \ combinations of attributes and checking the correlation between these combinations\
    \ and the target attribute. This is why ML is useful in contexts where many weak\
    \ interacting attributes contribute to the process we are trying to understand.\n\
    \n    Identifying an attribute (raw or derived) that has a high correlation with\
    \ a target attribute is useful because the correlated attribute may give us insight\
    \ into the process that causes the phenomenon the target attribute represents:\
    \ the fact that BMI is strongly correlated with the likelihood of a person’s developing\
    \ diabetes indicates that it is not weight by itself that contributes to a person’s\
    \ developing diabetes but whether that person is overweight. Also, if an input\
    \ attribute is highly correlated with a target attribute, it is likely to be a\
    \ useful input into the prediction model. Similar to correlation analysis, prediction\
    \ involves analyzing the relationships between attributes. In order to be able\
    \ to map from the values of a set of input attributes to a target attribute, there\
    \ must be a correlation between the input attributes (or some derived function\
    \ over them) and the target attribute. If this correlation does not exist (or\
    \ cannot be found by the algorithm), then the input attributes are irrelevant\
    \ for the prediction problem, and the best a model can do is to ignore those inputs\
    \ and always predict the central tendency of that target[²](#c11140_004.xhtml#FN12)\
    \ in the data set. Conversely, if a strong correlation does exist between input\
    \ attributes and the target, then it is likely that an ML algorithm will be able\
    \ to generate a very accurate prediction model.\n\n    ### Linear Regression\n\
    \n    When a data set is composed of numeric attributes, then prediction models\
    \ based on regression are frequently used. *Regression analysis* estimates the\
    \ expected (or average) value of a numeric target attribute when all the input\
    \ attributes are fixed. The first step in a regression analysis is to hypothesize\
    \ the structure of the relationship between the input attributes and the target.\
    \ Then a parameterized mathematical model of the hypothesized relationship is\
    \ defined. This parameterized model is called a *regression function*. You can\
    \ think of a regression function as a machine that converts inputs to an output\
    \ value and of the parameters as the settings that control the behavior of a machine.\
    \ A regression function may have multiple parameters, and the focus of regression\
    \ analysis is to find the correct settings for these parameters.\n\n    It is\
    \ possible to hypothesize and model many different types of relationships between\
    \ attributes using regression analysis. In principle, the only constraint on the\
    \ structure of the relationship that can be modeled is the ability to define the\
    \ appropriate regression function. In some domains, there may be strong theoretical\
    \ reasons to assert a particular type of relationship, but in the absence of this\
    \ type of domain theory it is good practice to begin by assuming the simplest\
    \ form of relationship—namely, a linear relationship—and then, if need be, progress\
    \ to model more complex relationships. One reason for starting with a linear relationship\
    \ is that linear-regression functions are relatively easy to interpret. The other\
    \ reason is the commonsense notion that keeping things as simple as possible is\
    \ generally a good idea.\n\n    When a linear relationship is assumed, the regression\
    \ analysis is called *linear regression*. The simplest application of linear regression\
    \ is modeling the relationship between two attributes: an input attribute *X*\
    \ and a target attribute *Y*. In this simple linear-regression problem, the regression\
    \ function has the following form:\n\n    ![11140\\_e004\\_001.jpg](images/11140_e004_001.jpg)\n\
    \n    This regression function is just the equation of a line (often written as\
    \ *y = mx + c*) that is familiar to most people from high school geometry.[³](#c11140_004.xhtml#FN13)\
    \ The variables *ω*[0] and *ω*[1] are the parameters of the regression function.\
    \ Modifying these parameters changes how the function maps from the input *X*\
    \ to the output *Y*. The parameter *ω*[0] is the *y*\\-intercept (or *c* in high\
    \ school geometry) that specifies where the line crosses the vertical *y* axis\
    \ when *X* is equal to zero. The parameter *ω*[1] defines the slope of the line\
    \ (i.e., it is equivalent to *m* in the high school version)."
