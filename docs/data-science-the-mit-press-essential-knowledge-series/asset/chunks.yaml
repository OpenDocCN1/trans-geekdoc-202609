    The second factor that affects the model generated from a data set is the choice
    of ML algorithm. There are many different ML algorithms, and each one encodes
    a different way to generalize from a data set. The type of generalization an algorithm
    encodes is known as the `learning bias` (or sometimes the `modeling` or `selection
    bias`) of the algorithm. For example, a `linear-regression` algorithm encodes
    a linear generalization from the data and as a result ignores nonlinear relationships
    that may fit the data more closely. Bias is normally understood as a bad thing.
    For example, the sampling bias is a bias that a data scientist will try to avoid.
    However, without a learning bias there can be no learning, and the algorithm will
    only be able to memorize the data.


    However, because ML algorithms are biased to look for different types of patterns,
    and because there is no one learning bias across all situations, there is no one
    best ML algorithm. In fact, a theorem known as the `no free lunch` theorem (Wolpert
    and Macready 1997) states that there is no one best ML algorithm that on average
    outperforms all other algorithms across all possible data sets. So the modeling
    phase of the `CRISP-DM` process normally involves building multiple models using
    different algorithms and comparing the models to identify which algorithm generates
    the best model. In effect, these experiments are testing which learning bias on
    average produces the best models for the given data set and task.


    ## Evaluating Models: Generalization Not Memorization


    Once a data scientist has selected a set of ML algorithms to experiment with on
    a data set, the next major task is to create a test plan for how the models generated
    by these algorithms will be evaluated. The goal of the test plan is to ensure
    that the evaluation provides realistic estimates of model performance on unseen
    data. A prediction model that simply memorizes a data set is unlikely to do a
    good job at estimating values for new examples. One problem with just memorizing
    data is that most data sets will contain noise. So a prediction model that merely
    memorizes data is also memorizing the noise in the data. Another problem with
    just memorizing the data is that it reduces the prediction process to a table
    lookup and leaves unsolved the problem of how to generalize from the training
    data to new examples that aren’t in the table.


    One part of the test plan relates to how the data set is used to train and test
    the models. The data set has to be used for two different purposes. The first
    is to find which algorithm generates the best models. The second is to estimate
    the generalization performance of the best model—that is, how well the model is
    likely to do on unseen data. The golden rule for evaluating models is that models
    should never be tested on the same data they were trained on. Using the same data
    for training and testing models is equivalent to giving a class of students the
    questions on the exam the night before the test is held. The students will of
    course do very well in the test, and their scores will not reflect their real
    proficiency with the general course material. So, too, with ML models: if a model
    is evaluated on the same data that it is trained on, the results of the evaluation
    will be optimistic compared to the model’s real performance. The standard process
    for ensuring that the models aren’t able to peek at the test data during training
    is to split the data into three parts: a training set, a validation set, and a
    test set. The proportions of the split will vary between projects, but splits
    of 50:20:30 and 40:20:30 are common. The size of the data set is a key factor
    in the splits: generally, the larger the data set, the larger the splits. The
    training set is used to train the models. The validation set is then used to compare
    the performance of these models. The test set is used to estimate the generalization
    performance of the final model.


    ## Summary


    This chapter started by noting that data science is a partnership between a data
    scientist and a computer. Machine learning provides a set of algorithms that generate
    models from a large data set. However, whether these models are useful will depend
    on the data scientist’s expertise. For a data science project to succeed, the
    data set should be representative of the domain and should include relevant attributes.
    The data scientist should evaluate a range of ML algorithms to find which one
    generates the best models. The model-evaluation process should follow the golden
    rule that a model should never be evaluated on the data it was trained on.

