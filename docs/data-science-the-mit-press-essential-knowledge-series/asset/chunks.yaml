    序数属性（Ordinal attributes）与名义属性相似，不同之处在于可以对序数属性的类别应用排序。例如，一个描述调查问卷回答的属性可能取值于“非常不喜欢、不喜欢、中立、喜欢和非常喜欢”这一领域的值。这些值之间存在着自然的顺序，从“非常不喜欢”到“非常喜欢”（或反之，取决于所使用的惯例）。然而，序数数据的一个重要特征是，这些值之间不存在等距离距离的概念。例如，“不喜欢”到“中立”之间的认知距离可能与“喜欢”到“非常喜欢”之间的距离不同。因此，在序数属性上应用算术运算（如求平均值）是不恰的。在表
    1 中，“版本”属性就是序数属性的一个示例。名义数据与序数数据之间的区别并不总是一目了然。例如，考虑一个描述天气的属性，其取值可以是“晴、、雨、多云”。某人可能认为该属性是名义的，值之间没有自然顺序；而另一个人可能主张该属性是序数的，将“多云”被视为“晴”和“雨”之间的中间值（Hall,
    Witten, and Frank 2011）。


    属性的数据类型（数值型、序数型、名义型）影响了我们分析和理解数据的方法，包括我们描述属性取值分布的统计统计方法，以及我们用于识别属性之间关系模式的更复杂的算法。在分析的最基础层面上，数值型属性允许算术运算，应用于数值型属性的典型统计分析是衡量其中心趋势（使用属性的平均值）和属性取值的离散程度（使用方差或标准差统计量）。然而，对名义或序数属性应用算术运算是没有意义的。因此，对这些类型属性的基本分析涉及统计每个值在数据集中出现的次数，或者计算每个值的出现比例，或两者兼之。


    数据是通过抽象过程生成的，因此任何数据都是人类决策和选择的结果。对于每一次抽象，都会有人（或一组人）就从什么中抽象、以及在抽象表示中使用哪些类别或度量做出选择。这种含义意味着数据永远不是对世界的客观描述。相反，它们始终是局部的且带有偏见的。正如阿尔弗雷德·柯布布斯基（Alfred
    Korzybski）所观察到的：“地图并不是它所代表的领域，但如果是正确的，它与领土具有相似的结构，这正是它有用之处”（1996, 58）。


    换句话说，我们用于数据科学的数据并不是我们试图理解的现实世界实体和过程完美表示，但如果我们设计和收集使用的数据时足够仔细，那么我们的分析结果将为现实世界的问题提供有用的见解。第一章中提到的“点球”故事是一个极好的例子，说明了许多数据科学项目的成功关键在于确定为特定领域使用正确的抽象（属性）。记住，“点球”故事的关键在于，奥克兰陆运动人队发现，球员的上垒率和长打率比打击率等传统棒球统计数据更适合预测球员的进攻成功。使用不同的属性描述球员让奥克兰陆运动人队拥有了比其他球队不同且更好的棒球模型，使他们能够识别出被低估的球员，并用较小的预算与更大的特许球队竞争。


    “点球”故事说明了计算机科学的老格言“垃圾进，垃圾出”（garbage in, garbage out）在数据科学中是成立的：如果计算过程的输入是错误的，那么过程的输出将是错误的。事实上，数据科学的两个特征怎么强调都不过：(*a*)
    为了数据科学取得成功，我们需要非常关注我们如何创建数据（包括我们在设计数据抽象时做出的选择以及抽象过程捕获的数据质量），以及 (*b*) 我们还需要对数据科学过程的结果进行“常识检查”（sense
    check）——也就是说，我们需要理解，仅仅因为计算机在数据中识别出了模式，并不意味着它识别出了我们试图分析的过程中的真实洞察；该模式可能仅仅是基于我们数据设计和捕获中的偏见。


    ## 数据视角


    除了数据类型（数值型、名义型和序数型）之外，关于数据还可以做出许多其他有用的区分。其中一种区分是`structured`（结构化）数据和`unstructured`（非结构化）数据。结构化数据是可以存储在表格中的数据，表格中的每个实例都具有相同的结构（即属性集合）。例如，考虑人口的人口统计数据，表格中的每行都描述一个人，并由同一组的人口统计属性（姓名、年龄、出生日期、地址、性别、教育程度、职业状况等）组成。结构化数据可以被存储、组织、搜索、重新排序并与其他结构化数据合并。将数据科学应用于结构化数据是相对容易的，因为根据定义，它已经是适用于集成到分析记录中的格式。`Unstructured
    data`（非结构化数据）是指数据集中每个实例可能有自己的内部结构，且这种结构在每个实例中并不一定相同。例如，想象一个网页数据集，每个网页都有结构，但这种结构在网页之间不同。非结构化数据比结构化数据常见得多。例如，人类文本集合（电子邮件、推文、短信、帖子、小说等）可以被视为非结构化数据，声音、图像、音乐、视频和多媒体文件也是如此。不同元素之间结构的差异意味着很难以原始形式分析非结构化数据。

