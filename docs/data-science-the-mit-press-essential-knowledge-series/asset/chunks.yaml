    大多数现代决策树学习机器学习算法的鼻祖是 `ID3 algorithm` (Quinlan 1986)。`ID3` 以递归的、深度优先的方式构建决策树，从根节点开始，每次添加一个节点。它首先在根节点选择一个属性进行测试。对于该测试属性域中的每个值，都从根节点生长出一个分支，并标记为该值。例如，一个具有二值属性的节点将引出两个分支。数据集中的每个实例被推入分支，并赋予与该实例测试属性值相同的标签。`ID3`
    然后使用与创建根节点相同的过程来生长每个分支：选择一个属性、添加一个节点、通过将实例向下分流数据集。这一过程一直持续，直到分支上的所有实例的目标属性值都相同，此时添加一个终止节点，并标记为分支上所有实例共有的目标属性值。


    `ID3` 在树的每个节点选择测试属性，以最小化创建纯集合所需的测试次数（即具有相同属性值的实例集合）。衡量集合纯度的一种方法是使用香农熵 `entropy`
    指标。集合可能的最小熵为零，纯集合的熵为零。集合可能的熵数值值取决于集合的大小以及集合中不同元素的数量。当集合中的所有元素都是不同类型时，集合具有最大熵。`ID3`
    选择节点处的测试属性为在该属性划分数据集后加权熵最低的属性。属性的加权熵计算方法为：(1) 使用属性划分数据集；(2) 计算结果集合的熵；(3) 根据数据占集合的比例对这些熵进行加权；(4)
    然后求和。


    `Table 3` 列出了电子邮件数据集，每封邮件通过属性数量以及是否为垃圾邮件进行描述。`attachment` 属性对于带有附件的邮件为真，否则为假（样本中，没有邮件带有附件）。如果邮件包含预定义单词列表中的一个或多个单词，则
    `suspicious words` 属性为真。如果邮件发送者不在收件人的通讯录中，`unknown sender` 属性为真。这就是用于训练图 16 所示决策树的数据集。在这个数据集中，`attachment`、`suspicious
    words` 和 `unknown sender` 属性是输入属性，而 `spam` 属性是目标。`unknown sender` 属性将数据集划分成比任何其他属性更纯的集合（一个包含
    `Spam = True` 实例的集合，另一个大多数实例 `Spam = False`）。因此，将 `unknown sender` 置于根节点（见图 17）。在此初始划分后，右分支上的所有实例具有相同的目标值。然而，左分支上的实例具有不同的目标值。使用
    `suspicious words` 属性划分左分支实例得到两个纯集合：一个 `Spam = False`，另一个 `Spam = True`。因此，选择
    `suspicious words` 为左分支上新节点的测试属性（见图 18）。此时，每个分支末端的数据子集是纯的，因此算法结束并返回图 16 所示的决策树。


    ![表 3 电子邮件数据集：是垃圾邮件还是不是？](img/11140_004_T3.png)


    `Table 3` 电子邮件数据集：是垃圾邮件还是不是？


    ![图 17 在树中创建根节点。](img/11140_004_fig_017.jpg)


    `Figure 17` 在树中创建根节点。


    ![图 18 在树中添加第二个节点。](img/11140_004_fig_018.jpg)


    `Figure 18` 在树中添加第二个节点。


    决策树的优点之一是简单理解。此外，还可以基于决策树创建非常准确的模型。例如，`random forest model` 由一组决策树组成，其中每棵树都在训练数据的随机子样本上进行训练，模型对单个查询返回的预测是森林中所有树的多数预测结果。虽然决策树处理名义数据和序数数据的效果良好，但在处理数值数据时却很吃力。在决策树中，每个节点都会根据测试属性域中的每个值引出一个单独的分。然而，数值属性的域具有无限数量的值，这意味着树需要无限数量的分支。解决此问题的方法是将数值属性转换为序数属性，尽管需要定义合适的阈值，这也很困难。


    最后，由于决策树学习算法在树变大时会反复划分数据集，它变得对噪声（如标记错误的实例）更加敏感。每个分支上的示例子集变得越来越小，因此每个分类规则基于的数据样本也变得越来越小。定义分类规则的数据样本越小，该规则对噪声就越敏感。因此，保持决策树浅层是一个好主意。一种方法是当分支上的实例数量少于预定义的阈值（例如
    20 个实例）时停止分支的生长。其他方法允许树生长然后进行剪枝。这些方法通常使用统计检验或模型在为该任务专门选择的实例集上的性能来识别树底部应该移除的划分。


    ## 数据科学中的偏差


    机器学习的目标是创建从数据集中编码适当泛化的模型。有两个主要因素影响机器学习算法从数据生成的泛化结果（或模型）。第一个因素是运行算法的数据集。如果数据集不能代表总体，那么算法生成的模型将是不准确的。例如，之前我们开发了一个回归模型，根据
    BMI 预测个体患上 2 型糖尿病的可能性。该模型是根据美国白人男性的数据集生成的。因此，如果用该模型预测女性或不同种族/民族背景男性的糖尿病概率，它不太可能是准确的。`sample
    bias` 术语描述了选择数据集的过程如何向后续分析引入偏差，无论是统计分析还是使用机器学习生成的预测模型。


    '
