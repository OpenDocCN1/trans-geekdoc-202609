  trans: '


    在我们对美国白人成年男性 2 型糖尿病原因的案例研究中，我们感兴趣的是识别是否某些属性与描述个人糖尿病概率的目标属性具有强相关性。图 10 展示了另外三个散点图，每个图都描绘了目标属性（糖尿病）与另一个属性（身高、体重和
    BMI）之间的相关性。在身高和糖尿病的散点图中，数据中没有出现任何特定的模式，表明这两种属性之间没有实际的相关性（皮尔逊系数为 `r` = −0.277）。中间的散点图显示了使用体重和糖尿病绘制的数据分布。数据的离散程度表明这两个属性之间存在正相关：体重越重，患糖尿病的可能性就越大（皮尔逊系数为
    `r` = 0.655）。底部的散点图显示了使用 BMI 和糖尿病绘制的数据。该散点图的模式与中间的散点图相似：数据从左下角到右上角扩散，表明存在正相关。然而，在这个散点图中实例聚集得更加紧密，表明
    BMI 与糖尿病之间的相关性比体重与糖尿病之间的相关性更。事实上，该数据集中糖尿病和 BMI 的皮尔逊系数为 `r` = 0.877。


    ![图 10 关于身高、体重和 BMI 与糖尿病概率的散点图](img/11140_004_fig_010.jpg)


    图 10 关于身高、体重和 BMI 与糖尿病概率的散点图。


    BMI 的示例说明了通过定义一个接受多个属性作为输入的函数可以创建一个新的派生属性。它还显示计算此派生属性与数据集中另一个属性之间的皮尔逊相关性是可能的。此外，派生属性与目标属性的相关性实际上可以高于生成该属性的任何属性。理解为什么
    BMI 与糖尿病属性的相关性高于身高或体重的相关性，一种方法是：个人患糖尿病的可能性取决于身高和体重之间的相互作用，而 BMI 属性恰当地对这种相互作用进行了建模。临床医生关注人的
    BMI 是因为比起单独看个人的身高或体重，BMI 能提供更多关于个人患 2 型糖尿病概率的信息。


    我们已经注意到属性选择是数据科学中的一项关键任务。属性设计也是。设计一个与我们感兴趣的属性具有强相关性的派生属性，通常是数据科学真正的价值所在。一旦你知道了用于表示数据的正确属性，你就能相对快速地构建准确的模型。发现和设计正确的属性是困难的部分。在
    BMI 的情况下，这种派生属性是由人类在 19 世纪设计的。然而，机器学习（ML）算法可以通过搜索不同的属性组合并检查这些组合与目标属性之间的相关性，来学习属性之间的相互作用并创建有用的派生属性。这就是为什么在许多弱的相互作用属性共同导致我们试图理解的过程的背景下，机器学习是很有用的。


    识别与目标属性具有高相关性的属性（原始或派生的）是有用的，因为相关属性可能让我们对导致目标属性所代表的现象的原理产生洞察：BMI 与个人患糖尿病概率强相关这一事实表明，并不是体重本身导致了个人患糖尿病，而是该个人是否超重。此外，如果一个输入属性与目标属性高度相关，那么它可能是预测模型的有用输入。与相关性分析类似，预测涉及分析属性之间的关系。为了能够从一组输入属性的值映射到目标属性，输入属性（或其上的派生函数）与目标属性之间必须存在相关性。如果这种相关性不存在（或算法无法找到），则输入属性对于预测问题是无关的，模型能做的最好就是忽略这些输入，并始终预测数据集中该目标的中心趋势²。相反，如果输入属性与目标之间确实存在强相关性，那么机器学习很可能生成一个非常准确的预测模型。


    ### 线性回归


    当数据集由数值属性组成时，经常使用基于回归的预测模型。`回归分析`估计了当所有输入属性固定时，数值型目标属性的预期（或平均）值。回归分析的第一步是假设输入属性与目标之间关系的结构。然后定义该假设关系的参数化数学模型。这个参数化模型被称为`回归函数`。你可以将回归函数看作一个将输入转换为输出值的机器，将参数看作控制机器行为的设置。回归函数可能有多个参数，回归分析的重点是为这些参数找到正确的设置。


    使用回归分析可以假设并对属性之间的许多不同类型关系进行建模。从原则上讲，对可以建模的关系结构的唯一限制是定义适当回归函数的能力。在某些领域，可能存在强有理论理由来断定特定类型的关系，但在缺乏这类领域理论的情况下，良好的做法是从假设最简单的关系形式——即线性关系开始，然后根据需要进展到对复杂关系的建模。从线性关系开始的一个原因是，线性回归函数相对容易解释。另一个原因是常识性的观点，即将事情保持尽可能简单通常是一个好主意。


    当假设为线性关系时，回归分析被称为`线性回归`。线性回归最简单的应用是对两个属性之间的关系建模：一个输入属性 `X` 和目标属性 `Y`。在这个简单的线性回归问题中，回归函数具有如下形式：


    ![11140\_e004\_001.jpg](img/11140_e004_001.jpg)


    这个回归函数就是直线的方程（通常写为 `y = mx + c`），大多数人在中学几何中对这个方程并不陌生。[³]](#c11140_004.xhtml#FN13)。变量
    `ω[0]` 和 `ω[1]` 是回归函数的参数。修改这些参数会改变函数从输入 `X` 到输出 `Y` 的映射方式。参数 `ω[0]` 是 `y 轴截距`（或中学几何中的
    `c`），指定了当 `X` 等于零时直线穿越垂直 `y` 轴的位置。参数 `ω[1]` 定义了线的斜率（即它等同于中学版本中的 `m`）。


    '
