- raw: "    All organizations have applications that generate and capture data about\
    \ customers, transactions, and operational data on everything to do with how the\
    \ organization operates. Such data sources and applications include customer management,\
    \ orders, manufacturing, delivery, invoicing, banking, finance, customer-relationship\
    \ management (CRM), call center, enterprise resource planning (ERP) applications,\
    \ and so on. These types of applications are commonly referred to as *online transaction\
    \ processing* (OLTP) systems. For many data science projects, the data from these\
    \ applications will be used to form the initial input data set for the ML algorithms.\
    \ Over time, the volume of data captured by the various applications in the organization\
    \ grows ever larger and the organization will start to branch out to capture data\
    \ that was ignored, wasn’t captured previously, or wasn’t available previously.\
    \ These newer data are commonly referred to as “big-data sources” because the\
    \ volume of data that is captured is significantly higher than the organization’s\
    \ main operational applications. Some of the common big-data sources include network\
    \ traffic, logging data from various applications, sensor data, weblog data, social\
    \ media data, website data, and so on. In traditional data sources, the data are\
    \ typically stored in a database. However, because the applications associated\
    \ with many of the newer big-data sources are not primarily designed to store\
    \ data long term—for example, with streaming data—the storage formats and structures\
    \ for this type of data vary from application to application.\n\n    As the number\
    \ of data sources increases, so does the challenge of being able to use these\
    \ data for analytics and for sharing them across the wider organization. The data-storage\
    \ layer, shown in [figure 6](#c11140_003.xhtml#fig_006), is typically used to\
    \ address the data sharing and data analytics across an organization. This layer\
    \ is divided into two parts. The first part covers the typical data-sharing software\
    \ used by most organizations. The most popular form of traditional data-integration\
    \ and storage software is a relational database management system (RDBMS). These\
    \ traditional systems are often the backbone of the business intelligence (BI)\
    \ solutions within an organization. A BI solution is a user-friendly decision-support\
    \ system that provides data aggregating, integration, and reporting as well as\
    \ analysis functionality. Depending on the maturity level of a BI architecture,\
    \ it can consist of anything from a basic copy of an operational application to\
    \ an *operational data store* (ODS) to *massively parallel processing* (MPP) BI\
    \ database solutions and data warehouses.\n\n    Data warehousing is best understood\
    \ as a process of data aggregation and analysis with the goal of supporting decision\
    \ making. However, the focus of this process is the creation of a well-designed\
    \ and centralized data repository, and the term *data warehouse* is sometimes\
    \ used to denote this type of data repository. In this sense, a data warehouse\
    \ is a powerful resource for data science. From a data science perspective, one\
    \ of the major advantages of having a data warehouse in place is a much shorter\
    \ project time. The key ingredient in any data science process is data, so it\
    \ is not surprising that in many data science projects the majority of time and\
    \ effort goes into finding, aggregating, and cleaning the data prior to their\
    \ analysis. If a data warehouse is available in a company, then the effort and\
    \ time that go into data preparation on individual data science projects is often\
    \ significantly reduced. However, it is possible to do data science without a\
    \ centralized data repository. Constructing a centralized repository of data involves\
    \ more than simply dumping the data from multiple operational databases into a\
    \ single database.\n\n    Merging data from multiple databases often requires\
    \ much complex manual work to resolve inconsistencies between the source databases.\
    \ *Extraction, transformation, and load* (ETL) is the term used to describe the\
    \ typical processes and tools used to support the mapping, merging, and movement\
    \ of data between databases. The typical operations carried out in a data warehouse\
    \ are different from the simple operations normally applied to a standard relational\
    \ data model database. The term *online analytical processing* (OLAP) is used\
    \ to describe these operations. OLAP operations are generally focused on generating\
    \ summaries of historic data and involve aggregating data from multiple sources.\
    \ For example, we might pose the following OLAP request (expressed here in English\
    \ for readability): “*Report the sales of all stores by region and by quarter\
    \ and compare these figures to last year’s figures.*” What this example illustrates\
    \ is that the result of an OLAP request often resembles what you would expect\
    \ to see as a standard business report. OLAP operations essentially enable users\
    \ to slice, dice, and pivot the data in the warehouse and get different views\
    \ of these data. They work on a data representation called a *data cube* that\
    \ is built on top of the data warehouse. A data cube has a fixed, predefined set\
    \ of dimensions in which each dimension represents a particular characteristic\
    \ of the data. The required data-cube dimensions for the example OLAP request\
    \ given earlier would be *sales by stores*, *sales by region*, and *sales by quarter*.\
    \ The primary advantage of using a data cube with a fixed set of dimensions is\
    \ that it speeds up the response time of OLAP operations. Also, because the set\
    \ of data-cube dimensions is preprogrammed into the OLAP system, the system can\
    \ provide user-friendly graphical user interfaces for defining OLAP requests.\
    \ However, the data-cube representation also restricts the types of analysis that\
    \ can be done using OLAP to the set of queries that can be generated using the\
    \ predefined dimensions. By comparison, SQL provides a more flexible query interface.\
    \ Also, although OLAP systems are useful for data exploration and reporting, they\
    \ don’t enable data modeling or the automatic extraction of patterns from the\
    \ data. Once the data from across an organization has been aggregated and analyzed\
    \ within the BI system, this analysis can then be used as input to a range of\
    \ consumers in the applications layer of [figure 6](#c11140_003.xhtml#fig_006)."
