    Finally, the world changes, and models don’t. Implicit in the ML process of data
    set construction, model training, and model evaluation is the assumption that
    the future will be the same as the past. This assumption is known as the `stationarity
    assumption`: the processes or behaviors that are being modeled are stationary
    through time (i.e., they don’t change). Data sets are intrinsically historic in
    the sense that data are representations of observations that were made in the
    past. So, in effect, ML algorithms search through the past for patterns that might
    generalize to the future. Obviously, this assumption doesn’t always hold. Data
    scientists use the term `concept drift` to describe how a process or behavior
    can change, or drift, as time passes. This is why models go out of date and need
    to be retrained and why the CRISP-DM process includes the outer circle shown in
    [figure 4](#c11140_002.xhtml#fig_004) to emphasize that data science is iterative.
    Processes need to put in place postmodel deployment to ensure that a model has
    not gone stale, and when it has, it should be retrained. The majority of these
    decisions cannot be automated and require human insight and knowledge. A computer
    will answer the question it is posed, but unless care is taken, it is very easy
    to pose the wrong question.


    # 5 Standard Data Science Tasks


    One of the most important skills for a data scientist is the ability to frame
    a real-world problem as a standard data science task. Most data science projects
    can be classified as belonging to one of four general classes of task:


    *   Clustering (or segmentation)

    *   Anomaly (or outlier) detection

    *   Association-rule mining

    *   Prediction (including the subproblems of classification and regression)


    Understanding which task a project is targeting can help with many project decisions.
    For example, training a prediction model requires that each of the instances in
    the data set include the value of the target attribute. So knowing that the project
    is doing prediction gives guidance (through requirements) in terms of data set
    design. Understanding the task also informs which ML algorithm(s) to use. Although
    there are a large number of ML algorithms, each algorithm is designed for a particular
    data-mining task. For example, ML algorithms that generate decision-tree models
    are designed primarily for prediction tasks. There is a many-to-one relationship
    between ML algorithms and a task, so knowing the task doesn’t tell you exactly
    which algorithm to use, but it does define a set of algorithms that are designed
    for the task. Because the data science task affects both the data set design and
    the selection of ML algorithms, the decision regarding which task the project
    will target has to be made early on in the project life cycle, ideally during
    the business-understanding phase of the CRISP-DM life cycle. To provide a better
    understanding of each of these tasks, this chapter describes how some standard
    business problems map to tasks.


    ## Who Are Our Customers? (Clustering)


    One of the most frequent application areas of data science in business is to support
    marketing and sales campaigns. Designing a targeted marketing campaign requires
    an understanding of the target customer. Most businesses have a diverse range
    of customers with a variety of needs, so using a one-size-fits-all approach is
    likely to fail with a large segment of a customer base. A better approach is to
    try to identify a number of customer personas or customer profiles, each of which
    relates to a significant segment.


    The standard data science approach to this is to frame the problem as `clustering`
    task. Clustering involves sorting the instances into subgroups. Usually clustering
    requires an analyst to first decide on the number of subgroups they would like
    identified. This decision may be based on domain knowledge or informed by project
    goals. A clustering algorithm is then run on the data with the desired number
    as one of the algorithm parameters. The algorithm then creates that number of
    subgroups based on the similarity of attribute values. Once the algorithm has
    created the clusters, a human expert reviews them to interpret whether they are
    meaningful. In the context of designing a marketing campaign, this review involves
    checking whether the groups reflect sensible personas or identify new personas
    previously considered.


    The range of attributes that can be used to describe customers for clustering
    is vast. Some typical examples include demographic information (age, gender, etc.),
    location (ZIP code, rural or urban address, etc.), transactional information (e.g.,
    what products or services they have purchased), the revenue the company generates
    from them, how long have been customers, if they are a member of a loyalty-card
    scheme, whether they ever returned a product or made a complaint about a service,
    and so on. As is true of all data science projects, one of the biggest challenges
    with clustering is to decide which attributes to include and which to exclude
    so as to get the best results. Making this decision on attribute selection will
    involve iterations of experiments and human analysis of the results of each iteration.


    The best-known ML algorithm for clustering is the `k-means` algorithm. The `k`
    in the name signals that the algorithm looks for `k` clusters in the data. The
    value of `k` is predefined and is often set through a process of trial-and-error
    experimentation with different values of `k`. The `k-means` algorithm assumes
    that all the attributes describing the customers in the data set are numeric.
    If the data set contains nonnumeric attributes, then these attributes need to
    be mapped to numeric values in order to use `k-means`, or the algorithm will need
    to be amended to handle these nonnumeric values. The algorithm treats each customer
    as a point in a point cloud (or scatterplot), where the customer’s position is
    determined by the attribute values in her profile. The goal of the algorithm is
    to find the position of each cluster’s center in the point cloud. There are `k`
    clusters, so there are `k` cluster centers (or means)—hence the name of the algorithm.

