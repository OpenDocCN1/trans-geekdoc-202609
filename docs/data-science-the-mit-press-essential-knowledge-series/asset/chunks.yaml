  trans: '

    正如我们之前看到的网络一样，图 15 所示的是一个全连接的前馈网络。然而，并不是所有网络都是全连接的前馈网络。事实上，人们已经开发了无数网络拓扑结构。例如，`循环神经网络`
    (RNNs) 在网络拓扑结构中引入了循环：神经元对某个输入的输出会在处理下一个输入时被馈回该神经元中。这种循环赋予了网络记忆，使其能够根据之前处理过的输入语境来处理每个输入。因此，RNN
    适用于处理语言等序列表数据。⁹ 另一种众名的深度神经网络架构是`卷积神经网络` (CNN)。CNN 最初设计用于处理图像数据（Le Cun 1989）。图像识别网络的一个理想特性是：它应该能够识别某个视觉特征是否出现在图像中，无论它出现在图像的哪个位置。例如，如果一个网络正在进行人脸识别，它需要能够识别眼睛的形状，无论眼睛是在图像的右上角还是中心。CNN
    通过让一组神经元在输入上共享同一组权重来实现这一点。在这种语境下，将一组输入权重看作定义了一个函数，当传入该函数的像素集中出现某个特定的视觉特征时，该函数返回真。这意味着共享权重的每个神经元组都会学习识别特定的视觉特征，而该组中的每个神经元都充当该特征的检测器。在
    CNN 中，每组内部的神经元排列方式使得每个神经元检查图像中不同的位置，而该组则覆盖了整个图像。因此，如果该组检测到的视觉特征出现在图像的任何位置，该组中的一个神经元就能识别出它。


    深度神经网络的力量在于它们可以自动学习有用的属性，例如 CNN 中的特征检测器。事实上，深度学习有时被称为`表示学习`，因为这些深度网络本质上是在学习输入数据的一种新表示，这种表示比原始原始输入更能预测目标输出属性。网络中的每个神经元都定义了一个函数，将输入到神经元的值映射到新的输出属性。因此，网络第一层的神经元可能会学习一种将原始输入值（如体重和身高）映射为比单个输入值更有用的属性（如
    BMI）的函数。然而，该神经元的输出连同它在第一层中的兄弟神经元的输出，会被馈入第二层的神经元中，而这些第二层神经元则尝试学习将第一层的输出映射为新的、更有用的表示的函数。这种将输入映射到新属性并将这些新属性作为新函数的输入的过程贯穿整个网络，随着网络变得越来越深，它可以学习从原始输入到新属性表示的越来越复杂的映射。正是这种自动学习输入数据到有用属性表示的复杂映射的能力，使得深度学习模型在处理高维输入任务（如图像和文本处理）时如此准确。


    长期以来人们知道，增加神经网络的深度允许网络学习更复杂的数据映射。然而，深度学习直到几年前才真正兴起，是因为使用随机权重初始化后反向传播算法的标准组合在深度网络中效果并不良好。反向传播算法的一个问题是，误差在回溯层层传播时会被共享，因此在深度网络中，当算法到达网络的早期层时，误差估计已不再那么好用了。10)
    这导致网络早期部分的层无法为数据学习有用的变换。然而，在过去的几年里，研究人员开发了新类型的神经元以及反向传播算法的改进来解决这一问题。还发现，小心网络权重的初始化方式也有帮助。以前让训练深度网络变得困难的另外两个因素是：训练神经网络需要大量的计算能力，而且神经网络在大量训练数据时工作效果最好。然而，正如我们已经讨论过的，近年来计算能力的可用性和大型数据集的大幅增加，使得深度网络的训练变得更可行了。


    ### 决策树


    线性回归和神经网络对于数值型输入效果最好。然而，如果数据集中的输入属性主要是类名的（nominal）或序类的（ordinal），那么其他机器学习算法和模型（如`决策树`）可能更加合适。


    决策树在树结构中编码了一组 `if...then...else...` 规则。图 16 展示了一个用于判断邮件是否为垃圾邮件的决策树。圆角矩形表示对属性的测试，正方形节点表示决策节点或分类节点。这棵树编码了以下规则：`如果邮件来自未知发送者，那么它就是垃圾邮件；如果它不是来自未知发送者但包含可疑词汇，那么它就是垃圾邮件；如果它既不是来自未知发送者也不包含可疑词汇，那么它不是垃圾邮件`。在决策树中，实例的判断是从树的顶部开始，通过对实例应用一系列属性测试向下导航完成的。树中的每个节点都指定一个要测试的属性，该过程通过选择当前节点中标签与实例测试属性值匹配的分支，逐节点地向下遍历树。最终决策是实例所到达的终止节点（或`叶子`节点）的标签。


    ![图 16 用于判断邮件是否为垃圾邮件的决策树。](img/11140_004_fig_016.jpg)


    图 16 用于判断邮件是否为垃圾邮件的决策树。


    决策树中的每条从根到叶的路径都定义了一个由一系列测试组成的分类规则。决策树学习算法的目标是找到一组分类规则，将训练数据集划分为具有相同目标属性值的实例集。其核心思想是：如果一条分类规则能从数据集中分离出具有相同目标值的子集，并且该分类规则对于一个新实例是成立（即该实例进入了树中的该路径），那么该新实例的正确预测值很可能是符合该规则的所有训练实例所共享的目标值。

    '
