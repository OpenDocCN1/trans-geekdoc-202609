    ## A Brief History of Data Science


    The term `data science` has a specific history dating back to the 1990s. However,
    the fields that it draws upon have a much longer history. One thread in this longer
    history is the history of data collection; another is the history of data analysis.
    In this section, we review the main developments in these threads and describe
    how and why they converged into the field of data science. Of necessity, this
    review introduces new terminology as we describe and name the important technical
    innovations as they arose. For each new term, we provide a brief explanation of
    its meaning; we return to many of these terms later in the book and provide a
    more detailed explanation of them. We begin with a history of data collection,
    then give a history of data analysis, and, finally, cover the development of data
    science.


    ### A History of Data Gathering


    The earliest methods for recording data may have been notches on sticks to mark
    the passing of the days or poles stuck in the ground to mark sunrise on the solstices.
