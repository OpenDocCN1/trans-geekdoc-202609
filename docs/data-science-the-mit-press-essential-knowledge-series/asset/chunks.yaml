- raw: "    Training a neural network involves finding the correct weights for the\
    \ connections in the network. To understand how to train a network, it is useful\
    \ to begin by thinking about how to train the weights for a single neuron in the\
    \ output layer of the network. Assume that we have a training data set that has\
    \ both inputs and target output for each instance. Also, assume that the connections\
    \ coming into the neuron already have weights assigned to them. If we take an\
    \ instance from the data set and present the values of the input attributes for\
    \ this instance to the network, the neuron will output a prediction for the target.\
    \ By subtracting this prediction from the value for the target in the data set,\
    \ we can measure the neuron’s error on that instance. Using some basic calculus,\
    \ it is possible to derive a rule to update the weights on the connections coming\
    \ into a neuron given a measure of the neuron’s output error so as to reduce the\
    \ neuron’s error. The precise definition of this rule will vary depending on the\
    \ activation function used by the neuron because the activation function affects\
    \ the derivative used in the derivation of the rule. But we can give the following\
    \ intuitive explanation of how the weight-update rule works:\n\n    1.  If the\
    \ error is 0, then we should not change the weights on the inputs.\n\n    2. \
    \ If the error is positive, we will decrease the error if we increase the neuron’s\
    \ output, so we must increase the weights for all the connections where the input\
    \ is positive and decrease the weights for the connections where the input is\
    \ negative.\n\n    3.  If the error is negative, we will decrease the error if\
    \ we decrease the neuron’s output, so we must decrease the weights for all the\
    \ connections where the input is positive and increase the weights for the connections\
    \ where the input is negative.\n\n    The difficulty in training a neural network\
    \ is that the weight-update rule requires an estimate of the error at a neuron,\
    \ and although it is straightforward to calculate the error for each neuron in\
    \ the output layer of the network, it is difficult to calculate the error for\
    \ the neurons in the earlier layers. The standard way to train a neural network\
    \ is to use an algorithm called the *backpropagation algorithm* to calculate the\
    \ error for each neuron in the network and then use the weight-update rule to\
    \ modify the weights in the network.[⁷](#c11140_004.xhtml#FN17) The backpropagation\
    \ algorithm is a supervised ML algorithm, so it assumes a training data set that\
    \ has both inputs and the target output for each instance. The training starts\
    \ by assigning random weights to each of the connections in the network. The algorithm\
    \ then iteratively updates the weights in the network by showing training instances\
    \ from the data set to the network and updating the network weights until the\
    \ network is working as expected. The algorithm’s name comes from the fact that\
    \ after each training instance is presented to the network, the algorithm passes\
    \ (or backpropagates) the error of the network back through the network starting\
    \ at the output layer and at each layer in the network calculates the error for\
    \ the neurons in that layer before sharing this error back to the neurons in the\
    \ preceding layer. The main steps in the algorithm are as follows:\n\n    1. \
    \ Calculate the error for the neurons in the output layer and use the weight-update\
    \ rule to update the weights coming into these neurons.\n\n    2.  Share the error\
    \ calculated at a neuron with each of the neurons in the preceding layer that\
    \ is connected to that neuron in proportion to the weight of the connection between\
    \ the two neurons.\n\n    3.  For each neuron in the preceding layer, calculate\
    \ the overall error of the network that the neuron is responsible for by summing\
    \ the errors that have been backpropagated to it and use the result of this error\
    \ summation to update the weights on the connections coming into this neuron.\n\
    \n    4.  Work back through the rest of the layers in the network by repeating\
    \ steps 2 and 3 until the weights between the input neurons and the first layer\
    \ of hidden neurons have been updated.\n\n    In backpropagation, the weight updates\
    \ for each neurons are scaled to reduce but not to eliminate the neuron’s error\
    \ in the training instance. The reason for this is that the goal of training the\
    \ network is to enable it to generalize to new instances that are not in the training\
    \ data rather than to memorize the training data. So each set of weight updates\
    \ nudges the network toward a set of weights that are generally better over the\
    \ whole data set, and over many iterations the network converges on a set of weights\
    \ that captures the general distribution of the data rather than the specifics\
    \ of the training instances. In some versions of backpropagation, the weights\
    \ are updated after a number of instances (or batch of instances) have been presented\
    \ to the network rather than after each training instance. The only adjustment\
    \ required in these versions is that the algorithm uses the average error of the\
    \ network on a batch as the measure of error at the output layer for the weight-update\
    \ process.\n\n    One of the most exciting technical developments in the past\
    \ 10 years has been the emergence of deep learning. *Deep-learning networks* are\
    \ simply neural networks that have multiple[⁸](#c11140_004.xhtml#FN18) layers\
    \ of hidden units; in other words, they are *deep* in terms of the number of hidden\
    \ layers they have. The neural network in [figure 15](#c11140_004.xhtml#fig_015)\
    \ has five layers: one input layer on the left containing three neurons, three\
    \ hidden layers (the black circles), and one output layer on the right containing\
    \ two neurons. This network illustrates that it is possible to have a different\
    \ number of neurons in each layer: the input layer has three neurons; the first\
    \ hidden layer has five; each of the next two hidden layers has four; and the\
    \ output layer has two. This network also shows that it is possible to have multiple\
    \ neurons in the output layer. Using multiple output neurons is useful if the\
    \ target is a nominal or ordinal data type that has distinct levels. In these\
    \ scenarios, the network is set up so that there is one output neuron for each\
    \ level, and the network is trained so that for each input only one of the output\
    \ neurons outputs a high activation (denoting the predicted target level).\n\n\
    \    ![Figure 15 A deep neural network.](images/11140_004_fig_015.jpg)\n\n   \
    \ [Figure 15](#c11140_004.xhtml#fig_015a) A deep neural network."
  fmt: '

    Training a neural network involves finding the correct weights for the connections
    in the network. To understand how to train a network, it is useful to begin by
    thinking about how to train the weights for a single neuron in the output layer
    of the network. Assume that we have a training data set that has both inputs and
    target output for each instance. Also, assume that the connections coming into
    the neuron already have weights assigned to them. If we take an instance from
    the data set and present the values of the input attributes for this instance
    to the network, the neuron will output a prediction for the target. By subtracting
    this prediction from the value for the target in the data set, we can measure
    the neuron’s error on that instance. Using some basic calculus, it is possible
    to derive a rule to update the weights on the connections coming into a neuron
    given a measure of the neuron’s output error so as to reduce the neuron’s error.
    The precise definition of this rule will vary depending on the activation function
    used by the neuron because the activation function affects the derivative used
    in the derivation of the rule. But we can give the following intuitive explanation
    of how the weight-update rule works:


    1. If the error is 0, then we should not change the weights on the inputs.

    2. If the error is positive, we will decrease the error if we increase the neuron’s
    output, so we must increase the weights for all the connections where the input
    is positive and decrease the weights for the connections where the input is negative.

    3. If the error is negative, we will decrease the error if we decrease the neuron’s
    output, so we must decrease the weights for all the connections where the input
    is positive and increase the weights for the connections where the input is negative.


    The difficulty in training a neural network is that the weight-update rule requires
    an estimate of the error at a neuron, and although it is straightforward to calculate
    the error for each neuron in the output layer of the network, it is difficult
    to calculate the error for the neurons in the earlier layers. The standard way
    to train a neural network is to use an algorithm called the `backpropagation algorithm`
    to calculate the error for each neuron in the network and then use the weight-update
    rule to modify the weights in the network. [⁷](#c11140_004.xhtml#FN17) The backpropagation
    algorithm is a supervised ML algorithm, so it assumes a training data set that
    has both inputs and the target output for each instance. The training starts by
    assigning random weights to each of the connections in the network. The algorithm
    then iteratively updates the weights in the network by showing training instances
    from the data set to the network and updating the network weights until the network
    is working as expected. The algorithm’s name comes from the fact that after each
    training instance is presented to the network, the algorithm passes (or backpropagates)
    the error of the network back through the network starting at the output layer
    and at each layer in the network calculates the error for the neurons in that
    layer before sharing this error back to the neurons in the preceding layer. The
    main steps in the algorithm are as follows:


    1. Calculate the error for the neurons in the output layer and use the weight-update
    rule to update the weights coming into these neurons.

    2. Share the error calculated at a neuron with each of the neurons in the preceding
    layer that is connected to that neuron in proportion to the weight of the connection
    between the two neurons.

    3. For each neuron in the preceding layer, calculate the overall error of the
    network that it is responsible for by summing the errors that have been backpropagated
    to it and use the result of this summation to update the weights coming into this
    neuron.

    4. Work back through the rest of the layers in the network by repeating steps
    2 and 3 until the weights between the input neurons and the first layer have been
    updated.


    In backpropagation, the weight updates for each neurons are scaled to reduce but
    not eliminate the error. The reason for this is that the goal of training the
    network is to generalize to new instances that are not in the training data rather
    than to memorize the data. So each set of weight updates nudges the network toward
    a set of weights that are generally better over the whole data, and over many
    iterations the network converges on a set of weights that captures the general
    distribution of the data rather than the specifics of the instances. In some versions
    of backpropagation, the weights are updated after a number of instances (or batch
    of instances) have been presented to the network rather than after each instance.
    The only adjustment required in these versions is that the algorithm uses the
    average error of the network on a batch as the measure of error at the output
    layer for the weight-update process.


    One of the most exciting technical developments in the past 10 years has been
    the emergence of deep learning. `Deep learning networks` are simply neural networks
    that have multiple[⁸](#c11140_004.xhtml#FN18) layers of hidden units; in other
    words, they are `deep` in terms of the number of hidden layers they have. The
    neural network in [figure 15](#c11140_004.xhtml#fig_015) has five layers: one
    input layer on the left containing three neurons, three hidden layers (the black
    circles), and one output layer on the right containing two neurons. This network
    illustrates that it is possible to have a different number of neurons in each
    layer: the input layer has three neurons; the first hidden layer has five; each
    of the next two hidden layers has four; and the output layer has two. This network
    also shows that it is possible to have multiple neurons in the output layer. Using
    multiple output neurons is useful if the target is a nominal or ordinal data type
    that has distinct levels. In these scenarios, the network is set up so that there
    is one output neuron for each level, and the network is trained so that for each
    input only one of the output neurons outputs a high activation (denoting the predicted
    target level).


    ![Figure 15 A deep neural network.](images/11140_004_fig_015.jpg)


    [Figure 15](#c11140_004.xhtml#fig_015a) A deep neural network.

    '
  trans: '

    训练神经网络涉及为网络中的连接找到正确的权重。为了理解如何训练网络，从考虑如何训练网络输出层中单个神经元的权重开始是很有用的。假设我们有一个训练数据集，其中每个实例都包含输入和目标输出。同时，假设进入该神经元的连接已经分配了权重。如果我们从数据集中取一个实例，并将该实例的输入属性值呈现给网络，神经元将对目标输出一个预测值。通过从数据集中的目标值中减去此预测值，我们可以衡量该神经元在该实例上的误差。利用一些基础微积分知识，可以推导出一种规则，在给定神经元输出误差测量值的情况下，更新进入该神经元的连接的权重，以减小该神经元的误差。该规则的精确定义取决于神经元所使用的激活函数，因为激活函数会影响推导该规则时用到的导数。但我们可以对权重更新规则的运作原理给出如下直观的解释：


    1. 如果误差为 0，则我们不应该改变输入上的权重。

    2. 如果误差为正，那么增加神经元的输出将减少误差，因此我们必须增加所有输入为正的连接的权重，并减小输入为负的连接的权重。

    3. 如果误差为负，那么减少神经元的输出将减少误差，因此我们必须减小所有输入为正的连接的权重，并增加输入为负的连接的权重。


    训练神经网络的困难在于，权重更新规则需要对神经元的误差进行估计，虽然计算网络输出层每个神经元的误差很容易，但计算较浅层神经元的误差却很难。训练神经网络的标准方法是使用名为`backpropagation
    algorithm`（反向传播算法）的算法来计算网络中每个神经元的误差，然后使用权重更新规则修改网络中的权重。⁷ 反向传播算法是一种监督式机器学习（supervised
    反向传播 ML algorithm）算法，因此它假设训练数据集每个实例都包含输入和目标输出。训练从为网络中的每个连接分配随机权重开始。然后，算法通过向网络展示数据集中的训练实例并不断更新网络权重，直到网络运行符合预期。该算法的名称来源于：在每个训练实例呈现给网络之后，算法会将网络的误差从输出层开始反向传递（或反向传播）通过网络，并在每一层计算该层神经元的误差，然后将此误差传回前一层的神经元。该算法的主要步骤如下：


    1. 计算输出层神经元的误差，并使用权重更新规则更新进入这些神经元的权重。

    2. 将神经元计算出的误差与与其连接的前一层中的每个神经元共享，比例取决于两个神经元之间连接的权重。

    3. 对于前一层的每个神经元，通过累加反向传给它的误差来计算其所负责的网络整体误差，并使用此求和结果更新进入该神经元的权重。

    4. 重复步骤 2 和 3，回溯网络中的其余层，直到输入神经元和第一层之间的权重已更新完毕。


    在反向传播中，每个神经元的权重更新经过缩放，以减少而非消除误差。其在于训练网络的目标是泛化到训练数据中不存在的新实例，而不是记忆数据。因此，每组权重更新都会引导网络向一组在整个数据上通常更好的权重移动，通过多次迭代，网络会收敛到一组捕捉了数据总体分布而非实例细节的权重。在反向传播的某些版本中，权重是在呈现若干实例（或一批实例）后更新的，而不是在每个实例后更新。这些版本中唯一的调整是，算法使用网络在一批数据上的平均误差作为权重更新过程中输出层的误差测量值。


    过去 10 年最令人兴奋的技术进展之一是深度学习的出现。`Deep learning networks`简单来说具有多个⁸隐藏单元层的神经网络；换句话说，从隐藏层的数量来看，它们是“深”的。图
    15 中的神经网络有五层：左侧一个包含三个神经元的输入层，三个隐藏层（黑色圆圈），以及右侧一个包含两个神经元的输出层。该网络说明了每层可以有不同数量的神经元：输入层有三个神经元；第一个隐藏层有五个；接下来的两个隐藏层每层有四个；输出层有两个。该网络还显示了输出层可以有多个神经元。如果目标是具有不同等级的定类（nominal）或序数（ordinal）数据类型，则使用多个输出神经元是有用的。在这些情况下，网络被设置为每个级别对应一个输出神经元，并训练网络使得对于每个输入，只有一个输出神经元输出高激活值（表示预测的目标级别）。


    ![Figure 15 A deep neural network.](img/11140_004_fig_015.jpg)


    图 15 深度神经网络。


    '
