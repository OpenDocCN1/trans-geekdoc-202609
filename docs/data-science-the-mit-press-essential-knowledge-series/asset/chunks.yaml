    Aphra Kerr (2017) reports a case from 2015 that illustrates how not taking ethical
    considerations into account can have serious consequences for technology developers
    and vendors. The case resulted in the US Federal Trade Commission fining app game
    developers and publishers under the Children’s Online Privacy Protection Act.
    The developers had integrated third-party advertising into their free-to-play
    games. Integrating third-party advertising is standard practice in the free-to-play
    business model, but the problem arose because the games were designed for children
    younger than 13. As a result, in sharing their users’ data with advertising networks,
    the developers where in fact also sharing data relating to children and as a result
    violated the Children’s Online Privacy Protection Act. Also, in one instance the
    developers failed to inform the advertising networks that the apps were for children.
    As a result, it was possible that inappropriate advertising could be shown to
    children, and in this instance the Federal Trade Commission ruled that the game
    publishers were responsible for ensuring that age-appropriate content and advertising
    were supplied to the game-playing children. There has been an increasing number
    of these types of cases in recent years, and a number of organizations, including
    the Federal Trade Commission (2012), have called for businesses to adopt the principles
    of `privacy by design` (Cavoukian 2013). These principles were developed in the
    1990s and have become a globally recognized framework for the protection of privacy.
    They advocate that protecting privacy should be the default mode of operation
    for the design of technology and information systems. To follow these principles
    requires a designer to consciously and proactively seek to embed privacy considerations
    into the design of technologies, organizational practices, and networked system
    architectures.


    Although the arguments of ethical data science are clear, it is not always easy
    to act ethically. One way to make the challenge of ethical data science more concrete
    is to imagine you are working for a company as a data scientist on a business-critical
    project. In analyzing the data, you have identified a number of interacting attributes
    that together are a proxy for race (or some other personal attribute, such as
    religion, gender, etc.). You know that legally you can’t use the race attribute
    in your model, but you believe that these proxy attributes would enable you to
    circumvent the antidiscrimination legislation. You also believe that including
    these attributes in the model will make your model work, although you are naturally
    concerned that this successful outcome may be because the model will learn to
    reinforce discrimination that is already present in the system. Ask yourself:
    “What do I do?”


    # 7 Future Trends and Principles of Success


    An obvious trend in modern societies is the proliferation of systems that can
    sense and react to the world: smart phones, smart homes, self-driving cars, and
    smart cities. This proliferation of smart devices and sensors presents challenges
    to our privacy, but it is also driving the growth of big data and the development
    of new technology paradigms, such as the Internet of Things. In this context,
    data science will have a growing impact across many areas of our lives. However,
    there are two areas where data science will lead to significant developments in
    the coming decade: personal medicine and the development of smart cities.


    ## Medical Data Science


    In recent years, the medical industry has been looking at and adopting data science
    and predictive analytics. Doctors have traditionally had to rely on their experiences
    and instincts when diagnosing a condition or deciding on what the next treatment
    might be. The evidence-based medicine and precision-medicine movement argue that
    medical decisions should be based on data, ideally linking the best available
    data to an individual patient’s predicament and preferences. For example, in the
    case of precision medicine, fast genome-sequencing technology means that it is
    now feasible to analyze the genomes of patients with rare diseases in order to
    identify mutations that cause the disease so as to design and select appropriate
    therapies specific to that individual. Another factor driving data science in
    medicine is the cost of health care. Data science, in particular predictive analytics,
    can be used to automate some health care processes. For example, predictive analytics
    has been used to decide when antibiotics and other medicines should be administrated
    to babies and adults, and it is widely reported that many lives have been saved
    because of this approach.


    Medical sensors worn or ingested by the patient or implanted are being developed
    to continuously monitor a patient’s vital signs and behaviors and how his or her
    organs are functioning throughout the day. These data are continuously gathered
    and fed back to a centralized monitoring server. It is here at the monitoring
    server that health care professionals access the data being generated by all the
    patients, assess their conditions, understand what effects the treatment is having,
    and compare each patient’s results to those of other patients with similar conditions
    to inform them regarding what should happen next in each patient’s treatment regime.
    Medical science is using the data generated by these sensors and integrating it
    with additional data from the various parts of the medical profession and the
    pharmaceutical industry to determine the effects of current and new medicines.
    Personalized treatment programs are being developed based on the type of patient,
    his condition, and how his body responds to various medicines. In addition, this
    new type of medical data science is now feeding into new research on medicines
    and their interactions, the design of more efficient and detailed monitoring systems,
    and the uncovering of greater insights from clinical trials.


    ## Smart Cities


    Various cities around the world are adopting new technology to be able to gather
    and use the data generated by their citizens in order to better manage the cities’
    organizations, utilities, and services. There are three core enablers of this
    trend: data science, big data, and the Internet of Things. The name “Internet
    of Things” describes the internetworking of physical devices and sensors so that
    these devices can share information. This may sound mundane, but it has the benefit
    that we can now remotely control smart devices (such as our home if it is properly
    configured) and opens the possibility that networked machine-to-machine communication
    will enable smart environments to autonomously predict and react to our needs
    (for example, there are now commercially available smart refrigerators that can
    warn you when food is about to spoil and allows you to order fresh milk through
    your smart phone).


    Smart-city projects integrate real-time data from many different data sources
    into a single data hub, where they are analyzed and used to inform management
    and planning decisions. Some smart-city projects involve building brand-new cities
    that are smart from the ground up. Both Masdar City in the United Arab Emirates
    and Songdo City in South Korea are brand-new cities that have been built with
    the smart technology at their core and a focus on being eco-friendly and energy
    efficient. However, most smart-city projects involve the retrofitting of existing
    cities with new sensor networks and data-processing centers. For example, in the
    SmartSantander project in Spain, more than 12,000 networked sensors have been
    installed across the city to measure temperature, noise, ambient lighting, carbon
    monoxide levels, and parking. Smart-city projects often focus on developing energy
    efficiency, planning and routing traffic, and planning utility services to match
    population needs and growth.

