    \ initial cluster centers. Current best practice is to use an algorithm called\
    \ “*k*\\-means++” to select the initial cluster centers. The rationale behind\
    \ *k*\\-means++ is that it is a good idea to spread out the initial cluster centers\
    \ as much as possible. So in k-means++ the first cluster center is set by randomly\
    \ selecting one of the instances in the data set. The second and subsequent cluster\
    \ centers are set by selecting an instance from the data set with the probability\
    \ that an instance selected is proportional to the squared distance from the closest\
    \ existing cluster center. Once all *k* cluster centers have been initialized,\
    \ the algorithm works by iterating through a two-step process: first, assigning\
    \ each instance to the nearest cluster center, and then, second, updating the\
    \ cluster center to be in the middle of the instances assigned to it. In the first\
    \ iteration the instances are assigned to the nearest cluster center returned\
    \ by the *k*\\-means++ algorithm, and then these cluster centers are moved so\
    \ that they are positioned at the center of instances assigned to them. Moving\
    \ the cluster centers is likely to move them closer to some instances and farther\
    \ away from other instances (including farther away from some instances assigned\
    \ to the cluster center). The instances are then reassigned, again to the closest\
    \ updated cluster center. Some instances will remain assigned to the same cluster\
    \ center, and others may be reassigned to a new cluster center. This process of\
    \ instance assignment and center updating continues until no instances are assigned\
    \ to a new cluster center during an iteration. The *k*\\-means algorithm is nondeterministic,\
    \ meaning that different starting positions for the cluster centers will likely\
    \ produce different clusters. As a result, the algorithm is typically run several\
    \ times, and the results of these different runs are then compared to see which\
    \ clusters appear most sensible given the data scientist’s domain knowledge and\
    \ understanding.\n\n    When a set of clusters for customer personas has been\
    \ deemed to be useful, the clusters are often given names to reflect the main\
    \ characteristics of the cluster persona. Each cluster center defines a different\
    \ customer persona, with the persona description generated from the attribute\
    \ values of the associated cluster center. The *k*\\-means algorithm is not required\
    \ to return equal-size clusters, and, in fact, it is likely to return different-size\
    \ clusters. The sizes of the clusters can be useful, though, because they can\
    \ help to guide marketing. For example, the clustering process may reveal small,\
    \ focused clusters of customers that current marketing campaigns are missing.\
    \ Or an alternative strategy might be to focus on clusters that contain customers\
    \ that generate a great deal of revenue. Whatever marketing strategy is adopted,\
    \ understanding the segments within a customer base is the prerequisite to marketing\
    \ success.\n\n    One of the advantages of clustering as an analytics approach\
    \ is that it can be applied to most types of data. Because of its versatility,\
    \ clustering is often used as a data-exploration tool during the data-understanding\
    \ stage of many data science projects. Also, clustering is also useful across\
    \ a wide range of domains. For example, it has been used to analyze students in\
    \ a given course in order to identify groups of students who need extra support\
    \ or prefer different learning approaches. It has also been used to identify groups\
    \ of similar documents in a corpus, and in science it has been used in bio-informatics\
    \ to analyze gene sequences in microarray analysis.\n\n    ## Is This Fraud? (Anomaly\
    \ Detection)\n\n    Anomaly detection or outlier analysis involves searching for\
    \ and identifying instances that do not conform to the typical data in a data\
    \ set. These nonconforming cases are often referred to as *anomalies* or *outliers*.\
    \ Anomaly detection is often used in analyzing financial transactions in order\
    \ to identify potential fraudulent activities and to trigger investigations. For\
    \ example, anomaly detection might uncover fraudulent credit card transactions\
    \ by identifying transactions that have occurred in an unusual location or that\
    \ involve an unusually large amount compared to other transactions on a particular\
    \ credit card.\n\n    The first approach that most companies typically use for\
    \ anomaly detection is to manually define a number of rules based on domain expertise\
    \ that help with identifying anomalous events. This rule set is often defined\
    \ in SQL or in another language and is run against the data in the business databases\
    \ or data warehouse. Some programming languages have begun to include specific\
    \ commands to facilitate the coding of these types of rules. For example, database\
    \ implementations of SQL now includes a MATCH\\_RECOGNIZE function to facilitate\
    \ pattern matching in data. A common pattern in credit card fraud is that when\
    \ a credit card gets stolen, the thief first checks that the card is working by\
    \ purchasing a small item on the card, and then if that transaction goes through,\
    \ the thief as quickly as possible follows that purchase with the purchase of\
    \ an expensive item before the card is canceled. The MATCH\\_RECOGNIZE function\
    \ in SQL enables database programmers to write scripts that identify sequences\
    \ of transactions on a credit card that fit this pattern and either block the\
    \ card automatically or trigger a warning to the credit-card company. Over time,\
    \ as more anomalous transactions are identified—for example, by customers reporting\
    \ fraudulent transactions—the set of rules identifying anomalous transactions\
    \ is expanded to handle these new instances.\n\n    The main drawback with a rule-based\
    \ approach to anomaly detection is that defining rules in this way means that\
    \ anomalous events can be identified only after they have occurred and have come\
    \ to the company’s attention. Ideally, most organizations would like to be able\
    \ to identify anomalies when they first happen or if they have happened but have\
    \ not been reported. In some ways, anomaly detection is the opposite of clustering:\
    \ the goal of clustering is to identify groups of similar instances, whereas the\
    \ goal of anomaly detection is to find instances that are dissimilar to the rest\
    \ of the data in the data set. By this intuition, clustering can also be used\
    \ to automatically identify anomalies. There are two approaches to using clustering\
    \ for anomaly detection. The first is that the normal data will be clustered together,\
    \ and the anomalous records will be in separate clusters. The clusters containing\
    \ the anomalous records will be small and so will be clearly distinct from the\
    \ large clusters for the main body of the records. The second approach is to measure\
    \ the distance between each instance and the center of the cluster. The farther\
    \ away the instance is from the center of the cluster, the more likely it is to\
    \ be anomalous and thus to need investigation."
