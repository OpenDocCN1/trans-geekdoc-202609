- raw: "    In regression analysis, the parameters of a regression function are initially\
    \ unknown. Setting the parameters of a regression function is equivalent to searching\
    \ for the line that best fits the data. The strategy for setting these parameters\
    \ begins by guessing parameters values and then iteratively updating the parameters\
    \ so as to reduce the overall error of the function on the data set. The overall\
    \ error is calculated in three steps:\n\n    1.  The function is applied to the\
    \ data set, and for each instance in the data set it estimates the value of the\
    \ target attribute.\n\n    2.  The error of the function for each instance is\
    \ calculated by subtracting the estimated value of the target attribute from the\
    \ actual value of the target attribute.\n\n    3.  The error of the function for\
    \ each instance is squared, and then these squared values are summed.\n\n    The\
    \ error of the function for each instance is squared in step 3 so that the error\
    \ in the instances where the function overestimates the target doesn’t cancel\
    \ out with the error when it underestimates. Squaring the error makes the error\
    \ positive in both cases. This measure of error is known as the *sum of squared\
    \ errors* (SSE), and the strategy of fitting a linear function by searching for\
    \ the parameters that minimize the SSE is known as *least squares*. The SSE is\
    \ defined as\n\n    ![11140\\_e004\\_002.jpg](images/11140_e004_002.jpg)\n\n \
    \   where the data set contains *n* instances, *target[i]* is the value of the\
    \ target attribute for instance *i* in the data set, and *prediction[i]* is the\
    \ estimate of the target by function for the same instance.\n\n    To create a\
    \ linear-regression prediction model that estimates the likelihood of an individual’s\
    \ developing diabetes with respect to his BMI, we replace *X* with the BMI attribute,\
    \ *Y* with the diabetes attribute, and apply the least-squares algorithm to find\
    \ the best-fit line for the diabetes data set. [Figure 11a](#c11140_004.xhtml#fig_011)\
    \ illustrates this best-fit line and where it lies relative to the instances in\
    \ the data set. In [figure 11b](#c11140_004.xhtml#fig_011), the dashed lines show\
    \ the error (or residual) for each instance for this line. Using the least-squares\
    \ approach, the best-fit line is the line that minimizes the sum of the squared\
    \ residuals. The equation for this line is\n\n    ![11140\\_e004\\_003.jpg](images/11140_e004_003.jpg).\n\
    \n    ![Figure 11 (a) The best-fit regression line for the model “Diabetes = −7.38431\
    \ + 0.55593 BMI.” (b) The dashed vertical lines illustrate the residual for each\
    \ instance.](images/11140_004_fig_011.jpg)\n\n    [Figure 11](#c11140_004.xhtml#fig_011a)\
    \ (*a*) The best-fit regression line for the model “Diabetes = −7.38431 + 0.55593\
    \ BMI.” (*b*) The dashed vertical lines illustrate the residual for each instance.\n\
    \n    The slope parameter value *ω[1]* = 0.55593 indicates that for each increase\
    \ of one unit in BMI, the model increases the estimated likelihood of a person\
    \ developing diabetes by a little more than half a percent. In order to predict\
    \ the likelihood of a person’s developing diabetes, we simply input his BMI into\
    \ the model. For example, when BMI equals 20, the model returns a prediction of\
    \ a 3.73 percent likelihood for the diabetes attribute, and when BMI equals 21,\
    \ the model predicts a 4.29 percent likelihood.[⁴](#c11140_004.xhtml#FN14)\n\n\
    \    Under the hood, a linear-regression model fitted using the least-squares\
    \ method is actually calculating a weighted average over the instances. In fact,\
    \ the intercept parameter value *ω*[0] = −7.38431 ensures that the best-fit line\
    \ goes through the point defined by the average BMI value and average diabetes\
    \ value for the data set. If the average BMI value in the data set (BMI = 24.0932)\
    \ is entered, the model estimates a 4.29 percent likelihood for the diabetes attribute,\
    \ which is the average value for diabetes in the data set.\n\n    The weighting\
    \ of the instances is based on the distance of the instance from the line: the\
    \ farther an instance is away from the line, the larger the residual for that\
    \ instance, and the algorithm will weight that instance by the residual squared.\
    \ One consequence of this weighting is that instances that have extreme values\
    \ (outliers) can have a disproportionately large impact on the line-fitting process,\
    \ resulting in the line being dragged away from the other instances. Thus, it\
    \ is important to check for outliers in a data set prior to fitting a line to\
    \ the data set (or, in other words, training a linear regression function on the\
    \ data set) using the least squares algorithm.\n\n    Linear-regression models\
    \ can be extended to take multiple inputs. A new parameter is added to the model\
    \ for each new input attribute, and the equation for the model is updated to include\
    \ the result of multiplying the new attribute by the new parameter within the\
    \ summation. For example, to extend the model to include the exercise and weight\
    \ attributes as input, the structure of the regression function becomes\n\n  \
    \  ![11140\\_e004\\_004.jpg](images/11140_e004_004.jpg).\n\n    In statistics,\
    \ a regression function that maps from multiple inputs to a single output in this\
    \ way is known as a *multiple linear regression function*. The structure of a\
    \ multi-input regression function is the basis for a range of ML algorithms, including\
    \ neural networks.\n\n    Correlation and regression are similar concepts insofar\
    \ as both are techniques that focus on the relationship across columns in the\
    \ data set. Correlation is focused on exploring whether a relationship exists\
    \ between two attributes, and regression is focused on modeling an assumed relationship\
    \ between attributes with the purpose of being able to estimate the value of one\
    \ target attribute given the values of one or more input attributes. In the specific\
    \ cases of Pearson correlation and linear regression, a Pearson correlation measures\
    \ the degree to which two attributes have a linear relationship, and linear regression\
    \ trained using least squares is a process to find the best-fit line that predicts\
    \ the value of one attribute given the value of another.\n\n    ### Neural Networks\
    \ and Deep Learning\n\n    A *neural network* consists of a set of neurons that\
    \ are connected together. A neuron takes a set of numeric values as input and\
    \ maps them to a single output value. At its core, a neuron is simply a multi-input\
    \ linear-regression function. The only significant difference between the two\
    \ is that in a neuron the output of the multi-input linear-regression function\
    \ is passed through another function that is called the *activation function*."
