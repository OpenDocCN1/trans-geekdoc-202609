- raw: "Whatever wallet you end up choosing, keep in mind that Bitcoin is actual money\
    \ that can be lost or stolen. We'll go over the fundamentals here, but if you're\
    \ going to be dealing with substantial numbers, it's a good idea to learn about\
    \ some more advanced security methods to protect your digital assets.\n\n         \
    \ ![](Images/image00074.jpeg)\n\n# Wallets on the Internet\n\nOne of the most\
    \ common types of Bitcoin wallets is the online wallet. Several online services,\
    \ such as Bitcoin exchanges, allow you to save your money online in one of their\
    \ wallets. These wallets are simple to make, but anything that keeps your funds\
    \ online is deemed less safe. In fact, numerous of these services have already\
    \ been hacked or had severe security breaches.\n\nAnything that is connected to\
    \ the Internet is obviously more vulnerable to hacking or infection than anything\
    \ that is not connected to the Internet.\n\nBitcoin wallets are no different.\
    \ Many people prefer to retain the majority of their Bitcoin offline while also\
    \ keeping a small amount of cash in an online wallet for quick and easy online\
    \ transactions.\n\n# Wallets for Desktop and Mobile\n\nThere are numerous alternatives\
    \ for creating Bitcoin wallets that can be stored on your computer and/or mobile\
    \ phone. To some extent, these can provide more security than third-party online\
    \ storage.\n\nHowever, as previously stated, every device that is connected to\
    \ the Internet is potentially vulnerable to malware. You can still be vulnerable\
    \ to cyber-attacks unless you have a computer that is never connected to the Internet\
    \ (this is known as \"air-gapped\").\n\nMany wallets have additional levels of\
    \ encryption, password protection, and other security features that can significantly\
    \ decrease the dangers. You will also be able to make backups and add more layers\
    \ of encryption, which is a smart idea. However, if you are dealing with a large\
    \ amount of Bitcoin, the safest approach to store it is offline.\n\n# \"Cold Storage\"\
    \n\nKeeping your Bitcoin wallet offline and in a secure location is widely regarded\
    \ as the most secure method of storing Bitcoin. It is typical practice for consumers\
    \ to keep the majority of their Bitcoin offline, often known as \"cold storage,\"\
    \ and only retain a small amount online for routine transactions. The disadvantage\
    \ of generating and using a cold storage wallet is that it requires some technical\
    \ expertise.\n\nBitKey, Armory, and other services assist in the creation of secure\
    \ offline wallets.\n\n# Wallets Made of Hardware\n\nHardware wallets are a popular\
    \ security and efficiency solution. These are tangible devices, comparable in\
    \ form to a USB drive or keychain, designed solely for the purpose of storing\
    \ Bitcoin. In fact, several hardware wallets link to a computer via USB to perform\
    \ transactions. Even when linked to a hacked computer, strong hardware wallets\
    \ are impervious to the malware and viruses that can harm software wallets. Security,\
    \ ease of use, and recovery options varies between models;therefore, it is prudent\
    \ to study reviews and compare the features of various devices.\n\nSelecting the\
    \ Best Wallet\n\nWe've discussed some of the most prevalent techniques of wallet\
    \ construction, but there are others. Varying people place different values on\
    \ security, complexity, and other aspects. Choosing a safe wallet option is highly\
    \ recommended, especially for those expecting to make a significant investment\
    \ in Bitcoin, even though it may necessitate some more labor to set it up properly.\
    \ Reading reviews, viewing explanation videos, and asking questions on Bitcoin\
    \ forums like bitcointalk.org are all effective ways to stay informed, ask questions,\
    \ and select the best wallet for your needs.\n\nTo obtain a list of reliable wallets,\
    \ go on the following link:\n\n# Bitcoin - Choose Your Wallet\n\nAlso, don't forget\
    \ to download Cryptocurrency Secrets, the free book included in this book that\
    \ provides a more in-depth review of your wallet options.\n\n        ![](Images/image00075.jpeg)\n\
    \n# CHAPTER 5\n\n# How Do I Obtain Bitcoin?\n\nYou can truly obtain some Bitcoin\
    \ after you have a place to invest your money! There are several ways to obtain\
    \ Bitcoin, but the most frequent include:\n\n*                   By exchanging\
    \ fiat currency for Bitcoin via an exchange Obtaining Bitcoin from someone who\
    \ already owns Bitcoin mining\n\n*                   We'll look at all of these\
    \ ways, but first, let's take a step back and consider a more fundamental question:\
    \ What is the origin of Bitcoins?\n\n*                   Where Do Bitcoins Originate?\n\
    \n# Who \"manufactures\" bitcoins? \n\nThis is a significant question, and it\
    \ links to another one you may have: how is the value of bitcoin determined?\n\
    \nTo answer each of these problems, it is useful to first examine the origins\
    \ of standard fiat currency. Governments and institutions, in general, control\
    \ the creation of paper money. The amount of money printed has an effect on the\
    \ value of that currency in the global financial market. The economics of how\
    \ this all works can be quite sophisticated, but in a nutshell, the more money\
    \ a government creates, the less value that currency has in general. In economic\
    \ terms, this principle is known as \"scarcity,\" which means that the less there\
    \ is of something and the more people who want it, the more valuable that product\
    \ is. This is true for commodities, fiat money, and Bitcoin.\n\nThere are several\
    \ examples throughout history of governments printing massive amounts of paper\
    \ money to fund short-term expenses (nearly invariably tied to war), and the value\
    \ of that currency dropped as a result. The most well-known example is the hyperinflation\
    \ that happened in Germany's Weimer Republic following World War I. Because paper\
    \ money had such a low value, people famously wallpapered their homes with it.\n\
    \nOne key difference between Bitcoin and fiat currency is that there is a hard\
    \ limit on the number of Bitcoins that can be created. There will never be more\
    \ than 21 million Bitcoins. The final Bitcoin is expected to come around the year\
    \ 2140. This inherent scarcity is an important factor in determining Bitcoin's\
    \ value.\n\nHowever, we have not fully addressed the topic of where Bitcoins originate.\
    \ The short answer is that Bitcoin miners \"mine\" them.\n\n# Mining for Bitcoin\n\
    \nIf Bitcoins are obtained by mining, it may be tempting to assume that one should\
    \ abandon all other pursuits and become a Bitcoin miner. Mining is one of the\
    \ first things that newbies to the Bitcoin space generally hear about. At first\
    \ appearance, this appears to be a primrose route to \"free money.\" It may appear\
    \ like mining is as simple as launching an application on your PC and seeing the\
    \ Bitcoins pour in! Unfortunately, mining, like most things involving \"free money,\"\
    \ is not as straightforward as it appears.\n\nWe previously discussed the blockchain\
    \ and how transactions are stored over a distributed network of computers. Each\
    \ transaction is confirmed and uploaded to the blockchain, but how does this happen?\n\
    \nThis is where miners enter the picture. Bitcoin miners utilize specialized software\
    \ to solve complicated mathematical problems in order to verify transactions,\
    \ maintain the blockchain, and add blocks. A \"node\" (a specific mining station)\
    \ can distinguish between valid and invalid transactions by comparing a new transaction\
    \ to the public ledger of previous transactions (the blockchain).\n\nIf someone\
    \ tries to spend Bitcoins that don't exist, the system will say, \"Hey, hold for\
    \ a second, this doesn't line up with the history on the blockchain...\" and the\
    \ transaction will be refused. Miners are in charge of the intensive computer\
    \ work required to review all new Bitcoin transactions, verify them, and add them\
    \ to the blockchain.\n\n             ![White Males, Gold, The Gold Standard, Bitcoin,\
    \ Btc](Images/image00076.jpeg)"
  fmt: '

    Whatever wallet you end up choosing, keep in mind that Bitcoin is actual money
    that can be lost or stolen. We''ll go over the fundamentals here, but if you''re
    going to be dealing with substantial numbers, it''s a good idea to learn about
    some more advanced security methods to protect your digital assets.


    ![](Images/image00074.jpeg)


    # Wallets on the Internet


    One of the most common types of Bitcoin wallets is the online wallet. Several
    online services, such as Bitcoin exchanges, allow you to save your money online
    in one of their wallets. These wallets are simple to make, but anything that keeps
    your funds online is deemed less safe. In fact, numerous of these services have
    already been hacked or had severe security breaches.


    Anything that is connected to the Internet is obviously more vulnerable to hacking
    or infection than anything that is not connected to the Internet.


    Bitcoin wallets are no different. Many people prefer to retain the majority of
    their Bitcoin offline while also keeping a small amount of cash in an online wallet
    for quick and easy online transactions.


    # Wallets for Desktop and Mobile


    There are numerous alternatives for creating Bitcoin wallets that can be stored
    on your computer and/or mobile phone. To some extent, these can provide more security
    than third-party online storage.


    However, as previously stated, every device that is connected to the Internet
    is potentially vulnerable to malware. You can still be vulnerable to cyber-attacks
    unless you have a computer that is never connected to the Internet (this is known
    as "air-gapped").


    Many wallets have additional levels of encryption, password protection, and other
    security features that can significantly decrease the dangers. You will also be
    able to make backups and add more layers of encryption, which is a smart idea.
    However, if you are dealing with a large amount of Bitcoin, the safest approach
    to store it is offline.


    # "Cold Storage"


    Keeping your Bitcoin wallet offline and in a secure location is widely regarded
    as the most secure method of storing Bitcoin. It is typical practice for consumers
    to keep the majority of their Bitcoin offline, often known as "cold storage,"
    and only retain a small amount online for routine transactions. The disadvantage
    of generating and using a cold storage wallet is that it requires some technical
    expertise.


    BitKey, Armory, and other services assist in the creation of secure offline wallets.


    # Wallets Made of Hardware


    Hardware wallets are a popular security and efficiency solution. These are tangible
    devices, comparable in form to a USB drive or keychain, designed solely for the
    purpose of storing Bitcoin. In fact, several hardware wallets link to a computer
    via USB to perform transactions. Even when linked to a hacked computer, strong
    hardware wallets are impervious to the malware and viruses that can harm software
    wallets. Security, ease of use, and recovery options varies between models;therefore,
    it is prudent to study reviews and compare the features of various devices.


    Selecting the Best Wallet


    We''ve discussed some of the most prevalent techniques of wallet construction,
    but there are others. Varying people place different values on security, complexity,
    and other aspects. Choosing a safe wallet option is highly recommended, especially
    for those expecting to make a significant investment in Bitcoin, even though it
    may necessitate some more labor to set it up properly. Reading reviews, viewing
    explanation videos, and asking questions on Bitcoin forums like bitcointalk.org
    are all effective ways to stay informed, ask questions, and select the best wallet
    for your needs.


    To obtain a list of reliable wallets, go on the following link:


    # Bitcoin - Choose Your Wallet


    Also, don''t forget to download Cryptocurrency Secrets, the free book included
    in this book that provides a more in-depth review of your wallet options.


    ![](Images/image00075.jpeg)


    # CHAPTER 5


    # How Do I Obtain Bitcoin?


    You can truly obtain some Bitcoin after you have a place to invest your money!
    There are several ways to obtain Bitcoin, but the most frequent include:


    *    By exchanging fiat currency for Bitcoin via an exchange Obtaining Bitcoin
    from someone who already owns Bitcoin mining


    *    We''ll look at all of these ways, but first, let''s take a step back and
    consider a more fundamental question: What is the origin of Bitcoins?


    *    Where Do Bitcoins Originate?


    # Who "manufactures" bitcoins?


    This is a significant question, and it links to another one you may have: how
    is the value of bitcoin determined?


    To answer each of these problems, it is useful to first examine the origins of
    standard fiat currency. Governments and institutions, in general, control the
    creation of paper money. The amount of money printed has an effect on the value
    of that currency in the global financial market. The economics of how this all
    works can be quite sophisticated, but in a nutshell, the more money a government
    creates, the less value that currency has in general. In economic terms, this
    principle is known as "scarcity," which means that the less there is of something
    and the more people who want it, the more valuable that product is. This is true
    for commodities, fiat money, and Bitcoin.


    There are several examples throughout history of governments printing massive
    amounts of paper money to fund short-term expenses (nearly invariably tied to
    war), and the value of that currency dropped as a result. The most well-known
    example is the hyperinflation that happened in Germany''s Weimer Republic following
    World War I. Because paper money had such a low value, people famously wallpapered
    their homes with it.


    One key difference between Bitcoin and fiat currency is that there is a hard limit
    on the number of Bitcoins that can be created. There will never be more than 21
    million Bitcoins. The final Bitcoin is expected to come around the year 2140.
    This inherent scarcity is an important factor in determining Bitcoin''s value.


    However, we have not fully addressed the topic of where Bitcoins originate. The
    short answer is that Bitcoin miners "mine" them.


    # Mining for Bitcoin


    If Bitcoins are obtained by mining, it may be tempting to assume that one should
    abandon all other pursuits and become a Bitcoin miner. Mining is one of the first
    things that newbies to the Bitcoin space generally hear about. At first appearance,
    this appears to be a primrose route to "free money." It may appear like mining
    is as simple as launching an application on your PC and seeing the Bitcoins pour
    in! Unfortunately, mining, like most things involving "free money," is not as
    straightforward as it appears.


    We previously discussed the blockchain and how transactions are stored over a
    distributed network of computers. Each transaction is confirmed and uploaded to
    the blockchain, but how does this happen?


    This is where miners enter the picture. Bitcoin miners utilize specialized software
    to solve complicated mathematical problems in order to verify transactions, maintain
    the blockchain, and add blocks. A "node" (a specific mining station) can distinguish
    between valid and invalid transactions by comparing a new transaction to the public
    ledger of previous transactions (the blockchain).


    If someone tries to spend Bitcoins that don''t exist, the system will say, "Hey,
    hold for a second, this doesn''t line up with the history on the blockchain..."
    and the transaction will be refused. Miners are in charge of the intensive computer
    work required to review all new Bitcoin transactions, verify them, and add them
    to the blockchain.


    ![](Images/image00076.jpeg)

    '
