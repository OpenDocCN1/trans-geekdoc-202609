- raw: 'Miners are compensated with a set quantity of new Bitcoin in return for solving
    blocks, thereby increasing the global volume of available Bitcoins in circulation.
    This incentive encourages more people to mine, resulting in a more secure system
    due to greater dispersion.


    In the early days of Bitcoin, mining could be done on almost any old computer,
    and the reward for "discovering" a block was substantial, despite the fact that
    the overall value of Bitcoin was extremely low and there were not that many Bitcoins
    in circulation. The conditions evolved over time as more people began to use Bitcoin
    and become miners.


    A link between the number of miners and the level of difficulty required in solving
    the challenge, or "mining," each block is built into the Bitcoin protocol. In
    principle, additional miners entering the scene should result in more blocks being
    created at a faster rate.


    The Bitcoin protocol is designed in such a way that when more blocks are issued,
    the difficulty of solving the complicated math problems necessary to effectively
    "mine" a block increase. Making it more difficult to mine a block reduces the
    rate of block generation. This link between the number of Bitcoins in circulation
    and the difficulty of mining new ones keeps the ecosystem constant over time.


    Today, the level of difficulty necessary to mine a block is so resource-intensive,
    both in computer power and electricity, that it necessitates the use of specialized
    equipment. In most circumstances, the expense of a mining operation substantially
    outweighs the potential earnings from mining Bitcoin over a long period of time.
    Many miners currently work in "pools," or collectives, where participants pool
    resources and split rewards. Joining a mining pool is one approach to boost your
    chances of recouping your mining equipment expenditures and possibly making a
    profit. It is still feasible to earn Bitcoin through mining today, but it is far
    from simple or free to get started.


    # Purchasing Bitcoin


    While there is certainly a possibility in mining, it is far from the most straightforward
    way to obtain Bitcoin. Rather of trying to mine fresh Bitcoin, it is considerably
    faster and easier to obtain existing Bitcoin from somewhere else.


    You have various alternatives for getting Bitcoin in this manner. Whatever path
    you choose, you will need to create a Bitcoin wallet to receive and hold your
    funds.


    # Exchanges for Bitcoin


    In many countries, using fiat currency to purchase Bitcoin is the most convenient
    option. Bitcoin exchanges function basically the same as any other currency exchange,
    in that you use one currency to purchase another. At the time of writing, Coinbase
    (coinbase.com) is one of the most popular Bitcoin exchanges in the United States.
    Coinbase is an online platform that allows you to build a Bitcoin wallet, connect
    your bank account, and purchase or sell Bitcoin using a relatively simple user
    interface.


    Transaction fees are common on Bitcoin exchanges, and Coinbase is no exception.
    While most Bitcoin exchanges are nominally "free," there will be percentage fees
    associated with most or all transactions. It is also usual to encounter delays
    when dealing via exchanges, which can range from slightly annoying to crippling.
    Learning the process and factoring in fees and wait times will make your transactions
    operate much more smoothly.


    Most exchanges that allow you to buy Bitcoin using fiat currency will ask you
    to link a bank account and provide some personal information. This enables quick
    and easy exchange of fiat currency for Bitcoin. Once again, it will be worthwhile
    to conduct some research and choose an exchange that can exhibit some endurance
    and has a decent reputation.


    Even yet, storing all or most of your Bitcoin in an online exchange is generally
    not a good idea. For many years, Mt. Gox was the world''s dominant bitcoin exchange.
    At the height of its popularity, Mt. Gox handled almost 70% of all Bitcoin transactions
    in the world.


    Then, in 2014, a huge security breach occurred, resulting in the loss or theft
    of around 850,000 Bitcoins under fairly strange circumstances. Exchanges are beneficial
    for transferring funds between Bitcoin and fiat currencies, trading, and actively
    engaging with Bitcoin, but the Mt. Gox debacle demonstrates why it is not a good
    idea to retain all of your assets in an online exchange.


    # ATMs for Bitcoin


    Bitcoin ATMs are another option to buy Bitcoin that is growing increasingly popular.
    These machines are appearing everywhere, from malls to airports to city centres.
    They resemble typical ATMs, but there are some key differences. Bitcoin ATMs,
    for the most part, are not linked to any banks.


                          ![](Images/image00077.jpeg)


    They are only connected to the Bitcoin network''s world via the Internet. Many
    Bitcoin ATMs support bi-directional exchange, which means you may either insert
    cash to have it converted to Bitcoin and transferred to a public key address,
    or have Bitcoins from your own account turned into cash and dispensed by the machine.
    Some companies only handle one-way transfers.


    ATMs can provide a more anonymous option to purchase Bitcoin without linking your
    bank account to a platform such as Coinbase. However, depending on the machine,
    there may be significant transaction fees and limits on how much you can deposit
    or withdraw. You can find Bitcoin ATMs in your area by using the Coin ATM Radar
    website, which can be found at https://coinatmradar.com/.


    # Obtaining Bitcoin from Others


    One of the most prevalent ways to get started with Bitcoin since its inception
    has been to find someone ready to gift or sell you some. Given that Bitcoin is
    a digital asset, it should come as no surprise that the majority of the Bitcoin
    community exists online. Forums like bitcointalk.org and Reddit''s r/bitcoin are
    excellent locations to interact with other Bitcoin users. Some Bitcoin aficionados
    are willing to offer a modest sum to a novice in order to assist them in setting
    up their first wallet. After all, the more individuals who use Bitcoin, the bigger
    the demand, and hence the higher the value, at least in principle. Through that
    lens, it makes long-term financial sense to assist new users in getting started,
    even if it involves spending some of your own money at first.


    There are also a number of internet tools for locating local Bitcoin exchanges,
    where users meet together offline, in person, to trade Bitcoin. This can be an
    excellent method to save transaction costs, meet other Bitcoin aficionados in
    your neighborhood, and potentially boost transaction anonymity. As with any scenario
    involving meeting someone "from the Internet," employ caution whenever meeting
    up to exchange Bitcoin in person.


    # CHAPTER 6


    #  Bitcoin''s History


    We can argue about the specific timing when Bitcoin hit the mainstream. Generally
    speaking, despite previous rises in Bitcoin''s value, most would say that 2016
    - 2017 saw a major increase in public awareness and acceptance of both Bitcoin
    and blockchain technology. As a potential investor, it is beneficial to review
    Bitcoin''s history to acquire a better understanding of how it has evolved. Studying
    the events and behaviors that have shaped the current market might assist us in
    shaping our picture of what the future may hold and making informed judgments.


    One of the most intriguing anecdotal characteristics of Bitcoin is the mystery
    surrounding its creation. Bitcoin originally surfaced in 2008, when a document
    describing the concept was distributed to a cryptography email list. The article,
    titled "Bitcoin: A Peer-to-Peer Electronic Cash System," was written by a person
    known as Satoshi Nakamoto.


    A few months later, in January 2009, Satoshi Nakamoto built Bitcoin and made the
    code "open-source" (meaning anyone can look at it). Nakamoto mined the first Bitcoin
    block, known as the "genesis block," which launched the bitcoin blockchain.'
