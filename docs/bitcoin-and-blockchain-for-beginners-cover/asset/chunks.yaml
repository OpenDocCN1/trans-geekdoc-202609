- raw: "Others keep a close eye on the market and regularly transfer funds back and\
    \ forth between Bitcoin, fiat, and other cryptocurrencies, taking advantage of\
    \ slight price movements in a manner similar to Wall Street-style day trading.\
    \ These speculators seek to buy when prices are low and sell when they rise in\
    \ order to profit quickly (the \"fast nickel\"). The gains are often less when\
    \ employing this method, but enough successful trades can quickly add up.\n\n\
    While trading between fiat and Bitcoin is one way for people to make (or lose)\
    \ money, cryptocurrency trades frequently include swapping one cryptocurrency\
    \ for another rather than trading with cash.In this context, Bitcoin functions\
    \ as a \"gateway\" cryptocurrency.\n\n# Trading of Cryptocurrencies\n\nAside from\
    \ Bitcoin, there are hundreds more cryptocurrencies with differing levels of value,\
    \ volume, and potential. A vibrant trading culture exists around a number of these\
    \ alternative currencies (also known as \"alt-coins\"). Ethereum, Litecoin, and\
    \ Dogecoin are examples of popular alt-coins. Most alt-coins require the purchase\
    \ of Bitcoin before they may be purchased. Although there are few exceptions,\
    \ most alt-coins cannot be acquired directly with fiat currency, but rather with\
    \ Bitcoin.\n\nThe alt-coin space is a little like the \"wild west,\" with high\
    \ risks leading to enormous returns or large losses. Remember the early Bitcoin\
    \ adopter who spent his money on two pizzas? Many people are drawn to investing\
    \ in alt-coins because they have the potential to skyrocket in value, similar\
    \ to how Bitcoin did. Speculators may invest in an alt-coin if it is backed by\
    \ a promising application and a competent development team. Hedge funds that trade\
    \ solely in cryptocurrencies and blockchain technology have even begun to appear.\n\
    \n          ![Blockchain, Bitcoin, Bank, Business, Cash, Coin](Images/image00080.jpeg)\n\
    \nThe growing paradigm of blockchain-based currencies and apps has resulted in\
    \ a massive surge of speculative investment in this field, resulting in a slew\
    \ of new \"alt-coins\" trying to lead the way in various specialized use cases.\
    \ Ethereum, for example, is commonly regarded as the second most popular cryptocurrency\
    \ after Bitcoin. Some people feel that Ethereum will outperform Bitcoin in terms\
    \ of both value and popularity, and they have hedged their \"slow dime\" bets\
    \ by investing in Ethereum. Similarly, many have invested in potential newcomers\
    \ to the field and are willing to wait five years or more for the value to rise.\n\
    \nBeyond Bitcoin, the cryptocurrency and blockchain space is incredibly promising\
    \ for serious investors interested in developing technology. There is a lot of\
    \ noise to filter through, as there is in many other emerging digital fields.\
    \ Everyone has an opinion about the future of blockchain technology, and they\
    \ can't all be right. Listening to others is a terrific way to learn, but it is\
    \ ultimately up to you to establish your own opinions and decide what is best\
    \ for you.\n\n# How to Get Paid in Bitcoin\n\nBitcoin's worth and long-term survival\
    \ are largely determined by the number of people ready to accept it as a method\
    \ of payment. With Bitcoin's recent widespread acceptance, an increasing number\
    \ of vendors are offering the opportunity to pay for goods and services with Bitcoin.\n\
    \nMany businesses have been hesitant to accept Bitcoin as a payment option in\
    \ the past due to its volatility. Today, however, an increasing number of businesses\
    \ are incorporating Bitcoin payment methods into their company model. You may\
    \ now use Bitcoin to pay for items like plane tickets, online classes, cheeseburgers,\
    \ and much more.\n\nGetting paid in Bitcoin is one option for freelancers, small\
    \ enterprises, and entrepreneurs to invest in the currency. If you are paid in\
    \ Bitcoin for a service and the value of Bitcoin rises above the value of whatever\
    \ fiat money you were paid in, you can continue to gain even after the task is\
    \ completed. Of course, it bears reiterating that the inverse might also occur.\
    \ Many individuals set up wallets to receive Bitcoin tips, which may be a fun\
    \ way to get your feet wet without putting too much money at risk.\n\n# Faucets\
    \ for Bitcoin\n\nIf you spend some time online researching Bitcoin matters, you\
    \ will almost certainly come across the term \"faucets.\" These are places where\
    \ you can occasionally receive extremely little sums of Bitcoin for free. Most\
    \ faucets work by giving away a \"trickle\" of free Bitcoin while making money\
    \ by displaying advertisements on the webpage. Some faucets include games, such\
    \ as digital dice, that result in larger or lesser faucet rewards. In general,\
    \ you won't make much money through faucets, but if you come every day over a\
    \ long period of time, it can add up.\n\n# CHAPTER 8\n\n#  Common Bitcoin Myths,\
    \ Mistakes, and Misconceptions\n\nIf you've been following along, you should be\
    \ fairly sure that you understand the fundamentals of Bitcoin and blockchain technology\
    \ at this point. You have the tools in your toolbox to create a Bitcoin wallet,\
    \ purchase Bitcoin, and conduct transactions. That being said, in order to actually\
    \ get started, there are a few common misconceptions regarding Bitcoin that should\
    \ be addressed in order to avoid falling into traps, making mistakes, or being\
    \ duped.\n\n         ![](Images/image00081.jpeg)\n\n# Is Bitcoin an anonymous\
    \ currency?\n\nThe fact that Bitcoin is \"anonymous\" is frequently mentioned\
    \ in writings about it. This has caused a great deal of confusion, but the quick\
    \ answer is: No, Bitcoin is not anonymous! Bitcoin transactions are known to be\
    \ recorded on the blockchain as transfers from one public Bitcoin address to another.\
    \ \n\nThere are techniques to raise the level of privacy around transactions,\
    \ although anonymity is not always accomplished by default when taken into account\
    \ in context.\n\nFor example, when you buy Bitcoin with fiat currency via a bank-linked\
    \ exchange like Coinbase, your funds are put into a specific Bitcoin wallet address.\
    \ There is a clear link between your bank account and your Bitcoin address in\
    \ this instance.\n\nBecause every Bitcoin transaction is permanently kept on the\
    \ publicly available blockchain, anyone may monitor the activities of a specific\
    \ wallet's public address. In theory, anonymity can be achieved by avoiding any\
    \ action that could link a wallet's public address to the wallet's owner. In practice,\
    \ however, when converting Bitcoin to currency, information about a user's identity\
    \ is frequently made public, or at the very least accessible to third parties.\
    \ It is better to proceed with the idea that Bitcoin is secure by default, but\
    \ not anonymous.\n\n# Is Bitcoin taxed?\n\nMany people, frequently under the mistaken\
    \ belief that Bitcoin is \"anonymous\" or \"untraceable,\" believe that Bitcoin\
    \ is not taxed. This is incorrect, at least in the majority of countries.\n\n\
    In the United States, the IRS regards Bitcoin and other types of digital currency\
    \ as an asset, similar to property, rather than a currency. This means that when\
    \ dealing in digital currency, you will be exposed to capital gain or loss.\n\n\
    Furthermore, whether you are an individual or a business, your income is taxed\
    \ if you are paid in Bitcoin. According to the IRS, taxpayers must report Bitcoin\
    \ transactions based on their monetary value in US dollars.\n\nAn in-depth examination\
    \ of tax law in regard to Bitcoin is beyond the scope of this book, but serious\
    \ Bitcoin investors should do their homework to avoid problems with the IRS. The\
    \ IRS Virtual Currency Guideline is available online at https://www.irs.gov/uac/newsroom/irs-virtual-currency-guidance.\n\
    \n# Is Bitcoin a tool used by criminals?"
  fmt: "\nOthers keep a close eye on the market and regularly transfer funds back\
    \ and forth between Bitcoin, fiat, and other cryptocurrencies, taking advantage\
    \ of slight price movements in a manner similar to Wall Street-style day trading.\
    \ These speculators seek to buy when prices are low and sell when they rise in\
    \ order to profit quickly (the \"fast nickel\"). The gains are often less when\
    \ employing this method, but enough successful trades can quickly add up.\n\n\
    While trading between fiat and Bitcoin is one way for people to make (or lose)\
    \ money, cryptocurrency trades frequently include swapping one cryptocurrency\
    \ for another rather than trading with cash. In this context, Bitcoin functions\
    \ as a \"gateway\" cryptocurrency.\n\n# Trading of Cryptocurrencies\n\nAside from\
    \ Bitcoin, there are hundreds more cryptocurrencies with differing levels of value,\
    \ volume, and potential. A vibrant trading culture exists around a number of these\
    \ alternative currencies (also known as \"alt-coins\"). Ethereum, Litecoin, and\
    \ Dogecoin are examples of popular alt-coins. Most alt-coins require the purchase\
    \ of Bitcoin before they may be purchased. Although there are few exceptions,\
    \ most alt-coins cannot be acquired directly with fiat currency, but rather with\
    \ Bitcoin.\n\nThe alt-coin space is a little like the \"wild west,\" with high\
    \ risks leading to enormous returns or large losses. Remember the early Bitcoin\
    \ adopter who spent his money on two pizzas? Many people are drawn to investing\
    \ in alt-coins because they have the potential to skyrocket in value, similar\
    \ to how Bitcoin did. Speculators may invest in an alt-coin if it is backed by\
    \ a promising application and a competent development team. Hedge funds that trade\
    \ solely in cryptocurrencies and blockchain technology have even begun to appear.\n\
    \n![Blockchain, Bitcoin, Bank, Business, Cash, Coin](Images/image00080.jpeg)\n\
    \nThe growing paradigm of blockchain-based currencies and apps has resulted in\
    \ a massive surge of speculative investment in this field, resulting in a slew\
    \ of new \"alt-coins\" trying to lead the way in various specialized use cases.\
    \ Ethereum, for example, is commonly regarded as the second most popular cryptocurrency\
    \ after Bitcoin. Some people feel that Ethereum will outperform Bitcoin in terms\
    \ of both value and popularity, and they have hedged their \"slow dime\" bets\
    \ by investing in Ethereum. Similarly, many have invested in potential newcomers\
    \ to the field and are willing to wait five years or more for the value to rise.\n\
    \nBeyond Bitcoin, the cryptocurrency and blockchain space is incredibly promising\
    \ for serious investors interested in developing technology. There is a lot of\
    \ noise to filter through, as there is in many other emerging digital fields.\
    \ Everyone has an opinion about the future of blockchain technology, and they\
    \ can't all be right. Listening to others is a terrific way to learn, but it is\
    \ ultimately up to you to establish your own opinions and decide what is best\
    \ for you.\n\n# How to Get Paid in Bitcoin\n\nBitcoin's worth and long-term survival\
    \ are largely determined by the number of people ready to accept it as a method\
    \ of payment. With Bitcoin's recent widespread acceptance, an increasing number\
    \ of vendors are offering the opportunity to pay for goods and services with Bitcoin.\n\
    \nMany businesses have been hesitant to accept Bitcoin as a payment option in\
    \ the past due to its volatility. Today, however, an increasing number of businesses\
    \ are incorporating Bitcoin payment methods into their company model. You may\
    \ now use Bitcoin to pay for items like plane tickets, online classes, cheeseburgers,\
    \ and much more.\n\nGetting paid in Bitcoin is one option for freelancers, small\
    \ enterprises, and entrepreneurs to invest in the currency. If you are paid in\
    \ Bitcoin for a service and the value of Bitcoin rises above the value of whatever\
    \ fiat money you were paid in, you can continue to gain even after the task is\
    \ completed. Of course, it bears reiterating that the inverse might also occur.\
    \ Many individuals set up wallets to receive Bitcoin tips, which may be a fun\
    \ way to get your feet wet without putting too much money at risk.\n\n# Faucets\
    \ for Bitcoin\n\nIf you spend some time online researching Bitcoin matters, you\
    \ will almost certainly come across the term \"faucets.\" These are places where\
    \ you can occasionally receive extremely little sums of Bitcoin for free. Most\
    \ faucets work by giving away a \"trickle\" of free Bitcoin while making money\
    \ by displaying advertisements on the webpage. Some faucets include games, such\
    \ as digital dice, that result in larger or lesser faucet rewards. In general,\
    \ you won't make much money through faucets, but if you come every day over a\
    \ long period of time, it can add up.\n\n# CHAPTER 8\n\n#  Common Bitcoin Myths,\
    \ Mistakes, and Misconceptions\n\nIf you've been following along, you should be\
