    Miners are compensated with a set quantity of new Bitcoin in return for solving
    blocks, thereby increasing the global volume of available Bitcoins in circulation.
    This incentive encourages more people to mine, resulting in a more secure system
    due to greater dispersion.


    在比特币的早期，矿工可以在几乎任何旧电脑上进行挖矿，且“发现”一个区块的奖励相当可观，尽管比特币的整体价值极低，且流通的比特币数量并不多。随着更多人开始使用比特币并成为矿工，这些条件随时间而变化。


    比特币协议内置了矿工数量与挖矿难度之间的关联，即每个区块的挖矿难度与参与矿工的数量成正比。原则上，更多的矿工加入应该会导致更快的区块生成速率。


    比特币协议的设计使得，当区块数量增加时，解决有效挖矿区块所需的复杂数学问题的难度会提升。这种难度的提升会减缓区块生成的速率。比特币流通量与新区块挖矿难度之间的这种关联，使得生态系统在长期内保持稳定。


    如今，挖矿区块所需的难度在计算机算力和电力消耗方面都极为资源密集，这使得必须使用专用设备。在大多数情况下，矿业运营的成本远超长期内能从比特币挖矿中获得的收益。许多矿工目前通过“矿池”（pools）或集体形式工作，参与者汇集资源并分享奖励。加入矿池是提高找回矿机投入成本并可能盈利的一种途径。尽管仍可通过挖矿获得比特币，但入门并不简单，也绝非免费。


    # Purchasing Bitcoin


    虽然矿业存在一定可能性，但它绝非获取比特币的最直接方式。与其尝试挖掘新比特币，不如从其他渠道获取已有比特币要更快、更简便。


    你可以选择多种途径获取比特币。无论选择哪条路，都需要创建一个比特币钱包来接收和存储资金。


    # Exchanges for Bitcoin


    在许多国家，使用法币购买比特币是最便捷的方式。比特币交易所的功能基本与其他货币交易所相同，即用一种货币购买另一种货币。撰写时，Coinbase（coinbase.com）是美国最受欢迎的比特币交易所之一。Coinbase
    是一个在线平台，让你能够创建比特币钱包、连接银行账户，并通过简洁的用户界面购买或出售比特币。


    交易所通常会收取交易费用，Coinbase 也不例外。虽然大多数比特币交易所名义上是“免费”的，但大多数或全部交易都会涉及百分比费用。交易所处理交易时也常见延迟，延迟时间可能从稍微烦人到极其严重不等。了解流程并考虑费用和等待时间，能让你的交易更加顺畅。


    大多数允许使用法币购买比特币的交易所会要求你绑定银行账户并提供个人信息，以便快速便捷地交换法币为比特币。再次强调，选择一家具备韧性且声誉良好的交易所是值得的。


    即使如此，长期大量持有比特币在线交易所并不总是明智的选择。多年来，Mt. Gox 是全球领先的比特币交易所。其巅峰时期处理了全球近 70% 的比特币交易。


    2014 年，一场重大安全漏洞发生，导致约 85 万枚比特币在奇特情况下被盗或丢失。交易所对于在比特币与法币之间转账、交易以及积极参与比特币生态系统非常有用，但
    Mt. Gox 的事件说明了将所有资产全部存放在在线交易所的风险。


    # ATMs for Bitcoin


    比特币自动柜员机（Bitcoin ATM）是另一种日益流行的购买比特币的方式。这些机器遍布购物中心、机场、市中心等地，外观类似普通 ATM，但存在一些关键区别。比特币
    ATM 通常不直接与任何银行相连。


    ![Image of Bitcoin ATM](https://example.com/bitcoin-atm.jpg)


    它们主要通过互联网连接到比特币网络。许多比特币 ATM 支持双向交易，即你可以投入现金将其转换为比特币并发送到公开地址，或将你的比特币转换为现金并由机器取出。有些公司仅处理单向交易。


    比特币 ATM 可提供一种相对匿名的购买方式，无需像 Coinbase 这类平台绑定银行账户。然而，根据机器不同，交易费用可能相当高，且存款或取款金额可能受到限制。你可以通过
    `https://coinatmradar.com/` 的 Coin ATM Radar 网站查找附近的比特币 ATM。


    # Obtaining Bitcoin from Others


    自比特币诞生以来，最普遍的入门方式之一是寻找愿意赠送或出售比特币的人。由于比特币是数字资产，因此比特币社区的大部分成员自然聚集在线上。像 bitcointalk.org
    这样的论坛以及 Reddit 的 r/bitcoin 都是与其他比特币用户互动的 excellent 场所。一些比特币爱好者愿意为新手提供少量比特币，以帮助他们设置第一个钱包。毕竟，比特币使用者越多，需求越大，理论上价值也越高。从长期财务角度来看，帮助新用户入门是有意义的，即使这意味着初期需要花费一些自己的资金。


    此外，还有若干在线工具可以帮助你找到本地的比特币交易点，用户可以线下在现实世界中聚会进行比特币交易。这种方式可以节省交易费用，结识本地比特币爱好者，并可能提升交易匿名性。与任何“从互联网”见面的场景一样，在现实中交换比特币时务必保持谨慎。


    # CHAPTER 6


    #  Bitcoin''s History


    我们可以争论比特币何时进入主流视野。总体而言，尽管之前比特币价值曾有过上涨，但大多数人认为 2016 - 2017 年是公众对比特币及区块链技术认知和接受度显著提升的时期。作为潜在投资者，回顾比特币的历史有助于更好地理解其演变过程。研究塑造当前市场的事件与行为，有助于我们构建对未来的预测并作出明智的决策。


    比特币最引人入胜的轶事特征之一是其创建之谜。比特币最初于 2008 年出现，当时一份描述该概念的文档被发送到一份密码学电子邮件列表。该文档标题为《Bitcoin:
    A Peer-to-Peer Electronic Cash System》，作者署名为“Satoshi Nakamoto”。


    几个月后，即 2009 年 1 月，Satoshi Nakamoto 构建了比特币并将代码“开源”（意味着任何人都可以查看）。Nakamoto 矿工了比特币的第一个区块，即“创世块”（genesis
    block），从而启动了比特币区块链。


