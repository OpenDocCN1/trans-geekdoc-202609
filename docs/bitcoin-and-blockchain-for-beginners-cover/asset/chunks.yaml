    \ may be charged a large transaction fee. Because everything is housed in one\
    \ centralized database, if a bank is hacked, millions of accounts may be affected.\
    \ Despite the numerous drawbacks, most of us end up putting our money in banks\
    \ since there is no other option. We have no choice but to put our trust in these\
