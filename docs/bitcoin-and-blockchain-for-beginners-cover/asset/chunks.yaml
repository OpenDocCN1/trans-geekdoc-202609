  trans: '

    虽然流行媒体（如电视剧和电影）无疑推动了比特币的主流化，但它几乎总是被描绘成在某些犯罪环境中用于非法交易的工具。甚至有人声称恐怖分子是比特币的主要用户！虽然非法商品和服务在网络上出售，尤其是在“暗网”上，但比特币的大多数用户并不参与犯罪活动。


    比特币本身并不适合进行非法操作，这在很大程度上是因为交易记录公开，而且比特币默认并不匿名。到目前为止，著名的 Winkelvoss 双胞胎——Gemini
    比特币交易所的创建者——曾表示比特币仅由“笨拙的罪犯”使用。


    比特币与非法活动的关联很大程度上源于前文提到的著名 Mt. Gox 交易所事件。


    Mt. Gox 失去大量比特币的模糊情况引发了众多标题，这些标题指责比特币本身，而非 Mt. Gox 交易所的管理不善。


    同样，2013 年美国联邦调查局关闭臭名昭著的“丝绸之路”（Silk Road）网站——该网站主要用于贩卖非法毒品和其他暗网商品——时，许多人误以为这一事件意味着比特币本身被“关闭”。


    比特币难以理解，早期媒体对比特币的报道未能区分比特币与其上层构建的众多平台（如丝绸之路和 Mt. Gox）。如今，随着比特币在全球范围内获得关注，公众认知正在迅速转变，但仍有许多人认为比特币本质上是不合法或非法的。


    # 比特币是否是一个被操纵的庞氏骗局？


    “庞氏骗局”一词已与各种加密货币联系在一起。其他“替代币”可能是庞氏骗局，但比特币不是其中之一。


    庞氏骗局通过承诺巨额回报来诱骗投资者投入一个从未真正实现的概念。由于比特币是去中心化的，不存在可以欺诈投资者的 CEO 或“比特币之父”。此外，比特币从未做出过关于市场价值的任何承诺。任何了解比特币的人都会告诉你，它极其波动，你每天都不知道它会涨还是跌。


    最终，庞氏骗局的核心特征是不提供真正的价值。我们几乎每天都能看到比特币和区块链<unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><u