    \n# Is Bitcoin a tool used by criminals?\n"
  trans: '

    -   [Blockchain、Bitcoin、银行、企业、现金、硬币](https://example.org/blockchain)的增长范式导致了对该领域进行大量投机性投资，这引发了一系列试图在各种专门用例中引领潮流的新“alt-coin”。例如，以太坊通常被认为是比特币之后第二大流行的加密货币。一些人认为以太坊在价值和受欢迎程度上将超越比特币，因此他们通过投资以太坊来对“慢钞”进行对冲。同样，许多人投资于该领域的潜在新秀，并愿意等待五年或更长时间以期价值上涨。


    -   除了比特币之外，加密货币和区块链领域对认真投资于技术开发的投资者来说充满希望。由于存在大量噪音，就像许多其他新兴数字领域一样，必须进行筛选。每个人都对区块链技术的未来发表看法，但未必全对。倾听他人意见是学习的好方法，但最终还是由你自己建立自己的观点并决定什么对你最好。


    # 如何用比特币赚钱


    比特币的价值和长期生存很大程度上取决于愿意将其作为支付手段的人数。随着比特币的广泛接受，越来越多的商家提供使用比特币支付商品和服务的机会。


    过去，许多企业因比特币的波动性而不愿接受比特币作为支付选项。然而，如今越来越多的企业正在将比特币支付方式纳入其商业模式。你现在可以使用比特币支付机票、在线课程、奶酪汉堡等。


    以比特币支付的方式是自由职业者、小企业和企业家投资货币的一种选择。如果你为服务收到比特币，且比特币的价值高于你原本以法币收到的价值，你可以在任务完成后继续获得收益。当然，相反的情况也可能发生。许多人设置钱包接收比特币小费，这可能是一个在不冒太大风险的情况下让你体验的有趣方式。


    # 比特币水龙头


    如果你在网络上花一些时间研究比特币相关事宜，你几乎肯定会遇到“水龙头”（faucets）这个术语。这些是你可以偶尔免费获得极小的比特币份额的地方。大多数水龙头通过在网页上显示广告来赚取利润，同时给予用户“滴答”般的免费比特币。一些水龙头还包含游戏，例如数字骰子，这会导致更大或更小的水龙头奖励。总体而言，通过水龙头很难赚到多少钱，但如果你长时间每天都来，累积的金额可能会增加。


    # 第 8 章


    # 常见比特币谬误、错误和误解


    如果你已经跟随了本文，你应该已经对比特币和区块链技术的基本概念有了清晰的理解。你拥有创建比特币钱包、购买比特币并进行交易的工具。但为了实际开始，仍需澄清几个关于比特币的常见误解，以免陷入陷阱、犯错或受骗。


    ![](img/image00081.jpeg)


    # 比特币是匿名货币吗？


    比特币是“匿名”的事实经常在关于它的文章中被提及。这导致了大量混淆，但简短的回答是：不，比特币不是匿名的！比特币交易会记录在区块链上，作为从一个公开比特币地址转移到另一个公开比特币地址的转账。虽然存在一些技术可以提升交易隐私，但匿名性并非默认的，需要在特定情境下考虑。


    例如，当你通过与银行账户关联的交易所（如 Coinbase）用法币购买比特币时，你的资金会进入特定的比特币地址。此时，你的银行账户与该比特币地址之间存在明确的关联。


    由于每笔比特币交易都会永久记录在公开的区块链上，任何人都可以监控特定公开地址的活动。理论上，通过去避免任何可能将公开地址与地址持有者关联的行为，可以实现匿名。但在实践中，当将比特币兑换为法币时，用户身份信息往往会公开，或者至少会被第三方获取。因此，最好假设比特币默认是安全的，但不具备匿名性。


    # 比特币是否征税？


    许多人常常误以为比特币是“匿名”或“难以追踪”，因此认为比特币不征税。这种观点是错误的，在大多数国家，比特币是受征税的。


    在美国，美国国税局（IRS）将比特币和其他数字货币视为一种资产，类似于房地产，而不是货币。这意味着在使用数字货币时，你将面临资本收益或损失。


    此外，无论你是个人还是企业，如果你以比特币形式收到收入，你的收入仍需纳税。根据 IRS 的规定，纳税人必须根据比特币在美元中的面值来申报比特币交易。


    对比特币税务法的深入探讨超出了本书的范围，但认真投资比特币的投资者应该做好功课，以免与 IRS 产生纠纷。IRS 虚拟货币指南可在线查阅 https://www.irs.gov/uac/newsroom/irs-virtual-currency-guidance。


    # 比特币是否是罪犯的工具？


    '
