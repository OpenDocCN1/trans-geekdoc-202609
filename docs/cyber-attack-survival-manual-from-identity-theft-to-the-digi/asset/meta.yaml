- - '##'
  - 趣味事实
- - '###'
  - 手机分钟作为货币货币本质上是价值的物理表现。从历史上看，黄金和其他贵金属及矿物因其稀缺性和感知实际价值被用交易媒介。双方之间任何共同价值的物品都可以货币，这是合理的。
- - '##'
  - 技术与钱随着技术的演进，我们的财务状况也会随之改变。从 IOUs 到 ledgers，再到持续统一的硬币和钞票，随着技术的进步，将其应用于货币，这是完全合理的。
- - '###'
  - 智能手机与财务任何拥有智能手机的人口袋里都带了一台微型计算机，并可以连接到全球金融网络。无论你是在银行转账、发送 PayPal 付款、进行交易、在农贸市场买西红柿、叫网车，还是通过
    QR code 使用 bitcoin 支付，今天的手机比二十年前的银行柜员复杂得多。
- - '###'
  - 信用卡未来货币梦想之一是创建一个单一的全球统一货币。在某种程度上，我们今天已经实现了这一点，得益于几乎在任何地方被接受且具有卓越防欺保护的 credit cards。但即使拥有最好的安全系统，复杂的社交黑客也能在采取最后的预防措施的情况下成功伪你的身份。Credit
    cards 永远不会消失，它们是事实上的通用货币。
- - '###'
  - 区块链扩张尽管它们在感知价值上可能在好奇物品和商品之间有所波动，但 cryptocur 在短期内不会消失——blockchain 也是。事实上，blockchain
    的概念可以应用于世界经济的其他部分，而不仅仅是追踪 cryptocur 及其交易。由于 blockchain 上的交易一旦记录就板上钉钉，该技术可以创建廉价、防篡改的公共注册库，记录谁拥有各种土地或财产，在不需要现场公证员的情况下对文件进行公证，甚至可以确保股市和其他高价值交易系统及金融的安全。
