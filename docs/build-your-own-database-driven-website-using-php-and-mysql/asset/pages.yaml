    <p><a href="<?=$PHP_SELF?>">Add another Joke</a></p>

    <p><a href="jokes.php">Return to Joke Search</a></p>

    ```


    The word IGNORE in the INSERT query used here is a precaution only. Recall that
    when we defined the JokeLookup table we set the JID and CID columns to be the
    primary key for the table. If somehow the JID/CID pair that is inserted already
    exists in the table, an attempt to insert it again would normally cause an error.
    By adding IGNORE to the command, a re-insert of the same pair is simply ignored
    by MySQL and no error occurs. This situation should never actually happen, but
    it''s better to be safe than sorry.


    The two files that remain, editjoke.php and deletejoke.php, mirror their author
    and category counterparts, with minor adjustments. editjoke.php must provide the
    same author select box and category checkboxes as addjoke.php, except that this
    time they must be initialized to reflect those values stored in the database for
    the particular joke we''ve selected. deletejoke.php, meanwhile, must not only
    delete the selected joke from the Jokes table, but must also remove any entries
    in the JokeLookup table for that joke. The code for both of these files is provided
    in the code archive (located at http://www.sitepoint.com/books/), but we won''t
    spend time examining its details, since these files are just an application of
    skills that should be fairly familiar to you by now.


    # Summary


    There are a few minor tasks that our content management system is still not able
    to handle. For example, it''s currently unable to provide a listing of all jokes
    that don''t belong to any category -- something that could come in very handy
    as the number of jokes in the database grows. You might also like to sort joke
    listings by various criteria. These particular capabilities require a few more
    advanced SQL tricks that we''ll see later.


    If we ignore these little details for the moment, you''ll see that you now have
    a system that allows someone with no SQL or database knowledge to administer your
    database of jokes with ease! Together with a set of PHP-powered pages through
    which regular site visitors can view the jokes, this content management system
    allows us to set up a complete database-driven Web site that can be maintained
    by someone with absolutely no database knowledge. And if you think that sounds
    like a valuable commodity to businesses looking to get on the Web today, you''re
    right!'
