- pgno: 164
  md: '# 11 Storing Binary Data in MySQL


    In the previous chapter, we developed a system whereby users could upload image
    files and have them stored on your Web server for display on your site. In developing
    this system, we had to tackle several issues:


    +   - Ensure that non-conflicting filenames are generated.

    +   - Synchronize stored files with the database by adding an entry for each file
    as it is uploaded.

    +   - Delete old files when their database entries are deleted.


    While I effectively demonstrated that these constraints can be met, after 10 chapters
    of pushing the advantages of relational databases, you may have been surprised
    that I didn''t opt for a solution where the files were stored in the database.


    In cases where you''re dealing with relatively small files (e.g. small head shots
    for use in a staff directory), the storage of data in MySQL is in fact quite practical.
    In this chapter, I''ll demonstrate how to use PHP to store binary files uploaded
    over the Web in a MySQL database, and how to retrieve those files for download
    or display.


    # Binary Column Types


    As with most database-driven Web applications, the first thing to consider is
    the layout of the database. For each of the files that''s stored in our database,
    we will store the file name, the MIME type (e.g. image/pjpeg for JPEG image files),
    a short description of the file, and the binary data itself. Here''s the CREATE
    TABLE statement that must be entered in MySQL to create the table:


    ```

    mysql> CREATE TABLE filestore (

    -> ID INT NOT NULL PRIMARY KEY AUTO_INCREMENT,

    -> FileName VARCHAR(255) NOT NULL,

    -> MimeType VARCHAR(50) NOT NULL,

    -> Description VARCHAR(255) NOT NULL,

    -> Filedata MEDIUMBLOB

    -> );

    ```


    Most of this should be familiar to you; however, the MEDIUMBLOB column type is
    new. If you consult the MySQL Column Type Reference in Appendix'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'C, you’ll find that MEDIUMBLOB is the same as MEDIUMTEXT, except that it performs
    case-sensitive searches and sorts. In fact, from MySQL’s point of view, there
    is no difference between binary data and blocks of text – both are just long strings
    of bytes to be stored in the database. The reason we’ll use MEDIUMBLOB instead
    of MEDIUMTEXT is simply to anticipate the situation where we might need to compare
    the contents of one binary file with another. In such cases, we’d want the comparison
    to be ‘case sensitive’, as binary files may use byte patterns that are equivalent
    to alphabetical letters, and we’d want to distinguish between the byte pattern
    that represents ‘A’ from that which represents ‘a’.


    MEDIUMBLOB is one in a member of a family of ‘BLOB’ column types designed to store
    variable-length binary data (BLOB stands for Binary Large Object). These column
    types differ from one another only in two aspects: the maximum size of the data
    a particular value in the column can contain, and the number of bytes used to
    store the length of each data value. The different binary column types are listed
    with these details in Table 1.


    # Table 1 -- Binary Column Types in MySQL


    | Column Type | Maximum Size | Space req''d per entry |

    | :--- | :--- | :--- |

    | TINYBLOB | 255B | Data size + 1 byte |

    | BLOB | 65KB | Data size + 2 bytes |

    | MEDIUMBLOB | 16.7MB | Data size + 3 bytes |

    | LONGBLOB | 4.3GB | Data size + 4 bytes |


    As you can see, the table we created above will be able to store files up to 16.7MB
    in size. If you think you’ll need larger files, you can bump the FileData column
    up to a LONGBLOB. Each file will occupy 1 more byte in the database (because MySQL
    will require that extra byte in order to record larger file sizes), but you’ll
    be able to store files up to 4.3GB in size (assuming that your operating system
    allows files of that size)!


    # Storing Files


    The next step is to create a PHP script that lets users upload files and store
    them in the database. You can hold off copying the code in the next two sections
    – I’ll present it all as a complete script at the end of the chapter.


    Here’s the code for the form (there should be no surprises here):


    ```

    <form action="<?=PHP_SELF?>?action=ulfile" method="post" enctype="multipart/form-data">

    <p>Upload File:<br />

    ```'
