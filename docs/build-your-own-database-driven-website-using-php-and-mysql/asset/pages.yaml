    \ INSERT, UPDATE, and DELETE statements, I'd suggest you read the section of the\
    \ MySQL manual on the subject first. However, since the release of version 3.22.11,\
    \ MySQL provides a simpler method to manage user access. Using GRANT and REVOKE\
    \ - non-standard commands provided by MySQL - you can create users and set their\
    \ privileges without worrying about the details of how they'll be represented\
    \ in the tables mentioned above.\n\n# Using GRANT\n\nThe GRANT command, used to\
    \ create new users, assign user passwords, and add user privileges, looks like\
    \ this:\n\n```\nmysql> GRANT privileges ON what\n   -> TO user [IDENTIFIED BY\
    \ \"password\"]\n   -> [WITH GRANT OPTION];\n```\n\nAs you can see, there are\
    \ a lot of blanks to be filled in with this command. Let's describe each of them\
    \ in turn, and then look at some examples to give you an idea of how they work\
    \ together.\n\nprivileges is a comma-separated list of the privileges you wish\
    \ to grant. The privileges you can specify can be sorted into three groups:\n\n\
    # Database/Table/Column privileges\n\n+   - ALTER: Modify existing tables (e.g.\
    \ add/remove columns) and indexes.\n+   - CREATE: Create new databases and tables.\n\
    +   - DELETE: Delete table entries.\n+   - DROP: Delete tables and/or databases.\n\
    +   - INDEX: Create and/or delete indexes.\n+   - INSERT: Add new table entries.\n\
    +   - SELECT: View/search table entries.\n+   - UPDATE: Modify existing table\
    \ entries.\n\n# Global administrative privileges\n\n+   - FILE: Read and write\
    \ files on the MySQL server.\n+   - PROCESS: View and/or kill server threads that\
    \ belong to other users.\n+   - RELOAD: Reload the access control tables, flush\
    \ the logs, etc.\n+   - SHUTDOWN: Shut down the MySQL server."
