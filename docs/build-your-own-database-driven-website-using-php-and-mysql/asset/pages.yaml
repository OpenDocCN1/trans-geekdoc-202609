- pgno: 203
  md: 'The FROM clause contains a list of tables from which the rows composing the
    result set should be formed. At its most basic, `table_refs` is a comma-separated
    list of one or more tables, which may be assigned aliases with or without using
    `AS` as described above for `select_expression`. If you specify more than one
    table name, you are performing a _join_. These are discussed in the section entitled
    Joins below.


    The `where_definition` in the `WHERE` clause sets the condition for a row to be
    included in the table of results sent in response to the `SELECT` query. This
    may be a simple condition (e.g. `id=5`) or a complex expression that makes use
    of MySQL functions and combines multiple conditions using Boolean operators (`AND`,
    `OR`, `NOT`).


    The **GROUP BY** clause lets you specify one or more columns (by name, alias,
    or column position, where 1 is the first column in the result set) for which rows
    with equal values should be collapsed into single rows in the result set. This
    clause should usually be used in combination with the MySQL grouping functions
    such as `COUNT()`, `MAX()`, and `AVG()` described in Appendix B on page 211 to
    produce result rows that give summary information about the groups produced. By
    default, the grouped results are sorted in ascending order of the grouped column(s),
    however, the `ASC` or `DESC` argument may be added following each column reference
    to explicitly sort the results in ascending or descending order for that column,
    respectively. Results are sorted by the first column listed, and then tying sets
    of rows are sorted by the second, and so on.


    Note that the `WHERE` clause is processed before **GROUP BY** grouping occurs,
    so conditions in the `WHERE` clause may not refer to columns produced by the grouping
    operation. To impose conditions on the post-grouping result set, you should use
    the **HAVING** clause instead. This clause’s syntax is identical to that of the
    `WHERE` clause, except the conditions specified here are processed just prior
    to returning the set of results, and are not optimized in any way. For this reason,
    you should always use the `WHERE` clause whenever possible. For more information
    on **GROUP BY** and the **HAVING** clause, see Chapter 9: Advanced SQL.


    The **ORDER BY** clause lets you sort results according the values in one or more
    rows before they are returned. As for the **GROUP BY** clause, each column may
    be identified by a column name, alias, or position (where 1 is the first column
    in the result set), and each column may have an `ASC` or `DESC` argument to specify
    that sorting occur in ascending or descending order, respectively (ascending is
    the default). Rows are initially sorted by the first column listed, and then tying
    sets of rows are sorted by the second, and so on.


    The **LIMIT** clause instructs the query to return only a portion of the results
    it would normally generate. In the simple case, `LIMIT n` returns only the first'
  merge: -1
  img_proc: true
- pgno: 204
  md: 'n rows of the complete result set. You can also specify an offset by using
    the form LIMIT x, n. In this case, up to n rows will be returned, beginning from
    the xth row of the complete result set (the first row corresponds to x = 0, the
    second to x = 1 and so on).


    # # Joins


    As described above, the FROM clause of a SELECT query lets you specify the tables
    that are combined to create the result set. When multiple tables are combined
    in this way, it is called a join. MySQL supports several types of joins, as defined
    by the following supported syntaxes for the table_refs component of the FROM clause
    above:


    ```

    table_ref

    table_refs, table_ref

    table_refs, table_ref

    table_refs [CROSS] JOIN table_ref

    table_refs INNER JOIN table_ref join_condition

    table_refs STRAIGHT_JOIN table_ref

    table_refs LEFT [OUTER] JOIN table_ref join_condition

    { oj table_ref LEFT OUTER JOIN table_ref ON cond_expr }

    table_refs NATURAL [LEFT [OUTER]] JOIN table_ref

    table_refs RIGHT [OUTER] JOIN table_ref join_condition

    table_refs NATURAL [RIGHT [OUTER]] JOIN table_ref

    ```


    Where table_ref is defined as:


    ```

    table_name [[AS] alias] [USE INDEX (key_list)]

    [IGNORE INDEX (key_list)]

    ```


    and join_condition is defined as one of the following:


    ```

    ON cond_expr

    USING (column_list)

    ```


    The most basic type of join, an inner join, produces rows made up of all possible
    pairings of the rows from the first table with the second. You can perform an
    inner join in MySQL either by separating the table names with a comma (,) or with
    the words JOIN, CROSS JOIN, or INNER JOIN (these are all equivalent).


    Normally, the WHERE clause of the SELECT query is used to specify a condition
    to narrow down which of the combined rows are actually returned (e.g. to match
    up a primary key in the first table with a column in the second); however, when
    the INNER JOIN syntax is used, the ON form of the join_condition can play this
    role as well. As a final alternative, the USING (column_list) form of join_condition
    lets you specify columns that must match between the two tables. For example,'
  merge: -1
  img_proc: true
- pgno: 205
  md: '```

    SELECT * FROM t1 INNER JOIN t2 USING (aid)

    ```


    is equivalent to


    ```

    SELECT * FROM t1 INNER JOIN t2 ON t1.aid = t2.aid

    ```


    and also


    ```

    SELECT * FROM t1, t2 WHERE t1.aid = t2.aid

    ```


    **STRAIGHT_JOIN** works the same as an inner join, except that the tables are
    processed in the order listed (left first, then right). Normally MySQL selects
    the order that will produce the shortest processing time, but if you think you
    know better, you can use a STRAIGHT_JOIN.


    The second type of join is an **outer join**, which is accomplished in MySQL with
    LEFT/RIGHT [OUTER] JOIN (OUTER is completely optional, and has no effect). In
    a LEFT outer join, any row in the left-hand table that has no matching rows in
    the right-hand table (as defined by the `join_condition`), will be listed as a
    single row in the result set. NULL values will appear in all the columns that
    come from the right-hand table.


    The { oj ... } syntax is equivalent to a standard left outer join; it is included
    for compatibility with other ODBC databases.


    RIGHT outer joins work in the same way as LEFT outer joins, except in this case,
    it is the table on the right whose entries are always included, even if they do
    not have matching entries in the left-hand table. Since RIGHT outer joins are
    non-standard, it is usually best to stick to LEFT outer joins for cross-database
    compatibility.


    For some practical examples of outer joins and when they are useful, see Chapter
    9: Advanced SQL.


    **NATURAL** joins are kind of ‘automatic’, in that they will automatically match
    up rows based on column names that are found to match between the two tables.
    Thus, if a table called Jokes has an AID column that refers to entries in an Authors
    table whose primary key is another AID column, you can perform a join of these
    two tables on that column very simply (assuming there are no other columns with
    identical names in the two tables):


    ```

    SELECT * FROM Jokes NATURAL JOIN Authors

    ```


    # SET


    ```

    SET [OPTION] SQL_VALUE_OPTION = value, ...

    ```'
  merge: -1
