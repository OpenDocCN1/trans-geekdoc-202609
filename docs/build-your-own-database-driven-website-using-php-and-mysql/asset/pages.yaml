- pgno: 14
  md: '# Introduction


    On the Web today, content is king. Once you’ve mastered HTML and learned a few
    neat tricks in JavaScript and Dynamic HTML, you can probably build a pretty impressive-looking
    Web site design. But then comes the time to fill that fancy page layout with some
    real information. Any site that successfully attracts repeat visitors has to have
    fresh and constantly-updated content. In the world of traditional site building,
    that means HTML files—and lots of ’em.


    The problem is that, more often than not, the people who provide the content for
    a site are not the same people who handle its design. Oftentimes, the content
    provider doesn’t even know HTML. How, then, is the content to get from the provider
    onto the Web site? Not every company can afford to staff a full-time Webmaster,
    and most Webmasters have better things to do than copying Word files into HTML
    templates anyway.


    Maintenance of a content-driven site can be a real pain, too. Many sites (perhaps
    yours?) feel locked into a dry, outdated design because rewriting those hundreds
    of HTML files to reflect a new design would take forever. Server-side includes
    (SSI’s) can help alleviate the burden a little, but you still end up with hundreds
    of files that need to be maintained should you wish to make a fundamental change
    to your site.


    The solution to these headaches is database-driven site design. By achieving complete
    separation between your site’s design and the content you want to present, you
    can work with each without disturbing the other. Instead of writing an HTML file
    for every page of your site, you only need to write a page for each kind of information
    you want to be able to present. Instead of endlessly pasting new content into
    your tired page layouts, create a simple content management system that allows
    the writers to post new content themselves without a lick of HTML!


    In this book, I’ll provide you with a hands-on look at what’s involved in building
    a database-driven Web site. We’ll use two tools for this, both of which may be
    new to you: the PHP scripting language and the MySQL relational database management
    system. If your Web host provides PHP and MySQL support, you’re in great shape.
    If not, we’ll be looking at the set-up procedures under Linux and Windows, so
    don’t sweat it.'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# # Who Should Read this Book


    This book is aimed at intermediate or advanced Web designers looking to make the
    leap into server-side programming. You''ll be expected to be comfortable with
    simple HTML, as I''ll be making use of it without much in the way of explanation.
    A teensy bit of JavaScript may serve us well at some point as well, but I''ll
    be sure to keep it simple for the uninitiated.


    By the end of this book, you can expect to have a grasp of what''s involved in
    setting up and building a database-driven Web site. If you follow the examples,
    you''ll also learn the basics of PHP (a server-side scripting language that allows
    you to do a lot more than access a database easily) and Structured Query Language
    (SQL – the standard language for interacting with relational databases) as supported
    by MySQL, one of the most popular free database engines available today. Most
    importantly, you''ll come away with everything you need to get started on your
    very own database-driven site in no time!


    # # What''s in this Book


    This book comprises the following 12 chapters. Read them in order from beginning
    to end to gain a complete understanding of the subject, or skip around if you
    need a refresher on a particular topic.


    # # Chapter 1: Installation


    Before you can start building your database-driven Web presence, you must first
    ensure that you have the right tools for the job. In this first chapter, I''ll
    tell you where to obtain the two essential components you''ll need: the PHP scripting
    language and the MySQL database management system. I''ll step you through the
    set-up procedures on both Windows and Linux, and show you how to test that PHP
    is operational on your Web server.


    # # Chapter 2: Getting Started with MySQL


    Although I''m sure you''ll be anxious to get started building dynamic Web pages,
    I''ll begin with an introduction to databases in general, and the MySQL relational
    database management system in particular. If you''ve never worked with a relational
    database before, this should definitely be an enlightening chapter that will whet
    your appetite for things to come! In the process, we''ll build up a simple database
    to be used in later chapters.


    # # Chapter 3: Getting Started with PHP


    Here''s where the fun really starts. In this chapter, I''ll introduce you to the
    PHP scripting language, which can be used to easily build dynamic Web pages that
    present up-to-the-moment information to your visitors. Readers with previous programming
    experience will probably be able to get away with a quick skim of this chapter,
    as I explain the essentials of the language'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'from the ground up. This is a must-read chapter for beginners, however, as
    the rest of this book relies heavily on the basic concepts presented here.


    # Chapter 4: Publishing MySQL Data on the Web


    In this chapter we bring together PHP and MySQL, which you''ll have seen separately
    in the previous two chapters, to create some of your first database-driven Web
    pages. We''ll explore the basic techniques of using PHP to retrieve information
    from a database and display it on the Web in real time. I''ll also show you how
    to use PHP to create Web-based forms for adding new entries to, and modifying
    existing information in, a MySQL database on-the-fly.


    # Chapter 5: Relational Database Design


    Although we''ll have worked with a very simple sample database in the previous
    chapters, most database-driven Web sites require the storage of more complex forms
    of data than we''ll have dealt with so far. Far too many database-driven Web site
    designs are abandoned midstream, or are forced to start again from the beginning,
    because of mistakes made early on, during the design of the database structure.
    In this critical chapter, I''ll teach the essential principles of good database
    design, emphasizing the importance of data normalization. If you don''t know what
    that means, then this is definitely an important chapter for you to read!


    # Chapter 6: A Content Management System


    In many ways the climax of the book, this chapter is the big payoff for all you
    frustrated site builders who are tired of updating hundreds of pages whenever
    you need to make a change to a site''s design. I''ll walk you through the code
    for a basic content management system that allows you to manage a database of
    jokes, their categories, and their authors. A system like this can be used to
    manage simple content on your Website, and with a few modifications you should
    be able to build a Web administration system that will have your content providers
    submitting content for publication on your site in no time - all without having
    to know a shred of HTML!


    # Chapter 7: Content Formatting and Submission


    Just because you''re implementing a nice, easy tool to allow site administrators
    to add content to your site without their knowing HTML, doesn''t mean you have
    to restrict that content to plain, unformatted text. In this chapter, I''ll show
    you some neat tweaks you can make to the page that displays the contents of your
    database - tweaks that allow it to incorporate simple formatting such as bold
    or italicized text, among other things. I''ll also show you a simple way to safely
    make a content submission form directly available to your content providers, so
    that they can submit new content directly into your system for publication, pending
    an administrator''s approval.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# ## Chapter 8: MySQL Administration


    While MySQL is a good, simple database solution for those who don''t need many
    frills, it does have some complexities of its own that you''ll need to understand
    if you''re going to rely on a MySQL database to store your content. In this section,
    I''ll teach you how to perform backups of, and manage access to, your MySQL database.
    In addition to a couple of inside tricks (like what to do if you forget your MySQL
    password), I''ll explain how to repair a MySQL database that has become damaged
    in a server crash.


    # ## Chapter 9: Advanced SQL


    In chapter 5 we saw what was involved in modeling complex relationships between
    pieces of information in a relational database like MySQL. Although the theory
    was quite sound, putting these concepts into practice requires that you learn
    a few more tricks of Structured Query Language. In this chapter, I''ll cover some
    of the more advanced features of this language to get you efficiently juggling
    complex data like a pro.


    # ## Chapter 10: Advanced PHP


    PHP lets you do a lot more than just retrieve, display, insert, and update information
    stored in a MySQL database. In this chapter, I''ll give you a peek at some other
    interesting things you can do with PHP, such as server-side includes, handling
    file uploads, and sending email. Of course, as we''ll see, these features are
    really useful for improving the performance and security of your database-driven
    site, as well as sending feedback to your visitors.


    # ## Chapter 11: Storing Binary Data in MySQL


    Some of the most interesting applications of database-driven Web design include
    some juggling of binary files. Online file storage services like the now-defunct
    iDrive, are prime examples, but a system as simple as a personal photo gallery
    can benefit from storing binary files (e.g. pictures) in a database for retrieval
    and management on the fly. In this chapter, we develop a very simple online file
    storage and viewing system and learn the ins and outs of working with binary data
    in MySQL.


    # ## Chapter 12: Cookies and Sessions in PHP


    One of the most hyped new features in PHP4 is built-in support for sessions. But
    what are sessions? How are they related to cookies, a long-suffering technology
    for preserving stored data on the Web? What makes persistent data so important
    in current ecommerce systems and other Web applications? This chapter answers
    all those questions by explaining how PHP supports both cookies and sessions,
    and exploring the link between the two. At the end of this chapter, we''ll develop
    a simple shopping cart system to demonstrate their use.'
  merge: -1
  img_proc: true
- pgno: 18
