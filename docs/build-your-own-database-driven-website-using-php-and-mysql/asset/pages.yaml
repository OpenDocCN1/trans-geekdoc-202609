    +   If your table form file (tblName.frm) is missing or damaged beyond repair,
    but you know the table well enough to reproduce the CREATE TABLE statement that
    defines it, you can generate a new .frm file and use it with your existing data
    file and index file (if the index file is no good, use the above method to generate
    a new one afterwards). First, make a copy of your data and index files, and then
    delete the originals (and remove any record of the table from the data directory).


    Start up the MySQL server and create a new table using the exact same CREATE TABLE
    statement. Log out and shut down the server, then copy your two saved files over
    top of the new (empty files). The new .frm file should work with them, but perform
    a standard table repair (the second method above) for good measure.


    # Summary


    Admittedly this chapter hasn''t been the usual non-stop, action-packed code-fest
    that you may have become accustomed to by now. But our concentration on these
    topics – the back up and restoration of MySQL data, the administration of the
    MySQL access control system, and table checking and repair -- has armed us with
    the tools we''ll need in order to set up a MySQL database server that will stand
    the test of time (not to mention the constant traffic that your site will endure
    during that period).


    In Chapter 9, we''ll get back to the fun stuff and learn some advanced SQL techniques
    that make a relational database server do things that you may never have thought
    possible.'
