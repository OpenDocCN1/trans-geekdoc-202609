- pgno: 195
  md: '# # DROP INDEX


    ```

    DROP INDEX index_name ON tbl_name

    ```


    DROP INDEX has the exact same effect as ALTER TABLE DROP INDEX, described on page
    175.


    # # DROP TABLE


    ```

    DROP TABLE [IF EXISTS] tbl_name [, tbl_name, ...]

    ```


    This query completely deletes one or more tables. This is a dangerous query, since
    the data cannot be retrieved once this action is executed, so be very careful
    with it!


    This query will fail with an error if the table doesn''t exist (unless IF EXISTS
    is specified) or if you don''t have the required privileges.


    # # EXPLAIN


    The explain query has two very different forms. The first,


    ```

    EXPLAIN tbl_name

    ```


    is equivalent to DESCRIBE tbl_name or SHOW COLUMNS FROM tbl_name. See page XXX
    for details.


    The second format,


    ```

    EXPLAIN select_statement

    ```


    where select_statement can be any valid SELECT query, will produce an explanation
    of how: MySQL would determine the results of the SELECT statement. This query
    is useful for finding out where indexes will help speed up your SELECT queries,
    and also to determine if MySQL is performing multi-table queries in optimal order.
    See the STRAIGHT_JOIN option of the SELECT query on page 187 for information on
    how to override the MySQL optimizer, and control this order manually.


    See the MySQL Reference manual for complete information on how to interpret the
    results of an EXPLAIN query.'
  merge: -1
