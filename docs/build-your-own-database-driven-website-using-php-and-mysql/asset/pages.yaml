  md: '# Summary


    While it would be interesting to delve into the details of the content-submission
    system described above, you should already have all the skills necessary to build
    it yourself. Want to let users rate the jokes on the site? How about letting joke
    authors make changes to their jokes, but requiring an administrator to approve
    the changes before they go live on the site? The power and complexity of the system
    is limited only by your imagination.


    At this point, you should be equipped with all the basic skills and concepts you
    need to build your very own database-driven Web site. In the rest of this book,
    I''ll cover more advanced topics that will help optimize your site''s performance.
    Oh, and of course we''ll explore more exciting features of PHP and MySQL.


    In Chapter 8, we''ll take a step away from our Joke database and have a closer
    look at MySQL server maintenance and administration. We''ll learn how to make
    backups of our database (a critical task for any Web-based company!), administer
    MySQL users and their passwords, and of course we''ll learn how to log into a
    MySQL server if you''ve forgotten your password.'
