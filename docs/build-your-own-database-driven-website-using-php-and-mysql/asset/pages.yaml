  md: '$uploadedfile (from the NAME attribute of the <input> tag) will be automatically
    created. However, instead of storing the contents of the uploaded file, $uploadedfile
    contains the name of the file stored on the Web server''s hard disk, in the directory
    set by the TEMP environment variable (e.g. C:\Windows\TEMP\ on most Windows 9x
    systems), (unless it has been specified explicitly, using the upload_tmp_dir setting
    in your php.ini file). This file is only kept for as long as the PHP script responsible
    for handling the form submission is in operation, so if you want to use it for
    anything later on (e.g. storing it for display on the site) you need to make a
    copy of it somewhere else - to do this, use the copy function described in the
    previous section.


    In addition to $uploadedfile, three other variables are automatically created
    as well. $uploadedfile_name contains the name of the file before it was submitted
    (submitted files are stored as phpx, where x is a number, in the TEMP directory),
    $uploadedfile_size contains the size (in bytes) of the file, and $uploadedfile_type
    contains the MIME type (e.g. text/plain, image/gif, etc.) of the file. Remember,
    "uploadedfile" is just the name attribute of the <input> tag that submitted the
    file, so the actual names of these variables will depend on that attribute.


    You can use these variables to decide whether to accept or reject an uploaded
    file. For example, in our photo gallery we would only really be interested in
    JPEG and possibly GIF files. These files have MIME types of image/pjpeg and image/gif
    respectively, so the code that validates uploaded files might look something like
    this:


    ```

    if ($uploadedfile_type == "image/pjpeg" || $uploadedfile_type == "image/gif")
    {

    // Handle the file...

    } else {

    echo("<p>Please submit a JPEG or GIF image ".

    "file.</p>\n");

    }

    ```


    While you can use a similar technique to disallow files that are too large (by
    checking the $uploadedfile_size variable), this is not usually a good idea. Before
    this value can be checked, the file is already uploaded and saved in the TEMP
    directory. If you try to reject files due to limited disk space and/or bandwidth,
    the fact that large files can still be uploaded (even though they get deleted
    almost immediately) may be a problem for you.


    Instead, you can tell PHP in advance the maximum file size you wish to accept.
    There are two ways to do this. The first is to adjust the upload_max_filesize
