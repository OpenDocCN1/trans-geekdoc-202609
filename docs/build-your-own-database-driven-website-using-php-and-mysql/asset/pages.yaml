  md: "# Special privileges\n\nALL: Allowed to do anything (like root).\n\nUSAGE:\
    \ Only allowed to log in -- nothing else.\n\nSome of these privileges apply to\
    \ features of MySQL that we have not yet seen, but many should be familiar to\
    \ you.\n\nwhat defines the areas of the database sever to which the privileges\
    \ apply.\n\n*.* means the privileges apply to all databases and tables. dbName.*\
    \ means the privileges apply to all tables in the database called dbName.\n\n\
    dbName.tblName means the privileges apply only to the table called tblName in\
    \ the database called dbName. You can even specify privileges for individual table\
    \ columns - simply list the columns between the parentheses that follow the privileges\
    \ to be granted (we'll see an example of this in a moment).\n\nuser specifies\
    \ the user to which these privileges should apply. In MySQL, a user is specified\
    \ both by the username given at login, and the hostname/IP of the machine from\
    \ which the user connects. Both values may contain the % wildcard character (e.g.\
    \ kevin@% will allow the username kevin to log in from any host and use the privileges\
    \ you specify).\n\npassword specifies the password required by the user to connect\
    \ to the MySQL server. As indicated by the square brackets above, the IDENTIFIED\
    \ BY \"password\" portion of the GRANT command is optional. Any password specified\
    \ will replace the existing password for that user. If no password is specified\
    \ for a new user, a password will not be required to connect.\n\nThe optional\
    \ WITH GRANT OPTION portion of the command specifies that the user be allowed\
    \ to use the GRANT/REVOKE commands to give any privileges granted to him or her\
    \ to another user. Be careful with this -- the repercussions are not always obvious!\
    \ For example, two users who have this option enabled can get together and share\
    \ their privileges with each other.\n\nLet's consider a few examples. To create\
    \ a user named dbmanager that can connect from server.host.net with password managedb\
    \ and have full access to the database named db only (including the ability to\
    \ grant access to that database to other users), use this GRANT command:\n\n```\n\
    mysql> GRANT ALL ON db.*\n    -> TO dbmanager@server.host.net\n    -> IDENTIFIED\
    \ BY \"managedb\"\n    -> WITH GRANT OPTION;\n```\n\nTo subsequently change that\
    \ user's password to funkychicken, use:\n\n```\nmysql> GRANT USAGE ON *.*\n  \
    \  -> TO dbmanager@server.host.net\n    -> IDENTIFIED BY \"funkychicken\";\n```"
