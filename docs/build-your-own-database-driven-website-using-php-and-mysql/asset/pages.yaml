- pgno: 90
  md: '# 6 A Content Management System


    So far, we''ve seen several examples of database-driven Web pages: pages that
    display information that''s culled from a MySQL database when the page is requested.
    Until now, however, we haven''t seen a solution that would be much more manageable
    than raw HTML files if it was scaled up to encompass a Web site as large and complex
    as, say, SitePoint.com. Sure, our Internet Joke Database was nice, but when it
    came to managing categories and authors, we''d always have to return to the MySQL
    command line and try to remember complicated SELECT and INSERT statements, as
    well as table and column names, to accomplish the most menial of tasks.


    To make the leap from a Web page that displays information stored in a database
    to a completely database-driven Web site, we need to add a content management
    system. Such a system usually takes the form of a series of Web pages, access
    to which is restricted to users who are authorized to make changes to the Web
    site. These pages provide a database administration interface, which allows a
    user to easily view and change the information that''s stored in the database
    without messing with the mundane details of SQL syntax.


    The beginnings of a content management system were seen at the end of Chapter
    4, where we allowed site visitors to add jokes to, and (if you worked through
    the challenge) delete jokes from, the database using a Web-based form and a "delete
    this joke" link, respectively. While impressive, these are not features that you''d
    normally include in the interface presented to casual site visitors. For example,
    you don''t want someone to be able to add offensive material to your Web site
    without your knowledge. And you definitely don''t want just anyone to be able
    to delete jokes from your site.


    By relegating those "dangerous" features to the restricted-access site administration
    pages, you avoid the risk of exposing your data to the average user, and you maintain
    the power to manage the contents of your database without having to memorize SQL
    queries. In this chapter, we''ll expand on the capabilities of our joke management
    system to take advantage of the enhancements we made to our database in Chapter
    5. Specifically, we''ll allow a site administrator to manage authors and categories,
    and assign these to appropriate jokes.'
  merge: -1
  img_proc: true
