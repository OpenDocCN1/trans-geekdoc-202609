    # PHP Sessions


    Because of the limitations I''ve just described, cookies are not appropriate for

    storing large amounts of information. Also, because of the negative

    impression that many have of cookies, it''s not uncommon for users to disable

    cookies in their browsers. So if you run an ecommerce Website that uses

    cookies to store the items in a user''s shopping cart as they make their way

    through your site, this can be a big problem.


    Sessions were developed in PHP as the solution to all these issues. Instead of

    storing all your (possibly large) data as cookies in the Web browser, sessions

    let you store the data on your Web server. The only thing that''s stored on the

    browser is a single cookie that contains the user''s session ID - a variable that

    PHP watches for on subsequent page requests, and uses to load the stored

    data that''s associated with that session.


    Unless configured otherwise, a PHP session works by automatically setting in

    the user''s browser a cookie that contains the session ID - a long string of

    letters and numbers that serves to uniquely identify that user for the duration

    of his or her visit to your site. The browser then sends that cookie along with

    every request for a page from your site, so that PHP can use it to identify

    which of potentially numerous sessions-in-progress the request belongs to.

    Using a set of temporary files that are stored on the Web server, PHP keeps

    track of the variables that have been registered in each session, and their

    values.


    One of the big selling points of PHP sessions is that they also work when

    cookies are disabled! If PHP detects that cookies are disabled in the user''s

    browser, it will automatically add the session ID as a query string variable on

    all the relative links on your page, thus passing the session ID onto the next

    page. Be aware that all of the pages on your site need to be PHP files for this

    to work, because PHP won''t be able to add the session ID to links on non-

    PHP pages. Also, for this feature to work, session.use_trans_sid must

    be enabled in your php.ini file (see below), and PHP must be compiled

    with the --enable-trans-sid option if you''re doing it yourself under

    Linux (or other Unix variants).


    Before you can go ahead and use the spiffy session-management features in

    PHP, you need to ensure that the relevant section of your php.ini file has

    been set up properly. If you''re using a server that belongs to your Web host,

    it''s probably safe to assume this has been done for you. Otherwise, open your

    php.ini file in a text editor and look for the section marked [session].

    Beneath it, you''ll find twenty-some options that begin with the word'
