  md: '```

    mail("to1@mail.net, to2@mail.net, ...", "Message Subject", "Message body");

    ```


    It''s also very easy to supply additional headers, in order to specify From or
    Reply-To addresses for example. Just add them as a fourth parameter, separated
    by carriage return-newline pairs:


    ```

    mail("to@mail.net", "Message Subject", "Message body", "From: webmaster@host.com\r\nReply-to:admin@host.com");

    ```


    Combined with a database, a mailing list becomes very easy to manage!

    Simply pull the list of addresses out of the database and use the mail

    function to fire off the messages. Personalization of the messages is also very

    easy. Consider this example:


    ```

    // Retrieve $email and $password from the database based

    // on the $username provided in a form.


    mail($email, "Your Password",

    "Hi there!


    You just filled out a form on our Web site

    indicating that you had lost your password.

    As requested, we are sending it to you by

    email.


    username: $username

    password: $password


    Please record this information in a safe

    place so you have it on hand for your next

    visit to pingpongballs.com!


    -The webmaster.


    ");

    ```


    If you''re running under UNIX and (for whatever reason) you don''t have a local
    sendmail system available to send email, all is not lost. PHP comes equipped with
    full TCP/IP networking capabilities, which allow it to connect to an SMTP server
    to send messages if it needs to. Likewise, if you need to attach files to outgoing
    messages, PHP is capable of this as well.


    Unfortunately, the built-in mail function does not support either of these features,
    and if you need them you''ll have to write your own email function from scratch.
    The authors of WROX Press'' Professional PHP Programming have done this for you,
    and full code is provided in Chapter 17 of that book. Although it''s an excellent
    book that I highly recommend (see my review on SitePoit.com), the source code
    is also available for free download from WROX''s Web site, so there is no need
    to buy the book just to get this functionality.'
