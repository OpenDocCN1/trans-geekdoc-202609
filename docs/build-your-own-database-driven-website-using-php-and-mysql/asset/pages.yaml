  md: "# A Simple Shopping Cart\n\nThis example will consist of two PHP scripts:\n\
    \n+   - A product catalog, where you can add items to your shopping cart.\n+ \
    \  - A checkout page, which displays the contents of the user's shopping cart\
    \ for confirmation.\n\nFrom the checkout page, the order could then be submitted\
    \ to a processing system that would handle the details of accepting payment and\
    \ shipping arrangements. That system is beyond the scope of this book, and will\
    \ not be discussed here.\n\nLet's start with the list of items we'll have for\
    \ sale in our online store:\n\n```\n<table border=\"1\">\n<tr>\n<th>Item Description</th>\n\
    <th>Price</th>\n</tr>\n<tr>\n<td>Canadian-Australian Dictionary</td>\n<td>$24.95</td>\n\
    </tr>\n<tr>\n<td>Used Parachute (never opened)</td>\n<td>$1,000.00</td>\n</tr>\n\
    <tr>\n<td>Songs of the Goldfish (2CD Set)</td>\n<td>$19.99</td>\n</tr>\n<tr>\n\
    <td>Ending PHP4 (O'wroxy Press)</td>\n<td>$34.95</td>\n</tr>\n</table>\n<p>All\
    \ prices are in imaginary dollars.</p>\n```\n\nNow, instead of hard-coding the\
    \ items, we'll place them in a PHP array and generate the page dynamically. Arrays\
    \ are created with the built-in PHP function array, by listing the elements to\
    \ be included in the array as the parameters of the function. Items and their\
    \ prices would normally be stored in a database, but I'm using this method so\
    \ we can focus on sessions. You should already know all you need in order to put\
    \ together a database-driven product catalog, so I'll leave that to you as an\
    \ exercise.\n\nHere's the code for our dynamically generated product catalog:\n\
    \n```\n<?php\n$items = array( \"Canadian-Australian Dictionary\",\n       \"Used\
    \ Parachute (never opened)\",\n       \"Songs of the Goldfish (2CD Set)\",\n```"
