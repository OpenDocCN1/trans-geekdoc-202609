- pgno: 234
  md: '# D PHP Functions for Working with MySQL


    PHP provides a vast library of built-in functions that let you perform all sorts
    of tasks without having to look to third party software vendors for a solution.
    The online reference to these functions provided by the PHP Official Website (http://www.php.net)
    is second to none. Obtaining detailed information about a function is as simple
    as opening your browser and typing: http://www.php.net/function_name


    Due to the convenience of this facility, we have judged that a complete PHP function
    reference is beyond the scope of this book. All the same, this appendix contains
    a reference to those PHP functions specifically designed to interact with MySQL
    databases, so that if you use this book as your primary reference while building
    a database-driven Website, you won''t have to look elsewhere for the information
    you need.


    This list of functions and their definitions are current as of PHP 4.0.5.


    # mysql_affected_rows


    ```

    mysql_affected_rows([link_id])

    ```


    Returns the number of affected rows in the previous MySQL INSERT, UPDATE, DELETE,
    or REPLACE operation performed with the specified link_id. If the link is not
    specified, then the last-opened link is assumed. Returns -1 if the previous operation
    failed.


    # mysql_close


    ```

    mysql_close ([link_id])

    ```


    Close current or specified (link_id) MySQL connection. If the link is a persistent
    link opened by mysql_pconnect() (see page 229), this function call is ignored.
    Since non-persistent connections are closed automatically by PHP at the end of
    a script, this function is usually not needed.'
