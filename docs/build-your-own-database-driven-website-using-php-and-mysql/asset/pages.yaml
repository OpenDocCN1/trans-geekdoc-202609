    # Installing PHP


    The next step is to install PHP. At the time of this writing, PHP 4.x has become
    well-established as the version of choice; however, some old servers still use
    PHP 3.x (usually because nobody has bothered to update it). I''ll cover the installation
    of PHP4 here, so be aware that if you''re still working with PHP3 there may be
    some minor differences.


    Download PHP for free from http://www.php.net/ (or one of its mirrors listed at
    http://www.php.net/mirrors.php). You''ll want the Win32 Binaries package, and
    be sure to grab the version that includes both the CGI binary and the server API
    versions if you have a choice.


    In addition to PHP itself, you will need a Web server such as Internet Information
    Services (IIS), Apache, Sambar or OmniHTTPD. PHP was designed to run as a plug-in
    for existing Web server software. To test dynamic Web pages with PHP, you''ll
    need to equip your own computer with Web server software, so that PHP has something
    to plug into. If you have Windows 2000/XP, then install IIS (if it''s not already
    on your system): open Control Panel, Add/Remove Programs, Add/Remove Windows Components,
    and select IIS from the list of components. If you''re not lucky enough to have
    IIS at your disposal, you can instead use a free Web server like Apache. I''ll
    give instructions for both options in detail.


    First, whether you have IIS or not, complete these steps:'
