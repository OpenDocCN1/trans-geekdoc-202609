    \ syntax may be found at http://www.delorie.com/gnu/docs/rx/rx_toc.html. Let's\
    \ work our way through a few examples to learn the basic regular expression syntax.\n\
    \nFirst of all, a caret (^) may be used to indicate the start of the string, while\
    \ a dollar sign ($) is used to indicate its end:\n\n```\nPHP // Matches \"PHP\
    \ rules!\" and \"what is PHP?\"\n^PHP // Matches \"PHP rules!\" but not \"What\
    \ is PHP?\"\nPHP$ // Matches \"I love PHP\" but not \"What is PHP?\"\n^PHP$ //\
    \ Matches \"PHP\" but nothing else\n```\n\nObviously, you may sometimes want to\
    \ use ^, $, or other special characters to represent the corresponding character\
    \ in the search string, rather than the special meaning implied by regular expression\
    \ syntax. To remove the special meaning of a character, prefix it with a backslash:\n\
    \n```\n\\$\\$\\$$ // Matches \"Show me the $$$!\" but not \"$10\"\n```\n\nSquare\
    \ brackets can be used to define a set of characters that may match. For example,\
    \ the following regular expression will match any string that contains a digit\
    \ from 1 to 5 inclusive.\n\n```\n[12345] // Matches \"1\" and \"39\", but not\
    \ \"a\" or \"76\"\n```\n\nRanges of numbers and letters may also be specified.\n\
    \n```\n[1-5] // Same as previous\n^[a-z]$ // Matches any single lowercase letter\n\
    [0-9a-zA-Z] // Matches any string with a letter or number\n```\n\nThe characters\
    \ ?, +, and * also have special meanings. Specifically, ? means \"the preceding\
    \ character is optional\", + means \"one or more of the previous character\",\
    \ and * means \"zero or more of the previous character\".\n\n```\nbana?na // Matches\
    \ \"banana\" and \"banna\",\n     // but not \"banaana\".\nbana+na // Matches\
    \ \"banana\" and \"banaana\",\n     // but not \"banna\".\nbana*na // Matches\
    \ \"banna\", \"banana\", and \"banaaana\",\n     // but not \"bhna\".\n^[a-zA-Z]+$\
    \ // Matches any string of one or more\n     // letters and nothing else.\n```\n\
    \nParentheses may be used to group strings together to apply ?, +, or * to them\
    \ as a whole.\n\n```\nba(na)+na // Matches \"banana\" and \"banananana\",\n  \
    \   // but not \"bana\" or \"banaana\".\n```\n\nHere are a few codes that match\
