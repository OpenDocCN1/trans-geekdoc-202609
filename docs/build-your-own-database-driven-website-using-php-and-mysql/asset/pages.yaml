    Notice the last two lines especially. You can include the name of a variable right
    inside a text string, and have the value inserted in its place if you surround
    the string with double quotes. This process of converting variable names to their
    values is known in technical circles as variable interpolation. However, as the
    last line demonstrates, a string surrounded with single quotes will not interpolate
