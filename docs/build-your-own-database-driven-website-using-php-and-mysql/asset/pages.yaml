  md: "Mickiewicz' mini-tutorial on the subject (http://www.webmasterbase.com/article.php/27).\n\
    \nIn essence, SSI's allow you to insert the content of one file stored on your\
    \ Web server into the middle of another. The most common use for this technology\
    \ is to encapsulate common design elements of a Website in small HTML files that\
    \ can then be incorporated into Web pages on the fly. Any changes to these small\
    \ files immediately affect all files that include them. And, just like a PHP script,\
    \ the Web browser doesn't need to know about any of it, since the Web server does\
    \ all the work before it sends the requested page to the browser.\n\nPHP has a\
    \ function that provides similar capabilities. But in addition to being able to\
    \ incorporate regular HTML and other static elements into your included files,\
    \ you can also include common script elements. Let's look at an example:\n\n```\n\
    <!-- include-me.php -->\n<?php\n    echo ( \"<p>Soylent Green is made from people!</p>\\\
    n\" );\n?>\n```\n\nThe above file, include-me.php, contains some simple PHP code.\
    \ You'll also need the following file:\n\n```\n<!-- testinclude.php -->\n<html>\n\
    <head>\n<title> Test of PHP Includes </title>\n</head>\n<body>\n<?php\n    include(\"\
    include-me.php\");\n?>\n</body>\n</html>\n```\n\nNotice the call to the include\
    \ function. We specify the name of the file we want to include (include-me.php),\
    \ and PHP will attempt to grab the named file and stick it into the file to replace\
    \ the call to include. Upload both of the above files to your Web server (or copy\
    \ them to your Web server's document folder if you're running the server on your\
    \ computer) and load testinclude.php in your browser. You'll see a Web page that\
    \ contains the message from our include file, as expected.\n\nIf this example\
    \ doesn't work, you may need to configure the include_path option in your php.ini\
    \ file. Open the file in your favorite text editor and look for a line that begins\
    \ with include_path, about halfway through the file. This setting works in the\
    \ same way as the system PATH environment variable that you may be familiar with.\
    \ It contains a list of directories where"
