    ```


    As you can see, if PHP stops working on your server, all that will be exposed
    is a call to the include function. The username and password are safely stored
    in dbConnect.inc, which cannot be accessed directly from the Web.


    As usual, it remains important to consider other means that may be available to
    access those files. For example, if you share your Web server with other people/companies,
    be certain that the files are not accessible to those other users!


    # Semi-Dynamic Pages


    As the owner of a successful (or soon-to-be so) Web site, you most likely see
    site traffic as something you''d like to encourage. Unfortunately, high site traffic
    is just the kind of thing that a Web server administrator dreads -- especially
    when that site is primarily composed of dynamically generated, database-driven
    pages. Such pages take a great deal more horsepower from the computer that runs
    the Web server software than plain, old HTML files do, because every page request
    is like a miniature program that runs on that computer.


    While some pages of a database-driven site must always display up-to-the-second
    data culled from the database, others don''t necessarily. Consider the front page
    of a Web site like SitePoint.com. Typically, it presents a sort of "digest" of
    what''s new and fresh on the site. But how often does that information actually
    change? Once a day? Once a week? And how important is it that visitors to your
    site see those changes the instant they occur? Would your site really suffer if
    changes took effect after a bit of a delay?


    By converting high-traffic dynamic pages into semi-dynamic equivalents, which
    are static pages that get dynamically re-generated at regular intervals to freshen
    their content, you can go a long way towards reducing the toll that'
  merge: -1
  img_proc: true
- pgno: 154
  md: "the database-driven components of your site take on your Web server's performance.\n\
    \nSay you have index.php, your front page, which provides a summary of new content\
    \ on your site. Through examination of server logs, you'll probably find that\
    \ this is one of the most requested pages on your site. If you ask yourself some\
    \ of the questions above, you realize that this page really doesn't have to be\
    \ dynamically generated for every request. As long as it's updated every time\
    \ new content is added to your site, it'll be as dynamic as it needs to be. With\
    \ a PHP script, you can generate a static snapshot of the dynamic page's output\
    \ and put this snapshot online, in place of the dynamic version, as index.html.\n\
    \nThis little trick will require a some reading, writing, and juggling of files.\
    \ PHP is perfectly capable of this, but we have not yet seen the functions we'll\
    \ need:\n\n+   - **fopen**\n+     Opens a file for reading and/or writing. This\
    \ file can be stored on the server's hard disk, or PHP can load it from a URL\
    \ just like a Web browser would.\n+   \n+   - **fclose**\n+     Tells PHP you're\
    \ finished reading/writing a particular file and releases it for other programs\
    \ or scripts to use.\n+   \n+   - **fread**\n+     Reads data from a file into\
    \ a PHP variable. Allows you to specify how much information (i.e. how many characters\
    \ or bytes) to read.\n+   \n+   - **fwrite**\n+     Writes data from a PHP variable\
    \ into a file.\n+   \n+   - **copy**\n+     Performs a run-of-the-mill file copy\
    \ operation.\n+   \n+   - **unlink**\n+     Deletes a file from the hard disk.\n\
    \nDo you see where we're headed? If not, don't worry -- you will in a moment.\n\
    \nCreate a file called generateindex.php. It will be the responsibility of this\
    \ file to load index.php (the dynamic version of your front page) as a Web browser\
    \ would, then write the static version of the file as an updated version of index.html.\
    \ If anything goes wrong in this process, you want to avoid the potential destruction\
    \ of the good copy of index.html, so we'll make this script write the new static\
    \ version into a temporary file (tempindex.html) and then copy it over index.html\
    \ if all is well."
