- pgno: 20
  md: '# # 1 Installation


    # ## Welcome to the Show


    Hi there and welcome to the first book in SitePoint.com’s *Practical Guide* series!
    Over the course of this book, it will be my job to guide you as you take your
    first steps beyond the HTML-and-JavaScript world of client-side site design. Together
    we’ll explore what it takes to build the kind of large, content-driven sites that
    are so successful today, but which can be a real headache to maintain if they
    aren’t done right.


    Before we get started, you need to gather together the tools you’ll need for the
    job. In this first chapter, I’ll guide you as you download and set up the two
    software packages you’ll need: PHP and MySQL.


    **PHP** is a server-side scripting language. You can think of it as a "plug-in"
    for your Web server that will allow it to do more than just send plain Web pages
    when browsers request them. With PHP installed, your Web server will be able to
    read a new kind of file (called a **PHP script**) that can do things like retrieve
    up-to-the-minute information from a database and insert it into a Web page before
    sending it to the browser that requested it. PHP is completely free to download
    and use.


    To retrieve information from a database, you first need to *have* a database.
    That’s where MySQL comes in. MySQL is a relational database management system,
    or RDBMS. Exactly what role it plays and how it works we’ll get into later, but
    basically it’s a software package that is very good at the organization and management
    of large amounts of information. MySQL also makes that information really easy
    to access with server-side scripting languages like PHP. MySQL is released under
    the GNU General Public License (GPL), and is thus free for most uses on all of
    the platforms it supports. This includes most Unix-based platforms, like Linux
    and even Mac OS X, as well as Windows 9x/ME/NT/2000.


    If you’re lucky, your current Web host may already have installed MySQL and PHP
    on your Web server for you. If that’s the case, much of this chapter will not
    apply to you, and you can skip straight to the section entitled "If Your Web Host
    Provides PHP and MySQL" to make sure your setup is ship shape.'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'Everything we''ll discuss in this book may be done on a Windows- or Unix-based
    server. The installation procedure will differ in accordance with the type of
    server you have at your disposal. The following two sections deal with installation
    on a Windows-based Web server, and installation under Linux (and other Unix-based
    platforms), respectively. Unless you''re especially curious, you should only need
    to read the section that applies to you.


    # Windows Installation


    # Installing MySQL


    As I mentioned above, MySQL may be downloaded free of charge. Simply proceed to
    http://www.mysql.com/downloads/ and choose the recommended stable release (as
    of this writing, it is MySQL 3.23). Under the heading of Standard binary (tarball)
    distributions (which basically means the program doesn''t need to be compiled,
    and is ready to run once you download it), find and click Windows 95/98/NT/2000
    (Intel). If you''re on a high-speed connection, you''ll probably want to check
    out one of the download mirrors listed at http://www.mysql.com/downloads/mirrors.html
    to get a reasonable download speed. After downloading the file (it''s about 12MB
    as of this writing), unzip it and run the setup.exe program contained therein.


    Once installed, MySQL is ready to roll (barring a couple of configuration tasks
    that we''ll look at shortly), except for one minor issue that only affects you
    if you''re running Windows NT/2000/XP. If you use any of those operating systems,
    find a file called my-example.cnf in the directory to which you just installed
    MySQL. Copy it to the root of your C: drive and rename it to my.cnf. If you don''t
    like the idea of a MySQL configuration file sitting in the root of your C: drive,
    you can instead name it my.ini and put it in your Windows directory (e.g. D:\WINNT
    if Windows 2000 is installed on drive D:). Whichever you choose, open the file
    in WordPad (Notepad is likely to display it incorrectly) and look for the following
    line:


    ```

    # basedir = d:/mysql/

    ```


    Uncomment this line by removing the ''#'' symbol at the start, and change the
    path to point to your MySQL installation directory, using slashes (/) instead
    of backslashes (\) . For instance, I changed the line on my system to read as
    follows:


    ```

    basedir = d:/Program Files/mysql/

    ```


    With that change made, save the file and close WordPad. MySQL will now run on
    your Windows NT/2000/XP system! If you''re using Windows 95/98/ME, this step is
    not necessary – MySQL will run just fine as-installed.'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'Just like your Web server, MySQL is a program that should be run in the background
    so that it may respond to requests for information at any time.

    The server program may be found in the "bin" subfolder of the folder into

    which you installed MySQL. To make things complicated, however, there are

    actually several versions of the MySQL server to choose from:


    +   **mysqld.exe** This is the basic version of MySQL if you run Windows

    +   95, 98, or ME. It includes support for all advanced features, and

    +   includes debug code to provide additional information in the case of

    +   a crash (if your system is set up to debug programs). As a result of

    +   this code, however, the server might run a little slow, and I''ve

    +   generally found that MySQL is so stable that crashes aren''t really a

    +   concern.


    +   **mysqld-opt.exe** This version of the server lacks a few of the

    +   advanced features of the basic server, and does not include the debug

    +   code. It''s optimized to run quickly on today''s processors. For

    +   beginners, the advanced features are not a big concern. You certainly

    +   won''t be using them while you complete the tasks in this book. This is

    +   the version of choice for beginners running Windows 95, 98, or ME.


    +   **mysqld-nt.exe** This version of the server is compiled and

    +   optimized like `mysqld-opt`, but is designed to run under Windows

    +   NT/2000/XP as a service. If you''re using any of those operating

    +   systems, this is probably the server for you.


    +   **mysqld-max.exe** This version is like `mysqld-opt`, but contains

    +   advanced features that support transactions.


    +   **mysqld-max-nt.exe** This version''s similar to `mysqld-nt`, but has

    +   advanced features that support transactions.


    All these versions were installed for you in the `bin` directory. If you''re

    running on Win98x/ME I recommend sticking with `mysql-opt` for now -

    move to `mysqld-max` if you ever need the advanced features. On Windows

    NT/2000/XP, `mysqld-nt` is my recommendation. Upgrade to `mysqld-

    max-nt` when you need more advanced features.


    Starting MySQL is also a little different under WinNT/2000/XP, but this time

    let''s start with the procedure for Win95/98/ME. Open an MS-DOS Command

    Prompt and proceed to the MySQL `bin` directory, and run your chosen server

    program:


    ```

    C:\mysql\bin> mysqld-opt

    ```


    Don''t be surprised when you receive another command prompt. This

    command launches the server program so that it runs in the background,

    even after you close the command prompt. If you press Ctrl-Alt-Del to pull'
