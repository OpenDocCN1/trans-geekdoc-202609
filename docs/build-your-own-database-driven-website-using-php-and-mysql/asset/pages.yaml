  md: '# 12 Cookies and Sessions in PHP


    Cookies and sessions are two of those mysterious technologies that are almost
    always made out to be scarier and more complex than they really are. In this chapter,
    I''ll debunk those myths by explaining in simple language what they are, how they
    work, and what they can do for you. I''ll also provide practical examples to demonstrate
    each, with hints as to how these can be expanded to add exciting new features
    to your own Website!


    # Cookies


    Most computer programs these days preserve some form of state when you close them.
    Whether it be the position of the application window, or the names of the last
    five files you worked with, the settings are usually stored in a small file somewhere
    on your system, so they can be read back the next time the program is run. When
    Web developers took Web design to the next level, and moved from static pages
    to complete, interactive, online applications, there was a need for similar functionality
    in Web browsers - so cookies were born.


    A cookie is a name/value pair associated with a given Website, and stored on the
    computer that runs the client (browser). Once it''s set by a Website, all future
    page requests to that same site will also include the cookie, until it expires.
    Other Websites cannot access the cookies set by your site, and vice versa, so,
    contrary to popular belief, they''re a relatively safe place to store personal
    information. Cookies in and of themselves cannot violate a user''s privacy.


    Illustrated below is the lifecycle of a PHP-generated cookie. ① First, a Web browser
    requests a URL that corresponds to a PHP script. Within that script is a call
    to the setcookie() function built into PHP. ② The page produced by the PHP script
    is sent back to the browser, along with an HTTP set-cookie header that contains
    the name (e.g. mycookie) and value pair of the cookie to be set. ③ When it receives
    this HTTP header, the browser creates and stores the specified value as a cookie
    named mycookie. ④ Subsequent page requests to that Website contain an HTTP cookie
    header that sends the name/value pair (mycookie=value) to the script requested.
    ⑤ Upon receipt of a page request with a cookie header, PHP automatically creates
    a variable with the name of the cookie ($mycookie) and its value.'
  merge: -1
  img_proc: true
- pgno: 175
  md: '![](img/8345fab290b1af6acfffd37582f5eaf4_175_0.png)


    In other words, the PHP setCookie() function lets you set a variable that will
    be automatically set by subsequent page requests from the same browser! Before
    we examine an actual example, let''s take a close look at the setCookie() function.


    ```

    setcookie(name [, value [, expirytime [, path [, domain [, secure]]]]])

    ```


    Like the header function we saw in Chapter 11, the setcookie function adds HTTP
    headers to the page, and thus must be called before any of the actual page content
    is sent. Any attempt to call setcookie after some HTML (for example) has already
    been sent to the browser, will produce a PHP error message.


    The only required parameter for this function is name, which specifies the name
    of the cookie. Calling setCookie with only the name parameter will actually delete
    the cookie that''s stored on the browser, if it exists. The value parameter allows
    you to create a new cookie, or modify the value stored in an existing one.


    By default, cookies will remain stored on the browser (and thus will continue
    to be sent with page requests) until the browser is closed by the user. If you
    want the cookie to persist beyond the current browser session, you must set the
    expirytime parameter to show the number of seconds from January 1st, 1970 to the
    time at which you want the cookie to be automatically deleted. The current time
    in this format can be obtained using the PHP time function. Thus, a cookie could
    be set to expire in one hour, for example, by setting expirytime to time() + 3600.
    To delete a cookie that has a pre-set expiry time, change this expiry time to
    represent a point in the past (e.g. one year ago: time() - 3600 * 24 * 365). Here''s
    an example:


    ```

    setcookie("mycookie","somevalue", // Set a cookie to

    time()+3600*24*365); // expire in 1 year

    setcookie("mycookie","",time()-3600*24*365); // Delete it

    ```'
  merge: -1
  img_proc: true
- pgno: 176
  md: "The **path** parameter lets you restrict access to the cookie to a given path\
    \ on your server. For instance, if you set a path of \"/~kyank/\" for a cookie,\
    \ then only requests for pages in the ~kyank directory (and its subdirectories)\
    \ will include the cookie as part of the request. This is helpful if you're sharing\
    \ a server with other users, and each user has a home directory. It allows you\
    \ to set cookies without exposing your visitors' data to the scripts of other\
    \ users on your server.\n\nThe **domain** parameter serves a similar purpose;\
    \ it restricts the cookie's access to a given domain. By default, a cookie will\
    \ only be sent to the hostname that originally sent it. Large companies, however,\
    \ commonly have several hostnames for their Web presence (e.g. www.company.com\
    \ and support.company.com). To create a cookie that is accessible by pages on\
    \ both servers, you would set the domain parameter to \".company.com\" (note the\
    \ leading \".\" , which prevents another site at somecompany.com from accessing\
    \ your cookies on the basis that their domain ends in \"company.com\").\n\nThe\
    \ **secure** parameter, when set to 1, indicates that the cookie should only be\
    \ sent with page requests that happen over a secure (SSL) connection (i.e. with\
    \ a URL that starts with https:///).\n\nWhile all parameters except name are optional,\
    \ you must specify values for earlier parameters if you want to specify values\
    \ for later ones. For instance, you can't call setcookie with a domain value if\
    \ you don't also specify some value for the expirytime parameter. To omit parameters\
    \ that require a value, you can set string parameters (value, path, domain) to\
    \ \"\" (the empty string) and numerical parameters (expirytime and secure) to\
    \ 0.\n\nLet's now look at an example of cookies in use. Say you wanted to display\
    \ a special welcome message to people on their first visit to your site. You could\
    \ use a cookie to indicate that someone had been to your site before and then\
    \ only display the message when the cookie was not set. Here's the code:\n\n```\n\
    ```php\nif (!isset($visited)) { // First visit\n    echo(\"Welcome to my web site!\
    \ Click here for a tour!\");\n}\nsetCookie(\"visited\", \"1\", time()+3600*24*365);\
    \ // 1 year\n```\n```\n\nAt first glance, this code would seem to do exactly what\
    \ we want it to. Unfortunately, it runs into a common pitfall - the welcome message\
    \ is printed out before setCookie is called. Instead of setting the cookie, PHP\
    \ prints out an error message to inform you that HTTP headers cannot be added\
    \ after page content has already been sent."
  merge: -1
  img_proc: true
