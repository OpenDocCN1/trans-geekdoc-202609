- pgno: 206
  md: 'The SELECT OPTION query allows you to set a number of options both on your
    client and on the server. The word OPTION may be omitted, as it is has no bearing
    on the operation of the query.


    The most common uses of the SET OPTION query are changing your password:


    ```

    SET PASSWORD = PASSWORD(''new_password'')

    ```


    and changing another user''s password (if you have appropriate access privileges):


    ```

    SET PASSWORD FOR user = PASSWORD(''new_password'')

    ```


    For a complete list of the options that may be SET, refer to the MySQL Reference
    Manual.


    # SHOW


    The SHOW query may be used in a number of forms to get information about the MySQL
    server, the databases, and the tables it contains. Many of these forms have an
    optional LIKE wild component, where wild is a string that may contain wildcard
    characters (''%'' for multiple characters, ''_'' for just one) to filter the list
    of results. Each of the forms of the SHOW query are described below:


    ```

    SHOW DATABASES [LIKE wild]

    ```


    Lists the databases that are available on the MySQL server.


    ```

    SHOW [OPEN] TABLES [FROM db_name] [LIKE wild]

    ```


    Lists the tables (or, optionally, the currently OPEN tables) in the default or
    specified database.


    ```

    SHOW [FULL] COLUMNS FROM tbl_name [FROM db_name] [LIKE wild]

    ```


    When FULL is not used, this query provides the same information as a DESCRIBE
    query (see page 181). The FULL option adds a listing of the privileges you have
    on each column to this information. SHOW FIELDS is equivalent to SHOW COLUMNS.


    ```

    SHOW INDEX FROM tbl_name [FROM db_name]

    ```


    Provides detailed information about the indexes that are defined on the specified
    table. See the MySQL Reference manual for a guide to the results produced by this
    query. SHOW KEYS is equivalent to SHOW INDEX.


    ```

    SHOW TABLE STATUS [FROM db_name] [LIKE wild]

    ```


    Displays detailed information about the tables in the default or specified database.'
  merge: -1
  img_proc: true
- pgno: 207
  md: '```

    SHOW STATUS [LIKE wild]

    ```


    Displays detailed statistics for the server. See the MySQL Reference Manual for
    details on the meaning of each of the figures.


    ```

    SHOW VARIABLES [LIKE wild]

    ```


    Lists the MySQL configuration variables and their settings. See the MySQL Reference
    Manual for a complete description of these options.


    ```

    SHOW [FULL] PROCESSLIST

    ```


    Displays all threads running on the MySQL server, and the queries being executed
    by each. If you don’t have the ‘process’ privilege, you will only see threads
    executing your own queries. The FULL option causes the complete queries to be
    displayed, rather than only the first 100 characters of each (the default).


    ```

    SHOW GRANTS FOR user

    ```


    Lists the GRANT queries that would be required to re-create the privileges of
    the specified user.


    ```

    SHOW CREATE TABLE table_name

    ```


    Displays the CREATE TABLE query that would be required to reproduce the specified
    table.


    # UPDATE


    ```

    UPDATE [LOW_PRIORITY] [IGNORE] tbl_name

    SET col_name=expr, ...

    [WHERE where_definition]

    [ORDER BY ...]

    [LIMIT #]

    ```


    The UPDATE query updates existing table entries by assigning new values to the
    specified columns. Columns that are not listed are left alone, with the exception
    of the TIMESTAMP column (see page 219).


    The WHERE clause lets you specify a condition (where_definition) that rows must
    satisfy if they are to be updated, while the LIMIT clause lets you specify a maximum
    number of rows to be updated. IMPORTANT: If WHERE and LIMIT are not specified,
    then every row in the table will be updated!


    The ORDER BY clause lets you specify the order in which entries are updated. This
    is most useful in combination with the LIMIT clause - together they let you create
    queries like “update the 10 most recent rows”.'
  merge: -1
  img_proc: true
- pgno: 208
  md: 'An UPDATE operation will fail with an error if the new value assigned to a
    row clashes with an existing value in a PRIMARY KEY or UNIQUE column unless the
    IGNORE option is specified, in which case the query will simply have no effect
    on that particular row.


    The LOW_PRIORITY option instructs MySQL to wait until there are no other clients
    reading the table before it performs the update.


    # USE


    ```

    USE db_name

    ```


    This simple query sets the default database for MySQL queries in the current session.
    Tables in other databases may still be accessed as db_name.tbl_name.'
