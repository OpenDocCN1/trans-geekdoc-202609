- pgno: 185
  md: '# Summary


    In this chapter, you learned about the two main methods of creating persistent
    variables - those variables that continue to exist from page to page in PHP. The
    first stores the variable in the visitor’s browser in the form of a cookie. By
    default, cookies terminate at the end of the browser session, but by specifying
    an expiry time, they can be preserved indefinitely. Unfortunately, cookies are
    fairly unreliable because you have no way of knowing when the browser might delete
    your cookies, and because some users configure their browsers to disable cookies.
    Obviously cookies are not something that should be relied upon.


    Sessions, on the other hand, free you from all the limitations of cookies. They
    don’t rely on cookies to work, and they let you store an unlimited number of potentially
    large variables. Sessions are an essential building block in modern ecommerce
    applications, as we demonstrated in our simple shopping cart example.'
  merge: -1
  img_proc: true
