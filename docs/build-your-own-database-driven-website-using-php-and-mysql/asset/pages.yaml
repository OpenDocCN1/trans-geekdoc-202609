  md: "# Regular Expressions\n\nTo implement our own markup language, we’ll require\
    \ a script to spot our custom tags in the text of jokes and replace them with\
    \ their HTML equivalents, before it outputs the joke text to the user's browser.\
    \ Anyone with experience in regular expressions will know that they’re ideal for\
    \ this sort of work.\n\nA regular expression is a string of text that contains\
    \ special codes, which allow it to be used with a few PHP functions to search\
    \ and manipulate other strings of text. This, for example, is a regular expression\
    \ that searches for the text \"PHP\" (without the quotes):\n\nPHP\n\nNot much\
    \ to it, is there? To use a regular expression, you must be familiar with the\
    \ regular expression functions available in PHP. ereg is the most basic, and can\
    \ be used to determine whether a regular expression is satisfied by a particular\
    \ text string. Consider the code:\n\n```\n$text = \"PHP rules!\";\n\nif (ereg(\"\
    PHP\", $text)) {\n  echo( '$text contains the string \"PHP\".' );\n} else {\n\
    \  echo( '$text does not contain the string \"PHP\".' );\n}\n```\n\nIn this example,\
    \ the regular expression is satisfied because the string stored in variable $text\
    \ contains \"PHP\". The above code will thus output the following (note that the\
    \ single quotes prevent PHP from filling in the value of the variable $text):\n\
    \n$text contains the string \"PHP\".\n\neregi is a function that behaves almost\
    \ identically to ereg, except that it ignores the case of text when it looks for\
    \ matches:\n\n```\n$text = \"What is Php?\";\n\nif (eregi(\"PHP\", $text)) {\n\
    \  echo( '$text contains the string \"PHP\".' );\n} else {\n  echo( '$text does\
    \ not contain the string \"PHP\".' );\n}\n```\n\nAgain, this outputs the same\
    \ message, despite the fact that the string actually contains \"Php\":\n\n$text\
    \ contains the string \"PHP\".\n\nAs was mentioned above, there are special codes\
    \ that may be used in regular expressions. Some of these can be downright confusing\
    \ and difficult to"
