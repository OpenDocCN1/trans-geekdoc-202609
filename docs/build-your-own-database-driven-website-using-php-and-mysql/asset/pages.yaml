- pgno: 108
  md: 'In fact, only one aspect of our site requires special knowledge (beyond the
    use of a Web browser) to use: content formatting. For example, it would not be
    unusual for someone to want to enter a joke that contained more than one paragraph
    of text. In our current system, this could be accomplished by entering the HTML
    code for the joke directly into the "Create New Joke" form. Why is this unacceptable?


    As we stated way back in the introduction to this book, one of the most desirable
    features of a database-driven Web site is that the people responsible for adding
    content to the site need not be familiar with HTML. If we require knowledge of
    HTML for something as simple as dividing a joke into paragraphs, we have failed
    to achieve our goal.


    As a bonus in this chapter, you also learned a little more about arrays in PHP.
    You learned how a set of form elements can submit their values into a single array
    variable, and you learned how to process that array on the receiving end by looping
    through it, both with a while loop and with a foreach loop.


    In Chapter 7, we’ll see how we can make use of some features of PHP to provide
    a simpler means by which we can format content without requiring site administrators
    to know the ins and outs of HTML. We’ll also bring back the "Submit Your Own Joke"
    link to our site, and discover how we can safely accept content submissions from
    casual site visitors.'
