  md: '# # LOCKING TABLES


    Notice how, in the UPDATE query given above (and repeated here for convenience),
    we use the existing value of TimesViewed and add one to it to set the new value.


    ```

    ```php

    $sql = "UPDATE Jokes SET TimesViewed=TimesViewed+1 WHERE ID=$id";

    ```

    ```


    If you hadn''t known that you were allowed to do this, you might have done a separate
    SELECT to get the current value, add one to it, and then do an UPDATE using that
    newly calculated value. Besides the fact that this requires two queries instead
    of one, and thus will take about twice as long, there is a danger to using this
    method. What if, while that new value was being calculated, someone else viewed
    the same joke? The PHP script would be run a second time for that new request.
    When it performed the SELECT to get the "current" value of TimesViewed, it would
    retrieve the same value as the first script did, because the value had not yet
    been updated. Both scripts would then add one to the same value, and write the
    new value into the table. See what happens? Two users view the joke, but the Timesviewed
    counter only increments by one!


    In some situations, this kind of fetch-calculate-update procedure cannot be avoided,
    and the possibility of interference between simultaneous requests (of the nature
    described above) must be dealt with. Other situations where this may be necessary
    include cases where you need to update several tables in response to a single
    action (e.g. updating inventory and shipping tables in response to a sale on an
    eCommerce Web site).


    By locking the table or tables with which you''re working in a multiple-query
    operation, you can obtain exclusive access for the duration of that operation
    to prevent potentially damaging interference from concurrent operations. The syntax
    for locking a table is fairly simple:


    ```

    LOCK TABLES tblName READ/WRITE

    ```


    As shown, when you lock a table, you must specify whether you want a read lock
    or a write lock. The former prevents other processes from making changes to the
    table, but allows others to read the table. The latter stops all other access
    to the table.


    When you''re done with a table you have locked, you must release the lock to give
    other processes access to the table again:


    ```

    UNLOCK TABLES

    ```


    A LOCK TABLES query implicitly releases whatever locks you may already have; so
    to safely perform a multi-table operation, you must lock all the tables you''ll
    use with a single query. Here''s what the PHP code might look like for the eCommerce
    application we mentioned above:'
  merge: -1
  img_proc: true
- pgno: 140
  md: "```\nmysql_query(\"LOCK TABLES inventory WRITE, shipping\nWRITE\");\n\n// Perform\
    \ the operation...\n\nmysql_query(\"UNLOCK TABLES\");\n```\n\nMany high-end database\
    \ servers (e.g. Oracle, MS SQL Server, etc.) support a feature called **transactions**,\
    \ which lets you define complex operations like those above so they may be performed\
    \ in a single, uninterrupted step.\n\nConsider what would happen if your server\
    \ were struck by a power failure halfway through an update of the tables in response\
    \ to a client order. For example, the server might have crashed after it updated\
    \ your shipping table, but before it updated your inventory table, in response\
    \ to a customer's order.\n\nTransactions allow a group of table updates such as\
    \ this to be defined so that updates will occur either to all of them, or none\
    \ of them. As of this writing, support for transactions in MySQL is available\
    \ in beta form. Check the MySQL Website for the latest information.\n\n# # Column\
    \ and Table Name Aliases\n\nIn some situations, it may be more convenient to be\
    \ able to refer to MySQL columns and tables using different names. Let's take\
    \ the example of a database used by an airline's online booking system (this example\
    \ actually came up in the SitePoint.com forums). To represent the flights offered\
    \ by the airline, the database contains two tables: **Flights** and **Cities**.\
    \ Each entry in the **Flights** table represents an actual flight between two\
    \ cities -- the origin and destination of the flight. Obviously, **Origin** and\
    \ **Destination** are columns in the **Flights** table, with other columns for\
    \ things like the date and time of the flight, the type of aircraft, the flight\
    \ numbers, and the various fares.\n\nThe **Cities** table contains a list of all\
    \ the cities to which the airline flies. Thus, both the **Origin** and **Destination**\
    \ columns in the **Flights** table will just contain ID's referring to entries\
    \ in the **Cities** table. Now, consider these queries. To retrieve a list of\
    \ flights with their origins:\n\n```\nmysql> SELECT Flights.Number, Cities.Name\n\
    \    -> FROM Flights, Cities\n    -> WHERE Flights.Origin = Cities.ID;\n```\n\n\
    | Number | Name |\n| :--- | :--- |\n| CP110 | Montreal |\n| CP226 | Sydney |\n\
    | QF2026 | Melbourne |\n| ... | ... |"
  merge: -1
  img_proc: true
- pgno: 141
  md: 'To obtain a list of flights with their destinations:


    ```

    mysql> SELECT Flights.Number, Cities.Name

    -> FROM Flights, Cities

    -> WHERE Flights.Destination = Cities.ID;

    +---------+--------+

    | Number  | Name   |

    +---------+--------+

    | CP110   | Sydney |

    | CP226   | Montreal |

    | QF2026  | Sydney |

    | ...     | ...    |

    +---------+--------+

    ```


    Now what if we wanted to list both the origin and destination of each flight with
    a single query? Pretty reasonable, right? Here''s a query you might think to try:


    ```

    mysql> SELECT Flights.Number, Cities.Name, Cities.Name

    -> FROM Flights, Cities

    -> WHERE Flights.Origin = Cities.ID

    -> AND Flights.Destination = Cities.ID;

    Empty set (0.01 sec)

    ```


    Why doesn''t this work? Have another look at the query, and this time focus on
    what it actually says, rather than what you expect it to do. It tells MySQL to
    join the Flights and Cities tables and list the flight number, city name, and
    city name (yes, twice!) of all entries obtained, by matching up the Origin with
    the City ID and the Destination with the City ID. In other words, the Origin,
    Destination, and City ID must all be equal! This results in a list of all flights
    where the origin and the destination are the same! Unless your airline offers
    scenic flights, there aren''t likely to be any entries that match this description
    (thus the "Empty set" result above).


    What we need is a way to be able to return two different entries from the Cities
    table (one for the origin and one for the destination) for each result. If we
    had two copies of the table, one called Origins and one called Destinations, this
    would be much easier to do, but why maintain two tables that contain the exact
    same list of cities? The solution is to give the Cities table two different temporary
    names (aliases) for the purposes of this query.


    If we follow the name of a table with AS Alias in the FROM portion of the SELECT
    query, we can give it a temporary name with which we can refer to it elsewhere
    in the query. Here''s that first query again (to display flight numbers and origins
    only), but this time we''ve given the Cities table an alias: Origins.


    ```

    mysql> SELECT Flights.Number, Origins.Name

    -> FROM Flights, Cities AS Origins

    -> WHERE Flights.Origin = Origins.ID;

    ```'
  merge: -1
  img_proc: true
- pgno: 142
  md: 'This doesn''t actually change the way the query works -- in fact, it doesn''t
    change the results at all -- but for long table names, it can save some typing.

    Consider, for example, if we had given aliases of F and O to Flights and

    Cities, respectively. The query would be shorter as a result.


    Let''s now return to our problem query. If we refer to the Cities table twice,

    using two different aliases, we can use a three-table join (where two of the

    tables are actually one and the same) to get the effect we want:


    ```

    mysql> SELECT Flights.Number, Origins.Name,

    -> Destinations.Name

    -> FROM Flights, Cities AS Origins,

    -> Cities AS Destinations

    -> WHERE Flights.Origin = Origins.ID

    -> AND Flights.Destination = Destinations.ID;

    ```


    | Number | Name | Name |

    | --- | --- | --- |

    | CP110 | Montreal | Sydney |

    | CP226 | Sydney | Montreal |

    | QF2026 | Melbourne | Sydney |

    | ... | ... | ... |


    You can also define aliases for column names. We could use this, for example,

    to differentiate the two Name columns in our result table above:


    ```

    mysql> SELECT F.Number, O.Name AS Origin,

    -> D.Name AS Destination

    -> FROM Flights AS F, Cities AS O, Cities AS D

    -> WHERE F.Origin = O.ID AND F.Destination = D.ID;

    ```


    | Number | Origin | Destination |

    | --- | --- | --- |

    | CP110 | Montreal | Sydney |

    | CP226 | Sydney | Montreal |

    | QF2026 | Melbourne | Sydney |

    | ... | ... | ... |


    # # GROUPing SELECT Results


    In Chapter 2, we saw the following query, which tells us how many jokes are

    stored in our Jokes table:


    ```

    mysql> SELECT COUNT(*) FROM Jokes;

    ```


    | COUNT(*) |

    | --- |

    | 4 |


    The MySQL function COUNT used in this query belongs to a special class of

    functions called summary functions or group-by functions, depending on

    where you look. A complete list of these functions is provided in Section'
