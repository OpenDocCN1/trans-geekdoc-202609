  md: 'into the custom formatting language we developed above -- a tedious and mind-numbing
    task to say the least.


    What if we put the "Add New Joke" form in the hands of casual site visitors?

    If you recall, we actually did this in Chapter 4 when we provided a form for users
    to submit their own jokes. At the time, this was simply a device that demonstrated
    how INSERT statements could be made from within PHP scripts. We did not include
    it in the code we developed from scratch in this chapter because of the inherent
    security risks involved. After all, who wants to open the content of his or her
    site for just anyone to tamper with?


    But new joke submissions don''t have to appear on the site immediately. What if
    we added a new column to the Jokes table called Visible that could take one of
    two values: ''Y'' and ''N''. Newly submitted jokes could automatically be set
    to Visible=''N'', and could be prevented from appearing on the site if we simply
    add WHERE Visible=''Y'' to any query of the Jokes table for which the results
    are intended for public access. Jokes with Visible=''N'' would wait in the database
    for review by a content manager, who could edit each joke before they either made
    it visible, or deleted it out of hand.


    To create a column that contains one of two values, of which one is the default,
    we''ll need a new MySQL column type called ENUM:


    ```

    mysql> ALTER TABLE Jokes ADD COLUMN

    -> Visible ENUM(''N'',''Y'') NOT NULL;

    ```


    The first value listed in the parentheses (''N'' in this case) is the default
    value, which is assigned to new entries if no value is specified in the INSERT
    statement.


    With new jokes hidden from the public eye, the only security detail that remains
    is author identification. We want to be able to identify which author in the database
    submitted a particular joke, but it''s inappropriate to rely on the old drop-down
    list of authors in the "Add New Joke" form, since any author could pose as any
    other. Obviously, some sort of username/password authentication scheme is required.


    To store a password in the Authors table, simply add another column. You can then
    require an author to correctly enter his or her email address and password when
    they submit a joke to the database. You''d want to implement the same login procedure
    before you allow an author to modify his or her details (name, email address,
    etc.). You might even like to give each author a "control center" of sorts, where
    he or she could view the status of the jokes he or she has submitted to the site.'
