    \ PHP is smart enough to convert\nforward slashes in a file path to backslashes\
    \ when it's running on a Windows\nsystem. Because, under UNIX we can also use\
    \ single slashes (/) as per usual,\nthe adoption of forward slashes in general\
    \ for file paths in PHP will make\nyour scripts more portable.\n\n# Recording\
    \ Uploaded Files in the Database\n\nSo we've created a system whereby visitors\
    \ can upload JPEG and GIF images\nand have them saved on our server... but wasn't\
    \ this series supposed to be\nabout database-driven Websites? If we used the system\
    \ as it stands now,\nsomeone would have to collect the submitted images out of\
    \ the folder where\nthey're saved, and then add them to the Website by hand! If\
    \ we think back to\nChapter 7, when we developed a system that site visitors could\
    \ use to submit\njokes and have them stored in the database ready for quick approval\
    \ by an\nadministrator, we'll know there must be a better way!\n\nMySQL has several\
    \ column types that allow you to store binary data. In\ndatabase parlance, these\
    \ column types let us store BLOB's (Binary Large\nObjects). However, the storage\
    \ of potentially large files in a relational\ndatabase is not usually a good idea.\
    \ While there is convenience in having all\nthe data located in one place, large\
    \ files lead to large databases and large\ndatabases lead to reduced performance\
    \ and much larger backup files.\n\nThe best alternative is usually to just store\
