  md: '# # Locked Out?


    Like locking your keys in the car, to forget your password after you''ve spent
    an hour installing and tweaking a new MySQL server can be an embarrassment to
    say the least. Fortunately, if you have root access to the computer on which the
    MySQL server is running, or if you can log in as the user you set up to run the
    MySQL server (mysqlusr if you followed the instructions in Chapter 1), all is
    not lost. This next procedure will let you regain control of the server.


    First, you must shut down the MySQL server. Since you would normally do this using
    mysqladmin, which requires your forgotten password, you''ll instead have to kill
    the server process to shut it down. Use the ps command, or look in the server''s
    PID file (in the MySQL data directory) to determine the process ID of the MySQL
    server, and then terminate it with this command:


    ```

    % kill pid

    ```


    pid is the process ID of the MySQL server. This should be enough to stop the server.
    Do not use kill -9 unless absolutely necessary, as this may damage your table
    files. However, if you''re forced to do so, the next section provides instructions
    on how to subsequently check and repair those files.


    Now that the server''s down, you can restart it by running safe-mysqld (mysqld-
    opt.exe, mysqld-nt.exe, or whichever server executable you decided on under Windows)
    with the --skip-grant-tables command line option. This instructs the MySQL server
    to allow unrestricted access to anyone. Obviously, you''ll want to run the server
    in this mode as infrequently as possible, to avoid the inherent security risks.


    Once you''re connected, change your root password to something you''ll remember:


    ```

    mysql> USE mysql;

    mysql> UPDATE user SET Password=PASSWORD("newpassword")

    -> WHERE User="root";

    ```


    Finally, disconnect, and instruct the MySQL server to reload the grant tables
    to begin requiring passwords:


    ```

    % mysqladmin flush-privileges

    ```


    That does it -- and nobody ever has to know what you did. As for locking your
    keys in your car, you''re on your own there.


    # # Checking and Repairing MySQL Data Files


    In power outages, situations where you need to kill -9 the MySQL server process,
    or when Jessica''s friend idiot@%.host.net kicks the plug out of the wall, there
    is a risk that the MySQL data files may be damaged. This can'
  merge: -1
  img_proc: true
- pgno: 133
  md: 'occur if the server is in the middle of making changes to the files at the
    time of the disturbance, as the files may be left in a corrupt or inconsistent
    state. Since this type of damage can be subtle, it can go undetected for days,
    weeks, or even months. As a result, by the time you do finally discover the problem,
    all your backups may contain the same corruption.


    Chapter 15 of the MySQL Reference Manual (http://www.mysql.com/documentation/mysql/commented/manua1.php?section=Maintenance)
    describes the myisamchk utility that comes with MySQL, and how to use it to check
    and repair your MySQL data files. While that chapter is recommended reading for
    anyone who wants to set up a heavy-duty preventive maintenance schedule for their
    MySQL server, we''ll cover all the essentials here.


    Before we go any further, though, it''s important to realize that the myisamchk
    program expects to have sole access to the MySQL data files that it checks and
    modifies. If the MySQL server works with the files at the same time, and makes
    a modification to a file that myisamchk is in the middle of checking, myisamchk
    might incorrectly detect an error and try to fix it -- which in turn could trip
    up the MySQL server! Thus, to avoid making things worse instead of better, it''s
    usually a good idea to shut down the MySQL server while you''re working on the
    data files. Alternatively, shut down the server just long enough to make a copy
    of the files, and then do the work on the copies. When you''re done, shut down
    the server again briefly to replace the files with the new ones (and perhaps apply
    any update logs that were made in the interim).


    The MySQL data directory isn''t too difficult to understand. It contains a subdirectory
    for each database, and each of these subdirectories contains the data files for
    the tables in the corresponding database. Each table is represented by three files,
    which have the same name as the table, but three different extensions. The tblName.frm
    file is the table definition, which keeps track of which columns are contained
    in the table, and their type. The tblName.MYD file contains all the table data.
    The tblName.MYI file contains any indexes for the table (for example, it might
    contain the lookup table that helps the table''s primary key column speed up queries
    that are based on this table).


    To check a table for errors, just run myisamchk (in the MySQL bin directory) and
    provide either the location of these files and the name of the table, or the name
    of the table index file:


    ```

    % myisamchk /usr/local/mysql/var/dbName/tblName

    % myisamchk /usr/local/mysql/var/dbName/tblName.MYI

    ```


    Either of the above will perform a check of the specified table. To check all
    tables in the database, use a wildcard:'
  merge: -1
  img_proc: true
- pgno: 134
  md: '```

    % myisamchk /usr/local/mysql/var/dbName/*.MYI

    ```


    And to check all databases in all tables, use two:


    ```

    % myisamchk /usr/local/mysql/var/*.*.MYI

    ```


    Without any options, myisamchk performs a normal check of the table files. If
    you suspect problems with a table and a normal check fails to turn up anything,
    you can perform a much more thorough (but also much slower!) check using the --extend-check
    option:


    ```

    % myisamchk --extend-check /path/to/tblName

    ```


    Checking for errors is non-destructive, which means that you don''t have to worry
    that you might an existing problem worse if you perform a check on your data files.
    Repair operations, on the other hand, while usually safe, will make changes to
    your data files that cannot be undone. For this reason, it''s strongly recommended
    that you make a copy of any damaged table files before you attempt to repair them.
    As usual, make sure your MySQL server is shut down before you make copies of the
    data files.


    There are three types of repair that you can use to fix a problem with a damaged
    table. These should be tried in order with fresh copies of the data files each
    time (i.e. don''t try the second recovery method on a set of files that result
    from a failed attempt of the first recovery method). If at any point you get an
    error message that indicates that a temporary file can''t be created, delete the
    file to which the message refers and try again -- the offending file is a remnant
    of a previous repair attempt.


    The three repair methods can be executed as follows:


    ```

    % myisamchk --recover --quick /path/to/tblName

    % myisamchk --recover /path/to/tblName

    % myisamchk --safe-recover /path/to/tblName

    ```


    The first is the quickest, and fixes the most common problems; the last is the
    slowest, and fixes a few problems that the other methods do not.


    If these methods fail to resurrect a damaged table, there are a couple more tricks
    you can try before you give up:


    +   □ If you suspect that the table index file (*.MYI) is damaged beyond repair,
    or even missing entirely, it can be regenerated from scratch and used with your
    existing data (*.MYD) and table form (*.frm) files. To begin, make a copy of your
    table data (tblName.MYD) file. Restart your MySQL server and connect to it, then
    delete the contents of the table with the following command:


    ```

    mysql> DELETE FROM tblName;

    ```


    This command doesn''t just delete the contents of your table: it also creates
    a brand new index file for that table. Log out and shut down'
