  img_proc: true
- pgno: 179
  md: 'session. Most of them are just fine if left as-is, but here are a few crucial
    ones you''ll want to check:


    ```

    session.save_handler   = files

    session.save_path      = C:\\WINDOWS\\TEMP

    session.use_cookies    = 1

    session.use_trans_sid  = 1

    ```


    session.save_path tells PHP where to create the temporary files used to track
    sessions. It must be set to a directory that exists on the system, or you''ll
    get ugly error messages when you try to create a session on one of your pages.
    Under Unix, /tmp is a popular choice. In Windows, you could use C:\\WINDOWS\\TEMP,
    or some other directory if you prefer (I use D:\\PHP\\SESSIONS). With these adjustments
    made, restart your Web server software to allow the changes to take effect.


    You''re now ready to start working with PHP sessions. But before we jump into
    an example, let''s quickly look at the most common session management functions
    in PHP. To tell PHP to look for a session ID, or to start a new session if none
    is found, you simply call session_start. If an existing session ID is found when
    this function is called, PHP restores the variables that belong to that session.
    Since this function attempts to create a cookie, it must come before any page
    content is sent to the browser, just as we saw for setcookie above.


    ```

    session_start();

    ```


    To tell PHP that you want a particular variable to be stored in the current session
    so that it is available to other scripts run in the same session, you must call
    session_register. For example, the following will store the variable called $pwd
    in the current session:


    ```

    session_register(''pwd'');

    ```


    To remove a variable from the current session, you just use session_unregister:


    ```

    session_unregister(''pwd'');

    ```


    Finally, should you want to end the current session, deleting all registered variables
    in the process, you can use session_destroy:


    ```

    session_destroy();

    ```


    For more detailed information on these and the other session-management functions
    in PHP, see the relevant section of the PHP Manual (http://www.php.net/session).


    Now that we have these basic functions under our belt, let''s put them to work
    in a simple example.'
