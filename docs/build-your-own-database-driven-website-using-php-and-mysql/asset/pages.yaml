- pgno: 144
  md: '```

    mysql> SELECT Authors.Name, COUNT(*) AS NumJokes

    -> FROM Jokes, Authors

    -> WHERE AID = Authors.ID

    -> GROUP BY AID;


    +-------------+----------+

    | Name        | NumJokes |

    +-------------+----------+

    | Kevin Yank  | 3        |

    | Joan Smith  | 1        |

    +-------------+----------+

    ```


    If we group the results by author ID (AID), we receive a breakdown of results
    for each author. Note that we could have specified GROUP BY Authors.ID and achieved
    the same result (since, as stipulated in the WHERE clause, these columns must
    be equal). GROUP BY Authors.Name would also work in most cases, but, as you can''t
    guarantee that two different authors won''t have the same name (in which case
    their results would be lumped together), it''s best to stick to the ID columns,
    which are guaranteed to be unique for each author.


    # # LEFT JOINS


    We can see from the results above that Kevin Yank has three jokes to his name,
    and Joan Smith has one. What these results do not show is that there is a third
    author, Amy Mathieson, who doesn''t have any jokes to her name. Since there are
    no entries in the Jokes table with AID''s that match her author ID, there will
    be no results that satisfy the WHERE clause in the query above, and she will therefore
    be excluded from the table of results.


    About the only practical way to overcome this with the tools we have seen so far
    would be to add another column to the Authors table and simply store the number
    of jokes attributed to each author in that column. However, keeping that column
    up to date would be a real pain, since we''d have to remember to update it every
    time a joke was added to, removed from, or changed in (if, for example, the value
    of AID was changed) the Jokes table. To keep things synchronized, we''d have to
    use LOCK TABLES whenever we made such changes, as well. Quite a mess, to say the
    least!


    MySQL provides another method for joining tables (which fetches information from
    multiple tables at once) called a left join that is designed for just this type
    of situation. To understand how left joins differ from standard joins, we must
    first recall how standard joins work.'
  merge: -1
  img_proc: true
- pgno: 145
  md: '| Table 1 |

    |---|

    | Row 1 |

    | Row 2 |


    | Table 2 |

    |---|

    | Row 1 |

    | Row 2 |


    A standard join


    | Table 1 | Table 2 |

    |---|---|

    | Row 1 | Row 1 |

    | Row 1 | Row 2 |

    | Row 2 | Row 1 |

    | Row 2 | Row 2 |


    MySQL performs a standard join of two tables by listing all possible combinations
    of the rows of those tables. In a simple case, a standard join of two tables with
    two rows apiece will contain four rows: row 1 of table 1 with row 1 of table 2,
    row 1 of table 1 with row 2 of table 2, row 2 of table 1 with row 1 of table 2,
    and row 2 of table 1 with row 2 of table 2. With all of these result rows calculated,
    MySQL then looks to the WHERE clause for guidance on which rows should actually
    be kept (e.g. those where the AID column from table 1 matches the ID column from
    table 2).


    The reason the above does not suit our purposes is that we''d like to also include
    rows in table 1 (i.e. Authors) that don''t match any rows in table 2 (i.e. Jokes).
    A left join does exactly what we need - it forces a row to appear in the results
    for each row in the first (left-hand) table, even if no matching entries are found
    in the second (right-hand) table. Such **forced rows** are given NULL values for
    all of the columns in the right-hand table.


    To perform a left join between two tables in MySQL, separate the two table names
    in the FROM clause with LEFT JOIN instead of a comma. Then follow the second table''s
    name with ON condition, where condition specifies the criteria for matching rows
    in the two tables (i.e. what you would normally put in the WHERE clause). Here''s
    our revised query for listing authors and the number of jokes to their credit:


    ```

    mysql> SELECT Authors.NAME, COUNT(*) AS NumJokes

    -> FROM Authors LEFT JOIN Jokes ON AID = Authors.ID

    -> GROUP BY AID;

    ```


    | Name | NumJokes |

    |---|---|

    | Amy Mathieson | 1 |

    | Kevin Yank | 3 |

    | Joan Smith | 1 |'
