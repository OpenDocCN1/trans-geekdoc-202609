- pgno: 38
  md: '# Getting Started with MySQL


    In Chapter 1, we installed and set up two software programs: PHP and MySQL. In
    this chapter, we''ll learn how to work with MySQL databases using Structured Query
    Language (SQL).


    # An Introduction to Databases


    As I''ve already explained, PHP is a server-side scripting language that lets
    you insert into your Web pages instructions that your Web server software (be
    it Apache, IIS, or whatever) will execute before it sends those pages to browsers
    that request them. In a brief example, I showed how it was possible to insert
    the current date into a Web page every time it was requested.


    Now that''s all well and good, but things really get interesting when a database
    is added to the mix. A database server (in our case, MySQL) is a program that
    can store large amounts of information in an organized format that''s easily accessible
    through scripting languages like PHP. For example, you could tell PHP to look
    in the database for a list of jokes that you''d like to appear on your Web site.


    In this example, the jokes would be stored entirely in the database. The advantage
    of this would be twofold. First, instead of having to write an HTML file for each
    of your jokes, you could write a single PHP file that was designed to fetch any
    joke out of the database and display it. Second, to add a joke to your Web site
    would be a simple matter of inserting the joke into the database. The PHP code
    would take care of the rest, automatically displaying the new joke along with
    the others when it fetched the list from the database.


    Let''s run with this example as we look at how data is stored in a database. A
    database is composed of one or more tables, each of which contains a list of things.
    For our joke database, we''d probably start with a table called "jokes" which
    would contain a list of jokes. Each table in a database has one or more columns,
    or fields. Each column holds a certain piece of information about each item in
    the table. In our example, our "jokes" table might have columns for the text of
    the jokes, and the dates on which the jokes were added to the database. Each joke
    that we stored in this table would then be said to be a row in the table. These
    rows and columns form a table that looks like this:'
  merge: -1
  img_proc: true
- pgno: 39
  md: '| ID | JokeText | JokeDate |

    |---|---|---|

    | 1 | Why did the chicken...? | 2000-04-01 |

    | 2 | "Knock-knock!"

    "Who''s there?" | 2000-02-22 |


    Notice that, in addition to columns for the joke text ("JokeText") and the date
    of the joke ("JokeDate"), I included a column named "ID". As a matter of good
    design, a database table should always provide a way to uniquely identify each
    of its rows. Since it''s possible that a single joke could be entered more than
    once on the same date, the JokeText and JokeDate columns can''t be relied upon
    to tell all the jokes apart. The function of the ID column, therefore, is to assign
    a unique number to each joke, so we have an easy way to refer to them, and to
    keep track of which joke is which. Such database design issues will be covered
    with greater depth in Chapter 5.


    So, to review, the above is a three-column table with two rows (or entries). Each
    row in the table contains a joke''s ID, its text, and the date of the joke. With
    this basic terminology under our belts, we''re ready to get started with MySQL.


    # # Logging On to MySQL


    The standard interface for working with MySQL databases is to connect to the MySQL
    server software (which you set up in Chapter 1) and type commands one at a time.
    To make this connection to the server, you''ll need the MySQL client program.
    If you installed the MySQL server software yourself either under Windows or under
    some brand of UNIX, you already have this program installed in the same location
    as the server program. Under Linux, for example, the program is called mysql and
    is located by default in the /usr/local/mysql/bin directory. Under Windows, the
    program is called mysql.exe and is located by default in the C:\mysql\bin directory.


    If you didn''t set up the MySQL server yourself (if, for example, you''ll be working
    on your Web host''s MySQL server), there are two ways to connect to the MySQL
    server. The first is to use Telnet or a Secure Shell (SSH) connection to log into
    your Web host''s server, and then run mysql from there. The second is to download
    and install the MySQL software from http://www.mysql.com/ (available free for
    Windows and Linux) on your'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'own computer, and use it to connect to the MySQL server over the Internet.
    Both ways work fine, and your Web host may support one, the other, or both (you''ll
    need to ask).


    Whichever method and operating system you use, you''ll end up at a command line,
    ready to run the MySQL client program and connect to your MySQL server. Here''s
    what you should type:


    ```

    mysql -h hostname -u username -p

    ```


    You need to replace hostname with the host name or IP address of the computer
    on which the MySQL server is running. If the client program is run on the same
    computer as the server, you can actually leave off the -h hostname part of the
    command instead of typing -h localhost or -h 127.0.0.1. username should be your
    MySQL user name. If you installed the MySQL server yourself, this will just be
    root. If you''re using your Web host''s MySQL server, this should be the MySQL
    user name they assigned you.


    The -p argument tells the program to prompt you for your password, which it should
    do as soon as you enter the command above. If you set up the MySQL server yourself,
    this password is the root password you chose in Chapter 1. If you''re using your
    Web host''s MySQL server, this should be the MySQL password they gave you.


    If you typed everything properly, the MySQL client program will introduce itself
    and then dump you on the MySQL command line:


    ```

    mysql>

    ```


    Now, the MySQL server can actually keep track of more than one database (this
    allows a Web host to set up a single MySQL server for several of its subscribers
    to use, for example), so your next step should be to pick a database to work with.
    First, let''s retrieve a list of databases on the current server. Type this command
    (don''t forget the semicolon!), and hit ENTER.


    ```

    mysql> SHOW DATABASES;

    ```


    MySQL will show you a list of the databases on the server. If this is a brand
    new server (i.e. if you installed this server yourself in Chapter 1), the list
    should look like this:


    | Database |

    | :--- |

    | mysql |

    | test |


    2 rows in set (0.11 sec)


