- pgno: 130
  md: '# # Access Control Tips


    Due to the way the access control system in MySQL works, there are a couple of
    idiosyncrasies that you should be aware of before you launch into user creation.


    When you create users that can only log into the MySQL server from the computer
    on which that server is running (i.e. you require them to use Telnet or SSH to
    log into the server and run the MySQL client from there, or communicate using
    server-side scripts like PHP), you may ask yourself what the user part of the
    GRANT command should be. Say the server is running on www.host.net. Should you
    set up the user as username@www.host.net, or username@localhost?


    The answer is that you can''t rely on either one to handle all connections. In
    theory, if the user specifies the hostname when they connect (either with the
    mysql client or with PHPs mysql_connect function), that hostname will have to
    match the entry in the access control system. But since you probably don''t want
    to force your users to specify the hostname a particular way (in fact, users of
    the mysql client probably won''t want to specify the hostname at all), it''s best
    to use a work-around.


    For users that need to be able to connect from the same machine on which the MySQL
    server is running, it''s best to create two user entries in the MySQL access system:
    one with the actual hostname of the machine (e.g. username@www.host.net), the
    other with localhost (e.g. username@localhost). Of course, you will have to grant/revoke
    all privileges to both of these user entries individually, but this is the only
    work-around that you can really rely upon.


    Another common problem faced by MySQL administrators is that user entries with
    wildcards in their hostnames (e.g. jessica@%.host.net above) fail to work. When
    this happens, it''s usually due to the way MySQL prioritizes the entries in the
    access control system. Specifically, it orders entries so that more specific hostnames
    appear first (e.g. www.host.net is completely specific, %.host.net is less specific,
    and % is totally unspecific).


    In a fresh installation, the MySQL access control system contains two anonymous
    user entries (which allow connections from the local host that use any username
    -- the two entries are to support connections from localhost and the server''s
    actual hostname, as described above), and two root user entries. The problem described
    above occurs when the anonymous user entries take precedence over our new entry
    because their hostname is more specific.


    Let''s look at the abridged contents of the user table on www.host.net, our fictitious
    MySQL server, after we add Jessica''s entry. The rows here are sorted'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'in the order in which the MySQL server considers them when it validates a connection:


    | Host | User | Password |

    |---|---|---|

    | localhost | root | (encrypted value) |

    | www.host.net | root | (encrypted value) |

    | localhost | | |

    | www.host.net | | |

    | %.host.net | jessica | (encrypted value) |


    As you can see, since Jessica''s entry has the least specific hostname, it comes
    last in the list. When Jessica attempts to connect from www.host.net, the MySQL
    server matches her connection attempt to one of the anonymous user entries (a
    blank User value matches anyone). Since these anonymous entries don''t require
    a password, and presumably Jessica enters her password, MySQL rejects the connection
    attempt. Even if Jessica managed to connect without a password, she would be given
    the (very limited) privileges that are assigned to anonymous users, as opposed
    to the privileges assigned to her entry in the access control system.


    The solution to this problem is to either make your first order of business as
    a MySQL administrator the deletion of those anonymous user entries (DELETE FROM
    user WHERE User=""), or to give two more entries to all users who need to connect
    from localhost (i.e. entries for localhost and the actual hostname of the server):


    | Host | User | Password |

    |---|---|---|

    | localhost | root | (encrypted value) |

    | www.host.net | root | (encrypted value) |

    | localhost | jessica | (encrypted value) |

    | www.host.net | jessica | (encrypted value) |

    | localhost | | |

    | www.host.net | | |

    | %.host.net | jessica | (encrypted value) |


    Since it''s excessive to maintain three user entries (and three sets of privileges)
    for each user, I recommend that you remove anonymous users, unless you have a
    particular need for them:


    | Host | User | Password |

    |---|---|---|

    | localhost | root | (encrypted value) |

    | www.host.net | root | (encrypted value) |

    | %.host.net | jessica | (encrypted value) |'
  merge: -1
  img_proc: true
