- pgno: 193
  md: '# NOT NULL


    This specifies that the column may not be left empty (NULL). Note that NULL is
    a special ''no value'' value, which is quite different from, say, an empty string
    (''''). A column of type VARCHAR, for instance, which is set NOT NULL may be set
    to '''' but will not necessarily be NULL. Likewise, a NOT NULL column of type
    INT may contain zero (0), which is a value, but it may not contain NULL, as this
    is not a value.


    # DEFAULT default_value


    Lets you specify a value to be given to a column when no value is assigned in
    an INSERT statement.


    When this option is not specified, NULL columns (columns that don''t have the
    NOT NULL option set) will be assigned a value of NULL when they are not given
    a value in an INSERT statement. NOT NULL columns will instead be assigned a ''default
    default value'' (an empty string (''''), zero (0), "0000-00-00", or a current
    timestamp, depending on the data type of the column.


    # AUTO_INCREMENT


    As described in Chapter 2, an AUTO_INCREMENT column will automatically insert
    a number that is one greater than the current highest number in that column, when
    NULL is inserted. AUTO_INCREMENT columns must also be NOT NULL, and either a PRIMARY
    KEY or UNIQUE.


    # PRIMARY KEY


    This option specifies that the column in question should be the primary key for
    the table; that is, the values in the column must uniquely identify each of the
    rows in the table. This forces the values in this column to be unique, and speeds
    up searches for items based on this column by creating an index of the values
    it contains.


    # UNIQUE


    Very similar to PRIMARY KEY, this option requires all values in the column to
    be unique, and indexes the values for high speed searches.


    The table_options portion of the CREATE TABLE query is used to specify advanced
    properties of the table, and is described in detail in the MySQL Reference Manual.


    The select_statement portion of the CREATE TABLE query allows you to create a
    table from the results of a SELECT query (see page 187). When you create this
    table, you don''t have to declare the columns that correspond'
  merge: -1
  img_proc: true
