- pgno: 59
  md: "```\nwhile ( condition ) {\n// statement(s) to execute over\n// and over as\
    \ long as condition\n// remains true\n}\n```\n\nThis works very similarly to an\
    \ if-else statement without an else clause. The difference arises when the condition\
    \ is true and the statement(s) are executed. Instead of continuing the execution\
    \ with the statement that follows the closing brace (}), the condition is checked\
    \ again. If the condition is still true, then the statement(s) are executed a\
    \ second time, and a third, and will continue to be executed as long as the condition\
    \ remains true. The first time the condition evaluates false (whenever it's the\
    \ first time it's checked or the one-hundred-and-first), execution jumps immediately\
    \ to the next statement that follows the while loop (after the closing brace).\n\
    \nLoops like these come in handy whenever you're working with long lists of things\
    \ (such as jokes stored in a database... hint-hint!), but for now we'll illustrate\
    \ with a trivial example: counting to ten. This script is available as count10.php\
