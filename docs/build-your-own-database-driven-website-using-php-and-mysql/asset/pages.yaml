- pgno: 58
  md: 'As indicated in the code structure above, the `else` clause (that part of the
    `if`-`else` statement that says what to do if the condition is false) is optional.
    Let''s say you wanted to display the special message above only if the appropriate
    name was entered, but otherwise, you didn''t want to display any message. Here''s
    how the code would look:


    ```

    if ( $name == "Kevin" ) {

    echo( "welcome, oh glorious leader!" );

    }

    ```


    The `==` used in the condition above is the PHP operator that''s used to compare
    two values to see whether they''re equal. It''s important to remember to type
    the double-equals, because if you were to use a single equals sign you''d be using
    the assignment operator discussed above. So, instead of comparing the variable
    to the designated value, instead, you''d assign a new value to the variable (an
    operation which, incidentally, evaluates as true). This would not only cause the
    condition to always be true, but might change the value in the variable you''re
    checking, which could cause all sorts of problems.


    Conditions can be more complex than a single comparison for equality. Recall that
    we modified `welcome.php` to take a first and last name. If we wanted to display
    a special message only for a particular person, we''d have to check the values
    of both names (`welcome3.php`):


    ```

    if ( "Kevin" == $firstname and "Yank" == $lastname ) {

    echo( "welcome, oh glorious leader!" );

    } else {

    echo( "welcome to my website, $firstname $lastname!" );

    }

    ```


    This condition will be true if and only if `$firstname` has a value of Kevin and
    `$lastname` has a value of Yank. The word `and` in the above condition makes the
    whole condition true only if both of the comparisons evaluate to true. Another
    such operator is `or`, which makes the whole condition true if one or both of
    two simple conditions are true. If you''re more familiar with the JavaScript or
    C forms of these operators (`&&` and `||` for `and` and `or` respectively), they
    work in PHP as well.


    We''ll look at more complicated comparisons as the need arises. For the time being,
    a general familiarity with the `if`-`else` statement is sufficient.


    Another often-used PHP control structure is the `while` loop. Where the `if`-`else`
    statement allowed us to choose whether or not to execute a set of statements depending
    on some condition, the `while` loop allows us to use a condition to determine
    how many times to repeatedly execute a set of statements. Here''s what a `while`
    loop looks like:'
