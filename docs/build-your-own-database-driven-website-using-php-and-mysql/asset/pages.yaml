  md: '# About the Author


    Kevin Yank is the Technical Content Director for SitePoint.com, author of many
    well received tutorials and articles, and editor of the SitePoint Tech Times,
    an extremely popular technically-oriented email newsletter for Web Developers.


    Before graduating from McGill University in Montreal with a Bachelor of Computer
    Engineering, Kevin was not only a budding Web Developer himself, but also an active
    advisor for the Sausage Software Web Development Forums and writer of several
    practical guides on advanced HTML and JavaScript.


    These days, when he’s not discovering new technologies, writing books, or catching
    up on sleep, Kevin can be found helping other up-and-coming Web Developers in
    the SitePoint Forums (www.sitepointforums.com).


    # About SitePoint.com


    SitePoint.com is an online community and content-based resource site for Web Developers.
    At the time of printing this book, SitePoint.com registered over 2.6 million page
    views per month, boasted more than 73,000 newsletter subscribers and over 7,200
    active Community Forum members.


    Providing regular cutting-edge articles, in-depth product reviews, step-by-step
    tutorials, practical advice and a vibrant community, SitePoint.com is one of the
    most comprehensive sites in the world for resources related to building and growing
    a successful Website.


    Visit SitePoint at www.sitepoint.com.'
