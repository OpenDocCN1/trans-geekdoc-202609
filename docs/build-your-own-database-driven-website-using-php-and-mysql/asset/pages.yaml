  md: '# # Wrap-Up


    And so the great adventure draws to an end. In these pages, we have explored the
    MySQL RDBMS and the PHP scripting language, two products that together provide
    everything needed to launch a database-driven Website with all the capabilities
    and administrative (not to mention financial!) benefits that stem from it.


    As I wrote this book, a lot of readers wrote -- both in the SitePoint.com Forums
    and in private emails -- to encourage me, provide suggestions, ask lots of questions,
    and thank me for taking what has always seemed like a rather daunting subject
    and making it into something approachable and (dare I say it?) fun. While your
    words are all greatly appreciated (this book would not have been what it is without
    the level of support I have had from its readers!), I''d like to take this opportunity
    to thank the people who worked to create MySQL and PHP. These two products, free
    for personal use, together continue the long tradition of letting just about anyone
    project as professional and polished presence on the Internet as any big company.


    A project like this is never undertaken entirely alone. I''d like to thank Mark
    Harbottle, Matt Mickiewicz, and Jason Donald, Co-founders of SitePoint.com for
    their support in this endeavor (would you believe it was their idea?). Thanks
    also must go to my best friend, Amy Mathieson, who didn''t mind that I came all
    the way to Australia to visit her and spent most of my time working on this, to
    her sister Lisa Mathieson, who let me use her computer during my stay, and to
    my good friends Tony and Helen Terbizan, who provided me with an Internet connection,
