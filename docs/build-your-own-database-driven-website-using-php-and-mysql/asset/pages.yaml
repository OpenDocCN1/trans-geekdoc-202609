  md: "```\n<input type=\"file\" name=\"uploadfile\" /></p>\n<p>File Description:<br\
    \ />\n<input type=\"text\" name=\"desc\" maxlength=\"255\" /></p>\n<p><input type=\"\
    submit\" name=\"go\" value=\"Upload\" /></p>\n</form>\n```\n\nAs you should already\
    \ know from our work in Chapter 10, this form will create a temporary file on\
    \ the server and store the filename of that temp file in $uploadfile. It also\
    \ creates $uploadfile_name (the original name of the file), $uploadfile_size (the\
    \ file size in bytes), and $uploadfile_type (the MIME type of the file).\n\nInserting\
    \ the file into the database is a relatively straightforward process: open the\
    \ temporary file, read the data it contains into a PHP variable, and then use\
    \ that variable in a standard MySQL INSERT query. Again, we make use of is_uploaded_file\
    \ to make sure the filename we use does in fact correspond to an uploaded file\
    \ before we do any of this. Here’s the code:\n\n```\n// Bail out if the file isn't\
    \ really an upload.\nif (!is_uploaded_file($uploadfile))\n  die(\"Suploadfile\
    \ is not an uploaded file!\");\n\n// Open file for binary reading (\"rb\")\n$tempfile\
    \ = fopen($uploadfile,\"rb\");\n\n// Read the entire file into memory using PHP's\n\
    // filesize function to get the file size.\n$filedata = fread($tempfile,filesize($uploadfile));\n\
    \n// Prepare for database insert by adding backslashes\n// before special characters.\n\
    $filedata = addslashes($filedata);\n\n// Create the SQL query.\n$sql = \"INSERT\
    \ INTO filestore SET\n   FileName = '$uploadfile_name',\n   MimeType = '$uploadfile_type',\n\
    \   Description = '$desc',\n   FileData = '$filedata';\";\n\n// Perform the insert.\n\
    $ok = @mysql_query($sql);\nif (!$ok) die(\"Database error storing file: \" .\n\
    \  mysql_error());\n```\n\n# Viewing Stored Files\n\nArmed with the code that\
    \ accepts file uploads and stores them in a database, you’re halfway home. But\
    \ you still need to be able to pull that data out of the database to use it. For\
    \ our purposes, this will mean sending the file to a requesting browser."
  merge: -1
  img_proc: true
- pgno: 167
  md: 'Once again, this turns out to be a relatively straightforward process. We simply
    retrieve the data for the requested file from the database and send it on to the
    Web browser. The only tricky part is to send the browser information about the
    file, including:


    +   - The file size (so that the browser can display accurate download progress
    information to the user)

    +   - The file type (so that the browser knows what to do with the data it receives,
    e.g. display it as a Web page, a text file, an image, or offer to save the file)

    +   - The filename (if we don’t specify it, the browser will assume all files
    downloaded from our script have the same filename as the script)


    All this information is sent to the browser using HTTP headers - special lines
    of information that precede the transmission of the file data itself. Sending
    HTTP headers via PHP is quite easy using the header() function, but as headers
    must be sent before plain content, any calls to this function must come before
    anything is output by your script.


    The file size is specified with a content-length header:


    ```

    header("Content-Length: " . strlen($filedata));

    ```


    strlen is a built-in PHP function that returns the length of the given string.
    Since binary data is just a string of bytes as far as PHP is concerned, you can
    use this function to count the length in bytes of the file data.


    The file type is specified with a content-type header:


    ```

    header("Content-Type: $mimetype");

    ```


    Finally, the filename is specified with a content-disposition header:


    ```

    header("Content-Disposition: filename=$filename");

    ```


    Thus, use the script below to fetch a file with a given ID from the database and
    send it to the browser:


    ```

    $sql = "SELECT FileName, MimeType, FileData FROM filestore WHERE ID = ''id''";

    $result = @mysql_query($sql);

    if (!$result) die("Database error: " . mysql_error());


    $filename = mysql_result($result,0,"FileName");

    $mimetype = mysql_result($result,0,"MimeType");

    $filedata = mysql_result($result,0,"FileData");


    header("Content-disposition: filename=$filename");

    header("Content-Type: $mimetype");

    header("Content-Length: " . strlen($filedata));


    echo($filedata);

    ```'
  merge: -1
  img_proc: true
- pgno: 168
  md: "One final trick we can add to this code is to allow a file to be downloaded,\
    \ instead of viewed, if the user so desires. By sending a MIME type of application/octet-stream,\
    \ you can force some browsers (but not MSIE, unfortunately) to prompt the user\
    \ to save the file. Here’s the modified code, which checks if the variable $action\
    \ equals “dnld”, which would indicate that this special file type should be sent:\n\
    \n```\n$sql = \"SELECT FileName, MimeType, FileData\nFROM filestore WHERE ID =\
    \ 'id'\";\n$result = @mysql_query($sql);\nif (!$result) die(\"database error:\
    \ \" . mysql_error());\n\n$filename = mysql_result($result,0,\"FileName\");\n\
    $mimetype = mysql_result($result,0,\"MimeType\");\n$filedata = mysql_result($result,0,\"\
    FileData\");\n\nif ($action == \"dnld\")\n  $mimetype = \"application/octet-stream\"\
    ;\n\nheader(\"Content-disposition: filename=$filename\");\nheader(\"Content-Type:\
    \ $mimetype\");\nheader(\"Content-Length: \" . strlen($filedata));\n\necho($filedata);\n\
    ```\n\nMSIE tries to be smart and will attempt to display a file of type application/octet-stream\
    \ anyway. If we send it a non-standard MIME type, however (e.g. application/x-download),\
    \ MSIE dutifully offers to download the file immediately. Other browsers either\
    \ display an ugly “unrecognized file type” message that we’d like to avoid (Netscape\
    \ 4), or try to display the non-standard file as a plain text file (Opera 5).\
    \ To ensure the correct behavior in all browsers, we can detect MSIE by checking\
    \ the built-in HTTP_USER_AGENT variable, to see if it contains the string “MSIE”.\
    \ If it does, we send the application/x-download MIME type; otherwise, we send\
    \ application/octet-stream. Here’s the code:\n\n```\nif ($action == \"dnld\")\
    \ {\n  if (strpos(HTTP_USER_AGENT,\"MSIE\"))\n    $mimetype = \"application/x-download\"\
    ;\n  else\n    $mimetype = \"application/octet-stream\";\n}\n```\n\nThe only remaining\
    \ problem now is that, by default, Opera 5 identifies itself as MSIE 5.0. To get\
    \ around this sticky issue would require that we use some clever JavaScript to\
    \ check the actual features of the browser, and identify whether it’s really MSIE,\
    \ or just Opera posing as MSIE. The JavaScript would then send its findings to\
    \ the PHP script, along with the request to download the file. However, the code\
    \ involved in this solution is beyond the scope of this book."
  merge: -1
  img_proc: true
- pgno: 169
  md: "# The Complete Script\n\nBelow you'll find the complete example script. This\
    \ combines all the elements given above with some simple code that will list the\
    \ files in the database and allow them to be deleted. As always, this file is\
    \ available in the code archive (located at http://www.sitepoint.com/books/).\n\
    \nAs you look at the code, you may notice two spots where I’ve used this command:\n\
    \n```\nheader(\"Location: $PHP_SELF\");\n```\n\nAs described above, the header\
    \ function sends an HTTP header to the browser. We’ve seen the content-type, content-length,\
    \ and content-disposition headers already. The above line sends a location header,\
    \ which redirects the browser to the specified URL. As it specifies $PHP_SELF\
    \ as the URL, this line redirects the browser to the same page.\n\n“What’s the\
    \ point of that?” you might wonder. Well, I use this line after the script adds\
    \ or deletes a file in the database. In such cases, the action - add or delete\
    \ - is specified by a query string in the page’s URL. If the script simply took\
    \ the requested action and immediately displayed the updated list of files, the\
    \ user could inadvertently repeat that action by refreshing the page! To avoid\
    \ this kind of error, we instead re-direct the browser after it completes each\
    \ action to a url that’s identical in every way, except that it doesn’t contain\
    \ a query string ($PHP_SELF). Thus, the user can refresh the file list that’s\
    \ produced with no ill effects.\n\n```\n<?php\n\n$dbcnx = mysql_connect(\"localhost\"\
    , \"root\", \"mypasswd\");\nmysql_select_db(\"dbName\");\n\nif (($action == \"\
    view\" or $action == \"dnld\")\n   and $id != \"\") {\n\n   // User is retrieving\
    \ a file\n   $sql = \"SELECT FileName, MimeType, FileData\n           FROM filestore\
    \ WHERE ID = '$id';\";\n   $result = @mysql_query($sql);\n   if (!$result) die(\"\
    Database error: \" . mysql_error());\n\n   $filename = mysql_result($result,0,\"\
    FileName\");\n   $mimetype = mysql_result($result,0,\"MimeType\");\n   $filedata\
    \ = mysql_result($result,0,\"FileData\");\n   if ($action == \"dnld\") {\n   \
    \   if (strpos($HTTP_USER_AGENT,\"MSIE\"))\n         $mimetype = \"application/x-download\"\
    ;\n      else\n         $mimetype = \"application/octet-stream\";\n   }\n```"
