    # Summary


    In this chapter, we’ve had a taste of the PHP server-side scripting language by
    exploring all the basic language features: statements, variables, operators, and
    control structures. The sample applications we’ve seen have been pretty simple,
    but don’t let that dissuade you. The real power of PHP is in the hundreds of built-in
    functions that let you do everything: access data in a MySQL database, send e-mail,
    dynamically generate images, and even create Adobe Acrobat PDF files on the fly.


    In Chapter 4, we’ll delve into the MySQL functions in PHP, to show how to publish
