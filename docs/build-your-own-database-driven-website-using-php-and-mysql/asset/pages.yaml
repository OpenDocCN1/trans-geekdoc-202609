    # # String Replacement with Regular Expressions


    Using ereg or eregi with the regular expression syntax we''ve just learned, we
    can easily detect the presence of tags in a given text string. However, what we
    need to do is pinpoint those tags, and replace them with appropriate HTML tags.
    To do this, we need to look at a couple more regular expression functions offered
    by PHP: ereg_replace and eregi_replace.


    ereg_replace, like ereg, accepts a regular expression and a string of text, and
    attempts to match the regular expression in the string. In addition, however,
    ereg_replace takes a second string of text, and replaces every match of the regular
    expression with that string.


    The syntax for ereg_replace is as follows:


    ```

    $newstr = ereg_replace(regexp, replacewith, oldstr);

    ```


    Here, regexp is the regular expression, and replacewith is the string that will
    replace matches to regexp in oldstr. The function returns the new string that''s
    the outcome of the replacement operation. In the above, this newly-generated string
    is stored in $newstr.


    eregi_replace, as you might expect, is identical to ereg_replace, except that
    the case of letters is not considered when searching for matches.


    We''re now ready to build our custom markup language.


    # # Boldface and Italicized Text


    Let''s start by implementing tags that create boldfaced and italicized text. Let''s
    say we want [B] to begin bold text and [EB] to end bold text. Obviously, we must
    replace [B] with <b> and [EB] with </b>. Achieving this is a simple application
    of eregi_replace:


    ```

    $joketext = eregi_replace("\[[b]\]", "<b>", $joketext);

    $joketext = eregi_replace("\[[eb]\]", "</b>", $joketext);

    ```


    Notice that, because [ normally indicates the start of a set of acceptable characters
    in a regular expression, we put a backslash before it in order to remove its special
    meaning. Without a matching [, the ] loses its special'
  merge: -1
  img_proc: true
- pgno: 115
  md: 'meaning, so it doesn''t need a backslash, although you could put a backslash
    in front of it as well if you wanted to be thorough.


    Also notice that, as we''re using eregi_replace, which is case insensitive, both
    [B] and [b] will work as tags in our custom markup language.


    Italicized text can be done the same way:


    ```

    $joketext = eregi_replace("\\[i\]", "<i>", $joketext);

    $joketext = eregi_replace("\\[ei\]", "</i>", $joketext);

    ```


    # ## Paragraphs


    While we could create tags for paragraphs just as we did for boldface and italicized
    text above, a simpler approach makes even more sense. Since the user will type
    the content into a form field that allows them to format text using the enter
    key, we shall take a single linefeed (\\n) to indicate a line break (<br />) and
    a double linefeed (\\n\\n) to indicate a new paragraph (</p><p>). Of course, because
    the PC represents new lines as a linefeed- carriage return pair (\\n\\r), we must
    strip out carriage returns first. The code for all this is as follows:


    ```

    // Strip out carriage returns

    $joketext = eregi_replace("\\r","",$joketext);

    // Handle paragraphs

    $joketext = ereg_replace("\\n\\n","</p><p>",$joketext);

    // Handle line breaks

    $joketext = ereg_replace("\\n","<br />",$joketext);

    ```


    That''s it! The text will now appear in the paragraphs expected by the user, who
    hasn''t had to learn any custom tags to format their content.


    # ## Hyperlinks


    While it may seem silly to support the inclusion of hyperlinks in the text of
    jokes, this feature makes plenty of sense in other applications. Hyperlinks are
    a little more complicated than the simple conversion of a fixed code fragment
    into an HTML tag. We need to be able to output a URL, as well as the text that
    should appear as the link.


    Another feature of ereg_replace and eregi_replace comes into play here. If you
    surround the portion of the regular expression with parentheses, you can capture
    the corresponding portion of the matched text, and use it in the replace string.
    To do this, you''ll use the code \\n, where n is 1 for the first parenthesized
    portion of the regular expression, 2 for the second, up to 9 for the 9th. Consider
    this example:'
