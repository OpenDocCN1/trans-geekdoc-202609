    # Splitting Text into Pages


    While no joke is likely to be so long that it will require more than one page,
    many content-driven sites (like SitePoint.com) provide lengthy content that is
    best presented when it''s broken into pages. Yet another regular expression function
    in PHP makes this exceedingly easy to do.


    split is a function that takes a regular expression and a string of text, and
    uses matches for the regular expression to break the text into an array.


    Consider the following example:


    ```

    $regexp="[ \n\r\t]+"; // One or more whitespace chars

    $text="This is a test.";

    $textarray=split($regexp,$text);

    echo("$textarray[0]<br />"); // Outputs "This<br />"

    echo("$textarray[1]<br />"); // Outputs "is<br />"

    echo("$textarray[2]<br />"); // Outputs "a<br />"

    echo("$textarray[3]<br />"); // Outputs "test.<br />"

    ```


    If we search for a [PAGEBREAK] tag instead of a whitespace character, and we display
    only the page we''re interested in (indicated by a $page variable passed with
    the page request, for example) instead of all of the resulting portions of the
    text, we can successfully divide our content into pages.


    ```

    // If no page specified, default to the

    // first page (Page = 0)

    if (!isset($page)) $page = 0;


    // Split the text into an array of pages

    $textarray=split("\[PAGEBREAK\]",$text);


    // Select the page we want

    $pagetext=$textarray[$page];

    ```


    Of course, we''ll want to provide a way for users to move between pages. Let''s
    put a link to the previous page at the top of the current page, and a link to
    the next page at the bottom.'
