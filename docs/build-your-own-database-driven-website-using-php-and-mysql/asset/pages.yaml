- pgno: 210
  md: '# MySQL Functions


    MySQL provides a sizeable library of functions to format and combine data within
    SQL queries in order to produce the desired results in the desired format. This
    appendix provides a reference to the most useful of these functions, as implemented
    in MySQL as of version 3.23.39 (current as of this writing).


    For a complete, up-to-date reference to supported SQL functions, see the MySQL
    Reference Manual at http://www.mysql.com.


    # Control Flow Functions


    ```

    IFNULL(expr1,expr2)

    ```


    Returns expr1 unless it is NULL, in which case it returns expr2.


    ```

    NULLIF(expr1,expr2)

    ```


    Returns expr1 unless it equals expr2, in which case it returns NULL.


    ```

    IF(expr1,expr2,expr3)

    ```


    If expr1 is TRUE (that is, not NULL or 0), returns expr2; otherwise, returns expr3.


    ```

    CASE value WHEN [compare-value] THEN result [WHEN ...] [ELSE result] END

    ```


    Returns result when value=compare-value (note that several compare-value/result
    pairs can be defined); otherwise, returns the ELSE result, or NULL if none is
    defined.


    ```

    CASE WHEN [condition] THEN result [WHEN ...] [ELSE result] END

    ```


    Returns result when condition is TRUE (note that several condition/result pairs
    can be defined); otherwise, returns the ELSE result, or NULL if none is defined.'
  merge: -1
  img_proc: true
- pgno: 211
  md: '# Mathematical Functions


    `ABS(expr)`

    Returns the absolute (positive) value of `expr`.


    `SIGN(expr)`

    Returns -1, 0, or 1 depending on whether `expr` is negative, zero, or positive,
    respectively.


    `MOD(expr1, expr2)`

    Returns the remainder of dividing `expr1` by `expr2`.


    `FLOOR(expr)`

    Rounds down `expr` (i.e. returns the largest integer value that is less than or
    equal to `expr`).


    `CEILING(expr)`

    Rounds up `expr` (i.e. returns the smallest integer value that is greater than
    or equal to `expr`).


    `ROUND(expr)`

    Returns `expr` rounded to the nearest integer. Note that the behavior when the
    value is exactly an integer plus 0.5 is system dependant. Thus, you should not
    rely on any particular outcome when migrating to a new system.


    `ROUND(expr, num)`

    Rounds `expr` to a number with `num` decimal places, leaving trailing zeroes in
    place. Use `num=2`, for example, to format a number as dollars and cents. Note
    that the same uncertainty about the rounding of 0.5 applies as discussed for `ROUND()`
    above.


    `EXP(expr)`

    Returns `e^expr`, the base of natural logarithms raised to the power of `expr`.


    `LOG(expr)`

    Returns `ln(expr)`, or `log_e(expr)`, the natural logarithm of `expr`. Remember,
    a log with an arbitrary base B can be calculated as `LOG(expr)/LOG(B)`.


    `LOG10(expr)`

    Returns the base-10 logarithm of `expr`.'
  merge: -1
