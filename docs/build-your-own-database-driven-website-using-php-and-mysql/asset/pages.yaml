- pgno: 85
  md: 'In the case of a simple one-to-one relationship, a single table is all you''ll
    need. An example of a one-to-one relationship that you''ve seen is the email address
    of each author in our joke database. Since there will be one e-mail address for
    each author, and one author for each e-mail address, there is no reason to split
    the addresses off into a separate table.


    A many-to-one relationship is a little more complicated, but you''ve already seen
    one of these as well. Each joke in our database is associated with just one author,
    but many jokes may have been written by that one author. This joke-author relationship
    is many-to-one. I''ve already covered the problems that result from storing the
    information associated with a joke''s author in the same table as the joke itself.
    In brief, it can result in many copies of the same data, which are difficult to
    keep synchronized, and which waste space. If we split the data into two tables,
    and use an ID column to link the two together (making joins possible as shown
    above), all these problems disappear.


    You have yet to see a one-to-many relationship, but finding an example isn''t
    difficult. In our database so far, we''ve assumed that each author only has one
    email address. While this may not always be the case, this is a reasonable limitation
    to impose since you only really need one e-mail address to get in touch with an
    author. You simply trust that he or she would enter their most-used email address
    -- or at least one that is checked regularly -- when adding him or herself to
    the database. If you did, however, want to support multiple email addresses, you''d
    be faced with a one-to-many relationship (one author may have many email addresses,
    but each email address belongs to exactly one author).


    When someone inexperienced in database design approaches a one-to-many relationship
    like this one, his or her first approach is often to try to store multiple values
    in a single database field, like this:


    | ID | Name | EMail |

    |---|---|---|

    | 1 | Kevin Yank | kevin@sitepoint.com, kyank@attglobal.net |

    | 2 | Joan Smith | joan@somewhere.net, jsmith@else.net |


    While this would work, to retrieve a single email address from the database, we''d
    need to break up the string by searching for commas (or whatever special character
    you chose to use as a separator) -- a not-so-simple and potentially time-consuming
    operation. Try to imagine the PHP code necessary to remove one particular email
    address from one particular author! In addition, you''d need to allow for much
    longer values in the EMail column,'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'which could result in wasted disk space, because the majority of authors would
    only have one email address.


    The solution for a one-to-many relationship such as this is very similar to the
    solution we saw for a many-to-one relationship above. As you might expect, the
    pattern is simply reversed. You just break the Authors table into two tables,
    Authors and EMails, and then associate the email addresses with their authors
    using an Author ID (AID) column in the EMails table:


    ![](img/8345fab290b1af6acfffd37582f5eaf4_86_0.png)


    Using a join, it''s easy to list the email addresses associated with a particular
    author:


    ```

    mysql> SELECT EMail FROM Authors, EMails WHERE

    -> Name="Kevin Yank" AND AID=Authors.ID;

    +

    | EMail |

    +

    | kevin@sitepoint.com |

    | kyan@attglobal.net |

    +

    2 rows in set (0.00 sec)

    ```


    # Many-to-Many Relationships


    Okay, you''ve now got a steadily-growing database of jokes published on your Web
    site. It''s growing so quickly, in fact, that the number of jokes has become unmanageable!
    People who visit your site are faced with a mammoth page that contains hundreds
    of jokes listed with no structure whatsoever.


    Something has to change.


    You decide to place your jokes into categories such as "Knock-Knock Jokes", "Crossing
    the Road Jokes", "Lawyer Jokes", and "Political Jokes".'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'Remembering our rule of thumb from earlier, you identify joke categories as
    a different type of "thing", and create a new table for them:


    ```

    mysql> CREATE TABLE Categories (

    -> ID INT NOT NULL AUTO_INCREMENT PRIMARY KEY,

    -> Name VARCHAR(100)

    -> );

    Query OK, 0 rows affected (0.00 sec)

    ```


    Now you come to the daunting task of assigning categories to your jokes. It occurs
    to you that a "political" joke might also be a "crossing the road" joke, and a
    "knock-knock" joke might also be a "lawyer" joke. A single joke might belong to
    many categories, and each category will contain many jokes. This is a many-to-many
    relationship.


    Once again, many inexperienced developers begin to think of ways to store several
    values in a single column, because the obvious solution is to add a Categories
    column to the Jokes table and use it to list the ID''s of those categories to
    which each joke belongs. A second rule of thumb would be useful here: if you need
    to store multiple values in a single column, chances are that your design is flawed.


    The correct way to represent a many-to-many relationship is to use a "lookup table".
    This is a table that contains no actual data, but which defines pairs of entries
    that are related. Here''s what the database design would look like for our joke
    categories:


    ![](img/8345fab290b1af6acfffd37582f5eaf4_87_0.png)


    The JokeLookup table associates joke ID''s (JID) with category ID''s (CID). In
    the above example, we can see that the joke that starts with "How many lawyers..."
    belongs to both the "Lawyer" and "Light Bulb" categories.


    A lookup table is created in much the same way as is any other table. The difference
    lies in the choice of the primary key. Every table we''ve created so far has had
    a column named ID that was designated to be the PRIMARY KEY when the table was
    created. Designating a column as a primary key tells MySQL not to allow two entries
    to have the same value in that column. It also speeds up join operations based
    on that column.'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'In the case of a lookup table, there is no single column that we want to force
    to have unique values. Each joke ID may appear more than once, as a joke may belong
    to more than one category, and each category ID may appear more than once, as
    a category may contain many jokes. What we don''t want to allow is the same pair
    of values to appear in the table twice. And since the sole purpose of this table
    is to facilitate joins, the speed benefits offered by a primary key would come
    in very handy. For this reason, we usually create lookup tables with a multi-column
    primary key as follows:


    ```

    mysql> CREATE TABLE JokeLookup (

    -> JID INT NOT NULL,

    -> CID INT NOT NULL,

    -> PRIMARY KEY(JID,CID)

    -> );

    ```


    This creates the table in which the JID and CID columns together form the primary
    key. This enforces the uniqueness that is appropriate to a lookup table (preventing
    a particular joke from being assigned to a particular category more than once),
    and speeds up joins that make use of this table.


    With your lookup table in place and containing category assignments, you can use
    joins to create several interesting and very practical queries. This query lists
    all jokes in the "Knock-Knock" category:


    ```

    mysql> SELECT JokeText

    -> FROM Jokes, Categories, JokeLookup

    -> WHERE Name="Knock-Knock" AND

    -> CID=Categories.ID AND JID=Jokes.ID;

    ```


    The following query lists the categories that contain jokes that begin with "How
    many lawyers..."


    ```

    mysql> SELECT Categories.Name

    -> FROM Jokes, Categories, JokeLookup

    -> WHERE JokeText LIKE "How many lawyers%"

    -> AND CID=Categories.ID AND JID=Jokes.ID;

    ```


    And this query, which also makes use of our Authors table to form a join of four
    tables (!!!), lists the names of all authors who have written Knock-Knock jokes:


    ```

    mysql> SELECT Authors.Name

    -> FROM Jokes, Authors, Categories, JokeLookup

    -> WHERE Categories.Name="Knock-Knock"

    -> AND CID=Categories.ID AND JID=Jokes.ID

    -> AND AID=Authors.ID;

    ```


    # ## Summary


    In this chapter, I explained the fundamentals of good database design, and we
    learned how MySQL (and, for that matter, all relational database'
