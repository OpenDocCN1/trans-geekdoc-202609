- pgno: 196
  md: '# GRANT


    ```

    GRANT priv_type [(column_list)], ...

    ON {tbl_name | * | *.* | db_name.*}

    TO user_name [IDENTIFIED BY ''password''], ...

    [WITH GRANT OPTION]

    ```


    Adds new access privileges to a user account, and creates a new account if the
    specified user_name does not yet exist, or changes the password if IDENTIFIED
    BY ''password'' is used on an account that already has a password.


    See page 114 for a complete description of this query.


    # INSERT


    ```

    INSERT [LOW_PRIORITY | DELAYED] [IGNORE] [INTO] tbl_name

    { [(col_name, ...)] VALUES (expression, ...), ...

    | [(col_name, ...)] SELECT ...

    | SET col_name=expression, col_name=expression, ... }

    ```


    The INSERT query is used to add new entries to a table. It supports three general
    options:


    +   - **LOW_PRIORITY**

    +     The query will wait until there are no clients reading from the table before
    it proceeds.


    +   - **DELAYED**

    +     The query completes immediately from the client''s point of view, and the
    INSERT operation is performed in the background. This is useful when you wish
    to insert a large number of rows without waiting for the operation to complete.
    Be aware that the client will not know the last inserted ID on an AUTO_INCREMENT
    column when a DELAYED insert is performed (e.g. mysql_insert_id() in PHP will
    not work correctly).'
