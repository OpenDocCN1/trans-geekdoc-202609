    \ If you've ever written programs in any other languages (be they JavaScript,\
    \ C, or BASIC) you already know that practical programs are rarely so simple.\n\
    \nPHP, just like any other programming language, provides facilities that allow\
    \ us to affect the **flow of control** in a script. That is, the language contains\
    \ special statements that permit you to deviate from the one-after-another execution\
    \ order that has dominated our examples so far. Such statements are called **control\
    \ structures**. Don't get it? Don't worry! A few examples will illustrate perfectly.\n\
    \nThe most basic, and most often-used, control structure is the `if-else` statement.\
    \ Here's what it looks like:\n\n```\nif ( condition ) {\n  // Statement(s) to\
    \ be executed if\n  // condition is true.\n} else {\n  // (Optional) Statement(s)\
    \ to be\n  // executed if condition is false.\n}\n```\n\nThis control structure\
    \ lets us tell PHP to execute one set of statements or another, depending on whether\
