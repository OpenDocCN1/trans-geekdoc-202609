- pgno: 23
  md: 'up the task list, you should see the MySQL server listed as one of the tasks
    that''s active on your system.


    To ensure that the server is started whenever Windows starts, you might want to
    create a shortcut to the program and put it in your Startup folder. This is just
    like creating a shortcut to any other program on your system.


    On WinNT/2000/XP, you must install MySQL as a system service. Fortunately, this
    is very easy to do. Simply open a Command Prompt and run your chosen server program
    with the `-install` option:


    ```

    C:\mysql\bin> mysqld-nt --install

    ```


    This will install MySQL as a service that will be started the next time you reboot
    Windows. To manually start MySQL without having to reboot, just type this command
    (which can be run from any directory):


