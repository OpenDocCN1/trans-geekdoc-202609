    # User Interaction and Forms


    For many applications of PHP, the ability to interact with users who view the
    Web page is essential. Veterans of JavaScript tend to think in terms of event
    handlers, which let you react directly to the actions of the user - for example,
    the movement of the mouse over a link on the page. Server-side scripting languages
    such as PHP have a more limited scope when it comes to user interaction. As PHP
    code is activated when a page is requested from the server, user interaction can
    only occur in a back-and-forth fashion: the user sends requests to the server,
    and the server replies with dynamically generated pages.


    The key to creating interactivity with PHP is to understand the techniques we
    can use to send information about a users’ interaction along with their request
    for a new Web page. PHP makes this fairly easy, as we’ll now see.


    The simplest method we can use to send information along with a page request uses
    the URL query string. If you’ve ever seen a URL with a question mark following
    the filename, you’ve witnessed this technique in use. Let’s look at an easy example.
    Create a regular HTML file called welcome.html (no .php file extension is required,
    since there will be no PHP code in this file) and insert this link:


    ```

    <a href="welcome.php?name=kevin"> Hi, I''m Kevin! </a>

    ```


    This is a link to a file called welcome.php, but as well as linking to the file,
    we’re also passing a variable along with the page request. The variable is passed
    as part of the "query string", which is the portion of the URL that follows the
    question mark. The variable is called name and its value is Kevin.'
  merge: -1
  img_proc: true
