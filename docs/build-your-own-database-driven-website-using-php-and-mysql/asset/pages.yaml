    Back in Chapter 2, you used a program called `mysql` that allowed you to make
    such a connection. PHP has no need of any special program, however; support for
    connecting to MySQL is built right into the language. The following PHP function
    call establishes the connection:


    ```

    mysql_connect(address, username, password);

    ```


    Here, `address` is the IP address or hostname of the computer on which the MySQL
    server software is running ("`localhost`" if it''s running on the same'
