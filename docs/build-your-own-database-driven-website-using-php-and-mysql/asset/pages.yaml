  md: "```\n$text = \"banana\";\n$text = eregi_replace(\"(.*)(nana)\", \"\\\\2\\\\\
    1\", $text);\necho($text); // outputs \"nanaba\"\n```\n\nIn the above, \\\\1 gets\
    \ replaced with ba in the replace string, which corresponds to (.* ) (zero or\
    \ more non-new line characters) in the regular expression. \\\\2 gets replaced\
    \ with nana, which corresponds to (nana) in the regular expression.\n\nWe can\
    \ use the same principle to create our hyperlinks. Let's begin with a simple form\
    \ of link, where the text of the link is the same as the URL. We want to support\
    \ the syntax:\n\n```\nvisit [L]http://www.php.net/[EL].\n```\n\n'The corresponding\
    \ HTML code, which we want to output, is as follows:\n\n```\nvisit <a href=\"\
    http://www.php.net/\">http://www.php.net/</a>.\n```\n\nFirst, we need a regular\
    \ expression that will match links of this form. The regular expression is as\
    \ follows:\n\n```\n\\[L\\][-_.\\/a-zA-Z0-9!&%#?,':=~+]\\[EL\\]\n```\n\nAgain,\
    \ we've placed backslashes in front of the opening square brackets in [L] and\
    \ [EL] to indicate that they are to be taken literally. We then use square brackets\
    \ to list all the characters we wish to accept as part of the URL. We place a\
    \ + after the square brackets to indicate that the URL will be composed of one\
    \ or more characters taken from this list.\n\nTo output our link, we'll need to\
    \ capture the URL and output it both as the HREF attribute of the A tag, and as\
    \ the text of the link. To capture the URL, we surround the corresponding portion\
    \ of our regular expression with parentheses:\n\n```\n\\[L\\]\\([-_.\\/a-zA-Z0-9!&%#?,':=~+]\\\
    )\\[EL\\]\n```\n\nSo we convert the link with the following code:\n\n```\n$joketext\
    \ = eregi_replace(\n \"\\[L\\]\\([-_.\\/a-zA-Z0-9!&%#?,':=~+]\\)\\[EL\\]\",\n\
    \ \"<a href=\\\"\\\\1\\\">\\\\1</a>\", $joketext);\n```\n\nNote that we had to\
    \ place backslashes before the double quotes in the link's HTML code, to ensure\
