- pgno: 78
  md: '# 5 Relational Database Design


    Since Chapter 2 of this series, we''ve worked with a very simple database of jokes,
    which is composed of a single table named, appropriately enough, Jokes. While
    this database has served us well as an introduction to MySQL databases, there''s
    more to relational database design than this simple example illustrates. In this
    chapter, we''ll expand on our example, and learn a few new features of MySQL,
    in an effort to realize and appreciate what relational databases have to offer.


    Be forewarned that many topics will be covered only in an informal, hands-on (i.e.
    non-rigorous) sort of way. As any computer science major will tell you, database
    design is a serious area of research, with tested and mathematically provable
    principles that, while useful, are beyond the scope of this text. If you want
    more information, stop by http://www.datamodel.org/ for a list of good books,
    as well as several useful resources on the subject.


    # Giving Credit where Credit is Due


    To start things off, let''s recall the structure of our Jokes table. It contains
    three columns: ID, JokeText, and JokeDate. Together, these columns allow us to
    identify jokes (ID), and keep track of their text (JokeText) and the date they
    were entered (JokeDate). The SQL code that creates this table and inserts a couple
    of entries is provided as jokes1.sql in the code archive (located at http://www.sitepoint.com/books/).


    Now let''s say we wanted to track another piece of information about our jokes:
    the names of the people who submitted them. It would seem natural to want to add
    a new column to our Jokes table for this. The SQL ALTER command (which we haven''t
    seen before) lets us do exactly what we need. Log into your MySQL server using
    the mysql command-line program as in Chapter 2, select your database (jokes if
    you used the name suggested in that chapter) then type this command:


    ```

    mysql> ALTER TABLE Jokes ADD COLUMN

    -> AuthorName VARCHAR(255);

    ```


    This adds a column called AuthorName to your table. The type declared is a variable-length
    character string of up to 255 characters (plenty for even very esoteric names).
    Let''s also add a column for the author''s e-mail address:'
  merge: -1
  img_proc: true
- pgno: 79
  md: '```

    mysql> ALTER TABLE Jokes ADD COLUMN

    -> AuthorEmail VARCHAR(255);

    ```


    For more information about the ALTER command, see Appendix A. Just to make sure
    the two columns were added properly, we should ask MySQL to describe the table
    to us:


    ```

    mysql> DESCRIBE Jokes;

    ```


    | Field | Type | Null | Key | Default |

    |---|---|---|---|---|

    | ID | int(11) | | PRI | 0 |

    | JokeText | text | YES | | NULL |

    | JokeDate | date | | | 0000-00-00 |

    | AuthorName | varchar(100) | YES | | NULL |

    | AuthorEmail | varchar(100) | YES | | NULL |


    ```

    5 rows in set (0.01 sec)

    ```


    Looks good, right? Obviously, we would need to make changes to the HTML and PHP
    form code we created in Chapter 4 that allows us to add new jokes to the database,
    but I''ll leave the figuring out of those details to you, as an exercise. Using
    UPDATE queries, we could now add author details to all the jokes in the table.
    But before we get carried away with this, we need to stop and consider whether
    this new table was the right design choice here. In this case, it turns out that
    it wasn''t.


    # Rule of Thumb: Keep Things Separate


    As your knowledge of database-driven Web sites continues to grow, you may decide
    that a personal joke list isn''t enough. In fact, you might begin to receive more
    submitted jokes than you have original jokes of your own. Let''s say you decide
    to launch a Web site where people from all over the world can share jokes with
    each other. You''ve heard of the Internet Movie Database (IMDB)? You decide to
    open the Internet Joke Database (IJDB)! To add the author''s name and e-mail address
    to each joke certainly makes a lot of sense, but the way we did it above leads
    to several potential problems:


    +   - What if a frequent contributor to your site named Joan Smith changed her
    email address? She might begin to submit new jokes using the new address, but
    all the old jokes would still have the old address attached to them. Looking at
    your database, you might simply think there were two different people named Joan
    Smith who submit jokes. If she were especially thoughtful, she might inform you
    of the change of address, and you might try to update all the old jokes with the
    new address, but if you missed just one joke, your database would still have incorrect
    information stored in it. Database design experts refer to this sort of problem
    as an "update anomaly".'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'It would be natural for you to rely on your database to provide a list of all
    the people who''ve ever submitted jokes to your site. In fact, you could easily
    obtain a mailing list by using the following query:


    ```

    mysql> SELECT DISTINCT AuthorName, AuthorEmail

    -> FROM Jokes;

    ```


    The word DISTINCT in the above query tells MySQL not to output duplicate result
    rows. For example, if Joan Smith submitted 20 jokes to your site, her name and
    email address would appear 20 times in the list, instead of just once, if you
    failed to use the DISTINCT option.


    If for some reason you decided to remove all the jokes that a particular author
    had submitted to your site, you''d also remove all record of this person from
    the database, and you wouldn''t be able to email them with information about your
    site anymore! Since your mailing list might be a major source of income for your
    site, you wouldn''t want to go throwing away people''s email addresses just because
    you didn''t like the jokes they submitted to your site. Database design experts
    call this a "delete anomaly".


    You have no guarantee that Joan Smith would not enter her name as "Joan Smith"
    one day, as "J. Smith" the next, and as "Smith, Joan" on yet another occasion.
    This would make keeping track of a particular author exceedingly difficult (especially
    if Joan Smith had several email addresses she liked to use, too).


    These problems and more can be very quickly dealt with. Instead of storing the
    information for the authors in the Jokes table, let''s create an entirely new
    table for our list of authors. Since we used a column called ID in the Jokes table
    to uniquely identify each of our jokes with a number, we''ll use an identically-named
    column in our new table to identify our authors. We can then use those "author
    ID''s" in our Jokes table to associate authors with their jokes. The complete
    database layout is shown here:


    | ID | JokeText | JokeDate | AID |

    |---|---|---|---|

    | 1 | Why did the... | 1990-04-01 | 1 |

    | 2 | A man walked... | 1999-01-26 | 1 |

    | 3 | Knock-knock... | 1999-03-10 | 2 |


    | ID | Name | EMail |

    |---|---|---|

    | 1 | Kevin Yank | kevin@sitepoint.com |

    | 2 | Joan Smith | joan@somewhere.net |'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'What the above two tables show are three jokes and two authors. The AID column
    (short for "Author ID") of the Jokes table provides a relationship between the
    two tables (indicating that Kevin Yank submitted jokes 1 and 2 and Joan Smith
    submitted joke 3). Notice also that, since each author now only appears once in
    the database, and appears independently of the jokes he or she has submitted,
    we''ve avoided all the problems outlined above.


    The most important characteristic of this database design, however, is that, since
    we''re storing information about two types of "things" (jokes and authors), it''s
    most appropriate to have two tables. This is a rule of thumb that you should always
    keep in mind when designing a database: each type of entity (or "thing") that
    you want to be able to store information about should be given its own table.


    To set up the above database from scratch is fairly simple (involving just two
    CREATE DATABASE queries), but since we''d like to make these changes in a non-destructive
    manner (i.e. without losing any of our precious knock-knock jokes), we''ll use
    the ALTER command again. First, we get rid of the author-related columns in the
    Jokes table:


    ```

    mysql> ALTER TABLE Jokes DROP COLUMN AuthorName;

    Query OK, 0 rows affected (0.00 sec)

    Records: 0  Duplicates: 0  warnings: 0

    ```


    ```

    mysql> ALTER TABLE Jokes DROP COLUMN AuthorEMail;

    Query OK, 0 rows affected (0.00 sec)

    Records: 0  Duplicates: 0  warnings: 0

    ```


    Now we create our new table:


    ```

    mysql> CREATE TABLE Authors (

    -> ID INT NOT NULL AUTO_INCREMENT PRIMARY KEY,

    -> Name VARCHAR(100),

    -> EMail VARCHAR(100)

    -> );

    ```


    Finally, we add the AID column to our Jokes table:


    ```

    mysql> ALTER TABLE Jokes ADD COLUMN AID INT;

    ```


    If you prefer, the CREATE TABLE commands that will create the two tables from
    scratch are provided in 2tables.sql in the code archive (located at http://www.sitepoint.com/books/).


    All that''s left is to add some authors to the new table, and assign authors to
    all the existing jokes in the database by filling in the AID column. Go ahead
    and do this now if you like. This should give you some practice with INSERT and
    UPDATE queries.'
  merge: -1
  img_proc: true
- pgno: 82
  md: "# Dealing with Multiple Tables\n\nWith your data now separated into two tables,\
    \ it may seem like you’re complicating the process of data retrieval. Consider,\
    \ for example, our original goal: to display a list of jokes with the name and\
    \ email address of the author next to each joke. In the single-table solution,\
    \ you could get all the information you needed to produce such a list using a\
    \ single SELECT statement in your PHP code:\n\n```\n$jokelist = mysql_query(\n\
    \    \"SELECT JokeText, AuthorName, AuthorEmail FROM Jokes\");\nwhile ($joke =\
    \ mysql_fetch_array($jokelist)) {\n    $joketext = $joke[\"JokeText\"];\n    $name\
    \ = $joke[\"AuthorName\"];\n    $email = $joke[\"AuthorEmail\"];\n\n    // Display\
    \ the joke with author information\n    echo( \"<p>$joketext<br />\".\n      \
    \  \"(by <a href='mailto:$email'>$name</a>)</p>\" );\n}\n```\n\nIn the new system,\
    \ this would, at first, no longer seem possible. Since the details about the author\
    \ of each joke aren’t stored in the Jokes table, you might think that you’d have\
    \ to fetch those details individually for each Joke you wanted to display. The\
    \ code to do this would look like:\n\n```\n// Get the list of jokes\n$jokelist\
    \ = mysql_query(\"SELECT JokeText, AID FROM\n    Jokes\");\n\nwhile ($joke = mysql_fetch_array($jokelist))\
    \ {\n\n    // Get the text and Author ID for the joke\n    $joketext = $joke[\"\
    JokeText\"];\n    $aid = $joke[\"AID\"];\n\n    // Get the author details for\
    \ the joke\n    $authordetails = mysql_query(\n        \"SELECT Name, EMail FROM\
    \ Authors WHERE ID=$aid\");\n    $author = mysql_fetch_array($authordetails);\n\
    \    $name = $author[\"Name\"];\n    $email = $author[\"Email\"];\n\n    // Display\
    \ the joke with author information\n    echo( \"<p>$joketext<br />\".\n      \
    \  \"(by <a href='mailto:$email'>$name</a>)</p>\" );\n}\n```\n\nIt’s pretty messy,\
    \ and it involves a query to the database for every single joke that’s displayed,\
    \ which could slow down the display of your page considerably. With all this taken\
    \ into account, it would seem like the \"old way\" was actually the better solution,\
    \ despite its weaknesses."
  merge: -1
  img_proc: true
- pgno: 83
  md: 'Fortunately, relational databases like MySQL are designed to make working with
    data stored in multiple tables easy! Using a new form of the SELECT statement,
    called a "join", you can have the best of both worlds. Joins allow you to treat
    related data in multiple tables as if they were stored in a single table. Here''s
    what the syntax of a join looks like:


    ```

    mysql> SELECT columns FROM tables

    -> WHERE condition(s) for data to be related;

    ```


    In your case, the columns you''re interested in are JokeText in the Jokes table,
    and Name and EMail in the Authors table. The condition for an entry in the Jokes
    table to be related to an entry in the Authors table, is that the value of the
    AID column in the Jokes table is equal to the value of the ID column in the Authors
    table. Here''s an example of a join (the first two queries simply show you what''s
    contained in the two tables -- they aren''t necessary):


    ```

    mysql> SELECT LEFT(JokeText,20), AID FROM Jokes;

    ```


    | LEFT(JokeText,20) | AID |

    | --- | --- |

    | Why did the chicken | 1 |

    | A man walked into a | 1 |

    | Knock knock. Who''s t | 2 |


    3 rows in set (0.00 sec)


    ```

    mysql> SELECT * FROM Authors;

    ```


    | ID | Name | EMail |

    | --- | --- | --- |

    | 1 | Kevin Yank | kyan@attglobal.net |

    | 2 | Joan Smith | joan@somewhere.net |


    2 rows in set (0.00 sec)


    ```

    mysql> SELECT LEFT(JokeText,20), Name, EMail

    -> FROM Jokes, Authors WHERE AID = Authors.ID;

    ```


    | LEFT(JokeText,20) | Name | EMail |

    | --- | --- | --- |

    | Why did the chicken | Kevin Yank | kyan@attglobal.net |

    | A man walked into a | Kevin Yank | kyan@attglobal.net |

    | Knock knock. Who''s t | Joan Smith | joan@somewhere.net |


    3 rows in set (0.00 sec)


    See? The results of the third SELECT, which is a join, group the values stored
    in the two tables into a single table of results, with related data correctly
    grouped together. Even though the data is stored in two tables, you can still
    get all the information you need to produce the joke list on your Web page with
    a single database query.'
  merge: -1
  img_proc: true
- pgno: 84
  md: 'Note in the query that, since there are columns named ID in both tables, you
    must specify the name of the table when you refer to the ID column in the Authors
    table (Authors.ID). If you don’t specify the table name, MySQL won’t know which
    ID you’re referring to, and will produce this error:


    ```

    mysql> SELECT LEFT(JokeText,20), Name, Email

    -> FROM Jokes, Authors WHERE AID = ID;

    ERROR 1052: Column: ''ID'' in where clause is ambiguous

    ```


    Now that you know how to efficiently access the data stored in your two tables,
    you can rewrite the code for your joke list to take advantage of joins.

    The following is reproduced with complete error checking (which has been

    omitted here for brevity) in jokelist2.php in the code archive (located at

    http://www.sitepoint.com/books/).


    ```

    $jokelist = mysql_query(

    "SELECT JokeText, Name, Email

    FROM Jokes, Authors WHERE AID=Authors.ID");

    while ($joke = mysql_fetch_array($jokelist)) {

    $joketext = $joke["JokeText"];

    $name = $joke["Name"];

    $email = $joke["Email"];

    }

    // Display the joke with author information

    echo( "<p>$joketext<br />" .

    "(by <a href=''mailto:$email''>$name</a>)</p>" );

    }

    ```


    The more you work with databases, the more you’ll come to realize how

    powerful this simple ability to combine data contained in separate tables into

    a single table of results really is. Consider, for example, the following query,

    which displays a list of all jokes written by Joan Smith:


    ```

    mysql> SELECT JokeText FROM Jokes, Authors WHERE

    -> Name="Joan Smith" AND AID=Authors.ID;

    ```


    The results that are output from the above query come only from the Jokes

    table, but the query uses a join to let it search for jokes based on a value stored

    in the Authors table. There will be plenty more examples of clever queries like

    this throughout this book, but hopefully this example alone illustrates that the

    practical applications of joins are many and varied, and in almost all cases can

    save you a lot of work!


    # Simple Data Relationships


    The best type of database layout for a given situation is usually dictated by

    the type of relationship that exists between the pieces of data that it needs
    to

    store. In this section, I’ll examine the typical relationship types, and explain

    how best to represent them in a relational database.'
