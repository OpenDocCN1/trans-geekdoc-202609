  md: "7.4.13 of the MySQL Manual\n(http://www.mysql.com/documentation/mysql/commented/manua\n\
    l.php?section=Group_by_functions). Unlike other functions, which\naffect each\
    \ entry in the result of the SELECT query individually, summary\nfunctions group\
    \ together all the results and return a single result. In the above\nexample,\
    \ for instance, COUNT returns the total number of result rows.\n\nLet's say you\
    \ wanted to display a list of authors with the number of jokes they\nhave to their\
    \ names. Your first instinct (if you've paid attention) might be to\nretrieve\
    \ a list of all the authors' names and ID's, then use COUNT to count the\nnumber\
    \ of results when you SELECT the jokes with each author's ID. The PHP\ncode (without\
    \ error handling, for simplicity) would look something like\nthis:\n\n```\n//\
    \ Get a list of all the authors\n$authors = mysql_query( \"SELECT Name, ID FROM\
    \ Authors\" );\n\n// Process each author\nwhile ($author = mysql_fetch_array($authors))\
    \ {\n  $name = $author[\"Name\"];\n  $id = $author[\"ID\"];\n\n  // Get count\
    \ of jokes attributed to this author\n  $result = mysql_query(\n    \"SELECT COUNT(*)\
    \ AS NumJokes FROM Jokes WHERE\nAID=\"$id' );\n  $row = mysql_fetch_array($result);\n\
    \  $numjokes = $row[\"NumJokes\"];\n\n  // Display the author & number of jokes\n\
    \  echo(\"<p>$name ($numjokes jokes)</p>\");\n}\n```\n\nNote the use of AS in\
    \ the second query above to give a friendlier name\n(NumJokes) to the result of\
    \ COUNT(*).\n\nThis technique will work, but will require n+1 separate queries\
    \ (where n is\nthe number of authors in the database). Having the number of queries\
    \ rely on\na number of entries in the database is always something we want to\
    \ avoid (a\nlarge number of authors would make this script unreasonably slow and\n\
    resource-intensive!). Fortunately, another advanced feature of SELECT comes\n\
    to the rescue!\n\nIf you add a GROUP BY clause to a SELECT query, you can tell\
    \ MySQL to\ngroup the results of the query into sets that have the same value\
    \ in the\ncolumn(s) you specify. Summary functions like COUNT then operate on\
    \ those\ngroups -- not on the entire result set as a whole. The next single query,\
    \ for\nexample, lists the number of jokes attributed to each author in the database:"
