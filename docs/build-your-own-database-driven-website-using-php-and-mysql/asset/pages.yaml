    <p><input type=\"submit\" name=\"submit\" value=\"Submit\" />\n</p>\n</form>\n\
    ```\n\nAs we can see, a PHP script (`fileupload.php`) will handle the data submitted\
    \ with the form above. And, as you'd expect, a PHP variable named"
