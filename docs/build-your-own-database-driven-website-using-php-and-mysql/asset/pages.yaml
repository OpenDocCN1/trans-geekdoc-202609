- pgno: 26
  md: '# # Installing under Linux


    This section covers the procedure for installing PHP and MySQL under most current
    distributions of Linux. These instructions were tested under the latest versions
    of RedHat Linux and Mandrake Linux; however, they should work on other distributions
    such as Debian without much trouble. The steps involved will be very similar,
    if not identical.


    As a user of one of the handful of Linux distributions available, you may be tempted
    to download and install the RPM distributions of PHP and MySQL. RPM''s are nice,
    pre-packaged versions of software that are really easy to install. Unfortunately,
    they also limit the software configuration options available to you. If you already
    have MySQL and PHP installed in RPM form, then feel free to proceed with those
    versions, and skip forward to the "Post-Installation Setup Tasks" section. If
    you encounter any problems, you can always return here to uninstall the RPM versions
    and reinstall PHP and MySQL by hand.


    Since many Linux distributions will automatically install PHP and MySQL for you,
    your first step should be to remove any old RPM versions of PHP and MySQL from
    your system. If one exists, use your distribution''s graphical software manager
    to remove all packages with ''php'' or ''mysql'' in their names (mod_php is one
    that is often missed).


    If your distribution doesn''t have a graphical software manager, or if you didn''t
    install a graphical user interface for your server, you can remove these from
    the command line. You''ll need to be logged in as the root user to issue the commands
    to do this. Note that in the following commands, "%" represents the shell prompt,
    and doesn''t to be typed in.


    ```

    % rpm -e mysql

    % rpm -e mod_php

    % rpm -e php

    ```


    If any of these commands tell you that the package in question is not installed,
    don''t worry about it unless you know for a fact that it is. In such cases, it
    will be necessary for you to remove the offending item by hand. Seek help from
    an experienced user if you don''t know how. If the second command runs successfully
    (i.e. no message is displayed), then you did indeed have an RPM version of PHP
    installed, and you''ll need to do one more thing to get rid of it entirely. Open
    your Apache configuration file (usually /etc/httpd/conf/httpd.conf) in your favorite
    text editor and look for the two lines shown here. They usually appear in separate
    sections of the file, so don''t worry if they''re not together. The path of the
    libphp4.so file may also be slightly different (e.g. extramodules instead of just
    modules). If you can''t find them, don''t worry - it just means that the RPM uninstaller
    was smart enough to remove them for you.'
  merge: -1
  img_proc: true
- pgno: 27
  md: '```

    LoadModule php4_module modules/libphp4.so

    AddModule mod_php4.c

    ```


    These lines are responsible for telling Apache to load PHP as a plug-in module.
    Since you just uninstalled that module, you''ll need to get rid of these lines
    to make sure Apache keeps working properly. You can comment out these lines by
    adding a hash (#) at the beginning of both lines.


    To make sure Apache is still in working order, you should now restart it without
    the PHP plug-in:


    ```

    % /etc/rc.d/init.d/httpd restart

    ```


    With everything neat and tidy, you''re ready to download and install MySQL and
    PHP.


    # Installing MySQL


    MySQL is freely available for Linux from http://www.mysql.com (or one of its mirrors
    listed at http://www.mysql.com/downloads/mirrors.html). Download the latest stable
    release (listed as recommended on the download page). You should grab the Tarball
    version under Source downloads, with filename mysql-3.xx.xx.tar.gz.


    With the program downloaded (it was about 10.5MB as of this writing), you should
    make sure you''re logged in as root before proceeding with the installation, unless
    you only want to install MySQL in your own home directory. To begin, unpack the
    downloaded file and move into the directory that is created:


    ```

    % tar xfz mysql-3.xx.xx.tar.gz

    % cd mysql-version

    ```


    Next, you need to configure the MySQL install. Unless you really know what you''re
    doing, all you should have to do is tell it where to install. I recommend /usr/local/mysql:


    ```

    % ./configure --prefix=/usr/local/mysql

    ```


    After sitting through the screens and screens of configuration tests, you''ll
    eventually get back to a command prompt. Be sure the configuration completed successfully.
    If you see an error message just before the configuration quit, you''ll need to
    address the problem it''s complaining about. On Mandrake 8.0, for example, it
    complained of "No curses/termcap library found". I simply installed the libncurses5-devel
    package in Mandrake''s Software Manager, and the configuration worked fine on
    a second attempt. Once configuration is complete, you''re ready to compile MySQL:


    ```

    % make

    ```'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'After even more screens of compilation (this could take as long as a half an
    hour on some systems), you''ll again be returned to the command prompt. You''re
    now ready to install your newly compiled program:


    ```

    % make install

    ```


    MySQL is now installed, but before it can do anything useful its database files
    need to be installed too. Still in the directory you installed from, type the
    following command:


    ```

    % scripts/mysql_install_db

    ```


    With that done, you can delete the directory you''ve been working in, which just
    contains all the source files and temporary installation files. If you ever need
    to reinstall, you can simply re-extract the mysql-version.tar.gz file.


    With MySQL installed and ready to store information, all that''s left is to get
    the server running on your computer. While you can run the server as the root
    user, or even as yourself (if, for example, you installed the server in your own
    home directory), the best idea is to set up on the system a special user whose
    sole purpose is to run the MySQL server. This will remove any possibility of someone
    using the MySQL server as a way to break into the rest of your system. To create
    a special MySQL user, you''ll need to log in as root and type the following commands:


    ```

    % /usr/sbin/groupadd mysqlgrp

    ```


    ```

    % /usr/sbin/useradd -g mysqlgrp mysqlusr

    ```


    By default, MySQL stores all database information in the var subdirectory of the
    directory to which it was installed. We want to make it so that nobody can access
    that directory except our new MySQL user. Assuming you installed MySQL to the
    /usr/local/mysql directory, you can use these commands:


    ```

    % cd /usr/local/mysql

    ```


    ```

    % chown -R mysqlusr.mysqlgrp var

    ```


    ```

    % chmod -R go-rwx var

    ```


    Now everything''s set for you to launch the MySQL server for the first time. From
    the MySQL directory, type the following command:


    ```

    % bin/safe_mysqld --user=mysqlusr &

    ```


    If you see the message ''mysql daemon ended'', then the MySQL server was prevented
    from starting. The error message should have been written to a file called hostname.err
    (where hostname is your machine''s hostname) in MySQL''s var directory. You''ll
    usually find that this happens because another MySQL server is already running
    on your computer.'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'If the MySQL server was launched without complaint, the server will run (just
    like your Web or FTP server) until your computer is shut down. To test that the
    server is running properly, type the following command:


    ```

    % bin/mysqladmin -u root status

    ```


    A little blurb with some statistics about the MySQL server should be displayed.
    If you receive an error message, something has gone wrong. Again, check the hostname.err
    file to see if the MySQL server output an error message while starting up. If
    you retrace your steps to make sure you followed the process described above,
    and this doesn''t solve the problem, a post to the SitePoint.com Forums will help
    you pin it down in no time.


    If you want your MySQL server to run automatically whenever the system is running
    (just like your Web server probably does), you''ll have to set it up to do so.
    In the share/mysql subdirectory of the MySQL directory, you''ll find a script
    called mysql.server that can be added to your system startup routines to do this.


    First of all, assuming you''ve set up a special MySQL user to run the MySQL server,
    you''ll need to tell the MySQL server to start as that user by default. To do
    this, create in your system''s /etc directory a file called my.cnf that contains
    these two lines:


    ```

    [mysqld]

    user=mysqlusr

    ```


    Now, when you run safe_mysqld or mysql.server to start the MySQL server, it will
    launch as mysqlusr without your having to tell it to. All that''s left to do is
    to set up your system to run mysql.server automatically at startup.


    Setting up your system to run the script at startup is a highly operating system-dependant
    task. If you''re not sure of how to do this, you''d be best to ask someone who
    knows. However the following commands (starting in the MySQL directory) will do
    the trick for most versions of Linux!:


    ```

    % cp share/mysql/mysql.server /etc/rc.d/init.d/

    % cd /etc/rc.d/init.d

    % chmod 500 mysql.server

    % cd /etc/rc.d/rc3.d

    % ln -s ../init.d/mysql.server S99mysql

    % cd /etc/rc.d/rc5.d

    % ln -s ./init.d/mysql.server S99mysql

    ```


    1 Under the current SUSE distribution of Linux, there is no init.d directory,
    just a symbolic link pointing back to /etc/rc.d; symbolic links for startup files
    should thus be directed to the /etc/rc.d directory (e.g ln -s ./mysql.server S99mysql).'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'That''s it! To test that this works, reboot your system and request the status
    of the server as before.


    One final thing you might like to do for convenience''s sake is to place the MySQL
    client programs, which you''ll use to administer your MySQL server later on, in
    the system path. To this end, you can place symbolic links to mysql, mysqladmin,
    and mysqldump in your /usr/local/bin directory:


    ```

    % ln -s /usr/local/mysql/bin/mysql /usr/local/bin/mysql

    % ln -s /usr/local/mysql/bin/mysqladmin /usr/local/bin/mysqladmin

    /usr/local/bin/mysqladmin

    % ln -s /usr/local/mysql/bin/mysqldump

    /usr/local/bin/mysqldump

    ```


    # Installing PHP


    As mentioned above, PHP is not really a program in and of itself. Instead, it''s
    a plug-in module for your Web server (probably Apache). There are actually three
    ways to install the PHP plug-in for Apache:


    +   - As a CGI program that Apache runs every time it needs to process a PHP-enhanced
    Web page.

    +   - As an Apache module compiled right into the Apache program.

    +   - As an Apache module loaded by Apache each time it starts up.


    The first option is the easiest to install and set up, but it requires Apache
    to launch PHP as a program on your computer every time a PHP page is requested.
    This can really slow down the response time of your Web server, especially if
    more than one request needs to be processed at a time.


    The second and third options are almost identical in terms of performance, but
    since you''re likely to have Apache installed already, you''d probably prefer
    to avoid having to download, recompile, and reinstall it from scratch. For this
    reason, we''ll use the third option.


    To start, download the PHP Source Code package from http://www.php.net (or one
    of its mirrors listed at http://www.php.net/mirrors.php). At the time of this
    writing, PHP 4.x has become well-established as the version of choice; however,
    some old servers still use PHP 3.x (usually because nobody has bothered to update
    it). I''ll be covering the installation of PHP4 here, so be aware that if you
    still work with PHP3 there may be some minor differences.


    The file you downloaded should be called php-version.tar.gz. To begin, we''ll
    extract the files it contains:


    ```

    % tar xfz php-version.tar.gz

    % cd php-version

    ```'
  merge: -1
  img_proc: true
- pgno: 31
  md: "To install PHP as a loadable Apache module, you'll need the Apache apxs program.\
    \ This comes with most versions of Apache, but if you're using the copy that was\
    \ installed with your distribution of Linux, you may need to install the Apache\
    \ development RPM package to access Apache apxs. You should be able to install\
    \ this package by whatever means your software distribution provides. By default,\
    \ RedHat and Mandrake will install the program as /usr/sbin/apxs, so if you see\
    \ this file, you know it's installed.\n\nFor the rest of the install procedure,\
    \ you'll need to be logged in as the root user so you can make changes to the\
    \ Apache configuration files.\n\nThe next step is to configure the PHP installation\
    \ program by telling it which options you want to enable, and where it should\
    \ find the programs it needs to know about (like Apache and MySQL). Unless you\
    \ know exactly what you're doing, simply type the command like this (all on one\
    \ line):\n\n```\n% ./configure\n    --prefix=/usr/local/php\n    --with-config-file-path=/usr/local/php\n\
    \    --with-apxs=/usr/sbin/apxs\n    --enable-track-vars\n    --enable-magic-quotes\n\
    \    --enable-debugger\n```\n\nAgain, check for any error messages and install\
    \ any files it identifies as missing. On Mandrake 8.0, for example, it complained\
    \ that the 'lex' command wasn't found. I searched for 'lex' in the Mandrake package\
    \ list and it came up with 'flex', which it described as a program for matching\
    \ patterns of text used in many programs' build processes. Once that was installed,\
    \ the configuration process went without a hitch. After you watch several screens\
    \ of tests scroll by, you'll be returned to the command prompt. The following\
    \ two commands will compile and then install PHP. Take a coffee break: this will\
    \ take some time.\n\n```\n% make\n% make install\n```\n\nPHP is now installed\
    \ in /usr/local/php (unless you specified a different directory with the --prefix\
    \ option of the configure script above) and it'll expect to find its configuration\
    \ file, named php.ini, in the lib subdirectory (unless you specified a different\
    \ directory with the --with-config-file-path option of the configure script above).\
    \ PHP comes with two sample php.ini files called php.ini-dist and php.ini-optimized.\
    \ Copy these files from your installation work directory to the directory in which\
    \ PHP expects to find its php.ini file, then make a copy of the php.ini-dist file\
    \ and call it php.ini:\n\n```\n% cp php.ini* /usr/local/php/lib/\n% cd /usr/local/php/lib/\n\
    % cp php.ini-dist php.ini\n```"
  merge: -1
  img_proc: true
- pgno: 32
  md: 'You may now delete the directory from which you compiled PHP - it''s no longer
    needed.


    We''ll worry about fine-tuning php.ini shortly. For now, we need to make sure
    Apache knows where to find PHP, so that it can load the program when it starts
    up. Open your Apache httpd.conf configuration file (usually /etc/httpd/conf/httpd.conf
    if you''re using your Linux distribution''s copy of Apache) in your favorite text
    editor. Look for a line that looks like this:


    ```

    LoadModule php4_module lib/apache/libphp4.so

    ```


    Find the new, uncommented line (no # at the start of the line), not the old line
    that you may have commented out earlier. It may not appear along with the other
    LoadModule lines in the file. Once you find it, you might need to change the path
    to match all the other LoadModule lines in the file. Under RedHat Linux, this
    means you''ll have to change the line to make it look like this:


    ```

    LoadModule php4_module modules/libphp4.so

    ```


    PHP will probably run correctly without this change, but on older versions of
    RedHat, Apache won''t be able to find the libphp4.so file until you make this
    change. If you prefer, leave the line alone for now - you can come back and change
    it if you run into trouble.


    Next, look for the line that begins with DirectoryIndex. In recent distributions,
    this may be in a separate file called commonhttpd.conf. This line tells Apache
    what filenames to use when it looks for the default page for a given directory.
    You''ll see the usual index.html and so forth, but you need to add index.php,
    index.php3, and index.phtml to that list if they''re not there already:


    ```

    DirectoryIndex index.html ... index.php index.phtml index.php3

    ```


    Finally, go right to the bottom of the file (again, this should go in commonhttpd.conf
    if you have such a file) and add these lines, to tell Apache which file extensions
    should be seen as PHP files:


    ```

    AddType application/x-httpd-php .php .php3 .phtml AddType application/x-httpd-php-source
    .phps

    ```


    That should do it! Save your changes and restart your Apache server. If all things
    go to plan, Apache should start up without any error messages. If you run into
    any trouble, the helpful folks in the SitePoint.com Forums (myself included) will
    be happy to help.'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# # Post-Installation Setup Tasks


    No matter which operating system you’re running, once PHP is installed and the
    MySQL server is in operation, the very first thing you need to do is assign a
    "root password" for MySQL. MySQL only lets authorized users view and manipulate
    the information stored in its databases, so you’ll need to tell MySQL who is an
    authorized user, and who isn’t. When MySQL is first installed, it’s configured
    with a user named root that has access to do pretty much any task without even
    entering a password. Your first task should be to assign a password to the root
    user so that unauthorized users can’t mess around in your databases.


    It’s important to realize that MySQL, just like a Web server or an FTP server,
    can be accessed from any computer on the same network. If you’re working on a
    computer connected to the Internet that means anyone in the world could try to
    connect to your MySQL server! The need to pick a hard-to-guess password should
    be immediately obvious!


    To set a root password for MySQL, type the following command in the bin directory
    of your MySQL installation (include the quotes):


    ```

    mysqladmin -u root password "your new password"

    ```


    To make sure MySQL has registered this change, you should tell it to reload its
    list of authorized users and passwords:


    ```

    mysqladmin -u root reload

    ```


    If this command returns an error message to tell you that access was denied, don’t
    worry: this just means the password has already taken effect.


    To try out your new password, request that the MySQL server tell you its current
    status:


