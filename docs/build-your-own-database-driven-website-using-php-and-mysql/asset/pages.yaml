    This will execute the code inside the loop once for each item in the $cats array
    (you see where the foreach loop gets its name), and will assign the item for each
    loop to the variable $catID. Since this code is indisputably tidier than the equivalent
    while loop, we''ll settle on this as a solution. All that remains is to determine
