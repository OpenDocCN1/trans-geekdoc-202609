  md: "To fix the problem, we call setCookie before we print out the message:\n\n\
    ```\nsetcookie(\"visited\",\"1\",time()+3600*24*365); // 1 year\nif (!isset($visited))\
    \ { // First visit\n    echo(\"Welcome to my Web site! Click here for a tour!\"\
    );\n}\n```\n\nThis may seem wrong at first glance. If you've never worked with\
    \ cookies before, you might think that the welcome message will never be printed\
    \ out, because the cookie is always set before the if statement. However, if you\
    \ think back to the cookie lifecycle, you'll realize that the cookie isn't actually\
    \ set until the browser receives the Web page that's generated by this script.\
    \ So the cookie that is created by the setCookie line above won't actually exist\
    \ until the next time a page is requested.\n\nInstead of simply tracking whether\
    \ or not the user has visited before, you could instead track the number of times\
    \ they have visited. Here's the complete example with all the HTML tags (also\
    \ included in the code archive located at http://www.sitepoint.com/books/). Notice\
    \ how I've structured the document to ensure that setcookie happens before any\
    \ page content is output.\n\n```\n<?php\n$visits = $visits + 1;\nsetCookie(\"\
    visits\",$visits,time()+3600*24*365);\n?>\n<html>\n<head>\n<title> title </title>\n\
    </head>\n<body>\n<?php\nif ($visits > 1) {\n    echo(\"This is visit number $visits.\"\
    );\n} else { // First visit\n    echo(\"Welcome to my Web site! Click here for\
    \ a tour!\");\n}\n?>\n</body>\n</html>\n```\n\nBefore you go overboard using cookies,\
    \ be aware that browsers place a limit on the number and size of cookies allowed\
    \ per Website. Most browsers will start deleting old cookies to make room for\
    \ new ones after you have set 20 cookies from your site. Browsers also enforce\
    \ a maximum combined size for all cookies from all Websites, so an especially\
    \ cookie-heavy site might cause your own site's cookies to be deleted. For these\
    \ reasons, you should never store information in a cookie if your application\
    \ relies on that information being available later on. Instead, cookies are best\
    \ used for convenient features like automatically logging in a user. If the cookie\
