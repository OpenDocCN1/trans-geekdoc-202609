  md: '# The Novel in the Spanish Silver Age


    The relation between novel and lyrical poetry is more complex, as the large number
    of different labels proves: novela lírica, novela poética, novela poemática, poema
    en prosa, prosa-poética, etc. The closeness between these two genres was hypothetically
    an important feature of the late years of romanticism (Montesinos 1980, 139–42).
    Even if this imbrication could a more obvious form in the last decades of the
    silver age (avant-garde) than in the late 19th century (Ródenas de Moya 2000,
    89–90; Mainer 2009; Millares 2013, 235), the tendency is probably more visible
    after the turn of the century with modernism (Ródenas de Moya 2000, 80–81). For
    Mainer, the classic realist novel is replaced by a “densely poetic and profoundly
    introspective story” (Mainer 2009, 235, my translation). When talking about lyrical
    novels, the author Miró is often mentioned (Landeiro 1985, 117; Jiménez and Rodríguez
    Cáceres 1991; Lozano Marco 2002), but others such as Valle-Clín, Azorin, or Pérez
    de Ayala (Ródenas de Moya 2000, 81; Villanueva Nieto 1983).


