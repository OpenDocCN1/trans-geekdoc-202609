    # ## 2.3.5 Conclusions


    Genres and subgenres are cultural concepts with complex relationships between
    their main components: categories (labels), instances (texts), and features. Several
    models have been used or proposed to regulate the interaction between these components.
    The classic scholastic-structuralist model does not fit many of the characteristics
    of subgenres, while the family resemblance and prototype models have been proposed
    and only used in tempting ways. In addition, the fact that some subgenres are
    more similar to others has not yet found a proper formalization. Genres and subgenres
    can be analyzed from different perspectives: the longitudinal historical perspective,
    with a greater focus on the development of a few subgenres and the opinion of
    the authors, or the cross-sectional perspective, with a focus on many categories
    over a shorter period.


    Any researcher must decide whether they adopt a longitudinal or crosssectional
    perspective. A comprehensive analysis combining both is possible but would require
    an enormous effort in digitizing the texts and extracting their labels. The design
    of the reilation of the data and texts in this study uses a cross-sectional perspective.
    This is partially due to my interest and partially due to the current situation
    of the digitization of Spanish literature, which is acceptable in the decades
    between 1880 and 1920 but shows important deficiencies in earlier and later periods
    (see Section 3.1.9 and especially Figure 21).


    One of the goals of this research study is to observe how these different models
    and macro-models can fit the real data of the subgenres of the Spanish literature
    of this period, and which computational tasks can be applied. This will be done
    in Chapters 7.2 and 8. Aspects including hybridism, disagreement among sources,
    the multiplicity of labels for a single text, or'
