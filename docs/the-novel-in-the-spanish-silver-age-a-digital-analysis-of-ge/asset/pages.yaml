    Semantics is one linguistic layer that has escaped suitable formalization in NLP
    until recently. In the last years, several methodologies have been developed following
    the distributional hypothesis by Firth and condensed in the following attributed
    sentence: "You know a word by the company it keeps" (Eisenstein 2019, 334). In
    this area, specific approaches and specific technologies have been developed such
    as word embeddings (like wordvec, Mikolov et al. 2013) or latent semantic analysis
    (like topic modeling, Blei 2012). The theoretical advantages of distributional
    models are that these methods are language-independent, and do not require preexisting
    semantic tools as dictionaries.


    However, there are four notorious arguments against the implementation of these
    techniques for corpus. First, difficulties are encountered in properly evaluating
    these techniques. What exactly would be the "good topic" look like? Normally,
    there are several strategies for the evaluation of such model, such as intrinsic
    (comparison to previously annotated intuition, a costly process), extrinsic (application
    of the output for a further classification task, an indirect manner of evaluation),
    or the comparison between several distributional models (a method that can easily
    be criticized as being circular, Einstein 2019, 347–49). The second argument for
    rejecting these techniques is that they have been applied mainly to data sets
    that are much larger than CoNSSA. Its'
  merge: -1
  img_proc: true
