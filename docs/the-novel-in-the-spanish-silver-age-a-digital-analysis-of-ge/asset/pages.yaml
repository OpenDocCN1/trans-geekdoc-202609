  md: '# 5.1.5 Semantic Mapping of Labels, Description and Standardization trough
    Thema


    One of the reasons for the disagreement of the sources are the superficial variance
    of the labels, as is self-evident in the example of adventure novels, referred
    to multiple labels as acción y aventura, adventure, adventure novel, aventuras,
    de aventuras, or war-adventure. Another example is the naturalist novel, sometimes
    denoted with adjectives (naturalist), sometimes with substantives (naturalism)
    and in different languages (novela naturalista, naturalist novel). Other relations
    beyond the etymological root and are based on basic semantics, like novela de
    amor y novela romántica, or novela bélica, novela de guerra y novela militar.


    These labels have been extracted by the sources for now without further treatment.
    I call this token-labels. They are exactly as they were in the different sources,
    raw, without any linguistic treatment or interpretation. The problem is that all
    these sources worked with different goals, without using a shared frame, guidelines
    or palette. To enable the comparison, an adaptation is necessary. For this, I
    consider semantic-labels, which group the morphological, lexical and multilingual
    variances and do not express any semantic differences, and map to these token-label.


    In this manner, the meaning of each token-label is mapped to at least one semantic-label
    in Spanish to cover its meaning. In the case where the token-labels clearly refer
    to two semantic aspects (such as rural drama or humorist poetry), both are encoded
    as separate semantic-labels. I avoiding semantic specificity and I only simplify
    clear morphological, lexical and multilingual variety, in cases of doubt or where
    interpretation is needed. For example, it is argue novela de acción and de aventuras
    are part of the same genre or if they should be considered as different genres
    (other examples are sativa-humor or intriga-policiaca). In all these cases, I
    choose to model them as separate semantic-labels and to retain semantic precision.


    The result of this mapping is a new palette of semantic-labels composed of 110
    terms. This means a reduction of 57% of the size of the original palette of token-labels
    (which originally consisted of 256 strings), and yet still yields a ratio of 3.25
    texts for each different semantic genre. The distribution of the semantic-labels
    over assigned texts is similar to the token-labels seen before, only less skewed:
    While 112 token-labels were used for a single text, 33 semantic-labels are also
    hapax labels. On the other hand, the number of labels'
  merge: -1
