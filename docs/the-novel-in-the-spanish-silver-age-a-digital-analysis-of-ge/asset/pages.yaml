- pgno: 451
  md: '# The Novel in the Spanish Silver Age


    novel shows a relatively high specificity of features (standard deviation of z-scores
    of 0.51), higher than any of the values in the previous subgenres. It is composed
    by 83 texts (in CoNSSA, 50 in CoNSSA-canon). They are highly canonized (224 pages
    in the MdLE CoNSSA, 3.39 in CoNSSA-canon). The classification result is slightly
    higher than the ones previously seen, with a 0.83 F1-score.


    The following semantic features are overrepresented in this category: health (salud),
    negative interactions (desagradar, avergonzar, desobedecer, abusar, deshonrar),
    negative personal attributes (descortes, malo, inmoral, cinismo, cruel, desvergüenza,
    grosero), childhood (pequeño, travieso, niño), economy (propiedad), and others
    (esforzar, zaher, suello).


    However, the most specific feature for this group is not a linguistic one, but
    literary information: that the protagonist tends to lower classes of the society,
    with a z-score over three. Beside, the texts tend to have a clearly ending, the
    protagonist tends to be young and female, and the settings are typically in Spain
    or Europe (all these features have a z-score over one).


    Some of the texts are related to this category by a large proportion of sources
    are By Coloma, Cleopatra Pérez by Munilla, La espuma y Tristán ó el pesimismo
    by Valdés, los pazos de Ulloa de Bazán, or several works by Galdós (Miau, Mio
    prohibido, La Blangas, Fortunata y yacinta).


    Two subgenres show a great affinity to the naturalist novel: the realist (46%
    of shared texts and features) and the social novel (43%). After that, literary
    fiction (28%), educational (17%), and costumbrist novel (15%).


    The naturalist novel is a category that raises some doubts among many researchers
    when it is mentioned as an analysis as a literary subgenre. The fact that there
    is a period in many national literatures called naturalism can give the impression
    that the naturalist novel is not the same kind of category as the erotic or adventure
    novel. The analysis of this category in the different sections shows that this
    category is not dissimilar to the rest. It does show a preference for several
    decades, but so do other subgenres like the historical or erotic novel (see Section
    3.1.5). Besides, it does show literary characteristics as such a poor protagonist
    with a story ending sadly. Throughout the several steps that were analyzed in
    this research study, the naturalist novel behaves just as the rest of the categories,
    which are perceived as more typical subgenres of the novel.'
  merge: -1
  img_proc: true
- pgno: 452
  md: '# 11.8 Historical Novel


    The historical novel is in the middle range of centrality of the network (eigen-vector
    of o.18), with a relatively low specificity of features (standard deviation of
    z-scores of o.48). It contains 113 novels in CoNSSA, 59 in CoNSSA-canon. Its novels
    are relatively highly canonized, with 1.46 pages on the manual on average.


    The most distinctive feature, unsurprisingly, is a setting in the antiquity, followed
    by geographical settings in Italy or America, and a protagonist of the higher
    classes of society. An interesting aspect is that, even though the setting in
    Spain is not very distinctive for this subgenre, the references to Spain are.
    In other words, historical novels do not take place more often in Spain than the
