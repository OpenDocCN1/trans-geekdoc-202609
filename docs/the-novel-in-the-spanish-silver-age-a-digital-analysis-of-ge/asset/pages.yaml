- pgno: 137
  md: '# The Novel in the Spanish Silver Age


    sources has been kept in an attribute. Thus, the distant reading process can be
    traced back to the source of interpretation.


    Most of the descriptive information has been structured as discrete information
    into different elements. Many of these categories do not have a specific element
    in TEI yet, or the possibilities are clearly insufficient. A clear example is
    the information of the genre. The current TEI Guidelines give different options,
    one being the attribute @n (/profileDesc/textDesc/@n). This @n does not have any
    specific semantics (its normal use is a number, but it can contain other elements
    as). As I will explain in the following sections, the information about genre
    that I wanted to collect much more complex than a single value in an attribute.
    This is why the members of CLIG decided to use the element keywords in textClass.
    Each type of metadata can be encoded in a separate element, defining its class
    with the @type attribute. The structure of the metadata is controlled by tokens
    separated by a dot, making even similar metadata easy to understand and differentiate,
    like author.gender and text.characters.protagonist.gender. The metadata values
    are validated against a Schematron.


    In the corpus, every keyword element has been assigned with a @cert attribute
    with possible values:


    +   - High: In case I read the text.

    - Medium: In case I access an abstract (longer than a couple of paragraphs, containing
    the main information).

    - Low: All other cases.


    Depending on the analysis that I undertake, these values of certainty can be used
    to filter them, for example, ignoring the data from novels with a low level of
    certainty. ConSSA-canon, all texts have either medium or high certainty. Regardless
    of the general certainty of the keywords, any term can also have an individual
    @cert attribute, matching up exactly to specific information its degree of certainty.


    The metadata about setting, place, and protagonist of the text can be unknown
    for different reasons: Either the abstract does not contain the data, or the information
    is not available at all in the whole text. To illustrate the last scenario, I
    would like to explain one: in the novel Aventuras del submar alemán U, by Ricardo
    Baroja, the autodiegetic narrator does not mention his name. The first case of
    uncertainty (“I do not know it, but probably the information is in the text”)
    has been simply assigned with a question mark;;'
