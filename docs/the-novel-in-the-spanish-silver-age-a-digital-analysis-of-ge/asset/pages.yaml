    can be observed using only basic data such as the novels'' year of publication,
    and the length of the text in tokens. The ones of this period become statistically
    shorter, with this tendency being even more distinct in the canonical texts. That
    means, texts belonging to typical subgenres of the 19th century (such as realist
    or naturalist novels) are expected to be longer than the ones belonging to the
    end of the period (such as social or comedy novels). Besides the results about
    the data, this shows the strategy with the nested corpus: the two versions of
    the corpus used to evaluate a phenomenon, paying attention to whether it is observable
    only in the optimistic and bigger version, or also in the smaller, better controlled
