  md: '#  3.1.6 Definition of the Corpora: CoNSSA and CoNSSA-canon


    For now, several populations have been discussed and presented. The preparatory
    steps towards a reasoned creation of the corpus. A fundamental decision about
    the process is the relationship between the statistical population and the actual
    sample. The standard method in Statistics is random sampling, a process that selects
    from a given population by chance (Evans 1996, 197) to “maximize the sample’s
    chance of accurately representing the essential characteristics of the population
    [...] so that results and conclusions derived from the sample can be validly generated
    to the population” (Evans 1996, 22). On this random sample, the researcher can
    then use Inferential Statistics, “more advanced procedures than Descriptive Statistics]
    would enable us to generate from sample data to population characteristics” (Evans
    1996, 26). This method would require to randomly sample a specific number of texts
    from the population of novels the MLE, without considering whether these texts
    have already been digitized or not. To do that, projects would need to be able
    to digitize hundreds of texts, regardless of accessibility or difficulty, which
    is probably one of the reasons why sampling from a population is extremely rare
    in the Humanities (digital or not). That is also the reason why I cannot apply
    it in my research.


    The second strategy is to create a stratified corpus following the balance of
    the possible combinations of criteria in the statistical population (Schöch 2017a).
    This strategy requires to know the criteria that affect the object of study, describe
    them in the statistical population, and calculate the number of instances in each
    possible combination of the values. This would mean in my case the following steps:
    First, select a number of subgenera that should be studied. Second, obtain the
    subgenre levels of the entire population. Third, list the criteria that affect
    the object of study, the subgenre. Fourth, obtain these values for the whole population.
    Fifth, calculate the combination of these values (cells) and get their proportion
    (i.e., size in the entire population). Sixth, decide on a number for the size
    of the stratified sample. And finally, select (either randomly or in an opportunistic
    way) the texts that should populate the cells. There are several problems to implement
    this strategy in the case of my study: It is unclear which subgenera should be
    considered'
  merge: -1
  img_proc: true
