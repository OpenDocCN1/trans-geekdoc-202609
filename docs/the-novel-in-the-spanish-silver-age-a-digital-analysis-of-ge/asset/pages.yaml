  md: 'ble to silence the authorial cue. In this way, two different clusters of texts
    were found which cannot be explained by other categories like authorship, chronology,
    or previously assigned genres. In order to find out what the coherence of these
    groups, I ran a series of statistical tests, showing that both groups of texts
    can be defined through literary metadata and semantic features. Besides, further
    tests were carried out to find out whether they behave differently from other
    of categories: It turned out that they in fact behave very similarly to the others.
    Although it cannot be proven that they constitute subgenres, it was also impossible
    to prove the contrary. The better explanation for these groups is to consider
    them as subgenres, at least hypothetical ones, which have not been recognized
    as such until now. The labels I coined for these hypothetical subgenres are the
    mono-dialogue and the bucolic novel. This last category constitutes a particularly
    interesting case because it can be defined from all the important literary aspects
    of the action such as the setting, the narrator, and protagonist – strong signs
    to understand it as a subgenre. Of course, these should be revised by other scholars
    from a longitudinal diachronic perspective, observing closely why these groups
    of texts have not received a label until now. These analyses address the two sides
    of communication between the actors: On the one side, whether the writers of the
    texts of these clusters were aware of the similarities and knew they were writing
    alike and creating a new tradition; and on the other side, whether the public
    and critics perceived this similarity at the time and already understood these
    texts as a group.


