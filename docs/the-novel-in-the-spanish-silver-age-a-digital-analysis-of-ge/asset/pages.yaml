  md: '# 11. Empirical Description through the Tripartite Graph Model


    Works populating this category were written by Galdós, such as: Mendiz-bal, Luchana,
    Bodas reales, Narváez, O''Donnell, La vuelta al mundo en la «Numan-cia», Amadeo
    I, La Primera República, Cánovas, or la estafeta romántica.


    As expected, the most similar categories of this subgenre are the historical and
    the adventure novel, although the percentage of shared features and texts is lower
    than 7%. Besides, this number is shared with literary fiction, while the fantasy
    novel shares 6% of features.


    # 11.26 Poetic Novel


    Close to the limits of the network is the poetic novel, with an eigenvector cen-trality
    of 0.02 and a relatively high specificity of the features (standard deviation
    of z-scores of 1.56). The category is populated by only five texts, a number that
    is reduced to two when ConSSA is considered (that is why the following description
    is based only on ConSSA), but the texts have a high canonical status (1.88 pages
    on average in the native Mdle). For a category with few instances, it yields a
    low classification result of 0.80 F1-score.


    It is rather astonishing that the features that are most distinctive for this
    category are not linguistic, but literary information. More specifically, there
    is a distinct lack of definition of several fields caused by a general lack of
    plot or vagueness in the story, for example, regarding the type of setting or
    the id-entification of the protagonist. Beside, the narrator tends to be autodiegetic,
    the protagonist male and mature, and it has a negative ending, and the author
    is clearly repre-sented in the text. Section 3.2.5 to see how uncertain metadata
    was encoded.


    Nonetheless, many linguistic and textual characteristics are also very dis-tinctive,
    as vocabulary about feelings (enamorar, apasionar, ilusión, com-decer, pasar),
    personal characteristics (valiente, firme, dócil, insignificante), de-scriptions
    (desierto, parecer, espina), both (sangre, nervio), or negative vocabulary (injustificado,
    atorado, confundir). Beside, there are large proportions of chapter and sections.


    The five texts assigned to this category are Fay Antonio for Lorca, Amor de sacrificio
    by Carrere, Luis Álvarez Petreña by Aub, Crimen by Espinosa, and Platero y yo
    by Ramón Jiménez.


    This category shares only a few features and texts with any other category, being
    the closest mono-dialogue (7%), buolic, psychological, erotic, and mod-ernist
    novel (each time 6%).'
