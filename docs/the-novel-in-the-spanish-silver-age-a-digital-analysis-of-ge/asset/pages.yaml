  md: '# The Novel in the Spanish Silver Age


    with a heterodiegetic narrator. Many of these features are not explicitly mentioned
    by the monographs about the erotic novels that I have summarized in Section 2.1.8.
    However, some of the characteristics that they mention are confirmed in this analysis,
    like a middle-class female protagonist, urban settings, or trips. Other references
    to interior spaces, underwear, or female bodies do not stand out in my analysis.


    The texts most frequently assigned with this label are many by Trigo (Del frío
    al fuego, Mi media naranja, En la carrera), but also from other authors like Bacarisse
    (Los terribles amores de Agliberto y Cledonia), Picón (Dulce y sabrosa), or Serna
    (El gran hotel, La vida blanca y negra).


    The closest subgenre is the comedy (10% of shared texts and features), followed
    by others subgenres at around 5% and 6% (costumbrist, poetic, naturalist, fantasy
    novel).




    This one-author-labeled coined by Galdós (see Section 2.1.10) also has an eigen-vector
    of 0.03, and a relatively high specificity of the features (standard deviation
    of z-scores of 1.08), although not as high as the other similar labels: *novuela*
    and *greia*. In this corpus, this subgenre is populated by 11 texts. The texts
    are treated very briefly in the manual MdLE, occupying only a fifth of a page.
    The subgenre yields almost perfect classification (0.97 F-score). Because of its
    canonical status, this genre is not present in CoNSA-canon, and therefore its
    following description is only based on CoNSA.


    The most specific features of this subgenre are clearly linguistics, with semantic
    fields being overrepresented such as the transmission of information (*intigar,
    predecir, citar, enviar, recado, teléfono, recado, verdad*), social relations
    (*saprobrar, corregir, atravesar, imponer*), danger (*baquetear, atravesas, travesis*),
    politics and society (*ley, politica, herada, moda*) and others (*elemento, perseverar*).


    Literary features that are are related to the setting: The plots take to place
    in cities, trips through several continents, in boats, or in Spain, being typically
    realistic. However, some novels depict a non-existing world (especially the later
    works). The protagonists are normally adults from the middle class, the narrator
    is usually autodiegetic or the text is in epistolary form, and the ending is rather
    partially or clearly positive (with some neutral exceptions).'
