  md: 'plemented measures of keenness, stylometry tends to use Zeta, while Machine
    Learning uses the weights that some classifiers (for example, support vectors,
    logistic regression or decision trees) assign to the features. The question of
    how they correlate with each other, the parameters and their effects, how one
    is better for each task, and how they correlate to the human intuition of importance
    is being currently partially analyzed by other researchers (Schöch et al. 2018).
    In this section, I use the weight of classifiers to stay within the frame of Machine
    Learning for this chapter, and comprehend more deeply the effect of the coefficients
    in the frame of this parameter evaluation.¹


    I applied a logistic classifier since this is an algorithm that yields high results
    when classifying tasks with linguistic features (comparison to decision trees
    that tend to over-fit with many interval features) and assign weights to every
    feature (comparison to support vector machines). Other researchers, such as Underwood,
    have used the coefficients of this algorithm as a metric for the importance of
    each feature for the classification of each genre (Underwood 2014; 2016) or for
    other tasks (Rahat and Talebpour 2018). The matrix of features contains those
    that showed results in the previous Section 6.1.2 – linguistic annotation and
    TEI-tags, with their frequencies relative to the number of tokens per text and
    log transformed, the 3,000 most frequent features (parameters that are in the
    most successful, as will be shown in the Section 6.4). The classifier is applied
    to every subgenre in binary form, with a bootstrap step of 100 iterations. From
    these iterations, the mean coefficient assigned by the algorithm to each feature
    was obtained. The resulting output is a data frame with the 23 subgenres as rows
    and columns, with negative and positive values (in this case -0.27 and 0.30),
    expressing whether the presence of a feature is used by the classifier as a cue
    to predict positive or negative category (i.e. whether the text belongs to the
    genre or not). For example, the word Madrid has a coefficient of -0.13 for the
    philosophical novel, while its coefficient is 0.24 for the realist novel. This
    means that if the word Madrid appears in a text, the classifier will tend to consider
    it a realist novel and not a philosophical one.


    In other sections, especially in Chapter 8, I argue for the adoption of other
    measures, such as z-scores, because of their simplicity, lack of parameters, and
    intuitive metric expressed in standard deviations. In this chapter, since z-scores
