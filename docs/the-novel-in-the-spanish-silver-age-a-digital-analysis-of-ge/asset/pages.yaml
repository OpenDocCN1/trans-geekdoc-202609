  md: 'features of all subgenres (standard deviation of z-scores of 0.28). It contains
    190 novels in CoNSSA, 94 in CoNSSA-canon. The novels are, unsurprisingly, highly
    canonized, with 1.64 pages in the manual on average. All this explains a low classification
    result of 0.75 F1-score.


    The strongest feature of this subgenre be a protagonist of lower classes of the
    society, followed at a distance by setting in France, and, surprisingly, that
    the story does not reflect the author''s life. From the linguistic perspective:
    communication (criticar, discurso, oratoria, charlay), money and work (ajtrear,
    bien, propiedad, encargar, función, pagral, soberano, rey, linaje), and other
    fields (familia and negations) are distinctive.


    Publishers use this label to assign several texts by authors like Baroja (Mala
    hierba, la busca), Valle-Inclín (Baza de espadas, la media noche), Gáldos (El
    doctor Centeno, Lo prohibido), Azorin (Mías Rueda), and Unamuno (Paz en la guerra).


    The most subgenres are the two most central genes: the realist (59% of shared
    features texts) and the social novel (56%).


    # 11.5 Educational Novel


    The next subgenre is the educational novel, with an eigenvector centrality of
    0.22. It contains 70 texts in CoNSSA, 39 in CoNSSA-canon. These are highly canonized,
    with an average of 1.66 pages in the manual (2.35 for CoNSSA-canon). The specificity
    of the features is the lowest (standard deviation of z-scores of 0.36), which
    in general explains a poor classification result, also in the fifth position with
    a 0.79 F1-score.


    The most distinctive features are a child or very young protagonist at the beginning
    of the text, and a rather long chronological span of the action. The mix of values
    in several metadata features are also noticeable literary features, such as the
    change between rural and urban spaces, and different narrators. As far as linguistic
    features are concerned, voluntary institutional education (colegio, escuela, universidad,
    enseñar, estudiar, convento), family (familia, padre, linaje), life (emprender,
    alojar, prosero, crear), or typical Spanish themes (España, cuento, torno). Beside,
    the semicolon and a larger proportion of parts (groups of chapters) are overrepresented.


    The clearest examples are El jardín de los frailes by Azaña, El teroro Caracho
    by Serna, Genio y figura... by Valera, several works by Pérez de Ayala (La pata
    de la raposa, A. M. D. G.) or Baroja (El árbol de la ciencia, Camino de perfección).'
