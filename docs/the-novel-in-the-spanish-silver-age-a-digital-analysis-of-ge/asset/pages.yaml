- pgno: 27
  md: '# The Novel in the Spanish Silver Age


    However, the ultimate goal of this research is not only to apply methods on genre,
    but to produce a single computational model that summarizes the most important
    characteristics of literary genres. For this model, I will use graph technologies,
    which will be presented, evaluated, and discussed in Chapter 8. This model is
    a formal alternative to the scholastic model for genre. To obtain it, the core
    ideas of prototypes and family resemblance are implemented to define the interaction
    between text instances, genre categories, and features. The model will be created
    following an inductive process, i.e. by gathering the observations of each genre.
    Different intuitive interpretations of the relative positions of the texts and
    genres in the graph-based model will be hypothesized and evaluated. Besides, the
    similarity of genres can be measured. The model offers further possibilities,
    such as calculating whether there are groups of genres (macro-genres) in the form
    of communities. Finally, the model will be used to produce empirical descriptions
    about each subgenre of the novel, with a comprehensive list in the Appendix.


    To summarize, the ensemble of research questions outlined above leads to structure
    of eight main parts, each composed of one or more chapters. This introduction,
    a second part tackles the question about previous research in several fields:
    Literary Studies on the period (Chapter 2.1), computational research on genre
    (Chapter 2.2), and theory of genre (Chapter 2.3). The third part describes the
    corpus (Chapter 3.1), its metadata (Chapter 3.2), and the processing of genres
    through classification (Chapter 3.3). The fourth part describes the linguistic
    annotation (Chapter 4.1), and different ways of transforming the texts: quantitative
    features (Chapter 4.2). The fifth section deals only with analysis of the labels:
    a comparison of the institutions (Chapter 5.1), the accuracy of the labels at
    the first publication (Chapter 5.2), and the specific label of *literary fiction*
    (Chapter 5.3). The sixth part asks specific questions about the analysis, more
    specifically an evaluation of the parameters (Chapter 6.1) and the possibility
    that some genres have remained hidden until now (Chapter 6.2). The seventh part
    contains a series of analyses of classification, looking at different ways of
    applying it (Chapter 7.1), and an analysis of why there is variance in the results
    (Chapter 7.2). Finally, the eighth part discusses the graph model for genre, which
    will be used in the Appendix for empirical descriptions of all the analyzed subgenres
    of the novel.


