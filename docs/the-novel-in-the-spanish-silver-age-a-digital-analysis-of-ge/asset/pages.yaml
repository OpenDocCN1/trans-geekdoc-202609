    # 3.2.6 Author’s Metadata


    Apart from his or name, general information such as gender, year of birth and
    death, etc. has been gathered about each author. After collecting the BNE identifiers,
    it has also been possible to obtain further metadata such as the place of birth
    and death of each author from Wikidata (through Linked Open Data).


    Two types of information about the relation between author and text have been
    collected:


    +   * **Author-text group**: Many authors of this period published some of their
    works under a shared label. The texts within these groups tend to share facets
    than the rest of the production, like protagonists, settings, topics, periods...
    Some famous examples are the *Sonatas* by Valle-Inclán, *Novelas contemporáneas*
    by Galdós, *La raza* by Baroja. The labels of these groups were often printed
    as a part of the title, or were assigned by the history of literature.

    * **Author-text relation**: The MdLE informed in many cases if (and to what extent)
    the text reflects the author’s life. Because this is a defining feature of genre
    (autobiography) and subgenre (autobiographical novel), this information (always
    from the MdLE) was collected with four ordinal possible values: none (default),
    low, medium, and high.


    # 3.2.7 Text and Genre Metadata


    As mentioned before, genre and subgenre categories are more complex than others
    like authorship or periodization. It is absurd to dispute whether a protagonist'
  merge: -1
  img_proc: true
- pgno: 139
  md: 'existed or not, and there are few cases in which the existence of a person
    is discussed. In contrast, the discussion of the status of many genres and subgenres
    is commonplace. While the boundaries of people and years are obvious, it is debatable
    whether subgenres have boundaries at all. Although a text can technically either
    belong to several authors (for example in case of multi-authorial texts) or to
    different years, these are rarer exceptional cases. Contrary to that, texts blending
    various subgenres are rather the norm (see 2.3.3 for a discussion about the macro-models
    of genres).


    The method of encoding information of genre has to be able to capture this complexity.
    For that, I have defined numerous levels (genre, subgenre) and sources (cover,
    history of literature, printing houses), some of them hierarchically:


    +   * Super-genre: A general label about whether the text is prose (regardless
    of specific genres such as short-stories or novels) or other. This value was assigned
    to mix if the work has entries of poetry.


    +   * Genre: General information about the main genre; the great majority are
    novels (in Spanish novela), but this information can differ in the case of the
    14 texts with unknown first genre or the egregerias, which will be analyzed in
    Chapter 3.3.


    +   * Subtitles: Part of the title or subtitle represents some kind of group of
    texts (novela, memorias, historia, novela de costumbre...), with a total of 47
    different values.


    +   * Subtitle from BNE: Very similar to the previous one but considering all
    the information of the catalog of the Spanish National Library (64 different values).


    +   * Subgenre from History of Literature: The labels that the two histories of
    literature have assigned to the texts (78 distinct values in the MdLe, 34 in the
    HdLe). Some examples: novela naturalista, novela histórica, novela social, novela
    autobiográfica…


    +   * Subgenre from editors and users: Labels that printing houses (crawled from
    Amazon) or digital projects (such as ePubLibre) have used to categorize the texts.


    +   For example, an author who started writing a text when she or he was young.
    She or he finished the first version after a couple of years, she or he published
    the work with changes several years later and made a new version of it at the
