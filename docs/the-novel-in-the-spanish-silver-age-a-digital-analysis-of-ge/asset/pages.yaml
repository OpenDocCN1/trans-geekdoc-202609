- pgno: 222
  md: '# Evaluation of Consistent Subgenres




    The source and the palette of the labels of genres and subgenres represent a major
    challenge for different reasons. Labels like *novela épica* and *novela de guerra*
    (''epic novel'', ''war novel'') can be understood as synonyms. A war novel can
    be labeled a historical novel, while many historical novels are labeled as war
    novels, i.e. they can be understood as part of a taxonomy (see Section 2.3.3.1).
    Each source (manuals of Literary Studies, printing houses, catalogs, manuals,
    editorial projects) applies its own set of labels for their specific purposes,
    making it difficult to compare data. In other words, irregularity and scarcity
    are common in the information I want to use as categories. The question arises:
    Which labels should be used for classification?


    To answer that, several sources of information (manuals of literature, catalogs,
    metadata from printing houses, own annotation) have been gathered. Four specific
    questions will be responded to in this chapter: 1) Which labels can be understood
    as synonyms? 2) If the different sources are understood as annotators, how close
    are they to each other? 3) Can the subgenres be expressed in a standard way (through
    multilingual standard schemata)? 4) And, most importantly, which labels can be
    understood as being consistent among different sources?




    As observed in Chapter 2.2 about the computational analysis of genre, each research
    project has adopted a source of labels (metadata from the corpus, publishers,
    manuals, own annotation), but without without further explanations of whether
    this is the best reference, and without any reassurance concerning'
  merge: -1
  img_proc: true
- pgno: 223
  md: '# The Novel in the Spanish Silver Age


    the reliability of the labels. No project used labels from several sources and
    only two dealt with the problem of whether different annotators or sources would
    label text in a consistent way, with the result that both of them achieved a general
    agreement of around 50% (Berninger, Kim, and Ross 2008; Santini 2011). These publications
    suggest that using a single reference for the labels is highly questionable. Any
    researcher involved in the process of annotating this information is aware of
    the uncertainty and subjectivity of many of the assignments.


    For this reason, I have collected the information on the genre of each text from
    a number of sources. These represent diverse traditions and aims about genre labeling,
    and all of them have been used in previous computational research on genre. The
    majority of the references marked the texts many decades after their first publication
    (with the exception of the information on the cover, which will be treated more
    carefully in Chapter 5.2), therefore this data set cannot be applied to a historical
    analysis. These sources were not collected following opportunistic criteria, rather
    to represent distinct areas that make use of genre labeling: publishers, researchers
    in the history of literature, communities of readers and own annotation. The exact
    sources are:


    +   Genre of the subtitle: This is the digitized text when its subtitle (sometimes
    its title) contains any reference that can be understood as a genre: episodio
    nacional, historia, novela, de costumbres, memoria, etc. These have been extracted
    manually, either from the title of the text or from the cover of the digitized
    document.

    Genre of subtitles at the Spanish National Library (BNE): The different historical
    editions could change their subtitles over time. For example, in different editions,
    Los marcos de Cádiz by Valdés was labeled as a historical or a costumbrist novel.
    Using the textual identifiers of the BNE, all the titles were queried through
    SPARQL, and the labels were manually extracted from this output. In the majority
    of cases, the source should overlap with the previous one, and in fact they could
    have been made out as a single source. Reason why I am keeping them apart is to
    evaluate them separately. Another reason is to obtain knowledge for other researchers
    to use whether it is sufficient to gather the information from the digitized text
    or not and if there are advantages in querying national libraries for this information.'
  merge: -1
  img_proc: true
