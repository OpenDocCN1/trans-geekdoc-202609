  md: '# 7.1 Classification of the Subgenres


    After collecting (Chapters 3.1 and 3.2) and filtering the data (Chapter 3.3),
    extracting features (Chapters 4.1, 4.2, and 6.1), and defining the categories
    (Chapters 5.1, 5.2, 5.3, and 6.2), all the necessary information is now available
    to use supervised Machine Learning techniques to classify subgenres of the novel.
    As discussed in Chapter 2.3 about theory of genre, there are different models
    and macro-models to understand the relationships between instances (texts), categories
    (subgenres) and features. The two chapters of this part address the following
    questions:


    Chapter 7.1: How will the subgenres be classified? Do the results score above
    the baseline and how high are they?


    Chapter 7.2: The classification always yields better results for subgenres than
    for others. Why is there variance in the results? What are the variables that
    explain this?




    In this chapter, I will show how the different models of subgenre can be memorialized
    in different supervised computational tasks. The goal is to understand what the
    advantages and disadvantages of each are, as well as what the implications of
    each are with respect to the theoretical model of subgenres. Important aspects
    include the specific form in which the labels are required, whether these forms
    mean an elimination of information, and so, how strong this is. Specifically,
    I will apply a multi-class and multi-label classification, a classification of
    chapters, a classification using metadata as features, and finally I will determine
    the probabilities of the classification on a numerical scale and compare this
    to the proportion of labels by several sources.'
