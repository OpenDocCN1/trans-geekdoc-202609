- pgno: 368
  md: '# 8. Discussion of Tripartite Graph for Genre




    The previous chapters of this research study have focused on a single aspect of
    genres, either in summarizing previous research, presenting data, or analyzing
    specific questions. In contrast, the goal of this chapter is to combine the most
    important findings into a single model for genre. As Raible states in his article
    about literary genres:


    +   We work neither in the area of our sensory perception, nor in what we call
    originals, which in their diversity would not be conceivable, but rather with
    models of these originals. A model, like a map of a city as opposed to the original
    "city," is created through reproduction and reduction. Certain features from the
    original "city" will be emphasized as relevant in the map, others disappear. (Raible
    1980, 322, my translation).


    Following this author, my goal in this chapter is to present not the city, but
    a map of the city; I do not represent the "genres" here, but a model for them,
    explaining how this is composed and what it can be used for. The theoretical model
    for genre unifies core ideas of family resemblance and the prototype theory (discussed
    in Chapter 2.3), which have been already mentioned in the works of scholars working
    on genre (Fricke 2010a; Santini 2021; Hempfer 2014; Underwood 2016; Henry-Krahmer
    et al. 2018; Schröder 2019).


    However, what are the characteristics that a scientific model (a reduced representation
    of an analyzed object) should fulfill? The philosopher of science Weisberg (cited
    by Zweig 2016, 366) distinguishes two main components: the structure (or formalization)
    of the model (2013, 24–31) and the *construal* component (39–42). In Section 8.3
    I will argue for graphs as the formalization of this model. Related to the construal
    component of a scientific model, Weisberg differentiates three parts:'
  merge: -1
  img_proc: true
- pgno: 369
  md: '+   1. The assignment: the mapping between the elements of the model and the
    real object.

    2. The intended scope: the application of the model.

    3. The fidelity criteria: measurable principles that should answer whether the
    model is a good representation of the complex system.


    Following Weissberg, the model presented here is composed as follows:


    +   1. The *assignment of the model* will be based on seven observations made
    in the different chapters of this book, which I will summarize in Section 8.2.
    These observations are operationalized in the components of the genres (features,
    instances and categories, see Section 2.3.2 for a theoretical discussion) and
    their interaction. This will be assembled in Section 8.3.

    2. The *intended scope* of the model can be decomposed into four aspects: First,
    to fit several observations about the entire corpus into a single model. Second,
    to reproduce several observed effects, as the variance of the classification results
    (discussed in Chapters 7.1 and 7.2). Third, to quantify and operationalize, through
    the mathematical properties of the networks, certain expectations about genres,
    particularly the macro-model of subgenres (Is a subgenre another type of subgenre?
    Are they merely similar? Do overlap? See Section 2.3.3 for a theoretical overview).
    This will be observed in Section 8.6 Ultimately, the model will be used as the
    basis for empirical descriptions of subgenres (Section 8.7 and Appendix).

    3. The *fidelity criteria* of the model will be presented in Section 8.5 as an
    evaluation of whether the model can reproduce the similarity and the classification
    results with statistical significance.


    # 8.2 Characteristics of the Genres


    To construct this model, I follow Wittgenstein''s inductive suggestion of observing
    the characteristics of the analyzed phenomenon: “Don’t think, but look!” (Wittgenstein
    2013, 366e). In this publication, I observe the following aspects relating to
    subgenres:


    +   1. Several human agents (such as authors, printing houses, libraries, researchers)
    assign genre labels to texts. The way these are encoded'
  merge: -1
  img_proc: true
- pgno: 370
  md: '# 8. Discussion of Tripartite Graph for Genre 371


    has been presented in Chapter 3.2, compared in Chapter 5.1, and closely analyzed
    in Chapters 5.2 and 5.3. In addition, in Chapter 6.2 I have used clustering techniques
    to discover two hypothetical subgenres until now.


    +   2. A text can belong any number of genres: one, several, or even none, as
    shown in Chapter 5.1. This fact is at the core of the zero-to-multi genre classification
    scheme of Santini (2011).


    +   3. Some texts belong more clearly to one genre than to others. This can be
    observed in different ways: the recurrent mentioning of specific works as classic
    examples of a category by previous researchers (see Chapter 2.1), in the fact
    that some texts are related to some categories by a larger portion of human sources
    (Chapter 5.1), or in the probabilities assigned by algorithms (Section 7.1.6).
    In other words, the prototype genre (Rosch 1975) can describe how texts participate
    in categories.


    +   4. Texts can be described using their specific internal features, as shown
    for example in Chapter 4.2. In some texts, specific linguistic, textual, or literary
    features are more dominant than in other texts.


    +   5. These internal features can be used to classify texts into genres. They
    can be of a linguistic (Chapter 4.1 and Section 7.1.3) or literary nature (Chapter
    3.2), or a combination of both (Section 7.1.5). The classification results are
    clearly better than what would be expected in a random process, as seen in Chapters
    6.1 and 7.1. In other words, internal features do play an important role in the
    genres. This is the premise for the computational analysis of genres and subgenres,
    summarized in Chapter 2.2.


    +   6. However, the results of the classification are rarely perfect, both in
    my own and previous research. There is no evidence that the texts of a category
    have to share a set of necessary and sufficient conditions (Chapter 7.1), as the
    scholastic model requires (Section 2.3.2.1). The features that are overrepresented
    in a novel could be not specific to their category, or could be specific cues
    for other categories. This is the core of the prototype family model (Wgenstein
    and Schulte 2013, discussed in Section 2.3.2.4), in which a member of a family
    does not have to share the traits of the family and may actually show some traits
    that are related to other families.


    +   7. Genres are not isolated phenomena. Some genres show greater similarity
    than others, for example naturalist and realist novels. This can be observed in
    previous research, which tends to relate specific categories like adventure and
    historical novels (see Chapter 2.1.). Certain hypothetical similar-'
