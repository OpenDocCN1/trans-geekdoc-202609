    # ### 5.1.6 Analysis of Inter-Source Agreement


    The fact that two sources employ the same semantic-label does not imply that they
    assign it to the same texts, that they consider the same extension of the category.
    Two manuals of Spanish literature might understand what an erotic novel could
    be in a completely different way, and therefore use the label for disjointed or
    partially overlapping sections of the corpus. Accepting the several sources is
    discussed in the research, for example, whether the labels of the covers are considered
    as subgenres for a further analysis (Bortrel 2001, 38–45). If this is the case,
    I expect the covers to assign dissimilar information to the rest of the sources.'
