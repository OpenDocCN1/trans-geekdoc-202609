    # 3.2.5 Descriptive Metadata


    As I have stated, I consider descriptive metadata those who represent a categorization
    of the text considering its internal characteristics. For example, the fact that
    some sources have labeled a novel as historical novel, or the recognition of a
    first-person narrative (autodiegetic narrator). Besides the labels for the subgenres,
    descriptive metadata have been selected because they are either listed by the
    history of literature as distinctive features of a subgenre, for example, Section
    2.1.8 about erotic novels, different scholars pointed out some typical phenomena
    of this subgenre, such as middle-class female protagonists in urban contemporary
    settings. To test if these features really differentiate this subgenre from the
    rest of the novels, the researcher would need to select the protagonist, examine
    their gender and social class and define the temporal and geographical space (for
    example, Madrid needs to be identified as a city). Finally, the researcher is
    in the position to compare these descriptive data against others. Similar examples
    will be given in the following sections and fully implemented in Chapter 8.


    An important aspect for the gathering of the remaining information is a summary
    of the novel, which has been placed in the element abstract. It contains a short
    summary of the plot and its story is to give an overview of the entire text. These
    have been either written by myself after reading the novel, or they have been
    typed or copied from external sources, such as the MdLE, Wikipedia, or ePubLib.
    An explicitly reference to these'
