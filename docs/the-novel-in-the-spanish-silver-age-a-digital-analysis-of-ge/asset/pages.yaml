    # 5.3.5 Conclusions


    Does literary fiction behave like other subgenres or is it a phenomenon with a
    distinct nature? In this chapter, I have carried out several tests to observe
    its characteristics. If a book is considered part of literary fiction, it tends
    to be assigned by such various publishers, which is a positive sign of agreement
    among publishers. Literary fiction is predictable to a certain degree linguistic
    features, with outcomes slightly under average and within the range of the other
    subgenres. Furthermore, it does not behave like a random category: Its prediction
    accuracy is clearly above the random baseline. Literary fiction also does not
    rely heavily on external data than many other subgenres, with results slightly
    above average and similar to many other genre-labels. In fact, the greatest surprise
    of this chapter is to observe how literary fiction is to the rest of the subgenres:
    It never stood out in any of the different tests, its results were neither an
    outlier, and were neither better nor worse but rather behaved very similarly to
    the rest of the subgenres.


    If so, why Literary Studies ignored this label? Why do we have to take it from
    publishers, who mark books extensively with it? My explanation is that Literary
    Studies have mainly used literary fiction as a criterion of its object of study.
    What are we analyzing? The researchers in the field observe mainly sections of
    literary fiction: We mostly remain in the canon, either with a greater or narrower
    definition of it. The exceptions to this focus on non-literary fiction: the analysis
    of 21st-century fan fiction, pulp magazines, Heftroman (in the German-speaking
    area), literatura de kiosco (in the Spanish one), etc. An article can deal with
    literary fiction (the great majority in Literary Studies) or with non-literary
    fiction, but it normally does not combine both. It is not a variable in our corpora,
    it is a constant. Either all works of my collection are literary, or all of them
    are not. Literariness is a frontier in our field. Normally'
