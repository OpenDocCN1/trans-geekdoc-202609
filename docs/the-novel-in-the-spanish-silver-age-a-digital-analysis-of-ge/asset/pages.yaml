  md: '# 5.3.2 Description of Literary Fiction


    The publishers assigned three labels related to literary fiction in Spanish to
    my corpus: ficción clásica (136 novels), ficción contemporánea (86), and novel
    y literatura (1). In general, there is a great overlap between these different
    labels, with the concept of the label ''classic'' being especially frequent in
    the works published in the 1880s and the 1890s. This means the labels and the
    way they were allocated by the publishers do not correspond to different meanings,
    but are just a matter of chronological distribution: ficción clásica for the earlier
    works, ficción contemporánea for the later works. This complementary chronological
    distribution maps the taxonomy of Thema that I have mentioned previously (codes
    FBA and FBC). Since I do not consider several subgenres on their period of publication
    in other subgenres, I decide to follow the taxonomy of Thema and use the category
    hanging a step above, which is Fiction: general & literary (FB). But instead of
    using this specific label, I decide to rather use the shorter term literary fiction
    because it can be related to


    The first question I want to focus on is whether this label is assigned with a
    minimal homogeneity between publishers and, furthermore, to compare to the other
    labels. To do so, I cannot use the methodology applied in Chapter 5.1 comparing
    different sources, the term literary fiction was allocated by what I considered
    a single source: the publishers on Amazon. In this case, I am not interested in
    knowing whether Amazon and the manuals agree on the way they use the label literary
    fiction, or whether several publishers agree on this label for a given work. In
    contrast, in Figure 60 I calculate the frequency of the label in different sources
