- pgno: 406
  md: '# 9. Conclusion


    As mentioned in the introduction, genres are constantly used either to define
    research objects (in academic circles) or to structure cultural products (libraries,
    bookstores, digital platforms). However, specific questions about the abstract
    principles of genres, their realization in specific periods and languages, or
    the particular definitions of categories find little consensus. In other words,
    society agrees on the utility of genres, but disagrees on how to exactly model
    these categories.


    In this research study, I answered in each chapter one main research question
    about genre. For this, I have taken literary works of the challenging period of
    the Spanish epoch, the so-called silver age (1880-1939), in which many authors
    explicitly tried to escape the classic genres and subgenres. Independently of
    the specific epoch, it has to be considered that, apart from the papers and contributions
    originating from the CLIGS project, Spanish literature has received little attention
    from quantitative approaches concerning genre. For the analysis, I have chosen
    a series of computational techniques, mainly supervised but also unsupervised
    Machine Learning methods, as well as graphs for the final model. In this conclusion,
    I summarize the answers obtained throughout this research study to the five main
    questions raised in the introduction, setting limitations and possible future
    paths.


    I would like remind readers that this research is highly interdisciplinary. It
    is rooted in the Digital Humanities, but also considers theories, data, and methodologies
    from Literary Studies, Computer Science, and Linguistics. Although interdisciplinarity
    seems highly attractive nowadays, it comes at a price: One researcher is never
    able to delve into the different disciplines as much as they would when working
    in a single field. For this reason, I consider this book as one research step,
    to be continued in the best case by research performed by interdisciplinary teams.'
  merge: -1
  img_proc: true
