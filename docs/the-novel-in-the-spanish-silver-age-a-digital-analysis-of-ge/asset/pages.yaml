    existence or aesthetic interest. The strongest opposition against the basic concept
    of genre was published in 1902 by Benedetto Croce, who accepted the usefulness
    of genres for practical reasons (e.g. sorting criteria in libraries), but rejected
    the adequacy of using these terms in aesthetic research or philosophical discussion
    due to the inability to assign accuracy or laws to these concepts (Zymmer 2003,
