  md: 'meaning that it is a result that can likely be generalized for larger data
    sets of this literary period.


    The corpus has been annotated with several layers of literary metadata and linguistic
    information. All these annotations were placed in a single TEI file novel that
    contains all the types of data (original text, genre-labels, literary metadata,
    linguistic annotation), allowing the researcher to extract only the specific intended
    element every time. For the annotations, apart from some Natural Language Processing
    tools, I have applied lexicographic tools that were not meant for quantitative
    goals and are not part of the tool box of Digital Humanities, in Chapter 4.1.
    The semantic features of the catalogs of María Moliner’s dictionary have to be
    of great benefit, for the classification results (Chapter 6.2) and especially
    for the description of the genres (Chapter 8 and Appendix). An important therefore
    is that semantic features coming from dictionaries should be explored, with special
    interest regarding their performance in comparison distributional models (like
    topic modeling or word embeddings), both for classification results and description
    of categories.


    A current limitation of working with Spanish literature is the culture of not
    sharing data, a tendency that is still dominant. Nevertheless, the situation is
    improving thanks to some institutions with a more strategy as far as sharing data
    openly (e.g. the Spanish National Library) or on request (e.g. the Real Academia)
    is concerned, and thanks to researchers who are openly publishing their data.
    This research also wants to contribute in this manner, making all available the
    texts which are currently in public domain, extracted data for an even larger
    portion of the corpus, and the metadata for the entire corpus (see further details
    in Section 3.11.11).


    The major goal was related to the labels and their sources. Computational approaches
    on genre have mainly used only single source of labels from several possibilities:
    authors, publishers, first editions, or metadata from previously composed corpora,
    etc. In many cases, researchers decide to employ a source mainly because of its
    availability. In contrast, in this research study I have collected metadata from
    several sources, coming from very different institutions, as publishers, the covers
    of editions held by the National Library, literary manuals, digital platforms
    of readers, or my own annotations. The labels originally assigned by these sources
    were first standardized, and in a second step compared for consistency among'
