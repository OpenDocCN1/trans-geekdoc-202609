  md: 'gories (authorship, periods, subgenres), and observe whether they show statistical
    contrasts in metadata and linguistic annotation. Finally, I discuss the results
    and consider whether hidden subgenres have been discovered.


    # 6.2.2 Clustering in Stylometry


    In Chapter 2.2, the concept of clustering was briefly explained. This is one type
    of unsupervised task in Machine Learning, meaning that the researcher does not
    have labels for the instances (in my case, texts), and the algorithm uses the
    similarities of the features (e.g. word frequencies) to group the instances (Müller
    and Guido 2016, 133–34). Clustering is the most applied technique in stylometry,
    partially due to its visual impact and because it is the default option for a
    very popular tool:lo (Eder, Kestont, and Rybicki 2016). In a typical stylistic
    analysis with sty, either for exploratory purposes or for attribution, a number
    of tokens are transformed into a matrix using a distance measure such as Delta
    (Burrows 2002) in any of its variants (Ever et al. 2018). This distance matrix
    is clustered in a hierarchical structure (a dendrogram) and uses the labels of
    the authors for coloring the names of the texts. The Figure 74 shows the turnout
    of clustering 42 randomly selected texts from ConSSA.


    As be observed, some clusters group together texts of specific authors, such as
    Bazán, Gáldos, Fernández Pérez, Valle-Inclán, or Azorín, while clusters mix works
    from various authors.


    In my opinion, there are several bad practices and misunderstandings in the process
    described above. The most important error is the fact that the two types of tasks
    in Machine Learning are being confused. Instead of using supervised methods, unsupervised
    methods are applied for data sets that contain specific labels (in this case,
    about authors). In addition, the clustering algorithm as default in stylo is Ward,
    an agglomerative method that first links the instances to a new instance or to
    a new cluster, composing a hierarchical tree-like structure. Due to this, a structure
    without a fixed number of groups is created, which leads the researcher to pick
    the clusters that fit their hypothesis. In my case, I can consider that the two
    texts of Gáldos (lower section of the cluster) are separated from Baroja, while
    the three texts of Azorín (upper section) belong to the same cluster. Even when
    the evaluation of such structures is harder to perform than in a supervised task,
    the stylo'
