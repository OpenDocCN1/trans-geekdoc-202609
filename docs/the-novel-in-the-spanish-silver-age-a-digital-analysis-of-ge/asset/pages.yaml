    (episodio nacional as a blend of historical and adventure novels) does not belong
    to the novel (as the quotes by Unamuno imply)? Normally, the answer depends on
    the analysis: A researcher who analyzes a particular author tends to consider
    the label and even argue for its acceptance as genre; a researcher who compares
    texts from numerous authors tends to ignore these labels. In this research, I
    will analyze each label independently, with skepticism about their status as subgenres,
    but without dismissing the possibility that some of them can exhibit similar properties
    to other subgenres.'
