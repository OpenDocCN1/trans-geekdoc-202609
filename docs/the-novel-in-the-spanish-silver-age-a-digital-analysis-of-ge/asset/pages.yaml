  md: 'them (steps undertaken in Chapter 5.1). This analysis has shown that the different
    sources share as little as for the extension of the genres is concerned (which
    texts populate genre), even among similar sources such as literary manuals. However,
    none of these sources is so particular that it has no similarity to the rest;
    they all seem to share a very basic understanding of what constitutes the genres.
    The results support this for labels that have been analyzed in the rest of the
    work. A series of labels has shown statistical agreement across several institutions,
    and constitute the basis of the genre palette of this publication. These labels
    were not expressed in Spanish, but also employ the terms of a multilingual taxonomy
    of genre labels collected by publishers (called Theme, see Section 5.1.5). In
    contrast, a great number of the subgenre-labels (a total of 77 different ones)
    did not show any evidence that humans share a basic concept (such as novela de
    tesis, regeneracionista, sentimental), at least for the literature of this period.


    Two questions about labels have been analyzed. Chapter 5.2 examines using the
    labels on the cover of the first edition leads to higher classification results
    than using other labels, following the hypothesis that the original labels could
    be more influenced by textual internal characteristics and not by external factors.
    The results have shown the opposite: The labels on the covers of the first editions
    have a stronger association with the author''s name, and lead to a lower classification
    case than the labels from the rest of the sources. In Chapter 5.3, a specific
    case has been analyzed: literary fiction, a label that is frequently assigned
    by publishers along with other accepted subgenre terms. In several tests, *literary
    fiction* behaved just like the rest of the subgenres. Publishers seem to understand
    this label as part of the genre palette and nothing could be found that proves
    its characteristics differ from the other labels.


    The third major goal was the identification of subgenres, that is, the use of
    algorithms that have not been considered before as such. Previous research has
    only observed this possibility in non-literary texts, as Web documents. Several
    researchers have used unsupervised methods (clustering or dimensionality reduction)
    to analyze subgenres (see Chapter 2.2 for an overview). However, these methodologies
    have not been previously used for genre identification due to several difficulties,
    such as the dominance of the authorial cue in the clusters, or the open question
