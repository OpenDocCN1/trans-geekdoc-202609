    major impact either in theoretical areas or in computational analysis. These will
    represent the base for the expectations and limitations of the computational model
    that will be presented in the discussion (Chapter 8) of this book.


    I am aware that some concepts that are presented here are truly basic to Linguistics,
    Literary Studies, Digital Humanities, or Computer Science, and that some readers
    consider whether such basic explanation is necessary. This is necessary in order
    to make interdisciplinary communication possible.


    First, I will present an overview of the basic distinctions of the concepts and
    definitions. Second, I will describe the three main models (scholastic-structuralist
    model, hybridism, family resemblance, and prototypes) that a text should comply
    with in order to belong to a genre. Third, I will introduce two perspectives on
    the analysis of genre: a longitudinal historical perspective with fewer genres
    being analyzed which looks more closely at a specific source of labels, and in
    the last section, I will introduce (taxonomies, flat, or gradual structures),
    and a cross-sectional synchronic perspective in which a larger number of labels
