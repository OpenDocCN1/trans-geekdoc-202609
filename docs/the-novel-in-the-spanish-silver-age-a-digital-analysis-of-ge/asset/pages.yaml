- pgno: 20
  md: '# 1. Introduction


    Genres are a contradictory cultural phenomenon. On the one hand, specialists tend
    not to find consensus about what exactly defines genres (with very few exceptions,
    like sonnets). In those cases, central questions arise quickly, such as whether
    it is useful to search for an exact definition, the difficulty of acquiring a
    closed list of labels, the inadequacy of formal structures (such as taxonomies)
    to fit real examples, or specific doubts about the status of specific labels:
    "is young-adult novel really a thing?" On the other hand, everyone interacts on
    a daily basis with many institutions that use genres: Bookstores, libraries, physical
    or online shops, streaming platforms structure their content partially through
    genre. Netflix highlights new-hero movies or series in our profile because we
    watching similar content. Readers, we tend to go to the detective novel section
    of a library or bookstore if we enjoy this genre.


    These two contradictory perspectives are especially observable in academic circles.
    A researcher might be interested in the representations of characters'' genders
    in theater plays of the 18th century, or the way animals are represented in specific
    short stories of the 19th century. In these cases, genres (theater plays, short
    stories) are not the main goal of the research, but are used to define the literary
    corpus of analysis. In other words, the researcher takes for granted that genres
    are an important manner of structuring culture. However, the effort of obtaining
    a clear definition or structure of these categories is often unfruitful. Genres
    seem to be useful, but also fuzzy and opaque.


    Literary genres are not only useful to define the corpus we study, they also deserve
    to be the primary focus of specific research. Literary Studies concentrate their
    attention on texts, their main instance of analysis. But in most cases, a researcher
    wants to study more than one work. To define a corpus, the texts need to share
    specific categories, e.g. they were written by the same'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# The Novel in the Spanish Silver Age


    person, have been published in the same period, or belong to the same genre.

    These three categories (authorship, periodization, and genre) are frequently analyzed
    or used in Literary Studies, although others are also possible (texts that tackle
    similar topics, are produced in the same region, are published by the same printer,
    etc.). Among these three categories, genre is the only that does not concern a
    factor that is external to the text, such as author or the year of publication.
    Similar literary works compose thicker genres, and genres organize literary works
    into genres. Todorov states that "genre is the point of intersection of general
    politics and literary history; in this sense, it is a privileged object, which
    is enough to make it the principal subject of literary studies" (1976, 164), while
    Wellek and Warren state that "the subject of genre [...] raises central questions
    for literary history and literary criticism" (1956, 237, originally published
    in 1942). This is especially relevant in our current situation of massive digitization
    of cultural heritage and accessibility to quantitative methods. Having a clearer
    understanding of genres can lead to a better position to study the history of
    literature, and ultimately the history of cults (cfr. Garrido 1988, 25–26).


    The study of genres encounters a very long tradition of discussion, spread across
    thousands of years, a great number of languages, academic traditions, and many
    authorities, including Plato, Aristotle, and Goethe. No researcher can encompass
    all the references about genre. However, some models and structures have created
    a major impact on this tradition. From the Aristotelian philosophy emerged the
    model that is most applied to genre, either explicitly or implicitly. Traditionally,
    this scholastic model foresees that each text belongs to a genre based on sufficient
    and necessary conditions. For each part, genre pertains to a more general genre.
    Thus, a tree-like taxonomy emerges, similar to those in biology: Texts (as leaves)
    have on genres (branches), and these originate from thicker branches (more general
    genres). This elegant and intuitive intuitive is thwarted by every attempt of
    feeding it with real. First, many texts belong to more than one genre. Second,
    there is no consensus about the sufficient and necessary conditions. Third, attempts
    to identify macro-genres (groups of genres) find little acceptance. For these
    reasons, other theoretical models have been integrated into the discussion in
    the last decades, such as the prototype theory and the family resemblance approach.
    In Chapter 2.3, I will describe these models, structures and perspectives on genre
    in detail.


    A further difficulty around genre is the fact that it is analyzed by dozens of
    research fields, such as Rhetoric, Linguistics (and several subareas, as'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'Corpus Linguistics), Literary Studies, Digital Humanities, Cultural Studies,
    Media Studies, Sociology, etc. Each field creates its own tradition, composed
    of a jargon, concerns, and publishing channels, which are unfamiliar to researchers
    of other traditions. Besides, the differences in languages work as a double wall.
    First, researchers tend to publish in their own language. Second, the literature
    they analyze is alien to many other researchers. Four scholars from different
    countries (for example, Spain, France, Germany, and Russia) working on genre in
    their national literatures are likely to produce papers that are (in the best-case
    scenario) only partially understandable to the others, but most illegible. Beside,
    they analyze labels and texts that are mostly unknown to other researchers. The
    possibilities of sharing knowledge between traditions and languages is very limited.


    Considering all these aspects, what is the goal of this research study? This has
    several goals, but the ultimate one is to present a theoretical and computational
    model for genre. This model can be fed with hundreds of reals from Spanish literature,
    not only the canonical works or those that fit the theory. The specific data points
    are organized in three separate connected: genre-categories represented by labels,
    textual instances, and internal characteristics (from linguistic annotation or
    literary metadata). The interest in the model for Literary Studies and Digital
    Humanities relies on four aspects. First, it can comprise several observations
    that until now were seen as unconnected, as the prototypicality of some texts
    for specific genres, the variance in the classification results, the description
    of genres through internal features, or how the texts and genres interact. Second,
    the model is able to compute questions about the genres that have found little
    formalization until now, such as the quantification of the similarity of various
    genres, (macro-genres). Third, besides its theoretical and computational form,
    this model can be represented visually, facilitating a shared comprehension between
    research traditions and languages. Finally, the model for genre here is presented
    an example of how Digital Humanities (DH) is not restricted to the application
    of already existing techniques from Computer Science. Much more than that, part
    of the Digital Humanities activity can be designing new computational methods
