    # 2.1.4 The Novel and its Borders


    As discussed, the literary genres, and the novel one of them, show a strong tendency
    of seeking freedom, heterogeneity, and new forms during this period. In some cases,
    this leads to a certain proximity to other genres, such as theater, poetry, biography,
    and beyond. This proximity to other genres can be understood as the origin of
    specific subgenres of the novel as the dialogue novel or the lyrical novel. They
    can be observed as heteronyms of the novel (types of novels) or as overlaps between
    the novel and other literary genres (in Section 2.3.3, I will present several
    ways of structuring several genres). Probably the most evident subgenre that exemplifies
    the closeness between novels and theater is the dialogue novel, which is defined
    as a text made of only (or mainly) dialogue, using the traditional typographical
    convention of plays:


    Name of the character.- Dialogue (information about movement or details in italics
    as stage directions).


    Some researchers treat these novels as a phenomenon of the 20th century (Garrido
    Dominguez 2009, 776; Spang 2009, 1296–97; Jiménez 1998, 20), it should be taken
    into consideration that previous authors, like Galdós, wrote in this category
    during the 19th century (Escobar Bonilla 1997). Furthermore, it can be argued
    that they stem the classic dialogue genre, which was very common in previous centuries.
    Lissorgue interprets these novels as a new narrative technique that provides more
    freedom to the characters and keeps the narrator from assuming his natural role
    (2001, 71). Besides this subgenre, the influence of the theater has been tracked
    in other forms, for example as a general characteristic of the prose of the del
    98 (Pedraza Jiménez and Rodríguez Cáceres 1986, 115; Rubio Jiménez 1998, 20).'
