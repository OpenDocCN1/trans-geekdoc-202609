    # 3.2.8 Place and Period of the Action


    Many subgenre-labels contain information about the place of the action of the
    plot. There are numerous types of geographical references: novela americana (reference
    to the continent), novela regional (to a rural setting), novela madrileista (to
    the city or town), novela cosmita (to the size of the place), novels del mar (to
    the sea, in contrast to the land). Multiple facets of the setting have been encoded
    using different categories of metadata. Many of these are implied: If the action
    takes places in Madrid, it means that it takes place in Spain, which is in Europe,
    and it means that the sea is far away. Nevertheless, I have explicitly encoded
    all the fields to use this information in various scenarios.


    To assign a value to each metadata, at least half of the novel has to correspond
    with the value. Otherwise, it was assigned as mixed. This specific value is especially
    interesting because it indirectly represents travel; depending on the geographical
    level of this value, it can point out within Spain (for example La vuelta by Azorin),
    Europe (*El mundo es ansi* by Baroja) or the world (*Genio y figura...* by Valera).
    These will be observed closely in the descriptions of the subgenres of the Appendix.


    Along with the place, information about the period (point and total span) has
    been given. Here is the complete list of the categories:


    +   - Setting settlement: Name of the place (city, town, or village) where the
    action takes place, represented exactly the way it is referred to in the text
    (Madrid, Paris, Valencia, Marineda..)


    +   - Setting territory: Name of the region to which the place belongs, especially
    interesting for the novels in the rural places, encoded in Spanish (Castilla,
    Valencia, Andalusia, Isla de Paris).'
