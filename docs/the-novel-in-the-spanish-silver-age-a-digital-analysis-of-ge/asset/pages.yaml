  md: '# 6.2.3 The Authorial Cue Problem when Clustering Literary Works


    Many algorithms (as k-means) require that the researcher defines the number of
    clusters that should be identified. This depends partially on the researcher''s
    goals: many subclusters with few instances, or a few groups with many instances.
    This is contingent on the labels that the cluster fit. In my case, the corpus
    of novels contains 72 different authors, while I considered 15 categories in the
    annotation process of the main subgenre for each text, and six decades are represented
    in the corpus. This means that on whether I expect the cluster to represent authorship,
    decades, or subgenres, I can look for more or fewer subclusters.


    The second problem of the stylometric practice of clustering is its lack of evaluation.
    There are in fact several metrics that compare the clustering with some annotation,
    which is considered the ground truth. In my case, the metadata can be considered
    the ground truth, such as the author''s name, the decade, and the subgenre of
    my annotation. The Python library scikitlearn offers several metrics for comparing
    the cluster results with the ground truth, such as homogeneity, completeness,
    mutual information score, or adjusted Rand Index (ARI). ARI is the most frequently
    applied in the DH field (Klausner, Nerbonne, and Colèque 2015; Evert et al. 2018;
    Josifiyan and Vlasov 2019). Its scores vary from one (perfect match) to zero (random
    assignment), with possible negative values for worse matches than the random label.


    In this first step, I apply the clustering k-means, using the relative frequencies
    of the 5,000 most frequent tokens, considering the cluster of numbers 2, 6, 10,
    15, 20, and then steps of 10 are taken until I get to 72 clusters (which is the
    number of different authors in the corpus). Since k-means is not deterministic
    (the initialization of the clusters is randomly declared, causing different outputs
    in equal circumstances), I repeat each combination of parameters ten times. The
    outcomes are hundreds of clusters that can be mapped to several ground truths
    from metadata such as the author''s name, the decade, or the main subgenre. In
    each case, I calculate the ARI.


    In Figure 76, the three ground truths (the first two box plots and the last) are
    clearly above the zero line, which represents random mapping between clusters
    and ground truth. To confirm the values of the decade and main subgenre are not
    behaving in a completely random manner, I create an extra random category, plotted
    as the third box plot. This random category has, in fact, a lower value than the
    rest, which is very close to zero. Consequently, decade and subgenre have a statistically
    higher ARI score than ran-'
