  md: '# 3.2.9 Protagonist Metadata


    Another type of literary information with a strong resemblance in the labels is
    the protagonist. Some subgenres are related to different types of information
    about the most important character in the novel, like her or his social level
    (picaresca, social), profession (de guerra, policía, taurina), or the age at the
    beginning of the action (picaresca, de educación). Two other basic pieces of information
    about protagonists have been gathered: their gender and their name (to document
    which character has been chosen, particularly pertinent in novels in which this
    decision is unclear). The specific fields are:


    +   * Gender: With two basic values (male and female), mixed if there is no clear
    protagonist but instead a group with mixed genders, and for non-human protagonists.


    +   * Name: The longest version of her or his name (surname, if present), with
    or his pseudonym in parentheses.


    +   * Profession: Categorical values about the protagonist from a list of 30 general
    values (lord, artist, business owner, military personnel, religious...).


    +   * Social-level: The social level of the protagonist as three possible ordinal
    values (for characters whose basic need like nutrition or education are at risk),
    medium (for characters who need to work, default value), and high (for wealthy
    characters who do not need to work).


    +   * Age: Age of the protagonist from a list of four ordinal values: child, young,
    adult, and mature. Because these values can change over the course of the text,
    either the age at the beginning of the novel (in most cases), or the youngest
    age of the protagonist described in at least one chapter'
