  md: '#  4.2 Transformations of Lexical Data and Linguistic Annotation




    In the previous chapter, a set of linguistic annotation layers were introduced.
    The Machine Learning tasks require an even more specific operationalization of
    each of these in every text. Normally, the first step is to count each feature
    in the entire document. This is the basis of the so-called Bag of Words document
    model (BoW), or the more general Bag of Features. The information about the position
    in the text of the words (beginning of the text, end of a sentence) is ignored,
    and at least a second step is applied, namely a division through the entire length
    of the document to obtain the relative frequency, a typical measure, for example,
    in Corpus Linguistics.


    The same model and transformation could be used for other annotations: relative
    frequency of direct speech in the text, relative frequency of each TEitag, etc.
    Further transformations are usual in different areas: z-score transformation in
    stylometry, tf-id or binary frequency in Computer Sciences, or logarithmic transformations
    in Statistics. The different fields tend to consider only their typical traditions
    and consider evaluate other options. This can be observed that from all the papers
    about computational analysis mentioned in Chapter 2.2, none evaluated transformations,
    and in many of the researchers provide neither their decisions nor their reasons.¹
    The target group of this chapter is researchers who are active in DH and come
    from different areas which have common interests with my research: Computer Science,
    Computational Linguistics, Literary Studies, and Linguis-


