  md: '(a question that will be analyzed in Chapter 5.2), which texts are assigned
    to which subgenre, and whether this assignment should be in categorical terms
    or in degrees (as in the prototype theory, Section 2.3.2.4). In addition, it is
    unknown which criteria affect subgenres and their information to the entire population
