    Which genre labels should be classified (understood either from the logical or
    the computational perspective) is an open question, but in many cases the basic
    set of possible genres (or genre palette) has its roots in again classic philosophy.
    Plato is normally the first authority on genres when viewed chronologically, and
    he applied a three-part distinction, using the relationship between poet and text
    as criteria: The poet himself talks (dithyramb), lets others speak (agedy and
