    impact on the results. If the data is skewed, the classifier will tend to use
    only features with the highest values, ignoring the rest, and therefore adding
    more features will not bring any improvement. If this is the case, the skewness
    of the transformations and the mean F1-scores should be negatively correlated,
    i.e the less skewed a distribution is, the better will be the results. For this,
    I obtain the skewness of the shape for each transformation, and calculate the
    correlation with the mean F1-scores. The result is a very negative linear correlation
    (r = -0.84***), and the full hypothesis can be rejected: The quality of the classification
    is explained to a large degree by whether the transformation results improve when
    the shape is closer to a Gaussian distribution. To test this, I use the statistic
    by the normality test, and correlate it with the mean F1-score. The result is
    even clearer: There is an almost perfect negative linear correlation (r = -0.95***).
    It is ever surprising that such measures (statistical normality of linguistic
    frequencies and F1-scores) have such a strong correlation and that the results
    are statistically significant with few data points (nine transformations). The
    more similar the shape of transformation is to a Gaussian distribution, the better
    the results in a classification task of subgenres.


    These correlations are important findings because they put the statistical description
    of the transformation of linguistic data in direct relation, and this results
    in a Machine Learning classification task for genre. The search for more accurate
    transformations of the data should aim to obtain less skewed and more normal shapes
