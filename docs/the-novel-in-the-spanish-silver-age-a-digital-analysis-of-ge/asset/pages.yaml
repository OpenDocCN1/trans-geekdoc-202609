  md: '# 2.3.1 Basic Distinctions about Concepts and Definitions


    In many textual contexts, words like novel or poem (Spanish, novel and poem) can
    be found, and these can be confirmed in any linguistic corpus. These words are
    recognized by speakers as genres, which are groups of texts with certain particularities.
    Like any other word, they can be seen as linguistic symbols in the traditional
    term of the linguist Ferdinand de Saussure (Kabatek and Pusch 2011, 39–40; Becker
    2013, 32–33). According to de Saussure, linguistic symbols have two components:


    +   1. A linguistic expression, also called signified (French: significant) or
    for: example, the word novel in Spanish, novel in English, Roman in German,

    2. The linguistic content, also called signified (French: signifie) i.e. the meaning
    shared by speakers (in the linguistic convention written as ''novel'').


    In a sense, an important goal of this research study is to analyze what the signifie
    of significants such as adventure or erotic novel: What do speakers mean when
    they state "this text is an adventure novel?"

    To go a further step, I would like to imagine someone, with an actual book in
    their hand pronounces a sentence like "I have just read this novel and I like
    it very much." The person probably uses the word novel because they think that
    the objecthow belongs to this concept and it is therefore acceptable to use the
    form novel when referring to it. This example shows how linguistic communication
    also relates to external elements or objects in reality it is perceived. This
