  md: '# 6.1 Feature and Parameter Analysis




    In the previous chapters I have presented several annotation layers (Chapter 4.1)
    and transformations (Chapter 4.2). Other researchers have fed similar features
    into computational methods in order to analyze literary genre (see Chapter 2.2
    for more details). In the majority of these works, the researchers applied more
    than one method and compared their results. The most frequent cases involving
    applying different algorithms or linguistic annotation layers, while the transformation
    of the data is rarely a matter of evaluation.


    The combination of all the possibilities presented until now leads to thousands
    of different results. Just to mention a few: 100 semantic features transformed
    as tf-idf and analyzed with support vector machines, ten syntactic features transformed
    as s-scores and analyzed with logistic regression, 1, lexical features in their
    relative frequency analyzed with random forest, etc. The options need to be reduced,
    and for this the researcher can employ at least three strategies. First, all possible
    combinations can be applied in every step of the research (i.e., in all the following
    chapters). This would lead to excessively long computational times for every section.
    A second possibility is to argue for using some possibilities or a few of their
    combinations and only those, the preferred strategy in the previous research.
    However, the foundations for this are based on hypotheses or are not fully tested.
    A third possibility, common in Computer Science, is to undertake a proper evaluation
    of parameters as grid search (Müller and Guido 2016, 262–66), trying all possible
    combinations of parameters in a specific section of the research, comparing the
    results afterwards, and extracting only a few that remain for the rest of the
    work.


    This last option is the chosen method and represents the core of this chapter.
    This kind of evaluation delivers empirical results, tests all possible com'
