  md: 'application to smaller data sets remains an area of research (Altszyler et
    al. 2017; Antoniak and Mimmo 2018), with the previously mentioned difficulties
    in the evaluation. The third reason is that different publications have evaluated
    both topic modeling and lexical frequencies have not found that the first performed
    better (Hettinger et al. 2016; Henny-Krahmer et al. 2018).


    Finally, the fourth argument states that these distributional semantic models
    have a similar disadvantage as the use of lexical frequencies in comparison to
    morehensible semantic information: the difficulty of interpretation. What does
    it mean that 1,000 lexical and typographical features are the best discriminators
    for a genre? How can humans relate these numerous fields to specific definitions
    of genres? How is this different from using topics, when they are composed by
    probabilities of thousands of lexical units?


    Because of these reasons, I decided to annotate the corpus with semantic features
    that support the interpretation of the features. For this, I have chosen two different
    projects, both with lexical information annotated manually. The first are the
    lexical names in WordNet, a set of 45 semantic areas as body, plant, cognition,
    emotion, perception, etc. Each group of synonyms in WordNet (synsets) is related
    to one of these lexical names.


    The second resource comes from the classic Spanish dictionary, Diccionario de
    uso español (DUE), originally published in 1966 by María Moliner. This extraordinary
    lexicographic work contains many innovative aspects (for the time and even for
    today) in its content and format. Examples are the lexical order of entries besides
    the alphabetical order, different layers of semantic disambiguation, collocations,
    examples, and semantic catalogs. These catalogs are found in specific lexical
    units that can be seen as the basic form of important features, such as plants,
    clothes, boots, illness, time, writing, army, etc. The lexical units of the dictionary
    are related to at least one of "homogeneous and differentiated semantic groups"
    (Moliner XI). The motivation for this being relations of synonymy, antonymy, hyperonymy
    (abstraction of), hyponymy (case of), holonymy (section of), or meronymy (part
    of) (Moliner 1966, XI). For example, words like caffeine, cappuccino, pot, or
    cafe are somehow semantically related to the concept of coffee, so they appear
    in the catalog for the word coffee. Thus, all of them share a semantic trait,
