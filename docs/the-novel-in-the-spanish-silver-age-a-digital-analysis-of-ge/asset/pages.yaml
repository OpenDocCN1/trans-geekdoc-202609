- pgno: 130
  md: '# 3.2 Metadata




    In the previous chapter, I have presented the definition of the corpus. Why should
    it contain metadata? What kind of metadata is needed to study the subgenre of
    novels? How can it be collected and validated? What are the gen-eral tendencies
    of metadata between 1880 and 1939? These four questions lead this chapter. Metadata
    is knowledge about the text, formalized in a way that it is computationally accessible.
    In that sense, metadata is the way of connecting non-digital about algorithms
    and tools in different ways: On the one hand, information can be incorporated
    into algorithms and methods as I will do in Chapter 6.2 or to classify unlabeled
    cases, as it will be the case in Chapter 3.3). On the other hand, it can be employed
    as features to classify more complex categories like genre (see Chapter 7.2),
    or to analyze its relation with other categories or textual features (see Chapter
    8 and the Appendix).


    For this purpose, I have annotated ConSSA with numerous kinds of meta-data: information
    about literary genres and subgenres (which sources have assigned labels of each
    text), information about literary phenomena like narrator, setting, type of ending,
    sociological information about the pro-tagonist, etc.


    In the final section of this chapter, the corpus will be briefly described based
    on this metadata, giving a general overview of specific literary phe-omena of
    the novel of this period.'
  merge: -1
  img_proc: true
- pgno: 131
  md: '# 3.2.2 Metadata, Distant Reading, and Hypotheses Testing


    Metadata is at the very core of many textual studies. As Burnard points out "without
    metadata, the investigator has nothing but disconnected words of unknowable provenance
    or authenticity" (2004). When many researchers or whole areas of research do not
    adopt the word metadata, they employ it as the very basic index. For example,
    the most standard use case for stylometry, author attribution, needs to assign
    every text to an author. A subfield of stylometry, stylochrony, investigates the
    date of publication of the texts, which can be seen as another type of metadata.
    Library catalogs can be understood as collections of metadata about books (NISO
    2004) with a special kind of information: the reference to the place in the library
    where the book is supervised. Machine Learning would use metadata, calling labels
    or only Y represent its classes, would apply the available metadata as ground-truth
    to color and display the results. Metadata can be saved in different ways, the
    most basic being the name of the file (which common in stylometry). But other
    possibilities are also frequent: in simple markup at the beginning of each file,
    in a structured XML element like TEI, in a separate table, etc.


    Metadata is one of the elements that can be discussed by non-digital scholars,
    digital humanists, and computer scientists. However, each of these fields would
    have different priorities, manners of communicating, and using this information.
    Nonetheless, the different interest will differ wildly as far as using this information
    is concerned. Nonetheless, the different researchers can understand and find it
    interesting that a novel is written in a third-person voice (which is coined by
    Gen) a heterodiegetic narrator. The philological interpretation of this fact relating
    the rest of the literature, the use of this information in clustering or classification
    tasks, or questions about the optimization of the algorithms would then interest
    only a section of the researchers mentioned above. That is why I consider metadata
    the bridge between several fields on the different riverbanks of the digitization.


    Actually, metadata can be seen as the computer readable formalization of a cornerstone
    of Digital Humanities. In 2000, Moretti published "Conjectures on World Literature,"
    in which he coined his influential concept of distant reading. However, in this
    article the concept is not related to any digital or computational aim, and there
    is not a single reference to technology in the entire publication. There, the
    distance in the reading process not gained'
  merge: -1
  img_proc: true
- pgno: 132
  md: 'through computers, but only through the use of secondary literature: “it will
    become ‘second hand’: a patchwork of other people’s research, without a single
    direct textual” (Moretti 2000, 57).


    In the next chapters of this book, I will analyze dozens of categories in hundreds
    of texts using thousands of features. Genres are an optimal phenomenon to be analyzed
    by approaches like distant reading, macro-analysis, or cultural analytics. One
    can choose to return to a fraction of few excerpts of novels that show how the
    analysis is observable in the original text. But by doing only, a tiny fraction
    of the paragraphs, novels, categories, and features are being used to corroborate
    the analysis. There is just too much to find a solid manner of returning to the
    original text. We need distance when we analyze genres.


    Nonetheless, there are at least two weak in Moretti’s argumentation. First, it
    is unclear how this process should take place exactly, considering the different
    researchers to disagree regarding the borders of the analyzed phenomenon, its
    chronological boundaries, their interest, or their epistemological framework.
    These differences can be understood as bias from the different sources, and later
    translate into artifacts in the results. Besides, this way of gaining distance
    does not foresee the possibility for a researcher to include their own reading
    and understanding of the text. Even though it is clear that a single researcher
    is not able to undertake complete readings for more than a couple of dozens of
    texts, they might want to cover specific sections of the corpus that are not analyzed
    by other sources, or to look closer at very specific characteristics.


    In this chapter, I argue for distant reading processes through the encoding of
    metadata, stating explicitly who provides each piece of information: either myself
    after reading the text, or other researchers. This could be observed as a productive
    path for interdisciplinary collaboration between several researchers: to analyze
    through digital techniques the qualitative metadata annotated by literary scholars.
    Formalizing it in that manner, the researcher and the community can recover the
    source of information for each single data point. These metadata represent specific
    literary interpretations that can be used to explain the results. In other words,
    the researcher is not obliged to return to a tiny fraction of excerpts of the
    text when discussing the results; they can remain with the metadata, that summarize
    specific phenomena of the entire corpus. I will follow this strategy – not to
    return to the original text – in the rest of this research study. In contrast,
    I will use the metadata in several ways, such as a mean for evaluating the clusters
    (Chapter'
  merge: -1
  img_proc: true
- pgno: 133
  md: '6.2), encoding it as features for classification tasks (Chapter 7.1), explaining
    the variance of the results (Chapter 7.2), using them to create a unified digital
    model of the genre (Chapter 8), and describing empirically analyzed sub-genre
    (Chapter 8 and the Appendix). In this manner, metadata plays a central role in
    how my research approaches, evaluates, and explains Machine Learning applied to
    the analysis of subgenre.


    In fact, the application of metadata has further implications relating the scientific
    path for the analysis of literature. First, quality metadata allows for an inductive
    process of statistical description. These are meant to be exploratory attempts
    that can either define one phenomenon or observe its development in historical
    terms. For example, in Section 3.2.11 I will give a short description of what
    the typical literary characteristics of the novel of this period are. But this
    is not the only case in this work I will use this literary metadata. Several Chapters
    like 5.3, 6.1, 7.1, 8, and the Appendix contain similar inductive descriptions
    based on the qualitative information gathered from sources.


    The second path that metadata opens is related to the critical rationalism started
    by Popper: the falsification of hypotheses. This is a central task in this paradigm,
    and the role of the researcher is, first to propose a general explanation of the
    analyzed phenomenon, and formalize it in two or more variables. Then, it is defined
    what it could represent in a random process (null model) that could also explain
    the data. Finally, the researcher measures whether the hypothesis can explain
    the data statistically better than the null model. This last step is called falsification
    of a hypothesis. Here, the metadata would represent the formalization of the categories
    of the analyzed phenomenon.


    The alternative to a more formalized procedure is the hermeneutic approach of
    interpreting the results of a digital analysis. For that, the researchers have
    advantage of their knowledge and reading experience. However, this process has
    several flaws, such as the tendency to observe meaning and connections in unrelated
    phenomena (apophenia), select only those results that fit well into the hypothesis,
    and in general over-interpreting results.


    For Digital Humanities, there are two possible goals for the hypotheses. Firstly,
    the researcher might want to learn about the cultural object, in my case, Spanish
    literature. In this case, the researcher asks whether the gathered data behave
    as a specific hypothesis would anticipate, and if it deviates from the random
    null model. For example, there is an expectation that as the 20th century progresses,
    the gender differences in literature become smaller with time. This has been partially
    analyzed in the Section 3.1.10, but it'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'be analyzed in the Section 3.2.11, adding the information about the gender
    of the protagonists. Another hypothesis about the data that will be evaluated
    in that section is whether the novels of these period lose specificity regarding
    their references to reality, taking place more often in unspecific periods, locations.
    This idea is present in works from Literary Studies (García Lara 1986, 209; Gullón
    1994, 1999; Aubert 2001, 11; Navajas 2008, 18), and it will be analyzed through
    the formalization of the uncertainty of the metadata of the value unknown. The
    frequency of this value in the entire scheme of the metadata will be compared
    to what is expected by randomness in a statistical regression model.


    Besides the data, the researcher can be interested in the deeper understanding
    of the method: What exactly is the algorithm doing? How is it working? And why?
    These are essential questions for unsupervised methods such as clustering, in
    which texts are grouped based on linguistic features. Do these groups relate to
    any formalized data that was previously encoded? Or are they just randomly sorted?
    Metadata will be the way of evaluating the results of clustering methods in Chapter
    6.2. But not only unsupervised methods require explanations, to that there is
    also a need for a deeper understanding of the results of classification. For that,
    I will use metadata and other linguistic measures to evaluate a series of hypotheses
    in Chapter 7.2 about why some subgenres consistently yield higher results than
    others.


    # 3.2.3 Typology of Metadata


    There have several proposals to outline a typology of metadata. While the NISO
    differentiates three main types (descriptive, structural, and administrative;
    2004); Burnard signals four categories (editorial, analytic, descriptive, and
    administrative; 2004). The difference between both is probably based on the typical
    use cases the typologies should cover: more in general in the case of NISO, while
    in Burnard''s case it is the environment of corpora and editions in TEI. For this,
    I will consider three types of metadata:


    +   - Editorial metadata: Information about the source of the parts of the corpus.


    +   - Administrative metadata: Documentation about the corpus itself.


    +   - Descriptive metadata: Classificatory information of several aspects.'
  merge: -1
  img_proc: true
- pgno: 135
  md: '# The Novel in the Spanish Silver Age


    While the first two will be tackled together in the next section, descriptive
    metadata will be explained separately in Section 3.2.5.


    Following the TEI Guidelines, I have encoded directly the metadata about texts
    and the collections in the TEI Header. This strategy provides me with the opportunity
    to encode various aspects using a shared semantic frame within the DH community.
    It also offers the possibility to match each specific information through attributes,
    like @cert (about the certainty of a specific information) or @source (to refer
    to a specific origin of data).


    Each category and possible value of metadata was defined in a hierarchical taxonomy
    as the TEI XML document, addressing also type of information (nominal, ordinal,
    interval, or binary). In the case of ordinal classes, the names of the possible
    values were also inserted with their numerical position. For example, five values
    for different types of endings of the novel, varying from zero (clearly) to five
    (clearly happy). This file has been used for several purposes: On the one hand,
    to validate the metadata of the whole corpus using a Schematic, or to recategorize
    the fields (for example employing the numerical values of ordinal categories,
    or transforming numerical information into binary fields) for specific visualizations
    as the ones at the end of this chapter or employ them as features (Chapters 7.1
    and 8).




    Each text and author have been identified using the complete name, short name,
    and the identifiers of the Spanish National Library (BNE) and the Virtual International
    Authority File (VIAF). In this way, every text and author can not only be tracked
    within the corpus, but also as a part of other digital collections. About the
    sources of the text, I have gathered references regarding three different kinds
    of editions implicated in the genetic process of each text (all of them encoded
    inside an element sourceDesc/bib with different @types):


    +   - Edition-first: The first time the work was published as a book (the date
    should be between 1880 and 1939).

    - Digital-source: The digital source. If the text was digitized by the CLiGS,
    it collects also the year and the exact program used (FineReader, Recognition
    Server).

    - Print-source: The printed edition taken as the base for the digital version.'
  merge: -1
  img_proc: true
