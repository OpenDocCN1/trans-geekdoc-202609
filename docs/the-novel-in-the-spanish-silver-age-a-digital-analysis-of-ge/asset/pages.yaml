  md: '# 2.3 Theory of Genre


    As described in the previous section, there is a tradition of computational research
    in textual genre which has been undertaken mainly by researchers from Computer
    Sciences and Computational Linguistics. It is only in the last decade that literary
    scholars and interdisciplinary teams have analyzed the specific case of literary
    genre using computational methods, some of them with previous experience in the
    areas of stylometry and authorship attribution. The analysis of the category of
    author is much less problematic than the case of genre: In most cases, (normally
    one) that wrote the text is undisputed. In the majority of the periods, cases
    of co-authorship represent a tiny fraction of the publications. The conceptualization
    of genres in every step is disputed: Texts belong to a single subgenre or can
    they belong to several? How many and which precise labels should be used in the
    classification? Whose labels should be analyzed — the author’s, the library’s
    or the publisher’s? Do the texts have to pass a set of necessary and sufficient
    conditions? Do genres conform to structures as taxonomies? Do they overlap? Can
    a text belong more to one genre than another? In other words, the classification
    of texts into genres has several issues less relevant or ever unknown in other
    literary categories. These issues include hybridity, overlap, ambiguity, lack
    of a shared palette, and vagueness on how to structure their similarities. This
    is particularly relevant for the period analyzed here, in which many authors tried
    to escape the frame of traditional genre categories.


    In this chapter, I will present the main abstract distinctions of cultural concepts
    and give some examples of their application to the notion of genre. The goal is
    neither to recreate a historical overview of the concept of genre, nor present
    all possible abstract models or structures. Both goals would be beyond the possibilities
    of this publication. Instead, I want to describe a selection of models, structures,
    and perspectives about genres that have had a'
  merge: -1
  img_proc: true
