    Literary genre is only one specific type of textual genre that has been treated
    by different research groups (linguists, computational linguists, digital humans)
    in the last decade. Previously, the most common case was to analyze journalistic
    or general corpora. A pioneer in the study of genres applying computational methods
    is Biber, who started working on this topic in 1988.


