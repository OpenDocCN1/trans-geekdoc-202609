  md: '# The Novel in the Spanish Silver Age


    and similarly high result? Some previous papers have provided a few fields of
    metadata to the algorithm as features. In my research study, literary metadata
    has great importance as a controlled path of distant reading in order to obtain
    both more reliable evaluations and descriptions based on complex features, explained
    in more detail in Chapter 3.2. In Section 7.1.5, this literary metadata was passed
    on to the algorithm as features in several forms. But almost all the results failed
    to fulfill my expectations: Many of the subgenres with low results showed similar
    results; the overall classification not in comparison to improving linguistic
    features; and neither did the variance of the results decrease. However, a combination
    of linguistic and literary features brought slightly higher results. These results
    should not be an argument against literary metadata, but rather function as proof
    that many of our current intentions about genres are. As shown in Section 3.2.11
    and in the definition of subgenres in the Appendix, these literary metadata operate
    as an intermediary step between the basic linguistic information and the complex
    literary genres. They can be used to better understand the development of the
    history of literature, building bridges between Literary Studies and Computer
    Science. A current limitation is the lack of standardization for this type of
    information. I have undertaken a first step towards this goal: encoding it in
    TEI. However, much of the information does not have specific elements or attributes.
    It requires consensus in the community as far as specific information that should
    be marked is concerned, as well as the standards and formats that should be used.


    +   If the variance of the classification results is not caused by an unequal
    distance between the superficial linguistic features and the deep literary characteristics,
    what is it caused by? What exactly is the reason for the fact that the realist
    or social novel constantly obtain lower results than the erotic or adventural
    novel, regardless of the features? To answer this, in Chapter 7.2, I have evaluated
    a series of hypotheses about why some subgenres should be easier for the algorithms.
    The results contradict the plausible hypothesis that the 19th-century subgenres
    should achieve higher results. Instead, five variables correlate with the results:
    the number of texts and authors per category, their canonicity, the agreement
    on them, and the specificity of the features. These variables explain the majority
    of the variation of the results of the classification (0.63 R²). The specificity
    of the features in particular shows the strongest influence on the results and
    the strongest correlation with the rest of variables.'
