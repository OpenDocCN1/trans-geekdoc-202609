    In academia, there is no consensus about which status these one-authorlabels should
    have: Should they be considered more jokes of the authors or marketing strategies
    of the publishers? Should they be considered for tasks such as descriptions or
    classifications? Are they hyonyms of specific subgenres (for example, episodio
