- pgno: 446
  md: '# 11. Empirical Description through the Tripartite Graph Model




    Finally, this Appendix aims at offering empirical descriptions (or real definitions
    following Pawlowski''s terminology 1980, see Section 2.3.1) of each subgenre using
    the model presented in Chapter 8. The aim is to provide several short paragraphs
    summarizing the most important information about each subgenre, such as the results
    on classification, its canonicity, its main distinctive semantic, textual, and
    literary features (intention), the number of texts in the corpus (extension) and
    its best representatives (the ones that are most frequently asked to it), and
    its similarity to other subgenres in terms of shared features and texts (common
    neighbors). All this information has been extracted or can be calculated from
    the tripartite graph in different ways: by the size of the nodes, by counting
    nodes with specific characteristics, by observing its eigenvector centrality,
    or by obtaining the shared neighbors in the graph. In other words, the following
    paragraphs are mainly textual phrases of what has already been plotted as the
    entire network of subgenres, texts, and features.


    The intention of every subgenre is defined by the top specific features, both
    linguistic and literary, mentioning every which of these two types is more specific
    for the subgenre. Thus, the reader has access to the information of whether the
    category is defined by linguistic or literary information (see Section 7.1.5).
    The semantic features are grouped to give a more coherent overview, but the specific
    data from the dictionary by Maria Moliner or Wordnet are listed in parenthesis
    in their original language. These are sorted following their distinctiveness for
    the genre. Furthermore, I do not pick only the information that fits my concept
    of the genre correctly, but all the top features, in many cases indicating that
    their interpretation is unclear.'
  merge: -1
  img_proc: true
- pgno: 447
  md: '# The Novel in the Spanish Silver Age


    In any case, readers have access to the online repositories and the Jupyter Notebooks,
    in which the exact values for each subgenre can be observed, in addition to graphs
    as the one shown in Figure 112.


    To provide robust descriptions, two parallel graphs have been calculated, one
    on the larger but opportunistic CoNSSA-canon (see Section 3.1.6). Unless I make
    it explicit, all the information from the descriptions is based on observations
    from both corpora. In that manner, these descriptions are controlled against the
    potential bias of the composition of the corpus, and based on a statistical population
    based on manuals of literary history.


    The descriptions given in this Appendix can be contrasted with the conclusion
    from other scholars, summarized in Chapter 2.1. The subgenres are sorted according
    to their centrality, starting with the central subgenres, moving by step towards
    the periphery.




    In one of the network there are three subgenres with an eigenvector centrality
    of 0.26. One of them is the realist novel, a subgenre that does not have specific
    features (standard deviation of z-scores of 0.32). The subgenre covers 221 novels
    in CoNSSA, 103 novels in CoNSSA-canon, which makes it the largest subgenre in
    terms of instances. In general, the novels of this genre are highly canonized,
    with a mean of 1.5 pages per novel in the MdLE. The low specificity of the features
    explains a relatively low classification result of 0.81 F1-score.


    The features show higher distinctiveness for this subgenre are linguistic ones,
    such as vocabulary about negative actions or characteristics (as the semantic
    features from the dictionary by María Moliner *desecer, zaherir, criticar, abasar,
    avergonzar, desortós, grosero*, or negations), as well as words about the economy
    (*propiedad, pagar, retribución, prestar, lujo, lucir; or bien*, although this
    last is highly ambivalent), health (*salud*), and words that are difficult to
    interpret (*impulso, comprometer, and enszar*)


    From a literary metadata perspective, the strongest feature is a protagonist from
    lower classes of the society, followed by a realistic setting in Europe (mainly
    in Spain), with a heterodiegetic narrator.'
