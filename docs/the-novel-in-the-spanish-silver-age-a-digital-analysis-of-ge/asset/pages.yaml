    Schaeffer 2006, 7). It is a short text with the goal of describing several literary
    genres which became normative over time (Zymner 2003, 11–12). Aristotle distinguished
    two main genres for: the mode of imitation (lysis in Plato, Genette 1980), and
    the register of the imitation. Garrido Gallardo argues that Poetics has a mainly
    textual-linguistic perspective for the genres (1988, 17). In any case, this influential
