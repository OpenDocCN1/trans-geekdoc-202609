    # 8.3 Assembling the Graph Model for Genre


    In this section, the assignment of the model (following Weisberg’s terminol-

    ogy) is undertaken. I build up the assignment of the genres step-by-step, ei-

    er adding new data or new relations. The fundamental form of this model

    is a graph which is currently used in several research areas due to its capacity

    in representing scientific models (Zweig 2016, 366). There are several reasons

    for using this formalization: its flexibility, scalability, and its mathematical

    properties (such as the fact that it permits calculation of centrality, distances,

    or communities). In addition, it is implicitly mentioned in Wittgenstein’s'
