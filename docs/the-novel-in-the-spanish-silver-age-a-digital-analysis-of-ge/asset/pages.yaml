  md: '# 7.1.2 Subgenres as Classes: Multi-Class Classification from Modal Subgenre


    The scholastic-structuralist model (expressed as a taxonomy) understands genres
    and subgenres as classes (see Sections 2.3.2.1 and 2.3.3.1). In this paradigm,
    text belongs to a single subgenre. Metaphorically, the subgenres can be compared
    to branches of a tree, where each instance is a leaf hanging from a single branch.
    This abstract model could be fitted to Machine Learning as a multi-class classification
    task which the algorithm must predict a single categorical value for each text.
    This type of classification is more difficult for the algorithm than choosing
    whether a text or not belong to any category (multi-label classification). The
    multi-class approach is more difficult because for every instance, it has to choose
    one out of a list of several options. In my specific analysis, the algorithm needs
    to predict a value of 26 different subgenres for each text.


    This task has a strong requirement of the labels: Each text must belong to a single
    subgenre. This could be a better fit for research with a longitudinal historical
    perspective (Section 2.3.4), working, for example, with subgenre labels that the
    same author provided in different pare-texts, or from the reception and reviews
    of the time. My research, however, uses a cross-sectional perspective and as I
    have shown in Chapter 5.1, the data gathered does not represent the scholastic
    model. As a result, is it still appropriate to apply this task to my case? How
    is it possible to get a single value for each text, since I have observed that
    the sources tend to assign several subgenre labels to each text and these tend
    to disagree? One possibility is to choose a single source, for example, as discussed
    in Chapter 5.2. Another possibility is to apply my own annotation, using only
    the subgenre I believe is the most predominant for each text. Nevertheless, this
    decision would ignore the rest of the sources, and it is easily argued that my
    annotation could have been modified for increased accuracy, since the annotator
    of the subgenres is the same as the person running the classification, which could
    result in circular design. To ensure a more robust methodology, I propose to use
    the concept of modal value in Statistics as the most frequent categorical value
    for a given variable. For example, the work Witt in el canton, by Sender, is labeled
    in the following manner by several sources:'
