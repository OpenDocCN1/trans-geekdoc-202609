  md: '# 3.1.2 Literary Corpora


    Linguistics has been designing and collecting big amounts of text in form of digital
    corpora for decades, evolving into its own subarea: Corpus Linguistics (Sinclair
    1991; McEnery and Wilson 2001; Wynne 2004). This field has coined concepts such
    as balance and representativeness, created usual representations like keywords
    in context (KWIC), defined units like tokens and types, or proposed typologies
    for corpora. Most of these text collections are internally classified in subsections
    using information either from the text (language, genre, publishing date, format,
    etc.) or from their producers (typically the author''s gender and place of birth).


    For a few years, different projects of Digital Humanities led by literary scholars
    have been gathering large numbers of literary texts, mainly in English and Germany
    but also in other languages. The goal of these collections is not only to make
    texts available to the readers, but to analyze them through digital tools and
    methods such as Machine Learning (classification, clustering, Deep Learning, dimensionality
    reduction techniques like topic modeling, stylometry, etc.), or graphs networks.


    How should the literary corpora be designed for digital methods? In 2017, three
    different publications have shed light on this question from different perspectives.
    The first one is a chapter by Schoch (2017) about the compilation of data sets
    for the Humanities, with many examples about literature. One of the most interesting
    aspects of this article is the question about how the data set (for example, a
    corpus of Spanish novels from the 19th century) reflects the actual object of
    the study (all Spanish novels from the 19th century), also called population.
    In each research the population must be defined considering criteria like time,
    place, author, form, canonization and general size of the data set. Second, the
    data set can be:


    +   - A representative sample (with random selection of cases)

    - A balanced set (with a minimum number of cases for each possible combination
    of values of the criteria)

    - An opportunistic set (using as many already digitized cases as possible, the
    usual case)


    The second publication, by Percillier (2017), explores specific aspects (such
    as scanning and OCR processing) of the compilation of literary corpora and its'
  merge: -1
  img_proc: true
- pgno: 96
  md: 'quantitative analysis after the design and the criteria have already been specified.


    The third publication comes from the Review Journal for Digital Editions and Resources
    (RIDE). This journal of reviews about scholarly digital editions has published
    two issues in 2017 and 2018 (number 6 and 7) about text collections. In their
    preparation, the editors Henny-Krahmer and Neuber (2017) made the criteria available
