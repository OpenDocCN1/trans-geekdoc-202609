- pgno: 450
  md: '# 11. Empirical Description through the Tripartite Graph Model 451


    The most similar genres are the realist novel (31% of shared features), followed
    closely by literary fiction and the social novel (30%), philosophical novel and
    memoir (29%).


    # 11.6 Philosophical Novel


    The philosophical novel has an eigenvector centrality of 0.19, which is produced
    by a relatively low specificity of the features (standard deviation of z-scores
    of 0.34). This category is populated by 88 texts in CoNSSA, 45 texts in CoNSSA-canon,
    with a relatively high canonization status (1.35 pages in the MdLE, in CoNSSA-canon).
    All explains the low classification result of 0.77 F1-score.


    The features that are most specific for this subgenre are semantic features about
    cognitive (vac, deschar) and social processes (estudiar, enseñar, protestar, imaginar,
    describir) school (colegio, universidad), relatively general concepts (mundo,
    literatura, mecánica, categoria, lista), or qualitative adjectives (im-positivo,
    exacto, extravagante), besides the quotation mark and a large number of sections
    (divisions inside a chapter). Furthermore, a series of literary characteristics
    are specific for them, such as a setting in Italy or Africa, either with the plot
    taking place completely in towns or several types of settings (for example, the
    stands to be in a city and the continuation in rural places). The narrator tends
    to be homodie, the protagonist male, and the ending tends to be either uncertain
    or partially negative.


    Some of the texts identified with high frequency are La pata de la raposa y Troteras
    y zaraderas by Pérez de Ayala, Un intelectual y su carcoma by Verdaguer, Locura
    y muerte de Nadie by Jarnés, Cinematógrafo by Carrananque, o La piedra angular
    by Bazán.


    The subgenres that share a larger proportion of features and texts with the philosophical
    novels are the educational novel (29%), and a clear step behind the social novel
    (21%), the comedy novel (20%), literary fiction, and memoir (both with 20%).


    # 11.7 Naturalist Novel


    The naturalist novel (along with the subgenre will be described in the next section)
    can be found in the value 0.18 eigenvector centrality. The naturalist'
