    genres in a hierarchy of the genres (Zimmer 2003, 27–28). The idea of a degree
    of belonging to a form or mode was used later by thinkers such as Petersen (1944),
    which will be discussed in later sections.


    The question about the number of genres that a text might belong to is open. Many
    works imply that a text belongs to single genre, particularly if the research
