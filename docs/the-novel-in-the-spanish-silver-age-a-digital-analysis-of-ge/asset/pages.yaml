    # 3.1.8 Digitization Steps


    The corpus is encoded in XML (as recommended in Percillier 2017) using the Text
    Encoding Initiate (TEI, recommended in Ajen 2015; Schöch 2017). The step between
    the input format (normally HTML or similar) to TEI is implemented in Python scripts
    using mainly regular expressions. In the cases no markup is found, I used PDF
    documents processed with the OCR Software by the company Abby (FineReader and
    Recognition Service). They were exported as HTML files,¹¹⁷ joining the rest of
    the workflow mentioned before.


    Once the TEI XML is well-formed, the elements div were encoded with a type attribute
    to distinguish the different levels of text within, with the following possible
    values:


    +   - section: smaller unit than chapter¹⁸

    - master: most common division of text (mandatory in every file)¹⁹

    - part: greater unit than chapters (holonym of chapter)

    - division: holonomy of parts²⁰


    The Table of Content of the digital source was compared to the digital Table of
    Content of the XML file (called outlier in the program Oxygen XML Editor) to control
    whether the file has lost spans of text during the conversion. In the cases in
    which the text was digitized by the project, the PDF was also controlled to avoid
    mistakes and mark textual elements, as poems or floating texts.


    After that, the metadata of the texts were manually assigned. An abstract of the
    book is copied (if available, quoting the source), or composed (if I personally
    read the text) in the abstract element of the header. For this infor'
