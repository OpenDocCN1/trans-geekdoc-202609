- pgno: 414
  md: 'The easy subgenres tend to be the ones that have features that are more distinct,
    i.e. that are not shared with other categories. Vocabulary about eroticism or
    adventure are not frequent in erotic and adventure novel, while rare in other
    categories, i.e. they are very specific for their subgenres. In contrast, social
    or realist topics are present in many subgenres, they are not specific enough
    to distinguish the social and realist novel from the rest. Thus, I have shown
    that Machine Learning methods cannot only be applied to literary genres, their
    results can also be explained by combining literary data and statistical methods.


    All questions distributed across separate chapters resemble the parable about
    the blind men and the elephant. In this story, the blind men encounter for the
    first time a pachyderm and each touches a part of it and describes what their
    experience: A part of the elephant feels like a snake (trunk), a spur (tusk),
    a fan (ear), a tree (leg), a wall (gut), or a rope (tail). All these descriptions
    are unconnected to the rest and it is unknown how they fit together, what the
    elephant in its integrity should look like. Similarly, the individual chapters
    do not offer a comprehensive picture of the analyzed object: literary genre.


    In the classic theoretical scholastic model, each text belongs to a genre based
    on a series of necessary and sufficient conditions. In this model, a taxonomy
    emerges in which a genre (for example, war novel) belongs to a more general category
    or *genus proximum* (historical novel) based on its *differentia specifica*. This
    elegant and intuitive model is rooted in the way our society and a section of
    current research comprehends genres, but it fails when we try to add examples.
    Proposing an alternative and comprehensive model for genre is the goal of Chapter
    8, where the main elements used for the classification of subgenres are features
    (linguistic and literary ones), texts (instances), and genre-labels (categories).
    The model is ruled by the following principles⁵⁵


    +   1. Texts participate in any number of genres (from zero to multiple genres).

    2. Some texts participate more intensely in some genres than others (a relation
    which can be formalized using the proportion of sources assigning each label).'
  merge: -1
  img_proc: true
- pgno: 415
  md: '+   3. Texts hold distinctive features, overrepresented in comparison to the
    rest of the corpus. This distinctiveness can be formalized in the calculation
    of z-scores.


    +   4. The genres also show distinctive features in comparison to the rest of
    the genres. Again, this can be measured through the z-scores of the mean values
    of all texts belonging to the category.


    This abstract model can be expressed in a tripartite graph in which all labels,
    features, and texts correspond to separate but connected partitions of nodes.
    All the connections (edges) are weighted: Some texts belong more clearly to a
    label than others. This is the main novelty of the prototype theory, i.e. that
    some instances are better representatives of a category than others. The texts
    assigned with a given subgenre tend to share a series of features, which constitute
    the distinctive features of the subgenre, but not all texts of the subgenre present
    all these features. It happens that texts also present some distinctive features
    of other subgenres, even though they do not belong to them. This complex criss-cross
    pattern of features, categories, and instances is better described by the family
    resemblance model, in which not all members of the family have to share all physical
    traits, and in which these traits can also be found in other families. By only
    combining the prototype and the family resemblance theories can emerge an alternative
    to the scholastic model which can accurately represent the data obtained throughout
    all chapters (Figure 113).


    This model is not only able to fit hundreds of instances of the different types
    of elements and their interactions, it is also able to reproduce or quantify other
    aspects of genre. The evaluation of the model (Section 8.5) has shown that the
    centrality of the network* has an intuitive interpretation for both the genres
    and the texts. The subgenres in the center of the graph tend to yield lower results
    in the classification. The explanation for this is that these central subgenres
    share many features with the rest of the categories, and therefore the algorithm
    is not able to distinguish them correctly. In addition, these central subgenres
    are populated by literary works that tend to'
  merge: -1
  img_proc: true
- pgno: 416
  md: '# Figure 13: Tripartite graph with three subgenres (purple), their texts (green),
    and features (blue)


    ![](img/98c86d70e9e43286af05120dbff29113_416_0.png)


    be highly canonized (realist, educational novel, literary fiction). In the periphery
    of the graph the subgenres with very specific or distinctive features that are
    not shared with other categories. This high specificity allows the algorithm to
    classify them perfectly. The peripheral subgenres are either popular subgenres
    (war, erotic, costumbrist novels) or produced by one or few authors (episodio
    nacional, griergas, novola, dialogue novel).


    Another possibility of the model that has been evaluated is its capacity to measure
    the similarity between pairs of subgenres. When two category nodes have many common
    neighbors, it means they share many features and texts, and when the networks
    are visualized,'
  merge: -1
  img_proc: true
- pgno: 417
  md: 'this similarity is shown as proximity: If two subgenres are close in the net-work,
    they are similar.


    In addition, the graph gives rise to further mathematical possibilities that can
    be applied to answer new questions about genres. For example, the question of
    whether some categories constitute intermediate groups of genres (macro-genres)
    can be answered through community detection in the network. A first attempt shows
    that, apart from the case of the *greguerías*, the subgenres of this period do
    not show any genres of genres. There is no evidence that canonic subgenres (educational,
    realist, naturalist novels, literary fiction) cluster more tightly together, nor
    are there other groups, like the adventure-historical macro-genre. Even though
    these subgenres share similarities, they are not separated from the rest to constitute
    their category at a higher level. However, other periods or languages could show
    these intermediate groups of genres, as the classical French drama or the genres
    of the Bible (see Section 8.6 and Calvo Tello 2020). In other words, the tripartite
    graph model is able to find macro-genres, but it does not impose them as the scholastic
    taxonomy does genres. In this way, the researcher can maintain a descriptive attitude
    towards genres, rejecting prescriptive axioms about how they should be structured.


    The results have led me to be very critical with taxonomies as a model for genres.
    However, it is only fair to admit that, at the beginning of this project, I implicitly
    accepted the taxonomy of genres and this skewed the gathering of the data and
    the research questions. My goal was to analyze subgenres of the novel, such as
    the adventure novel, connected to a more general category, the novel. On the one
    hand, this helped me to structure the phases of my research. In any case, the
    taxonomies as a complete model for genre are not able to fit the texts in them:
    As observed again and again in the different chapters, texts can belong to any
    number of categories and this relation is better described in ordinal terms than
    categorical ones. These two characteristics are hard to model in a taxonomy. However,
    taxonomies can only be useful as macro-models for genres, i.e., they can only
    be used to describe the relations between different categories.'
  merge: -1
  img_proc: true
- pgno: 418
  md: 'In Section 8.7, I have extracted information from the tripartite graph model
    in order to define four subgenres (realistic, historical, erotic novel and literary
    fiction) in empirical terms. More specifically, the data in these descriptions
    comes from either the attributes of the nodes and edges, the calculations in the
    model, or the semantic or literary features used as a partition of nodes. The
    Appendix contains a comprehensive list of definitions for all 26 subgenres analyzed.
    These descriptions represent a solid step towards accurate empirical descriptions
    about how the subgenres of this period can be understood. Other researchers can
    contrast them with previous or future research. In any case, these descriptions
    should not be understood as final definitions, since the use of other texts, sources,
    labels, features, or parameters can change them. They are a solid step towards
    more exactitude in definitions, but just one step.


    As mentioned before, this research takes a cross-sectional perspective and data
    was collected for this purpose. Therefore, the conclusions do not try to reflect
    any aspect of the historical development of these categories. This constitutes
    one of the greatest challenges for further research: to add a chronological dimension
    to the analysis in two ways. First, the publication of the ConSSA makes more data
    available for future investigators. Second, from the methodological point of view,
    the tripartite graph could be enriched with the characteristics of temporal graphs,
    in which the genres and the texts would evolve dynamically through time.


    More access to texts could lead to more comprehensive projects, but the publication
    of other types of data would also represent important milestones. Scholars from
    Literary Studies could publish formalized annotations about literary phenomena,
    as literary features to analyze them through computational means. The digitization
    of historical sources such as catalogs could be used to reconstruct the reception
    of specific genres and constitute a source for historical labels. Full access
    to newspapers published during the authors'' lives, journals, essays, and personal
    documents from the authors could lead to the retrieval of the subgenre that the
    author intended for a text, and how it was received by the public.


    Another aspect that would be positive is more frequent access to the code used
    by researchers. In the past years, publishing scripts or Jupyter notebooks have
    become an increasingly normal practice for sharing code in the frame of conference
    papers or journal articles. Still, they are rarely present in'
  merge: -1
  img_proc: true
- pgno: 419
  md: 'more comprehensive works, such as monographs⁸ or PhD theses (cfr. Dombrowski,
    Gniady, and Kloster 2019). In my case, any person can have access to the repositories
    containing the Python scripts with the functions. In addition, every chapter has
    a Lypter Notebook companion in which it is documented functions were called, the
    exact parameters, and the actual results. However, this does not imply that the
    entire research can be replicated at any moment. Some data is still protected
    by copyright. Another aspect is related to the fact that the libraries and the
    programming languages are constantly being developed, causing conflicts and differences
    in the results over time. Scientific research needs to explore more user-friendly
    ways to archive software for future decades that are suited for personal projects
    such as dissertations. In addition, more radical forms of integration between
    scientific prose and coding should be explored. Perhaps future dissertations with
    a computational interest should be written directly in formats similar to a Jupyter
    Notebook.


    As the majority of studies about literature, this work analyzes one period of
    the literary texts of one language. As described before, I have already begun
    applying the tripartite graph model for genre in other corpora, as classical French
    drama and the genres of the Bible, with very similar results (Calvo Tello 2020).
    If the model is efficient to accurately describe many properties of the problematic
    subgenres of the Spanish novel between 1880 and 1939, I do not have reason to
    think that it would not be possible to do with data the features and texts of
    other genres would create anything different from a common cross-cross pattern.
    However, as I have experienced many times throughout the elaboration of this book,
    real data can always satisfy powerful and solid intuitions. A more radical challenge
    would be to try to fix cases from other media into this model, such as paintings,
    music, comics, or video.


    Considering again the pairrable of the blind man and the elephant, this book would
    be an interdisciplinary blind man, perched on the neck of the animal. From here,
    he reaches with his hands the parts that he has access to. He still not reach
    the legs or tails, which hinders an accurate, complete sense of the pachiderm.
    The combination of disciplines has enabled me to obtain results that would not
    have been possible otherwise: literary genres rely'
  merge: -1
  img_proc: true
