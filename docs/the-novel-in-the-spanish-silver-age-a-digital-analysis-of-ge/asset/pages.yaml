  md: '# 5.2 Analysis of Labels of First Editions


    An important distinction in the sources of labels is whether the labels were assigned
    contemporary to the production of the text or whether they were produced decades
    or centuries later. Most sources consulted in this thesis were assigned at least
    half century after the first publication of the text, more specifically after
    1980. The labeling process can be influenced by how the society canonizes and
    considers the text and author through history.


    There are two competing hypotheses about the difference between early and later
    labels:


    +   1. The early labels (assigned during or soon after the first publication)
    received iff from external processes regarding the text and its author; these
    labels would have been assigned by internal characteristics of the text, and therefore
    these labels should be classified more accurately using features extracted from
    the text.


    +   2. The early labels do not rely heavily on internal features than the later
    ones. Both author and first publisher had greater control over the label on the
    cover, and they used it rather to surprise the public than catalog the work.


    Both hypotheses are reasonable and both outcomes are possible, depending on the
    languages, tradition, or periods analyzed. On the one hand, a generic label on
    the cover, such as *novel or drama*, is mentioned many times as evidence for the
    very existences of genres: We find these labels on the cover of many books. On
    the other hand, it is also common to read the skepticism of scholars about the
    accuracy of such labels (Garrido Gallardo 1981; Bortret 2001, 38–45), with clear
    examples of authors using labels that do not match the book in a traditional way,
    such as *Divina comedia* by Dante or *Comédie humaine* by Balzac (both mentioned
    in Petersen 1944, 120). Besides, "some genres we'
