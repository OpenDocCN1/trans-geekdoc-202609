    As I have described in Chapter 2.2, the multi-genre assignment is the most typical
    perspective for computational studies, normally treated as a multi-label classification
    task: Any text is assigned to one or more labels and the algorithm is trained
    to classify each text as either being part of a group or not being part of it.
    This multi-label macro-model is able to fit the fact that normally genres use
    several categories for each text rather than a single category. Nevertheless,
