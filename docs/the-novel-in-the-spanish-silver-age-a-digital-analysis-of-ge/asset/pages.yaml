  md: '# 5.1.8 Discussion and Proposal of Subgenre Palette


    Chapter 5.1 opened with a list of 292 token-labels and ends with a palette of
    23 consistent semantic-labels of subgenre. Considering that the corpus contains
    358 texts, I have moved from a ratio of 1.4 texts to 15.57. Through the different
    steps, I have observed that the variance in the labels in different sources is
    caused to a large degree by superficial linguistic variance such as multilingual,
    morphological or lexical forms. I subsequently contemplated the agreement of subgenre
    from distinct sources, such as two manuals of literature, this agreement is very
    weak (median of 0.14 Kappa-values for the different subgenres). These results
    are far lower than what Computer Science usually acceptable. A large proportion
    of subgenres used by certain sources did not show any consistency or extremely
    low. I have no evidence that humans share a basic concept of many subgenres, except
    of ones for this period as *de tesis, moral, regeneracionista, sentimental.*


    As described in Chapter 2.2 about computational analysis of genre, reporting values
    of 0.9 for the novel and 0.5 for different genres. The agreement for finer categories
    as subgenres is expected to be lower. We expect humans to have more difficulties
    distinguishing between the types of novels when differentiating a novel from an
    essay. In any case, the study on human agreement in subgenres is an interesting
    area with little research and many questions. Do the annotators need to be specialists?
    How much text do they have to read to recognize the subgenre? Should it be a page,
    a chapter, or do they have to read the entire text or anything about the text?
    Should they be familiar with the author? Should they work with a finite palette
    or propose their own labels?


    As pointed out in Chapters 2.1 and 2.3, the opinion that genres do not exist,
    is a century old. The work that computational methods have achieved in the last
    decades clearly shows that genres and subgenres are labels that can be predicted
    reasonably by algorithms using linguistic features. From this chapter, I agree
    that many literary subgenres do not show any human agreement, and that in general
    subgenres are only partially recognized by humans.


    The final palette of 23 subgenres can be understood as a set of consistent semantic-labels
