    # 2.3.2 Models of Genres


    In this section I will introduce four models that describe the interaction between
    instances, characteristics and categories: the scholastic-structuralist model,
    hybridism, family resemblance and prototypes.


    # 2.3.2.1 Classic Scholastic-Structuralist Model


    The definis or concept of a linguistic symbol can be split into the two concepts
    introduced by Aristotle in the traditional scholastic schema of genus proximum
    and differentia specifica (Atkins and Rundell 2008, 414–55). Using the classic
    example, a bachelor would be a person (genus proximum), that is male, adult, and
    unmarried (differentia specifica). This model has been applied in many cases to
    genres and ultimately results in the development of tree-like structures or taxonomies
    in which finer concepts (such as the subgenre novel) have a more general genus
    (historical novel), repeating the process any number of times (e.g. war novel
    > historical novel > novel > literary prose texts > literary texts > texts). The
    application and critique of taxonomies of genres will be discussed in the next
    section about the structure of genres.


    From a logical point of view, the components of a definition are understood as
    necessary and sufficient conditions. For a person (referred) to be labeled a bachelor
    (term), they must have several characteristics: It is necessary for them to be
    male, but this is not sufficient; it is also necessary to be unmarried, but again,
    this alone is not sufficient. Only an unmarried, male adult has the necessary
    and necessary conditions to be referred to a bachelor. Likewise, and following
    the previously given definition, a setting in the past was a necessary but not
    sufficient condition for a novel to be a historical novel; it also has to be on
    facts.


    This classic semantic model was further developed in structuralism, following
    the example of the phonemes, which are defined by binary values in a series of
    phonetic features such as vocal, labial, dental, etc. This scheme has been adapted
    to the area of lexical fields, analyzing, for example, several'
