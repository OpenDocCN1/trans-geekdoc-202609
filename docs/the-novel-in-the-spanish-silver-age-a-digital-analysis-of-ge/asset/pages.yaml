    # 2.2.6 Conclusions and General Patterns


    What are the general patterns of this short history of computational methods for
    the analysis of genre? First, the great majority of researchers have worked only
    with English sources, with some exceptions using texts in German, French, Spanish,
    or Greek. Two important historical developments occurred as far as the type of
    analyzed texts is concerned. While during the 2000s, genre classification was
    a common task in Computational Linguistics, the topic has become a trend in DH
    the 2010s. Along with this change, in the later period the focus has shifted from
    broader genres (journalistic texts, Web corpora) towards literary subgenres, mostly
    prose. Most works have adhered to palettes of genres, in many cases obtained from
    author works or catalogs. Some papers do not give acceptable results for sampling
    of the corpus (Kessler, Numberberg, and Schütze 1999) or genres (Cerví Beresi
    et al. 2004). Few works have compared the assignment of labels from different
    sources or annotators (Berninger, Kim, and Ross 2008; Santini 2011). Even though
    the community might feel that the size of the corpus is increasing, a linear regression
    of the size of the corpus and the year of the corpus around 200 texts (further
    details can be observed in the Jupyter Notebook of this chapter). Apparently,
    the corpora analyzed in recent years are not larger, but the kind of genres are
    more specific: While in previous decades we could analyze very general genres,
    currently the focus is on specific literary subgenres.


    Clearly, the most useful features are lexical information (either as frequencies
    or transformed in differing ways such as z-scores or tf-idf). The only work with
    differing results is Stamatatos, Fakotakis, and Kokkinakis (2001). However, they
    only 50 lexical features, a number that has been widely surpassed in the last
    50 years (as examples, 1,000 in Underwood 2014, 3,000 in Hettinger et al. 2016).
    Even though there is research which suggests that some of the best features to
    distinguish genres are punctuation or functional words, many researchers delete
    stop words, punctuation, or leave the punctuation as part of the tokens. When
    used, the grammatical information normally brings higher performance to the classification
    when the informa-'
