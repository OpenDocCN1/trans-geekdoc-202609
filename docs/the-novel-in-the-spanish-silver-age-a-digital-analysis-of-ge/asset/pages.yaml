    To identify how distinctive the features of each subgenre, I first summarize each
    subgenre with the mean values of each feature (both linguistic and literary).
    From this data, the z-scores of each feature are calculated, and the distinctiveness
    of each feature for each subgenre is obtained. The z-scores then express the difference
    between the value of this subgenre in comparison to the rest of the subgenres,
    expressed as standard deviations. For example, the war novel assigns a z-score
    of 4.16 to the feature that the protagonist is a military character, and a z-score
    of 2.53 to the frequency of the word hombres (''men''). This shows that the means
    of these features in this category are greater than in other subgenres, or, in
    other words, that they are overrepresented in these categories, these are distinctive
    features for this subgenre.


    The next step is to obtain a single value for each subgenre the variation of the
    values in those z-scores. To obtain this, the standard deviation of the z-scores
    of all features was calculated. A large standard deviation represents features
