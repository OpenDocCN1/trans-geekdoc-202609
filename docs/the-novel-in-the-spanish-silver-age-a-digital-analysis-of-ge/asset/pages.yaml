- pgno: 294
  md: '# 6.2 Identification of Hidden Subgenres




    One of the disadvantages of the classification tasks in Machine Learning is that
    it requires a closed and clear set of labels. In this way, classification only
    allows the researcher to inspect already given categories but not detect new ones.
    In other words, classification presupposes that the genre palette is complete.
    What if there are subgenres that have not yet been detected? And if so, how can
    the process and these hypothetical genres be evaluated?


    The standard sources for genre labels are human institutions. The author is often
    seen as the most accurate source, but others as publishers, catalogs, readers,
    or investigators are also considered. This human process of categorizing texts
    in groups is what Todorov has proposed as a defining criterion for genres: "classes
    of texts that have been perceived as such in the course of history" (1976, 162).


    The task of detecting new genres has been called genre identification in Computer
    Science and, to my knowledge, only one study has addressed it: Santini (2007;
    2010; 2011). In his thesis (2011), Santini follows the hypothesis that new genres
    have been developing on the Internet, groups of texts participating in textual
    contexts, at the time, had not been labeled by humans. For this purpose, he first
    employs the PCA components as features. The second one uses syntactic, morphological,
    and layout features (converting their frequency into z-scores), and then applies
    k-means as clustering algorithms. In the first experiment, the sensed tended to
    cluster according to discursive patterns, such as informational, instructional,
    argumentative, descriptive, etc. In the second, he obtained two emerging genres:
    contact web pages, and fast-effective information delivery (websites composed
    by pictures and short texts, heavily hyperlinked, such as in e-shops or galleries
    of pictures).'
  merge: -1
  img_proc: true
- pgno: 295
  md: '# The Novel in the Spanish Silver Age


    The novels of the 19th and 20th centuries are very different materials from those
    currently found on the Internet. While the literature of the silver age has remained
    mainly a closed object of analysis for many decades, the Web grows daily. I am
    not looking for emerging genres in the late 19th century or the beginning of the
    20th century. As I have shown in Section 2.1.2, Literary Studies have mainly focused
    on one or a few authors in their analysis. Therefore, linguistic or literary similarities
    could have been overlooked between novels written by authors who do not compound
    a generation and are normally analyzed together. My hypothesis for this chapter
    is that such subgenres exist and that they can be identified through unsupervised
    Machine Learning methods. This potential clustering should show similar properties
    to the rest of the subgenres obtained in Chapters 5.1 and 5.3.


    Of course, no cluster grouping a number of texts should be accepted as a hypothetical
    new subgenre. As Todorov argued: "one can always find a property common to two
    texts, and therefore put them in one class" (1976, 162). To be accepted as possible
    genres, I propose that the clusters must fulfill three criteria:


    +   1. Recurring: The clusters should be found repeatedly in several attempts,
    using different combinations of parameters.

    2. Not explainable by other subgenres, authorship, or periodization: The texts
    of the obtained clusters should mainly not belong to the author, same decade,
    or be part of a known subgenre. In other words, the clusters should not be explained
    by already known categories such as authorship, chronology, or other common genre
    labels.

    3. Explainable by complex features: The clusters should show statistical differences
    in the more complex annotation (textual and semantic) and metadata as a basis
    for their explanation.


    In the sections of this chapter, I will proceed as follows: First, I explore the
    tendencies of the clustering methods when using literary texts. Second, I present
    the problem and a possible solution to the authorship cause in clustering literature.
    Third, I evaluate several parameters, such as the clustering algorithm, the number
    of features, the transformation of data, and the number of clusters. Fourth, I
    observe the three criteria previously explained, which means that I look for recurrent
    clusters across types of features and iterations while evaluating the mentioned
    criteria, compare them with already known cate'
  merge: -1
  img_proc: true
