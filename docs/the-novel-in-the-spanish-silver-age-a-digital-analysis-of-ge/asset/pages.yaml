- pgno: 375
  md: 'But, how can it be determined whether a feature is distinctive to a text?

    Several traditions formalize distinctiveness using different metrics, such as
    weights of features of classifiers in Machine Learning, Zeta values in stylometry,
    z-scores in Linguistics, z-scores in Statistics, I use z-scores (described in
    depth in 4.2.2.6.) for several reasons:


    +   1. A z-score is a standard and simple measure from Statistics.

    2. It does not have any parameters.

    3. Its calculation is deterministic (meaning that none of the steps of its calculation
    uses randomness).

    4. The scores are expressed in standard deviations, which is a more intuitive
    metric than the other measurements.

    5. These are not only a normalization of the data, but can be understood as a
    statistical test for whether a feature is overrepresented in an instance in comparison
    to the rest of the data set.


    In any case, other numerical metrics can be applied if other traditions or arguments
    are preferred.

    The texts mentioned above can be described with those features that have a high
    z-score.¹ This can be formalized in a bipartite graph, shown in Figure 104, composed
    of nodes (shown as blue nodes) and texts (green). Two nodes of both partitions
    are connected when their z-scores are high enough, in other words, over a given
    threshold (for example higher than1.5 standard deviations, which also keeps the
    number of features acceptable for the size of the following visualizations). The
    edge is weighted with the exact z-score, which is shown as the thickness. To reinforce
    a later interpretation of this model and its application for description, I only
    use relatively abstract features, such as textual features (of verses, proportion
    of direct speech), semantic features (from WordNet and the dictionary by Maria
    Moliner), grammatical annotation, and literary metadata.

    The three novels of Figure 104 show distinctive features: Cues that are overrepresented
    in these texts in comparison with the rest of the corpus. In other words, these
    are features that have higher z-scores in these texts than'
