- pgno: 14
  md: '# Acknowledgements


    The fact that I am the only author of this work does not mean that I could have
    done it without the support of many. This can also be explained as a series of
    steps in life, and I thank God for those. I imagined I could be able to write
    a book of more than 400 pages about literature enjoying most of the process. God
    does move in mysterious ways.


    There are two groups of people that have helped me through this process: the professional
    and the personal. These can be structured in concentric circles, moving closer
    towards them.


    The largest groups of professionals I am thankful to, are two communities that
    have made many steps of this work possible. The first one are generous contributors
    of Stack Overflow,¹ from whom I have learned so much, from their questions and
    their answers (to me or to other people). The second one are the hardworking editors
    of epublic,² a source from which I have extracted many texts, labels, and summaries.
    Thanks to both communities.


    The second circle is populated by researchers who have offered their time to teach
    me, debate, or give me personal feedback. I have learned a lot from the workshops
    of researchers such as Maciej Eder, Jan Rybicki, Mike Kestemont, Frank Fischer,
    Helena Bermúdez Sabel, and Pablo Ruiz Fabo. I have enjoyed the motivating exchange
    with Laura Hernández Lorenzo and Daniil Skorinkin, and appreciate deeply the support
    and collaboration with Elena Martínez Carro, María Concepción Jiménez Fernández,
    and Maria Teresa Santa María Fernández. The feedback of several colleagues, especially
    over the last months, has been very valuable, for example, from Pablo Jauralde
    Pou, José Teruel Benavente, Brigitte Burrichter, Dolores Romero López, Nanette
    Riefler-Pipka, Corina Koolen, Peggy Bockwinkel, Hugh Craig,'
