- pgno: 32
  md: '# 2.1 Silver Age: Genre, Novel, and Subgenre of the Novel




    This chapter introduces the analyzed period of Spanish literature, called the
    silver age (edad de plata), and how how novels were understood and written at
    that time. I will point out the different reasons why the analysis of literary
    genres of this period is challenging: First, authors tried to avoid already existing
    subgenres and tended to create their own. Second, literary scholars have preferred
    to study the works of single authors instead of shared genres across this period.
    The relationship between the novel and other genres will be summarized and I will
    describe some subgenres that have received more attention from Literary Studies.




    In the history of Spanish literature, two periods show a rise in the number of
    important creators and works: first, the Renaissance and the Baroque; second,
    the decades between the end of the 19th century and the Spanish Civil War (1936-1939).
    The first one is undoubtedly referred to as the *siglo de oro* or golden age,
    following the metaphor used for the periodization of Latin literature. An extension
    of this label has been used for the second period of splendor: *edad de plata*
    or silver age. Since 1974, José-Carlos Mainer has popularized this term as a generic
    frame for several generations (*regeneracionistas, modernistas, generación del
    98, generación del 14, generación del 27, generación del 36*) and isolated authors
    (Juan Ramón Jiménez, Ramón Gómez de la Serna). For a discussion of the term *modernist*
    for this period, Romero López (1997 and 1998).'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# The Novel in the Spanish Silver Age


    The writers of these generations tend to be profusely analyzed focusing on few
    or only one author. This even happens when one single piece of research treats
    several authors, who are normally analyzed in separate chapters or sections, like
    García Nora''s classic La novela española contemporánea (1963). Here, the researcher
    directly analyzes specific authors without a general overview of the novel during
    the period and revolves around one author. Another example is the monograph by
    Landeiro (1985), in which he analyzes six authors, using a different chapter for
    each one of them and a different subgenre: Blasco Ibáñez and the naturalist novel;
    Miguel de Unamuno and the existentialist novel... This isolated analysis of the
    authors tends to highlight the differences and exceptional features of each of
    them, minimizing the general patterns among distinct texts that would exist if
    they practiced similar subgenres. The marked tendency of treating authors disjointedly
    is probably one of the reasons why this period, compared to the golden age, lacks
    academic institutionalization such as journals, conferences, associations, etc.


    This period is contextualized in the international movement of modernism, with
    particularly strong relations with the artistic situation of the rest of Europe
    and Latin America (Shaw 2010; Novillo-Corvalán 2017). Some scholars have described
    this period as "a cosmopolitan movement in literature whose crisis of representation
    evident in modernism has its roots in other crises: of faith, of reason, of liberalism,
    of empire" (Lewis 2011, 1). For Calinesco, this crisis takes the form of a rejection
    of tradition with "increasing violence" that opened the path of the rebellious
    avant-gardes (Calinesco 1987, 5). Other authors have described these works as
    "responses to the prevalent cultural and political crisis" (Bru 2009, 9), which
    strongly influenced the Spanish literature of that time (Romero López 1997, 20–4).
    Some authors have stated that the aesthetic change that modernism represents ("the
    Great Divide") is "the greatest of all divisions in the history of western man"
    (Bradbury and McFarland 1978, 20–21).


    In the case of Spain, the chronological boundaries of this period have been in
    movement and expansion. In the first edition of his manual (1975), Mainer starts
    analyzing the period between 1902 and 1931, expanding to 1939 in later editions,
    and from 1900 to 1939 in his volume of the series Historia de la Literatura Española
    (HdLE, Mainer 2010). Abad Nebot moves the starting point of this period to 1868
    (2007), which has been accepted by one of the most active groups concerned with
    this period, at the Universidad Complutense in Madrid (Romero López 2014).'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# 2.1 Silver Age: Genre, Novel, and Subgenre of the Novel 35


    This can be considered one of the most central research groups about the silver
    age with an important focus on digital methods, creating a Web platform for the
    query of metadata about authors and works, especially from non-canonical authors
    (''raros y olvidados'') called Mnemosyne (Romero López 2012). Other DH groups
    have positioned their research in this period, probably because of their interests
    in large-scale analysis. Hence, there are several international groups analyzing
    and editing theater (GHEDI, by Santa Maria Fernández, at UNIR in Madrid), collecting
    ephemeral publications and bibliography about (Revistas Culturales 2.0., by Ehrlicher
    in Tübingen), erotic novels (Virtual Wunderkammer, by Zubaurra in Berkeley) or
    more specific genres analyzing the works of a particular creator such as Picasso
    (by Mallen in Texas), Valle-Inclán (by Santos Zas in Santiago de Compostela) or
    Galdos (Isasi 2017).


    # 2.1.3 Literary Genre and Novel in this Period


    In this section, I use the information and previous research from the area of
    Literary Studies to create an overview of the novel as well as the genre, which
    has been constantly constituted and revised. In Mainer''s opinion, "the conventional
    literary genres were resolutely iconoclast" (Mainer, Alvar, and Navarro 1997,
    557, my translation), and Buckley refer to an overflow of the generic boundaries
    of poetry and prose, and novel and story, drama and cinematic image, [which] create
    what are in new modes of expression" (2008, 45). Longhurst describes the modernist
    novel in a broader frame as "incontvertibly and self-consciously different" (1999,
    2). Ródenas de Moya translates the opinion of the Spanish poet Guillermo de la
    Torre: "we all agree that: the <literary genres> hardly exist now" (2000, 9, my
    translation). The best-known defender of the absence of genres in this time was
    Benedetto Croce, the Italian intellectual who published the *Estetica scienza
    dell''espressione e linguistica generale* in 1992 with great impact across Europe
    and America, a text I will come back to in Section 2.3.2.1.


    Opinions about the specific genre of the novel during this period are similar.
    Ródenas de Moya (2000, 89–90), Altisent (2008, 2–3), and Longhurst (2008, 41)
    hypothesize a hybridization of the novel, mixing with other genres like the essay,
    autobiography, lyrical poetry, cinema, or philosophy. The novelist Antonio Espina
    uses the word *monrous* to refer to the novel in an exceptional quote from his
    work *Luna de copas* where he presents the cre-'
