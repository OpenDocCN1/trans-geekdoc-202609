- pgno: 365
  md: 'An interesting fact is that some of these five variables are not based on the
    text and are easy to obtain without digitization: canonicity and number of authors.
    This means that I could have predicted to a certain degree how high the results
    of classification would be, even before having the actual texts. When running
    the regression with only these two variables, the R² value is .48 (p-value of
    F-statistic < .01), which is is a rather high result when considering the simplicity
    of the data used.


    # 7.2.9 Conclusions


    In any paper on computational analysis of genre, it can always be observed that
    some categories achieve a much higher result than others. I have conducted a series
    of hypotheses tests to try and explain this variation and find the possible reasons
    for it. In each instance, I measured the correlation between the classification
    results of the subgenre and a second variable. Five of these variables are statistically
    associated with the classification results: especially number of authors, canonicity,
    number of texts per subgenre, and the specificity of their features. When regression
    analyses are run, the results account for the majority of the variation of the
    classification results, up to .0.63 R². Subgenres are not more difficult to predict
    because their defining features are not expressed at the linguistic surface, but
    rather because they contain many texts written by many authors, because their
    features are not distinctive enough to separate them from other categories, and
    these tend to the same texts that are difficult for humans to classify.'
