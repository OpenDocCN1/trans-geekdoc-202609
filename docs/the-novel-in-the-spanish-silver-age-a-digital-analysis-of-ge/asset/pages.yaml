    Social novels are a major trend during the 19th century, becoming a bestseller
    and the fundamental genre for many decades of the serials (Pedrza Jiménez and
    Rodríguez Cáceres 1982, 236–37). Their readers are part of the working class and
    the authors try to illustrate a thesis against social injustice, normally normed
    by lower-class protagonists in urban settings. It has its origins in the French
    model of Eugène Sue and Les Mystères de Paris (1842–1843). They portray social
    in a simplistic scheme of good and bad social groups (Ferreras 1987, 70–71). Its
    development influenced other subgenres of the same period such as the costumbrist,
    historical, and realistic novel. The works of authors who started writing in the
    period of naturalism like Blasco Ibáñez (La barraca, 1988) or Sawa (Declaración
    de un vencido, 1987) are often classified as social novels around the turn of
    the century.


