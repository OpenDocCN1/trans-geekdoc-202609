- pgno: 1
  md: '# Editorial


    Digital Humanities is an evolving, cross cutting field within the humanities em-ploying
    computer based methods. Research in this field, therefore, is an interdis-ciplinary
    endeavor that often involves researchers from the humanities as well as from computer
    science. This collaboration influences the methods applied as well as the theories
    underlying and informing research within those different fields. These implications
    need to be addressed according to the traditions of different humanities'' disciplines.
    Therefore, the edition addresses all humanities dici-plines in which digital methods
    are employed. Digital Humanities Research fur-thers publications from all those
    disciplines addressing the methodological and theoretical implications of the
    application of digital research in the humanities.


    The series is edited by Silke Schwandt, Anne Baillot, Andreas Fickers, Tobias
    Hodel and Peter Stadler.


    José Calvo Tello, born in 1987, works as a researcher and subject librarian at
    Göt-tingen State and University Library. He obtained his doctorate in Humanities
    from the Julius-Maximilians-Universität Würzburg (Germany) with a thesis about
    machine learning and other computational methods applied to the Spanish nov-el.
    His research is focused on the application and development of computational methods
    such as machine learning and natural language processing applied to romance literatures
    and library records.'
  merge: -1
  img_proc: true
