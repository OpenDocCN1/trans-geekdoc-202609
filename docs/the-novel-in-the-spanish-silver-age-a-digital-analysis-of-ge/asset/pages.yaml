- pgno: 379
  md: '# The Novel in the Spanish Silver Age


    The model of Figure 106 and the subsequent visualization connects the three main
    components of the analysis of genres. This visualization illustrates the lack
    of necessary and sufficient conditions, and instead shows a cross of shared features.
    For example, vocabulary about language is a specific feature of adventure novels.
    However, it is also a distinctive feature of the text La media, even though it
    is not part of the adventure genre. It belongs, among other categories, to war
    novels, sharing with its many semantic features, as vocabulary about soldiers,
    peace, or fighting. In a sense, this is a visualization of the cross-crossed characteristics
    described by Wittgenstein in the family resemblance model or Wellek and Warren''s
    social institutions. In addition, the model describes the participation of the
    instances in the subgenre not in categorical terms, but rather in ordinal terms,
    in the prototype theory. Through this, the model unites elements of the family
    resemblance and prototype theory into a single formal model.


    Until this point, the several steps of this section have assigned and delivered
    new data to the model. The four observations that will follow are an essential
    part of the scope of this model (following Weisberg''s terminology). From now,
