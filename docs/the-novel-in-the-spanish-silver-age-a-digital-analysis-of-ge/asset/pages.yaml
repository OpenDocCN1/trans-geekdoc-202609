    ePubibre: This community of users and publishing projects ascribed labels to each
    text, providing this information on their website and in each e-book.


    Amazon: The publishing houses have the option of assigning metadata to each book.
    The catalog of Amazon was crawled for similar titles and authors and manually
    controlled for whether the text was actually in the corpus. If I collected all
    labels assigned by the publishers.


    Wikidata: This project hosted by the Wikimedia Foundation allows the query of
    specific information using Linked Open Data (LOD) SPARQL (through BNE identifiers).
    From these sources, the field about subgenres was extracted.


    DBpedia: This is a similar project, hosted by the Free University of Berlin and
    Leipzig. It automatically structures information from Wikipedia, in this specific
    case from the Spanish Wikipedia. The subgenre labels were retrieved with LOD SPARQL
    queries.


    Subgenre by CLIGS: I assigned each text with several subgenres, also explicitly
    marking which I could consider the most prominent genre. This model enables the
    selection of either genres from the source or only the most predominant. I labeled
    each text after reading the annotation of other sources and encoded the metadata
    as explained in Chapter 3.2.


    There are different reasons why I chose these references. The most frequent sources
    in the computational analysis of genre are the own annotation, the information
    from the cover or from an already existing corpus. I am interested in finding
