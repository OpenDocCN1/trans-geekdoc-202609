    # 4.2.2.4 Tf-idf: Term Frequency-Inverse Document Frequency


    Tf-idf is an often-used transformation in areas of Computer Science, such as Information
    Retrieval and Machine Learning. It comprises the term frequency (or raw frequency),
    already explained in 4.2.2.1), and the inverse document frequency or idf. The
    idea behind this transformation is that the words (features) that appear in fewer
    documents are more informative than those that appear in the majority of them.
    Each feature in the entire corpus gets an idf weighting that is used to multiply
    the term frequency of each feature of all texts.


    Even when treated as a straight forward transformation without variants, both
    parts (tf and idf) actually have several parameters that are often not explicitly
    mentioned. This is already observed in Formulas 1 and 2 that two recent publications
    have used as an an explanation:


