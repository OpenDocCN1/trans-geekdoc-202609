- pgno: 178
  md: '# 4.1 Grammatical, Lexical, Semantic, and Textual Annotation




    Numerous textual layers can be identified between the very basic information of
    lexical frequency and the very complex information of genre. Several units, including
    tokens, sentences, paragraphs or chapters, can be analyzed from different linguistic
    perspectives, such as grammar, lexis, semantics, pragmatics, or text linguistics.


    Language is often conceptualized as a system of layers, one on top of the other,
    which is frequently used to structure the content of manuals about linguistics
    (Garrido Medina 2009); Kabateki and Pusch 2011), Natural Language Processing (Carstensen
    et al. 2009), or literary style (Leech and Short 2007). An extended schema for
    the analysis of textual semantics (in German textmantische Analyse) has been proposed
    by Gardt (2012, 2013). In his proposal, he defines three large groups of textual
    components (Gardt 2012, 64–66):


    +   1. Communicative-pragmatic frame: Includes information about the producer,
    the reader, the situation, and the medium. These aspects are covered by the basic
    metadata explained in Chapter 3.2.

    2. Macrostructure: Includes data about the genre and text type, pictures in the
    text, development of themes, and textual units. Apart from, these elements are
    discussed in the information about genre (Section 3.2.7 and Chapter 5.1), and
    some transformations of the data (Section 4.2.3.4).

