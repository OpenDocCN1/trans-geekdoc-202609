  md: '# 5.3 The Case of Literary Fiction




    The methodology presented in Chapter 5.1 for the composition of the set of labels
    imposes one constraint: At least two sources (from publishers, literary scholars,
    the Spanish National Library, ePubLibre, or annotation) were needed to maintain
    a label in their palette and assign it in a minimally consistent manner. But what
    if only one of these sources tends to frequently consider a specific label to
    categorize novels? It could have happened that many authors published their works
    with a specific label on the cover, but that this was not further used by later
    sources. Only one label showed this kind of exceptionalism in the description
    of data — literary fiction and was frequently applied by publishers in their metadata
    (see Section 5.1.5).


    Although the initial instinct can lead to this information which was not sanctioned
    by other sources we realize that “[literary fiction is] of the same sort as far
    as generic fiction is concerned, the better we will be for our understanding of
    the system of contemporary-fiction fiction” (2016). He and other DH scholars are
    increasingly using metadata labels from publishers or other platforms (such as
    Goodreads), including Koolen (2018) or van Cranenburg, van DalenOskam, and van
    Zundert (2019), from the Riddle of Literary Quality project, which the term literary
    fiction is also present as a literary genre. Koolen mentions that it is not her
    choice to use the label (she would have preferred the term general fiction), but
    that she uses it when she finds it in the metadata of publishers and that the
    readers can recognize it as a genre (Koolen 2018, 27–28). Publishers and other
    agents of the book industry do use the label as a genre, and this has become an
    empirical observation for DH researchers.


    But what do publishers want to express with the label literary fiction? To answer
    this question properly, it would be necessary to have a previous def-'
  merge: -1
  img_proc: true
