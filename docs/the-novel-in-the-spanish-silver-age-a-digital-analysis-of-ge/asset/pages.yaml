    Since the two standard options seem unfeasible, I decide to follow an alternative
    to create two deeper versions of the same corpus, in other words, two samples
    of the same population, one embedded into the other. To better understand this
    strategy, I give two examples from different types of instances. The population
    of Europe can be divided into the different national populations, which itself
    can be divided into their units: in the case of Germany, the *Bündländer*. The
    population of Bavaria, for example, can be divided into its constituent units
    (cities and regions) and this we can go deeper until we reach a population so
    small that a researcher can interview all of its inhabitants, a building. Of course,
    the smaller the population, the fewer instances our results will cover and probably
    the less interesting outcome will be.


    Another example, using now a textual case, is the Bible. This text can be understood
    as a whole population of verses, chapters, or books the researcher is interested
    in. Inside, there are two main groups of books: The Old and the New Testament,
    where the investigator can understand also as populations, populations within
    a greater population. Inside, there are smaller groups of books like the Gospels,
    Pentateuch, Paul''s letters, that, again, can be seen as a third level of populations.
    A step further, each book can be seen as a whole population of verses (from the
    whole Bible to a single book), and then decide whether they want random samples
    from it, or get data from the entire population. In the first case, the researcher
    would use Inferential Statistics in the sample to get generalizations over the
    entire population; in the second case, they would use Descriptive Statistics since
    the entire population is available.


    This provides a third possibility for the Humanities¹⁵ besides random and stratified
    samples: obtain the entire population that can be completely digitized. The fact
    that for social and medical sciences the study of smaller pop-


