    My second critique is the poor choice of the family metaphor. Familiar relationships
    between people are not defined by shared physical traits but by closely two kinds
    of relationships: genetic (descendant or ascendant) and political (married to
    or adopted by). Trying to identify members of a family using superficial features
    (as for those by Wittgenstein) could be practical and to a certain extent functional,
    but could not be an accurate theoretical model for defining family resemblance,
    especially if marriage or adoption between members of different ethnic groups
    is not seen as exceptional. I do share the opinion that many concepts lack accurate
    boundaries or common traits for all the referents, but I do not think that families
    are a good example of this.


    A third problem of the family resemblance model is its brevity and its interpretation
    by researchers, especially in following quote by Pawlowski: "what it is here meant,
    and obviously..." (1980, 204, my translation). In Scholarly discussions it is
    common for several researchers to compare or apply the model in dissimilar ways.
    For example, the professor of Romance Literature, Klaus Kempfer, claimed that
