    concept of genre can be understood as classes in a supervised task that are extracted
    from a third source like a catalog, while text-types result from clusters based
    on linguistic features. A discussion of the diachronic development of Biber’s
    terminology can be found in Santini (2004).


    One of the first attempts at genre classification is undertaken by Kessler, Numberberg,
    and Schütze (1997). In their study, they analyze various categories, such as genre
    (editorial, legal, non-fiction, fiction), brow (popular, middle, uppermost, high),
    and narrative (narrative against non-narrative). For that, they use the Brown
    corpus, working with different supervised algorithms and extracted types of linguistic
    annotation as features (morphological, syntactic, punctuation, and lexical information).
    When the task is performed in a multi-class way, they obtain an accuracy of 0.79
    (with a baseline of 0.33) using a two-layer neural network. The results achieved
    a mean accuracy over 0.9 when the classes are binary. Even when when the structural
    cues (annotated by NLP tools) obtain better results than the superficial ones
    (lexical and punctuation), they assess the computational costs as unjustified
