  md: 'In Digital Humanities, the works with the clearest historical perspective are
    those from Underwood (particularly 2016 and 2019 which I have already summarized
    in Section 2.2.5). The main question relating to this publication is Moretti''s
    hypothesis that subgenres tend to last around 30 years. To observe this, Underwood
    looks more closely at the beginning and end points and the development of genre
    over two centuries. He uses multi-label classification for several subgenres and
    plots the probabilities of each text belonging to the category. The early works
    show that a high probability of belonging to the genre can be understood as pioneers
    of the genre which share inner features with the rest of the category. The genre
    shows high probabilities in periods of stability, or a decrease when it is altered.
    Underwood''s results show that while some genres could fit into Moretti''s hypothesis,
    others ''remained for a century and a half'' (2016).


    A different tradition that mainly focuses on the historical aspect is the German-speaking
    tradition of Linguistics in the Romance languages: Diskurstradition, or discourse
    tradition. The traditional schema of the language proposed by the linguist Coserio
    describes three levels: universal (the human capacity of language), historical
    (the historical languages), and individual (a specific text or discourse). Nevertheless,
    Coserio found similar patterns in many languages. Some of these were relatively
    simple and short (e.g. greetings) and some very complex (e.g. sonnets or detective
    fiction). For this reason, Coseriu proposed the term *text tradition* (2007, 46,
    originally published in 1980), later called *discourse tradition* by Koch, which
    places it in a second historical level of the language, parallel or diagonal to
    the languages (1997, 44–46). The exact theoretical placement of this historicity
    of the language in Coserio''s model has been widely discussed (Kabatek 2007; Schott
    2015, 120–24). The repetition of linguistic patterns and their modification over
    time constitute shared traditions in various languages (Kabatek 2021, 97; Lefsanft
    and Schott 2015, 24). This creates a bridge from the linguistic tradition to the
    literary literary constitute the most common examples of these studies (Koch 1997,
    46–47). An important characteristic of this concept is its aim to cover heterogeneous
    phenomena in an abstract model;


    The concept of the discourse tradition as a cultural guideline of communicatively
    appropriate text organization, which was developed in Romance languages, is a
    central basic concept for a Cultural Linguistics. A characteristic of this concept
    is its wide range. Thus, under the concept of dis-'
