  md: 'tics. For that, the goal of this chapter is to obtain common knowledge about
    an aspect that has been overlooked until now.


    So, if the different communities only use their typical transformation and ignore
    the rest, why do I dedicate an entire chapter to exploring this? First, because
    this is an interdisciplinary work and part of it should be to contrast theories
    and practices in several areas and, if possible, evaluate which could bring more
    benefit to the research goal. One, specific specific transformation could bring
    major advantages to the classification of genre; perhaps a traditional transformation
    to one of the fields, or perhaps a new modification or concatenation. This is
    what happened when the stylometrist John Burrows applied a transformation to textual
    frequency that was standard in Statistics (z-scores) but had been rarely used
    in Literary Studies or Linguistics. This led to one of the most milestones of
    stylometry in particular, and Digital Humanities in evaluation. Burrows (2002)
    in Chapter 6.1 will show that none of these transformations will have the same
    importance for genres as z-scores for stylometric analysis of authorship. However,
    some of them will clearly yield higher results than others. In addition to analyzing
    the accuracy of the transformations, the reason why some lead to a better classification
    will also be analyzed. A series of characteristics of these transformations will
    be evaluated in Section 6.1.4 to explore the possible causes of this difference.
    These characteristics are described in this chapter in detail. For example, some
    of these transformations still contain information about frequency (relative or
    logarithmic frequency), others transform the numerical differences into categorical
    information (binary), while others transform the data in a way that no longer
    correlates with the original frequency (tf-id or z-scores).


    In any case, why do these fields transform the original frequencies from the tests?
    Compared to other kinds of information (like colors in pictures or characteristics
    in living beings), linguistic data tends to follow a pattern distribution known
    as Zipfian distribution. This was explained by the researcher Zipf, who in the
    1930s stated (1932) the empirical law that the rank of a word in this distribution
    multiplied by its frequency gives a constant (Carstensen et al. 2009, 230). The
    correlation between the rank and the frequency of each word is, in theory, a perfect
    line with a slope of -45° when both variables are log-transformed (Lestrade 2017).
    This law means that the most frequent word of any corpus will be twice as frequent
    as the second one, and three times as frequent as the third one. This distribution
    is "about preva-'
  merge: -1
  img_proc: true
- pgno: 192
  md: 'lent in social sciences as Gaussian distributions are in the natural sciences
    (Pustet 2004).


    This raises the question of what the theoretical criteria are the transformations
    should present in order to deliver higher results in the classification. It is
    thought that a transformation that modifies a Zipfian distribution towards a Gaussian
    one would be desirable, since many of the algorithms expect a Gaussian by design.
    Another aspect is the span of the values: While some transformations are expressed
