    The observed outcomes are highly relevant and unexpected, since it is very intuitive
    to presume the hypothesis that the constellations of characters behave very differently
    in adventure, romantic, or social novels. In general, researchers are not modeling
    entities (or proper names) as specific features. Instead, it is more common to
    delete them when culling options, or to just ignore them due to their relatively
    low frequency within the entire corpus.


    To test the hypothesis of entities are important features for genre classification
    without the steep and probably unfaithful path by Hettinger et al., I consider
    proper nouns a different kind of character in comparison to the rest of the lexical
    units. Standard lexical units (nouns, verbs, adjectives, etc.) have at least one
