    # 2.2.5 Literary Genre in the Past Years


    The two last papers of the previous section show a historical development in the
    area. In the later years of the 2000s and the beginning of the 2010s, Computational
    Linguistics has shifted its interest from genre classification towards other types
    of textual categorization, especially semantic or topic related (Blei 2012), with
    a few exceptions such as the application of Deep Learning or the use of the graphical
    features from the cover (Chiang, Ge, and Wu 2015). However, these years have seen
    a rising number of DH tackling through computational methods. Examples are Ramsay
    with networks and subgenres of Shakespeare (2003), Yu with the evaluation of different
    parameters in the classification of literary eroticism and sensitivity (2008),
    or Kestermont et al. also investigate the influence of genre in stylometry (2012).


    A group at the Stanford Literary Lab (Allison, Heuser, Jockers, and Moretti) and
    Wimbledon published in 2011 the first Literary Lab Pamphlet, in which they analyze
    subgenres of the novel using PCA and clustering based on lexical and typographical
    information. Moretti had already done work about genres (2005), proposing the
    hypothesis that literary subgenres could have a certain periodicity in their development.
    One of the results of the group is that some highly frequent lexical units are
    useful markers for genres, but at the same time are highly interpretable and offer
    little new knowledge about their studied object: "If all in an audience work,
    and all women blue, the colors would differentiate them perfectly, and tell us
    nothing about them" (18). They clarify metaphors about genres, for example, buildings
    with "distinctive features at every possible scale of analysis: mortar, bricks,
    and architecture" (8), or compare genres with an iceberg "with a visible portion
    floating over the water, and a much larger part below, and extending to unknown
    depths" (25).


    Two years later, in 2013, a fundamental text for DH was published: Macroanalysis
    by Jockers. In this seminal work, he analyzes via different techniques several
    aspects of literature, such as author, genre, and period. For that, he uses both
    unsupervised methods (such as hierarchical clustering on Euclidean'
