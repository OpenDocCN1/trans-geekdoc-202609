- pgno: 254
  md: '# 5.2.4 Conclusions


    In this section, I have run several experiments about the status of labels on
    the cover of the first publication. I have presented and evaluated two competing
    hypotheses, i.e. that these labels should be either closer to the internal features
    or to the author.


    As a first step, I have observed that the number of works labeled in the first
    publication is relatively small, with a high tendency to use very specific labels
    for one or two texts. Those that have a high frequency present either semantic
    ambiguity for cataloging novels (story, tale, legend, long, draft) or a close
    association with the author (episodio nacional, costumbrista).


    As a second step, I have classified these subgenres based on linguistic features
    before comparing them to the classification of the labels of the rest of the sources.
    The labels of the first publication achieve lower results and show greater variance
    than the rest of labels.


    As a third step, I have calculated whether the first edition is associated with
    the name of the author, and I compared it to the rest of the sources. The first
    edition is one of the sources that shows the strongest dependency on the writer''s
    name.


    For this corpus, selecting only the labels from the first edition would cause
    a strong reduction of the analyzed labels, the researched texts, with lower results
    in classification using linguistic data, with a stronger dependency on authorship.
    That is why I have decided to use information from all covers and not only the
    first one as a source with the same status regardless of whether they come from
    publishers, manuals, or my own annotation. However, these can differ greatly in
    other languages, periods, genres, or levels of descriptions. It is plausible that
    in specific contexts, the author did not have any influence on what exactly exactly
    on the cover, but that the rest the publishers who had influence and might have
    had a surprising goal, rather having cataloging in mind. In addition, more generic
    genres (such as drama and novel) might be more accurate on the cover than more
    specific subgenres. In any case, this section has raised some interesting questions
    for which my data set does not allow a deeper analysis: The later a label is assigned,
    is more likely to be based on linguistic features? This could be formalized in
    the question of whether the chronological distance of the assignment of a label
    would correlate with the classification results. And as is the understanding of
    subgenres in Literary Studies mainly associated with the author?'
