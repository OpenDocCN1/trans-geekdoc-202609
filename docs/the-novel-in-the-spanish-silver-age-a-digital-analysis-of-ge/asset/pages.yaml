    This chapter is the third and final chapter on the theoretical frameworks in this
    book. The previous chapters (Chapters 2.1 and 2.2) have clear international centers
    of activity and publication (i.e. studies of Spanish literature and the main DH
    conferences and journals). In contrast, this chapter, genre theory is discussed
