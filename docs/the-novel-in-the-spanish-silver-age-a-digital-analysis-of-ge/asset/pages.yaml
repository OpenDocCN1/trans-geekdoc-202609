  md: 'Figure 103: Bipartite graph with three novels and their subgenre-labels


    ![](img/98c86d70e9e43286af05120dbff29113_374_0.png)


    7.1.6). The weighted edges formalize the main idea of the prototypes in which
    an instance does not belong to a group in categorical terms, but rather in terms
    of degree.


    To operationalize this prototypicality, I have used one of the possible operationalizations.
    However, at least two other operationalizations of prototypicality of genres are
    possible. The first is to adopt a more historical perspective and consider the
    center of the prototype of the works that published first or had a greater influence
    in later works (Henny-Kramer et al. 2018). The second is to obtain qualitative
