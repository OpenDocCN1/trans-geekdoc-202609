  md: '# 2.3.2.3 Family Resemblance and Social Institutions


    The inadequacy of the classic scholastic-structuralist model of necessary and
    sufficient conditions has been discussed not only for literary genres but for
    many concepts in general, including the Humanities and Social Sciences, where
    the borders of the different classes are blurred. To more accurately describe
    the characteristics of these concepts, other models have been pre-sent.


    The family resemblance model was briefly (in only a few paragraphs) proposed by
    Ludwig Wittgenstein in his Philosophical Investigations (originally published
    in 1953, consulted Schulte''s bilingual edition of 2013) to answer a possible
    critique that the term language games (a corner stone of his philos-phy lacked
    a definition. His response was that there is no accurate definition of the word
    game (Spiel in German) when observing different kinds of games ("board-games,
    card-games, ball-games, athletic games,") Wittgenstein and Schulte (2013, highlighting
    the fact that one must look at the real objects and their particularities: "To
    repeat: repeat thin, but look!" There is no trait common to all of them; some
    are amusing, in some lose, in there are several players, in some luck is important:


    > [...] we saw a complex network of similarities overlapping and cross-cross-ities
    in the large and the small. I can think of no better expres-sion to characterize
    these similarities as “family resemblances”; for the various resemblances between
    members of a family – build, features, colour of eyes, gait, temperament, and
    so on and so forth – overlap and cross in the same way. And I shall say: ‘games’
    form a family. (Wittgenstein and Schulte 2013, 36e).


    Some researchers have already used family resemblance as a theoretical model for
    genres. In Hempher (who will be discussed later) and Fricke, who applied it to
    the genre of anecdote, noting that the features in the model cannot be facultative
    (in the sense of optional); some of them have to be necessary (2010, 10–11).


    In my opinion, there are several weak aspects in Wittgenstein’s argument, although
    these do not affect the pillars of the model. The first is the attempt to produce
    a single meaning for the word game. In a sense, Wittgenstein is rejecting the
    possibility of polysemy. The dictionary Duden lists 12 main de-finitions for the
    word Spiel, and seven more sub-definitions; the Oxford Dictio-nary has five main
    definitions for the word game and nine sub-definitions;'
