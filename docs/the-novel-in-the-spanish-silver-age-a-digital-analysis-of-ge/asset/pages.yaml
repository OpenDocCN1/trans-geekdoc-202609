    Hack, or Fini (see Hempter 1973, 37). García Berrio and Huerta Calvo noted that
    Croce''s critique mainly focuses on how genres were used for normative purposes
    for many centuries (1992, 129) and Wellek and Warren explain it as a ''reaction
    against extremes of classical authoritarianism'' (1956, 226). As these authors
    stated, genre research is descriptive, at least since the middle of the 20th century
    (1956, 234), and therefore, from our current perspective, it is difficult to recreate
    the intellectual context of Croce''s critique.


    #  3.2.2 Hybridism


    Any researcher looking closely at real data about texts and their genres quickly
    finds that a text could belong to several groups, even when looking at a single
    source of information. The idea that genres overlap or the existence of mixed-genre
    is frequently present (Chandler 1997, 2; Bafler 2010). However, mixed-genre are
    normally treated as exceptional cases of hybridism. Besides, it is normally specified
    what exactly this hybridism is. A complete schema of this is the three-part unified
    schema by Hartmann and Guérard, who proposed terms like ''lyric-lyric,'' ''lyric-epic,''
    and ''lyric-dramatic'' (García Berrio and Huerta Calvo 1992, 148). An example
    of this overlapping of genres in a literary text is to be found in Hamlet (for
