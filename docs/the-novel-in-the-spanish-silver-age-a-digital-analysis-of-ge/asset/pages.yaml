  md: 'small category associated with only one author can be classified with perfect
    results (1.0 F1-score).


    Although both the literary and linguistic features show high z-scores (over two),
    the strongest ones are linguistic. They can be mainly organized in negative vocabulary
    (*hindi*, annular, *excluir*), life and childbirth (*retorno*, *destino*, crear,
    *reproducción*, *útero*, aprender, *vida, origen*), poverty (*mendigo*, *limosna*),
    and objects (*canal*, *tallo*, *cuerno*). Beside, several typographical signs
    are overrepresented, with such question, explanation, and quotation marks.


    Nonetheless, the literary features also show some high values, such as a long
    span of the text, a homodietic narrator, a high identification of the author in
    the text, a partially or clearly negative ending, and a setting in unspecified
    towns of Spain.


    The works by Unamuno assigned with this label are *Niebla*, Abel Sánchez, San
    Manuel Bueno, mártir, La Tía, and *Amor y pedagogía*.


    The most similar categories are the spiritual (12%), the educational (11%), and
    the philosophical novel (8%).


    # 11.24 Erotic Novel


    In the periphery of the network is the erotic subgenre, with an eigenvector centrality
    of 0.03 and a relatively low specificity of features (standard deviation of z-scores
    of 0.81). This subgenre represents 17 novels in CoNSSA, and only four novels in
    the manual on CoNSSA-canon. Its texts are normally not strongly canonized (0.5
    pages in the manual on average). That explains a rather high classification score
    of 0.96 F1-score.


    This category has very distinctive features (values over two z-scores) like type
    of relationships (*novio*, *matrimonio*), sentimental verbs or actions, mainly
    positive (*admirar*, caricia, enamorar, encantar, apasionar, abandonado*), personal
    qualities (*vergüenza, sincero, extravagante, fe, antipatia*), gender and sexual
    orientation (*mujer*, *affadado*), and others (*convertir*, *suelto*, *sal*, *espina*).
    It is interesting that the only semantic field in the 20th century about physical
    relations is caricia (''caress''), and none of them is related to sexual practices
    or body parts.


    The protagonist is typically an adult woman of the higher classes of the society.
    Even more distinctive is the fact that stories do not represent the author’s life.
    Other distinctive literary metadata are urban settings, cases traveling through
    different countries, in a contemporary realistic world,'
