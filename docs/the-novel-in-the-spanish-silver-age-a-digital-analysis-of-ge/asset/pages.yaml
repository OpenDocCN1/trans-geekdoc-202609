  md: '# 3.1 Corpus of Novels of the Spanish Silver Age: CoNSSA and CoNSSA-canon




    In this section, I explain the steps taken to design and create the Corpus of
    Novels of the Spanish Silver Age (CoNSSA), which will be analyzed in the rest
    of the book. First, I discuss different issues regarding the concept of literary
    corpora, considering the concept of statistical population and how it can be related
    to literature. Second, I present the criteria for the stratification of the authors
    and their selection, and finally the selection of the texts. Third, specific steps
    about the compilation of the corpus are clarified: use of digital sources and
    my digitization, encoding process, validation through XML schema and Scheatron,
    enrichment of structure, and human validation.


    This data has been gathered for the first time. For why is one of the last sections
    is dedicated to the exploration of the corpus through plots and Descriptive Statistics
    to have a general view over its content and the typical tendencies of the novel
    of this period. The goal of the description through Statistics and visualization
    is, on the one hand, to better understand what the ranges and typical tendencies
    of the novel of this period are. On the other hand, I plot different values over
    time to comprehend the general evolution of specific phenomena over time, a point
    of view that, as I have already discussed, merely abandoned by the research of
    this period in favor of each author’s specificities (see Section 2.1.2). This
    part (Section 3.1.9) and one in the next chapter (Section 3.2.11) are the only
    ones in which a historical and not a cross-sectional perspective is adopted.¹
    The reason for that is that in these sections the novel is described in general
    and not in particular subgenres. The corpus is also briefly compared to other
    literary corpora.'
