  md: 'A further in semantic mapping would be to express the labels in a way that
    can be shared between other researchers and institutions working in other languages
    or periods. In other words, it would be necessary to declare the subgenres in
    a shared palette of subgenres. There are several projects working on similar questions,
    such as the POSTDATA project at the UNED, formulating a shared set of concepts
    for the European tradition of poetry through Linked Open Data technologies. In
    this field of DH, I have searched for Linked Open Vocabies (LOVs¹) that would
    contain subgenres of the novel. A number of LOVs include the concept of novel,
    without finer distinction or only a couple of subgenres, as the vocabularies of
    the DBedia, FABIO, SIO or RDA Registry. Thereafter, I have searched for further
    controlled vocabularies using different technologies². Several controlled vocabularies
    used by European libraries contain the category of novel, again without further
    specification. Following Underwood (2016), who has used the metadata provided
    by the Library of Congress, I have considered this classification system³, but
    again there is no information available beneath the novel level. Libraries have
    repeatedly rejected the classification of types of novels. By my knowledge, neither
    computational researchers nor libraries have a system of subgenre classification.


    I have decided to consider another field that is familiar with subgenres: publishers.
    With the editorial market becoming increasingly digital (either in the form of
    e-books or digital shops for printed books), publishers are aware that they need
    to share information about subgenres to facilitate the searching of books by customers.
    Different attempts have been made, such as the BISAC Subject Codes, led by the
    US-based Book Industry Study Group,⁴ the UK-based BISAC Standard Subject Categories
    by the Book Industry Community,⁵ and the UK-based internationally developed Thema
    subject category scheme (Thema) by EdITEUR.⁶ The development of BISAC has been
    frozen in favor of a better acceptance among. There are many reasons why Thema
