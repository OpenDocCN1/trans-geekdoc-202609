    # 7.1.7 Conclusions


    In this chapter, I have applied several tasks to computationally analyze subgenre.
    Each of these makes certain assumptions about the genre, and therefore expects
    the labels to be transformed in a specific manner. As a consequence, they offer
    answers to different types of questions.


    The first was the multi-class task, in which each text belongs to a single subgenre
    and the goal of the algorithm is to predict a single categorical value for each
    text of the entire label palette. From a logical point of view, this task accurately
    reflects the classic scholastic-structuralist model. From the perspective of Literary
    Studies, it can better accommodate longitudinal studies in which the researcher
    has a single label of high quality, a kind of ground truth label about the subgenre,
    for example from the author. In general, this is what is found in real labels,
    not even when one reads the author''s opinion on their work. Because of this,
    the majority of the cases require an important reduction of the information and
    retain a single label for each text. Because this research study has assumed a
    cross-sectional chronic perspective, the labels available are not of such a nature.
    Nevertheless, I have considered the modal subgenre, for taking each text the label
    with the highest number of sources labeling it. Depending on the number of labels
    analyzed, the F-score yields values of 0.4 and 0.52, both statistically higher
    than the baseline (0.22 in the first case, 0.42 in the second), but nevertheless
    rather unimpressive scores.


    These low scores mean the algorithm was not able to find the necessary features
    to distinguish the categories, or, in other terms, was not able to find the necessary
    and sufficient conditions. That can be seen as a failure for conceptualizing genre
    with the classic scholastic-structuralist model. Of course, this failure could
    be explained by other factors, like insufficient features or, more importantly,
    a lack of labels of sufficiently high quality. An advantage of'
