    In a recent paper, the researcher Juana María González has studied the Index literario,
    which published reviews of literary works between 1932 and 1936 (González 2021).
    One of the aspects that she analyzes is the distribution of the authors'' gender,
    arguing that this journal was a progressive publication with women among the publishing
    board. However, in her study González finds that the number of texts written by
    women reviewed in this is surprisingly low: around 6% in total, in the case of
    the novels. As it can be observed, the distribution in the MdLE and in the CoNSSA
    are similar to these results.


    There is a clear bias, but who exactly is preferring men to women? Who is the
    source of this injustice? The male and female researchers who wrote the MdLE?
    Researchers of literature in general? Only the ones from Spain? Is it a general
    problem of Academia? The publishing houses of decades? Cultural agents who influenced
    the canonization process? Their sense of literiness or literary quality (cfr.
    Koolen 2018)? These questions are undoubtedly defined by the reach of this, but
    one fact is certain: What is currently considered the Spanish novel between 1880
    and 1939 is clearly dominated by male authors. Balancing corpora in terms of author''s
    gender is not a question about effort or size of the corpus, but about the concept
    of population and, ultimately, what is considered literature. Achieving a more
    balanced scenario of past periods will modify profoundly our concept of literature,
    a virtuous goal for several cultural actors, including researchers and Academia
    in general. However, these revisions cannot be expected as products of studies
    of whose main goal has no relation with the author''s gender.


