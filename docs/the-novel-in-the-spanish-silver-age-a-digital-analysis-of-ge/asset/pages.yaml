  img_proc: true
- pgno: 448
  md: '# 11. Empirical Description through the Tripartite Graph Model


    Some of the texts that have a large proportion of sources relating them to this
    subgenre are by Valera (Genio y figura...), Juanita la Larga), Galós (El doctor
    Centeno, Miao, Lo prohibido), Valdes (José), Azaña (El jardín de los frailes).


    The most similar subgenres (in terms of shared features and texts) are the social
    novel (63% of features and texts shared), literary fiction (59%), and the naturalist
    novel (46%).




    The second subgenre in the center of the graph (eigenvector centrality of 0.26)
    is the social novel, also with a low specificity of its features (standard deviation
    of z-scores of 0.29). This subgenre covers 185 novels in CoNSSA, 89 in CoNSSA-canon.
    The texts of this subgenre are relatively canonized, with 1.6 pages on average
    in the manual. These variables bring about the lower classification of all analyzed
    subgenres: 0.72 F1-score.


    From the linguistic perspective, the vocabulary is marked by negative features
    (desobedecer, criticar, immoral), crime (cruel, delito, abusar, traitor), and
    poverty (retribución, pobre, bien, propiedad, ahorrar, ajetrear, esforzar, pagar),
    and others (salud, niño, costumbre). However, the most specific feature comes
    from the metadata: a protagonist from lower classes. Other aspects, also specific
    but to a lesser degree are a geographical setting in Europe (mainly Spain), no
    representation of the author''s life (see Section 3.2.6 for an explanation about
    the author-text relation field), and a heterodiegetic narrator.


    Some instances with larger proportions of sources assigning them to this subgenre
    are by Valle-Inclín (Gerifalt de antaño, Los cruzados de la causa, Baza de espadas),
    Baroja (César o nada, Malia herbia), or Unamuno (San Manuel martír).


    The most similar subgenres are the realist novel (63% of shared features and texts),
    literary fiction (56%), and the naturalist novel (43%).




    The third subgenre in the center of the network is literary fiction, a special
    case of the subgenre palette which was found in a single source: the publish-ers
    on Amazon (see Chapter 5.3). This subgenre has the lowest specificity of'
