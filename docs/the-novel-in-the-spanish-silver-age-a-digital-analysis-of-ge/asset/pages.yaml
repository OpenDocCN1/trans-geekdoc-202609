    been applied to measure centrality in bipartite graphs (Faust 1997), and from
    this point, when I refer to centrality in the graph, subgenres like *greguerias,
    episodio nacional*, or erotic novels stand clearly in the periphery of the graph
    (observed with several layout algorithms), and they also have some of the lowest
    eigenvector centrality values. In other words, the perceived centrality in the
    figure correlates strongly with the eigenvector centrality.⁸ The exact values
    for all subgenres are shown in Figure 109.


