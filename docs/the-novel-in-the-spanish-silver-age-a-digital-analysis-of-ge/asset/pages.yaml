  md: 'the text, or only in specific sections, not achieved. Although it is very frequent
    to report only the mean of a series of values, it is considered bad practice when
    these are not presented alongside the information about the dispersion (Gries
    2008b, 117). To formalize this, a series of dispersion measures have been proposed
    by corpus linguists (see Gries 2008a and 2009 for a discussion on several implementations),
    although their application in DH and Machine Learning tasks is very limited. One
    of the most intuitive operationalizations of dispersion is the standard deviation
    of textual units as chapters. If a token has a high standard deviation across
    the chapters of a novel, it means that it is very frequent in some sections, and
    rare in others. For example, in a novel with a narrative perspective that changes
    from third to first person, the pronouns I and he/she should have a high standard
    deviation. In contrast, the first-person pronouns of a novel with a narrator in
    the first person should have a low standard deviation, even if they are very frequent.


    In Sub-figure A of Figure 49, the data shows *Los caminos de Ulloa* has a much
    lower standard deviation for the most frequent words than *Tyrano Baneras*. This
    is not surprising: The first novel describes a story with very stable topics and
    characters, while the second has many changes of perspective and characters. The
    distribution shown in Sub-figure B is very skewed (although not much as other
    transformations) and it is strongly correlated with the raw frequency (Sub-figure
    D): The more frequent a word is, the higher its variance can be. Both the skewness
    and the correlation could be mitigated by further transformations, such as logarithm
    or z-score standardization. To my knowledge, the standard deviation over chapters
    has not been applied in literary research, and could be a simple operationalization
    of how heterogeneous text.


    # 4.2.3.5 Language-Zscores


    In 4.2.2.6, I have presented z-scores as the way to standardize the frequency
    in comparison to what is expected in the entire corpus. In this sense, it results
    in a *corpus-centric* comparison: It is highly dependent on the corpus used, and
    could be called *sample-scores* or *corpus-scores*. The frequency of a word in
    a text does not depend on the rest of the corpus, but its z-score, since the mean
    frequency in the corpus and its standard deviation are included in the calculations.
    Adding or deleting one text affects the value of all features in every document.'
