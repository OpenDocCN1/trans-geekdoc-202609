    # 4.1.2 Format of Annotation


    One could argue that the format of the linguistic and textual annotation is irrelevant
    since it is only the step between the annotation tools and the algorithm for the
    analysis. In my opinion, the format does influence numerous aspects, such as the
    evaluation of errors, the facilitation of specific features, the exchange of documents,
    and historical archiving. For these reasons, in this section I want to discuss
    and justify the decisions that have been made.


    The different communities using computational methods for cultural objects have
    strong traditions and preferences for formats. The editorial community works with
    TEI XML. This format has been partially adopted by Corpus Linguists, in many cases
    using standoff markup for linguistic annotation. However, linguists often also
    develop their own XML implementation. In contrast, Computational Linguistics and
    researchers from Computer Science prefer JSON, UIMA Type System in XMI files,
    or just CSV spreadsheets. Some of the most advanced researchers in the field operate
    with other formats, such as Linked Open Data. The DH community working on Digital
    Literature Studies has not yet embraced a single format for linguistic annotation.


    I have decided to keep the textual and linguistic annotation in TEI XML for several
    reasons. The first is to maintain the same format in which the original text and
    metadata have been saved. This allows for a simpler workflow, in which the same
    technologies and libraries (XPath, lxml, XSLT) can be applied'
