    genres with low results would be expected to be placed in the periphery.⁷ There
    are several ways in which the centrality of nodes in a graph can be measured.
    My interest is not in measuring how many edges each node has, but rather in capturing
    whether the neighbors of the nodes (novels and features) are isolated (the case
    for the peripheral nodes) or linked to other nodes (which is expected in the central
