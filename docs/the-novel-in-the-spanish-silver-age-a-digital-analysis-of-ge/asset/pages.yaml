    # 3.3.8 Conclusions and Modification of the Corpus


    In this chapter I have answered the question of 14 texts in CoNSSA are novels
    or not. For this, I have used the frequencies and metadata of the largest diachronic
    corpus in Spanish, CORDE, together with the undisputed novels of CoNSSA. First,
    I have evaluated the classification (as binary and multic tasks), fine-tuning
    three parameters: transformation of the frequency, algorithms, and the number
    of tokens. The results have shown that the binary classification achieves very
    good results, while the multi-class classification correctly assigns about the
    half of the texts.


    After the evaluation, I have used the best combinations of parameters serial to
    predict the genre of the discussed texts. The results, particularly the binary
    prediction, gave a markedly more complex picture about genre compared to the naive
    notion that each text belongs to only a single genre. Although some texts belong
    to a single genre, others seem to be clearly part of several, only partially part
    of several, while seem to reject being classified at all.


    The binary classification undisputed recognizes three texts as novels: Avirenata:
    la vida de un conquistador by Baroja, Luis Candelas, el bandido de Madrid by Antonio
    Espina, and La novela de un novelista by Valdés. In this classification, four
    other texts were clearly rejected as novels: La lámpara maravillosa by Valle-Inclán,
    Cartas finlandlandesas by Ganivet, Juan de Mairena by Machado, Diario de un poeta
    casado by Ramón Jiménez, and La vida de Rubén Darío by Darío. A third group (La
    media noche by Valle-Inclán, Platero y yo by Ramón Jiménez, both texts of Greguerías
    by Serna, De un cancionero apocrifo by Machado, and Tomás Rueda (Azorín) were
    not classified as part of any subgenre'
  merge: -1
