    research is the unexplained mass sampling of the corpus, erasing 40% of the original
    texts without explaining the criteria. Besides, the three analyzed classes (brow,
    narrative, and genre) were not theoretically justified, and neither was their
    association tested. Furthermore, they modified the labels of the corpus (Kessler,
