    the boundaries of CoNSSA (1880 and 1939) as an additional margin of 20 years.
    There are several reasons for extending the chronological boundaries. First, the
    data is already available, so it is reasonable to work with more data rather than
    with less. Second, as discussed in Section 3.1.3, some authors of CoNSSA are representatives
    of former movements, so some could actually find more similarities in earlier
    publications. Third, some texts analyzed in CoNSSA might have created tendencies
    that were later practiced by other authors, which argues for an extension of the
    date of CORDE to some decades after the end of the COVID.


