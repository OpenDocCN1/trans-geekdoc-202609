  md: '# 2.3.4 Perspectives on Genres


    A further aspect in the research on genres is how the analyzed corpus is defined.
    Two main perspectives on the studies can be differentiated: longitudinal historical
    and cross-sectional synchronic. In the following section, I will describe these
    two perspectives, giving examples for each of them from Literary Studies, Linguistics,
    and Digital Humanities.


    # 2.3.4.1 Longitudinal Historical Studies


    In longitudinal historical studies, the researcher is interested in reconstructing
    the historical evolution of specific genres or subgenres. These cases normally
    cover long periods (over several decades or centuries), using a handful of categories
    or fewer as an example. One important aspect is what the author''s intention was
    when using specific labels and what were the expectations of the readers at this.
    These highly qualitative labels are time-consuming to collect, and there is little
    clarity on the exact type of source they should come from: The cover can be interpreted
    as a rather superficial source that is influenced by the reader. For many periods,
    the number of books that identified a genre on the cover or in the para-text is
    often small, and the researcher only analyzes a small fraction of the literature
    of that period.


    This longitudinal historical perspective does not relate to any area of research:
    Both Literary Studies, Linguistics, or Digital Humanities include the recomplementation
    of data and analysis in this manner, as described below in examples from the different
    disciplines.


    For example, the historical development of genres is a key aspect in influential
    work in the German tradition of literary genres by Raible (1980). He summarized
    five characteristics of literary genres from a semotic perspective. For him, literary
    genres are conceptual models that try to reduce the complexity of the texts that
    are grouped together (322). He described five consequence. First, genres are historical
    conventions with a normative function. Second, genres show different levels of
    complexity (e.g. novels can contain short novels, therefore novels are more complex
    than short novels). Third, in genre, the reader expects specific phenomena in
    a given order. Fourth, the reader uses information about the genre to interpret
    the text (e.g. laugh about or mourn a death depending on whether the text is a
    tragedy or a parody, 334). Fifth, genres are defined by external text features,
    such as the goals'
  merge: -1
  img_proc: true
- pgno: 83
  md: 'of the author, the author''s situation, and the situations of the readers.
    Finally, he proposed a methodology for describing literary genres in six dimensions,
    each one containing several features of the text, and emphasized and encouraged
    future research in working with specific textual features.


    Todorov (1976), on the other hand, suggested that the concept of genre is an important
    classification method, even though the current genres differed from those in the
    past: "it is not ''genres'' that have disappeared, but the genres of the past,
    and they have been replaced by ''others'' (1976, 160). In his opinion, "genres
    exist as until [...] function as ''horizons of expectation'' for readers, and
    as ''models of writing'' for authors'' (1976, 163). He reflected on how the labels
    of the genres appeared:


    Let us now turn to the other term in the expression ''class of texts'': Class
    raises a problem by its simplicity. One can always find a property common to two
    texts, and therefore put them together in one class. But there is any point in
    calling the result of such a union a genre''? I think that it would be in accord
    with the current usage of the word and at the same time provide a convenient and
    orient notion if we agree to call ''genres'' only those classes of texts that
    have been perceived as such in the course of history. The accounts of this perception
    are found most often in the discourse of genres (the meta-discursive discourse)
    and, in a sporadic and indirect fashion, by the texts themselves (Todorov 1976,
    162).


    This quote is especially valuable for computational approaches to genres where
    it is common to find linguistic patterns that can distinguish random groups of
    texts. Todorov''s proposal would mean that the researcher should use only labels
    that were given by scholars (i.e. those holding the meta-discursive discourse
    about genres) or where the text presents itself as something different (e.g. labels
    on the cover).


    A recent study on literary genres with a historical perspective was undertaken
    by Schröder (2019), who analyzed the case of the German novella. Schuster states
    that genres are not based on textual features and that they should be defined
    in the descriptive language of the Literary Studies (1–2). His analysis of the
    novella shows that the instances of this category of genre do not show textual
    or linguistic similarities, and therefore the main goal of this description should
    be the reconstruction of the label, both in the paragraph of the texts or in theoretical
    works, as so poetics (36). As a consequence, the historical development of the
    label should be integrated in the concept of the genre by applying the family
    resemblance model (31–33).'
