  md: '# The Novel in the Spanish Silver Age


    One of the most important aspects is that this project adopted a cross-sectional
    and synchronic perspective on subgenres of the Spanish novel of the silver age.
    This decision was taken mainly because of the digitization state of Spanish texts,
    but also because of my interest in the period. On one hand, this has the advantage
    that the conclusions cover many subgenres of these decades. On the other, the
    conclusions do not analyze the development of the genre chronologically.


    The first question of this book is how to achieve representativeness in a data
    set, more specifically in a literary corpus. Since the Humanities are increasingly
    working with larger data sets, one must realize that obtaining acceptable conclusions
    regarding the required object clarity in what the data set represents. Currently,
    the computational approaches on genre have preferred to work with large but opportunistic
    corpora, rather than to assemble mid-sized corpora that were gathered following
    more strict criteria. In Chapter 3.1, I have shown how the traditional method
    using Statistics (random sampling), often applied in Life Sciences and Social
    Sciences, cannot be applied in the Humanities in many cases. In our field, the
    complete population if not available or even known, sections of the data are not
    digitized, or worse, they are lost. For this reason, I have not tried to achieve
    the largest possible population of novels (population in its statistical meaning,
    see Section 3.1.3 and 3.1.6), by considered smaller populations that are based
    on considerably stricter criteria derived from literary manuals and that I was
    able to obtain in their full size. In this manner, the Corpus of Spanish Silver
    Age (ConSSA) is designed as two nested sub-corpora: a smaller sub-corpus that
    maps a literary population, and a second sub-corpus that is larger but opportunistic.
    This double structure has provided me with the possibility of testing hypotheses
    in both of them (see Section 3.1.9). In this structure of corpus, any test can
    have one of the following outcomes:


    +   First, the hypotheses can be observed only in the larger sub-corpus, meaning
    that the result might be based on bias related to digitization.


    +   Second, the hypotheses can be observed only in the smaller sub-corpus of what
    literary scholars traditionally tend to consider the relevant novels of this period,
    meaning that the results can be observed only in canonical texts.


    +   Third, the hypotheses can be observed (or falsified) in both sub-corpora,
    and therefore this phenomenon might not depend on the specific corpus,'
  merge: -1
  img_proc: true
