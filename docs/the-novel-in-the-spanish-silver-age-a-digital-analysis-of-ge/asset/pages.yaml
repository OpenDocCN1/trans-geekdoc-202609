  md: '# 6.1.5 Conclusions


    Many hypotheses presented in Chapters 4.2 and 4.1 about linguistic annotation
    and transformations have been proven not to advance the classification of subgenres.
    The linguistic annotation in several layers offers some advantages, although many
    others do not seem to make any difference. Tokens are very reliable features that
    achieve solid predictions. The use of a more accurate conception of lexical units
    (idioms or multiwords) and the differentiation of lexical units into their POS
    (splitting verbs and nouns that have the same form into two lexical units) have
    slightly better results. Contrary to my expectations, the differentiation of the
    tokens by the narrative characteristics of the paragraph has no advantage.


    A more in-depth look at the features has highlighted some textual features, such
    as the TEI-tags, punctuation, names of places and the words of many grammatical
    categories, especially nouns, adjectives and verbs. Some of these features are
    traditionally erased in typical preprocessing steps, which is an argument for
    making considered decisions. Two linguistic annotations showed positive results:
    the semantic features from the dictionary by María Moliner and the encoding of
    personal proper names through their ordered frequency. Only semantic features
    achieve good results, in some cases even the best. These two successful linguistic
    annotations can be seen as strategies for extracting information about the characters
    and the meaning of the text that actually improve the classification of subgenres.
    In my opinion, lexicographic resources such as the catalogs of the dictionary
    by María Moliner should be more frequently considered for annotation corpora and
    evaluating their performance in comparison to distributional models such as topic
    modeling and word embedding. In addition, different morphological data (especially
    about pronouns and verbs) ranks among the most important linguistic features.
    I have created a mixed model of features whose results are slightly higher than
    the rest in the majority of the cases.


    An important finding is the observation that the standard deviation of the coefficients
    of the features correlates with its mean. In other words, the features that are
    very important for the classification of some subgenres are irrelevant for others.
