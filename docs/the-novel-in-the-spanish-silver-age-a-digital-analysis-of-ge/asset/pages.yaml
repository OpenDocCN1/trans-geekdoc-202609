- pgno: 372
  md: 'family resemblance model. In several DH areas, graphs have been extensively
    applied to show stylometric similarities between texts or to formalize works of
    literary characters. However, they often lack a formal evaluation. In this section,
    I give exact information about the composition of the edges and in the following
    section I will evaluate the model.


    In order to achieve a clear presentation, I start with relatively few genres and
    texts, increasing the number until all subgenres are fed into the model. Besides,
    each step will be presented with a visualization of the graph. It is necessary
    to consider that these illustrations are merely one possible visualization of
    the underlying model, which are intended to serve as a visual aid for the reader.


    The first of the ten observed characteristics listed in the previous section states
    that texts can be grouped into genres. These relations can be formalized in a
    bipartite graph, which is a graph "that can be split in two parts that all known
    relationships are only between entities from different parts" (Zweig 2016, 8).
    In my case, the bipartite graph is composed of two partitions of nodes: texts
    (shown with the green color in following illustration) and genres (with the color
    purple). The nodes of both partitions are connected when any institution has labeled
    the texts in a category. For the visualization of Figure 102, I only consider
    three subgenres – adventure, historical, and war novel – each of them associated
    with 25 texts.


    In Figure 102, each subgenre has several texts associated with it, and these are
    not isolated. Three novels have been labeled as adventure and war novel. while
    four are labeled as both historical and adventure. In addition, Zalacain el aventurero
    belongs to all three subgenres and is plotted in the center of the network. The
    illustration shows that the second observation of the list is valid: a text can
    belong to any number of categories, from zero to n. Potentially, a text can belong
    to all subgenres, or to none, as is the case for some novels of the corpus (Section
    5.1), which will be discussed in Section 8.6.


    In the graph of Figure 102, the edges represent the third observation: Some texts
    belong more clearly to one genre than others. To quantify this, I use the proportion
    of sources (publishers, literary scholars, readers, CLIGS annotation, as explained
    in Chapter 5.1). To illustrate this better, the following illustration retains
    the two types of nodes (texts in green, genres in purple), but changes the perspective.
    In Figure 103, I look at three specific novels that were included in the previous
