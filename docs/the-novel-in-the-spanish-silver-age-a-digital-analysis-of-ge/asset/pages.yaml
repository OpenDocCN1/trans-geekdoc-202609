  md: '# 4.2.2.3 Logarithmic Term Frequency


    A further step the data can be subjected to a logarithmic transformation (also
    called log transformation), which is often used in statistical analysis. Logarithms
    were proposed by John Napier in 1624 and were a useful method for the calculation
    of large numbers before the era of computers, allowing the transformation of a
    complex calculation into a simpler one (for example multiplications into additions;
    Jackson 2016, 42). Nowadays, they are still used for the visualization and transformation
    of data that follows an exponential rather than a linear growth. For example,
    the Richter magnitude scale for earthquakes from one to nine and the equivalent
    seismic energy. An earthquake of magnitude one represents around 100 kg of seismic
    energy. A magnitude of two does not double the seismic energy, but rather ten
    times more. The scale grows exponentially and so an earthquake of magnitude nine
    represents a billion (10⁹) of seismic energy (Jackson 2016, 42–43). A further
    statistical use of the logarithms in attempting to transform a skew distribution
    into a Gaussian distribution (Hanswler 2016, 115).


    Frequency in language can also be understood as an exponential growth, and therefore
    one could agree in transforming it logarithmically.


    The most frequent words remain those with the highest logarithmic values, but
    now the differences in Figure 41 are not as great as they were in the raw or relative
    frequency plots. Originally, the word de (of) was around 500% more frequent than
    con (with). After a log transformation, the difference is only 14%. Now all the
    most frequent words have a logarithmic value above six, without any great difference
    when they appear 7,000 or only 500 times. The distribution (observed in the histogram
    of Sub-figure B) is skewed to the left but much less in the previous transformations
    (but without a normal distribution, as one could have expected from Hanswler 2016).
    The logarithmic of zero is minus infinity, and the words that do not appear in
    the text should have this value. To avoid infinite values, it is common to replace
    them with the lowest value of the rest of the data. That is why the words with
