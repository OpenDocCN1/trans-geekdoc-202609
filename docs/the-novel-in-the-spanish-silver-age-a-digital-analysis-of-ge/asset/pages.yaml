    been previously used in this manner. The results show that some works clearly
    belong to the category of the novel,¹ some are clearly part of other subgenres,²
    and remain in a gray area.³


    The second question about classification is very simple: Does it work, especially
    in a challenging period like this one? Although the answer to this question could
    be seen as obvious from the tradition of computational approaches on genre, my
    case presents several aspects that make it especially challenging: First, its
    moderately large size of only hundreds of instances; second, the fact that the
    corpus is composed by literary works; third, the relatively high canonical status
    of these texts; fourth, the fact that the authors tried to escape the classic
    genre categories (discussed in Section 2.1.3); and fifth, the relatively large
    number of analyzed categories (more specifically, 26 different labels). In Chapter
    7.1, several classification tasks have been implemented, and multi-class and multi-label
    classification, using the probabilities of the classification, predicting the
    subgenres of chapters, and using literary metadata as features. All of them showed
    results were significantly higher than the baseline that would be expected from
    a random process. Specific tasks depend on the theoretical model of genre that
    is applied, on how much information of the labels the researchers are wishing
    to lose, and on their research goals. The highest results were between 0.7 and
    1.0 F-score for the different subgenres, with a mean of 0.86 (standard deviation
    of 0.09). These results show that the classification of subgenres is definitely
    possible and the scores can be relatively high. Even when authors tried to escape
