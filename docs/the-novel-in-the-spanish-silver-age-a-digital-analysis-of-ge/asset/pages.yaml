  md: 'while a logistic regression on a dozen binary features is likely to end in
    less than a second.


    This chapter is structured as follows: First, I evaluate which feature combinations
    achieve higher results in the task of subgenre classification. Second, I inspect
    the specific features that are more important for the classifier, i.e. that have
    higher coefficients. Third, several parameters (classifier, transformations, feature
    combinations and number of features) will be evaluated, with an attempt to explain
    how the different factors impact the classification process.


    # 6.1.2 Evaluation Dataset


    In Chapter 4.1, I have described the different textual layers and linguistic annotation
    applied to the entire corpus. In this section, I evaluate which of these features
    yield better results in a subgenre classification task. There are two decisions
    to be made about the linguistic information. First, the researcher has to decide
    which type of features should be used: tokens split by a simple tokenizer, idioms
    labeled as a single feature (multiwords in FreeLing), information about the tags
    of the file (how many paragraphs or verses does the document contain?) or textual
    annotation (narrative or direct speech passage), grammatical (PoS and morphological
    data), semantic (lexnames of WordNet and catalogs of the dictionary by María Moliner)
    and pragmatic (how many discursive passages the text contains).


    The second decision concerns the combination of these features. For example, lexical
    units can be specified by their PoS, considering different units when the Spanish
    word para is a preposition (para_preposition, ''for'') or ver a verb (para_verb,
    ''stop''). Since each sentence is labeled as part of a narrative or direct speech
    passage, each token can be treated independently (the word para would be split
    in the features para_nr and para_ds). Both specifications could be applied to
    each token, separated by PoS and the passage in four different forms (para_preposition_nr,
    para_preposition_ds, para_verb_nr, para_verb_ds).


    I choose to define 20 different combinations of features. The types of linguistic
    annotations have already been described with examples in Chapter 4.1. For further
    details, the Jupyter Notebook of this chapter can be consulted. The following
    list presents them from the most basic (tokens) to the most comprehensive.'
