    defines subgenres and the perspective of their study (Section 2.3.4). The researcher
    can undertake a longitudinal perspective, analyzing them as the communicative
    process between author and reader, who will require observing the clusters under
    these terms. In my research, I have adopted a cross-sectional perspective, allowing
    different institutions to identify the lists of authors and assign them to texts,
    also retrospectively. As the results of Chapters 6.1 and 7.1, these clusters can
    be predicted by linguistic and literary features. From this perspective, subgenres
