  md: '# 4.2.3 Variants


    In this section I want to present six variants, each of them altering specific
    decisions of the previous transformations. All of them are conceptually motivated
    in an attempt to obtain the desired characteristics mentioned in the introduction
    to this chapter. The first two are concatenations of a previously explored steps.
    The third and fourth differ from the classic Bag of Words document model, attempting
    to capture the frequency of the features is stable across the chapters of the
    text. The two final proposals are variants of the z-score, using either larger
    corpora (CORDE) or substantial subsets of the corpus for comparison.


    # 4.2.3.1 Rel-Log10-Zscores


    The already analyzed transformations (relative, log, z-scores, tf-idf, binary)
    could potentially be duplicated in a large number of combinations, especially
    if duplications are possible (for example if the logarithm is calculated in several
    steps). I have tested many of them to find that one could normalize the entire
    Bag of Words in a text (the entire vector of each text), but without success.
    Still, two motivated concatenations are worth closer observation. The first one
    adds three steps: relative frequency, logarithmic, and z-score transformation.


    The aim of this transformation is to obtain comparable data between texts (relative
    frequency), avoid skewness in the distribution (logarithmic frequency on base
    10), and weight the features in terms of their standard deviation in the corpus
    (z-scores).


    The plots of Figure 46 resemble those with the z-score transformation, but with
    an important difference: While the histogram in Figure 45 shows a Poisson distribution,
    the concatenation of these three steps is now showing (with 2,000 MFW) in Sub-figure
    B a skew bimodal distribution (it shows two peaks). A skewed distribution of the
    data can be beneficial for the analysis since many statistical tests expect a
    Gaussian distribution, which is very rare in the Humanities. One of the peaks
    of the bimodal distribution is populated by many words that share a similar frequent
    frequency, while the other only contains all words that have a zero frequency
    in each novel.'
  merge: -1
  img_proc: true
