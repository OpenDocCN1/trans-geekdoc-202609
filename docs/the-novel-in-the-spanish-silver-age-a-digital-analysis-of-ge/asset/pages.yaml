  md: '# 3.1.10 Gender Distribution


    One of the expected requirements for corpora in the last decades is a balance
    between genders: Texts by female and male authors should represent similar or
    equal proportions of the corpus to be representative for their societies. As I
    have explained, my corpus follows the statistical population obtained in the MdLe.
    What does the gender balance look like in this source? From the 107 authors of
    novels analyzed for the period between 1880 and 1939 by the MdLe, 100 are male
    and only seven are female: Bazán, de Burgos, Castro, Concha Espina, Mulder, and
    Sinúes. That means the literary source for the population of authors contains
    only 6.5% of female authors, leaving 93.5% for male authors. The number of men
    is clearly overrepresented in this manual.


    But what about the female authors that did get into the canon? Are they undervalued
    in comparison to men? Are they somehow treated as less important authors? To answer
    that, I again employ the number of pages dedicated to each author as an approximation
    for canon: The more space literary scholars utilized to discuss an author, the
    more important he or she is, the more canonized.^26 In Figure 25, the authors
    are ordered by the number of pages, with the gender encoded in the color of the
    bar.^27


    Although no female author is in the top ten, Bazán makes at least one in the top
    twenty. Then there are female authors in the medium range of the canon (de Castro,
    Chacel, and Concha Espina) and finally some among the less canonized writers (not
    shown in the figure: de Burgos, Mulder, and Sinúes). For both genders, the MdLe
    has a median of 5 pages.^28 Therefore, the data shows that it is harder for women
    to get into the canon, but when they do, they are treated as similar to men, as
    in the MdLe.


    For now, I am analyzing the gender distribution in the population of authors,
    but how does it translate into the population of novels? And how do these values
    change over time?


    In total, male authors wrote 673 novels (92.6%) in contrast to the 54 texts by
    female ones (7.4%). Figure 26 shows that the total number of works by female authors
    over the decades remains stable, meaning that the proportion


