  md: '# 2.2 Genre in Digital Humanities: Methods, Features, and Data Representation




    In this chapter, I present the most important approaches in the fields of Digital
    Humanities and Computational Linguistics to study genre, focusing on the applied
    parameters (methods, features, transformations, types of genres), the historical
    innovations, and the achieved results. I will introduce how genres have been integrated
    into research from the fields of Machine Learning and Digital Humanities. Then,
    I will describe the historical development of the analysis of this category through
    different fields, such as Corpus Linguistics, Computational Linguistics, and in
    more recent years Digital Humanities. In the next section, I will introduce the
    different types of tasks in Machine Learning (supervised and unsupervised), discussing
    how they have been applied for genre analysis.


    One of the core questions the researcher needs to answer is the way of representing
    the internal features of the texts. The most frequent representation is the Bag
    of Words model, in which the frequency of each token is counted and usually standardized
    by the size of the text (relative frequency of tokens in a text). As I will show,
    frequencies of tokens yield very high results in classification of genres, especially
    when their simplicity is considered. There have been further transformations of
    the vocabulary widely used in different fields: Computer Science converts the
    lexical frequencies into tf-idf values, a weighting the importance of each word
    in a collection. A similar idea follows the conversion of the relative frequencies
    to z-scores. By that,, which is the base of the most successful method in stylometry
    and authorship attribution: Delta (Burrows 2002). Both transformations and others
    will be presented in detail in Chapter 4.2.'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# The Novel in the Spanish Silver Age


    Besides the algorithms and transformations of the linguistic information, several
    other topics will be discussed in this chapter, such as the kind and source of
    the labels gathered, the size of the corpus, the kind of annotation or the level
    and variance of accuracy achieved for literary or more general genres.




    From the computational point of view, there are several distinctions how to operationalize
    the belonging of instances (such as texts) to categories (like genres). I am going
    to introduce several basic concepts of Machine Learning that will be used throughout
    this research study.


    The first possible case is when the researcher has data, but no labels for it.
    That would be the case for a corpus without metadata: it contains texts, but no
    information about who wrote each text, when it was produced, or to which genre
    it belongs to mention some typical categories). The lack of labels requires an
    unsupervised Machine learning scenario (Alpaydin 2010, 11: Müller and Guido 2016,
    133). In this case, algorithms can be used to group or cluster the instances that
    show similarity in their data. For example, if the analyzed corpus contains texts
    from Argentina and Spain, the algorithm could use the difference of frequencies
    of words like the pronoun ws and tomar (with several meanings: ''to drink'', ''to
    take'') on the other side, and the pronoun tí and coger (also with several meanings:
