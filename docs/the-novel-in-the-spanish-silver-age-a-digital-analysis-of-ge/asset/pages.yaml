- pgno: 467
  md: '# 11.27 Greguería


    Finally, the greguería is the least central category, with an eigenvector centrality
    very close to zero, and a very high specificity of the z-scores (standard deviation
    of z-scores of 2.16). This category is populated only by two editions in my corpus,
    and they are treated rather scarcely in the manual MDLE (five pages altogether
    for all the different editions). The classifiers then to achieve perfect results,
    even with very few features. The reasons why this label has been analyzed throughout
    this research study have been discussed in detail in Sections 2.1.10, 3.1.4, 5.1.7,
    and especially in Chapter 3.3, in which it has not been possible to prove that
    these texts are not somehow related to the novel when compared to the CORDE. As
    it happens with the episodio nacional, the description of this genre is based
    only in the CoNSSA and not in the CoNSSA.


    The most distinctive features of this genre are their lack of definition of many
    aspects, such as the protagonist, the type of representation of the world, the
    setting, etc. This is due to the lack of plot in the greguerías. However, these
    are not the only cues that the classifier can use to sort this subgenre correctly.
    Many semantic features show z-scores over four, such as movement (aparecer, matar,
    sacar), objects (huevo, trampa, esfera, cal, caja, billar, insignia), body (cuello,
    matar, biología) animals and nature (lover, astronomía, animals marked by WordNet),
    negative vocabulary (conventional, manía), humor (humor), and others (arrender,
    similar).


    As mentioned before, only two texts written by Serna are part of this category.
    The most similar subgenre shares only 3% of the features, and that is the comedy
    novel, followed only by the poetic and psychological novel (1%).'
