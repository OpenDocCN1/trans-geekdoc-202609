- pgno: 234
  md: 'Before I analyze which of the specific labels show consistent assignment among
    different sources, I want to observe how similarly each source labels texts with
    subgenres. The reason for this analysis is to explore whether the nine sources
    are similar to each other, if they form clear clusters or whether particular sources
    label in characteristic ways. I have a series of expectations on their behavior:


    +   1. Sources of the same type (from the cover, from the literature researchers,
    from the communities of users) assign subgenre labels in a similar way, and therefore,
    they will cluster together.

    2. Since the labels by the covers (of the digitized texts and from the National
    Library) are the only historical source, I expect them to cluster together, relatively
    apart from the rest.

    3. Since the manuals of literature and the publishers have very different interests,
    I anticipate these sources to be very dissimilar.

    4. The labels given by the communities of users (ePubLibre, Wikidata, Wikipedia)
    will be an intermediary source, similar to both the publishers and the manuals
    of literature.


    Evaluating these expectations will provide knowledge about whether these nine
    sources are alike or dissimilar and whether some of them overlap completely with
    other sources. In addition, there is so little investigation into the kind of
    information given by different sources of labels, the conclusions can be extrapolated
    to future works using similar sources.


    There are several possibilities for measuring whether two humans agree on a specific
    decision and to what degree. The simplest metric is to calculate the number of
    agreed cases, called raw agreement. While simple and intuitive, the raw agreement
    percentage does not take into account that a certain agreement could be caused
    by randomness or the totality of possible choices that should be considered (it
    is easier to agree when there are two possible answers than when there are). The
    raw agreement is a particularly bad indicator for scarce information (Artstein
    2017, 299–300), as is the case for genre labels. There is a series of common metrics
    in Computer Science that consider randomness in their calculation, such as Kappa
    (with variants like Fleiss and Cohen) and Krippendorff''s Alpha (Artstein 2017).
    They assign values between minus and one, with zero representing an arbitrary
    assignment. The major advantage of Alpha over Kappa is that it is more reliable
    for numerical'
  merge: -1
  img_proc: true
- pgno: 235
  md: '# The Novel in the Spanish Silver Age


    labels, while the mean of the Kappa across should be equivalent to Alpha. Scikit-Learn
    offers a function for calculating Cohen''s Kappa, and several Python implementations
    of Alpha are available. Since subgenres are nominal information and Scikit-Learn
    is a trustworthy library, I decided to use Kappa as the metric.


    To measure the agreement, a loop runs over the sources, selects a pair of sources
    each time and calculates their agreement (for example, between MdLE and Wikidata,
    MdLE and ePubLib, etc.). But what if MdLE assigns the label historical to a novel
    and ePubLib chooses two labels, historical and romantic, for the same novel? If
    the Kappa was calculated for these two sources, this would be understood as disagreement.
    But they are not strictly disagreeing, one source is merely giving information
    than the other. Due to the fact that the majority of the sources allocate multiple
    labels, the agreement of a pair of sources has to be computed for each label.
    This means, for example, that it must be whether MdLE and ePubLib agree on their
    assignment of historical novel for all texts in the corpus, followed by the same
    process for the romantic novel. After all labels are tested, a new pair of sources
    is compared for each label in the entire corpus. From these values, the mean Kappa
    score for the two can be calculated. For this process, I only use the semantic-labels
    obtained in the previous section.


    This methodology produces a table with all possible combinations of sources with
    a mean Kappa for the semantic-labels. The median of the Kappa-values of all the
    combinations of sources is 0.13, with a variance of IQR of 0.22 (mean of 0.23,
    standard deviation of 0.26). As stated above, one is the perfect agreement and
    zero is an arbitrary assignment. But how should a value of 0.13 be interpreted?
    In Computer Science, an agreement below 0.8 is perceived as tentative, while 0.6
    contains excessive disagreement (Artstein and Poieso 2008, 576). The agreement
    among sources is generally much lower than this, a reason why it may be convenient
    to use a more flexible interpretation of the agreement, in the case of a medical
    diagnosis, in which a Kappa of 0.4 is already a moderate agreement (Artstein and
    Poieso 2008, 576). In these terms, the sources would have a slight agreement on
    subgenres. The pairs of sources with mean Kappa-values over 0.4 are presented
    in the following table:


    +   I tested the one in <https://github.com/grrrr/krippendorff-alpha> which seems
    less performant than the Kappa function in Scikit-Learn.'
