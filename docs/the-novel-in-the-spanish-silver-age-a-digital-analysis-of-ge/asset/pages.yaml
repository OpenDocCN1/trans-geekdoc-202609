  md: '# The Novel in the Spanish Silver Age


    initiation that the publishers have considered. The Thema taxonomy of shared metadata
    by publishers (already applied in Section 5.1.5) contains a code (FB) called Fiction:
    general & literary. This code is part of a more general category (F) that stands
    for Fiction & Related items, which should cover all types of narrative compositions
    (drama, lyrical prose, and essay are part of other major categories). The only
    definition given in Thema is to use this label for ''literary & non-genre fiction''
    and it suggests applying a more exact categorization for works published in the
    last 50 years (FBA, Modern & contemporary fiction) or previously (FBC, Classic
    fiction). The papers mentioned in the previous paragraph do not offer a proper
    definition and for their analysis they rely on the assignment of this category
    and the texts. The papers presented in Section 2.3.1, it is unclear whether the
    intention or internal characteristics of literary fiction are, or the researchers
    are only approaching this label through its extension (the instances that are
    part of category and other books assigned with this label).


    The main question of this chapter is to observe whether literary fiction can be
    understood as a subgenre comparable to erotic, comedy, education novel, or memoir.
    If the answer is positive, we expect it to behave similarly to the other types
    of novels. To find an answer to this question, I will run several tests observing
    whether this specific label stands out from the group or not. If it does, I will
    have to suppose it represents a different type of categorization of texts, such
    as an operationalization of literaryness or a group of genres. There will be no
    reason to think that literary fiction is anything but a subgenre, If it does show
    similar characteristics to the other labels, there will be no the publishers are
    treating it.


    To be more specific, I will first describe the use of this label applied by the
    publishers, observing its frequency in sources, its correlation with other approximations
    of the canon, and general correlations with other metadata. Second, I will apply
    classifiers on linguistic information to predict this particular label and compare
    the results with the rest of the labels. Third, several types of metadata (especially
    regarding the author, but also metadata internal and external to the text) will
    be employed to discover whether literary fiction depends more heavily on non-linguistic
    information than the other subgenre labels. Finally, I will argue for adopting
    literary fiction as a hypothetical subgenre of the novel since the data of the
    publishers and the tests do not suggest otherwise.'
