    On the one hand, the binary classification yields higher results, leading one
    to believe that it is more accurate. The binary task is easier since the algorithm
    has only two possible values. On the other hand, the multi-class task more accurately
    fits the data, since CORDE gives only one label per text. Still, as I will show
    in Chapter 5.1, when more than one source is used, they tend to give several labels.
