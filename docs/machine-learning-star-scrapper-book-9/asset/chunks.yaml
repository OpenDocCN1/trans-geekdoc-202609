    # Arrival


    I took one look at the surface displayed on one of the screens and saw a spot
    where I thought the Buzzard might have been, and I hoped to see it again.


    Then, before I knew it, we had Tidaled away, and only a few moments later, we
    were washing out.


    On the screens was a distribution center space station where large cargo like
    what we had would be sorted and sent on smaller vessels to its final destination.


    “He still has so much infrastructure in place,” Lara noted.


    Staring at the screen, I was thinking much the same thing. “We thought that we
    had him beat, and he has just been at it this whole time, right under our noses.”


    “I wouldn’t call this right under our nose,” Ned corrected. “We are as far from
    Emortium as any have explored.”


    “Sure,” I said. “But the point remains valid.”


    Ned agreed. “Yes, it is infuriating to realize that he has been working like this
    for all this time.”


    The comm screen lit up, and there was a flashing green indicator for us to input
    a code. The station had some cannons that were trained on us as we floated forward,
    and since this vessel was as far from a combat ship as you could get, they could
    blast us to smithereens if they wanted.


    Ned entered the code, and we waited.


    A moment later, the screen flashed green, and then in the distance another green
    light illuminated above a docking bay.


    I grinned, excited to be infiltrating a facility that shipped things directly
    to Twain’s active enterprises. “Here we go.”


    ## 20


    ![](OEBPS/image_rsrc3N4.jpg)


    ## The Infiltration


    Ned brought us into the docking bay. Or, more accurately, he pulled the back of
    the ship to lock against the side of the station. Since they had the same manufacturer,
    the station and ship were designed to work in perfect tandem. Once the seal had
    been created, both sets of doors could open and allow the cargo to be moved from
    one place to the other.


    When they joined, the four of us were ready to go. The door opened, and we saw
    several serfs from the High Cloister waiting to receive their goods.


    The moment they saw us, they all rushed forward to attack with nothing more than
    their hands. It wouldn’t even qualify as a fight, but I called out to my friends
    to keep one of them alive.


    So we all avoided shooting at one old man off to the right as he came for us.
    Instead, Alek grabbed him and squeezed him with both hands to keep the wretch
    from moving. He wriggled against the strength of the Kyrog but couldn’t do anything,
    and soon I was right beside him.


    I pressed the button on the little rectangle and watched as… nothing happened.
    The man kept struggling and trying to press against Alek as he had been.


    But then he stopped.


    He blinked in confusion as if he was waking up from a dream.


    “They are here,” he said. “The holy war has begun.”


    Then he looked around at us. “You! Who are you and where am I? Who would dare
    molest a member of the Inquisition?”


    “I can’t believe it,” Ned said in my earpiece. “He did it.”


    “You have been subdued and kidnapped,” I informed the man. “The High Cloister
    was destroyed by a false Inquisition and now lies in ruin. You can help by giving
    us the information that we require.”


    *(Note: The remaining text in the input contained garbled/repetitive sentences
    that did not form coherent narrative. Following the instruction to keep core content,
    the meaningful narrative ends above.)*

