- fmt: '

    She put her palm on my face and pushed me playfully down onto the bundle of furs.
    “Okay, you made your point. I guess I just wish that things could be a little
    more straightforward sometimes.”


    I took another sip of the coffee sludge. “At this point, I just always expect
    everything to be painfully complicated.”


    “But at least we have `Chaz` boxed up,” she said. “So we can start going after
    `Twain` once we get off this rock.”


    “Exactly,” I said. “I''m ready to take this fight to him, and maybe, in the meantime,
    deal with whoever knocked us out of commission.”


    She lay back down, resting her head on my bicep. “We really do have a lot of people
    trying to kill us,” she said with a little smile. “If you had told me when we
    were kids that little `Hank Spears` from `Bussel` would be one of the most wanted
    men in the universe, I would have laughed you right out of the room.”


    “You and me both,” I agreed. “When this is all said and done, hopefully I can
    go back to being one of the most forgotten men in the universe.”


    That drew a laugh from her. “I''m pretty sure that if we pull this off, your name
    will be right up there with `Captain William West`, hero of the Five Battles and
    pilot of the `Starblaster`.”


    I chuckled but then my face dropped. “I’m worried about `Ned`. He hasn’t come
    back online.”


    “Well, it took him over two hundred years the last time, so cut him some slack,”
    she said. “He’ll be back with us soon.”


    “I hope so,” I said. “We’ve come too far for this to be it. And it’s even more
    strange that he’s just a cube. With a person, it’s pretty easy to tell if they
    are alive or dead, but⁠—”


    She didn’t let me finish. “What’s `John Gregory`, then?”


    I let out a long sigh. “Okay, other than the occasional corpse reanimated by what
    I have to assume is nanotechnology, it''s pretty easy to tell if a person is alive
    or dead. But `Ned`’s cube being off could either just be him taking some time
    to reboot, or he could be broken, or he could be gone for good.”


    “Wouldn''t that be a hell of a thing,” she said quietly.


    “What?”


    “If that was how `Ned` went down,” she said, a little more casually than I was
    comfortable with. “If we met his rival, and then a little bit later he was just
    offlined forever by an `EMP`. Nothing poetic, nothing heroic, just a boring old
    tragic loss in the middle of our story.”


    I could tell that she was just thinking out loud, but the idea of it made me sick
    to my stomach. “That can''t be how it is. He might be a computer program in a
    cube, but he''s also one of the people I''m closest to in this entire universe.”


    “Oh, I know,” she said, hearing how seriously I was taking this. “I was just…”


    “Right,” I said. “But it''s just weird to realize that one of your best friends
    is lines of code.”


    She reached up and put a hand on my cheek, then drew my face to look at hers.
    “He''s going to be fine, `Hank`. His story is far from over.”

