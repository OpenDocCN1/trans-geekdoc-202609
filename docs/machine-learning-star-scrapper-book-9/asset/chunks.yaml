    “Maybe it’s for the best that you don’t have a body, then,” Alek observed.


    “And let’s be real,” Imogen added. “You can still do a hell of a lot of damage
    as you are. Flying the `Buzzard` and hacking systems has come in pretty handy
    if you ask me.”


    Ned grunted. “I appreciate that, but I still don’t think that it is as satisfying
    as punching someone.”


    “It ain’t,” Clynt said. “Putting fist to jaw is right up there with makin’ a new
    litter, iffin’ you ask me.”


    “That brings up an interesting point,” Lara said, leaning back in her chair as
    the `Buzzard` entered the gyre tube. “Do you have a sex drive, Ned?”


    “Lara,” Alek scolded. “I really don’t know if that is the kind of thing we need
    to be discussing.”


    Imogen leaned into the center of the cockpit. “He does,” she said in a stage whisper.


    “Really?” I asked.


    “Now, what in the hell would be the point of that?” Clynt said. “Like programmin’
    him to have an itch he ain’t never gonna scratch.”


    We all turned to the console speaker, waiting for an answer.


    “Imogen is right,” he said after a long time. “We were programmed to have normal
    human desires in something that is akin to a sex drive, but we don’t satisfy it
    the way you do. More accurately, it comes in fits and spurts. Pun, unfortunately,
    intended.”


    “I was a doctor back on the homeworld,” Alek moaned, making it clear how much
    he would like for us to change the subject, but I was fascinated.


    “Is that why Edwin was able to essentially cheat on his wife with a program?”
    I asked. “Because there was already that instinct baked into the code?”


    Ned snorted. “I can’t speak to that specifically, but it sounds plausible, yes.”


    “Wild,” Lara said.


    “The Inquisitor said it was the very quintessence of abhorrence that the machine
    would want to procreate,” Imogen said. “He would go on rants for hours about it,
    preaching his disgust with every single aspect of it.”


    Lara chuckled. “See, I hear that, and I just think he’s talking about it so much
    because he’s kinda into it.”


    “The lady doth protest too much, methinks,” Ned added.


    “Isn’t that the thing with this kind of zealotry though?” I said. “John Gregory
    spent his life so obsessed with hating this thing that it really just became his
    entire personality. In the end, he was the one thinking about robo-fornication.”


    Something about that term seemed to amuse the others, and I was met with some
    laughs.


    “I would think about that sometimes too,” she said. “As he would be turning red
