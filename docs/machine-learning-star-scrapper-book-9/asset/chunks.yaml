    “Did they?” Clynt asked.


    The AI didn’t answer at first. “More often than not.”


    “Really inspiring,” Lara said.


    “And once we have the ship, we can have Ammo and the Peacer fleet Tidal in and
    back us up as we escape and sabotage their systems,” I suggested.


    Clynt pulled his hat back on. “This time I ain’t trusting no machine. We blow
    it ourselves and watch it burn. Hear me?”


    “That’s not fair,” Ned said. “Bard was dedicated to the cause, but Twain was in
    there too. He would have blown the High Cloister if he could have.”


    Clynt held up a paw defensively. “I ain’t sayin’ it were his fault, but from here
    and henceforth, I want to see the kill shot. So to speak.”


    “Fair enough,” I agreed. “When we get on the ship, Clynt, you can set up the demolition.”


    He grinned. “Stealing the keys off a roboman and blowin’ up a ship what turns
    people to mechazombies sounds like a good afternoon for me.”


    “Inquisitor Death on line one,” Libby said in a voice that made it sound like
    she was pinching her nose.


    “Hank Spears,” the man intoned. “I will admit that I never expected to hear from
    you.”


    I smiled. “Sure, I can understand that, but I wanted to tell you some good news
    and some bad news—which do you want first?”


    “Whichever you prefer,” he said, not sounding particularly interested in my question.


    “Well,” I said. “The good news is that I killed Inquisitor John Gregory, and the
    false Inquisition will probably wither and die.”


    The man blinked a few times into the camera as though he couldn’t believe what
    I’d just said.


    “This is incredible news,” he said finally. “I know he was your enemy, but you
    have done the true Inquisition a great service today. Thank you.”


    “No prob, Bob,” I said. “But this is where I need you to lend a hand.”


    “If it is within my ability to do so, I shall,” he said, voice full of honor and
    pride.


    I leaned in close to the console I was speaking with him through. “I need you
    to come with me and pretend to be part of the false Inquisition. Just for, like,
    an hour. Plus, I need to borrow some robes.”


    “I don’t understand,” he said, and I appreciated that he didn’t just shoot me
    down. So I explained what I needed from him and gave him the absolute bare minimum
    amount of information so as not to reveal too much.


    He stared at the screen when I was done, probably pondering what I had said. “I
    want to do as you ask because you have honored the Inquisition with your actions,”
    he said.


    “But?” I asked.


    “But playing this part would mean meeting with people who are obvious abominations
    and who need to be purged from the universe,” he said, and even though I knew
    what he was, it was still jarring to hear.


    He was so tempered and calm and, for an Inquisitor, rational that hearing the
    zealotry was tough. But I didn’t react.


    “How about I do you a solid,” I offered. “While I have my man on the inside retrieve
    what I need, I’ll toss a tracker on the ship too. Once I get going to my next
    location, you can follow them and do whatever you need to do.”


    “Ha!” Ned said but in my earpiece. “Act like you are doing him a favor while getting
    him to take out our enemy! I love it!”


    I suppressed the smile trying to grow on my face.


    “I accept these terms,” he said. “I do not like deception, but anything that advances
    our cause is worthy of an attempt.”


    “Great,” I said and gave him a time the following day and a location where we
    could gather before the meeting, and he nodded.


    When the line went dead, I could tell Lara was about to say something, but I spoke
    to Libby first.


    “Hail General Livingstone,” I said, calling her by her title rather than just
    Ammo since it sounded more important when I did it like that.'
