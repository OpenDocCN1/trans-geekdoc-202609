    still examining everything as she went. As we reached the cells, she stopped and
    looked through the bars to the little bench within.


    “When he took me prisoner, it wasn’t the first time I had been in here,” she said.


    “Yeesh,” Ned said, and I wondered if it was just to me. “This guy sucks On Ice.”


    She ran her hand over the bars. “He would put me in here not just as a punishment,
    but also a reminder that I was alive. ‘Suffering is human,’ he would tell me all
    the time. The point he was trying to make was that we people could hurt, and the
    machine could not. Now that I have met a handful of AI, I know just how false
    that is. Both Ned and Cassiopeia seem to be in as much pain at the moment as Lara
    is about her loss.”


    “It’s true,” Ned said. “Not to diminish Lara’s loss in any way.”


    “And even that politeness,” Imogen said. “That care for your friend. It''s something
    that John Gregory could never understand. Not only did he not get that programs
    could do it, but he also didn’t understand how to do it himself. He was so dedicated
    to the eradication of AI that he lost all the things that made him human himself.”


    I thought about that for a moment. “That’s assuming he ever had those things.
    It’s possible that he was just born rotten. These AI were programmed to be like
    us, warts and all, but not all people are actually ‘human’ in that way. Some just
    have that evilness in them.”


    “What about Twain?” Imogen asked. “What is he?”


    That gave me pause. I didn’t know the answer. “Ned,” I said, stepping into the
    cockpit with Imogen coming up slowly behind me.


    Ned sighed. “I am not sure,” he answered. “I mean, we weren’t even told he was
    called Twain at the time of the war, just the Enemy AI. We were given almost no
    information about the actual enemy.”


    “That seems like the kind of thing you guys should have known,” Imogen said. “Should
    have researched and studied. If not only to defeat him, but to prevent AI like
    him from happening again.”


    “It’s not really any kind of cautionary tale if no one learns anything from it,”
    I added.


    This was one of those times that I wished Ned had a face that I could watch react
    to our words. They had programmed him well to emote with sound effects and tone,
    but something was undeniably lost without the ability to analyze his facial expressions
    as well.


    “Just because I wasn’t privy to the information doesn’t mean that it wasn’t collected,”
    Ned said.


    Imogen stepped into the room, her eyes running over everything within. “If it
    had been collected, I would have known... Probably.”


    “You think that everything the Consortium gathered on the enemy was shared with
    the Inquisition?” Ned asked.


    She made a face that indicated she did not believe that at all. “Oh no,” she said.
    “But the Inquisitor was dogged and chased down every piece of information he could.
    There were times that we would do things that I believed were against universal
    law, but he always said that we were above the law.”


    “You were,” Lara added. “While the rest of us are adhering to universal law, as
    well as our own codes, the Inquisition was given carte blanche to just run around
    the universe doing whatever it wanted.”


    Imogen was certainly not going to defend them or even say anything in response,
    so Ned did. “Interestingly, the term ‘carte blanche’ has seen many definitions
    before coming to be the expression Lara just used. It started with the actual
    meaning, blank or white paper, and was a military term for surrender, not unlike
    white flag,” he began.


    “I’ve had enough lessons on this ship,” Imogen interrupted. She was going to have
    a difficult time as long as we were aboard the Mortal Coil, so I thought it was
    best to get us out of here as quickly as I could.


    Lara was sitting in the copilot’s chair, so I moved in beside her.


    “Am I correct in assuming you would rather not be the one to pilot?” I asked Imogen,
    but she was already sitting in a little seat that folded down from the wall and
    answered with nothing but a quick look.


    I started the ship again, some indicators coming on to tell me that the placemag
    legs were damaged. But, as I had affirmed earlier, she would still fly.


    “It’s like being in some kind of nightmare,” Imogen said as I lifted the craft
    off the bay floor. “Even the sounds of it still make me sick to my stomach.”


    “Zenobia always said that hard memories were good lessons,” Lara added. “This
    place might have been a nightmare factory for you, but it is what brought you
    here, to this moment.”


    Imogen looked at my old friend. “She sounds like a smart woman,” she said after
    a moment. “I would have liked to have met her.”


    Lara smiled. “She would have liked you,” she said. “You take no shit and stab
    anyone you think is bad… That was just the kind of thing she responded to.”


    “Who knows,” Imogen said, “maybe if I had been brought up by someone like her,
    I wouldn’t be this way though. Maybe I would be better.”


    Lara looked at the younger woman, who was staring at the ground. “Imogen,” she
    said, getting her attention. “You are great the way you are. That was my point.
    We couldn’t do any of this without you.”


    “It’s true,” I said, piloting us out into space and allowing the Tidal Drive to
    warm up.'
