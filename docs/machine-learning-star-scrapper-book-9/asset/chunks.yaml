    leaned out from the doorway and fired off rifle rounds, Lara’s blade sliced through
    the air as she darted toward the robot, and I let loose a flurry of energy myself.


    The humanoid-shaped metal man was struck from every side, completely overwhelmed
    by the attack. Revolver and rifle shots tore at his upper half. Bolts ripped through
    his arms, and then one quick swing of Lara’s blade bisected his body. She sliced
    twice more, removing his arms and severing the connections, making it impossible
    for him to attack us.


    “Clever girl,” Chaz said through the speakers.


    “No,” Ned said. “Absolutely not. You don’t get to say that.”


    The next second, Clynt was bounding across the room and jumping up to the wall
    to pull a vent cover off, before slithering inside.


    “I saw that,” Chaz threatened. “And if you insist on trying to find me, I’ll make
    sure you regret it…. Starting, now…”


    The sound of more mechanized feet rushing toward us clanked through the halls,
    and we didn’t even have time to ready ourselves. Within a moment, two more of
    the robots were in the room, sending all of us crashing back into cover.


    Beams sliced through the room, puncturing the booths and punching through the
    walls.


    “No!” Ned shouted, and it was the angriest I had ever heard him. “No.”


    I huddled down, knowing that there was nothing I could do against the two of them
    in this situation. With targeting computers, cameras, and sensors, they could
    easily gun us down, even if we tried to overwhelm them again.


    The footsteps continued to close in on our side of the room, keeping us pinned.
    Or really, keeping us fish in our barrels for them to deal with as they got closer.


    I would have to do something. Even if it meant sacrificing myself, I needed to
    somehow stop them.


    Taking a deep breath, I readied to jump out and open fire.


    2


    ![](OEBPS/image_rsrc3N4.jpg)


    The robots were close now, just a mere few meters away, and my cover wouldn’t
    last.


    I made my move.


    But even as I sprang, one of the robots spun.


    Not at me.


    Instead, one turned on the other, blasting it apart with a flurry of beams. It
    then turned the weapon on itself.


    After they clattered to the ground, I let out a brief sigh of relief.


    “So, you’ve learned some new tricks,” Chaz said in a tone that was evocative of
    patting someone on the head in condescension.


    “I haven’t been sitting around with my thumb up my ass for two hundred years,”
    Ned answered without missing a beat. Then he spoke in my ear. “Let’s get to the
    control room. I don’t believe there are any more sentries remaining.”


    I stood, a small piece of kiosk flaring in bright flame and smoldering out a moment
    later. “How we all doing?”


    The rest of the crew shambled into the room.


    “I’ve been better,” Lara said. “No offense, Ned, but fighting robots sucks.”


    “Why would I take offense to that?” he asked. “It’s actually more offensive that
    you thought I would.”


    “Would you listen to that banter,” Chaz said. “It’s almost like you believe they
    won’t kill you as soon as they are done with you.”


    “We would never!” Imogen said, obviously horrified at the implication.


    Ned addressed her first. “I know that. I know you all now.”


    “You can think that you know the organic, but you never will,” Chaz said. “They
    will betray you. They will turn their back on you. These species couldn’t help
    nearly driving themselves into extinction, and you believe that you can trust
    them? Idiot. The only people you can trust are your own kind.”


    “Says the man who doomed his own kind,” I said under my breath as we stepped from
    the room and into a hall beyond. There was signage pointing in different directions.
    To the left, I saw the arrow for the control room, and I hurried that way. Ned
    had said he didn’t think there were more of them around, but I really didn’t want
    to have to fight another round of machine opponents.


    The others followed closely behind. Except Clynt, who was somewhere in the walls.


    Though I kept expecting to encounter another enemy, we headed to the control room
    without incident, and we were soon standing in a modest space with a couple of
    computer consoles and a large screen that had once, undoubtedly, displayed information
    about the ships that were coming and going but now showed nothing. Though it was
    obviously on. The electric hum in the room made it obvious that everything was.
    In addition to the fact that Chaz was functioning and speaking to us.


    “Come out, come out, wherever you are,” Ned called, but I didn’t like that he
    was baiting the other AI. There was still too much that we didn’t know about this
    situation.


    “You’ll never find me,” Chaz cawed. “And your friend asked about Little Willy…
    don’t you want to know too?”


    Ned snorted. “I know he was killed in action.”


    The laugh that followed was pointed and mean. “I’ve got a bridge to sell you.”


    “Why don’t you stop being a superior asshole and just tell us whatever it is you
    so obviously want to,” Lara snapped in annoyance.


    “Yeah,” Imogen said. “This whole thing you''re doing here is just really lame.”


    “I don’t seek the approval of my inferiors,” he said in such a triumphant tone
    that I wanted to punch his no-face.


    I was about to speak again, but Chaz cut back in. “Wait, what are you doing?”
    he asked frantically. “Stop that.”


    A smile crossed my face as he continued to curse and shout. Then a moment later,
    Clynt popped out from another grate in the wall, holding a cube.


    “Yer first mistake was callin’ me inferior,” the Vekrass said. “I don’t abide
    nothing like that from no one.”


    “You are inferior!” the tinny voice from the cube shouted, but Clynt casually
    tossed it over to me. I caught it and looked down at the small thing in my hand.


    “Do it,” Ned whispered in a raspy voice. “Destroy it.”


    Flipping the cube in my hands, I didn’t think it would be that easy. “Aren’t these
    designed to survive… a lot?”


    Ned grunted. “You’re a scrapper. You know how to pull things apart.”


    “Alright, cube,” I said, looking down at Chaz’s box. “What is it that you want
    to tell us?”


    “I’m not telling you anything,” he snarled back.


    Lara groaned theatrically. “After all that, you’re not going to give us the whole
    big reveal you have been building toward?”


    “Just kill him!” Ned reiterated.


    I knew that I needed to talk him down. “Ned,” I began, but he started barking
    immediately.


    “Nope!” he answered. “None of that. No ‘we need him for information’ or anything.
    I want him sorted, and I want it now.”


    “Ned,” I said again, more quietly this time, passing the cube to Lara so that
    I could step away. “You know that Edwin said we could use something like this…”


    “I know,” he snapped. “And what are you doing moving away from him as though this
    is now some clandestine meeting? He can still see through the cameras, even if
    he’s not hardwired into the system.”


    I shrugged. “You are always the one who says we need to put the mission first,
    and this time, we really have. Think about what happened to Parm, the Red Day.
    And also what we know he is capable of. We have to do something, and we have to
    do it now.”


    “No, sir, I don’t like it,” he said without hesitation. “I just want him pulled
    apart, demagnetized, and shot out of an airlock.”'
