    “你构想错了，”他说，正如我像往常做的那样，我提醒自己他的话语中并没有恶意。他只是按照他所看到的方式陈述事实。


    我把设备收进兜里。“你说你有一个位置坐标？”


    “我正在处理大量数据，”他说，但被他的一名助手富有戏剧性的咳嗽声打断了。“我和我的团队正在处理大量数据，我相信我们很快就会找到很多位置，但我最近的几条记录中提到了其中一个，我相信它能引导你发现某些东西。”


    “发现什么？”我问道，好久第一次获得关于除掉特恩（Twain）的第一线索，我感到非常兴奋。


    他的眉头略微低起。“我不知道。这就是为什么我说‘某些东西’。”


    “噢，”我说，我的热情消减了许多，“行星在哪里？”


    “它目前还没有命名，位于这里非常远的一个几乎未开发的扇区，”他回答道，“这意味着你将花费很长的旅行时间，并消耗大量的燃料，但我相信查尔斯·福克斯（Charles
    Forks）医生能够在这方面提供帮助。”


    我笑了，看来这次冒险可能得到了回报。“你有机会见到他吗？”


    “我刚说了他的研究能够提供帮助，而且你知道他是被带到这个设施的，”爱德温（Edwin）说道。“你不能从语文中推断出我见过他吗？”


    我吸了鼻子，缓慢地吸了一口气。“我可以推断出来，”我说。“我想表达的是，你审核了他的科学方法，而且它看起来很合理？”


    “噢，是的，”爱德温回答道。“我在工作期间读过他的其中一篇研究论文，对他名声有所了解。虽然我无法想象像他那样的生活。”


    作为一个见过他曾经居住过的那块岩石的人，我觉得这有点可笑，但我没有说什么。


    “我很兴听到你相信他能为我们的事业做出贡献，”我说，“我把你的意见视为金科。”


    “你应该这样做，”他说。“我相信只要给予时间和资源，福克斯医生能够完成某些非凡的成就。自然地，我会协助他的努力。”


    我本想开玩笑说，那可能只是为了让他也能在发现上签上自己的名字，但我清楚。


    “我想我应该准备好船员，给‘秃鹫号’（Buzzard）准备一些燃料了，”我说。


    莉比（Libby）在这段对话中第一次开口。“和平者维护小组现在正在处理‘秃鹫号’，”她说，正当我准备评论她说得如此直白时，她又补充道，“因为我是一个能预判你需求的酷气大姐（boss
    ass bitch）。喔呼！”


    后半部分让我措手不及，我我不禁笑出声。“宇宙中真的没有第二个像你这样的人了，”我说，我是发心地说的。


    “我知道，”她回答道。“另外，你能告诉我说些好事吗？”


    我挑了挑眉。“好事？”


    “是啊，比如像什么趣闻的轶事之类的？”她说。“因为拉拉（Lara）和内德（Ned）都在竞选美国笨姆镇（Bummertown）的市长。”


    “拉拉发生什么了？”内德问。


    我看向他的立方体。“泽诺比亚（Zenobia）被杀了，可能是被陷阱猎人杀的，我们认为那也是导致我们坠落的原因。”


    “她认为她的行为与她朋友发生的事情之间存在因果关系吗？”爱德温问道。


    “是的，”我说，“而且她对此普遍感到非常难过。”


    虽然感觉就像在向一颗绿豆解释情感，但我不得不加上最后那部分。


    “悲伤是对失去的恰当反应，”爱德温说。


    我对此无话可说，但内德开口了。“太难了，”他说。“但我觉得，在这样的时刻，至少我们还有彼此。”


    “这是真的，”我说，不再觉得一个人类和一个计算机程序会对同一件事有同样的感觉很奇怪了。


    甚至在不久前，我还认为所有的 AI 都灭绝了，而仅仅在此后，我就在这里把一个人正在经历的损失与一个计算机程序的损失等同起来了。当然，那个程序目前似乎也在经历一场生存危机，所以似乎一切皆有可能。


    “爱德温，”我站起来看着他，“做得如既往。”


    他点了点头。


    “还有内德，”我说。“我很抱歉，但查斯（Chaz）是一项极其宝贵的资产，在我们完全没有其他线索的情况下不能浪费他。”


    “我理解，”内德说，“并不意味着我必须喜欢这样做。”


    “当然不，”爱德温说，“理解和享受是完全无关的。”


    我拿过内德的立方体，然后离开了房间，对爱德温所做的一切工作感到兴奋，但也对离开他的实验室感到高兴。那个男人让我精疲力竭，在经历了这一天的一切之后，我已经精疲力竭了。


    尽管昨晚睡了一会儿觉，但我感觉自己可以爬进铺位睡几天。


    当然，这并不可能的，我得行动了。


    经过食堂时，我看到阿莱（Alek）和伊莫金（Imogen）坐在一起，喝着几杯看起来像热可可。我停下来告诉他们消息，有好有坏的，他们站了起来，嘟囔着我们走得像深夜潜行的小贼一样。


    “抱歉，”我说。“我们必须尽快赶大会（Conclave），没时间。”


    “我们都是，”伊莫金笑着说。

