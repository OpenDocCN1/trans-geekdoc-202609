    “他没说，但听起来很严重，”莉比说，“老实说，他这么在意你，感觉还挺可爱的。”


    在我来得及开口之前，她补充道：“抱歉，汉克。”


    “没关系，”我说，大部分时候是这么认为，“我相信这和工作有关。”


    “你可能对的，”莉比说，“指他裤里的工作！”这简直太荒唐了，我不禁笑出出来。


    “看到我的什么梗了吗？”她兴奋地问，“我是在说他的阴茎。”


    “我们懂了，莉比，”拉拉走进指挥中心时说道，“帮我接通曼恩。”


    片刻后，那位闻名的赏金猎人出现在房间中央的屏幕上。


    “拉拉，看到你还活着我太高兴了，”他兴奋地说道，他的眼神似乎在屏幕上上下缓慢移动，“尽管你看起来有些憔悴。不过还是很火。”


    “曼恩！”她厉厉地说，“你为什么要叫我？”


    他暗示性地挑了起眉毛。“这对你来说值多少？”


    拉拉深吸了一气让自己冷静。“曼恩，你叫我是为了告诉我某些事，现在我想知道内容，而且不想费那些圈子。”


    他似乎在考虑自己的选择，最后说道。“我正和我的朋友卡恩吃晚餐，讨论我的未来以及我加入⁠的的可能性……”


    “这些和我们讨论的内容有关吗？”拉拉不耐烦地问。


    曼恩笑了，脸上带着灿烂的笑容。“我想不相关，但我确实喜欢聊聊这个。”


    “你听到了什么？”拉拉问，尽管这听起来更像是一个命令。


    “捕猎者在追你，”他说。


    拉拉凑近摄像头。“你知道什么？”她问，“你说他们在追我是什么意思？他们是议会的正式成员。他们是在玩政治游戏吗？试图毁掉我的名誉？”


    “不，”他回答道，语气沉重起来，“我相信他们计划要伤害你。”


    拉拉惊讶地摇了摇头。“这不可能，”她说，“这违背了我们准则所代表的一切。你必须举报他们。”


    “我考虑过那个，”他说，没有了往常的张狂，“但我决定不这样做。”


    “为什么？”拉拉质问道，充满了正义的愤慨。


    他沉默了一会儿。“因为你刚才讨论的那些政治。”


    “这已经超出了政治范畴，”她说。“这是对我们信仰的侵害。”


    曼恩意味深长地笑了一下。“捕猎者的一切都违背了议会应该表现的方式，”他说，“但这并不意味着我们要冲进去。我们必须聪明地应对，否则幕后黑手就会溜之无形。”


    “他是对的，”我不自主地低语。


    拉拉压下所有的愤怒，说道：“好吧。告诉我发生了什么。”


    “我跟着一个捕猎者进了一条小巷，听到她在谈论月之法拉克斯是如何被死的，以及猎隼罗恩是被带去审问的，”他解释道。


    事实上，我们确实杀了法拉克斯，而拉拉正是带走罗恩的人，所以这些都是准确的。


    “我试图找出另一个声音是谁，但由于他们通过某种消音器说话，所以无法识别。不过词句很清楚，”他说，然后模仿了一种闷哑的声音，“维克斯和她的那个同犯必须被消灭。”


    这些话让我们都大吃一惊。“威胁同为赏金猎人是一回事，但这样攻击我们简直是彻底的耻辱，”拉拉说。


    “朝我们发射电磁脉冲，然后把我们遗弃在一个饱经战争的星球上等死，这在不看起来像你做的情况下是个够聪明的办法，”我指出道。


    她太关注这个威胁，至于没有把这些线索联系起来。她愤怒地眯起眼睛。“曼恩，我几乎确定是一个捕猎者想要杀我们。”


    “几乎确定在法庭上是站不住脚的，美女，”他说。“我们需要一些具体的证据。”


    她手指敲着控制台。“你听到过罗恩说了什么吗？她的调查有什么泄密吗？”


    “议会审问不是那种可以轻易泄露的消息，”曼恩说道，补充道，“代价很很大。”


    “你是说你可以……”


