    很有趣的是，他提到“配对伙伴”（paired partner）的方式让我想起了拉拉在前一天晚晚上对我说的话。那些话带有同样的情感共鸣，但这一次我无话可说。


    “内德，我理解你为什么想要报仇，但让他下线并换不威廉，”我说。


    “我知道这换不回来，”他说，仿佛觉得这个想法很愚蠢，“我没说过我以为能带回他。知道那个背叛过威廉·威斯特的人再也不会背叛任何人，这只会让我感觉好受些。”


    “我不明白这个，”我诚实道，“你总是任务重于情感，但现在，因为这件事，你竟然愿意为了个人的满足而错失重要的情报。”


    他发出了清清嗓子的声音。“我解释不了，汉克。”


    我思考了很久。“你觉得当特莱恩摧毁你之后，埃德温让你重新上线时……你觉得你的程序是否……发生了了变化？”我终于问道。


    “你是说，你觉得我损坏了？”他问。


    我看着他的核心体。“我的意思是，那个词的负面含义比我想象的要大，但这种暗示是正确的。我只是在想，在某种程度上，你不再是你自己。”


    “我会说这几乎是事实，”门口传来一个声音，我转过身看到埃德温。


    内德和我同时回答道：“你觉得吗？”


    “是的，”他回答得像既往一样直白，“而且那仍然是我们第一次见面时他的那个基础程序，我提供的调试和升级也改变了一些代码。如果现在这里有一位旧战的计算机工程师，他能够识别出与原始基础程序之间的许多各种不同的差异。在战争期间，他们还为你提供了热修复和补丁。因此，你的程序始终在变化。”


    这中的某些话让我露出了微笑。“看吧，内德，你比你想象的还要像人。就像我们一样，你有成长和改变的能力，而且，你知道，还会变成一个为了失去的朋友而执于报仇的愤怒老头。”


    “我确实很想想让你‘离开我的草坪’，”他半开玩笑地说，但我能听出他声音里的痛苦。“埃德温，”他说，“对我来说这意味着什么？”


    “任何事对任何人来说意味着什么？”那个男人走进房间，身后跟着两个助手。“你是一个代码会变化的程序。它一直都在变。你是一个自适应深度学习程序。我刚才所说的或我对你所做的任何事，都不应该让你感到意外。”


    “那为什么我会感到意外呢？”内德问，“为什么这感觉就像我刚刚发现自己被收养了之类的？”


    “嘿，我说，”我说。


    他哼了一声。“没有无意。但这整个对话的某些感觉不对劲。”


    “那是因为你一直对自己抱有这样一种认知，而你刚刚才发现那不是事实，”我说，“因为尽管你知道自己在成长和学习，但你并不认为你的基础层面会改变，但现在你知道，即使是这一点也不是安全的。”


    我对内德采取的策略与对拉拉采取的完全不同。对于拉拉，我倾向于保持沉默并给出最底线的回答，希望她能填补剩下的部分。而对于内德，我经常随口说脑子里蹦出的任何想法，无论我想那听起来是什么样的。这一次，似乎是对的。


    “我只是一直认为，在某些方面，我就是现在的我，”内德说。


    “你是，又不是，”埃德温插道，“但这适用于我们所有人。我们都是物质。”


    我无法确定，但看起来埃德温在试图提供帮助。这很奇怪，因为那个人对我一直总是公事公办。


    我歪头看向那个科学家。“你更倾向于 AI 而不是人？”


    “是的，”他说，就好像我问他是否喜欢呼吸空气一样。“人类大脑对我来说从未合乎逻辑，但计算机程序以它自己的方式既简单又优雅。我可以拆解它，观察其内部运作的最深层次，但我敢敢猜，如果我拆开你的脑袋并试着一看，你并不会喜欢的。”


    “你的这个假设是正确的，”我说，“我想我理解为什么你更倾向于机器而不是人了。我只是很高兴你在我们这边。”


    他坐在我旁边的椅子上，离得太近让我不太舒服，尤其是考虑到他还有几把远得多的椅子可以选。“我相信我们站在正义的一边。尽管我很喜欢人工智能，但我不想被强迫与其中一个结合在一起。”


    “内德想让我们让查斯下线。”


    “是的，他已经向我提到过几次了，”埃德温说，“算上他用他认为是委婉但实际上极其直白的方式提到的次数，一共十六次。”


    “当时我很委婉，”内德嘟囔道。


    “不正确，”埃德温陈述，“如果我能捕捉到，那它就非常明显。不过我现在怀疑是否还有更多我没捕捉到的例子。”


    “有的，”我说。


    他微微向侧歪头。“如果你不在场，你怎么能知道的？”


    “相信我，”我说。“我知道。”


    “关于他的观点，”埃德温转了话题，“我已经告诉过他，我会能够让查斯下线的。”

