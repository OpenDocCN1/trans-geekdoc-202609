    She finished the rest of my beer before setting it back down. “But I do have to
    do something…”


    This time, the way she was looking at me made it obvious what she meant.


    It was the middle of the next day before we had managed to rouse ourselves from
    the bed and get ourselves out the door. Lara was still miserable, but she seemed
    determined to keep going. We checked in with the local Purple Cloak, who said
    that they had no new information for us regarding the investigation into Zenobia’s
    murder. Not that we had expected anything.


    Even though she wanted to stay, I knew we had to get out of the Conclave. There
    was nothing we could do here, and I wanted to point that energy at something else.


    When we reached the Buzzard, I made Lara wait as I scanned the entire ship for
    anything unusual. I didn’t want any more trappers surprising us.


    We took off, and no sooner had we exited the Conclave space to prep our Tidal
    Drive than we saw some blips rocketing toward us.


    “This is just what I need,” Lara said with a wicked grin. She pulled the release
    on her seat, and it immediately went sliding through the ship, heading to one
    of the gun bays.


    15


    ![](OEBPS/image_rsrc3N4.jpg)


    As the three light fighters zipped toward us, I tried to get a sense of who they
    were.


    Though we had made a joke about it to Alana, it was really true that we had no
    shortage of enemies. Given the fact that they were attacking out in the open in
    the space around the Conclave, I ventured to guess that it was not the trappers.


    When one of the skinny, winged attack ships got close and I saw the rough splash
    of red on the side in the vague shape of a lizard face, I knew.


    “Your brother sent some friends to see how you are doing,” I communicated through
    the ship’s systems.


    She grunted in answer. “Aww, that’s so sweet of him,” she said. “I’ll send him
    a message that’ll make it really damned clear just how I am doing right about
    now.”


    A blast of micromissiles followed, firing out from the starboard side of the ship
    and streaking toward one of the quick crafts. With just the first volley, Lara
    was able to completely disable their shields.


    They may have picked a bad time to come at us.


    One of the others darted around, strafing the Buzzard and hitting us with a few
    missiles. The ship’s shields took most of the damage, but my poor ship had taken
    a lot of hits recently, and I wasn’t sure how much more she could handle.


    I turned us into the fray, only able to control the forward-facing guns and trying
    to line up a shot. But the Blood Dragon vessels were fast. Lara’s brother was
    the head of one of the Twelve Cartels and had sworn that he would continue to
    send people after her. Apparently, he was as good as his word, and now we had
    these three crafts coming after us.


    Two. Make that two.


    Lara spun her gun, sending a burst of the small incendiaries streaking through
    space just in front of where the craft was heading. Since she had disabled its
    shields already, the explosives made short work of the fighter.


    The other two spun in a coordinated attack.'
