- fmt: '

    “Well, it’s happened,” Lara said, and Mane ran his hands through his hair to squeeze
    out the water. His face turned thoughtfully to the sun beating down on him.


    And after a moment, he looked at Lara. “You came to the right place.”


    # 13


    ![](OEBPS/image_rsrc3N4.jpg)


    Once he had dressed, Mane led us from his estate and up the road a bit further.
    Rather than taking us in the direction that I was used to, back toward the city,
    he led us up to the hill that overlooked his neighborhood. Here, the streets were
    lined with marble statues and cypress trees that looked like elongated teardrops.
    Every few paces, a guard was stationed along the road, keeping an eye on everything
    but also making their presence felt.


    It even smelled nicer here, like fresh citrus. The nearby star was beginning to
    settle into its midmorning position, and we turned where the road forked. Following
    this slightly narrower path, we walked a bit further, until we reached a brick
    wall with laser spikes glowing along the top.


    Two more guards were stationed beside the iron gate, and both of them had purple
    capes draped on their backs. They glanced at one another, and the left one, a
    Kyrog, stepped forward.


    “Halt,” he said.


    Mane laughed. “You’re really going to pull that on me?”


    The massive guard snorted. “I am, since I wasn’t warned of your arrival. Is the
    councilwoman expecting you?”


    “She is not,” Mane stated. “But tell her that I am here on urgen⁠—”


    But he could not finish. From the tall home beyond the wall and shallow, decorative
    pool, a woman shouted from the balcony in a husky voice, “Let them in, you big
    oaf.”


    He grunted in annoyance but stepped back to open the gate for us.


    “Thanks, Chunk,” Mane said as we passed through the gate and into the beautifully
    tended yard. Here, the little flighted rodents with their shimmering green coats
    flew all about, landing on the fruits that had fallen from the various trees.
    Butterflies fluttered between flowers, and it was like stepping into some kind
    of fantasy. Even the landing pad for starships was surrounded by what appeared
    to be hand-carved ornate birdfeeders that were attracting more stunning little
    creatures.


    The Conecian woman who had shouted from the balcony emerged from the heavy front
    door. Her purple skin sparkled in the starlight, and she wore a flowing silk robe
    that billowed behind her as she walked.


    “Mane Malik,” she greeted and then looked at us. “I don’t know you two.”


    “Hunters Vex and Spears,” Lara said, gesturing as she spoke.


    The Conecian nodded. “Alana Torg’an of the Council of Six.”


    “An absolute pleasure,” Lara said, her tone almost subservient. “We are here to
    speak with you about a delicate matter.”


    The woman glanced around. “Please, come inside,” she said, turning and marching
    into the villa. From the front, you could see through the main room with its couches
    built into a dropped floor above a pool where small sharks darted about, to another
    balcony. But this one overlooked the Conclave, giving a breathtaking view of the
    beautiful buildings and massive monuments.


    She guided us through a door at the side of the room to a study full of shelves
    filled with scrolls. There, she walked over to a music player and turned on some
    lovely classical music. It set a nice mood in spite of the fact that she was obviously
    doing it to keep us from being overheard.


    She took a seat behind a small desk that was set with a pen and some papers but
    no computer. On the wall that was painted red at the bottom and an off-white from
    the middle up were hung several paintings of Alana as a younger woman in her bounty
    hunter regalia. One had her riding some kind of mythical creature, and another
    had her standing atop a tank that had been flipped over, leaving her looking as
    though she had defeated it in single combat.


    There were a few couches along the wall facing the desk, and the three of us sat.


    “What’s this about?” the woman said, cutting straight to the chase.


    “Falconer Zenobia has been gravely wounded,” Mane told her.


    The woman looked at him, her mouth a straight line. “Is she your Falconer?”


    “No, you are,” he said in confusion.


    “Precisely,” she said. “Then let the hunters who actually know the situation speak.”


    He looked like a kid who had been yelled at in front of their friends. “Sorry.”


    The words sounded as though they were being pulled from his mouth like a rotten
    tooth.


    Alana waved the apology away. “Which one of you is the higher rank?”


    “I am,” Lara answered without hesitation.


    The Conecian steepled her fingers and looked at the woman beside me. “Please tell
    me everything.”


    Lara’s eyes darted to Mane and then back to the councilwoman.


    “Anything said in this room will stay here unless I ask permission to share it,”
    Alana said. “I didn’t get to this rank by speaking out of school. Now say what
    you have to say.”


    Lara let out a long breath. “Trapper Moong Farrax was hired by a Kyrogi ambassador
    to kill a friend of ours. We were able to stop him, and I brought his Falconer,
    Roan, in for Consular Questioning.”


    “This has not yet taken place,” Alana informed us.


    She had a curt manner, and at the moment, I really appreciated it. I was happy
    to just tell her what was happening and get her take. I wasn’t entirely sure that
    we could trust her, but we didn’t really have any other choice.


    “Understood,” Lara said, her tone nearly reverential. It was cute in its way that
    she respected the system so.


    “Continue,” Alana said.


    Lara once again seemed to be choosing her words. “I thought that would be the
    end of it, but Mane overheard a threat.”


    He then explained to her what he had heard.


    “And recently,” Lara continued, “we were hit with an EMP by someone who washed
    into space without warning. We don’t have definitive proof that it was trapper,
    but I believe it was.”


    “From what you have said, it certainly sounds likely,” Alana agreed. “And you
    believe that Zenobia was wounded by someone interested in you?”


    “Yes,” Lara said. “For someone other than a bounty hunter to get onto the Conclave
    and do this seems improbable.”


    The Conecian was doing a good job of not letting any emotion play on her face
    or giving away what she was thinking, but I knew that we were intriguing her at
    the very least.


    “It should be more than unlikely but downright impossible,” the councilwoman said.
    “I don’t know which is worse: the idea that there are some in midst who would
    attack their spiritual kin or that an outsider made it in.”


    She stroked her chin as she considered that. “I presume you have many and varied
    enemies?”


    “We do,” Lara affirmed. “There is absolutely a possibility that what happened
    to us recently was unrelated.”


    “Though it certainly feels all interconnected,” Alana said, tapping her forefingers
    together. “What is it that you believe I can do for you?”


    Lara’s eyes flashed surprise for a moment. Apparently, she hadn’t considered the
    question. So, she answered honestly, “I’m not entirely sure.”


    The councilwoman smiled at that. “I appreciate your honesty. Most people come
    in here with a list of demands as long as their arm,” she said, shooting a look
    at Mane.


    “Since I am not that way,” Lara announced, “I’ll ask first if there is anything
    I can do for you, and then I’ll ask for any guidance.”


    “I wish more hunters were like you,” Alana said. “Or you for that matter.” She
    pointed to me, so I arched an eyebrow in question.


    “I told you that I wanted to speak with Hunter Vex rather than you, and I haven’t
    heard a word since,” she said. “This is good. This is what we are looking for.”


    “I thought I was what you are looking for,” Mane interjected.


    She groaned. “After what I just said, that was the moment you chose to say that?”

