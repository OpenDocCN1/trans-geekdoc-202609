  trans: '

    “况如此，”我比了着四周说道，“这里现在已经满了。很多人都在使用这处设施，它确实在按照设计初衷在发挥作用。你对此一定很高兴吧。”


    “我很开心，”她有些不情愿地对我们说，“但也许某个时候，你们会多留一会儿。”


    “我们会努力的，”我说道，快步走上 `Buzzard` 号的坡道，“顺便告诉其他人我们很快就会回来。”


    我知道朋友们会因为我们没有亲口告诉他们而感到失望，但没有时间浪费了，而且他们只会试着说服让我们也一起去。正如 `Lara` 所说，这种局面并不是我们需要他们的时候。


    于是，我们匆忙进入驾驶舱坐好位置。


    “当我们熟悉的 `AI` 表现得那么粘人，或者说，真的非常拟人化时，我不禁觉得好笑，”我启动引擎时说道，“意思是，当我们第一次遇到 `Libby` 的时候，她愿意用我们需要的信息来换取一个朋友。现在，尽管她设施的走廊已经满了，她仍然想要更多的陪伴。”


    `Lara` 看了我一眼，然后看向窗外。“是的，这很奇怪。”


    “正如我之前说过的，”我继续道，“程序员做出的这个选择很有趣，让我想知道他们在创造这些智能体时在想什么。或者我对创造他们的人施加了太多的想象？也许他们使用了另一个程序来创建所有这些性格？”


    “谁知道呢？”`Lara` 说道，并没有完全在听。


    这并没有止住我。“意思是，他们必须为每一位士兵创建一个可以匹配的 `AI`，而且似乎对每一个设施也是如此。这不可能是每一个都是由某个人制作的，那花的时间实在太长了。”


    `Lara` 抚平了她隐身服腿部的一处褶皱。“也许是 `Twain` 创建了所有他们，他只是在等待合适的时机激活他们。”


    我激活了 `Tidal Drive`，在我们进入涡流管时，我思考着她的话。“为什么要把那个东西放进我的脑子里？”我问道，真心地希望她没有这样做过。


    “事情不是那样的，”她说，完全否认了那个话题，“如果他能做到那点，他在战争期间就会做了。他还会利用 `Ned` 在你还没离开 `Bussel` 之前就找到你，还有数百万个理由证明那显然不是真的。”


    我想了想。“我想你是对的，但那将是一个非常疯狂的转折。”


    “我们经历的转折已经足够了，”她说，“他带回 `John Gregory` 来接管半个 `Inquisition` 并杀掉半个政府的成员，这已经足够了，谢谢你。”


    “我想是吧，”我说道，仍在思考关于 `AI` 的事。


    “而且他已经通过那些被绑架和黑入的人拥有了潜卧者，”她补充道，“我们不需要别的了。”


    “我的意思是，我们还有陷阱者，”我说道。


    她哼了一声。“别提醒我了。”


    “为什么这让你这么困扰？”我问道。


    当管道在周围晃动时，她看着我。“你知道为什么。”


    “我清楚，”我说，然后补充了一句。

