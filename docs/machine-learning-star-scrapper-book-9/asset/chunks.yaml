    “看起来你的新哥们儿切斯特给自己‘借’了一艘船，”Ned 说，我不知道哪种更糟：敌方指挥征用了那艘审判者号，还是弗朗西斯本人夺取了它。我不得不想无论哪种情况对我来说都不妙。


    但那艘凤凰级飞船正准备进行另一轮攻击，我能看出它正冲回来再次进攻。Ned 带我们躲过了几次攻击，但另一些攻击削弱了我们剩余的护盾。


    “看起来你的新哥们儿切斯特给自己‘借’了一艘船，”Ned 说，我不知道哪种更糟：敌方指挥征用了那艘审判者号，还是弗朗西斯本人夺取了它。


