  trans: '

    我向其中一架开火，将`Buzzard`号变成了迎面而来的攻击火力。


    这让我们暴露了了，两艘飞船都向我们发射了一轮微导弹，导弹撞击在我们的护盾上，在我们面前喷射出一场华丽的光影秀。


    拉拉转过身，转动炮头拦截其中一艘飞船，但它们太快了，子弹偏了。现在是内德大显身手的时候。面对快速的船只，他的目标系统能够精确计算出射击位置，以击败移动迅速的敌人。


    现在变成了人与人的对决，我们必须找到办法对付他们。当然，拉拉对失去朋友和导师的愤怒使她成为了一个致命的对手。她似乎几乎化身了内德的能力，又射出了两发齐射，其中一发在他们的防御层上爆炸了。


    我开始想，我能做的最好的事情是否是确保拉拉处于良好的射击位置，而不是尝试用自己的机枪射击。但我没有时间考虑这些复杂的计算，因为我看到一架轻型战斗机从后面冲上来，于是我一个横滚躲开了。我看着导弹留下的光迹擦肩而过。


    当最后一枚火箭掠过`Buzzard`号下方时，拉拉激活了用于报废的机械臂之一，成功地从空中抓出了一枚导弹，抓住它的尾部，在面对与她炮火发射方向不同的方向时将其放开。


    分离的导弹向一个方向疾驰而去，而齐射则将船推向了另一个方向。时机掌握得完美无缺。当战斗机躲过爆炸逃离时，他们甚至没有注意到另一枚微导弹从另一个角度袭来，击中了引擎。


    燃料和氧气在被太空真空熄灭前发生了又一次爆炸。


    现在只剩下我们和最后一架战斗机了。


    这名飞行员似乎比其他人更出色，避开了我们所有的火力。每当我认为已经将其锁定在准星上时，飞船就会俯冲、移动或以某种方式避开我的路线。这真令人沮丧，每当拉拉的一连射击落空时，我都能听到她在那里咒骂连连。


    很快，那架小战斗机折返回来，向我们发动了一连射击。缓慢但坚定，他正在击碎我们的护盾。


    “我要去`Tidal`，”我告诉拉拉。


    “不，”她粗硬地回道，“我来。”


    护盾持续下降，而我们一直在射空。我不会为了她的自尊而死在太空里，但也不想在她觉得我们还能获胜时随之`Tidal`而去。此外，任何被我们留活的`Blood Dragon`在将来都会回来找我们。


    “再冲锋一次，”我告诉她，“但如果我们的护盾掉到百分之十，我就带我们离开这里。”


    我能通过通讯器听到拉拉咬牙的声音。“我会搞定他的。”


    接踵发生的是拉拉的一场精彩表演。


    她开始向我们周围的空间倾射小规模齐射，迫使战斗机按照她完全想要的方式躲避或逃离。我的一部分在想他是否真的能逃离这里。他是否宁愿以后带着更多朋友再回来。但随后我想起了与他们战斗时学到的东西。


    对于`Blood Dragons` 来说，没有什么比他们的面子和自尊更宝贵。我确信这名飞行员宁愿死也不愿带着失败归来。拉拉一定也知道这一点，因为她继续以小规模齐射不断射击。这样，战斗机在试图追击我们时不得不躲避，而我稳住`Buzzard`号，让他靠近。


    接着，突然之间，拉拉发动了一阵密集的火力，挥动炮头，几乎将我们身后的空间覆盖了一层细小的火箭弹。


    他试图进行一个规避机动，压低船头，但已经太晚了。


    几枚导弹擦过了飞船，但已经太晚了。

