    “It might help to get us to Gregory,” I said.


    But Imogen was unwavering. “No,” she said again. “I won’t let one of those things
    anywhere near me. I don’t even want to get back on that ship, but I will. That
    though”—she pointed at a pile of Inquisitor crumpled on the ground—“never again.”


    “That settles that,” I said, gesturing for us to get on board the `Mortal Coil`.


    Lara entered without any hesitation, but I could see Imogen’s face when she stepped
    one foot on the ramp. I moved up beside her and offered her my arm.


    “No,” she said. “I need to just do it.”


    “Okay,” I said.


    “It’s just a ship,” she whispered, obviously to herself. “Nothing but parts and
    pieces.”


    I didn’t say anything else, just stood there as moral support. Imogen had ridden
    on this ship as `John Gregory`’s `Acolyte` after her parents had forced her to
    join the Inquisition, and she had been in it as a prisoner when she tried to attack
    the Inquisitor unsuccessfully. She undoubtedly had more terrible memories on this
    ship than just about any other place in the universe.


    “It’s just a ship,” she said again and took a few more steps within.


    Her eyes flashed to a little corner where there seemed to have been what looked
    like a little shrine set up.


    “He used to make me kneel there,” she said. “For hours, I would have to just wait
    there, my knees pressed against the metal, either studying some text or pondering
    his questions. None of it made any difference. None of it mattered. It was all
    his self-serving, self-righteous nonsense. But I would kneel there and think about
    it.”


    “Would you really though?” I asked, trying to pull her out of the memory she seemed
    to be losing herself in.


    She blinked twice then looked at me. “What do you mean?”


    “Would you really ponder his question, or would you sit there counting the minutes,
    thinking about how much you hated him or your family or just remember some old
    show or something?” I asked, trying to sound casual.


    She glanced down at the corner briefly. “The second, obviously.”


    “Thought so,” I said, pressing the button to activate the ramp.


    The sound made her wince, and I watched her watch it close like a cell door.


    “Sorry we have to do this,” I said.


    She took a deep breath. “It’s okay,” she said. “Seems like everyone is dealing
    with the ghosts of their past at the moment.”


    Ned laughed. “She’s right. How is she so much younger than you and yet so much
    wiser?”


    “Just lucky, I guess,” she said, and I was surprised that he had communicated
    that to both of us since he seemed to usually mock me just to me.


    I took a few steps forward, waiting to see if Imogen would do the same. She did,
    still examining everything as she went. As we reached the cells, she stopped and
    looked through the bars to the little bench within.


    “When he took me prisoner, it wasn’t the first time I had been in here,” she said.


    “Yeesh,” Ned said, and I wondered if it was just to me. “This guy sucks On Ice.”


    She ran her hand over the bars. “He would put me in here not just as a punishment,
    but also a reminder that I was alive. ‘Suffering is human,’ he would tell me all
    the time. The point he was trying to make was that we people could hurt, and the
    machine could not. Now that I have met a handful of `AI`, I know just how false
    that is. Both Ned and `Cassiopeia` seem to be in as much pain at the moment as
    Lara is about her loss.”


    “It’s true,” Ned said. “Not to diminish Lara’s loss in any way.”


    “And even that politeness,” Imogen said. “That care for your friend. It''s something
    that `John Gregory` could never understand. Not only did he not get that programs
    could do it, but he also didn’t understand how to do it himself. He was so dedicated
    to the eradication of `AI` that he lost all the things that made him human himself.”


    I thought about that for a moment. “That’s assuming he ever had those things.
    It’s possible that he was just born rotten. These `AI` were programmed to be like
    us, warts and all, but not all people are actually ‘human’ in that way. Some just
    have that evilness in them.”


    “What about `Twain`?” Imogen asked.

