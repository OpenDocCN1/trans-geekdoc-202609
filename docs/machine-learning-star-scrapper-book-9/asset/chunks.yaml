  trans: '

    在我向他们解释了 Ammo 的建议以及我打算让 Sophia 作为我们的记录员这一想法后，Imogen 离开去传达消息，而我洗了澡，换了衣服并吃了饭。


    这让我感觉自己焕然一新。好吧，当然还有一些止痛药和霍斯比胶（Hospi-gel）。


    当我离开房间时，Foerschler 在走廊里发现了我（或者说，其实是伏击了我），但这次是为了感谢我采纳了他的建议，并向我更新了空间站的近况。他基本上把自己任命为
    Suniuo 中继站的市长，但在他的指导下，一切进展得非常顺利。


    他们建立了更多的设施，为空间站内已经开始运作的农场进口了更多动植物，并开始组织和编目录一个完善的军库，不仅为了给这里的人在紧急情况下提供装备，也是为了帮助
    Jackson 从基地带领的和平卫者突击队。


    我感谢了他的辛勤工作和奉献，然后批准了他对我提出的所有建议，尽管我知道这会耗尽我们从 thengar 身上赚来的大部分资金。他赢得了花这笔钱的权利，我相信他所做的将帮助这里的每一个人。


    当我穿过这个设施时，那里现在充满了生机，且运行处于近乎最佳水平，我很难对我们招募的所有人以及他们所做的一切不感到高兴。这里有来自宇宙各地的人，他们需要一个容身之地，并想要成为重要事业的一员。


    现在，他们在这里建立了一个社区。


    更令人惊讶的是，这在很大程度上归于我。我所做出的选择和一路走来的决定——有些感觉是正确的，另一些则是错误的——导致我帮助在一个安静太空区域边缘建立了一个小殖民地。


    这是一件了不起的事情。我希望自己能在这里待久一点。


    在 Buzzard 号上，Lara、Clynt、Imogen 和 Sophia 都在等我。年轻的“和平卫者”背上着一台大摄像机，看起来既兴奋又紧张。


    “Alek 想来，但我把他劝回了，”Imogen 说。


    “很好，”我叹了口气。


    “但幸运的是，Sophia 在这儿也玩《战争英雄》，”Lara 兴奋地说道。


    Imogen 平视了我一眼。“然后真是一片欢腾，”她用单调的说道。


    “这意味着可以用我的牌组对战机器人了，我已经很久没这么做过了，”Lara 说。


    在我还没得及告诉她很高兴看到她如此兴奋之前，Clynt 插话道：“我们不是和一位审判官约了会吗？”


    仅仅的一句话就让我们行动了起来。


    我们登上飞船，很快就进入了漩流。不出所料的是，当 Lara 和 Sophia 玩牌、Imogen 在旁边看着时，我直接睡着了。Clynt 像往常一样忙他的他的，我在指示器提示我们到达时时醒了。


    我起身走向其他人，告诉他们即将着陆。令我惊讶的是，当我们准备降落时，有四艘审判庭的飞船在等我们。


    “做好任何准备，”我对 Ned 说。


    当我们开始放下跳板时，我转向 Sophia。“我不认为他们会想要这一套。”她毫无疑问地点了点头。这个女孩在宇宙中一些最严酷的环境下长大，所以至少对危险很警觉。


    我走下飞船，审判官穿着全套礼服走上前来迎接我。


    “你带了很多朋友，”我指着所有的飞船说道。


    他点了点头。“是的。我想为那个怪物表演一场有说服力的戏码。”


    “好吧，那我们离那种事远点，”我说。


    “我理解，”他说。“但你最好在不被发现的情况下穿上这身。”


    他扔给我一个小设备，我随即转手交给了别人（注：原文此处为 in turn, which in handed over，指代某种动作或设备交接，此处语境略为生硬，译为转手交交）。

