  raw: 'Lara laughed, lifting up some paperwork and then dropping it back down. “What
    you are really saying is that we should take note of your accomplishments.”


    Clynt grinned. “Wouldn’t hurt none to mention just how helpful I were.”


    I rolled my eyes, then looked at him. “You were, as always, very helpful, and
    we couldn’t have done any of this without you.”


    I turned away from his smiling muzzle to see Lara with her hands on her hips and
    an eyebrow raised.


    “And you,” I enthused, turning to her. “Neither of us would have even made it
    to the wall if it weren’t for you. Every shot saved a life, and these people would
    not be celebrating a victory if it hadn’t been for your excellent aim.”


    She continued to stare at me.


    “I know that I’m saying it in a jokey-joke sort of way, but it’s actually true,”
    I told her.


    She smiled at that. “And I guess it wasn’t too bad that you were able to keep
    their leader safe and blow the door,” Lara praised as though it was pulling teeth.
    “And you’re just sooo good looking.”


    She added the last part in a mocking tone.


    “See, now that’s a weird joke ’cause we all know you two have been knockin’ boots,”
    Clynt observed.


    “Yeah,” I agreed with a childlike smile plastered on my face. “You were also using
    a jokey-joke sort of way while it’s actually true.”


    “If you do say so yourself,” Lara shot back, but it was half-hearted and quiet.


    I tapped the side of a toolbox, and it clattered to the ground, causing the two
    of them to chuckle as they returned to their work.


    Glancing over my shoulder, I saw all the locals talking and moving around, looking
    for loot or deciding what to do next. They had never done anything like this and
    were clearly overwhelmed by it.


    We, meanwhile, seemed to be doing things like this all the time, and while we
    were happy to be alive, it also wasn’t so interesting that it was going to keep
    us from what we were doing.


    I crossed the little space, knowing that there had to be the coils somewhere.
    Their own flighted craft needed them as well, and since they burned out with some
    regularity, it was the kind of thing almost all mechanics kept on site. That being
    said, it didn’t seem like the person who worked here cared too much about keeping
    things in any kind of orderly manner.


    Not that many of the scrappers I had known did.


    Or, for that matter, that I did.


    But there was a large storage locker at the far side of the tent, and I made my
    way there.


    “Anything worth stealing?” Lara asked the Vekrass.


    He snorted in response. “Ain’t no fun when it’s just looting.”


    “Sure,” Lara allowed. “But I have to think you’ll take something good if we come
    across it.”


    “You find a chest of gold doubloons, be sure to send word,” he said with a laugh.


    After opening the cabinet, I shone the light around. There were pieces and parts
    and the same little box of bolts and washers that every cabinet throughout the
    universe seemed to have, as well as a pile of dusty tools at the bottom of the
    unit that were so niche they hadn’t been used in a long time.


    As I cast my light around, I saw the bending shape behind a can of paint thinner
    and reached in. The moment my blood-covered fingers closed around it, I knew that
    I had found the coil.


    But as I pulled it out, the hair on the back of my neck stood up when the clatter
    of gunfire cut across the space.


    I stepped back to see a man standing over the bodies of all the miners who had
    surrendered, and just in front of me, Lara with her hands raised.


    The young woman and a cadre of her people were standing with weapons facing us.


    “What is this?” I asked, but I could hear the disappointment in my own words.


    The leader stared at me with a little smile on her face. “This is taking charge
    of my own destiny like you told me to.”


    Lara shook her head. “This is so unnecessary,” she said. “You already have what
    you want, so just let us take this one thing and leave.”


    “You don’t know what I want,” the girl hissed. “Maybe I want that stealth suit
    of yours and those weapons you all carry. Maybe I want to take over this planet
    and know that it will be easier with your stuff and your ship.”


    I took a step forward. “Let me make one thing really clear to you,” I growled.
    “We will kill you before we let that happen.”


    She looked around at her numbers and then back to the two of us. “Seems like we
    have the advantage.”


    “The fact that you think that’s true shows just how naïve you are,” I stated unequivocally.
    “You have numbers, yes, but we are well-armed hunters who do this all the time.
    Please, just rethink this.”


    “No,” she said, sounding even more sure of herself than she had before.


    And that’s when it hit me that she was probably a sociopath. She had been made
    a leader because she could “make the tough calls” or “do what needed to be done,”
    and it was because she didn’t care. Even on the battlefield, she had been utterly
    unaffected by action around her.


    I needed to change things up.


    “You guys have what you came for,” I announced to the locals all gathered around.
    Then I held up the coil. “And so do we. You don’t need to keep fighting just for
    my armor or whatever it is you think you’ll get from me. You can just let us go.”


    Many of the people stole looks at one another, and the girl obviously didn’t like
    it.


    “No,” she said, and the light from her weapon filled the tent for just a moment.


    I didn’t have enough time to leap out of the way or anything like that. Instead,
    I took a bullet to the chest plate. And while it hurt my already bruised body
    and threw me back into the open door of the cabinet, it didn’t down me.


    The second she shot, she sealed her fate.


    Lara vanished instantly, ducking out of the way of the few shots from the couple
    of ’facers who were going along with this plan. Then her blade appeared, swinging
    up through the air and plunging into the leader.


    At the same moment, more revolver shots rang out, and those who had taken up arms
    against us fell to the ground. Sadly, that caused the rest to open fire in the
    direction where they thought Clynt was only to be killed as well.


    Another hush fell over the mine.


    “I hate this fucking planet,” Lara said finally as I got to my feet.


    I looked down at all the bodies scattered all around: the company guard, the miners
    and the ’facers. Then I glanced over at the coil.


    It didn’t need to have happened like this. All these people didn’t need to die
    like this.


    A moment earlier, I had been proud to be a part of something that felt important
    to these people. Sure, this victory might have been small and might have resulted
    in the company sending down far more people to make their lives even worse, but
    it was a fight worth fighting.


    Now, they were all just bodies on the ground. Local or foreigner, it didn’t matter.


    Casting a glance up into the now night sky and seeing the city in the distance,
    it all felt entirely futile. There was no fight here worth fighting. Or maybe
    I was just sad about the way it had all shaken out.


    I took one last look at the leader. The girl who had seemed like so many things
    in so short a span and whose name I had never learned.


    “Yeah,” I groaned. “Let’s get off this planet.”


    I grabbed the coil. Then I filled a duffle with other parts and pieces. I had
    no qualms with stealing from this company before we loaded up into one of the
    remaining vehicles. There was no reason to wait around, and I figured the company
    would be sending people soon enough, so we flicked on the lights and drove out
    into the desert.


    Clynt could see in the dark and had a keen sense of direction, guiding us the
    right way.


    “You okay?” Lara asked as I stared into the beams of light and darkness beyond.
    I wasn’t driving as fast as the girl had been earlier, and her words carried to
    me with ease.


    But I shook my head. “I don’t know what the hell I am now.”'
