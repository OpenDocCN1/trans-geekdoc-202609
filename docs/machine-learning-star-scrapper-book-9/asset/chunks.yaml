  trans: '


    “也许你没有身体反而是最好的，”阿莱克观察道。


    “而且现实一点，”伊莫根补充道，“就你现在的样子，也能造成巨大的破坏。如果你问我的话，驾驶 `Buzzard` 和黑入系统还是挺好用的。”


    内德哼了了一声。“我很感激这一点，但我还是觉得这不如揍某人来痛快。”


    “确实不比，”克莱特说道，“依我之，拳头击中下巴的感觉完全和生出一窝小狗不相上下。”


    “这引出了一个有趣的点，”拉拉说，当 `Buzzard` 进入涡流管时，她向后靠在椅子上，“内德，你有性欲吗？”


    “拉拉，”阿莱克责备道，“我真的不知道这是不是我们需要讨论的话题。”


    伊莫根向驾驶舱中心倾身。“有的，”她用一种戏剧性的耳语说道。


    “真的吗？”我问道。


    “现在，那妈的这有什么意义呢？”克莱特说道，“就像程序让他产生一种永远无法抓挠的瘙痒一样。”


    我们都转看向控制台的扬声器，等待着回答。


    “伊莫根是对的，”过了很久，他说。“我们被设定了拥有某种类似于性欲的正常人类欲望，但我们并不像你们那样满足它。更准确地说，它是发作性的、间发性的。不幸的是，这个双关语是有意为之。”


    “我在母星上曾是一名医生，”阿莱克哀鸣道，清楚地表达了他多想让我们换个话题，但我被迷住了。


    “这就是为什么埃德温本质上能用一个程序背叛他的妻子的原因吗？”我问道，“因为那种本能已经刻在代码里了？”


    内德冷之以鼻。“我对此无法给出具体的论述，但听起来很有道理，是的。”


    “太疯狂了，”拉拉说。


    “审判者说过，机器想要繁衍简直是厌恶的极致，”伊莫根说道。“他会为此大爆发几个小时，宣扬他对这其中的方方面各的厌恶。”


    拉拉咯咯笑。“看，我听了这些，只是觉得他之所以说得这么多，是因为他其实有点感兴趣。”


    “我想这位女士抗议得过猛了，”内德补充道。


    “但这种狂热分子不就是这样吗？”我说，“约翰·格雷高里一辈子都痴迷于仇恨这种东西，以至于它真的成了他的全部个性。到头来，他才是想着机器人性交的人。”


    那个词的某些点似乎让其他人觉得有趣，我听到几阵笑声。


    “我有时也会想这些，”她说。“当他满脸通红，大叫着那些恶心之物时，我满脑想的都是他对这些东西的痴迷比它们本身还要痴迷。”


    “我不知道，”我说。“莉比倒是挺痴迷自己的。”


    伊莫根点了点头。“好吧，除了她之外。”


    “总之，”拉拉站起身说。我们都惊讶地看着她，她指向了阿莱克。“我们来去玩会儿 `Warhero` 吧。”


    “我以为你永远不会问了，”他说，两人离开了。


    '
- fmt: "\n“What you reckon we’re lookin’ for?” Clynt asked, his environmental suit\
    \ still somehow looking like he’d just stepped out of a saloon.\n\n“A building,”\
    \ Ned answered. “It will probably stand out from the, you know, fungus everywhere.”\n\
    \nClynt clicked his tongue. “Ain’t no need to be a smartass,” he said. “I were\
    \ just asking a question.”\n\nAlek landed next, and then Lara followed after she\
    \ had shut the door.\n\nI pointed in the direction of the orange cap, and we all\
    \ started moving. There were no paths in the traditional sense, so we found ourselves\
    \ jumping over obstacles and pushing the soft fungus out of the way.\n\n“Watch\
    \ those,” Ned cautioned as we got too close to a cap that looked as though it\
    \ was breathing. Gazing up from the trunk, we saw what appeared to be something\
    \ like rows and rows of barbed teeth.\n\nThere were others that we had to watch\
    \ out for. Some with barbs along their sides, and others that would absorb your\
    \ entire body if you found yourself pressed up against it.\n\nWe kept moving and\
    \ the orange cap grew closer, but it still seemed to be quite a ways off. Clynt\
    \ was on his third song, singing terribly to himself but loud enough so we could\
    \ hear it, and I wanted to be anywhere but his home on the range.\n\nThen Lara\
    \ stopped, and so did the rest of us.\n\nShe obviously saw something and now was\
    \ trying to identify what it was. There were many little floating spores and other\
    \ moving objects to draw our attention, but this must have been something else.\n\
    \n“What did you see?” I communicated quietly.\n\nShe didn’t answer.\n\n“I didn’t\
    \ pick anything up on the `cam`,” Ned informed me. “Maybe it was just some kind\
    \ of floater.”\n\nI didn’t think that was right. If Lara thought she saw something,\
    \ I expected she probably did. But after a few more moments of waiting, we kept\
    \ moving. All of our heads were on a swivel now.\n\nA few moments later, we were\
    \ back to bouncing along, listening to crappy singing echoing among the fungus.\n\
    \nGunfire replaced the song, and we all turned to see Clynt firing his revolver.\
    \ In front of him, a four-legged fungal beast was being blasted apart as it charged\
    \ toward him. Its flesh, if it could so be called, was pockmarked and covered\
    \ in blobs. With every shot, chunks of the thing would splatter off, but it didn’t\
    \ stop coming until he had emptied both cylinders into it.\n\nImmediately, he\
    \ began to reload with great difficulty, his gloved claws making it hard to get\
    \ the shells out and bullets loaded.\n\nThen I saw why he was in such a rush.\
    \ From out of a cluster of caps just off Clynt’s side, more of the monsters charged.\
    \ They moved quickly, having no problem advancing with the gravity that we were\
    \ still getting used to.\n\nI couldn’t count how many there were, but they came\
    \ for all of us. Lara pulled out her sword, and Imogen, her mace. Both glowed\
    \ with their eternal flames. I activated my spear just in time to swing at one\
    \ of the beasts as it snarled toward me. \n\nThe spear tip sliced its front legs\
    \ off, causing it to crash forward on its head, which I impaled quickly. But as\
    \ soon as I had dealt with that one, two more were on me. One came from the side,\
    \ and I stabbed at it with `Ron`, but it leaped into the air and cleared both\
    \ the spear and me in one easy movement.\n\nThen the other darted out from under\
    \ a bouquet of mushrooms, its fanged mouth making straight for my leg. It was\
    \ all I could do to swing the shaft of the spear at its head, knocking it aside,\
    \ but only for a moment.\n\nIt was back up on its feet a second later, but I used\
    \ the time to bend and launch myself up.\n\nThe thing sprang up after me, and\
    \ I thought about Lara using the `Buzzard’s arm`. As the snarling teeth came straight\
    \ for me, I dropped my spear, reached out, and grabbed the beast by its bubbling\
    \ scruff, then spun my body as I began to return to the surface.\n\nI threw the\
    \ creature into the trunk of one of the deadly caps, the skin instantly rippling\
    \ to consume the thing by sucking it into its stalk.\n\nWhen I landed, I plucked\
    \ back up my spear and surveyed the scene. Lara was making short work of any and\
    \ all the beasts that came her way, slicing them with such ease that it looked\
    \ like some kind of training exercise. Imogen was bringing her mace down on one\
    \ and then another, beating the things as they got close. The glowing spikes of\
    \ her mace popped the faces of the fungus monsters and sent them steaming to the\
    \ surface.\n\nClynt was blasting away at several while jumping from cap to cap,\
    \ moving quickly, shooting and reloading. Once he had a rhythm going, he was able\
    \ to get the upper hand on the creatures.\n\nAlek, meanwhile, seemed overwhelmed.\
    \ He was usually so reliable in a fight, but these things seemed to have him stymied.\
    \ He was swatting at them, trying to force them back, but they kept coming, kept\
    \ nipping at him. As he tried to grab one, another darted out and bit at his arm.\
    \ It wasn’t strong enough to puncture his suit, but the fact that he was surrounded\
    \ and being bitten made me nervous.\n\nI leaped over to him, jumping right over\
    \ two more who were on their way to be diced by Lara, and landed beside Alek,\
    \ who turned to face me with a fist raised. Until he saw it was me.\n\nI brought\
    \ my spear down on one of them and then pierced another in the side. They both\
    \ burbled yelps and came for me, attracting the attention of others. I swatted\
    \ at them and slammed my glowing tip back and forth, cutting and slicing their\
    \ jowls but not stopping.\n"
