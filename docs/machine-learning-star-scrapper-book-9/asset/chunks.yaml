    与大多数地方不同，在那里你会立刻看到围观的人试图弄清楚发生了什么，但这里的每个人都很礼貌，假装完全没有注意到那些冲向街道而来的、推着担架的守卫或医护人员。


    “我是`Hunter Vex`，这里是`Hunter Spears`，”拉拉对紫色斗篷人说道，“我们刚来向我们的猎隼人报到，发现她像你看到的那样伤得非常重。”


    “她对发生的事情说了什么吗？”那个女人问道。


    拉拉摇了摇头。“她喃喃了一些什么，但和发生的事情无关。”


    “听到这个消息我很遗憾，”紫色斗篷人说，“你知道她有没有敌人吗？”


    我看着拉拉在大脑中思考，她在想我们得罪了捕猎人的事实，而他们正朝我们冲来。想我们虽然对某些人有口头证据，但不知道是谁，而且他们已经从空中把我们击落了。但她这些话一个都没提。


    相反，她耸了耸肩。“如果你认识泽诺比亚，你就知道她做事为人非常谨慎。”


    女人的嘴唇紧抿着。“我不了解她，只是点头面之交，”她说，“我为你们遭遇这种事感到遗憾。如你们所知，议会内部严禁暴力，这件事将得到严加调查。我们不会放过任何一个线索的。”


    “谢谢，”拉拉说，用手背擦了擦脸颊。


    “但让我提醒你一下，”紫色斗篷人警告道，“我们是守法的。”

