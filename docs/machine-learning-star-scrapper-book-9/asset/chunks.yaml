  trans: '

    在此期间，我一直在思考过滤系统以及它可能出了什么问题。同时，我在想发生故障时的效能如何。从理论上讲，只要指示灯还是绿色的，它就在工作，但我仍然心存怀疑。尽管我提醒自己，一家公司不可能在生产出让佩戴者中毒时还闪烁绿灯的产品还能逍于法外。


    我太关注阿莱克了，甚至没有注意到那个橙色的盖子已经出现在近处了。


    “停下，”内德说，我滑行停了下来。


    其他人也这么做了，我告诉他们我要快速向前侦察，看看内德能否为我们提供任何信息。


    他们都点头表示理解，当我转身向前挪动时，他们聚拢了过来。我踩在土地上挪动，走向……我仍然并不确定具体是哪里。


    就在那时我看到了它。


    # 18


    ![](img/image_rsrc3N4.jpg)


    我本以为会发现某个降落平台或天线器阵列，至少是某种混凝土地堡，但我看到的只是地面上的一个舱门。周围长满了植物，没有任何近期有人在附近走过的迹象。如果我不知道它在那儿，我可能永远不会发现它。


    “我没看到任何摄像头或类似的东西，”我低声说。


    “扫描仪也没有探测到任何东西，”内德说，“我觉得你只能亲自去调查了。”


    但我已经在向前移动了。随着阿莱克的时间快耗尽，我不想浪费哪怕一秒钟。我只是匆忙向前，抓住了舱门的把手。


    没有阻力，没有锁，什么都没有。


    它就那样打开了，我向下看去，是一个光线良好的水泥楼梯。


    我去集合了其他人；我们所有人跑回舱门，径直往下走。嗯，几乎是我们所有人。


    “我在这里等，”拉拉说，“等你们搞清楚情况后通过无线电联系，但我们不应该全都走进一条我们未知的黑暗通道。”


    她是对的，在先下去之前，我快速点了点头。


    楼梯似乎无止尽地向下延伸，我不停地回头查看阿莱克的情况，但在我们最终到达另一个气闸室之前，并没有值得看的东西。又一次，它是解锁的，看起来我们可以很容易激活它。


    我转向其他人。“让我先进去测试一下。以防万一。”


    “没门，”阿莱克说，然后推开了我。他径直走进去毫无疑问激活了它。


    门密封后，我们能做的只有观察，但片刻之后，他从另一侧走了出来并开始脱掉防护服。我们其他人急忙跟进去，等了一会儿，然后跟着他来到另一侧，隧道通向一个带有储物柜的休息区。长椅看起来并没有太多的磨损迹象。


    “这是什么地方？”伊莫根问，“如果看起来没人来过这里，为什么一切功能都是正常的呢？”


    我不禁表示赞同。“而且为什么它会出现在这么多信徒最近的通信记录里？”


    “也许我们与其站在这儿闲聊聊天，不如去看看？”克林特建议道。


    我从准备检查阿莱克防护装备的地方抬头看向他。

    '
- fmt: '

    And I wondered what it was, exactly, he had been doing with it since the Old War.
    Obviously, he couldn''t purchase his own `Hospi-gel` from the manufacturer, but
    something told me it was more than just using it to keep his soldiers healthy.


    I looked at the large clock on the wall, but given that I didn''t know anything
    about the way time was told on this planet, the numbers meant nothing to me.


    Therefore, I formulated my question differently. “How long until you were expecting
    us?”


    “Don’t you have that information too?” she asked, not sounding suspicious as much
    as surprised.


    I folded my arms in front of my chest. “I just wanted to be sure that we were
    given the same information. Working for a new client means learning their routines.”


    She glanced at the clock as well. “We were expecting you at fourteen twenty,”
    she answered.


    “You would think of that as about an hour,” Ned calculated for me.


    That meant we didn’t have much time if I wanted to enact any kind of a plan.


    “And where do we load from?” I asked. “I left my ship a bit further than perhaps
    I should have.”


    Her brows lowered ever so slightly this time. “Every new shipper has been given
    this information. Are you certain you''re at the right place?”


    “Yes,” I said in a hard voice. “Please show me where the transfer takes place.”


    I spoke with enough authority that any lingering questions she had seemed to fade
    away, and she turned and shuffled toward one of the doors, guiding all of us back
    into a concrete hallway that led to another door. This one had to be opened with
    a combination, and I made sure to point the camera at what she was doing as she
    typed in the code.


    She made no attempt to disguise the buttons she pressed, so even I was able to
    dedicate it to memory.


    We followed her into a closed hangar with a horizontal opening at the far side
    that was undoubtedly hidden from the surface. In here, crates were being stacked,
    `treadbulls` moving large shipments into the room where the smaller packmules
    move them into a position, readying them to be loaded onto the ship.


    From the room, I was looking for armed guards or turret defenses or anything,
    but there was nothing. I supposed that their distance from the rest of the universe
    and an inhospitable planet was what they used to keep themselves safe out here.


    That would certainly make things easier.


    “If you don’t mind,” I said, “we will wait here for our ship to come around.”


    She nodded. “That is no problem, though wouldn’t you be more comfortable waiting
    inside? We can offer you tea or coffee?”


    “You can bring my coffee here,” I said, pointing to some benches along the wall
    out of the way of all of the commotion.


    “Anything for the rest of you?” she asked, and Imogen asked for tea.


    When she shuffled off, I turned to the others. “We all on the same page?”


    “When them real shippers come, we wait in some empty boxes and let ’em take us
    to Twain?” Clynt said.


    “I don’t think that all of us”—I hooked a thumb toward `Alek`—“can sneak into
    the boxes.”


    “Oh, like you are stealth incarnate,” Imogen joked at my expense.


    “Right,” I allowed. “I don’t know that any of us would be able to get on the ship
    without somebody around.”

    '
  raw: 'And I wondered what it was, exactly, he had been doing with it since the Old
    War. Obviously, he couldn''t purchase his own Hospi-gel from the manufacturer,
    but something told me it was more than just using it to keep his soldiers healthy.


    I looked at the large clock on the wall, but given that I didn''t know anything
    about the way time was told on this planet, the numbers meant nothing to me.


    Therefore, I formulated my question differently. “How long until you were expecting
    us?”


    “Don’t you have that information too?” she asked, not sounding suspicious as much
    as surprised.


    I folded my arms in front of my chest. “I just wanted to be sure that we were
    given the same information. Working for a new client means learning their routines.”


    She glanced at the clock as well. “We were expecting you at fourteen twenty,”
    she answered.


    “You would think of that as about an hour,” Ned calculated for me.


    That meant we didn’t have much time if I wanted to enact any kind of a plan.


    “And where do we load from?” I asked. “I left my ship a bit further than perhaps
    I should have.”


    Her brows lowered ever so slightly this time. “Every new shipper has been given
    this information. Are you certain you''re at the right place?”


    “Yes,” I said in a hard voice. “Please show me where the transfer takes place.”


    I spoke with enough authority that any lingering questions she had seemed to fade
    away, and she turned and shuffled toward one of the doors, guiding all of us back
    into a concrete hallway that led to another door. This one had to be opened with
    a combination, and I made sure to point the camera at what she was doing as she
    typed in the code.


    She made no attempt to disguise the buttons she pressed, so even I was able to
    dedicate it to memory.


    We followed her into a closed hangar with a horizontal opening at the far side
    that was undoubtedly hidden from the surface. In here, crates were being stacked,
    treadbulls moving large shipments into the room where the smaller packmules move
    them into a position, readying them to be loaded onto the ship.


    From the room, I was looking for armed guards or turret defenses or anything,
    but there was nothing. I supposed that their distance from the rest of the universe
    and an inhospitable planet was what they used to keep themselves safe out here.


    That would certainly make things easier.


    “If you don’t mind,” I said, “we will wait here for our ship to come around.”


    She nodded. “That is no problem, though wouldn’t you be more comfortable waiting
    inside? We can offer you tea or coffee?”


    “You can bring my coffee here,” I said, pointing to some benches along the wall
    out of the way of all of the commotion.


    “Anything for the rest of you?” she asked, and Imogen asked for tea.


    When she shuffled off, I turned to the others. “We all on the same page?”


    “When them real shippers come, we wait in some empty boxes and let ’em take us
    to Twain?” Clynt said.


    “I don’t think that all of us”—I hooked a thumb toward Alek—“can sneak into the
    boxes.”


    “Oh, like you are stealth incarnate,” Imogen joked at my expense.


    “Right,” I allowed. “I don’t know that any of us would be able to get on the ship
    without somebody around here noticing. And, not for nothing, I''m not sure how
    much I want to climb into a box full of fungus.”


    “What''s the plan, then?” Alek asked.


    I pointed to the door. “When the ship lands, we take it by force and then fly
    it wherever it''s supposed to go.”


    Clynt grinned. “I like the sound of that.”


    “So do I,” admitted Ned. “I also like that we are bringing the fight to Twain
    for the first time in a long time.”


    A moment later, the woman returned, with Lara by her side.


    “I let her know that we no longer needed her guarding the front entrance,” Ned
    said, and I was happy that he had.


    Now, with a full team assembled, we waited for our ship to come in.


    I set down the last of my coffee when the hangar door on the far side began to
    open.


    19


    ![](OEBPS/image_rsrc3N4.jpg)


    We all stood and moved into positions where we could grab our weapons easily as
    the ancient cargo ship came out from the ship-airlock on the other side of the
    massive hangar door.


    The woman who had greeted us and the people who had been filling the crates waited
    off to the side until the ship sat down and the placemags activated. As soon as
    they had, several ramps lowered along the side of the ship, and a moment later,
    some people in coveralls stepped from the ship.


    I decided that we could wait until they had finished loading all of the crates
    onto the ship and hopefully give the workers a chance to get out of the hangar
    before any confrontation took place but, as we were standing there, one of the
    men in coveralls noticed us.


    I watched as he marched over to the woman with the black bob, got in her face,
    and pointed in our direction.


    “That''s our cue,” I said, and at once we all pulled out guns and started making
    our way across the hangar.


    The man in the coveralls shouted, and the others instantly sprang into action,
    taking up positions behind the placemag legs unslinging rifles.


    Unfortunately for the woman with the bob, she was grabbed by the man who appeared
    to be their leader, who pulled out a handgun and pointed it at her head.


    “Let us go and no one gets hurt,” he said, and it was the kind of moment that
    made me wish I was a bit more tactical, like Ned.


    If I had any kind of formal training, I might have positioned us all around the
    room and just had us snipe all of the Disciples as they milled about the ship.
    Instead, thinking that I could keep the workers safe, I had actually endangered
    their lives.


    “You don’t want to do that,” I said.


    “No, Hank, I think that you don’t want me to do that,” he said, and a cold chill
    ran up my spine at the use of my name.


    As expected, the sound of a revolver rang out in the space, and the leader was
    thrown back, the woman with the bob being sprayed by his blood. She and the other
    workers began to scream and run while the other Disciples opened fire on us.


    We all ran and jumped behind crates and heavy machinery that sparked and rattled
    as they were hit with bullets and bolts.


    I saw one of the Cultists firing from a position up the ramp, and I aimed my stomper,
    squeezed off a few rounds, and watched her fall.


    Imogen unloaded a burst toward another disciple who was using the heavy ship leg
    as cover. The bullets crashed against the metal but didn''t seem to hurt him,
    and as soon as she let off the trigger, his arm swung out briefly.


    A grenade came bouncing toward us, and we all scattered.


    When the pulse erupted forth, it threw the cargo containers around the room, spraying
    medicinal fungus over everyone and everything.


    Lara''s stealth suit, now covered with spores, did nothing to keep her hidden,
    so she simply raised her gun and fired off a few shots at the man who had thrown
    the grenade. Then she moved into a position behind a treadbull with Imogen.


    They had him pinned, but I saw him pulling another explosive from his vest, so
    I hurried around the side of the room, got myself into position, and took the
    shot.


    He wasn''t able to get the grenade thrown, but instead, it dropped to the ground
    right where he was, blowing himself across the room and bending the placemag leg
    ever so slightly. That was an annoyance for future Hank.


    At the sound of the second explosion, another man in coveralls came charging out
    from within the ship. He had a wild look in his eye, and a metal hand protruded
    from one of his sleeves.


    “I guess Twain at least has the sense to hide his cyborgs when making pickups,”
    Ned joked.


    I raised my gun, but before I could even take a shot, Alek had bounded forward
    and closed the space between himself and the charging Disciple. The man used his
    metal arm to try and attack Alek, but the Kyrog moved out of the way.'
