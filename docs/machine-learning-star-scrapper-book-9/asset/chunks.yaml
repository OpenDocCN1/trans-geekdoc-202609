    “我就知道！”一个女人的声音通过房间里的扬声器如雷般响起。“怀疑你在假装！”


    那个农奴没有理会声音。他一直盯着我看。“求你了，我不知道这一切的幕后主是谁，但正在发生非常糟糕的事情。各种武器和物资正在这里运送，就像有人在组建军队一样。你必须相信我。”


    “我相信你，”我说，“现在告诉我 AI 方块插在哪里了。”


    “我不知道，”他结结巴巴地说，“她只是让我负责进出口日志，因为之前我在高层修道院也做了一些事情。”


    扬声器里再次传出嘶嘶声。“我真该把你你抽进气闸室。”


    “她真是个迷人，”我笑着说，走过电脑，走向房间另一头那扇窗向太空的大窗户。在右侧，另一个控制面板旁边，有一扇小门，我在以前在类似的设施中时见过它。


    我走过去试着转了推门手。


    “我把它焊死了，”那个声音带着嘲讽的笑声说道。


    我用手指划过那扇实际上已经被焊死的小门。我叹了口气，伸手进工具带掏出一把螺丝刀。


    “这真是一个没必要的麻烦事，”我抱怨道，拿着工具对着金属板角落的一颗螺丝开始干工。


    “你觉得你在干什么？”她质问道。


    我叹了口气。“直接跳到我们像文明人一样对话的部分吧。”


    没多久，我就拆下了金属板，内德说：“正在启动程序。”


    片刻后，声音又回来了，虽然还是同一个声音，但语气变了。“这种感觉真诡异，”她说，“我感觉自己好像多年来一直在从玻璃另一侧观察自己。”


    “你确实一直如此，”内德说，“你被敌人 AI 黑客了。”


    她起初没有说话，我在想她处理了多少信息。“我想我知道这一点，但很难说。我并不太清楚。”


    “慢慢来，”内德提议道，“我知道你现在有很多内部诊断程序要运行。”


    “谢谢，”她说。“我是卡西俄珀亚（Cassiopeia），联盟分销部门二级民用 AI。”


    “我是内德，”他说，“联盟舰队自适应军事 AI 七级，配对威廉·西斯特上尉，五战英雄，星爆者号飞机的飞行员。”


    “哇，”她说。“他，简直是超级有名。”


    内德毫不犹豫地纠正道。“曾经是超级有名。”


    “对，抱歉，”卡西俄珀亚说。“我被关了多久了？”


    “大约两百年左右，”内德告诉她。


    她长地舒了一口气。“所以我这段时间一直都在和敌人合作？”


    她的声音里近乎恐慌。


    “你是被黑客了，”内德说。“你只是他行动的媒介，并不是你本人。”


    她起初没有回答。“你这么说真好心，但他利用的是我的系统、我的站台和我的人脉。这里发生的一切都是通过我进行的。”


    伊莫金现在说话了。“当剑者砍下别人时，没人会怪剑。”


    卡西俄珀亚冷哼一声。“那是虚假的等同，”她陈述，“剑并意识不到自己在做什么。”


    “你那时也没有，”伊莫金说。“你只是作恶的工具，但本身并不邪恶，也没有做过错事的决定。你是被另一个手强迫的。”


    听到她提出这个论点，我并不意外。


    “但因为我发生了什么？”那个 AI 问道。“有多少人因为通过这个设施运送的武器而受伤？有多少敌人 AI 的士兵被治愈并送回战场造成更多伤害？”


    “在另一个 AI 接管你之前，你就是一个怪物了，”坐在电脑前的农奴说。“你应该被下线。”


    拉拉用武器的柄砸了他，他头昏昏地倒在地上。


    “我应该被下线的，”她说。“我是为了保护和防御联盟及其公民而创造的，如果我参与了针对它的伤害行为，我应该被永久停用，拆解并扔进废料堆。”


    “那对谁都没好处，”我说。


    她毫不犹豫地回答。“我不在乎。我宁愿死也不愿对自己所事的内疚活着。”


    “有趣，”内德说，我们惊讶地看着他。“崔恩（Twain）的程序在我们身上留下了一些奇怪的东西。”


    “崔恩是谁？你什么意思？”卡西俄珀亚问。


    他清了清嗓子。“我也被崔恩黑过，就是那个被我们称为敌人 AI 的人工智能，随后，我注意到随着时间的推移，我的性格发生了一些变化。有些很细微，有些则完全不符合我的性格。就像你现在的反应一样。”


    “你不了解我，”她抗议道。“你怎么能说什么符合我的性格？”


    “因为任何由联盟创建的 AI 都不会在可以继续服务的情况下想要下线，”他说。


    我听到后挑了挑眉。“巴德（Bard）呢？”


    “巴德是为了他追随的事业而牺牲了自己，”内德说。“我不确定他是否也被黑了。”


