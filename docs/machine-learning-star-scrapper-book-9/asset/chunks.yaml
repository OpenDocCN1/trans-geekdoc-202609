    我那体型巨大的朋友抓起机械肢体用力一拉。他并没有把它拉下来，而是直接将整个人从地面上拽起，然后朝另一条腿扔了过去。当他的身体撞击金属时发出的嘎吱声再次让我感到一阵寒意，那名信徒再也没有动过弹。


    又有两名信徒从机库另一侧的撤退位置射了出来。我们向他们还击，但从这个距离来看，我们能做的无非是相互压制。


    我看着其中一人转身，向他们左侧的方向开火，而那里我甚至没见过克林特占据过位置。但这些人可能经过了强化。不知何故，她察觉到了维克拉斯人正在侧翼袭击他们，接着又开了几枪将其挡在门外。


    我摸了摸口袋，感受到了那个矩形物体，心想它在这里是否起作用。


    我把它掏出来，隔着空地指向其中一名信徒。


    当我按下按钮时，什么都没有发生。


    我不知道是因为我离得不够近还是它坏了，但无论如何，我为自己的麻烦换来了一道紫色的电光。我畏缩着躲回去，保持安全，更多的能量束击中在箱子上，将内部的孢子加热。


    我探头出去，看到克林特正试图靠近，但每当他从一个位置移动到另一个位置时，都会遭到火力攻击。我们战斗的大多数对手都能被他穿过空间的能力出其不意，但由于特莱恩的改装，他的士兵变得要难对付得多。


    在另一侧，我看到拉拉正试图擦净隐身服，以便再次尝试在隐形状态下移动，但考虑到我们不知道这些人拥有什么种视觉升级，这可能也是徒劳无功。


    但随后我看向他们位置的前方。我看到的不是两个试图寻找攻击角度的女人，而是他们正用来当掩护的那个东西。


    我穿过空地，冲向那履带坦克，跳进了驾驶座。


    回到这种大型载具里的感觉很好，我开始拉动控制杆，转向那个大家伙，开始朝那两名信徒开过去。


    看到工业车辆朝他们滚来，他们都开始向我射击。但伊莫根和拉拉正如我希望她们做的那样，在我缓慢向敌人移动时从后方开火。


    克林特也利用了机会。于是，当车辆廉劣的塑料挡风玻璃和金属车顶在我四周被毁时，其他人围了上来，击落了剩下的两名信徒。


    他们死后，我们都朝飞船移动过去。


    “正在进入他们的系统，”内德告诉我，“应该只要一下时间。”


    飞行器本身非常巨大，尽管大部分只是开放的货舱区，以及推进器和燃料空间。船头有一些用于长途旅行的舱室，但大部分没有家具，驾驶舱同样简陋。


    在做任何其他事情之前，我激活了控制并运行了诊断，看看被脉冲手雷击中的腿是否受损严重到无法收进船内。


    “我看到目的地了，”内德告诉我，尽管驾驶舱的显示屏上也有，“我获得了他们的代码。”


    “没有加密吗？”我惊讶地问。


    他冷哼一声。“我想在认为自己占据优势两百百年之后，人就会变得懒了。”


    “特莱恩真的认为我们是傻瓜，”阿列克观察道。


    我转看向克罗格。“财会给他给出过任何反驳意见的理由吗？即使在我们摧毁了他的超级武器以及他部分摧毁了我们系统的一颗行星后，人们仍然不相信他真的在那里。如果我们甚至不能团结起来对抗他，或者说，甚至不相信他在那里，他凭什么会认真对待我们？”


    “他很看重你，”拉拉指出。“他的部下知道你的名字，而且可能已经收到过你的警告。”


    伊莫根看着拉拉，眼神中带着一种我无法形容的情绪。“你不应该为此嫉妒。”


    “我不嫉妒，”拉拉抗议道。


    红发女孩笑道。“你很嫉妒，”她说，“你不喜欢自己是个这么厉害、又坏的赏金猎人，但那个汉克正是特莱恩警告过他部下的人。这很合逻辑，但我只是……”

