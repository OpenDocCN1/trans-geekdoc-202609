  trans: '


    查理和他身边的女人一起大笑起来。“那是某种笑话吗？”他问道，“我当然想住在别的地方。但我无可挽回地得罪了这地方唯一可以进出这里的人，而他们又真的没有手段离开。”


    “而且仅仅因为我出生在这里，并不意味着我想在这里多待一秒，”他的妻子说道，“这里是个糟糕的居住地，而公司正竭尽全力想通过活饿我们来让我们离开，这让这里变得变得更糟了。”


    我看着他们，还有坐在火堆旁几、正全神贯注听听的几个人。“你们想安全地离开这个星球吗？”


    “如果你能提供的话，”查理说，“我们将不胜感激。”


    伊莫金（Imogen）向前一步。“我想在空间站为他们提供避难所……至少直到他们重新稳脚跟。”


    “我们遇到的上一批这类人试图让汉克带着他们公司的严厉警告回到家，”克林特（Clynt）说道，“我不知道把他们带进我们中间是否是个什么明智的主意。”


    伊莫金死死盯着那个维克拉斯人（Vekrass）。“你可能会惊讶地发现，并不是所有来自同一个地方的人都完全一样。”


    “我不是说他们是一样的，但我知道我们在这块石头上展示过善意，得到的却只有六连管齐射的‘谢谢’，”克林特说道。


    查理防御性地举起手。“如果你们在这里的经历让你们不愿于帮助，我理解。”


    伊莫金盯着我，我纳奇她在想什么，尽管我知道她想听我说什么。当然，他们两个都是的。胸口中了他的一枪让我难免地对收留这些人感到心存胆怯，但另一方面，在认识他们的这几个瞬间里，他们看起来很真诚，而且我喜欢这种帮助某些身处困境的人的想法。此外，我知道如果我背过这些人这些人，伊莫金将永远不会原谅我。


    显然，我做决定花的时间太长，因为查理再次开口了。“我要说的是，”他开始说道，“公司让我研究星际船燃料节约，在我稍微分心之前，我觉得自己取得了一些重大进展。我不知道你们拥有什么样的设施，但我非常乐意通过为你们节省一笔我认为可能相当客观的钱来换取我的报酬。”


    现在，这可有点有意思了。


    当我决定他们的命运时，每个人都盯着我。“欢迎上船，”我对医生说，伸出一手。


    就在那时，拉拉（Lara）闪现出现，惊扰了她周围的人。


    尽管我们并不认识这些人，除了我们想要信任他们之外，没有任何理由信任他们，但我还是做出了选择。


    当大局已定后，我需要人们为我们的事业集结，并团结起来对抗特恩（Twain）。如果这个男人能帮我们在燃料上省钱，并为战争多提供一个士兵，我会接受的。


    “谢谢，”伊莫金低声说，走近我的身边，而当地人立刻开始收拾他们的东西。


    有趣的是，我曾苦苦思结要不要让他们随我来，但他们似乎只是在盲目地跟从。在他们认知的范围内，我可能是特恩的一个特工，即将绑架他们，并向他们的大脑中注入纳米技术，将他们变成半昏迷的僵尸士兵。


    但我想他们之间存在着相互的信任，希望这对我们双方都有回报。


    “我认为这是正确的做法，”我告诉她。


    她点点头。“是的。而且我希望你知道，我真的很感激你是受那种是非观感指引的。”


    我正准备多说些，但拉拉跨了过来。“我们终于可以离开这个星球了吗？”


    # 11


    ![](img/image_rsrc3N4.jpg)


    在终于离开那个星球后，我们通过潮汐（Tidaled）离开了。

