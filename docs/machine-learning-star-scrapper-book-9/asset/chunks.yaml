    我知道她在撒谎，我怀疑房间里的其他人也一样，但阿拉娜（Alana）既是个政治家也是赏金猎人，她顺从配合了这一切。“很好，”她说，“现在，如果没有其他事了？”


    “没有了，”拉拉站起来说道。我也站了起来，但当曼恩（Mane）移动时，康西西亚人用一个眼神制住了他。“非常感谢你为我们提供的机会，并认真对待了我们的顾虑。我无法形容我是有多感激。”


    “等我给你发赏金时，你可以在外外表现你的感激之情，”那个女人说道，语气却很和蔼。


    “我们会的，”拉拉向她保证，我只是向她点了点头。


    我们俩离开房间，走向院子，彼此之间没有交谈一言。无论拉拉在想什么，她都清楚此时此地不宜分享，但只要当我们完全离开建筑并沿着小路走起来，我不得不问问到底发生了什么。


    “她说的话里有什么引起了你的兴趣，是吧？”我询问。


    她点了点头。“是的，”她毫不犹豫地回答道，“当辛（Syn）——”


    但当她看到之前按响铃的守卫朝小路跑来时，她停止了说话。他看起来很匆忙，看到我们时挥了挥手。


    “猎人维克斯（Vex）和斯皮尔（Spears），”他在面前停下，喘着气说，“我有消息。”


    ![](img/image_rsrc3N4.jpg)


    守卫告诉我们消息后，拉拉给了守卫一拳，将他重重地摔在街道上。接着，她发出一声我从未听过的尖叫。我想安慰她，帮助她，但首先我上前扶起守卫站起来。


    “你还好吗？”我问。


    他似乎处于震惊中。“我想还可以，”他回答道，“已经过了一天……”


    拉拉弯着腰，看起来像要呕吐了。


    “离开这里，”我对守卫说，尽管我完全没有权利告诉他做什么，但他还是转身冲了。


    我用一只手臂揽住拉拉，她正极度痛苦地剧烈抽搐。


    “现在我们要回站里吗？”我问道。


    她长地喘了一口气，说道：“不。”


    我们在那里站了一会儿，温暖的微风吹过我们周围的树木。


    “我需要口该死的酒，”她终于说道并走了起来。


    直到到达酒馆，她没有再说过一个字。台前的男人没有试图阻止我们，女老板也没有为我们提供座位。他们看到拉拉，就知道她正直奔吧台。


    “我要一杯布塞尔酿造（Bussel Brew），”我说，但拉拉摇了摇头。


    “两小口猎人金（Hunter’s Gold），”她说，“也为为他来一杯。”


    他看着我，我只是快速地点了下巴。他转身倒了酒，当他把酒放在柜台上时，拉拉接连地喝了两口。我不甘落后，也照学样做。


    “我很抱歉，拉拉，”我说，听到这句话时，泪水再次涌而出。


    她伸出手，也抿了一口我的啤酒。“我甚至不知道该从何说起，”她说，“现在的这种悲伤是该死的太深沉了。我的亲生母亲就死在我面前，但这个……这要糟糕得多。”


    “你以前并不真正了解你母亲，”我说，“泽诺比亚（Zenobia）帮你抚养你。”


    拉拉点了点头，用空的小酒杯敲了敲吧台，示意要再来一杯。


    “我觉得她预料到了这一刻，”拉拉说道，话从喉咙挤出来，“当我见到她时，她没有提到发生在她身上的事……”


    当她长时间不说话时，我问：“她说了什么？”


    “她……”她开始说，但话几乎说不出来。“她对我能成为这样的猎人感到多么自豪。”


    然后她又崩溃了，双臂撑在吧台上，抽泣得更厉害。


    这不是我最擅长的领域，但我想要尽可能地陪伴她，所以我提供了我所能给的安慰。


    “当陆奇（Lutch）去世时，”我说，“我以为我将无法活下去。我感觉世界末日了，我永远无法填补心中那个由陆奇留下的空洞。但我做到了。你也会的。虽然失去她很伤心，但你应该感到宽慰，她看到你成长为现在的猎人感到高兴。”


    遗憾的是，我的话并没有像我预期的那样起作用，她用通红的眼睛看着我。“汉克（Hank），我不会大声说发生了什么，但你我都知道她为什么死以及谁该承担责任。我不为她为我自豪感到高兴，我为这件事的发生感到愤怒，为我没能为她做任何事感到痛苦。”


    “你现在可以了，”我说，“你已经在做了。我们刚刚启动了有助于解决这个问题的程序。也许是以永久的方式。”


    “你听起来像是在试图阻止我做某事，”她说，而我并没觉得自己在那样。


    我凑近了身体。“我必须这样做吗？”


    她过了很久才回答，直到她面前又出现了两小口酒。她又喝了一口，但在她拿到之前，我把手覆在上面。


    “拉拉，”我尽可能严肃地说道。“每当我们回到这里待几天，我的生活就会变得轻松一些，”她说，“训练不会那么激烈，我每隔一段时间就能获得一些休息时间。我觉得那是因为当我虚弱时，泽诺比亚让他在我面前留了手。不是说她没有那样磨练我、挑战我，但和她在一起感觉不一样。”


    她用力眨了眨眼睛，看起来半半沉浸在记忆中。“她总会在狩猎后带我出去吃晚餐，让我分析我看到的、我所做的，并分析哪些可以做得更好或不同。而不是辛那种因为我任何失误就让我觉得自己像垃圾一样的风格，她总是试图教导。我的意思是，我知道他也是，但我那时年轻，她的风格让我更容易想要学习。”


    她又喝了一口我的啤酒。


    “你知道吗，这是她买给我的，”拉拉拉了拉她潜行服的袖子。“当我十八岁时，泽诺比亚把我拉进办公室后面的房间，说在某个年龄，每个女孩都需要一件她梦想中的连衣裙。”


    她想起这段记忆笑了起来。“我一定看她的眼神像她长了四个脑袋，因为她脸上带着最大的笑容，对于一个擅长潜行的猎人来说，唯一正确的衣服应该是潜行服。然后她带我去购物了。”


    她停顿了，仿佛想起了泽诺比亚去世了。她的脸扭曲了，她闭上眼睛试图止住泪水。

    '
- fmt: '

    “It was one of my favorite days,” she said finally. “We went, and I tried them
    on, then modeled them for her as she judged, but when we found this style, we
    both knew. It was amazing and fun and different. Nothing like getting my ceremonial
    weapon. It was just a good time… and I think it’s one of my favorite memories
    ever.”


    I smiled. “I know that she would be so happy to hear that,” I told her, thinking
    back to some of my favorite moments with `Lutch`.


    “I think that remembering those we loved in the moments we loved them most is
    the best way we can honor them,” I said.


    She looked me right in the eyes. “I love you, `Hank`, she said. “Just in case
    we die, I want to have said it just the once.”


    “I love you, too,” I told her since there was nothing else to say. I did, and
    she knew it, and I was happy that we had said it. And even more happy that we
    had chosen a moment where there wasn’t anyone else around. I really didn’t want
    to know what the peanut gallery would have added.


    “I knew you did,” she said. “You’ve always been into me.”


    I let my face fall flat. “Meh, I just hung around you because I knew you would
    steal candy for me.”


    She smiled and punched my shoulder.


    Then the moment passed, and I watched her eyes go distant again. “I’m just really
    sad, `Hank`.”


    “I know,” I said. “And you should be. I’m sad, too. Even though I only knew her
    for a very short while, `Zenobia` was always good to me and brought me into the
    fold when she really didn’t have a reason to. She was an incredible woman… who
    helped train another incredible woman.”


    She set her hand down on mine. “Thank you for saying that, but I don’t need flattery
    now,” she said. “I need to do something.”


    I looked around the bar, relieved to not see any trappers for her to fight.


    “Before you run off to do something,” I said, “I have to ask what it was that
    the councilwoman said that got your hackles up?”


    `Lara` took a deep breath. “And now we are going to talk about the death of the
    other person who raised me.”


    “I’ve tried to be respectful of that and never ask,” I said. “And didn’t even
    realize that’s what this was about.”


    She patted my hand. “I’ve noticed and appreciated that, and I guess it’s time…”


    Now, I knew better than to say anything, and she continued.


    “I was sleeping in the apartment `Syn` kept when a `Purple Cloak` knocked on the
    door to tell me that he had passed away,” she said, the sadness once again coating
    every word. “I couldn’t believe it and didn’t understand. When I asked `Zenobia`
    what had happened, she said natural causes, but something about the way she said
    it didn’t seem right.”


    This was the most she had ever shared, but I had been able to piece together little
    parts of it. I was interested in the full picture though and happy to finally
    be getting it.


    “I tried to find out more, but every hunter stonewalled me, until eventually I
    was called before the `Council` and told in no uncertain terms that he had passed
    away naturally and that I was to be granted my next rank and take his place in
    the pantheon of hunters,” she explained.


    “I was so honored.” She shook her head. “So honored that I didn’t keep pressing.
    Rather than ask about what case he had been working and for who, I just got excited
    to start my own bounty-hunting career.”


    Apparently, she read something into my look and said, “It wasn’t as if I gave
    up on thinking about him or anything like that, I was just happy for myself. You
    have to understand that I had been training for so long, since I was a little
    girl, and I hadn’t ever felt like the day would come. And I was young.”


    She was obviously trying to justify something more to herself than to me.


    “I should have spent more time digging, more time trying to pull together the
    things that I had heard,” she said, her voice woeful and self-flagellatory. “I
    should have done more for him instead of just being so happy that I was finally
    a bounty hunter.”


    “It sounds like, just as now, there was nothing that you could have done at the
    time that would have worked out well for you,” I told her. “If they were saying
    that there was nothing to worry about, even if it was a lie, then the newly minted
    `Kilara Vex` would only have run into trouble pulling the thread.”


    She ran a finger along the rim of the shot glass. “It''s just,” she said in a
    whisper, “if the same people had something to do with that as with this and I
    could have stopped them years ago…””


    She trailed off, determined to blame herself.


    “Take it from someone who wishes they could have done something for the person
    that they loved before the end,” I said, thinking about how many times I tried
    to get `Lutch` help in the last months of his life, “you can’t blame yourself,
    you can only try to find ways to move forward. That being said, if we unearth
    something in the course of this investigation, you know that I will follow it
    to the end with you.”


    “I know,” she said.


    She finished the rest of my beer before setting it back down. “But I do have to
    do something…”

    [/content]




    [content]

    This time, the way she was looking at me made it obvious what she meant.


    It was the middle of the next day before we had managed to rouse ourselves from
    the.

