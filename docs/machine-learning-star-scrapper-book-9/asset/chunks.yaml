    and fight with brutal skill, we would also get tired. The three of us had been
    in several fights leading to this moment, and our bodies were exhausted and wounded.
    Meanwhile, we were fighting against an enemy made of machines. They would never
    wear out or slow down or make mistakes. They would, however, take advantage of
    any miscues.


    Lara and Imogen both swung in what looked like a simultaneous movement but that
    the Inquisitor was able to deflect back and forth.


    His movement was fluid and powerful, and both of them looked as though they might
