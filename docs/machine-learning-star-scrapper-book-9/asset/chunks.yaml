  trans: '

    听到这个名字，我转过头看向伊莫金，她的脸色苍白如鬼。


    “你能把它击落吗？”拉拉问道卡西奥佩娅。


    “不能，”她回答道，“我不控制空间站的武器，即使我可以控制，它移动得太快了。此外，那些大炮的设计是为了对付大型船只的。”


    “没关系，”我说，“是时候彻底解决掉他了。”


    伊莫金看着我。“你想在这里、现在就向他宣战吗？”


    “是的，”我说，“无论如何，我们都得面对约翰·格雷高里。”


    “你直接再次把他的脑袋砍掉就行，”拉拉说道，用握紧拳拍了拍伊莫金的肩膀。


    这位前执事者听后笑了起来。


    “这个空间站上防御性最强的位置在哪里？”我问那两个 AI，心想其中一个会给出一个完美的答案。


    “这个空间站的设计并不是为了那种用途，”卡西奥佩娅回答道。


    内德补充道，“所以你可以随心挑选地点。”


    “我们应该在机库里伏击他们，”拉拉建议道。


    没有进一步讨论，我们回到了小车旁。我尽快地推车来到电梯，穿过底部的走廊。


    “我正在拖延他们，”卡西奥佩娅告诉我们，“我正强迫他们在 `Bay 03` 停靠，因为那里有几辆货车可以让你们躲在后面部署位置。”


    “我们刚经历过那种战斗，”拉拉笑着说，“我们会准备好的。”


    我不知道这话有多真。


    和横恩的几个人战斗很难，但每当我和格雷高里战斗时，我都是侥幸逃了一生。我叔叔就没有那么幸运。那段记忆也激励着我。虽然降落的那个人并不是做过那事的本人。


    真正的审判官，真正的约翰·格雷高里已经死了。这个朝我们来的东西被横恩重新组装，并让他为他战斗。


    但似乎那个老人的某部分可能仍然被埋在里面，我知道在接下来的战斗中他会疯狂地战斗。


    停下小车后，我们迅速跳下，穿过 `Bay 03` 的门，那是另一个巨大的空间，但这个空间是用来让飞船降落的。


    我们都移动到各种机械设备后面，拿出武器并进入掩体。


    “我会告诉你们什么时候开火，”内德说，“我可以挑选最准确的时刻。除非我另有指示，否则大家根据位置从左到右取目标。阿莱克，我让你听到我的口令就准备冲锋。”


    我们都理解了，并等待凤凰级飞船降落。


    当磁浮启动的那一刻，我感到心跳开始加速。这就是我们一直等待的时刻。这个空间站不仅提供了海量信息，我们还让约翰·格雷高里措手不及。


    除非卡西奥佩娅一直在假装，而 `Edwin’s program` 没有起作用。她可能一直在扮演一个获的奴隶，并告诉审判官来这里对付我们。


    当跳板落下时，这个理论证明是一个更有可能。那艘飞船是由光滑金属和发光灯光组成的噩梦。随着跳板嘶的一一声打开，第一位审判官出现了，侧面跟着一队装甲卫兵。


