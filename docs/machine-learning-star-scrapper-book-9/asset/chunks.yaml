    \n# PREVIOUSLY ON…\n\nStar Scrapper:\n\nHank Spears is content living the life\
    \ of a scrapper until he unearths an AI named Ned. This intelligence is a soldier\
    \ from the Old War against a cult bent on making all organic life in the universe\
    \ join with the machine.\n\nNed warns of a superweapon that he had been investigating\
    \ at the time he was offlined called Codename: Extinction and believes that it\
    \ might still be out there. Before Hank can decide if he wants to help, he is\
    \ caught with the AI and has to flee. Since the war, the universal Consortium\
    \ Government has outlawed any artificial intelligence, and anyone caught harboring\
    \ one is imprisoned or killed.\n\nPursued by Inquisitor John Gregory and his Acolyte\
    \ Imogen Hush, the two evade capture and discover a relay station in the far reaches\
    \ of space where another AI, Libby, has been hiding. With her help, they are able\
    \ to find the brother of Hank’s adoptive father.\n\nHe offers to help, and they\
    \ think things are turning around, but Hank is discovered by two bounty hunters\
    \ hired by his old employer. Luckily, one of the bounty hunters is his childhood\
    \ friend, Lara, who helps them get off the station. Though conflicted at first,\
    \ Lara decides to help Hank get out from under the thumb of his criminal boss.\n\
    \nThey earn some money collecting bounties but soon discover that Lara’s ship\
    \ was destroyed by John Gregory—who also murdered Hank’s uncle. Rather than letting\
    \ this defeat them, they team up and arrest Hank’s former employer.\n\nBy doing\
    \ so, Hank becomes a bounty hunter and earns a large bounty. With the money, the\
    \ three can now begin to look into Extinction. They begin their hunt by seeking\
    \ out an Old War space station called Home.\n\nHunter’s Rise:\n\nHank, Lara, and\
    \ Ned make their way to the Cult space station, Home. While aboard, they are confronted\
    \ by a mysterious voice who tries to kill them. Ned is able to fight back and\
    \ get the humans to safety, but he is offlined in the process.\n\nThrough Lara’s\
    \ bounty hunting handler, Zenobia, they are given the name of a man who might\
    \ be able to help. Edwin Stern is a researcher with the skills to repair Ned,\
    \ but in order to do so, he needs a favor. They fly to meet with the man’s rival,\
    \ only to discover that she is his ex-wife. Before they can come up with a peaceable\
    \ solution, she shoots Hank and runs.\n\nThe two rush back to Bussel to meet with\
    \ Alek, an old friend of Hank and former medic (and mob doctor). He patches Hank\
    \ up and asks to join the crew. They accept but are forced to flee the planet\
    \ when Inquisitorial Acolyte Imogen Hush appears.\n\nThey return to Edwin, only\
    \ to find that he has been taken. Following a lead, they track him down and find\
    \ he is being held by his ex. After they rescue him, he repairs Ned, and they\
    \ offer him safe haven, which he accepts.\n\nNed wakes up and tells them that\
    \ the voice they met at the space station was Twain, known during the Old War\
    \ as the Enemy AI, the leader of the opposition. But Ned also has a lead on some\
    \ new information.\n\nWhen they follow up on what Ned has learned, they are ambushed\
    \ by the Inquisition, but Imogen helps them escape in exchange for their aid in\
    \ freeing her from the life of an Acolyte. With her help and some shipping manifests,\
    \ they might just be able to track down Extinction.\n\nRebel Intelligence:\n\n\
    Imogen offers to exchange information and political connections for Hank’s help\
    \ getting her family off of the Consortium capital planet of Emortium. Though\
    \ Lara doesn’t believe they can trust the former Inquisitorial Acolyte, Hank agrees\
    \ and after getting a ship from a Vekrass gangster, they sneak onto the planet\
    \ to help Imogen’s aunt.\n\nThe crew find Louise and her husband and get them\
    \ off the planet with the Inquisition hot on their heels. She asks to be taken\
    \ to a camp of the Peacer rebels and when they arrive, they meet the charismatic\
    \ leader, Shep.\n\nWhile they are talking, a nearby village is attacked by pirates\
    \ and Hank is asked to help. Rather than simply setting up defenses around the\
    \ village, the crew take the fight to the pirates and manage to cripple the fleet\
    \ and collect a bounty.\n\nShep is grateful and they part ways with Louise to\
    \ continue their hunt for Codename: Extinction. But when they find an Old War\
    \ medical facility, they learn a dark truth: Shep is an ancient Cultist who appears\
    \ to be helping the old Enemy AI begin to build his army anew.\n\nHank and the\
    \ team rush back and take Shep into custody after exposing the truth about him\
    \ to the Peacers sect. As they are leaving with the prisoner, the Consortium attacks\
    \ and they help the Peacers fend them off.\n\nBack on the ship, Imogen sneaks\
    \ out of her room in the middle of the night and, tired of bad people getting\
    \ away with their behavior, stabs Shep through the heart before being caught by\
    \ Lara.\n\nDeadly Ghosts:\n\nHank finally has the opportunity to use the political\
    \ connections that Imogen promised. Despite her decision to kill Shep, he still\
