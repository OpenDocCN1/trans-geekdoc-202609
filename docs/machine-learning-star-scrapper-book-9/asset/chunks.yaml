    “好吧，还是发生了，”拉拉说，曼尼用手抓了抓头发，挤掉了上面的水。他若有所思地转头看向洒在脸上的阳光。


    片刻之后，他看向拉拉。“你来对地方了。”


    # 13


    ![](img/image_rsrc3N4.jpg)


    穿好衣服后，曼尼带着我们离开了他的庄园，沿着路往前走了一段。他并没有带我们走向我熟悉的通往城市的方向，而是带我们上了一座俯瞰他社区的山丘。在这里，街道两旁满了大理石雕像和像拉长的泪滴的柏树。每隔几步，路边就站着一名守卫，他们监视着一切，同时也让人感到他们的存在。


    这里的空气闻起来更好闻，像新鲜的柑橘味。附近的恒星开始移动到上午中午的位置，我们在道路分叉处转了弯。顺着这条稍窄的路，我们又向前走了一会儿，直到来到墙顶部闪烁着激光尖刺的砖墙。


    铁门旁又站着两名守卫，他们背上都披着紫色的披风。他们互相看了一眼，左边那个基罗格人向前迈了一步。


    “停，”他说。


    曼尼笑了起来。“你真的要对我用这一套？”


    高大的守卫哼了一声。“是的，因为我没有收到你到来的警告。议员在等你吗？”


    “她不在，”曼尼说道，“但告诉她我来这里是为了——”


    但他没能说完。从墙后高大的房子和浅浅的装饰性水池旁，一个女人从阳台上用沙哑的声音喊道：“让他们进来，你这个大笨蛋。”


    他恼地哼了一声，但向后退一步为我们开了门。


    “谢谢，大块，”曼尼在我们通过大门进入打理精美的院子时说道。这里，长着闪烁绿皮的小飞行毛齿动物到处飞，，落在各种树掉下的果实上。蝴蝶在花丛间穿梭，就像步入了某种幻境。甚至星船的停机坪也被看起来像是手工雕刻的精美鸟食器围绕着，吸引了更多惊艳的小生物。


    从阳台上喊叫的康西西亚女性从沉重的正门走了出来。她的紫色皮肤在星光下闪烁着，她穿着一件飘逸的丝绸袍，走时在身后飘动。


    “曼尼·马利克，”她打招呼道，然后看向我们。“我不认识你们两个。”


    “猎人维克斯和斯皮尔，”拉拉边说边做手势。


    康西西亚人点了点头。“六人议会的阿拉娜·托尔甘。”


    “非常荣幸，”拉拉说道，语气近乎卑微，“我们来这里是为了和您谈一件要事。”


    女人环顾四周。“请进屋坐，”她说，转身走入别墅。从正面看，可以穿过主房间，主房间的沙发嵌在下沉地板上方的泳池上方，池子里有小鲨鱼在穿梭，一直可以看到另一个阳台。但这个阳台俯瞰着会议厅，可以欣赏绝美建筑和宏伟纪念碑的壮丽景色。


    她引导我们通过房间侧的一扇门，进入一个摆满卷轴书架的书房。在那里，她走到一台音乐播放器，放了一些悦听的古典音乐。尽管她显然这样做是为了不让我们的话被别人听到，但这营造了良好的氛围。


    她坐在一张小书桌后，桌上放着笔和一些纸，但没有电脑。墙下半部分是红色的，上半部分是米白的，上面挂着几幅阿拉娜年轻时穿着赏金猎人装束的照片。其中一张画着她骑着某种神话生物，另一张画着她站在翻倒的坦克顶端，看起来像是在单斗中击败了它。


    面对书桌的墙边放着几张沙发，我们三个人坐了下来。


    女人看着我们。“你们想说什么？”拉拉直接切入正题。


    “我们来谈谈，”曼尼说道。


    “关于关于比亚娅受了的事情，”拉拉说道。


    “我们确实知道，”曼尼点了点头。“是的，”阿拉娜说道，曼尼看起来像是在开玩笑。


    “在你们所说的，”拉拉说道。


    “确实如此，”曼尼点了点头，拉拉说道。


    “你们觉得这其中意味着什么吗？”阿拉娜问道。


    “完全正确，”拉拉说道，语气中带着一种近乎顺从的姿态。


    “请继续，”阿拉娜说道。


    拉拉再次似乎在字斟句酌。“我们知道，”曼尼点了点头。


    “我明白，”阿拉娜说道，拉拉叹了口气。


    “正如你们所说，”拉拉说道。


    “确实如此，”曼尼点了点头。


    “我们确实知道，”拉拉说道。


    “我不确定，”阿拉娜点了点头。


    “那么，请展示你们的发现，”阿拉娜说道。

