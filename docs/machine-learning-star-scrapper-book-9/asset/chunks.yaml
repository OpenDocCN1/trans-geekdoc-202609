    “再敢说那样的冷笑话，我就拒绝你进入，并把你炸出天外，”他威胁道。


    我本想指出，他所建议的（至少是“把我们炸出天外”那部分）违反了宇宙法则，并且预料 `Ned` 会很喜欢指出这在技术上并不是天空，但我很清楚他的想法。


    “抱歉，先生，”我改口道，“我的船上没有来自那个星球的人。”


    “二号口，”他说道，然后切断了连接。


    我转向 `Alek`。“我们到底要在这事儿干什么鬼？”


    “我不说我对此了解多少背景，”他说，此时 `Ned` 正引导着我们进入一个外面喷涂着罗马数字“二”的大型停靠舱。“但我知道当地人和住在上面的人之间存在某种紧张关系。”


    “你觉得呢？”`Lara` 讽刺地问。


    “是的，”`Ned` 同意道，“我想我们都能从背景中推断出这一点。”


    `Alek` 没有再说什么，当我们停靠好时，我看到几几个穿着制服的武装人员向 `Buzzard` 走来。


    当我们下船时，其中一名制服人员走上前。他们都穿着紫色的工作服，留着短发，染成了红色，与他们武器和腰带的颜色相匹配。中间那个女人盯着我们所有人。


    “有野蛮人吗？”她问道。或者更准确地说，是在命令。


    “没有，女士，”我说。


    她越过我的肩膀看向我的船。“介意我们检查一下吗？”她问的语气听起来就像是在说，“我们要检查。”


    我退到一边，用手做了一个扫过的手势，她停留在原地，而她周围其他人进入了我的船。我不喜欢，但也知道自己没有选择。


    我们沉默地站了一会儿，我终于开口道：“那么，我不是这儿的人；这一切到底是怎么回事？”


    她打量着我，好像我是什么土乡巴佬。“情况是，我们必须确保没有那些‘地表人’在没有许可的情况下往这儿来。”


    “为什么呢？”`Imogen` 问道，听起来已经很不满了。我瞪了她一眼，希望这能提醒她我们在这里需要某些东西，并且要表现得最好。


    “我问你一个问题，”那个女人盯着那位前`审判庭随从`说道，“你喜欢看到同事被杀掉吗？你喜欢因为你的矿场被毁或航线被中断而导致食物短缺吗？你喜欢因为你没有提供他们订购的东西而让你的贸易伙伴对你背弃吗？”


    `Imogen` 眯起眼睛。“我不说我经历过那种特定的经历。”


    “你因为这样才更幸运，”女人说道，“因为这一切都是不可接受的，而且这一切都让生活变得艰辛。”


    “如果那些当地人这么是你们的眼中刺，为什么不直接把他们全带到木房解决掉呢？”`Clynt` 问道。


    大家都转看向他，对这个提议感到厌恶和惊讶。


    “`Consortium` 不允许—”


    “种族灭绝，”`Imogen` 陈述。“那是你想找的词。”


    “是的，”那个染红头发的女人说。“就是那个。”


    `Imogen` 看起来还想多说，但由于其他守卫冲回来，她没有时间了。


    “他们是干净的，”一个人说。


    另一个人补充道，“没有‘地表人’的迹象。”


    “就这样，结束了，”女人用一种语气说道，听起来我们应该非常感激。她转过身，他们全都离开了房间，无疑是前往下一艘船，希望抓到有人走私把地表居民带进城市。


    我们离开停靠舱，穿过一条长长的走廊，来到一个电梯间，电梯带我们上了城市本身。


    当门打开时，我们看到的景象其实非常漂亮。在一个可以看到外太空的高圆顶下，一个拥有商店、植物、水景和露天餐厅的大型广场被高大的公寓楼包围着。孩子们在玩耍，人们坐着喝着茶，讨论着任何对他们来说和我正在做的事情一样的话。


    “并不像我预期的，”我承认道。“特别是考虑到我们要去见 `Resh` 的一位老朋友。”


    `Alek` 哼了一声。“我不需要告诉你们你们，有时候最好的躲藏地方是别人最意想不到的地方。”


    “如果你觉得这地方的人对黑市货物的需求比任何人都大，那我可以卖给你一座桥，”`Lara` 补充道。


    `Ned` 冷哼一声，但没说什么，我在想她那个表情是否到位。


    “我们要去哪儿？”我问，`Alek` 开始走路而不是回答。我们跟着他穿过广场，那里的人们都穿着类似的紫色衣服，染着红头发——如果我没猜错的话，看起来像是用当地粘土染的颜色——他们盯着我们。我不知道地表上的人长什么样，但考虑到他们的反应，我认为我们让他们想起了那些人。


    我们加快了脚步，`Alek` 迈着更大的步子，尽可能快地穿过广场并到达另一侧，然后我们钻过瀑布旁沿着岩石流下的垂吊藤蔓。当我们沿着金属台阶咯咯当响地走进一条黑暗的通道时，潮湿和藻类的味道充斥了我的鼻子。


    我不会说它隐藏得那么隐蔽，但如果人们不知道去寻找它，也同样找不到。


