    \n# 前情回顾…… 星际掠割者：Hank 一过着平静的生活，直到他发现了一个名为 `Ned` 的人工智能。这个智能体是旧战中反对将机器与所有有机生命融合的战争留下的士兵。`Ned`\
    \ 警告说他当时正在调查的一项名为“灭绝”的超级武器，并认为它可能仍然在那里。在 Hank 决定是否提供帮助之前，他因携带该 AI 被发现并被迫逃亡。自从战争以来，宇宙政府禁止了任何智能体，任何被发现藏匿它们的人都会被囚或处死。在审判官\
    \ `John Gregory` 和 `Imogen Hush` 的追捕下，两人躲过了抓捕，并在太空深处发现了一个中继站，另一个 AI `Libby` 一直躲在在那里。在她的帮助下，他们找到了\
    \ Hank 养父的哥哥。那个人提议提供帮助，他们本以为情况正在好转，但 Hank 被他旧雇主雇佣的赏金猎发现了。幸运的是，赏金猎之一是他的青竹马 `Lara`，她帮助他们逃脱。他们赚了一些钱，但很快发现他们的船被\
    \ `John Gregory` 摧毁——他还杀杀了 Hank 的叔叔。他们没有让失败击垮自己，而是联手逮捕了雇主。通过此，Hank 成为了一名赏金猎并获得了巨额赏金。有了这笔钱，三人现在可以开始调查“灭绝”。\n\
    \n# 猎人的崛起：Hank、Lara 和 `Ned` 前往一个名为 `Home` 的空间站。在船上，他们遇到了一个试图杀死他们的神秘声音。`Ned` 能够反击并将人类带到安全地带，但在过程中被杀。通过赏金猎人\
    \ `Zenobia`，他们得到了可能提供帮助的人的名字。`Edwin Stern` 是一个拥有修理技能的研究员。在她的帮助下，他们找到了 Hank 养父的哥哥。那个人提议帮助，但\
    \ Hank 被旧雇主雇佣的赏金猎发现了。幸运的是，其中一名赏金猎是他的青竹马 `Lara`，她帮助他们逃脱。他们赚了一些钱，但很快发现他们的船被 `John\
