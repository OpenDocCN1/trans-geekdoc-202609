    他的声音里没有一丝疑虑或疑问，他竟然能产生这种情绪，这让我很惊讶。为 AI 赋予情感是一回事，但让这些情感如此强烈，至于会危及任务的程度，则是另一回事了。当然，这是一种非常人性化的特质，而这些性格的设计初衷就是为了模仿我们自己。


    “我不会做的，”我说，我很确定内德（Ned）正期待听到这句话。


    “汉克（Hank），”他说道，用一种我听过的最严肃且低沉的语气，“这个人背叛了我的族人。他是导致我这么多朋友丧死的原因。他显然在与敌人勾结，不配再多活一秒。”


    “你清楚我必须做什么，”我说，“而且我相信，最后你会发现我做出的这个选择比听你的更让你开心。你现在正透过愤怒的滤镜在看问题，我完全理解这一点，但这就是为什么你有一个搭档的原因。我在这里是为了帮助你恢复理智。或者，如果不行，在你无法做决定时由我来艰难的选择。”


    查斯（Chaz）的声音再次通过扬声器传出来。“那一刻真温馨，但如果你觉得能从我这里得到任何信息，那你就是个傻瓜。”


    伊莫金（Imogen）呻吟了一声。“你真烦人。这事儿真烦人。”


    “那就杀了他，”内德说，“来吧，伊莫金，你喜欢杀死坏人，而且没有比一个背叛联盟（Consortium）并害了族人的叛徒更糟糕的了！”


    “我不喜欢这家伙对你所做的，内德，”红发女孩说道。


    我指了指 `Buzzard` 号的方向。“我们带他回去吧。”


    “你不能那样，”内德在我耳边警告道，“如果他有任何追踪系统——我们知道他一定有——我们会把奎恩（Twain）直接引到我们这里。”


    当然，他是对的，我为自己没考虑到这一点而自责。“我们可以关掉他吗？”


    “你能被关掉吗？”内德反驳道，我不得不同意伊莫金的观点：他对这一切表现得很不愉快。


    我思考了一下，心里有了答案。“我们可以路过一些当地的小贩那里，买一个小型的屏蔽场发生器。”


    “或者一个隐身箱，”克林特（Clynt）建议道。当他看到所有人困惑的表情时，他补充道：“正如你们想的那样。”


    拉拉（Lara）看着我。“猜你在这个扇区认识某个地方？”但在我开口之前，我想我可能认识，阿莱克（Alek）说道：“我知道。”大家都看向他。“我曾给黑道头子过，记得吗？”


    “对，”我说，“我们有一个计划。你可以随你怎么计划，但是——”查斯开始说，但我没让他说完。“我们已经受够了这些绕圈子，”我说，“我很累，所以除非你有什么有用的建议，否则你可以坐在房间后部。”当我们离开并赶回
    `Buzzard` 号时，内德没有再说什么。我不喜欢奎恩追踪我们行踪的想法，更不想把他引向某个偏远星球，但我们必须把查斯带回埃德温（Edwin）那里接受检查。再次回到
    `Buzzard` 号，阿莱克输入了坐标。距离很近。我们起飞离开了空间站，我不禁在想奎恩接下来会发生什么。对 `Parm` 的攻击让我感到措手，因为我原以为他会尝试攻击宇宙的权力中心
    `Emortium`，但当他针对 `Emortium` 出手时，连那也让我感到意外。


    影响仍在持续。奎恩一直在尝试改变战术，我唯一能预测的是，我看不见接下来会发生什么。大多数争夺席位的人似乎都有自己的打算，对参与战斗并不感兴趣。“他正试图破解我们的系统，”内德告诉我，听起来很不耐烦，“我能挡住他，但我们越快把他关进笼子里越好。”


    “谢你的提醒，”我说。内德哼了一声，声音从驾驶舱传出来。“他会更感谢被掉脑袋。”


    “这可不是你的最高水平，”拉拉评价道。伊莫金表示赞同。“没错，这家伙把你的脑子都搞乱了。”


    “你需要查出威廉（William）发生了什么事吗？”阿莱克严肃地问，“那能让你冷静下来吗？”


    “我的神经很冷静，”内德抗议道。伊莫金向控制台倾去，仿佛那里是一个老友。“我们之所以说这些是因为我们在乎你。”


    “我很感谢，但真的，我很好，”他说。


    “只有那些需要帮助的人才会说自己很好，”伊莫金说，我再次对这个女孩感到惊叹。“你并不好，即使你看不出来或还没准备好向自己承认，也要知道你身边有人为你留了位置，并且考虑的是你的最大利益。”


    内德沉默了很久。“这是一件很奇怪的事，”他终于低声说道，“知道你被设定了某种特定的方式。你被人类为了某个目的而设计……在某些方面，我觉得自己永远无法真正自由，因为我的头脑是由他人创造的，他们给了我某些参数。所以即使当我想我在为自己思考时，其实并不是。”


    “我们中没有例外，”我说。在我补充更多之前，他再次开口了。“我知道人类的大脑也是这样——被自然、父母和社会所设定，但又不同。某种意义上说，它不是固化的。归根结底，你可以改变主意。我不能。”


    “也许你可以的，”伊莫金说。


    “不，”他说。“我考虑过让 `Edwin` 进去修改我的部分程序，但我不确定是否会让我觉得自己还是……我自己，所以我只能这样：知道我应该想更多关于威廉的事，却无法强迫自己去在意。”

