    \n# PREVIOUSLY ON… Star Scrapper: Hank is living the life until he unearths an\
    \ AI named `Ned`. This intelligence is a soldier from the Old War against bent\
    \ making all organic life with the machine. `Ned` warns of a superweapon he had\
    \ been investigating at the time called `Extinction` and believes that it might\
    \ still be there. Before Hank can decide if he wants to help, he is caught with\
    \ the AI and has to flee. Since the war, the universal Government has outlawed\
    \ any intelligence, and anyone caught harboring one is imprisoned or killed. Pursued\
    \ by Inquisitor `John Gregory` and `Imogen Hush`, the two evade capture and discover\
    \ a relay station in the far reaches of space where another AI, `Libby`, has been\
    \ hiding. With her help, they are able to find the brother of Hank’s adoptive\
    \ father. He offers to help, and they think things are turning around, but Hank\
    \ is discovered by bounty hunters hired by his old employer. Luckily, one of the\
    \ bounty hunters is his childhood friend, `Lara`, who helps them get off. They\
    \ earn some money but soon discover that their ship was destroyed by `John Gregory`—who\
    \ also murdered Hank’s uncle. Rather than letting this defeat them, they team\
    \ up and arrest the employer. By doing so, Hank becomes a bounty hunter and earns\
    \ a large bounty. With the money, the three can now begin to look into `Extinction`.\n\
    \n# Hunter’s Rise: Hank, Lara, and `Ned` make their way to a space station called\
    \ `Home`. While aboard, they are confronted by a mysterious voice who tries to\
    \ kill them. `Ned` is able to fight back and get the humans to safety, but is\
    \ killed in the process. Through the bounty handler `Zenobia`, they are given\
    \ the name of a man who might be able to help. `Edwin Stern` is a researcher with\
    \ the skills to repair `Ned`, but in order to do so, he needs a favor. They fly\
    \ to meet the man’s rival, only to discover that she is his ex-wife. Before they\
    \ can come up with a peaceful solution, she shoots Hank and runs. The two rush\
    \ back to Bussel to meet with `Alek`, an old friend of Hank and former medic.\
    \ He patches Hank up and asks to join the crew. They accept but are forced to\
    \ flee the planet when `Imogen Hush` appears. They return to `Edwin`, only to\
    \ find that he has been taken. Following a lead, they track him down and find\
    \ he is being held by his ex. After they rescue him, they repair `Ned` and offer\
    \ him safe haven, which he accepts. `Ned` wakes up and tells them that the voice\
    \ they met at the station was `Twain`, known during the Old War as the Enemy AI,\
    \ the leader of the opposition. `Ned` also has a lead on some new information.\
    \ When they follow up on what `Ned` has learned, they are ambushed by the Inquisition,\
    \ but `Imogen` helps them escape in exchange for their aid in freeing her from\
    \ the life of an acolyte. With her help and some shipping manifests, they might\
    \ just be able to track down `Extinction`.\n\n# Rebel Intelligence: Imogen offers\
    \ to exchange information and political connections for Hank’s help getting her\
    \ family off the Consortium capital planet of `Emortium`. Though `Lara` doesn’t\
    \ believe they can trust the former acolyte, Hank agrees and after getting a ship\
    \ from a `Vekrass` gangster, they sneak onto the planet to help Imogen’s aunt.\
    \ The crew finds Louise and her husband and gets them off the planet with the\
    \ Inquisition hot on their heels. She asks to be taken to a camp of Peace rebels\
    \ and when they arrive, they meet the charismatic leader, `Shep`. While they are\
    \ talking, a nearby village is attacked by pirates and Hank is asked to help.\
    \ Rather than simply setting up defenses around the village, the crew takes the\
    \ fight to the pirates and manages to cripple the fleet and collect a bounty.\
    \ Shep is grateful and they part ways with Louise to continue their hunt for `Extinction`.\
    \ But when they find a medical facility, they learn a dark truth: `Shep` is an\
    \ ancient Cultist who appears to be helping the old Enemy AI begin to build his\
    \ army anew. Hank and the team rush back and take `Shep` into custody after exposing\
    \ the truth about him to the Peace sect. As they are leaving with the prisoner,\
    \ the Consortium attacks and they help the rebels fend them off. Back on the ship,\
    \ `Imogen` sneaks out of her room in the middle of the night and, tired of bad\
    \ people getting away with their behavior, stabs `Shep` through the heart before\
    \ being caught by `Lara`.\n\n# Deadly Ghosts: Hank finally has the opportunity\
    \ to use the political connections that Imogen promised. Despite her decision\
    \ to kill Shep, he still believes she can be trusted in this endeavor and they\
    \ travel to meet her “Uncle” `Vince`: Governor of Sector Three. They chat with\
    \ him about getting him to present evidence of `Extinction` to Parliament but\
    \ he needs solid proof. Before the meeting concludes, Vince is shot at by a mysterious\
    \ assailant who disappears. That night at dinner, he is attacked again and Hank\
    \ manages to kill the assassin. Doing so not only indebts Vince to him but also\
    \ helps him rank up as a bounty hunter. \n\nWith the money from the bounty and\
    \ some… encouragement… from famed bounty hunter `Mane Malik`, Hank upgrades his\
    \ armor before consecrating his spear.\n"
