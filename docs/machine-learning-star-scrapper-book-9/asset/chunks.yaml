    20


    ![](OEBPS/image_rsrc3N4.jpg)


    Ned brought us into the docking bay. Or, more accurately, he pulled the back of
    the ship to lock against the side of the station. Since they had the same manufacturer,
    the station and ship were designed to work in perfect tandem. Once the seal had
    been created, both sets of doors could open and allow the cargo to be moved from
    one place to the other.


    When they joined, the four of us were ready to go. The door opened, and we saw
    several serfs from the High Cloister waiting to receive their goods.


    The moment they saw us, they all rushed forward to attack with nothing more than
    their hands. It wouldn’t even qualify as a fight, but I called out to my friends
    to keep one of them alive.


    So we all avoided shooting at one old man off to the right as he came for us.
    Instead, Alek grabbed him and squeezed him with both hands to keep the wretch
    from moving. He wriggled against the strength of the Kyrog but couldn’t do anything,
    and soon I was right beside him.


    I pressed the button on the little rectangle and watched as… nothing happened.
    The man kept struggling and trying to press against Alek as he had been.


    But then he stopped.


    He blinked in confusion as if he was waking up from a dream.


    “They are here,” he said. “The holy war has begun.”


    Then he looked around at us. “You! Who are you and where am I? Who would dare
    molest a member of the Inquisition?”


    “I can’t believe it,” Ned said in my earpiece. “He did it.”


    “You have been subdued and kidnapped,” I informed the man. “The High Cloister
    was destroyed by a false Inquisition and now lies in ruin. You can help by giving
    us the information that we require.”


    His eyes went wide with panic, and they darted around the space wildly. A sheen
    of sweat broke out over his face, and he began to hyperventilate.


    Then an eerie serenity crossed his face. “I will tell you nothing,” he said like
    a mindless automaton. “I know nothing.”


    Before I could ask him another question, his eyes began to move in a manic panic
    once more. “Help me,” he said. “I don’t know what''s happening to me, but I feel
    like I''m being pulled apart. Is there something in my brain?”


    The sad truth was that there was something in his brain, and there was nothing
    we could do to help him.


    “Please release me,” he said, his body going limp once more. “There is nothing
    I can do for you.”


    “We need to put him out of his misery,” Imogen said. “Whatever Twain left him
    with isn''t enough to help us, and when the programming is at work, he’s even
    more useless.”


    I still believed there was more information that I could get from him, only I
    needed to figure out how. But after he blinked again and the man underneath Twain’s
    nanotech returned, he tried to bite at Alek and kicked so hard that he got free.


    The moment he did, Lara flicked her blade, and the now twice-sad man fell limp
    to the ground.


    “She was right,” Lara said. “There was nothing worth saving here, and he would
    have just kept coming.”


    I opened my mouth to protest, but she continued. “You weren''t gonna get any information
    from him. Neither zealot nor robo-husk was going to tell you anything.”


    “Fine,” I said.


    Ned spoke in our earpieces. “I am trying to get into the system here but there
    is an AI in control of the station who is under the influence of Twain.”


    “Do you think that the device Edwin made will be able to counter hack the AI?”
    I asked. “Will it work like that?”


    “No,” Ned said. “But he updated me with a version of it that I am able to install
    if I’m close enough.”


    I had never liked Edwin more than I did at this moment. “You are saying that the
    programming could possibly free this AI and give us all the information within?”


    “I believe it could,” Ned affirmed.


    This was exciting news.


    I couldn’t stay on the ship a moment longer. Instead, I moved through the passage
    and into the room full of more machinery to accept the cargo. There were no more
    people, and I wondered if bodies was the one thing Twain was lacking.


    At the far side of the room, there was a little cart parked, and I hopped in,
    then pressed a button to open the door in front of me.


    “Ned, can you navigate me to the control room?” I asked, but as the door opened,
    I saw wide roads inside the structure with clear labels. I pulled onto the road,
    and Imogen and Lara jumped in beside me. Alek just walked at full speed. With
    his wide strides, it wasn’t hard for him to keep pace with us.


    Every now and then, a serf would come rushing out of a room, brandishing some
    found item to try and murder us with, but they would be dealt with quickly by
    whoever was quickest on the draw.


    It wasn’t long before the straight road led us to a service elevator where we
    were able to park the cart. Alek didn’t even have to squeeze as there was more
    than enough space, and as it started to ascend, the ride was smooth.


    “This is weird,” Lara observed.


    We all looked to her. “Which part?” I asked.


    “This,” she said, gesturing to the fact that her feet were up on the dash of the
    little cart. “We have been to several of Twain’s facilities, and they are not
    normally like that.”


    “I suspect that it is because this facility interacts with the outside world,
    so to speak,” Ned said. “If there are shippers and traders bringing goods to this
    location, it can’t look like some villain’s lair.”


    “That’s as good a guess as any,” Imogen said.


    Ned made a grumpy little sound. “You have a better explanation?”


    Imogen looked around as though she had just been accused of something. “No,” she
    answered.


    An awkward silence followed.


    We were literally saved by the bell as the elevator dinged, and I pulled out and
    turned the car around in the wide lane so that I could drive the rest of the way
    to the control room.


    When we reached it, we jumped out and made our way into the massive room with
    several computer consoles that ran the entire operation below. Two more robed
    people were sitting and attending to matters around the station, but they stood
    as we walked in.


    One charged at us and didn’t live long enough to regret it, but the other just
    raised his hands.


    “Please don’t kill me,” he said.


    “Now, that’s a surprise,” Ned whispered.


    I stepped toward him, trying to get a read on the man. He was middle-aged and
    balding but wore a scraggly beard and had wild eyebrows. His eyes darted around
    the room in fear.


    “I’ve been taken prisoner,” he whispered. “Everyone is acting crazy, and I have
    just been going along with it. Please help me.”'
