    But I didn’t react at all to him since the cyborg in front of me smiled. “So,
    that’s for you,” he said. “And I assume you have my stuff on your ship.”


    “Hey, Skeletor,” he called to Francis. “You mind running and grabbing my stuff?”


    To him, we were all mind-controlled zombies who would take his orders without
    question, but unfortunately that was not the case, and I turned to look at the
    Inquisitor.


    “Jeez,” Chester said. “Your people are even more useless than mine.”


    I knew I needed to stall a bit longer, wait until Clynt had given me the word
    that he had stolen the fob and set the tracker. So, I turned to Francis.


    “Inquisitor Death,” I called. “Get his items.”


    The man didn’t move, and I just hoped more than anything that he would go along
    with me on this. There was no reason not to, but he was frozen in place, and with
    each passing second, I became worried.


    But when he turned, I breathed a sigh of relief.


    “You might need to upgrade his bots,” Chester said, the flesh half of his face
    smiling.


    At that, Francis turned. “What did you say?”


    “Fuck,” Ned said in my ear, and I had never heard him say anything of the kind
    before. But the sentiment was spot on.


    “Keep going, little zombie,” Chester said. “Or I’ll come over there and beat your
    ass so hard that you’ll be crapping nanobots for a month.”


    Francis swung his scythe out from his back and thundered, “You are an atrocity
    and must be purged.”


    Chester smiled. “It’s so crazy when their old selves come back, right?” he asked
    casually and then pulled out the energy weapon holstered at his side and fired
    it into the Inquisitor.


    Francis fell to the ground, and a silence followed.


    “At least we are making more of them, right?” Chester said and reached out to
    give my bicep a friendly pat.


    Then a scream went up from one of the Acolytes. And then another.


    “What’s this?” Chester asked just before all the Inquisitors from my side pulled
    out their weapons and charged the soldiers.


    We had come so close, but the plan blew up in my face. And next, it was a fist
    to the face.'
