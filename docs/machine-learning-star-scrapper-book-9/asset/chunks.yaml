  raw: 'After I had explained the suggestion from Ammo and the idea that I would be
    using Sophia as our documentarian, Imogen left to go pass along the news, and
    I showered, changed, and ate.


    That made me feel like a new man. Well, that, and some painkillers and Hospi-gel.


    As I left my room, Foerschler found me in the halls (or ambushed me, rather),
    but this time it was to thank me for taking his advice and then update me about
    the station. He had essentially appointed himself mayor of Suniuo Relay Station,
    but under his guidance, things were going very well.


    They had set up more facilities, imported more plants and animals for the now
    working farm within the station, and started to organize and catalogue a proper
    armory to help outfit not only the people here in case of emergency, but also
    the Peacer strike teams that Jackson was leading from the base.


    I thanked him for his hard work and dedication and then approved all the suggestions
    he had for me, even though I knew it would burn into most of the money we’d made
    from the thengar. He had earned the right to spend the money, and I believed that
    what he was doing would help all the people here.


    And as I walked through the facility, now alive with life and functioning at near
    optimal levels, it was hard not to be happy with all the people we had brought
    on and all that they were doing. There were folks from all over the universe who
    needed a place to be and wanted to be a part of something important.


    Now they had made a community here.


    And what was even more striking was that it was mostly because of me. The choices
    that I had made and the decisions along the way, some of which had felt right
    and others wrong, had led me to help found a little colony on the outskirts of
    a quiet Sector of space.


    That was a remarkable thing. I wished that I could spend more time here.


    At the Buzzard, Lara, Clynt, Imogen, and Sophia were waiting for me. The young
    ‘facer was wearing a large camera on her back and looked both excited and nervous.


    “Alek wanted to come, but I talked him out of it,” Imogen said.


    “Good,” I sighed.


    “But luckily, Sophia, here, plays Warhero too,” Lara said excitedly.


    Imogen gave me a flat look. “And there was much rejoicing,” she said in a monotone.


    “And it means I get to try my deck against the robots, which I haven’t done in
    way too long,” Lara said.


    Before I could tell her that I was happy to see her excited about this, Clynt
    cut in. “Ain’t we got a date with an Inquisitor?”


    That was all it took to get us up and moving.


    We boarded the ship, and soon enough we were in the gyre tube. Unsurprisingly,
    I fell right back to sleep while Lara and Sophia played cards and Imogen watched.
    Clynt, as usual, did his own thing, and I woke up to the indicator informing me
    that we had arrived at our destination.


    I got up and made my way to the others, letting them know that we would be landing
    soon. Ned took us in, landing at the little abandoned rest stop that we had used
    for clandestine meetings in the past.


    To my surprise, as we came in for a landing, there were four Inquisition ships
    waiting for us.


    “Be ready for anything,” I told Ned.


    As we began to drop the ramp, I turned to Sophia. “I don’t think they are going
    to want this documented, so just hang back and watch, okay?”


    She nodded without question. The girl had grown up in some of the harshest conditions
    in the universe, so she was wise about danger at least.


    I stepped from the ship, and Inquisitor Francis, in his full reaper-style regalia,
    stepped forward to meet me.


    “You brought a lot of friends,” I said, gesturing to all the ships.


    He nodded his head once. “Yes. I want to put on a convincing show for the abomination.”


    “Okay, well, let’s stay away from saying things like that,” I said. “In fact,
    you can just stand there and look intimidating, okay?”


    “I understand,” he said. “But your sneak had better put this tracker on their
    ship without getting caught.”


    He flipped me a small device, which I, in turn, handed over to Clynt. “He’s the
    best there is,” I said and watched the giant grin break out on Clynt’s snout.


    “I surely am,” he agreed.


    The Inquisitor cast a look down at him. “It had best not be due to some… modifications…”


    “Ain’t nothing unnatural up in this hide,” the thief said. “I’m good ’cause I’m
    good.”


    Francis didn’t say anything to that but looked at the other members of my party,
    though I realized that Imogen had decided to stay on the ship.


    “Did you bring us some disguises?” I asked.


    The Inquisitor’s arm shot out, beckoning for one of the Acolytes to bring forth
    some clothes for us.


    “They are not disguises,” he intoned. “They are vestments of our order and represent
    our righteous cause. We protect those who cannot protect themselves, and we are
    the last line of defense against the machine. These robes are a symbol of that,
    and you would do well to remember it.”


    “I hear you,” I said, reaching out and grabbing the pile of robes while Lara took
    the armor.


    We all turned to look at the sky as the Mortal Coil came in to land beside the
    Buzzard.


    “I’ll give it back to you after this,” I said. “We don’t want it anymore.”


    Francis made a sound of disgust from within his helmet. “It will be destroyed,”
    he said. “It now bears the taint and will be forever unclean.”


    “Great,” I said. “If I never see it again, it’ll be too soon.”


    Jackson stepped off the ship. She would call for the Peacer ships to come pick
    her up once the Inquisition vacated the scene.


    “Anything else before we all go meet this contact?” I asked.


    “Yes,” Francis said, and when he stepped forward, I almost dropped the robes to
    reach for my gun. We might have a tentative truce, but I still didn’t trust these
    people as far as I could throw them and would love to see each and every one of
    them thrown in a cell as soon as this war was over.


    “What?” I asked.


    He extended a hand. “I wanted to thank you again,” he said. “In person.”


    “Oh.”


    “Yes, it was a remarkable thing that you did,” he said, and I shook his hand,
    the robes bobbing up and down in my arms. “You did not have to inform me that
    you killed the false Hand, nor did you need to offer to return me the ship. But
    you did, and that is noble.”


    He pulled me close. “Though I still believe you have contact with the artificial.”


    I let go of his hand and took a step back. “Why don’t we leave it at, you’re welcome,
    and I appreciate the reciprocation.”


    “Very well, then,” Francis said.


    The Inquisitor led his people back to their ships, and they began to take off
    while we all made our way to the Mortal Coil and began to get dressed in the Inquisition
    garb.


    Seeing it, Imogen shook her head. “I can’t. You don’t need me for this part anyway,
    and I just don’t want to.”


    “Ballsy of her to ask you for a favor and then immediately want to sit out part
    of the mission,” Ned said to me. But I didn’t care. She was right that I didn’t
    need her and there was no reason to make her dress up as something she was trying
    to move past.


    “Fine,” I said. “You and Sophia go with Jackson on the Buzzard and Tidal to me
    the second we comm.”


    The three women nodded, and Clynt, Lara, and I boarded the Inquisition vessel.


    The thief began checking his gear while we got dressed. I had put on the Inquisitorial
    outfits before as part of a ruse, but this felt different. As Lara strapped me
    into John Gregory’s armor, it was hard not to want to just pull it off right then
    and there and never look at it again.


    The man had murdered my Uncle to get to me. He had chased me throughout the universe
    and done unspeakable things to Imogen. Putting on his armor made me sick, but
    I was happy that it was going to lead us one step closer to Twain. Hopefully.


    At the very least, it would help us to destroy his factory.


    Lara helped wrap his sword belt around me and then looked me over.


    “I hate it,” she said.'
