    “Her cabin, TR-141,” he said.


    She patted Alek on the hand and then exited the room.


    “Was it something I said?” Libby asked.


    “Yes,” Lara answered with a little smirk. “It’s always something you said.”


    Libby gasped. “How dare you?” she asked in mock offense. “That’s something you
    say to Neddy, not me! I’m not a regular AI, I’m a cool AI.”


    Ned grunted. “Can you please stop calling me that?”


    “No can do, neighborino,” Libby said. “It’s part of my charm.”


    “Is that what we would call it?” Ned asked.


    I cleared my throat. “Anyway,” I said. “What are we doing with the thengar?”


    “You won’t be surprised to learn that Foerschler has a few ideas for it,” Libby
    said. The Peacer captain had a lot of ideas for how we should be doing things
    and loved to get in my face about them whenever possible.


    “Are they good ones?” I asked.


    Libby made a hmm sound. “I think so, actually,” she answered. “He wants to sell
    part, use part for research, and then try to concoct our own off-brand Hospi-gel.”


    “Ah, so, a little bit of everything,” I said. “Tell him that I approve of his
    plan, and we should go forward with it. Also, contact the Intermediary and have
    her use her contacts to get the best price for the thengar.”


    “Will do,” Libby said, and I noticed Lara smiling up at me. She always liked when
    I would play the role of a leader and it was coming much more naturally to me
    now. At first, I hadn''t felt particularly comfortable making decisions in a pinch,
    but now I was more than happy to not only make those decisions but also to delegate
    any tasks.


    I knew that Foerschler was a smart and capable man, and if he had an idea of how
    things should run, he was probably right. But I also knew that he had an ego and
    would appreciate that I approved his plan sight unseen.


    “That reminds me,” I said. “Where is Cassiopeia?”


    “Where do you think?” Libby asked, and I knew the answer.


    Chuckling, I asked, “Edwin wastes no time, eh?”


    “No, he does not,” Libby answered. “But she’s a lost little lemon drop, isn’t
    she?”


    I didn’t know if that was how I would have described it, but she wasn’t wrong.
    “Cassiopeia has some lingering guilt about what she did in the past.”


    “Maybe if we let her beat Twain over the head with a mace, she would feel better,”
    Lara said with a little grin.


    “No way!” Libby exclaimed. “Is that what just happened? Can we please dish now?”


    Alek leaned up in his massive hospital bed. “I would be interested to hear this
    too.”


    So we filled them in. I had already assigned Ned to deciphering Gregory’s journal
    with information Imogen had provided in order to extract all the details he could.
    In the meantime, I caught Libby up with everything and Alek on what he had missed.


    ### The Journal

    “That’s what’s interesting to you?” Libby asked in astonishment. “What about the
    fact that Imogen came face-to-face with the mentor she hated and got to say her
    piece to him?”


    Alek snorted. “That’s fascinating too, but not my business unless she wishes to
    speak with me about it. What is my business is where we go from here. Where they
    were sending the thengar.”


    “Oh, boo,” Libby said. “Being all noble and shit really takes the fun out of gossiping.”


    “It’s just how I am,” he said but made sure to put a little extra hint of nobility
    on it.


    Libby made the sound of blowing raspberries.


    ### The Watson

    “And to answer your question,” Ned said. “I think that I have the location of
    the Watson.”


    I turned to look up at the speaker his voice was coming from. “Seriously?” I asked.
    “Why didn’t you say anything?”


    “Because I knew that when I did, it would derail the entire conversation, and
    you would want to spring right back into action,” he answered. “But I thought
    Libby deserved a little bit of story time.”


    “Awww, that’s so super sweet,” Libby said. “Thanks, Neddy.”


    He groaned. “Still sticking with it, huh?”


    “You’ll have to be a lot nicer than that to get me to stop,” she said, and I could
    hear the smile in her voice.


    “And while I have the information on the Watson that I think we need, I also have
    uncovered quite a bit more,” he said, and I wasn’t surprised to hear it. Nothing
    could ever be easy.


    I rubbed my face with my palms, remembering that I had to clean myself up and
    probably get my own wounds looked at.


    “In order to destroy the Watson, we will need to get to it,” he said. “And from
    everything in Gregory’s files, it looks like it’s a floating fortress in space.
    Twain keeps it surrounded by a fleet of ships, as well as having added several
    gun batteries to the craft itself. Additionally, before we destroy it, we''re
    going to have to board it.”


    “Why would we have to do that?” I asked.


    He answered immediately. “Because we now have reason to believe that it''s where
    they take kidnapped civilians to convert into Twain’s automatons. It would be
    absolutely unconscionable and in violation of universal law to destroy a ship
    without first investigating the potential for civilian casualties.”


    He was right. “So, how do we get on board? Twain knows that we have the Mortal
    Coil, so it’s not like we can just fly over there and pretend to be Gregory.”


    “No, we can’t,” Ned agreed. “Additionally, there is an encrypted code generator
    that the Disciples use to access the facility. Only someone with the specific
    generative key fob can transmit the necessary code.”


    My head dropped. “But we don’t have the requisite key fob.”


    “No, no we do not,” he said, and I just stood there feeling dejected for a moment
    before he added, “but there was a meeting planned between Gregory and someone
    else here on his schedule. I cannot decipher what this name is supposed to be,
    but it’s possible that they will have what we need.”


    “Possible isn’t particularly inspiring,” Libby said.


    Lara tilted her head. “Possible is a bounty hunter’s bread and butter,” she said.
    “We take risks, and sometimes it''s why we catch the bounty when others don’t.”


    ### The Plan

    “Do you know when and where this meeting will take place?” I asked.


    Ned answered immediately. “Yes, tomorrow,” he said, “On Bussel.”


    Lara groaned theatrically. “Oh, come on!”


    Ned burst into laughter. “I’m just kidding. It''s on some random planet in Sector
    Eight.”


    Libby said, “Amazing!” and then began laughing too.


    Lara shook her head. “Oh, good one,” she said in a mocking tone.


    “It doesn’t even matter if it wasn’t,” Libby said. “It’s just that he made a little
    joke.”


    “He actually jokes not infrequently,” I said.


    She groaned like a child being told to turn off the television. “But not when
    he’s here. Maybe I need to start going out with you guys in the field. I could
    bring Armond, and we could be the sexy sideicks.”


    “I would hardly qualify a metal cube and robot arm as ‘sexy sideicks,’” Ned said
    with a chuckle.


    “Ugh, you could put knee socks and pigtails on the cube,” Libby said.


    Something about that image got Lara right in the funny bone, and she guffawed
    like I had not heard in a long time. Seeing her laugh like that got me as well,
    and soon Alek followed.


    “You''d better all be laughing with me,” Libby said, and I'''' tell if she was
    actually hurt.


    Lara held up her hands. “I swear that we are,” she said. “I just think that after
    everything, that was exactly what I needed.”


    She wiped her tears from her cheek.


    “So,” I said, bringing us back to the matter at hand. “We go to the meeting as
    John Gregory, ambush whoever it is that he is meeting, steal the key fob, and
    then break onto the H.H. Watson.”


    Lara laughed again. “You make it sound so simple.”


    “Pretty par for the course for us,” Ned said.


    When none of us spoke, he asked, “Does golf not exist anymore?”


    “It does,” Doctor Forks answered from where he was busying himself on the far
    side of the space, and I realized that it might have been for the best for us
    to have left the room to have this conversation. “But I think that these guys
    just might not have run in the right circles… to have played.”

