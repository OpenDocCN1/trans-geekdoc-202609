    \ Roan was found dead in her cell of an apparent self-inflicted injury.”\n\nAlana\
    \ felt as though her head was going to burst off her shoulders, and when she turned\
    \ to look at Purd, he was raising a glass.\n\n![](OEBPS/image_rsrc3N5.jpg)\n\n\
    Amazon won’t always tell you about the next release. To stay updated on this series,\
    \ be sure to sign up for our spam-free email list at [jnchaney.com](https://www.jnchaney.com/star-scrapper-subscribe).\n\
    \nHank will return in [HUNTER ASCENDED](https://alsoby.me/r/amazon/B0DPW2PYQB?fc=us&ds=1),\
    \ available on Amazon.\n\n[![](OEBPS/image_rsrc3N6.jpg)](https://www.facebook.com/groups/678620228994951/)\
    \ \n\nJoin the conversation and get updates on new and upcoming releases in the\
    \ awesomely active [Facebook group](https://www.facebook.com/groups/678620228994951/),\
    \ “JN Chaney’s Renegade Readers.”\n\nThis is a hotspot where readers come together\
    \ and share their lives and interests, discuss the series, and speak directly\
    \ to J.N. Chaney and his co-authors.\n\n[Join the Facebook Group](https://www.facebook.com/groups/678620228994951/)\n\
    \n[![](OEBPS/image_rsrc3N3.jpg)](https://www.jnchaney.com/star-scrapper-subscribe)\
    \ \n\nDon’t miss out on these exclusive perks:\n\n*   Instant access to free short\
    \ stories from series like The Messenger, Starcaster, and more.\n\n*   Receive\
    \ email updates for new releases and other news.\n\n*   Get notified when we run\
    \ special deals on books and audiobooks.\n\nSo, what are you waiting for? Enter\
    \ your email address at the link below to stay in the loop.\n\n[Click Here](https://www.jnchaney.com/star-scrapper-subscribe)\n\
    \n# CONNECT WITH MATTHEW A. GOODWIN\n\n[Check out his Website](https://www.thutoworld.com)\n\
    \n[Connect on Facebook](https://www.facebook.com/ThutoWorld/)\n\n[Follow on Amazon](https://www.amazon.com/stores/Matthew-A.-Goodwin/author/B07TXWJBWX)\n\
    \n# ABOUT THE AUTHORS\n\nJ. N. Chaney is a USA Today Bestselling author and has\
    \ a Master's of Fine Arts in Creative Writing. He fancies himself quite the Super\
    \ Mario Bros. fan. When he isn’t writing or gaming, you can find him online at\
    \ [jnchaney.com](http://www.jnchaney.com/).\n\nHe migrates often, but was last\
    \ seen in Las Vegas, NV. Any sightings should be reported, as they are rare.\n\
    \n![](OEBPS/image_rsrc3N5.jpg)\n\nMatthew A. Goodwin has been writing adventures\
    \ about spaceships and dragons since he was a child. After creating his first\
    \ fantasy world at twelve years old, he continued to write in his spare time.\
    \ He spent his days as a zookeeper, but when his son was born, he decided to pursue\
    \ his lifelong dream of becoming an author.\n\nHaving always loved sweeping space\
    \ operas and gritty cyberpunk stories that explored man’s relationship to technology,\
    \ he penned the international bestselling series, A Cyberpunk Saga. His passion\
    \ also inspired him to create and cofound Cyberpunk Day ™. For more information\
    \ and FREE content, visit [thutoworld.com](https://www.thutoworld.com/)."
