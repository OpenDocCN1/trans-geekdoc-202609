  trans: '

    我在想，自从老战以来，他到底在用那东西做些什么。显然，他无法从制造商那里购买自己的`Hospi-gel`，但某种直觉告诉我，这不仅仅是为了保持士兵的健康那么简单。


    我看向墙上那个巨大的时钟，但由于我对这个星球的计时方式一无所知，那些数字对我来说毫无意义。


    因此，我换了一种方式来提问：“你们预计我们什么时候到？”


    “你们难道也没有那个信息吗？”她问道，听起来与其说是在怀疑，倒不如说是惊讶。


    我双臂交叉抱在胸前。“我只是想确保我们获得的信息是一致的。为新客户工作意味着要他们的他们的。”


    她也看了一眼时钟。“我们预计你们在 14:20 到达，”她回答道。


    “你会觉得那大约是一个小时后，”尼德替我计算道。


    这意味着如果我想执行任何计划，我们的时间就不多了了。


    “那我们要从哪里装货？”我问，“我离开飞船的地方比我该待的地方远了一点。”


    这一次，她的眉头微微向了了锁。“每一位新货运员都收到过这个信息。你确定自己在来对的地方吗？”


    “是的，”我生硬地说道，“请带我去看看交接地点。”


    我说话的语气足够权威，她心中残留的疑问似乎都消失了，她转身向其中一扇门走去，引导着我们所有人回到一条通往另一扇门的混凝土走廊。这扇门需要用密码打开，我确保在她在输入代码时将摄像头对准她的动作。


    她并没有试图掩盖她按下的按键，所以连我都能记下来。


    我们跟着她进入一个封闭的机库，远端有一个水平开口，那无疑是避开了地面的视线。在这里，板箱正在被堆叠，`treadbulls`将大批货物运进房间，而较小的`packmules`则将它们移动到某个位置，准备好装上飞船。


    从房间里望去，我在寻找武装守卫或炮塔防御或任何东西，但那里什么也没有。我想，远离宇宙其他地方以及这颗不宜宜居的星球，就是他们在这里保护自己的方式。


    那确实会让事情变得容易得多。


    “如果你不介意的话，”我说，“我们在这里等我们的飞船过来。”


    她点了点头。“没问题，不过你们不想在里面等得更舒服吗？我们可以为大家提供茶或咖啡？”


    “你可以把我的咖啡带到这里来，”我指着墙边几处避开喧闹的长凳说道。


    “你们还有什么想要的吗？”她问道，伊莫根要了茶。


    当她走开后，我转向其他人。“我们都达成共识了吗？”


    “等那些真正的货运员来了，我们就躲在空箱子里，让他们带我们去特恩号？”克林特说道。


    “我不认为我们所有人”——我用大拇指指了指`Alek`——都能溜进那些箱子里。”


    “噢，就好像你是行踪的化身似的，”伊莫根拿我开玩笑道。


    “没错，”我认同道。“我不知道在没有人的情况下，我们中是否有人能上飞船。”

    '
