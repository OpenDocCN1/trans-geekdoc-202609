- fmt: '

    “Don''t ever tell him I told you this,” I said, “but he''s the best damn thief
    I''ve ever seen, and if he says he can do something, he can.”


    The flighted attack vehicle rose over the wall, its twin mounted guns at the front
    opening fire as soon as it cleared the lip of the barrier. One of the buggies
    erupted in flames under the hail of fire.


    But as the aircraft continued to lift, it tilted unnaturally, the nose dropping
    and continuing to spray shots, but these ones crashed against the back of their
    own defense. The guards on the wall screamed and waved their hands as the bird
    continued to clatter bullets down against them.


    Clearly, the ship was tethered, and the pilots assumed they could break free by
    forcing it harder, but instead, they were just shooting their own people. The
    turbines of the triangular attack vehicle roared against whatever `Clynt` had
    used and eventually broke free, the thing getting away and streaking out into
    the air over the battle raging in front.


    “Shit,” the girl muttered, but her disappointment didn''t last long. As soon as
    it had pulled free, it had also pulled apart some of its internal machinery, and
    the bird careened down toward the ground in an instant, then blasted apart as
    soon as it slammed to the earth.


    The young woman turned to look at me in the light of the fading star in wonderment.


    “Like I said, he’s good.” I shrugged.


    We turned and rushed toward the gate.


    # 9


    ![](OEBPS/image_rsrc3N4.jpg)


    As we approached the smoldering metal, we saw that enough of the heavy gate had
    been blown apart and bent back so that we would be able to squeeze through. It
    didn''t fully blow the thing off its hinges and throw it open so that our vehicles
    could drive through in the way we might have hoped, but it was enough for us to
    start our invasion of the facility itself.


    More buggies pulled around the flaming ruins of the aircraft and crashed to a
    stop beside the door to come rushing in with us.


    There were only two guards who had been surveying the damage to the door, and
    they were caught unawares as we entered. They looked up, raising their weapons
    at the sight of us, before being gunned down by two shots from my energy weapon.


    Other guards were rushing around, getting into position, and I saw more people
    from inside the mines hurrying out and being handed guns. Very briefly, I had
    a moment of doubt about shooting at them, knowing that they were just doing their
    job, so to speak. But I got over it the second they started shooting at me.


    The girl and I ducked for cover, taking up positions behind a stack of thick shale
    that was differentiated from the rest of the surface by the fact that it appeared
    to have plant roots sticking out. I only had the briefest moment to look at it,
    but it was still striking. This company was doing everything it could to force
    these people into an untenable situation.


    Meanwhile, the people in the city above would never accept them or take them in.
    The people here, these ’facers, had what amounted to two choices: stay here and
    starve to death, or leave for some unknown world without the financial ability
    to do so.


    It was a small issue in a nothing part of the universe, but it was emblematic
    of everything that had gone wrong in the Consortium. There was no accountability,
    and people were getting hurt. Hell, I didn’t even know who the `Sectoral Governor`
    of this planet would be.


    I wondered what `Ned` would think about all this. Wondered how happy he would
    be that we were doing right by these people and trying to help them push back.


    The pile of shale beside me blasting out as it was hit with a shotgun discharge
    erased all other considerations from my mind. We weren’t helping anyone until
    we actually dealt with these defenders.


    In the moment I shifted to look out at where the miners had taken up position,
    a purple bolt struck the pile where my head had been just a moment before. Entirely
    on instinct, I pointed my weapon up at the wall where the shot had come from and
    returned fire.


    There were only a very few defenders left up there with `Lara` picking them off,
    the buggies firing up at them and their own aircraft shredding a streak in their
    defenses prior to crashing. But those that remained were fighting valiantly, and
    I couldn’t tell how many of our own people had survived, but seeing how few were
    making their way into the mine to fight, I didn’t think it was that many.


    Even if they won here today, it would be a pyrrhic victory.


    Two women holding rifles that I had repaired this afternoon, but that felt like
    a lifetime ago, slammed in beside us.


    “There are a lot of them,” one of the women said, her face streaked with dirt
    and blood.


    I peeked over the pile for just a second, seeing the miners in their positions
    behind barrels and carts and pallets. But I could see their fear, too. Some were
    determined, but most were scared and did not want to be there.


    “Aim for the guards first,” I instructed.


    Looking out again quickly, I saw that there were only a few left, maybe four.


    “And focus on anyone who you see shooting at you,” I continued. “If you see the
    muzzle flash, you’ll know where to shoot. If you don’t, you might not have to
    bother.”


    I was hypothesizing a bit, of course, but I believed what I was saying, and either
    way, taking on the trained guards first was going to be the right course of action.


    The women glanced at the girl beside me. She nodded. “Listen to him. We’ll get
    through this, and it’ll all be worth it.”


    I was impressed, once again, that this young person was able to maintain her cool.


    “Ready,” I said, then all of them turned and fired.

