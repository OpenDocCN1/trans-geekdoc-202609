    Libby 又笑了起来。“他在说你以前很穷。”


    “我们确实很穷，”Lara 说。


    “不！”查理 没没精打采地抗议道。


    “没关系的，医生，”我说，“再次感谢你帮助了阿列克。”


    他穿过房间，回到我们刚才所在的地方。“我很乐意提供帮助，”他说，我能听出他是认真的。“而且很高兴能在这里。我生命中大部分时间都在当公司的告线人，现在能做一些有意义的事情，我非常兴奋。而且斯特恩博士也是个非常容易相处的人。”


    “真的吗？”我问道，挑了挑眉毛。


    他点了点头。“噢，是的，”他兴致勃勃地说道，“他是个天才，能和他交流想法绝对是一种享受。事实上，现在已经是这样了。”


    “我听你这么说太开心了，”我说。


    “噢，”Libby 说，“我们应该在电站开始拍我们自己的真人秀！名字可以叫，比如，‘反叛者……但有正义’之类的。”


    我看到 Lara 再次露出了笑容，她看起来好像又要忍不住了。“那是我听过最烂的名字了。”


    “什么？”Libby 说，“那你想个好听的！”


    Lara 摇了摇头。“我不行，但我听得出来就知道这名字有多烂。”


    “噢，好像‘Kilara Vex’听起来很酷，”她反驳道，但这完全是在开玩笑。


    阿列克翻过身侧卧，似乎又要睡着了。“Kilara Vex 是个很酷的名字，你懂的。”


    Libby 发出了一声没必要的冗长叹息。“是很酷，但我讨厌它就是这么酷。”


    “我们能回到正题吗？”内德 问道。


    “呃，知道了，爸爸，”Libby 说。


    “你计划怎么和接头见面？”他问道，忽略了另一个 AI。“或者你打算就带着‘凡尘之躯’在地点等候，希望他们降落来见你？”


    我思考了片刻。我有约翰·格雷戈瑞的剑和盔甲，但其他东西都被烧光了。


    “也许我们可以叫援兵……”我意味深长地说，然后转过身。


    我径离开房间走向指挥中心，Lara 紧随其后。


    “审判官死亡大人，”我对 Libby 说。“或者，呃，应该是弗朗西斯审判官。”


    “噢，好的，”她说，显然对这个请求感到惊讶。


    连接通信花了一段时间时间，因为 Libby 采取了额外的措施，使用了更多的加密网络并挂载在其他系统上清除我们的数字足迹。


    在我们等待时，Lara 怀疑地看着我。“你确定吗？”


    “不确定，”我笑着承认道。“我几乎没有任何事是确定的。我们做的每一个决定都可能产生可怕的后果，但我们必须做点什么，我认为这可能就是办法。”


    “我想是吧，但叫审判庭不是我的首选建议，”她说，“甚至不是我的第十个。”


    “同意，”Libby 说，“但你知道的，他们都想让我死，所以我可能处理这个问题时带有偏见。”


    一个声音从我们身后的门传来。“你们在胡闹什么呢？”克林特 问道。


    “噢，你知道的，就在约几个审判官玩会，”在我开口之前， Libby 回答道。


    他摘下帽子走进房间。“你完全可以让我猜个打十，但这不是其中一个。”


    “约翰·格雷戈瑞明天要和特恩组织的某人见面，如果我们想从接头人那里得到我们需要的东西，必须表现得更像审判庭的人，”我说。“但既然你在这了，我确实有一个新任务交给你。”


    我解释了钥匙扣，以及我在和接头人见面时需要克林特去偷它。


    “很高兴看到你把我的技能用在正道上，而不是去杀另一个特恩的人，”克林特 说。


    “谨慎是勇气的另一部分，”内德 说道。


    我知道不该跟他争论，就让那话过去。“我想溜过去接近沃森，而再打一场枪战并没帮助。”


    “你也想让我抢一辆他们的飞船吗？”他问道。


    我摇了摇头。“不，”我说。“他们可能会向特恩汇报发生的一切，我们的身份就会暴露。他们反正要偷车辆，我觉得我们可以从车辆堆放场里弄一辆破车，说我们是偷来的，但是他们团队的一员。钥匙扣会证明我们的故事。”


    “这听起来风险很大，”Lara 说，“即使按赏金猎人的标准也是。”


    内德 笑了。“在战争期间，我们经常有这种计划。我们会进行这些疯狂的行动，并希望它们成功。”


    “成功过吗？”克林特 问道。


    那个 AI 起初没有回答。“通常情况下是。”


    “真鼓舞人心，”Lara 说。


    “一旦我们拿到了飞船，我们可以让阿姆和和平舰队切入支援，并在我们逃离并破坏他们的系统时提供协助，”我建议道。


    克林特 重新戴上帽子。“这次我不相信任何机器。我们要亲手炸了它，看着它燃烧。听懂我的吗？”


    “这不公平，”内德 说，“巴德对事业很忠诚，但特恩也在那里。如果可以的话，他会炸掉高层宿舍。”


    克林特保持着立场。“我不是说他是完美的，我是说我不成为他也能完成这件事。”

