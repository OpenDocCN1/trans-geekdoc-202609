    somehow looking like he’d just stepped out of a saloon.


    “A building,” Ned answered. “It will probably stand out from the, you know, fungus
    everywhere.”


    Clynt clicked his tongue. “Ain’t no need to be a smartass,” he said. “I were just
    asking a question.”


    Alek landed next, and then Lara followed after she had shut the door.


    I pointed in the direction of the orange cap, and we all started moving. There
    were no paths in the traditional sense, so we found ourselves jumping over obstacles
    and pushing the soft fungus out of the way.


    “Watch those,” Ned cautioned as we got too close to a cap that looked as though
    it was breathing. Gazing up from the trunk, we saw what appeared to be something
    like rows and rows of barbed teeth.


    There were others that we had to watch out for. Some with barbs along their sides,
    and others that would absorb your entire body if you found yourself pressed up
    against it.


    We kept moving and the orange cap grew closer, but it still seemed to be quite
    a ways off. Clynt was on his third song, singing terribly to himself but loud
    enough so we could hear it, and I wanted to be anywhere but his home on the range.


    Then Lara stopped, and so did the rest of us.


    She obviously saw something and now was trying to identify what it was. There
    were many little floating spores and other moving objects to draw our attention,
    but this must have been something else.


    “What did you see?” I communicated quietly.


    She didn’t answer.


    “I didn’t pick anything up on the cam,” Ned informed me. “Maybe it was just some
    kind of floater.”


    I didn’t think that was right. If Lara thought she saw something, I expected she
    probably did. But after a few more moments of waiting, we kept moving. All of
    our heads were on a swivel now.


    A few moments later, we were back to bouncing along, listening to crappy singing
    echoing among the fungus.


    Gunfire replaced the song, and we all turned to see Clynt firing his revolver.
    In front of him, a four-legged fungal beast was being blasted apart as it charged
    toward him. Its flesh, if it could so be called, was pockmarked and covered in
    blobs. With every shot, chunks of the thing would splatter off, but it didn’t
    stop coming until he had emptied both cylinders into it.


    Immediately, he began to reload with great difficulty, his gloved claws making
    it hard to get the shells out and bullets loaded.


    Then I saw why he was in such a rush. From out of a cluster of caps just off Clynt’s
    side, more of the monsters charged. They moved quickly, having no problem advancing
    with the gravity that we were still getting used to.


    I couldn’t count how many there were, but they came for all of us. Lara pulled
    out her sword, and Imogen, her mace. Both glowed with their eternal flames. I
    activated my spear just in time to swing at one of the beasts as it snarled toward
    me.


    The spear tip sliced its front legs off, causing it to crash forward on its head,
    which I impaled quickly. But as soon as I had dealt with that one, two more were
    on me. One came from the side, and I stabbed at it with Ron, but it leaped into
    the air and cleared both the spear and me in one easy movement.


    Then the other darted out from under a bouquet of mushrooms, its fanged mouth
    making straight for my leg. It was all I could do to swing the shaft of the spear
    at its head, knocking it aside, but only for a moment.


    It was back up on its feet a second later, but I used the time to bend and launch
    myself up.


    The thing sprang up after me, and I thought about Lara using the Buzzard’s arm.
    As the snarling teeth came straight for me, I dropped my spear, reached out, and
    grabbed the beast by its bubbling scruff, then spun my body as I began to return
    to the surface.


    I threw the creature into the trunk of one of the deadly caps, the skin instantly
    rippling to consume the thing by sucking it into its stalk.


    When I landed, I plucked back up my spear and surveyed the scene. Lara was making
    short work of any and all the beasts that came her way, slicing them with such
    ease that it looked like some kind of training exercise. Imogen was bringing her
    mace down on one and then another, beating the things as they got close. The glowing
    spikes of her mace popped the faces of the fungus monsters and sent them steaming
    to the surface.


    Clynt was blasting away at several while jumping from cap to cap, moving quickly,
    shooting and reloading. Once he had a rhythm going, he was able to get the upper
    hand on the creatures.


    Alek, meanwhile, seemed overwhelmed. He was usually so reliable in a fight, but
    these things seemed to have him stymied. He was swatting at them, trying to force
    them back, but they kept coming, kept nipping at him. As he tried to grab one,
    another darted out and bit at his arm. It wasn’t strong enough to puncture his
    suit, but the fact that he was surrounded and being bitten made me nervous.


    I leaped over to him, jumping right over two more who were on their way to be
    diced by Lara, and landed beside Alek, who turned to face me with a fist raised.
    Until he saw it was me.


    I brought my spear down on one of them and then pierced another in the side. They
    both burbled yelps and came for me, attracting the attention of others. I swatted
    at them and slammed my glowing tip back and forth, cutting and slicing their jowls
    but not stopping them.


    What was interesting was that Alek, seeing them come for me instead of himself,
    seemed to regain himself. He grabbed one of them by the rear leg, picked it up
    off the ground, and smashed it into another one, popping both in an explosion
    of slime.


    I continued to attack, stabbing at another one that had jumped on Alek’s back
    while the Kyrog picked another one up and simply pulled it in two, spraying some
    others on the ground with its innards.


    It was a grim sight, but it also was the thing that caused all the remaining creatures
    to flee. A call went up, and they disappeared back into the surroundings as quickly
    as they had appeared.


    Alek was panting, and I walked over to him.


    “His filter is compromised,” Ned informed me, seemingly having run some kind of
    scan on his suit.


    I relayed the information to Alek, who turned, allowing me to look at the machinery
    on his back. I couldn’t see what the damage was from the outside and knew that
    I couldn’t start taking it apart and risk anything happening to him.


    “We have to move,” I said. “And keep an eye on that information panel at your
    wrist.”


    He glanced down at it for the first time, as though he was only now realizing
    that it was even there.


    “If you see this turn yellow,” I said, pointing at the indicator, “you let me
    know, and I will try and make some kind of emergency repair. But failing that,
    let’s just get someplace that we can breathe.”


    “Agreed,” he said, and we all began to move quickly.


    We had been traveling the planet at a fine pace before, but now we were hustling,
    trying to get to whatever it was as quickly as we could.


    “Stay out in front,” Ned said, and I did as he suggested. “Keep your head up,
    and I’ll be analyzing everything that you catch on the cam so that we don’t walk
    into a trap.”


    Every now and again, I would look back, checking to make sure that Alek was still
    moving okay and attempting to get a look at his wrist. As I did, though, I noticed
    Imogen’s face. Despite her earlier claims about being happy to not care, I could
    see the panic and worry on her face.


    As much as she was watching the path ahead, she was checking to make sure that
    Alek was still moving. She was scared, and it was sweet, but it was also a reminder
    that we had to keep going as quickly as we could.'
