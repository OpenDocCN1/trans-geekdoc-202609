  trans: '


    Clynt 冲过去，跳上了杰克斯只放了一半的接接板，我也紧跟其后。我们现在能做的最好的事情就是清理出一片空间，让货运船逃脱。而且，这并非偶然，我们必须在这艘船爆炸之前离开。


    我用力撑起身体，指尖扣住跳板，然后将自己拉进了船上。我刚一上去，就感觉到脚下的跳板启动了，开始收回到 `Buzzard`（战号）中。


    当我们到达驾驶舱时，我整个人扑进了副驾驶员席。


    “你们介意我来开吗？”Ned 问道。


    我坏笑了一下：“我以为你永远不会问呢。”


    “对我来说这样更好，”杰克斯说，我们两个拉开了释放装置，我们的椅子像火箭一样冲过走廊，将我们滑进了炮舱。


    “喔吼！”当 Ned 将 `Buzzard` 重新甩出左舷并投入战斗之火时，Clynt 欢呼起来。


    我握住微型导弹炮的控制杆，开始寻找敌人。


    敌人无处不在。


    “靠近货运船，”我说道。


    Ned 咯笑道：“比你想得早得多。”


    他让 `Buzzard` 潜入那艘刚从 `H.H. Watson` 号撤离的货运船下方。当他从那艘巨大运输船的底部穿过时，一艘教派飞船正对着我们，但在杰克斯或我还没来得及开火之前，他用前主炮将其撕碎。


    Ned 操控着我们转向，朝一艘中型战斗舰滚过去。它们的大炮转向对着我们，但当脉冲射向太空时，Ned 立即侧身躲避，然后直接向它的驾驶舱发射了一串导弹。


    各处，我会针对靠近并试图破坏货运船的飞行器进行快速连轮射击，但在我能造成任何实质性伤害之前，Ned 就会带我们转向，将它们轰出太空。


    他是一个带着使命的男人。


    `Watson` 号周围的空间开始扭曲，我感觉到 Ned 启动了副推进器，因为那艘巨舰正准备进行 `Tidal`（潮汐驱动）。


    Clynt 在通讯器里用断断续续的低声说道：“我们要开始了。”


    在最后一个词落下，在它消失进涡流管之前，那艘被特恩用来实验并创造出他那些恐怖僵尸的飞船由于燃料点燃而开始爆炸。接着是氧气。转瞬之间，整艘船被彻底撕碎了。


    唯一的问题是，当 `Watson` 号被摧毁时，那些一直防御它的飞船立即转而对准货运船。而且，黄提督认为他们已经完成了目标，指挥着“正义之靴”（Boot of
    Justice）号潮汐驱动离开。


    战斗变得变得不公平了。


    “Ned，从仙后座（Cassiopeia）有消息吗？”我问道。


    他立刻回答道：“`Tidal Drive` 几乎准备就绪。”


    我转过身体，对一艘紧追我身后的麻雀级敌舰开火。“几乎准备就绪太模糊了，”我说，看到另外三艘船呈密集的队列向我们袭来。


    杰克斯和我我都向那三艘追击者发射了数轮，但他们轻而易举地躲过了子弹并回击。Ned 避开了其中一波流，但有几枚导弹在我们的护盾上爆炸，产生了华丽的火花。


    “尽量别把我们害死，”我说，但他不需要反驳。当他翻转飞船时，我意识到另一波导弹撞上了货运船，Ned 利用我们的护盾阻挡了更多针对该民用船的攻击。


    接着，我余光中看到一艘闪烁着红光的黑船正向我冲来。


    “是‘凡尘躯’（The Mortal Coil）吗？”我惊讶地问道。


    但在我还没来得及意识到它竟然回到了战斗中，它就开始开火了。冲着我。


    Ned 带我们躲过了几次攻击，但另一些攻击削弱了我们剩余的护盾。


    “看起来你的新哥们儿切斯特给自己‘借’了一艘船，”Ned 说，我不知道哪种更糟：敌方指挥征用了那艘审判者号，还是弗朗西斯本人夺取了它。我不得不想无论哪种情况对我来说都不妙。


    但那艘凤凰级飞船正准备进行另一轮攻击，我能看出它正冲回来再次进攻。


    Ned 带我们躲过了几次攻击，但另一些攻击削弱了我们剩余的护盾。


    “看起来你的新哥们儿切斯特给自己‘借’了一艘船，”Ned 说，我不知道哪种更糟：敌方指挥征用了那艘审判者号，还是弗朗西斯本人夺取了它。我不得不想无论哪种情况对我来说都不妙。


