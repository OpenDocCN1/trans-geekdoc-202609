    # 相遇


    尘土正在散去，我看着独轮车上那群穿着单薄破旧衣服的人正互相打量着，试图评估该怎么办。


    “我们这片地区从来没有过猎人，”其中一个人终于开口了，“我们怎么知道你说的是真话？”


    我缓慢地将我的`stomper`回入鞘，开始向口袋摸去。“我给你们看徽章。”


    “行吧，”另一名枪手说道，他们看着我把徽章掏出来。


    这一次，他们面面相色地点了点头，于是我问：“你们愿意带我们去你们的家吗？”


    “我们可以去，”司机用严肃的声音说道，“但你必须交出所有的武器。”


    ## 5


    ![](img/image_rsrc3N4.jpg)


    “老子绝对放弃我的转轮枪，”克林特（Clynt）低声说道。


    但我忽略了他。“没问题，”我大声说道，我知道我们没多少选择。我们要么利用这个机会尝试回到这些人来的地方，要么冒着他们追踪我们的脚迹回到 `Buzzard`
    号并把我们留在这里等死的风险。我不知道这个星球的夜晚是什么样子的，但我猜那并不愉快。


    所以，我先走了一步。我掏出 `stomper` 和能量武器递给他们，希望他们不要注意到我腰间的长矛，因为矛杆此时是收缩状态。


    拉拉（Lara）拔出她鞘里的剑，从背上背起步枪，克林特则递了一把武器。其中一个枪手下车，拿着一条毯子走过来，用来包裹了我们所有的货物，然后回到了车。他刚一离开，司机就启动了引擎，他们全都欢呼叫了起来。


    但他们才才开了大约一米，三声尖锐的枪响就刺破了空气，那是克林特的 `revolver` 发射的声音。独轮车又滚了一小段，然后就顺着山坡滑了回去。


    “如果你一开始就听我的，我们就不用得走那么远的路去那里重新收集我们的东西了，”他说道。


    “但那样我们只会杀掉一些仅仅倒霉遇到我们、并无辜的人，”伊莫根（Imogen）用迷迷的声音说道。她显然在某个时候醒了，然后目睹了局势的发展。


    克林特耸了耸肩。“他们反正也是得死。”


    “但现在他们死是有理由的，”我说着并朝伊莫根走过去。“你感觉怎么样？”


    她抬头看向我。“我猜我们是坠毁了？”


    “是的，”我肯定道。“我们需要尝试找一些零件让 `Buzzard` 重新运转。”


    “它怎么了？”她问，眼睛闪烁着。


    `EMP` 导致系统短路并烧坏了电池线圈，”我告诉她。


    阿克（Alek）歪头看着我。“你知道那是怎么回事吗？”


    “是废品工永远是废品工，”我以此作为回答。“而且，线圈在烧毁时会发出一种非常特定的滋滋声。”


    拉拉笑了。“真是个辞藻大师。”


    “现在的计划是什么？”伊莫根问，闭着眼睛。


    我瞥了一眼落下的恒星，又看了看独轮车。“我们上那辆车，尝试寻找文明。”


    大家都看着它，然后目光都转向了阿克。


    “你说得对，”他看穿了每个人的心思，“我坐不下那东西。”


    “你可以直接带我回船上睡觉，”伊莫根建议道。


    拉拉看向天空中的橙色球。“很快就要黑了。”


    阿克发出一声低沉的闷笑。“你们以为我长这么多只眼睛是白长的吗？而且在你们告诉我回船上需要很长时间之前，记住这一点：你们从未见过我全速奔跑，坦率说，我为了跟上你们总是得慢慢速度。”


    这就是我需要听的全部。“去吧，”我说。“保护好船……也许可以花时间教教伊莫根 `Warhero`。”


    “等等，什么？”她虚弱地皱起眉头。“不，我可以走路。我很好。”


    “外面小心，”拉拉说道，阿克转身朝我们来时的路跑了回去。


    “一开始就可以把他们留下的，”克林特说。“省得我们闹这一出戏。”


    我没有对此说话，而是选择重新装好装备，清理了独轮车并出发。并不是我知道我要去哪儿，但至少我们现在移动得快多了。我一直开着，并没有像预想中那样频繁减速，因为当恒星的光芒消失时，它被附近几颗卫星的反射光所取代。


    随着我穿过无尽的灌木丛，温度下降了，很快刺骨的寒冷就拍打在我们脸上。每隔一会儿我都会抬头看看我们上方的城市，感觉它既近又远。


    克林特突然大喊着什么，我的目光移回地面，看到远处有些灯光。我考虑了下一步的行动方案，但日益严寒的冷空气帮我做出了决定，我开车进入了营地。当我们靠近时，一个男人和一个女人拿着看起来一开火就会爆炸或直接崩解成铁锈的武器朝了过来。

