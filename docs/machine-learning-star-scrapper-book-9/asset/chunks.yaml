    她把手掌贴在我的脸上，俏皮地将我推向那堆皮草。“好了，你已经表达过你的观点了。我只是希望有时候事情能变得再直白一点。”


    我又喝了一口咖啡渣。“在现在这个阶段，我总是预料到一切事都会变得复杂得令人痛苦。”


    “但至少我们已经把 `Chaz` 关起来了，”她说道，“所以等我们离开这颗星球，就可以开始对付 `Twain` 了。”


    “没错，”我说，“我准备好要向他发起战斗了，也许在在此期间，我还能顺便解决掉那个让我们陷入瘫痪状态的家伙。”


    她她重新躺下，把头靠在我的二头肌上。“我们真的有很多人想杀我们，”她带着微笑着说道，“如果你在我们小时候告诉我，来自 `Bussel` 的那个小 `Hank
    Spears` 会成为宇宙中最受通缉的人之一，我肯定会大笑把你轰出房间的。”


    “你我都是如此，”我赞同道，“等这一切结束后，希望我能变回宇宙中最最不被人遗忘的人之一。”


    这引发了她的笑声。“我很确定，如果我们办成了这件事，你的名字会和 `Captain William West` 并列——他可是五场大战的英雄，`Starblaster`
    号的飞行员。”


    我轻声笑了一下，但随即沉了下来。“我很担心 `Ned`。他还没有上线。”


    “噢，他上次花了过了两百多年的时间，所以对他宽容点吧，”她说道，“他很快就会回到我们身边的。”


    “我希望如此，”我说，“我们已经走了这么远，不该就此结束的。而且他只是一个立方体，这更让人奇怪了。如果是人的话，很容易判断他们死活，但是——”


    她没有让我说完。“那么，`John Gregory` 又是什么？”


    我长长叹了一口气。“好吧，除了偶尔会被我推测是纳米技术复活的尸体外，判断一个人的死活其实很容易。但 `Ned` 的立方体处于离线状态，可能只是他在花时间重启，也可能是他坏了，又可能是他彻底离开了。”


    “那可就太糟糕了，”她轻声说道。


    “什么？”


    “如果 `Ned` 就是这样没掉的话，”她说道，语气比我感到不安的程度要自然一些。“如果我们遇到了他的对手，然后过了一会儿他就因为一次 `EMP` 永久地离线了。没有什么诗意，没有英雄主义色彩，只是我们故事中一场无聊而悲剧的损失。”


    我能看出来她只是在随口而出，但这个念头让我胃里翻江倒海。“不可能是那。他可能是一个立方体里的计算机程序，但他也是整个宇宙中与我关系最近的人之一。”


    “噢，我知道，”她听出了我对此的认真，“我只是……”


    “没错，”我说。“但意识到你最好的朋友之一是一行代码，这种感觉真的很诡异。”


    她伸手把一只手放在我的脸颊上，然后拉过我的脸看向她。“他会没事的，`Hank`。他的故事远没有结束。”

