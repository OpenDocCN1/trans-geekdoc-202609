  trans: '

    “你打算让多少能量武器被毁？”内德问道，“你知道，这些东西可是花钱的。”


    “现在不是时候，”我咬着牙说道，身体在另一侧与罗恩一起挥矛刺击。审判官预见到了这次攻击的来袭，并用快速的一记挥砍挡住了这一击。由于我正倒在地上，武器碰撞产生的火花溅在我身上，在我的脸上烧出了一块一块的小点。


    我转过身体，左腿向上踢起，击中了他的侧面。这并没有起多大作用，只是迫使他向侧移动了一步。


    还没来得及做出下一个动作时，我感到侧腹传来一阵剧痛。我掉掉了手中的手枪，用手指按住肋骨处盔甲的一处缝隙，同时又心不在焉地挥动着长矛。


    我必须站起来。


    但我余角余也看到了手套上闪过血迹的光。


    我是怎么受伤的？


    然后我想起了维克拉斯人（Vekrass）。


    当这名审判官正向我逼近时，另一个正从所谓的阴影中发动进攻。


    我再次用矛刺去，但这次，审判官抓住了尖端下方的矛柄并用力拉。


    他没能从我手中夺走武器，但他迫使我不得不用双手抓住它。


    侧腹再次传来一阵疼痛。


    我环顾四周，看看能否发现攻击者。但就在那短暂的瞬间，上方的审判官也挥剑向我袭来。我翻滚躲避，剑在护肩上发出滋滋声。接着他用刀刃猛地劈砍，我缩了缩，但头侧还是被削掉了一块头发。


    我踢出一脚扫过他的腿，力道足以将他绊倒。


    就在他倒下的同时，我也站了了起来，这一次我恰好捕捉到了一道残影，意识到那是一把正朝我飞而来的掷刀。


    我俯身躲开，感觉自己简直又要把这“新发型”修齐了。但当我看向我认为刀子飞来的方向时，却什么也没看到。


    身边的审判官正站起来，于是我向他刺去，在他格挡我的攻击时将他逼回了地面。我试图再次刺刺，但另一把刀嗖地朝我飞来，击中了我的胸甲，甚至还崩掉了一块碎片。


    我不禁再次寻找攻击者，但又是一无所获。


    这群维克拉斯人真的开始让我发火了。


    也许是我的耐心耗尽了，又是因为我准备好转移注意力，但我意识到现在可以结束战斗了。我伸手越过胯部，左手抓住了腰间的重击器（stomper），对着地上的审判官倾泻了几轮弹。


    “主意不错，印迪，”内德说道，但我已经将注意力转向了维克拉斯人所在的位置。或者至少是我认为他在的地方。


    瞥向另一侧，我看到阿列克倒在地上，不知道他是否无事。我的大脑飞速运转，试图决定该做什么，但由于自己不知道那个掷刀手在哪里，于是我决定向朋友的方向冲去。


    接下来击中我大腿的刀刃让我踉跄了一下，跌倒在了克罗格（Kyrog）身上。但当我倒下时，我感觉到了那个。

