- fmt: '

    “Then I guess it means it''s working,” I said and made my way to the cockpit.
    I would put on the helmet when we arrived but didn’t want to until absolutely
    necessary.


    We took off and Tidaled to the next meeting place, which was, intentionally, very
    close to where we were now.


    The planet noted in the journal was a little nothing pasture planet that had been
    terraformed to grow barley on. It was one of many in the area, and I had to suspect
    that Twain knew that people didn’t check up on them very often. The beer company
    likely had a station in the region and would dispatch farming engineers to operate
    the equipment on the surfaces of the planets when necessary but would otherwise
    leave them alone.


    And if his people were caught having a meeting, I was sure they would just kill
    whoever it was that caught them, and when the beer company would discover the
    body, they would pay off the family. I had no proof that this is what would happen,
    but given the fact that Twain had been operating in secret for two hundred years,
    I was pretty sure the hypothesis was correct.


    We landed in a freshly planted field beside the other Inquisition ships, which
    were facing half a dozen Cultist ships. Some were stolen and retooled, others
    were recently built, and some appeared to be from the Old War. The two that looked
    that way drew my attention, and the old scrapper in me came out.


    I remembered once when Lutch found a ship that he thought was a Cultist craft
    from the Old World. He nearly ran across the lot, throwing other pieces of scrap
    all over the place to reach it. He dug, and I just watched until he got there.
    Then he snorted and stomped one of his massive feet. Within a second of looking
    at it, he knew it was a replica.


    “That would have been really interesting,” he had said. “To see something from
    the other side. The Inquisition is said to have destroyed it all, but I have to
    think some are out there, and how neat would it be to study what they did. To
    see what a computer would do differently from us.”


    “Yeah,” I had agreed. “Sounds cool.”


    I hadn’t thought much of it at the time, and we had simply gone about our day
    after that, but now that there were two sitting just in front of me, I wanted
    to go check them out. Rather than doing something fun like that, I walked across
    the field, my feet sinking into the soft soil. The helmet made it difficult to
    see, and due to the ornate metal, it was heavier than I was used to. Lara stood
    beside me, equally menacing in her own Inquisitorial clothes.


    As we stepped out, I saw Francis exit his ship and begin to make his way toward
    us with a few of his people. And across from us, a man stepped out of the peregrine-class
    medium ship. He was flanked by several soldiers, but the man himself was an imposing
    figure, and one that the real John Gregory would have hated with a passion.


    He wore only cargo pants from the waist down that were tucked into heavy boots,
    but no shirt. His bare chest was only half skin, and the other half was metal.
    The augments ran from his chest up half his neck and across his face. The dichotomy
    was striking, and I tried my best not to stare before realizing that he couldn’t
    see my eyes through the mesh in the mask.


    “You Gregory?” the man asked as he stomped toward me, muscle and metal shining
    in the light.


    “Yes,” I said in my best John Gregory impression.


    He kept coming right at me at a quick clip, and everything in me wanted to reach
    for the sword at my side.


    When he got right in front of me, the man quickened his pace, closed the distance,
    and then gave me a hug. “It’s good to finally meet you,” he said, loosening his
    grip and then taking a step back.


    “Yes,” I said. “I’m sure it is an honor to meet me. I am happy to put a face to
    the name.”


    “Right!” he said. “I agree. And obviously, I’m Chester.”


    He sounded like he should be at the beach rather than helping an AI hatch an evil
    scheme, but I supposed that not all bad guys had to act like what they were.


    “You have the stuff for me?” he asked, looking over my shoulder. “And I see you
    still have a lot of friends.”


    “I do,” I said. “They are part of what makes us believable.”


    The man nodded. “Right. Have to sell it, or the people might start to get wise.”


    “Precisely,” I said. “And we wouldn’t want that.”


    “No, we would not,” he said, looking over his shoulder as though he saw something,
    and I wondered if his one mechanical eye had picked up on Clynt. Though I hadn’t
    seen anything. “If people start to smell something, we won’t be able to pull this
    off.”


    I wanted to ask more than anything what he meant, what he wanted to pull off,
    but I didn’t. Instead, I asked, “And you have what I need.”


    “Of course,” he said, then he turned and whistled at one of his soldiers, who
    hurried up into a ship. We waited for the soldier to return with a box. He set
    it down beside Chester, and the half-metal man looked at him for a moment.


    Then, with startling speed, he reached out with his metal arm and grabbed the
    soldier by the cuff of his shirt. Then he slapped him across the face and let
    him fall to the earth, dirt covering half his body.


    “You should have had this ready for me!” He growled with such loathing and disgust
    in his words that I was surprised he didn’t spit.


    “I’m sorry, sir,” the soldier sputtered, crawling away.


    But Chester stepped over to him and then kicked him on his ass, sending him back
    into the dirt.


    “I’m so sorry that you had to wait,” Chester said, turning back to me. “I don’t
    understand why people can’t just do their job when they are supposed to, you know?”


    He had gone from so cruel to so casual in so short a time that it made my head
    spin.


    “Good help is hard to come by,” I said. “That is why we must train them. We must
    teach them. We must punish them.”


    Ned chuckled in my ear. “Now, that was a good John Gregory.”


    But I didn’t react at all to him since the cyborg in front of me smiled. “So,
    that’s for you,” he said. “And I assume you have my stuff on your ship.”


    “Hey, Skeletor,” he called to Francis. “You mind running and grabbing my stuff?”


    To him, we were all mind-controlled zombies who would take his orders without
    question, but unfortunately that was not the case, and I turned to the Inquisitor.

