- fmt: '

    Lara started guiding them toward the Ports, ushering as many as she could to follow
    her but also to keep them from gawking and yelling at the others.


    Meanwhile, I tried to get everyone to calm down, but my encouragement did nothing
    to help. They were panicking and just had to get off the ship.


    “Hey, freeze,” I heard a voice shout from the far side of the escalator room,
    and I saw two `Disciples` come rushing out, guns up.


    The last thing I needed was exactly what happened.


    One of the two `Disciples` fired into the crowd of people trying to flee.


    This caused the others to run or jump or scream, and the scene went from a mess
    to a chaotic and deadly disaster. Or it would have if not for `Imogen` and `Sophia`
    who began walking up the escalators to help.


    Something about them helped to calm folks while I dealt with the two attackers.
    The first got a bolt to the chest, but when I lined up a shot on the second, she
    cartwheeled out of the way and dropped into the splits.


    “What the hell is this now?” Ned asked in my ear, but a moment later, the contortionist
    opened fire on me with two semi-automatic handguns.


    I ran away from the crowd and ducked behind a garbage can, knowing that my armor
    had taken a few bullets. The garbage can was shredded by the hail of gunfire,
    but at least I had drawn it away from the people who were almost off the stairs.


    When the gunfire ceased, I stole a quick glance out from where I was hiding, keeping
    my weapon ready for any movement. Again, the girl with the guns was cartwheeling
    in front of me, and I lined up a shot as quickly as I could, but before I could
    squeeze the trigger even once, her arm was up and unloading more shots in my direction.


    These upgraded soldiers that `Twain` had created were so fast that it hardly made
    it possible to fight back. It made sense that a `Consortium` of old needed to
    pair their soldiers with artificial intelligences so that they could even just
    survive.


    “Ned, got any ideas for me?” I asked as pieces of the garbage can crumbled.


    “Shoot her,” he said. I don''t know if that was any kind of advice. But when I
    didn''t move, he shouted in what sounded like an English accent, “Shoot her!”


    So the moment her gunfire stopped, I popped out as little as I could but as much
    as I had to in order to, you know, shoot her.


    I fired off a few bolts as she danced and pranced from side to side, but one of
    the bolts winged her, and as she reacted, for just that brief second, I shot again.


    The second bolt stopped her, the purple beam disappearing into her flesh and dropping
    her dead.


    I turned back to see the last of the civilians disappear down the hallway, but
    `Sophia` was standing with her camera at the bottom of the escalator.


    When I ran up beside her, I saw what she was staring at. There was a person at
    the bottom of the staircase who had been trampled in the commotion. They lay there
    lifeless, and the young woman just gawked at what she was seeing. She was a survivor
    and had undoubtedly seen and done hard things throughout her life to stay alive,
    but obviously there was something about the senseless brutality of this that had
    frozen her.


    “We need to get going,” I said.


    She looked up at me as though she didn''t even know who I was for a moment and
    then blinked once and nodded. “Let''s go.”


    But she didn''t move.


    `Cassiopeia` chirped in my ear. “Coming in hot,” she informed me.


    “We got your back,” `Ammo` added, and I stole one more look up out of the large
    window to see the cargo ship moving quickly through space as it and the `Boot
    of Justice` came under fire. Smaller crafts were dogfighting all around, and this
    battle was going to be close.


    One more chime. “Four minutes until Tidal departure.”


    30


    ![](OEBPS/image_rsrc3N4.jpg)


    Once I got her moving, `Sophia` continued to film as we exited the area and continued
    down the hallway to all the Port doors.


    “Port Cyan,” Ned informed me, and I saw that `Lara` must have gotten the same
    message as she was hurrying people through the door to the designated port.


    The people were streaking away from me and `Sophia`, but then I heard a sound
    behind me and turned just in time to watch several more `Disciples` appear at
    the end of the hallway. I ducked inside the frame of one of the massive port doors
    and squeezed off a few shots to stop the soldiers from coming.

