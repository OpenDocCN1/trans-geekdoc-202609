    她苦涩地笑了。“我没法形容得更到位了。事实确实是这样。这里发现的一种矿物被用于制造 `Tidal Drive` 燃料的工艺。它不是主要成分或之类的，但我猜它对精炼过程很重要，而且在宇宙中并不常见。于是公司就过来了，并开始在表面到处建立矿场。”


    “然后就把当地人赶走了？”我问道。


    她左右晃了晃手。“既是这样，也不是。起初，他们试图表现得很友好并为人们提供工作，但没多久他们就对我们反目了。那些拒绝搬迁或接受矿场工作的人就成了敌人。”


    这个故事听起来已经太熟悉了。


    “但公司当然不能直接攻击原住民，”她继续说道，“所以，他们采取了次优的办法——派遣大量的猎人和采集者出去，剥夺这片已经荒芜的土地上的食物和材料。他们的卡车轰隆隆地向前进，尽情地吸干地下井里的水水。很快，那里就几乎什么都不剩了。”


    “得考虑一下当地人知道哪里能找到更多，”Clynt 插话道。


    年轻女子缓慢地点头，忧心地揉着她辫子末端的一个，随后意识到自己在这么做，于是把手收回身体两侧。“他们知道，但公司也雇佣了一些当地人来透露他们的秘密。无论如何，他们似乎并不真的想让大家都饿死。相反，不同的当地部落之间爆发了战争。长久的友谊甚至祖先家族互相残杀。因为归根结底，为了能喂饱饥饿的孩子，人们会做任何事情，背叛任何人。”


    我们都神情凝重地点了点头。


    “所以，爆发了大规模战斗，”她解释道。“但公司并没有罢手。还没有。他们支持较小的部落，给他们武器和资源。”


    我知道这可能有一个充分的理由，但我没想通。“为什么不直接支持大部落，让他们把大家都消灭掉呢？”


    “因为那样最后只会剩下一个强大的集团来对付，”Lara 语气深思地说道。


    “是的，没错。”年轻女子点点头。“通过资助较小的部落，他们能够削弱每一个人。尽管大部落最终获了胜，但他们的人数被削减到几乎无人无几。然后，情况变得更糟了。随着资源继续变得稀缺，一个人决定带领所有幸存者反抗公司。”


    Lara 用肩膀碰了碰我。“听起来像你。”


    “但那是一个巨大的错误，”女孩说道，声音中充满忧郁。“一旦统一的部落开始攻击公司，他们就进行了武力报复。他们宣布我们是恐怖分子并进行反击。显然，`Consortium`
    不允许他们猎杀我们或类似的事情，但他们被允许保护自己的利益。而且他们非常激进地保护这些利益。现在，只剩下我们一些试图生存的群体，那些乐于偷自己同胞东西的其他部落，还有所谓的恐怖分子。”


    “我明白这里是你们的祖先家园之类的，”Clynt 说道，“但为什么不离开这块石头呢？外面有这么多行星可以让你们安家。”


    “即使我们想走，”她回答道，“我们也去不了。我们中没有人有钱离开，即使公司帮我们走，我们也不该受这种待遇。”


    “妈的你不该，但宇宙不是那样运作的，”Clynt 说道。“有时候你必须做个决定，因为那能保你的命。机会只有一次。我不明白你为什么要浪费生命在啃食泥土和每天为了生存而战斗上。做最艰难的事，离开这个鬼地方。你会变得快乐的。”


    Lara 向前迈了一小步。“Clynt，我们是这这里的客人。也许我们不应该自作聪明地教他们如何生活？”


    “或者也许我正是他们需要的，”他说道。“大干一场，也许，仅仅也许，你们就能过上更好的生活。你还很年轻，我不明白你为什么要选择一种只有痛苦的生活。”


    Lara 再次张口想要反对，但年轻女子举起了一只手。“我不介意，”她说，“我不明白你为什么要选择一种只有痛苦的生活。”

