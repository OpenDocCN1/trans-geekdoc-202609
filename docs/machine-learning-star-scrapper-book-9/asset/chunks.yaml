    “You are truly a testament to your species,” Alek said, grabbing the box.


    The lights flickered again.


    “Excuse me—Dudimal, was it?” Imogen said. “Do you think we could use your back
    room for a moment?”


    “You got it, girl dude,” he said, and we all hurried into the back. Once we were
    there, Lara closed the curtain behind us.


    After a quick glance around for cameras or any other people, I produced the cube
    while Alek turned the mechanism and opened one side of the box. When he did, I
    saw just how thick the walls were and heard a hum coming from within. I jammed
    the cube in, and as quickly as he had opened it, the Kyrog had it closed.


    “I didn''t let him transmit it, but Chaz wanted to inform you all that you will,
    and I quote, live to regret this,” Ned informed me. But I didn''t even have time
    to let out a sigh of relief before I heard heavy footsteps entering the shop on
    the other side of the curtain.


    “Howard,” a stern voice said.


    “Aww, dude, you know that’s not what I go by,” Dudimal said.


    The other voice hardly even let him finish. “I will call you by the name our mother
    gave you.”


    “Okay, then I’m not going to call you by yours,” Dudimal said, sounding like a
    petulant child. “I anoint you Sir Butt-N-Stuff.”


    Dudimal’s brother sighed. “Howard,” he said. “I’m only here because I got a report
    of some sketchy characters entering your establishment. I have to assume they''re
    in the back room?”


    At that, we all glanced around, trying to see if there was some secret passage
    out or hidden panic room or something. Of course, there wasn''t. It was little
    more than a back room poorly hidden by a curtain.


    Clynt pulled out his revolvers, but Imogen shook her head no. “We can''t just
    kill some local guard for investigating us,” she admonished in a whisper.


    “She''s right,” Lara said. “I can just subdue him.”


    She pulled out her stun gun and readied it.


    “You can’t go back there,” Dudimal said. “The fate of the universe is at stake.”


    His brother sighed again, even more theatrically this time. “Howard, when are
    you gonna grow up?”


    “Excuse me, bro, I''m a small-business man,” Dudimal corrected. “Not a small man
    who runs a business though. But like a man who runs a small business. And you
    getting some pin-on badge from the Consortium doesn''t make you any more of a
    grown up than me.”


    “You’re not a small-business man,” his brother said. “You''re a fence and a two-bit
    black-market dealer. That doesn''t make you anything more than⁠—”


    But he didn’t have time to finish.


    Instead, Lara stepped out from the room and then fired her stun gun. The dart
    hit Dudimal’s prefect brother in the neck and sent him collapsing onto the table
    behind him, assorted goods clattering every which way. The shopkeeper shrieked
    and ran to his brother''s side while we left.


    “Sorry,” Lara said. “I just couldn’t listen to that shit for a moment longer,
    and he was going to come into the back room in a moment anyway, so I just skipped
    ahead.”


    “I like the way you think,” Imogen praised.


    Clynt grunted. “Still leavin’ a trail though.”


    I looked down at Clynt. “We leave a trail wherever we go.”


    “Not me,” he corrected as we hurried from the little shop and out into the plaza,
    nearly breaking into a run to get back to our ship. Luckily, the prefect had been
    alone, and no alarms had been triggered, so we were able to return to our ship
    without incident, take off, and leave the city a moment later.


    But we had only flown out of the docking bay for a moment when a ship appeared
    from under some heavy cloak, the likes of which I had never seen, and then fired
    a single shot at us. Given that we were about to Tidal away, our shields hadn''t
    been active, and even with Ned''s instantaneous reflexes, they didn''t encase
    us quickly enough.


    The EMP detonated.


    4


    ![](OEBPS/image_rsrc3N4.jpg)


    Falling to the surface of a planet pulled by gravity without any onboard systems
    is one of the most harrowing experiences a person can have.


    One star. Do not recommend.


    Of course, Lutch had added adjustments for just this very thing. My adoptive father
    had always said that putting one''s full faith in something that was absolutely
    out of their control was a recipe for disaster. He was an “if you want it done
    right, you have to do it yourself” type, and it showed in all things.


    As a result, there were emergency systems in place for just this kind of moment.


    As everyone gripped their seats, gritted their teeth, and clenched to just about
    everything that they could, I tried to calm myself despite the fact that my body
    was shrieking in the abject terror of falling to my almost certain doom.


    The Buzzard rattled and shook violently, anything that I hadn''t soldered down,
    and even a few things that I had, flying loose and hurtling throughout the ship.


    I pulled the emergency systems lever and heard gears shift within the bowels of
    the ship. The others watched as the flames licked up around us. As we continued
    our terrifying descent, I yanked on another, opening small ports on the outside
    of the ship and dousing us in retardants.


    Then I unstrapped, hearing shouts and cries from everybody around me but knowing
    that I had to do it. With all my might, I braced myself against anything I could
    grab and hold, the momentum of the ship trying to force my body to go hurtling
    through the cabin.


    But I white-knuckled as hard as I could, forcing my body against physics.


    The others continued to shout inaudible or incomprehensible things as I ignored
    them, making my way from the cockpit and toward the stern of the Buzzard. Since
    there was hardly anything in the cargo space, we were plummeting nose-first toward
    the surface.


    Despite the strong magnets used to hold them in place, several of the dishes and
    plates had gone flying through the common space and were now pressed against the
    wall like some abstract art installation. I heaved myself through the room and
    down into the cargo hold, blinking into the darkness. There were no portholes
    here, and without any electricity, it was absolutely pitch black.


    But I knew where I was going. And, as I so often did, I thanked Lutch for all
    that he had taught me.


    “Ugh,” teenage me had groaned. “What’s even the point of this?”


    “To be ready,” Lutch answered, folding his massive Kyrogi arms across his chest.
    “You never know what''s going to happen.”


    I stared into the darkness at the back of the Buzzard. “Have you ever been in
    a starship when it loses power?” I demanded.


    He chuckled. “That I have,” he answered, and I wasn''t entirely sure he was telling
    the truth. “And I just want you to be ready for whatever might come your way.
    A lot can happen once you start actually working out in space, and even though
    we do it all the time and take it for granted, it''s deadly serious.”


    I rolled my eyes dramatically, making it abundantly clear to him how idiotic I
    thought this was. Then, as instructed, I began making my way through the ship
    and groping in darkness through the cargo hold. I heard a clink and a clank and
    turned my head to try and identify where the sound was coming from.


    “Dad, I swear to everything that if you startle me, I’ll…” But I couldn’t come
    up with anything in time.'
