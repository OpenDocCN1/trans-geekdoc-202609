  trans: '

    这可能不是我听过最激昂的演说，但村民们被触动了，开始欢呼、奔跑并举起武器。甚至有人向空中开了几枪，我不确定他们是不小心走了火还是故意的为之，但每个人似乎因此变得更加兴奋了。


    很快，我们制定好了计划，大家都乘着村民的吉普车朝矿井出发了。我和领袖坐在一起，真后悔没有问问她的名字。拉拉（Lara）坐在一辆从公司偷来并被村民回收利用的货车里，而克林特（Clynt）则坐在一个年轻猎人的摩托车后座上，那个人人愿承担最危险的任务。


    “谢谢你们了，”她在引擎的轰鸣声和呼啸的风声中大喊道，“你们将改变我们的生活。”


    她并没有看我，而是盯着前方那段破败的路。但我能听出她喊出的话中的真诚。


    我并不想落到这种地步，我知道整个局面的表面远比我能理解的要复杂得多，但能帮助这些人，我感到很高兴。


    当我们继续前进时，她偷偷看了我一眼。“你经常做这种事吗？”


    我在想，她是指在在这种情况下帮助像他们这样的人，还是更具体指在火力完全处于劣势的情况下试图攻破敌方堡垒。无论哪种，答案都是：“是的。”


    即使在颠颠簸簸中行进，她点了点头，我不禁好奇她心里在想什么。尽管她很年轻，但似乎很有主见，她的族人也很尊重她。


    我无法想象在她的年纪拥有那种力量是什么种感觉。当我那么年轻时，我做出的最艰难的决定就是如果卢特奇（Lutch）让我选晚餐，该吃什么。而与此同时，这位年轻女性正在决定一整个部落的人的命运。她所做出的选择影响了许多人。


    我想现在对我也是如此……但我比她老得多，而且从理论上来说，更理智。


    我们骑了很久，她才开始减速，所有车辆都就到位了。


    时机决定一切。


    当旁边的汽车停下时，拉拉跳下车，迅速在一个小土丘的顶端就了位置。


    我们在山下怠速，其他人也是如此，等待着时机的到来。


    她步枪的点射声在静静的大地上回荡，紧接着是轮胎挤压地面的声音引擎轰鸣声。


    我们全部冲过小土丘的边缘，在冲去时尘土向空中喷射。在不远处，灯光开始闪烁，警报声大作。


    墙体活跃了起来，士兵们开始冲跑，进入战斗位置。


    他们的生活改变得如此快。这些人人在早晨时还以为这只是矿井里又单调的一天，结果一切都改变了。但他们完全不在意地迎接试图入侵他们矿井的人。


    从墙上，一道紫色的电光划破天空，灼着大地并击穿了我们的攻击车辆。在我们侧面，一道能量弹穿透了简陋的引擎，吉普车爆发出一巨大的火焰。我们自己的车辆剧烈摇晃。两个轮子离开了地面，又重重摔回，差点导致我们甩尾。


    但那个女孩很厉害。


    她保持着冷静和坚定，正如人们所说的，眯起眼睛，将油门踩到底。


    另一道闪电紧从我身边掠过，我想回击，但我的两把手持武器对这种远距离火力起不起作用。于是，我稳住身体，在继续清理矮丘和墙壁之间的空间时等待。


    一名公司守卫似乎锁定了我们，即使距离很远，我也能看到他的步枪枪口正追着我们。我知道自己的光束会偏离且毫无作用，所以我紧紧抓稳，等待我们继续清理矮丘和墙壁之间的空间。

    '
- fmt: '

    Blinking hard and moving slightly from my position on the inside of the roof,
    which was now pressed against the ground, I made sure that I had all my limbs
    and that everything seemed to be in working order. Other than the fact that everything
    hurt and I would probably be more purple than a Conecian with all the bruising,
    I was okay.


    I crawled forward, positioned myself under the leader, then unbuckled her so that
    I could lay her flat in the cramped space. It wasn’t much in the way of protection,
    but it was better than leaving her dangling upside down or dragging her out into
    the open.


    The buggy rattled and shook, the plunking sound of machine-gun fire raking our
    side filling the cabin for a moment. I used my body to keep the girl from being
    hit, but we were lucky in that the bullets seemed to strike nothing but metal.
    The problem was, I was drawing attention to us by moving and knew the best thing
    that I could do now was get away from here.


    I pulled the latch, pushed one of the doors open, and all but fell out. I stole
    one more glance at the leader, who was breathing shallowly with her eyes still
    closed, but the clatter of gunfire brought me right back to what I was doing.


    Bikes and buggies were swirling around one another, beams and bullets being exchanged
    as plumes of dirt rose into the darkening sky. Taking in the scene, I saw the
    explosive vehicle stopped several meters from the gate. Squinting through the
    dust, I saw the driver and backup operator both slumped in positions that told
    me everything I needed to know.


    I glanced up at the wall and watched several guards see me, then shift their weapons
    in my direction. Before I could even raise my handgun, Lara popped one of them,
    a plume of crimson spraying into the air before he disappeared behind the wall.
    But the other one fired down at me, the bolts singing my jacket and forcing me
    to run faster.


    I fired off a few more wild rounds, sending bolts back up to the top of the wall,
    but I didn’t hear any reaction, and a moment later, I was slamming up against
    the explosive vehicle. I gripped the door handle and pulled, feeling no resistance
    but not opening the door either.


    A beam struck against the piece of soldered ship beside me, scorching the metal
    and diffusing in a blast of heat that caused me to wince. I pulled the door handle
    again, and nothing happened. I looked down, remembering standing on a pile of
    cars on a planet that did for four wheeled vehicles what Lutch and I did for starcraft:
    repaired them.


    “There is a manual release,” he said, watching me struggle with the door of an
    old van. I had seen a board game in the back and wanted to grab it, hoping that
    the owner of the junkyard would let me keep it for free but knowing that I would
    probably have to bargain.


    I looked back down and scanned the whole door, running my hand over the curves
    and along the breaks.


    “No,” he said with a chuckle, pointing but not climbing up the pile if he didn’t
    have to. “Reach inside the window.”


    Instinctively, I had reached toward the gap in the door, my fingers cracking against
    the closed window.


    The sound that followed was something that I had hated at the time yet would have
    done anything to hear again: my father’s laughter. He bellowed as I gripped my
    fingers and winced. While I stared daggers down at him, he continued to revel
    in his little prank.


    To make up for it, he had let me smash in the window and retrieve the game, paying
    for both the damage to the car and for the board game. Even though he loved to
    pull stuff like that on me all the time, he hardly ever brought it up, but each
    and every time I pulled that game out, he got a little smile at the memory of
    it.


    Now, the memory of it saved my life. After reaching in, I pulled the manual release
    and opened the door just as another bolt came streaking down at me. It slammed
    against the door just as I passed in, muttering an apology to the man whose body
    I pulled aside and then pushed out the door.


    I had to get this car into position, and fast.


    While it was convenient that it was well covered from the oncoming fire, all the
    shielding and protection made it quite difficult to see out the front of the thing.
    So as I revved the engine and rolled forward, I had to shift and reposition myself
    in order to actually get where I needed to go.


    There were, of course, gaps along the side and back where they must not have had
    enough material or wanted to leave something for visibility, but those holes were
    precisely what the bikers targeted whenever they strafed me. Bullets riddled the
    interior each time, and one slammed into my hand, cracking into the steering wheel.


    I winced but kept the thing rolling into position. My armored glove had taken
    the brunt of the hit but I knew there was still some damage to my appendage. Not
    that I could think about it now.


    I glanced to the side and watched as one of our buggies lanced a bike in the spokes,
    sending both driver and gunner screaming through the air.


    Nearing the massive door, I slowed the car, hearing bullets and beams rattle off
    the roof.


    I looked behind the driver''s seat to the little compartment that held a lot of
    explosives. After moving the operator aside, I squeezed past the seat and toward
    the rear of the vehicle. It was tough trying to move around a small space in my
    heavy armor, but it also kept me alive, and I had probably been hit countless
    times in this very battle, so I wouldn’t complain.


    A moment later, I was in the back and working at the igniter.


    In the end, it was probably for the best that it was me doing this. The men who
    had volunteered for this job had acted with confidence, but as we went through
    our trial runs, I worried that the bravado they brought to the table was making
    up for a lack of skill and common sense. Again and again, I had explained that
    this move or that mistake would get them killed, but they didn’t seem to want
    to listen.


    Lutch had once told me that, “Some guys would rather think that they are right
    than learn to be right,” and I couldn’t get that out of my head as I watched them
    work.


    So, here I was, initiating the explosion and giving myself time to escape.


    I was being shot from all sides and working alongside people I didn’t know. I
    didn’t need to complicate things with some kind of shitty action-movie sequence
    where I set the timer too short and then get stuck in my big armor as I tried
    to get out.


    A moment later, I was back at the car door, trying to time my escape. I watched
    as buggies and bikes circled and fired on one another, and the wall guards continued
    to take potshots at our people. There was not much in the way of cover, so I decided
    to just make a break for my flipped-over buggy.


    Luckily, as planned, the star setting on the horizon was shining directly into
    the eyes of the guards on the wall and making it much more difficult to see us,
    plus, with the pluming smoke from the destroyed vehicles and billowing dirt, it
    would have taken a lot more for me to draw their attention.


    That a-lot-more came in the form of an explosion a moment later. The ground shook,
    and the walls rattled when the car burst apart, hopefully blasting open the gate.


    The sound and vibration were enough to wake the knocked-out leader, who blinked
    a few times as though she was trying to figure out exactly where she was before
    remembering. We locked eyes, and the recognition returned.


    “We’re not dead?” she asked.


    I shook my head. “Not yet. Want to take over a company mine?”


    I watched as a grin pulled her cheeks, and she reached out a hand, allowing me
    to help her from the vehicle.

