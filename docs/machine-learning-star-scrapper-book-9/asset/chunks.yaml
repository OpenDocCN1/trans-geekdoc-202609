    他脸的一侧肌肉只是扭动了一下，我在想他在想什么。不过，如果对自己诚实的话，他心里可能根本不是在想这个局面，而是在想屁股、乳部，或者是快船之类的。


    “还有你们两个，”她说，“你们正在为我提供一个独一无有的机会。”


    我正想问问怎么做，但决定还是闭嘴好，因为到目前为止这样做似乎很管用。


    “捕猎者自议会成立以来，一直是议会盔甲上的污点，”阿拉娜说道，她从椅子上站起来，以便在房间里边走动一边发表哲学见解。而她确实这么做了。


    “即便你所说的内容有一部分是真的，这可能是一个改变运作方式的真正机会，”她说，显然在考虑许多变动因素，“但我们需要揭露他们，这将非常棘手。从第一次会议时代起，捕猎者就是一群狡猾的团伙，他们在表面上遵循我们的守则，却在地表运作得风风水起。”


    曼恩一拳拳砸在椅子的扶手上。“我们应该揭发他们，迫使他们下下议会。”


    “别让你的野心引导你走上一条尚未准备好走的道路，笨蛋，”她说。“这需要时间和狡诈。”


    她转过身，缓慢地穿过房间，然后在一幅画前停下。“你们两个愿意和我一起合作，试着把这个恶棍给逼出来吗？”


    “当然愿意，”拉拉说，“为了找到伤害了泽诺比亚的那个人，我愿意做任何事情。”


    “你跟着她已经很长时间了？”阿拉娜问。


    拉拉点了点头。“从我还是个女孩起，”她说，“我曾在 `Syn Kel Kal` 下学艺。”


    议员看向拉拉。“我记得你。”


    拉拉什么也没说，但我能看出她听到这话时内心感情波动很大。


    “当 `Syn` 想要收你为徒时，他来过议会，”她说。


    拉拉艰难地吞了下口水。“我并不知道。”


    “猎人通常不会以这种年龄和以这种方式收徒弟，”阿拉娜说，“但他认为这样做是最好的。”


    她没有说话，但这位康尼西亚亚议员审视着她的脸。“你不知道？”议员问道，“他什么都没告诉过你？”


    拉拉没有立刻回答。“他没有，”她终于说道，“他不是……一本易于阅读的书……”


    阿拉娜笑了起来。“他确实不是。我相信字典里‘坚忍（stoic）’这个词旁边有他的照片。”


    拉拉笑了，眼神有些深远。“我自己一直觉得他是那种‘坚强沉默的类型’，”她说，“但我想我可能是从他那里学到了这一点。”


    “那让我告诉他从没做过什么吧，”议员走近了一些，直视着拉拉。“他来过我们面前，拼尽全力地说服我们让他收你。在那个房间里，他表现出的情感比他此后或任何时候对我表现出的都要多。我确定他从未告诉过你对他意味着有多重要，但在那一天这一点得一了了。”


    拉拉的脸紧绷起来，她极力克制着情绪。她想要成为 `Kilara Vex`。

