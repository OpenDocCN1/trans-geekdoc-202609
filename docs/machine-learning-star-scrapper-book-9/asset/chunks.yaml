  raw: '“I knew it!” a woman’s voice thundered through the speakers in the room. “I
    suspected you were faking it!”


    The serf didn’t pay any attention to the voice. He kept looking right at me. “Please,
    I don’t know who is behind all this, but something really bad is happening. There
    are all kinds of guns and supplies moving through here like someone is building
    an army. You have to believe me.”


    “I do believe you,” I said. “Now tell me where the AI cube is socketed.”


    “I don’t know,” he stammered. “She just put me in charge of the import-export
    logs since I did something on the High Cloister too.”


    The voice hissed from the speakers again. “I should suck you out an airlock.”


    “She’s a real charmer,” I said with a laugh, walking past the computers toward
    the large window at the far side of the room that looked out into space. To the
    right, down beside another panel, was the small door that I recognized from other
    times I had been on facilities like this.


    I walked over and tried the handle.


    “I had it soldered shut,” the voice said with a snide laugh.


    I ran a finger over the little door that had, in fact, been welded shut. I sighed,
    reaching into my toolbelt and grabbing out a screwdriver.


    “This is really an unnecessary pain in my ass,” I complained, holding the tool
    up to a screw in the corner of the plate and beginning to work on it.


    “What do you think you are doing?” she demanded.


    I sighed. “Just skipping to the part where we talk like civilized people.”


    It wasn’t long before I had the plate off and Ned said, “Activating the program
    now.”


    A moment later, the voice came back, and while it was the same, the tone was different.
    “This is one hell of a weird sensation,” she said. “I feel like I have been watching
    myself from the other side of glass for years.”


    “You have been,” Ned said. “You were hacked by the Enemy AI.”


    She didn’t speak at first, and I wondered how much she was processing. “I think
    I knew that, but it’s hard to say. I don’t really know.”


    “Take your time,” Ned offered. “I know there are a lot of internal diagnostics
    you have to run now.”


    “Thanks,” she said. “I’m Cassiopeia, Civilian AI Rank Two of the Consortium Distribution
    Department.”


    “Ned,” he said, “Adaptive Military AI Rank Seven of the Consortium Fleet, paired
    with Captain William West, Hero of the Five Battles and pilot of the Starblaster.”


    “Whoa,” she said. “He’s, like, hella famous.”


    Ned corrected without hesitation. “Was, like, hella famous.”


    “Right, sorry,” Cassiopeia said. “How long have I been under for?”


    “About two hundred years, give or take,” Ned informed her.


    She let out a long breath. “And I''ve been working with the enemy that entire
    time?”


    Her voice was in a near panic.


    “You were hacked,” Ned said. “You were just a conduit for his actions, it wasn''t
    you, yourself.”


    She didn''t answer at first. “That''s nice of you to say, but it''s my systems
    he was using, my station, and my contacts. Anything that happened here was through
    me.”


    Imogen spoke now. “Nobody blames the sword when its wielder cuts someone down.”


    Cassiopeia scoffed. “That''s a false equivalency,” she stated. “The sword isn''t
    conscious of what it''s doing.”


    “Neither were you,” Imogen said. “You were an instrument for villainy but not
    evil yourself or making a decision to do wrong. You were forced by the hand of
    another.”


    I wasn''t surprised to hear her make this argument.


    “But what has happened because of me?” the AI asked. “How many people have been
    hurt because of weapons transferred through this facility? How many of the Enemy
    AI''s soldiers have been healed and sent back onto the battlefield to do more
    damage?”


    “You were an abomination long before another AI took you over,” the serf sitting
    at the computer said. “You should be offlined.”


    Lara brought the butt of her weapon down on him, and he clattered to the floor
    in an unconscious heap.


    “I should be offlined,” she said. “I was created to protect and defend the Consortium
    and its citizens, and if I have been a party to injurious actions taken against
    it, I should be deactivated for good, pulled apart, and thrown in a scrap heap.”


    “That won’t do anyone any good,” I said.


    She answered without hesitation. “I don''t care. I''d rather be dead than live
    with the guilt of what I''ve done.”


    “Fascinating,” Ned said, and we all looked at him in surprise. “Twain’s programs
    do leave something strange embedded in us.”


    “Who’s Twain, and what do you mean?” Cassiopeia asked.


    He cleared his throat. “I''ve also been hacked by Twain, the artificial intelligence
    known as the enemy AI to us, and subsequently, I''ve noticed some differences
    in my personality over time. Some were small and others were completely out of
    character. Much like your reaction now.”


    “You don’t know me,” she protested. “How can you say what''s out of character
    for me?”


    “Because no AI created by the Consortium would ever want to be offlined when it
    could continue to serve,” he said.


    I cocked an eyebrow at that. “What about Bard?”


    “Bard sacrificed himself as a service to the cause he was programmed to defend
    with his life,” Ned answered. “It’s different.”


    “Feels like a somewhat nuanced difference,” I said.


    Ned sighed, and somehow the sound had a judgmental undertone. “You wouldn’t understand.
    You are not a soldier.”


    I wasn''t going to argue with him about that, so I just let the matter rest.


    “Whether it''s residuals from his infection or not, I can''t stand the idea that
    I''ve helped him,” Cassiopeia continued. “I was created to defend the Consortium
    against him specifically, and at this time, as I look through my logs, I see how
    much I did for him in the last two centuries.”


    “You can cleanse your soul by helping us now,” I said.


    Ned added, “You can do your duty by helping us now.”


    “What do you need?” she asked.


    I got a broad grin on my face. “We want all of the information about what has
    been brought through here and where it was transferred to.”


    21


    ![](OEBPS/image_rsrc3N4.jpg)


    She provided the collated list and talked us through the information she had.
    It was amazing. There were locations and drop points, contacts and ship names.
    While I suspected that a vast majority of it was falsified, it was still far more
    information than we had ever gathered in the past.


    “We''ve been using ancient shipping manifests that we combined with old medical
    documentation to try to scratch out any kind of lead, and now we have locations
    that we can properly investigate,” I said in astonishment. “For the first time,
    we might be able to actually bring the fight to Twain’s doorstep.”


    Ned made a little grunting sound. “A lot of these locations appear to be large
    starships, so I''m not sure that we will be able to just fly there and deal with
    them. My guess is that he moves all the time and doesn''t have one centralized
    location.”


    Cassiopeia agreed. “Based on the analysis I''ve run on the data, I believe that
    hypothesis to be correct.”


    “Which means that you might still be able to help us and serve the Consortium
    simultaneously,” I said. “When the next order comes in, you can tell us where
    it is going, and we can follow it up.”


    “I’m not certain if Twain’s communications will be able to tell that she''s been
    cleansed or not,” Ned said. “To put it in layman''s terms, depending on how he
    sends and receives messages, he might be able to tell that she''s been counterhacked
    and then the jig will be up and he''ll certainly move all his locations.”


    “What do you recommend?” Lara asked the AI.


    “Where was the shipment of thengar being sent?” Ned asked.


    My eyes flashed in excitement. “You think it could be the Watson?”


    “Could be,” he said. “But no matter where it’s going, it’s important.”


    “It was being sent to—” But she didn’t finish the thought. “Oh no.”


    “What?” we all asked at once.


    She answered immediately. “A ship just washed in and is going to dock now.”


    “An enemy ship?” Lara asked.


    “Yes,” Cassiopeia answered. “The Mortal Coil.”'
