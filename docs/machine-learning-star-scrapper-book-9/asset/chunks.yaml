    frozen her.


    “We need to get going,” I said.


    She looked up at me as though she didn''t even know who I was for a moment and
    then blinked once and nodded. “Let''s go.”


    But she didn''t move.


    Cassiopeia chirped in my ear. “Coming in hot,” she informed me.


    “We got your back,” Ammo added, and I stole one more look up out of the large
    window to see the cargo ship moving quickly through space as it and the Boot of
    Justice came under fire. Smaller crafts were dogfighting all around, and this
    battle was going to be close.


    One more chime. “Four minutes until Tidal departure.”


    30


    ![](OEBPS/image_rsrc3N4.jpg)


    Once I got her moving, Sophia continued to film as we exited the area and continued
    down the hallway to all the Port doors.


    “Port Cyan,” Ned informed me, and I saw that Lara must have gotten the same message
    as she was hurrying people through the door to the designated port.


    The people were streaking away from me and Sophia, but then I heard a sound behind
    me and turned just in time to watch several more Disciples appear at the end of
    the hallway. I ducked inside the frame of one of the massive port doors and squeezed
    off a few shots to stop the soldiers from coming.


    All I needed to do was hold them back long enough for Cassiopeia to dock so that
    the civilians could get on the cargo ship and get out of here. Taking a quick
    gander from around the edge of the wall, I saw the world around me explode in
    gunfire as all of the approaching soldiers took aim at my position and let me
    have it.


    I answered with a blind fire, sticking my hand out from around the corner and
    just shooting. I could have sworn I heard someone shout and then a thud, but it
    might have just been wishful thinking.


    Not that it really mattered.


    I was holding them back, and that was what was important. As long as I could keep
    them from continuing down the hallway, the civilians would be safe.


    “Docked,” Cassiopeia cheered in my ear, and I pressed the button beside me to
    open the door. Another quick blind fire, and then I turned to look through the
    port and out to where the cargo ship was affixed to the space beside.


    It had obviously taken significant damage but it was still working, and all it
    would need to do was hold out a little bit longer.


    Behind it, the battle continued to rage on, and I saw micromissiles streaking
    through space while the heavier ships blasted at one another with bolts and pulses.


    Footsteps drew my attention back to the situation in front of me, and I looked
    out just long enough to see a slew more of the disciples heading toward the port.
    The ones who I had held at bay were joined by another group, and it seemed that
    they had decided to take me on.


    There were far more of them than there were me, and they must have figured that
    even if they lost a few, their superior numbers would be able to overwhelm me.


    “How you guys doing, Lara?” I asked.


    “Where are you?” she answered.


    I answered quickly. “I''m close, but I have to hold off some of these damned cultists.
    How close are you to getting everybody loaded on?”


    “We are just getting started,” she said.


    I nodded. “Hey, Lara,” I said as I pulled my stomper out of its holster. “I love
    you.”


    “Hank,” Ned shouted. “What the hell are you thinking?”


    Then I stepped out into the hallway, knowing that I would draw their fire and
    hopefully stop them long enough to finish getting the civilians out.


    The soldiers all seemed absolutely shocked to see me and raised their weapons
    at the same time as I began opening fire with both of my own.


    I felt some bullets hit my armor, but the soldiers were falling at a much faster
    rate than seemed to make sense.


    Out of the corner of my eye, I saw Sophia and Imogen stepping up, each unloading
    shot after shot from their rifles. At the back of the row of soldiers, I saw one
    just disappear down behind the bodies of the others and then another.


    As we continued to lay waste to them from our position at the front, I realized
    that Clynt had appeared from behind and was cutting them down as he moved in our
    direction. Through the door beside me, I saw a blur, and then a moment later,
    the Buzzard came crashing into the port.


    “Want a ride?” Jackson communicated, and I realized that Ned must have let her
    know where I was.


    “More coming up behind me,” Clynt said. “And we gotta shake a leg.”


    “One minute until Tidal departure.”


    I turned to Imogen and Sophia. “Go get the last of those people on.”


    They didn’t hesitate to turn and rush down the hall in the direction of the other
    port.


    “And thanks,” I called after them.


    “They saved your life, and all they get is a thanks?” Ned mocked. “Not even a
    crisp high five?”'
