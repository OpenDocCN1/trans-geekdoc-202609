  trans: '

    “我的意思是，”她继续说道，“你们有时间带他寻求医疗帮助。”


    “我会带他回基地，”拉拉提议道，“你应该继续调查。我们现在离目标已经很近了，不能慢下来。”


    “不，”伊莫苟说，“由我来做。”


    在我来得及反驳之前，卡西佩珀娅开口了。“让我来吧。”


    我们彼此困惑地面视着。


    “把我塞进你带回来的那艘货运船里，我会带他去你们的医生那里，”她提议道，“这样，你们其他人就可以继续前进了。”


    这让我停顿了一下。“内德，”我用耳机上那种他能听懂的敲击信号问道，“你信任埃德温的程序吗？”


    “你的意思是，我是否认为她可能伪装，并把崔恩直接引到我们这里？”他问道。


    “是的，”我敲击道。


    他不需要思考。“我信任它，”他回答道，“没有什么是完美的，但我相信她的程序某种意义上是干净的。”


    “值得我们冒上全部生命去冒险吗？”我明确道。


    “是的，”他说，“我被感染过一次，虽然我觉得还有残留影响，但他从未能追踪到我。此外，我真的相信如果她还被黑客入侵，她不会建议我们让她下线的。崔恩绝不会建议那样浪费资源。”


    “好，”我大声说道，“卡西佩珀娅，你可以带他回去了。欢迎加入我们的事业。”


    她发出了轻微的响声，我判断那是兴奋。“谢谢，”她说，“我真的很想弥补我所做过的一切。”


    “把我们的朋友送回安全的地方确实很有用，”我说，“开始给货运船加燃料。”


    “已经做好了，”她说，“当我恢复真实身份在线的那一刻就开始了。”


    我看着我的朋友，仍然不确定是否该这样做，但知道我们必须趁热打铁。


    “拉拉，帮我移动他，”我说，“还有伊莫苟，去拿卡西佩珀娅的立方。”


    伊莫苟毫不犹豫地冲出房间，但我以为拉拉会来帮我。相反，她走向一辆载重车，启动了它，并开到我们面前。


    “即使大家一起，我们也搬不动他，”她说。


    阿莱克咯笑道。“是真的。”


    当我去帮他把自己抬到浮动的平板上时，阿莱克将我拉近了。“别担心，”他说，“我会坚持住的，我觉得这个 AI 真的想要帮忙。”


    “你总是第一个信任别人的人，”我带着虚弱的微笑说道。


    现在看着他，我意识到对于失去他，我完全没有做好准备。


    “我一直都是对的，不是吗？”他说。


    我点了点头。“你是的。”


    “但真的，”他在把自己挪上平板时，假装我真的帮了什么忙似的，“去做该做的事就行了。”


    我转头看向“凡人躯号”，听到从内部传出的细微声音。


    “我会的，”我说，拍了拍他的肩膀。


    拉拉启动载重车，开始开车把阿莱克送到另一个舱口，他可以在那里登上货运船。


    “那个 thengar 也能卖个好价，”内德注意到道，“填满我们的金库，或者我们可以尝试自己使用它。无论如何，货运船也会很有用。”


    我仍然担心，但知道我必须克服这种情绪。


    “重新激活定位磁，”我命令道，在经过一阵咔哒声后，“凡人躯号”的腿开始移动。起初很慢，但然后船体翻回了腹部。其他腿弯曲得很厉害，但这并不重要。这东西还能飞。


    我赶忙走到后方，沿着斜坡进入了这艘困扰了我这么久的飞船。


    “它完全就像我想象中那样，”当我走进这艘只有红黑装饰的哥特式飞船时，内德说道。纸张和书籍到处都是，蜡烛壁炉里燃烧。或者在我们把船转动几次之前，它们曾是那样。


    现在，到处都是一团糟。


    奇怪的是，即使这样对我来说也是一种小小的慰藉。我为在审判官的船上搞出一团糟而感到开心。


    我穿过小隔舱和一些关禁室来到驾驶舱，通讯屏幕正闪烁着 `MESSAGE RECEIVED`。在它旁边以及前方的控制台上，金属上刻着图像和文字，这些似乎都与他们的审判庭任务有关。


    “有点太显直白了，你不觉得吗？”内德开玩笑道。


    我笑了。“那个人是他自己的一个陈词滥调。”


    一些血从我的额头滴到眼睛前，我记起自己受了伤。此时，我的整个身体就像一个痛苦的肉团，只有极大的疼痛才能引起我的注意。


    我伸出手播放了信息。


    “一旦换完奴隶，立刻回到这里，”约翰·格雷高里的声音通过通讯器命令道，“我们有一件紧急事务要处理。”

