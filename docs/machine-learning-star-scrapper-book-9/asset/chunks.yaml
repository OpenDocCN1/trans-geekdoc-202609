  trans: '

    除了他的动作比我们快得多且战斗技巧极其残忍之外，我们也会疲倦。我们三个人在这一刻之前已经经历过几次战斗，身体精疲力竭且满是累伤。与此同时，我们面对的是一个由机器组成的敌人。它们永远不会磨损、减速或出错。然而，它们会利用我们的任何失误。


    拉拉（Lara）和伊莫珍（Imogen）的动作看起来是同时发生的，但审判者（the Inquisitor）能够来回拨挡。


    他的动作流畅而有力，两人看起来都可能失去武器的控制。


    当拉拉试图向他进攻时，他给了她一拳，挥剑向我来以将我挡开，并几乎再次踢向伊莫珍，尽管这次她避开了那次攻击。


    当我们继续压制进攻时，我意识到真正处于防御状态的是我们。


    我们无法赢得这场战斗，这种意识到虽然短暂，但足以让我停顿瞬间，让约翰·格雷戈里（John Gregory）抓住机会，朝我的胸口猛刺了一去。


    刀刃撞击在我的盔甲上发出刺刺声，但并没有完全刺穿。尽管撞击的力量震得我踉跄后退，脚下的碎石崩塌，导致我重重地摔在地上。


    他乘胜击，肩膀撞向伊莫珍，她被红色盔甲撞中鼻子，然后再次被撞回草地。火势开始在我们周围蔓延，火焰开始吞噬树木，黑烟与灰色雾气混合在一起，让我们的世界变得更加昏暗。


    拉拉迅速移动，但现在由于变成了一一对战，即使是她也不是那台机械怪物的对手。


    她保护着身体免受密集的攻击，但正被逼后退。


    当我站起来时，我听到内德（Ned）在我耳朵里说：“听我的。你们全都是。”


    我点了点头，知道他能通过安装在我头侧的摄像头看到一切。


    伊莫珍在火焰吞噬她刚才被摔出的位置之前，爬回了路面。在我们周围，大火在轰鸣，开始吞噬树木。


    “拉拉，”内德说，“现在，上劈攻击。”


    她按照指示做了。


    “伊莫珍，横跨攻击，”他命令道。


    “还有汉克（Hank），刺击。”


    我们遵循他的命令，很快我们的攻击真的起作用了。在内德像控制视频游戏角色一样控制我们的情况下，特恩（Twain）无法阻止我们。这是计算机与计算机的对抗，由人类身体在执行动作。


    “现在，”内德会大喊，我们其中一人移动。然后另一个人遵循他的命令。


    伊莫珍切断了他的手臂，拉拉击中了他的腿部，我刺穿了他盔甲下方的一个空隙。


    战斗变得更加胶敌，但我们都开始感到疲劳，我不知道我们造成的伤害实际上有多大程度上减慢了审判者的速度。他体内的微型机器必须重新分布，急于处理我们造成的伤。但这仅仅略微地震慑了他。


    与此同时，他对我们发出的每一次反击和动作都是致命的，在动作之间，我发现自己喘着粗气，吸入烟雾，感觉到余烬灼烧着皮肤。


    “刺击！”内德命令道。


    我做到了。

