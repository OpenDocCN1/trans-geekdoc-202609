    She smiled miserably. “I couldn''t have put it better myself. That''s exactly
    what happened. One of the minerals found here is used in the process to create
    `Tidal Drive` fuel. It''s not the primary ingredient or anything, but I guess
    it''s important for the refining process and not super common around the universe.
    So the company came and started building mines all around the surface.”


    “And pushed the locals out?” I asked.


    She tilted her hand from side to side. “Yes and no. At first, they tried to act
    all friendly and offer people jobs, but it didn’t take long for them to turn on
    us. Those who wouldn’t relocate or accept positions in the mines became the enemy.”


    This story was already sounding all-too familiar.


    “But the company couldn’t outright attack the natives, of course,” she continued.
    “So, they did the next best thing—sent their own hunters and foragers out in droves
    to strip the already barren land of its food and materials. Their trucks rumbled
    forth and guzzled up as much of the water from the subterranean wells as they
    could. Soon, there was almost nothing left.”


    “Have ta think them locals knew where to find more,” Clynt interjected.


    The young woman nodded slowly, worrying the end of one of her braids before realizing
    she was doing it and bringing her hands to her sides. “They did, but the company
    also hired some locals to let them in on their secrets. And anyway, it seems like
    they didn''t actually want to cause everybody to starve to death. Instead, wars
    began between different local tribes. Long friendships and even ancestral families
    fought with each other. Because when all is said and done, people will do anything
    and turn their backs on anyone if it means they can feed their starving child.”


    We all nodded gravely.


    “So, large battles were waged,” she explained. “But the company wasn''t done.
    Not yet. They backed the smaller tribes, giving them weapons and resources.”


    I knew there was probably a good reason for it, but I couldn''t figure it out.
    “Why not just back the larger tribes and let them wipe everybody out?”


    “Because that would leave one powerful group to contend with at the end,” Lara
    said in a thoughtful tone.


    “Yeah, that’s right.” The young woman bobbed his head. “By funding the smaller
    tribes, they were able to weaken everybody. Though the bigger groups ended up
    being victorious in the end, their numbers were so thinned that there was almost
    nobody left. Then, things got even worse. As the resources continue to become
    scarce, one man decided to lead everybody who remained against the company.”


    Lara bumped me with her shoulder. “Sounds like you.”


    “But that was a huge mistake,” the girl said, voice heavy with melancholy. “As
    soon as the united tribes began attacking the company, they retaliated in force.
    They declared us terrorists and fought back. Apparently, the `Consortium` wouldn’t
    let them hunt us or anything like that, but they were given permission to defend
    their interests. And they defended them aggressively. Now, all that’s left are
    some groups of us just trying to survive, the other tribes who would just as happily
    steal from their own, and the so-called terrorists.”


    “I get that this place is your ancestral homeland and all,” Clynt said, “but why
    not get off this rock? Plenty ’a planets out there for you to make a home.”


    “Even if we wanted to,” she answered, “we can’t. None of us have the money to
    leave, and even if the company would help us go, we shouldn''t have to.”


    “Sure as shit you shouldn’t, but the universe don''t work that way,” Clynt said.
    “Sometimes you just got to make a call because it''ll save your hide. Only get
    one go-around. I don''t know why you''d waste it nibblin’ on dirt and fighting
    every day just to survive. Do the hard thing and get out of this shithole. You’ll
    be all the happier for it.”


    Lara took a small step forward. “Clynt, we are guests here. Maybe we shouldn’t
    presume to tell them how to live?”


    “Or maybe I''m just the thing they need,” he said. “Make a big move and maybe,
    just maybe, you''ll be able to put together a better life. You''re still a youngin’,
    and I don''t know why you''d choose a life of nothing but suffering.”


    Lara opened her mouth to object again, but the young woman held up a hand. “I
    don''t mind,” she said. “I don''t know why you''d choose a life of nothing but
    suffering.”


    Lara opened her mouth to object again, but the young woman held up a hand. “I
    don''t mind,” she said. “I don''t know why you''d choose a life of nothing but
    suffering.”

