  trans: '

    她没有微笑，但微微点了点头，带着感激之情。“谢谢你们，伙计们，”说道，然后把脸埋在手手里。尽管我没看到她哭。“我觉得这是我在这艘船上第一次有人对我说这么体贴的话。”


    我坏笑了一下，问道：“你想去告诉约翰·格雷高里，你对这事有什么感受吗？”


    她移开手，直直地看着我。“想，”她说道。“是的，我这么想。”


    ### 23


    ![](img/image_rsrc3N4.jpg)


    通过传输管前往那个位于潮汐驱动器的小行星路程并不远。


    当我们冲刷出来，看到那个小蓝点出现在我们面前时，尼德向我们介绍道。“这在战争期间只是一个哨所，用于扫描周围空间。”


    “看来很多这样的哨所都被遗弃了，而特恩利用了这一点，”我观察到。


    尼德哼哼了一声。“你必须理解我们当时有多捉襟见肘，”他辩解道。“整个宇宙都团结了一起，但我们都被战争毁得惨不睹。这样的地方无疑是被遗弃的，因为资源被需要需要的地方。”


    “而且因为他们杀了你们所有的人，”伊莫根补充道。“所以他们不能直接让 AI 来管。”


    “正如我们在仙后座（Cassiopeia）看到的那样，即使他们留了一个 AI 来管也没关系，”拉拉说道，“只要联盟没有检查他们所有的设施，无论它们是被遗弃还是只留下了一个守卫者——无论人还是机器——这都不重要。”


    尼德不喜欢这种谈话的语气。“联盟的男妇女已经根据他们拥有的资源尽力而为了。战争中幸存下来的人在战后必须付出加倍的努力，虽然某些事情可能被置于其他事情之上，但这并不意味着联盟做错了什么。”


    我咯笑道。“那个程序什么时候才会改变？你说你觉得你正在变得不同？为联盟找借口的行为什么时候才会结束？”


    “永远不会，”他毫不犹豫地回答道。“因为那不仅仅是代码，更是热诚的信念。”


    “不，”伊莫根说。“那全都是代码。”


    尼德起初没有说话，直到他开口：“感觉并不是那样的。或者也许我被程序设定为理解我是谁，但无法完全接纳它？又也许我内部发生了什么变化？”


    我皱起眉。“也许这并不重要，”我说。“你对联盟的爱，从层面上来说是你之所以成为你的原因，尽管我很喜欢拿这件事开你的玩笑，但我真的不希望它改变。无论我们中的任何如何成长，我们并没有真正、实际上发生改变。”


    “凡尘号”（The Mortal Coil）降落，进入了笼罩在行星面的浓雾中。我把它停在一个看起来由压实碎石制成的降落平台上，感觉到飞船在落在地面时略微下沉。


    透过厚重、深灰色的雾雾，很难看清什么。尽管我知道在这个行星上是白天，但雾气太浓了，将世界笼罩在一种暗淡的伪黑暗中。


    真恰如其。


    从降落平台，我们可以看到附近的建筑。它看起来像是一个审判所建筑的仿制品。斜屋顶在四个角直插天空，并带有四个尖顶。正面有一圈粗糙的彩色玻璃，还有通往建筑内部的巨大木门。


    当我们从飞船上走下来时，那些大门敞开了，审判官约翰·格雷高质从里面走了出来。


    他看起来像是要下达命令，然后他看到了我们。他的脸扭曲了，一个狰狞的表情让他本就紧锁的眉头更加痛苦。“你们在这里干什么？”他用一种完全不像他自己的声音问道。


    路旁的高草和沿路伸出的小伞状树木在微风中摇曳着。雾气在我们之间翻腾。


    “你们不该在这里，”他说。“你们不该知道这些事。怎么可能？”


    我向前迈出一步，感觉到伊莫根在我身边散发出的恐惧和决心。


    “我们知道很多事情，”我脸上带着得意的微笑说道。“很多你希望我们不知道的秘密。”


    “处理它们吧，”他在扭曲的愤怒中说道，“我会处理你们的。”


    听到这话证实了我的信念。“噢，嘿，特恩，”我说道，对着空气挥了挥手指。

