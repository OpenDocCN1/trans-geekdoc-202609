    18


    ![](OEBPS/image_rsrc3N4.jpg)


    I had expected to find some landing pad or array of dishes, or at least some kind
    of concrete bunker, but what I saw instead was nothing more than a hatch in the
    ground. There was growth all around it and no signs that anyone had tread nearby
    recently. If I hadn''t known it was there, I might never have seen it.


    “I don’t see any cameras or anything,” I whispered.


    “I’m not picking up anything on the scanners either,” Ned said. “I think you just
    have to go investigate.”


    But I was already moving forward. With Alek’s time running out, I didn’t want
    to waste even a single second. I just hurried forward and grabbed the handle of
    the hatch door.


    No resistance, not locked, nothing.


    It just swung open, and I looked down into a well-lighted cement staircase.


    I went to gather the others; all of us ran back to the hatch and headed straight
    down. Well, almost all of us.


    “I’ll wait up here,” Lara said. “Comm when you know what’s what, but we shouldn’t
    all go down some dark passageway that we don’t know.”


    She was right, and I gave a quick nod before heading down first.


    The stairs seemed to go down forever, and I kept glancing back to check on Alek,
    but there was nothing worth looking at until we eventually reached another airlock.
    Once again, it was unlocked and looked as though we could activate it easily.


    I turned to the others. “Let me go in first to test it. Just in case.”


    “Not a chance,” Alek said and then shoved me out of the way. He stepped in and
    activated it without question.


    With the doors sealed, all we could do was watch, but a moment later, he stepped
    out the other side and began taking off his suit. The rest of us hurried in and
    then waited for a moment before following him to the other side, where the tunnel
    opened into a seating area with lockers. The benches did not look as though they
    had seen much wear.


    “What is this place?” Imogen asked. “Why does everything work if it doesn’t seem
    like anyone comes here?”


    I couldn’t help but agree. “And why was it in so many Disciples’ recent communications?”


    “Maybe we go take a gander ’stead of standin’ around jawing?” Clynt suggested.


    I looked up at him from where I was going to investigate Alek’s suit. “Will you
    go take that gander for us?” I asked, wondering why he hadn’t just disappeared
    like normal, but the way he glanced back at the Kyrog before disappearing into
    the facility gave me my answer.


    All these disparate people who had been brought together by random circumstance
    and a desire to stop Twain were now really a team, a crew.


    I pulled off my own helmet, unclamped the connectors of my gloves, and began to
    run my fingers over the outside of Alek’s suit’s filtration system until I found
    the spot where it had been damaged.


    “If you had told me that following some repairman would actually be really handy,
    I don’t think I would have believed you,” Imogen said, watching as I assessed
    the situation.


    Ned was also talking to me about what he was seeing, but I looked up at the former
    Inquisitorial Acolyte. “Maybe we leave our backgrounds out of it?” I joked.


    Alek snorted. “Have I mentioned that my background is that of⁠—”


    “A doctor,” Imogen cut him off. “We know.”


    “And yet none of you guys ever bring it up,” he complained but was speaking with
    a little smile.


    “Y''all may want to see this,” Clynt said, returning from the doorway at the far
    side of the room.


    I looked up at him. “I don’t need to rush to get this done?”


    “Nope,” he said, and we all moved to follow him into the next concrete hallway
    until we reached a large double door.


    When we stepped up to it, the two halves slid open, and beyond was a massive room
    that stretched farther than I could see. A catwalk hung over endless rows of planter
    boxes, all full of the same type of mushroom.


    People in white robes moved from place to place, tending to the fungi. Some plucked
    little caps and placed them in trays that were being carried around by other robed
    people. In the distance, they just looked like insects moving about, tending to
    their subterranean fungus farm.


    The catwalk began to shake slightly as a small figure appeared from the other
    side, hurrying toward us.


    When she reached us, she clasped her hands in front of herself in apology.


    “Are you here for the shipment?” she asked, head bowed. Her skin was so pale it
    almost appeared translucent, and her black bob of hair was obviously dyed such
    a dark color.


    “We are,” I stated as though I was some impatient shipper. I had known a lot of
    them in my time, and they always talked to me as though the repairs to their ships
    didn’t just take as long as they took. These people would stare at me as I gave
    them the time frame, then they would inevitably demand that I do it faster.


    Now, I took that attitude with her while trying to be careful not to push it too
    far.


    “Is it ready?” I asked in a tone edging on demand.


    Her head shot back and forth in little jolts. “Not quite, my lord,” she answered
    in a tone so apologetic that I hated the part I was playing and wondered if it
    was necessary at all. “The order was slated for pick up later, and as you know,
    we always maintain a strict schedule. We don''t want the goods to go bad.”


    I folded my arms impatiently. “If we have some time to kill, please tell me about
    your operations. I''m new to this assignment and would like to know what I''m
    transporting.”


    “Mister Huckleberry Sawyer didn’t tell you anything?” she asked.


    “Oh, har har har,” Ned said in my ear. “Twain is just having fun now.”


    I ignored his comment and looked straight at the woman. “I wasn''t given any additional
    information.”


    “I understand,” she said. “Follow me.”


    She turned and shuffled back the way she had come and we stayed in lockstep behind
    her. As we followed toward the center of the room, the catwalk shifted slightly
    more under our weight.


    Stepping through the door on the far side, we entered a large white room with
    tables and chairs and couches and windows overlooking the operation.


    “We here at Diappi Industries are the universal leader in thengar spores,” she
    said, but apparently our faces told her that we had no idea what she was talking
    about and she continued. “These can be harvested and converted into Thengar Paste.”


    “Ain’t that the active ingredient in Hospi-gel?” Clynt asked.


    She smiled and nodded. “That is exactly correct,” she said as though he had gotten
    the answer right on a game show. “The company that produces that product is one
    of our largest purchasers.”


    “Mister Sawyer being the other,” I filled in.


    She nodded again. “Your employer has kept us in business since Mister Diappi first
    realized the medicinal value of thengar.”


    “I have to assume that is quite a long time,” I said, my words dripping with implication.


    Now, she registered no reaction. “The money spends.”


    “Meaning her bosses don''t care what Twain does to have lived this long nor what
    he''s doing with the thengar,” Ned said in my ear.'
