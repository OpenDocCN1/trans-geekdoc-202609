  raw: 'Hearing the name said, I turned to look at Imogen, who was as pale as a ghost.


    “Can you shoot it down?” Lara asked Cassiopeia.


    “No,” she answered. “I do not control the station''s weapons, and even if I could,
    it’s moving too fast. Additionally, the cannons are designed to deal with larger
    vessels.”


    “It’s fine,” I said. “It’s time we dealt with him once and for all.”


    Imogen looked at me. “You want to take him on here and now?”


    “Yes,” I said. “One way or another, we need to confront John Gregory.”


    “You can just cut his head off again,” Lara said, patting Imogen on the shoulder
    with a closed fist.


    The former Acolyte grinned at that.


    “What is the most defensible position on this station?” I asked the two AIs, figuring
    one of them would have a good answer to that.


    “This station is not designed for that kind of thing,” Cassiopeia answered.


    Ned added, “So you can take your pick of locations.”


    “We should ambush them in the hangar,” Lara suggested.


    There was no further discussion, and we made our way back to the cart. I then
    drove it as fast as I could to the elevator and through the hallway at the bottom.


    “I’m stalling them,” Cassiopeia informed us. “And I am forcing them to dock in
    Bay 03 because there are several packmules for you to take up positions behind.


    “We just came from a fight like that,” Lara said with a laugh. “So we will be
    ready for it.”


    I didn’t know how true that was.


    Fighting a couple of Twain’s men was hard, but every time I had fought Gregory,
    I had been lucky to escape with my life. My uncle hadn’t been so lucky. The memory
    of that fueled me too. Not that the man who was landing was the same man who had
    done that.


    The actual Inquisitor, the real John Gregory, had been killed. This thing that
    was coming for us had been pieced back together by Twain and made to fight for
    him.


    But it seemed that some part of the old person might still be buried in there,
    and I knew he would fight with fury in the battle ahead.


    After pulling the cart to a stop, we hopped out quickly and headed through the
    door to Bay 03, another massive space but this one was designed to have ships
    land within.


    We all moved into positions behind the various machinery, pulling out weapons
    and getting into cover.


    “I’ll let you know when to fire,” Ned said. “I can pick the exact right moment.
    Everyone take targets from left to right based on their position unless I indicate
    otherwise. Alek, I want you ready to charge at my word.”


    We all understood and waited as the phoenix-class ship came in for a landing.


    The moment the placemags activated, I could feel my heart begin to race. This
    was the moment we had been waiting for. Not only had this station yielded a jackpot
    of information, but we had also caught John Gregory unawares.


    That is, unless Cassiopeia had been faking it and Edwin’s program hadn''t worked.
    She could have been playing the part of a freed slave and told the Inquisitor
    to come here to deal with us.


    This theory proved to be a more distinct possibility as the ramp dropped and an
    entire squad of serfs disembarked before I saw any red armor or black robes. But
    as the Inquisitors followed, I swallowed hard.


    There seemed to be so many of them. One, then another, then another, followed
    by a much smaller Inquisitor with his tail sticking out. I had never seen a Vekrass
    Inquisitor before, but there was a first time for everything.


    I hadn''t wanted to send anyone else, but now I really wished that I had told
    Clynt to follow us with the Buzzard.


    Come to think of it, where had he gone? I didn’t remember telling him what to
    do with the ship other than not steal it, and now I lamented that fact.


    “Ready,” Ned whispered to all of us, and I saw as everyone lined up a shot.


    But John Gregory didn’t follow. He didn’t step from the ship, and I tried to look
    up into the cockpit to see if he was within, but I couldn''t make out anything
    except a vague shape that might as well have just been the pilot’s chair.


    “Hold,” Ned said in what sounded like a Scottish accent.


    We waited for the word, everyone taking slow breaths.


    “Hold,” he repeated, and I kept waiting for Gregory to step from the ship, but
    he didn''t.


    I held my energy weapon steady, lining up the Vekrass and hoping I would seriously
    wound him with my opening shot. If not, it was likely that he would just appear
    behind me and skewer me through the spine.


    “Now!” Ned said, and the room lit up with weapon fire.


    Imogen’s rifle took down a few of the serfs before they jumped to the ground.
    Lara''s weapon blasted the head of one of the Inquisitors, dropping them to the
    ground, and my bolt disappeared into the body of the Vekrass, but I didn’t know
    if I had wounded him or not because he moved so quickly afterward that I couldn’t
    tell.


    My worst version of this had been realized.


    The Inquisitors all lit their weapons, and the serfs pulled guns from their robes.
    It was the first time I had seen these people armed, and while their aim wasn’t
    great, there were still a lot of bullets coming our way. And poorly aimed lead
    punctures flesh just well as a precise shot. Well, maybe not, I’m not entirely
    sure, but it could still do damage.


    Bullet holes broke out all over the side of the packmule I was using for cover,
    but what was worse was the sound of the gun on the phoenix starting to move. This
    was something I had not expected and was going to make this a very short fight.


    Micromissiles were not as small as their name suggested if they were being fired
    at you on the ground. In that instance, they were quite macromissiles.


    Seeing the front gun turning to face us, I tried to think of anything that we
    could do other than just run away.


    I couldn’t.


    Opening my mouth, I planned to holler for everyone to flee, but before I could,
    I heard a clang from under the ground. Something metallic shifted and then another
    bang sounded out.


    The first burst of micromissiles fired from the cannon just as the Mortal Coil
    began to turn quickly. Its two portside placemag legs lifted off the dock, while
    the other two stayed secured, cracking and bending as the ship was thrown onto
    its side.


    It crashed down as though it had been flicked, and it squished a few more of the
    serfs. As it happened, the missiles shot out and exploded against the wall behind
    us, tearing it apart and throwing all of us to the ground.


    In a single moment, the outlook of this battle had changed.


    “She reversed the polarity of the placemags on one side,” Ned squealed with delight.
    “That was one hell of a good idea. I wish William could have been here to see
    it.”


    At the moment, with my hair singed, a ship crashed in front of me, and the wall
    smoldering and melting behind me, I wasn''t thinking too much about what a clever
    idea was. Though, undoubtedly, I was happy it was the hangar bay that had taken
    the damage rather than me.


    I heard a crashing sound and forced myself to my feet, seeing Lara going blow
    for blow with one of the Inquisitors holding what looked like a molten greatsword.
    He swung it with huge slashing moves that Lara was able to defend, but when she
    would try to strike back, he deflected with such strength that she seemed hardly
    able to maintain a grip of her weapon.


    Imogen was exchanging fire with the serfs. She would squeeze off a few rounds
    and then return to cover, where on the other side, the robed figures were trying
    their best to defeat her with their shots flying everywhere. Their aim was so
    bad, though, that I thought they might hit Lara or one of the Inquisitors by mistake
    before they managed to actually get a shot on target.


    In front of me, two more of the Inquisitors appeared, charging at me with blades
    that looked like Lara''s, only they glowed yellow and orange. I activated Ron
    with one hand, and I shot several times with my energy weapon in the other. Orange
    saber’s armor protected her from the first few shots, but a few got through at
    the neck and she fell before she reached me, but the other cut clear through my
    weapon.'
