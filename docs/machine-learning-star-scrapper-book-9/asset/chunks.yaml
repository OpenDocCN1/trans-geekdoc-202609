    “I was in charge of something,” he said unhelpfully. “Something to do with thengar.”


    “Yes,” I said excitedly. “You were to help move a shipment. But to where?”


    He licked at his lips, his nose pulling as though he had tasted something vile.
    “Just kill me!”


    He shouted so loud that I took a step back.


    “Tell me where you were going!” I demanded. “You will live as long as you continue
    to waste time.”


    The Inquisitor closed his eyes, flickering flames now moving toward the building
    behind him.


    “I kept it in a log!” he said as though he had just discovered gold. “Inside the
    building is a book with my notes.”


    “Thank you,” I said and turned to look at Imogen.


    She grinned, pulling the mace from his chest and then bringing it up over her
    head.


    Inquisitor John Gregory opened his eyes one last time to see his former Acolyte
    bring the mace down.


    The weakened flesh and bone caved under the strike, and the body slumped. But
    Imogen kept going. She would not let him come back another time. Again and again,
    she brought the thing down until there was hardly anything left.


    Leaning, I cut the straps that joined his armor and pulled it from his body so
    that we could roll him off the road and into the flames beside.


    As Imogen watched him burn, I hurried to the building that was beginning to be
    consumed by the flames, and Lara came in quick behind me.


    “Just so we are clear,” she said as the two of us hurried in and tried to find
    the journal. “I want that kind of moment with whoever killed Zenobia. That was
    all really perfect closure for Imogen, and I think it would be great for me too.”


    “I’ll get right on that,” I chuckled. “But I am not sure how easy it will be to
    arrange.”


    We hurried past the pews to a table at the back of the room where there were papers
    stacked. Rummaging through, we examined everything, and I lamented not asking
    for more details.


    “All I’m saying,” Lara continued, “is that Imogen got to kill him twice. I’m not
    even asking for that. I just want the chance to cave in the head of the guy who
    hurt my mentor. Is that too much to ask?”


    It was an odd half-joke that I didn’t know quite what to do with so all I said
    was, “I’ll try my best to arrange that for you.”


    “Thank you,” she said just before one of the walls collapsed, the flames from
    outside having burned through.


    I began throwing the papers around, looking for anything that could be a journal,
    but I looked up to Lara, who had stopped moving. She was standing with a self-satisfied
    expression on her face and holding a red, leatherbound book.


    “Maybe you should brag after we get out of the burning building I said,” choking
    on the increasing smoke. My nose and mouth burned, and I knew that I would smell
    like a campfire for days.


    We rushed from the building to find Imogen still staring at the burning Inquisitor.


    A single tear streak on her cheek flickered the reflection of the fire all around
    her.


    As we stepped up to her, she began to speak without looking over at us.


    “I hated him, but he was right,” she said.


    Lara looked surprised. “Right about what?” she asked.


    “He did help make me who I am,” she said. “Him and my family, they all worked
    together inside me to make me… this. I might not like them, I might not even like
    myself sometimes, but I can''t deny that… how terrible they were to me forced
    me to get tough.”


    “All our experiences make us who we are,” Ned said. “If I hadn’t lost William
    and been offlined, I wouldn’t be here now to help you all. I wouldn’t be fighting
    to save the universe from Twain. Again.”


    Lara seemed lost in thought. “I know that someday I will look back at this time
    and realize how losing Zenobia helped shape me, even if I can’t see it now.”


    Lara and I closed in around Imogen, draping arms over her shoulders. She reached
    up to drop her hands on our arms.


    “Thanks you two,” she said. “For allowing me to be who I am and help with all
    this.”


    “We couldn’t do it without you,” Lara said, and she obviously meant it. This woman
    who had mistrusted Imogen so deeply when we first brought her on board was now
    telling the former Acolyte how important she was to the team. And it was true.


    Imogen appeared as though she had a thousand more things to say, but she turned
    to look at me.


    “Can we go check on Alek?”


