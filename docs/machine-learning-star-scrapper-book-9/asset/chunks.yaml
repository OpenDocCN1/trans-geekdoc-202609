    切斯特的金属手击力之大，撞凹了面具，几乎将其压在我的鼻子上。接着，我被巨大的力量撞向后方，感觉就像被车撞中了一样。


    我的头头晕目眩。我看不清什么，对接下来发生的事情也记不清。


    我看到能量弹的残影和永恒火焰武器的冲锋，听到了激烈的战斗声。一道蓝光充斥了视野，面具从我脸上被切落。


    “我叫了杰逊了，”尼德说，但他的声音听起来很远，仿佛在水下对我说话。


    更多的紫色光束划过战场，当一名审判官扶我站起来时，一只手进入我的视野。


    站起来后，我环顾四周。士兵们正在抵御来袭的信徒，而切斯特却不见踪影。


    有些飞船正在起飞，弗朗西斯一动不动地倒在地上。我盯着他的身体，咒骂他为什么不能再配合我一会儿。


    正当一些信徒的飞船正在起飞时，`Buzzard` 号出现在空中，同时从正面和两侧开火。地面上的许多飞船被摧毁，而杰逊带着她降落，降落时放下了坡道。


    推力器的作用下，泥土四处飞溅，拉拉我和尽快向飞船后部跑去。


    我回头寻找克莱特是否在场，希望他能尽快回到我们身边，但当我再次看向 `Buzzard` 号内部时，他正站在那里，手里拿着一个小黑圆圈。


    我们得到了想要的东西，但现在我们需要阻止特莱恩人的逃跑并警告他们的主人。


    “继续射击！”我大喊道，但周围没有人接收命令，因为杰逊和女孩们都在飞船内部深处。


    拉拉扶我进一步往里走，当我们走向驾驶舱时，坡道升起。随着我们的移动，飞船在剧抖，微导弹电池连续发射产生的冲击力震动了整个空间。


    穿行在异常活跃的 `Buzzard` 号中却完全没有参与其中，这种感觉很奇怪。也许我只是脑震了。无论如何，当我们到达驾驶舱时，杰逊正在对地面上的飞船进行第二次攻击。其中两艘已经起飞并正向我们包抄。


    “坐进那些座位！”她命令道，我们尽快系好带，以便她转动飞机进入战斗。


    我想大声提建议，指出我在这里或那里注意到的地方，但杰逊是一个受过训练的士兵，她一生都在战争中度过，不需要我在后座指挥。


    一艘来自旧战时的飞船正朝我们冲来，两门火炮同时开火，飞船再次剧烈抖动。导弹击中了目标，我能听到伊莫根和索菲亚在各自的位置欢呼。那艘路奇曾经是那么想把它撕碎的飞船，现在已只剩下散落在大麦田里的碎片。


    杰逊转头看向我。“我的人给你们准备了一艘可以使用的飞船，”她说，“等我们处理完这些，我会把你们送到集合点”——她倾斜了 `Buzzard` 号，当她带着我们转向另一艘成功起飞的轻型飞行器时，我的脖子猛地一了一下。


    她激活控制装置，前方武器从船头发射导弹。那艘小型信徒飞船避开了射击，急转弯让开道路，但另一波齐射击中了护盾，只是它倾斜着飞离了。


    短程扫描仪显示那个点移开又折返回来，向我们袭来。杰逊翻滚飞机以躲避击中，我记得我更喜欢飞行而不是坐在乘客席。不知为何，当我坐在控制台时，比坐在旁边看着 `Buzzard`
    号俯冲、下跃和旋转要容易得多。


    但杰逊在保持我们存活并继续前进方面做得出色，所以我只能咬牙忍受。而且，我知道我将直接进入下一场战斗，可能还需要几分钟来清醒头脑。


    “阿姆有消息吗？”我问道，杰逊摇了摇头。


    我只能假设当从 `Watson` 号叫她时，她会在那里。


    ***


    两艘飞船中的一艘离开加入了我们的战斗，另一艘则升起并留下了同伴。这并没有让我感到惊讶。审判官们似乎遵循自己的一套规则，那些规则只对他们有意义。


    “压住他们，”我轻声说道，几乎是自言自语，这时那架轻型飞行器再次掠过，发出的快速射击除了略微减少我们的护盾能量外毫无作用。


    但杰逊一定听到了我的话，对着通讯器喊道：“交叉火力，”同时她平了 `Buzzard` 号。女孩们收紧了射击，导弹轨迹将飞船固定在火力之间之间了一小会儿，直到他们拉升。


    当他们向杰逊展示飞船底部的时，她又进行了一波扫射，虽然不足以击碎护盾并摧毁他们，但足以让他们暴露在从后面冲出来的审判官飞船面前并被炸碎。


    我甚至什么都不用说，杰逊就拉升了，带着我们离开行星表面前往 `Tidal`。


    “你那边还好吗？”当我们通过涡流管时，拉拉问我。


    我看着她说：“还好。”


    “没怎么有服力，”她回答道，我确定那是事实。


    ***


    我可能只是脑震了。无论如何，当我们到达驾驶舱时，杰逊正在对地面上的飞船进行第二次攻击。其中两艘已经起飞并正向我们包抄。


    “坐进那些座位！”她命令道，我们尽快系好带，以便她转动飞机进入战斗。


    我想大声提建议，指出我在这里或那里注意到的地方，但杰逊是一个受过训练的士兵，她一生都在战争中度过，不需要我在后座指挥。


    一艘来自旧战时的飞船正朝我们冲来，两门火炮同时开火，飞船再次剧烈抖动。导弹击中了目标，我能听到伊莫根和索菲亚在各自的位置欢呼。那艘路奇曾经是那么想把它撕碎的飞船，现在已只剩下碎片散落在大麦田里的碎片。


    杰逊转头看向我。“我的人给你们准备了一艘可以使用的飞船，”，”说，“等我们处理完这些，我会把你们送到集合点”——她倾斜了 `Buzzard` 号，当她带着我们转向另一艘成功起飞的轻型飞行器时，我的脖子猛地一了一下。


    她激活控制装置，前方武器从船头发射导弹。那艘小型信徒飞船避开了射击，急转弯让开道路，但另一波齐射击中了护盾，只是它倾斜着飞离了。


    短程扫描仪显示那个点移开又折返回来，向我们袭来。杰逊翻滚飞机以躲避击中，我记得我更喜欢飞行而不是坐在乘客席。不知为何，当我坐在控制台时，比坐在旁边看着 `Buzzard`
    号俯冲、下跃和旋转要容易得多。


    但杰逊在保持我们存活并继续前进方面做得出色，所以我只能咬牙忍受。而且，我知道我将直接进入下一场战斗，可能还需要几分钟来清醒头脑。


    “阿姆有消息吗？”我问道，杰逊摇了摇头。


    我只能假设当从 `Watson` 号叫她时，她会在那里。


    飞船最后又掠过了一次，我看到 `Mortal Coil` 号从行星表面升起，另一艘审判官飞船紧随其后。

