  raw: 'We all pointed our weapons toward a large door at the far side of the space
    where it sounded like the noise had come from. Sophia had her camera pointed that
    way. Her whole body was shaking with terror.


    Imogen, seeing my look, turned to her friend. “You okay? We will keep you safe.”


    “It’s not that,” Sophia said. “It''s where we are.”


    Imogen puzzled at her. “What about it?”


    “We are in space,” she said. “If something goes wrong or you start shooting, we
    could be sucked out into the vacuum of endlessness and die out there. I don’t
    want to suffocate or freeze to death.”


    Imogen smiled at her. “You’ll stop thinking about that soon.”


    “I’ll never stop thinking about that,” she said, and I wondered if that was true.
    The girl had been raised in open spaces and had no experience with space travel.
    She had held it together pretty well and survived on the station, but I guess
    there was something different about feeling unsafe out in space. Like being trapped
    on a raft in waters you know to be full of sharks.


    “There are a lot of fail-safes in a place like this,” I said, trying to soothe
    her, but I could tell she was all up in her own head about it. “Let’s keep moving.”


    But before we reached the far side of the room, a man in scrubs came walking out,
    pulling rubber gloves off his hands. When he looked up at us, he froze, and we
    all kept our weapons pointed directly at him.


    “Hello there,” I said with a friendly smile. “Why don''t you come here and talk
    to us.”


    His eyes flashed between all of our weapons, and I could see the exact moment
    when he decided to turn and try to run back through the door.


    Lara saw it too and had put a bullet through his kneecap before he had even taken
    a step.


    He cried out and fell to the ground. “Why would you do that?” he asked, weeping
    and sniveling.


    “Why would you run?” Lara asked, her voice cold as ice.


    He looked at us, keeping his hands up as though we wouldn''t be able to put a
    bullet right through his flesh.


    “Any sane person would run from armed gunmen invading their workplace,” he said.


    I laughed. “You do have a point about that,” I allowed. “But now I have to ask
    you what kind of workplace this is.”


    He looked at me as if I was the biggest idiot on the planet. “It''s a hospital.”


    I stared at him in disbelief. “You actually think that''s true, don''t you?” I
    asked.


    “It is true,” he stated with such absolute certainty that it was hard to believe
    we were dealing with any kind of rational person. Of course, we weren''t. We were
    dealing with somebody who had been converted to one of Twain''s Disciples. He
    was obviously not the remote-controlled kind that still hadn''t been perfected
    but the original, semi-autonomous kind.


    “Then take us to where you keep your patients,” Lara demanded.


    He shook his head. “My duty is to do no harm,” he said. “I won''t take you to
    where you can hurt them.”


    “You are the one who is hurting them,” Imogen snarled with a combination of passion
    and disgust coating her words. “You are the one who has taken them from their
    homes and made them into slaves.”


    The fear that crossed his face was the pure terror of somebody who believed that
    they were in the company of a truly unpredictable and dangerous human. He so deeply
    believed that what he was doing was noble because his brain had been reprogrammed,
    and hearing the actual truth sounded to him like some tin-hat-wearing weirdo shouting
    on the street corner while holding a knife.


    He wasn''t capable of believing us, of hearing what we had to say or even understanding
    the words. Not really.


    “Leave him,” I said. “Twain rewired him, and he’s not ever coming back.”


    I checked Sophia’s reaction to gauge if this kind of thing would be upsetting
    to the outside world, but she seemed to still be stuck on the being-out-in-space
    of it all. And anyway, it probably wouldn''t be so scary if you didn''t know that
    there were people being kidnapped and taken here.


    We had to find the proof.


    Lara darted the man in the scrubs, and he went limp instantly, crumbling into
    a pile on the vinyl floor.


    “Can people like him be saved?” Sophia asked.


    As we pushed through the doors behind him and into another long hallway, I thought
    about the question. “I''m not entirely sure how far gone these people are. Perhaps,
    with Edwin''s program, we would be able to help them, but it''s also possible
    that what little of their brain is actually left wouldn''t be enough to survive
    on.”


    “What he’s trying to say is that we don’t know,” Lara filled in.


    “Shouldn’t you?” Sophia questioned.


    I had to consider that. “Yes,” I admitted. “It''s something that we should look
    into. But I think it would be complicated.”


    “Is it though?” she asked. “Couldn''t you just bring him back and let your doctor
    and my dad do a little bit of an investigation?”


    “There''s more to it than that,” Imogen helped out. “In addition to the fact that
    we would be taking a prisoner, which we haven''t ever really done, if our enemy
    can track his people, he could send a fleet to our base and destroy us. You have
    to understand that the villain we''re fighting now is not just some rival tribe
    or a company, but an advanced, deep-learning artificial intelligence determined
    to combine the organic with the machine.”


    She was largely reiterating what I had said as we exited the ship, but it helped
    to make the point and would make good footage for later. I didn''t know how much
    of any of this we would use or how much I would want to let the Peacers access,
    but each and every moment might help.


    “Smell that?” Lara asked, stopping where we were in the hallway and breathing
    in.


    I did the same, but all I could smell was whatever disinfectant they used to use
    in this hospital. “What?” I asked.


    “Smells like people,” she said.


    I smiled. “Okay, Clynt.”


    “I’m serious,” she said. “I smell BO and piss, and I think there are people being
    held somewhere around here.


    But it was still so quiet in the large, long hallway that it was hard to believe
    there was anybody around. Unless, of course, they had been here recently and were
    moved.


    “We should all start checking,” Lara said, pointing to the doors along the sides
    of the corridor.


    I pushed one open, and inside there was a small exam room with nothing in it except
    dust and cobwebs.


    “Nothing,” I said.


    Lara said the same as she opened another door, and Imogen, one a bit further up.


    This felt like an exercise in futility, but I wasn’t going to doubt Lara. Rather,
    I would just let the proof do the talking for me.


    “Nothing,” Lara called after throwing open a door.


    I walked over to the next one beside me and opened it.


    I couldn’t believe what I was seeing.


    29


    ![](OEBPS/image_rsrc3N4.jpg)


    Lara wasn''t just right, but she was right in spades. The room was full of dozens
    of cowering people, looking at me in abject terror as they huddled together in
    little groups. There appeared to be people from all over the universe, and different
    species, all awaiting the same grim fate. But none of them spoke, and I assumed
    they had been warned against it. At the far side of the large, empty room, a Disciple
    looked up at me.


    By the time he raised his rifle, I had already fired a bolt across the room from
    my newly replaced energy weapon. All the people gasped and watched as the man
    who had been keeping them in place fell to the ground.


    All eyes turned to me.


    I saw the bright light come up behind me and knew that Sophia had arrived with
    the camera. She gasped when she saw all the people and moved the camera from them
    to me.


    For lack of anything better to say, I simply announced, “We''re here to rescue
    you.”


    Everyone seemed too scared to even register what I had said and either stared
    at me or whispered to one another.


    “I’m going to get you out of here,” I said. “But we are going to need to be smart
    about this.”


    But before any of them could react, an alarm started blaring through the room,
    and red lights began to flash. This caused everybody to cower even more and look
    at each other with absolute panic.'
