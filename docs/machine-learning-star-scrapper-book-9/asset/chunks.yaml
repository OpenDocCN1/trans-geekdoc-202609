  trans: '

    尽管预知这一刻会发生，但当他大声吼道时，我还是几乎魂飞魄散。但每当我们练习时，我都越来越擅长在黑暗中摸清飞船的路线。我一次忍受了他发出的动物怪叫，另一次忍受了他向我投来密雨般的球，甚至还有那被他恰好安置好等在我拉动杠杆时掉在我身上的橡胶蛇。


    当时我觉得这太烦人了，但现在当我趁着飞船向星球坠毁的过程中穿过船舱时，我感到比任何时候都要快乐。好吧，显然我本可以更快乐，但我依然很感激。我的肌肉酸痛，胃部感觉像要跳出体外，但在黑暗中，我伸出手，摸到了那个我知道就在那里的把手。在拉动之前，我先向前拖身体，将自己抵在墙上，把自己固定在船体侧面的螺栓安全带上。


    一旦系好，我口中念道：“抓稳屁股（Hold onto your butts）”，心想内德能不能听见我的话。我转动杠杆，听到控制板在强力滑道从飞船上撕裂并展开之前飞了出去。片刻，“秃鹫号”剧烈抖动了一下，我感觉自己仿佛要从墙上甩掉，但谢幸的是，在飞船开始缓慢下降之前，我的头只是猛地甩了一下。


    这件事解决了。


    但当我们感觉到“秃鹫号”轻地飘落时，我们面临着许多问题。飞船降落在地面上，我们尽可能快地行动起来。


    飞船内部一片漆黑，拉拉用手电筒引路。在她身后，阿莱克抱着伊莫金，伊莫金无疑在我们……我们该称之为着陆吗……期间昏迷了。


    “他们是谁？”克林特问道，尽管听起来更像是在问，“我们要去追谁？”


    “我不知道，”我承认道，由于呼吸困难，话语艰难地挤出来。“我们都有很多敌人。”


    “噢，我不确定这个，”拉拉开玩笑说，“我们的敌人只有政府、审判局、假冒审判局、海盗、和平者的敌人、血龙人，还有……我记得还有某个被我们得罪的犯罪集团……”


    “这些团体似乎都不像我们刚才那样，能让我们措不及防，”克林特说道。当我拉紧肩膀上的带子时，我在光束中看向克林特。“那些团体中的任何一个，其组织里可能都有一个非常聪明的人。”


    阿莱克清了清嗓子。“尽管我很喜欢这个‘猜猜是谁想杀我们’的游戏，但我们需要离开这艘飞船并评估一下状况。”


    “对，”我同意道，我们一起回到了可以手动开启侧舱的地方。现在我们无法通过货舱道下去，于是我费力扳动锁闭机构，打开那扇嘎吱作响的门，让附近恒星发出的亮光洒进飞船内。


    热量渗透进飞船，当你呼吸时感觉空气很沉重。但空气是可以呼吸的，这算是一个胜利。我先爬下去，走上星球上坚实的灌木丛表面。我眨了眨眼睛，试图让眼睛聚焦，因为视线所及之处全是一片明亮的浅棕色。我讨厌这种星球。


    “为什么那些拥有理想资源的星球总是是这种荒凉的荒野？”我问。


    当拉拉跳下来时，她的靴子踩在坚硬的页岩上发出咯吱声，她回答道：“我觉得如果内德在线，他要么会给我们一个逻辑严密的解释，要么会坚持认为虽然感觉是这样，但在统计学上其实是不可能的，资源丰富的星球和其他任何类型的星球一样可能变成这样。”


    这让我想起来了。我伸手进包里，掏出内德的立方体。并不是说看着它能给我什么迹象，但他显然没有说话，仍然处于离线状态。“我猜他很快就会回线的，”我说，在手里翻转着立方体。“与此同时，我确定‘混蛋块’在那个斗篷盒里依然保护得完好的。”


    然后我看向飞船，仿佛他可能像某种外星威胁一样在船上逃脱了。但当阿莱克跳下来，脚落地踩碎了地面时，他朝自己背后背着盒子的方向点了点头。我看着他怀里的伊莫金。她的呼吸很浅。


    “如果你们大家都在提供免费便车，”克林特出现在门口说道，“我很乐意上车。”他从门口跳到飞船，又跳到阿莱克的肩膀上。基罗格只是笑了。“还有别人吗？”他看了看拉拉和我。“也许你们每一个人都可以绕在我的腿上，我可以像穿着沉重的鞋子一样，带着你们走过这一切。”


    “听起来还不错，”拉拉带着微微的微笑说道。“真正的问题是，我们往哪儿走？”


    “往那边，”克林特说，指着一个看起来完全随机的方向。


    我挑了挑眉看着他。“为什么？”


    “不是因为我是什么占卜棒之类的，”他说。“我只是从那个方向的空气里闻到了人类的汗味。”


    “多远？”拉拉问道。


    “光是告诉你们往哪走还不够吗？”他问道。“我只知道，某人的臭味股就在那儿。”

