    “I’m so sorry for your loss.”


    “We all are,” Alek said, and Imogen reached out to rest a hand on Lara’s shoulder.


    My old friend nodded, her eyes growing wet but refraining from crying. “Thank
    you all,” she said. “And, Ned, sorry that you had to find out what happened to”—she
    paused for just a moment—“Captain William West, Hero of the Five Battles and Captain
    of the Starblaster.”


    She said it in a respectful and dignified tone, and Ned just said, “Thank you.
    That really means a lot. Though it sucks that it happened and I really wish that
    I had a body so I could put some hurt on some Disciples of Twain.”'
