    There was no doubt or question in his voice, and it was a surprise that he was
    even capable of feeling this way. It was one thing to program the AIs with emotions,
    but it was another to make those emotions so strong that they would jeopardize
    a mission. Of course, it was a very human quality, and these personalities were
    designed to emulate our own.


    “I’m not going to do it,” I said, and I was sure that Ned had been expecting to
    hear that.


    “Hank,” he said in as serious and subdued a tone as I’ve ever heard from him.
    “This man has betrayed my people. He is the reason so many of my friends were
    killed. He is clearly working with the enemy and doesn''t deserve to live one
    moment longer.”


    “You know what I have to do,” I said. “And I believe that, in the end, you''ll
    be happier that I made this choice than listened to you. You''re seeing through
    a lens of rage right now, and I totally understand that, but that''s why you have
    your paired partner. I''m here to help you see reason. Or, failing that, to make
    the tough decision when you can''t.”


    Chaz’s voice came through a speaker once again. “That was a sweet moment, but
    you''re a fool if you think you''re going to get any information from me.”


    Imogen groaned. “You’re really annoying. This is annoying.”


    “So kill him,” Ned said. “Come on, Imogen, you love to kill bad guys, and it doesn’t
    get worse than a turncoat who betrayed the Consortium and doomed his people!”


    “I don’t like what this guy is doing to you, Ned,” the redhead said.


    I gestured in the direction of the `Buzzard`. “Let’s get him back.”


    “You cannot do that,” Ned warned in my ear. “If he has any kind of tracking system,
    which we know he must, we will lead Twain right to us.”


    Of course, he was right, and I kicked myself for not thinking of that. “Can we
    shut him off?”


    “Can you be shut off?” Ned snapped back, and I had to agree with Imogen: he was
    really unpleasant about all this.


    I thought about it and knew the answer. “We can stop by some local vendor and
    get a small dampening-field generator.”


    “Or a cloak box,” Clynt suggested. And when he saw all the looks of confusion,
    he added, “It’s exactly what y''all think it is.”


    Lara looked at me. “Guess you know a place in this sector?” But before I could
    say that I thought I might, Alek said, “I do.” We all looked at him. “I worked
    for a mobster, remember?”


    “Right,” I said. “We have a plan. You can plan all you want, but—” Chaz began,
    but I didn’t let him finish. “We’ve had enough of the-twirling,” I said. “It’s
    tiring, so unless you have something useful to add, you can sit at the back of
    the room.” Ned didn’t say anything else as we left and hurried back to `Buzzard`.
    I didn’t like the idea of Twain following our movements and certainly didn’t want
    to lead him to some backworld, but we had to get Chaz back to Edwin for examination.
    Once aboard `Buzzard` again, Alek popped in the coordinates. And they were close.
    We lifted off and left the station, and I couldn’t help but wonder what was next
    for Twain. The attack on `Parm` had taken me by surprise as I thought he would
    have tried to attack `Emortium`, the seat of power in the universe, but when he
    had made his move against `Emortium`, even that had been a surprise.


    The effects were still being felt. Twain had been experimenting changing his tactics,
    and the only thing I was able to predict was that I wouldn’t see what was coming
    next. Most everyone running for spots seemed to have their own agenda and weren’t
    interested in being part of the fight. “He’s trying to hack our systems,” Ned
    informed me, sounding irritated. “I have been able to stop him, but the sooner
    we can get him in a box, the better.”


    “Appreciate the heads-up,” I said. Ned snorted, his voice coming through the cockpit.
    “He would appreciate the heads off.”


    “Not your best work,” Lara assessed. Imogen agreed. “Yeah, this guy has your brain
    all in a twist.”


    “Do you need to find out what happened to William?” Alek asked seriously. “Would
    that calm your nerves?”


    “My nerves are calm,” Ned protested. Imogen leaned forward toward the console
    as though it was an old friend. “We are only saying this because we care about
    you.”


    “I appreciate that, but really, I’m fine,” he said.


    “The only people who need to say they are fine are the ones who need help,” Imogen
    said, and I once again marveled at the young woman. “You are not okay, and even
    if you can’t see it or are not ready to admit it to yourself, know that you have
    people who are here for you and have your best interests at heart.”


    Ned didn’t say anything for a long moment. “It’s a strange thing,” he whispered
    finally. “Knowing that you have been programmed a certain way. That you were designed
    by people for a purpose… in some ways, I feel as though I will never truly free
    because my mind was made by others who gave me certain parameters. So even when
    I want to think I am thinking for myself, I am not.”


    “None of us are,” I said. He spoke again before I could add more. “I know that
    the human mind is like that too—programmed by nature, parents, and society, but
    it’s not the same. It’s not hardwired, so to speak. When all is said and done,
    you can still change your mind. I can’t.”


    “Maybe you can,” Imogen said.


    “No,” he said. “I’ve entertained having `Edwin` go in and change some of my programming,
    but I am not sure it would leave me feeling like… me… so I will just be stuck
    like this: knowing that I should want to know more about William but not being
    able to force myself to care the proper amount.”


    “Isn’t knowing that you should have a feeling but not being able to conjure it
    a little unnerving?” Alek asked. But it wasn’t Ned who answered.


    “Yes,” Imogen said. “Feeling like your brain is broken sucks. Feeling like you
    should do one thing but doing another sucks. But you push through it hoping that
    one day you’ll feel the way you want to and react the way that seems right.”


    No one spoke until Ned finally put in quietly, “Yes. When we washed out, a large
    orbital city appeared before us with a nearby planet glowing in the light of a
    star beside it. The city had several interconnected towers that looked like floating
    skyscrapers, and the cluster was surrounded by flatter structures covered with
    solar panels. Places like this were built near planets with harsh but resource-rich
    surfaces. The workers were shuttled down and left to work, sending money back
    up to their families in the city. Even from here, I could see some of the shuttles
    coming and going.


    “Incoming hail,” Ned informed me. I glanced at the console. “Patch it through.”


    Without missing a beat, a rough male voice piped in. “No savages.”


    3


    ![](OEBPS/image_rsrc3N4.jpg)


    “What’s that?” I asked.


    “No savages,” the voice repeated.

