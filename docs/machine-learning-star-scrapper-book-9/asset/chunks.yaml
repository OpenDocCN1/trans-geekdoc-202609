  trans: '


    “伙计，那家伙真是个停不停的人，”尼德通过扬声器说道。


    拉拉用怀疑的表情看着我。


    “是你说过你喜欢冒大险的，”我提醒她。


    她挑起了一边眉毛。“你应该比我更清楚，千万别试图用一个女人的话来对付她。”


    “这办法对你根本没用过，”莉比补充道。


    我决定什么都不说才是明智的，过了一会儿`Ammo` 的声音切入了房间。


    “汉克，我的朋友，近来怎么样？”她问道。“猜你打电话来不是为了叙叙旧，那么你在哪里需要一支军队？”


    我笑了起来。“听到你的消息总是好的，`Ammo`，”我说。“你说得对。我需要一支舰队规模的支援来帮助炸毁一艘被偷的医疗飞船，那艘船正被用来把人转化为敌人的无人机。”


    “哟，哟，哟，”她笑着说道。“你可真是总是带来最精彩的场面。”


    我耸了耸肩。“麻烦似乎总是围着我转。”


    “确实如此，”她说，“我猜你需要大杀器？”


    “是的，”我迅速回答，知道我们需要尽可能获得所有的帮助。


    她点了点头。“我会和`黄 Admiral` 谈谈。但我想，如果你希望他继续支持你，很快就得去拍拍他的屁股了。”


    “那不是我最擅长的，”我说。


    她满脸喜光。“如果你想在这个世界上继续步步高升，你就得精通这一点。你要接触的大员和政客会越来越多，你讨好这些人的技巧越熟练就越好。”


    `Ammo` 以前提过这一点，我知道她是对的。“行，只要你们明天带些武器来聚会，我愿意练习讨好那些戒指和屁股。”


    她点了点头。“我觉得可以安排，”她说，但接着她凑近了身体，声音低了下去。“你也需要做些什么。”


    “什么？”我问道，身体的疼痛和疲劳让我开始感到头疼。


    “你以后执行这种任务时需要带上一台相机，”她说。


    我摇了摇头。“什么？”


    “汉克，你有高尚的事业，但你的公关做得太糟糕了，”她直白地说。“和平者一直很擅长传递我们的信息，但现在有了这个大坏蛋敌人，宇宙中没有人相信它。好吧，是时候让他们见识一下了。所以，如果你打算掉某个制造机器人士兵的工厂，我们就给人们看。政客们会试图否认，媒体可能会试图掩盖之，但如果人们开始在织物网（feltwork）上分享并讨论，那就是进步。”


    我呻吟着道。“我想你是对的。”


    “我知道我是的，”她说。


    “我会试着在下次进行这种活动之前弄来一台相机，但我怀疑在明天之前弄不到这儿，”我说，我真的不想成为任何种的名人。被推上这个领导位置已经够糟糕了，我尤其不想出现在镜头里。”


    “你知道最好笑的是什么吗？”`Ammo` 问道，我知道她等下要说的绝对不是为了逗乐我。“其实我上次在空间站时，已经让我的人留了一了一整套相机设备。所以，我想你可以从明天的任务开始起。”


    莉比尖叫起来。“太酷了，”她说。“我想长大后也当那样的。”


    “好了，行，”我说。“我会开始的。”


    `Ammo` 哼了一声。“别装得像是我在帮你忙似的，”她说。“我只是在试着帮你成为完成这件事所需要的人。”


    我身体靠向画框。“我们都在努力做这一点。我用手掌拍了一下 `Lara` 的脸并推开她，但她吐了吐舌头。真恶心，”我说，一边在裤子上擦了擦手。“你从小时候就这样了。”


    “而你每次都上当，”她说，向我吐了吐舌头，然后离开了房间。“我去睡觉了。”


    “也许你也应该，”`Ammo` 说，眯着眼睛盯着屏幕，仔细观察我。“你脸上还有东西。”


    她指了指我的额头，然后指向了我的整个头。“如果你想看实战，我真的应该跟着你。”


    “明天见，”我说。我靠在椅子上，几乎要睡着了。“我说你应该去睡觉了，”`Clynt` 说，“但我认为你应该先洗把脸……。”


    我站起身，身体渴求着休息，走向我的舱房，还没等脱靴子就昏睡过去。稍些时候，虽然时间太早了，我被敲门门声吵醒了。


    ![](img/image_rsrcN4.jpg)


    我利用床边的墙强迫自己坐起来，差点朝门方向摔倒。再睡几个小时，或者也许几天，现在实在太早了。按下按钮，打开门，看到 `Imogen` 站在我面前。她显然洗过澡并换了衣服，现在穿着一套印有
    `Suniu Relay` 名字和标志的灰色运动服。


    “怎么了？”我问道。她看起来几乎有些愧疚。“我有件事想请你帮忙。”我揉了揉眼睛里的疲惫。


    “除非你有咖啡，否则我不确定我能满足任何要求。”


    她从身后拿出一只冒着热气的杯子。“谢谢你。”


    “我知道该怎么要求的，”她说。我坐在床边，穿着全套盔甲。“什么事？”我重复道，喝了一口咖啡。。“这整件事让我很乱，”`John Gregory` 说道。


    “我倒觉得，”我我又喝了一口。“那么我能为你做什么？”


    “你认识 `Sophia` 吗？”她问道。


    “我的朋友？”我说，我不确定这事的走向。`Imogen` 移开头又看向我。“`Imogen` 走上前去。“她想来帮忙，我想给她这个机会。”


    “和平者们，对吧？”尼德在我的耳机里说。“他们总是那么急于投入战斗。”


    “我只是……”我开始说，但 `Imogen` 的脸垮了。“如果这对你来说那么重要，对我来说也意义重大，”她说，神情变得非常难过。“考虑到父母那么糟糕，还有那个刻薄的审判官……”但我抬手示意让她住口。“好了，你可以省省这些戏码了。”


    “噢，拜托，”她抱怨道。“我觉得我可以为此流下眼泪。”我摇了摇头。“不，你不会的，”我告诉她。“但如果这对你来说真的那么重要，我确实有办法让她去做。”


