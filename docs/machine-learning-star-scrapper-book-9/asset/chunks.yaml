    Even if they won here today, it would be a pyrrhic victory.


    Two women holding rifles that I had repaired this afternoon, but that felt like
    a lifetime ago, slammed in beside us.


    “There are a lot of them,” one of the women said, her face streaked with dirt
    and blood.


    I peeked over the pile for just a second, seeing the miners in their positions
    behind barrels and carts and pallets. But I could see their fear, too. Some were
    determined, but most were scared and didn’t want to be there.


    “Aim for the guards first,” I instructed.


    Looking out again quickly, I saw that there were only a few left, maybe four.


    “And focus on anyone who you see shooting at you,” I continued. “If you see the
    muzzle flash, you’ll know where to shoot. If you don’t, you might not have to
    bother.”


    I was hypothesizing a bit, of course, but I believed what I was saying, and either
    way, taking on the trained guards first was going to be the right course of action.


    The women glanced at the girl beside me. She nodded. “Listen to him. We’ll get
    through this, and it’ll all be worth it.”


    I was impressed, once again, that this young person was able to maintain her cool
    quite literally under fire.


    They all looked at me.


    “Ready,” I said, then the three of them turned and got their bodies prepared.
    “Now.”


    At once, we all leaned out from the pile and then started firing. The star had
    set, and bathed in the glow of the floodlights, we exchanged bolts and bullets.


    As expected, some of the miners did nothing but point their weapons at us until
    the first shot was fired and then ducked behind cover. These people didn’t want
    to be shot for their company, and I couldn’t say I disagreed with that. They wanted
    to return to their kids more than they cared about their jobs. And if they were
    fired for not taking up arms against angry locals, then the company was a horrible
    employer anyway.


    I managed to take down one of the guards before drawing so much fire that I had
    to duck back down. The leader cheered as she got another, and one of the two women
    was at least able to squeeze off a few shots before being forced down. The other
    took a bullet to the shoulder and fell to the ground, wailing.


    More of the ’facers came rushing in with Lara at their back. Rather than stopping
    at our pile, they charged forward. Several of them had pilfered machine guns from
    the bikers, and they unloaded rounds into the miners.


    We took this opportunity as well, popping out from behind our pile and taking
    aim at the guards. Many of the miners were cowering, but some were still making
    a stand. Or they were until the revolvers began firing.


    From behind them, the thief began picking them off, and a moment later, there
    was nothing left but smoke and panting people. The few miners who remained raised
    their hands in surrender, and all of the locals looked at one another, smiles
    growing on their faces.


    Then one cheered.


    A man lifted his gun into the air and firing off a few shots.


    Then another.


    And soon, every one of them was screaming with what was probably a mixture of
    jubilation and adrenaline. Lara and Clynt made their way over to me, and I pointed
    in the direction of a small mechanic’s tent off to the side of the open space
    in front of the entrance to the mine.


    We stepped over, and I explained what we were looking for.


    “You got shot again,” Lara said, pointing down to my hand as I reached out to
    grab a flashlight that was sitting on a workbench.


    “Y’all just can’t help yourself now, can you?” Clynt asked with a laugh. “I just
    downed a bird and won this battle without getting nary a scratch.”'
