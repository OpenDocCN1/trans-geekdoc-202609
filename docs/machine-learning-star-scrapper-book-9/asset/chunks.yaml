  trans: "\n\n“当然了，”她说道，观察着他的反应。他的脸上布满了深深的皱纹，下巴上的青胡须仿佛随时会长成胡子。他波浪状头发油腻地贴在头皮上，每一个眼神似乎都隐藏着怒意。\n\
    \n他向她推过一个玻璃杯，她仰口一饮尽。\n\n“为什么似乎每当我们进行这种审问时，总会有你的人参与其中？”她问道，盯着他的脸等候他的反应。\n\n但他只是耸了耸肩，仿佛这没什么大。“捕猎者很擅长他们的本行，当有那么多资金易手时，人们难免会产生嫉妒。这一切都源于此。你不是接纳了那个向委员会哭诉这件事的猎人吗？”\n\
    \n她讨厌他这种定性一切的方式。\n\n“我今天招收了两个新猎人，”她回避地回答道，“既然我没赚到那么多捕猎者的钱，我总是乐意增加一点额外收入。”\n\n\
    他冷笑一声，然后越过她，看向门外，另一名紫衣斗篷正在那里等候。“我想那是给你的，”他说，她转过头看到新守卫正向她招手。\n\n“回头见，”她说完，放下杯子，比以往任何时候都更加坚定地走出吧吧。\n\
    \n“什么事？”她向紫衣斗篷质问。\n\n守卫直视她的眼睛说道：“其他的委员会成员也会收到通知。法尔科·罗恩（Falconer Roan）被发现死在牢房里，显然是自杀。”\n\
    \n阿娜感觉脑袋要炸开了，当她转向普德（Purd）时，他正举起杯子。\n\n![](img/image_rsrc3N5.jpg)\n\n亚马逊并不总是通知你下一次发布。要获取该系列的最新动态，务必在\
    \ [jnchaney.com](https://www.jnchaney.com/star-scrapper-subscribe) 订阅我们的无垃圾邮件列表。\n\
    \n汉克将在[HUNTER ASCENDED](https://alsoby.me/r/amazon/B0DPW2PYQB?fc=us&ds=1)中回归，该书可在亚马逊购买。\n\
    \n![](https://www.facebook.com/groups/678620228994951/) \n\n加入对话，并在异常活跃的 [Facebook\
    \ 群组](https://www.facebook.com/groups/678620228994951/)“JN Chaney’s Renegade Readers”获取新书及即将发布的更新。\n\
    \n这是一个读者聚集在一起分享生活与兴趣、讨论系列，并直接与 J.N. Chaney 及其合作者交流的热点。\n\n[加入 Facebook 群组](https://www.facebook.com/groups/678620228994951/)\n\
    \n![](https://www.jnchaney.com/star-scrapper-subscribe) \n\n不要错过这些专属福利：\n\n* \
    \  立即获取《信使者》（The Messenger）、《星守者》（Starcaster）等系列的免费短篇。\n*   接收新书邮件更新。\n*   当我们对书籍和有声书进行特惠活动时将收到通知。\n\
    \n所以，你在等什么？在下方链接处输入您的电子邮件地址以保持关注。\n\n[点击此处](https://www.jnchaney.com/star-scrapper-subscribe)\n\
    \n# 与 MATTHEW A. GOODWIN 连接\n\n[查看他的个人网站](https://www.thutoworld.com)\n\n[在 Facebook\
    \ 上关注](https://www.facebook.com/ThutoWorld/)\n\n[在亚马逊上关注](https://www.amazon.com/stores/Matthew-A.-Goodwin/author/B07TXWJBWX)\n\
    \n# 关于作者\n\nJ. N. Chaney 是《美国今日报》畅销书作家，拥有创意写作艺术硕士学位。他自认为是一个超级超级马里奥粉丝。当他没有写作或玩游戏时，你可以在\
    \ jenchaney.com(https://www.jnchaney.com/) 上找到他。\n\n他经常搬家，但最后一次出现在内华达州拉斯维加斯。任何踪迹都应予以报告，因为这非常罕见。\n\
    \n![](img/image_rsrc3N5.jpg)\n\nMatthew A. Goodwin 从小就开始创作关于飞船和龙的冒险故事。在十二岁时创造了自己的第一个幻想世界后，他继续在业余时间写作。他的白天是动物园园员，但当儿子出生后，他决定追求成为作家的终身梦想。\n\
    \n由于他一直热爱宏大的太空歌剧和探索人类与技术关系的硬核赛博朋克故事，他撰写了国际畅销系列《赛博朋克传奇传奇》（A Cyberpunk Saga）。他的热情还激发了他创建并共同创立了赛博朋克日（Cyberpunk\
    \ Day™）。欲了解更多信息和免费内容，请访问 thutoworld.com(https://www.thutoworld.com/)。\n\n"
