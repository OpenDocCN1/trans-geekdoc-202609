    who created them all, and he’s just waiting for the right moment to activate them.”


    I activated the Tidal Drive, and I thought about what she said as we entered the
    gyre tube. “Why would you put that in my head?” I asked, genuinely wishing that
    she hadn’t.


    “It’s not like that,” she said, dismissing it entirely. “If he could have done
    that, he would have during the war. He would also have used Ned to find you before
    you even made it off Bussel, and there are a million other reasons it’s obviously
    not true.”


    I thought about it. “I guess you’re right, but that would have been one hell of
    a twist.”


    “We’ve had more than enough twists,” she said. “The fact that he brought back
    John Gregory to take over half the Inquisition and kill half the government was
    more than enough, thank you.”


    “I guess,” I said, still pondering the AI thing.


    “And he already has sleeper agents in the form of the people he’s kidnapped and
    hacked,” she added. “We don’t need anything else.”


    “I mean, we also have the trappers,” I said.


    She snorted. “Don’t remind me.”


    “Why does it bother you so much?” I asked.


    She looked at me as the tube sloshed around it. “You know why.”


    “I do,” I said and then added something I had heard Sophia say to Imogen. “But
    I just wanted to give you space to open up about it if you want.”


    “I appreciate that,” she said. “I really do. But I don’t want to open up about
    it. I want to problem-solve.”


    “I understand,” I told her.


    She looked at me, locking eyes and seeming present for the first time. “But I
    like to know that you are here no matter what.”


    I smiled at her. “I am. Always.”


    Her lip turned up, then she leaned her head back in the chair and stared out of
    the cockpit.


    I looked down at my hand, the Hospi-Gel having already begun the healing process
    and the painkillers making it so that I could still walk. But nothing could fight
    off the exhaustion, and I didn’t wake up until the Tidal Drive chimed to let me
    know that we would be washing out soon.


    Lara was gone, but she showed up a moment later with half-dry hair. “Showered
    on the ship since I never know when I’ll get another opportunity,” she explained
    as though I had asked, but when she held forward a cup of coffee, I grinned.


    “Wasn’t it cold?” I asked.


    She shook her head. “No,” she said. “The showers on here used to be so frigid
    they would take your breath away, and then I pestered you into installing a new
    heater.”


    I took a sip of the coffee and nodded at the memory of it. “That’s right,” I said.
    “It was so nice taking that afternoon to work on it.”


    “And here I was thinking that you did it for me,” she said.


    I snorted a little laugh. “Stuff can be two things.”


    We strapped in, set our cups in the holders I had affixed to the console, and
    landed at the Conclave.


    As it somehow always seemed to be when we visited here, it was early morning.
    And it was convenient because after some sleep and a coffee, my brain also wanted
    it to be early morning. So that worked out nicely.


    I landed in the lot near Zenobia’s office, and when we disembarked, the nearby
    star was just rising over the Conclave. It really was a beautiful place in the
    morning. All the statues glistening in the dew, the tall pillars casting long
    shadows, and the tiled roofs glinting.


    The two of us made our way quickly the way we had walked many times before, passing
    vendors just setting up for the day and a few drunk bounty hunters heading home.


    Rounding the corner, we saw the steps leading down to her office.


    But when we did, we both noticed that the heavy door was ajar.


    It was never open like that, and we both broke into a dead sprint.


    12


    ![](OEBPS/image_rsrc3N4.jpg)


    “Zenobia!” Lara wailed when we entered the room to find her lying on the floor,
    clutching her chest.


    Crimson seeped out from between her fingers, and she was breathing shallowly.


    I didn’t need to wait for Lara to say it—I turned and ran to get the nearest guard.
    The heavy-bronze-armor clad hunters were stationed all around the city. They had
    always seemed more for show than for any practical reason, fitting in like the
    statuary, but now I was so happy they were everywhere.


    I charged up to one, and his eyes only flickered to me for a moment, but they
    focused on me when I shouted, “Falconer Zenobia has been wounded!”


    He gawked at me for just a moment, so I added, “She’s been either shot or stabbed.”


    That was what he needed to hear. Knowing how seriously the hunters took security,
    I was not surprised when he turned and grabbed a rope hanging from the bottom
    of a bell. There were three bells behind him at the station, and the one he rang
    had a rope that looked as though it had never been touched before.


    The moment the sound began, another sounded and then another, and soon the noise
    was coursing through the city like water streaming between brickwork.


    Having gotten what I needed, I turned to run back, with the guard close on my
    heels.


    When he entered the room behind me, I watched his eyes turn to saucers in surprise.
    I supposed it was one thing to hear that someone had been shot in the safety of
    the Conclave and quite another to see it with your own eyes.


    Then his face contorted to worry. Undoubtedly, he realized that this was the street
    he was to have been watching, and this had happened on his shift. Worry for Zenobia
    turned to fear for his own skin.


    “What happened here?” he demanded.


    Lara looked up at him with wet, red eyes. “You tell me!” she snarled, obviously
    confirming his worst fears.


    Another guard appeared, then another, and finally one with a purple cape hanging
    from her back and a more lightly armored guard with a red cross painted on his
    chest plate at her side. He pushed into the room.


    “Everyone clear out!” he ordered, and even though Lara obviously didn’t want to
    leave Zenobia’s side, she knew better than to get in the way of the medic.


    The woman in the cape looked at the two of us. “What happened here?” she asked
    just before turning and gesturing for us to follow her out onto the street.'
