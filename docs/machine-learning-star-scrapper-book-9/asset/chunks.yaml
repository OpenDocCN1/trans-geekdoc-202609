  trans: '

    “为了生存，我不得不这样做，”她说，“在这里，随着公司的不断扩张，并榨尽了我们世界的生命，我么得变得聪明，要么就等死。”


    “我猜对我来说也是一样，”伊莫根（Imogen）说道，“我是被狼养大的，当它们不喜欢我的本性时，就把我扔给了其他的狼。”


    索菲亚（Sophia）清了清嗓子。“现在呢？”


    “现在我正在做一些有意义的事，”她语气肯定地说道，“我觉得自己之所以能从一切生存，就是为了成为其中的一员。”


    听到她这样说，真令人心慰。我相信她的话，但这种肯定的语气又特别令人触动。


    “这是什么？”索菲亚问。


    伊莫根没有浪费时间回答道：“拯救宇宙。”


    另一个女孩咯笑起来。“你是认真的吗？”


    “我是认真的，”伊莫根说，“外面存在着一个比自旧战以来我们所经历的任何事情都要大得多的威胁。”


    我很想听听索菲亚接下来会说什么，想知道这地方的人在得知这种事情后会怎么想。但她的回答完全出乎我的意料。


    “你有没有考虑过试着让你父母来帮助这项事业？”她问。


    “不，”伊莫根毫不含地表示，“难道你没听我告诉你关于他们的一切吗？”


    “我当然听了，”索菲亚立刻回答。


    我能听到伊莫根声音里的困惑，她问道：“那为什么要问我这个？”


    “在我回答之前，我可以再问一件事儿吗？”


    “当然，”伊莫根说，听起来有些不耐烦。


    “你觉得像你父母那种级别的政客能帮上忙吗？”她问。


    伊莫根哼了一声。“当然能。”


    “那是你会考虑的事情吗？”


    “自然会，”伊莫根回答道。


    我听到索菲亚语气中的满足感，她说：“这就是我问你的原因。不是因为我觉得你想乞求那些摧毁了你的人来帮助，而是我觉得这可能是你一直在挣扎的问题，我想给你留出空间让你对此敞扉。”


    伊莫根沉默了，显然在思考另一个年轻女孩说的话。“我想我从没怎么考虑过这一点，”片刻后轻声说道，“我会考虑这件事，但并没在意这种考虑对我造成了多大的负担。”


    “可以假设那是巨大的，”索菲亚说，“有时我们甚至没有意识到，通过纠结这些无关紧要的事，我们对自己造成了伤害。”


    在我的脑海中，我能看到伊莫根脸上露出的神情。“你是谁？”


    “只是一个来自偏远星球的女孩，”索菲亚笑着说道。


    “你远不止于，”伊莫根宣布道。“你太不属于这里了。”


    “关于这一点，”索菲亚说，“我们达成一致。”


    两人都没有说话，火堆在不远处噼啪作响。


    “你觉得你的老板会让我们和你一起去吗？”索菲亚最后问道。


    这个问题问得很有深意。首先，我不认为自己是她所用意义上的任何人的“老板”，尽管我无疑是`Buzzard`（秃鹫号）的船长，现在还是一个等同于和平派教派的领袖……也许我真的是个老板？


    第二个考虑因素是问题本身。我为最后一批当地人提供了庇护，而他们朝我的胸口开了一枪，所以我倾向于直接拒绝。


    “他不是我的老板，”伊莫根说，正合了我的想法。“不是那种关系。他只是一个试图对宇宙尽责的人。老实说，这太疯狂了。有时我看着他，看到的只是一个被卷入远超他认知范围的拾荒者；而另一些我又看到了一个可能真正拯救我们所有人免于死亡的人。”


    “那可真是个极大的对立统一，”索菲亚说，我能听到她在微笑。


    她是对的。他们两个以及他们所说的一切都是的。在某些时刻，我仍然觉得自己只是个该修理电池线圈的家伙，而在另一些时候，我觉得带领一群反抗者对抗他们的企业领主感觉自如在家。


    并不是说这种发现在当下很重要。重要的是离开这个星球，把立方体带回`Edwin`，然后试着找出是谁想杀我们。


    “向天空看齐，”我听到`Clynt`说，我知道这一刻即将发生变化。


    我的大脑想让身体跳起来，但遗憾的是，我能做的最好就是呻吟着站起来，并感觉需要喘口气。但我强迫自己向前，拔出我的`stomper`（重击器），但一直放在身侧。


    伊莫根和索菲亚盯着我，眼睛睁大，看起来就像被他们爸爸抓到偷抽烟一样。索菲亚穿着一套剪裁得体的衣服，似乎非常适合这个星球的环境。棕色的头发衬着一张漂亮的年轻脸庞，只是因为这里的环境而略显粗糙。


    她们都站了起来，索菲亚恐惧地举起双手。她腰间别着一把枪，看起来比上一个部落的要完好得多，另一侧还有某种扫描仪或阅读器。她惊恐地盯着我，直到伊莫根伸手拉下她的一只手，引起了她的注意。


    “不用担心，”她说，“这就是我告诉你的那个人。”


    “噢，”索菲亚说，很困惑但松了口气。


    伊莫根转向`Clynt`，他站在火堆旁，用左轮对着那群当地人。“还有你，别当混蛋了！”她大喊道。“这些我的朋友。”


    “是真的，”`Alek`说。


    “你感觉怎么样？”我问伊莫根，因为上次我看到她时还处于半意识状态。


    “好多了，”她说。


    “很好，”我说。“准备好离开了吗？”


    她停顿的时间比我预期的要长，双臂交叉在胸前。“实际上，我件事我想问你……”


    “你想知道我们能不能把这些家伙一起带回站里？”我提问道。

