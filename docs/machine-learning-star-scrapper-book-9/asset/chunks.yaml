- fmt: '

    # The Encounter


    The dust was clearing, and I watched as the people on the buggy in their thin
    and tattered clothes looked at one another, trying to assess what to do.


    “We’ve never had a hunter around these parts,” one said finally. “How do we know
    you are telling the truth?”


    Slowly, I lowered my `stomper` into its holster and began reaching toward my pocket.
    “I''ll show you my badge.”


    “All right,” the other gunman said, and they watched as I pulled it out.


    Once again, they all shared looks and nodded, so I asked, “Would you be willing
    to take us to your home?”


    “We do that,” the driver intoned in a serious voice, “you have to give up all
    your weapons.”


    ## 5


    ![](OEBPS/image_rsrc3N4.jpg)


    “Ain’t no way in hell I’m partin’ with my revolvers,” Clynt whispered.


    But I ignored him. “That would be fine,” I called, knowing that we didn''t have
    much of a choice. We could either take the opportunity to try and go back to wherever
    these people were from or risk them following our footsteps back to the `Buzzard`
    and leaving us here to die. I didn''t know what nights on this planet were like,
    but I guessed that they weren''t pleasant.


    So, I went first. I pulled out my `stomper` and energy weapon and handed them
    forward, hoping they wouldn’t notice the spear at my side since the shaft was
    telescoped down at the moment.


    Lara pulled her sheathed blade free and unslung the rifle from her back, and Clynt
    offered a handful of weapons. One of the gunmen disembarked and walked over with
    a blanket that he used to wrap up all of our goods, before returning to his vehicle.
    The second he did, the driver started the engine, and they all whooped and hollered.


    But they had only driven about a meter before three sharp cracks pierced the air,
    the sound of Clynt’s `revolver` discharging. The buggy rolled a little bit farther
    and then just rolled back down the hill.


    “Iffin you just listened to me in the first place, we wouldn''t have to walk all
    the way over there and gather our belongings again,” he said.


    “But then we would have just shot some people who had done nothing more than have
    had the bad fortune of running into us,” Imogen said in a groggy voice. She had
    obviously woken up at some point and then watched the situation unfold.


    Clynt shrugged. “They''d be dead just the same.”


    “But now they are dead for a reason,” I said and walked over toward Imogen. “How
    are you feeling?”


    Her eyes rolled up toward me. “I’m guessing we crash-landed?”


    “We did,” I affirmed. “Need to try and get some parts to get the `Buzzard` back
    up and running.”


    “What happened to it?” she asked, eyes fluttering.


    “EMP` shorted the systems and burnt out the battery coils,” I told her.


    Alek cocked his head at me. “You know that''s what happened?”


    “Once a scrapper, always a scrapper,” I said by way of an answer. “But also, the
    coils make a very specific frizzling sound when they frazzle.”


    Lara smiled. “Quite the wordsmith.”


    “What’s the plan now?” Imogen asked, her eyes closed.


    I glanced over to the setting star, then back to the buggy. “We get on that thing
    and try to find some civilization.”


    Everyone looked at it, then all eyes turned to Alek.


    “You’re right,” he said, reading everyone’s minds. “I won’t fit on that thing.”


    “You can just take me back to the ship to sleep,” Imogen suggested.


    Lara looked to the orange ball in the sky. “It’ll be dark soon.”


    Alek let out a low, rumbling chuckle. “You think I have all these eyes for nothing?
    And before you tell me that it’s going to take a while to get back to the ship,
    remember this: you have never seen me run at full speed, and frankly, I always
    have to slow down to keep pace with you all.”


    That was all I needed to hear. “Go,” I said. “Keep the ship safe… and maybe take
    the time to teach Imogen `Warhero`.”


    “Wait, what?” she said with a weak frown. “No, I can walk. I’m good.”


    “Be safe out there,” Lara said, and Alek turned and then took off running back
    the way we had come.


    “Coulda just left ’em in the first place,” Clynt said. “Saved us this whole song
    and dance.”


    I didn’t say anything to that, choosing instead to gear back up, clear out the
    buggy and get going. Not that I knew which way I was going, but at least we were
    moving a lot more quickly now. I drove and drove, not having to slow down as much
    as I expected because when the light of the star faded, it was replaced with the
    reflected light from several nearby moons.


    The temperature dropped as I moved us through the endless scrub, and soon a biting
    cold was lashing at our faces. Every now and again I would glance up, take a look
    at the city above us, and feel like it was equal parts close and far.


    Clynt suddenly shouted something, and my eyes shifted back down to the surface,
    where I saw some lights in the distance. I considered the next best course of
    action, but the increasingly frigid cold helped make the decision for me, and
    I drove us into camp. As we approached, a man and a woman with guns that looked
    like they were liable to explode upon being fired at or simply disintegrate into
    rust approached.

