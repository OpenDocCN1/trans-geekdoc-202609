    “哇，”那个脏兮兮的店主说道，然后就站在那里久久，仿佛他的大脑完全停止工作了。接着，他没再说话，匆忙地在桌子之间穿梭，撞到了路过的每一张桌子，小摆件掉落在地上。


    他消失在帘子后面，我们等着，听到后屋传来了更多物体破碎的声音。没多久，他重新出现，拿着一个中等大小的正方形箱，一侧有沉重的锁机制，另一侧有一些闪烁的灯光。


    “送你的，布罗斯夫和神奇彩色睡衣，”杜迪马尔说道，“如果真的像你说的那么糟糕，我可不想成为那个破坏宇宙氛围的人，你懂的吧？”


    “你真是你那个物种的证明，”阿列克说，一把过了盒子。


    灯光再次闪烁。


    “打扰一下——杜迪马尔，是吧？”伊莫根说，“你觉得我们可以用一下你们的后屋吗？”


    “没问题，女孩儿，”他说，我们都匆忙进了后屋。等过去后，拉拉在我们身后拉上了帘子。


    在环顾四周寻找是否有摄像头或其他人后，我拿出了立方体，阿列克转动机制打开了箱子的一侧。当他这样做时，我看到墙有多厚，并听到里面传出嗡嗡声。我把立方体塞了进去，他打开它有多快，`Kyrog`就有多快地把它关上。


    “我没让他传输出去，但查斯想告诉你们，你们将——我引用他的原话——为此事终生悔恨，”尼德告诉我。但我甚至还没来得及松一口气，就听到帘子另一侧传来了沉重的脚步声进入了商店。


    “霍华，”一个严厉的声音说道。


    “噢，哥们儿，你知道我不叫我那个名字的，”杜迪马尔说。


    另一个声音几乎没等他说完。“我会用我们母亲给你起的名字来叫你。”


    “行吧，那我也不叫你的那个名字了，”杜迪马尔说，听起来像个闹情绪的孩子，“我封你为`屁股大王`。”


    杜迪马尔的兄弟叹了口气。“霍华，”他说，“我来这里是因为我收到报告，说有些可疑人物进入了你的店。我必须假设他们在后屋？”


    听到这话，我们都面面环顾四周，试图看看是否有秘密出口或隐藏的避难室之类的。理当然，并没有。那里不过是一个被帘子简陋遮盖着的后屋。


    克莱克林特拔出左轮，但伊莫根摇了摇头。“我们不能仅仅因为调查我们就杀掉某个当地的守卫，”她低声告诫。


    “她是对的，”拉拉说，“我可以直接制服他。”


    她掏出电击枪并准备就绪。


    “你不能回那里，”杜迪马尔说，“宇宙的命运正关重要。”


    他的兄弟再次叹了口气，这次更有戏剧性了。“霍华，你到底什么时候才长大？”


    “抱歉，哥们儿，我是小微企业主，”杜迪马尔纠正道，“不是经营生意的小人。而是个经营小微企业的人。而且你从`联盟`拿到的什么胸章，并不会让你比我更成熟。”


    “你不是什么小微企业主，”他的兄弟说，“你是个倒卖者，一个廉价的黑市商人。”

