- fmt: '

    “How many energy weapons are you going to let get destroyed?” Ned asked. “These
    things cost money, you know.”


    “Not the time,” I said through gritted teeth, spearing with Ron from across my
    body. The Inquisitor saw the strike coming and blocked the blow with a quick slash.
    On the ground as I was, the sparks caused by the weapons meeting showered down
    on me and burned in little spots against my face.


    I turned my body, kicked up with my left leg, and struck him in the side. Not
    that it did much but force him to take one step to the side.


    Before I could make another move, I felt a searing pain in my flank. I dropped
    the half a gun and pressed my fingers to a gap in my armor at the ribs while I
    swung half-heartedly with my spear.


    I had to get to my feet.


    But I also saw the shimmer of blood on my glove out of the corner of my eye.


    How had I been injured?


    Then I remembered the Vekrass.


    While this Inquisitor was bearing down on me, the other was attacking from the
    proverbial shadows.


    I poked with my spear again, but this time, the Inquisitor grabbed the shaft below
    the tip and then pulled.


    He wasn’t able to loosen the weapon from my grip, but he was able to force me
    to grab it with both hands.


    Another pain in my side.


    I looked around to see if I could spot the attacker. But even in the brief moment,
    the Inquisitor above me struck out with their sword. I rolled, and it sizzled
    against my pauldron. Then he sliced up with the blade, and I recoiled but got
    a fresh shave on the side of my head.


    I kicked out and swept his leg, catching just enough to knock him down.


    Even as he was falling, I was getting to my feet, and this time I happened to
    catch a blur of what I realized was a throwing knife streaking toward me.


    I ducked out of the way, feeling like I was about to even out my new haircut.
    But when I looked in the direction that I thought the knife had come from, I saw
    nothing.


    The Inquisitor beside me was getting up, so I thrust at him, forcing him back
    to the ground when he parried my blow. I tried to stab again, but another knife
