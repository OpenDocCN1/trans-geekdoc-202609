  raw: 'A chime sounded, and a message followed. “Attention all personnel,” a calm
    female voice said. “We have received word that terrorists have learned of our
    location and may make an attempt to attack. Therefore, we will be activating the
    Tidal Drive in T minus ten minutes.”


    “Are you happy now?” Ned asked in my ear. “We have the difficulties you wanted.”


    “Okay,” I said, looking around the room. “We need to get all of you out of here,
    now!”


    Sophia whispered to me, “I don’t think they are all going to fit in the dog grooming
    ship.”


    They were all beginning to stand at the same time that Lara and Imogen appeared
    in the doorway.


    “Shit,” Lara said. “This is a lot of people.”


    “A lot of people that we are saving,” Imogen corrected.


    Lara looked at her and then at all the folks in the room wearing dirty and stained
    versions of whatever they had on when they had been taken.


    An old woman walked up to me. “And what of my son?” she asked in a thick accent.


    “What about him?” I inquired.


    She looked behind me down the hallway. “He was taken. Taken by those doctors and
    never came back.”


    “When?” Imogen asked.


    The old woman looked confused. “What day is it now?” she asked. “How long have
    I been here?”


    Some of the others who had gathered around were listening to the conversation.
    “And what about my husband?” one shouted.


    “And my mommy?” a little boy shouted.


    “Hank,” Lara said, pulling me back out the door to whisper. “We need to get these
    people out of here and help them face the fact that their loved ones have been
    experimented on and are never coming back.”


    I looked at her seriously. “We don''t know that for sure.”


    “I do know that for sure,” she said and pointed to an open door down the hallway.


    I gave her a questioning look, knowing better than to ask in front of the families.


    “It’s as grim as the last time we saw where Twain conducts research,” she whispered.


    I looked at all of the people who had lost loved ones but didn''t know it yet.
    I could tell them the truth, inform them that the Enemy AI had tried to make zombies
    of their families and failed, killing them in the process. But we would just double
    the casualties that way. I needed to get these people out of here and to safety.


    I turned to face them. “Your family members are with the other rescue team,” I
    shouted. “But in order to get to them, we need to get you out of here now. Everyone,
    follow us, and we''ll get you to a ship that can take you to safety.”


    All of the people stood and started to shuffle in my direction while I stepped
    out from the door. Imogen looked up at me judgmentally.


    “Nothing that you just said was true,” she said quietly.


    I stared at her right in the eyes. “You think if I told them the truth that they
    would come with me or be so crippled by misery that they would die here?” I asked.
    “In the future, they may hate me for lying to them, but they will at least be
    alive to do it.”


    She stared at me for a second, comprehension registering in her face. She obviously
    didn''t like that I was being deceptive but understood why.


    “Come on,” I shouted.


    “Eight minutes until Tidal departure,” the calm voice said over the speaker.


    People began filing from the room, and Lara gathered them in the hallway. They
    were so scared and had probably been threatened for so long that none of them
    made a sound. Everyone remained silent or just spoke to each other in whispers.


    “That was good decision making,” Ned said as I helped some of the slower folks
    up and out of the door. “I’m proud of you.”


    I was surprised to hear him say that but really appreciated it. I made these choices
    in the spur of the moment and always hoped they were okay, but his praise was
    exactly what I needed as I helped an old man who I had just lied to make his way
    out of the room where he had been held prisoner.


    “You two watch the back,” I said to Imogen and Sophia. “Don’t let anyone fall
    behind.”


    They nodded their understanding, and I made my way through the crowd, the stench
    of desperation and captivity thick in the air.


    When I reached the front, I tapped my earpiece to communicate with Ned silently.
    “Were you able to get into any of the systems here? Are there any more ships we
    can take?”


    “No,” he answered. “There are no other ships.”


    Shit.


    I racked my brain, trying to figure out what the best option was. “Call the Peacers.
    Get them here now,” I said. “And maybe we can squeeze everyone onto the Buzzard
    if Jackson can get past the guns.”


    “It would need to be something bigger,” Ned said, and it dawned on me what he
    was saying. “I already communicated with Libby, and she''s sending Cassiopeia
    with the cargo ship. But we''re going to need to hope that the Peacers can keep
    them engaged long enough to hold off the destruction of the cargo vessel.”


    Ned had been so worried before that he was losing himself because of what Twain’s
    programming might have done to him, but in this moment, he was as himself as ever.
    Calling for the exact backup that we needed when we needed it and anticipating
    my needs was exactly the role of the paired partner AI.


    And the only way that we had been able to defeat John Gregory was with Ned''s
    help. He had shown, once again, that humans being aided by the machines they created
    were still superior to the forced amalgamation that Twain was trying to impose
    on the universe.


    Humans working with their AI counterparts had been what won the war the first
    time, and hopefully it could be our saving grace again.


    “Six minutes until Tidal departure,” the voice announced.


    That got everybody moving, and we began rushing in the direction of the escalators.
    When the people reached it, they started pushing and shoving one another. I rushed
    down to the bottom of the stairs so that I could help but everyone was terrified,
    and even though the countdown was just for jumping from one part of space to another,
    everyone seemed to be treating it like it was a countdown for their own mortality.


    And what they didn''t know was that it sort of was. If we gyred to another part
    of space, I couldn''t get anybody out of here and wouldn''t know where we were
    to tell the Peacers.


    Now was our only chance to get these people to safety and destroy this facility
    once and for all.


    That reminded me.


    “Clynt,” I communicated. “How you looking?”


    He snickered. “I already got this place fully rigged to go up like a firework
    in a moonshine factory.”


    “I think he means distillery,” Ned said, and I assumed it was just to me.


    “Great,” I said and then let Clynt know, “We are getting a ride out of here.”


    “Just puttin’ some last touches on a remote detonator, and I''ll come find you
    soon as I''m done,” he said.


    I watched as more of the civilians shoved one another on the stairs. “Well, we''ve
    only got like five minutes.”


    “We are all in this together,” Imogen said to the people. “Show kindness, and
    we will all get out of here.”


    But one person pushed too hard, and a middle-aged woman fell over the side of
    the escalator and gripped onto the handrail as it slid slowly down. I ran up a
    position under her in case she fell, but she was able to keep her grip until her
    feet touched the ground. As soon as they did, though, she rushed around to start
    shouting at the bearded man who pushed her.


    Things were deteriorating fast, and everyone was so desperate that they were acting
    out. And even though I understood it, I wouldn''t abide it. The only way we were
    going to get out of here was if everybody stayed calm.


    Above us was a massive circular window that looked out into space, and just above
    us, I watched as the Boot of Justice washed out surrounded by several other Peacer
    crafts.


    The giant battleship sent a massive barrage of firepower toward the ship we were
    standing on, and even though the thick siding protected us, the entire facility
    began to shake.


    Now, everybody began to run, hurrying down the stairs and pushing or knocking
    into one another.'
