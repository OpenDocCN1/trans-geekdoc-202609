  trans: '

    现在，他们显然计划以同样的方式报复她。


    那个刺客今晚出现在这里，意味着她的人脉中存在着内鬼，她的一些“小灵鸟”实际上是她敌人的眼线。知道这一点并无坏处。在尝试对付外部敌人之前，揭露自己内部的敌人至关重要。


    但为了做到这一点，她必须在无论发生什么情况下都活下来。


    风大了起来，导致下方露台的一些叶子沙沙作响。这一次，房间里的那个人又迈了一步，脚步几乎完全被环境噪音掩盖。


    这些猎人太高明了。他们的隐行性仅有最老练的维克拉斯人可以比拟，而他们击逃的能力更是无与伦比。


    即便此人在她不知情的情况下进入了房间，这一事实也是他们技巧的证明。如果她在晚餐时再多喝一杯酒，或者睡得更深一点，她现在正顺着`Conecio Steps`走下去与她的祖先汇合。


    但现在她已经醒了，她必须做一个选择。


    她是该说些什么并可能给这个刺客一个逃跑的机会吗？还是等他们靠近到足以攻击的距离，并冒着被毒刃划伤的风险？抑或是直接下床攻击袭击者，试图抢占先机并听天由命？


    每个选项都有风险，每个选项都有成功的可能。


    但让阿娜（Alana）成为如此优秀猎人的人的，是她在面对危险时的果决断。


    她曾独自面对过一群`Andashi vipers`（安达希蝮），之所以能活下来是因为她选择抓住眼眼看到的第一条脖子。那个选择可能会结束她之前或之后许多人的生命，但它让她变得传奇般勇敢，从而成就了她的伟大。


    不幸的是，在后的日子里，人们利用了这一事实，将她置于这样的境地：她必须勇敢才能配得上她的名声，并做出对她并无益的选择。她怀疑这是否又是其中一次。如果那个人正指望她跳下床来。


    也许她之所以能听到他们的声音，唯一的原因是因为他们想让她听到，想让她醒来到足以犯错的程度。但她在进行这些计算时，她也知道那个人正离她越来越近。她清醒着思考下一步该做的每一刻，都是她在失去优势的另一刻。


    无论愚蠢否，无论可预见否，她顺着自己的名声发起了进攻。


    她跳起身的同时，将盖在身上的轻毯朝着声音的方向扔去，拔出了那把手柄总是从床垫下微微露出的短刀。


    毯子下方的形状向后倒去，重重地摔在地上。


    她猛向前跃出，刀刃横握，准备刺向对方喉咙。


    那个身影起初说了一句听不清的话，随后她意识到那是她的名字。掀开毯子，她看到了……并闻到了……`Mane Malik`（曼恩·马利克）。


    “你在我家里干什么？”她质问道，“现在说话，否则死。”


    他打了个喷嚏，她闻到了他在倒在她房间地板上之前所喝下的各种混合酒味。


    “我不会问第二次，`Dry`（干家伙),”她说。


    “我只是来这里寻求，”他说，听起来诚惶恐惧，“但当我看到你的灯关着，我想我就躺在地板上，这样就不会打扰你了。”


    她看着他惨的脸，看到他眼下的淤青、鼻孔流出的血迹和肿起的嘴唇。


    “是谁对你这么手的？”她质问道。


    他摇头，显得既愧疚又羞耻。“我没看清他们，但有三个。如果他们想占我便宜，就得有三个人。”


    “把你的卷尺留在家里，”她粗鲁地说，“你知道我对那个从不感兴趣。我感兴趣的是事实。”

