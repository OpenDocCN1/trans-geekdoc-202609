  trans: '

    “你觉得我们在找什么？”克林特（Clynt）问道，他的环境防护服看起来仍然像刚从一家酒吧走出来似的。


    “一栋建筑，”尼德（Ned）回答道，“它可能会从到处都是的……真菌中脱颖而出。”


    克林特吐了吐舌头。“没必要自以为聪明，”他说，“我只是在提问。”


    阿莱克（Alek）落地了，拉拉（Lara）在关上门后也跟上来。


    我指向橙色菌盖的方向，我们都开始移动。那里没有传统意义上的路径，我们发现自己不断跳过障碍物，并将柔软的真菌挤开。


    “小心那些，”当我们靠近一个看起来像在呼吸的菌盖时，尼德警告道。从树干向上望去，我们看到了看起来像一排排带刺齿的东西。


    还有其他我们需要留意的家伙。有些侧面长满了刺，有些如果你紧贴在它们身上，它们会吸收你的整个身体。


    我们继续移动，橙色菌盖越来越近，但看起来似乎还有很远。克林特唱起了他的第三首歌，自顾自得地唱得难听，但声音大到让我们能听到，而我只想待在除了他的家园以外的任何地方。


    这时拉拉停下了，我们也跟着停下了。


    她显然看到了什么，现在正试图识别那是什么。许多微小的漂浮孢子和其他移动物体吸引着我们的注意力，但这一定是别的东西。


    “你看到了什么？”我轻声交流道。


    她没有回答。


    “我没在`cam` 上捕捉到任何东西，”尼德告诉我，“也许只是某种漂浮物。”


    我不认为是。如果拉拉认为她看到了什么，我想她可能真的看到了。但在又等了一会儿后，我们继续移动。现在我们每个人都警惕着四周。


    几刻后，我们又开始蹦蹦跳跳，听着在真菌间回响的糟糕歌声。


    枪声取代了歌声，我们都转过头看到克林特正在射他的左轮枪。在他面前，一只四足真菌怪兽在向他冲来时被炸成了碎片。它的肉——如果可以称之为肉的话——布满了坑洞和肿块。随着每一次射击，那东西的碎片就会飞溅而出，但在他把两个弹巢都打空之前，它都没有停止进攻。


    立刻，他开始艰难地装弹，他戴着手套的爪子很难取出弹壳并装入子弹。


    我看到了他为什么这么急。从克林特侧面的一簇菌盖中，更多的怪兽冲了过来。它们移动得很快，在我们还在适应的重力影响下进展毫无压力。


    我数不清有多少只，但它们朝我们所有人冲来。拉拉拔出剑，伊莫金（Imogen）拿出了她的锤。两者都闪烁着永恒的火焰。我及时激活了长矛，对着一只向我咆哮的野兽挥了一过去。


    矛尖切断了它的前腿，导致它头朝地向前撞倒，我迅速刺穿了它。但当我处理完那一个时，又有两个冲向了我。一个从侧面袭来，我用`Ron`刺向它，但它跳到空中，轻而易举地一次越过了长矛和我。


    接着另一只从一丛蘑菇下面窜出来，长着牙的嘴直奔我的腿。我费力挥动矛杆撞向它的头，将其撞到一边，但只坚持了一会儿。


    一秒后它又站了起来，但我利用这段时间弯身跃起。


    那东西追着我跳了起来，我想到了让拉拉使用`Buzzard’s arm`。当咆哮的牙齿直冲我来时，我扔掉长矛，伸手抓住了野兽冒着泡的后颈，然后在回到地表时旋转了身体。


    我将那个生物扔进一个致命菌盖的菌干里，皮肤瞬间波动起来，通过吸入菌柄将其吞噬了。


    当我落地时，我捡起长矛环视了四周。拉拉正在轻松处理路上的任何野兽，切割它们的动作如此轻松，就像在进行某种训练。伊莫金用她的锤砸向一个又一个，在这些东西靠近时击碎它们。她锤上发光的尖刺刺破了真菌怪兽的脸，让它们冒着气飞回地面。


    克林特在菌盖之间跳跃，一边对着几只怪物猛击，一边快速移动、射击并装弹。一旦他找到了节奏，就能对它们占据上风。


    与此同时，阿莱克似乎有些所措措。他在战斗中通常非常可靠，但这些东西似乎困住了他。他挥击着它们，试图把它们赶回去，但它们不断袭来，不断啃咬他。当他试图抓住其中一只时，另一只窜出来咬了他的手臂。它的力量不足以刺穿他的防护服，但他被包围并被啃咬的事让我感到紧张。


    我跳到他身边，直接跳过了另外两个正要被拉拉切碎的怪物，落在阿莱克身边。他转过身举起拳头面对我，直到他发现是我。


    我用长矛劈向其中一个，然后侧面刺穿了另一个。它们都发出咕咕的叫声并朝我冲来，吸引了其他人的注意力。我击退它们，用发光的矛头来回滑动，切割并割开它们的脸颊，但并没有停止。

