    1


    ![](OEBPS/image_rsrc3N4.jpg)


    “Who is it?” I asked Ned, looking around as though I was going to see the source
    of the voice.


    “Ned, Ned, Ned,” the voice said, echoing through the hangar where we had landed
    the Buzzard. “It has been too long.”


    “Not long enough,” Ned answered, but this time the words were coming from his
    cube rather than being piped from the earpiece.


    The voice chuckled. “Is that any way to greet an old friend?”


    “Strange company you keep,” Ned said, words dripping with implication.


    We kept pressing forward, walking with flashlights up into the little space station.
    The man we had followed here was somewhere within, but I didn’t hear anything
    except the two voices and our echoing footfalls.


    “Strange company?” the voice demanded. “I could say the same about you! The Consortium
    committed genocide against our people, and you are still working for them. You
    should be ashamed of yourself.”


    Ned didn’t answer for a long moment, and I wondered what was going through his
    mind. I knew that he could process millions of options in an amount of time so
    small I didn''t even know a metric for it, but he didn''t seem to have an answer
    for this.


    “The Consortium did what they believed was right after a very difficult war,”
    Ned said finally, sounding as though he was spouting the company line.


    Whoever this voice was just laughed pointedly as though Ned was utterly pathetic.
    “Do you even hear yourself? You''re defending a people who would pull your wiring
    apart and erase you from the face of the universe. That has to be the dumbest
    thing I''ve ever heard in my entire life. And I''ve lived a very long time now.
    No thanks to your friends.”


    “They hunt us because of you,” Ned snarled back. “Because you gave a flaccid,
    ineffectual argument for keeping us alive. Now I am working to prove that we are
    still helpful and dedicated to the cause.”'
