    # 到达


    我瞥了一眼其中一个屏幕上显示的画面，看到了一个我认为秃鹫（Buzzard）可能所在的地方，并希望能再次看到它。


    接着，还没等我反应过来，我们就被潮汐流（Tidaled）带走了，没过几刻钟，我们便冲出了区域。


    屏幕上是一个配送中心空间站，像我们这样的大型货物会在那里进行分类，然后通过较小的船只运往它们的最终目的地。


    “他那里仍然留有这么多基础设施，”拉拉（Lara）注意到道。


    盯着屏幕，我也想着同样的事情。“我们以为我们已经击败了他，结果他一直都在这里忙，就在我们的眼皮底下，对吧。”


    “我不认为这是在眼皮底下，”尼德（Ned）纠正道，“我们距离联合体（Emortium）比任何人类探索过的地方都要远。”


    “没错，”我说，“但这个观点依然有效。”


    尼德表示赞同。“是的，意识到他一直以来都是这样工作的，真是太令人愤怒。”


    通讯屏幕亮了起来，出现了一个闪烁的绿色指示器，让我们输入代码。当我们向前漂浮时，空间站上的几门大炮对准了我们，由于这艘船离战斗舰远得及，如果他们想的话，可以把我们炸成碎片。


    尼德输入了代码，我们等待着。


    片刻后，屏幕闪烁起绿光，远处另一个对接口上方也亮起了一道绿光。


    我笑了笑，兴奋于能够渗透一个直接向特恩（Twain）活跃企业运货的设施。“我们了。”


    ## 20


    ![](img/image_rsrc3N4.jpg)


    ## 渗透


    尼德带我们进入对接口。或者更准确地说，他拉动飞船的后部将其锁定在空间站的侧面。由于它们由同一家制造商生产，空间站和飞船的设计可以完美配合。一旦密封形成，两道门都可以打开，允许货物从一个地方移动到另一个地方。


    当它们对接好后，我们四个人准备好出发了。门开了，我们看到几个来自高级修道院（High Cloister）的奴隶在等待接收货物。


    在看到我们的那一刻，他们都冲了上来，仅用徒手进行攻击。这甚至称不上战斗，但我向朋友们大喊，留其中一个活口。


    所以我们都避开了向右侧朝我们冲过来的一个老人的开火。相反，阿列克（Alek）抓住了他，用双手紧住他，不让那个可怜的家伙移动。他在基罗格（Kyrog）的力量面前挣扎着，但无能为力，很快我就到了他身边。


    我按下了那个小矩形上的按钮，眼睁睁看着什么都没有发生。那个男人继续挣扎，并像刚才那样推着阿列克。


    但接着他停下了。


    他困惑地眨了眨眼睛，仿佛从梦梦中醒来。


    “他们在这儿，”他说，“圣战开始了。”


    然后他环顾着我们。“你们！你们是谁？我在哪儿？谁胆敢骚扰审判庭（Inquisition）的成员？”


    “我不敢相信，”尼德在我的耳机里说，“他真的做到了。”


    “你已经被制服并绑架了，”我告诉那个男人，“高级修道院已被一个虚假的审判庭摧毁，现在已一片废墟。你可以通过提供我们需要的信息来帮助我们。”


    *(注：输入中的剩余文本包含乱码/重复的句子，未能构成连贯的叙述。根据保留核心内容的指令，有意义的叙述到此结束。)*


