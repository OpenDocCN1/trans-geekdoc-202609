    “One more wise crack like that, and I’ll refuse you entry and blast you out of
    the sky,” he threatened.


    I wanted to point out that what he was suggesting (at least the “blowing us out
    of the sky” part) was in violation of universal law and expected that `Ned` would
    love to point out that this was not technically sky, but I knew better.


    “Sorry, sir,” I amended. “I have nobody from the planet aboard my ship.”


    “Port two,” he said and killed the connection.


    I turned to `Alek`. “What the hell are we in for, here?”


    “Can’t say that I have much context for it,” he said as `Ned` guided us to a large
    docking bay with a roman numeral for two spray-painted on the outside. “But I
    know that there is some tension between the locals and the people who live up
    here.”


    “You think?” `Lara` asked sarcastically.


    “Yes,” `Ned` agreed. “I think we were all able to extrapolate that from context.”


    `Alek` didn’t say anything else, and as we docked, I watched several armed people
    in uniform approach the `Buzzard`.


    When we disembarked, one of the uniformed individuals stepped forward. They all
    had on purple coveralls and short-shorn hair dyed red that matched the color of
    their weapons and belts. The woman in the middle stared at all of us.


    “Any savages?” she asked. Or, more accurately, demanded.


    “No, ma’am,” I said.


    She stared over my shoulder at my ship. “Mind if we check?” she asked in such
    a way that it might as well have been, “We’re checking.”


    I stood aside, making a sweeping gesture with my hand, and she stayed put while
    the others around her boarded my ship. I didn’t like it, but I also knew that
    I didn’t have a choice.


    We stood in silence for a bit before I finally asked, “So, I’m not from here;
    what’s the deal with all this?”


    She looked me over as though I was some kind of bumpkin. “The deal is that we
    have to be sure that none of those ’facers come up here without a permit.”


    “Why’s that?” `Imogen` asked, already sounding indignant. I shot her a look that
    I hoped reminded her that we needed something here and to be on her best behavior.


    “Let me ask you something,” the woman said, staring at the former `Inquisitorial
    Acolyte`. “Do you like having your colleagues killed? You like having food shortages
    because your mines were destroyed or shipping lanes disrupted? You like having
    your trade partners turn their backs on you because you don’t have what they ordered?”


    `Imogen` narrowed her eyes. “I can’t say that I have had that particular experience.”


    “You’re luckier for it,” the woman said. “Because none of it is acceptable, and
    all of it makes for a hard life.”


    “If them locals are such a burr in your side, why not just take ’em all out to
    the woodshed?” `Clynt` asked.


    Everyone turned to look at him in disgust and astonishment at the suggestion.


    “The `Consortium` doesn’t allow⁠—”


    “Genocide,” `Imogen` stated. “That’s the word you are looking for.”


    “Yes,” the woman with the dyed red said. “That.”


    `Imogen` looked as though she was about to say more but didn’t have time as the
    other guards came rushing back.


    “They’re clean,” one said.


    Another added, “No signs of ’facers.”


    “And just like that, it’s over,” the woman said in a tone that made it sound as
    though we should be very grateful. She turned, and they all marched from the room,
    undoubtedly moving on to the next ship, hoping to catch someone smuggling some
    surface dweller up onto the city.


    We made our way out of the docking bay and down a long, wide hallway to a bank
    of elevators that took us up to the city itself.


    When the doors opened, what we saw was really rather beautiful. Under a tall dome
    that looked out into space, a huge plaza with shops and plants and water features
    and open restaurants was surrounded by tall apartment complexes.


    Children played and people sat, drinking their tea and talking about whatever
    was as important to them as what I was doing was to me.


    “Not really what I expected,” I admitted. “Especially given that we are meeting
    some old acquaintance of `Resh`.”


    `Alek` snorted. “I don’t have to tell any of you that sometimes the best place
    to hide is where someone would least expect it.”


    “And if you don’t think that the people out here want their black-market goods
    as much as anyone, I’ve got a bridge to sell you,” `Lara` added.


    `Ned` scoffed but didn’t say anything, and I wondered if she had that expression
    right.


    “Where are we headed?” I asked, and `Alek` began walking rather than answering.
    We followed him through the plaza where the people, all dressed in similar purple
    clothes and with red-dyed hair that looked as though it had been stained that
    color with a local clay if I had to guess, stared at us. I didn’t know what the
    people from the surface looked like, but I had to think that we reminded the citizens
    of them—given their reaction.


    We picked up the pace, `Alek` taking longer strides to clear the plaza as quickly
    as he could and get us to the other side, then we ducked under some hanging vines
    beside a waterfall flowing down rocks. The smell of moisture and algae filled
    my nose as we clanged along some metal steps and into a dark passageway.


    I wouldn’t have said that it was that well-hidden, but a person also wouldn’t
    have found it if they didn’t know to look for it.

