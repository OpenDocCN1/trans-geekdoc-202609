  raw: 'She didn’t smile, but she gave a little, appreciative nod. “Thanks, guys,”
    she said and then buried her face in her hands. Though I didn’t see her cry. “I
    think those are the first kind words ever spoken to me on this ship.”


    I smirked and asked, “You want to go tell John Gregory how you feel about that?”


    She pulled her hands away, looking right at me. “Yes,” she said. “Yes, I do.”


    23


    ![](OEBPS/image_rsrc3N4.jpg)


    It wasn’t a far flight in the tube to the small planet on the Tidal Drive.


    When we washed out and the little blue dot appeared in front of us, Ned filled
    us in. “This was nothing more than an outpost during the war used for scanning
    the surrounding space.”


    “Seems like so many of these were abandoned, and Twain took advantage,” I observed.


    Ned grunted. “You must understand how stretched thin we were,” he justified. “The
    whole universe banded together, but we were all devastated by the War. Places
    like this were undoubtedly abandoned because the resources were needed elsewhere.”


    “And because they killed all your people,” Imogen added. “So they couldn’t just
    leave AI in charge.”


    “As we saw with Cassiopeia, it wouldn’t have mattered if they did leave an AI
    in charge,” Lara said. “As long as the Consortium wasn’t checking on all their
    facilities, it wouldn’t have mattered if they were abandoned or left with just
    one defender—man or machine.”


    Ned didn’t like the tone of this conversation. “The men and women of the Consortium
    were doing the best they could with the resources they had. Those who survived
    the War had to work all the harder in the aftermath, and while some things might
    have been prioritized over others, it doesn’t suggest that the Consortium did
    anything wrong.”


    I chuckled. “When is that programming going to change? You said you feel like
    you are becoming different? When is making excuses for the Consortium going to
    go?”


    “Never,” he answered without a hint of doubt. “Because that is not just code but
    fervent belief.”


    “No,” Imogen said. “It’s all just code.”


    Ned didn’t speak at first until he said, “It just doesn’t feel that way. Or maybe
    I’m programmed to understand what I am but not fully embrace it? Or maybe something
    has changed within me?”


    I furrowed my brows. “Maybe it doesn’t matter,” I said. “Your love of the Consortium
    is, on a fundamental level, something that makes you who you are, and as much
    as I love to bust your chops about it, I really wouldn’t want it to change. No
    matter how much any of us grow, we don’t really, actually, change.”


    The Mortal Coil dropped down passing into the heavy fog that was sitting on the
    surface of the planet. I set her down on a landing pad made of what appeared to
    be pressed gravel, and I felt the ship sink slightly as it settled onto the earth.


    It was hard to see much through the thick, dark gray fog. Though I knew it was
    day on this planet, the mist was so thick that it cloaked the world in a muted
    pseudo darkness.


    How fitting.


    From the landing pad, we could see the nearby building. It looked like an impression
    of a copy of an Inquisition building. The sloped roof reached up to the sky in
    the corners with four pinnacles. There was a circle of crude stained glass at
    the front and huge wood doors that led to the building within.


    As we stepped from the ship, those doors were thrown open, and Inquisitor John
    Gregory stepped out from inside.


    He looked as though he was going to give a command and then he saw us. His face
    contorted, and a grimace pulled his already frowning expression.


    “What are you doing here?” he demanded in a voice not quite his own.


    The tall grass beside the path and little umbrellaed trees that stuck out along
    the road all waved in a slight breeze. The fog billowed between us.


    “You can’t be here,” he said. “You can’t know about this. How?”


    I stepped forward, feeling Imogen’s fear and determination radiating from her
    position beside me.


    “We know a lot of things,” I said with a self-satisfied grin on my face. “A lot
    of things you wish we didn’t.”


    “Deal with them,” he said in a twisted rage. “I will deal with you.”


    Hearing that confirmed my belief. “Oh, hey, Twain,” I said, waggling my fingers
    in a little wave. “Hope you have been doing well recently.”


    “You will pay for this,” he said. “You will all pay for this malfeasance.”


    I cocked my head. “I don’t know that we will.”


    Gregory pulled out the weapon that I had seen so many times before, his glowing
    sword. As the eternal flame activated, the fog around him glowed ominously, and
    his pale, rotting face pocketed with shadows.


    “You are a fool for coming here,” he said, and even though it was Twain speaking
    through him remotely, it still sounded like the old monster I had known before.
    “But you have done me a favor. Because now I can be done with you for good.”


    The corner of my mouth pulled open. “Do we really think that’s what is about to
    happen here?”


    “Yes,” he said, stepping forward, the rocks crunching under his feet.


    Imogen activated her mace, and Lara pulled out her own weapon.


    My spear telescoped out, and the tip lit, crackling with heat and making the haze
    around me glow.


    “Hank Spears,” the body of John Gregory said, “you have done quite a lot for a
    little scrapper, but it is time to end your meager resistance. And Ned, if you
    are in there, I hope you enjoy watching another of your paired partners be killed
    by one of my servants.”


    Ned growled like an angry dog bearing its teeth. After what we had learned, what
    Twain had just said was perfectly pointed, and I knew that it landed hard on the
    AI.


    “Show him what is going to happen,” he said to me. “Show Twain that this New War
    will go just like the Old.”


    At that, I moved forward, and when I did, Gregory moved too.


    The women at my sides also charged, and we saw what a computer mind could do.
    When we had fought these remote-controlled Inquisitors before, they had been slow
    and lethargic, but this was different. Either Twain had improved the technology,
    or he was close. Whatever it was, John Gregory moved with a calculated efficiency
    that a human could not.


    Even with Lara’s speed, we couldn’t get the advantage.


    We would strike, one then the other of us swinging our weapons, but Gregory would
    stop them, deflecting everything that came his way as though he knew what we were
    going to do. And, I supposed, with his ability to analyze what was happening in
    the split second it did, he was able to predict.


    I had always enjoyed watching Ned target other ships, take on our enemies, and
    outsmart everyone with his ability to do everything faster and more proficiently
    than any human. Now that I was up against the same thing, it was not fun. Not
    at all.


    Sparks sprayed in every direction as the blades met, streams of smoke searing
    through the fog.


    “You would need an army to defeat me,” Twain said from behind his blade, pressing
    against my spear and keeping me at bay.


    “Oh please,” I said with false confidence. “Your buy-one-bad-guy-get-another-free
    ass is going to be in the dirt, and then we will find that cube of yours and pull
    it apart.”


    That seemed to really piss him off, and he thrust forward, the strength of the
    bots coursing through him throwing me back. When it did, he struck out at Lara,
    giving Imogen an opening, but as the former Acolyte moved, his leg shot up like
    a rocket and kicked her in the chest.


    The speed was uncanny, and the power tremendous.


    Imogen was thrown back and fell into the nearby grass, which was beginning to
    smolder, the sparks catching the strands on fire.


    She was up in a moment, but as I struck out with my spear and he deflected with
    such force that I was nearly knocked from my feet, I wondered if this fight was
    going to go our way. I had believed that three against one would make it difficult
    for him, but I was concerned, now, that we did need an army to take him on.'
