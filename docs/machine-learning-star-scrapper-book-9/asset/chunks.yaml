    “也许这能帮我们找到格雷高里，”我说道。


    但伊莫根非常坚定。“不，”她再次说道，“我不会让那些东西靠近我半步。我甚至不想再回到那艘船上，但我得去。尽管如此，”她指了指地上的一堆被揉皱的审判官，“我再也不了。”


    “这就定好了，”我说，示意我们登上 `Mortal Coil` 号飞船。


    拉拉毫不犹豫地走了进来，但当她的一只脚踏在坡道上时，我看到了了伊莫根的脸色。我走到她身边，伸出手让她扶着我的手臂。


    “不，”她说，“我需要自己走来。”


    “好的，”我说。


    “这只是一艘船，”她低声说道，显然是在对自己说，“无非是零件和碎片而已。”


    我没有再说话，只是站在那里提供精神支持。在父母强制她加入审判庭后，伊莫根曾作为 `John Gregory` 的 `Acolyte`（随从）搭乘过这艘船，而当她试图攻击审判官失败时，她是以囚犯的身份待在这里的。无疑，她在这艘船上拥有的记忆比宇宙中任何其他地方都要可怕。


    “这只是一艘船，”她再次说道，向里面又走了几步。


    她的眼神闪过一个小角落，那里似乎摆设了一个像小祭坛的东西。


    “他以前经常让我跪在那儿，”她说，“一就是几个小时，我必须在那儿等候，膝盖抵着金属，要么在读某些文本，要么在思考他的问题。这一切毫无意义。没什么都不重要。那都是他自私自利、自诩正义的废话。但我会跪在那儿思考这些事。”


    “但你真的会思考吗？”我问道，试图把她从那段沉浸其中的记忆中拉出来。


    她眨了眨眼，然后看向我。“你什么意思？”


    “你是真的在思考他的问题，还是坐在那里数着时间，想着你有多恨他、恨你的家人，或者只是记得某部老剧之类的？”我问道，尽量让语气听起来自然。


    她简短地瞥了一眼那个角落。“显然是后者。”


    “我猜如此，”我说，按下了激活坡道的按钮。


    声音让她畏缩了一下，我看着她看着坡道关闭，就像牢房门关闭一样。


    “抱歉我们不得不这么做，”我说。


    她深吸了一口气。“没关系，”她说，“看来每个人现在都在与过去的幽灵作斗。”


    内德笑了起来。“她是对的。她比你年轻这么多，为什么又比你明智这么多？”


    “我想只是运气好吧，”她说。我很惊讶他竟然向我们两个传达了这句话，因为他平时似乎总是只对我冷嘲热讽。


    我向前走了几步，等着伊莫根是否也这样做。她确实这么做了，边走边观察着一切。当我们到达牢房时，她停下脚步，透过栅栏看向里面的小长凳。


    “当他把我变成囚犯时，我并不是第一次待在这里，”她说。


    “噢，天，”内德说道，我不知道他是不是只对我一个人说的，“这家伙儿真是冷透了。”


    她用手抚过栅栏。“他把我关在这里不仅是为了惩罚我，也是为了提醒我我还活着。‘痛苦是人性的，’他总是这样对我说。他想表达的观点是，我们人类会受伤，而机器不会。现在我见了一些
    `AI`，我知道那是多么虚假。内德和 `Cassiopeia` 看起来现在承受的痛苦，和拉拉面对失去的痛苦一样多。”


    “这是事实，”内德说道，“并不是要削弱拉拉的损失。”


    “甚至连这种礼貌，”伊莫根说，“那种对你朋友的关怀。那是 `John Gregory` 永远无法理解的东西。他不仅不懂程序可以做到这一点，他自己也不懂如何这样做。他太专注于消灭
    `AI` 了，以至于失去了让他作为人类的全部特质。”


    我思考了一下。“那是假设他曾经拥有过那些东西。一种可能是他天生就是坏的。这些 `AI` 被程序化得像我们一样，优缺点都有，但并不是所有人从那种意义上都是‘人类’。有些人天生就带着邪恶。”


    “那 `Twain` 呢？”伊莫根问道。


