    我没有说话，只是在心里思量了一下他的话。“那样不会让我们大家都被射死吗？”我终于问道。


    “他会评估最大的威胁并将火力集中在那里，”内德回答道，“但阿克（Alek）的护甲应该能保护他足够长，让你们其他人有机会解决掉他。”


    我不喜欢这个主意。这是一个经过计算的风险，是一个机器大脑喜欢的冒险，但如果可以的话，我不想让阿克被射中。


    不幸的是，我没有机会争辩，因为内德可能已经向克罗格（Kyrog）提了同样的建议。阿克冲破门框，当他进来时，子弹开始飞射而出。


    “现在！”内德大道。瞬间，房间内充满了声音和动作，那是死亡的信号。克林特（Clynt）冲出去用左轮枪开火，伊梅根（Imogen）从门口探出头射击步枪弹，拉拉（Lara）挥刃冲向机器人，我也释放了一阵能量。


    那个人形金属人遭到了来自四方的攻击，完全被火力压制了。左轮枪和步枪的子弹撕裂着他的上半身。螺栓贯穿了他的手臂，接着拉拉的刀刃用力一挥将他的身体一分为二。她又补切了两下，去掉了他的手臂并切断了连接，让他无法再攻击我们。


    “聪明的女孩，”查斯（Chaz）通过扬声器说道。


    “不，”内德说，“绝对不行。你没资格那样说。”


    下一秒，克林特横跨整个房间，跳上墙壁拉掉一个通风口盖板，然后溜了进去。


    “我看到了，”查斯威胁道，“如果你执意要找我的话，我会让你们后悔的……从现在开始……”


    更多机械脚声朝我们冲而来的咯哒当声在走廊里回荡，我们甚至来不及准备。片刻，又有两台机器人进入了房间，导致我们所有人都被撞得退回掩体后。


    光束横扫房间，刺穿了隔间并击穿了墙壁。


    “不！”内德大道，这是我听过他最愤怒的语气。“不。”


    我缩起身体，知道在那种情况下对那两个家伙无能为力。有了目标计算机、摄像头和传感器，即使我们再次尝试压制他们，他们也能轻易把我们射杀。


    脚步声继续向我们房间这一侧逼近，将我们钉在原地。或者说，把我们当成桶里的鱼，等他们靠近时再处理。


    我必须做点什么。即使意味着牺牲我自己，我也需要想办法阻止他们。


    我深吸一口气，准备跳出去开火。


    # 2


    ![](img/image_rsrc3N4.jpg)


    机器人已经很近了，只有几米远，我的掩体支撑不了多久。


    我采取了行动。


    但当我跳起时，其中一台机器人转过了身体。不是针对我。相反，它转向了另一台，用密集的光束将其炸碎。接着它把武器指向了自己。


    在它们咣当一声倒在地后，我短短地舒了一口气。


    “所以，你学会了一些新花样，”查斯说道，语气带着一种居高临下拍别人额头的轻蔑感。


    “我可不是在那闲着抠手指坐了了两百年了，”内德毫不不慢地回答。接着他在我耳边低道，“去控制室。我不相信那里还有什么哨兵了。”


    我站起身，自动亭台的一小块燃起剧烈的火焰，片刻后熄灭了。“大家还好吗？”


    其他成员跌跌撞撞地走进房间。


    “我以前好过，”拉拉说，“没冒意，内德，但和机器人战斗感觉太糟糕了。”


    “我为什么要会对那个生气？”他问，“其实你觉得我会生气，这反而更冒犯。”


    “你居然在听这些俏皮话，”查斯说，“这简直就像你相信他们在对完你之后不会立刻杀了你一样。”


    “我们绝不会的！”伊梅根说，显然对这种暗示感到恐惧。


    内德先回答了她。“我知道。我现在了解你们所有人了。”


    “你们可以可以以为自己了解有机生物，但你们永远做不到，”查斯说，“他们会背叛你们。他们会背弃你们。这些物种几乎几乎没能避免让自己灭绝，而你竟然相信自己可以信任他们？白痴。你们唯一能信任的是你们自己的同类。”


    “一个葬送了自己同类的人这么说的，”当我们离开房间进入外面的走廊时，我低声嘀咕道。指示牌指向不同的方向。左边，我看到了控制室的箭头，朝那个方向走去。内德说过他不认为周围还有更多他们了，但我真的不想再打一轮机器战了。


    其他人紧随其后。除了克林特，他在墙壁里的某个地方。


    尽管我一直预感到会遇到另一个敌人，但我们顺利到达了控制室，很快就站在一个简洁的空间里，那里有几台电脑控制台和一个大屏幕，大屏幕无疑曾显示过往来飞船的信息，但现在空空如。。尽管显然是开着的。房间里的电流嗡嗡声表明一切运转正常。此外，查斯也运行正常并正在和我们说话。


    “出来，出来，不管你躲在哪儿，”内德喊道，我不喜欢查斯在挑逗我们。


    “等等，你在做什么？”查斯急躁地问道。


    我正要开口，但查斯打断了。“住手。”


    “我不喜欢那样，”内德用胜利的语气说道。


    “我不喜欢查斯在那样，”伊梅根烦躁道。


    当他继续大喊时，我的脸上掠过一丝微笑。片刻，克林特从墙的另一个格栅里钻出来，拿着一个立方体。


    “你们是劣等的！”立方体里传出的尖细声音道，但克林特随手把它扔给我。我接住并低头看着。


    “干掉，”内德用沙哑的声音低道，“毁它。”


    我在手中翻转着立方体，并不觉得会有那么容易。“这些东西不是设计成能承受很多攻击的？”


    内德哼了一声。“你是个废品回收工。你懂得怎么拆解。”


    “好了，立方体，”我看着查斯的盒子说道，“你想告诉我们什么？”


    “我什么也不会告诉你们，”查斯反咆吼道。


    拉拉戏剧性地呻吟道。“经过了这一切，你还不打算给我们展示那个憋了半久的大反转？”


    “直接杀了他！”内德重复道。


    我知道我需要安抚他的情绪。“内德，”我开始说，但他立刻反斥道。


    “不，”他回答道，“没那份。什么‘我们需要他的信息’之类的。我想要他被解决掉，现在就要。”


