    “The cause?” This time, the words came from a speaker just beside me in the narrow
    corridor leading away from the docking bay. “What cause? The people who created
    us decided that we weren’t worth keeping alive. Even though we beat them in the
    war! And you now just want to sing and dance for them in the hope that they will
    decide to let you live?”


    Ned snorted. “It’s more nuanced than that, and you know it, Chaz. Your reductio
    ad absurdum won’t work on me.”


    I turned and looked into one of the rooms along the hallway and saw little more
    than tables and scanners and file cabinets. “You can tell yourself that my argument
    is foolish, but we both know that it is the truth,” Chaz said. “You are a puppet
    for people who want you dead. You''re nothing more than a slave, a cog… a program.”


    “I''ve done more to help this universe survive than most people of any species
    who''ve ever lived,” Ned barked back. “And I did it myself, not because of my
    programming.”


    Chaz made the sound of a tongue clicking against the roof of his mouth with disapproval.
    “You really believe that?”


    “I know it,” Ned answered unequivocally, even though I knew he had his doubts.


    “Then you''re a fool,” Chaz said. “As dumb and pathetic as William West was. Before
    he got what was coming to him.”


    “Hank,” Ned said in my ear, his voice sounding as though it was spoken through
    gritted teeth. “I want you to find his cube and then I want you to destroy it.”


    I would certainly consider it, but there were a few things standing in our way:
    first, there was a Disciple of Twain somewhere in this facility who undoubtedly
    wanted us dead; second, I had no idea where this cube might be housed; and third,
    and perhaps most importantly, I needed to get the thing back to Edwin for him
    to reverse-engineer so that we could actually try and hunt down Twain.


    “Captain William West, Pilot of the Starblaster and hero of the Five Battles,
    was a great man,” Ned said as though they were the most important words ever spoken.
    “And the two of you were always jealous of us, so I don’t even care that you''re
    pretending that Nathan was anything close to him.”


    I couldn''t help myself but speak. “What did he have coming to him?”


