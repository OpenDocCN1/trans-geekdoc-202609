    Lara patted me on the shoulder. “Even after all we have been through, I sometimes
    forget that you were a scrapper before all this. You didn’t get to experience
    the universe the way I did as a bounty hunter.”


    “I saw some things.” I shrugged. “But it’s just all this… I don’t know.”


    She didn’t say anything, giving me a chance to continue. “It just doesn’t even
    make sense. This was so important to them, it was life and death to them, but
    there is so much more out there to worry about.”


    “But the people of this planet don’t know it,” Lara said. “They still don’t know
    about the threat that’s coming… and even if they did, they might not have cared.
    As you said, this is so important to them. To the people of the company, it’s
    what feeds their family, and to the locals, it’s their home. For both groups,
    it feels like life or death because in a very real way, it is.”


    “She just led them into this for nothing,” I muttered.


    Her hand made its way from my shoulder to the nape of my neck. “That was their
    choice,” she assured me. “They did what they thought was best for themselves and
    their people, even though we warned them. Hell, you even offered them the chance
    to get them off this rock, and they didn’t take it. Can’t dwell too much on it.”


    I smiled at her for a moment. “Isn’t it my job to talk you down most of the time?”


    She punched my bicep. “Pretty sure I have been calming down,” she said, and it
    was true. With each passing day, her instinct to get pissed off or fly into a
    rage was diminishing. That wasn’t to say that it was gone entirely, but it felt
    like the fuse was growing longer.


    “You doing okay?” I asked.


    She rocked her head back and forth. “Have I mentioned how much I hate it here?”


    “Oh, damn!” Clynt said, slamming a palm on the beam he was using for support,
    and I began to slow the buggy.


    “What?” I asked, worried that he had lost his way.


    He tapped a claw angrily on the bar. “I really wanted to see them critters.”


    “What?” Lara asked.


    I rolled my eyes as he said, “Whatever them big lizards were in those crates.
    I wanted to take a gander, but all the action done erased it from my brain.”


    “That’s not important,” Lara sighed.


    But he huffed. “Were important to me. I like seein’ alien critters.”


    “We’re not going back,” I said, preempting the question I thought was coming next.
    “I just want to get back to the ship and get the hell out of here.”


    “But the next time we end up on an alien world, we’ll try and hit up the zoo,”
    Lara offered in a pandering tone.


    I began driving again, with Clynt pointing the way and pouting.


    We drove for what seemed like an eternity, but eventually I saw the Buzzard in
    the distance.


    Though we had only been on this planet a very short time, it was a massive relief
    to be back at the ship, and the three of us all but leaped off the buggy to hurry
    up into the Buzzard.


    “Alek!” I called.

