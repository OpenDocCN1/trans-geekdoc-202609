  raw: 'My massive friend grabbed his cybernetic appendage and pulled. Rather than
    coming off, he simply yanked the entire man from the ground and then threw him
    at another one of the legs. The crunching sound he made as his body hit the metal
    sent another chill through me, and the Disciple didn’t move again.


    Two more fired out from positions across the hangar where they had fallen back
    to. We sent shots back at them, but from this distance, we weren''t doing much
    but keeping each other suppressed.


    I watched as one of them turned, opening fire in a direction to their left, where
    I hadn''t even seen Clynt take up position. But these people were probably enhanced.
    Somehow, she had been able to pick up on the Vekrass flanking them, and then she
    took a few shots to keep him at bay too.


    I patted my pocket and felt the rectangle, wondering if it would work from here.


    After pulling it out, I pointed it across the space at one of the Disciples.


    When I pressed the button, nothing happened.


    I didn’t know if I wasn''t close enough or if it wasn''t functional, but either
    way, I got a purple bolt sent my way for my troubles. I cowered back down, staying
    safe as more energy beams struck the crate, cooking the spores within.


    I peeked out to see Clint trying to move closer, but every time he darted from
    one position to another, he was fired upon. Most of the opponents we fought could
    be taken unawares by his ability to sneak through a space, but with Twain’s modifications,
    his soldiers were much more difficult to take down.


    Off to the other side, I could see Lara trying to wipe her stealth suit clean
    so that she could try and move invisibly again, but given that we didn’t know
    what kind of ocular upgrades these people had, it might have been an exercise
    in futility as well.


    But then I looked in front of their position. Rather than seeing the two women
    trying to find an angle on the enemy, I saw the thing they were using for cover.


    I darted across the space, closed in on the treadbull, and hopped into the driver''s
    seat.


    It felt good to be back in a big vehicle like that, and I began pulling on the
    controls, turning the large thing so that I could begin driving it toward the
    two Disciples.


    Seeing the industrial vehicle rolling toward them, they both started shooting
    at me. But Imogen and Lara had done what I hoped they would and were firing from
    behind as I slowly moved toward the enemy.


    Clynt took the opportunity as well. So, while the crappy plastic windshield and
    metal roof of the vehicle were torn apart all around me, the others closed in
    and were able to drop the two remaining Disciples.


    Once they were dead, we all moved toward the ship.


    “Getting into their systems now,” Ned informed me. “It should only take a moment.”


    The craft itself was massive, though most of it was just the open cargo area and
    then thrusters and space for fuel. The front of the ship had some cabins for long
    haul trips that were largely unfurnished, and the cockpit was equally Spartan.


    Before doing anything else, I activated the controls and ran a diagnostic, seeing
    if the leg that had been hit with the pulse grenade was too damaged to tuck into
    the ship.


    “I can see the destination,” Ned informed me though it was on the display in the
    cockpit as well. “And I have access to their codes.”


    “It isn’t encrypted?” I asked in surprise.


    He scoffed. “I guess after two hundred years of thinking that you have the upper
    hand, you get lazy.”


    “Twain really believes that we are fools,” Alek observed.


    I turned to look at the Kyrog. “Has the Consortium given him any reason to believe
    otherwise? Even after we destroyed his superweapon and he partially destroyed
    a major planet in our system, people still don''t believe that he''s actually
    out there. If we can''t even rally together to fight him, or, for that matter,
    even believe he''s out there, why in the world would he take us seriously?”


    “He takes you seriously,” Lara noted. “His people know you by name and have probably
    been warned about you.”


    Imogen gazed at Lara with a look I couldn’t quite place. “You shouldn''t be jealous
    of that.”


    “I’m not,” Lara protested.


    The redhead smirked. “Sure you are,” she said. “You don''t like that you''re this
    big bad bounty hunter, but that Hank is the one Twain warned his people about.
    It makes sense, but I just don’t think green looks good on you.”


    Despite herself, Lara flushed. “Maybe you have a point,” she admitted. “Even if
    I hadn''t realized that it was true.”


    “I’m really very perceptive,” Imogen said.


    Alek let out a little exhalation that got all of our attention. “What do we do
    about the Buzzard?”


    “Leave it?” Imogen asked.


    I didn’t like the sound of that. “I think this planet might just swallow it whole
    if we leave it too long.”


    “I can take it back to the station,” Lara offered, but I didn’t want her to be
    alone.


    “No,” Alek said. “If we are taking this thing to sneak onto an enemy vessel, it
    should be me who sits this one out.”


    “Your suit won’t get you back to the ship, and we don''t have time to repair it,”
    I said. “We need to try to keep this thing on schedule and not raise any alarms.”


    I turned to look at Clynt. “Willing to sit one out for the team?” I asked him.


    “Ain’t never been a part of no team and don''t plan to start now,” he said. “But
    I suppose I can do y''all this one favor.”


    I had a whole plan to stroke his ego and tell him that he was the only one we
    could trust with such an important task, but I was happy that I didn''t need to.
    “Thank you,” I said. “But please don''t steal my ship.”


    He opened his arms in all innocence. “You think so little of me?”


    “I’d say it’s more like I know your nature at this point,” I said with a smirk.


    “I swear on my pups that I won''t pocket the Buzzard,” he said. “And anyhow, sentimental
    value ain''t worth much to a fence so there ain''t no reason fer me to keep that
    rust bucket.”


    He started pulling his environmental suit back on and a moment later was gone.


    “You sure that’s a good idea?” Imogen asked.


    I looked down at her, a little worried. “Would you have rather it been you to
    stay?”


    She shook her head. “No, one time across this planet was more than enough for
    me. So, thanks, I guess.”


    The entire ship rumbled as Ned activated systems, but he didn’t seem to be lifting
    off.


    “What’s wrong?” I asked.


    He didn’t hesitate to answer. “The door is still closed.”


    “Can’t you override it?” I asked.


    “I’m trying,” he said.


    Looking at the feeds from the cameras mounted all along the outside of the ship,
    I saw that the woman with the bob had returned, so I stood to exit the ship.


    “She’s not going to let you steal their supplies,” Lara said. “So unless you plan
    to threaten her, don''t bother.”


    That just left Ned. “I''m getting close,” he said, and as we watched from the
    camera feeds, some security personnel finally arrived.


    Wearing heavy combat armor and carrying large weapons, they would certainly be
    quite a problem if Ned couldn''t get us out of here. They began to file in and
    aim their weapons at the ship.


    Mercifully, a moment later, I saw on one of the aft cameras that the hangar door
    was beginning to open. At that, the woman with the bob rushed over to a computer
    in the corner and began getting to work.


    But Ned was wasting no time and began backing us up, all of the security guards
    stepping forward and keeping their guns pointed at us. One even took a shot, the
    heavy energy bolt doing nothing against the hull of the cargo ship since it was
    like shooting a spitball at a tank.


    We backed into the humongous room, and the door closed behind us. Or, rather,
    in front of us. Not that we could see any of it. The cockpit of the ship was more
    like a command room and didn’t have any windows. Rather, it just had several screens
    where the exterior of the ship was displayed in many segments.


    The ship rattled when the other door began to open, but a moment later, Ned had
    us leaving the station and heading out into space.'
