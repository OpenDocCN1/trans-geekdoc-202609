    # 4.3.1 Artificial Intelligence in Wireless 5G and 6G


    The 5G cellular network was launched to enable Internet of Things (IoE) applications
    by delivering high data rates, low latency, and ultra-reliable connectivity. To
    facilitate connections between people, machines, and things in 5G, network equipment
    must be software-driven, intelligent, virtualized, and energy-efficient as the
    number of connected edge devices grows. The networks will also support edge computing
    to dehaul bandwidth consumption. It will be difficult for 5G to provide a single
    architecture that can support various services, such as mobile broadband, 3D connection,
    ultra-reliable, low-latency communication with connected devices. As a result,
    5G networks must employ AI to improve network services and enable edge computing
    with low latency and high bandwidth.


    At the network level, new technologies and applications like IoE are crowd creating
    massive volumes of data. Models based on AI are frequently created from acquired
    data to assist in detecting, classifying, and predicting future events. It is
    typically impractical to transfer all data to a single place due to time, latency,
    and storage concerns. Federated learning (FL) has been utilized to meet the growing
    need for decentralized data training. The rollout of 5G wireless communication
    networks has reached a major milestone in academia and industry world, and the
    industry now aims to advance beyond 5G. The use of AI in the network to collect
    data with the help of high-performance computing networks is gaining traction.
