    when dealing with sensitive devices which are unable to implement cryptographic
    methods, e.g. devices and Nano-devices of the internet of things and Bio-Nano
    things where the human inner bodies become nodes of the future internet [14].


    The physical layer security addresses the most important application of the sixth
    generation: that being considered "human-centric mobile communication." When increasing
