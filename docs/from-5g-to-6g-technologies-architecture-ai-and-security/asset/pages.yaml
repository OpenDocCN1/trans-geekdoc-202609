    # 2.1 Introduction


    Telecommunication sectors consist of companies that allow communication to happen
    globally. These companies have created the standard infrastructure that we know
    today. They consist of these subsectors: wireless communications, communications
    engineering, processing systems and long-distance carriers, domestic telecom services,
    foreign telecom services, and diversified telecommunications.


    Advances within the telecommunications sector have caused a dramatic change in
    how people live across the globe. This change has also opened new doors, posing
    challenges and new opportunities for the future. Another opportunity is the creation
    of 5G in 2018, offering more speed, efficiency, and less latency for the future.
    The possibility of fewer regulation also opens up the market for more freedom
    and competition. Cross-industry partnerships are another area that may see new
    growth, as they are reliant on telecommunications industry. Security and privacy
    will be a higher priority as demands continue to grow.


    With technology exponential growth in the last decade, it is no wonder that it
    is becoming one of the largest and fastest-growing industries of our generation,
    new advancements are being made. These improvements have brought a dramatic change
    on the international telecommunication sector, allowing for greater improvements
    in the way we transform. The television and radio have been around for as long
    as the new generations have advanced. This journey for telecommunications has
    only happened for 50 years. In this time frame, the standard and wireless network
    has undergone significant development: wireless personal area networks (WPAN),
    wireless local area networks (WAN), ad hoc or mesh networks, metropolitan area
    networks (MAN), wireless wide area networks (WWAN), cellular networks, and sensors.


    Broadband telecommunications have undergone massive development over the past
    decade, becoming more efficient with their broadband usage than ever. In the 1970s,
    in their first generation, known as 1G, the telecommunications stands via only
    voice services to its subscribers. In the 1980s, 2G came with everything and even
    began roaming data services. 3G also saw the creation of text messages for mobile
    phones and even brought large data bandwidth and faster internet connectivity.
    The unfortunate part is that the actual network infrastructure was not rolled
    out the way it was marketed, but that 3.5G came in the 3G network even more efficient
    than it was, allowing for fast and better uplink/download speed.


    Then the fourth generation, 4G. Its purpose was to allow internet access with
    speeds of up to 100 Mbps. By the standards of the 4G network, many service providers
    and users could access it. Based on the standards created by the International
    Telecommunications Union-Radio communications (ITU-R), the data rate also varying,
    depending on the frequencies and equipment used. Those who connected with high
    mobility, such as people in cars and trains, would access data rates ranging from
    Mbps to higher, while those in low mobility, such as pedestrians, would experience
    around 1Gbps. These policies were created by the International Mobile Communication
    Advanced specifications (IMT-Advanced). 4G networks could also be used in network
    infrastructures like WLANs and WANs.'
