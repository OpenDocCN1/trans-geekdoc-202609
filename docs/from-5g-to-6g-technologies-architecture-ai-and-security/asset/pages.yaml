- pgno: 65
  md: '# 2 Networks of the Future


    SDSI (Telecommunications Standards Society, India), TTA (Telecommunications Technology
    Association, Korea), and TTC (Telecommunication Technology Committee, Japan).
    These groups are responsible for the maintenance of the partnership agreement,
    evaluation of applications for additional 3GPP partnerships, and decisions related
    to deployment of 3GPP. There are four technical specifications (TSG) in 3GPP,
    and those radio access networks (RAN), service aspects (SA), core network and
    terminals (CT), and GSM edge access networks (GERAN). According to 3GPP.org, RAN
    is responsible for the functions, requirements, service capabilities, and interfaces
    of the UUTRA (universal terrestrial access/evolved-UTRA) in its two modes, FD
    (frequency division duplex) and TDD (time division duplex). As per 3GPP, CT is
    responsible for the architecture and work of specifying logical and physical interfaces
    to the core network of 3GPP. The 3GPP sites specify that RAN is responsible for
    the radio access portion of the GSM/edge network. These groups regularly meet
    and cooperate together. The standards they develop are used in the development
    of various applications. The 3GPP also has what they call “Observers”. An Observer
    of 3GPP is an organization that does not meet the qualifications to become a future
    partner of 3GPP. 3GPP has several observers as a partner. These organizations
    are the Telecommunications Industries Alliance (TIA), ICT Standards Council of
    Canada (SACC), and Communications Alliance – Forum Australian (AFCI). Having these
    groups prevents the group from being over partial or having conflicts that may
    benefit partners individually. 3GPP is ultimately responsible for developing technical
    specifications for 3G systems. 3GPP created a mobile standard for a cellular network,
    known as general packet radio service (GPRS), third-generation high-speed packet
    access (HSPA), and next-gen long term evolution (LTE). In the data world, 3GPP
    is the heartbeat that allows different generations of cellular networks to operate
    and communicate. In the operational aspect of 3GPP, there are two types of access.
    These types of access are either 3G access or Non-3G access. 3G access communication
    is between the access network and other UMTS (Universal Mobile Communications
    Systems) or GPRS. For clarification, UMTS is considered the technology of third-generation
    (3G) cellular access, and it is 2G and 3G technologies, which are called CDMA,
    WMA, and UMA. Non-3G networks do not use the same authentication methods as 3GPP.
    Non-3G networks do not know how AKA works. Authentication and Key Agreement is
    a security protocol used in mobile networks. This is the added piece of Extensible
    Authentication Protocol (EAP). EAP is an authentication protocol method, which
    was created for point-to-point protocol (PPP) methods, which were created for
    non-cellular methods of access, being second-generation and third-generation technologies.
    This is just a small example of how important and influential 3GPP has an impact
    on the cellular movement in the world. For clarification, CDMA and GSM are various
    ways in which data cellular networks communicate with cellular networks. Considering
    3GPP networks are used by 80% of the mobile network market share, it is likely
    that 3GPP continues to improve the economy globally. According to a report on
    Nasdaq.com (11), the number of LTE users exceeded 1.29 billion in the first quarter
    of 2016. 3GPP is the group responsible for standardizing and improving LTE. Also,
    in the first quarter of 2016, LTE users grew by 182.1 percent, and 4G LTE are
    also being standardized. Also mentioned in the article is that LTE-A is being
    standardized by the 3GPP. LTE technologies. LTE-A is the latest version of LTE
    that is supposed to be more closely aligned with 4G speeds of around 300 Mbps.
    LTE is expected to reach 50% by the end of 2016. 168 of those LTE networks are
    LTE-Advanced. None of these economic feats would be possible without the help
    of 3GPP and its knowledge pool. In 3GPP is an organization that has truly made
    a change in the world today. Although sometimes missed by cellular providers,
    3GPP''s LTE has not been very absent aspect behind the creation of the technologies
    that are involved in high speed led by LTE. It is however without the subscribers''
    group standardization practices and guidance, the technology would be behind.
    I am certain that 3GPP will continue to strive as a great organization and keeping
    the economy with great mobile standardizations that keep mobile-users as customers-'
