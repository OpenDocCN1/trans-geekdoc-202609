  md: '# 6G: Architecture, Applications, and Challenges


    # 6.1 Introduction


    5G service is available in North America and East Asia, and new launches are still
    being released in Europe. By 2022, we should see the final launches of 5G in those
    areas. Interestingly, China actually accounts for over half of the world''s 5G
    connection. In 2021, nearly a thousand new 5G devices were announced, including
    phones, modules, modems, tablets, and many other devices. That makes one fact
    as to the future of these devices, as these will not be fully functional to result
    in new markets - it will be a few years until we reach its full potential of balancing
    broadband operators with growth into new markets.


    As noted in Chapter 1, 5G has gone through two releases, Rel-15 and Rel-16. The
    5G technology is assumed to result in a high data rate that can enhance mobile
    broadband, ultra-reliable, and low latency services and many connections (including
    beam management), channel structure, and multi-antennas, which partially fulfill
    the requirement of performance of International Mobile Telecommunication (IMT-2020).


    In order to support the performance requirements of IMT-2020, several new technologies
    such as orthogonal multiple access, ultrareliable, and low latency communication,
    vehicle to X communication, integrated access, backhaul, terminal saving, and
    positioning have been introduced, which can also help in widening the use of 5G
    networks. Unlike 1G, 2G, 3G, as well as 4G, the 5G communication applications
    possess diverse abilities, including three main features: high Gbps speed of the
    mobile broadband, billions of connections of machine type communication, and 99.9%
    of the microsecond delay of ultra-low latency transmission to meet society''s
    demands in the coming decade.


    The 5G network is expected to have a massive impact on the life of humans, the
