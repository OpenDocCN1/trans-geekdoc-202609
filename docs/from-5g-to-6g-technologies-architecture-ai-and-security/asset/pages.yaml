    # 8.8.2 Benefits of Trust Networking for 6G


    Trust networking may be applied to specialized 6G networks in either local or
    nationwide usage. Using trust networks, they can be applied to packet data networks,
    PDN for short, which allow them to provide remote access to specialized networks
    or other critical infrastructure [14]. A single, simple administration use can
    handle the whole network with all the devices – meaning all the devices are owned
    by independent parties and different segments. Thus, the trusted network, in theory,
    must be able to handle multi-admin relations. When adding multiple trust domains
    where sharing the trust-related information will be set up within the domain.


    # 8.8.3 Constraints of Trust Networking in 6G


    To apply trust to an IP network or a mobile network, changes is required. It must
    be possible for the network to deploy those changes one network at a time. These
    changes, if needed, are to be relatively limited to a single administration. If
    a multi-stakeholder trust network is needed, no changes are allowed to be in the
