    # 5.1 Introduction


    The use of 5G in mobile devices worldwide is growing, and almost everyone can
    use it. But just as its possibilities were revealed, there are too limitations.
    Because of this idea, the data that we can go further again, leading us to conceptualize
    and pursue 6G. Emerging technologies would help us further our horizons, as we
    have never seen before. Artificial intelligence (AI) and the Internet of Things
    (IoT) will be deeply affected by this development. 5G has created amazed homes,
    smart cars, and everything in between, 6G could further create much more. New
    architectures have been designed for 6G, and there are new challenges and opportunities
    within this technology. Research on 6G has been recent, and there is a world of
    opportunities we could create as the years go by.


    Cognitive service architecture is a new design specifically for the core network,
    meaning it can potentially enhance the core network to provide the highest quality
    of service (QoS) and different scenarios. Cognitive service architecture would
    greatly enhance the performance of 6G. Frequency will be up to terahertz, bandwidth,
    and micro latency. New architecture would support all the needs and expectations
    that 5G was not able to satisfy.


    The 6G network should evolve continuously. While 6G makes be considered a successor
    to 5G, it could not be referred to as such. If there is not anything like 5G Advanced
    or 5G Enhanced, we might just say “weconnected” instead of all the names and numbers.
    Every decade or so, a new mobile network standard becomes the center of attention.
    This indicates that 6G networks could start rolling out by about 2030, or at the
    very least when many service providers will be conducting tests, and phone manufacturers
    will be building 6G-capable devices. On a 6G network, anything you do that requires
    a 6G network as an even server, advanced version. Every advantage that 5G delivers
    will be mirrored in 6G Enhanced. Statistics demonstrate the importance of strengthening
    communication networks. We are on to a society dominated by fully autonomous remote
    monitoring systems.


    Autonomous systems have gained traction in various fields - industry, agriculture,
    transportation, marine, and space. To create a smart life and automated processes,
    tons of sensors are incorporated into cities, automobiles, residences, enterprises,
    nutrition, sports, and other settings. As result, these applications will use
    a high-data-rate connection with high level of reliability. 5G communication protocols
    have already been installed in several regions of the world and were expected
    to be operated globally by 2022.


    # 5.2 Important Aspects of Sixth-Generation Communication Technology


    The transition from analog to digital communication of 6G has paved road for flexibility
    by means of frequency reuse multiple modulation schemes, adaptive equalization,
    and dynamic frequency allocation. The third-generation (3G) and fourth-generation
    (4G) cellular systems incorporated bundles of services such as data, voice, and
    video streaming. Access technologies such as code division multiplexing (CDMA)
    and orthogonal frequency multiplexing (OFDM) have enhanced multiplexing methods,
    flexible and adaptive rate, and interference management via the utilization of
    frequency farming and multiple streaming.'
