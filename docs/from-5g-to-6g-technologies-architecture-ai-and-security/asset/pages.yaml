    ledger of technologies and different policy approaches.


    # 8.8 Trustworthiness in 6G


    When thinking about trust in networks, some may feel to be more about expecting
    the security aspect, which is not entirely wrong. Trustworthiness of a network
    with remote parties in any session. It addresses all possible outcomes of any
    communication that could affect the value of communication. Trust spans all the
    protocol layers from the IP layer to the applications layer. Any system in trust
    network must consider these main questions [13]:


    +   - Can this interaction lead to a loss of data?

    - Should flows from remote networks be served under heavy loads?

    - Would it be best to dry flows and devote resources to other flows?

    - Is it possible that a source address in a packet is spoofed?

    - When communicating with a remote party, how does the help minimize any possible
    future attacks or any long-term privacy loss?

    - How do the parties protect their communicated data from leakage?


    # 8.8.1 Is Trust Networking Needed?


    In retrospect, 6G may be able to use for building a physical/digital world by
