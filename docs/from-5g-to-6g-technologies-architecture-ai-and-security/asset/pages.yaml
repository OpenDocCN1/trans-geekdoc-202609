    # 4.3.2 Benefits and AI in 5G and 6G



    * Enhanced mobile broadband (eMBB). The generation of applications that require
    higher data rates in a constant service system.

    * Massive-type communications (mMTC). Scalable connection needed for the number
    of wireless devices with the effective transmission of tiny amounts of data across
    broad coverage areas is a major feature of 5G communication services. This traffic
    of data will be benefited by applications such as body-aware networks, smart homes,
    IoT, and and drones.

    * URLLC (ultra-reliable low-latency communications) will be prioritized above
    data rates in connected healthcare, remote surgery, mission-critical applications,
    autonomous driving, and smart industry applications.


