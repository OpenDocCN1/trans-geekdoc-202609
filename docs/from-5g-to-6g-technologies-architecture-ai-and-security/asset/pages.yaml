- pgno: 16
  md: '# Preface


    The advancement of technology never stops because the demands for improved internet
    and communication connectivity are increasing. With the advancements in digital
    circuitry and microprocessors making sensors smaller, lighter, and more powerful,
    a digital stairway has opened. With wireless technology seeing exponential growth
    in the last decades, it is becoming one of the largest and fastest-growing industries
    in this technical revolution promoting economic competition. Opening new horizons
    that keep the industry on its toes.


    Wireless communications for mobile communications. Today 5G is a strong technology
    intensively developed; however, it has cells, autonomous cars, and other things.
    Like other technologies, the world has begun to leap.


    With every generation, new advancements are being made. These improvements have
    dramatically changed the international communication sector, how information is
    transmitted.


    Communications began about five decades ago and have expanded greatly. The transition
    from 4G to 5G has occurred rapidly in recent years. The transition has limitations
    with respect to future. As 5G networks, with their key technologies of MIMO, massive
    cells, and millimeter wave are rolling out, allowing for more devices to be connected
    to help pave the way for IoT, autonomous cars, and other things about next generation
    networks (6G). Wireless generation of 4G, and 5G are iterative steps rather than
    leaps. There are intermediate steps between each release.


    LTE-Advanced Pro before 5G implementation started. There will be the 5G-Advanced
    before it is time for 6G. 5G is starting to pave the way for vehicle communication
    and smart cities, which should create a platform for all connectivity driven by
    the applications such as multiuser XR, robotic and autonomous systems, brain-computer
    interfaces, blockchain and data analytics. 6G is expected to outperform 5G in
    multiple specifications, such as latency of less than 1ms—1ms for C-plane and
    U-plane, with greater data rates and Tbps throughput. It will support mobility
    up to several hundred km/h and spectral efficiency of 100Gbps/Hz. 6G will not
    replace 5G, but will offer a new frontier of connectivity with the world-


    New efficient technologies such as—Enhanced mobile broadband (eMBB-Plus), machine
    type communications (mMTC)—and secure ultra-reliable latency communications (URLLC)—support
    a host of applications across a diverse set of industries. 6G is expected to expand
    on vectors like high-reliability type communications, unconventional data communications
    technology (UCDC) for fully immersive 3D experiences and tactile Internet for
    real-time operation with audio, visual, and haptic feedback, health, autonomous
    vehicles, and beyond. The perpetual demand for more data bandwidth pushes researchers
    to explore underutilized spectrum in the sub-THz frequency bands. On the same
    scale, asymmetric waveform will become more prevalent in'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# Preface


    6G technology. Radio access network (RAN) enhancements will lead to a large number
    of base stations that can be in different forms, such as bands, FT, NFC, satellite,
    cloud-based WiFi, and


    In the era of 6G, several technologies such as AI to develop an intelligent network,
    big data analytics, and computing, will converge, and we will likely see extreme
    experiences with alternative forms of secure credential storage and trustworthiness
    in global service coverage. As public mobile networks are expected to exchange
    information with a broadening spectrum of parties, given the value of care services,
    devices, and users, security controls will have to be adaptable and dynamic in
    nature, by machine learning (ML) and artificial intelligence (AI). Advanced AI
    systems could be used to allow systems to be tested far more thoroughly to detect
    vulnerabilities in systems. To address the security of 6G networks, SDN and NFV
    must be combined with AI for proactive threat discovery, intelligent mitigation
    techniques, and self-sustaining networks. Enhancement in security will also require
    key management, publicity security and consideration of confidentiality, integrity,
    and availability of communication networks. As for the Telecom industry there
    are few regulations that come with more and more cases across the world. The priority
    list for many is the need for constant security advancements for device connectivity
    and the infrastructure involved. With the applications, these technologies are
    being used in medicine, manufacturing, banking, agriculture, and other important
    aspects of the economy. Security absolutely must be taken seriously to avoid a
    collapse in the economy on a global scale.


    The sixth generation has a significantly higher cost associated with its production,
    complexity, intelligent wireless energy infrastructure cannot support its implementation.
    Compared with its predecessor, the fifth generation radio research is still developing,
    with many scientific challenges that the industry need to overcome. It may take
    a while before the sixth-generation networking and connectivity will see itself
    deployed into integrated space, aerial, ground, and undersea communications systems
    for ubiquitous 3D coverage.


    We are pleased that the technology, academic, and industry communities discuss
    this important and fast-growing 5G-to-6G transition networking. We are certain
    that this book''s content will shed some light on these impacts on our daily life
    and economy. The chapters presented in this book discuss the technologies, design
    paths, implementation requirements, and solutions with AI and ML roles to pave
    the road for a higher generation of wireless technologies. The challenges and
    issues faced in providing applications and services to ubiquitously and securely
    user experiences are presented.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# Technologies and Development for the Next Information Age


    # 1.1 Introduction


    The advancement of technology stays because the demands for better internet and
    communication connectivity keep increasing. Just as 5G networks are rolling out,
    the world has begun to talk about sixth-generation networks (6G). The semantics
    of 6G is more or less the same as 5G networks because they strive to boost speed,
    machine-to-machine (M2M) communication, and latency reduction. However, some of
    the distinctive features of 6G include optimization of networks, challenges, and
    opportunities of 6G communication systems. We will discuss super-smart societies,
    extended reality, wireless brain-computer interfaces, haptic communication, smart
    healthcare, five-sense information transfer, the encompassing world of the Internet
    of Things (IoT), and cybersecurity.


    As we enter a new age of high-speed data transfer and the implementation of the
    tunnel. This is quite different from the light at the end, of the tunnel because
    of the advances that will take place when we start the journey to high-speed data
    transfer. This will enable us to emerge into a brand-new whole hole containing
    the advancements that have never been seen before. With the advancements in digital
    circuitry and microprocessors making sensors much lighter, and more powerful,
    a digital spillway has opened. These will pave the way for artificial intelligence
    (AI) and the Internet of Things (IoT) that have already changed our behaviors
