    # 2.13 3GPP


    Without the combined intelligence of the 3GPP organization, cellular services
    would not be what they are today. The 3GPP was established in 1998 and is an organizational
    grouping of telecommunication standard development organizations. 3GPP is not
    to be confused with 3PP2, which is an organization for standards on the competing
    technology of CDMA. The seven group members of 3GPP are ARIB (The Association
    of Radio Industries and Businesses, Japan), ATIS (The Alliance for Telecommunications
    Industry Solutions, USA), CCSA (China Communications Standards Association), ETSI
    (The European Telecommunications Standards Institute),'
