    # 8.10.8 Is Personal Information Really Personal?


    Personal information, or PI, and personally identifiable information (PII), are
    often used interchangeably when discussing information frameworks. Personal information
    covers a in-depth field of information, such as someone''s date of birth being
    considered personal information, but not personally identifiable information.
    That is considered personally identifiable information has to be unique to one
    person. This can be a social security number, as only one person can have this
    number in their lifetime, whereas multiple people can share the same name or date
    of birth.


    In turn, comes the question of how many features may become PII for any individual.
    The legal tests for PI relate to a situation where a single individual''s identity
    can be "reasonably ascertained." However, the definition of PI can be very broad
    and is said to cover any information that relates to an individual, at least any
    information is said to be covered and protected.


