    Information-centric networking (ICN) is a new technique in networking content
    as opposed to devices that have the connection. It has of warranted significance
    in network research and communities in change of standardization. National and
    supported research projects on a global scale. The ITU in the Telecommunication
    Standardization Project begins the ICN standardization process in 2012. The ICN
    Research Group of the Internet Research Task Force focuses on standards-oriented
