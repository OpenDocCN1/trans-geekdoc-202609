    communication is to make 6G more efficient by recycling energy and reducing the
    energy needed to run systems. Secure communication for 6G is dealing with cryptography-based
    security, which protects the physical layer properties to security settings. One
    of the challenges is securing the vast amounts of private data generated by REM
    and Isaac concepts.


    # 6.4 Emerging Applications of 6G Wireless Networks


    Normally, the categorization of 6G network services includes EMBB, URLLC, and
    mMTC. These applications are vital in ensuring optimal service delivery for technologies
    relying on 5G. With the early focus on 6G networks, some applications include
    holographic presence, remote surgery, XR, and autonomous driving. This, these
    applications require the criteria and standards for 6G success.


    5G already supports some of these applications, but it cannot keep up with the
    rising data demands. Therefore, 6G is vital in satisfying the data constraints
    reliably by 5G architecture. It is worth noting that the 6G network system will
    expand the communication efficiency by extending into space and underwater. Since
    6G technology is still in the early stages, it is hard to predict its full potential.


    # 6.4.1 Virtual, Augmented, and Mixed


    As its name suggests, virtual reality refers to things that create an immersive
