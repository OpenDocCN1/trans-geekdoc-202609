    Edge computing with AI will be essential, but also bring up its own challenges.
    Edge intelligence relies on the hierarchical trending of systems to allow analysis
    and prediction to happen closer to the edge, making way for real time analysis
    and prediction. However, its algorithms are highly data-dependent, meaning that
    it is very important that the data aggregated from reliable sources that can authenticate
    and guarantee integrity. This might be a great start for the implementation of
    blockchain to keep connectivity and authenticity. Another very interesting topic
