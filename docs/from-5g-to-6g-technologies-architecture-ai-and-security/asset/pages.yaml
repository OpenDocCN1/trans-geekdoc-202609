    # 1.2.4 Haptic Communication


    Haptic communication is also referred as as communication and 3D touch [7]. This
    is any technology that can create an experience of touch by applying forces, vibrations,
    or motions to the user. This technology can also be enhanced with VR to create
    virtual objects in a computer system control objects and enhance the remote control
    of machines and devices. Haptic technology helps how the human sense of touch
    works controlling haptic virtual objects. The different ways of implementation
    are listed here with a brief [8; 9]:


    +   - Vibration. This is created using an eccentric mass (ERM) actuator, which
    is an unbalanced weight attached to a motor shaft. When the shaft spins, the unbalanced
    weight causes the device to shake.

    - Force feedback. Devices use motors to manipulate the movement of an item that
    the user holds. This is best known in racing games that use a steering wheel that,
    when turned, gives the feel of resistance or pull in the opposite direction. This
    allows the haptic simulation of objects, textures, recoil, momentum, and objects''
    perceived physical presence in games.

    - Air vortices. A donut-shaped air pocket is made of compressed gusts of air.
    These gusts can blow out or move paper from a few yards away and can be delivered
    noncontact haptic feedback.

    - Ultrasound. A focused beam can be used to create a sense of pressure on a finger
    without touching the object. The beam can give sensations of vibration and give
    users the ability to feel virtual 3D objects.


