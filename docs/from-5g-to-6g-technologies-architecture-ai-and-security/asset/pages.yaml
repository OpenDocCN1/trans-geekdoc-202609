  md: '# Next Generations Networks: Integration, Trustworthiness, Privacy, and Security


    # 8.1 Introduction


    Wireless communication has been developed with significant changes and advancements
    since the 1980s with each generation. We have recently entered the fifth generation
    of wireless communication (5G). The adoption and deployment of this newest generation
    are underway but will likely take three to five more years to see fully realized.
    5G has brought about the move to the cloud for software-based networking on-demand,
    automated learning of networking functions. However, even with these advancements,
    researchers have already begun to look at the next generation (6G) and how the
    networking landscape will change with its adoption.


    Through a variety of technologies, 6G is expected to bring about a shift to completely
    intelligent network orchestration and management. Heterogeneous cloud infrastructure
    of 5G needs to visualize the architectural framework of 6G. Future networks may
    not disappear with the expectation of 6G as the addition of a new infrastructural
    component. Where it will begin to diverge from the present is the increased variety
    and flexibility of specialized networks for personal subnetworks and seamless
    flexible workload.


    With every next generation 6G networks will have their own privacy concerns that
    need to be addressed. Mobile security continues to be a very significant issue
    with each generation of wireless communications and seems to only get more difficult
    with each technological advancement. Past generations have dealt with everything
    from authentication issues to concerns of attackers, it is expected that 6G networks
    will see the same types of attacks such as zero-day attacks and physical layer
    attacks, but also increase in advanced attacks such as quantum-based attacks and
    artificial intelligence/machine learning-based (AI/ML) intelligent agents. The
    addition of AI to the networks of 6G will work for its security, in terms of communication.


    We must build on security research to gain insight into the challenges that will
    come with the next generations of communication. Networks may require Terabits
    per second (Tbps) connection speeds while also facilitating connectivity for high
    counts of devices like IoT and the flexibility of mobile devices that these networks
    use. With sensitive latency, end-end attacks of a network will require latency
    down to milliseconds. These extreme jumps in speed, density, and latency requirements
    will still require the 6G to be 100 times more energy efficient than current systems
    which may be achieved through low power communication in some cases.


    Latency-sensitive applications will have to consider the impact of increasing
    demands in the latency of the system, while the extremely high bandwidth of networks
    will offer many challenges for ingesting and processing the network''s data as
    it flows. Some applications will likely require processing locally to avoid these
    issues. As these networks with the diversity of devices on a given network and
    their ability to change their edge networks frequently and quickly. The hypothesized
    key performance indicators (KPIs) to help address these issues include protection
    level, time to resolution (TTR), coverage, average cost level, AI robustness,
    security AI model convergence time, security function round-trip time (RTT), and
    cost to deploy security functions.'
