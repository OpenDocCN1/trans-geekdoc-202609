  3. 2\n4. 5\n\n(后续重复内容已跳过)\n\n\n\n\n```java\nif (num1 == num2)\n    System.out.print(\"\
  The numbers are the same.\");\n```\n\n由于我们有一个 `if` 语句，根据 `num1` 的值是否与 `num2` 相，可能会发生两种情况：(1)\
  \ 如果条件为真，程序将显示字符串字量 `\"The numbers are the same.\"`；(2) 如果条件为假，程序将不会显示任何输出。\n\n\
  注意这里使用了布尔运算符 `==`（也称为相等运算符）；不要将此布尔运算符与赋值运算符 `=` 混淆。布尔运算符提出一个问题，而赋值运算符执行一条命令。`num1\
  \ = 4` *将*值 `4` *赋值给*变量 `num1`，而 `num1 == num2` *判断*两个值是否相等。赋值语句不产生其他结果，而布尔语句根据比较结果返回一个\
  \ `truth value`（真值）。\n\n如果生活中的条件能像我们之前的代码示例那样只取决于一个比较，那该多好啊？如果我们深入研究一下之前的闹钟例子，在开始早晨仪式之前，可能还需要做其他几个决策；其中一些决策可能是：“今天是上学日吗？”……“我觉得健康吗？”……“我的毯子粘在床垫上，把我困在它们之间了吗？”请注意，这些问题无论是否合理，都有真或假的（布尔）答案。\n\
  \n如果 `if`（看我们用了多少次这个词？）如果我们要在代码中加入更复杂的条件，必须创建一个 `compound condition`（复合条件）。复合条件包含至少一个布尔运算符；所有及其含义如下：\n\
  \n*   `&&` 逻辑 *与* (and)\n*   `||` 逻辑 *或* (or)\n*   `!` 逻辑 *非* (not)\n*   `==` 等于\n\
  *   `!=` 不等于\n\n让我们探索如何将这些每一个融入程序中。\n\n考虑一种情况：你需要休息一下，决定去当地的甜品店买零食。你最喜欢的甜点通常是意大利奶油卷（cannoli），但你也能接受苹果派。但苹果派有点干，所以只有在他们当天卖咖啡时，你才会买一个。\n\
  \n由于这个例子相对复杂，让我们把它拆分成块。\n\n在处理复杂的编程情况时，将其拆分成若干部分并逐一解决每个部分。\n\n我们将使用伪代码表示此示例。\n\n\
  让我们依次列出此示例中提出的条件：\n\n*   甜品店有奶油卷。\n*   甜品店有苹果派。\n*   甜品店有咖啡。\n\n这里的复杂之处在于，其中一些决策取决于其他决策。例如，如果甜品店**有**奶油卷，那么它是否有苹果派就无关紧了。再次，一步步来：从条件\
  \ (1) 开始。\n\n```text\nif (bakery has cannoli) buy dessert;\n```\n\n现在，必须根据这个决策做出另一个决策；如果甜品店**有**奶油卷，我们就得到了想要的甜点。如果甜品店**没有**奶油卷，我们必须尝试苹果派。\n\
  \n```text\nif (bakery has cannoli)\n    buy dessert; // 只有甜品店有奶油卷时发生\nelse if (bakery\
  \ has apple turnovers) // 只有甜品店没有奶油卷时发生\n    buy dessert; // 只有甜品店有苹果派时发生\n```\n\
  \n注意 `else` 关键字。`else` 关键字在条件为假时使用。情况没那么简单，所以我们必须考虑 `else` 关键字。\n\n```text\nif (bakery\
  \ has cannoli)\n    buy dessert; // 只有甜品店有奶油卷时发生\nelse if (bakery has apple turnovers)\n\
