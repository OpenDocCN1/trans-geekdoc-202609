  \ Exam` 的示例题\n*   往届的简答题提示和多选择题\n\n`AP Students` 的主页地址是 [apstudents.collegeboard.org](http://apstudents.collegeboard.org)。\n\
  \n欲获取有关 `AP Computer Science A Exam` 的最新信息，请访问 [apstudents.collegeboard.org/courses/ap-computer-science-a](http://apstudents.collegeboard.org/courses/ap-computer-science-a)。\n\
  \n最后，普林顿顿 提供辅导和小组教学。我们的专家讲师可以帮助你完善策略方法并增强内容知识。欲了解更多信息，请拨打 1-800-2REVIEW。\n\n## 你听过\
  \ AP 计算机科学原理吗？\n\n2017 年秋季，大学委员会推出了一门新的 `AP course` 和考试——`AP Computer Science Principles`（AP\
  \ 计算机科学原理）。正如大学委员会所说：“AP 计算机科学原理向学生介绍了计算机科学的核心思想，培养计算思维的思想和实践，并引导学生理解计算如何改变世界。学生使用艺术家、作家、计算机科学家和工程师赋予创意生命时相同的创作过程，开发创新的计算制品。”\n\
  \n这门课程是进入计算机科学世界的绝佳切入点，这个世界在历史上对很多人来说是非常令人生畏的。但他们所谓的“comp sci”（计算机科学）其实名有其实：计算机科学是一项让你学习如何“说”（编写）一种语言的课程，就像你学习法语或西班牙语一样。\n\
  \n### 大核心理念 (Big Ideas)\n\n大学委员会将课程分为 5 个大核心理念。它们是：\n\n*   创造性开发 (CRD)\n*   数据 (DAT)\n\
  *   算法与编程 (AAP)\n*   计算系统与网络 (CSN)\n*   计算的影响 (IOC)\n\n### 计算思维实践\n\n大学委员会将这门课程细分为计算思维实践：\n\
  \n#### 1. 计算解决方案设计\n设计并评估解决方案。学生应当：\n*   调查状况、背景\n*   确定实现目的合适方法\n\n#### 2. 算法与程序开发\n\
  开发并实现算法。学生应当：\n*   在不使用语言的情况下表示\n*   实现算法\n\n#### 3. 程序开发中的抽象\n开发包含抽象的程序。学生应当：\n\
  *   泛化数据源\n*   使用抽象管理复杂度\n*   解释抽象如何管理复杂度\n\n#### 4. 代码分析\n评估和测试算法及程序。学生应当：\n* \
  \  解释代码段的功能\n*   确定代码段的结果\n*   识别并修正算法和程序的错误\n\n#### 5. 计算创新\n研究计算创新。学生应当：\n*  \
  \ 解释计算系统如何工作\n*   解释如何从数据产生知识\n*   描述计算创新的影响\n*   根据伦理因素评估计算\n\n#### 6. 负责任的计算\n\
  为包容、安全、协作和伦理的计算文化做贡献。学生应当：\n*   在开发中协作\n*   在使用计算设备时使用安全的方法\n*   承认知识产权\n\n## 考试结构\n\
  \n你的 AP 计算机科学原理老师在教学这些内容的解释和选择方面有很大的空间，因此每门课程都是独特的。然而，考试本身相对明确。大学委员会对考试的安排如下：\n\n\
  ### 第一部分：多选题\n70 道多选题 | 2 小时 | 占总分 70%\n\n*   单选：57 题，从四个选项中选择一个\n*   带有计算创新阅读材料的单选：5\
  \ 题，根据阅读材料选择一个\n*   多选：8 题，从四个选项中选择两个\n\n#### 第二部分：创建任务\n1 个任务 | 占总分 30%\n\n*  \
  \ 根据创意应用程序\n*   开发学生选择的计算机程序\n\n\n\n\n\n| 主题 | 使用 `JAVA` 语言进行编程和解决问题的基础 | 计算的基础，包括解决问题、处理数据、理解互联网、网络安全和编程。教师将自行选择他们将使用的编程语言。\
  \ |\n| 目标 | 为未来的学习或计算机科学或其他 STEM 领域的职业发展培养技能 | 扩展你对计算机科学的理解，以适用于不同的专业和职业 |\n| 考试\
  \ | 一次期末考试：多选题和开放式问答 | - 一次期末考试：单选和多选格式的多项选择题<br>- 一项由教师在课程期间进行的性能任务 |\n\n## 结语\n\
  \n`AP 计算机科学原理 (`APCSP`) 可以是一门让你熟悉计算机科学领域的优秀课程。如果你已经报名了 `AP 计算机科学 A` (`APCS-A`)（你很可能已经报名了，因为你购买了这本书），那么我们假设你已经对计算机科学的核心思想（Big\
  \ Ideas）非常熟悉。因此，我们很快就会深入 `APCS-A`——首先，让我们快速思考一下你可能如何使用你的 `AP Exam` 分数。\n\n尽管许多学校会对两次考试都授予学分，但`每场考试对应的课程不同`；例如，`AP\
