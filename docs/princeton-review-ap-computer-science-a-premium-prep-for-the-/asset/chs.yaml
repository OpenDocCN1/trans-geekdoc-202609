  * 本书的 `Part VI` 包含额外的两份模拟测试，以及它们的答案、解释和评分指南。如果你跳过了 `Practice Test 1`，我们建议你完成所有三份测试（每份测试之间至少间隔一到二天），这样你可以比较自己的进度。此外，参加模拟测试将帮助你识别任何外部问题：如果你持续在某类问题上犯错，那么你可能需要复习该部分。如果你只错了一次，那可能是因为时间不够或被其他事情分了心。无论何种情况，检查测试结果都将让你能够关注导致分值差异的因素，并在考试当天做好充分准备。\n\
