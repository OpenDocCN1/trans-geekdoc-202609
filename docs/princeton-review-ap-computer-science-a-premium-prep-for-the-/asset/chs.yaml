  \ `z` 等于 `2`，所以 `w = 13 + 2.5 + 2`。正确答案是 `(D)`。\n\n返回第 6 章：迭代，第 6 章复习练习第 8 题\n\n\
  ### 9. D\n\n此题测试你对短路求值的理解。在每个代码段中，注意 `if` 语句中的短路逻辑。\n\n在 `I` 中，条件是 `x < y && 10/z`。首先评估\
  \ `x < y`。由于 `x` 小于 `y`，`x < y` 为假，整个表达式为假，不会发生除零错误。\n\n现在看 `II`。条件是 `x > y && 10/z`。同样，首先评估\
