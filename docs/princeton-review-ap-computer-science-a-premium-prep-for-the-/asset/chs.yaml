  * 使用标准数据结构\n* 开发并选择适当的算法和数据结构来解决新问题\n* 在面向对象的范式中流利地编写解决方案\n* 使用 Java 编程语言编写、运行、测试和调试解决方案，并利用来自\
  \ AP Java 子集的的标准 Java 库类\n* 阅读并理解由多个类和交互对象组成的程序\n* 阅读并理解导致此类程序的设计和开发过程的描述（此类解决方案的示例可以在\
