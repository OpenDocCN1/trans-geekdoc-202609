  \n考虑以下代码：\n\n```java\npublic int[] someMethod(int[] array, int value)\n{\n    for\
  \ (int i = 1; i < array.length - 1; i++)\n        array[i - 1] += value;\n    return\
  \ array;\n}\n```\n\n关于 `someMethod` 方法，以下哪种说法是正确的？\n\n1. 方法返回数组的最后一个值。\n2. 该方法会导致运行时错误。\n\
  3. 方法不会增加数组中第一个元素的值。\n4. 方法不会增加数组中最后一个元素的值。\n\n\n\n\n\n### 解题技巧\n\n返回值必须是一个整数数组，因此排除\
  \ (A)，因为 `array[i]` 是一个整数。循环在遍历数组时没有越界，且没有对数组中的元素执行任何非法操作。不会发生运行时错误，因此排除 (B)。`array[0]`\
  \ 被递增，是因为变量 `i` 初始值为值为 1。然后该方法递增了 `array[i - 1]`。根据同样的原理，最后一个元素不会被递增。`i` 的最终值将是\
  \ `array.length – 1`，这通常用于找到数组内的最后一个索引，但赋值语句使用了 `i - 1`（现在它代表数组的倒数第二个索引）。循环在没有访问最后一个元素的情况下终止，因此答案是\
  \ (D)。\n\n* * *\n\n![](img/024_c003_art_2.jpg)\n\n5![](img/011_sec_1_art_1.jpg)\
