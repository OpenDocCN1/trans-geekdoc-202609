  \ AP 计算机科学 A 考试分数的方式使用这本书。\n\n* **第一部分**的其余部分将提供如何使用这本书的指导，并帮助你确定自己的优势和劣势。\n* **第二部分**包含你的第一次模拟测试、诊断性答案、每个问题的详细答案和解析以及评分指南。我们建议你在继续后续之前进行此测试，以真实地确定：\n\
