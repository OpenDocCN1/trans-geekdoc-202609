  ## 第 6 章关键术语\n\n* 循环\n* while 循环\n* 死循环\n* 短路\n* for 循环\n\n## 第 6 章练习题\n\n练习题的答案可以在第\
  \ 12 章找到。\n\n1![](img/011_sec_1_art_1.jpg) Mark for Review\n\n考虑以下输出：\n\n0 1\n0\
  \ 2 4\n0 3 6 9\n0 4 8 12 16\n\n以下哪个代码段会产生此输出？\n\n```java\nfor (int x = 1; x < 5;\
  \ x++)\n{\n    for (int z = 0; z <= x; z++)\n    {\n        System.out.print(x *\
  \ z + \" \");\n    }\n}\n```\n\n\n\n\n\n```java\nSystem.out.println(\" \");\n}\n\
  ```\n\n2. `for (int x = 1; x <= 5; x++) {\n    for (int z = 0; z < x; z++) {\n \
  \       System.out.print(x * z + \" \");\n    }\n    System.out.println(\" \");\n\
  }`\n```\n\n3. `for (int x = 1; x < 5; x++) {\n    for (int z = 0; z <= 4; z++) {\n\
