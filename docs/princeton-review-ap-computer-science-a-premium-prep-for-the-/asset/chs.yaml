  \ AP 考试分 5、4、3、2 和 1。\n\n## AP 计算机科学 A 考试如何评分\n\n根据你回答正确的题目数量，你的测试将获得一个 1 到 5 分的数字分。\n\
  \n* 5 = 极其优秀\n* 4 = 优秀\n* 3 = 合格\n* 2 = 可能合格\n* 1 = 不建议\n\n大学会自行决定他们接受的用于大学学分和/或高级预读的最低分数。美国教育委员会建议接受\
  \ 3 分及以上的成绩，许多大学也遵循这些标准。大约 80% 参加 AP 计算机科学 A 考试的学生获得了 3 分或以上的成绩。请查看你计划申请的每所大学的网站，以便了解其在授予学分或高级预读方面的政策。\n\
