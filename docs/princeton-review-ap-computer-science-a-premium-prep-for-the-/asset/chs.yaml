  \n\n\n\n这里是真正让人困惑的部分——或者也许并不完全是。如果创建了原始数据值的副本，那么这两个副本（原始副本和新副本）是独立存在的。因此，如果你更改了其中一个副本的值，另一个不会受到影响。另一方面，如果创建了指向对象的新引用，那么通过该引用对对象的的修改将反映在所有引用上。再次借用超级英雄的例子：如果超人因为流行而把头发染成了金金色，那么克拉克·肯特和超人都会变成金发。。他们是引用同一个男人的两个名字，因此任何更改都会反映在所有引用中。如果我们突然决定超人/克拉克·肯特应该被称为“蓝脸大哥”而不是这两个名字中的任何一个，我们指的仍然同一个人；他现在有三个\
  \ `aliases`（别名）而不是两个。\n\n这对于理解对象的相等性非常重要。只有当两个对象实际上是同一个对象时，它们才被认为是等等的。在上面的超级英雄例子中，克拉克·肯特等于超人，因为他们是完全同一个人。\n\
  \n现在想象超人有一个一模一样的双胞胎兄弟，名叫 Duperman，化名为 Klarc Tenk。由于 Duperman 和 Klarc Tenk 是同一个人，所以\
  \ Duperman 等于 Klarc Tenk。因此，在 Java 中 `Duperman == Klarc Tenk` 为真。然而，尽管他们是同双胞胎，超人和\
  \ Duperman 是不同的人。因此，超人不等于 Duperman。在 Java 中，可以使用 `Object` 类的 `equals` 方法将超人和 Duperman\
  \ 识别为同胞胎。`equals` 方法接受一个 `Object` 参数，并且仅当两个对象具有相同的数据时才返回 `true`，无论它们是否为同一个对象。虽然布尔语句\
  \ `Superman == Duperman` 为假，但语句 `Superman.equals(Duperman)` 为真。\n\n### this 关键字\n\
  \n有时为了调用一个方法，调用对象可能能够引用自己。当一个对象调用方法时，一个隐式引用会被分配给调用对象。这个隐式引用的名称是 `this`。`this` 关键字是当前调用对象的引用，可以作为对象变量使用。例如：\n\
  \n```\nthis.mySize\n```\n\n* * *\n\n![](img/024_c003_art_1.jpg)\n\n使用以下不完整的类声明来回答问题\
