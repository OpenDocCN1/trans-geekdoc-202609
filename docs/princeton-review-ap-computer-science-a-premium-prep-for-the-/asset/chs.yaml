  \ 章复习练习\n\n# 第 13 章\n\n# 要求的实验时间和建议的实验\n\n本教程旨在帮助准备 AP Computer Science A 考试，但如果我们不讨论大学委员会规定的课程实验要求，将是不称职的。AP\
  \ Computer Science A 课程必须包含至少 20 小时的实践、结构化实验。大学委员会是这样规定的：每门 AP Computer Science\
  \ A 课程都必须包含大量的实验部分，学生在其中设计解决方案、精确地表达解决方案（即使用 Java 编程语言）、测试解决方案、识别并纠正错误（当错误发生时）。这些实验和活动总体应包含以下特征：\n\
  \n- 在显著水平上探索计算，基于提供了良好风格和适当使用语言构造的示例的现有代码。\n- 包含重大的问题解决部分，其中你研究解决问题的替代方法、解决新问题或修改现有代码以解决改变后的问题。\n\
  \n\n\n\n\n*   向你提供处理涉及多个交互类的程序的类经验，并可能涉及将程序分解为类，以及使用 AP Computer Science A 主题大纲中确定的继承和其他面向对象的概念。\n\
  \n大学理事会（The College Board）已在其网站上发布了 7 份学生实验指南。以下是这些指南的概述：\n\n*   **消费者评论（Consumer\
  \ Review）**——在实验中，学生将探索词汇的说服力。学生将学习情感值，以及如何使用字符串操作来构建或修改评论，使其更具正面或负面倾向。\n*   **数据（Data）**——在实验中，学生将讨论数据在决策中的重要性，学习如何设置和使用第三方库进行数据收集，并学习在数据被读入程序后如何进行处理。他们将综合这些技能来寻找相关数据并回答感兴趣的特定问题。\n\
  *   **隐信息术（Steganography）**——隐信息是将消息或信息隐藏在其他非秘密文本或数据中的实践。学生将使用与 `Picture Lab`（见下文几个实验）相同的代码来探索隐信息术和二维数组的概念，将图像或文本隐藏在其他图像内部。\n\
  *   **名人（Celebrity）**——学生将讨论与类似于猜词游戏的“名人”游戏相关的类设计。该实验将继承作为其中一项活动的基础，并包含一个图形用户界面（GUI）。\n\
  *   **数字 11（Elevens）**——此活动与一个名为 Elevens 的简单纸牌牌游戏有关。学生将学习 Elevens 的规则，然后使用提供的图形用户界面进行游戏。\n\
  *   **喜鹊型聊天机器人（Magpie Chatbot）**——学生将探索自然语言处理的一些基础知识。在探索过程中，他们将处理 `String` 类的各种方法，并练习使用\
  \ `if` 语句。学生将追踪一个复杂的方法以找到用户输入中的单词。\n*   **图片（Picture）**——学生将编写修改数字图片的方法。在编写这些方法时，他们将学习如何遍历整数或对象的二维数组。学生还将将嵌套循环、二进制数、接口和继承的介绍。\n\
  \n请访问大学理事会网站的 AP Computer Science A 部分获取有关这些每个实验的更多信息，以及可下载的 PDF。这些实验的地址为 `apcentral.collegeboard.org/courses/ap-computer-science-a/classroom-resources/lab-resource-page`。\n\
