  \ **授予学分**\n    * 3\n* **接受 APCSP 分数**\n    * 4 或 5\n* **授予学分**\n    * 3（注：以上信息仅供参考，具体以学校规定为准）\n\
  \n\n\n\n在完成多选题部分时，请始终记住，评分时不会根据你的思考过程或草稿进行评分。最终唯一重要的是你是否给出了正确答案。即使你不确定如何以一种方法论上的“正确”方式回答某个问题，也要看看是否能根据常识排除掉某些选项，然后进行猜测。\n\
  \n在整本书中，我们将指出哪些地方你可以利用常识来排除答案。\n\n虽然我们都希望能够用“正确”的方法解决问题，但使用排除法（POE）和激进的猜测可以帮助你多得几分。正是这些分数可能决定了\
  \ 3 分和 4 分之间的差距，或者将你从 4 分推到 5 分。\n\n### **不要害怕猜测**\n\n如果你不知道答案，就猜吧！作错答案没有惩罚，所以没有理由留空。显然，你能排除的错误答案越多，你猜中正确答案的概率就越大。\n\
  \n### **对长题要要有策略性**\n\n有些多选题需要阅读一页或两页才能回答问题。跳过任何需要大量时间阅读或大量时间计算的问题。将这些题目标记为待复，在完成该部分的其余题目后再回来处理。\n\
  \n### **不要把题目变成一场苦战！**\n\n大多数人在标准化考试中没有时间，并不是因为他们运行得太慢。相反，他们没时间是因为花了半的时间在两三个特定的问题上斗争。\n\
  \n你不应该在一个问题上花费超过两分钟的时间。如果你发现自己卡在一个超级难的问题上并纠结了三分钟，你正在偏离轨道！直接继续，并尽可能获得更多分数。如果一个问题不涉及计算，那么你要么知道答案，要么可以对答案做出有根据的猜测，要么你完全不知道答案是什么。弄清楚你在这个问题上处于什么位置，做出决定，然后继续。\n\
  \n任何需要超过两分钟计算时间的问题可能都不值得做。记住，在章节开始时跳过一道题，意味着你有时间在后面做对两道题，这是一件好事。\n\n### **两遍法系统**\n\
  \nAP 计算机科学 A 考试涵盖了广泛的主题。即使我们进行了广泛的复习，你也不可能知道 `Java` 中每个主题的一切。那么，你该怎么办？\n\n采用我们所谓的“两遍法系统”。两遍法意味着过一遍考试并先回答简单的题。将更耗时的题目留到稍后处理。（别担心——你会有时间在以后做的！）首先，阅读题目并判断它是“现在做”题还是“稍后做”题。如果你决定这是“现在做”题，就在草稿纸上解决它并点击\
  \ `Bluebook` 应用中的答案。如果是“稍后做”题，使用 `Mark for Review`（标记待审）工具在题目旁边添加一个小标记。然后继续移动。\n\
  \n一旦你完成了所有“现在做”的题目，回到你标记为 `Mark for Review` 的题目并开始处理这些题。先从简单的题开始。这些题目需要仔细注意算法细节，或者需要你排除答案选项（本质上，正确答案不会立即跳入你的眼帘）。\n\
  \n### **留意算法描述中的特殊情况**\n\n在考试中，你可能知道在二叉搜索树中查找元素的平均运行时间是 `O(n log n)`。如果题目随口提到数据是按顺序插入到树中的，请务必注意。此时运行时间会恶化为最坏情况\
  \ `O(n)`。这类题目可能会出现在 AP 计算机科学 A 考试中，因此请保持敏锐。\n\n### **记住递归算法中的基准情况**\n\n没有基准情况的递归方法会无限运行。确保存在基准情况且它是正确的基准情况。例如，一个基准情况为的阶乘函数\n\
  \n```\nif (n == 1){\n  return 0;\n}\n```\n\n是错误的，因为 `1! = 1`。\n\n### **留意 < vs.\
  \ <= 和 > vs. >=**\n\n`<` 与 `<=` 或 `>` 与 `>=` 之间的区别可能是巨大的，特别是在循环中。你可以打赌这种差异会出现在多选题中！\n\
  \n### **了解如何使用 AP 计算机科学 Java 子集**\n\n本章提供的策略将帮助你成为一个更好的考生，并希望帮助你在 AP 计算机科学 A 考试中获得更高的分数。然而，有些事情是你必须知道的。虽然考试时你会有一个\
  \ AP 计算机科学 Java 子集的 `Quick Reference`（快速参考），但请提前复习 AP 计算机科学 Java 子集的类，并了解可以使用哪些方法、它们的作用以及如何使用它们。`Quick\
  \ Reference`会有帮助，但它不能替代对类本身的了解。\n\n### **前置条件和后置条件**\n\n在给出时要仔细阅读。它们可能提供回答问题所需的线索。例如，一个前置条件可能会说明传递给方法的数组是有序的。\n\
  \n### **参数传递**\n\n记住，传递给方法的参数不会保留在方法内部对它们进行的修改。例如，编写一个交换两个整数基本类型值是不可能的。然而，不要将此与更改传递给方法的对象的内容（属性）混淆。\n\
  \n### **客户端程序 vs. 方法**\n\n可能会至少有一道题定义了一个类，并要求你在不同的方法实现之间进行选择。密切注意该方法是客户端程序还是类的方法。如果是客户端程序，它无法访问私有字段或私有方法。如果是类的方法，它可以自由访问私有字段和私有方法。\n\
  \n### **逻辑短路**\n\n`if` 和 `while` 语句中的条件判断会“短路”。例如，\n\n```\nif ((a != 0) && (b /\
  \ a == 5))\n```\n\n并不同于\n\n```\nif ((b / a == 5) && (a != 0))\n```\n\n因为 Java 在确定真值后将停止评估复合布尔语句。（稍后介绍。）\n\
  \n### **记忆德·摩根定律**\n\n考试中至少有一道题可以使用这些定律。\n\n`!(p || q)` 等于 `!p && !q`\n\n`!(p &&\
  \ q)` 等于 `!p || !q`\n\n### **查找类中的数据**\n\n留意那些尝试更改声明为 `final` 数据字段的代码段选项。这是非法代码。\n\
  \n### **表达式中混合 double 和 int**\n\n在涉及 `int` 变量和 `double` 变量的操作中，除非显式强制转换，否则 `int`\
  \ 会转换为 `double`，操作结果为 `double`。\n\n### **试错法**\n\n如果题目根据变量的值询问代码段的结果，为变量选取简单的值并根据这些值确定结果。排除任何与结果不一致的选项。这通常比用通用术语确定结果要容易。\n\
  \n\n\n除非你编写了某些极其复杂的代码（请参见下文关于是否应该这么做的说明），否则没有必要写注释。写注释会浪费时间（而你并没有很多时间），而且评分老师在很大程度上会忽略注释（如果你的注释正确但代码错误，你将得不到分）。此外，如果你的代码正确但注释错误，你还面临着误导评分者的风险。\n\
  \n### 不要为一个问题编写多于一个解决方案\n评分老师会根据他们看到的第一个解决方案进行评分。如果你重写了解决方案，请务必删除旧的那个。\n\n### 不要让任何道题留白\n\
  如果你什么都不写，你就得不到任何分。即使你不确定如何回答某个特定问题（或问题的某部分），也要分析该问题并编写方法的“基础代码”。\n\n例如，如果方法签名表示它将创建并返回一个\
  \ `ArrayList`，那么编写：\n\n```java\nArrayList returnedList = new ArrayList( );\nreturn\
  \ returnedList;\n```\n\n这很可能让你至少获得部分分——即使你不知道如何向 `ArrayList` 中填充正确的对象。\n\n### KISS（保持简单，学生）\n\
  简答题的设计初衷是让解决方案相对直观。如果你的解决方案变得复杂，那么可能有更简单或更好的方法来解决问题。同时，不要尝试编写看似优雅但不可读的代码。记住，评分老师在一周内必须批改数百份试卷——他们可能没有时间去弄懂你代码中所有的细微差别。保持简单！\n\
  \n### 编写标准解决方案\n使用 AP 风格的变量、类和方法命名，并遵循 AP 示例代码的缩进风格（即使你不喜欢他们的风格！）。尽管评分老师总是努力做到公平准确，但他们也是人，会出错。你的答案越接近给评分老师的参考答案，他们给你的打分就就越容易。\n\
  \n在可能的情况下，使用清晰直观的命名法。例如，在遍历二维数组的行和列时，使用 `r` 和 `c` 或 `row` 和 `col`，不要使用 `x` 和 `y`、`a`\
  \ 和 `b` 或 `jack` 和 `jill`。这确保了评分老师能够轻松跟上你代码的逻辑。\n\n### 如果给了算法伪代码，请使用它！\n有时你必须为某个方法创建自己的算法。但通常情况下，算法或方法的伪代码会作为问题的一部分给你；你只需要做的就是实现该算法。在这种情况下，请使用给你的伪代码！不要试图重新创建算法或实现你自己的特殊版本来增加自己的难度。此外，即使你不理解底层的算法，你通常也可以根据给定的伪代码为方法编写代码。\n\
  \n### 即使不会做第 (a) 部分，也要回答问题的 (b) 部分\n简答题的许多部分是建立在之前的基础上的。例如，第 (b) 部分可能会使用你在第 (a)\
  \ 部分编写的方法。然而，为了获得 (b) 部分的满分，你并不需要正确回答 (a) 部分。事实上，(b) 部分有时比 (a) 部分更容易。如果 (b) 部分说你应该使用\
  \ (a) 部分的内容，就用它吧！\n\n### 不要让简单题出错——避免错误\n学生经常在简答部分丢分是因为他们犯了常见的错误。以下是你可以采取的一些措施来避免这些错误。\n\
  \n* 除非问题*显式*要求你输出某些内容（使用 `System.out.print`），否则*永远不要*在你编写的方法中输出任何内容。\n* 注意方法签名。确保使用正确的名称以及正确的参数数量和类型来调用方法。如果方法不是\
  \ `void`，请确保你编写的方法返回一个与签名中指定类型相同的值。\n* 在调用方法时使用 `objectName.methodName()` 语法，在调用方法时使用\
  \ `ClassName.methodName()` 语法；使用 `ClassName.methodName()` 语法调用 `Math` 类的静态方法。\n\
  * 确保声明你使用的任何变量（并给它们具有描述性的名称）。\n* 不要在不需要时创建对象。例如，如果一个方法返回 `ArrayList`，将其声明为：\n\n\
  ```java\nArrayList returnedList;\nreturnedList = obj.getList( );\n```\n\n以及\n\n\
  ```java\nArrayList returnedList = new ArrayList( );\nreturnedList = obj.getList(\
  \ );\n```\n\n### 设计题\n确保使用正确的名称以及正确的参数数量和类型来调用方法。如果方法不是 `void`，请确保你编写的方法返回一个与签名中指定类型相同的值。\n\
  \n### ArrayList\n考试中至少有一题（可能是多道）涉及遍历 ArrayList。了解类型之间的区别以及如何遍历元素\n\n## 通用策略\n以下策略适用于选择题和简答题\n\
  \n### 使用草稿纸\n不要在脑子里做题。写下来！在题目上做标记。这不仅能让问题更容易解决，而且当你有时间时更容易回顾。\n\n### 标记题目中的关键词\n\
  *client program*、*sorted*、*ordered*、*constant*、*positive*、*never*、*always* 和 *must*\
  \ 等词规定了条件。在选择题和简答题中，阅读每道题时都要标记这些关键词。\n\n### 不要做多余的工作\n在选择题部分，你的过程不评分；在简答部分，即使答案巧妙或注释良好，也不会获得额外加分\n\
  \n### 先看一遍卷——使用两遍法\n记住，所有选择题的分值相同，每道简答题的分值也相同。没有必要按照顺序做。相反，使用两遍法。\n\n每个部分看两次。第一遍，完成所有你能得出答案的题目——即那些不需要太多分析的，或者你非常熟悉的计算机科学主题的题目。在第一轮中，跳过那些让你感到不安的题目。你可能也想跳过那些看起来需要计算的题目（你可能仍然被要求计算一些数字——即使没有计算器）。对跳过的题目进行标记，以便在第二遍时轻松返回。\n\
  \n当你完成了所有得手容易的题目后，返回挑选出你最有机会解决的难题。\n\n\n\n\n在选择题部分，你每题平均应该花费 2 分钟。这将让你在开头留出 3 分钟浏览试卷，并在结尾留\
  \ 7 分钟进行最后的检查。作为对比，如果你每题花费 3 分钟，你将只能回答 30 题；如果你每题花费 5 分钟，你只能回答 18 题。但请记住，每题 2 分钟是一个平均值。有些问题不需要这么多时间，所以某几题花费超过\
  \ 2 分钟也没关系。在完成第一轮后，根据题目数量和剩余时间重新评估你的速度目标。\n\n在简答题部分，你的节奏应该控制为每完成一个题目花费 20 分钟。这将使你每题大约有\
  \ 2 分钟检查答案，并在开头有 1 分钟查看题目。\n\n### 最后……\n\n不要恐慌。如果你已经做好了准备，测试比看起来看起来要简单。慢慢来，保持冷静并有逻辑地处理每一个问题，记住本章中的技巧，你就会没问题的。\n\
  \n### 准备进入下一阶段……\n\n现在你已经掌握了提示、策略和背景信息，是时候开始处理正事了……内容复习（第五部分）。阅读以下章节，做笔记，并将它们与你的教材和课堂笔记进行对比，以准备参加书末的练习测试\
  \ 2，然后是练习测试 3（在书更靠后），以及练习测试 4 和 5（在网上找到）。一旦你掌握了书中的内容并从练习测试的错误中汲取了教训，你就准备好应对真正的 AP\
  \ 考试了。\n\n## 反思\n\n想一想你在第四部分中学到的内容，并回答以下问题：\n\n* 你将会在选择题上花费多少时间？\n* 你将如何改变处理选择题的方法？\n\
  * 你的选择题猜题策略是什么？\n* 你将会在简答题上花费多少时间？\n* 你将如何改变处理简答题的方法？\n* 你是否会寻求本书之外的进一步帮助（例如来自老师、家教或\
  \ AP 学生），来学习如何处理选择题、简答题或速度策略？\n\n## 第五部分\n\n# AP 计算机 A 考试内容复习\n\n* 3 原始数据类型\n* 4\
  \ 使用类和对象\n* 5 布尔表达式和 if 语句\n* 6 迭代\n* 7 编写类\n* 8 数组\n* 9 数组\n* 10 二维数组\n* 11 递归\n\
  * 12 章节复习练习答案与解析\n* 13 强制实验时间和建议实验\n\n# 第 3 章\n\n# 原始数据类型\n\n**计算机科学**（Computer\
  \ Science，CS）是计算许多方面的正式名称，通常用于开发端；它的领域包括计算机编程，这正是在 AP 计算机科学 A (APSC-A) 中将要做的事情。APSC-A\
  \ 重点关注语言 `Java` 及其组件，在很多情况下，你将是程序员。虽然使用你程序的人（用户）通常只能看到程序的最终结果，但计算机科学为你提供了编写语句（代码）的工具，在理想情况下，这些代码会让使用者的体验既实用又有趣。\n\
  \n## 编程风格\n\n计算机编程类似于一种外语；它有名词、动词和其他词性，并且像口语语言一样有不同的风格形式。就像你对家人和朋友使用不同的词汇和说话方式（语气、表情等）一样，计算机科学有许多不同的语言，并且在每种语言内部都有其自己完成工作的方法。在计算机科学世界和\
  \ APSC-A 世界中，都预期特定的`编程风格`以显示对语言的熟练。可能会聘用你做计算机工作的公司可能会要求你符合其独特的编程风格；同样，大学委员会将根据其对全球大学接受的\
  \ CS 风格的研究，要求你符合其认可的编程风格。\n\n### 注释、标识符、空格\n\n**注释**是编程世界中至关重要的风格技术。注释实际上不会导致程序的行为发生任何变化；然而，注释有许多用途，包括：\n\
  \n* 允许程序员在程序中制作“笔记”，供他们以后可能需要引用\n* 允许阅读和/或使用程序的人（“读者”和/或“用户”）在适用情况下以一种不那么晦懂的方式理解代码\n\
  * 向程序员/读者/用户揭示程序运行所需的程序方面\n\nJava 中有两种类型的注释。行内注释（或短注释）出现在语句之后，并以 `//` 开头。跨越代码行的长注释被特殊字符包围；它们以\
  \ `/*` 开始并以 `*/` 结束。\n\n```java\n// 这是一个短注释\n\n/*\n这是一个长注释\n*/\n```\n\n**标识符**是赋予的名称，用于表示程序执行期间存储在计算机内存中的数据。Java\
  \ 不使用无意义的内存地址来引用数据，而是允许程序员命名一个标识符来执行这项工作。当我们在 Java 中命名标识符时，有以下指南：\n\n* 标识符可以包含字母、数字和下划线（`_`）的组合，但不能以数字开头且不能包含任何空格。\n\
  * 标识符应该是一个与其关联的数据相对应的逻辑名称；例如，与三角形边相关的标识符使用 `side1` 比使用 `s`更有用。\n* 标识符应该以小写字母开头，如果它由多个单词组成，应将每个后续单词的首字母大写。如果我们决定创建一个与三角形边数相关的标识符，`numberOfSides`\
  \ 或 `numOfSides` 符合这种风格；`NumberOfSides` 和 `numofsides` 则不符合。\n\n**空格**是另一种风格元素，它不影响程序的整体功能。相反，它通过允许程序员间隔分隔代码以区分特定的语句或任务来增强程序的可读性。就像书籍在章节末尾留出空白并在新页开始新章节一样，空格也有类似的效果。\n\
  \n### 编译与错误\n\n当程序员编写 Java 代码时，编写的是在 Java 开发环境中理解的语句。然而，计算机并不理解这种语言，就像你可能无法理解一种从未学习过的、在其母环境中使用的外语一样。因此，在开发环境中使用了**解释器**，使计算机能够理解\
  \ Java 代码。计算机使用仅用**二进制**代码（字面上的 0 和 1）运行，因此解释器“翻译”你的 Java 代码为二进制代码。这个过程被称为**编译**。结果是在在大多数情况下以及\
  \ AP 考试中，现代计算机程序员不需要直接理解二进制代码。\n\n\n\n\n\n当使用交互式开发环境（“IDE”）编译你的代码时，系统会自动检查代码中的基础编程错误。如果在代码中发现错误，编译将停止并产生错误信息（这种反馈正是“交互式”的体现）；这种这种情况被称为\
  \ `compile-time error`（编译时错误）。虽然错误信息/代码并不总是能直接提供直接帮助，但它确实允许程序员以更有针对性的方式排排除故障。遗憾的是，你将无法访问编译器。你的代码必须没有任何错误，才能获得回答的满分（或者在单选题中获得任何分值）。\n\
  \n`logical error`（逻辑错误）比 Java 代码本身的语法问题更难排查。逻辑错误存在于程序预期的输出/目的中。这好比你订购了晚餐，却收到了一份制作得非常完美的甜点：你确实得到了一个不错的结果，但它并不符合预期的任务。\n\
  \n`run-time error`（运行时错误）是编译器未捕获的、但在程序执行期间产生的错误。在很多方面，这对程序员来说是最糟糕（也是最尴尬）的错误，因为在任务被认为已经“完成”之前都不会发现这个问题。一个例子可能是你在图形程序中编辑喜爱的图片时发生的崩溃。这对用户来说是令人沮丧的，而你在公司网站上留下负面反馈时，对程序员来说也是恼的！\n\
  \n* *\n\n![](img/024_c003_art_1.jpg)\n\n1![](img/011_sec_1_art_1.jpg) 审查\n\n假设程序中的其他语句都是正确的，以下每个语句都能允许程序编译，除了：\n\
  \n1. 1. `// This is a comment`\n\n2. 1. `/* This is a comment */`\n\n3. 1. `// myname\
  \ is a good identifier name`\n\n4. 1. 以上所有语句均可编译。\n\n#### 破解方法\n\n选项 (A)、(B) 和 (C)\
  \ 都是 Java 中有效的注释，无论其内容如何，尽管 (B) 实际上并不比单行长。选项 (C) 使用了一个糟糕的标识符名称，而不是好的名称，但这种情况不会导致程序无法编译。因此，(D)\
  \ 是正确的。\n\n* *\n\n![](img/024_c003_art_2.jpg)\n\n## 对象与原始数据 (OBJECTS & PRIMITIVE\
  \ DATA)\n\n### 输出（以及一些输入）\n\n为了让你的程序从用户的角度来看“有所作为”（至少在这个层次上！），它必须向屏幕输出内容。程序可以向许多设备输出，包括存储驱动器和打印机，但\
  \ APSC-A 要求我们仅向屏幕输出。\n\n在本课程中，我们使用两个相似的语句向屏幕输出：\n\n`System.out.print(...);`\n\n\
  `System.out.println(...);`\n\n这些语句中的省略号代表将在屏幕上显示的数据和/或标识符。稍后会看到这些语句之间的区别。\n\n例如，如果边长为\
  \ 2 的三角形使用标识符 `side1` 存储在内存中，我们将该信息输出到屏幕，可以使用以下一种：\n\n`System.out.print(side1);`\n\
  \n`System.out.println(side1);`\n\n`println` 方法在输出后添加换行，而 `print` 则不会。如果我们想输出带有换行符的字符串，可以使用\
  \ `\\n` 转义序列：\n\n`System.out.println(\"First line\\nSecond line\");`\n\n这将输出：\n\n\
  ```\nFirst line\nSecond line\n```\n\n\n\n这条语句告诉编译器：(1) 我们的标识符名为 `side1`，(2) 分配给该标识符的数据应该是\
  \ `2`，且 (3) 我们的数据是一个整数（关于此点将在下一节详细介绍）。等号（`=`）被称为**赋值运算符**，是 Java 语言要求的。分号（我们在上面的输出语句中也见过它）表示该语句已结束。请注意，赋值语句**不会**向屏幕上产生任何内容。\n\
  \n当数据与标识符关联时，该标识符被称为**变量**。我们使用这个术语的原因是，就像数学一样，变量的值是可以改变的；它可以*发生变化*！请看以下代码：\n\n\
  ```java\nint myFavoriteNumber = 22;\nmyFavoriteNumber = 78;\nSystem.out.print (\"\
  My favorite number is \" + myFavoriteNumber);\n```\n\n你能预测输出结果吗？变量 `myFavoriteNumber`\
  \ 首先被赋值为 `22`，但随后它被重新赋值为 `78`。因此，原始值不再存储在计算机内存中，保留的是 `78`。输出将是：\n\nMy favorite number\
  \ is 78\n\n在此示例中需要注意的几点：\n\n*   一旦变量被赋予了类型（再次强调，稍后会详细介绍），就不应再次声明类型。这一事实解释了为什么第二个赋值语句缺少了\
  \ `int`。\n\n*   字符串字面量按原样输出，但输出的是变量的*值*而不是它的名称。\n\n*   为了在同一个输出语句中输出字符串字面量和数值，请在两个项目之间使用**连接运算符**。虽然这个运算符看起来像典型的\
  \ `+` 号，但它并不是传统意义上的“相加”值；它只是简单地将两个值并排输出。例如，在数学意义上二加二等于四，但 `2` 与 `2` 连接会产生 `22`。\n\
  \n* * *\n\n![](img/024_c003_art_1.jpg)\n\n3![](img/011_sec_1_art_1.jpg) 审阅标记\n\n\
  假设程序中的所有其他语句都是正确的，下列每个语句都允许程序编译，**除外**：\n\n1.  `System.out.print(\"Ilove Java\"\
  );`\n2.  `System.out.print(1 + \"love\" + \"Java\");`\n3.  `System.out.println(1\
  \ + \"love\" + \"Java\");`\n4.  `System.out.print(\"I love\" + \" \" + \"Java\"\
  );`\n\n#### 破解方法\n\n![APPLIED STRATEGIES](img/006_fm_1_art_7.jpg)\n\n选项 (A) 虽然其输出在语法上可能看起来不正确（他们喜欢在\
  \ AP 考试中这样做——记住，这不是语法测试！），但它可以无错误地通过编译。选项 (C) 是好的，因为数值与字符串字面量连接，产生了一个可以显示的字符串字面量。选项\
  \ (D) 使用了一个仅为空的字符串字面量，这是有效的。因此，(B) 是答案，因为 “Java” 缺少左侧引号。\n\n* * *\n\n![](img/024_c003_art_2.jpg)\n\
  \n## 四种数据类型\n\n假设程序中的所有其他语句都是正确的，下列每个语句都允许程序编译，**除外**……（等等，源代码在此处过渡到了新章节）。\n\n当程序员想要给变量分配数据时，他们必须首先决定是什么类型。共有四种基本类型：`int`、`double`、`boolean`\
  \ 和 `char`。\n\n**整数** (`int`）表示没有小数的整数。例如，`int age = 25;`。\n\n**双精度浮点数** (`double`）表示带有小数点的。例如，`double\
  \ price = 19.99;`。\n\n**布尔** (`boolean`）表示逻辑值：`true` 或 `false`。例如，`boolean isJavaFun\
  \ = true;`。\n\n**字符** (`char`）表示单个字符。例如，`char grade = 'A';`。\n\n\n\n\n当你对两个整数进行数学运算时，Java\
  \ 也会将结果作为整数返回因此，尽管 `4/5` 实际上是 `0.8`，但 Java 将返回值 `0`。同样，Java 会将 `5/4` 评估为 `1`。小数部分会被截断（而不是四舍五入），因此结果也将是一个整数。负数的操作也是类似的。Java\
  \ 将将 `-4/5` 返回为 `0`，将 `-5/4` 返回为 `-1`。很奇怪，吧？\n\n与所有的计算机科学问题一样，这个问题有一个解决办法，称为“类型转换”（`casting`）。类型转换是一个强制数据在编译器看来“看起来像”另一种类型数据的过程。你可以把它想象成在剧中被选角扮演某个角色的人；尽管演员有自己的个人身份，但他们为观众假装了新的身份。以下对语句\
  \ 3 的修改演示了类型转换的几种方式：\n\n```java\nSystem.out.print(3 - (double)(4)/5); // statement\
  \ 3.1\nSystem.out.print(3 - 4/(double)5); // statement 3.2\n```\n\n这些语句分别将 `4` 和\
  \ `5` 转换为 `4.0` 和 `5.0` 的 `double` 值。结果是除法将“升级”为 `double` 值之间的除法，而不是整数之间的除法，并返回想要的结果。以下语句虽然可以编译而不报错，但不会显示\
  \ `2.2` 的预期结果。\n\n```java\nSystem.out.print((double)3 - 4/5); // statement 3.3\n\
  System.out.print(3 - (double)(4/5)); // statement 3.4\n```\n\n类型转换的优先级高于算术运算符（当然括号除外）。因此，语句\
  \ 3.3 将先将 `3` 转换为 `3.0`，但在完成减法之前会先执行整数除法。结果是 `3.0`。在语句 3.4 中，整数除法的结果被转换为 `double`；由于整数除法的评估结果为\
  \ `0`，类型转换只会使结果变为 `0.0`，从而输出为 `3.0`。\n\n\n\n\n\n- 编译器将 Java 代码转换为二进制代码。无效代码将阻止这一过程并导致编译时错误。\n\
  - 逻辑错误不会阻止程序编译，但会导致非预期的结果。\n- 运行时错误也不会阻止程序编译，而是会导致程序在执行期间意外停止。\n- AP 计算机科学 A 考试使用\
  \ `System.out.print()` 和 `System.out.println()` 进行输出。假设任何输入均存在，学生不需要编写输入代码。\n- 变量必须用数据类型进行初始化。它们使用\
  \ `=` 运算符进行赋值。\n- 测试的原始数据类型有有 `int`、`double` 和 `boolean`。`String` 是一个非原始类型，但也经过广泛测试。\n\
  - AP 计算机科学 A 考试会测试 `int` 和 `double` 的运算符 `+`、`-`、`*`、`/` 和 `%`。\n- 可以 `Math` 类执行额外的数学运算。\n\
  - `+` 用于连接字符串。\n\n# 第 4 章\n\n## 类和对象的使用\n\n**对象**是我们在 Java 中创建的实体或数据类型。为了实现这一目标，我们使用专门为此目的构建的**类**。类包含属于对象的实例字段（数据）以及操纵这些数据的方法。我们将在后面的章节中详细回顾这些内容。现在，让我们深入研究\
  \ `Math` 类。\n\n#### Math 类\n\nAP 计算机科学 Java 子集的一部分是 `Math` 类。`Math` 类存储了数学计算中常用的常用数字（`Math.PI`\
  \ 和 `Math.E`）以及执行数学函数的方法。`Math` 类的方法是静态的（static）。稍后会有更多关于静态方法的介绍，但现在，请记住，要调用 `Math`\
  \ 类的方法，程序员必须在方法名之前输入 `Math.`。`Math` 类包含许多方法，但只有少数属于 AP 计算机科学 Java 子集。与我们用于创建对象的大多数类不同，我们通常不创建\
  \ `Math` 对象。\n\n#### 常用 Math 方法\n\n| 方法 | 返回值 |\n| :--- | :--- |\n| `Math.abs(x)`\
  \ // `x` 是一个 `int` | 等于 `x` 绝对值的 `int` |\n| `Math.abs(x)` // `x` 是一个 `double` |\
  \ 等于 `x` 绝对值的 `double` |\n| `Math.pow(base, exponent)` | 等于底数的指数幂的 `double` |\n\
  | `Math.sqrt(x)` | 等于 `x` 平方根的 `double` |\n| `Math.random()` | (0, 1) 范围内的随机 `double`\
  \ |\n\n理解运算符的优先级对于 AP 考试中的选择题至关重要，或许更重要的是，为了在社交媒体上大显风头——当那些“解决这个问题”的梗包出现，大家都在争论正确答案时。\n\
  \n一位数学老师正在编写一个可以正确计算圆面积的程序。回圆的面积是 $\\pi$ 乘以半径平方（$\\pi\\textsuperscript{r}\\textsuperscript{2}}$）。假设\
  \ `Math.PI` 返回 $\\pi$ 的精确小数近似值，以下哪个语句**不会**计算出半径为 22 的圆的准确面积？\n\n1. `r*r*Math.PI;`\
  \ // `r` 是整数 `int` 22\n2. `(double)r*r*Math.PI;` // `r` 是整数 `int` 22\n3. `(double)(r*r)*Math.PI;`\
  \ // `r` 是整数 `int` 22\n4. 以上所有选项都将计算出准确面积。\n\n##### 破解方法\n\n选项 (A) 会对 `r*r` 使用整数乘法，但在乘以\
  \ `Math.PI`（一个 `double`）时，它将所有内容转换为双精度浮点。选项 (B) 和 (C) 将某些值强制转换为 `double`，但如上所述，这不会以非预期的方式影响结果。因此，答案是\
  \ (D)。\n\n需要注意的是，`Math.PI` 是 `Math` 类的一个静态变量。因此，只有在类代码的顶部通过以下语句导入该类后，才能调用它：\n\n\
  ```java\nimport java.lang.Math;\n```\n\n#### String 类\n\n`String` 是一个对象数据类型，这意味着它有一个类，其中包含许多描述该对象行为的方法。下面是\
  \ `String` 类中常用的方法的表格。\n\n#### 常用 String 方法\n\n| 方法 | 返回值 |\n| :--- | :--- |\n|\
  \ `length()` | 等于字符串长度的 `int` |\n| `substring(int beginIndex)` | 一个 `String`，是该字符串的子字符串，从\
  \ `beginIndex` 处的字符开始到字符串末尾 |\n| `substring(int beginIndex, int endIndex)` | 一个\
  \ `String`，是该字符串的子字符串，从 `beginIndex` 处的字符开始，但不包含 `endIndex` 处的字符 |\n| `equals(Object\
  \ anObject)` | 一个**boolean**（布尔），反映将此字符串与指定对象比较后的状态 |\n\n```java\nString str1 =\
  \ \"frog\";\nString str2 = \"frog\";\nboolean isEqual = str1.equals(str2);\n// 返回\
  \ true\n```\n| `equals(String anotherString)` | 反映对两个字符串进行字典顺序比较后状态的 `int`<br>-–\
  \ 如果 `string1` 在 `string2` 之前，则返回小于 0 的整数<br>-– 如果 `string1` 与 `string2` 相等，返回 0<br>-–\
  \ 如果 `string1` 在 `string2` 之后，返回大于 0 的整数 |\n\n```java\nString str1 = \"cat\";\n\
  String str2 = \"dog\";\nstr1.compareTo(str2); // 返回 -1\n\nstr1 = \"cat\";\nstr2\
  \ = \"cat\";\nstr1.compareTo(str2); // 返回 0\n\nstr1 = \"dog\";\nstr2 = \"cat\";\n\
  str1.compareTo(str2); // 返回 1\n```\n\n`String` 类中还有许多方法可以让你的编程更简单。虽然 `char` 数据类型没有直接测试，但可以理解\
  \ `String` 类是一个数组。考虑以下代码：\n\n```java\nString sample = \"Sample\";\nSystem.out.print(sample.length());\n\
  ```\n\n代码将输出数字 6。此外，字符串使用索引。字符串第一个字符的索引是 0，最后一个字符的索引是 `length()` – 1。索引在处理子字符串（字符串的一部分）时非常有用。`String`\
  \ 类有两个 `substring` 方法。一个有两个整数参数：\n\n`substring(int from, int to)`\n\n该方法返回一个 `String`\
  \ 对象，从 `from` 开始到 `to` – 1 结束的子字符串。注意 `to` 处的字符**不会**包含在子字符串中。因此，使用上面的 String `sample`，命令\n\
  \n```java\nSystem.out.print(sample.substring(1, 4));\n```\n\n将显示 `amp`。注意\n\n```java\n\
  System.out.println(sample.substring(1, 7));\n```\n\n将导致 `IndexOutOfBoundsException`，因为索引\
  \ 7 – 1 = 6 超出了字符串的边界。\n\n另一个 `substring` 方法类似，但只使用一个参数来指示起始索引。生成的子字符串将持续到字符串的末尾。因此，命令\n\
  \n```java\nSystem.out.print(sample.substring(1));\n```\n\n将显示 `ample`。\n\n这一过程可以通过\
  \ `String` 类的 `indexOf` 方法反转。该方法接受子字符串作为参数并返回该子字符串首次出现的位置。例如，\n\n`sample.indexOf(\"\
  amp\")`\n\n将返回 1，因为该子字符串首次出现在索引 1。然而，\n\n`sample.indexOf(\"amb\")`\n\n将返回 -1，因为该子字符串没有出现。`String`\
  \ 类是**不可变**的（immutable）。它没有修改器方法。因此，如果你想更改 `String` 对象的内容，必须将新内容重新赋值给变量。让我们看看下面的代码：\n\
  \n```java\nString sample = \"Sample\";\nsample.substring(1, 4);\n```\n\n虽然这段代码不会引起错误，但\
  \ \"amp\" 没有被存储，使得它毫无用处。相反，我们将从 `substring` 命令获得的 `String` 重新赋值给原始变量，这样 `sample`\
  \ 现在包含字面量 \"amp\"。\n\n```java\nsample = sample.substring(1, 4);\n```\n\n\n\n\n在使用任何类的方法时，你应该记住，调用该方法时使用的参数必须与定义方法时定义的参数的数据类型匹配。\n\
  \n例如，`substring` 的定义如下：\n\n`equals(int beginIndex, int endIndex)`\n\n因此，以下代码将导致编译错误，因为预期的参数类型为\
  \ `int` 类型：\n\n```\nsample = sample.substring(1.0, 4.0);\n```\n\n![](img/024_c003_art_1.jpg)\n\
  \n2![](img/011_sec_1_art_1.jpg) 复习题\n\n考虑以下代码段：\n\n```java\nString s = \"This is\
  \ the beginning\";\nString t = s.substring(5);\nint n = t.indexOf(\"the\");\n```\n\
  \n在下列选项中，`n` 的值将是？\n\n1. -1\n2. 3\n3. 7\n4. 9\n\n### 解题技巧\n\n题目要求求 `n` 的值，即 `\"\
  the\"` 在 `String t` 中的 `indexOf` 结果，而 `t` 是 `s` 的一个子字符串。首先确定 `t`，它是从 `s` 的索引 5 开始的子字符串。记住从\
  \ 0 开始计数，并将空格视为字符。索引 0 是 “T”，索引 1 是 “h”，索引 2 是 “i”，索引 3 是 “s”，索引 4 是空格。因此，索引 5 是\
  \ “is” 开头的 “i”。由于 `substring` 方法的调用中只有一个参数，因此继续到 `String s` 的末尾，得到 `String t` 被赋值为\
  \ `\"is the beginning.\"`。现在找到“the”的索引。由于索引 0 是 “i”，索引 1 是 “s”，索引 2 是空格，子字符串 “the”位于索引\
  \ 3。因此，`n` 的值是 3，对应选项 (B)。\n\n![](img/024_c003_art_2.jpg)\n\n![](img/024_c003_art_1.jpg)\n\
  \n3![](img/011_sec_1_art_1.jpg) 复习题\n\n给定以下代码，哪一行会导致编译错误？\n\n```java\n1 String word\
  \ = \"Sunday Funday Celebration 1.0\";\n2 word.substring(7);\n3 word.substring(3,\
  \ 6);\n4 word.indexOf(\"day\");\n5 word.indexOf(1.0);\n```\n\n1. 第 2 行\n2. 第 3 行\n\
  3. 第 4 行\n4. 第 5 行\n\n### 解题技巧\n\n在寻找编译错误时，语法通常是罪祸首首。乍一看，所有方法的名的拼写都是正确的，因此下一步检查参数的数量和数据类型，确保它们与每个方法的预期参数匹配。`substring`\
  \ 方法可以有 1 或 2 个参数，只要它们代表该字符串的有效整数索引。因此，第 2 行和第 3 行是正确的。`indexOf` 方法寻找特定的字符串。第 4\
  \ 行使用了字符串，但第 5 行尝试使用 double 类型。因此，第 5 行（选项 D）会导致错误。\n\n![](img/024_c003_art_2.jpg)\n\
