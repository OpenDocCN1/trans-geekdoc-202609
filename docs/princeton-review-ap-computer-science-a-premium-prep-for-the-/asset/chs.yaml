  \ 7 章\n\n## 第 7 章总结\n\n*   类是控制语句的组合。类可以包含方法和变量。在 AP Computer Science A 考试中，所有类方法都是公共的（public），可以被其他类访问；而所有类变量都是私有的（private），不能被其他类访问。\n\
  *   方法是执行特定任务的代码组。\n*   方法可以接受任意数量指定类型的变量作为输入参数，并返回一个指定类型的值作为输出。然而，方法不需要任何参数，也不需要返回任何值。\n\
  *   对象是类的特定实例。对象通过一个或多个引用来标识。\n*   对于静态类（static class），所有方法和变量必须通过类名调用。对于非静态变量，所有方法和变量必须通过对象引用调用。\n\
  *   在 AP Computer Science A 考试中，所有对象变量都是私有的，因此不能被其他类调用；所有对象方法都是公共的，因此可以被其他类调用。\n\
  \n## 第 8 章\n\n# 数组\n\n`array` 是控制语句的组合。类可以包含方法和变量。在 AP Computer Science A 考试中，所有类方法都是公共的（public），可以被其他类访问；而所有类变量都是私有的（private），不能被其他类访问。\n\
  \n方法是执行特定任务的代码组。\n\n方法可以接受任意数量指定类型的变量作为输入参数，并返回一个指定类型的值作为输出。然而，方法不需要任何参数，也不需要返回任何值。\n\
  \n对象是类的特定实例。对象通过一个或多个引用来标识。\n\n对于静态类（static class），所有方法和变量必须通过类名调用。对于非静态变量，所有方法和变量必须通过对象引用调用。\n\
  \n在 AP Computer Science A 考试中，所有对象变量都是私有的，因此不能被其他类调用；所有对象方法都是公共的，因此可以被其他类调用。\n\n\
  ## 原始类型与对象\n\n`array` 是一种让数据处理更简单的数据结构。`array` 可以存储原始数据或对象引用。`array` 的每个元素都通过索引访问。`array`\
  \ 的索引从 0 开始。访问元素时，使用方括号，如 `arrayName[index]`。\n\n声明数组时使用以下语法：\n\n```java\ntype[]\
  \ arrayName;\n```\n\n初始化数组时，可以使用 `new` 关键字：\n\n```java\ntype[] arrayName = new type[size];\n\
  ```\n\n或者，你可以使用初始化列表来初始化数组：\n\n```java\ntype[] arrayName = {value1, value2, ...,\
  \ valuen};\n```\n\n更改数组中的值时，使用赋值运算符：\n\n```java\narrayName[index] = newValue;\n\
  ```\n\n遍历数组通常使用 `for` 循环：\n\n```java\nfor (int i = 0; i < arrayName.length; i++)\
  \ {\n    // 处理 arrayName[i]\n}\n```\n\n\n\n\n注意 `index` 的值将 0, 1, 2, 3 和 4，尽管它存储了五个元素。由于索引从\
  \ 0 开始，你必须在索引 5 之前停止遍历数组，否则你将收到 `ArrayIndexOutOfBoundsException` 且程序执行将被中断。AP 考试中的简答题通常会测试你编写不越界代码的能力。\n\
  \n数组还有一个由 `<arrayName>.length` 返回的常量值，该值将返回数组中的元素个数。上面的循环可以写成：\n\n```java\nfor (int\
  \ index = 0; index < testgrades.length; index++)\n    testGrades(index) -= 2;\n\
  ```\n\n比写多行要好得多，对吧？这个循环系统地改变了数组中的每一个值。我们仅仅触及了数组用处的一角，并且已经提高了我们的编码效率。\n\nAP 考试将要求你创建、遍历和修改数组；简答题中充满了数组，并且会特别说明必须创建一个数组。《课程与考试说明》（Course\
  \ and Exam Description）特别指出，简答题 3 和 4 题与数组有关（3 题是 Array/ArrayList，4 题是 2D Array）。\n\
  \n程序员需要确保数组的每个元素都包含一个有意义的值，否则可能会出现不想要的结果。在整数数组中，未赋值元素的值将默认为 0。考虑以下代码段，它将计算你五份考试成绩的平均分：\n\
  \n```java\nint total = 0, len = testGrades.length;\ndouble average;\nfor (int index\
  \ = 0; index < len; index++)\n    total += testGrades[index];\naverage = (double)\
  \ total / len;\n```\n\n如果你五份成绩都存储在数组中，这段代码段将正确计算平均分。然而，如果你没有输入其中一个分数，它将保持存储为 0 并错误地拉低你的平均分，这（显然）是一个不想要的结果。\n\
  \n执行上述代码段有另一种方法。这涉及使用“增强 for 循环”（enhanced-for loop）。增强 for 循环可以自动遍历数组的每个元素。\n\n\
  ```java\nint total = 0, len = testGrades.length;\ndouble average;\nfor (int grade\
  \ : testGrades)\n    total += grade;\naverage = (double) total / len;\n```\n\n在增强\
  \ for 语句中，冒号后面必须引用一个之前声明的数组或 ArrayList（稍后会详细介绍 ArrayList）。循环将对列表中的每个元素进行迭代，从索引 0\
  \ 到索引长度 - 1。然而，没有使用变量来引用当前索引。相反，位于当前索引的元素被存储在冒号之前声明的变量中。（该变量必须与数组中存储的类型相同。）因此，上面的增强\
  \ for 循环按索引递增的顺序，一次一次将数组 `testGrades` 的每个元素存储为变量 `grade`。然后它将 `grade` 加到 `total`\
  \ 中。因此，增强 for 循环的功能与上一个示例中的 `for` 循环相同。增强 for 循环的优点是它在遍历数组时不会引起 `ArrayIndexOutOfBoundsException`，并且它大大缩短了元素的写法。\n\
  \n***\n\n![](img/024_c003_art_1.jpg)\n\n1![](img/011_sec_1_art_1.jpg) 审核标记\n\n考虑以下代码段：\n\
