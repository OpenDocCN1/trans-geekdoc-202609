  \ array[0];\n}\n```\n\n`mystery` 方法中存在错误。以下哪些修改可以修正编译错误？\n\n1. 在循环语句中将 `array.length\
  \ - 1` 改为 `array.length`。\n2. 将 `array[i] = 0;` 改为 `array[i - 1] = 0;`。\n3. 将返回语句更改为\
  \ `return array;`。\n4. 以上选项均无法使方法通过编译。\n\n### 解题技巧\n\n该方法的问题在于返回类型 `int[]` 与方法尝试返回的值类型\
  \ `int` 之间不匹配；(C) 解决了这个问题。选项 (A) 和 (B) 尽管有效，但不能修正返回类型问题。选项 (D) 是错误的，同样是因为返回类型问题导致方法无法编译。答案是\
  \ (C)。\n\n* * *\n\n![](img/024_c003_art_2.jpg)\n\n## 搜索\n\n一旦数据存储在数组中，一项常见任务是有条理地在数组中搜索给定数据。考虑你当地连锁餐厅“路边外带”区域的一排停好的汽车。当服务员将食物送到某个特定的汽车时，她必须使用一个属性——例如车牌号——找到正确的汽车。一旦找到了正确的汽车，服务员就可以交付食物，然后回到室内处理下一个订单，重新开始整个过程……一遍又一遍。\n\
  \n这种技术也用于搜索数组。在 APCS 中，我们有两种搜索数组的方法：**顺序搜索**（sequential search）和**二分查找**（binary\
  \ search）。由于这两种搜索方法都使用不同的公式来搜索数组，它们通常被称为**搜索算法**。\n\n上述连锁餐厅的例子是顺序搜索的一个例子。所有的汽车都“排好队”，服务员从第一辆车开始，检查其车牌号是否与她正在寻找的号码匹配。如果正确，服务员交付食物并返回。如果不正确，她就移动到下一辆车并重复该过程；当\
  \ (1) 找到正确的汽车或 (2) 正确汽车不在队列中时，过程结束。这种顺序过程运行良好，尽管它可能非常乏味。如果目标汽车在队伍末尾而不是开头，服务员需要做更多工作。记住，我们正在为计算机编程；服务员不能像我们在现实生活中那样简单地一眼看到所有的牌牌。除非我们知道如何编写实现这一功能的程序，否则计算机不知道如何“看”。\n\
  \n在整数数组 `nums` 中对数字 `target` 执行线性搜索的代码段可能如下：\n\n```java\nfor (int i = 0; i < nums.length;\
  \ i++)\n    if (nums[i] == target)\n        System.out.print(\"Found at \" + i);\n\
  ```\n\n此段落将正确地遍历数组搜索 `target`，从索引 0 开始并持续到索引 `length - 1`，符合预期。记住 `nums.length`\
  \ 是数组的大小，因此 `nums[i]` 是元素。除非我们知道如何编写实现这一功能的程序，否则计算机不知道如何“看”！\n\n（注：原文包含关于循环和搜索逻辑的重复且混乱的句子；核心逻辑已保留。）\n\
  \n顺序搜索运行良好，尽管它可能非常乏味。如果目标汽车在队伍末尾而不是开头，服务员需要做更多工作。\n\n相比之下，二分查找要高效得多；把它将其看作一种“分治”机制即可。它要求数据经过排序。\n\
  \n增强型循环结构可能如下：\n\n```java\nint loc = 0;\nfor (int num : nums) {\n    if (num ==\
  \ target)\n        System.out.print(\"found at \" + loc);\n    loc++;\n}\n```\n\n\
  \n\n\n\n1. 在无序的糖果列中寻找 Twix 巧克力，使用二分搜索效率最高。\n2. 在有序的糖果列中寻找 Twix 巧克力，使用顺序搜索效率最高。\n\
  3. 在有序的糖果列中寻找 Twix 巧克力，使用二分搜索效率最高。\n4. 以上都不是\n\n### 解题技巧\n\n只要数组是排序的，使用二分搜索通常通常效率更高——因此排除\
  \ (A)，因为你不能对无序数据使用二分搜索。然而，如果目标不在中间位置，二分搜索将需要一次以上的比较，而线性搜索（也称为顺序搜索）在目标位于队首时仅需要一次比较。因此，在\
  \ (B) 和 (C) 中提出的每种情况取决于 Twix 巧力的位置，都可能是效率最高的。答案是 (D)。\n\n***\n\n![](img/024_c003_art_2.jpg)\n\
  \n***\n\n![](img/024_c003_art_1.jpg)\n\n7![](img/011_sec_1_art_1.jpg) 标记复审核\n\n\
  假设目标在数组 `a` 中，以下种方法能正确返回排序数组 `a` 中 `target` 的索引？\n\n```java\npublic int findTarget(int[]\
  \ a, int target)\n{\n    for (int x = 0; x < a.length; x++)\n    if (a[x] == target)\n\
  \        return x;\n}\n```\n\n```java\npublic int findTarget(int[] a, int target)\n\
  {\n    int k = 0;\n    for (int x : a)\n    {\n        if (x == target)\n      \
  \      return k;\n        k++;\n    }\n    return -1;\n}\n```\n\n```java\npublic\
  \ int findTarget(int[] a, int target)\n{\n    int f = 0, h = a.length, g = 0;\n\
  \    for (int i = 0; i < h; i++)\n    {\n        g = (f + h)/2;\n        if (a[g]\
  \ < target)\n            f = g + 1;\n        else if (a[g] > target)\n         \
  \   h = g – 1;\n    }\n    if (a[g] == target)\n        return g;\n    return -1;\n\
  }\n```\n\n1. 只有 I\n2. 只有 II\n3. 只有 II 和 III\n4. I、II 和 III\n\n### 解题技巧\n\n注意，选项\
  \ I 和 II 看起来是线性搜索，而 III 看起来是是二分搜索。选项 I 将无法编译，因为非 void 方法必须返回数据。没有 `else` 的 `if`\
  \ 语句意味着可能不会返回数据——尽管假设这种情况不会发生——所以编译器会在此停止。排除 (A) 和 (D)。由于 (B) 和 (C) 都包含选项 II，因此它一定是正确的；跳到选项\
  \ III。注意这些变量有点混乱——但 front/middle/back 分别对应 `f`/`g`/`h`，所以它们按字母顺序排列。选项 III 是一个很好的二分搜索，它通过在未找到\
  \ `target` 时返回 `-1` 避免了选项 I 中的返回问题，这是编写搜索算法时的常见做法。因此，选项 II 和 III 是正确的，答案是 (C)。\n\
  \n***\n\n![](img/024_c003_art_2.jpg)\n\n## 排序\n\n在 AP 计算机科学 A 中，你可能会学最有用的算法可能是排序算法——它们可能也最难理解。如果你到目前一直跟得上这本书，那么你有一个良好的开始。\n\
  \n正如名称所示，排序算法将获取数组中的数据并将其排列成特定的顺序。我们已经知道，如果我们想使用二分搜索算法搜索数据，这种技术是有用的。但想象一下现实生活中这种自动化过程：一个自动按高度排序你橱柜里杯子的过程，一个自动将你的作业按时间顺序排列的过程，以及一个按优先级顺序排序你的待办事项列表的过程。不用说，排序算法是非常强大的。\n\
  \n选择排序（Selection sort）我们将讨论的第一种排序算法，也是你在 AP 考试中需要的三种排序算法之一。这是一种查找交换算法，所以你应该记住选择排序是查找并交换。与顺序搜索类似，该排序将首先遍历数组寻找最小值。一旦找到最小值，它将它的位置与数组中索引为\
  \ 0 的数据进行交换。现在，第一个元素已经排序好了。然后对索引 1 重复该过程。在数组的剩余部分寻找最小值，并与索引 1 的数据交换。注意，如果最小值已经在位置上，它将留在原处。\n\
  \n考虑下面的数组。我们希望从到到大排序此数组。\n\n![](img/049_c008_art_1.jpg)\n\n我们的策略是首先找到数组中的最小元素并将其放在第一个位置。我们将找到剩余元素中的最小值，并将其放在第二个位置。我们将继续这样做，直到数组有序。\n\
  \n我们可以从查看数组中的每个元素开始（从第一个元素开始）并找到最小元素。对于人来说，找到最小元素很容易。然后我们将找到剩余元素中的最小值，并将其放在第二个位置。我们将继续这样做，直到数组有序。\n\
  \n我们可以从查看数组中的每个元素开始（从第一个元素开始）并找到最小元素……（注：由于原文中存在多处重复的描述策略的段落，在翻译时已根据逻辑进行了整合处理，确保核心算法逻辑清晰）。\n\
  \n### 选择排序的实现\n\n```java\npublic static void selectionSort1(int[] numbers)\n{\n\
  \    for (int i = 0; i < numbers.length – 1; i++)\n    {\n        int position =\
  \ i;\n        for (int k = i + 1; k < numbers.length; k++)\n        {\n```\n\n\n\
  \n\n\n```java\nif (numbers[k] < numbers[position]) {\n    position = k;\n}\nint\
  \ temp = numbers[i];\nnumbers[i] = numbers[position];\nnumbers[position] = temp;\n\
  ```\n\n这有什么用呢？考虑一种情况：你有一个包含 1000 个 `Student` 对象的未排序数组，每个 `Student` 对象都有一个方法，可以返回该\
  \ `Student` 的平均学分（GPA）。如果你想找到平均学分最高的五个学生怎么办？在这种情况下，对整个数组进行排序将浪费时间。相反，我们只需要运行上面所示选择排序第二种实现的五个循环，前五名学生就会排好序。\n\
  \n`插入排序`（insertion sort）稍微没那么直观。它不是遍历整个数组，而是比较前两个元素，并根据比较结果，将第二个值插入到第一个值的“前面”并放入索引\
  \ 0，将第一个值移动到索引 1。现在前两个元素已经排好序。然后检查第三个元素，并继续插入。注意，在这里，已经排序的元素也将保持其原位置。\n\n下面是一个包含\
  \ 9 个元素的数组。除了最后一个元素外，该数组按从小到大的顺序排序。\n\n![](img/049_c008_art_10.jpg)\n\n我们希望移动 15，使整个数组有序。首先，我们将\
  \ 15 临时赋值给一个变量。这将为我们在需要时将其他元素向右移动提供空间。\n\n`temp = 15`\n\n![](img/049_c008_art_11.jpg)\n\
  \n然后我们将 15 与其左侧的第一个元素比较：22。因为 22 大于 15，我们将 22 向右移动。\n\n`temp = 15`\n\n![](img/049_c008_art_12.jpg)\n\
  \n接着我们将 15 与下一个元素比较：17。因为 17 更大，我们也将其也向右移动。\n\n`temp = 15`\n\n![](img/049_c008_art_13.jpg)\n\
  \n接下来，我们将 15 与 14 比较。因为 15 更大，我们不想将 14 向右移动。相反，我们将 15 插入数组中的空单元格中。现在数组已正确排序。\n\n\
  插入 15：\n\n![](img/049_c008_art_14.jpg)\n\n现在我们来看如何使用上述所示的思想来对整个数组进行排序。这个示例将从排序过程开始开始。\n\
  \n这是我们要排序的数组。\n\n![](img/049_c008_art_15.jpg)\n\n首先，我们只看数组的前两个元素，以确保它们之间是有序的。\n\n\
  ![](img/049_c008_art_16.jpg)\n\n为了做到这一点，我们将从数组中取出 6（我们的子数组中最靠右的数字）并将其临时赋值给一个变量。然后我们将\
  \ 6 与 8 比较。因为 8 更大，将 8 向右移动，然后将 6 放在 8 所在的单元格。\n\n`temp = 6`\n\n![](img/049_c008_art_17.jpg)\n\
  \n这是数组的样子。\n\n![](img/049_c008_art_18.jpg)\n\n现在我们需要相对于 6 和 8 将 7 放在合适的位置。我们首先将\
  \ 7 赋值给一个变量。\n\n`temp = 7`\n\n![](img/049_c008_art_19.jpg)\n\n然后我们将 7 与其左侧的第一个数字：8\
  \ 比较。因为 7 小于 8，我们将 8 向右移动一位。\n\n`temp = 7`\n\n![](img/049_c008_art_20.jpg)\n\n接下来，我们将\
  \ 7 与数组中的下一个数字：6 比较。因为 6 小于 7，我们不想将 6 向右移动。相反，我们将 7 放在第二个单元格。我们的数组现在看起来如下：\n\n![](img/049_c008_art_21.jpg)\n\
  \n现在我们需要相对于数组中的前 3 个元素将 10 放在它的位置。\n\n`temp = 10`\n\n![](img/049_c008_art_22.jpg)\n\
  \n首先我们将 10 与 8 比较；因为 8 小于 10，我们不需要将 8 向右移动。事实上，我们可以将 10 放回它原来的那个单元格。\n\n![](img/049_c008_art_24.jpg)\n\
  \n### 插入排序的实现\n\n这是在 Java 中实现插入排序的方法。\n\n```java\n// precondition: x 是一个整数数组； x.length\
  \ >= 0\n// postcondition: x 从小到大顺序排序\npublic static void insertionSort(int[] x)\
  \ {\n    for (int i = 1; i < x.length; i++) {\n        int temp = x[i];\n      \
  \  int j = i - 1;\n        while (j >= 0 && x[j] > temp) {\n            x[j + 1]\
  \ = x[j];\n            j--;\n        }\n        x[j + 1] = temp;\n    }\n}\n```\n\
  \n注意，和选择排序一样，插入排序包含嵌套循环。在这种情况下，我们有一个嵌套在 `for` 循环中的 `while` 循环。从第 3 行开始的 `for` 循环从索引\
  \ 1 进行到数组的末尾。`while` 循环从 `i` 遍历数组。注意，在这里，已经排序的元素也将保持其原位置。（注：此处原文后半部分存在重复或乱码的描述，翻译时已根据逻辑进行了通顺处理）\n\
  \n\n\n\n\n### 归并排序实现\n\n以下是在 Java 中实现归并排序的方法。\n\n```java\n//precondition: x 是一个整数数组；x.length\
  \ >= 0\n//postcondition: x 从小到大排序\npublic static void mergeSort (int[] x) {\n  \
  \  int[] temp = new int[x.length];\n    mergeSortHelper(x, 0, x.length – 1, temp);\n\
  }\n\npublic static void mergeSortHelper (int[] x, int lowIndex, int highIndex, int\
  \ temp) {\n    if (lowIndex < highIndex) {\n        int mid = (lowIndex + highIndex)\
  \ / 2;\n        mergeSortHelper(x, lowIndex, mid, temp);\n        mergeSortHelper(x,\
  \ mid + 1, highIndex, temp);\n        merge(x, lowIndex, mid, highIndex, temp);\n\
  \    }\n}\n\npublic static void merge(int[] x, int lowIndex, int mid, int highIndex,\
  \ temp) {\n    int l = lowIndex;\n    int m = mid + 1;\n    int n = highIndex;\n\
  \    while (l <= mid && m <= highIndex) {\n        if (x[l] < x[m]) {\n        \
  \    temp[n] = x[l];\n            l++;\n        } else {\n            temp[n] =\
  \ x[m];\n            m++;\n        }\n        n++;\n    }\n    while (l <= mid)\
  \ {\n        temp[n] = x[l];\n        l++;\n        n++;\n    }\n    while (m <=\
  \ highIndex) {\n        temp[n] = x[m];\n        m++;\n        n++;\n    }\n   \
  \ for (n = lowIndex; n <= highIndex; n++) {\n        x[n] = temp[k];\n    }\n}\n\
  ```\n\n这显然比另外两种排序更为复杂，并且涉及到多个方法的使用。第一个方法将数组分成两部分，第二个方法对各个部分进行排序，第三个方法将这两个部分合并为一个有序数组。\n\
  \n## 第 8 章核心术语\n\n- 数组 (array)\n- 初始化列表 (initializer list)\n- 索引数字 (index numbers)\n\
  - 遍历 (traverse)\n- 满 (full)\n- 数组越界异常 (ArrayIndexOutOfBoundsException)\n- 增强型 for\
  \ 循环 (enhanced-for loop)\n- 空 (null)\n- 空指针异常 (NullPointerException)\n- 顺序查找 (sequential\
  \ search)\n- 二分查找 (binary search)\n- 搜索算法 (search algorithms)\n- 排序算法 (sorting algorithms)\n\
  - 选择排序 (selection sort)\n- 插入排序 (insertion sort)\n- 归并排序 (merge sort)\n- 递归 (recursion)\n\
