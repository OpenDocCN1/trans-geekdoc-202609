  \ 6);\n4 word.indexOf(\"day\");\n5 word.indexOf(1.0);\n```\n\n1. 第 2 行\n2. 第 3 行\n\
  3. 第 4 行\n4. 第 5 行\n\n### 解题技巧\n\n在寻找编译错误时，语法通常是罪祸首首。乍一看，所有方法的名的拼写都是正确的，因此下一步检查参数的数量和数据类型，确保它们与每个方法的预期参数匹配。`substring`\
