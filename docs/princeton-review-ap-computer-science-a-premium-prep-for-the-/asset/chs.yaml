  \n## 方法 (METHODS)\n\n将一个 Java 类想象成一个衣柜，拥有几乎无限的可能性。如果你声明一个架子来放置，比如，游游戏盒……那将是组织你的游戏、玩具和其他精致物品的一种极佳方法。\n\
  \n类是通过方法以这种方式组织的。\n\n**方法**（method）是执行特定任务的代码组。\n\n虽然类可以简单地包含一个命令列表，但任何完成任务的程序都可能很容易膨到\
  \ 100 行代码或更多。与其编写一个包含巨大无乱代码列表的类，不如为每个小任务（在总任务内部）编写单独的方法，这是使你的代码更具读性的极佳方法。此外，基于方法的类能够更轻松地控制控制。\n\
  \n为了理解这个概念，让我们分解夏天中间一个明媚的周六（别担心——你能够搞定的）。也许你做的某些活动可能包括起床（显而易见）、吃早餐、洗澡、为海滩做准备、开车去海滩、享受海滩和吃午饭。这些活动都有自己特定的组成部分；例如，吃早餐的一部分包括喝橙汁和服用每日维生素补充剂。模拟这个周六活动的程序伪代码可能看起来如下：\n\
  \n```java\npublic class Saturday1\n{\n    hear alarm;\n    turn off alarm;\n   \
  \ get out of bed;\n    make breakfast;\n    eat breakfast;…\n}\n```\n\n你明白我的意思了……一个从上到下发生的长命令列表。现在，将这些一般性活动中的每一个视为一组较小活动的独立分组，称为方法。每个小活动将在稍后定义，但你的周六类将看起来整洁得多：\n\
  \n```\npublic class Saturday2\n{\n    wake up method; // 包括闹报\n    eat breakfast\
  \ method; // 包括准备、橙汁，\n    // 维生素，等\n    take a shower method; // 包括准备洗\n    //\
  \ 澡，等\n    beach method; // 包括为海滩做准备、开车\n    // 去海滩\n}\n```\n\n你明白我的意思了……一个从上到下发生的长命令列表。现在，将这些一般性活动中的每一个视为一组较小活动的独立分组，称为方法。每个小活动将在稍后定义，但你的周六类将看起来整洁得多：\n\
  \n```\npublic class Saturday2\n{\n    wake up method; // 包括闹报\n    eat breakfast\
  \ method; // 包括准备、橙汁，\n    // 维生素，等。\n    take a shower method; // 包括准备洗\n    //\
  \ 澡，等。\n    beach method; // 包括为海滩做准备、开车\n    // 去海滩\n    eat lunch method;\n}\n\
  ```\n\n结果是一个更易读的、结构更良好的类。创建一个用于控制程序（例如 `Saturday2`）的类被称为**驱动类**（driver class），因为它通过其结构执行较小的命令。此外注意，如果出于某种原因，程序员想在洗澡前吃早餐，那么\
  \ `Saturday2` 中的两行就会交换，任务也就完成了。\n\n**对象类**（object class）是驱动类调用的方法的“核心”类。当你理解了这种设置后，你会发现驱动类开始变短，而对象类开始扩展。例如，汽车的驱动程序执行一系列简单的动作：启动发动机、系安全带、检查后视镜、加速、转向。驱动程序并不实际上理解（也不需要理解）这些操作是如何工作的：他只需执行。加速油板如何让汽车移动得更快？不，驱动程序只需操作油板，其余在内部完成。对象类是“内部”类。它定义了对象的各个方面；具体来说，它定义了对象“拥有”什么以及“做什么”。\n\
  \n本节提到的对象类不与 Java 中的 `Object` 类混淆，它是所有类的父。Java 中的每个类都继承 `Object` 方法。对于 AP 考试，你必须能够编写、调试和理解对象类。回到早餐示例……对象类的伪代码可能像这样：\n\
  \n```java\npublic class Saturday3\n{\n    wake up(..)\n    {\n        hear alarm;\n\
  \        turn off alarm;\n        get out of bed;\n    }\n    breakfast(..)\n  \
  \  {\n        make breakfast;\n        eat breakfast;\n    }\n}\n```\n\n由于我们的对象类可以用于一周中的任何一天，而不只是周六，`BeachDay`\
  \ 可能是该类更合适的名字。之前的驱动类（执行该天的一系列动作）可能被称为 `Saturday`。\n\n* *\n\n![](img/024_c003_art_1.jpg)\n\
  \n2![](img/011_sec_1_art_1.jpg) 审阅\n\n下列哪一个陈述最能描述太阳眼镜的高效设计？\n\n1. 1. 三个类：`UnfoldGlasses`、`CleanGlasses`\
  \ 和 `WearGlasses`\n2. 1. 一个 `UnfoldGlasses` 类，带有方法 `CleanGlasses` 和 `WearGlasses`\n\
  3. 1. 一个 `PairOfSunglasses` 类，带有布尔变量 `unfolded`、`cleaned` 和 `worn`\n4. 1. 一个 `PairOfSunglasses`\
  \ 类，带有可以 `unfold`、`clean` 和 `wear` 对象的方法\n\n\n\n\n```java\npublic class Phone {\n\
  \    private boolean hasApp;\n    public Phone() {\n        hasApp = false;\n  \
  \  }\n    public void downloadApp() {\n        hasApp = true;\n    }\n    public\
  \ void closeApp() // closes the app\n        if (hasApp)\n            System.out.println\
  \ (\"App is closed.\");\n    }\n    public void openApp() // opens the app\n   \
  \     if (hasApp)\n            System.out.println (\"App is running…\");\n    }\n\
  }\n```\n\nOUTPUT:\n```\nApp is running…\nApp is closed.\n```\n\n这个程序中有许多组件；首先，注意我们现在有两个类构成了一个单一程序。在孤立状态下，这两个类中的任何一个都不会产生有用的结果。`UsePhoneApp`\
  \ 类将无法编译，因为如果方法不存在，编译器就无法理解它们（编译器：`openApp` 是什么意思？）；而 `Phone` 类可以编译，但如果没有 `UsePhoneApp`，它实际上并不会实际执行任何操作（编译器：我应该什么时候调用\
  \ `openApp`，在哪部手机上调用？）。为了让 `UsePhoneApp` 类访问 `Phone` 类，必须在文件顶部的类声明上方使用 `import Phone;`。\n\
  \n`Phone` 类中的第 4–7 行构成了一种特殊的方法，称为`构造方法`（constructor）。对象在执行任何操作之前必须先被构造，就像汽车在行驶之前必须先制造一样。`UsePhoneApp`\
  \ 中的第 6 行调用了这个构造方法，它“构建”了 `Phone` 对象；此命令必须在调用非构造方法之前发生；否则，编译器将返回错误。想象有人按着一个想象中的油门踏板试图在没有汽车的情况下开车去某处。很有趣，但这是可能的。\n\
  \n`Phone` 的第 3 行定义了 `Phone` 是否拥有应用（true）或没有（false）。这是我们程序中 `Phone` 对象的唯一属性；更复杂的程序可能有几十个甚至数百个属性（实际上，手机有更多属性，例如屏幕、音量按钮等）。程序员应该编写这些属性，它们被称为`实例变量`（instance\
  \ variables）或`字段`（fields）。紧随数据字段之后的是如我们之前所说的构造方法，然后是一系列控制 `Phone` *能够做什么*的方法。\n\n\
  对象类定义了对象拥有什么（HAS）以及能做什么（DOES）。\n\n一个方法包含几个组件。方法头部以非常特定的方式构建；其语法如下：\n`visibility\
  \ returnType methodName (param1, param2, …)`\n\n方法的可见性可以是公共的（public）或私有的（private），取决于具体情况（稍后详细介绍）。`返回类型`（return\
  \ type）标识了在执行命令后，方法将返回什么类型的数据（如果有的话）。方法的名字与变量名相似，应该是一个直观的、总结方法功能的名称；它应该符合与变量名相同的规范（以小写字母开头等）。`参数`（parameters）是可选的，是方法执行其任务所需的数据。\n\
  \n在我们之前的示例中，`closeApp` 的方法头部是：\n`public void closeApp()`\n\n这在功能上可行，但对于这个示例来说也相对简单。它的可见性是\
  \ `public`，返回类型是 `void`（没有返回任何信息），并且它没有参数。一个更真实的在手机上关闭应用的方法可能需要关于何时应该关闭的信息，并可能返回数据，例如是否成功关闭。因此，修改后的方法头部看起来可能像这样：\n\
  `public boolean closeApp (int minutes)`\n\n注意，单个参数 `minutes` 定义了它的类型。由于 `minutes`\
  \ 将是一个只在此方法执行期间存在的临时变量，它必须直接在头部中定义为新的。方法可以有任意数量的参数，取决于程序员对程序的设计决策。\n\n方法必须以头部开头，头部包含一个可见性修饰符（`private`\
  \ 或 `public`）、返回类型（如果不返回任何信息则为 `void`）以及一个方法名。参数是可选的，取决于方法执行任务的需求。\n\n方法的最终目的是对对象执行某种任务。注意\
  \ `openApp()` 和 `closeApp()` 仅仅是访问数据字段 `hasApp` 并做出相应的反应；即，只有当值 `hasApp` 为 true\
  \ 时才会显示消息。`downloadApp()` 方法在某种方面更为深层；它不仅仅是访问数据，而是实际上改变了数据字段的值——在这种情况下，一旦“应用”被“下载”，就会将\
  \ `hasApp` 更新为 true。因此，在 Java 中，通常将 `openApp()` 和 `closeApp()` 等方法标记为`访问器方法`（accessor\
  \ methods），将 `downloadApp()` 等方法标记为`修改器方法`（mutator methods）。\n\n在本章中我们已经多次使用了汽车的类比，但它是理解这些概念的一种棒方法。当你想要启动汽车时，必须经过一系列步骤。\n\
  \n某些情况下，可能会出现多种方式启动汽车的情况——例如，所有者有一个按钮启动和一个远程启动器。设计者可以编写两个 `startCar` 方法（或者三个、四个……），每个方法执行相同的任务但需要不同的信息（参数）。这一过程被称为`重载`（overloading），可以通过编写具有相同名称但不同类型或数量的方法来实现。\n\
  \n### 前置条件 (Precondition)\n\n前置条件（precondition）是一种向用户提供更多关于方法状态并保证其真实的注释。\n\n在 AP\
  \ 考试中，前置条件是方法上方的注释。调用方法的程序负责不传递违反前置条件的参数。\n\n```java\n/*** precondition—a 和 b 是正整数\n\
  */\n```\n\n### 后置条件 (Postcondition)\n\n后置条件（postcondition）是在执行某些代码段之后或在正式规范的某个操作之后始终为真的条件。\n\
  \n在 AP 考试中，后置条件作为注释写在方法之前或内部，如下例所示。方法设计者负责确保满足这些条件。\n\n```java\npublic int sum100(int\
  \ a, int b)\n{\n    // postcondition—如果 sum 大于 100 则返回 100，否则返回 sum 的值\n    if (sum\
  \ < 100)\n        return sum;\n    else\n        return 100;\n}\n```\n\n方法可以接受任意数量的参数，但只能返回一个数据值或对象。\n\
  \n作为本部分的最后一个示例，考虑一个试图编写代表书籍的对象的类的程序员（就像这本书，只不过任意更有趣）。程序员可能考虑的一些数据有：\n\n*   书籍*拥有*什么？封面、页码、文字……\n\
  *   书籍可以*做*什么？它可以被阅读、被快速扫读、被收起来……\n\n\n\n\n\n根据这些信息，程序员可以开始编写对象类（object class）。程序员必须首先确定哪些项目与情况相关，以保持对象类尽可能高效。例如，如果程序员正在设计一本用作镇纸纸的书，那么讨论书中有多少个单词可能并不重要，因此该数据字段就不会被纳入程序中。同样，如果程序员不是一个在短时间内学习惊人数量书籍的学生（听起来很熟悉吧？），那么设置一个快速略读书籍而非仔细阅读的方法可能也并不相关。类将根据这些决策进行构建。\n\
  \n如你所见，对程序的 `planning`（规划）与实际编写程序一样重要，甚至更为重要。在某些课程中，你的老师可能会在在你完成最终产品之前提醒你“写一个大纲”或“写一个初稿”，而你可能会跳过这一步直接进入最后的单元并仍然取得成功。但对于任何深层次层次的编程（本课程在某种程度上要求做到这一点）而言，规划对于确保你的程序良好运行以及提高你的效率是关重要的。请记住，AP\
  \ 考试是有严格时间限制的。\n\nAP 考试通过提供需求的 `lengthy`（详细）描述以及项目中与其他交互类的描述来测试对类的规划。\n\n## 组合\n\
  \n现在我们已经编写了运行程序的类，我们必须让这些类正确交互，以创建一个可以运行的程序。我们有了驱动程序，有了汽车，现在我们需要把驱动员放入车内，在考试当天急切前往\
  \ AP 计算机科学 A 考试。\n\n驱动类和对象类必须位于计算机的同一个文件夹中。如果你使用的是交互式开发环境（而不是命令行编程），你通常需要在软件中创建一个“项目（Project）”或类似的结构，将程序的所有文件放在一个地方。记住，驱动类依赖于对象类才能编译，而对象类依赖于驱动类才能实际执行操作。\n\
  \n考虑一个接收“花朵”对象并将它们“种”到花园中的程序。花朵对象可能会在一个名为 `Flower` 的类中定义。其中一个类将执行种植操作，我们可以将其命名为\
  \ `MakeGarden`。\n\n假设 `Flower` 构造方法具有以下头：\n\n```java\npublic Flower(int xPosition,\
  \ int yPosition)\n```\n\n其中 `xPosition` 和 `yPosition` 分别是花朵对象将被种种中的水平和垂直坐标。我们的驱动程序必须首先“创建”花朵，然后相应地种植它们。\n\
  \n为了创建一个对象，我们必须使用其类来实例化该对象。\n\n每当我们实例化一个花朵对象时，必须给它分配一个 `object reference variable`（对象引用变量）；正如这个华丽的名字所示，这只是一个变量名。`MakeGarden`\
  \ 中的某些行可能像这样：\n\n```java\nFlower f1 = new Flower(2, 1);\nFlower f2 = new Flower(2,\
  \ 2);\nFlower f3 = new Flower(2, 3);\n```\n\n这些行将实例化三个不同的花朵对象，每个对象都包含自己的实例数据。`f1`、`f2`\
  \ 和 `f3` 用于区分这些对象。然后我们可以使用这些对象来执行方法。考虑 `Flower` 类中的 `plant` 方法；该方法会“种植”花朵，并可能如下：\n\
  \n```java\npublic void plant()\n```\n\n在 `MakeGarden` 中，它可能如下：\n\n```java\npublic\
  \ boolean plant()\n```\n\n```java\nif (f1.plant()) {\n    System.out.print(\"Planted\
  \ successfully\");\n} else {\n    System.out.print(\"There was a problem.\");\n\
  }\n```\n\n```java\nif (f2.plant()) {\n    System.out.println(\"Planted successfully\"\
  );\n}\n```\n\n```java\nif (p1.plant()) {\n    System.out.println(\"Planted successfully\"\
