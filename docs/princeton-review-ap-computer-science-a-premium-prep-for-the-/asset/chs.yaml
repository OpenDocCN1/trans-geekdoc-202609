  \ | 25–35% |\n| 单元 3：类创建 | 10–18% |\n| 单元 4：数据集合 | 30–40% |\n\n除了多选择题外，还有四道强制开放式答题。你共有\
  \ 90 分钟来回答所有四道题。你应该每个问题花费大约 22 分钟，但请注意你必须管理自己的时间。在某一个问题上花费额外的时间将减少回答其他问题的剩余时间。\n\
