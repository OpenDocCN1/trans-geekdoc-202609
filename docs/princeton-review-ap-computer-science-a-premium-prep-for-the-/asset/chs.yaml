  \n1. `halfRoot(-2)`\n2. `halfRoot((int)2.0)`\n3. `halfRoot(3.0)`\n4. 都不会导致运行时错误。\n\
  \n#### 解题技巧\n\n方法的定义要求一个整数参数。选项 (A) 直接使用了整数。尽管 (A) 使用了负数，但这并没有导致错误。在数学课上，这不会产生实数。但在\
  \ Java 中，这会产生 NaN。虽然这不是首选结果，但它不是严格意义上的错误。选项 (B) 将 double 转换为整数，因此可以正确编译和运行。选项 (C)\
  \ 在需要整数时给了一个 double 参数。这会导致错误。虽然这个错误看起来会导致 `IllegalArgumentException`，但它实际上会引起编译时错误，而不是运行时错误。`IllegalArgumentException`\
  \ 只有在程序员故意抛出它时（如果参数在 Java 术语中是合但不符合程序目的）才会产生。（例如，一个用于计算整数阶的程序可能被设计为接收负参数时抛出 `IllegalArgumentException`。）由于这些结果中都没有导致运行时错误，答案是\
  \ (D)。\n\n***\n\n![](img/024_c003_art_2.jpg)\n\n## 参考文献\n\n所有从驱动类（driver classes）传递到对象类以及反之的数据都创建了一个复杂的过程。所有从驱动类传递到对象类以及反之的数据都创建了一个复杂的过程。所有从驱动类传递到对象类以及反之的数据都创建了一个复杂的过程。所有从驱动类传递到对象类以及反之的数据都创建了一个复杂的过程。所有从驱动类传递到对象类以及反之的数据都创建了一个复杂的过程。所有从驱动类传递到对象类以及反之的数据都创建了一个复杂的过程。所有从驱动类传递到对象类以及反之的数据都创建了一个复杂的过程。所有从驱动类传递到对象类以及反之的数据都创建了一个复杂的过程。所有从驱动类传递到对象类以及反之的数据都创建了一个复杂的过程。所有从驱动类传递到对象类以及反之的数据都创建了一个复杂的过程。所有从驱动类传递到对象类以及反之的数据都创建了一个复杂的过程。所有从驱动类传递到对象类以及反之的数据都创建了一个复杂的过程。所有从驱动类传递到对象类以及反之的数据都创建了一个复杂的过程。所有从驱动类传递到对象类以及反之的数据都创建了一个复杂的过程。所有从驱动类传递到对象类以及反之的数据都创建了一个复杂的过程。所有从驱动类传递到对象类以及反之的数据都创建了一个复杂的过程。所有从驱动类传递到对象类以及反之的数据都创建了一个复杂的过程。所有从驱动类传递到对象类以及反之的数据都创建了一个复杂的过程。所有从驱动类传递到对象类以及反之的数据都创建了一个复杂的过程。所有从驱动类传递到对象类以及反之的数据都创建了一个复杂的过程。所有从驱动类传递到对象类以及反之的数据都创建了一个复杂的过程。所有从驱动类传递到对象类以及反之的数据都创建了一个复杂的过程。所有从驱动类传递到对象类以及反之的数据都创建了一个复杂的过程。所有从驱动类传递到对象类以及反之的数据都创建了一个复杂的过程。所有从驱动类传递到对象类以及反之的数据都创建了一个复杂的过程。所有从驱动类传递到对象类以及反之的数据都创建了一个复杂的过程。所有从驱动类传递到对象类以及反之的数据都创建了一个复杂的过程。所有从驱动类传递到对象类以及反之的数据都创建了一个复杂的过程。所有从驱动类传递到对象类以及反之的数据都创建了一个复杂的过程。所有从驱动类传递到对象类以及反之的数据都创建了一个复杂的过程。所有从驱动类传递到对象类以及反之的数据都创建了一个复杂的过程。所有从驱动类传递到对象类以及反之的数据都创建了一个复杂的过程。所有从驱动类传递到对象类以及反之的数据都创建了一个复杂的过程。所有从驱动类传递到对象类以及反之的数据都创建了一个复杂的过程。所有从驱动类传递到对象类以及反之的数据都创建了一个复杂的过程。所有从驱动类传递到对象类以及反之的数据都创建了一个复杂的过程。所有从驱动类传递到对象类以及反之的数据都创建了一个复杂的过程。所有从驱动类传递到对象类以及反之的数据都创建了一个复杂的过程。所有从驱动类传递到对象类以及反之的数据都创建了一个复杂的过程。\n\
