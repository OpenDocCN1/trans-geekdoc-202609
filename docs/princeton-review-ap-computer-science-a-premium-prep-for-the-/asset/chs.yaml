  \ 审标记\n\n`Number` 类中的 `changeVal` 方法应该将 `value` 重新赋值为参数接收的值，并返回原始值。以下哪些代码段应该替换 `/*\
  \ missing code * /` 以使得 `changeVal` 按预期工作？\n\n1. ``value = newVal; return value;`\n\
  2. `int oldVal = value; value = newVal;`\n3. `int oldVal = value; value = newVal;\
  \ return value;`\n4. `int oldVal = value; value = newVal; return oldVal;`\n\n####\
  \ 解题技巧\n\n要完成任务，必须发生两个事件：`value` 必须重置为参数值，并且必须返回旧值。选项 (B) 没有尝试返回任何值，因此它不可能是正确的。剩余的选项尝试完成这两个事件；然而，如果重置了\
  \ `value` 并返回了它的新值，那么第二个事件的执行是不正确的。原始值必须被存储，因此排除 (A)。选项 (C) 存储了旧值但返回了新值，因为它已经被重新赋值为\
  \ `newVal`，所以它是错误的。由于 (D) 存储了旧值、重新赋值了 `value` 并返回了旧值，因此 (D) 是答案。\n\n* * *\n\n![](img/024_c003_art_2.jpg)\n\
