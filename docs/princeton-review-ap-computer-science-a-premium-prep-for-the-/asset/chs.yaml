  \ 9 10 11 12\n\n前往第 12 章：章节复习题答案与解析\n\n## 第 10 章总结\n\n- 二维数组是数组的数组。\n- 二维数组的第一个索引代表行，第二个索引代表列。\n\
  - 行数由 `array.length` 表示。\n- 某行的列数由 `array[row].length` 表示。\n\n# 第 11 章\n\n## 递归\n\
  \n## 递归\n\nAP 考试中出现的最后控制流结构被称为`递归`。它不会出现在简答题中，但在多选择题中至少出现一次（但通常只出现几次）。这种结构的运行与循环相似，但处理任务的方式不同。\n\
  \n还记得你小时候玩过的那些发条小玩具吗？你记得那些塑料齿轮或兔子（或其他什么）侧面带有小白色旋钮的吗？你会反复转动旋钮，当你松手时，小齿轮就会移动。你转动旋钮越多次，齿轮走得越远。由于旋转动作是重复的，这可以被视为循环。然而，`展开`（unwinding）动作将这种情况与\
  \ `while` 循环区分开来。当“向上”旋转作为“向下”（winding down）的结果时，递归潜伏在阴影中。递归方法的一个显著特征是调用其本身；为了防止无限循环，递归方法包含一个`基准情况`（base\
  \ case），它信号停止递归并返回到上一次调用。让我们用一个简单的例子来说说明。\n\n假设你有一大袋五颜色的巧克力。作为一个程序员，你不想杂乱地吃这些巧克力，而是想使用某种算法。你决定每次吃一颗，直到遇到你喜欢的颜色；或者按顺序吃这些巧克力。用伪代码表示：\n\
  \n```\neatCandy(color of current candy) {\n    if (current candy is green)\n   \
  \     return done;\n    else\n        eat more candy;\n}\n```\n\n尽管没有 `for` 或 `while`\
  \ 循环，但递归调用将表现出循环特性；与我们之前的循环不同，这里是向后的进展。让我们增加这个任务：一旦完成就告诉用户“你完成了”。添加以下行可以完成这项任务吗？\n\
  \n当到达基准情况时，当前方法的执行完成，然后过程一直回到初始调用。每次递归迭代完成后，都会显示“你完成了”。这有效，但可能不是计划的。\n\n```java\n\
  // 前提：x >= 0\npublic int mystery (int x) {\n    if (x == 0) {\n        return 0;\n\
  \    }\n    else {\n        return ((x % 10) + mystery(x / 10));\n    }\n}\n```\n\
  \n调用 `mystery(3543)` 的结果是以下几个？\n\n1. 15\n2. 2\n3. 10\n4. 无限递归\n\n### 解题方法\n\n在列出的方法中，基准情况发生在\
  \ `x` 等于 `0` 时。因为传递给方法的值是 `3543`，所以基准情况尚未适用。看看 `return ((x % 10) + mystery(x / 10))`\
  \ 这一行发生了什么。\n\n`return` 语句中的表达式有两个部分：`x % 10` 和 `mystery(x / 10)`。确保你理解 `x % 10`\
  \ 和 `x / 10` 的作用。如果 `x` 是一个整数，`x % 10` 将返回个位数。例如 `348 % 10` 返回 `8`。如果 `x` 是一个 `int`\
  \ 变量，那么 `x / 10` 将移除个位数。例如 `348 / 10` 返回 `34`。\n\n观察 `x % 10`。它返回 `x` 除以 10 的余数。在这种情况下，`x`\
  \ 是 `3543`，所以 `3543 % 10` 是 `3`。那么 `x / 10` 呢？`3543 / 10` 是 `354`；整数除法会截断结果。所以你现在有了\
  \ `mystery(3543)` —— `3 + mystery(354)`。\n\n遵循上述逻辑，`mystery(354)` 将是 `(354 % 10)\
  \ + mystery(354 / 10)`，或者 `mystery(354) = 4 + mystery(35)`。\n\n那么 `mystery(35)`\
  \ 是什么？`mystery(35) = (35 % 10) + mystery(35 / 10)`，或者简化为 `mystery(35) = 5 + mystery(3)`。\n\
  \n那么 `mystery(3)` 呢？`mystery(3) = (3 % 10) + mystery(3 / 10)`，或者简化为 `mystery(3)\
  \ = 3 + mystery(0)`。\n\n但 `mystery(0)` 等于 `0`（这是基准情况），所以：\n\n`mystery(3) = 3 + 0\
  \ = 3`\n`mystery(35) = 5 + 3 = 8`\n`mystery(354) = 4 + 8 = 12`\n`mystery(3543) =\
  \ 3 + 12 = 15`\n\n正确答案是 (A)。\n\n## 递归遍历数组\n\n虽然通常使用 `for` 循环来遍历数组，但也可以使用递归。例如，假设你有一队橄榄球运动员，每个人戴着一个有编号的头盔。你想遍历这支队伍，找到头盔上写有“9”的人的位置：\n\
  \n该问题的递归解决方案非常容易实现。你需要遍历一个 `int` 值的数组，并找到特定值的位置，如果它在那的话。\n\n\n\n\n\n首先，我们需要用递归术语来描述这个问题。\n\
  \n*   如果我们已经查看了每一个项，则返回 –1。\n*   如果数组中的当前项是匹配项，则返回它的位置。\n*   否则，使用数组中的下一个项重新开始过程。\n\
  \n```java\npublic int findPosition(int[] nums, int key, int currentIndex) {\n  \
  \  //如果我们已经查看了\n    //整个数组\n    if (nums.length <= currentIndex)\n        return\
  \ -1;\n    //如果数组中的下一个项是匹配项，\n    //则返回它\n    if (nums[currentIndex] == key)\n \
  \       return currentIndex;\n    // 否则，跳过数组中的当前项，\n    // 并对下一个项重复搜索\n    return\
  \ findPosition(nums, key, currentIndex + 1);\n}\n```\n\n这个例子比其他的要稍微微妙一些，因为我们正在将信息从一个递归调用传递到下一个递归调用。具体来说，我们正在使用\
  \ `currentIndex` 字段将信息从一个递归调用传递到另一个。因此，第一次递归调用从位置 0 开始查找，下一次从位置 1 开始，以此此类推。\n\n\
  让我们回到我们的足球运动员例子。你想要遍历一组足球运动员，并返回头盔上写有“9”字样的球员的位置。你的代码将采用如下形式：\n\n```java\nint[]\
  \ players = //代表足球运动员\nint pos = findPosition(players, 9, 0);\n```\n\n![](img/064_c011_art_2.jpg)\n\
