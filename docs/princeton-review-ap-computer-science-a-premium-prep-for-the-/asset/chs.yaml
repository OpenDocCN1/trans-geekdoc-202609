  跳转到第 12 章的问题 5：章节复习练习答案与解析，第 11 章\n\n## 第 11 章总结\n\n*   递归是方法调用自身\n*   递归调用是一个实例\n\
  *   基本情况是停止递归的\n\n## 第 12 章练习答案与解析\n\n### 1\n\n**D**\n\n在第 3 行查看 `a + b`。因为两个操作数都是整数，结果将被截断为\
  \ `int`：`11 / 4` 是 `2.75`，然后被截断为 `2`。\n\n### 2\n\n**D**\n\n这个问题的关键在于 `int` 转换的优先级高于加运算符。首先看\
  \ I：`a + b`。因为 `b` 是 `double`，结果是 `double` `20.7`。然后被转换为 `int` (`20`)。这是一个合法的赋值。实际上，逻辑是表达式是从左到右求值的。在\
  \ II 中，`(a + b)` 被括号括起来，所以先进行加法。`a` 和 `b` 相加得到 `double` `20.7`。这个 double 然后被转换为\
  \ `int` (`20`) 并赋值给 `d`。这是有效的。现在看 III：`int(b) + a`。在这里，double `b` 首先转换为 `int` (`10`)。这个\
  \ `int` 与 `a` 相加。两个 int 相加时的结果也是 `int`。\n\n### 3\n\n**C**\n\n在第 5 行查看 `a / b`。因为两个操作数都是整数，结果将被截断为\
  \ `int`：`11 / 4` 是 `2.75`，然后被截断为 `2`。\n\n在第 7 行，再次查看 `a / b`。但这一次持有这些值的变量是 `double`。因此，`11`\
  \ 除以 `4` 的结果也是 `double`：`2.75`。\n\n在第 9 行，再次查看 `a / b`。持有 `11` 的变量是 `int`，而持有 `4`\
  \ 的变量是 `double`。对于算术运算符，如果一个操作数是 `double` 而另一个是整数，则整数会自动转换为 `double`，操作的结果也是 `double`。因此，你再次得到了\
  \ `2.75`。正确答案是 (C)。\n\n### 4\n\n**D**\n\n在这个问题中，你需要找到不正确的选项。如果这个问题的答案对你来说显而易见，最好的方法是尝试每个答案，看看它是否可能是\
  \ `i` 的值。如果是，就将其排除。\n\n\n\n\n从 (A) 开始。`i` 可能等于 0 吗？因为 `x % 50` 得到 `x` 除以 50 的余数，为了让\
  \ `i` 等于 0，`x` 必须能被 50 整除。有很多整数符合条件（50, 100, 150…）。事实上，任何 50 的倍数都可以。\n\n那么 (B) 呢？我们能选出一个正整数作为\
  \ `x`，使其除以 50 后的余数为 10 吗？因为 50 能被 50 整除，所以 `50 + 10`（即 60）除以 50 的余数将是 10。其他符合条件的数字还包括\
  \ 110 和 160。事实上，如果你在任何 50 的正倍数上加上 10，你都会得到一个除以 50 余数为 10 的数。\n\n按照同样的逻辑，请找到一个除以\
  \ 50 余数为 25 的数。例如，75 是可以的。因此，排除 (C)。\n\n剩下的只有 (D)。为什么如果将一个数除以 50，余数可能是 50 呢？考虑如果将\
  \ 98 除以 50，余数是 48。如果将 99 除以 50，余数是 49。如果将 99 增加到 100，除以 50 的余数将是 0。\n\n这个句子的结果是，模运算的结果总是小于操作数。答案是\
  \ (D)。\n\n## 第 4 章：类\n\n1. **D**\n(A) 和 (B) 都是 `s1` 的有效索引。(C) 会尝试访问越界索引，因为 `s1`\
  \ 的最后一个索引是 4。(D) 是正确的，如果 4 除以 50，会得到一个空字符串。\n\n2. **C**\n字符串的索引从 0 开始，因此 `s1.substring(1,\
  \ 5)` 会包含索引 1 的字符，但不包含索引 5。在这种情况下，索引是 1。\n\n3. **B**\n`s1.length()` 返回 5，所以 `s1.substring(3,\
  \ s1.length() - 2)` 会从索引 3 开始到结束。\n\n4. **D**\n使用 `compareTo` 方法的值关于字典顺序：\n- (A)\
  \ \"january\" 在 \"July\" 之前（错误）\n- (B) \"July\" 在 \"June\" 之后（错误）\n- (C) \"january\"\
  \ 在 \"June\" 之前（错误）\n- (D) \"january\" 在 \"June\" 之后（正确）\n\n5. **B**\n第 2 行在索引 1\
  \ 处找到 \"oo\"，并赋值给变量 `p`。第 3 行是一个有效的 `substring` 命令，但它没有存储子串。第 4 行只是重复了第 2 行的操作，再次在索引\
  \ 1 处找到 \"oo\"。\n\n\n\n\n### 3. C\n\n此题测试了你追踪一段复杂代码的能力。有几点需要注意：\n\n`if` 循环的体仅在 `b`\
  \ 为假时才会执行。\n\n在 `for` 循环中，变量 `i` 的递增值是 `5` 而不是 `1`。\n\n在 `if` 循环体中，变量 `i` 也加了 `5`。这种做法在你编写自己的代码时通常不会这样做，但在考试中可能会遇到。不要假设\
  \ `for` 循环条件中的变量只在 `for` 循环中被修改。\n\n返回第 6 章：迭代，第 6 章复习练习第 3 题\n\n### 4. B\n\n请记住，`&&`\
  \ 在两个操作数都为真时返回 `true`，`||` 在其中一个或多个操作数为真时返回 `true`，而 `!` 会反转布尔值。\n\n解决涉及布尔问题的最佳方法通常是直接给变量赋值\
  \ `true` 或 `false` 并评估表达式。\n\n将 `(a && b) || !(a || b)` 拆分为两个部分：`(a && b)` 和 `!(a\
  \ || b)`。如果这两个部分中任何一个为真，变量 `c` 将赋值为 `true`。当 `a` 和 `b` 都为真时，`(a && b)` 为真。因此，排除\
  \ `(A)`。\n\n看看当 `a` 和 `b` 都为假时会发生什么。显然，在这种情况下 `(a && b)` 结果为 `false`，但 `!(a || b)`\
  \ 呢？如果 `a` 和 `b` 都为假，`(a || b)` 为假，但 `!` 运算符会将值反转为 `true`。因此，因为 `!(a || b)` 为真，`(a\
  \ && b) || !(a || b)` 的结果为 `true`。因此，当 `a` 和 `b` 都为假时，`c` 将赋值为 `true`，所以排除 `(C)`。\n\
  \n现在剩下 `(B)` 和 `(D)`。看看当 `a` 为假且 `b` 为真时会发生什么。`(a && b)` 结果为 `false`。`(a || b)`\
  \ 为真，所以 `!(a || b)` 为 `false`。因此，`(a && b) || !(a || b)` 为 `false`，你可以排除 `(D)`。正确答案是\
  \ `(B)`。\n\n返回第 6 章：迭代，第 6 章复习练习第 4 题\n\n### 5. D\n\n当 `while` 循环中的条件为假时，代码将结束执行。换句话说，就是当\
  \ `!(x > y || y >= z)` 为真时。因此，找出选项中哪一个等价于 `!(x > y || y >= z)`。\n\n以下是逐步解决的步骤：\n\
  \n记住 `!(a || b)` 等价于 `!a && !b`。所以 `!(x > y || y >= z)` 变为 `!(x > y) && !(y >= z)`。\n\
  \n`!(x > y)` 等价于 `x <= y`，所以你现在有了 `x <= y && !(y >= z)`。\n\n`!(y >= z)` 等价于 `y <\
  \ z`，所以你有 `x <= y && y < z`。正确答案是 `(D)`。\n\n返回第 6 章：迭代，第 6 章复习练习第 5 题\n\n### 6.\
  \ D\n\n每当评估递增语句 `a++` 时，`a` 的值就会增加 1。因此，要回答此题，你需要算出 `a` 增加了多少次。\n\n外层循环将执行 `10`\
  \ 次。外层循环每执行一次，内层循环就会执行六次。因此，内层循环体代码将执行 `6 × 10` 次。注意当 `k` 等于 `5` 时，`k <= 5` 为真。在第三层循环中，`z`\
  \ 的值从 `1` 开始，并在每次通过后翻倍。因此，当 `i` 等于 `1`, `2`, `4`, `8`, 和 `16` 时，最内层循环将执行——即中间循环每执行一次执行五次。因为\
  \ `60 × 5 = 300`，`a` 将增加 `300` 次。正确答案是 `(D)`。\n\n返回第 6 章：迭代，第 6 章复习练习第 6 题\n\n###\
  \ 7. C\n\n此题的技巧在于，算术运算符不会修改其操作数。所以，当我们用 `x` 除以 `3` 时，如果 `x` 是 `10`，结果是 `3` 但 `x`\
  \ 保持不变。同样，对一个数字取模也不会改变它。另一方面，后置增运算符 `++` 会改变它所操作的值，所以 `x++` 将 `x` 的值增加 `1`。正确答案是\
  \ `(C)`。\n\n返回第 6 章：迭代，第 6 章复习练习第 7 题\n\n### 8. D\n\n在第四行，`a + b` 将是 `13.7`，但此结果被强制转换为\
