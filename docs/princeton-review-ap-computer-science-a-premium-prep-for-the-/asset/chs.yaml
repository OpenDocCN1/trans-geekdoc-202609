  2. Vanessa Tiffany Kiara Jada Brianna Abi\n3. Vanessa Tiffany Jada Kiara Brianna\
  \ Abi\n4. Vanessa Brianna Jada Kiara Tiffany Abi\n\n## 第 8 章总结\n\n- 数组是相同数据类型的变量或相同类对象的固定长度的组合。\n\
  - 数组索引从 0 开始，到长度 – 1 结束。\n- 增强型 for 循环会自动为数组的每个元素执行循环。\n- 顺序查找从索引 0 开始查找数组中的元素，直到找到所需的元素并返回索引。如果未找到元素，则返回\
  \ -1。\n- 二分查找从数组的中间开始搜索，并向较高或较低索引移动以寻找所需的元素。二分查找通常效率，但只能用于有序列表。\n- 选择排序通过将最小元素交换到第一个索引，然后重复寻找第二个最小元素并交换到第二个索引，以此类推对数组排序。\n\
  - 插入排序通过找到元素合适的位置、移动其他元素腾出空间，然后将元素放在合适的位置。\n- 归并排序通过递归将数组分成更小的部分。较小的部分经过排序后与其他部分合并。\n\
  \n\n\n\n\n# 列表与 ArrayList\n\nJava 中强大的数组结构有两个主要的局限性：数组的长度是固定的，且它只能存储一种类型的数据。如果你想表示（例如）一个朋友收集的动作模型，数组将要求所有动作模型必须是同一种类型。通常情况下，它们*全部*必须是飞行超级英雄，或者它们*全部*必须穿有护体装甲等。\n\
  \n同样，以数组形式表示的动作模型集合只能存储固定数量的动作模型，不多也不少。如果有额外的、未使用的槽位，它们将一直留在那里。如果你有一个组戴着头盔的英雄的数组，并尝试移除数组中每个索引处每个元素的头盔，这可能会产生问题。当你遇到第一个空位时，那里没有英雄，因此没有头盔，所以指令变得毫无意义；在\
  \ Java 中，编译器将针对这种情况情况返回一个 `NullPointerException`。\n\n我们在 Java 中学习的每种结构都有其优缺点。\n\n\
  `ArrayList` 解决了这两个问题。`ArrayList` 对象是`动态调整大小`的，随着元素的添加和删除而扩展或压缩。`ArrayList` 还可以无限制地存储多种类型的数据。\n\
  \n让我们用一个例子来理解数组与 `ArrayList` 的优缺点。考虑你带去学校的午餐盒。如果你想用数组或 `ArrayList` 结构来表示你的午餐盒，哪种更准确？\n\
  \n自然，这个问题的答案取决于 (1) 包中对象的具体细节——在这种情况下，即午餐物品的类型——以及 (2) 程序员对哪种更合适的选择。如果你的午餐包含一个三明治对象、一个水果对象和一个饮料对象，`ArrayList`\
  \ 结构可能是更好的选择。此外，随着午餐组件的移除，午餐盒理论上会缩小（或可以缩小）。`ArrayList` 似乎更合适。\n\n让我们考虑同样的午餐例子，但这次假设物品存储在一个带有隔板的塑料容器中。无论你是还没有吃午餐、已经吃完午餐，还是正处于两者之间的任何时候，隔板的数量和设置都不会改变。我们将讨论一种“欺骗”数组让其认为午餐对象都是同种类型的变方法。这些事实和能力使得数组结构比\
  \ `ArrayList` 更合适。\n\n为了进一步证明 `ArrayList` 结构的有用性，请注意还可以创建一个`类型化 ArrayList` (typed\
  \ ArrayList)，它允许列表仅存储相同类型的对象。这种结构结合了数组和 `ArrayList` 的有用方面。\n\n为了实例化一个名为 `lunchBag`\
  \ 的用于存储我们午餐各种组件的 `ArrayList`，我们使用以下代码：\n\n```\nArrayList lunchBag = new ArrayList();\n\
  ```\n\n注意，与我们用于实例化数组的语法不同，对象的类型或列表的长度最初都没有被定义。\n\n为了访问列表内部的数据，必须调用特定的方法；与 Java 中的数组结构不同，列表没有方便的括号表示法。要返回\
  \ `ArrayList` 中的第二个对象（一个 `Apple` 对象）并使用变量 `food` 存储它，该行代码为：\n\n```\nApple red =\
  \ lunchBag.get(1);\n```\n\n`List` 类中还有其他几个实用方法，它们在 AP 考试快速参考中都提到了，尽管（显然）没有给出它们的功能。这些方法包括\
  \ `add`、`set`、`remove` 和 `size`。\n\n括号表示法只能用于数组对象；列表必须使用适当的方法。\n\n如果程序员认为保持 `ArrayList`\
  \ 的动态调整能力的同时固定它能持有的数据类型（如数组一样）更合适，则按如下方式实例化：\n\n```\nArrayList<Apple> lunchBag =\
  \ new ArrayList<Apple>();\n```\n\n使用 `ArrayList` 的缺点之一是 `ArrayList` 中只能存储对象。原始数据类型\
  \ `int` 和 `double` 不能存储在 `ArrayList` 中。如果程序员想存储整数和双精度数据类型，他们必须使用 `Integer` 或 `Double`\
  \ 包装类。可以使用整数和双精度作为参数创建 `Integer` 和 `Double` 对象。例如：\n\n```\nInteger n = new Integer(5);\n\
  Double x = new Double(6.1);\n```\n\n调用这些值时，使用 `intValue()` 和 `doubleValue()` 方法。以下命令\n\
  \n```\nint a = n.intValue();\ndouble y = x.doubleValue();\n```\n\n将 `a = 5` 和 `y\
  \ = 6.1`。\n\n此外，AP 计算机 Java 子集包含了 `Integer` 类的静态变量 `MIN_VALUE` 和 `MAX_VALUE`。它们存储了整数数据类型可能的最小值和最大值。\n\
  \n| 数组 | ArrayList |\n| --- | --- |\n| 数组创建后无法调整大小。 | ArrayList 会随着新元素的添加而自动调整大小。\
  \ |\n| 使用数组不需要 import 语句，除非数组需要。 | 必须导入 `java.util.ArrayList` 才能使用。 |\n| 使用索引符号访问元素。\
  \ | 使用 `ArrayList` 类的方法访问元素。 |\n| 数组可以构造为持有原始类型或引用。 | `ArrayList` 实例只能持有引用，而不是原始类型。\
  \ |\n| 每个数组只能声明为一种类型。例如，如果数组声明为持有字符串，则你无法存储整数。 | `ArrayList` 可以持有异构对象。例如，以下是合法的（尽管不推荐）：`ArrayList\
  \ list = new ArrayList(); list.add(\"A\"); list.add(4)); |\n\n# 数据集引论\n\n一个数据集 (data\
  \ set) 是与特定主题相关的组织集合。\n\n数据集的一些例子是：\n\n* 州的人口数据\n* 学生的成绩\n* 运动员的统计\n* 公司数据\n\n下表显示了\
  \ 2010 年和 2020 年美国人口最多的州的人口数据：\n\n| 美国人口最多的州 | 2010 年人口 | 2020 年人口 |\n| --- | ---\
  \ | --- |\n| 加利福尼亚州 | 37,253,956 | 39,368,078 |\n| 德克萨斯州 | 25,145,561 | 29,360,759\
  \ |\n| 纽约州 | 19,378,102 | 19,336,776 |\n| 佛罗里达州 | 18,801,310 | 21,733,312 |\n| 伊利诺伊州\
  \ | 12,830,632 | 12,587,530 |\n| 宾夕法尼亚州 | 12,702,379 | 12,783,254 |\n| 俄亥州 | 11,536,504\
  \ | 11,693,217 |\n| 密歇根州 | 9,883,640 | 9,966,555 |\n| 乔治亚州 | 9,687,653 | 10,710,017\
  \ |\n| 北卡罗来纳州 | 9,535,483 | 10,600,823 |\n\n程序如何表示此数据集中的信息？程序如何提取信息并生成新信息（例如人口变化和百分比变化）？\n\
  \n每个州可以通过以下类表示：\n\n```\npublic class State\n{\n    private String stateName;\n \
  \   private int pop2010, pop2020, popChange;\n    private double percentChange;\n\
  \n    public State(String name, int p2010, int p2020)\n    {\n        stateName\
  \ = name;\n        pop2010 = p2010;\n        pop2020 = p2020;\n        calculatePopChange();\n\
  \        calculate-PercentChange();\n    }\n\n    private void calculatePopChange()\n\
  \    {\n        //计算并保存 2010 年到 2020 年的人口变化\n        popChange = pop2020 - pop2010;\n\
  \    }\n\n    private void calculate-PercentChange()\n    {\n        //计算并保存 2010\
  \ 年到 2020 年的人口百分比变化\n        //缺失代码\n        //将在复习练习中完成\n    }\n}\n```\n\n\n\n\n\
  `calculatePopChange()` 方法计算并保存了 `State` 从 2010 年到 2020 年的人口变化。`calculatePercentChange()`\
  \ 方法的完成（它将计算并保存 2010 年到 2020 年的百分比变化）被留作复习习题中的一个问题。\n\n整个数据集（所有十个州）可以存储在一个一维数组中：\n\
  \n```\nState[] top10=new State[10];\n```\n\n可以使用从输入文件中读取的数据来填充数组。使用输入文件将在后续的话题中介绍。\n\
  \n程序可以分析整个数据集以回答诸类问题，例如哪个州的人口百分比变化最大，哪些州的人口减少了。数据集还可以以多种方式排序，例如按字母顺序排序或按百分比降序排序。\n\
  \n数据集的另一个示例是班级学生考试成绩的集合。每个学生的信息可以用以下类表示：\n\n```java\npublic class Student\n{\n \
  \   private String last, first, letterGrade;\n    private double average;\n    private\
  \ int[] grades;\n\n    public Student(String last, String first, int[] grades)\n\
  \    {\n        this.last = last;\n        this.first = first;\n        this.grades\
  \ = grades;\n        calculateAverage();\n        letterGrade = determineLetterGrade();\n\
  \    }\n\n    private void calculateAverage()\n    {\n        int len = grades.length;\n\
  \        int total = 0;\n        for (int g : grades)\n            total += g;\n\
  \        average = (double)total / len;\n    }\n\n    private String determineLetterGrade()\n\
  \    {\n        if (average >= 90)\n            return \"A\";\n        if (average\
  \ >= 80)\n            return \"B\";\n        if (average >= 70)\n            return\
  \ \"C\";\n        if (average >= 60)\n            return \"D\";\n        return\
  \ \"F\";\n    }\n\n    //accessors\n    public double getAverage()\n    {\n    \
  \    return average;\n    }\n\n    public String getLetterGrade()\n    {\n     \
  \   return letterGrade;\n    }\n}\n```\n\n构造函数接受三个参数：学生的姓、名以及他们的考试成绩数组。\n\n`calculateAverage()`\
  \ 方法计算 `Student` 考试成绩的平均分。`determineLetterGrade()` 方法根据学生的平均分为学生决定字母等级。\n\n以下类表示特定班级中所有学生的数据集：\n\
  \n```java\npublic class TheClass\n{\n    private Student[] allStudents;\n    private\
  \ double classAverage;\n    private Student studentWithHighestAverage;\n\n    public\
  \ TheClass(Student[] allStudents)\n    {\n        this.allStudents = allStudents;\n\
  \        calculateClassAverage();\n        studentWithHighestAverage();\n    }\n\
  \n    private void calculateClassAverage()\n    {\n        //计算并保存整个学生数据集的平均分\n\
  \        double total = 0.0;\n        for (Student s:allStudents)\n            total\
  \ += s.getAverage();\n        classAverage = total / allStudents.length;\n    }\n\
  \n    private void studentWithHighestAverage()\n    {\n        //找到并保存平均分最高的学生\n\
  \        Student highest = allStudents[0];\n        for (int i = 1; i < allStudents.length;\
  \ i++)\n            if (allStudents[i].getAverage() > highest.getAverage())\n  \
  \              highest = allStudents[i];\n        studentWithHighestAverage = highest;\n\
  \    }\n\n    public double getClassAverage()\n    {\n        return classAverage;\n\
  \    }\n\n    public Student getStudentHighestAverage()\n    {\n        return studentWithHighestAverage;\n\
  \    }\n}\n```\n\n构造函数接受一个参数，一个 `Student` 对象的数组。`calculateClassAverage()` 方法计算并保存数据集中所有学生的平均分。`studentWithHighestAverage()`\
  \ 方法找到并保存平均分最高的学生。数据集还可以以多种方式排序，例如按姓名的字母顺序排序；按平均分降序排序；按字母等级升序排序。\n\n## 使用文件\n\n\
  需要外部数据来执行功能的程序使用输入文件。例如，一个计算程序可能会读取一个文本文件，其中包含每个学生的姓名和考试成绩。程序可以将信息存储在适当的结构中，例如数组或\
  \ `ArrayList`，然后根据需要检索并处理数据（例如，计算整个班级的平均分）。文件中的数据被称为**持久化**（**persist**），这意味着这意味着当程序未执行时它仍然存在。\n\
  \n### Java File 类\n\n`File` 类包含了程序可以使用来处理外部文件的方法。使用文件的程序必须包含以下导入语句：\n\n`import java.io.*;`\n\
  \n使用文件的第一步是按如下方式构造 `File` 对象：\n\n```\nFile fn = new File(pathname);\n```\n\n其中 `fn`\
  \ 是 `File` 对象的名字，`pathname` 是一个包含文件路径的 `String`。例如，一个包含美国人口最多十个州的数据的文件可能位于 `C:/Java\
  \ Programs`，名为 `top10.txt`。接接的一行代码构造了一个名为 `infile` 的 `File` 对象：\n\n```\nFile infile\
  \ = new File(\"C:/Java Programs/top10.txt\");\n```\n\n记住，当程序使用 `File` 时，使用该文件的方法必须包含相应的异常处理是非常重要的。\n\
  \n\n\n\n```State[] top10Pop=new State[10];\n```\n\n以下代码将执行：\n\n* 使用 `Scanner.next()`\
  \ 方法读取州名称（String）\n* 使用 `Scanner.nextInt()` 方法读取 2020 年的人口（int）\n* 使用 `Scanner.nextInt()`\
  \ 方法读取 2020 年的人口（int）\n* 创建一个新的 `State` 对象作为 `top10Pop` 的元素\n\n针对 `top10.txt` 中的每一行：\n\
  \n```java\nint i = 0;\nwhile (scan.hasNext())\n{\n    String sName = scan.next();\n\
  \    int p2010 = scan.nextInt();\n    int p2020 = scan.nextInt();\n    top10Pop[i]\
  \ = new State(sName, p2010, p2020);\n    i++;\n}\n```\n\n`Scanner` 类还提供了一个方法，可以一次一次地读取文本文件的每一行。该方法也属于\
  \ AP Computer Science A 的子集中：\n\n| String nextLine() || 从文件或输入源读取文本的下一行并作为 String\
  \ 返回；如果紧接着另一个从文件或输入源读取的 Scanner 方法调用，则可能返回空字符串 |\n| --- | --- |\n\n可以使用 `String.split()`\
  \ 方法将行拆分成单独的数据片段，该方法也属于 AP Computer Science A Java 子集：\n\n| String[] split(String\
  \ del) || 返回一个 String 数组，其中每个元素都是此 String 的子字符串，该字符串根据给定表达式 `del` 的匹配项进行分割。 |\n\
  | --- | --- |\n\n以下是 `nextLine()` 和 `split(String del)` 的使用示例：\n\n`numbers.txt`\
  \ 文件包含由姓、名和电话号码组成的数据。以下是 `numbers.txt` 中的几行：\n\n* Brown,John,(358)441-2435\n* Green,Vanessa,(358)222-9658\n\
  * Gray,Matthew,(358)441-7654\n* Blue,Alison,(358)222-2468\n\n数据片段通过“，”分隔，逗号充当 `delimiter`（分隔符）。`delimiter`\
  \ 是一个或多个未出现在数据本身中的字符的字符串。当使用“，”时，数据被称为 `comma-separated values`（逗号分隔值），或 `CSV`。\n\
  \n以下是一个描述人的姓、名和电话号码的类：\n\n```java\npublic class PhoneNumber\n{\n    private String\
  \ last, first, number;\n    public PhoneNumber(String l, String f,String n)\n  \
  \  {\n        last = l;\n        first = f;\n        number = n;\n    }\n}\n```\n\
  \n以下代码使用 `Scanner.nextLine()` 和 `String.split(del)` 方法从 `numbers.txt` 获取数据并构造 `PhoneNumber`\
  \ 对象：\n\n```java\nFile f = new File(\"numbers.txt\");\nScanner scan = new Scanner(f);\n\
  String last, first, pNumber;\nString line;\nString[] temp = new String[3];\nwhile\
  \ (scan.hasNext())\n{\n    line = scan.nextLine();\n    // 姓、名和电话号码由分隔符 \",\" 分\n\
  \    // 将行分成三个数据片段\n    // 将每个片段保存到 String 数组 temp 中\n    temp = line.split(\",\"\
  );\n    last = temp[0]; // 姓\n    first = temp[1]; // 名\n    pNumber = temp[2];\
  \ // 电话\n    PhoneNumber pn = new PhoneNumber(last, first,pNumber);\n    // 未显示将\
  \ pn 保存到数据结构中的代码\n}\n```\n\n让我们来看 `numbers.txt` 中的某行：\n\n* Gray,Matthew,(358)441-7654\n\
  \n执行代码 `temp = line.split(\",\");` 后，`String` 数组 `temp` 为：\n`temp[0]` 包含姓\n`temp[1]`\
  \ 包含名\n`temp[2]` 包含电话\n\n还有一个 AP Computer Science A 子集的 `Scanner` 方法：\n\n| void\
  \ close() || 关闭扫描器 |\n| --- | --- |\n\n在 `PhoneNumber` 示例中，可以在 `while` 循环后调用 `scan.close();`。\n\
