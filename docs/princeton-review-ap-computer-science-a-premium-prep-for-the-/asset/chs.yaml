  \n## 如何开始\n\n1. 参加 `Practice Test 1`\n\n在决定如何使用这本书之前，你首先需要参加一次模拟测试。这样做可以让你洞察自己的优势和劣势，测试还将帮助你制定一个有效的学习计划。如果你感到恐考心理，请提醒自己，模拟测试是一种自我诊断工具——重要的不是你表现得不好，而是你如何利用从表现中获得的信息来指导你的备考。\n\
  \n因此，在继续阅读之前，请从本书的此页开始参加 `Practice Test 1`。务必在一次内完成它，并遵循测试前出现的说明。\n\n2. 检查你的答案\n\
  \n使用此页上的 `Diagnostic Answer Key`，按照我们的三步流程，识别你对所测主题的优劣势。这将帮助你决定在学习本书时优先复习哪些内容章节。现在不要担心解释，也不要担心错过的题目。我们很快就会遇到这些问题。\n\
  \n3. 反思测试\n\n在完成第一次测试后，请回答以下问题：\n\n* 你在多选择题上花费了多少时间？\n* 你在每道简答题上花费了多少时间？\n* 你答对了多少道多选择题，错了多少道？\n\
  * 你认为自己是否具备简答题主题所需的知识？\n\n4. 阅读本书的 `Part III` 并完成自我评估\n\n`Part III` 将提供关于考试结构和评分标准的信息。它还将列出所测试的内容区域。\n\
  \n在阅读 `Part III` 时，重新评估你对上述问题的答案。在 `Part III` 结束时，再次评估你对上述问题的答案。\n\n5. 根据需要参与 `Part\
  \ IV` 和 `Part V`\n\n比起被动阅读，主动使用这本书会收获更多。`Part IV` 和 `Part V` 旨在涵盖你所需的内容。\n\n6. 参加另一项测试并评估你的表现\n\
