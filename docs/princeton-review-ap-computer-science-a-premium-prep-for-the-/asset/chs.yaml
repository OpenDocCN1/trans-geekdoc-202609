  \n### 开放式答题\n\nAP 计算机科学 A 考试的第二部分是开放式答题。该部分包含以下知识点：\n\n* 问题 1：方法与控制结构 (7 分)\n* 问题\
  \ 2：类设计 (7 分)\n* 问题 3：数据集合 (5 分)\n* 问题 4：二维数组 (6 分)\n\n不幸的是，College Board 会列出一些关于\
  \ `ArrayList` 的规则，具体如下：\n\n#### 1 分扣罚\n\n* 产生副作用的冗余代码（例如 `written to output`）\n\
  * 使用但未声明的局部变量\n* 破坏持久性数据（例如 `changing value by parameter`）\n* void 方法或构造函数\n\n####\
  \ 无扣罚\n\n* 产生副作用的冗余代码\n* 存在歧义的拼写/大小写差异\n* 未声明的局部变量\n* 构造函数头部缺少 `private` 修饰符\n*\
  \ 类上缺少 `public` 修饰符\n* 作为标识符使用的关键字\n* 用于运算符数学符号 `×`, `•`, `÷`, `>`, `≠`\n* `[]`\
  \ 与 `()` 与 `<>`\n* `=` 代替 `==`\n* 集合元素访问混淆（右值 r-values）\n* 集合元素修改混淆（左值 l-values）\n\
  * `array`、`String` 和 `ArrayList` 的长度/大小混淆\n* 引用整个数组时的冗余 `[]`\n* `[i, j]` 代替 `[i][j]`\n\
  * 数组声明中的冗余大小，例如 `int[size] = new int[size];`\n* 意图清晰处缺少 `;`\n* 意图清晰处缺少 `{}`\n* 无参数方法或构造函数调用缺少\
  \ `()`\n* 从泛型集合获取对象\n\n## AP 计算机科学 A 考试是完全数字化的\n\nAP 计算机科学 A 考试的多选择部分和开放式答题部分都通过\
  \ College Board 测试应用程序进行管理和完成。要参加考试，你必须可以使用该测试应用程序，该程序适用于 Windows 和 Mac 笔记本电脑/桌面电脑、iPad、平板和\
  \ Chromebook。如果你的电脑或平板是由学校拥有或管理的，那么学校官员可能需要为你安装此程序。手机无法考试。\n\nBluebook 允许你对文本进行标记和高亮、排除答案并标记需要复习的题目。你还可以使用草稿纸来规划问题的回答。与\
  \ SAT 等数字考试不同，数字 AP 考试不是自适应的：这意味着题目的难度不会根据你在之前几个部分的表现而改变。\n\n## AP 考试的用途\n\n不同大学使用\
  \ AP 考试的方式不同，因此访问特定大学的网站以确定其如何接受 AP 考试分数是非常重要的。下面的项目代表了 AP 考试分数的主要用途：\n\n* **大学学分。**\
  \ 如果你在 AP 考试中获得高分，某些大学会给你大学学分。这些学分计入毕业要求，意味着你在大学期间可以少上一些课程。考虑到大学的费用，这确实是一个巨大的福利。\n\
  \n\n\n\n\n*   **满足要求。** 如果你在 `AP Exam` 中表现优异，某些大学允许你“免除”某些要求，即使它们没有给你实际的大学学分。例如，你可能不需要修入门级课程，或者你可能完全不需要修某个学科的课程。\n\
  \n*   **录取加分。** 即使你的 `AP Exam` 没有获得大学学分，甚至不能让你免除某些课程，大多数大学也会尊重你通过参加 `AP course`\
  \ 来挑战自我的决定。此外，如果你在 `AP course` 之外参加了 `AP Exam`，他们可能也会尊重这种动力。`AP Exam` 的高分显示了你对比高中课程教学内容更难内容的掌握，大学可能会在录取过程中考虑这一点。\n\
  \n有些人人认为 `AP courses` 是专为高三学生预留的，但事实并非如此。不要害怕在三年级甚至二年级时尝试进入 `AP course`。一个优秀的 `AP\
  \ Exam` 成绩在大学申请中看起来非常出色，并能让你从其他候选者中脱颖而出。\n\n## 其他资源\n\n有很多资源可以帮助你提高 `AP Computer\
  \ Science A Exam` 的分数，其中最重要的就是你的老师。如果你正在学习 `AP course`，你可能会获得老师的额外关注，例如对你的简答题给出反馈。如果你没在\
  \ `AP course` 中，你可以联系教授 `AP Computer Science A` 的老师，询问该老师是否会批改你的简答题或通过其他方式帮助你掌握内容。\n\
