    making their own "decisions." The tool can not only predict the existence of a
    future event, but it can also make recommendations on various actions and their
    outcomes. For example, self-driving cars collect driving-related data with each
    trip and use it to train themselves to make better driving and maneuvering decisions.


    # **Machine learning to make predictions -**


    Machine learning algorithms must be used to build models that can predict future
    trends based on transactional data obtained by the organization. This is known
    as "supervised machine learning," and it will be discussed further in this book.
    Fraud detection systems, for example, use machine learning algorithms on previous
    data on fraudulent purchases to determine whether a transaction is fraudulent.'
