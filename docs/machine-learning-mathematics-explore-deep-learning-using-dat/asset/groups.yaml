    in our daily lives. "smart machines" designed to augment human abilities and increase
    efficiency every aspect of human life. "Fourth Industrial Revolution" centres
    on artificial intelligence and machine learning technology, which may call our'
  - '[PAGE 18]


    understanding of what it means to be "human" into question. These considerations
    imply that models capable of analyzing larger, more complex data while producing
    highly accurate answers in a short period can be developed quickly and automatically
    on a much larger scale. Companies can quickly detect potential development opportunities
    or prevent unknown threats by developing appropriate machine learning models that
    fit their business requirements. Data has clogged the veins of every company.
    Data-driven strategies are increasingly determining who wins and who loses competition.
