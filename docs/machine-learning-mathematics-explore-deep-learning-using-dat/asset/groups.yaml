    # Data science approaches


    Data science is primarily used in decision-making to make precise decisions.


    To make predictions, "predictive causal analytics," "prescriptive analytics,"
    and machine learning are used.


    Predictive causal analytics - This method can be used to build a model that accurately
    predicts and forecasts the likelihood of a specific event occurring in the future.
    For example, financial institutions use predictive causal analytics-based tools
    to predict the'
