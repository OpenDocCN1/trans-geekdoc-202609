    M&Ms 的概率将低于第一次抽取。这是“条件概率”的经典例子。相反，抛硬币是一个独立事件，这意味着下一次抛硬币的概率不受上一次结果的影响。因此，抛硬币不符合“条件概率”的定义。


    ## 分类


    机器学习和统计学中的“分类算法”是一种根据训练数据集来识别新输入数据可以分类到哪些类别（子群体）的算法，训练数据集由已经确定类别的相似数据组成。


