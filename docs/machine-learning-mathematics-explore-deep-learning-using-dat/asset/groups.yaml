    + pXp$。在“参数模型”中，参数的数量通常是有限的，且与数据集的大小无关。这被称为“基于模型的学习”。例如，“k-高斯模型”是由度量技术驱动的。另一方面，“非参数技术”根据其与数据点的接近程度来估计“f”，同时对“f”的函数形式不做任何假设。“非参数模型”中的参数数量与数据集的大小成正比。这种方法的另一个术语是“基于记忆的学习”。例如，“核模型”是由非参数方法驱动的。


    ## 模型的可解释性与预测准确性


    在众多统计数据学习策略中，某些适应性较差且受限严重。当目标是“推理”时，使用简单且僵化的统计学习方法具有显著优势。另一方面，在提供预测和预测时，更倾向于使用灵活的模型。


    模型在预测新输入数据上事件发生的准确性可用于评估其性能。更准确的模型被认为更有价值。模型的可解释性提供了有关输入-输出关系的信息。经过解释的模型可以揭示独立特征是否可以预测因属性。问题的出现是因为，随着模型准确性的提高，模型复杂性会以牺牲解释性为代价而增加。


    更准确的模型可能为公司提供更多选择、收益、时间或资金。另一方面，为了提高预测的准确性，需要优化模型的准确性。准确性的优化通过引入更多模型参数（以及调整这些参数所需的资源）增加了模型的复杂性。参数较少的模型更简单、解释更快。线性回归模型中有一个系数和一个截距项。例如，可以检查每个短语以确定它如何对输出的生成做出贡献。使用逻辑回归模型时，你拥有更多的控制权。函数向输出潜在转换的底层关系应与系数一起进行研究。简单的决策树很容易理解，而密集的决策树则需要独特的视角来理解为什么预期事件会发生。此外，将多个模型优化整合到单一预测中可能具有显著性或及时性。模型的准确性被认为是解释性的次要考虑因素。


    示例包括将“垃圾邮件”与“非垃圾邮件”进行分离和分类的模型，以及估计房地产价值的模型。


    该领域没有一刀切的方法或全能型方法。单一技术很难在统计学的广泛数据集中占据主导地位。工业中最广泛使用的度量是：在“回归”环境中，可以使用“均方误差 (MSE)”来量化“预测响应值”距离目标观测值的真实答案值有多远。对于与真实响应非常接近预期答案，MSE
    计算值很小；但对于某些观测值差异显著的预期和真实响应，MSE 则很大。假设我们拥有特定患者的临床数据，例如他们的体重、血压、年龄、家族史以及是否患有糖尿病。这些与患者相关的数据集可以有多种用途，用于训练统计模型


    ![](img/aa49b896aea815087866776051cca72b_33_0.png)


    基于临床数据预测糖尿病风险


    在“分类”环境中最常用的度量是“混淆矩阵”。统计学习的核心特征是，随着持续学习，模型变得更加灵活，训练误差会减少，尽管测试误差可能不会降低。


    ## 偏差与方差


    在机器学习背景下，偏差被定义为“模型为了进一步简化目标任务的学习而做出的简化假设”。参数模型从一开始就具有很强的偏性，这使得学习更快、更容易，但显著降低了模型在更广泛应用中的灵活性。低偏差学习模型算法包括“决策树”、“k-近邻”和“支持向量机”。线性回归、线性判别分析和逻辑回归是“高偏性”机器学习算法的示例。在机器学习背景下，方差可以定义为“由于使用不同的训练数据集导致目标函数的估计值发生改变的程度”。具有高度灵活性的非参数模型具有高方差分。低偏差学习模型算法包括“线性回归”、线性判别分析和逻辑回归”。高方差机器学习算法包括“决策树”、“k-近邻”和


    ![](img/aa49b896aea815087866776051cca72b_35_0.png)


    支持向量机。”


    ## 偏差与方差的权衡


    在统计学习中，“偏差”和“方差”是反相关的。高偏差模型的方差分将显著降低，反之亦然。两者之间必须权衡，这驱动了模型选择和配置，以解决“回归”和“分类”环境中的目标问题，适当的灵活性对于任何统计技术的效率和性能都至关重要。模型“偏差”与“方差”之间的权衡以及产生的“U型”构成了巨大的挑战。


    ![](img/aa49b896aea815087866776051cca72b_36_0.png)


    # 第二2章：机器学习算法


    机器现在可以独立地学习和训练，依靠之前的计算和底层算法来做出高质量、易于重复的决策。机器学习已经持续了一段时间，但近期机器学习算法的进展允许机器以高效的方式处理和分析海量数据。这是通过使用高速高频自动化将先进复杂的数学计算应用于机器来实现的。现代计算机技术可以快速分析海量数据。机器学习算法为企业提供了更大的灵活性，以根据特定的业务需求定制其训练数据集并相应地训练其机器人。


