    # 数据科学方法


    数据科学主要用于决策制定，以做出精确的决策。


    为了进行预测，使用了“预测因果分析”、“规范性分析”和机器学习。


    - 预测因果分析 - 该方法可用于构建模型，准确地预测和预测特定事件在未来发生的概率。例如，金融机构使用基于预测因果分析的工具，通过建立分析客户在所有贷款机构还款历史的模型，来预测消费者在信用卡还款违约的可能性。


    - 规范性分析 - 经常用于“智能工具和应用程序”的开发，这些工具能够从动态参数中调整并学习，并做出自己的“决策”。该工具不仅可以预测未来事件的存在，还可以对各种行动及其结果提出建议。例如，自动驾驶汽车在每次旅行中收集与驾驶相关的数据，并利用其训练自己，以做出更好的驾驶和操控决策。


    # 使用机器学习进行预测 -


    必须使用机器学习算法来构建模型，根据组织获得的交易数据来预测未来趋势。这被称为“监督机器学习”，将在书中进一步讨论。例如，欺诈检测系统在先前的欺诈购买数据上使用机器学习算法，以判断交易是否为欺诈。


    - 用于模式识别的机器学习 - 必须使用无监督机器学习算法（如“聚类”来来构建能够发现隐藏数据模式的模型，但这些模型缺乏预测未来的必要参数。例如，电信公司经常使用“聚类”技术，通过选择目标区域内信号强度最强的网络塔位置来扩展其网络。


    # AI 代表人工智能。


    由于具有“智能”，人类（或智人，Homo Sapiens）经常自称为地球星球曾经过的物种中最优越的物种。即使是最复杂的动物行为也从未被认为是智能的；然而，即使是最基本的人类行为也被认为是智能。例如，当雌性钻胡蜂回来时，她把食物带回巢穴并放在门槛上，在带入内部之前检查是否有入侵者。这不就是一只聪明的胡蜂的样子吗？根据实验结果，当科学家在蜜蜂在巢内时将食物移动到巢穴口时，每当食物从初始位置被移动时，蜜蜂都会重复该操作。这项调查发现，蜜蜂适应变化环境的能力（即它们的“智能”）严重匮乏。那么，究竟什么是“人类智力”？心理学家将人类智力定义为一系列能力，包括从经验中学习并相应调整、掌握抽象概念、推理、解决问题、语言使用和感知。


    创建由人类控制和操作的、能够复制人类智能、适应新输入并像人类一样执行任务的机器（如数字计算机或机器人）被称为“人工智能”（AI）。得益于好莱坞，大多数人将人工智能与机器生命并在星球上制造破坏联系在一起。然而，事实并非如此。人工智能的核心原理是人工智能驱动的机器人能够合理化（像人类一样思考）并行动（模仿人类动作），以实现所需的目标。简单来说，人工智能是创建一个与人类一样思考和行动的机器。人工智能的三个主要目标是学习、思考和感知。


    尽管“人工智能”一词于1956年诞生，英国计算机科学先驱艾兰·马森·图灵（Alan Mathison Turing）在20世纪中期就开启了该领域的工作。1935年，图灵发明了一种符号形式的抽象计算机器，配有扫描器和无限内存。扫描器可以在内存中移动，读取和写入现有符号并创建新符号。扫描器的操作由编程指令引导，该指令也存储在内存中。结果，图灵创建了一个通过隐式学习改变和改进代码的机器。这种思想被称为“通用图灵机”，它是所有现代计算机的基础。图灵认为计算机可以从自己的错误中学习，并使用“启发式问题解决”方法来解决问题。


    20世纪50年代，早期人工智能研究主要关注问题解决和符号方法。到世纪60年代，“美国国防部”对人工智能研究产生了浓兴趣，并致力于训练计算机模仿人类推理。20世纪70年代，“美国国防研究计划局”（DARPA）完成了其街道制图项目。DARPA在2003年开发了智能个人助手，这在Siri和Alexa成为家喻户晓之前很久，可能会让你惊讶。无需说明，人工智能领域的这项开创性工作为今天计算机的自动化和推理铺平了道路。


    以下是我们希望技术模拟的基本人类特征：


    - 知识 - 机器需要大量环境数据和信息以便像人类一样行动和反应。为了进行知识工程，人工智能必须无缝访问数据对象、数据类别和数据属性，以及它们之间的关系，这些可以在数据存储中处理和存储。


