    recently seen items, gender, age, and demographics, and applying advanced analytical
    tools and algorithms to this data to generate valuable insights. The technology
    can generate more accurate product recommendations for specific clients using
    machine learning techniques. Because smart consumers are always looking for the
    most engaging and enhanced user experience, businesses can use these analytical
    tools and algorithms to gain a competitive advantage and grow their business.


    ![](img/aa49b896aea815087866776051cca72b_147_0.png)


    # Data science approaches


    Data science is primarily used in decision-making to make precise decisions.


    To make predictions, "predictive causal analytics," "prescriptive analytics,"
    and machine learning are used.


    - Predictive causal analytics - This method can be used to build a model that
    accurately predicts and forecasts the likelihood of a specific event occurring
    in the future. For example, financial institutions use predictive causal analytics-based
    tools to predict the likelihood of a consumer defaulting on credit card payments
    by developing a model that analyzes the customer''s payment history with all of
    their borrowing institutions.


    - Prescriptive analytics - are frequently used in the development of "intelligent
    tools and apps" capable of adjusting and learning from dynamic parameters and
    making their own "decisions." The tool can not only predict the existence of a
    future event, but it can also make recommendations on various actions and their
    outcomes. For example, self-driving cars collect driving-related data with each
    trip and use it to train themselves to make better driving and maneuvering decisions.


    # Machine learning to make predictions -


    Machine learning algorithms must be used to build models that can predict future
    trends based on transactional data obtained by the organization. This is known
    as "supervised machine learning," and it will be discussed further in this book.
    Fraud detection systems, for example, use machine learning algorithms on previous
    data on fraudulent purchases to determine whether a transaction is fraudulent.


    - Machine learning for pattern recognition – Unsupervised machine learning algorithms,
    such as "Clustering," must be used to build models capable of discovering hidden
    data patterns but lacking the necessary parameters to predict the future. Telecom
    companies, for example, frequently use "clustering" technology to expand their
    network by selecting network tower locations with the best signal strength in
    the desired region.


    # AI stands for Artificial Intelligence.


    Because of their "intelligence," humans, or Homo Sapiens, frequently proclaim
    themselves to be the most superior species to have ever inhabited the planet Earth.
    Even the most complex animal behaviour is never considered intelligent; however,
    even the most basic human behavior is considered intelligent. When a female digger
    wasp, for example, returns, she brings food to her burrow and places it on the
    threshold, checking for intruders before bringing it inside. Isn''t that what
    a wise wasp looks like? According to the experiment results, when the scientist
    moved the food near the burrow entrance while the wasp was inside, the wasps repeated
    the operation every time the food was moved from its initial location. This investigation
    discovered that wasps'' ability to adapt to changing environments, and thus their
    "intelligence," is severely lacking. So, what exactly is "human intellect"? Psychologists
    define human intelligence as a set of abilities that include learning from experiences
    and adapting accordingly, grasping abstract concepts, reasoning, problem-solving,
    language use, and perception.


    The study of creating human-controlled and operated machinery, such as digital
    computers or robots, that can replicate human intelligence, adapt to new inputs,
    and execute tasks like people is known as "artificial intelligence" (AI). Most
    people associate artificial intelligence with machines coming to life and wreaking
    havoc on the planet, thanks to Hollywood. However, this is not the case. The core
    principle of Artificial Intelligence is the ability of AI-powered robots to rationalize
    (think like humans) and act (copy human actions) in order to achieve the desired
    goal. Simply put, Artificial Intelligence is the creation of a machine that thinks
    and acts in the same way that humans do. The three main goals of Artificial Intelligence
    are learning, thinking, and perception.


    Although the term "Artificial Intelligence" was coined in 1956, Alan Mathison
    Turing, British pioneer of Computer Sciences, pioneered work in the field in the
    mid-twentieth century. In 1935, Turing invented an abstract computing machine
    in the form of symbols, complete with a scanner and infinite memory. The scanner
    could move around the memory, reading and writing existing symbols and creating
    new ones. The scanner''s operations would be guided by a programming instruction,
    which would be stored in memory as well. As a result, Turing created a machine
    capable of changing and improving its code through implicit learning. This idea
    is known as the "universal Turing Machine," and it serves as the foundation for
    all modern computers. Turing believed that computers could learn from their own
    mistakes and use the "heuristic problem solving" method to solve problems.


    In the 1950s, early AI research was primarily concerned with problem-solving and
    symbolic approaches. By the 1960s, "The United States Department of Defense" had
    taken an active interest in AI research, and was working on training computers
    to mimic human reasoning. In the 1970s, the "Defense Advanced Research Agency"
    (DARPA) completed its street mapping projects. DARPA developed intelligent personal
    assistants in 2003, long before Siri and Alexa became household names, which may
    surprise you. Needless to say, this seminal work in AI paved the way for today''s
    computers'' automation and reasoning.


    The following are the fundamental human characteristics that we want technology
    to emulate:


    - Knowledge - Machines require a large amount of data and information about their
    surroundings in order to act and react like humans. In order to conduct knowledge
