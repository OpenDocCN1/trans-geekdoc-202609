    could move around the memory, reading and writing existing symbols and creating
    new ones. The scanner''s operations would be guided by a programming instruction,
    which would be stored in memory as well. As a result, Turing created a machine
    capable of changing and improving its code through implicit learning. This idea
    is known as the "universal Turing Machine," and it serves as the foundation for'
  - '[PAGE 152]


    all modern computers. Turing believed that computers could learn from their own
