    或者，这是一个“近乎于零”的概率。该特定个人的性别为男性。在理论上，概率很容易应用。然而，因为这是一个，如果我们使用“分类”技术并想要一个清晰的结果，概率可以附加到二分类类值上。例如，模型可以预测“0”。如果“p
