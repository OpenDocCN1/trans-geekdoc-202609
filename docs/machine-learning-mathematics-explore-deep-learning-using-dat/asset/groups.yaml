    # Exploration of data


    Before using the data set to train the Data models, it must be cleansed to remove
    any discrepancies and inaccuracies. Before modeling, tools such as data summarization
    and visualization should be used to assess data quality and obtain the information
    needed to process the data. Because this is a time-consuming procedure, an automated
    utility called "IDEAR" provided by TDSP can be used several times for data visualization
    and the creation of data summary reports. If the processed data has reached a
