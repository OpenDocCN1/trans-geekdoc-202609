    # 第5章：数据科学与技术的生命周期


    “数据科学”一词由“彼得·纳尔（Peter Naur）”于1960年创造，据称他创造这个词是为了替代“计算机科学”，此后他르首次创造了“数据学（datalogy）”一词。纳尔于1974年发布了《计算机方法简明调查》，书中大量使用了“数据科学”这一术语。数据科学的当前定义是在1992年“第二届日法统计学研讨会”期间提出的，承认了一个主要关注数据类型、维度和结构的新学科的诞生。


    “数据”术被定义为“由计算机处理和存储的信息”。由于我们数字环境的影响，数据已经淹没了我们的现实。从简单的网站点击到我们的手机每天每秒钟都在追踪和记录我们的位置，我们的世界正淹没在数据之中。这些海量数据的深度可能会为我们尚未遇到的问题提供解决方案。


    利用数学方程和统计学从测量数据中提取洞察的实践被称为“数据科学”。数据科学家负责许多任务，并且经常与计算机科学家和统计学家混淆。任何愿意深入挖掘海量数据以获取知识的人都可以数据科学从业者，无论是个人还是公司。例如，“亚马逊（Amazon）”和“目标（Target）”等公司会追踪并记录客户的店内和在线交易，以提供定制化的产品和服务建议。像“Twitter（Twitter）”和“Instagram”等允许用户分享当前位置的社交媒体平台可以通过分析用户提供的丰富数据来检测全球迁移模式。


    # 数据科学生命周期


    对于结构化数据科学计划最推荐的生命周期是“团队数据科学流程”（TDSP）。该方法经常用于需要实现人工智能和/或机器学习算法的项目。它也可以被调整并用于执行“探索性数据科学”和“临时分析”项目。以下是
    TDSP 的生命周期：


    由敏捷和顺序阶段的迭代构建，引导预测模型应用所需的任务。在创建基于 AI 的应用程序之前，这些预测模型必须安装在公司的生产环境中。数据科学生命周期旨在特定的参与目标，尽可能地交付和完成数据科学项目。任何数据科学项目的顺利执行都需要团队内部以及利益相关者之间良好的任务沟通。


    以下是“团队数据科学流程”要素要素：


    **数据科学生命周期**定义如下：


    TDSP 生命周期的五个主要阶段


    # 标准化的项目框架


    使用模板和共享目录结构有助于为团队成员提供顺畅、方便的项目文档访问，从而实现快速信息检索。我们将所有项目论文和代码存储在如“TFS”、“Git”或“Subversion”等“版本控制系统”中，以改进团队沟通。业务需求、相关活动和功能被存储在如“JIRA”、“Rally”或“Azure
    DevOps”等敏捷项目跟踪系统中，以便对le每项功能进行增强的代码跟踪。这些技术有助于在整个项目生命周期内进行资源和费用估算。TDSP 建议在版本控制系统上为每个项目创建独立的存储，以促进更好的项目管理、信息安全和团队协作。在公司内部的所有计划中采用一致的结构有助于在组织内部形成机构知识库。TDSP
    生命周期包含了所有所需文档的标准模板，并作为集中的文件夹结构。包含用于数据探索和功能提取的编程代码的文件可以使用提供的文件夹结构进行组织，该结构还跟踪模型的迭代。这些模板使得团队协作更加容易，成员可以轻松理解他人的工作，并允许新成员顺利加入项目。Markdown
    格式使得访问、编辑和更新文档模板变得简单。这些模板包含了多个针对每个项目的关键问题清单（checklists），以确保项目的目的、目标以及交付物的预期质量得到充分阐述。例如，“项目章程”可以记录项目范围和项目正在解决的业务挑战；标准化的数据报告可以用于描述数据的“结构和统计”。


    ### 数据科学项目需要基础设施和资源。


    TDSP 建议使用“机器学习服务”、数据库、“大数据集群”和云系统等工具来有效存储基础设施并管理分析。处理或清洗过的数据可以存储在云端或本地的分析和存储系统中。分析和存储允许复制分析，同时避免数据重复和冗余，导致不一致和不合理的基础设施成本。提供了工具来授予共享资源的权限并跟踪其使用情况，允许每个团队成员安全地访问资源。


    # 项目管理工具和设施


    在大多数业务中，更改现有流程是一项困难的任务。TDSP 提供的几种工具可以鼓励并提高这些改进实施的一致性。数据科学生命周期中最最重要的流程，例如“数据探索”和“基线建模”，可以使用
    TDSP 提供的工具轻松自动化。TDSP 为向团队“共享代码库”中轻松添加共享工具和实用程序提供了定义良好的结构。通过允许组织内的其他项目团队重用和重新利用共享工具和实用程序，实现了财务节约。


    TDSP 生命周期是一个标准模板，包含一组定义良好的产物，可以跨全范围内促进成功的团队协作和沟通。该生命周期分为几个不同的阶段。来自微软的最佳实践和结构，有助于交付预测分析解决方案和智能应用程序。


    让我们更仔细地观察 TDSP 生命周期的五个阶段：“业务理解”、“数据获取与理解”、“建模”、“部署”和“客户验收”。


    ![](img/aa49b896aea815087866776051cca72b_136_0.png)


