    the scientist moved the food near the burrow entrance while the wasp was inside,
    the wasps repeated the operation every time the food was moved from its initial
    location. This investigation discovered that wasps'' ability to adapt to changing
    environments, and thus their "intelligence," is severely lacking. So, what exactly
    is "human intellect"? Psychologists define human intelligence as a set of abilities
    that include learning from experiences and adapting accordingly, grasping abstract
    concepts, reasoning, problem-solving, language use, and perception.


    The study of creating human-controlled and operated machinery, such as digital
    computers or robots, that can replicate human intelligence, adapt to new inputs,
