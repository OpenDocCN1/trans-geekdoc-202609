    # CHAPTER 3: MODELS OF NEURAL NETWORK LEARNING


    Artificial Neural Networks (ANN) have been built and designed to mimic the communication
    flow of the human brain. Hundreds of billions of nerve cell in the human body
    are interconnected and travel by the spine to the brain. They are linked by root-like
    nodes, which send messages one by one through each neuron until they reach the
    brain. These systems "learn" to perform tasks by analyzing samples, typically
    without any task-specific rules in place. They may, for example, train to use
    image recognition technology to recognize photographs containing dogs by reviewing
    sample pictures labelled as "dog" or "no dog" and then using the results to locate
    dogs in other pictures. Despite having no prior knowledge of dog characteristics
    such as fur, tails, and dog-like faces, these systems can accomplish this. Rather,
    they can synthesize identification characteristics from samples on which they
    have been trained autonomously.


    An artificial neural network (ANN) is composed of linked units or nodes known
    as "artificial neurons," which are analogous to biological neurons in the brain.
    Like synapses in the human brain, each link can send a signal to connected neurons.
    After receiving a signal, a "artificial neuron" can process it and send it to
    the neurons to which it is connected. When the ANN is implemented, the "signal"
    at a connection will be a real number, and the output of each neuron will be generated
    using a "non-linear function" of the total of the inputs.


    The connections are known as "edges." Neurons and "edges" are generally assigned
    a value or weight that will be optimized over time. Depending on the weight, the
    signal strength received by the linked neuron will increase or decrease. "Concepts"
    are produced and dispersed in the sub-network of common neurons. Neurons are capable
    of being programmed, with threshold constraints, so that a signal is only sent
    if the total signal exceeds a predetermined threshold.


    Neurons are frequently composed of multiple layers, each of which can alter its
    inputs in a distinct manner. Signals are transferred from the first layer, known
    as the "input layer," to the last layer, known as the "output layer," sometimes
    multiple times after traversed layers. The primary goal of the ANN model was to
    solve problems in the same way that a human brain would. However, the emphasis
    has shifted over time from completing general activities to performing specific
    tasks, resulting in a departure from its basic state objective. ANNs'' applications
    include "computer vision, speech recognition, machine translation, social media
    filtering, playing boards and video games, medical diagnostics, and even art."
    The most common ANNs, known as "Feedforward ANNs," operate on a unidirectional
    data flow. Through bidirectional and cyclic information flow, ANN, on the other
    hand, can achieve state equilibrium. ANNs learn from previous cases and rely on
    fewer prior assumptions by modifying the connecting weights.


    This learning could be either supervised or unsupervised. Every input pattern
    will cause in the correct ANN output with supervised learning. The weights can
    be adjusted to reduce the difference between the specified output and the output
    produced by ANN. Instead of providing the correct output immediately, reinforced
    learning, a type of "supervised learning," notifies the ANN if the generated output
    is accurate. On the other hand, unsupervised learning feeds a large number of
    input patterns to the ANN, then investigates their relationships and learns to
    categorize them accordingly. ANNs that use a combination of supervised and unsupervised
    learning are also available. ANNs are extremely useful for solving data-intensive
    problems when the technique or rules are unknown or difficult to understand due
    to their data structure and non-linear computations. ANNs can analyze large amounts
    of data in parallel and resist multivariable data errors.


    The black-box approach of ANN, on the other hand, is a significant disadvantage,
    rendering them unsuitable for situations requiring a thorough understanding and
    insight into the actual process.


    # ANNs'' Components


    - Neurons: ANNs retained the biological concept of artificial neurons receiving
    input while incorporating artificial intelligence.

    - Using a "activation function" to determine their internal state and, if available,
    a "threshold value," and a "output function" to provide output. Any type of data,
    including photographs and files, could be used as the initial inputs. As a result,
    an object in a photograph may be recognized. The "activation function" is notable
    because it allows for a smooth transition when the input values change, implying
    that a minor change in input will result in a minor change in output.

    - Weights and connections: The ANN is made up of connections that use one neuron''s
    output as an input to another. Each link is assigned a "weight" that represents
    the relative importance of the signal. A single neuron can have multiple input/output-
    The "propagation function" can be used in a number of ways

    - Estimate the input to a neuron from its predecessors as a "weighted sum." A
    "bias term" can be assigned to the weight.Backpropagation is a technique for the
    weight of the given state. In theory, stochastic gradient descent or other techniques
    such as "Extreme Learning Machines," weightless networks, and non-connectionist
    neural networks can be used to update the weights to compensate for errors.


    # ANN hyperparameter


    A hyperparameter is a parameter that is specified before the learning process
    begins. The learning process will determine the values. For example, the learning
    rate, batch size, and the number of hidden layers are all variables to consider.
    The values of some hyperparameters may influence the values of others. The overall
    number of layers, for example, may influence the size of some layers. The learning
    rate for every observation indicates the amount of corrective actions required
    by the model. A faster learning rate shortens the time required to train the model,
    reducing its accuracy. On the other hand, a slower learning rate increases the
    time it takes to train the model but can result in higher accuracy. In refinements,
    an adaptive learning rate is used that can be increased or decreased as needed
    to eliminate network oscillation, such as link weight alternation, and to aid
    in increasing the convergence rate. The momentum principle allows us to weigh
    the balance of two objects, the gradient and the previous change, so that the
    weight adjustment is partially dependent on the previous change. The gradient
    is indicated by a momentum near "0," while a value indicates the previous change
