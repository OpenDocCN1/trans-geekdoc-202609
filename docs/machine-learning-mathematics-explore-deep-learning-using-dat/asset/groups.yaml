    一种在人工智能中常用的目标解决方法，它通过分步计算当前状态与目标最终状态之间的差异。考虑机器人的一些基本功能，例如往复移动或捡取物品，这些功能导致了目标的实现。


    **推理** - 推理可以定义为在给定语境下形成相关推理的能力。推理有两种类型：“演绎法推理”和“归纳推理”。根据“演绎法推理”，如果前提正确，则结论也为正确。相比之下，在“归纳推理”中，即使前提正确，结论也可能是正确的也可能是不正确的。尽管在编程计算机以执行演绎法推理方面已经取得了巨大进展，但“真实推理”的实现仍然难以捉摸，是人工智能中最困难的挑战之一。


    **感知** 是通过利用各种感官器官对物体获取多维度视角的过程。


    许多因素，如视角、光线方向和光强度，以及物体与周围环境之间产生的对比度，都会阻碍环境感知能力的发展。人工感知已显著进步，自动驾驶汽车的引入以及能够在建筑间穿行的收集空汽水罐的机器人证明了这一点。


    ## 数据科学 vs 商业智能


    正如你可能所知，数据科学是一种跨学科的方法，通过使用数学算法和统计技术从原始数据中提取有意义的见解。另一方面，商业智能（BI）是指应用分析技术和手段，以更好地理解公司相对于过去表现的当前状况。简单来说，BI
    通过分析当前和历史数据为业务提供智能，而数据科学则要强大得多，能够分析海量原始数据以做出未来预测。


    随着来自各种来源涌入的大量定性和定量数据，企业正转向数据科学，以理解所有内容，并利用其来增长和维护其业务。数据科学作为终极决策工具的兴起，证明了组织正变得越来越依赖数据。在数据科学驱动的工具和技术的帮助下，某些商业智能过程可以实现自动化。通过互联网从世界任何地方获取数据并利用这些自动化技术获取见解的能力，将只会增加普通业务用户对“集中数据存储库”的使用。


    商业智能通常用于“描述性分析”，它为企业提供回顾性洞察。另一方面，数据科学要更具前瞻性，被用于“预测性和规范性分析”。商业智能关注的问题如“在事件期间发生了什么？可以改变什么来解决它？”，而数据科学关注的是“事件为什么发生？未来还会发生吗？”。这两个领域所处理的“W字问题”之间的根本区别决定了它们的不同之处。数据科学正在重塑商业智能格局，允许非技术人员和核心业务用户执行以前由具有计算机科学技能的技术人员完成的分析和
    BI 任务。一旦数据科学家对数据进行了业务化，这些工具对于主流业务人员来说易于使用，并且可以由没有数据科学经验的支持人员轻松维护。数据科学家和商业智能专业人士正日益协作，以开发最佳的数据模型和业务解决方案。


    与用于生成数据报告（主要是关键性能指标和指标仪表板）以及为数据管理策略提供支持信息的商业智能相比，数据科学被用于使用先进工具和统计学来生成预测报和和预判，并为数据治理提供补充数据。数据科学和商业智能之间的一个根本区别在于“内置机器学习库”的范围和规模，这使得日常业务用户能够执行半自动化或自动化的数据分析操作。可以将数据科学看作是“加强版的”商业智能，它具有在业务分析领域创造民主的潜力！


    | 特性 | 商业智能 (BI) | 数据科学 |

    | --- | --- | --- |

    | 数据源 | 结构化 (SQL，通常是数据仓库) | 结构化和非结构化 (日志、云数据、SQL、NoSQL、文本) |

    | 方法 | 统计学和可视化 | 统计学、机器学习、图分析 |

    | 关注点 | 过去和现在 | 现在和未来 |

    | 工具 | Pentaho, Microsoft BI, Tableau | RapidMiner, Weka, R |


    ## 数据探索


    数据挖掘定义为“通过分析海量数据来发现模式和规律”。数据挖掘是数据科学的一个子集，广泛用于基于人工智能的机器学习。虽然挖掘数据以发现隐藏模式并预测未来事件的技术早已为人知，但“数据挖掘”一词直到
    20 世纪才被发明。


    根据 SAS 的说法，“非结构化数据占数字宇宙的 90%”。这种数据的涌入本身不会产生更多的理解。数据挖掘技术能够过滤掉所有不需要的数据噪声，以获取可用于决策过程的相关数据。


    构成数据挖掘的三个核心相互关联的学科是：


    - 统计学（对数据关联的数学研究）

    - 机器学习算法（具有学习能力的算法）

    - 人工智能（能够表现人类智能的机器）


