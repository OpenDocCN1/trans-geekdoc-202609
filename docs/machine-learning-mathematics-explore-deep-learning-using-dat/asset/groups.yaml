    # 第三章：神经网络学习模型


    人工神经网络（ANN）的构建和设计旨在模拟人类大脑的通信流。人体内有成千上亿个神经细胞相互连接，并通过脊髓传输到大脑。它们由根状节点连接，这些节点通过每个神经元一个接一个地发送信息，直到到达大脑。这些系统通过分析样本来“学习”执行任务，通常没有任何特定任务的规则。例如，它们可以训练使用图像识别技术，通过查看标记为“狗”或“非狗”的样本图片来识别包含狗的照片，然后利用结果在其他照片中定位狗。尽管没有关于狗的毛发、尾巴和类脸脸部等特征的先验知识，这些系统也能完成这一目标。相反，它们可以从经过训练的样本中自主合成识别特征。


    人工神经网络（ANN）由被称为“人工神经元”的连接单元或节点组成，这些单元类似于大脑中的生物神经元。就像人类大脑中的突触一样，每条连接都可以向连接的神经元发送信号。接收到信号后，“人工神经元”可以处理它并发送到与其连接的神经元。当实现
    ANN 时，连接处的“信号”将是一个实数，每个神经元的输出将使用输入总和的“非线性函数”生成。


    这些连接被称为“边”。神经元和“边”通常被分配一个值或权重，该值会随着时间的推而优化。取决于权重，连接神经元接收到的信号强度会增加或减少。“概念”在常用神经元的子网络中产生并传播。神经元可以被编程，并带有阈值限制，使得只有当总信号超过预设阈值时，才会发送信号。


    神经元通常由多个层组成，每层都可以以独特的方式改变其输入。信号从被称为“输入层”的第一层传输到被称为“输出层”的最后一层，在遍历了层级后有时会进行多次。ANN
    模型的主要目标是以类似于人类大脑的方式解决问题。然而，随着时间的推移，重点已从完成通用活动转向执行特定任务，这导致其偏离了基本状态目标。ANN 的应用包括“计算机视觉、语音识别、机器翻译、社交媒体过滤、棋类和视频游戏、医学诊断甚至艺术”。最常见的
    ANN 被称为“前馈神经网络”，它们在单向数据流上运行。另一方面，ANN 通过双向和循环信息流可以实现状态平衡。ANN 通过修改连接权重从之前的案例中学习，并依赖更少的先验假设。


    这种学习可以是监督的也可以是无监督的。在监督学习中，每个输入模式都会产生正确的 ANN 输出。可以通过调整权重来减少指定输出与 ANN 产生的输出之间的差异。强化学习不是立即提供正确输出，强化学习（“监督学习”的一种类型）会在生成的输出准确时通知
    ANN。另一方面，无监督学习向 ANN 馈大量的输入模式，然后研究它们之间的关系并学习对其进行相应的分类。也有结合监督学习和无监督学习的 ANN。当技术或规则未知或由于数据结构和非线性计算而难以理解时，ANN
    对于解决数据密集型问题非常有用。ANN 可以并行分析大量数据并抵抗变量数据误差。


    另一方面，ANN 的黑箱方法是一个显著缺点，使其不适用于需要彻底理解和洞察实际过程的情况。


    # ANN 组件


    - 神经元：ANN 保留了人工神经元接收输入的生物概念，同时结合了人工智能。

    - 使用“激活函数”来确定其内部状态，如果有，可以使用“阈值”以及“输出函数”来提供输出。任何类型的数据（包括照片和文件）都可以用作初始输入。结果是照片中的物体可能被识别。“激活函数”之所以显著，是因为它允许在输入值变化时进行平滑过渡，这意味着输入的微小变化将导致输出的微小变化。

    - 权重和连接：ANN 由连接组成，使用一个神经元的输出作为另一个神经元的输入。每条连接被分配一个“权重”，代表信号的相对重要性。单个神经元可以有多个输入/输出——“传播函数”可以有多种用法

    - 将来自前驱神经元的输入估计为“加权和”。权重可以分配一个“偏置项”（bias term）。反向传播是一种用于给定状态权重的技术。在理论上，可以使用随机梯度下降或其他技术（如“极端学习机”、）、无权重网络和非连接主义神经网络）来更新权重以补偿误差。


    # ANN 超参数


    超参数是在学习过程开始之前指定的参数。学习过程将决定这些值。例如，学习率、批量大小和隐藏层数量都是需要考虑的变量。某些超参数的值可能会影响其他参数的值。例如，层的总数可能会影响某些层的大小。每个观测值的学习率表示模型所需的纠正动作量。较快的学习率缩短训练模型的时间，但会降低准确性。另一方面，慢的学习率会增加训练模型的时间，但可以获得更高的准确性。在改进中，使用了自适应学习率，根据需要增加或减少，以消除网络震荡（例如权重波动），并帮助提高收敛速度。动量原理允许我们平衡两个对象：梯度和之前的变化，使得权重调整部分取决于之前的变化。动量接近
    0 表示梯度，而值接近 1 表示之前的变化。


    # 神经网络训练的数据流水线


    神经网络被定义为“使用训练数据集学习给定输入输出的函数”。与“人工神经网络”不同，神经网络只有一个神经元，也称为“感知器”。这是一种基础且简单的技术，可以通过基础数学完成。


