    - **无法收敛**对于基于数据训练的“预期似然估计”方法来说是常见的，会导致系数发散。如果数据集包含大量高度相关的输入，或者数据集较小（例如输入数据中有大量的“0”），则可能会发生这种情况。


    “朴素贝叶斯分类器算法”是另一种具有许多应用的分类分类学习算法。它是一种基于“贝叶斯定理”的分类策略，该定理规定预测变量之间相互独立。“朴素贝叶斯分类器”简单地假设“所有”变量都是相等的。“类中一个元素的存在对该类中任何其他特征的存在没有影响。”例如，如果输入数据包括一个绿色的、圆的、直径10英制的水果图像，模型可以将其识别为西瓜。尽管这些特征中的某些是相互依赖或取决于特定特征的存在，但它们都独立地贡献了该水果图像是西瓜的概率，因此被称为“朴素（Naive）”。朴素贝叶斯模型”创建相对简单，且对于大型数据集非常有效。由于其简单性，“朴素贝叶斯”的表现甚至超过了最强大的分类系统。“贝叶斯定理”也可以用于通过“P(c),
    P(x), 和 P(x)”来确定后验概率“P(c|x)”。如果“x”已经发生，可以使用下方图像所示公式计算“c”的概率。“P(c|x)”表示“预测器 (x,属性)
    后验”的“类 (c,目标)”的概率。类的之前的概率是“P(c)”。预测器的类概率表示为“P(x|c)”。预测器的先验概率表示为“P(x)”。


