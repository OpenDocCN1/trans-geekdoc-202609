    “循环且迭代的”，每个阶段都会重复，直到产生有效的算法为止。


    在开发机器学习模型时，程序员会使用面向“统计学”和“机器学习”的编程环境，例如 Python 和 R。这些环境允许通过极少数行代码，在单个“沙箱”环境中完成模型的训练和测试。与其构建低延迟的生产系统相比，这对于创建可以快速发布到市场的交互式原型是理想的。


    开发机器学习流水线（pipeline）的主要目标是创建一个具有以下特征的模型：


    - 尽可能降低系统延迟。

    - 数据存储系统、报表能力以及“图形用户界面 (GUI)”均与其他模型组件以松耦合的方式集成。

    - 应该能够支持水平扩展，也能够支持垂直扩展。

    - 具备为数据集管理执行必要计算的能力。

    - 能够能够承受系统缺陷并在很少或无监督的情况下恢复的能力被称为故障管理（breakdown management）。

    - 输入数据应同时支持“批量”和“实时”处理。


    数据流水线通常需要“隔夜批处理”，这涉及到收集数据、通过“企业通信总线”传输，然后对其进行处理以为未来的交易生成预计算结果和建议。虽然这种模型在某些工业领域已被证明是有效的，但它无法应对其他挑战，特别是在涉及机器学习模型时。


    下图展示了应用于实时业务问题的机器学习数据流水线，其中属性和投影受到生成结果所需时间的影响。例如，亚马逊使用产品推荐系统，Lyft 使用系统估计到达时间，LinkedIn
    使用系统推荐潜在的新连接，而 Airbnb 使用搜索引擎。


    ![](img/aa49b896aea815087866776051cca72b_76_0.png)


    上面的泳道图（swim lane diagram）由两个明确指定的组件组成：


    - 1. “在线模型分析”：运行所需的应用程序元素位于图像顶部的泳道中。它展示了如何使用模型做出实时决策。

    - 2. “离线数据发现”：底部泳道描述了模型的学习元素，它用于分析历史数据并通过“批处理”方法生成机器学习模型。


    数据流水线的创建涉及八个基本阶段，如下图所示并进行了详细说明：


    ![](img/aa49b896aea815087866776051cca72b_77_0.png)


    ## 问题定义 (Problem Definition)


    在此阶段，将识别并记录要用机器学习模型解决的业务问题以及所有相关细节。


    ## 数据摄取 (Ingestion of data)


    作为任何机器学习工作流的第一阶段，输入数据被路由到数据库服务器。最需要记住的是数据是以原始形式摄取的，不进行任何更改，以便无限跟踪原始数据集。数据可以来自各种源，并可能由其他系统请求或交付。“NoSQL
    文档数据库”非常适合存储大量定义的、标记为无组织状态且正在快速发展的原始数据，因为它们不需要遵循特定模式。它还包括“分布式”


    ## 离线 (Offline)


    数据将通过“摄取服务”（Ingestion Service）从“离线”层移动到原始数据存储，该服务被描述为“一种能够封装数据源和持久化的综合编排服务”。内部使用仓库模型与数据服务接口，与数据存储进行交互。当从数据库中恢复数据时，它会被分配一个唯一的批
    ID，从而实现有效的数据查询以及端到端的跟踪与监控。数据被分为两个部分以提高计算效率。


    - 第一个特性是每个数据集对应一个流水线，允许每个数据集被独立且并行处理。

    - 第二个特性是数据可以在每个流水线内部进行分区，以充分利用一系列服务器核心、处理器以及可能的整个服务器。


    通过将数据准备工作分布在多个流水线上，可以减少完成任务的总时间。


    “摄取服务”会在预定的间隔运行，或当触发器触发时，根据结果（数据源）手动或自动选择功能。正如在获取源数据时，“通知服务”将通知生产系统，数据已成功完成并进入数据库。


    ## 在线 (Online)


    “在线摄取服务”是流式架构的门户，它通过解耦从源到处理的数据流来提供高性能、低延迟。在企业级，它也可以作为长期数据存储的中间人。作为例如，Apache Kafka（发布/订阅消息系统）和
    Apache Flume（数据采集到长期存储）可能被用于此场景。


    **数据准备栈 (Stack Data Preparation)** 在数据摄取后，将创建一个集中的流水线来评估数据状况，即寻找格式差异、异常值、模式以及错误、不或扭曲的数据，并修复任何不规范之处。“特征工程过程”也包含在此阶段。正如


    | 阶段 | 输入 | 输出 |

    | --- | --- | --- |

    | 提取 | 原始数据 | 特征 |

    | 转换 | 特征 | 特征 |

    | 选择 | List<Feature> | List<Feature> |


    正确的设计模式至关重要，因为这通常是机器学习项目中最挑战性的部分。使用工厂技术根据抽象函数行为构建特征，并使用策略模式在执行期间选择正确的特征是符合逻辑的在设计特征提取器和转换器时，考虑流水线的组合和重用性至关重要。调用者可以手动或自动选择功能。在开始训练模型之前，例如可以使用卡方统计检验来分类每个函数对概念标签的影响，同时拒绝低影响特征。有一些“选择器
    API”可以提供帮助。任何情况下，每个特征都必须分配一个唯一的 ID，以确保作为模型输入和影响评分的一致性。数据准备流水线应由一组不可变的转换组成。测试和高代码覆盖率的价值现在对于模型的成功至关重要。

