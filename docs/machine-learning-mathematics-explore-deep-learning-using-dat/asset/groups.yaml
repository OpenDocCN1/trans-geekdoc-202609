    在此阶段完成的工作是“定义对象和识别数据源”。


    此阶段将产生交付物。


    项目章程文档是一份“活的文档”，必须随着项目的进行进行更新，以反映新信息。


    - 业务需求和项目发现的修改。TDSP“项目结构定义”中包含一个标准模板。随着项目的进行，向此文档添加更多细节至关重要，同时让所有利益相关者了解所做的任何更改。


    - 数据源 – 数据源可以在 TDSP“项目数据报告文件夹”中“数据定义报告”的“原始数据源”部分找到。“原始数据源”部分还定义了原始数据的来源和最终目的地，以及其他信息，如可将数据传输到任何所需环境的“编码脚本”。


    - 数据字典 — 数据字典描述了利益相关者对数据属性和特征的定义，即“数据要素原理图”和可用的“实体关系图”。


    ## 第二阶段：数据收集与分析


    此步骤的目标是生成一个高质量的经过处理数据集，该数据集与模型目标建立关系，并确定数据集在所需分析环境中的位置。此时，必须构建允许定期数据更新和评分的数据流水线“解决方案”。在此阶段必须完成的三项主要任务是“数据摄取、数据探索和数据流水线设置”。


    ## 数据摄入


    此阶段应用于配置从源传输数据到目的地的过程。你能够进行训练和预测等分析活动的环境将确定目标位置。


    ## 数据探索


    在使用数据集训练数据模型之前，必须对其进行清洗以消除任何差异和不准确之处。在建模之前，应使用数据摘要和可视化等工具评估数据质量，并获取处理数据所需的信息。由于这是一个耗时的过程，可以使用
    TDSP 提供的名为“IDEAR”的自动化工具多次用于数据可视化和创建数据摘要报告。如果处理后的数据已达到合适的质量，就可以观察到内在的数据模式。因此，为目标选择并构建一个合适的“预测模型”将变得更加简单。现在，你必须决定是否有足够的数据来启动建模过程，该过程是迭代的，可能需要发现新的数据源以提高相关性和准确性。


    ## 创建数据流水线。


    为了补充数据建模的迭代过程，必须通过构建“数据流水线或工作流”建立一个对新数据评分和更新现有数据集的标准流程。数据流水线解决方案架构必须在该阶段结束之前完成。根据业务需求和现有系统的限制，可以使用三种类型的流水线：“批处理”、“实时或流式”和“混合”。


    此阶段将产生交付物。


    - 数据质量报告 - 此报告必须包含“数据概述”、业务需求与其属性之间的关系以及变量排名等。TDSP 捆绑的“IDEAR”工具可以为任何关系表、CSV 文件或表格数据集生成数据质量报告。


    - “解决方案架构”一词是指数据流水线的描述或图表，用于在模型构建后对输入数据进行评分并预测结果。该图表也可以代表用于新数据“重新训练”模型的数据流水线。


    - 节点决策 - 在开始实际模型构建过程之前，必须对项目进行重新评估，以确定继续进行是否可以实现预期价值。这些决策有时被称为“Go No-Go（通过或否）”。


    ## 建模是第三阶段。


    此阶段的目标是为机器学习模型寻找“最优数据特征”，这些特征具有足够的信息来准确预测目标变量，并用于制造环境。在此阶段必须完成的关键活动是“特征工程、模型训练以及确定模型对生产环境的适用性”。


    此阶段将产生交付物。


    - 特征集 - 文档包含了数据定义报告“特征集部分”中描述的所有特征。程序员大量使用它，根据文档中的描述创建必要的代码和特征。


    - 模型报告 - 此文档必须包含使用模板报告评估的每个模型的信息。


    - 检查点决策 - 根据各种模型的性能，必须做出将模型部署到生产环境的决策。


    ## 部署是第四阶段。


    此阶段的目标是在部署到生产环境之前，先在非生产级环境中（如用户验收测试）部署解决方案模型。此阶段最重要的任务是“模型的操作化”。


    让模型投入运行。


    一旦你积累了一组具有预测性能水平的模型，就可以使用它们将其操作化以用于各种应用。根据业务需求，可以实时或分批处理的方式进行预测，并与开放的“应用程序编程接口”（API）集成。


    此阶段将产生交付物。


    - 一份使用关键性能指标和数据检查系统状况的仪表板报告。

    - 一份包含最终模型部署计划的文档或运行手册（runbook）。


    ## 客户验收（第五阶段）


    此阶段的目标是确保项目的最终解决方案符合利益相关者的预期以及在第一阶段收集的业务需求。在此阶段需要完成的两个重要任务是“系统验证和项目交接”。


    此阶段将产生交付物。


    “退出报告”是此阶段为利益相关者准备的最重要文档。该文档包含了为了彻底理解系统而所需的项目所有可用细节。TDSP 包含一个标准的“退出报告”模板，可以轻松定制以满足个人利益相关者的需求。


