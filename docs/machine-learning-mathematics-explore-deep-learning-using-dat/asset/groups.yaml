    # 机器学习数学


    ![](img/aa49b896aea815087866776051cca72b_0_0.png)


    JACKSON SMART


    # 机器学习数学


    利用数据科学探索深度学习。如何利用统计学、算法、分析和数据挖掘概念创建人工智能（2022年初学者指南）


    Jackson Smart


    # 目录


    # 引言


    - 第 1 章：机器学习简介

    - 第 2 章：机器学习算法

    - 第 3 章：神经网络学习模型

    - 第 4 章：通过一致收敛实现收

    - 第 5 章：数据科学与技术的生命周期


    # 结论


    # 引言


    祝喜购买《机器学习数学入门指南》。


    通过数据科学可以学习深度学习。感谢阅读《如何利用统计学、算法、分析和数据挖掘构建人工智能》。接下来的章节将介绍机器学习算法的基础知识，以及机器学习在解决现代业务问题中的重要性。本书的第一章详细阐述了目前市场上有的四种基本机器学习算法以及机器学习的重要性。书中深入讨论了机器学习的三个核心思想：表示、评估和优化。


    你将接触到“统计学习”的概念，这是一种基于描述统计学的机器学习框架，可以分为监督学习或无监督学习。在本书的第2章“机器学习算法”中，你将学习如何构建和应用一些最常见的监督机器学习算法，包括线性回归、逻辑回归和朴叶贝斯分类算法。它将为你提供一个全面的指南，涵盖成功开发神经网络模型所需的所有知识，通过教导你如何为你的机器学习模型构建数据流水线，并在第3章“神经网络学习模型”中引导你学习特定的神经网络训练方法。本章的端到端流程将向你展示如何从零开始构建所需的机器学习模型，侧重于神经网络模型。你还将学习人工神经网络和感知器（基于单个神经元的网络模型）的各种组件和功能，以及如何将这些先进且未来的机器学习模型应用到常见的业务问题中。在本书的第四章“通过一致收敛学习”中，我们将深入探讨机器学习与统计学的交汇点。在创建机器学习模型时使用的许多统计学原则之一是“一致收敛”，它允许开发者基于经验风险最小化，根据数据样本量来评估当前问题的可学习性。


    你将从中受益：深入理解 Vapnik 在 1995 年提出的“学习一般性”概念，该概念对机器学习的进步仍然具有意义；在不使用“一致收敛”的情况下使用有限类可学习性时，作为“一致收敛”对可学习影响的统计学解释。本书的最后一章将为你全面概述数据挖掘和人工智能等前沿数据科学技术。书中详细描述了“团队数据科学流程”（TDSP），这是最受推荐的结构化数据科学项目生命周期，并介绍了每个阶段必须产出的众多交付物。你还将学习企业如何使用数据科学进行决策。人工智能的力量已经在我们周围的环境和日常物品中显现。因此，你必须区分商业智能（BI）和数据科学技术。书中充满了真实案例，帮助你理解相关原理，以及一些工具的名称和描述，你可以进一步研究并并选择在你的组织中实施它们，以获得这一尖端技术的益处。关于这个主题有许多书；感谢你选择这一本！我们尽力包含了尽可能有用的信息；请尽情阅读！


    ## 第 1 章：机器学习简介


    人工智能技术的概念基于这样观点：计算机可以被编程具有类似于人类的智能。


    它可以模仿人类的推理和学习能力，适应新的输入并在无需人工介入的情况下完成任务。人工智能原理包含了机器学习。机器学习技术（ML）是计算机的一种人工智能哲学，旨在使其能够直接学习和自我训练，发现信息模式以改进底层算法，并在无人工干预的情况下做出自主决策。在
    IBM 任职期间，先驱游戏和人工智能教授 Arthur Samuel 在 1959 年创造了“机器学习”这一术语。根据机器学习理论，现代计算机可以使用特定的训练数据集进行训练，这些数据集可以很容易地自定义以实现所需的功能。机器学习由模式识别方法引导，在该方法中，先前的交互和结果会被记录并审查，并与其当前位置相关联。由于机器学习的迭代性质，计算机必须能够在没有人类帮助的情况下适应新数据，因为它们需要处理海量数据。统计学侧重于使用现代计算机工具和技术进行预测，它与机器学习是不可分割的。“数学优化”的研究为机器学习领域增加了方法论、理论和应用领域。


    机器学习也被称为应用于业务问题时的“预测性分析”。在机器学习中，“目标”被称为“标签”，而在统计学中，它被称为“因变量”。统计学中的“变量”在机器学习中被称为“特征”。特征创建在统计学中被称为“转换”。数据挖掘和优化也与机器学习技术密不可分。机器学习与数据挖掘之间存在大量重叠。机器学习旨在根据训练数据的预定义属性做出预测。相反，数据挖掘是从海量数据中发现此前未知特征的过程。机器学习像数据挖掘一样，通过无监督学习或作为预处理阶段采用数据挖掘方法。


    这两个研究学科的底层假设将它们联系在一起。机器学习通常衡量模型复制已知知识的能力，但“知识发现与数据挖掘”（KDD）的基本目标是发现新信息。在衡量已知知识方面，其他有学习程序将轻松优于“无知或无监督”技术。然而，由于缺乏训练数据，“监督方法”无法用于标准的
    KDD 工作。数据优化是另一个与机器学习密切相关的领域。许多学习问题都可以被定义为训练数据集上特定“损失函数”的最小化。


    '
