  md: 'as search engine algorithms. Although the technique of "digging through data"
    to find hidden patterns and predict future events have been known for a long time
    as "knowledge discovery in databases," the term "data mining" was only coined
    in the 1990s.


    According to SAS, "unstructured data accounts for 90% of the digital universe."
    This onslaught of big data would not result in more understanding on its own.
    The use of data mining technology enables the filtering of all unnecessary data
    noise in order to gain a better understanding of relevant data that can be used
    immediately in the decision-making process.


    The three core and highly interconnected scientific disciplines that comprise
    data mining are:


    +   * "Statistics" (the mathematical study of data associations).

