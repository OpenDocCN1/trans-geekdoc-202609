  md: Bias is defined in the context of machine learning as "the simplified assumptions
    made by a model to further simplify the learning of the target task." Parametric
    models are built with a strong bias from the start, making learning much faster
    and easier but significantly reducing the model's flexibility for a broader range
    of applications. Low-bias algorithms for learning models include "decision trees,"
    "k-nearest neighbors," and "support vector machines." Linear regression, linear
    discriminant evaluation, and logistic regression are examples of "high-bias" ML
    algorithms. A variance can be defined in the context of machine learning as "the
    amount by which the estimation of the target function will be altered with the
    use of a different training data set." Non-parametric models with a high degree
    of flexibility have a high variance score. Low-variance ML algorithms include
