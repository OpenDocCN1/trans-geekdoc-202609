  md: '# CHAPTER 5: LIFECYCLE OF DATA SCIENCE AND TECHNOLOGIES


    The term "data science" was coined in 1960 by "Peter Naur," who allegedly coined
    the word as a substitute for "computer science" and later coined the term "datalogy."
    Naur released "Concise Survey of Computer Methods" in 1974, which liberally used
    the term "data science" throughout. The current definition of data science was
    proposed in 1992 during "The Second Japanese-French Statistics Symposium," recognizing
    the creation of a new discipline focusing primarily on data types, dimensions,
    and structures.


    The term "data" is defined as "information processed and stored by a computer."
    As a result of our digital environment, data has flooded our realities. From a
    simple website click to our cellphones tracking and recording our location every
    second of the day, our world is drowning in data. The depths of this massive data
    could yield solutions to'
