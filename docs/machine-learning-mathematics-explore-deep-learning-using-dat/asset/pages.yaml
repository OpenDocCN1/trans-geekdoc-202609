    # Standardization of the language


    The data science community is working to develop a common data mining vocabulary.
    An analyst will be able to work with a variety of data mining platforms with ease
    if they master one standard data mining language.


    # Mining for scientific purposes


    The success of data mining technology in the industrial sphere has piqued the
    interest of the scientific and academic research communities. For example, scientists
    are using "association analysis" to capture and identify human behavioral patterns
    for research purposes. Economists are using protective analysis algorithms to
    forecast future market trends by studying existing market factors.


