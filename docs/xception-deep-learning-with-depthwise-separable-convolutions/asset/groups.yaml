    # 5. Future directions


    # 4.7. Effect of an intermediate activation after pointwise convolutions


    We noted earlier the existence of a discrete spectrum between regular convolutions
    and depthwise separable convolutions, parametrized by the number of independent
    channel-space segments used for performing spatial convolutions. Inception modules
    are one point on this spectrum. We showed in our empirical evaluation that the
    extreme formulation of an Inception module, the depthwise separable convolution,
    may have advantages over regular a regular Inception module. However, there is
    no reason to believe that depthwise separable convolutions are optimal. It may
    be that intermediate points on the spectrum, lying between regular Inception modules
    and depthwise separable convolutions, hold further advantages. This question is
    left for future investigation.


