    smaller than the original input space, and then maps all correlations in these
    smaller 3D spaces, via regular 3x3 or 5x5 convolutions. This is illustrated in
    figure 1. In effect, the fundamental hypothesis behind Inception is that cross-channel
    correlations and spatial correlations are sufficiently decoupled that it is preferable
    not to map them jointly 1.


