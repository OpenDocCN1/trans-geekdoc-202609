    连接。结果如图9所示。残差连接对于帮助收敛显然至关重要，无论是在速度还是最终分类性能方面。但是我们将指出，使用与残差模型相同的优化配置来对非残差模型进行基准测试可能过于苛刻，而且更好的优化配置可能会产生更具竞争力的结果。


    此外，请注意，此结果仅表明残差连接 *对于此特定架构* 的重要性，而且残差连接绝非 *必需*，用于构建由深度可分离卷积堆叠而成的模型。我们还通过将所有卷积层替换为深度可分离卷积（深度倍数为1）的非残差VGG风格模型，获得了出色的结果，在等参数量下优于JFT上的Inception
    V3。


    在Inception模块中发现），非线性是有帮助的，但对于浅层模块（例如，深度可分离卷积的1通道深度特征空间）而言，它变得有害，可能是由于信息丢失。


    ## 5. 未来方向


    ## 4.7. 逐点卷积后中间激活的影响


    我们之前指出，常规卷积和深度可分离卷积之间存在一个离散谱，其参数由用于执行空间卷积的独立通道-空间段的数量确定。Inception模块是该谱上的一点。我们在经验评估中表明，Inception模块的极端表述，即深度可分离卷积，可能优于常规Inception模块。然而，没有理由相信深度可分离卷积是最优的。谱中介于常规Inception模块和深度可分离卷积之间的中间点可能具有更多优势。这个问题留待今后调查。


    图10. 可分离卷积层中深度卷积和逐点卷积操作之间不同激活的训练概况。


    ![](img/d2b50980707c5839cfd8800315c444b8_6_0.png)


    ## 6. 结论


    我们展示了卷积和深度可分离卷积处于离散谱的两个极端，而Inception模块是介于两者之间的中间点。这一观察促使我们提出在神经计算机视觉架构中用深度可分离卷积替换Inception模块。我们基于这一想法提出了一种新架构，名为Xception，其参数量与Inception
    V3相似。与Inception V3相比，Xception在ImageNet数据集上的分类性能有小幅提升，在JFT数据集上则有大幅提升。我们预期深度可分离卷积将在未来成为卷积神经网络架构设计的基石，因为它们与Inception模块具有相似特性，但使用起来像常规卷积层一样简单。


    我们之前提到，深度可分离卷积与Inception模块之间的类比表明，深度可分离卷积可能应该在深度卷积和逐点卷积操作之间包含非线性。在迄今报告的实验中，未包含此类非线性。然而，我们还实验性地测试了将ReLU或ELU
    [3]作为中间非线性的加入。图10在ImageNet上报告了结果，并表明没有任何非线性会导致更快的收敛和更好的最终性能。


