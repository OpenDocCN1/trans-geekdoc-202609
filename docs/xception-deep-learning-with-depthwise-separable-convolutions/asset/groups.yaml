    ## Xception：基于深度可分离卷积的深度学习


    François Chollet

    Google, Inc.

    fchollet@google.com


    ## 摘要


    我们对卷积神经网络中的 Inception 模块进行了诠释，将其视为常规卷积与深度可分离卷积操作（先进行深度卷积，再进行点wise 卷积）之间的中间步骤。从这个角度看，深度可分离卷积可以理解为具有最大塔数量的
    Inception 模块。这一观察促使我们提出一种受 Inception 启发的新型深度卷积神经网络架构，其中 Inception 模块已被深度可分离卷积取代。我们表明，该架构（称为
    Xception）在 ImageNet 数据集（Inception V3 即为该数据集设计）上略优于 Inception V3，并在包含 3.5 亿张图像和
    17,000 个类别的更大图像分类数据集上显著优于 Inception V3。由于 Xception 架构的参数数量与 Inception V3 相同，性能提升并非由于容量增加，而是由于对模型参数更高效的利用。


    ## 1. 引言


    卷积神经网络近年来已成为计算机视觉领域的主导算法，设计它们的方法备受关注。卷积神经网络设计的历史始于 LeNet 风格的模型 [10]，这些模型是用于特征提取的简单卷积堆栈和用于空间下采样的最大池化操作。2012
    年，这些想法被细化为 AlexNet 架构 [9]，其中卷积操作在最大池化操作之间重复多次，使网络能够在每个空间尺度上学习更丰富的特征。随后出现了一种趋势，即使这种网络风格越来越深，主要由每年的
    ILSVRC 竞赛推动；首先是 Zeiler 和 Fergus 在 2013 年 [25]，随后是 2014 年的 VGG 架构 [18]。此时，一种新的网络风格出现了，即
    Inception 架构，由 Szegedy 等人在 2014 年 [20] 作为 GoogLeNet (Inception V1) 引入，后来被改进为 Inception
    V2 [7]、Inception V3 [21]，最近则是 Inception-ResNet [19]。Inception 本身受早期的 Network-In-Network
    架构 [11] 启发。自首次推出以来，Inception 一直是 ImageNet 数据集 [14] 以及 Google 内部使用的数据集（特别是 JFT
    [5]）上表现最好的模型家族之一。


    Inception 风格模块的基本构建块是 Inception 模块，存在多个不同版本。在图 1 中，我们展示了 Inception 模块的经典形式，如在
    Inception V3 架构中所示。Inception 模型可以理解为此类模块的堆栈。这与早期的 VGG 风格网络（即简单卷积层的堆栈）有所不同。


    虽然 Inception 模块在概念上类似卷积（它们是卷积特征提取器），但实证上它们似乎能够用更少的参数学习更丰富的表示。它们如何工作，又与常规卷积有何不同？Inception
    之后的设计策略是什么？


    ### 1.1. Inception 假设


    卷积层试图在 3D 空间中学习滤波器，包含 2 个空间维度（宽度和高度）和一个通道维度；因此，单个卷积核的任务是同时映射跨通道相关性和空间相关性。Inception
    模块背后的想法是，通过将此过程明确分解为一系列独立查看跨通道相关性和空间相关性的操作，使该过程更容易、更高效。更准确地说，典型的 Inception 模块首先通过一组
    1x1 卷积查看跨通道相关性，将输入数据映射到 3 个或 4 个小于原始输入空间的独立空间，然后通过常规 3x3 或 5x5 卷积映射这些较小 3D 空间中的所有相关性。这在图
    1 中有所说明。实际上，Inception 背后的根本假设是，跨通道相关性和空间相关性足够解耦，因此最好不要将它们联合映射。


    1 该过程的一个变体是独立查看宽度方向相关性和高度方向相关性。这是由 Inception V3 中发现的一些模块实现的，这些模块交替使用 7x1 和 1x7
    卷积。


    考虑一个仅使用一种卷积大小（例如 3x3）且不包含平均池化塔的简化版 Inception 模块（图 2）。该 Inception 模块可以重新表述为先进行一个大的
    1x1 卷积，然后进行在输出通道非重叠段上运行的空间卷积（图 3）。这一观察自然引发了一个问题：分区中的段数（及其大小）有什么影响？是否合理做出比 Inception
    假设更强的假设，并假设跨通道相关性和空间相关性可以完全分开映射？


    图 1. 标准的 Inception 模块 (Inception V3)。


    ![](img/d2b50980707c5839cfd8800315c444b8_1_0.png)


    图 2. 简化的 Inception 模块。


    ![](img/d2b50980707c5839cfd8800315c444b8_1_1.png)


    ### 1.2. 卷积与可分离卷积之间的连续谱


    基于这一更强假设的 Inception 模块“极端”版本，将首先使用 1x1 卷积映射跨通道相关性，然后分别映射每个输出通道的空间相关性。这在图 4 中所示。我们指出，Inception
    模块的这种极端形式几乎与深度可分离卷积相同，该操作早在 2014 年 [15] 就已用于神经网络设计，并且自 2016 年被包含在 TensorFlow 框架
    [1] 以来变得更加流行。这种空间可分离卷积在图像处理中有着悠久的历史，并且自 2012 年（可能更早）以来已被用于一些卷积神经网络实现。


    图 3. 简化 Inception 模块的严格等价重构。


    ![](img/d2b50980707c5839cfd8800315c444b8_1_2.png)


    图 4. 我们 Inception 模块的“极端”版本，1x1 卷积的每个输出通道对应一个空间卷积。


    ![](img/d2b50980707c5839cfd8800315c444b8_1_3.png)


    深度可分离卷积，通常在 TensorFlow 和 Keras 等深度学习框架中称为“可分离卷积”，由深度卷积（即对输入的每个通道独立执行的空间卷积）组成，随后是点wise
    卷积（即 1x1 卷积），将深度卷积输出的通道投影到新的通道空间。这不应与空间可分离卷积混淆，后者在图像处理社区中也通常被称为“可分离卷积”。


    Inception 模块的“极端”版本与深度可分离卷积之间存在两点微小差异：


    - 操作顺序：通常实现的深度可分离卷积（例如在 TensorFlow 中）先执行通道方向空间卷积，再执行 1x1 卷积，而 Inception 先执行 1x1
    卷积。

    - 第一次操作后是否存在非线性。在 Inception 中，两个操作后都跟有 ReLU 非线性，而深度可分离卷积通常实现为没有非线性。


    我们认为第一点差异不重要，特别是因为这些操作旨在堆叠设置中使用。第二点差异可能很重要，我们将在实验部分进行研究（特别是参见图 10）。


    我们还指出，介于常规 Inception 模块和深度可分离卷积之间的其他中间 Inception 模块公式也是可能的：实际上，常规卷积和深度可分离卷积之间存在一个离散光谱，由用于执行空间卷积的独立通道空间段数量参数化。常规卷积（由
    1x1 卷积前置）是此光谱的一端，对应于单段情况；深度可分离卷积对应于另一端，其中每个通道对应一个段；Inception 模块介于两者之间，将几百个通道划分为
    3 个或 4 个段。这种中间模块的属性似乎尚未被探索。


    基于这些观察，我们建议可以通过用深度可分离卷积替换 Inception 模块来改进 Inception 架构家族，即构建由深度可分离卷积堆叠而成的模型。这得益于
    TensorFlow 中可用的高效深度卷积实现，变得可行。在接下来的内容中，我们将介绍基于这一想法的卷积神经网络架构，其参数数量与 Inception V3
    相似，并评估其在两个大规模图像分类任务上的性能，以 Inception V3 为对比。


    ## 2. 相关工作


    本工作在很大程度上依赖于以下领域的先前工作：


    - 卷积神经网络 [10, 9, 25]，特别是 VGG-16 架构 [18]，该架构在几个方面在示意图上与我们提出的架构相似。

    - 卷积神经网络的 Inception 架构家族 [20, 7, 21, 19]，它首次证明了将卷积分解为多个分支的优势，这些分支依次对通道和空间进行操作。

    - 深度可分离卷积，我们提出的架构完全基于此。虽然在神经网络中使用空间可分离卷积有着悠久的历史，可以追溯到至少 2012 年 [12]（但可能更早），但深度版本较新。Laurent
    Sifre 在 2013 年于 Google Brain 实习期间开发了深度可分离卷积，并将其用于 AlexNet 以获得准确率的小幅提升和收敛速度的大幅提升，以及模型大小的显著降低。他的工作概况首次在
    ICLR 2014 [23] 的演示中公开。详细的实验结果在 Sifre 的论文第 6.2 节 [15] 中报告。关于深度可分离卷积的这项初步工作受到 Sifre
    和 Mallat 关于变换不变散射 [16, 15] 的早期研究启发。后来，深度可分离卷积被用作 Inception V1 和 Inception V2 [20,
    7] 的第一层。在 Google 内部，Andrew Howard [6] 引入了使用深度可分离卷积的高效移动模型 MobileNets。Jin 等人在 2014
    年 [8] 和 Wang 等人在 2016 年 [24] 也进行了相关工作，旨在使用可分离卷积减少卷积神经网络的大小和计算成本。此外，我们的工作只有由于 TensorFlow
    框架 [1] 中包含高效的深度可分离卷积实现才成为可能。

    - 残差连接，由 He 等人在 [4] 中引入，我们提出的架构广泛使用了残差连接。


    ## 3. Xception 架构


    我们提出了一种完全基于深度可分离卷积层的卷积神经网络架构。实际上，我们做出以下假设：卷积神经网络特征图中的跨通道相关性和空间相关性的映射可以完全解耦。由于此假设是
    Inception 架构背后假设的更强版本，我们将我们提出的架构命名为 Xception，代表“极端 Inception”。


    网络规格的完整描述在图 5 中给出。Xception 架构有 36 个卷积层，构成了网络的特征提取基础。在我们的实验评估中，我们将专门研究图像分类，因此我们的卷积基础之后将跟随一个逻辑回归层。可选地，可以在逻辑回归层之前插入全连接层，这将在实验评估部分中探讨（特别是，参见图
    7 和图 8）。36 个卷积层结构化为 14 个模块，所有模块都围绕它们具有线性残差连接，除了第一个和最后一个模块。


    简而言之，Xception 架构是带有残差连接的深度可分离卷积层的线性堆叠。这使得架构非常易于定义和修改；使用 Keras [2] 或 TensorFlow-Slim
    [17] 等高级库只需 30 到 40 行代码，与 VGG-16 [18] 等架构不相上下，但却不

