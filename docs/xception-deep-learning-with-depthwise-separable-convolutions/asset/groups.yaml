    \ 3.5 亿张带有来自 17,000 个类别标签集的高分辨率图像。为评估在 JFT 上训练的模型性能，我们使用了一个辅助数据集 FastEval14k。\n\
    \nFastEval14k 是一个包含 14,000 张图像的数据集，来自约 6,000 个类别的密集标注（平均每张图像 36.5 个标签）。在此数据集上，我们使用前\
    \ 100 预测的平均平均精度（MAP@100）来评估性能，并用一个估计该类别在社交媒体图像中出现频率（因此重要性）的分数来加权每个类别对 MAP@100\
    \ 的贡献。此评估流程旨在捕捉社交媒体中频繁出现标签的性能，这对于 Google 的生产模型至关重要。\n\n### 4.2. 优化配置\n\nImageNet\
    \ 和 JFT 使用了不同的优化配置：\n\n- 在 ImageNet 上：\n  - 优化器：SGD\n  - 动量：0.9\n  - 初始学习率：0.045\n\
    \  - 学习率衰减：每 2 个 epoch 衰减率为 0.94\n\n- 在 JFT 上：\n  - 优化器：RMSprop [22]\n  - 动量：0.9\n\
    \  - 初始学习率：0.001\n  - 学习率衰减：每 3,000,000 个样本衰减率为 0.9\n\n对于两个数据集，Xception 和 Inception\
    \ V3 都使用了完全相同的优化配置。请注意，此配置是为 Inception V3 的最佳性能调优的；我们未尝试为 Xception 调优优化超参数。由于两个网络具有不同的训练特征（图\
    \ 6），这可能是次优的，尤其是在 ImageNet 数据集上，因为使用的优化配置已为 Inception V3 进行了精心调优。\n\n此外，所有模型在推理时都使用了\
    \ Polyak 平均值 [13] 进行评估。\n\n### 4.3. 正则化配置\n\n- 权重衰减：Inception V3 模型使用 4e-5 的权重衰减（L2\
    \ 正则化）率，该率已为 ImageNet 上的性能进行了精心调优。我们发现该率对 Xception 来说远非最优，因此改用 1e-5。我们未对最佳权重衰减率进行广泛搜索。ImageNet\
    \ 实验和 JFT 实验都使用了相同的权重衰减率。\n\n- Dropout：在 ImageNet 实验中，两个模型都在逻辑回归层之前包含一个速率为 0.5\
    \ 的 Dropout 层。在 JFT 实验中，由于数据集规模很大，在任何合理的时间内过拟合都不太可能，因此未包含 Dropout。\n\n- 辅助损失塔：Inception\
    \ V3 架构可选包含一个辅助塔，用于在网络更早的位置反向传播分类损失，作为额外的正则化机制。为简单起见，我们选择在任何模型中都不包含此辅助塔。\n\n###\
    \ 4.4. 训练基础设施\n\n所有网络均使用 TensorFlow 框架 [1] 实现，并在每台设备上使用 60 块 NVIDIA K80 GPU 进行训练。对于\
    \ ImageNet 实验，我们使用了带同步梯度下降的数据并行性以获得最佳分类性能，而对于 JFT，我们使用了异步梯度下降以加快训练。ImageNet 实验每个约需\
