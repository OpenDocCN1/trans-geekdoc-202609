    \n![](img/d2b50980707c5839cfd8800315c444b8_5_1.png)\n\nV3 和 Xception。参数数量在 ImageNet\
    \ 上报告（1000 个类，无全连接层），每秒训练步数（梯度更新）在使用 60 块 K80 GPU 运行同步梯度下降的 ImageNet 上报告。两个架构大小大约相同（相差\
    \ 3.5% 以内），Xception 略慢。我们预计，在深度可分卷积操作层面的工程优化将在不久的将来使 Xception 比 Inception V3 更快。两个架构拥有几乎相同数量的参数这一事实表明，在\
    \ ImageNet 和 JFT 上观察到的改进并非来自增加容量，而是来自对模型参数更高效的利用。\n\n![](img/d2b50980707c5839cfd8800315c444b8_5_2.png)\n\
