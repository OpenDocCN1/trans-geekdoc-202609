    \ 层都使用深度倍数为 1（无深度扩展）。\n\n![](img/d2b50980707c5839cfd8800315c444b8_4_0.png)\n\n\
    ## 4.5. 与 Inception V3 的比较\n\n### 4.5.1 分类性能\n\n所有评估均使用输入图像的单个裁剪和单个模型进行。ImageNet\
    \ 结果在验证集而非测试集上报告（即 ILSVRC 2012 验证集中未列入黑名单的图像）。JFT 结果在 3000 万次迭代后（一个月的训练）报告，而非在完全收敛后。结果载于表\
    \ 1 和表 2，以及图 6、图 7、图 8。在 JFT 上，我们测试了不包含任何全连接层的网络版本，以及在逻辑回归层之前包含两个各具 4096 个单元的全连接层的版本。\n\
    \n在 ImageNet 上，Xception 的结果略优于 Inception V3。在 JFT 上，Xception 在 FastEval14k MAP@100\
    \ 指标上实现了 4.3% 的相对改进。我们还注意到，Xception 超越了 He 等人报告的 ImageNet 上的 ResNet-50、ResNet-101\
    \ 和 ResNet-\n\n表 1. ImageNet 上的分类性能比较（单裁剪，单模型）。VGG-16 和 ResNet-152 的数字仅作为提示包含在内。所测试的\
    \ Inception V3 版本不包含辅助塔。\n\n| | Top-1 准确率 | Top-5 准确率 |\n|---|---|---|\n| VGG-16\
    \ | 0.715 | 0.901 |\n| ResNet-152 | 0.770 | 0.933 |\n| Inception V3 | 0.782 |\
    \ 0.941 |\n| Xception | **0.790** | **0.945** |\n\n与 ImageNet 数据集相比，Xception 架构在\
