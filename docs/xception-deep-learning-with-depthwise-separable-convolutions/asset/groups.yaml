    pointwise operations of the separable convolution layers.


    ![](img/d2b50980707c5839cfd8800315c444b8_6_0.png)


    # 6. Conclusions


    We showed how convolutions and depthwise separable convolutions lie at both extremes
    of a discrete spectrum, with Inception modules being an intermediate point in
    between. This observation has led to us to propose replacing Inception modules
    with depthwise separable convolutions in neural computer vision architectures.
    We presented a novel architecture based on this idea, named Xception, which has
    a similar parameter count as Inception V3. Compared to Inception V3, Xception
    shows small gains in classification performance on the ImageNet dataset and large
    gains on the JFT dataset. We expect depthwise separable convolutions to become
    a cornerstone of convolutional neural network architecture design in the future,
    since they offer similar properties as Inception modules, yet are as easy to use
    as regular convolution layers.


    We mentioned earlier that the analogy between depthwise separable convolutions
    and Inception modules suggests that depthwise separable convolutions should potentially
    include a non-linearity between the depthwise and pointwise operations. In the
    experiments reported so far, no such non-linearity was included. However we also
    experimentally tested the inclusion of either ReLU or ELU [3] as intermediate
    non-linearity. Results are reported on ImageNet in figure 10, and show that the
    absence of any non-linearity leads to both faster convergence and better final
    performance.


