    Convolutional neural networks have emerged as the master algorithm in computer
    vision in recent years, and developing recipes for designing them has been a subject
    of considerable attention. The history of convolutional neural network design
    started with LeNet-style models [10], which were simple stacks of convolutions
    for feature extraction and max-pooling operations for spatial sub-sampling. In
    2012, these ideas were refined into the AlexNet architecture [9], where convolution
    operations were being repeated multiple times in-between max-pooling operations,
    allowing the network to learn richer features at every spatial scale. What followed
    was a trend to make this style of network increasingly deeper, mostly driven by
    the yearly ILSVRC competition; first with Zeiler and Fergus in 2013 [25] and then
    with the VGG architecture in 2014 [18]. At this point a new style of network emerged,
    the Inception architecture, introduced by Szegedy et al. in 2014 [20]


    as GoogLeNet (Inception V1), later refined as Inception V2 [7], Inception V3 [21],
    and most recently Inception-ResNet [19]. Inception itself was inspired by the
    earlier Network-In-Network architecture [11]. Since its first introduction, Inception
    has been one of the best performing family of models on the ImageNet dataset [14],
    as well as internal datasets in use at Google, in particular JFT [5].


    The fundamental building block of Inception-style modules is the Inception module,
    of which several different versions exist. In figure 1 we show the canonical form
    of an Inception module, as found in the Inception V3 architecture. An Inception
    model can be understood as a stack of such modules. This is a departure from earlier
    VGG-style networks which were stacks of simple convolution layers.


    While Inception modules are conceptually similar to convolutions (they are convolutional
    feature extractors), they empirically appear to be capable of learning richer
    representations with less parameters. How do they work, and how do they differ
    from regular convolutions? What design strategies come after Inception?


