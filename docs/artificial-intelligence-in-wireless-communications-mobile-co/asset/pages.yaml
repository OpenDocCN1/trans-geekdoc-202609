- pgno: 15
  md: '# # 1 Introduction to Cognitive Radio


    The current methods of communications are becoming less relevant under today’s
    growing demand for and reliance on constant connectivity. Of decreasing relevance
    to customers are the models of a single radio to perform a single task. The expansion
    of wireless access points among coffee shops, airports, malls, and other public
    arenas is opening up opportunities for new services and applications. In the data
    market, new technologies like the IEEE 802.16 WiMAX standard are being deployed,
    and mobile phone companies are offering services to customers for connectivity
    over their networks without reliance on a WiFi access point. With current mobile
    phone access increasing worldwide and the Third Generation Partnership Project
    (3GPP) Long Term Evolution (LTE) project rapidly developing to a full standard,
    mobile phone companies are seriously competing in the wireless data market.


    It is in these choices that we see for more intelligent decisionmaking from our
    devices. And this concept does not stop with the choice between standards; the
    complexity of the standards themselves is growing. While WiFi devices manage their
    very few choices based on simple connection quality metrics, WiMAX and LTE include
    many waveform choices with highly complex interactions and consequences to the
    device behavior.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# Artificial Intelligence in Wireless Communications


    As both the applications for wireless services and the complexity of the devices
    increase, opportunities arise for more efficient ways to use and manage the wireless
    resources. The first major work pursued here is the idea of dynamic spectrum access
    (DSA), which allows devices to communicate in underserved parts of the spectrum.
    The idea of using intelligent signal processing and decision-making builds on
    this concept by enabling radios to manage not just spectrum but also the other
    wireless resources. These radios would dynamically select spectrum, waveform design,
    time, and spatial diversity options. They could even make changes at higher layers,
    for example, by modifying the medium access protocols or changing their routing
    behavior based on the network topology.


    Radios that are capable of these intelligent decisions are called cognitive radios,
    and their actions are based on observing their wireless connections and then using
    intelligent algorithms and computational learning to optimize their behavior.
    Such actions modify aspects of the protocol stack for better performance as the
    current situation demands. To perform its activities, a cognitive radio employs
    a variety of techniques and capabilities developed in communications and networking
    research in a situationally dependent form. When a mobile standard has addressed
    issues like operating at speeds under high multipath conditions, the standards-based
    solutions are trade-offs to the highest reliability among all of the possible
    conditions. These solutions be suboptimal for many given situations. A better
    approach is to select the waveform and communications capabilities that work best
    for the given environment and situation.


    In this book, we address the use of cognitive radio technology to provide communications
    systems with a specified quality of service by adapting the physical (PHY) and,
    to a small extent, Medium Access Control (MAC) layers. The major contribution
    is the formalization of radio optimization as a multiobjective optimization problem
    where radio resources are traded off to affect a desired quality of service driven
    either by a user or a specific application.


    # 1.1 Brief Concept of Cognitive Radio


    In discussing cognitive radio, we frequently talk about turning knobs and meters.¹
    These terms come from classical transceivers with adjustable


    +   1. To the best of our knowledge, our colleague Christian Rieser originated
    the “knobs” and “meters” as applied to cognitive radio in 2001 or 2002. They were
    quickly adopted by the research community and like other natural terminology,
    they may have arisen independently than once.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# Introduction to Cognitive Radio


    controls (knobs) that determine the radio’s operating parameters and meters that
    display certain performance or operating parameters of the system. An example
    is a broadcast frequency modulation (FM) receiver with a tuning knob to select
    which station to receive as well as equalizer knobs to adjust the sound quality.
    Meters might consist of a received signal strength measure or simply a light showing
    the station is being received as mono or stereo sound.


    We show a simple model of a cognitive radio in Figure 1.1 with the interaction
    between the cognitive engine and the radio through its knobs and meters. In cognitive
    radio terms, the waveform is the wireless signal transmitted that represents the
    current settings of all of the radio’s knobs. Meters include the type of modulation
    and modulation parameters, frequency channel, symbol rate, and channel source
    coding. Meters include bit error rate (BER), frame error rate (FER), signal power,
    battery life, and computational resources.


    ![](img/7780d97a7979a9fac4a1941139511cc9_17_0.png)


    **Figure 1.1** Simple model of a cognitive radio where the cognitive engine interacts
    with the radio through its knobs and meters.


    Expressed in a single sentence, cognitive radio uses the meters to build an understanding
    of the environment so as to adjust the knobs to improve the communications.


    # 1.2 Very Brief Cognitive Radio History


    Early radios were designed with specific tasks in mind, like an FM radio or a
    television receiver for example. Even many contemporary devices operate in this
    way, such as public safety and WiFi networks. Mobile phones share many of these
    same features as they are normally dedicated to a single service, voice communications,
    but they are branching out more and more. Modern mobile phones generally support
    many different modes or waveforms for different networks and frequency bands as
    well as the ability to send text messages'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'and, increasingly, data. Many are now equipped with Bluetooth and WiFi radios
    to extend their use and capabilities to different services. Other features include
    such techniques as adaptive power control or modulation adaptation in response
    to signal quality.


    As both communications and computing technology advanced, it was inevitable that
    they continue to integrate, defining the field known today as software defined
    radio (SDR). Communications devices are increasingly putting signal processing
    capabilities into software. As we discuss in more detail later, SDR provides many
    advantages and improvements in waveform design. With the flexibility SDRs offer,
    the next step was to utilize the computing power to adapt more of the waveform,
    making better use of the available communication system.


    Joseph Mitola is credited with inventing the field of cognitive radios [1] with
    an interest in using the radio system as a personal assistant of sorts that intelligently
    reacts to the user''s perceived needs. The concept of cognitive radios has evolved
    towards more communications-centric view of the radio. With a reconfigurable SDR
    system, a cognitive radio uses sensors to collect environmental information as
    well as an intelligent core to react to changes and challenges provided by the
    environment and user needs. A cognitive radio reacts and adapts to changes in
    the environment to provide continuous communications at a required quality of
    service (QoS).


    In 2003 along with Christian Ries and Ben Le at Virginia Tech, we successfully
    demonstrated a fully functional cognitive radio. We used a 5.8-GHz Proxim Tsunami
    radio system with a cochannel interferer. Our cognitive radio demonstrated streaming
    video. When the interferer interrupted the communications, the cognitive radio
    was able to develop a new waveform to overcome the interference. This work is
    described in our SDR Forum paper [2].


    For a comprehensive history and review of the goals of cognitive radio, the book
    Cognitive Radio Technology provides the first published collection of cognitive
    radio research [3]. Its chapters cover many different areas of cognitive radio,
    including policy, regulations, and implementation technology. Another comprehensive
    source of cognitive radio discussion is a set of papers published by Simon Haykin
    [4, 5]. We reference his work in the chapters to come. Other areas that are directly
    related to the implementation of cognitive radio and radio-like technology include
    the DARPA XG program, the IEEE 802.22 standard, and the IEEE P.1900 effort, now
    known as Standards Coordinating Committee (SCC) 41. The XG program [6] is a dynamic
    spectrum access (DSA) system that provides seamless communications while changing
    frequencies to keep interfering with other networks while managing its own received
    interference.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# Introduction to Cognitive Radio


    5


    The sensing, selection, and coordination of the use of radio spectrum, as well
    as a workable system, are all significant advances in the field. The goal of the
    IEEE 802.22 standard is to use cognitive radio technology to take advantage of
    unused spectrum for wireless regional area networks (WRAN)[7] while the IEEE SCC
    41 works on general cognitive radio and dynamic spectrum access standardization
    efforts [8].


    The most significant and sustained work and research in cognitive radios comes
    from the field of DSA. Most of this is chronicled in the proceedings of the IEEE
    DySPAN symposium [9, 10, 11]. The 2007 and 2008 symposia included a demonstrations
    section where companies and research groups were able to both demonstrate their
    capabilities as well as experiment with other devices. While DSA can be achieved
    without artificial intelligence, a lot of research and solutions proposed use
    cognitive radio capabilities in their sensing and decision-making approaches.


    The interest in DSA has been driven largely by the TV spaces debates where the
    unused television channels could be repurposed for communications, which would
    require sophisticated sensing capabilities and frequency agility. The Federal
    Communications Commission (FCC) has recently published a positive report on testing
    such TV white-space devices [12] and ruled on allowing such devices to operate
    [13], which is a major step forward for DSA and eventually cognitive radios. The
    FCC has not been silent on the subject in the part, either issuing a report and
    order in 2005 on SDR and CR [14].


    While we are still a few years away from commercial devices supporting the type
    of cognitive radios that this book discusses, the momentum is pushing in the right
    direction.


    # 1.3 Definition


    The definition of cognitive radio has been under debate since its introduction.
    In particular, much of the early work in cognitive radio dealt with the concept
    of DSA, and some authors equate cognitive radio with DSA. While this is one of
    the applications of cognitive radio it is certainly more of a service-oriented
    view of communications The other aspects of cognitive radio develop whereby the
    entire communications systems adapt intelligently to offer better quality of service.
    The service model extends beyond the DSA model by looking at the system performance
    and not just the slice of spectrum allocated.


    Instead of worrying about exact definitions as they are argued in the standardization
    bodies, the remainder of this book will deal with the goals of cognitive radio.
    These are to build a flexible, reconfigurable radio that'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# Artificial Intelligence in Wireless Communications


    is guided by intelligent processing to sense its surroundings, learn from experience
    and knowledge, and adapt the communications system to improve the use of radio
    resources and provide quality of service.


    In this way, a cognitive radio follows traditional artificial intelligence systems
    [15]. These systems, as illustrated in Figure 1.2, as agents that take input through
    sensors and respond to the input through actuators. The input to these systems
    are the radio’s meters and the actuators are the radio’s knobs. The intelligent
    agent completes the cognitive radio by providing the learning and intelligent
    algorithms that understand the meters and control the knobs.


    ![](img/7780d97a7979a9fac4a1941139511cc9_20_0.png)


    **Figure 1.2** Typical intelligent agent diagram that receives information through
    sensors and provides responses through actuators. When applied to a radio system,
    the agent provides the cognition to the cognitive radio.


    # 1.4 Contributions


    To enable the goals of cognitive radio, we discuss in this book an architecture
    of a cognitive radio. The cognitive engine, at a minimum, is designed to coordinate
    a set of sensors, an optimization routine, a learning and decision-making system,
    and the underlying reconfigurable radio system. We will show the design and implementation
    details of the cognitive engine components. Through the design of the cognitive
    engine, we discuss different applications of artificial intelligence to solve
    the problems faced by a cognitive radio and demonstrate how some of these methods
    improve communications.


    The major theoretical work is in the detailing and discussion of the cognitive
    engine adaptation to mult multjective optimization problem. For its application
    to cognitive radio, we describe the physical layer as a set of objective functions,
    methods of analyzing them, and ways that they can be traded off in the optimization
    system based on performance criteria. While this discussion provides the analysis
    only for the physical layer, we hope that it will show how to extend these techniques
    to other aspects of radio adaptation.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# Introduction to Cognitive Radio 7


    One particularly successful method to solve the multiobjective cognitive radio
    problems is the implementation of a highly flexible genetic algorithm. The operation
    of the genetic algorithm optimization system easily allows updates and additions
    to the optimization problem space as well as the dynamic creation of chromosomes
    to represent the waveform, and thus, it provides a solution independent of the
    search space and communications system.


    As a way to augment the optimization process, we also introduce the use of case-based
    decision theory. This is a memory feedback system that learns and improves the
    cognitive radio behavior.


    The cognitive radio design we will be discussing throughout this book covers all
    of these topics. We graphically summarize our approach in Figure 1.3 from the
    sensing to the monitoring feedback system.


    +   * Model system Taking in surrounding radio environment and user/ network requirements

    * Remember models and apply case-based decision theory to determine best course
    of action to take

    * Use genetic algorithms to update and optimize the new radio parameters

    * Monitor feedback from radio to understand system performance Penalize knowledge
    base for poor performance


    Figure 1.3 Overview of the major functions in our cognitive engine approach.


    Although we provide both theory and a practical implementation of methods to build
    cognitive radios, we also understand that there is a lot of research left to do
    to fully understand the cognitive radio behavior and optimization processes. Because
    of this, we have designed a mechanism that allows for easy introduction of new
    cognitive radio methods and components to test, experiment, and compare different
    solutions. The process also has the benefit of allowing easy distribution and
    sharing of cognitive components throughout a network, enabling knowledge sharing
    and distributed processing among cognitive radios.


    We then provide experimental results of the cognitive engine on a real software
    radio platform. These experiments serve two purposes. First, they provide a scientific
    analysis of the theory we have developed. Second, we move the experiments between
    a simulated environment and real radios. Both'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'of these systems are based on a similar underlying platform but with different
    capabilities. The cognitive radio methods are shown to easily transition between
    these two environments, supporting changing radio capabilities as well as performance
    objectives.


    # # 1.5 Contents


    We begin this book by describing what a cognitive radio is and the pieces that,
    together, make a cognitive radio. The basic processing elements and their capabilities
    are implemented as modular components, and each component can be developed and
    tested independently before integration with the rest of the engine. This is discussed
    in detail in Chapter 2 and built upon throughout the rest of the chapters.


    Contributions to the cognitive radio theory include specific implementations of
    artificial intelligence (AI) to radio optimization. Chapter 2 discusses the use
    of AI within the context of wireless communications and reviews some of the work
    that has developed.


    Chapter 3 introduces the principles of SDR. While there is no new theory added
    to the field of SDR, it is necessary to understand how they work in order to support
    the remaining chapters. The chapters on AI and SDR lead to the main theoretical
    focus of this book that includes radio optimization in Chapter 4, the genetic
    algorithm optimization method in Chapter 5, and case-based decision theory and
    decision-making in Chapter 6 that is used to improve the optimization.


    Chapter 7 addresses the practical issue of controlling radio nodes in a network
    during reconfiguration of the physical layer waveform. Following these concepts
    of optimization and control with a cognitive engine, Chapter 8 provides a few
    working examples of the developed cognitive engine and experimental scenarios
    to understand the performance and behavior. Chapter 9 concludes the book by discussing
    a number of advanced topics and extensions to the theory and implementation provided
    here.


    # # References


    +   [1] J. Mitola, Cognitive Radio: An Integrated Agent Architecture for Software
    Defined Radio, PhD diss., Royal Institute of Technology, 2000.


    +   [2] T. W. Rondeau, B. Le, C. J. Rieser, and C. W. Bostian, "Cognitive Radios
    with Genetic Algorithms: Intelligent Control of Software Defined Radios," in Software
    Defined Radio Forum Conference, Phoenix, AZ, 2004, pp. C-3 – C-8.


    +   [3] B. Fette, editor, Cognitive Radio Technology, New York: Elsevier, 2006.'
  merge: -1
  img_proc: true
