  md: '# Genetic Algorithms for Radio Optimization 85


    dimensions. Genetic algorithms also allow easy implementation of constraints about
    the problem [10, 11].


    To review the argument in Chapter 4, in effective wireless communications, the
    waveform properties affect the radio’s behavior in many dimensions such as BER,
    bandwidth, power consumption, and throughput rates. Each of these dimensions has
    some relationship to the QoS, and these relationships change in their relative
    importance depending on the application being used. For example, large file transfers
    suggest a need for low BER and high data rate, a video conference has more demands
    on delay than BER. Since these goals often compete with each other, in minimizing
    BER and minimizing power at the same time, waveform optimization requires joint
    optimization of many objectives. Genetic algorithms are a powerful approach to
    autonomously adapting waveforms, a multiob genetic algorithm (MOGA).


    Different selection and evaluation methods have been proposed for MOBAs [12, 13].
    Many methods try to combine the evaluations along the different dimensions into
    a single metric [14]; this method breaks down in cases where the values of the
    dimensions differ greatly in magnitude (BER of 10^-6 versus data rate of 10^9),
    and normalizing each dimension requires a large amount of domain knowledge, which
    might be difficult to obtain [10] or change over time. Other methods involve competition
    between population members and incrementing the fitness value of the winner for
    each objective dominated by the winning member [12]. Horn [15] extends this idea
    by pairing off two opposing individuals against a larger pool of chromosomes from
    the population. The individual who wins the most competitions against the pool
    competes with each member of the pool is deemed better fit and survives to the
    next generation.


    We need to introduce a few definitions for the performance analysis before continuing.
    The general analysis comes down to finding the dominated solutions in the solution
    space, known as the Pareto front. These solutions are nondominated when optimization
    in any objective negatively impacts at least one objective. This is, a change
    in solution cannot simultaneously improve all dimensions at the same time. The
    Pareto-ranking approach uses the concepts of inferiority and superiority. These
    definitions assume a minimization problem where u < v means u is better than v.
    We make this clarification because of possible confusion with the terms inferior
    and superior or when performing a maximization problem. Summarizing from [16]:


    Inferiority: u is said to be inferior to v iff v is partially less than u:


    ```

    ∀i = 1, ..., n, v_i ≤ u_i ∃i = 1, ..., n, v_i < u

    ```'
