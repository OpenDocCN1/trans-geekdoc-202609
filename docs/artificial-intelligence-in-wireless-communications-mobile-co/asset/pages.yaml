  md: '# A


    # Analysis of GNU Radio Simulation


    Chapter 3 introduced the GNU Radio and the modulation schemes available. The chapter
    also presented the simulation environment and the method used to collect the performance
    meters, which are required by the cognitive engine. This appendix provides a performance
    analysis of the simulation environment we developed by plotting the BER versus
    $E_b/N_0$ curves for the supported modulations of GMSK, BPSK, QPSK, 8PSK, DBPSK,
    DQPSK, and D8PSK. The plots are developed by measuring the simulation performance
    of the SDR code used to set the signal power, propagation and channel conditions
    (noise power and path loss), and signal, noise, and BER estimations at the receiver.


    # A.1 Bit Error Rate Plots


    The first order of analysis is to see how the modulators and demodulators work
    under known conditions; in particular, we are looking at how closely these components
    match the theoretical performance in AWGN channels. Equations (4.8) through (4.12)
    provide the theoretical BER equations. Figures A.1 through A.7 show the BER compared
    to the theoretical curves. These figures also provide an analysis of how the $E_b/N_0$
    calculations perform by plotting the noise level and path loss against the estimated
    $E_b/N_0$. The error bars in these figures represent one standard deviation from
    the estimated mean over 20 trials.


    Unfortunately, there is no available theoretical lower bound, we have used the
    theoretical curve for 8PSK as a crude approximation and assumed that the D8PSK
    curve would have approximately a 2-dB worse performance like other differentially
    coded modulations.'
