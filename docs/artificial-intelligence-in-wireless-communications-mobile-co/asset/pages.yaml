    # 4.3 Multiobjective Optimization: A Different Perspective


    The previous sections described the objective functions we focus on in this work.
    When reviewing these, there is overlap as well as interactions among certain objectives.
    When any one objective is optimized, it affects the performance of some other
    objectives, either positively or negatively. We find constructive to graphically
    represent these interactions to understand the complexity of the multiobjective
    environment. In Figure 4.2, we list each objective as a node and two types of
    edges. Solid edges with arrows define a direct relationship between two objectives,
    where one objective depends on the other objective being pointed to. The dashed
    edges with no directivity indicate some indirect dependence through one or more
    knobs. For example, BER, bandwidth, spectral efficiency, throughput, and computational
    complexity all depend on the type of modulation used, so changing the modulation
    affects all of these objectives in some way.


    # 4.4 Multiobjective Analysis


    Equation (4.1) provides the basic formula to describe a multiobjective optimization
    problem, and the preceding sections describe a set of possible objectives when
    optimizing the PHY layer of a radio. What remains to understand how the cognitive
    engine can use to analyze the behavior of different waveforms and select the best
    one. The method of performing this analysis is a large factor in the success of
    a multiobjective optimization problem.


    # 4.4.1 Utility Functions


    The most straightforward method of selection is to build a single utility function
    that combines the objectives into one number. The algorithm can then easily rank
    the solutions and select the solution that maximizes (or minimizes) the utility
    function. Utility functions are a core research area in economics and'
