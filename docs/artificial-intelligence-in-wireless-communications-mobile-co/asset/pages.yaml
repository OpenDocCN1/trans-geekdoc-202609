    # 3.4.2 The USRP Version 2


    An updated USRP was recently released, the USRPv2. This design offers a number
    of improvements to the first generation USRP. It uses higher-resolution and faster
    ADCs and DACs at 14-bits, 100 Msps and 16-bits, 400 Msps, respectively. It handles
    only one transmitter and one receiver at a time, unlike the USRPv1, but the USRPv2
    is equipped with a high-speed connector to tie two USRPv2s together for multiprocessing.
    The USRPv2 includes a more capable FPGA, the Xilinx Spartan 3, than the USRPv1,
    which uses an Altera Cyclone. The USRPv2 also stores the FPGA image on an SD card
    instead of writing it from the host computer when first run as the USRPv1. With
    the SD Card and MIPs processor image programmed on the Vertex IV, the USRPv2 is
    capable of complete standalone operation. One of the most significant changes
    between USRPv1 and USRPv2 is the use of a Gigabit Ethernet (GigE) link instead
    of USB for transfer data. With full-duplex GigE, the USRPv2 can simultaneously
    transmit and receive 25 MHz bandwidth selects at complex baseband.


    Throughout this book, the real differences between the USRPv1 and USRPv2 are unimportant.
    In the cognitive radio concept, these systems play the same role. We will generically
    refer to these two systems as the USRP since we will not need to further differentiate
    their capabilities.


