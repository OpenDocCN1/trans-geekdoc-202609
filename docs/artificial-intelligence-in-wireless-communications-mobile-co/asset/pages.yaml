    # 8.3.3 Interference (3): Correcting for Sensors


    While the mistake in the last example related to a logic error in the sensors,
    other measurements and uncertainties can also have an effect on the cognitive
    engine’s performance. The meters designed for use with the GNU Radio simulation
    measure the received power and noise power, and as Appendix A shows, the measurements
    are fairly accurate, increasing in uncertainty as the SNR decreases. These tests
    were conducted outside of the presence of interference sources, which significantly
    skew the results. The received signal strength of the meters sensor calculates
    the average magnitude squared of the received signal through the receiver’s channel
    filter.'
