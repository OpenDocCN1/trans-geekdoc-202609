- pgno: 195
  md: '# D


    # XML and DTD Representation of the Cognitive Components


    This appendix provides template DTD and XML files used to pass information between
    the cognitive components. The DTD files are used by the cognitive engine to teach
    the cognitive controller the format the data it will look like and therefore how
    to process and store the data. The DTD files are transferred from the components
    to the cognitive controller during the initialization stage. The waveform file
    representation is used in the genetic algorithm to understand how to build the
    chromosome to properly represent the system.


