  img_proc: true
- pgno: 136
  md: '122 Artificial Intelligence in Wireless Communications


    solution. This method also ignores the possibility that a waveform created by
    one radio does not work for another radio. In a heterogeneous network, some nodes
    may be incapable of using the particular waveform. Even if all nodes are capable
    of using the specified waveform, other aspects of the waveform may perform badly
    for certain nodes. A major issue often discussed is the hidden node problem. A
    radio that is unseen by the cognitive radio to another node on the network. The
    new waveform, while good for the designing node, causes interference to the other
    nodes.


    Research in cognitive networks, as the work by Thomas et al. [6, 7], attempts
    to address this issue by looking at end-to-end performance. From this perspective,
    the cognitive network uses objective functions that optimize with respect to the
    network performance. In [6], they use a game approach to optimize an ad hoc network
    with respect to power and channel control. Game theory has been widely studied
    for wireless network optimization to look for optimal states for all nodes, or
    a Nash equilibrium. Neel provides an extensive discussion and analysis of game
    theory for cognitive radio [8].


    # 7.3 Distributed AI


    Another benefit of looking from the whole network instead of single node adaptation
    is the advantage of the available processing power capabilities of each node.
    Parallel processing has often been used advantageously in computer science, and
    with the move towards multicore processors, it is likely a subject that will continue
    to receive attention. Some algorithms have shown themselves to be easily separable
    for processing portions on different processors, and genetic algorithms are among
    these. Goldberg cites many methods that take advantage of the populations of a
    GA in a distributed sense [9].


    A particularly technique is to split the population among different processing
    elements to create “islands” of populations. Each population is independently
    optimized, and the populations of optimized chromosomes are combined, and a winner
    is selected. Populations can also migrate between islands to share genes. Alba
    provides a background on parallel genetic algorithms by applying them to find
    error-correcting codes and antenna placement in a radio network [10]; these applications
    are particularly interesting in light of our work. Other literature on this topic
    looks more closely at the mechanisms of work in the migration and populations
    [11] as well as other types of parallelization of GAs [12, 13].


    When applying a parallel genetic algorithm to an online learning system such as
    a cognitive radio, there are many questions that need to be addressed.'
  merge: -1
  img_proc: true
- pgno: 137
  md: '# Cognitive Radio Networking and Rendezvous


    The parallel GAs have some form of migration, or sharing, of population members
    to perform the global analysis of the results to find a solution. The implementation
    of migration should be designed to consider the required network overhead. Another
    issue is that cognitive radio networks are dynamic where nodes can come and go
    random. Most parallel GAs are studied under the assumption that the network of
    processing elements was established for this task. Instead, a parallel GA in a
    cognitive radio network performs the parallelization as a secondary process to
    normal communications. The algorithm must be implemented with respect to the dynamics
    of the network and robust against the cost of processing nodes. Distributed AI
    offers significant potential to improve the global solutions and reduces the time
    and power required by any individual node, but these are some of the issues around
    which a distributed system must be implemented.


    # 7.4 Conclusions


    While giving few answers, we have discussed some important considerations in the
    future development and deployment of cognitive radios in this chapter. A network
    of cognitive radios must include methods by which transfer waveforms among all
    nodes and take into consideration the needs of other nodes when designing new
    waveforms. The networking aspect itself opens up the potential to use distributed
    and parallel processing to enhance cognition in the network. In any case, consideration
    must be given to the overhead required on the network to transfer the information
    related to the cognitive radio performance and network maintenance.


    For the practical purposes of the experiments in the next chapter, the method
    used for node control is a simple push method from one node to the others when
    it develops a new waveform. Furthermore, a default waveform provides a fallback
    channel and modulation for the nodes to use if communications is lost.


