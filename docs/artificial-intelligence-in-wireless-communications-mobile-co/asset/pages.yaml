- pgno: 221
  md: '# About the Authors


    Thomas W. Rondeau


    Thomas W. Rondeau is on the research staff of IDA’s Center for Communications
    Research in Princeton, New Jersey. He received his B.S., graduating summa cum
    laude, and M.S. in electrical engineering from Virginia Tech in 2003 and 2006,
    respectively. He received his Ph.D. degree in electrical engineering from Virginia
    Tech in 2007. Upon completion of his degrees, he worked as a post-doctoral research
    engineer with the Centre for Telecommunications Value-Chain Research (CTVR) at
    Trinity College, Dublin, Ireland.


    Rondeau has published over twenty papers on software defined cognitive radios,
    including a chapter in the text book Cognitive Radio Technologies edited by Dr.
    Bruce Fette and a best paper award at the Software Defined Radio Forum’s 2004
    Technical Conference. Rondeau’s doctoral dissertation was awarded both the Virginia
    Tech and Council of Graduate School’s Distinguished Dissertation Award in mathematics,
    science, and engineering for 2007. The basis of this work has also been awarded
    one of the first U.S. patents on cognitive radio. He participates in the GNU Radio
    project where he has helped develop much of the digital communications capabilities
    including narrowband transmitters and receivers as well as an implementation of
    orthogonal frequency division multiplexing (OFDM). Rondeau has also had experience
    teaching digital communications to senior undergraduate students.


    Tom’s research interests include cognitive radio, software defined radio theory
    and implementation, artificial intelligence, signal processing, and software and
    programming practices. When not pursuing these interests, Tom can often be found
    reading and has a particular fascination with science and computing history and
    cultural trends.'
  merge: -1
  img_proc: true
- pgno: 222
  md: '# Charles B. Bostian


    Charles B. Bostian is Alumni Distinguished Professor of Electrical and Computer
    Engineering at Virginia Tech, where he was a faculty member since 1969. Prior
    to joining the university, he served as a U.S. Army officer and worked briefly
    for Corning Glassworks. He holds B.S. (1963), M.S. (1964), and Ph.D. (1967) degrees
    from North Carolina State University. Since 1993, Bostian has served as the Director
    of the Virginia Tech Center for Telecommunications (CWT). He is also a member
    of Wireless@Virginia Tech.


    In his career at Virginia Tech, Bostian has taught more than 4,000 students, and
    his teaching has been recognized by a number of awards, including ten certificates
    of teaching excellence and the William E. Wine Award for Excellence in Teaching.
    He is a four-time winner of the Eta Kappa Nu Outstanding Teaching Award and elected
    member of the Virginia Tech Academy of Teaching Electronics. Solid State Radio
    Engineering and Satellite Communications, now in his second edition.


    Bostian’s primary research interests are in cognitive electronics and radio system
    design. Currently, he directs National Science Foundation (NSF), National Institute
    of Justice (NIJ) and Defense Advanced Research Projects Agency (DARPA) on cognitive
    radio. He has served on two international technology assessment panels sponsored
    by NSF and NASA, visiting many communications centers in Europe and Japan. These
    panels produced two widely read reports that significantly influenced the development
    of satellite communications research. One of these was published in hard cover
    by Noyes as Satellite Communications Systems and Technology. He has authored or
    coauthored 45 journal and magazine articles and contributed to approximately 110
    conference papers and presentations and to the Wiley Encyclopedia of Electrical
    and Electronics Engineering and to Cognitive Radio Technology (Newmens, 2006).


    Elected Fellow of the IEEE in 1992 for contributions to and leadership in the
    understanding of satellite path wave propagation, Bostian is a former chair of
    the IEEE-USA Engineering R&D Policy Committee and served as Associate Editor for
    Propagation of IEEE Transactions on Antennas and Propagation. On leave during
    the 1989 calendar year, he was an IEEE Congressional Fellow on the staff working
    on legislative issues related to the American electronics industry and economic
    competitiveness. He served on the IEEE-USA Fellow Committee, helping to select
    and mentor other congressional fellows. He is a Fellow of the Radio Club of America.


    In his off-duty hours, Bostian is a performing folk musician, playing hammered
    dulcimer and string bass with the band Simple Gifts of the'
