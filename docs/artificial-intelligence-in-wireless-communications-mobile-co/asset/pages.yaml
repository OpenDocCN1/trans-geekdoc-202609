- pgno: 139
  md: '# 8


    # Example Cognitive Engine


    Over the past few chapters, we have been building up the design of the cognitive
    engine. We now present an implementation of the cognitive engine along with examples
    in both simulation and over-the-air experiments. We develop the experiments in
    four parts: a simple use of the genetic algorithm to design waveforms, addition
    of the interferers to the example, the use of the case-based decision theory feedback
    mechanism, and finally the application of the cognitive engine over the air.


    One of the major problems we have to address when presenting the results is the
    lack of a definitive mechanism to compare results. Unlike the knapsack problems
    presented previously where only one metric represents how successful the optimization
    was, the results here are multidimensional. Furthermore, for the complex environments,
    many potential solutions exist to produce desired behavior, and the random, intractable
    behavior of the genetic algorithm may yield different waveforms To work through
    this, we build the simulation analysis slowly, introducing new objectives each
    time for specific purposes and showing the behavior of the genetic algorithm by
    plotting the performance of each objective over the generations. The trends exhibited
    in these graphs will indicate the response of the optimization across the different
    objectives. As the number of objectives increases, the distribution of the solutions
    along the Pareto front becomes more difficult to see. Therefore, the early graphs
    are designed to show the success in the optimization method while later results
    will be measured more empirically. Finally, all graphs of the same objective functions
    are plotted using the same range so each can be compared to the others.'
  merge: -1
  img_proc: true
- pgno: 140
  md: '# 8.1 Functional System Design


    While in the previous chapters, we discussed the theory behind the system design
    and explained how the different systems work together, in this section, we review
    the full design of the cognitive engine package. Figure 2.3 showed the generic
    cognitive engine system featuring its major components. Figure 8.1 shows the specific
    implementation of the cognitive engine for the simulations. Note that the verification
    system has been removed from these simple experiments. Since we are focusing on
    the optimization of waveforms, under the simulation environment, we have no need
    to add policy decisions. Later, we will show some experiments done under specific
    regulatory constraints and how the cognitive engine responds to these conditions.


    ![](img/7780d97a7979a9fac4a1941139511cc9_140_0.png)


    Figure 8.1 CWT’s cognitive engine implementation for the simulated experiments.


    First, each of the sensor components is instantiated; these include the meters,
    the objectives, and the PSD sensors. The meters sensor provides information about
    the performance of the radio by “reading the meters.” The objectives sensor provides
    information gathered about the QoS requirements of the user and the application,
    and it indicates the objectives to use in the analysis. The PSD sensor provides
    information about the external interference environment, or power spectral density
    of the spectrum. The'
  merge: -1
  img_proc: true
- pgno: 141
  md: '# Example Cognitive Engine 127


    XML representation of the information from all of these meters is provided in
    Appendix D.


    Next, the optimization component needs to be instantiated. Like the sensors, this
    is a state machine process that listens for a connection and a request to process
    data from the cognitive controller. When this happens, the cognitive controller
    passes a number of items to the optimization process which is required for processing
    or adds information to help in the optimization. In this case, the optimization
    routine is the WSGA, which requires the set of algorithm parameters, the problem
    definition, and the chromosome definition. The parameters are the operating parameters
    such as the population size, the crossover and mutation rate, and the termination
    conditions such as the maximum number of generations. The problem definition describes
    the optimization evaluation. For the WSGA, the problem statement is the set of
    objective functions to use, such as BER or throughput (see Chapter 4), and the
    weight of each objective. The chromosome describes the radio hardware. The chromosome
    is a binary vector that represents the search space; in the WSGA, the search space
    is the set of radio knobs. The DTD and XML description of the waveform (see Appendix
    D) provide the mechanism to map between the chromosome and the radio knobs. This
    process is discussed in more detail in Chapter 5.


    Three extra pieces of information can also be sent to the optimization process.
    The first are solutions used to seed the population of the case-based decision
    maker. Also, the radio environment map can be sent to the optimizer to help it
    understand the interference environment. This can then assist with the waveform
    design like the center frequency and bandwidth of the signal. The cognitive controller
    can also send the results of the meters sensor describing the measured power and
    path loss, which are useful in determining the parameters as required transmit
    power and modulation for the current conditions. The optimization process can
    run without any of these three pieces of information, but each is meant to help
    inform and guide the optimization process for better performance.


    The radio framework needs to be instantiated. The framework, as described in Chapter
    2, provides the translation between the cognitive engine''s representation of
    the waveform and the radio platform. In this case, it parses the XML waveform
    representation and generates a GNU Radio graph.


    When instantiated, the cognitive engine associates itself with the sensors, optimization
    process, and radio framework that are part of the cognitive engine. A simple XML
    file tells the cognitive controller what systems are present and how to contact
    them. Each sensor is first contacted and stored as a component associated by a
    specific name for the sensor, there can be any number of sensors attached at any
    given time. Only one'
  merge: -1
  img_proc: true
- pgno: 142
  md: 'optimization and radio framework are currently supported at a time. The cognitive
    engine can also describe the policy engine interface, if one exists, and it configures
    the user interface. Currently, the decision maker and case-based systems are integrated
    with the cognitive controller, but these should be separated to allow different
    implementations. When this happens, the decision maker, too, will associate with
    the cognitive controller in this standard way.


    When a component is associated, the cognitive controller requests the XML and
    DTD files used by the component to describe its information. These files are used
    to build the representation in the case base and store the results of each component,
    like the optimization results or the sensor data. It is exchange of information
    that necessitates the instantiation of the components before the controller.


    Below, we show a simple Python script that acts as the user interface to control
    the cognitive engine. The command structure is simple:


    ```

    <component>:[name]:<command> [extra parameters]

    ```


    The component is one of the major components, such as "sensor" or "optimizer."
    The name is only required for the sensors to describe which sensor command is
    to be passed, such as "meters" or "objectives." The command describes action requested
    from the component, such as "collect" to request data from the sensor or "optimize"
    to tell the optimization process to run. The final optional extra parameters can
    be additional information to a component for its processing, as a frequency range
    for the PSD sensor to scan.


    The control script performs the actions listed here:


    +   1. Run the radio system;

    2. Collect the meters and PSD;

    3. Collect the objectives;

    4. Search for previous solutions in the case base;

    5. Run the optimization process given the problem definition, the chromosome definition,
    the GA parameters, the radio environment map and meters, and the previous solutions;

    6. Receive the optimized waveform and simulated results and store these in the
    case base;

    7. Run the new waveform on the radio in the environment;

    8. Collect the new meters and compare the performance.'
  merge: -1
  img_proc: true
- pgno: 143
  md: '# 8.2 Simple Simulations


    The simple simulation environment uses an AWGN channel with a free-space path
    loss shown in (8.1) where $n=2, GT=GR=0, c$ is the speed of light in meters per
    second, $d$ is the distance between transmitter and receiver, $P_T$ is the transmitted
    power in dBm, and $P_R$ is the received signal power in dBm. The path loss is
    implemented by using a frequency of 780 MHz. We chose this frequency because of
    the significant interest in this spectrum and the FCC 700 MHz spectrum auction
    that took place in early 2008. The distance was set for this frequency to provide
    path loss of about -22 dB, or about 1 wavelength.


    ```

    $P_R = P_T + G_T + G_R - n10\log_{10}\left(\frac{4\pi df}{c}\right)\quad(8.1)$

    ```


    The simulation ran 100 KB, or $8 \times 10^5$, bits through the transmit-receive
    chain, which will provide adequate representation of the BER where $1 \times10^{-6}$
    is considered the lowest threshold and most of the simulations were designed for
    higher BER than this. The objective function calculation was designed the simple
    lin-log of (5.2).


    # 8.2.1 BER-only


    In the following tables, we abbreviate the columns for bit error rate (BER), signal
    to interference plus noise ratio (SINR), throughput (Thr.), bandwidth (BW), spectral
    efficiency (Spec. Eff.), interference power (Int.), power consumption (Pwr.),
    and computational power (Comp.). Table 8.1 shows these values for the BER-only
    test. The results of the test are listed in Table 8.2.


    # Table 8.1

    Objectives: BER-Only Test


