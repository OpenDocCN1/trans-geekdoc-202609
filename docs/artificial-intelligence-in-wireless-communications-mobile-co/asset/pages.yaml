    The other two methods for multiobjective analysis suggested by Hughes include
    multiple single objective Pareto sampling (MSOPS) and repeated single objective
    (RSO). The MPSO approach calculates all of the objectives for each member of the
    population, and builds a matrix where the columns represent the objectives, and
    the rows represent each of the individual''s rank ranked in each objective, giving
    the highest ranking individual a score of 1, and counted over all members in the
    population (i.e., the worst performing member is given a rank of the population
    size). The population members are then assigned a rank according to the number
    of objectives in which each excels.


    The RSO approach evolves a population multiple times using a single, different
    objective each time. The dominant members from each are kept for use in the final
    analysis of the Pareto set.


    Hughes'' results confirmed his hypothesis that the MPSO and RSO approaches outperform
    the Pareto ranking approach. While results also show that the MPSO approach outperforms
    the RSO approach. While presenting the evidence, he indicates that this is only
    proof for the limited problem set used, and without mathematical proof, each problem
    might require a different method. Because each of the methods listed here is applicable
    to use with a genetic algorithm, the basic formulation developed in the next chapter
    for the application of a genetic algorithm for waveform adaptation holds. Consequently,
    it will be interesting in future work to develop and compare different methods
    of objective analysis.


    The remaining issue of performing population analysis is the selection of the
    best solution from the optimized Pareto front that best represents the desired
    quality of service. One way to do this would be to utilize one of the utility
    functions that combines multiple objectives into a single objective to build a
    ranking scheme, although this concept faces the same challenge of representation
    and combination of dissimilar but dependent objectives as previously.


    Another populations-based method of selection is called Pareto algebra introduced
    by Geilen et al. [26]. Pareto algebra assumes a set of possible nondinated choices
    that have a preference value related to some application. A good example from
    their paper is the decision for giving a broadcasting program depends on the purpose
    of the television; whether it is for television viewing, video, or gaming. They
    then develop an algebra to select the TV that, based on certain properties, best
    satisfies the family''s preference. One of the biggest drawbacks to this technique
    is the need for a large amount of'
