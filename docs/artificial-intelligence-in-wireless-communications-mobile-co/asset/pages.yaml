    optimization requires stronger reasoning capabilities and the potential to create
    and test new design solutions.


    A common theme we will continue to develop is the combined use of both learning
    and optimization processes. Feedback from a learning system can augment the optimization
    routines through comparisons between the radio''s actions and the desired outcomes
    of the optimization. Furthermore, as touched upon in this chapter and developed
    in Chapter 6, a learning system can significantly adapt decision-making in time-constrained
    situations. If the cognitive radio requires an immediate solution, the learning
    system can provide a known working solution developed in the past. Given time
    constraints or lack of valid solutions, the optimization process can develop new
    solutions or evolve old solutions for better operation.


    Information and knowledge are both important concepts for a cognitive radio. Information
    is data about the environment collected through the available sensors. Information
    can include items such as position, interference, battery life, or performance
    analysis. The information collected from the sensors feeds both the learning and
    the optimization routines to help make decisions. Knowledge is a concept developed
    from information. Knowledge is a useful representation of the information that
    says something about what information means. The sensors might provide the cognitive
    radio with time and position information, but the radio needs to know what information
    might mean about potential use patterns and known problems, such as areas of service
    outage or high interference during a daily commute.


    More information is good, but only if the cognitive engine can transform the information
    into usable knowledge. Some sensors might provide a lot of information such as
    ambient temperature, but if the models used to make decisions do not use information,
    the sensor adds no useful knowledge to the system. On the other hand, sophisticated
    sensors that provide information about interference power over a wide bandwidth
    can find immediate use by a cognitive radio seeking access to a particular amount
    of spectrum.


