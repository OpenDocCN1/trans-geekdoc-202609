    # 5.4.1 Details of Chromosome Structure


    The WSGA''s chromosome structure differs from most traditional GAs because of
    the variable number of bits used to represent any gene. Most GAs use a single
    data type or number of bits per gene, but to better represent various radio capabilities,
    the WSGA uses a flexible representation. For example, a radio might be capable
    of thousands of center frequencies over multiple gigahertz but has only a few
    modulations from which to choose. The chromosome can therefore give a large number
    of bits to the frequency gene and a small number to the modulation and the transmit
    power genes, as shown in Figure 5.6. A key result of this structure is that it
    makes the GA independent of what radio it is optimizing.


    | 20 genes = 1x10⁶ values |

    | Center Frequency | ... | |

    | 4 genes = 16 values | 6 genes = 64 values |

    | ... | Modulation | Transmit Power |


    **Figure 5.6** Representation of the WSGA''s chromosome with variable bit representations
    of genes.


    The variable bit representation is a result of the SDR platform definition file
    [18]. The platform definition file includes an XML file that looks very similar
    to the XML listing in Section 2.3.5 to represent the waveform bounds, as well
    as a DTD file to represent the basic waveform order. Instead of providing an explicit
    value for each knob, though, the definition XML file provides the range of values
    each knob may have. The definition file can be thought of representing the possible
    genes in the chromosome while the waveform XML file represents the specific gene.
    As an example, Figure 5.7 is the representation of the frequency range for a radio
    capable of transmitting from 400 to 500 MHz in steps of 1 kHz and from 2.3 to
    2.5 GHz in steps of 100 kHz. It also says that the radio can transmit in the 400
    MHz range from 0 to 100 dBm in steps of 0.1 dBm and at 2.3 GHz from 0 to 20 dBm
    in steps of 0.1 dBm. This XML example shows how both continuous values well as
    discrete jumps in values can be represented. The full XML listing is located in
    Appendix D.'
