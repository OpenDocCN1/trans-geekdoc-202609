    a complete implementation as a starting point.


    # 2.3.3 Decision Maker


    The decision-making component of the cognitive engine helps understand the information
    provided by the sensors and makes decisions about actions to take. The decision
    maker uses the sensor information to determine if refiguration is required due
    to poor performance or signs of decreasing performance. If optimization is required,
    the decision maker should also provide some context, such as an optimization goal
    (e.g., high throughput or low battery consumption) or a time limit for when a
    new waveform is required. The decision maker also uses past knowledge to provide
    the optimization process with information to help it in its work.


    The current method of decision making in our work uses case-based decision theory
    (CBDT) [10]. CBDT keeps a database of observed cases, the actions taken to respond
    to those cases, and results of the action. When the sensor provides new data,
    the case that is the most similar and useful is chosen from the case base as an
    action, or initial solution, to the optimization process. The decision maker then
    determines if optimization is needed to build a better waveform, use a waveform
    from the case base, or maintain the current waveform. If using a waveform from
    the case base, the cognitive radio could attempt to optimize the past solutions
    or bypass the optimization process altogether if that waveform performs well or
    if there is not enough time to find an alternative solution.


    The decision maker and CBDT are discussed in detail in Chapter 6.


    # 2.3.4 Policy Engine


    The optimization process takes sensor data and creates a new waveform to meet
    some specified QoS. However, the waveform returned by the optimization process
    can be sent to the radio, the cognitive controller must ensure it is legal with
    the local regulatory restrictions. The policy engine does just. The policy engine
    must test and authenticate a waveform. There are many ways to look at this process,
    but most of them involve databases of regulatory policies that restrict waveform
    transmission based on frequency and power with time as another possible dimension.


    An important aspect of policy engines is that they meet two competing goals within
    the cognitive radio world. First, the policy engine must be secure that unauthorized
    waveforms cannot be transmitted. Second, it must be liberal enough to allow many
    different types of waveforms'
  merge: -1
  img_proc: true
