  md: '# 4.2.6 Throughput


    Dependencies


    Knobs: modulation type, symbol rate, number of bits per packet


    Meters: none


    Objectives: bit error rate


    Definitions


    +   $l$ = number of bits per packet (bits)

    $P_e$ = bit error rate as defined in Section 4.2.1

    $R_b$ = bit rate (bps)

    $R_s$ = symbol rate (sps)

    $k$ = number of bits per symbol


    Throughput is a measure of the amount of good information received. This definition
    distinguishes throughput from data rate in that data rate is simply a measure
    of the rate at which data arrives with no consideration for transmission errors.
    There are many papers available to describe throughput estimations for networks
    that include retransmission of bad packets. We will circumvent the complexities
    of that kind of analysis by assuming no retransmissions and furthermore no coding,
    as a single bit error leads to a packet error. These errors in our experiments
    does not yet support these capabilities. Although this models the behavior of
    the given SDR system, the error rate will be much larger than it would be in a
    system with proper channel coding and protocols. Finally, we assume uniform distribution
    of bit errors. Once again, it is clear that this formulation does not model all
    environments and networks properly and could benefit from more comprehensive and
    adaptive functions.


    The probability of a packet error, or the error rate, is shown in (4.18).


    ```

    $P_p = 1 - (1 - P_e)^l$

    ```


    For each received packet, $l$ bits are received over a time period of $l/R_b$
    where $R_b = kb_s$. On average, for a packet error rate of $P_p$, the bit rate
    is modified by the probability of receiving a good packet, $1 - P_p$.


    ```

    $R_{th} = R_b(1 - P_p) = R_b(1 - P_e)^l$ (bps)

    ```


    This objective directly relies on the BER, using these two objectives together
    doubly weights minimizing the bit error rate. While this might'
