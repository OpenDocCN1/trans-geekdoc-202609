    # 2.3.2 Optimizer


    The optimization process takes environmental or user-oriented information from
    the sensors or user interface to select or design a waveform that maximize the
    performance. Items that affect the optimization process include the user/application
    needs, the physical (propagation) environment, available resources (e.g., spectrum
    and computational resources), and the regulatory environment. Given a required
    QoS, the cognitive engine asks the optimizer to produce a waveform that comes
    as close to the QoS values as possible with respect to the provided environmental
    data. Depending on the implementation, the optimization may build a new waveform
    or select it from a list of predefined waveforms designed for specific problems.


    The optimization process makes up a large part of this work and will be discussed
    in detail later, specifically in Chapter 5. Furthermore, there are many implementations
    of an optimization process with plenty of research in the field remaining. We
    touch upon some of these techniques later in this'
