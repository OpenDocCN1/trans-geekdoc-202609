    |---|---|---|---|---|---|---|--|\| 1.00 | N/A | N/A | N/A | N/A | N/A | 0.00 |
    N/A |


    Figure 8.2 shows the performance of the BER and power objectives over the generations
    of the genetic algorithm. These plots show the expected behavior of the objectives
    as the BER objective is optimized. The power objective, while calculated, had
    a weight of 0, so it did not factor into the preference of the algorithm. We use
    the calculation here to show how the two objectives are traded off under the performance
    criteria. The BER curve has a steady negative slope for the best performing individuals
    while the power increases as a direct result of minimizing the BER.'
