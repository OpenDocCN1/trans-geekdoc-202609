    The utility is a representation of the difference between the calculated objectives
    and the actual objectives as shown in (6.5). We use the CES utility function because
    of the flexibility it offers to define the relationships between the quantities
    used in utility calculation. There are $N_O$ defined objectives, $f_i(q)$ is the
    calculated value of objective $i$ for case $q$, and $f_i(m)$ is the observed value
    of objective $i$ from the meters. The absolute value is used in this calculation
    because the waveform is penalized for both better and worse performance against
    the estimated values. In other words, penalties occur for over- and underutilization.


