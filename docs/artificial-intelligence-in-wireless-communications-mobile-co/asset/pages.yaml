  md: '# Decision Making with Case-Based Learning


    # 6.2.1 Memory and Forgetfulness


    The base holds M cases, and therefore must have a system to delete, or forget,
    cases no longer used. Given a full case base, when the cognitive engine observes
    a new case, either the case is not remembered or it must replace a current case.
    We list here a few forgetfulness functions.


    **Temporal forgetfulness:** In this method, the oldest case is forgotten. This
    method is simple to implement as a first in out (FIFO) buffer. Each new case is
    pushed onto the front of the queue and the oldest case is popped off.


    **Maximum distance forgetfulness:** If the similarity function defines a distance
    between two cases, a linear relationship can determine which case to forget. Here,
    a one-dimensional distance determines how similar cases are where distance is
    measured as $d(x_i, x_j)$. The constructed example in Figure 6.2 where the $xs$
    represent cases and the $o$ represents the new case. The most similar case to
    the new case $o$ is found to be $x_3$. Next, the two cases surrounding this case
    is found, $x_2$ and $x_4$. The goal is to maximize the distance between the surrounding
    cases to provide better coverage of the search space. The case that satisfies
    (6.4) provides the maximum distance between both cases $x_2$ and $x_4$. Edge cases
    are as easy as they are just a maximization of the similarity space.


    ```

    $$\hat{c} = \min_{c\in\{o,x_3}}\{abs(d(x_2,c)-d(c,x_4))}$ (6.4)

    ```


    The new case increases the distance between itself, $x_2$, and $x_4$ over the
    old case $x_3$, so $x_3$ is forgotten. The theory behind this approach is to maximize
    the possible problem space represented by the case base. By replacing $x_3$ with
    $o$, more of the problem space is covered.


    ![](img/7780d97a7979a9fac4a1941139511cc9_115_0.png)


    **Figure 6.2** Maximizing distance between cases.


    **Maximum utility forgetfulness:** This technique replaces the case with the lowest
    utility with the new case.


    Each of these techniques makes assumptions on the problem space such as temporal
    properties and radio behavior. If the environment changes quickly, then forgetting
    the oldest case might work well as the case base tracks the changes. If the environment
    does not change quickly, or if there are certain'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'environmental models that are characteristic of many problems, it is useful
    to keep many of these models around and not drop one simply because it is. The
    ability to properly model similarities and understand utility is important to
    the case base system; perhaps there is an environment where no waveform will become
    successfully, or it is difficult to build one that does. In this situation, forgetting
    a case based on low utility might not allow the system enough time to learn the
    proper response by starting from a blank slate each time.


    It is also possible to mix these systems where information is stored in different
    cases for different purposes. Rieser discusses this concept in his dissertation
    [7]. He uses the concepts of short-term memory and long-term memory, where each
    represents a different method of remembering and forgetting information to take
    advantage of the different properties each has.


    # 6.3 Cognitive Engine Case-Based Decision Theory Implementation


    Figure 6.1 provides the system diagram for how the case base is used with the
    optimization process. Looking back at Figure 2.3, the new case is received by
    the cognitive controller through a sensor. The cognitive controller calls the
    decision-making process to find information in the knowledge, or case, base and
    then sends the information to the optimization runtime for processing. Each of
    these components can be developed and implemented independently. We introduce
    here the concepts before the components for the cognitive radio. We then build
    on this foundation to solve knapsack problems using CBDT. The ability to move
    between the knapsack and the cognitive radio illustrates the problem-independent
    nature of the cognitive engine.


    The sensors and genetic algorithm optimization components in the cognitive engine
    have already been discussed. Chapter 2 discussed the format of the information
    from the sensors, and Chapters 3, 4, and 5 discussed how the GA optimizes waveforms.
    The design of the case base is covered here.


    The base is implemented as a relational database in MySQL.Structured Query Language
    (SQL) is both well-known and well-supported, and the MySQL implementation has
    proven performance, stability, and design. Integration of a MySQL databases is
    possible in almost any contemporary programming language, and it reduces the design
    time of building a new database or case base structure. Another key aspect of
    the MySQL database is that these database servers are easily accessed over a distributed
    network, making it easy to share knowledge between cognitive radios.'
