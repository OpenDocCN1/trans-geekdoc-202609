  md: '# # 3


    # ## Overview and Basics of Software Defined Radios


    One of the most important enabling technologies to the application and success
    of cognitive radios is an adaptive, flexible, and powerful radio platform. Many
    cognitive radio radio techniques can work with more traditional radio designs.
    For instance, new mobile phones and laptop computer chips are offering access
    to multiple radio technologies and services. Such service selection can be accomplished
    by cleverly designing RFICs and software to take advantage of different standards
    like WiFi, WiMAX, LTE, CDMA, and GSM. A simple, but useful, cognitive radio implementation
    would use multistandard technology to automatically select the carrier and standard
    that best provides the QoS and pricing for the current application. We present
    a method to do this in Chapter 6.


    More interesting applications and cognitive radio capabilities become evident
    when we break away from traditional, fixed standards-based radios and move to
    more flexible platforms. This flexibility is coming about by moving the signal
    processing into the software domain. Device capabilities are easily adjusted and
    turned on and off software functions, and software updates provide paths to introduce
    new and better services. With the added flexibility, radios can then determine
    and negotiate their own waveforms to satisfy their service requirements. In this
    chapter, we introduce software radios. The rest of the book will take the basics
    we develop here as the context for building cognitive radio applications.


    The first part of this chapter covers a basic introduction to SDR or software
    radio (SR). We will not get into any notational argument between SDR and SR and
    will use them interchangeably. We will not provide an in-depth analysis of the
    subject of software radio, but we will present the'
  merge: -1
  img_proc: true
- pgno: 48
  md: Given the limitations of realizing the ideal SDR, hardware can perform some
    of the signal processing while processors of different types, such as
  merge: -1
  img_proc: true
- pgno: 49
  md: '# Overview and Basics of Software Defined Radios 35


    field programmable gate arrays (FPGA), digital signal processors (DSP), and general
    purpose processors (GPP) can handle other parts. Figure 3.2 shows a very high-level
    view of a radio transmitter that includes some of the main functions required
    in a transmitter. Each block has levels of flexibility performance demands. Things
    like forward error correction (FEC) and interleaving operate bits at the bit rate.
    These tend to be low-complexity operations in the transmitter, but the respective
    decoding process at the receiver is very computationally intensive procedure.
    The modulator converts bits into symbols in the complex plane for transmission.
    Again, this is usually straightforward in the transmitter. In the receiver, this
    process requires computationally expensive frequency phase, and timing synchronization
    to properly demodulate digital signals. The pulse shaping filter then bandwidth-limits
    the signal for transmission.


    Before the symbols can be sent to the analog portion of the transmitter through
    the DAC, we need some rate conversion step. The DAC and the analog hardware will
    be clocked at some rate that must be at least twice fast as the bandwidth of the
    signal going into the DAC to meet the Nyquist criteria. This requires some rate
    conversion algorithm upsamples the signal to match the DAC’s sampling rate.


    Again, these processes must balance performance with flexibility. For a specified
    radio standard that uses is no need for flexibility and only one form of modulation
    or FEC coding, all of these operations can be realized in hardware. However, for
    any cognitive radio purpose, we require a great amount of flexibility. It is imperative
    that the coding and modulation are performed in software to support new and different
    methods or techniques. On the other hand, given a particular set of analog hardware,
    the resampling stage is inside and it is not required to be as flexible. Furthermore,
    the sampling rate is directly related to the computational cost and a performance-limiting
    parameter for software.


    An SDR designer must decide which components should be in hardware or software,
    and what types of processors should run the software based on design needs and
    trade-offs. Components can be implemented in GPPs, DSPs, FPGAs, and application-specific
    integrated circuits (ASIC). These elements have been listed in this way to represent
    the general trend from flexibility to performance with GPPs being highly flexible
    and versatile versus ASICs are designed for a particular purpose but perform their
    tasks very efficiently. FPGAs are flexible to some extent that they are reprogramable,
    yet their programming does not have any real-time dynamics, yet they are more
    powerful for a given task than a GPP would be.'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'As we discuss in the following sections, we perform most of the signal processing
    elements in GPP software. The resampling to match the DAC sampling rate is more
    universal to waveforms as we mentioned, we allow the FPGA to take care of this
    process. The rest is done in analog hardware. The receiver lines are drawn in
    the respective sections as the transmitter. After the ADC, FGPA downsamples and
    filters the signal while the full receive chain is handled in software. Other
    SDR implementations favor splitting between FPGAs and DSPs with more emphasis
    on the former. These design choices to maximize the required behavior.


    ![](img/7780d97a7979a9fac4a1941139511cc9_50_0.png)


    **Figure 3.2** High-level SDR physical-layer transmitter with bits received from
    the upper layers of the protocol stack.


    To help us make these decisions, software radio engineers must first understand
    what systems are capable of performing the different tasks most efficiently. We
    will first explore what can be done with software exploring the limitations. From
    this discussion, we will develop an understanding of what communications capabilities
    can be expected to run in software and therefore what a cognitive radio can control.


    # 3.2 Benefits of Using SDR


    Probably the greatest benefit of SDR technology is the flexibility it can provide.
    Developing software to perform signal processing offers large opportunities for
    improving the development cycle. From an operations standpoint, developing and
    debugging software is much easier, more practical, and more cost-effective than
    designing and producing hardware like an ASIC where the turnaround time is long
    and expensive and constitutes a large barrier to entry into the field. From a
    service provider''s perspective, SDR offers easy upgrades and bug fixes in deployed
    systems. If a new system or waveform is required, as long as there is enough processor
    power, software updates can be pushed to a system operating in the field [4].
    A successful example of this'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'was the recent upgrade of Vanu, Inc.''s mobile base stations that were running
    a global system for mobile communications (GSM) system and were upgraded to support
    code division multiple access (CDMA) [5]. This capability saved time and cost
    of deployment, and it lowered the costs to the service provider, who did not have
    to install a new system. Although in the particular case of Vanu, Inc., the SDR
    is implemented primarily in general purposes, many SDR platforms are being built
    around FPGAs, which can easily handle software upgrades when changes are infrequent
    and do not require real-time adaptation of a waveform. While FPGAs offer higher
    performance for lower power, changes to the FPGA firmware can take the order of
    seconds; this is an acceptable lag when updating a system, but not fast enough
    for reconfiguring a waveform in a cognitive radio setting.


    Another benefit of software radio is the concept of software reliability. When
    software is modular and well-written, it can be ported between processors with
    minimal rewriting required. Unfortunately, this is not entirely the case in today''s
    FPGA-based SDR systems where the software language, very high-speed integrated
    circuit hardware description language (VHDL), is too low and does not provide
    sufficient to be platform independent. We suspect this will change as more influence
    from the computer science community affects development practices in the SDR world.
    Nevertheless, in systems that are GPP based, code portability is a major advantage.


    Cognitive radio depends on having much flexibility in waveform design and reconfiguration
    as possible, and the more flexible the underlying platform, the more useful the
    cognitive radio is. The case of cognitive radio, unlike over-the-air downloads
    or service upgrades, requires real-time reconfiguration of much of, if not the
    entire, waveform. For the reconfiguration, given current technology, a GPP should
    handle the majority of the signal processing; that is, minimum hardware, maximum
    GPP.


    Another benefit of SDR is, being software already, it is easy to test individual
    signal processing blocks, simulate performance, and test behavior in a closed
    system and then reuse the same software for a real, over-the-air system. In this
    chapter, we describe the GNU Radio SDR platform used in which we simulate the
    performance of our cognitive radio prototype. The transmitter and receiver from
    the simulation are then used for over-the air experiments by adding the USRP radio
    front-end instead of a software interconnect.


    In software radio, we are benefiting from two parallel development paths, one
    from the hardware domain and one from software. First, Moore’s law is one of our
    best friends. The technology trend in integrated circuits is constantly giving
    us more computational resources. Currently, the multicore'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'parallel processing systems increasingly available on the market providing
    us with more processing capabilities at lower power consumption to make SDR an
    even more promising technology. A second reality of these technology shifts are
    increasing capabilities within the processing elements themselves. The push of
    DSP-type elements such as single instruction multiple data (SIMD) into general
    purpose processors is giving us more throughput at lower cost.


    A factor is the paradigm shift from the early digital emulations of analog circuits
    to more recent digital building blocks that have no analog counterpart. In his
    quite signal processing book, fred has shown new ways of thinking and solving
    old problems [6]. Exploiting digital signal processing techniques, harris offers
    advances that both improve performance and reduce overhead.


    Because of the work in both processor technology and signal processing research,
    the trend is increasingly favoring SDR for implementing wideband, complex, and
    dynamic radio systems.


    # 3.3 Problems Faced by SDR


    Of course, all the benefits of SDR come with a cost such as consumption, speed,
    and efficiency. In hardware, the designer can optimize a circuit or chip for a
    particular purpose that will provide the processing required at the lowest possible
    power consumption, and hence the name application specific integrated circuit.
    On the other hand, general purpose processors provide the flexibility and reuse
    concepts discussed previously, but they do not achieve the same performance as
    a hardware system dedicated to a particular waveform.


    Many of the problems identified here are engineering challenges that cross a variety
    of disciplines. Processor technology is stepping up to the computing challenges
    with multicore techniques, advanced instruction sets like SIMD, and graphics processing
    units (GPUs) being used in multimedia processing and gaming engines [7, 8]. Multicore
    processors currently offer some of the most incredible advances in general purpose
    computing power [9], especially with cores like those used in the IBM CELL processor
    and future asymmetric multicore processors [10]; that is, different types of cores
    for different processing purposes. In this type of design, GPP-like cores can
    provide logic and control while GPU-type cores enable high-speed, efficient signal
    processing. A further advantage of multicore and multiprocessors systems is that
    operations can take place in parallel.


    Parallelization lends itself directly to SDR processing. First, parallelizing
    the processing elements allows the receive and transmit paths'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# Overview and Basics of Software Defined Radios


    to operate simultaneously. Second, when segmenting a data stream into blocks of
    samples, these blocks can be processed simultaneously through different parts
    of the transmit or receive path. With this structure, the SDR can simultaneously
    perform different tasks like timing synchronization, demodulation, decoding, and
    framing.


    As these general purpose processing elements are increasing in capabilities and
    our ability to program them is improving, the cost savings of using these systems
    instead of ASICs becomes even more compelling. While a general purpose processor
    can be designed to solve many different problems, the cost of creating an ASIC
    is getting increasingly expensive. To make it worthwhile, an application requiring
    an ASIC demands a significant customer base. Applications that can be GPPs start
    making more economic sense because the reduced hardware cost of entry into a market.
    Along with employing reusable software, companies can drastically lower cost with
    standard off-the-shelf processor components and portable software.


    There will always be a need for some signal processing such as amplification and
    high frequency mixing to place in hardware. Other functions such as multicast
    processing and filtering over the baseband processing and the ADC and DAC will
    greatly benefit from implementation in FPGAs. Meanwhile, cognitive radio operates
    most effectively in general purpose baseband processing for the most flexible
    systems available. In the next section, GNU Radio implementation provides an example
    of a GPP-based SDR used in cognitive radio work.


    # 3.4 GNU Radio Design


    One of the most popular SDR implementations is GNU Radio [11], a GNU (the clever
    recursive acronym for "GNU is Not Unix") project of the Free Software Foundation
    (FSF) to provide a GPP-based open source software defined radio. We focus on these
    SDR products extensively in this book for many reasons. First, one of us, Rondeau,
    is an active developer for the GNU Radio project and has extensive knowledge of
    it. Second, GNU Radio is one of the most complete and widely used SDRs for cognitive
    radio development. GNU Radio and USRPs are used in academic research, amateur
    radio enthusiasts, for government needs, and increasingly small business innovations.


    As an open source project licensed under the general public license (GPL), these
    SDR tools make themselves easily and readily available for use in both research
    and development. With years of work gone into producing the GNU Radio framework
    and the USRPs, these projects offer a quality'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'foundation for software and cognitive work.^1 The free software licensing of
    GNU Radio also means that anyone reading this book can download and experiment
    with the ideas we are presenting.


    GNU Radio is a software package that provides signal processing blocks, discrete
    components to perform a specific task. Each of these components is a C++ class
    that a developer can connect to other blocks to create a flow graph. A block can
    be a source with only output ports, a sink with just input ports, or a block with
    both inputs and outputs. The GNU Radio supports many signal processing blocks
    and a number of waveforms. Blocks include finite impulse response (FIR) and fast
    Fourier transform (FFT) filters, simple arithmetic operations, complex number
    processing and transformations, frequency translation, waveform-specific techniques
    [12], and timing synchronization blocks [13, 14, 15, 16].


    In GNU Radio, each separate signal processing block is implemented in C++ and
    gets into a library. Python, a high-level programming language (www.python.org)
    is then used as an interface to connect the signal processing blocks the C++ library
    together. This is performed by “wrapping” the C++ library into a Python module
    so that Python can call the C++ functions through the “wrapper.” Blocks are connected
    to build a flow graph, an architectural construct that represents the flow of
    samples through the radio. Blocks can be connected in a hierarchical fashion as
    well, which allows us to build blocks of more specialized processing capabilities
    out of smaller, more general blocks. Recently, the project has allowed all these
    capabilities to be done in a full C++ environment, so that all GNU Radio functionality
    is accessible either a C++ or a Python project. The move to all C++ allows more
    traditional workspace development of waveforms, applications, and embedded systems.


    # 3.4.1 The Universal Software Peripheral


    A software-only SDR does little actual radio communications without a means to
    get and from the radio frequency (RF) domain. A device is required to convert
    between the analog, RF domain and the digital, software world. These devices are
