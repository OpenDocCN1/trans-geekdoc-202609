- pgno: 107
  md: '# Genetic Algorithms for Radio Optimization 93


    As discussed in Section 4.4, there are many different methods for developing an
    optimization function that provides a ranking method, and therefore the ability
    in the algorithm to select one individual solution. For the experiments we wish
    to present, we first normalize the credit values returned from the fitness functions.
    The normalization is done by keeping track of the maximum value any objective
    receives throughout the generations. We then use the weights of the objective
    functions as preference factors in a simple linear-logarithmic utility function
    of (5.2).


    ```

    $f = \sum_{i=1}^{N_O} w_i \ln \left(\frac{c_i}{\lambda_i}\right) \quad (5.2)$

    ```


    This equation calculates the fitness of an individual over $N_O$ objectives where
    each objective has a credit score, $c_i$, a preference weight, $w_i$, and a normalization
    factor, $\lambda_i$. The individual with the maximum fitness, $f$, is selected
    as the solution of the algorithm for implementation on the radio.


    This sets up the design of the cognitive engine''s WSGA. Chapter 8 provides examples
    of this in operation, after the rest of the cognitive engine is designed.


    # 5.5 Conclusions


    With the multiobjective waveform optimization problem as well as the range of
    possible knobs and meters available on a radio platform, the genetic algorithm
    is a solution to both effective optimization and generic representation to make
    it an excellent choice to use for cognitive work. In this chapter, we presented
    the basics of what makes the GA such a powerful search and optimization tool as
    well as explained how it was developed for the cognitive radio problems. The particular
    aspects of the GA implementation include the generic representation and definition
    of the chromosomes allow it to operate on different systems, the equally flexible
    definition and implementation of the objective functions, and methodology behind
    performing the GA operations and making selections. As discussed, advances remain
    to be made in the evaluation functions as the relationships are better understood
    and developed. In Chapter 8, we show both the successful implementation of the
    WSGA as well as discuss the symptoms of the performance that some of the advancements
    could correct. Before presenting the operational cognitive engine or WSGA, the
    next couple of chapters finish the necessary theory and design work required for
    the full cognitive engine.'
