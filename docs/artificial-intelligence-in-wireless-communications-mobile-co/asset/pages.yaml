  md: '# 4.2.8 Computational Complexity


    Dependencies


    Knobs: modulation type, symbol rate


    Meters: none


    Objectives: none


    Definitions


    $k =$ number of bits per symbol

    $R_s = $ symbol rate (sps)


    The second way to analyze power is to measure it in terms of power consumption
    by a radio. Each waveform consumes a certain amount of power that depends on the
    processes required to transmit and receive information correctly. For example,
    noncoherent reception requires less processing power than a coherent receiver,
    including the transmitter and phase correction, and faster symbols require faster
    processing speed, and therefore more power. The total power consumed includes
    all aspects of the transmitter and receiver of a waveform, including the transmitter
    power. However, the last objective in Section 4.2.7 takes care of that in its
    own way so that this second objective does not need to account for it.


    As we deal with SDR technology, power consumption maps directly to the computational
    complexity of an algorithm. The mapping between these is not straightforward,
    especially given the low-power states and techniques available in most processors
    and hardware. Furthermore, different processors and implementations of the same
    waveform may consume different amounts of power. Unfortunately, a generalized
    solution or straightforward mathematical equation to understand or model the power
    consumption does not exist.


    To solve this problem, we are forced to analyze the power consumption in terms
    of strict computational complexity of the known SDR modes. That is, break each
    piece of waveform down to its components, figure out the computational resources
    required to run those components, and then put together a lookup table for a given
    waveform''s power requirements. Luckily, the task is simpler than trying to measure
    all possible waveforms since the great majority of the differences exist within
    the modulator and demodulator. These discrete values are easily calculated and
    used in a database for use by the optimizer. The computational analysis for the
    GNU Radio modulators used here is presented in Appendix C.'
