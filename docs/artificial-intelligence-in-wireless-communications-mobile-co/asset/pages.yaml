    Bit error rate (BER) is an important objective for all digital communications
    needs. It provides a baseline for the amount of information transferred, and so
    understanding it in light of the design of a waveform under certain channel conditions
    is therefore necessary. Unfortunately, BER calculations depend heavily on the
    type of channel and type of modulation, and so the cognitive engine must know
    the formula for each modulation type the radio is capable of using and the channel
    types it is likely to see during operation. In this section, we present a number
    of bit error rates that have been programmed into the cognitive engine.


    To predict the BER of a waveform under a given set of conditions, the cognitive
    engine requires knowledge of certain environmental conditions. All BER calculations
    depend fundamentally on the signal-to-noise ratio (SNR) at the receiver. When
    calculating the BER, however, the cognitive engine does so knowing the transmitter
    power as a knob it can set. The cognitive engine therefore requires an estimate
    of noise power at the receiver and received power due to path loss. Furthermore,
    since noise power change with the channel bandwidth, the cognitive engine must
    estimate the noise floor for use in the calculation of the noise power given the
    bandwidth. With this knowledge, the cognitive engine, knowing the transmitted
    power, the path loss, and the noise floor, can estimate the received power and
    noise power for the BER calculation. The cognitive engine will also require an
    understanding of the type of channel. For the purposes of this work, we focus
    on additive Gaussian noise (AWGN) channels, Rayleigh, Ricean, and Nakagami-m fading
    channels as well as in Appendix B. This decision to use AWGN channels has made
    largely necessary because we do not have a sensor available in the cognitive engine
    that can determine the channel type, though there are methods of doing this as
    well as using impulse response for the estimation of BER [12]. AWGN channels also
    provide more mathematically simple channels to perform simulations and calculations,
    and so it provides us with an understanding of the optimization behavior in a
    well-known channel.


    Another part of these BER calculations is the effect of an interferer. It is not
    a simple matter of using SINR instead of SNR in the BER calculations since the
    BER equations depend on the noise power having a Gaussian distribution while interference
    power does not. The inclusion of interference power is complicated and depends
    on the types of signals in'
