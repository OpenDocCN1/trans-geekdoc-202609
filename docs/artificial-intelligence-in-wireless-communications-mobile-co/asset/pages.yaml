    research is ongoing to fully solve this problem. The cognitive engine we discuss
    will provide the platform by which this problem can be addressed and more fully
    understood.


    # 4.5 Conclusion


    In this chapter, we discussed the concept of multiobjective optimization, both
    from the theoretical perspectives and regarding the use of this type of analysis
    to optimize waveforms for a cognitive radio. We only presented a subset of potential
    objectives we could ask the cognitive radio to meet. New objective analysis can
    enhance the behavior of the cognitive engine by providing more information from
    which to make its decisions. Work in this field is already developing useful objective
    functions. A good example of this kind of work is Marshall [27] who analyzes intermodulation
    as a metric for freeing free spectrum to use for communicating.


    While discussing the possible objectives and defining the mathematical basis for
    the multiobjective analysis, we point out that improvements in the mathematics
    may lead to better solutions as they represent the problem space. This leads to
    a bigger question of mathematical modeling and uncertainty in cognitive radio
    systems: how much information is required to make a good decision? Likewise, how
    much gain comes from more complex analysis? These are interesting research questions
    beyond the scope of this book, which aim providing the basic method of analysis
    and methodology required to perform full waveform optimization in a cognitive
    radio.


    The next chapter deals with the use of genetic algorithms to solve the multiobjective
    problem. In it, we provide a mathematical definition and analysis of the Pareto-front
    and Pareto-ranking. We also provide the means by'
