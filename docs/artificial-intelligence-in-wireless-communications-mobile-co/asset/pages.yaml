    # 6.6 Conclusion


    In this chapter, we introduced the concept of using feedback in the optimization
    process to aid future optimizations. We used the concept of case-based decision
    theory as the mechanism for producing the feedback. When one problem is optimized,
    the solution is fed back into a case base that stores the solution, results, and
    problem. When a new problem is received, the decision maker looks for similar
    problems in the case base that exhibit a high utility. The previous solutions
    stored in the case base are then fed to the optimization process. We examined
    how this technique is applied to the cognitive engine to build up and learn from
    experience.


    To demonstrate this we employed the case-based learning system to the simple knapsack
    problem. The results showed an overall performance benefit from the implementation.
    They also showed that there are still significant gains to be made by further
    studying this technique as well as a number of parameters that can be adjusted.
    The case size, as well as the number of cases used to seed the optimization algorithm,
    can be changed for different results. More importantly, the results in this chapter
    showed that the definition of the utility function can have a great impact on
    the performance. We suggest that the similarity function would also produce a
    large performance difference. With the knapsack problem, we only present one similarity
    function that makes sense for this thing, but for more complicated problems, different
    similarity rankings may be possible and must be studied.


    There are advances from this concept beyond these algorithm adjustments. As we
    discussed at the end of this chapter, this method introduces other aspects of
    learning, such as using performance trends to build up confidence or alter behavior.
    This concept offers a number of significant advantages to online optimization
    processes, especially when strict time limits must be imposed. Because of this,
    case-based learning provides significant potential for use with the cognitive
    engine where problems require solutions quickly as situations and environments
    change.


    We will show the results of using case-based learning in the cognitive engine
    in Chapter 8. First, however, we discuss a bit more theory and design'
