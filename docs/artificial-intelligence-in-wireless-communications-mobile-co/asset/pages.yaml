- pgno: 25
  md: '# The Cognitive Engine:

    Artificial Intelligence for Wireless Communications


    For a radio to become cognitive, we have to address many aspects in communications
    and computer science. We will also see how these concepts and their application
    to communications systems require a breadth of understanding of multiple disciplines.
    This makes radio design a very exciting but also a very difficult research topic
    to study. Our intention in this chapter is to leap directly into the core framework
    of cognitive radio design before pulling back the big picture in subsequent chapters
    to some of the fundamental areas of research.


    From our definition in Chapter 1, a cognitive radio is the application of intelligent
    processing and adaptation to a wireless communications system. We implement this
    as a processing engine to translate observations about the environment to action.
    We call this part of the radio *cognitive engine*. In this chapter, we describe
    the function of a cognitive engine as well as the design of the cognitive engine
    we have developed. The description and development of the cognitive engine leads
    to a more general treatment of the use of learning techniques and artificial intelligence
    in wireless communications systems at the end of the chapter.


    The cognitive engine (CE) is the intelligent core of the system described by Figure
    1.2. Its design serves two simultaneous objectives:


    +   1. Develop and apply cognitive radio algorithms;

    2. Deploy cognitive radio functionality.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# Artificial Intelligence in Wireless Communications


    ![](img/7780d97a7979a9fac4a1941139511cc9_26_0.png)


    **Figure 2.1** The cognition cycle with an outer loop for observation and optimization
    and inner loop for learning.


    In particular, the actions of a cognitive radio (CR) follow the cognition cycle
    first proposed by Mitola [1]: observe, orient, plan, decide, learn, and act. A
    revision of the cognition cycle, published in a similar format in [2], is shown
    in Figure 2.1. This figure simplifies the actions of Mitola''s loop and provides
    a system close to a real implementation. In a way, it is a more detailed version
    of the AI agent of Figure 1.2. The radio platform provides both the input to the
    sensors and receives controls from the actuators. The sensors are labeled here
    as environment observations and cover a number of domains of information useful
    for a cognitive radio. The sensors pass the information on the rest of the cognitive
    engine, which is a mixture of modeling, optimization, and learning algorithms.
    The outer loop contains a more straightforward synthesis of optimized waveforms
    while the inner loop provides long-term learning and reasoning abilities. The
    results of the cognitive engine are then used to control the radio by applying
    knobs to create new waveforms. We use the theoretical aspects of this cognition
    loop to develop the waveform engine architecture through this chapter.


    # ## 2 Cognitive Radio Design


    A cognitive radio is a flexible and intelligent radio capable of creating any
    waveform and using any protocol supported by the radio hardware and software.
    Waveforms consist of all of the parameters that define the way in which the radio
    transmits and receives information, including transmitter power, operating frequency,
    modulation, pulse shape, symbol rate, coding, and so forth. Protocols are the
    rules by which network nodes transfer information.'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# The Cognitive Engine: Artificial Intelligence for Wireless Communications


    A cognitive radio develops waveforms and chooses protocols in real-time using
    artificial intelligence. These actions require three components:


    +   1. Perception: Sensors that collect data on both external factors (channel
    conditions, other radios, regulations, user needs) and internal factors (waveform
    capabilities, available computational resources, remaining battery power).

    2. Conception: An intelligent core that learns and understands how to combine
    knowledge from the sensing mechanism to aid the adaptation mechanism.

    3. Execution: An optimization and adaptation mechanism that alters the radio''s
    behavior.


    Figure 2.2 presents a generic architecture for a cognitive radio. The cognitive
    engine is a separate entity within that radio that works alongside the normal
    communications path. The engine relies on information from the user, radio, and
    policy domains for instructions on how to control the communication system. This
    structure works well as a generalized architecture as it makes no recommendations
    about how the cognitive engine (and therefore the rest of the cognitive radio)
    should behave while still mapping the interactions of the rest of the systems.
    The communications module appears as a simplified protocol stack, again showing
    the independence of the cognitive engine from the overall system.


    Figure 2.2 shows three input domains that concern the cognitive radio. The user
    domain tells the cognitive engine performance requirements of services and applications.
    Service and application requirements are related to the quality of service measures
    of a communications system. As each application requires different QoS concepts
    like speed and latency, this domain sets the performance goals of the radio.


    The external environment and RF channel provide environmental context to the radio''s
    transmission and reception behavior. Different propagation environments cause
    changes in the performance of waveforms that correspond to optimal receiver architectures.
    A heavy multipath environment requires a more complex receiver than line-of-sight
    propagation or log-normal fading. The external radio environment also plays a
    significant role in performance and adaptation. This informational helps provide
    optimization boundaries on the decision-making and waveform development.


    Finally, the policy domain restricts the system to working within the boundaries
    and limitations set by the regulatory bodies as interpreted by the policy engine.
    The policy environment might determine a maximum amount of power of a radio can
    use in a given spectrum or other spectrum rights with respect to other users,
    as was done in the 700-MHz band recently auctioned by'
