    raised cosine (RRC) pulse shaping.


    # 3.4.4 Parallel Programming in GNU Radio


    Another advantage in GNU Radio is to take advantage of the multicore and other
    parallel processing systems that have become the mainstream in processors. The
    original flow graph scheduler in GNU Radio was a single-thread per flow graph.
    Blocks in the flow graph were flattened into a one-dimension graph from sources
    to sinks and each block was sequentially run.


    GNU Radio blocks operate on chunks of data to where large blocks are passed around
    memory. This is important to reduce memory and access overhead. Under this condition,
    it is easy to see how multiple blocks could run simultaneously in a flow graph.
    While one block is processing its chunk of data, the previous block in the graph
    is processing the next chunk of data.


    A multithreaded scheduler is now available in GNU Radio, currently implemented
    as a thread-per-block model, where each block runs in its own thread as name might
    suggest. When the processing resources are available, each thread is loaded into
    its processor core. In tests, Blossom [20] shows a near-linear improvement in
    the speed of processing. He also points out in this paper the need to balance
    the load among the threads. There is overhead in context-switching if running
    multiple threads on a processor as well as passing data along a bus between processors.
    Each block must then process enough data to overcome this overhead. Threads should
    also take about the same amount of time to process their chunks of data so that
    they are not waiting on other blocks in the system to finish. This is not currently
    considered in the thread-per-block model because each block'
