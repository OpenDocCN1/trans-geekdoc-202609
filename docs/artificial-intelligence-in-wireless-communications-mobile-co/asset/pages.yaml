  md: '![](img/7780d97a7979a9fac4a1941139511cc9_211_0.png)


    **Figure F.1** Estimated SINR with no interference power.


    the next simulation, both the signal and noise power are kept the same while the
    interference amplitude is adjusted from 0 to 1 V peak-to-peak. The SNR of the
    AWGN channel was set to 20 dB and the simulations are averaged 100 times for each
    interference amplitude setting. Figure F.2 shows the estimates of the SINR, which
    starts at 0 dB when the interference is not present and slopes downward to about
    0 dB when the signal power of the interference is the same as the signal power
    of the transmitter. Figure F.3 shows the estimation of the signal power, which
    remains relatively constant for any power of interference. The standard deviation
    shows the estimates are within about 1 dB from the actual value when the interference
    power is at its highest. These simulation results show that this type of sensor
    will properly provide the cognitive engine with the required estimates of the
    signal, interference, and noise powers.'
