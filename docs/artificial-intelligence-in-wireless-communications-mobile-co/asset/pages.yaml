  md: '# C


    # OProfile and Results of Profiling

    GNU Radio


    # C.1 Introduction to OProfile


    OProfile is an open source, GPL tool for measuring software performance

    [1]. Built specifically for Linux, OProfile uses the Linux kernel to read the

    processor''s hardware counters as a measure of software complexity. It has

    low overhead on the system and resides as a separate process to monitor the

    performance of the entire system, which means a developer does not have to

    add specific hooks to enable profiling as other profilers require. As the website

    points out, the profilers monitor all system activity including “hardware and

    software interrupt handlers, kernel modules, shared libraries, and

    applications.” More importantly to application and library developers, the

    profiler keeps track of performance per symbol of each process, which means

    a developer can analyze the performance of individual functions and routines

    within the code. We use this last feature to understand the complexity of each

    t modulators used in the GNU Radio.


    # C.2 OProfile Results of GNU Radio Modulators


    Each block in a GNU Radio flow graph is a class in the GNU Radio library.

    Each class has a few callable functions, most important of which is the work

    function that performs the core of the signal processing. The interest in the

    profiling is discussed in Section 4.2.8 where the optimization process uses

    the computational complexity. In the analysis, the only blocks that change

    in the GNU Radio flow graph with the waveforms are the blocks that make

    up the modulators and demodulators. The rest of the blocks remain the same'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'with different parameters; however, the computational performance remains the
    same when changing the transmitter power or carrier frequency. The only other
    performance difference results in changes in the symbol rate, which has an overall
    effect on each block as the sampling rate changes. Therefore, the performance
    profiling only looks at the blocks that make up the modulators and demodulators.


    The performance analysis consists of running a GNU Radio simulation with just
    the modulator or demodulator the required sinks and sources to pass a set of symbols
    at the same symbol rate through the flow graph while running OProfile. Figure
    C.1(a) shows the GNU flow graph of the modulator simulation and Figure C.1(b)
    shows the same for the demodulators. The profiler collects the number of ticks
    of the processor hardware counter during the set of symbols to measure how much
    time each modulator and demodulator uses. Table C.1 shows an example of the profiler.


    ![](img/7780d97a7979a9fac4a1941139511cc9_188_0.png)


    (a) Modulators take in bits and produce complex symbols.


    ![](img/7780d97a7979a9fac4a1941139511cc9_188_1.png)


    (b) Demodulators take in complex symbols and produce bits.


    **Figure C.1** Flow graphs for profiling GNU Radio (a) modulators and (b) demodulators.


    Notice that each time a simulation is run, the performance counters had slight
    variations despite running with the same code, same number of symbols, and on
    the same platform. The system this was run on also runs other programs along with
    the profiler and GNU Radio. Furthermore, there are loops and branches in the software
    that depend on the value of the data, which is influenced by the random noise
    of the channel and will affect the performance. These issues together with other
    operating system factors are the probable causes of any variations among profiling
    runs. These should be statistically insignificant, and so each simulation is run
    ten times and averaged.'
  merge: -1
