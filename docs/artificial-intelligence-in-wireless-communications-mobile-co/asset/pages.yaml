    $P_T = \text{transmit power} (dBm)$


    There are two ways to look at power as a resource. The first way is to think about
    power in terms of how the radio transmitter uses the external power in the spectrum.
    In this manner of speaking, power is a shared resource by all radio nodes, so
    radios should strive to reduce their transmission power. This objective balances
    efforts to reduce BER or maximize SINR. The transmitted power we use refers to
    the power of the signal sent to the antenna. In all of the calculations here,
    though, we have assumed EIRP such as when calculating the received power for the
    BER equations. In these calculations, we assume a 0-dB gain antenna, so the two
    are the same. The assumption is based on the lack of the antenna as a knob or
