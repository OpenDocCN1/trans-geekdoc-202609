  md: '# 5 Genetic Algorithms for Radio Optimization


    In Chapter 4, we presented waveform optimization as a multiobjective problem.
    While most genetic and evolutionary algorithms are not the only means of solving
    multiobjective problems, they have continuously proven themselves to excel in
    this respect [1]. The application of genetic algorithms to multiobjective problems
    has been the focus of a large part of the research literature, as evident in Genetic
    and Evolutionary Computation Conference (GECCO) [2]. We use genetic algorithms
    because of their robust search and optimization capabilities as well as their
    flexibility in representing the search space and search parameters. Without reproducing
    the entire body of knowledge on the subject, which we leave to the classic text
    of Goldberg [3] or the proceedings of GECCO, we start this chapter with a brief
    introduction to genetic algorithm implementation with a small well-known example.
    We then present the methods used in the use of genetic algorithms on waveform
    optimization. Much of this chapter also appears in some of our other published
    work in [4, 5].


    # 5.1 A Brief Review


    In their most simplistic form, genetic algorithms (GA) are single-objective search
    and optimization algorithms. Common to all GAs are the chromosome definition that
    determines how the data is represented, the genetic operations of crossover and
    mutation, the selection mechanism for choosing the chromosomes that will survive
    from generation to generation, and the evaluation function used to determine the
    fitness of a chromosome. All of these operations are described in [3].'
  merge: -1
  img_proc: true
- pgno: 92
  md: 'A genetic algorithm encodes a set of input parameters that represent possible
    solutions into a chromosome. The evaluation stage calculates a ranking metric
    of fitness for each individual, which then determines their survival to the next
    generation. Optimization progresses through finding genes that provide higher
    fitness for the chromosome in which it is found. The fitness calculation is often
    done through some absolute metric such as cost, weight, or value by which the
    algorithm can rank the success of an individual. Selection is the technique by
    which fit individuals are chosen to survive and reproduce for the next generation
    while less fit chromosomes are killed off. An algorithm terminates when it reaches
    a desired level of fitness in the population, a single member exceeds a fitness,
    the fitness plateaus for a number of generations, or through a simple criteria
    based on a maximum number of generations. The algorithm then takes the most fit
    individual of the last generation as the solution.


    To understand each of these concepts clearly, we describe a genetic algorithm
    that solves the knapsack problem.


    # 5.2 Simple Example: The Knapsack Problem


    To explain the operation of a simple GA, we examine the knapsack problem [6],
    which is a classic NP-complete problem [7] and also called the subset problem
    (SSP). The knapsack problem takes a set of items, each with a weight and profit,
    and tries to fit as many of these items into the knapsack to maximize the profit
    without exceeding the maximum weight the knapsack can hold. Mathematically, the
    knapsack problem is represented by (5.1) where the goal is to maximize the profit,
    $P$, of items in the knapsack. The problem statement includes $K$ as the maximum
    weight the knapsack can hold and $N_s$ as the number of items in the set, $S$.
    Items in the knapsack have a weight vector, $\vec{w}$, a profit vector, $\vec{p}$,
    and the vector $\vec{x}$ is used to show whether an item is present or not in
    the knapsack. The values $w_i$ represent the weight and profit of item $i$, and
    the knapsack vector $x_i$ is a 1 if the item is included in the knapsack and a
    0 if not.


    ```

    $P = \max_{i=1}^{N} x_i p_i \quad (5.1)$

    ```


    ```

    subject to: $\sum_{i=1}^{N} x_i w_i \leq K$

    ```


    Chromosome: The problem consists of choosing the right set of items to place in
    the knapsack, so the chromosome represents the vector $x$ and consists'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'Of 1s and 0s, as shown in Figure 5.1, where a 1 indicates that the item is
    present in the knapsack and 0 indicates that the item is absent.


    | X0 | X1 | X2 | . . . | XNs-1 |


    **Figure 5.1** Chromosome representation of knapsack item vector.


    **Selection:** Parents are selected on their fitness in the population, usually
    with some randomness to allow less fit individuals a chance of survival. The theory
    is based on Holland''s original work on the subject [8] where schema defines discrete
    sections of chromosomes. An overall chromosome may still include one or two highly
    fit schema, preserving some of these and allowing them to create offspring gives
    those schema to form a much more fit chromosome in the next generation. Parents
    carrying their genes to the next generation provide exploitation of current genes
    while allowing unfit members and random schema into the generational mix provides
    exploration of the search space. These two concepts define the search capabilities.
    Good exploitation will converge quickly to a solution, but the solution may be
    in a local optimum. Exploration using random genes searches wider and farther
    in the search space, but this can slow convergence. Balancing out how selection
    takes place as well as properties such as the number of to kill a generation affects
    the performance of the algorithm but are likewise dependent on the problem space.
    De Jong [9] analyzed selection methods in his doctoral dissertation to provide
    more understanding of this affect.


    For the knapsack problem, we use the standard roulette selection technique. Goldberg
    [3], again, is the source for the basics. In we will say few words here to explain
    the basics. In the roulette selection, the fitness values of all chromosomes are
    normalized such that the sum of the fitness of the population is 1.0. We then
    imagine putting the fitness values on a roulette wheel in no particular order.
    The selection method calculates a uniformly random number from 0 to 1. Summing
    the values clockwise from the top of the wheel, the point where the random falls
    falls to the chromosome selected. Figure 5.2 illustrates the technique where several
    individuals have fitness values of 0.15, 0.30, 0.20, 0.25, 0.07, and 0.03. A random
    value of 0.61 is created as the ranking metric, which lies in the individual with
    fitness 0.20 as this wheel is shown. The chromosome selected from the roulette
    wheel is biased towards individuals with large fitness values, but the randomness
    allows the possibility that any individual can be selected.'
