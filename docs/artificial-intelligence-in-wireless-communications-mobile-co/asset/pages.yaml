- pgno: 181
  md: '# Analysis of GNU Radio Simulation


    ![](img/7780d97a7979a9fac4a1941139511cc9_181_0.png)


    Figure A.7 BER curves and $E_b/N_0$ plots for GMSK.


    The BER simulations for BPSK, QPSK, DBPSK, and DQPSK all matched very well to
    the theoretical curves. The 8PSK curve matches well for $E_b/N_0$ above 2 dB.
    For low $E_b/N_0$ values, it is possible that the synchronization loops or some
    other part of the receiver chain failed. The D8PSK curve looks consistent over
    the plotted $E_b/N_0$, but without a reference curve, it is difficult to show
    how well it compares to others. The plotted curve in Figure A.6 shows the D8PSK
    simulated curve is about 2 to 3 dB worse in performance than the theoretical 8PSK
    curve, which is about the correct loss between differential and nondifferential
    modulations. The GMSK curve performs like the 8PSK curve where the system has
    poor performance under $E_b/N_0$ conditions, although this behavior lasts up to
    about 7.5 dB. After that, the simulated curve is about 1 dB better than the theoretical
    curve.


    It is not the purpose of this analysis to provide the best performance for each
    of these modulation schemes. In this case, we are simply interested in the known
    baseline performance for the system under. The performance provides an interesting
    problem for the combined optimization and learning system. The optimization routine
    assumes the theoretical performance of the given waveforms, so the learning system
    has to understand the difference between the estimated performance and the actual
    performance to help the optimizer to make better, more educated choices.'
