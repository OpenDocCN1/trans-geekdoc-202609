  md: '# 2.5.3 Fuzzy Logic


    Fuzzy logic is a famous technique that started during the early development of
    artificial intelligence [29, 30]. Because it deals extensively with uncertainty
    in decision making and analysis, it has great potential for application to cognitive
    radio. However, only a little has so far been published in the field, notably
    by Baldo and Zorzi [31]. Their implementation suggests some interesting applications,
    and the discussion points out larger than the specific application of adapting
    the TCP layer used in the paper. A problematic aspect of this work is the amount
    of domain-specific rules required. All implementations of AI require must establish
    a rule related to the specific situation in which it is used. Programming these
    rules recalls some of the limitations of expert systems, although fuzzy logic
    is still far more flexible and powerful. Fuzzy logic has potential in each specific
    problem solving areas or as a part of a cognitive radio


    # 2.5.4 Evolutionary Algorithms


    Along with Christian Ries, we pioneered the use of genetic algorithms [32, 33]
    early in cognitive radio research [34, 35, 36], which this work extends. The basic
    principles, as discussed throughout, are that the large search space involved
    in optimizing a radio is more complex than many search and optimization algorithms
    can handle. Among those that are suited to the task, evolutionary, specifically,
    algorithms offer a significant amount of power and flexibility. Cognitive radios
    are likely to face dynamic environments and situations as well as radio upgrades
    due to advancing technology, so the flexible representation of the problem space
    allowed genetic algorithms are particularly applicable.


    More recently, Newman et al. [37] have also contributed significantly to the use
    of genetic algorithms for cognitive radios. As we discuss in Chapters 4 and 5,
    one of the main issues involved in successful genetic algorithm behavior is the
    selection of the fitness, or objective, function(s). Newman''s work has developed
    a single, linear objective function to combine the objectives of BER minimization,
    power minimization, and throughput maximization.


    # 2.5.5 Case-Based Reasoning


    The final traditional AI technique to discuss here is case-based reasoning (CBR)
    [39]. CBR systems use past knowledge to learn and improve future actions. In these
    systems, a case base stores actions and receives inputs from'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# The Cognitive Engine: Artificial Intelligence for Wireless Communications
    29


    a sensor. Those inputs help find the action in the case that best fits the information
    received by the sensor. As mentioned previously, an optimization routine could,
    instead of designing a new waveform, select a waveform from a predefined list.
    CBR is a method used to make the associations. Although this might sound like
    an expert system, CBR systems generally provide learning and feedback to continuously
    and autonomously improve their performance. As information is revealed and actions
    taken, the results can help the system improve its response next time.


    Another contribution from Newman et al. [37] develops a similar idea in the experiments
    they ran using previous knowledge to select the next run of the genetic algorithm.
    The cognitive radio remembers solutions for one particular problem to apply to
    the next problem to initialize the population with successful chromosomes. The
    chromosome seeding in [37] resembles the case-based decision theory work presented
    in Chapter 6. Their seeding concept uses a factor to calculate the expected change
    in the environment between runs of the genetic algorithm to provide context for
    how successful a new chromosome might be with respect to the new environment.
    We will show later how the case-based work extends this idea by keeping a set
    of previously observed cases and finding which case best matches the current environment
    as assuming certain changes in the environment.


    # 2.6 Conclusions


    In this chapter, we introduced the concept of the cognitive engine and began to
    show the implementation we developed to realize the structure in an extensible,
    flexible platform. The major components of the platform include sensors, optimizer,
    decision maker, policy engine, radio framework, and the user interface. The discussion
    of this chapter focused mostly on defining the roles and responsibilities of each
    component to provide the context with to build a cognitive radio. From this initial
    discussion, we now begin developing the theory that enables the different parts
    of the engine. We will revisit the engine''s design in much greater detail.


    To realize a cognitive radio, AI provides many viable techniques and tools. We
    have discussed many of these techniques with a brief literature review of each
    as related to their application in cognitive radio. In later chapters, we use
    and develop these ideas more deeply in the design of the cognitive engine framework
    presented here.


    Our works deals largely in the optimization routine in Chapters 4 and 5 and on
    the decision maker and learning routine in Chapter 6. From this introduction to
    the cognitive radio and cognitive engine, the next chapter'
