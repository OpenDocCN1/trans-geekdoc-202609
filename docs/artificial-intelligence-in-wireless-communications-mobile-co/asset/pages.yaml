  md: 'with a slight dip in the complexity of the DQPSK over DBPSK. In the implementation,
    the only difference between the differential modulators and the nondifferential
    modulators is a single block that performs the differential mapping, so the differential
    modulators should be more complex. Between the different modulators, the only
    change when increasing $M$ is the block that maps the $\log_2(M)$ to complex symbols
    via a lookup table. Apparently, the lookup table is slightly more efficient, though
    hardly significantly, in the DQPSK case than DBPSK.


    The modulators show more interesting behavior. The demapping is done by brute-force
    matching the incoming complex signal to the nearest point by calculating the minimum
    Euclidean distance. As $M$ increases, the modulator, the only difference between
    the differential and nondifferential modulator, increases as the loop has more
    points to test. Like the modulator, although there are more efficient receivers
    that do not rely on the same complex synchronization loops for differential modulations,
    the receiver implementation in GNU Radio does not currently take advantage of
    them.


    Table C.2 shows the same information in table format similar to the database used
    in the cognitive engine''s optimization calculation. In this table, the modulators
    and demodulators are mixed together to form the overall complexity of selecting
