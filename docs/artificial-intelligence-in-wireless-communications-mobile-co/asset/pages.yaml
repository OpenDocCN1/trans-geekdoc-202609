  md: '# # 4


    # ## Optimization of Radio Resources


    As shown in the previous chapter, a cognitive radio uses AI to adapt and optimize
    the performance of a radio platform, specifically an SDR. In this chapter, we
    explain the concepts of radio resource optimization with a particular interest
    in understanding the physical layer in terms of a set of objective functions.
    This discussion establishes a way of thinking about how to optimize certain objectives.
    Although this chapter includes only a subset of the total possible objectives
    along with some basic approximations, the development should provide the fundamentals
    that will enable further extension and enhancement as more information and capabilities
    arise.


    # ## 4.1 Objective Space


    As in any problem, we first have to define the vocabulary. In optimization problems,
    this vocabulary is the objective space, which is the set of all possible solutions
    to a problem, often over a multidimensional set of objective functions. The cognitive
    radio objective space describes the radio resources that determine radio behavior.


    A radio consumes resources while communicating, thereby depriving other radios
    access to those same resources. Spectrum is the key communications resource. Economically
    speaking, spectrum is a reusable resource after one radio is consuming the spectrum,
    it is still available for other radios to use. In fact, radios can share spectrum
    in space, time, transmit power, and other methods that allow signals to coexist
    on the same frequencies. Spectrum sharing and reuse is accomplished through numerous
    techniques such as spatial distribution in cellular infrastructures or beam-forming
    antennas [1]. Standard practices like time division multiple access (TDMA) and
    frequency division multiple access (FDMA) allow sharing-'
