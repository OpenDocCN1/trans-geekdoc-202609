  md: 'Example Cognitive Engine 155


    Unfortunately, it is difficult to capture the real performance of the system online
    except for providing example cases. The important lesson of this experience is
    the ability of the cognitive engine to move from the simulation environment that
    can be used to more adequately understand the behavior and operation of the engine
    to the online system using real radio hardware. The flexible and extensible cognitive
    engine has been shown through these experiments.


    # 8.6 Conclusions


    We demonstrated the use of the cognitive engine operating in both a simulation
    and a real-world demonstration. The modular component structure of the cognitive
    engine enables designers to build new components for different purposes. In the
    simulation environment, a simple component allows the interface between the cognitive
    engine and the radio simulation platform. It also connects the PSD and meters
    sensors that communicate with the simulation to collect the data and pass to the
    cognitive engine. In the online version, the components were replaced with others
    that enable communications with real radio systems. As we discussed in this chapter,
    incorrect information can have a significant effect on the cognitive engine''s
    performance, such as the logic error in the PSD sensor or the miscalculation of
    the SNR in the presence of interferers with the meters sensor. The component structure
    makes unit testing of each of these pieces simple in order to work out bugs, and
    components are easily replaced when better versions are available.


    Although it is difficult to show the performance of the cognitive engine, we worked
    through some simple examples to understand the general trends of the optimization
    process. Early simulations showed how the cognitive engine optimizes for such
    objectives as BER and power performance. Later examples that use many more objectives
    the analysis much more difficult in determining the performance by looking at
    each individual objective. In these cases, the multiobjective Pareto front surface
    is the important measure, but difficult to illustrate. Instead, we showed some
    performance results and waveforms produced under certain objectives. The first
    results showed that the cognitive engine can successfully optimize waveforms given
    performance requirements. Also, many lessons can be learned from these results
    and the performance plots. We discussed some of the issues regarding poor information
    received from the sensors and pointed out where some advanced topics in the genetic
    algorithm design and optimization would be useful.


    The system demonstrated in this chapter is the culmination of the theory and discussions
    of the preceding chapters. While much of the theory comes'
