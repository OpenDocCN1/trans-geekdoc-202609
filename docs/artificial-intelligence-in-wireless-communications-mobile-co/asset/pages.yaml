- pgno: 68
  md: 'and reuse in time and frequency domains, respectively. DSA technology is developing
    to provide intelligent schemes that use spectrum during times when its primary
    occupants are silent [2]. Concepts such as an ultrawideband underlay and interference
    temperature are all methods that manage transmit power to allow coexistence with
    other radio systems [3, 4]. Finally, transmitting orthogonal signals like direct
    sequence spread spectrum (DSSS) reduce interference between signals occupying
    the same time. The task is to properly use the resources to provide appropriate
    sharing among all radios while maintaining the proper level of QoS.


    Each user has a different and subjective perspective on quality of service based
    on the radio performance. A radio may require high data rates, low latency, or
    low battery life depending on the situation for he or she is using the radio service.
    Video conferencing requires high data rates and low latency, while voice calls
    require low latency but have significantly relaxed requirements for average throughput.
    On the other hand, checking stock prices or even man has requirements for speed.
    Long journeys without access to a power source would increase a preference for
    low power consumption and longer up-time.


    Each node in a network can look at resource allocation as an problem with two
    potential goals. First, it can attempt to optimize its ability to communicate
    by maximizing its use of resources; this would be a greedy approach. The other
    way is to look at resource utilization from a needs perspective; that is, resources
    are sought to support the needs of the service. Using more resources is wasteful
    while using less reduces the quality of service. Resource allocation on either
    side of what is required is inefficient. Of course, there is a third way of looking
    at resource allocation, and this is to look at a global perspective where the
    utilization of resources by all nodes is taken into account [5]. While there is
    significant benefit to this approach, the argument we present here comes down
    to the personal perspectives on the quality of service offered, which is therefore
    to see how the radios use the resources to provide the QoS desired by the user.
    By maintaining the balance between the use of resources to provide the QoS as
    well as avoiding overuse of, a cognitive radio provides users with proper service
    while minimizing resource consumption and so allowing theirs share of the resources.


    Another way to look at this is to consider the objective analysis of resources.
    If a service requires high data rates, low bit error rates, and low latency keeps
    an eye on the power consumed by the radio while using a particular waveform, the
    radio has the potential to balance these requirements and design a waveform that
