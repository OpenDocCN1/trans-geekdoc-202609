    Another popular AI technique is the expert system. Expert systems have been successful
    in some applications, particularly early in the development of AI, such as the
    DENDRAL project in organic chemistry [16]. Mitola addresses the concept of expert
    systems at length in his dissertation on cognitive radio [17] in which he mentions
    the ideas of “knowledge-engineering bottlenecks and software of limited flexibility.”
    The bottlenecks occur due to the need for domain experts to define all knowledge,
    action, and behavior of the expert system. This same principle limits any refinement
    of the expert system without further relying on such experts, limiting how flexible
    the system is to new situations and in the face of new constraints and information.
    There may exist limiting cases for the use of expert systems, but it is not an
    independent approach to realizing cognitive radio.


    The next sections highlight different artificial intelligence techniques that
    use information to make knowledgeable decisions in the cognitive radio. As Arthur
    C. Clarke famously said, “any sufficiently advanced technology is indistinguishable
    from magic.” Likewise, it may be true that any sufficiently advanced signal processing
    algorithm is indistinguishable from artificial intelligence.


    # 2.5.1 Neural Networks


    Neural networks are among the oldest form of AI in computer science, starting
    with the mathematical formulation by McCulloch and Pitts [18]. They have come
    and gone as a fad over the decades, but recent advances, both hardware and software,
    enable them in more applications. Of particular importance to cognitive radios,
    neural networks provide a means for signal and modulation detection and classification.


    Chan et al. [19] did some of the early published work on signal classification
    algorithms with decision theoretic and pattern matching. Both methods used time-based
    statistics, and neither proved robust under low SNR conditions. Azzzouz and Nandi
    did some important work on the subject [20] and did some of the early work using
    neural networks as the signal'
