  md: '# #6


    # ## Decision Making with Case-Based Learning


    Decision making is a complex part of the cognitive process design. A cognitive
    radio uses environmental and behavioral information about radio performance or
    user requirements to make decisions on how to adapt. Decisions can include what
    parameters to adapt, if adaptation is required, or the method by which to adapt.
    Our goal in this chapter is to introduce one particular use of decision making
    in cognitive radios: augmenting optimization through past knowledge. Given changes
    in the environment, the decision-making system uses past knowledge to aid the
    genetic algorithm optimization process by providing goals and seeding the population
    to best reach the desired goals. The basics of this concept were first published
    in [1].


    Goldberg introduces the concept of knowledge-based techniques in his book [2].
    Here, he cites the use of knowledge in how people solve problems: humans do not
    develop everything from first principles over and over again. Instead, previous
    knowledge influences and augments current decisions. The discussion tends towards
    the use of previous solutions to enhance the next routine, but this is not Goldberg''s
    use of the technique. Instead, he discusses how understanding the problem domain
    can lead to tailoring the algorithm to solve the problem. His techniques involve
    the use of crossover operations that are specifically tailored to a particular
    problem. He gives an example of using a crossover operation that preserves local
    solutions when solving the traveling salesman problem. Another powerful approach
    is to use a hybrid system of a genetic algorithm along with another algorithm
    that does local optimization. In this approach, the genetic algorithm (GA) converges
    on an area where a solution is likely to exist. Instead of spending generations
    to lock into the highest point in the search area, a local'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'optimization routine takes over to finish the job. This concept works because
    local optimizers generally have well-understood, tractable performance, and they
    lock on optimum points in a local search space quickly. The GA performs the global
    search and the local optimizer finishes it.


    Ramsey and Grefenstette provided an initial analysis of case-based learning for
    genetic algorithm initialization [3]. Their aim was to develop a system that would
    enable what they call anytime learning in changing problem spaces. This goal is
    similar to the online learning of the cognitive engine. Recently, Newman [4] showed
    how previous solutions can improve the performance of waveform optimization. In
    this chapter, we add to research through the discussion and implementation of
    case-based decision theory to illustrate the use of knowledge in solving problems
    with genetic algorithms. We provide an example of this technique and discuss many
    advances case-based systems offer. The use of the technique in the cognitive engine
    is part of the experiments of Chapter 8.


    # 6.1 Case-Based Decision Theory


    Our use of decision-making theory is largely derived from the case-based decision
    theory (CBT) of Gilboa and Schmeidler [5]. CBT uses past knowledge to make decisions
    about future actions. Case-based decision theory is closely related to CBR [6],
    and to avoid confusing semantics between the two techniques, we will generically
    refer to these techniques as case-based learning.


    Formally


    The cognitive radio uses sensors to observe when the environment or user''s needs
    change. This new information is modeled as a new problem, $p$ to be solved by
    the cognitive radio. The sensors can indicate a change in the interference environment,
    a new propagation channel, or a change in the application of the radio requiring
    different QoS needs. The cognitive engine must then determine the action, $a_i$
    with which to respond. The case-based system analyzes the new problem against
    past cases in memory to determine the similarities between the new problem and
    past problems as well as the utility of the past actions. Utility refers to how
    successful an action was at responding to the problem. The action defined by the
    current cognitive engine is the waveform to use in the current situation. As the
    cognitive engine processes and learns, it populates the knowledge base with more
    cases that'
  merge: -1
  img_proc: true
- pgno: 113
  md: '# Decision Making with Case-Based Learning 99


    better reflect the environment to help make better choices. This technique is
    similar to an expert system, but one that learns autonomously.


    A similarity function defines how similar two cases are and represented by (6.1).
    The similarity function is any that provides measure of how close these problems
    are to each other 0 represents no similarity and 1 represents a perfect match.


    ```

    $s : P \times P \rightarrow [0, 1]$

    ```


    The utility analysis of the past cases is represented in (6.2), which is any function
    that produces some real-valued result measuring the utility of the action.


    ```

    $u : R \rightarrow \mathfrak{R}$

    ```


    Case analysis comes down to which case is both most similar to the new problem
    as well how successful the action was in the past. The decision maker then uses
    a final decision to decide which case to use. The simplest implementation is a
    similarity-weighted decision function as shown in (6.3). A particular problem
    may be very similar to previous problems in the case base, but the solution to
    the previous problem might have performed poorly in the past. In this situation,
    a less similar but better performing case is selected instead.


    ```

    $U(a) = s(p, q)u(r) \quad (q, a, r) \in M$

    ```


    This equation is only one function used to make the decision. The challenge of
    this technique is to create effective similarity, utility, and decision functions
    that best represent the types of information received through the sensors. We
    develop this concept further throughout this chapter.


    # 6.2 Cognitive Engine Architecture with CBDT


    The cognitive engine uses case-based decision theory to augment the optimization
    process. Instead of relying on pure optimization alone, the case base helps prime
    and direct the optimization with learned experience. Likewise, instead of basing
    all decisions on past actions from the case base, the optimization process allows
    online learning work together to enable learning and adaptation in the cognitive
    engine.


    The case base holds past cases, actions, and results of the actions. In the cognitive
    radio, the case represents some model of the environment, such as a'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'sequence of meter readings or an interference map. The action for a given case
    is in the form of the waveform created to meet the case’s needs. The results,
    then, are a measurement of how well the action performed.


    To develop the performance measurements, the cognitive engine uses the predicted
    results of the optimization process and analyzes how closely those results match
    to the actual performance of the radio. The optimization process develops the
    waveform based on a set of mathematical models in the form of objective functions.
    The results of the objective functions are calculated performance measures of
    the waveform. When the waveform is used in the environment, the resulting performance
    may differ from the calculated performance. This difference relates to the utility
    of the waveform.


    Figure 6.1 presents the block diagram of the described system. An incoming problem
    is matched against the cases through a similarity function while the case results
    are compared to the radio performance to develop the utility of the case. The
    decision function is an equation like (6.3) that should have similarity and utility
    to properly select the case most representative of the new problem. The results
    are then passed to the optimization process along with the new problem. Both the
    waveform solution and the objective functions’ results are fed back along with
    the problem model to the case base to be stored as a new case.


    ![](img/7780d97a7979a9fac4a1941139511cc9_114_0.png)


    Figure 6.1 Case-based decision theory implementation with optimization process.


    This figure and the discussion about the use of case-based decision theory do
    not focus on any particular optimization process and should be considered a generic
    method for learning and optimization. In our cognitive engine work, the particular
    form of the optimization process is a genetic algorithm.'
  merge: -1
  img_proc: true
