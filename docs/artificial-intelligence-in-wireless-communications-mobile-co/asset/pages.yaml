    # 2.3 Component Descriptions


    The following sections provide more detail about the purpose and design of the
    system components.


    Along with a standard interface to transfer information, the system also requires
    a eXtensible Markup Language (XML) as our method of conveying data and information.
    Using this standard satisfies a couple of competing goals. XML provides a method
    of encoding data that is open, flexible to support new and developing sensors,
    and both human and machine readable. XML also has a standardized format and methods
    of verifying the format, via a document type definition (DTD), to make integration
    with the cognitive controller easy. Finally, XML is an open, simple standard with
    many tools available to read and write it, including libraries for almost any
