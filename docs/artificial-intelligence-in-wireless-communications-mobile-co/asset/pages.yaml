  md: '# Genetic Algorithms for Radio Optimization


    a few adjustments. First, the WSGA awards points for every objective a bit more
    granularity individual wins. By doing this, the algorithm has a more granularity
    in how it ranks individuals, especially when two objectives are directly competing,
    as BER and power. With these two objectives, the only way to improve or dominate
    another solution is through a change in the modulation since power and BER are
    trade-offs, so inferiority does not properly allow these objectives to be compared.
    Second, the WSGA ranks members by the number of members in each objective to make
    a maximization problem (whereas Fonseca and Fleming [16] rank individuals by how
    many members dominate them and thus perform a minimization problem).


    Crossover and mutation in the WSGA are simple implementations of these mechanisms.
    The WSGA uses one crossover point chosen as a uniform random number with a static
    probability of crossover occurring. The crossover probability is an input parameter
    to the algorithm as is the number of crossover points, which this is usually kept
    at 1. Mutation is a single-point operation chosen from a random number with a
    static probability of mutation occurring. Future enhancements to the WSGA can
    include adaptive adjustment of crossover and mutation probabilities as well as
    the population size during the optimization process for higher convergence efficiency
    and accuracy.


    The use of constraints to a multiobjective problem as shown in (4.1) gives the
    WSGA the opportunity to incorporate regulatory and physical restrictions during
    chromosome evolution. If a trait demanded by the chromosome exceeds the limits
    of the radio''s capabilities, like finding a center frequency outside the tunable
    range of the radio, or violates policy by transmitting too much power in a band,
    then the WSGA applies penalties to the chromosome to set the fitness of the chromosome
    to zero [17], basically nullifying its chance to survive to the next generation.
    We found that this selection of good genes might exist in these disallowed parents.
    To avoid losing the genetic material, we force random mutations on the genome
    until it no longer violates the policy, thus preserving large portions of the
    chromosome structure while introducing legal genes into the population. A more
    focused mutation could also be implemented when mutations occur on the specific
    genes that cause the chromosome to violate policy, thus not wasting time performing
    mutations on otherwise acceptable genetic features.


