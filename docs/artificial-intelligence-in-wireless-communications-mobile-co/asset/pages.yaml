- pgno: 56
  md: 'fall in line with the general principle of GNU Radio: flexible, easy to program,
    and available software for anyone to build SDR waveforms. Therefore, the responsibilities
    of the USRP only include those parts of the waveform that are, to a great extent,
    required for all waveforms. Along with this, the USRP also follows open source
    rules, so all the code is published and available and anyone is allowed to modify
    it to perform more processing in the USRP if they so desire.


    The flow design of the GNU Radio allows for abstraction and visualization. Once
    instantiated, a signal processing block becomes an object, or node, in the graph.
    From a graph theory perspective, these graphs are simple, flat graphs with no
    loops that have at least one source and one sink. Information from the source
    and flows sequentially though the remaining blocks in the graph until it terminates
    at a sink. Types of sources and sinks include vectors to input or output raw data,
    files to read and write from a disk, and write from a network card, generalized
    source blocks for creating sinusoidal signals or noiselike signals, and the USRP
    to transmit and receive data over this device. A flow graph may include many paths
    and many sources and sinks so long as there are no loops and there is a connection
    to each input and output port. Figure 3.3 shows a simple flow graph that reads
    a signal from a file, filters it, mixes it with a sinusoidal tone, and simultaneously
    outputs it to a USRP and stores it to another file.


