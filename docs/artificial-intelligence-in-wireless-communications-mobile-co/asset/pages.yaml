    papers regarding each AI technique, specifically the papers that represent the
    field or provide comprehensive background them themselves.


    There are a couple of well-known areas of AI techniques that we purposefully leave
    out. One large technique in signal processing is the Bayesian network. This powerful
    learning technique based on Bayes'' theorem'
