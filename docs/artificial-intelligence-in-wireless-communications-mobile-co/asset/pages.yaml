    probability is around 0.90 to 0.95, making for high probability of performing
    crossover. We normally like having a higher crossover probability to keep genes
    mixing through the population. As we discuss later, we can always choose not to
    replace all parents with children, which is equivalent to children being exact
    duplicates of parents. The probability of crossover provides us with another degree
    of freedom when designing the GA. The number of crossover points used is low and
