- pgno: 171
  md: '# 9


    # Conclusions


    In this book, we have discussed and presented different methods for how artificial
    intelligence can improve communications. We applied these concepts to build the
    enabling technology of cognitive radio, the cognitive engine. Throughout, we explained
    what cognitive radio and a cognitive engine are, as well as the software radio
    platform used to realize the actions of the cognitive engine. The most significant
    developments are the discussion and theoretical analysis in Chapter 4 of using
    multiobjective optimization to perform the cognitive actions. Chapter 5 showed
    an algorithm suited to perform the multiobjective analysis and optimization, followed
    up by an improved learning system using case-based decision theory in Chapter
    6. We presented a brief but important treatment of using the cognitive engine
    as part of a network of cognitive radios and some considerations for what information
    can be distributed to all nodes on a network. We then showed the implementation
    of the cognitive engine to adapt the GNU Radio system under certain system conditions.


    The intent of this book was to bring together the cognitive engine with a working
    model suitable for operation. The development of the multiobjective optimization
    was necessarily limited to the SDR platform available, but through this, we laid
    down the fundamentals of developing and analyzing a cognitive engine. Through
    the development of the distributed cognitive engine, we provide a system that
    can be extended, enhanced, and made usable for future applications and radio systems.
    One of the most significant challenges of our work was building a system that
    both shows the operation of the theory but is also usable and reusable in further
    developments by using generic, documented interfaces and simple script languages
    to enable ease of use.'
  merge: -1
  img_proc: true
- pgno: 172
  md: 'Because the intentions of our work were to provide a usable system on the SDR
    technology we had available, there are many advances not considered in the development
    and analysis. There are few significant advances that are left out of the analysis
    that we wish to address briefly as part of future research. First, we will discuss
    the application of the cognitive engine to optimize multicarrier systems. Second,
    the significant work done in adaptive systems has far been ignored, but we will
    discuss how this work can be used and by a cognitive radio system. Finally, we
    address some of the AI and learning issues that have been brought up throughout
    this document that can enhance the future capabilities of the cognitive engine.


    # # 9.1 Application to Multicarrier Waveforms


    One of the more popular subjects in communications, for physical, MAC, and network
    layer researchers, is multicarrier systems. In particular, orthogonal frequency
    division multiplexing (OFDM) dominates this discussion, and we will use it here
    as an example, although much of this discussion should be easily extended to other
    multicarrier systems. In OFDM, each symbol is carried over a number of orthogonal
    subcarriers. Subcarriers can be used in different ways. Some subcarriers can be
    used for pilot tones to help with equalization at the receiver, while each subcarrier
    can transmit information using a different modulation. Subcarriers can be used
    or unused to help shape the spectrum, and each subcarrier''s bandwidth can be
    altered to provide different spectral properties and communications capabilities.
    As an example, the IEEE 802.16 standard uses OFDM and provides a wide range of
    adaptive parameters [1].


    OFDM modulation has great potential for cognitive radio systems through all of
    the adaptive parameters that the radio can use to change the behavior and performance.
    The length of the cyclic prefix balances the spectral efficiency with the multipath
    resistance of the signal, and the bandwidth of each subcarrier changes the data
    rate while altering the protection against frequency-selective fading. Equation
    (9.1) shows how parameters can be adjusted to affect the data rate of an OFDM
    waveform where $B$ is the symbol bandwidth, $L$ is the number of subcarriers,
    $L_d$ is the number of data subcarriers, $M$ is the modulation order, and $G$
    is the guard fraction (ratio of the cyclic prefix length to the total symbol length)
    [1]. Different modulations can be used per subcarrier to balance the properties
    of the modulation against the bit error rate. Channel coding, too, provides a
    way of balancing error correcting capabilities with data rate. The setting of
    each of these parameters depends on the channel conditions in the same way as
    in the narrowband signal analysis we provided earlier. The analysis'
  merge: -1
  img_proc: true
- pgno: 173
  md: '# Conclusions


    and implementation of the cognitive engine, however, is easily enhanced to use
    multicarrier techniques by adding the sensors required to understand the channel
    conditions (e.g., multipath and fading) and the objective functions to properly
    model the effects of the parameters.


    ```

    $R = \frac{B}{L} \frac{log_2(M)}{1+G} \quad \text{bps} \quad (9.1)$

    ```


    # 9.2 Strategies, Not Waveforms


    The optimization process we developed focused on finding values for the knobs
    in order to satisfy certain quality of service objectives. However, the cognitive
    engine reacts to changes in the environment and user need, so the adaptation is
    situational and does not act on a packet-by-packet time scale. On the other hand,
    researchers in communications have developed sophisticated and powerful techniques
    for locally-adaptive schemes; that is, methods that focus on adaptation of properties
    to enhance communication performance. Such techniques include adaptive power control,
    as in traditional cellular telephony, or adaptive modulation in many standards
    such as Universal Mobile Telecommunications System (UMTS), IEEE 802.11, and IEEE
    802.16. The 802.16, or WiMAX, standard has many interesting possibilities in this
    area because of the significant number of adaptive parameters available.


    The future cognitive radio should take advantage of all of these techniques to
    build the communications system. Instead of trying to find the best power to the
    tenth of a dB, the cognitive engine could choose an adaptive power strategy that
    makes sense for the current conditions. Likewise, the same can be done for modulation,
    channel code adaptations, or dynamic spectrum access technologies. We like to
    think of the cognitive radio as developing a strategy to work within an environment
    and for a particular service. Instead of designing a waveform, the cognitive engine
    builds a strategy.


    The objective functions we presented in Chapter 4 were based on the concept of
    waveform adaptation, and we showed how each interacts with the entire system.
    Building a cognitive engine to work with adaptive strategies is even more complicated
    since each adaptive technique would interact with the overall quality of service
    of the system. We argue that the premise of the cognitive engine stays the same
    as we have developed it. Instead of genes representing particular parts of a wavelet
    and objective functions analyzing each waveform, the genes represent adaptive
    strategies, and so the objective functions would need to be developed to properly
    analyze and'
  merge: -1
  img_proc: true
- pgno: 174
  md: 'model the behavior of the strategy. Furthermore, this type of adaptation places
    more responsibilities on the radio platform to support many of these possible
    techniques.


    # 9.3 Enhanced Learning Systems


    When discussing the individual topics throughout this document, we have pointed
    out advances to the theory that others have investigated, such as advanced techniques
    for genetic algorithms. We would like to address a few of these here, now that
    we have described the entire system. The areas of particular interest are potential
    enhancements to the multiobjective optimization, the genetic algorithm, and the
    case-based learning system.


    The multiobjective optimization work has provided an analysis of the individual
    objectives as well as different methods of aggregating the objectives to allow
    comparisons. In this discussion, we briefly pointed to the lessons learned from
    the work of economists in modeling and analyzing utility and production functions.
    While there are many different methods of comparing solutions, we only really
    investigated a couple of them. There is still a significant amount to be learned
    from the economics literature, and much analysis left to understand how best apply
    these concepts to the cognitive engine.


    We tried of including too much domain knowledge when developing and analyzing
    the performance; instead, we prefer to make direct comparisons of performance
    in each objective. While our attempts have been for the purpose of increasing
    generality of the system’s operation, specific analysis and domain knowledge could
    enhance solutions. We pointed to some work done on fuzzy logic cognitive rayons
    [2] as this might be a technique to allow a trade-off between generality and domain-specific
    solutions. The fuzzy system can be programmed to include basic communication system
    rules to guide the development of solutions and offer bounds and aggregation techniques
    to the objective analysis. Fuzzy rule sets could establish basic performance metrics,
    such as maximum BER values acceptable for certain optimization goals. Using fuzzy
    logic could enable an aggregation function to combine objectives into a single
    metric for performance comparison.


    The genetic algorithm analyzes many advanced topics [3, 4, 5, 6]. In particular,
    we pointed out the concept of parallel genetic algorithm analysis in Chapter 7,
    but any conference proceedings, book, or journal on genetic algorithms lists many
    other advanced techniques. Adaptive parameters are a popular method of improving
    performance by changing the crossover or mutation rates, depending on the trends
    of the algorithm performance. We have presented one method of seeding the population
    using a case base of'
  merge: -1
  img_proc: true
- pgno: 175
  md: 'past solutions. In this discussion of Chapter 6, we also alluded to many other
    advances the case-based feedback mechanism could offer, including such parameter
    adjustments like population size, mutation rates, and termination conditions.
    There are many gains available in the optimization process, and the techniques
    mentioned here are just some of the low-hanging fruit available.


    The case-based system offers other performance improvements beyond its control
    of the genetic algorithm. We presented many of these in Chapter , but we will
    reintroduce a few here. The case-based decision theory mechanism depends greatly
    on the similarity, utility, and decision-making functions, as we showed during
    the results of the knapsack problem. This warrants further study into this application
    for the cognitive engine. There are also many tunable parameters to study in the
    case-based design, including the size of the case base, the number of solutions
    to pull from the case base, and where to find these solutions. Another aspect
    that we have discussed is the method of remembering and forgetting solutions in
    the case base, as well as potentially using multiple types of case bases to realize
    concepts like short-term and long-term memory. There is still a lot research to
    be done in these applications.


    # 9.4 Final Thoughts


    In “Computing Machinery and Intelligence,” Alan Turing built the foundations of
    artificial intelligence [7]. In it, he concludes, “we can only see a short distance
    ahead, but we can see plenty that needs to be done,” a conclusion that any good
    researcher will reach. While there may be little ground to be covered in individual
    physical layer concepts such as modulation and coding, we have not yet fully tapped
    the potential of the communications system as a whole. The interactions among
    all aspects of a waveform and communications system, as well as the behavior of
    networks, are rich fields of research that we are all now developing. Our goal
    was to present the methods that radio can intelligently analyze and build systems
    for its own purpose. As we have pointed out in this chapter, there remains much
    to be done to enhance our current communications platforms to provide easy, ubiquitous
    communications and access to information.


    # References


    +   [1] J. G. Andrews, A. Ghosh, and R. Mohamed, Fundamentals of WiMAX: Understanding
    Broadband Wireless Networking, Upper Saddle River, NJ: Prentice Hall, 2007.'
