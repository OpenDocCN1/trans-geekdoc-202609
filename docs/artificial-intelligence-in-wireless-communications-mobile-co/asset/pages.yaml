    the received time domain signal from the channel filter. The output of the cross-correlation
    spikes when the transmitted access code is received. The known access code sequence
    can then be subtracted from the received signal to leave any interference signals
    and the AWGN noise. Before subtracting the known access code, an autocorrelation
    is performed on it to determine its maximum correlation value. The ratio of the
    autocorrelation value to the peak of the cross-correlation gives the pathloss
    as the constant during the transmission of the access code. This ratio is used
    to adjust the amplitude of the known sequence to properly remove it from the received
    signal. Taking the average magnitude squared of this signal yields the interference
    pulse noise power. The remaining signal after subtraction can then be subtracted
    from the original received signal to leave only the transmitted signal. The average
    magnitude squared of this value is the received signal strength. The ratio of
    these two values is the SINR.


    Appendix F provides more detail and the mathematical explanation of this meter
    probe as well simulated results that show the sensor''s proper behavior. This
    sensor can then be used as a means of calculating the received signal power, the
    interference plus noise power (or just noise power if no interference is present),
    and the pathloss, thereby replacing the signal power and noise power probes used
    previously in this work.'
