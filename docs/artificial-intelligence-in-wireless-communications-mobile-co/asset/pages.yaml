    # 4.4.2 Population-Based Analysis


    Another method of evaluating performance in a multiobjective problem space is
    using population-based analysis and Pareto-ranking. We show in Chapter 5 how this
    concept lends itself nicely to genetic algorithm optimization. Fonseca and Fleming
    [9] have a lot of work in this area as well as many other researchers using genetic
    algorithms for multiobjective analysis.


    The Pareto-ranking analysis takes a set, or population, of possible solutions
    to a multiobjective problem and looks to see which members are nondominated; that,
    which members of the population outperforms in all dimensions. We provide a more
    mathematical definition to this concept in Chapter 5. In Pareto-ranking, each
    potential solution is ranked relative to other solutions. In a search or optimization
    algorithm, the idea is to push for better and better solutions until they lie
    on the Pareto front. This set of solutions represents a trade-off space among
    all objectives. The final step of the algorithm is to select the solution that
    represents the desired trade-off, which is done through some subjective or weighted
    analysis to find the proper trade-off space. Park et al. produced recent results
    on the use of Pareto ranking genetic algorithms for optimization of 3G systems
    [23].


    While multiobjective problem solvers have often used Pareto-ranking, Purhouse
    and Fleming [24] suggested that this form of analysis works well for a small number
    of objective functions (two to three) but not well for larger numbers of objectives,
    (what they call a "many-objective" problem). Hughes [25] later tested this hypothesis
    with an experiment to compare'
