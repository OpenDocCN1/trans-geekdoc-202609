    # 6.5 Cognitive Radio Example Problem


    In Chapter 3, we discussed how many different voice and data standards are proliferating
    around the world for mobile phone use. Among these are the standard waveforms
    like CDMA and GSM. More exciting are the data waveforms such as Bluetooth, WiFi,
    Wide Interoperability for Microwave Access (WiMax), Long Term Evolution (LTE),
    and High Speed Packet Access (HSPA). Due to customer demand and deployment plans,
    wireless carriers do not support all standards, and carriers will support better
    access in different areas. Mobile phones provide many different protocols including
    Bluetooth, WiFi, and a few different standards in different bands. These are generally
    called quad-mode phones and smartphones. The customers usually pay a premium to
    buy the phones and the service plans. Already, our mobile phones switch between
    roaming and nonroaming carriers and change between a small subset of possible
    protocols. These selections are performed by the radio itself, sometimes with
    specific rules provided by the user, to save cost by never roaming.


    Besides differences in service provided by the carriers, different standards offer
    various levels of service quality. Among the big differentiators are the range
    of the data rates available and the latency of the network. WiMax, for example,
    has a higher latency than LTE, making LTE more applicable to voice communications.


    We want radios to be capable of all of these waveforms and modes of service and
    to automatically select the service based on some quality of service metrics.
    We have so far discussed technical quality of service measures, such as speed,
    error rates, and power consumption. Another very important input to a consumer''s
    decision-making method is the cost of the service. This concept has been addressed
    in many of the papers published in the IEEE DySPAN symposia, including [8].'
