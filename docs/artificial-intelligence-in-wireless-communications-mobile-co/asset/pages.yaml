- pgno: 209
  md: '# # F


    # ## Simulation of an SINR Sensor


    # ### F.1 Sensor Design


    A transmitted signal, $s[k]$, contains a sequence of known data symbols, $s[k]$
    such as a training sequence, preamble, or access code. The received signal, $r[k]$,
    is shown in (F.1) and includes the transmitted signal, interference signals in
    the channel bandwidth, and AWGN noise. Not represented in this equation is that
    the transmitted signals (including the interferers’) amplitude is adjusted by
    some pathloss of the propagation channel.


    ```

    $r(t) = s[k] + \sum (i[k]) + n[k] \quad$ (F.1)$

    ```


    Correlating the received signal with the known data symbols when the received
    signal is the known data sequence. The correlation can be implemented as an FIR
    filter the length of the known sequence and where the taps are the values of the
    known sequence. A similar autocorrelation is done using the known sequence to
    get the peak value for determining the pathloss. Equation (F.2) gives the peak
    value the cross-correlation where $K$ is the length of the known sequence, and
    (F.3) gives the peak of the autocorrelation process.


    ```

    $m_x = \sum_{k=0}^{K-1} r[k]s[k] \quad$ (F.2)$

    ```


    ```

    $m_a = \sum_{k=0}^{K-1} s[k]s[k] \quad$ (F.3)$

    ```


    The known sequence is then adjusted in amplitude for pathloss by the ratio $m_x/m_a$.
    The adjustment is based on the assumption that the pathloss'
  merge: -1
  img_proc: true
- pgno: 210
  md: 'does not significantly change over the duration of the known sequence, which
    is usually a few dozen bits long. The GNU Radio access code is 64 bits long. Subtracting
    the adjusted known sequence from the received signal leaves the interference plus
    noise (F.4). Subtracting the results of (F.4) from the received signal leaves
    the transmitted signal (F.5). These equations are valid for k over the length
    of the known sequence, K, once the cross-correlation detects a received known
    sequence.


    ```

    $$r_{n+i}[k] = r[k] - \frac{m_x}{m_a}s_k[k] = \sum (i[k]) + n[k]$\quad\quad(F.4)$

    ```


    ```

    $$r_s[k] = r[k] - r_{n+i}[k]$$\quad\quad(F.5)$

    ```


    The signal power is the average magnitude squared of $r_s$ (F.6), and the interference
    plus noise power is the average magnitude squared of $r_{n+i}$ (F.7).


    ```

    $$s = \frac{K-1}{K} \sum_{k=0}^{K-1} |r_s[k]|^2$\quad\quad(F.6)$

    ```


    ```

    $$i + n = \frac{K-1}{K} \sum_{k=0}^{K-1} |r_{i+n}[k]|^2$\quad\quad(F.7)$

    ```


    Equation (F.8) is the estimated SINR.


    ```

    $$SINR = 10 \log_{10} \left( \frac{s}{i+n} \right)$$\quad\quad(F.8)$

    ```


    # F.2 Simulation


    The simulations were done using the MATLAB script provided below. The script requires
    the communications toolbox.


    The first lookion at the SNR estimator without any interference, Figure F.1 plotted
    the results versus the known SNR. Each point is the average of 100 simulations
    using a 64-bit random known sequence. The figure shows a high precision in calculating
    the SNR. There is a constant offset of about 0.35 dB due to the use of root-raised
    cosine pulse filtering on previous symbols that is not subtracted out of the signal
    and adds a bit of extra energy to the calculation.


    The purpose of this sensor is to calculate properly the signal power and the signal
    to interference plus noise power in the presence of interference. In'
