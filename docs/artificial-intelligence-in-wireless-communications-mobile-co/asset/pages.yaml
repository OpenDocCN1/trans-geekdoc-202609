    table are timestamp, problem, solution, and result. The problem column references
    another table that describes the problem. Similarly, the result column references
    another table to describe the result''s properties. The final piece of the case
    definition is in the solution, which is a text field in the main table.


    The references to the problem and result tables are defined in order to maximize
    the flexibility when defining the information representation. Each sensor contains
