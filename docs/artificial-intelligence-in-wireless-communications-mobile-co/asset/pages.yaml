- pgno: 205
  md: '# Optimal Solutions of Knapsack Problems


    For the tests of the knapsack problems used with case-based decision theory work
    of Chapter 6, we randomly created a set of knapsack problems and stored these
    for repeated and comparable use. The results presented in Chapter 6 showed that
    many of the problems demonstrated significant improvement using CBDT while others
    did not perform as well. To further analyze this, we ran the simple knapsack GA
    for 50,000 generations to produce the optimal value (or at least very close to
    it). In Chapter 5, the knapsack GA showed asymptotic and therefore convergence
    behavior after 5,000 generations. We ran it for an extra 10 times that many generations
    to improve this further. The results of this process are presented in Table E.1
    for each of the 100 models used. Knowing this bound is useful because it helps
    understand how difficult the knapsack problem is to solve. Smaller overall profit
    values are much more difficult to solve than larger values. Two interesting models
    are 62 and 63, both with small overall profit values. The results of the CBT are
    discussed in Chapter 6 where different methods provided different results; some
    produced significant improvement for model 62 but not for 63 while other methods
    produced significant improvement for model 63 and not 62. The results in this
    table show that these two problems are difficult to solve. When applying case
    base feedback, the initial solutions can either help find better solutions faster,
    the initial solutions might bias the population to a local optimum and hurt the
    search for the global optimum. See Chapter 6 for more analysis of what these results
    mean.'
