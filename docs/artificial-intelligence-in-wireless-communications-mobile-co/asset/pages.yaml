- pgno: 133
  md: '# Cognitive Radio Networking and Rendezvous


    A final challenge to enable the cognitive radio system’s basic functionality is
    the ability to transmit the cognitive engine’s information and solutions among
    the nodes operating on the network. We have analyzed the cognitive engine from
    the internalized view of optimizing a waveform. The next item to address is the
    method by which a cognitive radio acts as part of a network.


    A cognitive network is more than a network of cognitive radios. It exhibits distributed
    intelligence by configuring and adapting individual nodes to meet a dynamic set
    of network-level goals. The behavior responds to goals of the radio users but
    is not controlled by any individual node in the network. Within the networks constraints,
    they configure themselves to best meet their own users’ needs.


    At the time we prepared this book for publication, cognitive networking was in
    its infancy. Practical developments consisted of a few nodes controlled by a single
    cognitive engine or were limited to DSA applications in which nodes share a central
    database. There were lots of speculative proposals for optimization at the network
    level, emergent behavior or swarm theory as models for cognitive networking, and
    so forth. We debated omitting this chapter, but we decided to include it as a
    summary of where the field stood in late 2008.


    The most basic implementation is an autocratic method of cognitive radio network
    development. In this method, one radio develops a waveform and pushes it out to
    the nodes for them to use. The biggest challenge to enabling this mechanism is
    the need to establish communications among all nodes before the radio can communicate
    the new waveform. Developing this theme further, the autocratic method falls short
    of realizing the full potential'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'of a cognitive radio network. When one cognitive radio develops a waveform,
    it has developed to optimize its internal goals for its perceived channel conditions.
    The other radios on the network may not share these conditions, and one radio''s
    optimized waveform may not be the same as another radio''s. We briefly discuss
    this with respect to the literature of game theory and cognitive networks that
    have been working on this issue.


    A further enhancement to the cognitive radio design is not only to distribute
    the waveform information, but also use of the network nodes to enhance the optimization
    process. Each cognitive radio in a network has the ability to cooperatively optimize
    through the use of distributed and parallel processing. We end this chapter by
    addressing some of the very basic aspects of these techniques with respect to
    enhancing the genetic algorithm.


    This chapter addresses cognitive radio networks, and each of the topics discussed
    here are full research endeavors on their own. Our aim in this chapter is to develop
    the basic system to deliver waveforms across a network and present the research
    areas involved and the advances this topic has to offer.


    # 7.1 Waveform Distribution and Rendezvous


    The simplest approach to enabling communications among cognitive radio nodes is
    through a static control channel. In the first scenario under this model, the
    radios in a network are currently in communication with each other. One or more
    of the cognitive radio then develops a new waveform that improves communications.
    In this case, the radio can simply pass the new waveform to the radio nodes using
    the current channel. This method is a form of *in-band signaling* and can use
    a different logical control channel over the same physical channel to send configuration
    information. This type of control information is commonly used in home networking
    systems like IEEE 802.11, where connection and configuration data use the same
    frequency channel but a simpler, more robust modulation scheme.


    In another scenario, the radios in the network are not able to communicate with
    each other due to degradation in the channel such as increased interference or
    environmental changes. In this case, the radios would have to use another physical
    channel known to all to reestablish communications. This is a form of *out-of-band
    signaling*, where the radios use a separate physical channel to communicate control
    information. This concept is commonly used in cellular communications systems.
    The control channel is defined to use simple, robust waveforms on which all nodes
    are capable of communicating. In the worst case, if the cognitive radio nodes
    lose communications, they can revert to the control channel and wait for the new
    waveform information and then reestablish communications. The control'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'Cognitive Radio Networking and Rendezvous


    channel is also used to begin communications when a node wants to join a network
    that might be using any waveform or any frequency. The control channel allows
    the new node a way to communicate with the network and initialize communications.
    This concept is often referred to as rendezvous: the method by which a radio enters
    a network.


    Ideas and implementations for rendezvous are receiving a lot of attention for
    cognitive radio network coordination and many papers of recent dynamic spectrum
    and cognitive radio conferences discuss this. Both the 2005 and 2007 IEEE DySpan
    conference proceedings contain a number of such papers; for example, [1, 2, 3].


    Static control channels, while easily implemented, are problematic because they
    are easily jammed and rendered useless. More ideas involve dynamic control channels,
    which still require coordination among the nodes to determine where the control
    channel is. A few proposals have been shown to remove the control channel from
    the rendezvous model and instead use physical layer descriptors to identify radios
    and enable rendezvous. Sutton et al. [4] shows the use of embedded cyclostationary
    signatures in OFDM-based systems that can identify a network and coordinate access.
    Because the signature is embedded in each OFDM symbol transmitted, the system
    does not need to transmit particular frames or switch channels to enable the network
    identification and coordination. Horine [5] proposes a technique to search for
    clear channels, transmit a beaconing signal, and wait for a response while other
    radios search for the particular beacon. This concept lack of is similar to Bluetooth''s
    inquiry and connection states. The beacon is shaped in frequency to identify the
    node or network. Unfortunately, since the detection is based on FFT amplitude,
    there is no offered explanation of how the approach will work in multipath or
    fading channels.


    There is significant interest and working progress in cognitive radio rendezvous.
    Because of its simplicity of implementation and the currently available SDR capabilities,
    we have implemented the static control model to enable our experiments with the
    cognitive engine. The cognitive engine first tries to connect the other radio
    nodes on the current channel; if they do not respond, the radio reverts to a known
    control channel and waveform where the other nodes, having likewise their connection,
    will wait. The new waveform information is then transmitted to the nodes after
    which they reconnect using the new settings.


    # 7.2 Cognitive Radio Networks


    The static control model where waveforms are pushed to the radios is currently
    used in our cognitive engine implementation for lack of a better'
