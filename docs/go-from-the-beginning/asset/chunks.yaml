- raw: "All these functions above have as their second parameter a so called *cutset*\
    \ parameter, where you specify what character you want to get rid of. You can\
    \ for example specify to remove space, newline and tab characters like so:\n\n\
    ```\n1 \" \\n\\t\"\n```\n\nHere’s some code that shows all three methods in use:\n\
    \n```\n 1 fmt.Printf(\"%s , string length %d \\n\", s, len(s))\n 2  res := strings.Trim(s,\
    \ \" \")\n 3  fmt.Printf(\"%s , string length %d \\n\", res, len(res))\n 4 \n\
    \ 5  s2 := \"   114  \"\n 6  fmt.Printf(\"%s , string length %d \\n\", s2, len(s2))\n\
    \ 7  res = strings.TrimLeft(s2, \" \")\n 8  fmt.Printf(\"%s , string length %d\
    \ \\n\", res, len(res))\n 9 \n10  s3 := \"   114  \"\n11  fmt.Printf(\"%s , string\
    \ length %d \\n\", s3, len(s3))\n12  res = strings.TrimRight(s3, \" \")\n13  fmt.Printf(\"\
    %s , string length %d \\n\", res, len(res))\n```\n\nThe above string has three\
    \ whitespaces to the left and two to the right, giving it a total length of 8.\n\
    \nThe output of the above code is:\n\n```\n1   114   , string length 8 \n2 114\
    \ , string length 3 \n3    114   , string length 8 \n4 114   , string length 5\
    \ \n5    114   , string length 8 \n6    114 , string length 6 \n```\n\nLets break\
    \ down the output per row.\n\nFor this output, using `Trim()`, the spaces are\
    \ removed on both sides and we end up with something looking left aligned:\n\n\
    ```\n1 \"114\"\n```\n\nThe next output, using `TrimLeft()`, shows how the right\
    \ spaces are still there:\n\n```\n1 \"114   \"\n```\n\nOur final row, using `TrimRight()`,\
    \ shows a right alignment and how the spaces on the left side still remains:\n\
    \n```\n1 \"   114\"\n```\n\n## Inspect with `Contains()`\n\nImagine you want to\
    \ inspect a string to verify whether it contains a certain substring.\n\nFor that,\
    \ you can use the `Contains()` function. Its syntax looks like so:\n\n```\n1 strings.Contains(stringSource,\
    \ pattern)\n```\n\nYou can then for example use it to process a list from a point\
    \ of sale system, and for each item check if it contains a certain prefix:\n\n\
    ```\n1 rows := []string{\"order: 5\", \"order: 10\", \"order: 5\", \"separator\"\
    }\n2 \n3 \n4 for item :=  range rows {\n5   if strings.Contains(\"order\") {\n\
    6     // process order\n7   }\n8   // ignore\n9 }\n```\n\n## Parsing with `Split()`\n\
    \nLets continue with processing rows from our point of sale system. This time,\
    \ we will be looking at a specific item and extract the information we need. For\
    \ this, we will use the `Split()` function:\n\n```\n 1 rows := []string{\"order:\
    \ 5\", \"order: 10\", \"order: 5\", \"separator\"}\n 2 \n 3 for item :=  range\
    \ rows {\n 4   if strings.Contains(\"order\") {\n 5      tokens := strings.Split(item,\
    \ \":\") // [ \"order\", \" 5\"]\n 6      value := strings.Trim(tokens[1])\n 7\
    \      fmt.Println(value)\n 8   }\n 9   // ignore\n10 }\n```\n\nBy using this\
    \ code:\n\n```\n1 strings.Split(item, \":\")\n```\n\non this string “order: 5”,\
    \ we end up with an array `[\"order\", \"5\"]` and `strings.Trim(tokens[1])` would\
    \ then refer to 5.\n\n> TIP: If we need to treat the 5 above as a number, as part\
    \ of calculation, we would need to convert it to a number first\n\n## Presentation\n\
    \nSay you have customer management system and there’s a lot of data to present.\
    \ To give importance to certain data, we can use functions to highlight their\
    \ visual appearance.\n\nTake the following multiline customer string:\n\n```\n\
    1 Jean Normand\n2 123 Way\n3 Washington\n```\n\nIf you use `ToUpper()` on city\
    \ you get a result like so:\n\n```\n1 Jean Normand\n2 123 Way\n3 WASHINGTON\n\
    ```\n\nWith `ToLower()` you ensure all characters are formatted as lowercase.\n\
    \n## Assignment\n\nWrite a program that given a struct containing, name, address\
    \ and city ensures that the name is lowercase and the address is uppercase.\n\n\
    ## Solution\n\n```\n 1 package main\n 2 \n 3 import (\n 4  \"fmt\"\n 5  \"strings\"\
    \n 6 )\n 7 \n 8 type Person struct {\n 9  Name    string\n10  Address string\n\
    11  City    string\n12 }\n13 \n14 func main() {\n15  person := Person{Name: \"\
    jean Normand\", Address: \"123 Way\", City: \"Washington\"}\n16 \n17  fmt.Println(strings.ToUpper(person.Name))\n\
    18  fmt.Println(person.Address)\n19  fmt.Println(strings.ToUpper(person.City))\n\
    20 }\n```\n\n# Use regular expressions to parse text\n\nIn this chapter, you’ll\
    \ learn how to use Regular Expressions to search and replace text.\n\n## What\
    \ is RegEx and what to use it for\n\nRegular Expressions or RegEx for short, is\
    \ used for searching and replacing text. Technically a RegEx is a sequence of\
    \ characters that specifies a search pattern.\n\n## Why use RegEx\n\nRegEx primary\
    \ usage area is for searching text, replacing it and also extracting text. There\
    \ do exist string libraries that can do some of the functionality RegEx is capable\
    \ of. Sometimes using those string libraries might even be the best thing to do.\
    \ However, sometimes a RegEx pattern is better.\n\n> Fair word of warning though,\
    \ RegEx is hard to get right. You are encouraged to learn more of how they work\
    \ cause they are quite powerful.\n\nMy hope is by you reading this chapter, that\
    \ you will find RegEx less intimidating and see it as a valuable tool in your\
    \ toolbox.\n\n## Where is it used ?\n\nRegEx shows up in many different contexts:\n\
    \n*   **Text editors, any programs with a search**. In most text editors, for\
    \ example Visual Studio Code, you can search for files and inside of files with\
    \ a RegEx search pattern.\n\n*   **Code**, many programming languages and runtimes\
    \ have libraries that helps you use RegEx.\n\n## Your first RegEx\n\nLet’s construct\
    \ a simple RegEx to get a feel for it. Here it is:\n\n```\n1 an\n```\n\nif you\
    \ apply this search pattern `an` to the following text:\n\n```\n1 highlands is\
    \ a part of Scotland\n```\n\nIt will match like so:\n\n> highl**an**ds is a part\
    \ of Scotl**an**d\n\nFor simpler cases, where you are looking to see if a specific\
    \ word matches, in one or more places in a sentence, a pattern like the above\
    \ is enough.\n\n### RegEx in Go\n\nTo start using RegEx in Go, there’s the regexp\
    \ library. There are two approaches:\n\n*   `regexp` directly, here’s an example:\n\
    \n    ```\n    1  matched, err := regexp.FindString(\"an\", \"highlands is a part\
    \ of Scotland\")\n    ```\n\n    Here, you get a boolean back that returns true\
    \ if there’s a match.\n\n*   **compiled**, in this way, you compile a regular\
    \ expression and then calls a method on it, like so:\n\n    ```\n    1  r, _ :=\
    \ regexp.Compile(\"an\")\n    2  matches := r.FindAllString(\"highlands is a part\
    \ of Scotland\", -1)\n    ```\n\n    The above returns a string array with all\
    \ the matches, in this case `[\"an\", \"an\"]`.\n\n    In this version, you have\
    \ more functions available.\n\n## Character classes\n\nCharacter classes are able\
    \ to distinguish between different types of characters. Different types can be\
    \ newlines, digits, letters and so on.\n\nLet’s have a look at some common types\
    \ you are likely to encounter:\n\n| Type || Description |\n\n| --- | --- |\n\n\
    | . || This type matches any character except for a carriage return |\n\n| ---\
    \ | --- |\n\n| \\\\ || This type escapes what’s coming next |\n\n| \\\\w || matches\
    \ any character from the latin alphabet including underscore \\_ |\n\n| \\\\d\
    \ || matches any digit |\n\n| D || this is the inverse of \\\\d and matches any\
    \ character that’s not a digit |\n\n| \\\\s || matches a white space character\
    \ like space tab, line feed etc. |\n\nLets show an example:\n\n```\n1 matched,\
    \ err := regexp.FindString(\"\\d\", \"abc123\")\n```\n\nThere would be a match\
    \ above due to 123. However, there would be no match against “abc” as there’s\
    \ no digits in it.\n\n## Repetition\n\nIf you want to express repetition, there’s\
    \ two characters of interest:\n\n*   `+`, matches 1 to many characters.\n\n  \
    \  ```\n    1  \\w+\n    ```\n\n    Given the string “aaaa bab” it would match:\n\
    \n    **aaaaab** **bab** as the above describes matching characters but not the\
    \ white space.\n\n    ```\n    1  r, _ := regexp.Compile(\"\\\\w+\")\n    2  matches\
    \ := r.FindAllString(\"aaaa bab\", -1)\n    ```\n\n    Note the extra `\\`, we\
    \ need that because of the way we construct our Regex.\n\n*   `*`, matches 0 to\
    \ many characters. Lets say you want to match a postal address that starts with\
    \ “PA” and may contain 0 or many numbers. It should then match strings:\n\n  \
    \  ```\n    1  PA\n    2  PA111 \n    ```\n\n    We can use a `*` to construct\
    \ this looking like so:"
