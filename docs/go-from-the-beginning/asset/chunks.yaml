    \n9. Solution\n\n# Your first program\n\nThis lesson covers some history of Go\
    \ and also teaches you how to build your first Go app.\n\n## Introduction\n\n\
    In this lesson we’ll cover:\n\n*   The history of Go\n\n*   Why use Go for your\
    \ apps\n\n*   The anatomy of a Go app\n\n*   Authoring and running your first\
    \ app\n\n## A history of Go\n\nThe language is called Go but is sometimes known\
    \ as Golang as the first website for it was golang.org.\n\nGo was created in 2009\
    \ by Robert Griesemer, Rob Pike and Ken Thompson. It’s hard to estimate the number\
    \ of Go developers but it’s somewhere between 1.1 and 2.7 million, quite a sizeable\
    \ amount. More than 2500 companies are using Go including, Google, Pinterest and\
    \ Uber. So, you see, used by a lot of folks by big companies.\n\n> Why was Go\
    \ created?\n\nAs is often the case, a programming language is created to deal\
    \ with the shortcomings of other languages. In this case, the creators wanted\
    \ this new language to have the following capabilities:\n\n*   **Static typing**\
    \ and run-time efficiency from C.\n\n*   **Readability** from JavaScript and Python.\n\
    \n*   **High-performance** networking and multi-processing.\n\nIt seems the creators\
    \ agreed on disliking C++ :)\n\n## What is it used for though?\n\nHere’s some\
    \ areas where you are likely to find a Go being used:\n\n*   Cloud based and server-side\
    \ apps.\n\n*   DevOps, automation.\n\n*   Command-line tools.\n\n*   AI and data\
    \ science.\n\n## References\n\nThere are many great resources out there for learning\
    \ the Go programming language like:\n\n*   [`go.dev/`](https://go.dev/)\n\n* \
    \  [`www.tutorialspoint.com/go/index.htm`](https://www.tutorialspoint.com/go/index.htm)\n\
    \n*   [`gobyexample.com/`](https://gobyexample.com/)\n\n*   [`www.w3schools.com/go/`](https://www.w3schools.com/go/)\n\
    \n*   [`docs.microsoft.com/en-us/learn/modules/go-get-started/`](https://docs.microsoft.com/en-us/learn/modules/go-get-started/)\n\
    \n*   [`docs.microsoft.com/en-us/learn/modules/serverless-go/`](https://docs.microsoft.com/en-us/learn/modules/serverless-go/)\n\
    \n## Features\n\nSo, what features makes Go compelling? Well, there are some features\
    \ worth mentioning:\n\n*   **Static typing**, I like my types :)\n\n*   **Package\
    \ system**. You can consume and create your own packages. Go to [pkg.go.dev](https://pkg.go.dev/)\
    \ to read more on what packages there are.\n\n*   **Command-line tools**, there’s\
    \ a set of executables that are installed when you install Go. With these executables,\
    \ you can run, build, install packages, run tests and much more.\n\n*   **Standard\
    \ library**. Go has a powerful standard library that will help you with most things\
    \ you might need. You can read more about what’s in the [standard library](https://pkg.go.dev/std)\
    \ here.\n\n*   **Built-in testing**. Having a testing library that just works\
    \ out of the box is something you shouldn’t take for granted.\n\n*   Concurrency.\
    \ Go is great at handling concurrency. It uses concepts like goroutines and channels.\n\
    \n*   **Garbage collection**. You can read more about that [here](https://medium.com/safetycultureengineering/an-overview-of-memory-management-in-go-9a72ec7c76a8#:~:text=Go%20has%20all%20goroutines%20reach,the%20collector%20to%20run%20simultaneously).\
    \ I like when I don’t have to deal with that myself and just focusing on solving\
    \ problems.\n\n## Install Go\n\nOk then, hope you are intrigued at this point\
    \ and just want to see some code? Of course, you are :)\n\nMake sure you’ve followed\
    \ the instructions for installing Go on your machine.\n\n> [`go.dev/doc/install`](https://go.dev/doc/install)\n\
    \n## A Go program\n\nHere’s what a first program can look like:\n\n```\n1 package\
    \ main\n2 \n3 import \"fmt\"\n4 \n5 func main() {\n6  fmt.Println(\"hello\")\n\
    7 }\n```\n\n### The program in detail\n\n*   `package main`, the entry point module\
    \ needs to have this instruction.\n\n*   `import \"fmt\"`, fmt is standard package\
    \ for input and output.\n\n*   `func main`, entry point function, where your program\
    \ starts.\n\n## Commands\n\nNow that you have a program, there’s two things you\
    \ might want to do:\n\n*   **Run it**, to see if it compiles and runs.\n\n*  \
    \ **Create executable**, an executable is no longer Go code but like any executable\
    \ program on your machine.\n\n### Run your app\n\nTo run your app, type `go run\
    \ <file>.go`, for example:\n\n```\n1 go run main.go\n```\n\n### Build your app\n\
    \nTo produce an executable, run `go build <file>.go`, for example:\n\n```\n1 go\
    \ build main.go\n```\n\nIt produces an executable, on MacOS and Linux that’s a\
    \ file with -X as permission, on Windows, it’s a .exe file.\n\nCongrats, you’ve\
    \ created your first Go application.\n\n## Summary\n\nIn this article, you learned\
    \ about the programming language Go, some features it has and how to write your\
    \ first program.\n\n## \U0001F680 Challenge\n\nCompare Go to other programming\
    \ languages, can you list some differences between them?\n\n## Review & Self Study\n\
    \nSelect one of the resources below and try do a tutorial.\n\n*   [`go.dev/`](https://go.dev/)\n\
    \n*   [`www.tutorialspoint.com/go/index.htm`](https://www.tutorialspoint.com/go/index.htm)\n\
    \n*   [`gobyexample.com/`](https://gobyexample.com/)\n\n*   [`www.w3schools.com/go/`](https://www.w3schools.com/go/)\n"
