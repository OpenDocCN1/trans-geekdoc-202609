    \ code:\n\n```\n1 mux := http.NewServeMux()\n2 mux.Handle(\"/hello\", handleHello)\n\
    3 http.ListenAndServe(\":8090\", mux)\n```\n\nIn the preceding code, you instantiate\
    \ the servemux by calling `NewServeMux()`. Then, you set up a route and its handler\
    \ by calling `Handle()`. Finally, you call `ListenAndServe()` but this time around\
    \ you pass the `mux` instance instead of `nil`.\n\nSo how is this better than\
    \ the other way we’ve used so far? The first way we learned about, uses a `DefaultServeMux`\
    \ and risks exposing profiling endpoints, which is bad. Another reason is connecting\
    \ the routes directly to `http` changes the global state, which is looked down\
    \ upon in Go generally.\n\n## Assignment - build a first web app\n\nYour web app\
    \ should have at least one route. The said route should write to the response\
    \ stream. The web app should start at a specific port, for example, 5500.\n\n\
    ## Solution\n\n```\n 1 package main\n 2 \n 3 import (\n 4   \"fmt\"\n 5   \"net/http\"\
    \n 6 )\n 7 \n 8 func handleRequest(w http.ResponseWrite, r *http.Request) {\n\
    \ 9   fmt.Fprintf(w, \"Hi there\")\n10 }\n11 \n12 func main() {\n13   http.HandleFunc(\"\
    /hello\", handleRequest) \n14   http.ListenAndServe(\":8090\", nil)\n15 }\n```\n\
    \n## Challenge\n\n*   list details on the request such as the route, the verb\
    \ used and the query parameters.\n\n*   See if you can serve up different types\
    \ of data like JSON or images.\n\n# Better logging with a logging library\n\n\
    Once you start writing code, you realize quite early that you need to print things\
    \ to the screen as well as sometimes to a file or even a log service. What you\
    \ want to say is usually what type of logging you want to do.\n\n## Introduction\n\
    \nIn this chapter, you will learn the following:\n\n*   Why and what to log.\n\
    \n*   Using the `log` library.\n\n## Reasons to log\n\nThere are many reasons\
    \ to log, here are some reasons:\n\n*   **Information**, there might be a case\
    \ where you want to provide some type of information that could be of use to the\
    \ one using the program.\n\n*   **Success**. A success message is a little more\
    \ than just information, it indicates that you succeeded with something.\n\n*\
    \   **Warning**. When you have a warning, something happened that you should be\
    \ aware of. It’s usually not serious enough to shut down the app but it should\
    \ make you vigilant, it could be that memory is running low for example.\n\n*\
    \   **Error**. When you get an error, you tend to end up in a state where it’s\
    \ no longer a wise choice to continue.\n\n*   **Performance**. It’s common to\
    \ measure how long something takes, for the sake of improving things this information\
    \ can be useful.\n\n*   **Other**. There are also other reasons why you would\
    \ log something, usually, that’s connected to your business.\n\n## What to log\n\
    \nThe general rule is the more you can log the better. Especially if it’s an error\
    \ you want to fix you might want to log things like:\n\n*   When it happened\n\
    \n*   What happened\n\n*   Specific error info\n\nFor every case, you want to\
    \ log, have a log at how the log message will be used, will a team be logging\
    \ through these logs, and what would help them. See if you can interview someone\
    \ on that team.\n\n## Using `log`\n\nIn general, you want to log in places where\
    \ things might go wrong such as when you make web requests, work with I/O and\
    \ so on.\n\nIn general, use these as guidelines for when to log:\n\n*   **Faulty\
    \ input**. If the program risks producing a faulty response, there was a problem\
    \ converting/casting a number or it received an unexpected input for example.\n\
    \n*   **Error state**. If the program ends up in a state from which it can’t recover,\
    \ for example, unable to fetch a batch of data from a data source.\n\nYou don’t\
    \ want logs on every single line of code.\n\n### Standard log `Println()`\n\n\
    To produce a standard log message, you can use the `Println()` function in the\
    \ `log` package. It takes a string and will produce a log message that combines\
    \ a date, time, and your error message.\n"
  trans: "\n# Working with the request\n\n存在多种方式，除了标题，还可以指示服务器程序执行什么操作：\n\n- **HTTP\
    \ verb**，HTTP verb 表达意图。POST verb 表示创建资源，GET verb 表示只读取数据等。本章后面会介绍更多 HTTP verbs。下面这两个请求含义不同：\n\
    \n```\n1    GET /products # 获取产品列表\n2    POST /products # 创建新产品资源\n```\n\n- **body**，body\
    \ 可以包含负载，即我们可以用来创建或更新资源的数据。以下是一个示例：\n\n```\n1    {\n2      \"name\" : \"a new\
    \ product\" \n3    }\n```\n\n*   **router parameters**。在路由请求中，可以有携带意义的参数。如果客户端请求\
    \ `/products/5`，则 5 可能代表唯一标识的产品 ID 5。\n\n*   **query parameter**。在路由末尾可以有查询部分，用于进一步指示请求，例如缩小返回数据的大小。查询部分是否以问号开头，并由键值对用\
    \ ampersands（&）分隔，例如：`/products?page=1&pageSize=20`。\n\n### 解析 body\n\n请求包含 `Body`\
    \ 属性。根据 body 内容，可能需要进行解码。以下代码演示了解码 JSON 并将其写入响应流：\n\n```\n 1 package main\n 2\
    \ \n 3 import (\n 4   \"fmt\"\n 5   \"encoding/json\"\n 6 )\n 7 \n 8 type Person\
    \ struct {\n 9   Id int\n10   Name string\n11 }\n12 \n13 func handleRequest(w\
    \ http.ResponseWriter, r *http.Request) {\n14   var p Person\n15 \n16   json.NewDecoder(r.Body).Decode(&p)\n\
    17   // save person to storage\n18 \n19   fmt.Fprintf(w)\n20 }\n21 \n22 func main()\
    \ {\n23   mux := http.NewServeMux()\n24   mux.HandleFunc(\"/person/\", handleRequest)\n\
    25 \n26   err := http.ListenAndServe(\":4000\", mux)\n27 }\n```\n\n### 读取路由参数\n\
    \n没有内置方法来访问路由参数，需要手动解析，例如：\n\n```\n1 tokens := strings.Split(r.URL.Path, \"/\"\
    )\n2 // 检查每个部分\n```\n\n或者使用正则表达式解析，或者使用如下库：\n\n*   [httprouter](https://github.com/julienschmidt/httprouter)\n\
    \n*   [Gorilla Mux](http://www.gorillatoolkit.org/pkg/mux)\n\n以下是使用 `httprouter`\
    \ 的示例：\n\n```\n 1 func Hello(w http.ResponseWriter, r *http.Request, ps httprouter.Params)\
    \ {\n 2     fmt.Fprintf(w, \"The id us, %s!\\n\", ps.ByName(\"id\"))\n 3 }\n 4\
    \ \n 5 func main() {\n 6     router := httprouter.New()\n 7     router.GET(\"\
    /products/:id\", Hello)\n 8 \n 9     log.Fatal(http.ListenAndServe(\":8080\",\
    \ router))\n10 }\n```\n\n### 读取查询参数\n\n查询部分可通过请求实例的 `URL` 属性的 `Query()` 函数访问：\n\
    \n```\n1 r.URL // /products?page=3&pageSize=20\n2 r.URL.Query() // ?page=3&pageSize=20\n\
    ```\n\n访问特定参数时，`Query()` 函数返回 `Values` map：\n\n```\n1 r.URL.Query()[\"page\"]\
    \ // 3\n```\n\n也可以使用 `Get()` 函数，但仅在只有一个参数时有效：\n\n```\n1 r.URL.Query().Get(\"page\"\
    )\n```\n\n### HTTP 方法\n\n方法含义不同，应按不同方式处理。访问请求方法，使用 `Method` 属性 `r`：\n\n```\n1\
    \ r.Method\n```\n\nHTTP 包中定义了 `MethodGet`、`MethodPost` 等常量，可这样使用：\n\n```\n1 func\
    \ handleRoute(w http.ResponseWriter, r *http.Request) {\n2   if r.Method == http.MethodGet\
    \ {\n3     fmt.Println(\"It's a GET request\") \n4   }\n5 }\n```\n\n## ServeMux，更好的方式\n\
    \n此前通过 `ListenAndServe()` 传入端口参数和 `nil` 创建 HTTP 服务器。另一种方式是使用 `ServeMux`。`ServeMux`\
    \ 也称为路由器，与直接使用 `http` 添加路由不同，它通过 `ServeMux` 添加路由。\n\n以下示例展示了使用 `ServeMux`：\n\n\
    ```\n1 mux := http.NewServeMux()\n2 mux.Handle(\"/hello\", handleHello)\n3 http.ListenAndServe(\"\
    :8090\", mux)\n```\n\n在上述代码中，通过 `NewServeMux()` 创建 `ServeMux` 实例，使用 `Handle()`\
    \ 设置路由和处理函数，最后调用 `ListenAndServe()` 并传入 `mux` 而非 `nil`。\n\n相比之前的方式，使用 `ServeMux`\
    \ 更好，因为：\n\n- 避免使用 `DefaultServeMux` 可能暴露探测端点，这是不安全的。\n- 直接将路由与 `http` 绑定会改变全局状态，这在\
    \ Go 中通常被视为不佳实践。\n\n## 任务 - 构建第一个 Web 应用\n\n你的 Web 应用至少需要一个路由。该路由应向响应流写入内容。Web\
    \ 应用应在特定端口启动，例如 5500。\n\n## 解决方案\n\n```\n 1 package main\n 2 \n 3 import (\n 4\
    \   \"fmt\"\n 5   \"net/http\"\n 6 )\n 7 \n 8 func handleRequest(w http.ResponseWrite,\
    \ r *http.Request) {\n 9   fmt.Fprintf(w, \"Hi there\")\n10 }\n11 \n12 func main()\
    \ {\n13   http.HandleFunc(\"/hello\", handleRequest) \n14   http.ListenAndServe(\"\
    :8090\", nil)\n15 }\n```\n\n## 挑战\n\n*   列出请求详情，如路由、使用的 HTTP 方法和查询参数。\n*   尝试服务不同类型的数据，如\
    \ JSON 或图片。\n\n## 使用日志库进行更好的日志记录\n\n编写代码后，你会发现早期需要将内容打印到屏幕，有时还需要写入文件或日志服务。通常需要记录的是什么类型的日志。\n\
    \n## 介绍\n\n本章将学习以下内容：\n\n*   为什么以及如何记录日志。\n\n*   使用 `log` 库。\n\n## 记录日志的原因\n\n\
    有很多记录日志的原因，以下是一些：\n\n*   **信息**，可能需要记录一些对使用程序的人有用的信息。\n\n*   **成功**。成功消息比普通信息更具意义，表明操作成功。\n\
    \n*   **警告**。警告表示发生了值得注意的事件，通常不严重到停止程序，但应引起警惕，例如内存即将耗尽。\n\n*   **错误**。出现错误时，程序可能进入无法继续的状态。\n\
    \n*   **性能**。记录操作耗时有助于优化性能。\n\n*   **其他**。还有其他记录原因，通常与业务相关。\n\n## 记录内容\n\n一般规则是记录得越多越好，尤其是错误信息，需要记录：\n\
    \n*   发生时间\n*   发生了什么\n*   具体错误信息\n\n对于每种情况，应明确日志用途，是否团队通过这些日志工作，以及日志内容对团队有何帮助。可以尝试与相关团队成员沟通。\n\
    \n## 使用 `log`\n\n通常在可能出错的地方记录日志，如发起网络请求、处理 I/O 操作等。\n\n记录日志的通用指南：\n\n*   **无效输入**。如果程序可能返回错误响应，例如在转换/强制类型时遇到问题，或接收到意外输入。\n\
    \n*   **错误状态**。当程序进入无法恢复的状态，例如无法从数据源获取数据批次时。\n\n不必在每行代码中记录日志。\n\n### 标准日志 `Println()`\n\
    \n使用 `log` 包的 `Println()` 函数生成标准日志消息。它接受字符串并生成包含日期、时间和错误信息的日志消息。\n\n"
