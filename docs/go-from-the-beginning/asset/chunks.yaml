    \ a program representing the shopping basket\n\nWrite a program that iterates\
    \ over the shopping basket and calculates the total:\n\n```\n1 Title, Description,\
    \ Quantity, Price per unit, Total\n2 LEGO set, 4000 pieces, 1, 600GBP, 600GBP\n\
    3 Plushy, plush toy, 3, 5 GBP, 15GBP \n4 \n5 Total: 615 GBP\n```\n\n## Solution\n\
    \nPart I\n\n```\n 1 package main\n 2 \n 3 import (\n 4  \"fmt\"\n 5 )\n 6 \n 7\
    \ type Row struct {\n 8  Title       string\n 9  Description string\n10  Quantity\
    \    int\n11  UnitPrice   float32\n12 }\n13 \n14 func main() {\n15  row := Row{\n\
    16   Title:       \"LEGO set\",\n17   Description: \"4000 pieces\",\n18   Quantity:\
    \    1,\n19   UnitPrice:   600,\n20  }\n21  fmt.Println(row)\n22 }\n```\n\nPart\
    \ II\n\n```\n 1 package main\n 2 \n 3 import (\n 4  \"fmt\"\n 5 )\n 6 \n 7 type\
    \ Row struct {\n 8  Title       string\n 9  Description string\n10  Quantity \
    \   int\n11  UnitPrice   float32\n12 }\n13 \n14 func main() {\n15  row := Row{\n\
    16   Title:       \"LEGO set\",\n17   Description: \"4000 pieces\",\n18   Quantity:\
    \    1,\n19   UnitPrice:   600,\n20  }\n21  row2 := Row{\n22   Title:       \"\
