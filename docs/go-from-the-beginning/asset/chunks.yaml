    closing db\")\n85  db.Close()\n86 \n87 }\n```\n\n# Read and write to files\n\n\
    There are different types of files, text files, files containing images, videos\
    \ etc. For that reason you might want to read the content differently, either\
    \ byte by byte or maybe even the entire file in one go, as text.\n\n## Introduction\n\
    \nIn this chapter you will learn to:\n\n*   Read content from text files.\n\n\
    *   Write to text files.\n\n*   Append text at the end of a text file.\n\n## Read\
    \ a text file\n\nOne approach could be using the `ioutil` library and its `ReadFile()`\
    \ method like so:\n\n```\n 1   import (\n 2     \"io/ioutil\"\n 3     \"log\"\n\
    \ 4   )\n 5   func main() {\n 6     filebuffer, err := ioutil.ReadFile(path)\n\
    \ 7  \n 8     if err != nil {\n 9       log.Fatal(err)\n10     }\n11     var inputdata\
    \ string = string(filebuffer) \n12   }\n```\n\nNote how the result of reading\
    \ the file ends up in `filebuffer`. To interpret it as a string, you need to convert\
    \ it via `string(filebuffer)`. Now, you’re ready to process the file content,\
    \ read it line by line or whatever you want to do.\n\n## Write text to a file\n\
    \nIn this scenario, we are looking to do two things:\n\n*   Create a file.\n\n\
    *   Write text to our newly created file.\n\nFor this scenario, we can use the\
    \ `os` library and a combination of the `Create()` method, to create a file and\
    \ the `WriteString()` method to write a string to the file.\n\n```\n 1  import\
    \ (\n 2   \"os\"\n 3   \"log\"\n 4  ) \n 5 \n 6  f, err := os.Create(path)\n 7\
    \  if err != nil {\n 8   log.Fatal(err)\n 9  }\n10 \n11  n, err := f.WriteString(content\
    \ + \"\\n\")\n12  if err != nil {\n13   log.Fatal(err)\n14  }\n15  fmt.Printf(\"\
    wrote %d bytes\\n\", n)\n16  f.Sync()\n```\n\nFirst the file is created calling\
    \ `Create()`. From that, we get a file handle `f`. With `f`, we can call `WriteString()`\
    \ with a string. Lastly, we call `Sync()` to ensure the string is persisted in\
    \ the file.\n\n## Append to a file\n\nAppending text, implies you already have\
    \ an existing file. When you append, you information to the end of the file. Appending\
    \ is something you are likely to do when you add new entries to a log file or\
    \ adding a new purchase to a Point of Sale, POS system in a grocery store for\
    \ example.\n\nTo append to a file you use the `OpenFile()` method in the `os`\
    \ lib. What you need to do is to pass it some flags that states that you want\
    \ to append content. You should also have a behavior that says, create if it doesn’t\
    \ already exist. You end up with code looking like so:\n\n```\n1 f, err := os.OpenFile(\"\
    text.log\",\n2  os.O_APPEND|os.O_CREATE|os.O_WRONLY, 0644)\n3 if err != nil {\n\
    4  log.Println(err)\n5 }\n6 defer f.Close()\n```\n\nThe 0644, is a 3x3 bit flag.\
    \ It sets permissing for User (6, Read/Write), Group (4, Read), and Other (4,\
    \ Read).\n\nTo append a string, you can call `WriteString()` like so:\n\n```\n\
    1 f.WriteString(\"my text \\n\")\n```\n\n## Assignment\n\nImagine you have a file\
    \ *invoices.csv* looking like so:\n\n```\n1 customer, amount, date\n2 Wood LTD,\
    \ 100, 2020-01-01\n3 Metal, 345, 2020-01-29\n4 Steel, 700, 2020-07-29\n```\n\n\
    Open up and read the file content, line by line.\n\n## Solution\n\n```\n 1 package\
    \ main\n 2 \n 3 import (\n 4  \"fmt\"\n 5  \"io/ioutil\"\n 6  \"log\"\n 7  \"\
    strings\"\n 8 )\n 9 \n10 func main() {\n11  var path = \"invoices.csv\"\n12  filebuffer,\
    \ err := ioutil.ReadFile(path)\n13 \n14  if err != nil {\n15   log.Fatal(err)\n\
    16  }\n17  var inputdata string = string(filebuffer)\n18 \n19  rows := strings.Split(inputdata,\
    \ \"\\n\")\n20  for _, row := range rows {\n21   fmt.Println(\"row:\", row)\n\
    22  }\n23 }\n```\n\n## Challenge\n\nSee if you can split up each row further in\
    \ columns and summarize how much the orders are worth in total.\n\n# Perform operations\
    \ on files and directories\n\nThings you likely want to do to files and directories\
    \ are moving them about, removing them, rename them etc. In short, high-level\
    \ operations that is less about the content of the file but doing something with\
    \ it.\n\n## Introduction\n\nIn this chapter you will:\n\n*   Analyze a file for\
    \ its metadata like size, modified date and more.\n\n*   Copy files from one location\
    \ to the next.\n\n*   Rename files.\n\n*   Remove files.\n\n*   Create and read\
    \ directories.\n\n## File information\n\nYou might want to look at a specific\
    \ file and find out various details about it. Things that can be interesting are:\n\
    \n*   **Name**, maybe youu started from a path looking at a list of file. Getting\
    \ the filename can be valuable.\n\n*   **Size**. Getting the size of disc can\
    \ be good to know.\n\n*   **Permission**. To know what permissions you have tells\
    \ you want you are able to do with the file, like running it, writing to it and\
    \ so on.\n\n*   **Last modified**. You might have a query looking for newly updated\
    \ files only. Inspecting the modified date is what you want.\n\n*   **Is a directory**.\
    \ Files and directories are ultimately just files. There’s a flag distinguishing\
    \ a file from a directory.\n\nTo get file information, use the `Stat()` function\
    \ like so:\n\n```\n1 fileStat, err := os.Stat(path)\n2 fmt.Println(\"File Name:\"\
    , fileStat.Name())        // Base name of the file\n3 fmt.Println(\"Size:\", fileStat.Size())\
    \             // Length in bytes for regular fil\\\n4 es\n5 fmt.Println(\"Permissions:\"\
    , fileStat.Mode())      // File mode bits\n6 fmt.Println(\"Last Modified:\", fileStat.ModTime())\
    \ // Last modification time\n7 fmt.Println(\"Is Directory: \", fileStat.IsDir())\
    \   // Abbreviation for Mode().IsDir()\n```\n\nAlso when you call `ReadDir()`\
    \ you get back an array of `FileInfo` objects:\n\n```\n1 files, err := ioutil.ReadDir(path)\n\
    ```\n\n## Copy file\n\nCopying a file is really three operations:\n\n*   **open**\
    \ the file at the destination.\n\n*   **create** a new file at a given destination.\n\
    \n*   **copy**, then transfer the content to that location.\n\nHere’s how you\
    \ can implement a *copy* operation:\n\n```\n 1 // copies 'test.txt' and its content\
    \ to 'copy.txt'\n 2 src := \"test.txt\"\n 3 dest := \"copy.txt\"\n 4 \n 5 srcFile,\
    \ err := os.Open(src)\n 6 if err != nil {\n 7   log.Fatal(err)\n 8 }\n 9 defer\
    \ srcFile.Close()\n10 \n11 newFile, err := os.Create(dest)\n12 if err != nil {\n\
    13   log.Fatal(err)\n14 }\n15 defer newFile.Close()\n16 \n17 _, err = io.Copy(newFile,\
    \ srcFile)\n18 if err != nil {\n19   log.Fatal(err)\n20 }\n```\n\n## Rename\n\n\
    Rename is a bit easier to achieve. The `os` package has a `Rename()` function.\
    \ Here’s how to use it:"
