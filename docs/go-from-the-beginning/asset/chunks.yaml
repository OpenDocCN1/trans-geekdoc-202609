  trans: "\n# 处理错误\n\n在本章中，我们将介绍错误处理。\n\n## 介绍\n\n本章将介绍：\n\n* 使用 `panic` 和 `recover`\
    \ 触发并处理错误。\n\n* 使用错误模式以更符合 Go 语言惯例的方式管理错误。\n\n## 错误\n\n我们的应用并不完美，它们会抛出错误。无论是因为我们编写的代码，还是我们使用的包中的代码，都可能导致错误。有时，这正是我们在提供不良输入时期望的行为。\n\
    \n无论如何，我们的用户期望我们能够处理这些错误。此外，为了我们自己的利益，我们需要以一种方式记录这些错误，以便在出现意外错误时能够修复它们。\n\n在 Go\
    \ 中，有两种主要的错误处理方式：\n\n* **panic/recover**。`panic` 和 `recover` 是语言构造。如果你了解其他编程语言，它们类似于\
    \ `throw` 和 `catch`。但这意味着什么呢？这意味着有一个错误，包含错误消息和堆栈跟踪，我们可以捕获并恢复它，或者让程序崩溃。\n\n* **error\
    \ pattern**。这被称为 Go 语言的惯用方式。其思想是从函数调用中返回一个值和一个错误对象。如果发生错误，返回的错误对象不为 `nil`；如果没有错误，则返回\
    \ `nil`。\n\n## 使用 `panic()` 使程序崩溃\n\n让我们以函数 `Divide()` 为例：\n\n```\n1 func Divide(nominator\
    \ int, divider int) float32 {\n2   if divider == 0 {\n3     panic(\"can't divide\
    \ by 0\")\n4   }\n5   return float32(nominator) / float32(divider)\n6 }\n```\n\
    \n它包含一个 `if` 检查。如果 `divider` 为 `0`，则调用 `panic()`。那么会发生什么呢？你会看到类似以下内容：\n\n```\n\
    1 panic: can't divide by 0\n2 \n3 goroutine 1 [running]:\n4 main.Divide(...)\n\
    5         /<path>/panic.go:20\n6 main.main()\n7         /<path>/panic.go:33 +0x96\n\
    8 exit status 2\n```\n\n顶部是你传递给 `panic()` 的错误字符串，即“can’t divide by 0”。然后是堆栈跟踪，指示错误发生的位置。从下往上看，错误始于第\
    \ 33 行，然后是第 20 行，即：\n\n```\n1 panic(\"can't divide by 0\")\n```\n\n因此，我们有了一个方法来保护自己免受不想要的输入值的影响。但崩溃程序是否必要？在某些情况下是，在其他情况下则不是。对于后者，我们有\
    \ `recover()`。\n\n### 使用 `recover()` 捕获错误\n\n使用 `recover()` 是为了捕获错误，使我们的程序能够继续运行。在继续之前，我们需要先了解一个概念，即\
    \ `defer`。`defer` 是一种语言构造，用于延迟函数的执行，直到最近的函数返回。以下是一个示例：\n\n```\n1 defer fmt.Println(\"\
    second\")\n2 fmt.Println(\"first\")\n```\n\n运行此程序，你应该看到：\n\n```\n1 first\n2 second\n\
    ```\n\n> 将 `defer` 视为最后发生的操作。\n\n在捕获错误的上下文中，捕获错误（如果你想捕获它）应该是最后发生的操作。让我们再看 `Divide()`\
    \ 函数：\n\n```\n1 func Divide(nominator int, divider int) float32 {\n2   defer errorHandler()\n\
    3   if divider == 0 {\n4     panic(\"can't divide by 0\")\n5   }\n6   return float32(nominator)\
    \ / float32(divider)\n7 }\n```\n\n可以看到，它现在有一行 `defer errorHandler()`，这将是最后执行的操作。根据\
    \ `divider` 的值，它会调用 `panic()` 或 `return` 语句作为最后一步。\n\n那么 `errorHandler()` 是什么样子呢？\n\
    \n```\n1 func errorHandler() {\n2   if r := recover(); r != nil {\n3     fmt.Println(\"\
    Recovered \", r)\n4   }\n5 }\n```\n\n在 `errorHandler()` 中，我们调用 `recover()` 并将其赋值给变量\
    \ `r`，然后检查它是否为 `nil`。如果不为 `nil`，说明发生了错误，我们打印出来。如果为 `nil`，则用户不会察觉到任何异常。\n"
