    \ 3       <author>Shakespeare</author>\n 4       <title>Romeo and Juliet</title>\n\
    \ 5       <pages>400</pages>\n 6       <type>paperback</type>\n 7       <cost>17</cost>\n\
    \ 8     </book>\n 9     <book>\n10       <author>Shakespeare</author>\n11    \
    \   <title>Hamlet</title>\n12       <pages>270</pages>\n13       <type>paperback</type>\n\
    14       <cost>15</cost>\n15     </book>\n16 </books>\n```\n\nand replace:\n\n\
    *   author with name\n\n*   cost with price\n\nTIP: you might need to apply the\
    \ replace twice.\n\n## Solution II\n\n```\n 1 package main\n 2 \n 3 import (\n\
    \ 4  \"fmt\"\n 5  \"regexp\"\n 6 )\n 7 \n 8 func main() {\n 9  file := `<books>\n\
    10     <book>\n11       <author>Shakespeare</author>\n12       <title>Romeo and\
    \ Juliet</title>\n13       <pages>400</pages>\n14       <type>paperback</type>\n\
    15       <cost>17</cost>\n16     </book>\n17     <book>\n18       <author>Shakespeare</author>\n\
    19       <title>Hamlet</title>\n20       <pages>270</pages>\n21       <type>paperback</type>\n\
    22       <cost>15</cost>\n23     </book>\n24 </books>`\n25 \n26  r := regexp.MustCompile(`(\\\
    <\\/?)(title)(\\>)`)\n27  s := r.ReplaceAllString(file, \"${1}name${3}\")\n28\
    \  fmt.Println(s)\n29 \n30  r = regexp.MustCompile(`(\\<\\/?)(cost)(\\>)`)\n31\
    \  s = r.ReplaceAllString(s, \"${1}price${3}\")\n32  fmt.Println(s)\n33 }\n```\n\
    \n# Goroutines and channels\n\nA goroutine is a lightweight thread managed by\
    \ the Go runtime.\n\nChannels is how you communicate between routines.\n\n## Introduction\n\
    \nIn this chapter you will:\n\n*   Understand the difference between concurrency\
    \ and parallelism\n\n*   Use Goroutines to run your functions\n\n*   Create and\
    \ use channels to communicate between your Goroutines\n\n*   Apply Goroutines\
    \ to an app that searches files for faster execution.\n\n## Concurrency, what’s\
    \ the benefit\n\nConcurrency is the task of running and managing the multiple\
    \ computations at the same time. While *parallelism* is the task of running multiple\
    \ computations simultaneously.\n\nSo what are some benefits:\n\n*   **Faster processing**.\
    \ The benefit is getting tasks done faster. Imagine that you are searching a computer\
    \ for files, or processing data, if it’s possible to work on these workloads in\
    \ parallel, you end up getting the response back faster.\n\n*   **Responsive apps**\
    \ Another benefit is getting more responsive apps. If you have an app with a UI,\
    \ imagine it would be great if you can perform some background work without interrupting\
    \ the responsiveness of the UI.\n\n## Goroutines\n\nA goroutine is a lightweight\
    \ thread managed by the Go runtime. What you do is to add the keyword `go` in\
    \ front of a function. Here’s an example:\n\n```\n1 go myFunction()\n```\n\nImagine\
    \ the following code running, what would happen?\n\n```\n 1 package main\n 2 \n\
    \ 3 import \"fmt\"\n 4 \n 5 func myFunction() {\n 6  for i := 0; i < 3; i++ {\n\
    \ 7   fmt.Println(\"my function: \", i)\n 8  }\n 9 }\n10 func anotherFunction()\
    \ {\n11  for i := 4; i <7; i++ {\n12   fmt.Println(\"another function: \", i)\n\
    13  }\n14 }\n15 \n16 func main() {\n17  go myFunction()\n18  anotherFunction()\n\
    19 }\n```\n\nIt would only print the result from `anotherFunction()` as it takes\
    \ a short while for the go routine to start up. You can have the go routine execute\
    \ as well by adding a little delay, like so:\n\n```\n1 func main() {\n2  go myFunction()\n\
    3  anotherFunction()\n4  time.Sleep(1 * time.Second)\n5 }\n```\n\nThe result is\
    \ now the following:\n\n```\n1 another function:  4\n2 another function:  5\n\
    3 another function:  6\n4 my function:  0\n5 my function:  1\n6 my function: \
    \ 2\n```\n\nThe function with the go routine finishes last. Lets modify the code\
    \ slightly and have the two functions use a delay, so we simulate workloads taking\
    \ different time to finish:\n\n```\n 1 func myFunction() {\n 2  time.Sleep(1500\
    \ * time.Millisecond)\n 3  for i := 0; i < 3; i++ {\n 4   fmt.Println(\"my function:\
    \ \", i)\n 5  }\n 6 }\n 7 func anotherFunction() {\n 8  time.Sleep(500 * time.Millisecond)\n\
    \ 9  for i := 4; i < 7; i++ {\n10   fmt.Println(\"another function: \", i)\n11\
    \  }\n12 }\n13 \n14 func main() {\n15  go myFunction()\n16  go anotherFunction()\n\
    17  time.Sleep(2 * time.Second)\n18 }\n```\n\nat this point, `anotherFunction()`\
    \ finishes first as it has the shortest delay, which is to be expected. Here’s\
    \ what the output looks like now:\n\n```\n1 another function:  4\n2 another function:\
    \  5\n3 another function:  6\n4 my function:  0\n5 my function:  1\n6 my function:\
    \  2\n```\n\n### Use case - a file search\n\nImagine you have case where you need\
    \ to find a file on disk. If you write a function like so, it will search a directory\
    \ and report back the result if the file is found:\n\n```\n 1 func SearchFiles(dir\
    \ string, lookFor string) string {\n 2  log.Println(\"[SEARCHING] \", dir)\n 3\
    \  files, err := ioutil.ReadDir(dir)\n 4  if err != nil {\n 5   log.Fatal(err)\n\
    \ 6  }\n 7 \n 8  for _, file := range files {\n 9   log.Println(dir+file.Name(),\
    \ file.IsDir())\n10   if file.Name() == lookFor {\n11    return \"[FOUND] \" +\
    \ filepath.Join(dir, file.Name())\n12   }\n13  }\n14  return \"[NOT FOUND] \"\
    \ + dir\n15 }\n```\n\nImagine you now run this code like so, to search many directories:\n\
    \n```\n1 result := make([]string, 0)\n2 append(result, SearchFile(\"./tmp\", \"\
    myfile.txt\"))\n3 append(result, SearchFile(\"./tmp2\", \"myfile.txt\"))\n4 append(result,\
    \ SearchFile(\"./tmp3\", \"myfile.txt\"))\n5 append(result, SearchFile(\"./tmp4\"\
    , \"myfile.txt\"))\n6 \n7 for i := 0 i< len(result); i++ {\n8   fmt.Println(result[i])\n\
    9 }\n```\n\nIf found, you will get an output similar to the below, depending on\
    \ whether *myfile.txt* is found in any of the searched directories:\n\n```\n1\
    \ [FOUND] ./tmp/myfile.txt\n2 [NOT FOUND] ./tmp2/myfile.txt\n3 [NOT FOUND] ./tmp3/myfile.txt\n\
    4 [NOT FOUND] ./tmp4/myfile.txt\n```\n\nNow to speed up this process, it would\
    \ be great if you are able to search many directories at once, so you could type\
    \ something like so:\n\n```\n1 go SearchFile(\"./tmp\", \"myfile.txt\")\n2 go\
    \ SearchFile(\"./tmp2\", \"myfile.txt\")\n3 go SearchFile(\"./tmp3\", \"myfile.txt\"\
    )\n4 go SearchFile(\"./tmp4\", \"myfile.txt\")\n```\n\nThis works, it now searches\
    \ all directories, in parallel. However, now we don’t have a way to get the response\
    \ back as we can’t write like so:\n\n```\n1 result := make([]string, 0)\n2 go\
    \ append(result,SearchFile(\"./tmp\", \"myfile.txt\")) // won't compile, says\
    \ \"go disca\\\n3 rds results\"\n```\n\nSo how can we get the result from a go\
    \ routine, the answer is by using channels, so lets discuss those next.\n\n##\
    \ Channels\n\nA channel is how we can communicate cross go routines but also between\
    \ go routines and the part of our code not using a go routine.\n\nThe idea is\
    \ to send a value to a channel, and have part of our code listen to values from\
    \ a channel.\n\n### Creating a channel\n\nTo create a channel, you need the keyword\
    \ `chan` and the data type of the messages you are about to send into it. Here’s\
    \ an example:\n\n```\n1 ch := make(chan int)\n```\n\nIn the above example, a channel\
    \ `ch` will be created that accepts messages of type `int`.\n\n### Sending a value\
    \ to a channel\n\nTo send to a channel, you need to use this operator `<-`, it\
    \ look like a left pointing arrow and is meant to be read as the direction something\
    \ is sent. Here’s an example of sending a message to a channel:\n\n```\n1 ch <-\
    \ 2\n```\n\nIn the above code, the number 2 is sent into the channel `ch`.\n\n\
    ### Listening to a channel\n\nTo listen to a channel, you again use the arrow\
    \ `<-`, but this time you need a receiving variable on the left side and the channel\
    \ on the right side, like so:\n\n```\n1 value := <- ch\n```\n\n### Matching sending\
    \ and receiving\n\nLet’s say you have the following code:\n\n```\n 1 package main\n\
    \ 2 \n 3 import \"fmt\"\n 4 \n 5 func produceResults(ch chan int) {\n 6  ch <-\
    \ 1\n 7  ch <- 2\n 8 }\n 9 \n10 func main() {\n11  ch := make(chan int)\n12  go\
    \ produceResults(ch)\n13 \n14  var result int\n15  result = <-ch\n16  fmt.Println(result)\n\
    17  result = <-ch\n18  fmt.Println(result)\n19 }\n```\n\nYou are invoking `produceResults()`\
    \ and it sends messages to the channel twice:\n\n```\n1 ch <- 1\n2 ch <- 2\n```\n\
    \nin `main()`, you receive the results:"
