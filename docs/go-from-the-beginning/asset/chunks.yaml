- raw: "*   **parameters**, 0 to many parameters\n\n*   **a function body**, i.e.\
    \ statements that say what the function does.\n\n*   **a return construct**, if\
    \ the function returns something.\n\nHere’s an example:\n\n```\n1 func add(first\
    \ int, second int) int {\n2   return first + second\n3 }\n```\n\nIn the preceding\
    \ code, the function is named `add()`. It has the parameters `first` and `second`.\
    \ The function body, what the function does, consists of this code:\n\n```\n1\
    \ return first + second\n```\n\n## Adding a return type\n\nTo add a return type,\
    \ we add that after the function parenthesis in form of a type. Here’s an example:\n\
    \n```\n1 add(firstNumber int, secondNumber int) int {\n2  ...\n3 }\n```\n\nBecause\
    \ we’ve added a return type of `int`, our function must return something. A way\
    \ to return a value is by using the keyword `return`, like so:\n\n```\n1 add(firstNumber\
    \ int, secondNumber int) int {\n2   return firstNumber + secondNumber \n3 }\n\
    ```\n\n### Named return\n\nWe can also name the return parameter like so:\n\n\
    ```\n1 add(firstNumber int, secondNumber int) (sum int) {\n2   sum = firstNumber\
    \ + secondNumber \n3   return\n4 }\n```\n\n*   Note how `sum` is part of function\
    \ prototype declaration `(sum int)` and then assigned a value `sum = firstNumber\
    \ + secondNumber`.\n\n*   There’s also a `return` on its own row, this code will\
    \ compile as there’s a notion of a return variable.\n\n## Multiple returns\n\n\
    It’s possible to return more than one value.\n\nJust like you returned a named\
    \ parameter via `(sum int)`, you can comma separate like so `(sum int, product\
    \ int)`. When returning multiple values, you can type like so:\n\n```\n1 sum =\
    \ first + second\n2 product = first * second\n3 return\n```\n\nBoth `sum` and\
    \ `product` are assigned values and you have a closing `return`.\n\nPutting it\
    \ altogether you get a function that looks like so:\n\n```\n1 func calc(first\
    \ int, second int) (sum int, product int) {\n2   sum = first + second\n3   product\
    \ = first * second\n4   return\n5 }\n```\n\nTo call the function, you type like\
    \ so:\n\n```\n1 sum, product := calc(1, 2)\n2 fmt.Println(sum)\n3 fmt.Println(product)\n\
    ```\n\nNote how you assign the two returned values to variables `sum` and `product`.\n\
    \n## Assignment - adding a function to a program\n\n1.  Create a file *main.go*\
    \ and give it the following content: \n\n    ```\n    1  package main\n    2 \
    \ \n    3  import \"fmt\"\n    4  \n    5  func main() {\n    6  \n    7  }\n\
    \    ```\n\n2.  Add a function `log()`, that we can use to print messages.\n\n\
    \    Added to the program, your code should now look like so:\n\n    ```\n   \
    \  1  package main\n     2  \n     3  import \"fmt\"\n     4  \n     5  func log()\
    \ {\n     6    fmt.Println(\"message\")\n     7  }\n     8  \n     9  func main()\
    \ {\n    10    log()\n    11  }\n    ```\n\nAt this point, the `log()` function\
    \ isn’t very flexible, it prints “message” every time it’s invoked.\n\nTo make\
    \ the `log()` function more flexible, lets add a parameter.\n\n### Adding a parameter\n\
    \nA parameter needs a data type, in this case, we will make it of type `string`.\n\
    \n1.  Add the parameter within the parenthesis `()`, like so: \n\n    ```\n  \
    \  1  func log(message string) {\n    2    fmt.Println(message)\n    3  }\n  \
    \  4  \n    5  // to use\n    6  log(\"hi\")\n    7  log(\"there\")\n    ```\n\
    \nNote how the `log()` function takes the parameter `message` that is of type\
    \ string. Our code is more flexible.\n\n## Solution\n\n```\n 1 package main\n\
    \ 2     \n 3 import \"fmt\"\n 4 \n 5 func log(message string) {\n 6   fmt.Println(message)\n\
    \ 7 }\n 8 \n 9 func main() {\n10   log(\"hi\")\n11   log(\"there\")\n12 }\n```\n\
    \n# Handling errors\n\nIn this chapter, we will cover error handling.\n\n## Introduction\n\
    \nThis chapter will cover:\n\n*   Causing and handling errors with `panic` and\
    \ `recover`.\n\n*   Use the error pattern to use a more idiomatic approach to\
    \ managing errors.\n\n## Errors\n\nOur apps aren’t perfect, they will throw errors.\
    \ Either they throw errors because of code we wrote or because of code written\
    \ in a package we are using. Sometimes, that’s even what the code is supposed\
    \ to do when we feed it bad input.\n\nRegardless, our users expect us to handle\
    \ these errors. Also, for our own sake, we need to log these errors in such a\
    \ way that we can fix those errors if they are unexpected.\n\nThere are two major\
    \ ways to handle errors in Go:\n\n*   **panic/recover**. `panic` and `recover`\
    \ are language constructs. If you know another programming language, they function\
    \ like throw and catch. What does it mean though? It means there’s an error, with\
    \ an error message and stack trace that we can catch and recover from or let it\
    \ crash the program.\n\n*   **error pattern**. This is referred to as the idiomatic\
    \ Go way of doing things. The idea is to return a value and an error object from\
    \ a function call. If an error occurred, it contains an error object or `nil`,\
    \ if no error.\n\n## Crash the program with `panic()`\n\nLet’s take this function\
    \ `Divide()`:\n\n```\n1 func Divide(nominator int, divider int) float32 {\n2 \
    \  if divider == 0 {\n3     panic(\"can't divide by 0\")\n4   }\n5   return float32(nominator)\
    \ / float32(divider)\n6 }\n```\n\nIt has an `if` check. If `Divider()` is `0`\
    \ then it calls `panic()`. So what happens then? You see something like:\n\n```\n\
    1 panic: can't divide by 0\n2 \n3 goroutine 1 [running]:\n4 main.Divide(...)\n\
    5         /<path>/panic.go:20\n6 main.main()\n7         /<path>/panic.go:33 +0x96\n\
    8 exit status 2\n```\n\nAt the top is the error string you sent to `panic()`,\
    \ the string “can’t divide by 0”. Then you have the stack trace, entries that\
    \ indicate where the error started. Read it from the bottom, the error started\
    \ on line 33, then you have line 20, which is this row:\n\n```\n1 panic(\"can't\
    \ divide by 0\")\n```\n\nOk, so we have a way to protect ourselves from input\
    \ values that we don’t want. But crashing the program, is that necessary? In some\
    \ cases, it is, in some cases, it isn’t. For the latter cases, we have `recover()`.\n\
    \n### Capture the error with `recover()`\n\nUsing `recover()` is about capturing\
    \ an error so our program can continue. We need to learn about a concept before\
    \ proceeding. That concept is `defer`. `defer` is a language construct that delays\
    \ the execution of a function until the nearby function returns. Here’s an example:\n\
    \n```\n1 defer fmt.Println(\"second\")\n2 fmt.Println(\"first\")\n```\n\nRunning\
    \ this program, you should see:\n\n```\n1 first\n2 second\n```\n\n> See `defer`\
    \ as the last thing that happens.\n\nHow is this useful in the context of capturing\
    \ an error? Capturing errors, if you want to capture it, is something you want\
    \ to do as the last thing that happens. Take our `Divide()` function again:\n\n\
    ```\n1 func Divide(nominator int, divider int) float32 {\n2   defer errorHandler()\n\
    3   if divider == 0 {\n4     panic(\"can't divide by 0\")\n5   }\n6   return float32(nominator)\
    \ / float32(divider)\n7 }\n```\n\nNote how it now has a line in it that says `defer\
    \ errorHandler()`. It will be run the last thing that happens. Depending on the\
    \ value of `divider`, it will either call `panic()` or call the `return` statement\
    \ as the last thing.\n\nOk, so what does `errorHandler()` look like?\n\n```\n\
    1 func errorHandler() {\n2   if r := recover(); r != nil {\n3     fmt.Println(\"\
    Recovered \", r)\n4   }\n5 }\n```\n\nIn `errorHandler()`, we invoke `recover()`\
    \ and assign it to variable `r` and then we test it for `nil`. If it’s NOT `nil`\
    \ then we have an error and we print it out. If it is `nil` then the user notices\
    \ nothing.\n\n## Improve the error handling\n\nThere are steps we can take to\
    \ improve the error handling. So far, we’re printing back an error message. Imagine\
    \ if someone read this error from a log file, would they be able to understand\
    \ where things went wrong and fix the input data or the code itself?\n\nThere\
    \ are a couple of things we can do:\n\n*   **Inspect the error**. Our error didn’t\
    \ only come with an error message, there’s a stack trace as well.\n\n*   **Logging**.\
    \ If we want someone to work with these errors, we should look at logging them\
    \ to a file.\n\n### Inspect the error with `runtime/debug`"
