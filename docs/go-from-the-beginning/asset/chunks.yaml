    \ } else {\n25    fmt.Println(\"Unknown command\", response)\n26   }\n27 \n28\
    \  }\n29  fmt.Println(\"bye\")\n30 }\n```\n\nAdd your own code where the comments\
    \ are\n\n## Solution\n\n```\n 1 package main\n 2 \n 3 import (\n 4  \"fmt\"\n\
    \ 5 )\n 6 \n 7 func main() {\n 8  // create array\n 9  arr := make([]string, 0)\n\
    10 \n11  var response string\n12  for {\n13   fmt.Print(\"command> \")\n14   fmt.Scan(&response)\n\
