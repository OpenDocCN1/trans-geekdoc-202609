- raw: "There’s a library `runtime/debug`. With this library, you can find out more\
    \ about an error when it’s thrown, information like stack trace, where the error\
    \ originated. There’s a function `Stack()` that produces the stack trace. Here’s\
    \ how to use it:\n\n```\n1 debug.Stack()\n```\n\n### Log the error with `log`\n\
    \nWhile `runtime/debug` can produce a stack trace, what would be useful is logging\
    \ all this error information to a file. To log to a file, use the `os` and `log`\
    \ package like so:\n\n```\n1 f, err := os.OpenFile(\"logs\", os.O_WRONLY|os.O_CREATE|os.O_APPEND,\
    \ 0644)\n2  if err != nil {\n3   log.Println(err)\n4  }\n5  log.SetOutput(f)\n\
    ```\n\n## Use the error pattern with the `errors` package\n\nOther languages tend\
    \ to use Exceptions to signal that something is wrong.\n\nGo has a different and\
    \ idiomatic approach. It wants you to create errors as return values to a function,\
    \ next to the actual value being returned. You are then expected to inspect a\
    \ function and see if it returns an error.\n\nThere’s an `errors` package that\
    \ can help us with the above approach.\n\n### Define an error\n\nTo define an\
    \ error, we call the `New()` function with a string describing the error, here’s\
    \ an example:\n\n```\n1 var NoTooSmall = errors.New(\"the number is too small\"\
    )\n```\n\nNext, let’s look at how to add the error to a function.\n\n### Return\
    \ an error\n\nLet’s start with function that uses a `panic()` as error handling:\n\
    \n```\n1 func ReturnPositive(no int) int {\n2   if no > 0 {\n3     return no\n\
    4   } else {\n5     panic(\"No too small\")\n6   }\n7 }\n```\n\nWe can improve\
    \ this function, by ensuring it always returns the result and an error, like so:\n\
    \n```\n1 func ReturnPositive(no int) (int, error) {\n2   if no > 0 {\n3     return\
    \ no, nil\n4   } else {\n5     return 0, NoTooSmall\n6   }\n7 }\n```\n\nNote in\
    \ the `if` clause that it returns `no` and `nil` when everything is fine. For\
    \ the `else`, it returns a bogus value and our error `NoTooSmall`.\n\n### Inspect\
    \ the result\n\nLet’s see how we would call the `ReturnPositive()` function and\
    \ use this new pattern we established:\n\n```\n1 no, err := ReturnPositive(-2)\n\
    2 if err != nil {\n3   fmt.Println(\"error: \", err)\n4 } else {\n5   fmt.Println(\"\
    value:\", no)\n6 }\n```\n\nWhat you are seeing above is how we use an `if` clause\
    \ to check for errors, if so, print out. On the `else`, we have our actual value.\n\
    \n## Assignment I - add error handling\n\nIn this exercise, we’ll add error handling\
    \ to our program.\n\n1.  Create a file *panic.go* and give it the following content:\
    \ \n\n    ```\n     1 package main\n     2 \n     3 import (\n     4   \"fmt\"\
    \n     5 )\n     6  \n     7  // func errorHandler() {\n     8  // if r := recover();\
    \ r != nil {\n     9  //  fmt.Println(\"Recovered \", r)\n    10  // }\n    11\
    \  // }\n    12  \n    13  func Divide(nominator int, divider int) float32 {\n\
    \    14   // defer errorHandler()\n    15   if divider == 0 {\n    16    panic(\"\
    can't divide by 0\")\n    17   }\n    18   return float32(nominator) / float32(divider)\n\
    \    19  }\n    20  \n    21  func main() {\n    22   no := Divide(10, 0)\n  \
    \  23   fmt.Println(no)\n    24   no = Divide(10, 1)\n    25   fmt.Println(no)\n\
    \    26  }\n    ```\n\n2.  Run the program `go run panic.go`\n\n    ```\n    1\
    \ go run panic.go\n    ```\n\n    You should see output similar to:\n\n    ```\n\
    \    1 panic: can't divide by 0\n    2 \n    3  goroutine 1 [running]:\n    4\
    \  main.Divide(...)\n    5          /<path>/panic.go:20\n    6  main.main()\n\
    \    7          /path/panic.go:33 +0x96\n    8  exit status 2\n    ```\n\n   \
    \ Note how these two statements was never run as the program crashed:\n\n    ```\n\
    \    1 no = Divide(10, 1)\n    2 fmt.Println(no)\n    ```\n\n3.  Uncomment the\
    \ commented out part and run the app again.\n\n    You should now see the following\
    \ output:\n\n    ```\n    1 Recovered  can't divide by 0\n    2 0\n    3 10\n\
    \    ```\n\nCongrats, you’ve managed to implement error handling with `panic()`\
    \ and `recover()`.\n\n## Solution I\n\n```\n 1 package main\n 2 \n 3 import (\n\
    \ 4    \"fmt\"\n 5 )\n 6    \n 7 func errorHandler() {\n 8    if r := recover();\
    \ r != nil {\n 9       fmt.Println(\"Recovered \", r)\n10    }\n11 }\n12    \n\
    13 func Divide(nominator int, divider int) float32 {\n14   // defer errorHandler()\n\
    15   if divider == 0 {\n16     panic(\"can't divide by 0\")\n17   }\n18   return\
    \ float32(nominator) / float32(divider)\n19 }\n20    \n21 func main() {\n22  \
    \ no := Divide(10, 0)\n23   fmt.Println(no)\n24   no = Divide(10, 1)\n25   fmt.Println(no)\n\
