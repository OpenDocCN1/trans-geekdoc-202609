    \ The method *belongs* to `Address` and we can see that with `(...)` right after\
    \ the `func` keyword that takes `a Address`. The rest of the implementation returns\
    \ a formatted string via `Sprintf()`. Given the following code:\n\n```\n1 var\
    \ address Address\n2 address.city = \"London\"\n3 address.street = \"Buckingham\
    \ palace\"\n4 address.postal = \"SW1\"\n5 fmt.Println(address.string())\n```\n\
    \nWe would get the following output when calling `string()`:\n\n```\n1 City: London,\
    \ Street: Buckingham palace, Postal address: SW1\n```\n\n## Assignment - defining\
    \ a struct\n\nDefine a struct representing a row in a shopping basket for an e-commerce\
    \ store.\n\nHere’s example data:\n\n```\n1 Title, Description, Quantity, Price\
