    \ call the code from the module that you mean to use\n\n*   **Ensure it’s downloaded**,\
    \ so your code can be run.\n\n## Import module\n\nTo import a module, you can\
    \ do one of two things:\n\n*   `go get <path to module>`, this will fetch the\
    \ module and download it and make it available for your project to use.\n\n* \
    \  `go mod tidy`, this command checks the imports used in your program and fetches\
    \ the module if not fetched already.\n\n## Use it in code\n\nTo use your module\
    \ in code, you need to add it to the `import` section and then invoke it where\
    \ you need it in the application code.\n\n```\n1 import (\n2   \"github.com/<user>/<repo\
    \ name>\"\n3 )\n4 \n5 func main() {\n6   <repo name>.<Function>()\n7 }\n```\n\n\
