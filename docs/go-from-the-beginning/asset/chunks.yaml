- raw: "    ```\n    1  regexp.MatchString(\"PA*\", \"PA\")\n    2  regexp.MatchString(\"\
    PA*\", \"PA111\")\n    ```\n\n*   `?`, also known as a greedy or optional quantifier.\
    \ It looks backwards and makes it optional and takes it, if it can. Consider this\
    \ case:\n\n    ```\n    1  http\n    2  https\n    ```\n\n    If you want to match\
    \ them both, you can type:\n\n    ```\n    1  https?\n    ```\n\n    Another example\
    \ is:\n\n    ```\n    1  r, _ := regexp.Compile(\"an.\")\n    2  matches := r.FindAllString(\"\
    and ant an\", -1)\n    ```\n\n    The above will only match **and** and **ant**\
    \ but not *an*. If we modify the regex to `an.?` it will match **and ant an**.\n\
    \n## Anchors and boundaries\n\nThere are different anchors you can use like for\
    \ example:\n\n*   `^`, beginning of the string. The following states that the\
    \ string needs to begin with the following string “INV” to signify the start of\
    \ an invoice row: \n\n    ```\n    1  ^INV\n    ```\n\n*   `$`, end of the string.\
    \ An example could be matching a string ends with a certain domain “.com”: \n\n\
    \    ```\n    1  \\.com$\n    ```\n\n## Groups\n\nGroups are way to capture part\
    \ of a string and have that returned. It’s very useful for parsing out the info\
    \ you need. Consider this example parsing out the info from a CSV row:\n\n```\n\
    1 Name: myarticle, Price: 114, Quantity: 3 \n```\n\nTo get the data you need,\
    \ you want everything after the colon, :. You can construct a RegEx like so:\n\
    \n```\n1 \\w+:\\s?(\\w+)\n```\n\nwhat we are doing is defining we want to capture\
    \ a group using parenthesis `()` but that group should happen after:\n\n*   a\
    \ number of letters, `\\w+`\n\n*   followed by a colon, `:`\n\n*   followed by\
    \ 0 or 1 space `\\s?`\n\n*   then our group `(\\w+)`, one ore more letters\n\n\
    All this ends up capturing myarticle, 114 and 3.\n\n## Named groups\n\nA named\
    \ group is a group you want to capture where the groups have names. Why would\
    \ you want that? Well, say that you want to break down a URL in pieces and wants\
    \ to know what’s what. Given a URL “http://myapi.com/products?page=1”, you have:\n\
    \n*   `http`, the protocol.\n\n*   `myapi.com`, the domain.\n\n*   `/products`,\
    \ is the route.\n\n*   `?page=1`, is the query parameters.\n\nSo how can we break\
    \ it apart and give it a name?\n\nWell, to break it apart, we will use something\
    \ called named groups, it will allow us to look at our matches and know what’s\
    \ what. So instead of getting:\n\n```\n1 http\n```\n\nWe will get a key and value\
    \ that says:\n\n```\n1 protocol: http\n```\n\nSyntax wise, we need to use `?<name\
    \ of our group>` within our parenthesis ().\n\nYou use the following syntax:\n\
    \n```\n1 (?<mygroup>\\w+)\n```\n\nIn Go, we need a `P` right after the question\
    \ mark, so the code for this would be:\n\n```\n1 r, err := regexp.Compile(`(?P<mygroup>\\\
    w+):`)\n```\n\n### Extract the data from a URL\n\nLet’s approach this problem\
    \ then given the string “http://myapi.com/products?page=1”:\n\n\\- matching the\
    \ protocol:\n\n```\n1     ^(?<protocol>\\w+):\n```\n\n\\- domain, to match the\
    \ domain as well, we’re looking to capture everything after http:// and until\
    \ the next /:\n\n```\n1    ^(?<protocol>\\w+):\\/\\/(?<domain>\\w+\\.\\w+)\\/?\n\
    ```\n\n*   route, ok so we’ve matched up “http://mydomain.com” so far, now lets\
    \ match the route, i.e what happens after the / but before any questions marks,\
    \ ?\n\n*   query params\n\nHere’s what our Go code would look like:\n\n```\n1\
    \ r, err := regexp.Compile(`^(?P<protocol>\\w+):\\/\\/(?P<domain>\\w+\\.\\w+)\\\
    /(?P<route>\\w+\\\n2 )\\/?`)\n```\n\nOk, so we have the pattern, what about printing\
    \ the parsed parts?\n\nTo pair the named groups with their values, we need to\
    \ combine values from both the Regex and the response. First, we call `FindStringSubmatch()`,\
    \ that will give us the values.\n\n```\n1 m := r.FindStringSubmatch(\"http://myapi.com/products\"\
    )\n```\n\nThen, we need to match the names with these values. We will need to\
    \ call `r.SubexpNames()` and iterate over the response.\n\n```\n1 result := make(map[string]string)\n\
    2  for i, name := range r.SubexpNames() {\n3   if i != 0 && name != \"\" {\n4\
    \    result[name] = m[i]\n5   }\n6  }\n```\n\nNote this line where each name is\
    \ assigned a value:\n\n```\n1 result[name] = m[i]\n```\n\nFinally, to get the\
    \ values, we can print them out as they are now in a map structure:\n\n```\n1\
    \ fmt.Println(result[\"protocol\"]) // http\n2 fmt.Println(result[\"domain\"])\
    \ // myapi.com\n3 fmt.Println(result[\"route\"]) // products\n```\n\n## Assignment\
    \ - create a Go program that parses a URL\n\nFrom the above use case on named\
    \ groups, write a Go program that takes a URL and analyzes it. It should work\
    \ like so:\n\n```\n1 Type URL: http://myapi.com/products\n2 The URL consist of:\n\
    3 protocol: http\n4 domain: myapi.com\n5 route: products\n```\n\n### Solution\n\
    \n```\n 1 package main\n 2 \n 3 import (\n 4  \"fmt\"\n 5  \"log\"\n 6  \"regexp\"\
    \n 7 )\n 8 \n 9 func main() {\n10  var url string\n11  fmt.Println(\"Type URL:\
    \ \")\n12  fmt.Scan(&url)\n13 \n14  r, err := regexp.Compile(`^(?P<protocol>\\\
    w+):\\/\\/(?P<domain>\\w+\\.\\w+)\\/(?P<route>\\w\\\n15 +)\\/?`)\n16  if err !=\
    \ nil {\n17   log.Fatal(\"Error compiling: \", err)\n18  }\n19  m := r.FindStringSubmatch(url)\n\
    20  if m == nil {\n21   panic(\"mo match\")\n22  }\n23  result := make(map[string]string)\n\
    24  for i, name := range r.SubexpNames() {\n25   if i != 0 && name != \"\" {\n\
    26    result[name] = m[i]\n27   }\n28  }\n29  fmt.Println(\"The URL consist of:\"\
    )\n30  fmt.Println(result[\"protocol\"])\n31  fmt.Println(result[\"domain\"])\n\
    32  fmt.Println(result[\"route\"])\n33 }\n```\n\n## Replacing\n\nA common use\
    \ case for Regex is when it’s used to replace something with something else.\n\
    \nThere’s more than one method in Go you could be using but one you could use\
    \ is `ReplaceAllString()` that sits on the compiled RegEx object:\n\n```\n1 r\
    \ := regexp.MustCompile(`aa`)\n2  s := r.ReplaceAllString(\"aabbcc\", \"cc\")\
    \ // s = ccbbcc\n```\n\nThe above replaces all occurrences of `aa` with `cc` on\
    \ the string `aabbcc`.\n\nYou can also use capture groups and replace a captured\
    \ group with a string. Here’s an example:\n\n```\n1 r := regexp.MustCompile(`(\\\
    d)`)\n2  s := r.ReplaceAllString(\"productid:114\", \"0${1}\") // s = productid:0114\n\
    ```\n\nin the above case, we replace 114 with itself but we also prepend it with\
    \ a 0.\n\n### Use case, replace XML Nodes\n\nImagine you are working with XML\
    \ for example and want to rename all nodes with a certain name.\n\nHere’s your\
    \ XML\n\n```\n 1 <books>\n 2     <book>\n 3       <author>Shakespeare</author>\n\
    \ 4       <title>Romeo and Juliet</title>\n 5       <pages>400</pages>\n 6   \
    \    <type>paperback</type>\n 7       <cost>17</cost>\n 8     </book>\n 9    \
    \ <book>\n10       <author>Shakespeare</author>\n11       <title>Hamlet</title>\n\
    12       <pages>270</pages>\n13       <type>paperback</type>\n14       <cost>15</cost>\n\
    15     </book>\n16 </books>\n```\n\nImagine `title` should be replaced by `name`,\
    \ how do we do that?\n\nWell, it would be straight forward to replace title by\
    \ name. Let’s say we have this file content though:\n\n```\n 1 <books>\n 2   \
    \  <book>\n 3       <author>Shakespeare</author>\n 4       <title>The title is\
    \ Romeo and Juliet</title>\n 5       <pages>400</pages>\n 6       <type>paperback</type>\n\
    \ 7       <cost>17</cost>\n 8     </book>\n 9 \n10 </books>\n```\n\nThen we would\
    \ not only rename the element `title` to `name` but also the content would be\
    \ replaced o “The title is Romeo and Juliet”, that’s NOT what we want.\n\nWe need\
    \ to restrict the replace operation to only target element, like so:\n\n```\n\
    1 \\<\\/?(title)\\>\n```\n\nThe above would match for example `<title>` and `</title>`.\
    \ If we try this however on this XML, we almost get what we want:\n\n```\n1 <author>Shakespeare</author>\n\
    ```\n\nbecomes\n\n```\n1 nameShakespearename\n```\n\nWhat happened, why did we\
    \ loose `<>` ? We need a way to express keeping what was there before AND replace\
    \ the name. A way to do that is to express capture groups on `<>` and the element\
    \ name, like so:\n\n```\n1 (\\<\\/?)(title)(\\>)\n```\n\nNow we have three groups,\
    \ we need to fit the result together, and this is something we can express like\
    \ so:\n\n```\n1 ${1}name${3}\n```\n\n*   `${1}` corresponds to capture group matching\
    \ `<` or `</`\n\n*   `name` is the string we replace `title` with.\n\n*   `{3}`\
    \ corresponds to capture group matching `>`.\n\n## Assignment - replace content"
