    # Working with strings


    There are many reasons why we need to work with strings in different ways. Below
    are some situations that you are likely to encounter and that the `strings` library
    has a solution for:


    *   **user input**, or other types of storage may contain special characters that
    you need to cater for.


    *   **inspection**, does the string contain what we need for our business logic?


    *   **parsing**, splitting the file until we get what we need, could be things
    like a number or date for example.


    *   **presentation**, sometimes we need to present the text in certain way in
    a UI for example, to highlight said information.


    ## Handling special characters


    Lets say we read user input and we want to interpret what we get as a number.
    To make our program robust, we’re ok with the user typing spaces or newline characters.
    The following input should be allowed:


    ```

    1 114

    2    114

    3 114\n

    ```


    There’s three methods of interest to handle such a case for us, namely `Trim()`,
    `TrimLeft()` and `TrimRight()`.


    *   `Trim()`, what it does is remove whitespace characters from both left and
    right side.


    *   `TrimLeft()`. It removes whitespace from the left side only, and if you specify
    special characters as well.


    *   `TrimRight()`. It removes whitespace from the right side only, and if you
    specify special characters as well.

