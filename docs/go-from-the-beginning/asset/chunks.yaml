    \ the directory exist first. The way to do that is to use the `IsNotExist()` function\
    \ like so:\n\n```\n 1 _, err := os.Stat(dirName)\n 2 \n 3  if os.IsNotExist(err)\
    \ {\n 4   errDir := os.MkdirAll(dirName, 0755)\n 5   if errDir != nil {\n 6  \
    \  log.Fatal(err)\n 7   }\n 8  } else if err != nil {\n 9   log.Fatal(\"error\
    \ creating dir\")\n10  } else {\n11   log.Fatal(\"directory exist\")\n12  }\n\
    ```\n\nAs you can see on the above code:\n\n1.  you first use the `Stat()` function.\
    \ The `Stat()` returns a `FileInfo` object or an error of type `PathError` if\
    \ path doesn’t exist.\n\n2.  `os.IsNotExist(err)`. This returns `true` if `err`\
    \ is a `PathError`, i.e the path don’t exist, which is good, we want to create\
    \ it.\n\n3.  Finally, we call `os.MkdirAll(dirName, 0755)`. The 755 instruction\
    \ is about permissions on the created directory, which gives the permissions,\
    \ Read/Write/Execute, Read/Execute, Read/Execute. 755 is a common permission set\
    \ on web servers. You essentially want to avoid anyone but you to modify the file.\n\
    \n## Read dir\n\nReading a directory is quite straight forward. You can use the\
