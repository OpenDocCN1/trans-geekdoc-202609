    \ grade a course at different levels depending on the points achieved on the exam.\
    \ For this situation, you need an `else if` construct, a construct that will be\
    \ evaluated if the `if` construct evaluates to false. It differs from `else` in\
    \ that it also takes an expression. Here’s an example where it’s used:\n\n```\n\
    1 if testScore >= testScoreGrade5 {\n2   fmt.Println(\"Top mark\")\n3  } else\
    \ if testScore >= testScoreGrade4 {\n4   fmt.Println(\"Pass with distinction\"\
    )\n5  } else if testScore >= testScoreGrade3 {\n6   fmt.Println(\"Pass with distinction\"\
    )\n7  } else {\n8   fmt.Println(\"Failed\")\n9  }\n```\n\n## Multiple expressions\n\
    \nYour expression can examine more than one variable or condition. There are Boolean\
    \ operators you can use to help you. Here are some operators you are likely to\
    \ encounter:\n\n*   `&&`, evaluates to true if values on the left and right side\
    \ are both true. Here’s an example of this operator in use:\n\n    ```\n    1\
    \   hasGas := true\n    2   hasKeyInIgnition := true\n    3   if hasGas && hasKeyInIgnition\
    \ {\n    4     fmt.Println(\"Can drive car\")\n    5    }\n    ```\n\n    In the\
    \ preceding code, the expression will evaluate to true as both `hasGas` and `hasKeyInIgnition`\
    \ is true.\n\n*   `||` , evaluates to true if either left or right value is true.\
    \ Here’s an example of this operator in use:\n\n    ```\n    1 hasBurger := true\n\
    \    2 hasSandwich := false\n    3 \n    4 if hasBurger || hasSandwich {\n   \
    \ 5   fmt.Println(\"Can eat\")\n    6 }\n    ```\n\n    In the preceding code,\
    \ `hasBurger` is true and that’s enough for this expression to become true.\n\n\
    *   `!`, also known as NOT, it will negate the expression. Here’s an example:\n\
    \n    ```\n    1  hasSandwich := false\n    2 \n    3  if !hasSandwich {\n   \
    \ 4   mt.Println(\"No sandwiches, then I will starve, I only eat sandwiches\"\
    )\n    5  }\n    ```\n\n    Above, the expression will evaluate to true, thanks\
    \ to the negation with `!`.\n\n## Assignment - create a program that tests your\
    \ Boolean logic\n\nIn this assignment, you are creating a program that tests out\
    \ various Boolean logic.\n\n1.  Create a file *main.go* and give it the following\
    \ content: \n\n    ```\n     1  package main\n     2 \n     3  import \"fmt\"\n\
    \     4  \n     5  func main() {\n     6   testScoreGrade5 := 80\n     7   testScoreGrade4\
    \ := 60\n     8   testScoreGrade3 := 50\n     9   testScore := 49\n    10  \n\
    \    11   hasGas := true\n    12   hasKeyInIgnition := true\n    13  \n    14\
    \   hasBurger := true\n    15   hasSandwich := false\n    16  \n    17   printMessage\
    \ := true\n    18   if printMessage {\n    19    fmt.Println(\"Message\")\n  \
    \  20   }\n    21  \n    22   if testScore >= testScoreGrade5 {\n    23    fmt.Println(\"\
    Top mark\")\n    24   } else if testScore >= testScoreGrade4 {\n    25    fmt.Println(\"\
    Pass with distinction\")\n    26   } else if testScore >= testScoreGrade3 {\n\
    \    27    fmt.Println(\"Pass with distinction\")\n    28   } else {\n    29 \
    \   fmt.Println(\"Failed\")\n    30   }\n    31  \n    32   if hasGas && hasKeyInIgnition\
    \ {\n    33    fmt.Println(\"Can drive car\")\n    34   }\n    35  \n    36  \
    \ if hasBurger || hasSandwich {\n    37    fmt.Println(\"Can eat\")\n    38  \
    \ }\n    39  \n    40   if !hasSandwich {\n    41    fmt.Println(\"No sandwiches,\
    \ then I will starve, I only eat sandwiches\")\n    42   }\n    43  }\n    ```\n\
    \n2.  Run the command `go run main.go`, to run the program\n\n    ```\n    1 goo\
    \ run main.go\n    ```\n\n    You should see the following output:\n\n    ```\n\
    \    1  Message\n    2  Failed\n    3  Can drive car\n    4  Can eat\n    5  No\
    \ sandwiches, then I will starve, I only eat sandwiches\n    ```\n\n3.  Try playing\
    \ around with the code, how does the output change if you change `testScore` value\
    \ to 51, 62, 3 or 90?\n\n## \U0001F680 Challenge\n\nA test score shouldn’t be\
    \ negative, how can you add a check for that?\n\n## Solution\n\n```\n 1 package\
    \ main\n 2 \n 3 import \"fmt\"\n 4 \n 5 func main() {\n 6 \ttestScoreGrade5 :=\
    \ 80\n 7 \ttestScoreGrade4 := 60\n 8 \ttestScoreGrade3 := 50\n 9 \ttestScore :=\
    \ 49\n10 \n11 \thasGas := true\n12 \thasKeyInIgnition := true\n13 \n14 \thasBurger\
    \ := true\n15 \thasSandwich := false\n16 \n17 \tprintMessage := true\n18 \tif\
    \ printMessage {\n19 \t\tfmt.Println(\"Message\")\n20 \t}\n21 \n22 \tif testScore\
    \ >= testScoreGrade5 {\n23 \t\tfmt.Println(\"Top mark\")\n24 \t} else if testScore\
    \ >= testScoreGrade4 {\n25 \t\tfmt.Println(\"Pass with distinction\")\n26 \t}\
    \ else if testScore >= testScoreGrade3 {\n27 \t\tfmt.Println(\"Pass with distinction\"\
    )\n28 \t} else {\n29 \t\tfmt.Println(\"Failed\")\n30 \t}\n31 \n32 \tif hasGas\
    \ && hasKeyInIgnition {\n33 \t\tfmt.Println(\"Can drive car\")\n34 \t}\n35 \n\
    36 \tif hasBurger || hasSandwich {\n37 \t\tfmt.Println(\"Can eat\")\n38 \t}\n\
    39 \n40 \tif !hasSandwich {\n41 \t\tfmt.Println(\"No sandwiches, then I will starve,\
    \ I only eat sandwiches\")\n42 \t}\n43 }\n```\n\n## Review & Self Study\n\nHave\
    \ a look at this [official tutorial on flow control](https://go.dev/tour/flowcontrol/6)\
    \ using a Go sandbox.\n\n# Converting between types\n\nThis chapter covers how\
    \ to convert between strings and numbers.\n\n## Introduction\n\nThis chapter will:\n\
    \n*   Introduce uses cases where data conversion makes sense.\n\n*   Showcase\
