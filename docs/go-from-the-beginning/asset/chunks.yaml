    \n# Build a Web API\n\nA Web API is usually what we interact with to serve data\
    \ to our services or a client. Said client may either be web page or tool like\
    \ curl. In this chapter, we will learn to build a Web API that will process requests\
    \ via HTTP.\n\n## Introduction\n\nIn this chapter, you will learn the following:\n\
    \n*   What’s a Web API.\n\n*   The `net/http` library, and its capabilities at\
    \ high-level.\n\n*   Responding to a request.\n\n*   Working with request data\
    \ like router and query parameters but also the body.\n\n*   Using ServeMux, and\
    \ why it may the preferred choice.\n\n## Web API\n\nCommon responsibilities for\
    \ web services are to respond to requests:\n\n*   **asking for data** and serve\
    \ data like JSON, XML images, CSS, HTML\n\n*   **asking to modify a resource**\
    \ either by creating, updating, or deleting it.\n\n## The `net/http` library\n\
    \nThere’s a library `net/http` that will help us build a web server. Building\
    \ a web server with this library involves the following:\n\n*   Create a server\
    \ instance.\n\n*   Define route requests and how to respond to them.\n\n*   Start\
    \ the server instance, making sure it’s accessible on a certain address and port.\n\
    \n### Create a server instance\n\nIn `net/http`, `http` represents your service\
    \ instance.\n\n```\n1 import (\n2  \"fmt\"\n3  \"net/http\"\n4 )\n5 \n6 func main()\
    \ {\n7   // do something with `http`\n8 }\n```\n\n### Define routes\n\nA route\
    \ is you defining logical separations in your app like `products`, `orders` or\
    \ some other area it makes sense to divide your app in.\n\nTo define a route,\
    \ you define a route pattern and function that is invoked when the route is hit:\n\
    \n```\n1 func hello(w http.ResponseWriter, req *http.Request) {\n2   fmt.Fprintf(w,\
    \ \"hello\\n\")\n3 }\n4 \n5 func main(){\n6   http.HandleFunc(\"/hello\", hello)\n\
    7 }\n```\n\nIn the code above, the string “/hello” is a route pattern that states\
    \ that all web requests to “/hello” should be handled by the `hello()` function.\n\
    \n### Response and Request\n\nA close inspection of the `hello()` function reveals\
    \ that it takes a `ResponseWriter` and `Request`:\n\n```\n1 func hello(w http.ResponseWriter,\
    \ req *http.Request) {\n2   fmt.c(w, \"hello\\n\")\n3 }\n```\n\nThe expectation\
    \ is that you inspect the `req` object, your request for any data that decides\
    \ what to return. Then you are to use `w` to produce a response. In this case,\
    \ you are returning a string by passing `w` to `Fprintf()`. `FPrintf()` takes\
    \ a writer. The writer is anything IO, so it could be, be writing to a file for\
    \ example as well, or as in this case an HTTP response stream.\n\n### Start the\
    \ server\n\nOk, we’ve gone through routes, producing a response, how would we\
    \ get this server activated so it starts responding to requests?\n\nYou use the\
    \ `ListenAndServe()` function that takes a port like so:\n\n```\n1 http.ListenAndServe(\"\
    :8090\", nil)\n```\n\n## Responding to a request\n\nAn incoming request could\
    \ be asking for a specific route like /products or /orders for example, or it\
    \ could be asking for a specific static file like an image, a text file or maybe\
    \ CSS. The request itself gives us a hint, about not only the logical domain it\
    \ wants data from, like orders or products but what data type it wants, or it\
    \ might even present credentials for authentication. The hint is known as headers.\n\
    \n### Header\n\nThere’s a concept called headers. A header is giving off a piece\
    \ of information that could say what piece of content it is, how big the content\
    \ is, or it could be a token helping you authenticate for example.\n\nHeaders\
    \ can exist both on the incoming request as well as the response.\n\n### Serving\
    \ different types of content\n\nServing different types of content means that\
    \ we are working on the response. To serve various content type, we need to instruct\
    \ the response on what type of content it is so that a consuming client knows\
    \ how to interpret it, (in some cases, clients like a web browser can figure that\
    \ out anyway through a process called content sniffing).\n\nTo serve a specific\
    \ type of content, there are two things you need to do:\n\n*   **set the content\
    \ type**, you set the content type by calling:\n\n    ```\n    1  w.Header().Set(\"\
    Content-Type\", \"image/jpeg\")\n    ```\n\n    Here the content type is an image\
    \ of subtype jpeg. There are many content types you could be setting like plain\
    \ text, CSS, JSON, XML and more.\n\n*   **produce the response**. Producing a\
    \ response means writing to the response stream. That can be done by calling the\
    \ `Write()` method on the `ResponseWriter` instance we are passed when we handle\
    \ a route. There are other methods capable of writing to said stream as well.\n\
    \n### Serving image data\n\nTo serve an image, you need to load it into memory,\
    \ set the content type and write it to the response stream like below code:\n\n\
    ```\n 1 func GetImage(w http.ResponseWriter, r *http.Request) {\n 2     f, _ :=\
    \ os.Open(\"/image.jpg\")\n 3     \n 4     // Read the entire JPG file into memory.\n\
    \ 5     reader := bufio.NewReader(f)\n 6     content, _ := ioutil.ReadAll(reader)\n\
    \ 7     \n 8     // Set the Content Type header.\n 9     w.Header().Set(\"Content-Type\"\
    , \"image/jpeg\")\n10     \n11     // Write image to the response.\n12     w.Write(content)\n\
    13 }\n```\n\n*   First, we open the image: \n\n    ```\n    1  f, _ := os.Open(\"\
    /image.jpg\")\n    ```\n\n*   Secondly, we read the file into memory: \n\n   \
    \ ```\n    1  reader := bufio.NewReader(f)\n    2  content, _ := ioutil.ReadAll(reader)\n\
    \    ```\n\n*   Thirdly, set the `Content-Type` header and tell it it’s a JPEG\
    \ image, with the value “image/jpeg”: \n\n    ```\n    1  w.Header().Set(\"Content-Type\"\
    , \"image/jpeg\")\n    ```\n\n*   Finally, we write the content to the response:\
    \ \n\n    ```\n    1  w.Write(content)\n    ```\n\n### Serving JSON data\n\nJust\
    \ like with serving images, we need to follow a similar approach of configuring\
    \ the correct content-type header and then constructing the response. Here’s the\
    \ code:\n\n```\n 1 package main\n 2 \n 3 import (\n 4   \"encoding/json\"\n 5\
    \ )\n 6 \n 7 type Person struct {\n 8   Id int\n 9   Name string\n10 }\n11 \n\
    12 func ReturnJson(w http.ResponseWriter, r *http.Request) {\n13   w.Header().Set(\"\
    Content-Type\", \"application/json\")\n14 \n15   p := Person {\n16     Id: 1\n\
    17     Name: \"a person\"\n18   }\n19 \n20   json.NewEncoder(w).Encode(p)\n21\
    \ }\n22 \n23 func main() {\n24   http.HandleFunc(\"/json\", ReturnJson)\n25 }\n\
    ```\n\n*   First, we set the content type, by setting the value “application/json”:\
    \ \n\n    ```\n    1  w.Header().Set(\"Content-Type\", \"application/json\")\n\
    \    ```\n\n*   Secondly, we construct the data we are about to send out: \n\n\
    \    ```\n    1  p := Person {\n    2   Id: 1\n    3   Name: \"a person\"\n  \
    \  4 }\n    ```\n\n*   Finally, we encode the data as JSON and write it to the\
    \ response stream: \n\n    ```\n    1  json.NewEncoder(w).Encode(p)\n    ```\n\
    \nIt’s also possible to use the `Marshal()` function like so, instead of `json.NewEncoder()`:"
