    \ 3}\n    2  for i := 0; i< 4; i++ {\n    3    if arr[i] < 0 {\n    4      break;\n\
    \    5    }\n    6    fmt.Println(arr[i])\n    7  } \n    ```\n\n    The output\
    \ will be:\n\n    ```\n    1  2\n    2  3\n    ```\n\n## Assignment - create a\
    \ command line loop\n\nWhen creating console apps, you often want to read user\
    \ input. The user input could be data used in the program or it can be the user\
    \ typing a command to do something like “save”, “print”, “backup” etc. We will\
    \ build a program for the latter case.\n\n1.  Create a file *main.go* and give\
    \ it the following content: \n\n    ```\n    1 package main\n    2 \n    3 import\
    \ \"fmt\"\n    4 \n    5 func main() {\n    6 \n    7 }\n    ```\n\n2.  Add the\
    \ following code to the `main()` method: \n\n    ```\n     1 var keepGoing = true\n\
    \     2 answer := \"\"\n     3 for keepGoing {\n     4   fmt.Println(\"Type command:\
    \ \")\n     5   fmt.Scan(&answer)\n     6   if answer == \"quit\" {\n     7  \
    \   keepGoing = false\n     8   }\n     9 }\n    10 fmt.Println(\"program exit\"\
    )\n    ```\n\n3.  Run the code by typing `go run main.go`:\n\n    ```\n    1 go\
    \ run main.go\n    ```\n\n    You should see an output like so:\n\n    ```\n \
    \   1 Type command: command\n    2 Type command: quit\n    3 program exit \n \
    \   ```\n\n## \U0001F680 Challenge\n\n*   Add a command “print” that ends up outputting\
    \ “printing file”.\n\n*   See if you can use a `break` instead of the variable\
    \ `keepGoing` to break the loop when the user types”quit”.\n\n## Solution\n\n\
    ```\n 1 package main\n 2 \n 3 import \"fmt\"\n 4 \n 5 func main() {\n 6   var\
    \ keepGoing = true\n 7    answer := \"\"\n 8    for keepGoing {\n 9      fmt.Println(\"\
    Type command: \")\n10      fmt.Scan(&answer)\n11      if answer == \"quit\" {\n\
    12        keepGoing = false\n13      }\n14    }\n15    fmt.Println(\"program exit\"\
    )\n16 }\n```\n\n# Reading user input\n\nYou will learn how to read user input,\
    \ both a simpler technique and a more advanced one using formatters.\n\n## Introduction\n\
    \nThis chapter will cover:\n\n*   The `Scan()` method to read user input.\n\n\
    *   Reading one input.\n\n*   Reading multiple inputs.\n\n*   Working with formattters.\n\
    \n## User input\n\nIt’s an important thing to be able to read user input from\
    \ the console. It gives the user a chance to interact with the program. Things\
    \ to consider are how you are asking the user to input, is it one word, several\
    \ inputs. Will the user separate input by space or newline? Regardless of what\
    \ approach you go with, try to communicate the chosen approach to the user.\n\n\
    ## Managing user input with `fmt`\n\nSo far, you’ve seen how the `fmt` package\
    \ can be used to print to the console. It can also be used to read user input.\n\
    \nThe `fmt` library has a built-in `Scan()` method that we will use to capture\
    \ the user input.\n\n## Reading one input\n\nYou might start out wanting to read\
    \ one input from the user. That’s what the `Scan()` method does by default.\n\n\
    Here’s some code showing how to collect user input:\n\n```\n1 package main\n2\
    \ \n3 import \"fmt\"\n4 \n5 func main() {\n6     var response string\n7     fmt.Scan(&response)\n\
    8     fmt.Println(\"User typed: \", response)\n9 }\n```\n\nNote how you send in\
    \ the string `response` as a reference, using the `&` operator. It’s done this\
    \ way as the `Scan()` method will modify the variable you send in.\n\nWhen you\
    \ run this code, you will see the below output:\n\n```\n1 hello\n2 User typed:\
    \ hello\n```\n\n## Reading multiple inputs\n\nYou can provide several arguments\
    \ to the `Scan()` method. By providing several arguments, you can collect more\
    \ than one user input and separate each input, in the `Scan()` function, with\
    \ a comma. Here’s how to apply this technique:\n\n```\n1 var a1, a2 string\n2\
    \ // multiple input\n3 fmt.Scan(&a1, &a2)\n4 \n5 // formatted string to print\
    \ out the user input\n6 str := fmt.Sprintf(\"a1: %s a2: %s\", a1, a2)\n```\n\n\
    Note how `a1` and `a2` is sent into `Scan()` and they are comma-separated. So\
    \ how will those codes run?\n\nWhen you run this code, there are two ways for\
    \ the user to input. The user can either separate the values by space like so:\n\
    \n```\n1 hi you\n2 a1: hi a2: you\n```\n\nor by newline:\n\n```\n1 hi \n2 you\n\
    3 a1: hi a2: you\n```\n\n## `Scanf()`, scan the input with formatters\n\nSo far,\
    \ you’ve seen how you can collect input with spaces and endlines as separators.\
    \ You can also be specific in how you collect input. Imagine that the user wants\
    \ to type in an invoice number like so “INV200” or “INV114” and what you are interested\
    \ in is the number part, or you are interested in the prefix as well?\n\nThe answer\
    \ to solving this is in the `Scanf()` function. It takes formatters. With formatters,\
    \ you’re able to pick the part of the user input you are interested in and place\
    \ that into the variable you want.\n\nIn the above-mentioned case, you can construct\
    \ code looking like so:\n\n```\n1 var prefix string\n2 var no int\n3 // in110\n\
    4 fmt.Scanf(\"%3s%d\", &prefix, &no)\n5 fmt.Printf(\"prefix: %s, invoice no: %d\"\
    , prefix, no)\n```\n\nThe interesting part lies in the first argument of `Scanf()`,\
    \ namely `3s%d`. What this means is, take the first 3 characters, `%3s` and interpret\
    \ them as a string. Then interpret and place the remaining as a number, `%d`.\n\
    \nRunning this program, you will get an output like so:\n\n```\n1 inv200\n2 prefix:\
    \ inv, invoice no: 200\n```\n\n“inv” is placed in `prefix` and 200 in `no` variable.\n\
    \n## Learn more\n\nTo learn more about this area, check out this link [https://pkg.go.dev/fmt#Scanf](https://pkg.go.dev/fmt#Scanf)\n\
    \n## Assignment - read user input\n\nIn this assignment, you will read user input\
    \ for a card game. The objective is to capture the names of the players.\n\n1.\
    \  Create a file *main.go* with the following content: \n\n    ```\n    1 package\
    \ main\n    2 \n    3 import \"fmt\"\n    4 \n    5 func main() {\n    6 \n  \
    \  7 }\n    ```\n\n2.  Add the following code to the `main()` method: \n\n   \
    \ ```\n    1 fmt.Println(\"Enter player names (separated by space or newline):\"\
    )\n    2 var player1, player2 string\n    3 fmt.Scan(&player1, &player2)\n   \
    \ 4 fmt.Println(\"Players are: \", player1, player2)\n    ```\n\n3.  Run the program\
    \ using `go run main.go`:\n\n    ```\n    1 go run main.go\n    ```\n\n    You\
    \ should see the following output:\n\n    ```\n    1 Enter player names (separated\
    \ by space or newline):\n    2 Alice Bob\n    3 Players are:  Alice Bob\n    ```\n\
    \n## \U0001F680 Challenge\n\nTry modifying the program so it takes several players\
    \ first and then ensures all players get a name. Here’s an example output of such\
    \ a program:\n\n```\n1 Enter number of players: \n2 3\n3 Enter Player 1 name:\
    \ \n4 Alice\n5 Enter Player 2 name:\n6 Bob\n7 Enter Player 3 name:\n8 Jean\n9\
    \ Players are: Alice Bob Jean\n```\n\n## Solution\n\n```\n 1 package main\n 2\
    \ \n 3 import \"fmt\"\n 4 \n 5 func main() {\n 6  fmt.Println(\"Enter player names\
    \ (separated by space):\")\n 7  var player1, player2 string\n 8  fmt.Scan(&player1,\
    \ &player2)\n 9  fmt.Println(\"Players are: \", player1, player2)\n10 }\n```\n\
    \n# Using functions\n\nIn this chapter, we will discuss how you can define and\
    \ use functions. Functions are great when you have the same type of code used\
    \ in many places. By using functions, you thereby reduce repetition.\n\n## Introduction\n\
    \nThis chapter will cover:\n\n*   What a function is and why use it.\n\n*   How\
    \ to define and call a function.\n\n*   Returning multiple values.\n\n## Why functions\n\
    \nAs soon as you have a set of statements you repeat in many places, it’s a good\
    \ use case for creating a function. Typical things you put in functions are logging\
    \ to a file, performing a calculation or talking to a data source.\n\n## Your\
    \ first function `main()`\n\nSo far, you’ve seen the function `main()`, define\
    \ like so:\n\n```\n1 func main(){\n2 }\n```\n\nThere’s only one such function,\
    \ it’s called an entry point and represents the start of the program. You can\
    \ however define other functions.\n\n## The anatomy of a function\n\nA function\
    \ consists of various parts. By incorporating all these parts, you ensure you\
    \ have a reusable piece of code you can use in many places.\n\nHere are the parts\
    \ you need to care about:\n\n*   `func`, the keyword `func`."
