    )\n7 }\n```\n\nto use the public `Helper()` function from *main.go*, we need to\
    \ import it.\n\nIn *main.go* we need an import statement like so:\n\n```\n1 import\
    \ (\n2   \"my-project/helper\"\n3 )\n```\n\nWe are now able to invoke the `Help()`\
    \ function from *main.go* like so:\n\n```\n1 helper.Help()\n```\n\n## Assignment\
    \ - create a project\n\nIn this assignment, you will create a project.\n\n1. \
    \ Create a project like so: \n\n    ```\n    1  go mod init\n    ```\n\n2.  create\
    \ the **helper** directory and *helper.go* file and give it the following content:\
    \ \n\n    ```\n    1  // helper.go\n    2  \n    3  package helper\n    4  \n\
    \    5  import \"fmt\"\n    6  \n    7  func Help() {\n    8   fmt.Println(\"\
    This is a helper function\")\n    9  }\n    ```\n\n3.  Create the *main.go* file\
    \ and give it the following content:\n\n    ```\n    1 package main\n    2 \n\
    \    3 import (\n    4   \"log-tester/helper\"\n    5 )\n    6  \n    7 func main()\
    \ {\n    8   helper.Help()\n    9 }\n    ```\n\n    Note this import `\"log-tester/helper\"\
    `, it ensures the `helper` package is in scope.\n\n4.  Compile and run \n\n  \
    \  ```\n    1 go run main.go\n    ```\n\n## Solution\n\nhelper/helper.go\n\n```\n\
    1 package helper\n2 \n3 import \"fmt\"\n4 \n5 func Help() {\n6  fmt.Println(\"\
    help\")\n7 }\n```\n\nmain.go\n\n```\n1 package main\n2 \n3 import \"my-project/helper\"\
    \n4 \n5 func main() {\n6  helper.Help()\n7 }\n```\n\n## Challenge\n\nSee if you\
    \ can create another function in *helper.go*, this time, make the function name\
    \ lowercase, what happens if you try to import it?\n\n# Consume an external module\n\
    \nIn this chapter, we are looking at downloading and using external modules.\n\
    \n## Introduction\n\nThis chapter will cover:\n\n*   Creating a project.\n\n*\
