    43  v.land()\n44  fmt.Println(v.velocity)\n45 }\n```\n\n# Your first project\n\
    \nIn this chapter, we will cover how to create your first project in Go.\n\n##\
    \ Introduction\n\nThis chapter will cover:\n\n*   Creating a project.\n\n*   Organize\
    \ your files.\n\n## Module use cases\n\nThere are two interesting use cases with\
    \ modules:\n\n*   **Consuming a module**, you will use a combination of core modules\
    \ and external 3rd party modules\n\n*   **Creating a module**, in some cases you\
    \ will create code that you or someone else will be able to use. For this scenario,\
    \ you can create a module and upload it to GitHub.\n\n## Consume internal files\n\
    \nYou want to split up your app in many different files. Let’s say you have the\
    \ following files:\n\n```\n1 /app\n2   main.go\n3   /helper\n4     helper.go \n\
    ```\n\nWhat you are saying above is that your program consists of many files and\
    \ that you want code in the fiile *main.go* to use code from *helper.go* for example.\n\
    \nTo handle such a case, you need the following:\n\n*   **a project**. By creating\
    \ a project, you create a top-level reference that you can use in the `import`\
    \ directive.\n\n*   **an import** that points to the project root name as well\
    \ as the path to the module you want to import.\n\nYou can use `go mod init`,\
    \ this will initialize your project.\n\n## Creating a project\n\nTo create a project,\
    \ you run `go mod init` and a name for a project, for example, “my-project”:\n\
    \n```\n1    go mod init my-project\n```\n\nYou end up with a *go.mod* file looking\
    \ something like so:\n\n```\n1    module my-project\n2 \n3    go 1.16\n```\n\n\
    The *go.mod* file tells you the name of your project and the currently used version\
    \ of Go. It can contain other things as well like libraries you are dependent\
    \ on.\n\n## The import statement\n\nImagine now we have this file structure in\
    \ our project:\n\n```\n1 /app\n2   main.go\n3   /helper\n4     helper.go \n```\n\
    \nwith *helper.go* looking like so:\n\n```\n1 package helper\n2     \n3 import\
