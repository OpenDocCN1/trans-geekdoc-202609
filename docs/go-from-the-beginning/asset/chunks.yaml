  trans: "\n# 读取用户输入\n\n你将学习如何读取用户输入，包括一种简单的技术和使用格式化器的更高级技术。\n\n## Introduction\n\n\
    本章将涵盖：\n\n*   使用 `Scan()` 方法读取用户输入。\n\n*   读取单个输入。\n\n*   读取多个输入。\n\n*   使用格式化器的工作。\n\
    \n## 用户输入\n\n能够从控制台读取用户输入是很重要的，它给用户与程序互动的机会。需要考虑的是你是如何请求用户输入的，是一个词还是多个输入。用户是否通过空格或换行分隔输入？无论你采用什么方法，都要向用户传达所选的方法。\n\
    \n## 使用 `fmt` 管理用户输入\n\n迄今为止，你已经看到如何使用 `fmt` 包打印到控制台。它也可以用于读取用户输入。\n\n`fmt` 库内置了\
    \ `Scan()` 方法，我们将使用它来捕获用户输入。\n\n## 读取单个输入\n\n你可能一开始就想读取用户的一个输入。默认情况下，`Scan()`\
    \ 方法就是用来做这件事的。\n\n下面是一段示例代码，展示如何收集用户输入：\n\n```\n1 package main\n2 \n3 import \"\
    fmt\"\n4 \n5 func main() {\n6     var response string\n7     fmt.Scan(&response)\n\
    8     fmt.Println(\"User typed: \", response)\n9 }\n```\n\n注意，你将字符串 `response`\
    \ 作为参考传递，使用 `&` 运算符。这样做是因为 `Scan()` 方法会修改你传入的变量。\n\n运行这段代码后，你会看到以下输出：\n\n```\n\
    1 hello\n2 User typed: hello\n```\n\n## 读取多个输入\n\n你可以向 `Scan()` 方法提供多个参数。通过提供多个参数，你可以收集多个用户输入，并在\
    \ `Scan()` 函数中用逗号分隔每个输入。以下是如何应用此技术：\n\n```\n1 var a1, a2 string\n2 // 多个输入\n3\
    \ fmt.Scan(&a1, &a2)\n4 \n5 // 使用格式化字符串打印用户输入\n6 str := fmt.Sprintf(\"a1: %s a2:\
    \ %s\", a1, a2)\n```\n\n注意 `a1` 和 `a2` 传递给 `Scan()`，并且用逗号分隔。那么这些代码会如何运行？\n\n当你运行这段代码时，用户有两种输入方式。用户可以通过空格分隔值，例如：\n\
    \n```\n1 hi you\n2 a1: hi a2: you\n```\n\n或者通过换行分隔：\n\n```\n1 hi \n2 you\n3 a1:\
    \ hi a2: you\n```\n\n## `Scanf()`，使用格式化器扫描输入\n\n迄今为止，你已经看到如何使用空格和换行作为分隔符来收集输入。你也可以指定如何收集输入。想象用户想输入发票号，例如“INV200”或“INV114”，而你感兴趣的是数字部分，或者你也想保留前缀呢？\n\
    \n解决这个问题的方法是 `Scanf()` 函数。它使用格式化器。通过格式化器，你可以选择从用户输入中感兴趣的部分，并将其放入你想要的变量中。\n\n在上面提到的案例中，你可以编写如下代码：\n\
    \n```\n1 var prefix string\n2 var no int\n3 // in110\n4 fmt.Scanf(\"%3s%d\", &prefix,\
    \ &no)\n5 fmt.Printf(\"prefix: %s, invoice no: %d\", prefix, no)\n```\n\n`Scanf()`\
    \ 的第一个参数 `3s%d` 的含义是，取前 3 个字符，`%3s` 将其解释为字符串。然后解释并把剩余部分作为数字，`%d`。\n\n运行此程序，你将得到以下输出：\n\
    \n```\n1 inv200\n2 prefix: inv, invoice no: 200\n```\n\n“inv” 被放入 `prefix`，而 200\
    \ 被放入 `no` 变量。\n\n## 了解更多\n\n要了解更多关于此领域的信息，请查看以下链接 [`pkg.go.dev/fmt#Scanf`](https://pkg.go.dev/fmt#Scanf)\n\
    \n## 练习 - 读取用户输入\n\n在这次练习中，你将读取用于卡牌游戏的用户输入。目标是捕获玩家的名称。\n\n1.  创建一个名为 *main.go*\
    \ 的文件，包含以下内容：\n\n    ```\n    1 package main\n    2 \n    3 import \"fmt\"\n \
    \   4 \n    5 func main() {\n    6 \n    7 }\n    ```\n\n2.  将以下代码添加到 `main()`\
    \ 方法中：\n\n    ```\n    1 fmt.Println(\"Enter player names (separated by space\
    \ or newline):\")\n    2 var player1, player2 string\n    3 fmt.Scan(&player1,\
    \ &player2)\n    4 fmt.Println(\"Players are: \", player1, player2)\n    ```\n\
    \n3.  使用 `go run main.go` 运行程序：\n\n    ```\n    1 go run main.go\n    ```\n\n\
    \    你应该看到以下输出：\n\n    ```\n    1 Enter player names (separated by space or newline):\n\
    \    2 Alice Bob\n    3 Players are:  Alice Bob\n    ```\n\n## \U0001F680 挑战\n\
    \n尝试修改程序，使其首先输入玩家数量，然后确保所有玩家都有名称。以下是该程序的示例输出：\n\n```\n1 Enter number of players:\
    \ \n2 3\n3 Enter Player 1 name: \n4 Alice\n5 Enter Player 2 name:\n6 Bob\n7 Enter\
    \ Player 3 name:\n8 Jean\n9 Players are: Alice Bob Jean\n```\n\n## 解决方案\n\n```\n\
    \ 1 package main\n 2 \n 3 import \"fmt\"\n 4 \n 5 func main() {\n 6  fmt.Println(\"\
    Enter player names (separated by space):\")\n 7  var player1, player2 string\n\
    \ 8  fmt.Scan(&player1, &player2)\n 9  fmt.Println(\"Players are: \", player1,\
    \ player2)\n10 }\n```\n\n# 使用函数\n\n在本章中，我们将讨论如何定义和使用函数。当你在多个地方使用相同类型的代码时，函数是很有用的。通过使用函数，你可以减少重复代码。\n\
    \n## Introduction\n\n本章将涵盖：\n\n*   函数是什么以及为什么使用它。\n\n*   如何定义和调用函数。\n\n*   返回多个值。\n\
    \n## 为什么使用函数\n\n等 soon 你就有一组在多个地方重复的语句集合，创建函数是一个好用例。通常在函数中，你会进行日志记录到文件、执行计算或与数据源通信。\n\
    \n## 你的第一个函数 `main()`\n\n迄今为止，你已经看到函数 `main()`，它定义如下：\n\n```\n1 func main(){\n\
    2 }\n```\n\n这是唯一的函数，它是入口点，代表程序的开始。然而，你可以定义其他函数。\n\n## 函数的解剖结构\n\n一个函数由各种部分组成。通过包含所有这些部分，你确保拥有可在许多地方重用的可复用代码片段。\n\
    \n以下是需要关注的部分：\n\n*   `func`，关键字 `func`。\n\n"
