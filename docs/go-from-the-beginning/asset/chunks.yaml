    \ in the directory you mean to measure coverage on and run this command:\n\n```\n\
    go test -coverprofile=c.out\n```\n\nNow you are ready to run a command that shows\
    \ the result in a browser:\n\n```\ngo tool cover -html=c.out\n```\n\nThe above\
    \ command spins up a browser and the output look something like so:\n\n![coverage](img/missing.png)\n\
    \ncoverage\n\nThe coverage report tells us that the green portions are covered\
    \ by tests whereas the red portions should have tests covering it.\n\n## Learn\
    \ more\n\nThere’s a lot more to learn on testing with Go, have a look at package\
    \ documentation, [docs](https://pkg.go.dev/testing)\n\n## Challenge\n\nCreate\
    \ a test for a piece of code you wrote. Run the test. See if you can produce a\
    \ coverage report and implement any gaps pointed out by the report.\n\n# Working\
    \ with JSON\n\nIn this chapter, you will work with the JSON data format.\n\n##\
    \ Introduction\n\nIn this chapter, you will learn the following:\n\n*   The JSON\
    \ data format.\n\n*   How to read JSON data and map it to existing structures\
    \ in Go.\n\n*   How to create JSON and persist it in files.\n\n## JSON\n\nJSON\
    \ is a lightweight data format for storing and transporting data. The acronym\
    \ stands for **J**ava**S**cript **O**bject **n**otation.\n\nThe format is commonly\
    \ used in Web services. Usually, data is encoded as JSON and sent via HTTP. A\
    \ client, for example, a web browser, consumes the JSON data and uses it to render\
    \ a frontend with the help of HTML and CSS. It’s also common for JSON to be used\
    \ to communicate between services.\n\nHere’s an example of what the format looks\
    \ like:\n\n```\n{\n  \"products\": [{\n    \"id\": 1,\n    \"name\": \"a product\"\
    \n  },\n  {\n    \"id\": 2,\n    \"name\": \"another product\"\n  }]\n}\n```\n\
    \nThe above depicts a list of products. Each key needs to be encased with quotes\
    \ and values can be everything from primitives like numbers, strings, Booleans\
    \ etc to more complex types like an array or an object.\n\nwhat is this format,\
    \ and what contexts is it used in.\n\n## Reading JSON\n\nTo work with JSON, you\
    \ need to use the `encoding/json` library. It allows you to both read and write\
    \ JSON data.\n\nTo read JSON data you need to first have a structure in your Go\
    \ code read to map to the JSON data. Imagine having the following JSON data:\n\
    \n```\n{\n  \"products\" : [\n    {\n      \"id\": 1,\n      \"name\": \"some\
    \ product\"\n    }\n  ]\n}\n```\n\nTo map this in Go, you need a struct that matches\
    \ its structure like so:\n\n```\ntype Product struct {\n  Id int\n  Name string\n\
    }\n\ntype Response struct {\n  Products []Product\n}\n```\n\n### Notation\n\n\
    The first step is to create the structures needed to match your JSON data. But\
    \ you also need to do one more thing, add notations. The problem we are looking\
    \ to solve is how the `Product` property is called `Id` and not `id` as it’s called\
    \ in the JSON data.\n\n> Won’t that just work?\n\nUnfortunately, not\n\n> Why\
    \ don’t you just name the struct property `id`\n\nThe library `encoding/json`,\
    \ is a separate package from the main package, meaning we need to make a field\
    \ name, defined in the main package, uppercase for the `encoding/json` package\
    \ to find it.\n\nSo that means, we need to add the following annotations to our\
    \ above created structs:\n\n```\ntype Product struct {\n  Id int `json: \"id\"\
    `\n  Name string `json: \"name\"`\n}\n\ntype Response struct {\n  Products []Product\
    \ `json: \"products\"`\n}\n```\n\nWhat these annotations do is to say, in the\
    \ JSON data, look for properties with these names and map them to the following\
    \ property. Like in this example from above:\n\n```\ntype Product struct {\n \
    \ Id int `json: \"id\"`\n}\n```\n\n### Reading the data\n\nOk, so we’ve defined\
    \ the structures in Go that we will map our JSON data to. So how do we read from\
    \ a JSON source? Well, JSON is usually stored in one of two ways:\n\n*   a string\
    \ literal, like so `{ \"name\": \"my product\", \"id\": 1 }`\n\n*   in a JSON\
    \ file:\n\n```\n{\n  \"id\": 1,\n  \"name\": \"my product\"\n}\n```\n\nLet’s show\
    \ how to work with both approaches:\n\n**Reading from a string literal**\n\nWe\
    \ will use the `Unmarshal()` function and provide it with the string literal as\
    \ the first parameter and the data to write the result to as the second parameter.\n\
    \n```\npackage main\n\nimport (\n  \"fmt\"\n  \"encoding/json\"\n)\n\nfunc main()\
    \ {\n  str := `{ \"name\": \"my product\", \"id\": 1 }`\n  product := Product{}\n\
    \  json.Unmarshal([]byte(str), &person)\n  fmt.Println(person) // prints the object\n\
    }\n```\n\nNote how we also convert the response to a byte array `[]byte(str)`\
    \ and how the data is written in the second parameter to the `person` instance\
    \ as a reference, `&person`.\n\n**read from a file**\n\nTo read from a file, we\
    \ will use the `io/ioutil` library and its `ReadFile()` function. Like with the\
    \ string literal, the `Unmarshal()` function will be used to write the data to\
    \ a struct instance.\n\n```\npackage main\n\nimport (\n  \"encoding/json\"\n \
    \ \"fmt\"\n  \"io/ioutil\"\n  \"iohelper/dir\"\n  \"iohelper/file\"\n  \"log\"\
    \n)\n\ntype Products struct {\n  Products []Product `json: products`\n}\n\ntype\
    \ Product struct {\n  Id   int    `json: \"id\"`\n  Name string `json: \"name\"\
    `\n}\n\nfunc main(){\n  file, _ := ioutil.ReadFile(\"products.json\")\n\n  data\
    \ := Products{}\n  _ = json.Unmarshal([]byte(file), &data)\n\n  for i := 0; i\
    \ < len(data.Products); i++ {\n    fmt.Println(\"Product Id: \", data.Products[i].Id)\n\
    \    fmt.Println(\"Name: \", data.Products[i].Name)\n  }\n}\n```\n\n## Writing\
    \ JSON\n\nWe’ve seen so far how we can read JSON data either from a string literal\
    \ or from a file, but what about writing data?\n\nTwo cases are important for\
    \ us:\n\n*   Writing data to a structure. We are working with structs so any changes\
    \ we do on the structs need to be converted back to JSON.\n\n*   Generate JSON\
    \ from data. In the second case, we might be working with a raw string literal\
    \ or even with pure primitives, how would we do that?\n\nLet’s address both these\
    \ cases. What these cases have in common is the `Marshal()` function. The `Marshal()`\
    \ method can take a primitive or a struct and taking that into JSON:\n\n```\n\
    package main\n\nimport (\n  \"fmt\"\n  \"encoding/json\"\n)\n\ntype Person struct\
    \ {\n  Id int `json: \"id\"`\n  Name string`json: \"name\"`\n}\n\nfunc main()\
    \ {\n  aBoolean, _ := json.Marshal(true)\n  aString, _ := json.Marshal(\"a string\"\
    )\n  person := Person{\n    Id: 1\n    Name: \"a person\"\n  }\n  aPerson, _ :=\
    \ json.Marshal(&person)\n  fmt.Println(string(aBoolean)) // true\n  fmt.Println(string(aString))\
    \  // a string\n  fmt.Println(string(person))  // { \"id\": 1, \"name\": \"a person\"\
    \ }\n}\n```\n\n## Assignment\n\nGiven the following file *response.json*, find\
    \ a way to read the data and display it on the screen:\n\n```\n{\n  \"orders\"\
    : [\n    {\n      \"id\": 1,\n      \"items\": [\n        { \"id\": 1, \"quantity\"\
    : 3, \"total\": 34.3 },\n        { \"id\": 2, \"quantity\": 2, \"total\": 17.8\
    \ }\n      ] \n    },\n    {\n      \"id\": 2, \n      \"items\": [\n        {\
    \ \"id\": 3, \"quantity\": 3, \"total\": 10.0 },\n        { \"id\": 4, \"quantity\"\
    : 2, \"total\": 100.5 }\n      ] \n    } \n  ]\n}\n```\n\n## Solution\n\n"
