    \ it’s assigned is 2, there are 3 spaces free.\n\n### Capacity by inference\n\n\
    You don’t have to set capacity to an explicit number, you can set it to `...`,\
    \ in which case the capacity will be set to the number of elements you assign\
    \ to it, like so:\n\n```\n1 ids := [...]int{1, 2, 3, 4}\n```\n\nThe preceding\
    \ code has 4 elements, and that’s also its capacity.\n\n## Accessing elements\n\
    \nThe way to access an element is by using its index. The index is 0-based, meaning\
    \ the first index is 0 and its last is the length -1.\n\n```\n1 ids := [...]int{1,\
    \ 2, 3, 4}\n2 ids[0] // 1\n3 ids[3] // 4\n```\n\n## Length and capacity\n\nImagine\
    \ we have the following array declared:\n\n```\n1 cities := [5]string{\"NY\",\
    \ \"LA\"}\n```\n\n*   **length**. The length is defined as the number of elements\
    \ in the array. You can use the `len()` method to find this out: \n\n    ```\n\
    \    1  len(cities) // 2\n    ```\n\n*   **capacity**. The capacity is how many\
    \ elements the array can hold. `cap()` is the method you use to find the capacity:\
    \ \n\n    ```\n    1  cap(cities) // 5\n    ```\n\n## Slices\n\nA slice is a part\
    \ of an array. A slice is created when the slice operator is being used. Here’s\
    \ the syntax for the slice operator:\n\n```\n1 s[i:p]\n```\n\n*   `s`, the array\n\
    \n*   `i`, the first index of the array to take elements from\n\n*   `p`, The\
    \ variable p corresponds to the last element in the underlying array that can\
    \ be used in the new slice. I.e. cut right before this index.\n\n```\n1 items\
    \ := [5]int{1,2,3,4,5}\n2 part = items[1:3] // 2,3\n```\n\n### Adding elements\n\
    \nA slice differs from an array, you can add items to it. The `append()` method\
