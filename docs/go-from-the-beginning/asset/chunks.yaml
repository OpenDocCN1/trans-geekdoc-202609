- raw: "*   Upload your package to GitHub for wide distribution.\n\n## Assignment\
    \ - create a module meant for sharing and consume it\n\nTo create a module meant\
    \ for wider use you need to first initialize a module.\n\n1.  Create a directory\
    \ *logger* for your new package: \n\n    ```\n    1 mkdir logger\n    2 cd logger\
    \   \n    ```\n\n2.  Run `go mod init <address at github>`, for example:\n\n \
    \   ```\n    1 go mod init github.com/softchris/logger\n    ```\n\n    This will\
    \ create a *go.mod* file in your directory.\n\n    ```\n    1 logger/\n    2 \
    \  go.mod\n    ```\n\n    The file looks like so:\n\n    ```\n    1 module github.com/softchris/logger\n\
    \    2 \n    3 go 1.16\n    ```\n\n    It contains the package name and the version\
    \ of Go it means to use.\n\n3.  Create a file to host your package code, for example\
    \ *log.go* and give it the following content: \n\n    ```\n     1  package logger\n\
    \     2 \n     3  import (\n     4   \"fmt\"\n     5  )\n     6  \n     7  var\
    \ Version string = \"1.0\"\n     8  \n     9  func Log(mess string) {\n    10\
    \   fmt.Println(\"[LOG] \" + mess)\n    11  }\n    ```\n\n    *   Note `package\
    \ logger` instead of `main`.\n\n    *   The uppercase variables and methods makes\
    \ the publicly available. Anything named with lowercase will be private for the\
    \ package.\n\n### Test it locally\n\nYou can test your package locally. To do\
    \ so you need a separate package that you can import your package from.\n\n1.\
    \  Move up a directory: \n\n    ```\n    1 cd ..\n    ```\n\n2.  Create a new\
    \ directory **logger-test**: \n\n    ```\n    1 mkdir logger-test\n    2 cd logger-test\n\
    \    ```\n\n3.  Create a package, it will be used for testing only: \n\n    ```\n\
    \    1 go mod init logger-test\n    ```\n\n4.  Create a file *main.go* and add\
    \ the following code:\n\n    ```\n    1  package main\n    2 \n    3  import \"\
    github.com/softchris/logger\"\n    4  \n    5  func main() {\n    6   logger.Log(\"\
    hey there\")\n    7  }\n    ```\n\n    At this point, you are consuming the “logger”\
    \ package but it’s pointing to GitHub and your package doesn’t live there yet.\
    \ However, you can repoint to a local address on your machine, let’s do that next.\n\
    \n5.  Open *go.mod* and add the following:\n\n    ```\n    1 require github.com/softchris/logger\
    \ v0.0.0\n    2 \n    3 replace github.com/softchris/logger => ../logger\n   \
    \ ```\n\n    Two things are happening here:\n\n    *   you are asking for the\
    \ “logger” package: \n\n        ```\n        1  require github.com/softchris/logger\
    \ v0.0.0\n        ```\n\n    *   you are making it point to your local system\
    \ instead of GitHub \n\n        ```\n        1  replace github.com/softchris/logger\
    \ => ../logger\n        ```\n\n6.  Run the package with `go run`:\n\n    ```\n\
    \    1  go run main.go\n    ```\n\n    You should see:\n\n    ```\n    1  [LOG]\
    \ hey there\n    ```\n\n### Publish a package\n\nTo publish your package, you\
    \ can put it on GitHub.\n\n1.  Create a git repo with `git init`: \n\n    ```\n\
    \    1 git init\n    ```\n\n2.  Create the repo on GitHub.\n\n3.  Make you do\
    \ at least one commit: \n\n    ```\n    1  git add .\n    2  git commit -m \"\
    first commit\"\n    ```\n\n4.  Do the following to upload your package to GitHub:\
    \ \n\n    ```\n    1 git remote add origin https://github.com/softchris/logger.git\n\
    \    2 \n    3 git branch -M main\n    4 git push -u origin main\n    ```\n\n\
    5.  Tag your package with `git tag`:\n\n    ```\n    1 git tag v0.1.0\n    2 git\
    \ push origin v0.1.0\n    ```\n\n    Now your package has the tag 0.1.0\n\n###\
    \ Test it out\n\n1.  Go to your project “logger-test”: \n\n    ```\n    1 cd ..\n\
    \    2 cd logger-test\n    ```\n\n2.  Open up *go.mod* and remove these lines:\
    \ \n\n    ```\n    1 require github.com/softchris/logger v0.1.0\n    2 replace\
    \ github.com/softchris/logger => ../logger\n    ```\n\n3.  Run `go mod tidy`,\
    \ this will force Go to go look for the package:\n\n    Your *go.mod* should now\
    \ contain:\n\n    ```\n    1 require github.com/softchris/logger v0.1.0\n    ```\n\
    \n    Also, your *go.sum* should contain:\n\n    ```\n    1 github.com/softchris/logger\
    \ v0.1.0 h1:Kqw7t9C3Y7BtHDLTx/KXEqHy5x8EJxrLian742S0di0=\n    2 \n    3 github.com/softchris/logger\
    \ v0.1.0/go.mod h1:rrzWjMsM3tqjetDBDyezI8mFCjGucF/b5RSAqpt\\\n    4 KF/M=\n  \
    \  ```\n\n4.  Run the program with `go run`:\n\n    ```\n    1 go run main.go\n\
    \    ```\n\n    You should see:\n\n    ```\n    1 [LOG] hey there\n    ```\n\n\
    ## Challenge\n\nSee if you can add a feature to your new package. Give it a new\
    \ tag via Git. Then ensure your app is using this new version.\n\n# Test your\
    \ code in Go\n\nIn this chapter, we will look at creating and running unit tests.\n\
    \n## Introduction\n\nThis chapter will cover:\n\n*   Why you should test your\
    \ code.\n\n*   The testing library in Go.\n\n*   Authoring and running a test.\n\
    \n*   Controlling how to run your tests.\n\n*   Produce coverage reports.\n\n\
    ## Why we test\n\nIt’s good to test your code to ensure it works as intended.\
    \ In this chapter, we’re looking at unit tests specifically.\n\n## What Go provides\n\
    \nGo has a package `testing` that gives us two things to start out with:\n\n*\
    \   a parameter for the test. The `testing` library exposes a `t *testing.T` parameter.\
    \ By putting it as a parameter to a function, said function becomes a test. \n\
    \n    ```\n    1  func TestAdd(t *testing.T) {}\n    ```\n\n*   a way to assert\
    \ the result. `testing` also exposes `t.Errorf()`. By invoking it with a string,\
    \ the test counts as failed. To pass a test you do nothing: \n\n    ```\n    1\
    \  t.Errorf(\"Sum was incorrect, Actual: %d, Expected: %d\", total, 4)\n    ```\n\
    \nHere’s an example test function:\n\n```\n1 func TestAdd(t *testing.T) {\n2 \
    \ total := Add(2, 2)\n3  if total != 4 {\n4   t.Errorf(\"Sum was incorrect, Actual:\
    \ %d, Expected: %d\", total, 4)\n5  }\n6  t.Log(\"running TestAdd\")\n7 }\n```\n\
    \n*   First, the code to test is called: \n\n    ```\n    1  total := Add(2, 2)\n\
    \    ```\n\n*   Secondly, the assertion is made, to see if it succeeded or failed:\n\
    \n    ```\n    1  if total != 4 {\n    2    t.Errorf(\"Sum was incorrect, Actual:\
    \ %d, Expected: %d\", total, 4)\n    3  }\n    ```\n\n    if the result is not\
    \ the expected, then `t.Errorf()` is called to state what’s gone wrong.\n\n##\
    \ Your first test\n\nMake sure you’ve created a project with `go mod init`. Then\
    \ create a file structure like so:\n\n```\n1 main.go\n2 math/\n3   math.go\n```\n\
    \nWhat you want to do next is to create a test file. You want to keep the test\
    \ file as close to the code you want to test as possible. Because you want to\
    \ test *math.go* you create `math_test.go` file in the math/ directory like so:\n\
    \n```\n1 main.go\n2 math/\n3   math.go\n4   math_test.go\n```\n\n### Authoring\
    \ and running your first test\n\nNow that you have the file structure above, ensure\
    \ the *math\\_test.go* file has the following content:\n\n```\n 1 package math\n\
    \ 2 \n 3 import (\n 4  \"testing\"\n 5 )\n 6 \n 7 func TestAdd(t *testing.T) {\n\
    \ 8   total := Add(2, 2)\n 9   if total != 4 {\n10     t.Errorf(\"Sum was incorrect,\
    \ Actual: %d, Expected: %d\", total, 4)\n11   }\n12   t.Log(\"running TestAdd\"\
    )\n13 }\n```\n\nTo run a test, you invoke the `go test` command. Here are different\
    \ ways to run your tests:\n\n*   `go test`, runs the test in the current working\
    \ directory. Here’s what it looks like: \n\n    ```\n    1  ok      test-example/math\
    \       0.258s\n    ```\n\n*   `go test -v`, runs a verbose version. Here’s what\
    \ it can look like:\n\n    ```\n    1  === RUN   TestAdd\n    2   math_test.go:12:\
    \ running TestAdd\n    3 \n    4  --- PASS: TestAdd (0.00s)\n    5  PASS\n   \
    \ 6  ok      test-example/math       0.422s\n    ```\n\n    In the verbose version,\
    \ you see the name of the test and if it failed.\n\n*   `go test ./..`, recursive\
    \ run. If you run the command like so it will run all the tests in the subfolders\
    \ as well.\n\n## Control the test run\n\nThere are ways to control how many tests\
    \ are run. Here are some ways:\n\n\\- **Run test by pattern**. . You can provide\
    \ a pattern to have Go run some of the tests, which matches it by a substring\
    \ or even at a certain depth and more. Here’s how:\n\n```\n1     go test -run\
    \ <pattern>\n```\n\n\\- **Skip a test**. `t.Skip()` by calling this inside the\
    \ test, the test is skipped.\n\n*   **Run a single test**. You can run a single\
    \ test by running a pattern that specifies the package and the name of the test,\
    \ here’s how:"
