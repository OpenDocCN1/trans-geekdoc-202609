- raw: "This chapter will cover:\n\n*   What is an interface and how does it differ\
    \ from a struct.\n\n*   How to add behaviour.\n\n*   Implement an interface.\n\
    \n*   Type assertions.\n\n*   Changing a value.\n\n## Interface\n\nTo describe\
    \ what an interface is, let’s start by talking about structs and how they are\
    \ different from an interface.\n\nWith structs, we can define properties we want\
    \ a concept to have, like for example a car:\n\n```\n1 type Car struct {\n2  \
    \ make string \n3   model string\n4 }\n```\n\nAn interface is meant to communicate\
    \ something different, a behaviour. Instead of describing the car itself, as a\
    \ struct does, it describes what a car can do.\n\n## Interface - describing a\
    \ behaviour\n\nNow that we’ve described how an interface differs from a struct,\
    \ let’s talk about the motivation for using an interface. There are a couple of\
    \ good reasons for when to use an interface:\n\n*   **Adding behaviour**. When\
    \ you want your types to have a behaviour, that’s when you want an interface\n\
    \n*   **Communicate via contract**. Often, when you call other code, you want\
    \ to reveal as little of your concrete implementation as possible. Instead of\
    \ saying, here’s a car, you might want to say, here’s something that can run.\
    \ It enables your code to be flexible and you don’t have to implement specific\
    \ code for each type but can instead write code that deals with a certain behaviour.\n\
    \n### Define an interface\n\nTo define an interface, you need the keywords `type`\
    \ and `interface` and you need a set of methods, one or many that a type should\
    \ implement. Here’s an example interface:\n\n```\n1 type Describable interface\
    \ {\n2   describe() string\n3 }\n```\n\nHere’s another example:\n\n```\n1 type\
    \ Point struct {\n2   x int\n3   y int\n4 }\n5 \n6 type Shape interface {\n7 \
    \  area() int\n8   location() Point\n9 }\n```\n\n## Implement an interface\n\n\
    Everything that’s a type can implement an interface. More than one type can implement\
    \ the same interface. Let’s look at how a type `Rectangle` can implement the `Shape`\
    \ interface:\n\n```\n 1 type Rectangle struct {\n 2   x int\n 3   y int\n 4 }\n\
    \ 5 \n 6 func (r Rectangle) area() int {\n 7   return r.x * r.y\n 8 }\n 9 \n10\
    \ func (r Rectangle) location() Point {\n11   return P{ x: r.x, y: r.y }\n12 }\n\
    ```\n\nSo, what’s going on here? Let’s look at the first method `area()`:\n\n\
    ```\n1 func (r Rectangle) area() int {\n2   return r.x * r.y\n3 }\n```\n\nIt looks\
    \ like a regular function but there’s this `(r Rectangle)` right before the function\
    \ name. That’s a signal to Go that you are implementing a certain function on\
    \ the type `Rectangle`. There’s also a second implementation for `location()`.\n\
    \nBy implementing both these methods, `Rectangle` has now fully implemented the\
    \ `Shape` interface.\n\n### Pass an interface\n\nOk, so we’ve fully implemented\
    \ an interface, what does it allow me to do? Well, there are two things you can\
    \ do:\n\n*   **Call properties and behaviour**. At this point, you are ready to\
    \ create an instance and call both properties and methods (its new behaviour):\n\
    \n    ```\n    1  var rectangle Rectangle = Rectangle{x: 5, y: 2}\n    2  fmt.Println(rectangle.area())\
    \ // prints 10\n    ```\n\n    Great, our `Rectangle` type has both the properties\
    \ `x` and `y` as well as the behaviour from `Shape`.\n\n*   **Pass an interface**.\
    \ Imagine you wanted to pass the behaviour to a function to make it flexible:\n\
    \n    ```\n    1  func printArea(shape Shape) {\n    2    fmt.Println(shape.area())\n\
    \    3  }\n    ```\n\n    To make that happen, lets change slightly how we construct\
    \ our `Rectangle instance`:\n\n    ```\n    1  var shape Shape = Rectangle{x:\
    \ 5, y: 2}\n    2  printArea(rectangle) // prints 10\n    ```\n\n### Implement\
    \ `Square`\n\nTo see the power in what we just created, let’s create another struct\
    \ `Square` and have it implement `Shape`:\n\n```\n 1 type Square struct {\n 2\
    \   side int\n 3 }\n 4 \n 5 func (s Square) area() int {\n 6   return s.square\
    \ * s.square\n 7 }\n 8 func (s Square) location() Point {\n 9   return Point{x:\
    \ s.side, y: s.side}\n10 }\n11 \n12 func main() {\n13   var shape Shape = Rectangle{x:\
    \ 5, y: 2}\n14   var shape2 Shape = Square{side: 5}\n15   printArea(shape) //\
    \ prints 10\n16   printArea(shape2) // prints 25\n17 }\n```\n\nThe power lies\
    \ in the fact that `printArea()` doesn’t have to deal with the internals of `Rectangle`\
    \ or `Shape`, it just needs the parameter to implement `Shape`, a behaviour.\n\
    \n### Full code\n\nHere’s the full code:\n\n```\n 1 package main\n 2 \n 3 import\
    \ \"fmt\"\n 4 \n 5 type Rectangle struct {\n 6  x int\n 7  y int\n 8 }\n 9 \n\
    10 type Point struct {\n11  x int\n12  y int\n13 }\n14 \n15 type Square struct\
    \ {\n16  side int\n17 }\n18 \n19 type Shape interface {\n20  area() int\n21  location()\
    \ Point\n22 }\n23 \n24 func printArea(shape Shape) {\n25  fmt.Println(shape.area())\n\
    26 }\n27 \n28 func (r Rectangle) area() int {\n29  return r.x * r.y\n30 }\n31\
    \ \n32 func (r Rectangle) location() Point {\n33  return Point{x: r.x, y: r.y}\n\
    34 }\n35 \n36 func (s Square) area() int {\n37  return s.side * s.side\n38 }\n\
    39 \n40 func (s Square) location() Point {\n41  return Point{x: s.side, y: s.side}\n\
    42 }\n43 \n44 func main() {\n45  var shape Shape = Rectangle{x: 5, y: 2}\n46 \
    \ var shape2 Shape = Square{side: 5}\n47  printArea(shape)  // prints 10\n48 \
    \ printArea(shape2) // prints 25\n49 }\n```\n\n## Type assertions\n\nSo far, a\
    \ `Rectangle` or `Square` implements the `Shape` interface\n\nLet’s have a closer\
    \ look at this code:\n\n```\n1 var shape Shape = Rectangle{x: 5, y: 2}\n2 var\
    \ shape2 Shape = Square{side: 5}\n3 printArea(shape)  // prints 10\n4 printArea(shape2)\
    \ // prints 25\n```\n\nWe’ve said for `shape` and `shape2` to be of type `Shape`.\
    \ That’s great for being sent to the `printArea()` method. What if we need to\
    \ access a `Rectangle` property on `shape`, can we? Let’s try:\n\n```\n1 var shape\
    \ Shape = Rectangle{x: 5, y: 2}\n2 fmt.Println(shape.x) // shape.x undefined (type\
    \ Shape has no field or method x)\n```\n\nOk, not working, we need to find a way\
    \ to reach the underlying fields. We can use something called *type assertion*\
    \ like so:\n\n```\n1 var shape Shape = Rectangle{x: 5, y: 2}\n2 fmt.Println(shape.(Rectangle).x)\
    \ // 5\n```\n\nOk, that works, so `.(<type>)` works, if the underlying type is\
    \ the correct type.\n\n## Change a value\n\nSo, one thing about our approach so\
    \ far is that we have implemented interfaces with methods that read data from\
    \ the underlying struct instances. What if we want to change data, can we do that?\n\
    \nLet’s look at an example:\n\n```\n 1 package main\n 2 import \"fmt\"\n 3 \n\
    \ 4 type Car struct {\n 5  speed int\n 6  model string\n 7  make string\n 8 }\n\
    \ 9 \n10 type Runnable interface {\n11  run()\n12 }\n13 \n14 func (c Car) run()\
    \ {\n15  c.speed = 10\n16 }\n17 \n18 func main() {\n19   c := Car{make: \"Ferrari\"\
    , model: \"F40\", speed: 0}\n20   c.run()\n21   fmt.Println(c.speed) // ?\n22\
    \ }\n```\n\nRunning this code, it returns `0`. So, looking at our `run()` method:\n\
    \n```\n1 func (c Car) run() {\n2  c.speed = 10\n3 }\n```\n\nshouldn’t this work?\
    \ Well, no, because you are not changing the instance. For that, you need to send\
    \ a reference.\n\nA slight alteration to the `run()` method, with `*`:\n\n```\n\
    1 func (c *Car) run() {\n2  c.speed = 10\n3 }\n```\n\nand your code now does what\
    \ it’s supposed to.\n\n## Assignment\n\nStart with the following code:\n\n```\n\
    \ 1 package main \n 2 \n 3 type Point struct {\n 4  x float32\n 5  y float32\n\
    \ 6 }\n 7 \n 8 type Vehicle struct {\n 9  velocity float32\n10  Point\n11 }\n\
    12 \n13 func main() {\n14  v := Vehicle{\n15   velocity: 0,\n16   Point: Point{\n\
    17    x: 0,\n18    y: 0,\n19   },\n20  }\n21  v.fly()\n22  fmt.Println(v.velocity)\n\
    23  v.land()\n24  fmt.Println(v.velocity)\n25 }\n```\n\nImplement the following\
    \ interface:\n\n```\n1 type Spaceship interface {\n2  fly()\n3  land()\n4  position()\
    \ Point\n5 }\n```\n\nThe output from running the program should be:\n\n```\n1\
    \ 10\n2 0\n```\n\n## Solution"
