    \ 2 log.Printf(\"Affected rows %d\", affected)\n    ```\n\n    Here for result\
    \ `res` we are invoking `RowsAffected()` that returns the number of affected rows\
    \ then we go on to print said value.\n\n### Update and delete data\n\nUpdating\
