    1 tmp/\n2   a.txt\n3   b.xt\n4   subdir/\n```\n\nYour program should read the\
    \ diretory *tmp* and for each entry list, if it’s a dir or a file, the size and\
    \ when last modified.\n\nThe programs output should look something like:\n\n```\n\
    1 Reading directory tmp:\n2 Name, Type, Size, Modified\n3 a.txt, file, 1kb, 2022-01-01\n\
    4 b.txt, file, 1kb, 2022-01-01\n5 subdir, directory, 1kb, 2022-01-01\n```\n\n\
    ## Solution\n\n```\n 1 package main\n 2 \n 3 import (\n 4  \"fmt\"\n 5  \"io/ioutil\"\
    \n 6  \"log\"\n 7 )\n 8 \n 9 func GetType(isDir bool) string {\n10  if isDir {\n\
    11   return \"directory\"\n12  }\n13  return \"file\"\n14 }\n15 \n16 func main()\
    \ {\n17  var path string = \"tmp\"\n18  files, err := ioutil.ReadDir(path)\n19\
    \  if err != nil {\n20   log.Fatal(err)\n21  }\n22  fmt.Println(\"Reading directory\
    \ \", path)\n23  fmt.Println(\"Name, Type, Size, Modified\")\n24  for _, file\
    \ := range files {\n25   if err != nil {\n26    log.Fatal(err)\n27   }\n28   fmt.Printf(\"\
    File Name: %s, \", file.Name())\n29   fmt.Printf(\"Type: %s, \", GetType(file.IsDir()))\n\
    30   fmt.Printf(\"Size: %d, \", file.Size())             \n31   fmt.Printf(\"\
    Last Modified: %s, \", file.ModTime()) \n32   fmt.Print(\"\\n\")\n33  }\n34 }\n\
    ```"
