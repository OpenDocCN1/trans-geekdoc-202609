    \ 12:42:13 log message\n```\n\n### Use `Fatal()` for errors\n\n`Println()` produces\
    \ a normal looking log message with a date, time and message. `Fatal()` is used\
    \ when you want to end the program. What `Fatal()` does is to print out the message\
    \ you give it and call `os.Exit(1)`.\n\nHere’s how it can be used:\n\n```\n1 log.Fatal(\"\
    quit program due to <specify reason>\")\n```\n\n### Log to a file\n\nIf you develop\
    \ an app, you are likely to run it and keep an eye on the console for what the\
