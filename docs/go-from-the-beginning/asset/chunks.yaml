    logfile\"\n21 \n22  f, err := os.OpenFile(logFile, os.O_RDWR|os.O_CREATE|os.O_APPEND,\
    \ 0666)\n23 \n24  if err != nil {\n25   log.Fatal(\"Could not log to file: \"\
