    \ up with more variables to represent the state in a Texas Holdem card game, like\
    \ for example, other players, the card deck etc. What data type would you give\
    \ those variables?\n\n## Review & Self Study\n\nHave a look at this [official\
    \ tutorial on variables](https://go.dev/tour/basics/8) using a Go sandbox\n\n\
    ## Solution\n\n```\n 1 package main\n 2 \n 3 import \"fmt\"\n 4 \n 5 var (\n 6\
    \   players = 3\n 7   replay = false\n 8   namePlayerOne = \"chris\" \n 9 )\n\
    10 \n11 func main () {\n12   fmt.Println(players)\n13   fmt.Println(replay)\n\
    14   fmt.Println(namePlayerOne)\n15 }\n```\n\n# Flow control\n\nIn this chapter,\
    \ we’re looking to learn about constructs `if` and `else` to control the flow\
    \ of your application.\n\n## Introduction\n\nThis chapter will cover:\n\n*   Working\
    \ with Boolean logic.\n\n*   Create Boolean data.\n\n*   Use constructs like `if`,\
    \ `else if` and `else`.\n\n## Flow control\n\nUsing Boolean logic in your program\
    \ is about creating different execution paths through your code?\n\n> What does\
    \ that mean?\n\nIt means there’s more than one way that your program can run depending\
    \ on what data you feed it.\n\n> Ok, can you show me?\n\nSure, consider this code:\n\
    \n```\n1 printMessage := true\n2 \n3 if printMessage {\n4   fmt.Println(\"Message\"\
    )\n5 }\n```\n\nIf `printMessage` is `true`, the string “Message” will print. If\
    \ the value is `false`, nothing will print.\n\n> Ok, I think I get it.\n\n## The\
    \ `if` construct\n\nYou’ve seen an example already about code that runs or doesn’t\
    \ run depending on a value. The `if` construct is what makes that possible. An\
    \ `if` take a Boolean expression like so:\n\n```\n1 if true {\n2   // statements\
    \ here will always run\n3 }\n```\n\n### Using a Boolean variable\n\nWhen you use\
    \ a Boolean value as part of your Boolean expression, it needs to be evaluated.\
    \ Here’s code showing just that:\n\n```\n1 accountBalance = 100\n2 accountCredit\
    \ = 200\n3 if accountBalance + accountCredit > 0 {\n4   fmt.Println(\"You have\
    \ money to spend\")\n5 }\n```\n\nThe program above does the job, meaning it correctly\
    \ evaluates whether you have money to spend. However, you might want to print\
    \ something out if the condition is not met, for that you have `else`.\n\n###\
    \ Introducing `else`\n\nYou would like to improve the preceding code. The `else`\
    \ clause is run when `if` is evaluated to false. Here’s how you can add it to\
    \ the program:\n\n```\n1 accountBalance = 100\n2 accountCredit = 200\n3 if accountBalance\
    \ + accountCredit > 0 {\n4   fmt.Println(\"You have money to spend\")\n5 } else\
    \ {\n6   fmt.Println(\"No money left, please add more funds\")\n7 }\n```\n\n##\
    \ Using `else if`\n"
  trans: "\n# 使用变量\n\n使用变量，我们可以记住值，并通过命名引用来访问它们。使用变量会让我们的代码更易于阅读。\n\n## 介绍\n\n在本课中我们将学习：\n\
