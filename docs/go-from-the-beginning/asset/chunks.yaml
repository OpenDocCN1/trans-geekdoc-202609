    \ v0.2.0/go.mod h1:v8WzhjKC+ipuH+i9IZ0Ta2IArniTP53gc5TgCINC\\\n    4 qAo=\n  \
    \  ```\n\n    This is Go’s way of keeping track of how to build the app by referencing\
