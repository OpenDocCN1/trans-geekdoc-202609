    12 }\n```\n\n**Delete**\n\n```\n 1 func Delete(db *sql.DB) {\n 2  stmt, err :=\
    \ db.Prepare(\"delete from person where uid=?\")\n 3  if err != nil {\n 4   log.Fatal(err)\n\
