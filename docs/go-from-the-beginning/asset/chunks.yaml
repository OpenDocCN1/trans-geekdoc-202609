    \ := 0; i < len(basket); i++ {\n34   current := basket[i]\n35   fmt.Println(current)\n\
    36   sum += current.Quantity * int(current.UnitPrice)\n37  }\n38  fmt.Println(\"\
    Total\", sum)\n39 }\n```\n\n# Using maps\n\nA map is a complex data structure\
    \ that enables you to store things in a key-value fashion. This lets you implement\
    \ scenarios like phone books, translation dictionaries and more.\n\n## Introduction\n\
    \nThis chapter will cover:\n\n*   Defining a map.\n\n*   Reading the values of\
    \ map by key but also iterating over it.\n\n*   Change the content of a map.\n\
    \n## The use case for a map\n\nYou will have scenarios when you code that there\
    \ are things you need to look up. If you use a dictionary for example you might\
    \ look up how you can translate a word from English to Spanish or vice versa.\
    \ In programming, you have similar situations, maybe you want to know what service\
    \ is run on a certain port for example. There are also databases that are based\
    \ on the concept of having a unique key that points to a certain value.\n\nHow\
    \ all this is implemented is via map structure. The idea is that you define a\
    \ key and value and collect all those in a group, a map.\n\n## Creating a map\n\
    \nTo create a map in Go, we need to use the following syntax:\n\n```\n1 map[<key\
    \ type>]<value type>{ ... entries }\n```\n\nHere’s an example of creating a map\
    \ structure that could hold a phone book:\n\n```\n1 phonebook := map[int]string{\
    \ 555123: \"Robin Hood\", 555404: \"Sheriff of Nottingham\"}\n```\n\nWe define\
    \ a map structure with key type `int` and value type string. Then we assign it\
    \ a value with `{}`. Each entry is defined according to `<key>: <value>` and separated\
    \ by a comma. So how do we read a value?\n\n### Create a map with `make()`\n\n\
    Another way to create a map us by using the `make()` function. `make()` returns\
    \ a initialized map if you give it a type like so:\n\n```\n1 dictionaryEnSv =\
    \ make(map[string]string)\n```\n\n### Adding entries\n\nTo add entries to the\
    \ map, you need to provide it with a key and value entry like so:\n\n```\n1 dictionaryEnSv[\"\
    hello\"] = \"hej\"\n```\n\n## Read a value by key\n\nImagine now that we have\
    \ these two entries, and you want the value given that you have then entry 555404,\
    \ how would we do that? We use the square brackets like so `[]`:\n\n```\n1 phonebook[555404]\
    \ // \"Sheriff of Nottingham\"\n```\n\n### Check for existing entry\n\nSo, you\
    \ learned that `phonebook[555404]` gives you a value back. What if it doesn’t\
    \ exist? What happens if you give it a key that’s not stored in the map is that\
    \ you get nothing back as a result:\n\n```\n1 phonebook[888] // this prints as\
    \ empty in the console\n```\n\nThere’s a better way to check this because accessing\
    \ an entry with a key returns two values, the value, and a Boolean. The Boolean\
    \ indicates if this key exists in the map. See this code:\n\n```\n1 _, exist phonebook[888]\n\
    2 fmt.Println(exist) // false\n```\n\nHere you get the value back, but you choose\
    \ to ignore for this one-time occasion to only focus on `exist`, a Boolean that\
    \ tells you if the entry exists.\n\nYou can even use this construct in an if statement:\n\
    \n```\n1 if _, exist := phonebook[888] {\n2   // number exist, call person\n3\
    \ }\n```\n\n## Iterate over a map\n\nWe can iterate over a map with a `for` construct\
    \ and a `range`. Here’s how you can iterate:\n\n```\n1 for key, value := range\
    \ phonebook {\n2   fmt.Println(key, value)\n3 }\n```\n\n## Delete an entry\n\n\
    To remove an entry from a map, you can use the `delete()` method. The `delete()`\
    \ method takes the map and the key to delete as parameters, like so:\n\n```\n\
    1 delete(phonebook, 555404)\n```\n\n## Assignment - build a phone book\n\nHere\
    \ are your contacts:\n\n```\n1 Alice 555-123 \n2 Bob 555-124\n3 Jean 555-125\n\
    ```\n\n```\n 1 Welcome to your phonebook.\n 2 Command> store\n 3 Enter contact:\
    \ Rob 555-126\n 4 Contact saved\n 5 Command> list\n 6 Alice 555-123 \n 7 Bob 555-124\n\
    \ 8 Jean 555-125\n 9 Rob 555-126\n10 Command> lookup\n11 Enter name: Alice\n12\
    \ Alice has number: 555-123\n```\n\nHINT: you might need to use both a map and\
    \ a slice.\n\n## Solution\n\n```\n 1 package main\n 2 \n 3 import \"fmt\"\n 4\
    \ \n 5 func main() {\n 6  var command string\n 7  contacts := make(map[string]string)\n\
    \ 8  fmt.Println(\"Welcome to your phonebook\")\n 9 \n10  for {\n11   fmt.Print(\"\
    Command> \")\n12   fmt.Scan(&command)\n13   if command == \"store\" {\n14    fmt.Print(\"\
    Enter contact: \")\n15    var contact string\n16    var no string\n17    fmt.Scan(&contact,\
    \ &no)\n18    contacts[contact] = no\n19    fmt.Println(\"Contact saved\")\n20\
    \   } else if command == \"list\" {\n21    for key, value := range contacts {\n\
    22     fmt.Println(key, value)\n23    }\n24   } else if command == \"lookup\"\
    \ {\n25    fmt.Print(\"Enter name: \")\n26    var contact string\n27    fmt.Scan(&contact)\n\
    28    fmt.Println(contacts[contact])\n29   } else if command == \"quit\" {\n30\
    \    break\n31   } else {\n32    fmt.Println(\"Unknown command: \", command)\n\
    33   }\n34  }\n35  fmt.Println(\"Bye\")\n36 }\n```\n\n## Challenge\n\nRight now,\
    \ there’s no error checking. Add a check so that if you look up a contact that\
    \ doesn’t exist, you should get an error message. Here’s how it could work:\n\n\
    ```\n1 command> lookup\n2 Enter name: Jane\n3 Contact doesn't exist, do you want\
    \ to add it? y/n: y\n4 Enter contact: Jane 123\n5 Contact saved\n```\n\n# Interfaces\n\
    \nThis chapter covers what an interface is and what to use it for.\n\n## Introduction"
