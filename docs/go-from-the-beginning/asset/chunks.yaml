    processing file '%s' \\n\", fileName)\n32  ProcessFile(fileName)\n33 }\n```\n\n\
    # Working with strings\n\nThere are many reasons why we need to work with strings\
    \ in different ways. Below are some situations that you are likely to encounter\
    \ and that the `strings` library has a solution for:\n\n*   **user input**, or\
    \ other types of storage may contain special characters that you need to cater\
    \ for.\n\n*   **inspection**, does the string contain what we need for our business\
