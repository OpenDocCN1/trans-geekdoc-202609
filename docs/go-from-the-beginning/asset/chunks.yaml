    \ command\", response)\n32   }\n33 \n34  }\n35  fmt.Println(\"bye\")\n36 }\n```\n\
    \n# Structs\n\nIn this chapter, we will learn about structs. A struct is a complex\
    \ data type capable of holding many fields. It can also be extended to hold behaviour.\n\
    \n## Introduction\n\nThis chapter will cover:\n\n*   Declaring and inspecting\
    \ a struct.\n\n*   Embedding a struct within another struct.\n\n*   Adding implementations\
    \ to structs.\n\n## Why structs\n\nLet’s start with a simple scenario, you have\
    \ an account balance. You might store it in a variable like so:\n\n```\n1 accountBalance\
    \ int32\n```\n\nNow that’s great, but if you want to describe something more complex,\
    \ like a bank account? A bank account consists of a variety of information like\
    \ an ID, balance, account owner and so on. You could try representing each one\
    \ of those properties as integers like so:\n\n```\n1 var accountBalance int32\n\
    2 var owner string\n3 var id int\n```\n\nHowever, what happens if you need to\
    \ operate on more than one bank account, I mean you could try to store it like\
    \ so:\n\n```\n1 var accountBalance int32\n2 var owner string\n3 var id int\n4\
    \ \n5 var accountBalance2 int32\n6 var owner2 string\n7 var id2 int\n```\n\nIt\
    \ doesn’t scale though, what you need is a more complex type, like a `struct`\
    \ that’s able to group all this information like so:\n\n```\n1 type Account struct\
    \ {\n2   accountBalance int32\n3   owner string\n4   id int\n5 }\n```\n\n## Defining\
    \ a struct\n\nOk, so we understand why we need a struct, to gather related information,\
    \ and we’ve seen one example so far `Account`. But let’s try breaking the parts\
    \ down and see how we go about defining a struct. Here’s what the syntax looks\
    \ like:\n\n```\n1 type <a name for the struct> struct {\n2   ... fields\n3 }\n\
    ```\n\nLet’s show another example but this time we create a struct for an address:\n\
    \n```\n1 type Address struct {\n2  city   string\n3  street string\n4  postal\
    \ string\n5 }\n```\n\n### Create a struct instance\n\nTo create an instance from\
    \ a struct, we can use one of two approaches:\n\n*   **define a variable**, and\
    \ set the fields after the variable declaration: \n\n    ```\n    1  var address\
    \ Address\n    2  address.city = \"London\"\n    3  address.street = \"Buckingham\
    \ palace\"\n    4  address.postal = \"SW1\"\n    ```\n\n*   **define all at once**,\
    \ we can set all the values in one go as well: \n\n    ```\n    1  address2 :=\
    \ Address{\"New York\", \"Central park\", \"111\"}\n    ```\n\n## Embedding a\
    \ struct\n\nWe can also embed a struct in another struct. Let’s see we have our\
    \ `Address` struct, an address is something that a higher level struct like `Person`\
    \ can use. Here’s how that can look:\n\n```\n1 type Person struct {\n2  name \
    \   string\n3  address Address\n4 }\n```\n\nIn this code, the `Person` struct\
    \ has a field `address` of type `Address`.\n\nTo instantiate a struct, we can\
    \ type like so:\n\n```\n1 person := Person{\n2   name: \"chris\",\n3   address:\
    \ Address{\n4    city: \"Stockholm\",\n5   },\n6  }\n```\n\n### Relying on default\
    \ naming\n\nNote how we created a field `address`, we can skip typing a few characters\
    \ by defining it like so instead:"
