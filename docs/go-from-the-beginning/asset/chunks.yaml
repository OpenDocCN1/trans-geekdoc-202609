- raw: "```\n1 var result int\n2 result = <-ch\n3 fmt.Println(result)\n4 result =\
    \ <-ch\n5 fmt.Println(result)\n```\n\nSo what happens if you produce more values\
    \ than you receive like so?\n\n```\n1 ch <- 1\n2 ch <- 2\n3 ch <- 3\n```\n\nanswer:\
    \ you will miss out on the extra value.\n\nWhat if it’s the opposite, you try\
    \ to receive one more value than you actually get?\n\n```\n1 var result int\n\
    2 result = <-ch\n3 fmt.Println(result)\n4 result = <-ch\n5 fmt.Println(result)\n\
    6 result = <-ch\n7 fmt.Println(result)\n```\n\nAt this point, your code will deadlock,\
    \ like so: **fatal error: all goroutines are asleep - deadlock!**. Your code will\
    \ never finish as that value will never arrive.\n\nThe lesson here is that you\
    \ need to keep track of how many results you might get and only try to receive\
    \ that many.\n\nThere’s another way to receive values, and that’s by using a `select`\
    \ like so:\n\n```\n1 for i := 0; i < 2; i++ {\n2   select {\n3   case x, ok :=\
    \ <-ch:\n4    if ok {\n5     fmt.Println(x)\n6    }\n7   }\n8  }\n```\n\nThe idea\
    \ is to *match* the receiving of a value like so:\n\n```\n1 case x, ok := <-ch:\n\
    ```\n\nWhat you are getting is two things, the value itself `x` and `bool` we\
    \ name `ok`. If we managed to get a value ok, then `ok` holds the value `true`.\
    \ What happens if it’s not ok then? It would be `false` if the channel is closed\
    \ and can no longer produce any more values, so lets discuss that next.\n\n###\
    \ Closing a channel\n\nA channel is open until you close it. You can actively\
    \ close it by calling `close()` with the channel as an input parameter:\n\n```\n\
    1 close(ch)\n```\n\nHowever, when we close a channel, we need to test for it.\
    \ If we attempt to receive a value from a closed channel, it will cause a crash.\
    \ To test whether the channel is open or not, we can use the `select` we just\
    \ wrote:\n\n```\n1   select {\n2   case x, ok := <-ch:\n3    if ok {\n4     fmt.Println(x)\n\
    5    } else {\n6      break // channel is closed\n7    }\n8   }\n```\n\nThe value\
    \ of `ok` is now false.\n\nTo apply the concept of closing a channel, we add `close()`\
    \ to `produceResults()` and we have our for loop run one more time than there’s\
    \ values, like so:\n\n```\n 1 package main\n 2 \n 3 import (\n 4  \"fmt\"\n 5\
    \ )\n 6 \n 7 func produceResults(ch chan int) {\n 8  ch <- 1\n 9  ch <- 2\n10\
    \  // ch <- 3\n11  close(ch)\n12 }\n13 \n14 func main() {\n15  ch := make(chan\
