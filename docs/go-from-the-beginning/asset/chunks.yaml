- raw: "    ```\n    1  go test -run TestAdd ./math\n    ```\n\n    Here’s the package\
    \ is called math and the name of the test is `TestAdd()`.\n\n## Coverage\n\nThere’s\
    \ a built-in tool for dealing with coverage. To learn more about the tool, you\
    \ can type:\n\n```\n1 go tool cover -help\n```\n\nit will list a set of commands.\n\
    \nThe tool is centred on the concept of having an out file. The out file contains\
    \ instructions on where your code is covered by tests and where it isn’t. An out\
    \ file can look something like this:\n\n```\n1 mode: set\n2 test-example/math/math.go:3.32,5.2\
    \ 1 1\n3 test-example/math/math.go:7.37,9.2 1 1\n4 test-example/math/math.go:11.47,13.2\
    \ 1 0\n```\n\nThis is a format readable by the tool.\n\nIt’s a prerequisite to\
    \ generate said “out file” before you can view your code’s coverage. Place yourself\
    \ in the directory you mean to measure coverage on and run this command:\n\n```\n\
    1 go test -coverprofile=c.out\n```\n\nNow you are ready to run a command that\
    \ shows the result in a browser:\n\n```\n1 go tool cover -html=c.out\n```\n\n\
    The above command spins up a browser and the output look something like so:\n\n\
    ![coverage](resources/missing.png)\n\ncoverage\n\nThe coverage report tells us\
    \ that the the green portions are covered by tests whereas the red portions should\
    \ have tests covering it.\n\n## Learn more\n\nThere’s a lot more to learn on testing\
    \ with Go, have a look at package documentation, [docs](https://pkg.go.dev/testing)\n\
    \n## Challenge\n\nCreate a test for a piece of code you wrote. Run the test. See\
    \ if you can produce a coverage report and implement any gaps pointed out by the\
    \ report.\n\n# Working with JSON\n\nIn this chapter, you will work with the JSON\
    \ data format.\n\n## Introduction\n\nIn this chapter, you will learn the following:\n\
    \n*   The JSON data format.\n\n*   How to read JSON data and map it to existing\
    \ structures in Go.\n\n*   How to create JSON and persist it in files.\n\n## JSON\n\
    \nJSON is a lightweight data format for storing and transporting data. The acronym\
    \ stands for **J**ava**S**cript **O**bject **n**otation.\n\nThe format is commonly\
    \ used in Web services. Usually, data is encoded as JSON and sent via HTTP. A\
    \ client, for example, a web browser, consumes the JSON data and uses it to render\
    \ a frontend with the help of HTML and CSS. It’s also common for JSON to be used\
    \ to communicate between services.\n\nHere’s an example of what the format looks\
    \ like:\n\n```\n 1 {\n 2   \"products\": [{\n 3     \"id\": 1,\n 4     \"name\"\
    : \"a product\"\n 5   },\n 6   {\n 7     \"id\": 2,\n 8     \"name\": \"another\
    \ product\"\n 9   }]\n10 }\n```\n\nThe above depicts a list of products. Each\
    \ key needs to be encased with quotes and values can be everything from primitives\
    \ like numbers, strings, Booleans etc to more complex types like an array or an\
    \ object.\n\nwhat is this format, and what contexts is it used in.\n\n## Reading\
    \ JSON\n\nTo work with JSON, you need to use the `encoding/json` library. It allows\
    \ you to both read and write JSON data.\n\nTo read JSON data you need to first\
    \ have a structure in your Go code read to map to the JSON data. Imagine having\
    \ the following JSON data:\n\n```\n1 {\n2   \"products\" : [\n3     {\n4     \
    \  \"id\": 1,\n5       \"name\": \"some product\"\n6     }\n7   ]\n8 }\n```\n\n\
    To map this in Go, you need a struct that matches its structure like so:\n\n```\n\
    1 type Product struct {\n2   Id int\n3   Name string\n4 }\n5 \n6 type Response\
    \ struct {\n7   Products []Product\n8 }\n```\n\n### Notation\n\nThe first step\
    \ is to create the structures needed to match your JSON data. But you also need\
    \ to do one more thing, add notations. The problem we are looking to solve is\
    \ how the `Product` property is called `Id` and not `id` as it’s called in the\
    \ JSON data.\n\n> Won’t that just work?\n\nUnfortunately, not\n\n> Why don’t you\
    \ just name the struct property `id`\n\nThe library `encoding/json`, is a separate\
    \ package from the main package, meaning we need to make a field name, defined\
    \ in the main package, uppercase for the `encoding/json` package to find it.\n\
    \nSo that means, we need to add the following annotations to our above created\
    \ structs:\n\n```\n1 type Product struct {\n2   Id int `json: \"id\"`\n3   Name\
    \ string `json: \"name\"`\n4 }\n5 \n6 type Response struct {\n7   Products []Product\
    \ `json: \"products\"`\n8 }\n```\n\nWhat these annotations do is to say, in the\
    \ JSON data, look for properties with these names and map them to the following\
    \ property. Like in this example from above:\n\n```\n1 Id int `json: \"id\"`\n\
    ```\n\n### Reading the data\n\nOk, so we’ve defined the structures in Go that\
    \ we will map our JSON data to. So how do we read from a JSON source? Well, JSON\
    \ is usually stored in one of two ways:\n\n*   a string literal, like so `{ \"\
    name\": \"my product\", \"id\": 1 }`\n\n*   in a JSON file:\n\n```\n1    {\n2\
    \      \"id\": 1,\n3      \"name\": \"my product\"\n4    }\n```\n\nLet’s show\
    \ how to work with both approaches:\n\n**Reading from a string literal**\n\nWe\
    \ will use the `Unmarshal()` function and provide it with the string literal as\
    \ the first parameter and the data to write the result to as the second parameter.\n\
    \n```\n 1 package main\n 2 \n 3 imports (\n 4   \"fmt\"\n 5   \"encoding/json\"\
    \n 6 )\n 7 \n 8 func main() {\n 9   str := `{ \"name\": \"my product\", \"id\"\
    : 1 }`\n10   product := Product{}\n11   json.Unmarshal([]byte(str), &person)\n\
    12   fmt.Println(person) // prints the object\n13 }\n```\n\nNote how we also convert\
    \ the response to a byte array `[]byte(str)` and how the data is written in the\
    \ second parameter to the `person` instance as a reference, `&person`.\n\n**read\
    \ from a file**\n\nTo read from a file, we will use the `io/ioutil` library and\
    \ its `ReadFile()` function. Like with the string literal, the `Unmarshal()` function\
    \ will be used to write the data to a struct instance.\n\n```\n 1 package main\n\
    \ 2 \n 3 import (\n 4  \"encoding/json\"\n 5  \"fmt\"\n 6  \"io/ioutil\"\n 7 \
    \ \"iohelper/dir\"\n 8  \"iohelper/file\"\n 9  \"log\"\n10 )\n11 \n12 type Products\
    \ struct {\n13  Products []Product `json: products`\n14 }\n15 \n16 type Product\
    \ struct {\n17  Id   int    `json: \"id\"`\n18  Name string `json: \"name\"`\n\
    19 }\n20 \n21 func main(){\n22   file, _ := ioutil.ReadFile(\"products.json\"\
    )\n23 \n24   data := Products{}\n25 \n26   _ = json.Unmarshal([]byte(file), &data)\n\
    27 \n28   for i := 0; i < len(data.Products); i++ {\n29     fmt.Println(\"Product\
    \ Id: \", data.Products[i].Id)\n30     fmt.Println(\"Name: \", data.Products[i].Name)\n\
    31   }\n32 }\n```\n\n## Writing JSON\n\nWe’ve seen so far how we can read JSON\
    \ data either from a string literal or from a file, but what about writing data?\n\
    \nTwo cases are important for us:\n\n*   Writing data to a structure. We are working\
    \ with structs so any changes we do on the structs need to be converted back to\
    \ JSON.\n\n*   Generate JSON from data. In the second case, we might be working\
    \ with a raw string literal or even with pure primitives, how would we do that?\n\
    \nLet’s address both these cases. What these cases have in common is the `Marshal()`\
    \ function. The `Marshal()` method can take a primitive or a struct and taking\
    \ that into JSON:\n\n```\n 1 package main\n 2 \n 3 import (\n 4  \"fmt\"\n 5 \
    \ \"encoding/json\"\n 6 )\n 7 \n 8 type Person struct {\n 9   Id int `json: \"\
    id\"`\n10   Name string`json: \"name\"`\n11 }\n12 \n13 func main() {\n14   aBoolean,\
    \ _ := json.Marshal(true)\n15   aString, _ := json.Marshal(\"a string\")\n16 \
    \  person := Person{\n17     Id: 1\n18     Name: \"a person\"\n19   }\n20   aPerson,\
    \ _ := json.Marshal(&person)\n21   fmt.Println(string(aBoolean)) // true\n22 \
    \  fmt.Println(string(aString))  // a string\n23   fmt.Println(string(person))\
    \  // { \"id\": 1, \"name\": \"a person\" }\n24 }\n```\n\n## Assignment\n\nGiven\
    \ the following file *response.json*, find a way to read the data and display\
    \ it on the screen:\n\n```\n 1 {\n 2   \"orders\": [\n 3    {\n 4     \"id\":\
    \ 1,\n 5     \"items\": [\n 6       { \"id\": 1, \"quantity\": 3, \"total\": 34.3\
    \ },\n 7      { \"id\": 2, \"quantity\": 2, \"total\": 17.8 }\n 8     ] \n 9 \
    \   },\n10    {\n11     \"id\": 2, \n12     \"items\": [\n13       { \"id\": 3,\
    \ \"quantity\": 3, \"total\": 10.0 },\n14       { \"id\": 4, \"quantity\": 2,\
    \ \"total\": 100.5 }\n15     ] \n16    } \n17   ]\n18 }\n```\n\n## Solution"
