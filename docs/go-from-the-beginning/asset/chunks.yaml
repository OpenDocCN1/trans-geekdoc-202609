    \ \n\n    ```\n    1  w.Write(content)\n    ```\n\n### Serving JSON data\n\nJust\
    \ like with serving images, we need to follow a similar approach of configuring\
    \ the correct content-type header and then constructing the response. Here’s the\
    \ code:\n\n```\n 1 package main\n 2 \n 3 import (\n 4   \"encoding/json\"\n 5\
    \ )\n 6 \n 7 type Person struct {\n 8   Id int\n 9   Name string\n10 }\n11 \n\
    12 func ReturnJson(w http.ResponseWriter, r *http.Request) {\n13   w.Header().Set(\"\
    Content-Type\", \"application/json\")\n14 \n15   p := Person {\n16     Id: 1\n\
    17     Name: \"a person\"\n18   }\n19 \n20   json.NewEncoder(w).Encode(p)\n21\
    \ }\n22 \n23 func main() {\n24   http.HandleFunc(\"/json\", ReturnJson)\n25 }\n\
    ```\n\n*   First, we set the content type, by setting the value “application/json”:\
    \ \n\n    ```\n    1  w.Header().Set(\"Content-Type\", \"application/json\")\n\
    \    ```\n\n*   Secondly, we construct the data we are about to send out: \n\n\
    \    ```\n    1  p := Person {\n    2   Id: 1\n    3   Name: \"a person\"\n  \
    \  4 }\n    ```\n\n*   Finally, we encode the data as JSON and write it to the\
    \ response stream: \n\n    ```\n    1  json.NewEncoder(w).Encode(p)\n    ```\n\
    \nIt’s also possible to use the `Marshal()` function like so, instead of `json.NewEncoder()`:\n\
    ```\n1 package main\n2 \n3 import (\n4   \"encoding/json\"\n5 )\n6 \n7 func ReturnJson(w\
    \ http.ResponseWriter, r *http.Request) {\n8     w.Header().Set(\"Content-Type\"\
    , \"application/json\")\n9 \n10    p := Person {\n11      Id: 1\n12      Name:\
    \ \"a person\"\n13    }\n14 \n15    data, _ := json.Marshal(p)\n16    w.Write(data)\n\
    17 }\n18 \n19 func main() {\n20    http.HandleFunc(\"/json\", ReturnJson)\n21\
    \ }\n```\n"
  trans: "\n-   [构建 Web API](https://example.org) 通常是我们与服务或客户端交互以提供数据的方式。客户端可能是网页或像\
    \ curl 这样的工具。本章我们将学习如何构建一个 Web API，它通过 HTTP 处理请求。\n\n## Introduction\n\n在本章中，你将学习以下内容：\n\
    \n*   什么是 Web API。\n\n*   `net/http` 库及其在高层面上的功能。\n\n*   响应请求。\n\n*   处理请求数据，包括路由和查询参数，以及请求体。\n\
    \n*   使用 ServeMux，以及为什么它可能是首选选择。\n\n## Web API\n\nWeb 服务的常见责任是响应请求：\n\n*   **请求数据**\
    \ 并返回数据，如 JSON、XML、图片、CSS、HTML\n\n*   **请求修改资源** ，包括创建、更新或删除\n\n## The `net/http`\
    \ library\n\n`net/http` 是一个库，它将帮助我们构建 Web 服务器。使用该库构建 Web 服务器涉及以下步骤：\n\n*   创建服务器实例。\n\
    \n*   定义路由请求并指定如何响应它们。\n\n*   启动服务器实例，确保它在特定地址和端口上可访问。\n\n### 创建服务器实例\n\n在 `net/http`\
    \ 中，`http` 代表你的服务实例。\n\n```\n1 import (\n2   \"fmt\"\n3   \"net/http\"\n4 )\n\
    5 \n6 func main() {\n7     // do something with `http`\n8 }\n```\n\n### 定义路由\n\
    \n路由是你在应用中定义逻辑分离的方式，例如 `products`、`orders` 或其他合理的区域。\n\n要定义路由，你需要定义一个路由模式和一个函数，当路由被访问时，该函数会被调用：\n\
    \n```\n1 func hello(w http.ResponseWriter, req *http.Request) {\n2   fmt.Fprintf(w,\
    \ \"hello\\n\")\n3 }\n4 \n5 func main(){\n6   http.HandleFunc(\"/hello\", hello)\n\
    7 }\n```\n\n在上面的代码中，“/hello”是路由模式，表示所有访问“/hello”的 web 请求都应由 `hello()` 函数处理。\n\n\
    ### 响应和请求\n\n`hello()` 函数显示它接受 `ResponseWriter` 和 `Request`：\n\n```\n1 func hello(w\
    \ http.ResponseWriter, req *http.Request) {\n2   fmt.c(w, \"hello\\n\")\n3 }\n\
    ```\n\n预期你会检查 `req` 对象，根据请求中的数据决定返回什么内容。然后你需要使用 `w` 来生成响应。在这个例子中，你通过将 `w` 传递给\
    \ `Fprintf()` 来返回字符串。`FPrintf()` 接受一个写入器。写入器可以是任何 IO，因此它可以写入文件，也可以像这里一样写入 HTTP\
    \ 响应流。\n\n### 启动服务器\n\n我们已经介绍了路由、生成响应，现在该启动服务器以便它能响应请求了。\n\n你使用 `ListenAndServe()`\
    \ 函数启动服务器，该函数接受端口，例如：\n\n```\n1 http.ListenAndServe(\":8090\", nil)\n```\n\n##\
    \ 响应请求\n\n incoming request 可能是请求特定路由（例如 /products 或 /orders），也可能是请求特定静态文件（如图片、文本文件或\
    \ CSS）。请求本身提供了提示，不仅表明它想要的逻辑域（如 orders 或 products），还可能表明它想要的数据类型，或者甚至提供用于身份验证的凭证。这种提示被称为\
    \ **header**。\n\n### Header\n\nHeader 是传递信息的概念，它可以指示内容类型、内容大小，或者作为验证令牌（例如用于身份验证）。\n\
    \nHeader 既可以出现在 incoming request（ incoming request）中，也可以出现在 response 中。\n\n###\
    \ 服务不同类型的内容\n\n服务不同类型的内容意味着我们在处理响应。为了服务各种内容类型，我们需要在响应上指示其内容类型，这样消费客户端就知道如何解析它（在某些情况下，像浏览器这样的客户端可以通过内容嗅探（content\
    \ sniffing）自行判断）。\n\n要服务特定类型的内容，你需要做两件事：\n\n*   **设置内容类型**，通过调用：\n\n    ```\n\
    \    1  w.Header().Set(\"Content-Type\", \"image/jpeg\")\n    ```\n\n    这里的内容类型是\
    \ JPEG 子类型的图像。你可以设置的内容类型有 plain text、CSS、JSON、XML 等多种。\n\n*   **生成响应**。生成响应意味着向响应流写入数据。这可以通过调用\
    \ `ResponseWriter` 实例的 `Write()` 方法来完成。还有其他可以写入该流的方法。\n\n### 服务图片数据\n\n要服务图片，你需要将其加载到内存中，设置内容类型，然后将其写入响应流，如下所示：\n\
    \n```\n 1 func GetImage(w http.ResponseWriter, r *http.Request) {\n 2     f, _\
    \ := os.Open(\"/image.jpg\")\n 3     \n 4     // 将整个 JPG 文件读取到内存中。\n 5     reader\
    \ := bufio.NewReader(f)\n 6     content, _ := ioutil.ReadAll(reader)\n 7     \n\
    \ 8     // 设置 Content-Type 头。\n 9     w.Header().Set(\"Content-Type\", \"image/jpeg\"\
    )\n10     \n11     // 将图片写入响应。\n12     w.Write(content)\n13 }\n```\n\n*   首先，我们打开图片：\n\
    \n    ```\n    1  f, _ := os.Open(\"/image.jpg\")\n    ```\n\n*   其次，我们将文件读取到内存中：\n\
    \n    ```\n    1  reader := bufio.NewReader(f)\n    2  content, _ := ioutil.ReadAll(reader)\n\
    \    ```\n\n*   第三步，设置 `Content-Type` 头，指示它是 JPEG 图像，值为 “image/jpeg”：\n\n    ```\n\
    \    1  w.Header().Set(\"Content-Type\", \"image/jpeg\")\n    ```\n\n*   最后，我们将内容写入响应：\n\
    \n    ```\n    1  w.Write(content)\n    ```\n\n### 服务 JSON 数据\n\n与服务图片类似，我们需要遵循相同的步骤：配置正确的\
    \ content-type 头，然后构建响应。以下是代码示例：\n\n```\n 1 package main\n 2 \n 3 import (\n 4\
    \   \"encoding/json\"\n 5 )\n 6 \n 7 type Person struct {\n 8   Id int\n 9   Name\
    \ string\n10 }\n11 \n12 func ReturnJson(w http.ResponseWriter, r *http.Request)\
    \ {\n13   w.Header().Set(\"Content-Type\", \"application/json\")\n14 \n15   p\
    \ := Person {\n16     Id: 1\n17     Name: \"a person\"\n18   }\n19 \n20   json.NewEncoder(w).Encode(p)\n\
    21 }\n22 \n23 func main() {\n24   http.HandleFunc(\"/json\", ReturnJson)\n25 }\n\
    ```\n\n*   首先，通过设置值 “application/json” 来设置内容类型：\n\n    ```\n    1  w.Header().Set(\"\
    Content-Type\", \"application/json\")\n    ```\n\n*   其次，构建我们要发送的数据：\n\n    ```\n\
    \    1  p := Person {\n    2   Id: 1\n    3   Name: \"a person\"\n    4 }\n  \
    \  ```\n\n*   最后，使用 `json.NewEncoder()` 编码数据并写入响应流：\n\n    ```\n    1  json.NewEncoder(w).Encode(p)\n\
    \    ```\n\n也可以使用 `Marshal()` 函数，例如：\n\n```\n1 package main\n2 \n3 import (\n\
    4   \"encoding/json\"\n5 )\n6 \n7 func ReturnJson(w http.ResponseWriter, r *http.Request)\
    \ {\n8     w.Header().Set(\"Content-Type\", \"application/json\")\n9 \n10    p\
    \ := Person {\n11      Id: 1\n12      Name: \"a person\"\n13    }\n14 \n15   \
    \ data, _ := json.Marshal(p)\n16    w.Write(data)\n17 }\n18 \n19 func main() {\n\
    20    http.HandleFunc(\"/json\", ReturnJson)\n21 }\n```\n\n"
