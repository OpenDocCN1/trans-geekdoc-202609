    \n2.  To the same file, add `main()` function and use external function, from\
    \ package: \n\n    ```\n    1  func main() {\n    2    sum += math.Add(1,2)\n\
    \    3    fmt.Println(sum)\n    4  }\n    ```\n\n### Fetch the lib\n\nNow, we\
    \ need to resolve the external library.\n\n1.  Run `go mod tidy`:\n\n    ```\n\
    \    1  go mod tidy\n    ```\n\n    Your *go.mod* is updated:\n\n    ```\n   \
    \ 1  require github.com/softchris/math v0.2.0\n    ```\n\n    There’s also *go.sum*\
