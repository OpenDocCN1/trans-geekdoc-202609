- raw: "*   [https://docs.microsoft.com/en-us/learn/modules/go-get-started/](https://docs.microsoft.com/en-us/learn/modules/go-get-started/)\n\
    \n*   [https://docs.microsoft.com/en-us/learn/modules/serverless-go/](https://docs.microsoft.com/en-us/learn/modules/serverless-go/)\n\
    \n## Assignment\n\nCreate a file *main.go*. Use the `fmt` library to print out\
    \ to the console. Remember that your run programs with `go run <my program>.go`.\n\
    \n## Solution\n\nCreate a file *main.go*\n\n```\n1 package main\n2 \n3 import\
    \ \"fmt\"\n4 \n5 func main() {\n6   fmt.Println(\"printing to the console\")\n\
    7 }\n```\n\n# Using variables\n\nWith variables, we can remember values and later\
    \ refer to them via named references. using variables will make our code easier\
    \ to read.\n\n## Introduction\n\nIn this lesson we’ll cover:\n\n*   The usage\
    \ of variables in Go.\n\n*   How to create them.\n\n*   Assign different types\
    \ and values.\n\n## Declare variables\n\nIn Go, there are many ways to declare\
    \ variables:\n\n*   **Define a name and type**. Here, you declare a variable with\
    \ the keyword `var`, give it a name and lastly a type `string`. Below is an example:\
    \ \n\n    ```\n    1   var firstName string\n    ```\n\n*   **Define a group**\
    \ of variables. It’s possible to define a group of variables. Using this way of\
    \ declaring means you only type the `var` keyword once. The group is defined using\
    \ parenthesis `()`:\n\n    ```\n    1  var (\n    2    firstName = \"Chris\"\n\
    \    3    age = 20\n    4  )\n    ```\n\n    Note how each variable is on a new\
    \ row.\n\n*   **Define and assign a value**. Within functions, you can use the\
    \ `:=` operator, it declares and assigns at the same time. The below code shows\
    \ the creation of the `firstName` variable. The data type is inferred to be a\
    \ string: \n\n    ```\n    1  firstName := \"Chris\"\n    ```\n\n## Assign variables\n\
    \nTo assign a new value to a variable, it needs to exist first. You use the assignment\
    \ operator, `=`. Here’s an example:\n\n```\n1 firstName = \"Mike\"\n```\n\n##\
    \ Data types\n\nThere are many data types you can use with Go. They are divided\
    \ into different categories:\n\n*   **Basic types**. In this category, we find\
    \ types like integers, floats (numbers with decimals) and other types like Booleans\
    \ (for true/false), strings (for text) and more.\n\n*   **Composite types**. We\
    \ will talk about composite types in a separate article, but they are more complex,\
    \ and examples of composite types are arrays, structs and interfaces.\n\n### Declare\
    \ a variable with a type\n\nThere are two ways you can declare a variable and\
    \ give it a type:\n\n*   **explicitly**, by specifying its type, for example:\
    \ \n\n    ```\n    1  var name string\n    ```\n\n*   **implicitly**, by assigning\
    \ it a value and having it been inferred:\n\n    ```\n    1  name := \"chris\"\
    \n    ```\n\n    In the preceding code, the data type is inferred by the value\
    \ you give it. In this case, the data type becomes `string` based on the value\
    \ “chris”.\n\n## String interpolation\n\nSometimes, you want to be able to write\
    \ things to the screen and mix different data types doing so. For example, you\
    \ might want to write, “Customer: Adam has 20$ in his bank account”.\n\nLet’s\
    \ say then that this information is represented by these two variables:\n\n```\n\
    1 var (\n2   customerName = \"Adam\"\n3   accountBalance = 20\n4 )\n```\n\nHow\
    \ can you print out the text above? For this purpose, you can use the `Printf()`\
    \ function that takes formatters. The idea is that a formatter is an instruction\
    \ to what a certain type is. By providing this information to `Printf()`, it’s\
    \ able to print the type correctly.\n\nHere’s how you can print the example string\
    \ from before:\n\n```\n1 fmt.Printf(\"Customer %s has %d$ on their bank account\"\
    , customerName, accountBalance)\n```\n\nAbove, the `%s` represents a string and\
    \ `%d` represents a number. By using these formatters as placeholders, the variables\
    \ are correctly implemented, and the output becomes:\n\n```\n1 Customer Adam has\
    \ 20$ on their bank account\n```\n\n## Assignment - define some variables and\
    \ print them out\n\nDefine some variables you might need for the card game Texas\
    \ Holdem and print them out.\n\nCreate a file *main.go* and give it the following\
    \ content:\n\n```\n1     package main\n2     \n3     import \"fmt\"\n4     \n\
    5     func main () {\n6     }\n```\n\n1.  Add the following variables after the\
    \ import section:\n\n    ```\n    1 var (\n    2   players = 3\n    3   replay\
    \ = false\n    4   namePlayerOne = \"chris\"\n    5 )\n    ```\n\n    Now you\
    \ have:\n\n    *   `players`, to represent the number of players in the game.\n\
    \n    *   `replay`, a boolean stating whether to start a new game session when\
    \ the old one has ended.\n\n    *   `namePlayerOne`, a string representing the\
    \ name of the first player.\n\n    All of these variables help describe essential\
    \ information in a Texas Holdem game.\n\n    Next, let’s run our app to make sure\
    \ it works.\n\n2.  Add the following code to the `main()` function to print out\
    \ the variables: \n\n    ```\n    1 fmt.Println(players)\n    2 fmt.Println(replay)\n\
    \    3 fmt.Println(namePlayerOne)\n    ```\n\n3.  Run `go run main.go` in the\
    \ terminal:\n\n    ```\n    1 go run main.go\n    ```\n\n    You should see the\
    \ following output:\n\n    ```\n    1  3\n    2  false\n    3  chris\n    ```\n\
    \n    Great, you now have a starting point for an app you can keep building on.\n\
    \n## \U0001F680 Challenge\n\nSee if you can come up with more variables to represent\
    \ the state in a Texas Holdem card game, like for example, other players, the\
    \ card deck etc. What data type would you give those variables?\n\n## Review &\
    \ Self Study\n\nHave a look at this [official tutorial on variables](https://go.dev/tour/basics/8)\
    \ using a Go sandbox\n\n## Solution\n\n```\n 1 package main\n 2 \n 3 import \"\
    fmt\"\n 4 \n 5 var (\n 6   players = 3\n 7   replay = false\n 8   namePlayerOne\
    \ = \"chris\" \n 9 )\n10 \n11 func main () {\n12   fmt.Println(players)\n13  \
    \ fmt.Println(replay)\n14   fmt.Println(namePlayerOne)\n15 }\n```\n\n# Flow control\n\
    \nIn this chapter, we’re looking to learn about constructs `if` and `else` to\
    \ control the flow of your application.\n\n## Introduction\n\nThis chapter will\
    \ cover:\n\n*   Working with Boolean logic.\n\n*   Create Boolean data.\n\n* \
    \  Use constructs like `if`, `else if` and `else`.\n\n## Flow control\n\nUsing\
    \ Boolean logic in your program is about creating different execution paths through\
    \ your code?\n\n> What does that mean?\n\nIt means there’s more than one way that\
    \ your program can run depending on what data you feed it.\n\n> Ok, can you show\
    \ me?\n\nSure, consider this code:\n\n```\n1 printMessage := true\n2 \n3 if printMessage\
    \ {\n4   fmt.Println(\"Message\")\n5 }\n```\n\nIf `printMessage` is `true`, the\
    \ string “Message” will print. If the value is `false`, nothing will print.\n\n\
    > Ok, I think I get it.\n\n## The `if` construct\n\nYou’ve seen an example already\
    \ about code that runs or doesn’t run depending on a value. The `if` construct\
    \ is what makes that possible. An `if` take a Boolean expression like so:\n\n\
    ```\n1 if true {\n2   // statements here will always run\n3 }\n```\n\n### Using\
    \ a Boolean variable\n\nWhen you use a Boolean value as part of your Boolean expression,\
    \ it needs to be evaluated. Here’s code showing just that:\n\n```\n1 accountBalance\
    \ = 100\n2 accountCredit = 200\n3 if accountBalance + accountCredit > 0 {\n4 \
    \  fmt.Println(\"You have money to spend\")\n5 }\n```\n\nThe program above does\
    \ the job, meaning it correctly evaluates whether you have money to spend. However,\
    \ you might want to print something out if the condition is not met, for that\
    \ you have `else`.\n\n### Introducing `else`\n\nYou would like to improve the\
    \ preceding code. The `else` clause is run when `if` is evaluated to false. Here’s\
    \ how you can add it to the program:\n\n```\n1 accountBalance = 100\n2 accountCredit\
    \ = 200\n3 if accountBalance + accountCredit > 0 {\n4   fmt.Println(\"You have\
    \ money to spend\")\n5 } else {\n6   fmt.Println(\"No money left, please add more\
    \ funds\")\n7 }\n```\n\n## Using `else if`"
