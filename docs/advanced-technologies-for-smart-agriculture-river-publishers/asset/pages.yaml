  md: '# Autonomous Devices in Smart Farming


    T. Manikandan¹, E. Duraiarasu¹, C. Ganesh Kumar¹, S. Jeevitha¹,

    S. Harihara Sudhan¹, and Olabiyi Stephen Olatunde²


    ¹Department of Electronics and Communication Engineering, Rajalakshmi

    Engineering College, India

    ²Computer Science and Engineering, Ladoke Akintola University of

    Technology, Nigeria

    Email: manikandan.t@rajalakshmi.edu.in; 200801064@rajalakshmi.edu.in;

    200801066@rajalakshmi.edu.in; 200801087@rajalakshmi.edu.in;

    20080101074@rajalakshmi.edu.in; soolabiyi@lautech.edu.ng


    # Abstract


    Co-growing or intercropping means growing two or more crops in the same

    field. The main purpose of intercropping is to obtain more net results from

    an open farm by using resources, and those techniques will not be used to

    raise a single crop. Intercropping-based agriculture makes farming easier

    to cultivate various crops simultaneously. This will be more efficient and

    time-saving in the small portion of land. The possibility of getting yield

    in two contrasting types of crops needs two requirements; proper irrigation

    and nutrients. An alert system for the safety and the physical phenomenon

    is required, that is why there is a need for an autonomous system. The sys-

    tem is capable of irrigating the proper amount of water to the different crop

    variety present in the fields. For this consider the other features like climate

    monitoring and forecasting, smart pest management, smart greenhouse,

    remote crop monitoring, etc. Smart farming helps to improve agriculture

    with techniques to operate, monitor, automate and analyze the operations

    using advanced techniques such as large data, the virtual database and inter-

    net-based technologies. It is simply a management concept. Smart agricult-

    ture, in other words, is known as precision agriculture, which works by the

    coordination of many sensors.'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'The increased growth of the global population increases the demand for food
    and with it comes the need for efficient use of natural resources; with that said
    there is also an increase in the usage of sophisticated information and communication
    technologies, thereby resulting in an increasing need for a smart climate tracking
    device. The importance of smart agriculture in daily life is increasing exponentially.
    The plant monitoring system is helpful to water the plants and monitor some parameters
    related to plant growth. This system is widely accepted in a few areas such as
    in tree nurseries and agriculture. The system frame contains a potentiometric
    sensor and physical sensors fixed in the root area of plants, and a vibration
    of frequency sensor is installed in the tank to check the water level in the tank.
    Smart systems have built-in detection, action and control capabilities to describe
    and analyze the situation and make decisions based on data available in predictive
    or adaptive ways, thereby smart actions. To execute in most cases, the “smartness”
    of a system can be attributed to controlling the energy efficiency and autonomous
    operation based on networking capabilities. Smart monitoring systems using technologies
    with internet-connected devices are adaptable for monitoring the plants effectively
    and efficiently. It is also suitable for checking the condition of the soil. This
    can help to get better growth of the crops. It may help in controlling the usage
    of water efficiently.


    An autonomous system (AS) is a set of internet-based connected objects and prefixes
    that belong to a network or group of networks, all managed, controlled and overseen
    by a single entity or organization. The AS uses a common routing policy controlled
    by the entity. This system is capable of monitoring more than two crop varieties
    at the same time and the physical constraints have been accurately defined for
    efficient management of the crop under various conditions. Thus, the requisites
    of this type of agriculture will be given with the data which is a specifically
    suitable parameter for good yield of the specific crop variety, and these will
    be used as the thresholds. The autonomous system will react accordingly to the
    different situations and the system will give a response which is favorable to
    safeguard the specific type of crops. Furthermore, this autonomous system will
    help the different varieties of crops to sustain the situation which otherwise
    is not suitable for that crop variety. Hence, this chapter explores the various
    techniques and methods involved in it and explains how this autonomous system
    will be capable of overcoming these problems which are faced during this type
    of farming.'
  merge: -1
  img_proc: true
- pgno: 115
  md: '# 4.1 Introduction


    Intercropping is a common practice of growing more than two crops of different
    varieties simultaneously in the same field. In other words, intercropping is the
    practice of cultivating more than one crop simultaneously over the same particular
    field. The most beneficial advantage of intercropping is that it produces a greater
    outcome in terms of yield within a short duration in a single land. The crops
    grown on that particular land use up the available resources to their full potential,
    while a single crop cannot utilize all the resources. Hence, the intercropping
    method is seen as one of the powerful ways of growing crops and producing much
    greater yield within a shorter period in a small field. Some well-known implementations
    of these techniques are planting crops that have deep roots along with a crop
    that has shallow roots and also planting a crop that is taller with a crop that
    is shorter which in this case requires a minimum amount of shade. There are various
    types of intercropping systems which vary on factors like the spatial and temporal
    mixture to some extent. This degree of temporal and spatial interference in the
    crops may differ, but the main thing is that both conditions should satisfy for
    a proper intercropping system to exist. To name a few, there are mixed intercropping
    systems, relay cropping systems and row cropping systems. One point to be noted
    is that crop rotation is indeed related, but not the intercropping system. The
    reason is different varieties of crops are grown in different seasons instead
    of growing within a single season. While carrying out this method, one should
    keep the most important thing in mind, which is careful planning. This plan should
    be taking into account the soil quality, climactic conditions and crops and their
    varieties. Also, the crops should not compete for the area, minerals, H2O and
    natural light sources such as sunlight. After checking these conditions, other
    related agronomic effects can also be achieved.


    There are many advantages to an intercropping system such as intercropping of
    compatible and suitable plants helping to achieve biodiversity and soil diversity,
    or providing a proper healthy environment for a variety of insects and soil organisms
    that might not be present in the case of a single crop environment. Micro-organisms
    might provide the crops with suitable and valuable nutrients, such as via (Nitrogen)
    N2 fixation. And other such benefits are farmers could expect a higher percentage
    of yields during harvesting within a short period. Additionally, it also increases
    our overall economical value by improving agricultural productivity and reducing
    the challenges and poverty faced by the farmers. Even though there are many advantages
    to this'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'system, there are still some drawbacks that are important to consider. Some
    of the main drawbacks of this system are poor pest management, difficulty in managing
    the growth of crops, especially in the irrigation process, when one needs to deliver
    a suitable amount of water to the suitable kind of crop, monitoring the climate
    to track and control the behavior of the plants and also controlling and preventing
    the pests and insects from damaging the crops and obliterating their quality.
    And all those problems lead to the wastage of money, energy, man labor, water,
    time and other such resources. All the hard work and efforts made by the courageous
    farmers get affected only by the improper management of those previously mentioned
    factors. This leads to a decrease in the entire economical growth degradation
    of crops in the agricultural sectors and also decreases the overall yield and
    quality drastically. As a result, one country might face serious issues like global
    warming, poverty and famine and other such obliterating disasters.


    With ongoing developments in the field of agriculture, smart agriculture can be
    of huge benefit to the agricultural sectors. This will indeed uplift the overall
    productivity, quality, resource management and usage in the overall agricultural
    sector. Precision farming/agriculture is a similar kind of smart agriculture,
    which differs in the way how precise the total agriculture process happens (such
    as delivering the exact amount of water to the crops). It is a type of agriculture,
    which includes management strategies that gather, process and analyze the spatial,
    temporal and individual data to combine it with the other information to support
    management decisions according to the estimated changes and variability for improving
    the usage of resources effectively, efficiently and increasing the profitability
    by improving productivity, quality and sustainability. Precision agriculture is
    the most efficient way of agriculture because it presents the most innovative
    and expected results which emerge from various experiments and research conducted
    in the field of agriculture. Furthermore, it provides an effective platform for
    disseminating original and fundamental experiences and research in this rapidly
    developing sector. The goal of this type of agriculture is to establish a decision
    support system (DSS) for the overall farm management considering the maximum optimal
    returns on the inputs while preserving the available resources.


    Along with the help of smart agriculture, precision agriculture can achieve tremendous
    heights in the agricultural sectors with the help of an automated system that
    incorporates various modern enhanced technologies. This system can be deployed
    with numerous sensors, according to the needs of an individual which differs based
    on the workplace. Sensors that are installed on that particular system can be
    used to collect and gather data on various aspects and parameters. Some of the
    parameters are soil moisture,'
  merge: -1
  img_proc: true
- pgno: 117
  md: 'its quality and monitoring climate, tracking the water and nutrient supply.
    Finally, these collected data can be processed into information with the help
    of portable data acquisition systems. With the help of the Internet of Things
    (IoT), this system can be made to use and access wirelessly by installing a simple
    internet connectivity network with the help of wireless Wi-Fi modules [1–3]. Through
    this network, the data collected with the help of sensors can be stored and procured
    in an online platform, which is an online cloud service such as Amazon cloud drive.
    Moreover, this procured data can be converted into information using various applications
    and software such as LabView. Once the information is processed, that whole collection
    of information can be fed to an artificial intelligence framework which indeed
    uses machine learning models and algorithms. With the help of this fed information,
    this machine learning model will train according to the datasets given to it.
    The training process will be repeated until those models find a new way to automate
    the various systems, such as irrigation systems and climate monitoring systems.


    # 4.2 Related Works


    Due to advancements in our modern world, the agricultural sector is facing a lot
    of changes like shortage of land and workers which lead to a shortage of yield.
    To overcome these problems, a cost-efficient and modern technique is required.
    For those challenges, one solution is found, which is crop online monitoring using
    IoT technology which helps to know about all the information like animal intrusion,
    crop health, growth of weeds and water level in a tank. The main objective is
    that the farmer can access this network anywhere and anytime at any place. Using
    wireless network, farm conditions can be accessed and microcontrollers can be
    used to know about the farm’s process. Wireless cameras also have been been used
    to capture images and videos of the farm. To detect the conditions of the environment
    like temperature, humidity sensors have been used to retrieve and store databases.
    ATMEGA8535 and IC8817BS, analogue to digital conversion and wireless transceiver
    module based on Zig Protocol, have been used in this system. WSN is used to determine
    the timely need for watering which results in efficient use of water. The use
    of smart technologies and their combination helps the farmers to do farming effectively
    [4].


    Climatic changes had a great impact in all aspects, especially in the agricultural
    field which had a major impact on people’s life leading to poverty in farmer’s
    life and a shortage of food. This smart agriculture is a great solution; the main
    objective is to send the farmers an SMS about the exact weather'
  merge: -1
  img_proc: true
- pgno: 118
  md: 'condition of the farm using the Rotronic Monitoring System (RMS) so that farmers
    can easily take some precautionary measures to protect the crops. By using certain
    parameters, detection of local agricultural parameters can be achieved. WINGZ
    (Wireless IP Network Gateway) using Zigbee technology works as a coordinator for
    WPAN networks. This system helps in obtaining the current weather condition of
    the farm including the weather forecasting of the previous days and provides an
    environment where users can monitor the data. Some researchers have concentrated
    on crop monitoring, and they have collected some spatial data about temperature
    and rainfall to reduce crop loss and increase crop production [5]. To increase
    yield production, crop has to be monitored from time to time, by using IoT major
    factors of the farm like soil moisture and certain other factors, which help in
    better planning for future production of crops. This technique has a major advantage
    as an energy conservation technique and it can also be used in different types
    of modes like standby mode, sleep mode and power-saving mode. When the system
    is powered on the microcontroller unit, the system activates the peripherals for
    communication between the devices. Then the connection between sensors is checked
    and the information is shared via the sensors, then it is shared with the computer.
    If a deviation occurs, required actions can be sent establishing a warning to
    the farmer and automatic switching ON of motor can be done with the help of sensors
    if required. For storing information, wireless sensors are used. Arduino board
    with ATmega microcontroller can react to the changes in the environment [6].


    Another new modern technique for enhancing agriculture is CupCarbon Simulator,
    which shows greater efficiency compared to other techniques. Soil moisture is
    an important factor for plant growth. Excess moisture content in the soil leads
    to swelling of the roots of the plant and leads to the death of the plant or low
    yield. This technique helps in increasing productivity by 70% and also water is
    saved by 20.9%, and the growth rate is also increased by 41.2%. The humidity and
    temperature sensor (DHT22) was used to measure the humidity and temperature and
    the solenoid valve helps to control water flow on the field; the valve currently
    helps the coil to open and close the fluid flow valve. When water flows through
    the rotor, the sensor will detect the output pulse. In this proposed system, NodeMCU
    ESP8266 is used as the main processing unit and all sensors work together to send
    and receive information with the help of cloud firebase and data storage that
    help to monitor the farmland to track and record factors such as height, flower
    and fruit for a certain time to know the difference [7].


    As the previous research used IoT and its advancement, here introducing new technology
    using the cloud computing concept and the LEACH'
