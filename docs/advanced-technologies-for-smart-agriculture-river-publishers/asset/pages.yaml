    # 12.3 An Overview of the Indian Scenario


    # 12.3.1 Climate change in India


    India is the world’s fifth country that is extremely vulnerable to climatic changes.
    Climate change cost India almost 37 billion dollars in 2018 (almost twice what
    it lost between 1998 and 2017). According to the NITI Aayog (2018), over 600 million
    Indians would face “severe water scarcity” in the next years. If surface warming
    increases by 2°C over preindustrial levels, major flooding is expected to increase
    in more than 89 urban regions of India, according to a report given by MIT. There
    have been more heat waves, which have led to violent cyclones and a rise in sea
