    # ## 3.4 Scope and Challenges in Crop Management System


    This section presents a complete analysis of sophisticated strategies based on
    deep learning as well as machine learning that were used within smart farming.
    We specifically examine the scope, recent application and opportunities, problems,
    limits and future research avenues of machine learning – as well as deep learning-based
    advanced approaches used within smart farming.


    # ### 3.4.1 Role of artificial intelligence in smart farming


    Over the years, technology has reshaped farming, and technological breakthroughs
    have an influence on the agriculture industry by a variety of aspects. Agriculture
    is a major activity in several countries across the world, and as the world''s
    population grows, so does agriculture, which, according to UN projections, will
    increase from 7.52 billion to 9.78 billion by 2050; there will also be additional
    land pressure, because just 4% of land will be farmed by that time [53–54]. As
    a result, farmers would have to do more with less. Also according to the survey,
    food production will need to increase by 60% in order to serve an additional 2
    billion people. Traditional approaches are inadequate to meet this enormous need.
    This is causing farmers and agribusinesses to look for innovative ways to enhance
    output while reducing waste. As a result, AI is progressively becoming a part
    of the agricultural industry''s technical growth. Applications of computer vision
    in agriculture AI-powered solutions may not only help farmers increase efficiency,
    but they will also boost crop yield, quality and assure a faster time to market
    (Figure 3.4).


    # ### 3.4.2 Farmers challenges in adopting new technologies


    A number of challenges and factors influence the technology''s acceptance and
    implementation. Farmers are the primary stakeholders in the technology'
  merge: -1
  img_proc: true
