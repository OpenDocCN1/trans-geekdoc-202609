    # 8.2.5 Multi-storied cropping system


    Two or more crops of varied heights are planted on the same plot of land at the
    same time in a multi-storied cropping system. To maximize sunshine, fertilizer
    consumption, sustainable land use, and ecological balance, a multi-story cropping
    system supports crops of varied heights, canopy patterns, and root systems. In
    this cropping system, the potential of more efficient use of resources like sunlight,
    water, soil, and fertilizers leads to increased biological variety, more crops
    per unit area, and production sustainability [17].


    # 8.2.5.1 Principles of multi-cropping system


    Coriander, radish, beetroot, cluster bean, cowpea, and other crops with varying
    growth habits, root depth, and crop length can be used to create multi-tier cropping
    systems. Farmers reduce soil erosion by cultivating multiple crops in the same
    area at the same time, which is a key drawback of monoculture cropping.'
