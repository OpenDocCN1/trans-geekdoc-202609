  md: 'Precision agriculture demands a large set of data whose availability is considered
    to be an important factor. It is believed that precision agriculture data acquisition
    methods can evolve from truth collection to sensors. Remote sensing is an important
    and convenient way to collect precision agriculture data. This system acquires
