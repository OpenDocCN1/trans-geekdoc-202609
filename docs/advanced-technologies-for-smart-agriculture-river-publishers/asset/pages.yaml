    # # 1.2.1.5 Other measurements


    We provide a wide range of additional IoT sensors for agriculture and are useful
    in certain specialized situations. They improve any IoT implementation even though
    they are not soil monitoring. The following additional sensors are among them:


    +   - Soil oxygen levels and vapor pressure.

    +   - The temperature of the leaves and flower buds.

    +   - Leaf moisture.

    +   - Fruit, stem, and trunk dimensions.


    # # 1.2.1.6 Wireless communications for IoT and smart agriculture


    The availability of a wide variety of wireless communication methods is a fundamental
    advantage of IoT solutions. The use of smart farming is not limited to urban,
    rural or extremely remote environments. It can be applied to 4G, LoRaWAN, Zigbee,
    Sigfox, Wi-Fi, and satellite technology as well. The coverage is not limited to
    urban areas. Sensors and nodes from IoT networks require minimal power, making
    them compatible with battery, solar or other renewable sources of energy (Figure
    1.10).


    # # 1.2.1.7 Applications


    IoT can be used to optimize the operations of almost any agriculture or farming
    enterprise. Particular interest has been shown below:


    +   - Marijuana and hemp

