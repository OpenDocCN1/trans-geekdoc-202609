  md: '![](img/d1f13ee8a5e334af2b540a0b952cbea1_45_0.png)


    # 1.3.1 Robotics in agriculture


    Over the past century, automation has improved to handle complex tasks and increase
    productivity.


    Farmers are starting to pay attention to ag-bots, sometimes called agriculture
    robots, as a result of the worldwide labor shortage and increased demand. Agriculture
    yield reduced approximately 2000 million tons per year due to labor shortage in
    the entire world. With the usage of modern equipment and cutting-edge technologies
    allowing systems to extract meaningful outcomes from their neighbors, ag-robotics
    are now more widely known. We are currently at the very beginning of an ag-robotics
    revolution (Figure 1.12).


    # 1.3.1.1 Weeding robots


    These cunning agricultural robots make use of advanced image processing methods
    to look for similarities between crops and weeds in photos in its database. They
    then use their robotic arms to remove the weeds or spray them directly. The growing
    pesticide resistance once plants is advantageous for both the environment and
    farmers who once applied pesticides liberally throughout their farms. Herbicides
    are administered at a cost of 1725 crores ($25B) per year, or about 13,000 kg
    (3 billion pounds), lowering their overall cost (Figure 1.13).


    # 1.3.1.2 Machine navigation robots


    Tractors and large pieces of ploughing equipment can be operated automatically
    from the comfort of your house using GPS, just like remote-controlled toy vehicles
    can. The labor-intensive duties are made simpler by these integrated automatic
    machines’ excellent accuracy and ability to self-adjust when they notice variations
    in the terrain. Smartphones make it simple to monitor their whereabouts and work
    progress. These technology-driven motors are enabling advanced farming using IoT
    independently with features like'
  merge: -1
  img_proc: true
- pgno: 46
  md: '![](img/d1f13ee8a5e334af2b540a0b952cbea1_46_0.png)


    ![](img/d1f13ee8a5e334af2b540a0b952cbea1_46_1.png)


    automatic obstacle recognition thanks to improvements in IoT in agriculture and
    machine learning (Figure 1.14).


    # 1.3.1.3 Harvesting robotics


    Agribots are being used to pick crops, which is a solution to the manpower shortage
    issue. These cutting-edge machines can work around the clock, handling the delicate
    process of harvesting fruits and vegetables. These devices pick the fruits by
    using robotic arms and image processing to determine which ones to pick, thereby
    controlling the quality. Orchard fruits like apples are crops that are prioritized
    for agribot harvesting early on due to high operational expenses. These bots can
    also be used for the greenhouse harvesting of high-value crops like strawberries
    and tomatoes (Figure 1.15). These robots can accurately assess the growth stage
    of crops in greenhouses and harvest them when necessary [3].


    # 1.3.1.4 Material handling robots


    The hated physical labor jobs can be carried out by robots working alongside humans.
    They can lift big objects and space plants precisely, which improves the quality
    of the space and plant and lowers manufacturing costs.'
