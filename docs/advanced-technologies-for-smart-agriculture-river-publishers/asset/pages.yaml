    # 13.2 Overview of Cropping Patterns


    Farmers choose crops for cultivation based on a variety of criteria including
    physical, social, and economic considerations. They may plant a variety of crops
    on their farms and rotate a specific crop combination throughout time. However,
    it is worth noting that the best farming techniques always include certain cropping
    patterns and cropping systems to increase productivity and maintain soil fertility.


    A cropping pattern is the percentage of land that is being cultivated for different
    crops at various times. This shows when and how the crops were planted on a specific
    acreage. The amount of land planted with various crops and the order in which
    they are planted in space and time would alter as a result of changing cropping
    patterns.


    India is a sizable nation. Climate factors like temperature, humidity, and rainfall
    fluctuate from one place to region and influence the types of crops that are grown
    there. To get the highest yield, many cropping methods are practiced there. Rainfall,
    temperature, climate, soil type, and technology all have an impact on India''s
    crop patterns.


    Depending on the seasons they grow in, the crops are divided into various types:


    # Kharif crops:


    The monsoon season, which generally varies by crop and farming region, is when
    these crops are sown. In India, kharif crops are sown between the'
