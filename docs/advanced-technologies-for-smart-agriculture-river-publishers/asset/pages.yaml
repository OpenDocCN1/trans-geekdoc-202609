  md: '+   Specifically, V2 is the range of times when the data is most relevant and
    effective. For example, some data loses its value with time if not analyzed immediately.
    For instance, it is possible to spot several common pests and diseases during
    an animal''s lifetime.


    +   The letter V3 can stand for a wide variety of data. Data can come from multiple
    sources (e.g., videos, remote-sensing data and pictures), be acquired at different
    times and have different resolutions, all of which can contribute to the observed
    discrepancies (e.g., spatially varied data on image resolution). Data obtained
    for varied uses also has distinctive qualities.


    +   A V4 signifies that the information is reliable. Values 4 encompass the potential,
    quality, dependability, correctness and overarching confidence in the data.


    +   Data’s “valorization,” or its value in fostering appreciation, innovation
    and knowledge, is denoted by the notation “V5.”


    The five “Vs” can be used to define big data, although they are not required for
    a successful big data study [12]. Large data weaken fourth V because of its general
    tendency toward reduced accuracy and instability. According to [13–15], the authors
    need to add another “V” for visualization to demonstrate or illustrate the data
    by using complex data structures and information-dense scenarios.


    According to authors [16], big data’s main focus is improving the speed with which
    massive datasets may be referenced, searched, visualized and aggregated. It strongly
    emphasizes data mining, especially in areas where this was previously too costly
    or impossible to implement [17].


    The DIKW hierarchy illustrates the connections between data, expertise and knowledge
    by using the letters D, I, K and W to represent data, insight, expertise and wisdom,
    respectively. Essentially, it communicates the idea that data describes the information,
    knowledge describes the information and wisdom describes knowledge. Figure 5.1
    depicts the DIKW hierarchy.


    Data is transformed into an entity (information), as depicted in Figure 5.1. The
    procedures responsible for the change are also specified. Essentially, “wisdom”
    refers to the ability to weigh competing options and judge based on what one believes
    to be the most plausible. With fewer intangible resources like values, ethics,
    interests and preferences, wisdom is paired with the knowledge already at hand.
    The knowledge base is constructed from collected data. The raw material from which
