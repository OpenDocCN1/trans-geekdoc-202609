    v.varadarajan@unsw.edu.au


    # Abstract


    Farming is not only affected by global warming, but it also contributes around
    24% of greenhouse gas emissions. Another sobering truth is that the compositions
    of greenhouse gases have risen dramatically since the industrial revolution. Some
    modifications occurred as a result of human activity and/ or overuse of natural
    resources. The type and extent of climatic change’s effect(s) or danger differ
    depending on where you live. On the other hand, agriculture is itself affected
    by other aspects of society, including its cultural and economic values. Ages
    of humanity have built strong ties with the ecosystem, identifying natural patterns
    and inventing techniques to access nature’s advantages before the advent of “Western
    Science,” and even before science had a name. Forestry, farming, and aquaculture
    practices evolved over time as a result of trial and error in determining the
    optimum ways to practice agriculture in order to extract resources for survival,
    with some methods being more sustained than others.


    Bihar is one of the Indo-Gangetic Plain states that have been negatively affected
    by climate change due to modest and distributed land holdings, i.e., around 16.1
    million farm assets, with 91% being negligible. As a result, there is an urgent
    need to create location-specific sustainable agriculture methods to mitigate the
    effects of climate change.'
