    # 16.5 Biomimicry


    Biomimicry is the concept of combining agricultural systems with natural ones
    while leaving the natural species alone. This was brought forward as a sustainable
    technology [10].


    The six principles of biomimicry in agriculture are given below:


    +   1. Biomimicry includes the self-perseverance of natural creatures’ identities
    as self-constitution (autonomy and headstrongness).


    +   2. Self-perseverance is included in biomimicry as self-regulation, self-healing/self-repairing,
    and adaptability of natural entities’ identities to new or changing situations.


    +   3. Biomimicry is flawed because it copies or uses the characteristics of natural
    things that come into being, change, and go away because of nature’s complexity
    and variety.


    +   4. Biomimicry recognizes the limitations of human monitoring and control in
    human-assisted eco-systems.


    +   5. Biomimicry is flexible in how it looks at the identity of natural things;
    so it can work with new or changing arrangements.


    +   6. Biomimicry addresses the eco-system in which they develop, unfold, and
    fade away, rather than just imitating or incorporating the esthetic shape or function
    of a natural organism.


