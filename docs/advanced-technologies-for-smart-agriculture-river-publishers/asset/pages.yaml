    # 5.3 Case Studies of Big Data Analytical Methods in Agriculture


    In this section, the authors examine examples of how big data analytics has been
    used in the agricultural sector. There is an emphasis on recent and relevant literature.


    # 5.3.1 Case study 1


    Datasets with varying amounts of content, storage formats and organizational structures
    are essential to studies in the agricultural and environmental sciences. As a
    result of the cloud architecture supporting linked open data (LOD), several datasets
    have recently been made publicly available, resulting in a plethora of disparate
    data sources. Unfortunately, the LOD is difficult to access and cannot keep up
    with the rapid developments in data science. It necessitates the availability
    of sophisticated big data querying infrastructure. In this paper, the authors
    analyze the research project Sema Grow, which was established by ERFP7 to provide
    effective methods of accessing remote data. Building efficient systems and techniques
    for searching dispersed data sources like LOD nodes was the project’s primary
    focus. To facilitate data reuse and sharing amongst scientific programs, it implemented
    Semantic Web concepts including the SPARQL query language and RDF. It made possible
    the sharing of LOD-related cloud-based data.


    The SemaGrow system overcame the unique problems associated with agricultural
    data by drawing on various use cases through a tailor-made set of data pilots.
    SemaGrow overcame obstacles associated with detecting and consolidating big data
    from disparate spatiotemporal datasets. Adaptation to climatic changes was an
    integral part of the use cases that SemaGrow managed, such as the modeling of
    climatic variables relevant to agriculture.'
