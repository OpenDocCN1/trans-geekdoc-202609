    # 8.2.9 Challenges of multi-story cropping


    Despite the fact that multi-storied cropping is a very effective innovative technique
    in today’s scenario of faster degrading farming lands, farmers face many challenges
    in adopting it due to drought conditions, a lack of funds, a lack of technical
    knowledge of cropping systems, timely availability of inputs, pest and disease
    incidents, a lack of irrigation facilities, and a lack of labor.


    # 8.3 Conclusion


    In our country, majority of farmers are in small and marginal scale and they primarily
    grow seasonal crops. As a result, after a specific period of interval, they expect
    to earn profitable yield from cultivation. Unfortunately, the variable weather
    conditions have a negative impact on food production quantity and quality, resulting
    in poverty. Farmers are also obliged to supply low-quality veggies at a high cost.
    In this regard, multi-story cropping system paves a novel opportunity for farmers
    to earn a good amount of returns throughout the year with a minimum risk of full
    crop failure, while also ensuring that natural resources are utilized efficiently
    and soil fertility is maintained. Hence, this technique is discovered to be a
    perspective approach for long-term production in agricultural business. This report
    suggests that along with the modern agriculture system of cropping, farmers can
    utilize recent construction of prediction tools using image processing to analyze
    agricultural data and are able to predict the production of crop yield forecasts.


