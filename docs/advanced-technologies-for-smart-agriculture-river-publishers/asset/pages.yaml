    # 11.1.6 Implementation challenges of IoT in smart farming


    In this section, numerous obstacles must be handled. The challenges of deploying
    IoT in farming are classified depending on the technological challenges in farmland.
    When implementing cutting-edge technologies such as IoT, Big Data, and cloud computing
    in farming areas where basic internet connectivity is a barrier [22]. If a farmer
    decides to invest in smart farming, he or she must be aware of certain problems.
    The issues that the agricultural industry runs into while using IoT technology
    are like issues with interoperability standards in a use case for IoT in agriculture,
    where information sharing between all related IoT devices is required.


    These devices can communicate using a common protocol, as well as the necessary
    connectivity and standards. As a result, the most difficult fact is interoperability.
    It is challenging to combine heterogeneous data from various sensors (such as
    moisture sensors, soil sensors, temperature sensors, and so on). We must spend
    a significant lot of time and cost to build standardized common protocols for
    all IoT devices. Storage issues for enormous agricultural data: There is a large
    volume of data generated by various IoT devices (such as sensors, cameras, weather
    stations, and so on) connected in a farmland. A vast repository is required to
    store such a large number of data.


    Storing data in a database is insufficient for dealing with such a huge data.
    Technologies such as cloud computing and fog computing would provide greater storage
    and latency performance. Problems with connectivity: Because wireless communication
    is too difficult to achieve, providing connectivity with data interchange between
    an IoT device and a database or cloud is a key difficulty [23].'
