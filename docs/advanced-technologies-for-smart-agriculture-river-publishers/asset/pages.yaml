  md: '# 11.1.3 Major IK practices for sustainable agriculture


    +   - Water management

    +   - Nutrient management

    +   - Pest management

    +   - Soil conservation

    +   - Crop management


    # 11.1.3.1 Water management


    Techniques for predicting rain and preserving water are classic instances of information
    that will be handed down across generations in many conventional farming systems
    [5]. It is difficult to save water resources along with knowledge of rain and
    its different patterns, different time zones, and quantity in which it falls.
    Farmers might choose which crops and crop varieties to grow if they could predict
    how much rain will fall in the future season.

    Major water management practices are:


    +   - Inter-row and inter-plot water harvesting: Plants are typically planted
    in ridges in heavy soil, and ridges and furrows are usually constructed on cultivated
    fields. Such activities aid in the collection of rainwater in furrows rather than
    surface runoff. Inter-plot harvesting rainwater also entails the building of a
    cultivating plot on one side and a fallow plot on the other, with the fallow plot
    sloped to induce runoff to the next cropping plot.

    +   - Rainwater harvest: During dry weather, harvesting periodical rain in reservoirs
    or canals can make water available for the rest of the season [6]. Large canals
    or water breaks, ponds in mountain terrains are useful for collecting and storing
    rainwater.

    +   - Trenches for water conservation: The construction of several trenches along
    the slopes of hills aids in the collection and storage of excess rainwater, which
    later percolates as underground water and aids in the conservation of moisture
    in such places.

    +   - Land leveling and bund making: The leveling up and construction of bunds
    on the field minimizes excessive water loss through runoff.

    +   - Board beds and furrows to minimize runoff: Excess water from the beds is
    collected in the furrows between the beds and routed to neighboring ponds or streams,
    where it can be utilized for future agricultural production.'
