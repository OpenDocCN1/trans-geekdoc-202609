  md: '# ## 11.1.3.2 Nutrient management


    +   - Organic manure: For example, in several parts of Nepal, farm yard manure
    was commonly used as a source of nitrogen. Farm yard manure was typically the
    primary source of nutrition adapted to the field prior to the advent of artificial
    fertilizer [7]. Cow urine also includes potassium, which could also help crops
    meet their potassium needs.


    +   - Green and brown manures: Sun hemp (_Crotolaria juncea_), dhaincha (_Sesbania
    rostrata_), mung bean, and cowpea are also employed as fertilizers for the harvests.


    # ## 11.1.3.3 Bio-pesticide for pest management


    For several decades, pest management has included the use of neem leaves as a
    bio-pesticide and storage [8]. Bio-pesticide is made from neem leaves, as well
    as other locally accessible herbs and animal manure, and it is used to control
    insect infestation in the field. Neem leaves, titepati, aloe vera, aakh leaves,
    ginger, garlic, kapur, turmeric, cow dung, and cow urine are blended in suitable
    proportions to make a simple DIY bio-pesticide that is resistant to a variety
    of pests in the field. Similarly, neem leaves and kapur are employed to combat
    pests in storage.


    # ## 11.1.3.4 Soil conservation


    Low-tech instruments, such as the indigenous plough, or halo, minimize the erosion
    of soil and are environmentally friendly. Cultivation of leguminous crops in the
    field’s bunds also aids in soil erosion reduction and nitrogen fixation [9], increasing
    the microbial activity of the soil microorganisms. Crop rotation is also conducted
    in the traditional way, which aids in soil protection. Other indigenous traditional
    practices include the following:


    +   - Pests are controlled by burning stubbles in the field.


    +   - Termite control is accomplished by burying neem leaves in soil [10].


    +   - Ash is applied for seedbeds and fields of onion before sowing and planting
    to promote bulb growth and quality [11].


    +   - Tobacco residues are integrated into soil to prevent organisms.


    +   - During summer season, deep ploughing is done in drylands to prevent hardpan
    in the soil, increase water absorption, and manage pests.


    +   - Mixing up the seeds like coriander seeds are mixed with sorghum seed before
    sowing to completely control Striga (parasitic weed).'
