    by the structure as well as activity of the human brain [22]. It performs exceptionally
    on a variety of complex cognitive tasks, approximating and even outperforming
    human performance. The ability to learn huge quantities of data is the advantages
    in deep learning technique. Deep learning popularity has been increased over the
    last decade, and it is effectively used for various traditional applications.
    In several sectors, including natural language processing, cyber security, bioinformatics,
    medical information processing and robotics and control, deep learning has excelled
    over well-known machine learning techniques.


    The three main deep learning techniques are partially supervised (semi-supervised),
    supervised and unsupervised. Additionally, deep reinforcement learning (DRL),
    commonly referred to Recursive Learning, would be a form of learning approach
    that is typically classified as occasionally unsupervised and partially supervised
    techniques. Recurrent neural networks (RNNs), convolutional neural networks (CNNs)
    and recursive neural networks (RvNNs) are among three most well-known types of
    deep learning networks used. The most extensively used algorithm CNN which has
    key advantage over its predecessors would be automatically detecting significant
    features without the need for human intervention. The features have been extracted
    by various approaches in traditional machine learning'
