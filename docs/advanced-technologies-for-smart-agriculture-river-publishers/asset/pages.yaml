    of a metropolitan area are broadly referred to as urban agriculture. Urban smart
    farms use aeroponics to grow fresh and healthy food in a cleaner, easier, and
    more effective manner. With 90% less land and 98% less water needed, our cutting-edge
    technology is the ideal option for farming at home or in an urban environment.
    The importance of greenhouse farming is also discussed in the chapter. A system
    is developed for agricultural field monitoring in IoT-based smart farming with
    the aid of sensors like light, humidity, temperature, soil moisture, etc. Farmers
    can keep an eye on the state of their fields from anywhere. Smart farming that
    is IoT-based is significantly extra effectual than traditional farming. MQTT and
    HTTP are used for the implementation of these models. Finally, supervising and
    scheduling the devices are discussed.


