  md: 'and space has shown impressive results in the adapted countries. Genetic engineering,
    and applying 3D printing technologies help up new possibilities, automated cooking,
    induces nutrition value, as well as these techniques, reduce food wastage. Following
    integrated cross-industry technologies like IoT, nanotechnologies, drone technology,
    and blockchain in agriculture helps to produce high-yield crops in lowering expenses.
    As precision agriculture expands and farmland becomes more networked, efficiency
    and production will rise in the future.


    # 17.1 Introduction


    By 2050, there will be 9.7 billion people on Earth. As a result, the growers must
    generate more than what is required to meet the food requirements. For farmers
    climate change is a persistent challenge. Farmland output has decreased as a result
    of decreasing labor availability due to urbanization. Farmland deteriorates as
    a result of improperly managed fallow periods, crops, an imbalanced application
    of fertilizer, and excessive livestock grazing. The past 50 years have seen a
    nearly two-fold rise in greenhouse gas emissions due to agribusiness, forest management,
    and other land uses. Around 30%–50% of the food produced globally is never consumed.
    Landscapes have indeed been destroyed of trees, species have gone extinct, native
    communities have been relocated, and the soil has deteriorated to produce food
    that is ultimately squandered. All of these pose difficulties for farmers’ crop
    production and yields.


    To meet the need for food from the expanding population, modern agribusiness should
    focus on the global scenario. Agriculture 4.0 and smart farming provide various
    solutions to overcome the barricades of the farmers and increase the production
    level. Implementing modernized farming practices and embracing new technologies
    can help farmers solve issues and boost their ability to produce more.


    Vertical farming utilizes a soil-free methodology and maximizes productivity while
    using the least amount of natural resources. Algae feedstock is a substitute for
    protein-rich foods, which helps to be delicious, nourishing, and fully sustainable.
    Some of their main benefits include their ability to grow in both freshwater and
    saltwater, their resistance to effluent, and their capacity to reuse water naturally.
    Desert farming and seawater farming have proved to utilize the arid land and saline
    water for agriculture in many countries like Saudi Arabia and Australia. Adapting
    to smart farming with modern technologies helps the farmers to have sustainable
    growth in the crops and productivity.


    Sensors and drones will be used for precision farming, which increases the quality
    and environment cost-effective crops. Small and marginal farmers'
  merge: -1
  img_proc: true
- pgno: 393
  md: 'will also be using these technologies and will make agriculture more profitable,
    easy, and environmentally friendly. By minimizing nutrient losses during fertilization
    and reducing chemical waste, nanotechnology will be employed in agriculture to
    boost production through pest and nutrient control. The forthcoming agricultural
    business implementing smart farming practices has the potential to turn all of
    agriculture’s difficulties into advantages.


    # 17.2 Obstacles in the Farming Sector


    Several problems, including food and nutrition security, poverty, and agro-ecology,
    are encountered in the agricultural industry. In addition to demographic pressure,
    resource depletion, climate change, and food security, global development have
    also put farming under pressure.


    # 17.2.1 Demographic transition will increase demand for food


    **Population growth:** While the population of the planet is still increasing,
    there are already 7.3 billion people still living, and during the next 15 years,
    another billion people will be added. In 2050, there would be 9.7 billion people
    on Earth. Food demand will rise steadily in economically developed nations due
    to population expansion. Due to the demographic changes, the way they consume
    food has also altered. The majority of individuals enjoy eating foods that are
    high in protein. This is a result of urbanization and rising income.


    **Increase in urbanization:** As urban populations grow and urban residents’ diets
    and preferences alter, there are significant changes in the demand for agricultural
    products. Due to this, there have been and still are significant changes in how
    expectations are addressed. Food security in rural and urban areas may potentially
    be severely hampered.


    Metropolitan growth will eventually engulf some rural land as markets and property
    values move closer to urban areas. Many landowners decide to keep their properties
    vacant in the hopes of making money when they sell them or put them to use for
    purposes other than agriculture. Most metropolitan areas in low- and middle-income
    countries grow haphazardly due to the lack of a land-use plan. Where various homes,
    businesses, and government-related activities choose to legitimately or illegally
    locate and expand determines this expansion.


    Greater demand, which results from a growth in the population, drives up output.
    According to the Food and Agriculture Organization (FAO), farmers'
  merge: -1
  img_proc: true
- pgno: 394
  md: '![](img/d1f13ee8a5e334af2b540a0b952cbea1_394_0.png)


    must produce 70% more food by 2050. The entire agriculture business model must
    be considered to tailor this food to the demands of the expanding urban population.


    Agriculture''s productivity is rising, thanks to investments and innovation, but
    yield growth has slowed to levels that are insufficient for the general public''s
    comfort. Despite a population decline, there is a rise in demand for food in rural
    areas. Rural populations are also aging quickly, which has a significant impact
    on the labor force, production patterns, land tenure, and economic growth.


    # 17.2.2 Current uses of natural resources are highly stressed


    Cropland around the world is getting less and less productive. According to certain
    measurements, a quarter of all agricultural land is already considered to have
    extremely deteriorated, and another 44% is severely or somewhat disrupted. Deterioration
    of farmland is mostly brought on by agribusiness, which also indirectly suffers
    from it. Inadequately planned fallow times, plantings, and overgrazing by animals
    are all factors that contribute to soil erosion. Nutritional imbalance is brought
    on by the unbalanced use of fertilizer to increase yield.


    Nutrient imbalance is brought on by the unbalanced application of fertilizer to
    restore yield. Agribusiness concerns account for over 80% of worldwide deforestation.
    And while removing vegetation to find space for crops is essential for land clearance
    and does not directly result in soil deterioration, it does so indirectly by depleting
    water supplies. Irrigation technologies have increased consumption effectiveness,
    yet expanding populations raise legitimate concerns about water availability and
    security. For irrigation water management alone in developing nations, it is estimated
    that investments totaling $1 trillion will be required until 2050. Figure 17.1
    shows the impact of deforestation and degraded land, which raises on the investment
    of irrigation.'
