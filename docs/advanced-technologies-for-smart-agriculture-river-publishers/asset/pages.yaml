  md: 'climate change to crops, ensuring that the health of the crop is maintained.
    It also discusses how the concept of biomimicry is used to depict smart farming
    technologies as ecological innovations.


    # 16.3 Applications and Use Cases


    # 16.3.1 Role of drones in agricultural field


    # Unmanned aerial vehicles (UAVs)


    UAVs are otherwise known as drones. When sustainability is considered, UAVs play
    an important role. UAVs capture images of fields and analyze those images, which
    would be of great help to the farmers. These images are then processed. It also
    serves as a monitoring tool for the same. Field monitoring, livestock monitoring,
    and compost management are some of the applications of UAVs. Wireless sensors
    and other wireless devices are used in UAVs. These are classified as perception
    layers. A UAV is also used to spray pesticides on the field. It is used for various
    things, such as weed detection, image processing of the field, etc. UAVs can be
    integrated with 3D cameras to monitor the growth parameters of crops. Several
    UAV applications are listed below.


    +   A. Monitoring:

    +   Monitoring helps in sensing different parameters of crops, such as the leaf
    area index, pH level of crops, salinity of crops, etc., which would be of extreme
    help to farmers. High-resolution data can be obtained.


    +   B. Mapping:

    +   Insightful 3D or 2D maps can be obtained. This helps in determining the precise
    profitability of crops. It also determines the status of crops, soil conditions,
    etc.


    +   C. Weed detection:

    +   Weed detection is the most important factor in farming. Weeds can damage crops.
    To minimize the damage to crops, weed detection is used with the help of multi-spectral
    cameras.


    +   D. Seed planting:

    +   When a large paddy field is taken into account, it would be tedious for farmers
    to plant seedlings. It would require a lot of labor. UAVs help reduce labor costs
    by evenly distributing seeds, fertilizer, etc. This is done using image recognition
    technology.'
