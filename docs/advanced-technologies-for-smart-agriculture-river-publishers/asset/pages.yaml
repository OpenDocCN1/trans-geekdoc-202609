  md: '# About the Editors


    Dr. K. Kalaiselvi presently working as Associate Professor in the Department of
    Computer Applications, Saveetha College of Liberal Arts and Sciences (SIMATS),
    Chennai, India. She has more than 20 years of teaching experience at both UG and
    PG level. Her research interests include knowledge management, data mining, embedded
    systems, wireless sensor networks, big data analytics and knowledge mining. She
    has published more than 90 research papers in various international journals,
    including Scopus Indexing, Web of Science and UGC care list Journals. She has
    also published chapters for various publishers like Springer, Wiley, and Emerald
    Publishing. She has acted as editor and reviewer for various reputed journals.
    She acted as editor for the book “Handbook on Intelligent Healthcare Analytics
    – Knowledge Engineering with Bigdata” in 2022. She has also published books including
    “Protocol to learn C Programming Language”, “Tryambaka Programming Code {C, C++,
    Java}”, and “A Handbook on Python Programming for Naive Seekers to Expertise”,
    and “Programming in Java Beginners Guide”. She has received the Best Researcher
    award, Young Educator and Scholar award, and Best Faculty award from various reputed
    organizations.


    Dr. A. Jose Anand received his Diploma from the State Board of Technical Education,
    Tamil Nadu in 1995, Bachelor of Engineering Degree from Institution of Engineers
    (INDIA), Calcutta in 2003, Master of Engineering in Embedded System Technologies
    from Anna University, Chennai in 2006, Master of Arts in Public Administration
    from Annamalai University in 2000 Master of Business Administration from Alagappa
    University in 2007, and Ph.D. (Information and Communication Engineering) from
    Anna University in 2017. He received State 3rd Rank in Bachelor of Engineering.
    He is a Member of CSI, IEI, IET, IETE, ISTE, INS, QCFI and EWB. He has one year
    of industrial experience and 23 years of teaching experience. He has presented
    several papers at National Conferences and International Conferences. He has published
    several papers in national and international journals, and'
  merge: -1
  img_proc: true
- pgno: 420
  md: 'also books for polytechnic and engineering subjects. He is recognized as a
    research supervisor by Anna University.


    Dr. Poonam Tanwar received his B.Tech and M.Tech in Computer Science & Engineering
    from Maharshi Dayanand University, India in 2001 and 2009 respectively, and his
    Ph.D. in computer science and engineering from the Uttarakhand Technical University,
    India in 2015. She has 18 years of teaching experience working as associate professor
    in Manav Rachna International Institute of Research & Studies, Faridabad, India.
    She has published more than 50 research papers in various International Journals
    and Conferences. She has one copyright and filled 6 patents. She edited the book
    “Big Data Analytics and Intelligence: A Perspective for Health Care” in 2019 published
    by Emerald. She was Guest Editor for a special issue “Advancement in Machine Learning
    (ML) and Knowledge Mining (KM)” for International Journal of Recent Patents in
    Engineering (UAE). She has been awarded the woman researcher award by VDGOODS
    Academy Chennai. She has organized various Science and Technology awareness programs
    for rural development. She is a technical program committee member for various
    international conferences like ICIC 2018, ICFNN, Rome (Italy), European Conference
    on Natural Language Processing and Information Retrieval, Berlin (Europe), etc.


    Dr. Haider Raza, School of Computer Science and Electronic Engineering (CSEE),
    University of Ulster, UK. Haider Raza received a bachelor’s degree in computer
    science and engineering from the Integral University, India in 2008, a master’s
    degree in computer engineering from the Manav Rachna International University,
    India in 2011, and a PhD in computer science from University of Ulster, UK in
    2016. During his PhD, he won the best-literature review award sponsored by McGraw
    Hill. He is currently a Lecturer in AI for decision making at the School of Computer
    Science and Electronics Engineering, University of Essex, UK. Dr. Raza has a strong
    academic track record and a developing international profile. Highlights of his
    work include research funding (£620k) as PI for a range of research projects in
    the domains of healthcare analytics, business, and environmental science by Innovate
    UK, ESRC and NHS Trusts. He has published in peer-reviewed journals such as IEEE
    TNSRE, IEEE JBHI, and IEEE TCDS, and 16 conference papers in major international
    conferences. He is currently leading on two knowledge transfer partnership projects
    (KTP) and supervising two post-doc KTP associates funded by Innovate UK and has
    led on a project in healthcare with East Suffolk North Essex Foundation Trust
    on AI-based cancer pathways.'
