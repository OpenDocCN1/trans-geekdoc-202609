  md: 'Over the last few decades, embedded IoT devices have changed the agriculture
    sector. With an embedded system that can automate and dynamically adjust the gardening
    process, a smart garden system based on today’s Internet of Things (IoT) technology
    is a breakthrough undertaking. Agricultural and different technologies combine
    to connect a large number of small devices through different communication protocols.
    Agricultural production is expected to double by 2025. One of the biggest challenges
    in agriculture is manually collecting and organizing data. This human data collection
    can be replaced by an automated data collection system that sends this raw data
    collected to cloud-based mobile applications. This task can be performed by an
    application available on mobile devices called Blynk. This has the benefit of
    quick and seamless data collection as well as reduced development and programming
    effort for a personalized web server. In addition, the ability to transfer raw
    data in real time has proven successful in developing highly efficient portable
    embedded systems [15].


    Due to the recent developments, hardware and software tools can be modified for
