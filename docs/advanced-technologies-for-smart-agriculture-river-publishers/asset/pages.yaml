    # 12.5.1 Overview of IoT


    Smart farming relies heavily on wireless technology and sensor-embedded objects.
    A huge network of connected gadgets that are equipped with sensors, algorithms,
    and other tools to interface with other gadgets via the internet is referred to
    as the “Internet of Things” (IoT). IoT devices are aware of their surroundings
    and assist in obtaining anything at any time and from any location. The working
    of IoT devices is explained in Figure 12.1.


    Digital sensors that can connect to the internet make up an IoT ecosystem. Such
    integrated sensors use implanted devices to collect, disseminate, and respond
    to data from their environment. To send data from the sensors, IoT devices connect
    to an IoT network or perhaps another edge machine. Such uploaded pieces of information
    are either processed locally or sent to the cloud for analysis. These devices
    could periodically exchange messages and examine the data they obtain.


    Wireless technologies are used in IoT to collect data from diverse sources and
    transmit it to other devices. Wireless sensor networks and radio frequency identification
    are the two most common technologies used in the Internet of Things for sensing
    and communication.


