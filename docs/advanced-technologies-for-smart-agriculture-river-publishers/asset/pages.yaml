    crops. The information gathered by sensors about humidity, temperature, moisture
    precipitation, and dew detection aids in forecasting the weather on farms so that
    appropriate crops can be cultivated. The analysis of soil quality aids in identifying
    the nutrient value and drier farmlands, soil drainage capacity, or soil acidity,
    allowing for adjustment of irrigation water requirements and selection of the
    most advantageous form of cultivation.


    # 13.6.4 Computer imaging


