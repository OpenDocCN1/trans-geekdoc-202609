    A precision farming or automation system''s measurement component always comes
    first. Tens of thousands of data points are collected each day by smart agriculture
    solutions and IoT. As soon as the data has been processed, formatted and corroborated,
    the systems will be able to use it to optimize other aspects of your infrastructure
    or launch an intelligent response.


    For instance, software can instruct your irrigation system to turn on when the
    soil moisture falls below a predetermined level. The technology can send notifications
    to operating or farming employees if moisture levels rise to unsatisfactory levels.
    The potential with IoT and agriculture is limitless.


    Nitrates can be measured in water; however, phosphates are a little more challenging.
    You may therefore calculate fertilizer run-off after application using this kind
    of equipment. The majority of technology still uses reagents for phosphate detection
    in water, which is a little more specialized [2].


    Your environment and application will actually determine how well you use data
    and insights.


    Dashboards on the web can visualize data.


    +   - Data visualization for mobile devices is possible using mobile apps and
    web sites.

    +   - Analytical tools like Excel, PowerBI or Tableau can be used to retrieve
    or import data.

    +   - If thresholds are surpassed, dashboard and monitoring systems can send out
    alerts (i.e. NPK levels, soil moisture, etc.)


