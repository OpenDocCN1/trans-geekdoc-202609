    # 16.4.2 Virtual control of farming enabled by digital twins


    There are two sources involved in smart farming: (i) supplier and (ii) consumer
    or the customer. There is a mediator for this. The mediator collects the data
    and passes it on to the sensor. Sensors are used in the monitoring of the temperature
    of the soil, the climatic conditions, etc. Sensors used in smart farming are known
    as agricultural sensors. These assist farmers in optimizing and monitoring the
    crops. Data from sensors are then segregated as the input data, the throughput
    data, and the output data. Input data are the measurements obtained from sensors.
    Throughput data is the amount of data transmitted successfully. The output from
    the sensor is also produced in the form of data. This helps the farmers in assessing
    the parameters of the plant productivity.


