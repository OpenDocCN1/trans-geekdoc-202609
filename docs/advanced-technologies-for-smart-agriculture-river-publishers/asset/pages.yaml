  md: '# 16.1 Introduction


    There are numerous IoT applications that use IoT technology for agricultural monitoring.
    Some of them are as follows:


    +   - Automated climate condition monitoring and management.

    +   - Monitoring of lightning, temperature, soil condition, and humidity for greenhouse
    automation.

    +   - Crop health monitoring and management.

    +   - Livestock monitoring is done for stock health, well-being, and location
    tracking.

    +   - Efficiency and making exact data-driven decisions in precision farming.

    +   - End-to-end farm management systems.


    People require food to survive, which leads to their reliance on food. Industries
    are occupying agricultural lands, which affects the production of food. Crops
    will not adapt to the varying climatic conditions. Labor would also decrease in
    the field of agriculture, keeping urbanization a priority. To overcome these,
    smart farming has been brought into the spotlight [6]. This involves various technologies
    and techniques to scale up the productivity of farming. This method is primarily
    based on the concept known as the “Internet of Things” (IoT), which involves sensors,
    actuators, processors for data, etc. This would also require networking protocols
    and communication devices for the transfer of data. The ultimate aim is to increase
    the productivity of crops, the sustainability of crops, and profit. These depend
    on technologies such as the cloud, big data analytics, unmanned aerial vehicles
    (UAVs), etc.


    Smart farming, along with the Internet of Things (IoT), is also paving the way
    for the so-called “Third Green Revolution.” The revolution consists of all topics
    that are to be discussed in this chapter, i.e., the role of UAVs, the role of
    data processing (big data), the farming equipment used, and many others [7]. According
    to the smart revolution of farming, otherwise known as “smart farming,” the usage
    of pesticides and fertilizers will drastically come down, and the overall yield
    and efficiency will shoot up. The use of IoT along with farming techniques will
    ensure food safety. It would also benefit the environment in many ways; for example,
    the usage of water would be reduced. Smart farming has many advantages. Farmers
    with an unassailable amount of land can monitor crop growth, the health of their
    cattle, etc., using wireless technologies with the help of various networking
    protocols (discussed already in this book). As already discussed, unmanned aerial
    vehicles'
  merge: -1
  img_proc: true
