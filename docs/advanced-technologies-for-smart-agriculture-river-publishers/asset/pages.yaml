  md: 'As a process of modern agriculture and global demand of different agro-products,
    an abrupt loss of traditional agricultural knowledge related to rapid transformations
    and intensification of agricultural systems have been observed. More importantly,
    the culture that promoted such farmer experimentation still exists today, which,
    in turn, leads the sustainability in agriculture. Farmers not dependent on technology
    solutions usually solve using traditional methods. There is an urgent need to
    address. First, indigenous knowledge practices for sustainable agriculture can
    be done; second, how smart agriculture using wireless sensors network & IoT is
    helpful for agriculture; third, impacts of climate changes on smart agriculture;
    last, how machine learning concepts can be used to deal with indigenous knowledge
    (IK) and relate to current science technology solutions for handling change in
    climate.


    # 11.1 Introduction


    There are various key definitions for indigenous knowledge (IK). It is defined
    as knowledge passed down through the ages for more than a substantial amount of
    time from our ancestors to upcoming future generations. IK is “the ability to
    solve or to deal with problems in life by summing up the knowledge and practices
    that are based on best practices or experience of the people.” Indigenous traditional
    knowledge [1] focuses on the unique, traditional, and local knowledge that exists
    within any culture or society and is established around the unambiguous circumstances
    of indigenous women and men in a certain geographic area and expressed in the
    form of myths, cultural stories, older methodologies, laws, agricultural practices
    such as bed preparation, sowing, plantation, management practices, and so on,
    which are then passed down to future generations.


    The fundamental nature of IKs prevents over-exploitation of natural resources
    [2], proper use and conservation of existing natural resources, and application
    for current resources, among other things. ITKs are typically location-specific,
    based on the availability of resources and localized materials, and are the result
    of long-term familiar methods of research.


    # 11.1.1 Indigenous knowledge is found to be:


    +   * Sociologically desired

    +   * Affordable and sustainable

    +   * Long term'
