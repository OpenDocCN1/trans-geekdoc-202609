    The Internet of Things (IoT) and its advancements in technology help in resolving
    all kinds of environmental problems like controlling pollution and solution for
    day-to-day problems in agriculture; likewise smart environment monitoring with
    the help of IoT, modern sensors and in addition machine learning helps in advancement
    in the agriculture field. SEM (smart environment monitoring) helps in monitoring
    the quality of air, water and radiation. In agriculture, this machine learning
    also has many advantages, especially in monitoring the environment. The different
    aspects of SEM are agriculture system technologies with smart monitoring, home
    technologies with needed and smart advancements, health monitoring systems with
    advancements to attain patient’s maximum needs, ecological systems, marine environment
    monitoring with the management of IoT, and also in pollution monitoring [9].


    The farmer knew the crop quality with the help of SAR data to understand the quality
    of plants. Machine learning technique and Gaussian process model result in the
    output of 89% with the most accurate rate. AI with Naive Bayes and machine learning
    helps in operating sensor data. This helps to rectify problems such as reducing
    pesticide usage at the maximum level and the maximum amount of water for irrigation
    of the crops without wastage. Various applications of SEM are farming in an advanced
    manner, pest control, monitoring and crop area needs [10].


    Many other factors like environmental changes, temperature, pests and insects
    on farmland affect farmers. Even with the present advanced technology, there is
