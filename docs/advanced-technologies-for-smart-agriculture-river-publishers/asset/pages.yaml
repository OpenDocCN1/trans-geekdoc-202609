    will be impacted by global warming are the melting of glaciers, alteration of
    the water regime (moisture and rainfall), and disruption of ocean currents.


    # Climate change affecting the Philippines:


    The Philippines has a long history of being particularly susceptible to extreme
    weather. However, in recent years the country has been hit by even more powerful
    storms, such as Typhoon Haiyan. Around 20 tropical cyclones make landfall to submerge
    in Philippine waters, with eight or nine of them due to the impact of climate
    change. However, as the temperature of the ocean’s surface rises as a result of
    climate change, more heat is emitted into the atmosphere, increasing the Philippines’
    annual debt by at least 4%.


    # Climate change affecting Canada:


    Since 1948, average global temperatures in Canada have risen by 1.7 °C. Sea levels
    are rising in tandem with rising temperatures and greater rainfall. The Arctic
    is warming far more quickly than the rest of the world. Scientists have already
    noticed significant reductions in the Arctic Sea ice cover, especially during
    the summer. The melting sea ice disturbs regular ocean circulation, causing temperature
    and weather changes all across the world. Wildfires in the Canadian West are raging
    faster and more fiercely than they have ever been. The people’s and country’s
    economies have suffered as a result of the changing circumstances brought on by
    climate change.


