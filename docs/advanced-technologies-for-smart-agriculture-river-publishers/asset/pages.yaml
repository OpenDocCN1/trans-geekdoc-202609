    Sensors embedded in the soil collect pertinent information on factors including
    electrical conductivity, salinity, and volumetric water content. These sensors,
    which are strategically placed around the field, transmit data to a smart irrigation
    system to give farmers rapid insights into the condition of the soil and forecast
    irrigation requirements.


    # 1.4.2 Weather sensors


    Weather sensors, also known as evapotranspiration (ET) sensors, monitor extremely
    local environmental factors such as water evaporation from soil surfaces and plant
    transpiration. These sensors can aid in producing more precise water predictions
    when combined with the data supplied by a GIS-based solution [4].'
