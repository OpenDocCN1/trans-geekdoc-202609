    The “River Publishers Series in Computing and Information Science and Technology”
    covers research which ushers the 21st Century into an Internet and multimedia
    era. Networking suggests transportation of such multimedia contents among nodes
    in communication and/or computer networks, to facilitate the ultimate Internet.


    Theory, technologies, protocols and standards, applications/services, practice
    and implementation of wired/wireless networking are all within the scope of this
    series. Based on network and communication science, we further extend the scope
    to 21st Century life through the knowledge in machine learning, embedded systems,
    cognitive science, pattern recognition, quantum/biological/molecular computation
    and information processing, user behaviors and interface, and applications across
    healthcare and society.


