  md: '# 9.2 Literature Review


    The agricultural sector is constantly facing challenges due to numerous factors
    such as climatic conditions, soil wealth, and economic shortage. So to overcome
    these challenges, a proper and smart agriculture system is required. With that
    in mind, we have an incredible way to monitor and manipulate the various parameters
    involved in smart agriculture, that is, a data acquisition system. These data
    could be stored in that developed system by fetching over from various sensors.
    These smart tech-based devices, combined with data-based agriculture, would help
    farmers to minimize prices and thereby can increase yields and profits. The most
    indispensable things needed for smart and precision farming are some of the parameters
    and affecting factors such as monitoring environmental conditions and monitoring
    the availability of water resources. These measurements associated with the farming
    market data become the data-based driver. Many researchers have developed various
    devices and technologies for detecting, tracking, and collecting the essential
    affecting factors, and with their help, they have understood the assignment to
    use this model as the basic custom system for smart farming [1–3].


    The use of Internet of Things (IoT) helps basically in creating attractive as
    well as problem-solving innovative applications and software by establishing a
    common platform for different domains and sectors. This system is manually designed
    and developed to measure some of the most needed factors such as moisture content
    of the soil, its sensitivity, temperature, humidity, and the overall sunlight
    intensity. It also helps in automating the irrigation process that works on crops
    in agricultural fields. And, additionally, this currently existing system gives
    us an enhanced as well as enlightened future for monitoring and visualizing processes
    of the required available data and also helps to control the irrigation process
    in real-time entities without any loss in data during transmission. The watering
    system can be controlled in two ways using a smartphone from anywhere – either
    by the smart automatic control or by manual control. This system is very cheap
    since it makes use of solar energy to boost the autonomy as well as the novelty
    to perform complex operations [4]. This data acquisition system is also executed
    in an aeration strategy for controlling the storage of grain based on simulation.
    The data acquisition system was used during the field trial and it was based on
    digital addressable devices. This strategy includes a set of sensors that monitor
    environmental conditions such as temperature, ambient air conditions, and other
    parameters that can be stored in data acquisition systems, allowing us to monitor
    grain bulk storage and turn the fan on or off automatically based on simulation
    results. This control method can also be easily adapted to other'
