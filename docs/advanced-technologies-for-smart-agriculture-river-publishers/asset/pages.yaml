    # Abstract


    Modern agriculture mainly consists of automated techniques that lead to wastage
    of vital resources such as water. Water plays a significant part in the growth
    of plants and it is also regarded as a degrading resource on our planet. This
    chapter presents a solution to the problem stated above. In this system, the user
    can be able to manage the implementation of the sprinkler system with the help
    of a user-friendly Android application, thereby reducing the loss of water. They
    can activate the sprinklers only when the soil moisture is less. The quantity
    of moisture present in the soil is restrained with the help of a soil moisture
    sensor twice every 24 hours and if the value is less than the threshold, then
    a notification triggered with a global system for mobile (GSM) communication module
    will be sent to the customer''s handset. Then the user can connect to the internet
    and then switch on the sprinklers by simply pressing a button that is available
    in the online-based application. This button activates the sprinklers by invoking
    a web service that turns the sprinklers on. This methodology is helpful for the
    farmers to utilize the water resource effectively.


