    # Figure 17.3 Impact of food waste.


    # 17.2.4 Food waste – a huge ecological hazard


    Approximately, 33%–50% of the foodstuff produced worldwide is never consumed,
    and this waste disposal is worth more than $1 trillion. Moreover, bio-waste is
    harmful to the ecosystem. To produce food that is ultimately wasted, a land area
    larger than China is needed. Additionally, 25% of the world''s freshwater use
    is made up of food that is never consumed. In addition to being a complete waste
    of resources, leftover food goes to the landfill, where without oxygen, organic
    matter breaks down and releases methane, a gas that is 23 times deadlier than
    carbon dioxide. Figure 17.3 shows the wastage of precious water resources used
    for the wasted foodstuff.


    # Outcome: poverty and hunger:


    The issue of food scarcity is a result of these macroeconomic changes. Global
    poverty and famine are the results. 800 million people experience chronic hunger,
    700 million people live in extreme poverty, and 2 billion people have nutritional
    deficiencies. One-third of the 800 million people reside in rural areas in emerging
    nations.


    Over the past 50 years, the food and farming industries have advanced significantly.
    Since 1960, the use of Green Revolution innovations has increased the world''s
    agricultural output, as well as the sector, which has become much more globally
    diversified. By utilizing these tendencies and combating income disparity, we
    can abolish world poverty and starvation. It will be vital to implement growth
    strategies that take into account not only agriculture but also employment creation
    and revenue diversification.'
