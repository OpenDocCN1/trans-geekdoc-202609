    A convolution layer is typically used in CNN, and it employs convolutional filter
    collections to recover numerous local features from each input region, resulting
    in a large number of feature maps. The layer has been represented mathematically
    as [23]


    $(cn)_{ij} = (Xn * q)_{ij} + dk,$ (3.1)


    where $(cn)_{ij}$ indicates the $nth$ output feature map of $(i, j)$ element.

    The input feature maps are represented by $q$. The $nth$ filter and bias are indicated
    by $Xn$ and $dk$, respectively. A 2D spatial convolution operation is represented
    by the * symbol.


    CNN architecture is divided into two components. Feature extraction is a convolution
    method which extracts and detects the image distinct characteristics of an image
    during evaluation. The fully connected network employs its convolution result
    for predicting image classification based on characteristics obtained earlier
    in the process. A CNN is made up of three layers namely pooling layers, fully
    connected (FC) layers and convolutional layers. These layers are combined to form
    the CNN architecture. The convolutional layer is'
