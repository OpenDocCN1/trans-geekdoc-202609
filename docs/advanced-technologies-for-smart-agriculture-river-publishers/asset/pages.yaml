    have been looking at plant data over the last few decades to develop more productive
    and healthy plant life. Recent advancements in big data analytics have allowed
    for more rapid, substantial and high-quality crop development. The elimination
    of world hunger may be possible with the use of genetically modified seeds and
    big data analytics [11].


    # 5.2 Big Data in Agriculture


    The following section elaborates on why big data is so important in agriculture.
    There is also a discussion of several standard methods for dealing with massive
    datasets. Before delving into the strategies for dealing with big data, the authors
    briefly examine what big data is.


    # 5.2.1 Big data''s impact on agriculture


    The following five characteristics of big data are widely referred to in the literature.


    +   The data volume is represented by V1. In this analysis, the total amount of
    data was represented by the value of V1.'
