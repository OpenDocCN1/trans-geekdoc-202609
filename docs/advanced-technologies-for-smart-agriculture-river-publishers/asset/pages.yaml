    This type of sprinkler irrigation, sometimes referred to as water-wheel and circular
    irrigation, is the most common. In a conventional center pivot system, plants
    are irrigated by sprayers as a long irrigation conduit tied to a central tower
    gently circles the field.


    Function of software: In-field sensors provide data insights that the system using
    circular irrigation sprinklers uses to modify the water stream or angle of flow.
    By doing so, you can reach plants that are far from the water source and prevent
    overwatering of nearby plants. The system plans irrigation and determines possible
    yield and harvest periods by examining weather information and soil moisture.


    # **1.4.5.3 Drip irrigation**


