    # Crop rotation:


    In this pattern, various crops are produced on the same plot of land in a pre-determined
    order. Depending on how long they grow, the crops are divided into three categories:
    one-year rotation, two-year rotation, and three-year rotation.


    The crop rotation program includes legumes to improve soil fertility. After the
    legumes, the crops that require a high level of fertility (such as wheat) can
    be cultivated. After the crops that demand large inputs are established, the low-input
    crops can be planted.


    The following standards should be used when choosing the crops to be rotated:


    +   - There ought to be enough moisture on the land.

    +   - Existence of fertilizers, labor, and machinery.

    +   - Facilities for processing and marketing.


