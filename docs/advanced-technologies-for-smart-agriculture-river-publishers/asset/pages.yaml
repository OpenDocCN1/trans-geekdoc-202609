  md: 'Pesticides is widely used to control pest but has an adverse effect on human
    health leading to many harmful diseases like cancer and even change in genetic
    material. The Graphical processing unit (GPU) connects all sensors in addition
    to pest control and monitoring system. Distributed and parallel simulation framework
    (DPSF) with IoT is used for pest control and monitoring. This helps in handling
    data without crashing reducing execution time. DSPF with a multithreading concept
    helps in sharing tasks of one core to another core and there are four layers needed
    to carry out the task. Layer 1 is for crop management. Layer 2 is for pest detection
    and control, and layers 3 and 4 are for input and output. Artificial intelligence
    helps in remote control and also helps in processing atmospheric data in real
    time [11]. Innovations in the agricultural field are increasing day by day to
    rectify new problems and satisfy our needs. Here a new technology is implemented
    by remote crop monitoring mechanism using LoRaWAN; the main motto here is to improve
    the old techniques of agriculture with a wireless sensor network using LoRaWAN
    protocol. Using the system, the temperature of the environment is notified with
    the help of an IoT-based sensor which helps in sensing the inside greenhouse gas
    for plants like brinjal under the consideration of food production and growth
    of plants [12].


    The improvement in agriculture is useful for the development of the economic condition.
    By using NodeMCU ESP8266, sensors and cloud computing are used for monitoring
    soil moisture, temperature and water control. The effects of growth rate, production
    rate and water-saving rate of crop planting are studied and a timer is used to
    control soil moisture and the greenhouse automatically. With this technique, the
    growth rate is better by 41.2%, soil moisture by 23.1% and productivity by 70%.
    The humidity and temperature sensor (DHT22) helps in measuring the humidity and
    temperature surrounding the air of the farm. The solenoid valve works on a mechanism
    based on an electromechanical-driven valve that uses current to generate a magnetic
    field to open and close a fluid flow valve. The NodeMCU ESP8266 system is a major
    part of the system. All sensors interact, and it serves as a nearby server for
    receiving sensor data with the cloud firebase for present-time data. To monitor
    and control the system, the above system can send data to the cloud and receive
    data from a cloud user [13].


    The development of IoT helps to know many factors of a plant, especially relative
    humidity, temperature and pH. By using IoT, this information is compared with
    the current time data to find the problem and to give a solution. The system used
    here is open to adding on new sensors that are currently present here. The Raspberry
    Pi card helps scan data from the sensors in the network according to the request
    of the data. It is then added to the sensors'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'linked to the board and communication via Free Software. The entire project
    is a combination of a microcontroller and a server. The sensors send data to the
    Raspberry Pi 3 card, which stores the data in itself and the server is placed
    in the microcontroller. The various web pages that contain the information on
    the server read those details from the database and help in generating graphs
    that the user can use. The microcontroller delivers messages to users regarding
    the information. A wireless system was designed so that the sensors used have
    a low-consuming microcontroller. Transmitter has a maximum consuming capacity
    of 50 mA and a low consumption of 30 μA. Due to a different bandwidth consumption,
    different data is stored. It is not easy to extract data from hundreds of sensors
    with the help of four sensors. Because of this, the data packet detection algorithm
    is used to transfer data later. A cyclic redundancy code is for confirming the
    receipt and it will be implemented within the TCP protocol. The main advantage
    of the system is that any object can be monitored, automate amounts controlled,
    and thus helps in getting information in large amounts with all kinds of details
    [14].


    The advancements in the modern world not only increase new techniques but also
    increase laziness in people so automation in each sector satisfies human needs.
    In agriculture, automation is needed. On the contrary, the agriculture sector
    in India is facing losses due to many factors including loss of manpower which
    has affected the production capacity of the ecosystem for which this automation
    is the solution. There is an emerging need to solve the problem to save the vibrancy
    and to improve the higher growth. For large-scale production, a lot of maintenance,
    knowledge and supervision are required. The developed system mainly focuses on
    maintenance, insecticide and pesticide control, water management and crop monitoring
    all of which will be automated. The main advantage here is connectivity to a diverse
    range of devices, minimizing human labor, time-efficient, efficient communication
    and analytics [15, 16].


    Wireless technology with agronomy helps in improving traditional techniques. A
    new IoT technique named AGRO-TECH is used here to store and update the activities
    which can be accessed by farmers to know the details in terms of soil and crop
