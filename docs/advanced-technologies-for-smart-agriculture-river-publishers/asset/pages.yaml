    # Rabi crops:


    These crops are sown during the months of October and November, in the winter
    of October and November, in the winter and following the monsoon. Crops for the
    Rabi season are harvested in India between the months of March and April. Wheat,
    barley, mustard, peas, and other types of crops are examples of rabi crops.


    # Zaid crops:


    These crops are planted during the months of March and April, during the summer''s
    brief sowing season. Zaid crops are harvested in India from May through June.
    Watermelons, musk melons, vegetable and fodder crops, etc., are some of Zaid''s
    examples.


    # 13.3 Types of Cropping Pattern


    Any region''s crop pattern is influenced by geographical factors such as the soil,
    climate, rainfall, etc. In addition, the type and accessibility of irrigation
    facilities must be considered. There are four different cropping patterns:


    +   * Monocropping

    +   * Mixed cropping

    +   * Intercropping

    +   * Crop rotation


    # 13.3.1 Monocropping


    Monocropping decreases soil fertility and ruins the soil''s structure. The use
    of chemical fertilizers is necessary to


