  md: 'spatial and temporal resolution and high accuracy at an affordable cost and
    is hence accessible to wider communities. The goal was to create a product capable
    of analyzing multiple crucial soil parameters via one unit and transfer the accumulated
    preprocessed data to an airborne mobile subsystem. This system consists of two
    working modules that work in harmony with each other. The soil data monitoring
    probe (SDMP) is a stationary unit housing various soil probes, whereas the airborne
    data acquisition system (ADAS) is a mobile unit that can be placed on a UAV. The
    SDMP captures soil metrics, preprocesses them, and stores the data on an SD card,
    to be delivered using an NRF24 transceiver. The unit itself is battery- and solar-powered;
    regulated power is fed through a custom-designed motherboard to the Arduino Mega
    Controller (ATMEGA-2560), and internal/external modules. It is estimated that,
    with its low-power design and the complimentary solar power, it can work for months
    without interruption. The ADAS is a lightweight device and has been mounted on
    a drone to commence the data collection. It initiates data collection by interrogating
    sleeping SDMPs based on geological stamps by waking them up from deep sleep mode
    with an interrupt. The ADAS is supported by a custom motherboard to support a
    raspberry pi zero with Wi-Fi capabilities [8].


    For monitoring the important parts that help with the growth and income, a sensor-based
    modern technology with IoT has been developed. In addition, an optimization technique
    for identifying crop loss has been implemented to maximize the system boundary
    and convey data to farmers about the boundary of the system in various locations.
    To demonstrate the validity of the suggested method, certain existing methods
    were examined, and it shows that the proposed strategy improves the result by
    58%. Despite many solutions proposed by many authors, there is still a gap in
    farming answers to many parametric targets such as the height of crop, weight,
    and thickness. Moreover, no suitable formulations or methods for implementing
    such real-time applications using sensors have been developed. As a result, the
    authors have collaborated to develop a new, unique model for monitoring all important
    factors for crop growth, which then gives sufficient daily information to all
    farmers through an online-based monitoring application. As an additional benefit
    of the suggested system, information can be sent to all farmers in their local
    languages, which can be preserved. Additionally, the proposed work was prompted
    by an analysis of the issues that farmers experience in their day-to-day lives,
    where the amount of revenue that their network/system was initially framed. Therefore,
    certain limits are set before applying the sensor, which is of great benefit to
    all farmers. At the same time, basic payments are made when farming with smart
    devices that monitor sustainability [9].'
