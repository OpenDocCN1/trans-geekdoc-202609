- pgno: 375
  md: '# E. Forecasting:


    With the help of different machine learning and artificial intelligence algorithms,
    detection of plant diseases, prediction of soil moisture, etc., have been made
    possible. Thus, forecasting is one of the important applications of smart farming.


    # 16.3.2 Predictive analytics for smart farming, such as crop harvesting time,
    the risks of diseases and infestations, and yield volume


    Generally, data analysis plays a huge role in smart farming. The input is in the
    form of data, and the output is also generated in the form of data. The processing
    of data is definitely a huge challenge as large amounts of data come into play.
    As a result, the concept of knowledge data discovery (KDD) is used here. This
    concept falls under data mining. KDD involves various steps:


    # I. Data pre-processing:


    The data might be messy or incomplete, or there might also be metadata involved.
    To increase the accuracy, consistency, and integrity of data, it is pre-processed.
    This method is applicable when huge amounts of data come into play. The relevant
    data is extracted from the metadata and used for the process.


    # II. Data reduction:


    Data reduction is the process of chopping off unnecessary data. There are various
    reduction techniques involved in this process. Smart farming uses the technique
    of numerosity reduction. Histograms can also be used for smart farming.


    # III. Data discovery:


    This step involves the extraction of knowledge from the reduced data. Some of
    the examples are clustering, classification, association rules, etc. Out of the
    mentioned examples, association rules, comes in handy when smart farming is considered.
    They find the relationship between the parameters of the soil and those of the
    plants or the crops. The association rule has two basic criteria: (i) minimum
    support and (ii) confidence.


    # IV. Solution analysis:


    This is the real-time implementation and analysis of smart farming.'
