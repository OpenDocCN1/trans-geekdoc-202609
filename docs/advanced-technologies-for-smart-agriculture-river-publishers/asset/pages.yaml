    # 16.2 Background Study


    This chapter provides an in-depth comparison of key performance indicators as
    well as the challenges that smart farming will face during implementation [1].
    It also discusses the various IoT application layer protocols. This chapter also
    discusses the various applications of smart farming. Application layer protocol
    plays an important role in smart farming. In the IoT, the various application
    protocols used are CoAP, MQTT, XMPP, DDS, and AMQP. These play an important role
    in communicating messages, and in applications that have limited hardware, etc.


    This chapter discusses the use of unmanned aerial vehicles (UAVs) incorporated
    with the Internet of Things and their short-range connectivity, as well as various
    communication technologies used in smart farming to achieve sustainable farming
    [2]. Unmanned aerial vehicles play an important role in smart farming. It helps
    farmers monitor the health of crops, monitor livestock, and spray fertilizers
    to ensure that the crops stay healthy. They give some important insights to farmers
    and help them in various aspects. Applications of inter-connected devices and
    technologies are also discussed in this chapter.


    This chapter primarily focuses on wireless networks and their technologies to
    improve the efficiency of smart agriculture and, therefore, reap its fruits [3].
    This chapter also discusses the control system using nodes and sensors. These
    are also used to extract data, process the data, and finally send it to the control
    box. This chapter discusses the role of data mining, which involves the processes
    of data extraction, data cleaning, and data analysis, in smart farming.


    This chapter discusses the role of digital twins in improving the efficacy of
    smart farming and in the advancement of smart farming [4]. Digital twin is basically
    used to decouple the physical flow and incorporate it with the virtual world.
    According to this chapter, digital twins help farmers remotely monitor various
    parameters of crops, such as the crop growth rate, the health of crops, and so
    on.


    In this chapter, the role of biomimicry and its six principles in agriculture
    is discussed [5]. Biomimicry helps to alleviate the damage caused by'
