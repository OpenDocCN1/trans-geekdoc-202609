- pgno: 395
  md: '![](img/d1f13ee8a5e334af2b540a0b952cbea1_395_0.png)


    All of these issues are the product of poor foresight and planning. Land shortage
    and poverty yield unsustainable land management practices, the direct causes of
    degradation named above. Poor farmers are led to clear forests, cultivate steep
    slopes without conservation, overgraze rangelands, and make unbalanced fertilizer
    applications.


    # 17.2.3 Impact of climate change on agricultural productivity


    The effects of climate change are causing a significant evolution of the earth.
    Human-caused Green House Gas (GHG) emissions make the greenhouse effect stronger
    and contribute to climate change. One of the main sources of GHGs is the agricultural
    sector. Figure 17.2 clearly explains that agribusiness, forest management, and
    other land uses have contributed to a nearly two-fold increase in greenhouse gas
    emissions during the previous 50 years. Methane and nitrous oxide emissions from
    agriculture account for the majority of these emissions. Furthermore, predictions
    point to a rise by 2050.'
