    # Figure 3.5 Deep learning system challenges.


    since they will be using it to better the farming system. There is a lack of interest
    due to availability of minimal resources to build knowledge exchange platforms
    by accepting new technologies. The key reason for the lack of interest is a general
    lack of understanding and information about how technology may bring concrete
    progress both financially and environmentally to establish sustainable development
    architecture for all stakeholders. Although many research works are carried out
    in this sector, the practicality and application of these research works are sometimes
    ignored.


    Even apart from applicability, there is a significant empty space in field work
    where qualified professionals can go about explaining the value of technology,
    which is the major obstacle to adopting the technology. The key difficulty is
    that security concerns might lead to agricultural harvesting disasters, resulting
    in food shortages, causing concerned parties to be hesitant to use the technology.
    Furthermore, issues and scopes are a continual process that must be addressed
    and altered often through check and balance in order to offer a sustainable development
    with real outcomes for the whole community [56].


    # 3.4.3 Challenges in deep learning


    Deep learning had already emerged among the most essential learning topics towards
    the development of intelligent systems. Deep learning techniques make use of artificial
    neural network (ANN) imitating human minds and progressively learning how to deal
    with a given particular situation. However, there are substantial challenges with
    deep learning systems that we must be aware of as shown in Figure 3.5.


    # 3.4.3.1 Massive amount of data


    Data is used to train deep learning algorithms to learn in a progressive manner.
    To ensure that the machine produces the appropriate results, large datasets are'
  merge: -1
  img_proc: true
- pgno: 103
  md: 'required. The equivalent artificial neural network needs a large quantity data,
    as the human brain need a large amount of experience to learn and interpret information.
    The greater the abstraction, hence more parameters that must be modified, and
    much more parameters demand more data.


    # 3.4.3.2 High-performance hardware is needed


    A huge volume of data is required to train dataset sufficient for deep learning
    solution. To tackle problem in the real world, the machine must have sufficient
    computing power. Data scientists use multi-core high-performance GPUs and equivalent
    processing units in order to improve efficiency and decrease time consumption.
    Such processing machines are costly and may consume more power. Deep learning
    systems at the industrial level require elevated data centers, whereas drones,
    robots and mobile devices are examples of smart technologies that require compact
    yet effective computational units. As a result, installing a deep learning system
    in the actual world is both expensive and energy intensive.


    # 3.4.3.3 Neural network overfitting


    There is sometimes a significant discrepancy between the errors encountered in
    the training dataset and also the issue identified in the newly declassified dataset.
    It happens in complicated framework if there are so many parameters in comparison
    with volumes of data. The effectiveness of a model is determined by its capacity
    to execute effectively for unknown dataset, rather than based on its effectiveness
    on training data provided to it. Typically, a model is developed by optimizing
    its efficiency on such a certain training dataset. As a result, the model remembers
    the training instances but it does not understand how to generalize current circumstances
    or datasets.


    # 3.4.3.4 Hyperparameter optimization


    The value of hyperparameters is determined before the learning process begins.
    A slight change in the value of such parameters might cause a significant difference
    which affects the performance of your model. Using its default configuration and
    without conducting hyperparameter optimization may possess substantial influence
    in terms of model effectiveness. Holding very few hyperparameters and adjusting
    those manually rather than employing optimization methods is also a type of performance-limiting
    factor.


    # 3.4.3.5 Implementing high-level cognitive functions


    If we know what our parameters of the model are, how do we feed a known data to
    neural networks and how are they assembled. However, seldom do we grasp how they
    arrive at a certain solution. Researchers struggle to grasp'
  merge: -1
  img_proc: true
- pgno: 104
  md: 'how neural networks draw conclusions since they are basically black boxes.
    The inability of neural networks to reason abstractly makes high-level cognitive
    processes challenging to accomplish. Furthermore, their functioning is mostly
    transparent to humans, making them inappropriate for areas where process verification
    is critical.


    # 3.4.3.6 Lacking of multitasking and flexibility


    Deep learning methods could provide extremely efficient and precise solutions
    (once trained) to specific problems. But, in today’s world, neural network topologies
    were extremely customized for a particular purpose field. The majority of the
    systems are based on this concept, and they excel at handling a single issue.
    Even handling a related situation needs re-training and reassessment. Deep learning
    frameworks that could also multitask without having to redesign the entire architecture
    are being extensively investigated by researchers.


    # 3.4.3.7 Data security


    Deep learning has been identified in a lot of sectors and has delivered great
    performance in outcomes due to the advancement of algorithms in vast data and
    strong computing services. It is important in everyday applications and is gently
    affecting societal conventions, habits and behaviors. Data-based learning methodologies,
    on the other hand, are bound to create possible security and privacy risks, as
    well as raise public and government concerns regarding their use in the real world.
    In order to interrupt the training process or cause the model to deliver unexpected
    results, data security threats try to compromise the integrity or availability
    of data.


    Black-box and white-box attackers are the two categories of attackers regarded
    in general. A DNN model’s internal information, like optimization methods, parameter
    arrangement as well as training sets, is not accessible to a black-box attacker.
    In order to increase access to the search function, the white-box attacker gains
    a lot of information, such as the structure, DNN model specification as well as
    certain training data. White-box attackers were undoubtedly superior to black-box
    attackers in terms of effectiveness.


    # 3.4.4 Recent deep learning algorithms in smart farming


    With a flood of anticipation flowing into the DL sector, significant advances
    have been made in recent years. Image recognition is one of its agricultural applications,
    and it has overcome several difficulties that have slowed rapid progress with
    robotics and automation farming and agro-industry. Many'
