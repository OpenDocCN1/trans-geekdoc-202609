    # 3.5 Conclusion and Future Scope


    The wide majority of recent agricultural developments produced through researchers
    were strongly associated with productivity and all other aspects of agriculture,
    to improve crop productivity, reduce and prepare for plant diseases, and promote
    mechanized and automated modernized agriculture and agro-industry. The principles,
    techniques, restrictions and algorithms of machine learning as well as deep learning
    are summarized elaborately in this paper. Deep learning applications in agriculture
    were discussed. Deep learning has been within the scope of smart applications
    for agriculture, including crop management systems. Crop cultivation, crop disease
    diagnostics, water along with soil management, crop distribution, weed control,
