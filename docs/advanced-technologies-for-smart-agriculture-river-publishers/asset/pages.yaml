    # ### 1.2.1.1 Soil temperature


    Moisture, conductivity, surface temperature, and soil temperature are all monitored
    by the smart agriculture node (Figure 1.8).


    The activity of plants below ground is greatly influenced by soil temperature,
    which affects root development, respiration, nitrogen mineralization, and decomposition.
    A probe buried in the soil is the most precise method of determining soil temperature,
    but using IoT sensors to measure air temperature and other parameters may also
    be possible. There can be multiple probes inserted at varying depths based on
    the plant''s root system. The temperature of the soil can be measured with IoT
    sensors that use IR technology.


    # ### 1.2.1.2 Soil moisture


    Buried probes with electrodes can also be used to measure the moisture content
    of the soil. In hydrology, soil chemistry, plant development, and groundwater
    recharge are all significantly influenced by agricultural moisture content and
    soil science. Several factors make the moisture content of the soil crucial: Water
    is a crucial ingredient for all plants and crops, and it is also a'
