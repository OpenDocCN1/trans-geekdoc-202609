    Figure 1.6 Harvesting.


    # 1.1.7 Storage


    At godowns, harvested grains are kept in granaries or bins for subsequent use
    or marketing. Therefore, crop protection techniques need to be improved. Prior
    to storage, grains are cleaned, dried, fumigated, and other insect and rodent
    protection measures are taken (Figure 1.7).


    # 1.2 Role of Smart Agriculture in Soil Preparation


    A soil monitoring system with the Internet of Things can improve production, reduce
    illness, and optimize resources by leveraging technology. IoT sensors can measure
    thermometry, NPK, volumetric water content, photo-synthetic radiation, soil water
    potential, and soil oxygen levels. IoT sensors collect and transmit data to a
    central location for analysis, visualization, and trend analysis.


    To increase crop yield and quality, agricultural practices can be optimized, trends
    can be detected and minor changes can be made to the environment. IoT is a key
    component of precision farming, and IoT is used in smart agriculture.


    # 1.2.1 Activities of IoT sensors


    As part of smart farming, soil, weather, and crop conditions are taken into account
    as well as smart environment (air quality) and smart water (pollution,'
