    # 13.5.3 Incorporating manure and fertilizers


    Manure and fertilizers are the materials that are put to the soil as nutrients
    to support the healthy growth of plants. The agricultural plants receive their
    mineral nutrients from the soil. These components are essential for the growth
    of plants. Crop after crop is planted on the same land by farmers in some areas.
    The field is never left fallow or untended.


    The nutrients in the soil become depleted due to the ongoing agricultural cultivation.
    To replace the soil’s nutrients, farmers must apply manure to the fields. Manuring
    is the name of this procedure. Plants that receive improper or insufficient manuring
    are feeble. Manure is an organic material created by the breakdown of animal and
    plant wastes. Farmers throw animal and plant waste in open pits and let it decompose.
    Some microorganisms are the cause of the breakdown. Organic manure is made from
    the decomposing material.


    Chemicals called fertilizers are high in a certain nutrient. Fertilizer use has
    aided farmers in increasing the output of crops including rice, wheat, and corn.
    However, overuse of fertilizers has reduced soil fertility. Additionally, fertilizers
    are becoming a cause of water pollution.


    Manure’s benefits include: Manure made from organic materials is preferred over
    fertilizers. This is due to the following:


    +   - It increases the soil’s ability to water holding.

    +   - It makes the earth permeable, facilitating the free gases exchange.

    +   - It enhances the population of beneficial microbes.

    +   - It enhances the soil’s texture.


    # 13.5.4 Irrigation


    Irrigation is the process of regularly supplying crops with water. Depending on
    the crop, the soil, and the season, irrigation should be done at different times
    and more frequently. Wells, tube wells, ponds, lakes, rivers, dams, and canals
    are some of the places where irrigation water can be obtained.'
