  md: '# 8.2.6 Tools to evaluate the performance of multi-story cropping system


    To provide an overview of a cropping system framework for assessing cropping system
    changes. The framework consists of a rule-based rotation generator and a set of
    algorithms for computing impact indicators. It is organized as three steps:


    +   (i) Plan crop rotations.


    +   (ii) Evaluate crop production activities using environmental, economic, and
    phytosanitary indicators.


    +   (iii) Designing a cropping system and assessing its impact. Cropping system
    planning and evaluation are aided by the framework. Some examples of multi-tier
    crop farming have been effective.


    # 8.2.6.1 Land equivalent ratio (LER)


    The relative and solitary crop that would be required to provide the equal yield
    produced by intercropping [19] is a key instrument for the evaluation of intercropping
    systems. An LER greater than one implies a yield advantage, an LER equal to one
    indicates no grain, no gain, or no loss, and an LER less than one indicates a
    yield loss. The LER is determined using the formula LER = (Ypi/Ymi), where Ypi
    represents the yield of each crop in a polyculture and Ymi represents the yield
    of each crop in a monoculture.


    # 8.2.6.2 Relative yield total (RYT)


    Replacement series yield benefits can be quantified using the relative yield total.
    RYT = Xmix/Xsole + Ymix/Ysole when two species are intercropped, where Xmix and
    Ymix are mixture yields of species X and Y, whereas Xsole and Ysole are sole crop
    yields of species X and Y. RYT values more than 1 imply that the species compete
    differently for resources or avoid competition in some way, whereas RYT values
    less than 1 indicate mutual antagonism. RYT values of 1 imply that the components
    fully share the same limiting resource, i.e., they fully compete and have no antagonistic
    relationships [20].


    # 8.2.7 Reason for the need of multi-story cropping system in India


    The average size of a holding in India was 2.28 hectares in 1970–1971, 1.82 hectares
    in 1980–1981, and 1.50 hectares in 1995–1996. With the limitless subdivision of
    land holdings, the size of the holdings will shrink even further.'
