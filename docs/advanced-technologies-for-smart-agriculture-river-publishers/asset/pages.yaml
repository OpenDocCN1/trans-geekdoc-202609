- pgno: 218
  md: 'The basic principles of multi-storied cropping system are as follows:


    +   (i) Crop diversification options based on scientific, ecological, and economic
    grounds.

    +   (ii) Increases system productivity.

    +   (iii) Improves system productivity.

    +   (iv) Makes use of high-efficiency resources.

    +   (v) Intense input utilization.

    +   (vi) Long-term sustainability of farm resources and the environment.


    # 8.2.5.2 Basic types of multi-storied cropping system


    +   1. **Monoculture:** Refers to the year-round cultivation of the same crop
    in the same field. Rice after rice, for example, or jute after jute.

    +   2. **Duoculture:** On a parcel of land, two types of crops are cultivated
    alternately every year. Jute, for example, comes after the vegetable, and rice
    comes after the veggie.

    +   3. **Polyculture:** When more than two types of crops are cultivated in succession
    on a plot of land over the course of a year, it is called polyculture.


    In addition, there are several types of multiple cropping techniques, which are
    exciting:


    +   * **Pure stand multiple cropping** is a type of multiple cropping in which
    crops are produced in succession over a certain length of time in a unit of land
    owned by farmers. Each crop is sown and harvested separately in this practice,
    with each crop having its own land preparation; Aus paddy T. Aman Lentil, for
    example.

    +   * **Multiple cropping of a mixed type:** It is a type of multiple cropping
    in which two or more crops are produced in the same season and on the same piece
    of land at the same time. Depending on the maturation period of each crop, it
    is harvested one after the other in mixed cropping; for example, Aus+B, Amon,
    Mustard+lentil, and Rai+Barley.

    +   * **Multiple cropping of the intercrop type:** It is a type of multiple cropping
    when the same minor crop is grown between the major crops.'
