    # Abstract


    Changes in weather patterns are currently the greatest global challenge. Climate
    change has a detrimental impact on agriculture. The decline in yield and nutritional
    quality of crops is owing to several factors causing climate change. It has created
    a negative impact on some food crops, which could lead to food shortages shortly.
    Climate change, precipitation, greenhouse gas emissions, and natural disasters
    are all to blame for the effects. All of these negative effects harm the environment,
    which is the root source of environmental problems. Climate change is having a
    major impact on all life forms on earth, especially in agriculture. IoT devices
    built using machine learning algorithms have accelerated smart farming in different
    climates. Machine learning has made a significant contribution to data prediction
    and analysis in a variety of fields. It is a field of science where machines can
    acquire knowledge without being programmed. It has emerged in unison with big
    data technologies and high-performance machines to generate new avenues for unwinding,
    analyzing, and comprehending data-intensive farming activities. Machine learning
    is used in agro at all stages from planting to reaping. The procedure includes
    land preparation, seed prognosis, weather forecasting, irrigation feed monitoring,
    and assisting robots in appraising the growth or ripening result. This chapter
    describes a global scenario for how climate change would affect agriculture, as
    well as a number of IoT tools used for'
  merge: -1
  img_proc: true
- pgno: 292
  md: 'smart farming including its challenges. The chapter also briefly explains how
    machine learning can be implemented to increase the production level in agriculture
    to changes in weather conditions.


    # 12.1 Introduction


    A change in the weather pattern is a prolonged change in the temperature of the
    environment and climate variability. This might happen as a result of natural
    disasters or human behavior. Some of the repercussions of climate change include
    glacier melting, which raises water levels, a rise in heat waves, which leads
    to a long summer, and a change in precipitation pattern from region to region.
    People have been forced to migrate as a consequence of elevated sea levels and
    saline intrusion, and communities are fearful of famine as a result of repeated
    droughts.


    Environmental problems are having an adverse effect on agricultural production.
    Changes in climate patterns have an effect on the productivity of soil and crops.
    The preponderance of natural vegetation is impacted by environmental variations.
    However, there is a worry that crops may lose their nutrient quality as a result
    of the usage of fertilizers and manures, which help to increase productivity.


    Conservation agriculture strives to increase crop output while simultaneously
    enhancing economic and environmental benefits. Fuel efficiency, elevated soil,
    and crop moisture have all increased as a result of using conservation farming
    approaches using IoT. As a result, the impact of anthropogenic global warming
    has been lessened. Although infrastructural and financial obstacles remain, the
    dissemination of sensors and network devices could encourage the adoption of innovative
    methodologies such as smart farming, which uses the least chemical pesticides,
    fertilizer, and moisture potential, along with weather prediction systems, which
    are especially important, given the devastating impact of extreme weather events,
    such as droughts, on local communities well-being and their economic development.
    As a result, the impact of natural and anthropogenic global warming has been lessened.


    # 12.2 Global Scenario and Evolving Context


    # 12.2.1 Climate change


    The physical environment, biodiversity, and human society are all impacted by
    human behavior''s contribution to climate change. Future effects of climate change
    in various nations can be predicted based on reductions in greenhouse gas emissions.
    Today, as predicted by experts earlier, sea ice loss, fast sea'
