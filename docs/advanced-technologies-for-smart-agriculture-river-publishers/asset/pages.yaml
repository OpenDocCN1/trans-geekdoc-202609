    # 6.3.1 Approaches of machine learning


    Based on the type of input or feedback that the learning system has access to,
    traditional machine learning algorithms can be divided into three major types
    [4]. They receive supervised instruction.


    # 6.3.1.1 Supervised learning


    Algorithms for supervised machine learning make predictions about the future by
    utilizing tagged examples to apply lessons from the past to fresh data. By examining
    a known training dataset, the learning algorithm creates an inferred function
    to forecast output values. The system may provide targets for any new input once
    it has received enough training. Additionally, to identify faults and correct
    the model, it can compare its output to that which is intended [14].


    # 6.3.1.2 Unsupervised learning


    Unsupervised machine learning techniques are employed when the data used to train
    is neither categorized nor tagged. Unsupervised learning studies how systems can
    infer a function to describe a hidden structure from unlabeled data. The system
    never has a certain understanding of the proper output. Instead, it uses datasets
    to infer what the outcome should be [14].


    # 6.3.1.3 Reinforcement learning


    Algorithms used in reinforcement machine learning interact with their environment
    by taking actions and identifying rewards or errors. The most crucial'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'components of reinforcement learning are delayed reward and trial-and-error
    search. With the help of this technique, robots and software agents may autonomously
    decide how to act in a situation to maximize their performance. The reinforcement
    signal, which is a straightforward reward signal, is necessary for the agent to
    learn which behavior is optimal [14].


    # ### 6.3.1.4 Other approaches in machine learning


    ML has the ability to apply additional approaches that were not frequently used
    in the existing ways, and occasionally the same machine learning system will use
    more than one approach [4].


    # ### 6.3.1.5 Self-learning


    Another strategy that applies the principles of machine learning is self-learning.
    With the aid of a neural network, it was originally presented in 1982. The crossbar
    adaptive array neural network has self-learning capabilities (CAA). It is a process
    of learning, and there are no outside incentives or counsel from others. The CAA
    self-learning algorithm was implemented as a crossbar, which limits the consideration
    of actions and emotions (feelings) decisions to scenarios having consequences.
    The system is determined by the way intellect and emotion interact [5].


    # ### 6.3.1.6 Feature learning


    A machine learning-based strategy is known as feature learning algorithms, often
    referred to as representation learning algorithms. As a pre-processing stage,
    this algorithm both safeguards and transforms the information in their input.
    In other words, pre-processing comes before categorization or prediction. Using
    feature learning methods, it is possible to recreate inputs from unknown data-generating
    distributions, demonstrating that the input is not real data being utilized for
    improbable configurations. This approach thus eliminates manual feature engineering
    to prevent erroneous input data, enables a machine to learn the features, and
    uses them to carry out a given task [6].


    Feature learning is applicable to both supervised and unsupervised learning. In
    supervised feature learning, features are trained using labeled input data. Examples
    include supervised dictionary learning, multilayer perception and artificial neural
    networks. Features are learned using unsupervised feature learning from unlabeled
    input data. Examples include lexical learning, independent component analysis,
    autoencoders, matrix factorization and other kinds of clustering [6].'
