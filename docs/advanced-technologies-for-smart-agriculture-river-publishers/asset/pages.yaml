    # 13.3.2 Mixed cropping


    The practice of planting two or more crops simultaneously on the same plot of
    land is known as mixed cropping. Mixed cropping, for instance, is the simultaneous
    cultivation of wheat and gram on the same piece of land. This method reduces the
    likelihood that one of the crops will fail and provides protection against crop
    failure brought on by unusual weather.


    The crops that will be cultivated together should demand varying amounts of water
    and maturity times. It is best to plant one tall crop and one dwarf crop together.
    The amount of nutrients needed by one crop should be lower than the amount needed
    by another. One crop needs deep roots, while another needs shallow ones. A successful
    mixed cropping pattern is the result of all these factors.


    # 13.3.3 Intercropping


    Intercropping is the practice of growing many crops at once in a predetermined
    row pattern on the same plot of land. Three rows of intercrops can be cultivated
    after one row of the main crop. As a result, productivity per area increases.


    The different types of intercropping are as follows:


    +   **Row intercropping:**


    Row intercropping is the practice of planting the component crops in different
    rows. It aids in the most effective use of land area and the control of weeds
    during the initial stages of the primary crop.'
