    # 13.5.5 Weeds protection


    An unwanted plant could inevitably grow alongside the crop. Weeds are the name
    given to these unwelcome plants. Weeding refers to the removal of weeds. Even
    when being harvested, some weeds can interact and pose a risk of poisoning to
    both humans and animals. Farmers use a variety of techniques to get rid of weeds
    and limit their growth. Before planting crops, tilling aids in removing and eliminating
    weeds, which may later dry up and combine with the soil. It is best to remove
    weeds before they blossom and produce seeds.


    Other methods of controlling weeds include the use of chemicals known as weedicides,
    such as 2,4-D. To kill the weeds, they are sprayed on the fields. The crops are
    not harmed by them. The necessary amount of water is used to dilute the weedicides
    before being sprayed with a sprayer into the fields. Farmers’ health may be impacted
    by the use of weed killers. Farmers should thus use these chemicals with caution.
    When these chemicals are sprayed on them, they should use a piece of cloth to
    protect their mouth and nose.


    # 13.5.6 Harvesting


    Crop harvesting is a crucial duty. Harvesting is the act of cutting a crop after
    it has reached maturity. Crops are hauled out or cut close to the ground during
    harvest. A cereal crop typically takes 3–4 months to reach maturity. The grain
    seeds in the harvested crop must be distinguished from the chaff. Threshing is
    the name of this procedure. This is accomplished with the use of a device known
    as a “combine,” which functions as both a harvester and a thresher. Winnowing
    is used by farmers with modest landholdings to separate the grain from the chaff.'
