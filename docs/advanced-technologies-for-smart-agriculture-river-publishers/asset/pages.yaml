  md: '![](img/d1f13ee8a5e334af2b540a0b952cbea1_36_0.png)


    Figure 1.3 Manuring.


    # 1.1.3 Manuring


    Nutrients are necessary for crop growth and productivity. Therefore, a consistent
    supply of nutrients is required (Figure 1.3). Nutritional supplements are given
    throughout the manuring process, and they can be either natural (manure) or synthetic
    substances (fertilizers). Plant and animal wastes decompose into manure as a byproduct.
    Commercially produced fertilizers are chemical mixtures that contain plant nutrients.
    In addition to giving crops nutrition, manure restores soil fertility. Compost,
    crop rotation, and planting of leguminous plants are further techniques for replenishing
    soil [1].


    # 1.1.4 Irrigation


    Water is supplied by irrigation. Water sources include things like wells, ponds,
    lakes, canals, and dams. Waterlogging from excessive irrigation could harm the
    crop. Controlling this frequency and the time between successive irrigations is
    necessary (Figure 1.4).


    # 1.1.5 Weeding


    Unwanted plants known as weeds commonly grow among crops. They are eliminated
    using weedicides and hand pulling, and some are eliminated while the soil is being
    prepared (Figure 1.5).'
  merge: -1
  img_proc: true
