  - "[PAGE 44]\n\nBy the current specification (Go 1.19), for a type parameter involved\
    \ assignment,\n\n+   - if the destination type is a type parameter and the source\
    \ value is an untyped value, then the assignment is valid only if the untyped\
    \ value is assignable to each type in the type set of the destination type parameter.\n\
    +   - if the destination type is a type parameter but the source type is an ordinary\
    \ type, then the assignment is valid only if the source ordinary type is unnamed\
    \ and its values is assignable to each type in the type set of the destination\
    \ type parameter.\n+   - if the source type is a type parameter but the destination\
    \ type is an ordinary type, then the assignment is valid only if the destination\
    \ ordinary type is unnamed and values of each type in the type set of the source\
    \ type parameter are assignable to the destination ordinary type.\n+   - if both\
    \ of the destination type and the source type are type parameters, then the assignment\
    \ is invalid.\n\nFrom the rules, we could get that type value of a named type\
    \ can not be assigned to another named type.\n\nIn the following code snippet,\
    \ there are four invalid assignments.\n\n```\nfunc dat[T ~int | ~float64, S *int\
    \ | []bool]() {\n    var _ T = 123 // okay\n    var _ S = nil // okay\n}\n```\n\
    \n```\nfunc zum[T []byte](x []byte) {\n    var t T = x // okay\n    type Bytes\
    \ []byte\n    var y Bytes = x // okay (both are ordinary types)\n    x = t //\
    \ okay\n    x = y // okay\n\n    // Both are named types.\n    t = y // error\n\
    \    y = t // error\n\n    // To make the above two assignments valid,\n    //\
    \ the sources in then must be converted.\n    t = T(y)     // okay\n    y = Bytes(t)\
    \ // okay\n}\n```\n\n```\nfunc pet[A, B []byte](x A, y B){\n    // Both are type\
    \ parameters.\n    x = y // error: cannot use y as type A in assignment\n    y\
    \ = x // error: cannot use x as type B in assignment\n}\n```\n\nIt is unclear\
    \ whether or not the assignment rules will be relaxed in future Go versions. It\
    \ looks the posibility is small."
