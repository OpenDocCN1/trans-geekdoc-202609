    func rat[T ~[]int | ~[]bool](c T) {\n    _ = make(T) // error: invalid argument:\
    \ no core type\n}\n```\n\nCalls to the predeclared `new` function do not have\
    \ this requirement.\n\n## 7.15 A call to the predeclared delete function requires\
    \ all types in the type set of its first argument have an identical key type\n\
    \nNote, here, the identical key type may be an ordinary type or a type parameter\
    \ type.\n\nThe following functions both compile okay.\n\n```go\nfunc zuk[M ~map[int]string\
    \ | ~map[int]bool](x M, k int) {\n    delete(x, k)\n}\n```\n\n```go\nfunc pod[M\
    \ map[K]int | map[K]bool, K ~int | ~string](x M, k K) {\n    delete(x, k)\n}\n\
    ```\n\n## 7.16 A call to the predeclared close function requires all types in\
    \ the type set of its argument are channel types\n\nThe following function compiles\
    \ okay.\n\n```go\nfunc dig[T ~chan int | ~chan bool | ~chan<- string](x T) {\n\
    \    close(x)\n}\n```\n\nNote that the current Go specification requires that\
    \ the argument of a call to the predeclared `close` function must have a core\
    \ type. This is inconsistent with the implementation of the official standard\
    \ Go compiler.\n\n## 7.17 Calls to predeclared complex, real and imag functions\
    \ don't accept arguments of type parameters now\n\nCalling the three functions\
    \ with arguments of type parameters might break the principle rule mentioned in\
    \ the first section of the current chapter.\n\nThis is a problem the current custom\
    \ generics design is unable to solve. There is an issue for this.\n\n## 7.18 About\
    \ constraints with empty type sets\n\nThe type sets of some interface types might\
    \ be empty. An empty-type-set interface type implements any interface types, including\
    \ itself.\n\nEmpty-type-set interface types are totally useless in practice, but\
    \ they might affect the implementation perfection from theory view.\n\nThere are\
    \ really several imperfections in the implementation of the current official standard\
    \ Go compiler (v1.19).\n\nFor example, should the following function compile?\
    \ It does with the latest official standard Go compiler (v1.19). However, one\
    \ of the above sections has mentioned that a `make` call requires its argument\
    \ to have a core type. The type set of the constraint `C` declared in the following\
    \ code is empty, so it has no core type, then the `make` call within the `foo`\
    \ function should not compile.\n\n```go\n// This is an empty-type-set interface\
    \ type.\ntype C interface {\n    map[int]int\n    M()\n}\n\nfunc foo[T C]() {\n\
    \    var _ = make(T)\n}\n```\n\nThe following is another example, in which all\
    \ the function calls in the function `g` should compile okay. However, two of\
    \ them fail to compile with the latest official standard Go compiler (v1.19).\n\
    \n```go\nfunc f1[T any](x T) {}\nfunc f2[T comparable](x T) {}\nfunc f3[T []int](x\
    \ T) {}\nfunc f4[T int](x T) {}\n```\n\n```go\n// This is an empty-type-set interface\
    \ type.\ntype C interface {\n    []int\n    m()\n}\n\nfunc g[V C](v V) {\n   \
    \ f1(v) // okay\n    f2(v) // error: V does not implement comparable\n    f3(v)\
    \ // okay\n    f4(v) // error: V does not implement int\n}\n```\n\nThe current\
    \ Go specification specially states:\n\n> Implementation restriction: A compiler\
    \ need not report an error if an operand's type is a type parameter with an empty\
    \ type set. Functions with such type parameters cannot be instantiated; any attempt\
    \ will lead to an error at the instantiation site.\n\nSo the above shown imperfections\
    \ are not bugs of the official standard Go compiler.\n"
