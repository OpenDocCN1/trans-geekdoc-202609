    - 在以 A{} 和 A{1, 2} 作为值实参的两个调用中，类型实参被推断为 [2]int，即值实参的类型。\n- 在以 new(int) 作为值实参的两个调用中，类型实参被推断为\
    \ *int，即值实参的类型。\n\n请注意，所有这些类型实参都实现了 comparable 接口。不可比较的类型，例如 []int 和 map[string]int，不能作为\
    \ NoDiff 泛型函数调用的类型实参传递。另外请注意，虽然 any 是可比较的（值）类型，但它并不实现 comparable，因此它也不是合格的类型实参。这将在下一章详细讨论。\n\
    \n上面的示例展示了泛型如何避免函数声明中的代码重复。如果没有自定义泛型，我们需要为示例中使用的每个类型实参声明一个函数。这些函数声明的函数体几乎相同。\n\
