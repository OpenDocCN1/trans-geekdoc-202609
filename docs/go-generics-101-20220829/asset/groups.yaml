    \n## 第4章\n\n### 初识自定义泛型\n\n在自定义泛型世界中，类型可以被声明为泛型类型，函数可以被声明为泛型函数。此外，泛型类型是定义类型，因此它们可以拥有方法。\n\
    \n泛型类型、泛型函数或泛型类型的方法的声明包含一个类型参数列表部分，这是与普通类型、函数或方法的主要区别。\n\n#### 4.1 一个泛型类型示例\n\n\
    首先，让我们看一个示例来展示泛型类型的样子。它可能不是一个完美的示例，但它确实展示了自定义泛型类型的实用性。\n\n```go\npackage main\n\
    \nimport \"sync\"\n\ntype Lockable[T any] struct {\n    sync.Mutex\n    Data T\n\
    }\n\nfunc main() {\n    var n Lockable[uint32]\n    n.Lock()\n    n.Data++\n \
    \   n.Unlock()\n\n    var f Lockable[float64]\n    f.Lock()\n    f.Data += 1.23\n\
    \    f.Unlock()\n\n    var b Lockable[bool]\n    b.Lock()\n    b.Data = !b.Data\n\
    \    b.Unlock()\n}\n```\n\n```go\ntype LockableUint32 struct {\n    sync.Mutex\n\
    \    Data uint32\n}\n\ntype LockableFloat64 struct {\n    sync.Mutex\n    Data\
    \ float64\n}\n\ntype LockableBool struct {\n    sync.Mutex\n    Data bool\n}\n\
    \ntype LockableBytes struct {\n    sync.Mutex\n    Data []byte\n}\n\nfunc main()\
    \ {\n    var n LockableUint32\n    n.Lock()\n    n.Data++\n    n.Unlock()\n\n\
    \    var f LockableFloat64\n    f.Lock()\n    f.Data += 1.23\n    f.Unlock()\n\
    \n    var b LockableBool\n    b.Lock()\n    b.Data = !b.Data\n    b.Unlock()\n\
    \n    var bs LockableBytes\n    bs.Lock()\n    bs.Data = append(bs.Data, \"Go\"\
    ...)\n    bs.Unlock()\n}\n```\n\n非泛型代码包含许多代码重复，可以通过使用上述演示的泛型类型来避免。\n\n#### 4.2\
    \ 泛型类型方法的示例\n\n有些人可能不喜欢上述泛型类型的实现。相反，他们更倾向于使用如下代码所示的不同实现。与上一节中的 Lockable 实现相比，新的实现对外部包用户隐藏了结构体字段。\n\
    \n```go\npackage main\n```\n\n```go\nprintln(NoDiff[bool]())  // true\n\n// _\
    \ = NoDiff() // error: cannot infer V\n\n// error: *** does not implement comparable\n\
    // _ = NoDiff([]int{}, []int{})\n// _ = NoDiff(map[string]int{})\n// _ = NoDiff(any(1),\
    \ any(1))\n}\n```\n\n在上面的示例中，NoDiff 是一个泛型函数。与非泛型函数不同，与泛型类型类似，泛型函数的声明中有一个额外部分，即类型参数列表。这里，NoDiff\
    \ 泛型函数的类型参数列表是 [V comparable]，其中 V 是类型参数名称，comparable 是 V 的约束。\n\ncomparable 是\
    \ Go 1.18 中引入的一个新的预声明标识符。它表示一个由所有可比较类型实现的接口。下一章将更详细地解释它。\n\n这里，类型参数 V 被用作可变（值）参数的类型。\n\
