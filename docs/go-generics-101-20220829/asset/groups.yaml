    \ _ = make(T) // error: invalid argument: no core type\n}\n```\n\n```go\ntype\
    \ Stream chan int\ntype Queue Stream\n```\n\n```go\nfunc fat[T Stream | chan int\
    \ | Queue | chan<- int]() {\n    _ = make(T) // okay\n}\n```\n\n```go\nfunc nub[T\
    \ Stream | chan int | Queue | <-chan int]() {\n    _ = make(T) // okay\n}\n```\n\
    \n根据我的理解，这个要求是为了确保对制作出的容器（在上面的例子中是通道）进行的后续操作始终合法。例如，确保从制作出的通道接收到的值具有指定类型（无论是类型参数还是普通类型）。\n\
    \n就我个人而言，我认为这一要求过于严格。毕竟，在某些情况下，预想的后续操作并不会发生。\n\n要在泛型函数中使用没有核心类型的类型参数的值，我们可以将这些值作为值实参传递给函数，如下面的代码所示。\n\
    \n```go\nfunc doSomething(any) {}\n```\n\n```go\nfunc voc2[T chan bool | chan\
    \ int](x T) {\n    doSomething(x)\n}\n```\n\n```go\nfunc ted2[T chan<- int | <-chan\
    \ int](x T) {\n    doSomething(x)\n}\n```\n\n由于同样的要求，下面两个函数都无法编译。\n\n```go\nfunc\
    \ zig[T ~[]int | map[int]int](c T) {\n    _ = make(T) // error: invalid argument:\
    \ no core type\n}\n```\n\n```go\nfunc rat[T ~[]int | ~[]bool](c T) {\n    _ =\
    \ make(T) // error: invalid argument: no core type\n}\n```\n\n对预声明的 `new` 函数的调用没有此要求。\n\
    \n## 7.15 调用预声明的 delete 函数要求其第一个参数类型集合中的所有类型具有相同的键类型\n\n请注意，这里的相同键类型可以是普通类型，也可以是类型参数类型。\n\
    \n以下两个函数都可以编译。\n\n```go\nfunc zuk[M ~map[int]string | ~map[int]bool](x M, k int)\
    \ {\n    delete(x, k)\n}\n```\n\n```go\nfunc pod[M map[K]int | map[K]bool, K ~int\
    \ | ~string](x M, k K) {\n    delete(x, k)\n}\n```\n\n## 7.16 调用预声明的 close 函数要求其参数类型集合中的所有类型都是通道类型\n\
    \n以下函数可以编译。\n\n```go\nfunc dig[T ~chan int | ~chan bool | ~chan<- string](x T)\
    \ {\n    close(x)\n}\n```\n\n请注意，当前 Go 规范要求调用预声明的 `close` 函数的参数必须具有核心类型。这与官方标准\
    \ Go 编译器的实现不一致。\n\n## 7.17 调用预声明的 complex、real 和 imag 函数目前不接受类型参数\n\n使用类型参数作为参数调用这三个函数可能会违反本章第一节提到的原则规则。\n\
    \n这是当前自定义泛型设计无法解决的问题。已经有一个相关的 issue。\n\n## 7.18 关于空类型集合的约束\n\n某些接口类型的类型集合可能为空。空类型集合的接口类型实现任何接口类型，包括其自身。\n\
    \n空类型集合的接口类型在实践中完全无用，但从理论角度看，它们可能会影响实现的完美性。\n\n当前官方标准 Go 编译器（v1.19）的实现中确实存在几个不完美之处。\n\
    \n例如，下面的函数是否应该编译？在最新的官方标准 Go 编译器（v1.19）中，它可以编译。然而，前面的一节提到过，`make` 调用要求其参数具有核心类型。下面代码中声明的约束\
    \ `C` 的类型集合为空，因此它没有核心类型，那么 `foo` 函数内的 `make` 调用就不应该编译。\n\n```go\n// This is an\
    \ empty-type-set interface type.\ntype C interface {\n    map[int]int\n    M()\n\
    }\n\nfunc foo[T C]() {\n    var _ = make(T)\n}\n```\n\n下面是另一个例子，其中函数 `g` 中的所有函数调用都应该编译通过。然而，在最新的官方标准\
    \ Go 编译器（v1.19）中，其中两个调用无法编译。\n\n```go\nfunc f1[T any](x T) {}\nfunc f2[T comparable](x\
    \ T) {}\nfunc f3[T []int](x T) {}\nfunc f4[T int](x T) {}\n```\n\n```go\n// This\
    \ is an empty-type-set interface type.\ntype C interface {\n    []int\n    m()\n\
    }\n\nfunc g[V C](v V) {\n    f1(v) // okay\n    f2(v) // error: V does not implement\
    \ comparable\n    f3(v) // okay\n    f4(v) // error: V does not implement int\n\
    }\n```\n\n当前 Go 规范特别指出：\n\n> 实现限制：如果操作数的类型是一个具有空类型集合的类型参数，编译器可以不报告错误。带有此类类型参数的函数无法被实例化；任何尝试都会在实例化点导致错误。\n\
    \n因此，上述展现出的不完美之处并非官方标准 Go 编译器的缺陷。\n\n"
