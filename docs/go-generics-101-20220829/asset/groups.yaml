  - "[PAGE 7]\n\n# Chapter 4\n\n# First Look of Custom Generics\n\nIn the custom generics\
    \ world, a type may be declared as a generic type, and a function may be declared\
    \ as generic function. In addition, generic types are defined types, so they may\
    \ have methods.\n\nThe declaration of a generic type, generic function, or method\
    \ of a generic type contains a type parameter list part, which is the main difference\
    \ from the declaration of an ordinary type, function, or method.\n\n# 4.1 A generic\
    \ type example\n\nFirstly, let’s view an example to show how generic types look\
    \ like. It might be not a perfect example, but it does show the usefulness of\
    \ custom generic types.\n\n```\n```go\npackage main\n\nimport \"sync\"\n\ntype\
    \ Lockable[T any] struct {\n    sync.Mutex\n    Data T\n}\n\nfunc main() {\n \
    \   var n Lockable[uint32]\n    n.Lock()\n    n.Data++\n    n.Unlock()\n\n   \
    \ var f Lockable[float64]\n    f.Lock()\n    f.Data += 1.23\n    f.Unlock()\n\n\
    \    var b Lockable[bool]\n    b.Lock()\n    b.Data = !b.Data\n    b.Unlock()\n\
    }\n```\n```"
