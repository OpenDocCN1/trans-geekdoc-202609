    \ Go 1.18 发布之前刚刚添加的。它可能会在未来的 Go 版本中被移除。\n\n## 8.8 目前不支持对类型参数的值进行类型切换（type switch）\n\
    \n前面已经提到，从语义角度看，类型参数是一种接口类型。另一方面，类型参数具有波粒二象性。在某些情况下，它表现为其类型集合中的类型。\n\n到目前为止（Go\
    \ 1.19），不能对类型参数的值做类型断言。以下两个函数都无法编译。\n\n```go\nfunc tab[T any](x T) {\n    if n,\
    \ ok := x.(int); ok { // error\n        _ = n\n    }\n}\n```\n\n```go\nfunc kol[T\
    \ any]() {\n    var x T\n    switch x.(type) { // error\n    case int:\n    case\
    \ []bool:\n    default:\n    }\n}\n```\n\n以下上述两个函数的修改版本可以编译通过：\n\n## 8.10 无法构造这样的约束：允许涉及非特定底层类型的赋值\n\
    \n而且也不存在像下面假定的 assignableTo 和 assignableFrom 这样的预声明约束。\n\n```go\n// This function\
    \ doesn't compile.\nfunc yex[Tx assignableTo[Ty], Ty assignableFrom[Tx]](x Tx,\
    \ y Ty) {\n    y = x\n}\n```\n\n## 8.11 无法构造这样的约束：允许涉及非特定底层类型的转换\n\n而且也不存在像下面假定的\
    \ convertibleTo 和 convertibleFrom 这样的预声明约束。\n\n```go\n// This function doesn't\
    \ compile.\nfunc x2y[Tx convertibleTo[Ty], Ty convertibleFrom[Tx],\n    // The\
    \ second value argument is\n    // for type inference purpose.\n](xs []Tx, _ Ty)\
    \ []Ty {\n    if xs == nil {\n        return nil\n    }\n    ys := make([]Ty,\
    \ len(xs))\n    for i := range xs {\n        ys[i] = Ty(xs[i])\n    }\n    return\
    \ ys\n}\n```\n\n```go\nvar bs = []byte{61, 62, 63, 64, 65, 66}\nvar ss = x2y(bs,\
    \ \"\")\nvar is = x2y(bs, 0)\nvar fs = x2y(bs, .0)\n```\n\n目前，有一种不优雅的变通实现：\n\n\
    ```go\nfunc x2y[Tx any, Ty any](xs []Tx, f func(Tx) Ty) []Ty {\n    if xs == nil\
    \ {\n        return nil\n    }\n    ys := make([]Ty, len(xs))\n    for i := range\
    \ xs {\n        ys[i] = f(xs[i])\n    }\n    return ys\n}\n```\n\n```go\nvar bs\
    \ = []byte{61, 62, 63, 64, 65, 66}\nvar ss = x2y(bs, func(x byte) string {\n \
    \   return string(x)\n})\nvar is = x2y(bs, func(x byte) int {\n    return int(x)\n\
    })\nvar fs = x2y(bs, func(x byte) float64 {\n    return float64(x)\n})\n```\n\n\
    这种变通方法需要一个回调函数，这使得代码冗长且效率低得多，尽管我承认它有更多的使用场景。\n"
