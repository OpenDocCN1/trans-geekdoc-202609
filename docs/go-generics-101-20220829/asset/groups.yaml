    \    Stop()\n    Step() error\n    Pause()\n    Resume()\n    ~map[int]bool\n\
    \    ~[]byte | string\n    string\n    int64 | ~chan int | any\n}\n```\n\n我们可以将单个类型字面量、类型名称或波浪线形式视为只有一个项的项联合。所以简单地说，自\
    \ Go 1.18 起，接口类型可以指定一些方法并嵌入一些项联合。\n\n没有任何嵌入元素的接口类型称为空接口。例如，预声明的 any 类型别名表示一个空接口类型。\n\
    \n### 5.2 类型集合和方法集合\n\n在 Go 1.18 之前，接口类型被定义为一个方法集合。自 Go 1.18 起，接口类型被定义为一个类型集合。类型集合只包含非接口类型。\n\
    \n- 非接口类型字面量或类型名称的类型集合只包含该类型字面量或类型名称所表示的类型。\n- 如上文所述，波浪线形式 ~T 的类型集合是那些底层类型为 T\
    \ 的类型组成的集合。理论上，这是一个无限集合。\n- 方法规范的类型集合是那些方法集合中包含该方法的非接口类型的集合。理论上，这是一个无限集合。\n- 空接口的类型集合是所有非接口类型的集合。理论上，这是一个无限集合。\n\
    - 项联合 T1 | T2 | ... | Tn 的类型集合是各项类型集合的并集。\n- 非空接口的类型集合是其接口元素类型集合的交集。\n\n由于空接口类型（例如预声明的\
    \ any）的类型集合包含所有非接口类型，所以类型 S 的类型集合是空的。上面代码片段中所示的类型 S 的接口类型和底层类型实际上是相同的。\n\n```go\n\
    interface {~string; string; M();}\ninterface {~string; string; M()}\ninterface\
    \ {\n    ~string\n    string\n    M()\n}\n```\n\n如果某个类型 X 的类型集合是接口类型 Y 的子集，我们就说\
    \ X 实现了（或满足）Y。这里，X 可以是接口类型或非接口类型。\n\n因为空接口类型的类型集合是任何类型集合的超集，所以所有类型都实现空接口类型。\n\n\
    在上面的例子中，\n\n- 接口类型 S 的类型集合为空，它实现了所有接口类型。\n- 所有类型都实现接口类型 Z，这实际上是一个空接口类型。\n\n接口类型指定的方法列表称为该接口类型的方法集合。如果接口类型\
    \ X 实现了另一个接口类型 Y，那么 X 的方法集合必须是 Y 的超集。\n\n如果一个接口类型的类型集合可以完全由一个（可能为空的）方法集合定义，则该接口类型称为基本接口类型。在\
    \ 1.18 之前，Go 只支持基本接口类型。基本接口既可以用作值类型，也可以用作类型约束；但非基本接口只能用作类型约束（截至 Go 1.19）。\n\n\
    在上面的例子中，L、M、U、Z 和 any 都是基本接口类型。\n\n在下面的代码中，x 和 y 的声明行都可以编译通过，但声明 z 的那一行无法编译。\n\
    \n```go\nvar x any\nvar y interface {M()}\n\n// error: interface contains type\
    \ constraints\nvar z interface {~[]byte}\n```\n\n未来 Go 版本是否会支持将非基本接口类型用作值类型，目前还不清楚。\n\
    \n注意，在 Go 工具链 1.19 之前，不支持非基本接口类型的别名。以下类型别名声明自 Go 工具链 1.19 起才合法。\n\n```go\ntype\
    \ C[T any] interface{~int; M() T}\ntype C1 = C[bool]\ntype C2 = comparable\ntype\
    \ C3 = interface {~[]byte | ~string}\n```\n\n### 5.3 关于预声明的 comparable 约束的更多内容\n\
    \n如前所述，除了 any，Go 1.18 还引入了另一个新的预声明标识符 comparable，它表示一个由所有可比较类型实现的接口类型。\n\n```go\n\
    type G[S ~[]E, E int] struct{}\n```\n\n请注意，\n\n- 正如上一节提到的，尽管 E 是一个类型参数类型，[]E 仍然是一个普通（切片）类型。\n\
    - S 的底层类型是 interface{~[]E}，而不是 []E。\n- E 的底层类型是 interface{int}，而不是 int。\n\n按照\
    \ Go 规范，以下代码中的函数和方法声明都无法编译通过。\n\n```go\ntype C any\nfunc foo1[C C]() {}    //\
    \ error: C redeclared\nfunc foo2[T C](T T) {} // error: T redeclared\n```\n\n\
    ```go\ntype G[G any] struct{x G} // okay\nfunc (E G[E]) Bar1() {}    // error:\
    \ E redeclared\n```\n\n下面的 Bar2 方法声明本应可以编译通过，但当前（Go 工具链 1.19）不能。这是一个将在 Go 工具链\
    \ 1.20 中修复的 bug。\n\n```go\ntype G[G any] struct{x G} // okay\nfunc (v G[G]) Bar2()\
    \ {}    // error: G is not a generic type\n```\n\n### 5.10 更多关于泛型类型和函数声明的说明\n\n\
    在上一章中，我们已经见过了泛型类型声明和一些泛型函数声明。与普通类型和函数声明不同，每个泛型声明都有一个类型参数列表部分。\n\n本书不打算进一步讨论泛型类型和函数声明的语法。\n\
    \n泛型类型声明的源类型部分必须是普通类型。因此它可能是\n\n- 复合类型字面量。如上所述，复合类型字面量总是表示普通类型。\n- 表示普通类型的类型名称。\n\
    - 实例化类型。类型实例化将在下一章中详细解释。目前，我们只需要知道每个实例化类型都是命名普通类型。\n\n下面的代码展示了一些具有各种源类型的泛型类型声明。所有这些声明都是有效的。\n\
    \n```go\n// The source types are ordinary type names.\ntype (\n    Fake1[T any]\
    \ int\n    Fake2[_ any] []bool\n)\n```\n\n```go\n// The source type is an unnamed\
    \ type (composite type).\ntype MyData [A any, B ~bool, C comparable] struct {\n\
    \    x A\n    y B\n    z C\n}\n```\n\n## 第6章 泛型实例化和类型实参推断\n\n在最后两章中，我们已经使用了几处泛型类型和函数的实例化。本章将对实例化类型和函数作正式介绍。\n\
    \n### 6.1 泛型类型/函数实例化\n\n泛型类型必须被实例化后才能用作值的类型，泛型函数必须被实例化后才能被调用或用作函数值。\n\n通过用类型实参列表替换其声明（规范）中的类型参数列表，泛型函数（类型）即被实例化。（完整）类型实参列表的长度与类型参数列表相同。每个类型实参被传递给对应的类型参数。类型实参必须是非接口类型或基本接口类型，并且只有当它满足（实现）其对应类型参数的约束时才有效。\n\
    \n实例化函数是非泛型函数。实例化类型是命名的普通值类型。\n\n与类型参数列表一样，类型实参列表也括在方括号中，类型实参在类型实参列表中也是用逗号分隔的。类型实参列表的逗号插入规则也与类型参数列表相同。\n\
    \n如果两个类型实参列表的长度相等，并且它们所有对应的类型都相同，则这两个类型实参列表是相同的。如果两个实例化类型是从同一个泛型类型并以相同的类型实参列表实例化出来的，则它们是相同的。\n\
    \n在下面的程序中，泛型类型 Data 被实例化了四次。四个实例化中有三个具有相同的类型实参列表（请注意，预声明的 byte 是预声明的 uint8 类型的别名）。因此，变量\
    \ x 的类型、别名 Z 所表示的类型以及定义类型 W 的底层类型是相同的类型。\n\n```go\npackage main\n\nimport (\n\
    \    \"fmt\"\n    \"reflect\"\n)\n```\n\n"
