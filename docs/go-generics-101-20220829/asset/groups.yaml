    \ 和 [bool] 被称为类型实参列表。在这些列表中，string、int 和 bool 被称为类型实参，它们都被传递给类型参数 V。\n\n如果所有类型实参都可以从值实参中推断出来，那么在实例化函数表达式中可以完全省略整个类型实参列表。这就是为什么在上面的示例中，对\
    \ NoDiff 泛型函数的一些调用没有类型实参列表的原因。\n\n- 在调用 NoDiff(\"Go\", \"Go\", \"Go\") 中，类型实参被推断为\
