  md: "```\nfunc F14[T S1 | S4](v T) {\n    _ = v.X // error: v.x undefined\n}\n\n\
    func main() {}\n```\n\nThere is a proposal to remove this limit. A temporary (quite\
    \ verbose) workaround is to specify/declare some getter and setter methods for\
    \ involved constraints and concrete types.\n\n# 8.7 Fields of values of type parameters\
    \ are not accessible\n\nCurrently (Go 1.19), even if a type parameter has a core\
    \ struct type, the fields of the core struct type still may not be accessed through\
    \ values of the type parameter. For example, the following code doesn’t compile.\n\
    \n```\ntype S struct{x, y, z int}\n```\n\n```\nfunc mod[T S](v *T) {\n    v.x\
    \ = 1 // error: v.x undefined\n}\n```\n\nThe restriction mentioned in the last\
    \ section is actually a special case of the one described in the current section.\n\
    \nThe restriction (described in the current section) was added just before Go\
    \ 1.18 is released. It might be removed since a future Go version.\n\n# 8.8 Type\
    \ switches on values of type parameters are not supported now\n\nIt has been mentioned\
    \ that a type parameter is an interface type from semantic view. On the other\
    \ hand, a type parameter has wave-particle duality. For some situations, it acts\
    \ as the types in its type set.\n\nUp to now (Go 1.19), values of type parameters\
    \ may not be asserted. The following two functions both fail to compile.\n\n```\n\
    func tab[T any](x T) {\n    if n, ok := x.(int); ok { // error\n        _ = n\n\
    \    }\n}\n```\n\n```\nfunc kol[T any]() {\n    var x T\n    switch x.(type) {\
    \ // error\n    case int:\n    case []bool:\n    default:\n    }\n}\n```\n\nThe\
    \ following modified versions of the above two functions compile okay:"
