  md: "```\nfunc MyNew[T any]() *T {\n    var t T\n    return &t\n}\n```\n\n# 7.14\
    \ A call to the predeclared make function requires its first argument (the container\
    \ type) has a core type\n\nCurrently (Go 1.19), in the following code snippet,\
    \ the functions voc and ted both fail to compile, the other two compile okay.\
    \ The reason is the first argument of a call to the predeclared make function\
    \ is required to have a core type. Neither of the voc and ted functions satisfies\
    \ this requirement, whereas both of the other two functions satisfy this requirement.\n\
    \n```\nfunc voc[T chan bool | chan int]() {\n    _ = make(T) // error: invalid\
    \ argument: no core type\n}\n```\n\n```\nfunc ted[T chan<- int | <-chan int]()\
    \ {\n    _ = make(T) // error: invalid argument: no core type\n}\n```\n\n```\n\
    type Stream chan int\ntype Queue Stream\n```\n\n```\nfunc fat[T Stream | chan\
    \ int | Queue | chan<- int]() {\n    _ = make(T) // okay\n}\n```\n\n```\nfunc\
    \ nub[T Stream | chan int | Queue | <-chan int]() {\n    _ = make(T) // okay\n\
    }\n```\n\nBy my understanding, this requirement is in order to make subsequent\
    \ operations on the made containers (they are channels in the above example) always\
    \ legal. For example, to make sure a value received from the made channel has\
    \ a specified type (either a type parameter, or an ordinary type).\n\nPersonally,\
    \ I think the requirement is over strict. After all, for some cases, the supposed\
    \ subsequent operations don’t happen.\n\nTo use values of a type parameter which\
    \ doesn’t have a core type within a generic function, we can pass such values\
    \ as value arguments into the function, as the following code shows.\n\n```\n\
    func doSomething(any) {}\n```\n\n```\nfunc voc2[T chan bool | chan int](x T) {\n\
    \    doSomething(x)\n}\n```\n\n```\nfunc ted2[T chan<- int | <-chan int](x T)\
    \ {\n    doSomething(x)\n}\n```\n\nBecause of the same requirement, neither of\
    \ the following two functions compile."
