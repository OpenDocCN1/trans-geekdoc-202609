  md: "```\ntype Getter[T any] interface {\n    Get() T\n}\n\ntype Age[T uint8 | int16]\
    \ struct {\n    n T\n}\n\nfunc (a Age[T]) Get() T {\n    return a.n\n}\n\nfunc\
    \ doSomething[T any](g Getter[T]) T {\n    return g.Get()\n}\n\n// The two lines\
    \ fail to compile.\nvar z = doSomething(Age[uint8]{255}) // error\nvar w = doSomething(Age[int16]{256})\
    \ // error\n\n// The two lines compile okay.\nvar x = doSomething[uint8](Age[uint8]{255})\n\
    var y = doSomething[int16](Age[int16]{256})\n```\n\n# 6.4 Pass basic interface\
    \ types as type arguments\n\nThe above has mentioned that a basic interface type\
    \ may be used as a type argument and passed to a type parameter if the basic interface\
    \ type satisfies (implements) the constraint of the type parameter. The following\
    \ code shows such an example.\n\n```\npackage main\n\ntype Base[T any] []T\n\n\
    type _ Base[any]\ntype _ Base[error]\n\nfunc Gf[T any](x T) {}\n\nvar _ = Gf[any]\n\
    var _ = Gf[error]\n\nfunc main() {\n    Gf[any](123)\n    Gf[any](true)\n    Gf[error](nil)\n\
    }\n```"
