  md: "# 7.18 About constraints with empty type sets\n\nThe type sets of some interface\
    \ types might be empty. An empty-type-set interface type implements any interface\
    \ types, including itself.\n\nEmpty-type-set interface types are totally useless\
    \ in practice, but they might affect the implementation perfection from theory\
    \ view.\n\nThere are really several imperfections in the implementation of the\
    \ current official standard Go compiler (v1.19).\n\nFor example, should the following\
    \ function compile? It does with the latest official standard Go compiler (v1.19).\
    \ However, one of the above sections has mentioned that a make call requires its\
    \ argument must have a core type. The type set of the constraint C declared in\
    \ the following code is empty, so it has not a core type, then the make call within\
    \ the foo function should not compile.\n\n```\n// This is an empty-type-set interface\
    \ type.\ntype C interface {\n    map[int]int\n    M()\n}\n\nfunc foo[T C] () {\n\
    \    var _ = make(T)\n}\n```\n\nThis following is another example, in which all\
    \ the function calls in the function g should compile okay. However, two of them\
    \ fail to compile with the latest official standard Go compiler (v1.19).\n\n```\n\
    func f1[T any](x T) {}\nfunc f2[T comparable](x T) {}\nfunc f3[T []int](x T) {}\n\
    func f4[T int](x T) {}\n```\n\n```\n// This is an empty-type-set interface type.\n\
    type C interface {\n    []int\n    m()\n}\n\nfunc g[V C](v V) {\n    f1(v) //\
    \ okay\n    f2(v) // error: V does not implement comparable\n    f3(v) // okay\n\
    \    f4(v) // error: V does not implement int\n}\n```\n\nThe current Go specification\
    \ specially states:\n\n> Implementation restriction: A compiler need not report\
    \ an error if an operand’s type is a type parameter with an empty type set. Functions\
    \ with such type parameters cannot be instantiated; any attempt will lead to an\
    \ error at the instantiation site.\n\nSo the above shown imperfections are not\
    \ bugs of the official standard Go compiler."
