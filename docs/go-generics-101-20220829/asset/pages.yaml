    \ an empty interface type.\n\nIn the above example,\n\n+   - the interface type\
    \ S, whose type set is empty, implements all interface types.\n+   - all types\
    \ implement the interface type Z, which is actually a blank interface type.\n\n\
    The list of methods specified by an interface type is called the method set of\
    \ the interface type. If an interface type X implements another interface type\
    \ Y, then the method set of X must be a super set of Y.\n\nInterface types whose\
    \ type sets can be defined entirely by a method set (may be empty) are called\
    \ basic interface types. Before 1.18, Go only supports basic interface types.\
    \ Basic interfaces may be used as either value types or type constraints, but\
    \ non-basic interfaces may only be used as type constraints (as of Go 1.19).\n\
    \nIn the above examples, L, M, U, Z and any are basic types.\n\nIn the following\
