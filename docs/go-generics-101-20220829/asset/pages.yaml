    \ elements is called an empty interface. For example, the predeclared any type\
    \ alias denotes an empty interface type.\n\n# 5.2 Type sets and method sets\n\n\
    Before Go 1.18, an interface type is defined as a method set. Since Go 1.18, an\
    \ interface type is defined as a type set. A type set only consists of non-interface\
    \ types.\n\n+   - The type set of a non-interface type literal or type name only\
    \ contains the type denoted by the type literal or type name.\n+   - As just mentioned\
    \ above, the type set of a tilde form ~T is the set of types whose underlying\
    \ types are T. In theory, this is an infinite set.\n+   - The type set of a method\
    \ specification is the set of non-interface types whose method sets include the\
    \ method specification. In theory, this is an infinite set.\n+   - The type set\
    \ of an empty interface is the set of all non-interface types. In theory, this\
    \ is an infinite set.\n+   - The type set of a union of terms T1 | T2 | . . .\
    \ | Tn is the union of the type sets of the terms.\n+   - The type set of a non-empty\
    \ interface is the intersection of the type sets of its interface elements.\n\n\
