    AIDR 系统收集。17 场灾害事件包括洪水、地震、火灾、飓风和武装冲突。通用集合包含了与自然灾害、人为引起的灾害和安全事件相关的关键词。我们为这些集合创建了图像。收集图像时，我们根据推文
    ID 移除重复。然后使用 [13] 中讨论的方法移除近重复。从这些图像中，我们收集了约 3K 张用于标注。这些图像的标注分两个步骤完成：首先，将一组图像标记为地震、火灾、飓风。


    然后我们收集了约 2200 张样本，在之前的步骤中被标记为非这些类别的其他灾害。选择此类图像的原因是资源有限。


    对于滑坡类别，我们从 Google、Bing 和 Flick 爬取了关键词滑坡、可能的滑坡、落石、滑坡坍塌。由于我们从不同来源收集图像，导致了重复。为了考虑到这一点，我们使用了相同的重复过滤来移除精确重复和近重复。其余图像被手动标记为滑坡和非滑坡。


    ![](img/e85732435c057d7a97129af2641aa95f_3_0.png)


    (1) 地震：显示损坏或被毁的建筑物、断裂的房屋、线路线、机场、公路和火灾；

    (2) 火灾：显示人为火灾或野火（森林、草地和被毁）、损坏的森林、房屋或基础设施。

    (3) 洪水：显示被淹的地区、道路、房屋和其他基础设施。

    (4) 飓风：显示强风、风暴潮、暴雨、倒塌的电线杆、电网和树；

    (5) 滑坡：显示滑坡、泥石流、滑坡和土地坍塌。

    (6) 其他灾害：显示任何其他灾害类型，如飞机坠毁、汽车事故、爆炸和冲突。

    (7) 非灾害：显示卡通、广告或无法与任何灾害类型相关的物品。


    对于数据集任务，我们使用了灾害类型定义：通过调查给定测试集中的每个图像以及对应集合中已识别的图像来识别重复项：


    ![](img/e85732435c057d7a97129af2641aa95f_3_1.png)


    图 3：AIDR 数据集中不同灾害事件和集合中标记的灾害类型数量。


    ![](img/e85732435c057d7a97129af2641aa95f_3_2.png)


    在图 4 中，我们报告了通用集合中标记为“信息化”和“非信息化”的图像分布。


    - A) AIDR 信息化数据集 (AIDR-Info)：对于此数据集，我们使用 AIDR 系统收集了图像。我们使用相同的重复过滤来移除重复。然后我们用两个类别标签标记了
    9,930 张图像：信息化 vs 非信息。


    ![](img/e85732435c057d7a97129af2641aa95f_3_3.png)

    图 4：AIDR-info 数据集中不同灾害事件和集合中信息 vs 非信息的图像数量。


    - B) 损害多模态数据集 (DMD)：多模态数据集由从 Google 和 Instagram 收集的 5,887 张图像组成。标记的数据集由六类标签组成，例如：火灾、洪水、自然、基础设施和非灾害。对于此，我们使用了相同的重复过滤来移除精确重复和近重复。其余图像被手动标记为。


    ## B. 标注


    标注由领域专家完成，确保了新数据集和重新标记数据集的标注质量。定义改编自 [5]。


    ## C. 数据划分


    在汇总数据集之前，我们将每个数据集分别分为训练集、开发集和测试集，比例为 70:10:20。目的有三：(i) 在每个任务上训练和评估单个数据集；(ii) 使每个数据集到合并数据集中的分布保持接近；(iii)
    为研究社区提供独立使用划分结果的机会。数据划分后，我们识别重复图像（见 IV-D）并将它们移动到训练集以创建一个不重叠集。


    ## D. 重复识别


    为了开发机器学习模型，开发不重叠的训练集和测试集至关重要。通常做法是将数据集随机划分为训练集和测试集。这种方法会导致与社交媒体重叠的训练-测试划分。对于训练和测试集中的精确或近重复图像
    [13]，我们识别重复项。由于它们已经过标注，我们不想从数据集中移除任何图像。动机是训练中存在精确和近重复图像会在训练集中产生自然的混淆。为了识别重复图像，我们训练模型寻找测试集中最近的图像。我们首先使用预训练的重复学习模型提取特征。然后，我们使用最近邻
    [7] 利用相应数据集的训练集来训练模型。对于 CrisisMMD 的信息化数据集，我们使用训练集训练模型，然后用它识别测试集中每个图像的图像。


    接下来，我们通过调查给定测试集中的每个图像以及四个任务和十二个数据集对应集合中识别出的图像来识别重复项。我们在测试集中识别了 5593 个精确和近重复图像。然后我们将识别出的图像移动到训练集，使用近似阈值自动识别重复图像，以创建干净的测试集。在图
    5 中，我们展示了精确和近重复图像的欧几里得距离量的直方图。


    ![](img/e85732435c057d7a97129af2641aa95f_4_0.png)


    图 5：不同距离桶中的重复数量。


    2.6 是自动重复检测的合理选择。从检测中发现也有更高阈值的重复图像；但与此相比数量非常小。同时注意，较高的数值会导致误报率增加。使用 ≤ 2.6 的阈值，我们自动识别测试集中的重复图像并将其移动到训练集。


    ## E. 数据合并


    原因之一是为了进行数据合并以开发具有大量数据的深度学习模型。为了这一目的，我们将所有训练、开发和测试集合并到汇总数据集中。合并多个数据集可能会导致训练和测试集中出现重复图像，合并后我们重复重复识别过程以为不同任务创建不重叠集。


    ## F. 数据统计


    表 I、II、III、IV 和 V 显示了测试集中所有重复的标签分布。表中报告了每个数据集的数量。某些类别被标记为重复集合。例如，在灾害任务（表 I）中，AIDR
    数据集的“其他灾害”分布较低，而 DMD 数据集的“滑坡”分布较低。对于信息化任务，观察到“信息化”标签的分布较低。对于人道主义任务，我们在 CrisisMMD
    和 DMD 数据集的损害严重程度任务“轻微”中救援志愿者或捐赠的分布较低。然而，如表 V 所示，汇总数据集在不同任务的类别之间创建了公平的平衡。


