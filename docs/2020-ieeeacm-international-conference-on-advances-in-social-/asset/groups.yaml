    # A. Experimental Setup


    We employ the transfer learning to perform experiments, which has shown results
    for visual recognition tasks [19]–22]. The goal of transfer learning is to use
    weights of a pre-trained model. For this study, we used several neural networks
    using the PyTorch library. The architectures include ResNet18, ResNet50, ResNet101,
    AlexNet [28], VGG16 [29], DenseNet[30], SqueezingNet[31], Inception[33], MobileNet[32],
    MobileNet[34].


    We use the weights of the training networks using ImageNet [64]. We adapt the
    last layer of the network according to the classification task (i.e., softmax
    layer) instead of the original 1000-way classification. The transfer learning
    allows us to transfer the features and parameters of the network from a domain
    with large-scale specifications to the target domain, in four different classification
    tasks.


    We designed the binary classifier for informativeness task and multiclass classifiers
    for other tasks.


    To measure the performance of each classifier, we use the precision (P), recall
    (R), and F1-measure (F1). We only report F1-measure due to limited sample.


    # B. Datasets Comparison


    To determine whether collected data achieves better performance, we train the
    models using sets from:


    > https://pytorch.org/


    # C. Network Architectures


    Currently available networks have different computational complexity. One of our
    goals is to deploy the models in real-time applications, we exploit them to understand
    their performance differences. Another motivation is that current literature is
    limited in focus to reports using one or two network architectures (e.g., VGG16
    [16], Inception[4]), which we want to extend in this study.


