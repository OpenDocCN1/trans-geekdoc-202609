    由于数据划分的差异以及图像重复的问题，无法与之前的先进技术进行比较。在信息量和人道主义任务上，使用五折交叉验证 [16] 报告的加权 (F1) 分别为 83.2
    和 76.3。在针对使用五折验证的数据集进行的规模任务准确率测试中，报告的准确率为 3.59±1.72。使用 CRISM 数据集，作者报告的人道主义任务加权
    F1 分别为 82.2 和 66.6。我们在他们的研究中使用整个 CRISM 数据集的一个小子子集。由于数据划分的不同，我们的数据集和划分不进行直接比较。然而，我们提供了一个标准框架，供未来研究比较。


    ## VII. 结论


    社交媒体上的图像包含供人道主义组织的信息。与开发深度学习模型的有限研究相比，灾害响应分类任务的工作非常有限。我们为灾害分类任务提供了新的数据集，并提供了一个构建的数据集。这包含了重复项和非重叠划分。我们处理了四种不同类型的任务，包括损害程度。这些数据集具有独特的特征，可以转换为多标签，以及用于开发新算法的学习任务。我们也旨在在未来解决这个问题。此外，我们开发了先进的深度架构，以在数据集上提供基准结果。


