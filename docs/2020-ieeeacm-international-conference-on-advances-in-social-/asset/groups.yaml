    # 用于灾害响应社交媒体在线分类的深度学习基准与数据集


    Ferojam Alam¹, Ferda Ofli¹, Muhammad Imran¹, Tanvirul Alam², Umair Qazi¹

    ¹卡塔尔计算研究院，HBKU， 多哈，卡塔尔

    ²JIT Limited, 孟买，孟加拉

    †{fiamlam, ofli, imranuq}@hbku.edu.qa,tanvir2.alam@gmail.com


    **摘要—** 社交媒体上分享的灾害事件有助于管理者获取态势感知并评估伤亡损失等其他响应任务。计算机视觉和自然语言处理的最新进展已为灾害响应任务提供了数据集支持，包括检测危机、过滤无关图像、图像分类以及评估损害的严重性。灾害事件数据集通常是不完整的，且只有部分（已标记）可用，用以训练更稳健的深度学习模型。在这项研究中，我们为灾害类型分类和严重性评估提出了新的数据集。我们对之前的可用数据集重新应用于新任务。通过使用不重叠的数据集，我们终于对最先进的深度学习模型进行了基准测试，并取得了令人鼓舞的结果。我们发布了我们的数据集和模型，为提供更好的基准以及进一步的研究提供支持。


    **索引术—** 深度学习、灾害图像分类、自然灾害、社交媒体、基准测试


    引言内容（全面综述请参见 [1], [2]）。尽管许多研究工作表明，灾害事件期间在社交媒体上分享的图像可以以多种方式帮助人道主义组织。例如，用于评估基础设施和损害严重程度的图像
    [4] 侧重于识别基础设施的损害以及各种环境因素。


    目前可用于开发灾害响应任务分类的数据集包括用于损害评估 [5]、CrisisMD [6] 以及多模态损害识别任务 [7]。这些数据集中的注释标签包含了不同的分类任务，如
    (i) 灾害类型、(ii) 人道主义影响和 (iii) 损害严重性评估。在研究这些数据集后，我们发现了几点局限性：


    - 当独立考虑时，与社交媒体平台产生的海量数据（例如 Twitter 和 MS COCO [7]）相比，这些数据集相当较小，导致无法开发用于现实应用的稳健数据集，

    - (ii) 它们包含精确和近乎重复的样本，由于随机的训练和测试划分，会导致误导性的性能评分

    - (iii) 不同研究中使用了不一致的训练-测试划分，这使得很难比较不同工作之间的结果。过去几年中，图像处理的新网络架构也取得了显著进展；然而，它们在灾害响应任务的信息学¹背景下尚未被广泛探索。


    为了解决这些局限性，我们在本研究中的贡献如下：


    - 我们开发了灾害类型和有效性数据集，这对研究社区来说是全新的。

    - 我们发布了用于新任务的现有数据集，显著减少了数据收集、清洗和标注的工作。我们确认了适用于不同任务的最大数据集。

    - 我们将每个数据集分为训练集、开发集和测试集，并通过消除测试和训练划分中的精确和近乎重复的图像，创建不重叠的测试集。


    # I. 引言


    过去几年，该领域的研究发生了激增。重点是分析社交媒体数据的有用性，并利用不同的模态开发计算模型以提取可操作的信息。在不同的模态（例如文本和图像）中，与社交媒体相比，文本内容分析得到了更多关注。社交媒体在自然或人为灾害期间被广泛使用，作为快速传播信息和获取有用见解的来源。人们在社交媒体上发布事件（通过文本、图像和视频等不同方法）以帮助和支持、识别需求或分享个人感受。如果内容质量高，信息就是有用的；如果我们有实时系统自动处理社交媒体内容以促进快速


    > https://en.wikipedia.org/wiki/Disaster_informatics


    我们将来自不同来源的所有特定任务的数据集整合到一个集合中用于不同的任务。


    - 我们使用各种最先进的网络架构，为四个任务提供了基准结果，分别以单独或组合数据集的形式给出。这些结果为图像分类任务的危机信息学确立了新的基准。最后，我们将公开带有划分的数据集。


    论文的其余部分组织结构如下：第二节简要概述了现有工作。第三节介绍了本研究中使用的数据集。第四节描述了为本研究准备的数据。第五节解释了……，而第六节介绍了结果和讨论。我们在第七节总结了论文。


    # II. 相关工作


    与分析人道主义援助文本内容相比，危机信息学中关于图像处理的研究很少。随着深度学习在图像分类领域的近期成功，研究必须必须利用社交媒体图像进行人道主义援助。社交媒体上灾害的图像内容已在许多研究中得到过
    [3], [8]–[13]。例如，[8] 中研究了对洪水的分析，作者报告了洪水和地震期间存在带有社交媒体内容的图像。显示带有地理标记信息的图像对于定位受影响区域很有用。


    最近对社交媒体上分享的内容分析已使用深度学习技术进行了探索，用于灾害管理。这些研究大多数对危机期间的损害严重性进行分类 [3], [11]，而其他研究则将严重性量化为连续值索引
    [14], [15]。最近提出了一种从危机期间社交媒体图像中提取意义信息的图像处理流程，该流程是使用基于深度学习的技术开发的。他们的方法包括过滤图像，最后根据严重性对其进行分类。Mouznar
    等人 [4] 研究了一个多模态数据集，该数据集已用于训练损害检测模型。同样，[16] 显示带有地理标记信息的图像对于定位受影响区域很有用。


    目前用于开发灾害响应任务分类的数据集包括用于损害评估 [5]、CrisisMD [6] 以及多模态损害识别任务 [7]。这些数据集中的注释标签包含了不同的分类任务，如
    (i) 灾害类型、(ii) 人道主义影响和 (iii) 损害严重性评估。在研究这些数据集后，我们发现了几点局限性：


    - 当独立考虑时，与社交媒体平台产生的海量数据（例如 Twitter 和 MS COCO [7]）相比，这些数据集相当较小，导致无法开发用于现实应用的稳健数据集，

