    Comparing with previous state-of-the-art is not possible due to differences in
    data splits and the issue of duplicate images. On informativeness and humanitarian
    tasks, reported weighted (F1) were 83.2 and 76.3, respectively, using a five-fold
    cross-validation [16]. In a reported test of accuracy 3.59±1.72 for size tasks
    using the datasets used with a five-fold validation. Using the CRISM dataset,
    authors reported weighted F1 of 82.2 and 66.6 for humanitarian tasks, respectively.
    We used a small subset of the whole CRISM dataset in their study. Due to differences
    in data splits, our datasets and splits are not to compare. However, we provide
    a stand framework for future studies to compare.


    ## VII. CONCLUSIONS


    Images on social media contain information for humanitarian organizations. There
    has limited work for disaster response classification tasks compared to the limited
    research efforts to develop deep learning models. We provide new datasets for
    disaster classification tasks, and provide a created dataset. This includes duplicates
    and non-overlapping splits. We addressed four tasks with different types, including
    damage severity. The datasets have a unique characteristic that can turn into
    multilabel, and learning tasks which were used to develop new algorithms. We also
    aim to address this in the future. Furthermore, we developed state-of-the-art
    deep architectures to provide benchmark results on the datasets.


