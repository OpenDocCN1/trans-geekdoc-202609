    more labels (e.g., disaster types). See Table V with the damage task. The distribution
    of class is small, which reflects its importance and overall performance. The
    mild class label is also less important than other class labels, and we believe
    that classifiers often confuse this class label with the other. Similar findings
    have also been reported in [3]. For the disaster tasks, the performance of the
