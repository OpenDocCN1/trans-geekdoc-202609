  md: '# Deep Learning Benchmarks and Datasets for Social Media Online Classification
    for Disaster Response


    Ferojam Alam¹, Ferda Ofli¹, Muhammad Imran¹, Tanvirul Alam², Umair Qazi¹

    ¹Qatar Computing Institute, HBKU, Doha, Qatar

    ²JIT Limited, Dhaka, Bangladesh

    †{fiamlam, ofli, imranuq}@hbku.edu.qa,tanvir2.alam@gmail.com


    **Abstract—**A disaster event, shared on social media helps managers gain situational
    awareness and assess injured damages, among other response tasks. Recent advances
    in computer vision and natural language processing have made datasets for disaster
    response tasks, including detecting crises, filtering irrelevant images, classifying
    images and assessing the severity of damage. Disaster event datasets are often
    incomplete and partially (labeled) available to train more robust deep learning
    models. In this study, we propose new datasets for disaster type classification
    and severity assessment. We relive previously available datasets for new tasks.
    By using non-overlapping datasets we finally benchmark state-of-the-art deep learning
    models and achieve promising results. We release our datasets and models, providing
    to power better baselines as well as to further research.


    **Index Terms—**Deep learning, Disaster Image Classification, Natural disasters,
    Social media, Benchmarking


    content (see [1], [2] for a comprehensive survey). Though many research works
    have demonstrated that images shared on social media during a disaster event can
    help humanitarian organizations in a number of ways. For example, images used
    to assess the severity of the infrastructure and damage [4] focuses on identifying
    damages in infrastructure as well as various environmental elements.


    Currently available datasets for developing classification for disaster response
    tasks such as damage assessment [5], CrisisMD [6], and multimodal damage identification
    tasks [7]. The annotated labels in these datasets include different classification
    tasks such as (i) disaster types, (ii) humanitarian impact, and (iii) damage severity
    assessment. Upon studying these datasets, we have several limitations:


    • when considered independently, these datasets are fairly small in contrast to
    the massive volume of data generated on social media platforms (e.g., Twitter
    and MS COCO [7]), which enables development of robust datasets for real-world
    applications, (ii) they contain exact and near-duplicates, thus providing misleading
    performance scores due to the random train and test splits (iii) inconsistent
    train-test splits have been used in different studies, which make it difficult
    to compare the results across different works. There has also been significant
    progress in new network architecture for image processing in the past few years;
    however, they have not been widely explored in the context of informatics¹ for
    disaster response tasks.


    To address limitations, our contributions in this study are as follows:


    +   • We developed disaster types and effectiveness datasets, which are completely
    new for the research community.

    • We released existing datasets for the new tasks so that it significantly reduces
    the data collection, cleaning, and annotation efforts. We confirm the largest
    datasets available for different tasks.

    • We divided each dataset into train, dev and test and created a non-overlapping
    test set by eliminating exact and near-duplicate images within the test and train
    splits.


