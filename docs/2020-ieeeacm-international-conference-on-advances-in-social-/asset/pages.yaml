    # D. Damage severity


    Assessing the severity of the damage is important to help the affected community
    during disaster events. The severity of damage can be assessed based on the physical
    destruction to a built-structure in (e.g., destruction of bridges, roads, buildings,
    and forests). Following the work reported in [3], we use the categories for classification
    as (i) severe damage, (ii) mild damage, and (iii) little or none.


    Figure 2 shows an example image that illustrates annotations for all four tasks.


    # IV. DATA PREPARATION


    # A. Datasets


    For this study, we used public and in-house labeled datasets. Below, we provide
    the details of each dataset.


    +   1) Damage Assessment Dataset (DAD): The assessment dataset data with labeled
    image data severity levels as severe, mild, and little-to-damage damage [3]. The
    images have been collected from two sources: AIDR [24] and Flickr. Craw used the
    following keywords: building damage, bridge, and damage road. The images from
    AIDR were collected from Twitter during different disaster events such as Typhoon
    Ruby, Nepal Earthquake, Ukraine Earthquake. The dataset is annotated by paid-workers
    as volunteers. We use this for informativeness and damage tasks. For the informativeness
    task, we map and severe images into informative class and manually sift through
    the little-to-damage images to separate them into informative and not categories.
    For the severe damage, we use label little-to-damage to to align with other tasks.

    2) CrisisMD: This is a multiple-(image, text) and multi-task dataset, which consists
    of 18,082 images collected from diverse events dealt by the AIDR system. The data
    is annotated by working the Figure-Earth platform for different tasks: (i) informativeness
    with binary labels (informative vs. not), with seven class labels (ii. infrastructure
    and utility damage, rescue, volunteering, or donation effort, or found people,
    affected individuals, missing or relevant information and not relevant), (iii)
    damage assessment with these labels (iv, severe, mild or no damage).

    3) AIDR Dataset: For disaster type classification task, we annotated images with
    categories mentioned in Section III-A. We obtained tweets from 17 disaster events
    and 3 collections, all of which have been collected by the AIDR system. The 17
    disaster events include flood, earthquake, fire, hurricane, terrorist-attack,
    and armed-conflict. The tweets in general collections contains


