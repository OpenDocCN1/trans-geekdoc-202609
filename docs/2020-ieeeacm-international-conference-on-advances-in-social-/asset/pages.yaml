    # B. Discussions


    Achieving a better performance with learning models requires larger dataset sizes.
    To develop, the dataset sizes for disaster tasks are comparatively small. We address
    this by combining data from multiple sources and resources for new tasks. The
    proposed datasets consist of binary and multiple class labels and aggregated in
    binary and multi-class classification. We show that the model can be turned into
    multi-task settings, which we aim to address in a future.


    A significant challenge with social media is the exhaust and near-duplicate content.
    We address this issue, and for the proposal we have a mechanism to remove duplicates
    before the annotation process. Another approach is current duplicate detection
    is simple using deep learning frameworks. In our analysis, we use a procedure
    to determine a reasonable threshold for automatic detection. This requires further
    study, which we aim to do in the future.


    Real-time event detection is an important problem for social media content. Our
    new disaster tasks can help to develop models and deploy in real-time applications.
    We also explore several different layers, which vary by application. Applications
    that require high performance should not be prone to a bottleneck. Note that EfficientNet
