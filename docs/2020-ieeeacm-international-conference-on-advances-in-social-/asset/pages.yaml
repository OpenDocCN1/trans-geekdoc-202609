  md: '# B. Annotation


    The annotation has been done by domain experts and ensured the quality of the
    annotation for new datasets and relabeling datasets for new tasks. For the disaster
    type labeling, the annotators followed the definition discussed in IV-A and for
    other tasks, definitions and restrictions are adapted from [5].


    # C. Data Split


    Before collating the datasets we split each of them into train, dev and test sets
    with 70:10:20 ratio, respectively. The purpose was threefold: (i) train and evaluate
    individual datasets on each task, (ii) have a close-to distribution from each
    dataset into the consolidated dataset, and (iii) provide the research community
    an opportunity to use the splits independently. After data split, we identify
    duplicate images (see Section IV-D) and move them to the training set to create
    a non-overlapping set.


    # D. Duplicate Identification


    To develop a machine learning model, it is important to develop non-overlapping
    train and test sets. A common practice is to randomly split the dataset into train
    and test sets. This approach creates an overlapping train-test split with social
    media. For de exact- or near-duplicate images in train and test sets [13], we
    identify duplicates. Since they have already been labeled, we did not want to
    remove any image from dataset. We attempted to create a non-overlapping train,
    dev and test set motivation is that having exact and near-duplicate images in
    the training creates a natural confusion in the training set.


    To identify duplicate images, we train the model set to find the nearest images
    of the test set. We first extract features using a pre-trained duplicate learning
    model. Then, we use the Nearest Neighbor [7] to train the model with the training
    set of each respective dataset. For the informative dataset of CrisisMMD, we use
    the training set to train the model and then it is used to identify images for
    each image in the test set.


    Next, we identify duplicates by investigating each image from a given test set
    and the identified images from the corresponding set for four tasks and twelve
    different datasets. We identified 5593 exact and near-duplicate images in test
    sets. We then move the identified images to the training set to create clean test
    sets using an approximate threshold to automatically identify-duplicate images.
    In Figure 5, we present a histogram of Euclidean distance measures of the exact-
    and near-duplicate images. It shows the number of images in different bins. With
    our analysis, we realized a threshold of less than


    ![](img/e85732435c057d7a97129af2641aa95f_4_0.png)


    Fig. 5: Number of duplicates in different distance bins.


    equal 2.6 is a reasonable choice for automatic duplicate detection. From detection
    there are also duplicate images with higher thresholds; however, there is a very
    small number compared. Also noting that a higher number will lead to an increase
    in false positives. Using the threshold value of ≤ 2.6 we automatically identify
    duplicate images in the test set and move them to the training set.


    E. Data Consolidation:


    One of the reasons is to perform data consolidation to develop deep learning models
    with large amounts of data. For this purpose, we merge all train, dev and test
    sets into the consolidated dataset. By combining multiple datasets can result
    in duplicate images in train and test set, after merging we repeat the duplicate
    identification process to create non-overlapping sets for different tasks.


    # F. Data Statistics


    Tables I, II, III, IV and V show the label distribution of all duplicates for
    test sets. We report the number of images for each dataset in the tables. Some
    classes are labeled as duplicate sets. For example, in disaster tasks (Table I),
    the distribution of "other disaster" is low in AIDR-dataset, whereas the distribution
    of "landslide" is low in DMD dataset. For the informativeness task, low distribution
    is observed for the "informative" label. For the humanitarian task, we have low
    distribution for rescue volunteering or donation for the damage severity task
    "mild" in CrisisMMD and DMD dataset. However, the consolidated dataset creates
    a fair balance across classes for different tasks as shown in Table V.


    > *Note the pre-trained model is trained using ResNet18 architecture [26] on the
    damage assessment dataset [3].'
