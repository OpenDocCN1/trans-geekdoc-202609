    and calculate the outcome to generate predictions with the logistic regression
    model. Let’s take a look at an example to solidify this concept. Let’s assume
    there is a model that is capable of generating predictions if an individual is
    masculine or woman depending on fictitious values of their height. If the value
    of the height for an individual is set as `150 cm`, would the individual be predicted
    as a male or female? Assuming we have already discovered the values of coefficients
    `b0 = -100` and `b1 = 0.6`. By leveraging the above equation, the probability
    of male with a height of `150 cm` or `P(male|height=150)` can be easily calculated.
    The function `EXP()` will be used for `e` because if you log this instance into
    your spreadsheet, this is what you can use:


    ```

    y = e^(b0 + b1*X) / (1 + e^(b0 + b1*X))

    ```


    ```

    y = exp(-100 + 0.6*150) / (1 + EXP(-100 + 0.6*X))

    ```


    ```

    y = 0.0000453978687

    ```


    Or a near `0` probability male is the gender of that specific person. In theory,
    probability can simply be used. But since this is a classification algorithm and
    we want a sharp outcome, the probabilities can be tagged onto a binary class value.
    For instance, the model can predict `0` if `P(male) < 0.51` and predict `1` if
    `P(male) >= 0.5`. Now that you know how predictions can be generated using logistic
    regression, you can easily pre-process the training data set to get the most out
    of this technique. The assumptions made of the distribution and relations within
    the data set by the logistic regression technique are nearly identical to the
    assumptions made in the linear regression technique.


    A lot of research has been done to define these hypotheses and to use accurate
    probabilistic and statistical language. It is recommended to use these as thumb
    rules or directives and try with various processes for data preparation.


    The ultimate goal in predictive modeling machine learning initiatives is the generation
    of highly accurate predictions rather than analysis of the outcomes. Considering
    everything some assumptions could be broken if the designed model is stable and
    has high performance.


    Binary Output Variable

    This may be evident as we have already discussed it earlier, but logistic regression
    is designed specifically for issues with binary `two-class` classification. This
    will generate predictions for the probability of a default class instance that
    can be tagged into a classification of `0` or `1`.


    Remove Noise

    Logistic regression does not assume errors in the output variable `y`, therefore,
    the outliers and potentially misclassified cases should be removed from the training
    data set.


    Gaussian Distribution

    Logistic regression can be considered as a type of linear algorithm but with a
    non-linear transform on the output. A linear connection between the output and
    input variables is also assumed. Data transforms of the input variables may lead
    to a more accurate model with a higher capability of revealing the linear relationships
    of the data set. For instance, to better reveal these relationships, we could
    utilize `log`, `root`, `Box-Cox` and other single variable transformations.


    Remove Correlated Inputs

    If you have various highly correlated inputs, the model could potentially be over-fit
    similar to the linear regression technique. To address this issue, you can calculate
    the pairwise correlations between all input data points and remove the highly
    correlated inputs.


    Failure to converge

    It is likely for the expected likelihood estimation method that is trained on
    the coefficients to fail to converge. It could occur if the data set contains
    several highly correlated inputs or there is very limited data `e.g. loads of
    0 in the input data`.


    `Naïve Bayes classifier algorithm` is another classification learning algorithm
    with a wide variety of applications. It is a method of classification derived
    from the Bayes theorem, which assumes predictors are independent of one another.
    Simply put, a Naïve Bayes classifier assumes that all the features in a class
    are unrelated to the existence of any other feature in that class. For instance,
    if input data has an image of a fruit which is green, round, and about `10 inches`
    in diameter, the model can consider the input to be a watermelon. Although these
    attributes rely on one another or the presence of a specific feature, all of the
    characteristics contribute independently to the probability that the image of
    the fruit is that of a watermelon, hence it is referred to as Naive. Naïve Bayes
    model for large volumes of data sets is relatively simple to construct and extremely
    effective.


    `Naïve Bayes` has reportedly outperformed even the most advanced techniques of
    classification, along with its simplicity of development. Bayes theorem can also
    provide the means to calculate the posterior probability `P(c|x)` using `P(c)`,
    `P(x)`, and `P(x)`. On the basis of the equation shown in the picture below, where
    the probability of `c` can be calculated if `x` has already occurred.


    `P(c|x)` is the posterior probability of class `c, target` provided by the predictor
    `x, attributes`. `P(c)` is the class’s previous probability


    ![](image-1xqh7b5t.jpg)


    Here is an example to better elucidate the application of the `Bayes Theorem`.
    The diagram below represents the dataset regarding the identification of suitable
    weather days for playing golf. The columns portray the weather features of the
    day, while the rows contain individual entries. Examining the initial row of the
    dataset, one can infer that the weather will be excessively hot and humid with
    rain, making the day unsuitable for playing golf. The primary assumption here
    is that all these features or predictors are independent of one another. Another
    assumption is that all the predictors potentially have the same effect on the
    result. This implies that if the day is windy, it would have a relevance to the
    decision of playing golf similar to the impact of rain. In this instance, variable
    `c` represents the class `playing golf`, indicating the decision on whether the
    weather is suitable for golf, and variable `x` represents the features or predictors.

