    # Chapter 5: Data Science Lifecycle and Technologies


    The term `data science` finds its roots in 1960, attributed to `Peter Naur`, who
    initially used it interchangeably with computer science and later introduced `datalogy`.
    In 1974, Naur incorporated the term extensively in his book, `Concise Survey of
    Computer Methods`. The contemporary definition of data science emerged in 1992
    at `The Second Japanese-French Statistics Symposium`, recognizing a novel discipline
    focusing on data types, dimensions, and structures.


    Data, defined as information processed and stored by computers, saturates our
    digital existence. From website clicks to constant smartphone location tracking,
    our world is immersed in data. Extracting solutions from this vast data requires
    the process known as `data science`, where insights are derived from measurable
    data using mathematical equations and statistics. The role of data scientists
    is versatile, often mistaken for computer scientists or statisticians. Anyone,
    be it an individual or a company, delving into extensive data for information,
    can be termed a data science practitioner. For instance, companies like `Amazon`
    and `Target` track in-store and online purchases to offer personalized recommendations.
    Social media platforms like `Twitter` and `Instagram` analyze user-provided data,
    identifying global migration patterns.


    ## Data Science Lifecycle


    The recommended lifecycle for structured data science projects is the `Team Data
    Science Process` (`TDSP`), widely employed for projects involving artificial intelligence
    or machine learning algorithms. It adapts to `exploratory data science` and `ad
    hoc analytics` projects. The `TDSP` is an agile, sequential iteration guiding
    tasks for deploying predictive models in a company’s production environment. Effective
    communication within the team and with stakeholders is crucial for seamless project
    execution.


    The fundamental components of `TDSP` include:


    ### Definition of a Data Science Lifecycle


    The five major stages of the `TDSP` lifecycle are: `Business understanding`, `Data
    acquisition and understanding`, `modeling`, `deployment`, and `customer acceptance`.
    Further details on each stage will be provided shortly.


    ### Standardized Project Structure


    A shared directory structure and templates facilitate quick access to project
    documents for team members. Employing a version control system like `TFS`, `Git`,
    or `Subversion` enhances team collaboration. Agile project tracking systems like
    `JIRA`, `Rally`, and `Azure DevOps` store business requirements, tasks, and functionalities,
    aiding resource and cost estimation. Separate storage for each project is created
    on the version control system, promoting effective management and team collaboration.
    Standardizing project structures across an organization builds an institutional
    knowledge library.


    ### Infrastructure and Resources for Data Science Projects


    The `TDSP` recommends tools like `machine learning service`, databases, `big data
    clusters`, and cloud-based systems for storing data sets. Whether cloud-based
    or on-premises, the infrastructure supports reproducibility, preventing data duplication
    and redundancy. Specific permissions and activity tracking ensure secure resource
    access for team members.


    ![](image-zdau73nw.jpg)


    ### Tools and Utilities for Project Execution


    Implementing changes in organizational processes can be challenging. `TDSP` provides
    tools to automate basic tasks like `data exploration` and `baseline modeling`.
    A well-defined structure facilitates the contribution of shared tools and utilities
    to the team’s `shared code repository`, promoting reuse and cost savings.


    The `TDSP` lifecycle, based on Microsoft’s best practices and structures, serves
    as a standardized template for effective team collaboration and communication.
    It comprises a selection of practices to successfully deliver predictive analytics
    solutions and intelligent applications.


    Details of each stage in the `TDSP` lifecycle, including `Business understanding`,
    `Data acquisition and understanding`, `modeling`, `deployment`, and `customer
    acceptance`, will be explored further.


    ![](image-8aa9s7sl.jpg)


    ## Stage I – Business Understanding


    The initial phase aims to collect and delve into the crucial variables earmarked
    as targets for the model. The metrics linked with these variables will play a
    pivotal role in determining the overall success of the project. Another significant
    objective in this stage involves pinpointing the necessary data sources that the
    company either possesses or might need to acquire. Two primary tasks must be accomplished
    at this stage: `defining objects and identifying data sources`.


    ### Deliverables to be generated in this stage


    `Charter document` – This serves as a `living document` that necessitates regular
    updates throughout the project’s duration, considering new project discoveries
    and evolving business requirements. The `TDSP` `project structure definition`
    provides a standard template. It’s imperative to enhance this document progressively
    by incorporating more details throughout the project while keeping stakeholders
    promptly informed of all modifications.


    `Data sources` – Located within the `TDSP` `project data report folder`, the data
    sources can be accessed in the `Raw Data Sources` section of the `Data Definitions
    Report`. This section not only specifies the initial and final locations of the
    raw data but also furnishes additional details such as the `coding scripts` for
    transferring the data to any desired environment.


    ![](image-9zoaczsn.jpg)


    `Data dictionaries` – The descriptions of the characteristics and features of
    the data such as the `data schematics` and available `entity-relationship diagrams`,
    provided by the stakeholders are documented within the Data dictionaries.


    ![](image-3owb9ssj.jpg)

    '
