    ## Types of “Naïve Bayes classifier”


    ### “Multinomial Naïve Bayes”

    Widely used for classifying documents, determining which category a document belongs
    to, such as beauty, technology, politics, etc. The frequency of phrases in the
    document is considered as the features or predictors of the classifier.


    ### “Bernoulli Naive Bayes”

    Nearly identical to “Multinomial Naïve Bayes,” but uses “boolean variables” as
    predictors. For example, depending on whether a specific phrase occurs in the
    text or not, the parameters used to predict the class variable can be either a
    yes or no value.


    ### “Gaussian Naive Bayes”

    Applied when predictors are not distinct and have very similar or continuous values.
    It is assumed that these values are obtained from a Gaussian distribution.


    ## Applications of “Naïve Bayes”


    ### “Real-Time Prediction”

    `Naive Bayes` is exceptionally quick in learning from input data and can be seamlessly
    used to generate predictions in real-time.


    ### “Multi-class Prediction”

    Widely used to generate predictions for multiple classes simultaneously, allowing
    the prediction of the probability of various classes of the target variable.


    ### “Text Classification / Spam Filtering / Sentiment Analysis”

    `Naive Bayes` classifiers are heavily utilized in text classification models due
    to their ability to address problems with multiple classes of the target variable
    and the autonomy rule. This algorithm has reported higher success rates than any
    other algorithm and is commonly used for identifying spam emails and conducting
    sentiment analysis by discerning favorable and negative consumer feelings on social
    media platforms.


    ### “Recommendation”

    Combining “`Naive Bayes Classifier`” and “`Collaborative Filtering`” can generate
    a “`Recommendation System`” that utilizes ML and data mining methods to filter
    hidden data and provide insight into whether a customer would prefer a particular
    item or product.


    # Chapter 3: Neural Network Learning Models


    `Artificial Neural Networks (ANN)`, also known as “Artificial Neural Networks,”
    aim to replicate the communication pathways found in the human brain. The human
    body houses billions of interconnected neurons that traverse the spine and extend
    into the brain. These neurons connect through root-like nodes, passing messages
    one by one along the chain until reaching the brain. ANNs learn to perform tasks
    by examining examples, often without explicit configuration of task-specific rules.
    For example, in image recognition, they might learn to distinguish pictures containing
    dogs by evaluating samples marked manually as “dog” or “no dog” and using these
    outcomes to identify dogs in other pictures. Remarkably, these systems achieve
    this without prior knowledge of dog features like fur, tails, or dog-like faces.
    Instead, they autonomously derive identification features from the training samples.


    An ANN operates as a network of interconnected units or nodes, termed “artificial
    neurons,” mirroring the biological neurons in the human brain. Each link can transmit
    a signal to connected neurons, akin to synapses in the human brain. An artificial
    neuron, upon receiving a signal, processes and transfers it to connected neurons.
    During implementation, the signal at a connection is a real number, and each neuron’s
    outcome is calculated using a specific non-linear function of the input sum. The
    connections are referred to as “edges,” with neurons and edges assigned values
    or weights optimized through learning. These weights adjust the strength of the
    signal received by the connected neuron. Concepts form and propagate through shared
    neuron sub-networks. Neurons may have threshold limits, transmitting a signal
    only if the accumulated signal exceeds the set threshold. Neurons typically consist
    of multiple layers, transforming inputs uniquely. Signals pass from the initial
    “input layer” to the final “output layer,” sometimes traversing the layers multiple
    times.


    While the initial objective of the ANN model was to solve problems akin to the
    human brain, its focus has shifted over time to specific tasks. ANNs find applications
    in various tasks such as computer vision, speech recognition, machine translation,
    social media filtering, playing board and video games, medical diagnostics, and
    even painting.


    The most prevalent ANN operates with a unidirectional flow of information, termed
    “`Feedforward ANN`.” However, ANNs can also facilitate bidirectional and cyclic
    information flow for achieving state equilibrium. ANNs learn from past cases by
    adjusting connected weights and rely on fewer prior assumptions. This learning
    can be supervised or unsupervised. Supervised learning ensures every input pattern
    results in the correct ANN output, adjusting weights to minimize errors. Reinforced
    learning, a form of supervised learning, informs the ANN about the correctness
    of the generated output rather than providing the correct output directly. Unsupervised
    learning involves providing multiple input patterns to the ANN, allowing it to
    explore relationships and categorize them accordingly. ANNs employing a combination
    of supervised and unsupervised learning also exist.


    For addressing data-heavy problems with unknown or complex rules, ANNs prove highly
    valuable due to their data structure and non-linear computations. They excel at
    processing complex information in parallel and are robust to multi-variable data
    errors. However, the black-box nature of ANN poses a significant drawback, making
    them less suitable for problems requiring a deep understanding of the underlying
    process.


    ## Components of ANNs


    ### Neurons

    ANNs retain the concept of artificial neurons receiving input, incorporating internal
    state and threshold values if available, utilizing an “activation function,” and
    generating output through an “output function.” Initial inputs can include any
    form of data, such as pictures and files, leading to outcomes like object recognition
    in a picture. The key feature of the activation function is ensuring a smooth
    transition as input values change, meaning minor input changes result in minor
    output changes.


    ### Connections and weights

    ANNs consist of connections using the output from one neuron as input to an associated
    neuron. Each connection is assigned a “weight” reflecting the relative significance
    of the signal. A neuron may have multiple input and output connections.


    ### Propagation function

    The “propagation function” calculates a neuron’s input from the outputs of its
    predecessors and their connections, in the form of a weighted sum. A “bias term”
    may be applied to the propagation result. `Backpropagation` adjusts connection
    weights to account for errors encountered during the learning process. The error
    is distributed between connections, and “backprop” theoretically calculates the
    gradient of the cost function linked to the weight of the given state. Weights
    can be updated using techniques like stochastic gradient descent or other methods,
    including Extreme Learning Machines, No-prop network, weightless network, and
    non-connectionist neural network.

