    # Statistical Learning Framework


    “Statistical learning” is a descriptive statistics-based learning framework categorized
    as supervised or unsupervised. “Supervised statistical learning” involves constructing
    a statistical model to predict or estimate output based on single or multiple
    inputs. In contrast, “unsupervised statistical learning” involves inputs without
    supervisory output, helping in learning data relationships and structure. Understanding
    statistical learning involves identifying the connection between the “predictor”
    (independent variables, attributes) and the “response” (dependent variable) to
    produce a model capable of predicting the “response variable (Y)” based on “predictor
    factors (X).”


    ![](image-n46qvym7.jpg)


    `X = f(X) + ɛ where X = (X1,X2, . . .,Xp)`, where `f` is an `unknown function`
    & `ɛ` is `random error (reducible & irreducible)`.


    Here are some fundamental concepts of Statistical Learning:


    ## Prediction and Inference


    When there are several easily accessible inputs `X`, but the output `B` production
    is unknown, `f` is often treated as a black box, provided that it generates accurate
    predictions for `Y`. This is called `prediction`. There are circumstances in which
    we need to understand how `Y` is influenced as `X` changes. We want to estimate
    `f` in this scenario, but our objective is not simply to generate predictions
    for `Y`. In this situation, we want to establish and better understand the connection
    between `Y` and `X`. Now, `f` is not regarded as a black box since we have to
    understand the underlying process of the system. This is called `inference`. In
    everyday life, various issues can be categorized into the setting of `predictions`,
    the setting of `inferences`, or a `hybrid` of the two.


    ## Parametric and Non-parametric Techniques


    The `parametric technique` can be defined as an evaluation of `f` by calculating
    the set parameters (a finite summary of the data) while establishing an assumption
    about the functional form of `f`. The mathematical equation of this technique
    is `f(X) = β0 + β1X1 + β2X2 + . . . + βpXp`. The `parametric models` tend to have
    a finite number of parameters independent of the size of the data set. This is
    also known as `model-based learning`. For example, `k-Gaussian models` are driven
    by the parametric technique.


    ![](image-o1tcq7i3.png)


    On the other hand, the `non-parametric technique` generates an estimation of `f`
    based on its closeness to the data points, without making any assumptions on the
    functional form of `f`. The `non-parametric models` tend to have a varying number
    of parameters that grow proportionally with the size of the data set. This is
    also known as `memory-based learning`. For example, `kernel density models` are
    driven by a non-parametric technique.


    ## Predictions Accuracy and Model Interpretability


    Some of the many methods used to learn from statistical data are less adaptable
    and extremely restrictive. When `inference` is the target, the use of easy and
    comparatively inflexible techniques of statistical learning has significant benefits.
    On the other hand, if the target is the generation of forecasts and predictions,
    flexible models are preferred.


    The performance of the model can be estimated based on its accuracy in predicting
    the occurrence of an event on new input data. A more accurate model is deemed
    more valuable. Interpretability of the model offers insight into the input-output
    relationship. An interpreted model can provide insight into the capability of
    independent features to generate predictions for the dependent attribute. The
    problem occurs because, at the expense of interpretability, as model accuracy
    improves, so does the complexity of the model.


    A more accurate model can offer a business more possibilities, advantages, time,
    or money. But the model accuracy needs to be optimized for such prediction. The
    optimization of accuracy extends the complexity of the model even further by introducing
    additional model parameters (and resources needed to adjust those parameters).
    It is much easier and quicker to interpret a model with a relatively small number
    of parameters. An input coefficient and an intercept term are part of a linear
    regression model. For instance, every single term can be explored to assess how
    it contributes to the production of the output. Switching to a logistic regression
    model provides greater authority in the context of the relationships underlying
    the potential transformation of a function to output, and that too should be explored
    along with the coefficients.


    It is relatively easy to understand a decision tree of small size, but a heavily
    loaded decision tree needs a distinct perspective to understand why the event
    is predicted to occur. Furthermore, the optimized combination of several models
    into one prediction tends to have no significant or timely interpretation. Interpretation
    is deemed ancillary to model accuracy.


    For example, models designed to separate and classify `spam` emails from `non-spam`
    emails, as well as models designed to evaluate the price of real estate.


    ![](image-1xuvbx4f.jpg)

    '
  trans: '

    # 统计学习框架


    “统计学习”是一种基于描述性统计的学习框架，可分为监督式或无监督式。“监督式统计学习”涉及构建统计模型以根据单个或多个输入预测或估计输出。相比之下，“无监督式统计学习”涉及没有监督输出的输入，有助于学习数据关系和结构。理解统计学习涉及识别“预测变量”（自变量、属性）与“响应变量”（因变量）之间的联系，以生成能够基于“预测因子
    (X)”预测“响应变量 (Y)”的模型。


    ![](img/image-n46qvym7.jpg)


    `X = f(X) + ɛ where X = (X1,X2, . . .,Xp)`, where `f` is an `unknown function`
    & `ɛ` is `random error (reducible & irreducible)`.


    以下是统计学习的一些基本概念：


    ## 预测与推断


    当存在多个易于获取的输入 `X`，但输出 `B` 的产生未知时，`f` 通常被视为黑箱，前提是它能为 `Y` 生成准确的预测。这称为 `prediction`。在某些情况下，我们需要理解
    `Y` 如何随着 `X` 的变化而受到影响。我们希望在这种情况下估计 `f`，但我们的目标不仅仅是为 `Y` 生成预测。在这种情况下，我们希望建立并更好地理解
    `Y` 与 `X` 之间的联系。现在，`f` 不再被视为黑箱，因为我们必须理解系统的底层过程。这称为 `inference`。在日常生活中，各种问题可以归类为
    `predictions` 设置、`inferences` 设置，或两者的 `hybrid`。


    ## 参数与非参数技术


    `parametric technique` 可定义为通过计算一组参数（数据的有限摘要）来评估 `f`，同时对 `f` 的函数形式做出假设。这种技术的数学方程为
    `f(X) = β0 + β1X1 + β2X2 + . . . + βpXp`。`parametric models` 倾向于具有有限数量的参数，与数据集的大小无关。这也称为
    `model-based learning`。例如，`k-Gaussian models` 由参数技术驱动。


    ![](img/image-o1tcq7i3.png)


    另一方面，`non-parametric technique` 在不对 `f` 的函数形式做出任何假设的情况下，基于其与数据点的接近程度生成对 `f` 的估计。`non-parametric
    models` 倾向于具有随数据集大小成比例增长的可变数量的参数。这也称为 `memory-based learning`。例如，`kernel density
    models` 由非参数技术驱动。


    ## 预测准确性与模型可解释性


    用于从统计数据中学习的大量方法中，有些适应性较差且极其受限。当 `inference` 是目标时，使用简单且相对不灵活的统计学习技术具有显著优势。另一方面，如果目标是生成预测，则更喜欢灵活的模型。


    模型的性能可以根据其在新输入数据上预测事件发生的准确性来估计。更准确的模型被认为更有价值。模型的可解释性提供了输入-输出关系的洞察。被解释的模型可以提供关于独立特征生成对依赖属性预测的能力的洞察。问题在于，随着模型准确性的提高，模型的复杂性也在增加，而以牺牲可解释性为代价。


    更准确的模型可以为企业提供更多可能性、优势、时间或金钱。但模型准确性需要针对此类预测进行优化。准确性的优化通过引入额外的模型参数（以及调整这些参数所需的资源）进一步扩展了模型的复杂性。解释参数相对较少的模型要容易得多且更快。线性回归模型包含输入系数和截距项。例如，可以探索每个术语以评估其对输出产生的贡献。切换到逻辑回归模型在函数潜在转换到输出的底层关系背景下提供了更大的权威性，并且系数也应与之一起探索。


    理解小型决策树相对容易，但负载过重的决策树需要独特的视角来理解为什么预测事件会发生。此外，将多个模型优化组合成一个预测往往没有显著或及时的解释。可解释性被认为是对模型准确性的辅助。


    例如，设计用于将 `spam` 邮件与 `non-spam` 邮件分离和分类的模型，以及设计用于评估房地产价格的模型。


    ![](img/image-1xuvbx4f.jpg)

    '
