    # Chapter 4: Learning Through Uniform Convergence


    The central concern of statistical learning theory lies in characterizing a model’s
    ability to learn. In the context of models driven by “supervised classification
    and regression” techniques, learnability hinges on the “uniform convergence” of
    empirical risk to population risk. This implies that a problem is learnable if
    it can be trained by minimizing the empirical risk of the data. In statistical
    asymptotic theory and probability theory, “uniform convergence in probability”
    is a type of convergence that signifies the convergence of empirical frequencies
    to theoretical probabilities within a specific event-family under certain circumstances.
    This concept, integral to statistical learning theory, finds broad applicability
    in machine learning. Defined as “a mode of convergence stronger than pointwise
    convergence in the mathematical field of analysis,” uniform convergence plays
    a pivotal role.


    In 1995, Vapnik published “The General Setting of Learning,” addressing the learnability
    of models within statistical contexts. This framework defines a learning problem
    using a “hypothesis class `H`,” an instance set `Z` with a sigma-algebra, and
    an objective function (e.g., loss or cost) denoted as “`f: H × Z→ R`.” The goal
    is to minimize a population risk functional over a hypothesis class `H`, where
    the distribution `D` of `Z` is unknown, based on a sample `z1,…,zm` drawn from
    `D`.


    `F \= \[f`


    This general setting encompasses various techniques, including supervised classification
    and regression, unsupervised learning algorithms, and density estimation. In supervised
    learning, where `z \= (x, y)` is an instance-label pair, `h` is a predictor, and
    `f (h; (x, y)) \= loss(h(x), y)` is the loss function, the goal is to minimize
    “`F (h) \= EZ∼D \[f (h;Z)\]`” within experimental accuracy based on a finite sample
    only (`z1,…zm`). The focus here is not on the computational aspects but on achieving
    statistical minimization based solely on the sample (`z1,…zm`).


    It is widely acknowledged that a supervised classification and regression problem
    can only be learned when the empirical risks for the entire `h ∈ H` uniformly
    converge to the population risk. According to research by Blumer (1989) and Alon
    (1997), if uniform convergence holds, the empirical risk minimizer (ERM) is consistent,
    meaning the population risk of the ERM converges to the optimal population risk,
    rendering the problem learnable using the ERM. This establishes “uniform convergence”
    of empirical risks as a necessary and sufficient condition for learnability, akin
    to a “combinatorial condition” with a finite “VC-dimension” for classification
    algorithms and a finite “fat-shattering dimension” for regression algorithms.


    Apart from “uniform convergence,” specific concepts of “stability” have been proposed
    as prerequisites for learnability. These concepts evaluate the sensitivity of
    learning laws or algorithms to fluctuations in the training data set. ERM stability,
    in particular, is deemed sufficient for learnability. According to “Mukherjee
    et al. (2006),” stability is essential to learning, with the understanding that
    stability characterizes learning skill only where uniform convergence characterizes
    learning skill.


    The equivalence of uniform convergence and learning is officially established
    only in a supervised classification and regression environment. The implications
    extend to finite fat-shattering dimensions, uniform convergence, and ERM stability,
    making them suitable for learnability using the ERM. Vapnik’s work reveals that
    a concept of “non-trivial” or “rigid” learnability associated with the ERM corresponds
    to uniform convergence of empirical risks, addressing some of the learning’s “trivial”
    issues that can be learned without uniform convergence. Even with these issues,
    empirical risk minimization can facilitate learning. Thus, in the general learning
    setting or supervised classification and regression, an issue appears to be learnable
    only when it can be learned by empirical risk minimization.


    This framework, while not highly specific, sufficiently covers a significant portion
    of optimization and statistical learning problems, such as stochastic convex optimization
    in Hilbert spaces, density estimation, K-means clustering in Euclidean space,
    large margin classification in a reproducing kernel Hilbert space (RKHS), regression,
    and binary classification.


    The ultimate goal in this setting is the selection of a hypothesis `h ∈ H` based
    on a finite number of samples with minimal potential risk. It is assumed that
    learning guidelines enabling the choice of such hypotheses are consistent. Formally,
    “rule A” is considered consistent with rate “`εcons(m)`” under distribution “`D`”
    if, for all “`m`,” where “`F\* \= infh∈H F(h)`,” the rate `ε(m)` is monotonically
    decreasing with “`εcons(m) → 0`.”


    Choosing a “`D`-based” learning rule is impractical due to the unknown distribution
    `D`. Instead, a stronger requirement is needed, ensuring the rule is consistent
    with rate `εcons(m)` under all distributions `D` over `Z`. The key definition
    states, “A learning problem is learnable if there exists a learning rule A and
    a monotonically decreasing m→∞ sequence `εcons(m)`, such that `εcons(m) → 0`,
    and ∀D, ES∼Dm \[F(A(S)) − F\*\] ≤ εcons(m). A learning rule A for which this holds
    is denoted as a universally consistent learning rule.”


    This definition of learnability, demanding a uniform rate across all distributions,
    is the most appropriate concept for studying learnability of a hypothesis class.
    It is a direct generalization of “agnostic PAC-learnability” to “Vapnik’s General
    Setting of Learning,” as studied by Haussler in 1992. The potential path to learning
    involves minimizing the empirical risk “`FS(h)`” over a sample “`S`,” defined
    as


    “`FS ( h ) \= 1/m ∑ f ( h ; z ).`”


    ![](image-7i6g21py.jpg)


