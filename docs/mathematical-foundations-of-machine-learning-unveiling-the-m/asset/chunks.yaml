    # Business Intelligence vs. Data Science


    Data science is interdisciplinary, applying mathematical algorithms to extract
    insights from raw data. Business Intelligence (BI) uses analytical tools to understand
    the company’s current state and historical performance. While BI offers retrospective
    wisdom, data science is more futuristic, focusing on predictive and prescriptive
    analysis.


    Data science handles vast raw data for future predictions, automating BI tasks
    with data-driven tools. The fundamental distinction lies in the questions addressed:
    data science explores why events occur and their future recurrence, while BI focuses
    on what happened during events and what changes can fix them.


    Traditionally, BI required computer science expertise, but data science is making
    it accessible to non-technical users. Data scientists operationalize data, and
    BI experts collaborate to develop optimal data models and solutions. Unlike BI,
    data science employs built-in machine learning libraries, turning business analysis
    into a more democratic and advanced field.


    ![](image-m4xh90et.jpg)


    # Data Mining


    Data mining is the process of exploring and analyzing large volumes of data to
    extract meaningful patterns and rules, falling under the umbrella of data science.
    It’s widely used for developing artificial intelligence-based machine learning
    models, such as search engine algorithms. While the concept of uncovering hidden
    patterns in data has existed for a long time under the term “knowledge discovery
    in databases,” the term “data mining” was coined in the 1990s.


    According to SAS, 90% of the digital universe consists of unstructured data. The
    application of data mining technology helps filter redundant and unnecessary data
    noise, allowing for a clearer understanding of relevant information crucial for
    immediate decision-making.


    Data mining comprises three interconnected disciplines: statistics (mathematical
    study of data relationships), machine learning algorithms (algorithms with the
    ability to learn), and artificial intelligence (machines displaying human-like
    intelligence). With the advent of big data, data mining technology has evolved
    to keep up with its limitless potential, thanks to relatively cheaper advanced
    computing abilities.


    ## Data Mining Trends


    Increased Computing Speed: As the volume and complexity of big data grow, data
    mining tools require more powerful and faster computers. Supercomputers are becoming
    necessary for efficiently analyzing the expanding big data.


    Language Standardization: The data science community is actively working to standardize
    a language for the data mining process. This effort aims to allow analysts to
    work conveniently with various data mining platforms by mastering a single standard
    data mining language.


    Scientific Mining: The success of data mining technology in the industrial world
    has attracted attention from the scientific and academic research community. For
    instance, psychologists use association analysis to capture and identify human
    behavioral patterns for research purposes.


    Web Mining: Web mining involves discovering hidden data patterns on the Internet
    using techniques similar to data mining. Amazon, for example, uses web mining
    to understand customer interactions and enhance user experience on their website
    and mobile application.


    ## Data Mining Tools


    Some widely used data mining tools include:


    Orange: An open-source component-based software written in Python, frequently
    used for basic data mining analysis.


    RapidMiner: An open-source component-based software written in Java, commonly
    used for predictive analysis and offering integrated environments for machine
    learning, deep learning, and text mining.


    Mahout: An open-source platform primarily used for unsupervised learning processes,
    developed by Apache. It’s used for developing machine learning algorithms for
    clustering, classification, and collaborative filtering.


    MicroStrategy: A business intelligence and data analytics software that complements
    all data mining models, offering a variety of drivers and gateways to connect
    with enterprise resources and analyze complex big data.


    # Conclusion


    Thank you for reaching the end of “Mathematical Foundations of Machine Learning:
    Study Deep Learning through Data Science.” We hope it provided you with the tools
    you need to achieve your goals. The next step is to apply your new-found wisdom
    on the mathematical and statistical workings of machine learning. Understanding
    these concepts is crucial for navigating the fourth industrial revolution, where
    machines, operated by humans today in a limited capacity, are transitioning into
    a world where machines could be indistinguishable from human beings. This transition
    is powered by machine learning, and your understanding of statistical learning
    frameworks is key to success.


    Becoming a machine learning expert requires not only programming skills but also
    a solid understanding of statistical and mathematical concepts. This book simplifies
    the explanation of the statistical learning framework for ease of understanding.
    A crucial aspect of developing a successful machine learning algorithm is the
    quality and generation of the training data set, along with its learnability by
    the algorithm. With this knowledge, you are well-equipped to design machine learning
    algorithms tailored to your business needs. Whether you’re a software developer
    aiming to create the next application that can learn from open data or compete
    with the likes of “Amazon Alexa” and “Apple Siri,” this book provides you with
    a head start.

    '
  trans: '


    # 商业智能 vs. 数据科学


    数据科学是跨学科的，应用数学算法从原始数据中提取洞察。商业智能（BI）使用分析工具来理解公司的当前状态和历史表现。虽然 BI 提供回顾性智慧，但数据科学更具前瞻性，专注于预测性和规范性分析。


    数据科学处理庞大的原始数据以进行未来预测，并通过数据驱动工具自动化 BI 任务。根本区别在于所解决的问题：数据科学探索事件为何发生及其未来是否会再次发生，而
    BI 则关注事件中发生了什么以及什么改变可以修复它们。


    传统上，BI 需要计算机科学专业知识，但数据科学使其对非技术用户变得可访问。数据科学家将数据操作化，而 BI 专家则协作开发最优数据模型和解决方案。与 BI
    不同，数据科学采用内置机器学习库，将业务分析转变为更民主和先进的领域。


    ![](img/image-m4xh90et.jpg)


    # 数据挖掘


    数据挖掘是从海量数据中探索和分析以提取有意义的模式和规则的过程，属于数据科学的范畴。它广泛用于开发基于人工智能的机器学习模型，例如搜索引擎算法。虽然在数据中发现隐藏模式的概念长期以来以“数据库知识发现”术语存在，但“数据挖掘”一词是在
    1990 年代创造的。


    根据 SAS 的说法，90% 的数字宇宙由非结构化数据组成。数据挖掘技术的应用有助于过滤冗余和不必要的噪声数据，从而更清晰地理解对即时决策至关重要的相关信息。


    数据挖掘包含三个相互关联的学科：统计学（数据关系的数学研究）、机器学习算法（具有学习能力的算法）和人工智能（表现出类人智能的机器）。随着大数据时代的到来，得益于相对更便宜的高级计算能力，数据挖掘技术已发展以跟上其无限潜力。


    ## 数据挖掘趋势


    计算速度提升：随着大数据量和复杂性的增长，数据挖掘工具需要更强大、更快的计算机。超级计算机变得必要以便高效分析不断扩大的大数据。


    语言标准化：数据科学社区正在积极努力为数据挖掘过程标准化一种语言。此举旨在让分析师通过掌握单一标准数据挖掘语言，方便地使用各种数据挖掘平台。


    科学挖掘：数据挖掘技术在工业界的成功吸引了科学和学术研究界的关注。例如，心理学家使用关联分析来捕捉和识别人类行为模式以供研究目的。


    网络挖掘：网络挖掘涉及使用类似于数据挖掘的技术在互联网上发现隐藏的数据模式。例如，亚马逊使用网络挖掘来了解客户互动并增强其网站和移动应用程序的用户体验。


    ## 数据挖掘工具


    一些广泛使用的数据挖掘工具包括：


    Orange：一种用 Python 编写的开源组件化软件，经常用于基础数据挖掘分析。


    RapidMiner：一种用 Java 编写的开源组件化软件，常用于预测分析，并提供集成环境用于机器学习、深度学习和文本挖掘。


    Mahout：一种主要用于无监督学习过程的开源平台，由 Apache 开发。它用于开发用于聚类、分类和协同过滤的机器学习算法。


    MicroStrategy：一种商业智能和数据分析软件，可补充所有数据挖掘模型，提供各种驱动程序和网关以连接企业资源并分析复杂的海量数据。


    # 结论


    感谢您阅读完《机器学习的数学基础：通过数据科学学习深度学习》。我们希望它为您提供了实现目标所需的工具。下一步是将您新获得的关于机器学习数学和统计工作原理的智慧付诸实践。理解这些概念对于驾驭第四次工业革命至关重要，在这次革命中，机器目前由人类以有限的方式操作，正在过渡到机器可能与人类无法区分的世界。这种转变由机器学习驱动，而您对统计学习框架的理解是成功的关键。


    成为机器学习专家不仅需要编程技能，还需要扎实的统计和数学概念理解。本书简化了统计学习框架的解释以便于理解。开发成功的机器学习算法的一个关键方面是训练数据集的质量和生成，以及算法对其的可学习性。凭借这一知识，您已完全具备设计针对业务需求量身定制的机器学习算法的能力。无论您是软件开发者，旨在创建下一个可以从开放数据中学习的应用，还是与“亚马逊
    Alexa”和“苹果 Siri”竞争，本书都为您提供了先发优势。


    '
