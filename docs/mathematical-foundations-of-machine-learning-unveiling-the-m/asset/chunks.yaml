    # 半监督机器学习


    “半监督机器学习算法”具有高度灵活性，可以从“标记”数据和“未标记”或原始数据中学习。这些算法代表了监督式和非监督式机器学习算法的混合体。通常，训练数据集主要由未标记数据组成，并包含少量标记数据。结合
    `forecast`、`regression` 和 `classification` 等分析方法使用半监督学习算法，可以使计算机在学习和训练中的准确性显著提高。当从原始数据集中生成处理过的标记训练数据对公司来说资源密集且成本效益较低时，这些算法经常被采用。公司使用半监督学习算法系统来避免额外的人力和设备支出。例如，`facial
    recognition` 技术应用需要来自各种来源的海量面部数据。对来自互联网摄像头等来源获得的原始数据进行处理、分类和标记需要大量资源和数千小时来创建训练数据集。


    ![](img/image-ux0k48sf.png)


    # 强化机器学习


    强化机器学习算法与之前讨论的机器学习算法不同。它通过执行动作并细致记录结果，从环境中学习，将失败的结果标记为错误，将优秀的结果标记为奖励。两大关键特性使强化学习算法脱颖而出：`trial
    and error` 分析技术和 `delayed reward` 反馈循环。计算机通过各种计算持续分析输入数据，对正确或预期输出发出强化信号。这种迭代过程为评估、记录和学习高效活动创建了反馈循环，随着时间的推移优化结果。这些算法在游戏、机器人和导航系统中得到广泛应用。


    # 机器学习的重要性


    人们对机器学习 `ML` 的持续兴趣源于数据量和种类不断增加、计算处理成本效益高以及数据存储价格低廉等因素。机器学习与人工智能一起构成了 `Fourth Industrial
    Revolution` 的核心，影响人类生活的方方面面。机器学习能够快速准确地分析庞大而复杂的数据集，使企业能够识别增长机会并降低风险。由机器学习驱动的数据驱动策略在区分成功公司方面发挥着关键作用。图像识别和文本处理等任务的自动化展示了机器学习的变革潜力。以
    Google 的 DeepMind 和 OpenAI 的 Dota Bot 为例的机器，已展示出超出最初预期的能力，重塑了经济和社会格局。


    # 重复学习自动化与信息揭示


    机器学习与机器人自动化不同，它以适应性和持续改进的方式自动化计算机导向的任务。机器学习算法从数据中学习，适应不断变化的环境并减少错误。这些算法作为分类器或预测工具发挥作用，发展出独特的能力，例如自学习下棋或个性化产品推荐。具有多个隐藏层的深度学习模型在处理海量数据集方面表现出色，有助于提高准确性。大数据分析与自学习算法的结合增强了数据的价值，将其转化为知识产权。机器学习每周可以创建数千个模型，而人类则无法做到，这加速了创新和问题解决。


    # 机器学习的核心概念


    如今，机器学习 `ML` 有各种类型，但机器学习的基础围绕三个关键组成部分展开：`representation`、`evaluation` 和 `optimization`。以下是适用于所有机器学习类型的一些基本概念：


    ## 表示


    机器学习模型无法直接感知、看到或感应输入示例。因此，数据表示对于为模型提供关于主要数据属性的有意义视角至关重要。选择最能代表数据的显著特征对于有效训练机器学习模型至关重要。`Representation`
    简单来说就是以计算机能够理解的语言，使用一组分类器将数据点呈现给计算机。分类器被定义为接收离散和/或连续函数值的向量作为输入，并输出称为 `class` 的单个离散值的模型。为了从表示的数据中学习，模型必须在训练数据集中或希望模型进行训练的
    `hypothesis space` 中具有所需的分类器。用于表示输入的数据特征对机器学习系统至关重要。任何位于假设空间之外的 `classifier` 都无法被模型学习。开发所需的机器学习模型取决于数据特征的本质，往往决定了机器学习项目的成功与否。


    ![](img/image-ndob0e26.png)


    一个具有若干独立 `features` 且与 `class` 紧密关联的训练数据集可以显著简化机器的学习。另一方面，机器可能难以从具有复杂函数的类别中学习。这通常需要处理原始数据以构建机器学习模型所需的特征。从原始数据集中提取特征往往是机器学习项目中最耗时、最费力的部分。它也被认为是最具创造性和最有趣的部分，其中直觉和
    `trial and error` 与技术要求一样重要。机器学习过程不是 `one-shot` 过程，而是一个迭代过程，需要分析执行后的输出，然后修改训练数据集。领域特异性是训练数据集需要全面投入时间和精力的另一个原因。用于预测电子商务平台中消费者行为的训练数据集将与自动驾驶汽车所需的训练数据集大不相同。然而，核心机器学习机制在工业部门中保持不变。因此，正在进行持续研究以自动化特征工程过程。


    ## 评估


    在机器学习上下文中，`evaluation` 本质上是指评估各种假设或模型以选择其一的方法。需要一个 `evaluation function` 来区分有效的分类器和模糊的分类器。评估函数也被称为
    `objective`、`utility` 或 `scoring` 函数。机器学习算法具有其内部评估函数，通常与研究人员用于优化分类器的外部评估函数不同。通常，评估函数在项目初始阶段选择数据表示工具之前就已描述。例如，自动驾驶汽车机器学习模型的评估函数可能涉及以接近零的假阴性率和低假阳性率识别行人，并且该条件需要使用适用的数据特征进行
    `represented`。


    ## 优化


    探索表示的机器学习模型的假设空间以识别得分最高的分类器并实现更好评估的过程被称为 `optimization`。对于具有一个以上最优分类器的算法，选择优化方法对于确定生成的分类器和实现更有效的学习模型至关重要。各种
    `off-the-shelf optimizers` 可用于启动新的机器学习模型，然后在之后用定制设计的优化器替换它们。


    '
