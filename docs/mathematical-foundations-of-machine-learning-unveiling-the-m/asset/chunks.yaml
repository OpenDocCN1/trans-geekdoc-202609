    # ANN 的超参数


    “超参数”是在学习过程启动前建立的参数。这些值是通过学习过程本身确定的，例如学习率、批大小和隐藏层的数量。某些超参数值可能是相互依赖的；例如，特定层的大小可能取决于层的总数。


    学习率表示模型在每次观察中纠正错误所需的修正措施的幅度。较高的学习率缩短训练时间但牺牲准确性，而较低的速率延长训练时间以换取可能更高的准确性。像 `Quickprop`
    这样的优化技术旨在加快误差最小化，而其他改进则侧重于提高输出的可靠性。这些改进采用 `adaptive learning rate`，该速率会进行调整以防止振荡并增强收敛。


    ![](img/image-hxgv2mu8.png)


    动量原理在梯度和先前改变之间取得平衡，权重调整受先前改变的影响。接近 `0` 的动量值强调梯度，而接近 `1` 的值则强调上一次的变化。


    # 使用数据管道进行神经网络训练


    神经网络被定义为从训练数据集中学习预期输出的函数，具有单个神经元或 `perceptron`。与传统编程不同，神经网络通过从提供的训练数据集中学习自主确定参数（权重和偏差），使用诸如
    `backpropagation` 和 `gradient descent` 等算法。


    程序员建立一个数据管道，这是一个循环且迭代的过程，其中每个阶段都利用前一阶段的数据。像 `Python` 和 `R` 这样的开发环境能够在沙箱环境中高效地训练和测试模型，促进交互式原型开发。


    构建机器学习管道的目标包括：

    减少系统延迟。

    与松耦合的其他模型组件集成。

    水平和垂直可扩展性。

    通过异步、非阻塞消息进行消息驱动通信。

    用于数据集管理的有效计算。

    对系统错误具有弹性并在最少监督下恢复。

    支持输入数据的批处理和实时处理。


    传统数据管道涉及隔夜批处理，但在机器学习模型中，批处理并不总是足够。下面的图像说明了应用于实时业务问题的机器学习数据管道，包括产品推荐、预计到达时间、新链接推荐和搜索引擎等应用。


    ![](img/image-srcln3y1.jpg)


    上方的泳道图包含两个明确指定的组件：


    在线模型

    在图片的顶部泳道中，描绘了应用程序运行所需的元素。它显示了模型用于实时决策的位置。


    离线数据

    底部泳道说明了模型的<|message|> 元素，用于分析历史数据并使用 `batch processing` 方法生成机器学习模型。


    创建数据管道有八个基本阶段，如下图所示并在此详细解释：


    ## 问题

    在此阶段，将识别并记录使用机器学习模型需要解决的业务问题以及所有相关详细信息。


    ## 数据

    任何机器学习工作流的第一阶段都是将输入数据引导到数据库服务器。必须记住，数据以原始且未经修改的形式摄取，以保持原始数据集不变的记录。数据可能来自各种来源，通过请求获取或从其他系统传输。


    `NoSQL document databases` 最适合存储大量已定义和标记的以及无组织的原始数据，随着快速发展而无需遵守预定义方案。它们甚至提供 `distributed,
    scalable, and replicated data storage`。


    数据通过 `Ingestion Service` 流入 `offline` 层的原始数据存储中，这是一个复合编排服务，能够封装数据来源和持久化。存储库模型在内部与数据服务通信，与数据存储交换。当将数据保存到数据库时，会为数据集分配唯一的批次
    ID，以便有效查询、端到端跟踪和监控。


    为了计算高效，数据摄取被分布为两个方面。第一是对每个数据集的特定管道以同时处理每个数据集。第二方面是，在每个管道内，数据可以被分割以充分利用各种服务器核心、处理器，甚至整个服务器。将数据准备分布在多个垂直和水平管道中可减少所需总时间。


    `ingestion service` 根据预定义计划（每天一次或多次）定期运行，或在遇到触发器时运行。主题将生产者（数据源）与处理器解耦，此示例的数据管道。当收集源数据时，`producer
    system` 会通知 `broker`，而 `embedded notification service` 通过引发数据摄取做出响应。`notification
    service` 还会通知 `broker` 原始数据集的处理已成功完成，并且数据集现已存储在数据库中。


    `Online Ingestion Service` 构成了在线层 `streaming architecture` 的入口，解耦并管理从源到处理和存储组件的数据流。它提供一致、高性能、低延迟的功能，并充当企业级
    `Data Bus`。数据存储在长期 `Raw Data Storage` 上，也充当到后续在线流服务的中介层以进行进一步的实时处理。可能使用的技术包括 `Apache
    Kafka (pub/sub messaging system)` 和 `Apache Flume (data collection to the long-term
    database)`。可以根据企业的技术栈选择性地应用各种其他类似技术。


    ## 数据

    在摄取信息后，集中式管道评估数据状况，寻找格式变化、异常值、模式、不准确、不完整或失真信息，纠正任何异常。`feature engineering process`
    也包含在此阶段。此阶段的三个主要角色是 `extraction, transformation, and selection`。


    由于这通常是任何机器学习项目中最复杂的部分，引入适当的设计模式至关重要。在编码上下文中，这意味着使用工厂技术根据某些共享抽象函数行为生成特征，以及使用策略模式在执行时选择正确的特征。在构建
    `feature extractors` 和 `transformers` 时，考虑管道的组合和可重用性很重要。


    功能选择可以归因于调用者或自动化。例如，可以应用 `chi-square statistical test` 来对每个功能对概念标签的影响进行分类，在开始训练模型之前丢弃低影响特征。为此，可以识别一些
    `selector APIs`。无论如何，必须为每个特征集分配唯一 ID，以确保模型输入的一致性和影响评分。总的来说，有必要将数据准备管道组装成一组不可变的转换，可以轻松组合。现在，`testing
    and high code coverage` 的重要性成为模型成功的关键因素。


    ## 数据

    机器学习模型的主要目标是基于其对新输入数据（不属于训练数据集的一部分）所产生的预测和预测的质量来开发高精度模型。因此，可用的标记数据集将被用作未来未知输入数据的
    `proxy`，通过将数据分为训练和测试数据集。分割数据集的方法有很多，其中一些最常用的技术包括使用默认或自定义比例按顺序将数据集分为两个子集，以确保数据在源中出现的顺序没有重叠。例如，您可以选择前
    75% 的数据来训练模型，随后 25% 的数据来测试模型的准确性。


    ![](img/image-xoa5q2gc.jpg)


    使用默认或自定义比例以及随机种子将数据集分割为训练和测试子集。例如，您可以选择数据集的随机 75% 来训练模型，剩余的 25% 随机数据集来测试模型。


    利用其中一种技术（`sequential vs. random`）然后也在每个数据子集内混合数据。


    在需要对数据分离进行广泛控制时，采用自定义注入方法来分割数据。


    从技术上讲，数据分离阶段不被视为独立的机器学习管道；然而，必须提供 `API` 或工具来支持此阶段。为了返回所需的数据集，接下来的两个阶段（`model training`
    和 `model assessment`）必须能够调用此 `API`。关于代码组织，需要 `strategy pattern`，以便 `caller service`
    在执行期间选择适当的算法，并且需要注入百分比或随机种子的能力。`API` 还必须准备好返回带标签或不带标签的信息，分别用于训练和测试模型。可以创建一个警告并随数据集一起传递，以确保
    `caller service` 不定义可能导致数据分布不均的参数。


    ## 模型训练


    模型管道始终是 `offline`，其计划会根据应用程序的复杂性从几个小时到每天仅运行一次不等。训练也可以由时间和事件启动，而不仅仅是由系统调度程序启动。它包括许多机器学习算法库，例如
    `linear regression, ARIMA, k-means, decision trees`，以及许多其他算法，旨在为快速生产新型模型提供便利，并使模型可以互换。`third-Party
    APIs` 的集成也很重要，使用 `facade pattern`（在此阶段，还可以调用 `Python Jupyter notebook`）。


    您有几种 `parallelization` 选择：


    专门针对单个模型的管道通常是最简单的方法，这意味着所有模型可以同时运行。


    另一种方法是将训练数据集复制；即数据集可以被分割，每个数据集将包含模型的副本。这种方法适用于需要实例的所有字段来执行计算的模型，例如 `LDA`、`MF`。


    另一种方法可以是并行化整个模型，这意味着模型可以被分离，每个分区负责维护变量的一部分。这种方法最适合线性机器学习模型，如 `Linear Regression`、`Support
    Vector Machine`。


    最后，也可以利用上述一种或多种方法的组合使用混合策略。


    实施模型训练时必须考虑错误容忍度。训练分区上的数据检查点和故障也必须考虑，例如，如果每个分区由于某些瞬态问题（如超时）而失败，则可以再次训练每个分区。


    ## 神经网络的训练方法


    与大多数传统机器学习模型类似，神经网络可以使用监督和无监督学习算法进行训练，如下所述：


    ### 监督训练


    监督训练的努力将输入和输出都提供给机器。然后网络将处理输入并将生成的输出与预期输出进行比较。然后错误会通过模型向后传播，导致模型调整调节网络的权重。这一循环反复进行，权重不断变化。使学习成为可能的数据集称为
    `training set`。在网络训练过程中，权重不断改进的关系，同一个数据集会被多次处理。


    当前业务网络开发包提供资源来监控人工神经网络对其预测正确结果的能力的收敛情况。这些资源使训练例程能够持续数天，直到模型达到所需的统计水平或精度。一些网络 however
    无法学习。这可能是由于输入数据中缺乏可以获得预期输出的具体信息。如果没有足够数量和质量的数据来提供完整学习，网络也无法收敛。为了保留一部分数据集用于测试，必须有足够量的数据集。大多数多节点分层网络可以记忆和存储大量数据。为了监控网络以确定系统是否仅仅以无意义的方式保留训练数据，监督学习需要保存一组数据，并在训练后用于评估系统。


    为了避免无意义的记忆，应减少处理元素的数量。如果网络无法简单地解决该问题，开发人员需要评估输入和输出、层数及其元素、这些层之间的链接、数据传输和训练功能，甚至原始输入权重。这些需要开发有效网络的修改构成了神经网络
    `art` 的体现。需要几种算法来提供在训练过程中进行权重调整所需的迭代反馈。最常用的技术是 `backward-error propagation`，更常被称为
    `back-propagation`。为了确保网络不会 `overtrained`，监督训练必须结合对模型的直观和深思熟虑的分析。人工神经网络最初是根据当前统计数据趋势配置的。随后，它需要继续学习可能从一般角度看是错误的其它数据方面。如果模型训练得当且不需要额外学习，权重可能会
    `frozen`，如果需要的话。在某些模型中，该完成的网络被转换为硬件以提高模型的处理速度。某些机器不会锁定，但会通过在生产环境中的使用继续学习。


    '
