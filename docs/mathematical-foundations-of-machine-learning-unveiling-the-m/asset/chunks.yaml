    # 第 5 章：数据科学生命周期与技术


    术语 `data science` 可追溯至 1960 年，由 `Peter Naur` 提出，他最初将其与计算机科学互换使用，后来引入了 `datalogy`。1974
    年，Naur 在其著作 `Concise Survey of Computer Methods` 中大量使用了该术语。数据科学的当代定义于 1992 年在
    `The Second Japanese-French Statistics Symposium` 提出，认为这是一个关注数据类型、维度和结构的新兴学科。


    数据被定义为由计算机处理和存储的信息，充斥着我们的数字生活。从网站点击到智能手机持续的位置追踪，我们的世界沉浸在数据之中。从这些庞大数据中提取解决方案需要
    `data science` 这一过程，其中见解是通过数学方程和统计学从可测量的数据中得出的。数据科学家的角色多样，常被误认为是计算机科学家或统计学家。任何个人或公司，只要深入挖掘大量数据以获取信息，都可被称为数据科学从业者。例如，像
    `Amazon` 和 `Target` 这样的公司会追踪线下和线上购买行为以提供个性化推荐。像 `Twitter` 和 `Instagram` 这样的社交媒体平台会分析用户提供的数据，识别全球迁移模式。


    ## 数据科学生命周期


    结构化数据科学项目的推荐生命周期是 `Team Data Science Process` (`TDSP`)，广泛用于涉及人工智能或机器学习算法的项目。它可适应
    `exploratory data science` 和 `ad hoc analytics` 项目。`TDSP` 是一种敏捷的顺序迭代，指导在公司生产环境中部署预测模型的任务。团队内部以及与利益相关者之间的有效沟通对于项目的顺利执行至关重要。


    `TDSP` 的基本组成部分包括：


    ### 数据科学生命周期的定义


    `TDSP` 生命周期有五个主要阶段：`Business understanding`、`Data acquisition and understanding`、`modeling`、`deployment`
    和 `customer acceptance`。每个阶段的进一步细节将很快提供。


    ### 标准化项目结构


    共享的目录结构和模板可方便团队成员快速访问项目文档。采用 `TFS`、`Git` 或 `Subversion` 等版本控制系统可增强团队协作。像 `JIRA`、`Rally`
    和 `Azure DevOps` 这样的敏捷项目跟踪系统存储业务需求、任务和功能，有助于资源和成本估算。在版本控制系统上为每个项目创建单独存储，促进有效管理和团队协作。在整个组织中标准化项目结构可建立机构知识库。


    ### 数据科学项目的基础设施和资源


    `TDSP` 推荐使用 `machine learning service`、数据库、`big data clusters` 和基于云的系统等工具来存储数据集。无论是基于云还是本地部署，基础设施都支持可重复性，防止数据重复和冗余。特定的权限和活动跟踪可确保团队成员安全访问资源。


    ![](img/image-zdau73nw.jpg)


    ### 项目执行的工具和实用程序


    在组织流程中实施变更可能具有挑战性。`TDSP` 提供了工具来自动化诸如 `data exploration` 和 `baseline modeling`
    等基本任务。定义良好的结构便于将共享工具和实用程序贡献到团队的 `shared code repository`，促进重用和节省成本。


    基于微软最佳实践和结构的 `TDSP` 生命周期，作为有效团队协作和沟通的标准化模板。它包含一系列实践，以成功交付预测分析解决方案和智能应用。


    `TDSP` 生命周期中每个阶段的细节，包括 `Business understanding`、`Data acquisition and understanding`、`modeling`、`deployment`
    和 `customer acceptance`，将进一步探讨。


    ![](img/image-8aa9s7sl.jpg)


    ## 阶段 I – 业务理解


    初始阶段旨在收集并深入研究被标记为模型目标的关键变量。与这些变量关联的指标将在决定项目的整体成功方面发挥关键作用。本阶段的另一个重要目标是确定公司已拥有或可能需要获取的必要数据源。本阶段必须完成两个主要任务：`defining
    objects and identifying data sources`。


    ### 本阶段需生成的交付物


    `Charter document` – 这是一份 `living document`，需要在项目持续期间根据新的项目发现和不断变化的业务需求进行定期更新。`TDSP`
    `project structure definition` 提供了一个标准模板。在项目过程中逐步通过添加更多细节来完善此文档至关重要，同时及时让利益相关者了解所有修改。


    `Data sources` – 位于 `TDSP` `project data report folder` 中的数据源可在 `Data Definitions
    Report` 的 `Raw Data Sources` 部分访问。该部分不仅指定原始数据的初始和最终位置，还提供诸如将数据传输到任何所需环境的 `coding
    scripts` 等附加详细信息。


    ![](img/image-9zoaczsn.jpg)


    `Data dictionaries` – 由利益相关者提供的有关数据特征和特性的描述，例如 `data schematics` 和可用的 `entity-relationship
    diagrams`，记录在数据字典中。


    ![](img/image-3owb9ssj.jpg)


    '
