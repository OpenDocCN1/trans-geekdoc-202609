- raw: '       Regression         Supervised machine learning encompasses “regression”
    techniques, aiming to predict or describe a specific numerical value based on
    prior information. For instance, predicting property costs based on previous cost
    information for similar characteristics. Regression techniques range from simple,
    such as “linear regression,” to complex options like “regular linear regression,”
    “polynomial regression,” “decision trees,” “random forest regression,” and “neural
    networks,” among others.       The simplest method, “linear regression,” employs
    the mathematical equation (y= m\*x+b) of a line to model data collection. Multiple
    data pairs (x, y) can train a “linear regression” model by calculating the position
    and slope of a line that minimizes the total distance between data points and
    the line. This calculation of slope (m) and y-intercept (b) is utilized for a
    line that provides the closest approximation for data observations. Relationships
    in the data can be modeled using “linear predictor functions,” where unidentified
    model variables are estimated from the data, known as “linear models.” Traditionally,
    if values of explanatory variables or predictors are known, the conditional mean
    of the response is used as the “affinity function” for those values. The use of
    conditional mean and other measures in linear models is uncommon. Like other forms
    of regression analysis, “linear regression” operates on the conditional probability
    distribution of responses rather than the joint probability distribution of variables
    obtained through multivariate analysis.    ![](image-84eynpgd.png)       The most
    thoroughly researched type of regression analysis with broad applicability is
    “linear regression.” This stems from the simplicity of working with models that
    linearly depend on their unidentified parameters, in contrast to non-linearly
    related models. Determining the statistical characteristics of resulting predictors
    is straightforward with a linear distribution. “Linear regression” finds numerous
    practical applications, falling into the following categories:         Forecasting
    and Predictions: If the goal is to generate forecasts, predictions, or minimize
    errors, a predictive model can be aligned with an identified dataset and explanatory
    variables using a linear regression algorithm. Once developed, the fitted model
    easily predicts new input data lacking a response.       Understanding Variations:
    For understanding variations in response variables due to changes in explanatory
    variables, “linear regression analysis” quantifies the relationship between predictors
    and responses. It helps assess whether certain explanatory variables lack a linear
    relationship with the response and identifies subsets of predictors with redundant
    data about response values.         Most “linear regression models” are fitted
    using the “least squares” approach. However, models can also be fitted by reducing
    “lack of fit” using alternative methods like “least absolute deviation regression”
    or by minimizing a penalized version of least squares, as seen in ridge regression
    (L2-norm penalty) and lasso regression (L1-norm penalty). Although “least squares”
    and “linear model” are strongly associated, they are not synonymous.       “Multiple
    Linear Regression” is a prevalent form of “regression” in data science and statistical
    tasks. Like “linear regression,” it involves an output variable “Y.” The difference
    lies in having multiple “X” or independent variables predicting “Y.”       For
    instance, predicting the cost of housing in Washington DC would use “multiple
    linear regression.” Here, the cost of housing in Washington DC is the “Y” or dependent
    variable, and “X” or independent variables include proximity to public transport,
    schooling district, square footage, and rooms, determining the market price of
    housing.       The mathematical equation for this model would be:          housing\_price
    \= β0 \+ β1 sq\_foot \+ β2 dist\_transport \+ β3 num\_rooms          Polynomial
    Regression: Unlike the linear models mentioned earlier, polynomial regression
    introduces a curve to the relationship between “X” and “Y.” It deviates from the
    linear influence of changing “X” values on “Y.”    ![](image-uwtwxjdr.png)       If
    we attempt to model a graph with non-linear features using “linear regression,”
    it won’t provide an optimal fit for the non-linear aspects. For example, the left
    graph in the picture below depicts a scatter plot with an upward trend but a curve.
    A straight line is inadequate in this scenario. Instead, we will create a curved
    line to match the data’s curve using polynomial regression, as illustrated by
    the right chart in the picture below. The polynomial equation resembles the linear
    equation, with the difference being that one or more “X” variables are connected
    to a polynomial expression, such as “Y \= mX2+b.”       Another significant regression
    technique for data researchers is “Support Vector Regression,” commonly used in
    “case classification.” The idea is to find a line in space that separates data
    points into distinct categories, also used for regression analysis. It’s a form
    of “binary classification” unrelated to probability.       “Ridge Regression”
    is widely employed for analyzing multi-collinear datasets. Correctly utilizing
    ridge regression can reduce standard errors and significantly enhance model accuracy.
    It’s especially useful when dealing with highly correlated independent variables,
    as predicting one variable using another can lead to “multi-collinearity.” For
    instance, using variables like height and weight in a model may induce multi-collinearity.       Multicollinearity
    can impact forecast accuracy, and it’s crucial to be mindful of the predictive
    variables used in the model to prevent it. Causes may include data type, collection
    method, or a small variety of independent variables resulting in similar data
    points. Ridge regression can address multicollinearity issues in a linear model
    by introducing a hint of bias, also known as “regularization.”       Another method
    to improve model accuracy is standardizing independent variables. Simplifying
    by setting certain variables to null is not just about making them null but rewarding
    values closer to zero, reducing coefficients and model complexity while maintaining
    all independent variables. This introduces more bias as a trade-off for increased
    prediction accuracy.       Another reduction technique is “LASSO regression,”
    a complement to ridge regression that promotes simpler and leaner models for predictions.
    In lasso regression, coefficients are reduced more rigidly, and it stands for
    the “least absolute shrinkage and selection operator.” It’s used when facing high
    multicollinearity, similar to ridge regression.       An amalgamation of “LASSO”
    and “ridge regression” is “ElasticNet Regression,” aiming to further enhance prediction
    accuracy from LASSO regression. ElasticNet is a confluence of both LASSO and ridge
    regression techniques, rewarding smaller coefficient values. All three designs
    are available in the R and Python “Glmnet suite.”         “Bayesian regression”
    models prove valuable when there is insufficient data or the available data exhibits
    poor distribution. These regression models are constructed based on probability
    distributions rather than individual data points. Consequently, the resulting
    chart takes the form of a bell curve, illustrating variance with the most frequently
    occurring values centered on the curve. In “Bayesian regression,” the dependent
    variable “Y” represents not valuation but rather probability. Instead of predicting
    a specific value, the goal is to estimate the probability of an event occurring.
    This approach aligns with “frequentist statistics,” built upon Bayes’ theorem,
    which hypothesizes the occurrence of an event and its probability of recurring
    in the future.    ![](image-ffif5j2o.jpg)     The concept of “conditional probability”
    is crucial in “frequentist statistics,” pertaining to events whose outcomes are
    dependent on one another. Events can be conditional, meaning a preceding event
    can potentially alter the probability of the next event. For example, drawing
    M&Ms from a bag illustrates conditional probability. If, on the first draw, you
    get a blue M&M from a set of 3 yellow and 3 blue M&Ms, the probability of drawing
    another blue M&M on the next draw is lower. Conversely, an independent event,
    like flipping a coin, doesn’t affect the probability of subsequent coin flips,
    making it unrelated to “conditional probability.”       Moving on to classification,
    the “classification algorithm” in machine learning categorizes new input data
    based on predefined rules established by a training dataset. This dataset comprises
    related data with identified categories. For instance, incoming emails can be
    categorized as “spam” or “non-spam,” and patient diagnoses can be categorized
    based on observed attributes. Classification is a form of pattern recognition
    technology, with hypotheses analyzed into properties, termed “explanatory variables
    or features.” These variables can be “categorical,” like blood groups, “ordinal,”
    like sizes, or involve “integer” or “real values.” Classifiers operate by comparing
    new input with prior observations using a “similarity or distance function.”       In
    statistics, data classification often employs “logistic regression,” where observations’
    characteristics are explanatory variables or regressors, and the predicted categories
    are outcomes. This technique, though named regression, is actually an algorithm
    for classification. It estimates the likelihood of an event based on single or
    multiple input values. For instance, predicting a patient’s likelihood of developing
    diabetes using symptoms, blood glucose level, and family history. The output is
    a probability ranging from ‘1’ to ‘10,’ where ‘10’ implies certainty. If the probability
    exceeds 5, it predicts the patient will have diabetes; otherwise, it predicts
    they won’t. Logistic regression is widely used for binary classification tasks,
    and its name stems from the “logistic function,” an S-shaped curve mapping real-valued
    integers to values between ‘0’ and ‘1,’ created by statisticians to model population
    growth in ecosystems approaching their carrying capacity.”    ![](image-o2s2ik6v.jpg)     Here
    is a graph of figures ranging from \-5 to 5, which has been transformed by the
    logistic function into a range between 0 and 1\.       Similar to the linear regression
    technique, logistic regression utilizes an equation for data representation.       Input
    values (X) are grouped linearly to forecast an output value (Y), with the use
    of weights or coefficient values (presented as the symbol Beta). It is mainly
    different from linear regression because the modeled output value tends to be
    binary (0 or 1) instead of a range of values.       Below is an example of the
    logistic regression equation, where the single input value coefficient (X) is
    represented by ‘b1’, the intercept or bias term is ‘b0’, and the expected result
    is ‘Y’. Every column in the input data set has a connected coefficient ‘b’ with
    it, which should be understood by learning the training data set. The actual model
    representation, stored in a file or in the system memory, would be the coefficients
    in the equation (the beta values).       “y=e^(b0 \+ b1\*x)/(1 +e^(b0 \+ b1\*x))”       The
    logistic regression algorithm’s coefficients (the beta values) must be estimated
    based on the training data. This can be accomplished using another statistical
    technique called maximum-likelihood estimation, a popular ML algorithm utilized
    with a multitude of other ML algorithms. Maximum-likelihood estimation works by
    making certain assumptions about the distribution of the input data set.       An
    ML model that can predict a value nearer to 0 for the other class and a value
    nearer to 1 for the default class can be obtained by employing the best coefficients
    of the model. The underlying assumption for most likelihood of the logistic regression
    technique is that a search procedure attempts to find values for the coefficients
    that will reduce the error in the probabilities estimated by the model pertaining
    to the input data set (e.g. probability of 0 if the input data is not the default
    class).       Without going into mathematical details, it is sufficient to state
    that you will be using a minimization algorithm to optimize the values of the
    best coefficients from your training data set. In practice, this can be achieved
    with the use of an effective numerical optimization algorithm, for example, the
    Quasi-newton technique.         Generating predictions using logistic regression   
         Here, you can simply plug in the measurements into the logistic regression
    equation and calculate the outcome to generate predictions with the logistic regression
    model. Let’s take a look at an example to solidify this concept. Let’s assume
    there is a model that is capable of generating predictions if an individual is
    masculine or woman depending on fictitious values of their height. If the value
    of the height for an individual is set as 150 cm, would the individual be predicted
    as a male or female? Assuming we have already discovered the values of coefficients
    b0 \= \-100 and b1 \= 0.6. By leveraging the above equation, the probability of
    male with a height of 150 cm or P(male|height=150) can be easily calculated. The
    function EXP() will be used for e because if you log this instance into your spreadsheet,
    this is what you can use:       “y \= e^(b0 \+ b1\*X) / (1 \+ e^(b0 \+ b1\*X))”   
         “y \= exp(-100 \+ 0.6\*150) / (1 \+ EXP(-100 \+ 0.6\*X))”         “y \= 0.0000453978687”       Or
    a near 0 probability male is the gender of that specific person. In theory, probability
    can simply be used. But since this is a classification algorithm and we want a
    sharp outcome, the probabilities can be tagged onto a binary class value. For
    instance, the model can predict 0 if P(male) < 0.51 and predict 1 if P(male) \>=
    0.5. Now that you know how predictions can be generated using logistic regression,
    you can easily pre-process the training data set to get the most out of this technique.
    The assumptions made of the distribution and relations within the data set by
    the logistic regression technique are nearly identical to the assumptions made
    in the linear regression technique.       A lot of research has been done to define
    these hypotheses and to use accurate probabilistic and statistical language. It
    is recommended to use these as thumb rules or directives and try with various
    processes for data preparation.       The ultimate goal in predictive modeling
    machine learning initiatives is the generation of highly accurate predictions
    rather than analysis of the outcomes. Considering everything some assumptions
    could be broken if the designed model is stable and has high performance.       Binary
    Output Variable: This may be evident as we have already discussed it earlier,
    but logistic regression is designed specifically for issues with binary (two-class)
    classification. This will generate predictions for the probability of a default
    class instance that can be tagged into a classification of 0 or 1\.       Remove
    Noise: Logistic regression does not assume errors in the output variable (‘y’),
    therefore, the outliers and potentially misclassified cases should be removed
    from the training data set.       Gaussian Distribution: Logistic regression can
    be considered as a type of linear algorithm but with a non-linear transform on
    the output. A linear connection between the output and input variables is also
    assumed. Data transforms of the input variables may lead to a more accurate model
    with a higher capability of revealing the linear relationships of the data set.
    For instance, to better reveal these relationships, we could utilize log, root,
    Box-Cox and other single variable transformations.       Remove Correlated Inputs:
    If you have various highly correlated inputs, the model could potentially be over-fit
    similar to the linear regression technique. To address this issue, you can calculate
    the pairwise correlations between all input data points and remove the highly
    correlated inputs.       Failure to converge: It is likely for the expected likelihood
    estimation method that is trained on the coefficients to fail to converge. It
    could occur if the data set contains several highly correlated inputs or there
    is very limited data (e.g. loads of 0 in the input data).       Naïve Bayes classifier
    algorithm is another classification learning algorithm with a wide variety of
    applications. It is a method of classification derived from the Bayes theorem,
    which assumes predictors are independent of one another. Simply put, a Naïve Bayes
    classifier assumes that all the features in a class are unrelated to the existence
    of any other feature in that class. For instance, if input data has an image of
    a fruit which is green, round, and about 10 inches in diameter, the model can
    consider the input to be a watermelon. Although these attributes rely on one another
    or the presence of a specific feature, all of the characteristics contribute independently
    to the probability that the image of the fruit is that of a watermelon, hence
    it is referred to as Naive. Naïve Bayes model for large volumes of data sets is
    relatively simple to construct and extremely effective.       Naïve Bayes has
    reportedly outperformed even the most advanced techniques of classification, along
    with its simplicity of development. Bayes theorem can also provide the means to
    calculate the posterior probability P(c|x) using P(c), P(x), and P(x). On the
    basis of the equation shown in the picture below, where the probability of c can
    be calculated if x has already occurred.             P(c|x) is the posterior probability
    of class (c, target) provided by the predictor (x, attributes). P(c) is the class’s
    previous probability    ![](image-1xqh7b5t.jpg)       Here is an example to better
    elucidate the application of the “Bayes Theorem.” The diagram below represents
    the dataset regarding the identification of suitable weather days for playing
    golf. The columns portray the weather features of the day, while the rows contain
    individual entries. Examining the initial row of the dataset, one can infer that
    the weather will be excessively hot and humid with rain, making the day unsuitable
    for playing golf. The primary assumption here is that all these features or predictors
    are independent of one another. Another assumption is that all the predictors
    potentially have the same effect on the result. This implies that if the day is
    windy, it would have a relevance to the decision of playing golf similar to the
    impact of rain. In this instance, variable (c) represents the class (playing golf),
    indicating the decision on whether the weather is suitable for golf, and variable
    (x) represents the features or predictors.  '
