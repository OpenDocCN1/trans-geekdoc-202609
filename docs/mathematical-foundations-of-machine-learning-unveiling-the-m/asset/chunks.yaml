    # Semi-Supervised Machine Learning


    “Semi-supervised machine learning algorithms” are highly flexible and can learn
    from both “labeled” and “unlabeled” or raw data. These algorithms represent a
    hybrid of supervised and unsupervised ML algorithms. Typically, the training dataset
    consists predominantly of unlabeled data and a small portion of labeled data.
    The use of analytical methods such as `forecast`, `regression`, and `classification`
    with semi-supervised learning algorithms allows the computer to significantly
    improve its accuracy in learning and training. These algorithms are often employed
    when producing processed and labeled training data from the raw dataset is resource-intensive
    and less cost-effective for the company. Companies use systems with semi-supervised
    learning algorithms to avoid additional personnel and equipment expenses. For
    example, the application of technology for `facial recognition` demands a vast
    quantity of facial data from various sources. Processing, classifying, and labeling
    raw data obtained from sources like internet cameras require substantial resources
    and thousands of hours to create a training dataset.


    ![](image-ux0k48sf.png)


    # Reinforcement Machine Learning


    The reinforcement machine learning algorithm is distinct from previously discussed
    machine learning algorithms. It learns from its environment by performing actions
    and meticulously recording the outcomes, marking them as errors for failed results
    or rewards for excellent ones. Two key features set the reinforcement learning
    algorithm apart: the `trial and error` analysis technique and the `delayed reward`
    feedback loop. The computer consistently analyzes input data through various calculations,
    signaling reinforcement for correct or intended outputs. This iterative process
    creates a feedback loop for assessing, recording, and learning efficient activities,
    optimizing results over time. These algorithms find extensive application in gaming,
    robotics, and navigation systems.


    # Importance of Machine Learning


    The continuous interest in Machine Learning `ML` stems from factors like increasing
    data quantities and varieties, cost-effective computational processing, and affordable
    data storage. ML, along with Artificial Intelligence, forms the core of the `Fourth
    Industrial Revolution`, impacting every aspect of human life. ML’s ability to
    analyze large, complex data sets rapidly and accurately allows businesses to identify
    growth opportunities and mitigate risks. Data-driven strategies, powered by ML,
    play a crucial role in distinguishing successful companies. The automation of
    tasks, such as image recognition and text processing, showcases ML’s transformative
    potential. Machines, exemplified by Google’s DeepMind and OpenAI’s Dota Bot, have
    demonstrated capabilities beyond initial expectations, reshaping the economic
    and social landscape.


    # Repetitive Learning Automation and Information Revelation


    Machine learning, unlike robotic automation, automates computer-oriented tasks
    with adaptability and continuous improvement. ML algorithms learn from data, adapting
    to changing environments and minimizing mistakes. These algorithms, acting as
    classifiers or forecasting tools, develop unique capabilities, such as self-learning
    chess playing or personalized product suggestions. Deep learning models, with
    multiple hidden layers, excel in processing vast data sets, contributing to accuracy
    improvements. The combination of big data analytics and self-learning algorithms
    enhances data’s value, turning it into intellectual property. ML’s ability to
    create thousands of models per week, as opposed to human capacity, accelerates
    innovation and problem-solving.


    # Core Concepts of Machine Learning


    Today, there are various types of machine learning `ML`, but the foundation of
    ML revolves around three key components: `representation`, `evaluation`, and `optimization`.
    Here are some fundamental concepts applicable to all ML types:


    ## Representation


    Machine learning models cannot directly perceive, see, or sense input examples.
    Therefore, data representation is crucial to provide a meaningful perspective
    for the model regarding the main data attributes. Choosing significant characteristics
    that best represent data is essential for effectively training a machine learning
    model. `Representation` simply involves the act of presenting data points to a
    computer in a language it understands, using a set of classifiers. A classifier
    is defined as a model that takes in a vector of discrete and/or continuous function
    values and outputs a single discrete value called a `class`. To learn from the
    represented data, a model must have the desired classifier in the training dataset
    or `hypothesis space` where you want the models to be trained. The data features
    used to represent the input are critical to the machine learning system. Any `classifier`
    external to the hypothesis space cannot be learned by the model. Developing a
    required machine learning model hinges on the essential nature of data characteristics,
    often making the difference between successful and unsuccessful machine learning
    projects.


    ![](image-ndob0e26.png)


    A training dataset with several independent `features` well linked to the `class`
    can significantly ease learning for the machine. On the other hand, it may be
    challenging for the machine to learn from a class with complex functions. This
    often necessitates processing raw data to build the desired features for the ML
    model. Deriving features from raw datasets tends to be the most time-consuming
    and laborious part of an ML project. It is also considered the most creative and
    interesting part, where intuition and `trial and error` play as important a role
    as technical requirements. The ML process is not a `one-shot` process but an iterative
    one requiring analysis of post-execution output, followed by modification of the
    training dataset. Domain specificity is another reason why the training dataset
    requires comprehensive time and effort. A training dataset for predicting consumer
    behavior in an e-commerce platform will be vastly different from the one needed
    for a self-driving car. However, the core machine learning mechanism remains the
    same in industrial sectors. Hence, there is ongoing research to automate the process
    of feature engineering.


    ## Evaluation


    In the context of ML, `evaluation` essentially refers to the method of assessing
    various hypotheses or models to choose one over another. An `evaluation function`
    is required to distinguish effective classifiers from vague ones. The evaluation
    function is also known as the `objective`, `utility`, or `scoring` function. The
    machine-learning algorithm has its internal evaluation function, typically different
    from the researchers’ external evaluation function used to optimize the classifier.
    Usually, the evaluation function is described in the initial phase of the project
    before selecting the data representation tool. For instance, the evaluation function
    for a self-driving car ML model might involve identifying pedestrians at near-zero
    false-negative and low false-positive rates, and this condition needs to be `represented`
    using applicable data features.


    ## Optimization


    The process of exploring the hypothesis space of the represented machine learning
    model to identify the highest-scoring classifier and achieve better evaluation
    is termed `optimization`. For algorithms with more than one optimum classifier,
    selecting the optimization method is crucial in determining the generated classifier
    and achieving a more effective learning model. Various `off-the-shelf optimizers`
    are available to kickstart new machine learning models before replacing them with
    custom-designed optimizers.

    '
