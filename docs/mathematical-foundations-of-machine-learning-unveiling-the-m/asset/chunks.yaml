    relationship with the response and identifies subsets of predictors with redundant
    data about response values.


    Most `linear regression models` are fitted using the `least squares` approach.
    However, models can also be fitted by reducing `lack of fit` using alternative
    methods like `least absolute deviation regression` or by minimizing a penalized
    version of least squares, as seen in ridge regression `L2-norm penalty` and lasso
    regression `L1-norm penalty`. Although `least squares` and `linear model` are
    strongly associated, they are not synonymous.


    `Multiple Linear Regression` is a prevalent form of `regression` in data science
    and statistical tasks. Like `linear regression`, it involves an output variable
