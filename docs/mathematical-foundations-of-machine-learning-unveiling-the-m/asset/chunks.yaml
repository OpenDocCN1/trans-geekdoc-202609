    # Chapter 1: Introduction to Machine Learning


    The concept of `Artificial Intelligence Technology` is rooted in the idea that
    computers can be engineered to demonstrate human-like intelligence and replicate
    human reasoning and learning abilities. This involves adapting to new inputs and
    carrying out tasks without requiring human intervention. The principle of artificial
    intelligence encompasses machine learning.


    `Machine Learning Technology (ML)` refers to the concept of `Artificial Intelligence
    Technology`, primarily focusing on the designed capacity of computers to learn
    explicitly and self-train. This involves identifying information patterns to improve
    the underlying algorithm and making autonomous decisions without human involvement.
    The term “machine learning” was coined in 1959 by the pioneering professor of
    gaming and artificial intelligence, `Arthur Samuel`, during his tenure at `IBM`.


    Machine learning posits that contemporary computers can be trained using targeted
    training datasets, easily tailored to create the required functionality. It employs
    a pattern-recognition method where past interactions and outcomes are recorded
    and revisited in a way that corresponds to its present position. Due to the need
    to process vast volumes of data, with fresh data constantly flowing in, machines
    must adapt to new data without being explicitly programmed by a person, considering
    the iterative aspect of machine learning.


    Machine learning has close relations with the field of `Statistics`, focused on
    generating predictions using advanced computing tools and technologies. The research
    of “mathematical optimization” provides machine learning with techniques, theories,
    and implementation areas. In its application to address business issues, machine
    learning is also referred to as “predictive analytics.” In ML, the “target” is
    known as the “label,” while in statistics, it’s called the “dependent variable.”
    A “variable” in statistics is known as a “feature” in ML. Furthermore, “feature
    creation” in ML is referred to as “transformation” in statistics.


    ML technology is closely related to data mining and optimization. ML and data
    mining often utilize the same techniques with significant overlap. ML focuses
    on generating predictions based on predefined characteristics of the given training
    data, while data mining identifies unknown characteristics in a large volume of
    data. Data mining uses many ML techniques but with distinct objectives. Machine
    learning also uses data mining techniques through “unsupervised learning algorithms”
    or as a pre-processing phase to enhance the prediction accuracy of the model.


    The intersection of these two research areas stems from the fundamental assumptions
    they operate with. In machine learning, efficiency is generally assessed in terms
    of the model’s ability to reproduce known knowledge, while in “knowledge discovery
    and information mining (KDD),” the primary task is to discover new information.
    An “uninformed or unsupervised” technique, evaluated based on known information,
    will be easily outperformed by other “supervised techniques.” Conversely, “supervised
    techniques” cannot be used in a typical “KDD” task due to the lack of training
    data.


    Data optimization is another area closely linked to machine learning. Various
    learning issues can be formulated as the minimization of certain “loss function”
    on a training dataset. “Loss functions” are derived as the difference between
    the predictions generated by the model being trained and the input data values.
    The distinction between the two areas arises from the objective of “generalization.”
    Optimization algorithms aim to decrease the loss of the training dataset, while
    the goal of machine learning is to minimize the loss of input data from the real
    world.


    Machine learning has become such a hot topic that its definition varies across
    the worlds of academia, corporate companies, and the scientific community. Here
    are some commonly accepted definitions from select sources that are widely known:


    “Machine learning is based on algorithms that can learn from data without relying
    on rules-based programming.” – `McKinsey`.


    ![](image-3rhsxwoq.jpg)


    Machine Learning, at its most fundamental, is the practice of employing algorithms
    to analyze data, learn from it, and subsequently make determinations or predictions
    about phenomena in the world.” – `Nvidia`


    “The field of Machine Learning aims to address the question: How can we construct
    computer systems that autonomously enhance their capabilities through experience,
    and what are the fundamental principles governing all learning processes?” – `Carnegie
    Mellon University`


    “Machine learning is the science of enabling computers to act without explicit
    programming.” – `Stanford University`


    ## Types of Machine Learning


    ### Supervised Machine Learning


    “Supervised machine learning” is widely utilized in predictive big data analysis
    because it can assess and apply lessons learned from previous iterations and interactions
    to new datasets. These learning algorithms can label current events based on provided
    instructions, efficiently forecasting and predicting future events. For instance,
    the machine can be programmed to label data points as “R” (Run), “N” (Negative),
    or “P” (Positive). The machine-learning algorithm then labels input data as programmed,
    compares it with the “expected or correct” output, identifies potential modifications,
    and resolves errors to enhance the model’s accuracy. By employing methods like
    “regression,” “prediction,” “classification,” and “boosting of ingredients” to
    train learning algorithms effectively, new input data can be fed to the machine
    as a “target” dataset to shape the learning program as desired. This kick-starts
    the analysis, propelling the learning algorithms to create an “inferred feature,”
    which can generate forecasts and predictions based on output values for future
    events. For example, financial organizations and banks heavily rely on machine-learning
    algorithms to detect credit card fraud and predict the likelihood of a potential
    customer not making timely loan payments.


    ![](image-dsl3qxqx.jpg)


    ### Unsupervised Machine Learning


    In situations where labeled and categorized training datasets are unavailable,
    companies often turn to unsupervised machine learning. “Unsupervised learning
    algorithms” illustrate how machines can produce “inferred features” to reveal
    hidden patterns in an unlabeled and unclassified stack of data. These algorithms
    explore data to define a structure within the data mass. Although unsupervised
    machine learning algorithms are as effective as supervised learning algorithms
    in exploring input data and drawing insights, they cannot identify the correct
    output. These algorithms can define data outliers, provide personalized product
    suggestions, and classify text topics using techniques such as “self-organizing
    maps,” “singular value decomposition,” and “k-means clustering.” For instance,
    in online marketing, unsupervised learning algorithms are commonly used for customer
    identification, segmenting customers into groups with shared shopping attributes,
    and targeting them with similar marketing strategies and campaigns.


    ![](image-t0hmbpbg.jpg)

