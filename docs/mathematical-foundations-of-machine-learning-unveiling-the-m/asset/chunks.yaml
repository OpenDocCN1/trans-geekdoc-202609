    ## Unsupervised Training

    During “unsupervised or adaptive” training, the network receives inputs without
    expected results. The model must autonomously determine how to group input data,
    often termed “self-organization or adaptation.” The concept of unsupervised learning
    remains not fully understood. This adaptability to surroundings holds the promise
    of enabling robots to learn continuously as they encounter new circumstances.
    In real-world scenarios lacking training data, such as military interventions
    requiring novel techniques and weaponry, ongoing research persists. Despite this,
    the majority of neural network work currently revolves around supervised learning
    models.


    Teuvo Kohonen, an electrical engineer at the “Helsinki University of Technology,”
    is a key figure in unsupervised training research. He crafted a self-organizing
    network, also called an “auto-associator,” capable of learning without knowledge
    of expected outcomes. This network, with an unconventional structure, requires
    initialized weights and normalized inputs. Neurons are organized in a “winner-take-all
    fashion.” Kohonen’s ongoing research explores networks designed differently from
    traditional methods like `feed-forward` and `back-propagation`.


    Kohonen’s focus is on organizing neurons within the model’s network. Neurons within
    a domain exhibit “topological organization,” a mathematical concept studying mappings
    between spaces without altering geometric configurations. Kohonen argues that
    the absence of topology in artificial neural network designs oversimplifies them
    compared to real neural networks in the human brain. Advanced self-learning networks
    may become feasible with further study.


    ## Candidate Model Evaluation

    Model evaluation is typically “offline,” comparing predictions against actual
    data using performance indicators. The best model from the testing subset is chosen
    for generating future predictions. Evaluators, such as `ROC` or `PR` curves, are
    applied and stored in a repository. The “Model Evaluation Service” coordinates
    testing using the “Data Segregation API” and evaluators from the “Model Candidate
    repository.” The best model undergoes incremental procedures, hyper-parameter
    optimization, and regularization for deployment. The deployment details are announced
    by the “notification service.”


    ## Model Deployment

    The top-performing machine learning model is selected for “offline” and “online”
    prediction generation. Deploying multiple models simultaneously ensures a smooth
    transition. Historically, language disparities between model operation and construction
    languages posed challenges. Solutions include code translation, creating a DSL,
    micro-services accessible through RESTful APIs, an API-first approach, and containerization.
    Deployment tasks are automated through continuous delivery, ensuring necessary
    files are packaged, models are validated, and final deployment occurs in a running
    container.


    ## Model Scoring

    “Model Scoring” involves generating new values with a given model and input data.
    This term is used interchangeably with “Model Serving.” Scoring results in various
    values, such as product recommendations, numerical values for time series and
    regression models, probability values, alphabetical values, or predicted classes.
    Models deployed in both “offline” and “online” modes must maintain high accuracy
    and performance.


    “Offline” scoring optimizes for large data volumes, producing predictions asynchronously.
    The scoring service prepares data, retrieves features, and stores results in the
    “Score Data Store.” In the “online” mode, a client sends a request to the “Online
    Scoring Service.” The client prepares data, retrieves features, and receives scores
    from the “Score Data Store.” Scoring results may be supplied asynchronously to
    the client through push or poll methods.


    These techniques aim to reduce system response time, such as saving input features
    in a low-read latency in-memory data store or caching offline predictions for
    convenient access.


    ## Performance Monitoring

    A well-defined “performance monitoring solution” is essential for every machine
    learning model. For the “model serving clients,” some data points that you may
    want to observe include:

    Model Identifier

    Deployment date and time

    The number of times the model was served.

    The average, min, and max of the time it took to serve the model.

    The distribution of the features that were utilized.

    The difference between the predicted or expected results and the actual or observed
    results.


    Throughout the model scoring process, this metadata can be computed and subsequently
    used to monitor the model’s performance.


    Another offline pipeline is the “Performance Monitoring Service,” which will be
    notified whenever a new prediction has been served and then proceed to evaluate
    the performance while persisting the scoring result and raising any pertinent
    notifications. The assessment will be carried out by drawing a comparison between
    the scoring results and the output created by the training set of the data pipeline.
    To implement fundamental performance monitoring of the model, various methods
    can be used. Some widely used methods include logging analytics such as Kibana,
    Grafana, and Splunk.


    A low-performing model that is not able to generate predictions at high speed
    will trigger the scoring results to be produced by the preceding model to maintain
    the resiliency of the machine learning solution. A strategy of being incorrect
    rather than being late is applied, implying that if the model requires an extended
    period to time for computing a specific feature, it will be replaced by a preceding
    model instead of blocking the prediction. Furthermore, the scoring results will
    be connected to the actual results as they are accessible. This implies continuously
    measuring the precision of the model, and at the same time, any sign of deterioration
    in the speed of the execution can be handled by returning to the preceding model.
    To connect the distinct versions together, a “chain of responsibility pattern”
    could be utilized. Monitoring the performance of the models is an ongoing method,
    considering that a simple prediction modification can cause a model structure
    to be reorganized. Remember, the advantages of a machine learning model are defined
    by its ability to generate predictions and forecasts with high accuracy and speed
    to contribute to the success of the company.

