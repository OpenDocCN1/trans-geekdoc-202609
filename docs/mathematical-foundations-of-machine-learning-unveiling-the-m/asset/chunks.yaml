    回归

    监督式机器学习涵盖“回归”技术，旨在根据先前信息预测或描述特定数值。 例如，根据相似特征的先前成本信息预测房产成本。 回归技术从简单的 `linear regression`
    到复杂的选项，如 `regular linear regression`、`polynomial regression`、`decision trees`、`random
    forest regression` 和 `neural networks` 等。


    最简单的方法 `linear regression` 采用数学方程 `y = m*x + b` 的直线来建模数据集合。 多个数据对 `x, y` 可以通过计算使数据点与直线之间总距离最小化的直线的位置和斜率来训练
    `linear regression` 模型。 斜率 `m` 和 y 截距 `b` 的计算用于提供对数据观测最接近近似的直线。 数据中的关系可以使用 `linear
    predictor functions` 建模，其中未识别的模型变量是从数据中估计的，称为 `linear models`。 传统上，如果解释变量或预测变量的值已知，则使用响应的条件均值作为这些值的
    `affinity function`。 在线性模型中使用条件均值和其他度量是不常见的。 与其他形式的回归分析一样，`linear regression`
    作用于响应的条件概率分布，而不是通过多元分析获得的变量的联合概率分布。


    ![](img/image-84eynpgd.png)


    经过最深入研究且适用范围最广的回归分析类型是 `linear regression`。 这源于使用线性依赖于其未识别参数的模型时的简单性，与非线性相关模型形成对比。
    使用线性分布确定所得预测器的统计特征是直接的。 `Linear regression` 有许多实际应用，分为以下几类：


    预测和预测

    如果目标是生成预测、预测或最小化误差，则可以使用线性回归算法将预测模型与已识别的数据集和解释变量对齐。 开发后，拟合模型可以轻松预测缺乏响应的新输入数据。


    理解变化

    为了理解由于解释变量的变化而导致的响应变量的变化，`linear regression analysis` 量化了预测变量和响应之间的关系。 它有助于评估某些解释变量是否与响应缺乏线性关系，并识别具有响应值冗余数据的预测变量子集。


    大多数 `linear regression models` 都是使用 `least squares` 方法拟合的。 然而，模型也可以通过使用 `least
    absolute deviation regression` 等替代方法减少 `lack of fit` 来拟合，或通过最小化惩罚版本的最小二乘法拟合，如岭回归
    `L2-norm penalty` 和套索回归 `L1-norm penalty` 所见。 尽管 `least squares` 和 `linear model`
    紧密相关，但它们并不相同。


    `Multiple Linear Regression` 是数据科学和统计任务中 `regression` 的常见形式。 与 `linear regression`
    一样，它涉及输出变量 `Y`。 不同之处在于有多个 `X` 或自变量来预测 `Y`。


    例如，预测华盛顿特区住房成本将使用 `multiple linear regression`。 在这里，华盛顿特区住房成本是 `Y` 或因变量，而 `X`
    或自变量包括靠近公共交通、学区、平方英尺和房间数，决定住房的市场价格。


    该模型的数学方程为：

    ```

    housing_price = β0 + β1 sq_foot + β2 dist_transport + β3 num_rooms

    ```


    多项式回归

    与前面提到的线性模型不同，多项式回归引入了 `X` 与 `Y` 之间关系的曲线。 它偏离了 `X` 值变化对 `Y` 的线性影响。


    ![](img/image-uwtwxjdr.png)


    如果我们尝试使用 `linear regression` 对具有非线性特征的图形建模，它不会为非线性方面提供最佳拟合。 例如，下图左侧的散点图显示了向上趋势但呈曲线。
    在这种情况下，直线是不够的。 相反，我们将使用多项式回归创建一条曲线以匹配数据的曲线，如下图右侧所示。 多项式方程类似于线性方程，不同之处在于一个或多个 `X`
    变量连接到多项式表达式，例如 `Y = mX2 + b`。


    数据研究人员的一项重要回归技术是 `Support Vector Regression`，通常用于 `case classification`。 思路是在空间中找到一条线，将数据点分离为不同的类别，也用于回归分析。
    它是一种与概率无关的 `binary classification` 形式。


    `Ridge Regression` 广泛用于分析多重共线性数据集。 正确使用岭回归可以减少标准误差并显著提高模型准确性。 当处理高度相关的自变量时尤其有用，因为使用另一个变量预测一个变量可能导致
    `multi-collinearity`。 例如，在模型中使用高度和体重等变量可能会导致多重共线性。


    多重共线性会影响预测准确性，必须注意模型中使用的预测变量以防止它。 原因可能包括数据类型、收集方法或自变量种类较少导致相似的数据点。 岭回归可以通过引入一点偏差，也称为
    `regularization`，来解决线性模型中的多重共线性问题。


    提高模型准确性的另一种方法是标准化自变量。 通过将某些变量设为 null 来简化不仅仅是使它们为 null，而是奖励更接近零的值，减少系数和模型复杂性，同时保留所有自变量。
    这引入了更多偏差作为提高预测准确性的权衡。


    另一种减少技术是 `LASSO regression`，是岭回归的补充，促进更简单、更精简的预测模型。 在套索回归中，系数被更严格地减少，它代表 `least
    absolute shrinkage and selection operator`。 当面临高多重共线性时使用，与岭回归类似。


    `LASSO` 和 `ridge regression` 的结合是 `ElasticNet Regression`，旨在进一步提高 LASSO 回归的预测准确性。
    ElasticNet 是 LASSO 和岭回归技术的融合，奖励较小的系数值。 这三种设计都可在 R 和 Python `Glmnet suite` 中获得。


    当数据不足或可用数据分布不佳时，`Bayesian regression` 模型被证明很有价值。 这些回归模型是基于概率分布而不是单个数据点构建的。 因此，
    resulting 图表呈钟形曲线，显示方差，最频繁出现的值集中在曲线上。 在 `Bayesian regression` 中，因变量 `Y` 代表的不是估值而是概率。
    而不是预测特定值，目标是估计事件发生的概率。 这种方法符合基于贝叶斯定理构建的 `frequentist statistics`，该定理假设事件的发生及其未来再次发生的概率。


    ![](img/image-ffif5j2o.jpg)


    `conditional probability` 的概念在 `frequentist statistics` 中至关重要，涉及结果相互依赖的事件。 事件可能是有条件的，意味着前一个事件可能会改变下一个事件的概率。
    例如，从袋子中抽取 M&M 糖说明了条件概率。 如果第一次抽取时从 3 个黄色和 3 个蓝色 M&M 中得到一个蓝色 M&M，则下一次抽取另一个蓝色 M&M
    的概率会降低。 相反，像抛硬币这样的独立事件不会影响后续抛硬币的概率，使其与 `conditional probability` 无关。


    接下来是分类，机器学习中的 `classification algorithm` 根据训练数据集建立的预定义规则对新的输入数据进行分类。 该数据集包含具有已识别类别的相关数据。
    例如，传入的电子邮件可以分类为 `spam` 或 `non-spam`，患者的诊断可以根据观察到的属性进行分类。 分类是一种模式识别技术，其中假设分析为属性，称为
    `explanatory variables or features`。 这些变量可以是 `categorical`，如血型，`ordinal`，如尺寸，或涉及
    `integer` 或 `real values`。 分类器通过使用 `similarity or distance function` 将新输入与先前观察结果进行比较来操作。


    在统计学中，数据分类通常采用 `logistic regression`，其中观测特征是解释变量或回归量，预测类别是结果。 这种技术虽然名为回归，但实际上是分类算法。
    它根据单个或多个输入值估计事件发生的可能性。 例如，使用症状、血糖水平和家族史预测患者患糖尿病的可能性。 输出是 `1` 到 `10` 之间的概率，其中 `10`
    表示确定性。 如果概率超过 5，则预测患者将患糖尿病；否则预测不会。 Logistic 回归广泛用于二元分类任务，其名称源于 `logistic function`，即
    S 形曲线，将实值整数映射到 `0` 和 `1` 之间的值，由统计学家创建以模拟生态系统中接近其承载能力的种群增长。


    ![](img/image-o2s2ik6v.jpg)


    这里是一个从 `-5` 到 `5` 的数字图，已通过 logistic 函数转换为 `0` 到 `1` 之间的范围。


    与线性回归技术类似，逻辑回归使用方程来表示数据。


    输入值 `X` 线性分组以预测输出值 `Y`，使用权重或系数 `Beta`。 它主要与线性回归不同，因为建模的输出值往往是二元的 `0` 或 `1` 而不是一系列值。


    下面是逻辑回归方程的示例，其中单个输入值系数 `X` 由 `b1` 表示，截距或偏置项为 `b0`，预期结果为 `Y`。 输入数据集中的每一列都有一个与其关联的系数
    `b`，这应该通过学习训练数据集来理解。 实际模型表示，存储在文件或系统内存中，将是方程中的系数 `beta values`。


    ```

    y = e^(b0 + b1*x) / (1 + e^(b0 + b1*x))

    ```


    逻辑回归算法的系数 `beta values` 必须根据训练数据进行估计。 这可以通过另一种称为最大似然估计的统计技术来实现，这是一种流行的 ML 算法，可与其他多种
    ML 算法一起使用。 最大似然估计通过对输入数据集的分布做出某些假设来工作。


    通过使用模型的最佳系数，可以获得可以预测默认类别附近的值接近 `1` 且对其他类别的值接近 `0` 的 ML 模型。 逻辑回归技术大多数似然的潜在假设是，搜索过程尝试找到系数的值，以减少模型对输入数据集估计的概率的误差
    `e.g. probability of 0 if the input data is not the default class`。


    无需深入数学细节，就足以说你将使用最小化算法来优化训练数据集的最佳系数的值。 实际上，这可以使用有效的数值优化算法来实现，例如 Quasi-newton 技术。


    使用逻辑回归生成预测


    在这里，你只需将测量值代入逻辑回归方程并计算结果即可使用逻辑回归模型生成预测。 让我们看一个例子来巩固这一概念。 假设有一个模型可以根据个人身高的虚构值预测个人是男性还是女性。
    如果个人的身高值设为 `150 cm`，该个人会被预测为男性还是女性？ 假设我们已经发现系数的值 `b0 = -100` 和 `b1 = 0.6`。 利用上述方程，可以轻松计算身高为
    `150 cm` 的男性概率或 `P(male|height=150)`。 `EXP()` 函数将用于 `e`，因为如果你将此实例记录到电子表格中，这就是你可以使用的内容：


    ```

    y = e^(b0 + b1*X) / (1 + e^(b0 + b1*X))

    ```


    ```

    y = exp(-100 + 0.6*150) / (1 + EXP(-100 + 0.6*X))

    ```


    ```

    y = 0.0000453978687

    ```


    或接近 `0` 的男性概率是该特定人的性别。 从理论上讲，概率可以简单使用。 但由于这是一种分类算法，我们想要一个明确的结果，概率可以标记到二元类别值。 例如，模型可以预测
    `0` 如果 `P(male) < 0.51` 且预测 `1` 如果 `P(male) >= 0.5`。 现在你知道如何使用逻辑回归生成预测，你可以轻松预处理训练数据集以充分利用这种技术。
    逻辑回归技术对数据集中的分布和关系所做的假设几乎与线性回归技术所做的假设相同。


    已经做了大量研究来定义这些假设并使用准确的概率和统计语言。 建议将这些作为经验法则或指令，并尝试各种数据准备过程。


    预测建模机器学习项目的最终目标是生成高度准确的预测而不是分析结果。 考虑到一切，如果设计的模型稳定且性能高，一些假设可能会被打破。


    二元输出变量

    这可能显而易见，因为我们已经讨论过它，但逻辑回归专门设计用于具有二元 `two-class` 分类的问题。 这将生成默认类别实例的概率预测，可以标记为 `0`
    或 `1` 的分类。


    去除噪声

    逻辑回归不假设输出变量 `y` 中的误差，因此应从训练数据集中删除异常值和潜在的错误分类案例。


    高斯分布

    逻辑回归可以被视为一种线性算法，但输出上有非线性变换。 也假设输出和输入变量之间存在线性连接。 输入变量的数据转换可能导致更准确的模型，更能揭示数据集的线性关系。
    例如，为了更好地揭示这些关系，我们可以使用 `log`、`root`、`Box-Cox` 和其他单变量转换。


    删除相关输入

    如果你有各种高度相关的输入，模型可能会像线性回归技术一样过拟合。 为了解决这个问题，你可以计算所有输入数据点之间的成对相关性并删除高度相关的输入。


    收敛失败

    训练系数所期望的最大似然估计方法可能无法收敛。 如果数据集包含几个高度相关的输入或数据非常有限 `e.g. loads of 0 in the input
    data`，则可能发生这种情况。


    `Naïve Bayes classifier algorithm` 是另一种具有广泛应用的分类学习算法。 它是一种基于贝叶斯定理的分类方法，假设预测变量彼此独立。
    简单地说，朴素贝叶斯分类器假设一个类别中的所有特征都与该类别中的任何其他特征的存在无关。 例如，如果输入数据具有绿色、圆形且直径约为 `10 inches`
    的水果图像，模型可以认为输入是西瓜。 尽管这些属性相互依赖或特定特征的存在，所有特征都独立地有助于图像水果是西瓜的概率，因此被称为朴素。 对于大量数据集，朴素贝叶斯模型相对简单构建且极其有效。


    据报道，`Naïve Bayes` 甚至超过了最先进的分类技术，其开发的简单性。 贝叶斯定理还可以提供计算后验概率 `P(c|x)` 使用 `P(c)`、`P(x)`
    和 `P(x)` 的手段。 根据下图所示方程，如果 `x` 已经发生，可以计算 `c` 的概率。


    `P(c|x)` 是由预测变量 `x, attributes` 提供的类别 `c, target` 的后验概率。 `P(c)` 是类别的先验概率


    ![](img/image-1xqh7b5t.jpg)


    这里有一个例子来更好地阐明 `Bayes Theorem` 的应用。 下图表示了关于识别适合打高尔夫球的天气日的的数据集。 列描绘了当天的天气特征，而行包含单个条目。
    检查数据集的第一行，可以推断天气将非常炎热潮湿且有雨，使这一天不适合打高尔夫球。 这里的主要假设是所有这些特征或预测变量彼此独立。 另一个假设是所有预测变量可能对结果具有相同的效果。
    这意味着如果当天有风，它对打高尔夫球决定的相关性将与雨的影响相似。 在这种情况下，变量 `c` 表示类别 `playing golf`，表示天气是否适合高尔夫的决定，而变量
    `x` 表示特征或预测变量。


