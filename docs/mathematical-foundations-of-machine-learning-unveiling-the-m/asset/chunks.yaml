    # 一致收敛对可学习性的影响


    如果假设类中假设的经验风险以分布无关的速率一致收敛到其总体风险，则认为一致收敛适用于学习问题：


    `sup_D E_{S∼D^m}[sup_{h∈H} |F(h)−F_S(h)|] → 0` as `m→∞`


    很容易证明，如果一致收敛成立，则该问题可使用 `ERM` 学习规则被视为可学习。


    ## VC 维度和二元分类


    1971 年，Chervonenkis 和 Vapnik 证明了对于二元分类问题，其中 `Z = X × {0, 1}`，每个假设是从 `X` 到 `{0,
    1}` 的映射，且 `f(h; (x, y)) = 1{h(x)≠y}`，一个简单的组合度量即 `VC dimension` 的有限性表明了一致收敛。


    此外，还可以确认，在分布无关的意义上，具有无限 `VC-dimension` 的二元分类问题无法被学习。作为学习的必要且充分条件，这确定了具有有限 `VC-dimension`
    的情况，因此是一致收敛。


    ## 扩展到回归


    这种表征也可以扩展到“回归”技术，即“平方损失回归，其中 `h` 现在是实值函数，且 `f = −`。具有“所有有限尺度上的有限 fat-shattering
    dimension”的性质可以替代具有“有限 VC 维度”的性质，但基本等价性仍然包含，然而，只有在存在一致收敛的情况下问题才能被学习。这些发现通常基于对二元分类的合理归约。即使如此，所观察到的“一般学习设定”并不像分类和回归那样具体，包括难以将分类简化为二元分类的场景。


    ## 严格一致性


    1998 年，Vapnik 试图描述“在一般学习设定中，使用 `ERM` 学习规则的可学习性等价于一致收敛”，以加强一致收敛在此设定中的必要性，同时指出该结果可能不适用于“平凡”情况。具体来说，涉及“任意学习问题，其假设类为
    `H` 并向 `H` 添加单个假设 `h̃` 使得 `f < inf f` 对所有 `z ∈ Z` 成立”的情况，如下图所示。这种学习问题可以被“平凡地”使用“`ERM`
    学习规则”学习，该规则始终选择 `h̃`。尽管如此，“`H`”可以是任意复杂且无先验假设且无一致收敛的。必须注意，这不适用于二元分类模型，其中 `(h; (x,
    y)) =` 因为在任何情况下都存在假设使得 `= f` 因此，如果是高度复杂且具有无限“`VC dimensions`”，则多个假设将在任何给定训练数据集上具有“0”经验误差。


    为了消除此类“平凡”场景，Vapnik 引入了“严格一致性”的概念作为一致性的更稳健版本。它用下面的方程定义，其中收敛在概率内。


    `∈ R, inf − inf`


    其思想是 `ERM` 的经验风险对于最小潜在风险的收敛至关重要，即使在移除风险低于阈值的“好”假设之后。Vapnik 成功证明了 `ERM` 的这种“严格一致性”确实等价于概率意义下的均匀收敛，如下所示。


    `sup (F(h) − F_S(h)) → 0` as `m→∞`


    这项研究表明，除平凡情况外，一致收敛性质确实表征了可学习性，至少在使用 `ERM` 学习规则时如此。

    '
