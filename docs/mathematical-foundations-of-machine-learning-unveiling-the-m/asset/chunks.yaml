    # 第 4 章：通过一致收敛进行学习


    统计学习理论的核心关注点在于刻画模型的学习能力。在由“监督分类和回归”技术驱动的模型背景下，可学习性取决于经验风险到总体风险的“一致收敛”。这意味着一个问题是可学习的，如果它可以通过最小化数据的经验风险来训练。在统计渐近理论和概率论中，“概率一致收敛”是一种收敛类型，表明在特定情况下经验频率在特定事件族内收敛到理论概率。这一概念是统计学习理论不可或缺的一部分，在机器学习中具有广泛的应用。被定义为“在数学分析领域中比逐点收敛更强的一种收敛模式”，一致收敛发挥着关键作用。


    1995 年，Vapnik 发表了《学习的一般设定》，讨论了统计背景下模型的可学习性。该框架使用“假设类 `H`”、具有σ-代数的实例集 `Z`，以及一个目标函数（例如损失或成本）表示为“`f:
    H × Z→ R`”来定义学习问题。目标是在假设类 `H` 上最小化总体风险泛函，其中 `Z` 的分布 `D` 未知，基于从 `D` 中抽取的样本 `z1,…,zm`。


    `F \= \[f`


    这一一般设定涵盖了多种技术，包括监督分类和回归、无监督学习算法以及密度估计。在监督学习中，其中 `z \= (x, y)` 是一个实例-标签对，`h` 是一个预测器，且
    `f (h; (x, y)) \= loss(h(x), y)` 是损失函数，目标是在仅基于有限样本 `z1,…zm` 的实验精度范围内最小化“`F (h)
    \= EZ∼D \[f (h;Z)\]`”。这里的重点不是计算方面，而是仅基于样本 `z1,…zm` 实现统计最小化。


    普遍认为，监督分类和回归问题只有当整个 `h ∈ H` 的经验风险一致收敛到总体风险时才可学习。根据 Blumer (1989) 和 Alon (1997)
    的研究，如果一致收敛成立，则经验风险最小化器 (ERM) 是相合的，这意味着 ERM 的总体风险收敛到最优总体风险，使得问题可通过 ERM 学习。这确立了经验风险的“一致收敛”作为可学习性的必要且充分条件，类似于具有有限“VC-维”的分类算法和具有有限“fat-shattering
    维”的回归算法的“组合条件”。


    除了“一致收敛”之外，还提出了“稳定性”的特定概念作为可学习性的先决条件。这些概念评估学习规律或算法对训练数据集波动的敏感性。特别是 ERM 稳定性被认为足以保证可学习性。根据“Mukherjee
    et al. (2006)”，稳定性对学习至关重要，其理解是稳定性仅在一致收敛刻画学习技能的地方刻画学习技能。


    一致收敛与学习等价性仅在监督分类和回归环境中正式确立。其含义扩展到有限 fat-shattering 维度、一致收敛和 ERM 稳定性，使其适用于使用 ERM
    的可学习性。Vapnik 的工作揭示了与 ERM 相关联的“非平凡”或“刚性”可学习性的概念对应于经验风险的一致收敛，解决了学习的某些“平凡”问题，这些问题可以在没有一致收敛的情况下学习。即使存在这些问题，经验风险最小化也可以促进学习。因此，在一般学习设定或监督分类和回归中，一个问题似乎只有在它可以通过经验风险最小化学习时才可学习。


    该框架虽然不十分具体，但足以涵盖优化和统计学习问题的重要部分，例如希尔伯特空间中的随机凸优化、密度估计、欧几里得空间中的 K-means 聚类、再生核希尔伯特空间
    (RKHS) 中的大间隔分类、回归和二元分类。


    在此设定中的最终目标是基于有限数量的样本选择一个假设 `h ∈ H`，使其潜在风险最小。假设使能够选择此类假设的学习准则是一致的。形式上，“规则 A”在分布“`D`”下以速率“`εcons(m)`”被认为是相合的，如果对于所有“`m`”，其中“`F\*
    \= infh∈H F(h)`”，速率 `ε(m)` 随“`εcons(m) → 0`”单调递减。


    由于分布 `D` 未知，选择一个“`D`-based”学习规则是不切实际的。相反，需要更强的条件，确保该规则在 `Z` 上的所有分布 `D` 下都以速率 `εcons(m)`
    相合。关键定义指出，“学习问题是可学习的，如果存在一个学习规则 A 和一个单调递减的 m→∞ 序列 `εcons(m)`，使得 `εcons(m) → 0`，且
    ∀D, ES∼Dm \[F(A(S)) − F\*\] ≤ εcons(m)。满足此条件的学习规则 A 被记为普遍相合学习规则。”


    这一可学习性定义，要求在所有分布上具有统一速率，是研究假设类可学习性的最合适概念。它是对“agnostic PAC-learnability”到“Vapnik
    的学习一般设定”的直接推广，如 Haussler 在 1992 年所研究的那样。通往学习的潜在路径涉及最小化在样本“`S`”上的经验风险“`FS(h)`”，定义为


    “`FS ( h ) \= 1/m ∑ f ( h ; z ).`”


    ![](img/image-7i6g21py.jpg)


    “规则是风险最小化器”如果它能够最小化经验风险


    \= \= inf


    其中 \= 被称为“最小经验风险”。鉴于有多个假设最小化经验风险的可能性，不涉及某个特定假设，并且可能存在多个规则都是“ERM”。


    因此，“规则 A”可以被断定为在分布 D 下以速率“(渐近经验风险最小化器)”时：


    “`ES∼Dm`


