  trans: "\n\n# 无需一致收敛的可学习性\n\n“随机凸优化”或无需一致收敛的可学习性问题可以被视为上面解释的“通用学习设定”的一种特例，其中包括额外的限制，即“目标函数对每个\
    \ `h` 都是 Lipschitz 连续且凸的，并且 `H` 是闭的、凸的且有界的”。其中是希尔伯特空间的子集的问题将在此处讨论。\n\n一个特例是“熟悉的线性预测设定，其中\
    \ `z = y` 是一个实例-标签对，每个假设 `h` 属于希尔伯特空间的子集 `H`，并且 `f y) = l( , y)` 对于某个特征映射 `φ`\
    \ 和损失函数 `l : R × Y →` 而言成立，该损失函数关于其第一个参数是凸的”。\n\n该设定已成功建立，其中对的随机依赖是线性的，类似于前一个示例，已成功建立。当“域\
    \ `H`”和“映射 `φ`”有界时，存在一致收敛，这意味着 `−` 在总体 `∈ H` 上一致有界”。这种对的一致收敛验证了经验最小化器 `=arg` 的选择，并确保期望值收敛到最优值\
