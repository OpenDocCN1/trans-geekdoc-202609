    # Stage II – Data Acquisition and Understanding


    The objective of this stage is to generate a high-quality processed dataset with
    well-defined relationships to the model targets and establish the data set’s location
    in the required analytics environment. Additionally, the development of the “solution
    architecture” for the data pipeline, enabling regular updates and scoring of the
    data, is crucial. The three primary tasks to be accomplished during this stage
    are: `Data Ingestion`, `Data Exploration`, and `Data Pipeline Setup`.


    ## Data Ingestion


    This phase involves setting up the process required to transfer data from the
    source location to the target location. The determination of target locations
    is based on environments that facilitate analytical activities such as training
    and predictions.


    ## Data Exploration


    Before the data set can be used to train the data models, it must undergo scrubbing
    to remove discrepancies and errors. To assess data quality and gather necessary
    information for processing the data before modeling, tools like data summarization
    and visualization should be employed. Given the repetitive nature of this process,
    an automated utility named `IDEAR`, provided by `TDSP`, can be utilized for data
    visualization and the creation of data summary reports. Achieving satisfactory
    quality of processed data allows for the observation of inherent data patterns,
    aiding in the selection and development of an appropriate `predictive model` for
    the target. It is crucial at this point to assess if the required amount of data
    is available to initiate the modeling process, which is iterative and may necessitate
    the identification of new data sources for increased relevance and accuracy.


    ## Setting Up a Data Pipeline


    To complement the iterative process of data modeling, a standard process for scoring
    new data and refreshing the existing data set must be established through the
    setup of a `data pipeline or workflow`. The solution architecture of the data
    pipeline should be developed by the end of this stage. Three types of pipelines
    can be used based on business needs and constraints: `batch-based`, `real-time
    or streaming`, and `hybrid`.


    ### Deliverables in this stage


    **Data Quality Report:** This report must include a `data summary`, the relationship
    between business requirements and their attributes, and variable ranking, among
    other details. The `IDEAR` tool provided with `TDSP` is capable of generating
    data quality reports in various formats like a relational table, CSV file, or
    any other tabular data set.


    **Solution Architecture:** A description or diagram of the data pipeline used
    to score new data and generate predictions after the model has been built is referred
    to as `solution architecture`. This diagram can also outline the data pipeline
    needed to `retrain` the model based on new data.


    **Checkpoint Decision:** Before commencing the actual model-building process,
    the project must be reevaluated to determine if the expected value can be achieved.
    These evaluations are also known as `Go or No-Go` decisions.


    # Stage III – Modeling


    The objective of this stage is to identify `optimal data features` for the machine
    learning model, ensuring it is informative enough to predict target variables
    accurately and can be deployed in the production environment. The three primary
    tasks in this stage are: `Feature Engineering`, `Model Training`, and `Determination
    of Model Suitability for the Production Environment`.


    ### Deliverables in this stage


    **Feature Sets:** This document contains all the features described in the `feature
    sets` section of the data definition report. It is heavily used by programmers
    to write the required code and develop features based on descriptions provided
    in the document.


    **Model Report:** This document must contain details of each model evaluated,
    following a standard template report.


    **Checkpoint decisions** – A decision regarding deployment of the model to the
    production environment must be made based on the performance of different models.


    # Stage IV – Deployment


    The objective of this stage is to introduce the solution models to a lower production-like
    environment, such as a pre-production environment and a user acceptance testing
    environment, before eventually deploying the model in the production environment.
    The primary task to be achieved in this stage is the `operationalization of the
    model`.


    ## Operationalize the model


    Once a set of models with expected performance levels is obtained, these models
    can then be operationalized for other applicable applications. According to the
    business requirements, predictions can be made in real-time or on a batch basis.
    To deploy the model, they must be integrated with an open `Application Programming
    Interface` (`API`) to allow interaction of the model with all other applications
    and its components, as needed.


    ### Deliverables to be created in this stage


    A dashboard report using key performance indicators and metrics to assess the
    health of the system.


    A document or runbook with the details of the deployment plan for the final model.


    A document containing the solution architecture of the final model.


    # Stage V – Customer Acceptance


    The goal of this stage is to ensure that the final solution for the project meets
    the expectations of the stakeholders and fulfills the business requirements gathered
    during Stage I of the Data Science lifecycle. The two primary tasks that must
    be accomplished in this stage are `system validation and project hand-off`.


    ### Deliverables to be created in this stage


    The most important document created during this stage is for the stakeholders
    and is called the `exit report`. The document contains all the available details
    of the project that are significant to provide an understanding of the operations
    of the system. `TDSP` supplies a standardized template for the `exit report`,
    which can be easily customized to cater to specific stakeholder needs.

    '
  trans: '


    # 第二阶段 – 数据获取与理解


    本阶段的目标是生成一个高质量的处理数据集，使其与模型目标具有明确的关系，并确定数据集在所需分析环境中的位置。此外，开发数据管道的“解决方案架构”以实现数据的定期更新和评分也至关重要。本阶段需要完成三个主要任务：`Data
    Ingestion`、`Data Exploration` 和 `Data Pipeline Setup`。


    ## 数据摄取


    此阶段涉及设置将数据从源位置传输到目标位置所需的过程。目标位置的确定基于便于分析活动（如训练和预测）的环境。


    ## 数据探索


    在数据集可用于训练数据模型之前，必须对其进行清理以去除不一致和错误。为了评估数据质量并收集在建模前处理数据所需的信息，应采用数据汇总和可视化等工具。鉴于该过程的重复性，可以使用名为
    `IDEAR` 的自动化工具，该工具由 `TDSP` 提供，用于数据可视化和创建数据汇总报告。实现处理数据的满意质量后，可以观察到固有的数据模式，有助于为目标选择和开发合适的
    `predictive model`。此时至关重要的是评估是否有足够数量的数据来启动建模过程，建模过程是迭代的，可能需要识别新的数据源以提高相关性和准确性。


    ## 设置数据管道


    为了补充数据建模的迭代过程，必须通过设置 `data pipeline or workflow` 来建立对新数据进行评分和刷新现有数据集的标准流程。数据管道的解决方案架构应在该阶段结束前开发完成。根据业务需求和限制，可以使用三种类型的数据管道：`batch-based`、`real-time
    or streaming` 和 `hybrid`。


    ### 本阶段的交付成果


    **Data Quality Report:** 该报告必须包括 `data summary`、业务需求与其属性之间的关系、变量排名等其他细节。`TDSP`
    提供的 `IDEAR` 工具能够以关系表、CSV 文件或任何其他表格数据集等多种格式生成数据质量报告。


    **Solution Architecture:** 对用于在模型构建后对新数据进行评分和生成预测的数据管道的描述或图表被称为 `solution architecture`。该图表还可以概述基于新数据
    `retrain` 模型所需的数据管道。


    **Checkpoint Decision:** 在开始实际的模型构建过程之前，必须重新评估项目以确定是否能够实现预期价值。这些评估也被称为 `Go or
    No-Go` 决策。


    # 第三阶段 – 建模


    本阶段的目标是为机器学习模型识别 `optimal data features`，确保其信息量足够准确预测目标变量，并且可以在生产环境中部署。本阶段的三个主要任务是：`Feature
    Engineering`、`Model Training` 和 `Determination of Model Suitability for the Production
    Environment`。


    ### 本阶段的交付成果


    **Feature Sets:** 该文档包含数据定义报告中 `feature sets` 部分描述的所有特征。程序员在编写所需代码并根据文档中提供的描述开发特征时
    heavily 使用它。


    **Model Report:** 该文档必须包含每个被评估模型的详细信息，遵循标准模板报告。


    **Checkpoint decisions** – 必须根据不同模型的性能做出将模型部署到生产环境的决定。


    # 第四阶段 – 部署


    本阶段的目标是在最终将模型部署到生产环境之前，将解决方案模型引入类似生产的较低环境，例如预生产环境和用户验收测试环境。本阶段需要完成的主要任务是 `operationalization
    of the model`。


    ## 运营化模型


    一旦获得了一组具有预期性能水平的模型，这些模型就可以为其他适用应用进行运营化。根据业务需求，预测可以实时进行或按批进行。为了部署模型，它们必须与开放的 `Application
    Programming Interface` (`API`) 集成，以便模型能够根据需要与其他所有应用程序及其组件进行交互。


    ### 本阶段需创建的交付成果


    使用关键绩效指标和指标来评估系统健康状况的仪表板报告。


    一份包含最终模型部署计划详细信息的文档或运行手册。


    一份包含最终模型解决方案架构的文档。


    # 第五阶段 – 客户验收


    本阶段的目标是确保项目的最终解决方案满足利益相关者的期望并满足在数据科学生命周期第一阶段收集的业务需求。本阶段必须完成的两个主要任务是 `system validation
    and project hand-off`。


    ### 本阶段需创建的交付成果


    本阶段创建的最重要文档是面向利益相关者的，称为 `exit report`。该文档包含项目的所有可用细节，这些细节对于理解系统的运行至关重要。`TDSP`
    为 `exit report` 提供了标准化模板，可轻松定制以满足特定的利益相关者需求。


    '
