    # 第 1 章：机器学习简介


    `Artificial Intelligence Technology` 的概念植根于这样一种思想：计算机可以被设计成表现出类人智能并复制人类的推理和学习能力。这涉及适应新的输入并在无需人工干预的情况下执行任务。人工智能的原则涵盖了机器学习。


    `Machine Learning Technology (ML)` 指的是 `Artificial Intelligence Technology` 的概念，主要侧重于计算机被设计为能够显式学习和自我训练的能力。这涉及识别信息模式以改进底层算法，并在没有人工参与的情况下做出自主决策。“机器学习”一词由游戏和人工智能的先驱教授
    `Arthur Samuel` 于 1959 年在其在 `IBM` 任职期间创造。


    机器学习认为，当代计算机可以使用有针对性的训练数据集进行训练，这些数据集很容易定制以创建所需的功能。它采用模式识别方法，其中过去的交互和结果会被记录并以与当前位置相对应的方式重新审视。由于需要处理庞大的数据量，且新鲜数据不断流入，机器必须适应新数据，而无需由人显式编程，考虑到机器学习的迭代方面。


    机器学习与 `Statistics` 领域关系密切，该领域专注于使用先进的计算工具和技术生成预测。“数学优化”的研究为机器学习提供了技术、理论和实现领域。在应用于解决业务问题时，机器学习也被称为“预测分析”。在
    ML 中，“目标”被称为“标签”，而在统计学中，它被称为“因变量”。统计学中的“变量”在 ML 中被称为“特征”。此外，ML 中的“特征创建”在统计学中被称为“转换”。


    ML 技术与数据挖掘和优化密切相关。ML 和数据挖掘通常使用相同的技术且重叠显著。ML 专注于根据给定训练数据的预定义特征生成预测，而数据挖掘则在大量数据中识别未知特征。数据挖掘使用许多
    ML 技术，但目标不同。机器学习还通过“无监督学习算法”或作为预处理阶段使用数据挖掘技术，以增强模型的预测准确性。


    这两个研究领域的交集源于它们所遵循的基本假设。在机器学习中，效率通常以模型重现已知知识的能力来评估，而在“知识发现和信息挖掘 (KDD)”中，主要任务是发现新信息。一种基于已知信息评估的“未告知或无监督”技术，将很容易被其他“监督技术”超越。相反，由于缺乏训练数据，“监督技术”不能用于典型的“KDD”任务。


    数据优化是与机器学习密切相关的另一个领域。各种学习问题可以表述为在训练数据集上最小化某个“损失函数”。“损失函数”被导出为正在训练的模型生成的预测与输入数据值之间的差异。两者之间的区别源于“泛化”的目标。优化算法旨在降低训练数据集的损失，而机器学习的目标是最小化来自现实世界的输入数据的损失。


    机器学习已成为如此热门的话题，以至于其定义在学术界、企业公司和科学界之间各不相同。以下是一些来自知名来源的常见公认定义：


    “机器学习基于能够从数据中学习而无需依赖基于规则编程的算法。” – `McKinsey`。


    ![](img/image-3rhsxwoq.jpg)


    机器学习在其最根本的层面，是使用算法分析数据、从中学习并随后对世界上的现象做出判断或预测的实践。” – `Nvidia`


    “机器学习领域旨在解决以下问题：我们如何构建能够通过经验自主增强其能力的计算机系统，以及支配所有学习过程的基本原理是什么？” – `Carnegie Mellon
    University`


    “机器学习是使计算机无需显式编程即可行动的科学。” – `Stanford University`


    ## 机器学习的类型


    ### 监督式机器学习


    “监督式机器学习”在预测性大数据分析中被广泛使用，因为它可以评估并将从先前迭代和交互中学习到的经验应用到新数据集中。这些学习算法可以根据提供的指令对当前事件进行标记，有效地预测和预测未来事件。例如，机器可以被编程为将数据点标记为“R”（运行）、“N”（负）或“P”（正）。机器学习算法然后按编程方式标记输入数据，将其与“预期或正确”的输出进行比较，识别潜在的修改并解决错误以提高模型的准确性。通过采用“回归”、“预测”、“分类”和“成分提升”等方法有效地训练学习算法，可以将新的输入数据作为“目标”数据集馈送给机器，以按需塑造学习程序。这启动了分析，推动学习算法创建“推断特征”，该特征可以根据输出值对未来事件生成预测和预测。例如，金融机构和银行严重依赖机器学习算法来检测信用卡欺诈并预测潜在客户不按时偿还贷款的可能性。


    ![](img/image-dsl3qxqx.jpg)


    ### 无监督式机器学习


    在没有标记和分类的训练数据集的情况下，公司通常会转向无监督机器学习。“无监督学习算法”说明了机器如何产生“推断特征”以揭示未标记和未分类的数据堆栈中的隐藏模式。这些算法探索数据以在数据块中定义结构。尽管无监督机器学习算法在探索输入数据和得出见解方面与监督学习算法一样有效，但它们无法识别正确的输出。这些算法可以定义数据异常值，提供个性化的产品建议，并使用“自组织映射”、“奇异值分解”和“k-means
    聚类”等技术对文本主题进行分类。例如，在在线营销中，无监督学习算法通常用于客户识别，将客户细分为具有共同购物属性的群体，并以相似的营销策略和活动来定位他们。


    ![](img/image-t0hmbpbg.jpg)


    '
