    include: amplitude and pitch disturbance quotient, glottal-to-noise excitation
    ratio, amplitude and frequency disturbance analysis, harmonics-to-noise ratio
    (HNR), normalized noise energy, etc. Although these feature descriptors have been
    widely used, they are outperformed by emerging short feature descriptors that
    do not require a fundamental frequency assessment. It is also extremely difficult
    to deduce the fundamental frequency of pathological signals due to their non-uniformity.
    There are several new and notable short feature descriptors that have begun to
    replace these long ones. Initially, the speech signal is segmented into several
    frames using a fixed length hamming window(s). Functional vectors such as the
    MFCC and the linear predictive cepstral coefficient (LPCC) are then extracted
    for each frame. These feature vectors have been developed specifically to replicate
    the voice production process and the auditory potential of the human body. These
    features are used in ML algorithms such as SVM, kNN, Gaussian Mixture Model (GMM),
    k-means clustering, etc to signal as either regular or abnormal. However, it is
    important to state that the LPCC as a linear model has ample capacity to deal
