    # About the series


    The motive of this series is to develop a trusted library on advanced computational
    methods, technologies and their applications.


    This series focuses on the latest developments in next generation computing, and
    in particular on the synergy between computer science and other disciplines. Books
    in the series will explore new developments in various disciplines that are relevant
    for computational perspective including foundations, systems, innovative applications
    and other research contributions related to the overall design of computational
    tools, models and algorithms that are relevant for the respective domain. It encompasses
    research and development in artificial intelligence, machine learning, block chain
    technology, quantum cryptography, quantum computing, nanoscience, bioscience-based
    sensors, IoT applications, nature inspired algorithms, computer vision, bioinformatics
    etc. and their applications in the areas of science, engineering, business and
    social sciences. It covers a broad spectrum of applications in the community,
    from industry, government, and academia.


    The aim of the series is to provide an opportunity for prospective researchers
    and experts to publish works based on next generation computing and its diverse
    applications. It also provides a data-sharing platform that will bring together
    international researchers, professionals and academics. This series brings together
    thought leaders, researchers, industry practitioners, and potential users of different
    disciplines to develop new trends and opportunities, exchange ideas and practices
    related to advanced computational methods and promote interdisciplinary knowledge.'
