  md: "Teaching systems based on deep learning algorithms, which are almost always\
    \ carried out in 3D networks, require a slice-by-slice specification which is\
    \ not only complicated but time-consuming. Another major disadvantage of deep\
    \ learning algorithms lies in their inefficiency to learn from a limited amount\
    \ of image data. 3D segmentation models proposed by several researchers used 2D\
    \ segmentation [97]. BraTS datasets are extensively used for the tumour analysis\
    \ algorithms and to estimate a tumour condition in brain MRIs.\n\nAnother issue\
    \ with the data set is the class imbalance. For example, data increase strategies\
    \ are employed by applying rotation and scaling technologies to produce additional\
    \ brain tumour samples. This may cause class disequilibrium problems. Pereira\
    \ [98] explores data augmentation techniques to overcome class imbalance for brain\
    \ tumour segmentation.\n\nAnother problem is the implementation of the same or\
    \ fixed kernel size, which can mask useful information that may occur in areas\
    \ outside the kernel.\n\n# 12.3.5 Image pre-processing\n\nMedical image pre-processing\
    \ plays a very important role in the appropriate inputs to computer-assisted research\
    \ techniques. Preprocessed images help to even get accurate outputs since these\
    \ images demonstrate proper voxel relationships. The repository has images of\
    \ various diagnostic practice and scanners, the variability is simplified and\
    \ put all the scans on the same scale. Apart from the image registration and skull\
    \ stripping, additionally, there are other improved pre-processing methods like:\n\
    \n+   A. **Noise reduction (NR)**\n+   \n+   The distortion in the MRI at the\
    \ time of acquisition is caused by a radio wave or a magnetic field. Various noise\
    \ amplification methods are suitable for noise elimination.\n\n+   B. **Histogram\
    \ matching (HM)**\n+   \n+   Based on a different configuration of the MRI devices\
    \ the intensity level of the images acquired may differ. Intensity ratios are\
    \ to be adjusted to the same scale using the corresponding histogram process.\n\
    \n+   C. **Intensity normalization (IN)**\n+   \n+   Different modality images\
    \ possess a different intensity range. They must map to the equivalent range.\
    \ Zero mean and unit variance are considered by standardisation of all scans.\n\
    \n# 12.3.6 Image post-processing\n\nDue to inappropriate or incorrect feature\
    \ selection, the segmentation output formed by computer-assisted procedures could\
    \ include false segmentation in the image. The use of post-processing approaches,\
    \ for example, can improve the segmentation.\n\n+   A. **Connected component analysis\
    \ (CCA):**\n+   \n+   CCA clubs the voxels depending on the connectivity depending\
    \ on the similar voxel intensities values. The consecutive components which are"
