    **Quality factor (Q)** is used to control the frequency resolution. It is the
    proportion of focal recurrence and the band width, it can be computed as,


    \(Q = \frac{(2 - \beta)}{\beta}\) (1.4)


    For proper and smoothed reconstruction of the signal \(\beta\) is always less
    than 1.


    **Dilation factor (R)** is used to control the size of the wavelet and can be
    expressed as,


    \(R = \frac{s_3}{s_4} \times \frac{1}{1 - (\frac{s_1}{s_2})}\) (1.5)


    For proper recovery of the information and to reduce the losses, \(R\) should
    be greater than 1.


    FAWT is time invariant and it provides a covering of flexible time frequency and
    tunable oscillatory bases.


