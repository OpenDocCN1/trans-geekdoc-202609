    # ## 7.2 Focus on diagnostics


    # ### 7.2.1 Diagnostic error as a concept


    Diagnostic error is defined as ‘the failure to establish an accurate and timely
    explanation of the patient’s health problem or communicate that explanation to
    the patient’ [2]. Errors arise ‘as a result of actions not taken or as a result
    of the wrong action taken’ [3]. Active errors are made by people, between clinicians,
    and an object in question [2, 5]. Latent errors result from problems in system
    or process design and may easily go unnoticed. System-related errors may be associated
    with communication, care coordination, inefficient processes, or technical failures
    [2, 5]. In daily practice, diagnostic errors are often unrecognized and under-reported
    [6, 7]. Health professionals’ indifference to report mistakes may be due to fear
    of penalty or sanction [5, 8]. Individual and systematic factors are some of the
    most common reasons for the under-reporting of diagnostic errors [7].


    # ### 7.2.2 Diagnostic errors in healthcare


    Medical errors are a critical problem in healthcare. According to statistics,
    medical errors are assumed to be the leading cause of death in the United States
    [5]. These errors include e.g., surgical, diagnostic, medication, devices, equipment,
    system failures, and other problems with healthcare technology. Higher error rates
    usually occur in stressful environments such as emergency departments, intensive
    care units, and operating rooms but high error rates are seen also in primary
    healthcare [9, 10]. Medical errors are often associated with extreme age, high
    acuity, and new procedures [5, 9, 11]. Communication errors are a common source
    of medical error [5]. Quality of care is lower among female patients and women
    report more harm than male patients [9, 12]. Errors related to medication occur
    in 3–10% of all consultations when drugs are prescribed [9, 13]. Common factors
    contributing to medication errors include communication, transfer of care, and
    continuity of care [9].


    Diagnostic errors contribute as much 70% of medical errors [14]. Vascular disease,
    infections, and cancer account for about 75% of diagnostic errors [15]. In a Scandinavian
    retrospective cohort study [16] in a sample of a total of 4830 cases of preventable
    harm, 46% were due to diagnostic errors. Cancers represented 37% of all diagnostic
    errors in primary healthcare. The cases most often missed were colorectal, skin,
    kidney and bladder, prostate, lung, and breast cancers. Heart disease,'
  merge: -1
  img_proc: true
- pgno: 171
  md: 'fractures, infections, pneumonia, tuberculosis, type 1 diabetes, and pulmonary
    embolism were the most frequently missed diseases in other disease categories.
    The most frequently missed diagnoses in Sweden with reported harm were cancers
    in primary healthcare and fractures in emergency units [16].


    # 7.2.3 Common reasons for diagnostic failures


    Skill gaps in bedside examination abilities, poor clinical reasoning skills, and
    problems in synthesizing information are significant contributors to diagnostic
    errors [17–19]. Knowledge and skill gaps have been underestimated in this context,
    while cognitive bias has been overemphasized [17, 20]. In primary healthcare,
    common reasons for diagnostic errors include failure to order appropriate tests,
    faulty interpretation, problems in follow-up, failures in referring patients,
    transfer of care, and insufficient consultation techniques [2, 9].


    Education in clinical content knowledge, awareness of bedside history, and correct
    physical examination skills are examples of factors that can reduce diagnostic
    errors [7]. In emergency department settings proper diagnostics relates to acuity
    recognition, information synthesis, and straight communication with patients [21].
    More advanced imaging technologies have improved physicians’ ability to detect,
    diagnose, and treat conditions while allowing patients to avoid invasive procedures
    [22]. However, diagnostic radiology errors, especially shorter viewing times,
    are clear contributors to adverse outcomes [23–25]. Pathology is an essential
    step in cancer diagnostics and better integration of quality and safety principles
    is seen as necessary in error prevention in this area. Diagnostic error prevention
    in pathology requires, e.g., collaborative teamwork, enhanced training about the
    diagnostic process, and a safety culture focusing on health information technology
    and other strategic changes [26]. As is known, proper investigation intensity
    is critical in healthcare. Many challenges, however, in this area can be met and
    poor clinical outcomes could be prevented by enhancing diagnostic processes [27,
    28].


    # 7.2.4 Preventing diagnostic errors in cooperation with patients


    The importance of patient involvement and mutual communication between patients
    and doctors are emphasized widely in prevention of diagnostic errors. Improved
    patient access to clinical notes with co-generation and feedback possibilities
    represent one form of error recovery and shared decision-making [2, 29]. The majority
    of patients who access their patient records report positive experiences [29].
    However, this is only one step toward better patient-centered care. In prevention
    policies in a Scandinavian study [9], patients emphasized the value of nationwide
    online medical records, regular comprehensive physical examinations, and clarity
    in routines for the follow-up. Availability of contact information for doctors
    and other medical professionals was seen as important in situations of normal
    test results but remaining symptoms [9]. Healthcare professionals may propose
    a working diagnosis in cases of uncertainty [2]. When the diagnosis stays unclear,
    the follow-up care is often inadequate.'
