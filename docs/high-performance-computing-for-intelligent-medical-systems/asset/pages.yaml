    of [131] used a signal pre-processing technique known as Voice Activity Detection
    (VAD) before extracting MFCC features. The VAD module is a form of filter that
    distinguishes the silent or voiced sections or the noise spectrum present in the
    signal. The training of the VAD module initially involves the development of a
    signal mixed with the noise spectrum, after which the useful and noisy regions
    of the signal are manually annotated. These annotated noisy and useful regions
    are collectively categorized as the voiced component of the signal. In this way,
    the classifier identifies the spectra of noise, the clean signal, and the silent
    part of the signal spectrum. This is a sophisticated and nuanced method. The implementation
    of the MFCC features with the VAD module on the 117 and 23 abnormal and safe recordings
    present in the MEEI database resulted in an accuracy of 96%.


    Another binary classification technique by [132] qualified Hidden Markov Model
    (HMM), GMM, and SVM with six separate feature descriptors, namely—Relative Average
    Perturbation (RAP), shimmer, jitter, soft phonation index (SPI), HNR and Amplitude
    Perturbation Quotient (APQ). The pathological voice category consisted of numerous
    laryngeal diseases such as laryngeal cancer, cyst, palsy, Edema, nodule, polyp,
    and laryngitis. The implementation result showed that the GMM with these feature
    vectors had the highest accuracy, even higher than the artificial neural network
    (ANN)-based implementation with which it is compared.


    A smartphone-based hardware prototype for diagnosing individual dysphonia has
    been seen in a landmark and recently published research work [133]. The disorder
    has a high association with the unhealthy manipulation of vocal cords on a regular
    basis due to the nature of the work. The key features of this type of condition
    are non-uniformity in loudness, degradation of pitch and voice quality. It is
    composed of around 10% of the other voice pathologies that affect individuals
    worldwide. The investigation demonstrated the efficiency of several features with
    different ML techniques, such as logistic model tree, support vector descriptors,
    berry model, decision tree, and instance-based learning. Features that have been
    used in this work are—HNR, SPI, shimmer, spectral features, jitter, MFCC, RAP,
    disruption, energy, temporal features, noise, and wavelet features. The comparison
    of efficiencies was made using popular metrics such as sensitivity, specificity,
    apart from the use of precision as widely used for other techniques. The investigation
    concluded that SVM and a decision tree with features could provide very good results.'
