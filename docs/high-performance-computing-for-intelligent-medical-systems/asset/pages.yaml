    # 7.3.2 Enhanced patient safety with rational cost control policy


    Cost-saving pressures in healthcare may pose a challenge to a doctor’s clinical
    work. Inadequate savings targets in patient care, for instance in the area of
    diagnostics can disturb clinical practices and be very costly. A common approach
    to save money is random reduction of laboratory budgets [28]. Diagnostic management
    teams represent an advanced model for more intensive and meaningful cost-effective
    processes. In this model professionals with expertise advise colleagues in clinical
    practice on test selection and interpretation [28, 44].


    AI offers more proficient methods for the optimal use of human resources and the
    planning of logistical processes [45]. Those methods offer new options to find
    rigorous cost savings opportunities because human resources form in hospitals
    the most significant cost factor [46]. Thus, personnel costs do not have to be
    viewed only as fixed costs. This optimization modeling will also be principally
    taken care of by those resourced for these planning tasks, which is a step forward.


    Advanced AI tools and methods have their role to play in sound cost management
    policy and, therefore, in safety enhancement when enabling doctors to have better
    focusing primarily on their clinical work. Also, intelligent diagnostic systems
    like AI-assisted decision support systems can improve diagnostic accuracy and
    aid in disease management and thus help doctors decrease routine clinical tasks
    and focus first and foremost on patient care [47, 48]. These systems also do not
    increase the duration of the doctor consultation or the number of ordered tests
    [1]. Digital scribes, like AI-powered digital notes enable doctors to fully engage
    with patients by reducing the time invested by clinicians in the documentation
    process [49].


    # 7.4 Importance of patient feedback in the diagnostics phase


    # 7.4.1 Need for timely feedback


    It is essential that doctors get patient feedback on their diagnostic skills and
    competence. Overconfidence is more prevalent than low confidence, especially at
    lower competence levels [50]. Also, extensive experience does not necessarily
    mean greater diagnostic accuracy [17, 51]. Only a few healthcare organizations
    have genuinely concentrated on identifying diagnostic errors [2, 52]. Healthcare
    professionals often do not have the opportunity to hear from health consumers
    about their diagnostic performance [2, 53, 54]. Time limits may prevent real engagement
    with customers in the diagnostic process [2, 55]. Clinicians need to be ready
    to communicate with their customers about the occurrence of diagnostic errors
    but also may find the feedback on their diagnostic performance uncomfortable [2,
    56]. However, in feedback training programs, clinicians found the exercises constructive
    and helpful [56]. Organization-wide and improved customer complaints coordination
    may also help individual doctors develop in their self-evaluative processes by
    enhancing their diagnostic calibration properties [57, 58]. Diagnostic calibration
    is about self-knowledge and understanding of the limitations of one’s knowledge
    [58].'
