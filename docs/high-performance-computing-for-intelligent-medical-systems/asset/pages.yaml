    # ## 10.3 Image enhancement in frequency domain


    The concept of filtering is easier to visualize in the frequency domain. Therefore,
    an enhancement of image \(f(x, y)\) can be done in the frequency domain, based
    on its Fourier transform [37, 38]. The advantage of using the frequency domain
    method is that we can regain the same image by applying inverse transmission technique
    and by choosing the proper weighting function, modification or attenuation of
    certain frequency components are possible.


    Let \(h(x, y)\) and \(f(x, y)\) be the weighting function and original image,
    respectively. Filtering of image \(f(x, y)\) is done by convolution in spatial
    domain as follows.


    ```

    \(g(x, y) = h(x, y) * f(x, y)\) (10.3)

    ```


    Where * is a convolution operator. In frequency domain method it is corresponding
    to the multiplication of image spectrum \(F(u, v)\) with the Fourier transform
    of the weighting function \(H(u, v)\) as follows


    ```

    \(G(u, v) = H(u, v)F(u, v)\) (10.4)

    ```'
