- pgno: 77
  md: 'able to ease the pain to some degree. There is, however, a problem with teaching
    individuals to use these machines, which, if applied on a mass scale, would result
    in pointless costs. Economical, non-invasive and automated diagnosis of voice
    signal pathologies for thorough study of glottal signals is a trend for research
    enthusiasts. It is the future of speech pathology detection. The glottal signal
    is produced between the vocal fold and the vocal tract. Considering the success
    of deep learning [4] in various areas of artificial intelligence (AI), the number
    of studies in the classification of voice pathology will increase further [5–9].
    Deep learning is becoming a better option against common classifiers such as decision
    trees, support vector machine (SVM), k-nearest neighbors (KNN), decision trees,
    naive bays, etc. Handcrafted speech or acoustic features have been of primary
    importance for voice pathology detection for the last few decades and cannot therefore
    be ignored.


    Deep learning models such as the Recurrent Neural Network (RNN) and the Long Short-Term
    Memory (LSTM) are also used. Prediction scores generated using handcrafted machine
    learning features and deep learning classifiers can also be combined to further
    improve accuracy [9]. It can therefore be concluded that computer-based voice
    analytics of these types should be further researched before they are widely used
    as screening methods to classify laryngeal pathology.


    # 3.1.2 Internet of things in voice pathology


    Healthcare is one of the most common sectors for internet of things (IoT) applications.
    Some potential uses include chronic disease management, smart fitness-tracking
    wearables, remote patient monitoring, etc. Nowadays, a boom in smart watches that
    use sensors to monitor different types of everyday fitness activities and uploading
    to IoT-based smartphones is widespread. Intelligent medical devices and imaging
    devices are also main components of IoT. Over the coming years, the integration
    of more miniaturized low-power sensors with better machine learning (ML) algorithms
    will significantly enhance the cost-effectiveness of these smart IoT products.
    This will further revolutionize the experience of the consumer. Authors of [10]
    argued that suppliers view IoT as a tool for remotely reducing the downtime of
    smart devices. IoT also provides strategic resource planning to ensure that more
    patients will make the most of their services. Premature testing, health-related
    problems, chronic diseases and real-time monitoring are expected to be promoted
    by emerging wireless technologies [11, 12]. A thorough understanding of current
    IoT research in health applications is expected to help many stakeholders involved
    in additional research at this point in time. ML has been used to test clinical
    parameters and their combinations for prediction purposes, such as extracting
    health knowledge for outcome studies, comprehensive patient treatment, therapeutic
    planning and support, and predicting disease progression [13, 14].


    ML incorporation in the medical sector provides medical professionals with the
    opportunity to function effectively, create, and enhance the quality and reliability
    of medical care [15]. Biomedical signals can also be done with real hardware in
    order to recognize physiological changes in the human body in a variety of different
    ways.'
