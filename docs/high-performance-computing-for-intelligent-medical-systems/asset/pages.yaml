    = 25\), (c) GLPF output for \(\sigma = 50\), (d) GLPF output for \(\sigma = 100\).


    where, \(i(x, y)\) is illumination and \(r(x, y)\) is reflectance. Here, \(i(x,
    y)\) is a lower frequency component than \(r(x, y)\). Homomorphic filtering reduces
    the low-frequency component of an image in spatial domain to have a high-pass
    filtering \(f(x, y)\) that transforms to the frequency domain by first converting
    the product term to addition. It can be achieved by using the logarithm of both
    sides then applying Fourier transform as shown below [35, 36].


    ```

    \(\ln[f(x, y)] = \ln[i(x, y)] + \ln[r(x, y)] (10.8)\)

    ```


    ```

    \(\mathfrak{F}[\ln[f(x, y)]] = \mathfrak{F}[\ln[i(x, y)]] + \mathfrak{F}[\ln[r(x,
    y)]] (10.9)\)

    ```


    Let


    ```

    \(\mathfrak{F}(u, v) = I(u, v) + R(u, v) (10.10)\)

    ```


    Next, to have better illumination high pass filtering is required.


    ```

    \(G(u, v) = H(u, v) \cdot \mathfrak{F}(u, v) (10.11)\)

    ```


    Now, filtered image \(G(u, v)\) is transferred to spatial domain using inverse
    Fourier transform.


    ```

    \(g(x, y) = \mathfrak{F}^{-1}[G(u, v)] (10.12)\)

    ```


    \(g(x, y)\) is not in its original form, therefore, to eliminate the logarithm,
    an exponential function is used. Figure 10.8 shows the result of applying homomorphic
    filtering.


    # 10.3.4 Discrete wavelet transform


    In discrete wavelet transform (DWT), the signal is filtered through a set of digital
    filters at different scale. It decomposes the image into a sequence of different
    frequency components. In an image \(N\) level of decomposition can be performed
    that results in \(3N + 1\) different frequency bands such as, LL, LH, HL and HH.
    Low-low (LL) frequency components give average information of an image and other
    frequency components give directional information like low-high (LH), high-low
    (HL), and high-high (HH) gives horizontal, vertical, and diagonal coefficients,
    respectively [39, 40].'
