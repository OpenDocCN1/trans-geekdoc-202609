  md: "# PSO-BM Algorithm\n\n+   1. Eight particle locations are selected in a different\
    \ direction and initialized with random velocities.\n+   2. Calculate the fitness\
    \ values, that is, SAD for each particle.\n+   3. Personal best ($P_{best}$) and\
    \ Global best ($G_{best}$) are updated using equation (8.3) by the PSO algorithm\
    \ based on a particle’s fitness value.\n+   \n+   $$Y_i(t+1) = \\begin{cases}\
    \ Y_i(t) & \\text{if } f(X_i(t+1)) \\geqslant f(Y_i(t)) \\\\ X_i(t+1) & \\text{if\
    \ } f(X_i(t+1)) < f(Y_i(t)) \\end{cases}$$ (8.3)\n+   \n+   $X_i$ is the position\
    \ vector of the particle ’$i$’ $f(X_i(t+1))$ is the ’$i$’th particle’s fitness\
    \ value at $X_i(t+1)$ position $Y_i(t)$ gives the current $P_{best}$ of the particle\
    \ ’$i$’\n+   4. Position vector and velocity vectors of the particle are updated\
    \ using equations (8.1) and (8.2).\n+   5. Until the stopping conditions are met,\
    \ the above steps are followed.\n+   6. The matching MB location and its MV will\
    \ be the $G_{best}$ position.\n\n# 8.9.4 Harmony search block matching algorithm\n\
    \nGeem *et al* [56] had suggested a new population-based optimization approach\
    \ called Harmony Search (HS) which mimics the process of continuously polishing\
    \ the pitches for getting better harmony by a musician. Fitness approximation\
    \ model attached with HS to get the best MV to get better harmony in music. Figure\
    \ 8.8 is the block level diagram of HS-BM. The time of execution is greatly saved\
    \ in doing ME accurately because of the integration of the fitness calculation\
    \ strategy for finding out the MV.\n\nThe solution is also known as ‘Harmony’\
    \ in HS and is represented by n-dimensional real vectors. Harmony Memory (HM)\
    \ is the initial memory in HS where harmony vectors are stored which are generated\
    \ randomly. A new Harmony candidate is produced or created by applying pitch modification\
    \ strategy or randomized re-initialization. The newly generated Harmony candidate\
    \ is matched with the poorest harmony and HM is updated. Until the limiting condition\
    \ is not met, a better candidate harmony vector replaces the poorest harmony vector.\n\
    \n![](img/75406d5bb714dfd3e68fbbc717bd8f67_204_0.png)"
