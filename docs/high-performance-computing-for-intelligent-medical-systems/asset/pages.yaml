    # ## 5.3 Conclusion and future scope


    Undoubtedly, the ML methods are valuable tools for medical data mining. However,
    there are some critical issues to consider to improve their visibility and clinical
    applications. Tables 5.1–5.4 summarized the critical STARD/TRIPOD issues that
    were not considered in the published papers. One reason could be that the original
    STARD or TRIPOD guidelines were not developed for ML and AI methods. This is why
    their extensions, such as TRIPOD-ML [63] and STARD-AI [64], are underway. Nevertheless,
    it is possible to use the critical STARD/TRIPOD checklist to improve ML methods’
    clinical application.


    During the pandemics, many papers were published in the literature focusing on
    all aspects of COVID-19 diagnosis, prognosis, and long COVID. Many journals provided
    special issues, although some were not related to the journals’ aim and scope.
    Inadequate peer-review procedures and the journals’ rush to maintain or improve
    their impact factor while some clinical journals were the front runners created
    a situation where publishing was the main issue. Valuable research requires time,
    and there was no time in the race. This time, the term ‘publish or perish’ was
    completely clear. It might be a good idea to have the peer review after the publication
    of COVID-19 papers, where researchers could comment or discuss the published papers.
    Pubs provided an open community review (https://pubns.com/publon/covid-19/?sort_by=date).
    However, not all of the published COVID-19 papers were included.


    Here, we provide a list of critical issues to consider for ML methods for COVID-19
    diagnosis and prognosis to improve their clinical application:'
