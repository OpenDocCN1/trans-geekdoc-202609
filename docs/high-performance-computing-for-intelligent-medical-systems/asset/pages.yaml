    is especially useful in complex cases where, for example, the patient feels that
    his or her own diagnosis is prolonged. This may be due to poorly coordinated co-operation
    between different sites. Poor coordination causes situations that may threaten
    patient safety and increase healthcare costs [85, 86]. As speech recognition and
    processing systems have also evolved, it makes sense that the patient can also
    give free-form feedback on their phone interactively with the help of a robot
    as flexibly as possible.


    Unstructured data can be challenging to organize and analyze. This kind of data
    is typically in text, such as open-ended text responses. In the case of hospitals,
    the volume of free-text data can be massive. Analyzing handwritten responses or
    large volumes of text data is time-consuming, expensive, and subject to human
    error [87, 88]. Big data is defined as ‘a collection of a very large amount of
    data with a wide range of types, making it hard to process using conventional
    database management systems’ [88]. This is why AI-based text analysis and automated
    knowledge representation and reasoning capabilities can be extremely helpful [87].


    Customer feedback may be in the form of PDF documents, photos, or other images,
    scanned documents, or printed or handwritten documents. Optical Character Recognition
    (OCR) is the best tool for converting text to digital format in all of these cases
    (figure 7.4). Most OCR tools provide 98% to 99% accuracy [89]. This level of accuracy
    would be sufficient in most cases; however, accuracy may suffer in handwritten
    documents, blurry pictures, and languages other than English.


    Handwriting Recognition (HWR), also known as Handwritten Text Recognition (HTR),
    is an active research area that can deliver a 4.0% Word Error Rate (WER) and 1.6%
    Character Error Rate (CER) when using deep learning techniques, like bidirectional,
    long short-term memory networks (BLSTMs) [90].


    Another option is feedback in the form of audio. Tools are available to transform
    spoken audio into digital text. In many European hospitals, doctors'' assessments
    are recorded and converted to text. Digital scribes (speech-processing and natural
    language processing (NLP) modules) can also convert the audio to text, and to
    extract salient information from the text [49]. There are many speech-to-text
    platforms available. They are standard tools, similar to OCR or translating tools.
    Most of the applications have sufficient accuracy to be usable.


    Once open-ended responses are gathered (free-text phase) in digitized text, the
    material is ready for text analysis. Text analyzing techniques use machine learning
    algorithms to find quantitative or qualitative data in the text. In free-text
    form, data is ordinarily unstructured. From this data, it is possible to obtain
    some qualitative'
