  md: '# Chapter 10


    # A comparative analysis of image enhancement techniques for detection of microcalcification
    in screening mammogram


    # Gaurav Makwana, Ram Narayan Yadav and Lalita Gupta


    Breast cancer is the main source of cancer-related death in women of all ages.
    Among various imaging techniques, mammography is the most reliable and cost-effective
    technique for the diagnosis of breast malignancy. Radiologists investigate the
    presence of microcalcification and the pattern of its spread and interpret the
    information. However, diagnosis of the abnormality is completely subjective and
    depends upon the experience and expertise of the radiologists. There is always
    a possibility of human error due to poor contrast and noise that might cause the
    misleading diagnosis of abnormalities like calcification, masses, etc. Therefore,
    it is beneficial to use image processing techniques for mammogram image enhancement
    to improve the image quality for better interpretation of the image. In this chapter
    image enhancement techniques are applied to reduce the different types of noises
    like impulse noise, Gaussian noise, and speckle noise to increase the contrast
    of the mammogram images. The performance comparison of various image enhancement
    techniques like spatial domain filtering, frequency domain filtering and machine
    learning technique is shown. A quantitative measure of performance comparison
    is provided in terms of the parameters like Mean Square Error (MSE), Peak Signal-to-Noise
    Ratio (PSNR), Signal-to-Noise Ratio (SNR), mean, variance, etc. The test results
    indicate that the median filter can reduce impulse noise with the lowest MSE of
    0.0206, whereas CNN is a better option to remove Gaussian and speckle noise with
    MSE of 0.0026 and 0.0017, respectively. We have also seen that these methods increase
    the contrast that helps in improving the diagnostic efficiency of mammograms.


    # 10.1 Introduction


    Cancer refers to the uncontrolled growth of epithelial cells in a particular location
    of the body. Malignant growths can be characterized by the kind of influenced
    cells or'
  merge: -1
  img_proc: true
- pgno: 237
  md: 'organs where this starts. There are roughly 100 sorts of cancer. It is an intricate
    and diverse illness since malignant development can happen in any part of the
    body. Breast malignancy is the uncontrolled development of epithelial cells in
    the breast. It is the second most common malignancy in women, however, it can
    affect men also. Additionally, it is the second leading reason for cancer death
    in women after lung malignancy because many times breast disease does not cause
    any agony or uneasiness until it has spread to close-by tissue [1]. Invasive ductal
    carcinoma (IDC) is the most widely recognized sort of breast disease in women
    of all ages and having a low survival rate [2].


    Breast cancer is recognized by various names, contingent upon where it begins
    in the woman''s breast. Bleeding from the nipple or pain in the armpit and a lump
    can indicate malignancy, and change in the size or shape of the breast is also
    an indication of abnormality. Breast tumors may be of two types benign and malignant.
    Non-cancerous (benign) tumors comprise connective tissue, adenoma, fibro-adenoma.
    Fibro-adenoma is the most common benign mass due to the combination of connective
    tissue and epithelial cells in the breast. Two main types of breast cancer are
    non-invasive breast cancer and invasive breast cancer. In non-invasive cancer,
    normal epithelial cells are replaced by malignant cells lining the ducts or lobules
    in the breast tissue. Non-invasive breast cancers stay within the milk ducts or
    lobules, called carcinoma in situ (CIS). Invasive breast cancer is the most common
    type of breast cancer, it starts from the milk duct but spreads into the surrounding
    normal tissue inside the breast. The most common screening method for the identification
    of breast cancer is mammography. It is used for the early detection of suspicious
    areas in breast cancer. Doctors detect, diagnose, and evaluate breast cancer by
    screening mammography. The advantage of using mammography is that it can scan
    a very small lump. However, mammography still has some disadvantages such as being
    challenging to diagnose irregularity in the dense breast tissue diagnosis in young
    patients [3, 4].


    Mammographic screening can recognize a few malignant growths that are not detectable,
    while a few malignancies are detectable, but not distinguishable on the mammogram
    [5]. Screening mammography is more unlikely to identify early breast malignant
    growth at a treatable stage. To begin with, because in younger women breast thickness
    is commonly high [6, 7] and due to higher breast density, screening mammography
    brings about more false-positive tests, with the related anxiety and superfluous
    biopsies. Since women younger than 50 are more unlikely to have malignant breast
    growth, fewer women benefit from screening and the lower frequency of malignant
    breast growth increases the cost of mammography screening for a lifetime [8].


    Early recognition is essential to the possibility of fruitful treatment since
    the malignant growth might be intrusive and spread to any part of the body. This
    recognition can be too troublesome since the principal indications of breast cancer
    are regularly symptomatic. This is the reason x-ray mammography is broadly used
    to screen for breast malignant growth. The mammogram can show small breast tissue
    changes, which may demonstrate too small tumors to be distinguished either by
    the radiologist or by a specialist doctor. There is an expanded breast malignant'
