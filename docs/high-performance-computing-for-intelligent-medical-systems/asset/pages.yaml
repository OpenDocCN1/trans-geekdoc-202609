    # 6.2 Regression analysis in machine learning


    Regression machine learning techniques generate a relationship between target
    and predictor variables. The role of this technique is to generate a time series
    model find future outcomes from a variable relationship and fit a curve/line to
    the variables. It provides a significant relationship and strength of impact between
    variables.


    The regression model is a subpart of machine learning. The regression model estimated
    how strong was the relationship between dependable and one or more independable
    variables. Machine learning provides a relationship between variables by different
    functional models. A linear function model generates continuous outcome variables
    (f(x)) for given values of x. These variables make a linear relationship between
    outcome and given variables [29]. The exponential function'
