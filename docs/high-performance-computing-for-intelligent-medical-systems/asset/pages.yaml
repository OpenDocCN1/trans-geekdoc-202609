  img_proc: true
- pgno: 111
  md: '![](img/75406d5bb714dfd3e68fbbc717bd8f67_111_0.png)


    # Figure 4.2. Binned-scatter plot and the distribution histogram of systolic and
    diastolic BP target values.


    ![](img/75406d5bb714dfd3e68fbbc717bd8f67_111_1.png)


    # Figure 4.3. Various preprocessing steps to prepare PPG segment series.


    corresponding invasive BP waveforms. They would be our target vectors. R-wave
    occurrences are utilized as the time references during the segmentation procedure.
    Therefore, each recording turns to an input vector (X) and a target vector (T)
    as follows:


    ```

    $X = \{x_1, x_2, ..., x_n\}$ (4.9)

    ```


    ```

    $T = \{t_1, t_2, ..., t_2\}$ (4.10)

    ```


    Each element corresponds to a heart cycle. Figure 4.3 depicts various preprocessing
    steps. Here, we also provide more details.'
  merge: -1
