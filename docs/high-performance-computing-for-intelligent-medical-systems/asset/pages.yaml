    # 8.6 Standard techniques for motion estimation


    BMAs are often divided into three groups. Pattern-Based BMAs (PBBMA) are the first
    group because they are based on various search point patterns such as rectangular-shaped,
    square-shaped, hexagon, or diamond-shaped, etc Three-Step Search (TSS) [2], New
    TSS (NTSS) [3], Quick TSS [4], Reduced Three-Step Logarithmic Search (RTSLS) [5],
    4-Step Search (4 s) [6, 7], Diamond Search (DS) [8, 9], Cross Diamond Search (CDS)
    [10], New CDS (NCDS) [10], Hexagon shaped BMA (HEXBMA) [11], Simple and Effective
    Search (SES) [12], etc. The Second Category considers and uses the similarity
    among the current MB and the adjacent MBs to estimate current the MB’s movement,
    for example, Adaptive Rood Pattern Search (ARPS) [12–14], Inter-block correlation-based
    BMA [15], Correlation Search Algorithm (CSA) [16], Correlation Based Rood Pattern
    Search (CBRPS) [17], etc. The third group consists of all BMAs that are based
    on the concept and behavior of natural genetics or natural intelligence events
    which are called soft computing based BMAs. These are also referred to as BMAs
    inspired by Nature, such as the ME using Genetic Algorithm [18–27], Particle Swarm
    Optimization based BMAs [28–38], Artificial Bee Colony (ABC-BM) [39] based BMA,
    etc.


    # 8.7 Soft computing techniques for motion estimation


    The practice of achieving a better solution, that is, better than the current
    best solution of a problem is known as optimization and is the method followed
    to make the algorithm operate as meritoriously or as efficiently as possible.
    In recent times, Nature-inspired algorithms (NIAs), evolutionary algorithms, swarm
    intelligence, SC techniques, etc have become buzzwords in the field of optimization.
    Many computer science field problems together with other engineering disciplines
    are using SC techniques for finding optimal solutions for real-life problems.
    The optimization approach adopted by them to implement the concept and process
    of design to solve everyday problems motivated the researchers to explore the
    field further. Out of all biological or Nature-mimicked algorithms, Swarm Intelligence
    Algorithms (SIAs) [40] have the highest acceptance in the field of optimization.
    Besides being a non-deterministic algorithm, an algorithm for stochastic optimization
    may be heuristic or meta-heuristic type by nature.


    To a large extent, the success of NIAs in overcoming the problems faced by Pattern
    Based BMA (PBBMA) in Video Compression influenced the researchers to conduct comprehensive
    research to apply more and more NIAs, especially swarm intelligence techniques
    for ME. There has been a decent amount of research and many improved versions
    of simple particle swarm optimization (PSO) have been'
