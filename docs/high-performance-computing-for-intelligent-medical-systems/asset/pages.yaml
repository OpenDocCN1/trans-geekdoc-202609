    d = endogenic inhibition of formerly created vasculature (1/day.mm²);

    e = anti-angiogenic impact of the controlled inhibitor on the tumor vasculature
    (kg/day.mg).


    # 13.5 Conclusion


    This work studied the application of a combination of AI and PID techniques in
    the medical diagnosis field. To get the most excellent and greatest response in
    the biomedical field, a PID controller is famous due to its simple design and
    intelligent tuning strategy. Non-noisy input provides more accuracy to the PID.
    The PID control systems are studied for controlling the different health issues
    such as, insulin delivery for diabetic patients, drug delivery control for H-BP
    during and post-surgery conditions, tumor growth monitoring, symptoms identification
    to control arthritis in preliminary stages etc. This work also studied the integration
    of AI based PID with different medical technologies to get better accuracy and
    enhanced diagnosis. The effectiveness of the AI based PID controller, mathematical
    modeling of various biomedical systems and drug infusion control systems are discussed.
    In this chapter the biomedical system based on a PID controller helps clinicians
    and control engineers to execute this progressive and harmless infusion method
    in actual time to automate the system delivery. The prototype models discussed
    are very effective in the field of medical health care systems.


