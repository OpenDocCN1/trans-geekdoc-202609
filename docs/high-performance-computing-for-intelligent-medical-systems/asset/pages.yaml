- pgno: 147
  md: '+   * The flow diagram of the study in which the inclusion and exclusion criteria
    are shown must be provided.

    +   * The sample size calculation and the sampling method must be mentioned.

    +   * Type III error must be avoided. Using only the hold-out validation method
    could create this problem. Alternative solutions such as repeated hold-out or
    re-sampling methods are good alternatives.

    +   * When there are repeated measurements from each patient, subject cross-validation
    must also be provided.

    +   * The mean and SD of the performance indices must be reported over each test
    fold. A cross-validated confusion matrix could be provided, enabling the statistical
    comparison between different methods (i.e., the proposed method versus the state-of-the-art).

    +   * The analyzed sample must resemble the population in terms of disease prevalence.
    Otherwise, the method’s performance over balanced datasets must be analyzed and
    elaborated when using in the population.

    +   * Proper performance indices must be provided when the dataset is imbalanced.
    Accuracy is a biased estimator in this case.

    +   * A variety of performance indices must be reported. An example is providing
    the agreement rate between the diagnosis system’s output with that of the PCR
    results, as there are criticisms on using PCR results as the gold standard.

    +   * The CI 95% of the performance indices must be reported, showing the reliability
    of the estimation.

    +   * Biostatistical knowledge of the biomedical engineers and those working on
    ML methods in medicine must be improved. An example is the importance of selecting
    the correct survival models and ML methods when the in-hospital prognosis is performed.


