    these positive factors and limitations, these short explanations are not very
    dexterous when testing the classifiers with samples belonging to other databases
    [98, 99]. The problem is therefore a lack of generality when dealing with datasets
    belonging to various regions of the world. For example, the MEEI dataset was collected
    from patients living in the United States of America and thus the voice of a normal
    individual of Asian or Middle East descent might be categorized as abnormal. This
    is due to a lack of global fundamental pitch that can usually be considered to
    belong to an odd group worldwide. This aspect prevents the hardware implementation
