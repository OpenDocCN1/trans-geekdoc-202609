  md: 'pixel is replaced with a white pixel. The dark tree becomes completely black,
    and the white snow becomes completely white, as seen in the example picture on
    the right [39].


    +   III. ANN classifier-based techniques Artificial neuronal networks (ANNs) have
    been successfully used in a variety of fields, including geotechnics, civil engineering,
    mechanics, industrial surveillance, defense, automation, and transportation. ANN’s
    image management processes include image pre-processing, data reduction, segmentation,
    and identification. An image can be represented as a matrix, with each pixel’s
    colour information stored in each unit of the matrix. In the neuronal network,
    the matrix is used as input data. The size of the vector and the number of input
    vectors are determined by the images’ small dimensions, which make learning easier
    and faster. A sigmoidal transfer function was used [40].


    +   IV. NB classifier-based techniques Based on statistical knowledge learned
    from a training set, this transforms a color image to a binary (labeled) image.
    The probability density function (PDF) for the random variables plant (P) and
    background (B), each of which contains the random variables hue (H), saturation
    (S), and value (V), is calculated from the training set (colour channels). Using
    Bayes theorem and the naive assumption that the random variables are independent,
    we calculate the joint probability that a pixel is from random variable P or B
    given these PDFs (for convenience). If P(pixel = plant) > P(pixel = background),
    output pixels are classified as plant (255) or background (0) [41].


    # 11.7.2 Dementia detection using retinal imaging


    The basic principle behind the detection of dementia is that the neuronal retinal
    cells share similar properties to those of the central nervous system neurons,
    similarly that arterioles venules of retina pattern are the same as cerebral vessels
    of blood, so it is considered that degradative changes in retinal features can
    be extrapolated for neuro-degenerative changes and these degenerative changes
    are an early indicator of dementia.


    # 11.7.3 Heart diseases detection using retinal imaging


    The fundamental concept that lies in the detection of heart diseases is analysis
    of microvasculature and the appropriate vascular design. For maintaining the proper
    and healthy functioning of the heart correct vascular design is very important
    for proper flow of blood and its efficient diffusion. On the other hand, if there
    is a problem in the geometry of microvasculature then it gets mirrored in the
    retinal vasculature, which is the hallmark for the early detection of cardiovascular
    diseases. It is observed that in hypertensive condition there is thinning of the
    arterioles of the retina, similarly the parameter of arteriolar tortuosity is
    a marker of blood pressure so increased pressure of the blood causes increase
    in the tortuosity of anatomical features of the retina. Stiffness of the arterioles
    is another parameter to define the normal functioning of the CVS System. QUARTZ-Quantitative
    Analysis of Retinal Vessel Topology and Size is the automatic software for performing
    the retinal imaging.'
