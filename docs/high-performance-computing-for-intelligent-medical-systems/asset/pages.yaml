    # E. Deep Learning based voice pathology classification.


    With the advent of deep learning in the field of computer vision [4], the use
    of deep learning methods for evaluating medical imaging and signal processing
    has increased considerably. These techniques have been used in several voice recognition
    applications, one of which is pathological voice research. Various deep learning
    algorithms have been introduced in speech pathology, often binary classification,
    that is, healthy voice and pathology.


    Researchers at [137] suggested a deep learning system for the diagnosis of voice
    signal pathologies. Their work is very special in the sense that they used a dataset
    that they obtained for training, while testing was performed on samples extracted
    from the MEEI database. More specifically, their training samples are made up
    of regular and six types of pathological voice disorders. These samples were obtained
    from a tertiary teaching hospital. The six diseases included in their dataset
    are: vocal fold nodules, spasmodic dysphonia, neoplasm, polyp, laryngeal paralysis,
    and cysts. Sustained vowel sound recordings with a duration of 3 s have been used
    as a source for the extraction of MFCC feature vectors. Deep Neural Network, Gaussian'
