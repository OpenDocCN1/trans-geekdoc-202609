    Figure 8.2. Different frame types.


    # 8.4 Motion estimation and the necessity of it in video coding?


    ME is the vital component of video compression. ME with motion compensation is
    used for the elision of temporal redundancy. Since a video is a collection of
    frames and there is little difference between two closely located frames, there
    is no need to encode every frame of a video. Rather we can intra-code the first
    frame and encode the change in information amongst the frames which are represented
    by MV and pass the same to the decoder side. The ME block of codec determines
    the displacement of objects in a video in terms of coordinate difference known
    as MV which is used by a decoder to regenerate the original video. The process
    of finding the MV is known as ME and this is the most complex part of video compression.
    The encoding of only the difference of frames, that is, MV will greatly reduce
    the bit budget to represent the video as the bits required to encode only MV are
    higher in comparison to the bits required to encode only whole frame. The efficiency
    of the compression process heavily depends on the complexity of ME process. So,
    the target of the research work is always to design such a methodology that the
    whole ME becomes fast and accurate. There are many approaches available for ME
    but due to the simplicity and speed, the block matching approach is widely accepted
    and research is ongoing to make the ME process more easy, accurate, and fast by
    developing new Block Matching Algorithms (BMAs). The methodology of BMA for achieving
    ME and its components are shown in figure 8.3.


    # 8.4.1 Forward and backward motion estimation


    In the video coding techniques, while removing temporal redundancies, frames are
    encoded concerning some other past or future frame. This type of coding is known
    as inter-frame coding or predictive coding. The frames that correspond to this
    type of coding are known as P-frame. In the encoding process, if the frame k (current
    frame) is encoded using the past frame say (k−1)th frame (previous frame) to predict
    what frame number k is going to be, we term it as forwarding prediction (FP) as
    future prediction is done for the kth frame by calculating MV. The process of
    FP is shown in figure 8.4.'
