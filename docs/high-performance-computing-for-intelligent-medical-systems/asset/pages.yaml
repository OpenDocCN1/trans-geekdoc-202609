    # Chapter 6


    # Forecasting confirmed cases of Corona patients in India using regression and
    Gaussian analysis


    Dhyan Chandra Yadav and Saurabh Pal


    Corona virus is a major threat for human life leading to a very deadly life-threatening
    disease. The infection of this disease is so fast that in a very short span of
    time it took the whole world under its infection. In this chapter, we analyze
    the growing dataset of COVID-19 from 30 Jan 2020 to 9 July 2020 and estimate confirmed
    Covid positive cases and patient deaths.


    The cases of this disease originated from Wuhan of China and the exact reason
    for the origin of this disease has not been explained to date. Experts are constantly
    experimenting to control this disease in the medical field, but to date no effective
    medicine to cure the disease immediately has been available. Four different functional
    models have been utilized for Covid data analysis of Indian Covid patients accessed
    from Kaggle. In this chapter, we have used linear, logarithmic, polynomial and
    Gaussian functional models for a COVID-19 dataset.


    According to these models, we forecast the number of patients and death for Corona
    disease for the subsequent 120 days from the actual position of Covid cases at
    the end of Oct 2020 in India. After the analysis we find the polynomial function
    model is a very impressive model for forecasting. In this study, we find Covid
    infection grew in the next 120 days in India.


    With the help of the prediction obtained from this research, the Indian Government
    can take preventive measures for controlling Corona disease such as lockdown and
    implementing social distancing. Another benefit is to develop medical facilities
    for providing for such a huge number of patients.


