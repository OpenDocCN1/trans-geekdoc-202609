  md: '# # High Performance Computing for Intelligent Medical Systems


    # Varun Bajaj and Irshad Ahmad Ansari


    # # Chapter 12


    # ## Recent trends in medical image segmentation with special focus on brain tumours
    and retinal images


    # **Mithlesh Prasad Singh, Aheibam Dinamani Singh, Rajesh Kumar, Kishorjit Nongmeikapam
    and Wahengbam Kanan Kumar**


    In a variety of areas from diagnosis and prediction to treatment based on the
    course of a disease, medical imaging plays a pivotal role. Image segmentation
    is a process that extracts the area of interest automatically or semi-automatically.
    Multimodality imaging is a concept used to capture an area of interest in the
    format used by various types, such as computer tomography (CT), magnetic resonance
    imaging (MRI), positron tomography (PET), etc. Various literatures demonstrated
    that their combination generates better classification of normal and abnormal
    tissues of brain, retina, lungs, kidney, etc. This chapter surveys state-of-the-art
    researches on biomedical image segmentation for brain tumours and retina segmentation,
    abnormality detection, advantages, disadvantages, and automated-learning techniques
    ranging from traditional machine learning to deep learning. The study also examines
    popular databases and contemporary approaches published so far. The chapter also
    provides a glimpse of key gaps and potential future scope for biomedical image
    segmentation of retina and brain tumours.


    # ### 12.1 Introduction


    One of the critical aspects of today’s medical diagnosis process is biomedical
    imaging, as it is used in all fields of modern medicine [1]. Biomedical image
    examination is virtually always a complicated and prolonged task which specialists
    still struggle with [2, 3]. Biomedical image evaluation by medicinal specialists
    is an essential process for detection of pathologies. Analysis of different medical
    imaging modalities using computers has been in usage since as early as 1982 [4,
    5]. Many techniques have been introduced since then, with each having an objective
    to increase accuracy/efficiency during computerized automated detection [6]. Today’s
    technological progress could'
  merge: -1
  img_proc: true
- pgno: 275
  md: 'make it feasible to use new methods in the health domain. Throughout the practice
    with biomedical imaging, a medicinal practitioner relies upon subject reports
    and consequently makes specific and appropriate diagnosis about the subjects’
    status. Depending on the type of task there exist some forms of biomedical image
    examination techniques; some of them include segmentation based on organ and substructure,
    detection based on object, registration, prediction based on classification, classification
    based on objects, detection based on region and landmark, segmentation based on
    the item and others. A maximum number of researches focuses on segmentation based
    on organ and structure.


    In patients’ diagnosis and medication, imaging helps radiologists or clinicians
    make the diagnosis and prescription efficient. Currently, there is a wide variety
    of modalities for imaging soft and hard tissues/regions of the body. It has paved
    the way for more improved and early detection of abnormalities, and for possible
    early course of treatment. The foremost widely used modalities can be partitioned
    into two general categories: anatomical and functional. In this chapter, we only
    discuss the anatomical modality. These images can be represented in 2D, 3D and
    4D systems. The elements of an image in 2D are referred to as pixels, while in
    4D, they are referred to as voxels.


    # 12.1.1 Types of biomedical imaging


    +   A. X-ray. The most prevalent mode of screening that exists for identifying
    breaks and dislocation in bones is x-ray imaging. The image developed is 2D. One
    hundred thousand chest x-ray samples were provided by the National Institutes
    of Health (NIH) with relevant information and diagnostics to enhance imaging analysis
    techniques [7]. Similarly, a dataset comprising a sample of more than 350 000
    body part x-rays for improving machine learning algorithms has been released by
    the Massachusetts Institute of Technology (MIT) to automatically diagnose specific
    disorders such as pneumonia or pinched lung, etc [8].


    +   B. Computed tomography. It is also commonly referred to as a CT scan, and
    uses a computerised form or image acquisition in which 360 degrees of x-rays are
    aimed at the patient to create accurate cross-sectional representations of the
    body’s inner organs, bones, soft tissue and blood vessels. Traditionally, the
    images are taken in the transverse plane or axial plane perpendicular to the body’s
    long axis. However, it is possible to reformat these images, also known as slices,
    into multiple planes and create a three-dimensional image. By locating the presence
    of tumours and their scale, it is widely used to identify cancer and is among
    the most frequently addressed biomedical imaging issues. The National Institutes
    of Health (NIH) had given easy accessibility to 32 000 CT scan images with related
    information and diagnoses for enhancing lesion identification accuracy [9].


    +   C. Magnetic resonance imaging. It is also commonly known by the term MRI scan,
    which uses intense magnetic fields to capture images of soft tissues within the
    region of interest of the human body. It is different from CT and'
  merge: -1
  img_proc: true
- pgno: 276
  md: 'x-ray techniques which are rather used for capturing images of hard tissues
    of the body, such as bone fractures in different regions. Classification of grey
    matter, whiter matter and cerebrospinal fluid (CSF) using MRI scans has been carried
    out successfully. It has also led to the timely diagnosis of brain tumours, aneurysms,
    and haemorrhage. The OASIS project has collected neuro-imaging data sources for
    biomedical imaging studies comprising more than two thousand MRI sessions [10].


    +   D. Ultrasound imaging (USI). It uses high-frequency vibration waves to give
    inside organ, tissue and bloodstream visual images. It is the most widely used
    technique in the reproduction process to track the foetus. It is mostly used for
    the stomach, vascular and thyroid filters and usually not used in the imaging
    of air-containing bones and tissues such as the lungs. The positive thing about
    using USI is that it is quick and free of radiation.


    # ## 12.1.2 Biomedical image segmentation


    Biomedical image segmentation (BIS) has been a comprehensive application since
    the 1990s. Segmentation is a process of partitioning an image picture into sub-images
    having similar grey scale intensities. The other elements can be colour, texture
    and brightness. The segmentation is used to subdivide the objects into detailed
    pictures used for depth analysis. Some of its crucial tasks are as follows: firstly,
    investigating the internal structure of human anatomy in detail; secondly, recognizing
    the precise location of abnormalities such as tumour or cancerous cell growth;
    thirdly, it helps in identification of multiple numbers of lesions, exudates,
    and other anomalies; and finally, it measures tissue volume to measure tumour
    expansion.


    BIS approaches can be divided into three distinct classes depending on the extent
    of human involvement: manual segmentation, semi-automated segmentation, and fully
    automatic BIS [11, 12]. The following categories are described:


    +   A. Manual segmentation of the biomedical image. Here, the region of interest
    (ROI) is specified by a well-qualified expert after which a contour is drawn around
    it [11, 13]. Prolonged and challenging work is manual segmentation. This process
    of manual segmentation is again composed of two different types, which are known
    as ‘inter-rater’, and intra-rater. In the case of the former, multiple experts
    segment the image in various ways, whereas in the latter, a single expert segments
    an image in a variety of ways [14]. Manual segmented images are utilized as ground
    truths in automated segmentation algorithms for teaching artificial intelligence
    (AI) on how a disease should look. High-resolution images can lead to images without
    sharp edges, which leads to small differences in the choice of ROI boundary pixels.
    The fact that the approach relies on knowledge and experience is another issue
    of manual segmentation and thus, therefore, experiences considerable heterogeneity
    between and within the experts [15]. Although manual segmentation is dependent
    upon the evaluator, it is used in clinical studies with non-significant time limitations
    [16, 17].'
