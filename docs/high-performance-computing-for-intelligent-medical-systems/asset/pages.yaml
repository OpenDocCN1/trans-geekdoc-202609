    # 3.5 Discussion and conclusion


    Based on this survey, we can summarize our review as follows.


    +   - The unnecessary delay between the data collection and the processing and
    analysis capacity is often the reason IoT is not fully and efficiently utilized
    in the healthcare industry.

    +   - The big challenge that any patient faces is the unavailability of doctors
    and care in severe situations, and in particular when living in rural areas. Therefore,
    a new architecture needs to be established through the use of IoT devices.

    +   - There are also cases in which, for example, people with a chronic illness
    need long-term monitoring. Continual supervision is highly necessary in this respect.

    +   - In order to be able to communicate everywhere the IoT healthcare network
    has to have the potential to facilitate the flow of patients. This will involve
    an advanced IoT environment that takes into account networking customization without
    undermining data protection.

    +   - Most studies concentrated on voice disease and its results only distinguish
    between a voice that is normal and a voice that has a pathological disorder where
    a full IoT system for the diagnosis of a particular disease, such as laryngeal
    cancer, is required. Since laryngeal cancer is a life-threatening condition, early
    diagnosis of laryngeal cancer requires a new and successful system / model.

    +   - Although ML is being used in medical diagnosis, its design must be sufficiently
    precise to prevent any mistakes in the classification process. In addition, cybersecurity
    requirements, as well as legal and privacy challenges must be considered for the
    development of proven algorithms in order to benefit from the faith of patients
    and healthcare service providers.

    +   - The delayed implementation of the use of ML technologies in medical diagnostics
    requires more ready acceptance and assistance by organizations and simplification
    of existing instruments for patients’ and doctors’ usage.

    +   - There is an absence of a particular data set for a certain illness, like
    laryngeal cancer, where various voice disorders are found in the currently existing
    dataset. Moreover, the allocation of samples is highly uneven, making it'
