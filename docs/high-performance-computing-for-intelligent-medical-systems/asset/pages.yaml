  md: '# 7.4.2 The role of timely feedback


    The purpose of patient feedback systems is to offer high quality health information.
    Such information can work as an enabler for enhanced organizational and patient
    outcomes [59]. Patients’ opinions about their visits to the doctor offer beneficial
    information for health professionals and comprehensive awareness of the causes
    of diagnostic errors with critical, unique insights [6, 60]. Healthcare providers
    should ensure that systematic feedback on diagnostic performance extends to doctors
    and care teams involved in care and organizational management [61, 62]. Periodic
    feedback is necessary for improved diagnostic performance and quality improvement
    in healthcare but is often absent [17, 53, 63, 64]. Such feedback, however, could
    be valuable as a regular part of the assessment policy [2].


    Diagnostics centered feedback systems should provide evidence-based information
    on critical areas of clinical practice [2]. Such feedback is welcome from both
    professionals and healthcare consumers [2]. Healthcare clients’ more prominent
    role in the diagnostics phase means that patients are ‘at the center.’ Such policy
    reflects ‘rehumanized medicine’ [62]. High-quality feedback from diagnostics can
    mean enhanced organizational and patient outcomes that benefit both patients and
    doctors by eliminating preventable adverse events and improving the diagnostic
    process [2, 53, 59, 60, 65].


    Patient involvement should thus have a stable position in professional development
    within the clinical practice. However, this presupposes the existence of such
    cultural attitudes and values that foster patient-centered care and continuous
    learning [57, 58]. Even complete re-engineering of services and novel technologies
    without correct staff engagement do not change policies accurately [30]. Feedback
    should be part of learning systems that focus on improving diagnostic performance
    [56]. This helps target individual counseling assistance and aids in identifying
    doctors who may need educational support or retraining [66].


    Patient engagement is a matter of supporting people in benefiting more from the
    healthcare system [2]. However, this engagement may be challenging for patients
    and their families [2, 67]. Disease-related stress with lower physical health
    can prevent people from engaging genuinely in the diagnostic process [2]. Some
    patients prefer active involvement in all aspects of the decision-making process,
    while others would instead rely on a doctor’s assessment [2]. Feedbacks systems
    should also allow space for those health consumers who have already experienced
    a diagnostic error. Such individuals are often ready to share their experiences
    to enlighten future patients’ diagnostic processes [2, 68, 69].


