    # 12.3.8 Deep learning


    Figure 12.1 below highlights the different constituents of a CNN-based brain tumour
    segmentation. The deep learning model (DL) of [120] uses 2D patches having different
    dimensions as inputs for two separate pathway CNN-layer stacks for performing
    convolution. The features liberated from the two CNNs were concatenated together.
    In a similar, yet improved version, the researchers of [121] investigated a two-pathway
    DL technique by having 3D patches as input. Their network used residual connection
    and produced multiple voxels as output. Another DL model that is used widely is
    the U-Net [122], which uses encoder-decoder model.'
