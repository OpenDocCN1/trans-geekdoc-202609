  md: 'outside the EGG. EIT technology appears to be promising in future voice research
    and diagnostics, although daunting in mathematical and engineering terms.


    Two different methods have been used to establish the physiological meaning of
    the EEG waveform and its landmarks, using experimental evidence from controlled
    experiments and using analytical techniques. For example, with photoglottography
    (PGG) [56], videostroboscopy [57], in vivo air circulation in glottis [58], some
    initial empirical multiple-signal validations have been carried out. A number
    of outstanding contributions in the ‘golden era’ provided a sufficient understanding
    of the landmarks of the EEG waveform and its connection with the vocal fold vibration
    [45, 47, 49, 59–63]. These investigations used some form of time-synchronous laryngeal
    imagery, using a fast video imaging technique with frame rates of up to 5000 fps.
    The authors of [64] who used the first EEG signal derivative have further verified
    their findings.


    The most prominent characteristics of the EGG waveform are hypothesized moments
    of interaction or decontact of the vocal fold. The ‘knee’ in the EGG waveform
    represents another signature [59]. It is a convex dislocation on the side of the
    waveform [45]. This EGG feature found during the decontact phase of the glottal
    cycle corresponds to the opening along the top edge of the glottis. [45, 65] discussed
    the relationship between the presence or absence of an EGG ‘knee’ and the spectral
    acoustic waveform characteristics and [66] suggested an intelligent algorithm
    for detecting ‘knee’ and other EGG waveform inflexions.


    **EGG (de) contacting versus glottal opening and closure.** EGG is often not used
    and interpreted in itself as a VFCA measurements process, but instead as a non-invasive
    approximation quantification that theoretically emulates glottal airflow of high-speed
    video (HSV) recordings. The explanation would be that the reliability of relationship
    between the laryngeal air flow varies from time to time since it is dictated by
    the dynamics of the vocal fold’s vibration, and the sound quality generated by
    the larynges. The localized pressure gradient that occurs through a mostly abrupt
    ceaseflow of the laryngeal flux, at the glottal closure incidence, constitutes
    a significant proportion of that tone. The timing of the occurrence of glottal
    closures—commonly known in the speech processing domain as ‘glottal closure instants’
    (GCIs)—is a significant component towards voice quality, and a corresponding physiological
    measure would therefore be beneficial. To a minor extent, the same reasoning applies
    to glottal openings (GOIs) [67–69]. Findings from early work indicate that positive
    dEGG peaks are well-related to that of the GCI [60, 70], while the authors have
    reported the GOI, which would have been thought to be more variable might occur
    at various points throughout the background of the glottis [70]. Therefore, it
    may be difficult to identify GOIs by using the EGG signal’s feature alone. But
    it may also be inaccurate if GCI is in precise synchronization with the positive
    dEGG peak. [71] records an error rate of 0.24 ms in the GCIs of ten speakers that
    has been deduced using inverse-filtered airflow and dEGG positive peaks, respectively.
    The deviation was 0.68 ms, which would equate to approximately 8.2% of the glottal
    period in males and approximately 13.6% in females.'
