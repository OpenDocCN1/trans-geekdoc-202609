    # 12.2 Retinal images segmentation


    # 12.2.1 Datasets


    Several publicly accessible professional data sets containing blood vessel descriptions
    are available. The first step in the retinal database is to train and assess classifiers
    for segmenting blood vessels. Researchers have access to these databases—STARE
    and DRIVE etc, along with their ground truth files, which can be obtained freely.
    The performance and exactness of the classifier can be evaluated with the following
    data sets.


    # A. Structured analysis of the retina (STARE)


    It contains 400 retinal images and possesses a 605 x 700 pixel 8 bit Color channel
    via TOPCON''s TRV-50 fundus camera with 35-degree field of view (FOV). The average
    diameter of the FOV is 650 x 700. STARE consists of twenty samples of vessel ground
    truths files which can be used for training classifiers to segment blood vessel
    to demonstrate the presence of healthy and distinct types of ocular diseases.
    The very first specialist separated 10.4% of the blood vessel''s pixels'', whereas
    the second expert manually segmented the thinner retina vessel 14.9%. The ground
    truth obtained from these manual segmentations of the first professional is commonly
    used for evaluating a trained classifier''s precision and efficiency


    # B. Digital retinal images for vessel extraction (DRIVE)


    This dataset is a very widely used for studying segmentation of retinal blood
    vessels. It is made from 20 photographs of the retinas, each of which reveals
    mild retinopathy, with 33 healthy retinal fundus images and 7 images suffering
    from moderate diabetic retinopathy (DR). The Canon CR5 camera with 45 degrees
    FOV and then a color channel of 8 bit in JPEG format was used for taking photographs
    at 768 x 584 pixels. The circular field of view of each images has radius of 270
    pixels. The DRIVE dataset was divided into 20 pictures each in a training and
    test package. In the training sets, 14 of 20 sample images were segmented by first
    specialists, while the second specialists segmented the six remaining sample images.
    The vessel was segmented twice in the test set for evaluation. During the first
    circumstance 13 and 7 sample pictures were segmented by first and second specialists,
    while the second scenario consisted of a segmentation procedure by a third specialist.
    12.7% and 12.3% pixels were identified in both the circumstances.'
