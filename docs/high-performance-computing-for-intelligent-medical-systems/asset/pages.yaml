    +   - The SVM classification is found to be the most commonly used, especially
    in comparison with any other ML algorithms. This can be because it is easier to
    reach a broad database of pathological voices for analysis, and it may be because
    the SVM classification is best for high dimensional data and for small datasets.
    In comparison, deep learning and neural networks require a broad dataset to train
    the model to increase classification precision.


    +   - Most of the advances suggested in the literature rely on methods of voice
    characterisation, which they refer to as a technique of extraction of traits.
    A deep learning methodology may be used to extract deep features, but it requires
    broad training examples. Although DNNs have become a powerful ML tool, relatively
    few works have been performed for deep learning since there are no large datasets
    available.


    +   - Many articles also observed that pathology diagnosis was exceptionally reliable,
    and has in some cases risen to 100%. That being said, the findings are unique
    to the used database and the method established for one database cannot be expected
    to extend to all databases with the same amount of productivity. The cross-database
    and cross-geographic recognition of vocal fold pathologies would be an issue which
    needs to be solved.


    +   - The existence of massive standard databases is important for the implementation
    of a clinical infrastructure in real time. As far as we know, the number of common
    benchmark bases is small because the construction of a database involves the assistance
    of physicians who are specialists in voice disorder diagnosis. An integrated framework
    for a specific hospital may be built using the local database. Clinicians usually
    use sound files for diagnosis, but they cannot detect or preserve the sound files
    on the basis of diseases over the long term. It would be of immense advantage
    to provide an IoT based archive storage medium that archives audio recordings
    instantly depending on the illness.


    +   - Popular methodologies like HMM, GMM, etc have their own boundaries and merits.
    They provide good outcomes if the framework relies on text. The GMM is very useful
    in the preparation of a mixture. GMM is a probabilistic approach that gets fuzzy
    observation. In comparison, there are drawbacks. For text-independent voice comparison
    framework, methods such as HMM are not appropriate. It is only good for capturing
    small voices. If there are a massive number of distributions and large datasets
    are required, GMM is computationally expensive. In comparison, deep learning approaches
    supply the speaker with straightforward modeling. They have a comprehensive de-noise
    learning module. They need an optimal framework, though, and overfitting is a
    challenge.


    +   - The review of literature has shown that it is often difficult to pick voice
    recordings. Researchers rely on both voiced and unvoiced sample elements, since
    the unvoiced portion of the speech samples also has evidence of pathology identification.
    It is also noticed that a letter, phrase or delay'
