    # 12.4 Discussion and conclusion


    This chapter presents the work, i.e., pre-existing and current techniques, accomplished
    by other researchers related to biomedical images segmentation, especially retina
    vessel segmentation and brain tumour segmentation. Here every referenced paper
    is summarized. It presents numerous types of segmentation by using different methods.
    Each segmentation approach reviewed here has its leads and constraints, and setting
    a particular benchmark for comparison is inappropriate. The segmentation of biomedical
    images has been broadly categorized in this paper. The validation of segmentation
    outcomes is a quintessential subject in biomedical image analysis since it directly
    influences surgical judgments. Orthodox machine learning algorithms can be further
    improved. For example, the method of extraction is mostly performed using a series
    of pre-specified filters in most conventional machine learning algorithms. Thus
    it would greatly increase efficiency if data-driven extraction methods were devised
    for conventional learning algorithms. Recent research on the segmentation of biological
    images relies mostly on the paradigm of deep learning. Finding high-quality biomedical
    image data is always a challenge. Deep architectures like ResNet, VGGNet and GoogLeNet
    typically overfit the learning framework significantly in cases where there are
    not enough training images, even after including regularisations, dropouts, and
    model averaging. The accuracy of CNN in the classification task of biomedical
    image datasets with GoogLeNet architecture has been steadily increased due to
    an increase in training images. The current level of classification is too simple
    for practical biomedical imaging processing, such as segmentation, but a fundamental
    relationship between efficiency and consistency of the training data set has been
    identified. Researchers have trained 3D segmentation models with only 2D segmentation
    in brain tumours segmentation study. A further scientific difficulty in the segmentation
    of brain tumours is that researchers apply the same fixed size to a kernel, which
    may mask any helpful information from another area that the kernel does not know.
    The way to enlarge the data set is more manageable, by random translation, tossing
    and rotation, to transform the primary data set. In regular machine learning algorithms,
    this term known as data augmentation is used previously. A lot of hyperparameters
    are essential for modern and deep learning arrangements. Minute variations in
    hyperparameters can lead to excessively significant network performance changes.
    While background and optimization by stochastic gradient descent methods also
    automatically learn how to weigh the network, many hyperparameters are also involved
    empirically, such as layer numbers, regularity coefficients and dropout rates.
    Deep learning methods, however, have still not been adequately improved but'
