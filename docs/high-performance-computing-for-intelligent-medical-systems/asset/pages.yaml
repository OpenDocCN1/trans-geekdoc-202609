    # 8.8 Conceptual terms used in different SC techniques


    # 8.8.1 Chromosomes and genes


    The chromosome is the collection of genes and it is treated as a string of values,
    that is, a function, say F(x;y;z;), having three variables if needed to be maximized
    when 10 binary bits are required to represent one variable, then 30 bits will
    be required to represent a chromosome consisting of three genes.


    # 8.8.2 Chromosome representation


    A chromosome consists of genes namely object genes and strategy genes and it represents
    data for x and y coordinates.


    # 8.8.3 Cross-over


    The generation of new offspring (new solution) by mixing up portions of chromosome
    (solutions) with other corresponding portions of another chromosome is termed
    as cross-over.


    # 8.8.4 Mutation


    To generate a better version of offspring or to produce a better solution, mutation
    may change the gene value representing the problem solution completely from one
    generation to the next generation.


    # 8.8.5 Weighting function and PBME


    The function of search points having minimum value, that is, least search locations
    for the best match in all directions on a plane is represented by a Weighting
    function (WF) and is vital in determining the performance of BMAs. The best BMAs
    are associated with the least value of WF.


