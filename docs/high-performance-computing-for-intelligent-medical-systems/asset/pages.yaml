    Various methods have been proposed for detection and classification of HPT in
    the literature. The filtering method requires selection of filter coefficients
    which are difficult to select, whereas in wavelet based methods selection of mother
    wavelet and decomposition level is difficult. The main contribution of this chapter
    is to design an automatic ECG detection system to discriminate between normal
    and HPT patients using flexible analytic wavelet transform (FAWT) and different
    machine learning algorithms to identify the most discriminant features and most
    suitable classification technique.


    The rest of the chapter is organized as follows. Methodology is presented in section
