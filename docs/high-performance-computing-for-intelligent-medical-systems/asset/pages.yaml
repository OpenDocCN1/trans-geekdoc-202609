    # 13.2.2 Blood pressure


    The heart pumps blood in arteries during beat time and the pressure experienced
    by the arteries is measured as BP. Further, blood pressure is of two types: one
    is systolic which is during beat time, and the other is diastolic which is during
    rest time between two beats. BP is measured in two numbers which shows systolic
    and diastolic pressures. The standard way to write the BP is to write systolic
    first than diastolic, e.g. 110/80 (110 is systolic and 80 is diastolic).


    Much of the time high-BP (H-BP) does not show any symptoms. The only way to find
    the H-BP is with regular monitoring of BP. Commonly, H-BP has two types: primary
