  md: '# Chapter 11


    # Computational intelligence for eye disease detection


    Amit Kumar Verma


    High performance computing has an important role to play as the medical field
    depends on fast sensing, proper examination and analysis. Computational intelligence
    thus has a greater role to act in the detection of eye diseases, especially related
    to the retina. Changes in the retina may be the indicator of various eye diseases
    along with diseases or disorder related to the central nervous system and cardio-vascular
    circulation. The retina is a membranous layer of tissue which is thin and provides
    central vision. Many eye diseases manifested through the retina are retinal tear,
    glaucoma, optic nerve disorder, diabetic macular edema, diabetic retinopathy,
    detachment of retina, hole in macula, degeneration of macula and other cardiovascular
    disorders like myocardial infarction and atherosclerosis. The retina is vulnerable
    to various organ specific as well as many systemic diseases, while retina imaging
    helps in the diagnosis of proper eye disease along with complications of diabetes
    retinopathy, hypertension, myocardial infarcion etc. Retina analysis is a non-intrusive
    diagnosis technology. Through the use of computational intelligence via image
    processing techniques, the various eye diseases can be detected at a very early
    age of their initiation. This chapter focuses on the anatomy of the eye, physiology
    of the various eye diseases, retinal imaging methods-2D fundus imaging and 3D
    optical coherence tomography (OCT) and their comparative analysis. The chapter
    actually deals with retinal imaging and its clinical implications in the diagnosis
    or detection of eye diseases. In addition of this, the chapter also discusses
    different methods which are used for detection of glaucoma.


    # 11.1 Introduction


    Globally, the problem of loss of vision due to various eye diseases has attracted
    various researchers from medical, pharmaceutical and computer science backgrounds.
    As per the first world vision report compiled by WHO on October 8, 2019—2.2 billion'
  merge: -1
  img_proc: true
- pgno: 259
  md: 'people have a problem with vision impairment, out of which 1 billion people
    could have been prevented from vision loss. It also points out that elderly people
    are the most affected in terms of vision impairment or vision loss. Presbyopia
    affects 1.3 billion people in which there is difficulty seeing nearby objects.
    Myopia disturbs 2.6 billion people with 312 million under 19 years of age. Similarly,
    diabetic retinopathy affects 3 million, glaucoma affects 6.9 million, age related
    macular degeneration affects 10.4 million of the population. The report explains
    that accessibility for eye care and the high costs involved, particularly in rural
    areas, were the main contributor of vision loss and impairment. Retinal imaging
    is the technique of taking digital pictures of the back of the eye using computational
    intelligence. It depicts the retina, the disk that holds the main optic nerve
    and blood vessels involved; thus doctors find various retinal diseases and examine
    the status of the eye, however, an ophthalmoscope is used to examine the eye but
    retinal imaging provides an opportunity for the ophthalmologist to get a much
    wider digital view of the retina, thus adding extra precision to the regular eye
    examination.


    # 11.2 Anatomy of the eye


    The sight organ of the human body is the eye, which is a slightly symmetrical
    globe measuring an inch in diameter, approximately 25 mm (figure 11.1). The remarkability
    of the eye is that it can detect a single light photon. The perception of the
    colour, depth, motion, distance, speed, lightning etc, makes it the primary sense
    organ of the human body. When you see yourself in the mirror, the front part of
    the eye includes:


    +   1. Iris: this is the coloured portion;

    +   2. Cornea: this is clear domed shaped over iris;

    +   3. Pupil: this is circular opening black in colour in the iris for incoming
    light;


    ![](img/75406d5bb714dfd3e68fbbc717bd8f67_259_0.png)


    Figure 11.1. Anatomy of human eye.'
  merge: -1
  img_proc: true
- pgno: 260
  md: '+   4. Sclera: this is white part of the eye;

    +   5. Conjunctiva: leaving the cornea, this is the tissue layer that covers the
    entire front of the eye.


    # 11.2.1 The cornea


    In the front of the iris and pupil lies the most anterior part of the body called
    the cornea. It is considered to be a highly dense innervated tissue of the body.
    The average dimension of the cornea of the adult human eye covers 11.5 mm horizontal
    diameter and 10.5 mm of the vertical diameter with constant curvature [1]. The
    trigeminal nerve has the ophthalmic entity which is the source of the corneal
    nerve [2]. Four millimetre is the size of pre-pupillary cornea, also termed the
    optic zone and situated in the middle of the cornea in a photopic condition. There
    is a difference in the physiology and pathological condition of both the central
    and the other type of cornea, that is, peripheral [3].


    +   The human eye consists of five layers:

    +   I. The epithelium;

    +   II. The Bowman''s membrane;

    +   III. The lamellar stroma;

    +   IV. The Descemet''s membrane;

    +   V. The endothelium.


    # I. The corneal epithelium


    Its surface is covered by the tear film which has the vital role of protecting
    the corneal surface from microbes, toxic chemicals or any xeno substances. The
    tear film has an outer lipid layer and inner water mucus layer. The tear film
    gets spread with each eyelid blink due to interaction between the epithelial cells
    and the outer lipid layer. The corneal epithelium consists of:


    +   (a) 2–3 layers of superficial cells;

    +   (b) 2–3 layers of the wings cells;

    +   (c) one layer of basal cells.


    The folding of microplicae contribute irregularity to the surface of the superficial
    cells of the epithelium and shows interaction with the overlying tear film. Around
    seven to ten days is the renewal time of the cells of the corneal epithelium.
    The presence of the cell junction provides impermeability, stability and anchoring
    to the corneal epithelium [4].


    # II. The Bowman''s layer


    It separates the epithelium from the corneal lamellar stroma. It is a cellular
    zone of 10-15 micrometers.


    # III. The corneal lamellar stroma


    It provides structural anchoring to the cornea of the eye. The transparency and
    the hydration state of the cornea is maintained by the stroma keratocytes (stellar
    shaped cells) which release collagen and proteoglycans, collagen fibres in parallel
    arrangement (n = 200–250) running from limbus to'
  merge: -1
  img_proc: true
- pgno: 261
  md: 'limbus [5] constitute the bulk of the stromal extracellular matrix. Collagen
    fibres’ regular organisation contributes to the corneal transparency and also
    provides mechanical strength to the cornea. Due to the compact packaging of the
    fibril more in the pre-pupillary cornea than the peripheral cornea, the cornea
    has mechanical strength and dioptric stability [6]. Proteoglycans, which surrounds
    the stromal collagen fibrils consists of keratin sulfate or chondroitin sulphate/dermatan
    sulphate side chain, thus regulating hydration of the eye.


    # IV. The corneal endothelium


    It is 5–7 sided cuboidal cells in a single layer. They secrete Descemet’s elastic
    membrane which causes separation between stroma and the endothelium. The endothelium
    has an osmotic transport system where the osmotic gradient generates a constant
    percentage of the water in the stroma maintaining clarity and transparency of
    the cornea (hypoosmotic stroma to hypertonic aqueous); this whole process is called
    deturgescence, and its disturbance results in corneal edema.


    Note: in a normal transparent cornea, visible light neither gets absorbed nor
    scattered. The condition of corneal scattering occurs due to:


    +   * corneal edema;

    +   * restoration of the collagen fibrils;

    +   * hazes;

    +   * surgical irregularities.


    # 11.2.2 The human retina


    The inner surface of the eye is lined by the inner tissues surrounding the vitrous
    cavity and held by the surrounding sclera and cornea. The neural retina is inside
    of the optical wall encircling the vitrous cavity, whereas the outside of the
    wall is surrounded by pigment epithelium (sclera and choroid) [7, 8]. Mullerian
    glia is the backbne of the neural retina and the light is captured by neural retina,
    having six main class of neuron—ganglion cells, bipolar cells, horizontal cells
    and amacrine cells. The outer nuclear consists of a nucleus of the photoreceptor
    cells, and in the inner nuclear of the retinal lies the cells of bipolar, horizontal,
    amacrine and Maglia. The inner nuclear further has the layer of the outer plexiform
    composed of photoreceptors joined with horizontal and bipolar cells. On the other
    hand, a layer of the inner plexform has amacrine and bipolar cells which have
    synapses with the cells of the ganglion. Mullerian glia processes extend to the
    retina. In a human there are two types of photoreceptor—rods and cones. Cones
    consist of the pigment with the absorption signal in various spectral ranges of
    colour of yellow, blue, and green. Rods having pigment show absorption in the
    colour region of green and blue. Rods are not involved in colour vision, they
    are active in low light levels [9].


    Foveola is the thin, avascular bottom of fovea containing densely packed cone
    cells resulting in highest visual acuity. Henle’s Fibres are the elongated fibres.
    RPE is a monolayer adjacent layer of the choroid. Light enters the eye and is
    captured by'
  merge: -1
  img_proc: true
- pgno: 262
  md: 'the photoreceptor at the back of the retina. After passing the lens, visual
    images are inverted, the right half image is projected onto the nasal retina of
    the right eye, and the left half of the image is projected onto the temporal retina
    of the right eye and the nasal retina of the left eye. The neural retina''s neuron
    passes the visual information into the nerve impulse which travels through the
    optic nerve to the brain.


    # 11.3 Retinal diseases


    The various existing diseases related to the retina are:


    +   1. Detachment of retina/tear problem;

    +   2. Retinopathy caused by diabetes;

    +   3. Hole in the macula;

    +   4. Degeneration of macula;

    +   5. Disorders of optic nerve;

    +   6. Glaucoma;

    +   7. Diabetic macular edema (DME);

    +   8. Retinopathy of prematurity (ROP).


    # 11.3.1 Retinal tear


    In retinal detachment, there is separation of retina from the pigment epithelium.
    This may be due to an injury or tumour or inflammation to the eye or inflammation
    of the underlying choroid. The characteristic feature is the development of a
    hole as well as a tear. The tear is formed due to the forces applied on attachments
    between the retina and the vitreous humour that fills the interior of the eye.
    Vitreous pulling of the retina can be due to injury or changes due to age factor
    or sudden movement of the eye which further causes fluid to enter the small hole
    and causing striping. Retinal detachment is common to myopic (near-sighted) eyes.
    The pull of the vitreous on part of the retina creates a retinal tear. There is
    observation of brief light flashes observed by the affected person during eye
    ball rotation. The perception of coming shadow in the front of the eye indicates
    the beginning of a tear in the retina.


    # 11.3.2 Diabetic retinopathy


    Diabetic retinopathy is an eye illness that results due to the metabolic disorder
    of diabetes. In this alarming disorder a high level of glucose damages the retina
    of the eye. There is cessation of blood through the blood capillaries, hence abnormal
    dilation is possible. There is additional development of blood capillaries on
    the retina. This all leads to the development of blurring then blindness. Swelling
    of the capillaries can result in the creation of edema of the macula. The disease
    progression signs include two-fold vision, eye ache, macular hole, floaters.


    # 11.3.3 Macula hole


    One important part, the macula, plays a vital role in the various activities related
    to vision such as book reading, vehicle driving and perception of things, thus
    causing promotion of fine proper vision. The drawing of the eye fluid vitreous
    humour is'
  merge: -1
  img_proc: true
- pgno: 263
  md: 'responsible for the creation of a gap in the macula. The gap is responsible
    for the softening of the macula. Extreme short sightedness, advancement of epiretinal
    membranes, separation of the retina and diabetic retinopathy all contribute to
    the creation of macular gap.


    # 11.3.4 Degeneration of the macula


    The degeneration of the macula can be inherited or can be from age related factors.
    It is an uncommon class of retinal degenerative diseases collectively called retinitis,
    pigmentosa of retina and similar disorders. The preliminary sign is night blindness,
    observed in childhood because of a change in the function of the rods. The thinning
    of vessels and the dispersion of pigment clumps progresses to ''tunnel vision''.
    Retinitis pigmentosa is due to malfunctioning in genes coding of amino acids sequences
    engaged in light sensitivity. Age-related macular degeneration (ARMD) is possible
    in patients over fifty and affects central vision and spares peripheral vision.
    This is a major contributor of vision loss. Age-related macular degeneration disease
    is categorised as


    +   (a) Dry type macular degeneration


    There is development of colour filler, that is, drusen slightly yellow; the other
    incorporation is epithelium percentage, all collectively leading to the dry type
    of degeneration.


    +   (b) Wet macular degeneration (containing abnormal blood vessels)


    In this, there is bleeding, and detachment of vessels filled with blood in the
    gap that exists between two anatomical features of sensory retina part and pigment
    epithelium part. This is noticed in someone suffering from a high blood glucose
    problem and high blood pressure. Degeneration of the macula affects central visual
    acuity, however, it does not cause total blindness but makes reading or fine detail
    work difficult or impossible.


    # 11.3.5 Disorders of the optic nerve


    The optic nerve is responsible for the signal transmission from the eye to brain
    and from brain to eye, therefore, proper nerve transmission is important for the
    good health of the eye. Due to the development of the various pressures inside
    the skull the eye may face problems which in due course of time tend to the development
    of various eye diseases. When this pressure remains persistent for continuous
    time it inflames the nerve and hence swelling can occur. This starts to damage
    the fibres of the optic nerve resulting in various disorders of the optic nerve
    like low vision. Young adults are the main sufferers. Optic neuritis may be a
    manifestation of multiple sclerosis where the sheaths of the optic nerves have
    changed and interfere with the transmission of nervous impulses.


    # 11.3.6 Glaucoma


    This is caused when drainage of the aqueous humour is blocked due to blockage
    of specialized drainage channels at the base of the iris. This intraocular pressure
    may'
  merge: -1
  img_proc: true
- pgno: 264
  md: 'cause atrophy of retinal nerve fibres and causes blurred vision, so enhanced
    strain on human eye pressure is a risk contributor for the development of glaucoma,
    which is combination of problems that result in the development of nerve damage.
    Glaucoma is a strain sensitive disease depending mainly on the optimum strain
    of the eye. In normal conditions the human eye can withstand strain in the range
    of ten to twenty mm of Hg. So, the calculation of the strain is considered an
    appropriate marker for the detection of this disease, however, there are many
    clinical cases reported where there is glaucoma in spite of normal strain values.
    Two main categories of this disease are open angle type, common in older patients
    and angle closure glaucoma, caused due to blockage of the outflow of aqueous humour
    through the trabecular meshwork.


    # 11.3.7 Diabetic macular edema


    Fluid accumulation in the macula, or central portion of the eye, caused by the
    complication of diabetes results in swelling of the macula. Filling of the macula
    with cells causes blurred vision that plays a vital role for sharp, straight ahead
    vision that helps in reading and driving.


    # 11.3.8 Retinopathy of prematurity


    Retinopathy of prematurity is a disease which widely affects children or infants
    and is the main cause of vision loss. Basically, there is a problem occurring
    in the retina of babies having non-appropriate weight.


    # 11.4 History of retinal imaging


    In order to get the visual photo of inner retina, various special techniques are
    needed. For various analyses there was publication of a method that applied fluorescein
    angiography for image analysis based on mathematical morphology, primarily focused
    on vessel segmentation [9], done by Matsui et al. The French physician Jean Mery
    successfully depicted that on immersing a live cat in water, the cat''s retinal
    vessels would become visible from the outside and this idea inspired Jan Evangelista
    Purkyně, who was a researcher, to invent the principles of the ophthalmoscope
    in 1823, then Charles Babbage reinvented it in 1845 [10, 11]. Lastly, the same
    attempt was made in 1851 by researcher von Helmholtz [12]. In the year 1853 the
    Dutch ophthalmologist van Trigt [13] published the first image of the retina.
    In 1891 Gerloff, a doctor from Germany, showed very important photographs of the
    eye retina depicting the blood vessels [14].


    The fundus camera was developed by Gullstrand in 1910 and used in modern times
    to image the retina and for this he received the Nobel prize for his contribution
    [15]. The invention of fluorescein angiographic imaging was the next major development
    where the functional state of the retina was known by the help of a fundus camera
    with narrow filters [16]. Due to safety concerns this was replaced by tomographic
    imaging methods. In 1964 Allen described stereo fundus photography to represent
    3D shape of the retina, further there occurred the development of confocal scanning
    laser ophthalmoscopy where at different confocal depths multiple images of the
    retina are obtained. The development of the super luminescent diodes'
  merge: -1
  img_proc: true
- pgno: 265
  md: 'and femtosecond lasers make tomographic imaging of the retina possible and
    popular. In addition to this, 3D sectioning of the retina gives reality to retinal
    imaging [17] by the various newer methods.


    # 11.5 Current status of retinal analysis


    The last 160 years saw the progression of imaging of the retina, which is now
    the backbone of clinical care of the eye patient having various retinal and systemic
    diseases. These techniques are used successfully for the diagnosis of diseases
    and disorders of high blood sugar, high blood pressure, dementia, atherosclerosis
    and other related cardiovascular diseases, which are detected by fundus photography.
    The popularly chosen methods are optical coherence tomography (OCT) and fluorescein
    angiography. In addition to this, OCT is also used in viore-retinal surgery and
    its follow up.


    # 11.5.1 Fundus imaging


    In fundus imaging, there is a two-dimensional image projection of 3D retinal tissue.
    The intensity of the photo is directly proportional to the quantity of reflected
    light. The fundus imaging is cheap providing fine observation to the analyser.


    The various categories of fundus imaging are fundus photography method, colour
    fundus photography method, stereo fundus photography method, hyperspectral imaging
    technique, scanning laser ophthalmoscopy technique, adaptive optics SLO, fluorescein
    angiography and indocyanine angiography methods.


    +   (I) Fundus image analysis for the detection of diabetic retinopathy


    The principle behind the detection of diabetic retinopathy from fundus images
    is based on the micro diagnosis of micro aneurysms, blood leakage and micro blood
    clots observed on the fundus, which reflects the inner parts of the retina.


    +   (II) Image acquisition


    This is the first step in the direction of detection of diabetic retinopathy.
    The acquisition of fundus colour image and its analysis helps us to observe abnormalities
    of the retina. Actually, in the process of fundus imaging there is projection
    of 3D half transparent tissues of the retina on the imaging plane. A special fundus
    camera is use to take the high-resolution image. The various manufacturers of
    cameras are Topcon, Canon, Kowa etc. The camera can be categorised into two types:
    mydriatic camera involving dilation of the pupil, and the other category of non-mydriatic
    camera. There are many databases available having numerous fundus images such
    as DRIVE, STARE, MESSIDOR, DIARETDB1, ARIA and ROC.


    +   (III) Image pre-processing


    Due to many limitations, the image quality of the image get deteriorated because
    of many factors such as low focus, unwanted motion of the patient, non-uniformity
    of light and improper calibration. The unusual features can only be detected if
    the quality of fundus images is up to standard. It is therefore suggested to apply
    image pre-processing'
