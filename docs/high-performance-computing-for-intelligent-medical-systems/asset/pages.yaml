- pgno: 113
  md: 'model. Then we try to provide a solution for the restrictions and enhance the
    accuracy in the next step. Our models are based on two common and versatile neural
    networks: long short-term memories (LSTMs) and convolutional neural networks (CNNs).


    LSTM networks are a kind of recurrent neural network (RNN). Unlike feedforward
    neural networks, these types of networks have feedback connections that allow
    them to process not only current inputs but also previous ones. In other words,
    they have feedback routes to store current events in their memory states. In theory,
    classic RNN networks can learn arbitrary long dependencies in the input data.
    However, the propagating gradient can vanish or explode during the training procedure.
    LSTM networks solve this problem of vanishing gradient by allowing it to propagate
    unchanged [16–18].


    CNNs are inspired by the connectivity patterns among visual cortex neurons. Each
    cortical neuron is stimulated by a restricted region of the visual field recognized
    as the recepive field. The receptive fields, then, partially overlap, and they
    cover the whole visual field. Moreover, since these networks utilize convolution
    operations instead of matrix multiplication, they have many fewer parameters and
    connections. This reality facilitates the training process considerably. They
    are also more effective in automatically detecting important features in the input
    data compared with their predecessors [17–19].


    In this chapter, two-hundred records were selected from the MIMIC-II database
    to evaluate our models. After applying preprocessing procedures discussed in section
    4.3, each record was divided into three separate parts: the training, validation,
    and testing sections each claiming 70%, 10%, and 20% of the whole length of the
    records, respectively. Consequently, the training, validation, and testing sets
    include 35 965, 10 574, and 5354 cycles, respectively.


    # 4.4.1 LSTM model


    Long short-term memories are among the most effective methods for sequence modeling.
    The clever idea of embedding self-loops to allow the gradient flow for long distances
    is the key idea of LSTM networks. As the first model, we discuss an approach based
    on LSTM neural networks here.


    +   • **Proposed model based on LSTM networks**: figure 4.5 shows the proposed
    architecture to estimate systolic and diastolic BPs. It is a two-layer stacked
    LSTM network. The first LSTM layer encompasses 64 lSTM units, while the second
    LSTM layer includes 32 units. PPG segment series achieved during segmentation
    process of PPG signals are fed to the network. Each element in the input series
    is a vector of dimension 250.


    +   • **Performance**: The training and validation data sets were utilized to
    train the proposed deep LSTM network. Then, the testing set was fed to the network
    to investigate its performance. Table 4.1 shows the results in terms of the Pearson''s
    correlation coefficient (R), Mean Error (ME), Mean Absolute Error (MAE), Root
    Mean Square Error (RMSE), and the Standard Deviation of Error (STD).'
