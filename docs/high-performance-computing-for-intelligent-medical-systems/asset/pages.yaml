    # 3.4 Acoustic speech features with machine learning for voice pathology classification


    There are two subsections in this section. The first one addresses several important
    speech pathology features extraction procedures. Research works using handcrafted
    features and ML classifiers are discussed in the second subsection.


    # 3.4.1 Feature extraction techniques


    This is the most critical step in any ML process. This includes the conversion
    of a voice signal into acoustic features by digital signal processing techniques.


