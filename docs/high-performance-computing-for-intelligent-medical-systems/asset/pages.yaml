  img_proc: true
- pgno: 60
  md: '# 2.3.5 Support vector machine


    The SVM has various versions and it is a commonly used classifier in the literature.
    It is a conventional and parametric classifier. The widely used activation functions
    of the SVM are linear, quadratic, cubic, radial basis and Gaussian [42, 43].


    # 2.3.6 Linear discriminant analysis


    LDA is a linear dimension reduction and supervised machine learning technique,
    which seeks to find vectors in the space in which classes are best separated using
    class information of data objects. It is a nonparametric classifier. It is simple,
    fast and effective. Hence, many methods have been used [44].


    # 2.3.7 KNN


    KNN is a distance-based classifier. Variable distances are utilized in KNN such
    as Euclidean, city block, Minkowski, Spearman, Chi-square. It is one of the simplest
    classification methods. However, it is a lazy classifier because it is not efficient
    for big data. It is suitable for small datasets. However, KNN proves success of
    the methods for large datasets using a small dataset [45].


    # 2.3.8 Artificial neural network


    Artificial neural network (ANN) is inspired by bio-neurological systems and it
    is utilized as a classifier and regressor in the literature. ANN is one of the
    phenomena of machine learning and it has many variations. It uses input, weights
    and actual output for prediction. Basic mathematical notation of it was shown
    in equation (2.1) [46].


    ```

    Y = \varphi(X_* w^T + \text{bias}) (2.1)

    ```


    where \varphi(.) is activation function, X defines input vector, w is weights,
    Y is output.


    # 2.4 Spider network


    The key objective of the developed model is to obtain a cognitive model for basic
    hand movement recognition. We want to extract low, middle, and high level features
    using a cognitive method. As we know from the literature, DCT and FFT are effective
    methods for signal processing. Hence, these are used in a preprocessing step to
    obtain frequency coefficients of the sEMG signals. Also, TP and SVD are effective
    feature extraction methods and are used as such. After these processes, large
    feature sets are obtained. To select distinctive of them, an NCA-based feature
    reduction method is utilized. The proposed SN uses several classifiers for comparison
    purposes. These classifiers are chosen to validate the feature extraction power
    of the proposed SN because these are conventional classifiers. The key objectives
    of the proposed SN are given below.


    +   - Obtain high classification accuracy.

    +   - Propose a lightweight signal recognition network'
