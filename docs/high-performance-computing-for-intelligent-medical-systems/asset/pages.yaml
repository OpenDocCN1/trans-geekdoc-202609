    # 13.2.4 Arthritis


    Joint pain is one of the most prevalent problems nowadays. In this there occurs
    swelling and stiffness in the joints. Osteoarthritis and rheumatoid arthritis
    are the most common types today. In osteoarthritis, there is breakdown of the
    tissue, while in rheumatoid arthritis, problem starts with the lining of joints.
    Arthritis is mostly seen in women and older people. Primary symptoms are problems
    in the motion of joints which can later lead to inability to do daily life activities.
    The worse case may be permanent joint changes [57].


    +   Types of arthritis:

    +   (i) Inflammatory arthritis: In this type the immune system attacks joints
    causing their decay. It may also lead to injury in internal organs. Rheumatoid
    arthritis is an example of inflammatory arthritis.

    +   (ii) Degenerative arthritis: Excessive weight or hereditary traits may cause
    this type of arthritis. In this, the cushioning soft surface of the bone (cartilage)
    tears away, joints lose strength and may cause severe pain. Osteoarthritis is
    its example. Smoking, less frequent physical activity and some genetic factors
    are some of the possible reasons of osteoarthritis.

    +   (iii) Metabolic arthritis: If the uric acid level in the body is not properly
    maintained by our glands, its excess causes the formation of some crystalline
    structure in the joints which causes pain. This arthritis may cause permanent
    disability in some part of the body.


    Treatment: regular physical exercises, medicines, balancing of body mass index,
    the last option is surgery [58].


    Arthritis controlling techniques: Proper care and control can avoid the symptoms
    of arthritis. Involvement of education and self-management by the patient can
    recover adherence and improve the efficiency of early treatment. The possibilities
    of involvement of new symptoms can be reduced by the combination of pharmacologic
    and rehabilitation management. Professional psychotherapy is a health environment
    that aims to enhance the daily routine activities by the patient. Multi-disciplinary
    follow up is essential for accurate management of the illness on different characteristics
    of life [59]. By the use of intelligent controlling techniques, the problem of
    arthritis may be controlled at some particular level. The problem of transferring
    secure and sufficient anesthesia during surgery can also be solved by using a
    strongly tuned PID controller [60].'
