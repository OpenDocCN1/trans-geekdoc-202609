    with complications.


    # 8.9.12 Chessboard search pattern strategy


    In a video sequence, MB with temporal and spatial correlations is shown in figure
    8.14. A variety of BMAs is suggested by several people who use the knowledge about
    the movements of nearby objects to adapt their search strategies. Based on his
    technological breakthrough Amirpour et al [66] have proposed the Chessboard Search
    Pattern strategy (CSP) method. Similar to the chessboard pattern, MBs in a frame
    are categorized in two sets of black MB set and white MBs shown in figure 8.15,
    and a different search strategy is employed for each search type. Because of this
    approach, the number of collocated neighboring blocks will increase for each current
    MB and it guides us to an improved prediction of MV for each MB.


    A few BMAs like ARPS, CSA, etc consider only four contiguous MBs for defining
    a category in their design. They neglected to use spatial knowledge about eight
    spatially neighboring individuals MBs. Also, since CSP calculates LUC information
    of eight neighboring MBs, it produces better performance. The CSP works as follows:


    +   * Some random MVs are allotted initially to all black MBs while searching
    for best-matched MBs in the search space. Three spatially located MBs: top left,
    top right, temporal, and MB with (0,0) are taken as starting SP while finding


