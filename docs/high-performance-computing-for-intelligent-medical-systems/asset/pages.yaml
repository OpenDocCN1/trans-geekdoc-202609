  md: '# High Performance Computing for Intelligent Medical Systems


    # Varun Bajaj and Irshad Ahmad Ansari


    # Chapter 3


    # Analysis of IoT interventions to solve voice pathologies challenges


    # Wahengbam Kanan Kumar, Mithlesh Prasad Singh, Aheibam Dinamani Singh, Rajesh
    Kumar and Kishorjit Nongmeikapam


    Speech is the simplest mode of expression, and any alteration of the vocal cord
    disrupts its smooth flow. Speech disorders increase vocal exhaustion, pressure,
    dysphonia, roughness, glottal attack, sore throat, etc. Disruption of a smooth
    voice in most situations leads to a wide range of psychiatric disorders resulting
    from stigmatization from peers and the community. It can have detrimental effects
    in the search for jobs, as well as on social and academic terms. Speech disability
    also results from brain damage, hearing loss, stroke, and developmental delay.
    A variety of aspects of voice pathology research are the subject of the present
    chapter. Applications for the Internet of Things (IoT) and related research work
    are analyzed in depth. Detailed background information on electroglottography
    is highlighted, which includes its development, production of vocal folded tone,
    glottal closure and instant opening, quantitative analysis in terms of frequency
    and amplitude. Information on some of the most common datasets among researchers
    are also highlighted. Finally, two separate parts dealing with several important
    acoustic feature extraction techniques, along with significant pathological voice
    analysis and identification techniques, are also discussed in great detail.


    # 3.1 Introduction


    The most important way to exchange ideas and feelings between two people is by
    speaking. It is also the simplest and most concise way to convey one’s viewpoint,
    considering that it contains a variety of non-verbal opinions. Creating a voice
    from one’s body is nevertheless a complicated process. Some major organs and tissues
    play an important role in the three-stage voice production process. They are—(a)
    generating air volume pressure, (b) supplying vibration, and (c) resonance. Collectively,
    the rib cage, diaphragms, lungs, and muscles in the abdominal region'
  merge: -1
  img_proc: true
- pgno: 76
  md: 'create an articulate air volume pressure that generates a ‘pitch’ by continuous
    oscillation of the vocal folds. It is the characteristics and structures of the
    vocal tract and the vocal folds that produce sounds that are unique to all. The
    ‘pitch’ that is derived from the vocal fold lingers in the nasal cavities, and
    the throat that has a distinct acoustic structure is another source of individuality
    for any voice. There are three distinct layers in the laryngeal vocal fold, that
    is, the vocal ligament, the mucosa, and the vocal fold. Since these tissues are
    tender, they can be continuously affected by air pressure and release the mucosal
    waveform. The ability of the mucosa to produce pitch rates determines whether
    the voice is regular or abnormal.


    For speech specialists such as phoniatricians, a voice has several characteristics
    of an individual, such as mental well-being, physical trauma, vocal pathologies
    in the vocal fold, the person’s gender, emotional state, etc. A deviation from
    the normal vocal attributes of a person as opposed to those who share the age
    group and gender can be defined as a problem of laryngitis or other vocal fold
    disease. Vocal fold disease is caused by gradual alteration in the voice synthesizing
    organs and tissues in the body. These changes may be due to over-manipulation
    of the vocal cords, frequent intake of medications, or neurological disorders.
    Abuse of vocal cord can lead to conditions such as unilateral nerve paralysis,
    laryngeal cancer, polyp, nodule, and folding for a prolonged period of time. These
    situations can be defined by the hoarseness of one’s voice. In addition to self-abuse,
    an unhealthy lifestyle may contribute to an increase in vocal disorders [1, 2].
    Singers, mothers of children and educators are people who unknowingly abuse their
    vocal cords. The reasoning is that they have to say words constantly during the
    work plan. Such excessive use of the voice fold leads to more rigidity over time.
    The vagus nerve, which is responsible for the proper functioning of the larynx,
    is also highly likely to be dysfunctional. This condition is known as unilateral
    nerve paralysis, which is usually noticed from the speaker’s breathing phonation
    sound. Other issues are also reported, such as air deprivation, trouble swallowing
    and mild coughing [3]. Irregularity occurs in the vocal box or larynx due to repetitive
    abuse due to the nature of the work that can contribute to breathing and harsh
    vocals. Physical features, including elasticity, shape and volume, associated
    with vocal folds, are modified when disorders, including gastric reflection or
    anterior-to-posterior (A–P) squeezing, begin. This leads to an unusual variant
    of vibration. Swelling of the vocal folds are caused by gastric reflux and laryngitis.
    While muscle tension damage is caused by constant A–P squeezing.


    # 3.1.1 Pathology assessment


    The invasive technique used to diagnose pathologies in human laryngeal arrangement
    is an age-old and modern procedure that is still popular throughout the world.
    Examples of the two endoscopic procedures required to insert large instruments
    into the human body in order to map the internal structure include laryngostroboscopy
    and operational microlaryngoscopy. Intrinsic anxiety and pain are caused to the
    patient under surveillance. In the past, scientists have also developed non-invasive
    approaches to minimize pain to a certain degree. In one such scenario, electroglottography
    (EGG) is done where a person’s voice is analyzed. Patients have been'
