    As the past frame is used to predict the future of a frame by finding out MV,
    we can term it as backwards ME. Conversely, when an upcoming frame is utilized
    to forecast the past position of the current MB in the target frame, it is designated
    as a backward prediction (BP) and is shown in figure 8.4 and as we go ahead in
    time to predict the past, this is referred to as forward ME.


    # 8.4.2 Block matching concept


    The concept behind the BM is to partition the images into a non-overlapping block
    called macro-blocks (MBs) of pixels assuming that all pixels within the MB undergo
    the same amount of displacement and to perform ME efficiently by finding out MV,
    that is, coordinate difference between the anchor MB and the most similar MB in
    the target frame based on certain matching meanings. The goal of all BMAs is to
    evaluate the matching meanings within a predefined search range (denoted by ‘p’)
    to determine the most correlated MB in the target frame, and the efficiency, speed,
    and accuracy of BMAs are vital for faster and accurate video compression. The
    efficiency'
