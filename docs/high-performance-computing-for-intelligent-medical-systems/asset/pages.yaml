    # 10.3.1 Butterworth filtering


    Butterworth filter of order n and cutoff frequency D0 is defined as [37].


    \( H(u, v) = \left[ \frac{1}{1 + [D(u, v)/D_0]^{2n}} \right] \)


    It gives smooth transition from low frequency region to high frequency region.
    By increasing the order of the filter, we can control the sharpening of an image.
    The outputs corresponding to different cutoff frequency are illustrated in figure
    10.6.


    # 10.3.2 Gaussian low-pass filter


    The Gaussian low-pass filter (GLPF) can be defined as below.


    \( H(u, v) = e^{-D^2(u, v)/2\sigma^2} \)


    where, D(u, v) is the distance from the center of the frequency rectangle. Figure
    10.7 shows the result of applying a Gaussian low-pass filter on a noisy mammogram
    image. The output result of the GLPF is less smooth than the Butterworth filter.


    # 10.3.3 Homomorphic filtering


    It involves transforming multiplicative noise into additive noise and then applying
    a linear operation. Although, due to poor illumination, some regions of the image
    might appear brighter or some other regions might appear dark, a homomorphic filter
    can correct this nonuniform illumination in the image. For a linear filter to
    be applied to images corrupted by speckle noise, the speckle noise needs to be
    transformed to additive noise using a logarithmic transformation before the convolution
    operation is applied [38]. Homomorphic filtering techniques use illumination and
    reflectance model to enhance or restore the degraded image.


    Let image f(x, y) be defined as


    \( f(x, y) = i(x, y) \times r(x, y) \)'
