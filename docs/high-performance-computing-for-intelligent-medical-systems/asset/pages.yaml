    The Gaussian regression model calculates the probability distribution of parameters
    or overall admissible functions that fit the data.


    ```

    f(x) = a + e^{\left(-0.5 \times \left(\frac{x - \mu}{\sigma**2}\right)\right)}

    ```


    In statistics, the coefficients of determination are denoted R2, the main objective
    of R2 analysis of future outcomes on the basis of relevance feature or testing
    of the variance by standard ranges from 0 to 1. R2 shows how well data points
    used fit the curve or line. If we use more unnecessary or useless variables then
    it will decrease. By adjusting R2 data points will be added to increase efficiency.


    ```

    (Adj)R2 = 1 - \left[\frac{(1 - R2)(n - 1)}{n - k - 1}\right]

    ```'
