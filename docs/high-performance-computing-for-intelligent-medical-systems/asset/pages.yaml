    # 12.3 Brain tumour segmentation


    Cell differentiation and irregular development in the brain tissue are brain tumours.
    Brain tumours can be classified according to their origin, as either primary or
    metastatic brain tumours. The primary cell’s origin is cells with brain tissues,
    whereas metastatic cancer cells spread to the brain or some other part of the
    body. Gliomas are a form of glial cell brain tumour. It is the dominant brain
    tumour type and many of the research areas concentrate on the segmentation of
    brain tumours.'
