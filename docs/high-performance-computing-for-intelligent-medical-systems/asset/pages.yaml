- pgno: 220
  md: '# Chapter 9


    # A comparison of Parkinson''s disease prediction using ensemble data mining techniques
    with features selection methods


    Dhyan Chandra Yadav and Saurabh Pal


    Nerve cells or neurons are very important parts of the human body. The brain manages
    the control system and blood circulation by nerve cells. So it is necessary to
    know about symptoms of initial stage neuron disturbance in the body system. The
    ‘main objective of this chapter is to protect the human body by initial knowledge
    about Parkinson’s disease. We used machine learning algorithms and analyzed Parkinson’s
    symptoms.


    Machine learning algorithms provide help in prediction of attributes and give
    maximum accurate results. In this paper, we used Naïve Bayes, Decision Tree, Extra
    Tree, Random Forest and Bagging ensemble method for better prediction compared
    with all other performed work in this field or in the medical field. All the selective
    algorithms are tree based algorithms and they have different and important properties
    for better prediction on a large dataset. We use Bagging ensemble method with
    all selective algorithms and provide a unique result of prediction.


    After all experiments, we find a better result with Bagging algorithms compared
    to all other selective algorithms, Naïve Bayes, Decision Tree, Extra Tree and
    Random Forest. Bagging algorithms evaluated with Kappa (0.958), Overall Fraction
    Correct (0.98), Mis-classification Rate (0.02), Sensitivity (0.979) and Specificity
    (0.983).


    # 9.1 Introduction


    Parkinson’s disease is a very dangerous disease in the human body in which nerve
    cells become dead in a particular area. The nerve system runs by dopamine chemical
    in the human brain so dead neurons do not produce dopamine. Parkinson’s disease
    is not observed at random in any human body because it is directly related with
    dopamine. Dopamine does not finish suddenly in the body.'
  merge: -1
  img_proc: true
- pgno: 221
  md: 'If dopamine production is less in the body then it indicates some symptoms
    in the human body such as:


    +   - minor tremors felt in hands, legs and head;

    +   - minor stiffness felt in limbs and trunk;

    +   - minor slowness seen in movement;

    +   - seen impaired balance and coordination;

    +   - seen depression and difficulty in speaking;

    +   - seen disruptions in sleeping.


    It is critical to correctly diagnose and declare Parkinson’s disease. If dopamine
    production stops in the body then Parkinson’s disease will be at a high level.


    # 9.2 Related work


    Some researchers have done work on Parkinson’s disease by different features selection
    techniques: GA. PSO, correlation based, filtered based etc [1–5].


    Nemmi et al, discussed two Parkinsonian syndromes identified by MRI protocol and
    used pipeline combined with several feature selection and finally found best accuracy
    (94%). The pipeline evaluated more relative important features of Parkinson’s
    disease with a different model set. The pipeline performed a good balance between
    classification accuracy and relative important features [1].


    Tejeswinee et al, discussed a neuro-degenerative data set by data mining technique.
    They found a correlation based feature subset selection method gave the highest
    accuracy (94%) by support vector machine (SVM) and used different classifiers
    on 111 instances of a Parkinson’s dataset in which they found 74 genes unique
    and 37 different genes different [2].


    Behroozi et al, discussed Parkinson’s disease. They used multiple classifier frameworks
    KNN, SVM Linear Kernal, SVM (RBF), Naïve Bayes and Discriminants Analysis for
    speech dataset. They used filter based feature selection and found accuracy K-nearest
    neighbor (K-NN) (K = 7) (77%), SVM Linear Kernal (85%), radial based functional
    (RBF) (87%), Naïve Bayes (80%) and Discriminants Analysis (82%)[3].


    Tubishat M et al, analyzed algorithms for features selection. They used ‘Salp
    Swarm Algorithm, Classification, Feature selection Optimization, Machine Learning
    Algorithm’ and ‘Opposition Based Learning’ on 18 different datasets. They finally
    selected the optimal subset in wrapper mode and solved the feature selection problem
    [4].


    Xiao B et al, predicted hybrid features of Parkinson’s disease which was based
    on QSM, SN and CNN. They observed a dataset from MRI image biomarkers and evaluated
    area under curve (AUC), sensitivity, specificity and accuracy by NF, convolutional
    neural networks (CNN) and SVM. SVM evaluated highest accuracy (96%) after features
    selection [5].


    Some authors have predicted on the basis of machine learning algorithmssuch as:
    SVM, Naïve Bayes, Random Forest’ etc [6–10].'
  merge: -1
  img_proc: true
- pgno: 222
  md: 'Cavallo et al, analyzed a feature array as the most significant to discriminate
    among the different classes and different groups of classification. They compared
    SVM, Random Forest and Naïve Bayes by various datasets. Finally, they achieved
    highest accuracy of SVM (97%) [6].


    Berus et al, analyzed 26 different voice samples of Parkinson''s patients. They
    used ''multiple feed-forward artificial neural networks (ANNs) in the prediction
    of Parkinson''s disease of tested individuals. Finally, they found highest accuracy
    (86%) of neural network [7].


    Drotar and Zdenek, discussed identification of diseases or differential diagnosis
    of various types of disorders. They used machine learning algorithms SVM, RF,
    AdaBoost, Deep Belief Networks, K-NN, Naïve Bayes, LDA and Perceptron. They found
    better framework for classification and calculated accuracy. Finally, they found
    classification accuracy of SVM (94%), RF (97%), Ada Boost (93%), Deep Belief Networks
    (76%), K-NN (96%), Naïve Bayes (96%), LDA (91%) and Perceptron (98%) [8].


    Sharma et al, predicted Parkinson''s disease for identification of symptoms. They
    presented the Modified Grey Wolf Optimization algorithm for symptom identification
    of premature stages of Parkinson''s disease. They used datasets of voice, handwriting
    and speech. They used RF, KNN and Decision Tree for better prediction and by measured
    (94%) accuracy by forward algorithm [9].


    Bellino et al discussed the relationship between gait parameters and falls incidence.
    They predicted the risk among older adults of approximately 105 adults older than
    65. The entire functional and fundamental assessment fall event was recorded in
    diaries. J48 algorithm was applied for fall in future prediction with (84%) accuracy
    [10].


    Some authors used ensemble methods for better prediction. They added various algorithms
    in Bagging, Stacking, Boosting etc ensemble methods [11, 12].


    Yadav and Pal discussed thyroid patients and their predictions. They used a thyroid
    symptoms based dataset and generated an ensemble technique for prediction. They
    generated techniques (Stacking) and (Bagging + Boosting) applied, and after evaluation
    they found (97%) ROC of stacking [11].


    Yadav and Pal analyzed hormones disorders in thyroid disease. They used J48, Hoeffding
    and RF for better prediction. Selected machine learning algorithms trained input
    samples in various forms then found better classification accuracy of the ensemble
    method [12].


    # ## 9.3 Methodology


    The proposed methodology is divided into three main parts:


    +   1. Predict Parkinson''s disease using different machine learning classifiers
    and analyze the obtained result.

    +   2. Select important features from the dataset with high methods Chi square,
    Extra Tree and Heatmap prepared dataset with high importance.

    +   3. Apply once again selected machine learning classifiers on the prepared
    dataset (after feature selection) comparing the results from previous predictions.'
  merge: -1
  img_proc: true
