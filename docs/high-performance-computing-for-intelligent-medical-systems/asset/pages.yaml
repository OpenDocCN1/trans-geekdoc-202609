    423 controls versus 656 patients) from nine other hospitals. For the internal
    dataset, 5-fold cross-validation was used. It achieved an AUC average of 98% and
    97% on individual-level and slice-level, respectively. The external dataset was
    only for individual-level, and the AUC of 97% was reported (figure 5.4). They
