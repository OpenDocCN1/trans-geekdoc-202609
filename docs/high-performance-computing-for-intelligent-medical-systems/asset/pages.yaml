- pgno: 112
  md: '![](img/75406d5bb714dfd3e68fbbc717bd8f67_112_0.png)


    Figure 4.4. A sample for each waveform and the crucial points extracted from each
    waveform. A PPG segment is also shown at the bottom. Each PPG signal turns to
    a series of PPG segments.


    +   - We apply two cascaded filters to remove various artifacts like baseline
    wandering in low frequencies and power-line harmonics and electromyogram noises
    in high frequencies. The first filter is a low-pass 7-point second-order Savitzky–Golay
    filter. It smoothes the waveform without disturbing the signal tendency [12].
    The second filter is a high-pass Kaiser window FIR filter of order 40 [13]. The
    overall frequency band of interest is 0.13–40 Hz [5, 14].

    +   - We consider R-peak waves as time-references for the segmentation procedure.
    We implemented the algorithm presented in [15] to detect the R-peak waves. It
    is based on the remarkable similarities between the ECG waveform structure and
    the integrated linear prediction residuals in audio signals.

    +   - If we define the time occurrence of R-peaks as {t1, t2, ..., tn}, the kth
    segment includes two heart cycles from t_{k-1} to t_{k+1} time-interval. Hence,
    two successive segments share a PPG cycle.

    +   - Then, the length of each segment (each element of the input vector, X) is
    adjusted to 250 samples by zero-padding (when its length is smaller than 250),
    or by discarding some samples (when the length exceeds the length limit). Moreover,
    the length of each element of the target vector T is two (including invasive systolic
    and diastolic BP values).


    Figure 4.4 shows a sample for each waveform and the crucial points extracted from
    each waveform. It also depicts a PPG segment at the bottom. Each PPG signal turns
    to a series of PPG segments after applying these preprocessing steps.


    # 4.4 Deep learning models for blood pressure monitoring


    In this section, we propose and implement four different DNNs to estimate BP.
