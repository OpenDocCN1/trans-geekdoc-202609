    # 8.9.10 ‘Deterministically starting-GA’ (GA_Det)


    More et al [64] postulated a BMA called ‘Deterministically Starting-GA’ (GA_det)
    based on the property of adaptive convergence and early deterministic population
    of GA. This BMA is fruitful for x265 standard type video codec and it adopts the
    concept of survival of the fittest. The reduction of search points for the best
    matching MB is the motto of this BMA. Predicted and bi-directional frames are
    taken to have three reference frames. The early population that is created is
    taken to be at different spatio-temporal positions in the frames and at pre-specified
    HEX locations and all are a function of pre-encoded coding units. The newly designed
    BMA is beneficial for deployment of x256 video codec standard structure. In x265
    CODEC’s framework, GA_Det reduces the search point at selected classes of videos
    which are used for experiment (figure 8.13).'
