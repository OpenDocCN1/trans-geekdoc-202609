    # 7.8 A model for instant patient feedback


    # 7.8.1 General principles


    When the patient evaluates the level of professionalism, the doctor’s competence
    in diagnostics, it is most manageable for the client to assess this area with
    a ready-made format. When dealing with attributes of empathy (e.g., listening
    to patients properly) both open and structured feedback formats may function well.
    It is essential that the patient’s experience and vision are presented in a specified
    way; the doctor responsible for the diagnostic process can understand the areas
    for which clients have open questions or remarks. If the patient is encouraged
    to provide feedback on the diagnostic process’s correctness as part of standard
    practice, giving feedback on the diagnostic process will be more comfortable.
    Accordingly, the patient feels that he or she is not only providing feedback on
    the specific aspect of the care process but is also a full participant in assessing
    the quality of his or her care. With a detailed but reasonably simple questionnaire,
    patients can give summary feedback on the diagnosis they have received. It is
    essential that the patient accurately identifies those aspects they believed were
    deficient in the diagnostic process. The proposed model gives the doctor a better
    idea of the patient’s experience than is typically possible during a limited consultancy
    session. This information helps the doctor improve their working methods and self-evaluation.


