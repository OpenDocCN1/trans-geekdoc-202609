    from the predicted video, and then the residual signal is encoded using DCT which
    is followed by quantizer and entropy coding. The encoder encodes the bit-stream
    of the residual signal but not the original signal itself. The decoder part of
    the codec regenerates the error frame which has some difference from the original
    one due to quantization that was done at the encoder side. Taking the earlier
    or upcoming frame as a reference, the motion estimator block of the encoder predicts
    the next frame or past frame and calculates the coordinate displacement vector
    also called a motion vector (MV) using a practice called motion estitmation (ME).
    The received signal is entropy decoded, de-quantized and inverse transform domain
    coding, that is, inverse DCT (IDCT) is used at the decoder terminal. Then the
    predicted video is added to the error to get the input video which is not the
    replica of the input video/ frames because, at the input end, the lossy compression
    is used.


    # 8.3.6 Types of coding and frames


    When the videos are taken and stored for processing, the frames must be encoded
    using some reference frames, either past or future frames. But as we know when
    we capture the first frame, there is no past frame nor future frame to refer to.
    In such cases, such images/frames are treated as still images and only spatial
    redundancy will exist which will be directly encoded by a process called Intra-frame
    coding and the frame is called I-frame. Temporal redundancies will not exist in
    such cases. Here the information is high and the bit requirement will be high.
    There is another way to encode a frame that uses the previous or coming frame
    as a reference called the predictive frame (P-frame), and the process is called
    inter-frame coding or predictive coding. The frames for which both the past frames
    and the future frames are used as a reference for coding them are known as B-frame
    and the process is called Bi-Directional prediction, which is also a part of inter-frame
    prediction. These types of frames are depicted in figure 8.2.'
