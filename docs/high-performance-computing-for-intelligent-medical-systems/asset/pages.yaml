    # **B. Conditional random field (CRF):**


    The voxel class is predicted by the classifier based on the characteristics associated
    with that voxel, and does not depend on the voxel''s adjacent interaction with
    other nearby voxels. In order to enforce the dependencies between the predictions,
    CRF takes this correlation into account and constructs a graphical model.


    # **12.3.7 Traditional machine learning in tumor segmentation**


    In a technique proposed in [99], the researchers applied morphological erosion
    and dilation operators with global thresholding on a binary tumour masking for
    segmenting tumour afflicted regions. An overall accuracy of 97% was achieved on
    a test image dataset which had about 100 MRI images derived from different individuals.
    In another research work [100], the SRC technique has used K-SVD dictionary-based
    learning for segmenting MRI brain images. The segmentation result was further
    refined by applying Active Contours Without Edges (ACWE). The data collection
    consisted of 80 T2 brainMRI images, 50 and 30 of which, respectively, were used
    for training and validation. Researchers of [101] proposed an MRI image brain
    tumour segmentation technique by using multiple fractal dimension, intensity,
    and texton features with AdaBoost classifier. Some improved versions of Fuzzy
    C-Means (FCM) algorithms named as Particle Swarm Optimization with FCM (PSOFCM)
    [102], Genetically Improved Fuzzy Markovian Relational Clustering Matrix (GIFMRCM)
    [103], Fast and Automatically Adjustable GRBF Kernel FCM (FAAGKFCM) [104], and
    Enhanced Possibilistic FCM (EPFCM) [105], have been used for segmenting MRI brain
    images. A Computer Aided Design (CAD) based segmentation technique that used pre-processing,
    segmentation or Region of Interest (ROI) development, feature extraction, and
    machine learning phases has been described in [106]. In this work, histogram equalization
    was the pre-processing method, which was followed by morphological dilation and
    erosion segmentation. They investigated using a wide variety of machine learning
    techniques like Particle Swarm Optimization (PSO), Support Vector Machines (SVMs),
    Artificial Neural Network (ANN), and K-Nearest Neighbour (KNN). An accuracy of
    100% was achieved while using kNN and PSO techniques. Local independent projection-based
    classification (LIPC) has been used together with connected component analysis
    and morphological operator for segmenting MRI images [107]. In another different
    approach for segmenting brain tumour, Jiang et al [108] proposed and demonstrated
    the usage of a learning process that used a graph constructed from population
    and patient-centric Gabor and image modality feature descriptors. A 3D PCNN was
    used with morphological erosion and dilation operators for segmenting brain images
    of rodents. A spherical shaped mask was used for providing a smooth function [109].
    A technique that is based on Markov Random Field (MRF) for segmenting MRI images
    that has multiple sclerosis (MS) lesions has been proposed in [110]. The MRF parameters
    were evaluated from the manually annotated images, and contextual'
