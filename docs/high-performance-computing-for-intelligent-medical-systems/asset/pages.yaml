  md: 'achieved by increasing the contrast ratio of the image. Another way for image
    enhancement is local histogram modification like histogram equalization, contrast
    stretching, and local histogram processing in an image’s local area [32, 33].
    This local enhancement method distorts the image quality to some extent because
    these transformations are not monotonic mapping. Dong et al [34] propose a non-local
    concentrated sparse representation (NCSR) denoising method by combining sparse
    coding coefficient (SCC) and sparsity. NCSR constructs an overcomplete dictionary
    by learning the prior blocks and using non-local redundancy sparseness of the
    image to reduce the noise. Another stacked sparse denoising auto-encoder (SSDA)
    model is proposed by Xie et al [35] based on sparse coding with neural networks
    that require manual parameter adjustment during the training phase. Another approach
    for image denoising is image transformation. A Gaussian scale mixture (GSM) model
    can be very useful for finding an effective description of local image statistics
    [36]. Markov random fields (MRFs) can also be used to capture statistical regularities
    of pixel intensities.


    This chapter aims to discuss the various image enhancement and noise-reducing
    methods for the analysis of mammogram images for better diagnosis of breast microcalcification.
    In the following section we discuss the various spatial domain method for image
    enhancement like histogram modeling, histogram equalization, histogram matching,
    average filtering, Gaussian filter, median filter, etc and frequency domain methods
    such as Butterworth, Gaussian low pass filtering, Homomorphic filtering, wavelet
    transform, and finally convolutional neural network. We have shown an improvement
    in the image quality after applying these methods for the analysis of the image
    corrupted by speckle, Gaussian, and impulse noise. Finally, the conclusion summarizes
    the chapter.


    # ## 10.2 Image enhancement in spatial domain


    Several spatial domain techniques manipulate the pixel values of an image for
    better representation. The following section deals with some methods for image
    enhancement.


    # ## 10.2.1 Histogram modeling


    A histogram of an image is a plot between the numbers of occurrence of a gray
    level to the number of gray level values. If [0, L-1] is the gray level of an
    image then the histogram can be defined as h(ri) = ni where ri is the ith intensity
    value and ni is the number of pixel of intensity ri. The histogram provides more
    insight into image contrast and brightness [37, 38]. A normalized histogram of
    an image is defined as


    $$P(r_i) = \frac{n_i}{\text{Total number of Pixels}}$$ (10.1)


    Contrast enhancement methods based on histogram modeling are very simple in comparison
    to the frequency-domain methods. It gives a high contrast image with a wide dynamic
    range of the intensity scale. This method can also be used to increase the brightness
    of an image by changing the histogram of an image.'
  merge: -1
  img_proc: true
- pgno: 240
  md: '# 10.2.2 Histogram equalization


    Histogram equalization (HE) improves the contrast of an image by stretching out
    the gray level range of the image, as shown in figure 10.1. This technique increases
    the global contrast of an image by stretching out the intensity range of the image,
    but it is not always true there may be some cases when it decreases the contrast
    [37, 38].


    # 10.2.3 Histogram matching


    Histogram matching is another histogram-based contrast enhancement method; it
    specifies the shape of the histogram by mapping gray levels of the original image
    into a desirable level. This method is used to generate a processed image that
    has a predetermined histogram [37]. Figure 10.2 shows that the brightness of the
    output image is very high and may cause information loss.


    # 10.2.4 Averaging filter


    It replaces each pixel in an image with the average value of all its neighbors.
    Mean filtering is like a convolution filter based around a kernel. This kernel
    controls the shape and size of the neighborhood that represents the amount of
    filtering [37, 38]. Results of average filtering for contrast enhancement of a
    mammogram image are given in figure 10.3. An increase in Mask size causes blurring
    to the original image.


    ![](img/75406d5bb714dfd3e68fbbc717bd8f67_240_0.png)


    **Figure 10.1.** Contrast enhancement by using HE:(a) A DDSM database Mammographic
    Image, (b) image after HE, (c) histogram of image, (d) histogram of HE image.'
