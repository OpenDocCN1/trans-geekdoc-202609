    # ## 5.2.6 Critical issues


    Not following the critical STARD, TRIPOD, or medical data mining checklist prevents
    the COVID-19 diagnosis and prognosis methods’ clinical application. Moreover,
    there are at least two other critical issues to consider.


    Balancing the dataset has been used in the literature to improve the performance
    of the classifiers. The imbalanced datasets are very hard to deal with. For example,
    Ardakani et al [22] reported a comprehensive list of the performance indices and
    the hold-out validation framework (80% training, 20% test) for COVID-19 diagnosis
    based on the CT-image deep learning. 86 non-COVID-19 and 34 COVID-19 and patients
    participated in the study, and finally, 510 non-COVID-19 and 510 COVID-19 CT image
    patches were analyzed. In addition to the hold-out validation framework that is
    susceptible to testing hypotheses suggested by the data, the dataset was balanced.
    The disease’s prevalence was not similar to the population, resulting in decreased
    precision, a.k.a., Positive Predictive Value (PPV), in practice. This issue can
    be described using the Bayes’ Formula:


    ![](img/75406d5bb714dfd3e68fbbc717bd8f67_144_0.png)


    where Se and Sp are the sensitivity and specificity of the designed system and
    P is the prevalence of the disease in the population. In the study of Ardakani
    et al [22], the best method was ResNet-101 with the Se and Sp of 100% and 99.02%,
    which are very high. If the COVID-19 prevalence is considered 10%, PPV will be
    92%. The parameter PPV is the probability that a subject has COVID-19, knowing
    the diagnosis method’s result is positive. Such high Se and Sp values are not
    usually seen in the literature. Usually, Se and Sp of 80% and 95% are considered
    appropriate. In a similar prevalence condition, PPV will be only 64%. As a result,
    when the dataset is balanced, the system’s performance must be very high in terms
    of Se and Sp. Otherwise, the system does not work as expected in practice. Such
    a balancing procedure was also used in other studies, such as [53].


    The other issue is the quality of the peer-review procedure. Due to many submissions
    to the journals in the pandemic, the peer-review quality reduced,'
