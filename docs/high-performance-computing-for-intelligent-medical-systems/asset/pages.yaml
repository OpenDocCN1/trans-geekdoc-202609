  md: '![](img/75406d5bb714dfd3e68fbbc717bd8f67_145_0.png)


    Figure 5.9. The results of deep learning models with 10-fold cross-validation
    (reproduced from [62], copyright 2020, with permission from Elsevier).


    resulting in the retraction of approximately 45 papers when the published papers
    were re-analyzed by the editors [61]. Although most of the papers were medical
    papers, it is expected that such a retraction is extended to other multidisciplinary
    studies such as COVID-19 medical data mining. We provided an example for the explanation.
    Different deep learning algorithms were compared by Alakus and Turkoglu [62] for
    COVID-19 diagnosis. 80 COVID and 520 non-COVID patients were examined, and the
    laboratory data were recorded. Using 10-fold cross-validation, the average AUC,
    F1-score, accuracy, precision, and sensitivity were reported as 0.625, 91.89%,
    86.66%, 86.75%, 99.42% (figure 5.9).


    First, CI 95% was not reported for any performance index. It is critical for indices
    such as AUC (0.625 in this study). If the CI 95% includes 0.5, the user does not
    benefit from the diagnosis methods more than a random generator in practice. Moreover,
    it is necessary to report MEAN and SD of the performance indices over test folds
    to identify each fold’s reliability. The SD values were not provided.


    Moreover, the specificity of the proposed method was not provided by the authors.
    However, using the parameters AUC and sensitivity, the specificity of the method
    is approximately 26%. It is directly related to the type I error and must be reported
    in the paper. There is also a contradiction in one of the paper figures (figure
    5.10), where the AUC of the LSTM was mentioned as 0.83. However, the ROC tells
    a different story. Such a number was used in other calculations, resulting in
    some inconsistencies in the paper. Moreover, it is not clear how the accuracy
    of the method is high (86.66%), knowing that most of the subjects were healthy
    and the specificity of the system was very low (26%). Such issues must have been
    identified and corrected during the peer-review procedure.'
