- pgno: 16
  md: '# # Preface


    The medical and healthcare domain is a cornerstone of society, but modern medicine
    is highly dependent on engineering. There are machines and systems for analyzing
    patients, thus making diagnosis possible. X-ray and electrocardiography (ECG)
    are examples of such systems. X-ray, CT-scan and MRI (medical resonance imaging)
    provide visual representations, whereas ECG and EEG generate biological signals.
    Similarly, there are machines for management of patients as well. In the medical
    and healthcare sector a large amount of data is generated in every step, from
    the sensing of the ailment, to examination, correlation, classification and its
    management too.


    The present era is witnessing a large-scale development in the field of computational
    intelligence (CI). High performance computing has emerged as a powerful solution
    to deal with complex problems. The development happening around the high performance
    computing and related fields is affecting us in a very positive way. The field
    of medical science has benefited greatly from the field of the computational intelligence.
    This has led to the development of intelligent medical systems (IMS). IMS are
    a result of research collaboration of high performance computing with medical
    science. The development of IMS requires a large amount of data generation, storage
    and processing. To apply high performance computing in the medical domain, in
    depth knowledge and understanding of the medical system is required.


    This large amount of data is a necessity for correct analysis and correlation
    of disease. The generation, collection, storage and labeling of such large data
    is quite a challenging task. With the advent of wearable devices data generation
    is increased manyfold. The high performance computing tools seem a powerful option
    for working on such a large amount of data. They have the ability to perform complex
    tasks with high speed and accuracy. This knowledge helps researches to apply CI
    concepts for enhanced performance of medical systems. IMS are able to provide
    human-like ability and intelligence to existing applications. In this way, IMS
    can be utilized to get a deep insight into various healthcare and medical problems.
    It can also aid in controlling, analyzing and management of medical applications.
    The field of CI makes it possible to address the various issues concerning human
    health and medical systems. IMS will be fruitful for significant improvement in
    human life.


    The in-depth analysis of large data is the prime requirement for the development
    of IMS. This can be very helpful in medical and healthcare applications. High
    performance computing is definitely the answer for computing needs in the medical
    domain. Deep computational architecture, with capabilities like low-level feature
    extraction and data augmentation can give a new direction to the present research
    in medical systems. Considering the future aspects of high performance computing
    and its involvement in the medical field, IMS is a widely researched area. The
    idea behind this book is to focus on the advancements in the domain of high performance
    computing for medical systems. The chapter-wise description of this book as follows.


    Chapter 1 presents automatic detection of hypertension and normal electrocardiogram
    signal by using flexible analytic wavelet transform and different'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'classification techniques. Chapter 2 explores a novel CI approach called spider
    network classification of basic hand movements. This CI approach provides an effective
    solution for disabled people based on a man–machine interface employing surface
    electromyogram signals. Chapter 3 demonstrates dysfunction of speech or voice
    that leads to a wide range of psychiatric disorders resulting from stigmatization
    from peers and the community. Different aspects of voice pathology research, applications
    for the Internet of Things, different datasets, feature extraction, and classification
    techniques are discussed. Chapter 4 develops several architectures based on deep
    neural networks (DNNs) and develops more appropriate models to meet the demands
    of the British Hypertension Society and the Association for the Advancement of
    Medical Instrumentation Standards.


    Chapter 5 provides analysis of critical STARD/TRIPOD issues of more than 45 machine
    learning methods for the detection of COVID-19 during the pandemic. In addition,
    various strategies have been recommended to avoid systematic flaws and improve
    the clinical reliability of such systems. Chapter 6 presents four different functional
    models for Covid data analysis of Indian Covid patients accessed from Kaggle.
    Chapter 7 explores a model for improved patient feedback in diagnostics. The work
    focuses on a model that helps healthcare consumers to formulate and express their
    opinions quickly and easily about a perceived diagnostic phase in their care.
    Chapter 8 presents digital radiographs and other computerized methods used for
    the diagnosis of different diseases. It is required to compress and process the
    data efficiently with limited hardware resources, hence various soft computing
    techniques are applied in the field of video compression to make the process faster
    by accelerating the motion estimation. Chapter 9 describes how the brain manages
    the control system and blood circulation by nerve cells, so it becomes important
    to know about the symptoms of initial stage neuron disturbance in the body system.
    Therefore, to protect the human body, machine learning algorithms are used to
    analyze Parkinson’s disease symptoms. Chapter 10 presents mammogram images enhancement
    to improve the image quality for better interpretation and detection of breast
    cancer. In chapter 11 retina imaging helps in the diagnosis of proper eye disease
    along with complications of diabetes retinopathy, hypertension, myocardial infarction,
    etc. Therefore, the anatomy of the eye, physiology of the various eye diseases,
    retinal imaging methods-2D fundus imaging, and 3D optical coherence tomography
    (OCT) and their comparative analysis are done. Chapter 12 provides a survey on
    biomedical image segmentation for brain tumors and retina segmentation, abnormality
    detection, advantages, disadvantages, and automated-learning techniques ranging
    from traditional machine learning to deep learning are done. Also, it provides
    a glimpse of key gaps and potential future scope for biomedical image segmentation
    of retina and brain tumors. Chapter 13 discusses an AI-based proportional integral
    derivative (PID) controller with various biomedical systems and a comparative
    study of all primitives and novel control strategies for the AI-based PID controller
    regarding the health care system is explored.'
  merge: -1
  img_proc: true
