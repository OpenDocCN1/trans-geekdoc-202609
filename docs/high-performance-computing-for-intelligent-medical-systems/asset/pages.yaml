  md: '# 7.3 Diagnostics and safety challenges in healthcare


    # 7.3.1 Patient safety and equity challenges


    Patient safety is a multidisciplinary goal and a primary task in healthcare. In
    addition to technological innovations, a hospital culture should emphasize change-positive
    leadership in clinical practice [30]. Healthcare organizations should promote
    safety-conscious culture and learn from diagnostic errors [2]. Encouraging transparency
    about errors can make healthcare safer and foster a culture in which healthcare
    professionals are supported in identifying and learning from mistakes [2, 31].


    In many countries, patient safety is poor, especially among the older patient
    population, partly due to an inadequate and disorganized healthcare system [32].
    In western society, patients who have taken good care of their health may remain
    relatively healthy until the age of 80. At this age, specific health problems
    often occur, in which case, there would be a particular need for high-quality
    care and higher treatment intensity. In spite of that, medical treatment intensity
    is lower among the older patient population (aged 80 and over) [33]. Old age is
    easily perceived in healthcare as a so-called ‘period of fragility.’ However,
    older adults form highly heterogeneous groups, and their health and functioning
    may be better than negative stereotypes suggest [34]. This age represents a specific
    period in life when, in many cases, intensive care may be needed for the first
    time. The diagnostic process for the older patient population can be challenging
    due to its multi-problem character [35]. The high prevalence of pain may be considered
    a normal phenomenon in older age [36, 37]. This complexity can easily result in
    treating only the symptoms and not the cause of the symptoms.


    Also, critically ill elderly patients show favorable clinical outcomes in intensive
    care. Thus, underlying medical conditions rather than age per se should be considered
    for determining intensive care [38]. Inaccurate estimates of operative risks however
    prevent older people from receiving sometimes even standard surgery because they
    are deemed unfit for demanding treatments [39]. Almost one-half of all critically
    ill patients with primary central nervous system lymphoma (PCNSL) admitted to
    ICU were alive six months after ICU discharge [40]. Frailty-rating scales or simple,
    standardized tools alone are not acceptable prognostic assets for predicting unfavorable
    outcomes, for example, in acute care [41–43]. Quality auditing and transparency
    are needed, especially in elderly care.


    One of the key ideas in translational medicine is to improve a patient’s health
    in an ethically acceptable way. Shared decision-making has a solid place in translational
    design in healthcare; hearing the client’s voice is one step toward better equality.
    Such decision-making means intense collaborative processes between patients and
    providers [2]. Shared decision-making is about giving weight to the patient’s
    values and opinions, and also when older patients are in question. Thus, tuned
    feedback systems, suitable for all age groups mean important and vital development
    areas. The COVID-19 crisis is an area fostering the use of modern information
    and communication technologies among older adults [34]. Equality in'
