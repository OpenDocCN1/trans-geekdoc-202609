    # 10.5 Evaluation criteria


    We have defined some criteria of image performance to validate the efficiency
    of our method. Commonly used performance indications are MSE, PSNR, SNR, Mean,
    and Variance.


    # 10.5.1 Mean square error


    The mean square error (MSE) is measured by cumulatively squaring the error between
    the restored image and the degraded image [47, 48]. Mathematically, MSE is calculated
    as follows.


    \(MSE = \frac{1}{mn} \sum_{x=0}^{m-1} \sum_{y=0}^{n-1} [g(x, y) - \bar{g}(x, y)]^2\)
    (10.28)


    Where \(g(x, y)\) and \(\bar{g}(x, y)\) are degraded and filtered (restored) image,
    respectively. ‘m’ and ‘n’ are the dimensions of the image.


    # 10.5.2 Peak signal-to-noise ratio


    The peak signal-to-noise ratio (PSNR) of an image is calculated as the ratio of
    square of the maximum possible pixel values to the MSE of the image [49, 50].
    The high-quality image has a high PSNR. Mathematically, PSNR is represented as


    \(PSNR = 10 \log_{10} \left( \frac{MAX^2}{MSE} \right)\) (10.29)


    # 10.5.3 SNR


    SNR is defined as the ratio of signal power to noise power. It is represented
    as


    \(SNR = 10 \log_{10} \left[ \frac{\sum_{x=0}^{m-1} \sum_{y=0}^{n-1} [g(x, y)]^2}{\sum_{x=0}^{m-1}
    \sum_{y=0}^{n-1} [g(x, y) - \bar{g}(x, y)]^2} \right]\) (10.30)'
