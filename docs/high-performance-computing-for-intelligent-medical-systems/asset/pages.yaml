  md: '# Chapter 8


    # Soft computing techniques for efficient processing of large medical data


    Hussain Ahmed Choudhury and Nidul Sinha


    During the last era, the usage of digital photography methodologies in radiology
    has grown substantially due to the recent developments in digital image processing
    and storage technology. About 90% of hospitals only take digital radiographs,
    including computed tomography (CT), magnetic resonance imaging (MRI), ultrasound
    (US), nuclear medicine (NM), and digital angiography subtraction (DSA). Also,
    traditional chest or skeletal x-rays, which make up another 70% of the radiographs,
    can be converted into digital signals for subsequent computed radiography processing
    (CR). The reason for this interest in digital images is clear: the representation
    of images in digital form facilitates the transmission of images and allows the
    transformation of visual diagnostic information in useful and novel ways. There
    is one possible problem with digital images, despite these benefits, namely, the
    large number of bits needed for their representation. The amount of data generated
    by these methods is immense, and when transmitting the data over a network, this
    may be a problem. In the field of medicine, image compression has been implemented
    to resolve this problem. Some examples of different biomedical image forms are
    x-ray images, CT scans, MRI images, Ultrasound images, Mammography images, Optical
    imaging. So the huge amount of data generated by different tests, videography
    of medical processes, and medical imaging are compressed to store and process
    the data efficiently with limited hardware resources. Various software and hardware
    standards are available for making video and image compression cost-effective
    and time-efficient. This chapter discusses the various soft computing techniques
    which are applied in the field of video compression to make the process faster
    by accelerating the motion estimation.


    # 8.1 Introduction


    In medical practice, medical imaging has become an essential medium that reduces
    the mortality rates, and the requirement of investigative operations and also
    leads to'
