  md: '![](img/75406d5bb714dfd3e68fbbc717bd8f67_115_0.png)


    Most of the time, the challenge posed by the curse of dimensionality is statistical.
    When the dimension increases, fewer training samples fall into the exploding number
    of cells (or defined subspaces) in the input space. Therefore, the number of training
    samples for various areas in the input space decreases rapidly with increasing
    dimension. Less training data results in poorer performance inevitably. In such
    situations, the machine learning algorithm might simply assume that the output
    corresponding to a new input equals the value for the nearby points, while the
    further distance between training samples in a high dimensional space reduces
    the accuracy of such a simplification [17, 21].


    As our results in the following sections indicate more clearly, the same problem
    might have occurred here. Since the input dimension (250) is very high, the LSTM
    model shows unsatisfactory performance. In the following models, we try to implement
    strategies to mitigate this problem.


    # 4.4.2 PCA-LSTM model


    To find out a solution for the difficulties that the LSTM network had with high-dimension
    input vectors, we apply Principal Component Analysis (PCA) method. It is an approach
    to reduce the input dimension.


    There are two common ways to illustrate PCA. It can be obtained by the orthogonal
    projection of the data onto a new space with a lower dimension. The new space
    is named the principal subspace. The projection is carried out in such a way as
    to maximize the variance of the projected data.


    Another illustration considers PCA as a technique to map our data to a new space
    with a lower dimension while minimizing the projection cost. Projection cost,
    here, refers to the mean squared distance between primary data and their projected
    counterparts [22].'
