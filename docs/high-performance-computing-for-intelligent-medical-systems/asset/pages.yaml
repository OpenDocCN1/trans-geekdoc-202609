    mean and variance in the lesion area, number the of infected lesion, and also
    demographic variables such as sex and age. Overall, 191 features were calculated
    for each patient. The dataset had 3330 CT images, among which 2148 belonged to
    COVID-19 patients, and the remaining 1182 were from CAP patients. They used 10-fold
    cross-validation. They achieved 89% accuracy, 93% sensitivity, 84% specificity,
    90% PPV (precision), and 88% NPV.


    Wu et al [57] proposed a new algorithm for classifying chest CT images from normal
    subjects and CAP patients. They used a deep active learning method in which 30%
    labeled data were used. They used a subset of the CC-CCII dataset that included
    962 patients (304 COVID-19, 316 pneumonia, 342 normal). Different augmentation,
    including affine transformation and color jittering, was used. They used 70% of
    the data to form an unlabeled dataset and 10% for validation, and 20% for test.
    First, they extracted the lung section of each image, and then they fed their
    network with unlabeled data. When the network could not predict the image label,
    it asked for the label from human experts. Their network included multiple levels
    of a 3D and 2D convolutional layer, pooling, and dropout. Finally, they compared
    their method with the state-of-the-art. They achieved 86% accuracy and 96% AUC.
    They did not report other metrics and did not report any CI, and also, they did
    not follow any specific standard.'
