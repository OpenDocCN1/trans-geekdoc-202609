    multiform glioblastoma and even the most damaging primary malignant brain tumour
    [92]. Radiotherapy, surgery and chemotherapy are procedures used, typically in
    tandem, for the treatment of gliomas [93].


    Early glioma diagnosis plays a crucial role in enhancing treatment options. Imaging
    technologies including CT, PET, MRI have been employed in order to ensure valuable
    information about the structure, magnitude, location and metabolism of the brain
    tumour. While these methods could be used in conjunction with brain tumours to
    provide the best knowledge, the definitive soft-tissue contrast and wide adoption
    make MRI the base standard. MRI is a near-invasive in vivo imaging framework for
    implementing radio frequencies to influence target tissues to produce their internal
    images, under the effects of a very strong magnetic field. Images from various
    MRI sequences are created by altering the time when the image is recovered. Different
    MRI modalities provide different images of tissue contrast that provide useful
    structural information and allow the identification and segmenting of the tumour
    in conjunction with its sub-regions [94]. During the acquisition of MRI, although
    it can differ from device to device, almost a hundred slices of 2D pictures are
    generated to reflect the 3D brain volume. Moreover, when the fragments from the
    required normal modalities are fused for study, the data becomes densely populated
    and complex.


    During a surgical procedure aimed at removing/depleting tumour cells, care must
    also be taken to preserve as much healthy tissue as possible. Brain tumour segmentation
    involves identification, delineation and differentiation of the tumour tissues
    of healthy brain tissues from necrotic cells or activated cells and edema. The
    strategy requires the manual annotation and segmentation of a large number of
    multimodal MRI images in a routine manner. However, since handcrafted segmentation
    is a pro-lengthy procedure, the development of robust automatic segmentation methods
    to provide effective and accurate segmentation has become an interesting and prominent
    scientific discipline in recent years [95]. Recently, high segmentation results
    achieved by deep learning strategies make them good nominees to accomplish this
    task.


