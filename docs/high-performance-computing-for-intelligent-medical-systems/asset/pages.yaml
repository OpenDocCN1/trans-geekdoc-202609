    # 10.7 Conclusion


    In this chapter, we have discussed image enhancement techniques both in the spatial
    domain and frequency domain. In spatial domain techniques, we have used the point
    processing techniques like histogram, histogram equalization, and histogram matching
    and some masking techniques like median filtering, mean filtering, Gaussian filtering,
    etc and in the frequency domain, ideal and Butterworth low pass filter, Gaussian
    filters, homomorphic filters, etc and observed that low pass filtering causes
    ringing effect in the output of the image. In the case of the Butterworth filter,
    it reduces the ringing effect but for higher-order, it also causes a ringing effect.
    However, a Gaussian filter does not cause any ringing effect. The homomorphic
    filter can enhance the image with very low illumination.'
