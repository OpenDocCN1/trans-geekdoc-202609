  md: '# 11.7.1 Glaucoma detection using retinal imaging


    The thickness of the retinal nerve fiber layer (RNFL) [31] is the major hallmark
    for the diagnosis of this disease. In the case of glaucoma, fundus imaging is
    one of the most reliable techniques and photos can be easily accessed. After the
    analysis is done the results obtained can be interpreted to detect the disease
    [32–34].


    The process of glaucoma diagnosis is depicted in the diagram in figure 11.2 hence
    the sequence involved in the process is as follows:


    +   (i) There is observation and analysis of the provided image;

    +   (ii) Pre-processing of analysed entity mainly depends on sampling process,
    region of interest, extraction and selection of channel;

    +   (iii) Segmentation of provided photo image;

    +   (iv) There is reorganization of analysis pattern by applying the technique
    of segmentation;

    +   (v) There is the extraction of characters and then their selection;

    +   (vi) Now the role of the classifiers comes into the play.


    The detection and diagnosis of glaucoma is done by different classifiers, such
    as


    +   I. SVM classifier-based technique Vapnik was the first to propose the support
    vector machine (SVM), which has sparked a lot of interest in the machine learning
    community. Several recent studies have shown that SVMs are typically capable of
    delivering higher classification accuracy than other data classification algorithms
    [35–38].


    +   II. Thresholding-based techniques If the image intensity is less than a constant,
    the simplest thresholding methods replace each pixel in an image with a black
    pixel, and if the image intensity is greater than that constant, each


