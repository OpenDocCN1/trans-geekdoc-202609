    for efficient storage and transmission using LPC. It is one of the most effective
    methods of language analysis and has become popular as a formant evaluation tool
    [88]. The LPC analysis is based on the approximation of the vocal tract as a linear
    all-pole IIR filter. For a signal segment with a sampling rate of 8 kHz, a voice
    encoder is used to calculate the optimum excitation, voice pitch time, gain and
    coefficients. The LPC is based on the mean-square error approach. Using this approach,
    a linear combination of the earlier samples is used to measure the voice signal.
    The LPC coefficients vary considerably in some portions of the voice signal. However,
    the magnitude is not significant for other parts of the voice signal. Pathological
    speech can be differentiated by a continuum of magnitude from normal voice.


    +   D. **Glottal flow signal.** It can be extracted by inversely filtering a speech
    signal that eliminates redundant voice artifacts from the mouth and vocal tract
    and preserves the original message signal released during the glottal flow [89].
    The Pitch Synchronous Iterative Adaptive Inverse Filtering algorithm was developed
    to extract glottal signal attributes as one of the MATLAB toolboxes known as Apart8.
    The time domain characteristics that can be obtained from the glottal flux signal
    are: the closing and opening instants, the opening threshold, the amplitude threshold,
    the quasi-open threshold, the normalized amplitude threshold, and the speed quotient.
    Frequency domain parameters are: the difference between the harmonics and its
    richness factor.


    +   E. **Spectrograms.** The waveform of speech consists of a sequence of events
    that differ from time to time. This time differential refers to the spectral characteristics
    that vary considerably over time. This type of fast-time signal cannot be acquired
    by a single Fourier transform, and instead the [90] STFT is used. The STFT consists
    of a Fourier transform with a sliding waveform part window. The distribution of
    the spectral power of a voice varies greatly with time and frequency, so that
    regular to pathological tones can be distinguished. For a normal voice, the spectral
    density of power is consistent with time and frequency, but is not consistent
    with a pathological voice. The spectrogram is also considered to be a strong segregator
    of pathological voices from ordinary voices.


