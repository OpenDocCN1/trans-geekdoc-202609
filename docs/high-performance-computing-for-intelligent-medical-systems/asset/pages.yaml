    The proposed method is effective in image noise reduction and gives better enhancement
    for diagnosis. It is also shown that the performance of different filters depends
    upon the types of noises. The experimental result shows that the CNN-based filtering
    approach has been proven to be the best technique when the image is corrupted
    with Speckle, Gaussian, and impulse noise. The wavelet-based approach has been
    analyzed and results show that it is a good alternative for de-noising images
    corrupted with Gaussian and impulsive noise, but it also causes over enhancement
    and an image that appears brighter than the original mammographic image, so it
    becomes very difficult to identify the microcalcification. It is observed that
    low pass filtering can remove the noise, but it causes blurring and image smoothing.
    It can be concluded that the selection of image enhancement techniques either
    in the spatial domain or in the frequency domain is application-specific. It is
    also shown that the performance of different filters is varied and depends upon
    the types of noises.


