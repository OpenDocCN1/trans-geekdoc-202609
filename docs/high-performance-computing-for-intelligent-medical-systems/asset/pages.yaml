    An algorithm for forecasting intubation over the test folds were reported. An
    algorithm for forecasting intubation of patients diagnosed with COVID-19 was developed
    by Arvind et al [49]. They collected data from 4087 patients from 5 hospitals,
    wherein 11% of patients were intubated. They used the following features for training
    a time-series prediction based on Random Forest classifier: Systolic BP, diastolic
    BP, time from admission, temperature, pulse, respiratory rate, HCO3, pH, arterial
    CO2, oxygen saturation, WBC count, arterial O2, platelet count, C-reactive protein,
    creatine, and D-dimer. Using a hold-out (70% train and 30% test) validation, they
    achieved an AUC of 0.84 for predicting intubation presence in 72 h. They followed
    the TRIPOD standard and applied statistical analysis to the results. However,
    the CI was not reported for the performance indices.


    Nayak et al [50] used transfer learning for COVID-19 x-ray image classification.
    Different models such as Inception-V3, MobileNet-V2, AlexNet, GoogleNet, VGG-16,
    ResNet-50, SqueezeNet, and ResNet-34 were evaluated on the publicly available
    dataset, and an AUC of 98% was reported for ResNet-34 as the best model using
    hold-out (70% train and 30% test) validation strategy (figure 5.5). They also
    did not report the CI or run the proposed method with shuffling data.


    Chao et al [51] extracted the first, second, and higher-order features from CT
    images and combined them with non-imaging features, such as age, gender, temperature,
    white blood cell counts (WBC), SpO2, lymphocyte count, and lymphocyte count-to-WBC
    ratio, for predicting COVID-19 (figure 5.6). The evaluation was performed using
    5-fold cross-validation, and an AUC of 88% was achieved using random forest. Random
    forest outperformed the SVM and deep neural networks. The CI was also provided
    for the performance indices (figure 5.7).


