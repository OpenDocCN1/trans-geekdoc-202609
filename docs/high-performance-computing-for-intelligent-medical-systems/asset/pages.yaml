    # ## 13.2 Types of chronic disease


    # ### 13.2.1 Cancer


    Human cells normally divide and expand to produce fresh cells which are a requirement
    of the body. After cells grow and finally become old or damaged, they die and
    are substituted by fresh cells. In all forms of cancer, any of the body''s cells
    start to split uncontrollably and spread into adjacent tissues. Cancer may begin
    in almost any part of the body.


    Cancer cells versus normal cells: The key difference among normal cells and cancer
    cells is that cancer cells progressively divide without discontinuing. Normal
    cells develop to perform special functions while cancer cells do not.


    +   Cancer classification:

    +   (a) Common types of cancers: lung, breast, skin, prostate.

    +   (b) Less common cancers: stomach, brain, ovarian, leukemia.

    +   (c) Cancers occurring in children: osteosarcoma, neuroblastoma, acute lymphoblastic
    leukemia, childhood leukemia,


    Carriers of cancer: The three main types of genes that are affected and contribute
    to cancer are tumor suppressor genes, DNA repair genes and proto-oncogenes. These
    variations are sometimes referred to as ‘drivers of cancer’.


    Tissue changes are sometimes misinterpreted as cancer: when cells within a tissue
    divide faster than normal pace then it is termed hyperplasia. This can be caused
    due to mere chronic irritation. When extra abnormal cells build up in an unusual
    manner, this is termed dysplasia, a more severe condition than hyperplasia. It
    has a greater chance of being converted into cancer.


    Cancer controlling technique: An AI based PID controller is a tool to treat cancer
    in a better way. Cancer treatment is usually highly expensive. To curb the expenses
    and make it available to the everyone, a PID controller using Computed Torque
    Control (CTC) can be used that gives the best administration procedure for every
    patient. A feedback linearization-based controller has been created that is founded
    on the Hahnfeldt model [31]. The Hahnfeldt model uses a control engineering perspective
    for tumor regulation based on an optimal controller that decreases the dimensions
    of the tumor in the shortest way and also reduces the amount of medication, thus
    reducing the cost of treatment. It must be kept in mind that like any other medication,
    care should be taken to check any unforeseen result. This is a Robust Fixed-Point
    Transformation (RFPT) based control mechanism which decreases the total inhibitor
    concentration and at the same time increases the robustness of the controlled
    system. It is high time we should depart from the traditional model-based cancer
    chemotherapy practices. We can use a reinforcement learning-based (RL-based) method,
    a model-free method for the close control of cancer chemotherapy medicine dosing
    [32].'
