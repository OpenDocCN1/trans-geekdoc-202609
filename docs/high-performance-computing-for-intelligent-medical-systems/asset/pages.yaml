    # 2.5.3 Discussion


    In this article, the proposed method uses DCT, FFT, SVD, TP and NCA-based feature
    reduction methods. These are effective methods and by using the proposed SN, their
    positive effects for the signal processing are directly used. The proposed SN
    extracts distinctive features and they can be basically classified. To obtain
    performances of the SN, three classifiers are used. The best classifier among
    them is the ANN which achieved 100.0%, 100.0%, 99.44% and 100.0% for F1, F2, F3,
    M1 and M2 subjects, respectively. The best classification accuracies of the developed
    model are also the best accuracies of the state-of-the-art methods. The results
    are also listed in table 2.8. According to table 2.8, the proposed SN achieved
    the best results for all subjects.


    Table 2.7. The computational complexity of the proposed SN.


    | Steps of the proposed SN | Computational cost |

    | :--- | :--- |

    | 1: Concatenate sEMG signals of the right and left hands | O(L) |

    | 2: Apply DCT to signal | O(L) |

    | 3: Apply FFT to signal and generates three transformation signals | O(3L) |

    | 4: Apply TP to DCT, FFT signals and original signal | O(5L) |

    | 5: Apply SVD to DCT, FFT signals and original signal | O(5L) |

    | 6: Concatenate TP features | O(5T) |

    | 7: Concatenate SVD features | O(5S) |

    | 8: Reduce TP features | O(5T) |

    | 9: Reduce SVD features | O(5S) |

    | 10: Concatenate reduced features | O(S + T) |

    | Total cost | T(L, S, T) = O(15L + 11T + 11S) |


