    D(Double)DM, Gr (Genetic related) DM, and some extra forms of DM also occur by
    various types of disorder [47]. To regulate the glucose in the blood a system
    is used called Artificial Pancreas (AP). Insulin delivery in a diabetic body can
    also be managed by AP such as decreased insulin dose in a hyperglycemia patient
