    # 1.2 Methodology


    This section consists of information about the dataset, FAWT, features, and classification
    techniques. The ECG signals are decomposed into subbands using FAWT. Various time
    domain features such as mean, mean absolute value (MAV), root mean square (RMS),
    standard deviation (STD), variance (VAR) and simple square integral (SSI) are
    extracted from these subbands. Highly distinguishable features are selected using
    the Kruskal–Wallis test and classified using different classifiers. Figure 1.1
