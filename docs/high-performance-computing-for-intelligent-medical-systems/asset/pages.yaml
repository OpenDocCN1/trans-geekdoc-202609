    # 7.7 Phases of diagnostics and the requirements for doctors


    # 7.7.1 Requirements for competence and compassion


    Patients expect that the doctor has sufficient expertise to provide both right
    diagnosis and adequate care. Medical ‘competence’ for a doctor is assumed to include
    technical capability and willingness to provide needed information. Consumers
    also expect ‘compassion’, empathy, and moral support when making healthcare decisions
    [79]. Effective communication, trust, and an encouraging environment are aspects
    of mature consultation skills [60]. In surgery and intensive care, physician competence,
    like technical skills, is often preferred while in the end-of-life vignette, compassion
    is emphasized. In chronic care, preferences for physician competence and compassion
    vary. In pediatric cases, a doctor’s competence is preferred, but the importance
    of empathy is also valued [79].


    # 7.7.2 Diagnostic process from the view of doctors


    In their self-evaluative actions, many doctors use a variety of often individual-tuned
    process models. These checklists play a role in improving the diagnostic process
    [2, 80]. The best process models describe different phases of the diagnostic process.
    With aid of taxonomic models it is easier to detect what went wrong in diagnostic
    process. Taxonomic failures can be assessed from several standpoints in the diagnostic
    process; from access and patient history to the final stages of referrals and
    follow-up. In each step, embedded sub-categories clarify items for evaluation.
    In ordering tests, e.g., mistakes may include delays in test ordering or sequencing
    [61].


    Schiff and colleagues [81] divide the diagnostic process into seven stages: (1)
    access and presentation, (2) history taking/collection, (3) the physical exam,
    (4) testing, (5) assessment, (6) referral, and (7) follow-up. A patient’s clinical
    history includes documentation of the current health problem, history (medical,
    family, social), and other needed information like medications [2, 82]. Physical
    examination skills have a substantial role in diagnostics, but these skills have
    often been underemphasized in professional education [2, 83]. Diagnostic testing
    contains areas of laboratory, medicine, anatomic pathology, and medical imaging
    [2].


