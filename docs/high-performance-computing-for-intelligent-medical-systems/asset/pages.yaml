    Surface electromyography (sEMG) signals have been widely employed for myoelectric
    control as it includes important information on muscular action. The hands play
    a crucial role in manipulating and grasping several items. The defeat of even
    a single hand can expressively disturb the human activity. Hence, a prosthetic
    hand is an attractive solution to furnish the armless person [2–4]. The usage
    of sEMG differs from rehabilitation apparatus to a man–machine interaction scheme.
    Several intelligent methods were developed to classify the neuromuscular actions
    in prosthetic hand control. In this chapter, the sEMG signals based prosthetic
    hand movement control framework is presented. The hand prosthesis based on the
    myoelectric control employs the sEMG signals that are taken from the skin surface
    during the contraction of muscles. Most muscles that control the finger motion
    are positioned on the left side of a stump. Thus, the action of these muscles
    can be employed for the prosthesis control after a hand amputation. In order to
    control prosthesis motion with muscle activity features extracted from the myoelectric
    signals can be utilized. The feature extraction from sEMG can be achieved by employing
    numerous techniques involving signal characteristics in time and frequency domain,
    autoregressive model coefficients, and time-frequency characteristics [5]. On
    the other hand, a robust hand movements recognition by employing the sEMG signals
    present diverse challenges. To enhance the classification performance and get
    rid of those problems, a proper arrangement of the feature extraction and selection
    methods should be employed. Additionally, an appropriate model to improve the
    classification performance should be utilized.


