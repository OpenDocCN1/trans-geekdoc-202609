    # ## 6.6 Discussion


    Now we have used the logistic regression model as a combined model of linear,
    logarithmic and polynomial regression models for the final forecasting model of
    Covid infection daily increased cases. The logistic regression model is proposed
    for future analysis in this experiment. We used two different models for the same
    dataset, one for major differences between increased times(days) such as: 0–50,
    50–100, 100–150, 150–200 etc, and find more than 700 000 infected Covid cases
    took 160 days, after that the functional model forecasted continuous increase
    of Covid infection from 700 000 to 1 500 000 with increased time from 162 to 300
    days. This shows that number of Covid patients will double within 1 month (figure
    6.9).


    In another model, we have predicted for minor difference between number of days
    such as: 0–25, 25–50, 50–75 etc, and found near 700 000 infected Covid cases took
    between 150 and 200 days, after that the functional model forecasted continuous
    increase of Covid infection from 700 000 to 1 500 000 with increased time from
    160 to 225 days (figure 6.10).


