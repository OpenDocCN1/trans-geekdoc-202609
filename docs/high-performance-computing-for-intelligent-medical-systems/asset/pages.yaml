    # A. Retina image segmentation


    Global blindness is primarily caused by eye disorders, such as DR and diabetic
    maculopathy (DM). DM has a prolonged preclinical period in which eyesight is not
    impaired and vision loss will usually not be regained until the individual is
    in the eye clinic. Early diagnosis will avoid and protect the vision of the disease.
    Thus, retinal vessel research and analysis have become the basis for early diagnosis
    medical applications and successful monitoring of the retinal pathology, including
    blood vessels’ diameter, angles and lengths of its branches. Retinal ophthalmology
    image assessment is a key step towards retinal pathology recognition. Retinal
    vessel segmentation is a critical element for the diagnosis of eye disease. For
    the identification of symptoms, the thick and thin vessels are essential.


    One of the principal anatomical structures found in a retinal fundus image is
    retinal blood vessels. The structure and feature changes in it reflect the impact
    of cardiovascular diseases (CVDs) such as cataract, DR, and high blood pressure,
    etc. In the developed world, cataracts are by far the most common cause of blindness,
    contributing to over half of visual impairments. Effects like blindness can be
    avoided by early diagnosis and treatment. The region of the eye lens becomes thick
    and cloudy. It happens progressively as the eye’s protein deposition expands and
    prevents the lens from transmitting clear images to the retina. Around 0.075 billion
    blind people are likely to be registered in 2020 [45, 46]. It is of three types
    depending on its location. Firstly, at the middle of the lens, the nuclear cataract
    imparts yellow colour and image-blur to the lens. Usually in elderly people, the
    cortical cataract features are found at the corner of the lens. The capsular cataract
    behind its lens is the seriously harmful form of cataract [47]. This index rises
    rapidly in the elderly over 40 years, particularly among older people. The increased
    incidence is a major problem in early detection and diagnosis for the WHO. Early
    intervention and treatment may reduce cataract patients’ resilience and avoid
    vision problems. Retinal diseases can only be detected by segmentation, but experts
    for the detection and segmentation of manual vessels are required. It is typically
