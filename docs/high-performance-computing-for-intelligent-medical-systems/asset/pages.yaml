    useful information and interpret that information, but many times false diagnosis
    might be possible. To improve evaluation skills and diagnosis consistency to the
    doctor and reduce the subjective error, image processing techniques can be used
    to identify breast calcification types. Calcifications in the breast are small
    calcium deposits that appear as high-intensity regions in the mammogram. Calcifications
    are of two types, micro-calcifications, and macro-calcifications. Macro-calcifications
    are benign lesions that appear as coarse, scattered calcium deposits, whereas
    micro-calcifications are isolated calcium deposits that usually appear in clusters.


    A micro-calcification cluster in the mammographic image may have breast cancer.
    The radiologist uses different shapes, sizes, and distribution of micro-calcification
    to identify malignant or benign. Malignant is a small dot-like structure that
    varies in size, shape, and density, whereas benign is a large, rounded shape structure
    homogeneous in shape [15]. These medical images help doctors in the detection
    of the abnormality in breast tissue. Analysis of the image in the early stage
    is complicated due to uncertainty in the tumor’s location. In the early-stage
    healthy and unhealthy cells are overlaid so it becomes very difficult to detect
    different intensity [16, 17]. Noise can also affect the image’s quality and a
    noisy image requires more computational time [18, 19].


    Computer-aided tools that can compare the results with radiologist data are advantageous
    [20, 21]. Image processing techniques can be used to identify the area of interest
    including: filter selection for noise removal, image resizing, contrast enhancement,
    and removal of noise from the image to distinguish between cancerous and non-cancerous
    cells. The Otsu thresholding method minimizes the interclass variance of thresholded
    black and white pixels. Laplacian subband [22] is also a solution for removing
    unstructured, spurious artifacts from the image. Shukla et al [23] proposed an
    algorithm based on the K operator with Riesz kernel for image denoising. Adam
    et al [24] combine averaging and nonlinear Gaussian filtering to reduce speckle
