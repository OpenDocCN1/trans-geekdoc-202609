  md: '![](img/75406d5bb714dfd3e68fbbc717bd8f67_241_0.png)


    ![](img/75406d5bb714dfd3e68fbbc717bd8f67_241_1.png)


    # 10.2.5 Gaussian filter


    It is another linear smoothing filter. The weight of the Gaussian filter is chosen
    according to the shape of the Gaussian function. It is defined as [37, 38]


    $$h(x, y) = \frac{1}{\sqrt{2\pi}\sigma} e^{-\frac{x^2+y^2}{2\sigma^2}}$$ (10.2)


    The above function shows that the Gaussian filter is separable. Figure 10.4 shows
    that amount of smoothing depends upon the standard $\sigma$. Mathematically, a
    Gaussian filter modifies the image by convolving with a Gaussian function.


    # 10.2.6 Median filter


    Median filter is a nonlinear statistical filter that smoothens the image by replacing
    the value of the center pixel by the median of the neighborhood pixel. In median
    filtering, first all pixels within the mask are sorted in ascending or descending
    order, then median value is replaced with the centre pixel value [37, 38]. The
    output of the median filtering is shown in figure 10.5.'
