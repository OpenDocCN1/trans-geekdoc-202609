    than five mmHg and eight mmHg, respectively [20]. Our results show that the LSTM
    network is not accurate enough according to the standard.


    Another considerable point about the reported results in table 4.1 is the higher
    value of the Pearson''s correlation coefficient for systolic BP compared with
    diastolic BP despite the reality that the MAE is much higher for systolic BP.
    To interpret these seemingly contradictory results, we should consider that the
    correlation coefficient is based on the relative variations instead of absolute
    values. Therefore, since systolic BP commonly has much higher amplitudes than
    diastolic BP, the coefficient is bigger for systolic estimations.


    Figure 4.6 provides more visual cues about the low performance of the LSTM network.
    The figure demonstrates the high degree of error in both estimation procedures.


    +   * **Curse of dimensionality:** When the input dimension increases, machine-learning
    problems become exceedingly difficult. It is because the range of input configurations
    will increase exponentially. This problematic phenomenon is known as the curse
    of dimensionality [17].'
