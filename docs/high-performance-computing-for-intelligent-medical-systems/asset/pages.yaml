  md: '# Chapter 1


    # Automatic detection of hypertension by flexible analytic wavelet transform using
    electrocardiogram signals


    Kapil Gupta, Smith K Khare, Varun Bajaj and Irshad Ahmed Ansari


    Hypertension (HPT) is a critical health problem that comes from the higher blood
    pressure force on the walls of arteries. HPT occurs when systolic blood pressure
    (SBP) and diastolic blood pressure (DBP) are more than 140 mmHg and 90 mmHg, respectively.
    It becomes more severe when SBP is greater than 180 mmHg and DBP is more than
    120 mmHg. HPT has no direct symptoms but continuous higher blood pressure can
    urge heart muscles enlargement which will be reflected in the electrocardiography
    (ECG) report. Due to the non-stationary nature of ECG signals it is difficult
    to detect HPT manually. Hence, an automatic detection of HPT is proposed using
    flexible analytic wavelet transform (FAWT) in this chapter. The input signal is
    decomposed into sub-bands using FAWT and features are extracted from these sub-bands.
    A set of highly discriminatory features are identified using the Kruskal–Wallis
    test. These features are fed into the input of different classifiers to classify
    the HPT and normal ECG signals. The effectiveness of the proposed system is checked
    by applying tenfold cross-validation and obtained specificity, sensitivity, accuracy,
    negative predicted value, false positive rate, and false negative rate of 96.74%,
    96.95%, 96.60%, 99.69%, 3.04%, and 3.24%, respectively, using ensemble bagged
    tree classifier.


    # 1.1 Introduction


    Hypertension (HPT) is defined as higher pressure of blood, and it is a severe
    health condition that comes from the large blood pressure force acting on the
    walls of the arteries [1]. It creates higher blood pressure around the arteries,
    as the heart works hard to pump oxygenated blood through the rest of the body
    [1]. According to statistics of the World Health Organization, HPT is the third
    most common cause of global fatality and responsible for more than eleven million
    deaths annually [2]. HPT, if not treated in a timely manner may induce various
    diseases related to kidney, brain and heart [3, 4].'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'Timely diagnosis and proper medication of HPT may help in reducing the risk
    of various cardiovascular diseases [5, 6]. From clinical epidemiological observations,
    optimal systolic blood pressure (SBP) and diastolic blood pressure (DBP) are less
    than 140 mmHg and 90 mmHg, repectively, in a healthy person [7]. HPT becomes severe
    when SBP and DBP are more than 180 mmHg and 120 mmHg, respectively [8]. A sphygmomanometer
    is commonly used to measure blood pressure [8]. Due to various environmental limitations
    it is being replaced by computerized measurement devices such as aneroid sphygmomanometers
    and digital electronic pressure transducers [9]. But these meters may provide
    inaccurate results due to the tendency of error in estimating SBP and DBP in adults
    [10].


    As the pressure of blood can vary, 24-h, monitoring of blood pressure has emerged
    as a useful tool for diagnosing HPT [11]. Continuous HPT will sharpen heart, nerve,
    and kidney diseases which will be deliberated in the electrocardiography (ECG)
    report. Varying electrical activity of the heart is measured by using an ECG report
    [12]. The isoelectric line is calculated from the baseline voltage of ECG, which
    is the portion of tracing following the T-wave and preceding the next P-wave [13,
    14]. ECG analysis helps the cardiologist to diagnose the symptoms of the various
    diseases [15].


    Segmentation of ECG signal plays a vital role in the analysis of coronary artery
    disease, blockage in the heart, hypertrophy of heart chambers, etc [16]. ECG signal
    is the combination of P-wave, QRS complex, and T-wave. P-wave is also known as
    atria complex, and occurs when the senatorial node produces an action that depolarizes
    the atria. The P-wave is the first and positive wave of the ECG [17]. The height
    and width of a normal P-wave is less than 2.5 small squares. Taller P-wave occurs
    due to the enlargement of the right atria, which is greater than 2.5 mV and causes
    a pulmonary chronic respiratory disease called pulmonary HPT. A wider P-wave occurs
    due to the enlargement of the left atria having a duration of 2.5 s. Q-wave is
    the negative wave due to the depolarization of the basal portion of the interventricular
    septum. R-wave is the positive tallest wave due to depolarization of the apical
    portion in the ventricular septum and muscle. S-wave is the smallest negative
    wave due to depolarization of the basal portion in the ventricular muscle near
    the atria ventricular ring. The association of Q-, R- and S-wave is called QRS
    complex or initial ventricular complex. T-wave is the positive wave that occurs
    due to repolarization of ventricular musculature; with the help of ECG a segment
    cardiologist can identify the various types of heart activity [18].


    # 1.1.1 Various intervals of ECG


    P–R interval: is the time difference between starting of P-wave and starting of
    Q-wave. A normal P–R interval lies in the range 120–200 ms. Greater P–R interval
    (value more than 200 ms) indicates first-degree heart block, and if the P–R interval
    is less than 120 ms it indicates Wolff–Parkinson–White syndrome.


    Q–T interval: is the time difference between starting of Q-wave and ending of
    T-wave. A normal Q–T interval lies in the range of 360–440 ms. A long QT interval
    (QT > 440 ms) indicates hypocalcemia. A short Q–T interval (QT < 360 ms) indicates
    hypercalcemia.'
