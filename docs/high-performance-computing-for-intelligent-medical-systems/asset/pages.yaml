  md: 'its separate feedback systems to make progress quickly. However, providing
    specific feedback can be challenging for the patient when it comes to diagnostic
    practices. Some areas in the diagnostic phase are easier to handle in feedback
    procedure by clients if the stages and content of the process are presented in
    simple, easy-to-read formats. Thus to a certain degree structured phases in addition
