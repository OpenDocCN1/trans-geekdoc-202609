  md: 'B. Semi-automatic segmentation. Semi-automatic segmentation strategies demand
    a restricted number of user encounters with automated algorithms in order to achieve
    precise segmentation outcomes [18]. The user interaction may include a set of
    estimated initial ROI, which is ultimately used to segment the whole picture.
    To reduce segmentation errors, manual testing and area boundary editing may be
    needed. The following are examples of semiautomatic segmentation strategies:

    (1) The Seeded Region Growth algorithm, which is based on a user''s original seed
    point iteratively merges identical neighbourhood pixels [19].

    (2) A level-set active contour model that starts from an original boundary shapes
    with a specified ROI and updates them iteratively by shrinking or expansion process
    is not needed [20].

    (3) Localised region active contour methods that use region boundary conditions
    to use tiny local sections to define the image''s foreground and background and
    have the benefit of managing heterogeneous textures [21].


    C. Fully automatic segmentation. There is no interference from the customer. However,
    many of these systems concentrate on supervised methods of learning and training
    data, such as atlas segmentation methods, support vector machines (SVMs) and deep
    neural networks (DNNs). In unsupervised learning both training samples and the
    sample validation require ground truth images. With a completely intelligent segmentation
    in biomedical images, significant variations in form, size, texture and in some
    cases ROI colour between patients and low contrast between section are obvious
    challenges [22].


    Noise may also lead to substantial deviations during data capture, as is often
    the case with modern devices. As a result, most emerging methods based on clustering
    and machine learning are confronted with the lack of global deployment that restricts
    their use to a limited range of applications. In addition, the feature extraction
    techniques used by SVM or neural networks takes a while and does not process natural
    data in its raw state and may not necessarily adapt to changing data. However,
    deep learning approaches can examine data without extracting features manually
    [23]. For semantic segmentation they are most favoured for BIS [24].


    # 12.1.3 Segmentation evaluation


    # A. Accuracy


    Manual accuracy represents the percentage of correct biomedical image pixels as
    described in equation (12.1). It is also recognised as a complete pixel precision.
    This is the most fundamental assessment method, but in the case of class imbalance
    it restricts the error of representation of biomedical image segmentation results.
    The other class inequality arises when one segmentation category dominates. In
    such a situation, a higher accuracy will'
  merge: -1
  img_proc: true
- pgno: 278
  md: 'overwhelm the lower accuracy of the other class and thus a skewed result for

    the dominant class. Per class accuracy analysing and then estimating the

    proportion of pixels correctly labelled for each group is an alternative to this

    concept of accuracy [25]. This test can be used in the case of a class

    imbalance for sample data set. A decline in the confidence measurement of

    specific classes is the downside of average class precision. Fewer cases of a

    given class can lead to a substantial variance in the reliability of the results

    in comparative analyses.


    ```

    Accuracy = \frac{TP + TN}{TP + FP + FN + TN} (12.1)

    ```


    where TP stands for true positives, FN for false negatives, TN are the

    number of true negatives, and FN is the number of false negatives.


    # B. Precision


    As specified in equation (12.2), precision is reflecting the relation of

    disease pixels in automatic segmentation results measures that corresponds

    to the pixels of the ground reality disease. Precision is a valuable measure of

    performance segmentation as it reacts to over-segmentation. The over-

    segmentation leads to low accuracy values.


    ```

    Precision = \frac{TP}{TP + FP} (12.2)

    ```


    # C. Sensitivity


    This value reflects the true positive rates reported in test data. It indicates

    the number of times the test provided a positive outcome when the sample

    did indeed have a condition [26]. Defined in equation (12.3)


    ```

    Sensitivity = \frac{TP}{TP + FN} (12.3)

    ```


    # D. Specificity


    This specificity value indicates the true negative rates reported by the test

    data. It refers to the proportion of negative samples identified by the test

    that are actually negative [26]. The specificity is described in equation (12.4):


    ```

    Specificity = \frac{TN}{TN + FP} (12.4)

    ```


    # E. F1 measure


    The measure F1 specifically states the harmonic mean of precision and

    recall and is suitable for contour matching the predicted segmentation with

    ground truth segmentation.


    ```

    F_1 = \frac{2TP}{2TP + FP + FN} (12.5)

    ```'
