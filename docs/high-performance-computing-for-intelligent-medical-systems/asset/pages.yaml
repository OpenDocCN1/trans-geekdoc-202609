  md: 'The structure found employing LA is then used in appropriate areas to produce
    new results. In the formation process, two methods are needed. In the first one,
    the function is updated by exploiting a Gaussian distribution for unimodal function;
    in the second one, the distribution is randomly explored to support exploration
    in multimodal function. Then block-based ME is improved by applying EGWO. The
