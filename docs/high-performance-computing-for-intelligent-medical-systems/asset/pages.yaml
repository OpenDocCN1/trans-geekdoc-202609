    # 1.4 Conclusion


    Our busy, unhealthy, hectic lifestyle and a pollution-filled environment can cause
    fluctuations in the blood force on the walls of arteries, resulting in HPT. Large
    and sudden change in blood force may damage organs and can cause various disease
    related to kidney, heart and brain. In this chapter FAWT and EBT-based decomposition
    and classification technique has been proposed for automatic detection of HPT.
    Highly discriminatory features are identified using KW test and get the highest
    classification accuracy of 96.6% using an ensemble-based classifier. The proposed
    method provides the way for implementing a new approach for automated detection
    of HPT using ECG which are presently difficult to classify due to the non-stationary
    and non-linear characteristics of the ECG signal. The FAWT-EBT-based method may
    help in the automated detection of HPT so that patients can take early medication.
    The developed system can help the experts in early prediction of HPT. In future,
    a 24-h blood pressure monitoring system will be implemented for the real-time
    automatic detection of HPT.


