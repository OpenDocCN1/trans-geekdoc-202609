    # 8.2 Understanding the concept: video compression


    Video compression represents the technique for reducing the bit requirement to
    encode digital video content, which leads to faster processing, less storage requirement,
    and lower transmission bandwidth requirement. The key idea behind video compression
    involves the removal of any kind of noise, redundant and irrelevant information
    which are not critical to watching the video contents. A video compression codec
    (format) is regarded as an efficient one if it can achieve the above benefits
    without causing much hardware overhead and without compromising the visual experience
    of the contents of the video. Higher and efficient data compression is possible
    for digital video data than that of analog video data. Lossless and lossy are
    the two techniques for data compression, where with the first type there is no
    loss of video information and the same information can be decoded as the in the
    original, while in the second type the loss of video information happens due to
    the removal of less important or irrelevant information. Balancing the quality,
    speed, resource utilization and power consumption are the challenges in video
    compression techniques. To efficiently process the video data, videos must be
    encoded through a compression process.


    As the videos are a collection of images or frames, the encoding of videos will
    include the encoding of each of the frames. But there is a difference in encoding
    still images and video sequences. The images or frames only have spatial redundancy,
    whereas the signals in video vary in space as well as in time and they have both
    spatial and temporal redundant information. The spatial redundancy is due to the
    correlation that exists between the nearby pixel values and the temporal redundancy'
  merge: -1
  img_proc: true
- pgno: 194
  md: 'exists between the signals that vary in the time since the frames are captured
    very fast. This can be well understood by the fact that the videos are captured
    by high-quality cameras and at very high speed represented by the frame rate of
    videos like 30 fps (i.e., 30 frames per second) meaning that within a second,
    30 different frames are being captured, that is, to capture 1 frame, 33 milliseconds
    are required. It is a well-known fact that the variation in video information
    is owing to the physical displacement of the object from one frame to another,
    so, it can be argued that there will a considerable amount of redundant information
    popularly referred to as temporal redundancy between two successive frames of
    a video as the physical movement of the objects within a span of 33 milliseconds
    will be very limited. The best example is that of a news anchor briefing the news
    in a news-room/studio, there will be no change in the background, chair, desk,
    etc due to non-movement of the objects, which is the reason for spatial redundancy
    between the frames of a video, whereas there will be a change of movement of lips,
    hands, head, shoulders, and eyes but to a very limited extent. So, this type of
    very low degree of movement leads to temporal redundancy. To encode and compress
    all such videos, both spatial and temporal redundancies should be exploited.


    # 8.3 Image compression standards


    During the latter part of the last century, the emergence and development of digital
    imagery led to increasing demand for digital transmission and storage of images.
    Identifying the necessity of suitability and interoperability between various
    image communications and loading devices, several standardization efforts for
    image compression have been initiated over the past few years by agencies of international
    standard such as the International Standards Organization (ISO), the International
    Telecommunications Union (ITU) and the International Electro-technical Commission
    (IEC). In promoting the growth of digital photography, these principles have played
    a major role. Various image compression standards are discussed in this section.


    # 8.3.1 JPEG


    JPEG refers to ‘Joint Photographic Experts Group’ and specifies the working group
    WG1 of the ISO/IEC Joint Technical Committee 1, Study Committee 29 (ISO/IEC JTC1/SC29/WG1).
    The WG1 committee had developed many image compression standards at the international
    level.


    # 8.3.2 JPEG2000


    The standardization process to improvise the standard of JPEG Compression, WG1
    committee initiated the process in the latter part of 1990. The improved standardized
    features include 16 bits deep samples being supported, superior bit-rate performance
    (especially at low bit-rates), support for samples of up to 16 bits deep, advanced
    transmission, and single architecture supporting both lossless and lossy compression.'
