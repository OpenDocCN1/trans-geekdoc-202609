    # 3.2 Electroglottography


    This technology is low-cost, non-invasively measuring changes in the relative
    vocal fold area during the production of laryngeal voices. EGG was introduced
    30 years ago [42, 43] in the late 1980s and early 1990s [44–49] and has passed
    through a golden age of growing scientific interest. A high frequency, low ampere
    current is transmitted between two electrodes located on either side of the thyroid
    cartilage. Vocal fold vibration transmits changes to the vocal fold contact analysis
    (VFCA), allowing the EGG signal to vary by VFCA. The lack of spatial information
    during the calculation of EGG is a crucial weakness. Vocal fold vibration is a
    complex three-dimensional phenomenon that is mapped to a time-variable value,
    that is, VFCA. Differences in vibrational features, such as inferior-superior
    or front-posterior [50], are difficult to resolve. The concept of a multi-channel
    EGG estimate was demonstrated by [51]. Three years later, two channels using different
    modulation frequencies were used to capture both horizontal and vertical signals
    [52]. The concept of a multi-channel EGG was also explored in [53] by setting
    up a system to decode 36 multiplexing current paths with two 2×3 electrode grids.
    The ability of the device to monitor vertical and horizontal larynx positions
    during singing and swallowing was demonstrated by limited pilot data obtained
    using the prototype of this design. In a different method, the developers of [54]
    replaced multiplexing time division with frequency division multiplexing. By proposing
    an electrical impedance tomography (EIT) procedure, Liu et al [55] have broadened
    the concept of collecting spatial information from a non-invasive physiological
    voice signal'
