  md: '# 3.2.1 Quantitative analysis


    A. Fundamental frequency estimation. Since the EGG signal is an indirect physiological
    proof of the cyclic origin of laryngeal vibrations, it is in reality an ideal
    candidate for the extraction of fundamental frequencies. Several earlier studies
    used the EGG in various contexts to establish fundamental frequencies [72]. Proceedings
    can include-testing dosimetry [73], quantifying timbre in a-cappella quartet performance
    [74], or researching vocal sensations [75]. The [75] study showed that the fundamental
    frequency obtained from the acoustic signals has been correlated with the EGG
    signal as calculated in a database of 8000 voice signals. As a result of this
    EGG efficiency for fundamental frequency extraction, [76] employed EGG signals
    to set up a fundamental frequency database derived from running sound. [77] noted
    that EGG was a better predictor of disturbance parameters compared to acoustic
    sound. However, it is appropriate to ensure that in EGG signaling devices such
    as baseline timbres, noise equipment is mitigated. In addition, careful cataloging
    of algorithms for the extraction of fundamental frequencies may be needed if certain
    signal properties, such as cycle-by-cycle disturbances and/or subharmonics, are
    present.


    B. Amplitude of the EGG waveform. Different factors such as larynx heights, electrode
    placement, posture changes, neck size and automatic gain controllers (AGCs) can
    affect the amplitude of the EGG signal. This leads to the incorrect understanding
    of the vocal fold contact operation [46, 70, 78, 79]. Research studies often use
    non-normalized dEGG or EGG parameters for quantitative analysis [80, 81]. The
    importance of the overall amplitude of the unfiltered EGG signal was discussed
    in [82] where signal elements below the vibration level of the vocal fold could,
    in theory, be used to track this function of the vocal fold alteration, that is,
    systemic changes of the general amplitude may occur in the signal acquired without
    the AGC. Perhaps because the potential factors actually influence the overall
    amplitude of the EGG waveform mentioned above, the scientific hypothesis between
    the vocal fold (pre-)phonation (pre-)phonoid laryngeal configurations and any
    possible structural consequences for the EGG amplitude is not currently provided
    with strong empirical support (e.g., the laryngeal endoscopy). It is therefore
    important to distinguish between low-frequency alterations under the vibration
    rate of the vocal fold and in-cycle variations of the VFCA in the ‘amplitude’
    of the EGG signal.


