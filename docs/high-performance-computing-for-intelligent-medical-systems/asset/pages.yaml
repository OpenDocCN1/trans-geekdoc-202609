    # 8.10 Results and discussion


    The chapter discusses the few BMAs which are inspired and based on the concept
    of natural phenomenon, and they are found to be efficient in the field of ME also.
    There are many more Nature-inspired SC techniques used for block matching that
    could not be explained in the chapter such as: Four-step GA-BMA (4SGA), Genetic
    Rhombus pattern Search (GRPS), Memetic PSO-BMA, Clonal PSO-BMA, Efficient Fuzzy
    Search (EFS), Momentum-directed GRPS (MD-GRPS), Pattern-Based PSO-BMA, Mutation
    and simplex integrated PSO-BMA, Simulated Annealing-BMA, etc. The available research
    studies have proven that the rigidity of regular BMAs for the ME process is addressed
    very effectively by the SC techniques used for ME. The problem of local optimum
    and the fixed pattern search is dealt with in all these algorithms by using the
    concept of dynamic initial velocity, random locations, early detection, mutation,
    cross-over, and many such biological events.


    The various SC techniques that have been used as BMA for ME are surveyed and many
    of them are implemented on many video sequences. The results reported in other
    research studies and results obtained in the experiments are listed in table 8.1.
    The average search points that are required to check for the best match and the
    average PSNR values are shown in the said table. The overall results and performance
    show that the application of SC techniques greatly enhances the process of ME
    and these will speed up the video compression process.'
