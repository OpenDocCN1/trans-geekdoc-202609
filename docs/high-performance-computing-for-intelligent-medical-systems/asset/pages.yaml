    # 1.2.3 Feature extraction


    In this chapter, features are extracted from the subbands of decomposed ECG signal
    using the FAWT method.


    Eight features are extracted from sub bands which are represented as [45]:


    +   1. **Variance (VAR):** Variance is defined as the expectation of the squared
    deviation from its mean. It can be given as,


    \(VAR = \frac{1}{N - 1} \sum_{i=1}^N (x_i - \mu)^2\) (1.6)


    +   2. **Integrated ECG (IECG):** It is used in the onset detection index in the
    sub band and the sum of absolute value of these sub bands is defined as \(IECG\),
    it can be expressed as,


    \(IECG = \sum_{i=1}^N |x_i|\) (1.7)


    +   3. **Mean absolute value (MAV):** It is an average of absolute value of a
    subband and it can be computed as,


    \(MAV = \frac{1}{N} \sum_{i=1}^N |x_i|\) (1.8)


    +   4. **Mean (\(\mu\)):** It is an average value of a subband extracted from
    FAWT, it can be expressed as,


    \(\mu = \frac{1}{N} \sum_{i=1}^N x_i\) (1.9)


