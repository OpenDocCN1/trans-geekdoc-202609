- pgno: 44
  md: '**Specificity:** Specificity belongs to negative class, and it is defined as
    the percentage of the correctly identified actual negative events. It can expressed
    as,

    SPE(%) = TN / (TP + FP) × 100%

    (1.16)


    **Negative predicted value:** It is defined as the ratio of the total number of
    real negative events to the total number of negative events. It can be computed
    as

    NPV(%) = TN / (TN + FN) × 100%

    (1.17)


    **False negative rate:** It is defined as when an actual is positive and how often
    the classifier predicted negative. It can be computed as

    FNR(%) = FN / (TP + FN) × 100%

    (1.18)


    **False positive rate:** It is defined as when an actual event is negative and
    how often the classifier predicted positive. It can be given as

    FPR(%) = FP / (FP + TN) × 100%

    (1.19)


    True positive (TP): It is the number of correctly identified HPT subjects by the
    proposed model.

    False positive (FP): It is the number of normal samples classified incorrectly
    by the proposed model.

    False negative (FN): It is the number of incorrectly identified HPT subjects by
    the proposed model.

    True negative (TN): It is the number of correctly identified normal subject by
    the proposed model.


    # 1.3 Results


    This methodology uses the FAWT and different classification techniques to distinguish
    between HPT patients and normal patients. There are a total of 139 subjects present,
    out of which 122 belong to normal class and 17 belong to HPT class, each signal
    is reshaped into the size of 15 360 samples, there are a total of 65 chunks of
    each signal, each chunk is given as an input to the FAWT. The FAWT is tuned with
    the following values of parameters, J = 7, sampling parameters s1 = 275, s2 =
    279, s3 = 1, s4 = 10, which are kept the same for both normal and HPT classes.
    All these parameters are selected empirically. Various statistical features are
    evaluated from detailed coefficient and highly distinguishable features are selected
    by applying the KW test. The KW test is a ranked based nonparametric investigation
    of variance. It is used to identify the difference between two or more groups
    of independent variables on a continuous dependent variable. A feature is considered
    significant if the probability of chi is less than 0.05. Tables 1.1–1.3 represent
    the KW test results for'
