    # 13.3.1 Classical controller in a biomedical system


    Feedback controllers are generally used in industry as well as in the biomedical
    field, known as PID. Elmer Sperry invented the first PID controller in 1911. PID
    has fast transient response and the ability to conquer steady state error. It
    has a quick momentary reaction and a lot of energy to beat steady state error.
    The PID has three controlling parameters: first is ‘P’ that depends on present
    change in the error; the second is ‘I’ that depends on past error; third is ‘D’
    that depends on future error. By adjusting these three parameters, researchers
    get the desired system outcome, as shown in table 13.3, according to need [63].


    Error is the variation among the output (process variable) and the input (set
    point) of the controller. A PID controller uses a feedback phenomenon which can
    overcome the problem of error by adjusting the three parameters, i.e. P, I and
    D, as shown in figure 13.2 and in equation (13.1), according to system requirement.


