    The evaluation matrices used for finding the best match are:


    +   i. Sum of absolute difference (SAD)

    +   ii. Mean square error (MSE)

    +   iii. Sum of absolute difference (MAD)

    +   iv. Vector matching criteria (VMC)

    +   v. Total absolute difference from mean (TADM)


    # 8.5 What is soft computing: techniques and differences


    Computation is a method of transforming the data of one type to another anticipated
    form using specific controls that are applied. According to computation, the antecedent
    is called the input, and the consequent is called the output. A mapping function
    is used to transform the prescribed input into an acceptable output. Computing
    is primarily applicable to the field of engineering. There exist two kinds of
    information processing: hard computing, and soft computing (SC). Some problems
    are solved by using existing mathematical algorithms which are programmed through
    hard computing which results in precise output value. Numerical problems are a
    clear example of hard computing.


    Professor Zadeh defined SC as [1]: ‘SC is not a single methodology. Rather, it
    is a partnership in which each of the partners contributes a distinct methodology
    for addressing problems in its domain. In this perspective, the principal constituent
    methodologies in SC are complementary rather than competitive. Furthermore, soft
    computing may be viewed as a foundation component for the emerging field of conceptual
    intelligence. The principal partners at this juncture are fuzzy logic (FL), neuro-computing
    (NC), and probabilistic (PR), with the latter subsuming genetic algorithms, chaotic
    systems, belief networks, and parts of learning theory’.


    The following are the characteristics of soft computing.


    +   • Problems can be solved without any proper mathematical modeling.'
