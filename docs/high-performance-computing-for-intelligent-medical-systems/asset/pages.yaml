    # G. Wavelet transform and analysis.


    By integrating continuous wave transforms (CWTs), the problem of resolution faced
    by the STFT has been mitigated. However, the CWT analysis is carried out in the
    same way as the STFT with the signal multiplied by a function as the window function
    used in the STFT. The transformation is calculated in a piecewise manner with
    different segments of the time-domain signal. However, there are two significant
    variations between CWT and STFT. The first thing that is not taken into account
    is the Fourier transformation of the window signals, so the single peak that corresponds
    to the sinusoid is noticed. Simply put, the negative frequencies are not calculated.
    Second, when the CWT of all spectral components is measured, the length of the
    window appears to vary. This is the most critical aspect of the transformation
    of the wavelet. The transformation of wavelets is a very important and widely
    used concept in the field of voice pathology. The following is therefore a mathematical
    illustration of its context principles.


    The standard form of a CWT is


    ```

    CWT_x^ψ(τ, s) = ψ_x^ψ(τ, s) = \frac{1}{\sqrt{|s|}} \int x(t)ψ^*\left(\frac{t -
    τ}{s}\right)dt

    ```


    The function is a mother wavelet, which is often referred to as a transformation
    function. Finally, the signal obtained is due to the induction of two essential
    parameters, namely translation (τ) and scaling (s) parameters. Wavelet means small
    waves originating from the main feature known as the mother wavelet. The wavelets
    are deduced using a finite length window function, whereas the word wave refers
    to the oscillatory aspect of the function. More simply, the windowed functions
    or segments of the signal are formed from the mother wavelet [92]. High-frequency
    and time–frequency attributes correlated with pathological speech are also measured
    using CWT. Integer time and scale values are used to index the actual valued CWT
    coefficients [93].


    # 3.4.2 Voice pathology analysis and detection techniques


    Machine learning is an essential factor that classifies a speech signal as regular
    or as part of a particular voice pathology. It uses a range of acoustic and speech
    features, such as those listed in section 3.4.1, to teach computers how different
    pathologies look. Over the last decade, various ML and deep learning classifiers
    have been used'
