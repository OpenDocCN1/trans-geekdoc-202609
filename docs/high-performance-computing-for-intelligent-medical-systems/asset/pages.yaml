    # 9.4.3 Random forest


    RF is a uniform split test predictor for a medical dataset. Random tree judges
    the next and best split of a tree in the selected variables (figure 9.5). RF (TD:
    Training Data; DT : Decision Tree) compares irrelevant and correlated variables
    [15].


    # 9.4.4 Extra tree


    Extra tree has two different keys compare to random tree:


    +   - split tree without replacement;

    +   - nodes split are not best splits;

    +   - it is used for averaging improved accuracy in prediction;

    +   - It also controls the over-fitting [16].'
