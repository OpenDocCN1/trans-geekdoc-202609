    filtering to eliminate impulsive noise. Adaptive median filters [26] can also
    be used for noise reduction, which replaces the pixel value with the local neighborhood’s
    weighted median. Still, it has some demerits; image smoothing also removes some
    sufficient detail in the image [27]. There is another possibility of wrong diagnosis
    due to blood vessels, and tissues.


    The contrast enhancement method increases the contrast of the image over a threshold
    [28] but it has some drawbacks, like it may cause some regions to be under enhanced
    or over enhanced, which may result in information loss [29]. Pixel modification
    may also be used for contrast enhancement [30, 31]. This can be'
