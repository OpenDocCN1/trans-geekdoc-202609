  md: '# 13.3 Analysis of the biomedical system


    Biomedical engineering (BME) is the well-known branch of engineering which is
    the combination of engineering ethics and methods used in the medicinal area.
    To improve the patient’s health and life quality, it is necessary to use the engineer’s
    skill with medicinal and natural discipline. Only conventional instruments were
    used previously, for disease identification and monitoring. There are numerous
    biomedical systems developed with new technology that modernize the health care
    system. Nowadays, hospice and health care centers use a variety of advanced and
    stylish instruments due to of technological improvement [61].


    An apparatus that is used for a particular job is called an instrument. Most commonly
    used instruments are [62]:


    +   1. Diagnostic instruments (DI): ECG (Electrocardiogram), EEG (Electroencephalogram);

    +   2. Imaging instruments (II): e.g., MRI, CT Scan;

    +   3. Therapeutic instruments (TI): e.g., Pace-makers (PMs).


    ECG: It is used to measure the electrical signal generated by the heart muscles
    in cardiac functioning. It was invented by Wilhelm Einthoven. Electrocardiography
    is a technique to sense the electrical waveform generated by the heart. It is
    a specific arrangement of sensor (electrodes) in which two sensors are placed
    to receive the electric signals and another is for reference purposes. The electrical
    signals are of few millivolts, so they need to be amplified. After the proper
    conditioning of received signal they are ready to be saved or to display on screen.
    The ECG is an instrument which is used to measure the cardiac waveform to be stored,
    to display on screen or to print on paper. It indicates the functioning and condition
    of the heart, like heart beat cardiac output and myocardium etc. It gives information
    about the rate and rhythm of the heart and the condition of the heart muscles.
    Some diseases of the heart can be identified by it such as: heart attack, arrhythmia,
    cardiovascular etc.


    EEG: A device that is used to measure the minute impulsive electrical movements
    of the brain by means of metal disc sensors positioned around the head. The technique
    of graphical representation of electrical waveforms generated by the brain is
    known as electroencephalography. ‘Brain death’ can be diagnosed with the help
    of EEG.


    Imaging instruments (II): These are used to diagnose disease or any disorder of
    an organ in the very early phase, while the general or common diagnostic methods
    are not able to detect the same.


    Magnetic resonance imaging: MRI gives images for organs or tissues of any layer
    of the body. This instrument was designed by Raymond Damadian and Bloch and Purcell.
    A computed tomography (CT) scan is a form of x-ray that is more advanced than
    a traditional x-ray. CT scan is an illustration technique which combines a computer
    to visualize the internals of the body with higher definition. A rotary arrangement
    of x-ray source and detector are used to imaging the body in a 360 angle.


    Ultrasonography (USG): This works on the principle of Doppler effect in which
    a sound source with sound detectors is used to get an image of the internal body.
    The sound waves reflect from the internal organs are received by the detector
    to generate the two-dimensional image on the computer screen.'
