  md: 'b. Laying of eggs by Cuckoos:

    Levy flight method given by equation (8.5) is used by the Cuckoo to generate

    a new solution S_new from the current solution S.


    ```

    S_{new} = S + \alpha \oplus Levy(\lambda) \quad (8.5)

    ```


    where step size = \alpha > 0, \oplus = entry-wise multiplication Levy(\lambda)
    produces a

    random walk where exploration is controlled by Levy distribution and

    exploitation of search space is determined by producing step length randomly

    in the range 1 < \lambda \leqslant 3.


    c. New generation selection

    The host bird replaces the host eggs with cuckoo eggs to denote the updating

    of the old solution with better solutions. If the better cuckoo egg is found,
    it

    will signify the worst solution which will be neglected by the host bird and

    the bird will build a new host. This process of building a new host represents

    the production of the new solution. The host bird finds the cuckoo eggs with

    a probability of \rho_a which plays a major role in search space by denoting both

    local and global search, that is, \rho_a = 0.25 corresponds to 25% exploitation

    and 75% denotes exploration.


    # Steps of CS-BMA


    +   1. Initialize the parameters: \rho_a = 0.25, D = 2 dimension, P = 8, Max_generation
    = 4,

    +   generation = 1, MB size = 16 x 16.

    +   2. First population NP = 5 where search space is (2P + 1) x (2P + 1).

    +   3. Calculate MAD between the candidate MB and the MBs in the reference frame,
    Bi such that

    +   i \in 1 to NP.

    +   4. While (generations<Max_generation) do

    +   5. The new population of size NP, using Levy flight method V_i is generated
    which uses equation

    +   (8.5).

    +   6. By using the fitness approximation approach, MAD is calculated for each
    V_i by and check the

    +   following For i = 1 to NP = 5

    +   error measure for least value is checked

    +   i.e. if MAD(V_i) < MAD (B_i)

    +   Bi=Vi

    +   end if

    +   end for

    +   7. \rho_a a fraction of the worst solution is swapped with modified solutions
    obtained by using

    +   randomly selected walks.

    +   8. Generation is incremented by 1.

    +   9. end while

    +   10. The lowest value of MAD corresponding to some position in search space
    is selected for MV

    +   calculation.

    +   11. end.'
