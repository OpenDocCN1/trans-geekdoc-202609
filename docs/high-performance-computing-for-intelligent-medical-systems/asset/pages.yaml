  md: '# 10.5.4 Mean


    Mean gives an average gray level to get an idea about intensity profile [37].
    It can be expressed as


    \(\mu = \frac{1}{n} \sum_{i=0}^{n-1} g_i\) (10.31)


    where ‘n’ is number of signals.


    # 10.5.5 Variance


    Histogram width is the measure of the amount of grey level in an image [37]. Variance
    measures the deviation of that gray level from the mean value. It can be given
    as


    \(\sigma^2 = \frac{1}{n} \sum_{i=0}^{n-1} (g_i - \mu)^2\) (10.32)


    # 10.6 Results and discussion


    There are many reasons for an image to be noisy, like imperfect instruments, wrong
    image acquisition steps, power line interference, patient discomfort, image transmission,
    compression, etc. It is required to denoise the image before image data analysis.
    In medical imaging, signal backscattered from the background soft tissue causes
    speckle noise that affects image quality, making diagnosis more difficult, so
    it becomes imperative to remove the noise to improve tissue structures and image
    quality. Another noise that affects the image quality is Gaussian noise. The cause
    of Gaussian noise is low sensor illumination, temperature, and electronic interference
    during transmission due to poor sensor connection. Impulse noise (salt and pepper)
    is another form of noise that affects an image’s diagnosis accuracy. It occurs
    due to the sharp disturbance in an image because of a defect of the camera sensor,
    system software, or hardware failure during image acquisition and data transmission.
    In this chapter, our focus is to filter these noises from the affected mammogram
    images. Here, we have used different filtering techniques like average filtering,
    median filtering, Gaussian filtering, Butterworth, second-level wavelet decomposition,
    and CNN to remove noises. Analysis of these filtering techniques is based on some
    performance measures such as MSE, PSNR, SNR, mean, and variance to validate the
    efficiency.


