    The second feature extractor is TP. TP uses nine sized non-overlapping windows
    and ternary functions to extract features. The main problem of TP is to set threshold
    value. To adjust an automatic threshold value, standard deviation is used in this
    chapter. The definition of the automatic threshold calculation strategy is given
    in equations (2.8)-(2.10).


    $thr = h \times SD(\text{signal}), h = \{0.1, 0.2, ..., 1\} \quad (2.8)$


    $SD(\text{signal}) = \frac{1}{n-1} \sqrt{\sum_{i=1}^n (\text{signal}_i - \overline{\text{signal}})^2}
    \quad (2.9)$


    $\overline{\text{signal}} = \frac{\sum_{i=1}^n \text{signal}_i}{n} \quad (2.10)$


    where $\overline{\text{signal}}$ is mean of the signal, $SD(.)$ is function of
    the standard deviation, thr represents threshold value and $h$ is multiplier.
    The pseudo code of the 1D-TP is shown in Algorithm 2.1


    # Algorithm 2.1: Pseudo code of the 1D-TP


    ```

    Input: Signal (S) with size L, threshold value (t)

