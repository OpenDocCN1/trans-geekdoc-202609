  md: '# 2.4.1 Pre-processing


    The steps of the pre-processing phase are presented below.


    +   Step 1: Concatenate channel-1 and channel-2 sEMG signals.


    $S^C = S^1 | S^2$ (2.2)


    where $S^C, S^1$ and $S^2$ are first channel, second channel and concatenated
    signals, respectively. | is concatenation operator.


    To prevent memorization and show success of the proposed SN, sEMG signals recorded
    from channel-1 and channel-2 are concatenated. By using this strategy, 30 samples
    are obtained for each hand movement. In the literature, many methods have used
    this strategy.


    +   Step 2: Apply DCT to concatenated signal to obtain transform coefficients.


    $C = DCT(S^C)$ (2.3)


    where $C$ is DCT coefficient of the signal and DCT(.) is function of the discrete
    cosine transform.


    +   Step 3: Apply FFT to concatenated signal to obtain transform coefficients.


    $[IR] = FFT(S^C)$ (2.4)


    $S^F = I^2 + R^2$ (2.5)


    where $I, R$ and $S^F$ are imaginary, real and Fourier signals, respectively.
    FFT(.) generates imaginary and real signals.


    After this phase, a total of five signals are constructed, and these are $S^C,
    C, I, R$ and $S^F$.


    # 2.4.2 Feature extraction


    In this phase, SVD and TP are employed as feature extractors. These extractors
    are applied to the generated five signals. The steps of the SVD-based feature
    extraction process are presented below.


    +   Step 1: The input signals are shaped into two-dimensional signals. For instance,
    the length of the used signals in this study are 6000. We reshaped them into $60
    \times 100$. This step is called a vector-to-matrix transformation.


    +   Step 2: The obtained matrix is divided into $15 \times 25$ sized non-overlapping
    blocks.


    +   Step 3: SVD is applied onto each $15 \times 25$ sized block.


    $[USV] = SVD(block)$ (2.6)


    where $U, S, V$ are components of the SVD and SVD(.) is singular value decomposition
    function.


    +   Step 4: Store maximum singular value as a feature.


    $feat^S_L(i) = max(S), i = \{1, 2, ... , 16\},$


    $L = \{S^C, C, I, R, S^F\}$ (2.7)'
