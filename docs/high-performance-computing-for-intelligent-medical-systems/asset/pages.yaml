    secondary H-BP occurs due to some other medical issues or medication. One may
    eliminate it by proper treatment or by stopping the medication that causes it.
    H-BP affects the heart function and that of other organs like the kidney. If H-BP
    stays for a long time, it may cause heart and kidney failure. For H-BP cure, it
