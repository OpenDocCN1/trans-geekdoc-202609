- pgno: 138
  md: '# 5.2.5 Machine learning methods


    There are usually two COVID-19 data mining research questions answered in the
    literature, including COVID-19 diagnosis and prognosis. Some examples are provided,
    and the critical issues are then discussed.


    Cai et al [35] investigated the application of CT scans for the prediction of
    clinical outcomes and assessment of disease severity. 99 COVID-19 patients underwent
    physical examination, chest CT, routine blood test, and arterial blood gas tests
    on admission (figure 5.1). The clinical data, such as the treatment, outcomes,
    and disease severity, were collected. Random forest (RF) models were used to investigate
    CT quantification’s validity (moderate, severe, and critical). The length of ICU
    stays, oxygen inhalation, and hospitalization was also assessed. Prediction of
    ICU partial versus prolonged recovery showed an AUC of 0.960.


    The allocation of resources and focusing on the attention on high-risk patients
    is a struggling task for physicians. Implementing machine learning algorithms
    could support physicians in predicting high-risk individuals. Subudhi et al [41]
    developed prognostic ML methods based on electronic health records (figure 5.2).
    The developed model was validated by the hold-out method (20%). The accuracy of
    the developed model was 90%. The most important features included lymphocyte,
    high-sensitivity C-reactive protein (hs-CRP), and lactate dehydrogenase (LDH).


    Zoabi et al [59] used a gradient-boosting machine model built with a decision-tree
    to predict COVID-19. The training set included 51 831 subjects (9% positive COVID-19),
    while the test set was 47 401 subjects (9% positive COVID-19) from the subsequent
    weeks. The dichotomous input features were age ≥60 years, gender, contact with
    an infected subject, cough, fever, sore throat, shortness of breath, and headache.
    The feature importance was provided in figure 5.3. The proposed model''s performance
    on the prospective test set was assessed as follows: AUC = 0.90 [CI 95%: 0.892–0.905],
    sensitivity = 87.30%, and specificity = 71.98%. It is one example in which various
    performance indices were reported, and external validation was used. Moreover,
    the dataset was not balanced. Thus, the performance of the developed system could
    be extended to the population. This critical issue is discussed later in this
    chapter.


    ![](img/75406d5bb714dfd3e68fbbc717bd8f67_138_0.png)


    Figure 5.1. The flow chart of the study to assess COVID-19 prognosis and disease
    severity (reproduced from [35], copyright (2020) with permission from Elsevier).'
  merge: -1
  img_proc: true
