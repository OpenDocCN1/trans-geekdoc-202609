- pgno: 107
  md: '# Chapter 4


    # Deep learning for cuffless blood pressure monitoring


    Jamal Esmaelpoor, Zahra Momayez Sanat and Mohammad Hassan Moradi


    There is a great motivation to use easy-access bio-signals to alleviate the difficulties
    and shortcomings of present invasive and cuff-based blood pressure monitoring
    techniques. Many studies propose methods mainly using photoplethysmogram and electrocardiogram
    signals. Most of these methods are based on hand-crafted features. Although they
    take advantage of our previous knowledge, it is highly desirable to propose models
    that are less dependent on feature engineering.


    To this aim, in this chapter, we develop several architectures based on deep neural
    networks. Through discussing their advantages and drawbacks, we try to develop
    more appropriate models to meet the demands of the British Hypertension Society
    and the Association for the Advancement of Medical Instrumentation standards.
    The building blocks of our models are convolutional neural networks and long short-term
    memories. We evaluate our models on 200 subjects.


    # 4.1 Introduction


    Cardiovascular problems are responsible for the death of almost 50% of all people
    who die because of non-communicable diseases. Therefore, since blood pressure
    (BP) is among the most vital physiological indicators that reflect the cardiovascular
    situation, its continuous measurement is very crucial. It can be a true indicator
    of many health issues, such as hypertension, heart attack, asthma, and kidney
    failure [1].


    Several methods are available for BP monitoring. The most prevalent techniques
    are intra-arterial catheter insertion, auscultation, oscillometry, and volume
    clamping.


    The intra-arterial catheter insertion approach requires the insertion of a catheter
    in a vessel. The method makes accurate and continuous BP reading possible. It
    was first practiced by Hales et al by inserting tubes into some animal vessels
    in 1733.'
  merge: -1
  img_proc: true
- pgno: 108
  md: 'However, Cushing performed the first invasive method based on the catheter
    insertion in a surgery room in 1901. In spite of the high accuracy of the method,
    due to its invasive nature and the difficulties it creates for patients, its application
    is limited to hospital environments, under the close supervision of experts, and
    merely for patients who are in critical conditions [2].


    Auscultation is an indirect method to measure BP. In this method, a cuff is closed
    around the brachial artery on the upper arm, then using a mercury sphygmomanometer
    the pressure in the cuff becomes measurable. Then a stethoscope is employed to
    make some sounds in the squeezed artery audible [3].


    Oscillometry is another cuff-based method. The measurement is based on the oscillation
    in the inflatable cuff during the deflation. The oscillation starts even when
    the BP is above the systolic BP and resumes under the diastolic pressure [4].


    Cuff-based methods are straightforward and involve pretty simple procedures. However,
    if the patient is obliged to do them frequently, they cause discomfort. Moreover,
    different interpretations of important events in these methods might cause significant
    variability and low accuracy.


    Volume clamping is a non-invasive and continuous BP monitoring technique. It considers
    the dynamic vascular unloading of the arterial walls of the finger vessels. The
    method uses a finger cuff and a photoplethysmographic sensor in a feedback control
    loop to keep the blood flow constant. In this condition, the applied cuff pressure
    though the same value as the BP [2].


    Even though volume clamping methods provide a non-invasive and continuous reading
    of BP, they are most of the time too expensive and complex to use. Therefore,
    there is a lot of motivation to use easy-access bio-signals like photoplethysmogram
    (PPG) and electrocardiogram (ECG) to measure BP continuously, non-invasively,
    and conveniently. In this chapter, we aim to explore the potential of deep neural
    networks (DNN) to achieve this goal.


    This chapter is organized as follows. In section 4.1, we reviewed the available
    BP monitoring methods briefly. Section 4.2 provides a physiological model for
    BP. Section 4.3 discusses the data used in this chapter, and the preprocessing
    steps applied to them. Section 4.4 presents four different DNN architectures and
    their results. Section 4.5 discusses the models’ performances, and finally, section
    4.6 concludes the chapter.


    # 4.2 Physiological models


    Photoplethysmography is an optical approach to indicate blood volume fluctuations
    caused by the pressure pulse in the peripheral circulation arteries. This measurement
    is carried out by illuminating the skin using a light-emitting diode and detecting
    the reflected or transmitted light by a photodetector [5]. Electrocardiography,
    however, is a method to detect electrical excitations of the heart. It is detected
    by placing some electrodes on the prespecified places of the body [6]. Consequently,
    both PPG and ECG signals contain crucial information related to the cardiovascular
    system and its BP.'
  merge: -1
  img_proc: true
- pgno: 109
  md: 'The time delay for the pressure pulse to travel through vessels is known as
    pulse transit time (PTT). PTT equals the time delay between the proximal and distal
    arterial pressure pulses and is inversely correlated with the BP value [7].


    In this section, we consider a simple model for pressure wave propagation to define
    the relationship between PTT and BP. An arterial vessel is depicted as a flexible
    and cylindrical tube in figure 4.1. If we neglect viscosity, the resistance against
    blood current will be negligible. Compliance (C) that is defined as the ratio
    between cross-section area variations and pressure changes is defined as follows:


    $$C = \frac{dA}{dP} = \frac{2\pi r^3}{E \times h} \tag{4.1}$$


    where r is the radial, and h is the wall thickness. Elasticity is not unique and
    depends on P, as described in equation (4.2).


    $$E(P) = E_0 \times e^{\alpha P} \tag{4.2}$$


    Parameters $E_0$ and $\alpha$ are positive and subject-specific. If we assume
    that A is constant, the mass and momentum conservation rule results in the following
    equations.


    $$\frac{d(A dx)}{dt} + Q(x) - Q(x + dx) = 0 \rightarrow \frac{\partial Q}{\partial
    x} + C(P) \times \frac{\partial P}{\partial t} = 0 \tag{4.3}$$


    $$A \times [P(x) - P(x + dx)] = \rho \times dx \frac{dQ}{dt} \rightarrow \frac{\partial
    P}{\partial x} + L \times \frac{\partial Q}{\partial t} = 0 \tag{4.4}$$


    Here, x and t are space and time, Q is the volume flow rate, $\rho$ indicates
    blood density, and constant $L = \rho/A$ equals arterial inertance per unit of
    length. Moreover, C is inversely related to P. The relationship between C and
    P in central arteries is:


    $$C(P) = \frac{A_m}{\pi P_1 \left[ 1 + \left( \frac{P - P_0}{P_1} \right)^2 \right]}
    \tag{4.5}$$


    here, $A_m, P_0$, and $P_1$ are subject-specified. Equations (4.3) and (4.4) indicate
    the following form for the pressure pulse in vessels:


    $$P(x, t) = f\left( \frac{x \pm t}{\sqrt{LC(P)}} \right) \tag{4.6}$$


    ![](img/75406d5bb714dfd3e68fbbc717bd8f67_109_0.png)


    Figure 4.1. Wave propagation in central arteries.'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'It reveals that the velocity of the pulse in a vessel which is known as *pulse
    wave velocity* (PWV) equals \([L \times C(P)]^{-1/2}\). Therefore, the time for
    the wave to pass a length of \(l\) (PTT) is:


    PTT = \(l\sqrt{LC(P)}\) (4.7)


    According to equation (4.7), PTT depends on BP inversely. If we assume that C
    is constant, the PWV becomes:


    PWV = \(\frac{1}{\sqrt{L \times C}} = \sqrt{\frac{A dP}{\rho d A}} = \sqrt{\frac{Eh}{2
    \rho r}}\) (4.8)


    This equation is known as the Bramwell–Hill and Moens–Korteweg equation [7].


    Besides PWV and PTT, many other studies try to define other hand-crafted features
    and find out their relationship with BP [8, 9]. In this study, however, we emphasize
    automatic feature extraction using deep-learning techniques. We believe that similar
    to many other applications, machine-learning abilities can be utilized for finding
    appropriate representations of signals for BP estimation. Afterwards, we develop
    several methods to achieve this goal¹.


    # ## 4.3 Data source


    We use the *Multiparameter Intelligent Monitoring in Intensive Care II* (MIMIC-II)
    database to implement and evaluate our deep models for BP estimation. It encompasses
    high-resolution data of a diverse population of patients in the intensive care
    unit (ICU). The dataset includes clinical documentation, laboratory results, and
    various physiological waveforms [10].


    We consider invasive arterial BP, ECG, and PPG signals of 200 patients (86 women
    and 114 men) in this research. The mean and standard deviation of the subject
    ages are 61.6 ± 14.6 years. The sampling frequency of all waveforms is 125 Hz.


    Systolic and diastolic BPs² in each cardiac cycle are extracted from invasive
    BP waveforms to use them as target values during the training and validation phases
    of the models. All selected records contain 51 884 cycles. Figure 4.2 shows the
    binned-scatter plot and the distribution histogram of the BP. As we expected,
    the figure indicates the direct correlation between systolic and diastolic BP
    [11].


    # ## 4.3.1 Preprocessing procedures


    We apply several filters to remove artifacts from signals and improve their quality.
    Then, PPG signals are segmented to prepare the input data to feed our deep networks.
    For each input segment, systolic and diastolic BPs are extracted from'
