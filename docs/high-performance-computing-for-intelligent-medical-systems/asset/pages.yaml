  md: 'techniques. Various algorithms are designed to remove the background abnormalities
    of the image. Three of the best known methods are histogram specification, histogram
    equalization and grey word normalization.


    There are multiple features that indicate the damage caused due to retinopathy:


    +   1. There is bright appearance of the exudates;

    +   2. Dark appearance of vessels of blood as well as fovea (grey border);

    +   3. Appearance of the optic disk as orange or pink in colour with diameter
    of 1.5 millimetre;

    +   4. Micro-aneurysms are characteristic anatomical features that are dark circle
    shaped regions;

    +   5. Haemorrhages are considered a major hallmark for determining the background
    of retinopathy caused by high glucose level;

    +   6. Appearance of ‘dot and blot’ pattern and the colour is the same as that
    of vessels.


    # 11.5.2 Optical coherence tomography


    The theory behind the working of OCT is to estimate the ‘depth at which a specific
    backscatter arises by calculating its time of flight’. Backscatters arises due
    to the differences in refractive index in transitions from one tissue to another
    tissue. The deeper tissues backscatter can be differentiated from backscatter
    arising in more superficial tissue due to longer time for the light to arrive
    at the sensor. Interferometry is used to measure the differences in ‘time of flight’
    [17]. There are three major OCT theories:


    +   I. Time-domain OCT, also called time-of-flight;

    +   II. Swept-source or time encoded frequency domain OCT;

    +   III. Spectral-domain OCT [18].


    # 11.6 Disease specific analysis of retinal images


    In order to increase the precision of eye patient management, to increase the
    eye clinician productivity and to reduce the cost, the requirement of reliable
    computerized methods or approaches for the retinal image analysis is the need
    of the time.


    # 11.6.1 Early detection of retinal disease from fundus photography


    Retinal disease detection is the most obvious example of a retinal screening application,
    in which the person suffering from eye disease is photographed in a distanced
    teleconsultation. This approach involves the utilization of cheap cameras for
    fundus photography which test the retinal images, and then focus on the preparation
    of the final output. it is considered the best example of telemedicine [19]. The
    preliminary diagnosis of retinopathy in a patient suffering from high blood glucose
    level through this technology is the hot spot nowadays but a screening program
    is available for the diagnosis of hypertension, dementia, disorder of optic nerve
    and various cardiovascular disorders. It has been observed that problems in the
    retinal vision can be prevented by the early diagnosis or detection of diabetic'
  merge: -1
  img_proc: true
- pgno: 267
  md: 'retinopathy [20, 21]. The work can be done successfully by applying the aforementioned
    sophisticated technology.


    # 11.6.2 Early detection of systemic disease from fundus photography


    Apart from the prior diagnosis of diseases of retina, early diagnosis of diseases
    of systemic circulation such as cardiovascular diseases or disorders can also
    be determined using fundus photography. Such determination is based on the calculation
    of retinal vessel characteristics, for heart stroke, hypertension or myocardial
    infarction [22, 23].


    # 11.6.3 3-Dimensional OCT and retinal diseases—image guided therapy


    3D OCT imaging, explains about the retinal morphology which helps in the close
    monitoring of a retinal disease like retinopathy caused due to high blood glucose
    level, glaucoma, tear, optic neuritis etc. The application of image guided treatment
    technology is proved to be beneficial in the treatment of retinopathy, macular
    edema in patient suffering from diabetes where the central part of the retina,
    the macula, is filled with leakage fluid causing visual loss or blindness. According
    to the research, the Early Treatment in Diabetic Retinopathy Study [24-26] shows
    that therapy taken for a diabetic macular edema (DME) with a focal laser, can
    prevent deterioration in the situation. The use of novel anti-vascular endothelial
    growth factor drugs, for example—ranibizumab combined with focal laser depicts
    better results in the treatment of DME. Recently, OCT imaging has shown the extent
    and amount of thickening in the retina, which helps with further treatment.


    Neo-vascularization of the choroid is another form of vision loss category disease
    that has shown good results from image guided therapy. With the introduction of
    the anti-vascular endothelial growth factor agents like ranibizumab and bevacizumab,
    case improvements related to vision have been noticed [28, 29]. 3D representation
    of the optic nerve can be applied for early diagnosis and precise treatment to
    reduce the risk of blindness due to glaucoma [30].


    # 11.7 Fundus image analysis


    The most reliable means of fundus imaging is retinal imaging. Until recently,
    fundus image analysis was the only source of quantitative indices reflecting retinal
    morphological features. Subjects that lend themselves for fundus image analysis
    include: quantification of image quality (verification of image quality; detection,
    imaging of artifact; iatrogenic lesion detection (laser scars, etc); retinal structure’s
    location and segmentation (retinal vessels, vessel diameter; artery and vein classification;
    vessel occlusion detection, fovea, optic disc-cup and rim; cupping); abnormalities
    segmentation (blood vessel related abnormalities/hemorrhages; microaneurysms;
    neovascularizations; nerve fiber infarcts—cottonwool spots); pigment epithelium
    related abnormalities (drusen hyper and hypopigmentation); choroid related abnormalities
    (nevus and melanoma detection; uveitis related choroidal lesions).'
