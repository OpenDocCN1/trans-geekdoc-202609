    # 4.4.4 CNN–LSTM model


    In this subsection, we combine the abilities of CNN networks in finding appropriate
    representations of their inputs with the ability of LSTM networks to memorize
    temporal information to propose a more optimal architecture for BP estimation.


    To achieve these goals, we have designed an end-to-end DNN that includes two stages.
    The lower stage consists of convolutional layers to extract appropriate morphological
    indicators from PPG segments. The hidden layers in the upper stage, however, use
    LSTM units to grasp the time-domain variations of the features extracted by the
    CNN layers.


    +   **Proposed end-to-end CNN–LSTM model:** figure 4.10 depicts the proposed end-to-end
    DNN architecture. It includes two hierarchy levels. They are distinguished by
    larger blue rectangles in the figure. The lower hierarchy level is a CNN network
    that deploys four convolutional layers, while the upper hierarchy level encompasses
    a two-layer stacked LSTM network. Both sectors are designed based on the architectures
    discussed in the previous subsections. The CNN layers are responsible for learning
    (or extracting) proper machine-learned features from each segment. The LSTM layers,
    however, will learn the relationship between the segment features of the input
    series.


    Since CNN layers extract features from each PPG segment independently, we need
    to use a folding layer before applying the input series containing PPG segments.
    This layer converts a batch of PPG series to a batch of PPG segments. Besides,
    we should use an unfolding layer to restore the PPG sequence structures after
    sequence folding to apply them to the LSTM layers.


    +   **Performance:** table 4.4 provides the numerical metrics to evaluate the
    performance of the end-to-end CNN–LSTM network. If we compare table 4.4'
