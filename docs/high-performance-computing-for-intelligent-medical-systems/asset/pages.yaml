  md: '# 11.7.4 Choroidal melanoma detection using retinal imaging


    This melanoma of the eye can be detected on recognising its characteristic feature
    of orange coloured pigment on the surface of the tumour; the tumour is touched
    within the optic disc up to three millimetres.


    # 11.7.5 Advantages of retinal imaging


    +   1. Retina image template file size is small, therefore, the time consumed
    in the process is very small and can be saved for future use.

    +   2. It is a painless and safe technique.

    +   3. It is superior to overdilation because overdilation allows the doctor to
    see only 16% of the eye, while in retinal imaging this percentage is 80%.

    +   4. There is no temporary light sensitivity or blurring of eye vision.


    # 11.8 Comparative analysis between various retinal imaging methods


    In the field of ophthalmology, eye examination was initially done with indirect
    operating ophthalmoscopy, direct operating ophthalmoscopy, then by slit lamps
    involving various lenses, through angiography technique of fluorescein, photography
    of fundus, 3D photography, laser techniques and OCT to novel techniques of multimodal
    imaging. Photography of the retina based on film is now no longer in use so we
    can say that the conventional system has been overtaken by a digital system. In
    telemedicine mode various cameras of different resolution are used, many non-mydriatic
    cameras are now used. The assessment of high blood pressure, various types of
    cancers and bacterial infection can be done with colour fundus photography of
    the retina, providing the correct scenario of health of eye.


    The technique of fundus autofluorescence is useful for detecting the physiological
    changes that happened in the retina during autofluorescence. Angiography technique
    is now commonly used where there is I.V. injection of dye which is fluorescent
    in Nature. OCT due to its high resolution and low coherence is widely used for
    obtaining the cross-sectional ocular tissues photos. Fast scanning and repeatability
    of calculations makes it a front runner of the race. OCT angiography is the novel
    technique of eye retinal imaging based on motion contrast, which does not require
    dye injection and is much preferred. Many research projects are being started
    using the novel concepts of multimodal imaging providing high speed and fine resolution
    imaging with increased illumination penetration.


    # 11.9 Conclusion


    Retina imaging helps in the diagnosis of proper eye disease along with complication
    of diabetes retinopathy, hypertension, myocardial infarction etc. Retina analysis
    is a non-intrusive diagnosis technology. Through the use of image processing techniques,
    the various eye diseases can be detected at a very early age of their initiation.
    Rapid development in techniques of retinal imaging focus on enhanced resolution,
    non-invasiveness and rapid speed.'
