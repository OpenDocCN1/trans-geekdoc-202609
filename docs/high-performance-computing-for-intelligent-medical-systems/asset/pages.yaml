- pgno: 303
  md: '# Chapter 13


    # Analysis of AI based PID controller for health care system


    Vandana Dubey, Harsh Goud and Prakash Chandra Sharma


    Ambiguity establishes one of the most difficult features in biomedical and control
    systems which aim to capture the physiology of a patient using mathematical modeling.
    In this chapter, we will elaborate a review of biomedical modeling and controller
    applied in a patient with chronic disease. A chronic disease is one that generally
    persists for three calendar months or longer and can become poorer with time.
    Some of the well-known chronic illnesses are cancer, heart disease, stroke, diabetes,
    and arthritis. Even so, one of the key conflicts to be taken into description
    is the huge intra-patient inconsistency, acknowledged using wide-reaching sensitivity
    examination using a conventional PID (Proportional Integral Derivative) controller
    of the biomedical system. Nowadays stakeholders of the health sector are putting
    emphasis on the point that Artificial Intelligence (AI) is going to gain greater
    importance in handling back-office activities in almost all the biomedical areas.
    To enhance the accuracy and stability of a biomedical system, the name of PID
    controller comes at the top of the list. In this chapter, we will discuss an AI
    based PID controller with various biomedical systems and also analyze how this
    study may be useful to enhance the stable state along with transient outcome of
    the biomedical system. A comparative study of all the primitive and novel control
    strategies for AI based PID controllers regarding the health care system will
    be address in this chapter. This study concludes with the superiority of the controller
    which copes with biomedical instruments effectively.


    # 13.1 Introduction


    Let us recall a famous quote: ‘Prevention is better than cure’. This quote aptly
    applies to the transformation of the health care system in the United States (US).
    Earlier the focus was on treating the illness when it arose, rather than taking
    prior actions to prevent it. There are multiple changes in the processes which
    aim for the'
  merge: -1
  img_proc: true
- pgno: 304
  md: 'betternment of overall health of the patient. When compared to the health expenses
    of other countries, expenditure on health is persistently rising for the residents
    of the US [1–5]. Now the time has come to make a drastic change in this health
    system and use AI forts betternment. AI will help in the automation and proper
    information synthesis of the data of the patients and their family members. One
    thing must be kept in mind is that there should not be any misuse of data collected.
    In accordance with Oxford English Dictionary, AI is the ability of computers or
    additional devices to display or simulate intellectual performance. In accordance
    with Merriam-Webster dictionary, AI is a branch of computer science trading through
    the simulation of intellectual human actions in computers. Now the way we define
    AI has been changed from a collection of human-like abilities of computers to
    something big [6].


    Diabetes, high blood pressure, cancer etc are some of the most common diseases
    today. These are also called non-communicable diseases (NCDs). NCDs are chronic
    in nature and are dependent on genetic, physiological and environmental factors.
    Today about 41 million people die every year due to NCDs and this figure is 71%
    of the total number of deaths every year. The World Health Organization (WHO)
    says this figure will rise to 55 million by 2030, if timely prompt actions are
    not taken. According to a recent report of WHO, one in four Indians has a risk
    of dying from an NCD before they reach the age of 70. The Indian Government, Ministry
    of Health and Family Welfare says that the NCDs'' burden has increased from 30%
    in 1990 to 55% in 2016 and also the proportion of deaths has also increased from
    37% to 61% [7].


    An illness or state which generally survives for three months or longer and can
    grow worse by time is called a chronic disease (CD). CD tends to happen in older
    adults and may generally be handled but not cured. The foremost common categories
    of CD are cancer, heart disease, stroke, diabetes, and arthritis. The US spends
    about $5.3 trillion every year on its health care. Some of the common causes of
    CD are: tobacco use, nutrition deficiency, physical inactivity and alcohol addiction
    [8]. Extra care of the patient is essential for a healthcare center in today''s
    lifestyle. Most of the electronic-healthcare systems have developed very well,
    however, some advanced research is required for the successful outcome from the
    entire health care unit (HCU). To know about a patient''s history, present state
    of health etc, all are the part of an HCU. Nowadays, various controllers are presented
    and executed successfully. But, in the computer-controlled age, there is a chance
    to employ a novel controlling technique, which can comprise a large amount of
    information, beyond that of an ordinary controller. To fullfill the requirement
    of this computer controller era, there is a need to design and analyze a smart
    controller—a classical controller, with the help of AI techniques like genetic,
    neural networks and fuzzy etc, except with non-classical designing techniques,
    to design its parameters. The idea of the intelligent control scheme is unwrapped
    and simply designable. The effect of a conventional PID controller is not attractive
    for the requirements of complex and non-linear systems [9]. However, better results
    can be achieved by using smart PID controllers instead of conventional PID controllers.'
  merge: -1
  img_proc: true
- pgno: 305
  md: 'For controlling and monitoring of biomedical systems, a well-known controller
    is used widely, i.e. a PID Controller, which performs very well in a variety of
    biomedical applications, for example arterial blood pressure (ABP), imtube/control,
    muscular rest in operation, combined slant control in unnaturally activated muscle,
    kidney transplant, glycemia control, control of unconsciousness etc. The wide-ranging
    applications of PID control are in industry and in the biomedical system, because
    it does continuous monitoring which is also essential in these fields. There should
    be a smart examination lab with smart doctor for respective labs. A lot of research
    has been done previously for the aforementioned workings [10–13]. Fast treatment
    and recovery of patients depend on the strong surroundings of the HCU such as
    drinking water, water used in toilets, nursing bed with commode facility. These
    constraints can be fulfilled by using an intelligent PID control system with fuzzy
    based tuning. A PID can be tuned in such a way that it can automatically control
    the input/output flow of supply water for wash out and clean-up purposes [14].


    The Mamdani fuzzy deduction scheme has been investigated to manage a vapor engine
    and container amalgamation using a linguistic set of laws [15, 16]. Fuzzy based
    tuning is used to design PID controllers for several applications [17–19]. In
    [19], a relative comparison displays that fuzzy based tuning is better in comparison
    to Cohen–Coon, trial-error, and Ziegler–Nichols methods. A coupled tank’s level
