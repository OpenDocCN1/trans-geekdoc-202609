    +   a. Initialization of the problem and its parameters.

    +   b. HM initialization.

    +   c. Improvisation of New Harmony vector.


    # *Harmonic Memory (HM) update*


    Some of the parameters, namely HM size (HMS), that is, the number of solution
    vectors present in HM, HM Consideration Rate (HMCR), the pitch adjusting rate
    (PAR), the distance bandwidth (BW), and a total number of iterations denoted by
    no. of improvisations (NI) are to be tuned for better performance.


    This BMA combines the fitness approximation method with HS and overcomes the problem
    of fixed search patterns, better and accurate results are shown by the proposed
    BM when compared with popular BMAs and this balances the number of search point
    locations and the efficiency of coding.


    # **8.9.5 Cat swarm optimization (CSO-BMA)**


    Hadi _et al_ [56] suggested a novel Nature-inspired SC technique for ME called
    Cat Swarm Optimization (CSO-BM). The CSO-BM is an evolutionary technique. Since
    the algorithm doesn’t follow any definite search pattern, the chances of getting
    the global minimum accurately will be more and with a better quality solution.
    The optimization technique mimics the cat’s behavior.


    A cat’s approach can be seen in two phases. The cat is accustomed to observing
    its target very closely while pretending to be at rest, which can be referred
    to and framed as seeking model. The next phase of the cat’s approach is framed
    as a tracing model where the cat goes behind the target. A matching MB is denoted
    by a cat in the search area in reference or current frame. In each iteration the
    position of the cat is modified using CSO strategy till a position with minimum
    cost function, that is, best match is found.


    **CSO Movement = Seeking model + tracing Model.**


    The working procedure of CSO-BM is briefed below and shown in figure 8 9.


    # **Algorithm: Steps of CSO-BM algorithm**


    +   **Step 1:** Nine virtual cat’s locations are taken as initial population,
    that is, 9 MB.

    +   **Step 2:** Cat starts searching for the best MB for each MB in M dimensional
    space in different directions with some initial velocities within the maximum
    limit. A few of the cats are in tracing mode and others are taken as seeking mode
    as per mixture ratio (MR) which shows the joining of seeking mode with tracing
    mode.MR = 20% (tracing mode) and MR = 80% (seeking mode).'
  merge: -1
  img_proc: true
- pgno: 206
  md: '**Step 3:** Cats’ positions are used in fitness function, that is, BDM is computed
    for every cat. The position of the cat with the best solution (xbest) is stored
    in memory, which is the best solution calculated till now.

    **Step 4:** Based on flag value, cats make a move. Let’s say cat, is observing,
    then the seeking model or the tracing mode process is used for cat,

    **Step 5:** Based on MR values of cats, they are selected, and tracing mode is
    applied to them and the remaining cats will be in seeking mode.

    **Step 6:** If the limiting condition is met, end the algorithm and the best cat
    position with the lowest BMD will be selected. Otherwise, steps 3 to 5 are repeated.


    # 8.9.6 CUCKOO search based BMA (CS-BMA)


    The features of Brood Parasitism of cuckoo species and Levy flight that is found
    in some fruit flies and birds are the basis of Cuckoo search which is applied
    in ME optimization and is suggested by Bhattacharjee et al [60]. The important
    concept and steps used here are briefed below.


    +   a. **Nest selection:** Every nest contains an egg and each egg denotes a solution.
    So, a group of eggs, that is, nests are chosen as the initial population.


    ![](img/75406d5bb714dfd3e68fbbc717bd8f67_206_0.png)


    Figure 8.9. Strategy adopted in CSO-BM.'
