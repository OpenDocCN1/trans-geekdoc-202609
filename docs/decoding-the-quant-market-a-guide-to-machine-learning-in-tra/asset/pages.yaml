    # ### Definition and Types of Cryptocurrencies


    A cryptocurrency is a digital or virtual currency that uses cryptography for security
    and operates on a decentralized, peer-to-peer network. It is not issued or controlled
    by a central authority, making it immune to government interference or manipulation.
    Cryptocurrencies can be used for various purposes, including online transactions,
    investment, and as a means of transferring money across borders.


    There are thousands of cryptocurrencies in existence, with new ones being created
    regularly. Some of the most well-known cryptocurrencies include:


    +   **Bitcoin (BTC):** Launched in 2009, Bitcoin is the first and most widely
    recognized cryptocurrency. It was created by an anonymous individual or group
    of individuals using the pseudonym Satoshi Nakamoto (Nakamoto, 2008).


    +   **Ethereum (ETH):** Introduced in 2015, Ethereum is a platform that enables
    the creation of decentralized applications (dApps) and smart contracts using its
    native cryptocurrency, Ether (Wood, 2014).


    +   **Ripple (XRP):** Ripple is both a digital payment protocol and a cryptocurrency
    (XRP) designed to facilitate fast, low-cost cross-border transactions (Schwartz
    et al., 2014).


    +   **Litecoin (LTC):** Launched in 2011, Litecoin is a peer-to-peer cryptocurrency
    that is based on the Bitcoin protocol but with several differences, including
    a faster block generation time and a different hashing algorithm (Lee, 2011).


