- pgno: 112
  md: '# 6 Feature Engineering for Trading


    Feature engineering plays a crucial role in the success of machine learning models,
    particularly in the context of systematic trading. In systematic trading, strategies
    are based on quantitative models that rely on historical data to make informed
    decisions about future price movements. The quality and relevance of the input
    features used in these models can significantly impact their predictive power,
    and consequently, the overall performance of the trading strategy.


    Feature engineering is the process of transforming raw data into meaningful features
    that can be used as input to a machine learning model. This process can involve
    various techniques, such as normalization, scaling, encoding, and aggregation,
    depending on the nature of the data and the problem being addressed. In the context
    of trading, feature engineering might include creating technical indicators, such
    as moving averages or oscillators, extracting sentiment scores from textual data,
    or calculating market-based ratios and growth rates.


    # 6.1 Technical Indicators


