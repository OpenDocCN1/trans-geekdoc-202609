    are directionally inaccurate.


    +   * R-squared (R²): R-squared is a statistical measure that represents the proportion
    of the variance in the dependent variable (e.g., actual returns) that can be explained
    by the independent variable(s) (e.g., predicted returns). It ranges from 0 to
    1, with values closer to 1 indicating that a greater proportion of the variance
    in the dependent variable is explained by the independent variable(s). In the
    context of trading strategies, a higher R-squared value suggests that the model''s
    predictions are better at explaining the observed returns, while a lower R-squared
    value indicates that the predictions have limited explanatory power.


    These additional metrics, the Information Coefficient (IC) and R-squared (R²),
    can be used alongside other quantitative finance and machine learning metrics
    to assess the effectiveness and predictive power of a trading model. By considering
