    - **Minimum order resting times**: Rules requiring orders to remain in the order
    book for a minimum amount of time before they can be canceled or modified, aimed
    at reducing excessive order cancellations and quote stuffing practices.

    - **Transaction fees**: The introduction of fees on certain types of high-frequency
