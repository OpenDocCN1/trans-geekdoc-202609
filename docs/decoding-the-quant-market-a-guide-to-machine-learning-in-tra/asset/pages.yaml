  md: 'Derivatives are financial instruments whose value is derived from the value
    of an underlying asset, such as stocks, bonds, commodities, or currencies. They
    allow market participants to hedge against potential price movements, speculate
    on future price changes, and generate income from their existing investments.
    This section will explore the basics of options and futures trading, two of the
    most common types of derivatives.


    # 2.3.1 Definition and Purpose of Derivatives


    A derivative is a financial contract between two or more parties, the value of
    which depends on the performance of an underlying asset or group of assets. Derivatives
    can be used to hedge risk, speculate on market movements, or generate income.
    They can be traded on exchanges or over-the-counter (OTC) and can be standardized
    or customized contracts.


    Derivatives are used by various market participants, including individual investors,
    institutional investors, corporations, and governments. Their primary purposes
    are:


    +   - **Hedging**: Derivatives can help protect against potential losses from
    adverse price movements in the underlying asset. For example, a farmer can use
    futures contracts to lock in a price for their crop, protecting against the risk
    of falling prices.

    - **Speculation**: Investors can use derivatives to profit from anticipated price
    movements in the underlying asset. For example, an investor may buy a call option
    if they expect the price of a stock to rise, potentially generating a large profit
    with a small initial investment.

    - **Income generation**: Investors can use derivatives to generate income from
    their existing investments. For example, an investor who owns a stock can sell
    a call option on that stock, collecting a premium from the option buyer. If the
    stock price remains below the option''s strike price, the option will not be exercised,
    and the investor keeps the premium as income.


    # 2.3.2 Basics of Options Trading


    An option is a type of derivative contract that gives the buyer the right, but'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'not the obligation, to buy or sell an underlying asset at a specified price
    (the strike price) on or before a specified expiration date. There are two types
    of options: call options and put options.


    # Call and Put Options


    A call option gives the buyer the right to buy the underlying asset at the strike
    price before the expiration date. The buyer pays a premium to the option seller
    for this right. If the price of the underlying asset rises above the strike price,
    the buyer can exercise the option and buy the asset at the lower strike price,
    making a profit. If the price remains below the strike price, the buyer may choose
    not to exercise the option, and their loss is limited to the premium paid.


    A put option gives the buyer the right to sell the underlying asset at strike
    price before the expiration date. The buyer pays a premium to the option seller
    for this right. If the price of the underlying asset falls below the strike price,
    the buyer can exercise the option and sell the asset at the higher strike price,
    making a profit. If the price remains above the strike price, the buyer may choose
    not to exercise the option, and their loss is limited to the premium paid.


    # Option Pricing and Factors Influencing Option Prices


    Option pricing is determined by several factors, including the price of the underlying
    asset, the strike price, the time to expiration, interest rates, dividends, and
    the implied volatility of the underlying asset. The most widely used model for
    pricing options is the Black-Scholes model, which was developed by Fischer Black,
    Myron Scholes, and Robert Merton in 1973 (Black et al., 1973).


    The Black-Scholes model takes into account the following factors:


    +   - Underlying asset price: The price of the underlying asset affects the option’s
    value, as it determines the intrinsic value of the option (the difference between
    the asset price and the strike price for in-the-money options).'
  merge: -1
  img_proc: true
- pgno: 38
  md: '+   * Strike price: The strike price determines the option’s intrinsic value
    and influences the likelihood of the option being exercised.


    +   * Time to expiration: The time remaining until the option expires affects
    the option’s value, as it impacts the likelihood of the option being exercised.
    Options with more time to expiration generally have higher premiums.


    +   * Interest rates: Interest rates can affect the option’s value, as they influence
    the cost of carrying the underlying asset. Higher interest rates tend to increase
    the value of call options and decrease the value of put options.


    +   * Dividends: Expected dividends can impact option prices, as they can reduce
    the value of the underlying asset. Generally, higher expected dividends lower
    call option prices and raise put option prices.


    +   * Implied volatility: Implied volatility is a measure of the market’s expectation
    of the underlying asset’s price movement. Higher implied volatility increases
    the option’s value, as it indicates a higher probability of significant price
    movements, which can lead to larger potential profits for the option buyer.


    # Option Strategies for Hedging, Speculation, and Income Generation


    There are various option strategies that can be employed for different purposes,
    such as hedging, speculation, and income generation. Some common strategies include:


    +   * Covered call: An investor who owns an underlying asset can sell a call option
    on that to generate income. This strategy is considered conservative, as the investor’s
    downside risk is protected by owning the underlying asset.


    +   * Protective put: An investor who owns an underlying asset can buy a put option
    to protect against potential price declines. This strategy acts as an insurance
    policy, limiting the investor’s downside risk.


    +   * Vertical spread: A vertical spread involves buying and selling options of
    the same type (either calls or puts) with the same expiration date but different
    strike prices. This strategy can be used to hedge, speculate, or generate income,
    depending on the specific combination of options used.


