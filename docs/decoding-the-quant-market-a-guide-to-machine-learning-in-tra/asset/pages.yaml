    they implement monetary policy and manage foreign exchange reserves. They can
    also intervene in the market to stabilize or influence exchange rates.


    +   * Commercial banks and financial institutions: These entities trade currencies
    on their own account or on behalf of clients. They facilitate transactions between
    buyers and sellers and provide liquidity to the market.'
