    * USD/JPY (US Dollar/Japanese Yen)

    * GBP/USD (British Pound/US Dollar)

    * USD/CHF (US Dollar/Swiss Franc)

    * AUD/USD (Australian Dollar/US Dollar)

    * USD/CAD (US Dollar/Canadian Dollar)

    * NZD/USD (New Zealand Dollar/US Dollar)


    These major currency pairs are characterized by high liquidity, tight spreads
    (the difference between the bid and ask prices), and relatively low volatility
    compared to other, less liquid currency pairs. The US Dollar is the most widely
    traded currency, followed by the Euro, the Japanese Yen, and the British Pound
    (BIS, 2019).


    # Market Structure and Participants


    The forex market is decentralized and operates through a network of financial
