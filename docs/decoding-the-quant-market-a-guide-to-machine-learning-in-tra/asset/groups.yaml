    # 3.3.4 Estimating Portfolio Return and Risk


    To optimize a portfolio, it is necessary to estimate the expected return and risk
    associated with each asset or strategy in the portfolio. Expected returns can
    be estimated using historical performance data or by making assumptions about
    future performance based on factors such as economic conditions, market trends,
    and company-specific information. Risk can be measured using various metrics,
    such as standard deviation, value at risk (VaR), or drawdowns, as discussed earlier
    in this chapter.


    In addition to estimating the expected return and risk for individual assets,
    it is also important to consider the correlations between the assets, as these
    can have a significant impact on the overall portfolio risk. Assets with low or
    negative correlations can help to reduce the overall portfolio risk, as their
    price movements tend to offset each other.


    # 3.3.5 Methods for Portfolio Optimization


    Several methods can be used to optimize a portfolio, including:


    +   * Mean-variance optimization: Mean-variance optimization is a technique based
    on MPT that seeks to find the optimal portfolio by minimizing the portfolio''s
    variance (i.e., risk) for a given level of expected return or maximizing the expected
    return for a given level of risk. This method requires inputs such as the expected
    return, risk, and correlation matrix for the assets in the portfolio.


    +   * Black-Litterman model: The Black-Litterman model is a portfolio optimization
    method that combines investors'' views on expected returns with market equilibrium
    returns derived from a market benchmark, such as the Capital Asset Pricing Model
    (CAPM). This approach addresses some of the limitations of mean-variance optimization,
    such as sensitivity to input assumptions, and can result in more stable and diversified
    portfolios.'
