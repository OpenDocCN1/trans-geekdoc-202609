    # # 7 Building Machine Learning Models for Trading


    # ## 7.1 Specificities of Building Machine Learning Models for Trading


    Developing machine learning models for trading presents unique challenges and
    specifics that are not typically encountered in other machine learning applications.
    One such peculiarity is the high turnover of machine learning-based predictions,
    which necessitates the implementation of special techniques to control the trade-off
    between the quality of predictions and turnover of the predictions. High prediction
    turnover can lead to increased trading costs and adversely impact the overall
    performance of a trading strategy.


    The high turnover of predictions in machine learning-based trading models can
    be attributed to several factors, including market volatility, noisy financial
    data, and the use of short-term features. As machine learning models attempt to
    adapt to ever-changing market conditions, they often generate frequent trade signals,
    resulting in a high rate of turnover. This can lead to substantial trading costs,
    which can erode the returns generated by the model.


    To address the issue of high turnover and manage the trade-off between the quality
    of predictions and trading costs, it is crucial to consider the following techniques
    and practices when building machine learning models for trading:


    +   * Incorporating transaction costs in model evaluation: To account for the
    impact of trading costs on the overall strategy performance, incorporate transaction
    costs into the model evaluation process. This allows the model to consider the
    cost implications of trade signals, leading to a more accurate assessment of its
    performance.


    +   * Regularization: Implement regularization techniques, such as L1 or L2 regularization,
    to penalize the model for making overly complex'
  - '[PAGE 124]


    predictions that may lead to high turnover. Regularization can help the model
    focus on the most critical features and avoid being swayed by noise in the data.


    +   **Signal filtering**: Introduce filters to control the trade signals generated
    by the model, such as minimum confidence thresholds or limits on the number of
    concurrent positions. These filters can help reduce the number of trades executed,
    mitigating the impact of high turnover on trading costs.


