    various techniques, such as normalization, scaling, encoding, and aggregation,
    depending on the nature of the data and the problem being addressed. In the context
    of trading, feature engineering might include creating technical indicators, such
    as moving averages or oscillators, extracting sentiment scores from textual data,
    or calculating market-based ratios and growth rates.


    # 6.1 Technical Indicators


    Technical analysis is the study of historical price and volume data to identify
    patterns and trends that may predict future price movements. In quantitative trading,
    technical indicators are mathematical calculations based on price and volume data,
    and they are used to inform trading decisions. Some common technical indicators
    include:


    +   * Moving averages (Simple Moving Average - SMA, Exponential Moving Average
    - EMA): These smooth out price data over a specified period, making it easier
    to identify trends.

    * Oscillators (Relative Strength Index - RSI, Moving Average Convergence Divergence
    - MACD, Stochastic Oscillator): These help identify overbought or oversold conditions
    and potential trend reversals.

    * Volatility indicators (Bollinger Bands, Average True Range - ATR): These measure
    price fluctuations and can help identify potential trading'
