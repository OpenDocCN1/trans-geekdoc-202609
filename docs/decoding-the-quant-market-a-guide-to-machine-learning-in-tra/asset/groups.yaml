    such as schools, highways, or infrastructure. These bonds can be tax-exempt, which
    makes them attractive to investors in higher tax brackets. Municipal bonds are
    generally considered to be lower-risk investments compared to corporate bonds
    but may carry slightly higher risk than government bonds.


    # ##2.2.3 Bond Market Structure: Primary and Secondary Markets


    The bond market is divided into two segments: the primary market and the secondary
    market.


    +   * **Primary market:** This is where new bonds are issued and sold to investors,
    typically through underwriters or financial institutions. The proceeds from the
    sale of bonds in the primary market go directly to the issuer.


    +   * **Secondary market:** After bonds have been issued in the primary market,
    they can be bought and sold among investors in the secondary market. The secondary
    market facilitates price discovery and liquidity, allowing investors to trade
    bonds before their maturity. The prices in the secondary market are influenced
    by factors such as interest rates, credit quality, and market sentiment.


    # ##2.2.4 Bond Valuation and Yields


    The valuation of bonds is primarily based on the present value of their future
    cash flows, which include coupon payments and the repayment of principal at maturity.
    The discount rate used to calculate the present value depends on factors such
    as the bond''s credit risk, interest rate risk, and time to maturity.


    Bond yields, on the other hand, represent the return on investment for bondholders.
    The most commonly referenced yield is the yield to maturity (YTM), which is the
    annualized rate of return investors would receive if they held the bond until
    its maturity. Other yield measures include the current yield, which is the annual
    coupon payment divided by the bond’s market price, and the yield to call, which
    is relevant for callable bonds that can be redeemed by the issuer before maturity.'
