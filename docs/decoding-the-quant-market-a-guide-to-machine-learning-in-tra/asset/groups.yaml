    Stocks play a critical role in the economy by facilitating the efficient allocation
    of resources. They enable the transfer of funds from savers to business, promoting
    economic growth and wealth creation. Additionally, provide investors with opportunities
    to diversify their portfolios and manage risk, while businesses benefit from access
    to a wider pool of capital.


    ### 2.1.2 Structure of Equity Markets: Exchanges and Over-the-Counter (OTC) Trading


    Equity markets can be broadly categorized into two types: exchange-traded markets
    and over-the-counter (OTC) markets. Exchange-traded markets, such as the New York
    Stock Exchange (NYSE) or the Nasdaq, are centralized platforms where stocks are
    bought and sold through a transparent and regulated process. These markets provide
    liquidity, price discovery, and a standardized framework for trading.


    In contrast, OTC markets are decentralized networks of dealers who trade stocks
    not listed on formal exchanges. OTC trading is typically characterized by less
    transparency, lower liquidity, and higher transaction costs compared to exchange
    trading. However, OTC markets can offer access to a broader range of investment
    opportunities, including smaller companies and international stocks that may not
    be listed on traditional exchanges.


    ### 2.1.3 Market Indices and Their Importance


    A market index is a statistical measure that tracks the performance of a group
    of stocks, typically representing a specific market segment or industry. Some
    well-known examples include the S&P 500, which tracks the performance of 500 large-cap
    U.S. companies, and the Dow Jones Industrial Average, comprising 30 major U.S.
    companies.


    Market indices serve several important functions in the financial markets. They
    act as benchmarks for investors to gauge the performance of their portfolios,
    provide a snapshot of overall market sentiment, and offer an investable product
    through index funds and exchange-traded funds (ETFs). Additionally, market indices
    help in the construction and assessment of asset allocation strategies, as they
    reflect the performance and risk characteristics of various market segments.


    ### 2.1.4 Types of Stocks: Common and Preferred Shares


    There are two primary types of stocks: common shares and preferred shares.


    Common shares represent the most prevalent form of equity ownership, granting
    shareholders voting rights and a claim on a company’s profits. The value of common
    shares is primarily derived from the company’s growth potential and profitability.
    However, common shareholders are the last to receive any payouts in the event
    of a company’s liquidation, as they rank after bondholders and preferred shareholders.


    Preferred shares, on the other hand, offer a fixed dividend payment and have priority
    over common shareholders in terms of dividend distribution and liquidation. Preferred
    shareholders typically do not have voting rights, and the growth potential of
    preferred shares is limited compared to common shares. Preferred shares often
    exhibit characteristics of both stocks and bonds, making them an attractive option
    for income-focused investors.


    ### 2.1.5 Equity Market Participants and Their Roles


    Various participants operate within equity markets, each playing a distinct role
    in the functioning and efficiency of the market. Some key participants include:


    - **Retail investors**: Individual investors who buy and sell stocks for their
    personal accounts, typically with long-term investment goals or for portfolio
    diversification purposes.

    - **Institutional investors**: Entities such as pension funds, mutual funds, and
    insurance companies that invest large sums of money on behalf of their clients
    or beneficiaries. Institutional investors often have significant influence on
    market trends and individual stock prices due to the size of their investments.

    - **Broker-dealers**: Firms that facilitate trading by acting as intermediaries
    between buyers and sellers of stocks. They may execute trades on behalf of clients
    (brokers) or trade for their own accounts (deal).

    - **Market makers**: Participants who provide liquidity by continuously buying
    and selling stocks at publicly quoted prices, profiting from the bid-ask spread.
    They play a crucial role in maintaining orderly and efficient markets, particularly
    during periods of market stress.

    - **Regulators**: Government agencies responsible for overseeing market operations
    and ensuring compliance with laws and regulations. They aim to protect investors,
    maintain fair and transparent markets, and promote financial stability.


    ### 2.1.6 Factors Influencing Stock Prices


    Stock prices are influenced by a complex interplay of factors, which can be broadly
    categorized into company-specific factors, industry factors, and macroeconomic
    factors. Some key factors include:


    - **Earnings**: Company profitability is a significant driver of stock prices.
    Higher earnings typically translate to higher stock prices, as investors are willing
    to pay more for shares of profitable companies. Earnings announcements and forecasts
    can have a substantial impact on stock prices, as they provide insight into a
    company''s financial performance and future prospects.

