    the buyer can exercise the option and buy the asset at the lower strike price,
    making a profit. If the price remains below the strike price, the buyer may choose
    not to exercise the option, and their loss is limited to the premium paid.


    A put option gives the buyer the right to sell the underlying asset at strike
    price before the expiration date. The buyer pays a premium to the option seller
