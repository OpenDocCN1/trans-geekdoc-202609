    Option pricing is determined by several factors, including the price of the underlying
    asset, the strike price, the time to expiration, interest rates, dividends, and
    the implied volatility of the underlying asset. The most widely used model for
    pricing options is the Black-Scholes model, which was developed by Fischer Black,
    Myron Scholes, and Robert Merton in 1973 (Black et al., 1973).


