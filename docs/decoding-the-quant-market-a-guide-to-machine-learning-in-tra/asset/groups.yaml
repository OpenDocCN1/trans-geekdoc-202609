    financial health and competitive position, which can ultimately help in predicting
    stock performance.


    # Data Collection and Preparation


    To build a supply chain graph, data is collected from various sources, such as
    financial filings, trade databases, and third-party data providers. The supply
    chain graph consists of nodes representing companies and edges representing the
    relationships between them, such as supplier-customer connections. Node features
    may include financial metrics, industry classifications, and geographic information,
    while edge features may represent transaction volumes, contract durations, or
    other relationship-specific attributes.


    Once the supply chain graph is constructed, the data is preprocessed by normalizing
    node features, handling missing values, and adding relevant contextual information.
    The dataset is then split into training, validation, and test sets, ensuring that
    the temporal nature of the data is preserved to prevent information leakage.


