  md: 'tions (6,11 and 18 m/s). The sediment losses were reported to be ranging from
    6.5 g/m² to 6258 g/m² for low to high wind speeds, respectively. Li et al. [16]
    have explored the effect of particulate matter (PM2.5) emissions on the agricultural
