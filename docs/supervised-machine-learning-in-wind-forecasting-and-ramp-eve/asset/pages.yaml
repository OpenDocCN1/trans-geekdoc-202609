  md: 'For dataset D1, the RMSE for short-term wind forecasting without GRA is 5.86%
    with Jensen''s model and 4.78% with Frandsen''s model. With GRA, the RMSE for
    Jensen''s model is 4.66%, and for Frandsen''s model, it is 4.38%. The SSR/SST
    ratio was found better when wind forecasting in the presence of wakes is done
    with GRA than without it. The performance metrics indicate that wake modeling
    and wind forecasting based on Frandsen''s model outperformed Jensen''s model.
    Figs. 8.14 and 8.15 show the forecasting results for wind turbine $WT_{12}$ based
    on Jensen''s, Frandsen''s, and the proposed models for datasets D1 and D2.


    Similarly, for dataset D2, the RMSE without GRA for Jensen''s model is 8.06%,
    whereas for Frandsen''s model, it is 6.38%. With GRA, the RMSE for Jensen''s model
    is 6.86%, whereas for Frandsen''s model, it is 6.21%. It can be seen that RMSE
    for Frandsen''s model is smaller than for Jensen''s model, thus implying a better
    forecast in the presence of wind wakes for turbine $WT_{12}$. The SSR/SST ratio
    is consistent for Jensen''s and Frandsen''s models and shows good agreement between
    actual and estimated values.


    Based on our proposed model, we find that GRA provides significantly better forecasting
    performance in terms of RMSE. The RMSE for dataset D1 is 4.82% without GRA and
    2.56% with GRA. Similarly, for dataset 2, the RMSE is 5.52% without GRA and 4.72%
    with GRA. For a 15-turbine wind farm layout, the wind forecasting was carried
    out for $WT_{12}$, and we found that our proposed model yields better forecasting
    performance in the presence of wind wakes.


    This chapter discusses the short-term wind forecasting in the presence of wakes
    by considering two different wind farm layouts and numbers of wind turbines. The
    wake effect is studied based on the models proposed by Jensen and Frandsen. For
    single-wake scenario, the proposed bilateral Gaussian wake model is compared with
    Frandsen''s and Jensen''s models for different downwind distances. In a wind farm
    a downwind turbine experiences wakes due to multiple turbines, thus creating a
    shadowing effect. The multiple-wake scenario is tested for a five-turbine wind
    farm layout, and our proposed model outperformed Frandsen''s model by 75.75% and
    Jensen''s model by 91.75% in terms of RMSE. The short-term wind forecasting is
    carried out using a hybrid method based on wavelet decomposition and SVR. The
    inputs for the forecasting model are selected based on grey correlation degree
    and only significant inputs, that is, upwind turbines are selected as inputs to
    forecast wind speed for the downwind turbine.'
