    and LS-SVR, the equation can be further simplified as


    \(k(x, x_h)\big(\beta_h - \eta_h\big) - k(x, x_g)\big(\beta_g - \eta_g\big) >
    0.\) (7.15)


    Thus, if (7.15) is satisfied, then LS-SVR will outperform \(\epsilon\)-SVR during
