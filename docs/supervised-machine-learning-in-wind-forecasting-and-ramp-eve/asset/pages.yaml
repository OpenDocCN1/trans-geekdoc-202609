- pgno: 205
  md: '# Wind Energy Engineering Series


    # Supervised Machine Learning in Wind Forecasting and Ramp Event Prediction


    Harsh S. Dhiman, Dipankar Deb and Valentina Emilia Balas


    *Supervised Machine Learning in Wind Forecasting and Ramp Event Prediction* provides
    an up to date overview of the broad area of wind generation and forecasting, with
    a focus on the role and need of Machine Learning in this emerging field of knowledge.


    Various regression models and signal decomposition techniques are presented and
    analyzed, including least-square, twin support, and random forest regression,
    all with supervised Machine Learning. The specific topics of ramp event prediction
    and wake interactions are addressed in this book along with forecasted performance,
    with the authors providing a variety of wind farm datasets and conducted statistical
    tests to ascertain the robustness of the presented prediction models.


    Wind speed forecasting has become an essential component to ensure power system
    security, reliability, and safe operation, making this reference useful for all
    researchers and professionals researching in renewable energy and wind energy
    forecasting and generation.


    # Key features


    +   - Features various supervised machine learning-based regression models

    +   - Offers global case studies for turbine wind farm layouts

    +   - Includes state-of-the-art models and methodologies in wind forecasting


    # About the Authors


    **Harsh S. Dhiman,** is a research scholar in the Department of Electrical Engineering
    at Institute of Infrastructure Technology Research and Management (IITRAM), Ahmedabad,
    India. He obtained his Master’s degree in Electrical Power Engineering from Faculty
    of Technology & Engineering, The Maharaja Sayajirao University of Baroda, Vadodara,
    India, in 2016 and B.Tech. in Electrical Engineering from Institute of Technology,
    Nirma University, Ahmedabad, in 2014.


    **Prof. Dipankar Deb, Ph.D,** is currently Full Professor in the Department of
    Electrical Engineering at Institute of Infrastructure Technology Research and
    Management (IITRAM), Ahmedabad. He holds a Ph.D. from University of Virginia,
    Charlottesville, under the supervision of Prof. Gang Tao, IEEE Fellow and Professor
    in the department of ECE in 2007. In 2017, he was elected to be an IEEE Senior
    Member. He holds 6 Granted US patents, has published 17 Science Citation-indexed
    journal papers, and authored/edited 6 books.


    **Prof. Valentina Emilia Balas, Ph.D,** is currently Full Professor in the Department
    of Automatics and Applied Software at the Faculty of Engineering, “Aurel Vlaicu”
    University of Arad, Romania. She holds a Ph.D. in Applied Electronics and Telecommunications
    from Polytechnic University of Timisoara. She is the Editor-in-Chief of International
    Journal of Advanced Intelligence Paradigms (IJAIP) and of International Journal
    of Computational Systems Engineering (IJCSySE), member in Editorial Board member
    of several national and international journals, and an evaluator expert for national
    and international projects.


