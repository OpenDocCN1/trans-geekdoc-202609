  md: "a multiple wake condition, a wind turbine experiences wake due to multiple\
    \ upwind turbines, but not all wind turbines cause significant wake effect and\
    \ turbulence on the downwind turbine. Since not all upwind turbines cause velocity\
    \ deficit, to identify the significant upwind turbines on a particular downwind\
    \ turbine, grey correlation analysis (GRA) is performed. Next, we discuss various\
    \ steps involved in GRA.\n\n# Grey correlation analysis\n\nGrey correlation analysis\
    \ or GRA is an important financial tool often used in system analysis technique\
    \ [34]. The central idea of GRA is to establish the degree of closeness among\
    \ various decision making sequences and a reference sequence. Other criteria affecting\
    \ decision making apart from wake affect have been considered elsewhere [35].\
    \ Forecasting accuracy considering wake effects from multiple upwind turbines\
    \ is greatly affected by the results of GRA.\n\nFurther, once the GRA is done,\
    \ only the variables that have higher grey correlation degrees are chosen as inputs\
    \ for the wind speed forecasting model. Grey correlation analysis is done as follows:\n\
    \n+   1. A reference sequence with the same length as that of decision making\
    \ sequences is chosen as \\( X_0 = (x_{01}, x_{02}, ..., x_{0n}) \\), and a decision\
    \ sequence is expressed as a matrix \\( L \\) representing all the decision sequences\
    \ along with the reference sequence \\( X_0, X_i = (x_{i1}, x_{i2}, ..., x_{in})\
    \ \\), where \\( i = 1, 2, ..., m \\):\n+   \n+   \\( L = \\begin{bmatrix} x_{01}\
    \ & x_{11} & \\dots & x_{m1} \\\\ x_{02} & x_{12} & \\dots & x_{m2} \\\\ \\vdots\
    \ & \\vdots & \\ddots & \\vdots \\\\ x_{0n} & x_{1n} & \\dots & x_{mn} \\end{bmatrix}\
    \ . \\) (8.24)\n\n+   2. Next, all the sequences are standardized either through\
    \ transforms such as initial value transform, average value transform, or polar\
    \ difference transform. The matrix \\( L \\) is then transformed as\n+   \n+ \
    \  \\( L' = \\begin{bmatrix} x'_{01} & x'_{11} & \\dots & x'_{m1} \\\\ x'_{02}\
    \ & x'_{12} & \\dots & x'_{m2} \\\\ \\vdots & \\vdots & \\ddots & \\vdots \\\\\
    \ x'_{0n} & x'_{1n} & \\dots & x'_{mn} \\end{bmatrix} . \\) (8.25)"
