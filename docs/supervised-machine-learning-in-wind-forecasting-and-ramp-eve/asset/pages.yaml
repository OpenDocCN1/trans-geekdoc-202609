- pgno: 61
  md: '![](img/b53e39e35231af65df8ccaa99eb28bee_61_0.png)


    Constraints

    \( y - \langle w, x \rangle - b \le \varepsilon + \chi \)

    \( y - \langle w, x \rangle - b \ge \varepsilon - \chi^* \)


    # Figure 4.1 Diagrammatic explanation of \(\varepsilon\)-SVR.


    The formulation of SVR is diagrammatically explained in Fig. 4.1, where the “stars”
    represent the support vectors, green solid line shows the SVR regressor, and blue
    dashed lines are the hyperplanes with soft limit on the tolerance error \(\varepsilon\).


    However, this is not always the case, as the feature sets might not be linearly
    separable. To handle such nonlinearities in the feature sets, the so-called kernel
    functions are used to transform data to a higher-dimensional space (“kernel trick”).
    After transformation via a suitable mapping function \(\phi : \mathbb{R}^n \rightarrow
    Z\), the data become linearly separable in the target space (high-dimensional
    space), that is, \(Z\). The inner product \(\langle w^T, \phi(x) \rangle\) in
    the target space can be represented by using a kernel function. Kernel functions
    are similarity functions that satisfy Mercer’s theorem such that \(k(x_i, x_j)
    = \langle \phi(x_i), \phi(x_j) \rangle\) are the elements of the kernel matrix
    \(K\). Several kernel functions are available in the literature like linear, polynomial
    of degree \(d\), Gaussian, and the radial basis function (RBF) with bandwidth
    of the function \(\sigma\) and exponential function.


    Fig. 4.2 illustrates the kernel trick used when the input vectors are not linearly
    separable. This transformation makes the computation of weights and bias vector
    much easier. Now we look at the dual form of the optimization problem:


    ```

    \(\min \frac{1}{2} \sum_{i,j=1}^n (\alpha_i - \alpha_i^*)^T k(x_i, x_j) (\alpha_j
    - \alpha_j^*) + e^T \varepsilon \sum_{i=1}^n (\alpha_i + \alpha_i^*)\)

    \(- \sum_{i=1}^n y_i(\alpha_i - \alpha_i^*) \quad (4.6)\)

    \(\text{s.t. } e^T \sum_{i=1}^n (\alpha_i - \alpha_i^*) = 0, \quad 0 \le \alpha,
    \quad \alpha^* \le C e,\)

    ```'
