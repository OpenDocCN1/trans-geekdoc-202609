    # A.1.3 Line plots, histograms, and autocorrelation function for wind speed in
    R


    Consider a list of variables f1, consisting of wind speed, temperature, humidity,
    and air pressure for a site. To plot the distribution of wind speed for this site,
    R commands can be conveniently used as follows.


    # Example A.5. R code for Line plot & Histogram


