  md: '# Performance of ''svm''


    ![](img/b53e39e35231af65df8ccaa99eb28bee_194_0.png)


    Figure A.7 Mean squared error after tuning SVM hyperparameters.


    ```

    plot(direction,speed,pch=14)

    points(direction,predicted_speed,col="red",pch=4)

    ```


    SVM performance can be further improved by tuning the hyperparameters. A grid
    search can be performed in the range of 2-10—210 to determine optimal values of
    tolerance error ε and regularization parameter C. R commands for hyperparameters
    tuning are given next.


    # Example A.10. Hyperparameter tuning in R


    ```

    tuneResult <- tune(svm, speed ~ direction, data = Data,

    ranges = list(epsilon = seq(0,1,0.1), cost = 2^(2:9)) )

    ```


    In this example, Data is a data frame consisting of wind speed and wind directions,
    which are column vectors. The results of hyperparameter tuning can be accessed
    using print(tuneResult). See Fig. A.7.


    # A.4 Random forest regression in R


    Random forest regression can be implemented in R using a set of commands. The
    data for predictor (independent variables) and output variables are to be stored
    in the form of a data frame. In case of machine learning techniques the data are
    split into training and testing sets with an appropriate ratio. Consider a dataset
    with wind speed as output variable and its wavelet decomposition as predictor
    variables. As discussed in Chapter 5, the approximate and detail signals form
    the input dataset for predicting wind speed. In this example for RF model, we
    take a dataframe f5 with 4320 samples and divide them into training (3000) and
    testing (1320) sets.'
