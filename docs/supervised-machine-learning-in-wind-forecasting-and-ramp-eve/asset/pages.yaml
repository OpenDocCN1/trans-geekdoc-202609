  md: '# # Epilogue


    Wind speed prediction is an integral part of the wind energy sector. The power
    available in wind resource is enormous and hence requires its accurate assessment
    for a given regime. A modern day power grid relies on the availability of reserve
    power capacity, and this dependency can escalate the system cost. Wind forecasting
    based on the future time horizon plays an important role in the deregulated market
    structure. From an economic perspective, wind power schedules available ahead
    in time can lead to optimal power dispatch for a large interconnected power system.
    With the concept of hybrid wind farms getting popular among developing and developed
    countries, the research in the field of forecasting has increased tremendously.


    Wind speed forecasting in the modern day markets is carried out with a sole purpose
    to plan the reserve power capacity. An erratic forecast can jeopardize the system
    equilibrium in terms of generation and demand. To solve this issue of accurate
    wind power forecast, machine intelligent models in tandem with statistical models
    are used to improve short-term and medium-term forecasts. The nonlinearity in
    wind speed time series causes statistical models to fail, thus paving the way
    for machine intelligent models. Commonly used signal decomposition techniques
    that aim to address the volatility in wind speed time series aid the accuracy
    of short-term wind speed prediction. The wavelet transform and empirical mode
    decomposition are among the popular techniques that are implemented for decomposing
    wind speed time series. Apart from these packet decomposition technique that decomposes
    both low-frequency and high-frequency signals at each stage is also used. However,
    due to its time consumption issue, it is not preferred. In this book, models based
    on classical support vector regression and its variants like LSSVR, TSVR, and
    ε-TSVR are discussed with their performance under different real-time wind speed
    datasets.


    Whereas these models belong to the category of supervised machine learning, we
    also discuss the decision tree ensemble models like random forest and gradient
    boosted machines for wind speed and ramp event prediction. We also discuss the
    ramp event prediction where a sudden change in wind speed magnitude is likely
    to affect the wind farm operation. Different wind speed datasets across the globe
    are taken and assessed for ramp'
  merge: -1
  img_proc: true
- pgno: 186
  md: 'prediction. The potential superiority of decision tree ensemble models over
    SVR models and its variants is also discussed where the problem of over-fitting
    causes large errors for raw wind speed data. We also discuss a special application
    of machine learning-based forecasting models for wind farms in the presence of
    wake interactions. Two case studies with different wind farm layouts are considered,
    and relevant wind turbines affecting prediction of a given turbine are identified.


    Overall, an integrated solution that aims to find a best possible machine learning
    model for wind speed time series can be found for optimal wind power dispatch
    considering the reserve power capacity. Wind farm operators also face an important
    challenge of decision making, which has its roots from the forecasting technique
    incorporated to plan their wind power dispatch [1–3]. For a hybrid wind farm,
    operational strategies that a wind farm operator decides to take are also dependent
    on the reserve power capacity available. For ensuring a good balance between forecasts
    and reserve capacity, an integrated approach considering the wake effect that
    alters the power production of a wind farm can be deduced. Wake effects can be
    controlled up to a certain amount by implementing redirection strategies. These
    strategies involve accurate measurement devices like LIDAR, which gives an estimate
    of wind speed just before it actually interacts with the wind turbine. Availability
    of such devices helps a wind farm operator to take necessary steps in conjugation
    with the operational strategy to be implemented. Since wind markets require clearances
    at a short interval of 30 minutes to 1 hour, more focus is laid on short-term
    wind forecasting, which also tries to encompass weather models. The integrated
    methodology will determine the best forecasting technique, which under the effect
    of wake will lead to savings in reserve power capacity in terms of BESS and increase
    its life time.


    # References


    +   [1] H.S. Dhiman, D. Deb, Decision and Control in Hybrid Wind Farms, Springer,
    2019.

    +   [2] H. Dhiman, D. Deb, V. Muresan, V. Balas, Wake management in wind farms:
    an adaptive control approach, Energies 12 (7) (2019) 1247, https://doi.org/10.3390/en12071247.

    +   [3] H.S. Dhiman, D. Deb, V. Muresan, M.-L. Unguresan, Multi-criteria decision
    making approach for hybrid operation of wind farms, Symmetry 11 (5) (2019) 675,
    https://doi.org/10.3390/sym11050675.'
