    See Fig. A.2.


    We now discuss the R commands for autocorrelation functions for wind speed. An
    autocorrelation function depicts the dependence of an element with respect to
    elements of the series itself. For a wind speed time series, autocorrelation aids
    in selecting the lag orders for ARMA and ARIMA models. Dominant lag instants are
    helpful in identifying the behavioral pattern in wind speed. Mathematically, autocorrelation
    at lag instant k for a time series Y_t is expressed as


    $$r_k = \frac{\sum_{t=1}^{N-k} (Y_t - \overline{Y}) (Y_{t+k} - \overline{Y})}{\sum_{t=1}^{N}
    (Y_t - \overline{Y})^2}.\) (A.1)'
