    + 1}(1 + \upsilon^\alpha)\upsilon^{\alpha - 1}e^{-\beta \upsilon^\alpha}, \quad
    (2.8) \)


    where \( \alpha \) and \( \beta \) represent the shape and scale parameters, respectively.


    The cumulative PDF for generalized Lindley distribution is expressed as


    \( f_{gl}(\upsilon) = \left[1 - \left(\frac{1 + \beta + \beta \upsilon}{\beta
    + 1}\right)e^{-\beta \upsilon}\right]^\alpha. \quad (2.9) \)'
