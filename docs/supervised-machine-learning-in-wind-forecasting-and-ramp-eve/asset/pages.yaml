    A hybrid model based on the wavelet transform and empirical mode decomposition
    and variants of SVR. A benchmark model like the persistence algorithm is used
    to compare the performance metrics of the hybrid prediction model. Further, the
    regularization is carried out on the hybrid models to observe their effect on
    SSR/SST value. This chapter is segmented as follows: Section 6.2 describes application
