    # 7.2.1 Ramp event error analysis for \(\varepsilon\)-SVR and LS-SVR


    Consider a power ramp-up event at points g and h as shown in Fig. 7.7.


    Let the wind powers at points g and h be \(P_g\) and \(P_h\), and let \(\Delta
    P_{gh} = P_h - P_g\) denote the change in wind power over a time interval \(\Delta
    T\). According to \(\varepsilon\)-SVR and LS-SVR, the forecasted values are


    ```

    \(\hat{P}_{g1} = (\alpha_g - \alpha_g^*)k(x, x_g) + b, \quad \hat{P}_{h1} = (\alpha_h
    - \alpha_h^*)k(x, x_h) + b, \quad (7.10)\)

    \(\hat{P}_{g2} = \eta_g k(x, x_g) + b_1, \quad \hat{P}_{h2} = \eta_h k(x, x_h)
    + b_1, \quad (7.11)\)

    ```


    at ramp points g and h such that \(\alpha_g\) and \(\eta_g\) are the Lagrangian
    multipliers, \(b\) and \(b_1\) are the bias terms, and \(\hat{P}_{g1}\), \(\hat{P}_{h1}\)
    and \(\hat{P}_{g2}\), \(\hat{P}_{h2}\) are the predicted values based on \(\varepsilon\)-SVR
    and LS-SVR models, respectively. The error in the predicted value \(\hat{P}_{g1}\),
    \(\hat{P}_{h1}\) and actual value \(P_g\), \(P_h\) is given as


    ```

    \(e_{SVR} = \hat{P}_{h1} - P_h - \hat{P}_{g1} - P_g, e_{LS-SVR} = \hat{P}_{h2}
    - P_h - \hat{P}_{g2} - P_g, \quad (7.12)\)

    ```


    where \(e_{SVR}\) and \(e_{LS-SVR}\) are the errors based on \(\varepsilon\)-SVR
    and LS-SVR models, respectively. Since the ramp event occurs between two set points,
    the error takes up the form as described by (7.12). If LS-SVR outperforms'
