  md: 'uniform wind speed, the lifetime of wind turbines in offshore scenario increases
    [37]. Offshore wind farms have a disadvantage of higher installation and engineering
    costs accompanied by the wear and tear of generator and mechanical equipments.
    On the other hand, onshore wind farms face the challenge in their acceptance from
    limited land availability, visual intrusion, and damage to wildlife. The defining
    factor of operation between onshore and offshore wind farms is the surface roughness
    length. It is observed that the larger the surface length, the higher the reduction
    in wind velocity, and theoretically the wind speed at the ground is zero [38].


    Wind energy potential in onshore and offshore areas has been an active research
    field. The installation activity, particularly, in the offshore areas, is challenged
    by the transportation costs owing to large blades and support structures to be
    placed in deep sea water. Another issue faced by the offshore wind turbines is
    the problem of uncontrolled vibrations arising from the combination of wind and
    wave force [39]. With a higher wind speed in the sea, the probability of occurrence
    of ramp events increases. Wind power growth in European countries has led to detailed
    study of ramp events, particularly, categorized as ramp-up and ramp-down events,
    each characterized by sudden change in wind speed in a short interval of time.


    Mathematically, a wind power ramp event is described as


    ```

    \Delta P_w^{Ramp} = P_w(t + \Delta t) - P_w(t), \qquad (7.24)

    ```


    where \Delta P_w^{Ramp} is the ramp wind power expressed as the arithmetic difference
    of two consecutive time intervals.


    The occurrence of a wind power ramp event is ascertained by a threshold value
    of the total wind farm power. Wind power forecasting is an essential market procedure
    to regulate the electricity markets where the farm operators hold an advantage
    to derive profit from their generation given an accurate wind forecasting strategy.
    Predicting these ramp events can suitably prevent intermittent grid failures,
    and for that purpose, a proper characterization of ramp events is imperative.
    For example, in Horns Rev wind farm, large variation in wind power is seen in
    a short duration [40]. In a study carried out by Gjerstad the variation in wind
    power is triggered by atmospheric properties of boundary layer [41].


    The atmospheric factor that influences the wind speed variations is the mean lapse
    rate \partial T/\partial z, that is, rate of change of air temperature T with
    height z. In case of offshore wind farms connected to German power grid, within
    8 h, the wind power transfer between converters increased from'
  merge: -1
