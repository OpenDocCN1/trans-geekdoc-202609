    \(\hat{P}_{h1} - P_h - \hat{P}_{g1} + P_g > \hat{P}_{h2} - P_h - \hat{P}_{g2}
    + P_g.\) (7.13)


    Let us denote \(\beta_h = \alpha_h - \alpha_h^*\) and \(\beta_g = \alpha_g - \alpha_g^*\),
