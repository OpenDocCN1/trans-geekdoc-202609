    # ## 2.1 Basics of wind power


    Extracting power from moving air is not new as it has been practiced since ages.
    Growing energy demands have caused a positive push for renewable power sector.
    Among the renewables, wind energy is a promising area to provide uninterrupted
    power to the utility grid. Wind power is not only clean but also poses economic
    solutions to countries with wind resource. Wind farms are equipped with turbines
    that utilize the kinetic energy of the wind to generate usable power. This is
    further fed to utility grid via transmission lines and cables. Fundamentally,
    power extracted by a turbine having the rotor area $A_r$ from the moving air with
    density $\rho_w$ and velocity $u_\infty$ is given as


    $P_w = \frac{1}{2} \rho_w A_r u_\infty^3.$ (2.1)


    Essentially, the power extracted is directly proportional to the wind speed $u_\infty$
    and rotor area $A_r$. However, with land constraint and manufacturing cost incurred,
    the rotor size poses a limitation in large-sized wind turbines. Thus regions with
    high wind speed can be suitably exploited to enhance the power capture capacity
    of wind farms. Further, (2.1) describes the theoretical power that can be potentially
    extracted from wind. However, in reality, only a fraction of this power is made
    available for mechanical-to-electrical conversion, and this fraction is known
    as the power coefficient. Wind turbines with different rotor configurations have
    different power coefficients. Theoretically, the maximum value of the power coefficient
    can be calculated based on the actuator disk model (ADM) of wind turbine, which
    assumes wind turbine as a disc that exerts forces on the fluid flow. The maximum
    value of the power coefficient is 0.5926 and is known as the Betz limit [6].


