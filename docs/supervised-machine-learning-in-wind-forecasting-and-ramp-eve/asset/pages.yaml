    # A.3 Support vector regression in R


    Let us now see how to fit a support vector machine model for a regression model
    for the example studied in previous case. Here the data for wind speed and direction
    remain the same. We try to fit an svm model as described in Fig. A.6 and find
    out its error performance.


    # Example A.9. R codes for SVR


    ```

    model <- svm(speed ~ direction)

    predicted_speed <- predict(model, direction)

    points(direction, predicted_speed, col = "red", pch=4)

    rmse <- function(error)

    {

    sqrt(mean(error^2))

    }

    error <- model$residuals # same as speed-predicted_speed

    predictionRMSE <- rmse(error)

    ```'
