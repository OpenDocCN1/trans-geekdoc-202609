    In these R commands, Y is a column vector depicting the wind speed time series,
    and n is the length of the time series. Note that the function fn minimized here
    is the negative of the loglikelihood function described by (A.2). The initial
    guess of the parameters is passed through a vector theta<-c(\alpha_0, \beta_0).
    The estimates (\hat{\alpha}, \hat{\beta}) can be accessed using $ operator as
    theta_est$estimate.


    # A.2 Linear regression analysis in R


    Linear regression aims to model a dependent variable Y as a function of independent
    variable X that follows an expression given as


    \(Y = \phi_1 + \phi_2 X + v, \quad \text{(A.3)}\)


    where \phi_1, \phi_2, and v are the intercept, slope, and error terms for the
    regression model. Let us study how to carry out a simple linear regression in
    R. We take a data set Y as wind speed for a particular region and X as wind direction
    to see dependence of wind speed on wind direction and analyze error metrics. The
    data for wind speed and wind direction are collected from a wind farm Bishop &
    Clerks in USA. The scatter plot for 50 data points is illustrated in Fig. A.4.
    Further, Table A.1 depicts the first 10 data-points for wind speed and wind direction.
    The data can be imported in R workspace via .xlsx file as described in an earlier
    section.'
