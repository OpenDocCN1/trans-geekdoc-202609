    ```


    where \(u_h\) and \(u_r\) are the wind speeds (in m/s) at desired hub height and
    reference hub height, \(z_h\) and \(z_r\) are the hub heights (in m) at desired
    level and reference level, respectively, and \(\alpha = 1/7\) is an empirically
    calculated constant dependent on atmospheric conditions [35]. Table 7.2 shows
    the absolute error (AE) values computed for wind power ramp-up and ramp-down events
    for different wind farm sites. During ramp-up events for all the wind sites, \(\varepsilon\)-TSVR
    performs better than TSVR, LS-SVR, and classical \(\varepsilon\)-SVR.


    From Fig. 7.8 we see that the probability of wind power ramp event increases when
    wind speed is recorded at any hub height above the ground. The number of wind
    power ramp events for five wind farm sites are illustrated in Fig. 7.9.'
