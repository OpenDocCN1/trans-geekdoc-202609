    # 3.5 Hybrid wind forecasting methods


    Individual machine learning methods like ANN, SVR, ELM, and GPR are used with
    signal preprocessing techniques such as the wavelet transform and empirical mode
    decomposition. Signal decomposition techniques segment the wind speed time series
    into subseries. These subseries can be used to forecast individually and are aggregated
    to obtain the final forecast series.


    Hybrid models that encompass the features of individual methods have been a core
    area of research and are illustrated in Fig. 3.9.


    Yuan et al. [17] have proposed a hybrid forecasting model employing autoregressive
    fractionally integrated moving average (ARIFMA) and least-square support vector
    regression to predict the short-term wind power. Various machine learning–based
    forecasting models have proven their superiority over time-series models. Among
    machine-learning methods, the support vector regression estimates a regression
    function in the spirit of classical support vector machines [18]. Liu et al. [10]
    have proposed a hybrid short-term wind speed forecasting method using the wavelet
    transform and support vector machines optimized by the genetic algorithm.


    Another hybrid method that studies wind speed forecasting in Mexico uses ARIMA
    and ANN models is also available [19]. Liu and Tian [20] have used wavelet and
    wavelet packet along with ANN to predict the wind speed and have compared their
    findings with standard models like ANFIS, wavelet-RBF, and the persistence method.
    Xiao et al. [21] have demonstrated combined prediction models employing weight
    calculation for individual models according to their superiority among various
    other models. In [22] the authors have used ANN with statistical weight preprocessing
    technique to predict the coefficient of performance of a ground source heat pump
    (GCHP) system. Further studies have shown that using optimization methods for
    selecting model parameters yields better results'
