  md: '# Example A.12. R codes for GBM


    ```

    library(gbm)

    library(xgboost)

    library(h2o)

    library(pdp)

    library(ggplot2)

    head(f5)

    summary(f5) traindata<-ftc[1:3000,]

    testdata<-ftc[3001:4320,]

    xtrain<-traindata[,c(2,3,4,5,6,7)]

    ytrain<-traindata[,1]

    test<-testdata[,1]

    xtest<-testdata[,c(2,3,4,5,6,7)]

    gbm.fit<-gbm(formula=ws~.,data = f5,

    var.monotone = c(0,0,0,0,0,0),

    distribution = "gaussian", n.trees = 10000, shrinkage = 0.05,

    interaction.depth = 3, bag.fraction = 0.5, train.fraction = 0.5,

    n.minobsinnode = 10, cv.folds = 5, keep.data = TRUE,

    verbose = FALSE, n.cores = 1)

    print(gbm.fit)

    sqrt(min(gbm.fit$cv.error))

    gbm.perf(gbm.fit,method="cv")

    ynew<-predict(gbm.fit, xtest, 9982, type = "link",

    single.tree = FALSE)

    write.table(ynew, file = "yGBM.txt", row.names = TRUE,

    col.names = NA)

    library(forecast)

    accuracy(ynew,ytest) rmse.gbm<-sqrt(mean((ynew-ytest)^2))

    nmse.gbm<-sum((ynew-ytest)^2)/sum((ytest-mean(ytest))^2)

    r2.gbm<-sum((ynew-mean(ytest))^2)

    /sum((ytest-mean(ytest))^2)

    write.table(ytest, file = "ytest.txt" row.names = TRUE,

    col.names = NA)

    ```'
