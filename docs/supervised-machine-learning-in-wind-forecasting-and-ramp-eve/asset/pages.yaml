    # 3.2 Wind forecasting: overview


    With the spurt in the installation of renewable energy sources, the fossil fuel
    usage is needed to be put into restricted use. Most of the industries in power
    sectors prefer renewable energy generation owing to its negligible carbon footprint.
    With wind available in abundant form, tapping power from wind is a specialized
    task. The error processing of forecasted wind speed/power and actual wind speed/power
    play a crucial role in selecting an appropriately applicable forecasting algorithm.


    Wind forecasting plays an important role when it comes to clearing day ahead market
    scenarios. Given that there is a market situation to be cleared, an accurate wind
    forecasting scheme is helpful in such situations. Wind forecasting schemes are
    broadly categorized as (i) weather-based prediction methods and (ii) statistical
    or time-series-based prediction methods. When we consider weather-based prediction
    models, the wind forecast accuracy depends largely on the topology of the land
    where the wind turbines are erected.


    Given the topology of the land, wind speed measurements at an appropriate height
    from the ground, the temperature of the ambient air, air pressure, and so on are
    important factors to be taken into consideration for improved forecasting. On
    the other hand, statistical methods solely depend on the past measurements of
    the wind speed to appropriately predict the future values.'
