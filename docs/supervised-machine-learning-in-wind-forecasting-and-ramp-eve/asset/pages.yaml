    # 3.3.1 ARMA model


    Among various statistical models, ARMA model is a popular forecasting- method.
    In ARMA, AR stands for autoregressive, and MA stands for moving average. Thus
    a combined autoregressive (of order p) and moving average (of order q) forms an
    ARMA(p, q) model. The order of ARMA models, p for AR and q for MA, denotes the
    lag between present and past values of the variable under test. Thus a generic
    ARMA model can be mathematically expressed as


    ```

    $(y_t - \mu_x) = \phi_1(y_{t-1} - \mu_x) + \phi_2(y_{t-2} - \mu_x) + \cdots +
    \phi_p(y_{t-p} - \mu_x)

    + \xi_t - \theta_1\xi_{t-1} - \theta_2\xi_{t-2} - \cdots - \theta_q\xi_{t-q},\quad
    (3.3)$

    ```'
