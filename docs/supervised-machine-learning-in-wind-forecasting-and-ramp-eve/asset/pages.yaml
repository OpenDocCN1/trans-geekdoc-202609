    reduce the overall efficiency. One such phenomenon is wind wakes. Wind wakes reduce
    the power capturing capacity of the downstream wind turbines in a wind farm due
    to drop in velocity, which can be essentially corrected to some extent by optimally
    placing wind turbines in a given area. The process of optimal wind turbine placement
    is called micrositing.


    Power losses incurred due to improper wind turbine placement can also raise alarming
    situations of increased turbulence, which further can escalate the blade and tower
    health issues. Several optimization techniques like the genetic algorithm and
    particle swarm optimization are used to tackle such problems for an optimal wind
    farm layout, which are discussed in subsequent chapters ahead. Allied areas of
    wind forecasting also include the lifetime prediction of wind turbine blades and
    tower. Since commonly used turbine configuration is HAWT, the design is prone
    to extreme damages from high wind speed scenarios, called ramp events. A typical
    blade health management study includes prognostics and diagnostics, which are
    aimed to identify potential causes for poor blade design, remaining lifetime,
    and mechanical faults, which result in untimely degradation of blades. Studies
    have been carried out that proclaim deployment of sensors aiding online health
    monitoring.


    Furthermore, ramp events, which are wind conditions of sudden change in speed
    and direction, are considered to be an alarming situation. These scenarios occur
    when the installed capacity is large incorporating turbines of high rated power.
    Ramp events are related not only to wind farms but also to many other scientific
    and engineering activities. In case of a reservoir wall, forest fires, air quality,
    and rapid changes in wind speed and direction can significantly impact these phenomena.
    We will further discuss these events in detail in Chapter 7. Overall, a wind farm
    operation is a sensitive one, which can be perceived from important aspects as
    discussed.


