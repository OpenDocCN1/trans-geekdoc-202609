  md: 'So far, in this chapter, we have analyzed the impact of wind speed and its
    variability on different scientific and engineering aspects. Next, we discuss
    four case studies for studying the impact of wind ramps. The random and rapid
    changes in wind speed are termed as a ramp and have several catastrophic impacts.
    First, we studied the case study for a reservoir wall at Chasmandva district in
    Valsad, Gujarat. The wave height generated at the water surface due to wind speed
    is calculated, and its corresponding force and bending moment on the reservoir
    wall are determined, and it is found that from March to May the bending moment
    is increased by 46.32% due to the mean wind speed change from 5 km/h to 15 km/h.
    Then we study the impact of wind speed on the forest risk management for a forest
    canopy in Portugal, where the wind ramps cause forest fires to spread rapidly
    with rapid changes in wind speed. The wind speed impact is then assessed for strawberry
    cultivation for a farm in Monterey in California, where the correlation between
    daily yield and ramp speed is found to be 0.798, thus indicating wind ramps as
    favorable scenario for strawberry yield. Then we analyzed the influence of wind
    speed in the air quality of the city of Bogota, Colombia, and Abu Dhabi, UAE.
    Pearson''s correlation coefficient is calculated between PM2.5 concentration level
    and wind ramp speed and was found to be -0.053, indicating improvement of air
    quality conditions with increasing wind ramp speed magnitude.


    # 7.2 Ramp events in wind farms


    Intermittent wind power due to sudden wind speed variations is critical for grid
    connected power plants and causes extreme situations like low system reliability
    and high operational costs. A wind power ramp event is defined as the rate of
    change in wind power generated over a short time period exceeding a predefined
    threshold value (normally 50%) [30]. According to [31], a power ramp event is
    said to occur if the change in power signal |P(t + Δt) − P(t)| is greater than
    a said threshold, ΔP<sub>ramp</sub>. The intermittent nature of wind speed requires
    installation of batteries to tackle peak demands. However, rapid charging and
    discharging of batteries degrade battery life [32]. For analysis of power ramp
    up or down events, setting the threshold power is needed. For a given wind turbine,
    let the ramp threshold power be r% of the nominal wind power. Then we can define
    two different ramp thresholds:


    \(\Delta P_{ramp} = \begin{cases} + r\% \text{ of } P_{nominal} = P_{th}^u, \\
    - r\% \text{ of } P_{nominal} = P_{th}^l, \end{cases}\) (7.9)'
