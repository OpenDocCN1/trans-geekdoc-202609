  md: '# # Biography


    # ## About the series editor


    Dr. Yves Gagnon is professor of engineering at the Université de Moncton, Canada,
    along with being Adjunct Professor at Thaksin University, Thailand. Prior to that,
    Dr. Gagnon was Visiting Executive at the Natural Sciences and Engineering Research
    Council (NSERC) of Canada, he was founding President and CEO of the New Brunswick
    Innovation Foundation and he held the positions of Associate Vice-President of
    Research, Dean of the Faculty of Graduate Studies and Research, and K.C. Irving
    Chair in Sustainable Development at the Université de Moncton.


    As a Mechanical Engineer, Dr. Gagnon obtained graduate degrees from the Massachusetts
    Institute of Technology in the United States, and from the Université de Toulouse,
    in France, while Thaksin University has conferred him an Honorary Doctorate degree
    in Sciences. Active in research, Dr. Gagnon has been supported through various
    grants and research contracts. His research and innovation work, done in national
    and international collaborations, has appeared in over 350 publications and reports;
    and his contributions have been recognized by several prizes. Amongst his editorial
    positions, Dr. Gagnon was Associate Editor of the ASME Journal of Solar Energy
    Engineering, responsible of the wind energy section.


    # ## About the authors


    Harsh S. Dhiman was born in Chandigarh in 1992 and is currently pursing PhD in
    Department of Electrical Engineering from Institute of Infrastructure Technology
    Research and Management (IITRAM), Ahmedabad, India, under the supervision of Prof.
    Dipankar Deb. He obtained his Master’s degree in Electrical Power Engineering
    from Faculty of Technology & Engineering, Maharaja Sayajirao University of Baroda,
    Vadodara, India, and B. Tech in Electrical Engineering from Institute of Technology,
    Nirma University, Ahmedabad, India. His current research interests include hybrid
    operation of wind farms, hybrid wind forecasting techniques, and wake management
    in wind farms.


    Dipankar Deb completed his PhD from University of Virginia, Charlottesville, under
    the supervision of Prof. Gang Tao, IEEE Fellow and'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'Professor in the department of ECE in 2007. In 2017, he was elected to be IEEE
    Senior Member. He has served as Lead Engineer at GE Global Research Bengaluru
    (2012–2015) and as Assistant Professor in EE, IIT Guwahati, 2010–2012. Presently,
    he is Professor and Department Coordinator of Electrical Engineering at Institute
    of Infrastructure Technology Research and Management (IITRAM), Ahmedabad. He is
    Associate Editor of IEEE Access Journal. He has authored 21 SCI Indexed Journal
    Papers, holds 6 US Granted patents, and has authored or edited eight books. His
    research interests include control theory, stability analysis, and renewable energy
    systems.


    **Valentina Emilia Balas** holds PhD in Applied Electronics and Telecommunications
    from Polytechnic University of Timisoara, Romania. Dr. Balas is the author of
    more than 300 research papers in refereed journals and international conferences.
    Her research interests are in intelligent systems, fuzzy control, soft computing,
    smart sensors, information fusion, and modeling and simulation. She is the Editor-in
    Chief of International Journal of Advanced Intelligence Paradigms (IJAIP) and
    International Journal of Computational Systems Engineering (IJCSysE), an Editorial
    Board member of several national and international journals, and an evaluator
    expert for national and international projects and PhD theses. Dr. Balas is the
    director of Intelligent Systems Research Centre in Aurel Vlaicu University of
    Arad, Romania, and Director of the Department of International Relations, Programs
    and Projects at the same university. She served as General Chair of the International
    Workshop Soft Computing and Applications (SOFA) in eight editions 2005–2018 held
    in Romania and Hungary. Dr. Balas participated in many international conferences
    as Organizer, Honorary Chair, Session Chair, and a member in Steering, Advisory,
    or International Program Committees. She is a member of SIAM, Senior Member of
    IEEE, a member in TC-Fuzzy systems (IEEE CIS), a member in TC-Emergent Technologies
    (IEEE CIS), a member in TC-Soft computing (IEEE SMCS). Dr. Balas was past Vice-President
    (Awards) of International Fuzzy Systems Association Council (2013–2015) and is
    Joint Secretary of the Governing Council of Forum for Interdisciplinary Mathematics
    (FIM), A Multidisciplinary Academic Body, India.'
