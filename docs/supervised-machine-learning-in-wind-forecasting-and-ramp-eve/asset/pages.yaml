    # 6.3 Framework of hybrid forecasting


    The present study involves short-term wind speed prediction utilizing a hybrid
    wavelet transform and an SVR-based method. Hybrid methods are more efficient compared
    to individual methods as far as the ability to filter stochastic volatility is
    concerned. The error in wind speed prediction depends on the prediction duration
    or horizon. For market clearing operations and economic load dispatch, usually
    short-term wind speed prediction ranging from 30 minutes to 3 hours is a preferred
    choice. Modern day electricity markets have moved on from regulated markets to
    deregulated markets, which allow several participants to enter in the bidding
    process to buy retail electricity from the generation companies. The wind forecasting
    is carried out using the hybrid model, that is, wavelet-SVR,'
