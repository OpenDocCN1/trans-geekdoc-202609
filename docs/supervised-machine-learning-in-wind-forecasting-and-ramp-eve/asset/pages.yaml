    # ## 5.2 Gradient boosted machines


    Gradient boosted machines (GBMs) is an ensemble-based regression method, that
    takes into account the loss of the previously fit decision tree. In a GBM model,
    various weak learners are combined to arrive at an accurate model. Boosting-based
    regression trees are highly powerful to predict accurate response values owing
    to the advantages posed by an appropriate boosting algorithm. A particular boosting
    algorithm strengthens the tree model by minimizing the inaccuracies of weak models
    in the form of loss function [7]. Thus for a boosting algorithm, the main task
    is reducing the error posed by weak learners in each iteration. The final predicted
    response is the linear combination of fit trees. An advantage of GBM over conventional
    regression models is that it avoids overfitting. In case of GBM the learning rate
    of each decision tree determines the predictive performance. A higher learning
    rate indicates less number of trees required for prediction and vice versa [8].
    Based on a cross-validation experiment, an ideal number of trees required along
    with learning rate can be obtained. Since GBM is'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'a collective model that combines all the individual weak models, the aim for
    an individual model is reducing the error generated by a loss function. A commonly
    used loss function is an $\mathcal{L}_2$ function that minimizes the sum of squared
    errors between the predicted and actual values. Consider $k$ such weak models
    that account for prediction of a variable $y$ given a feature set $x = [x_1, x_2,
    ..., x_n]$, which mathematically can be expressed as


    ```

    \(\hat{y} = \sum_{i=1}^k f_i(x),\) (5.3)

    ```


    where $f_i(x)$ represents each weak learner that is collectively trained to improve
    the prediction results. The loss function is given as


    ```

    \(\mathcal{L}_2 = \frac{1}{N} L(y_i, \hat{y}_i), \quad L(y_i, \hat{y}_i) = \sum_{i=1}^N
    (y_i - \hat{y}_i)^2,\) (5.4)

    ```


    where $L(y_i, \hat{y}_i)$ is a loss function based on squared errors for $N$ observations.
    The aim of a GBM regression technique is to minimize the $\mathcal{L}_2$ loss
    function. However, the $\mathcal{L}_2$ loss function is more sensitive to outliers
    and can reduce the robustness of the model. To ensure a high robustness, the Huber
    loss function is used, which can be expressed as


    ```

    \(L(y, \hat{y}) = \begin{cases} \frac{1}{2}(y - \hat{y})^2, & |y - \hat{y}| \le
    \delta, \\ \delta(|y - \hat{y}| - \delta/2), & |y - \hat{y}| > \delta, \end{cases}\)
    (5.5)

    ```


    where $\delta$ represents the slope. The concept of gradient boosted machine revolves
    around the gradient descent and boosting algorithm. For optimizing the hyperparameters
    in GBM, a gradient descent algorithm is used, which minimizes the cost function
    taking into account the negative of the gradient. Let us consider an $\mathcal{L}_2$
    loss function with its gradient of with respect to predicted sample $\hat{y}_i$
    given as


    ```

    \(\frac{\partial L(y, \hat{y})}{\partial \hat{y}_i} = \frac{\partial}{\partial
    \hat{y}_i} \sum_{i=1}^N (y_i - \hat{y}_i)^2 = 2(y_i - \hat{y}_i) \frac{\partial}{\partial
    \hat{y}_i} (y_i - \hat{y}_i) = -2(y_i - \hat{y}_i).\) (5.6)

    ```


    The gradient here reflects that while tracking the minimum point of the loss function,
    the GBM actually tracks the residual vector $y - \hat{y}$. Similarly, for $\mathcal{L}_1$,
    the MAE can be tracked by finding the gradient of loss function'
  merge: -1
  img_proc: true
- pgno: 87
  md: '![](img/b53e39e35231af65df8ccaa99eb28bee_87_0.png)


    Figure 5.6 XBoost algorithm for gradient boosted machines.


    given as


    ```

    \frac{\partial L(y, \hat{y})}{\partial \hat{y}_i} = \frac{\partial}{\partial \hat{y}_i}
    \sum_{i=1}^N |y_i - \hat{y}_i| = -sign(y_i - \hat{y}_i). \quad (5.7)

    ```


    The accuracy of a GBM model depends on the number of weak learners and the learning
    rate. Further, the essence of a GBM model lies in the boosting technique, which
    combines all the weak models in a stagewise manner and then in a parallel manner,
    as seen in the random forest model. Mathematically, the GBM model in recursive
    form is given as


    ```

    F_m(x) = F_{m-1}(x) + \eta \Delta_m(x), \quad (5.8)

    ```


    where \(\eta\) represents the learning rate, and \(\Delta_m\) refers to a regression
    model fitted to the residuals. Fig. 5.6 illustrates the XBoost algorithm used
    for obtaining the best regressor.


    In our wind speed prediction simulations, the source codes for random forest and
    GBM are presented in Appendices A.4 and A.5, respectively.


