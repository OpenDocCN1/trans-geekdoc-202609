    forecast accuracy of ε-TSVR and TSVR is further tested using the Diebold–Mariano
    (DM) test. The DM statistic test assumes a null hypothesis wherein two forecasting
    models have similar accuracy [19].


    Consider an actual time series $y_t$ and forecasted time series $\hat{y}_{1t}$
    and $\hat{y}_{2t}$. The error between actual and forecasted time series is $e_{it}
    = \hat{y}_{it} - y_t$. Mathematically, the DM test can be expressed as


    $H_0: e_{1t} - e_{2t} = 0, \quad H_1: e_{1t} - e_{2t} \neq 0, \quad \forall t;$
    (6.6)


    $H_0$ and $H_1$ represent the null and alternative hypotheses.'
