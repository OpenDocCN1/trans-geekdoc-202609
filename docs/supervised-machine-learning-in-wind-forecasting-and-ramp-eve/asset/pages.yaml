    # 2.3.1.1 Weibull distribution


    The majorly used wind PDF is Weibull, which fits well for almost all wind regimes.
    The two-parameter ($k$ and $\lambda$) Weibull PDF is represented as


    $f(v; k, \lambda) = \frac{k}{\lambda}(\frac{v}{\lambda})^{k-1} e^{-(\frac{v}{\lambda})^k},$
    (2.2)


    where $k, \lambda > 0$, and $v > 0$ is a random variable called the wind speed
    (in m/sec); $k$ is known as the shape parameter. Estimation of Weibull parameters
    can be done by the maximum likelihood method [13]. Similarly, joint Weibull PDFs
    can be used to model wind farms with bimodal wind regimes. A two-component joint
    Weibull PDF can be expressed as


    $$f_i(v; k_i, \lambda_i) = \frac{k_i}{\lambda_i}(\frac{v}{\lambda_i})^{k_i-1}
    e^{-(\frac{v}{\lambda_i})^{k_i}}, \quad i=1, 2,$$

    $$f(v; k, \lambda) = w_1 f_1(v; k_1, \lambda_1) + (1 - w_1) f_2(v; k_2, \lambda_2),
    \quad (2.3)$$


    where $k_1, \lambda_1$ and $k_2, \lambda_2$ represent the shape and scale parameters
    for individual PDFs, which in turn can be estimated using maximum likelihood estimation
    (MLE).


    # Parameter estimation using maximum log likelihood


    The estimates $\hat{\theta} = (\hat{k}, \hat{\lambda})$ of parameters of the Weibull
    distribution can be determined for a unique wind speed data based on maximum likelihood
    principle. Given the Weibull PDF as per Fig. 2.2 and (2.2), the log likelihood
    function is given as


    $L(v|k, \lambda) = n\log(k) - nk\log(\lambda) + (k-1) \sum_{i=1}^n \log(v_i) -
    \sum_{i=1}^n (\frac{v_i}{\lambda})^k . \quad (2.4)$


    Further, to obtain the estimates, the log likelihood function is differentiated
    with respect to parameters $k$ and $\lambda$:'
