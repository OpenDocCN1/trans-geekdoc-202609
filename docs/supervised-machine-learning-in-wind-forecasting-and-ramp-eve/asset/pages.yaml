    # A.1.4 Parameter estimation for wind speed probability density functions in R


    Various PDFs like Weibull, Rayleigh, gamma, log-normal, and Lindley are based
    on parameters that decide the shape and scale of wind speed distributions. Estimation
    of such parameters is based on nonlinear minimization of loglikelihood function.
    In R the parameters can be estimated by applying defining functions for individual
    distributions. For example, the Stacy–Mihram model described in Chapter 2 has
    parameters α and β, which can be estimated by minimizing the negative of the loglikelihood
    function


    ```

    L(v|α, β) = n log β - n β log α + (β - 1) ∑_{i=1}^{n} log(v_i) - ∑_{i=1}^{n} (v_i
    / α)^β . (A.2)

    ```


    Let us consider the parameter vector θ = (α, β) such that θ[1] = α and θ[2] =
    β. The function nlm for nonlinear minimization can be used as follows.


    # Example A.7. Parameter estimation for distributions in R


    ```

