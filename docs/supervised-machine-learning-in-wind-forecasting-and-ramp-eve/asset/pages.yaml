    # ## 6.5 Empirical mode decomposition-based SVR variants for wind speed prediction


    In this section, we discuss a hybrid model based on empirical mode decomposition
    (EMD) and variants of support vector regression (SVR). Just like wavelet transform,
    EMD is a signal preprocessing technique for assessing the volatility of a time
    series. Fig. 6.10 illustrates a flowchart for ARIMA-EMD-based hybrid wind forecasting
    model. The wind speed prediction is carried out in two parts. First, the linear
    characteristics are predicted based on an ARIMA model, and second, the nonlinear
    nature is handled by machine learning models like support vector regression and
    its variants.'
