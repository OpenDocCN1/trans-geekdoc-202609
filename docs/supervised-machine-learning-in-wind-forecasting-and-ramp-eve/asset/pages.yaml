  md: '# 3.3.2 ARIMA model


    ARMA models have a limitation that they can be applied to stationary processes
    only. In reality, the wind speed is a nonstationary time series with significant
    diurnal, meteorological, and seasonal variations. These variations are a result
    of dynamic atmospheric processes that change the wind behavior in time. To handle
    such limitations, ARIMA process is used to forecast wind speed. ARIMA process
    stands for autoregressive (AR), integrated (I), and moving average (MA). Mathematically,
    ARIMA(p, d, q) can be expressed as


    ```

    \phi L . K^d . y_t = \theta L(\xi_t), \qquad (3.8)

    K = 1 - L, \qquad (3.9)

    y_t = (1 + \phi_1)y_{t-1} + (\phi_2 - \phi_1)y_{t-2} + \cdots + \phi_p y_{t-p-1}

    + \xi_t - \theta_1 \xi_{t-1} - \theta_2 \xi_{t-2} - \cdots - \theta_q \xi_{t-q},
    \qquad (3.10)

    ```


    where y_t is the time-series variable, d is the difference operator, \xi_t is
    a white noise with zero mean and infinite variance, and \phi and \theta are coefficients
    of AR and MA processes. In the statistical package R, there is a function called
    auto.arima in the forecast package that automatically evaluates such parameters.


    Figs. 3.5 and 3.6 illustrate wind speed forecasting for ARMA(1, 1) and ARIMA(2,
    1, 1) models, respectively.


    Simulations are performed on SPSS 16.0 platform using time-series analyzer. Based
    on forecast results, we note that ARIMA model performs better than ARMA with error
    statistics depicted in Table 3.2.


    This also reinforces the fact that ARIMA models are superior to ARMA models for
    forecasting nonstationary time series. Literature survey shows that ARIMA model
    is extensively used to forecast the wind speed and power and serves as a benchmark
    model to assess the forecast accuracy of a newly developed or hybrid model. In
    [14] a variant of ARIMA model, f-ARIMA, is used to predict the day ahead wind
    forecasts. In this model, f stands for fractional, where the differencing parameter
    d \in (-0.5, 0.5). Results reveal that f-ARIMA model is 42% more efficient than
    the persistence model.


    # 3.4 Machine learning-based models


    Wind flow depends on atmospheric variables like pressure, humidity, surface roughness,
    and elevation. The historical behavior plays a pivotal role'
