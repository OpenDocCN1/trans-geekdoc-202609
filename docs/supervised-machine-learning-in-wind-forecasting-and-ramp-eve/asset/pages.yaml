- pgno: 182
  md: 'A GRA-based framework is used to study wind forecasting in the presence of
    wind wakes. Benchmark wake models like Jensen’s and Frandsen’s models are tested
    against a novel bilateral Gaussian wake model. The proposed wake model is based
    on Gaussian variation of Jensen’s and Frandsen’s models. The model is tested for
    two datasets D1 and D2 considering single-wake and multiple-wake scenarios. The
    proposed model outperforms Jensen’s and Frandsen’s models. Further, forecasting
    is carried out where the wind speed time-series is decomposed into approximate
    and detail signals using the Daubechies wavelet with a five-level decomposition.
    The wavelet transform removes the noise components present in the series, and
    SVR is used to forecast wind speed. GRA is used as an important tool to identify
    the upstream turbines significantly contributing to wake effect. Results reveal
    that for both wind farm layouts, GRA improves the forecast accuracy.


