    The short-term wind speed forecasting, that is, 10 minutes for D1 and 1 hour for
    D2, is analyzed on the basis of standard metrics like RMSE, the sum of squared
    residuals, and the sum of squared deviations of testing samples (SST). Mathematical
    expressions for these metrics are


    ```

    RMSE = \sqrt{\frac{1}{N} \sum_{i=1}^{N} (\hat{X}_i - X_i)^2} \times 100\%, \quad
    SSR/SST = \frac{\sum_{i=1}^{N} (\hat{X}_i - \bar{X})^2}{\sum_{i=1}^{N} (X_i -
    \bar{X})^2}, \quad (8.28)

    ```


    where $\hat{X}_i, X_i$, and $\bar{X}$ are the predicted, actual, and mean values
    of the $N$ testing samples. Lower the RMSE and value better the forecasting model.
    A high SSR/SST ratio indicates a good agreement between actual and estimated values
    of testing samples.


