    # 2.4 Wind turbine micrositing


    Wind power extraction is dependent not only on the temporal distribution but also
    on the spatial distribution. As the number of wind turbines in a given wind farm
    increase, their lateral and longitudinal spacing affects the effective wind speed
    encountered at each turbine. Further, the terrain features for a particular wind
    farm site impact the power captured. Wind shear resulting from high wind speeds
    is also likely to cause damage to the blade geometry and tower strength. The process
    of optimal placement of wind turbines in a wind farm to maximize power capture
    and minimize cost of generating electricity is known as micrositing.


    Early studies in micrositing have dealt with the genetic algorithm being put into
    use for optimal wind farm layout as described by Mosetti et al. [16], where a
    wind farm with an area of 4 km² is divided into cells of size 5D, where D is the
    rotor diameter. Two cases, the first one with single wind speed direction and
    the second one with multiple wind direction, are considered. Results reveal that
    a random wind farm layout with 40 to 50 turbines has an efficiency of 50%, whereas
    an optimized wind'
