    # ## 7.2.2 Ramp event error analysis for TSVR and \(\epsilon\)-TSVR


    Similarly, TSVR and \(\epsilon\)-TSVR can be compared based on the same approach.
    Let \(e_{TSVR}\) and \(e_{\epsilon-TSVR}\) denote the errors in the wind ramp
    power between points \(g\) and \(h\) based on TSVR and \(\epsilon\)-TSVR, respectively.
    We have


    \(\hat{P}_{g3} = \frac{1}{2}(w_1 + w_2)k(x, x_g) + \frac{1}{2}(b_1 + b_2),\) (7.16)

    \(\hat{P}_{h3} = \frac{1}{2}(w_1 + w_2)k(x, x_h) + \frac{1}{2}(b_1 + b_2),\) (7.17)

    \(\hat{P}_{g4} = \frac{1}{2}(u_1 + u_2)k(x, x_g) + \frac{1}{2}(b_3 + b_4),\) (7.18)

    \(\hat{P}_{h4} = \frac{1}{2}(u_1 + u_2)k(x, x_h) + \frac{1}{2}(b_3 + b_4),\) (7.19)


    where \(b_1\), \(b_2\) and \(b_3\), \(b_4\) are bias terms, and \(\hat{P}_{g3}\),
    \(\hat{P}_{h3}\) and \(\hat{P}_{g4}\), \(\hat{P}_{h4}\) are the predicted values
