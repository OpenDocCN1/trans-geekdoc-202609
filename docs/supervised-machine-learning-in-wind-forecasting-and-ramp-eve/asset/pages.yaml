    Currently, wind installations have a total of 591 GW capacity with 51.3 GW newly
    added in 2018, out of which 4.5 GW is contributed by offshore wind farms as stated
    by the annual report of Global Wind Energy Council [7]. Recent developments in
    wind energy sector reveal that returns to the investment in building large wind
    parks is highly dependent'
