  md: '# 4.5 $\epsilon$-twin support vector regression


    Derived from a twin support vector machine, Shao et al. [17] propose a novel regressor,
    $\epsilon$-twin support vector regression ($\epsilon$-TSVR), which determines
    the pair of $\epsilon$-insensitive functions by solving two convex optimization
    problems. In terms of the objective function to be minimized, $\epsilon$-TSVR
    considers an added regularization term that solves the ill-conditioning problem
    of $Q^TQ$ as described in the previous section. The formulation of primal objective
    functions for $\epsilon$-TSVR is


    ```

    \(\begin{aligned}

    \min \quad & \frac{1}{2} C_3 (w_1^T w_1 + b_1^2) + \frac{1}{2} \xi^{*^T} \xi^*
    + C_1 e^T \xi, \\

    & \text{s.t. } Y - (Xw_1 + e b_1) = \xi^*, \\

    & Y - (Xw_1 + e b_1) \geq -e \epsilon_1 - \xi, \xi \geq 0, \\

    \min \quad & \frac{1}{2} C_4 (w_2^T w_2 + b_2^2) + \frac{1}{2} \eta^{*^T} \eta^*
    + C_2 e^T \eta, \\

    & \text{s.t. } Y - (Xw_2 + e b_2) = \eta^*, \\

    & Y - (Xw_2 + e b_2) \geq -e \epsilon_2 - \eta, \eta \geq 0.

    \end{aligned}\)


    (4.24)


    (4.25)


    (4.26)


    (4.27)

    ```


    In this optimization problem, $C_1, C_2, \epsilon_1, \epsilon_2$ are the hyperparameters
    that determine the regression performance. The Lagrangian function for these two
    primal problems can be written as


    ```

    \(\begin{aligned}

    L(w_1, b_1, \xi, \alpha, \beta) = \frac{1}{2} & (Y - (Xw_1 + e b_1))^T (Y - (Xw_1
    + e b_1)) \\

    & + \frac{1}{2} C_3 (w_1^T w_1 + b_1^2) + C_1 e^T \xi \\

    & - \alpha^T (Y - (Xw_1 + e b_1) + e \epsilon_1 + \xi) - \beta^T \xi, \\

    \end{aligned}\)


    (4.28)

    ```


    where $\alpha = (\alpha_1, \alpha_2, \dots, \alpha_n)$ and $\beta = (\beta_1,
    \beta_2, \dots, \beta_n)$ are the Lagrangian multipliers. To obtain the dual of
    the stated primal objective functions, KKT conditions are given by


    ```

    \(\left\{\begin{aligned}

    \frac{\partial L}{\partial w_1} = 0 \Rightarrow & -X^T(Y - Xw_1 - e b_2 - e \epsilon_1)
    + X^T \alpha + C_3 w_1 = 0, \\

    \frac{\partial L}{\partial b_1} = 0 \Rightarrow & -e^T(Y - Xw_1 - e \epsilon_1
    - e b_2) + e^T \alpha + C_3 b_1 = 0, \\

    \frac{\partial L}{\partial \xi} = 0 \Rightarrow & C_1 e^T - \alpha - \beta = 0,
    \\

    \frac{\partial L}{\partial \alpha} = 0 \Rightarrow & Y - (Xw_1 + e b_1) \geq -e
    \epsilon - \xi, \xi \geq 0,

    \end{aligned}\right.\)

    ```'
