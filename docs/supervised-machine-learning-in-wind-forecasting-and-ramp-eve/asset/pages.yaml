- pgno: 79
  md: '# Decision tree ensemble-based regression models


    Historical data in machine learning are a boon for data analysts round the world.
    In terms of regression models, benchmark models like the persistence algorithm
    and ARIMA described in Chapter 3 fail to express the nonlinear trend in wind speed
    time series. Machine learning models with kernel mapping capability are widely
    applicable in such cases.


    In terms of accuracy, machine learning models based on supervised learning give
    good generalization performance, which is the ability of a machine learning model
    to adapt to an unseen data. However, the need for ensemble-based forecasts arrives
    from the problem of overfitting, which occurs in models like support vector regression,
    multiple linear regression, and neural networks. We will discuss the overfitting
    scenarios in subsequent chapters considering real-time datasets. Decision trees
    aim to arrive at a decision of two types: continuous (regression) and discrete
    (classification).


    # 5.1 Random forest regression


    Proposed by Brieman [1], a random forest is an ensemble method that generates
    something akin to a forest of trees from a given training sample. Ensemble-based
    models are far more accurate than a single method owing to advantages like capturing
    linearity and nonlinearity of time series obtained from individual methods.


    A random forest begins with splitting the input features into a group of subsets
    that essentially form a tree. A particular tree is characterized by a node that
    leads to a number of branches, as depicted in Fig. 5.1.


    Similar to hyperparameters (σ and C) in SVR, in random forest regression, the
    number of trees and the number of random features in each tree decomposition are
    the parameters that decide the performance of regression. At each decision tree,
    a fitting function is created, which acts on the random features selected. Finally,
    at the end of the training process a random forest model is created. It is worth
    noting that during the training process, each tree is created from randomly selected
    input vectors and thus is called a “random” forest. Mathematically, the estimated
    output of a'
  merge: -1
  img_proc: true
- pgno: 80
  md: '![](img/b53e39e35231af65df8ccaa99eb28bee_80_0.png)


    Figure 5.1 Block diagram for random forest regression model.


    random forest regression is given as


    \(\hat{A} = \frac{1}{k} \sum_{i=1}^{k} \hat{r}(X, V_i),\) (5.1)


    where \(\hat{r}(X, V)\) is the representative tree at the end of training process,
    \(X\) is the set of input feature vectors, \(T\) is the collective set representing
    an input–output pair \(V_i = (x_1, y_1), (x_2, y_2), \dots, (x_n, y_n)\). The
    predicted output is averaged over \(k\) decision trees. An additional advantage
    of random forest regression is its insensitivity to noise due to uncorrelated
    trees via differential sampling of inputs. Fig. 5.1 illustrates the block diagram
    of random forest regression model. Decision trees are sensitive to the data on
    which they are trained. Changing the training data can change the predictions.


    Meanwhile a common problem of overfitting persists in machine learning regression
    models when a well trained model captures the noise component as well. To reduce
    the complexities posed by overfitting, a random forest makes a compromise between
    flexible and inflexible models. In the training phase, each regression tree repeatedly
    draws a sample from the'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'feature set. This ensures that even though the tree may possess a high variance,
    the overall variance of the forest may be low. A random forest works on the principle
    of bagging, which combines the predictions from different tree models to give
    an overall insight to the data under training. This also helps to reduce the potential
    overfitting caused by supervised machine learning models. In case of bagging the
    principle of negative correlation learning (NCL) is also applicable to regression-based
    problems [2]. In NCL a penalty term is added while computing the error of an individual
    sample in an ensemble. The modified error function for an individual sample i
    is given as


    ```

    E_i = \frac{1}{N} \sum_{i=1}^N \left(F_i(X) - y_i\right)^2 + \frac{1}{N} \sum_{i=1}^N
    \beta p_i, \qquad (5.2)

    ```


    where \(F_i(X)\) is the predicted output for \(i\)th sample, \(y_i\) is the actual
    value, \(\beta \in [0,1]\) is the term for control of the strength of the penalty,
    and \(p_i\) is the correlation function.


    Random forest regression is applied in several branches of engineering. Since
    random forests work well with missing data, variables like forest fires, rain
    flow, and soil erosion can be accurately predicted. Oliveira et al. [3] have used
    random forest (RF) regression to predict forest fires in the Mediterranean region
    of Europe. The data for fire density is collected from European Fire Database
    for the months from June to September. Variables like average elevation, minimum
    temperature, maximum temperature, and surface roughness are chosen as predictors.
    The predictions from RF model are compared with linear regression. The results
    reveal that RF model outperforms linear regression indicating a nonlinear relationship
    among the predictors and forest fires. Gong et al. have discussed a comparison
    between RF model and linear regression for predicting international roughness
    index (IRI). The data for roughness index and predictors are average precipitation,
    average freeze index, initial IRI measurement, and annual average daily traffic.
    Data of 11000 samples are taken and divided into training (80%) and testing (20%)
    set. The hyperparameters of RF model are optimized using a grid search method.
    The results in terms of MSE and \(R^2\) reveal that RF model performs better than
    the linear regression model.


    Smith et al. [4] discussed multiple linear regression (MLR) and random forest
    regression to predict concentration levels of various chemicals. The nonlinearity
    among multiple variables is accounted by the random forest model, and the results
    reveal that although MLR performed better than RF model, there are some cases
    where the predictive performance of RF model'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'is found much better. Yuchi et al. [5] explored a random forest model and multiple
    linear regression for predicting the concentration of a particulate matter. The
    particulate matter PM2.5 is predicted based on several predictor variables like
    outdoor PM2.5 concentration, season, the number of gears, and the number of cleaners
    deployed. A total of 447 samples are assessed and a cross validation technique
    with 10 folds is used for all the models. Individual models like MLR and RF result
    in R2 values of 0.502 and 0.498, respectively, whereas a blended model accounting
    MLR and RF gave an R2 value of 0.815, indicating its superiority in predicting
    the indoor PM2.5 concentration.


    Zahedi et al. [6] presented an RF model for predicting the solid particle erosion
    in elbow pipe fittings. Predictor variables like pipe diameter, particle size,
    liquid viscosity, and material hardness are chosen for this purpose. The performance
    of RF model is compared with benchmark model like linear regression, support vector
    machines, and neural network. The results indicate a good agreement in predicted
    and experimental values with RF model. It is also observed that the RF model overpredicts
    the erosion rate, which is possibly due to influence of different predictor variables
    over each other. We now discuss two case studies for random forest model that
    deal with rainfall and crude oil price prediction.


    # 5.1.1 Monthly rainfall prediction: a case study


    To test the effectiveness of the random forest model against benchmark models
    like persistence algorithm, a case study for monthly rainfall prediction in the
    state of Himachal Pradesh, India, is carried out. Monthly rainfall data from 1901–2017
    are taken, and a total of 1404 samples are segmented into training and testing
    sets. As far as inputs to the model are concerned, the rainfall time series is
    decomposed into various low- and high-frequency components using wavelet transform.
    The predictors for this random forest model include detail components and the
    fifth approximate signal, where the latter represents low-frequency component.
    The regression is carried out with 800 training samples and remaining 604 for
    testing.


    Table 5.1 depicts the performance metrics for a random forest model. In terms
    of RMSE, a value of 25.14 indicates a high error when compared to the persistence
    algorithm and ARIMA model. This poor performance is depicted by a low SSR/SST
    value, indicating that for the current dataset, the quality of predictors in terms
    of wavelet decomposition is not sufficient to carry out regression analysis as
    per RF model.'
