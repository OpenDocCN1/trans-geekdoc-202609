  md: '$$L(v|\alpha, \beta) = n[\log \alpha + 2 \log \beta - \log(\beta + 1)] + \sum_{i=1}^n
    \log(1 + v_i) + (\alpha + 1) \sum_{i=1}^n \log \left( 1 - \frac{1 + \beta + \beta
    v}{1 + \beta} e^{-\beta v} \right) - \beta \sum_{i=1}^n v_i. \tag{2.10}$$


    Further, differentiating the log likelihood function with respect to $\alpha$
    and $\beta$, we get


    $$\frac{\partial L(v|\alpha, \beta)}{\partial \alpha} = \frac{n}{\alpha} + \sum_{i=1}^n
    \log \left( 1 - \frac{1 + \beta + \beta v}{1 + \beta} e^{-\beta v} \right). \tag{2.11}$$


    $$\begin{aligned} \frac{\partial L(v|\alpha, \beta)}{\partial \beta} &= \frac{n}{\beta}
    - \sum_{i=1}^n x_i + (\alpha + 1) \sum_{i=1}^n \left[ \frac{1 - \frac{e^{-\beta
    v}}{(1+\beta)^2} + v e^{-\beta v}}{1 - \frac{1+\beta+\beta v}{1+\beta} e^{-\beta
    v}} \right] \\ &- (\alpha + 1) \sum_{i=1}^n \left[ \frac{\frac{e^{-\beta v}}{(1+\beta)^2}
    + v e^{-\beta v}}{1 - \frac{1+\beta+\beta v}{1+\beta} e^{-\beta v}} \right]. \tag{2.12}
    \end{aligned}$$


    Since Eqs. (2.11) and (2.12) have nonlinear terms, the solutions of $\alpha$ and
    $\beta$ can be obtained using optimization methods like quasi-Newton methods that
    converge faster than the Newton method. The estimates $\hat{\alpha}$ and $\hat{\beta}$
    are determined using the PSO algorithm. Fig. 2.5 illustrates the generalized Lindley
    fit for real-time wind speed data.


    # **2.3.1.3 Stacy-Mihram distribution model**


    Another class of Weibull distribution model is the Stacy–Mihram model, which generally
    adequately describes the wind speed distribution. The two-parameter model is given
    as


    $$f_{stm}(v) = \frac{\beta v^{\beta-1}}{\alpha^\beta} e^{-(\frac{v}{\alpha})^\beta},
    \quad v > 0. \tag{2.13}$$


    Parameters $\alpha$ and $\beta$ can be estimated using MLE, for which the log
    likelihood function is given as


    $$L(v|\alpha, \beta) = n \log \beta - n \beta \log \alpha + (\beta - 1) \sum_{i=1}^n
    \log(v_i) - \sum_{i=1}^n \left( \frac{v_i}{\alpha} \right)^\beta. \tag{2.14}$$


    Fig. 2.6 shows the Stacy–Mihram fit for a wind speed time-series.'
