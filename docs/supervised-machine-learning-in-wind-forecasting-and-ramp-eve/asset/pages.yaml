    # 2.3 Wind speed distribution


    The wind speed distribution of a particular regime depends on the topographical
    features like air temperature, pressure, humidity, and so on. Various wind speed
    distribution functions like Weibull, Rayleigh, log-normal, and gamma distributions
    have been proposed in the literature [8]. Amongst the listed probability distribution
    functions, the Weibull distribution is most commonly used because of its simplicity.


    The Weibull distribution is widely used in applications like reliability analysis
    (failure rate), industrial engineering (to represent manufacturing and delivery
    time), and wind speed distribution [9]. The Weibull distribution holds several
    advantages like flexibility and generally gives a good fit to the observed wind
    speed [10]. However, the Weibull distribution cannot accurately estimate all the
