    | | SSR/SST | 1.0483 | 1.0488 |

    | Frandsen 模型 | | | |

    | | | 无 GRA | 有 GRA |

    | D1 | RMSE (%) | 3.68 | 3.31 |

    | | SSR/SST | 1.0986 | 1.0928 |

    | D2 | RMSE (%) | 9.02 | 6.43 |

    | | SSR/SST | 1.0552 | 1.0578 |

    | 拟议模型 | | | |

    | | | 无 GRA | 有 GRA |

    | D1 | RMSE (%) | 2.86 | 2.56 |

    | | SSR/SST | 1.1087 | 1.1902 |

    | D2 | RMSE (%) | 7.33 | 4.91 |

    | | SSR/SST | 1.0270 | 1.0020 |


    表 8.5 显示了基于 Jensen 和 Frandsen 尾流模型，针对两个数据集 D1 和 D2 的风机 \(WT_5\) 预测结果。


    Frandsen 模型的风速预测精度优于 Jensen 模型。采用拟议模型，对数据集 D1 和 D2 进行短期风速预测，并将结果与基准模型进行研究。对于数据集
    D1，发现 RMSE 低于 Jensen 和 Frandsen 模型。对于数据集 D1，无 GRA 时 RMSE 为 2.86%，而对于数据集 D2，RMSE
    为 7.33%。对于数据集 D1，基于无 GRA 的 Jensen 模型的 RMSE 值为 6.53%，基于 Frandsen 模型则为 3.68%。Jensen
    模型的 SSR/SST 比值为 1.0897，使用 Frandsen 模型时为 1.0986。通过在预测模型中引入 GRA，Frandsen 模型的 RMSE
    为 3.31%，Jensen 模型的 RMSE 为 5.84%。Frandsen 模型的 SSR/SST 比值发现优于 Jensen 模型，从而表明基于该模型的风速预测更好。较高的
    SSR/SST 比值意味着实际值与估计值之间的一致性较好。


