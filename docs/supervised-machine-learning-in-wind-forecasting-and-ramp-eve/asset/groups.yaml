    However, due to nonlinearity in wind speed series, machine learning approaches
    like ANNs, SVR [23], and ELM have been found in use recently. Patel et al. [2,24]
    have discussed forecasting algorithms for wind power dispatch for multiple wind
    farms considering battery life optimization.


    Forecasting wind speed in the presence of wind wakes is an uphill task. Wind wakes
    cause reduction in power captured from wind resource, and thus optimal placement
    of wind turbines in a farm leads to efficient land area usage. In case of a wake
    affected downwind turbine the most significant upwind turbines affect the forecasting
    accuracy of the downwind turbine. In the present context, most significant upwind
    turbines are the turbines whose wake effect causes maximum power deficit at a
    downwind turbine. The major contributions of this chapter are as follows.


    +   1. A bilateral Gaussian wake model comprising Jensen and Frandsen components
