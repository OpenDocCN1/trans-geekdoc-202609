    # 6.2 Wavelet transform


    Signal processing techniques have been used in tandem with machine learning methods
    to improve the forecast accuracy and eliminate the stochastic'
  - '[PAGE 95]


    variations in the time-series. Signal transforms like the Fourier transform, wavelet
    transform, and wavelet packet decomposition are the common algorithms used. A
    major drawback of using the Fourier transform in wind speed decomposition is the
    loss of information with respect to time scale, which is overcome by the wavelet
    transform. The wavelet transform captures information of a signal in both time
    and frequency scales. Since temporal variations hold greater importance in wind
    speed time-series analysis, the Fourier transform is not preferred.


    The idea of wavelet transform, first put forward by a geophysicist Jean Moret
    in 1982 for seismic wave analysis, can be categorized as the continuous wavelet
    transform (CWT) and discrete wavelet transform (DWT). The continuous wavelet involves
    the continuous scaling and time shifting of the mother wavelet. The high scaling
    (low-pass filter) gives approximate information about the signal, whereas low
    scaling (high-pass filter) gives a detailed information of the signal. Computationally,
    DWT is richer than CWT due to which the former finds more use in signal processing.
    Mathematically, CWT and DWT are given as


    ```

    B(a, b) = \frac{1}{\sqrt{a}} \int_{-\infty}^{+\infty} r(x)\phi\left(\frac{x -
    b}{a}\right), \quad (6.1)


    B(u, v) = 2^{-u/2} \sum_{t=0}^{N-1} r(t)\phi\left(\frac{t - v \cdot 2^u}{2^u}\right),
    \quad (6.2)

    ```


    where r(t) is the wind speed time series, N is its length, \(\phi\) is the mother
    wavelet function, and the scaling and translation parameters are functions of
    integers u and v. First, the original wind speed time series is decomposed into
    low- and high-frequency components. The primary objective of the wavelet transform
    is to collect the vital information from the wind speed time series. With respect
    to wind forecasting, the appropriate decomposition signals are selected as inputs
    to the forecasting model. The wavelet filter can be chosen from a group of wavelet
    families such as Haar, Daubechies, Mexican hat, and Coiflet [15]. The WT process
    involves a successive decomposition of approximation signal at each stage, as
    shown in Fig. 6.1.


    The two signals obtained at each decomposition stage are approximate signals (A5,
    containing low-frequency components) and detail signals (D1, ..., D5 with high
    frequencies), which together form a matrix of input features. The wind speed is
    the output used in short-term wind forecasting algorithm (SVR and its variants),
    as depicted in Fig. 6.2.'
