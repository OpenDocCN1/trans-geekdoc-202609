    ### 7.3.2 Discussion on uncertainties in ramp events


    Results obtained so far depict that SVR–based regressors have an upper hand over
    RFR and GBM based prediction methods. It is worth noting that in the study ramp
    events the time interval between consecutive samples plays an important role in
    deciding the threshold value. In a study carried out by Ouyang et al., the wind
    speed data collected is sampled every 15 minutes for a wind farm site in China,
    and ARIMA model is used to forecast wind power [47]. Further, the swinging door
    algorithm is used to detect ramp events. The RMSE values for the ramp event prediction
    are found to be in the range of 32%. Further, using machine learning techniques
    such as classical SVR, GPR, MLP, and ELM, the ramp events are predicted for a
    time interval 6 h, and RMSE values are found to be in the range 5–7 MW.


    However, wind speed time series of onshore and offshore wind farms has a lot of
    variability in terms of magnitude. Thus a ramp event study with 10 minutes as
    time interval poses critical impositions in market clearing and day-ahead scenarios.
    The current work deals with predicting wind power ramp events with 10-min sampling
    interval for onshore and offshore wind sites. With offshore wind farms, the wind
    speed being high and variable, the probability of ramp event increases. Thus,
    in the current work, we extend the ramp event prediction study by incorporating
    advanced machine learning algorithms like variants of SVR, random forest regression,
    and gradient boosted machines. Results reveal that the TSVR-based prediction model
    yields the lowest error for ramp-up and ramp-down events.


