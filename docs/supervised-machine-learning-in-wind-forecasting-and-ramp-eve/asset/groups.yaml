    Jensen 和 Frandsen 估计的速度缺损基于顶帽状速度分布。多项风洞实验表明，远尾流区域横向方向的速度缺损服从高斯分布 [12]。Wu 和 Porté-Agel
    [27] 基于大涡模拟（LES）框架研究了独立风机尾流的湍流影响。远尾流末端的速度缺损假设服从高斯分布 [28]，如下所示


    \(u = u_0 \left( 1 - A(x) e^{\frac{-r^2}{2\sigma^2}} \right), \quad (8.7)\)


    \(A(x) = 1 - \sqrt{1 - \frac{C_t}{8(\sigma/2r_0)^2}}, \quad (8.8)\)


