    ### 7.3.2 爬坡事件不确定性讨论


    迄今所得结果表明，基于 SVR 的回归器优于基于 RFR 和 GBM 的预测方法。值得注意的是，在爬坡事件研究中，连续样本之间的时间间隔在确定阈值方面起着重要作用。在欧阳等人开展的一项研究中，中国某风电场收集的风速数据每
    15 分钟采样一次，并使用 ARIMA 模型预测风力发电 [47]。此外，摆动门算法用于检测爬坡事件。爬坡事件预测的 RMSE 值发现范围在 32%。此外，使用经典
    SVR、GPR、MLP 和 ELM 等机器学习技术，对 6 h 时间间隔的爬坡事件进行预测，RMSE 值发现范围为 5–7 MW。


    然而，陆上和海上风电场的风速时间序列在幅度方面存在很大变异性。因此，以 10 分钟为时间间隔的爬坡事件研究在市场清算和日前情景中带来了关键要求。本工作涉及使用
    10 分钟采样间隔对陆上和海上风电场进行风力发电爬坡事件预测。对于海上风电场，由于风速高且变化大，爬坡事件的概率增加。因此，在本工作中，我们通过融合先进的机器学习算法（如
    SVR 变体、随机森林回归和梯度提升机），扩展了爬坡事件预测研究。结果表明，基于 TSVR 的预测模型在爬升和爬降事件中产生最低误差。


