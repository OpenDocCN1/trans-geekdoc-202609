    ## 7.1.1 Reservoir wall: a case study from Valsad, Gujarat


    Reservoirs are often found in use to store rainfall water and to mobilize it during
    the periods of scanty rainfall. Construction of such a storage mechanism requires
    a dam to be built on the natural course of river flow, referred as an impounding
    dam [22]. Wind speed flowing over the water surface of reservoirs often generate
    waves, which cumulatively impinge on the reservoir wall and exert force. Wave
    height generated at the reservoir surface can be determined empirically using
    Molitor’s relationship between the wind velocity U and wave height zd as stated
    in (7.1).


    A case study is undertaken for Chasmandva reservoir located near the river Tan,
    a tributary of river Auranga in Valsad district of Gujarat (20°37''02" N and 73°22''36"
    E) with a fetch length of F = 4.38 km.


