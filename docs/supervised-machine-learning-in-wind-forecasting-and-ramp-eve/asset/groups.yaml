    and are compared with field measurements. Results reveal that the proposed 2D
    Jensen wake model underestimates for near-wake regions [11]. Ishihara et al. [12]
    have presented an analytical model that encapsulates the effect of thrust coefficient
    and air turbulence on the wake deficit. The numerical simulations are compared
    with a test carried out in a wind tunnel, and the results of the proposed analytical
    model are in good agreement with experimental analysis.


    Wind wakes causing power loss for an individual wind turbine lead to a detailed
    study of wind wakes, and hence over the years many analytical and field models
    have been developed to study them [13], [14]. Experimental results have shown
    that due to wake interference, the downwind turbine experiences up to 40% of power
    loss and 80% of increased dynamic loading on the turbine structure [15]. Here
    an experimental setup for wind turbine with rotor diameter 0.9 m is placed 4 rotor
    diameters from the wind inlet section, and the wake velocity distribution is measured
    at a downstream distance of 0.6D and 3D. Jensen''s wake model is validated and
    tested for accommodating the power losses in wind, and the losses are found in
    acceptable range [16–18]. Wake study also plays an important role in the wind
    farm layout optimization problem (WFLOP), where optimal placement of the wind
    turbines leads to minimum wake effect and maximum power capture [19].


    Wind being stochastic in its nature, its accurate forecasting is a major challenge
    in power industry. Wind speed forecasting has become an essential component to
    ensure power system security and reliability as increased wind power penetration
    leads to an unreliable operation [20]. It also serves the purpose of market clearing
    operations and efficient load dispatch planning. Wind forecasting is broadly categorized
    on the basis of prediction horizon, that is, very short-term (from a few seconds
    to 30 min), short-term (from 30 min to 6 h), medium term (from 6 h to 1 day),
    and long-term (from 1 day to 1 week) wind forecasting [21]. Okumus et al. [22]
    have reviewed recent forecasting schemes, which include hybrid methods for improving
    the accuracy of prediction. Among these, the most used forecasting methods are
    a combination of two or more machine learning methods combined with a time-series
    model (ARMA and ARIMA). Further, on the basis of methods of forecasting like time-series-based
    forecasting models like ARMA and ARIMA methods are employed for short-term wind
    speed and power forecasts. However, due to nonlinearity in wind speed series,
    machine learning approaches like ANNs, SVR [23], and ELM have been found in use
    recently. Patel et al. [2, 24] have discussed forecasting algorithms for wind
    power dispatch for multiple wind farms considering battery life optimization.


    Forecasting wind speed in the presence of wind wakes is an uphill task. Wind wakes
    cause reduction in power captured from wind resource, and thus optimal placement
    of wind turbines in a farm leads to efficient land area usage. In case of a wake
    affected downwind turbine the most significant upwind turbines affect the forecasting
    accuracy of the downwind turbine. In the present context, most significant upwind
    turbines are the turbines whose wake effect causes maximum power deficit at a
    downwind turbine. The major contributions of this chapter are as follows.


    - 1. A bilateral Gaussian wake model comprising Jensen and Frandsen components
    is proposed and tested for single wake and multiple wake scenarios for two artificial
    wind farm layouts with two wind speed datasets.

    - 2. Short-term wind speed forecasting is studied considering the wake effects,
    and significant upwind turbines are identified using Grey relational analysis.
    Forecasting accuracy is analyzed for proposed bilateral Gaussian wake model and
    benchmark models.


    This chapter is organized as follows. Section 8.2 describes various wind wake
    models: Jensen''s, Frandsen''s, and the proposed bilateral Gaussian wake models.
    Further, Section 8.3 discusses the individual methodologies for short-term wind
    speed forecasting in the presence of wakes. In Section 8.4, we present results
    and discussions.


