    ### 4.5 \(\epsilon\)-双子支持向量回归


    源自双子支持向量机，Shao等人[17]提出了一种新型回归器，即\(\epsilon\)-双子支持向量回归（\(\epsilon\)-TSVR），它通过求解两个凸优化问题来确定一对\(\epsilon\)-不敏感函数。就待最小化的目标函数而言，\(\epsilon\)-TSVR考虑了一个附加的正则化项，以解决前一节中描述的\(Q^TQ\)病态问题。\(\epsilon\)-TSVR的原始目标函数公式为


    \(\begin{aligned}

    \min \quad & \frac{1}{2} C_3 (w_1^T w_1 + b_1^2) + \frac{1}{2} \xi^{*^T} \xi^*
    + C_1 e^T \xi, \\

    & \text{s.t. } Y - (Xw_1 + e b_1) = \xi^*, \\

    & Y - (Xw_1 + e b_1) \geq -e \epsilon_1 - \xi, \xi \geq 0, \\

    \min \quad & \frac{1}{2} C_4 (w_2^T w_2 + b_2^2) + \frac{1}{2} \eta^{*^T} \eta^*
    + C_2 e^T \eta, \\

    & \text{s.t. } Y - (Xw_2 + e b_2) = \eta^*, \\

    & Y - (Xw_2 + e b_2) \geq -e \epsilon_2 - \eta, \eta \geq 0.

    \end{aligned}\)


    (4.24)


    (4.25)


    (4.26)


    (4.27)


    在这个优化问题中，$C_1, C_2, \epsilon_1, \epsilon_2$是决定回归性能的超参数。这两个原始问题的拉格朗日函数可写为


    \(\begin{aligned}

    L(w_1, b_1, \xi, \alpha, \beta) = \frac{1}{2} & (Y - (Xw_1 + e b_1))^T (Y - (Xw_1
    + e b_1)) \\

    & + \frac{1}{2} C_3 (w_1^T w_1 + b_1^2) + C_1 e^T \xi \\

    & - \alpha^T (Y - (Xw_1 + e b_1) + e \epsilon_1 + \xi) - \beta^T \xi, \\

    \end{aligned}\)


    (4.28)


    其中\(\alpha = (\alpha_1, \alpha_2, \dots, \alpha_n)\)和\(\beta = (\beta_1, \beta_2,
    \dots, \beta_n)\)为拉格朗日乘数。为了求得上述原始目标函数的对偶问题，KKT条件给出如下


    \(\left\{\begin{aligned}

    \frac{\partial L}{\partial w_1} = 0 \Rightarrow & -X^T(Y - Xw_1 - e b_2 - e \epsilon_1)
    + X^T \alpha + C_3 w_1 = 0, \\

    \frac{\partial L}{\partial b_1} = 0 \Rightarrow & -e^T(Y - Xw_1 - e \epsilon_1
    - e b_2) + e^T \alpha + C_3 b_1 = 0, \\

    \frac{\partial L}{\partial \xi} = 0 \Rightarrow & C_1 e^T - \alpha - \beta = 0,
    \\

    \frac{\partial L}{\partial \alpha} = 0 \Rightarrow & Y - (Xw_1 + e b_1) \geq -e
    \epsilon - \xi, \xi \geq 0,

    \end{aligned}\right.\)

