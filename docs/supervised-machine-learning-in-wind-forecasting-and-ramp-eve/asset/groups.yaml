    [3] is used to predict the next 1 min and 1 h ahead forecasts. Data mining approach
    is also used to forecast wind speeds for a duration from 10 s to 5 min ahead [4].


    Apart from these methods, several intelligent learning methods like artificial
    neural networks (ANNs) and, in particular, deep neural networks (DNNs) [5] are
    used for forecasting wind speeds up to 10 min, 30 min, and 1 h ahead. Support
    vector machines (SVMs), hybrid methods combining empirical wavelet transform (EWT)
    with neural networks (NNs) also form core of the very-short-term wind forecasting
    process. Recent advances in the forecasting domain show evolution of machine learning
    algorithms, with decomposition forecasting algorithms (DFA) being most in use.
    The essence of a decomposition algorithm lies in breaking the time series of a
