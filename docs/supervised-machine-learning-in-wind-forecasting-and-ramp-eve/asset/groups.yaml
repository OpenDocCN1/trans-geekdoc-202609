    This chapter discusses the short-term wind forecasting in the presence of wakes
    by considering two different wind farm layouts and numbers of wind turbines. The
    wake effect is studied based on the models proposed by Jensen and Frandsen. For
    single-wake scenario, the proposed bilateral Gaussian wake model is compared with
    Frandsen''s and Jensen''s models for different downwind distances. In a wind farm
    a downwind turbine experiences wakes due to multiple turbines, thus creating a
    shadowing effect. The multiple-wake scenario is tested for a five-turbine wind
    farm layout, and our proposed model outperformed Frandsen''s model by 75.75% and
    Jensen''s model by 91.75% in terms of RMSE. The short-term wind forecasting is
    carried out using a hybrid method based on wavelet decomposition and SVR. The
    inputs for the forecasting model are selected based on grey correlation degree
    and only significant inputs, that is, upwind turbines are selected as inputs to
    forecast wind speed for the downwind turbine.'
