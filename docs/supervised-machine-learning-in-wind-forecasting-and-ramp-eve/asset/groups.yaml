    ## 7.3 陆上和海上风电场的爬坡事件分析


    可再生能源领域的最新进展已简化了许多发展中国家的电力生产组合。以风能为驱动力，陆上和海上技术在全球范围内都吸引了巨额投资 [36]。陆上风电场靠近公用电网具有优势，而海上风电场需要长输电缆将海上电力输送到电网。然而，与陆上相比，海上地区具有强劲的风场，这在很大程度上补偿了远离电网的不足，因此海上风电场的安装数量急剧增加。此外，由于湍流更小、风速更均匀，海上场景下风力涡轮机的寿命更长
    [37]。海上风电场的劣势在于安装和工程成本较高，以及发电机和机械设备的磨损。另一方面，陆上风电场在有限土地可用性、视觉侵入和野生动物受损方面面临接受度挑战。陆上和海上风电场运行之间的决定性因素是地表粗糙度长度。观察表明，地表长度越大，风速降低越高，理论上地面处的风速为零
    [38]。


