    \)-TSVR 在 RMSE 方面分别比 \( \varepsilon \)-SVR 优异 3.537%、63.03% 和 59.60%。在所有模型中，\(
    \varepsilon \)-TSVR 和 TSVR 在所有数据集的 RMSE 和 MAE 方面定量优于 LS-SVR 和 \( \varepsilon \)-SVR。在
    \( \varepsilon \)-SVR 中，拉格朗日矩阵尺寸较大且使用不等式约束；然而，LS-SVR 使用等式约束，计算速度更快。


    此外，TSVR 是 \( \varepsilon \)-SVR 和 LS-SVR 的混合体，采用两种二次规划公式，具有更好的推广能力。LS-SVR 由于优化问题规模较小，处理器时间最少。\(
    \varepsilon \)-TSVR 所需时间少于经典 \( \varepsilon \)-SVR 和 TSVR，在四个数据集中，B、C 和 D 对于各自模型的计算时间大致相同。SSR/SST
    和 SSE/SST 比率提供拟合优度的估计。SSR/SST 比率值大于 1 意味着训练过程中存在过拟合，这在测试阶段是不可取的。在所有回归器中，TSVR 获得最优的
    SSR/SST 和 SSE/SST 比率。最优 SSR/SST 比率接近 1 但不大于 1。当发生过拟合时，SSR/SST 取值大于 1，这最终会降低预测精度。预测从统计角度评估，通过确定所有模型的一致性指数（IOA）和
