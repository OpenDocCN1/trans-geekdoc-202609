    这种信号分解用于通过计算基于 TSVR、RFR 和 GBM 的预测斜坡信号的对数能量熵来评估斜坡事件信号的随机性，如表 7.10 所示。


    对于某个特定预测模型，基于 WT 的对数能量熵大于基于 EMD 的对数能量熵，这表明斜坡事件信号中存在高阶随机性。就不确定性而言，基于分解的预测模型优于文献中列出的单一方法，能够获得更好的斜坡预测效果。在本工作中，研究了六个陆上和六个海上风电场的风电功率斜坡事件。收集了
    2019 年 3 月、采样间隔为 10 分钟的风速数据。所有数据集的可用数据均转换为 90 m 的轮毂高度。阈值选定为额定风电功率的 10%，并以此评估斜坡事件点的绝对误差。基于机器学习的预测模型与基准持续性模型进行了比较。基于
    TSVR 的模型在斜坡上升和斜坡下降事件中均给出最小误差。对于海上风电场数据集，RFR 和 GBM 的性能系数（R²）接近 1.00，表明预测值与实际值之间吻合良好。此外，观察到预测斜坡下降事件的误差大于斜坡上升事件。


    总体而言，基于机器学习的预测模型是分析短期风电斜坡的良好近似器。使用信号分解技术评估了 TSVR、RFR 和 GBM 情况下的风电功率斜坡系列随机性，且采用
    RFR 时随机性最小。像 TSVR 和 GBM 这样的机器智能模型表明，在存在大规模斜坡上升和斜坡下降事件时，可以保持电网稳定运行。在回归器中，ε-TSVR
    在绝对误差方面优于 TSVR、LS-SVR 和 ε-SVR。对不同轮毂高度的斜坡事件进行了分析，记录的斜坡事件数量随高度显著增加。机器智能混合方法提高了斜坡事件期间风电场的预测性能。


