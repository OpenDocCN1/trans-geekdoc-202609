    ## 第 2 章


    ## 风能基础


    在过去几十年中，风能领域的投资大幅增加。丰富的风能资源促使全球装机容量增加。能源需求推动可再生能源技术的发展，太阳能、风能和生物质能作为先驱，许多发展中国家已开始利用可持续能源。蒸汽发电厂产生的碳足迹，通过利用风能资源发电可以得到显著改善。随着风电技术的发展，运维（O&M）领域的就业机会激增，从而降低了发展中国家的失业率。根据全球风能理事会（GWEC）报告
    [1]，2017 年，南非风能领域装机容量为 2.08 GW，创造了 15,000 个就业岗位，欧洲有 262,712 个，印度次大陆有 60,000 个。丰厚的上网电价确保了陆上和海上风电技术的支持。尽管有很多好处，风能领域也会导致水生生物失衡、高昂的初始投资成本以及土地获取方面的程序问题。然而，先进制造技术使风能安装快速发展，且海上场址的风况远强于陆上场址，从而激励投资者参与投标过程。风力涡轮机带来的威胁包括鸟类死亡、高噪音水平以及担心家畜安全的当地社区的反对。


    风电场在布局时考虑空间限制，近年来对在任何风向下运行的萨沃尼乌斯式风力涡轮机（SSWT）给予了高度重视。Roy 等人 [2] 探索了一种基于差分进化的反向方法，用于计算最佳涡轮机参数。结果显示，SSWT
    的面积减少了 9.8%。此外，Gupta 和 Biswas [3] 提出了一种二维 CFD 模型，用于研究扭转三叶片 H-Darrieus 转子的稳态性能。考虑到风速的随机性，精确的风速预测对风电场运营商有益。然而，预测风速/功率与实际风速/功率的误差处理有助于选择合适的预测算法。人工神经网络（ANN）、支持向量回归（SVR）[4,5]、高斯过程回归（GPR）、模糊逻辑和极端学习机等机器学习模型广泛应用。


    ### 2.1 风力发电基础


    从移动空气中提取功率并非新鲜事，这项做法已有悠久历史。不断增长的能源需求对可再生能源领域产生了积极的推动作用。在各种可再生能源中，风能是为电网提供不间断电力的有前景领域。风能不仅清洁，而且为拥有风能资源的国家提供了经济解决方案。风电场配备了利用风能动能产生可用电力的涡轮机。这些电力通过输电线和电缆馈入电网。从根本上讲，转子面积为
    $A_r$ 的涡轮机从密度为 $\rho_w$、速度为 $u_\infty$ 的移动空气中提取的功率由下式给出：


    $P_w = \frac{1}{2} \rho_w A_r u_\infty^3.$ (2.1)


    基本上，提取的功率与风速 $u_\infty$ 和转子面积 $A_r$ 成正比。然而，受土地限制和制造成本影响，转子尺寸对大型风力涡轮机构成限制。因此，可以适当开发高风速地区，以提升风电场的捕风能力。此外，(2.1)
    描述了从风能中可能提取的理论功率。然而，在现实中，只有其中一小部分功率可用于机械到电能的转换，这一比例称为功率系数。不同转子配置的风力涡轮机具有不同的功率系数。理论上，功率系数的最大值可以基于风力涡轮机的作用盘模型（ADM）计算，该模型将风力涡轮机视为对流体流动施加力的圆盘。功率系数的最大值为
    0.5926，称为贝兹极限 [6]。


    ### 2.2 风能资源评估


    目前，根据全球风能理事会 [7] 的年度报告，风电装机总容量为 591 GW，其中 2018 年新增 51.3 GW，海上风电场贡献了 4.5 GW。风能领域的最新进展表明，建设大型风电场的投资回报高度依赖于风况的性质。在确定风电场场址时，特别关注涡轮机拓扑结构、风速分布、风电预测和地形性质。涡轮机技术是风能潜力的关键驱动因素之一。通常根据旋转轴分为两种涡轮机配置，即水平轴风力涡轮机（HAWT）和垂直轴风力涡轮机（VAWT）。常用的
    HAWT 应用于商业化的中小型发电，而 VAWT 主要用于小规模发电，即小于 100 kW。通用电气、Gamesa、Vestas、Siemens 和 Suzlon
    集团等知名公司积极参与风力涡轮机制造市场。


    以利润最大化为主要目标的风电场公司，通过优化利用风能资源开展风能资源评估。对风况的科学分析旨在从风速变异性、湍流特性以及爬坡事件的性质和频率等方面，定量和定性地确定风场的真正潜力。本书旨在深入探讨涉及这些属性的不同方面，以便了解如何最大限度地提高风电场的电力输出。即使风电场已投入运营，仍有可能安装叶片延伸件等设备，以提高生产效率。有效的叶片健康监测是另一种风能资源评估方法，从长远来看非常有效。


    ### 2.3 风速分布


