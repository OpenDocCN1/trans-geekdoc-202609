    [11]。图 2.1 展示了巴西 Praia Formosa 风电场风速数据的频率分布图。


    从图中可以观察到，频率分布有两个风速峰值，从而表明存在双峰分布。风速数据涵盖从 2017 年 1 月 1 日至 2017 年 4 月 30 日的四个月时间。频率分布图有助于从最大值、最小值和平均风速等方面研究风况的统计特性。


    ## 2.3.1 风速概率密度函数


    概率密度函数在统计学及其他计算领域中广泛应用，其中风速等随机变量的发生概率在数学上被描述。然而，风速不是影响风力涡轮机捕获功率的唯一变量。风速与风向之间的相关性同样重要。文献还显示混合密度函数的实现，即由多个概率密度函数组合而成，每个函数都关联一个权重
    [12]。


    ## 2.3.1.1 威布尔分布


    最常用的风速 PDF 是威布尔分布，它适用于几乎所有风况。两参数（$k$ 和 $\lambda$）威布尔 PDF 表示为


    $f(v; k, \lambda) = \frac{k}{\lambda}(\frac{v}{\lambda})^{k-1} e^{-(\frac{v}{\lambda})^k},$
    (2.2)


    其中 $k, \lambda > 0$，且 $v > 0$ 是称为风速（单位：m/s）的随机变量；$k$ 称为形状参数。威布尔参数可通过最大似然法 [13]
    进行估计。同样，联合威布尔 PDF 可用于建模双峰风况的风电场。两分量联合威布尔 PDF 可表示为


    $$f_i(v; k_i, \lambda_i) = \frac{k_i}{\lambda_i}(\frac{v}{\lambda_i})^{k_i-1}
    e^{-(\frac{v}{\lambda_i})^{k_i}}, \quad i=1, 2,$$

    $$f(v; k, \lambda) = w_1 f_1(v; k_1, \lambda_1) + (1 - w_1) f_2(v; k_2, \lambda_2),
    \quad (2.3)$$


    其中 $k_1, \lambda_1$ 和 $k_2, \lambda_2$ 分别表示各个 PDF 的形状和尺度参数，进而可通过最大似然估计（MLE）进行估计。


