    2.3 展示了威布尔分布拟合。


    ### 2.3.1.2 风速林德利分布


    单峰风况可由威布尔分布和伽马分布描述 [11]。在极低和极高风区，据报道威布尔及其他 PDF 表现不佳，此类情况下建议采用林德利分布函数 [14]。林德利分布有两种版本，即广义林德利和幂林德利，如
    [14] 所述。对于随机风速变量 \( \upsilon \)，广义林德利 \( f_{gl} \) 和幂林德利 \( f_{pl} \) PDF 可表示为


    \( f_{gl}(\upsilon) = \frac{\alpha \beta^2}{\beta + 1}(1 + \upsilon)\left(1 -
    \frac{1 + \beta + \beta \upsilon^2}{1 + \beta}e^{-\beta \upsilon}\right)^{\alpha
    - 1}e^{-\beta \upsilon}, \quad (2.7) \\ f_{pl}(\upsilon) = \frac{\alpha \beta^2}{\beta
    + 1}(1 + \upsilon^\alpha)\upsilon^{\alpha - 1}e^{-\beta \upsilon^\alpha}, \quad
    (2.8) \)


    其中 \( \alpha \) 和 \( \beta \) 分别表示形状和尺度参数。


    广义林德利分布的累积 PDF 表示为


    \( f_{gl}(\upsilon) = \left[1 - \left(\frac{1 + \beta + \beta \upsilon}{\beta
    + 1}\right)e^{-\beta \upsilon}\right]^\alpha. \quad (2.9) \)


    ![](img/b53e39e35231af65df8ccaa99eb28bee_35_0.png)


    图 2.3 实时风速数据的威布尔分布拟合。


    [15] 描述了随机变量的扩展广义林德利分布及其相对于广为人知的威布尔、雷利、两分量威布尔和广义林德利 PDF 的优越性。


    图 2.4 展示了用于建模风速分布的广义林德利 PDF 图。形状和尺度参数 $\alpha$ 和 $\beta$ 控制分布的峰值和尾部结构。广义林德利 PDF
    特别适用于建模风速方面风况较弱的风能资源。额定功率在 100–500 kW 范围内的小型风电场在低风速下运行，其分布可能呈偏态。


    ### 林德利 PDF 参数估计


    林德利 PDF 是一个两参数分布类，其中 $\hat{\theta} = (\hat{\alpha}, \hat{\beta})$ 根据对数似然原理确定。林德利
    PDF 的对数似然函数为


    $$L(v|\alpha, \beta) = n[\log \alpha + 2 \log \beta - \log(\beta + 1)] + \sum_{i=1}^n
    \log(1 + v_i) + (\alpha + 1) \sum_{i=1}^n \log \left( 1 - \frac{1 + \beta + \beta
    v}{1 + \beta} e^{-\beta v} \right) - \beta \sum_{i=1}^n v_i. \tag{2.10}$$


    进一步，对 $\alpha$ 和 $\beta$ 对对数似然函数求导，可得


    $$\frac{\partial L(v|\alpha, \beta)}{\partial \alpha} = \frac{n}{\alpha} + \sum_{i=1}^n
    \log \left( 1 - \frac{1 + \beta + \beta v}{1 + \beta} e^{-\beta v} \right). \tag{2.11}$$


    $$\begin{aligned} \frac{\partial L(v|\alpha, \beta)}{\partial \beta} &= \frac{n}{\beta}
    - \sum_{i=1}^n v_i + (\alpha + 1) \sum_{i=1}^n \left[ \frac{1 - \frac{e^{-\beta
    v}}{(1+\beta)^2} + v e^{-\beta v}}{1 - \frac{1+\beta+\beta v}{1+\beta} e^{-\beta
    v}} \right] \\ &- (\alpha + 1) \sum_{i=1}^n \left[ \frac{\frac{e^{-\beta v}}{(1+\beta)^2}
    + v e^{-\beta v}}{1 - \frac{1+\beta+\beta v}{1+\beta} e^{-\beta v}} \right]. \tag{2.12}
    \end{aligned}$$


    由于方程 (2.11) 和 (2.12) 包含非线性项，$\alpha$ 和 $\beta$ 的解可使用收敛速度快于牛顿法的准牛顿法等优化方法求得。估计量
    $\hat{\alpha}$ 和 $\hat{\beta}$ 采用 PSO 算法确定。图 2.5 展示了实时风速数据的广义林德利拟合。


    ### 2.3.1.3 Stacy-Mihram 分布模型


    威布尔分布模型的另一类是 Stacy–Mihram 模型，该模型通常能较好地描述风速分布。两参数模型为


    $$f_{stm}(v) = \frac{\beta v^{\beta-1}}{\alpha^\beta} e^{-(\frac{v}{\alpha})^\beta},
    \quad v > 0. \tag{2.13}$$


    参数 $\alpha$ 和 $\beta$ 可使用 MLE 进行估计，其对数似然函数为


    $$L(v|\alpha, \beta) = n \log \beta - n \beta \log \alpha + (\beta - 1) \sum_{i=1}^n
    \log(v_i) - \sum_{i=1}^n \left( \frac{v_i}{\alpha} \right)^\beta. \tag{2.14}$$


    图 2.6 展示了风速时间序列的 Stacy–Mihram 拟合。


