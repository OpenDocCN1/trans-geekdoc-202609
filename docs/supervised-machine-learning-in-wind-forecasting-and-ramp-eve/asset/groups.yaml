    RMSE = \sqrt{\frac{1}{N} \sum_{i=1}^{N} (\hat{X}_i - X_i)^2} \times 100\%, \quad
    SSR/SST = \frac{\sum_{i=1}^{N} (\hat{X}_i - \bar{X})^2}{\sum_{i=1}^{N} (X_i -
    \bar{X})^2}, \quad (8.28)

    ```


    其中，\(\hat{X}_i\)、\(X_i\) 和 \(\bar{X}\) 分别为 \(N\) 个测试样本的预测值、实际值和均值。RMSE 越低，预测模型越好。SSR/SST
    比值越高，表明测试样本的实际值与估计值之间的一致性越好。


    ### 8.4.1 五机风电场布局的预测结果


    预测过程首先包括计算下风向风机在单个上风向风机尾流影响下接收到的风速。选取了五机风电场和 15 机风电场的布局。在五机风电场布局情况下，WT_4 和 WT_5
    为下风向风机。两台风机的尾流风速分别使用 Jensen 模型和 Frandsen 模型计算。为简化起见，两个风电场布局的风机参数选取相同，并列于表 8.1
    中。


    风机 WT_4 受 WT_1 和 WT_2 的尾流影响，而 WT_5 受 WT_1、WT_3 和 WT_4 的尾流影响。上风向风机 WT_i 与下风向风机
    WT_j 之间的距离 x_{ij} 已在第 8.2.4 节中列出。使用 (8.3) 和 (8.4) 计算尾流风速后，通过将尾流风速时间序列与参考序列 X_0（此处为自由流风速
    u_0）进行比较，对其进行灰色关联分析。随后获得的灰色关联度（GCD）r(u_0, u_{ij}) 按其大小降序排列，并选取前 j 个输入。在五机布局情况下，针对风速序列
    u_15、u_35 和 u_45 求得了 GCD，以选取用于预测风机 WT_5 风速的输入。u_15、u_35 和 u_45 的 GRA 结果在表 8.4
    中突出显示。


    表 8.4 五机布局数据集 D1 和 D2 的灰色关联度及其排名。


    | 灰色关联度 | D1 值 | D1 排名 | D2 值 | D2 排名 |

    |---|---|---|---|---|

    | r(u_0, u_15) | 0.7074 | 3 | 0.5867 | 3 |

    | r(u_0, u_35) | 0.8529 | 1 | 0.6748 | 1 |

    | r(u_0, u_45) | 0.8234 | 2 | 0.5940 | 2 |


    GCD 降序排列为 r(u_0, u_35) > r(u_0, u_45) > r(u_0, u_15)，其中 u_35 和 u_45 作为输入，用于 SVR
    模型预测 WT_5 的风速。WT_5 的风速还通过将所有引起尾流的风机作为 SVR 模型输入，在不考虑 GRA 的情况下进行预测。有效风速使用五层 Daubechies
    4（db4）小波变换分解为近似信号（a5）和细节信号（d1、d2、d3、d4、d5）。


    预测使用 SVR 模型进行，数据分为训练集（前 80%）和测试集（剩余 20%）。SVR 模型使用径向基函数（RBF）作为核函数。SVR 超参数从集合 {2^i,
    i = -9, -8, ..., 10} 中选择。这种搜索空间的选择使我们能够从有限实数集中确定最优参数，并实现快速计算。我们为 SVR 预测选择了 RBF
    核函数，带宽取为 \(\sigma = 2^5\)，正则化常数 \(\gamma\) 取为 \(2^2\) [36]。


