    # 7.3.1 Case study for onshore and offshore wind farms


    In this section, we discuss the forecasting performance of the prediction models
    (persistence, ε-SVR, LSSVR, TSVR, ε-TSVR, RFR, and GBM). The ramp-up and ramp-down
    events are identified for a threshold of 10% of nominal wind power. The forecasting
    process is carried out by splitting the entire dataset into training (80%) and
    testing (20%) sets. For the persistence model, the forecast is carried out using
    two previous dispatch windows. Further, for SVR and its variants, the hyperparameters,
    that is, RBF bandwidth σ and regularization parameter C are tuned from the set
    [2^-10, 2^-9, ..., 2^9, 2^10]. For random forest regression (RFR) and gradient
    boosted machines (GBM), the simulations are carried out in R studio using random
    forest package. The number of trees used in training phase are 1000 for RFR, whereas
    for GBM, the learning rate is kept at 0.05, and the number of trees is 10000.
    The input feature set to all the prediction models is a matrix consisting of approximation
    signal A5 and detail signals (D1, D2, ..., D5) obtained from wavelet decomposition
    of wind speed time series. Further, we evaluate the absolute error for ramp-up
    and ramp-down events as R^up and R^down, respectively. Table 7.3 depicts the mean
    and standard deviation (SD) for the onshore and offshore wind speed datasets.'
