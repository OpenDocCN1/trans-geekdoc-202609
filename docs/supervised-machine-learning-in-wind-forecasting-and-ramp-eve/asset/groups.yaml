    prediction. The potential superiority of decision tree ensemble models over SVR
    models and its variants is also discussed where the problem of over-fitting causes
    large errors for raw wind speed data. We also discuss a special application of
    machine learning-based forecasting models for wind farms in the presence of wake
    interactions. Two case studies with different wind farm layouts are considered,
    and relevant wind turbines affecting prediction of a given turbine are identified.


    Overall, an integrated solution that aims to find a best possible machine learning
    model for wind speed time series can be found for optimal wind power dispatch
    considering the reserve power capacity. Wind farm operators also face an important
    challenge of decision making, which has its roots from the forecasting technique
    incorporated to plan their wind power dispatch [1–3]. For a hybrid wind farm,
    operational strategies that a wind farm operator decides to take are also dependent
    on the reserve power capacity available. For ensuring a good balance between forecasts
    and reserve capacity, an integrated approach considering the wake effect that
    alters the power production of a wind farm can be deduced. Wake effects can be
    controlled up to a certain amount by implementing redirection strategies. These
    strategies involve accurate measurement devices like LIDAR, which gives an estimate
    of wind speed just before it actually interacts with the wind turbine. Availability
    of such devices helps a wind farm operator to take necessary steps in conjugation
    with the operational strategy to be implemented. Since wind markets require clearances
    at a short interval of 30 minutes to 1 hour, more focus is laid on short-term
    wind forecasting, which also tries to encompass weather models. The integrated
    methodology will determine the best forecasting technique, which under the effect
    of wake will lead to savings in reserve power capacity in terms of BESS and increase
    its life time.


