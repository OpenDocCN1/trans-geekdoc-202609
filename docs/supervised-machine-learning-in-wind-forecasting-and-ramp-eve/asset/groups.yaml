    random forest regression is given as


    \(\hat{A} = \frac{1}{k} \sum_{i=1}^{k} \hat{r}(X, V_i),\) (5.1)


    where \(\hat{r}(X, V)\) is the representative tree at the end of training process,
    \(X\) is the set of input feature vectors, \(T\) is the collective set representing
    an input–output pair \(V_i = (x_1, y_1), (x_2, y_2), \dots, (x_n, y_n)\). The
    predicted output is averaged over \(k\) decision trees. An additional advantage
