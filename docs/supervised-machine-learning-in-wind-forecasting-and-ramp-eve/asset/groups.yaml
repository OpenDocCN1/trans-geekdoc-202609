    # Supervised machine learning models based on support vector regression


    A vast majority of practically utilized machine methods in fact involve supervised
    learning techniques. In supervised learning, an algorithm is used to learn an
    approximate mapping function from the input variable x to the output y = f(x)
    so that when there are new input data, we can predict the output for that data.
    Support vector regression which is derived from its parent version is based on
    an optimization problem. The weights corresponding to each input sample in a training
    set are obtained. Variants such as Least square support vector regression, Twin
    support vector regression and ε-Twin support vector regression are presented with
    a case study for each. In this chapter, we describe such regression models in
    detail.


    # 4.1 Support vector regression


    Support vector regression (SVR) is a type of machine learning regression, which
    is associated with learning algorithm equipped to analyze historical data for
    classification and regression. SVR works on the principle of structural risk minimization
    (SRM) from statistical learning theory [1], [2]. The core idea of this theory
    is to construct a hypothesis h that yields the lowest true error for the unseen
    and random sample testing data [3]. Apart from SVR, a universal machine intelligent
    technique like artificial neural network (ANN) with applications in character
    recognition, image compression, and stock market prediction is studied [4]. Shirzad
    et al. [5] have compared the performance of ANN and SVR to predict the pipe burst
    rate (PBR) in water distribution networks (WDNs) and found ANN to be a better
    predictor than SVR, but generalization is not consistent with physical behavior.
    SVR has an advantage over ANN with respect to the number of parameters involved
    in training phase. The computation time is another important factor for carrying
    out regression analysis.


    Consider a set of training data (historical data) (x₁, y₁), ..., (xₙ, yₙ) ⊂ X
    × R, where X denotes the input feature space of dimension Rⁿ. Let Y ='
