    all the uncertainties related to the stochastic nature of the wind. Let us look
    at the two other models, ARMA and ARIMA, in more detail.


    ### 3.3.1 ARMA 模型


    Among various statistical models, ARMA model is a popular forecasting method.
    In ARMA, AR stands for autoregressive, and MA stands for moving average. Thus
    a combined autoregressive (of order p) and moving average (of order q) forms an
    ARMA(p, q) model. The order of ARMA models, p for AR and q for MA, denotes the
    lag between present and past values of the variable under test. Thus a generic
    ARMA model can be mathematically expressed as


    ```

    $(y_t - \mu_x) = \phi_1(y_{t-1} - \mu_x) + \phi_2(y_{t-2} - \mu_x) + \cdots +
    \phi_p(y_{t-p} - \mu_x)

    + \xi_t - \theta_1\xi_{t-1} - \theta_2\xi_{t-2} - \cdots - \theta_q\xi_{t-q},\quad
    (3.3)$

    ```


    | 指标 | 公式 |

    |---|---|

    | \( R^2 \) | \( \frac{\sum_{i=1}^n (\hat{x}_i - \bar{x})^2}{\sum_{i=1}^n (x_i
    - \bar{x})^2} \) |

    | RMSE | \( \left( \frac{1}{n} \sum_{i=1}^n (\hat{x}_i - x_i)^2 \right)^{1/2}
    \) |

    | MAE | \( \frac{1}{n} \sum_{i=1}^n |\hat{x}_i - x_i| \) |

    | MAPE | \( \frac{1}{n} \sum_{i=1}^n |\hat{x}_i - x_i| \times 100\% \) |


    where \( \xi_t \) is an independent process with mean zero, and \( \phi = [\phi_1,
    ..., \phi_p] \) and \( \theta = [\theta_1, ..., \theta_q] \) are the parameters
    of the AR and MA processes, respectively. ARMA models can be studied in a much
    more simplified manner by using the lag operator \( L \). When applied \( k \)
    times, the lag operator moves index of the variable back by \( k \) times. Given
    a quantity \( \gamma \), the lag operation for \( k \) times yields \( L^k(\gamma)
    = y_{t-k} \). In general, an ARMA process can be mathematically expressed as


    ```

    ARMA : \( \phi L(y_t) = \theta L(\xi_t) \),

    AR : \( \phi L(y_t) = \xi_t \),

    MA : \( y_t = \theta L(\xi_t) \).

    ```


    As an example, we consider forecasting wind speed based on time-series modeling.
    The wind speed data of 2 months (Jan 1, 2017–March 31, 2017) for Praia Formosa,
    Brazil, is taken. The autocorrelation of the wind speed time series is calculated,
    and the orders \( p \) and \( q \) for ARMA model are set. To assess the model
    accuracy, error metrics like root mean squared error (RMSE), mean absolute error
    (MAE), mean absolute percentage error (MAPE), and \( R^2 \) are calculated and
    listed in Table 3.1.


    The \( \mathcal{L}_2 \) norm or Euclidean distance of residuals is also used for
    investigating the forecast accuracy, which is expressed as


    ```

    \( \| \mathcal{L} \|_2 = \sqrt{\sum_{i=1}^n (x_i - \hat{x}_i)^2} \)

    ```


    where \( x_i \) is the actual value, and \( \hat{x}_i \) is the predicted value
    for \( n \) samples.


    ### 3.3.2 ARIMA 模型


    ARMA models have a limitation that they can be applied to stationary processes
    only. In reality, the wind speed is a nonstationary time series with significant
    diurnal, meteorological, and seasonal variations. These variations are a result
    of dynamic atmospheric processes that change the wind behavior in time. To handle
    such limitations, ARIMA process is used to forecast wind speed. ARIMA process
    stands for autoregressive (AR), integrated (I), and moving average (MA). Mathematically,
    ARIMA(p, d, q) can be expressed as


    ```

    \phi L . K^d . y_t = \theta L(\xi_t), \qquad (3.8)

    K = 1 - L, \qquad (3.9)

    y_t = (1 + \phi_1)y_{t-1} + (\phi_2 - \phi_1)y_{t-2} + \cdots + \phi_p y_{t-p-1}

    + \xi_t - \theta_1 \xi_{t-1} - \theta_2 \xi_{t-2} - \cdots - \theta_q \xi_{t-q},
    \qquad (3.10)

    ```


    where y_t is the time-series variable, d is the difference operator, \xi_t is
    a white noise with zero mean and infinite variance, and \phi and \theta are coefficients
    of AR and MA processes. In the statistical package R, there is a function called
    auto.arima in the forecast package that automatically evaluates such parameters.


    Figs. 3.5 and 3.6 illustrate wind speed forecasting for ARMA(1, 1) and ARIMA(2,
    1, 1) models, respectively.


    Simulations are performed on SPSS 16.0 platform using time-series analyzer. Based
    on forecast results, we note that ARIMA model performs better than ARMA with error
    statistics depicted in Table 3.2.


    This also reinforces the fact that ARIMA models are superior to ARMA models for
    forecasting nonstationary time series. Literature survey shows that ARIMA model
    is extensively used to forecast the wind speed and power and serves as a benchmark
    model to assess the forecast accuracy of a newly developed or hybrid model. In
    [14] a variant of ARIMA model, f-ARIMA, is used to predict the day ahead wind
    forecasts. In this model, f stands for fractional, where the differencing parameter
    d \in (-0.5, 0.5). Results reveal that f-ARIMA model is 42% more efficient than
    the persistence model.


    ## 3.4 基于机器学习的模型


    Wind flow depends on atmospheric variables like pressure, humidity, surface roughness,
    and elevation. The historical behavior plays a pivotal role


    ![](img/b53e39e35231af65df8ccaa99eb28bee_52_0.png)


    ![](img/b53e39e35231af65df8ccaa99eb28bee_52_1.png)


    Figure 3.5 Autocorrelation of wind speed and forecasting using ARMA(1, 1) model.


    ![](img/b53e39e35231af65df8ccaa99eb28bee_52_2.png)


    Figure 3.6 Wind speed forecasting using ARIMA(2, 1, 1) model.


    | 模型 | R² | RMSE | MAE | MAPE |

    |---|---|---|---|---|

    | ARMA(1, 1) | 0.964 | 0.222 | 0.159 | 3.655 |

    | ARIMA(2, 1, 1) | 0.970 | 0.203 | 0.141 | 3.229 |


