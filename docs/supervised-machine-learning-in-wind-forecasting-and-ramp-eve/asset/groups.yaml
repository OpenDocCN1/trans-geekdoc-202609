    ## 5.2 梯度提升机


    梯度提升机（GBM）是一种基于集成的回归方法，它会考虑先前拟合决策树的损失。在 GBM 模型中，各种弱学习者被组合以得到一个准确的模型。基于提升的回归树由于适当提升算法所带来的优势，在预测准确响应值方面具有强大的能力。特定的提升算法通过以损失函数的形式最小化弱模型的不准确性来增强树模型
    [7]。因此，对于提升算法而言，主要任务是减少每次迭代中弱学习者造成的误差。最终的预测响应是拟合树的线性组合。GBM 相较于传统回归模型的一个优势在于它避免了过拟合。在
    GBM 中，每个决策树的学习率决定预测性能。较高的学习率表明预测所需的树数量较少，反之亦然 [8]。基于交叉验证实验，可以获得所需的理想树数量及学习率。由于
    GBM 是一种结合所有单独弱模型的集体模型，单个模型的目标是减少由损失函数生成的误差。一种常用的损失函数是 $\mathcal{L}_2$ 函数，它最小化预测值与实际值之间的平方误差之和。考虑
    $k$ 个这样的弱模型，它们用于在给定特征集 $x = [x_1, x_2, ..., x_n]$ 的情况下预测变量 $y$，这在数学上可以表示为


    ```

    \(\hat{y} = \sum_{i=1}^k f_i(x),\) (5.3)

    ```


    其中 $f_i(x)$ 代表每个弱学习者，这些弱学习者被集体训练以改进预测结果。损失函数给出为


    ```

    \(\mathcal{L}_2 = \frac{1}{N} L(y_i, \hat{y}_i), \quad L(y_i, \hat{y}_i) = \sum_{i=1}^N
    (y_i - \hat{y}_i)^2,\) (5.4)

    ```


    其中 $L(y_i, \hat{y}_i)$ 是基于 $N$ 个观测值的平方误差的损失函数。GBM 回归技术的目标是最小化 $\mathcal{L}_2$
    损失函数。然而，$\mathcal{L}_2$ 损失函数对异常值更敏感，并可能降低模型的鲁棒性。为确保高鲁棒性，使用 Huber 损失函数，其可表示为


    ```

    \(L(y, \hat{y}) = \begin{cases} \frac{1}{2}(y - \hat{y})^2, & |y - \hat{y}| \le
    \delta, \\ \delta(|y - \hat{y}| - \delta/2), & |y - \hat{y}| > \delta, \end{cases}\)
    (5.5)

    ```


    其中 $\delta$ 表示斜率。梯度提升机的概念围绕梯度下降和提升算法展开。为优化 GBM 中的超参数，使用梯度下降算法，它在考虑梯度负值的同时最小化成本函数。让我们考虑一个
    $\mathcal{L}_2$ 损失函数，其相对于预测样本 $\hat{y}_i$ 的梯度给出为


    ```

    \(\frac{\partial L(y, \hat{y})}{\partial \hat{y}_i} = \frac{\partial}{\partial
    \hat{y}_i} \sum_{i=1}^N (y_i - \hat{y}_i)^2 = 2(y_i - \hat{y}_i) \frac{\partial}{\partial
    \hat{y}_i} (y_i - \hat{y}_i) = -2(y_i - \hat{y}_i).\) (5.6)

    ```


    这里的梯度表明，在跟踪损失函数的最小点时，GBM 实际上跟踪的是残差向量 $y - \hat{y}$。类似地，对于 $\mathcal{L}_1$，可以通过求损失函数的梯度来跟踪
    MAE


    ![](img/b53e39e35231af65df8ccaa99eb28bee_87_0.png)


    图 5.6 梯度提升机的 XGBoost 算法。


    given as


    ```

    \frac{\partial L(y, \hat{y})}{\partial \hat{y}_i} = \frac{\partial}{\partial \hat{y}_i}
    \sum_{i=1}^N |y_i - \hat{y}_i| = -sign(y_i - \hat{y}_i). \quad (5.7)

    ```


    GBM 模型的准确性取决于弱学习者的数量和学习率。此外，GBM 模型的本质在于提升技术，该技术以阶梯式的方式然后以并行的方式组合所有弱模型，如随机森林模型所示。在数学上，GBM
    模型的递归形式给出为


    ```

    F_m(x) = F_{m-1}(x) + \eta \Delta_m(x), \quad (5.8)

    ```


    其中 $\eta$ 表示学习率，$\Delta_m$ 指拟合残差的回归模型。图 5.6 说明了用于获得最佳回归器的 XGBoost 算法。


    在我们的风速预测模拟中，随机森林和 GBM 的源代码分别载于附录 A.4 和 A.5。


