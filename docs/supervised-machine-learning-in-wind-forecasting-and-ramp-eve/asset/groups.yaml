    \ 141–144, 152, 156, 158, 164, 165, 167\n  - 风电功率预测工具 (WPPT), 121\n- 葡萄酒质量, 53\n\
    \  - 针对 TSVR, 53\n  - 预测, 53\n- 世界卫生组织 (WHO), 109\n\n### 风能工程系列\n\n## 风力预报和斜坡事件预测中的监督机器学习\n\
    \nHarsh S. Dhiman, Dipankar Deb 和 Valentina Emilia Balas\n\n*风力预报和斜坡事件预测中的监督机器学习*\
    \ 提供了风力发电与预报广泛领域的最新概述，重点阐述了机器学习在这一新兴知识领域中的作用和需求。\n\n书中介绍并分析了多种回归模型和信号分解技术，包括最小二乘法、双支持向量和随机森林回归，所有内容均基于监督机器学习。书中还探讨了斜坡事件预测和尾流相互作用等特定主题，以及预测性能，作者提供了多种风电场数据集和已进行的统计检验，以验证所提出预测模型的稳健性。\n\
    \n风速预报已成为确保电力系统安全、可靠和安全运行的重要组成部分，因此本参考书对所有从事可再生能源及风力预报和发电领域研究的研究人员和专业人员都十分有用。\n\
    \n## 主要特点\n\n- 包含多种基于监督机器学习的回归模型\n- 为涡轮机风电场布局提供全球案例研究\n- 包含风力预报领域的最先进的模型和方法论\n\
    \n## 作者简介\n\n**Harsh S. Dhiman，** 是印度艾哈迈达巴德基础设施技术研究与管理学院（IITRAM）电气工程系的研究员。他于 2016\
    \ 年获得印度瓦多达拉 Maharaja Sayajirao 大学技术与工程学院电气电力工程硕士学位，并于 2014 年获得印度艾哈迈达巴德 Nirma University\
    \ 技术学院电气工程学士学位。\n\n**Dipankar Deb 教授，博士，** 目前是印度艾哈迈达巴德基础设施技术研究与管理学院（IITRAM）电气工程系的正教授。他于\
    \ 2007 年获得美国弗吉尼亚大学夏洛茨维尔分校博士学位，导师为 IEEE 会员、ECE 系教授 Gang Tao 教授。2017 年，他当选为 IEEE\
    \ 高级会员。他拥有 6 项授权美国专利，发表了 17 篇 SCI 收录期刊论文，并撰写/编辑了 6 本书。\n\n**Valentina Emilia Balas\
    \ 教授，博士，** 目前是罗马尼亚阿拉德“Aurel Vlaicu”大学工程学院自动化与应用软件系的正教授。她获得蒂米什瓦拉理工大学应用电子学与电信博士学位。她是《国际先进智能范式期刊》（IJAIP）和《国际计算系统工程期刊》（IJCSySE）的主编，多家国内外期刊编辑委员会成员，以及国家和国际项目的评估专家。\n\
