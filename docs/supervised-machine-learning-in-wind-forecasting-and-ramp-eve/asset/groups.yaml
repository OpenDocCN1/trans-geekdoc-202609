    ### 8.2.2 Proposed model for wind wakes


    The velocity deficit estimated by Jensen and Frandsen are based on the top-hat-like
    velocity distribution. Several wind tunnel experiments have shown that the velocity
    deficit in transverse direction for a far-wake region follows a Gaussian distribution
    [12]. Wu and Porté-Agel [27] have studied the turbulence effect on stand-alone
    turbine wakes based on large-eddy simulation (LES) framework. The velocity deficit
    at the far-wake end assumes a Gaussian distribution [28] such as


    \(u = u_0 \left( 1 - A(x) e^{\frac{-r^2}{2\sigma^2}} \right), \quad (8.7)\)


    \(A(x) = 1 - \sqrt{1 - \frac{C_t}{8(\sigma/2r_0)^2}}, \quad (8.8)\)


    where \(u_0\) is the free-stream wind speed, \(A(x)\) is the maximum normalized
    velocity deficit caused at each downstream position \(x\), and \(\sigma\) is the
    wake width for each downwind distance \(x\).


    However, the mass flow rate between the wind turbines is not constant as certain
    percentage of incoming kinetic energy of wind is lost due to air turbulence. Another
    wake model proposed by Larsen was used to determine the speed of wind in wake
    affected downstream area, but due to high computational requirements, we do not
    prefer it here. Based on the Gaussian variation of Jensen’s and Frandsen’s wake
    models, we propose a bilateral Gaussian wake model shown in Fig. 8.3, where two
    wind turbines are placed apart “x” rotor diameter apart, and the velocity deficit
    assumes a Gaussian distribution at the far-end.


    The wake expands linearly with downstream distance \(x\) and is dependent on atmospheric
    conditions in terms of stability factor measured by \(\psi_m(h/L)\) and terrain
    conditions in terms of surface roughness length \(z_0\). The boundary lines \(Y_1\),
    \(Y_2\), and \(Y_3\) are the regions where the wake effect is analyzed based on
    Jensen’s and Frandsen’s original wake scenario. According to Jensen, in the boundaries
    \(Y_2\) and \(Y_3\) the law of conservation of mass


    ![](img/b53e39e35231af65df8ccaa99eb28bee_162_0.png)


    Figure 8.3 Bilateral Gaussian wake model.


    holds, which can be mathematically expressed as


    \(\int_{r_2}^\infty \rho u_0 2\pi r dr + \int_0^{r_2} \rho u_2 2\pi r dr = \int_0^\infty
    \rho u 2\pi r dr,\) (8.9)

    \(u_2 = (1 - 2a)u_0,\) (8.10)


    where \(r_2\) is the radial distance from the wake centerline at downstream distance
    \(x_1\), \(\rho\) is the density of incompressible fluid (air), and \(u_2\) is
    the wind speed just after the rotor. According to actuator disk theory, \(a\)
    is the induction factor. Substituting (8.10) and (8.7) into (8.9), we get


    \(A(x) = \frac{a}{(\sigma/r_2^2)},\) (8.11)


    where \(\sigma\) is a linear function of \(x\), and its estimation [29] is


    \(\sigma = \frac{r}{\sqrt{2}} = \frac{r_0 + \alpha x}{\sqrt{2}}.\) (8.12)


    Thus Jensen''s Gaussian distribution wake model is given as


    \(u = u_0 \left( 1 - \frac{a}{(\sigma/r_2^2)} e^{\frac{-r^2}{2\sigma^2}} \right).\)
    (8.13)


    Further, Frandsen''s Gaussian version of wake model assumes that the mass flow
    rate through the control tube \(Y_1 Y_3\) is not constant. Based on the principle
    of conservation of momentum, we get


    \(T = \int_0^\infty \rho (u_0 - u) 2\pi r dr = \frac{1}{2} \rho A_0 (u_0^2 - u^2),\)
    (8.14)


    where \( T \) is the net thrust in the presence of wake flow speed \( u \). Further,
    substituting (8.11) and (8.7) into (8.14), we get


    \( A(x) = 1 - \sqrt{\left( 1 - \frac{C_t}{2(\sigma/r_0)^2} \right)}, \quad \sigma
    = \frac{r}{2} = \frac{r_0 + \alpha x}{2}, \quad (8.15) \)


    where \( A(x) \) is the maximum normalized velocity deficit caused in wakes, and
    \( \sigma \) is the wake width for a given downstream distance \( x \). We now
    propose a bilateral Gaussian wake model based on Jensen''s and Frandsen''s Gaussian
    wake approaches, which can be mathematically expressed as


    \( u = u_0(1 - Q(x, r)), \quad Q(x, r) = A_j(x, r)A_f(x, r), \quad (8.16) \)

    \( \sigma_j = \frac{r_0 + \alpha x}{\sqrt{2}}, \quad \sigma_f = \frac{r_0 + \alpha
    x}{2}, \quad (8.17) \)

    \( A_j(x, r) = \frac{a}{(\sigma_j/r_0)^2} e^{\frac{-r^2}{2\sigma_j^2}}, \quad
    A_f(x, r) = \left( 1 - \sqrt{\left( 1 - \frac{C_t}{2(\sigma_f/r_0)^2} \right)}
    \right) e^{\frac{-r^2}{f^2}}, \quad (8.18) \)


    where \( A_j(x, r) \) and \( A_f(x, r) \) are the respective Jensen''s and Frandsen
    Gaussian components for a given downstream distance \( x \) and radial distance
    \( r \), which is a function of the wake expansion factor \( \alpha \) and downstream
    distance \( x \). Further, \( \sigma_j \) and \( \sigma_f \) are the wake widths
    as function of \( x \) for Jensen''s and Frandsen''s models, respectively.


    The motivation behind multiplying Jensen''s (\( A_j(x, r) \)) and Frandsen''s
    (\( A_f(x, r) \)) components comes from the individual advantages of the two models.
    Jensen''s model is time-saving, whereas Frandsen''s model holds good approximation
    for far-wake region \( 5D_0-7D_0 \). The proposed bilateral Gaussian wake model
    was tested against benchmark models like Jensen''s and Frandsen''s wake models
    for single-wake and multiple-wake scenarios, and its results are presented next.
    In the case of our proposed model the wake velocity \( u \) is calculated for
    a fixed radial distance for a given wake expansion factor \( \alpha \) as listed
    in Table 8.1.


    ### 8.2.3 Case study for single-wake model


    We discuss two analytical models, Jensen''s and Frandsen''s single wake models.
    To analyze the performance of these individual models, the wind speed data for
    a wind site WBZ (earlier known as Westinghouse Broadcasting, the radio station
    in Boston), Tower Hull in Boston Harbor, is collected throughout September 2006.
    The wind speed is measured every 10 minutes at a hub height of 61 meters by a
    cup anemometer with an accuracy of


    Table 8.1 Turbine specifications for wake model calculation.


    | Parameter | Value |

    |---|---|

    | Rotor radius (m) | 38.5 m |

    | Thrust coefficient ($C_t$) | 0.88 |

    | Wake constant ($\alpha$) | 0.05 |

    | Hub height (h) | 61 m |


    ±2%. The wind speed series chosen for 250 data points has maximum and minimum
    wind speed of 13.05 m/s and 1.5 m/s, respectively, and a mean wind speed of 7.58
    m/s.


    The wake growth constant \(\alpha\) is calculated using empirical relationship
    (8.2) for given hub height \(h\) and surface roughness length \(z_0\). Since the
