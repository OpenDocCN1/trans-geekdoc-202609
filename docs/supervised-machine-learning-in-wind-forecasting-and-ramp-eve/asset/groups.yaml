    \ print(tuneResult) 访问超参数调整的结果。参见图 A.7。\n\n## A.4 R 中的随机森林回归\n\n随机森林回归可以在 R 中使用一组命令实现。预测器（自变量）和输出变量的数据应以数据框的形式存储。对于机器学习技术，数据按适当比例分为训练集和测试集。考虑一个以风速作为输出变量、其小波分解作为预测变量的数据集。如第\
    \ 5 章所述，近似信号和细节信号构成了预测风速的输入数据集。在本示例的 RF 模型中，我们选取包含 4320 个样本的数据框 f5，并将其分为训练集（3000）和测试集（1320）。\n\
    \n## 示例 A.11. RF 模型的 R 代码\n\n```\nhead(f5)\nsummary(f5)\nlibrary(caret)\nlibrary(caTools)\n\
    traindata<-f5[1:3000,]\ntestdata<-f5[3001:4320,]\nxtrain<-traindata[,c(2,3,4,5,6,7)]\n\
    ytrain<-traindata[,1]\ntest<-testdata[,1]\nxtest<-testdata[,c(2,3,4,5,6,7)]\n\
    library(randomForest)\nrfrobj<-randomForest(ws~.,data=f5,\nntree=1000,keep.forest=TRUE,\
    \ importance=TRUE,\nna.action=na.omit)\nsummary(rfrobj)\npredict.rfr<-predict(rfrobj,xtest)\n\
    write.table(predict.rfr, file = \"rfr.txt\", row.names = TRUE,\ncol.names = NA)\n\
    print(predict.rfr)\nsummary(predict.rfr)\nrmse.rfr<-sqrt(mean((predict.rfr-ytest)^2))\n\
    nmse.rfr<-sum((predict.rfr-ytest)^2)/sum((ytest-mean(ytest))^2)\nr2.rfr<-sum((predict.rfr-mean(ytest))^2)/sum((ytest-mean(ytest))^2)\n\
    plot(rfrobj)\nlines(predict.rfr)\n```\n\n此外，为了确定给定数据集的最佳树数，可以使用 R 命令 which.min(rfrobj$mse)。图\
    \ A.8 说明了树数变化时的 MSE 值。\n\n## A.5 R 中的梯度提升机\n\n与随机森林回归类似，梯度提升机（GBM）可以用于预测风速或任何其他变量。我们现在讨论前一节中讨论的相同示例的\
    \ GBM 模型 R 代码。参见图 A.9。\n\n## rfrobj\n\n![](img/b53e39e35231af65df8ccaa99eb28bee_196_0.png)\n\
    \n![](img/b53e39e35231af65df8ccaa99eb28bee_196_1.png)\n\n## 图 A.8 RF 模型中树数的 MSE\
    \ 变化以及实际值与预测值之间的散点图。\n\n![](img/b53e39e35231af65df8ccaa99eb28bee_196_2.png)\n\n\
    ![](img/b53e39e35231af65df8ccaa99eb28bee_196_3.png)\n\n## 图 A.9 GBM 模型中树数的 MSE\
    \ 变化以及实际值与预测值之间的散点图。\n\n## 示例 A.12. GBM 的 R 代码\n\n```\nlibrary(gbm)\nlibrary(xgboost)\n\
    library(h2o)\nlibrary(pdp)\nlibrary(ggplot2)\nhead(f5)\nsummary(f5)\ntraindata<-f5[1:3000,]\n\
    testdata<-f5[3001:4320,]\nxtrain<-traindata[,c(2,3,4,5,6,7)]\nytrain<-traindata[,1]\n\
    test<-testdata[,1]\nxtest<-testdata[,c(2,3,4,5,6,7)]\ngbm.fit<-gbm(formula=ws~.,data\
    \ = f5,\nvar.monotone = c(0,0,0,0,0,0),\ndistribution = \"gaussian\", n.trees\
    \ = 10000, shrinkage = 0.05,\ninteraction.depth = 3, bag.fraction = 0.5, train.fraction\
    \ = 0.5,\nn.minobsinnode = 10, cv.folds = 5, keep.data = TRUE,\nverbose = FALSE,\
    \ n.cores = 1)\nprint(gbm.fit)\nsqrt(min(gbm.fit$cv.error))\ngbm.perf(gbm.fit,method=\"\
    cv\")\nynew<-predict(gbm.fit, xtest, 9982, type = \"link\",\nsingle.tree = FALSE)\n\
    write.table(ynew, file = \"yGBM.txt\", row.names = TRUE,\ncol.names = NA)\nlibrary(forecast)\n\
    accuracy(ynew,ytest)\nrmse.gbm<-sqrt(mean((ynew-ytest)^2))\nnmse.gbm<-sum((ynew-ytest)^2)/sum((ytest-mean(ytest))^2)\n\
    r2.gbm<-sum((ynew-mean(ytest))^2)/sum((ytest-mean(ytest))^2)\nwrite.table(ytest,\
    \ file = \"ytest.txt\", row.names = TRUE,\ncol.names = NA)\n```\n\n## 索引\n\n-\
