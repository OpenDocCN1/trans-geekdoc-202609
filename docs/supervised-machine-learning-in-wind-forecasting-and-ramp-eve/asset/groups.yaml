    # # Biography


    # ## About the series editor


    Dr. Yves Gagnon is professor of engineering at the Université de Moncton, Canada,
    along with being Adjunct Professor at Thaksin University, Thailand. Prior to that,
    Dr. Gagnon was Visiting Executive at the Natural Sciences and Engineering Research
    Council (NSERC) of Canada, he was founding President and CEO of the New Brunswick
    Innovation Foundation and he held the positions of Associate Vice-President of
    Research, Dean of the Faculty of Graduate Studies and Research, and K.C. Irving
    Chair in Sustainable Development at the Université de Moncton.


    As a Mechanical Engineer, Dr. Gagnon obtained graduate degrees from the Massachusetts
    Institute of Technology in the United States, and from the Université de Toulouse,
    in France, while Thaksin University has conferred him an Honorary Doctorate degree
    in Sciences. Active in research, Dr. Gagnon has been supported through various
    grants and research contracts. His research and innovation work, done in national
    and international collaborations, has appeared in over 350 publications and reports;
    and his contributions have been recognized by several prizes. Amongst his editorial
