    \ [33]。我们研究了存在风尾流时的预测问题。在某个风电场中，并非所有风力涡轮机都接收到相同大小和方向的风速。此外，在多尾流条件下，风力涡轮机会经历多个上游风力涡轮机引起的尾流，但并非所有风力涡轮机都会对下游风力涡轮机造成显著的尾流效应和湍流。由于并非所有上游风力涡轮机都会引起速度赤字，为识别特定下游风力涡轮机上的显著上游风力涡轮机，进行了灰色关联分析\
    \ (GRA)。接下来，我们将讨论 GRA 涉及的各个步骤。\n\n### 灰色关联分析\n\n灰色关联分析（GRA）是一种常用于系统分析技术的重要金融工具\
    \ [34]。GRA 的核心思想是建立各种决策序列与参考序列之间的接近程度。除了尾流影响之外，影响决策的其他标准已在其他地方考虑 [35]。考虑多个上游风力涡轮机尾流影响的预测精度在很大程度上受\
    \ GRA 结果的影响。\n\n此外，完成 GRA 后，仅选择灰色关联度较高的变量作为风速预测模型的输入。灰色关联分析的步骤如下：\n\n- 1. 选择与决策序列长度相同的参考序列，记为\
    \ \\( X_0 = (x_{01}, x_{02}, ..., x_{0n}) \\)，并将决策序列表示为矩阵 \\( L \\)，该矩阵表示包含参考序列\
    \ \\( X_0 \\)、\\( X_i = (x_{i1}, x_{i2}, ..., x_{in}) \\) 的所有决策序列，其中 \\( i = 1,\
    \ 2, ..., m \\)：\n\n  \\( L = \\begin{bmatrix} x_{01} & x_{11} & \\dots & x_{m1}\
    \ \\\\ x_{02} & x_{12} & \\dots & x_{m2} \\\\ \\vdots & \\vdots & \\ddots & \\\
    vdots \\\\ x_{0n} & x_{1n} & \\dots & x_{mn} \\end{bmatrix} . \\) (8.24)\n\n-\
    \ 2. 接下来，通过初值变换、均值变换或极差变换等方法对所有序列进行标准化。矩阵 \\( L \\) 转换为\n\n  \\( L' = \\begin{bmatrix}\
    \ x'_{01} & x'_{11} & \\dots & x'_{m1} \\\\ x'_{02} & x'_{12} & \\dots & x'_{m2}\
    \ \\\\ \\vdots & \\vdots & \\ddots & \\vdots \\\\ x'_{0n} & x'_{1n} & \\dots &\
    \ x'_{mn} \\end{bmatrix} . \\) (8.25)\n\n"
