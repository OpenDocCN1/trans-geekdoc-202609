    Figure 8.1 Categorization of different wake models.


    ## 8.2 Wind wakes


    As already described, wind wakes lead to reduction in velocity at the downwind
    turbine in a wind farm. Wake-affected wind turbine also suffers from the problem
    of increased mechanical loading on the turbine structure. Apart from analytical
    wake models cited in the literature like Jensen''s model, Ainslie''s model, Larsen''s
    model, and Frandsen''s model, many field models like 2D and 3D field models based
    on computational fluid dynamics (CFD) have also been put into wake modeling. The
    different wake models are categorized in Fig. 8.1.


    Due to computational uncertainty and time consumption, analytical wake models
    are a preferred choice over field models [8]. We discuss analytical models for
    single wake and multiple wake conditions in a wind farm layout.


    ### 8.2.1 Jensen''s and Frandsen''s single wake models


    Jensen [25] proposed a single wake model based on the assumption that the wake
    cone extends linearly with the downwind distance. The free-stream wind speed u0
    is the expected wind speed to be received by the downwind turbines, but due to
    wake effect, a velocity deficit is observed at these turbines. Based on the conservation
    of momentum of fluid across the wake cone, the radius of wake-affected wind turbine
    at a distance x from the upwind turbine can be expressed as


    r_x = r_0 + \alpha x, (8.1)


    where r0 is the rotor radius of the wind turbine, \alpha represents the rate of
    wake expansion behind rotor, and x is the downwind distance as shown in Fig. 8.2.


    ![](img/b53e39e35231af65df8ccaa99eb28bee_160_0.png)


    Figure 8.2 Wind turbine layout for Jensen''s single wake model.


    The choice of value of \(\alpha\) depends on the wind farm terrain (surface roughness,
    hub height) and atmospheric conditions (air turbulence). An empirical estimation
    of wake expansion constant \(\alpha\) is


    \(\alpha = \kappa \left[ \log_e \left( \frac{h}{z_0} \right) - \psi_m(h/L) \right]^{-1},
    \quad (8.2)\)


    where \(\kappa = 0.4\) is the von Karman constant, and \(h\) and \(z_0\) are the
    hub height of turbine and surface roughness length. The factor \(\psi_m(h/L)\)
    determines the local atmospheric stability correction at a given hub height [26].
    The effective wind speed \(u_j\) at the downwind turbine located at a distance
    \(x\) due to wake effect of a single upwind turbine as per Jensen''s model is
    given as


    \(u_j = u_0 \left( 1 + (\sqrt{1 - C_t} - 1) \left( \frac{r_0}{r_x} \right)^2 \right),
    \quad (8.3)\)


    where \(C_t = a(2 - a)\) is the thrust coefficient with induction factor \(a =
    1 - \frac{u_j}{u_0}\) as per Actuator disk theory.


    Frandsen et al. [8] have described the wake expansion immediately after rotor
    as rectangular profile compared to trapezoidal profile in Jensen''s model. The
    wind speed \(u_f\) at a downwind distance \(x\) as per Frandsen''s model is given
    as


    \(u_f = u_0 \left( \frac{1}{2} \pm \frac{1}{2} \sqrt{1 - 2 C_t \left( \frac{r_0}{r_x}
    \right)^2} \right). \quad (8.4)\)


    An empirical result was obtained to estimate the relationship between \(r_x\)
    and \(C_t, \alpha\), and \(r_0\), which is given as


    \(r_x = r_0 (\beta + \alpha x / 2 r_0)^{1/2}, \quad (8.5)\)

