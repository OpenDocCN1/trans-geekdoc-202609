    300个样本的频谱数据被分割为训练集（250个）和测试集（50个）。AR、SVR和EMD-SVR模型的RMSE值分别为0.1310、0.1148和0.0673，这表明基于EMD的模型在预测非平稳时间序列（如频谱）方面具有优越性。在股价预测方面，Yang等人[25]讨论了基于ARIMA-EMD-SVR的综合模型，适用于NASDAQ、TSEC、SP500和NIKKEI
    225四个市场。所用数据为2010年1月1日至2010年12月31日的数据，90%的数据用于训练SVR模型。结果表明，与AR、SVR和EMD-SVR模型相比，基于ARIMA-EMD的SVR模型具有更好的预测性能。此外，还使用一种称为方向对称性（direction
    symmetry）的指标评估了模型的稳健性。


    接下来，我们讨论用于短期风速预测的基于ARIMA-EMD的SVR模型。图6.10所示的混合模型涉及基于ARIMA模型的线性预测和基于EMD-SVR模型的非线性预测。ARIMA模型的滞后阶数基于风速时间序列的ACF函数确定。我们考虑四个数据集：位于马萨诸塞州西部的Bishop
    & Clerks、Blandford和Paxton，以及丹麦近海风电场Anholt，这些站点的风速数据可从URL（http://www.soda-pro.com）获取。风速时间序列每10分钟测量一次，共1000个样本，其中800个用于训练SVR模型，其余200个用于测试。首先，将风速时间序列分解为五个固有模态分量（IMFs，包括一个残差）。随后对这些IMF分别进行预测，然后将预测结果聚合。SVR模型及其变体的超参数在2⁻¹⁰–2¹⁰范围内手动调整。图6.11和6.12展示了四个不同数据集的预测结果。


    基于ARIMA-EMD的SVR变体根据RMSE、均方误差（MSE）、SSR/SST、SSE/SST以及Theil''s U1和U2统计量等误差指标进行评估。表6.6描述了误差指标，从中可以观察到，对于所有四个数据集，ε-TSVR和TSVR模型在RMSE和MAE方面均优于常规SVR和LS-SVR模型。对于标记为Xx的数据集Anholt，ε-TSVR具有最大IOA，表明实际值与预测值之间具有良好的一致性。在RMSE方面，ε-TSVR比常规SVR模型好27.22%。同样，对于数据集Bishop
    & Clerks，ε-TSVR模型在RMSE和MSE方面优于常规SVR、LS-SVR和TSVR。然而，值得注意的是，从计算角度看，LS-SVR是所有回归器中最快的。


