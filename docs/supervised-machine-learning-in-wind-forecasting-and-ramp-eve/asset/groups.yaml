    $$

    \begin{aligned}

    \begin{bmatrix} k(x, x^T) + \gamma^{-1} I & e \\ e^T & 0 \end{bmatrix} \begin{bmatrix}
    \alpha \\ b \end{bmatrix} = \begin{bmatrix} y \\ 0 \end{bmatrix}, \quad (4.12)
