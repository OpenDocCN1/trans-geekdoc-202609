    \(\epsilon\)-SVR, 则有 \(e_{LS-SVR} < e_{SVR}\)，即，


    \(\hat{P}_{h1} - P_h - \hat{P}_{g1} + P_g > \hat{P}_{h2} - P_h - \hat{P}_{g2}
    + P_g.\) (7.13)


    令 \(\beta_h = \alpha_h - \alpha_h^*\) 且 \(\beta_g = \alpha_g - \alpha_g^**，并简化
    (7.13)，得到


    \(\beta_h k(x, x_h) + b - \beta_g k(x, x_g) - b > \eta_h k(x, x_h) + b_1 - \eta_g
    k(x, x_g) - b_1.\) (7.14)


    由于 \(\epsilon\)-SVR 和 LS-SVR 的核矩阵元素 \(k(x, x_i)\) 相等，该方程可进一步简化为


    \(k(x, x_h)\big(\beta_h - \eta_h\big) - k(x, x_g)\big(\beta_g - \eta_g\big) >
    0.\) (7.15)


    因此，若满足 (7.15)，则 LS-SVR 在爬坡事件期间将优于 \(\epsilon\)-SVR。


    ### 7.2.2 TSVR 和 \(\epsilon\)-TSVR 的爬坡事件误差分析


    同样，TSVR 和 \(\epsilon\)-TSVR 可基于相同方法进行比较。设 \(e_{TSVR}\) 和 \(e_{\epsilon-TSVR}\)
    分别表示基于 TSVR 和 \(\epsilon\)-TSVR 的点 \(g\) 和点 \(h\) 之间风功率爬坡的误差。则有


    \(\hat{P}_{g3} = \frac{1}{2}(w_1 + w_2)k(x, x_g) + \frac{1}{2}(b_1 + b_2),\) (7.16)

    \(\hat{P}_{h3} = \frac{1}{2}(w_1 + w_2)k(x, x_h) + \frac{1}{2}(b_1 + b_2),\) (7.17)

    \(\hat{P}_{g4} = \frac{1}{2}(u_1 + u_2)k(x, x_g) + \frac{1}{2}(b_3 + b_4),\) (7.18)

    \(\hat{P}_{h4} = \frac{1}{2}(u_1 + u_2)k(x, x_h) + \frac{1}{2}(b_3 + b_4),\) (7.19)


    其中 \(b_1\)、\(b_2\) 和 \(b_3\)、\(b_4\) 为偏置项，\(\hat{P}_{g3}\)、\(\hat{P}_{h3}\) 和
    \(\hat{P}_{g4}\)、\(\hat{P}_{h4}\) 分别为使用 TSVR 和 \(\epsilon\)-TSVR 预测的风功率值。随后比较预测爬坡功率
    \(\hat{\Delta P}_{gh}\)，TSVR 和 \(\epsilon\)-TSVR 在 \(\Delta P_{gh}\) 中的误差为


    \(e_{TSVR} = \hat{P}_{h3} - P_h - \hat{P}_{g3} + P_g, \quad e_{\epsilon-TSVR}
    = \hat{P}_{h4} - P_h - \hat{P}_{g4} + P_g.\) (7.20)


    比较爬坡功率误差，若 \(e_{TSVR} > e_{\epsilon-TSVR}\)，则得


    \(\hat{P}_{h3} - P_h - \hat{P}_{g3} + P_g > \hat{P}_{h4} - P_h - \hat{P}_{g4}
    + P_g.\) (7.21)


    定义 \(\frac{1}{2}(w_1 + w_2) = \hat{w}\) 和 \(\frac{1}{2}(u_1 + u_2) = \hat{u}\)，并简化
    (7.21)，得到


    \(\hat{w}\left(k(x, x_h) - k(x, x_g)\right) > \hat{u}\left(k(x, x_h) - k(x, x_g)\right).
    \quad (7.22)\)


    当满足 (7.22) 时，\(\varepsilon\)-TSVR 在点 \(g\) 和点 \(h\) 之间的爬坡事件期间优于 TSVR。


    ### 7.2.3 爬坡事件分析的案例研究


    在本研究中，我们选取了五个风电场，即 Sotavento（西班牙）、Paxton 和 Blandford（马萨诸塞州）、Beresford（南达科他州）[33]
    以及 AGL Macarthur 风电场，维多利亚，澳大利亚，以分析风功率爬坡事件。爬坡功率阈值选定为额定功率（\(P_{nom}\)）的 15%。选用丹麦制造商
    Vestas 的风力涡轮机（Vestas V112），额定风速为 12 m/s，以研究风功率爬坡事件。研究了两种爬坡事件，即功率爬升事件和功率下降事件。给定风力涡轮机的额定风功率为
    3.6496 MW。爬坡功率事件的阈值限值选定为额定功率的 15%。图 7.8 显示了不同轮毂高度连续调度窗口中风功率变化（\(\Delta P_{wind}\)）的频率分布。


    10 米轮毂高度处的风速数据使用风廓线功率法 [34] 转换至 40 m 轮毂高度，其表达式为


    \(\frac{u_h}{u_r} = \left(\frac{z_h}{z_r}\right)^\alpha, \quad (7.23)\)


    其中 \(u_h\) 和 \(u_r\) 分别为所需轮毂高度和参考轮毂高度处的风速（单位：m/s），\(z_h\) 和 \(z_r\) 分别为所需水平和参考水平处的轮毂高度（单位：m），\(\alpha
    = 1/7\) 是取决于大气条件的经验计算常数 [35]。表 7.2 显示了不同风电场场站风功率爬升和爬下事件计算的绝对误差（AE）值。在所有风场站的爬升事件期间，\(\varepsilon\)-TSVR
    的性能优于 TSVR、LS-SVR 和经典 \(\varepsilon\)-SVR。


    从图 7.8 可见，当在任意高于地面的轮毂高度记录风速时，风功率爬坡事件的概率会增加。五个风电场场站的风功率爬坡事件数量如图 7.9 所示。


