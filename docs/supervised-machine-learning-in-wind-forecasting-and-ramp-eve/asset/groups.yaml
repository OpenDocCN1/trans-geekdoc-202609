    \(\alpha^T (Y - (Xw_1 + eb_1) + e\varepsilon_1 + \xi) = 0. \quad \alpha \ge 0,
    \quad \beta^T \xi = 0, \quad \beta \ge 0, \quad (4.29)\)


    其中 \(\alpha \in [0, C_1 \varepsilon]\) 对于 \(\beta \ge 0\)。这些 KKT 条件可写为


    \(- \begin{bmatrix} X^T \\ e^T \end{bmatrix} Y + \left( \begin{bmatrix} X^T \\
    e^T \end{bmatrix} \begin{bmatrix} X & e \end{bmatrix} + C_3 I \right) \begin{bmatrix}
    w_1 \\ b_1 \end{bmatrix} + \begin{bmatrix} X^T \\ e^T \end{bmatrix} \alpha = 0,
    \quad (4.30)\)

    \(- Q^T Y + (Q^T Q + C_3 I) u_1 + Q^T \alpha = 0, \quad (4.31)\)


    其中 \(Q = \begin{bmatrix} X & e \end{bmatrix}, u_1 = \begin{bmatrix} w_1^T & b_1
    \end{bmatrix}^T\).


    进一步，我们可以写出 \(u_1 = (Q^T Q + C_3 I)^{-1} Q^T (Y - \alpha)\)。上述原始问题的对偶优化目标函数可写为


    \(\max - \frac{1}{2} \alpha^T Q (Q^T Q + C_3 I)^{-1} Q^T \alpha^T + Y^T Q (Q^T
    Q + C_3 I)^{-1} Q^T \alpha - (e^T \varepsilon_1 + Y^T) \alpha \quad \text{s.t.}
    \quad \alpha \in [0, C_1]. \quad (4.32)\)


    同样，另一个对偶可得为


    \(\max - \frac{1}{2} \gamma^T Q (Q^T Q + C_4 I)^{-1} Q^T \gamma^T + Y^T Q (Q^T
    Q + C_4 I)^{-1} Q^T \gamma + (-e^T \varepsilon_2 + Y^T) \gamma \quad \text{s.t.}
    \quad \gamma \in [0, C_2]. \quad (4.33)\)


    式 (4.32) 和 (4.33) 是原始目标优化函数的对偶。此处的特征集 \(X\) 在 \(n\) 维空间中是线性可分的。最终回归器 \(f(x)\)
    给出为


    \(f(x) = \frac{1}{2}(f_1(x) + f_2(x)) = \frac{1}{2}((w_1 + w_2)^T x + (b_1 + b_2)),
    \quad (4.34)\)


    作为两个函数 \(f_1(x)\) 和 \(f_2(x)\) 的平均值，它们分别是预测超平面 \(f(x)\) 上下两侧的回归器。


    ## 核 \(\varepsilon\)-双支持向量回归


    通过 SVR 进行的回归不一定总是线性的，因此本研究需要扩展到非线性回归。使用合适的映射（也称为核）函数，利用 \(\phi : \mathbb{R}^n
    \rightarrow \mathbb{R}^k\) 将输入集转换到更高维度，其中 \(k\) 是目标空间的维度。


    ![](img/b53e39e35231af65df8ccaa99eb28bee_75_0.png)


    ## 图 4.12 \(\epsilon\)-TSVR 算法的示意流程图。


    图 4.12 逐步说明了 \(\epsilon\)-TSVR 回归算法的过程。


    如文献 [17] 所示，考虑核函数 \(K(X, X^T)\) 的凸优化问题给出为


    ```

    min 1/2 C3(w1^T w1 + b1^2) + 1/2 ξ*^T ξ + C1 e^T ξ,

    s.t. Y - (K(X, X^T)w1 + eb1) = ξ*, (4.35)

    Y - (K(X, X^T)w1 + eb1) >= -εe1 - ξ, ξ >= 0, (4.36)

    min 1/2 C4(w2^T w2 + b2^2) + 1/2 ξ*^T ξ + C2 e^T η,

    s.t. Y - (K(X, X^T)w2 + eb2) = η*, (4.37)

    Y - (K(X, X^T)w2 + eb2) >= -εe2 - η, η >= 0, (4.38)

    ```


    其中 C1、C2、C3、C4 是基于核的 \(\epsilon\)-TSVR 的超参数。


    原始优化问题的对偶给出为


    ```

    max - 1/2 α^T S(S^T S + C3 I)^-1 S^T α^T + Y^T S(S^T S + C3 I)^-1 S^T α

    -(e^T ε1 + Y^T)α   s.t. α ∈ [0, C1], (4.39)

    max - 1/2 γ^T S(S^T S + C4 I)^-1 S^T γ^T + Y^T S(S^T S + C4 I)^-1 S^T γ

    +(-e^T ε2 + Y^T)γ   s.t. γ ∈ [0, C2], (4.40)

    ```


    ![](img/b53e39e35231af65df8ccaa99eb28bee_76_0.png)


    ## 图 4.13 基于 \(\epsilon\)-TSVR 的河流流量预测。


    其中 \(S = [K(X, X^T) e]\)，\(\alpha\) 和 \(\gamma\) 是拉格朗日乘数，它们能够在等式约束下找到函数的局部极大值和/或极小值。最终回归器
    \(f_{\epsilon-TSVR}(x)\) 给出为两个函数的平均值：


    \( f_{\epsilon-TSVR}(x) = \frac{1}{2}((w_1^T + w_2^T)K(X, X^T) + (b_1 + b_2)).
    \quad (4.41) \)


    ## 河流流量预测：尼罗河案例研究


    接下来，我们讨论基于 \(\epsilon\)-TSVR 模型的河流流量预测。河流流量月均值收集自 https://people.sc.fsu.edu/~jburkardt/datasets/time_series/。共取样
    570 个样本，并分段为训练集（470）和测试集（100）。回归的输入集由河流流量时间序列的小波分解构建。随后将详细信号和近似信号视为预测变量。图 4.13
    和 4.14 说明了 \(\epsilon\)-TSVR 和持续性模型的预测时间序列图和散点图。


    基于对超参数的手动调整，从表 4.4 中我们获得 \(\epsilon\)-TSVR 模型的 RMSE 为 0.0257，持续性模型的 RMSE 为 0.6150。


    ![](img/b53e39e35231af65df8ccaa99eb28bee_77_0.png)


    ## 图 4.14 \(\epsilon\)-TSVR 和持续性算法的散点图。


    ## 表 4.4 \(\epsilon\)-TSVR 和持续性模型的性能指标。


    | 模型 | RMSE | MSE | \(R^2\) | NMSE | U1 | U2 |

    |---|---|---|---|---|---|---|

    | \(\epsilon\)-TSVR | 0.0257 | 0.0006 | 0.9653 | 0.013 | 0.0012 | 0.3440 |

    | 持续性 | 0.6150 | 0.3782 | 5.5652 | 6.771 | 0.0845 | 6.6146 |


    本章主要讨论了用于回归分析的 SVR 及其变体。这些受监督学习模型应用于全球不同地区的风速时间序列数据集，以评估每个模型的性能。关于过拟合和欠拟合的预测性能将在后续章节中进一步讨论。此外，混合预测模型的优势推动了风速预测领域的研究日益增多。


