    of Europe. The data for fire density is collected from European Fire Database
    for the months from June to September. Variables like average elevation, minimum
    temperature, maximum temperature, and surface roughness are chosen as predictors.
    The predictions from RF model are compared with linear regression. The results
    reveal that RF model outperforms linear regression indicating a nonlinear relationship
    among the predictors and forest fires. Gong et al. have discussed a comparison
    between RF model and linear regression for predicting international roughness
    index (IRI). The data for roughness index and predictors are average precipitation,
    average freeze index, initial IRI measurement, and annual average daily traffic.
    Data of 11000 samples are taken and divided into training (80%) and testing (20%)
    set. The hyperparameters of RF model are optimized using a grid search method.
    The results in terms of MSE and \(R^2\) reveal that RF model performs better than
    the linear regression model.


    Smith et al. [4] discussed multiple linear regression (MLR) and random forest
    regression to predict concentration levels of various chemicals. The nonlinearity
    among multiple variables is accounted by the random forest model, and the results
    reveal that although MLR performed better than RF model, there are some cases
    where the predictive performance of RF model is found much better. Yuchi et al.
    [5] explored a random forest model and multiple linear regression for predicting
    the concentration of a particulate matter. The particulate matter PM2.5 is predicted
    based on several predictor variables like outdoor PM2.5 concentration, season,
    the number of gears, and the number of cleaners deployed. A total of 447 samples
    are assessed and a cross validation technique with 10 folds is used for all the
    models. Individual models like MLR and RF result in \(R^2\) values of 0.502 and
    0.498, respectively, whereas a blended model accounting MLR and RF gave an \(R^2\)
    value of 0.815, indicating its superiority in predicting the indoor PM2.5 concentration.


    Zahedi et al. [6] presented an RF model for predicting the solid particle erosion
    in elbow pipe fittings. Predictor variables like pipe diameter, particle size,
    liquid viscosity, and material hardness are chosen for this purpose. The performance
    of RF model is compared with benchmark model like linear regression, support vector
    machines, and neural network. The results indicate a good agreement in predicted
    and experimental values with RF model. It is also observed that the RF model overpredicts
    the erosion rate, which is possibly due to influence of different predictor variables
    over each other. We now discuss two case studies for random forest model that
    deal with rainfall and crude oil price prediction.


    ### 5.1.1 Monthly rainfall prediction: a case study


    To test the effectiveness of the random forest model against benchmark models
    like persistence algorithm, a case study for monthly rainfall prediction in the
    state of Himachal Pradesh, India, is carried out. Monthly rainfall data from 1901–2017
    are taken, and a total of 1404 samples are segmented into training and testing
    sets. As far as inputs to the model are concerned, the rainfall time series is
    decomposed into various low- and high-frequency components using wavelet transform.
    The predictors for this random forest model include detail components and the
    fifth approximate signal, where the latter represents low-frequency component.
    The regression is carried out with 800 training samples and remaining 604 for
    testing.


    Table 5.1 depicts the performance metrics for a random forest model. In terms
    of RMSE, a value of 25.14 indicates a high error when compared to the persistence
    algorithm and ARIMA model. This poor performance is depicted by a low SSR/SST
    value, indicating that for the current dataset, the quality of predictors in terms
    of wavelet decomposition is not sufficient to carry out regression analysis as
    per RF model.

