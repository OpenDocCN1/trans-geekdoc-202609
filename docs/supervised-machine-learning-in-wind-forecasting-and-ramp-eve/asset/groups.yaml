    transformed using logarithmic transformation and is plotted for its frequency
    distribution. Fig. 7.2 illustrates the frequency distribution for ramp speed and
    area burnt. The ramp wind speed follows a normal distribution indicated by red
    solid line, and random changes in its magnitude lead to increased risk of forest
    fires as indicated by an upward increasing trend with rapid changes in wind speed.


