    # CHAPTER 6


    # # Hybrid machine intelligent wind speed forecasting models


    Modern day grid reliability and security are highly dependent on accurate wind
    speed and power forecasts. Whereas the nonlinear nature of wind speed poses challenges
    in forecasting via traditional methods, machine learning-based hybrid models adequately
    address this issue. In this chapter, we use a hybrid model based on wavelet decomposition
    technique and several variants of SVR. To determine the best model, performance
    metrics are calculated for real-time wind speed datasets. ε-twin support vector
    regression (ε-TSVR) and twin support vector regression (TSVR) are used to forecast
    short-term wind speed in tandem with classical SVR and LSSVR, and its performance
    is compared with the benchmark persistence model. We also evaluate the performance
    of these models for a larger dataset based on wind sites in USA and India.


    # ## 6.1 Introduction


    Research in the field of wind forecasting has tremendously increased for the hybrid
    models based on machine learning [1]. Candenas and Rivera [2] demonstrated ARIMA-ANN
    based forecasting model, where for a fixed prediction horizon, wind forecasting
    is carried out. Liu et al. [3] presented a support vector machine and genetic
    algorithm (GA) based hybrid forecasting method using the wavelet decomposition
    transform for fragmenting the wind speed time-series to eliminate any potential
    stochastic variation. Zhang et al. [4] presented a hybrid technique based on Gaussian
    process regression (GPR) and autoregression (AR) and compared their results with
    SVM, ANN, and the persistence algorithm. Mi et al. [5] explored a hybrid method
    that encompasses the wavelet decomposition transform, extreme learning machine,
    and outlier correction technique to forecast the multi-step wind speed. The wavelet
    and wavelet packet decomposition eliminates noisy component from the wind series,
    and the extreme learning machine provides multistep forecast on the subsignals
    obtained from the decomposition technique.'
  - '[PAGE 93]


    Li et al. [6] presented a combined method based on constant weight and variable
    weight for short-term wind speed prediction. Jiang et al. [7] proposed a novel
    method for short-term wind prediction based on modeling the fluctuations caused
    by adjacent wind turbines, and the selected inputs are given to a v-SVM model.
    Azimi et al. [8] presented a feature selection model based on k-means cluster
    and a multilayer perceptron neural network for predicting short-term wind speed.
    Jiang et al. presented a correlation-based discrete wavelet transform (DWT), least-square
    support vector machine (LSSVM), and generalized autoregressive conditional heteroscedastic
    (GARCH) method for short-term wind speed prediction. Correlation coefficients
    among different subseries are used to assess the inputs to the LSSVR models for
    wind speed prediction [9].


    Liu et al. [10] discussed a modified Broyden–Fletcher–Goldfarb–Shanno (BFGS) neural
    network and wavelet transform-based signal processing technique for short-term
    wind speed prediction and validated the same for four wind speed datasets. Correlation
    coefficients are determined for each subseries obtained after wavelet decomposition
    for assessing their relative importance. Tian et al. [11] presented a multiobjective
    forecasting algorithm wherein data preprocessing technique is based on a complementary
    ensemble empirical mode decomposition (EEMD), variational mode decomposition,
    and sample entropy. The proposed model is further validated for eight wind speed
    datasets, and results reveal the superiority of the model when compared to benchmark
    models. However, the only limitation of this model is the time consumed in intermediate
    stages. Three variables, wind speed, electrical load, and electricity price, are
