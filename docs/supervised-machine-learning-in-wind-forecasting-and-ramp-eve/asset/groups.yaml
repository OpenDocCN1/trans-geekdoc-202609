    ## 6.2 小波变换


    信号处理技术已与机器学习方法联合使用，以提高预测精度并消除时间序列中的随机波动。傅里叶变换、小波变换和小波包分解等信号变换是常用的算法。在风速分解中使用傅里叶变换的主要缺点是关于时间尺度的信息丢失，而小波变换克服了这一问题。小波变换在时间和频率尺度上捕获信号的信息。由于时域变化在风速时间序列分析中具有更大的重要性，因此不优先使用傅里叶变换。


    小波变换的想法最初由地球物理学家 Jean Morlet 于 1982 年提出，用于地震波分析，可分为连续小波变换 (CWT) 和离散小波变换 (DWT)。连续小波涉及母小波的连续缩放和时间移位。高尺度（低通滤波器）提供关于信号的近似信息，而低尺度（高通滤波器）提供信号的详细信息。从计算角度看，DWT
    比 CWT 更丰富，因此前者在信号处理中应用更广泛。从数学上讲，CWT 和 DWT 表示为


    ```

    B(a, b) = \frac{1}{\sqrt{a}} \int_{-\infty}^{+\infty} r(x)\phi\left(\frac{x -
    b}{a}\right), \quad (6.1)


    B(u, v) = 2^{-u/2} \sum_{t=0}^{N-1} r(t)\phi\left(\frac{t - v \cdot 2^u}{2^u}\right),
    \quad (6.2)

    ```


    其中 r(t) 是风速时间序列，N 是其长度，\(\phi\) 是母小波函数，缩放和平移参数是整数 u 和 v 的函数。首先，将原始风速时间序列分解为低频和高频分量。小波变换的主要目标是从风速时间序列中收集重要信息。就风力预测而言，选择合适的分解信号作为预测模型的输入。小波滤波器可以从
    Haar、Daubechies、墨西哥帽和 Coiflet [15] 等小波家族中选择。WT 过程涉及每个阶段对近似信号进行连续分解，如图 6.1 所示。


    每个分解阶段获得的两个信号是近似信号（A5，包含低频分量）和细节信号（D1, ..., D5，包含高频分量），它们共同构成输入特征矩阵。风速是短期风力预测算法（SVR
    及其变体）中使用的输出，如图 6.2 所示。


    ## 6.3 混合预测框架


    本研究利用混合小波变换和基于 SVR 的方法进行短期风速预测。就滤除随机波动的能力而言，混合方法比单一方法更高效。风速预测误差取决于预测持续时间或范围。对于市场清算操作和经济负荷调度，通常短期风速预测（范围从
    30 分钟到 3 小时）是首选方案。现代电力市场已从受管制市场转向去管制市场，这允许多个参与者进入竞价过程，从发电公司购买零售电力。风力预测采用混合模型进行，即小波-SVR、小波-LSSVR、小波-TSVR
    和小波-ε-TSVR。通过计算各种性能指标来评估预测精度，如均方根误差 (RMSE)、平均绝对误差 (MAE)、平方残差和 (SSR)、测试样本平方偏差和
    (SST)、测试样本平方误差和 (SSE)、一致性指数 (IOA) 以及 Theil''s U1 和 U2 统计量 [16]。从数学上讲，这些指标表示为


    ```

    RMSE = \left[ \frac{1}{n} \sum_{i=1}^{n} (\hat{x}_i - x_i)^2 \right]^{1/2} , \quad
    \text{MAE} = \left[ \frac{1}{n} \sum_{i=1}^{n} |\hat{x}_i - x_i| \right] , \quad
    (6.3)

    ```


    ```

    SSR/SST = \frac{\sum_{i=1}^{n} (\hat{x}_i - \bar{x})^2}{\sum_{i=1}^{n} (x_i -
    \bar{x})^2}, \quad \text{SSE/SST} = \frac{\sum_{i=1}^{n} (\hat{x}_i - x_i)^2}{\sum_{i=1}^{n}
    (x_i - \bar{x})^2}, \quad (6.4)

    ```


    ```

    IOA = 1 - \sum_{i=1}^{n} (\hat{x}_i - x_i)^2 \Big/ \sum_{i=1}^{n} (|\hat{x}_i
    - \bar{x}| + |x_i + \bar{x}|)^2 ,

    ```


    ```

    U1 = \sqrt{ \frac{1}{n} \times \sum_{i=1}^{n} (\hat{x}_i - x_i)^2 } \Big/ \left(
    \sqrt{ \frac{1}{n} \times \sum_{i=1}^{n} x_i^2 } + \sqrt{ \frac{1}{n} \times \sum_{i=1}^{n}
    \hat{x}_i^2 } \right) ,

    ```


    ```

    U2 = \sqrt{ \frac{1}{n} \times \sum_{i=1}^{n} \left( (x_{i+1} - \hat{x}_{i+1})
    / x_i \right)^2 } \Big/ \sqrt{ \frac{1}{n} \times \sum_{i=1}^{n} \left( (x_{i+1}
    - \hat{x}_i) / x_i \right)^2 } ,

    ```


    其中 \(\hat{x}_i\)、\(x_i\) 和 \(\bar{x}\) 分别是测试样本的预测值、实际值和平均值。Theil''s U1 和 U2 统计量是重要指标，常用于金融和银行业，以确定预测精度和质量。统计量
    U1 决定预测的准确性，而 U2 决定预测的质量。图 6.3 显示了通过混合小波-SVR 方法进行预测的框图。


