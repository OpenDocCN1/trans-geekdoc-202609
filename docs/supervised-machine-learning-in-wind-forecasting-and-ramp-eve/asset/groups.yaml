    ## 传记


    ### 关于系列编辑


    伊夫·加农博士是加拿大蒙克顿大学工程学教授，同时兼任泰国宋卡大学客座教授。在此之前，加农博士曾任加拿大自然科学与工程研究委员会（NSERC）访问主管，他是新不伦瑞克创新基金会的创始主席兼首席执行官，并曾任蒙克顿大学研究副校长、研究生研究学院院长以及K.C.
    Irving可持续发展讲座教授。


    作为机械工程师，加农博士获得美国麻省理工学院和法国图卢兹大学的研究生学位，而宋卡大学授予他科学荣誉博士学位。加农博士积极从事研究，获得过各种资助和研究合同支持。他的研究和创新工作通过国家和国际合作开展，已发表300多篇出版物和报告；其贡献已获得多项奖项认可。在编辑职务方面，加农博士曾任《ASME太阳能工程期刊》副编辑，负责风能板块。


    ### 关于作者


    哈什·S·迪曼于1992年出生于昌迪加尔，目前在印度艾哈迈达巴德基础设施技术研究与管理学院（IITRAM）电气工程系攻读博士学位，导师是迪潘卡尔·德布教授。他获得印度瓦多拉马哈拉贾·塞贾伊·拉奥大学巴罗达分校技术与工程学院电气电力工程硕士学位，以及印度艾哈迈达巴德尼尔玛大学理工学院电气工程学士学位。他的当前研究兴趣包括风电场混合运行、混合风能预测技术以及风电场尾流管理。


    迪潘卡尔·德布于2007年在弗吉尼亚大学夏洛茨维尔分校完成博士学位，导师是IEEE会士、电气与计算机工程系教授康涛教授。2017年，他当选为IEEE高级会员。他曾任GE全球研究班加罗尔分公司首席工程师（2012–2015），以及印度古瓦哈蒂理工学院电气工程系助理教授（2010–2012）。目前，他是印度艾哈迈达巴德基础设施技术研究与管理学院（IITRAM）电气工程系教授兼系主任。他是《IEEE
    Access期刊》副编辑。他撰写了21篇SCI索引期刊论文，拥有6项美国授权专利，并编著或编辑了八本书。他的研究兴趣包括控制理论、稳定性分析和可再生能源系统。


    **瓦伦蒂娜·艾米莉亚·巴拉斯** 拥有罗马尼亚特米什瓦拉理工学院应用电子与电信博士学位。巴拉斯博士是经过同行评议期刊和国际会议上300多篇论文的作者。她的研究兴趣包括智能系统、模糊控制、软计算、智能传感器、信息融合以及建模与仿真。她是《高级智能范式国际期刊》(IJAIP)
    和《计算系统工程国际期刊》(IJCSysE) 的主编，多个国家和国际期刊的编委会成员，以及国家和国际项目和博士论文的评审专家。巴拉斯博士是罗马尼亚阿拉德奥雷利·弗拉伊库大学智能系统研究中心主任，也是同一所大学国际关系、方案与项目部主任。她曾任2005–2018年在罗马尼亚和匈牙利举办的八届国际软计算与应用研讨会（SOFA）的大会主席。巴拉斯博士以组织者、荣誉主席、分会主席以及指导、咨询或国际项目委员会成员的身份参加了许多国际会议。她是SIAM成员、IEEE高级会员、IEEE
    CIS模糊系统技术委员会（TC-Fuzzy systems）成员、IEEE CIS新兴技术技术委员会（TC-Emergent Technologies）成员、IEEE
    SMCS软计算技术委员会（TC-Soft computing）成员。巴拉斯博士曾任国际模糊系统协会理事会副主席（奖项）（2013–2015），并是印度多学科学术机构——跨学科数学论坛（FIM）理事会联合秘书。


    ## 前言


    近年来，替代能源因其清洁运行而日益受到重视。由于化石燃料和核资源有限，太阳能和风能技术的市场份额不断扩大。鉴于其丰富的可持续性，可再生能源电力组合增强了国家经济的支柱。除了对环境的积极影响外，风能在全球范围内还创造了就业机会。随着可再生能源渗透率的提高，其运行和控制变得至关重要。风力涡轮机经历着广泛的动态现象。实现规模经济是风电场运营的主要目标。


    鉴于风速的随机性，准确的风能预测方案可帮助运营商最大限度地减少损失。选择最佳运行策略可降低系统成本并提高电力系统的可靠性。风能在全球范围内通过就业机会和基于可再生能源的电力供应影响了成千上万人的生计。21世纪，全球风能装机容量激增，尤其是在海上地区。然而，风力发电的间歇性给电网可靠性带来了额外挑战。风速的随机性要求提前进行准确的风能预测，以便规划最佳电力调度。基于数值天气预报和基于时间序列的统计模型（ARMA、ARIMA
    和 S-ARIMA）的传统模型由于风速的非线性而面临诸多不足。


    本书探讨了短期风能预测技术面临的问题，并介绍了能够解决上述传统方法问题的混合机器智能算法。基于信号分解技术并结合支持向量回归及其变体等机器学习算法的短期风速预测，能够提供准确的风能预报。本文讨论了SVR的变体，如最小二乘支持向量回归（LSSVR）、双支持向量回归（TSVR）和ε-双支持向量回归（ε-TSVR）。


    第1章讨论了全球对风能的需求以及与未来几年装机容量和预计电力产量相关的详细统计数据。它还阐述了本书的动机和目标。第2章重点介绍了风能的基本概念，从电力生产、陆上和海上区域的风速分布，以及地形变化时常用的风速剖面定律入手。


    第3章阐述了风能预测的范式，聚焦于预测需求、问题和挑战。我们还讨论了传统的预测方案，并逐步强调了机器学习算法在短期风速预测中的必要性。接下来，第4章深入探讨了有监督机器学习算法，特别是支持向量回归及其变体。在第5章中，随机森林回归和梯度增强机（GBM）附有相关文献以及针对降雨和原油价格预测的两个案例研究。我们还从计算速度角度讨论了每种方法的重要性。


    第6章介绍了基于小波变换和支持向量回归变体（如ε-SVR、LSSVR、TSVR、ε-TSVR、RFR和GBM）的风能预测混合模型。全球介绍了风电场的案例研究，并讨论了其结果。此外，还评估了SVR超参数对回归质量的影响。第7章讨论了风电场的爬坡事件，推导了预测模型之间的分析关系，并基于其预测性能评估了不同风能数据集中的爬升和爬降事件。


    第8章讨论了在风力尾流存在下，针对基于常规支持向量回归的有监督机器学习回归模型的风速预测特定应用。讨论了包含两种不同风电场布局的案例研究。


    哈什·S·迪曼

    迪潘卡尔·德布

    瓦伦蒂娜·E·巴拉斯

