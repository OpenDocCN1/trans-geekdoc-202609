    for short-term predictions. Thus, to solve this issue with nonlinearity, machine
    learning (ML) models are being used globally to predict the wind speed. Machine
    learning is a part of broader umbrella called artificial intelligence. The term
    machine learning focuses on specific task of either classifying, predicting, pattern
    recognition, clustering, or a combination of some or all of these through a large
    set of real-time examples.


    Machine learning is categorized in two branches, supervised learning and unsupervised
    learning. Supervised learning is the type of learning where the ML algorithm receives
    labeled input examples and intends to converge to the best as possible classifier
    \( f: X \rightarrow Y \), so that a new set of examples can be classified, where
    \( X \) is the representative input feature set, and \( Y \) is the distinctive
    labeled class [15]. In case of classification, \( Y \) is a set of values either
    1 or 0, which corresponds to an individual class. On the other hand, unsupervised
    learning builds a classifier that essentially does not rely on input examples
    but learns itself by analyzing the similarities in the input data.


    Accurate wind speed forecasting depends on availability of large historical dataset,
    which is useful in training a supervised ML regression model. Among supervised
    ML regression methods, support vector machines, artificial neural networks, and
    extreme learning machine are consistently used.


    Fig. 3.7 illustrates everyday examples of machine learning categorized into supervised
    and unsupervised learning methods.


    Classification falls into the category of supervised learning where the individual
    category of *fruits* as depicted in Fig. 3.7 are treated as labels. On the other
    hand, in case of unsupervised learning, the clustering problem is addressed via
    grouping based on similarities found in input data. Unlike supervised learning,
    in this case, no explicit labels are provided to the algorithm.


