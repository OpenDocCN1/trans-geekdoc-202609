  mdcn: '


    用于短期预测。因此，为了解决非线性问题，全球正在使用机器学习（ML）模型来预测风速。机器学习是人工智能这一更广泛领域的一部分。机器学习一词侧重于通过大量实时示例，执行分类、预测、模式识别、聚类或其中一些或全部任务的组合。


    机器学习分为两个分支：监督学习和无监督学习。监督学习是一种学习类型，其中 ML 算法接收带标签的输入示例，并旨在收敛到尽可能好的分类器 \( f: X \rightarrow
    Y \)，以便可以对新的示例集进行分类，其中 \( X \) 是代表性输入特征集，\( Y \) 是不同的标记类 [15]。在分类情况下，\( Y \) 是值为
    1 或 0 的集合，对应于单个类。另一方面，无监督学习构建一个分类器，该分类器本质上不依赖于输入示例，而是通过分析输入数据中的相似性自行学习。


    准确的风速预测取决于大型历史数据集的可用性，这对于训练监督 ML 回归模型很有用。在监督 ML 回归方法中，支持向量机、人工神经网络和极端学习机被持续使用。


    图 3.7 展示了机器学习的日常示例，分为监督学习和无监督学习方法。


    分类属于监督学习类别，其中图 3.7 中描绘的*水果*的各个类别被视为标签。另一方面，在无监督学习的情况下，聚类问题是通过基于输入数据中发现的相似性进行分组来解决的。与监督学习不同，在这种情况下，算法没有提供显式标签。


    图 3.8 展示了监督和无监督机器学习的不同变体。


    人工神经网络被广泛用于预测 3 分钟至 6 小时的风速/功率。在 ANNs 中，最常用的拓扑是多层感知机（MLP）。在 [8] 中，葡萄牙风电场的短期风电预测是通过小波变换和神经网络（NNs）的混合方法实现的，最初风速数据通过离散小波变换分解为子系列，然后输入到
    NN 进行训练部分。一旦训练算法完成，数据集将被发送到学习阶段，


    | 机器学习日常示例 | |

    |---|---|

    | 监督学习 | 无监督学习 |

    | 分类是一种监督学习。这里，苹果、葡萄和草莓属于水果父类。基于每种水果的个别特征，它们可以被分类到各自的类别。 | 另一方面，聚类是一种无监督学习。这里，根据输入数据中发现的相似性，将情绪聚类到各自的组。这些输入不像监督学习那样被标记
    |


    图 3.7 机器学习的日常示例。


    ![](img/b53e39e35231af65df8ccaa99eb28bee_54_0.png)


    图 3.8 机器学习算法的分类。


    其中输入值和所需值之间发生误差最小化。通常，反向传播用作学习算法 [16]。但是，反向传播是一种较慢的技术，因此被 Levenberg–Marquardt
    算法取代。神经网络小波变换（NNWT）方法的结果与 ARIMA(1, 2, 1) 和 NN 进行了比较，其中通过使用前 12 小时的历史数据进行提前 3 小时的预测。使用
    NNWT 方法的 MAPE 发现为 6.97%。


    ## 3.5 混合风能预测方法


    像 ANN、SVR、ELM 和 GPR 这样的单独机器学习方法与诸如小波变换和经验模态分解等信号预处理技术一起使用。信号分解技术将风速时间序列分割成子系列。这些子系列可以单独用于预测，并汇总以获得最终预测序列。


    涵盖单个方法特征的混合模型一直是研究的核心领域，如图 3.9 所示。


    Yuan 等人 [17] 提出了一种混合预测模型，采用自回归分数积分移动平均（ARIFMA）和最小平方支持向量回归来预测短期风电。各种基于机器学习的预测模型已证明其优于时间序列模型。在机器学习方法中，支持向量回归以经典支持向量机的精神估计回归函数
    [18]。Liu 等人 [10] 提出了一种利用小波变换和由遗传算法优化的支持向量机的短期风速预测混合方法。


    另一种研究墨西哥风速预测的混合方法使用 ARIMA 和 ANN 模型，也可用 [19]。Liu 和 Tian [20] 使用小波和小波包以及 ANN 来预测风速，并将其研究结果与
    ANFIS、wavelet-RBF 和持续法等标准模型进行了比较。Xiao 等人 [21] 演示了组合预测模型，根据各个模型在其他各种模型中的优劣对其进行权重计算。在
    [22] 中，作者使用带有统计权重预处理技术的 ANN 来预测地源热泵（GCHP）系统的性能系数。进一步的研究表明，使用优化方法选择模型参数可以获得更好的结果


    ## 混合风能预测方法


    ### 基于信号分解的方法


    - Wavelet-ARIMA

    - Wavelet-ANN

    - Wavelet-SVR

    - EMD-ANN

    - EMD-SVR


    ### 基于参数优化的方法


    - GA-ANN

    - GA-SVM

    - PSO-ANN

    - PSO-ANFIS

    - PSO-SVR


    图 3.9 混合风能预测方法的分类。


    优于单个方法。一种常用的优化技术是遗传算法，因为其收敛速度快。Su 等人 [23] 使用粒子群优化来为结合卡尔曼滤波器的 ARIMA 模型选择最优模型参数，用于风速预测。最近，各种混合技术已被用于研究风电场的短期风能预测。小波变换和经验模态分解等信号分解方法通常用于研究风速的随机性。Du
    等人及相关工作研究了小波分解与神经网络的结合，其中通过对超参数进行多目标优化提高了预测准确性 [24–28]。随后将该模型与持续法、ARIMA 和广义神经网络等基准方法进行比较。结果表明，基于多目标优化的神经网络模型优于基准模型，并且可靠地满足短期风能预测需求。


