    × R, where X denotes the input feature space of dimension Rⁿ. Let Y = $(y_1, y_2,
    \dots, y_i)$ denote the set representing the training output or response, where
    $i=1, 2, \dots, n$ and $y_i \in \mathbb{R}$.


    ### 4.2 ε-support vector regression


    This type of SVR uses an ε-insensitive loss function that intuitively accounts
    for sparsity similar to SVR by ignoring errors less than ε.


    ε-SVR aims to find the linear regressor


    $$f(x) = w^T x + b \quad \text{with } w \in X, b \in \mathbb{R}, \quad (4.1)$$


    for prediction, where $x \in X$ is the input set containing all the features,
    $w$ is the weight coefficient related to each input $x_i$, and $b$ is the bias
    term.


    The objective is to find $f(x)$ with maximum deviation $\varepsilon$ from the
    respective feature sets while being as flat as possible. To achieve the flatness
    of the desired regressor, the square of the norm of weight vector $w$ needs to
    be minimized, and the SVR problem is structured in the form of a convex optimization
    problem [6] as


    $$

    \min \frac{1}{2} \| w \|^2 + C(e^T X + e^T \chi^*), \quad (4.2)

    $$


    subject to


    $$

    y - w^T x - eb \le \varepsilon e + \chi, \chi \ge 0, \quad (4.3)

    $$


    $$

    w^T x + eb - y \le \varepsilon e + \chi^*, \chi^* \ge 0,

    $$


    where $C$ is the regularization factor that reflects the trade-off between the
    flatness of regressor $f(x)$ and the maximum tolerable deviation $\varepsilon$.
    The value of $\varepsilon$ introduces a margin of tolerance where no penalty is
    imposed on the errors. The larger the $\varepsilon$, the larger the errors. The
    parameter $C$ controls the amount of influence of the error. The variables $\chi,
    \chi^*$ are the slack variables introduced as a soft margin to the tolerable error
    $\varepsilon$, and $e$ is the vector of ones of appropriate dimension $n \times
    1$.


    In machine learning regression the problem of overfitting persists, which results
    in less error in training phase and high error in testing phase. Commonly used
    regularization techniques include $\mathcal{L}_1$ and $\mathcal{L}_2$ regularization.
    Mathematically, these are expressed as


    $$

    \mathcal{L}_1: \arg \min_w \text{ loss function } + \lambda \sum_{i=1}^n |w_i|,
    \quad (4.4)

    $$


    $$

    \mathcal{L}_2: \arg \min_w \text{ loss function } + \lambda \sum_{i=1}^n w_i^2.
    \quad (4.5)

    $$


    ![](img/b53e39e35231af65df8ccaa99eb28bee_61_0.png)


    Constraints


    $$

    y - \langle w, x \rangle - b \le \varepsilon + \chi

    $$


    $$

    y - \langle w, x \rangle - b \ge \varepsilon - \chi^*

    $$


    Figure 4.1 Diagrammatic explanation of ε-SVR.


    The formulation of SVR is diagrammatically explained in Fig. 4.1, where the “stars”
    represent the support vectors, green solid line shows the SVR regressor, and blue
    dashed lines are the hyperplanes with soft limit on the tolerance error ε.


    However, this is not always the case, as the feature sets might not be linearly
    separable. To handle such nonlinearities in the feature sets, the so-called kernel
    functions are used to transform data to a higher-dimensional space (“kernel trick”).
    After transformation via a suitable mapping function $\phi : \mathbb{R}^n \rightarrow
    Z$, the data become linearly separable in the target space (high-dimensional space),
    that is, $Z$. The inner product $\langle w^T, \phi(x) \rangle$ in the target space
    can be represented by using a kernel function. Kernel functions are similarity
    functions that satisfy Mercer’s theorem such that $k(x_i, x_j) = \langle \phi(x_i),
    \phi(x_j) \rangle$ are the elements of the kernel matrix $K$. Several kernel functions
    are available in the literature like linear, polynomial of degree $d$, Gaussian,
    and the radial basis function (RBF) with bandwidth of the function $\sigma$ and
    exponential function.


    Fig. 4.2 illustrates the kernel trick used when the input vectors are not linearly
    separable. This transformation makes the computation of weights and bias vector
    much easier. Now we look at the dual form of the optimization problem:


    $$

    \min \frac{1}{2} \sum_{i,j=1}^n (\alpha_i - \alpha_i^*)^T k(x_i, x_j) (\alpha_j
    - \alpha_j^*) + e^T \varepsilon \sum_{i=1}^n (\alpha_i + \alpha_i^*) - \sum_{i=1}^n
    y_i(\alpha_i - \alpha_i^*) \quad (4.6)

    $$


    $$

    \text{s.t. } e^T \sum_{i=1}^n (\alpha_i - \alpha_i^*) = 0, \quad 0 \le \alpha,
    \quad \alpha^* \le C e

    $$


