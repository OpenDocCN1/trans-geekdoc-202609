    ## 2.4 风电机组微选址


    风能提取不仅取决于时间分布，还取决于空间分布。随给定风电场中风电机组数量的增加，其横向和纵向间距会影响每台机组遇到的有效风速。此外，特定风电场场址的地形特征会影响捕获的功率。由高风速引起的风切变也可能导致叶片几何形状和塔筒强度受损。在风电场中对风电机组进行最优布置以最大化功率捕获并最小化发电成本的过程称为微选址。


    微选址的早期研究涉及使用遗传算法进行最优风电场布局，如Mosetti等人[16]所述，其中一个面积为4 km²的风电场被分为大小为5D的单元，其中D为转子直径。考虑了两种情况，第一种情况为单一风速方向，第二种情况为多风向。结果表明，拥有40到50台机组的随机风电场布局效率为50%，而优化的风电场布局效率为95%。此外，Wan等人[17]采用PSO技术进行了风电场微选址。风电场优化的结果与Grady等人[18]的研究进行了比较，显示在风速为12
    m/sec的单一风向下，风能捕获率提高了6.34%。Wan等人[19]提出了一种带有局部搜索策略的高斯粒子群优化（GPSO）算法，用于确定最优风电场布局。为了改进微选址，将局部搜索策略应用于GPSO，结果表明与经验方案相比，风电场效率提高了14.61%。像通用电气这样的跨国公司在过去几十年中广泛开展了微选址工作，以显著提高风电场的年发电量（AEP）。


    ![](img/b53e39e35231af65df8ccaa99eb28bee_39_0.png)


