    where \(\gamma\) is the margin parameter, and \(\varepsilon_i\) is the error term
    corresponding to each \(x_i\). The optimization problem can be transformed by
    introducing Lagrange multipliers and is given as


    ```

    \(\begin{aligned} L(w, b, \varepsilon, \alpha) = \frac{1}{2} \| w \|^2 + \frac{1}{2}\gamma
    \sum_{i=1}^n \varepsilon_i^2 - \sum_{i=1}^n \alpha_i(w^T \phi(x_i) + b + \varepsilon
    - y_i). \quad (4.11) \end{aligned}\)

    ```


    The Karush–Kuhn–Tucker (KKT) conditions for the optimization problem (4.11) can
    be obtained by partially differentiating the Lagrangian function with respect
    to \(w, b, \varepsilon, \alpha\) given by


    ```

    \(\begin{aligned} \begin{bmatrix} k(x, x^T) + \gamma^{-1} I & e \\ e^T & 0 \end{bmatrix}
    \begin{bmatrix} \alpha \\ b \end{bmatrix} = \begin{bmatrix} y \\ 0 \end{bmatrix},
    \quad (4.12) \\ f_{LSSVR}(x) = \sum_{i=1}^n \alpha_i k(x, x_i) + b, \quad (4.13)
    \end{aligned}\)

    ```


    where \(I\) is the identity matrix of appropriate dimension. The regressor obtained
    by LSSVR is given by (4.13) and solves the optimization problem of size smaller
    than classical \(\varepsilon\)-SVR, taking less computation time. LSSVR is an
    improved variant of \(\varepsilon\)-SVR with a squared penalty term in the loss
    function and is applied to several branches of science and engineering to obtain
    accurate forecasts as illustrated in Fig. 4.7.'
