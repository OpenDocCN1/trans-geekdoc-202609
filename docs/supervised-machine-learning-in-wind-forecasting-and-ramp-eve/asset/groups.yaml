    $$f(x) = \sum_{i=1}^{n} (\alpha_i - \alpha_i^*)k(x, x_i) + b.$$

    (4.7)


    The complexity of this regressor is independent of the dimensionality of the feature
    set and only depends on the number of support vectors, which are nothing but the
    data points that separate the feature sets from each other. However, the performance
    of the SVR also depends on the choice of a kernel function and helps in reducing
    the computation time of the regression. A flowchart with a step-by-step implementation
    of the $\varepsilon$-SVR algorithm is described in Fig. 4.3.


    $\varepsilon$-SVR-based regression models are used in several applications as
    illustrated in Fig. 4.4.


    Chen et al. [7] have described a parameter search-based SVR forecasting method
    for predicting stock prices. The parameter search algorithms like the genetic
    algorithm, particle swarm optimization, and grid search are used to use the optimal
    value of SVR hyperparameters. The daily historical trading data of CSI 300 index
    is chosen for 3 years. The training set comprises of 759 days and remaining 190
    days for testing. It is found that GA-SVR-based method yielded minimum RMSE followed
    by PSO-SVR and grid search. Tao et al. [8] have presented a simulated annealing
    (SA) based SVR model for forecasting air conditioning load. Hourly data


    ![](img/b53e39e35231af65df8ccaa99eb28bee_63_0.png)


    Figure 4.3 Schematic flowchart for ε-SVR algorithm.


    ![](img/b53e39e35231af65df8ccaa99eb28bee_63_1.png)


    Figure 4.4 Applications of ε-SVR prediction.


    from July 2011 to August 2012 are taken. The training set comprises of 10 months
    from July 2011 to June 2012, whereas the testing set is of 2 months (July–August
    2012). A mixed kernel function comprising polynomial kernel and radial basis function
    is taken. Three models, that is, SA-SVR, VFSA-SVR, and MSA-SVR, are tested, and
    results reveal that MSA-SVR outperforms VFSA-SVR and SA-SVR. The average time
    consumed by each of these methods is also computed, and it is found that VFSA-SVR
    is the fastest of the three models.


    In terms of traffic flow forecasting, Hong et al. [9] have carried out a hybrid
    forecasting model employing ant-colony optimization (ACO) based


