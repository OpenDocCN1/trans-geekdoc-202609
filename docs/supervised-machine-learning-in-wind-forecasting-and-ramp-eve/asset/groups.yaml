    The steps for determining the intrinsic mode function (IMFs) and residue of a
    time series are the following:


    +   - For a given time-series \(a(t)\), locate local maximum and minimum and interpolate
    to form \(a_u(t)\) and \(a_l(t)\) as upper and lower envelopes.

    +   - Work out the mean of upper and lower envelopes \(a_m(t) = \frac{a_u(t)+a_l(t)}{2}\).

    +   - Obtain a detailed component \(a_d(t)\) by subtracting the mean component
    from the original time series as \(a_d(t) = a(t) - a_m(t)\).

    +   - Obtain first IMF and residue if \(a_m(t)\) and \(a_d(t)\) fulfill anyone
    of the stopping criteria. Stopping criteria: (i) mean envelope developed by maxima
    and minima should be zero, and (b) number of zero crossings and extrema should
    differ by one or zero.

    +   - Repeat the previous steps until you obtain the first IMF and residue.


