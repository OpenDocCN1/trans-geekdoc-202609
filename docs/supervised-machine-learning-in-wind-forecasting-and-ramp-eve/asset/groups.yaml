    # ## 4.4 Twin support vector regression


    Peng [15] introduced an efficient solution of the regression through a modified
    form of support vector machines known as twin support vector regression (TSVR),
    which derives two nonparallel hyperplanes around the data points. The flowchart
    depicting the steps involved in the TSVR algorithm is shown in Fig. 4.9.'
