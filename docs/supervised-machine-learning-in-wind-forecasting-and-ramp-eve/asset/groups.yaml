    \(\frac{\partial L(v|k, \lambda)}{\partial \lambda} = \frac{-n\lambda}{k} + \frac{\lambda}{k}
    \sum_{i=1}^n \left(\frac{v_i}{\lambda}\right)^k, \quad (2.5)\)


    \(\frac{\partial L(v|k, \lambda)}{\partial k} = \frac{n}{k} - n \log(\lambda)
    + \sum_{i=1}^n v_i - \sum_{i=1}^n \left(\frac{v_i}{\lambda}\right)^k \log\left(\frac{v_i}{\lambda}\right).
    \quad (2.6)\)


