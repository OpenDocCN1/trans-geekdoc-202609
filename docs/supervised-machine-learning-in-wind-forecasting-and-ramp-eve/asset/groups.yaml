    m/s至15 m/s的范围内。风速的快速变化还会导致沿海地区高层建筑和低层住宅被连根拔起。然而，地表风造成了大部分损害，其变异性高度依赖于地表的性质。土地性质由地表粗糙度长度z₀表征，不同表面之间有所差异。


