    ## Epilogue


    Wind speed prediction is an integral part of the wind energy sector. The power
    available in wind resource is enormous and hence requires its accurate assessment
    for a given regime. A modern day power grid relies on the availability of reserve
    power capacity, and this dependency can escalate the system cost. Wind forecasting
    based on the future time horizon plays an important role in the deregulated market
    structure. From an economic perspective, wind power schedules available ahead
    in time can lead to optimal power dispatch for a large interconnected power system.
    With the concept of hybrid wind farms getting popular among developing and developed
    countries, the research in the field of forecasting has increased tremendously.


    Wind speed forecasting in the modern day markets is carried out with a sole purpose
    to plan the reserve power capacity. An erratic forecast can jeopardize the system
    equilibrium in terms of generation and demand. To solve this issue of accurate
    wind power forecast, machine intelligent models in tandem with statistical models
    are used to improve short-term and medium-term forecasts. The nonlinearity in
    wind speed time series causes statistical models to fail, thus paving the way
    for machine intelligent models. Commonly used signal decomposition techniques
    that aim to address the volatility in wind speed time series aid the accuracy
    of short-term wind speed prediction. The wavelet transform and empirical mode
    decomposition are among the popular techniques that are implemented for decomposing
    wind speed time series. Apart from these packet decomposition technique that decomposes
    both low-frequency and high-frequency signals at each stage is also used. However,
    due to its time consumption issue, it is not preferred. In this book, models based
