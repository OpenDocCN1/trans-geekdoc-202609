    In benign terms, statistical forecasting methods indicate the use of statistics
    based on the available historical quantitative data to ascertain what could happen
    in the future.


    Short-term wind forecasting is the most commonly used forecasting category, which
    many day-ahead markets need to clear the market scenarios by the end of the day.
    Among these, the most used forecasting methods are a combination of two or more
    machine learning methods combined with time-series models like AR, MA, ARMA, ARIMA,
    and ARMAX. Auto regression (AR) is a time-series model that uses observations
    taken from previous time steps as input to a regression equation to forecast the'
