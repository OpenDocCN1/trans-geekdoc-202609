    等气体以及 KCl 和 NaCl 等盐。使用了两种模型，分别是深度神经网络（DNN）和梯度提升回归树，以压力和温度作为输出。结果表明，GBM 模型在以温度和压力作为模型输入时均优于
    DNN。此外，以温度作为输出的 GBM 模型优于以压力作为输出的 GBM 模型。


