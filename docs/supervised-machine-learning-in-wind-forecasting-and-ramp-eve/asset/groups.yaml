    ## 基于决策树集成的回归模型


    机器学习中的历史数据对全球的数据分析师来说是一大利好。在回归模型方面，第3章中描述的持久性算法和ARIMA等基准模型无法表达风速时间序列中的非线性趋势。具有核映射能力的机器学习模型在该类情况下广泛适用。


    在准确性方面，基于监督学习的机器学习模型具有良好的泛化性能，即机器学习模型适应未见数据的能力。然而，基于集成的预测需求源于过拟合问题，该问题出现在支持向量回归、多元线性回归和神经网络等模型中。我们将在后续章节中结合实时数据集讨论过拟合场景。决策树旨在得出两种类型的决策：连续型（回归）和离散型（分类）。


    ### 5.1 随机森林回归


    由Breiman [1]提出，随机森林是一种集成方法，它从给定的训练样本生成类似森林的树集合。基于集成的模型比单一方法准确得多，这归功于捕捉单个方法得到的时间序列的线性和非线性等优势。


    随机森林首先将输入特征分割成一组本质上形成一棵树的子集。特定树由一个节点特征描述，该节点引出多个分支，如图5.1所示。


    与SVR中的超参数（σ和C）类似，在随机森林回归中，树的数量和每个树分解中的随机特征数量是决定回归性能的参数。在每个决策树中，会创建一个拟合函数，作用于所选的随机特征。最终，在训练过程结束时会创建一个随机森林模型。值得指出的是，在训练过程中，每棵树都是由随机选择的输入向量创建的，因此被称为“随机”森林。在数学上，随机森林回归的估计输出为


    ![](img/b53e39e35231af65df8ccaa99eb28bee_80_0.png)


    图5.1 随机森林回归模型框图。


    由下式给出


    \(\hat{A} = \frac{1}{k} \sum_{i=1}^{k} \hat{r}(X, V_i),\) (5.1)


    其中，\(\hat{r}(X, V)\) 是训练过程结束时的代表树，\(X\) 是输入特征向量集合，\(T\) 是代表输入–输出对的集合 \(V_i = (x_1,
    y_1), (x_2, y_2), \dots, (x_n, y_n)\)。预测输出是对 \(k\) 个决策树求平均。随机森林回归的另一个优势是通过输入的差分采样，由于树之间不相关，因而对噪声不敏感。图5.1
    说明了随机森林回归模型的框图。决策树对其训练数据敏感。更改训练数据可能会改变预测结果。


    与此同时，当训练良好的模型也捕获噪声分量时，机器学习回归模型中普遍存在过拟合问题。为了减轻过拟合带来的复杂性，随机森林在灵活模型和不灵活模型之间做出妥协。在训练阶段，每棵回归树会从特征集中重复抽取样本。这保证了即使单棵树可能具有高方差，整个森林的方差可能较低。随机森林基于bagging原理工作，该原理结合不同树模型的预测，从而对正在训练的数据给出整体洞察。这也有助于减轻监督机器学习模型可能导致的过拟合。在bagging情况下，负相关学习（NCL）原理也适用于基于回归的问题
    [2]。在 NCL 中，计算集成中单个样本的误差时会加入一个惩罚项。单个样本 i 的修改后误差函数由以下公式给出


    \(E_i = \frac{1}{N} \sum_{i=1}^N \left(F_i(X) - y_i\right)^2 + \frac{1}{N} \sum_{i=1}^N
    \beta p_i, \qquad (5.2)\)


    其中，\(F_i(X)\) 是第 \(i\) 个样本的预测输出，\(y_i\) 是实际值，\(\beta \in [0,1]\) 是控制惩罚强度的项，\(p_i\)
    是相关函数。


    随机森林回归已应用于工程的多个领域。由于随机森林能够很好地处理缺失数据，因此可以准确预测森林火灾、雨量流量和土壤侵蚀等变量。Oliveira 等人 [3]
    使用随机森林（RF）回归来预测欧洲地中海地区的森林火灾。火灾密度数据来自欧洲火灾数据库，时间为6月至9月。平均海拔、最低温度、最高温度和地表粗糙度等变量被选为预测因子。RF模型的预测结果与线性回归进行了比较。结果表明，RF模型优于线性回归，表明预测因子与森林火灾之间存在非线性关系。Gong
    等人讨论了RF模型与线性回归在预测国际粗糙度指数（IRI）方面的对比。粗糙度指数和预测因子的数据为平均降水量、平均冰冻指数、初始IRI测量值和年平均日交通量。选取了11000个样本，并将其分为训练集（80%）和测试集（20%）。RF模型的超参数使用网格搜索方法进行优化。就MSE和\(R^2\)而言，结果表明RF模型优于线性回归模型。


    Smith 等人 [4] 讨论了多元线性回归（MLR）和随机森林回归，以预测各种化学品的浓度水平。随机森林模型考虑了多变量之间的非线性，结果表明，虽然MLR优于RF模型，但在某些情况下，RF模型的预测性能好得多。Yuchi
    等人 [5] 探索了随机森林模型和多元线性回归，用于颗粒物浓度的预测。颗粒物PM2.5基于多个预测因子进行预测，如室外PM2.5浓度、季节、齿轮数量和清洁剂数量。共评估了447个样本，所有模型均采用10折交叉验证技术。MLR和RF等单个模型的\(R^2\)值分别为0.502和0.498，而综合考虑MLR和RF的混合模型给出了0.815的\(R^2\)值，表明其在预测室内PM2.5浓度方面具有优越性。


    Zahedi 等人 [6] 提出了一种RF模型，用于预测弯管管件中的固体颗粒侵蚀。为此目的，选择了管径、颗粒尺寸、液体粘度和材料硬度等预测变量。RF模型的性能与线性回归、支持向量机和神经网络等基准模型进行了比较。结果表明，RF模型的预测值与实验值吻合良好。还观察到，RF模型高估了侵蚀率，这可能是由于不同预测变量之间相互影响所致。我们现在讨论两个随机森林模型案例研究，分别涉及降雨和原油价格预测。


    ### 5.1.1 月度降雨预测：案例研究


    为了检验随机森林模型相对于持久性算法等基准模型的有效性，在印度喜马偕尔邦开展了一项月度降雨预测案例研究。选取了1901–2017年的月度降雨数据，共1404个样本，分为训练集和测试集。就模型输入而言，利用小波变换将降雨时间序列分解为各种低频和高频分量。该随机森林模型的预测因子包括细节分量和第五近似信号，后者代表低频分量。回归使用800个训练样本进行，其余604个用于测试。


    表5.1 显示了随机森林模型的性能指标。就RMSE而言，25.14的值与持久性算法和ARIMA模型相比表明误差较高。这种表现不佳由较低的SSR/SST值体现，表明对于当前数据集，从小波分解角度看，预测因子的质量不足以根据RF模型进行回归分析。


