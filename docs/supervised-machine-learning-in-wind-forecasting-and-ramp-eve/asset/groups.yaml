    # APPENDIX A


    # Introduction to R for machine learning regression


    # A.1 Data handling in R


    Data in R can be handled in several forms like vectors, lists, matrices, and data
    frames. Commonly used forms are vectors and lists as they are easy to work with.
    Vectors and matrices represent homogeneous data, whereas lists and data frames
    deal with heterogeneous data.


    # A.1.1 Data handling via vectors, lists, and data frames


    # **Example A.1.** Creating vectors in R


    ```

    Player <- c("Cristiano","Messi","Neymar")

    Salary<-c(35000,50000,100000)

    ```


    # **Example A.2.** Creating lists in R


    ```

    Profile <- list(name=c("Cristiano","Messi","Neymar"),

    salary=c(75000,50000,100000))

    ```


    # **Output**


    ```

    Profile

    $name

    [1] "Cristiano" "Messi" "Neymar"

    $salary

    [1] 75000 50000 100000

    ```


    # A.1.2 Importing data through .xlsx and .csv files


    Most of the data used in machine learning applications are stored in forms of
    column vectors, which are saved in .xlsx or .csv files. Data handling, storing,
    manipulation, and computation offered by Microsoft Excel file format is undisputed
    in terms of popularity and security. Conveniently, in R the Excel files with large
    chunk of data can be directly imported into workspace by using simple one line
    command. The following code shows how to import wind data along with several other
    weather variables for a site in Brazil; see the output of the data imported and
    visualize the summary of the imported data.'
