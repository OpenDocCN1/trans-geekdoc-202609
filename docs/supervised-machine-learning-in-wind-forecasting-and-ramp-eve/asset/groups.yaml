    ## CHAPTER 7


    ## Ramp prediction in wind farms


    Globally, wind energy has lessened the burden on conventional fossil fuel-based
    power generation. Wind resource assessment for onshore and offshore wind farms
    aids in accurate forecasting and analyzing the nature of ramp events. Ramp events
    are scenarios in wind farms where the wind speed changes over a small amount of
    time leading to large power change. From an industrial point of view, a large
    ramp event in a short time duration is likely to cause damage to the wind farm
    connected to the utility grid. In this chapter, ramp events are predicted using
    hybrid machine intelligent techniques such as support vector regression (SVR)
    and its variants, random forest regression, and gradient boosted machines for
    onshore and offshore wind farm sites. A wavelet transform-based signal processing
    technique is used to extract features from wind speed. Results reveal that SVR-based
    prediction models give the best forecasting performance. In addition, gradient
    boosted machines (GBM) predict ramp events closer to the twin support vector regression
    (TSVR) model. Furthermore, the randomness in ramp power is evaluated for onshore
    and offshore wind farms by calculating the log energy entropy of features obtained
    from wavelet decomposition and empirical mode decomposition.


    ### 7.1 Ramp events in scientific and engineering activities


    As has been seen so far in this book, wind forms basis of many daily engineering
    applications. Primarily, it is tapped from atmosphere for generating electric
    power for commercial, residential, and industrial purposes [1]. Statistics have
    revealed that the wind power is a significant backbone in the power portfolio
    of many developing and developed countries [2]. The power generated from wind
    is efficient and has negligible carbon footprints, thus making it one of the cheapest
    sources of energy [3]. Wind turbines are often erected near agricultural lands
    and allow farmers to continue their farming practice as the area occupied by a
    single wind turbine is very small as compared to the surrounding available land.
    However, a major challenge with wind energy is its intermittency, which makes
    its reliability a serious challenge [4]. Through the advanced forecasting algorithms
    it is possible to predict the wind speed up to a certain level of accuracy. Further,
    siting a proper wind farm location plays an important role in shaping the sustainability
    of grid integration of wind energy. Though there are several positive impacts
    of wind energy in terms of power generation and pollution-free source, it has
    also raised ecological concerns in terms of bird killings caused by turbine rotors
    and high noise levels [5]. Desholm [6] has ranked the bird species in terms of
    their sensitivity to bird-turbine collisions for Nysted wind farm in Denmark.
    A recent study in China based on learning curve analysis has stated that the wind
    farm performance has benefited largely from the experience of turbine manufacturers
    and wind farm developers, indicating an indirect financial impact of wind resource
    [7].


    Wind speed also influences many commercial practices like agriculture, crop forecasting,
    flood forecasting, earthquake forecasting, and building energy demand forecasting
    [8]. The intermittent nature of wind speed can also lead to uprooting of essential
    crop under cultivation and thus reduce the yield. Martins et al. [9] have carried
    out a case study to forecast the yield of maize crop in Brazilian semiarid region,
    where various meteorological parameters like maximum and minimum temperatures,
    rainfall, air pressure, and wind speed at height of 10 m are chosen to forecast
