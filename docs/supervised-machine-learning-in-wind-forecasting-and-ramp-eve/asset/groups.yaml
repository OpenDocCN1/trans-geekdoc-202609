    # ## 5.2 Gradient boosted machines


    Gradient boosted machines (GBMs) is an ensemble-based regression method, that
    takes into account the loss of the previously fit decision tree. In a GBM model,
    various weak learners are combined to arrive at an accurate model. Boosting-based
    regression trees are highly powerful to predict accurate response values owing
    to the advantages posed by an appropriate boosting algorithm. A particular boosting
    algorithm strengthens the tree model by minimizing the inaccuracies of weak models
    in the form of loss function [7]. Thus for a boosting algorithm, the main task
    is reducing the error posed by weak learners in each iteration. The final predicted
    response is the linear combination of fit trees. An advantage of GBM over conventional
    regression models is that it avoids overfitting. In case of GBM the learning rate
    of each decision tree determines the predictive performance. A higher learning
    rate indicates less number of trees required for prediction and vice versa [8].
    Based on a cross-validation experiment, an ideal number of trees required along
