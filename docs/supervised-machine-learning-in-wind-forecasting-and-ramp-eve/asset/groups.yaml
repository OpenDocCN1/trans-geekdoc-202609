    ## 7.3 Ramp event analysis for onshore and offshore wind farms


    Recent advances in renewable energy sector have streamlined the power generation
    portfolio of many developing countries. With wind energy being the driving force,
    both onshore and offshore technologies have attracted big investments globally
    [36]. Onshore wind farms have an advantage of proximity to the utility grid, whereas
    offshore wind farms need long transmission cables to transmit power from the sea
    to grid. However, with a strong wind field in the offshore areas compared to onshore,
    which significantly compensates for nonproximity to the grid, the offshore wind
    farm installations have risen drastically. Further, with lesser turbulence and
    more uniform wind speed, the lifetime of wind turbines in offshore scenario increases
    [37]. Offshore wind farms have a disadvantage of higher installation and engineering
    costs accompanied by the wear and tear of generator and mechanical equipments.
    On the other hand, onshore wind farms face the challenge in their acceptance from
    limited land availability, visual intrusion, and damage to wildlife. The defining
    factor of operation between onshore and offshore wind farms is the surface roughness
    length. It is observed that the larger the surface length, the higher the reduction
    in wind velocity, and theoretically the wind speed at the ground is zero [38].


