    role in forecasting future values. Thus a parameter must be assigned that not
    only calculates how accurate the method is but also determines its fitness over
    certain conditions. Such type of optimization studies are often done to choose
    the accurate forecasting method. Very short-term forecasting methods, as the name
    suggests, predict the future values up to a short span of time. Usual time-scale
    followed for this method is from a few seconds to 30 minutes. The core area of
    very-short-term wind forecasting lies in market clearing and regulatory actions.
