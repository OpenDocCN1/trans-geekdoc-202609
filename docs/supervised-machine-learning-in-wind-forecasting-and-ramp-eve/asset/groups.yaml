    wind farm layouts with two wind speed datasets.


    +   2. Short-term wind speed forecasting is studied considering the wake effects,
    and significant upwind turbines are identified using Grey relational analysis.
    Forecasting accuracy is analyzed for proposed bilateral Gaussian wake model and
    benchmark models.


