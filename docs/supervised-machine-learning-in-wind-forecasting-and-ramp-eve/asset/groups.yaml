    # Preface


    Recently, alternative energy sources have gained much importance owing to their
    clean operation. With limited fossil fuel and nuclear resources, solar and wind
    energy technologies have outgrown their market share. Given its rich sustainability,
    a renewable energy power portfolio strengthens the backbone of a country’s economy.
    Apart from its positive environmental impact, wind energy has also globally created
    job opportunities. With increased penetration of renewable energy sources, their
    operation and control have become important. Wind turbines undergo a wide range
    of dynamic phenomena. Achieving economies of scale is the primary objective for
    a wind farm operation.


    Given the random nature of wind speed, accurate wind forecasting schemes aid the
    operator to minimize the losses. Selecting an optimum operational strategy lowers
    the system cost and increases the reliability of the power system. Wind energy
    globally has impacted thousands of livelihoods in terms of employment opportunities
    and renewables-based power supply. 21st century has seen a spurt in wind energy
    installations worldwide, particularly, in offshore areas. However, the intermittency
    in wind power generation brings additional challenges in grid reliability. The
    stochastic wind nature of wind speed triggers the need for accurate wind forecasts
    ahead of time in order to plan optimal power dispatch. Traditional models based
    on numerical weather prediction and time-series based statistical models (ARMA,
    ARIMA, and S-ARIMA) face numerous shortcomings due to nonlinearity in wind speed.


    The book deals with issues faced in short-term wind forecasting techniques and
    addresses hybrid machine intelligent algorithms that solve the issues with aforementioned
    traditional methods. Short-term wind speed forecasting based on signal decomposition
    techniques coupled with machine learning algorithm like support vector regression
    and its variants gives an accurate wind forecast. Variants of SVR like least square
    support vector regression (LSSVR), twin support vector regression (TSVR), and
    ε-twin support vector regression (ε-TSVR) are discussed.


    Chapter 1 discusses the need for wind energy globally and detailed statistics
    related to installed capacity and estimated power production in becoming years.
    It also throws light on the motivation and the objective behind this book. Chapter
    2 highlights the fundamental concepts for wind'
  - '[PAGE 18]


    energy starting from power production, wind speed distribution across on-shore
    and offshore regimes, and commonly used wind speed profile laws with changes in
    terrain.


    Chapter 3 entails the paradigms of wind forecasting that focuses on forecasting
    needs, issues, and challenges. We also discuss the traditional forecasting schemes,
    and we progressively highlight the need for machine learning algorithms in short-term
    wind speed forecasting. Moving forward, Chapter 4 provides a deep insight into
    supervised machine learning algorithms specifically on support vector regression
    and its variants. In Chapter 5, random forest regression and gradient boosted
    machines (GBM) are presented with relevant literature and two case studies for
    rainfall and crude oil price prediction. We also discuss the importance of each
    method from the computation speed point of view.


    Chapter 6 presents the hybrid model for wind forecasting based on wavelet transform
    and variants of support vector regression like ε-SVR, LSSVR, TSVR, ε-TSVR, RFR,
    and GBM. Case studies from wind farms are globally presented, and their results
    are discussed. Further, the effect of SVR hyperparameters on the regression quality
    is assessed. Chapter 7 discusses ramp events in wind farms, an analytical relationship
    between forecasting models is derived, and ramp-up and ramp-down events for different
    wind datasets are assessed based on their forecasting performance.


    Chapter 8 discusses a specific application of wind speed prediction under the
    presence of wind wakes for supervised machine learning regression model based
    on conventional support vector regression. Case studies incorporating two different
    wind farm layouts are discussed.


    Harsh S. Dhiman

    Dipankar Deb

    Valentina E. Balas'
