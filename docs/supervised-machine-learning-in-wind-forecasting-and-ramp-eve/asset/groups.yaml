    就行业偏好而言，已开发出许多基于预测时域的风电预测工具。风电预测阶段可根据极短期、短期、中期、长期和超长期预测进行分类。由于市场运作和最优电力调度的需求，短期预测是首选。当今的电力市场通常采用非管制结构，允许多个竞争性投标代理参与零售过程。由于风能资源产生的电力本质上具有随机性，通常会考虑日前电力市场来规划最优调度。这种调度基本上取决于市场运营商提供的风力发电计划。随机的风力发电会给大规模预测带来误差，因此需要备用容量来弥补电力不足。如果没有足够的备用，市场运营商承担的成本将急剧上升。由于风电渗透率日益显著地提高，需要更高效的预测方案来确保电力市场的平衡。


    图 1.3 说明了风能研究集中的核心领域。从风电场运营商的角度来看，风电预测、风尾流、爬坡事件以及电池储能系统（BESS）集成都非常重要。


    如前所述，风电预测主导着现代电力市场。然而，在风电场内部，存在一些固有的空气动力学现象，会降低整体效率。其中一种现象就是风尾流。由于风速下降，风尾流会降低风电场中下游风力涡轮机的捕风能力，这可以通过在给定区域内最优布置风力涡轮机在一定程度上得到纠正。最优风力涡轮机布置的过程称为微选址。


    由于风力涡轮机布置不当而导致的功率损失还可能引发湍流增加的警告情况，这进一步会加剧叶片和塔筒健康问题。为解决这类问题以实现最优风电场布局，采用了多种优化技术，如遗传算法和粒子群优化，这些内容将在后续章节中讨论。风电预测的相关领域还包括风力涡轮机叶片和塔筒的寿命预测。由于常用的涡轮机配置是
    HAWT，该设计容易受到高风速场景（称为爬坡事件）造成的极端损坏。典型的叶片健康管理研究包括预后和诊断，旨在识别叶片设计不佳、剩余寿命和机械故障的潜在原因，这些问题会导致叶片不及时退化。已有研究表明，部署传感器有助于在线健康监测。


    此外，爬坡事件（即风速和风向突然变化的风况）被视为一种警告情况。当装机容量大且包含高额定功率涡轮机时，会出现此类场景。爬坡事件不仅与风电场相关，还与许多其他科学和工程活动相关。对于水坝、森林火灾、空气质量以及风速和风向的快速变化，都会对这些现象产生显著影响。我们将在第
    7 章中详细讨论这些事件。总体而言，风电场运行是一个敏感过程，可从所讨论的重要方面加以感知。


    ## 1.3 风能相关领域的机器学习


    如前所述，多年来风电预测研究不断发展，研究人员专注于改进预测技术。风速预测在电力调度方面稳定了现代市场，并促成了备用电力容量的合理规划。由于 BESS 在现代风力发电厂中被积极用作备用，这些电池单元的过度充放电会缩短其寿命。典型的
    BESS 容量是根据预测风力发电中提供的充放电计划确定的。因此，准确的风电预测方案可以保证风电场运营商确定备用电力模式的 BESS 容量。


