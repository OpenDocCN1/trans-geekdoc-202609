    wind speed observed is simulated using (8.3) and (8.4), and RMSE and the coefficient
    of determination \(R^2\) were calculated to assess the model performance for a
    single wake model. Table 8.2 depicts the performance metrics, and Frandsen’s single
    wake model outperforms Jensen’s model in terms of RMSE and \(R^2\).


    The proposed and benchmark models already described earlier are tested for different
    downwind distances (\(x = 2.5D_0\), \(3D_0\), and \(5D_0\)). Fig. 8.4 shows the
    effective wind speed observed at wind turbine \(WT_2\) due to the wake effect
    of \(WT_1\) for Jensen’s, Frandsen’s, and the proposed bilateral Gaussian wake
    models for a downwind distance of \(2.5D_0\), and \(u_0\) refers to the freestream
