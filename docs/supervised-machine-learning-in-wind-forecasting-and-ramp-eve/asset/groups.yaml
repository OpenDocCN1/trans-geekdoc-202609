    # CHAPTER 8


    # Supervised learning for forecasting in presence of wind wakes


    Wind energy installations require a precise study of land area available and nearby
    atmospheric conditions. Power captured from wind resource is dependent on wind
    speed at the site. Optimal placement of wind turbines in a wind farm for maximum
    power capture in the presence of wind wakes is a major challenge. Wind wakes represent
    an aerodynamic phenomenon causing reduced power captured at downstream turbine.
    In this chapter we formulate a bilarial Gaussian wake model-based approach using
    Jensen’s and Frandsen’s Gaussian variations of wind wake models. The proposed
    model ensures that the wake effect of the incident wind speed on a down-wind turbine
    is minimized as compared to existing benchmark analytical models for single and
    multiple wake scenarios. Furthermore, short-term wind speed forecasting in the
    presence of wakes is carried out for two wind farm layouts considering benchmark
    wake models and our proposed model. The significant upwind turbines are identified
    using a method called Grey relational analysis, and the forecasting accuracy is
    evaluated.


    # 8.1 Introduction


    Growing energy demands are rapidly facilitating the wind turbine installations
    globally in the form of large wind parks. Wind turbines are installed in large
    land mass to convert the energy available from moving air to electrical energy.
    Due to constrained land area and cost of the equipment, we have to design a proper
    wind farm layout for the required energy generation [1], [2]. Wind power capture
    by wind turbine is affected by many factors like wind speed, wind direction, and
    optimal turbine spacing [3].


    In a wind farm terrain, wind turbines must be placed at an optimal operating distance
    from each other to avoid potential derating caused by wind wakes. Wind wake is
    an aerodynamic phenomenon leading to (a) reduction in wind speed magnitude at
    the downstream turbine and (b) increased air turbulence causing mechanical loading
    on the turbine structure [4]. Wind wakes can be classified as near-end wakes and
    far-end wakes; the former'
