    剩余部分用于测试。TSVR 和 ε-TSVR 预测模型与 ε-SVR 和 LS-SVR 模型进行评估比较。对于 ε-TSVR，我们假设正则化因子 \(C1
    = C2\) 且 \(C3 = C4\)。同样，对于 TSVR，我们选择 \( C_1 = C_2 \)。由于正则化参数对容差误差设置软限制，选择最佳 \(
    C \) 值对预测精度有显著影响。此外，由于训练阶段的过拟合会导致精度低下，正则化成为机器学习回归的重要方面。


    构建回归模型所用的核函数是带宽 \( \sigma \) 的径向基函数（RBF）：\( k(x, x_i) = \exp \left( - \frac{\|x
    - x_i\|^2}{2\sigma^2} \right) \)。超参数 \( C_1, C_2, C_3 \) 和 \( C_4 \) 以及 RBF 带宽
    \( \sigma \) 从集合 \( 2^i, i = -9, -8, \dots, 9, 10 \) 中选取。最优参数可通过手动调整或网格搜索算法调优。选取标记为
    A、B、C 和 D 的四个风电场相关数据集来测试混合预测模型的性能。数据集 A 包含 720 个样本，其中 80%（576 个）用于训练，20%（144 个）用于测试。同样，对于数据集
    B、C 和 D，800 个样本用于训练，200 个用于测试。


    表 6.2 和 6.3 描述了基于小波的混合 SVR 模型的各种性能指标。对于数据集 A，\( \varepsilon \)-TSVR 和 TSVR 在 RMSE
