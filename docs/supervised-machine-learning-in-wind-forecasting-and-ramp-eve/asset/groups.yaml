    ## Stock price prediction: a case study


    Next, we discuss the opening stock price prediction for L&T Infotech keeping the
    highest price, lowest price, and closing price for a particular day as predictor
    variables. Daily data for two years are taken from August 21, 2017, to August
    20, 2019. A total of 492 samples are segmented into training (400) and testing
    (92) sets. The hyperparameters are tuned in the range of \( 2^{-10} - 2^{10} \)
    for SVR model. The results from Table 4.1 indicate that SVR model outperforms
    the persistence model in terms of RMSE and \( R^2 \) value. Here the problem of
    overfitting persists, which can be potentially eliminated by using better versions
    of SVR models discussed in the next section. Fig. 4.5 illustrates the prediction
    of opening stock prices for both models.


    ## 4.3 Least-square support vector regression


    Least-square support vector regression (LSSVR) is originally derived from least-square
    support vector classifiers (LSSVC) proposed in [11], where


    ![](img/b53e39e35231af65df8ccaa99eb28bee_65_0.png)


    Figure 4.5 Stock price prediction for Larsen & Toubro Infotech.


    ![](img/b53e39e35231af65df8ccaa99eb28bee_65_1.png)


    Figure 4.6 Schematic flowchart for LSSVR algorithm.


    equality constraints are chosen, and the square of the error term \(\varepsilon\)
    is minimized. The LSSVR algorithm is depicted in Fig. 4.6.


    The LSSVR regression problem is formulated as


    $$f(x) = w^T \phi(x) + b, \tag{4.8}$$


    where \(w\) is the weight coefficient vector of dimension \(n \times 1\), and
    \(x_i \in R^n\), \(y \in R\). The objective function to be minimized is given
    as


    $$\min \frac{1}{2} \|w\|^2 + \frac{1}{2}\gamma \sum_{i=1}^n \varepsilon_i^2 \tag{4.9}$$


    $$\text{s.t. } y_i = w^T \phi(x_i) + b + \varepsilon_i \ (i=1,2,...,n), \tag{4.10}$$


    ![](img/b53e39e35231af65df8ccaa99eb28bee_66_0.png)


    Figure 4.7 Applications of LSSVR prediction.


    where \(\gamma\) is the margin parameter, and \(\varepsilon_i\) is the error term
    corresponding to each \(x_i\). The optimization problem can be transformed by
    introducing Lagrange multipliers and is given as


    $$L(w, b, \varepsilon, \alpha) = \frac{1}{2} \| w \|^2 + \frac{1}{2}\gamma \sum_{i=1}^n
    \varepsilon_i^2 - \sum_{i=1}^n \alpha_i(w^T \phi(x_i) + b + \varepsilon - y_i).
    \quad (4.11)$$


    The Karush–Kuhn–Tucker (KKT) conditions for the optimization problem (4.11) can
    be obtained by partially differentiating the Lagrangian function with respect
    to \(w, b, \varepsilon, \alpha\) given by


    $$

    \begin{aligned}

    \begin{bmatrix} k(x, x^T) + \gamma^{-1} I & e \\ e^T & 0 \end{bmatrix} \begin{bmatrix}
    \alpha \\ b \end{bmatrix} = \begin{bmatrix} y \\ 0 \end{bmatrix}, \quad (4.12)
    \\

    f_{LSSVR}(x) = \sum_{i=1}^n \alpha_i k(x, x_i) + b, \quad (4.13)

    \end{aligned}

    $$


    where \(I\) is the identity matrix of appropriate dimension. The regressor obtained
    by LSSVR is given by (4.13) and solves the optimization problem of size smaller
    than classical \(\varepsilon\)-SVR, taking less computation time. LSSVR is an
    improved variant of \(\varepsilon\)-SVR with a squared penalty term in the loss
    function and is applied to several branches of science and engineering to obtain
    accurate forecasts as illustrated in Fig. 4.7.


    Liu et al. [12] have studied the parameter optimization methods in tandem with
    LSSVR for forecasting dissolved oxygen content in transformer oil during incipient
    faults. The data for dissolved gases are collected from several power companies,
    and imperialist competition algorithm (ICA) is used to find optimal hyperparameters
    for LSSVR. The method is compared with several other methods like the back propagation
    neural network, generalized regression neural network, and radial basis function
    neural network. The results reveal that ICA-LSSVR-based forecasting yields better
    results in terms of MAPE and R².


    In terms of river flow forecasting, Adnan et al. [13] have carried out a hybrid
    forecasting method based on LSSVR and the gravitational search algorithm (HLSGA).
    Two catchment areas on the upper Indus basin of Pakistan are selected, and the
    mean annual data for 32 years are chosen to validate the hybrid method, where
    n datasets are divided into n – 1 sets for training. Various input combinations
    based on the autocorrelation values of the river flow data are used. The results
    reveal that HLSGA method outperforms model 5 regression tree (M5RT) and multiple
    linear regression (MLR) in terms of RMSE and MAE. The effect of log transformation
    on the river flow time series is analyzed, and the forecasting results of log-HLSGA
    are compared with HLSGA. The log transformation reduces the skewness in the time
    series and yields better forecasts for all the methods when compared to the original
    methods.


    ## Power generation prediction: a case study


    Next, we discuss the prediction of net hourly power output in megawatts from a
    combined cycle power plant (CCPP). The principle of CCPP is based on power generation
    from gas and steam turbines, where variables like temperature (°T), ambient pressure
    (m Bar), exhaust vacuum (mm of Hg), and relative humidity (%) are taken as predictor
    variables. The data for this case study can be accessed from UCI machine learning
    repository [14]. A total of 500 samples are taken and divided into training (400)
    and testing (100) sets. From Table 4.2 we can observe that LSSVR outperforms the
    persistence algorithm in terms of RMSE, R² (coefficient of determination), and
    the normalized mean squared error (NMSE). Further, in terms of R², the overfitting
    problem posed by the persistence algorithm is well treated by LSSVR technique.


    Fig. 4.8 illustrates the prediction of power generated based on LSSVR and the
    persistence algorithm.

