    at the induction factor \(a = 0.33\). For a neutral atmospheric boundary layer
    (ABL) operation, the value of \(C_t\) is found to be higher for increased power
    output [30]. The wake flow behind the upwind turbine depends on the wake growth
    constant \(\alpha\), which in turn depends on topographical features of the wind
