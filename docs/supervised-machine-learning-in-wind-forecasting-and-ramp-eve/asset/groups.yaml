    # ## 7.1.4 Air quality: a case study for Bogota, Colombia


    Airborne particles and gases in the atmosphere not only deplete the air quality
    but also hamper the balance of the ecosystem in terms of health hazards and skewed
    food chain processes. Major factors that contribute to the depleting air quality
    around the world are industrial and vehicular emissions. Ambient temperature,
    wind speed, relative humidity, wind gusts, and cloud cover affect the air quality
    index (AQI) for a specific region. AQI-related studies have been carried out that
    typically relate the influence of wind speed on the particulate matter (PM 2.5
    and PM10) concentration in the atmosphere [28]. According to a study carried out
    by the World Health Organization (WHO), the severity of respiratory diseases is
    strongly correlated to SO\(_2\) pollutants.'
