    ## 1 引言


    量子计算和机器学习代表了过去半个世纪以来出现的两个最重要的计算科学领域。过去十年中，特别关注机器学习技术的伦理影响 [9, 10, 14]，推动了公平机器学习的发展。尽管量子计算和量子信息处理取得了重大进展
    [5]，且量子设备的重要性日益增长，但对量子计算伦理的直接研究却很少，对量子计算的道德和哲学讨论有限 [1, 2]，或关于“量子霸权”一词是否恰当的争论 [21]。


    尽管完全可扩展的容错 [23] 量子计算尚未实现，但中间尺度噪声可扩展量子计算设备的可用性意味着使用量子算法在量子设备上进行近期的计算正在成为现实。量子计算机的潜在能力在于
    (i) 解决经典上不可处理的难题，以及更实际地 (ii) 解决虽然可处理但因资源限制而在经典上不可行的难题，这推动了其在机器学习中的应用。量子计算机可执行的任务范围广泛，如求解优化问题、模拟经典或复杂系统或建模高度复杂的系统，例如多智能体交互系统，这意味着涉及量子计算机的机器学习（和计算）很可能产生（并受制于）伦理考量。许多此类问题对经典计算而言是不可行的（即使可处理），因此在伦理上无问题。然而，由于量子计算提供的增强计算潜力，这些计算可能变得可行，从而拓展了可通过提供超越经典计算约束的计算能力而得以求解的优化问题的前沿。如果经典上不可行的优化问题在量子计算机上变得计算可行，那么此类计算的伦理就变得相关，且此类伦理必须在量子计算的性质下加以考虑。因此，对量子计算机上的公平机器学习和公平计算的研究是合理且必要的。


    公平机器学习是最成熟的领域，旨在解决在受伦理（公平）约束条件下进行经典计算的理论和技术挑战。然而，迄今为止，尚未开展同等的研究来探讨伦理约束对量子计算的技术影响。本文旨在通过阐述量子公平机器学习来填补这一空白（另见关于一般伦理量子计算的同期工作
    [22]）。正如我们下面所详述的，量子计算的独特方面（包括其固有的基于测量的概率性、相干叠加态的可用性、计算动力学限制于幺正演化、无克隆定理等）意味着计算方式与经典情形不同。因此，在量子计算机上为公平目标进行约束优化时所使用的度量、衡量、电路以及方式表现出重要差异。


    例如，与经典数据不同，量子数据表示为希尔伯特空间 ℋ 上的向量。经典数据原则上可以直接访问和操作。量子数据在叠加态下不能直接访问，而必须间接操纵。与经典计算动力学不同，量子计算必须根据薛定谔方程幺正演化。量子态不是由直接概率表征，而是由复值振幅表征，这些振幅决定了测量量子态
    |ψ⟩ 时获得某一结果的概率。与经典计算不同，量子情境下操作的顺序很重要，由非对易算符（或李括号）[A, B] ≠ 0 表示。量子计算中的距离度量也不同。量子计算还拥有重要的非经典资源，如纠缠，经典上没有对应物。因此，公平量子机器学习的理论研究和实际实现要求研究人员理解这些计算差异的含义，进而理解这些差异如何影响
    (a) 公平机器学习技术适用于公平量子计算的程度以及 (b) 开发新的量子特定技术以解决伦理量子优化问题的必要性。


    ### 1.1 结果与贡献


    本文的结果和贡献如下。


    - (1) 我们提出了首批表征公平机器学习在量子设备上进行与经典对应物相比的差异或相似性的结果。

    - (2) 我们提供了公平机器学习在预处理、在线处理和后处理阶段的一系列关键结果的量子类比，如公平性标准和衡量以及满足公平性约束的补救策略。

    - (3) 我们提出了量子公平机器学习中的首批技术结果，展示了使用 Grover 量子搜索算法使量子算法在 ε-容差内实现统计平价。

    - (4) 我们提出了 Lipschitz 条件个体公平性标准的量子类比，以量子度量和希尔伯特空间中量子向量上的幺正算符表示。

    - (5) 我们列出了量子信息处理、机器学习和伦理 [22] 研究人员应在其研究计划中考虑的开放性问题。


    ### 1.2 结构


    本文的结构如下。第一部分总结了与公平机器学习相关的量子信息处理的关键特征，包括量子公设、密度矩阵形式、测量统计、无克隆定理和开放系统。一般而言，量子与经典计算的接口可根据数据和处理被归类为量子
    (Q) 或经典 (C) 的量子-经典象限来有用地分类 [3, 25]。我们关注 CQ 情形，即经典数据输入受量子信息处理。我们回顾了使用基、振幅、样本和动态编码策略将经典数据编码到量子态
    |ψ⟩ 的方法。我们考察了使用量子算法求解受公平性约束的优化问题，以及这些计算中特有的量子方面（如果有的话）对典型公平机器学习公平性标准的影响。第二部分，我们对典型公平机器学习特征在计算在量子设备上进行时如何不同进行了比较分析。我们明确考察了
    FML 算法的一系列关键特征的量子类比，包括基于群的公平性度量（平价、混淆矩阵度量、校准等）、个体公平性度量（例如 Lipschitz 条件 [14] 问题）和补救策略（如删改、盲化、采样、数据转换、重标记、扰动和约束优化）。我们讨论量子信息处理如何使
    FML 中的现有技术相同、不同以及需要修改。我们讨论了独特量子公平计算的类型，并提出了机器学习算法的 Lipschitz 条件个体公平性约束的量子类比。第三部分，我们给出了如何使用
    Grover 著名的量子搜索算法 [16] 的改编（振幅放大）来满足公平统计平价标准的明确示例，并给出了为此所需幺正算法应用次数的下界。第四部分，我们讨论开放性问题并为量子
    FML 提供研究计划建议。


