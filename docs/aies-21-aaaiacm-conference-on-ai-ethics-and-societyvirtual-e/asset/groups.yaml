    ## 2.2 量子度量。


    度量在公平机器学习中发挥核心技术作用，从根本上是构建公平技术定义的基石。量子信息处理的度量与经典对应物相关但不同。这意味着将公平机器学习度量翻译到量子领域需要不同（尽管相关）的度量形式主义。如
