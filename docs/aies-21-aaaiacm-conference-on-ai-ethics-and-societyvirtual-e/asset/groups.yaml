  md: "\n![](img/4f58870f244658d0750060a0e6eac816_8_0.png)\n\nFigure 1: Diagram of\
    \ amplitude amplification for statistical parity where H = H0 ⊕ H1. (1) initial\
    \ state |ψ⟩ lies closer to H0, aim is to rotate vector to π/4 angle between both\
    \ subspaces. (2) Sχ operator reflects |ψ⟩ about the H0 axis: |ψ⟩ → Sχ |ψ⟩. (3)\
    \ Applying Q|ψ⟩ results in 2θ rotation of original |ψ⟩ vector. Quantum ε-statistical\
    \ parity is achieved after m = [arcsin √(0.5 − ε/2θ − ε)] iterations of Q = Sψ\
    \ Sχ.\n\n## 4.5 Statistical parity by amplitude amplification\n\nprobability of\
    \ measuring a state in H1 (i.e. the probability that |ψ⟩ ≡ |ψ1⟩) is then:\nPr(|ψ1⟩)\
    \ = sin²((2k + 1)/2 θ)   (26)\nBy applying Q a sufficient number of times, the\
    \ probabilities of measuring a state in H0 and H1 can be approximately equalised\
    \ so that:\n sin²((2k + 1)/2 θ) ≈ cos²((2k + 1)/2 θ)   (27)\nThe Grover algorithm\
    \ amplifies amplitudes such that the probability of measuring a state |ψ⟩ ∈ H1\
    \ is significantly increased. Our approach is slightly different: in our case,\
    \ we do not have a uniform superposition, for we have assumed that the algorithm\
    \ A has weighted the amplitudes ci of each basis state (according to some optimisation\
    \ criteria). Achieving statistical parity across the two groups means obtaining\
    \ an approximately equal average probability of measuring a state in H1 or H0.\
    \ We can use the same technique, however, to boost amplitudes for H1 without requiring\
    \ equiprobability of each state in H1. We work through our example below in some\
    \ detail in order to elucidate technical details of how the algorithm works.\n\
    To amplify amplitudes, we define projection operators which, when applied to H,\
    \ act to project-out (leave remaining) only those states\nin H1 via:\nP = |1⟩⟨1|\
    \ ⊗ I ⊗ I   (28)\nAs can be seen using density-matrix formalism, this operator\
    \ acts on the first qubit (leaving the remainder unmeasured, as symbolised by\
    \ the identity in the tensor product) when applied to |ψ⟩ results only in states\
    \ with x1 = 1. The projection operator is not applied directly to states (for\
    \ it is not unitary), but rather is used in linear combination with other operators\
    \ (see below) in order to construct the oracle unitary and the desired amplifying\
    \ unitary operator. Recalling the basis postulates of measurement described above,\
    \ if a measurement of |ψ⟩ is made then the probability of |ψ⟩ being in a state\
    \ with x1 = 1 is given by the amplitude squared:\nPr(|ψ1⟩) = |c100|² + |c101|²\
    \ + |c111|² + |c110|²   (29)\nThe initial probability will not be 50% in our example\
    \ because |ψ⟩ has been subject to A, which has adjusted amplitudes, beforehand.\
    \ The post-measurement state |ψ'⟩ is:\n|ψ1⟩ = (c100|100⟩ + c101|101⟩ + c111|111⟩\
    \ + c110|110⟩) / √(|c100|² + |c101|² + |c111|² + |c110|²)   (30)\nThe amplification\
    \ operator Q(ψ,P) = Sψ Sχ is then described as the product of the following two\
    \ operators:\nSψ = 2|ψ⟩⟨ψ| − I   (31)\nSχ = 2P − I   (32)\ni.e. equivalent to\
    \ (23) where O = P. The unitarity of Q means that H has an orthonormal basis given\
    \ by the two eigenvectors of Q with which we can decompose |ψ⟩ as:\n|ψ±⟩ = 1/√2\
    \ (|ψ1⟩ ± i |ψ0⟩)   (33)\nNote that in contrast to [7], we have omitted the prefactors\
    \ of 1/√a for |ψ1⟩ and 1/√(1−a) for |ψ0⟩ for convenience, including them in the\
    \ definition of the states |ψ1⟩ and |ψ0⟩ respectively. In that work, such a is\
    \ designated as the probability of measuring |ψ1⟩ and 1−a the probability of measuring\
    \ the state |ψ0⟩. The inclusion of these prefactors in [7] can be thought of as\
    \ having taken the numerator of (30). To algebraically show the rotational effect\
    \ of the unitary, we note that the eigenvalues of (33) are given by:\nλ± = e^{±i2θ}\
    \   (34)\nusing which, we can express |ψ⟩ as:\n|ψ⟩ = − i/√2 ( e^{iθ}|ψ+⟩ − e^{−iθ}|ψ−⟩\
    \ )   (35)\nWhich is equivalent in form to (24) with θ ∈ [0,π/2]. Applying Q iteratively\
    \ m times on |ψ⟩ results in:\nQ^m|ψ⟩ = − i/√2 ( e^{i(2m+1)θ}|ψ+⟩ − e^{−i(2m+1)θ}|ψ−⟩\
    \ )   (36)\n= sin((2m+1)θ) |ψ1⟩ + cos((2m+1)θ) |ψ0⟩   (37)\nEach application of\
    \ Q rotates |ψ⟩ by angle 2θ, thereby projecting more of the state into H1. The\
    \ probability that |ψ⟩ ∈ H1 is then sin²((2m+1)θ), consistent with (26). Each\
    \ rotation by 2θ adjusts the amplitudes for measuring |ψ⟩ ∈ H1 and |ψ⟩ ∈ H0. A\
    \ diagrammatic representation of this process is set-out in Figure 1. The rotation\
    \ effectively updates the quantum weights (amplitudes) at each step in a unitary.\
    \ By applying Q a sufficient number of times, we can\nachieve what we designate\
    \ as (quantum) ε-statistical parity (namely equal probability within ε) such that:\n\
    \n|⟨ψ₁|ψ|ψ₁⟩ − ⟨ψ₀|ψ|ψ₀⟩| = ε  (38)\n\nwhich can be expressed as:\n\n|0.5 − ε|\
    \ = sin²((2m + 1)θ)  (39)\n\nSuch statistical parity can be approximated by applying\
    \ the amplitude amplification operator Q iteratively m times where m is given\
    \ by:\n\nm = ⌊ arcsin √( |0.5 − ε| ) / (2θ) − θ ⌋  (40)\n\nThe proportional amplification\
    \ of the amplitude of states in ℋ₁ is accompanied by a proportional reduction\
    \ in the amplitude of states in ℋ₀, preserving overall probability measure. Because\
    \ of the unitarity of Q, the adjustment of amplitudes preserves quantum coherence\
    \ in a way that measuring and classically adjusting probabilities post-measurement\
    \ would not.\n\nSubgroup parity. The quantum ε-statistical parity method we describe\
    \ above can be deployed to achieve statistical parity among any number of n disjoint\
    \ subgroups so long as there exists a unitary operator O which partitions the\
    \ Hilbert space ℋ into a direct sum of subspaces i.e such that:\n\nOℋ ↦ ⊕ᵢⁿ ℋᵢ\
    \ = ℋ₁ ⊕ … ⊕ ℋₙ  (41)\n\nIn our worked example above, simply setting the projector\
    \ P to project-out into a particular state of one or more qubits will implement\
    \ such an operator via 2P − \U0001D540. However, as with classical subgroup parity\
    \ (see [19]), disjunctively partitioning into one set of subgroups will likely\
    \ lead to statistical disparity across others. For example, defining the set of\
    \ projection operators P as:\n\nPₐb = \U0001D540 ⊗ |a⟩⟨a| ⊗ |b⟩⟨b|  (42)\n\nwhere\
    \ a, b ∈ {0, 1} will partition ℋ into four subspaces which can be amplitude amplified\
    \ into statistical parity. However, there are no guarantees that this retains\
    \ statistical parity for measurements of the first qubit.\n\n## 5 PART IV: CONCLUSION\
    \ AND FUTURE WORK\n\nIn this first paper on quantum fair machine learning, we\
    \ have examined foundational characteristics of undertaking fair machine learning\
    \ involving quantum systems. We have set-out a (by no means exhaustive) comparison\
    \ between quantum and classical techniques of relevance to FML on quantum systems,\
    \ elucidating ways in which FML techniques are or are not directly transferable\
    \ to quantum FML. We have provided a number of quantum analogues for use in quantum\
    \ FML contexts. As a practical example, we have demonstrated the use of Grover’s\
    \ amplitude amplification algorithm to achieve statistical parity among subgroups\
    \ and set-out definitions of quantum fairness and quantum Lipschitz-conditioned\
    \ (individual) fairness. As a new cross-disciplinary field, there are a multitude\
    \ of open questions and potential research programmes extending from our work\
    \ including:\n- formalising quantum analogues of existing techniques in FML,\n\
    - exploring QFML in noisy contexts, especially in dissipative open quantum systems,\n\
    - examining how fairness outcomes and computation differs as a result of using\
    \ quantum-specific resources, such as entanglement and\n- the role of cryptographic\
    \ and quantum analogues of differential privacy for satisfying fairness criteria\
    \ for quantum computations.\n\n## ACKNOWLEDGMENTS\n\nThis work is part of the\
