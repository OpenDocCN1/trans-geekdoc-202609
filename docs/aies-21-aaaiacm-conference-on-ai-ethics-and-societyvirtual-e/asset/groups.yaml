    ## 1 INTRODUCTION


    Quantum computing and machine learning represent two of the most significant fields
    of computational science to have emerged over the last half century. Over the
    last decade, attention has in particular turned to the ethical implications of
    machine learning technology [9, 10, 14], motivating the development of fair machine
    learning. Despite significant advances in quantum computing and quantum information
    processing [5] and the growing importance of quantum devices, little or no direct
    work on the ethics of quantum computing has been undertaken, with limited discussion
    on the morality and philosophy of quantum computing [1, 2] or debates about the
    appropriateness of the term ‘quantum supremacy’ [21].


    Although fully scalable fault-tolerant [23] quantum computing has not yet been
    realised, the availability of intermediate noisy scalable quantum computing devices
    means that near-term computation on quantum devices using quantum algorithms is
    becoming a reality. The potential capacity of quantum computers to (i) solve problems
    that are classically intractable and, more practically, to (ii) solve problems
    which, while tractable, are classically infeasible (due to resource constraints),
    motivates their use in machine learning. The wide scope of tasks that may be performed
    on quantum computers such as solving optimisation problems, simulating classical
    or complex systems or modelling highly complex systems, such as multi-agent interactive
    systems means that machine learning (and computation) involving quantum computers
    is likely to give rise to (and be subject to) ethical considerations. Many such
    problems remain infeasible (if tractable) for classical computation and are thus
    ethically unproblematic. Yet such computations may become feasible due to the
    enhanced computational potential afforded by quantum computing, which expands
    the frontiers of optimisation problems that may be solved by providing for computational
    capacity beyond the constraints of classical computation. If optimisation problems
    that are classically infeasible become computationally feasible on a quantum computer,
    then the ethics of such computations become relevant and such ethics must be considered
    in light of the quantum nature of computation. Thus research into fair machine
    learning and fair computation on quantum computers is well-motivated.


    Fair machine learning is the most mature field addressing the theoretical and
    technical challenges of undertaking classical computation subject to ethical (fairness)
    constraints. To date, however, no equivalent research has been undertaken regarding
    the technical impact of ethical constraints upon quantum computation. In this
    paper, we seek to address this gap via an exposition of quantum fair machine learning
    (see also concurrent work on ethical quantum computing generally [22]). As we
    detail below, the unique aspects of quantum computation (including its inherently
    measurement-based probabilistic nature, the availability of coherent superposition
    states, the restriction of computational dynamics to unitary evolution, no cloning
    theorems etc) mean that computation is undertaken differently from the classical
    case. As a result, the types of metrics, measures, circuits and ways in which
    constrained optimisation for fair objectives can be undertaken on a quantum computer
    exhibit important differences.


    For example, in contrast to classical data, quantum data is represented as vectors
    on Hilbert spaces ℋ. Classical data can in theory be directly accessed and operated
    upon. Quantum data, in a superposition state, cannot be and instead must be manipulated
    indirectly. As distinct from classical computing dynamics, quantum computing must
    evolve unitarily according to Schrödinger’s equation. Instead of direct probabilities,
    quantum states are characterised by complex-valued amplitudes which determine
    the probability of obtaining an outcome when measuring a quantum state |ψ⟩. Unlike
    classical computing, the order of operations matters in the quantum context, as
    represented by non-commutative operators (or Lie brackets) [A, B] ≠ 0. Distance
    measures in quantum computing also differ. Quantum computing also has available
    to it important non-classical resources, such as entanglement, with no counterpart
    classically. As such, the study and practical implementation of fair quantum machine
    learning requires researchers to understand the implications of these computational
    differences and, in turn how these differences affect (a) the applicability of
    fair machine learning techniques to fair quantum computation and (b) the need
    to develop new quantum-specific techniques to solve ethical quantum optimisation
    problems.


    ### 1.1 Results and contributions


    The results and contributions of this paper are as follows.


    - (1) We present the first results characterising ways in which fair machine learning
    undertaken on quantum devices differs from or is similar to its classical counterpart.

    - (2) We provide quantum analogues of a number of key results in fair machine
    learning at the preprocessing, in-processing and post-processing stages, such
    as fairness criteria and measures and remedial strategies to satisfy fairness
    constraints.

    - (3) We present the first technical results in quantum fair machine learning,
    demonstrating the use of Grover’s quantum search algorithm to enable quantum algorithms
    achieve statistical parity within ε-tolerance.

    - (4) We present the quantum analogue of Lipschitz-conditioned individual fairness
    criteria, expressed in terms of quantum metrics and unitary operators on quantum
    vectors in Hilbert space.

    - (5) We list open questions for researchers in quantum information processing,
    machine learning and ethics [22] to consider as part of their research programmes.


    ### 1.2 Structure


    The structure of the paper is as follows. Part I summarises the key characteristics
    of quantum information processing of relevance to fair machine learning, including
    quantum postulates, density matrix formalism, measurement statistics, no cloning
    theorems and open systems. In general, the interface of quantum and classical
    computing is usefully categorised according to the quantum-classical quadrant
    in which data and processing are categorised as either quantum (Q) or classical
    (C) [3, 25]. We focus upon the CQ case, where classical data inputs subject to
    quantum information processing. We review methods by which classical data is encoded
    in quantum states |ψ⟩ using basis, amplitude, sample and dynamic encoding strategies.
    We examine the use of quantum algorithms to solve optimisation problems subject
    to fairness constraints and the impact that the specifically quantum aspects of
    those computations has (if any) upon typical fair machine learning fairness criteria.
    In Part II, we present a comparative analysis of how typical fair machine learning
    characteristics differ when computation is undertaken on quantum devices. We explicitly
    examine quantum analogues of a number of key features of FML algorithms, including
    group-based fairness measures (parity, confusion matrix metric, calibration and
    others), individual fairness measures (e.g. Lipschitz conditioned [14] problems)
    and remedial strategies (such as redaction, blinding, sampling, data transformation,
    relabelling, perturbation and constraint optimisation). We discuss how quantum
    information processing renders existing techniques in FML the same, different
    and in need of modification. We discuss types of uniquely quantum fair computation
    and present the quantum analogue of Lipschitz-conditioned individual fairness
    constraints for machine learning algorithms. In Part III, we present an explicit
    example of how to use an adaptation of Grover’s infamous quantum searching algorithm
    [16] (amplitude amplification) to satisfy fair statistical parity criteria and
    give a lower bound on the number of applications of unitary algorithms necessary
    for doing so. In Part IV, we discuss open questions and provide suggestions for
    research programmes in quantum FML.


    ## 2 PART I: QUANTUM INFORMATION PROCESSING


    In this section, we review the key distinguishing characteristics of quantum information
    as distinct from its classical counterpart of relevance to canonical problems
    in fair machine learning. We focus on aspects of quantum information processing,
    such as superposition states, quantum entanglement, the inherently probabilistic
    and measurement-based nature of quantum computing of relevance to understanding
    fair machine learning in a quantum context. We begin with a synopsis of the primary
