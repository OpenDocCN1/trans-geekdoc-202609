    \ |ψ1⟩ 的概率，1−a 为测量态 |ψ0⟩ 的概率。 [7] 中这些预因子的包含可以被认为取了 (30) 的分子。 为了代数地展示幺正的旋转效应，我们注意到\
    \ (33) 的特征值由下式给出：\nλ± = e^{±i2θ}   (34)\n利用它，我们可以将 |ψ⟩ 表示为：\n|ψ⟩ = − i/√2 ( e^{iθ}|ψ+⟩\
    \ − e^{−iθ}|ψ−⟩ )   (35)\n这在形式上等价于 (24)，其中 θ ∈ [0,π/2]。 对 |ψ⟩ 迭代应用 Q m 次得到：\n\
    Q^m|ψ⟩ = − i/√2 ( e^{i(2m+1)θ}|ψ+⟩ − e^{−i(2m+1)θ}|ψ−⟩ )   (36)\n= sin((2m+1)θ)\
    \ |ψ1⟩ + cos((2m+1)θ) |ψ0⟩   (37)\n\n每次应用 Q 都使 |ψ⟩ 旋转 2θ 角，从而将更多态投影到 H1 中。 |ψ⟩\
    \ ∈ H1 的概率随后为 sin²((2m+1)θ)，与 (26) 一致。 每次 2θ 的旋转都会调整测量 |ψ⟩ ∈ H1 和 |ψ⟩ ∈ H0 的振幅。\
