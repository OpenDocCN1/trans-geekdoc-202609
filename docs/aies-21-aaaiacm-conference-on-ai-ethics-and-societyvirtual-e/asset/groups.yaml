    # 1 INTRODUCTION


    Quantum computing and machine learning represent two of the most significant fields
    of computational science to have emerged over the last half century. Over the
    last decade, attention has in particular turned to the ethical implications of
    machine learning technology [9, 10, 14], motivating the development of fair machine


    learning. Despite significant advances in quantum computing and quantum information
    processing [5] and the growing importance of quantum devices, little or no direct
    work on the ethics of quantum computing has been undertaken, with limited discussion
    on the morality and philosophy of quantum computing [1, 2] or debates about the
    appropriateness of the term ‘quantum supremacy’ [21].


    Although fully scalable fault-tolerant [23] quantum computing has not yet been
    realised, the availability of intermediate noisy scalable quantum computing devices
    means that near-term computation on quantum devices using quantum algorithms is
    becoming a reality. The potential capacity of quantum computers to (i) solve problems
    that are classically intractable and, more practically, to (ii) solve problems
    which, while tractable, are classically infeasible (due to resource constraints),
    motivates their use in machine learning. The wide scope of tasks that may be performed
    on quantum computers such as solving optimisation problems, simulating classical
    or complex systems or modelling highly complex systems, such as multi-agent interactive
    systems means that machine learning (and computation) involving quantum computers
    is likely to give rise to (and be subject to) ethical considerations. Many such
    problems remain infeasible (if tractable) for classical computation and are thus
    ethically unproblematic. Yet such computations may become feasible due to the
    enhanced computational potential afforded by quantum computing, which expands
    the frontiers of optimisation problems that may be solved by providing for computational
    capacity beyond the constraints of classical computation. If optimisation problems
    that are classically infeasible become computationally feasible on a quantum computer,
    then the ethics of such computations become relevant and such ethics must be considered
    in light of the quantum nature of computation. Thus research into fair machine
    learning and fair computation on quantum computers is well-motivated.


    Fair machine learning is the most mature field addressing the theoretical and
    technical challenges of undertaking classical computation subject to ethical (fairness)
    constraints. To date, however, no equivalent research has been undertaken regarding
