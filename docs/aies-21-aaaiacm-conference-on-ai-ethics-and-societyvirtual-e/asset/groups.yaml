    # 3 PART II: CLASSICAL FAIRNESS MEASURES IN QUANTUM CONTEXTS


    In this section, we compare how the unique features of quantum computation affect
    the applicability of techniques from classical fair machine learning to quantum
    settings. For convenience, we adopt the taxonomy set-out in recent reviews by
