    \ ε 内的相等概率），使得：\n\n|⟨ψ₁|ψ|ψ₁⟩ − ⟨ψ₀|ψ|ψ₀⟩| = ε  (38)\n\n可以表示为：\n\n|0.5 − ε| =\
    \ sin²((2m + 1)θ)  (39)\n\n这种统计均等可以通过迭代应用振幅放大算符 Q m 次来近似，其中 m 由下式给出：\n\nm = ⌊\
    \ arcsin √( |0.5 − ε| ) / (2θ) − θ ⌋  (40)\n\nℋ₁ 中态的振幅的成比例放大伴随着 ℋ₀ 中态的振幅的成比例减小，保持整体概率测度。\
    \ 由于 Q 的幺正性，振幅的调整以测量并在测量后经典调整概率的方式保持量子相干性。\n\n子群均等。 我们上面描述的量子 ε-统计均等方法可以部署以实现任意数量的\
    \ n 个不相交子群之间的统计均等，只要存在一个幺正算符 O 将希尔伯特空间 ℋ 分区为子空间的直和，即使得：\n\nOℋ ↦ ⊕ᵢⁿ ℋᵢ = ℋ₁ ⊕\
    \ … ⊕ ℋₙ  (41)\n\n在我们上面的工作示例中，只需将投影算符 P 设置为投影到一个或多个量子比特的特定态，即可通过 2P − \U0001D540\
    \ 实现这样的算符。 然而，与经典子群均等（见 [19]）一样，对一个子群集合进行析取分区可能会导致其他子群的统计差异。 例如，将投影算符集合 P 定义为：\n\
    \nPₐb = \U0001D540 ⊗ |a⟩⟨a| ⊗ |b⟩⟨b|  (42)\n\n其中 a, b ∈ {0, 1} 将 ℋ 分区为四个子空间，可以通过振幅放大实现统计均等。\
    \ 然而，这并不能保证对第一个量子比特的测量保持统计均等。\n\n## 5 第四部分：结论与未来工作\n\n在本篇关于量子公平机器学习的首篇论文中，我们研究了涉及量子系统的公平机器学习的基础特征。\
    \ 我们列出了量子与经典技术之间（绝非详尽）的比较，这些技术与量子系统上的 FML 相关，阐明了 FML 技术在量子 FML 中是否可以直接转移的方式。 我们提供了一些可在量子\
    \ FML 语境中使用的量子类比。 作为实际示例，我们展示了使用 Grover 振幅放大算法实现子群统计均等，并列出了量子公平和量子 Lipschitz 条件（个体）公平的定义。\
    \ 作为一个新兴的跨学科领域，我们的工作延伸出众多开放性问题和潜在研究计划，包括：\n- 形式化 FML 中现有技术的量子类比，\n- 在噪声环境中探索 QFML，尤其是在耗散开放量子系统中，\n\
    - 研究使用量子特有资源（如纠缠）导致公平结果和计算如何不同以及\n- 密码学和差分隐私的量子类比在满足量子计算公平性标准中的作用。\n\n## 致谢\n\n\
    这项工作是作者在澳大利亚国立大学人文机器智能项目和悉尼科技大学量子软件与信息中心关于量子伦理研究的组成部分。 作者感谢两所机构的同事提出的建设性意见和反馈。\n\
