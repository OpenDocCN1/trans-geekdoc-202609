    # 3.1 Fairness measures


    Definitions of fairness are diverse across the FML literature. Here we briefly
    review the main categories of classical fairness (for machine learning) before
    presenting a quantum analogue of quantum fairness. Following [9], fairness definitions
    can be categorised into parity fairness, confusion-matrix based fairness, calibration
    fairness.


    +   (1) Parity metrics. In a classification context, parity metrics compare parity
    of positive rates P(Y = 1) across different groups. These include: (a) statistical
    parity, namely equal (and thus) probability of positive classification P(Y = 1|g_i)
    = P(Y = 1|g_j) without considering group differences; (b) disparate impact, the
    probability of being classified with a positive label, generally considering the
    ratio between groups i.e. P(Y = 1|g_i)/P(Y = 1|g_j) where fairness requires the
    ratio above a threshold (e.g. 80%).


    (2) Confusion-matrix based metrics. Confusion-matrix based metrics consider other
    typical measures such as true positive rate (TPR), true negative rate (TNR), false
    positive rate (FPR) and false negative rate (FNR), providing a richer analysis
    of fairness and discrimination. The key measures include: (a) equal opportunity,
    where TPR is the same across all groups P(Y = 1|y = 1, g_i) = P(Y = 1|y = 1, g_j);
    (b) equalised odds (conditional procedure accuracy equality) where FPR are considered
    as well, mandating equal probability of false positive and true positive rates
    conditional upon groups g_i, g_j; (c) overall accuracy equality concerns the overall
    percentage of correct (true positives TP and true negatives TN) with (TN + TP)/(P
    + N), where fairness measures [4] are relativised so as to require equal accuracy
    within groups; (d) conditional use accuracy equality assess the predictive values
    by demanding the probabilities of (positive/negative) classification given positive/negative
    prediction be equal, that is P(y = 1|Y = 1, g_i) = p(y = 1|Y = 1, g_j) and similarly
    for y = 0; (e) treatment equality, the ratio of FNR to FPR conditioned on each
    group should be equal; (f) equalising disincentives, which requires equality of
    the difference between TPR and FPR conditioned upon groups; and (g) conditional
    equal opportunity, applicable where data is drawn from a distribution y ~ D, such
    fairness measure require


