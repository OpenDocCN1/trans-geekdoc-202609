    # 5 PART IV: CONCLUSION AND FUTURE WORK


    In this first paper on quantum fair machine learning, we have examined foundational
    characteristics of undertaking fair machine learning involving quantum systems.
    We have set-out a (by no means exhaustive) comparison between quantum and classical
    techniques of relevance to FML on quantum systems, elucidating ways in which FML
    techniques are or are not directly transferable to quantum FML. We have provided
    a number of quantum analogues for use in quantum FML contexts. As a practical
    example, we have demonstrated the use of Grover’s amplitude amplification algorithm
    to achieve statistical parity among subgroups and set-out definitions of quantum
    fairness and quantum Lipschitz-conditioned (individual) fairness. As a new cross-disciplinary
    field, there are a multitude of open questions and potential research programmes
    extending from our work including: (a) formalising quantum analogues of existing
    techniques in FML, (b) exploring QFML in noisy


    contexts, especially in dissipative open quantum systems, (c) examining how fairness
    outcomes and computation differs as a result of using quantum-specific resources,
    such as entanglement and (d) the role of cryptographic and quantum analogues of
    differential privacy for satisfying fairness criteria for quantum computations.


