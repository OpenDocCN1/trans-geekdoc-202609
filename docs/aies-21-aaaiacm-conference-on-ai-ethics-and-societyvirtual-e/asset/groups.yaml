    \ − I   (31)\nSχ = 2P − I   (32)\n即等价于 (23)，其中 O = P。 Q 的幺正性意味着 H 具有由 Q 的两个特征向量给出的标准正交基，我们可以用它将\
    \ |ψ⟩ 分解为：\n|ψ±⟩ = 1/√2 (|ψ1⟩ ± i |ψ0⟩)   (33)\n\n请注意，与 [7] 相比，我们为了方便省略了 |ψ1⟩\
