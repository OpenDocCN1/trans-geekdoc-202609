    of positive rates P(Y = 1) across different groups. These include: (a) statistical
    parity, namely equal (and thus) probability of positive classification P(Y = 1|g_i)
    = P(Y = 1|g_j) without considering group differences; (b) disparate impact, the
    probability of being classified with a positive label, generally considering the
    ratio between groups i.e. P(Y = 1|g_i)/P(Y = 1|g_j) where fairness requires the
    ratio above a threshold (e.g. 80%).


