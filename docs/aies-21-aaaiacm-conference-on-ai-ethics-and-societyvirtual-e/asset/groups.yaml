    # 2.3 Encoding data in quantum systems


    A first step in applying quantum algorithms to solve optimisation problems involving
    quantum data involves encoding such classical data into quantum systems in a process
    known as *state preparation*. Encoding data fits within the preprocessing stage
    of typical


    FML taxonomies. Standard encoding methods include [25]: (a) basis encoding, (b)
    amplitude encoding, (c) qsample encoding and (d) dynamic encoding. *Basis encoding*
    encodes classical information, typically involves transforming data into classical
    binary bit-strings (x1, ..., xd), b_i ∈ {0,1} then mapping each bit string to
    the basis state of a set of qubits of a composite system. For example, for x ∈
    ℝ^N, say a set of decimals, is converted into a d-dimensional bit string (e.g.
    0.1 → 00001..., −0.6 → 11001..) suitably normalised such that x = Σ_k^d (1/2^k)
    x_k. The sequence x is then represented via |ψ⟩ = |00000111001⟩ (see [25]). *Amplitude
    encoding* associates normalised classical information e.g. for an n-qubit system
    (with 2^n different possible (basis) states |j⟩), a normalised classical sequence
    x ∈ ℂ^{2^n}, Σ_k |x_k|² = 1 (possibly with only real parts) with quantum amplitudes
    x = (x1, ..., x2^n) can be encoded as |ψ_x⟩ = Σ_j^{2^n} x_j |j⟩. Other examples
    of sample-based encoding (e.g. *Qsample* and *dynamic* encoding are also relevant
    but not addressed here. From a classical machine learning perspective, such encoding
    regimes also enable both features and labels to be encoded into quantum systems.


