    [25]：(a) 基编码，(b) 振幅编码，(c) qsample 编码和 (d) 动态编码。*基编码* 编码经典信息，通常涉及将数据转换为经典二进制比特串
    (x1, ..., xd)，b_i ∈ {0,1}，然后将每个比特串映射到复合系统的一组量子比特的基态。例如，对于 x ∈ ℝ^N，例如一组小数，被转换为
