    \ sin²((2k + 1)/2 θ) ≈ cos²((2k + 1)/2 θ)   (27)\n\nGrover 算法放大振幅，使得测量 |ψ⟩ ∈ H1\
    \ 的态的概率显著增加。 我们的方法略有不同：在我们的情况下，我们没有均匀叠加，因为我们假设算法 A 已根据某些优化标准加权了每个基态的振幅 ci。 在两个组之间实现统计均等意味着获得测量\
    \ H1 或 H0 中态的近似相等平均概率。 然而，我们可以使用相同的技术来提升 H1 的振幅，而不需要 H1 中每个态的等概率。 我们将在下面详细阐述示例，以阐明算法工作原理的技术细节。\n\
    \n为了放大振幅，我们定义投影算符，当应用于 H 时，它们通过以下方式投影出（保留）仅 H1 中的那些态：\nP = |1⟩⟨1| ⊗ I ⊗ I   (28)\n\
    \n正如使用密度矩阵形式所能看到的，该算符作用于第一个量子比特（其余部分未测量，如张量积中的恒等式所象征），当应用于 |ψ⟩ 时仅产生 x1 = 1 的态。\
    \ 投影算符并未直接应用于态（因为它不是幺正的），而是与其它算符线性组合使用（见下文），以构造 oracle 幺正算符和期望的放大幺正算符。 回顾上面描述的测量的基本原理，如果对\
    \ |ψ⟩ 进行测量，则 |ψ⟩ 处于 x1 = 1 的态的概率由振幅平方给出：\nPr(|ψ1⟩) = |c100|² + |c101|² + |c111|²\
    \ + |c110|²   (29)\n\n在我们的示例中，初始概率不会为 50%，因为 |ψ⟩ 已事先受到 A 的作用，A 已调整了振幅。 测量后的态 |ψ'⟩\
    \ 为：\n|ψ1⟩ = (c100|100⟩ + c101|101⟩ + c111|111⟩ + c110|110⟩) / √(|c100|² + |c101|²\
