    are also a feature of the literature: (a) positive/negative class balance, where
    fairness is characterised as equality of expected predicted score which should
    be equal conditioned on predicted score and group; and (b) Bayesian fairness measures.


    Such definitions of fairness are commonly based on equivalences or equality across
    probability distributions, with differences arising in what such probabilities
