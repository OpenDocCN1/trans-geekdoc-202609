    ## 2.4 量子测量与学习


    ### 量子测量

    量子测量是任何伦理量子计算计划不可或缺的部分。量子系统不能直接访问。相反，有关量子系统的信息取决于测量，其结果是测量结果的概率分布。对于机器学习背景，第一个关键区别是量子计算中的测量结果本质上是
