    ## 摘要


    本文首次开创了量子公平机器学习领域。我们对经典与量子公平机器学习算法之间的差异和相似性进行了比较分析，说明量子计算的独特特性如何改变在量子算法受公平性约束时所使用的度量、指标和补救策略。我们通过展示使用
    Grover 搜索算法来满足施加于量子算法的统计平价约束，呈现了量子公平机器学习中的首批结果。我们提供了在 ε-容差范围内实现此类统计平价所需的迭代次数的下界。我们使用量子度量将经典的
    Lipschitz 条件个体公平性标准扩展到量子设定。我们考察了当涉及量子信息处理和量子数据时，机器学习背景下典型公平性度量的后果。最后，我们提出了该新领域的研究开放问题和研究计划，该领域引起了计算机科学、伦理学和量子计算研究人员的兴趣。


