    a valid distance due to satisfaction of metric axioms. For quantum states represented
    by density matrices ρ, σ [20], their trace distance is given by: D(ρ, σ) = ½ tr|ρ
    − σ| (5) where |ρ| = √ρ†ρ is taken as the positive square root. Trace distance
    has the benefit of being preserved under unitary transformations.

    - (3) *Fidelity*, which is a common measure to assess state or operator similarity
    and is given by F(ρ, σ) = tr√[ρ^{1/2} σ ρ^{1/2}]. Along with trace distance, it
    is among the most important metric for similarity in quantum computing. Fidelity
    can be interpreted as a metric via, for example, calculating the angle ζ = arccos
    F(ρ, σ). It is related to trace-distance via D(ρ, σ) = √[1 − F(ρ, σ)²].

    - (4) *quantum relative entropy*, which is the quantum analogue of Shannon entropy,
    and is given by S(ρ) = −tr(ρ log ρ) with the quantum analogue of (binary) cross-entropy
    given by: S(ρ||σ) = tr(ρ log ρ) − tr(ρ log σ) (6) Both measures provide a further
    basis for similarity metrics required to determine if fairness criteria are met
    in the quantum context.


    ## 2.3 Encoding data in quantum systems


    A first step in applying quantum algorithms to solve optimisation problems involving
    quantum data involves encoding such classical data into quantum systems in a process
    known as *state preparation*. Encoding data fits within the preprocessing stage
    of typical


    FML taxonomies. Standard encoding methods include [25]: (a) basis encoding, (b)
    amplitude encoding, (c) qsample encoding and (d) dynamic encoding. *Basis encoding*
    encodes classical information, typically involves transforming data into classical
    binary bit-strings (x1, ..., xd), b_i ∈ {0,1} then mapping each bit string to
    the basis state of a set of qubits of a composite system. For example, for x ∈
    ℝ^N, say a set of decimals, is converted into a d-dimensional bit string (e.g.
    0.1 → 00001..., −0.6 → 11001..) suitably normalised such that x = Σ_k^d (1/2^k)
    x_k. The sequence x is then represented via |ψ⟩ = |00000111001⟩ (see [25]). *Amplitude
    encoding* associates normalised classical information e.g. for an n-qubit system
    (with 2^n different possible (basis) states |j⟩), a normalised classical sequence
    x ∈ ℂ^{2^n}, Σ_k |x_k|² = 1 (possibly with only real parts) with quantum amplitudes
    x = (x1, ..., x2^n) can be encoded as |ψ_x⟩ = Σ_j^{2^n} x_j |j⟩. Other examples
    of sample-based encoding (e.g. *Qsample* and *dynamic* encoding are also relevant
    but not addressed here. From a classical machine learning perspective, such encoding
    regimes also enable both features and labels to be encoded into quantum systems.


    ## 2.4 Quantum measurement and learning


    ### Quantum measurement

    Quantum measurement is integral to any program of ethical quantum computation.
    Quantum systems cannot be accessed directly. Instead, information about quantum
    systems depends on measurements whose outcomes are probability distributions over
    measurement results. For machine learning contexts, the first key difference is
    that measurement outcomes in quantum computation are inherently *probabilistic*.
    As distinct from classical computing whereby stochastic processes may be simulated,
    quantum computation is *necessarily* stochastic, such that measurement outcomes
    are represented as probability distributions obtained using POVMs. Secondly, one
    usually only ever can sample a subspace of ℋ, so full probability distributions
    for higher-order quantum systems may be unobtainable, adding additional uncertainty.
    Thirdly, where basis states are not orthogonal, then it can be proven that those
    states cannot be reliably distinguished (see [20]), which impacts for example
    the ability to distinguish states in a way necessary to measure their metric distance,
    thus whether fairness constraints have been met.


    ### Quantum learning

    A second distinct feature of quantum algorithms is in the nature of quantum *learning*.
    The ways in which one can learn about quantum systems and deploy learning strategies
    as part of measurements on or queries of quantum systems. One of the challenges
    of mapping classical FML to quantum computing arises in machine learning contexts.
    The nature of quantum information (including classical information encoded in
    quantum states) means that typical learning protocols, such as backpropagation,
    are not directly applicable because quantum information cannot be updated directly
    in the way that say a neural network weight operator can be. For example, the
    use of classical backpropagation algorithms requires classical parameterisation,
    say of a unitary U(θ) (where θ ∈ ℝ), where online- or offline-feedback between
    the outcomes of measurements and classical inputs that evolve those parameters,
    thus the unitaries and thus the quantum states of the system, is implemented [25,
    29]. More broadly, quantum algorithm formalism is usually concerned with finding
