    # 5  Refreshers


    # 5.1  Probabilities and Statistics


    # 5.1.1  Introduction to Probability and Combinatorics


    +   - **Sample space** – The set of all possible outcomes of an experiment is
    known as the sample space of the experiment and is denoted by $S$.

    +   - **Event** – Any subset $E$ of the sample space is known as an event. That
    is, an event is a set consisting of possible outcomes of the experiment. If the
    outcome of the experiment is contained in $E$, then we say that $E$ has occurred.

    +   - **Axioms of probability** – For each event $E$, we denote $P(E)$ as the
    probability of event $E$ occurring. By noting $E_1,\ldots,E_n$ mutually exclusive
    events, we have the 3 following axioms:


    $(1)\quad 0 \le P(E) \le 1 \qquad (2)\quad P(S)=1 \qquad (3)\quad P\left(\bigcup_{i=1}^{n}E_i\right)=\sum_{i=1}^{n}P(E_i)$


    +   - **Permutation** – A permutation is an arrangement of $r$ objects from a
    pool of $n$ objects, in a given order. The number of such arrangements is given
    by $P(n,r)$, defined as:


    $P(n,r)=\frac{n!}{(n-r)!}$


    +   - **Combination** – A combination is an arrangement of $r$ objects from a
    pool of $n$ objects, where the order does not matter. The number of such arrangements
    is given by $C(n,r)$, defined as:


    $C(n,r)=\frac{P(n,r)}{r!}=\frac{n!}{r!(n-r)!}$


    > Remark: we note that for $0 \le r \le n$, we have $P(n,r) \ge C(n,r)$.


    # 5.1.2  Conditional Probability


    +   - **Bayes’ rule** – For events $A$ and $B$ such that $P(B)>0$, we have:


    $P(A\mid B)=\frac{P(B\mid A)P(A)}{P(B)}$


    > Remark: we have $P(A\cap B)=P(A)P(B\mid A)=P(A\mid B)P(B)$.


    +   - **Partition** – Let $\{A_i, i\in[1,n]\}$ be such that for all $i$, $A_i\ne\varnothing$.
    We say that $\{A_i\}$ is a partition if we have:


    $\forall i\ne j,\ A_i\cap A_j=\varnothing\quad\text{and}\quad\bigcup_{i=1}^{n}A_i=S$


    > Remark: for any event $B$ in the sample space, we have $P(B)=\sum_{i=1}^{n}P(B\mid
    A_i)P(A_i)$.'
