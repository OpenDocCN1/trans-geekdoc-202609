  md: '# 1.5.2 Naive Bayes


    Assumption – The Naive Bayes model supposes that the features of each data point
    are all independent:


    $P(x|y)=P(x_1,x_2,...|y)=P(x_1|y)P(x_2|y)...=\prod_{i=1}^{n}P(x_i|y)$


    Solutions – Maximizing the log-likelihood gives the following solutions, with
    $k\in\{0,1\}$, $l\in[[1,L]]$


    $P(y=k)=\frac{1}{m}\times\#\{j|y^{(j)}=k\}$


    $P(x_i=l|y=k)=\frac{\#\{j|y^{(j)}=k\text{ and }x_i^{(j)}=l\}}{\#\{j|y^{(j)}=k\}}$


    > *Remark: Naive Bayes is widely used for text classification and spam detection.*


    # 1.6 Tree-based and ensemble methods


    These methods can be used for both regression and classification problems.


    CART – Classification and Regression Trees (CART), commonly known as decision
    trees, can be represented as binary trees. They have the advantage to be very
    interpretable.


    Random forest – It is a tree-based technique that uses a high number of decision
    trees built out of randomly selected sets of features. Contrary to the simple
    decision tree, it is highly uninterpretable but its generally good performance
    makes it a popular algorithm.


    > *Remark: random forests are a type of ensemble methods.*


    Boosting – The idea of boosting methods is to combine several weak learners to
    form a stronger one. The main ones are summed up in the table below:


    | Adaptive boosting | Gradient boosting |

    |---|---|

    | - High weights are put on errors to improve at the next boosting step

    - Known as Adaboost | - Weak learners trained on remaining errors |


    # 1.7 Other non-parametric approaches


    k-nearest neighbors – The k-nearest neighbors algorithm, commonly known as k-NN,
    is a non-parametric approach where the response of a data point is determined
    by the nature of its k neighbors from the training set. It can be used in both
    classification and regression settings.


    > *Remark: The higher the parameter k, the higher the bias, and the lower the
    parameter k, the higher the variance.*


    Kernel – Given a feature mapping $\phi$, we define the kernel $K$ to be defined
    as:


    $K(x,z)=\phi(x)^T\phi(z)$


    In practice, the kernel $K$ defined by $K(x,z)=\exp\left(-\frac{||x-z||^2}{2\sigma^2}\right)$
    is called the Gaussian kernel and is commonly used.


    ![](img/f376a3bbef2a1cafaabccff5f23575a4_3_0.png)


    > *Remark: we say that we use the "kernel trick" to compute the cost function
    using the kernel because we actually don''t need to know the explicit mapping
    $\phi$, which is often very complicated. Instead, only the values $K(x,z)$ are
    needed.*


    Lagrangian – We define the Lagrangian $\mathcal{L}(w,b)$ as follows:


    $\mathcal{L}(w,b)=f(w)+\sum_{i=1}^{l}\beta_i h_i(w)$


    > *Remark: the coefficients $\beta_i$ are called the Lagrange multipliers.*


    # 1.5 Generative Learning


    A generative model first tries to learn how the data is generated by estimating
    $P(x|y)$, which we can then use to estimate $P(y|x)$ by using Bayes'' rule.


    # 1.5.1 Gaussian Discriminant Analysis


    Setting – The Gaussian Discriminant Analysis assumes that $y$ and $x|y=0$ and
    $x|y=1$ are such that:


    $y\sim\text{Bernoulli}(\phi)$


    $x|y=0\sim\mathcal{N}(\mu_0,\Sigma)$ and $x|y=1\sim\mathcal{N}(\mu_1,\Sigma)$


    Estimation – The following table sums up the estimates that we find when maximizing
    the likelihood:


    | $\widehat{\phi}$ | $\widehat{\mu_j}\;(j=0,1)$ | $\widehat{\Sigma}$ |

    |---|---|---|

    | $\frac{1}{m}\sum_{i=1}^{m}1_{\{y^{(i)}=1\}}$ | $\frac{\sum_{i=1}^{m}1_{\{y^{(i)}=j\}}x^{(i)}}{\sum_{i=1}^{m}1_{\{y^{(i)}=j\}}}$
    | $\frac{1}{m}\sum_{i=1}^{m}(x^{(i)}-\mu_{y^{(i)}})(x^{(i)}-\mu_{y^{(i)}})^T$
    |'
