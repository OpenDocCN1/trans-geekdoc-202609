    +   - **Cross-validation** – Cross-validation, also noted CV, is a method that
    is used to select a model that does not rely too much on the initial training
    set. The different types are summed up in the table below:


    | $k$-fold | Leave-$p$-out |

    |---|---|

    | - Training on $k-1$ folds and assessment on the remaining one<br>- Generally
    $k=5$ or $10$ | - Training on $n-p$ observations and assessment on the $p$ remaining
    ones<br>- Case $p=1$ is called leave-one-out |


    The most commonly used method is called $k$-fold cross-validation and splits the
    training data into $k$ folds to validate the model on one fold while training
    the model on the $k-1$ other folds, all of this $k$ times. The error is then averaged
    over the $k$ folds and is named cross-validation error.


    ![](img/f376a3bbef2a1cafaabccff5f23575a4_10_2.png)


