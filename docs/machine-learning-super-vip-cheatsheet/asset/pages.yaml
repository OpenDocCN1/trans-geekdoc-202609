  md: '# # 1 Supervised Learning


    # ## 1.1 Introduction to Supervised Learning


    Given a set of data points $\{x^{(1)}, \ldots, x^{(m)}\}$ associated to a set
    of outcomes $\{y^{(1)}, \ldots, y^{(m)}\}$, we want to build a classifier that
    learns how to predict $y$ from $x$.


    +   - **Type of prediction** — The different types of predictive models are summed
    up in the table below:


    |  | Regression | Classifier |

    |---|---|---|

    | **Outcome** | Continuous | Class |

    | **Examples** | Linear regression | Logistic regression, SVM, Naive Bayes |


    +   - **Type of model** — The different models are summed up in the table below:


    |  | Discriminative model | Generative model |

    |---|---|---|

    | **Goal** | Directly estimate $P(y\mid x)$ | Estimate $P(x\mid y)$ to deduce
    $P(y\mid x)$ |

    | **What''s learned** | Decision boundary | Probability distributions of the data
    |

    | **Illustration** | Classification boundary illustration | Generative distributions
    illustration |

    | **Examples** | Regressions, SVMs | GDA, Naive Bayes |


    ![](img/f376a3bbef2a1cafaabccff5f23575a4_1_0.png)


    ![](img/f376a3bbef2a1cafaabccff5f23575a4_1_1.png)


    # ## 1.2 Notations and general concepts


    +   - **Hypothesis** — The hypothesis is noted $h_\theta$ and is the model that
    we choose. For a given input data $x^{(i)}$, the model prediction output is $h_\theta(x^{(i)})$.


    +   - **Loss function** — A loss function is a function $L : (z,y) \in \mathbb{R}
    \times \mathcal{Y} \longmapsto L(z,y) \in \mathbb{R}$ that takes as input the
    predicted value $z$ corresponding to the true value $y$ and outputs how different
    they are. The common loss functions are summed up in the table below:


    | Least squared | Logistic | Hinge | Cross-entropy |

    |---|---|---|---|

    | $\frac{1}{2}(y-z)^2$ | $\log(1+\exp(-yz))$ | $\max(0,1-yz)$ | $-[y\log(z)+(1-y)\log(1-z)]$
    |

    | Linear regression | Logistic regression | SVM | Neural Network |


    ![](img/f376a3bbef2a1cafaabccff5f23575a4_1_2.png)


    +   - **Cost function** — The cost function $J$ is commonly used to assess the
    performance of a model, and is defined with the loss function $L$ as follows:


    ```

    $$J(\theta)=\sum_{i=1}^{m}L(h_\theta(x^{(i)}),y^{(i)})$$

    ```


    +   - **Gradient descent** — By noting $\alpha \in \mathbb{R}$ the learning rate,
    the update rule for gradient descent is expressed with the learning rate and the
    cost function $J$ as follows:


    ```

    $$\theta \leftarrow \theta-\alpha\nabla J(\theta)$$

    ```


    ![](img/f376a3bbef2a1cafaabccff5f23575a4_1_3.png)


    > *Remark: Stochastic gradient descent (SGD) is updating the parameter based on
    each training example, and batch gradient descent is on a batch of training examples.*


    +   - **Likelihood** — The likelihood of a model $L(\theta)$ given parameters
    $\theta$ is used to find the optimal parameters $\theta$ through maximizing the
    likelihood. In practice, we use the log-likelihood $\ell(\theta)=\log(L(\theta))$
    which is easier to optimize. We have:


    ```

    $$\theta^{\mathrm{opt}}=\underset{\theta}{\arg\max}\ L(\theta)$$

    ```


    +   - **Newton''s algorithm** — Newton''s algorithm is a numerical method that
    finds $\theta$ such that $\ell''(\theta)=0$. Its update rule is as follows:


    ```

    $$\theta\leftarrow\theta-\frac{\ell''(\theta)}{\ell''''(\theta)}$$

    ```


    > *Remark: the multidimensional generalization, also known as the Newton-Raphson
    method, has the following update rule:*


    ```

    $$\theta\leftarrow\theta-\left(\nabla_\theta^2\ell(\theta)\right)^{-1}\nabla_\theta\ell(\theta)$$

    ```


    # ## 1.3 Linear models


    # ### 1.3.1 Linear regression


    We assume here that $y\mid x;\theta\sim\mathcal{N}(\mu,\sigma^2)$


    +   - **Normal equations** — By noting $X$ the matrix design, the value of $\theta$
    that minimizes the cost function is a closed-form solution such that:


    ```

    $$\theta=(X^TX)^{-1}X^Ty$$

    ```'
