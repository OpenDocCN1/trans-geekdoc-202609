    ▢ **Independence** – Two events \(A\) and \(B\) are independent if and only if
    we have:


    \[P(A\cap B)=P(A)P(B)\]


    # ### 5.1.3  Random Variables


    ▢ **Random variable** – A random variable, often noted \(X\), is a function that
    maps every element in a sample space to a real line.


    ▢ **Cumulative distribution function (CDF)** – The cumulative distribution function
    \(F\), which is monotonically non-decreasing and is such that \(\lim_{x\to-\infty}F(x)=0\)
    and \(\lim_{x\to+\infty}F(x)=1\), is defined as:


    \[F(x)=P(X\le x)\]


    > _Remark:_ we have \(P(a<X\le B)=F(b)-F(a)\).


    ▢ **Probability density function (PDF)** – The probability density function \(f\)
    is the probability that \(X\) takes on values between two adjacent realizations
    of the random variable.


    ▢ **Relationships involving the PDF and CDF** – Here are the important properties
    to know in the discrete (D) and the continuous (C) cases.


    | Case | CDF \(F\) | PDF \(f\) | Properties of PDF |

    |---|---|---|---|

    | (D) | \(F(x)=\displaystyle\sum_{x_i\le x}P(X=x_i)\) | \(f(x_j)=P(X=x_j)\) |
    \(0\le f(x_j)\le1\) and \(\displaystyle\sum_j f(x_j)=1\) |

    | (C) | \(F(x)=\displaystyle\int_{-\infty}^{x}f(y)\,dy\) | \(f(x)=\displaystyle\frac{dF}{dx}\)
    | \(f(x)\ge0\) and \(\displaystyle\int_{-\infty}^{+\infty}f(x)\,dx=1\) |


    ▢ **Variance** – The variance of a random variable, often noted \(\operatorname{Var}(X)\)
    or \(\sigma^2\), is a measure of the spread of its distribution function. It is
    determined as follows:


    \[\operatorname{Var}(X)=E[(X-E[X])^2]=E[X^2]-E[X]^2\]


    ▢ **Standard deviation** – The standard deviation of a random variable, often
    noted \(\sigma\), is a measure of the spread of its distribution function which
    is compatible with the units of the actual random variable. It is determined as
    follows:


    \[\sigma=\sqrt{\operatorname{Var}(X)}\]


    ▢ **Expectation and Moments of the Distribution** – Here are the expressions of
    the expected value \(E[X]\), generalized expected value \(E[g(X)]\), \(k^{th}\)
    moment \(E[X^k]\) and characteristic function \(\psi(\omega)\) for the discrete
    and continuous cases:


    | Case | \(E[X]\) | \(E[g(X)]\) | \(E[X^k]\) | \(\psi(\omega)\) |

    |---|---|---|---|---|

    | (D) | \(\displaystyle\sum_{i=1}^{n}x_i f(x_i)\) | \(\displaystyle\sum_{i=1}^{n}g(x_i)f(x_i)\)
    | \(\displaystyle\sum_{i=1}^{n}x_i^k f(x_i)\) | \(\displaystyle\sum_{i=1}^{n}f(x_i)e^{i\omega
    x_i}\) |

    | (C) | \(\displaystyle\int_{-\infty}^{+\infty}x f(x)\,dx\) | \(\displaystyle\int_{-\infty}^{+\infty}g(x)f(x)\,dx\)
    | \(\displaystyle\int_{-\infty}^{+\infty}x^k f(x)\,dx\) | \(\displaystyle\int_{-\infty}^{+\infty}f(x)e^{i\omega
    x}\,dx\) |


    > _Remark:_ we have \(e^{i\omega x}=\cos(\omega x)+i\sin(\omega x)\).


    ▢ **Revisiting the \(k^{th}\) moment** – The \(k^{th}\) moment can also be computed
    with the characteristic function as follows:


    \[E[X^k]=\frac{1}{i^k}\left[\frac{\partial^k\psi}{\partial\omega^k}\right]_{\omega=0}\]


    ▢ **Transformation of random variables** – Let the variables \(X\) and \(Y\) be
    linked by some function. By noting \(f_X\) and \(f_Y\) the distribution function
    of \(X\) and \(Y\) respectively, we have:


    \[f_Y(y)=f_X(x)\left|\frac{dx}{dy}\right|\]


    ▢ **Leibniz integral rule** – Let \(g\) be a function of \(x\) and potentially
    \(c\), and \(a,b\) boundaries that may depend on \(c\). We have:


    \[\frac{\partial}{\partial c}\left(\int_a^b g(x)\,dx\right)=\frac{\partial b}{\partial
    c}g(b)-\frac{\partial a}{\partial c}g(a)+\int_a^b\frac{\partial g}{\partial c}(x)\,dx\]


    ▢ **Chebyshev’s inequality** – Let \(X\) be a random variable with expected value
    \(\mu\) and standard deviation \(\sigma\). For \(k,\sigma>0\), we have the following
    inequality:


    \[P(|X-\mu|\ge k\sigma)\le\frac{1}{k^2}\]


    # ### 5.1.4  Jointly Distributed Random Variables


    ▢ **Conditional density** – The conditional density of \(X\) with respect to \(Y\),
    often noted \(f_{X\mid Y}\), is defined as follows:


    \[f_{X\mid Y}(x)=\frac{f_{XY}(x,y)}{f_Y(y)}\]


    ▢ **Independence** – Two random variables \(X\) and \(Y\) are said to be independent
    if we have:


    \[f_{XY}(x,y)=f_X(x)f_Y(y)\]'
