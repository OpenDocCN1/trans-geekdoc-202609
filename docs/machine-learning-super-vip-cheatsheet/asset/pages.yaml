  md: '# 3 Deep Learning


    # 3.1 Neural Networks


    Neural networks are a class of models that are built with layers. Commonly used
    types of neural networks include convolutional and recurrent neural networks.


    □ Architecture – The vocabulary around neural networks architectures is described
    in the figure below:


    ![](img/f376a3bbef2a1cafaabccff5f23575a4_7_0.png)


    By noting i the i^th layer of the network and j the j^th hidden unit of the layer,
    we have:


    z_j^{[i]} = w_j^{[i]T} x + b_j^{[i]}


    where we note w, b, z the weight, bias and output respectively.


    □ Activation function – Activation functions are used at the end of a hidden unit
    to introduce non-linear complexities to the model. Here are the most common ones:


    | Sigmoid | Tanh | ReLU | Leaky ReLU |

    |---|---|---|---|

    | g(z) = 1 / (1 + e^{-z}) | g(z) = (e^{z} - e^{-z})/(e^{z} + e^{-z}) | g(z) =
    max(0,z) | g(z) = max(εz,z) with ε << 1 |

    | Sigmoid curve plot | Tanh curve plot | ReLU plot | Leaky ReLU plot |


    □ Cross-entropy loss – In the context of neural networks, the cross-entropy loss
    L(z,y) is commonly used and is defined as follows:


    L(z,y) = -[ y log(z) + (1 - y) log(1 - z) ]


    □ Learning rate – The learning rate, often noted η, indicates at which pace the
    weights get updated. This can be fixed or adaptively changed. The current most
    popular method is called Adam, which is a method that adapts the learning rate.


    □ Backpropagation – Backpropagation is a method to update the weights in the neural
    network by taking into account the actual output and the desired output. The derivative
    with respect to weight w is computed using chain rule and is of the following
    form:


    ∂L(z,y)/∂w = ∂L(z,y)/∂a × ∂a/∂z × ∂z/∂w


    As a result, the weight is updated as follows:


    w ← w - η ∂L(z,y)/∂w


    □ Updating weights – In a neural network, weights are updated as follows:


    +   - Step 1: Take a batch of training data.

    +   - Step 2: Perform forward propagation to obtain the corresponding loss.

    +   - Step 3: Backpropagate the loss to get the gradients.

    +   - Step 4: Use the gradients to update the weights of the network.


    □ Dropout – Dropout is a technique meant at preventing overfitting the training
    data by dropping out units in a neural network. In practice, neurons are either
    dropped with probability p or kept with probability 1 - p.


    # 3.2 Convolutional Neural Networks


    □ Convolutional layer requirement – By noting W the input volume size, F the size
    of the convolutional layer neurons, P the amount of zero padding, then the number
    of neurons N that fit in a given volume is such that:


    N = (W - F + 2P)/S + 1


    □ Batch normalization – It is a step of hyperparameter γ,β that normalizes the
    batch {x_i}. By noting μ_B, σ_B^2 the mean and variance of that we want to correct
    to the batch, it is done as follows:


    x_i ← γ (x_i - μ_B)/√(σ_B^2 + ε) + β


    It is usually done after a fully connected/convolutional layer and before a non-linearity
    layer and aims at allowing higher learning rates and reducing the strong dependence
    on initialization.


    # 3.3 Recurrent Neural Networks


    □ Types of gates – Here are the different types of gates that we encounter in
    a typical recurrent neural network:


    | Input gate | Forget gate | Output gate | Gate |

    |---|---|---|---|

    | Write to cell or not? | Erase a cell or not? | Reveal a cell or not? | How much
    writing? |


    □ LSTM – A long short-term memory (LSTM) network is a type of RNN model that avoids
    the vanishing gradient problem by adding ‘forget’ gates.'
