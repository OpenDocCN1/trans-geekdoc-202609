  md: '# 3.4 Reinforcement Learning and Control


    The goal of reinforcement learning is for an agent to learn how to evolve in an
    environment.


    **Markov decision processes** – A Markov decision process (MDP) is a 5-tuple $(S,A,\{P_{sa}\},\gamma,R)$
    where:


    +   - $\mathcal{S}$ is the set of states

    +   - $\mathcal{A}$ is the set of actions

    +   - $\{P_{sa}\}$ are the state transition probabilities for $s \in \mathcal{S}$
    and $a \in \mathcal{A}$

    +   - $\gamma \in [0,1]$ is the discount factor

    +   - $R : \mathcal{S} \times \mathcal{A} \longrightarrow \mathbb{R}$ or $R :
    \mathcal{S} \longrightarrow \mathbb{R}$ is the reward function that the algorithm
    wants to maximize


    **Policy** – A policy $\pi$ is a function $\pi : \mathcal{S} \longrightarrow \mathcal{A}$
    that maps states to actions.


    *Remark: we say that we execute a given policy $\pi$ if given a state $s$ we take
    the action $a = \pi(s)$.*


    **Value function** – For a given policy $\pi$ and a given state $s$, we define
    the value function $V^{\pi}$ as follows:


    $V^{\pi}(s) = E\left[ R(s_0) + \gamma R(s_1) + \gamma^2 R(s_2) + ... | s_0 = s,
    \pi \right]$


    **Bellman equation** – The optimal Bellman equations characterizes the value function
    $V^{\pi^*}$ of the optimal policy $\pi^*$:


    $V^{\pi^*}(s) = R(s) + \max_{a \in \mathcal{A}} \gamma \sum_{s'' \in \mathcal{S}}
    P_{sa}(s'') V^{\pi^*}(s'')$


    *Remark: we note that the optimal policy $\pi^*$ for a given state $s$ is such
    that:*


    $\pi^*(s) = \arg\max_{a \in \mathcal{A}} \sum_{s'' \in \mathcal{S}} P_{sa}(s'')
    V^*(s'')$


    **Value iteration algorithm** – The value iteration algorithm is in two steps:


    +   - We initialize the value:


    $V_0(s) = 0$


    +   - We iterate the value based on the values before:


    $V_{i+1}(s) = R(s) + \max_{a \in \mathcal{A}} \left[ \sum_{s'' \in \mathcal{S}}
    \gamma P_{sa}(s'') V_i(s'') \right]$


    **Maximum likelihood estimate** – The maximum likelihood estimates for the state
    transition probabilities are as follows:


    $P_{sa}(s'') = \frac{\#\text{times took action } a \text{ in state } s \text{
    and got to } s''}{\#\text{times took action } a \text{ in state } s}$


    **Q-learning** – $Q$-learning is a model-free estimation of $Q$, which is done
    as follows:


    $Q(s,a) \leftarrow Q(s,a) + \alpha \left[ R(s,a,s'') + \gamma \max_{a''} Q(s'',a'')
    - Q(s,a) \right]$'
