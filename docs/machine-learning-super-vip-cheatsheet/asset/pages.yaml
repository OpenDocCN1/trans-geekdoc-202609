    +   - **Model selection** – Train model on the training set, then evaluate on
    the development set, then pick best performance model on the development set,
    and retrain all of that model on the whole training set.


    # ### 4.3 Diagnostics


    +   - **Bias** – The bias of a model is the difference between the expected prediction
    and the correct model that we try to predict for given data points.

    +   - **Variance** – The variance of a model is the variability of the model prediction
    for given data points.

    +   - **Bias/variance tradeoff** – The simpler the model, the higher the bias,
    and the more complex the model, the higher the variance.


    |  | Underfitting | Just right | Overfitting |

    |---|---|---|---|

    | **Symptoms** | - High training error<br>- Training error close to test error<br>-
    High bias | - Training error slightly lower than test error | - Low training error<br>-
    Training error much lower than test error<br>- High variance |

    | **Regression** | Regression plot showing a simple line that underfits the data.
    | Regression plot showing an appropriate curved fit. | Regression plot showing
    a highly oscillatory curve that overfits the data. |


