  md: '# 4 Machine Learning Tips and Tricks


    # 4.1 Metrics


    Given a set of data points {x^(1),...,x^(m)}, where each x^(i) has n features,
    associated to a set of outcomes {y^(1),...,y^(m)}, we want to assess a given classifier
    that learns how to predict y from x.


    # 4.1.1 Classification


    In a context of a binary classification, here are the main metrics that are important
    to track to assess the performance of the model.


    ☐ Confusion matrix – The confusion matrix is used to have a more complete picture
    when assessing the performance of a model. It is defined as follows:


    ![](img/f376a3bbef2a1cafaabccff5f23575a4_9_0.png)


    ☐ Main metrics – The following metrics are commonly used to assess the performance
    of classification models:


    | Metric | Formula | Interpretation |

    |---|---|---|

    | Accuracy | (TP + TN)/(TP + TN + FP + FN) | Overall performance of model |

    | Precision | TP/(TP + FP) | How accurate the positive predictions are |

    | Recall Sensitivity | TP/(TP + FN) | Coverage of actual positive sample |

    | Specificity | TN/(TN + FP) | Coverage of actual negative sample |

    | F1 score | 2TP/(2TP + FP + FN) | Hybrid metric useful for unbalanced classes
    |


    ☐ ROC – The receiver operating curve, also noted ROC, is the plot of TPR versus
    FPR by varying the threshold. These metrics are are summed up in the table below:


    | Metric | Formula | Equivalent |

    |---|---|---|

    | True Positive Rate TPR | TP/(TP + FN) | Recall, sensitivity |

    | False Positive Rate FPR | FP/(TN + FP) | 1-specificity |


    ☐ AUC – The area under the receiving operating curve, also noted AUC or AUROC,
    is the area below the ROC as shown in the following figure:


    ![](img/f376a3bbef2a1cafaabccff5f23575a4_9_1.png)


    # 4.1.2 Regression


    ☐ Basic metrics – Given a regression model f, the following metrics are commonly
    used to assess the performance of the model:


    | Total sum of squares | Explained sum of squares | Residual sum of squares |

    |---|---|---|

    | SS_tot = Σ_{i=1}^m (y_i - ȳ)^2 | SS_reg = Σ_{i=1}^m (f(x_i) - ȳ)^2 | SS_res
    = Σ_{i=1}^m (y_i - f(x_i))^2 |


    ☐ Coefficient of determination – The coefficient of determination, often noted
    R² or r², provides a measure of how well the observed outcomes are replicated
    by the model and is defined as follows:


    R² = 1 - SS_res / SS_tot


    ☐ Main metrics – The following metrics are commonly used to assess the performance
    of regression models, by taking into account the number of variables n that they
    take into consideration:


    | Mallow''s Cp | AIC | BIC | Adjusted R² |

    |---|---|---|---|

    | (SS_res + 2(n+1)σ̂²)/m | 2[(n+2) - log(L)] | log(m)(n+2) - 2 log(L) | 1 - (1
    - R²)(m - 1)/(m - n - 1) |


    where L is the likelihood and σ̂² is an estimate of the variance associated with
    each response.'
