    # ### 5.1.5   Parameter estimation


    +   - **Random sample** – A random sample is a collection of $n$ random variables
    $X_1,\ldots,X_n$ that are independent and identically distributed with $X$.

    +   - **Estimator** – An estimator $\hat\theta$ is a function of the data that
    is used to infer the value of an unknown parameter $\theta$ in a statistical model.

    +   - **Bias** – The bias of an estimator $\hat\theta$ is defined as being the
    difference between the expected value of the distribution of $\hat\theta$ and
    the true value, i.e.:


    $$\operatorname{Bias}(\hat\theta)=E[\hat\theta]-\theta$$


    _Remark: an estimator is said to be unbiased when we have $E[\hat\theta]=\theta$._


    □ **Sample mean and variance** – The sample mean and the sample variance of a
    random sample are used to estimate the true mean $\mu$ and the true variance $\sigma^2$
    of a distribution, are noted $\bar X$ and $s^2$ respectively, and are such that:


    $$\bar X=\frac1n\sum_{i=1}^{n}X_i \qquad\text{and}\qquad s^2=\hat\sigma^2=\frac1{n-1}\sum_{i=1}^{n}(X_i-\bar
    X)^2$$


    □ **Central Limit Theorem** – Let us have a random sample $X_1,\ldots,X_n$ following
    a given distribution with mean $\mu$ and variance $\sigma^2$, then we have:


    $$\frac{\bar X}{\;n\to+\infty\;}\sim\mathcal N\left(\mu,\frac{\sigma}{\sqrt n}\right)$$


    # ### 5.2   Linear Algebra and Calculus


    # #### 5.2.1   General notations


    □ **Vector** – We note $x\in\mathbb R^n$ a vector with $n$ entries, where $x_i\in\mathbb
    R$ is the $i^{th}$ entry:


    $$x=\begin{pmatrix}x_1\\x_2\\\vdots\\x_n\end{pmatrix}\in\mathbb R^n$$


    □ **Matrix** – We note $A\in\mathbb R^{m\times n}$ a matrix with $m$ rows and
    $n$ columns, where $A_{i,j}\in\mathbb R$ is the entry located in the $i^{th}$
    row and $j^{th}$ column:


    $$A=\begin{pmatrix}A_{1,1}&\cdots&A_{1,n}\\\vdots&&\vdots\\A_{m,1}&\cdots&A_{m,n}\end{pmatrix}\in\mathbb
    R^{m\times n}$$


    _Remark:_ the vector $x$ defined above can be viewed as a $n\times1$ matrix and
    is more particularly called a column-vector.


    □ **Identity matrix** – The identity matrix $I\in\mathbb R^{n\times n}$ is a square
    matrix with ones in its diagonal and zero everywhere else:


    $$I=\begin{pmatrix}1&0&\cdots&0\\0&\ddots&&\vdots\\\vdots&&\ddots&0\\0&\cdots&0&1\end{pmatrix}$$'
