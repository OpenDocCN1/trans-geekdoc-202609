    ▣ **Symmetric decomposition** – A given matrix $A$ can be expressed in terms of
    its symmetric and antisymmetric parts as follows:


    $$A=\underbrace{\frac{A+A^T}{2}}_{\text{Symmetric}}+\underbrace{\frac{A-A^T}{2}}_{\text{Antisymmetric}}$$


    ▣ **Norm** – A norm is a function $N:V\to[0,+\infty[$ where $V$ is a vector space,
    and such that for all $x,y\in V$, we have:


    +   - $N(x+y)\le N(x)+N(y)$


    +   - $N(\alpha x)=|\alpha|N(x)$ for a scalar


    +   - if $N(x)=0$, then $x=0$


