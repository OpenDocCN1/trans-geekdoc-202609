  md: '# 2 Unsupervised Learning


    # 2.1 Introduction to Unsupervised Learning


    Motivation – The goal of unsupervised learning is to find hidden patterns in unlabeled
    data {$x^{(1)},...,x^{(m)}$}.


    Jensen''s inequality – Let $f$ be a convex function and $X$ a random variable.
    We have the following inequality:


    $E[f(X)] \ge f(E[X])$


    # 2.2 Clustering


    # 2.2.1 Expectation-Maximization


    Latent variables – Latent variables are hidden/unobserved variables that make
    estimation problems difficult, and are often denoted $z$. Here are the most common
    settings where there are latent variables:


    | Setting | Latent variable $z$ | $x|z$ | Comments |

    |---|---|---|---|

    | Mixture of $k$ Gaussians | Multinomial($\phi$) | $\mathcal{N}(\mu_j,\Sigma_j)$
    | $\mu_j \in \mathbb{R}^n, \phi \in \mathbb{R}^k$ |

    | Factor analysis | $\mathcal{N}(0,I)$ | $\mathcal{N}(\mu + \Lambda z,\psi)$ |
    $\mu_j \in \mathbb{R}^n$ |


    Algorithm – The Expectation-Maximization (EM) algorithm gives an efficient method
    at estimating the parameter $\theta$ through maximum likelihood estimation by
    repeatedly constructing a lower-bound on the likelihood (E-step) and optimizing
    that lower bound (M-step) as follows:


    +   - E-step: Evaluate the posterior probability $Q_i(z^{(i)})$ that each data
    point $x^{(i)}$ came from a particular cluster $z^{(i)}$ as follows:

    +     $Q_i(z^{(i)}) = P(z^{(i)}|x^{(i)};\theta)$

    +   - M-step: Use the posterior probabilities $Q_i(z^{(i)})$ as cluster specific
    weights on data points $x^{(i)}$ to separately re-estimate each cluster model
    as follows:

    +     $\theta_t = \arg\max_\theta \sum_i \int_{z^{(i)}} Q_t(z^{(i)}) \log\left(\frac{P(x^{(i)},z^{(i)};\theta)}{Q_t(z^{(i)})}\right)
    dz^{(i)}$


    ![](img/f376a3bbef2a1cafaabccff5f23575a4_5_0.png)


    # 2.2.2 k-means clustering


    We note $c^{(i)}$ the cluster of data point $i$ and $\mu_j$ the center of cluster
    $j$.


    Algorithm – After randomly initializing the cluster centroids $\mu_1,\mu_2,...,\mu_k
    \in \mathbb{R}^n$, the $k$-means algorithm repeats the following step until convergence:


    $c^{(i)} = \arg\min_j \|x^{(i)} - \mu_j\|^2$ and $\mu_j = \frac{\sum_{i=1}^m \mathbf{1}_{\{c^{(i)}=j\}}
    x^{(i)}}{\sum_{i=1}^m \mathbf{1}_{\{c^{(i)}=j\}}}$


    ![](img/f376a3bbef2a1cafaabccff5f23575a4_5_1.png)


    Distortion function – In order to see if the algorithm converges, we look at the
    distortion function defined as follows:


    $J(c,\mu) = \sum_{i=1}^m \|x^{(i)} - \mu_{c(i)}\|^2$


    # 2.2.3 Hierarchical clustering


    Algorithm – It is a clustering algorithm with an agglomerative hierarchical approach
    that build nested clusters in a successive manner.


    Types – There are different sorts of hierarchical clustering algorithms that aims
    at optimizing different objective functions, which is summed up in the table below:


    | Ward linkage | Average linkage | Complete linkage |

    |---|---|---|

    | Minimize within cluster distance | Minimize average distance between cluster
    pairs | Minimize maximum distance of between cluster pairs |


    # 2.2.4 Clustering assessment metrics


    In an unsupervised learning setting, it is often hard to assess the performance
    of a model since we don''t have the ground truth labels as was the case in the
    supervised learning setting.


    Silhouette coefficient – By noting $a$ and $b$ the mean distance between a sample
    and all other points in the same class, and between a sample and all other points
    in the next nearest cluster, the silhouette coefficient $s$ for a single sample
    is defined as follows:


    $s = \frac{b - a}{\max(a,b)}$'
