  pip install -e .\n```\n\n### 预处理\n\n我们将预处理 `LJSpeech` 数据集：\n\n```bash\npython preprocess.py\
  \ --preset=presets/DeepVoice3_ljsech.json --data-root=data/LJSpeech\n```\n\n前面的命令将在\
