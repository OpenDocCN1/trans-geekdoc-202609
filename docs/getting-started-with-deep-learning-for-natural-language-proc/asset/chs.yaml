  \ GPU 的 PyTorch。\n\n# 认识音位\n\n声音是我们生活的重要组成部分——一种通信手段、一种医疗辅助手段，植物也能感知声音。所有动物都通过耳朵和其他听觉器官感知声音。声音通过产生短于振动的振荡在空气中传播。这种振动只能通过耳朵感知，或者通过名为\
  \ `mic` 的设备捕获为机器可读的格式。这样捕获的声音可以存储在 WAV、MIDI 或 MP3 等多种文件格式中。有很多此类开源资源，也存在专有文件格式以机器可读的形式存储声音。\n\
  \n在婴儿阶段，我们的大脑感知声音，大脑中的神经元经过了良好的训练，能够通过这些信号解码信息。你可以选择性地阅读这篇论文，其中麻省理工学院的一位科学家重新布线了通往听觉通路的神经元和视觉投影。尽管如此，实验动物仍然能够看到。这个实验告诉我们我们的神经元是在学习的，同样，我们可以制作神经网络来学习此类信息。在当今世界，语音分析被积极应用于多个领域：\n\
  \n*   根据流派和相似内容对音乐进行索引和推荐\n*   音频文件的相似性搜索 - Shazam（苹果的子公司）是这方面的很好的例子\n*   快速处理和生成合成语音\n\
  *   用于监控目的\n\n在接下来的章节中，我们将看到如何在项目流水线实际实现并使用文本转语音以及语音转文本。在进入实际操作之前，让我们看看如何从语音信号中提取特征，以便稍后插入流水线中。音频具有三维表示：时间、幅度和频率：\n\
  \n![](img/audio_representation.jpg)\n\n**图 10.1:** 声波的三个组成部分。\n\n幅度代表声波中的能量。高振幅声音很大，低振幅声音很小。低频声音可能是低沉的隆隆声，而高频声音可能更像嘶声。我们有很多选项来读取和处理语音数据。我们将使用\
  \ `librosa` 来分析和提取音频特征。在 Ipython notebook 中播放音频，我们将使用 `pyAudio`。可以通过 `pip install\
