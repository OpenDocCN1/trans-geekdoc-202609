  \n\n\n# 献给\n*我的家人*\n\n# 关于作者\n\n**Sunil Patel** 在印度信息技术学院-阿拉纳哈巴德获得信息技术硕士学位，论文重点关注使用深度学习研究\
  \ 3D 蛋白质蛋白质相互作用。在加入 Nvidia 之前，Sunil 曾在 TCS Innovation Labs、Excelra 和 Innoplexus\
  \ 工作。主要研究领域包括在银行和医疗领域使用深度学习和自然语言处理。Sunil 通过在流水线中使用基础层开始实验深度学习，然后针对现实问题开发复杂的流水线。此外，Sunil\
  \ 曾参加过 CASP。\n\nSunil 通过在流水线中使用基础层开始实验深度学习，然后针对现实问题开发复杂的流水线。此外，Sunil 曾参加过 CASP。主要研究领域包括在银行和医疗领域使用深度学习和自然语言处理。Sunil\
  \ 通过在流水线中使用基础层开始实验深度学习，然后针对现实问题开发复杂的流水线。此外，Sunil 曾参加过 CASP。\n\nSunil Patel 在印度信息技术学院-阿拉纳哈巴德获得信息技术硕士学位，论文重点关注使用深度学习研究\
  \ 3D 蛋白质蛋白质相互作用。在加入 Nvidia 之前，Sunil 曾在 TCS Innovation Labs、Excelra 和 Innoplexus\
  \ 工作。主要研究领域包括在银行和医疗领域使用深度学习和自然语言处理。\n\n# 关于审稿人\n\n**Anurag Punia** 在数据科学、营销和保险领域拥有\
  \ 6 年经验。他拥有 IISER 的硕士学位。\n\n# 致谢\n\n首先，我要感谢上帝给予我写这本书的勇气。感谢我的父母、妻子和兄弟一直的支持。最后，感谢\
  \ BPB Publications 的所有帮助我的人。\n\n## Sunil Patel\n\n# 前言\n\n“世界上最有价值的资源不再是石油，而是数据。”\n\
  \n\n\n\n\n\n机器学习在视觉和文本领域具有同等数量的应用。视觉相关的用例存在于机器人、自动汽车、自动飞行器、光学字符识别器、监控摄像头和安全系统中。机器学习技术在文本上的应用也称为自然语言处理（NLP），它可以应用于文本摘要、情感分析、意图分析、抄重检测、语言翻译、主题提取以及音频语言翻译、语音合成和语音转文字等应用。\n\
  \n在过去的 2 年里，`GLUE` 分从 64.7 升到 80.4，增加了近 15 分。通用语言理解评估（`GLUE`）基准是训练、评估和分析自然语言理解系统的资源集合。各种先进模型如\
  \ `ELMo`、`ULMFiT`、`OpenAi transformer` 和 `Brat` 等模型相继出现，并不断冲击之前的先进模型。这相当于文本领域的 ImageNet\
  \ 运动。\n\n本书是对不仅要学习 `NLP` 而且要掌握它所需的所有资源的理解，并在编写时考虑了初学者的技能水平。本书涵盖了整个领域，从理解机器学习的基本概念到复杂网络（如生成网络、强化学习和语音处理）在\
  \ `NLP` 中的应用。\n\n在第 1 章中，我们将学习机器学习的基础。章节包含基本概念，如理解数据、何时应用机器学习、理解训练模型的各个方面、机器学习和\
  \ `AI` 的基本原理、泛化以及处理过拟合和欠拟合。本章将涵盖诊断性概念，如偏差-方差权衡、训练和学习曲线、泛化以及正则化概念。\n\n在第 2 章中，我们将学习基础文本处理。本章将涵盖词干提取、词还原和分词等技术的使用及实现。本章涵盖使用\
  \ `Pytorch` 进行基础操作和网络构建。学习有助于用户根据所需的思路快速编译网络。由于本书的重点是 `NLP`，我们还将探索名为 `TorchText`\
  \ 的工具。它缓解了许多与文本处理相关的问题，并有助于将数据分发到多个 GPU。\n\n第 3 章 关于如何将我们的文本转换为向量，以便模型易于读取。本章将涵盖如\
  \ `TF-IDF` 和 `Word2Vec` 等各种关键技术。除了传统技术外，还将涵盖基于字符的向量嵌入技术，如 `FastText`。\n\n第 4 章 将涵盖\
  \ `循环神经网络 (RNN)`，它被认为是序列处理技术中的里程碑。在 `Vanilla RNN` 的基础上，本章还将帮助读者理解并实现 `门控循环单元 (GRU)`\
  \ 和 `长短期记忆 (LSTM)` 单元。本章将涵盖循环网络的批量实现、注意力机制架构以及使我们能够训练极深层序列模型的高公路网络等主题。\n\n第 5 章\
  \ 将带你了解 `卷积神经网络 (CNN)`，它现在在文本处理中被广泛使用。在本章中，我们将学习基本的卷积操作以及与 `CNN` 相关的不同参数对任务准确率的影响。本章还涵盖了\
  \ `Dropout` 和 `批归一化` 等概念，这些有助于 `CNN` 实现更高的精度。我们还将涵盖如 `DenseNet` 等高级架构。\n\n第 6 章\
  \ 将带你深入了解 `卷积神经网络 (CNN)`。它将探索用于文本的先进技术，如 `ELMo` 和 `SentencePiece`。本章还将涵盖用于图像生成的\
  \ `GAN` 等`高级架构`。\n\n第 7 章 将为任何意外错误提供 `NLP` 支持。本章还将涵盖 `深度语音`和`深度声音。\n\n第 8 章 全关于\
  \ `循环神经网络 (RNN)`。本章还将涵盖 `CNN` 和 `孪生网络`。它还将探索用于图像生成的 `GAN`。\n\n第 9 章 将帮助理解并编写不同类型的\
  \ `GAN`。最后，我们将探索用于图像生成的 `GAN`。\n\n第 10 章 将涵盖任何用例的`语音处理`。本章还将涵盖`端到端`模型。\n\n最后，本书将介绍如何利用硬件和软件的最新进展来实现更快的训练和更好的部署。\n\
