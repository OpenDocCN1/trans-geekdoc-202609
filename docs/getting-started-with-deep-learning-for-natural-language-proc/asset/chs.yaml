  \n## 结论\n\n在本章中，我们在掌握自然语言处理领域的目标上又迈了一步。我们从数据检索开始，处理此类技术的知识对于收集特定应用程序的数据至关重要。请记住，通用的数据无法满足所有的业务需求，因此对于特定问题始终需要自定义数据集，这些数据集可以从各种来源收集。词干（Stemming）和词形还原（Lemmatization）技术并非完美，但被用于机器学习应用，并有助于显著减少/集中词汇量。我们涵盖了基础的分词（tokenization）技术。尽管如此，像\
  \ Bert 等现代技术使用了更先进、更内存内存的分词技术，我们将在后续章节中介绍这些。我们开始学习 PyTorch 的基础片段——这是我们在本书中使用的框架。PyTorch\
  \ text 是一个极大地简化了预处理流程的包，因此我们将使用 `TorchText` 和 PyTorch 数据加载器——这是 `PyTorch` 自带的更通用的数据加载类。\n\
  \n在下一章中，我们将学习如何用数学表示语言。\n\n# 第 3 章：用数学表示语言\n\n在之前的章节中，我们已经涵盖了理解和实现基础机器学习模型所需的所有内容。我们还看到了如何利用\
  \ `TorchText` 和 `TensoboardX` 更好地处理文本，并可视化结果以及训练过程。本章将开始介绍文本的数学表示。通过数学方式表示文本，以便为机器提供更好的含义。这是一个活跃的研究领域，谷歌、微软和脸等许多巨头正在不断工作并产生最先进的模型。本章将带你了解基础基于计数的向量化方法，如共现矩阵（Co-occurrence\
  \ Matrix）和 TF-IDF。本章深入介绍了预测性稠密向量生成方法，如 Word2Vec、GloVe 和 FastText。\n\n## 结构\n\n在本章中，我们将涵盖以下食谱：\n\
  \n*   前提条件\n*   将知识转化为数字\n*   理解共现矩阵\n*   理解 TF-IDF\n*   理解 Word2Vec\n*   理解 GloVe\n\
  *   理解基于字符的嵌入（embedding）\n\n## 目标\n\n本章主要关注如何将语言转换为数学表示。这种人类语言的数学表示可以被机器学习/深度学习算法消费，以执行不同的自然语言处理任务。\n\
  \n### 前提条件\n\n我通过代码提供了一些示例。本章的代码位于 GitHub 仓库中的 `Ch3` 文件夹中（[`github.com/bpbpublications/Getting-started-with-Deep-Learning-for-Natural-Language-Processing`](https://github.com/bpbpublications/Getting-started-with-Deep-Learning-for-Natural-Language-Processing)）。要理解本章，你需要具备关于以下\
  \ Python 包的一些基础知识：\n\n*   Numpy\n*   Scipy\n*   Matplotlib\n*   FastText\n*   Torch\n\
  *   TensorboardX\n*   Nltk\n*   Tqdm\n*   Matplotlib\n\n你可以通过安装 `requirements.txt`\
  \ 中列出的所有包来安装这些需求。可以通过执行命令完成：\n\n```bash\npip install -r Ch3/requirements.txt\n```\n\
  \n## 将知识转化为数字\n\n计算机的目的是为了计算数字。数学逻辑只能应用于数字。自然语言是人类使用的，它的基础与数字非常不同。语言旨在通信，具有基础的构建单元，如字符和单词。数学被称为宇宙的语言，每种表示都有绝对且不变的含义，而自然语言具有模糊性。在自然语言中，一个单词或字符可以根据其上下文有不同的含义。\n\
  \n语言具有不同的组织层次。例如，基本实体被称为字符；许多字符组合在一起形成单词。许多单词在语言学方式上排列，可以形成一个有意义的句子。这样的句子如果围绕特定主题以特殊顺序排列，这类句子被称为**段落（paragraphs）**。在文学中，句子和段落有时被称为**文档（documents）**。单词通常被称为**标记（token）**。有些语言基于字符，如中文和日语，其中每个字符的含义与其他语言中的单词相似。通常，单词之间用空格分隔，但通常并非如此；在中文和日语中，没有标记分离的规则。\n\
  \n## 理解将单词/标记转换为其嵌入的不同方法\n\n根据前面的讨论，字符、单词或句子都可以以数字的形式表示。我通过不谈论字符和句子来保留了一个小秘密。让我们继续将单词转换为数字。以下是当我们考虑将单词转换为数字时，按时间顺序想到的方法：\n\
  \n\n\n\n\n### 基于 ID 的映射\n假设我们有两个词，`Cat` 和 `Panther`。假设给单词 `cat` 标记为 `id 123`，给 `panther`\
  \ 标记为 `id 345`。这两个 `ids` 并没有显示 `cat` 和 `panther` 之间的任何关系。在分类学中，它们都属于同一个科属，而且都是哺乳动物。现在，假设我再取另一个词\
  \ `pigeon`，那么我们就无法计算这三个词之间的关系。理想情况下，`Cat` 和 `Panther` 比 `Pigeon` 的更密切。在语言中，无论单词的拼写或读音方式如何，每个词之间都是相互相关的。如果你最简单的方法无法显示两个词之间的内在关系，那么它显然会失败。另一个问题是，如果你有数十亿个单词，你就必须对它们从一到十亿进行编号。这看起来是一个非常糟糕的主意。如果你收到的单词是\
  \ `eachother`（这是一个拼写错误，实际的 token 应该是 `each other`），在这种情况下，你基于 `id` 的方法无法为该词找到任何\
  \ `id`，从而导致失败。\n\n### 独热编码\n独热编码是将类别变量表示为二进制向量。这种技术的灵感源于数字电路。继续之前的例子。如果词汇表大小为 2，那么\
  \ `cat` 将表示为 `[0, 1]`，而 `panther` 将表示为 `[1, 0]`。这面临着同样的稀疏性问题。如果我们有数十亿个单词，这种技术将因为内存耗尽而失败。此外，这两个向量之间不存在相关性。\n\
  \n### 共现矩阵\n它的灵感源于单词的语境含义。一个词的特征由它所处的环境决定。这种技术将在本章的下一个食谱中讨论。\n\n### 基于词频的指标\n这些方法根据单词的出现频率为单词赋予权重。`TF-IDF`\
  \ 等技术属于此类。该技术将在本章接下来的食谱中详细讨论。`Co-occurrence` 和 `TF-IDF` 属于同一类，即基于计数的方法（count-based\
  \ approaches）。\n\n### 预测方法\n这是生成嵌入的最广泛的类别。属于该类的方法通常借助神经网络或深度学习算法（如 `LSTM` 和 `CNN`）来生成单词的有意义稠密表示。这些技术在字符、单词和句子层面运行。我们将在接下来的食谱中讨论这些技术。词级嵌入是基于词级特征生成稠密向量，而字符级嵌入是基于字符级特征生成稠密向量。词级和字符级嵌入将在接下来的食谱中讨论。这些嵌入将单词转换为大小为\
  \ 100、200 或 300 的固定向量。该向量随后被作为后续机器学习任务的输入。句子级嵌入将在 `第 6 章` 中讨论。\n\n现在，我们对嵌入的了解较少，而而易见的问题是为什么我们需要嵌入。首先想到的的是，我们通过将单个单词转换为大小为\
  \ 100 的浮点向量，不必要地增加了数据量。这种高维表示也称为`稠密向量表示`（dense vector representation）。这似乎是一个存储密集型的解决方案，但这是我们能做的最好的。此外，如果通过预测方法生成的此类向量构建得当，我们就可以捕捉单词之间的语义关系。\n\
  \n\n\n\n\n通过在前面的脚本中将上下文大小保持在 1 到 3 之间，你将看到一种不同的共现矩阵，如上图所示。共现矩阵似乎比我们最简单的基于 ID 的方法更进了一步，因为它考虑了上下文，因此使其基础更加严谨。\n\
  \n共现矩阵被用于构建 `GloVe` 和 `Word2Vec` 嵌入。使用共现矩阵存在某些缺点，这最终限制了它的使用；这些缺点列如下：\n\n1. 一旦构建了矩阵，添加新词就需要重新计算整个矩阵。\n\
  2. 上下文窗口的变化也需要重新计算整个矩阵。\n3. 由于其稀疏性和对称性，该矩阵往往会变得非常庞大。处理词汇量为百万级的共现矩阵需要像 `HDFS` 这样的分布式系统。存储共现矩阵需要巨大的内存。\n\
  \n`GloVe` 嵌入通过在共现矩阵的基础上应用统计学习将该概念进一步扩展了一步。我们将在接下来的章节中详细学习 `GloVe` 嵌入。\n\n正如我们在在本章开头讨论的，共现矩阵的使用不仅限于文本处理，它也用于图像处理。`灰度共现矩阵`\
  \ (`GLCM`) 用于视觉处理，通过计算图像中具有特定像素值且处于特定空间关系的像素对出现的频率，来表征图像的纹理。\n\n请参考以下参考文献：\n\n1.\
  \ 灰度共现矩阵：泛化与一些新特征：[`arxiv.Org/pdf/1205.4831.pdf`](https://arxiv.Org/pdf/1205.4831.pdf)\n\
  \n## 理解 TF-IDF\n\n词频逆文档频率 (`TF-IDF`) 包含以下两个部分：\n\n* 词频 (`TF`)\n* 逆文档频率 (`IDF` 。\n\
  \nTF-IDF 技术在历史上曾被搜索引擎用于对领域进行排序并计算点击成本（带有一些额外的特征）。TF-IDF 主要用于推荐系统。在深度学习模型中 TF-IDF\
  \ 的使用并不多，但在机器学习中被广泛使用。\n\n### 词频\n\nTF 指词在文档中出现的频率除以文档中的单词总数。TF 有助于识别那些在文档中出现更频繁的词。这些高频词通常是停用词，例如\
  \ `and`、`the`、`is` 或 `a`。TF 在数学上可以定义如下：\n\n![](img/158C1Eq17.jpg)\n\n其中 `f[t,d]`\
  \ 是给定术语 `t` 在文档 `d` 中的频率 `f`，它除以文档 `d` 中存在的所有其他术语 `t'` 之和。考虑一个包含 `1000` 个单词的文档，其中单词\
  \ `cat` 出现了三次。那么 `cat` 的词频（即 `TF`）为 `(3/1000) = 0.003`。\n\n### 逆文档频率\n\n词频是考虑词在文档中出现频率的指标。那么那些更重要但并不频繁使用的词呢？逆文档频率是为了处理这些重要但频率较低的词，并抵消最频繁的词（这些词通常被称为停用词）。IDF\
  \ 在数学上可以定义如下：\n\n![](img/158C1Eq18.jpg)\n\n其中 IDF 是 `N`（文档中的单词总数）除以 `N[t]`（该术语出现的文档数量）。现在，假设我们有\
  \ `1 亿` 份文档，单词 `Stephen` 出现在其中一千份中。那么，逆文档频率（即 `IDF`）计算为 `log(100,000,000/1,000)\
  \ = 5`。如果一个像 `the` 这样频繁的词出现在几乎所有的文档中，那么该词的值就会降低，因此该词的重要性 ![](img/158C1Eq19.jpg)\
  \ 如下所示：\n\n`TF – IDF = TF * IDF`\n\n因此，TF-IDF 权重是这两个值的乘积：`0.003 * 4 = 0.012`。\n\n\
  ### 构建 TF-IDF 矩阵\n\n为了创建 TF-IDF，可以使用来自 Scikit-learn 的 `TfidfVectorizer` 函数。要获取任何语料库的\
  \ TF-IDF，我们需要将每个语料库作为数组的独立元素。在这里，`‘this is the one document.’`、`‘this is the second\
  \ document.’` 和 `‘and this is the third one.’` 被视为如下独立的文档：\n\n```python\ncorpus\
  \ = [`‘this is the one document.’,\n‘this is the second document.’,\n‘and this is\
  \ the third one, which is very similar to first one.’,\n‘is this the first document\
  \ relates to politics?`,]\nvectorizer = TfidfVectorizer()\nX = vectorizer.fit_transform(corpus)\n\
  print(vectorizer.get_feature_names())\nprint(csr_matrix.todense(X))\n```\n\n运行脚本\
  \ `Ch3/tfidf.py`，并在绘图库 `Matplotlib` 的帮助下，TF-IDF 可以可视化所示：\n\n![](img/tfidf.jpg)\n\
  \n**图 3.4：** 应用示例句的 TF-IDF\n\n从图中可以看到，像 `second` 和 `first` 等词的 TF-IDF 值比更频繁的词 `the`\
  \ 和 `this` 高。在当前的矩阵中，高频词和低频词之间的 TF-IDF 差异很小。这种差异会随着语料库的增大而增长，因此使用足够大的语料库使 TF-IDF\
  \ 才有意义。在 TF-IDF 之后，第一个文档 `‘this is the document.’` 可以通过生成的 TF-IDF 表示。该向量可以用于后续的机器学习流水线。\n\
  \nTF-IDF 可以应用于许多其他领域，例如用于确定词的相关性。TF-IDF 通过词在特定文档中的频率与词所在文档百分比的反比，来计算文档中每个词的值。高 TF-IDF\
  \ 数字意味着词与其所在的文档之间有更强的关系，表明如果该词出现在查询中，该用户可能感兴趣。\n\n请参考以下链接：\n\n1. 使用 TF-IDF 确定文档查询中词的相关性：citeseer.\
  \ Ist. Psu. Edu/viewdoc/download? Doi=10.1.1.121.1424&rep=rep1&type=pdf\n\n\n\n\n\
  正如我们已经讨论过的，基于计数的通过通过特定的窗口大小学习不同词汇的共现关系并生成矩阵。这种高维矩阵通常通过`主成分分析`（`PCA`）或`奇异值分解`（`SVD`）转换为稠密向量。而在预测方法中，隐藏表示是通过强制网络从目标词预测其上下文（或反之）来学习学习的。Word2Vec\
  \ 就属于这一类。Word2Vec 是一种计算上可靠且数学上稳定的方法，它通过使用连续词袋模型（`CBOW`）或 SkipGram 技术来学习向量表示。这两种技术是训练\
  \ Word2Vec 模型的两种不同方式。在进入这两种技术的具体原理和细节之前，让我们先看看 Word2Vec 模型通常是如何训练的。Word2Vec 模型是一个单隐藏层神经网络，具有线性或无激活函数（或线性激活）。它包含三层，即如下所示的`Input\
  \ Layer`（输入层）、`Hidden Layer`（隐藏层）和 `Output Layer`（输出层）：\n\n![](img/word2vec.jpg)\n\
  \n**图 3.5：** 用于训练 Word2Vec 模型的通用神经网络架构\n\n![](img/158C3Eq1.jpg)\n\n从数学上看，可以给出：\n\
  \n在前面的方程中，我们的词汇表大小为 500，因此每个标记 `X` 可以表示为大小为 (1, 500) 的独热向量。我们希望将嵌入 `H` 的维度保持为 300，因此输入\
  \ `X` 与维度为 (500, 300) 的权重矩阵 `W[i]` 相乘。现在，此嵌入向量与另一个大小为 (300, 500) 的权重矩阵 `W[O]` 相乘，转换为目标向量表示，这通常是显示每个词汇标记概率的浮点数。对此类输出应用\
  \ Softmax 操作来计算概率分布。在该分布中，目标标记是概率最高的那个。如果预测的标记 `Ŷ` 与 `Y` 相同，则误差为零，否则误差反向传播，并相应调整权重。\n\
  \n使用 `torch` 来设计我们的三层神经网络。使用 `tensorboardX` 写入输出以便 TensorBoard 可以进行绘图。`SummaryWriter`\
  \ 将输出写入磁盘，并将由 `tensorboardX` 如下读取：\n\n```\nimport torch\nfrom torch.autograd import\
  \ Variable\nimport torch.nn as nn\nimport torch.nn.functional as F\nimport torch.optim\
  \ as optim\nfrom tqdm import tqdm\nfrom tensorboardX import SummaryWriter\nimport\
  \ numpy as np\n\nwriter = SummaryWriter(log_dir=’runs/’)\ntorch.manual_seed(1)\n\
  ```\n\n## 理解训练 Word2Vec 的方法\n\n在本节中，我们将学习训练 Word2Vec 所需的方法：\n\n* **连续词袋模型 (CBOW)**：CBOW\
  \ 是训练 Word2Vec 模型的方法之一。CBOW 模型获取上下文词并尝试预测目标词。在接下来的图中，考虑到窗口大小，`2` [“`a`、“`ML`,”、“`and`”`,`“`I`”]是上下文词，而词“`scientist`”是目标词。\n\
  \n![](img/co-occurence_example_2.jpg)\n\n**图 3.6：** 显示共现窗口 = 2 的目标词和上下文词\n\n它显示了共现窗口\
  \ = 2 的目标词和上下文词。网络由一个输入层组成，该层接收所有这些上下文词并尝试预测目标词。假设我们的词汇表大小为 500。每个输入词 `X` 将用独热编码表示，以便每个上下文词都用表示为大小为\
  \ [1, 500] 的向量。假设我们希望嵌入大小为 `N = 300`。考虑到此，输入权重 `W[i]` 的大小将为 [500, 300]。`X` 与 `W[I]`\
  \ 的点积产生一个大小为 300 的隐藏向量。隐藏层与另一个大小为 [300] 的 `W[O]` 相乘，产生一个维度为 [1, 500] 的目标标记。\n\n\
  ![](img/CBOW-SkipGram.jpg)\n\n**图 3.7：** 显示共现窗口 = 2 的目标词和上下文词\n\n共现窗口 = 2 的目标词和上下文词。网络由一个输入层组成，该层接收所有这些上下文词并尝试预测目标词。假设我们的词汇表大小为\
  \ 500。每个输入词 `X` 将用独热编码表示，以便每个上下文词都被表示为大小为 [1, 500] 的向量。假设我们希望嵌入大小为 `N = 300`。考虑到此，输入权重\
  \ `W[i]` 的大小将为 [500, 300]。`X` 与 `W[I]` 的点积产生一个大小为 300 的隐藏向量。隐藏层与另一个大小为 [300] 的 `W[O]`\
  \ 相乘，产生一个维度为 [1, 500] 的目标标记。\n\n从数学上看，可以给出：\n\n![](img/158C3Eq2.jpg)\n\n* **SkipGram**：SkipGram\
  \ 是 CBOW 的反。它获取目标词并尝试预测上下文词。在接下来的图中，考虑到窗口大小，`2` [“`a`、“`ML`,”、“`and`”`,`“`I`”]是上下文词，而词“`scientist`”是目标词。\n\
  \n![](img/158C3Eq.jpg)\n\n### 实现\n\n在本节中，我们将学习训练 Word2Vec 所需的方法：\n\n* **预处理**：通过\
  \ NLTK 移除停用词。该模块接收文本并遍历句子，移除停用词，并返回如下：\n\n```python\ndef remove_stop_words(text):\n\
  \    all_sentence = []\n    stop_words = set(stopwords.words('english'))\n    for\
  \ each_sentence in text:\n        word_tokens = word_tokenize(each_sentence)\n \
  \       filtered_sentence = [w for w in word_tokens if w not in stop_words]\n  \
  \      all_sentence.append(' '.join(filtered_sentence))\n    return all_sentence\n\
  ```\n\n* **读取数据，词汇表生成**：在这里，我们定义上下文大小为 2，意味着目标词左右两个词。接下来是读取文本。在这里，我使用了从 Wikipedia\
  \ 获取的小数据集。你可以查看文件 `Ch3/data/testdata.txt` 以了解我们的数据集。接下来是生成词汇表、识别所有标记并建立词到索引和索引到词的字典：\n\
  \n```python\nCONTEXT_SIZE = 2 # 左侧两个词，右侧两个\ntext = open(\"Change this\").read().split()\n\
  text = remove_stop_words(text)\nvocab = set(text)\nvocab_size = len(vocab)\nprint('vocab_size:',\
  \ vocab_size)\nw2i = {w: i for i, w in enumerate(vocab)}\ni2w = {i: w for i, w in\
  \ enumerate(vocab)}\n```\n\n* **为 CBOW 创建数据集**：如图所示，CBOW 获取上下文词并尝试预测目标词。使用以下函数相应地准备数据集：\n\
  \n```python\ndef create_cbow_dataset(text):\n    \"\"\"\n    为 CBOW 创建数据\n    \"\
  \"\"\n    data = []\n    for i in range(2, len(text) - 2):\n        context = [text[i\
  \ - 2], text[i - 1],\n                   text[i + 1], text[i + 2]]\n        target\
  \ = text[i]\n        data.append((context, target))\n    return data\n```\n\n你可以对我们的文本数据执行前面的函数，并将观察到准备好的\
  \ CBOW 数据集具有上下文词及其相应目标词的对：\n\n```python\ncbow_train = create_cbow_dataset(text)\n\
  >>>cbow sample ([['First', 'Citizen :', '', 'proceed'], 'Before')\n```\n\n\n\n\n\
  ### 创建 CBOW 模型\n\n如前面的图所示，CBOW 模型包含三层，即输入层、输出层和隐藏层。根据 PyTorch 的惯例，网络类有两个函数。在 `__init__()`\
  \ 函数中，我们定义了构建网络所需的所有层。在 `forward()` 函数中，我们将所有之前定义的函数连接起来，构建构建如下架构：\n\n```python\n\
  class CBOW(nn.Module):\n  def __init__(self, vocab_size, embd_size, context_size,\
  \ hidden_size):\n    super(CBOW, self).__init__()\n    self.embeddings = nn.Embedding(vocab_size,\
  \ embd_size)\n    self.linear1 = nn.Linear(2*context_size*embd_size, hidden_size)\n\
  \    self.linear2 = nn.Linear(hidden_size, vocab_size)\n\n  def forward(self, inputs):\n\
  \    embedded = self.embeddings(inputs).view((1, -1))\n    hid = F.Linear(self.linear1(embedded))\n\
  \    out = self.linear2(hid)\n    log_probs = F.log_softmax(out)\n    return log_probs,\
  \ hid\n```\n\n正如你可能观察到的，前面的模型在输出对概率的同时还输隐藏表示。这个隐藏表示是模型学习的核心。在第 4 章，使用 RNN 用于 NLP\
  \ 中将非常清楚地，用于生成字符、单词或句子嵌入的大多数模型在网络中包含两个部分，即编码器和解码器。在这里，网络的第一部分由输入层和连接输入的权重组成，隐藏层被等同于编码器。后半部分的权重连接到隐藏层和输出层，输出层本身可以被视为解码器。学习的核心通过\
  \ `hidden_layer` 学习。因此，在前面的网络中，对数概率将在训练阶段用于收敛网络，而隐藏值在这里并不重要。而在测试/推理阶段，隐藏权重被用单词的稠密表示。\n\
  \n### 训练 CBOW\n\n在这里，我们将嵌入的大小定义为 100。因此，在训练结束时，每个单词将得到一个大小为 100 的稠密向量。该网络将使用负对数似然\
  \ (`NLL`) 损失函数和随机梯度下降 (`SGD`) 优化器训练 10 个 epoch，如下：\n\n```python\nembd_size = 100\n\
  learning_rate = 0.01\nn_epoch = 10\ndef train_cbow():\n  losses = []\n  loss_fn\
  \ = nn.NLLLoss()\n  model = CBOW(vocab_size, embd_size, CONTEXT_SIZE, hidden_size).to(device)\n\
  \  optimizer = optim.SGD(model.parameters(), lr=learning_rate)\n  for epoch in tqdm(range(n_epoch)):\n\
  \    total_loss = .0\n    for context, target in cbow_train:\n      ctx_idxs = [w2i[w]\
  \ for w in context]\n      ctx_var = Variable(torch.LongTensor(ctx_idxs).to(device))\n\
  \      model.zero_grad()\n      log_probs, _ = model(ctx_var)\n      loss = loss_fn(log_probs,\
  \ Variable(torch.LongTensor([w2i[target]]).to(device)))\n      loss.backward()\n\
  \      optimizer.step()\n      total_loss += loss.data[0]\n      losses.append(total_loss)\n\
  \  return model, losses\n```\n\n### 在测试上检查质量\n\n理想情况下，人们应该使用数据集的留出部分进行测试，但在情况下，由于该数据集太小，我使用了训练数据，之前生成的模型将用于推理。在推理过程中，将使用训练后的模型生成集中所有唯一单词的向量。推理后，所有稠密向量将导出到磁盘，以便使用\
  \ TensorboardX 可视化，如下：\n\n```python\ndef test_cbow(test_data, model):\n  vector_array\
  \ = []\n  predicted_word_array = []\n  correct_ct = 0\n  for ctx, target in test_data:\n\
  \    ctx_idxs = [w2i[w] for w in ctx]\n    ctx_var = Variable(torch.LongTensor(ctx_idxs).to(device))\n\
  \    model.zero_grad()\n    log_probs, hidden = model(ctx_var)\n    _, predicted\
  \ = torch.max(log_probs.data, 1)\n    predicted_word = i2w[int(predicted[0])]\n\
  \    if (predicted_word not in predicted_word_array):\n      vector_array.append(np.array(hidden.to('cpu').detach().numpy())[0])\n\
  \      predicted_word_array.append(str(predicted_word))\n    if predicted_word ==\
  \ target:\n      correct_ct += 1\n    if correct_ct == 10000:\n```\n\n\n\n\n\n作者指出，某些词对具有特定的含义，拆分这些短语会破坏整体含义。例如，如果将\
  \ `New York Times`（纽约时报）这个词拆分成标记，它将失去其意义。为了解决这个问题，作者建议寻找在词汇表中高频出现的词对，并将其视为单个标记。虽然这似乎是一个原始的想法，但当\
  \ Google 实现它时，词汇表规模减少了 1 亿。\n\n### 负采样 (Negative sampling)\n\nWord2Vec 有两个矩阵需要调优。假设我们的隐藏层大小为\
  \ 300，词汇表大小为 10000，我们有大量的权重在每个 epoch 中改变 `300*10000 = 3000000`。当词汇表大小进一步增加时，这种规模变得不可想象。在这种情况下，网络通过取一个正样本和若干个较大的负样本进行训练，我们希望网络对这些词输出\
  \ `0`。通常我们将一个正词与五个负词混合。现在，整个网络将被训练，使得这些词在瞬时计算损失。因此，我们只更新权重的 `(300*6) = 1800`，这仅是输出层权重的\
  \ 0.06%。这不是不是巨大的改进吗？负采样极大降低了计算复杂度。\n\n参考以下链接：\n\n1. [向量空间中词表示的高效估计](https://arxiv.org/abs/1301.3781)\n\
  2. [词和短语的分布式表示及其组合](https://papers.nips.cc/paper/5021-distributed-representations-of-words-and-phrases-and-compositionality.pdf)\n\
  3. [查看用于训练 Word2Vec 的 Google 词汇表](https://github.com/word2vec/vocabulary)\n\n##\
  \ 理解 GloVe\n\nGloVe（Global Vectors for Word Representation）是另一种无监督方式训练词嵌入的技术。GloVe\
  \ 由斯坦福大学的研究人员 Jeffrey Pennington、Richard Socher 和 Christopher D. Manning 提出。相比 Word2Vec，GloVe\
  \ 更有原则，但也存在一些局限性：\n\n1. 正如我们在前文中所示，Word2Vec 只考虑词的局部上下文。它没有考虑词的全局共现统计。\n2. Word2Vec\
  \ 使用反向传播进行训练，因此无法正确学习稀有词的嵌入。\n\nGloVe 向量实现实现了两个目标：\n\n1. 创建在向量空间中携带含义的向量\n2. 考虑全局计数而非仅仅是局部含义\n\
  \nGloVe 和 Word2Vec 实现的区别在于：与 Word2Vec 通过句子操作不同，GloVe 通过共现矩阵操作。在 GloVe 中，损失基于词频。GloVe\
  \ 和 Word2Vec 采用不同的方法，但通常的结果是类似的；在某些情况下，GloVe 胜过 Word2Vec。在下面的图中，我们取窗口大小 = `2`。目标词和上下文如下![images/co-occurence_example.jpg)\n\
  \n**图 3.10:** 显示共现窗口 = 2 的目标词和上下文\n\n在 GloVe 中，我们从构建共现矩阵开始。我们将共现矩阵称为 `X`。其中每个元素\
  \ `X[{ij}]` 表示标记 i 与标记 j 出现的次数。这种矩阵是非双对称的。共现矩阵通过保持一定的窗口大小来构建。与 SkipGram 技术不同，我们没有给窗口内的所有词赋予相同的权重。在\
  \ GloVe 中，对距离较远的词赋予较小的权重。这种权重变化由以下公式定义：\n\n![images/158C3Eq5.jpg)\n\n偏移（Offset）意味着上下文词距离目标词的距离。随着偏移量的增加，权重的衰减越多。\n\
  \n### 定义可学习参数\n\n接下来，为每对词定义可学习权重和偏置：\n\n`w[i]^T w[j] + b[i] + b[j] = log(X[{ij}])`\n\
  \n其中，`b[j]` 是上下文词的标量偏置。\n\n### 定义损失函数\n\n![images/158C3Eq6.jpg)\n\n这里 `f` 是防止高频词对嵌入影响的。原始作者选择以下函数来减少此类词的影响。\n\
  \n![images/158C3Eq7.jpg)\n\n前面的方程看起来可能混乱，但一旦绘制，其意义就会变得非常清晰。在这里，`a` 是另一个常数，默认值为 0.75。以下代码可以演示权重函数：\n\
  \n```python\nimport matplotlib.pyplot as plt\nimport math\n\nxmax = 1000\na = 0.75\n\
  weight = [min(1,math.pow(x/xmax,a)) for x in range(1,2000)]\nplt.plot([x for x in\
  \ range(1,2000)], weight)\nplt.ylabel(\"weight\")\nplt.xlabel(\"Xij\")\nplt.title(\"\
  Weighting Function\")\n```\n\n该函数绘制后如下。如图所示，当片段 ![](img/158C3Eq3a.jpg) 超过 1 后，权重不再增加，并对高频词应用相同的权重。\n\
  \n![images/Weighting_Function.jpg)\n\n**图 3.11:** 防止极高频影响的权重函数\n\n### 定义参数\n\n定义上下文窗口\
  \ `3`，左右各 3 个将被视为上下文词。由于这是一个非常小的语料库，我将嵌入大小设置为 `50`。\n\n```python\n### Set parameters\n\
  context_size = 3\nembed_size = 50\nxmax = 2\nalpha = 0.75\nbatch_size = 20\n```\n\
  \n### 数据预处理\n\n包括读取文件、构建词汇表、统计词汇以及构建词到索引的映射：\n\n```python\n### Open and read text\n\
  text_file = open('TorchGlove/short_story.txt', 'r')\ntext = text_file.read().lower()\n\
  text_file.close()\n\n### Create vocabulary and word lists\nword_list = word_tokenize(text)\n\
  vocab = np.unique(word_list)\nw_list_size = len(word_list)\nvocab_size = len(vocab)\n\
  \n# Create word to index mapping\nw_to_i = {word: ind for ind, word in enumerate(vocab)}\n\
  ```\n\n\n\n\n\n1. 前面讨论的权重函数，有助于处理停用词/出现频繁且可能导致模型构建偏移的词。\n\n2. **权重和偏置初始化**：权重和偏置使用正态分布进行初始化。这些参数会在训练过程中不断变化，并是学习的核心。权重矩阵的大小为\
  \ `embedding_size * vocabulary size`。偏置的大小与词汇表相等。\n\n3. 这里，我们使用 Adam 优化器来训练模型。\n\
  \n```python\n### Weight function\ndef weight_function(x):\n    if x < xmax:\n  \
  \      return (x/xmax)**alpha\n    return 1\n\n### Set up word vectors and biases\n\
  left_embed, right_embed = [[Variable(torch.from_numpy(np.random.normal(0, 0.01,\
  \ (embed_size, 1))),\nrequires_grad = True) for j in range(vocab_size)] for i in\
  \ range(2)]\nleft_biases, right_biases = [[Variable(torch.from_numpy(np.random.normal(0,\
  \ 0.01, 1)),\nrequires_grad = True) for j in range(vocab_size)] for i in range(2)]\n\
  \n### Set up optimizer\noptimizer = optim.Adam(left_embed + right_embed + left_biases\
  \ + right_biases, lr = l_rate)\n```\n\nPyTorch 非常灵活，允许你定义具有不同可训练权重和偏置的自定义架构。如前面的代码所示，你可以将自定义参数添加到优化器中，这样优化器就会将其视为可训练参数并在反向传播图中考虑它们。\n\
  \n* **训练 GloVe 模型**：该函数迭代地从 `gen_batch` 函数获取数据。计算损失并反向传播，以用 Adam 调整权重/偏置。\n\n```python\n\
  ### Train model\nfor epoch in range(num_epochs):\n    num_batches = int(w_list_size/batch_size)\n\
  \    avg_loss = 0.0\n    for batch in range(num_batches):\n        optimizer.zero_grad()\n\
  \        l_vecs, r_vecs, covals, l_v_bias, r_v_bias = gen_batch()\n        loss\
  \ = sum([torch.mul((torch.dot(l_vecs[i].view(-1), r_vecs[i].view(-1)) + l_v_bias[i]\
  \ + r_v_bias[i] - np.log(covals[i]))**2,weight_function(covals[i])) for i in range(batch_size)])\n\
  \        avg_loss += loss.data[0]/num_batches\n        loss.backward()\n       \
  \ optimizer.step()\n    print(“Average loss for epoch “+str(epoch+1)+”: “, avg_loss)\n\
  ```\n\n* **推理**：这里我再次使用 TensorBoard 来视化化 GloVe 生成的稠密向量。\n\n```python\nword_array\
  \ = []\nembed_array = []\nword_inds = np.random.choice(np.arange(len(vocab)), size=100,\
  \ replace=False)\nfor word_ind in word_inds:\n    w_embed = (left_embed[word_ind].data\
  \ + right_embed[word_ind].data).numpy()\n    word_array.append(vocab[word_ind])\n\
  \    embed_array.append(torch.transpose(torch.Tensor(w_embed),0, 1).numpy())\nwriter.add_embedding(np.asarray(embed_array).reshape(-1,50),\
  \ word_array)\nwriter.export_scalars_to_json“./all_scalars.json”)\nwriter.close()\n\
  ```\n\n为了证明我们 GloVe 实现的有效性，我将使用与演示 Word2Vec 有效性相同的语料库。该语料库可以在 `Ch3/data/testdata_en.txt`\
  \ 找到。绘制时，这些向量所示：\n\n![](img/glove_tensorbord.jpg)\n\n**图 3.12：** 使用 GloVe 学习的词向量的\
  \ 2D 投影，显示相似的词聚集在一起。\n\n我选择了一个单词及其所有可能的邻词，如 `doctrine`、`Roundhead`、`civilization`、`working`\
  \ 等，如图上所示。我运行了算法 10 个 epoch 并得到了这些结果；你可以尝试更高的 epoch。\n\n使用 Word2Vec 或 GloVe 制作的词向量需要进行评估。可以通过以下技术对此类向量进行评估：\n\
  \n* **内蕴评估**：使用与训练时相同的数据集对词对进行人工评分。然后将此分数与 GloVe 生成的词向量对之间的余弦相似度分数进行匹配。两个分数之间的差越小，词向量越好。\n\
  \n* **外延评估**：将制作的词向量用于各种任务。在这些任务上衡量词向量的性能，并与之前的、最先进的词嵌入进行比较。执行外延评估会使用多种标准数据集，如 CoLA、SST-2、MRPC、STS-B、QQP、MNLI-m\
  \ 等。总分根据 glue 基准测试 ([https://gluebenchmark.com/]) 计算，并确定嵌入的排名。\n\n请参考以下链接获取更多详情：\n\
  \n* GloVe: 词表示的全局向量：([https://nlp.stanford.edu/projects/glove/])\n\n* 词嵌入评估综述：([https://arxiv.org/pdf/1801.09536.pdf])\n\
  \n* 词嵌入评估方法综述：([https://arxiv.org/abs/1801.09536])\n\n## 理解基于字符的嵌入\n\n到目前，我们已经看到嵌入是使用基于词的特征构建的。基于词的特征虽然优秀，但在许多方面效率并不高。再深入一点可以为我们训练向量提供另一个维度。基于字符的嵌入使用字符\
  \ n-gram 作为特征构建。张相（Xiang Zhang）和 Yann LeCun 实现了基于字符嵌入的潜力。基于字符的嵌入的主要优势如下：\n\n1. 你可以更好地处理表情符号、新词和拼写错误的词。\n\
  2. 基于字符的嵌入在处理稀有词方面更好。Word2Vec 在这方面并不更好。\n3. 在基于字符的嵌入中，它对唯一字符的维度应用 softmax。相反，基于词的嵌入需要对唯一词的维度应用\
  \ softmax。由于字符集总是小于词集，因此基于字符的嵌入计算开销较低。\n4. 即使单词在训练时不存在，也可以形成向量。\n\n学习字符嵌入可以总结为以下步骤：\n\
  \n1. 定义字符列表，包括英文字符、数字字符和特殊字符\n2. 将每个字符表示为独热编码，为未知字符和空格保留空向量。对于定义的单词最大长度取独热编码，如果单词超过最大长度则切掉多余字符，如果较短则填充空白。\n\
  3. 使用三个 1D CNN 层（可配置）来学习序列\n4. 与 Word2Vec 类似，FastText 也可以使用 SkipGram 或 CBOW 方法训练。\n\
  \n字符嵌入是一种极佳的方法，只要单词包含构建模型时考虑的字符，就可以处理未知单词。FastText 是 **Facebook AI Research** (**FAIR**)\
  \ 开发并推向社区的最先进的字符级模型。它更进一步，包含了子词信息，例如 **Facebook** 单词可以包含“F”、“Fa”、“Fac”等作为子词来训练单词。\n\
  \n人们可以使用 CBOW 或 SkipGram 使用 FastText 训练模型。\n\n```python\nimport fasttext\n```\n\n\
  \n\n\n\n```python\nfrom tensorboardX import SummaryWriter\nimport numpy as np\n\
  writer = SummaryWriter()\n\n### Skipgram model\nmodel = fasttext.skipgram‘data/testdata_en.txt’,\
  \ ‘model’)\nwords = model.words # list of words in dictionary\nprint (“words present\
  \ in the model : “, words)\n\n#visualizing using tensorboard\nall_vectors = []\n\
  for eachword in words:\n    all_vectors.append(model[eachword])\nwriter.add_embedding(np.asarray(all_vectors),\
  \ words)\nwriter.export_scalars_to_json(\"./all_scalars.json\")\nwriter.close()\n\
  ```\n\n我应用了 `Ch3/fastetxt_demo.py` 中的代码。首先使用 Fasttext 构建了模型。下面的截图是结果向量的 2D 投影：\n\
