  \n### 实现用于翻译的注意力机制\n\n理解注意力机制非常重要，因为它带来了像“Transformer”这样强大的语言模块。Google 研究团队最近发布的“Brat”模型声称大幅优于之前所有先进的语言模型，也包含了注意力的变体。\n\
  \n![](img/attention.jpg)\n\n**图 4.19：** 《Attention Is All You Need》中描述的注意力机制\n\n\
  这是论文中所示的著名图，但它没有提供实现“注意力”机制所需的细节。这个配方将帮助你理解注意力机制的整个流程和涉及的每一个操作。在本次实现中，我们将使用序列序列（sequence-to-sequence）模型。我们将通过共同学习对齐（Align）和翻译（Translate）来实现神经机器机器翻译论文中描述的注意力机制。该模型与之前的实现在以下方面有所不同：\n\
  \n*   我们将使用 Multi30k 数据集，在比较不同机器翻译模型的性能时，该数据集被视为一个标准数据集。\n*   我们将使用双向 RNN；这是对之前\
  \ RNN 层的一个微小补充。\n*   我们将使用注意力机制来获得更好的翻译。\n\n正如我们在之前的话题中看到的，我们只向解码器提供最后一个解码器隐藏状态（上下文向量），解码器使用这些信息生成目标句子。编码器时间步的输出完全没有被使用。之前的方法可能会遇到以下问题：\n\
  \n*   上下文向量可能无法正确记住整个序列，可能会忘记与早期时间步相关的信息。\n*   每个时间步中带有每个时间步信息的输出向量完全没有被使用。\n\n\
  ### 编码器\n\n在继续之前，我们将理解双向 RNN 层。在之前的实现中为止，我们只使用了 RNN（或单向 RNN），这意味着它在单方向上运行。在这次实现中，我使用了双向\
  \ RNN。这意味着每层都有两个 RNN：一个在序列的正向方向运行，另一个在序列的反向方向运行。双向 RNN 不需要任何额外的代码行；只需要 `bidirection=True`\
  \ 参数。之后，我们可以像在之前的实现中那样传递嵌入的句子。这里是一个例子：\n\n| 德语 | 英语 |\n| --- | --- |\n| `<sos> Mein\
  \ Name ist Sunil und ich bin Datenwissenschaftler. | `<sos> My name is Sunil and\
  \ I am a data scientist. |\n\n**表 4.3**\n\n其中：\n\n*   `<sos>`：序列开始指示符\n*   `</s>`：序列结束指示符\n\
  \n在数学上，双向 RNN 可以表示如下：\n\n![](img/158C4Eq1.jpg)\n\n![](img/158C4Eq2.jpg)\n\n其中 `x[t]`\
  \ 是当前时间步的输入，`x[t]` 是上一个时间步的隐藏状态（注：此处原文变量名重复，通常应为 $h[t-1]$，此处保持原文逻辑）。\n\n修正后的翻译为：对于德语翻译到英语的例子，正向和反向\
  \ RNN 输入所示：\n\n**正向 RNN**：![](img/158C4Eq3.jpg)\n\n**反向 RNN**：![](img/158C4Eq4.jpg)\n\
  \n如下所示，它具有正向和反向单元。\n\n![](img/Bidirectional_lstm.jpg)\n\n**：**：《Attention Is All\
  \ You Need》中描述的注意力机制\n\n为了理解，我展示了一个带有双向单元的 RNN 层。\n\n输入的注意力机制是在正向和反向方向提取的。在每个 $t^{(th)}$\
  \ 时间步处，会生成一个正向输出 ![](img/158C4Eq5.jpg) 和一个反向输出 ![](img/158C4Eq6.jpg)。在最后，正向隐藏状态\
  \ ![](img/158C4Eq7.jpg) 和反向隐藏状态 ![](img/158C4Eq8.jpg) 被生成。分别为 ![](img/158C4Eq9.jpg)，![](img/158C4Eq10.jpg)。\n\
  \n为了保持简单，我们只将嵌入输入传递给 GRU，并将正向状态 ![](img/158C4Eq11.jpg) 和反向状态 ![](img/158C4Eq12.jpg)\
  \ 留在 GRU。最后，来自正向和反向运行的隐藏状态拼接以获得层的上下文向量 `Z`，表示为 ![](img/158C4Eq13.jpg)。\n\n解码器不是双向的，作者只使用了一个隐藏状态。相反，在这里合并了正向和反向隐藏状态并应用了激活：![](img/158C4Eq14.jpg)，其中\
  \ `C` 代表最终上下文向量。\n\n### 注意力机制\n\n注意力层以编码器隐藏和编码器输出作为输出。注意力机制连接了许多操作，但核心思想是结合编码输出\
  \ (`O`) 和内容向量（最终编码隐藏状态）(`C`) 来产生注意力权重。该注意力权重包含了源语言中每个标记所需的权重信息。这种注意力状态表示为了生成下一个目标词应该给予更多的权重。该注意力向量在经过批量矩阵乘法后，与之前生成的解码器标记\
  \ (`O[t–1]`) 相加，并在时间 `t` 生成下一个标记 `O[t]`。\n\n![](img/Attention2.jpg)\n\n**图 4.21：**注意力机制的简化摘要。它包含三个部分：编码器、解码器和注意力机制。\n\
  \n### 解码器\n\n\n\n解码器包含注意力层，解码器函数接收输入、编码器隐藏状态/上下文向量 (`C`) 以及编码器输出。假设我们的批大小（batch\
  \ size）为 4。对于第一个时间步，对应 `<start>` 标记的索引给出 `idx[<start*>]`、`idx[<start*>]`、`idx[<start*>]`、`idx[<start*>]`。这等同于形状\
  \ `[1, 4]`。假设嵌入维度为 10，因此每个索引将由一个 10 维稠密向量表示，应用嵌入后得到的形状将为 `[1, 4, 10]`。在加上注意力权重后，它将作为解码器\
  \ RNN 的输入。\n\n后续将讨论序列到序列模型中后续部分的实现方面，包括：\n\n*   数据集\n*   编码器\n*   注意力机制\n*   解码器\n\
  \n### 数据集\n在之前的迭代中，我们使用的是具有几千个训练样本的法英翻译对。在本次实现中，为了保持预处理部分的简单，我将使用 `multi30k` 数据集。Multi30k\
  \ 是来自 WMT 2016 多模态任务的一个稍大的数据集，也被称为 `Flickr30k`。`multi30k` 提供了 29,000 个训练样本和 1014\
  \ 个测试样本。当前任务与德英翻译有关。注意力模型带有许多参数，在如此小的数据集上训练这样的模型非常困难。由于这个原因，我使用了一个稍大的数据集。在完成实现后，你会发现注意力模型可以生成非常有意义的翻译。\n\
  \n### 编码器\n编码器与我们之前的实现相似，并产生两个输出：\n\n*   每个时间步的输出形状为 `[src sent len, batch size,\
  \ hid dim * num directions]`\n*   拼接后的隐藏状态形状为 `[n layers * num directions, batch\
  \ size, hid dim]`\n\n在代码中，`[-2,:, :]` 给出最后一个时间步后的顶层正向 RNN 隐藏状态（即在看到句子中最后一个词之后），而\
  \ `[-1,:, :]` 给出最后一个时间步后的顶层反向 RNN 隐藏状态（即在看到句子中第一个词之后）。\n\n### 注意力机制\n整体流程如 *图 4.21*所示，可以总结如下：\n\
  \n*   获取编码器输出和编码器隐藏状态。\n*   将编码器隐藏状态重复序列长度次数。\n*   在经过适当排列后将两者拼接。\n*   应用额外的操作（如置换\
  \ permute），并与可学习向量执行批量矩阵乘法 (`BMM**`)。\n*   执行这些操作后，生成的权重被称为 `Attention` 权重。\n* \
  \  注意力权重与编码器进行 BMM。\n\n**输出：** 这些注意力权重随后被交给解码器。\n\n```python\nclass Attention(nn.\
  \ Module):\n    def init(self, enc_hid_dim, dec_hid_dim):\n        super().init()\n\
  \        self.enc_hid_dim = enc_hid_dim\n        self.dec_hid_dim = dec_hid_dim\n\
  \        self.attn = nn.Linear((enc_hid_dim * 2) + dec_hid_dim, dec_hid_dim)\n \
  \       self.v = nn.Parameter(torch.rand(dec_hid_dim))\n\n    def forward(self,\
  \ hidden, encoder_outputs):\n        batch_size = encoder_outputs.shape[1]\n   \
  \     src_len = encoder_outputs.shape[0]\n        hidden = hidden.unsqueeze(1).repeat(1,\
  \ src_len, 1)\n        encoder_outputs = encoder_outputs.permute(1, 0, 2)\n    \
  \    energy = torch.relu(self.attn(torch.cat((hidden, encoder_outputs), dim = 2)))\n\
  \        energy = energy.permute(0, 2, 1)\n        v = self.v.repeat(batch_size,1).unsqueeze(1)\n\
  \        attention = torch.bmm(v, energy).squeeze(1)\n        return F.softmax(attention,\
  \ dim=1)\n```\n\n### 解码器\n解码器执行以下步骤：\n\n*   将注意力权重向量加上解码器中上一个生成的标记的嵌入。如果需要生成第一个标记，则提供标记的所有嵌入作为输入。解码器将输出下一个标记。\n\
  *   根据教师强制（teacher forcing）训练方案，生成的标记将作为下一个时间步的输入。\n\n以下是几个生成的句子和原始句子：\n\n| 序号 |\
  \ 生成 | 原始 |\n| :--- | :--- | :--- |\n| 1 | খেজুর a man wearing a and and tie plays\
  \ a guitar on a sidewalk. | `<SOS>A man wearing a and tie plays guitar on a sidewalk\
  \ |\n| 2 | খেজুর the black dog is running through the water. | `<SOS>The black dog\
  \ is running through the water`.` |\n| 3 | খেজুর a young newlywed couple cuts their\
  \ cake. | `<sos>` a young newlywed couple cuts their wedding cake that their reception.\
  \ |\n\n**表 4.4**\n\n当将具有强大理论背景的注意力机制应用于翻译任务时，质量会有提高。然而，翻译质量达到标准尚需使用像 transformer\
  \ 这样的更好的网络来实现。\n\n\n\n卷积网络传统上用于图像处理，但最近发现，将它们用于文本处理可以帮助我们在许多任务中获得更高的准确率。如今，`CNN`\
  \ 已用于文本分类、语言翻译、问答和嵌入生成。最先进的嵌入生成技术已经内置了 `CNN` 组件。在本章中，我们将学习如何使用 `PyTorch` 使用 `CNN`\
  \ 组件，并查看卷积神经网络中基于文本和基于字符特征的应用。随后，我们将看到如何突破 30 层限制，并利用此类网络进行文本分类。最后，本章将介绍训练具有超过十层堆叠的更深网络的几种方法。本食谱将涵盖在\
  \ `ResNet`、`Highway networks` 和 `DenseNet` 中为了达到更深层次而使用的特殊技巧。\n\n## 结构\n\n在本章中，我们将涵盖以下食谱：\n\
  \n* 理解 `CNN`\n* 使用词级 `CNN`\n* 使用字符级 `CNN`\n* 训练更深层的网络\n\n## 目标\n\n* 理解卷积操作，理解卷积核大小和步长宽度对最终预测的影响\n\
  * 实现 `CNN` 并测试其在未知示例上的泛化能力\n* 理解并应用如`batch normalization` 等高级函数\n* 理解词卷积、字符卷积和分组卷积，以及此类网络具有高效率背后的原因\n\
  \n本章主要关注将卷积应用于应用于。\n\n### 前提条件\n\n本章的代码可以在 GitHub 仓库的 `Ch5` 文件夹中找到（[`github.com/bpbpublications/Getting-started-with-Deep-Learning-for-Natural-Language-Processing`](https://github.com/bpbpublications/Getting-started-with-Deep-Learning-for-Natural-Language-Processing)）。本章需要以下包来执行代码：\n\
  \n* Pandas\n* Matplotlib\n* Torch\n* Numpy\n* Scikit learn\n* Numpy\n* Nltk\n* Spacy\n\
  * TensorboardX\n* Tensorflow\n\n你可以通过简单执行 `pip install -r Ch5/requirements.txt`\
  \ 来安装 `requirements.txt` 中列出的所有包以安装这些需求。本章使用 `Ipython Notebook/Jupyter Notebook`\
  \ 以于执行并将思路与实现相结合。\n\n## 理解 CNN\n\n卷积神经网络俗称为 `CNN`。`Convolve` 是一种数学运算，卷积操作的概念并不新鲜。`Yann\
  \ LeCun` 将卷积操作应用于图像的方法是一种新颖的方法，Yann LeCun 使用 `LeNet5` 架构将 `CNN` 应用于 `MNIST` 数据集。在分类手写数字方面取得成功后，Yann\
  \ LeCun 积极将这种架构推向研究社区。\n\n卷积是一种数学函数，其中形状 `A` 和形状 `B` 相互作用形成形状 `C`，这是 `A` 的修改。卷积神经网络与前馈网络非常相似，因为它们都是由具有学习权重和偏置的神经元组成的。`CNN`\
  \ 可以像用于 `RNN` 和 `FFN` 一样使用 `optimizer` 和 `loss function` 进行训练。在前馈网络（`FFN`）中，1 维向量通过一系列层，每层都有多个感知器。同一层中的感知器之间互不相互作用，并与周围层独立工作。这些感知器中的每一个与前一层和下一层的感知器全连接。\n\
  \n卷积神经网络接受像图像之类的 3D 输入，具有高度、宽度和多个通道（RGB）。`CNN` 通过共享同一层内的权重来运行，因此它可以能更好地处理图像。我们将详细查看\
  \ `CNN` 如何共享权重。在 `CIFAR-10` 中，图像大小仅为 32x32x3，如果通过全连接网络处理，输入大小将是 3072。虽然这是可以的，但 200\
  \ x 200 x 3 的图像大小意味着有 120,000 个特征。处理大小为 `[120, 000, m]` 的权重并不是容易的任务，其中 `m` 是连接到输入的第一个隐藏层的大小。以下是普通神经网络和\
  \ `CNN` 的插图：\n\n![](img/feed_forward_and_dropout.jpg)\n\n**图 5.1:**`FFN` 与 `CNN`\
  \ 之间的相似性\n\n它们具有相似的性质；`FFN` 接受 1D 输入，而 `CNN` 接受 3D 输入。\n\n## 理解卷积操作\n\n卷积一词源于单词\
  \ `convolve`，这是一种数学运算。`CNN` 由许多类型的层组成，包括卷积层、池化层、全连接层和如 `Relu` 等激活层。\n\n### 卷积层\n\
  \n卷积层具有称为 `filters` 的可学习参数。过滤器具有较小的感受野，但贯穿输入卷的整个深度。在前向传播过程中，过滤器在输入卷的宽度高度上移动，并在输入形状的元素与过滤器的元素之间计算点积。这些过滤器是可学习的，因此网络学习检测本质特征。当检测到特定模式时会激活此类过滤器。以下是输入形状和过滤器的结果：\n\
  \n![](img/convolution1.jpg)\n\n**图 5.2:** 通过取形状和过滤器来解释卷积操作\n\n2D 输入大小为 66。大小为 3x3\
  \ 的 2D 过滤器在输入上进行卷积。下方显示了不同步长值的过滤器位置。过滤器通过每次跳一个单元格对输入进行卷积（步长）。\n\n可以使用以下公式计算输出形状：\n\
  \n```\n```\n![](img/158C51.jpg)\n```\n\n在此公式 `W` = 输入大小，`F` = 过滤器大小，`P` = 填充，`S`\
  \ = 步长。对于所取示例，参数 `W` = 6, `F` = 3, `P` = 0 且 `S` = 1，结果形状为 4：\n\n```\n```\n![](img/158C52.jpg)\n\
  ```\n\n让我们讨论影响卷积操作输出的一些超参数。\n\n### 填充\n\n填充应用于卷积神经网络以控制输出形状。如果对先前的示例应用等于 1 的填充，输入卷如下：\n\
  \n输出形状将变为 6 – 3 + 2*1/1 + 1 = 6。因此，如果对输入形状应用等于 1 的填充，输出形状将相同。\n\n### 步长\n\n步长控制过滤器在输入形状上滑动时跳跃的像素数。如果\
  \ `stride = 1`，我们每次移动一个像素。大于 3 的步长在图像示例中是不常见的。如果选择高于 3 的步长，过滤器每次跳跃 3 个像素，导致信息丢失。之前我们看到，对于输入形状为\
  \ 6、过滤器大小 = 3、填充 = 0 且步长 = 1，输出形状为 4。让我们看看如果应用 `stride = 2` 会发生什么：\n\n```\n```\n\
  ![](img/158C53.jpg)\n```\n\n结果形状将为 2.5，这是不可能可能的，因此步长不能是任何值；它必须在形状计算后应用。\n\n\n\n\n\
  池化层是卷积神经网络不可或缺的一部分。池化层对输入形状进行下采样操作。池化操作有两个输入：卷积核尺寸（kernel size）和步长（stride）。卷积核决定了应用池化的区域形状，步长决定了卷积核每次滑动的像素数。通常应用有两种池化操作：`max\
  \ pool` 最大池化和 `average pool` 平均池化。最大池化化是取池化滤波器中的最大元素，而平均池化是取池化滤波器中所有元素的平均值。可选地，可以在应用池化操作之前对输入形状进行填充（padding）。\n\
  \n![](img/max_avg_pool.jpg)\n\n**图 5.3：** 最大池化和平均池化的展示。\n\n### 全连接层\n\n应用卷积和池化操作的主要目的是集中信息。在达到足够的卷积和池化深度后，应用全连接层将图像分类为所需的类别。`VGG`\
  \ 网络包含了所有这些层。`Visual Geometry group` 视觉几何组在`牛津大学`开发了该网络。这里将简要介绍该理论，随着后续学习，我们将理解如何使用\
  \ `PyTorch` 实现卷积层。卷积层：`PyTorch` 为 1D、2D 和 3D 输入分别提供了单独卷积层。\n\n### 1D 卷积\n\n在这里，`torch.nn.Conv1d`\
  \ 接收 16 个通道并输出 33 个通道。卷积核尺寸为 3，步长为 2。当输入一个大小为 20 的 batch（每个样本具有 16 个通道和 50 个特征）时，结果的形状为\
  \ [20, 33, 24]。输出形状比输入形状略小一些：\n\n```\nm = torch.nn.Conv1d(in_channels=16, out_channels=33,\
  \ kernel_size=3, stride=2)\ninput = torch.randn(20, 16, 50)\noutput = m(input).shape\n\
  >>>torch.Size([20, 33, 24])\n```\n\n1D 卷积通常用于文本处理。在这里，输入可以是大小为 20 的 batch 中的句子，每个句子最多有\
  \ 16 个单词，并用 50 维稠密向量描述每个单词。结果向量 `[20, 16, 50]` 可以作为 `Conv1` 的输入。\n\n### 2D 卷积\n\n\
  2D 卷积通常用于图像。在这里，`torch.nn`.`Conv2d` 函数定义了 `in_channels=16`、`out_channels=33`、`kernel_size=3`\
  \ 和 `stride=2`。类似 3D 形状的图像以大小为 20 的 batch 输入，每张大小为 50*50 的图像有 3 个通道（RGB）：\n\n```\n\
  m = torch.nn.Conv2d(in_channels=3, out_channels=33, kernel_size=3, stride=2)\ninput\
  \ = torch.randn(20, 3, 50, 50)\noutput = m(input)\n>>>torch.Size([20, 33, 24, 24])\n\
  ```\n\n2D 卷积操作也用于文本。同样，假设对于某个特定问题，每个句子最多有 50 个单词，每个单词最多有十个字符，每个单词可以有 64 个唯一字符。结果形状为\
  \ `[50, 10, 64]`；如果以大小为 32 的 batch 处理此类输入，则结果形状 `[32, 50, 10, 64]` 可以作为 `Conv2D`\
  \ 的输入。\n\n### 池化层\n\n与卷积层类似，`PyTorch` 拥有 1D、2D 和 3D 池化层。`PyTorch` 池化将卷积核尺寸作为所需参数，以及步长和填充等操作参数：\n\
  \n```\nm = torch.nn.MaxPool1d(3, stride=2)\ninput = torch.randn(20, 16, 50)\noutput\
  \ = m(input)\ntorch.Size([20, 16, 24])\n```\n\n同样，还应用了 2D 和 3D 池化。`PyTorch` 拥有 `AvgPool1d`、`AvgPool2d`\
  \ 和 `AvgPool3d` 函数支持平均池化。\n\n### 线性整单元 (Relu)\n\nReLU 是一种新发明的激活函数，能够以更快的收敛速度产生最先进的结果。`Relu`\
  \ 函数可以如下给出。它非常简单，只允许正值。梯度计算非常简单，因为没有必须求导的指数或除法操作。这种简单的操作本质上加速了计算。\n\n阅读**用于大规模图像识别的极深卷积网络**的架构，并尝试使用\
  \ `PyTorch` 对其进行编码。我们已经看到了 1D 和 2D CNN 的使用场景，但 3D CNN 呢？尝试找出 3D CNN 的使用用例。为了磨炼你的\
  \ CNN 实现技能，我们将在接下来的章节中通过几个案例来讨论 2D 和 1D CNN 的一些有趣应用。\n\n你可以查看以下参考文献：\n\n*   基于梯度的学习应用于文档识别：`[`yann.lecun.com/exdb/publis/pdf/lecun-01a.pdf`](http://yann.lecun.com/exdb/publis/pdf/lecun-01a.pdf)`\n\
  *   使用**线性整流单元** (**ReLU**) 进行深度学习\n\n\n\n\n## 2. 使用 `TorchText` 读取数据并应用分词、填充和词表生成等各种预处理操作\n\
  \n## 3. 定义数据字段 (data fields)\n\n## 4. 生成词表\n\n## 5. 创建训练和测试数据迭代器\n\n### 定义数据字段\n\
  \n```python\nREVIEW = data.Field(sequential=True, preprocessing = pad_to_equal,\
  \ use_vocab = True, lower=True,batch_first=True)\nLABEL = data.Field(is_target=True,use_vocab\
  \ = False, sequential=False, preprocessing =to_categorical)\nfields = {‘review’:\
  \ (‘review’, REVIEW), ‘label’: (‘label’, LABEL)}\n```\n\n### 构建表格数据集\n```python\n\
  train_data, test_data = data.TabularDataset.splits(\npath = ‘’,\ntrain = ‘train.json’,\n\
  test = ‘test.json’,\nformat = ‘json’,\nfields = fields)\n```\n\n### 构建词表\n```python\n\
  REVIEW.build_vocab(train_data, test_data)\nLABEL.build_vocab(train_data, test_data)\n\
  ```\n\n### 创建迭代器\n```python\ntrain_iter, test_iter = data.Iterator.splits(\n(train_data,\
  \ test_data), sort_key=lambda x: len(x.review),\nbatch_sizes=(16,len(test_data)),\
  \ device=device,)\n```\n\n## 嵌入 (Embedding)\n\n在此实验中，我们将使用在 `Wikipedia+Gigaword\
  \ 5 (6B)` 数据集上训练的 100 维 GloVe 向量。我们将使用 `chakin` 下载 GloVe 向量，并使用以下代码将训练和测试划分的词表映射到\
  \ GloVe 向量。我们将在本章再次使用此快捷方法：\n\n```python\nvec = vocab.Vectors(name = “glove.6B.100d.txt”,cache\
  \ = “./”)\nREVIEW.build_vocab(train_data, test_data, max_size=100000, vectors=vec)\n\
  ```\n\n## 词向量映射\n\n```python\nreview_vocab = review.vocab\n```\n\n然后，通过将权重直接直接传递给\
  \ PyTorch 嵌入层，将映射传递给网络的嵌入层。通过将 `autograd` 设置为 false，我们将该层设为不可训练：\n\n```python\n\
  self.embedding = nn.Embedding(embed_num, 100)\nself.embedding.weight.data.copy_(review_vocab.vectors)\n\
  self.embedding.weight.requires_grad = False\n```\n\n## 卷积层 (Convolution Layers)\n\
  \n上一层为每个句子生成的嵌入被传递到下面的卷积层。通常，在进行情感分析时，整个评论会被传递到具有不同卷积核尺寸 [2, 3, 4] 的 `Conv2D` 中，表示如下：\n\
  \n```python\nself.conv13 = nn.Conv2d(in_channels = 1, out_channels=8, kernel_size=\
  \ 3,stride= 100)\nself.conv14 = nn.Conv2d(in_channels = 1, out_channels=8, kernel_size=\
  \ 4,stride= 100)\nself.conv15 = nn.Conv2d(in_channels = 1, out_channels=8, kernel_size=\
  \ 5,stride= 100)\n```\n\n`conv2D` 层的输出被传递到 `maxpoll1D` 层，所有生成的特征按如下方式拼接：\n\n```python\n\
  x1 = self.conv_and_pool(x,self.conv13)\nx2 = self.conv_and_pool(x,self.conv14)\n\
  x3 = self.conv_and_pool(x,self.conv15)\nx = torch.cat((x1, x2, x3), 1)\n```\n\n\
  最后，使用全连接层配合 dropout 和 `ReLu` 将特征压缩为等于最终类别的输出：\n\n```python\nx = self.dropout(x)\
  \ # (N, len(Ks)*Co)\nlogit = F.relu(self.fc1(x)) # (N, C)\nlogit = torch.softmax(logit,\
  \ dim=1)\n```\n\n当我将上述实现方法应用于 IMDB 情感分析数据集时，它在训练数据上的准确率超过 95%，在测试数据上的准确率达到 75%。你可以查看代码并与原始研究论文进行对比。训练过程中的损失和准确率进展所示：\n\
  \n![](img/Using_Word_Level_CNN_for_Text_Classsification_result.jpg)\n\n**图 5.5：**\
  \ 迭代训练进度。\n\n之前讨论的所有代码可以在 Ipython notebook 中找到，路径为 `Ch5/using_word_level_cnn_for_text_classsification.ipynb`。\n\
  \n之前的研究论文包含了先进的技术，改进了 7 项任务中的 4 项，包括情感分析和问答。为了更好地理解，你可以在网络中尝试以下变体：\n\n*   从零开始训练嵌入\n\
  *   使用预训练嵌入并尝试保持嵌入可训练（通过在实现中添加 `self.embedding.weight.requires_grad = True`）\n\n\
  你可以参考以下链接：\n\n*   从零开始自然语言处理：http://www.jmlr.org/\n*   使用预训练嵌入并尝试保持嵌入可训练：http://www.jmlr.org/\n\
  \n### 使用字符 CNN (Character CNN)\n\n之前我们探索了如何使用词级特征。现在我们将探索字符级特征。这种方法对于处理词外词和形态丰富的语言特别有用。\n\
  \n该模块的字符表示包含如下字符：**abcdefuvwxyz0123456789, ; .?::”/|\\@#$%^&*~+-()[]{}** 所有其他字符都被忽略。句子或文档的最大长度是固定的。在论文中，最大字符长度固定为\
  \ 104。考虑到我们数据集的大小，我们的情况下最大字符长度固定为 300。\n\n以下架构说明了字符级 CNN：\n\n![](img/character_cnn.jpg)\n\
  \n**图 5.6：** 模型图。\n\n每个卷积层后面都有一个最大池化操作。以下代码显示：\n\n```python\nconv1 = nn.Conv2d(in_channels=1,\
  \ out_channels=64, kernel_size=3, padding=1)\npool1 = nn.MaxPool2d(kernel_size=2)\n\
  conv2 = nn.Conv2d(in_channels=64, out_channels=128, kernel_size=3, padding=1)\n\
  pool2 = nn.MaxPool2d(kernel_size=2)\n```\n\n字符 CNN 的输出随后传递给全连接层：\n\n```python\n\
  fc = nn.Linear(128 * 75 * 75, 128)\noutput = F.relu(fc(x))\n```\n\n\n\n\n在卷积块之后，网络有三个全连接层，每层都带有\
  \ `Relu` 激活函数，并在每个全连接层之后应用了 dropout。模型使用随机梯度下降法进行训练，学习率每三个 epoch（训练轮）减半。\n\n# 理解字符表示\
  \ (#toc.xhtml#s134a)\n\n为了演示基于字符的文本分类，我们将使用 `AgNews` 数据集进行监督学习任务。`AGNews` 是从 2000\
  \ 多个新闻源收集的超过 100 万篇新闻文章的集合。Ag News 语料库可以 [`www.di.unipi.it/~gulli/AG_corpus_of_news_articles.html`](https://www.di.unipi.it/~gulli/AG_corpus_of_news_articles.html)\
  \ 下载。下载此语料库后，可能需要从 XML 格式中提取数据。为了避免这些额外的步骤，请检查 `Ch5/data` 文件夹中更干净的 `ag news` 数据集。该数据集分为训练集和测试集，分别称为\
  \ `Ch5/data/ag_news.test` 和 `Ch5/data/ag_news`。训练数据以可用的格式保留。\n\n字符表示：代码段生成字符表示。它有两个主要函数。第一个是\
  \ `init`，它包含了词表集并定义了各种限制，如数据长度、唯一标签和文本中的唯一字符。第二个函数是 `getitem`，它构建基于字符的特征矩阵：\n\n\
  ```python\nclass MyDataset(Dataset):\n    \"\"\"\n    从文本准备 2D 字符数组\n    \"\"\"\n\
  \    def __init__(self, data_path, config):\n        \"\"\"\n        定义字符集\n   \
  \     \"\"\"\n        self.config = config\n        self.vocabulary = list(\"abcdefghijklmnopqrstuvwxyz0123456789,;.!?:':”/\\\
  \\|_@#$%^&*~’+-=()[]{}\")\n        self.identity_mat = np.identity(len(self.vocabulary))\n\
  \        data = get_pandas_df(data_path)\n        self.texts = list(data.text)\n\
  \        self.labels = list(data.label)\n        self.length = len(self.labels)\n\
  \n    def __len__(self):\n        return self.length\n\n    def __getitem__(self,\
  \ index):\n        raw_text = self.texts[index]\n        data = np.array([self.identity_mat[self.vocabulary.index(i)]\
  \ for i in list(raw_text) if i in self.vocabulary],\n            dtype=np.float32)\n\
  \        if len(data) > self.config.max_len:\n            data = data[:self.config.max_len]\n\
  \        elif 0 < len(data) < self.config.max_len:\n            data = np.concatenate(\n\
  \                (data, np.zeros((self.config.max_len - len(data), len(self.vocabulary)),\
  \ dtype=np.float32)))\n        elif len(data) == 0:\n            data = np.zeros((self.config.max_len,\
  \ len(self.vocabulary)), dtype=np.float32)\n        label = self.labels[index]\n\
  \        return data, label\n```\n\n具有 64 个唯一字符且句子/文档最大长度为 300 的字符特征矩阵所示如图。在矩阵中，特定字符及其在句子/文档中的索引位置标记为\
  \ 1，否则所有索引保持为 0：\n\n![](img/character_represenation.jpg)\n\n**图 5.7：** 字符如何作为特征给出。X\
  \ 是字符在句子中的位置，y 是字符作为独热编码（one hot encoding）的位置。\n\n从图像可以看出，我们将句子的最大长度设定为 300。每个字符可以是\
  \ 64 种预定义字符类型之一。如果字符出现在句子中指定的索引处，则该字符的位置标记为 1，其他所有位置保持为 0。在图中，字符在任何特定位置的存在用黄色 (1)\
  \ 表示。\n\n# 网络架构 (#toc.xhtml#s135a)\n\n如前所述，该网络有 6 个卷积层，每层都使用 `nn.Sequential` 模块构建。最后一个卷积层之后、任何全连接层之前的输出帧长度为。此数字乘以第\
  \ 6 层的帧大小，产生了与第一个全连接层接收的兼容的输入维度。卷积层之后，有三个全连接层，最终收敛到若干类中：\n\n```python\nclass CharCNN(nn.Module):\n\
  \    def __init__(self, config):\n        super(CharCNN, self).__init__()\n    \
  \    self.config = config\n        conv1 = nn.Sequential(\n            nn.Conv1d(in_channels=self.config.vocab_size,\
  \ out_channels=self.config.num_channels, kernel_size=7), nn.ReLU(), nn.MaxPool1d(kernel_size=3))\n\
  \        # 类似的六卷积块 conv1, conv2, conv3, conv4, conv5, conv6\n        conv_output_size\
  \ = self.config.num_channels * ((self.config.max_len - 96) // 27)\n        linear1\
  \ = nn.Sequential(\n            nn.Linear(conv_output_size, self.config.linear_size),\n\
  \            .ReLU(),\n            nn.Dropout(self.config.dropout))\n        # 类似的六卷积块\
  \ conv1, conv2, conv3, conv4, conv5, conv6\n        self.convolutional_layers =\
  \ nn.Sequential(conv1,conv2,conv3,conv4,conv5,conv6)\n        self.linear_layers\
  \ = nn.Sequential(linear1,linear2,linear3)\n\n    def forward(self, embedded_sent):\n\
  \        _sent = embedded_sent.transpose(1,2) # shape=(batch_size,embed_size,max_len)\n\
  \        conv_out = self.convolutional_layers(embedded_sent)\n        conv_out =\
  \ conv_out.view(conv_out.shape[0], -1)\n        linear_output = self.linear_layers(conv_out)\n\
  \        return linear_output\n\n    def reduce_lr(self):\n        for g in self.optimizer.param_groups:\n\
  \            g['lr'] = g['lr'] / 2\n            print(\"Reducing Learning Rate to\
  \ \", g['lr'])\n```\n\n\n\n\n深卷积网络深度可达 49 层，在文本分类任务中，通过将深度增加到 29 层卷积层，可以实现最先进的配置。该模型用于文本分类，我们特别在这个食谱中选择了这个模型。选择该模型有更充分的理由——它是被组织成块（blocks）的；每个块都会重复，并且块之间有一个可选的快捷连接（shortcut\
  \ connection）。该模型将让你理解现代网络如何通过修改传统架构来变得更深。在下一个食谱中，我们将更进一步，理解网络中能够支持超过 100 层训练的各种类型变化。整个网络结构如图所示：\n\
  \n![](img/deep_conv_model.jpg)\n\n**图 5.9：** 由 Alexis Conneau 及其设计的用于文本分类的极深卷积网络架构。\n\
  \n该模型以字符编码作为输入。假设我们的集合中有 1024 个唯一字符，并且考虑的最大句子长度为 64；那么，模型的输入将是 `[batch_size, 64,\
  \ 1024]`。然后通过对输入应用嵌入（embedding），该形状被转换为 `[batch_size, 1024, 16]`。嵌入在前面的图中显示为查找操作（lookup\
  \ operation）。一个卷积大小为 3 的 1D 卷积应用于嵌入层生成的输出，其输入维度为 16，输出维度为 64。1D 卷积的输出传递给卷积块，该卷积块包含以下层：\n\
  \n1. 一个 1D 卷积层\n2. 每个卷积层后紧跟一个批归一化层（batch normalization layer）\n3. 对批归一化层的输出应用 `Relu`\
  \ 激活函数\n4. 上述层重复两次以提供输出\n5. 如果残差标志（residual flag）为 `True`，则将给定此块的输入加到输出上（残差连接）\n\
  \n该卷积块以不同的输入通道和输出通道重复。在整个网络中，块具有 `64`、`128`、`256` 和 `512` 个输入通道和输出通道。根据网络的深度，不同数量会使用不同的块。根据深度，块按照以下模式重复：\n\
  \n| **深度** | **第一层卷积层** | **输入输出通道均为 64 的块** | **输入输出通道均为 128 的块** | **输入输出通道均为\
  \ 256 的块** | **输入输出通道均为 512 的块** |\n| --- | --- | --- | --- | --- | --- |\n| 9 |\
  \ 1 | 0 | 0 | 0 | 0 |\n| 17 | 1 | 1 | 1 | 1 | 1 |\n| 29 | 1 | 4 | 4 | 1 | 1 |\n\
  | 49 | 1 | 7 | 7 | 4 | 2 |\n\n**表 5.3**\n\n在下一节中，我们将学习如何根据应用参数改变深度来设计这样的网络。\n\n\
  ### 批归一化 (Batch normalization)\n这是一种为了加速训练而对数据内部结构进行归一化的技术。极值归一化（Min-max normalization）可以被视为简单的归一化技术，数学上可以给出：\n\
  \n![](img/158C5Eq4.jpg)\n\n它将范围归一化在 0 到 1 之间。同样，批归一化（batch norm）是对隐藏层输出的归一化，数学上可以给出：\n\
  \n输入：跨小批的 `x` 取值：`B = {x[1]…m}`\n\n需要学习的参数 `γ`, `β`\n\n![](img/158C5Eq5.jpg)\n\n\
  **BatchNorm** 具有以下优点：\n\n* **网络训练更快**：随着额外层的添加和反向传播图中额外参数的增加，迭代会变慢。但尽管如此，网络收敛速度会更快。\n\
  * **允许更高的学习率**：SGD 需要小的学习率，但更深的网络在低学习率下面临梯度消失问题，因此使用较低的学习率训练此类网络需要更长时间。批归一化允许以更高的学习率训练网络。\n\
  * **使权重更容易初始化**：对于深层网络，权重初始化是棘棘手的。批归一化使网络对初始权重不敏感，提供了更好的收敛性。\n* **使激活函数更可行**：Sigmoid\
  \ 会迅速丢失梯度，而 `ReLu` 在深层网络中会死亡。由于归一化后的输入在通过批归一化后才给激活函数，它解决了激活函数死亡的问题。\n* **简化了更深网络的创建**：如果处理得当，它为更深的网络提供了更快速、更好的训练。\n\
  * **提供了一些正则化**：批归一化也给网络添加了噪声，具有某种正则化效果。\n\n### 卷积块 (The Convolution Block)\n\n卷积块通过\
  \ `ConvBlock` 函数定义。以下网络对于前图所示的每个卷积块通用。`convblock` 函数具有以下层：\n\n* 一个批归一化层\n* 一个 1D\
  \ 卷积层\n* 一个激活函数\n\n这些层重复了两次，并紧跟着残差相加。如果该类 `init` 方法的 `shortcut` 参数为 `True`，则在所有层之后将此块的输入加到输出中。在\
  \ PyTorch 中，批标准化可以这样简单使用：\n\n```python\nbatchnorm1 = nn.BatchNorm1d(n_filters)\n\
  output = batchnorm1(input)\n```\n\n`nn.BatchNorm1d` 用于 1D 输入，同样，`nn.BatchNorm2d`\
  \ 和 `nn.BatchNorm3d` 分别用于此。\n\n```python\nclass ConvBlock(nn.Module):\n    def __init__(self,\
  \ input_dim, n_filters=256, kernel_size=3, padding=1, stride=1, shortcut=False,\
  \ downsampling=None):\n        super(ConvBlock, self).__init__()\n        self.downsampling\
  \ = downsampling\n        self.shortcut = shortcut\n        self.conv1 = nn.Conv1d(input_dim,\
  \ n_filters, kernel_size=kernel_size, padding=padding, stride=stride)\n        self.batchnorm1\
  \ = nn.BatchNorm1d(n_filters)\n        self.relu1 = nn.ReLU()\n        self.conv2\
  \ = nn.Conv1d(n_filters, n_filters, kernel_size=kernel_size, padding=padding, stride=stride)\n\
  \        self.batchnorm2 = nn.BatchNorm1d(n_filters)\n        self.relu2 = nn.ReLU()\n\
  \n    def forward(self, input):\n        residual = input\n        output = self.conv1(input)\n\
  \        output = self.batchnorm1(output)\n        output = self.relu1(output)\n\
  \        output = self.conv2(output)\n        output = self.batchnorm2(output)\n\
  \        if self.shortcut:\n            if self.downsampling is not None:\n    \
  \            residual = self.downsampling(input)\n            output += residual\n\
  \        output = self.relu2(output)\n        return output\n```\n\n### 理解网络 (Understanding\
  \ the Network)\n\n这种网络的构建方式与我们之前的有所不同。为了构建网络，取一个空列表 `layers = []`，并根据指定的深度将所有所需的层添加到其中。例如，如果网络深度为\
  \ 9，则添加输入输出通道均为 `64`、`128`、`256` 和 `512` 的块。随着深度的增加，考虑不同数量的块，并相应地构建网络。这种方法对于变层网络非常好，且架构随参数的选择而变化。最后，将包含所有所需层的列表添加到\
  \ `nn.Sequential(*layers)`。同样，网络末尾的全连接层构建如下：\n\n```python\nclass VDCNN(nn.Module):\n\
  \    def __init__(self, n_classes=2, num_embedding=69, embedding_dim=16, depth=9,\
  \ n_fc_neurons=2048, shortcut=False):\n        super(VDCNN, self).__init__()\n \
  \       layers = []\n        fc_layers = []\n        base_num_features = 64\n  \
  \      self.embed = nn.Embedding(num_embedding, embedding_dim, padding_idx=0, max_norm=None,\
  \ norm_type=2, scale_grad_by_freq=False, sparse=False)\n        layers.append(nn.Conv1d(embedding_dim,\
  \ base_num_features, kernel_size=3, padding=1))\n        if depth == 9:\n      \
  \      num_conv_block = [0, 0, 0, 0]\n        # ... (省略部分代码根据上下文逻辑)\n```\n\n\n\n\
  \n```python\nelif depth == 49:\n    num_conv_block = [7, 7, 4, 2]\n    layers.append(ConvBlock(input_dim=base_num_features,\
  \ n_filters=base_num_features, kernel_size=3, padding=1, shortcut=shortcut))\n \
  \   for _ in range(num_conv_block[0]):\n        layers.append(ConvBlock(input_dim=base_num_features,\
  \ n_filters=base_num_features, kernel_size=3, padding=1, shortcut=shortcut))\n \
  \   layers.append(nn.MaxPool1d(kernel_size=3, stride=2, padding=1))\n    ds = nn.Sequential(nn.Conv1d(base_num_features,\
  \ 2 * base_num_features, kernel_size=1, stride=1, bias=False),\n        nn.BatchNorm1d(2\
  \ * base_num_features))\n    layers.append(\n        ConvBlock(input_dim=base_num_features,\
  \ n_filters=2 * base_num_features, kernel_size=3, padding=1,\n        shortcut=shortcut,\
  \ downsampling=ds))\n    for _ in range(num_conv_block[1]):\n        layers.append(\n\
  \            ConvBlock(input_dim=2 * base_num_features, n_filters=2 * base_num_features,\
  \ kernel_size=3, padding=1,\n            shortcut=shortcut))\n        layers.append(nn.MaxPool1d(kernel_size=3,\
  \ stride=2, padding=1))\n    ds = nn.Sequential(nn.Conv1d(2 * base_num_features,\
  \ 4 * base_num_features, kernel_size=1, stride=1, bias=False),\n        nn.BatchNorm1d(4\
  \ * base_num_features))\n    layers.append(\n        ConvBlock(input_dim=2 * base_num_features,\
  \ n_filters=4 * base_num_features, kernel_size=3, padding=1,\n        shortcut=shortcut,\
  \ downsampling=ds))\n    for _ in range(num_conv_block[2]):\n        layers.append(\n\
  \            ConvBlock(input_dim=4 * base_num_features, n_filters=4 * base_num_features,\
  \ kernel_size=3, padding=1,\n            shortcut=shortcut))\n        layers.append(nn.MaxPool1d(kernel_size=3,\
  \ stride=2, padding=1))\n    ds = nn.Sequential(nn.Conv1d(4 * base_num_features,\
  \ 8 * base_num_features, kernel_size=1, stride=1, bias=False),\n        nn.BatchNorm1d(8\
  \ * base_num_features))\n    layers.append(\n        ConvBlock(input_dim=4 * base_num_features,\
  \ n_filters=8 * base_num_features, kernel_size=3, padding=1,\n        shortcut=shortcut,\
  \ downsampling=ds))\n    for _ in range(num_conv_block[3]):\n        layers.append(\n\
  \            ConvBlock(input_dim=8 * base_num_features, n_filters=8 * base_num_features,\
  \ kernel_size=3, padding=1,\n            shortcut=shortcut))\n        layers.append(nn.AdaptiveMaxPool1d(8))\n\
  \    fc_layers.extend([nn.Linear(8 * 8 * base_num_features, n_fc_neurons), nn.ReLU()])\n\
  \    fc_layers.extend([nn.Linear(n_fc_neurons, int(n_fc_neurons/2)), nn.ReLU()])\n\
  \    fc_layers.extend([nn.Linear(int(n_fc_neurons/2), n_classes)])\n    self.layers\
  \ = nn.Sequential(*layers)\n    self.fc_layers = nn.Sequential(*fc_layers)\n   \
  \ self.__init_weights()\n\n    def __init_weights(self):\n        for m in self.modules():\n\
  \            if isinstance(m, nn.Conv1d):\n                kaiming_normal_(m.weight,\
  \ mode='fan_in', nonlinearity='relu')\n\n    def forward(self, input):\n       \
  \ output = self.embed(input)\n        output = output.transpose(1, 2)\n        output\
  \ = self.layers(output)\n        output = output.view(output.size(0), -1)\n    \
  \    output = self.fc_layers(output)\n        torch.softmax(output, dim=1)\n   \
  \     return output\n```\n\n我在 IMDB 电影评论数据集上使用了具有九层结构的网络。IMDB 电影评论数据集（或称为 Large\
  \ Movie Review Dataset）包含 25,000 条带有二分类标签的电影评论。DeepConv 在该数据集上取得了惊人的结果。在训练集上，它已经实现了\
  \ 99% 的准确率，在测试集上达到了 80% 的准确率。准确率/损失随 epoch 变化的图所示：\n\n![](img/deep_conv.jpg)\n\n\
  **图 5.10:** 在 IMDB 电影评论数据上训练深卷积网络时，随着 epoch 的增加，训练和测试准确率提高，训练损失降低。\n\n文本分类的 `deepConv`\
  \ 实现位于 `Ch5/deeperconv.ipynb`。\n\n该网络的结构允许修改以获得更好的收敛。你可以尝试不同的深度，观察哪种深度的结果最高。\n\n\
  - 比较不同的深度，观察哪种深度的结果最高。\n- 比较不同的深度，观察哪种深度的结果最高。\n- 比较不同的深度，观察哪种深度的结果最高。\n\n- 比较不同的深度，观察哪种深度的结果最高。\n\
  - 比较不同的深度，观察哪种深度的结果最高。\n- 比较不同的深度，观察哪种深度的结果最高。\n\n\n\n\n现在，我们为前面的函数引入两个门：变换门 `T(*x*,\
  \ W[T]*)` 和携带门 `C(*x*, W[C]*)`。所得方程可以定义为：\n\n`y = H(*x*, W[H]*) · T(*x*, W[T]*)\
  \ + x · C(*x*, W[C]*)`。\n\n为了简单起见，本文取了一个假设—— `C = 1–T`。最后，高速公路网络中的层定义如下：\n\n`y =\
  \ H(*x*, W[H]*) • T(*x*, W[T]*) + x • (1 – T(*x*, W[t]*))`\n\n### DenseNet\n\n密集层将高速公路网络的思想向前推进了一步。高速公路网络指出，从上一层到下一层的跳跃连接可以提高性能。在\
  \ DenseNet 中，层通过跳跃连接连接到其之前的所有层。这样，信息在反向传播过程中总有一条直接返回的路径。在这里，在密集网络中，`l^{th}` 层从其所有之前的层接收直接输入\
  \ `x[l]`…..`x[l][-1]`。在这里，`[x[0], x[1], ….., x[l][-1]]` 指的是第 0, …, `l`–1 层产生的特征图的拼接。由于这种密集的连接性，该网络被称为\
  \ DenseNet。\n\n我们看到了三种采用相似方法来促进深层架构的网络。现在，我们将使用 PyTorch 探索这些网络的最小实现。为了简单起见，我们将为每个网络实现一个块。\n\
  \n# ResNet 的基础块\n\nResNet 有两个主要函数来构建工作的 ResNet 模型。一个函数命名为 `ResidualBlock`，它构建了一个包含\
  \ 3*3 卷积层的块，并带有批归一化和作为激活函数的 Relu。其示意代码函数所示：\n\n```python\nclass ResidualBlock(nn.Module):\n\
  \    def __init__(self, in_channels, out_channels, stride=1, downsample=None):\n\
  \        super(ResidualBlock, self).__init__()\n        self.conv1 = nn.Conv2d(in_channels,\
  \ out_channels, kernel_size=3, stride=stride, padding=1, bias=False)\n        self.bn1\
  \ = nn.BatchNorm2d(out_channels)\n        self.relu = nn.ReLU(inplace=True)\n  \
  \      self.conv2 = nn.Conv2d(in_channels, out_channels, kernel_size=3, stride=stride,\
  \ padding=1, bias=False)\n        self.bn2 = nn.BatchNorm2d(out_channels)\n    \
  \    self.downsample = downsample\n\n    def forward(self, x):\n        residual\
  \ = x\n        out = self.conv1(x)\n        out = self.bn1(out)\n        out = self.relu(out)\n\
  \        out = self.conv2(out)\n        out = self.bn2(out)\n        if self.downsample:\n\
  \            residual = self.downsample(x)\n        out += residual\n        out\
  \ = self.relu(out)\n        return out\n```\n\n另一个函数是 `ResNet`，它接收 `ResidualBlock`\
  \ 块并将它们连接成一个网络，所示。`ResNet` 有一个 `make_layer` 定义，它接收这些层并将它们堆叠在一起形成残差连接：\n\n```python\n\
  class ResNet(nn.Module):\n    def __init__(self, block, layers, num_classes=10):\n\
  \        super(ResNet, self).__init__()\n        self.in_channels = 16\n       \
  \ self.conv = nn.Conv2d(in_channels, out_channels, kernel_size=3, stride=stride,\
  \ padding=1, bias=False)\n        self.bn = nn.BatchNorm2d(16)\n        self.relu\
  \ = nn.ReLU(inplace=True)\n        self.layer1 = self.make_layer(block, 16, layers[0])\n\
  \        self.layer2 = self.make_layer(block, 32, layers[1], 2)\n        self.layer3\
  \ = self.make_layer(block, 64, layers[2], 2)\n        self.avg_pool = nn.AvgPool2d(8)\n\
  \        self.fc = nn.Linear(64, num_classes)\n\n    def make_layer(self, block,\
  \ out_channels, blocks, stride=1):\n        downsample = None\n        if (stride\
  \ != 1) or (self.in_channels != out_channels):\n            downsample = nn.Sequential(conv3x3(self.in_channels,\
  \ out_channels, stride=stride),nn.BatchNorm2d(out_channels))\n        layers = []\n\
  \        layers.append(block(self.in_channels, out_channels, stride, downsample))\n\
  \        self.in_channels = out_channels\n        for i in range(1, blocks):\n \
  \           layers.append(block(out_channels, out_channels))\n        return nn.Sequential(*layers)\n\
  \n    def forward(self, x):\n        out = self.conv(x)\n        out = self.bn(out)\n\
  \        out = self.relu(out)\n        out = self.layer1(out)\n        out = self.layer2(out)\n\
  \        out = self.layer3(out)\n        out = self.avg_pool(out)\n        out =\
  \ self.fc(out)\n        return out\n```\n\n\n\n\n本章将帮助我们把之前所学的知识应用于各种 NLP 任务。在这里，我们将涵盖情感分析、主题建模、文本生成器、命名实体识别、语言转译和文本摘要等主题。对于每个主题，都部署了包含\
  \ CNN 和 LSTM 组件的各种高级模型。我们还将理解如何达到先进（state-of-the-art）的结果。\n\n## 结构\n\n本章将涵盖以下方案：\n\
  \n* 简介\n* 理解 transformer\n* 将句子转换为向量\n* 了解上下文向量\n* 训练监督嵌入\n* 理解和使用 BERT\n\n## 目标\n\
  \n* 讨论更近的进展，如 transformer、基于字符的上下文嵌入 ELMo，以及 SkipThought 和 InferSent 等句子向量化技术。\n\
  * 编写每个模型的代码片段。\n* 构建一个我们下一章中讨论的复杂模型。\n\n### 前提条件\n\n本章的代码可以在 GitHub 仓库的 `Ch6` 文件夹中找到（[`github.com/bpbpublications/Getting-started-with-Deep-Learning-for-Natural-Language-Processing`](https://github.com/bpbpublications/Getting-started-with-Deep-Learning-for-Natural-Language-Processing)）。为了理解本章，你必须对以下\
