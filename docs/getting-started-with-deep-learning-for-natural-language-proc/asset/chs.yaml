  \n\n\n\n让我们简要回顾这些基础组件：\n\n*   `TorchText.data`:数据子包提供了灵活的方法来定义预处理流水线，如批处理（batching）、填充（padding）和数据集数值化。此外，数据包还包含其他功能，如数据集划分、分词器（tokenizer）、随机池化（random\
  \ pooling）等。\n*   `TorchText.datasets`:数据集子包包含了一些标准数据集，用于情感分析、问题分类、蕴含关系、语言模型、机器翻译、序列标记和问答等任务。通过对这些数据集的支持，TorchText\
  \ 提供了一种简单的实验基准测试方法，并有助于更容易发布新颖成果。\n*   `TorchText.vocab`:词表子包帮助定义词表并加载预定义的向量，如 `Glove`、`Word2Vec`、`FastText`\
  \ 和 `CharNGram`。\n\n在理解了 TorchText 这些基础包后，我将带你浏览一些使用 TorchText 的示例。这些示例将帮助你在接下来的章节中理解并使用\
  \ TorchText 的一些工具：\n\n```\nimport PyTorch\nimport torchtext\nimport json\nfrom torchtext\
  \ import data\nfrom torchtext import datasets\n```\n\n### 加载数据\n\nTorchText 支持从\
  \ `JSON`、`制表符分隔值` (`TSV`) 和 `逗号分隔值` (`CSV`) 加载数据。由于以下原因，通常首选 `JSON` 而非 `CSV`/`TSV`：\n\
  \n`CSV`/`TSV` 无法存储列表数据，但 `JSON` 可以。\n\n如果数据本身包含制表符或逗号，`TSV`/`CSV` 数据容易出现解析错误。这种解析错误在\
  \ `JSON` 中是不可能的。\n\n假设我们有以下 JSON 内容并想使用 TorchText 读取它：\n\n```\nexample_json = “””{“name”:\
  \ “Sunil”, “location”: “United Kingdom”, “age”: 27, “quote”: [“i”, “love”, “the”,\
  \ “united kingdom”]} {“name”: “Kinara”, “location”: “United States”, “age”: 0, “quote”:\
  \ [“i”, “want”, “more”, “toys”]}”””\n```\n\n使用我们在示例中的 `train.json` 文件，数据集看起来如下：\n\
  \n```\n{“name”: “Aaayash”, “location”: “United Kingdom”, “age”: 12, “quote”: [“i”,\
  \ “want”, “the”, “stun granade”]}{“name”: “Mayuresh”, “location”: “United States”,\
  \ “age”: 20, “quote”: [“i”, “want”, “Guns\"]}\n```\n\n现在，我们为 JSON 格式中的每个键定义 `field`。`Fields`\
  \ 决定了数据如何被预处理并转换为数值格式。我们先不指定任何预处理函数，直接使用原始数据：\n\n```\nNAME = data.Field()\nPLACE\
  \ = data.Field()\nQUOTE = data.Field()\n```\n\n现在，所有单独字段都收集到一个变量 `field` 中，并与 JSON\
  \ 键进行相应的映射。例如，JSON 键 `name` 映射到字段 `NAME`，依此类推：\n\n```\nfields = {‘name’: (‘n’, NAME),\
  \ ‘location’: (‘p’, PLACE), ‘quote’: (‘q’, QUOTE)}\n```\n\n现在，我们将使用 `tabularDataset.split`\
  \ 函数将数据集划分为训练数据和测试数据：\n\n```\ntrain_data, test_data = data.TabularDataset.splits(path\
  \ = ‘NLP_Cookbook/Chapter2/data/’, train = ‘train.json’, test = ‘test.json’, format\
  \ = ‘json’, fields = fields)\nprint(vars(train_data[0])) # 打印 train_data 中的第一个数据\
  \ >> {‘n’: [‘Aaayash’], ‘p’: [‘Kingdom’], ‘q’: [‘i’, ‘want’, ‘stun granade’]}\n\
  ```\n\n### 预处理\n\n在之前的 Data Fields 章节中，我们没有定义任何处理函数。现在，我们将定义一个函数将 `quote` 字段转换为大写：\n\
  \n```\ndef capitalize(word_array):\n    return [i.upper() for i in word_array]\n\
  \nNAME = data.Field()\nPLACE = data.Field()\nQUOTE = data.Field(preprocessing=capitalize)\n\
  ```\n\n使用相同的数据：\n\n```\nfields = {‘name’: (‘n’, NAME), ‘location’: (‘p’, PLACE),\
  \ ‘quote’: (‘q’, QUOTE)}\ntrain_data, test_data = data.TabularDataset.splits(path\
  \ = ‘NLP_Cookbook/Chapter2/data/’, train = ‘train.json’, test = ‘test.json’, format\
  \ = ‘json’, fields = fields)\nprint(vars(train_data[0])) # 打印 train_data 中的第一个数据\
  \ >> {‘n’: [‘Aaayash’], ‘p’: [‘Kingdom’], ‘q’: [‘I’, ‘WANT’, ‘STUN GRANADE’]}\n\
  ```\n\n现在，你可以看到 `Quote` 字段中的所有单词都转换了大写。例如，在处理中，我们可以定义分词函数将句子转换为单词：\n\n```\nQUOTE.build_vocab(train_data)\n\
  vocab = QUOTE.vocab\nprint(“vocab : “, vocab)\nprint(“字符串到索引 : “, QUOTE.stoi)\n\
  print(“索引到字符串 : “, QUOTE.itos)\nprint(“频率 : “, QUOTE.freqs) # 由 Field 创建的原始词表频率\n\
  print(“训练示例的前 3 个 token : “,train_data.examples[0][:3])\n>> vocab : <torchtext.vocab.Vocab\
  \ object at 0x7fd28c1c0>\n>> 字符串到索引 : defaultdict(<function _unk_index at 0x7fd28d0c8>,\
  \ {‘unk’: 0, ‘inicial’: 1, ‘I’: 2, ‘WANT’: 3, ‘GUNS’: 4, ‘STUN GRANADE’: 5, ‘THE’:\
  \ 6})\n>> 索引到字符串 : [‘unk’, ‘inicial’, ‘I’, ‘WANT’, ‘GUNS’, ‘STUN GRANADE’, ‘THE’]\n\
  >> 频率 : Counter({‘I’: 2, ‘WANT’: 2, ‘THE’: 1, ‘STUN GRANADE’: 1, ‘GUNS’: 1})\n>>\
  \ 训练示例的前 3 个 token : [‘I’, ‘WANT’, ‘THE’]\n```\n\n同样，可以使用 `CSV` 或 `TSV` 文件作为输入。让我们通过加载\
  \ `CSV` 文件来示例。示例 `train.csv` 文件如下：\n\n| 序号 | 姓名 | 地点 | 年龄 | 引用 |\n| --- | --- |\
  \ --- | --- | --- |\n| 1 | Jenith | United Kingdom | 33 | I love the kingdom |\n\
  | 2 | Rog | United States | 55 | I want more guns |\n\n**表 2.9**: 以下代码显示了如何使用 `TorchText`\
  \ 快速读取文件\n\n```\n### 定义将句子转换为单词的分词器\ndef tokenizer(sentence):\n    return sentence.split()\
  \ # 快速分割\n\n### 定义字段\nNAME = data.Field()\nPLACE = data.Field()\nQUOTE = data.Field(tokenize=tokenizer)\n\
  ```\n\n在处理 `CSV` 或 `TSV` 时，我们必须省略未使用的字段。可以使用 `(None, None)` 在第三位置省略 `Age` 列。另一点是，我在\
  \ `QUOTE` 列使用了 `tokenizer`，因此句子在最终输出中也被分词了。此外，还包含了验证数据：\n\n```\n### 使用相同的数据\nfields\
  \ = [‘n’, NAME), (‘p’, PLACE), (None, None), (‘q’, QUOTE)]\ntrain_data, valid_data,\
  \ test_data = data.TabularDataset.splits(path = ‘NLP_Cookbook/Chapter2/data/’, train\
  \ = ‘train.tsv’, validation = ‘valid.tsv’, test = ‘test.tsv’, format = ‘tsv’, fields\
  \ = fields, skip_header = True)\nprint(vars(train_data[0])) # 打印 train_data 中的第一个数据\
  \ >> {‘n’: [‘Karry’], ‘p’: [‘United’, ‘Kingdom’], ‘q’: [‘i’, ‘have’, ‘money’]}\n\
  ```\n\n### 向量化\n\n向量化是将单词转换为 n 维浮点稠密向量的过程。我们将在[第 3 章，用数学表示语言]中学习生成嵌入的技术。使用 `TorchText`\
  \ 对标记向量化非常容易；人们可以在构建 `vocab` 时通过指定想要使用的向量类型轻松实现。PyTorch text 会自动在 `./vector_cache`\
  \ 临时目录下载指定的向量。这些是 `TorchText` 支持的所有向量，其中几个是 `charngram.100d`、`fasttext.en.300d`、`fasttext.simple.300d`、`glove.42B.300d`、`glove.840B.300d`、`glove.twitter.27B.25d`、`glove.twitter.27B.50d`、`glove.twitter.27B.100d`、`glove.twitter.27B.200d`、`glove.6B.50d`、`glove.6B.100d`、`glove.6B.200d`\
  \ 和 `glove.6B.300d`。\n\n```\nembeddings = QUOTE.build_vocab(train_data, vectors=”glove.6B.100d”)\n\
  ```\n\n\n\n\n我们的词汇库中有六个不同的单词 {‘’: 0, ‘’: 1, ‘have’: 2, ‘i’: 3, ‘money’: 4, ‘power’:\
  \ 5}, 所以 `QUOTE.vocab.vectors` 将为每个单词提供一个 100 维的向量。可以轻松地提取这些向量并将其输入任何机器学习算法：\n\n\
  `QUOTE.vocab.vectors.shape` # 将提供输出形状\n\n```python\n>> PyTorch.Size([6, 100])\n\
  ```\n\n可以使用以下代码块中的语法获取任何单词的向量：\n\n```python\nhave_vector = QUOTE.vocab.vectors[QUOTE.vocab.stoi[‘have’]]\n\
  print(have_vector)\n>> tensor([0.1571, 0.6561, .., -0.6061, 0.7100, 0.4147])\n```\n\
  \nTorchText 擅长处理未知单词。其他技术可能会返回未知单词的索引，或者可能需要显式的 `try and catch` 语法。然而，TorchText\
  \ 处理得非常完美。以下代码段展示了 TorchText 如何处理以前未过的单词：\n\n```python\nunknown_word = “humbahumba”\n\
  print(“Index for unknown word %s: %d” %(unknown_word, vocab.stoi[unknown_word]))\n\
  print(“Token for unknown word: “, vocab.itos[vocab.stoi[unknown_word]])\n>> Index\
  \ for unknown word humbahumba: 0\n>> Token for unknown word:খেজুর\n```\n\n在生成训练集和测试划分后，`Iterator`\
  \ 允许我们指定批次大小（batch size）。我们只有两个示例，所以我将批次大小保持为 2，我们得到一个批次进行迭代：\n\n```python\ntrain_iter,\
  \ val_iter, test_iter = data.Iterator.splits((train_data, valid_data, test_data),\
  \ batch_sizes=(2,-1,-1), sort_within_batch=True, repeat=False)\ntrain_data.examples\n\
  >> [<torchtext.data.example.Example at 0x7fd2803f7f28>, <;torchtext.data.example.Example\
  \ at 0x7fd2b668e8d0>]’\n```\n\n你可以在 [`torchtext.readthedocs.io/en/latest/`](https://torchtext.readthedocs.io/en/latest/)\
  \ 查看 TorchText 文档。TorchText 的某些功能现在已合并到 PyTorch 中，可以在 [`github.com/pytorch/text`](https://github.com/pytorch/text)\
  \ 找到。\n\n### 使用 TensorBoard 进行可视化\n\nTensorBoard 是 Google 的一个独立项目，与 TensorFlow 紧密集成。机器学习模型正变得越来越复杂，可视化有助于跟踪进度。TensorBoard\
  \ 是为 TensorFlow 开发的，而 TensorboardX 是一个开源工具，帮助将 PyTorch、MXNet 和 Keras 等其他框架连接到 TensorBoard。\n\
  \n下面的图片显示了 TensorboardX 作为中间工具，将 PyTorch、MXNet 和 Keras 等框架连接到 TensorboardX：\n\n\
  ![](img/tensorbordx.jpg)\n\n**图 2.2：** TensorBoard，基于 Web 的 UI 界面。\n\n以下是关于安装和开始使用\
  \ TensorBoard 和 TensorboardX 的说明。\n\n使用首选的安装程序 `pip` 安装 TensorBoard 和 TensorboardX：\n\
  \n```bash\npip install tensorboardX==0.15.4\npip install tensorboard==1.12.2\npip\
  \ install --user --upgrade TensorFlow # TensorBoard 依赖于 TensorFlow\n```\n\n安装完成后，通过执行以下命令启动\
  \ TensorBoard，其中 `path/to/log-directory` 是 TensorboardX 输出输出的目录：\n\n```bash\ntensorboard\
  \ --logdir=path/to/log-directory\n```\n\n它将带你进入一个所示的 Web GUI：\n\n![](img/tensorboard.jpg)\n\
  \n**图 2.3：** TensorBoard，基于 Web 的 UI 界面。\n\n### 在 TensorboardX 上显示标量值 (Scalar)\n\
  \nTensorBoard 支持多种类型的可视化，包括标量（scalar）、直方图（histogram）、图像、视频、文本和嵌入（embedding）。首先创建\
  \ summary writer 对象，该对象具有多种选项，如添加标量、图像、直方图、图形、图表、音频和嵌入。在这里，我正在使用 `add scalar` 选项。\n\
  \n`add scalar` 接受三个输入，即：\n\n* 标量的名称\n* Y 轴上的值\n* X 轴上的（通常是迭代次数/epoch 计数）\n\n以下代码段展示了如何使用\
  \ `TensorboardX` 在 TensorBoard 上投影标量：\n\n```python\nfrom tensorboardx import SummaryWriter\
  \ # init\nimport math\nimport random\n\nwriter = SummaryWriter()\n### 分别写入\nfor\
  \ i in range(0,100):\n    writer.add_scalar(‘sin’,math.sin(i*0.001) + random.random(),\
  \ i)\n    writer.add_scalar(‘cos’, math.cos(i*0.001) + random.random(), i)\nwriter.export_scalars_to_json(\"\
  ./all_scalars.json\")\nwriter.close()\n```\n\n运行之前的 `tfboardExperiments/scalar.py`\
  \ 脚本后，它将在代码相同的位置创建 `runs` 目录。然后使用日志目录启动你的 TensorBoard 服务器：\n\n```bash\ntensorboard\
  \ --logdir=runs\n```\n\n它将带你进入一个所示的 Web GUI：\n\n![](img/tensorboard.jpg)\n\n**图\
