  \n\n\nTensorFlow 由 Google 开发并开源。它是高性能计算的绝佳工具，最近它开始支持一种新硬件——张量处理单元（`TPU`）。据称 TPU\
  \ 的速度比 `GPU` 快。在硬件实现上，TPU 的灵活性低于 GPU，但它们是专为处理张量而设计的。TensorFlow 的开发相当反直觉，且不符合 Python\
  \ 风格（Pythonic）。TensorFlow 构建图的方法并不十分 Pythonic，因此你无法使用如 `pdb`、`ipdb` 和 `PyCharm`\
  \ 调试器等优秀的调试器。你必须使用特定的工具，如 TensorFlow 调试器或 `tfdbg`。另一方面，你可以在 PyTorch 中使用任何你喜欢的调试器。TensorFlow\
  \ 还受到如 `TensorBoard` 这样的独立工具的支持，它允许我们可视化训练过程，并支持图像直方图和嵌入的可视化。`TensorboardX` 是一个开源连接器可以将任何框架的输出连接到\
  \ `TensorBoard`，它拥有使用 TensorFlow 时的所有优势。我们将经常使用 `TensorboardX` 来使用 PyTorch 可视化训练进度。在许多情况下，PyTorch\
  \ 比其他可用框架（如 TensorFlow 或 Keras）运行更快。\n\n大多数研究社区偏于使用 PyTorch 是因为它具有以下一些特性：\n\n1.\
  \ PyTorch 的开发风格非常 Pythonic\n2. 调试图更加容易\n3. 当你卡住时，有活跃的社区可以救援\n4. 诸如 `ONNX` 和 `TensorBoard`\
  \ 等跨平台支持工具实现了高效的部署和可视化\n\n本教程将帮助你理解一些基础语法和操作，这些操作最终将帮助你轻松上手并理解使用 PyTorch 进行各种模型开发。\n\
  \n### 安装\n\n如果你是原生的 `Numpy` 用户并使用过像 `Keras` 这样的高级库，你会发现 PyTorch 非常容易。你可以轻松通过 `pip`\
  \ 下载并安装 PyTorch。我们将频繁使用 `TorchText`，它可以非常容易地安装：\n\n```\npip install PyTorch==0.4.1\n\
  ```\n\n```\npip install torchtext\n```\n\nPyTorch 组包，包含一个具有强 GPU 支持的张量库、一个神经网络库和一个自动求导库。它总共有五个核心组件，如下表所示：\n\
  \n| PyTorch | 一个类似于 NumPy 具有字符串支持的张量库 |\n| : --- | --- |\n| `PyTorch.autograd` |\
