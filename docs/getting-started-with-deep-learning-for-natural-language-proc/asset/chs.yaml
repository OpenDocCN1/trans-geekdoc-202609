  \n## 结构\n\n*   高效训练\n*   并行加载\n*   利用硬件资源\n*   高效部署\n\n## 目标\n\n*   高效训练\n*   并行加载\n\
  *   利用硬件资源\n*   高效部署\n\n# 高效训练\n\n*   并行加载\n*   利用硬件资源\n*   高效部署\n\n# 并行加载\n\n以下数据加载器有助于加载数据，并有助于中间操作，如图像增强、文本清洗、分词、特征生成、添加噪声和过滤。以下是多个框架中用于数据并的各种类：\n\
  \n*   PyTorch: `torch.utils.data.Dataset` 和 `torch.utils.data.DataLoader`\n*   TensorFlow:\
  \ `tf.distribute.Strategy`\n*   MXNet: `mx.gluon.data`\n\n这些数据加载器有助于加载数据，也有助于推理。\n\
  \n# 利用硬件资源\n\n在过去的几年里，连接多个 GPU 已经变得很常见。这些多个 GPU 可以同时用于训练，但你需要稍微修改训练过程。从概念上讲，可以通过探索数据并行或模型并行来完成并行训练：\n\
  \n*   **数据并行：** 这里，一个模型在多个 GPU 中复制，并为每个模型提供不同的数据实例。在前向传播后，计算多个 GPU 的汇总损失，并在每个模型中执行反向传播。数据并行实现非常简单，是目前最常用的类型。\n\
  *   **模型并行：** 这涉及将模型的不同层留在不同的 GPU 中，并在同一组数据集在不同的 GPU 上执行操作。它是非常复杂的，需要大量的思考和实现。大多数大型模型如\
  \ `Bert`、`GPT` 和单次检测器都是通过这种方式训练的。\n\n\n\n\n部署是最重要的一部分，因为这是与客户或终端用户交互的阶段。交互越顺畅，业务就越好。在部署过程中，产品在硬件成本方面的效率至关重要。大模型占用更多的磁盘和内存空间，并且通常需要更多的计算资源。部署端的主要研究正在进行，旨在通过减小模型尺寸的同时，增加单位时间内处理数据点的性能，且不会大幅降低其准确性。这些优化通过利用以下方法（单独使用或组合使用）来实现：\n\
  \n*   降低浮点精度\n*   融合层（Fusing layers）\n*   移除反向传播参数\n\n大多数机器学习模型在训练/预测时不需要高精度，降低精度对模型性能的影响很小或没有影响。大多数神经网络在\
  \ `FP32` 上运行，但在 2017 年，Nvidia 探索出可以使用较低精度训练神经网络，同时保持相同的性能。在 `half(FP16)` 精度下训练神经网络需要如损失缩放（loss\
  \ scaling）等额外步骤。根据 Nvidia 的一份白皮书显示，使用 `FP32` 和 `FP16` 训练的模型在具有损失缩放的情况下具有相同的性能。Nvidia\
  \ Tensor 核心利用了之前讨论过的机遇，可以极大提升训练和推理性能。\n\n![](img/training-iteration.jpg)\n\n**图\
  \ 11.1:** 混合精度训练\n\n`bigLSTM` 英语语言模型的训练曲线显示了混合精度训练技术的益处。Y 轴是训练损失。没有损失缩放的混合精度（灰色）在一段时间后发散，而带有损失缩放的混合精度（绿色）则与单精度模型（黑色）匹配。**来源：**\
  \ [`docs.nvidia.com/deeplearning/sdk/mixed-precision-training/index.html`](https://docs.nvidia.com/deeplearning/sdk/mixed-precision-training/index.html)\n\
  \nNvidia 的开源项目之一名为 `Apex`，其开发目的是允许在 Nvidia GPU 上支持混合精度训练。`Apex` 按以下机制工作：\n\n*  \
  \ **Amp**: 一个支持混合精度训练的库\n*   **FP 16 优化器**: 将现有的 `PyTorch` 优化器封装在低精度中，并自动处理权重更新和损失缩放。此外，在现有模型中添加\
  \ `apex` 仅需修改两行代码。\n\n按照机制，`Apex` 将所有函数分为三部分：\n\n*   **白名单**: 可以迁移到 `FP16` 并将提供极大速度提升的函数\n\
  *   **黑名单**: 迁移此类函数不会提供多少速度提升\n*   **其他所有内容**: 所有剩余的函数由于 `FP32 - -> FP16` 的转换成本很高，因此保持原样。\n\
  \n在 `Apex` 中，利用了诸如猴子补丁（monkey patching）等其他各种机制，并维护了一个字典以减少对已转换变量的类型转换操作。\n\n另一个在部署领域日益流行的候选方案是\
  \ `TensorRT`。`Nvidia-TensorRT` 具有多种机制可以优化网络性能，同时缩小其整体尺寸和计算需求。`TensorRT` 按以下机制工作：\n\
  \n*   消除具有未使用输出的层以避免不必要的计算。\n*   在可能的情况下，将卷积、`bias` 和 `ReLU` 层融合为单层。\n*   水平层融合（Horizontal\
  \ layer fusion）或层聚合通过组合接收相同源张量并应用相似参数相同操作的层来提高性能。\n*   执行推理时不需要用于梯度更新的反向传播参数。移除此类参数也有助于缩小模型尺寸。`TensorFlow`\
  \ 模型冻结正是基于此机制。\n\n这些图操作不会改变模型的整体准确性，但有助于更快、更具节能的方式执行操作。\n\n# 硬件相关优化\n\n现在显而易见，GPU\
  \ 是深度学习相关模型的动力。GPU 是通过 `PCIe` 通道连接到主板的物理设备。如今，一个主板连接多个 GPU 的系统非常常见。`PCIe` 的最大理论带宽为\
  \ `30GB/s`，这在多 GPU 系统中确实是一个瓶颈。当多个 GPU 连接到网络时，此类系统通常通过 `CAT-6` 以太网或光纤网络互连。这种连接效率低下，并证明是瓶颈。为此，提供了专用机器来加速深度学习训练。该设备依赖于\
  \ GPU-GPU 和 GPU-CPU 之间的 `InfiniBand` (`IB`) 连接。与传统数据传输系统相比，`InfiniBand` 数据传输快得多。`NVLink`\
  \ 使用 `InfiniBand` 结合软件级增强，极大地跳过了瓶颈。\n\n*   `IBM Power8` CPU，CPU 可以通过 `NVLink` 直接连接到\
  \ GPU。\n*   使用多个 `NVlinks` 可以连接多个 `Nvidia-GPUs`，提供的性能是 `PCI` 带宽的 `10X+`。\n\n以下软件级改进增强了此类专用系统的性能：\n\
  \n*   **远程直接内存访问** (`RDMA`): 提供跨 GPU 的细粒度访问。\n*   **多进程服务** (`MPS`): 允许在 GPU 上基于多进程进行多任务处理，并确保一个进程不会占用所有资源。\n\
  *   **地址翻译服务**: GPU 可以直接访问 CPU 的内存页表。有助于从主内存拉取数据。\n\n参考以下链接：\n\n*   数据并行：[`pytorch.org/tutorials/blitz/data_parallel_tutorial.html`](https://pytorch.org/tutorials/blitz/data_parallel_tutorial.html)\n\
  *   深度学习并行与分布式：一种深度分析：[`arxiv.org/pdf/1802.0941.pdf`](https://arxiv.org/pdf/1802.0941.pdf)\n\
  *   在多个 CPU/GPU 上使用数据并行运行 `MXNet`：[`mxnet.apache.org/versions/master/devices.html`](https://mxnet.apache.org/versions/master/devices.html)\n\
