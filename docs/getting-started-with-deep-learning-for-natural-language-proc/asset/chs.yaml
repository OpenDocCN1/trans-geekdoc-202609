  \ PyTorch 中创建 RMDL 模型的技巧相关的代码请见 `Ch8/rmdl_techniques.ipynb`。RMDL 包的使用和路透社数据的用法见\
  \ `CH8/rmdl_package_usage.ipynb`。\n\nRMDL 可应用于各种数据集。例如，仅使用了几个参数，包括 `batch_size`、`sparse_categorical`\
  \ 和 `random_deep`。更多细节请参阅 `Ch8/rmdl_techniques.ipynb`。\n\n---\n\n### 通过快照进行集成\n\n\
  集成技术专门用于结合许多弱分类器并形成更强的分类器。集成方法传统上用于在竞赛中产生顶端结果。集成技术有三种，即：\n\n1. Bagging\n2. Boosting\n\
  3. Stacking\n\n### Bagging\n* Bagging 也称为自助聚合（Bootstrap Aggregating）。\n* 它是一种并行集成，其中每个模型使用数据的子集独立构建。\n\
  * 所有分类器的输出权重相等。\n* Bagging 减少的是方差，而不是偏差。\n* 适用于高方差、低偏差的复杂模型。\n* 随机森林是分类器之一，在其中形成了多个弱树，并根据投票的组合做出决策。\n\
  \n### Boosting\n* 使用不同的数据子集构建不同的模型。\n* 下一个模型选取上一个模型表现差的子集，并尝试在给定的子集上表现更好。\n* 使用加权投票最终分类器结合了多个分类器。\n\
  * 这减少了方差，而不是偏差。\n* Boosting 适用于低方差、高偏差的模型。\n* 梯度提升（Gradient boosting）是基于树的提升算法的一个示例。\n\
  \n### Stacking\n* 它通常用于竞赛，通常由 Kaggle 和 Coda labs 举办的竞赛。\n* 使用不同类型的多个模型并对所有算法在单个数据集上产生的输出取平均值，以获得更高的预测准确率。\n\
  \n\n\n随着特征数量的增加，局部最小值或极大值的数量呈指数级增长。目前没有万无有效的方法可以找到全局最小值或极大值。通常情况下，优化器会被发现陷入局部最小值，并产生高方差的模型。为了理解这一点，让我们可视化一下特征空间。请看以下截图：\n\
  \n![](img/snapshot_ensemble.jpg)\n\n**图 8.3：** （左）标准学习率通过提供一个模型使模型收敛。（右）快照集成（snapshot\
  \ ensemble）如何通过循环学习率为每个最小值提供不同的模式。\n\n左侧图显示了仅包含三个特征的典型能量地貌。在机器学习中，我们试图降低模型的损失，损失最最小的点被称为全局最小值，理想情况下模型应该收敛到全局最小值。由于没有万无有效的方法可以找到全局最小值，这项任务非常困难。同时，局部最小值与邻域相比也是极小的。此外，局部最小值的数量随着特征的增加而呈指数级增长。随机梯度下降优化技术往往会陷入局部最小值并产生糟糕的结果。快照集成（snapshot\
  \ ensembles）技术巧妙地解决了这个问题。快照集成利用学习率的收敛行为来获取更好的模型。当学习率较高时，梯度会越界并跳出最小值；当学习率较低时，它会收敛到局部最小值。在本文中，作者建议在一次训练中建立\
  \ `M` 个并行模型。训练轮数 `T` 被分为 `M` 个周期。每个周期从较高的学习率开始，并单调下降以确保在局部最小值处收敛。从 `M` 个周期中收集 `M`\
  \ 个模型并用于最终决策，即所有模型的平均值。单调递减函数给出：![](img/158C8Eq5a.jpg)。这里，`a(t)` 是新的学习率，`a[t-1]`\
  \ 是上一个学习率，`T` 是总轮数，`M` 是学习率震荡周期的总数。\n\n在`第 5 章，CNN 应用于 NLP 任务]` 中，我们介绍了一个 `用于文本分类的词级\
  \ CNN` 的配方。为了保持实现简单易于理解，我们正在整合用于文本分类的词级 CNN 的快照集成实现。我们将使用相同的大型电影评论数据集。通过相同的损失函数和优化器，我们将引入三个额外的机制：\n\
  \n1.  一个单调减少损失的函数。\n2.  在每个周期结束时记录快照的措施。\n3.  使用给定的快照进行预测的措施。\n\n### 学习率修改器\n\n\
  优化器使用循环退火调度来快速降低学习率并将模型收敛到最近的局部最小值。在训练过程中，学习率降低，所示：\n\n![](img/learning_rate_snapshot.jpg)\n\
  \n**图 8.4：** 学习率的循环变化。\n\n在每个周期中，学习率从某个高值开始，然后单调下降以收敛到局部最小值，并作为快照模型之一提供。X 轴显示周期，Y\
  \ 轴显示学习率。每个周期从较高的学习率开始并快速下降以收敛到局部最小值。此功能通过 Python 定义 `proposed_lr` 实现：\n\n```python\n\
  def proposed_lr(initial_lr, iteration, epoch_per_cycle):\n    return initial_lr\
  \ * (math.cos(math.pi * iteration / epoch_per_cycle) + 1) / 2\n```\n\n### 记录快照\n\
  \n模型没有变化，但训练调度发生了变化。定义了总轮数和周期数。通过将总轮数除以几个周期，将轮数平均分配到每个周期。初始学习率是固定的。这里，我们将 300 固定为总轮数，并将进行训练。\n\
  \n\n\n```python\n\"dropout\" : dropout,\n\"static\" : static,\n\"stride\" : stride\n\
  }\nmetrices = test_snapshot_model(CNN_Text, snapshots, 10, test_iter, model_param)\n\
  print(metrices)\n```\n\n\n\n\n```\nreturn torch.softmax(dense_out, 1)\n\ndef init_hidden(self):\n\
  bidiractional_state = (1 if self.config.bidirectional==False else 2)\nself.h0 =\
  \ Variable(torch.Tensor(np.random.rand(self.config.n_layers * bidiractional_state,\
  \ self.config.batch_size, self.config.hidden_size)))\nself.c0 = Variable(torch.Tensor(np.random.rand(self.config.n_layers\
  \ * bidiractional_state, self.config.batch_size, self.config.hidden_size)))\n```\n\
  \n### 主干 (Stem)\n\nStem 是两个孪生网络汇合的网络，最终在进行分类比较之前，会应用一个全连接层：\n\n```python\nclass\
  \ Stem(nn.Module):\n    def __init__(self, config):\n        super(Stem, self).__init__()\n\
  \        self.config = config\n        self.dense1 = nn.Linear(config.piller_out_class*2,\
  \ config.piller_out_class)\n        self.dense2 = nn.Linear(config.piller_out_class,\
  \ config.num_class)\n    def forward(self, input):\n        stem_dense1 = self.dense1(input)\n\
  \        stem_dense2 = self.dense2(stem_dense1)\n        return stem_dense2\n```\n\
  \n该网络使用 `Mean Squared Error`（均方误差）作为损失函数，并使用 SGD 作为优化器进行训练。这里给 Tensorboard 中观察到的训练损失下降和训练准确率上升的情况：\n\
