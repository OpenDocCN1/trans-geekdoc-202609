  \n## 理解进阶 RNN 单元\n\n在上一章中，我们讨论了基础 RNN 或 Elman RNN 或原生（vanilla）RNN 单元。原生 RNN 单元存在一些缺点，因此我们将在本章讨论一些进阶的\
  \ RNN 单元，如 LSTM 和门控循环单元（`GRU`）。\n\n下面的图片看起来很眼熟；它是我们在教程 1 中理解 RNN 单元时使用的隐藏张量表示：\n\
  \n![](img/Vanishing_gradient.jpg)\n\n**图 4.6：** 梯度消失问题的插图。\n\n隐藏状态下方的颜色条表示隐藏状态的内容信息。随着隐藏状态看到越来越多的标记（tokens），它受到所有标记的影响并存储关于这些标记的信息。另一点值得注意的是的是，随着隐藏状态向向前移动，它倾向于忘记之前时间步中看到的标记信息。这个隐藏状态存在问题。如你所见，随着序列的变长，第一个时间步输入的贡献会变为零或被删除。当对这类网络应用\
  \ BPTT（随时间反向传播）时，早期时间步的梯度不会被计算，权重无法学到相关信息。如果我向你展示展开版本的 RNN 中相同的内容，梯度会在反向传播过程中减小，并最终消失。\n\
  \n为了解决这个问题，`Jürgen Schmiduber` 在 1997 年提出了 `LSTM`。在本章中，我们将详细讨论 `LSTM`。\n\n### LSTM\
  \ 中的门控机制\n\n在 LSTM 成功后，许多研究人员提出了它的变体。在这里，我们将简要讨论两个变体，如下图所示：\n\n![](img/LSTM_varients.jpg)\n\
  \n**图 4.9：** 通过在不同门之间建立额外连接设计的 LSTM 变体。\n\n`LSTM` 有两个状态：隐藏状态和单元状态（cell state）。单元状态像一条贯穿整个序列的传送带，用门用于添加或移除信息。下图说明了这些门是如何工作的：\n\
  \n*   **遗忘门（Forget gate）**：决定从单元状态丢弃哪些信息。\n*   **输入门（Input gate）**：决定哪些新信息将存储在单元状态中。\n\
  *   **输出门（Output gate）**：决定单元状态的哪些部分作为输出。\n\n使用 `PyTorch` 实现 `LSTM` 如下：\n\n```python\n\
  class LSTM_RNN(nn.Module):\n    def __init__(self, vocab_size, embedding_dim, hidden_dim,\
  \ output_dim, n_layers, bidirectional, dropout, sentiment_vocab):\n        super(LSTM_RNN,\
  \ self).__init__()\n        self.embedding = nn.Embedding(vocab_size, embedding_dim)\n\
  \        self.rnn = nn.LSTM(embedding_dim, hidden_dim, num_layers=n_layers, bidirectional=bidirectional,\
  \ dropout=dropout)\n        self.fc = nn.Linear(hidden_dim * 2, output_dim)\n  \
  \      self.dropout = nn.Dropout(dropout)\n\n    def forward(self, x):\n       \
  \ embedded = self.dropout(self.embedding(x))\n        output, (hidden, cell) = self.rnn(embedded)\n\
  \        # 拼接最后的正向 (hidden[-2,:,]) 和反向 (hidden[-1,:,]) 隐藏层\n        并 应用 dropout\n\
  \        hidden = self.dropout(torch.cat((hidden[-2, :, :], hidden[-1, :, :]), dim=1))\n\
  \        return self.fc(hidden.squeeze(0))\n```\n\n`LSTM` 可以通过以下代码测试：\n\n```python\n\
  rnn = nn.LSTM(15, 25)\ninput = torch.randn(5, 3)\nh0 = torch.randn(2, 25)\nc0 =\
  \ torch.randn(2, 25)\noutput, (hn, cn) = rnn(input, (h0, c0))\n```\n\n`LSTM` 的训练数据准确率超过了\
  \ 95%，而 RNN 仅为 70%。完整的实现及支持代码见 `Ch4/lstm_`and`_rnn.ipynb`。\n\n\n\n\n\n图 A 是由 `Gers\
  \ &Schmidhuber (2000)` 设计的，它包含一个视孔，使得 sigmoid 层可以看到单元状态。在图 B 中，在遗忘门和输入门之间增加了一个连接。其直觉是让遗忘门负责遗忘，而输入门决定丢弃什么以及添加什么。有几种这样的变体，其中许多在某些任务中表现优异。讨论这些变体可以提供额外的直觉，并拓宽你对\
  \ LSTM 的视野。在之前的实验中，我仅报告了训练数据上的准确率。整个代码都包含了测试和验证划分，并且是可用的。作为练习的一部分，你可以尝试对网络进行以下更改以强化学习：\n\
  \n*   尝试使用不同的数据集，看看趋势是否随数据集的改变而不同（`torchtext.datasets` 随 `torchtext` 提供了不同的数据集）\n\
  *   在验证数据和测试数据上通过迭代检查准确率\n\n请查看以下链接获取更多详情：\n\n*   处理时间和计数的循环网络：`ftp://ftp.idsia.ch/pub/juergen/TimeCount-IJCNN2000.pdf`\n\
  *   深度门控循环神经网络：`[`arxiv.org/pdf/1508.03790v2.pdf`](https://arxiv.org/pdf/1508.03790v2.pdf)`\n\
  \n# 理解并实现 GRU\n\n在在上一个章节中进行的实验中，门控机制可以作为实现顶级结果并缓解梯度消失问题的解决方案。`门控循环单元`（`GRU`）的灵感也来源于\
  \ LSTM 的设计。门控循环单元由 `Cho et al.` 在 2014 年在一篇名为 `Learning Phrase Representations using\
  \ RNN Encoder-Decoder for statistical machine translation` 的研究论文中发表。\n\n由于我们已在 LSTM\
  \ 中引入了门控机制，`GRU` 也有两个门：更新门和重置门。这两个门决定了哪些信息应该被丢弃，哪些信息应该被传递。这两个门中的可学习参数可以通过训练来改变信息内容，并进行持续更新。`GRU`\
  \ 的流程图所示：\n\n![](img/GRU.jpg)\n\n**图 4.10：** GRU 单元的详细结构。\n\n四个门的功能如下：\n\n### 更新门\n\
  Update gate 可以由公式给出：\n\n`z[t] = σ(W^((z)) X[t] + U^((z)) h[t-1])*`\n\n在这里，输入 `X[t]`\
  \ 与其权重相乘，带有之前 `t - 1` 信息的先前隐藏张量也与其权重相乘。然后，sigmoid 将它们压缩为 0 到 1 之间的一个数字。更新门决定了在当前时间步丢弃多少过去的信息。这个门有助于解决梯度消失问题。如果\
  \ sigmoid 门的值为 1，则保留所有信息以解决梯度消失问题。\n\n### 重置门\nReset gate 有助于于确定必须从之前的时间步中遗忘多少信息：\n\
  \n`r[t] = σ(W^((r)) x[t] + U^((r)) h[h-1])*`\n\n这个方程看起来与上一个非常相似，唯一的区别是权重是用于重置门的。接下来是使用这些门来确定当前的内存内容以及输出结束时的最终内存。\n\
  \n### 当前内存内容\n这使用重置门的值和当前输入值推导出当前的内存内容。如之前所述，重置门知道要遗忘多少信息，其值为 0 到 1 之间的数字。如果 `r[t]`\
  \ 为零，则当前时间步包含的输入信息将被完全忽略；如果为一，则当前输入中的信息将进入单元状态。当前内存内容的计算方式所示：\n\n*   取重置门值 `r[t]`\
  \ 与之前的隐藏状态及其权重 `Uh[t-1]` 的 `Hadamard` 积。\n*   与 `Wx[t]` 的值相加。\n*   `h[t]' = tanh(Wx[t]\
  \ + r[t]* ʘ *Uh[t-1])*`\n\n### 当前时间步的最终内存\n最终内存通过利用更新门的结果和当前内存内容构建。最终内存通过以下步骤形成：\n\
  \n*   取更新门值 `z[t]` 与 `h[t-1]` 的 `Hadamard` 积。\n*   取 `1 – z[t]` 与当前内存内容 `h[t]'`\
  \ 的 `Hadamard` 积。\n*   将这两个值相加：\n    `h[t] = z[t]* ʘ *h[t-1] + (1 – z[t])* ʘ *h[t]'*`\n\
  \n### 使用 PyTorch 实现 GRU\n\n现在，是时候使用 PyTorch 实现 GRU 了。其用法与 LSTM 和原生 RNN 非常相似。`GRU`\
  \ 函数接受三个参数：\n\n*   `Input_size`：输入 `x` 中预期的特征数量。\n*   `Hidden_size`：隐藏状态 `h` 中的特征数量。\n\
  *   `Num_layers`：循环层的数量。例如，设置 `num_layers=2` 意味着将两个 GRU 堆叠在一起形成一个堆叠 GRU，第二个 GRU\
  \ 接收第一个 GRU 的输出并计算最终结果。默认值：1。\n\n```\nrnn = nn.GRU(10, 20, 2) \ninput = torch.randn(5,\
  \ 3, 10)\noutput, hn = rnn(input, torch.randn(2, 3, 20))\n```\n\n这里需要注意的一点是，GRU\
  \ 只使用一个隐藏状态来处理梯度消失问题，而 LSTM 使用两个隐藏状态。因此，GRU 比 LSTM 快一点。让我们看看它们在电影评论数据集上的表现。比较 GRU\
  \ 和 LSTM 性能的完整实现位于 `Ch4/gru_and_lstm.ipynb`。\n\n![](img/LSTM_GRU.jpg)\n\n**图 4.11：**\
  \ LSTM 和 GRU 在文本分类任务上的准确率差异。\n\n所示，LSTM 产生了 95% 的准确率，而 GRU 为 85%。然而，并非所有数据集都是如此；在某些情况下发现\
  \ GRU 的性能更优。\n\n## 理解序列序列模型\n\n序列序列模型是现代 NLP 时代研究广泛的领域。它是适用于所有任务的通用算法：\n\n*   机器翻译\n\
  *   摘要\n*   问答\n*   聊天机器人\n*   文本简化\n*   语音转文本\n*   文本转语音\n\n在这个配谱中，我们将从通用的序列序列架构开始。我们将逐一实现\
  \ GRU 编码器-解码器、带批的编码器-解码器以及带注意力的批处理。我们将通过整合算法、方程和代码来讨论这种实现。后续配谱中的讨论形成了现代 NLP 技术的基础。为了让你了解如何从零开始处理文本，我在这些主题中没有使用\
  \ `TorchText`。\n\n\n\n\n\n在深入算法细节之前，我们必须了解一些操作，以帮助我们轻松理解序列到序列（sequence to sequence）模块。\n\
  \n### Unsqueeze（维度扩张）\nUnsqueeze 在参数指定的位置插入一个单维度（singleton dim）。插入一个新的轴，该轴将出现在展开后数组形状对应的轴位置：\n\
  \n```python\ninput = torch.Tensor(2, 4, 3) # input: 2 x 4 x 3\nprint(input.unsqueeze(0).size())\n\
  >>>torch.Size([1, 2, 4, 3])\n```\n\n### Squeeze（维度压缩）\n返回一个移除输入所有大小为 1 的维度的张量。例如，如果输入形状为\
  \ (A×1×B×C×1×D)，输出形状为 (A×B×C×D)。此操作通常用于重塑张量以适应所需的输入大小，或便于矩阵运算：\n\n```python\nx =\
  \ torch.zeros(2, 1, 2, 1, 2)\ny = torch.squeeze(x)\ny.size()\n>>>torch.Size([2,\
  \ 2, 2])\n```\n\n### Permute（维度排列）\n用于交换张量的不同轴：\n\n```python\nx = torch.randn(2,\
  \ 3, 5)\ntorch.Size([2, 3, 5])\nprint(x.permute(2, 0, 1).size())\n>>>torch.Size([5,\
  \ 2, 3])\n```\n\n### LogSoftmax\nLog Softmax 在 soft-max 之后应用对数：`log(exp(xi)/exp(x).sum())`\n\
  \n### TopK\n沿给定维度返回给定输入张量中前 k 个最大的元素。如果没有给出 `dim`，则选择输入的最后一个维度。默认情况下 `largest` 为\
  \ `True`，但如果为 `False`，则返回 k 个最小元素。返回一个包含（值, 索引）的列表，其中索引是原始输入张量中元素的索引：\n\n```python\n\
  x = torch.arange(1., 10.) #tensor([1., 2., 3., 4., 5.])\ntop_value, top_index =\
  \ torch.topk(x, 3)\nprint(top_value, top_index)\n>>> tensor([9., 8., 7.]) tensor([8,\
  \ 7, 6])\n```\n\n为了简单起见，我在本教程中使用了 `GRU`。序列到序列架构包含三个核心组件：编码器（encoder）、解码器（decoder）和上下文向量（context\
  \ vector）。以下是序列到序列架构的详细图：\n\n![](img/encoder_decoder.jpg)\n\n**图 4.12:** 训练期间的编码器-解码器架构，\n\
  \n为了简化，我们取两个句子：一个法语，一个英语。任务是将法语句子/源句子转换为英语句子/目标句子：\n\n*   法语句子/源句子 - *mon nom est\
  \ Sunil*\n*   英语句子/目标句子 - *my name is Sunil*\n\n如图所示，每个词以嵌入表示的形式存在并传递给 `GRU`。`GRU`\
  \ 还接收第一个编码器隐藏状态作为输入。输入句子所有的词按顺序传递给 `GRU`，使其接收一个词和上一状态的状态，并一个输出和一个更新后的隐藏状态。目前，我将忽略符号所示的编码器输出。\n\
  \n编码器和解码器的隐藏状态在全程用蓝色虚线箭头表示。从输入形成的嵌入表示用粉色显示。\n\n编码器阶段完成后，我们得到一个最终的编码器隐藏状态作为输出。这个最终编码器隐藏状态是有价值的，因为它看到了序列中所有的词，因此包含了关于整个序列的信息。该编码器隐藏状态作为第一个隐藏状态传递给解码器。这个最终隐藏状态称为上下文向量，然后传递给解码器。通常，解码器最初什么都不知道，但向量通过上下文提供了大量关于源序列的信息。解码器的第一个单元以`<GO>`\
  \ 或 `<SOS>` token 作为输入以及上下文向量被唤醒。然后，使用教师强制（teacher forcing）训练解码器。教师强制主要用于训练语言模型，而序列到序列任务是语言模型的一种。教师强制是训练循环神经网络中的一种提示，它使用上一个时间步的模型输出作为下一个时间步的输入。例如：\n\
  \n*   用于编码器的输入句子是法语句子 - “*Mon nom est Sunil*。”\n*   英语的实际目标句子 - “*My name is Sunil*。”\n\
  *   在解码过程中，在第一个时间步，`<GO>`  同上下文向量一起作为输入给 `GRU`。`<GO>` 或 `<SOS>` 标记解码的开始，它将查看上下文向量生成第一个英语单词。然后，`GRU`\
  \ 将生成（可能）“*My*。”\n*   现在，在第二个时间步，“*My*”将连同上一个时间步的隐藏步作为输入给出。这将输出“*name*。”\n*   这种生成将一直持续，直到遇到\
  \ `<EOS>` token 为止。\n\n在训练时，我们知道输入序列的输出序列，因此我们提供实际输出的单词用于教师强制。在测试时，我们不知道输入序列的输出序列，因此时间步\
  \ `t` 生成的输出 token 作为 `t+1` 步的输入，如下所示：\n\n![](img/Encoder_decoder.jpg)\n\n**图 4.13:**\
  \ 测试期间的编码器-解码器架构。\n\n### 实现序列到序列\n\n### 器\n编码器具有以下组件：Embedding 将词转换为密集向量，然后传递给 `GRU`\
  \ 层。`GRU` 的输出在这里不被使用，而是将 `GRU` 的最终隐藏状态传递给解码器。此隐藏状态在每个时间步都会返回。\n\n```python\nclass\
  \ EncoderRNN(nn.Module):\n    def __init__(self, input_size, hidden_size, n_layers=1):\n\
  \        super(EncoderRNN, self).__init__()\n        self.n_layers = n_layers\n\
  \        self.hidden_size = n_size\n        # 为了简单，Embed size = 隐藏 size\n      \
  \  self.embedding = nn.Embedding(input_size, hidden_size)\n        self.gru = nn.GRU(hidden_size,\
  \ hidden_size)\n\n    def forward(self, input, hidden):\n        input = input.unsqueeze(1)\n\
  \        embedded = self.embedding(input) # batch, hidden\n        output, hidden\
  \ = self.gru(embedded, hidden)\n        return output, hidden\n```\n\n### 解码器\n\
  解码器的结构类似于编码器。它有一个嵌入层将输入转换为密集向量，然后传递给 `GRU` 层。解码器的第一个时间步接收上下文向量作为隐藏状态。应用线性变换来转换 `GRU`\
  \ 的输出。该线性变换将 `GRU` 输出转换为与输出语言词汇大小相同。对该层应用 soft-max，并将值转换为概率。任何词的高概率都表示解码器正在生成该词作为输出：\n\
  \n```python\nclass DecoderRNN(nn.Module):\n    def __init__(self, hidden_size, output_size,\
  \ n_layers=1):\n        super(DecoderRNN, self).__init__()\n        self.n_layers\
  \ = n_layers\n        self.hidden_size = hidden_size\n        # 为了简单，Embeding size\
  \ = 隐藏 size\n        self.embedding = nn.Embedding(output_size, hidden_size)\n \
  \       self.gru = nn.GRU(hidden_size, hidden_size)\n        self.out = nn.Linear(hidden_size,\
  \ output_size)\n        self.softmax = nn.LogSoftmax()\n\n    def forward(self,\
  \ input, hidden):\n        output = self.embedding(input) # batch, 1, hidden\n \
  \       output = output.permute(1, 0, 2) # 1, batch, hidden\n        output = F.relu(output)\n\
  \        output, hidden = self.gru(output, hidden)\n        output = self.softmax(self.out(output[0]))\n\
  \        return output, hidden\n```\n\n\n\n\n训练包含了将我们之前开发的所有部分整合在一起，从为编码器和解码器创建对象开始，如下：\n\
  \n```\nencoder = EncoderRNN(input_size, hidden_size)\n```\n\n```\ndecoder = DecoderRNN(hidden_size,\
  \ output_size, n_layers=2)\n```\n\n训练按顺序涉及以下组件：\n\n*   收集编码器和解码器的所有可训练组件，并将这些组件提供给优化器。\n\
  *   定义损失函数。\n*   使用我们的数据加载器获取源句子和目标句子。\n*   初始化编码器隐藏状态。\n*   遍历源句子中的所有标记并生成最终的编码器隐藏状态。\n\
  *   将最终的编码器隐藏状态以及序列开始标记作为输入传递给解码器。\n*   运行解码器并允许其使用教师强制（teacher forcing）生成标记。\n\
  *   遇到 `<EOS>` 标记，停止解码循环。\n*   通过比较生成的输出与实际输出来计算损失。\n*   反向传播损失并更改权重。\n*   （可选）跟踪损失以可视化网络是否正在收敛。\n\
  *   重复步骤 3 到 10，直到每个 epoch 中的所有句子对都处理完毕。\n*   运行训练 n 个 epoch 并进行评估。\n\n下图显示了训练损失随着训练的进行而减少：\n\
  \n![](img/encoder_decoder_training_seq2seq.jpg)\n\n图 4.14：网络针对语言翻译任务进行训练时误差的减少。\n\
  \n## 评估\n\n评估模块遵循与训练相同的流程；它获取预训练的编码器和解码器并生成翻译文本。这里的关键是将上一个时间步生成的标记通过教师强制传递下一个时间步。解码器在每个时间步生成一个单词，并将相同的单词作为输入到下一个时间步。在测试时，我们不知道输入序列的输出序列，因此时间步\
  \ `t` 生成的输出标记将作为 `t+1` 步的输入。评估尝试结束时生成如下输出：\n\n| `输入` | `期望输出` | `生成输出` |\n| ---\
  \ | --- | --- |\n| `je suisen retard pour l entrainement.` | `i m late for practice.`\
  \ | `i m late for late late.` |\n| `je suistouche !` | `i m hit !` | `i m a . .`\
  \ |\n| `vousavezprobablementtort.` | `you are probably wrong.` | `you reprobably\
  \ . .` |\n| `ils ne sont pas encore chez eux.` | `they re not home yet.` | `they\
  \ re not always yet.` |\n| `je ne tedraguepas.` | `i m not hitting on you.` | `i\
  \ m not helping you you.` |\n| `tu es fort elegant.` | `you re very sophisticated.`\
  \ | `you re very funny.` |\n| `je suisveinarde.` | `i m in luck.` | `i m a . .`\
  \ |\n| `vousetesvraimentgeniales.` | `you re really awesome.` | `you re really very.`\
  \ |\n| `je suisjustecurieux.` | `i m just curious.` | `i m right behind . .` |\n\
  | `tu es tres elegant.` | `you are very sophisticated.` | `you are observant.` |\n\
  \n表 4.2：评估结果的对比。\n\n下表显示了不同输入的评估结果：\n\n| 输入 | 期望输出 | 生成输出 |\n| --- | --- | --- |\n\
  | je suisen retard pour l entrainement. | i m late for practice. | i m late for\
  \ late late. |\n| je suistouche ! | i m hit ! | i m a . . |\n| vousavezprobablementtort.\
  \ | you are probably wrong. | you reprobably . . |\n| ils ne sont pas encore chez\
  \ eux. | they re not home yet. | they re not always yet. |\n| je ne tedraguepas.\
  \ | i m not hitting on you. | i m not helping you you. |\n| tu es fort elegant.\
  \ | you re very sophisticated. | you re very funny. |\n| je suisveinarde. | i m\
  \ in luck. | i m a . . |\n| vousetesvraimentgeniales. | you re really awesome. |\
  \ you re really very. |\n| je suisjustecurieux. | i m just curious. | i m right\
  \ behind . . |\n\n\n\n\n在训练解码阶段，上下文向量（context vector）作为编码器的最后一个隐藏状态被接收。解码过程从 batch\
  \ 中所有句子的 `<GO>` 标记开始，并传递到嵌入层。生成所有 `<GO>` 标记的嵌入，这些嵌入与解码器的隐藏状态一起传递给 `GRU`。在第一个器的第一个时间步中，解码器隐藏状态是编码器的最后一个隐藏状态，也称为上下文向量。`GRU`\
  \ 生成一个解码器隐藏状态和一个输出。然后根据时间步将此解码器输出堆叠到最终的输出数组中。如果在时间 `t`，所有的 `<GO>` 标记都已传递给解码器，那么在\
  \ `t+1` 处的输出应该包含所有 64 个目标句子的第一个单词。通过这种方式，可以在 64 个句子的 batch 中生成整个句子。在每次迭代中，都会使用 `t–1`\
  \ 生成的解码器隐藏状态，并以类似的方式生成整个句子。批处理只能对固定大小的句子进行。为了让所有句子具有相同大小，进行了填充（padding）。序列的末尾由 `<EOS>`\
  \ 标记。\n\n### 带有批处理的编码器和解码器\n\n让我们从编码器开始；我们的编码器使用 `GRU` 作为 RNN 单元。编码器单元接受两个输入：输入和隐藏。输入的形状将是一个大小为\
  \ `[Batch_size, input_size]` 的张量，其中 `[64, 26]`。对于每个 batch，按行取出 64 个元素，并计算 28 维的嵌入。隐藏状态的形状将为\
  \ `[unidirectional, Batch_size, Hidden_size]`，其中 `[1, 64, 28]`。在这里，我们使用可训练的 PyTorch\
  \ 嵌入。嵌入层将把每个单词转换为固定大小的向量，因此嵌入层将为每个 batch 生成从 `[Batch_size, input_size]` 到 `[Batch_size,\
  \ input_size, Embed_size]` 的映射。因此，每个时间步输入 `[64, 1]`，它将被转换为 `[64, 1, 28]`。这意味着对于\
  \ 64 个句子，每个句子取一个单词，28 个维度代表每个单词：\n\n```python\nclass EncoderRNN(nn.Module):\n  \
  \  def __init__(self, input_size, hidden_size, n_layers=1):\n        super(EncoderRNN,\
  \ self).__init__()\n        self.n_layers = n_layers\n        self.hidden_size =\
  \ hidden_size\n        self.embedding = nn.Embedding(input_size, embed_size)\n \
  \       self.gru = nn.GRU(embed_size, hidden_size)\n\n    def forward(self, input,\
  \ batch_size, hidden):\n        embedded = self.embedding(input).unsqueeze(1) #Input\
  \ = 64 ---> #Output [64,1]\n        embedded = embedded.view(1, batch_size, embed_size)\
  \ #Input = [64, 1] --- > #Output = [1, 64, 28]\n        output = embedded\n    \
  \    output, hidden = self.gru(output, hidden)\n        return output, hidden #Output\
  \ 1, 64, 28 #encoder Hidden = 1, 64, 28\nENCODER = EncoderRNN(input_size,hidden_size)\n\
  ```\n\n### 解码器\n\n解码器单元接受两个输入：输入和隐藏。输入的形状将是一个大小为 `[Batch_size, input_size]` 的张量，其中\
  \ `[64, 52]`。隐藏状态的形状将为 `[unidirectional, Batch_size, Hidden_size]`，其中 `[1, 64, 28]`。编码器的最后一个隐藏状态将是解码器的第一个隐藏状态。在这里，我们使用可训练的\
  \ PyTorch 嵌入。嵌入层将把每个单词转换为固定大小的向量，因此它将为每个 batch 生成从 `[Batch_size, input_size]` 到\
  \ `[Batch_size, input_size, Embed_size]` 的映射。因此，每个时间步输入 `[64, 1]`，它将被转换为 `[64, 1,\
  \ 28]`。这意味着对于 64 个句子，每个句子取一个单词，28 个维度代表每个单词：\n\n（注：此处由于原文未提供代码块，此处根据逻辑描述，若原文有 Decoder\
  \ 代码请按格式保留。此处提供的翻译文本涵盖了描述部分）\n\n从 `[Batch_size, input_size]` 到 `[Batch_size, input_size,\
  \ Embed_size]` `[64, 1]` 转换为 `[64, 1, 28]`。这意味着对于 64 个句子，每个句子取一个单词，28 个维度代表每个单词：\n\
  \n（注：原文文本中 Decoder 部分描述与 Encoder 类似，翻译已根据原文逻辑对齐）\n\n（注：原文提供的待翻译文本中 Decoder 描述部分存在重复和逻辑断层，已忠实于原文进行翻译。）\n\
  \n\n\n\n为了不重复造轮，我将对 PyTorch 官方教程中的代码进行预处理。该代码是为了一次处理一个样本而编写的；在当前的食谱中，我们将对句子进行批处理。这需要代码进行非常小的更改以适应源句子和目标句子的填充（padding）。通过应用填充，源批次和目标批次将具有相同的大小。以源句子和目标句子的最大长度为参考，所有其他句子都被填充到与该句子相等。如果你在之前讨论的话题中仔细观察过\
  \ `random_batch` 函数，你会发现以下修改后的 `random_batch` 函数中为了批处理增加了一些内容。在下面的脚本中，高亮部分被更改为寻找最大长度：\n\
  \n```python\ndef pad_seq(seq, max_length):\n    seq += [0 for i in range(max_length\
  \ - len(seq))]\n    return seq\n\ndef random_batch(batch_size=3):\n    input_list\
  \ = []\n    target_list = []\n    # Choose random pairs\n    for _ in range(batch_size):\n\
  \        pair = random.choice(pairs)\n        input_list.append(input_lang.indexes_from_sentence(pair[0]))\n\
  \        target_list.append(output_lang.indexes_from_sentence(pair[1]))\n    # Sort\
  \ by length\n    tmp_pairs = sorted(zip(input_list, target_list), key=lambda p:\
  \ len(p[0]), reverse=True)\n    input_seqs, target_seqs = zip(*tmp_pairs)\n    #\
  \ For input and target sequences, get array of lengths and pad with 0s to max length\n\
  \    input_lengths = [len(s) for s in input_seqs]\n    target_lengths = [len(s)\
  \ for s in target_seqs]\n    max_input_target = max(input_lengths+target_lengths)\n\
  \    input_padded = [pad_seq(s, max_input_target) for s in input_seqs]\n    target_padded\
  \ = [pad_seq(s, max_input_target) for s in target_seqs]\n    # Create tensor using\
  \ padded arrays into (batch x seq) tensors\n    input_var = torch.LongTensor(input_padded,device\
  \ = device)\n    target_var = torch.LongTensor(target_padded, device = device)\n\
  \    return input_var, target_var\n```\n\n### 实现支持批处理的编码器/解码器\n\n让我们按照之前的格式继续。\n\
  \n### 编码器\n\n在编码器和解码器中，我使用了 dropout 作为额外的操作来添加正则化学习。此外，对 `(device)` 函数进行了另一项修改。正如第二章所讨论，在对象上附加\
  \ `.to(device)` 有助于将该对象/数据传输到 GPU，进一步的计算将在定义的设备上进行。如果没有可用 GPU，计算将在 CPU 上进行而不会产生错误。注意，这里的隐藏状态权重初始化是使用\
  \ `nn.init.xavier_normal_` 完成的。Xavier / Glorot 是一种与深度学习效果良好的权重初始化技术。你可以在研究论文“Understanding\
  \ the difficulty of training feedforward networks”中学习更多信息：\n\n```python\nclass EncoderRNN(nn.Module):\n\
  \    def __init__(self, input_size, hidden_size, n_layers=1):\n        super(EncoderRNN,\
  \ self).__init__()\n        self.n_layers = n_layers\n        self.hidden_size =\
  \ hidden_size\n        self.embedding = nn.Embedding(input_size, hidden_size)\n\
  \        self.gru = nn.GRU(hidden_size, hidden_size,num_layers=n_layers)\n     \
  \   self.drop = nn.Dropout(0.2)\n    def forward(self, input, batch_size, hidden,\
  \ training=True):\n        embedded = self.embedding(input).unsqueeze(1)\n     \
  \   if training == True:\n            embedded = self.drop(embedded)\n        embedded\
  \ = embedded.view(-1, batch_size, self.hidden_size)\n        output = embedded\n\
  \        output, hidden = self.gru(output, hidden)\n        return output, hidden\n\
  \nencoder = EncoderRNN(input_size, hidden_size, n_layers=1)\nencoder = encoder.to(device)\n\
  ```\n\n### 解码器\n\n这是一个使用 GRU 作为循环单元的常规解码器：\n\n```python\nclass DecoderRNN(nn.Module):\n\
  \    def __init__(self, hidden_size, output_size, n_layers=1):\n        super(DecoderRNN,\
  \ self).__init__()\n        self.n_layers = n_layers\n        self.hidden_size =\
  \ hidden_size\n        self.embedding = nn.Embedding(output_size, hidden_size)\n\
  \        self.gru = nn.GRU(hidden_size, hidden_size,num_layers = n_layers)\n   \
  \     self.out = nn.Linear(hidden_size, output_size)\n        self.softmax = nn.LogSoftmax(dim=1)\n\
  \        self.drop = nn.Dropout(0.2)\n    def forward(self, input, batch_size, hidden,\
  \ training=True):\n        embedded = self.embedding(input)\n        if training\
  \ == True:\n            embedded = self.drop(embedded)\n        output = embedded.view(-1,\
  \ batch_size, self.hidden_size)\n        output, hidden = self.gru(output, hidden)\n\
  \        output = self.softmax(self.out(output))\n        return output, hidden\n\
  \ndecoder = DecoderRNN(hidden_size, output_size, n_layers=1)\ndecoder = decoder.to(device)\n\
  ```\n\n### 序列的损失函数\n\n正如之前讨论的，批处理中的句子长度是不相同的。为了解决这个问题，我们需要对源句子和目标句子进行填充。通过应用填充，源批次和目标批次将具有相同的大小。以源句子和目标句子的最大长度为参考，所有其他句子都被填充到与该句子相等。如果你在之前讨论的话题中仔细观察过\
  \ `random_batch` 函数，你会发现以下修改后的 `random_batch` 函数中为了批处理增加了一些内容。在下面的脚本中，高亮部分被更改为寻找最大长度：\n\
