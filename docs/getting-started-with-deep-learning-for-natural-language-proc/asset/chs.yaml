  任何检查点都可以用于文本转语音合成，如下：\n\n```bash\npython synthesis.py${checkpoint_path.pth} ${text_list.txt}\
  \ ${output_dir} --preset=<>\n```\n\n如果你有有限的数据，可以加载预训练模型并微调你的数据集：\n\n| `URL` | `Model`\
  \ | `Data` | `Hyperparameters` | `Steps` |\n| :--- | :--- | :--- | :--- | :--- |\n\
  | `https://www.dropbox.com/s/5ucl9remrwy5oeg/20180505_DeepVoice3_checkpoint_step000640000.pth`\
  \ | `DeepVoice3` | `LJSpeech` | `https://www.dropbox.com/s/0ck82unm0bo0rxd/20180505_DeepVoice3_ljsech.json?dl=0`\
  \ | `640k` |\n| `https://www.dropbox.com/s/1y8bt6bnggbzzlp/20171129_nyanko_checkpoint_step000585000.pth`\
  \ | `Nyanko` | `LJSpeech` | `builder=nyanko, preset=nyanko_ljsech` | `585k` |\n\
  | `https://www.dropbox.com/s/1y8bt6bnggbzzlp/20171129_nyanko_checkpoint_step000585000.pth`\
  \ | `Multi-speaker DeepVoice3` | `VCTK` | `builder=DeepVoice3_multispeaker, preset=DeepVoice3_vctk`\
  \ | `300k+300k` |\n\n\n\n\n\n要使用此预训练模型，你必须检出特定的 `git` 提交，如下：\n\n```bash\ngit checkout\
