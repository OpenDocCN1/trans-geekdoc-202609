  \ 3` 具有以下依赖项，必须在继续之前安装：\n\n*   Python 3\n*   `CUDA` >= `8.0`\n*   `PyTorch` `>=`\
  \ `v0.4.0`\n*   `nnmnkwii` `>=` `v0.0.11`\n\n然后，你需要克隆仓库并安装包：\n\n```bash\ngit clone\
