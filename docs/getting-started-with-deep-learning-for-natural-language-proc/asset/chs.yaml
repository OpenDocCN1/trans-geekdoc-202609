  \ `CH8/siamese.ipynb` 中。\n\n或者，也可以使用 `斯坦福自然语言推理` (`SNLI`) 数据集。SNLI 包含 57 万对人工策选的句子，标签为蕴含（entailment）、矛盾（contradiction）和中立（neutral）。`自然语言推理`\
  \ (`NLI`) 任务也称为 `文本蕴含识别` (`RTE`)。SNLI 数据集的 U-net 是另一种革命性的架构；它用于生物医学图像分割。该模型是独特的，因为它在两个分支之间通过跳跃连接连接了卷积层。每个分支都有四个卷积层，它们会逐渐压缩给定图像，然后将其解压缩到原始形状，但生成的是分割图。\n\
