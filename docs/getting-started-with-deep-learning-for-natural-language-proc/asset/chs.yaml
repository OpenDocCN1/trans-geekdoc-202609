  \n# 构建文本摘要引擎\n\n文本摘要是将大型文档转换为较小文档的同时保持其含义完整的方法。摘要技术有两种类型：\n\n*   **抽取式摘要（Extractive\
  \ summarization）**：从给定文本中选择最重要的句子，使得提取的句子代表相同的含义。\n\n*   **生成式摘要（Abstractive summarization）**：生成式摘要是一种生成技术，算法首先遍历整个文档，然后对文本进行总结。在这里，算法重写整个摘要，而不是仅仅复制句子。生成式摘要可以使用\
  \ `LSTM`、`CNN + LSTM` 以及其他生成模型等算法完成。\n\n根据涉及文档的数量，文档分类可以分为两种：\n\n*   **单文档摘要**：涉及对单个文档进行摘要，抽取式摘要在这里通常表现更好。\n\
  \n*   **多文档摘要**：涉及从多个文档中准备摘要。总结多个文档的主要问题有：\n\n    1.  摘要文本中的重复。\n    2.  丢失局部的、段落层面的上下文。\n\
  \    3.  需要大量数据进行摘要训练。\n    4.  算法需要记住大量数据，因此需要更庞大的模型。\n\n在本食谱中，我们将通过详细的算法实现理解抽取式摘要的工作原理。文本摘要的流行算法之一是\
  \ `text rank`。Text rank 是一种用于文本摘要的抽取式无监督技术。`page rank` 算法启发了 `text rank`。`page rank`\
  \ 用于 `Google` 等搜索引擎开发。让我们看看 page rank 如何工作。例如，我们有五个页面，它们之间有一些超链接。超链接是在两个页面之间导航的一种。页面的连接性根据它们之间存在的链接数量定义。例如，假设我们在五个页面中有以下链接。这些页面的排名可以使用\
  \ `Pagerank` 算法根据它们之间存在的多个链接来定义。五个页面之间的连接性可以用概率表示，这种概率可以很容易用一个 `5*5` 的矩阵表示，如所有概率所示。没有连接的页面被称为\
  \ `dangling`（悬挂节点）。\n\n![TextRank](img/TextRank.jpg)\n\n五个页面之间的连接性可以用概率表示，这种概率可以很容易用一个\
  \ `5*5` 的矩阵表示，如所有概率所示。没有连接的页面被称为 `dangling`。\n\n`Pagerank` 算法被应用于图：\n\n```\nnx_graph\
  \ = nx.from_numpy_array(sim_mat)\nscores = nx.pagerank(nx_graph)\n```\n\n五个页面之间的连接性可以用概率表示，这种概率可以很容易用一个\
  \ `5*5` 的矩阵表示，如所有概率所示。没有连接的页面被称为 `dangling`。\n\n`Pagerank` 算法被应用于图：\n\n```python\n\
  nx_graph = nx.from_numpy_array(sim_mat)\nscores = nx.pagerank(nx_graph)\n```\n\n\
  五个页面之间的连接性可以用概率表示，这种概率可以很容易用一个 `5*5` 的矩阵表示，如所有概率所示。没有连接的页面被称为 `dangling`。\n\n生成式摘要算法被应用。可以通过以下方式完成：\n\
  \n```python\nsentence_vectors = []\nfor each_sent in clean_sentences:\n    if len(each_sent)\
  \ != 0:\n        v = sum([word_embeddings.get(word, np.zeros((100,))) for word in\
  \ each_sent.split()])/(len(each_sent.split())+0.001)\n    else:\n        v = np.zeros((100,))\n\
  sentence_vectors.append(v)\n```\n\n`sentence_vectors` 变量将持有句子的向量。\n\n*   **相似性矩阵准备**：\n\
