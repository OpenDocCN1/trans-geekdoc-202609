  \n## 结论\n\n在本章中，我们向复杂网络又迈进了一小步。通过本章，我们对图像描述所需的所有组件有了深入的了解。此后，你可以实现以下任何一种模型。\n\n\n\
  \n\n假设有一家假酒店正在与品牌酒店竞争，每当它进行清关时，酒类检验员都会识别出它是假的并将其退回。如果生产的酒非常接近真酒，以至于检验员无法识别并进入市场，那么酒店就能获得更多收入。如果检验员能够正确识别出真酒并拒绝假酒，他们就能获得激励。随着时间的推移，假酒店变得越来越丰富，制作出接近真酒的样本。与此同时，检验员也积累了关于如何识别假品样本的经验。现在，假酒厂必须制造出尽可能接近真酒的酒，而检验员的工作是积累足够的经验，以确保没有假样本通过测试。为了生成尽可能接近真实的样本，酒水需要所有成分的比例都正确。检验员的工作是通过拒绝错误的样本和接受正确的样本来提供持续反馈。在\
  \ GAN 中，生成器等同于假酒店，而判别器等同于检验员。在接下来的章节中，我们将探索 GAN 的整体架构。\n\n## GAN 组件\n\n让我们来了解 GAN\
  \ 的各种组件。\n\n## 生成器\n\n生成器的功能是使用具有正态分布或均匀分布的随机向量生成图像样本。以 `z` 为输入，我们使用生成器 `G` 创建图像\
  \ `x`。在数学上，这可以表示为 `x = G(z)`。`X` 可以是任何东西；可以是演员的脸、咖啡杯，或者 MNIST 数据集中的任何数字。生成器最初生成随机噪声，但随着时间的推移，它会收到判别器的反馈并生成所需的内容。在这里，生成器是由深度神经网络组成的魔法函数，如下所示：\n\
  \n![](img/generator.jpg)\n\n**图 9.1：** 生成器网络接受任何噪声输入（潜在随机变量）并在输出端提供图像。\n\n生成器可以由前馈网络、CNN\
  \ 或两者的结合组成。带有 RNN 单元的生成器网络很罕见，目前正在进行将 GAN 应用于语言/语音数据的研究。\n\n## 判别器\n\n判别器是一个类似的网络，但它会逐渐缩小图像尺寸并将其归为两类中的任何一。判别器的作用是将图像分类为假或真。它看起来可能这样：\n\
  \n![](img/discriminator.jpg)\n\n**图 9.2：** 具有 CNN 层的判别器网络。\n\n判别器接收真实或假图像并识别它们。判别器\
  \ `D` 接收图像 `x`（真/假）并输出概率 `ŷ`，分别指示图像是真实的还是假的。在数学上，这可以表示为 `ŷ = D(x)`。理想情况下，提供给判别器的生成器生成的图像概率应趋向于零，而提供给判别器的真实图像概率应为\
  \ 1。\n\n## GAN 架构\n\n整体架构包含一个生成器和一个判别器。此外，该架构具有一种机制向判别器提供真实或假图像，以及一个自定义的损失函数。我们将在后续食谱中查看自定义损失函数。网络的示意图如下：\n\
  \n![](img/GAN.jpg)\n\n**图 9.3：** 显示 GAN 架构由生成器和判别器组成。\n\n生成器接收随机向量或潜在随机变量并生成图像（此图像被称为假——因为它是由生成器生成的）。真实图像和假图像被提供给判别器，判别器的工作是正确识别它们。训练生成器以生成图像，以便欺骗判别器。\n\
  \n### 损失函数\n\nGAN 是为了二分类进行训练的，我们通常经常使用二交叉熵损失。对于二分类，交叉熵的泛化可以表示为：`p log(q) + p log(1\
  \ – q)`。\n\n同样，对于判别器，损失给出如下：\n\n![](img/158C9Eq1.jpg)\n\n对于生成器，损失给出如下：\n\n![](img/158C9Eq2.jpg)\n\
  \n带有流向生成器或判别器的损失的整体架构可以如下：\n\n![](img/GAN_with_loss.jpg)\n\n**图 9.4：** 前向传播后，损失反向传播到判别器和生成器。\n\
  \n在下一个食谱中，我们将看到如何如何在 MNIST 数据上训练一个非常简单的 GAN 模型。\n\n从网络本身来看，很明显生成器要做的工作量比判别器多。在训练的早期阶段，判别器区分真假图像总是更容易的。结果是判别器很容易被训练，判别器损失迅速下降到零。因此，梯度在判别器处迅速消失，导致生成器的训练变得不可能。此外，生成器生成的图像无法通过判别器，生成器的损失逐渐增加。这种现象被称为模式崩溃（mode\
  \ collapse）。我们将看到先进架构是如何处理模式崩溃的。由于由于，训练 GAN 非常困难。此外，GAN 对超参数非常敏感。当我们通过追踪生成器损失来实现\
  \ RNN 时，我们将看到模式崩溃是如何。\n\n查看 Generative Adversarial Nets：`[`papers.nips.cc/paper/5423-generative-adversarial-nets.pdf`](https://papers.nips.cc/paper/5423-generative-adversarial-nets.pdf)`。\n\
  \n### 为 MNIST 实现 GAN\n\n在在上一个食谱中，我们看到了构建 GAN 架构的各种构建模块。在这个食谱中，我们将使用 MNIST 数据集并设计带有生成器和判别器的\
  \ GAN。我们还将理解如何实现损失函数并向判别器提供假图像和真图像。\n\n你可能知道 MNIST 数据集；这是一个包含 0-9 手写数字的数据，拥有 60,000\
  \ 个训练样本和 10,000 个测试样本。通常 GAN 的架构中包含卷积层，但为了简单起见，我们在演示中仅使用全连接层。\n\n以下步骤说明了如何使用 GAN\
  \ 生成 MNIST：\n\n*   **数据**：每个 MNIST 图像的大小为 28*28，因为我们将使用全连接层，所以我们将这些图像展平为 784。\n\
  *   **生成器**：生成器看起来如代码块所示。生成器接收大小为 100 的随机向量，并具有三个全连接层；每一层随后扩大输入形状和输出形状 784，以便形成大小为\
  \ (28*28) 的图像。这是生成器生成的图像。\n*   **判别器**：它接收大小为 784 的图像，并通过通过 3 个全连接层逐渐缩小到 1。如果输出概率趋向\
  \ 1，则输入图像分类为真，否则分类为假。\n*   **训练过程**：整体训练过程包含以下步骤以及相应的代码：\n\n    1.  生成大小为 100 的随机向量：\n\
  \n        ```\n        noise = Variable(torch.randn(images.size(0), 100).cuda())\n\
  \        ```\n\n    2.  通过通过生成器生成假图像，并为这些图像生成全零标签：\n\n        ```\n        fake_images\
  \ = generator(noise)\n        fake_labels = Variable(torch.zeros(images.size(0)).cuda())\n\
  \        ```\n\n\n\n\n### 3. 使用带有标签的伪图像和带有标签的真实图像训练判别器\n\n训练后，判别器提供 `d_loss`，它是真实图像和伪图像产生的损失之和。该函数还提供了\
  \ `real_score` 和 `fake_score`。前者表示判别器对带有原始标签图像的预测；理想情况下，该输出应该接近 1。后者表示判别器对带有伪标签图像的预测；理想情况下，该输出应该接近\
  \ 0。监控 `real_score` 和 `fake_score` 可以很好地了解判别器的收敛情况：\n\n```python\ndeftrain_discriminator(discriminator,\
  \ images, real_labels, fake_images, fake_labels):\n    discriminator.zero_grad()\n\
  \    outputs = discriminator(images)\n    real_loss = criterion(outputs, real_labels)\n\
  \    real_score = outputs\n    outputs = discriminator(fake_images)\n    fake_loss\
  \ = criterion(outputs, fake_labels)\n    fake_score = outputs\n    d_loss = real_loss\
  \ + fake_loss\n    d_loss.backward()\n    d_optimizer.step()\n    returnd_loss,\
  \ real_score, fake_score\n```\n\n### 4. 生成器随后生成伪图像\n\n这些图像的标签全为 1（判别器应将所有图像视为真实图像，以便损失为\
  \ 0）。这些伪图像被传递给判别器，判别器生成的输出与原始标签被用于损失计算。根据生成器并提供给判别器的图像以及判别器预测的标签，计算生成器损失 `g_loss`：\n\
  \n```python\nnoise = Variable(torch.randn(images.size(0), 100).cuda())\nfake_images\
  \ = generator(noise)\noutputs = discriminator(fake_images)\ng_loss = train_generator(generator,\
  \ outputs, real_labels)\n```\n\n整体训练过程总结如下：\n\n```python\nfor epoch in range(num_epochs):\n\
  \    for n, images in enumerate(train_loader(batch_size=100)):\n        images =\
  \ Variable(images.cuda())\n        real_labels = Variable(torch.ones(images.size(0)).cuda())\n\
  \        # 从生成器采样\n        noise = Variable(torch.randn(images.size(0), 100).cuda())\n\
  \        fake_images = generator(noise)\n        fake_labels = Variable(torch.zeros(images.size(0)).cuda())\n\
  \        # 训练判别器\n        d_loss, real_score, fake_score = train_discriminator (discriminator,\
  \ images, real_labels, fake_images, fake_labels)\n        # 再次从生成器采样并获取判别器的输出\n\
  \        noise = Variable(torch.randn(images.size(0), 100).cuda())\n        fake_images\
  \ = generator(noise)\n        outputs = discriminator(fake_images)\n        # 训练生成器\n\
  \        g_loss = train_generator(generator, outputs, real_labels)\n```\n\n训练几次迭代后，生成器生成了以下样本。进一步训练可能会带来更好的结果。\n\
  \n![](img/generated.jpg)\n**图 9.5:** 生成器生成的样本。\n\n整体训练过程总结如下：\n\n（注：提供的文本在后半部分包含大量重复和碎片化的句子。我根据提供的工程规则清理了核心逻辑和结构流。）\n\
  \n\n\n\n双方都在试图破坏对方，而当一个玩家无论另一个玩家如何都不改变其动作时，就出现了纳什均衡。为了理解前面的方程，让我们来看一个由玩家 `A` 和 `B`\
  \ 控制 `x` 和 `y` 值的简单方程；方程如下：\n\n![](img/158C9Eq4.jpg)\n\n其中，玩家 `A` 想要最小化而玩家 `x` 想要最大化\
  \ `xy` 的值。在这种情况下，纳什均衡出现在 `x=y=0` 时，因为这是对手动作不发生改变的状态。\n\n### 特征匹配 (Feature matching)\n\
  如前所述，GAN 的概念基于极大极小博弈游戏，两个对手试图击败对方。在这场游戏中，判别器往往变得过于强大并击败生成器。为了击败判别器，生成器变得过于贪婪。它只生成极少数类非常真实的图像，导致判别器无法识别差异并失败，这就是模式崩溃（mode\
  \ collapse）背后的主要原因。模式崩溃的发生是因为生成器的目标仅仅是生成真实的图像并击败判别器（仅仅为了正确分类一个类别）。为了解决这个问题，生成器的代价函数被更改为额外最小化生成图像与真实图像特征之间的统计差异。通常，我们测量生成图像特征值与真实图像特征值之间的\
  \ `L2` 差异。这种差异是在判别器的几个分类层之前计算的。在数学上，它表示为：`||f(x) – f(G(z))||[2]²`，其中 `f(x)` 是判别器分类层前一层提取的特征向量。这里给出了特征匹配\
  \ GAN 的伪代码：\n\n```\nimport torch\nfrom torch import nn\n\n### 我们保持判别器尽可能简单\nclass\
  \ Discriminator(nn.Module):\n    def __init__(self, input_size, num_features):\n\
  \        super().__init__()\n        self.features = nn.Linear(input_size, num_features)\n\
  \        self.classifier = nn.Sequential(\n            nn.Linear(num_features, 2),\n\
  \            nn.Sigmoid()\n        )\n    def forward(self, x):\n        # 我们同时返回输出和特征\n\
  \        feature = self.features(x)\n        class_ = self.classifier(f)\n     \
  \   return class_, feature\n\n### 准则\nfeature_matching_criterion = nn.MSELoss()\n\
  fake_samples = G(noise) # 生成器生成的伪数据\nreal_samples = … # 真实数据\nfake_prediction, fake_features\
  \ = D(fake_samples)\nreal_prediction, real_features = D(real_samples)\n### 现在，计算新的目标\n\
  loss = feature_matching_criterion(fake_features, real_features)\nloss.backward()\n\
  ```\n\n与所有其他网络一样，这并没有解决问题，而是稳定了训练。\n\n### 小批量判别 (Minibatch discrimination)\n当模式崩溃发生时，生成器会合成所有本质上相似的图像。为了检测模型崩溃并惩罚生成器，需要确定生成器生成的图像之间的相似性。当模型崩溃开始时，判别器生成的所有图像都是相似的，因此判别器可以使用此分数来惩罚通过模式崩溃进行作弊的生成器。\n\
  \n![](img/discriminator_mini_batch_discrimination.jpg)\n\n**图 9.7：** 显示了判别器中应用魔术以计算批内相似性\
  \ `a(x[i])[b]` 的位置。这种批内相似性作为额外特征传递给下一层。它有助于判别器确定是否发生了模式崩溃。\n\n小批量判别应用于判别器中。假设它表示某些层中输入\
  \ `x[i]` 的向量和大小。那么，将此 `f(x[i])` 与张量 `T∈![](img/r.jpg)^(A×B×C)*` 相乘，得到测量值 `m[i]∈![](img/r.jpg)^(BC)*`。计算\
  \ `x[i]` 与批中所有其他图像之间的距离，并应用负指数，对于批 `B` 计算结果为 `cb = exp(–||Mi,b – Mj,b||) ∈![](img/r.jpg)`。`x[i]`\
  \ 与所有其他图像之间的这种差异计算为：`a(X[i])[b] = ∑[j][=1]^n cb∈![](img/r.jpg)`。该特征逐层与真实输出进行拼接，判别器的其余部分按原样工作。正是这种判别器内部创建的额外特征，使其能够更好地识别模式崩溃。小批量判别与特征判别结合效果更好。\n\
  \n### 单侧标签平滑 (One-sided label smoothing)\n深度学习算法倾向于观察置信度并观察某些关键特征得出结论。在 GAN 中，当判别器变得依赖于某些特征时，也可能发生这种情况，生成器可能只生成那些特征。这将损害性能。为了检查这一点，当真实图像的预测超过\
  \ 0.9 时，通过将目标水平设置为 0.9 而不是 1.0 来惩罚判别器：\n\n```python\n# 使用 0.9 代替 1.0。\nreal_label\
  \ = [[0, 0, 0, 0.9, 0, 0, 0, 0, 0, 0]] # 标签为“3”的图像\n# predict_real_image 是判别器为真实图像计算的逻辑（logits）。\n\
  discriminator_real_loss = tf.nn.BCELoss(labels=p, logits=predict_real_image)\n```\n\
  \n\n\n\n在在上一个教程中，我们通过向生成器注入随机噪声来生成 MNIST 数字。这是一个非常原始的架构，包含一个生成器和一个判别器。人类可以推断出 GAN\
  \ 生成的图像。这种网络的输出是不可控的，因为我们没有在随机向量与生成输出之间建立映射关系。因此，条件 GAN（Conditional GAN）的概念被提出的。在本教程中，我们将从思维过程中汲灵感，学习条件\
  \ GAN 的架构是如何开发的。本章也将帮助你理解发明更优架构的过程。\n\n# 条件 GAN (GAN-CLS)\n\n条件 GAN 意味着我们可以通过向生成器和判别器应用新的条件来使网络条件化，网络将生成相同的内容以减少损失。这样，我们就可以控制网络应该生成什么。条件可以是文本描述或类别标签。在本教程中，我们将讨论\
  \ GAN-CLS 算法。GAN-CLS 的网络图如下：\n\n![](img/gan-cls.jpg)\n\n**图 9.8：** GAN-CLS 示意图。\n\
  \n该网络基于`深度卷积生成对抗网络`（`DC-GAN`）。在此基础上增加了一个根据文本对网络进行条件化的额外部分。文本特征通过混合字符级卷积神经网络进行编码。这些编码后的文本特征被添加到生成器的输入和判别器的输出中。除了随机向量（潜随机变量）外，还附带有文本嵌入变量。这将有助于生成器根据描述生成图像。生成的图像（称为假图像）被传递给判别器，判别器应该将其识别为假。\n\
  \n*   如果判别器将生成的图像识别为假，则损失将回传给生成器，生成器将学习生成更好的图像。\n*   如果判别器将其识别为真实图像，则说明生成器表现良好。\n\
  \n这就是生成器的训练方式。\n\n判别器也经过训练以识别真实和伪图像，为了做到这一点，生成器提供了三种样本。这里提到了样本类型以及判别器的预期预测结果：\n\n\
  | 值 1 | 值 2 | 预期标签 | 直觉理解 |\n| --- | --- | --- | --- |\n| 真实图像 | 正确文本 | 1 | 判别器训练用于识别正确的图像和正确的文本。\
  \ |\n| 真实图像 | 错误文本 | 0 | 判别器训练用于识别正确的图像和错误的文本。 |\n| 假图像 | 正确文本 | 1 | 判别器训练用于将生成器生成的图像和正确的文本识别为假的。\
  \ |\n\n**表 9.1**\n\n在预期标签和预测标签之间计算二元交叉熵损失，并将其反向传播到生成器和判别器。下一节将提供 GAN-CLS 所有关键组件的代码片段，并附带详细解释。\n\
  \n在 GAN-CLS 中，整体训练范式与我们之前用于训练 MNIST 的 GAN 相同。唯一的区别在于判别器和损失函数。在下一节中，我们将通过以下子主题理解\
  \ GAN-CLS：\n\n## 理解生成器\n\n此类文本特征 `t` 被附加到随机噪声 `z` 上，并添加到生成器网络中。它确保了网络根据我们想要生成的内容进行了预处理。正如网络所示，`self.projection`\
  \ 变量是一个较小的顺序块。这里给出了使用 PyTorch 实现的 GAN-CLS 生成器网络架构。生成器主要由带有上采样和批归一化操作的卷积层组成。GAN-CLS\
  \ 的生成器与典型的 GAN 生成器没有区别，区别在于输入处将文本的嵌入向量添加到了随机向量中。在以下代码中，`self.projection` 变量拥有嵌入向量，变量\
  \ `z` 具有随机值：\n\n```python\nclass generator(nn.Module):\ndef __init__(self):\n  \
  \  super(generator, self).__init__()\n    self.image_size = 64\n    self.num_channels\
  \ = 3\n    self.noise_dim = 100\n    self.embed_dim = 1024\n    self.projected_embed_dim\
  \ = 128\n    self.latent_dim = 128\n    self.ngf = 64\n    self.projection = nn.Sequential(\n\
  \        nn.Linear(self.embed_dim, self.projected_embed_dim),\n        nn.BatchNorm1d(self.projected_embed_dim),\n\
  \        nn.LeakyReLU(negative_slope=0.2, inplace=True)\n    )\n    self.netG =\
  \ nn.Sequential(\n        nn.ConvTranspose2d(self.latent_dim, self.ngf, 4, 1, 0),\n\
  \        nn.BatchNorm2d(self.ngf),\n        nn.ReLU(inplace=True),\n        nn.ConvTranspose2d(self.ngf,\
  \ self.ngf * 2, 4, 2, 1),\n        nn.BatchNorm2d(self.ngf * 2),\n        nn.ReLU(inplace=True),\n\
  \        nn.ConvTranspose2d(self.ngf * 2, self.ngf * 4, 4, 2, 1),\n        nn.BatchNorm2d(self.ngf\
  \ * 4),\n        nn.ReLU(inplace=True),\n        nn.ConvTranspose2d(self.ngf * 4,\
  \ self.num_channels, 4, 2, 1),\n        nn.Tanh()\n    )\ndef forward(self, embed_vector,\
  \ z):\n    projected_embed = self.projection(embed_vector).unsqueeze(2)\n    latent_vector\
  \ = torch.cat([projected_embed, z], 1)\n    output = self.netG(latent_vector)\n\
  \    return output\n```\n\n## 理解判别器\n\n文本特征也会附加到判别器的输出输出，然后应用最终转换来预测其为假或真。这里是使用\
  \ PyTorch 实现的 GAN-CLS 判别器架构：\n\n```python\nclass discriminator(nn.Module):\ndef\
  \ __init__(self):\n    super(discriminator, self).__init__()\n    self.image_size\
  \ = 64\n    self.num_channels = 3\n    self.embed_dim = 1024\n    self.projected_embed_dim\
  \ = 128\n    self.ngf = 64\n    self.B_dim = 128\n    self.C_dim = 16\n    self.netD_1\
  \ = nn.Sequential(\n        nn.Conv2d(self.num_channels, self.ngf, 4, 2, 1),\n \
  \       nn.LeakyReLU(negative_slope=0.2, inplace=True),\n        nn.Conv2d(self.ngf,\
  \ self.ngf * 2, 4, 2, 1),\n        nn.BatchNorm2d(self.ngf * 2),\n        nn.LeakyReLU(negative_slope=0.2,\
  \ inplace=True),\n        nn.Conv2d(self.ngf * 2, self.ngf * 4, 4, 2, 1),\n    \
  \    nn.BatchNorm2d(self.ngf * 4),\n        nn.LeakyReLU(negative_slope=0.2, inplace=True),\n\
  \        nn.Conv2d(self.ngf * 4, self.ngf * 8, 4, 2, 1),\n        nn.BatchNorm2d(self.ngf\
  \ * 8),\n        nn.LeakyReLU(negative_slope=0.2, inplace=True)\n    )\n    self.projector\
  \ = Concat_embed(self.embed_dim, self.projected_embed_dim)\n    self.netD_2 = nn.Sequential(\n\
  \        nn.Conv2d(self.ngf * 8 + self.projected_embed_dim, 1, 4, 1, 0),\n     \
  \   nn.Sigmoid()\n    )\ndef forward(self, inp, embed):\n    x_intermediate = self.netD_1(inp)\n\
  \    x = self.projector(x_intermediate, embed)\n    x = self.netD_2(x)\n    return\
  \ x.view(-1, 1).squeeze(1), x_intermediate\n```\n\n\n\n\n\n*   **生成器损失 (generator\
  \ loss)**：基于生成器生成的被判别器识别为假的样本计算。如果生成器生成的样本被判别器标记为真实，则生成器没有损失；否则，生成器将受到惩罚：\n\n```python\n\
  class generator_loss(torch.nn.Module):\n    def __init__(self):\n        super(generator_loss,\
  \ self).__init__()\n        self.estimator = nn.BCELoss()\n\n    def forward(self,\
  \ fake):\n        batch_size = fake.size()[0]\n        self.labels = Variable(torch.FloatTensor(batch_size).cuda().fill_(1))\n\
  \        return self.estimator(fake, self.labels)\n```\n\n*   **判别器损失 (discriminator\
  \ loss)**：判别器计算三种损失：\n\n    1. 正确文本的真实图像 - A\n    2. 错误文本的真实图像 - B\n    3. 正确文本的伪图像（生成）\
  \ - B\n\n这三张图像以不同的组合组合并返回判别器。在这里，我们使用二元交叉熵（Binary Cross Entropy）作为损失函数。在以下实现中，这些损失组合为\
  \ `d_loss = A + 0.5*B +C`：\n\n```python\nclass discriminator_loss(torch.nn.Module):\n\
  \    def __init__(self):\n        super(discriminator_loss, self).__init__()\n \
  \       self.estimator = nn.BCELoss()\n\n    def forward(self, real, wrong, fake):\n\
  \        batch_size = real.size()[0]\n        self.real_labels = Variable(torch.FloatTensor(batch_size).cuda().fill_(1))\n\
  \        self.fake_labels = Variable(torch.FloatTensor(batch_size).cuda().fill_(0))\n\
  \        return self.estimator(real, self.real_labels) + 0.5 * (self.estimator(wrong,\
  \ self.fake_labels) + self.estimator(fake, self.fake_labels))\n```\n\n生成对抗文本到图像合成论文的完整实现请见\
  \ [`github.com/aelnouby/Text-to-Image-Synthesis`](https://github.com/aelnouby/Text-to-Image-Synthesis)。理解给出的描述可以让你更容易理解\
  \ GitHub 上的实现。\n\n前面的实现可以应用于鸟类、花卉数据集。此外，在此实现中有针对性地使用了 LeakyReLu 激活函数。Leaky ReLU\
  \ 可以稳定 GAN；你可以替换此激活函数并尝试任何其他激活函数作为实验的一部分。\n\n查看以下链接：\n\n*   生成对抗文本到图像：[`arxiv.org/pdf/1605.05396.pdf`](https://arxiv.org/pdf/1605.05396.pdf)\n\
  *   使用改进的 GAN-CLS 算法从文本描述生成对应的图像：[`arxiv.org/pdf/1806.11302.pdf`](https://arxiv.org/pdf/1806.11302.pdf)\n\
  \n## 结论\n\n生成网络正在引领人工智能和深度学习的下一波浪。尽管关于 GAN 和文本的讨论非常少，但它确实在以非常快的速度进化。在本章中，我们理解了 GAN\
  \ 的基本理论，并使用 MNIST 数据集实现了一个非常小的模型。此外，我们还理解了 GAN 由于其极小优化性质而产生的不稳定性，以及收敛此类网络的可能解决方法。随后，我们看到了如何根据描述生成图像，这也是卷积和循环网络结合使用完成任务的一个示例。\n\
  \n在下一章中，我们将涵盖语音处理技术。\n\n# 第 10 章：语音处理技术\n\n在本章中，我们将探索一个深度学习被广泛使用的重要且新的领域——语音处理。语音也与自然语言处理相关，因为它具有时间域。在语音中，一切都与文本有关，并且取决于上下文。当我们面对处理不同语言的文本时遇到问题时，这些问题在语音处理中达到了新的高度。语音在口音和语言方面面临挑战。尽管存在这些挑战，市场上仍然充斥着如\
  \ Siri、Alexa、Google Home 和 Cortana 等个人助手。这些设备随着新技术的出现每天变得更好。本章将向你介绍声音单元、读取声音的技术以及特征提取。本章将使用\
