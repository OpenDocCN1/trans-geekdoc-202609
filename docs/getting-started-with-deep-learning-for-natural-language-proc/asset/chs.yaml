  \ 中。\n\n- 比较带有注意力机制和不带注意力机制的模型。\n- 设计一个结合了词级和字符级特征的集成模型，看看效果是否更好。\n- NER 任务有许多可用数据集，以下列出了几个。使用这些数据集并保持可学习的嵌入，因为很难找到德语和葡萄牙语的预训练嵌入。查看你的分类器在这些数据集上是否收敛：\n\
  \    1. W-NUT2017\n    2. GermEval2014\n    3. Europeana Newspapers\n- 命名识别近期进展综：[`www.acl.org/anthology/182`](https://www.acl.org/anthology/182)\n\
  \n\n\n\nSentencePiece 是一种基于神经网络的分词（tokenization）和解词（de-tokenization）技术，通常用于词汇量限制是重要因素的神经网络语言生成任务。SentencePiece\
  \ 允许我们构建一个不依赖于特定语言的前后处理的端到端系统。它使用了 `bit pair encoding`（字节对编码）和 `unigram language\
  \ model`（单字母语言模型）。SentencePiece 与 `subword-nmt` 和 `WordPiece` ，但它更先进。SentencePiece\
  \ 中使用的字节对编码算法与原始的字节对编码算法略有不同。在本教程中，我们将理解字节对编码和单字母语言模型如何帮助设计 SentencePiece。\n\nSentencePiece\
  \ 算法具有许多出色的特性，其中一些如下：\n\n### 预定义了许多唯一标记\n在普通分词中，最终词表是无限的，通常通过设置阈值来限制最终词表。这会导致信息丢失；特别是稀有词，会变成一个\
  \ token。否则，标准的分词技术具有无限的 token。使用 SentencePiece，最终的 token 大小是预先指定的，算法会在训练过程中相应执行。\n\
  \n### 从句子开始训练\n像 `subword-nmt` 和 `WordPiece` 这样的子词技术需要预分词的句子。SentencePiece 在不需要预分词句子的情况下工作，并允许适用于中文和日语等没有显式分词规则的语言。\n\
  \n### 空格处理方式不同\n在标准的分词技术中，单词“hello world”被分分为以下三个 token `[“Hello”, “world”, “.”]`。这种方法是不可逆的，因为解词无法产生原始\
  \ token。分词后（`hello world.`） != 解词后（[“`Hello`, `world`, `.`”]）。SentencePiece 将字符串视为\
  \ Unicode 序列，空格也被视为 Unicode 字符之一。在 SentencePiece 中，空格被替换为“_ ”字符，即 Unicode 中的 U+2581。根据\
  \ SentencePiece 的处理，单词“hello world”将被处理为 \"Hello world.\"→\"Hello_world.\"→[\"Hello][_wor][ld][.]。由于保留了空格，我们可以无任何歧义地解词文本，如下：\n\
  \n```python\ndetokenized = ''.join(\\[\"Hello\",\"\\_wor\",\"ld\",\\[\".\"\\]\\\
  ]).replace('\\_',' ')\n```\n\n同样，中文可以如下所示进行分词；记得中文单词之间没有显式的空格![](img/Capture.jpg)\n\
  \n### 子词正则化\n这是一种通过子词采样虚拟增强训练数据的技术。它有助于增强自然机器翻译模型的鲁健性。SentencePiece 的显著特征列如下：\n\n\
  *   **纯数据驱动**：不需要中间预处理技术。\n*   **语言无关性**：不需要针对特定语言的预处理；它可以应用于任何语言。\n*   **自包含性**：只要使用相同的模型，就可以以确定性的方式获得分词和解词。\n\
  *   **词表 ID 生成**：Sentence Piece 管理词表，并可以直接从原始句子生成词表 ID 序列。\n*   **轻量级**：sentence\
  \ piece 占用约 6 MB 内存，可以处理 5 万句子。\n\n为了演示 SentencePiece 的用法，我们将使用官方的 sentence piece\
  \ Python API。可以如下所示安装官方 SentencePiece。\n\n在 Ubuntu 上，可以使用 `apt-get` 安装构建工具：\n\n\
  ```bash\nsudo apt-get install cmake build-essential pkg-config libgoogle-perftools-dev\n\
  ```\n\n从源码安装需要构建工具 `cmake`：\n\n```bash\nsudo apt-get install cmake\n```\n\n编译并安装\
  \ sentence piece 后：\n\n```bash\n% cd /path/to/sentencepiece\n% mkdir build\n% cd\
  \ build\n% cmake ..\n% make -j $(nproc)\n% sudo make install\n% sudoldconfig -v\n\
  ```\n\n或者，你可以将其作为 Python 包安装：\n\n```bash\npip install sentencepiece\n```\n\n###\
  \ Bit Pair Encoding\n这是一种简单的数据压缩技术，通过将出现频率最高的字节对替换为单个未使用的字节来工作。该算法被用于分词。在这里，对于单词分词任务，替换的是字符对而不是字节对。为了让你了解字节对编码的工作原理，我提供了一个简单的示例：假设我们有一个单词\
  \ `mmmbdmmmbac`。\n\n（注：原文包含大量重复段落，已为了清晰起见进行了压缩，保留了技术示例。）\n\n```python\ndetokenized\
  \ = ''.join(\\[\"Hello\",\"\\_wor\",\"ld\",\\[\".\"\\]\\]).replace('\\_',' ')\n\
  ```\n\n\n\n\n```python\nprint(sp.sample_encode_as_ids('Good Morning', -1, 0.1))\n\
  ```\n\n你可以通过运行 `Ch8/sentencepiece_demo.ipynb` 中的脚本来对 `SentencePiece` 进行实验。\n\n将\
  \ `SentencePiece` 集成到现有流水线中非常简单。在 `PyTorch` 中，你可以在定义模型的类中定义额外的函数。其位实现如下：\n\n```python\n\
  class dummy_with_sentecencepiece(torch.nn.Module):\n    def __ini__(self, sp, embed_size):\n\
  \        super(dummy_with_sentecencepiece, self).__init__()\n        self.sp = sp\n\
  \        self.embed = torch.nn.Embeddings(input_size = self.sp.get_piece_size(),\
  \ output_size = embed_size)\n        self.other_layer_1 = torch.nn.LSTM(…)\n   \
  \     self.other_layer_2 = torch.nn.Conv2D(…)\n    def forward(self, input_sent):\n\
  \        pieces_batch = self.apply_sentencepiece(input_sent)\n        padded_batch\
  \ = self.padding(self, batch)\n        embedded_sent = self.embed (padded_batch)\n\
  \        # applying other layers on to embedded output\n    def apply_sentencepiece(self,\
  \ input_sentences):\n        \"\"\"Getting pieces ids\"\"\"\n        return self.sp.encode_as_ids(input_sentence)\n\
  \    def padding(self, batch):\n        \"\"\"pad_to_make_all_pieces_equal_and_return\"\
  \"\"\n        return batch_with_padding\n```\n\n`dummy_with_sentecencepiece` 类将拥有四个方法。`init`\
  \ 方法将接收初始化层所需的各种参数，这些层可以是嵌入层、卷积层 RNN 层。嵌入层将 `SentencePiece` 词表大小作为输入大小，并将 `embed\
  \ size` 作为输出大小。当输入传递给 `apply_sentencepiece` 方法时，它会返回给定句子的片段（pieces）。随后，这些片段会被填充，以使所有片段的大小与包含片段最多的句子一致。现在，带有\
  \ ID 的填充批次被传输到嵌入层，嵌入层的输出被传递给另一个层以执行特定任务。\n\n你可以查看以下链接：\n\n1. 使用子词单元进行稀有词机器翻译：[`www.aclweb.org/anthology/P16-1162`](https://www.aclweb.org/anthology/P16-1162)\n\
  2. 子词正则：通过多个子词候选词改进神经网络翻译模型：[`arxiv.org/abs/1804.10959`](https://arxiv.org/abs/1804.10959)\n\
  3. SentencePiece：一种用于神经文本处理的简单且独立语言的子词分词器和还原器：[`arxiv.org/abs/1808.06226v1`](https://arxiv.org/abs/1808.06226v1)\n\
  \n### 理解随机多模型\n\n随机多模型深度学习或 `RMDL` 是受 `Auto ML`、`Auto-ml` 或 `自动机器学习` 启发的技术。这是一组专注于如何在任何实际任务上端到端地应用机器学习的技术。目前有很多可用工具，这里给出了其中一些：\n\
  \n* **Auto-WEKA**: 应用于 `WEKA` 的贝叶斯超参数优化。\n* **Auto-sklearn**: 应用于 `scikit-learn`\
  \ 的贝叶斯超参数优化。\n* **TPOT**: 一个能够借助遗传编程自动创建和优化流水线的 Python 库。\n* **RECIPE**: 一个基于语法的框架，利用遗传编程优化\
  \ `scikit-learn`。\n* **Auto Keras**: 一个用于神经网络架构调优的开源 Python 软件包。\n\nGoogle 也推出了用于神经网络架构调优的开源\
  \ Python 软件包。以下是使用 `auto-ml` 的优势：\n\n1. 它提供了更好的结果。\n2. 它消除了手动开发中的不收敛问题。\n3. 当已知一些参数时，用户可以进行微调。\n\
  4. 它允许开发者专注于更具生产力的任务。\n\n看起来 `auto-ml` 能够解决模型架构问题并提高准确性和鲁棒性，但这需要巨大的计算资源。考虑到计算速度，`auto-ml`\
  \ 通常对于具有数百万个参数的模型是不可行的。`RMDL` 是受到 `auto-ml` 启发的，对于具有数百个参数的模型是可行的。`RMDL` 包含了三种类型的网络架构：\n\
  \n1. 馈层网络 (**FFN**)\n2. 卷积神经网络 (**CNN**)\n3. 循环神经网络 (**RNN**)\n\n整体模型如下：\n\n![](img/rmdl.jpg)\n\
  \n**图 8.1:** RMDL 架构图。\n\n**来源:** [`github.com/kk7nc/RMDL`](https://github.com/kk7nc/RMDL)\n\
  \n### 创建网络\n\n我们必须首先理解如何通过更改参数来构建模型架构。`PyTorch` 支持通过更改参数来构建更深或更浅的模型。在构建此类组合时，建议将所有层堆叠在列表中：\n\
  \n```python\nlayers.append(layer_1)\nlayers.append(layer_2)\nself.layers = nn.Sequential(*layers)\n\
  ```\n\n**带有密集层的灵活模型**：假设你想构建一个带有可变层和 Dropout 的密集网络。你可以这样实现此类模型：\n\n```python\nperceptron_in_layers\
  \ = [200, 100, 50, 25]\ndropout = 0.2\nactivation = torch.ReLU()\nlayers = []\n\
  num_layers = len(perceptron_in_layers)\nfor i in range(0,num_layers-1):\n    layers.append(torch.nn.Linear(in_features\
  \ = perceptron_in_layers[i], out_features = perceptron_in_layers[i+1]))\nlayers.append(activation)\n\
  layers.append(torch.nn.Dropout(dropout))\nlayers = nn.Sequential(*layers)\n```\n\
  \n这里需要学习的另外一点是，最好声明模型的用途。我们以前没有遵循这一惯例，但这是必要的。某些像 Dropout 和批归一化（batch-norm）这样的层在模型用于训练和测试时功能不同。如果你使用\
  \ `model.train()`，你将看到以下输出，它显示了模型的参数：\n\n```python\nlayers.train()\nSequential(\n\
  (0): Linear(in_features=200, out_features=100, bias=True)\n(1): ReLU()\n(2): Dropout(p=0.2)\n\
  (3): Linear(in_features=100, out_features=50, bias=True)\n(4): ReLU()\n(5): Dropout(p=0.2)\n\
  (6): Linear(in_features=50, out_features=25, bias=True)\n(7): ReLU()\n(8): Dropout(p=0.2)\n\
  )\n```\n\n\n\n\n如果你使用 `model.eval()`，将显示后续输出。它让模型知道权重不需要更新，且必须进行前向传播，而不为反向传播积累参数。如果模型声明为评估模式，它将影响批归一化（batch\
  \ normalization）和丢（dropout）等层。这些层在训练和评估期间的行为不同。\n\n### 带有 RNN 层的灵活模型\n之前关于前馈模型。现在，让我们来看看如果想开发一个灵活的架构，递归网络中有哪些可用参数。`GRU`\
  \ 或 `LSTM` 或 `Vanilla RNN` 具有可以更改网络架构的通用参数。例如，使用 `LSTM` 可以如下更改各种参数：\n\n1. `input_size`:\
  \ 输入特征的数量通常等于嵌入的大小。\n2. `hidden_size`: 任意 `RNN` 单元的隐藏状态大小。\n3. `num_layers`: `RNN`\
  \ 可以层层叠加，如下所示。对于更复杂的数据需要更多的层。\n4. `bidirectional`: 如果 `bidirectional` 为真，`RNN` 在序列的两个方向上运行。\n\
  \n![](img/RMDL_bidirectional.jpg)\n\n**图 8.2：** 展示双向 `LSTM` 如何工作以及如何提供最终输出的插图。\n\
  \n每个时间步的最终输出将是正向运行和反向运行的输出的拼接。（在实现上，`RNN` 只在一个方向上运行，但会将序列反转并交给 RNN，由此产生的输出被称为反向方向输出。）\n\
  \n可以使用这些选项随机生成各种网络架构。此外，注意力机制 `mechanism.nn` 等其他各种添加项也可以应用于 `RNN`。`Sequential`（层）也可以用于堆叠\
  \ `LSTM` 层。\n\n# 使用 RMDL\n\n用于分类的随机多模型深度学习用于在给定数据上测试各种网络拓扑结构并使用不同的超参数，以获得具有最高率的最佳模型。RMDL\
  \ 的实现通过 git 仓库提供：`https://github.com/kk7nc/RMDL`。可以通过 `pip install RMDL` 轻松安装 RMDL。\n\
