  \ |\n\n**表 2.7**\n\n我们将从基础的张量操作开始。PyTorch 的张量操作与 `Numpy` 类似。此外，PyTorch 与 GPU 有强大的集成。因此，任何可以在\
  \ CPU 上完成的操作都可以以很小的时间复杂度在 GPU 上完成：\n\n```\nimport PyTorch # importing PyTorch\n\
  ```\n\n## PyTorch 模块\n\n在 PyTorch 中用随机数初始化一个 3 * 2 矩阵：\n\n```\nmat1 = PyTorch.randn([2,3])\n\
  ```\n\n```\nmat1 >> tensor([[0.8992, -1.0515, 0.6143], [0.3743, -0.4616, 1.1338]])\n\
  ```\n\n用随机数初始化另一个 2 * 3 矩阵：\n\n```\nmat2 = PyTorch.randn([3,2])\n```\n\n```\nmat\
  \ >> tensor([[-0.6860, -1.6029], [-1.0089, -0.9182], [-0.3778, -0.3748]])\n```\n\
  \n对 `mat1` 和 `mat2` 取点积：\n\n```\nPyTorch.matmul(mat1, mat2)\n```\n\n```\ntensor([[0.2119,\
  \ -0.7061], [-0.2194, -0.6010]])\n```\n\n这些张量默认存在 RAM 中，所有计算都由 CPU 完成。如果我们想在 GPU\
  \ 上执行操作，首先，你的机器必须有 GPU 硬件。此外，PyTorch 支持将数据传输到 GPU VRAM，这与 RAM 类似，但允许更快的计算。将数据传输到特定\
  \ GPU 的方式如下：\n\n```\ncuda = PyTorch.device('cuda')\n```\n\n具体来说，如果你有多个 GPU 连接到同一主板，你可以将数据传输到任何\
