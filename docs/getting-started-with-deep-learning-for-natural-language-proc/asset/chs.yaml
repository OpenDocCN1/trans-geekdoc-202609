  \n# 构建命名实体识别\n\n命名实体识别或命名实体解析是一个相似的概念，简称为 NER。NER 将句子中的子部分标记为特定的类别。该子部分可以是一个单词，也可以是多个连续单词的组合。NER\
  \ 是自然语言处理（NLP）领域的热点，并有几个实际用例。这里给出了一些：\n\n*   通过从文本中提取关键词来编写高效的搜索引擎。\n*   根据文献中提到的实体建议阅读内容，类似地，根据描述建议产品。\n\
  *   通过解析来自 Twitter 的馈送（feeds）来关注市场。\n\n在本节中，我们将看到实现 NER 任务的一些实用方法。有很多数据集可用于 NER\
  \ 实验，其中一些列在下方。在本章中，我将使用 `CONLL2003` 数据集来演示收敛。`CONLL2003` 是由计算自然语言学习会议发布的。`CONLL2003`\
  \ 数据集包含九种独特的实体实体。它标记了四种实体类型：`Location`（`LOC`）、`Person`（`PER`）、`Organization`（`ORG`）和\
  \ `Miscellaneous`（`MISC`）。所有这些类型的实体都有起始标记（B-TYPE）和中间标记（I-TYPE），构成了八种独特的实体类。此外，不属于分配给任何类别的单词被分配为类\
  \ `O`。所有这些共同组成九类。数据采用制表符分隔的列，各列分别为：单词标记（word token）、给定标记的词性（parts of speech）、句法分块标记（syntactic\
  \ chunk tag）和实体类型（entity type）。预处理后的 `CONLL2003` 数据保存在 `Ch7/attention_in_classification.ipynb`。数据格式如下：\n\
  \n| - | - | - | - |\n| - | - | - | - |\n| O | VBD | - | O |\n| O | VBD | - | O |\n\
  | LOC | NNP | - | B-LOC |\n| PER | NNP | - | B-PER |\n| ORG | NN | - | B-ORG |\n\
  | MISC | JJ | - | B-MISC |\n| O | - | - | O |\n| LOC | NNP | I- | I-LOC |\n| O |\
  \ VZ | - | O |\n\n\n\n\n```python\nif self.batch_size is None:\n    h_0 = Variable(torch.zeros(1,\
  \ self.batch_size, self.hidden_size).type(torch.FloatTensor)).to(device)\n    c_0\
  \ = Variable(torch.zeros(1, self.batch_size, self.hidden_size).type(torch.FloatTensor)).to(device)\n\
  else:\n    h_0 = Variable(torch.zeros(1, self.batch_size, self.hidden_size).type(torch.FloatTensor)).to(device)\n\
  \    c_0 = Variable(torch.zeros(1, self.batch_size, self.hidden_size).type(torch.FloatTensor)).to(device)\n\
  \noutput, (final_hidden_state, final_cell_state) = self.lstm(input, (h_0, c_0))\
  \ # final_hidden_state.size() = (1, batch_size, hidden_size)\noutput = output.permute(1,\
  \ 0, 2) # output.size() = (batch_size, num_seq, hidden_size)\nattn_output = self.attention_net(output,\
  \ final_hidden_state)\nlogits = self.label(attn_output)\nreturn torch.softmax(logits,\
  \ dim=1)\n```\n\n以下是训练数据上的性能。准确率达到了约 87%，损失显著下降：\n\n![](img/NER_RNN_train.jpg)\n\
