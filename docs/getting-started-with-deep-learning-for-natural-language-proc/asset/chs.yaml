  \ 安装 `requirements.txt` 中列出的所有包来安装这些需求。\n\n## 理解语言问题\n\n语言是与周围的人联系的机制。它不断演变，人类需要多年才能理解它。\n\
  \n存在一个悖论：对于我们来说，语言是我们可以理解的东西；而对于机器来说，语言纯粹是数学的。人类语言和数学并不是根据彼此而演化的，因此在它们之间找到一条直线是困难的。如果要求人类计算\
  \ 100 次多项式，人类将花费大量时间，但机器可以轻松地完成。另一方面，机器在理解和泛化语言方面不如孩子智能，而 `NLP` 弥补了这一差距：\n\n*“在\
  \ NLP 中，没有规则适用，只有不规则的规则适用”*\n\n理解语言是困难的，世界上大约有 6,500 种语言。每种语言都有自己的语法、句法和语义，因此在理解语言方面存在某些已知的挑战。我在这里讨论了一些挑战，让你对在本章之后将面临的挑战有一个感知。\n\
  \n以下是理解自然语言细微差别时涉及的复杂性。相关细节将在下一节讨论：\n\n*   **语境含义**：当一个特定的词在不同的语境中使用并带有不同的含义时，被称为多义性（polysemy）。\n\
  \    *   **句子 1**: I went to the bank to withdraw money.（我去银行取钱了。）\n    *   **句子\
  \ 2**: I saw an alligator at the bank.（我在岸边看到一只鳄鱼。）\n    在这里，`bank` 在两个句子中的含义不同。`p('bank'|Sentence1)\
  \ != p('bank'|Sentence2)`。当使用 `word2vec` 或 `glove` 等方法生成词向量时，不考虑词的语境，因此两个词的向量 `v`\
  \ 是相同的 `v('bank'|Sentence1) = v('bank'|Sentence2)`。但当使用语境嵌入（contextual embedding）时，两种情况下的\
  \ **bank** 将具有不同的含义。\n\n*   **指代消**：涉及到相对于给定动词识别主语或宾语。\nThe children stole the guns.\
  \ They were later found。（孩子们偷了枪。它们后来被找到了。）\n在这里，代词 `They` 可能指代孩子们或枪。为了解决这个问题，我们可以使用称为指代消（anaphora\
  \ resolution）的技术。\n\n*   **从句的的歧义**：在继续之前，我给你举一个例子：\nThe policeman saw the thief\
  \ with the telescope.（警察用望远镜看到了小偷。）\n很难判断介词性短语（with the telescope）是修饰名词短语（policeman），如果读者的理解是小偷拿着望远镜。另一方面，它也可以修饰动词短语（saw）；所以警察有一台用来看小偷的仪器。与此同时，关系从句连接了组成句子的两个短语。\n\
  \n*   **幽默/讽刺识别**：幽默和讽刺对机器来说很难识别。主要原因是缺乏多样性，且训练数据覆盖不足。理解幽默需要敏锐的语言感知以及注意力。目前的机器学习技术缺乏这两者，因此很难建立能够识别幽默或讽刺的系统。\n\
  \n*   **原生语言相关挑战**：在分类推文或情感时这是一个巨大的挑战。通常，可用的训练数据集属于一个分布，而测试数据属于另一个分布。美国原住民写英语的方式与印度原住民的写作非常不同。这是需要大量研究的地方之一，以便模型泛化得足够好，至于不需要重新训练或微调。\n\
  \n*   **长距离依赖**：机器学习技术不擅长捕捉长距离依赖。\n*Nvidia 的平台允许汽车将全自动驾驶辅助功能，包括车道检测、变道、分道、标志牌检测和应急响应系统集成到汽车中。它的平台还将帮助他们轻松将智能座舱辅助系统部署到汽车中。*\n\
  \n\n\n\n在这里，单词 `It` 指的是 `Nvidia`。许多算法很难识别出这种关系；这个问题也被称为命名实体消歧。由于这些问题，自然语言处理和自然语言理解仍然是难以完成的任务。\n\
  \n*   **语音识别**：如今，像 Alexa、Google Home 和 Siri 等许多个人助手正面临着语音识别相关的挑战。假设你的助手是针对美原住民口音训练的，它在印度市场失效了。这本质上需要重新训练或微调。如果设备是针对美原住民口音训练且需要在印度使用，那么微调是有效的；但如果该设备需要在在中国使用中文，它则需要使用新数据集进行重新训练。语音识别面临许多挑战，如噪声、通道变异、多扬话者、说话风格和同音词。我们将在第\
  \ 11 章 语音处理的技术与高级框架中讨论这些挑战。\n    * Realeyes\n    * Realize\n    * Real lies\n\n\
  以上所有内容在读出来时被听认为是相似的，这使得很难区分它们。这个例子来自 Christopher Syre Smith（一位美国说唱歌手）的一条推文。\n\n\
  根据难度，NLP 问题可以大致归类如下：\n\n*   **简单或已大部分解决**：垃圾邮件检测、词性标记、命名实体识别。\n*   **中等或进展良好**：情感分析、机器翻译、句子/查询解析或自然语言理解、词义消歧、信息转译\
  \ - 将非结构化数据转换为结构化数据。\n*   **困难或仍需大量工作**：文本摘要、机器对话系统。\n*   本书将涵盖其中许多任务，我们将涵盖简单、中等和困难的任务。在接下来的章节中，我们将设计处于领先水平或非常接近领先水平的模型。请关注！\n\
  \n你可以访问以下链接来了解 NLP 的当前趋势和挑战：\n\n*   自然语言处理：现状、当前趋势与挑战：[`arxiv.org/pdf/1708.05148.pdf`](https://arxiv.org/pdf/1708.05148.pdf)\n\
  \n\n现代算法是数据渴求的。为了泛化给定的任务，需要大量的数据，这类标记数据可以从两个来源收集：\n\n1. 由人制作并发布的数据\n2. 你自己收集的数据\n\
  \n第一种选择非常有利但有局限，因为每个学习任务都无法获得标记数据。有时，由于训练数据和测试数据分布的差异，可用数据可能是无用的。这与我们在第 1 章 理解学习过程的基础\
  \ 中讨论的泛化问题有关。有一种方法可以提高在测试数据上的准确性：使用我们从现有数据收到的标记数据进行初始训练，并使用领域相关数据对该模型进行微调。\n\n让我们举一个例子来让你意识到训练和测试数据之间的分布差异。假设某汽车制造商对分析来到其服务中心的客户的情感感兴趣。由于大多数不在在线销售，因此没有完善的反馈循环，历史数据较少或不可用。在这种情况下，可以使用\
  \ Amazon 的情感分析数据。尽管如此，模型的分布与测试数据不同，该模型在汽车服务情感数据上的表现会很差。在这种情况下，可以在 Amazon 情感分析数据上训练模型，并在少量可用的汽车服务情感分析上进行微调，以获得更好的效果。\n\
  \n我们需要思考如何获取此类自定义数据。它可以从以下来源收集：\n\n1. 爬取网页\n2. 从 XML 和 JSON 中提取数据\n\n网络爬取是从网站上提取数据的过程。网络爬虫是用于从网页上收集特定信息的程序，当你知道数据存在于网页上时，就可以进行爬取。不同的网站有不同的结构，因此一个爬虫脚本无法适用于所有网站；我们需要为不同的网站准备不同的爬虫。网络爬虫执行特定任务以获取所需信息：\n\
  \n1. 它向指定的 URL 发送 get 请求。\n2. 接收页面后，解析 HTML 的`文档对象模型 (DOM)` 并根据针对的标签 UD、类（class）或属性提取所需信息。\n\
  \n`DOM` 是一个跨平台且语言无关的应用程序接口。对 HTML、XHTML 或 XML 等 `DOM` 文件格式的评分具有树形结构。在这个树结构中，每个节点都是一个代表文档一部分的对象。`DOM`\
  \ 模型用逻辑树表示文档。\n\n\n让我们看一个例子来理解如何使用爬虫。假设我想构建一个爬虫，来抓取与特定车辆相关的评论和相应的星级评分。我将从 [`www.carwale.com/`](https://www.carwale.com/)\
  \ 爬取评论。假设我正在爬取与 Mahindra Marazzo 相关的信息，它位于 [`www.carwale.com/mahindra-cars/marazzo/userreviews/`](https://www.carwale.com/mahindra-cars/marazzo/userreviews/)。Python\
  \ 有许多可爬虫包，包括 Scrapy、BeautifulSoup 和 Selenium。我将在此示例中使用 `BeautifulSoup`。如果你使用你喜欢的浏览器检查\
  \ HTML 元素，可以通过按下 `Ctrl` + `Shift` + `I` 看到。\n\n以下是 [`www.carwale.com/`](https://www.carwale.com/)\
  \ 页面的源代码，特别是针对评论的部分：\n\n```html\n<div id=\"userReviewListing\">\n<div style=\"margin-top:\
  \ 20px;\">\n<a style=\"font-size: 14px; font-weight: bold;\" href=\"/mahindra-cars/marazzo/userreviews/59854/\"\
  \ data-cwtccat=\"ReviewsListingsPage\" data-cwtact=\"TitleClick\" data-cwtclbl=\"\
  modelid=1098|source=1\">Worst car</a>\n<br>\n<p class=\"text-grey\" style=\"margin-top:\
  \ 3px;\"><span class=\"rating-sprite one-rating\"></span> by sagar, 2 months ago,\
  \ > 0 Comments</p>\n<p style=\"margin-top: 10px;\"><span>Just a face lift of renault\
  \ lodgy nothing else. No value for money, quite expensive for 16.5L. I bought M8\
  \ variant which has started noises…</span>… <a href=\"/mahindra-cars/marazzo/userreviews/59854/\"\
  \ data-cwtccat=\"ReviewsListingsPage\" data-cwtact=\"ReadMoreClick\" data-cwtclbl=\"\
  modelid=1098|source=1\">read complete review</a></p>\n</div>\n```\n\n整个页面中只显示了包含用户评论信息的\
  \ HTML 元素。为了提取这些信息，我们必须针对 ID 等于 `userReviewListing` 的 DIV。在这个 DIV 下，每个用户评论都组织在一个嵌套\
  \ DIV 中，每个内部 DIV 下有两个 SPAN 元素：一个包含**星级评分**相关信息，第二个包含**用户评论**。\n\n这是一个提取页面评论的脚本示例：\n\
  \n```python\n## 获取页面内容\npage = requests.get('https://www.carwale.com/mahindra-cars/marazzo/userreviews/',\
  \ verify=False)\ncontents = page.content\n\n## 使用 Soup 解析 DOM\nsoup = BeautifulSoup(contents,\
  \ 'html.parser')\n\n### 获取 userReviewListing 下的所有数据\nmydivs = soup.findAll(id=\"\
  userReviewListing\")\n\n### 获取 userReviewListing 下的所有 DIV\nfor i in mydivs:\n  \
  \  for j in i.find_all(\"div\"): # 获取上一个 DIV 下单个 DIV\n        try:\n```\n\n\n\n\n\
  ```python\nm, n = j.find_all(“span”) # Getting SPAN under DIV One span is having\
  \ rating info one SPAN is full Comment\n```\n\n```python\npprint({“Rating”: m.get(‘class’,\
  \ []), “Full_Comment”: n.text}) # Making Dict for Rating and Full Text\n```\n\n\
  ```python\nexcept:\n“”\n```\n\n运行 `scrapper_example.py` 中的代码后，你将为每个用户评论获得以下字典输出。其中一个输出显示如下：\n\
  \n```python\n{'Full_Comment’: ‘1. I am not buying it but i am thinking to buy this\
  \ car\\n’ ‘2. Driving experience is Awesome i personally drive this ‘ ‘car. Car\
  \ are awesome in all…’, ‘Rating’: [‘rating-sprite’, ‘three-rating’]}\n```\n\n这段代码还不完整，我们可以从许多方面对其改进：\n\
  \n* 现有代码没有抓取完整的评论，只返回了前几个单词。我们可以改进代码以提取完整的评论。\n* 我们可以添加改进逻辑来处理用户评论的分页问题。\n\n在你尝试前面的代码时，网站的结构可能已经发生了变化，代码可能无法运行。因此，与其仅仅遵循代码，不如尝试理解如何使用\
  \ Python 选择 HTML 标签并在稍后提取信息内容。\n\n### 从 XML 和 JSON 格式解析数据\n\nJSON 和 XML 是网络服务和数据存储的标准格式。JSON\
  \ 具有字典形式，并可以包含嵌套元素，而 XML 是一种标记语言，以人类和机器均可读的格式编码文档。所有高级语言都配备了用于 JSON 和 XML 的内置解析器。Python\
  \ 也对 XML 和 JSON 有完全的支持。可以使用 Python 中的 `XML` 或 `JSON` 包来处理 XML 格式或 JSON 格式的文件。\n\n\
  这并不总是像前面的示例那么简单。网页开发者不希望你抓取网站有很多真实理由。其中一些原因如下：\n\n* 没有人希望其数据未经许可被使用。\n* 在多个 CPU\
  \ 线程上的网络爬虫每秒可以发送数百万请求，导致服务器对其他用户不可用。此外，原始开发者需要为爬虫消耗的出口带宽付费。\n\n网页开发者经常使用这些技术来防止网络爬虫：\n\
  \n* 基于密码的拦截\n* 实施验证码\n* 服务端实现爬虫保护\n* 基于 IP 的拦截\n\n所有这些技术都可以完全或部分地绕过。目前有很多优秀的框架可以绕过这些拦截机制。\n\
  \n### 理解词干提取 (Stemming)\n\n单词的不同形式通常表达相同的含义。搜索 `Shirt` 还是 `Shirts` 并没有区别。不同词形式之间的句法差异被称为词形（infections），这通常被认为是查询理解问题的原因。在自然语言处理（NLP）中，词干提取是将派生或屈折词替换为其基础形式词干的术。词干提取算法自\
  \ 1960 年以来一直被采用。词干提取相关的算法已用于搜索引擎，这些算法将搜索词转换为其基础形式。在搜索时，输入的单词连同词根一起被搜索，将其所有修改形式视为同义词。\n\
  \n例如，词干提取算法应该将 `fished`、`fishing` 和 `fisher` 转换为其基础形式 `fish`。词干提取算法有多种实现，如 `snowball`\
  \ 和 `porter stemmer`。这些算法根据一组规则运行：\n\n* **生成技术 (The production techniques)**：这是一种基于反向查找的技术。首先，生成各种变体；例如，对于单词“run”，生成它所有的变体，如“ran”、“running”、“runs”和“runny”。然后对所有这些变体进行反向查找，以获得基础单词\
  \ `run`。\n\n* **后缀剥离技术 (Suffix stripping techniques)**：在这些技术中，与生成技术不同，采用的是带有一组规则的后缀保留算法，而不是保留所有变体并进行引导。常见的规则可以是以\
  \ `ed`、`ing` 或 `ly` 结尾的单词；删除这些后缀以使单词恢复基础形式。虽然这是一个简单的算法，但在实践中效果并不好，它不会影响像 `run` 及其过去分词\
  \ `ran`。需要注意的是，并非所有语言都使用后缀和前。\n\n让我们来看意大利语的另一个例子：\n\n* `Mandargi` = `Mandare` +\
  \ `gli`，意思是“送给他”\n* `Mandarglielo` = `Mandare` + `gli` + `lo`，意思是“把它送给他”\n\n在葡萄语中，使用连字符（`-`）将基础形式与后缀分开，因此在这种处理葡萄语非常容易。经过多年的研究，还没有比通用的词干提取算法更完美的了。每种语言都有根据一组规则运行的词干提取算法。\n\
  \n### 理解 Snowball 算法\n\n我们将讨论最常用的词干提取技术——`snowball` 算法。它根据密切研究后缀模式和替换模式后创建的特定规则运行，以便将其带回基础形式。以下解释与\
  \ [`snowball.tartarus.org/`](http://snowball.tartarus.org/) 上的 snowball 解释一致。\n\n\
  A、`E`、`I`、`O` 和 `U` 是元音，所有其他字符都是辅音。元音用 `V` 表示，辅音用 `C` 表示。基于此，任何单词可以用这四种基本形式表示：\n\
  \n1. `V ……. V`：以元音开头并元音结尾\n2. `C ……. C`：以辅音开头并辅音结尾\n3. `C ……. V`：以辅音开头并元音结尾\n4.\
  \ `V ……. C`：以元音开头并辅音结尾\n\n以下解释与 [`snowball.tartarus.org/`](http://snowball.tartarus.org/)\
  \ 上的解释一致。\n\nA、`E`、`I`、`O` 和 `U` 是元音，所有其他字符都是辅音。元音用 `V` 表示，辅音用 `C` 表示。基于此，任何单词可以用这四种基本形式表示：\n\
  \n1. `V …….. V`：以元音开头并元音结尾\n2. `C ……. C`：以辅音开头并辅音结尾\n3. `C ……. V`：以辅音开头并元音结尾\n4.\
  \ `V ……. C`：以元音开头并辅音结尾\n\n等待，提供的文本存在重复。我将按照内容流重新格式化文本。\n\n### 理解 Snowball 算法（继续）\n\
  \n（从文本继续）\n\nA、`E`、`I`、`O` 和 `U` 是元音，所有其他字符都是辅音。元音用 `V` 表示，辅音用 `C` 表示。基于此，任何单词可以用这四种基本形式表示：\n\
  \n1. `V ……. V`：以元音开头并元音结尾\n2. `C ……. C`：以辅音开头并辅音结尾\n3. `C ……. V`：以辅音开头并元音结尾\n4.\
  \ `V ……. C`：以元音开头并辅音结尾\n\n等待，源文本包含重复内容。我将按照“以下是格式化的文本”部分处理文本并应用规则。\n\n（注：用户提供的文本末尾有大量重复。我将提供**整个**文本的清理版本。）\n\
  \n\n\n\n这完全取决于遵循这些步骤的整个算法；可以设计出生产可的词干器。NLTK 软件包中存在多种词干器。在第 3 章 理解词形还原”中，我们将测试如何使用不同的分干算法对特定单词进行分干。\n\
  \n还有其他几种技术被用于分干，例如随机算法、混合方法、匹配算法和缀性词干器。让我们简要了解一下它们：\n\n- **随机算法**：随机算法基于概率模型，该模型通常在受感染的形式与其词干标记的成对上进行训练。此类模型在内部表示了复杂的语言规则。训练后，当将一个单词输入此类模型时，它会将其转换为基础形式。更进一步，此类算法可以在考虑原始单词的基础上，额外考虑词性和和单词的语境进行训练。\n\
  - **缀性词干器**：在语言学中，“缀性”既指后缀也指前缀。缀性词干器通过移除后缀和前缀来将标记转换为词干。例如，单词 `indefinitely` 将被转换为其词干\
  \ `definitely`。\n- **混合方法**：混合方法使用了上述方法的许多组合。通常，混合方法使用一组规则运行，这些规则会调用任何一种上述方法。\n\n\
  你可以参考以下链接以进一步理解分干：\n\n- Snowball 算法：[`snowball.tartarus.org/`](http://snowball.tartarus.org/)。\n\
  - 缀性分干：[`www.aclweb.org/anthology/P/P09/P09-1017.pdf`](http://www.aclweb.org/anthology/P/P09/P09-1017.pdf)\n\
  \n# 理解词形还原(#toc.xhtml#s42a)\n\n在词形还原中，根词被称为 lemma（原型）。分干（Stemming）和词形还原（Lemmatization）之间的主要区别在于词形还原考虑了单词的语境，而分干则没有。分干默认对后缀进行操作，并且不考虑前缀的移除。分干只是删掉几个字符，往往会导致含义错误。\n\
  \n分干在现在很流行，而词形还原的重要性较小。当我们过去使用基于 TF-IDF 和共现矩阵的向量化技术时，这两种算法具有非常意义。对于较大的词汇量，这些技术会产生不必要的较大的稀疏矩阵。这样一个拥有百万\
  \ * 百万个元素的矩阵非常难以放入主内存中。\n\n分干和词形还原算法仍在研究中，尚未完美。以下示例使用了 NLTK 中的词干器和词形还原函数。NLTK 有多种类型的词干器，如\
  \ Lancaster、Porter 和 Snowball。\n\n```pythonlancaster = nltk.stem.lancaster.LancasterStemmer()\n\
  porter = nltk.stem.porter.PorterStemmer()\nsnowball = nltk.stem.snowball.EnglishStemmer()\n\
  WordNetLemmatizer = nltk.stem.WordNetLemmatizer()\n\ndef differnt_stemmars_and_lemmatizer(word):\n\
  \    print(“Word : “, word)\n    print(“Lancaster Stemmer : “, lancaster.stem(word))\n\
  \    print(“Porter Stemmer : “, porter.stem(word))\n    print(“Snowball Stemmer\
  \ : “, snowball.stem(word))\n    print(“Snowball Lemmatizer : “, WordNetLemmatizer.lemmatize(word))\n\
  \nword_list = [“maximum”, “cats”, “seventy-one”, “cacti”, “geese”, “better”, “Agreed”,\
  \ “Plastered”, “Motoring”]\n```\n\n下面的结果表显示了不同类型的 `Steamers` 和 `Lemmatizer` 之间的比较：\n\
  \n| 序号 | 单词* | Lancaster* | Porter* | Snowball* | WordNetLemmatizer* |\n| --- |\
  \ --- | --- | --- | --- |\n| 1 | maximum | maxim | maximum | maximum | maximum |\n\
  | 2 | cats | cat | cat | cat | cat |\n| 3 | seventy-one | seventoni | seventone\
  \ | seventoni | seventy-one |\n| 4 | cacti | cact | cact | cacti | cactus |\n\n\
  **表 2.6**\n\n如表所示，Lancaster Stemmer 是激进的，而 Porter 和 Snowball 产生的结果相似。WordNetLemmatizer\
  \ 不产生任何变化。分干和词形还原的优势在于减少了词汇量并使任务更高效。\n\n就像 NLTK 一样，Spacy 支持词形还原。你可以实验 Spacy 词形还原工具；相关用法见\
  \ [`spacy.io/api/lemmatizer`](https://spacy.io/api/lemmatizer)。\n\n# 理解分词(#toc.xhtml#s4a)\n\
  \n对于计算机来说，任何字符串都是某种编码的连续分配。将此类字符串分割为具有语言学意义和方法论有用单元（如单词或句子）的过程被称为**分词**（tokenization）。在英语中，单词是通过空格分隔的，但并非所有单词都构成一个标记。例如，`American\
  \ Express` 是一个公司名称，在分词时将这两个单词分为 `American` 和 `Express` 并没有任何意义。\n\n标准分词器由某些规则组成，如按空格分隔。构建分词器看起来很容易，但是一个挑战性且有趣的任务。执行此任务时必须小心，因为任何错误都会传播到整个流水线。分词在生物领域具有挑战性，因为许多单词是多词的，且连字符和斜杠经常出现在标记中。\n\
  \n分词有两个级别，即：\n\n- **低级分词**，可以认为是基于间隔或应用额外规则的分词\n- **高级分词**是重新组合单词并恢复语言意义\n\n分词过程可以包含以下步骤（大多基于规则）：\n\
  \n1. 按空格分词\n2. 处理连字符词，例如 `seventy-one` 应该是一个标记\n3. 处理缩写，例如在 `Dr.` 中，.` 不应被视为句号\n\
  4. 数字和特殊数字格式不应被破坏\n5. 带有连字符和斜杠的日期\n6. 带有括号或连字符的电话号码\n7. 电子邮件 ID 和 URL\n\n句子分词也根据类似的规则运行。我们不进入细节，因为我们有一个具有最大准确性的成品工具。分词器已被研究多年，但准确性仍未达。在以下段落中，你将看到一个使用\
  \ NLTK 应用句子和单词分词器的示例。\n\n\n\n*   **句子 1**: 如此，我相信只有如此，我们才能解释与这些巨石卵石有关的事实。\n*   **句子\
  \ 2**: 地球上没有任何已知代理能够将它们粘在粘土中，冰除外，冰在其他地方仍然会这样做。\n*   **句子 3**: 没有已知的代理能够像它们现在的划痕那样划伤它们，冰除外，冰在其他地方仍然会这样做。\n\
  \n## [使用 Spacy 分词器]\n\n*   **句子 1**: 如此，我相信只有如此，我们才能解释与这些巨石卵石有关的事实。单词：`[‘Thus’,\
  \ ‘, ‘, ‘and’, ‘I’, ‘believe’, ‘thus’, ‘only’, ‘, ‘, ‘can’, ‘we’, ‘explain’, ‘the’,\
  \ ‘facts’, ‘connected’, ‘with’, ‘these’, ‘boulder’, ‘pebbles’, ‘.’, ‘ ‘]`\n*   **句子\
  \ 2**: 地球上没有任何已知代理能够将它们粘在粘土中，冰除外，冰在其他地方仍然会这样做。单词：`[‘No’, ‘agent’, ‘known’, ‘on’,\
  \ ‘earth’, ‘can’, ‘have’, ‘stuck’, ‘them’, ‘in’, ‘the’, ‘clay’, ‘, ‘, ‘save’, ‘ice’,\
  \ ‘, ‘, ‘which’, ‘is’, ‘known’, ‘to’, ‘do’, ‘so’, ‘still’, ‘elsewhere’, ‘.’]`\n\
  *   **句子 3**: 没有已知的代理能够像它们现在的划痕那样划伤它们，冰除外，冰在其他地方仍然会这样做。单词：`[‘No’, ‘known’, ‘agent’,\
  \ ‘can’, ‘have’, ‘scratched’, ‘them’, ‘as’, ‘they’, ‘are’, ‘scratched’, ‘, ‘, ‘save’,\
  \ ‘ ‘, ‘ice’, ‘, ‘, ‘which’, ‘is’, ‘known’, ‘to’, ‘do’, ‘so’, ‘still’, ‘elsewhere’,\
  \ ‘.’]`\n\n使用 NLTK 和 Spacy 执行的句子和单词分词存在显著差异，每个分词器都会犯某种程度的错误。你可以尝试使用更复杂的文本（包括网络 URL\
  \ 和邮箱地址）来了解分词器所犯的错误。然而，自定义领域需要自定义的分词器，例如金融领域和生命科学领域所需的分词器。这些是通用的分词器，但自定义分词器通常针对特定应用领域制作。例如，医学领域需要将复杂的多词疾病名称识别为一个标记。此类分词器是使用\
  \ NLP 技术制作的，除了英语分词器外，还经常使用`命名实体识别` (`NER`)。我们将在下一章节中学习 NER。\n\n除了之前讨论的基础分词器外，NLTK\
  \ 具有针对特定任务的分词器，部分如下：\n\n*   **Twitter 感知分词器**：Twitter 感知分词器设计用于更好地适应推文结构。它有一个如 `preserve_case`\
  \ 的额外函数，如果将其设置为 false，标记将变为小写。`strip_handles` 会从文本中移除句柄名称。如果 `reduce_len` 设置为 true，它将截断重复字符，例如，“!!!!”将被转换为\
  \ `[‘!’, ‘!’]` 标记。\n\n这是一个推文分词器如何工作的示例：\n\n```python\nfrom nltk.tokenize import\
  \ TweetTokenizer\ntknzr = TweetTokenizer()\nexample_string = \"\"\"@mjcavaretta\
