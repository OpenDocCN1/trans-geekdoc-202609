  \ # GPU 2 (索引从 0 开始)\n```\n\n通常，我倾向于使用以下代码来考虑我们的环境：\n\n```\ndevice = PyTorch.device(\"\
  cuda:0\" if PyTorch.cuda.is_available() else \"cpu\")\n```\n\n在参数数量增加的情况下，通过 PCI\
