  \ ‘,’, ‘preferably’, ‘using’, ‘#rstats’, ‘or’\n```\n\n```python\nprint(\" With Default\
  \ Parameter : “,tknzr.tokenize(example_string))\n```\n\n```\n>>> With Default Parameter\
  \ : [‘@mjcavaretta’, “It’s”, ‘great’, ‘that’,\n“you’ve”, ‘created’, ‘a’, ‘new’,\
