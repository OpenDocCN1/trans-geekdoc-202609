  ### 训练与推理\n\n孩子学习的方式与机器学习的方式之间存在着巨大的相关性。机器学习技术高度受监督学习模型的主导，如 `Random Forest`、`logistic\
  \ regression`、`梯度提升机` (`GBM`)、`感知器模型`以及`卷积神经网络` (`CNN`) 和`长短期记忆` (`LSTM`) 等架构。\n\
  \n![](img/training_inference.jpg)\n\n**图 1.14:** 规定模型如何在推理流水线中构建和使用的流程图。\n\n推理是一个将深度学习训练期间获得的能力投入工作的过程。通常，理想的训练与推理比例为\
  \ 70:30，但这个比例并不适用于所有规模的数据集；因此，我们必须针对不同的数据规模考虑不同的比例。随着训练数据规模的增大，测试数据的比例会减少。最重要的是划分；推理数据和训练数据之间不应存在分布差异。\n\
  \n约 90% 的机器学习模型由于效率和生产力问题没有进入生产环境。模型的生产效率可以进行优化，以便在生产环境中以低能耗实现最大次数的推理。可以使用多种技术来确保模型的生产可行。所有主流框架如\
  \ `Tensorflow`、`Theano`、`PyTorch` 和 `MxNet` 内部都使用动态或静态图来优化整个训练过程。然而，为训练形成的网络图并没有针对推理进行优化。提高推理的速度和效率有迫切需求。我们都知道\
  \ Netflix 的协同过滤竞赛。2009 年 6 月 26 日，名为 `BellKor’s Pragmatic Chaos` 的团队比仅次之团队提升了 10.05%\
  \ 并赢得了竞赛。然而，很少有人知道之后发生了什么——由于其复杂性，该模型从未进入生产环境。它是一个集成模型，Netflix 无法对其进行扩展。记住这一经验，我们必须从实验开始就考虑模型的可扩展性和推理效率。\n\
  \n### 基于软件的加速推理\n\n基于软件的推理可以通过使用 `TensorRT` 冻结图来实现：\n\n* **TensorRT**: `TensorRT`\
  \ 由 Nvidia 发布，用于优化神经网络模型。许多公司在在其生产代码中使用 `TensorRT`。\n\n  ![](img/inception_v3_optimized.jpg)\n\
  \n  **图 1.15:** 展示了 TensorRT 如何工作。\n\n`TensorRT` 由 Nvidia 发布的，用于优化神经网络模型。`TensorRT`\
  \ 被许多公司用于其生产代码。\n\n![](img/inception_v3_optimized.jpg)\n\n（注：此处原文重复了部分说明文字）\n\n\
  `TensorRT` 执行多种操作以使其更快。\n\n* 卷积、偏置和 `relu` 被融合为一层。\n* 并行层被合并。\n* 删除了反向传播参数。\n* 基于\
  \ `FP32`（双精度）的模型转变为 `FP16`（单精度）和 `INT8` 模型。\n\n`TensorRT` 接收 `ONNX` 格式的模型并生成 `TensorRT\
  \ 引擎`。`ONNX` 是一种表示深度学习模型的开放格式。通过 `ONNX`，AI 开发者可以在不同工具之间轻松移动模型并选择最佳组合。\n\n**冻结图**:\
  \ `TensorFlow` 使用此技术加速推理。在 `TensorFlow` 生成的图中图中许多参数与反向传播、权重更新、输入队列和解码以及检查点有关。这些在推理期间不再需要。有时可以观察到大小为几\
  \ GB 的模型在冻结图后缩小到了几 MB。\n\n### 基于硬件的加速推理\n\n随着自动驾驶汽车以及 `Alexa`、`Google Home` 和 `Siri`\
  \ 等个人辅助设备的出现，确保我们的模型能够在边缘节点上运行至关重要。通常，边缘节点是内存和计算能力较低的设备。模型必须足够小、快速且高效，才能适配到这种设备中。市场上已有基于硬件的推理设备可以实现这一点。一些针对推理优化的计算设备包括：\n\
  \n* `Nvidia Turing` 和 `Jetson` 生态系统\n* Intel 的 `Movidius 2450`\n* 华为的 `Kirin 970`\n\
  * 高通的 `660`\n\n此类推理设备所需的某些属性如下：\n\n* 低功耗\n* 低成本（需要许多设备；每个边缘一个）\n* 易于部署\n* 推理速度\n\
  \n可以在以下设备类型进行推理：\n\n* `CPU`\n* `GPU`\n* `FPGA`\n* `DPU`\n* `ASIC`\n\n该列表按灵活性递减、推理效率递增排列。\n\
  \n\n\n\n\n### 三大学习原则\n\n某些某些原理可以帮助避免远期问题，尽管它们在实际执行过程中没有直接帮助。这些原则与通用的机器学习（ML）无关，但学习这些原则有助于我们更好地理解机器学习。\n\
  \n### 模型相关概念\n\n**奥卡剃刀（Occam’s Razor）**：生活中有一句常话是“简单即是”。奥卡剃刀理论认为，`实验应该尽可能简单，但不能过于简单`。用通俗的话说，应该用剃刀对数据进行切分，直到它提供完全符合逻辑的解释。拟合数据的简单模型也是最合理的。这里有几个需要回答的问题：\n\
  \n1. 模型简单意味着什么？\n2. 我们如何知道它是一个简单模型？\n\n### 模型简单意味着什么？\n\n模型的简单性可以通过以下方式进行衡量：\n\n\
  1. 通过衡量单个假设的复杂度（我们通常将其记为 `h`）\n2. 通过衡量整类假设的复杂度（我们将其记为一组 `H`）\n\n`h` 的复杂度可以按如下方式衡量：\n\
  \n1. 如果说是一个 70 次多项式或 100 次多项式，哪一个更复杂？\n2. 以最小位数的**最小描述长度（MDL）**可以解释这一点。柯尔莫哥夫复杂度（Kolmogorov\
  \ complexity）可以对其进行更好的解释，但 MDL 更友好，因为它不受计算能力等因素的影响。\n\n可以使用两种方法来衡量假设组（`H`）的复杂度：\n\
  \n1. 可以用熵（Entropy）来衡量该组的复杂度。\n2. 可以使用瓦普尼克-丘沃内基基斯（**VC**）维度。它通过观察假设给出一个描述该组多样性的单一数值。\n\
  \n有时，我们认为数据是复杂的，但在更高维度上取相同的数据可以使其处理变得简单。这是支持向量机的工作原理。一个简单的假设比复杂的假设要好。奥卡剃刀无声地告诉我们，我们必须理解自己所做的一切，因为盲目选择复杂的假设可能会导致我们的分析陷入过拟合。让我们通过“股市预言家”的例子来理解算法的复杂度。假设你每天都会收到邮件，预测股市将上涨还是下跌。你收到了未来四天的预测，且这些预测都是正确的。在第六天，你收到一封邮件，说为了下一次预测请支付\
  \ 50 美元。\n\n你最终付钱的可能性更大，但理解这是如何发生的至关重要。因此，预言家已经发现了一个复杂的算法来预测股市，或者发生了其他事情。实际上，发送这封邮件的人起草了\
  \ 32 封邮件并发送给 32 个人。一半的邮件说明市场将下跌，另一半说明市场将上涨。到当天结束时，他们有 16 收收邮件被证明是正确的。在第二天，他对这 16\
  \ 个人重复实验，人数每天减少，到了第六天，只剩一个人正确地收到了所有预测。在这一天，那个人收到了索要 50 美元的邮件。这就是幕后发生的情况。发送邮件的人看到这个算法的预测能力非常强大，因为那个人并不知道它的失败。这里只有一个假设，而且它是完全正确的。但实际上，有\
  \ 32 个假设，所以这一组的预测能力大约为 `1/32* 100%`，因此这个假设集是没用的。\n\n### 数据相关概念\n\n当数据收集以偏偏的方式进行时，就会发生采样偏差，因为学习也会产生偏偏的结果。在收集训练数据时，我们应该始终考虑测试数据/真实生活的数据分布。经常出现由于分布相关问题导致训练数据在测试数据上表现糟糕的情况。有时，可以通过对少量与测试数据分布相似的数据进行微调来修正这种分布。假设有一个个人助手，我们假设它是\
  \ Alexa，它是使用美国口音训练的。当任何人说 `Alexa,` 时，它会醒来并遵循语音指令。这个系统对于说印度口音的人还能以同样的效率工作吗？我怀疑。为了纠正这种分布，应该重新训练模型，或者在印度口音相关的数据上进行微调。下图显示了训练（Train）数据与测试（Test）数据分布差异的含义：\n\
  \n![](img/test_train_distribution.jpg)\n\n**图 1.16：** 训练数据与测试数据分布差异的含义。\n\n让我们再举一个例子来说明数据偏差如何影响最终模型。在候选人\
  \ X 和 Y 的印度选举中，一家新闻频道在选举后进行了在线投票，在结果公布前预测谁将获胜。该新闻频道获得了数千条回复，根据统计分析宣布 X 赢了 Y。当实际结果公布时，情况反转了，候选人\
  \ Y 以大幅优势获胜。现在，问题出在哪里？问题出在在线投票上。年龄组对结果产生了巨大影响。在线投票的大多数人是倾向于 X 而优于 Y 的年轻人，这反映在结果中。但这次投票没有涵盖大多数人口，包括老年人、没有接入互联网的人或其他倾向于\
  \ Y 而优于 X 的人。这就是训练数据和测试数据分布的变化如何影响预测的例子。\n\n数据窥探（Data snooping）是指研究人员在查看数据后才做出的统计推断。它也被称为数据修饰（data\
  \ finishing）、数据挖掘（data dredging）、P 值操控（p-hacking）和数据屠杀（data butchery）。“只要你拷问足够的数据，它就会承认一切”——**罗纳德·科斯**。是的，模型会承认一切，但它无法在测试数据上正确预测。例如，假设我们有以下数据：\n\
  \n![](img/data_snooping.jpg)\n\n**图 1.17：** 理解数据窥探的数据示例。\n\n理想情况下，你的方程应该是：`1 + x[1]\
  \ + x[2] + x[1]*x[2] + x[1]² + x[2]²`。通过基础数学知识，你已经知道有用的部分是 `x[1]² + x[2]²`。这样做使你在训练数据上获得了良好的准确率，但这个模型永远无法泛化，因为它在以偏偏的方式学习数据。无意的数据窥探可以通过执行某些检查来防止：\n\
  \n* 主要思想不是通过观察数据的每一个点来开发算法，而是通过观察数据的模式/属性。\n* 不要根据你观察到的数据点来限制你的算法。如果你这样做，你的算法在测试数据上的表现将最差。\n\
  * 在收集或使用数据之前，思考你将使用的假设。应该根据数据的特征来选择假设，因此应首先选择过去在相似数据上表现良好的假设进行实验。\n\n## 结论\n\n\n\
  \n\n\n本章为我们在整本书中构建的内容奠定了基础。本章涵盖了最初且最简单的在示例数据上运行良好的感知机模型。我们还介绍了一些用于识别模型问题的基本方法，例如偏差-方差调优（bias-variance\
  \ tuning）以及使用正则化将模型泛化到未知数据的方法。我们还查看了可能的各种矩阵，以衡量模型的进展和质量。本章非常有用，并将始终处于任何机器学习或深度学习工作流的核心位置。\n\
  \n在下一章中，我们将学习文本处理技术。\n\n# 第 2 章：文本处理技术\n\n本章首先将让你意识到与自然语言处理（`NLP`）相关的挑战。本章通过提供各种示例帮助你理解为什么处理\
