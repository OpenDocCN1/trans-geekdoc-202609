  \n在上一章中，我们查看了 `GloVe` 和 `Word2Vec` 的实现。它们都利用前馈网络来训练模型，其中当前输入和上一个输入之间没有映射关系。前馈网络架构很好，但不能用于解决所有类型的任务。本教程完全关于理解\
  \ `RNN` 的概念。在日常生活中，你已经在手机上使用了带有循环单元的应用。`RNN` 驱动了你键盘上的预测输入功能。大多数语音辅助系统如 `Cortana`、`Siri`、`Google\
  \ Home` 和 `Alexa` 都使用了某些高级形式的 `RNN`。\n\n为了说明 `RNN` 的用法，让我带你走一遍其中一个示例。假设你想使用前馈网络来寻找给定句子的情感。要实现这一点，需要遵循的逻辑步骤如下：\n\
  \n*   将句子拆分为单词（假设我们有 10 个单词）\n*   获取每个单词的稠密向量（假设我们有一个 100 维向量）\n*   将其传递给神经网络\n\n\
  该问题的本质是顺序性的，将每个单词传递给前馈网络的效果将不会像 `FNN` 那样；两个单词之间没有关系映射，而且没有机制可以根据整个句子给你给出情感结果。传递整个句子而不是单词似乎是一个选择，但对于\
  \ 10 个单词来说，这是一个昂贵的选择，因为每个单词都有一个 100 维向量，组合后输入特征大小将达到 10000 ($10^{100}$)。如果前馈网络的第二层感知器数量是输入的一半，那么输入（即\
  \ 5000），两者之间的权重矩阵维度将是 `[10000, 5000]`。这是一个非常庞大的待训练矩阵。为了解决这个问题并建立上一个输入与当前输入之间的关系，需要一种不同类型的架构，被称为\
  \ `RNN`。\n\n如今，`RNN` 指的是一组技术，包括 `Vanilla RNN`、`GRU` 和 `LSTM`。`Vanilla RNN` 是 `RNN`\
  \ 最简单的形式，但它存在许多缺点。其中之一是梯度消失，我们将在接后的主题中详细讨论。如今，`Vanilla RNN` 和 `RNN` 通常互换使用。本教程最准确说是关于\
  \ `Vanilla RNN` 的。\n\n`RNN` 结构源于 `FNN`，但它具有内部循环。具有单输入、单输出且隐藏层中具有单隐藏感知器的典型 `FNN`\
  \ 可以可视化如下。`RNN` 具有顺序或内部内存的概念。它有一种存储与上一个输出相关信息的机制。早些描述的带有循环组件的 `FNN` 看起来如下所示：\n\n\
  ![](img/simple_perceptron_and_RNN.jpg)\n\n**图 4.1：** 展开形式的 RNN。\n\n如图所示，`RNN` 具有循环机制，可以作为上一个和当前信息之间的公路。这种在上一个和当前信息之间的公路被称为\
  \ `RNN` 的隐藏状态。回到我们之前的示例，假设我们有一条电影评论：“电影剧情糟糕。”让我们看看 `RNN` 在这里将提供什么帮助。`RNN` 类型的网络最终将帮助预测评论的情感。一个带有随机隐藏状态的单元输入了单词“Movie”；该单元给出输出和隐藏状态。更新后的隐藏状态随之传递给下一个单元。这个隐藏状态与之前的学习和当前的学习相结合。单词“was”再次影响这个隐藏状态，并给出更新后的隐藏状态和输出。在所有单词结束后，隐藏状态将持有反馈的核心，人们可以据此将句子分类为正面或负面。\n\
  \n### 滚动与展开\n\n为了理解 `RNN`，`图 4.1` 显示每个单词都有独立的单元。上面显示的单元只有一个单元，但为了更好地理解，在下一张图中展示了它的展开形式。实际上，它只有一个接收输入并给出输出和隐藏状态的单元。隐藏状态在下一步中也会被利用，并一直持续到序列结束。相同网络的展开所示：\n\
  \n![](img/Rnn_unrolling.jpg)\n\n**图 4.2：** 展开形式的 RNN。\n\n`RNN` 单元从时间 `t = 0` 展开到时间\
  \ `t = t+n`。在 `RNN` 中，每个输入被称为一个时间步。在我们的示例中，每个单词可以称为一个时间步。时间步通常给为 `t`、`t + 1`、`t\
  \ + 2`……`t + n`。这里，`n` 是时间步的总数。在前向传播中，我们随着每个时间步向前移动，并在反向传播中执行“随时间反向传播”或 `BPTT`。`BPTT`\
  \ 似乎是训练 `RNN` 时反向传播梯度的花哨名称。带有所有相关权重和隐藏层的完整网络可以给出如下：\n\n![](img/Rnn_details.jpg)\n\
  \n**图 4.3：** 关于 RNN 如何工作的数学细节。\n\n`RNN` 的基本方程可以给出：\n\n`o[t] = tanh(w[ih] x[t] +\
  \ b[ih] + w[hh] h[t-1] + b[hh])`\n\n其中 `h[t]` 是时间 `t` 时的隐藏状态，`h[t-1]` 是时间 `t–1`\
  \ 处上一层的隐藏状态，或者是时间 `t = 0` 时的初始隐藏状态，`x[t]` 是时间 `t` 时的输入。此外，`w[ih]` 是输入到隐藏的权重，`w[hh]`\
  \ 是从之前隐藏到当前隐藏的权重，`b[ih]` 和 `b[hh]` 分别是输入和隐藏的偏置。\n\n在 PyTorch 中实现 `RNN` 非常简单。PyTorch\
  \ 处理了许多与实现和初始化权重相关的抽象。`RNN` 函数需要三个参数：\n\n*   `input_size`：输入 `x` 的预期特征数量。\n*   `hidden_size`：隐藏状态\
  \ `h` 的特征数量。\n*   `num_layers`：循环层数。例如，`num_layers=2` 意味着堆叠两个 RNN 层。RNN 的第二层从第一层派生输入。\n\
  \n`RNN` 的输入形状为 `[batch_size, max_time_steps, features]`。假设我们正在处理情感分析任务。为了使维度相同，我们假设一个句子最多有\
  \ 20 个单词。如果句子较小则进行填充，较长的句子将被截断以使单词大小为 20。每个单词有 100 维嵌入。每个批次有 64 个句子，因此输入的最终形状将为\
  \ `[64, 10, 100]`。这里，10 是我们的最大时间步。你可以像下面所示地初始化一个 RNN：\n\n```python\nimport torch\n\
  \nrnn = torch.nn.RNN(10, 20, 2)\ninput = torch.randn(5, 3, 10)\nh0 = torch.randn(2,\
  \ 3, 20)\noutput, hn = rnn(input, h0)\n\n>>>torch.Size([5, 3, 20]) #output\n```\n\
  \n\n\n\n\n考虑上述隐藏状态图；随着序列的延长，早期时间步的影响会减小，并最终变为零。由于这个问题，`RNN` 无法记住更长的序列。这种 `RNN` 的现象被称为“短期记忆”（`Short-Term\
  \ Memory`）。我们将在接下来的主题中讨论该问题的根源及其解决方案。\n\n你可以在 [`arxiv.org/abs/1808.03314`](https://arxiv.org/abs/1808.03314)\
  \ 学习更多关于循环神经网络（`RNN`）和长短期记忆（`LSTM`）网络的基础性知识。\n\n### 实现嵌入概念\n\n在上一章中，我们根据单词和字符生成了嵌入（embeddings）。嵌入的帮助不仅限于提供标记的数值输出。嵌入是自然语言处理中迁移学习的一种方式。在图像处理中，迁移学习的概念已经非常成熟，并且在\
  \ NLP 领域也变得越来越强大。在本教程中，我将演示嵌入如何帮助训练。我们将通过一个例子来说明迁移学习如何提供帮助。假设汤姆住在在美国，是一个英语母语者。他在法国获得了一个实习机会，并将于\
  \ 3 个月后旅行。汤姆不懂法语；但他很聪明，所以他开始听了 3 个月的法语电台。尽管起初他什么也听不懂，但他的大脑开始逐渐理解这种语言。当他到达法国时，他已经在某种程度上对大脑进行了预训练。现在，这种对法语的低级理解帮助他更快地学习法语。这与嵌入的工作原理相似。嵌入通过强制网络从上下文中学习形成。这些学习结果被传递给类似\
  \ `RNN` 的网络；网络就可以学习，而不是从零开始学习。\n\n正如与 `FastText` 相关的教程讨论的那样，预训练嵌入是可用的，可以很容易地用于我们的模型中。我在\
  \ GitHub 上找到了一个模块，可以让你轻松下载所需的嵌入。这个包被称为 `Chakin`，是一个预训练词向量的简单下载器。你可以使用 `pip` 安装 `Chakin`，并如下所示使用它：\n\
  \n```python\nimport chakin\nchakin.search(lang='English’) # 这将列出所有可用嵌入\n```\n\n\
  | 编号 | 名称 | 维度 | 语料库 | 词汇量 |\n| --- | --- | --- | --- | --- |\n| 2 | `fastText(en)`\
  \ | 300 | Wikipedia | 2.5M |\n| 11 | `GloVe.6B.50d` | 50 | Wikipedia+Gigaword 5\
  \ (6B) | 400K |\n| 12 | `GloVe.6B.100d` | 100 | Wikipedia+Gigaword 5 (6B) | 400K\
  \ |\n| 13 | `GloVe.6B.200d` | 200 | Wikipedia+Gigaword 5 (6B) | 400K |\n| 14 | `GloVe.6B.300d`\
  \ | 300 | Wikipedia+Gigaword 5 (6B) | 400K |\n| 15 | `GloVe.42B.300d` | 300 | Common\
  \ Crawl(42B) | 1.9M |\n| 16 | `GloVe.840B.300d` | 300 | Common Crawl(840B) | 2.2M\
  \ |\n| 17 | `GloVe. Twitter.25d` | 25 | Twitter(27B) | 1.2M |\n| 18 | `GloVe. Twitter.50d`\
  \ | 50 | Twitter(27B) | 1.2M |\n| 19 | `GloVe. Twitter.100d` | 100 | Twitter(27B)\
  \ | 1.2M |\n| 20 | `GloVe. Twitter.200d` | 200 | Twitter(27B) | 1.2M |\n| 21 | `word2vec.\
  \ GoogleNews` | 300 | Google News(100B) | 3.0M |\n\n**表 4.1**\n\n你可以选择任何一个向量用于你的训练流水线：\n\
  \n```python\nchakin.download(number=2, save_dir='././/') # 选择 fastText(en)\n```\n\
  \n从这一章开始，我们将使用一种流行的正则化技术 - `Dropout`。今天大多数深度学习实现都使用 `dropout`。正如其名，它会随机丢弃两层之间连接的百分比。这可以用图示所示：\n\
  \n![](img/dropout.jpg)\n\n**图 4.4：** 网络图 A. 无 Dropout B. 有 Dropout。\n\n所示，在正常网络中，所有层都与前一层和后一层保持全连接。dropout\
  \ 按照定义的百分比随机丢弃这些层之间的连接。如果定义的 dropout 百比/概率为 0.2，则 20% 的连接将被丢弃。这种连接丢弃发生在每次迭代中，并在图中引起变异。由于这种变异，网络不会依赖强且偏的特征，而是尝试基于较弱的特征进行泛化。这就是\
  \ dropout 有助于更好地泛化的原因。\n\n### 下载数据集\n\n为了演示嵌入如何提供帮助，我们将对情感分析任务进行实验。我使用了一个包含 5331\
  \ 条正面评论和 5331 条负面评论的电影评论数据集。整个实验位于 [`www.cornell.edu/pabo/movie-review-data.tar.gz`](http://www.cornell.edu/pabo/movie-review-data.tar.gz)。\n\
  \n### 预处理\n\n我使用 `TorchText` 来预处理数据。预处理包括：\n\n* 读取数据\n* 定义字段\n* 将数据分为训练、验证和测试集\n\
  * 下载嵌入\n\n### 训练\n\n训练将针对 `FastText` 进行，带有嵌入的 `RNN` 输出 300 维隐藏张量。带有预训练嵌入的网络可以定义如下：\n\
  \n```python\nclass SCRATCH_RNN(nn.Module):\n    def __init__(self, vocab_size, embedding_dim,\
  \ hidden_dim, output_dim, n_layers, bidirectional, dropout, sentiment_vocab):\n\
  \        super(SCRATCH_RNN, self).__init__()\n        self.embedding = nn.Embedding(vocab_size,\
  \ embedding_dim)\n        self.rnn = nn.RNN(embedding_dim, hidden_dim, num_layers=n_layers,\
  \ bidirectional=bidirectional, dropout=dropout)\n        self.fc = nn.Linear(hidden_dim\
  \ * 2, output_dim)\n        self.dropout = nn.Dropout(dropout)\n\n    def forward(self,\
  \ x):\n        embedded = self.dropout(self.embedding(x))\n        output, hidden\
  \ = self.rnn(embedded)\n        # 拼接最后的向前 (hidden[-2,:,:]) 和向后 (hidden[-1,:,:])\
  \ 层\n        # 应用 dropout\n        hidden = self.dropout(torch.cat((hidden[-2, :,\
  \ :], hidden[-1, :, :]), dim=1))\n        return torch.softmax(self.fc(hidden.squeeze(0)),dim=1)\n\
  ```\n\n`SCRATCH_RNN` 类从零开始通过 `embedding` 函数构建嵌入。`Embedding` 函数通过索引检索嵌入。嵌入是可训练的，因此权重在训练过程中不断变化并有助于生成更好的词向量。此类嵌入向量传递给\
  \ `RNN` 函数以获取隐藏张量。隐藏张量是核心，因此其输出通过线性变换。在应用 softmax 后，计算出预测输出。\n\n另一个网络是我们传递预训练嵌入的网络。这个网络与上一个相似，除了加粗所示的行变化：\n\
  \n```python\nclass FT_RNN(nn.Module):\n    def __init__(self, vocab_size, embedding_dim,\
  \ hidden_dim, output_dim, n_layers, bidirectional, dropout, sentiment_vocab):\n\
  \        super(FT_RNN, self).__init__()\n        self.embedding = nn.Embedding(vocab_size,\
  \ 300)\n        self.embedding.weight.data.copy_(sentiment_vocab.vectors)\n    \
  \    self.embedding.weight.requires_grad = True\n        self.rnn = nn.RNN(embedding_dim,\
  \ hidden_dim, num_layers=n_layers, bidirectional=bidirectional, dropout=dropout)\n\
  \        self.fc = nn.Linear(hidden_dim * 2, output_dim)\n        self.dropout =\
  \ nn.Dropout(dropout)\n\n    def forward(self, x):\n        embedded = self.dropout(self.embedding(x))\n\
  \        output, hidden = self.rnn(embedded)\n        # 拼接最后的向前 (hidden[-2,:,:])\
  \ 和向后 (hidden[-1,:,:]) 层\n        # 应用 dropout\n        hidden = self.dropout(torch.cat((hidden[-2,\
  \ :, :], hidden[-1, :, :]), dim=1))\n        return torch.softmax(self.fc(hidden.squeeze(0)),dim=1)\n\
  ```\n\n\n\n\n\n```python\nreturn self.fc(hidden.squeeze(0))\n```\n\n修改后的行（如上文所示）从加载的\
  \ `FastText` 模型向量中复制了预训练向量。因此，在 `FT_RNN` 类中，我们并没有从零开始训练嵌入（embeddings）。我允许该网络训练 100\
  \ 个轮次（epochs），并绘制了两个模型的准确率进展图。图如下：\n\n![](img/advantage_of_embeddings.jpg)\n\n**图\
  \ 4.5：** 从零开始训练嵌入与使用预训练 FastText 嵌入时的准确率差异。\n\n显而易见，预训练嵌入有助于学习。从零开始训练的准确率约为 70%，而使用\
  \ `FastText` 嵌入进行训练则提供了 88% 的准确率。\n\n在前一个网络中，我只报告了训练数据的准确率。整个代码都包含了测试集和验证集的划分并可用。作为练习的一部分，你可以尝试对网络进行以下更改以加深理解：\n\
  \n*   尝试不同的嵌入，并注意准确率/损失（loss）的变化。\n*   尝试不同的数据集，以观察趋势是否随数据集的变化而不同（`torchtext.datasets`\
  \ 中随 `TorchText` 提供了不同的数据集）。\n*   通过验证集和测试数据上的迭代检查准确率。\n\n请参考以下链接：\n\n*   **Dropout**：一种防止神经网络过拟合的简单方法：*[[`jmlr.org/papers/volume15/srivastava14a.old/srivastava14a.pdf`](https://jmlr.org/papers/volume15/srivastava14a.old/srivastava14a.pdf)*\n\
