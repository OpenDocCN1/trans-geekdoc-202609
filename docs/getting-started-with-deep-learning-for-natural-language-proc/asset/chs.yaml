  \n# 加载音频文件\n\n可以使用 `load` 函数加载音频文件。加载文件后，它会被解码为一维时间序列。默认采样率为 22KHz：\n\n```python\n\
  import librosa\naudio_path = ‘audio-path’\ntime_series, sampling_rate = librosa.load(audio_path)\n\
  print(type(time_series), type(sampling_rate))\n```\n\n可以通过以下方式更改采样率：\n\n```python\n\
  librosa.load(audio_path, sampling_rate = 44100)\n```\n\n通过指定参数 `sr = None` 可以禁用采样。在这种情况下，整个信号将被解码并输出，使用机器学习流水线进行处理需要很长时间：\n\
  \n```python\nlibrosa.load(audio_path, sampling_rate = none)\n```\n\n# 播放音频文件\n\n\
  在本章中，我们将经常使用 Ipython notebook 进行实验。因此，我们将使用 `pyAudio` 包直接从 Ipython notebook 播放音频：\n\
  \n```python\nimport IPython.display as ipd\nipd.Audio(audio_path)\n```\n\n它将打开另一个窗口直接播放声音，并具有带有几个按钮的简单界面。\n\
  \n### 信号可视化\n\n要显示或可视化音频信号，你可以使用 `librosa.display` 函数，它支持以波形图、频谱图和颜色映射的形式进行可视化。频谱图的绘制非常，因为它显示了音频在给定时间的幅度和频率。幅度和频率是音频信号的重要特征。波形用于绘制幅度随时间变化的图，其中\
  \ `Y`-轴为幅度，X 轴为时间。以下频谱图和波形图是一个音频文件的示例：\n\n```python\nplt.figure(figsize=(14, 5))\n\
  librosa.display.waveplot(time_series, sampling_rate)\n```\n\n小波图看起来所示：\n\n![](img/wavelet.jpg)\n\
  \n**图 10.2:** 小波\n\n频谱图是声音频率频谱的图形表示。在这里，你可以轻松地看到频率随时间的变化：\n\n```python\ntime_series_shift\
  \ = librosa.stft(time_series)\nXdb = librosa.amplitude_to_db(abs(time_series_shift))\n\
  plt.figure(figsize=(14, 5))\nlibrosa.display.specshow(Xdb, sr=sampling_rate, x_axis=’time’,\
  \ y_axis=’hz’)\nplt.colorbar()\n```\n\n频谱图如下：\n\n![](img/spectrogram.jpg)\n\n**图\
  \ 10.3:** 频谱图\n\n在这里，`STFT` 是短时傅里叶变换，它转换信号使我们知道给定时间给定频率的幅度。\n\n# 特征提取\n\n在将音频数据推入机器学习流水线之前，应用各种特征提取技术。这些技术包括：\n\
  \n*   MFCC — 梅尔频率倒谱系数\n*   频谱质\n*   频谱滚动率\n\n# MFCC — 梅尔频率倒谱系数\n\nMFCC 是处理音频数据时最重要的特征。信号的\
  \ MFCC 是描述频谱整体形状的一组特征。你可以按照如下方式使用 `librosa` 计算 MFCC：\n\n```python\nmfccs = librosa.feature.mfcc(time_series,\
  \ sampling_rate)\nprint(“MFCC Shape :”,mfccs.shape)\n```\n\n显示 MFCC：\n\n```python\n\
  librosa.display.specshow(mfccs, sr=sampling_rate, x_axis=’time’)\n```\n\n第一个维度代表\
  \ MFCC 的数量，第二个维度代表可用帧的数量：\n\n![](img/mfcc.jpg)\n\n图 10.4:** MFCC\n\n# 频谱质\n\n它是寻找给定音频频率分布质的方法。如果音频以较高的频率结束，频谱将向高频偏移。如果音频范围内分布均匀，频谱质将位于中心。频谱质可以如下计算：\n\
  \n```python\nspectral_centroids = librosa.feature.spectral_centroid(time_series,\
  \ sampling_rate)[0]\nspectral_centroids.shape\n```\n\n为了可视化计算时间变量：\n\n```python\n\
  frames = range(len(spectral_centroids))\ntime_frame = librosa.frames_to_time(frames)\n\
  ```\n\n为了可视化归一化频谱质：\n\n```python\ndef normalize(time_series, axis=0):\n    return\
  \ sklearn.preprocessing.minmax_scale(time_series, axis=axis)\n```\n\n沿波形绘制频谱质：\n\
  \n```python\nlibrosa.display.waveplot(time_series, sr=sampling_rate, alpha=0.4)\n\
  plt.plot(time_frame, normalize(spectral_centroids), color=’green’)\n```\n\n`frames_to_time`\
  \ 将帧转换为 `time[i] == frame[i]`。\n\n![](img/spectral_centroid.jpg)\n\n图 10.5:** 频谱质\n\
  \n# 频谱滚动率\n\n频谱滚动率低于平均频率给定百分比的频率所在。如果我们定义 cutoff = 85%，则只提供低于 85% 的频率：\n\n```python\n\
  spectral_rolloff = librosa.feature.spectral_rolloff(time_series, sampling_rate)[0]\n\
  frames = range(len(spectral_rolloff))\ntime_frame = librosa.frames_to_time(frames)\n\
  ```\n\n\n\n\n\n```python\nlibrosa.display.waveplot(time_series, sr=sampling_rate,\
  \ alpha=0.4)\n```\n\n```python\nplt.plot(time_frame, normalize(spectral_rolloff),\
  \ color=’red’)\n```\n\n![](img/spectral_rolloff.jpg)\n\n**图 10.6:** 谱滚降 (Spectral\
  \ Rolloff)\n\nLibrosa 提取的特征比这里讨论的要得多。这些包括 chromastft、Constant Q cromagram、Croma\
  \ energy normalize - 一种 chroma 变体、每帧的 RMS 值、谱带宽、谱对比度、谱平坦度、用于谱图列的 N 阶多项式、过零率和节奏节拍图\
  \ (Tempogram)。你可以参考 Librosa 文档来详细探索这些特征。我已经在 `Ch10/story_of_phonemes.ipynb` 中提供了代码，你可以在那里复现之前描述的实现。\n\
  \n参考 Librosa 文档：[`librosa.github.io/librosa/`](https://librosa.github.io/librosa/)\n\
  \n# 训练小型网络\n\n我们将使用 `UrbanSound8K` 数据集来演示如何进行语音识别以及此类流水线通常需要的组件。\n\nUrbanSound8K\
  \ 数据集包含 8732 个标记的音频录制，分为 10 类，分别为 `air_conditioner`、`car_horn`、`children_playing`、`dog_bark`、`drilling`、`enginge_idling`、`gun_shot`、`jackhammer`、`siren`\
  \ 和 `street_music`。这些文件为 .wav 格式。UrbanSound8K 数据可以通过 [`urbansounddataset.weebly.com/urbansound8k.html`](https://urbansounddataset.weebly.com/urbansound8k.html)\
  \ 获取。运行此配方的实现时，确保已下载此数据集。\n\n语音识别流水线将包含以下步骤：\n\n1. 特征提取\n2. 构建 CNN 模型\n3. 在测试集上训练并估计性能\n\
  \n让我们逐学习。\n\n# 特征提取\n\n通过 Librosa 库提取各种特征。这些特征在之前的配方中进行了详细讨论。\n\n*   梅尔谱图 (Melspectrogram)：计算梅尔尺度谱图\n\
  *   MFCC (梅尔频率倒谱系数)\n*   `chroma_stft`：从波形或功率谱图计算色图\n*   `chroma_cq`：Constant Q\
  \ 色图\n*   `chroma_cens`：计算色度变体“色能量归一化”（CENS）\n\n所有这些特征随后被堆叠，最终的特征形状为 [m, 40, 5,\
  \ 1]。该形状与我们在模型中使用的 CNN 层兼容。\n\n# 构建 CNN 模型\n\n模型是一个非常简单的卷积网络，包含各种层，如卷积 2D、批量归一化、最大池化、线性/全连接层以及\
  \ ReLU 激活函数。模型接受由数据加载器生成的形状 [m, 40, 5, 1]，其中 m 是批大小 (batch size)。对其应用了两次带有中间批量归一化和\
  \ ReLU 激活的卷积变换。最终，最终形状收敛到形状 [m, 10]，其中 10 是类别数，m 是批大小。该模型太简单，无法产生卓越的准确率，但它将提供关于语音识别流水线如何设计的思路：\n\
  \n```python\nclass simple_network(nn.Module):\n    def __init__(self):\n       \
  \ super(simple_network, self).__init__()\n        self.conv1 = nn.Conv2d(in_channels=40,\
  \ out_channels=64, kernel_size=3, padding=1,stride=1)\n        self.bn1 = nn.BatchNorm2d(64)\n\
  \        self.relu = nn.ReLU()\n        self.drop= nn.Dropout(0.2)\n        self.conv2\
  \ = nn.Conv2d(in_channels=64, out_channels=128, kernel_size=3, padding=1, stride=1)\n\
  \        self.bn2 = nn.BatchNorm2d(128)\n        self.maxpool = nn.MaxPool2d(kernel_size=2,\
  \ padding=1)\n        self.dense1 = nn.Linear(in_features=128*3, out_features=128*2)\n\
  \        self.dense2 = nn.Linear(in_features=128*2, out_features=10)\n\n    def\
  \ forward(self, input_):\n        conv1_out = self.conv1(input_)\n        conv1_out\
  \ = self.bn1(conv1_out)\n        relu_applied_1 = self.relu(conv1_out)\n       \
  \ maxpol_out = self.maxpool(relu_applied_1)\n        conv_2_out = self.conv2(maxpol_out)\n\
  \        conv_2_out = self.bn2(conv_2_out)\n        relu_applied_2 = self.relu(conv_2_out)\n\
  \        drop_applied = self.drop(relu_applied_2)\n        dense1_out = self.dense1(drop_applied.view(drop_applied.shape[0],drop_applied.shape[1]*drop_applied.shape[2]))\n\
  \        relu_applied_3 = self.relu(dense1_out)\n        drop_applied = self.drop(relu_applied_3)\n\
  \        dense2_out = self.dense2(drop_applied)\n        relu_applied_4 = self.relu(dense2_out)\n\
  \        return torch.softmax(relu_applied_4, dim=1)\n```\n\n# 在测试集上训练并估计性能\n\n\
  使用 Adam 优化器和交叉熵损失函数进行训练。TensorBoard 记录的网络在测试数据上的收敛情况所示：\n\n![](img/urbansound_performance.jpg)\n\
  \n**图 10.7:** 网络在 UrbanSoundK 数据集上的性能。\n\n性能尚未达到标准，但网络正在学习，改变架构和参数可能会提供更好的准确率。\n\
  \n# 理解语音转文本\n\n语音转文本是一个有趣的研究领域；具有独特的终端应用。一些现实世界的应用列如下：\n\n*   通过自动转录节省时间\n*   无需等待客服人员接听电话；只需留言即可\n\
  *   通过语音命令即时编写重要的电子邮件和笔记\n\n许多先进的语音转文本应用依赖于许多手工特征，且通常不是端到端的。某些系统在某些领域表现非常好，但将其迁移到另一个领域可能需要完全重写。在这个配方中，我们将学习一种端到端的自动语音转文本实现。DeepSpeech\
  \ 由百度研究实验室于 2014 年发布。DeepSpeech 的更新版本名为 DeepSpeech-2，于 2015 年发布。这两种架构都允许端到端训练神经网络架构，能够产生最尖端的结果。\n\
  \n\n\n\n\n我们将从理解 DeepSpeech 背后的模型开始；DeepSpeech 模型包含 `RNN` 组件。在此训练集中，`signal` 将被视为话语\
  \ `x` 和标签 `y`。整个训练样本可以用数学公式表示为 `X = {(x[(1)], y[(1)]), (x[(2)], y[(2)])…}`。频谱图（Spectrogram）被用作模型的特征，其中\
  \ `T` 是以时间切片 `t` 形式呈现的总等分特征数。它可以用数学形式表示为 `x[t]^(i)`，`t = 1, …, T^(i)`。在任意一点的频谱图中，`p`\
  \ 代表在时间 `t` 处音频帧中频率的功率。接下来的示意图解释了 DeepSpeech 的特征。最终目标是在给定时间片 `x[t]^(i)` 的情况下预测任何字符\
  \ `c[t]`。在给定时间片 `x[t]^(i)` 的情况下预测字符 `c[t]` 的概率由 `y[t]^(i) = P(c[t] | x[t]^(i))`\
  \ 给出。该概率通过优化神经网络来计算，该网络具有五个隐藏层；所有层都是 `RNN` 层。前三层不是递归的，对于任意层 `l`，其输出表示为 `h[(l)]`。在第一层，提供了输入\
  \ `x[0]`，它也表示为 `h[(0)]`。对于前三层，所有的循环层都独立运行。对于时间 `t` 处频谱图中的任何时间切片，非 RNN 单元的输出计算如下：\n\
  \n```\nht) = g(W((l)) ht) b((l)))\n```\n\n其中：\n\n- `W^(l)` = 给定层的权重\n- `b^(l)` =\
  \ 给定层的偏置\n- `h^(l-1))` = 来自上一个隐藏层的输入\n- `g` = Clipped ReLu 激活函数可以给出\n\n第四层是双向循环层，它提供两个输出：正向状态\
  \ `h[(f)]` 和反向状态 `h[(b)]`。\n\n```\nht) = g(W((4)) ht) Wr) ht) – 1b((4)))\nht) =\
  \ g(W((4)) ht) Wr) ht) – 1b((4)))\n```\n\n正向层接受从 `t = 1` 到 `t = T` 的话语，而反向层接受从 `t\
  \ = T` 到 `t = 1` 的话语。\n\n最后，`Softmax` 应用于最终输出 `ht) = h[t]^(f) + h[t]^(b)`。它显示了给定字符在给定话语中概率。在计算给定字符的概率后，我们在该输出之上计算\
  \ `CTC` 损失以衡量预测误差。整体网络架构如下：\n\n![](img/deepspeeh.jpg)\n\n**图 10.8:** DeepSpeech\
  \ - 1 网络架构\n\n**来源:** [`arxiv.org/pdf/1412.5567.pdf`](https://arxiv.org/pdf/1412.5567.pdf)\n\
  \n该网络使用随机梯度下降进行训练，并保持 `momentum = 0.99`，通过常数因子降低学习率。`Dropout` 用于学习的正则化。在该模型发布一年后，百度研究对其进行了进一步优化，并提出了一个名为\
  \ DeepSpeech - 2 的新模型。新模型具有多个层。初始卷积层之后是一个或多个卷积层，然后是几个全连接层。`CTC` 损失被用作损失衡量。网络架构的示意图如下：\n\
  \n![](img/deepspeech2.jpg)\n\n**图 10.9:** DeepSpeech – 2 网络架构。\n\n该网络使用批量归一化（batch\
  \ normalization）进行训练。DeepSpeech - 2 的论文描述了不同安排的表现。这里列出了一些不同的安排：\n\n- 使用不同的 `RNN`\
  \ 层，如 `GRU` 和 `LSTM`\n- 使用可变的 `LSTM` 和 `CNN` 层\n- `CNN` 使用不同的步长（stride）\n- 单向和双向模型\n\
  \n在下一节中，我们将看到如何使用 DeepSpeech-2 将语音转换为文本。\n\n我们将使用 `DeepSpeechPyTorch` 实现的 DeepSpeech\
  \ - 2。\n\n### 安装\n\nDeepSpeech 可以像其他包一样安装和使用，或者我们可以直接下载它的 Docker 容器并开始使用，无需安装。Docker\
  \ 镜像可以使用随存储库提供的 Docker 文件构建。\n\n## 克隆仓库\n\n```bash\ngit clone https://github.com/SeanNaren/DeepSpeech.PyTorch.git\
  \ &&DeepSpeech.PyTorch\n```\n\n## 使用容器\n\n```bash\nsudonvidia-Docker build -t DeepSpeech2.Docker.\n\
  sudonvidia-Docker run -ti -v $pwd:/data:/workspace/data -p 8888\n```\n\n\n\n\n不要仅仅将模型作为黑盒运行，建议通过理解\
  \ `model.py` 来深入细节。该模型还支持 CTC 损失的更好实现 `Warp-CTC`。\n\n请查看以下链接以参考：\n\n*   DeepSpeech:\
  \ 扩展端到端语音识别：[`arxiv.org/pdf/1412.5567.pdf`](https://arxiv.org/pdf/1412.5567.pdf)\n\
  *   DeepSpeech 2: 英语中文端到端语音识别：[`arxiv.org/pdf/1512.02595.pdf`](https://arxiv.org/pdf/1512.02595.pdf)\n\
  \n# 理解文本转语音 (Text to Speech)\n\n利用计算技术从文本合成人工人类语音通常被称为文本转语音或 TTS。TTS 有许多应用，我们多年来一直在使用其中一些应用。一些现实生活中的应用包括：\n\
  \n*   **Read2Me**：将文章转换为语音，以便随地收听。\n*   **Narro**：用于在日常通勤和运动期间随地学习。\n*   **Play.ht**：与\
  \ Narro 类似，帮助在通勤、运动或健身时提高效率。\n\n现代 TTS 系统是复杂的，并且依赖人工工程特征。这使得 TTS 系统的过程劳动密集且复杂。百度提出了一种使用端到端深度学习训练的新模型\
  \ `DeepVoice`。`DeepVoice` 首次于 2017 年发布，之后介绍了三个版本，声称在 TTS 领域具有最先进的性能。在本教程中，我们将理解\
  \ `DeepVoice 1` 以获得此类系统工作原理的基本概念，然后学习如何在真实数据上使用 `DeepVoice-3` 实现。\n\n文本转语音系统并没有语音转文本那么简单。要理解\
  \ TTS，我们必须理解几个术语。字素（Grapheme）是特定语言书系统的最小单位，单个字素可能不携带任何意义。字素可以是字母或字母组合、数字、标点符号、汉字和字形连字。字素通常标注在角括号中。音素（Phoneme）是按特定语言方式区分一个单词与另一个单词的声音单位。TTS\
  \ 系统具有以下子模型：\n\n*   字素到音素模型：将书面文本转换为音素。\n*   分割模型：在给定的语音数据集中定位音素边界。给定一个带有逐个音素翻译的音频文件，分割模型会识别给定音素的音频从何时开始和结束。\n\
  *   音素持续时间模型：预测每个音素的时间持续时间。它确保了翻译更像人类。\n*   基频模型预测音素是会被转换为声音还是音符；这处理了静音音素。\n*  \
  \ 音频合成模型结合字素到音素的输出，调制音素持续时间和基频，以以高采样率合成音频。\n\n现在，我们将详细查看每个模型。\n\n# 字素到音素模型\n\n字素到音素模型采用了编码器-解码器架构。该模型具有多层双向\
  \ `GRU`。该架构与语言翻译模型相似。该模型使用教师强制（teacher forcing）来生成音素。使用了具有 1024 个单元的双向层。\n\n# 分割模型\n\
  \n该模型经过训练，输出给定语句与目标音素序列之间的对齐。这与语音转文本非常相似，其中给定音频与目标音素的对齐是最终目标。在这里，使用了 `CTC loss`\
  \ 来训练该模型。\n\n# 音素持续时间与基频模型\n\n在这里，两个模型合并为一个。该模型接收上一个模型生成的语句，并产生音素持续时间和音素发音概率。该模型有两个具有\
  \ 256 个单元的全连接层，每个层后面跟着一个带有 128 个 `GRU` 的单向循环层。`GRU` 输出被交给全连接层。\n\n# 音频合成模型\n\n该模型类似于\
  \ `Wavenet` 模型，由 DeepMind 首次提出用于合成真实的真人声音。除了 `Wavenet` 之外，研究人员使用 `Quasi RNN` 架构以获得比普通\
  \ `RNN` 更快的速度。`Wavenet` 的细节超本书的范围，但你可以参考原始论文。以下是网络的示意图：\n\n![](img/deepVoice.jpg)\n\
  \n**图 10.10:** DeepVoice 模型 a) 训练过程 b) 推理过程。\n\n**来源:** DeepVoice: 实时神经 TTS。\n\n\
  这是一个基础模型，百度在此之后发布了 `DeepVoice 2` 和 `DeepVoice-3` 模型。在下一节中，我们将看到如何实际使用 `DeepVoice\
  \ Model 3` 从文本生成语音。\n\n我们将使用基于 PyTorch 的 `DeepVoice` 文本转语音合成模型实现。\n\n### 下载数据集\n\
  \n可以使用以下所有数据集进行文本转语音模型的训练：\n\n*   **LJSpeech (英语)**：[`keithito.com/LJ-Speech-Dataset/`](https://keithito.com/LJ-Speech-Dataset/)\n\
  *   **VCTK (英语)**：[`homepages.inf.ed.ac.uk/jyamagis/page3/page58/page58.html`](http://homepages.inf.ed.ac.uk/jyamagis/page3/page58/page58.html)\n\
  *   **JSUT (日语)**：https://sites.google.com/site/shinnosuketakamichi/publication/jsu\n\
