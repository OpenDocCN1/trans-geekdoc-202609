  \ : M, \\eta[1] : k)$\n\n### 概述\n\n我有一组 $M$ 份文档，每份文档包含 $N$ 个词，每个词都由 $K$ 个主题集合中的某一个主题生成。我正在寻找以下内容的联合后验概率：\n\
  \n* `θ`: 主题分布，每个文档对应一个。\n* `z`: 每个文档的 $N$ 个主题。\n* `β`: 词汇分布，每个主题对应一个。\n\n给定：\n\n\
  * `D`: 我们拥有的所有数据（即语料库）\n* `α`: 每个文档的参数向量（文档-主题分布）\n* `η`: 每个主题的参数向量（主题与词汇分布）\n\n\
  目前剩余唯一具有挑战性的工作是计算后验概率，这无法被轻易解决。这个问题属于优化类问题。它需要计算损失、纠正所有可学习的参数和矩阵，并反复地建立这种关联直到收敛。`lda2vec`\
  \ 是另一种用于主题建模的相关算法。Christopher E Moody 在其论文“Mixing Dirichlet Topic Models and Word\
  \ Embeddings to Make lda2vec”中提出了这种技术。`lda2vec` 是 Word2Vec 和 LDA 的扩展，用于联合学习词主题和文档向量。它特别利用了\
  \ skip-gram 模型，该模型也用于训练 word2vec：\n\n![](img/lda2vec.jpg)\n\n**图 7.4:** 展示 lda2vec\
  \ 如何训练的插图。\n\n主题建模可以使用类似 `Gensim` 的预构建库进行。在目前的演示实现中，我们将使用 20-newsgroup 数据，这是一个包含\
