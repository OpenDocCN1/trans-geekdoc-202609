  \n## 进阶情感分析\n\n我们在前面的章节中看到了情感分析应用于各种数据集的各种方案。在 `第 4 章，使用 RNN 用于 NLP` 中，我们看到了注意力机制如何利用每个时间戳的信息并将其与最终隐藏状态结合，以获得最先进的结果。这个方案是关于如何将注意力机制用于文本分类问题。在本章中，我们将构建带有注意力机制和不带注意力机制的网络，并对两者进行比较，以查看哪一个性能更好。\n\
  \n带有注意力机制的递归网络如下所示：\n\n![](img/Attention_based_classification.jpg)\n\n**图 7.12：**\
  \ 基于注意力机制的双向 RNN 结构。\n\n如图所示，网络在不同的时间步输入一个单词。`递归神经网络`（`RNN`）既有正向也有反向方向，且 `RNN` 可以是任何单元，如原生\
  \ `RNN`、`GRU` 或 `LSTM`。隐藏状态由 `h[1]`、`h[2]`、`h[3]`、……`h[t-1]`、`h[t]` 表示。隐藏状态上的箭头方向表示其方向。`h[1]→`\
  \ 表示隐藏状态沿序列向前移动，而 `h[1]←` 表示隐藏状态相对于序列向后移动。对于任何 token，隐藏状态 `h[i]` 是正向和反向状态的拼接 `h[1]\
  \ = [h[1]←, h[1]→]`。\n\n在不带注意力机制的 RNN 中，`h[t]→` 和 `h[t]←` 向量拼接形成最终表示。`h[t]→` 包含了整个序列正向的核心，而\
  \ `h[1]←` 包含了整个序列反向的核心。在这种方法中，没有考虑特定 token 的重要性，所有 token 具有相同的权重。在带有注意力机制的 RNN 中，权重是变化的。\n\
  \n\n\n\n*   **检查结果**：下方给出了带有注意力机制和不带注意力机制的网络准确率对比。带有注意力逻辑的 RNN 准确率达到了 90%，而在相同迭代次数下，不带注意力逻辑的\
