  \n你可以通过简单执行 `pip install -r Ch6/requirements.txt` 来安装 `requirements.txt` 中列出的所有包项。\n\
  \n### 简介\n\n本章解释了 NLP 的一个重要方面，即使用预训练模型。预训练模型的使用就像图像处理一样。它也可以被视为在 NLP 中执行迁移学习的方法，这种概念在图像处理中同样存在。语言任务可以是任何分类、语言翻译、摘要、命名实体识别等。每个任务都从任务相关的文本数据开始。然后使用\
  \ ELMo-BERT、`BERT`、`SkipThought`、`Transformer`、`InferSent` 等模型将这些数据转换为词级或句级向量。这些密集向量随后通过\
  \ `LSTM` 或 `CNN` 或密集层等各种层向下处理，产生所需的输出。以下是如何使用迁移学习的插图：\n\n![](img/pretrained_embeddings.jpg)\n\
  \n**图 6.1：** NLP 中的迁移学习。\n\n在本章中，所有模型的平均参数规模都在数千万级。从零开始训练这些模型需要巨大的计算能力，因此此类模型的训练通常使用多个\
  \ GPU 或 TPU 完成。这些模型已经在非常大的数据集上进行了训练，它们通过在极少量的领域特定数据上进行预训练来适应新领域。在整个章节中，我们将使用预训练模型来获取词/句级向量。在某些情况下，我们将进行预训练。这些嵌入可以用于分类、摘要或翻译等下游任务。\n\
  \n### 理解 Transformer\n\n在`第 4 章，基于字符的上下文嵌入如 ELMo 以及 SkipThought 和 InferSent 等句子向量化技术`中，使用了\
  \ `transformer`。`transformer` 基于论文《Attention is all you need》。`transformer` 使用了注意力机制。在我们开始之前，让我们先了解自注意力机制是如何工作的：\n\
  \n![](img/tranformer.jpg)\n**图 6.2：** transformer 的注意力。\n\n`transformer` 的关键属性是它关联了不同的单词。自注意力机制在图所示：\n\
  \n![](img/tranformer_1.jpg)\n**图 6.3：** transformer 的排列。\n\n自注意力机制在图中所示：\n\n![](img/tranformer_2.jpg)\n\
  **图 6.4：** transformer 的层。\n\n注意力分数的计算所示：\n\n![](img/tranformer_3.jpg)\n**图 6.5：**\
  \ transformer 的工作原理。\n\n注意力分数按以下步骤计算：\n\n![](img/tranformer_kvq.jpg)\n**图 6.6：**\
  \ 自注意力涉及的步骤。\n\n自注意力的整个过程上面通过矩阵运算进行了总结。让我们看看这个过程是如何作为矩阵运算执行的：\n\n![](img/tranformer_4.jpg)\n\
  **图 6.7：** 实现自注意力的矩阵级操作。\n\n\n\n\n\n### 3. 多头注意力机制\n\n多头注意力机制具有多个查询（Query）、键（Key）和值（Value）矩阵的副本，因此它有助于在多个空间中进行学习。这些多个副本中的每组都通过多个副本进行初始化。\n\
  \n这里展示了双头多头注意力的概念：\n\n![](img/tranformer_6.jpg)\n\n**图 6.8:** 多头注意力机制的大致思想。\n\n\
  在每个多头注意力结束时，我们得到对应的输出矩阵 `z`，如果我们执行八次多头注意力，就会得到八个 `z` 矩阵（`z[0]``,`....`,`z[7]`）。拥有八个\
  \ `z` 矩阵是一个挑战。下一个编码器模块期望每个单词只接收一个 `z` 矩阵。为了解决这个问题，我们将八个 `z` 矩阵相乘后形成的矩阵与另一个矩阵 `W⁰`\
  \ 相乘。这个矩阵 `W⁰`是在训练过程中学习的，如下所示：\n\n![](img/tranformer_7.jpg)\n\n**图 6.9:** 如何通过应用加可学习矩阵，使多头注意力的最终输出形状与单头的输出相同。\n\
  \n这基本上就是多头注意力机制的全部内容了。所有的多头技术都可以整合在一个图中，如图所示：\n\n![](img/tranformer_8.jpg)\n\n**图\
  \ 6.10:** 多头注意力机制总结。\n\n以上就是关于多头注意力机制的全部内容。Transformer 中的创新方法并未止于此，它还有许多其他方法可以达到最先进的结果。下一个概念是位置编码。\n\
  \n### 位置编码\n\n单词在句子中的排列顺序非常重要。到目前，我们使用了各种嵌入技术，而且我们只考虑了单个单词的向量，而不考虑单词的顺序。个性化嵌入在生成嵌入时也会考虑单词的顺序。假设我们的嵌入向量大小为\
  \ 4；在将其注入自注意力模块之前，它会与一个位置编码向量相相加。这个位置编码向量转换了嵌入向量，使其也能代表单词在句子中的排列顺序。位置嵌入的概念用图示如下：\n\
  \n![](img/tranformer_9.jpg)\n\n**图 6.11:** 位置编码背后的设计思想。\n\n### 残差连接\n\n编码器或解码器的详尽结构包含了残差连接。这种残差连接函数类似于在\
  \ `第 5 章，将 CNN 应用于 NLP 任务` 中讨论的跳跃连接（skip connection）。这些残差连接通过允许高效的反向传播有助于更好的收敛。除了残差连接，每个编码器或解码器块都有“叠加与归一化层”（add\
  \ and normalize layer）。“叠加与归一化层”有助于叠加各种输入输出前进行归一化。以下是带有所有基本连接的编码器和解码器的详细图：\n\n![](img/tranformer_10.jpg)\n\
  \n**图 6.12:** 编码器和解码器中存在的残差连接以及翻译的流程。\n\n我们几乎了解了编码器的一切。在解码器端，接收最终的键 Query 和值向量，作为解码器的初始键。在时间\
  \ `t = 0` 时，触发 token，并且在另一侧，通过所有解码器后，一个线性层和 Softmax 层提供输出 token。每个解码器分别接收最终的编码器状态。`t=1`\
  \ 处的输出连同编码器状态再次输入解码器，产生 `t = 2` 处的下一个 token。这类似于我们在 `第 4 章，使用 RNN 用于 NLP` 中学习的教师强制（teacher\
  \ forcing）机制。同样，所有的 token 都将被翻译成另一种语言。\n\n### 源目标掩码（Source and Target Masking）\n\
  \n编码整个 Transformer 将是一次很棒的；在本节中，我们将实现 Transformer 模型的几个重要概念。在本节中，我们将通过实际实现和可视化它们来理解掩码和位置编码是如何工作的。我将在后面的章节中使用以下参数来演示掩码和位置编码。\n\
  \n`opt = {“d_model”:512, “trg_pad”:1,”src_pad”:1}`\n\n在这里，`d_model` 是 Transformer\
  \ 编码器和解码器的隐藏状态数量。\n\n#### 掩码（Masking）\n\n掩码在 Transformer 网络中有两个功能：\n\n*   在编码器和解码器中，对于输入和目标句子填充（padding）的地方给出零注意力输出。\n\
  *   在解码器中，防止解码器通过向前看（窥视）序列来作弊。\n\n让我们编写一个虚拟的源序列目标序列来理解这些事实。我们的虚拟源序列和目标序列如下，其中源序列等于目标序列。每个句子出现在每一列中，每个句子的长度通过\
  \ `padding = 1` 使相等：\n\n```python\nsrc = torch.tensor([\n[2, 3, 4, 5, 6, 7, 8, 9],\n\
  [2, 7, 7, 4, 2, 4, 3, 4],\n[3, 6, 8, 5, 2, 1, 3, 4],\n[4, 7, 9, 6, 3, 1, 7, 1],\n\
  [5, 7, 2, 7, 3, 1, 8, 1],\n[1, 6, 2, 8, 4, 1, 8, 1],\n[1, 1, 1, 1, 5, 1, 8, 1]])\n\
  ```\n\n下一步是创建一个限制解码器的 `nopeak_mask` 函数。\n\n```python\ndef nopeak_mask(size):\n \
  \   return np.triu(np.ones((size, size)),k=1).astype('uint8')\n```\n\n我们还需要一个接收源和目标的\
  \ `create_masks` 函数：\n\n```python\ndef create_masks(src, trg, opt):\n    src_mask\
  \ = (src != opt[\"src_pad\"]).unsqueeze(1)\n    if trg is not None:\n        trg_mask\
  \ = (trg != opt[\"trg_pad\"]).unsqueeze(1)\n        size = trg.size(1)\n       \
  \ trg_mask &= nopeak_mask(size)\n    else:\n        trg_mask = None\n    return\
  \ src_mask, trg_mask\n```\n\n`src_mask, trg_mask = create_masks(src,trg,opt)`\n\n\
  使用 `Ch6/understanding_transformer.ipynb` 脚本提供的绘图函数，源掩码如下：\n\n![](img/tranformer_masking.jpg)\n\
  \n**图 6.13:** 应用于 Transformer 源句子的掩码。\n\n### 位置编码\n\n正如我们在上一节所理解的，位置编码用于给编码器和解码器提供序列中单词位置的感觉。正如论文所述，位置嵌入在数学上可以给出：\n\
  \n![](img/158C6Eq1.jpg)[](images/158C6Eq2.jpg)\n\n在这里，`pos` 指句子中的顺序，`i` 指嵌入向量维度的位置。矩阵中的每个值然后通过先前的公式计算。相同的逻辑可以如下实现：\n\
  \n```python\nclass PositionalEncoder(nn.Module):\n    def __init__(self, d_model,\
  \ max_seq_len=80):\n        super().__init__()\n        self.d_model = d_model\n\
  \        # 创建一个依赖于\n        # pos 和 i 的常数 'pe' 矩阵\n        pe = torch.zeros(max_seq_len,\
  \ d_model)\n    for pos in range(max_seq_len):\n        for i in range(0, d_model,\
  \ 2):\n```\n\n\n\n\n\n```python\npe[pos, i] = math.sin(pos / (10000 ** ((2 * i)/d_model)))\n\
  pe[pos, i + 1] = math.cos(pos / (10000 ** ((2 * (i + 1))/d_model)))\npe = pe.unsqueeze(0)\n\
  self.register_buffer('pe', pe)\n\ndef forward(self, x):\n    # make embeddings relatively\
  \ larger\n    x = x * math.sqrt(self.d_model)\n    #add constant to embedding\n\
  \    seq_len = x.size(1)\n    x = x + Variable(self.pe[:,:seq_len],requires_grad=False)\n\
  \    return x, self.pe\n\nPE = PositionalEncoder(opt[\"d_model\"])\n```\n\n当进行位置编码时：\n\
  \n![](img/tranformer_positional_embedding2.jpg)\n\n**图 6.15：** 第一个是源输入，位置编码被生成并加到源输入中，以为源输入引入位置感（第三个子图）。\n\
  \n这里讨论的所有实现均已在 `Ch6/understanding_the_transformer.ipynb` Jupyter notebook 中给出。\n\
  \nTransformer 的出现是一个非常重要的研究里程碑。Transformer 成了 `BERT`、`ELMo` 和 `ULMFiT` 等许多模型的核心组件。Transformer\
  \ 的实现将帮助我们理解所有基于 Transformer 衍生的模型。逐步实现不在本书的讨论范围内，但你一直参考“The Annotated Transformer”文章，在文中，Transformer\
  \ 的每一个部分都通过代码进行了精美的解释。\n\n你可以参考以下链接：\n\n* Attention is all you need: [`arxiv.org/abs/1706.03762`](https://arxiv.org/abs/1706.03762)\n\
  * PyTorch implementation of opener’s fine-tuned transformer: [`github.Com/huggingface/PyTorch-openai-transformer-lm`](https://github.Com/huggingface/PyTorch-openai-transformer-lm)\n\
  \n# 将句子转换为向量\n\n在[第 3 章，用数学表示语言]中，我们学习了如 `word2vec`、`Fasttext` 和 `glove` 等方法，它们将给定的标记/单词转换为\
  \ n 维的浮点向量。然而，如果我们需要比较两个句子之间的语义相似性，这是不够的。使用词分词器，没有可行的方法可以找到两个句子之间的相似性。我们需要能够将句子直接转换为向量的技术。将句子转换为向量的技术之一是跳跃技术（skip-through\
  \ technique）。`SkipThought` 由多伦多大学的研究人员设计。另一种技术是 `doc2vec`，它由 Google 研究员 Thomas Mikolov\
  \ 发明。我们将在后续章节中详细介绍这两种技术，以及它们的工作和实现。\n\n将句子转换为向量的可能应用如下：\n\n* 将句子转换为向量，以便于执行分类、摘要和语言翻译等下游任务。\n\
  * 比较两个句子的语义性。\n\n我们的目标是从句子中学习向量，以便它们可以用于句子之间的语义相似性或相关性。下一个问题是，为什么我们不能用 `Word2Vec`\
  \ 来做这个？我们难道不能对词向量应用任何技术来比较两个句子吗？假设我们已经有了句子的词向量。获取句子表示的一种方法是找到所有单词的质心。如果是这样，可以使用质心距离找到两个句子之间的距离。同样的情况也可以推及到段落或文档比较。这种方法忽略了语言的特性，即每个单词的含义取决于其放置顺序和上下文词。单词在句子中的位置具有重要性，通过取质心，我们将所有单词视为具有同等的重要性。让我们举一个例子来理解这一点。假设我们有两个句子：\n\
  \n* You are going there to earn not learn（你去那里是为了赚钱而不是学习）\n* You are going there\
  \ to learn not to earn（你去那里是为了学习而不是赚钱）\n\n这两个句子带有不同的含义，但如果基于质心的相似性，这两个句子将被视为相似。这个概念在发表于\
  \ EMNL 14 的论文《From Word Embeddings To Document Distances》中得到了进一步加强。根据这篇文章，如果给出两个句子，我们取句子\
  \ 1 中每个单词到句子 2 的最小距离并将它们相加，如下所示：\n\n* Obama speaks to the media in Illinois\n* The\
  \ President greets the press in Chicago\n\n![](img/word_movers.jpg)\n\n**图 6.16：**\
  \ 词移动距离（Word mover’s distance）。\n\n为了生成如图 6.15 所示的向量，移除了所有的停用词，并计算了词嵌入。两个文档之间的距离是文档\
  \ 1 中所有单词为了精确匹配文档 2 所需移动的最小累积距离。\n\n这种方法受规则和逻辑的启发。它只是一个初步方法，主要缺点是它没有考虑单词的顺序和语义含义。\n\
  \n段落向量（Paragraph Vector）基于神经网络模型。Paragraph Vector 方法可以将变长度的句子、段落和文档转换为固定大小的向量。这是一个无监督算法，可以将任何句子、段落和文档转换为固定大小的向量：\n\
  \n![](img/paragraph_vector.jpg)\n\n**图 6.17：** 学习词的框架。\n\n四个单词（The, Monkey, sat,\
  \ on）的上下文被用于预测五个单词。输入单词映射到 `W` 的一列以预测下一个单词。在这种方法中，每个单词映射到 `W` 中的一列。从数学上说，如果我们有 `w[1]`、`w[2]`、`w[3]`……`w[T]`\
  \ 单词，目标是在给定所有其他单词的情况下增强 `w[t]` 的平均概率：\n\n![](img/158Eq3.jpg)\n\n预测通过多分类分类如 softmax\
  \ 进行。在实践中，分级 softmax 比 softmax 更受青睐以便于训练：\n\n![](img/158Eq4.jpg)\n\n如下所示的方法具有段落向量；每个段落映射到\
  \ `D` 中的一列，每个单词映射到向量 `W`。矩阵 `W` 和 `D` 进行平均或拼接以预测下一个单词。隐藏向量由 `W` 和 `D` 组合构造。在这个过程中，模型开始记住与句子相关的信息。由于这个原因，该模型被称为**段落向量-分布式内存**模型（`PV-DM`）。模型的示意图如图\
  \ 6.18 所示。\n\n### SkipThought 向量\n\nSkipThought 是一种以无监督方式学习句子细微差别的模型。段落向量是句内模型，而\
  \ skip thought 是句间模型。如果你已经学过第 3 章的 skip-gram 方法，在这里在句子级别遵循相同的方法。SkipThought 模型包含三个部分：一个编码器和两个解码器，如示意图所示：\n\
  \n![](img/skipthought.jpg)\n\n**图 6.18：** SkipThought 如何工作的插图；它有一个编码器和两个解码器。\n\n\
  1. **编码器网络：** 它接收当前句子并使用 `GRU` 或 `LSTM` 将其转换为固定长度表示。`GRU/ LSTM` 顺序处理句子的每个单词并使用注意力机制生成固定长度向量\
  \ `z(i)`。\n2. **上解码器网络：** 它接收固定向量表示 `z(i)` 并生成输入句子 `x(i)` 的前一个句子 `x(i – 1)`。\n\n\
  \n\n\n\n### 3. 下一个解码器网络\n它接收固定向量表示 `z(i)`，并根据输入句子 `x(i)` 生成下一个句子 `x(i + 11)`。\n\n\
  SkipThought 向量背后的假设是：句子在文档中的位置具有意义，且这种意义与相邻句子是上下文相关的。如果强制网络输出上下文，网络中的目标句子可能会开始在固定大小的稠密向量中学习句子的含义。\n\
  \n# 句子到向量\n\n在本节中，我们将看到如何使用 `Doc2Vec` 实现 `Sentence2Vec`。接下来我们将查看如何使用 skip-thought\
  \ 向量。\n\n**句子到向量**：该方法在流行的库 `Gensim` 中通过 `Doc2Vec` 实现实现。我们将看到如何使用 `Gensim` 对 `Doc2Vec`\
  \ 的实现。\n\n#### 加载数据并标记数据\n\n```python\ndata = open(“Ch6/dataset/small_talk_test.txt”).read().splitlines()\n\
  tagged_data = [TaggedDocument(words=word_tokenize(_d.lower()), tags= [str(i)]) for\
  \ i, _d in enumerate(data)]\n```\n\n以下是用于训练模型的各种参数。`dm` 参数用于定义使用哪种算法：\n\n* `dm=1`\
  \ 意味着“分布式内存”（PV-DM）\n* `dm =0` 意味着“分布式词袋”（PV-DBOW）\n\n我们已经在食谱的*准备工作……*（Getting Ready…*）部分介绍了这些算法。分布式内存模型保留了文档中的词序，而分布式词袋则仅使用词袋方法，该方法不保留任何词序：\n\
  \n```python\nmax_epochs = 100\nvec_size = 20\nalpha = 0.025\nmodel = Doc2Vec(size=vec_size,\n\
  \                alpha=alpha,\n                min_alpha=0.00025,\n            \
  \    min_count=1,\n                dm =1)\nmodel.build_vocab(tagged_data)\nfor epoch\
  \ in range(max_epochs):\n    print(‘iteration {0}’.format(epoch))\n    model.train(tagged_data,\n\
  \                total_examples=model.corpus_count,\n                epochs=model.iter)\n\
  ### 降低学习率\nmodel.alpha -= 0.0002\n# 固定学习率，不衰减\nmodel.min_alpha = model.alpha\nmodel.save(“d2v.model”)\n\
  print(“Model Saved”)\n```\n\n以下代码段执行以下功能：\n\n* 加载模型\n* 获取句子的向量\n* 寻找相似句子\n\n```python\n\
  model= Doc2Vec.load(“d2v.model”)\n# 查找不在训练数据中的文档向量\ntest_data = word_tokenize(“Now\
  \ that you are eighteen”.lower())\nv1 = model.infer_vector(test_data)\nprint(“V1_infer\
  \ : “, v1)\n# 使用句子编号查找最相似的文档\nsimilar_doc = model.docvecs.most_similar(‘1’)\nprint(“Simillar\
  \ Docs : “, similar_doc)\n```\n\n`>>> V1_infer : [-0.01016486, .., 0.04624778]`\n\
  `>>>Simillar Docs : [(‘12’, 0.7584813833236694), .., (€1113’, 0.724390983581543)]`\n\
  \n使用 `Doc2Vec` 实现句子到向量的运行代码见 `Ch6/sentece2vector.py`。\n\n# Skip Thought\n\nSkipThought\
  \ 向量的训练计算成本非常高，因此我们将采用现有的 SkipThought 模型并查看如何使用预训练模型进行推理。skip\\_thought 的实现包含在书中对应的\
  \ `Ch6` 文件夹中。该实现提供了关于以下主题的深入信息：\n\n* **安装**：安装 SkipThought 需要 Bazel, TensorFlow,\
  \ NumPy, sci-kit-learn, NLTK 和 Gensim\n* **下载预训练模型**：你可以通过两种配置下载训练书籍语料库的模型：\n  \
  \  * 单向 RNN 编码器\n    * 双向 RNN 编码器\n* **训练模型**：包括训练模型和运行训练脚本。\n* **扩展词表**：生成的预处理脚本仅包含\
  \ 20,000 个单词，对于许多任务来说是不够。SkipThought 提供了扩展词表功能，人们借此增加模型的词表。它是基于“利用语言间的相似性进行机器翻译”论文中描述的基于“翻译矩阵”的方法。\n\
  * **评估模型**：支持在各种数据集上对模型进行评估。这些数据集包括 SICK 语义相关性任务、**MSRP** (**微软研究院改写语料库**) 改写检测任务、MR\
  \ 电影评论情感任务、CR - 客户产品评论任务、SUBJ - 主观性/客观性任务、MPQA 意见极性任务以及 TREC 问题类型分类任务。GitHub 仓库中已提供如何使用\
  \ SkipThought 的详细指南，因此本章没有提供 skip thought 的运行示例。\n\n如果你观察 SkipThought，解码器本身没问题，但由于这个原因，模型需要超过\
  \ 32 GB 的内存。SkipThought 模型是第一类生成句子的模型。在接下去，我们将看到像 skip thought 这样的模型是如何生成句子的。请查看以下链接：\n\
  \n* 从词嵌入到文档的监督学习：`http://proceedings.mlr.press/v37/kusner15.pdf`\n* 句子和文档的分布式表示：`https://cs.stanford.edu/~quocle/paragraph_vector.pdf`\n\
  * SkipThought 向量：`https://arxiv.org/pdf/1506.0726`\n* 利用语言间的相似性进行机器翻译：`https://arxiv.org/abs/1309.416`\n\
  \n# 了解上下文向量\n\n到为止，我们已经看到了许多词向量表示，包括 Word2Vec, Glove 和 Fasttext。在所有之前讨论的方法中，任何给定单词的向量对于整个文档都是相同的。`bank`\
  \ 可以指金融机构（银行），也可以指河岸（河岸）。对于上述技术，`bank` 在两种情况下的含义是相同的。这种单词根据上下文具有不同含义的属性被称为多义性（polysemy）。ELMo\
  \ 是由 Matthew E. Peters 及其同事在论文《深度上下文词表示》中提出的。\n\nELMo 使用双向语言模型生成上下文词表示。目标是学习建模语法、语义和多义性的表示。\n\
  \n* **深层**：词表示结合了深度预训练神经网络的所有层。拥有 **90M+ 参数**。\n* **基于字符**：ELMo 表示是纯基于字符的，允许网络利用形态线索为训练中未见的词汇表标记形成稳健的表示。\n\
  * **上下文**：每个单词的表示取决于其使用的整个上下文。ELMo 模型被发现根据上下文生成不同的向量，因此它也能处理**多义性组合**（polyassembly）。\n\
  \n该架构包含两个组件：\n\n* **标记表示**：与上下文的标记表示通过字符卷积计算。来自 CNN 层的字符表示作为 LSTM 层的输入。\n* **双向语言模型\
  \ (biLM)**：该层遵循传统的概念，根据目标标记预测正向标记，以及根据目标标记预测反向标记。对于给定的 N 个标记序列 `t[1]`、`t[2]`、…`t[N]`，正向模型计算标记\
  \ `t[k]` 的概率，前提是所有过去的标记 `t[1]`、.,`t[k-1]`。在概率上，这可以表示为：\n\n    ![](img/158C6Eq5.jpg)\n\
  \n\n\n\n反向语言模型的运行方式与正向表示相似，但方向相反。反向模型计算在给定所有未来标记 `t[k+1]`、 …, `t[N]` 的情况下，标记 `t[k]`\
  \ 的概率。以概率的方式，这可以表示为：\n\n![](img/158C6Eq6.jpg)\n\n除了正向和反向 ELMo 表示外，还会为每个标记生成基于 CNN\
  \ 的上下文无关表示。首先为具有不同卷积核大小的 `L` 层 CNN 生成字符表示，然后将其通过 `L` 层前向 LSTM。对于每个标记 `K`，LSTM 输出一个一个上下文依赖的表示\
  \ `h[Kj]^(→LM)`，其中 `j = 1, …, L`。顶层 LSTM 输出 `h[KL]^(→LM)` 用于通过 Softmax 层预测下一个标记\
  \ `t[k+1]`。对于反向层，CNN 表示计算为 `h[Kj]^(←LM)`。将这两个层结合得到最终表示：`h[KL]^(LM) = {h[KL]^(→LM),\
  \ h[KL]^(←LM)}`。\n\n这只是 ELMo 模型内部工作机制的概述。最后，它有三个输出：一个来自正向 LSTM，一个来自反向 LSTM，以及一个来自\
  \ CNN 层。正向和反向 LSTM 是感知上下文的，而 CNN 输出是内容无关的。模型的示意图如下：\n\n![](img/ELMO_model.jpg)\n\
  \n**图 6.19：** ELMo 模型示意图。基于字符的输入被赋予具有不同卷积核大小的七层卷积神经网络。\n\n所有 CNN 的输出被拼接到卷积层 `C`\
  \ 中。然后，这些信息通过一系列操作，如聚合、拼接、元素级乘、线性算子、线程层、部分层、序列反转层、序列最大层、复制层，最后是展平层。它们的输出将给出：两个来自\
  \ LSTM 层，和一个来自 CNN 层。该信息图灵感来自 `[`resources.wolframcloud.com/NeuralNetRepository/`](https://resources.wolframcloud.com/NeuralNetRepository/)`。\n\
  \n### 使用预训练模型\n\nAllen AI 发布了 ELMo 的官方版本。通过使用此 API，你可以使用预训练模型来获取给定句子中标记的上下文嵌入。\n\
  \n### 安装\n\n```bash\n!pip installallennlp\n```\n\n### 快速上手：\n\n```python\nFrom allennlp.commands.elmo\
  \ import ElmoEmbedder\nimport scipy\n\nelmo = ElmoEmbedder()\n```\n\n### 获取嵌入\n\n\
  ```python\nvectors = elmo.embed_sentence([\"My\", \"name\", \"is\", \"Sunil\"])\n\
  vectors.shape\n>>> (3, 4, 1024)\n```\n\n句子中有四个单词。正如我们所知的，ELMo 嵌入为每个单词生成三个嵌入：两个来自\
  \ LSTM 层，一个来自 CNN 层。这些嵌入中的每一个的大小都是 1024，这是 ELMo 模型中使用的卷积核数量的最大值。在检查上下文断言后，很明显单词“Apple”一词在两个句子中的嵌入是不同的。通过\
  \ LSTM 层生成的输出之间的余弦差异可以清楚看出这一点。CNN 层不是感知上下文的，因此两个“Apple”实例之间的余弦距离是相同的：\n\n```python\n\
  def get_similarity(token1, token2, token1_location, token2_location):\n    vectors\
  \ = elmo.embed_sentence(token1)\n    assert(len(vectors) == 3) # one for each layer\
  \ in the ELMo output\n    assert(len(vectors[0]) == len(token1)) # the vector elements\
  \ correspond with the input tokens\n    vectors2 = elmo.embed_sentence(token2)\n\
  \    print(\"=\"*50)\n    print(\"Entity 1 : \",token1[token1_location], \" | Entity2\
  \ : \", token2[token2_location])\n    print(\"Shape of one of the LSTM vector :\
  \ \", vectors[2][token1_location].shape)\n    print(\"=\"*50)\n    print(\"cosine\
  \ distance of 2nd bilstm layer vector\", scipy.spatial.distance.cosine(vectors[2][token1_location],\
  \ vectors2[2][token1_location]))\n    print(\"cosine distance of 1st bilstm layer\
  \ vector\", scipy.spatial.distance.cosine(vectors[1][token1_location], vectors2[1][token1_location]))\n\
  \    print(\"cosine distance of CNN layer vector\", scipy.spatial.distance.cosine(vectors[0][token1_location],\
  \ vectors2[0][token1_location]))\n    return\n\nget_similarity([\"I\", \"ate\",\
  \ \"an\", \"Apple\", \".\"], [\"I\", \"have\", \"an\", \"iPhone\", \"made\", \"\
  by\", \"Apple\", \"Inc\", \".\"], 3, 6)\n```\n\n**输出：**\n\n```\nEntity 1 : Apple\
  \ |Entity2 : Apple Shape of one of the LSTM vector : (1024,)\ncosine distance of\
  \ 2nd bilstm layer vector 0.5723829865455627\ncosine distance of 1st bilstm layer\
  \ vector 0.5360225439071655\ncosine distance of CNN layer vector 0.634152293\n```\n\
  \n\n\n\n`InferSent` 使用 `Stanford Natural Language Inference` (`SNLI`) 数据来训练用于自然语言推理的模型。`NLI`\
  \ 任务提供两个句子，任务是找到两个句子之间的关系。句子 1 可以被视为前提（premise），句子 2 被视为假设（hypothesis）。这种关系可以是蕴含（entailment）、矛盾（contradiction）或中立（neutral）。例如，如果我们有以下两个句子，它们之间的关系就是矛盾：\n\
  \n*   一个男人正在检查某个东亚国家人物的制服\n*   这个男人正在睡觉\n\n直觉上，`NLI` 是学习句子间语义关系的合适任务，通过完成这项任务，模型还可以学习语言的细微之处。神经网络架构中包含三个部分：\n\
  \n1. 共享编码器，将句子编码为固定大小的向量。\n2. 对编码器模型的输出应用了三种操作：\n    * 拼接 `(u, v)`\n    * 元素级乘积\
  \ `u * v`\n    * 绝对元素级差值 `|u – v |`\n3. 取前一个表示并应用全连接层来预测 3 个类别之一。\n\n泛化架构所示：\n\n\
  ![](img/Infersent_main_block.jpg)\n\n**图 6.20:** 用于训练 infersent 模型的通用架构。\n\n句子编码器模型可以是此处列出的许多模型之一：\n\
  \n* 标准 `LSTM`\n* 标准 `GRU`\n* 前向和反向 `GRU` 最后隐藏状态的拼接\n* 带有均值池化（mean polling）的双向 `LSTM`\n\
  * 带有最大池化（max polling）的双向 `LSTM`\n* 自注意力网络（带有 `BiLSTM` 的注意力）\n* 分层卷积网络\n\n### 标准\
  \ LSTM、标准 GRU 以及最后隐藏状态的拼接\n这些方法逐词读取句子输入。`LSTM` 或 `GRU` 的最后一个隐藏状态被用句子的固定表示。在双向 `GRU`\
  \ 中，正向和反向 `GRU` 的最后一个隐藏层拼接，形成每个句子的最终句子表示 `U` 和 `V`。\n\n### 带有均值/最大池化的 Bi-LSTM\n\
  对于词序列，正向和反向方向的 `LSTM` 为每个时间步产生输出向量。每个时间戳的输出被传递到 1D 池化层以进行均值或最大池化。这些值然后被展平以形成 `U`\
  \ 和 `V` 向量。整个网络的示意图如下：\n\n![](img/infersent_sub_network_1.jpg)\n\n**图 6.21:** 演示如何使用带有均值/最大池化的\
  \ `BiLSTM` 来嵌入句子。\n\n### 自注意力网络\n在模型模型中，除了普通的正向-反向 RNN 模型外，应用了注意力机制。注意力机制类似于我们在制作语言翻译模块时在\
  \ `4 章，使用 RNN 用于 NLP` 中讨论的机制。以下是注意力机制的示意图：\n\n![](img/infersent_sub_network_2.jpg)\n\
  \n**图 6.22:** 用于句子表示的注意力网络。\n\n### 分层卷积网络 (Hierarchical ConvNet)\n分层卷积网络由四个卷积层组成。在每一层中，对特征图进行最大池化以获得中间表示。最终的句子嵌入由每层四个最大池化表示拼接而成。\n\
  \n![](img/infersent_sub_network_3.jpg)\n\n**图 6.23:** 分层卷积网络架构。\n\n该模型使用 `SGD` 作为优化器，学习率为\
  \ `0.1`，动量为 `0.99`。在每个 epoch 中，如果验证集上的准确率下降，则将学习率除以五。使用了 `64` 的批大小（batch size），当学习率超过\
  \ `1e-5` 时停止学习。所有模型的全连接层都有 `512` 个感知器。在 Common Crawl 840B 上训练的具有 300 维嵌入的 `GloVe`\
  \ 向量用于将单词转换为密集向量，并作为各种句子编码模型的输入。在所有模型中，带有最大池化的 `BiLSTM` 模型实现了最高的准确率。\n\n# 玩转 InferSent\n\
  \n`InferSent` 为英文句子提供了语义表示。它在自然语言推理数据上进行训练，并良好地泛化到许多不同的任务。Facebook 研究团队在 `[`github.com/facebookresearch/InferSent`](https://github.com/facebookresearch/InferSent)`\
  \ 提供了实现。从训练到获取句子向量的整个流程如下：\n\n1. 克隆 `InferSent` 并将其添加到系统路径\n2. 下载 `InferSent` 需要的数据集\n\
  3. 下载 `GloVe` 和 `FastText` 向量\n4. 下载 `InferSent` 预训练模型\n\n上述所有插图步骤的代码片段如下：\n\n```bash\n\
  ### cloning the git repository\n!git clone https://github.com/facebookresearch/InferSent.git\n\
  \nsys.path.append(\"/content/InferSent/\")\n\n#Downloading required dataset by InferSent\n\
  !bash InferSent/dataset/get_data.bash\n\n### cloaning the git repository\n!git clone\
  \ https://github.com/facebookresearch/InferSent.git\n\nsys.path.append(\"/content/InferSent/\"\
  )\n\n#Downloading required dataset by InferSent\n!bash InferSent/dataset/get_data.bash\n\
  \n# Downloading GloVe and FastText vectors\n!mkdirInferSent/dataset/GloVe\n!curl\
  \ -LoInferSent/dataset/GloVe\n```\n\n*(注：原文文本中存在大量重复且格式混乱的部分，译文已根据要求进行了逻辑清理和翻译)*\n\
  \n\n\n从自然语言推理数据中进行通用句子表示的监督学习，可以参考 [`arxiv.Org/abs/1705.02364`](https://arxiv.Org/abs/1705.02364)。\n\
  \n### 理解和使用 BERT\n\nBERT 是 Transformer 双向编码器表示（Bidirectional Encoder Representations\
  \ from Transformers），是 Google 研究人员最近发现的一种嵌入生成技术。BERT 是目前最先进的模型，在各种 NLP 任务上都提供了卓越的结果。它是将\
  \ Transformer 的双向训练应用于语言建模的关键创新。正如我们在上一个食谱看到的，具有双向模型的 ELMo 模型在语言建模任务上显示出更高的准确性。扩展\
  \ ELMo 的概念，BERT 也使用了双向训练的模型。在 BERT 论文中，研究人员使用了一种新技术——掩码语言模型（`MLM`），它使得此前无法的双向训练成为可能。\n\
  \n我们已经详细探讨了 Transformer 模型。Transformer 使用带有自注意力机制的编码器-解码器架构来产生任务预测。由于 BERT 的目标是生成语言模型，因此只需要编码器。包括\
  \ BERT、OpenAI GPT 和 ELMo 在内的各种模型在训练语言模型时遵循相同的逻辑。该任务通常是根据上下文预测缺失的单词。例如，如果给定的句子是“The\
  \ \\_\\_\\_\\_\\_ sat on the mat”，模型需要通过预测最可能的词来填补空白。ELMo、BERT 和 OpenAI GPT 非常相似，它们在架构上区别不大，如下所示：\n\
  \n![](img/bert_elmo_bilm.jpg)\n\n**图 6.25：** A) BERT、B) ULM-Fit（OpenAI 最近提出的模型）和\
  \ C) ELMo-BiLm 之间的架构对比。\n\n如果所有架构都相似，为什么 BERT 是最有效的？这个问题的答案隐藏在架构中。BERT 使用词碎片而不是单词（例如\
  \ `playing -> play + ##ing`），这有助于减少词表大小。\n\nBERT 使用 Transformer 模型作为核心组件，正如我们在本章第一个食谱看到的，Transformer\
  \ 是通过堆叠编码器和解码器制成的。每个编码器包含一个自注意力网络和一个前馈网络。BERT 的输入是位置嵌入 + 句子嵌入以及标记嵌入的组合。\n\n*   为了处理句子分类等两个句子相关的问题，BERT\
  \ 使用 `[sep]` 作为标记来分隔两个句子，并使用了句子嵌入。句子嵌入对于同一个句子是固定的，但两个句子之间不同。这有助于模型知道一个句子在哪里结束，另一个句子在哪里开始，以便区别地对待它们。\n\
  *   为了将模型用于分类，作者使用了 `[CLS]` 标记。\n\n![](img/bert_tokenization.jpg)\n\n**图 6.26：**\
  \ BERT 模型中标记、句子和位置嵌入。\n\n**来源：** [`arxiv.Org/abs/1705.02364`](https://arxiv.Org/abs/1705.02364)\n\
  \n该模型同时针对两个模型进行训练：掩码语言模型和下一句预测模型。\n\n### 掩码语言模型\n显然，句子中的某些随机单词被掩盖了，并模型预测它们。这是该模型中的一项主要任务。在掩码语言模型论文中，他们报告了随机掩盖\
  \ 10-15% 的输入单词。这些技术的主要问题是模型只针对掩码标记进行训练。当没有掩码标记时，模型只会规避输入并提供一个随机单词作为输出。这样一来，模型仅针对输入的\
  \ 10-15% 进行训练。为了更好地学习，作者用句子其他部分的虚拟词替换正确的单词。在句子中插入随机单词是噪声的最强形式，模型被迫在处理完噪声单词后预测掩码单词。这使得模型更加健壮。\n\
  \n### 下一句预测模型\n除了 MLM 之外，BERT 还通过采用问答或自然语言推理任务在下一句预测任务上进行训练。这些任务需要语义结构的知识。如上所示，模型使用\
  \ `[sep]` 标记来分隔两个句子。在 50% 的情况下，第一句和第二句交换顺序，在剩下的 50% 情况下，交换随机句子。模型应该预测第二个句子是否是随机的。这是一个示例：\n\
  \n```\n[CLS] the man sat on the mat [sep] the cat is on the rug. own\n```\n\n\n\n\
  OpenAI 发布的一项新模型——ULMFiT 在《用于文本分类的通用语言模型微调》论文中发表。在六项文本分类任务的最先进水平上，ULMFiT 在大多数数据集上减少了\
  \ 18-24% 的错误。ULMFiT 不属于本书的涵盖范围，但人们必须尝试这个模型。\n\n更多详细信息，可以参考以下链接：\n\n*   用于文本分类的通用语言模型微调：[`arxiv.org/pdf/1801.06146.pdf`](https://arxiv.org/pdf/1801.06146.pdf)\n\
  *   BERT：用于语言理解的深度双向 Transformer 预训练：[`arxiv.org/abs/1810.04805`](https://arxiv.org/abs/1810.04805)\n\
  \n## 结论\n\n本章涵盖了构建最先进 NLP 应用所需的所有高级模型。Transformers 是 `BERT` 和 `Megatron` 等所有模型的基础构建模块。我们还看到，如全并行网络等更深层的\
  \ CNN 是嵌入的未来。然后，我们研究了将整个句子转换为向量的方法，以便在整个句子上应用 NLP，而不是逐词处理。接着，我们学习了如何将 CNN 和 RNN\
  \ 结合到一个网络中，使用 `ELMo` 获取上下文嵌入。最后，我们探索了如何轻松使用 NLP 世界中讨论度最高的模型——`BERT`。它是 NLP 领域蓬勃发展的领域，所有主要公司都在致力于生产模型以突破目前的最先进水平。\n\
  \n下一章将帮助你学习如何将深度学习应用于 NLP 任务。\n\n# 第 7 章：将深度学习应用于 NLP 任务\n\n本章将通过将 NLP 应用于各种现实生活场景来涵盖\
