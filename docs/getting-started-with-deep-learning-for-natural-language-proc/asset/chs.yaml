  \n## 理解混淆矩阵及其派生指标\n\n为了量化模型的优坏，我们通常使用混淆矩阵。它是一个允许可视化我们算法性能比较的表格。它基于四种情况具有四个值：\n\n\
  * **真正性 (TP)**：这些是我们正确预测为“是”的情况\n* **真负性 (TN)**：我们正确预测为“否”\n* **假正性 (FP)**：我们错误地预测为“是”\n\
  * **假负性 (FN)**：我们错误地预测为“否”\n\n混淆矩阵如下：\n\n| 实际/预测 | 预测否 | 预测是 |\n| --- | --- | ---\
  \ |\n| 实际否 | TN (真负性) | FP (假正性) |\n| 实际是 | FN (假负性) | TP (真正性) |\n\n一些派生的性能指标（如准确率、精确率、灵敏度和特异性）可以通过以下方式计算：\n\
  \n* `特异性、选择性或真负性率(TNR)=TN\\/(TN+FP)`\n* `灵敏度、召回率、命中率或真正性率(TPR)=TP\\/(TP+FN)`\n*\
  \ `精确率或正性预测值 (PPV)=TP\\/(TP+FP)`\n* `准确率=(TP+TN)\\/(TP+TN+FP+FN`\n\n除了这些指标，混淆矩阵有助于得出其他指标，如\
  \ `F1-Score`、`马斯蒂相关系数 (MCC)` 和信息性 (informedness)。\n\n## 定义加权损失函数\n\n如所述，损失函数应根据最终目标进行设计，并通过提供适当的权重对错误进行相应的惩罚。为了理解这个概念，让我们来看几个用例：\n\
  \n案例 1 - 超市案例：假设一家杂货店决定为在收银台识别出的忠实客户提供 25% 的折扣。现在我们根据混淆矩阵衡量面部识别的准确率。在这种情况下，我们的混淆矩阵应该考虑以下：\n\
  \n* `TP` 和 `TN` 将为 0\n* `FP` 意味着客户经常拿到了折扣\n* `FN` 意味着忠实客户的面部没有被正确识别，他们没有获得折扣\n\n\
  在这种情况下，应对 `FN` 情况应用更多惩罚。由于系统错误，我们未能检测到忠实客户并没有给他们提供折扣。这留下了坏印象，我们可能会丢失客户，因此应该对 `FN`\
  \ 情况施加更高的惩罚。如果客户意外拿到了折扣，他们可能会喜欢并再次光临。`FP` 情况可能会增加口碑营销。在损失函数中，如果 `FP` 情况惩罚为 1，则 `FN`\
  \ 情况惩罚应为 100。\n\n案例 2 - ATM 系统：假设公司正在设计一种 ATM 功能，你按下指纹即可取钱。（注：原文此处大量重复相同句子，译文遵循原文逻辑翻译）\n\
  \n\n\n\n\n## 偏差与方差分析\n\n- **不存在模式**：我们应用机器学习的首要假设是数据必须具有某种模式。如果没有模式，任何假设都无法对其进行建模，导致最终模型的训练误差和测试误差都很高。除非提供更具代表性的数据，否则没有模型可以解决此问题。可能存在数据集不平衡的问题。\n\
  - **建模错误**：模型的架构无法学习数据的细微特征。这可能有多个原因，例如使用了错误的激活函数或学习率过高。如果数据在批次（batches）之间分布不均匀，会导致每个批次的梯度传播不当，从而无法学习。损失函数的实现不当也可能是问题之一。\n\
  \n### 解决高偏差问题的方法：\n\n- **延长训练时间**：有时，算法需要更长时间来学习更高层次的抽象，然后快速收敛。这种情况在图像分割问题中常见，在深层卷积神经网络模型中更为常见。允许算法以较低的学习率运行更长时间有助于收敛。\n\
  - **训练复杂模型 / 新模型架构**：另一个原因是模型不够复杂，无法学习数据中的模式。例如，如果将前馈模型应用于文本情感分析问题，其性能可能不如应用于相同问题的循环神经网络。在支持向量机（SVM）中使用非线性内核可以缓解这一问题。\n\
  - **归一化/增加特征**：增加更多特征会有帮助。可以通过一个例子来理解：通过观察颜色和长度等特征可能永远无法预测汽车的价格区间，但添加最高速度、换挡模式和起步能力等特征将会有帮助。对于数值特征，将特征归一化在\
  \ 0 和 1 之间有助于更好地收敛。\n- **添加正则化**：这种技术确实很有帮助，并在深层卷积神经网络中广泛广泛。批归一化（Batch normalization）是一种著名的技术。\n\
  - **方差**：正如我们在偏差相关问题中看到的，模型不够灵活/复杂，无法识别数据中的模式。方差处于另一端，模型只是在硬背数据。换句话说，模型专门适应了训练数据，而不是泛化到测试数据。方差，也称为过拟合，可以用数学符号表示为\
  \ `![](img/158C1Eq10.jpg)`。\n\n### 使用以下技术解决高方差问题：\n\n- **增加数据**：当数据点较少且模型高度复杂时，我们会遇到高方差问题。在这种情况下，模型学习了数据所有的细微特征，训练误差往往趋于零，因此不再发生学习。当此类模型应用于与训练数据分布略有不同的测试数据时，性能很差。\n\
  - **减少特征数量**：训练数据经过了非常好的预处理，包含了所有必要的特征，模型直接获取这些直接特征并围绕它们进行学习。当提供未处理的测试数据时，模型无法识别特征，导致表现糟糕。\n\
  - **正则化**：模型可能在拟合数据中的噪声，导致其在测试数据上的结果不佳。我们可以通过应用约束来降低模型的灵活性，这被称为正则化。在数据科学中，这个问题有一个明确的解决方案——应用正则化技术。四种正则化技术可以帮助克服过拟合：\n\
  \    - `L1`\n    - `L2`\n    - `Elastic Net`\n    - `Dropout`\n- **降低模型复杂度**：模型可能在拟合数据中的噪声，导致其在测试数据上的结果不佳。我们可以通过应用约束来降低模型的灵活性，这被称为正则化。\n\
  - **偏差-方差权衡**：我们可以看到解决高偏差问题的明确方法：（见下方的代码）。\n\n\n以下代码演示了如何使用流水线（pipeline）堆叠多项式特征和线性回归：\n\
  \n```python\ndef true_fun(X):\n    return np.cos(X)\n\nn_samples = 30\ndegrees =\
  \ [1, 3, 9, 15]\nX = np.sort(np.random.rand(n_samples))\ny = true_fun(X) + np.random.randn(n_samples)\
  \ * 0.1\n\nfor i in degrees:\n    polynomial_features = PolynomialFeatures(degree=i,\
  \ include_bias=False)\n    linear_regression = LinearRegression()\n    pipeline\
  \ = Pipeline([(\"polynomial_features\", polynomial_features),(\"linear_regression\"\
  , linear_regression)])\n    pipeline.fit(X[:, np.newaxis], y)\n\n    # 使用交叉验证评估模型\n\
  \    scores = cross_val_score(pipeline, X[:, np.newaxis], y, scoring=\"neg_mean_squared_error\"\
  , cv=10)\n\n    X_test = np.linspace(0, 1, 100)\n    plt.plot(X_test, pipeline.predict(X_test[:,\
  \ np.newaxis]), label=\"Model\")\n```\n\n我们可以看到，次数为 1 的多项式没有拟合数据，因此被称为欠拟合。次数大于 3\
  \ 的多项式拟合数据太好，以至于无法泛化到测试数据，并导致 MSE 变高，因此被称为过拟合。以下图表清楚地表明在次数为 3 时 MSE 最低。这是偏差-方差与模型复杂度之间的平衡点。\n\
  \n\n\n\n随着模型复杂性的增加，偏差（bias）会增加，方差（variance）也随增加。应该选择偏差和方差均最小的复杂度模型进行推理。低复杂度意味着模型足够复杂以吸收数据的复杂性，因此当我们增加模型复杂性时，就会出现高方差问题。然而，如果我们逐渐增加它，在给定模型复杂性的情况下，偏差和方差会在某一点达到最小。随着我们进一步增加复杂性，模型的复杂性方差会增加，这也称为模型过拟合问题。\n\
  \n\n让我们来看某些可以管理偏差和方差问题的措施：\n\n*   **Bagging 和重采样（Bagging and resampling）**：Bagging\
  \ 指的是对数据进行各种划分，并使用有放回的随机抽样，用每个样本训练一个模型。测试时，使用所有这些模型进行预测，并根据平均值或投票得出最终预测。这种技术也被称为\
  \ bagging 或自助聚合（bootstrap aggregating）。`Random Forest` 模型很好地利用了 bagging 技术。基于每个样本划分构建了许多树，整个模型的偏差与单棵树的相同。因此，创建一个这样的树森林并对其取平均可以显著减少最终模型的方差。\n\
  \n*   **违背直觉（Fight Your Instincts）**：如果模型在某些轮数后没有经过训练或没有显示收敛，表明模型出了问题。快速的检查，如降低学习率、改变动量、使用不同的优化器、使用不同的损失函数、检查模型实现以及足够长时间的进度，都会很有帮助。应该总是尝试以方差为代价来降低偏差。\n\
  \n    你可以查看以下链接以了解更多关于偏差方差问题的信息：*[`scott.fortmann-roe.com/docs/BiasVariance.html`](http://scott.fortmann-roe.com/docs/BiasVariance.html)*\n\
  \n\n学习曲线是一种诊断指标，用于识别是否存在与偏差相关或方差相关的问题。在标准的训练测试周期中，我们只需将数据集分为测试集和训练集，在训练数据上开发模型，并将其应用于测试数据。为了绘制学习曲线，我们采用略有不同的方法。我们增加训练样本的数量（例如\
  \ 1, 2, 5 和 10 直直到整个训练集），并在测试数据上进行测试。当我们在测量样本数量增加时的划分训练误差时，这些被称为学习曲线。\n\n简而言之，学习曲线显示了训练误差和验证误差随训练集大小的变化。最初，当训练样本为\
  \ 1 时，模型很好地拟合了它，虽然训练误差为零，但验证误差最高。随着我们增加训练样本，数据无法完美拟合训练样本，因此训练误差增加，而验证误差减少。为了演示学习曲线的概念，我们将借助数据集。让我们看看实施去中心化智能电网控制（Smart\
  \ Grid Control）概念的四节点星形系统（生产者位于中心）的局部稳定性分析。模拟电网稳定性数据集具有四类变量，其中 `stabf 为 目标变量`：\n\
  \n*   `tau[x]`：参与者的反应时间\n*   `p[x]`：额定消耗功率\n*   `g[x]`：与价格弹性成正比的系数\n*   `stab`：特征方程根的最大实部（如果为正值，则系统是线性不稳定的）\n\
  *   `stabf`：系统的稳定性标签，即目标变量\n\n\n我们的目标是从这些数据生成学习曲线。为了快速生成学习曲线，我们将借助 Scikit-learn\
  \ 的 `learning_curve` 函数。该函数确定了不同训练集大小的交叉验证得分。以下代码遵循步骤：\n\n*   加载数据。\n*   将类别标签转换为数值。\n\
  *   定义训练样本大小为 `1, 5, 10, 25, 20, 25, 50, 75`。\n*   定义特征和目标变量。\n*   使用线性回归并绘制学习曲线。\n\
  *   使用随机森林回归来检查方差是否减少。\n\n\n\n从上一章关于偏差-方差权衡和学习曲线的内容可以清楚地看到，如果不采取任何措施，可能会导致高偏差和高方差。正则化技术通常用于处理过拟合问题，实践中有多种正则化技术：\n\
  \n* Lasso 正则化\n* Ridge 正则化（岭回归）\n* 弹性网络（Elastic Net）\n* 早停（Early Stopping）\n* Dropout（丢弃法法）\n\
  \nRidge 和 Lasso 被广泛应用于机器学习技术，而 Dropout 则广泛应用于深度学习技术。还有许多其他正则化技术，包括 DropConnect。\n\
  \n### L1 正则化 (Lasso 正则化)\n\nLASSO 是最小绝对收缩和选择算子的缩写。L1 正则化通过向损失函数添加一个等于系数绝对值的惩罚项，同时进行变量选择和正则化，以提高模型的预测准确性。Lasso\
  \ 正则化通过消除不需要的协变量并仅保留提高模型效率的变量来工作。在 Lasso 之前使用的是逐步回归（step-wise regression），但只有当某些协变量与结果之间存在强相关时，它才能提高效能。然而，在某些情况下，逐步回归反而会恶化预测。\n\
  \n特征集所示 ![](img/158C1Eq12.jpg)。在 ![](img/158C1Eq14.jpg)\n\n带有 `l1` 惩罚项的变形函数所示：\n\
  \n![](img/158C1Eq15.jpg)\n\n这里，`(J(Θ))` 是代价函数，`λ∑*^n[i=][0] β*[j]*` 是正则化项。正则化系数对除截距外的所有参数进行惩罚并防止过拟合。随着模型复杂性的增加，L1\
  \ 正则化会增加高阶项惩罚并降低其重要性，使模型走向不复杂的解决方案并防止过拟合。调优参数 `λ` 控制 L1 惩罚的强度。在这里，`λ` 代表特征选择的数量：\n\
  \n* 在方程中，当 `λ = 0` 时，没有参数被消除。估计值等于基础模型找到的值。\n* 随着 `λ` 增加，越来越多的系数被设置为零并消除。如果 `λ =\
  \ ∞`，所有系数都被消除（实际上没人这样做！）\n* 随着 `λ` 增加，偏差增加。\n* 随着 `λ` 减少，方差增加。\n* `λ` 有时被称为 Alpha\
  \ (a)。\n\n### L2 正则化 (Ridge 正则化)\n\nL2 是机器学习中另一种广泛使用的正则化形式。L2 正则化将系数幅的平方作为惩罚项添加到损失函数中。以下公式是误差平方和。L2\
  \ 正则化只应用正则化而不进行变量选择。Ridge 正则化的一点之处是它会强制任何系数变为零。尽管如此，通过较高的 `λ` 值，它可以最小化属性对训练模型的影响。以下是在原始方程中添加\
  \ L2 惩罚项后的变形函数：\n\n![](img/158C1Eq16.jpg)\n\nElastic Net：Elastic Net 是 Ridge 和 Lasso\
  \ 正则化的凸组合。它的出现是因为 L1 正则化的缺点——其属性选择依赖于数据，因此非常不稳定。解决方案是结合 L1 和 L2 以兼两者之长。现在有两个参数可选：`α`\
  \ 和 `λ`。如果 `α = 0` 则使用 Ridge 正则化，如果 `α = 1` 则使用 Lasso 正则化，中间值决定了两者之间的平衡。\n\n###\
  \ 实现 Lasso 回归\n\n我已在波士顿房价数据集上应用了 Lasso 回归，并应用了不同的 `λ` 值。随着 `λ` 值的增加，某些变量被忽略了。共有\
  \ 13 个变量，分别为 `CRIM`、`ZN`、`CHAS`、`NOX`、`RM`、`AGE`、`RAD`、`TAX`、`PTRATIO`、`B` 和 `LSTAT`。我使用了\
  \ `sklearn` 函数。Lasso 是一种使用 L1 正则化项 `lambda` 和 `alpha` 训练的线性模型，在文献中被交替使用。不同的 `λ`\
  \ 值为 `[.0001, 0.25, .5, 0.75, 1.0]`。\n\n```python\n### 运行 Lasso 回归，改变不同的 alphas\n\
  def lasso(alphas):\n    '''\n    接收一个 alphas 列表。输出一个包含每个 alpha 的 lasso 回归系数的 dataframe。\n\
  \    '''\n    # 创建空帧\n    df = pd.DataFrame()\n    # 创建特征名称列\n    df['Feature Name']\
  \ = names\n    # 遍历 alpha 值列表中的每个 alpha，\n    for alpha in alphas:\n        # 使用该\
  \ alpha 值创建 lasso 回归\n        lasso = Lasso(alpha=alpha)\n        # 拟合 lasso 回归\n\
  \        lasso.fit(X, Y)\n        # 为该 alpha 值创建列名\n        column_name = 'λ = %f'\
  \ % alpha\n        # 创建该 alpha 值的系数\n        df[column_name] = lasso.coef_\n   \
  \ # 返回 dataframe\n    return df\n\n### 调用函数\ndf = lasso([.0001, 0.25, .5, 0.75,\
  \ 1.0])\n```\n\n正如你看到的，随着 `λ` 的增加，某些变量被赋予零重要性。通过降低变量重要性（或惩罚），l1 防止了过拟合。你可以使用脚本 `l1_regularization.py`\
  \ 进行实验：\n\n![](img/l1.jpg)\n\n图 11：不同 `λ` 值的 L1 正则化。\n\n随着 `λ` 的增加意味着某些变量被赋予零。Ridge\
  \ 回归：L2 方程清楚表明，如果 `λ = 0` 则没有应用正则化。如果 `λ` 很大，模型将无法学习任何内容或导致欠拟合。我将 Ridge 正则化应用到了房价数据集上。\n\
  \n```python\n### 创建一个 ridge 函数\ndef ridge(alphas):\n    '''\n    接收一个 alphas 列表。输出一个包含每个\
  \ alpha 的 ridge 回归系数的 dataframe。\n    '''\n    # 创建空数据框\n    df = pd.DataFrame()\n\
  \    # 创建特征名称列\n    df['Feature Name'] = names\n    # 遍历 alpha 值列表中的每个 alpha，\n\
  \    for alpha in alphas:\n        # 使用该 alpha 值创建 ridge 回归\n        Ridge = Ridge(alpha=alpha)\n\
  \        # 拟合 ridge 回归\n        Ridge.fit(X, Y)\n        # 为该 alpha 值创建列名\n    \
  \    column_name = 'λ = %f' % alpha\n        # 创建该 alpha 值的系数\n        df[column_name]\
  \ = Ridge.coef_\n    # 返回 dataframe\n    return df\n\n### 调用函数\ndf = ridge([.0001,\
  \ 25, 50, 75, 100])\n```\n\n正如我所看到的，随着 `lambda` 从 0.0001 增加到 100，惩罚逐渐增加。L2 增加了对属性的惩罚并防止模型过拟合。你可以使用脚本\
  \ `l2_regularization.py` 进行实验。我们可以在下面的图中看到：\n\n![](img/l2.jpg)\n\n图 12：不同 `λ` 值的\
  \ L2 正则化。\n\n### 实现 ElasticNet\n\n我在相同的波士顿房价数据集上应用了 ElasticNet，但使用了不同的 `λ` 值，设置\
  \ `α = 0.5`。以下是弹性网络优化的函数。它与之前的实现类似，并增加一个额外的 `l1_ratio` 参数，用于平衡 l1 和 l2 正则化：\n\n\
  ```python\n### 创建一个 elastic 函数\ndef elastic(alphas):\n```\n\n\n\n\n```python\ndf\
  \ = pd.DataFrame()\n\n### Create a column of feature names\ndf['Feature Name'] =\
  \ names\n\n### For each alpha value in the list of alpha values,\nfor alpha in alphas:\n\
  \    # Create a lasso regression with that alpha value,\n    Ridge = ElasticNet(alpha=alpha)\n\
  \    # Fit the lasso regression\n    Ridge.fit(X, Y)\n    # Create a column name\
  \ for that alpha value\n    column_name = ' λ = %f' % alpha\n    # Create a column\
  \ of coefficient values\n    df[column_name] = Ridge.coef_\n    # Return the datafram\n\
  \    return df\n\n### Run the function called, Lasso\ndf = elastic([.0001, 0.25,\
  \ 0.50, 0.75, 1.00])\n```\n\n我兼顾了这两者的优点，如下图所示。对于某些属性，它随着 `λ` 值的增加而施加惩罚，这是 L2 正则化的效果。像\
  \ `NDX` 和 `RX` 这样的属性几乎被消除，这是 L1 正则化的效果：\n\n![](img/elastic.jpg)\n\n**图 1.13:** ElasticNet\
  \ 正则化 – 不同 `λ` 值的效果。\n\n主要问题是在 `Lasso`、`Ridge` 或 `ElasticNet` 回归中选择变量 `a` 和 `λ`\
  \ 的最优值。可以使用交叉验证和基于信息准则的模型选择等方法来实现此，但这些方法的细节超出了本书的范围。`Early Stopping` 和 `DropOut`\
  \ 等技术在深度学习领域被广泛使用。我们将在本书后面与 `CNN` 和 `RNN` 相关的章节详细讨论 `Early Stopping` 和 `DropOut`。\n\
  \n你可以查看以下链接作为参考：\n\n* **Lasso**: [`scikit-learn.org/stable/modules/generated/sklearn.linear_model.Lasso.html`](https://scikit-learn.org/stable/modules/generated/sklearn.linear_model.Lasso.html)\n\
  * **Ridge**: [`scikit-learn.org/stable/modules/generated/sklearn.linear_model.Ridge.html`](https://scikit-learn.org/stable/modules/generated/sklearn.linear_model.Ridge.html)\n\
