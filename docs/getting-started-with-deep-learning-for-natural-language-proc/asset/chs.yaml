  \n以下模型包含 CNN 组件，用于处理我们基于字符的表示。该模型接受维度为 `[128, 5, 10, 68]` 的输入，其中 128 是批处理大小，5 是目标词加上下文词，10\
  \ 是单词中的最大字符数，68 是考虑的若干个唯一字符。换句话说，如果我们将输入比作图像，128 是批处理大小，5 类似于维度为 `10*68` 的图像通道。输入形状通过一系列卷积操作，通道数从\
  \ 5 增加到 40。生成的张量被传递到线性层，在应用 Softmax 层之后将其转换为输出概率：\n\n```python\nclass CNNmodel(torch.nn.Module):\n\
  \    def __init__(self,batch_size, class_num):\n        super(CNNmodel, self).__init__()\n\
  \        self.batch_size = batch_size\n        self.class_num = class_num\n    \
  \    self.conv1 = nn.Conv2d(in_channels=5, out_channels=10, kernel_size=3, stride=1)\n\
  \        self.conv2 = nn.Conv2d(in_channels=10, out_channels=20, kernel_size=3,\
  \ stride=1)\n        self.conv3 = nn.Conv2d(in_channels=20, out_channels=40, kernel_size=3,\
  \ stride=1)\n        self.linear1 = nn.Linear(in_features=40*4*62, out_features=self.class_num)\n\
  \n    def forward(self, input):\n        conv1_out = self.conv1(input)\n       \
  \ conv2_out = self.conv2(conv1_out)\n        conv3_out = self.conv3(conv2_out)\n\
  \        linear1_out = self.linear1(conv3_out.view(self.batch_size,-1))\n      \
  \  return torch.softmax(linear1_out, dim=1)\n```\n\n以下是训练数据上的性能。准确率达到了 85%，损失显著下降：\n\
