  \n## 结论\n\n在本章中，我们看到了语音也与 NLP 有关，而且它更像是持续流动的数据。我们实验了音频数据所需的预处理操作，然后涵盖了语音处理领域最常用的两个应用：语音转文本和文本转语音。在这两者中，都使用了\
  \ `CNN` 和 `RNN` 模型，正如我们在 `DeepVoice` 和 `DeepSpeech` 模型中所看到的那样。我们还看到这些网络使用了 `CTC`\
  \ 损失函数，我们之前详细了解过它。这个领域正在不断演进，如果你对该领域感兴趣，可以探索类似 `NvidiaTacotron` 和 `Waveglow` 等模型。\n\
  \n在下一章中，我们将学习应用程序的运行效率。\n\n# 第 11 章：未来的道路\n\n本书的目标是为你提供整个 `NLP` 景图，并将 `Deep learning`\
  \ 应用于日常用例。本章涵盖了深度学习爱好者必须具备的技能。本章主要关于如何使用各种优化技术，将实验扩展到可生产的解决方案。我们已经走了很长一段路，涵盖了大部分基础及其实现。对这些实现的概念性知识将帮助你在现实生活中应用它们。之前的章节涵盖了概念和应用，但还有更多内容。部署是现实应用中的一个重要终点。当涉及到\
