  \ #artificialintelligence#datascience\"\"\"\nprint(“ With Default Parameter : “,tknzr.tokenize(example_string))\n\
  tknzr = TweetTokenizer(strip_handles=True)\nprint(“ With Default Parameter : “,tknzr.tokenize(example_string))\n\
