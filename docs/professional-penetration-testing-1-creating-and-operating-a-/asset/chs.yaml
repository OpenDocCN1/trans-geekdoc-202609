  \ Web 的公司联系信息列表。CEO 期望你证明系统管理员遵循了所有适当且认可的安全实践，并且你无法获得该机器的访问权限。\n\n### 2.100\n\n\
  此 LiveCD 配置的互联网协议 (IP) 地址为 `192.168.2.100`——不需要对服务器进行任何额外配置。此 LiveCD 的场景是：你被分配了一项任务，测试公司的\
  \ `192.168.2.xxx` 网络以识别任何漏洞或利用。该网络内的系统不是关键系统，且最近创建并测试了备份，因此你可能造成的任何损害都不令人担心。该组织在过去的几年中有多位系统管理员管理过网络，他们不确定之前（或当前）员工的能力。\n\
