  \ 年 9 月 24 日。还有一个较晚的版本，但根据 [Archive.org](http://Archive.org) 的说法，它与 9 月 24 日的存档没有区别。如果你正在进行真实的渗透测试，你可能想要浏览所有可用链接，以便查看更新中增加了或删除了哪些信息。网站变化有几个原因；我们最感兴趣的是那些纠正错误的，例如敏感的网络和服务器信息泄露或个人信息。\n\
