  \ P., *俄语谚语与俗语俄英比较字典*. (1995) Hippocrene Books, New York .\n\n# 第 16 章 数据归档\n\n\
  ## 引言\n\n未雨绸缪不可。 – 俄语谚语：*“人无法预见一切。”* (Mertvago, 1995) 在渗透测试项目过程中，渗透工程师会保存大量的文档——供应商文档、客户文档、协议文档、初始报告、最终报告、电子邮件，以及在实际系统攻击期间记录的所有内容。大多数数据在渗透测试结束时不需要保留，但极少数特殊原因。如果项目经理对收集的数据投入了很大价值（无论是为了编制指标还是其他目的），他们可能希望保留所有内容。对于某些经理来说，在需要时拥有所有数据比完全没有要好。然而，如果不归档任何数据，数据被未经授权访问的风险就不复存在。如果决定归档渗透测试数据（即使是最终报告），也有一些需要解决的安全问题，例如访问控制、归档方法、归档数据的位置以及销毁策略。\n\
  \n## 你应该保留数据吗？\n\n关于保留渗透测试数据，有两种观点：保留所有或什么都不留。主张“保留所有”的人希望能够随时响应客户的查询，即使是多年以后；通过保留数据，渗透测试团队可以重建事件，并提供比严格依赖旧报告详细得多的答案。主张“什么都不留”的人则不希望承担电子或物理盗窃导致客户数据丢失的风险。此外，通过我们*不*保留数据，客户就不需要担心存储在场外的敏感数据受保护的问题。即使我们不想承担保护渗透测试数据以进行长期存储所需的责任（以及高昂的成本），我们至少需要了解一些法律问题。\n\
  \n### 法律问题\n\n渗透测试团队似乎不需要担心法律问题和数据留存问题，因为我们收集的任何数据实际上都是客户的数据；但现实是，人们会在计算机上做坏事，渗透测试工程师最终会遇到需要联系执法部门的数据或活动。在进入渗透测试之前了解法律问题有助于保留证据。由于当地法律在州与州、县与县之间差异巨大，本书书中将重点关注联邦要求。理解“报告什么内容以及何时报告”的起点是美国司法部\
  \ (USDOJ) 计算机犯罪与知识产权部门 (CCIPS)，访问地址为 [www.usdoj.gov/criminal/cybercrime/reporting.htm](http://www.usdoj.gov/criminal/cybercrime/reporting.htm)。\n\
  \n**提示** 尽管我们只关注联邦法，但这并不意味着我们不需要担心当地法律。大多数非法活动的发现都需要某种形式的当地执法部门参与。表 16.1 描述了美国司法部认定的网络犯罪领域。\n\
  \n**表 16.1 网络犯罪**\n\n| 犯罪活动 | 报告机构 |\n| :--- | :--- |\n| 计算机入侵（即黑客攻击） | FBI 办公室<br>美国秘密局<br>网络投诉中心\
  \ |\n| 货币伪造 | 美国秘密局 |\n| 儿童色情或或剥削 | FBI 办公室<br>美国海关与边境保护局（进口）<br>网络投诉中心 |\n| 儿童剥削与涉及邮政的网络欺诈\
  \ | 美国邮政检查局<br>网络投诉中心 |\n| 网络欺诈与垃圾邮件 | FBI 办公室<br>美国秘密局（金融犯罪处）<br>联邦贸易委员会 |\n| 证券欺诈或投资相关的垃圾邮件\
  \ | 美国证券交易委员会<br>网络投诉中心 |\n| 网络骚扰 | FBI 办公室 |\n| 网络炸弹威胁 | FBI 办公室<br>ATF 办公室 |\n\
  | 通过网络贩卖爆炸物、纵燃装置或火器 | FBI 办公室<br>ATF 办公室 |\n| 版权侵权（例如软件、电影、录音制品） | FBI 分局办公室<br>美国海关与边境保护局<br>网络投诉中心\
  \ |\n| 商标伪造 | FBI 分局办公室<br>美国海关与边境保护局<br>网络投诉中心 |\n| 窃取商业秘密 | FBI 分局办公室 |\n\n##\
  \ 电子邮件\n\n\n\n\n项目经理和渗透测试（PenTest）工程师在渗透测试过程中会产生电子邮件——大部分邮件是关于进度和资源的讨论。然而，某些邮件包含应当保护的敏感数据，特别是在归档时。在渗透测试项目结束后，必须保留电子邮件本身（而非附件文件）的情况下，我们可以将电子邮件存储在邮件服务器上，也可以将其本地归档。将电子邮件存储在邮件服务器上为需要查找旧邮件提供了一个单一的检查位置，使检索更加容易。在本地归档电子邮件需要额外的工作，因为必须查询每个用户的系统。当本地数据丢失、系统更换或员工离开公司时，就会出现问题。无论使用哪种方法保留电子邮件，只要保留包含敏感信息的邮件任何时间，都必须建立适当的加密和访问控制机制，以防止客户数据的意外泄露。大多数现代电子邮件应用程序都有加密邮件通信的方法，无论是在静态存储还是在传输过程中。加密的使用通常由电子邮件客户端或服务器在后台执行，且实施起来非常简单。简单邮件传输协议（SMTP）是一种本质上不安全的协议；为了提高通过\
  \ SMTP 传输数据的安全性，电子邮件程序会使用额外的加密。例如，微软的邮件服务器可以使用传输层安全协议（TLS）创建公/私钥，在邮件从一个邮件服务器传输到另一个邮件服务器期间加密通信会话。\n\
  \n### 工具与陷阱\n\n### 你被控制了吗？\n\n当员工离开时，他们的电子邮件信息会发生什么？许多员工在离开组织之前会制作公司电子邮件的副本，以便他们保留联系人和在旧公司的工作历史。如果邮件包含敏感或专有信息，公司将面临许多风险。\n\
  \n## 发现与报告\n\n对渗透测试过程中识别出的任何漏洞和利用信息的访问都应该被严格控制。如果我们决定要保留渗透测试数据，我们需要确保实施了机密性和可用性控制，以防止未经授权的人员获取这些信息。我们想要保留旧发现和报告有几个原因。客户丢失历史报告的情况并不罕见。审计员通常会请求与安全评估相关的历史文档，如果客户无法提供，审计员将在他们的审计报告中注明缺少文档。即使客户不需要为审计员提供这些文档，未来的渗透测试报告也将帮助我们重新评估客户的安全态势；如果客户没有报告副本，而我们又未能保留自己的副本，那么我们只能从零开始。\n\
  \n**提示** 保留发现还可以对未来防止推卸指责提供某些保护。如果客户在我们对其网络进行渗透测试几个月或几年后遭到入侵，他们可能不会记得我们围绕项目发现发出的警告。为了防止指责归于我们“缺乏尽职调查”，归档发现和报告可以将过转嫁给相关方。\n\
  \n# 文档安全\n\n如果与目标网络架构相关的文档落入恶意黑客之手，客户将面临风险——如果受损的文档包含了已识别的漏洞和利用，取决于数据的敏感性，客户可能会受到严重影响。在`Chapter\
  \ 15` 中，如果我们决定要保留渗透测试数据，我们需要确保实施了机密性和可用性控制，以防止未经授权的人员获取这些信息。我们想要保留旧发现和报告有几个原因。客户丢失历史报告的情况并不罕见。审计员通常会请求与安全评估相关的历史文档，如果客户无法提供，审计员将在他们的审计报告中注明缺少文档。即使客户不需要为审计员提供这些文档，未来的渗透测试报告也将帮助我们重新评估客户的安全态势；如果客户没有报告副本，而我们又未能保留自己的副本，那么我们只能从零开始。\n\
  \n**提示** 保留发现还可以对未来防止推卸指责提供某些保护。如果客户在我们对其网络进行渗透测试几个月或几年后遭到入侵，他们可能不会记得我们围绕项目发现发出的警告。为了防止指责归于我们“缺乏尽职调查”，归档发现和报告可以将过转嫁给相关方。\n\
  \n(注：原文后续部分存在大量重复段落，已按逻辑要求进行处理。)\n\n\n\n\n`Warning` 自动归档系统面临着不同的问题。虽然系统通常使用证书（这些可以存储在可移动介质上并安全地存放在的地方），但归档系统本身可能会变得不可用。如果没有类似的归档系统作为替代，由于归档系统供应商之间的不兼容，即使证书仍然可用，归档的数据可能无法恢复。更好的数据归档方法将取决于资源情况。对于小型组织，将加密文件归档到光盘上可能是可能是保护客户数据的一种简单且有效的方法。对于为多个客户生成大量报告的大型组织，远程磁带备份可能更有意义。无论选择何种方案，安全保护机制必须为我们的数据提供足够的机密性、可用性和完整性。\n\
  \n## 归档位置\n\n如果我们计划归档数据，就需要考虑灾难恢复和业务连续性计划，随着风险在归档过程中被识别，这些计划可能会变得非常复杂。假设我们要归档数据；将归档数据存储在与以前保留数据的系统同一个房间或建筑内通常是一个坏主意。我们决定，由于自然灾害和人为灾害的无处不在，归档的渗透测试数据需要存储在与归档系统位置地理上分离的安全设施中。另一个考虑因素是我们需要两份副本——一份移至他处，另一份留在本地，以防我们需要快速访问。\n\
  \n`你被拥有了吗？` \n\n# 数据归档噩梦\n\n我曾与一家软件开发公司的网络管理员讨论过他对公司软件开发代码库服务器的归档流程。他已经归档了多年数据，并觉得他们的数据是安全的。数据从未经过过完整性验证，但因为磁带归档系统一直显示备份成功，所以一切都很正常。我们运行了一项测试，发现大多数磁带都是空白。事实证明系统管理员在代码库系统上关闭了归档客户端，因为“它减慢了系统速度”；网络管理员没有收到此问题的警，因为备份系统对无响应客户端的默认响应是跳过该无响应客户端并移动到下一个系统。在归档过程结束时，归档系统会在日志中创建一个备注，说明某些系统（包括代码库系统）未被归档，但整体备份是“成功”的。由于网络管理员从未查看过报告的细节，只关注成功通知，他们认为一切运行正常。当我们决定迁移数据时，我们意识到，尽管将归档数据迁移到场外位置减少了一个风险（通过本地灾难丢失数据），但它引入了另一个风险（未经的访问），因为数据被传输并存储在其他地方。如果数据在传输之前进行加密，我们可以缓解这一新风险，但现在我们需要一种远程解密数据的方法，以防我们丢失本地的所有系统。如果我们使用磁带备份归档系统（如\
  \ `VERITAS`）归档数据，我们需要为备用位置的第二组归档数据获取第二个系统。自然，我们需要传输加密密钥，以便以后在需要时解密数据——我们不能在数据传输期间发送密钥，以防数据在途中被盗。现在我们的数据位于两个位置，我们如何访问第二组数据呢？我们需要远程员工来执行该过程，这意味着我们需要培训他们如何解密数据并妥善保护数据。\n\
  \n## 销毁策略\n\n最终，我们需要销毁文档。可能有我们必须满足的客户数据保留要求；一旦允许销毁数据，我们必须谨慎行。数字媒体的销毁技术将取决于敏感性。\n\
  \n`Note` 根据类型和政府法规，销毁数据有多种方法。某些政府法规要求硬盘必须粉碎，而不是覆盖。确保在渗透测试期间检索的所有数据都得到妥善处理。任何销毁数据时，都应生成并保留销毁记录。销毁记录中包含的信息应包括数据描述、媒体类型以及日期、地点和用于销毁数据的方法。应让客户了解渗透测试团队的销毁策略以及访问数据销毁相关记录的方法。\n\
  \n## 总结\n\n当渗透测试数据保留任何长度时，客户都应该对我们的归档过程有清晰的了解，包括我们保留什么、存放在哪里、保留多久以及我们如何保留。保留项目数据有很多益处，但它必须防止未经授权的访问。如果恶意用户获取了渗透测试数据，他或她可能会不受限制地访问我们客户的网络。如果决定保留数据，则需要制定健全的归档方案。需要编写销毁策略、调查归档位置、定义加密方法，并实施对数据和加密密钥的访问控制。拥有一一个健全的归档流程不是一个人的责任。所有团队成员都有责任在渗透测试项目期间和之后保护数据。每个人还必须理解如何应对法律问题，并能够重建导致发现任何非法活动之前的步骤。\n\
  \n# 解决方案快道\n\n## 你应该保留数据吗？\n\n■ 关于保留渗透测试数据，有两种观点——全部保留或一律不留。■ 如果渗透测试工程师在渗透测试过程中发现了非法活动的证据，那么在刑事案件上诉法庭的情况下，该工程师可能会被传作证人。■\
  \ 拥有关于工程师在渗透测试过程中所执行的所有步骤的详细文档，将减少在法庭上犯错误的概率。\n\n\n\n\n\n- 如果我们使用全盘加密来保护渗透测试数据，可以使用宿主操作系统中提供的访问控制机制来限制对数据的访问。\n\
  - 任何归档程序必须验证数据已妥善传输并可以恢复。\n- 数据的销毁取决于数据类型及其获取方式，可能需要符合政府的指南。\n\n**Q**: 我有一个法律问题……\n\
  **A**: 请咨询你的律师。我知道这听起来像是个借口，但法律是复杂且瞬息万变的的。每个渗透测试团队都应该有一位熟悉信息系统评估相关法律的律师。\n\n**Q**:\
  \ 如果我在渗透测试期间发现了非法活动，我难道不能直接通知客户并让他们自己处理这些发现吗？\n**A**: 请参见上一个问题的回答。\n\n**Q**: 在渗透测试团队中，谁负责灾难恢复和业务连续性？\n\
  **A**: 通常情况下，职能经理将拥有有关如何满足灾难恢复和业务连续性要求的企业准则，并对团队遵守这些指南负最终责任。参考 Mertvago, P., *The\
  \ comparative Russian-English dictionary of Russian proverbs & sayings*. (1995)\
  \ Hippocrene Books, New York .\n\n# 第 17 章 清理你的实验室\n\n## 引言\n\n牛丢了，绳也跟着丢了。 – 俄罗斯谚语：*“如果牛丢了，绳索也就丢了。”*\
  \ (Mertvago, 1995) 当我们为客户创建最终报告时，我们会包含足够的信息，以便客户能够完全理解其网络中存在的漏洞。我们还会向他们提供目标是如何被攻破的详细描述，以便如果他们需要，可以重新创建利用程序。在发布报告后，我们在实验室中进行任何操作都应该不再有价值，并且通常可以删除。为了保护我们的客户，我们在为下一个项目清理实验室时需要非常彻底，以防系统中留有敏感信息。除了担心客户的数据外，我们还不希望之前的配置会影响未来在实验室中进行的任何工作。通过正确且系统地销毁实验室中的数据，我们可以安全地过渡到下一个专业的渗透测试项目。然而，在某些情况下，我们可能希望保存实验室中的所有数据。如果我们将实验室用于研究，我们可能需要在未来的某个时间能够复制完全相同的实验室环境，以便恢复工作或为供应商或其他研究人员提供访问权限。\n\
  \n# 归档实验室数据\n\n渗透测试实验室可以为多种用途而设计。根据用途，测试数据可能需要进行归档和保留。在第 16 章中，我们讨论了渗透测试数据的归档，但在本节中，我们将讨论一些特殊情况，例如恶意软件分析实验室和概念证明（Proof\
  \ of Concepts）。即使我们的工作属于高级研究（如恶意软件的分析或创建），我们仍然希望归档实验室数据。如果在渗透测试项目之间有任何空档，我们可能希望利用这些间隙练习一些黑客技术。如果我们在下一次渗透测试开始之前未能及时完成训练，我们可以归档数据并在稍后恢复实验室。这可能非常有益，特别是当为我们的自学训练配置实验室需要大量工作时。\n\
  \n### 概念证明 (Proof of Concepts)\n\n如果我们使用专业的渗透测试实验室作为识别和利用应用程序或网络设备零日漏洞的方法，那么我们的归档要求与用于识别和利用公开漏洞的实验室有所不同。当我们尝试在目标中寻找未发现的缺陷，并旨在通知应用程序或设备供应商以及发布我们的发现时，我们必须意识到如何归档我们的发现。在开发概念证明的实验室中归档数据的首要考虑问题是能够准确重建实验室。通常情况下，我们只会归档攻击平台上的活动和发现；但在开发概念证明时，我们必须归档研究环境中的所有系统。如果概念证明具有重大意义且涉及整个技术领域，那么发现应该是科学的，包括重建实验室的能力。\n\
  \n**警告**：创建应用程序漏洞的概念证明是一个敏感活动——许多供应商反感反向工程，并会对发现漏洞的人员采取法律行动。在概念证明实验室中归档数据的第二个主要考虑问题是用于利用未文档漏洞的恶意软件。应用程序或设备供应商无疑想要恶意软件或脚本的副本以验证我们的发现。恶意软件研究组织也可能对恶意软件感兴趣。妥善处理和存储恶意软件符合供应商、研究组织以及我们的利益。\n\
  \n### 恶意软件分析\n\n与开发概念证明的实验室类似，检查恶意软件的实验室需要归档研究环境中的所有系统。然而对于恶意软件实验室，所有归档数据必须被认为是危险的，甚至是网络设备存档。如果我们要归档实验室中的任何数据，必须确保所有存档介质都有明确标记，以指示数据中存在恶意软件。我们可能需要在非虚拟环境中分析恶意软件，这意味着恶意软件能够随意感染和损坏系统文件，而没有虚拟机提供的“沙箱”安全性。如果我们归档虚拟机，可以很容易地保存系统的当前状态。然而，如果我们在非虚拟系统中运行，我们可能需要归档整个系统，因为我们无法确定恶意软件修改了哪些内容。我们可以使用的一种方法是创建系统的磁盘镜像。虽然我们在本章稍后的部分会更详细地讨论镜像，但\
  \ `ghost image` 是目标系统的完整备份，在需要时可以在以后将目标恢复到当前状态。\n\n## 许可问题\n\n\n\n\n在我们创建任何虚拟机或系统镜像（ghost\
  \ images）之前，需要将许可问题纳入实验室归档方案的考量中。由于大多数恶意软件针对微软 Windows 系统，我们希望在实验室中使用不同的微软 操作系统。在实验室中使用任何微软产品都要求我们遵守许可协议。有关微软\
  \ 虚拟化许可的信息可以在 [www.microsoft.com/licensing/about-licensing/virtualization.aspx](http://www.microsoft.com/licensing/about-licensing/virtualization.aspx)\
  \ 处找到。在虚拟系统中使用微软操作系统的限制比 Linux 更加严格，但只需花极少精力仍可以实现合规性。操作系统并不是我们唯一需要关注的许可——在创建和部署系统镜像时，必须遵守所有应用程序许可。我们希望确保，如果在实验室的多个系统之间使用同一个系统镜像，不会违反任何许可协议。如果许可协议对于在渗透测试实验室中的适用性不明确，请联系法律部门或律师。\n\
  \n## 虚拟机\n\nVMware Enterprise、Xen 和 Hyper-V 都能对正在运行的虚拟机（由它们控制的）拍摄快照并保存快照以备以后使用。我们可以保存对系统的连续修改，例如在每次打补丁后保存微软服务器的镜像。这将允许我们准确确定是哪一个补丁修复了漏洞。虚拟机还为渗透测试工程师提供了一个平台，可以在漏洞评估中运行不同的应用程序。我们可以拥有一个运行\
  \ Apache 的服务器虚拟镜像，以及另一个运行 Internet 信息服务 (IIS) 的虚拟镜像。如果我们想看看漏洞是否跨平台有效，只需启动每个场景的虚拟镜像并观察会发生什么。归档系统镜像可以为渗透测试工程师节省大量搭建和拆除实验室的时间。\n\
  \n## “Ghost”镜像\n\n创建系统 Ghost 镜像（系统镜像）的理念是对所有系统文件进行备份，以便能够恢复到 Ghost 时的系统精确状态。与虚拟机类似，系统可以（相对）快速地恢复到之前保存的状态。如果我们在测试过程中对系统进行了某些操作，我们可以重新开始，而无需重新构建整个系统。Ghost\
  \ 的缺点是恢复过程可能非常耗时。虚拟机可以在几分钟内恢复到原始状态，但 Ghost 镜像还原的时间要长得多。排除其他所有因素，如果我们需要快速将系统恢复到纯净状态，Ghost\
  \ 镜像并非选择。与使用虚拟机相比，制作 Ghost 也有某些优势。最大的优势在于如果我们将实验室用于恶意软件分析。许多高级恶意软件会在执行前尝试检测系统环境。如果高级恶意软件检查并检测到我们正在虚拟机中运行分析，它可能会直接关闭，导致我们无法分析该恶意软件的行为。由于许多恶意软件分析是在虚拟镜像中进行的（为了节省重建系统的时间），恶意软件编写者正试图通过检查使用的环境类型来破坏分析尝试。通过使用\
  \ Ghost 镜像，我们是在非虚拟环境中运行分析，这意味着我们可以分析所有类型的恶意软件——即使是那些不会在虚拟机中运行的恶意软件。\n\n**提示** 如果实验室需要\
  \ Ghost 镜像，请购买额外的系统，以消除在安装纯净镜像上浪费的时间。通过始终准备一个最近进行过 Ghost 的可用系统，工程师们……\n\n### 你被控制了吗？\n\
  \n我最糟糕的经历之一是处理感染。在我们的 BackTrack 副本中有一个名为 `shred` 的应用程序，它可以根据需要覆盖任何文件或整个硬盘。\n\n##\
  \ 创建“纯净工作间”\n\n在渗透测试结束时，我们需要确保没有留下任何残留数据。如果我们从头开始重建所有系统，必须确保万无一失。\n\n## 清理方法\n\n\
  当我们对目标系统进行清理时，我们需要考虑许多组件，包括硬盘、系统内存和（理论上的）基本输入输出系统 (`BIOS`)，这取决于我们使用渗透测试实验室的原因。\n\
  \n\n\n\n# Shred 输出帮助\n\n在图 17.2 中，我们启动了 `shred`，并指向 Hackerdemia LiveCD 上的 `/tmp/netcat/output`\
  \ 文件。如果我们愿意，也可以对整个本地硬盘运行 `shred`，以确保我们所有的实验数据都被销毁。在我们在使用 `shred` 的示例中，我们只告诉应用程序覆盖文件三次，这仅仅是为了节省时间；然而，如果我们足够疑神，可以使用默认的（25\
  \ 次）或更高的数字。\n\n| ![B9781597494250000233/f17-02.jpg is missing](img/f17-02.jpg) |\n\
  | --- |\n| 图 17.2. |\n| 在 `/tmp/netcat/output` 文件上启动 Shred |\n\n**提示** 关于如何清理数字介质的好点来源可以在美国国家标准技术协会（NIST）的计算机安全部门找到。特殊出版物\
  \ 800-88 提供了数据清理指南，可以在此处找到：[`csrc.nist.gov/publications/nistpubs/800-88/NISTSP800-88_rev1.pdf`](http://csrc.nist.gov/publications/nistpubs/800-88/NISTSP800-88_rev1.pdf)\
  \ 如果我们在使用 `shred` 之前检查 `/tmp/netcat/output_file`，我们看到文件大小为 17 字节，包含一行——“File to\
  \ download.”一旦运行 `shred`，文件大小变为 4094 字节，文件包含随机数据。最终大小的差异与磁盘设计和扇区大小有关。为了确保所有数据都被删除，所有包含文件数据的扇区都被清理。系统内存可能包含恶意程序，例如后门代理。当我们使用\
  \ `CORE IMPACT` 时，能够利用漏洞并将 shell 账户注入内存。只要系统保持运行，shell 应用程序就会留在内存中。如果我们重启系统，应用程序就会消失。清除系统内存非常简单，因为重启将满足我们对清洁环境的需求。唯一的复杂性在于何时应该重启。如果恶意程序在启动时被注入内存，我们需要确保在重启之前对系统上的所有文件进行清理；否则，我们只是会用恶意软件重新感染系统。确保完全清理的最佳方法是全盘擦除，这可以防止重新感染。除了完全清理外，我们可能需要进行一些取证分析以确定我们的系统是否干净。我们愿意在确定系统感染状态上投入的精力取决于我们在实验室中做什么；如果不使用恶意软件，我们可能不会花费太多精力来清理系统。\n\
  \n**工具与陷阱……**\n\n# 重新感染\n\n在渗透测试实验室中使用恶意软件时，我们在移除恶意程序时需要小心。恶意软件通常会包含重新感染宿主机的方法，以防代码被检测。在尝试卸载任何导入的恶意软件时，请务必遵循删除说明（可以在许多不同的病毒扫描软件开发人员处找到）。有一些\
  \ BIOS 恶意软件示例，它们可以将代码注入到我们的实验系统中。目前 BIOS 攻击的进展涉及将代码注入 BIOS，这会有效地使系统无法运行。虽然遭受 BIOS\
  \ 攻击导致系统丢失在最好也是方便的，但目前我们不需要担心清理系统 BIOS。未来我们可能需要担心 BIOS 数据；然而，供应商已经让 BIOS 更新变得非常方便，这可能成为清理实验室系统时的常规程序。\n\
  \n## 使用哈希值\n\n一旦我们移除了系统上的所有数据并开始重建，在继续之前，我们需要确保我们使用的是供应商提供的应用程序和操作系统。在第 4 章中，我们讨论了使用哈希值来验证实验室中使用的安装盘和应用程序，一旦我们清理了系统并开始重建，我们需要继续文件验证过程。然而，我们创建的虚拟机镜像和\
  \ Ghost 镜像呢？我们可以使用 `MD5` 生成自己的哈希值，并将其添加到渗透测试实验室使用的哈希值列表中。区分一个虚拟机或 Ghost 镜像与另一个很困难。为了提供某种保证，必须有一种方法允许渗透测试工程师能够清晰地识别一个镜像与另一个。如果实验室用于分析恶意软件，我们可能想对系统应用程序创建哈希值，并将哈希值与其原始值进行比较。通过比较新旧哈希值，我们可以检测到在调查过程中可能未识别的任何文件修改。\n\
  \n**注意** 如果恶意软件安装了 rootkit，我们无法依靠哈希值的准确性。rootkit 可能会拦截我们的哈希请求并返回错误数据，希望我们无法检测到 rootkit\
  \ 的存在。\n\n## 变更控制\n\n事物往往会发生变化——应用程序被更新，操作系统被了补丁。当实验室为下一轮测试进行清理时，可能没有必要完全清理系统。事实上，清理实验室的工作量应该相对于我们计划在实验室进行的活动——删除所有内容并没有意义，如果我们只修改了几个文件。如果我们想减少工作，只需替换我们需要。然而，问题在于，我们需要确保所替换的文件是正确的。变更管理用于指定哪些应用程序用于服务器。在渗透测试实验室中，变更管理具有类似的作用——指定哪些用于实验室系统。想法是实验室通常用于模拟生产环境；为了确保实验室安装的应用程序版本正确，生产与渗透测试实验室之间需要协调。渗透测试工程师从生产变更管理人员获取软件和补丁而不是建立独立的管理并不常见。\n\
  \n## 总结\n\n在典型的渗透测试实验室，清理系统通常需要删除所有内容，包括操作系统、文件和配置。然而，在某些情况下，我们需要存档我们的实验室环境。类似于第\
  \ 16 章中讨论的渗透测试数据，我们在存档实验数据时需要有方法且彻底，不一定是为了法律原因或满足客户要求，而是为了研究的连续性。存档实验室系统时，我们面临包含恶意软件的风险。当我们保存恶意软件时，我们需要正确标记存档介质并确保防止未经授权的人员访问。为存档生成哈希值有助于减少在实验室中意外使用的概率，包括感染的系统镜像和干净安装的\
  \ Ghost 镜像。任何未存档的数据都需要适当清理，并在项目开始之前必须删除所有数据。配置文件和旧数据可能会损坏未来的渗透测试研究；需要开发适当的清理程序以确保清洁。\n\
  \n# 快速解决方案\n\n## 存档实验数据\n\n■ 用于识别和利用零日漏洞的专业渗透测试实验室与识别和利用可用漏洞的实验室具有不同的存档需求。 如果我们备份虚拟机，可以轻松地保存系统的当前状态。■\
  \ 如果我们在非虚拟系统中运行，我们可能需要存档整个系统，因为我们无法确定恶意软件修改了什么。## 创建和使用系统镜像\n\n\n\n\n\n■ 在创建任何虚拟机或幽隆镜像（ghost\
  \ images）之前，需要将许可问题纳入实验室归档方案的决策中。虚拟机镜像可以在几分钟内恢复到原始状态，而幽隆镜像恢复所需的时间要长得多。许多高级恶意软件会在执行前尝试检测系统环境，且不会在虚拟机中运行；使用幽隆镜像可以节省在恶意软件分析实验室重建系统上花费的时间。\n\
  \n## 创建“洁净工作间”\n\n■ 如果我们在渗透测试结束时没有对实验室进行适当清理，我们的系统中可能会残留客户的敏感敏感信息。要区分不同的虚拟机镜像或幽隆镜像是困难的；如果我们使用服务器镜像，则需要生成自己的哈希值（hash\
  \ values），并将其添加到渗透测试实验室使用的哈希列表中。\n\n**问：** 我应该归档网络设备（如防火墙和路由器）吗？**答：** 如果你使用恶意软件攻击了这些任何系统，归档这些信息以备后查询是明智的。否则，可能不需要将这些设备纳入归档过程中。**问：**\
  \ 在使用虚拟机镜像时，保存数据的最佳方法是什么——我应该在虚拟机镜像和宿主机系统之间共享数据吗？**答：** 通过允许虚拟机访问宿主机系统，你面临着感染宿主机本身的风险。如果宿主机系统感染不是问题，那么在两个系统之间共享数据可能是可以的。这不是我会做的，但在某些情况下没问题。**问：**\
  \ 为什么我不能直接删除文件，而要使用像 `shred` 这样的程序？**答：** 当操作系统删除文件时，通常删除的仅是文件列表而不是文件本身。这意味着数据仍然存在。如果我们担心涉及客户网络的敏感信息，我们真的应该擦除所有数据，而不仅仅是文件引用。参考\
  \ Mertvago, P., *The comparative Russian-English dictionary of Russian proverbs\
  \ & sayings*. (1995) Hippocrene Books, New York .\n\n## 第 18 章为下一次渗透测试做计划\n\n##\
  \ 引言\n\nОтзвонил, да и с колокольни долой проч. – 俄罗斯谚语：“钟一响，便离开钟楼。”(Mertvago, 1995)\
  \ 在渗透测试项目的这个阶段，渗透测试工程师除了回答项目经理的一些反馈问题外，对项目没有别无可做的了。为了提高未来项目的成功率，项目经理还需要执行一些额外任务。每个项目都提供了在之前的渗透测试经验基础上进行构建的机会。`risk\
  \ management register`（风险登记表）是一种用于控制项目风险工具。通过维护一份过去出现过的风险列表，项目经理可以为未来的工作做准备。另一个受益于运行过往项目的工具是`knowledge\
  \ database`（知识库），它保留了所有关于之前渗透测试的信息。知识库并不是仅仅将最终报告作为参考，它包含了有关漏洞是如何被利用的、发现了哪些漏洞以及参考材料，旨在作为未来项目的仓库。知识库为渗透测试工程师提供了一个单一的信息源，他们可以快速向其寻求指导。另一个受益于以往渗透测试的工具是与团队进行项目后访谈。通过开展旨在识别每个项目优缺点的事后回顾（after-action\
  \ reviews），项目经理可以提高渗透测试团队的效能。事后回顾还让项目经理了解在即将到来的项目中可能需要的技能，以便他们安排适当的培训。\n\n### 风险登记表\n\
  \n维护风险登记表为项目经理提供了一种识别、量化和管理项目内部风险的方法。风险登记表专门针对项目风险，而不是在客户网络中可能发现的风险。虽然跨行业的项目中会发现的风险中有些可能出现在我们的项目里，但有些风险是专业渗透测试所特有的。然而，所有类型的风险都应该添加到登记表中。\n\
  \n#### 创建风险登记表\n\n风险登记表不需要很复杂；它可以包含精简的信息，如风险和应对措施，长度可能只有几行。对于许多渗透测试项目来说，这可能足够了。风险登记表也可以非常大；一些较复杂的风险登记表包含每个风险的唯一代码、每个风险的细微差别和变体、经过优先级排序的潜在应对措施列表、参与风险事件的人员列表、风险的可接受性、警示信号、报告触发因素、职责分配以及每个风险的“评分”。\n\
  \n**提示** 登记表的大小应受到公司合要求和可用人员配置的影响。尽管拥有一个大型且复杂的登记表听起来对项目经理可能很有吸引力，但开发一个“理想”登记表所需的时间和资源可能不符合项目团队的需求。对于小型渗透测试团队，有效的风险登记表不需要复杂。表\
  \ 18.1 是风险登记条目的示例，可以直接用于渗透测试。\n\n**表 18.1.** 简单风险登记项\n\n|  ||  |\n| --- | --- |\n\
  | 识别出的风险 || 可能的应对措施 |\n| 网络连接中断 | ■ 将全体员工搬迁到加利福尼亚州 Mountain View 并使用 Google WiFi\
  \ ■ 与互联网服务提供商 (ISP) 签订冗余网络连接合同 ■ 购买移动路由器硬件和高速无线宽带卡 ■ 区域内有 Wi-Fi 的当地咖啡馆 |\n\n风险登记表可以包含潜在风险，而不仅仅是实际风险；项目经理和渗透测试工程师可以通过头脑风暴创建一个潜在风险和解决方案的登记表。以这种方式构建风险登记表的优势在于，一旦风险发生，团队已经想出了解决方案。\n\
  \n#### 风险与应对措施的优先级\n\n虽然表 18.1 中的风险登记项是足够的，但在包含了一些优先级排序后，风险登记表的有效性会提高。在表 18.2 中，我们扩展了之前的登记表，并对不同的风险和解决方案添加了一些权重。\n\
  \n**表 18.2.** 典型风险登记项\n\n|  ||  ||  |\n| --- | --- | --- | --- |\n| 风险编号 || 识别出的风险\
  \ || 影响 || 可能的解决方案（按偏好排序） |\n| 1.1 | 网络连接中断 | 高 | ■ 与互联网服务提供商 (ISP) 签订冗余网络连接合同 ■\
  \ 购买移动路由器硬件和 EVDO 卡 ■ 区域内有免费 Wi-Fi 的当地咖啡馆 ■ 将全体员工迁至 Mountain View |\n| 1.2 | 网络连接下降\
  \ | 中 | ■ 排查内部网络 联系 ISP 下降 ■ 减少关键系统的带宽使用 |\n\n风险登记表越大，团队应对未来事件的机会就越大。上述登记表示例可以根据组织的需要进行扩展。当渗透测试团队成员在项目之间发生变化时（例如在项目制组织中），风险登记表的另一个优势就显而易见了。通过拥有风险登记表，团队的新成员可以根据之前的工作做出决策。\n\
  \n\n\n\n\n# 知识数据库\n\n知识数据库用于保留渗透测试团队执行的所有项目的历史数据以及最终结果。该数据库应包含常见问题（如缩写词、协议和最佳实践）、已知问题（漏洞数据、易受攻击系统）以及解决方案（利用脚本、配置错误发现）。\n\
  \n## 创建知识数据库\n\n知识数据库主要是为了渗透测试工程师的利益，它将以自由流注释的形式存在，类似于表 18.3 中所示的内容。数据应存储在数据库中并具有可搜索性，以便工程师能够快速找到与查询相关的所有引用。然而，我们需要对输入的数据保持谨慎——在向数据库添加任何内容之前需要考虑机密性。我们将在本章后的“发现结果的脱敏”部分对此进行更详细的介绍。\n\
  \n**表 18.3.** 知识数据库条目  \n\n|  ||  |\n| --- | --- |\n| 知识类型 || 数据 |\n| 漏洞利用 || 要利用\
  \ Webmin 任意文件任意漏洞：1\\. 从 [`milw0rm.org/exploits/2017`](http://milw0rm.org/exploits/2017)\
  \ 下载 Perl 脚本 2\\. 将文件保存为 `webmin_exploit.pl` 3\\. 使用以下命令更改 `webmin_exploit.pl` 文件的权限：`chmod\
  \ +x webmin.pl` 4\\. 使用以下命令启动 webmin 利用：`webmin_exploit.pl <url> <port> <filename>\
  \ <target>` |\n\n知识库可以包含任何对未来渗透测试项目可能有益的数据。然而，随着时间的推移，数据库可能会变得很大。只要输入知识数据库的数据能提供某些收益，这并不一定是坏事。为了防止工程师向数据库中输入无意义的数据，对所有提交进行同行评审有助于识别哪些内容属于数据库，哪些内容应该被丢弃。\n\
  \n**工具与陷阱……** \n\n# 要求知识数据库条目\n\n许多维护知识数据库的组织要求工程师为每个项目生成条目。要求员工输入数据有一些缺点——无价值的条目。为了达到配额，工程师可能会输入实际上并不属于这里的有效数据。我见过的最糟糕例子是一个关于“如何开启我的电脑”的条目。了解这些信息固然好，但真的属于数据库吗？！\n\
  \n## 发现结果的脱敏\n\n添加到知识库中的信息不应包含敏感信息，包括互联网协议（IP）地址。随着时间的推移，知识库可能会被公司内部其他部门或组织使用；通过在输入数据库之前对数据进行脱敏可以避免隐私问题。\n\
  \n**警告** 即使没有打算让风险清单离开渗透测试团队，也始终存在未经授权访问的风险。风险清单中真的没有包含敏感数据，特别是如果目标是在未来的任务中保持灵活性——在与不同客户的项目中，了解旧的\
  \ IP 地址和用户名可能是毫无用处。对于知识数据库条目的匿名化也有一些支持论点。由于条目在输入数据库之前经过了同行评审，它们已经通过了准确性审查。然而，某些工程师可能可能会于向注册表中添加信息，担心对其添加内容的同行评审或未来的编辑会被批评。允许匿名输入数据的想法是这将为数据库添加更多更有价值的信息。在实践中，输入信息的工程师匿名化产生的问题多于其收益。在小型项目中，每个人都知道任务是如何分配给工程师的，因此尽管匿名，每个人也都能识别出是谁写了哪些条目。另一个问题是，如果以后其他工程师有疑问，没有办法找到输入数据的工程师进行跟进。有一种观点认为，当工程师知道他们的条目会被其他人看到时，他们可能会投入更多精力准备数据。对知识数据库中的客户信息进行脱敏是开发知识数据库的重要步骤，但对员工数据的脱敏并没有那么有益。\n\
  \n## 项目管理知识数据库\n\n工程师并不是唯一能从知识库中受益的人。尽管风险清单是改进整个项目的关键工具，但*项目管理知识数据库*可以帮助提高项目经理的技能和响应时间，特别是渗透测试团队使用不同的项目经理时。项目管理知识库可能包含以下内容：\n\
  - 公司内部的联系人\n- 客户组织的联系人\n- 资源供应商\n- 领域专家列表\n- 过去的团队成员列表\n- 合同\n- 工作说明（SOW）\n- 项目模板\n\
  \n上述列表主要由联系信息组成。虽然相同的信息可以保存在通讯录中，但项目管理数据库的意义在于它可以扩展到整个公司乃至海外，并且对所有项目经理都有益。能够快速识别出曾与公司合作但可能不熟悉渗透测试项目的供应商，仍然会为渗透团队带来利益。\n\
  \n# 行后回顾\n\n在第 15 章中，我们讨论了同行评审如何提高最终报告的清晰度和准确性。在本章中，我们将讨论类似的评审——项目评估和团队评估。与第 15\
  \ 章](#B9781597494250000245.xhtml#t0020)中的同行评审不同，行后回顾可以作为小组活动或个人活动进行。在所有团队成员参加的会议上进行项目和团队评估的优点是促进知识共享和头脑风暴。然而，参与者可能在对项目和同事进行评价时有所顾虑。要求团队成员匿名提供评估可以增加获得项目执行人员诚实意见的机会。\n\
  \n## 项目评估\n\n项目评估应识别渗透测试项目中良好或需要改进的部分。项目评估的主要目标是为项目经理提供有关渗透测试项目流程的反馈，以及哪些项目阶段需要改进。项目经理感兴趣的话题包括：\n\
  - 调度问题（时间太短、时间太长等）\n- 资源可用性\n- 风险管理\n- 项目范围问题（范围太宽、太窄等）\n- 沟通问题\n\n评估中提供的信息应该证实或挑战项目经理对项目流程的评估观点，并对如何在未来项目中改进项目管理流程提出想法。\n\
  \n## 团队评估\n\n\n\n\n进行团队评估是一项敏感的任务——团队成员通常不喜欢互相进行批评，即使这些批评是具有建设性的。项目经理在向团队展示评估结果时必须非常小心，特别是评估问卷的措辞；评估的整体基调必须是积极的，并传达出评估问卷背后的目的是改进项目团队，而不是为了找错。问卷应包含对每位渗透测试（PenTest）团队成员（包括其自身）以下几个方面的提问：\n\
  \n- 技术优势\n- 技术劣势\n- 在项目每个组件中的投入精力\n- 团队培训想法\n- 时间管理技能\n- 阻碍有效团队的的\n- 对团队生产力的总体评价\n\
  \n**警告** 如果团队评估的危害大于益处，请毫不犹豫地放弃该评估流程。团队评估的结果并不是为了在团队内部传的；相反，项目经理应该利用结果来制定改进未来项目的计划。问卷将对团队成员之间的群体动态提供一些见解，并提供可用于分配未来任务的额外质量指标。培训需求可以得到完善，项目风险也可以被识别。\n\
  \n## 培训建议\n\n通过识别未来项目所需的技能组合并获取渗透测试工程师的反馈，项目经理可以列出一份团队知识差距清单。一旦确定了知识短板，项目经理就可以找到合适的培训计划，在下一个项目开始之前将团队提升到必要的技能水平。如果项目经理成功提升了团队技能，新知识可能有助于获得更多项目。客户经理和营销团队需要了解任何新的技能组合，以便发现额外的业务机会。\n\
  \n### 你被控制了吗？\n\n# 狡猾的工程师\n\n我曾被一个项目中的工程师欺骗过，他们在行动后回顾（AAR）之前合谋，这样他们就会要求相同类型的培训。行动后回顾本应该是匿名的，但团队成员通力合作，对需要什么培训达成了统一的口号。虽然培训请求与未来的项目有些契合，但工程师选择这项特定培训的原因是因为地点和时间——春假期间，在佛罗里达州的奥兰多。他们的想法是想让公司支付他们带孩子去迪士尼乐园的费用的一部分。我想他们当时玩得很开心。如果项目经理过去安排过培训，可以对培训课程进行指标化评估，这些指标应该表明培训公司的课程是否有益。如果之前的培训没有让团队的渗透测试技能得到满意的提高，可以考虑其他资源。选择培训不应仅仅基于精美的传单、口口碑或“酷”因素；项目经理应该根据未来项目的需求定义团队内部的缺陷，并找到一种符合公司业务目标的培训课程。\n\
  \n**提示** 信息安全会议是提高渗透测试团队技能的绝佳方式。许多会议会增加每年演讲的视频，让团队能够从过去的会议中学习。当地活动也可能提供培训机会。请参阅第\
  \ 3 章\n- Black Hat 媒体存档：[`blackhat.com/html/bh-media-archives/bh-multimedia-archives-index.html`](http://blackhat.com/html/bh-media-archives/bh-multimedia-archives-index.html)\n\
  - DefCon 媒体存档：[`defcon.org/html/links/dc-archives.html`](http://defcon.org/html/links/dc-archives.html)\n\
  - SANS 网络研会存档：[www.sans.org/webcasts/archive.php](http://www.sans.org/webcasts/archive.php)\n\
  \n除了正式培训，工程师可以通过跟进信息安全新闻事件和漏洞公告来提高技能。在第 3 章中，我们讨论了不同的邮件列表，包括包含最新漏洞利用讨论的 BugTraq。根据最新新闻，工程师可以尝试理解最新的漏洞利用和技术。\n\
  \n## 总结\n\n使用风险管理登记对于专业的渗透测试项目经理来说非常有益，无论团队规模或项目频率如何。其中某些信息可以用于不同类型的项目，而不仅仅是渗透测试。然而，有些问题是渗透测试特有的——网络中断对建筑现场的影响可能小于对渗透测试的影响。项目经理需要根据情况调整团队的应对措施。知识数据库将帮助工程师比翻旧报告或努力记忆更容易访问历史数据。尽管数据库条目是自由流格式，但通过将条目纳入数据库，可以快速查询相关信息。对进入数据库的所有内容进行审查是一个好主意，可以排除无用信息。行动后回顾可以为项目经理提供额外的指标，用于改进渗透测试团队成员的优缺点和项目流程。确保回顾的整体基调是积极的。利用行动后回顾获得的知识为未来项目制定计划并安排适当的培训。\n\
  \n## 解决方案快速通道\n\n### 风险管理登记\n\n风险管理登记为项目经理提供了一种识别、量化和管理项目风险的方法。\n风险管理登记并不是用来识别客户网络中的风险——那是知识数据库的工作。项目项目经理和渗透测试工程师可以通过脑风暴会议创建一个风险和可能解决方案的登记表。\n\
  \n### 知识数据库\n\n知识数据库用于保留渗透测试团队执行的所有项目的历史数据和最终结果。\n知识数据库主要供渗透测试工程师使用，将以自由流注释的形式存在。\n\
  对所有提交进行同行评审有助于识别哪些内容属于知识数据库，哪些应该应该丢弃。\n\n### 行动后回顾\n\n\n\n\n\n# 团队评估指南\n\n- 要求团队成员匿名提供评估，可以增加从参与项目的人那里获得诚实意见的几率。\n\
  - 项目评估应识别出渗透测试项目中运行良好或需要改进的方面。\n- 团队评估的整体基调必须是积极的，并传达出评估问卷背后的目的是改进项目团队——而不是找错。\n\
  \n**问：** 风险管理注册表条目应该多久重新评估一次？\n**答：** 每当风险变为现实时，项目团队都应该评估事件的结果并相应修改注册表条目。除非有迫切需求，否则在风险发生之前不应重新评估条目。\n\
  \n**问：** 作为处理风险的决策者，我可以选择执行风险注册表中列出的清单之外的其他操作吗？\n**答：** 风险注册表是一份指南，旨在提供在冷静时期开发的选项。由于无法预测未来事件涉及的所有变量，因此可以做出与风险注册表中列目相反的决策。然而，在现实案例中，当经理偏离风险注册表的选项时，经理往往会被要求解释为什么没有遵循建议。\n\
  \n**问：** 知识数据库与互联网上漏洞数据库中的信息有何区别？\n**答：** 知识数据库中与漏洞相关的条目可能与漏洞数据库中发布的常见漏洞披露（`CVE`）信息非常相似。在这种情况下，区别在于知识数据库条目只有在公司或客户网络内发现漏洞时才会创建。此外，知识库中提供的信息将针对实际漏洞进行定制，而不是通用信息。\n\
  \n**问：** 团队成员提交的行动后回顾要求了不合理的培训数额。当他们因为预算限制或与未来项目不匹配而没有获得培训时，团队成员将大部分延迟归咎于缺乏适当的培训。这可以避免吗？\n\
  **答：** 培训资金总是需求巨大而供不应求。如果有一些培训资金，缓解某些投诉的最佳方法是允许工程师在可用培训资金的范围内优先考虑自己的培训。如果资金非常紧张，以至于每年只能一两个人参加，那么就将优先排序定为一个小组项目，让工程师们作为一个团队来选择谁去参加哪些课程——当然，任何参加课程的人都应该回来向团队其他成员教授他们学到的知识。互联网上还有许多免费培训。可以通过这些免费资源来补充培训。\n\
  \n## 扩展你的技能\n\n想了解下一次渗透测试（PenTest）的计划吗？以下练习旨在为你提供额外的知识和技能，以便你更好地理解这个主题。使用你的实验室进行以下练习。\n\
  \n### 创建风险管理注册表\n1. 针对专业渗透测试项目识别五个可能的风险。\n2. 为每个条目提供至少三个可能的解决方案。\n3. 使用`表 18.2`中的示例作为模板，为每个风险创建一个风险注册表条目。\n\
