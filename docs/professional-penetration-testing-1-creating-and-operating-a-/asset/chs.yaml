  \ April 28, 2009) 管理渗透测试团队与管理销售、人力资源、客户服务或营销的人员不同。渗透测试团队的工程师通常是“极客”，正如 Paul Glen\
  \ 在《Leading Geeks》书中解释的那样。Glen 试图通过定义极客来量化管理极客的困难，将极客定义为“高智、通常内向、极具价值、独立思考、难以寻找、难以留的技术人员”(Glen,\
