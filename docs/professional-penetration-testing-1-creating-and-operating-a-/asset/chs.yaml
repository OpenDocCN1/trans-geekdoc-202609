  \n## 执行阶段\n\n如果我们仅仅对 IP 范围进行 `ping` 扫描，我们将会漏掉网络中的至少一个目标。这说明了使用多种工具进行扫描和攻击的必要性。如果你只使用你最喜欢的工具，你无法系统可能会如何反应。为了遵循我自己的建议，我也使用了\
  \ `netdiscover` 工具来寻找网络上的设备，如图 9.32 所示。\n\n识别网络边界不需要做太多工作，但它是任何渗透测试中都至关重要的一步。这一步的主要目标是确保我们没有攻击任何未获得许可攻击的对象。如果你与客户的合同中指明了特定的\
  \ IP 地址，那么事情就会变得简单得多，因为你只需要接触那些系统即可。然而，如果你的工作是对网络进行渗透测试，你需要敏锐地意识到网络中实际上包含什么，以及哪些系统是在范围之外的。此外还要注意，目标系统可能会拦截互联网控制消息协议（`ICMP`）消息以躲避检测。我们将在第\
  \ 10 章中讨论如何使用其他方法检测系统。\n\n\n\n\n在项目的这一阶段，你应该已经分配至少一两个团队成员到项目中，他们能够成功执行信息收集阶段。他们的产出将对这一过程产生严重影响，因为团队成员需要根据目标网络的架构具备相应的技能。这可能基于目标系统使用的操作系统或网络中使用的通信协议。无论如何，他们的发现将要求构成最终团队的工程师具备专门技能，在完成此步骤并彻底识别目标系统之前，团队不应最终确定。\n\
  \n在规划阶段开发的的人员管理计划无疑会指导 `Acquire Project Team` 任务。然而，在此步中还应该发生额外的谈判和收购，以最好地确保项目的成功；如果需要使用虚拟团队，也可以对其进行管理。无论如何，利用信息收集阶段来帮助定义项目团队的最终的人员配置是重要的，而不仅仅仅仅为了满足某些任意的人头数而预先分配成员。如果你无法控制分配给团队的人员（我必须承认，这可能是常态），那么培训员工就成为项目团队开发任务的重要组成部分。自然，如果团队中有人精通目标网络架构涉及的任何技术将是最好的，但如果无法实现，则应该分配时间和资源进行培训。未能提供适当培训可能导致的缺陷是：目标系统或网络中的漏洞被忽视且未被记录。\n\
  \n## 请求卖家响应\n\n如果你经历过那种罕见的时刻，即客户提供的文档与目标网络或系统完全匹配，那么我羡慕你。通常情况下，你认为要进行渗透测试的对象与你在该阶段结束时发现的内容之间存在差异，这要求你返回项目投标和建议书进行修改（或者在最坏的情况下，完全放弃该项目）。如果你有人负责招标过程（在此语境下称为卖家），那么这会让事情变得简单，因为作为项目经理，这部分工作从你手中抽离了出去。然而，通常的情况是项目经理被迫直接参与这一过程，因为他们本应该是对继续该项目所涉及的成本有更好理解的人。这不应是这样，但这就是现实。\n\
  \n无论如何，渗透测试此阶段的发现与项目状态（是按原计划进行、修改、放弃还是重新调整优先级）之间应该存在相关性。如果该项目完全局限在组织内部，成本仍然是一个因素，信息收集阶段将帮助定义这些成本。如果成本预算受到限制，此阶段最可能只会影响项目的优先顺序排序。\n\
  \n## 监控和控制过程\n\n如前所述，监控和控制过程是一个持续的过程，涵盖项目的所有其他阶段。在信息收集阶段，相关性最大的项目管理过程是 `Scope Verification`、`Scope\
  \ Control`、`Schedule Control` 和 `Cost Control`。这并不意味着其他过程（如 `Manage Project Team`、`Manage\
  \ Stakeholders`、`Performance Reporting` 等是不重要的——只是这四个过程在渗透测试的这一阶段影响最大，也是我们在本章中将讨论的内容。\n\
  \n### 范围验证\n\n在渗透测试信息收集阶段结束时，项目经理应该能够对项目的未来表现 `request changes` 并 `recommend corrective\
  \ actions`。根据此阶段的发现，对项目范围的变更请求可能是相当重大的，特别是当目标系统或网络比客户最初呈现的要复杂或多样得多时。根据 PMBOK，`Scope\
  \ Verification` 的唯一推荐工具是 `Inspection`。这可能涉及评审和审计，这些方法往往是最有效的。范围验证中评审的关键在于包含领域专家。\n\
  \n### 范围控制\n\n在此阶段，范围蔓延是一个真实的威胁，可能会对项目的整体成功产生负面影响。在信息收集阶段结束时，会有额外的区域可以纳入渗透测试项目中。使用\
  \ `Integrated Change Control` 过程进行适当的变更管理可能是控制此类项目范围蔓延的最佳方式。范围变更是否必要或合适显然涉及相关利益相关者的大量投入，但如果是在\
  \ `Integrated Change Control` 过程的背景下进行的，成本可以得到更好的控制，对范围的任何影响也可以更有效地进行沟通。\n\n###\
  \ 进度控制\n\n希望在信息收集阶段结束时，你不需要对项目进度表进行任何更改。人员配置肯定会有一些调整，但只有当预期内容与目标网络中实际存在的内容存在显著差异，且范围经过了修改以反映这些差异时，项目时间线本身才会发生变化。如果进度缺乏活性，可以实施几种可选方案：更改人员配置、修改范围或压缩\
  \ `WBS`。遗憾的是，当时间线无法修改时，受影响的通常是 `WBS`。这在渗透测试中通常是最糟糕的选项，因为 `WBS` 的收缩通常意味着增加额外任务并夺取其他任务的时间来补偿。最终结果是所有任务的执行效率都低于最佳水平。正如本书前面提到的，识别漏洞和创建破坏系统的利用程序通常非常耗费时间，因为大多数攻利用手段并不总是随手可得。作为处理渗透测试项目的项目经理，在修改\
  \ `WBS` 之前，修改范围或人员配置通常对项目的成功更有利。\n\n### 成本控制\n\n\n\n\n\n项目的任何变动几乎不可避免地会带来成本的变化。在项目经理调整了所有其他过程输出（如进度、人员配置等）之后，必须实施成本控制。成本控制的大部分是对变更控制的妥管理，特别是这些控制措施的沟通。如果利益相关者敏锐地意识到任何变更相关的成本，成本控制将更容易管理。对于从事渗透测试项目的项目经理来说，最好的工具是预测。预测中最具实用的公式是“基于典型差异的完工估计\
  \ (ETC)”，适用于变化在整个项目或未来项目中保持一致的情况。ETC 是完成所有剩余工作所需的金额，这意味着项目的总成本是 ETC 加上已花费的资金。基于典型差异确定\
  \ ETC 的公式为 `![B9781597494250000142/si1.gif is missing](img/si1.gif)`，其中 `ETC`=完工估算；`BAC`=完成预算；`EV`=挣值值；`CPI`=成本绩效指数=`EV/AC`；`AC`=实际成本。完成预算\
  \ (`BAC`) 是计划内工作的总预算成本，可以指项目的任何部分。在管理渗透测试项目时，计算 `BAC` 的最佳方法是使用整个项目的预算成本，包括与后续活动相关的成本。挣值\
  \ (`EV`) 是项目上已完成工作的预算金额。在信息收集阶段，该金额将远小于后期阶段。我们公式的最后一个组件是成本绩效指数 (`CPI`)，它是一个指示项目目前是超预算还是在预算内的比率，通过将\
  \ `EV` 除以实际成本 (`AC`) 计算得出。让我们来看一个实际示例。假设原始预算估算为 4 周内花费 50,000 美元。然而，在信息收集阶段结束时，我们确定还有额外的系统，这会增加工程师的总工作量，并迫使项目延长\
  \ 1 周。为了达到项目的这一阶段，假设我们已经花费了总预算的 20%，即 10,000 美元。但由于我们现在落后了一周，我们的 `EV` 将少于已经花费的 10,000\
  \ 美元。由于进度增加了 25%，我们可以进行快速分析，并简单地说我们的 `EV` 减少了 25%，得出 `EV` 为 7,500 美元（你可以花更多时间计算以获得更精确的结果，但为了这个例子让我们保持简单）。要确定\
  \ `ETC`，我们将所有值代入上述公式，得到如下：`![B9781597494250000142/si2.gif is missing](img/si2.gif)`\
  \ 根据此公式，我们知道还需要额外的 16,000 美元和变更才能完成项目（因为我们只剩下 40,000 美元），或者说总预算增加了 33%。将此信息传递给利益相关者应该允许他们决定是否坚持执行。\n\
  \n## 总结\n我们已经回顾了收集目标信息的许多不同方法，包括被动攻击和主动攻击。我引用了在此阶段使用的许多不同的网站。然而，你应该从这一节中获得的不应该是去哪些网站，而是你可以在不接触目标网络的情况下在线收集到什么类型的信息。通过使用普通公众可以使用的资源，可以在不向目标网络发送任何数据包的情况下，构建出你目标的清晰画像。记住，这些信息可以在不连接目标网络的情况下收集，但可能最重要的的一点是，你收集的信息可能并非公开领域。\n\
  \n## 解决方案快速通道\n\n## 被动信息收集\n- 信息从目标网络之外的源收集，主要来自互联网。\n- 此阶段收集的信息可能不是公共领域——要像处理限制材料一样处理所有信息。\n\
  - 注意你正在连接的系统——除非防火墙规则或应用程序配置为阻止来自目标网络的通信，否则可能会无意连接到目标网络。\n- 最新数据并不总是最有信息的——尽可能使用存档资源以查看目标多年来的变化。\n\
  \n## 主动信息收集\n- 明确目标边界，并仅与获得明确许可的系统进行通信。\n- 始终使用至少两个不同的工具来验证收集的信息。\n\n\n\n\n\n##\
  \ QA 方法\n在渗透测试的阶段，最有效的 QA 方法是因果图，也称为石川图（Ishikawa diagram）。\n\n- 利用信息收集阶段来帮助定义项目团队的最终人员配置。\n\
  - 范围蔓延（Scope creep）在此阶段可能成为问题，对项目的整体成功产生负面影响。\n\n**问**: 我什么时候知道自己已经拥有了足够的信息？\n**答**:\
  \ 在进入渗透测试的后续阶段之前，你永远无法获得所需的所有信息。根据后期的发现而返回此阶段收集额外信息，这并不罕见。当你充分了解目标网络并可以开始 `Vulnerability\
  \ Identification`（漏洞识别）阶段时，即可继续进行。\n\n**问**: 我如何找到包含员工和/或公司评论的 Web 群组？\n**答**: 最简单的方法是搜索电子邮件地址——工程师通常会在帖子中发布他们的电子邮件地址，特别是在论坛中。这有助于更快的响应。然而，请注意，电子邮件地址可能会被修改，以规避专门为收集电子邮件用于发送垃圾邮件而设计的网络爬虫软件。例如，如果公司的域名是\
  \ [example.com](http://example.com)，你可能需要搜索“example dot com”甚至更复杂的词组。\n\n**问**:\
  \ 我在任何存档网站上都找不到关于目标的信息。为什么？\n**答**: [Google.com](http://google.com) 和 [Archive.org](http://Archive.org)\
  \ 有一项政策，允许数据所有者请求将其数据从任何存档过程中删除。原因可能是出于法律需要，以防止混淆或保护自己不受利用这些网站收集信息进行恶意攻击的黑客。\n\n\
  **问**: 我对自己进行了一些信息收集，对发现的结果感到震惊。我如何让这些信息从互联网上删除？\n**答**: 某些材料必须是公开信息，特别是许多政府记录。\n\
  \n**问**: 防止范围蔓延的最佳方法是什么？\n**答**: Best 方法是确保在渗透测试中定义范围。\n\n## 扩展你的技能\n想了解信息收集吗？以下练习旨在为你提供额外的知识。请为此练习选择一家大型公司。\n\
  \n## 使用信息收集研究公司的 Web 存在\n1. 使用 `whois` 应用获取你的目标域的网络信息。\n2. 使用 [OpenDNS.com](http://OpenDNS.com)，通过\
  \ `dig` 和 `nslookup` 对你的目标网络进行扫描。\n3. 识别与目标域名相关的 IP 地址。它们是相同的，还是位于不同的服务器上？\n4. 根据公司网站，联系信息是什么？你使用了哪个网站？\n\
  5. 识别公司高管。你使用了哪个网站？\n6. 列出你找到的所有电子邮件地址。\n\n## 研究公司记录\n1. 查询你所选公司的 SEC 备案网站（[www.sec.gov/edgar.shtml](http://www.sec.gov/edgar.shtml)）。识别最新文件中公司官员的姓名。\n\
  2. 识别公司注册地所在的州。访问该州的业务网站，并尽可能记录尽可能多的信息，包括联系信息。这与在 `Exercise 9.1` 中找到的信息一致吗？如果不一致，请解释其差异。\n\
  \n## 探索员工网站\n1. 访问社交网站，如 Facebook 和 LinkedIn（领英），并列出与你所选公司相关的任何群组。\n2. 识别作为社交网络成员的公司高管。\n\
  3. 识别小组内的工程师，并列出他们的硬件或软件认证。\n4. 选择小组内几个最活跃的工程师并搜索他们的个人网站。是否有任何信息有助于你理解你所选公司的网络？\n\
  \n## 识别公司物理设施信息\n1. 使用在 `Exercise 9.1` 中收集的位置信息，查询 Google 地图。如果有街景视图，你能识别周围的建筑或结构吗？\n\
  2. 识别一个针对你所选公司进行无线攻击或监视的潜在地点。\n\n## 执行网络监控\n1. 对你的目标域名执行 `traceroute`。识别由目标公司拥有的任何网络设备。\n\
  \n\n\n\n\n因果报应。—— 俄罗斯谚语：意为“以眼还眼”。(Mertvago, 1995) 在本章中，我们将对距离比信息收集阶段更近的系统进行检查；在渗透测试的上一个阶段，我们从互联网源收集了关于操作系统（`OSes`）、网协议（`IP`）地址、应用程序数据等信息。在漏洞识别阶段，我们将使用这些信息来构建探测，并直接与目标通信，意在识别潜在的威胁和漏洞。\n\
  \n为了了解目标系统中存在哪些类型的漏洞，我们需要了解 `OS` 的细节、服务器上可用的服务以及应用程序版本信息。一旦获取了这些数据，我们就可以查询国家漏洞数据库，以确定目标系统是否可能受到攻击。在此阶段，我们不进行任何漏洞利用（exploits）；那将在下一章进行。现在，我们只是对系统进行审计，查看可能存在哪些风险，而不是证明它们的存在。我们还探索了收集系统信息的不同技术：特别是主动扫描和被动扫描。被动扫描允许渗透测试工程师规避检测，而主动扫描能更快地提供更深层次的信息。我们经常遇到的障碍是防火墙，它们可能会过滤我们的探测。我们将通过操纵网络数据包如何在防火墙存在的情况下检测服务。我们将详细检查传输控制协议（`TCP`）和互联网控制消息协议（`ICMP`），以准确理解我们正在使用什么类型的网络流量来检测系统，以及如何修改它们以规避防火墙限制。\n\
  \n## 端口扫描\n\n当我们进行端口扫描时，有两个目标：1) 验证目标系统是否存在；2) 获取接受连接的通信通道（端口）列表。之后我们将尝试识别通信通道上运行哪些应用程序，但现在我们只是想枚举哪些端口是开放的。在本节中，我们将使用几种不同的工具，但不要假设列出的工具是端口扫描和枚举的唯一选择。BackTrack\
  \ 磁盘包含许多能够进行端口扫描和系统枚举的工具。此外，`www.sectools.org/app-scanners.html` 也列出了与端口扫描相关的流行黑客工具。\n\
  \n## 工具与陷阱……\n\n## 你的对手\n\n记住，负责维护和保护渗透测试目标的网络工程师应该设计他们的网络并加固系统，使得渗透测试的这一阶段对你来说非常困难；你需要尝试尽可能多的测试来从网络中骗取信息。面对一个真正才华横溢的网络工程师，你无法获得一切，但你可能获得足够的信息。虽然我们不会深入探讨端口和通信协议的概念，但不仅理解协议结构，理解工具如何使用（或滥用）协议与目标通信也是至关重要的。我们讨论了不同的扫描技术和协议，以判断系统是否可用以及系统是如何进行通信的。我们在信息收集阶段的工作可能让我们对目标网络内的系统、应用程序和\
  \ `OSes` 有了了解；然而，我们需要更深入地挖掘。此阶段的第一步通常涉及扫描网络以识别所有可用系统。对于本章，我们直接开始扫描特定目标，而不是检查整个网络。我们最终通过被动扫描技术识别网络上的所有系统，但本章的真正目的是定位潜在的漏洞。\n\
  \n## 目标验证\n\n在开始扫描系统上的所有开放端口之前，从验证目标存在性的任务开始通常是明智的。有几种方法可以做到，包括使用 `TCP` 和用户数据报协议（`UDP`）。然而，我们验证目标的首次尝试将是使用\
  \ `PING` 命令，它使用了 `ICMP`。`ICMP` 定义在 `RFC 792` 中，提供了网络和系统信息，包括遇到任何错误的详细信息。`ICMP` 通信发生在\
  \ `TCP/IP` 模型的互联网层，或者开放系统互连（`OSI`）参考模型的网络层。\n\n**注意**：虽然我们不会涉及 `TCP/IP` 和 `OSI`\
  \ 参考模型的任何细节，但我们将在书中大量引用两者。`TCP/IP` 的信息可以在 `RFC 1180` 中找到，地址为 `www.ietf.org/rfc/rfc1180.txt`。`OSI`\
  \ 参考模型在 `ISO/IEC 7498-1:1994` 中解释，位于站点：`http://standards.iso.org/ittf/PubliclyAvailableStandards/index.html`\n\
  \n### 主动扫描\n\n为了我们，我们在 `ICMP` 中使用两种消息来判断目标是否存活：回请求（Echo Request）和应答回（Echo Reply）。`ICMP`\
  \ 回请求或应答消息的示例可见图 10.1。\n\n| ![B9781597494250000154/f10-01.jpg is missing](img/f10-01.jpg)\
  \ |\n| --- |\n| 图 10.1. |\n| ICMP 消息头 |\n\n来自我们攻击系统的初始请求将把 `Type` 字段设置为“8”，并将数据报发送到目标系统。如果目标系统配置为响应回请求，则目标将使用\
  \ `Type` 字段中的值“0”返回数据报。系统可能被配置为忽略 `ICMP` 请求，以针对恶意用户的随机扫描提供一些保护，因此结果并不总是准确的。\n\n\
  **注意**：`Identifier`（标识符）和 `Sequence Number`（序列号）可能会变为其他字段，取决于 `ICMP` 消息类型。为了更好地理解\
  \ `ICMP` 消息，可以在 `www.ietf.org/rfc/rfc792.txt` 获取最新版本。为了方便，DVD 随附的 Hackerdemia LiveCD\
  \ 中包含了一个 `RFC` 副本。成功 ping 请求的示例可见图 10.2。我们看到向目标发送了三次 64 字节的数据，每次目标都回复了。还提供了额外信息，包括从目标处获得答复花费了多长时间。作为顺便说明，Linux\
  \ 和 Windows 处理 ping 请求略有不同；最大的区别之一是 Windows 会告诉我们数据包丢失，而 Linux 在我们取消请求之前不会。另一个区别是\
  \ Linux 会一直 ping 直到主动终止——我们使用 Linux 仅收到三个 ping 数据包是因为我在那个点停止了它。\n\n| ![B9781597494250000154/f10-02.jpg\
  \ is missing](img/f10-02.jpg) |\n| --- |\n| 图 10.2. |\n| 成功的 ping 请求 |\n\n延迟信息对于调整攻击速度有用，但对于验证目标的可用性没有太大帮助。让我们看看图\
  \ 10.3，其中我们向另一个目标（De-ICE 1.100 磁盘）发送另一个 ping，但这次目标系统拦截了所有的 `ICMP` 流量。图 10.3 显示向目标系统发送了\
  \ 24 个数据包，且没有收到任何回应答。\n\n\n\n\n\n如果我们仅仅依赖 ICMP 来确认系统的存在，我们将会错过这个特定的服务器。因为 `192.168.1.100`\
  \ 可能禁用了 ICMP 消息，所以我们应该始终使用备用工具来验证我们的发现。我们在本书中将广泛使用的一种工具是 Nmap 端口扫描器。Nmap 是“Network\
  \ Mapper”（网络映射器）的缩写，是一个从 [www.nmap.org](http://www.nmap.org) 获取的开源项目。如果我们没有连接到包含目标系统的网段，我们可以使用\
  \ Nmap 来尝试探测我们的目标。图 10.4 显示了 Nmap Ping 扫描（`-sP`）的结果。\n\n| ![B9781597494250000154/f10-04.jpg\
  \ is missing](img/f10-04.jpg) |\n| --- |\n| 图 10.4. |\n| Nmap Ping 扫描 |\n\n我们看到\
  \ Nmap 能够检测到我们的目标，尽管我们之前的 ICMP 回显请求没有成功。区别在哪里？事实证明，Nmap ping 扫描发送了两个数据报文——一个 ICMP\
  \ 回显请求和一个 TCP ACK 数据包。如果我们捕获了目标和攻击系统之间的数据包，我们会发现 ICMP 回显请求没有产生任何回复，而 TCP ACK 数据包成功地诱导我们的目标揭示其存在。理解我们在渗透测试期间使用的工具内部实际上发生了什么是非常重要的。`Ping\
  \ scan`（Ping 扫描）这个术语某种是不错误的，考虑到扫描中还发送了 TCP 数据包。虽然这个技术细节看起来可能微不足道，但要注意，目标系统实际上并没有对\
  \ ping 请求做出响应，尽管 Nmap 暗示了如此，并且在任何报告中都应该被识别。\n\n**警告** 本书中的示例假设你以“root”（对于 UNIX/Linux\
  \ 系统）或“administrator”（对于 Microsoft Windows 系统）身份进行攻击。如果以普通用户身份进行，结果可能会有巨大差异或失败。如果我们想进行网络扫描，我们会相应地修改\
  \ Nmap 扫描请求。如果我们想使用 Nmap ping 扫描识别网络内的所有系统，我们的命令将是 `nmap –sP 192.168.1.1-255` 或\
  \ `nmap –sP 192.168.1.0/24`。指定 Nmap 应该扫描哪些目标非常有灵活性，这在 Nmap 文档中有详细介绍。\n\n### 被动扫描\n\
  \n当我们与目标处于同一个网段或在数据包路径上时，我们可以监听网络杂音来检测系统。优点是我们不需要发送任何数据包，这使得我们的意图变得不那么明显。图 10.5\
  \ 显示了我的实验室网络上的流量结果。正如我们看到的，`192.168.1.100` 是存活的并在网段内进行通信，这使得在 图 10.3 中获得的结果无效。\n\
  \n| ![B9781597494250000154/f10-05.jpg is missing](img/f10-05.jpg) |\n| --- |\n|\
  \ 图 10.5. |\n| 被动网络嗅探 |\n\n一旦我们确定系统是存活的，就可以进行下一步，发现目标上的哪些端口开启、关闭或被过滤。\n\n## UDP\
  \ 扫描\n\nUDP 扫描有很多缺点；与 TCP 扫描相比它很慢，而且大多数可利用的应用程序使用 TCP。此外，只有当传入的数据包匹配预期的协议时，UDP 服务才会响应连接请求；任何\
  \ UDP 扫描都必须后续连接尝试。尽管有缺点，UDP 扫描是目标验证和理解目标网络的重要组成部分。UDP 扫描返回四种可能的结果：\n- `Open`：UDP\
  \ 扫描确认了活跃 UDP 端口的存在。\n- `Open/filtered`：未收到来自 UDP 扫描的响应。\n- `Closed`：返回了 ICMP “port\
  \ unreachable”（端口不可达）响应。\n- `Filtered`：返回了“port unreachable”之外的 ICMP 响应。\n\n当从 UDP\
  \ 扫描获得开启或关闭的响应时，我们可以假设目标系统是存活的，我们可以直接与其通信（在多大程度上仍待定）。根据经验，防火墙规则通常是为了防止 TCP 攻击而编写的；UDP\
  \ 扫描并不是大多数防火墙管理员考虑范围，因此不会进行过滤。如果我们的初始 TCP 扫描没有找到目标系统，我们可以使用 UDP 扫描作为后续检测方法。当我们收到\
  \ open/filtered 或 filtered 响应时，很有可能是防火墙或入侵防御系统正在拦截我们的探测。遗憾的是，系统也可以被配置为忽略 UDP 连接请求。当我们收到指示正在进行过滤的结果时，我们需要根据情况调整我们的攻击，即使用下文讨论的各种边界规避扫描。\n\
  \n## TCP 扫描\n\n从渗透测试的角度来看，大多数有趣的应用程序都使用 TCP 进行跨网络通信，包括 Web 服务器、文件传输应用程序和数据库。有几种不同的工具可以用来确定状态，但对于本节我们将使用两种工具：`Nmap`\
  \ 和 `netcat`。理解 TCP 头部中的字段（如图 10.6 所示）将有助于我们在进行某些更高级扫描时。特别感兴趣的是控制位 `URG`、`ACK`、`PSH`、`RST`、`SYN`\
  \ 和 `FIN`。这些控制位用于系统之间的连接。\n\n| ![B9781597494250000154/f10-06.jpg is missing](img/f10-06.jpg)\
  \ |\n| --- |\n| 图 10.6. |\n| TCP 头部格式 |\n\n我们识别端口的尝试将使用 `netcat`。在图 10.7 中，我们探测\
  \ `192.168.1.100` 以获取端口列表。为了简单起见，我们只扫描了 20 到 25 端口，并发现三个端口是开启的：`21`、`22` 和 `25`。尽管\
  \ `netcat` 为我们提供了关于端口应用程序的建议，但我们不能相信 `netcat` 的，因为它没有发送任何数据。\n\n| ![B9781597494250000154/f10-07.jpg](img/f10-07.jpg)\
  \ |\n| --- |\n| 图 10.7. |\n| 使用 Netcat 进行端口扫描 |\n\n当我们对一个不同的目标运行 `Nmap` 时，如图 10.8\
  \ 所示，我们获得了一个端口列表和怀疑的应用程序。遗憾的是，`Nmap` 在端口 `10000` 上识别出的服务是错误的。我们将在本章的“标志抓取（Banner\
  \ Grabbing）”部分之后确认这一点，但这说明了用不同工具验证我们发现的必要性。此 Nmap 扫描中的应用程序列表也只是最好的猜测，并没有验证应用程序本身的任何信息。\n\
  \n| ![B9781597494250000154/f10-08.jpg is missing](img/f10-08.jpg) |\n| --- |\n|\
  \ 图 10.8. |\n| 对 pWnOS 服务器进行 Nmap 扫描 |\n\n我们的扫描是非常基础的扫描，没有很好地利用 `Nmap` 的优势。在图 10.8\
  \ 中进行的扫描确实为我们提供了一个快速查看系统，但对于目标上真正有什么并没有提供太多保证。默认扫描只是向目标系统发送一个 TCP 连接请求并查看是否有响应——它没有完成\
  \ TCP 三次握手。让我们看看使用 `Nmap` 的一些替代扫描技术。\n\n### TCP 连接扫描 (-sT)\n\n\n\n\n\nTCP 连接扫描（TCP\
  \ connect scan）是确定端口活动最可靠的方法，它会执行完整的 TCP 三次握手，如图 10.9 所示。TCP 连接扫描的缺点是，确认应用程序是否存在所需的流量要大得多，并且可能会被入侵检测系统（IDS）注意到。它的优点是，在\
  \ TCP 连接扫描之后，我们能够确定确定某个应用程序是否真的存在。\n\n| ![B9781597494250000154/f10-09.jpg is missing](img/f10-09.jpg)\
  \ |\n| --- |\n| 图 10.9. |\n| TCP 三次握手 |\n\n### TCP SYN 隐形扫描 (-sS)\n\nTCP SYN 隐形扫描是\
  \ Nmap 的默认扫描方式，我们在图 10.8 中进行了演示。与 TCP 连接扫描不同，SYN 隐形扫描创建了一个半开连接，如图 10.10 所示。在接收到目标服务器的\
  \ SYN/ACK 后，攻击系统简单地通过 RST 关闭连接。这种攻击的优点在于通过不完成三次握手，减少了流过目标服务器网络的流量。虽然这*可能*有助于规避 IDS，但真正的优势是提高了对大量目标进行扫描的速度。\n\
  \n| ![B9781597494250000154/f10-10.jpg is missing](img/f10-10.jpg) |\n| --- |\n|\
  \ 图 10.10. |\n| TCP SYN 扫描 |\n\nTCP 连接扫描和 SYN 扫描在大多数扫描中都将被证明是有用的。如果攻击系统和目标系统之间存在防火墙，则必须考虑额外的攻击方法来检测系统及其应用程序的存在。\n\
  \n## 边界规避扫描\n\n在扫描系统或网络网段时，Nmap 有许多不同的选项可以使用；其中某些选项旨在规避防火墙，这正是前面提到的控制位发挥用场的地方。在\
  \ Nmap 扫描器中激活不同控制位的扫描类型如下：\n\n-   **ACK 扫描 (-sA)**：这会开启 ACK 位。这种扫描将向目标系统发送一个 ACK，希望防火墙会假设攻击者与目标系统之间已经存在一个通信通道。\n\
  -   **Fin 扫描 (-sF)**：这种扫描开启 FIN 位，该位本应出现在有状态 TCP 会话的结束时。向目标系统发送一个 FIN，希望防火墙会假设攻击者与目标系统之间已经存在一个通信通道。无状态防火墙通常只过滤\
  \ SYN 数据包，因此无关的 FIN 可能会被忽略。\n-   **空包扫描 (-sN)**：“空（Null）”攻击是指发送 TCP 数据包时将所有控制位设置为零。将数据包发送到目标系统，希望某些东西会对数据包产生反应——最好是目标系统。无状态防火墙通常只过滤\
  \ SYN 数据包，因此这个空包可能会被忽略。\n-   **圣诞树扫描 (-sX)**：圣诞树攻击是开启 TCP 数据包中每一个标志位（flag）的攻击。由于激活所有控制位的数据包在\
  \ TCP 协议没有任何意义，无状态防火墙可能会允许攻击通过，因为它们通常只过滤 SYN 数据包，并且可能没有寻找这种类型的异常。这四种扫描都用于检测处于激活的系统和协议，但它们是通过不符合标准通信实践的方式操纵\
  \ TCP 协议来实现的。\n\n### 空包扫描攻击 (-sN)\n\n图 10.11 列出了对 pWnOS 磁盘进行空包扫描的结果。结果显示的端口与图 10.8\
  \ 中发现的相同，但区别在于——`Nmap` 并不知道端口是开放的还是被过滤的。\n\n| ![B9781597494250000154/f10-11.jpg\
  \ is missing](img/f10-11.jpg) |\n| --- |\n| 图 10.11. |\n| 使用 Nmap 进行空包扫描 |\n\n根据\
  \ RFC 793，如果端口实际上已关闭，则应返回 TCP 重置（`RST`）请求；如果端口被过滤，系统应返回 ICMP 不可到达。在这种情况下，由于既没有收到\
  \ `RST` 也没有收到 `ICMP` 消息，数据包必须被系统或防火墙过滤或丢弃。如果是目标系统丢弃了它，这意味着运行在端口上的应用程序接收了它并忽略了它。如果是防火墙过滤了它，我们真的不知道系统是否存活，或者应该尝试额外的扫描来看看是否能获得关于端口的更好的状况。\n\
  \n### ACK 扫描 (-sA)\n\n图 10.12 显示了对目标系统进行 ACK 扫描的的流量。我们可以看到攻击系统（192.168.1.113）发送了一系列带有\
  \ `ACK` 的 TCP 数据包。目标系统返回了 `RST`，因为 `ACK` 是不预期的。\n\n| ![B9781597494250000154/f10-12.jpg\
  \ is missing](img/f10-12.jpg) |\n| --- |\n| 图 10.12. |\n| Wireshark 中的 ACK 扫描 |\n\
  \n如果目标系统向攻击系统返回 `RST`，如图 10.13 所示，`Nmap` 将报告该端口未被过滤。如果 `Nmap` 收到 `ICMP` 回复或没有任何响应，`Nmap`\
  \ 将该端口标记为过滤。`ACK` 扫描对于区分有状态和无状态防火墙是有用的。\n\n| ![B9781597494250000154/f10-13.jpg is\
  \ missing](img/f10-13.jpg) |\n| --- |\n| 图 10.13. |\n| Nmap 扫描 |\n\n图 10.13 显示了当没有防火墙或防火墙是无状态时发生的情况——所有端口都被识别为未过滤。如果我们查看图\
  \ 10.14，我们看到有 1689 个端口被标记为过滤，而 8 个端口被标记为未过滤。当存在过滤和未过滤请求的混合时，如图 10.14 所示，我们知道有状态防火墙正在检查进入网络（或系统）的数据包并丢弃禁止的。\n\
  \n| ![B9781597494250000154/f10-14.jpg is missing](img/f10-14.jpg) |\n| --- |\n|\
  \ 图 10.14. |\n| 针对防火墙系统的 ACK 扫描 |\n\n如果图 10.14 中的目标系统不在有状态防火墙后面，我们的扫描将发现 1697 个未过滤端口。根据这些信息，我们需要调整攻击，对\
  \ `192.168.1.100` 使用额外的防火墙规避技术，但对 `192.168.1.107` 则不需要。\n\n### FIN (-sF) 和 圣诞树 (-sX)\
  \ 扫描\n\n在图 10.15 中，我们可以看到对目标 `192.168.1.100` 进行圣诞树扫描和 FIN 扫描的结果。感兴趣的是两个端口被识别为关闭。这表明在对端口\
  \ 20 和 443 进行扫描时返回了 `RST`。由于我们已经知道 `192.168.1.100` 目标在使用有状态防火墙，因此由于某些配置错误允许至少这两个端口进行不受限制的通信。\n\
  \n| ![B9781597494250000154/f10-15.jpg is missing](img/f10-15.jpg) |\n| --- |\n|\
  \ 图 10.15. |\n| 针对防火墙目标的 Nmap FIN 和圣诞树扫描结果 |\n\n\n\n\n如果防火墙配置正确，过滤所有不属于已建立连接的数据包，那么端口\
  \ 20 和 443 也会被识别为开放/过滤。在专业的渗透测试中，我们可能希望请求防火墙配置，以查看这种疏忽是否是故意的。如果我们无法获取配置，我们需要继续探索\
  \ `192.168.1.100` 上识别出的所有端口，以查看是否存在其他配置错误，或者更好地理解防火墙到底过滤了什么。本节讨论的四种扫描对于识别防火墙后目标系统上的服务非常有用。避免边界防御系统检测网络服务和服务系统的其它方法还涉及操作\
  \ TCP 数据包中的其他字段。`Nmap` 提供了一些修改 TCP 字段的功能（例如 `--badsum`）；但是，更好的工具是使用 `scapy`，它是专门为修改跨网络传输的数据包设计的。\n\
  \n## 系统识别\n\n现在我们已经知道了目标系统上哪些端口是开放的，就可以尝试识别目标的操作系统。大多数应用程序漏洞都是针对特定操作系统编写的（在某些情况下甚至是针对特定语言包），因此，如果我们想识别目标上可能的漏洞，找出操作系统是关重要的。\n\
  \n## 主动操作系统指纹识别\n\n`Nmap` 可以扫描系统并根据各种发现识别操作系统。在图 10.16 中，我们看到了对目标 `192.168.1.100`\
  \ 进行操作系统扫描的结果。`Nmap` 将操作系统识别为 Linux 2.6，并为我们提供了可以使用的版本范围。\n\n| ![B9781597494250000154/f10-16.jpg\
  \ is missing](img/f10-16.jpg) |\n| --- |\n| 图 10.16. |\n| Nmap 操作系统扫描 |\n\n我们可以使用的另一个工具是\
  \ `xprobe2`，它执行与 `Nmap` 类似的任务。在图 10.17 中，当给定命令 `xprobe2 -p tcp:80:open 192.168.1.100`\
  \ 时，我们可以看到使用 `xprobe2` 的部分扫描结果。结果如之前一样确认——目标似乎正在使用 Linux 2.6 版本。\n\n| ![B9781597494250000154/f10-17.jpg\
  \ is missing](img/f10-17.jpg) |\n| --- |\n| 图 10.17. |\n| xprobe2 扫描结果 |\n\n识别主机操作系统的另一种方法是查看在主机本身运行的应用程序。我们将在本章稍后部分看到一个提供操作系统信息的应用程序示例。\n\
  \n## 被动操作系统指纹识别\n\n被动识别目标系统的操作系统需要大量的耐心。被动操作系统指纹识别的目标是隐蔽地捕获包含窗口大小和生存时间（TTL）信息的 TCP\
  \ 数据包，然后通过分析数据包手动猜测操作系统。问题是，对网络的被动攻击有时是困难的——除非目标系统需要直接与攻击系统通信（这使得攻击超出了“被动”的定义），或者攻击系统能够收集跨网络传输的所有数据包，否则没有简单的方法获取所需的数据。\n\
  \n### 你被控制了吗？\n\n# 被动攻击\n\n渗透测试项目期间的被动攻击是避免被网络和系统管理员检测的极佳方法。不幸的是，它也被恶意攻击者广泛使用。为了防御被动攻击，请确保网络是“交换机”网络，确保数据包被正确地引导到正确的系统——而不是发送到网络中的所有系统。如果我们足够幸运能够获取\
  \ TCP 数据包（通过访问路由器或其他系统），我们将看到使用 `p0f` 应用在图 10.18 中显示的结果。\n\n| ![B9781597494250000154/f10-18.jpg\
  \ is missing](img/f10-18.jpg) |\n| --- |\n| 图 10.18. |\n| p0f 扫描 |\n\n我们可以使用的另一种技术是地址解析协议\
  \ (ARP) 毒化，强制目标系统与我们通信。重复上述场景，我们将使用另一个工具——`arpspoof`。在图 10.19 中，我们让 `arpspoof` 向我们的目标（`192.168.1.100`）宣布我们的攻击系统是网络网关（`192.168.1.1`）。我们让\
  \ `arpspoof` 运行直到 `p0f` 确认操作系统；（注：原文中存在大量重复内容，已根据要求进行去重并保留核心逻辑）。\n\n\n\n\n`Warning`\
  \ 一点提醒——应用程序提供的数据可能是不正确的。当软件开发者升级软件时，他们并不总是同步更新横幅（banner）信息。让我们来看看使用 `Telnet` 连接的安全\
  \ Shell (SSH) 服务。在图 10.22 中，我们使用 `Telnet` 连接到端口 `22`。正如我们看到的，目标系统上运行的应用程序告知我们连接到了为\
  \ Debian 操作系统编译的 `SSH` 程序。\n\n| ![B9781597494250000154/f10-22.jpg is missing](img/f10-22.jpg)\
  \ |\n| --- |\n| 图 10.22. |\n| 使用 Telnet 获取横幅 |\n\n## 列举未知服务\n\n由于我们对 `pWnOS` 服务器上端口\
  \ `10000` 和 `445` 运行的服务存有疑问，我们可以尝试手动连接这些端口并查看返回什么类型的信息来识别该服务。在图 10.23 中，我们使用 `netcat`\
  \ 连接到目标。连接后，我们可以发送随机数据（在这种情况下，我们发送了“asdf”并按下 `Return` 键）。服务返回的数据看起来像超文本标记语言（HTML）页面，这意味着端口\
  \ `10000` 上运行着一个超文本传输协议 (`HTTP`) 服务器。\n\n| ![B9781597494250000154/f10-23.jpg is\
  \ missing](img/f10-23.jpg) |\n| --- |\n| 图 10.23. |\n| 使用 Netcat 连接到端口 10000 目标系统\
  \ |\n\n这是一个简单的例子，让我们尝试一些更难的。如果我们对端口 `445` 尝试相同的操作，似乎我们没有收到服务的回复，如图 10.24 所示（图 10.24\
  \ 中看到的所有数据都是为了尝试获取响应而输入的随机数据）。\n\n| ![B9781597494250000154/f10-24.jpg is missing](img/f10-24.jpg)\
  \ |\n| --- |\n| 图 10.24. |\n| 使用 Netcat 连接到端口 445 目标系统 |\n\n如果我们使用 `Wireshark` 捕获图\
  \ 10.24 中的数据包，我们几乎得不到额外的信息。在图 10.25 中，我们可以看到从端口 `445` 返回的数据是两个 `NOP`（无操作）指令。此时此时，我们仍然不知道端口上实际上运行的是什么。\n\
  \n| ![B9781597494250000154/f10-25.jpg is missing](img/f10-25.jpg) |\n| --- |\n|\
  \ 图 10.25. |\n| Netcat 连接到端口 445 目标系统的数据包捕获 |\n\n由于图 10.21 表明该服务器在该端口上运行着 `Samba`，我们可以使用\
  \ `smbclient` 请求与目标系统连接。如果该端口上运行着 `Samba`，我们应该会得到不同的响应。在图 10.26 中，我们看到了使用 `smbclient`\
  \ 请求连接的结果。\n\n| ![B9781597494250000154/f10-26.jpg is missing](img/f10-26.jpg) |\n\
  | --- |\n| 图 10.26. |\n| 使用 smbclient 连接到目标 |\n\n我们收到了来自目标系统的密码请求；如果为密码输入随机数据，我们就会收到一条失败消息。在互联网上稍作搜索后，`NT_STATUS_LOGON_FAILURE`\
  \ 是一个有效的响应。此时，极有可能运行着 `Samba`。\n\n## 漏洞识别\n\n现在我们已经识别了正在运行的服务，让我们在互联网上搜索它们是否存在漏洞。图\
  \ 10.21 表明服务器在该端口上运行 `Samba`，我们可以使用 `smbclient` 请求与目标系统连接。如果该端口上运行着 `Samba`，我们应该能得到响应。图\
  \ 10.23 意味着端口 `10000` 上运行着一个 `HTTP` 服务器。\n\n如果我们对端口 `445` 尝试相同的操作，似乎我们没有收到服务的回复，如图\
  \ 10.24 所示。如果我们使用 `Wireshark` 捕获图 10.24 中的数据包，我们几乎得不到额外的信息。在图 10.25 中，我们可以看到从端口\
  \ `445` 返回的数据是两个 `NOP` 指令。\n\n由于我们对 `pWnOS` 服务器上端口 `10000` 和 `445` 运行的服务存有疑问，我们可以尝试手动连接这些端口并查看返回什么类型的信息来识别该服务。我们使用\
  \ `netcat` 连接到目标。连接后，我们可以发送随机数据。\n\n如果我们只是在进行风险评估而不进行渗透测试，那么我们可能会在此处停止（在对所有可用服务进行了相同类型的调查之后）。识别潜在漏洞可以让我们更好地理解与目标系统相关的风险，尽管我们并未证实这些漏洞。\n\
  \n遗憾的是，我们无法从横幅或网页中识别出版本号。美国国土安全部是维护已知漏洞列表机构之一。可以在 `http://nvd.nist.gov/` 对数据库进行查询。图\
  \ 10.28 列出了 Webmin 内部漏洞的片段。\n\n\n\n\n在本章中，我们开始比上一章（信息收集）更深入地检查我们的目标系统。我们首先通过主动探测和被动网络嗅探，在网络内识别了活跃的目标主机。在有入侵检测设备的网络中，主动探测很容易被检测到；如果需要隐蔽性，则可能需要放慢攻击速度以避免被发现。被动扫描系统的方法需要访问目标系统所在的网段。攻击系统并不总是需要直接位于网络上——被动网络嗅探通常是是从目标网络内某台受感染的服务器上进行的，此时攻击者试图了解内部网络以及存在哪些系统。被动识别系统减少了被发现的机会，因为受感染的系统不会产生额外的网络流量。为了了解目标系统上运行着哪些服务，需要发送探测包。在本章中，我们通过标志抓取（banner\
  \ grabbing）和直接连接端口来识别服务，以便我们可以看到它们如何响应随机数据。在无法确定运行的是什么应用程序的情况下，我们需要尝试不同的工具来诱导响应，例如\
  \ `smbclient`。BackTrack 包含了许多与各种应用程序直接通信的工具，包括 Linux 和 Microsoft Windows 系统上的程序。识别目标系统中潜在漏洞的第三个组件是操作系统。这些数据可以在端口扫描期间收集，也可以被动地收集。在检测到系统、识别出操作系统并验证了可用服务后，我们就可以发现潜在的漏洞。互联网上有许多漏洞数据库，它们提供了关于漏洞本身以及公司和应用程序的详细信息。我们可以利用这些信息帮助客户更好地了解其网络中的风险。下一章——漏洞验证——将利用在渗透测试此阶段收集的信息，对目标系统进行实际攻击。\n\
  \n# 解决方案快速上手指南\n\n## 端口扫描\n- 端口扫描器提供的信息可能是错误的——始终使用两个不同的工具进行端口扫描。\n- 理解工具在扫描期间正在做什么。在扫描期间收集的信息可能表明网络防御系统的存在。\n\
  - 被动扫描技术可以用于隐藏网络中的活动。扫描速度也是被检测的一个因素；放慢扫描速度可以避免被 `IDEs` 注意到，特别是在网络内进行多次扫描时。\n\n##\
  \ 系统识别\n- 漏洞利用程序通常针对特定的操作系统和应用程序设计。\n- 服务可能会在其标志（banners）中提供操作系统信息和应用程序版本。\n\n##\
  \ 服务识别\n- 版本信息将有助于缩小潜在漏洞列表；然而，当发布新补丁时，版本信息并不总是更新。\n- 并非所有应用程序都提供关于自身的信息。可能需要额外的工具来识别目标系统上运行的应用程序。\n\
  \n## 漏洞识别\n- 漏洞数据库可以用于查询与系统应用程序相关的已知漏洞。\n- 每个发布的漏洞都有一个风险排名，可以用于确定渗透测试中攻击的优先级。\n\n\
  **Q:** 我应该以多慢的速度进行扫描以避免触发 `IDEs`？\n**A：** 这完全取决于在 `IDS` 上设置规则的网络管理员。大型企业网络经常被恶意用户扫描，特别是那些直接暴露在互联网上的网络（如\
  \ `DMZ`）。在系统暴露在互联网的情况下，扫描很少需要放慢速度，因为 `IDEs` 往往由于数据量大而完全忽略扫描。内部网络内的扫描则是另一回事。网络管理员可能会配置\
  \ `IDEs` 专门寻找扫描攻击，这将需要更慢的攻击速度。执行攻击的实际速度仅仅是一个猜测，但如果需要，可以放慢到持续几天。\n\n**Q:** 为什么在任何扫描中，操作系统的版本号都不具体？\n\
  **A：** 我们使用的扫描检查的是 `TCP` 栈。当操作系统内核更新时，`TCP` 协议可能会被修改，也可能不会修改。可能多年内网络栈都不会发生更改，这使得我们很难确切知道我们正在查看的是哪个版本的操作系统。\n\
  \n**Q:** 如果服务不提供任何标志信息，并且对任何工具都没有响应（例如 `smbclient` 的示例），可以做什么来确定运行的是什么服务？\n**A：**\
  \ 有一些“模糊测试”程序（在下一章讨论）可以用于查询通信端口。这些程序可能让应用程序做出响应，并对应用程序的用途提供一些见解。另一种技术是通过捕获所有发往目标系统的数据包，拦截并分析进入该端口的所有通信。\n\
  \n## 扩展你的技能\n想了解漏洞识别吗？以下练习旨在为你提供额外的知识。\n\n### 执行 Nmap 扫描\n1. 使用 Hackerdemia LiveCD\
  \ 作为目标，执行以下扫描：`TCP connect scan`、`UDP scan`、`Ping scan`、`RPC scan` 和 `SYN stealth\
  \ scan`。描述结果之间的差异。\n2. 使用 De-ICE100 LiveCD 作为目标，执行以下扫描：`TCP connect scan`、`Null\
  \ scan`、`FIN scan`、`Window scan` 和 `Xmas Tree scan`。描述结果之间的差异。\n3. 使用 `scanme.nmap.com`\
  \ 作为目标，执行以下扫描：`TCP connect scan`、`UDP scan`、`IP Protocol scan` 和 `List scan`。描述结果之间的差异。\n\
  \n### 识别系统信息\n1. 使用 Hackerdemia LiveCD 作为目标，使用 `nmap` 确定操作系统。\n2. 使用 `scanme.nmap.com`\
  \ 作为目标，使用 `nmap` 确定操作系统。\n\n### 识别漏洞\n1. 访问国家漏洞数据库 `http://nvd.nist.gov/`。搜索 Webmin\
  \ 漏洞。\n2. 访问 US-CERT 漏洞网站 `www.kb.cert.org/vuls/`。搜索 Webmin 漏洞。\n3. 访问 SecurityFocus\
  \ 漏洞数据库 `www.securityfocus.com/vulnerabilities`。搜索 Webmin 漏洞。\n4. 访问开源漏洞数据库 `http://osvdb.org/`。搜索\
  \ Webmin 漏洞。\n5. 识别这四个数据库结果之间的差异。哪个数据库更准确？\n6. Webmin 应用中有多少个高危漏洞？列出漏洞编号（以 `VU#`\
  \ 或 `CVE` 开头）。\n\n### 理解漏洞识别方案\n1. 访问 `http://cve.mitre.org/`。定义 `CVE` 缩写。\n2. 访问\
  \ `http://cve.mitre.org/compatible/process.html`。CVE 兼容性流程包含哪些阶段？对于在 CVE 数据库中的公司及其产品，提供了哪些信息？\n\
  3. 将漏洞添加到 `CVE` 中的流程是什么？\n\n\n\n\n破坏易于建设。——一句俄罗斯谚语：*“拆除比建造容易得多。”* (Mertvago, 1995)\
  \ 在第 10 章中，我们采取了比较费力的方法——我们手动运行一切操作，并通过互联网查询来寻找潜在的漏洞。这些知识将帮助我们更好地理解下一步——漏洞验证。在理解系统或网络内部安全状态时，面临的主要问题之一就是确定哪些漏洞是真实的，哪些是误报。这一步消除了所有疑虑。\n\
  \n那么，这一节是如何与主流方法论结合的？如前提到的，本书的第 2 部分与信息系统安全评估框架 (ISSAF) 方法论紧密结合。这主要是因为进行渗透测试所需的程序在\
  \ ISSAF 中被细分为细粒度的步骤。这并不意味着 ISSAF 是一个更好的方法论——仅仅是使用 ISSAF 方法论更容易展示专业的渗透测试。\n\n这一特定章节——如果我们坚持使用\
  \ ISSAF 术语的话——标题应该是“渗透”。遗憾的是，对于渗透测试（PenTest）这一阶段实际发生的情况来说，这个词的含义太狭窄了，这就是为什么我选择了“漏洞验证”。\n\
  \n在这一阶段，ISSAF 包含四个步骤：\n- 寻找概念证明（PoC）代码/工具\n- 测试概念证明代码/工具\n- 编写你自己的概念证明代码/工具\n- 使用概念证明代码/工具攻击目标\n\
  \n在阅读本章时，请记住这四个步骤——我们将完成每一个步骤，但不会刻意强调它们。有必要稍微扩展一下“测试概念证明代码/工具”这一步——这指的是将漏洞用于渗透测试目标之前，先在测试服务器上进行漏洞测试。即使我们从可靠来源获取了漏洞代码，我们也也无法真正知道启动漏洞时会发生什么。因为两个系统很少是完全相同的，漏洞可能会产生不同的结果，导致目标崩溃并丢失所有数据和功能。参考《开源安全测试方法手册》(OSSTMM)\
  \ 第 3 版，我们已经进入了通信安全 (COMSEC) 部分名为“控制验证”的章节，在该章节中，我们列举并验证了系统以及系统上应用程序安全措施的操作功能。我们需要关注的四个不同控制领域：\n\
  - 不可否认性\n- 机密性\n- 隐私\n- 完整性\n\n在测试不可否认性时，我们希望关注身份识别和验证方法、会话管理以及活动日志等问题。验证数据的机密性涉及通信通道、加密以及系统上数据的模糊；此外，机密性还扩展到服务器与任何连接客户端之间。隐私数据的泄露可能会严重损害公司及其信誉。在测试隐私控制时，我们再次需要特别注意通信通道和私有（专利）协议的使用。最终，我们寻找的是从系统或在传输过程中泄露的个人信息。系统的完整性检查包括数据库操作和文件修改。自然地，如果数据被损坏，公司及其客户可能会受到负面影响。\n\
  \n在整个章节中，我们将根据 OSSTMM 识别我们执行的每个漏洞所影响的控制领域。根据《项目管理知识体系》(PMBOK)，我们仍然处于执行过程组中——具体位于“指导和管理项目执行”过程中。作为对前几章的回顾，此阶段的发现将有助于完善质量保证过程、项目团队过程（特别是采购和开发过程）的输出，并会影响\
  \ PMBOK 定义的“请求供应商响应”活动。\n\n在渗透测试的漏洞验证阶段，一个特别注意的领域是信息发布过程，我们将在本章之后讨论。由于监控和控制过程组监督渗透测试的这一阶段（以及所有其他阶段），我们需要一些重点关注的问题——特别是进度控制和利益相关者管理过程。\n\
  \n\n\n\n尽管到目前为止我们采取的是费力的方法，但我们暂时并不想就此放弃手动操作。很快，我们将开始使用一些更高级的自动化工具，这些工具可以寻找并利用漏洞。但正如上一章提到的，最好的方法是在渗透测试中手动执行所有步骤。这样，我们就能了解工具的实际作用是什么，以及工具内部可能存在哪些局限性。让我们同样探索一下漏洞验证工具。在第\
  \ 10 章中，我们识别了 `pWnOS` 目标服务器上的可用端口。如果你还记得，我们发现端口 `10000` 上存在某些活动，且运行在该端口上的应用程序是 `Webmin`。我们还搜索了互联网，发现有多个与\
  \ `Webmin` 相关的漏洞；然而，我们无法确定应用程序的版本，也不知道它是否存在漏洞。由于实际上攻击服务器不在审计员的职责范围内，他们通常会尝试通过访问系统本身或向系统管理员请求信息来识别应用程序版本。从审计员的角度来看，需要谨慎，不要进行任何可能危及目标服务器完整性和运行的操作。而对于我们来说，没有这种顾虑，将直接攻击应用程序和服务器。询问系统管理员是发现目标更多信息的可行方案。但如果我们试图在不惊动系统管理员的情况下进行渗透测试，表达我们对\
  \ `Webmin` 应用程序的兴趣可能会引起管理员的注意，从而加强系统的防御……这这对我们来说就没趣了。我们的第一步是尝试在互联网上寻找 `Webmin` 的利用程序。有很多提供漏洞利用程序的网站，但远程和内部漏洞利用的主仓库可以在\
  \ [www.milw0rm.org](http://www.milw0rm.org) 找到。图 11.1 显示了搜索 `Webmin` 漏洞利用程序的结果。\n\
  \n| ![B9781597494250000166/f11-01.jpg is missing](img/f11-01.jpg) |\n| --- |\n|\
  \ 图 11.1. |\n| [milw0rm.org](http://www.milw0rm.org) Webmin 搜索结果 |\n\n那么，我们应该尝试哪些漏洞利用程序？全部！为了简单起见，我们在这里只处理一个漏洞利用程序——针对低于\
  \ `1.290` 版本的 `Webmin` 任意文件泄露利用程序。如果我们下载 Perl 版本（日期为 2006-07-15）到我们的 `BackTrack`\
  \ 系统并运行它，就会看到图 11.2 中显示的信息。如你所见，我们能够获取包含系统用户加密密码的 `shadow` 文件。\n\n| ![B9781597494250000166/f11-02.jpg\
  \ is missing](img/f11-02.jpg) |\n| --- |\n| 图 11.2. |\n| Webmin 漏洞利用程序 |\n\n**警告**\
  \ *工程师：* 运行他人提供的程序是非常危险的，尤其是在渗透测试中。在使用下载的任何漏洞利用程序之前，确保你已审查并理解其所有部分。考虑到这些是由黑客制作的，假设某些程序造成的危害比它们暗示的要大（包括完全破坏目标系统的数据），这种疑疑症是好事。这就是漏洞验证的全部内容。让我们回顾一下引导我们走到这一点的步骤：\n\
  1. 识别运行在端口上的应用程序。\n2. 寻找版本信息（如果可能）。\n3. 在互联网上寻找漏洞利用程序。\n4. 针对目标应用程序运行漏洞利用程序。真的这么简单。人们遇到困难的地方通常是在没有已知漏洞利用程序时。\n\
  \n## 自动化工具\n\n互联网上有许多工具可以帮助我们发现和利用系统。我们的项目资金将影响我们能够获得哪些工具。一些渗透测试工具是商业性的，使用需要付费。然而，在涉及数百或数千系统的大型渗透测试中，价格不再是一个问题——高端商业工具对于节省时间和精力的至关重要。我们在这里讨论其中一些，但我向你推荐一个列出渗透测试可用用的“前\
  \ 100 网络安全工具”的网站：[sectools.org](http://sectools.org)。\n\n**提示** *项目经理：* 项目经理需要推行自动化工具的使用，特别是那些具有调度活动能力的工具。网络和系统环境在一天和一周内是不断变化的，工程师需要在非工作时间进行扫描和攻击。具有调度扫描和攻击能力的工具可以显著改善项目成本和进度。根据\
  \ sectools.org 的调查结果，前 10 名漏洞扫描器如下：\n1. `Nessus`（大多为商业产品）\n2. `GFI LANguard`（商业产品）\n\
  3. `Retina`（商业产品）\n4. `Core Impact`（商业产品）\n5. `ISS Internet Scanner`（商业产品）\n6. `X-Scan`\n\
  7. `Sara`\n8. `QualysGuard`\n9. `SAINT`（商业产品）\n10. `MBSA`\n\n漏洞利用工具列表仅包含三项，其中一项是之前列表中重复的：\n\
  1. `Metasploit Framework`\n2. `Core Impact`（商业产品）\n3. `Canvas`（商业产品）\n\n刚开始专业渗透测试的人起初可能会在有其他开源且免费使用的工具的情况下，对购买商业产品望而却步。但商业漏洞扫描器可能是渗透测试项目中投资回报最高的投资。在决定什么工具最适合这项工作时，成本不应是一个考虑因素。你会让一个用扳手当锤子用的技工来修理你的车吗？那么，为什么要仅仅因为成本而聘佣一个使用错误工具的专业渗透测试员呢？这些工具在节省时间方面确实是物有所值的，并且是一项有价值的投资。\n\
  \n## 工具与陷阱……\n\n# 免费并不总是更好 …… 但它并不坏\n\n\n\n\n\n不要假设金钱就是渗透测试中获得更好结果的途径。任何工具（无论是商业还是开源的）的有效性并不取决于价格，而是取决于渗透测试人员的技能。确保你尝试所有可用工具，并找出哪些工具最适合你、你的团队以及项目环境。好了，既然我已经说明了这一点，让我稍微回头，谈谈优点和缺点。列出的每个产品的功能都非常不同。表面上看可能并非如此，但在这个市场中竞争，它们必须进行某种专业化。图\
  \ 11.3 是 CORE IMPACT 的截图，列出了可用的漏洞利用数量；该应用程序缺少了一些漏洞，但这些漏洞在其他地方可用，包括 [www.milw0rm.org](http://www.milw0rm.org)。IMPACT\
  \ 选择的漏洞是基于对企业客户的最大威胁程度选定的，但也可以使用内置功能导入用 `Python` 编写的漏洞利用脚本。\n\n| ![B9781597494250000166/f11-03.jpg\
