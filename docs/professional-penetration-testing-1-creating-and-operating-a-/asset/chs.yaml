  \n## 项目团队成员\n\n\n\n\n渗透测试团队的成员差异巨大，这取决于创建和维护该团队的公司组织结构。为了让渗透测试（PenTest）团队取得成功，他们需要团队外部的支持，以及团队内部熟练的管理。人们对渗透测试团队的流行印象类似于忍者——隐形而敏捷、不受世俗束缚、配备了强大且独特的工具，并能够完成任何任务。现实情况是，在大型组织中工作的专业渗透测试成员与我们其他人一样，深陷于同样的企业生活之中——办公室政治政治、工时表、狭窄的工位、性能低下的电脑、没完没了的会议、人力资源宣讲座、消防火灾演习、团队建设活动、聚餐午宴，以及不可避免的企业架构重组。本节将讨论不同渗透测试团队成员及利益相关者的角色与职责，并确定维持高效渗透测试团队的关键方面。我们还将探讨渗透测试团队在公司内部组织的方式，以及如何提高渗透测试项目的成功率。\n\
  \n## 角色与职责\n\n专业渗透测试团队的构成差异巨大，这取决于项目范围和组织结构。根据公认的惯例，角色和职责的名称会有不同；然而，无论公司的外部影响如何，某些职位是存在的。组织企业结构将从职责、跨部门协作和资源获取方面影响渗透测试团队。图\
  \ 8.1 展示了渗透测试团队的典型组织结构，显示了那些在渗透测试团队中提供独特功能的成员。\n\n| ![B9781597494250000129/f08-01.jpg\
  \ is missing](img/f08-01.jpg) |\n| --- |\n| 图 8.1. |\n| 渗透测试团队的典型组织结构 |\n\n在图 8.1\
  \ 的典型结构中，多个职位可能由同一个人担任。例如，渗透测试经理兼任项目经理，甚至在需要时充渗透测试工程师。然而，这些角色仍然存在，即使由一个人承担。\n\n\
  ## 团队支持者 (Team Champion)\n\n如图 8.2 所示，团队支持者通常是高层经理，负责在大企业组织范围内支持渗透测试团队的工作。团队支持者在管理链中的位置越高，渗透测试团队及其项目获得的支持和保护就越；然而，团队支持者并不一定处于渗透测试团队的管理链中，也不非只需要是一个人。支持渗透测试和信息安全的高层倡导者越多越好。\n\
  \n| ![![B9781597494250000129/f08-02.jpg is missing](img/f08-02.jpg) |\n| --- |\n\
  | 图 8.2. |\n| 团队/项目支持者 |\n\n如果渗透测试团队位于公司外部，那么在客户内部获得一个团队支持者至关重要，特别是当进行渗透测试的决策具有对抗性时。系统和网络经理可能将渗透测试视为对权威或工作安全的挑战；这些同样的经理会变成障碍，意图让渗透测试惨遭失败。为了克服障碍，通常会要求团队支持者来化解分歧、鼓励交流并增加渗透测试项目的成功率。如果渗透测试团队位于公司内部，团队支持者可以提供更大的帮助，特别是在职能型或泰勒制（Tayloristic）组织中。影响跨业务线的参与度和协作的能力是一项重要技能，它可以提高渗透测试的成功率。业务部门通常侧于保持系统在线和可用——在赚钱的日常业务中，很少考虑安全性。将安全性引入业务部门的开发周期中，往好被视为一种阻碍，最坏被视为障碍。团队支持者，尤其是处于企业组织结构中较高位置的支持者，通常可以对业务部门管理层施加足够的间接压力，以鼓励他们参与渗透测试团队。如果没有团队支持者，渗透测试团队将会被忽视，项目也会失败。\n\
  \n## 项目经理\n\n引入才华横溢的项目经理可以大大提高渗透测试项目的成功率，如图 8.3 所示。在拥有永久渗透测试团队的大型组织中，项目经理通常是对渗透测试非常熟悉的人。在较小的组织或很少开展渗透测试项目的组织中，项目经理可能对如何管理专业的渗透测试，或者项目本身存在哪些风险一无不知。虽然引入没有渗透测试经验的项目经理可能不会导致渗透测试项目失败，但它确实增加了项目经理和团队中工程师的工作量，因为项目经理必须向已经熟悉专业渗透测试的工程师提很多问题，这无疑会减慢工程师的速度，因为他们必须不断回答这些问题。\n\
  \n| ![![B9781597494250000129/f08-03.jpg is missing](img/f08-03.jpg) |\n| --- |\n\
  | 图 8.3. |\n| 项目经理 |\n\n有意建立专业渗透测试团队的管理层经常犯的一个错误，是选择组织内的一名工程师担任项目经理。项目经理的职业与工程师截然不同；将一名工程师投入到项目经理的工作中——尤其是在没有适当项目管理培训的情况下——是确保渗透测试项目失败的好方法。\n\
  \n## 渗透测试工程师\n\n团队中如果没有熟练的渗透测试人员，项目就无法成功。渗透测试团队中工程师的技能应与企业业务目标以及组织使用的软件/硬件匹配，如图\
  \ 8.4 所示。对于许多组织来说，获取熟练的渗透测试工程师非常困难，因为这个职业非常专业、相对较新且需求正在增长。对于无法聘请熟练工程师的公司，他们必须培训员工变得熟练。\n\
  \n| ![B9781597494250000129/f08-04.jpg is missing](img/f08-04.jpg) |\n| --- |\n|\
  \ 图 8.4. |\n| 渗透测试工程师 |\n\n\n\n\n由于信息安全领域不断变化的特性，渗透测试工程师需要广泛的培训，包括继续教育课程。如果没有强大的培训预算和管理层的支持，渗透测试人员必须依靠自己的技能来跟上系统入侵领域的所有最新趋势，而这几乎是不可能的。培训计划和预算的引入允许渗透测试工程师能够在渗透测试的特定领域内获得针对性培训，例如\
  \ Web 应用程序攻击、数据库利用和逆向工程。不应将渗透测试人员视作审计员，也不应要求他们作为工作的一部分来执行审计任务。审计员通常的任务是确定组织在多大程度上遵循其记录的程序，而渗透测试人员对此并不在意。渗透测试工程师关注的是利用系统，无论系统的流程如何，因此他们对系统有更高水平的知识——他们可能会详细如何改进系统流程，但仅在渗透测试项目结束后。\n\
  \n## 工具与陷阱……\n\n# 渗透测试工程师任务\n\n尽管这两个职业都关注信息系统安全，但渗透测试工程师所需的技能组合与审计员完全不同。区别通常体现在思维上——审计员通常采取防御性思考，而渗透测试人员则倾向于进攻性思考。尽管渗透测试人员转向审计领域可能比审计员转向渗透测试更容易，但这两个职业的差异仍然足够显著，应该保持独立。\n\
  \n## 组织结构\n\nPMBOK 识别了三种类型的组织：功能型、矩阵型和项目型（Glen, 2003）。在大型组织中，渗透测试团队的组织结构取决于行业、组织的年龄以及高层管理自上而下的管理风格。\n\
  \n### 功能型组织\n\n功能型组织是典型的泰勒模型，根据功能划分劳动力。在严格的泰勒体系中，公司被分为不同的小组，例如信息技术（IT）、运营和财务。每一层也会被划分，例如\
  \ IT 可能会分为研发、网络服务和支持部门。功能型组织的优点是每个小组都拥有对职能组织做出响应的资源和员工。在图 8.5 中，我们可以看到功能组织结构的一个示例，渗透测试经理拥有的只向渗透测试经理汇报的员工。\n\
  \n| ![B9781597494250000129/f08-05.jpg is missing](img/f08-05.jpg) |\n| --- |\n|\
  \ 图 8.5. |\n| 功能型组织 |\n\n功能型组织有许多缺点。主要的缺点是每个职能经理都与其他部门独立运行。以 IT 组织为例，研发部门、网络服务部门和支持部门可能各自拥有自己的渗透测试团队。虽然额外的职位可能被视为对专业渗透测试人员的利好，但在泰勒式结构中存在大量的资源浪费。\n\
  \n**注** `Taylorism`（泰勒制）是一个用于描述弗雷德里克·温斯洛·泰勒（Frederick Winslow Taylor）关于改进工作流程的发现的术语。美国机械工程师学会主席泰勒因他在科学效率方面的工作而闻名，这是功能型组织设计的基础（Taylor,\
  \ 1915）。除了资源浪费外，功能型组织还具有在企业内部产生安全漏洞的缺点。在研发部门工作的渗透测试团队可能只关注新项目的架构设计。。当新项目投入生产时，网络服务部门可能只检查系统配置，而支持部门可能只检查管理支持系统。在这三种情况下，没有人会从更宏观的视角检查新项目，包括网络之间的数据流、信任关系、网络防御、物理访问或社会工程威胁。在现实世界的渗透测试中，许多大型公司是按照泰勒式设计组织的。功能型组织可能是对专业渗透测试项目最糟糕的设计之一，因为这些项目可能无法获得保护公司业务目标所需的所有资源和知识。然而，在这些大型公司内部尝试进行组织结构的变革是困难的，特别是如果理由仅仅是一个（通常是）小型渗透测试工程师团队时。\n\
  \n### 矩阵型组织\n\n矩阵型组织试图将资源水平分布，而不是像泰勒制那样将其保留在垂直结构中。图 8.6 是其中一种矩阵组织结构的示例。矩阵的优点是能够为项目从不同部门获取人才，这将为项目带来不同的经验和知识。另一个优点是资源可以在所有部门之间更有效地共享，且项目通常会在更高、更全面的层面上检查安全问题。\n\
  \n| ![B9781597494250000129/f08-06.jpg is missing](img/f08-06.jpg) |\n| --- |\n|\
  \ 图 8.6. |\n| 矩阵型组织 |\n\n矩阵型组织的缺点是对员工的权威变得复杂。渗透测试工程师不仅在自己的领导链中有一个职能经理，还必须向渗透测试项目经理汇报，而该项目经理可能来自不同的部门。当工程师需要向多个管理链汇报时，时间工作工作量上的冲突就会出现。员工投入时间的“获胜者”取决于公司在矩阵型组织中权权的位置。在弱矩阵中，职能经理对员工分配的控制优于项目经理，而强矩阵则将大部分权力交给项目经理。矩阵型组织很少作为一种定义的全公司管理方法。通常，矩阵仅在创建高知名项目时偶尔使用。员工将花费大部分时间满足其职能老板的需求，直到被指派跨部门项目。项目经理拥有的权限通常取决于项目利益相关者是谁，以及项目发起人在组织中的地位。\n\
  \n### 项目型组织\n\n在泰勒式组织中，职能经理对渗透测试团队拥有所有的权力和责任。如果职能经理完全被项目经理取代会怎样？我们得到了项目型组织，如图 8.7\
  \ 所示。\n\n| ![B9781597494250000129/f08-07.jpg is missing](img/f08-07.jpg) |\n| ---\
  \ |\n| 图 8.7. |\n| 项目型组织 |\n\n\n\n\n与职能组织模型类似，员工成员在整个项目期间只有一个汇报对象——即 `PenTest` 项目经理。与职能组织不同，员工成员是从各个部门选出的，类似于矩阵型组织。根据项目的需求和当前阶段，员工成员也可以进行调换。从项目经理的角度来看，项目化组织在获取项目所需的必要资源方面提供了最大的独立性和灵活性。对于工程师而言，项目化组织增加了跨领域培训和知识共享的机会。项目化组织结构的一个缺点是，工程师不会产生任何对团队或项目的忠诚度。工程师在不同项目之间切换得越频繁，就越难激励。另一个缺点是现实情况往往与理论有巨大差异。现实世界项目化组织中的项目经理会留住资源，而不是在资源不再需要后释放它们。在某些情况下，这是为了确保接下来的项目有可用资源，但通常是对职能组织的退守。\n\
  \n**注意** 组织示例中没有讨论过的一点是“哪种组织最适合渗透测试团队？”每种组织结构都有优缺点，没有哪一种是“最好的”，尽管某些比其他的要好。渗透测试项目经理面临的挑战是在任何现有组织中利用其积极方面，并减轻其缺点。\n\
  \n# 项目管理\n\n在第 6 章中，我们讨论了 PMBOK 内的不同阶段以及某些过程。在本节中，我们将讨论某些过程如何具体与专业渗透测试相关。提醒一下，项目内部包含几个阶段：启动、计划、执行和结束。这四个阶段通过监控和控制过程进行监督。我们不再重复第\
  \ 6 章中已经讨论过的内容，而仅涉及渗透测试特有的关注领域。\n\n**注意** 本节中中讨论的许多主题在本书的第 2 部分中也有所讨论。本章将允许项目经理快速参考围绕专业渗透测试项目的一些问题。第\
  \ 2 部分提供了额外的示例和相关信息，并对此处涵盖的内容进行了扩展。\n\n## 启动阶段\n\n项目启动阶段只有两个过程：制定项目章程和识别利益相关者。虽然制定项目章程是渗透测试项目中的重要步骤，但其必要步骤与其他项目相比并没有太大差异。然而，识别利益相关者对\
  \ PenTest 项目的成功可能产生更大的影响。在识别利益相关者时，“利益方”列表需要包含的不仅仅是经理和联系人的名单。在渗透测试中检查任何系统时，系统都有可能崩溃。。因此，需要将系统所有者添加到利益相关者列表中。希望渗透测试也能被网络管理员注意。当他们注意到（或如果他们注意到）时，他们可能会通过添加阻止访问的过滤器来终止渗透测试。与网络管理员通信的能力同样重要，也应该被添加到利益相关者列表中。在渗透测试过程中还可能识别出非法活动，因此需要建立当地和联邦层面的执法部门联系人。如果项目涉及物理渗透测试组件，执法部门可能也需要了解这一点。\n\
  \n以下是渗透测试中潜在的利益相关者列表：\n\n- **客户/客户组织**\n  1. 项目赞助人\n  2. 联系人\n  3. 高层管理\n  4. 目标系统/网络经理（加上高层管理）\n\
  \  5. 目标系统/网络管理员\n  6. 网络管理员\n  7. 网络防御管理员\n- **渗透测试团队**\n  1. 项目经理\n  2. 职能经理\n\
  \  3. 高层管理\n  4. 渗透测试工程师\n  5. 采购部门\n- **政府机构**\n  1. 地方法执法部门（可能响应入室事件的人员）\n  2.\
  \ 地方法执法调查员（如果在渗透测试过程中发现了犯罪）\n  3. 联邦执法部门（如果在渗透测试过程中发现了需要在国家层面进行通知的犯罪）\n- **第三方群体**\n\
  \  1. 互联网服务提供商 (ISP)\n  2. 领域专家/顾问\n\n一旦制定了利益相关者列表，必须制定一项管理策略。管理策略的目的是识别每个利益相关者对项目成功产生何种影响（无论是好坏）。通过识别影响，项目经理可以围绕每个利益相关者设计策略。\n\
  \n**注意** 上述利益相关者列表只是一个样本，不应假设它是完全的。当一个高知名项目启动时，项目经理将被大量加入通信列表和活动通知的请求所淹没。项目经理创建邮件列表并向大量人员发送高级通信并不常见，这仅仅是为了安抚那些对项目没有影响或互动的“利益相关者”。识别影响的一个例子是将地方法律识别为利益相关者。在渗透测试的物理评估案例中，当地执法可能被视为障碍（他们逮捕渗透测试人员）或资产（如果在渗透测试过程中发现了非法活动）。缓解逮捕带来的负面影响的方法是项目经理可以制定一种策略，在项目的物理访问组件期间，让一名高管待命或在现场，以响应可能发生的警报。利用执法部门作为资产的策略是与执法机构的的网络犯罪部门进行事先沟通，并在发现发现时制定行动计划。\n\
  \n## 计划阶段\n\n\n\n\n在渗透测试的规划阶段，对于项目经理有效开展项目至关重要的三个过程是`Plan Risk Management`（风险管理计划）、`Identify\
  \ Risks`以及`Plan Risk Responses`。渗透测试规划阶段的项目风险管理不仅包括项目本身的风险，还包括在目标网络或系统内部识别出的风险。在第\
  \ 7 章中，我们讨论了为发现的漏洞分配风险指标的困难，这主要是因为通常没有足够的行业范围信息来正确定义客户网络内的风险。\n\n通常情况下，项目经理只关注对项目产生的风险，而不会关心客户网络内的漏洞风险。然而，对于经常从事渗透测试项目的项目经理来说，建立一个漏洞风险注册表是有益的。拥有的漏洞风险注册表可以在进行风险分析时加快渗透测试项目的进度，并跨多个渗透测试项目之间提供连续性。即使在分配风险时使用了第三方评估（如在第\
  \ 7 章中讨论过的），随着时间的推移，也可以根据信息安全的变化进行调整。通过维护注册表，可以跟踪漏洞风险注册表的变化，而第三方评估则不同。\n\n制定人力资源计划需要项目经理识别项目中的角色和职责、项目生命周期所需的技能，以及满足资源需求的员工。如果渗透测试（PenTest）团队始终不变，那么项目经理的工作（大部分）就完成了，除非需要引入第三方顾问来完成当前人员配置无法满足的特定任务。在项目经理需要从其他部门获取额外人员的项目项目中，项目经理的工作会变得困难得多。遗憾的是，大多数职能经理在被迫为部门外项目放弃人员员时，倾向于释放非关键员工，而这很少是项目的最优选择。当项目经理必须“得什么就用什么”时，项目往往会遭受影响。\n\
  \n为了让项目经理能够有效克服向项目中加入未经过培训或技能不足员工的障碍，项目经理必须提前计划额外培训。培训项目员工并非易事——通常项目进度已经非常紧凑，培训必须在几周内或几天内完成。如果项目经理足够幸运，他们将有培训资金派遣员工参加信息安全训练营。如果项目经理像大多数项目经理一样，他们完全没有培训资金，且无法调动足够的资金来支付第三方培训。可以使用不同的技术来缓解培训问题，包括：派遣某人参加培训，然后由其教授其他团队成员（也称为“培训培训者”）；在公司内部寻找领域专家来传授知识（在项目执行阶段期间或之前）；或者分配时间进行自学。\n\
  \n在离开项目规划阶段之前，我们应该提一下采购问题。项目经理可能在项目开始实际渗透测试之前需要获取额外资源，例如计算系统、网络连接或渗透测试工具。从请求资源到资源实际到达之间通常会有显著的延迟。在大型组织中，项目经理可能会从其他部门借用资源，但渗透测试中的资源通常非常专业化，可能根本无法外借。任何管理渗透测试项目的人都需要在项目尽早阶段意识到需要哪些资源。另一个选项可能是建立一个专门为某种类型目标（如数据采集与监控控制系统\
  \ SCADA）设计的渗透测试团队。这样，团队成员就不必不断学习不同的协议、应用程序和系统，从而使渗透测试更具高效。\n\n## 执行阶段\n\n\n\n\n\n\
  执行阶段是大多数人提到渗透测试时首先想到的阶段。对于项目经理来说，这一阶段通常在项目后期才开始。启动和规划阶段往往在项目生命周期中消耗大量时间，当这一阶段开始时，大多数项目经理都会感到松了一口气。专业渗透测试的执行阶段在项目启动后几个月、甚至超过一年后才开始，这并不稀奇。\n\
  \n在专业渗透测试中，执行阶段内更为密集的流程包括`组建项目团队`、开发项目团队`以及`管理利益相关者预期`。在规划阶段，我们讨论了在招募和培训参与 `PenTest`（渗透测试）项目的团队成员方面的一些不足。在执行阶段，项目经理必须执行在规划阶段制定的培训计划。遗憾的是，渗透测试培训是一种不寻常的商品且难以获得。市面上并没有足够的专门设计用于教授渗透测试技巧的训练营或课程。\n\
  \n在第 3 章中，我们涵盖了 `PenTest` 工程师可以获得的各种信息安全认证，这些认证通常带有相关的培训课程。我们还识别了不同的协会和组织，它们也可能提供满足渗透测试项目要求的培训课程。然而，对于非常专业的培训，第三方承包商往往是唯一的替代方案。通常可以聘请领域专家为渗透测试团队提供集中的培训。聘请专家的优势在于，他们可以根据\
  \ `PenTest` 团队的具体需求定制培训，而协会和组织支持的那些面向大众设计的预设培训课程则不然。例如，如果 `PenTest` 员工实际上需要关注即将到项目的缓冲区溢出问题，那么让他们去上一门通用的黑客课程是毫无意义的。项目经理应确保获得的培训与项目需求相匹配。\n\
  \n在渗透测试项目中，管理利益相关者的预期是一项挑战。渗透测试期间发生的任何事情都可能让一组利益相关者感到恼，而让另一组感到兴奋。例如，当渗透测试工程师发现一个漏洞时，系统管理员可能会认为这一发现对其技能的人身攻击。相比之下，高层管理人员可能会由于漏洞被发现了，这样就可以缓解安全缺陷并提高公司的整体安全态势。在渗透测试期间，项目经理必须平衡与所有利益相关者沟通的语气和方式，以确保信息传达的同时不会在项目内部制造额外的障碍。这并不意味着准确的信息应该被污染或过滤；实际上，恰恰相反。如果项目经理能够以非常事实的方式向利益相关者展示信息，对各方来说通常更容易理解。\n\
  \n保持数据尽可能属实的另一个优势是利益相关者的预期能得到更好的满足。在渗透测试开始，利益相关者通常期望 `PenTesters` 能够识别出他们网络中的所有漏洞；而在渗透测试结束时，利益相关者往往期待奇迹般的解决方案。澄清渗透测试期间到底发生了什么以及最终文档将涵盖的内容，通常是项目经理的工作。如果项目经理能够避免夸张其辞并坚持事实，他们就能更好地管理利益相关者的预期。利益相关者之间一个典型的困惑点是，渗透测试是如何作为信息安全生命周期的一部分——而不是开发的终点。项目经理必须解释渗透测试仅仅是某个时间点上的快照。\n\
  \n## 监控与控制\n\n在渗透测试的监控和控制阶段，两个引起特殊问题的领域是范围和进度。渗透测试中的范围经常受到执行阶段发现的的威胁；然而，范围之外的任何事情都可以列在最终报告中。关于进度，如果新发现暗示访问权限的增加（例如\
  \ `root` 或 `administrator`），很难约束工程师们。完全系统控制权限的“奖品”对于渗透测试工程师和项目经理来说都是难以拒绝的。允许进度延误的理由并不总是合理的。通常，发现任何漏洞就足以对系统的安全架构进行重新评估了。即使新发现的漏洞未经过验证，最终报告也可以指出哪些未经过检查，允许客户自行跟进或要求额外的测试。允许进度延误的另一个问题可能会影响未来的项目。正如我们之前讨论过的，有很多活动——丢失一两周就会对未来的合作产生负面影响。\n\
  \n## 结束阶段\n\nPMBOK 定义了两个任务作为结束阶段的一部分`结束项目或阶段`和`结束采购`。这两个过程的描述都是通用的，并没有为初接触渗透测试项目的项目经理提供关于项目该阶段发生情况的信息。\n\
  \n### 正式项目评审\n\n项目结束时，整个团队需要对发生的情况以及他们可以不同的做法进行分析。这种分析与努力评估（下文讨论）的区别在于，分析的是整个团队，而不是项目中的个人。这种讨论的详细程度可以从宏观示例到具体的工具性能不等。\n\
  \n\n\n\n\n在渗透测试项目中分析个人工作量评估时，应将其视为一项集体活动。类似于`code reviews`（代码审查），工作量评估可以识别渗透测试工程师在流程上的缺陷和待改进之处。它也可以成为知识分享的机会，特别是当经验更丰富的工程师描述他在项目中的投入和活动时。\n\
  \n`Warning` 警告：小组评估的危险在于讨论演变成负面情绪。项目经理必须确保在评审期间仅使用建设性批评，并确保小组评审在整体上是积极且对团队成员有益的。如果评估恶化为负面内容，项目经理通常认为取消渗透测试结束阶段的这部分内容会更好。失去一个培训工具比失去才华员工要好得多。\n\
  \n## 新项目的识别\n\n在渗透测试结束时，员工所拥有的经验和知识通常比开始渗透测试时更丰富。项目经理应该评估获得了哪些知识，以查看即将开展的任何项目是否能受益于新学到的技能。另一个选项是，渗透测试团队可能会扩展他们能够执行的渗透测试类型。如果总结项目要求员工学习如何进行`reverse\
  \ engineering`（逆向工程），项目经理（或高层管理）可能利用这项新技能，并引入需要进行`reverse engineering`渗透测试的额外业务。除了新技能外，项目经理应该评估人际团队动态。在许多情况下，团队成员合作的方式会影响未来项目的人员分配。通过识别人们在团队中的互动方式，项目经理可以通过将正确的人分配到正确的团队中来增加项目成功的概率。一个例子是，客户的联系人可能与某个渗透测试工程师产生“共鸣”。对于项目经理来说，将该渗透测试工程师纳入任何涉及该同一客户的未来项目中是合理的，无论该联系人是否参与。积极的评价是宝贵的资产，是项目经理应该培养并利用其来确保项目成功的因素。\n\
  \n`工具与陷阱……`\n\n\n\n## 社会工程学\n\n项目经理应该利用所有可用工具来成功完成项目。利用人际关系来克服渗透测试过程中遇到的障碍是一种合法的技术。我曾多次利用我的军事经历作为杠杆，解决与同样是退伍人员的利益相关者之间的问题。使用有效的方法。\n\
  \n## 未来项目优先级识别\n\n成功的渗透测试团队不可避免地会有业务过载的情况。当这种情况发生时，必须对项目进行优先级排序。项目经理在对项目进行优先级排序之前，需要来自许多人员的意见，但有些事情必须被考虑：\n\
  - 对客户的整体安全风险\n- 每个项目的成本\n- 每个项目的财务收益\n- 每个项目所需的时间\n- 成功完成每个项目所需的技能\n- 员工/资源可用性（是的，即使工程师也会休息）\n\
  - 项目赞助人/请求者\n\n所有这些因素都会影响项目的优先级排序，并应在分配之前考虑。通过识别未来项目涉及的所有因素，项目经理可以安排项目使资源和时间的利用最大化。\n\
  \n## 总结\n\n企业组织结构会影响专业渗透测试团队成员的角色和职责。通过了解每个组织的优缺点，项目经理可以制定策略来提高项目的成功率。无论渗透测试团队在哪种组织结构下工作，团队都必须获得高层的支持，即团队支持者（team\
  \ champion）。团队还必须拥有强大的项目管理能力以及获得充分参与机会的熟练渗透测试工程师。有了正确的组织设计、人员和充足的培训，项目经理也必须处理项目中渗透测试特有的领域。\n\
  \n## 解决方案快速通道\n\n## 项目团队成员\n\n- 团队支持者在管理链中的位置越高，渗透测试团队获得的支持就越好。\n- 职能型组织（functional\
  \ organization）的缺点是在公司内部产生安全缺口。\n- 矩阵组织可能要求工程师向多个链汇报。在松散的矩阵组织中，存在时间和工作量上的冲突。\n-\
  \ 在项目型组织（projectized organization）中，工程师对团队或项目不会产生任何忠诚度。\n\n# 项目管理\n\n- 在渗透测试过程中可能会发现非法活动。需要准备好执法部门的联系方式以防万一。\n\
  - 对于经常从事渗透项目的项目经理来说，开发一个风险登记表——不仅仅是项目风险登记表是有益的。\n- 经常可以聘请领域专家为渗透测试团队提供集中的培训。\n\n\
  Q：渗透测试团队可以在没有经理职位的情况下工作吗？\nA：完全可以。这可能不是进行渗透测试最有效的方法，但渗透测试的规模或团队的经验有时会决定是否需要项目管理。\n\
  \nQ：所以渗透测试团队不需要项目经理？\nA：不是这样——无论是否分配了专职项目经理，许多项目管理流程都需要执行。在没有特定职位的情况下，团队经理通常兼任项目经理的角色。这可能导致利益冲突，并因为时间限制而忽视或忽略某些流程。\n\
  \nQ：我们组织中并没有团队支持者；他们真的有必要吗？\nA：渗透测试团队是昂贵的，而且他们为网络和系统管理员带来的只有报告和头疼。如果没有组织高层的团队支持，渗透测试团队始终面临因预算原因被削减的风险。\n\
  \n## 扩展你的技能\n\n想了解更多关于渗透测试的管理吗？以下练习旨在为你提供额外的知识和技能，以便更好地理解这一主题。请使用实验室进行以下练习。\n\n\
  **理解组织**\n\n1. 搜索并定义以下术语：\n- 科学管理（Scientific Management）\n- 效率运动（Efficiency Movement）\n\
  - 福特制（Fordism）\n- 敏捷管理（Agile Management）\n- 烟囱式组织（Stovepipe organization）\n\n2.\
  \ 创建一个职能组织架构图，并在部门中包含渗透测试团队（财务、法律、运营等）。你认为哪个部门最适合部署渗透测试团队？请说明理由。\n\n\n\n\n\n# 渗透测试项目的项目管理\n\
  \n1. 本章在“启动阶段”（Initiating Stage）标题下提供了利益相关者列表。请识别可能包含在专业渗透测试项目中的五个额外利益相关者。\n2. 在互联网上搜索与渗透测试相关的课程列表。选择其中一课程，并尝试识别任何涵盖了相同材料的书籍。就课程材料和与主题相关的书籍而言，培训课程与个人学习之间的区别是什么？\
  \ \n参考文献：Glen, P., *Leading geeks: How to lead people who deliver technology*. (2003)\
  \ Jossey-Bass, San Francisco . Taylor, F.W., Expert in efficiency, dies, *New York\
  \ Times* (2009, March 22); 在线检索地址：www.nytimes.com/learning/general/onthisday/bday/0320.html。\n\
  \n## 执行渗透测试 (PenTest)\n\n当人们想到渗透测试时，他们通常会想到一个系统正被渗透测试工具攻击。然而，渗透测试不仅仅是黑客攻击——渗透测试中必须包含许多项目管理流程。由于人们对此关注度很高，且事情极易发生严重的错误，因此渗透测试需要渗透测试团队与利益相关者之间进行不断的通信。在书的这部分，我们将根据渗透测试方法检查渗透测试中的不同活动，并将项目管理流程整合到我们的工作中。虽然这看起来可能是书中最精彩的部分，但请意识到，运行渗透测试的总体目标是提高客户的整体安全态势。\n\
  \n# 第 9 章 信息收集\n\n## 引言\n\nПочин дороже дела。 – 俄语谚语：*“开头至关重要。”* (Mertvago, 1995)\
  \ 信息收集是进行渗透测试的第一步，而且认为是最重要的一步。在完成这一阶段后，我们应该拥有一份关于目标网络的详细地图，并理解进行完整评估所需的工作量。此外，我们还应该能够识别网络内的系统类型，包括操作系统（OS）信息，这将允许我们为渗透测试项目的剩余部分完善人员配备配置和工具选择。客户通常会提供许多关于其网络的信息来协助你的工作，但如果这些信息是错误的，请不要感到惊讶，这就是为什么无论如何我们都需要执行这一步。\n\
  \n信息收集可以分为两种不同类型——被动和主动。在被动信息收集中，我们试图在不直接连接到目标网络和系统的情况下，尽可能收集有关目标网络的所有信息。我们还将尝试收集公司信息，包括所有权、公司位置、网络和系统位置、物理设施信息（以防我们需要进行物理渗透测试）等，具体取决于渗透测试项目的目标。第二种信息收集类型是主动的，即我们连接到我们的目标。这种类型的信息收集旨在更好地理解项目中的工作范围、类型和系统数量。稍后我们将更详细地列出这些信息，但现在我们只想更好地了解我们正在面对的是什么样的对手。\n\
  \n人们倾向于认为，主动信息收集比被动信息收集要有用得多。然而，这种假设通常是不正确的。过去泄露的信息并不罕见，而且这些泄露的信息往往被存档了，即使后来被纠正了也是如此。正是这类错误可以极大地有利于我们的渗透测试工作，特别是当信息与网络有关时。找到配置和系统安装文件的存档，以及包括公司机密的私有数据并非不可能。\n\
  \n从项目管理的角度来看，这一阶段将直接影响项目的“执行过程”（Executing Process）组，并将帮助完善你来自质量保证（QA）、项目团队流程（包括获取和开发过程）的输出，并且会影响《项目管理知识体系》（PMBOK）定义的“请求卖方响应”（request\
  \ seller responses）活动。由于这一过程组通常是成本波动最大的地方，因此确保你的项目团队良好执行信息收集阶段至关重要。\n\n在本节中，我们将主要处理信息系统安全评估框架（ISSAF）方法。这是因为\
  \ ISSAF 将渗透测试的这一阶段分解为更细粒度的步骤。然而，在该阶段结束时，我们将满足开源安全测试方法手册（OSSTMM）的目标，该手册将大部分信息收集压缩在一个名为“物流”（Logistics）的模块中，并包括以下领域：\n\
  - 框架\n- 网络质量\n- 时间框架\n\n## 被动信息收集\n\n\n\n\n\n如前所述，被动信息收集侧重于收集存储在非我们客户网络系统中的存档信息。在信息收集阶段，会进行许多不同类型的搜索，包括与目标网络并非特定相关的信息，例如员工信息、物理位置和业务活动。列表中包括以下可能的搜索项：\n\
  \n- 定位目标的 Web 存在形式（注意：这不仅是指网页）\n- 收集有关目标的搜索引擎搜索结果\n- 寻找包含员工和/或公司评论的 Web 群组\n- 检查员工的个人网站\n\
  - 获取证券和交易委员会的信息，以及任何关于目标的额外财务信息\n- 寻找任何运行时间统计网站（uptime statistics sites）\n- 搜索存档网站以获取额外信息\n\
  - 寻找目标发布的招聘公告\n- 搜索新闻组\n- 查询域名注册商\n- 查看目标是否通过第三方服务提供反向域名系统（DNS）信息\n\n在该阶段结束时，渗透测试人员将获得大量关于目标的丰富信息，而无需访问目标网络。所有的被动信息都是从第三方来源收集的，这些来源收集了关于我们目标的信息，或者有法律义务保留这些数据。在该阶段结束时，可能会让你印象深刻的一点是，存在的信息是如此巨大——往往是那些本不该公开的信息。在你完成本章末的信息收集练习后，你可能会发现确保个人隐私已变得多么困难，以及由于互联网扩张直接导致的过去几十年发生了多少变化。\n\
  \n## Web 存在（Web Presence）\n\n此阶段通常提供关于你客户公司的丰富信息，包括员工信息、物理和逻辑位置、系统类型（包括品牌和操作系统）以及网络架构。幸运的是，渗透测试的这一阶段使用了一些简单的工具，它们列在\
  \ ISSAF 方法列表中：\n\n字体 浏览器\n- [Dogpile.com](http://Dogpile.com)\n- [Alexa.org](http://Alexa.org)\n\
  - [Archive.org](http://Archive.org)\n- `dig`\n- `nslookup`\n\n我们将主要使用这些网站，也会使用其他可以扩展我们对目标知识的网站。与\
  \ usual，OSSTMM 没有任何推荐工具，而是依靠渗透测试人员的经验来选择最合适、最有用的工具。ISAF 推荐的网站（以及 浏览器）用法是不言而喻的；真正的困难在于理解你正在寻找什么信息。答案基本上是“你能拿到的所有”。以下是一个建议列表，但绝非全部，并将根据你的合同协议和目标系统进行添加（或删除）。然而，这个列表是一个很好的开始，应该引导你思考根据目标可能获得的其他类型的信息。你在这个阶段收集的信息越多，你的后续任务就越容易执行：\n\
  \n- 网站地址\n- Web 服务器类型\n- 服务器位置\n- 日期，包括“最后修改日期”\n- Web 链接——包括内部和外部\n- Web 服务器目录树\n\
  - 使用的技术（软件/硬件）\n- 加密标准\n- 适用于 Web 的语言\n- 表单字段（包括隐藏字段）\n- 表单变量\n- 表单提交方法\n- 公司联系信息\n\
  - 元标记（Meta tags）\n- Web 页面中的任何注释\n- 电子商务能力\n- 提供的服务和产品\n\n**警告工程师：** 在此阶段收集的信息可能不在公共领域。作为渗透测试人员，将所有信息处理得像被标记为“限制”一样是关重要的，即使这些信息是在公共访问的网站上发现的。由于通过实践来理解概念比仅仅阅读要容易得多，让我们来看一个真实世界的例子。如果你遵循本书中的步骤，这些信息可能会在本书编写的时间与你阅读的时间之间发生变化；但这个练习的重点是学习我们为什么想要收集必要的信息——而不是仅仅提供一份一步步的操作的手册，手册往往是僵化的且会产生知识漏洞。通过理解我们为什么在这个阶段要做我们要做的事情，你作为一名专业渗透测试人员的能力将比你仅仅死记硬背地通过重复相同的步骤来运行所有渗透测试要强得多。假设我们从未听说过一个名为\
  \ `Nmap` 的工具。如果我们通过搜索引擎查询来查找更多关于该工具及其创建者的信息，我们会发现可能存在与 `Nmap` 相关的三个不同的 Web 网站，如图\
  \ 9.1 所示。[Nmap.org](http://Nmap.org) 看起来是一个自然的选择，但 [Insecure.org](http://Insecure.org)\
  \ 和 [Sectools.org](http://Sectools.org) 似乎与 `Nmap` 扫描器间接相关。\n\n| ![B9781597494250000142/f09-01.jpg\
  \ is missing](img/f09-01.jpg) |\n| --- |\n| 图 9.1. |\n| Nmap 工具的搜索引擎结果  |\n\n在我们继续下一步之前，我想提醒你，在信息收集阶段的这一半部分中，我们将在不接触目标系统或网络的情况下进行信息收集——这意味着我们实际上不会点击这些链接。当然，只需点击一次他们的\
  \ Web 页面不会惊动目标（毕竟，他们希望人们访问自己的网站，否则他们就不会上线了），但准确了解仅通过互联网上的次级来源可以收集到多少信息是非常关重要的。此外，你想要检索的大许多数据可能不再存在于他们的\
  \ Web 网站上，而是保存在互联网存档中。被动信息收集的另一个优势是，我们能推迟进入目标雷达范围的时间越晚越好；特别是如果你的客户的网络工程师已经了即将到来的渗透测试。我们制造的噪音越小，系统工程师试图修复其系统或规避我们探测的机会就越小。之后，我们将测试网络工程师的入侵反应，但现在我们真的不想让他们开始密切查看日志文件，识别我们的攻击\
  \ Internet 协议（IP）范围，并在渗透测试的早期阻止我们的活动。另一个需要考虑的因素是，最终我们可能在这个阶段针对除 Web 以外的服务，这无疑增加了被检测到的概率；因此，我们越隐蔽、越避开目标网络越好。现在我们有了三个目标域名，让我们再进行调查。回到我们的工具列表，让我们下一个尝试\
  \ [Alexa.org](http://Alexa.org)。在图 9.2 中，你可以看到 [Alexa.org](http://Alexa.org) 认为\
  \ [Nmap.org](http://Nmap.org) 和 [Insecure.org](http://Insecure.org) 是相关的，事实 [Nmap.org](http://Nmap.org)\
  \ 的站点信息引用了 [Insecure.org](http://Insecure.org)。如果你自己运行相同的查询，你将在列表下方发现一个有趣的发现，如图\
  \ 9.3 所示。似乎 [Nmap.org](http://Nmap.org) 也允许子域名，正如 Web 名称“[scanme.Nmap.org](http://scanme.Nmap.org)”所证明。此外，该名称似乎我们可以扫描这个子域名，但由于我们现在还没有连接目标，我们将此留到以后。\n\
