  \n\n\n\nCheckPoint 提供了多种认证，但其中许多是围绕 CheckPoint 的产品线设计的。这本身并不是坏事，特别是当你的目标网络经常包含 CheckPoint\
  \ 的任何产品时。其中有一门课程特别是厂商中立的，专注于信息安全基础知识和最佳实践。\n\nCheck Point 认证安全原理关联员 (CCSPA) (CheckPoint\
  \ Software Technologies, Ltd) \n\n- 讨论信息安全三要素（Information Security Triad）\n- 解释其他信息安全模型与信息安全三要素之间的关系\n\
  - 讨论安全设计的八大原则\n- 解释安全生命周期\n- 确定哪些信息资源被视为资产\n- 识别信息资产可能面临威胁和漏洞\n- 评估确定资产价值和对组织损失的公式\n\
  - 调查组织的风险缓解策略\n- 建立适当部署的应对措施和保护措施，并确定哪些风险应由这些措施缓解\n- 识别并区分安全策略的类型\n- 根据策略类型讨论安全策略执行\n\
  - 解释与管理安全策略相关的概念和操作\n- 讨论如何制定业务连续性计划\n- 测试业务连续性计划的方法\n- 讨论业务连续性计划的生命周期\n- 解释触发业务连续性计划的常见和异常场景\n\
  - 定义操作安全 (OPSEC)，回顾其历史\n- 识别操作安全法则 (Laws of OPSEC)\n- 识别攻击者的动机和情报收集技术\n- 确定与操作安全相关的物理和管理安全控制\n\
  - 讨论机密性和完整性访问控制模型的\n- 识别访问控制类型并对其进行适当分类\n- 解释管理访问控制的方法\n- 在访问控制的背景下回顾识别和认证\n- 讨论安全培训的性\n\
  - 识别提供安全培训的机制\n- 解释如何向业务部门负责人、管理层和高管有效沟通安全需求\n- 讨论安全架构理论\n- 解释系统安全架构\n- 描述安全网络架构\n\
  - 定义入侵\n- 定义攻击\n- 回顾入侵检测概念\n- 确定入侵检测系统的类型\n- 回顾密码术的简要历史\n- 确定加密的基本工作原理\n- 调查当前的加密算法\n\
  - 确定有效的基准技术\n- 评估渗透测试的益处\n- 识别认证方法的主要类别\n- 讨论常见访问控制方法的特征\n- 比较并对比访问控制技术\n- 回顾访问控制解决方案的行政组件\n\
  - 确定 ROBO 用户的安全问题和解决方案\n- 识别远程用户的安全问题\n- 确定小型企业用户的安全问题和解决方案\n- 识别家庭用户的安全问题\n- 定义内网\
  \ (intranet)的目的\n- 定义外网 (extranet)的目的\n- 确定虚拟公司的运作方式\n- 确定安全模型、管理控制、物理安全、操作安全、业务连续计划、保护措施和应对措施的适当用途\n\
  - 评估企业加密技术的需求\n- 调查企业用户管理和访问控制的可能性\n\n正如所述，Check Point 由于其他认证非常针对产品，我仅在此列出它们。如果你的团队需要包含这类技能组合，可以自己自行详细查看：\n\
  \n- Check Point 认证安全管理员 (CCSA)\n- Check Point 认证安全专家 (CCSE)\n- Check Point 认证安全专家增强\
  \ (CCSE Plus)\n- Check Point 认证托管安全专家 (CCMSE)\n- Check Point 认证托管安全专家增强 VSX (CCMSE\
  \ Plus VSX)\n- Check Point 认证大师架构师 (CCMA)\n\n### Juniper Networks\n\n网络领域的另一个主要巨头是\
  \ Juniper Networks，它有自己的认证系列。在信息安全领域兴趣最大、吸引力最大的可能是企业路由 (Enterprise Routing) 方向。其他方向还包括增强服务、企业交换以及防火墙/虚拟网络\
  \ (VPN)；然而，跨越所有专业水平的是企业路由方向。\n\n该方向内包含三个认证：\n\n- Juniper Networks 认证关联员 (JNCIA-ER)\n\
  - Juniper Networks 认证专家 (JNCIS-ER)\n- Juniper Networks 认证专家 (JNCIE-ER)\n\n在信息安全领域兴趣最大、吸引力最大的可能是企业路由方向。（重复）虽然这些认证涉及对\
  \ Juniper 设备的实操经验，但在获取这些认证时获得的知识将很好地适用于通用、厂商中立环境下的渗透测试。\n\n#### JNCIA-ER (Juniper\
  \ networks)\n\nJNCIA-ER 是企业路由方向的入门级认证。与 Cisco CCNA 认证相比，该认证涵盖了许多相同的概念和架构设计——只是针对\
  \ Juniper 产品线量身定制的。\n\n- 企业路由器概述、管理和架构\n- 企业路由器的用户界面\n- 安装和初始配置\n- 监控和维护 J 系列平台\n\
  - 路由协议\n- 服务：列出用于服务的可用接口并描述每种类型的优点和特性；描述 MLPPP 的目的和益处；识别 MLPPP 配置和监控选项；描述 NAT 和\
  \ PAT 的目的和益处；识别 NAT 和 PAT 的配置和监控选项\n- 其他功能：描述 VRRP 的优点和基本操作；识别 VRRP 的配置和监控选项；描述\
  \ DHCP 的益处和基本操作；识别 DHCP 的配置和监控选项\n\n正如所述，还有两个认证对任何进行渗透测试的人有益：JNCIS-ER 和 JNCIE-ER。然而，Juniper\
  \ 并没有像 Cisco 那样的安全专业方向。有一些 Juniper JNCIA 认证涉及安全问题，例如 VPN、安全套接层 (SSL) 和入侵检测，这些会对渗透测试工程师有益，但没有针对针对更广泛或更具厂商中立水平的安全目标。\n\
  \n### Microsoft\n\nMicrosoft 提供了许多可以辅助渗透测试工程师的各种认证；然而，与渗透测试最匹配的是 Microsoft 认证系统工程师\
  \ (MCSE): 安全认证。该认证的最新版本是 `MCSE: Security on Windows Server 2003`，它需要以下内容：\n\n- 四门网络系统的核心考试\n\
  - 一门客户端操作系统的核心考试\n- 一门安全设计考试（`Designing Security for a Windows Server 2003` 是唯一选项）\n\
  - 从以下列表中选择两个安全专业考试：\n    - 在 Windows Server 2003 网络中实施和管理安全\n    - 实现 Internet 安全与加速\
  \ (ISA) Server 2004 TS\n    - Microsoft Internet 安全与加速 (ISA) Server 2006, Configuring\n\
  \n\n\n\n\n# 通过收集和分析业务与技术需求创建网络基础设施安全的概念设计\n\n分析用于设计安全的业务需求。考虑因素包括现有的策略和程序、数据敏感性、成本、法律要求、终端用户影响、互操作性、可维护性、扩展性和风险。设计一个用于设计和实施安全的框架。该框架应包括预防、检测、隔离和恢复。在设计安全时分析技术限制。\n\
  \n## 创建网络基础设施安全的逻辑设计\n\n设计一个使用`Certificate Services`的公钥基础设施 (`PKI`)。设计逻辑验证策略。为网络管理设计安全。设计安全更新基础设施。\n\
  \n## 创建网络基础设施安全的物理设计\n\n设计网络基础设施安全。为无线网络设计安全。为互联网信息服务 (`IIS`) 设计用户身份认证。为互联网信息服务\
  \ (`IIS`) 设计安全。为网络间的通信设计安全。为与外部组织的通信设计安全。为具有特定角色的服务器设计安全。角色包括域控制器、网络基础设施服务器、文件服务器、`IIS`\
  \ 服务器、终端服务器和 `POP3` 邮件服务器。\n\n## 设计数据的访问控制策略\n\n为目录服务设计访问控制策略。为文件和文件夹设计访问控制策略。为注册表设计访问控制策略。\n\
  \n## 创建客户端基础设施安全的物理设计\n\n设计客户端身份认证策略。为客户端远程访问设计安全策略。设计保护客户端计算机的策略。考虑因素包括台式和便携式电脑。\n\
  \n# 在 Microsoft Windows Server 2003 网络中实施和管理安全\n\n## 实现、管理和故障排除安全策略\n\n根据计算机角色计划安全模板。计算机角色包括\
  \ `SQL Server` 计算机、`Microsoft Exchange Server` 计算机、域控制器、互联网验证服务 (`IAS`) 服务器和互联网信息服务\
  \ (`IIS`) 服务器。配置安全模板。部署安全模板。排除安全模板问题。根据计算机角色配置额外的安全。服务器计算机角色包括 `SQL Server` 计算机、`Exchange\
  \ Server` 计算机、域控制器、互联网验证服务 (`IAS`) 服务器和互联网信息服务 (`IIS`) 服务器。客户端计算机角色包括台式、便携和自助机。\n\
  \n## 实现、管理和故障排除补丁管理基础设施\n\n计划服务包和热补的部署。评估服务包和热补的当前状态。工具包括 `Microsoft Baseline Security\
  \ Analyzer` (`MBSA`) 和 `MBSA` 命令行工具。部署服务包和热补。\n\n## 实现、管理和故障排除网络通信安全\n\n计划 `IPSec`\
  \ 部署。配置 `IPSec` 策略以保护网络与主机之间的通信。主机包括域控制器、互联网 Web 服务器、数据库、邮件服务器和客户端计算机。部署并管理 `IPSec`\
  \ 策略。排除 `IPSec` 故障。计划并实施无线网络安全。部署、管理和配置 `SSL` 证书，包括 `HTTPS`、`LDAPS` 和无线网络的使用。考虑因素包括更新证书以及获取自签名证书而非公开颁发的证书。为远程访问用户配置安全。\n\
  \n## 计划、配置和故障排除验证、授权和 PKI\n\n计划和配置验证。计划组结构。计划和配置授权。安装、管理和配置 `Certificate Services`。\n\
  \n# 实现 Microsoft Internet 安全与加速 (ISA) 服务器 2004\n\n## 计划和安装 ISA Server 2004\n\n计划\
  \ `ISA Server` 2004 部署。评估并配置操作系统、硬件和网络服务。部署 `ISA Server` 2004。\n\n## 安装和配置客户端\n\n\
  安装 `Firewall Client` 软件。为 `ISA Server` 2004 配置客户端。客户端类型包括 `Web Proxy`、`Firewall\
  \ Client` 和 `SecureNAT`。配置本地域表 (`LDT`)。使用 Web 代理自动发现 (`WPAD`) 配置 `ISA Server` 2004\
  \ 以自动配置客户端。诊断并解决客户端计算机连接问题。\n\n## 配置和管理 ISA Server 2004\n\n配置系统策略。备份和恢复 `ISA Server`\
  \ 2004。定义管理角色。配置防火墙设置。为网络负载均衡配置 `ISA Server` 2004。配置 `ISA Server` 2004 支持网络拓扑。\n\
  \n## 配置 Web 缓存\n\n配置正向和反向缓存。优化 `ISA Server` 2004 缓存性能。诊断并解决缓存问题。\n\n## 配置防火墙策略\n\
  \n计划防火墙策略。创建策略元素、访问规则和连接限制。策略元素包括计划、协议、用户组和网络对象。为 Web 发布创建策略规则。为邮件服务器发布创建策略规则。为服务器发布创建策略规则。\n\
  \n## 配置和管理远程网络连接\n\n为站点到 VPN 配置 `ISA Server` 2004。将 `ISA Server` 2004 配置为远程访问 VPN\
  \ 服务器。诊断并解决 VPN 连接问题。\n\n## 监控和报告 ISA Server 2004\n\n监控 `ISA Server` 2004 活动。配置并运行报告。配置日志和警报。\n\
  \n# TS: Microsoft Internet Security and Acceleration Server 2006, 配置\n\n## 计划和安装\
  \ ISA Server 2006\n\n计划 `ISA Server` 2006 部署。评估并配置操作系统、硬件和网络服务。部署 `ISA Server` 2006。\n\
  \n## 安装和配置客户端\n\n安装并配置 `Firewall Client` 软件。为 `ISA Server` 2006 配置客户端。客户端类型包括 `Web\
  \ Proxy` 和 `SecureNAT`。配置 `ISA Server` 以确保本地域流量留在本地网络。使用 Web 代理自动发现 (`WPAD`) 配置\
  \ `ISA Server` 2006 以自动配置客户端。诊断并解决客户端计算机连接问题。\n\n## 配置和管理 ISA Server 2006\n\n配置系统策略。备份和恢复\
  \ `ISA Server` 2006。定义管理角色。配置防火墙设置。为网络负载均衡配置 `ISA Server` 2006。配置 `ISA Server` 2006\
  \ 支持网络拓扑。监控 `ISA Server` 2006 活动。配置并运行报告。配置日志和警报。\n\n## 配置 Web 缓存\n\n配置正向和反向缓存。优化\
  \ `ISA Server` 2006 缓存性能。诊断并解决缓存问题。\n\n## 配置防火墙策略\n\n计划防火墙策略。创建策略元素和访问规则。策略元素包括计划、协议、用户组和网络对象。为\
  \ Web 发布创建策略规则。为邮件服务器发布创建策略规则。为服务器发布创建策略规则。\n\n## 配置和管理远程网络连接\n\n为站点到 VPN 配置 `ISA\
  \ Server` 2006。将 `ISA Server` 2006 配置为远程访问 VPN 服务器。诊断并解决 VPN 连接问题。\n\n### Sun Microsystems\n\
  \n\n\n\n\n在我开始介绍 Sun Microsystems 提供的卓越认证和培训之前，我必须先做一个免责声明：我对 Solaris 有极大的偏见，并且拥有该公司的提供的多项认证。这是因为在多年前，我在\
  \ `Solaris SunOS 4` 上“打响第一仗”，并在职业生涯中花费了大量时间坐在 Solaris 机器前……所以我对这个品牌的计算系统非常有偏好。\n\
  \n## 通用安全\n使用 `SMF`\n`SCSECA`\n\n### 审计与区域安全\n执行审计和日志记录\n`Solaris Audit`\n### 安装系统\n\
  描述最小化操作`\n\n### 最小权限原则\n使用 `Access Control` 和 `RBAC` 实现用户权限管理\n\n### 加密特性\n利用 `Cryptographic\
  \ Framework`\n`SCF`\n\n### 应用与网络安全\n使用 `Service Management Facility (SMF)`\n使用 `Access\
  \ Control`、`TCP Wrappers`、`IPfilter Stateful Filtering Firewall`、`Kerberos`、`SSH`\
  \ 和 `NFS4` 来保护网络。\n\n### 审计与区域安全\n使用 `Solaris Audit` 执行审计和日志记录\n## 区域安全\n在 Solaris\
  \ `Zones` 中实现安全策略\n\n\n\n\n有很多信息安全组织会发布关于行业动态的消息。其中一些是关注大趋势的全球性组织，而另一些则规模较小，关注特定问题，例如灾难恢复、信息系统安全、网络入侵等。根据你具体的关注点，你可能希望成为这些小组中一个或多个的成员。我列出了一些与渗透测试职业联系最紧密的组织。诚然，还有其他组织与\
  \ `PenTesting` 的联系非常松散，但其紧密程度不足以列入此列表（例如，高科技犯罪调查协会对法医感兴趣的人士非常有帮助，但它并不深入渗透测试）。\n\n\
  ### 美国工业安全协会 (ASIS)\n`ASIS` 创立于 1955 年，在全球范围内有 200 多个分会。根据其网站，`ASIS` 专注于安全专业人员的效率和生产力，并为其成员提供教育计划和会议。URL：[www.asisonline.org](http://www.asisonline.org)。\n\
  \n### 电气电子工程师学会 (IEEE)\n`This` 组织涵盖了信息系统的所有方面，并专门有一个针对计算机安全的学会。对于专业的渗透测试人员来说，`IEEE`\
  \ 计算机学会的安全与隐私技术委员会可能是最匹配的。他们全年赞助多个与信息安全相关的研讨会（会议）。URL：[www.ieee-security.org](http://www.ieee-security.org)。\n\
  \n### ISACA\n`ISACA` 在全球也设有地方分会，并为其成员提供会议、培训和每月会议。大部分信息旨在扩展成员在 `ISS` 审计和管理方面的知识，但专业的渗透测试人员可以从这种培训和组织支持中大获益。URL：[www.isaca.org](http://www.isaca.org)。\n\
  \n### 信息系统安全协会 (ISSA)\n`ISSA` 是一个面向信息安全专业人员的国际组织。该组织在全球范围内设有地方分会，经常为成员提供教育机会，包括会议、每月分会讲座和培训课程。URL：[www.issa.org](http://www.issa.org)。\n\
  \n## 会议\n\n从何开始呢？与信息安全相关的会议太多了，实际上根本不可能将它们全部列出来；尤其是因为每年都会出现新的会议。我在这里列出最熟悉的几个，但请理解这份列表只是全球会议的一小部分。许多会议会在提供计划内演示的同时，还会提供培训机会。培训课程的加入可能成为决定参加哪些活动以及跳过哪些活动的判别因素。然而，不要假设只有最好的会议才提供培训——`DefCon`\
  \ 是最值得参加的会议之一，但它没有任何培训课程（那些是留给在一周前举办的 `Black Hat` 的）。只是说服管理层将培训课程与安全会议相结合更容易，这样差旅费用就可以限制在一次活动中。另一个可能影响你想要参加哪个会议的因素是你是否与政府机构合作。有些会议是专门为解决政府问题而创建的；其中一些仅限受邀。说到“仅限受邀”，有些公司也举办限制参加人员的会议。商业领域发生的规模较大的会议之一是\
  \ `Microsoft BlueHat Security Briefings`。但现在，我跳得有点快了；让我们来看看更热门的会议。这里是一份与协会、大学、公司或类似机构相关的更热门会议列表。我根据它们举办的典型月份对它们进行了分类。然而，由于某些会议发生在月份初或月底，这里列出的时间范围可能会有一个月的偏差。以这种格式呈现将让你能够更好地规划全年的日程。我标注了哪些会议在任何演示之外提供额外的培训，以防你感兴趣将培训成本合并到单一活动中。我还列出了针对政府、军方和/或执法人员的会议。这些会议的参加人数通常限制为政府员工或从事政府合同的人员。我将这些会议列入列表中，是因为无疑许多读者来自这个群体。对于那些无法参加的人，尽管如此也请查看这些网站，因为通常会有与演讲相关的文档。\n\
  \n**警告** 在参加会议时要小心，特别是关注黑客技术的会议——无论是否符合伦理。我见过有人把公司笔记本电脑带到这些会议。如果你参加一个周围有黑客的会议，你的系统很可能会受到攻击。我见过太多系统在这些活动被感染，以至于当有人携带可能带有公司数据的笔记本电脑时，我会感到惊讶。他们还不如对系统进行备份并在会议上传阅。\n\
  \n### 一月\n\n#### 国防部网络犯罪会议\n`DoD Cyber Crime Conference` 网站对该会议的描述如下：“本次会议关注计算机犯罪的所有方面：入侵调查、网络犯罪法、数字法医、信息保证，以及数字法医工具的研究、开发、测试和评估。这是一场网络犯罪会议。这不是一场信息保证会议”(Department\
  \ of Defense Cyber Crime Conference)。参加限制为以下人员：\n■ `DoD` 人员\n■ `DoD 赞助承包商\n■ 防御工业基础\
  \ (`DIB`) 合作伙伴 (`CPAC`)\n■ 联邦、州和地方执法部门\n■ `U.S.` 公民或在以下领域工作的 `U.S.` 政府代表：反情报特探、刑事调查员、计算机法医检查员、检察官、`DoD`\
  \ 信息保证/系统管理员、计算机法医研发人员、联邦、州和地方执法部门、上述领域的教育工作者。来自澳大利亚、加拿大、英国和新西兰的 `U.S.` 赞助政府代表也可以参加。\n\
  \n会议包含以下主题：\n■ 入侵调查\n■ 网络犯罪法\n■ 数字法医\n■ 信息保证\n■ 研究与开发\n■ 培训\nURL：[www.dodcybercrime.com](http://www.dodcybercrime.com)\n\
  \n## 二月\n\n\n\n\n\n# 网络与分布式系统安全会议 (NDSS)\nNDSS 会议侧重于网络和分布式系统安全相关的面向解决方案的科学技术论文。该活动在加利福尼亚州的圣地亚哥举行，为期三天，会议期间有几个不同的分会，但不包括额外的培训课程。URL：[www.isoc.org/isoc/conferences/ndss/](http://www.isoc.org/isoc/conferences/ndss/)\
  \ \n\n# ShmooCon\n该活动在华盛顿特区地区举行，为期三天，涉及“演示技术利用、创新的软硬件硬件解决方案，以及对关键信息安全问题的公开讨论”。第一天是单轨快速闪演讲“One\
  \ Track Mind”环节。接下来的 2 天有三个分会：Break It!、Build It! 和 Bring It On!（ShmooCon）。参与人数受到限制，该活动很快就会售罄。活动举办的实际月份在\
  \ 1 月到 3 月之间变动，因此访问 ShmooCon 网站以了解其实举办时间至关重要。URL：[www.shmoocon.org](http://www.shmoocon.org)\
  \ \n\n## 3 月\n\n### GOVSEC 与美国法律会议\n该会议在华盛顿特区地区举行，旨在“为用于确保我们国家及其人民安全的最新工具和战术提供见解。与会者主要是来自联邦政府的民用和军事安全专业人士，以及联邦、州和地方级别的执法人员和第一响应人员”（GOVSEC\
  \ Expo）。参会人员没有限制，会议主题分为以下演讲分会：\n- 反击恐怖主义\n- 保护关键基础设施\n- 安全与防护策略\nURL：[www.govsecinfo.com](http://www.govsecinfo.com)\
  \ \n\n### 密码学理论会议 (TCC)\n根据网站显示，TCC “处理概念化、定义和为自然密码问题提供解决方案的范式、方法和技术”（TCC Manifesto）。换句话之，你能想到的任何与加密相关的内容，无论是算法、通信问题还是与量子物理相关的。很多内容涉及理论，但对于一名专业的渗透测试员来说，了解这些并不是坏事。URL：[www.wisdom.weizmann.ac.il/~tcc/](http://www.wisdom.weizmann.ac.il/~tcc/)\
  \ \n\n## 5 月\n\n### ChicagoCon\nChicagoCon 举办两次，一次在春季，一次在秋季，目标是专业伦理黑客。那里也有培训课程，专门针对伦理黑客。ChicagoCon\
  \ 相比其他一些会议的优势在于有一个与会议相关的非常活跃的网站：[www.ethicalhacker.net](http://www.ethicalhacker.net)；URL：[www.chicagocon.com](http://www.chicagocon.com)\
  \ \n\n### IEEE 安全与隐私专题会议\n最受欢迎的会议之一是“IEEE 安全与隐私专题会议”，每年 5 月左右在加利福尼亚州的奥克兰举行。首届会议于\
  \ 1980 年举行，侧重于计算机安全和电子隐私（IEEE Symposium on Security and Privacy）。现场提供额外的培训课程。URL：[www.ieee-security.org/TC/SP-Index.html](http://www.ieee-security.org/TC/SP-Index.html)\
  \ \n\n## 6 月\n\n### 联邦安全会议 (FISC)\n该会议在我的家乡举行，我有幸参加过两次。FISC 为期两天，针对符合条件的军方和政府人员（Federal\
  \ Security Conference），涵盖以下主题：\n- DIACAP\n- 风险管理\n- HSPD-12\n- 渗透测试\n- INFORSEC\
  \ 培训\n- 密码学\n- DoD 8570.1\n- IPv6\n- 网络安全\n- FISMA\n\n### 可靠系统与网络国际会议 (DSN)\n该会议在全球范围内举行，第一天设有举办讨会和工作坊，并有关于信息系统性能和可靠性的\
  \ 3 到 4 个并行分会。虽然会议的大部分针对渗透测试，但非常值得参加。URL：[www.dsn.org/](http://www.dsn.org/) \n\n\
  ### REcon\nREcon 专注于反向工程，在蒙特利尔举行，提供为期 3 天的单轨演讲（这样就不会错过任何内容）。在正式演讲前 3 天提供额外的反向工程培训。培训名额非常有限（约\
  \ 10 席），如果你想参加，越早报名越好。URL：[www.recon.cx](http://www.recon.cx) \n\n## 7 月\n\n###\
  \ Black Hat\nBlack Hat 始于 1997 年，可能是最著名的信息安全会议之一。活动在拉斯维加斯举行，在 DefCon（见 8 月）之前进行，更多关注企业级安全问题。现在名为\
  \ Black Hat USA 的会议已扩展到 2 月在华盛顿特区的 Black Hat DC，以及 4 月左右在各国举办的 Black Hat Europe。培训活动在会议前\
  \ 4 天举行，使得 Black Hat 活动成为一个为期一周的活动（如果你留下来参加 DefCon 的话）。他们还在亚洲举办过活动，但不清楚这是否会成为常规活动。URL：[www.blackhat.com](http://www.blackhat.com)\
  \ \n\n### 计算机安全基础研讨会\n该研讨会于 1988 年作为“IEEE 计算机学会安全与隐私技术委员会”的研讨会创立，每年在全球举办。面向计算机科学研究人员，主题涵盖各种安全问题，包括协议和系统安全（IEEE\
  \ Symposium on Security and Privacy）。URL：[www.ieee-security.org/CSFWweb/](http://www.ieee-security.org/CSFWweb/)\
  \ \n\n### 地球黑客 (HOPE)\nHOPE 会议每两年在纽约市举行一次。在宾夕法尼亚酒店举办的两天活动，HOPE 在偶数举行，包含许多关于个人隐私、黑客和社交工程的演讲。URL：[www.hope.net](http://www.hope.net)\
  \ \n\n## 8 月\n\n\n\n\n\n# DefCon\n无疑是最大的信息安全会议，该活动于 1993 年开始，每年在黑帽（Black Hat）会议之后的一个周末在拉斯维加斯举行，为期三天。`DefCon`\
  \ 没有额外的培训活动，主要因为它与黑帽会议有紧密联系，后者在该周内有许多培训活动。2008 年的参加人数超过 8,000 人，包括五个演讲分会，不包括涵盖无线黑客、开锁和硬件黑客等主题的分会活动。另一个大活动是夺旗挑战赛（Capture\
  \ the Flag），汇集了来自世界各地的队伍。`DefCon` 以更加地下而闻名，这在当今的安全环境下可能是不准确的，特别是考虑到现在的参加人数。URL：[www.defcon.org](http://www.defcon.org)\n\
  \n# 国际密码学会议\n该会议由国际密码学研究协会（IACR）赞助，在加利福尼亚州的圣塔芭芭拉举行。会议内容涉及密码学的技术方面。海外还举办两个额外的会议——一个在欧洲（`Eurocrypt`），一个在亚洲（`Asiacrypt`），每年在不同的国家举行（通常欧洲在\
  \ 12 月，亚洲在 5 月）。URL：[www.iacr.org/conferences/](http://www.iacr.org/conferences/)\n\
  \n# USENIX 安全研讨会\n该会议始于 1993 年，最初零星举行。现在它已成为年度会议，USENIX 社区通过该安全研讨会探讨计算机系统和网络安全的最新进展。该会议还有额外的培训机会以及关于不同安全主题的研讨会。URL：[www.usenix.org/events/bytopic/security.html](http://www.usenix.org/events/bytopic/security.html)\n\
  \n## 九月\n\n### 欧洲计算机安全研究研讨会\n该会议在西欧举行，多年来一直是每两年举办一次，并自誉为“欧洲计算机安全理论与实践的领先研究型会议”（(ESORICS,\
  \ 2009)）。如今，该活动每年举办一次，持续 5 天，演讲之后还会有研讨会。URL：[www.laas.fr/~esorics/](http://www.laas.fr/~esorics/)\n\
  \n### 入侵检测最新进展国际研讨会 (RAID)\n该会议每年在西欧和美国之间轮换举办，2007 年在澳大利亚除外。该会议的目的非常明确——讨论与入侵检测和防御相关问题和技术，并自\
  \ 1998 年以来一直。除了演讲之外，没有额外的培训机会。URL：[www.raid-symposium.org/](http://www.raid-symposium.org/)\n\
  \n### ToorCon\n`ToorCon`在加利福尼亚州的圣地亚举行，为期 2 天。第一天是小时演讲，第二天旨在对较短的主题提供较短的演讲。会议演讲开始前会有为期两天的培训活动。使用两个不同的会议室，并没有遵循任何特定的主题，这意味着你可能必须在同时发生的两个有趣的演讲之间选择。URL：[www.toorcon.org](http://www.toorcon.org)\n\
  \n## 十月\n\n### 互联网测量会议 (IMC)\n尽管标题看起来与 ISS（信息系统安全）或专业渗透测试无关，但该会议包含了许多真正相关的课题，包括网络安全威胁与应对措施、网络异常检测以及协议安全（互联网测量会议）。URL：[www.imconf.net/](http://www.imconf.net/)\n\
  \n### 微软 BlueHat 安全简报\n如前所述，该会议仅接受邀请。旨在提高微软产品的安全性，演讲者由微软员工、非微软研究人员和其他安全专业人员组成。由于其排他性，为期两天的活动没有额外的培训机会。URL：[`technet.microsoft.com/en-us/security/cc261637.aspx`](http://technet.microsoft.com/en-us/security/cc261637.aspx)\n\
  \n## 十一月\n\n### 计算机协会（ACM）计算机与通信安全会议\nACM 于 1993 年开始举办此会议并在美国各地举行，但主要在东海岸。该会议主要关注信息和系统安全，并设有线下培训研讨会。URL：[www.sigsac.org/ccs.html](http://www.sigsac.org/ccs.html)\n\
  \n## 十二月\n\n### 年度计算机安全应用会议 (ACSAC)\n该会议主要在美国南部举行（佛罗里达州和加利福尼亚州之间的任何地方），关注信息系统安全。会议持续\
  \ 5 天，在会议的前两天会有全天的教程和研讨会，涵盖与系统和网络安全相关的各种技术。URL：[www.acsac.org/](http://www.acsac.org/)\n\
  \n### 混沌通信大会 (Chaos Communication Congress)\n混沌通信大会是每年在德国柏林举行的会议。该活动涵盖了关于技术和政治问题的各种演讲和研讨会。根据网站，讨论了以下六个主题(混沌通信大会,\
  \ 2008):\n- **黑客**：编程、硬件黑客、密码学、网络和系统安全、安全漏洞以及技术的创造性使用\n- **制作**：电子产品、3D 打印、气候变化生存技术、机器人和无人机、蒸汽机、替代交通工具\n\
  - **科学**：纳米技术、量子计算、高频物理、生物技术、脑机接口、监控录像的自动分析\n- **社会**：黑客工具与法律、监控实践、审查、知识产权和版权问题、数据留存、软件专利、技术对孩子的影响以及技术对整个社会的影响\n\
  - **文化**：电子艺术品、单口喜剧、极客娱乐、视频游戏和桌游游戏文化、音乐、3D 艺术\n- **社区**：自由活动\n还有额外的研讨会，但这些主要关注上述列出的主题，并是以某种随机创建的。URL：[`events.ccc.de/congress/`](http://events.ccc.de/congress/)\n\
  \n## 本地社区\n\n\n\n\n尽管作为安全组织成员获得了许多优势，并且在大量会议上学习了知识，但有时时候，一个规模更小、目标更集中的群体在理解信息系统安全概念方面也能提供独特的见解。这正是本地社区大显身场的地方。这些小组模仿过去的计算机小组，如今的兴趣小组关注一个非常特定的主题，以便成员能够真正理解这些概念并进行动手学习。很有可能，在你自己的家乡就有不少这样的社区——你只需要知道它们存在即可。\n\
  \n## 本地大学\n信不信由，大学校园内有许多学生团体允许非校学生参与俱乐部活动。在会议中加入当地人才是合理的，包括那些仅仅对该主题感兴趣的人。通常，学校会成为某些国家级组织的赞助商，例如本地\
  \ `DefCon` 小组、`Linux Users’ Groups` (`LUGs`)、`Snort Users’ Groups` 等，这些组织对所有人开放。\n\
  \n## DefCon 小组\n这些小组始于 2003 年，在全球范围内每月举行，并在当地进行组织。对于任何本地小组，演讲和聚会的质量直接与其成员的努力程度相关；然而，只要有合适的性格和活跃的兴趣，这些小组就能为进行\
  \ `PenTest` 攻击提供大量的优质信息。\nURL: [www.defcon.org/html/defcon-groups/dc-groups-index.html](http://www.defcon.org/html/defcon-groups/dc-groups-index.html)\n\
  \n## 2600 小组\n举办 `HOPE` 会议的人也推广本地的 `2600` 小组。这些本地小组专注于与 `HOPE` 会议相同的内容，在黑客方面拥有丰富的知识。\n\
  URL: [`2600.org/meetings/mtg.html`](http://2600.org/meetings/mtg.html)\n\n## 混沌计算机俱乐部\
  \ (CCC)\n这些本地小组主要位于德国，为成员提供与 `CCC` 柏林年会上找到的同样的黑客知识。\nURL: [www.ccc.de](http://www.ccc.de)\n\
  \n## 黑客空间 (Hacker Spaces)\n起源于欧洲，`Hacker Spaces` 的概念——本地黑客可以见面并参与小组项目的地方——跨越海洋并在美国继续发展。每个地点都有不同的特色，并且通常有一个共同主题，无论是软件黑客、硬件黑客、游戏黑客还是其中的任何内容。\n\
  URL: [`hackerspaces.org`](http://hackerspaces.org)\n\n## USENIX\n虽然这些小组并非专注于信息安全，但它们涵盖了各种\
  \ `UNIX` 和 `Linux` 主题，包括这些系统的安全性。如果你的兴趣扩展到 `UNIX` 和 `Linux` 环境，请查看这些小组。\nURL: [www.usenix.org/membership/ugs.html](http://www.usenix.org/membership/ugs.html)\n\
  \n## Snort 用户组\n如果你对入侵检测感兴趣，你可能想查看 `Snort` 用户组。虽然这个小组可能与渗透测试直接相关，但它确实提供了关于网络安全的见解，这对\
  \ `PenTesting` 有益。\nURL: [www.snort.org/community/usergroups.html](http://www.snort.org/community/usergroups.html)\n\
  \n## 邮件列表\n虽然与上述许多会议相关的某些邮件列表，但如果你计划成为渗透测试员，还有你绝对需要注意的一些额外邮件列表。可能是寻找与 `PenTest`\
  \ 相关的良好邮件列表的地方是 `www.securityfocus.com/archive`，那里有以下列表（以下描述直接来自 `Security Focus`）：\n\
  \n### Bugtraq\n一个用于详细讨论和公告计算机漏洞的全公开披露邮件列表：漏洞是什么、如何利用它们以及如何修复它们。\n\n### Focus on\
  \ Microsoft\n该列表讨论了用于帮助评估、保护和修补微软技术的各种安全机制的“如何做”和“为什么”。该列表旨在为网络系统管理员和安全专业人员提供辅助。\n\
  \n### Focus-IDS\n一个用于讨论入侵检测及相关技术的审核邮件列表。这包括基于主机和基于网络的入侵检测系统 (`NIDS/HIDS`)、入侵预防系统\
  \ (`IPS`)，以及其他相关和即将推出的技术。\n\n### INCIDENTS\n`INCIDENTS` 邮件列表是一个轻度审核的列表，便于快速交换安全事件信息。\n\
  \n### Penetration testing (渗透测试)\n该列表旨在让人们讨论专业的渗透测试和通用网络审计。\n\n### Security Basics\
  \ (安全基础)\n该列表旨在讨论各种安全问题，全部面向安全初学者。这是一个在不畏惧的环境中学习门道的地方，甚至是对于可能是某个特定领域的专家但寻求增加信息安全其他领域知识的人来说。`Security-Basics`\
  \ 邮件列表旨在协助负责保护单个系统（包括自己的家庭电脑）和小型 `LANs` 的人员。这包括但不限于小型公司、家庭企业和家庭用户。\n\n### SecurityJobs\
  \ (安全工作)\n虽然这个与渗透测试并不真正相关，但随时关注行业对员工（包括 `PenTest` 工程师）的需求始终非常重要。`SecurityJobs` 是\
  \ `SecurityFocus` 上开发的一个邮件列表和论坛，旨在帮助 IT 安全专业人士在所在领域寻找工作。该列表为寻找人选的雇主和寻求工作的个人共同维护。\n\
  \n\n\n\n尽管我们涵盖了许多职业选择和继续教育机会，但请记住，并没有一条百分之百的路径可以让你成为专业的渗透测试工程师或经理。本章将帮助你定义你想做什么以及你可以专长的领域，但就像任何其他职业一样，你需要进行仔细计划，并预留出完成目标之前所需的时间。正如我在本章开头提到的，如果你能成为\
  \ IT 或计算机科学领域某个领域的专家，那将非常有帮助。通过成为某个领域的“大师”——无论是网络架构、系统设计，还是应用程序和数据库——专注于一个领域将帮助你从通才型人才中脱颖而出。无论你对证书的价值持什么态度，大公司的人资源部门（HR）往往会因为没有合适的证书而丢弃你的简历。在找工作时，这是否真的是寻找合适人选的最佳方法并不重要；证书是\
  \ HR 快速筛选可能候选人的简便方法。不要因为哲学上的争论而错失你的理想工作。一旦你获得了正确的证书，请确保跟上 `ISS` 领域的最新进展。本地和国际组织可以提供帮助。参加每月会议；除了听取其他小组成员和专业人士的简报的好处外，即使你是\
  \ `ISS` 领域的新手，也可以进行大量的人脉建立。当你有机会申请渗透测试工程师职位时，成为一个老面孔有助于招聘决策。此外，通过加入邮件列表来关注日常动态。我无法强调这些邮件列表有多么有益，你越早知道漏洞或利用程序，就能越快地保护你的组织系统（或者更好，是在黑客动手之前你自己利用它们）。这看起来可能很多，但正如我提到的，你的大部分工作将是学习。新的技术不断被发明出来以绕过网络内的安全设备。作为专业的渗透测试员，你的任务就是像黑客出现时一样迅速地掌握这些技术。最糟糕的事情莫过于进行渗透测试并告诉客户他们的系统是安全的，结果后来发现你漏掉了一个存在几个月（甚至几年）的漏洞，而该漏洞可以让你客户的网络崩溃——尤其是当是客户在网络瘫痪后通知你该漏洞时。\n\
  \n## 解决方案快速通道\n\n## 职业路径\n\n- 渗透测试专业可以细分为三个不同的领域：网络、系统和应用程序。\n- 具有网络架构背景的渗透测试人员可以识别各种网络设计的缺陷以及这些设计中元素的布局。\n\
  - 专攻系统管理的渗透测试人员通常从一种操作系统开始，然后通过学习安全通信协议、文件共享、目录服务、系统加固、备份过程等内容来扩展相关知识。\n- 专攻应用程序和数据库的渗透测试人员通常理解创建应用程序的要素（作为编程人员或编程团队的经理），以及它们如何与数据库交互。\n\
  \n## 证书\n\n- 政府内部获取证书的一个主要推动是 `DoD Directive 8570`，该指令规定了各种工作职位的要求以及担任这些职位所需的证书。\n\
  - 证书和学位除了证明你能参加考试之外，并不能“证明”任何事情。\n- 证书和学位通常是通过 HR 筛选的，这样你才能获得面试机会。\n- 政府机构对某些职业要求特定的证书。\n\
  \n## 协会与组织\n\n- 有各种信息安全组织发布行业动态新闻，包括本地和国家协会。\n- 许多安全会议在提供计划演讲的同时也提供培训机会，让渗透测试人员扩展其培训机会。\n\
  - 有一些邮件列表为渗透测试人员提供与信息安全相关的最新新闻和漏洞。\n\n**问：** 我必须拥有证书才能进行渗透测试吗？\n**答：** 渗透测试职业本身没有证书要求。然而，雇主可能不倾向于雇佣没有行业认可证书的人。获得证书通常是通过\
  \ HR 筛选的必要条件。\n\n**问：** 我应该获得什么样的证书来成为一名专业的渗透测试员？\n**答：** 这完全取决于你的兴趣。如果你对网络或操作系统感兴趣，请获得你偏好的供应商特定提供的特定网络或操作系统安全证书。如果你对数据库或应用程序感兴趣，请寻找高级证书，并结合你感兴趣的语言或数据库版本的特定证书来支持它们。\n\
  \n**问：** 我如何找到一个专门从事渗透测试的本地协会？\n**答：** 虽然没有专门专注于渗透测试的组织，但有许多关注信息系统安全的组织。访问本章列出的组织网站，寻找本地小组的列表。\n\
  \n## 扩展你的技能\n\n想了解有关信息收集的内容？以下练习旨在为你提供额外的知识和技能，以便你更好地理解这个主题。\n\n### 职业规划\n\n1. 创建一份简历，列出你理想的安全和/或管理证书列表，并包含以下内容：\n\
  \    - 一种高级证书。如果有额外的细分领域证书，也请选择其中之一。\n    - 根据你的兴趣（无论是网络、系统还是应用程序）选择多个特定系统的证书。解释你的选择以及它们将如何作为专业的渗透测试员帮助到你。\n\
  2. 解释你的选择以及它们将如何作为专业的渗透测试员帮助到你。\n\n### 安全相关组织\n\n1. 根据你在 `练习 3.1]` 中创建的简历，识别那些加入成员对你有益的组织。\n\
  2. 解释你的选择以及它们将如何作为专业的渗透测试员帮助到你。\n\n\n\n\n\n## 安全会议与本地小组\n\n1. 在互联网上搜索与您在练习 3.1 中选择的认证相匹配的安全会议。\n\
  2. 在互联网上搜索并识别能够帮助你在所选认证的主题内继续受教育的本地小组或会议。列出会议日期并参加其中一项活动。\n3. 解释你的选择以及这些选择将如何帮助作为专业渗透测试员的你。\n\
