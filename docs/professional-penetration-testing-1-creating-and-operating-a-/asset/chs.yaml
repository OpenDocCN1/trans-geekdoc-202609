  \n很有可能第 7 跳设备是一个路由器，我们可以通过端口扫描来探索这种可能性（我们在本例中没有这样做）。但有趣的是，到达最终目的地——74.125.45.100\
  \ 我们经过了许多不同的网络。如果我们对剩余 IP 地址执行 `whois`，会发现它们都属于 [Google.com](http://Google.com)。\n\
  \n\n\n\n识别网络边界不需要做太多工作，但它是任何渗透测试中都至关重要的一步。这一步的主要目标是确保我们没有攻击任何未获得许可攻击的对象。如果你与客户的合同中指明了特定的\
  \ IP 地址，那么事情就会变得简单得多，因为你只需要接触那些系统即可。然而，如果你的工作是对网络进行渗透测试，你需要敏锐地意识到网络中实际上包含什么，以及哪些系统是在范围之外的。此外还要注意，目标系统可能会拦截互联网控制消息协议（`ICMP`）消息以躲避检测。我们将在第\
  \ 10 章中讨论如何使用其他方法检测系统。\n\n## 网络侦测\n\n一旦我们对目标网络中的边界有了大致了解，就需要识别出该网络中的所有设备。在这个阶段，我们并不试图弄每个设备是什么（路由器、交换机、防火墙、服务器或其他）——我们只是在尝试识别网络中有多少个系统以及它们相关的\
  \ IP 地址。稍后，我们将扫描每一个系统以获取更多信息，但现在我们只需要创建一个清单，以便根据需要来精简我们的工作并在必要时调整项目时间表。要做到这一点，通常一个简单的扫描就足够了。在图\
  \ 9.31 中，你可以看到我某个实验室中的 `Nmap` 扫描结果。扫描器在网络中检测到四个主机（包括扫描系统）。然而，这一步的诀窍在于至少使用两种不同的工具对你的目标网络进行网络侦测。由于系统上存在安全机制，系统可能不对某个扫描器做出响应，这并不稀奇。为了看到这一过程，在图\
  \ 9.31 中，我们还可以看到对 `Nmap` 扫描中识别出的几个系统进行 `ping` 的结果——特别是 `192.168.1.100` 和 `192.168.1.123`。\n\
