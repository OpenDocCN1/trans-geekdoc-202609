  \ `CCIE` 参与过渗透测试项目。我绝不是说在渗透测试项目中拥有一位 `CCIE` 是多此一举或毫无效率的——仅仅是 `CCIE` 有许多大得多的问题需要处理，而且他们的薪水远高于普通渗透测试工程师能拿到的。如果能聘请一位\
