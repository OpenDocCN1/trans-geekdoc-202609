  _ksaproc.pdf](http://www.drizzle.com/~aboba/IEEE/rc4_ksaproc.pdf)。\n3. 定义以下：■ RC4\
  \ ■ 不不变性\n4. 根据 Scott Fluhrer、Itsik Mantin 和 Adi Shamir 的出版，如果 IV 长度为 10，预计 IV 的数量是多少？\n\
  \n参考文献\nMertvago, P., *The comparative Russian-English dictionary of Russian proverbs\
  \ & sayings*. (1995) Hippocrene Books, New York . Open Information Systems Security\
  \ Group., *Information Systems Security Assessment Framework (ISSAF) Draft 0.2.1B*.\
  \ (2006) ; 来自 Open Information Systems Group 网站：[www.oissg.org/downloads/issaf/information-systems-security-assessment-framework-issaf-draft-0.2.1b/download.html](http://www.oissg.org/downloads/issaf/information-systems-security-assessment-framework-issaf-draft-0.2.1b/download.html)。\n\
  \n\n\n常客会招人厌。—— 俄罗斯谚语：“常客是不受欢迎欢迎的。”(Mertvago, 1995) 一旦获得了目标系统的访问权限，我们需要维持这种访问。在渗透测试期间，出现系统维护窗口并不罕见——如果计划中的维护部分是为了修复我们所利用的漏洞，那么我们的访问可能会被终止。此外，如果系统重启或我们丢失了网络连接，远程\
  \ shell 访问可能会永久丢失。\n\n在渗透测试中，使用后门非常常见。通常需要找到方法绕过防御障碍，例如防火墙或访问控制列表。后门可以绕过所有这些防御，让专业的渗透人员对受侵害的系统获得不受限制的访问。后门还可以加速对服务器的访问，例如第\
  \ 10 章中和第 11 章中的 Webmin 示例——执行 Debian Open Secure Sockets Layer (SSL) 漏洞利用需要几个小时，而每次需要访问时都重复执行该利用将过于繁琐。\n\
  \n快速访问受害者机器的另一个优势是，一旦进入网络，工程师就有了更大的自由来扫描和攻击系统，因为网络防御通常只寻找外部攻击——来自网络内部系统的攻击可能不会被察觉。如果我们使用加密建立后门，就可以更好地隐藏我们的活动。在第\
  \ 11 章中，我们使用 `CORE IMPACT` 向目标系统注入代理（agents）。这些代理可以被持久化，有效地成为根据需要访问访问后后门。如果我们必须跨越多个网络的多个系统以到达最终目标，这些代理也可以用于从一个系统跳到下一个系统。`CORE\
  \ IMPACT` 将所有代理加载到内存中，这降低了检测到的概率，因为受侵害系统上没有安装任何文件。在内存中安装的缺点是如果系统重启，代理将会丢失。如果我们绝对需要一个持久连接，我们可能希望在系统上安装后门应用程序，而不仅仅是内存。有使用\
  \ `IMPACT` 创建持久连接的方法，但在受侵害系统中创建后门最简单的方法是使用 `netcat`。\n\n# Shell 与反向 Shell (Shells\
  \ and Reverse Shells)\n\n`netcat` 是一种系统管理员用于提供两个系统之间连接的应用程序。`netcat` 可以作为服务器也可以作为客户端——如果我们希望\
  \ `netcat` 监听连接，我们也可以配置它在连接建立时产生 shell，为我们提供对系统的命令行访问。如果我们持续访问网络，我们可能希望设置 `netcat`\
  \ 在受利用的系统上监听连接。然而，大多数使用 `netcat` 的渗透测试配置将设计为“拨家”（phone home）或请求从受利用系统到渗透测试工程师控制的攻击服务器的连接。最后这种方法被称为`反向\
  \ shell`（reverse shell）。对于我们使用 shell 和反向 shell 作为维持服务器访问方法的示例，我们将使用在图 13.1 所示的网络配置，并使用实验室中的\
