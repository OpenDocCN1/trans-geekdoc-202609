  很难知道你上传到目标系统的文件是否会触发主机入侵检测系统（HIDS）的报警。除非你对被攻的系统拥有不受限制的访问权限（这在开始是不常的），否则你可能只能碰运气上传文件，并希望不要发生任何事。为了消除这种“赌运气”，你可以采取步骤修改你的工具，使其完全避免被检测。互联网上有许多教程讨论了如何修改二进制文件，使其与杀毒软件或入侵检测系统（IDS）的特征码不匹配。可能与本章最相关的标题为“夺回\
  \ Netcat（Taking Back Netcat）”，可以在网上找到：[`packetstormsecurity.org/papers/virus/Taking\\\
  _Back\\_Netcat.pdf`](http://packetstormsecurity.org/papers/virus/Taking_Back_Netcat.pdf)。现在我们已经离开了明文的\
  \ `netcat` 反向隧道并改用加密的 `SSH` 隧道，我们可以更激进地向 Hackerdemia 服务器传输漏洞代码，而无必担心被入侵检测/防御系统检测到。这将增加我们在被攻系统上维持访问权限的时间，因为我们现在通过使用加密通信通道来避免网络检测。\n\
  \n# 其他加密和隧道方法\n\n`SSH` 并不是通信隧道加密的唯一方法。还存在一些使用不同加密类型的隧道应用程序。以下是使用各种加密和隧道方法的工具列表，它们可以替代本章中演示的方法。\n\
  \n### Cryptcat\n与 `netcat` 类似，`cryptcat` 可用于建立系统之间的通信通道，包括 Linux、Microsoft Windows\
  \ 和多个伯克利标准发行版（BSD）。其区别在于 `cryptcat` 可以使用 `twofish` 加密算法加密通道，这是一种对称密钥块加密算法。要使用加密，两个系统必须拥有相同的密钥，这在设置\
  \ `cryptcat` 时需要额外的工作。\n- 首页：[`cryptcat.sourceforge.net`](http://cryptcat.sourceforge.net)\n\
  \n### Matahari\n`matahari` 是一个用 Python 编写的反向超文本传输协议（HTTP）shell，它可以尝试以不同的间隔通过端口 80\
  \ 连接到你的攻击系统；最快每 10 秒一次，最慢每 60 秒一次。`Matahari` 使用 `ARC4` 加密算法加密系统之间的数据。`ARC4` 现在是一个过时的加密方法，但在渗透测试环境中仍然有用。\n\
  - 首页：[`matahari.sourceforge.net`](http://matahari.sourceforge.net)\n\n### Proxytunnel\n\
  这是一个同样通过 HTTP(S) 代理传输数据的有用工具。如果公司网络禁止除 HTTP(S) 连接外的所有出站通信，`Proxytunnel` 可以创建一个通到我们攻击系统的\
  \ `OpenSSH` 隧道，为我们提供访问受害者服务器的 shell 权限。\n- 首页：[`proxytunnel.sourceforge.net`](http://proxytunnel.sourceforge.net)\n\
  \n### Socat\n与 `netcat` 类似，`socat` 在服务器之间创建通信通道。与 `netcat` 不同，`socat` 可以使用 `OpenSSL`\
  \ 加密流量，允许额外的连接选项，例如使用 `HTTPS` 或 `SSH` 直接连接到端口。`Socat` 通过允许用户派生进程、生成日志文件、打开和关闭文件、定义\
  \ IP 协议（`IPv4` 或 `IPv6`）以及管道数据增加了额外的灵活性。\n- 首页：[[www.dest-unreach.org/socat/](http://www.dest-unreach.org/socat/)\n\
  \n### Stunnel\n该应用程序是一个 SSL 封装器——这意味着它可以用于加密仅发送明文数据的应用程序流量，而无需重新配置应用程序本身。明文数据的示例包括由邮局协议（POP）2、`POP3`、互联网邮件访问协议（IMAP）、简单邮件传输协议（SMTP）以及\
  \ `HTTP` 应用程序生成的任何内容。一旦配置 `stunnel` 加密数据通道，通过该端口的任何内容都将使用 `SSL` 加密。发送接收系统都需要 `stunnel`，以便流量在传递给相应的应用程序之前还原为明文。\n\
  - 首页：[`stunnel.mirt.net/`](http://stunnel.mirt.net/)\n\n这些隧道具有非常特定的应用，例如通过 HTTP(S)\
  \ 代理建立隧道，而另一些则是 `netcat` 的加密版本。使用哪种应用程序取决于包含目标系统的网络架构和个人偏好。在使用任何加密方法之前，额外的考虑因素是被加密数据的敏感性以及攻击系统相对于受害者的位置。如果我们正在攻击一个系统并下载客户数据以证明破解是可能的，我们应该使用高级加密工具。所有提到的工具在在使用之前都需要额外的配置；如果通过通道发送的数据不敏感，或者我们在闭环网络中进行测试，那么设置加密隧道花费的时间可能更好地花在其他任务上。\n\
  \n## 总结\n\n在渗透测试中使用后门至关重要，这样我们就能对受害者系统保持持续访问。我们最初对系统的破解可能会由于系统补丁或网络更改被阻止，导致我们在任何需要访问系统时无法利用它。通过安装使用反向\
  \ shell 的后门，我们可以规避阻止入站流量的防火墙，同时仍在目标网络内部继续渗透活动。开源工具 `netcat` 是一个可以在两个系统之间创建通信通道的有效应用程序。通过简单的脚本编写，`netcat`\
  \ 可以创建一个反向 shell，按我们选择的任何时间间隔连接回我们的攻击系统。使用 `netcat` 的缺点是我们的攻击服务器与受害者之间的所有通信都是明文发送的，这可能会被入侵防御系统识别并终止。为了避免检测，我们必须使用另一种通信模式——加密隧道。渗透测试人员有许多应用程序可用，可以在攻击系统和受害者服务器之间进行加密通信。通过理解网络，可以选择正确的工具来避免被可能监控基础设施中异常流量的网络安全工程师检测。\n\
  \n## 解决方案快速通道\n\n## Shell 和反向 Shell\n\n- 后门可以绕过所有防御，让渗透测试人员对被攻系统拥有不受限制的访问权限。\n-\
  \ 在内存中安装 shell 的缺点是如果系统重启，代理将丢失。\n- 后门将继承启动 `netcat` 进程者的相同权限。\n- 通过 `netcat` 通信连接发送的所有内容都是明文进行的——`netcat`\
  \ 不加密通信流。\n\n## 加密隧道\n\n- `SSH` 隧道允许将恶意软件和额外的漏洞放置到受害者系统中，而不被网络检测系统发现，因为攻击系统和受害者之间的所有流量都是加密的。\n\
  - 根据攻击系统对目标服务器的可访问性，`SSH` 隧道可以配置为直接 shell 或反向 shell。\n\n\n\n\n用于跨代理和协议进行数据隧道的额外工具可能在所有操作系统上并不可用。即使底层通信协议不支持加密，也可以创建一个安全的隧道，从而隐藏原本可能被检测到的渗透测试活动。\n\
  \n**Q**：如果我没有服务器的权限，我该如何创建反向 shell？**A**：要向系统中创建后门，必须先利用目标系统。某些漏洞载荷（payloads）包含反向\
  \ shell，这使得本章的大部分内容变得意义；但是，在获得系统访问权限之前，创建后门只能等待。\n\n**Q**：我该如何创建一个运行在内存中的后门，例如 `CORE\
  \ IMPACT` 那样？**A**：问得好——我希望我也知道。虽然拥有内存中的后门会有帮助，但在专业的渗透测试中，让应用程序来处理后门通常比自己设置一个更明智。安装后门所需的时间通常花在其他活动上会更好。这是一个优先级问题——在大多数情况下，我直接让\
  \ `CORE IMPACT` 来处理一切。\n\n**Q**：好吧，这没什么帮助——我真的需要一个运行在内存中的后门。**A**：你应该查看一下根内核程序（rootkits）。有些运行在内存中并提供远程连接。\n\
  \n**Q**：我应该对未加密的隧道有多担心？**A**：除了避免检测之外，加密隧道还能保护客户端的数据。在专业的渗透测试中使用加密数据是明智的选择。\n\n\
  ## 扩展你的技能\n\n想了解漏洞验证吗？以下练习旨在为你提供额外的知识和技能，以便你能够更好地理解这一主题。请使用你的实验室进行以下练习。\n\n### 创建\
  \ Netcat Shell\n1. 使用 `Hackerdemia` 服务器，在 `44444` 端口上创建一个 `netcat` 监听器，在建立连接时启动\
  \ shell。\n2. 使用 `BackTrack` 作为攻击系统，使用 `netcat` 连接到 `Hackerdemia` 服务器的 `44444` 端口。系统认为你是哪个用户？\n\
  3. 使用 `netcat` 连接查看 `Hackerdemia` 服务器上的 `/etc/shadow` 文件。列出了哪些用户？\n\n### 使用 Netcat\
  \ 传输文件\n1. 仿照 13.6 的方法，创建一个 `netcat` 连接，从 `Hackerdemia` 服务器下载 `/etc/shadow` 文件到攻击系统。\n\
  2. 在 `Hackerdemia` 服务器上使用了什么命令将 `/etc/shadow` 文件推送到远程系统？\n3. 在攻击系统上使用了什么命令从远程系统拉取\
  \ `/etc/shadow` 文件？\n\n### 创建 SSH 隧道\n1. 使用新鲜的 `Hackerdemia` 和 `BackTrack` 镜像，尝试在省略以下选项\
  \ `-o StrictHostKeyChecking=no` 的情况下重建 `SSH` 隧道。反向 shell 成功了吗？如果没有，为什么？\n2. 使用新鲜的\
  \ `Hackerdemia` 和 `BackTrack` 镜像，尝试在创建私公钥对时添加密码来重建 `SSH` 隧道。反向 shell 成功了吗？如果没有，为什么？\n\
  3. 在不跳过防火墙规则的情况下，直接从攻击系统到 `Hackerdemia` 服务器创建一个 `SSH` 隧道。你使用了什么命令？参考 Mertvago, P.,\
  \ *The comparative Russian-English dictionary of Russian proverbs & sayings*(1995)\
  \ Hippocrene Books, New York .\n\n# 第 14 章：隐藏踪迹\n\n## 引言\n\nНочь все покрыват。 –\
  \ 俄语谚语：*“黑夜掩盖一切。”* (Mertvago, 1995) 要完全成功利用一个系统，我们需要保持隐藏并避免检测。在游戏的这个阶段，我们已经成功避免了防火墙和入侵检测系统等网络防御设备的检测。我们的下一个挑战是在被利用的系统中避免检测。与网络防御相比，系统管理员使用类似的技术来识别恶意活动。系统管理员可以检查日志文件，安装监控恶意软件的应用程序，并设置查找未授权数据流的监控。管理员还可以查看系统上的进程，看是否有不适当的程序在运行（例如后门或暴力破解应用程序），并加固系统，以防止并警报核心系统文件内的任何更改。即使在成功利用目标系统后，渗透测试人员面临的挑战仍然有很多。在专业的渗透测试中，“隐藏踪迹”是一个不经常执行的步骤，但我们仍然会详细讨论，以便我们了解存在哪些障碍，这些障碍可能会阻止我们完全理解目标的安全态。\n\
  \n## 操纵日志数据\n\n系统管理员监控恶意活动时使用的主要方法是检查日志文件。我们需要关注的日志文件有两种通用类型——系统生成的和应用程序生成的。我们正在做什么将决定我们需要关注哪种日志文件。在我们开始操纵日志文件之前，让我们讨论一下我们的最终目标——隐性。在操纵日志数据时我们有两种选择。我们可以删除整个日志，也可以修改日志文件的内容。如果我们删除日志，就能确保我们所有的活动都是不可追溯的。一旦日志文件从系统中删除，管理员在尝试重现他们在系统上的攻击时将面临极其困难。如果我们需要隐藏关于我们身份或来源的任何痕迹，这就是有利的。删除日志数据也有缺点——检测。当日志文件被删除时（尤其是系统日志文件），系统管理员很可能会注意到该事件。日志文件存在多个原因——检测恶意活动只是其中之一。管理员使用日志文件确定系统的状态和健康，如果服务器出现异常，会立即参考日志文件。如果日志文件突然消失或大小异常，系统管理员通常会怀疑恶意用户。我们操纵日志数据的第二个选择是更改日志中的数据。如果我们试图提升服务器的权限，一旦成功，我们可以移除日志中与我们的攻击相关的任何数据，这样当系统管理员检查日志文件时就不会发现我们的活动。更改日志文件也有缺点——我们可能没有获取全部，或者删除得太多导致日志中的空隙变得明显。\n\
  \n**警告** 系统管理员另一种防止恶意用户篡改日志文件的防御方法是远程日志服务器。如果系统管理员配置系统将所有日志传输到专门用于保留日志数据的远程服务器，除了关闭传输进程或攻击远程日志服务器外，我们做不了。如果我们切断日志传输，就有在日志服务器上触发报警的风险，这意味着我们被抓了……假设真的有人在看日志（不太可能）。\n\
  \n### 用户登录\n\n让我们看看有人登录系统时会发生什么。图 14.1 是我们在 `Hackerdemia` LiveCD 上连接并提升权限后 `/var/log/secure`\
  \ 文件的截图。\n\n| ![f14-01.jpg 缺失](img/...) |\n\n| --- |\n| 图 14.1. |\n\n| 远程登录后 Hackerdemia\
  \ 磁盘上的 /var/log/secure 文件 |\n\n\n\n\n我们在图 14.1 中应该留注意的是，Hackerdemia 服务器记录了我们尝试切换到\
  \ root 账户的时间戳（09:31），以及我们是远程连接的（`pts/0`）。此外，我们还应该注意，只有 root 用户有权限写入 `/var/log/secure`\
  \ 文件。这意味着如果我们想以任何方式操纵数据，我们就需要 root 权限。在我们获得 root 账户的访问权限并修改日志之前，我们的登录活动是可被检测的。\n\
  \n**提示** 如果我们知道自己的攻击会产生日志数据，我们可能希望等到怀疑有人查看日志的概率最低时再进行，例如周末或深夜。此外，确切知道我们计划在攻击后如何获取\
  \ root 权限也是明智之举，这样我们就可以缩短可能被抓获的时间窗口。让我们看看如果有人通过终端（而不是远程）登录会发生什么情况。图 14.2 是在本地登录\
  \ Hackerdemia LiveCD 后 `/var/log/secure` 文件的截图。\n\n| ![B9781597494250000191/f14-02.jpg\
  \ is missing](img/f14-02.jpg) |\n| --- |\n| 图 14.2. |\n| 本地登录后 Hackerdemia 磁盘的 /var/log/secure\
  \ 文件 |\n\n在图 14.2 中，我们看到 `su` 尝试被记录了，并盖了时间戳（09:45），并注明了我们的连接来源（`vc/1`）。如果系统管理员足够警觉并查看了\
  \ `/var/log/secure` 文件，他们就能检测到我们的远程存在。如果我们想隐藏自己，我们需要删除删除或更改日志。如果我们决定删除它，我们将移除任何\
  \ `su` 尝试的痕迹；然而，它也会移除 `ROOT LOGIN on ‘tty1’` 这一行，这可能会被注意到。如果我们决定更改日志并移除 `pts/0 root-root`\
  \ 行，我们可能不会被发现。图 14.3 是我们移除 `pts/0 root-root` 行后 `/var/log/secure` 文件的截图。\n\n| ![B9781597494250000191/f14-03.jpg\
  \ is missing](img/f14-03.jpg) |\n| --- |\n| 图 14.3. |\n| 编辑后的 /var/log/secure 文件\
  \ |\n\n我们成功隐藏了行迹吗？既是也不是的。是的，我们删除了 `/var/log/secure` 文件中记录我们提升尝试的行，但我们还有另一个问题。让我们回来看图\
  \ 14.1。如果我们仔细观察，会发现文件上的时间戳（09:31）与日志中最后一行的时间戳（09:31）相匹配。如果我们查看图 14.3 来检查是否有任何差异，文件的时间戳是\
  \ 10:23，而日志中的最后一行时间戳是 09:47。对于一个警觉的系统管理员来说，时间戳的差异会让他们怀疑有人一直在篡改日志文件。如果我们愿意，我们可以在日志中添加包含虚假信息的新行。图\
  \ 14.4 是为了让日志数据与文件时间戳匹配的操作示例。\n\n| ![B9781597494250000191/f14-04.jpg is missing](img/f14-04.jpg)\
  \ |\n| --- |\n| 图 14.4. |\n| 修改日志文件并匹配时间戳 |\n\n让我们逐行查看我们所做的。\n\n```\nroot@slax#\
  \ more /var/log/secure\n```\n`more` 命令打印了文件，这样我们就能看到文件中已经添加了什么。从已存在的数据中，我们可以选择复制类似的内容或创建新数据。我们将使用最后的时间作为新数据的模板。\n\
  \n```\nroot@slax# date\nWed Apr 29 11:26:30 2009\n```\n我们需要知道系统时间是多少，以便匹配日志中的数据。\n\
  \n```\nroot@slax# echo ‘Apr 29 11:28:08 (none) su[3137]: vc/1 root-root’ >> /var/log/secure\n\
  ```\n我们创建一个与 `/var/log/secure` 文件数据混合的行，给一个未来的时间戳。\n\n```\nroot@slax# date\nWed\
  \ Apr 29 11:28:08 2009\n```\n一旦我们使用 `date` 命令再次检查，就会发现我们使用的时间戳与文件时间戳完全匹配。\n\n```\n\
  root@slax# touch -t 200904291128 /var/log/secure\n```\n此时，我们使用 `touch` 命令调整文件时间戳。正如我们所见，文件时间戳与日志匹配。成功！我们掩盖了时间戳，希望可以避免检测。\n\
  \n**你拥有，但无法隐藏**\n\n即使我们通过操纵日志文件隐藏了活动，系统管理员仍然可以检测到我们的存在，如图 14.3 所示。`who` 命令显示 root\
  \ 登录到了 `tty`（本地）和 `pts/0`（远程）。因为 IP 地址列在日志中，系统管理员可以进行分析并判断连接是否来自信任系统。我们修改了日志数据并不意味着我们有效地掩盖了行迹。\n\
  \n 应用程序日志\n应用程序也会记录数据，取决于应用程序的配置。在渗透测试期间，我们可能需要对远程服务进行暴力破解攻击。图 14.5 是对 Hackerdemia\
  \ 系统进行登录尝试的示例。\n\n| ![B9781597494250000191/f14-05.jpg is missing](img/f14-05.jpg)\
  \ |\n| --- |\n| 图 14.5. |\n| 登录失败 |\n\n如果我们查看图 14.6 中的 `/var/log/message` 文件，我们可以看到我们的连接尝试被记录了。\n\
  \n| ![B9781597494250000191/f14-06.jpg is missing](img/f14-06.jpg) |\n| --- |\n|\
  \ 图 14.6. |\n| /var/log/message 文件 |\n\n我们从图 14.6 中也可以看到，文件时间戳与最后一条记录匹配，在这种情况下，最后一条是系统注入的数据，由\
  \ `syslogd` 进程每 20 分钟“标记”一次 `/var/log/message` 文件，用于故障排除（包括查看文件是否被被篡改）。如果我们需要通过删除\
  \ `/var/log/message` 文件中的数据来隐藏失败的日志攻击（而不是删除整个文件），那么我们需要小心，不要移除 **MARK** 条目。\n\n\n\
  \n\n在渗透测试过程中，我们可能需要向被攻的系统添加文件和脚本。来自第 13 章 的一个示例是，我们使用 `netcat` 安装了一个后门。如果我们想让这个后门持久化，我们需要创建一个脚本并让它在每次被攻服务器重启时都启动。。如果我们不小心，系统管理员可能会发现我们的脚本并停止我们的攻击。为了隐藏文件，我们可以采取几种不同的方法——我们可以将其隐藏在显眼子底下，也可以让操作系统的文件结构来为我们完成工作。\n\
  \n## 在显眼子底下隐藏文件\n\n对于本次练习，我们将使用 Hackerdemia LiveCD 作为目标。图 14.7 是 Hackerdemia 服务器启动时运行的所有脚本的截图。\n\
  \n| ![B9781597494250000191/f14-07.jpg is missing](img/f14-07.jpg) |\n| --- |\n|\
  \ 图 14.7. |\n| rc.d 目录列表和 rc.netcat1 文件的内容 |\n\n在 `/etc/rc.d` 目录中，我们看到许多包含“netcat”字样的文件。如果我们检查第一个\
  \ `/etc/rc.d/rc.netcat1`，会发现该脚本将启动 `netcat` 来监听 1337 端口。它还创建了 `/tmp/netcat` 目录，其中包含几个文件（被\
  \ `/etc/rc.d/rc.netcat3` 和 `/etc/rc.d/rc.netcat4` 脚本使用）。对于未经训练的眼睛来说，`rc.netcat1`\
  \ 这个文件名可能看起来正常；但对于系统管理员来说，这个文件可能会触发警报。为了缓解查看该目录的系统管理员好奇心，我们需要对脚本进行伪装。\n\n**注意**\
  \ 本章使用的许多技术对于系统管理员来说是为人知的；然而，无论他们的知识和技能如何，仍然有可能在他们面前隐藏我们的活动。在当今的企业环境中，系统管理员任务过重，可能只是忙于无法尝试捕捉我们的攻击。图\
  \ 14.8 是对 Hackerdemia 磁盘进行 Nmap 扫描的结果。隐藏我们后门脚本的一种方法是在目标系统上找到当前运行但未作为启动脚本存在的进程。\n\
  \n| ![B9781597494250000191/f14-08.jpg is missing](img/f14-08.jpg) |\n| --- |\n|\
  \ 图 14.8. |\n| 对 Hackerdemia 服务器进行 Nmap 扫描 |\n\n尽管在这种情况下 `inetd` 守护进程负责在 21 端口启动文件传输协议\
  \ (FTP) 服务，但 FTP 也可以作为一个独立的进程启动，使得 FTP 成为我们脚本伪装的理想对象。第一步是更改文件名。我们可以将其重命名为 `/etc/rc.d/rv.ftpd`，这可能足以防止好奇的眼睛进行仔细观察。然而，`/tmp/netcat`\
  \ 目录的创建要明显得多。我们可以修改脚本，在不同的位置以不同的名称创建工作目录。为了做到，我们将使用不同的技术——利用文件系统隐藏数据。\n\n## 使用文件系统隐藏文件\n\
  \n图 14.9 是对 FTP 设置进行调查以及对 `/etc/rc.d/rc.netcat1` 文件修改的截图。我们需要做的第一件事是找到一个隐藏脚本的地方。我们看到\
  \ `/var/ftp` 目录包含一个上传目录，这意味着 `/var/ftp` 目录是运行在 21 端口的 FTP 服务的真实工作目录。\n\n| ![B9781597494250000191/f14-09.jpg\
  \ is missing](img/f14-09.jpg) |\n| --- |\n| 图 14.9. |\n| 修改后的后门脚本 |\n\n当我们查看 `/etc`\
  \ 目录中是否有用于 ftp 的东西时，我们发现那里什么都没有；对于我们的目的，`/etc/ftp` 目录非常适合我们。除了修改脚本名称（现在是 `/etc/rc.d/rc.ftpd`）之外，我们将工作目录修改为\
  \ `/etc/ftp/.data` 并连接端口更改为 12345。为了查看此更改产生的影响，让我们登录后门，如图 14.10 所示。\n\n| ![B9781597494250000191/f14-10.jpg\
  \ is missing](img/f14-10.jpg) |\n| --- |\n| 图 14.10. |\n| 登录后门 |\n\n并不意外——我们能够如预期那样登录。现在让我们看看我们如何使用文件系统本身来隐藏文件。图\
  \ 14.11 是 `/etc/ftp` 目录的列表。正如我们所见，前两个命令没有看到 `.data` 目录。在正常情况下，任何以点（.）开头的文件都是隐藏的。其目的是通过隐藏配置文件来减少杂乱，并让用户更容易找到自己的文件。我们还可以使用其他方法来隐藏文件，例如使用空格作为名称以及更改目录权限。\n\
  \n| ![B9781597494250000191/f14-11.jpg is missing](img/f14-11.jpg) |\n| --- |\n|\
  \ 图 14.11. |\n| /etc/ftp 目录下的文件列表 |\n\n另一个问题是，由于我们使用了 netcat，精通的的管理员可以通过检查系统上运行的进程来检测到我们的后门。图\
  \ 14.12 显示了如果系统管理员查找 12345 端口的活动可能会看到什么。\n\n| ![B9781597494250000191/f14-12.jpg\
  \ is missing](img/f14-12.jpg) |\n| --- |\n| 图 14.12. |\n| Netcat 列表 |\n\n除了将 netcat\
  \ 改为其他名称外，我们没有做什么可以掩盖它。图 14.13 说明了我们可以做的的一些处理。\n\n| ![B9781597494250000191/f14-13.jpg\
  \ is missing](img/f14-13.jpg) |\n| --- |\n| 图 14.13. |\n| 修改后门 |\n\n通过将 netcat (`nc`)\
  \ 程序移动到不同的名称 (`udp`)，我们可以稍微隐藏后门的功能。我们还设置了一个反向 shell，希望查看的人认为它是连接到用户数据报协议 (UDP) 的查询或连接，而不是后门。当我们执行后门时，图\
  \ 14.14 是进程输出。\n\n| ![B9781597494250000191/f14-14.jpg is missing](img/f14-14.jpg)\
  \ |\n| --- |\n| 图 14.14. |\n| 后门进程信息 |\n\n希望我们做的足够混淆或误导系统管理员不要发现我们的后门。通过隐藏工作目录并将名称更改为看似预期或无害的内容，我们有望推迟检测\n\
  \n**警告** 如果我们需要额外的隐蔽性，我们可能需要安装 rootkit，这在专业的渗透测试中很少见。我们到目前为止所做的都可以轻松撤销；而安装 rootkit（特别是第三方开发的）最可能需要重装被攻服务器——这一要求可能会让客户非常愤怒。\n\
  \n## 在 Windows 中隐藏文件\n\n在本章结束之前，我们将简要查看如何使用命令行在微软 Windows 系统中隐藏文件。图 14.15 说明了使用\
  \ `attrib` 命令隐藏文件的必要步骤。\n\n| ![B9781597494250000191/f14-15.jpg is missing](img/f14-15.jpg)\
  \ |\n| --- |\n| 图 14.15. |\n| 使用 **attrib** 命令隐藏文件 |\n\n\n\n\n通过向 `virus.exe` 添加\
  \ `hidden` 属性，我们无法再通过普通方法看到该文件。如果我们使用 Windows 资源管理器图形化用户界面 (GUI)，我们也会看到一个空目录。如果我们执行命令\
  \ `type virus.exe`，我们会发现文件仍然存在，并且可以查看和执行（如果它是一个真正的二进制文件）。\n\n## 工具与陷阱……\n\n# 看！闪亮的东西！\n\
  \n确保在渗透测试结束时，不要留下任何隐藏的文件或目录。除非这些隐藏对象已记录在案，否则很容易忘记它们的存在——如果这些隐藏文件是后门，从长期来看，将它们留在那里可能会导致灾难。不要在渗透测试结束时分心，忘记清理目标系统上的所有文件，而不仅仅是可见文件。目录也可以进行同样的操作。图\
  \ 14.16 显示了我们如何使用与之前相同的技巧，通过 `attrib` 命令来隐藏一个目录。\n\n### 图 14.16\n\n| ![B9781597494250000191/f14-16.jpg\
  \ is missing](img/f14-16.jpg) |\n| --- |\n| 图 14.16. |\n| 在 Microsoft Windows 中隐藏目录\
  \ |\n\n与 Linux 示例类似，在 Microsoft Windows 中启动的任何应用程序都可以通过查看系统中运行的进程来检测。文件的命名和工作目录的位置需要提前考虑，以防止我们的活动引起注意。\n\
  \n## 总结\n\n专业的渗透测试需要隐身性，以避免在跨越目标网络的攻击期间被发现，但很少涉及在目标系统内部隐藏踪迹。在项目部分内容是确定系统管理员检测攻击的能力的情况下，本章中的某些技术可能是很有用的。删除或修改日志文件的决定取决于隐藏踪迹的目的。删除日志文件是为了隐藏我们所有的活动，而不是为了隐藏我们的存在；而修改日志文件是为了隐藏我们的存在以及可能隐藏我们的活动（假设我们修改了所有正确的数据）。在任何一种情况下，我们通常需要将权限提升到系统或\
  \ root 用户权限——这不是一项易事。在很多情况下，我们可能完全放弃考虑隐藏踪迹。\n\n# 解决方案快速\n\n## 操纵日志数据\n\n■ 如果我们想确保所有的活动都是不可追溯的，但不在乎我们的存在是否被发现，我们应该删除日志文件。■\
  \ 如果我们选择修改日志文件，我们就面临未能移除所有需要内容的风险，或者我们删除得太多，导致日志中的空隙变得明显。■ 为了修改或删除日志文件，我们通常需要 root\
  \ 权限。在我们获得 root 账户之前，我们的登录活动是可检测的。\n\n## 隐藏文件\n\n■ 尽管许多系统管理员知道寻找隐藏文件，但他们中的许多人任务过重，忙于尝试捕捉我们的攻击。■\
  \ 通过隐藏工作目录或将文件名更改为看起来符合预期或无害的内容，我们可以延迟检测。■ 确保在渗透测试结束时，不要留下任何隐藏的文件或目录。**Q**：在专业渗透测试期间，在操纵或删除日志数据时需要制定什么样的规则？**A**：日志文件通常包含除登录信息以外的数据——大多数日志文件旨在提供一种解决系统问题的方法。通过修改或删除日志数据，你面临着删除简单登录信息之外的关键数据的风险。如果在渗透测试期间修改了日志文件，应向相关的利益相关者明确这些风险，并在渗透测试计划中专门书面说明。利益相关者在修改任何日志数据之前也需要确认他们已理解。**Q**：如果我无法修改日志，还有其他方法可以隐藏我的踪迹吗？**A**：由于日志文件包含除登录信息以外的信息，你可以生成消息来掩埋或删除你的登录尝试。为了防止文件被日志数据填满，通常会有控制机制删除最旧的日志数据。如果你的目标看起来确实如此，请尝试用无关且无害的数据淹没日志文件。这可能会有帮助。**Q**：如果没有办法修改日志数据且我无法淹没它，还有其他替代方案？**A**：如果你可以修改应用程序配置，你可能可以重定向或完全停止记录。\n\
  \n## 扩展你的技能\n\n想了解关于隐藏踪迹的内容吗？以下练习旨在为你提供额外的知识和技能，以便你更好地理解这个主题。请使用你的实验室进行以下练习。\n\n\
  ### 修改日志数据\n1. 使用用户名 `root` 和密码 `toor` 登录 Hackerdemia 服务器。检查 `/var/log/secure` 文件并检查最后几条日志文件条目。2.\
  \ 修改远程登录条目，使其看起来像是本地登录且由另一个用户登录。\n\n### 隐藏文件\n1. 修改 `/etc/rc.d/rc.netcat3` 脚本，隐藏\
  \ netcat 程序的名称和下载目录，使其与 Hackerdemia 服务器上当前已知的进程或文件名匹配。修改下载文件名以从 `ls` 和 `ls –l` 命令隐藏。将监听端口修改为未使用的端口。2.\
  \ 执行修改后的脚本并使用 `Nmap` 验证 netcat 是否运行在正确的端口上。检查系统进程中的 netcat 脚本。3. 连接到 Hackerdemia\
  \ 磁盘上的端口 `33333`，并使用 `netcat` 上传文件（如有必要参考第 13 章）。验证文件已传输并符合预期。\n\n参考文献 Mertvago,\
  \ P., *俄语谚语和格语对比词典*. (1995) Hippocrene Books, New York .\n\n\n\n\n与其说是工作太多，不如说是根本没活干。这是一句俄罗斯谚语：*“过度工作比不工作更糟糕。”*\
  \ (Mertvago, 1995) 在目标系统上发现漏洞和利用漏洞是非常有趣的——但编写发现报告……就没那么了。尽管客户支付了渗透测试的费用，他们真正想要的是最终报告，报告概述了哪里有问题以及如何进行修复。当渗透测试工程师在周六凌晨\
  \ 3 点，花费了一整天时间计算出实现缓冲区溢出所需的偏移量后，终于获得 root shell 账户时，客户并不会兴奋。只有当他们收到一份超出预期的报告，详尽地说明了其网络的整体安全态势以及其业务目标是否受到负面影响时，客户才会感到兴奋。渗透测试是一份有趣的工作，但最终报告需要高度专注，以确保我们的努力（以及我们获得的报酬）在客户眼中是合理的。如果我们对发现的记录不能满足客户的预期，那么我们在渗透测试项目中之前的所有步骤执行得再好也无所谓。如果没有完善的文档来解释我们发现对业务的影响，客户就无法证明花钱修复漏洞是合理的。那么，专业的渗透测试到底应该包含什么？方法论为如何准备客户报告以及需要包含哪些内容提供了一些提示。然而，目前还没有一种行业公认的向客户展示结果的方法。对这个问题的理想答案应该是“客户需要的任何内容”；遗憾的是，客户通常对渗透测试并不熟悉，以至于不知道期待什么，这导致他们很难传达雇佣专业渗透测试团队的目的。当客户没有意识到渗透测试的好处时，意味着我们必须花更多时间与客户交流，了解他们的业务目标以及我们如何融入他们的整体安全计划。\n\
  \n# 你应该报告什么？\n\n不同的利益相关者会有不同的报告需求——企业的首席执行官可能对重新创建一个 NOP 滑块（用于向应用程序中注入恶意代码）感兴趣，但系统管理员可能感兴趣。除非我们想针对每个个人利益相关者的兴趣量身定制多份报告，否则我们必须准确确定我们需要在报告中包含哪些内容以及如何包含。大多数渗透测试报告都详细列出了高层级发现和对重复利用所需步骤的低层级解释。通过包含这两个层面的细节，高管和工程师可以专注于他们最感兴趣的内容，从而为修复做出明智的决策。某些组织倾向于将报告分为两部分，以减少每个利益相关者的干扰——他们可以只看自己感兴趣的报告。我们选择哪种分配方法可能取决于客户及其需求；否则，我们只需选择任何适合我们风格的方法即可。\n\
  \n## 范围外问题\n\n专业渗透测试奇怪的地方在于，测试似乎可以无止境地进行。一旦漏洞被利用，雷达上就会出现更多目标——这些目标通常比刚刚利用的系统更有吸引力。在有足够的时间和资源的情况下，渗透测试团队理论上可以利用给定网络上的所有系统。遗憾的是，时间和资源是有限的，目标必须在渗透测试项目内定义。这并不意味着在渗透测试过程中，我们应该忽略项目范围之外的潜在漏洞——恰恰相反。在渗透测试期间，我们需要意识到并记录客户在未来某个日期需要检查的其他领域。这不仅提醒了客户存在潜在问题，还增加了我们获得未来业务的机会。当涉及到“范围外（out\
  \ of scope）”这个术语时，存在两种不同的发现：第一类是在渗透测试过程中在目标系统上发现的发现；第二类包括指示整体架构中系统性缺陷的发现。在系统中发现范围外漏洞的例子是，如果我们被要求对某个系统进行\
  \ Web 扫描，结果发现了运行在未记录的应用程序——我们想知道为什么会有这些应用程序，尽管它们不是我们被雇佣检查的内容。另一个例子是如果我们发现目标系统与客户网络外的远程服务器进行通信——关于外部服务器的信任问题、数据敏感性和加密方法将是一个关注点，但可能超出了我们的范围。同样，这并不意味着我们因为其在范围外就忽略这一发现——请记录该发现并将其包含在最终报告中，作为客户应进一步检查的内容。整体架构中的系统性缺陷通常更多是我们的一种推测，而不是基于事实的内容。例如，在目标系统上发现了弱密码。可能整个网络中只有我们的目标系统有弱密码；然而，有一种可能，是公司的密码策略或强密码执行机制在整个基础设施中被忽视或削弱了。在我们认为某个特定的关注领域可能在整个架构中普遍存在的情况下，我们需要在最终报告中向客户表达我们的疑虑。\n\
  \n## 发现\n\n当我们报告渗透测试过程中发现的成果时，我们还需要包含*没有*发现的内容。漏洞扫描器会错误地识别系统漏洞，这可能会引起客户不必要的担忧。在渗透测试过程中，识别出的漏洞可能会被检查并发现是虚假报警（false\
  \ positive）。记录所有发现是重要的，这样客户就能理解其安全防御的整体——而不仅仅是缺陷。通过识别虚假报警，我们可以为客户节省一些时间和金钱。\n\n\
  **警告** 在将某项标记为虚假报警之前，我们需要 100% 确定我们的评估是正确的。错误地识别漏洞对客户来说可能是灾难性的，特别是如果该疏忽在几年内未被发现。发现也必须详细，以便客户能够自己重复这些发现，或聘请第三方进行跟进并纠正缺陷。最终报告中包含的信息越多，我们的客户改进其安全态势的位置就越有利。每当我们记录发现时，都面临着包含不属于最终报告的敏感信息的风险。\n\
  \n\n\n\n# 注意 确保所有文档都标记了适当的安全分类级别。在许多情况下，最好使用客户的分类策略，这样在发布最终报告时，就不会对材料的敏感性产生困义。在某些情况下，需要立即报告某些发现。如果系统存在对客户构成即时威胁的安全漏洞，客户可能希望尽早获。项目经理应该已经有一份利益相关者清单，在发现即时威胁时，根据威胁的严重性和性质与他们联系。\n\
  \n# 注意 即使威胁在最终报告发布之前已经缓解，仍应在报告中记录该发现。这不仅向利益者解释了他们的整体安全态势处于风险之中，并且渗透测试取得了“成果”，还向利益者展示了他们对网络中已识别威胁的安全响应有多么有效。\n\
  \n## 解决方案\n\n信不信，客户喜欢被告诉他们该做什么。在渗透测试结束，客户通常想知道他们需要购买什么应用程序或网络防御系统来改进他们的安全态势，并缓解渗透测试过程中发现的漏洞。提供解决方案并不是渗透测试的目的。渗透测试报告的目标是识别漏洞，并为客户提供包含多个高级缓解方案的情境分析——制定和实施适当的缓解策略是客户的责任。战略管理的责任落在客户身上的原因是因为客户的执行层是决策者，他们比渗透测试工程师更清楚如何最好满足企业业务目标。如果让工程师成为决策者，客户将面临选择高昂选项的风险，这些选项虽然*会*缓解风险，但可能与公司目标不一致。\n\
  \n## 手稿准备\n\n报告实际看起来是什么样？渗透测试结果在文档格式和包含的章节上存在巨大差异。然而，最终报告的格式通常遵循专业手稿指南，例如美国心理学会（APA）风格中常见的那些指南。\n\
  \n### 标题页\n\n标题页非常浅显易懂，将作为介绍报告主题、作者以及渗透测试团队所属组织的一种方式。标题页是展示标志并让一切看起来具有吸引力的绝佳之处，但该页面的主要目标应该是提供关于报告内容的清晰信息。客户很可能针对多个目标拥有多份渗透测试报告；如果这些报告都来自同一个渗透测试团队，则标题页将用于快速区分每份报告。\n\
  \n### 摘要\n\n对于专业的渗透测试报告，摘要就是执行报告。管理层通常需要一个简要概述来理解报告背后的事实。执行摘要不应超过一页，并包含简洁的分析和发现。执行管理层将使用报告的这一部分做出决策，因此我们传达信息的空间有限。我们应该将我们的发现和高级修复建议包含在项目符号列表中，以便快速参考。\n\
  \n### 正文\n\n报告正文应包含三个元素——目标网络或系统的描述、漏洞发现和修复措施。当我们讨论目标时，我们应该包含架构的图形化表示，并对每个元素进行描述，包括任何网络设备，如防火墙和路由器。当我们讨论目标系统时，我们应该对系统上发现的应用程序以及系统在网络中的功能进行高级讨论。大部分目标描述将来自客户提供的文档，这些文档在整个项目过程中由渗透测试团队进行审核。漏洞发现和修复方案应该交织在一起——每当发现一个漏洞时，就应该提供一两个高级的修复示例。我们还应该在章节末尾提供漏洞和修复方案的符号列表，这些可以用于编写执行摘要。高级缓解方案的一个示例可能是“关闭不必要的服务”，但我们不会给他们具体的步骤或要求他们这样做。执行层可能会决定该风险是可控的。\n\
  \n\n\n\n\n**Tip** 将初始报告视同最终报告来处理——确保一切看起来都是完美的——所有的语法和拼写都正确、图表准确、数据传达得当。初始报告不是草稿。完成初始报告后，我们可以将其发送进行同行评审。在某些情况下，我们可能想先将报告发送给职能经理（假设有此职位）和项目经理。职能经理会想要审查报告，以确保它是详尽的并且能够良好地展示团队形象；职能经理可能还想参与同行评审过程，并在此期间对报告中的内容或事实提出建议。项目经理也会为了质量保证而检查初始报告。\n\
  \n## 同行评审\n\n我们所有人都会犯错，特别是在写作时。除了简单的拼写错误外，我们还有可能对某个特定协议的事实描述出现错误（令人难以信！）！IT 领域充满了微小的细节，这些细节对于新手和专家来说都可能被误解。在将渗透测试报告发布给客户之前，对其进行同行评审是有意义的。如果我们足够幸运，会有许多领域专家在身边回答我们可能提出的任何问题。这些情况确实存在，但渗透测试工程师经常依赖同事来审查报告。除了语法和拼写之外，同行评审还应该验证所描述的架构、漏洞、利用程序、缓解建议和协议描述是准确的，并且描述清晰简洁。如果由于缺乏客户的数据导致某些关于架构、系统或应用的事不明，初始报告的下一步通常会澄清任何困惑。源于同行评审的问题在进入事实检查之前，应使用现有的文档（如果可能）进行回答。\n\
  \n## 事实检查\n\n一旦写好初始报告并完成同行评审，渗透测试团队就可以给客户一个机会来验证信息的准确性。根据国家安全局的信息保障方法（NSA-IAM）（INFOSEC\
  \ Assurance Training and Rating Program），任何评估都需要包含客户代表，包括高层管理人员、职领域代表、高级系统管理员和高级信息安全（INFOSEC）经理。这些人员中的任何一个都应该能够就客户网络的配置和实施向渗透测试团队提供反馈，或者至少将初始报告转给正确的员工进行事实验证。在允许客户修正渗透测试报告中的事实时，通常需要保持某种程度的怀疑态度。向客户提出事实问题有几种方法：我们可以列一份我们需要回答的问题列表，也可以将初始报告的副本发送给客户，以便他们验证文档中的所有陈述。发送问题列表的优势是初始报告受到了严格控制。客户始终有可能在公司内部分发初始报告。由于报告仍处于初始阶段，在早期发布文档是有风险的，因为结论和建议可能会根据客户对事实检查的输入而改变。发送整个初始报告的优势是客户可以检查所有发现的准确性，而不仅仅是我们认为自己不理解的地方。我们可能认为自己对某个主题有充分的理解，结果从客户那里发现我们的理解是有缺陷的。如果我们只发布一个问题列表，在最终报告发布给客户之前，我们永远无法发现这个错误。\n\
  \n**来自地下的笔记……**\n\n## 窥探的眼睛\n\n数据传输的方法（尤其是电子传输）应该事先仔细考虑，因为数据可能包含机密信息，或者至少包含足够破坏目标系统和网络的信息。如果专业的渗透测试人员可以使用客户提供的数据攻破目标，那么拦截我们接收的相同数据的恶意用户也可以做到。\n\
  \n## 指标\n\n在第 7 章中，我们讨论了渗透测试中创建指标的不同方法。一种方法是使用第三方分析。在本节中，我们将查看使用 `CORE IMPACT` 和\
  \ `Nessus` 提供报告和指标的选项。\n\n### Nessus\n\n图 15.1 是对 `pWnOS` 服务器进行 `Nessus` 扫描的截图。无需进入具体的发现细节，`Nessus`\
  \ 扫描识别出了 15 个归类为“低”的发现、3 个“中”发现以及一个“高”风险漏洞。\n\n| ![B978159749425000021X/f15-01.jpg\
  \ is missing](img/f15-01.jpg) |\n| --- |\n| 图 15.1. |\n| Nessus 扫描结果 |\n\n基于此，我们可以创建一些指标表。最快的版本是在信息系统安全评估框架（ISSAF）中找到的基础基础矩阵，如图\
  \ 15.2 所示。描述信息直接来自 `Nessus` 扫描结果。\n\n| ![B978159749425000021X/f15-02.jpg is missing](img/f15-02.jpg)\
