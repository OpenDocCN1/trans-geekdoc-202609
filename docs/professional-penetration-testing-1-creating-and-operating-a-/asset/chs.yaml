  \ 企业数据\n\n这一步让我们能够更好地了解 Nmap 背后的人、他们的位置、员工信息，可能还有网络信息。你需要小心的是进行渗透测试阶段的深度。如果有足够的时间，你很有可能发现非常私人的信息，包括公司人员的住宅和家庭电话。除非你需要进行某些社交工程，否则收集这类信息可能会触越伦理底线。即使这些信息可用，也不意味着获取它是重要的。个人员工网页（如博客或家庭相关网站）也是如此。可能会有用的信息（例如网络工程师的系统或应用程序认证），但并不意味着你需要保留他们的星座或孩子的照片（那将非常变态）。记住在“真正有用”和“仅仅可用”的信息获取之间取得平衡。让我们看看\
  \ [Insecure.org](http://Insecure.org) 和 [Sectools.org](http://Sectools.org) 的站点信息（这是我们的两个选项，因为\
  \ [Nmap.org](http://Nmap.org) 链接指向 [Insecure.org](http://Insecure.org)）。在图 9.13\
  \ 中，我们被提供了联系信息，包括街道地址、电话号码和电子邮件。[Sectools.org](http://Sectools.org) 的联系信息相同，电子邮件除外。此外，注意公司名称是\
  \ [`Insecure.com`](http://Insecure.com)，这为我们提供了另一个需要调查的域名。\n\n| ![B9781597494250000142/f09-13.jpg\
  \ is missing](img/f09-13.jpg) |\n| --- |\n| 图 9.13. |\n| [Insecure.org](http://Insecure.org)\
  \ 的公司信息 |\n\n那么，我们可以用这些信息做什么呢？如果我们正在进行物理安全评估，可以使用 Google maps 进行进一步挖掘。在图 9.14 中，我们可以看到图\
  \ 9.13 所示地址的地图位置，以及关于该建筑的企业信息。根据这些信息，[Insecure.com](http://Insecure.com) 使用邮政信箱进行业务。\n\
  \n| ![B9781597494250000142/f09-14.jpg is missing](img/f09-14.jpg) |\n| --- |\n|\
  \ 图 9.14. |\n| [Insecure.com](http://Insecure.com) 地址的 Google 地图结果 |\n\n\n\n\n\n\
  如果这个地址是一个大型企业大楼，`街景选项`将提供有用的细节，例如相邻的建筑或街道对面的建筑、入口、窗户位置、出入路线，可能还有一些安全细节，如照明、摄像头、访问控制等。如果这些信息还不够，你还可以使用\
  \ Google Earth (`http://earth.google.com/`) 来获取该区域的卫星视图，这也可以提供额外信息，如停车场、备用道路访问等。我们可以继续调查存档，看看是否有关于\
  \ `Nmap` 或 `Fyodor` 的更多信息，但如果我们回到 Google 搜索“Nmap fyodor palo alto”，我们发现了以下指向维基百科的链接：`http://en.wikipedia.org/wiki/Gordon_Lyon`。到此为止，我们似乎知道作者是谁了。在撰写本书时的维基百科条目版本中，还包含了\
  \ Gordon 的照片，这为这个名字背后提供了一张面孔，这在本次练习中可能没有实际用途；然而在其他类型的渗透测试项目中，特别是那些具有社会工程要求的项目，组织关键利益相关者的照片可能极其有用。我们都知道维基百科有多不可靠，所以为什么不从更权威的来源查出是谁拥有这些网站呢？参考图\
  \ 9.13，我们看到网站 `Insecure.org` 的公司名称是 `Insecure.com`。我们收集有关该公司更多信息的优势在于公司需要在州政府注册。对于\
  \ `Insecure.com`，我们看到它位于加利福尼亚州，那里有一个处理所有业务相关的门户网站。在图 9.15 中，你可以看到对 LLC `Insecure.com`\
  \ 信息请求的结果。这些信息是从网站 `www.sos.ca.gov/business` 收集的。我们看到“法律送达代理”（Agent for Service\
  \ of Process）是 Gordon Lyon，这证实了我们在维基百科上的发现。\n\n| ![B9781597494250000142/f09-15.jpg\
  \ is missing](img/f09-15.jpg) |\n| --- |\n| 图 9.15. |\n| Insecure.com LLC 的加利福尼亚数据\
  \ |\n\n我们还确认了加利福尼亚州 Sunnyvale 为该公司所在地，我们确定那是一个邮政箱。我们还知道公司是什么时候提交其有限责任公司（LLC）记录的。由于成本以及业务信息必须公开的规定，大多数州都有业务名称门户网站，并提供所有者信息和位置。这使得我们的工作变得简单得多，我们可以再次在不连接目标网络的情况下收集这些信息。\n\
  \n## WHOIS 和 DNS 穷举\n\n让我们快速查看关于 `Nmap.org` 的相同 DNS 信息。在图 9.16 中，你将找到很多信息，从网站的 IP\
  \ 地址（64.13.134.48）开始，包括额外的子域名（`http://mail.Nmap.org`）。`Nmap.org` 似乎位于一个名为“titan.net”的站点。如果你继续调查\
  \ `titan.net`，它似乎与“DreamHost 网页托管”有关，这在目前显然超出了范围，因为我们正在做的只是寻找有关 Nmap 工具以及是谁制作了它的信息。然而，如果我们进一步调查，我们将发现更多关于服务器类型（AMD\
  \ 双核 Opteron 或英特尔双路处理器 Xeon）以及它们使用的操作系统（Linux-VServer 或 Debian Linux），以及任何使用其托管服务的人都可以访问的潜在服务（包括\
  \ MySQL、POP/IMAP、FTP 等）。这让我们对正在面对的是什么种类型的服务器有了更好的了解。当我们转向对目标系统进行漏洞攻击时，这些信息将允许我们大幅缩小潜在漏洞的范围。\n\
  \n| ![B9781597494250000142/f09-16.jpg is missing](img/f09-16.jpg) |\n| --- |\n|\
  \ 图 9.16. |\n| Nmap.org 的 Whois 信息 |\n\n此部分中的一些信息我们将在本节稍后进入信息收集的主动阶段时查询。这不仅能让我们知道如何在命令行提示符下收集这些信息，还能验证我们被动收集的任何信息。图\
  \ 9.16 中列出的记录始终可能是过时的。ISAF 建议的工具包括 `dig` 和 `nslookup`。在图 9.17 中，我们对 `Nmap.org` 执行了\
  \ `dig` 查询。我们使用的名称服务器是 `208.67.222.222`，即 `resolver.opendns.com`。\n\n| ![B9781597494250000142/f09-17.jpg\
  \ is missing](img/f09-17.jpg) |\n| --- |\n| 图 9.17. |\n| 使用 dig 的结果 |\n\n### 来自底层的笔记……\n\
  \n### OpenDNS.com\n\n这个名字有点误导性，因为 OpenDNS 不是开源软件，而是一家商业企业。在使用他们的免费服务之前，你应该注意一些额外的服务，包括钓鱼过滤、域名拦截以及连接到不存在域名时的广告。取决于你的目标，OpenDNS\
  \ 可能是宝贵的资产也可能是需要避免的对象。我们的发现显示 `titan.net` 确实是 `Nmap.org` 的名称服务器。现在知道了服务器，让我们了解更多关于服务器本身的信息。ISAF\
  \ 建议的下一个工具是 `nslookup`。方法论在此阶段使用的示例非常简单。在图 9.18 中，你将看到按照 ISSAF 使用的一些 `nslookup`\
  \ 命令。然而，方法论没有对 `nslookup` 工具的灵活性进行详细说明，并省略了收集更多目标数据的有用可选信息。我们将在本章稍后的主动信息收集部分介绍一些不同的\
  \ `nslookup` 命令。\n\n| ![B9781597494250000142/f09-18.jpg is missing](img/f09-18.jpg)\
  \ |\n| --- |\n| 图 9.18. |\n| 按 ISSAF 建议使用 nslookup 收集 DNS 信息 |\n\n稍后我们将配置 `nslookup`\
  \ 连接到的 DNS 服务器以收集额外信息，但目前我们使用网络设置的默认名称服务器。有时，定义 DNS 服务器是很重要的，因为 DNS 更改之间存在延迟。然而，由于我们想保持被动，目前非权威数据就足够了。\n\
  \n\n\n\n\n**警告** `工程师：` 在某些情况下，我们通过直接查询名称服务器可能会违反我们的被动性原则。如果我们想严格地被动地收集信息，连接权威名称服务器可能不是好主意，这取决于它们的所有者。\n\
  \n## 额外的互联网资源\n\n另一个应该探索的领域是新闻组内的活动。在图 9.19 中，你可以看到与 `Nmap` 相关的最新新闻组帖子。我们可以在新闻组中搜索短语\
  \ `Nmap` 或 URL [`Insecure.org`](http://Insecure.org)，看看其他人对该网站或工具的看法。如果你探索了这些新闻组，你会发现来自世界各地的用户都在讨论\
  \ `Nmap` 话题。我们可以从这些小组中获取有关该网站或工具的信息。记住，需要收集大量信息，有时在偏僻的地方也能发现宝藏。\n\n| ![B9781597494250000142/f09-19.jpg\
  \ is missing](img/f09-19.jpg) |\n| --- |\n| 图 9.19。 |\n| 新闻组搜索 Nmap – 提取自 [`freenews.maxbaud.net`](http://freenews.maxbaud.net)\
  \ |\n\nISSAF 还建议对目标进行调查，以确定其是否列在 SPAM 数据库中。如果一个目标列在该数据库中但本不应该列，这可能表明邮件服务器曾经被入侵过。根据图\
  \ 9.20 中的结果，[Insecure.org](http://Insecure.org)似乎尚未加入 SPAM 数据库，该数据库可以在 [www.dnsbl.info](http://www.dnsbl.info)\
  \ 找到。\n\n| ![B9781597494250000142/f09-20.jpg is missing](img/f09-20.jpg) |\n| ---\
  \ |\n| 图 9.20。 |\n| 查找 mail.titan.net 的 SPAM 状态 |\n\n我们还可以在招聘网站上查询网络信息，这通常是关于公司硬件和软件使用的好来源。以下是\
  \ [Google.com](http://Google.com) 生产工程师职位的摘录（Google Inc., 2009）：要求：■ 计算机科学学士学位或同等经验\
  \ ■ 精通 `MySQL`（最好包括一些管理和/或性能调优经验）并掌握以下语言中的至少两种：`Python`、`Perl`、`SQL`、`shell` ■ 具备\
  \ `Linux` 操作系统和网络的基本故障排除技能 ■ 具有开发和/或维护 `ETL` 系统的实践经验 ■ 管理具有多个组件的大型系统经验是加分项。 ■ 有日志和数据分析经验是加分项。从这些信息中，我们现在知道在某个地方，Google\
  \ 使用 `Linux` 系统、`MySQL` 以及 `Python` 和 `Perl` 程序。此外，Google 内部至少有一个使用提取、转换和加载 (`ETL`)\
  \ 架构的数据库。这类信息对于缩小你的整体项目工作量并完善项目人员配置需求非常有用。\n\n## 主动信息收集\n\n在渗透测试的这一阶段，我们在与目标网络交互时可以得没那么谨慎。部分原因是我们已经对目标进行了大量的调查，不需要在信息收集工作中做得那么宽泛。主动信息收集将发现与我们之前使用被动措施发现的类似的结果——在渗透测试中包含被动收集的优势有两点：识别历史信息和通过主动方法确认发现的结果。虽然我们不会在书中介绍这一点，但社会工程学是收集目标信息的一种非常有效的方法——它通常比进行扫描和尝试利用漏洞更有效。利用我们能使用的任何工具和技术来收集我们需要的信息。\n\
  \n## DNS 询问\n\n一个很有帮助的信息是知道运行在我们目标上的伯克利互联网域名 (`BIND`) 服务器的版本号。遵循图 9.21 所示的 ISSAF\
  \ 建议命令，我们发现版本是 9.3.4，（在互联网上搜索后）它于 2007 年 1 月发布，不再是最新版本。我们以后是否可以使用这些信息取决于已知漏洞和利用程序的存在。但目前，我们只需记录数据并继续。\n\
  \n| ![B9781597494250000142/f09-21.jpg is missing](img/f09-21.jpg) |\n| --- |\n|\
  \ 图 9.21。 |\n| 查询 BIND 版本号 |\n\nISSAF 还建议你运行几个关于 `dig` 的其他命令，例如收集有关邮件服务器的信息；然而，我们早些时候已经收集了这类信息，如图\
  \ 9.16 所示。尽管如此，保持冗余是非常重要的，并至少使用两个工具来验证信息。**提示** `经理：` 你可能想从客户那里了解 DNS 更新延迟是否是一个问题，特别是当可用性是一个主要考虑因素时。如果名称服务器被入侵或劫持，你希望\
  \ DNS 传播尽可能快，而某些 Web 托管公司在及时更新记录方面非常糟糕。我的默认 DNS 服务器可能有旧数据。通过直接与 `ns1.titan.net`\
  \ 通信，我们可以获取最新的信息。此外，与 `ns1.titan.net` 的这种直接通信还为提供了有关邮件服务器的额外信息，以及关于 [Nmap.org](http://Nmap.org)\
  \ 的“起始授权”信息。在图 9.22 中，我们还使用了 `nslookup` 的其他命令来扩展我们的搜索。如你所示，通过 `nslookup` 可以收集的信息比\
  \ ISSAF 建议的要得多。\n\n| ![B9781597494250000142/f09-22.jpg is missing](img/f09-22.jpg)\
  \ |\n| --- |\n| 图 9.22。 |\n| 使用 nslookup 的其他命令收集 DNS 信息 |\n\nISSAF 内部建议的工具和相关的命令行示例非常有帮助，但并没有显示所有可能的查询。我对我的学生的建议是，他们确实应该使用\
  \ ISSAF 提供的工具和命令行示例，但也要探索每个应用程序的功能，以便他们更好地进行渗透测试。\n\n## 邮件账户\n\n\n\n\n\n如果我们的目标有一个邮件服务器（我们的目标确实有一个），我们可以尝试创建一个存在于系统上的用户列表。这个名称列表不仅在任何暴力攻击或登录尝试中都很有帮助，我们还可以将这些数据用于社会工程目的。根据\
  \ ISSAF 的方法，我们通过直接连接到邮件服务器并每次查询一个名称来实现。我不想对 [Nmap.org](http://Nmap.org) 邮件服务器进行操作，因为我们没有权限对其进行测试；因此，让我们转向书中附带的\
  \ DVD 中的一个目标。具体来说，让我们目标为“Hackerdemia”LiveCD，因为它刻意加载了许多供黑客攻击的服务，包括 `sendmail`。在图\
  \ 9.23 中，你可以看到我们使用 ISSAF 建议的命令对 Hackerdemia LiveCD 进行攻击。我们能够识别出服务器上的某些用户（`root`\
  \ 和 `david`），并排除了其他（`anyone` 和 `michelle`）。如果激活了某些隐私配置（如图 9.23 所示的 `novrfy` 和 `noexpn`），这种方法要求我们一次尝试不同的用户。这个过程可能花费很长时间，取决于服务器上的用户数量以及我们对邮件命名规范的了解。\n\
