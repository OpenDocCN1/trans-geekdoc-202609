  \ 10 章中讨论如何使用其他方法检测系统。\n\n# 项目管理\n\n一旦我们对目标网络中的边界有了大致了解，就需要识别出该网络中的所有设备。在这个阶段，我们并不试图弄每个设备是什么（路由器、交换机、防火墙、服务器或其他）——我们只是在尝试网络中有多少个系统以及它们相关的\
