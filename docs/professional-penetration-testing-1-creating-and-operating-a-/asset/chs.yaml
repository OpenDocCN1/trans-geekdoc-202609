  \ is missing](img/f05-13.jpg) |\n| --- |\n| 图 5.13. |\n| WebGoat 首页 |\n\n## 场景\n\
  \n以下是 Web-Goat 中基于 Web 的攻击向量分类，每个类别都包含多个练习：■ 代码质量 ■ 未经校验的参数 ■ 访问控制失效 ■ 身份和会话管理失效\
  \ ■ 跨站脚本 (XSS) ■ 缓冲区溢出 ■ 注入漏洞 ■错误的错误处理 ■ 不安全存储 ■ 拒绝服务 ■ 不安全配置管理 ■ Web 服务 ■ AJAX\
  \ 安全。WebGoat 还包含一个最终挑战练习，该练习使用了整个应用程序中所教授的多种攻击向量。\n\n# 使用可利用的目标\n\n通常人们创建的第一类实验室是那些涉及可利用的操作系统或包含漏洞应用程序的实验室。旧操作系统被更新或废用的原因之一就是漏洞。诸如\
  \ `Metasploit` 等工具可以有效地用于旧且未打补的操作系统，并向系统管理员和管理层演示定期系统维护的必要性。高级渗透测试人员还将把现代操作系统纳入渗透测试实验室的目标，特别是当新漏洞的消息公布时。重新创建利用程序，特别是在尚未发布概念证明（PoC）的情况下，是开发逆向工程和缓冲区溢出技能的极佳方法。更高级的技术攻击操作系统内核，特别是在\
  \ rootkit 开发中。分析内核的工程师现在能够更好地理解操作系统的内部机制。最终，那些为了安全漏洞而分析内核的人将成为发现最新操作系统漏洞的人，并在此过程中获得名声（或臭名）。\n\
  \n## 操作系统\n\n大多数利用程序是针对应用程序编写的。然而，某些漏洞专门设计用于攻击操作系统，无论是库文件、内核、固件还是作为虚拟化管理程序。一个良好的\
  \ rootkit 仓库可以在 [www.packetstormsecurity.org/UNIX/penetration/rootkits/](http://www.packetstormsecurity.org/UNIX/penetration/rootkits/)\
  \ 找到，包括 Windows rootkit（尽管 URL 名称中提到了 UNIX）。Packet Storm 提供了可下载的 rootkit 链接，可以在实验室环境中进行剖析和研究。理解操作系统漏洞对于取证分析以及渗透测试中的维持访问阶段非常有益。安装一个无法被检测且保留高级管理权限的后门的能力，对于恶意黑客和专业渗透测试人员来说都非常有益。\n\
  \n注意：在渗透测试中使用 rootkit 很少见，除非在测试实验室中演示概念证明。尽管渗透测试方法论建议使用 rootkit，但在专业的渗透测试中实施 rootkit\
  \ 应谨慎使用。rootkit 扫描器的有效性是另一个可以在渗透测试实验室探索的领域。理解 rootkit 扫描器的原理以及它们为何能检测（或未能检测）rootkit\
  \ 对于取证和渗透测试很有帮助，特别是在测试系统防御控制时。\n\n## 应用程序\n\n与操作系统一样，随着新漏洞的发现而被更新。从漏洞应用程序中重新创建利用程序有时比破解操作系统更容易，特别是对于开源应用程序，因为可以获取实际源代码且更容易利用。在真实的渗透测试中，应用程序经常需要检查安全漏洞；很少有渗透测试团队收到破解操作系统内核的请求。如果创建应用程序利用程序超某人的技能范围，并不意味着他们应该回避至少了解它们。`Metasploit`\
  \ 拥有约 200 个应用程序利用程序，可以通过审查它们来理解应用程序如何以及为何可利用。另一个来源是 `milw0rm`，它是一个许多应用程序利用程序的仓库。以下是\
  \ Webmin 利用程序的片段，发现于 [www.milw0rm.com/exploits/2017](http://www.milw0rm.com/exploits/2017)：\n\
  \n```perl\n#!/usr/bin/perl\n($target, $port,$filename, $tar) = @ARGV;\n$temp=“/..%01”\
  \ x 40;\n...\nmy $url= “http://”. $target. “:” . $port .“/unauthenticated/”.$temp\
  \ . $filename;\n$content=get $url;\n```\n\n如果我们仔细观察代码，就可以看到，如果 URL 使用以下字符串 `/..%01`\
  \ 填充 40 次，Webmin 将打印出系统文件。如果我们试图理解为什么这个利用程序起作用，我们会看到该利用程序利用了 Webmin 应用程序内部对 URL\
  \ 的处理不当。通过向应用程序提供额外数据（在此例中为 `/..%01` 字符串），我们可以强制 Webmin 显示目标系统中的任何文件，这将在第二部分 (`9781597494250000130.xhtml#978-1-5974-425-0`)\
  \ 中演示。基于这些信息，我们可以尝试在不实际使用脚本的情况下，针对 Webmin 应用程序手动重新创建这种利用。`milw0rm` 有许多远程和本地利用的示例，包括缓冲区溢出、拒绝服务和\
  \ shellcode。\n\n# 分析恶意软件 – 病毒和蠕虫\n\n高级恶意软件开发技术的使用正在上升——根据 McAfee 的数据，2007 年 11 月到\
  \ 2008 年 12 月之间，独特的恶意软件二进制文件数量从 400 万以下增长到 1600 万以上 (McAfee Threat Center, 2009)。这种增长大部分是恶意软件作者为了避免被病毒检测程序检测而进行的打包工作；尽管重新打包软件的使用增加扭曲了\
  \ McAfee 研究中呈现的数据，并可能意味着野外实际恶意软件二进制文件的数量并没有那样剧烈增加，但这确实表明开发者在变更管理和部署方法方面变得越来越熟练。在实验室中分析恶意软件与系统和应用程序渗透测试有显著不同。“恶意软件”的目的与渗透测试的目的相反；恶意软件作者通常设计他们的软件在网络中横冲直撞，不在过程中发生了什么损害。渗透测试工程师会尝试以受控的方式发现利用程序，很少意图造成不可恢复的损害。理解恶意软件的破坏性以及当前用于在公司系统中注入恶意软件的技术，是专业渗透测试人员的一项关键技能；能够逆向工程恶意软件可以增加这项技能，为渗透测试工程师对这种不断增加的威胁提供更深入的理解。\n\
  \n## 设置实验室\n\n\n\n\n\n创建一个恶意软件实验室与我们之前描述的有所。恶意软件攻击其他系统的威胁是肯定的，应该预期的实验室中的所有系统都会被完全攻破。更复杂的是，某些恶意软件可以检测到虚拟虚拟机的使用，这为任何设置渗透测试（PenTest）实验室的人增加了额外工作。许多版本的恶意软件被设计为僵尸网络的一部分，也称为\
  \ `botnet`。感染了僵尸网络恶意软件的系统将尝试连接到远程服务器并监听指令，无论是为了生成垃圾邮件、参与拒绝服务攻击，还是从主机系统上收集敏感信息（例如信用卡数据、登录名和密码或击键记录）。在实验室中分析恶意软件需要在使用第\
  \ 4 章中讨论过的措施之外额外的安全措施。恶意软件分析还需要不同的工具。我们将讨论蜜罐程序（`honeypots`）的使用、存在哪些类型以及如何使用它们收集恶意软件。我们还将讨论正确分析收集到的恶意软件需要哪些工具。\n\
  \n**警告** 恶意软件作者故意编写试图规避逆向工程或检测的代码，并以非常激进的方式在整个网络中传播。在实验室中使用恶意软件需要最高的安全措施；未能实施适当的安全措施可能导致外部系统被破坏，这可能导致政府调查或诉讼。\n\
  \n## 虚拟机与非虚拟机实验室\n\n如所述，某些恶意软件可以检测到更常用的虚拟机应用程序的使用，包括 `VMware` 和 `Xen` 等。当恶意软件检测到虚拟机的使用时，它可能会表现得无害且不进行恶意活动。由于虚拟机在恶意软件分析中被广泛使用，恶意软件作者设计其恶意软件不被检测，以尽可能地防止分析，从而延长恶意软件的寿命。在恶意软件分析中使用虚拟机有许多原因——最重要的一是时间。能够在虚拟机中检查恶意软件的活动，然后立即将虚拟机恢复到原始状态，允许分析人员更快速地检查恶意软件。如果恶意软件的细节发布给安全供应商（例如病毒检测软件制造商），恶意软件分析的快速转换可以防止成千上万系统被感染——恶意软件未被分析的时间越长，全球范围内受感染的系统就越多。\n\
  \n## 地下笔记……\n\n## 虚拟机检测\n\n恶意软件对虚拟机的检测正在减少。许多公司正在使用虚拟机管理程序解决方案以节省成本，并将服务器迁移到企业级虚拟机应用程序。检测到虚拟机使用的恶意软件可能会忽略可被利用的合法系统。随着虚拟化在企业环境中的应用越来越多，恶意软件将尝试减少对其使用的检测。进行恶意软件分析的实验室需要同时拥有虚拟机和非虚拟机系统以开展分析。虽然只分析不寻找虚拟机的恶意软件可能很有吸引力，但更高级（更有趣）的恶意软件需要更健健的渗透测试实验室。避免高级恶意软件将限制对当前恶意软件环境和威胁的理解。\n\
  \n## 创建控制环境\n\n大多数恶意软件针对 Microsoft Windows 系统。在可以使用虚拟机的情况下，主机操作系统不应该是 Microsoft\
  \ Windows。可以在 [www.xen.org](http://www.xen.org) 获取的 `Xen` 虚拟机管理程序运行在 `Linux` OS\
  \ 上。图 5.14 展示了使用 `Xen` 的恶意软件实验室的可能网络配置。\n\n| ![B9781597494250000099/f05-14.jpg is\
  \ missing](img/f05-14.jpg) |\n| --- |\n| 图 5.14. |\n| 使用 Xen 虚拟机管理程序的恶意软件实验室 |\n\
  \n如果使用笔记本电脑，必须禁用无线通信。除非绝对需要路由器（为了 `DHCP` 或为了说服 Microsoft Windows 镜像其具有 Internet\
  \ 连接），否则主机系统不应连接到任何网络设备。渗透测试实验室不应与互联网或其他外部网络有任何连接；在渗透测试实验室中使用的任何路由器都应该是隔离并与外部系统断开的。\n\
  \n**注意** 根据微软的许可协议，`Xen` 虚拟机管理程序中可能不允许使用 Microsoft Windows。任何渗透测试实验室中的 Microsoft\
  \ Windows 都应仅根据许可和法律使用。在需要分析其他操作系统的恶意软件的罕情况下，可以使用图 5.14 中的设置，通过更换 Microsoft Windows\
  \ 镜像以及操作系统。在大多数情况下，恶意软件将想要攻破网络中的其他系统；可以根据需要添加虚拟镜像，包括在需要研究传播技术时添加蜜罐。\n\n## 收集恶意软件\n\
  \n收集恶意软件最快的方法是将蜜罐直接连接到互联网。图 5.15 展示了一种网络配置，允许互联网上的恶意系统看到（并攻击）蜜罐。\n\n| ![B9781597494250000099/f05-15.jpg\
  \ is missing](img/f05-15.jpg) |\n| --- |\n| 图 5.15. |\n| 使用 Nepenthes 蜜罐的网络配置 |\n\
  \n一旦我们按照了图 5.15 所示配置网络，任何针对分配给路由器的面向的 IP 地址的攻击将转发到 `Nepenthes` 蜜罐。这允许 `Nepenthes`\
  \ 直接从互联网攻击中收集恶意软件。`Nepenthes` 模拟了一个 Microsoft Windows 服务器，并将以模仿 Windows 服务的方式响应请求。图\
  \ 5.16 是一个模块列表，这些模块可以创建与其旨在模仿的服务类似的连接响应，并接收推送到服务器的任何文件，将其保存供分析。\n\n| ![B9781597494250000099/f05-16.jpg\
  \ is missing](img/f05-16.jpg) |\n| --- |\n| 图 5.16. |\n| Nepenthes 模块列表 |\n\n如果我们对\
  \ `Nepenthes` 蜜罐进行 `Nmap` 扫描，可以看到有很多应用程序可用，如图 5.17 所示。如果更详细地检查，它们将像 Microsoft Windows\
  \ 应用程序一样响应。然而，如果启动了配置为检测目标系统的 `Nmap` 扫描，`Nmap` 将准确确定目标是一个 `Linux` 系统，因为应用程序本身并不构建\
  \ TCP 数据包；那仍然操作系统的工作。\n\n| ![B9781597494250000099/f05-17.jpg is missing](img/f05-17.jpg)\
  \ |\n| --- |\n| 图 5.17. |\n| Nepenthes 蜜罐的 Nmap 扫描结果 |\n\n为了演示 `Nepenthes` 安全接受恶意攻击的能力，我们可以针对\
  \ `Nepenthes` 上运行的服务启动 `Metasploit`，它会记录任何攻击尝试。图 5.18 是 `Metasploit` 的 `autopwn`\
  \ 脚本攻击 `Nepenthes` 服务器的截图。\n\n| ![B9781597494250000099/f05-18.jpg is missing](img/f05-18.jpg)\
  \ |\n| --- |\n| 图 5.18. |\n| Metasploit 攻击 Nepenthes |\n\n\n\n\n\n图 5.19 是 Nepenthes\
  \ 服务器记录 Metasploit 攻击的屏幕截图。当文件被推送到服务器时（通常是 shellcode），Nepenthes 会保存该文件并创建二进制文件的\
  \ MD5 哈希值，并使用该 MD5 哈希值作为二进制文件的文件名。在图 5.19 中，我们看到至少三个不同的 `.bin` 文件被保存到了 `var/hexdumps`\
  \ 文件夹中。这三个二进制文件被 Metasploit 用于尝试创建一个连接回 Metasploit 应用程序的反向 shell。\n\n| ![B9781597494250000099/f05-19.jpg\
  \ is missing](img/f05-19.jpg) |\n| --- |\n| 图 5.19. |\n| Nepenthes 攻击日志 |\n\n一旦捕获了二进制文件，我们就可以在渗透测试（PenTest）实验室开始分析。使用\
  \ Metasploit 允许我们观察 Nepenthes 的运行，收集大量的恶意软件文件；如果 Nepenthes 连接到家庭网络，在捕获到任何东西之前可能需要几天或几周的时间。在大型企业网络中，Nepenthes\
  \ 可能会非常活跃。拥有一个能够与其位置相匹配的处理能力的系统至关重要。如果硬盘满了且服务器无法捕获最新的二进制文件，蜜罐将变得毫无用处。\n\n### 信息分析\n\
  \n如果我们导航到存储捕获文件的目录（如图 5.20 所示），我们可以看到 Nepenthes 捕获了大量数据包，如果 Nepenthes 的服务确实可以被利用，这些数据包本可以提供从\
  \ Nepenthes 服务器返回攻击系统的反向连接或后门。一旦捕获到恶意代码，我们就可以在实验室中运行该软件，并分析它在实际 Windows 系统上运行时会发生什么。\n\
  \n| ![B9781597494250000099/f05-20.jpg is missing](img/f05-20.jpg) |\n| --- |\n|\
  \ 图 5.20. |\n| 来自 Metasploit“autopwn”攻击中捕获的恶意软件 |\n\n我们可以可以使用工具来理解恶意软件的设计目的。第一个是\
  \ `Wireshark`，它将捕获恶意软件产生的所有网络通信。我们还可以对恶意软件本身进行逆向工程，以发现额外信息，例如通信、加密、传播和更新方法。\n\n\
  **警告** 用于从一个系统移动恶意软件到另一个系统的介质只能在恶意软件内部内部，或在使用后立即销毁。绝不要将介质带入另一个网络——恶意软件使用的介质感染方法非常有效。本书不会演示如何分析恶意软件；但在专业的渗透测试中，分析恶意软件的能力非常有益，因为渗透测试工程师可能需要创建模拟恶意软件的代码以在渗透项目中取得成功。在测试实验室中使用真实世界的恶意软件（或\
  \ `Metasploit`）复制攻击，也可以向高层管理解释企业系统威胁的有效工具。\n\n# 其他目标想法\n\n渗透测试实验室还可以用于参加互联网和安全会议上的挑战。虽然这些挑战可能无法准确反映真实世界的情况，但它们可以扩展渗透测试工程师的技能。最受欢迎（或具有新闻价值的）挑战之一是夺旗赛（CTF）活动，在世界各地的安全会议上都能看到。这些活动迎了不同水平的黑客，并且变得越来越频繁。CTF\
  \ 活动中使用的二进制文件通常可以下载并在实验室中重新创建，以便练习和积累经验。有一些专注于安全的网站提供可下载的挑战，包括涉及逆向工程、编程和破解数据保护方案的挑战。这些网站还可能提供基于\
  \ Web 的挑战，展示为人知的 Web 设计缺陷。虽然 Web 挑战无法在实验室中复制，但它们允许工程师了解在专业渗透测试中可能存在且可发现的风险。\n\n\
  ## CTF 活动\n\n最著名的 CTF 活动每年在内华达州的 DefCon 上举行，它要求参赛者必须赢得一项全球性的资格赛。参加 DefCon CTF 所需的技能至少包括逆向工程和漏洞利用脚本编写。每年，该活动的服务器镜像都会向公众发布，以便他人分析活动中使用的可利用应用程序。由于参加\
  \ DefCon 活动的竞争非常激烈，在 DefCon 获胜所需的技能组合是非常相当的。最近，DefCon 增加了一个初级 CTF 活动，目前命名为 Open\
  \ Capture the Flag (oCTF)，它向所有人开放——oCTF 不设资格赛。攻破 oCTF 服务器所需的技能并不像攻破主 DefCon CTF\
  \ 活动服务器的所需的技能那么先进，而且它是学习应用程序和操作系统黑客技术的极佳方式。较小的 CTF 活动开始在世界各地出现，包括大学间的赛事。以下是与全球举行的各种\
  \ CTF 活动相关的链接——可以获取服务器镜像下载：\n\n- Nops-R-Us (`http://nopsr.us/`): DefCon 活动、二进制文件和步骤解析\n\
  - 加州大学圣塔芭芭拉拉分校 (`http://www.ucsb.edu/~vigna/CTF/`): 国际 CTF\n- DC949 Group (`http://www.dc949.org/`):\
  \ DefCon oCTF 的举办者\n- Chaos Computer Club (`http://ctf.hcesperer.org/`)\n\n## Web\
  \ 端挑战\n\n存在许多提供查看者黑客挑战的网站。某些挑战是可以下载的并可在渗透测试实验室中使用——另一些则是完全在线的。在线挑战倾向于基于 Web 的场景，而其他挑战侧重于逆向工程、缓冲区溢出和克服数据保护方案等。建议访问的网站包括：\n\
  \n- Hack This Site! (`http://www.hackissite.org/`): 应用、Web 和编程挑战。\n- Crackmes.de\
  \ (`http://crackmes.de/`): 逆向工程挑战，旨在教授如何破解数据保护方案。\n- HellBound Hackers (`http://www.hellboundhackers.org`):\
  \ Web、逆向工程挑战以及限时编程挑战。\n- Try2Hack (`http://www.try2hack.nl/`): 几个基于 Web 的挑战。\n\n\
  # 破解数据保护\n\n地下黑客社区对能够分析和破解数据保护方案的人有巨大需求。这种技能最大的应用是针对软件保护方法。虽然学习破解商业软件的保护方法可能没有实际理由，但能够做到这一点需要逆向工程技能，而这在专业渗透测试中确实有实际应用。\n\
  \n**来自地下笔记……**\n\n## 漏洞公告\n\n\n\n\n每天都有新的漏洞发布，并且可能包含概念验证代码（PoC）。无论何种情况，漏洞公告都为专业渗透测试人员提供了扩展技能的机会，他们可以通过使用概念验证重现漏洞利用，或者在仅知道应用程序已被利用的情况下尝试对该漏洞应用程序进行攻击。通常，只有当应用程序开发者能够创建并向用户推送补丁时，漏洞公告中才会包含概念验证。为了重现漏洞，通常需要获取应用程序的后继版本，因为研究人员通常会尝试留给开发者足够的时间来修复问题。对于针对没有补丁的应用程序的新漏洞，重现利用过程要困难得多——研究人员通常只从高层面描述漏洞，省略了允许他人重现利用的细节。关于漏洞利用确实存在的确认通常由应用程序开发者或通过与研究人员直接合作重现了利用的第三方发布。在某些情况下，漏洞公告包含的代码仅用于检测系统是否易受到该漏洞的影响。如果代码未经过编译，它可以用于缩小漏洞应用程序中可被利用的范围。在某些情况下，利用程序将会公开，通过检查这些程序可以更好地理解漏洞。\n\
  \n## 总结\n\n学习渗透测试的最佳系统选择是真实世界的服务器。遗憾的是，法律、伦理、资金或时间限制了大多数人将真实服务器作为攻击目标。次优选择是即用型（Turn-key）系统。如果目标是学习更高级的技术，那么内核和应用程序是首选目标。对于所有这些场景，最学习方法是使用测试实验室，无论是个人实验室还是公司生产实验室。即用型场景通常可以使用虚拟化或\
  \ LiveCD 快速部署在实验室中。这将节省时间并减少实验室所需的硬件数量。它们提供了复杂程度和技能要求各异的挑战，并试图模拟真实的漏洞。其他目标（包括恶意软件）也可以用于渗透测试实验室。从真实环境中收集恶意代码会带来额外风险，需要处理这些风险以防止感染其他网络（包括互联网网络）。恶意软件作者使用多种技术来避免检测和分析，并可能要求实验室中使用非虚拟化服务器。本章中的网络示例将贯穿本书的其余部分以及附带\
  \ DVD 中的视频。虽然可以创建与本章插图配置不同的可用实验室，但为了防止混淆，我们不会包含其他架构。然而，如果成功使用了其他设计，我请求将它们发布在 [Heorot.net](http://Heorot.net)\
  \ 论坛上，以造福可能想要尝试其他配置的人。还建议避免使用旧系统，以防止兼容性性能问题。我们将在后面的章节中进行一些内存型和 CPU 密集型攻击。拥有现代设备将显著提高重现本书中示例时的体验。\n\
  \n## 解决方案快速通道\n\n## 即用型场景与真实世界目标\n\n■ 使用真实世界的服务器作为测试目标具有风险且难以获取。■ 在适当的条件下，公司内部的生产实验室可以作为渗透测试实验室。\n\
  \n## 即用型场景\n\n■ 即用型系统为渗透测试实验室提供了可练习的安全目标。■ 在渗透测试实验室中使用 `LiveCDs` 可以节省时间，特别是当攻击导致系统崩溃时。■\
  \ 即用型场景通常包含已知漏洞并模拟真实服务器。■ 某些即用型系统会使主机系统易受到攻击，应仅在闭环网络中使用。\n\n## 使用可利用目标\n\n■ 操作系统可用于分析和重现根内核（rootkits）。■\
  \ 应用程序攻击比操作系统攻击需要更多。■ 对可用利用程序进行分析有助于理解如何构建新的利用程序。\n\n## 分析恶意软件 – 病毒和蠕虫\n\n■ 恶意软件实验室需要超出其他实验室的额外保护。■\
  \ 应该预期恶意软件实验室内的所有系统会被完全破坏。■ 恶意软件会尝试与外部系统通信；恶意软件实验室不应与外部网络连接，特别是互联网。■ 恶意软件可能会检测到虚拟化软件的使用——实验室可能需要使用非虚拟化系统。■\
  \ 大多数恶意软件针对 Windows 操作系统。蜜罐应放置在不同操作系统的主机系统上，以增加针对主机被利用的额外保护。\n\n## 其他目标想法\n\n\n\n\
  \n■ CTF 活动是在安全环境中学习和使用逆向工程及应用漏洞利用的绝佳途径。CTF 活动在全球范围内举行，它们通常会向公众提供活动中使用的服务器镜像或二进制文件。■\
  \ 基于 Web 的挑战可能无法反映真实世界的漏洞，但可以提高任何对渗透测试感兴趣的人技能。\n\n**Q:** 如何成为一名优秀的渗透测试员（PenTester）？\n\
  **A:** 令人惊讶的是，我经常收到这个问题。正如本章所讨论的，学习专业黑客技能有很多障碍。使用黑客工具的能力只是方程式的一部分，建立实验室只是一个开始。然而，实践和方法论的使用至关重要。建立实验室将有助于实践；我们将在第\
  \ 6 章中讨论方法论。\n\n**Q:** DE-ICE 挑战的 root 密码是什么？\n**A:** 挑战的一部分就是让你使用不同的黑客工具发现 root（或任何用户）的密码。\n\
  \n**Q:** 为什么没有带有 Windows 操作系统的渗透测试 LiveCD？\n**A:** 许可问题。Linux 发行版的许可比微软 Windows\
  \ 软件要灵活得多。\n\n**Q:** 我在实验室中运行其中一个场景时遇到了问题。我该如何修复？\n**A:** 最佳建议是访问场景开发者，并寻找讨论故障排除的论坛。\n\
  \n**Q:** BackTrack 中的一个工具没有按预期工作。我该如何修复？\n**A:** 最佳建议是访问工具开发者，并寻找讨论故障排除的论坛。\n\n\
  **Q:** 我实验室里有旧的计算机系统，它们无法运行本章包含的场景。我该如何修复？\n**A:** 最佳建议是访问场景开发者并寻找讨论故障排除的论坛……或者购买新的设备。\n\
  \n**Q:** 我必须在实验室中使用路由器吗，尽管你们的示例中显示了路由器？\n**A:** 本章给出的示例是书中示例中所使用的网络配置。与书籍网络配置不匹配的网络可能仍然有效，但不保证一定可行。在大多数情况下，使用路由器仅仅是为了为网络提供路由协议并处理\
  \ DHCP 请求。\n\n**Q:** 我查看了 Metasploit 和 milw0rm 上的一些漏洞利用脚本，我无法理解它们是做什么的——我没有编程技能来理解语法。\n\
  **A:** 现在是学习编程的好时机，这不仅有助于理解漏洞利用脚本，还能通过自动化攻击来加速渗透测试项目的进度。\n\n**Q:** 我破解了一个软件的数据保护方案，我需要知道在哪里发布这种方法。\n\
  **A:** 去咨询律师吧——他们能够为你提供关于如何处理你的这种方法的信息（那可能是让你立即忘记它并销毁所有活动痕迹……或者不一定如此）。\n\n## 扩展你的技能\n\
  \n想知道如何在实验室中创建和使用渗透测试目标吗？以下练习旨在为你提供额外的知识和技能，以便你更好地理解这个主题。请使用你的实验室进行以下练习。\n\n## 在渗透测试实验室中使用即用场景（Turn-Key\
  \ Scenarios）\n1. 使用第 4 章 下载并安装的 `VMware` 软件，按照本章描述的网络配置和启动方法，运行随附 DVD 中的所有场景，包括：\n\
  ■ De-ICE LiveCD 1.100\n■ De-ICE LiveCD 1.110\n■ De-ICE LiveCD 2.100\n■ `Hackerdemia`\
  \ LiveCD\n■ `pWnOS`\n■ `WebGoat`\n■ `BackTrack`\n2. 从 `BackTrack` 节点对每个目标进行 `Nmap`\
  \ 扫描以验证连通性。打印结果。\n\n在渗透测试实验室中使用即用场景\n1. 定义以下漏洞和利用方法：\n■ 跨站脚本 (`XSS`)\n■ 缓冲区溢出\n\
  ■ 注入漏洞\n■ 拒绝服务\n■ 欺骗\n■ 应用程序接口 (`API`) 钩（hook）\n■ Rootkit\n■ 僵尸网络（BotNet）\n■ 暴力破解攻击\n\
  ■ 蠕虫\n■ 病毒\n■ 逆向工程\n\nReferences McAfee Threat Center, *2009 threat predictions\
  \ report* (2009); [`www.mcafee.com/us/local\\_content/reports/2009\\_threat_predictions_report.pdf`](http://www.mcafee.com/us/local\\\
  _content/reports/2009_threat_predictions_report.pdf). Mertvago, P., *The comparative\
  \ Russian-English dictionary of Russian proverbs & sayings*. (1995) Hippocrene Books,\
  \ New York .\n\n# 第 6 章. 方法论\n\n## 引言\n\nДело не в споре, а в сговоре。 – 俄罗斯谚语：*“It's\
  \ not the dispute but the agreement that matters.”* (Mertvago, 1995) 欢迎来到本书的理论部分。其他大多数章节侧重于实践活动；但本章完全关于如何进行渗透测试的理论。理解方法论背后的理论将提高成功完成渗透测试项目的机会。\n\
  \n# 框架与方法论——名称有什么区别？\n\n框架与方法论之间存在显著差异：框架主要侧重于实现结果所需的流程，而方法论则封装了流程、活动和任务。在本章讨论的三个文档中，只有\
  \ `OSSTMM` 可以真正被认为是方法论。本章将不会关注框架与方法论之间的语义差异——它将关注目前用于执行渗透测试的工具，以便读者无论标签如何，都能为客户实施并采用最他们的程序。\n\
  \n**工具与陷阱……**\n\n\n\n\n当大多数人想到项目管理时，他们通常会想到土木工程。当有人提到项目管理时，脑海中浮现出道路、大坝、桥梁和其他大型项目的形象并不稀奇。在土木工程之后，紧接着的是制造业——摆满小部件的传送带，装满待运往全球的箱子。对于那些接触过计算机和信息技术的人来说，项目管理的想法会转向编程或网络架构。提到项目管理时，像\
  \ `Waterfall` 模型和 `Spiral` 模型这类令人望畏的词汇也会随之而来。然而，很少将“项目管理”和“渗透测试”这两个词放在一起。在没有任何任何计划的情况下进行渗透测试等同于灾难。一个可重复的过程以及通常与项目管理相关的所有文档，可以大大提高渗透测试的质量——更不用说降低成本和提高整体利润。这就是使用项目管理协会（`PMI`）的\
  \ `PMBOK` 的魅力所在。\n\n## 工具与陷阱……\n\n# 项目管理不仅仅是项目经理的事务\n\n`PMBOK` 这一节中的定义刻意保持简短，旨在帮助工程师理解项目管理的复杂性以及工程师在项目中的角色。尽管每个过程都可以拆分为更细的粒度，但本章提供的高层级解释已足够我们的讨论。项目管理是一门需要深层次知识的专业；作为工程师，培训时间不仅应该用于理解技术任务，还应该理解这些任务如何融入整个项目。\n\
  \n## PMBOK 简介\n\n`PMBOK` 最初由 `PMI` 于 1987 年首次出版，试图标准化项目管理实践和信息。尽管我们将讨论 `PMBOK` 定义的项目内部的各个过程，但本节并非仅针对项目经理编写；它实际上是为渗透测试工程师编写的，以便他们熟悉整个渗透测试项目。对于想要了解\
  \ `PMBOK` 如何应用于专业渗透测试的项目经理来说，我们在这里从高层面讨论了这些流程，并在本书的各个章节中也对其进行了更详细的讨论。`PMBOK` 将项目生命周期分为五个不同的组：`Initiating\
  \ Processes`、`Planning Processes`、`Executing Processes`、`Closing Processes` 以及 `Monitoring\
  \ and Controlling Processes`。我们将在本节中关注每一个组。请注意，这些并不是项目中的阶段——而是根据项目的状态和情况可以重复的活动集合。\n\
  \n## 启动过程组\n\n在 `Initiating Process` 组中，我们试图获得启动项目的批准。项目通常是为了满足某些业务需求而创建的。在渗透测试的情况下，需求通常是识别系统或网络的安全态势。一旦明确了安全态势，业务就可以对识别出的任何漏洞做出管理决策。这些决策可以是修复漏洞、缓解威胁、接受后果或转移风险（例如将应用程序/系统外包给第三方或外包管理工作）。\n\
  \n**给工程师的提示**：专业渗透测试员的工作不是决定如何处理任何识别出的漏洞或利用。那是基于风险管理实践的业务决策。在与客户讨论发现时要小心——可以就*如何*消除、缓解或转移风险提出建议，但我们不应该自以为是地*告诉*客户该做什么。那是客户管理团队获得报酬要做的事情——做出决策。图\
  \ 6.1 `Initiating Process` 组提供了项目启动时发生的过程。项目经理需要知道项目包含哪些和排除哪些。识别利益相关者允许项目经理知道谁需要参与其中，以及他们何时应该被纳入沟通中。\n\
  \n- `Develop Project Charter`：`Project Charter` 授权项目的启动，并用于定义项目范围。一份编写良好的 `Project\
  \ Charter` 将结合工作说明书（`SOW`）、合同和行业标准，以确保项目满足所有利益利益相关者的业务需求。\n- `Identify Stakeholders`：渗透测试影响大量人员，包括系统所有者、网络管理员、安全工程师、管理人员、部门负责人等。需要识别所有受\
  \ `PenTest` 影响的人员，以便利益相关者之间的沟通是有效的。\n\n\n\n\n\n规划过程组包含以下过程（PMI, 2008）：\n\n- **制定项目管理计划\
  \ (Develop Project Management Plan)**：`Project Management Plan` 是该过程组内所有其他过程的总和。一旦初步完成所有其他过程，项目经理将更好地了解项目在时间、必要工具/设备、变更管理以及所有工作将如何完成方面的进展情况。\n\
  - **收集需求 (Collect Requirements)**：此过程将 `Project Charter` 转换为需求文档，这涉及将业务目标转换为工程师需要满足的技术需求。还应该收集限制条件，例如“不允许发生拒绝服务攻击”。\n\
  - **定义范围 (Define Scope)**：此过程的结果应该是创建 `Scope Statement`（范围说明书），它定义了项目的目标、需求、边界、假设和交付物。\n\
  - **创建工作分解结构 (Create Work Breakdown Structure (WBS))**：`WBS` 识别了完成项目需要哪些实际工作，并提供足够的细节让工程师知道他们需要做什么工作。`WBS`\
  \ 不是进度表；但它被用于明确定义活动并识别可能存在的冲突（例如使用工具的需求冲突）。\n- **定义活动 (Define Activities)**：利用源自项目范围的信息，可以识别项目内的活动并确立里程碑。里程碑可以是大型事件，例如文档收集的完成、实际\
  \ `PenTest`（渗透测试）的完成，以及最终报告提交之后。过于细粒的里程碑（例如在 `Information Gathering` 信息收集完成后、`Vulnerability\
  \ Identification` 漏洞识别完成后）往往会失去意义，特别是因为实际的 `PenTest` 通常持续时间很短。\n- **排列活动 (Sequence\
  \ Activities)**：通常，项目的某部分在另一部分完成之前无法开始。`Sequence Activities` 过程创建一个项目进度网络图，显示事件的顺序，这些顺序受工作流依赖关系的影响。在渗透测试中，对排序影响最大的往往是资源。\n\
  - **估计活动资源 (Estimate Activity Resources)**：估计执行每项活动所需的材料、人员、设备或用品类型和数量的过程。而且……无论工程师怎么说，大量的免费、含咖啡因的汽水并不是关键资源。\n\
  - **估算活动时长 (Estimate Activity Durations)**：一旦项目经理知道项目期间将发生哪些活动，他们就需要了解资源（如工具和系统）的压力程度。如果竞争活动需要相同的资源，项目经理必须能够相应制定计划。估算活动时长有助于项目经理组织工作活动，以便更好地利用资源。\n\
  - **制定进度 (Develop Schedule)**：在活动列表、项目进度网络图和活动时长经过计算并正式化后，即可生成进度表。在大多数渗透测试中，活动可以用人天来衡量。\n\
  - **估算成本 (Estimate Costs)**：一旦制定了进度表并识别且安排了资源，就可以创建项目成本估算。一旦确定了估计成本，与项目将产生的收入相比，该项目可能并不划算。`Estimate\
  \ Cost` 过程将帮助管理层决定是否继续项目。\n- **确定预算 (Determine Budget)**：估算成本并不总是反映项目中的实际成本。此过程包含了其他因素，以确定项目预算应该是多少。在一些较小的公司中，`PenTest`\
  \ 团队执行预算的程度会影响奖金。\n- **规划质量 (Plan Quality)**：项目经理如何知道正在进行的工作是高质量的工作？规划质量的过程会创建指标和检查清单。\n\
  - **制定人力资源计划 (Develop Human Resource Plan)**：进行渗透测试需要具有特定技能组合的工程师。`Human Resource\
  \ Plan` 识别了所需的角色、职责和汇报链。对于初创团队，这就是为什么 `Develop Team` 过程（后文讨论）如此关重要的原因。可以使用公司人员作为顾问而不扩大团队规模。\n\
  - **规划沟通 (Plan Communications)**：一旦确定了利益相关者以及他们在不同事件期间所需的沟通类型，就可以创建沟通管理计划。所有可能的紧急情况都应包含在。\n\
  - **规划风险管理 (Plan Risk Management)**：风险管理计划引用项目本身，而不是在 `PenTest` 发现的风险。在管理风险时，经验通常提供最佳行动方案。\n\
  - **识别风险 (Identify Risks)**：风险注册表列出了项目的潜在风险，并识别了减轻、消除、转移或承担每个风险的可能解决方案。如果渗透测试项目是新的，与工程师和管理层交流会有帮助。\n\
  - **进行定性分析 (Perform Qualitative Analysis)**：一旦识别了项目的风险，就会进行分析以确定应该采用哪种解决方案。此过程对那些无法使用定量分析的风险进行定性分析。\n\
  - **规划风险应对 (Plan Risk Responses)**：根据风险管理计划，此过程开发了项目经理可能采取的减少对项目威胁的方案。由于渗透测试中几乎总是存在一种风险是“系统将崩溃并可能损失数百万美元”，`Plan\
  \ Risk Responses` 过程不应仓忙创建。\n- **规划采购 (Plan Procurements)**：如果需要额外的资源来正确完成项目（包括外包或购买系统/工具），此过程概述了购买方法（招标、购买“现货”等）以及识别潜在的供应商或承包商。渗透测试中的规划问题涉及资源的使用——特别是软件工具。商业渗透测试工具通常有严格的许可协议，这可以极大地限制用户数量和目标的\
  \ IP 协议地址范围。此外，这些许可协议通常需要每年更新，如果渗透测试项目频繁或较小，可能并不总是具有成本效益。正如我们所看到的，项目内部发生了大量的规划。记住，虽然在项目开始时创建了许多规划文档，但项目经理将根据整个项目生命期间的发现对其中每份文档进行修改。\n\
  \n**注意** *工程师*：“大多数工程师从未参与过任何规划活动”这种说法并不是指项目工程师，他们应该被视为项目的利益相关者并参与项目生命周期的每一个阶段。\n\
  \n执行过程组\n\n\n\n\n\n图 6.3 包含了执行过程组（Executing Process group）内的过程列表。该组积极涉及渗透测试工程师，通常被视为“计划-执行-检查-处理”（Plan-Do-Check-Act）循环中的“执行”（DO），如图\
  \ 6.4 中识别出的信息收集、漏洞识别、漏洞验证和攻破步骤。\n\n| ![B9781597494250000105/f06-03.jpg 缺失](img/f06-03.jpg)\
  \ |\n| --- |\n| 图 6.3。 |\n| 执行过程组 | |\n\n| ![B9781597494250000105/f06-04.jpg 缺失](img/f06-04.jpg)\
  \ |\n| --- |\n| 图 6.4。 |\n| 计划-执行-检查-处理生命周期 | |\n\n尽管执行过程中有很多大量的活动，但结果通常会与计划过程中创建的文档中列出的预期进行对比，这随后会导致项目预期的被修改，进而导致执行过程中的活动也发生变化。即使在渗透测试中，也存在不断的测量和修订循环，这为“范围蔓延”（scope\
  \ creep，任何项目经理的噩梦）提供了“机会”。范围蔓延发生在对项目范围进行更改但没有任何机制来控制这些更改时，这可能会导致项目成本超出接受范围。明智地使用执行组中的以下过程可以帮助防止范围蔓延（PMI,\
  \ 2008):\n\n*   **指导和管理项目执行**：一旦分配了任务，项目经理必须指导并管理工程师，以确保按时且在预算内成功完成任务。\n*   **执行质量保证**：在此过程中使用之前定义的质量指标，以识别项目团队满足质量标准的程度。\n\
  *   **获取项目团队**：一旦确定了渗透测试项目的需求，项目经理就可以尝试为工作获取最佳的团队成员，但这说起来做起来难。\n*   **开发项目团队**：在渗透测试团队成员存在知识或技能缺陷的情况下，项目经理可以分配资金并安排培训，使团队成员达到项目要求。\n\
  *   **管理项目团队**：在项目过程中必须跟踪团队成员的性能并解决出现的问题。\n*   **分发信息**：通信在项目中至关重要；此过程确保信息在正确的时间传递给正确的利益相关者。\n\
  *   **管理利益相关者预期**：利益相关者对项目的预期与实际情况之间总是存在差异。这并不一定是因为沟通不当，而是可能由于项目期间发现的发现。项目经理需要在这些变化期间管理利益相关者的需求和预期。\n\
  *   **进行采购**：如果有需要招聘的人员或购买工具，此过程旨在促进这些任务。\n\n**注意** 经理：计划-执行-检查-处理生命周期不仅限于整个渗透测试项目。实际渗透测试中的每个活动（信息收集、漏洞识别、漏洞验证等）都使用此循环来验证和修改之前的发现。当发现工程师似乎在重复之前的任务时，请不要惊讶；他们只是在“列举发现的结果”。\n\
  \n## 结束过程组\n\n图 6.5 说明了属于结束过程组（Closing Process group）的两个过程。这是将最终文档发布给客户并结束合同协议的地方。最好的做法是与渗透测试团队就项目事件进行简报，以便吸取教训并改进未来的项目。\n\
  \n| ![B9781597494250000105/f06-05.jpg 缺失](img/f06-05.jpg) |\n| --- |\n| 图 6.5。 |\n\
  | 结束过程组 | |\n\n结束组中的过程如下（PMI, 2008):\n\n*   **结束项目或阶段**：此过程关注多项活动——也许最重要的是向客户发布最终风险评估报告，详细列出所有识别和利用的漏洞以及修复建议。此外，还完成了合同签署、进行了行政措施并执行了存档活动。\n\
  *   **结束采购**：项目执行期间采购的任何资源都需要释放给其他项目（或在外包的情况下予以终止）。此过程促进了这项活动，以确保没有遗漏。如果运气好，项目经理将释放渗透测试团队开始另一个渗透测试项目。无论如何，所有收集和记录的项目数据都需要存档，以备未来项目或信息查询之。之前的渗透测试通常会被重新回顾；对项目数据进行适当存档对于业务和渗透测试团队未来的成功至关重要。\n\
  \n## 监控和控制过程组\n\n尽管之前的过程组之间似乎存在镜像计划-执行-检查-处理循环的自然进展，但 PMI 加入另一个过程组——监控和控制过程组（Monitoring\
  \ and Controlling Process group）。监控和控制项目是一个持续的过程，与项目同步开始和结束。由于在项目的整个生命期间都会产生发现它们可能会影响项目的方向，包括项目范围的修改。监控和控制过程组中的过程（见图\
  \ 6.6）被项目经理用于系统地控制这些变化，确保时间、预算、范围和质量不受负面影响。\n\n| ![B9781597494250000105/f06-06.jpg\
  \ 缺失](img/f06-06.jpg) |\n| --- |\n| 图 6.6。 |\n| 监控和控制过程组 | |\n\n\n\n\n\n为了控制项目内部不可避免的变化，项目经理（PM）可以使用以下流程(PMI,\
  \ 2008)：\n\n*   **监控和控制项目工作**：会发生一些延迟项目进度的事件——例如人员生病、资源不可用（故障）、灾难发生等。尽管项目经理必须在进度中包含某些偏差以适应这些事件，但必须对项目的进度进行跟踪、审查和规管，以确保质量和预算不受影响。\n\
  *   **执行集成变更控制**：变更请求几乎出现在每个项目中。以系统化的方式控制这些变更至关重要。批准变更、管理交付成果的变更、添加或修改项目文档以及更改项目管理计划，所有这些都属于“执行集成变更控制”过程的范畴。\n\
  *   **核实范围**：此过程确保利益相关者理解并认可项目交付成果。\n*   **控制范围**：与“执行集成变更控制”类似，变更必须是系统性的，特别是针对项目范围。\n\
  *   **控制进度**：在某些情况下，项目的变更会影响进度。这种情况如何发生以及何时发生由“控制进度”过程进行管理。\n*   **控制成本**：项目的变更也会影响项目的成本。这种情况如何发生以及何时发生由“控制成本”过程进行管理。\n\
  *   **执行质量控制**：质量是项目每个阶段必须控制的内容。对于渗透测试而言，由于质量控制疏散而忽略信息或漏洞是非常危险的，因为这给客户提供了虚假的安全感。良好的质量控制过程有助于降低与假阴性相关的风险。\n\
  *   **报告性能**：需要收集预测、状态报告和进度，并告知相关的利益相关者。“报告性能”旨在旨在这些需求。\n*   **监控和控制风险**：为了警惕即将到来的风险，此过程重点关注实施风险响应计划、跟踪已识别风险、监控剩余风险、识别新风险并在项目生命周期内评估风险过程。\n\
  *   **管理采购**：遗憾的是，在商业世界中维护采购并不简单。需要管理采购关系并监控合同执行情况。\n\n监控和控制过程贯穿项目的整个生命周期。在专业渗透测试中，项目通常很短，可能只持续一到两个月。与跨越多年且耗资数十亿的大型项目不同，渗透测试项目可以根据你的组织要求降低正式程度。在小型项目中，风险注册表可以写在索引卡上；`WBS`\
  \ 可能是一个 wiki 页面；定性和量性的风险分析可能仅限于与团队的几次会议；而沟通计划可能简单到只需在手机上添加一个快捷拨号。然而，所有这些过程都需要在渗透测试项目中得到解决——这些流程的正式程度可以有所不同。\n\
  \n## 工具与陷阱……\n\n# 项目管理与工程\n\n在许多项目中，项目经理和工程师之间往往存在摩擦，这种摩擦可能变成直接的敌意。这是遗憾的，因为使用项目经理是为了提高所有参与者的成功机会。工程师需要意识到，项目管理是项目中的资产，而不是障碍。\n\
  \n# 信息系统安全评估框架\n\nISAF 在开放信息系统安全组（OISSG）的支持下，是一个经过同行评审的过程，它提供了关于如何进行渗透测试的深度信息。ISAF\
  \ 的优点之一是它在渗透测试的任务与渗透测试工具之间建立了明确的联系。尽管 OSSTMM 没有建议在评估期间使用任何特定工具，但专业的渗透测试人员在使用 OSSTMM\
  \ 作为渗透测试方法论时，会使用 ISSAF 中大部分（如果不是全部）工具。在本书的第二部分，我们将广泛使用 ISSAF，但也会参考其他方法论。\n\n## 计划与准备\
  \ – 第一阶段\n\n正如我们在 PMBOK 中看到的，仅用于项目规划就有 20 个不同的过程。诚然，并非所有过程对于每次渗透测试都是必要的，但其详尽性是不容置疑的。ISAF\
  \ 也试图在计划与准备领域为用户提供指导——这一领域对于渗透测试项目的成功至关重要。然而，以下引用是 ISSAF 指导的范围（开放信息系统安全组 [OISSG],\
  \ 2006](#B9781597494250000105.xhtml#ref2)）：\n\n第一阶段：计划与准备该阶段包含了交换初始信息、计划和准备测试的步骤。在测试之前，双方将签署正式的评估协议。这将为该任务提供依据和相互的法律保护。它还将指定具体的参与团队、测试的具体日期、时间、升级路径和其他安排。该阶段预计包含以下活动：\n\
  \n*   识别双方的联系人\n*   召开启动会议以确认范围、方法和技术路线\n*   同意特定的测试用例和升级路径\n\n对于任何专业的渗透测试项目经理来说，这几乎毫无用处。尽管该方法论仅为\
  \ `0.2B` 版本，但未来渗透测试方法论的这一阶段可能会更加健壮——在此之前，应该使用不同的方法论来计划和准备专业的渗透测试项目。\n\n## 评估 – 第二阶段\n\
  \n\n\n\n\n仅仅因为 ISSAF 没有详细说明渗透测试的规划和准备工作，并不意味着应该放弃该方法论的其他部分。事实上，本书的第 2 部分紧密遵循了 ISSAF\
  \ 方法论，因为它将渗透测试的阶段分解为更细粒度的步骤并提供了更丰富的细节。ISSAF 的优点之一是文档提供的细节水平非常精细，甚至包含了软件工具的逐步操作示例以及运行这些工具所需的命令。仅使用\
  \ ISSAF，完全不熟悉渗透测试工具的人也可以重复文档中的示例，并获得关于这些工具作用以及工具结果含义的某些知识。这并不是进行渗透测试的最佳方法，但对于那些初入该行业的人士来说，它是一个有效的学习工具。尽管我们将在书中使用\
  \ ISSAF 提供的某些示例，但我们很快就会发现这些示例具有局限性且不全面。事实上，许多示例只展示了渗透测试工具的一小部分功能，专业人员需要在 ISSAF 提供的内容的基础上进行扩展，才能胜任这项工作。\n\
  \n在评估阶段（Assessment Phase）中，ISSAF 将渗透测试中的步骤称为“层”（layers）。这些层以及根据 ISSAF 的含义如下 (OISSG,\
  \ 2006):\n\n*   **信息收集 (Information Gathering)**：利用互联网查找关于目标的所有信息，同时使用技术和非技术方法。\n\
  *   **网络映射 (Network Mapping)**：识别目标网络内的所有系统和资源。\n*   **漏洞识别 (Vulnerability Identification)**：评估人员为检测目标漏洞的活动。\n\
  *   **渗透 (Penetration)**：通过绕过现有安全措施获取未经的访问，并尝试扩大访问范围。\n*   **获取访问与权限提升 (Gaining\
  \ Access and Privilege Escalation)**：成功利用目标系统或网络后，评估人员将尝试获取更高级别的权限。\n*   **进一步枚举\
  \ (Enumerating Further)**：获取有关系统程序的额外信息，目的是进一步利用已受破坏的网络或系统。\n*   **破坏远程用户/站点 (Compromise\
  \ Remote Users/Sites)**：利用远程用户与企业网络之间的信任关系和通信。\n*   **维持访问 (Maintaining Access)**：使用隐蔽通道、后门和根内核程序来隐藏评估人员在系统中的存在，或为受破坏的系统提供持续访问。\n\
  *   **掩盖踪 (Covering Tracks)**：通过隐藏文件、清除日志、破解完整性检查和破解反病毒软件来消除所有被破坏的迹象。\n\n渗透测试的层适用于以下目标：网络、主机、应用程序和数据库。在本书第\
  \ 2 部分中，我们将从不同程度讨论这些分类，但让我们先看看根据 ISSAF，哪些类型的评估属于每个类别。\n\n### 网络安全\nISSAF 以不同程度的细节提供了不同类型网络安全评估的详细信息。提供的信息包括有关主题的背景信息、标准配置示例、要使用的攻击工具列表以及预期结果。ISSAF\
  \ 的价值在于，它就某个主题提供了足够的信息，让初学者能够理解基础知识。以下是包含在网络安全中的主题列表 (OISSG, 2006):\n\n*   密码安全\n\
  *   交换机安全\n*   防火墙安全\n*   入侵检测系统安全\n*   虚拟网络安全\n*   反病毒系统安全\n*   存储区域网络 (SAN) 安全\n\
  *   无线局域网安全\n*   互联网安全\n\n在很多情况下，我们不需要阅读整个 ISSAF；例如，确保参考了 `Lotus Notes` 部分。同样，ISSAF\
  \ 是渗透测试团队（PenTest team）的一个良好起点。\n\n### 主机安全\nISSAF 在其主机安全列表中包含了最常用的操作系统。ISSAF 提供了每个平台的背景信息及其预期结果。包含以下评估：\n\
  \n*   Unix/Linux 系统安全\n*   Windows 系统安全\n*   Novell Netware 安全\n*   Web 服务器安全\n\n\
  **警告**\n*   *工程师*：ISSAF 版本 `0.2.1` 编写时，`Windows NT` 系统还是主导操作系统。情况已经发生了巨大变化，因此不要期望\
  \ ISSAF 中的示例适用于所有微软平台。\n*   *经理*：在期望渗透测试团队正确识别漏洞之前，请确保他们已经接受了目标操作系统最新版本的培训。\n\n\
  操作系统的底层架构多年年来发生了巨大的变化，要求一个熟悉 `Windows NT` 的工程师能够攻击 `Server 2008` 系统是不合理的。我在各种网络设备中见过操作系统，其中许多在发现它们在运行时令我很惊讶。Web\
  \ 服务器也包含在大量设备中，包括路由器、交换机、防火墙等。Web 服务器不再仅仅用于互联网——它们一直被用作管理的图形界面。\n\n### 应用程序安全\n\
  应用程序与数据库之间的界限很难界定——许多应用程序访问数据库才能运行。ISSAF 对界限的划分也不佳，将许多攻击活动包含在应用程序安全中（例如为了“控制数据库”的结构查询语言攻击）。根据\
  \ ISSAF，属于应用程序安全的评估如下 (OISSG, 2006):\n\n*   Web 应用程序安全评估\n*   SQL 注入\n*   源码审计\n\
  *   二进制审计\n\nWeb 应用安全是一个很大的话题；我们将讨论针对 Web 应用程序的特定技术。但我们将看到，我们攻击 Web 应用程序的方法与我们攻击所有应用程序的方法非常相似。通常，Web\
  \ 应用程序的不同之处仅在于涉及到数据库。\n\n### 数据库安全\nISSAF 为评估人员提供了四个不同的评估层，这些层可能涉及或不涉及 Web 和服务 (OISSG,\
  \ 2006):\n\n*   数据库远程枚举\n*   数据库暴力破解\n*   进程操控攻击\n*   数据库端到端审计\n\n## 社会工程学\n\n\n\
  \n\n\nISAF 的社会工程学章节讨论了许多较旧且为人知的社会工程技术，这些技术用于从系统用户处获取信息。遗憾的是，这些旧技术仍然非常有效。然而，该章节中缺少了一些目前更流行的技术，包括网络钓鱼（及其所有子集）和跨站脚本攻击（XSS\
  \ 攻击）。这正是将 ISSAF 作为渗透测试（PenTest）团队理解潜在威胁的起点的另一个原因，但而不应将其作为渗透测试项目的整个框架。\n\n## 报告、清理和销毁产物\
  \ – 第三阶段\n\nISAF 的最后阶段涉及将必要的报告提交给相关的利益相关者，并确保渗透测试期间生成的任何数据的安全。ISAF 并没有详细说明如何执行此阶段的任务，但提供了一些概括性的描述。\n\
  \n### 报告\n\n在专业的渗透测试中，可能会发生两种类型的报告——口头报告和书面报告。根据 ISSAF 的规定，口头报告适用于那些发现关键问题并需要几乎立即报告的情况。尽管\
  \ ISSAF 没有特别提到，但将任何口头交流的发现包含在最终报告中可能是明智的。这意味着，即使关键问题在最终报告发布给利益相关者之前已修复，也会形成一份正式记录。\n\
  \n**警告**任何关于关键问题或具有敏感或法律性质发现的口头报告都需要仔细处理。如果违反了法律，可能需要通知当地或联邦探员，利益相关者可能需要被排除在任何形式的口头报告之外。在渗透测试之前，应该根据需要识别并联系法律和执法部门代表。在最终书面报告中，ISAF\
  \ 要求包含以下内容（OISSG, 2006）：■ 管理层摘要 ■ 项目范围 ■ 使用的渗透测试工具 ■ 使用的利用程序 ■ 测试日期和时间 ■ 工具和利用程序的所有输出\
  \ ■ 已识别漏洞列表 ■ 减轻已识别漏洞的建议（按优先级组织）。这些要求应该出现在最终文档的正文中，而不是被归类到附件中。根据个人经验，这可能会产生一份难以阅读的冗长文档。我们将在本书的第\
  \ 3 部分中讨论报告，以扩展这一主题。\n\n### 清理和销毁产物\n\nISAF 没有在渗透测试的第三阶段详细讨论这一步骤。事实上，整个步骤仅限制在以下段落（OISSG,\
  \ 2006）：在被测试系统上创建和/或存储的所有信息都应从这些系统中移除。如果由于某些原因无法从远程系统实现，则所有这些文件（及其位置）都应在技术报告中说明，以便客户技术人员在收到报告后能够删除这些文件。在\
  \ ISSAF 的未来版本中，可能会提供有关如何加密、清理和销毁渗透测试期间创建并在之后保留的数据的更多细节。在此，我们将在本书的第三部分讨论这些问题。\n\n\
  # 开源安全测试方法手册\n\nOSSTMM 最初于 2000 年引入信息系统安全行业。当前版本为 3.0 版，由安全与开放方法学会 (ISECOM) 维护。该手册通过同行评审开发，并以开源许可发布，可以在\
  \ [www.isecom.org](http://www.isecom.org) 获取。虽然 OSSTMM 提供了一种执行渗透测试的方法，但它首要是一种审计方法，可以满足监管和行业要求。尽管\
  \ OSSTMM 提供执行渗透测试的方法，但在应用于企业资产时，它首先是一个审计方法。OSSTMM 的作者将其描述如下（Herzog, 2008）：该方法持续提供事实性的测试。作为一种方法，你无法从从中学习如何或为什么要进行测试；然而，你可以将其整合到你的需求中，使其与现有的法律和政策相符，以确保审计的详尽性。OSSTMM\
  \ 的早期版本也可以在随附的光盘中找到。OSSTMM 2.2 版本与新版本有显著不同，它似乎从头开始重写，涵盖了网络之外的多个安全领域。\n\n**注意**OSSTMM\
  \ 有多个版本的文档。虽然可以免费获取 OSSTMM，但访问最新版本需要加入 ISECOM 网站。\n\n## 规则\n\n为了满足某些项目需求，OSSTMM\
  \ 强制某些活动的发生并生成各种文档。尽管 OSSTMM 在列举渗透测试项目的组成部分方面比 ISSAF 更详尽，但并没有为项目经理在分配渗透测试项目时提供相应的流程。OSSTMM\
  \ 内部提供的信息包含了一些行业最佳实践，对于没有渗透测试社区经验的项目经理非常有益。以下是 OSSTMM 中“参与规则”的一段节录，列出了项目开始前所需的内容（Herzog,\
  \ 2008）：■ 项目范围 ■ 保密与非披露保证 ■ 紧急联系信息 ■ 工作说明变更流程 ■ 测试计划 ■ 测试过程 ■ 报告。在某些渗透测试中，这些可能满足客户的需求。然而，项目经理还需要许多补充来改进渗透测试项目（或任何项目），包括采购、风险识别（项目内部而非目标系统）、定性和定量风险分析、获取资源、成本估算和控制。无论如何，OSSTMM\
  \ 的规则章节确实包含价值信息，应该被阅读和遵循。\n\n## 通道\n\nOSSTMM 使用“通道”一词来分类组织内部不同的感兴趣的安全领域，包括物理安全、无线通信、电信和数据网络。这四个通道受审计和渗透测试的影响最大，并涉及\
  \ (ISC)² 识别的 10 个安全领域的大部分（参见第 3 章）。\n\n### 人员安全\n\nOSSTMM 这一部分的主要目的是确定组织内部安全培训的有效性。执行人员安全评估所需的技巧和工具包括对员工进行社会工程学。某些测试包括欺诈能力；对“心理虐待”的敏感性；窃听闭门会议、识别黑市活动以及发现获取企业员工隐私信息的程度；以及评估人员从企业员工处获取专有信息的能力。\n\
  \n### 物理安全\n\n\n\n\n使用 OSSTMM 进行物理安全审计涉及尝试在没有适当授权的情况下访问设施。任何有意从事涉及物理安全审计职业的人员都需要意识到其中涉及的危险，OSSTMM\
  \ 对这些危险列举（Herzog, 2008）：……由于传统屏障和武器导致的意外人伤害、与动物的互动、遭受有害细菌、病毒和真菌的影响、暴露于电磁和微波辐射（特别是可能永久损害听力或视力的辐射），以及任何形式的毒性或腐蚀性化学剂。物理安全审计侧重于评估设施内监控系统、安保人员及其部署、照明以及对安全事件的反应时间的有效性。\n\
  \n`Warning` 任何进行物理安全审计的人都需要准备好可能被执法部门发现并拘留。渗透测试人员在物理安全审计中的活动模仿了犯罪分活动，首要假设是你的活动是非授权的，且你对财产或他人安全构成了威胁。当面对携带实弹武器的人时，不要感到惊讶——这只是工作的一部分。\n\
  \n### 无线通信\n\nOSSTMM 不将无线通信通道限制为网络接入点与计算系统之间的连接。电子安全、信号安全和发射安全是该通道内的主题。任何可以被中断或拦截的电子发射都属于该通道，包括无线射识别\
  \ (RFID)、视频监控器发射、医疗设备和网络无线接入点。\n\n## 电信\n\n电信通道内的攻击领域涉及任何模式的语音通信，包括 PBX 系统、语音信箱和\
  \ VoIP。这些许多通信模式现在由计算机运行，容易受到网络攻击。渗透测试可以识别可能的信息泄露，无论是通过网络数据包的误导，还是访问员工账户的弱保护机制。\n\
  \n## 数据网络\n\n本书的主要目的是指导读者如何进行数据网络渗透测试。该通道专注于计算机和网络安全，涵盖了以下渗透测试程序（Herzog, 2008）：■\
  \ 网络侦查 ■ 枚举 ■ 识别 ■ 访问过程 ■ 服务识别 ■ 认证 ■ 欺骗 ■ 钓鱼 ■ 资源滥用。从第 9 章开始，我们将讨论所有这些程序，但将使用 ISSAF\
  \ 的术语。\n\n## 模块\n\n与 PMBOK 中的过程概念类似，OSSTMM 拥有模块，这些是渗透测试中可重复的过程。这些模块被用于 OSSTMM 识别的所有通道中。每个模块的实施可能不同，取决于目标系统或网络；然而，下介绍的概念描述了每个模块的高级目标（Herzog,\
  \ 2008）： \n\n### 第一阶段：监管\n- 态势审查：识别适用于目标的监管和立法政策。还会考虑行业惯例。\n- 物流：由于任何活动都不会在真空中发生，网络延迟和服务器位置可能会改变结果；有必要识别项目中存在的任何物流限制。\n\
  - 主动检测验证：验证交互检测、响应和响应可预测性的实践和广度。\n\n### 第二阶段：定义\n- 可视性审计：一旦确定了项目范围，渗透测试人员需要确定项目范围内目标的“可视性”。\n\
  - 访问验证：识别目标内的访问点。\n- 信任验证：系统通常与其他系统有信任关系以开展业务。该模块试图确定这些关系。\n- 控制验证：该模块衡量系统内违反机密性、完整性、隐私和不可否认性的能力，以及采取了哪些控制措施来防止此类损失。\n\
  \n### 第三阶段：信息阶段\n- 过程验证：评估人员检查了哪些过程来确保系统的安全态势维持在当前水平，以及这些过程的有效性。\n- 配置验证：在人员安全通道中，该模块被称为`培训验证`，检查目标的默认操作。将默认操作与组织的业务需求进行比较。\n\
  - 属性效验：识别目标系统上的知识产权 (IP) 或应用程序，并验证该 IP 或应用程序的许可情况。\n- 隔离审查：尝试识别系统上的个人信息，以及合法或未经授权的用户可以访问这些信息的程度。\n\
  - 暴露验证：识别互联网上关于目标系统的可用信息。\n- 竞争情报侦察：识别可能通过竞争影响目标所有者的竞争对手信息。\n\n### 第四阶段：交互控制测试阶段\n\
  - 隔离验证：验证系统隔离外部访问系统和内部系统数据的能力。\n- 权限审计：检查在系统内提升权限的能力。\n- 生存性验证：在人员安全通道中，该模块被称为`业务连续性`，用于确定系统对过度或不利情况的抵抗力。\n\
  - 告警和日志审查：在人员安全通道中，该模块被称为`结束调查`，涉及审查审计活动。OSSTMM 提供了具体的步骤以便实现模块的高级目标并消除任何歧。虽然不像 ISSAF\
  \ 内部步骤那样具体，但 OSSTMM 模块提供了足够的粒度，让经验丰富的渗透测试专业人员在攻击时选择合适的工具。与 ISSAF 不同，OSSTMM 通过提供渗透测试中需要执行的通用概述，为渗透测试工程师提供了如何最好攻击目标的一些灵活性。对于那些刚刚开始渗透测试领域职业的人来说，没有关于使用什么工具或遵循什么流程的指导可能会令他们望而生畏。\n\
  \n## 总结\n\n\n\n\n\n这里列出的任何方法论都不适用于渗透测试从构思到结束的所有方面。然而，所有方法论都包含某些组件，结合在一起可以为任何渗透测试项目提供有效的基础。困难之处在于识别应该使用哪些部分，哪些部分应该避免。\n\
  \n`PMBOK` 为任何渗透测试提供了一个非常有结构性的框架。如果负责渗透测试的工程师拥有多年经验且工作非常胜任，`PMBOK` 可能绰绰有。然而，如果工程师在知识上存在空白，引入\
  \ `OSSTMM` 或 `ISSAF` 可能更为合适。`PMBOK` 包含许多过程，但并非所有过程都需要在每次渗透测试中使用。这些过程甚至可能不需要正式记录。支持项目的文档详尽程度应仅根据需要而定。仅仅为了创建文档而创建文档，这会将重点错误地放在了执行项目的过程上，而不是它本该所在的地方：渗透测试的圆满完成。然而，`PMBOK`\
  \ 内部的流程是为了提高项目的成功率，同时确保项目按时且在预算内完成。因为成本或不喜欢项目管理而规避项目管理流程可能会导致项目失败。\n\n渗透测试专业领域还相当新，支持渗透测试的方法论更新。`OSSTMM`\
  \ 和 `ISSAF` 尝试为该领域提供一些结构并强制执行最佳实践，但它们并没有像其他行业那样拥有数十年的经验支撑。随着时间的推移，这些方法论将会改进；但目前，从事\
  \ `PenTest` 项目的项目经理和工程师需要带着自己的经验工作，以填充 `OSSTMM`、`ISSAF` 和 `PMBOK` 中存在的任何空白。\n\n\
  ## 解决方案快速通道 (Solutions Fast Track)\n\n## 项目管理知识体系 (Project Management of Knowledge)\n\
  \n- ■ 项目周期由五个不同的组组成：启动过程、规划过程、执行过程、结束过程和监控控制过程。\n- ■ 启动过程组的目的是获得启动项目的批准。\n- ■ 规划过程组获取成功完成项目所需的信息，并将项目定义到更细的粒度上。\n\
  - ■ 执行过程组积极涉及渗透测试工程师，通常表示为“计划-执行-检查-处理（Plan-Do-Check-Act）”循环中的“执行”。\n- ■ 结束过程组向客户交付文档，释放已采购的资源，并允许项目经理为随后的渗透测试识别改进之处。\n\
  - ■ 只有监控控制过程组涵盖了从构思到结束的整个渗透测试。\n- ■ 并非所有过程都需要在所有渗透测试中使用。\n- ■ 文档的详细程度仅取决于需要——过多的文档会阻碍任何渗透测试的进展。\n\
  \n## 信息系统安全评估框架 (Information System Security Assessment Framework)\n\n- ■ 规划和处理阶段可能无法为成功的渗透测试提供足够的支持。根据需要纳入其他方法论的过程。\n\
  - ■ 尽管 `ISSAF` 中存在示例，但渗透测试人员需要对提供的示例进行扩展。\n- ■ `ISSAF` 正迅速过时。\n\n## 开源测试手册 (Open\
  \ Source Testing Manual)\n\n- ■ 有四种不同的“通道”可以从渗透测试中受益：物理安全、无线、电信和数据网络。\n- ■ `PenTest`\
  \ 中有四个阶段：监管、信息和交互式控制。\n- ■ **Q:** 在没有工具的情况下，为什么要讨论 `PMBOK`？\n- **A:** 为了从构思到完成成功完成一个项目，必须进行某种形式的项目管理。\n\
  - **Q:** 在 `OSSTMM` 和 `ISSAF` 之间，哪种方法论最好？\n- **A:** 取决于渗透测试人员的技能。\n- **Q:** `OSSTMM`\
  \ 似乎讨论渗透测试的层次太高。为什么没有著名的工具？\n- **A:** 遗憾的是，每次渗透测试都是不同的，需要不同的方法。提供示例和命令会限制思维，并将工程师变成“脚本小子”（script\
  \ kiddie）。\n\n## 扩展你的技能 (Expand Your Skills)\n\n想了解更多关于渗透测试方法论的内容？以下练习旨在提供额外的知识和技能，让你理解这一主题。\n\
  \n### 熟悉 ISSAF\n1. 获取 `ISSAF` 的最新版本。\n2. 列出评估阶段（Assessment Phase）中每一步的预期结果。\n3.\
  \ 在标题为“误报率（False Detection Rates）”的章节中，定义误报（false positives）和漏报（false negatives）。为每种情况提供示例。\n\
  \n### 熟悉 OSSTMM\n1. 获取 `ISSAF` 的最新版本。识别评估阶段（Assessment Phase）中的“四点（Four Point）过程及其定义。\n\
  2. 列出渗透测试中的六种常见“安全测试类型（Security Test Types）”。定义每种类型。\n3. 识别渗透测试中可能发生的 12 “错误类型（Error\
  \ Types）”。\n4. 识别可针对渗透测试的 10 “损失控制（Loss Controls）”。\n\n### 参考文献 (References)\n-\
  \ `OSSTMM`, *Open source testing methodology manual* (2008); 检索 Institute for Security\
  \ and Open Methodologies 网站：`www.isecom.org/osstmm/`.\n- Information Systems Security\
  \ Group, *Information Systems Security Assessment Framework (ISSAF) Draft 0.2.1B*\
  \ (2006); 检索 Open Information Systems Security 网站：`www.oissg.org/downloads/issaf/information-systems-security-assessment-framework-issaf-draft-0.2.1b/download.html`.\n\
  - Mertvago, P., *The comparative Russian-English dictionary of Russian proverbs\
  \ & sayings*. (1995) Hippocrene Books, New York .\n- Project Management Institute.,\
  \ *A guide to the project management body of knowledge*. 4th ed. (2008) Author,\
  \ Newtown Square, PA .\n\n第 7 章. PenTest 指标 (PenTest Metrics)\n\n## 引言 (Introduction)\n\
  \n\n\n\n\nПлавда глаза колет. – 俄罗斯谚语：“真理刺眼。”(Mertvago, 1995)。在专业的渗透测试项目中，识别漏洞和利用程序通常是不够的。客户希望知道漏洞在他们的网络环境中产生的影响，而不仅仅是它们的存在。然而，客户风险并不是渗透测试项目中唯一需要衡量的风险——项目本身的成功完成也存在固有风险，项目经理需要意识到并对此制定计划。遗憾的是，与保险业相比，信息系统安全领域的风险分析仍处于处于阶段。尽管有可以用于估算寿命的统计数据，但我们并真的清楚一个零日漏洞对全球信息技术行业可能产生何种典型的影响。在向客户和委托方展示信息系统风险时，大多数专业渗透测试人员必须依赖个人经验或第三方平台提供的风险指标。本章将讨论用于评估项目内部及客户网络架构风险的方法和工具。我们将从解释定量分析和定性分析方法之间的区别开始，然后研究这些方法如何在不同的渗透测试和项目管理方法论中实施。\n\
  \n# 定量、定性与混合方法\n\n评估风险有三种方法：定量、定性，或将两种方法结合。大多数人将定量分析与数学模型联系起来，将定性分析与观点联系起来。尽管这类关联非常简单，但我们不会对研究方法论的学术探讨进行过多扩展，并将讨论保持在较高水平。\n\
  \n**警告** 收集指标不是一天就能完成的。以下技术需要巨大的努力，并且通常是基于个人经验创建的。困难之处在于公司不喜欢与其他分享他们的数据。\n\n## 定量分析\n\
  \n在使用定量分析时，我们依赖于数字——大量的数字。如果我们能够获得可衡量的数据，就可以提取统计数据来确定事件在网络中发生的概率。图 7.1 展示了如何获取定量数据的示例，我们可以利用它来分析模式。数据可以从日志文件或监控系统中收集，并对其进行过滤以识别事件发生的频率。\n\
  \n| ![B9781597494250000117/f07-01.jpg is missing](img/f07-01.jpg) |\n| --- |\n|\
  \ 图 7.1. |\n| 定量分析 |\n\n使用定量分析来创建风险指标的一个示例是扫描攻击，这些攻击通常是更严重、更有针对性的攻击的前奏。防火墙和入侵检测系统（`IDESs`）可以配置为识别并记录针对企业网络和系统的扫描攻击的来源和频率。一旦完成收集，对收集数据的分析可以为管理层提供足够的信息，以便在网络防御系统中添加额外的过滤，从而减少网络遭受更严重攻击的可能性。使用定量方法支持发现的结果更容易。因为数据本身不带个人偏见且可衡量，利益相关者通常对通过定量分析获得的指标更易接受。遗憾的是，数据本身可能无法反映现实。如果可衡量的数据较少或仅来自短时间内，指标的准确性可能会偏差——必须妥善规划测量，考虑到定量分析中发现多个变量。\n\
  \n**警告** 不要总是假设收集的可衡量数据总是正确的。网络中的波动是常见现象，在设计定量分析时需要考虑进去。\n\n## 定性分析\n\n定量风险分析严格依赖于可衡量的数据。在之前的扫描攻击示例中，如果定量分析表明大多数扫描攻击来自中国，这不会让大多数人感到意外。然而，在现实世界的风险评估中，如果分析显示大多数扫描攻击来自其他不符合预期的地方（如南极），这些发现很可能会受到质疑并可能被丢弃。严格根据经验或直觉检查数据属于定性分析范围。图\
  \ 7.2 说明了使用定性分析获取真实世界指标的一个示例。\n\n| ![B9781597494250000117/f07-02.jpg is missing](img/f07-02.jpg)\
  \ |\n| --- |\n| 图 7.2. |\n| 定性分析 |\n\n分析师可以询问专业人士他们认为某个风险所构成的当前威胁是什么，然后将其汇总并翻译为风险指标。定性分析的优点在于，领域专家可能对原始数据无法反映的问题具有独特的见解。如果我们使用之前的扫描攻击示例，新的防火墙和\
  \ IDS 规避技术可能会使我们的定量分析失效，因为我们依赖于特定设备的日志文件。通过与领域专家交流，定性分析可以为我们的风险指标增加有益的复杂性。\n\n**工具与陷阱……**\n\
  \n## 威胁与风险\n\n容易被混淆的是威胁与风险之间的区别。从简单来说来说，*威胁*是会对系统造成破坏的东西（例如恶意软件）。*风险*描述了威胁发生的概率和影响（如果系统未连接到网络，风险较低；如果是面向互联网的系统，风险很高）。与定性分析或网络内部风险相关的缺点是，观点可能会受到偏见和外部因素的影响，包括媒体、同伴压力（来自同事和所在公司）以及自我。任何定性研究必须考虑可能扭曲最终分析的影响因素。研究人员防止偏见和组织姿态的方法包括要求匿名提交、通过多次访谈审核收集的数据以及使用来自内部和外部组织的领域专家。\n\
  \n**警告** 考虑纳入焦点小组的任何人在加入之前应对其进行偏见审查。公司忠诚度可能会影响某人的观点，从而扭曲结果。选择领域专家不仅要考虑他们的知识，还要考虑他们提供诚实无偏见回答的能力。\n\
  \n## 混合方法分析\n\n在许多情况下，仅使用一种方法确定指标是不够的。当单独使用定量或定性分析无法提供可靠指标时，可以结合两种方法以获得所需的结果。在图\
  \ 7.3 中，我们看到了进行混合方法分析的一种方法。\n\n| ![B9781597494250000117/f07-03.jpg is missing](img/f07-03.jpg)\
  \ |\n| --- |\n| 图 7.3. |\n| 混合方法分析 |\n\n\n\n\n\n回到扫描攻击的示例，从防火墙和入侵检测系统（IDS）中收集的数据可能表明某种特定的攻击计划，以防止在短期内发生更复杂的攻击。通过收集这些数据并让领域专家对信息进行相关性检查，专家可能会识别出需要纳入网络防御设备中的额外控制措施。例如，如果扫描攻击来自意想不到的地点（如南极），专家可能识别出该攻击是通过南极一个受损的网络进行中继的，而不是源自该大陆。这将导致额外的分析，以试图识别攻击的真实位置，并检查可能与扫描攻击相关的额外流量。\n\
  \n**警告** 如果需要快速理解并采取措施应对风险，混合分析方法将显著阻碍响应时间。即使最佳风险分析方法并不实际，仍然可以使用不理想的分析方法创建有价值的数据；请使用适用于项目的方法。使用混合方法允许研究人员在行动之前对数据进行审核。通过同时使用领域专家和可测量数据，风险指标可以比仅使用一种分析方法开发的指标更准确。使用混合方法的缺点是需要更多的时间和资源来获取结果。\n\
  \n# 当前方法论\n\n为了理解系统或网络中的风险，专业的渗透测试方法论正试图通过采用其他行业中一些更受信任的方法来纳入风险分析。项目管理协会（`PMI`）根据之前描述的定性和定量方法，为项目经理提供了一些识别风险的高级方法。遗憾的是，通常很难将这些高级方法转化为现实世界的示例。信息系统安全评估框架（`ISSAF`）提供了衡量风险的方法，但其方法非常简单。开源安全测试方法论手册（`OSSTMM`）采取了不同的方法，并量化了目标内的所有安全方面；然而，获取风险得分所需的计算非常复杂，可能让许多人感到望而却畏。有时无法使用当前的分析方法来分配风险——这通常发生在利益相关者担心偏见的情况下。在这些情况下，替代方案是使用第三方分析来分配风险，使用设计用于确定目标系统风险水平的工具。\n\
  \n**注** 风险评估领域已经存在了几个世纪，特别是在保险行业。本节提供的示例是风险确定方式的一个小样本，可能会随着信息技术的进步而发生变化。\n\n## 项目管理协会\n\
  \n由于《项目管理知识体系指南》（`PMBOK`）是一份高级文档，旨在涵盖所有可能出现的情况，因此 `PMBOK` 中讨论的风险分析方法可能可能不适用于渗透测试指标，取决于\
  \ `PenTester` 在项目期间可获得的数据和资源。将由专业渗透测试工程师和项目经理来决定哪种分析方法是合适的。以下某些方法使用了定性分析，这对于希望使用硬性数据进行修复的\
  \ `PenTest` 客户可能是不可接受的。其他方法使用定量分析，这需要可测量的数据——而这种资源并不总是可用。我们将讨论这两种分析类型，以便 `PenTest`\
  \ 团队可以选择正确的方法来确定和报告风险。以下分析方法并非 `PMBOK` 特有，根据行业的不同可能会以其他名称为人，这引出了另一个问题——特定行业的客户可能更倾向于某一种分析方法而非另一种。人们已经习惯了看到特定类型的报告和图表；使用不同的东西需要他们花费精力来理解\
  \ `PenTest` 结果。\n\n**提示** 在本章中，我们将风险分配为低、中、高。许多组织不喜欢只使用三个类别，并可能使用数字排名系统分配风险，例如 1\
  \ 到 10 位或百分比。在分配风险水平时，使用客户所使用的任何方法都是关重要的——这会让一切变得更加顺畅。\n\n### 专家判断\n\n又称为德尔菲法，专家判断利用领域专家通过定性分析来理解风险。图\
  \ 7.4 是该过程的一个示例。\n\n| ![B9781597494250000117/f07-04.jpg is missing](img/f07-04.jpg)\
  \ |\n| --- |\n| 图 7.4. |\n| 专家判断 |\n\n第一阶段涉及向领域专家提交调查问卷，要求他们对风险水平提供意见。一旦领域专家提供了意见，数据将匿名提供给研究人员，作为第二阶段。研究人员随后可以汇总数据（第三阶段），并将发现的结果提交给专家以获取其意见（第四阶段）。根据发现结果的差异程度有多大，研究人员可能会要求专家对复合反馈提供额外意见。这种汇总反馈并重新提交给专家的循环可能会发生多次，直到风险指标被明确定义。通过要求结果的匿名性，研究人员可以收集到无偏意见，即使这些意见违背客户或委托人的最大利益。在渗透测试中，当尝试确定已识别风险修复的优先级时，采用专家判断是有用的。当所有漏洞都经过验证后，领域专家将根据严重程度快速对每个风险进行分类，允许研究人员以客户可以合理分配修复资金的方式展示风险列表，从严重的开始，到较低的风险结束。\n\
  \n### 概率分布\n\n在使用概率分布时，需要使用混合方法来创建风险指标。通常用于理解两者之间关系的两个因素是概率和影响。这两个因素可以通过可测量的数据获得，提供一个类似于图\
  \ 7.5 所示的矩阵。\n\n| ![B9781597494250000117/f07-05.jpg is missing](img/f07-05.jpg)\
  \ |\n| --- |\n| 图 7.5. |\n| 概率分布 |\n\n一旦将发生概率与影响映射以提供一种衡量风险的方法，就需要确定风险接受的水平，例如低、中或高。风险水平的分配本质上是定性的，并根据每个利益相关者的不同而不同。例如，负责大型公司内部系统的经理可能认为\
  \ 100,000 美元的损失是严重的，而公司总部可能认为这种损失是微不足道的。在许多情况下，利用利益相关者关于风险水平应该处于什么的意见，有助于识别低、中、高风险水平应该落在概率矩阵中的位置。\n\
  \n### 敏感性分析\n\n表示风险的另一种方法是使用敏感性分析，它识别出对项目成功潜力最大的风险。图 7.6 说明了敏感性分析和财务影响；然而，影响也可以表示为停机时间或客户服务损失。\n\
  \n| ![B9781597494250000117/f07-06.jpg is missing](img/f07-06.jpg) |\n| --- |\n|\
  \ 图 7.6. |\n| 敏感性分析 |\n\n\n\n\n通过敏感性分析，渗透测试工程师可以列出对业务可能产生最大影响的项目，无论成本如何。这将允许客户优先考虑修复工作，而不必受成本限制。敏感性分析可以是定量的，也可以是定性的，取决于用于为风险分配影响的数据。停机相关的财务影响无疑可以被量化定义，但客户满意度使用定性或混合分析法来定义则要容易得多。\n\
  \n### 预期货币价值\n\n有时，金钱是修复选择之间的唯一决定因素。预期货币价值分析（如图 7.7 所示）使用决策树来识别客户可用的部分或全部修复选项。\n\
  \n| ![B9781597494250000117/f07-07.jpg is missing](img/f07-07.jpg) |\n\n| --- |\n\
  \n| 图 7.7. |\n\n| 预期货币价值分析  |\n\n图 7.7 中的决策树允许客户接受风险（“无所作为”）、规避风险（通过完全关闭系统）或使用两个选择之一来缓解风险。这种方法允许管理层更好地理解所做决策的财务影响。\n\
  \n### 决策树分析\n\n决策树也可用于识别包含货币价值之外额外信息的选择。图 7.8 说明了如何使用决策树来识别缓解特定风险（在本例中为漏洞利用）的选择。根据决策树提供的信息，管理层可以做出包含其他因素的决策。\n\
  \n| ![B9781597494250000117/f07-08.jpg is missing](img/f07-08.jpg) |\n\n| --- |\n\
  \n| 图 7.8. |\n\n| 决策树分析  |\n\n### 建模与模拟\n\n也被称为蒙特卡洛（Monte–Carlo），建模与模拟可以作为识别事件频率的方法。图\
  \ 7.9 说明了使用模拟环境收集数据的方法。并不总是需要完全重建网络和相关系统——通常可以在较小规模上重建或通过数学表示来实现。\n\n| ![B9781597494250000117/f07-09.jpg\
  \ is missing](img/f07-09.jpg) |\n\n| --- |\n\n| 图 7.9. |\n\n| 建模与模拟分析  |\n\n作为如何使用建模识别风险的示例，假设我们想要找出针对网络琐碎攻击的成功率。如果我们能够访问测试网络，就可以运行自动化攻击，查看有多少系统被成功攻破，并利用结果提供风险指标。在较小规模上，我们可以针对单个系统上的已知漏洞使用不同的自动化工具，看看有多少工具成功识别并利用了该漏洞。建模也可用于确定网络防御的有效性——可以检查入侵检测或防火墙规则以评估其在识别或防止各种复杂程度攻击方面的有效性。然后，可以使用攻击的成功或失败率来创建风险指标。\n\
  \n## 工具与陷阱……\n\n# 蒙特卡洛模拟\n\n`Monte–Carlo` 一词指的是摩纳哥的蒙特卡洛赌场，在风险评估中使用该术语是因为建模和模拟可以用于向分析引入随机性。专业渗透测试人员的主要职责之一是“跳性思考”，而使用蒙特卡洛模拟迫使工程师这样做。\n\
  \n## ISSAF\n\n虽然 PMBOK 中描述的方法对于专业渗透测试项目有用，但它们是通用的，适用于任何情况。\n\n## OSSTMM\n\nOSSTMM\
  \ 使用系统的三个维度来确定信息安全的整体风险——运营、控制和限制。每个维度都使用不同的输入来确定(Herzog, 2008):■运营安全 □ 可见性 □ 信任\
  \ ■ 控制 □ 认证 □ 赔偿 □ 屈服 □ 连续性 □ 不否认性 □ 机密性 □ 隐私 □ 完整性 ■ 报警 □ 安全 □ 漏洞 □ 缺陷 □ 关注 □ 暴露\
  \ □ 异常 每个维度组件赋值，例如目标数量、每个系统的认证方法数量和漏洞数量等。最后使用额外的数学公式获取目标系统的风险指标，这反映了利益相关者业务的整体风险。使用\
  \ OSSTMM 方法获取风险指标的优点是系统的各个方面都反映在风险值中。使用 OSSTMM 方法的缺点是数学复杂性难以向利益相关者解释，他们通常需要理解用于分配风险的底层算法。\n\
  \n## 工具生成的报告\n\n创建风险指标的另一种方法是让别人完成工作。许多自动化工具会对漏洞分配风险，这些风险可以直接转移到给利益相关者的报告中。使用第三方提供的风险级别的优点是为报告增加了可信度。图\
  \ 7.10 是对 pWnOS 服务器进行 Nessus 扫描的截图。\n\n| ![B9781597494250000117/f07-10.jpg is missing](img/f07-10.jpg)\
  \ |\n\n| --- |\n\n| 图 7.10. |\n\n| pWnOS 服务器的 Nessus 扫描  |\n\n\n\n\n从扫描提供的信息中，我们看到\
  \ Nessus 因为 Secure Shell (SSH) 应用程序存在漏洞，为 pWnOS 服务器分配了高风险等级。通过使用 Nessus 扫描器来分配风险，我们可以在分析中节省大量的时间和精力。然而，使用第三方结果也有其缺点。一个问题是，我们不知道风险值是如何定的。如果客户想知道风险分配背后的算法，可能无法提供答案，这可能导致客户失望。另一个问题是风险评估可能是错误的，因为它未能正确识别出实际漏洞。此外，这些值是基于通用的架构类型（如果服务器没有连接到网络，风险无疑会低得多）。我们将在书的第二部分发现，端口\
  \ `10000` 上存在一个重大的漏洞，可以利用该漏洞获取系统上的任何文件。\n\n**工具与陷阱……**\n\n## Nessus 插件\n\n用于发现漏洞和分配风险值的\
  \ Nessus 插件是可以修改的。如果某个特定的风险等级被认为太低或太高，可以更改结果以反映适当的风险水平。不要仅仅为了安抚管理层而“改善”网络或系统的整体安全态势就改变风险水平。第三个缺点是，我们无法使用第三方应用程序提供的评分系统之外的其他系统。如果我们想用数字量表来表示图\
  \ 7.10 中识别出的风险，我们对扫描中识别出的许多高、中、低风险应该分配什么值将只能靠猜测。对于试图根据优先级修复风险的组织来说，错误的分配可能会导致昂的代价。\n\
  \n## 总结\n\n使用正确的风险指标对于说服利益相关者关注专业渗透测试期间发现的风险的关键性至关重要。分配风险等级的方法需要符合客户的预期，并以客户能够理解的方式呈现。仅仅因为大多数行业使用高/中/低风险指标并为每个级别分别分配红/黄/绿，并不意味着利益相关者想在报告中看到这些级别。如果利益相关者习惯使用数字量表，渗透测试的发现需要写得符合利益相关者的预期。如果客户习惯于看到通过定量分析产生的报告和发现，他们可能会对任何仅通过访谈或问卷调查得出的发现报告持犹豫态度。对风险分析进行定制以满足行业预期，这样客户对最终报告会更有接受度和积极性。使用第三方评估可以作为一种优势，特别是在处理新客户时。利益相关者可能在仅仅根据渗透测试工程师的话做出反应之前需要增加信任，特别是当尚未建立合作关系时。然而，简单地假设第三方评估适用于所有网络和系统是有风险的。独特的配置可能会改变系统的“默认”值，并改变实际风险。\n\
  \n## 解决方案快速通道\n\n## 定量、定性与混合方法\n\n■ 定量分析方法使用可测量的数据来评估和分配风险等级。■ 如果定量可测量的数据较少或仅来自很短的时间，指标的准确性可能会出现偏差。■\
  \ 定性分析方法使用意见来制定和分配风险等级。■ 在定性分析中，意见可能会产生偏见并受到外部因素（包括媒体和同行压力）的影响。仔细选择领域专家对于消除偏见至关重要。■\
  \ 混合方法同时使用定量和定性分析来获取风险值。■ 混合分析方法比定量或定性方法需要更多的时间，且成本更高。\n\n## 当前方法论\n\n■ PMI 提供了许多高级的风险评估方法，但专注于专业渗透测试的任何特定内容。■\
  \ ISSAF 提供了一些简单但有效的风险分配方法。■ OSSTMM 在分配风险时考虑了多个因素，但需要更多的精力。**Q:** 我可以在分配风险时将渗透测试团队成员作为领域专家吗？**A:**\
  \ 绝对可以，但并不总是最好的方法。渗透测试团队成员看待漏洞的方式可能与信息安全行业的其他人员不同，因为他们一直暴露在可利用漏洞之中。在分配风险之前，需要考虑攻击频率、网络防御以及整个行业对漏洞应用程序的使用，而这在像渗透测试团队这样的小型、孤立小组中并不总是发生的。**Q:**\
  \ 即使我没有大量数据，我仍然可以使用定量分析吗？**A:** 有时，渗透测试工程师必须使用他们获得的任何数据，即使从统计学角度来看这些数据并不足够。危险在于，根据弱数据做出的决策永远不会得到跟进。如果在信息不足的情况下做出决定，渗透测试团队应该在日后收集到更多相关信息时重新评估风险，以便能够正确分配风险。**Q:**\
  \ 第三方风险等级和内部创建的哪个更好？**A:** 对于刚起步的组织，使用第三方风险分析比内部创建的要好。随着时间的推移，应该对第三方数据进行修改，以反映公司网络中存在的真实风险。如果渗透测试工程师对目标网络足够的知识，在执行风险分析方面有足够的经验，并使用定义良好的方法，最终结果将是非常集中且相关的风险评估。参考文献：Herzog,\
  \ P., *Open source security testing methodology manual (OSSTMM)* (2008)；来自 Institute\
  \ for Security and Open Methodologies 网站：[`www.isecom.org/osstmm/](http://www.isecom.org/osstmm/)。Mertvago,\
  \ P., *The comparative Russian-English dictionary of Russian proverbs & sayings*.\
  \ (1995) Hippocrene Books, New York 。\n\n第 8 章 渗透测试的管理\n\n## 引言\n\n靠近 людей потирайся,\
  \ да ума набирайся. 俄罗斯谚语：*“多和别人待在一起，就能多吸取他们的脑子。”* (S. Aguryanov, personal communication,\
  \ April 28, 2009) 管理渗透测试团队与管理销售、人力资源、客户服务或营销的人员不同。渗透测试团队的工程师通常是“极客”，正如 Paul Glen\
  \ 在《Leading Geeks》书中解释的那样。Glen 试图通过定义极客来量化管理极客的困难，将极客定义为“高智、通常内向、极具价值、独立思考、难以寻找、难以留的技术人员”(Glen,\
  \ 2003)。由于这些性格特质，经理们需要寻找方法保持渗透测试工程师的动力。本章扩展了在第 6 章中关于项目管理知识体系 (PMBOK) 方法的高级讨论。\n\
  \n## 项目团队成员\n\n抱歉，我在之前的回复中似乎误将您的示例内容作为待翻译文本处理了。以下是针对您提供的“以下是需要翻译的文本”进行的正确结果：\n\n\
  [content]\n从扫描提供的信息中，我们看到 Nessus 因为 Secure Shell (SSH) 应用程序存在漏洞，为 pWnOS 服务器分配了高风险等级。通过使用\
  \ Nessus 扫描器来分配风险，我们可以在分析中节省大量的时间和精力。然而，使用第三方结果也有其缺点。一个问题是，我们不知道风险值是如何定的。如果客户想知道风险分配背后的算法，可能无法提供答案，这可能导致客户失望。另一个问题是风险评估可能是错误的，因为它未能正确识别出实际漏洞。此外，这些值是基于通用的架构类型（如果服务器没有连接到网络，风险无疑会低得多）。我们将在书的第二部分发现，端口\
  \ `10000` 上存在一个重大的漏洞，可以利用该漏洞获取系统上的任何文件。\n\n**工具与陷阱……**\n\n## Nessus 插件\n\n用于发现漏洞和分配风险值的\
  \ Nessus 插件是可以修改的。如果某个特定的风险等级被认为太低或太高，可以更改结果以反映适当的风险水平。不要仅仅为了安抚管理层而“改善”网络或系统的整体安全态势就改变风险水平。第三个缺点是，我们无法使用第三方应用程序提供的评分系统之外的其他系统。如果我们想用数字量表来表示图\
  \ 7.10 中识别出的风险，我们对扫描中识别出的许多高、中、低风险应该分配什么值将只能靠猜测。对于试图根据优先级修复风险的组织来说，错误的分配可能会导致昂的代价。\n\
  \n## 总结\n\n使用正确的风险指标对于说服利益相关者关注专业渗透测试期间发现的风险的关键性至关重要。分配风险等级的方法需要符合客户的预期，并以客户能够理解的方式呈现。仅仅因为大多数行业使用高/中/低风险指标并为每个级别分别分配红/黄/绿，并不意味着利益相关者想在报告中看到这些级别。如果利益相关者习惯使用数字量表，渗透测试的发现需要写得符合利益相关者的预期。如果客户习惯于看到通过定量分析产生的报告和发现，他们可能会对任何仅通过访谈或问卷调查得出的发现持犹豫态度。对风险分析进行定制以满足行业预期，这样客户对最终报告会更有接受度和积极性。使用第三方评估可以作为一种优势，特别是在处理新客户时。利益相关者可能在仅仅根据渗透测试工程师的话做出反应之前需要增加信任，特别是当尚未建立合作关系时。然而，简单地假设第三方评估适用于所有网络和系统是有风险的。独特的配置可能会改变系统的“默认”值，并改变实际风险。\n\
