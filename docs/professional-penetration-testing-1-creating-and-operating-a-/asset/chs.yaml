  \ 是帮助菜单。\n\n在当今环境中，数据的价值更高。图 12.10 向我们展示了结果。图 12.11 显示了网络拓扑图。图 12.12 是帮助菜单。\n\n\
  ### Web 漏洞\n\n虽然商业漏洞和非商业漏洞可能产生相同的结果（正如我们的示例中那样），从互联网获取的任何漏洞都存在目标系统利用之外的风险。漏洞可能会导致系统崩溃，需要对导致系统崩溃的原因进行详细了解。如果使用商业工具，客户支持可能一个电话就能找到。决定使用何种攻击的另一个因素是，商业漏洞比网上找到的漏洞测试得充分得多，增加了漏洞的可靠性和成功率。如果我们没有使用\
  \ CORE IMPACT，可以访问查看有哪些可用漏洞。\n\n# 网络包嗅探\n\n在第 10 章中，我们简要提及了地址解析协议（ARP）欺骗的概念。如果我们访问交换机，就可以进行\
  \ ARP 欺骗；但这次我们将使用一个为中间人人（MITM）攻击设计的程序。图 12.11 显示了网络拓扑图。ARP 欺骗攻击将覆盖受害者的 ARP 表，使受害者的流量通过\
  \ BackTrack 系统，无论目的地何。\n\n我们最感兴趣的菜单部分是“嗅探和攻击选项”。由于我们的 BackTrack 服务器只有一个以太网连接，我们无法进行桥接攻击。我们也想捕获通过系统的流量，因此在示例中不选择\
  \ `-o` 选项。我们可以通过 `-t` 选项限制 ettercap 只嗅探特定端口的流量，例如 80 端口的 Web 流量。然而，没有必要限制自己——我们不妨捕获所有流量，以期望获得敏感数据。\n\
  \n\n\n\n首先，我们希望为攻击选择 `-M` 选项。然而，帮助信息并没有让我们了解还有哪些额外的选项可用。以下文本节选自 `ettercap` 手册页（man\
  \ page）的片段：\n\n`-M, --mitm <METHOD:ARGS>`\n\nMITM 攻击：此选项将激活 MITM 攻击。MITM 攻击完全独立于嗅探。攻击的目标是劫持数据包并将其重定向到\
  \ ettercap。必要时，嗅探引擎将转发它们。你可以选择你喜欢的 MITM 攻击，并结合其中某些攻击以同时执行不同的攻击。如果 MITM 方法需要某些参数，你可以在冒号后指定它们（例如，`-M\
  \ dhcp:ip_pool,netmask,etc`）。\n\n以下可用的 MITM 攻击有：\n\n`arp ([remote],[oneway])`\n\n\
  该方法实现了 ARP 毒化 MITM 攻击。ARP 请求/响应被发送给受害者以毒化它们的 ARP 缓存。一旦缓存被毒化，受害者会将所有数据包发送给攻击者，攻击者反过来可以修改并将其转发到真实目的地。在静默模式（`-z`\
  \ 选项）下，仅选择第一个目标；如果你想在静默模式下毒化多个目标，请使用 `-j` 选项从文件中加载列表。你可以选择空目标，它们将被展开为“ANY”（局域网中的所有主机）。目标列表将与主机列表（通过\
  \ arp 扫描创建）合并，结果将用于确定攻击的受害者。\n\n参数 `remote` 是可选的，如果你想嗅探针对网关的远程 IP 地址毒化攻击，则必须指定它。事实上，如果你在\
  \ `TARGETS` 中指定了受害者和网关（GW），ettercap 将仅嗅探它们之间的连接，但为了让 ettercap 嗅探通过网关的连接，你必须使用此参数。`oneway`\
  \ 参数将强制 ettercap 仅从 `TARGET1` 向 `TARGET2` 进行毒化。如果你只想毒化客户端而不是路由器（路由器可能部署了 ARP 监视），则此项非常有用。\n\
  \n示例：目标为 `/10.0.0.1-5/` `/10.0.0.15-20/`，主机列表为 `10.0.0.1 10.0.0.3 10.0.0.16 10.0.0.18`；如果目标相互重叠，受害者之间的关联将是\
  \ `1` 和 `16`、`1` 和 `18`、`3` 和 `16`、`3` 和 `18`；相同 IP 地址的关联将被跳过。\n\n注意：如果你成功毒化了一个客户端，必须在内核中设置正确的路由表并指定网关。如果你的路由表不正确，被毒化的客户端将无法访问互联网。\n\
  \n基于 MITM 攻击选项的手册页信息，我们可以选择远程或单向的 ARP 毒化方法。`remote` 选项允许我们嗅探通过网关离开局域网的流量。`oneway`\
  \ 选项在网络内部提供了更多的控制；选择单向选项将限制源自第一个目标的 ARP 毒化，对我们来说就是受害者系统（`192.168.1.100`）。如果部署了 ARP\
  \ 篡改检测控制，网关路由器的 ARP 欺骗可能会被检测并发送报警。\n\n\n\n\n提示：`Ettercap` 也可以用于嗅探通过加密通道发送的流量，包括安全壳\
  \ (`SSH`) 和安全套接层 (`SSL`) 协议。尽管我们拦截了用户名和密码，受害者并不会察觉到任何异常。如果登录正确，数据将继续在受害者系统与 `pWnOS`\
  \ 服务器之间不受阻地传输。只要我们的 `MITM` 攻击运行，我们就会持续拦截流量。捕获网络数据还有许多其他方法；在专业渗透测试中，用于获取登录凭据的利用方法包括如下：\n\
  \n- **域名系统 (DNS) 缓存毒**：允许攻击者将受害者的数据请求替换为恶意数据。使用 `DNS` 缓存中毒的攻击示例是网络钓鱼（pharming）。\n\
  - **DNS 伪造**：这种技术是一种时序攻击，其即在有效的 `DNS` 查询响应返回之前，向系统返回一个虚假的 `DNS` 查询响应。使用 `DNS` 伪造的攻击示例也包括网络钓鱼。\n\
  - **用户界面 (UI) 视觉欺骗**：允许恶意用户使用 `JavaScript` 等 Web 脚本语言，将网站上的有效链接替换为恶意链接。点击劫持（Clickjacking）是\
  \ UI 欺骗的另一个术语。\n- **边界网关协议 (BGP) 劫持**：这种攻击通过利用 `BGP` 广播通信并注入无效路由数据来获取 IP 地址。`IP`\
  \ 劫持这种攻击的另一种说法，用于垃圾邮件或分布式拒绝服务 (`DDoS`) 攻击。\n- **端口窃取**：一种二层攻击，通过伪造害者的媒体访问控制 (`MAC`)\
  \ 地址将交换机端口流量重定向到攻击系统，从而覆盖网络中的 `ARP` 表。这允许攻击系统拦截任何旨在受害者的返回通信。这可以用于 `DoS` 攻击或用于拦截流量。\n\
  - **动态主机配置协议 (DHCP) 欺骗**：对 `DHCP` 服务器的攻击，使用伪造的 `DHCP` 消息获取 IP 地址。它通过伪造受害者的 `DHCP`\
  \ 租约通信将合法系统踢出网络。`DHCP` 欺骗对于实施 `DoS` 攻击很有用。\n- **互联网控制消息协议 (ICMP) 重定向**：这种攻击向受害者系统发送\
  \ `ICMP` 重定向，通知系统存在更短的网络路径。这种攻击允许攻击系统作为 `MITM` 攻击拦截并转发流量。\n- **MITM（中间人攻击）**：一种通过中继数据拦截两个系统之间流量的方法，数据可以是明文或加密的。在网络中拦截或被动收集数据的能力为专业渗透测试人员提供了一种获取登录凭据或其他敏感数据的手段，这些数据可用于以高权限访问目标系统。\n\
  \n### 社会工程\n\n根据 ISSAF 的标准，社会工程可以分解为以下攻击（`Open Information Systems Security Group,\
  \ 2006`）：\n\n- **窥窥**（Shoulder surfing）：观察授权用户访问系统，并在其将凭据输入系统时获取这些凭据。\n- **工作站的物理访问**：允许物理访问系统为渗透测试人员提供了安装恶意代码（包括后门访问）的机会。\n\
  - **伪装成用户**：假装成用户联系帮助台，请求访问信息或高权限。\n- **伪装成监控人员**：假装成审计员或安全人员请求访问系统。\n- **翻找垃圾桶**（Dumpster\
  \ diving）：在垃圾容器中搜寻包含敏感信息的计算机打印件。\n- **处理（发现）敏感信息**：寻找落在办公桌或桌子上未妥善保护的敏感文档。\n- **密码存储**：寻找存储在电脑附近的手写密码。\n\
  - **反向社会工程学**：假装成处于权力位置的人（如帮助台员工），在帮助受害者解决问题的同时，从受害者处获取敏感信息。\n\n尽管所有这些策略都是有效的，但实施这些攻击的方法非常多样。历史教告诉我们，社会工程攻击在获取对敏感信息的未授权访问权限方面极其有效。社会工程学相比于网络攻击的一个优势是，人们往往乐于提供帮助，并仅仅因为被询问就提供信息。为防止企业职场中的社会工程攻击而设计的培训计划是有效的；然而，社会工程攻击正变得越来越复杂，并在欺骗受害者顺从方面变得更加成功。ISAF\
  \ 未讨论的额外社会工程学方法包括诱饵（baiting）、钓鱼（phishing）和预设（pretexting）。\n\n## 诱饵\n\n诱饵攻击使用计算机媒体诱导受害者安装恶意软件。这种类型的攻击的一个示例是在公共场所留一个\
  \ `CD-ROM` 磁盘。诱饵攻击利用了人类在面对未知事物时的自然好奇心。对于使用诱饵技术的攻击者来说，最好的情况是目标公司的一名员工保留了“被遗弃的”计算机媒体并在公司系统（如员工的工作电脑）上使用它。诱饵攻击中使用的计算机媒体通常包含恶意软件，特别是木马，它们将在受害者的计算机上创建一个后门。然后，木马将连接到攻击者的系统，提供进入公司网络的远程访问。从那里，攻击者可以继续对被利用的系统和网络服务器进行枚举。\n\
  \n## 钓鱼\n\n钓鱼攻击通常与虚假电子邮件有关，这些邮件要求用户连接到非法的网站。这些虚假网站通常模仿银行网页、在线拍卖网站、社交网站或在线邮箱账户。虚假网站看起来与其模仿的网站完全相同，希望受害者相信该网站是合法的并输入敏感信息，如账户、、登录和密码。\n\
  \n**警告**：在对企业员工实施钓鱼攻击时，请确保输入虚假网站的所有数据都是安全妥的。钓鱼网站被破坏可能会导致敏感数据泄露。某些钓鱼攻击通过电话针对受害者。受害者会在手机上收到短信或直接电话，要求他们拨打银行。一旦受害者拨打提供的号码，就会被要求提供账户信息和个人身份标识，从而允许攻击者伪装成受害者。攻击者还可能要求信用卡信息，这将允许他们生成虚假信用卡从受害者的账户中提取资金。\n\
  \n## 预设\n\n预设是一种虚构场景的方法，以说服受害者透露他们不应该透露的信息。预设通常针对保留客户数据的公司，如银行、信用卡公司、公用事业公司和运输行业。预设者会通过冒充客户（通常通过电话）向公司获取信息。预设利用了语音交易中识别技术的弱点。由于无法进行物理识别，公司必须使用替代方法来识别其客户。通常，这些替代方法涉及验证个人信息，如居住地、出生日期、母姓或账户号码。所有这些信息都可以被预设者通过社交网站或翻找垃圾桶获得。\n\
  \n# 无线攻击\n\n\n\n\n\n如果一家公司为员工配备了无线网络，渗透该网络将让专业渗透测试人员获得对系统和其他网络设备的访问。尽管关于将企业网络引入无线接入的风险的新闻层出不穷，但使用无线网络比购买和安装有线网络设备要便宜得多。虽然无线网络是有线网络的廉价替代方案，但缺乏适当的安全措施可能会让公司付出高昂代价。如果恶意用户能够访问“受保护”的网络，数据丢失和系统被攻破将随之而来。从专业渗透测试者的角度来看，无线网络是攻击的首要目标，因为无线网络的防护通常比有线网络少。即使公司对接入点进行了安全保护（例如在接入点和内部系统之间放置防火墙和入侵检测系统），员工也因在网络中安装非法接入点而臭名昭著，这规避了网络安全工程师保护公司资产的所有努力。在本节中，我们将进行无线攻击，以提升目标网络中的权限。如果操作成功，我们应该能够重复第\
  \ 9 章、第 10 章和第 11 章中的步骤，以识别并验证内部企业系统上的漏洞。\n\n**注意** 重复后续章节中的无线攻击示例至少需要两台无线计算机和一个无线路由器。由于路由器和系统的配置不同，我们将仅讨论我们攻击系统的配置。图\
  \ 12.16 是后续示例中所用无线网络的拓图。所有针对无线数据加密算法的无线攻击都需要无线路由器与已认证的系统之间建立活跃连接。进行无线攻击的额外要求是拥有一个带有可以设置为“监听模式”（Monitor\
  \ Mode）的无线适配器的攻击系统。\n\n| ![B9781597494250000178/f12-16.jpg is missing](img/f12-16.jpg)\
  \ |\n| --- |\n| 图 12.16。 |\n| 无线攻击的网络配置 |\n\n一旦获取了适当设备，我们就可以开始无线攻击。将讨论的攻击将针对已确认存在漏洞的协议。通过要求额外的加密方法（如虚拟专用网络\
  \ VPN），可以增加无线网络的防护，使无线加密的破解变得毫无意义。对于我们的演示，我们将假设除了此处讨论的内容外，不再使用任何额外的加密。\n\n## Wi-Fi\
  \ 保护接入攻击\n\nWi-Fi 保护接入（WPA）被认为比有线等效隐私（WEP）更劲的认证模式。奇怪的是，WPA 的破解速度反而比较弱的无线加密形式——WEP\
  \ 更快。WPA 的加密强度取决于 WPA 密码的强度——如果接入点使用弱密码，渗透测试人员可以使用简单的字典攻击对其破解。为了演示如何操作，我们首先需要开始配置攻击系统以监控所有无线流量。图\
  \ 12.17 是一个启动脚本，它将创建一个处于监听模式的虚拟无线连接。\n\n| ![B9781597494250000178/f12-17.jpg is missing](img/f12-17.jpg)\
  \ |\n| --- |\n| 图 12.17。 |\n| 进入监听模式的脚本 |\n\n一旦获取了适当设备，我们就可以开始无线攻击。讨论的攻击将针对发现漏洞的协议。运行脚本\
  \ `./ath1` 之后，我们可以通过 `iwconfig` 命令检查监听设备是否配置正确。查看图 12.18，可以看到 `ath1` 处于监听模式。此时，我们可以开始嗅探无线电波。\n\
  \n| ![B9781597494250000178/f12-18.jpg is missing](img/f12-18.jpg) |\n| --- |\n|\
  \ 图 12.18。 |\n| 监听模式 |\n\n有许多方法可以使用 `airodump-ng` 工具来查看附近的无线接入点。从任何扫描中获取的关键信息包括如下：■基础服务标识符（BSSID）：这是接入点的\
  \ MAC 地址。■扩展服务标识符（ESSID）：这是无线网络的名称。■站点（客户端）MAC 地址：在某些情况下，需要对客户端进行攻击（例如取消认证攻击）。**注意**\
  \ 作为一个有趣的旁注，我尝试获取了 `airodump-ng` 的截图。我遇到的的问题是接入点无处不在。即使我将接入点移动到地理位置不同的地方，也找不到不提供无线连接的地方（有些名字很幽默，有些则很粗俗）。看来在当环境下，无线已无处不在且难以回避。一旦确定了目标，我们就可以开始采集数据。图\
  \ 12.19 是我们用于开始数据捕获的命令；该命令将仅查找第 8 通道的接入点，其 BSSID 为 `00:1A:70:47:00:2F`。这些设置针对实验室接入点，并将根据目标进行更改。我们还要求\
  \ `airodump-ng` 捕获所有数据并存储在 `/tmp` 目录下。\n\n| ![B9781597494250000178/f12-19.jpg is\
  \ missing](img/f12-19.jpg) |\n| --- |\n| 图 12.19。 |\n| 启动 Airodump |\n\n图 12.20\
  \ 显示 `airodump-ng` 正在运行，收集无线数据包。当我们攻击 WPA 时，我们并不关心接入点与授权用户系统之间的大部分流量。我们感兴趣的只有两个设备之间的初始\
  \ WPA 握手，它对用户系统进行认证。WPA 认证使用预共享密钥，即 64 位十六进制数字或 8 到 63 个可打印 ASCII 字符的短语。\n\n\n\n\
  \n\n为了捕获握手，我们必须等待有人连接接入点（AP）。已经连接的系统不会生成我们所需的握手包，而等待有人连接可能耗时过长。然而，另一个程序——`aireplay-ng`——具有将连接的客户端从目标接入点取消认证的能力，这迫使客户端使用\
  \ WPA 握手重新连接并重新认证。在我们的测试实验室中，一旦知道 `airodump-ng` 正在监听，我们就简单地连接第二台笔记本电脑。一旦我们取消了连接客户端的认证，`airodump-ng`\
  \ 应该能够隔离并保存加密的预共享密钥。图 12.20 根据顶行最右侧的提示显示，确实捕获到了 WPA 握手：WPA Handshake: 00:1A:70:47:00:2F。然后，我们可以对加密密钥进行字典攻击。一个有趣的一点是，从我们启动\
  \ `airodump-ng` 攻击到捕获 WPA 握手之间仅经过了 56 秒。在图 12.21 中，我们将使用 `aircrack-ng` 程序来破解捕获的\
  \ WPA 加密密钥。要启动 `aircrack-ng`，我们需要提供捕获文件的位置和字典。虽然 BackTrack 上有一些字典文件，但它们在无线攻击中并不好用，因为它们包含的单词太短，无法作为有效的\
  \ WPA 密钥。\n\n| ![B9781597494250000178/f12-21.jpg is missing](img/f12-21.jpg) |\n\
  | --- |\n| 图 12.21. |\n| 启动 Aircrack-ng |\n\n如果密码解密是我们渗透测试工作的很大部分，我们我们需要创建自己的字典文件。如果我们专注于\
  \ WPA 攻击，并且由于我们知道密码至少为八个字符，我们可以开始只使用长度至少为八个字符的单词创建自己的字典。我们可以对已有的字典进行过滤，并创建一个包含八位字符单词的新文件。关于通过操作文件中的数据来实现我们目标的良好来源是\
  \ Linux 菜谱，位于 [`dsl.org/cookbook/cookbook\\_18.html#SEC266`](http://dsl.org/cookbook/cookbook_18.html#SEC266)。\n\
  \n**地下的笔记……**\n\n# 语言\n\n在字典攻击中决定包含哪些语言是困难的。尽管英语一直是计算机编程的通用语言，但字典攻击需要针对授权用户的语言。由于公司可能有来自世界各地的员工连接到内部服务器，除了英语之外，确切知道包含哪些语言变得越来越困难。`aircrack-ng`\
  \ 的一个缺点是它不具备变异字典单词的能力。*变异*（Mutating）是指使用不同的拼写方式修改单词的过程。使用单词“hacking”的变异示例可能包括：Hacking,\
  \ HACKING, h@cking, h@ck1ng，甚至 |-|@c|<1|\\|g。由于 `aircrack-ng` 不对词列表进行变异，渗透测试人员必须预先对单词进行变异。市场上还有其他密码破解程序可以变异字典条目，增加破解\
  \ WPA 密钥的概率。然而，`aircrack-ng` 非常强大，包含变异的词列表在其他应用程序中也很有用。图 12.22 是 `aircrack-ng` 成功破解\
  \ HeorotLab 接入点 WPA 共享密钥的截图，该密钥为“Complexity”（密钥对大小写敏感）。此时，我们可以连接到接入点并开始枚举网络和所有连接的系统。\n\
  \n| ![B9781597494250000178/f12-22.jpg is missing](img/f12-22.jpg) |\n| --- |\n|\
  \ 图 12.22. |\n| Aircrack 成功识别 WPA 密钥 |\n\n如果 HeorotLab 接入点连接到了供员工使用的的企业网络，我们将提升在网络中的权限。尽管我们本不应该有访问权限，但我们可以作为普通用户检查网络。如果\
  \ WPA 共享密钥密码是复杂的，我们渗透网络的能力很可能失败。要破解 WPA 密钥，我们必须有一个包含精确密码的字典文件。由于密码可以是 8 到 63 个 ASCII\
  \ 字符，尝试包含所有组合是不现实的。图 12.22 显示捕获的字典文件很小。为了破解 WPA 密钥，我们需要一个包含精确密码的字典文件。这种方法 WPA 破解非常快。\n\
  \n## WEP 攻击\n\n虽然我们在本节开头说 WPA 破解更快，但 WEP 攻击的成功概率更大。破解 WEP 涉及捕获客户端和接入点之间传递的初始化向量（IV）。最终用户会重用\
  \ IV，因为 IV 的数量是的。如果捕获了足够的 IV，就可以使用 `aircrack-ng` 等程序进行解密。图 12.23 是 `airodump-ng`\
  \ 捕获 IV 的截图，在“Data”列中显示捕获了 38882 个 IV。破解 WEP 所需的 IV 数量会有所不同。根据 [cdc.informatik.tu-darmstadt.de/aircrack-ptw/](http://www.cdc.informatik.tu-darmstadt.de/aircrack-ptw/)\
  \ 关于 aircrack 的报告，破解 WEP 密钥所需的 IV 总数通常在 100,000 以下。\n\n| ![B9781597494250000178/f12-23.jpg\
  \ is missing](img/f12-23.jpg) |\n| --- |\n| 图 12.23. |\n| |\n\n在流量较少的网络中，可以通过重放攻击创建更多的\
  \ IV。如果我们捕获从认证用户系统发送到接入点的广播包，我们可以多次重发广播包，从而强制接入点响应带有 IV 的数据。通过重放攻击，我们可以在几分钟内创建数千个\
  \ IV，从而加快攻击。启动重放攻击会造成额外的网络拥塞，只有在网络能够处理额外流量而不触发网络警报时才使用。图 12.24 是 `aircrack-ng` 破解\
  \ WEP 接入密钥的结果。根据 `aircrack-ng` 的显示，破解密钥的总时间约为 9 分钟，仅需要 35,006 个 IV。\n\n| ![B9781597494250000178/f12-24.jpg\
  \ is missing](img/f12-24.jpg) |\n| --- |\n| 图 12.24. |\n| Airodump 的 WEP 加密 |\n\n\
  \n\n\nWEP 破解相比 WPA 的优势在于，无论加密密钥的复杂度如何，WEP 加密都能被破解。唯一的问题是需要大量的网络流量才能破解 WEP。在假设客户端连接到接入点的情况下，可以根据需要产生额外的流量。尽管\
  \ WEP 被认为是一种过时的安全协议，但许多旧系统无法使用更强有性的协议。这迫使企业不得不提供带有 WEP 加密功能的接入点，或者购买更新的设备，而后者通常是一个不尽人意的备选方案。无线加密攻击并非无线攻击的唯一类型；有时无线驱动程序本身就存在可利用的漏洞。例如\
  \ Apple AirPort 无线驱动程序漏洞，可以使用缓冲区溢出攻击进行利用。有关该攻击的信息可以在 [www.kb.cert.org/vuls/id/563492](http://www.kb.cert.org/vuls/id/563492)找到。\n\
  \n# 项目管理\n\n在渗透测试的这一阶段，范围和成本问题应该是可控的，团队成员正在努力工作，质量符合预期。渗透测试成功的最大风险是目标系统崩溃且需要通知人员。第二大风险是不断发现潜在的攻击向量。\n\
  \n## 执行过程阶段\n\n当渗透测试工程师开始对目标系统进行渗透并提升权限时，工程师发现新漏洞的速度比渗透测试开始时快得多。随着每一个新发现，都会使用新的利用工具，而随着每个新利用工具的使用，系统崩溃的风险就会增加。除非渗透测试的目的是确定事件响应，否则渗透测试团队与管理员之间的持续通信对于确保渗透测试项目的成功至关重要。工程师可能无法及时意识到他们的行动导致了中断；通过与管理员紧密合作，他们可能足够快地识别问题以避免灾难。\n\
  \n### 信息分发\n\n如 第 11 章 所示，通信管理计划是信息分发过程和管理利益相关者过程最重要的输入。当目标系统崩溃或被轻易攻击攻破时，需要迅速通知利益相关者。所有紧急联系人均应被告知即将临的攻击，以防发生需要快速响应的情况。这并不意味着利益相关者需要了解所有的利用工具——在许多情况下，提醒系统和网络管理员会阻碍渗透测试。一旦管理员理解了漏洞的性质，他们可能会修补系统，停止进一步测试。这不仅阻碍了渗透测试人员，还可能掩盖通过其他（且可能未经过的）攻击向量可以发现的更严重的漏洞。\n\
  \n## 监控与控制过程\n\n第 9 章、第 10 章和 第 11 章中的许多相同任务将持续到渗透测试的阶段，包括执行质量控制、报告性能、监控和控制风险以及控制范围。最大的挑战将是控制进度。由于新漏洞仍在被发现，工程师会想要扩大项目的时间范围。范围蔓变并不是太大问题，除非发现了不同网络或系统之间的信任关系，特别是当该信任关系与管理或控制系统之间时。然而，系统中发现的内部漏洞越多，工程师可能越接近对目标系统的完全控制。\n\
  \n### 进度控制\n\n如果工程师发现可以实现系统完全控制的漏洞，但需要超出已分配的额外时间，则可能需要进度压缩技术。如果项目中有多个工程师，压缩进度的一种方法是移除正在研究前景不明漏洞的工程师，并将他们移动到计划进度表中后期的项目活动中，例如报告阶段。资源均衡法是补偿进度延误的另一种有效方法。如果完全控制目标系统需要资源，则可以调整资源访问权限，向处理高概率目标的的工程师倾斜，如果这有助于他们更早完成任务。资源均衡法可能会改变项目的关键路径；但是，如果实现了完全控制，可能就不再需要额外的渗透测试，这无疑会将任何延误回到项目进度的范围内。\n\
  \n## 总结\n\n一旦我们对系统或网络实现了初步渗透，就应该寻找增加我们访问权限的方法。如果我们拥有本地系统访问权限，我们应该寻找成为管理员的方法；如果我们拥有网络访问权限，我们应该嗅探网络流量，查看我们可以获取哪些敏感信息。由于通过进行中间人攻击（MITM）极有可能导致拒绝服务（DoS）攻击，因此在渗透测试实验室中应预先使用\
  \ `ettercap`——这将有助于增加对该技术的信心，并有助于定义真实渗透测试所需的精确配置。虽然通过漏洞利用工具黑入网络及其使用系统的想法可能看起来很有吸引力，但不要放弃使用社会工程策略来获得相同的结果。社会工程已被证明是获取公司及其客户敏感信息的有效方法。在公司设施进行任何社会工程攻击之前要小心——必须先获得许可以防与执法部门发生冲突。在如今的渗透测试环境中，无线攻击几乎是轻而易举的。由于企业使用无线扩展内部网络能力，专业的渗透测试人员应该理解无线领域的攻击向量。非法接入点将是进入最佳方式，因为企业支持的接入点通常包含额外的网络防御。\n\
  \n\n\n访问敏感信息可能就足以认为渗透测试是成功的。渗透测试结束时，系统可能未被攻破——这仅仅是因为寻找所有利用系统的方法的成本太高了。利用内部漏洞是提升目标系统权限的有效方法，但只有在先获得本地访问权限的情况下才可能实现。\n\
  \n# 网络包嗅探\n对网关路由器进行 ARP 欺骗可能会被检测，并向网络安全管理员发送警报。中间人（MITM）攻击也可用于嗅探通过加密通道传输的流量，包括 SSH\
  \ 和 SSL 协议。在网络中拦截或被动收集数据的能力，为专业渗透测试人员提供了获取登录凭据或其他敏感数据的手段，这些数据可用于以高权限访问目标系统。\n\n\
  ### 社会工程\n社会工程攻击在获取未经授权的敏感信息方面极其有效。社会工程相比于网络攻击的优势在于，人们往往乐于提供帮助，并愿意提供请求的敏感信息。\n\n\
  # 无线攻击\n尽管无线网络是有线网络的廉价替代方案，但缺乏适当的安全措施可能给公司带来な。进行无线攻击的要求是使用带有可以设置为“监听模式”（Monitor\
  \ Mode）的无线适配器的攻击系统。WPA 比 WEP 更容易破解，但只有在使用弱密码时 WPA 才能被破解。WEP 的破解时间可能比 WPA 长，但 WEP\
  \ 总是可以被破解。\n\n# 项目管理\n在此阶段，渗透测试项目最大的风险是系统崩溃时的通信问题。利益相关者不需要了解渗透测试此阶段发现的所有漏洞——在许多情况下，警报系统和网络管理员会阻碍渗透测试。如果工程师发现了可能导致系统完全崩溃的漏洞，可能需要采用进度压缩技术来为工程师提供额外时间。\n\
  \n**Q：** 我无法获取目标系统的管理权限。我该怎么办？\n**A：** 在专业的渗透测试中，并不总是能够获得管理员访问。在没有此类访问的情况下结束渗透测试是合理的。\n\
  \n**Q：** 我如何从不同的网络嗅探网络流量？\n**A：** 你只能嗅探当前连接的网络流量。要嗅探与你自己的不同的网络流量，你需要攻破目标网络中的一个系统（或在目标网络放置一个系统）。\n\
  \n**Q：** 我从无线 WEP 攻击中获得了大量的 IV，但 `aircrack-ng` 仍然无法破解密钥。我哪里做错了？\n**A：** 虽然在减少破解密钥所需的\
  \ IV 数量方面已经改进，但有时渗透测试人员的方方面都会出错，导致未能捕捉“正确”的 IV。破解 WEP 密钥的精确时刻在每次渗透测试之间会有显著差异。\n\n\
  ## 扩展你的技能\n想了解有关攻破系统和提升权限的内容？以下练习旨在为你提供额外的知识和技能，以便你更好地理解这个主题。使用你的实验室进行以下练习。\n\n\
