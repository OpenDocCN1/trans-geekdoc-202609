  \ root，如使用 IMPACT 的示例所示。\n\n## 工具与陷阱……\n\n# 商业漏洞\n\n虽然商业漏洞和非商业漏洞可能产生相同的结果（正如我们的示例中那样），但从互联网获取的任何漏洞都存在目标系统利用之外的风险。漏洞可能会导致系统崩溃，需要对导致系统崩溃的原因进行详细了解。如果使用商业工具，客户支持可能一个电话就能找到。决定使用何种攻击的另一个因素是，商业漏洞比网上找到的漏洞测试得充分得多，增加了漏洞的可靠性和成功率。如果我们没有使用\
