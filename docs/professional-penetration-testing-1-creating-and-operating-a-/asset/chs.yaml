  \ 图 15.28。 |\n| 文档安全设置摘要 |\n\n现在，我们拥有一份符合发布机密性和完整性要求的文档。我们可以将最终报告通过电子邮件发送给相关的利益相关者，而无需担心篡改或未经授权的访问。我们还可以对发送或接收的其他任何文档使用相同的技术，包括架构设计、询问函或渗透测试所需的文档。\n\
  \n\n\n\n最终报告是投入大量时间和资源用于撰写客户文档、收集信息、识别并利用漏洞以及提升权限的最终结晶。对于利益相关者而言，最终报告是理解其系统或网络整体安全态势的机会。由于利益相关者将根据我们的报告做出业务决策，因此我们需要确保报告的准确且有意义。报告的准确性可以通过同行评审来加强，并在事实核查期间由利益相关者进行验证。然而，我们不应该害怕在报告编写的事实核查阶段报告受到挑战的发现——某些利益相关者质疑发现并不是因为发现是错误的，而是因为这让他们显得很难看。如果我们的发现被利益相关者质疑，我们应该重新验证。如果我们的发现仍然与利益相关者的意见相反，我们应该原封不动地发布它们。利益相关者可能会失望，但我们获得报酬是因为我们的知识、技能和职业道德。与其得罪客户并失去他们，不如提供虚假的发现要好。\n\
  \n## 解决方案快速通道\n\n## 你应该报告什么？\n\n- 渗透测试报告详细列出了高层发现，以及对重复漏洞利用所需步骤的低层解释。\n- 最终报告中应包含正性发现和误报发现。\n\
  - 在标记某些内容为误报之前，我们需要 100% 确定我们的评估是正确的。\n- 即使威胁在最终报告发布之前已经得到缓解，该发现仍应记录在报告中。\n\n##\
  \ 初始报告\n\n- 将初始报告视同最终报告——初始报告不是草稿。\n- 最终报告的格式通常遵循专业的稿件指南。\n\n## 最终报告\n\n- 系统管理员可以通过检查来自被利用系统的日志文件来提高系统安全性，这些日志与最终报告中列出的利用事件相对应。\n\
  - 当我们详细说明漏洞系统的文档时，我们需要确保最终报告的机密性和完整性。\n\n**问：** 在渗透测试期间，我应该报告所有漏洞吗，即使它们是微小的？\n**答：**仅仅因为系统漏洞现在可能是微小的，漏洞利用可能就在咫尺。在最终报告中列出漏洞的目的是让客户管理层就如何最好保护目标系统或网络做出明决策。通过不包含某个漏洞，你实际上是在代表他们做决定；请包含所有漏洞，无论它们多么微小。\n\
  \n**问：** 报告的格式与本章详细说明格式匹配程度有多高？\n**答：** APA 格式旨在以简洁清晰的方法提供信息，并经过了多年的同行评审。渗透测试报告是为了向客户提供准确的结果；因此，以清晰简洁的方式传达这些信息是合逻辑的。\n\
  \n**问：** 你提到渗透测试中的摘要（abstract）被称为执行摘要（executive summary）——文本区域应该叫什么名字？\n**答：** 报告中的不同区域会有不同的名称，取决于谁来写。我见过正文被命名为许多不同的名称，包括\
  \ `findings`（发现）、`discoveries`（探索）和 `synopsis`（摘要）。如果我们为科学期刊写文章，论文中的主题将非常明确。然而，我们不受此类形式主义的限制，这意味着不同区域可以按你喜欢的任何名称命名。\n\
  \n**问：** 我不在渗透测试团队工作——我能找谁来进行同行评审？\n**答：** 如果你还没有加入本地的信息安全组织，现在是时候了。除了信息量丰富的会议，信息安全组织还提供人脉机会。很有可能，你可以在小组中找到愿意进行同行评审的人。不要指望他们免费；一分钱一货。\n\
  \n## 扩展你的技能\n\n想了解如何报告结果吗？以下练习旨在为你提供额外的知识和技能，以便你更好地理解这个主题。请使用你的实验室进行以下练习。\n\n###\
  \ 创建简单的渗透测试报告\n\n1. 在互联网上搜索关于专业渗透测试报告应该是什么样的想法。提供至少两个示例的统一资源定位符（`URL`）。\n2. 使用 Microsoft\
  \ Word 或 OpenOffice 创建一个报告模板。模板应包含标题页、执行报告页、正文、结论,附录 a 中的架构，在图 13.10 中描述架构。包含 Hackerdemia\
  \ 服务器上的所有可用端口和防火墙配置（见图 13.12）。省略 `netcat` 。将架构描述添加到正文中。\n4. 对 Hackerdemia 服务器上的至少五个通信端口进行高层分析。提供你的发现的列表形式，以及缓解这些端口的额外列表。每个端口提供至少两种缓解方案。\n\
  5. 假设在 Hackerdemia 服务器上安装了反向 `netcat` shell，如图 13.11 所示，使用社会工程学。创建一个高层描述利用的场景——描述应至少两段。将你的发现添加到步骤\
  \ 4 的列表形式中。\n6. 为步骤 5 中详细说明漏洞提供至少三种缓解方法，并以列表形式添加到正文中，如步骤 4 所示。\n7. 使用第 13 章中的架构并在图\
  \ 13.6 所示，重建安全外（SSH）反向 shell。使用脚本记录所有击键并将其保存到文件中。将脚本输出添加到报告的附录 A 中。\n9. 创建报告中使用的缩写词列表。将其添加到附录\
  \ B 中。\n10. 在互联网上找到与步骤 4 和步骤 5 的发现相关的参考文献。\n\n### 创建指标\n\n1. 根据在练习 15.1 中收集的信息，提供描述你的缓解建议的决策树分析图。\n\
  2. 对 Hackerdemia 服务器进行 Nessus 扫描。创建一个敏感性矩阵，使用至少五个不同的发现。使用“缓解时间”作为影响衡量标准。\n\n\n\n\
  \n# 提交报告进行同行评审\n\n1. 访问 [`forums.heorot.net`](http://forums.heorot.net)并在位于“专业渗透测试书籍”章节下的“第\
  \ 15 章”论坛中提交你的报告。\n2. 对已提交的报告进行同行评审，并将你的反馈作为回复发布。在发表评论时请保持建设性。\n\n参考文献信息：INFOSEC\
