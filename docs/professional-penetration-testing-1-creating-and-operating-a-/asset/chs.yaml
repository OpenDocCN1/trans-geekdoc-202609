  \n\n由于我们目前已经获得了对系统的未经授权访问，我们需要确定该漏洞影响了 OSSTMM 中的哪些控制区域。根据授予用户“obama”的权限级别不同，受影响的区域可能包括不可否认性、机密性、完整性和隐私性。需要对目标系统进行进一步枚举以量化该漏洞的严重性；但考虑到受影响的控制区域之，这一发现是非常严重的。那么，我们从这次自动化工具练习中学到了什么？是的，我们学会了如何识别漏洞并对\
  \ `OpenSSL` 执行利用。我们学到的不仅于此；首先，我们知道自动化应用程序可能会出错。`IMPACT` 将端口 10000 标记为 `Veritas`\
  \ 是错误的。考虑到 `Webmin` 在跨企业系统中使用的频率很低，假设它是 `Veritas` 是合合理的，因为后者在大型企业中被广泛使用。这种类型的误判并不罕见。我们学到的另外一点是，自动化工具可以为我们节省大量工作时间，特别是当我们使用调度功能时。`Nessus`\
  \ 不仅扫描了我们的目标，还为我们提供了关于查看哪些漏洞的非常详细的信息，并提供了有关每个漏洞的进一步信息的链接。它还提供了严重程度排名，在必要时可以用于确定攻击的优先级——在处理数千个系统时，需要某种方便的方法来筛选所有数据。`IMPACT`\
  \ 通过其调度功能提供了额外的自动化，并可以在极少人工干预的情况下利用系统。与其花费所有时间进行漏洞识别和利用，使用正确的工具可以为渗透测试团队节省宝贵的时间并降低整体成本。\n\
  \n# 利用代码 – 创建你自己的程序\n\n如果你在渗透测试期间有时间，你可能创建自己的利用程序。然而，这并不是一件简单的事情。创建自己的利用程序是一个高级课题，我们无法在书中进行有效的涵盖。我们将从高层面上讨论创建利用程序的方法，并提供几个示例以便我们理解这一概念。\n\
  \n**警告** 项目经理：在项目中创建利用代码的成本极高，特别是在项目周期和人力方面。虽然有一些自动化工具可以降低这种成本，但创建利用程序的时间仍然是密集的。\n\
  \n## 模糊测试 (Fuzzing)\n\n模糊测试可以帮助识别应用程序中可能被利用的部分。简单来说，模糊测试是一个向应用程序传递随机数据并期望检测到异常的过程。当目标是接受用户输入的应用程序部分时，异常可能表明存在数据清洗不当，这可能导致缓冲区溢出。理解模糊测试概念的另一种方法是将其视为暴力破解。通常，我们将暴力破解与密码攻击联系起来，但我们可以对接受用户提供数据的应用程序的任何部分进行模糊测试。使用示例可能会更容易解释。例如在图\
  \ 11.43 中，我们正在运行一个名为“Jbrofuzz”的程序，这是一种以发现 Web 服务器目录而闻名的模糊测试应用程序。在这种情况下，我们要求模糊测试器寻找\
  \ IP 地址为 `192.168.1.107` 的目标上的任何目录。在图 11.43 中，我们可以看到它正通过使用伪随机字符串作为目录名称来暴力破解检测目录。这个特定版本的\
  \ `Jbrofuzz` 拥有一个包含 58,658 个名称的列表，可以在模糊过程中将其作为目录名称。模糊测试可能需要相当长才能完成，因此最好在非工作时间进行自动化。\n\
  \n| ![B9781597494250000166/f11-43.jpg is missing](img/f11-43.jpg) |\n| --- |\n|\
  \ 图 11.43. |\n| Java 模糊测试器扫描 80 端口 |\n\n**警告** 工程师：在监控的网络上对远程系统进行模糊攻击可能会引起网络安全部门注意。如果你需要保持不被发现，模糊测试可能不是一项合适的渗透测试活动。每当我们发现应用程序中有插入用户提供数据的地方时，就可以使用模糊测试器——而是为了寻找目录。现在有很多不同的模糊测试器，它们的工作原理不同。我们在图\
  \ 11.43 中使用的原理被称为“生成式 (Generation)”。基本上，模糊测试器被给定了一些关于寻找什么的信息，但它不会偏离给定的参数。在图 11.43\
  \ 中，给定的信息是 58,658 个尝试作为目录的词。真正复杂的生成式模糊测试器还会使用预定义词的组合并修改这些目录词，以（希望）发现新目录。模糊测试的另一种类型是变异式模糊\
  \ (Mutation)，它获取数据（例如传输控制协议 [TCP] 数据包）并对其进行变异。这种技术对于发现通信协议或与应用程序通信中的缺陷有用。变异式模糊通常用于\
  \ Web 服务器应用程序的会话。从 OSSTMM 的角度来看，识别额外的目录可能会影响系统的隐私性和机密性。发现本应该受密码保护但由于配置错误导致保护措施失效的目录并不罕见。\n\
  \n\n\n\n检测漏洞的另一种方法是通过检查代码本身。在某些情况下，你的渗透测试工作将包括对应用程序代码的访问；优势在于你将确切知道应用程序在做什么。缺点是代码库的规模通常过大——在一个应用程序中遇到数千万行代码并不罕见。寻找缺陷的快速方法是使用专门为此类工作设计的应用程序；微软的\
  \ `PREfast Analysis Tool` 能够分析 C/C++ 代码的安全问题。还有其他工具，包括可以在 [www.fortify.com/security-resources/rats.jsp](http://www.fortify.com/security-resources/rats.jsp)\
  \ 获取的`安全审计工具 (Rough Auditing Tool for Security (RATS))`，它也可以根据已知的漏洞列表对 C/C++ 程序进行扫描。然而，仅仅因为我们在应用程序中发现了漏洞，并不意味着它可以被用来创建利用程序。决定漏洞可利用性的因素在于程序是如何编译的。我们希望找到一种将我们自己的数据注入到漏洞中的方法，从而导致程序崩溃。仅仅通过查看代码这一点是非常困难的，因为正如前面提到的，编译器构建可执行文件可能会使得无论代码显示了什么，都不可能让应用程序崩溃。充其情况下，你只能找到可以开始攻击的区域。你在分析代码时最可能成功的地方是用户名、密码和域名（或\
  \ IP 地址）的添加。在某些情况下，程序员会走捷径，故意在代码中添加访问信息，以便应用程序可以在不需要用户的情况下与服务器通信。这在连接数据库的应用程序中经常发生，通常是为了日志记录。我们可能会跳过代码审查，仅使用流量嗅探器收集这些信息；然而，我们发现大多数情况下通信通道是加密的，这阻止了我们检测这些粗糙的编程技术。我们还应该寻找开发者安装的后门。这些后门是包含在代码中的快捷方式，以便开发者在编写代码时能够更容易访问应用程序。\n\
  \n# 应用程序逆向\n\n对于那些对学习汇编感兴趣的人来说，应用程序逆向是非常兴奋的。对于我们其他人来说，对程序进行逆向工程似乎是一项巨大的任务。如果我们必须知道应用程序在做什么，而又无法访问代码，我们唯一的选择就是开始逆向工程。我们不会在这里解析汇编；有很多其他书籍对逆向工程的讨论比我这个短章节写的要得多。然而，理解人们编写的内容与计算机读取并执行的内容之间存在巨大差异是有帮助的。了解可能存在的攻击向量也是有帮助的，即使它超出了本书的预设范围。让我们来看一个大多数人都熟悉的非常简单的程序：\n\
  \n```c\nint main(int argc, char *argv[]) {\n    printf(“Hello World!\\n”);\n   \
  \ return 0;\n}\n```\n\n编译之后，我们可以使用像 `gdb` 这样的程序来查看汇编代码，如下所示：\n\n```\n<main+0>: push\
  \ %ebp\n<main+1>: mov %esp,%ebp\n<main+3>: sub $0x8,%esp\n<main+6>: and $0xfffffff0,%esp\n\
  <main+9>: mov $0x0,%eax\n<main+14>: sub %eax,%esp\n<main+16>: movl $0x80484c4,(%esp)\n\
  <main+23>: call 0x80482b0 <_init+56>\n<main+28>: mov $0x0,%eax\n<main+33>: leave\n\
  <main+34>: ret\n```\n\n从代码审查的角度来看，我们对 `printf` 命令感兴趣，因为它没有检查输入的长度。如果使用 `printf`\
  \ 命令来打印用户提供的数据，我们看到的将是一个可能的利用漏洞（缓冲区溢出）。从逆向工程的角度来看，我们可以识别出数据被推入内存（`$0x80484c4`）而没有经过任何缓冲区长度检查。不过，我们实际上需要某种方法来修改该缓冲区——目前程序没有包含用户输入。如果我们包含允许用户添加信息的方法，就可能进行缓冲区溢出攻击。外部资源可以帮助你更好地理解在渗透测试中使用逆向工程的力量。这是一个缓慢的过程——比代码审查还要慢。\n\
  \n## Web 黑客攻击\n\n一种非常流行的攻击向量是针对 Web 网站的。在外部渗透测试中，通常可用的应用程序是 Web 服务器，因为防火墙被配置为限制任何通信。Web\
  \ 攻击在成功时效率非常高；大量数据与购物相关。现在有很多工具可以协助 Web 黑客攻击；然而，我们将以相同的方式开始——手动操作。在本节中，我们讨论了两种最流行的攻击：SQL\
  \ 注入和 XSS 攻击。我们还从高层次讨论了 Web 应用程序攻击，因为我们已经演示了一个 Web 应用程序（章节开头的 Webmin 漏洞）。为了演示这些利用程序，我们将使用较好的训练应用程序之一——`WebGoat`，它由开放\
  \ Web 安全项目 (`OWASP`) 支持。你可以在 [www.owasp.org](http://www.owasp.org) 找到关于 `WebGoat`\
  \ 项目的信息。为了方便起见，DVD 中包含了 `WebGoat` 5 版本。\n\n## SQL 注入\n\n根据 NIST 特别出版 800-95，SQL\
  \ 注入是一种“用于操纵 Web 服务并向 RDBMS [关系型数据库管理系统] 发送 SQL 查询以更改、插入或删除数据库中的数据的方法”。换句话说，是时候学习构建数据库命令了。`WebGoat`\
  \ 提供了一些背景信息，但不足以真正理解和编写必要的语法。有很多书籍可以帮助填补你在 SQL 语法方面的任何知识空白，但接接的示例并不复杂，应该易于理解。如果使用后端数据库的应用程序对用户输入进行了适当过滤，SQL\
  \ 注入将无法运行；然而，SQL 注入发生的频率比应该的要高。通过 `WebGoat`，我们可以看到 SQL 注入是如何工作的——在图 11.44 中，我们可以看到尝试登录\
  \ Tom 的结果。不幸的是，登录失败了。看起来数据库中没有姓“Tom”的人。我们可以尝试使用一堆名称进行暴力破解，或者尝试让后端数据库把它知道的一切都给我们。\n\
  \n\n\n\n在本挑战中，提供给我们的提示之一（如图 11.44 所示）是数据库查询的工作原理：`SELECT * FROM user_data WHERE\
  \ last_name =‘Tom’`。一旦我们学会了正确的数据库命令是什么样的，就会知道以下命令应该给我们所有内容：`SELECT * FROM user_data\
  \ WHERE last_name = ‘Tom’ OR ‘1’ = ‘1’`。我们通过新命令告诉数据库的是：显示与用户 `Tom` 关联的 `user_data`……或者因为\
  \ `1 = 1` 而给我们所有内容（数据库只有在查询语句为真值时才会返回信息。当我们只查找 `Tom` 且没有找到姓氏为 `Tom` 的用户时，它会返回假，意味着我们没有收到任何信息。`OR\
  \ 1 = 1` 语句强制数据库查询被解释为真，从而提示数据库向我们提供 `user_data` 中的所有内容）。利用这些知识，我们可以修改输入，使数据库接收到完整的字符串。在图\
  \ 11.45 中，我们看到已成功将数据库命令注入应用程序中，并获取了数据库中所有用户的信用卡信息。\n\n| ![B9781597494250000166/f11-45.jpg\
  \ is missing](img/f11-45.jpg) |\n| --- |\n| 图 11.45. |\n| 成功的 SQL 注入 |\n\n根据 OSSTMM，SQL\
  \ 注入是完整性控制（Integrity Controls）缺陷的完美示例。此外，隐私（Privacy）也会受到影响，如图 11.45 所示，与公司人员姓名相关的信用卡信息发生了泄露。机密性（Confidentiality）和不可否认性（Nonrepudiation）是\
  \ SQL 注入可能影响的其他控制领域，具体取决于可被利用应用程序的数据分类和功能。\n\n## 跨站脚本\n\n根据 NIST 特别出版物 800-95，当有效的\
  \ Web 服务请求被“透明地重定向到受攻击者控制的 Web 服务时，这种攻击服务通常是执行恶意操作的（NIST, 2007)”。这种攻击的最佳用途是收集受害者用户的会话信息，特别是当受害者是管理员时。一旦收集了会话信息，有时就可以重放攻击——使用会话信息以受者的身份登录漏洞服务器。让我们来看一个使用\
  \ WebGoat 的示例。在图 11.46 中，我们看到了 XSS 实验的开始。在这个例子中，我们将使用用户名 `Tom Cat`，该用户使用 `tom` 作为密码（不带引号）。登录后，我们可以选择\
  \ `Tom Cat` 并编辑他的个人资料（为了简洁，我没有包含这些截图——如果你在自己的实验室中复制此练习，它们将是一言自明的）。在图 11.47 中，我们正在与数据库交互，我们希望它容易受到\
  \ XSS 攻击。在“Street”（街道）字段中，我们可以插入以下超文本标记语言（HTML）代码（在图 11.47 中仅可见部分内容，但它们都在那里）：\n\n\
  ```\n<script>alert(“stealing session ID”+document.cookie)</script>\n```\n\n| ![B9781597494250000166/f11-46.jpg\
  \ is missing](img/f11-46.jpg) |\n| --- |\n| 图 11.46. |\n| WebGoat XSS 实验 |\n\n|\
  \ ![B9781597494250000166/f11-47.jpg is missing](img/f11-47.jpg) |\n| --- |\n| 图\
  \ 11.47. |\n| 向数据库注入“警报”脚本 |\n\n保存后，将弹出一个带有会话信息的警报窗口。在我们成功注入脚本后，等待其他人访问 Tom 的信息，希望此人的权限比\
  \ Tom 高。在图 11.48 中，我们以 Tom 的经理——Jerry 的身份登录，以模拟 XSS 攻击的剩余部分。当 Jerry 查看 Tom 的个人资料时，警报脚本就会出现，如图\
  \ 11.48 所示。\n\n| ![B9781597494250000166/f11-48.jpg is missing](img/f11-48.jpg) |\n\
  | --- |\n| 图 11.48. |\n| 经理的会话 ID 被盗 |\n\n注意警报框，经理的会话 ID 已被记录。如果攻击者获取了该 ID，他就可以以\
  \ Jerry 的身份登录系统并拥有他所有的权限。在现实世界中，攻击者不会创建一个“警报”框——他们会使用 JavaScript 或另一种嵌入到 HTML 中的编程语言将会话\
  \ ID 发送给攻击者，而受害者完全不知道发生了什么。XSS 攻击在获取系统访问或或提升方面非常有效（我们将在下一章中讨论）。\n\n\n\n\n\n尽管 SQL\
  \ 注入和 XSS 攻击可以获取数据，但与外界交互的应用程序也可能受到漏洞利用。本章开头提到的 Webmin 漏洞就是 Web 应用程序漏洞的完美示例。如果我们查看漏洞代码本身，会发现该技巧在于向\
  \ URL 中注入额外的字符——换句话说，就是缓冲区溢出……这是一个常见但危险的错误。在寻找 Web 应用程序的利用程序时，我们只需遵循本章开头提到的相同流程：\n\
  \n1. 识别运行在端口上的应用程序（Web 应用程序通常使用 `80` 或 `443` 端口，但不要局限于这些端口——高位端口上有许多管理类 Web 应用程序）。\n\
  2. 查找版本信息（如果可能的话）。\n3. 在互联网上寻找漏洞。\n4. 针对目标应用程序运行漏洞。同时，确保使用多个工具来识别应用程序。正如我们在第 10\
  \ 章中所所示，横幅信息（banners）可能是错误的。\n\n那么，Web 应用程序中具体存在哪些类型的漏洞呢？大部分我们已经涵盖过了，但根据 OWASP 标准，这些是前\
  \ 10 大攻击向量：\n\n*   跨站脚本（在 WebGoat 中演示）\n*   注入缺陷（包括 SQL 注入）\n*   恶意文件执行（通常涉及向服务器上传恶意且未经检查的程序；例如“PHP\
  \ 远程文件包含”漏洞）\n*   不安全的直接对象引用（与 Webmin 任意文件披露漏洞类似）\n*   跨站请求伪造（一种针对受害者浏览器的攻击）\n*\
  \   信息泄露和不当错误处理（类似于 Nessus 在扫描 pWnOS 服务器后识别的 `/php` Web 目录）\n*   破坏身份验证和会话管理（会话劫持，如\
  \ WebGoat 所示）\n*   不安全的加密存储（这纯粹是应用程序设计不当，当程序员没有使用最佳形式的加密或错误地实现了加密时）\n*   不安全的通信（包括在网络上以明文形式发送用户名和密码，网络分段上的监听者可以捕获数据）\n\
  *   未能限制 URL 访问（更多是编程不当，导致恶意用户可以绕过登录安全措施）\n\n在进行渗透测试时，我们需要寻找所有这些漏洞。在检查了前 10 名列表后，大多数可以归类为配置错误或不当的编码实践。你会发现，大约\
  \ 90% 的成功利用将源于配置错误——其余 10% 是由在 `CORE IMPACT` 等应用程序中发现的、或在 [www.milw0rm.org](http://www.milw0rm.org)\
  \ 上提供的公开漏洞。还有一些自动化工具在分析和利用 Web 应用程序漏洞方面非常有效。`CORE IMPACT` 已将 XSS 和 SQL 攻击加入了其 RPT\
  \ 产品中。另一个强大的工具是惠尔惠开发公司提供的 `HP WebInspect`。它也是一个商业产品，我也用过，发现它在分析 Web 应用程序非常有用。也有一些免费解决方案，包括\
  \ `Nikto` 和 `Paros Proxy`。\n\n# 项目管理\n\n如前所述，我们仍然处于执行过程组——具体来说是在“指导和管理项目执行”过程中。前两个章中提供的关于执行过程以及指导和管理项目执行的信息仍然适用于渗透测试项目的这一阶段。\n\
  \n## 执行过程阶段\n\n随着渗透测试“漏洞验证”阶段的启动，我们深度参与了执行过程阶段。根据发现，漏洞验证可能仍需要对分配的资源进行修改，包括人员和测试系统。资源压力最大的时刻是从目标中提取出新信息并揭示新漏洞时。为了减少这些发现对项目整体成功的影响，通信承担了更为关键的角色。\n\
  \n### 信息分发\n\n通信计划是“信息分发”和“管理利益相关者”过程中最重要的输入。虽然信息分发对于渗透测试的所有阶段都至关重要，但在漏洞验证阶段更是如此。期间渗透测试团队面临着负面影响系统的最大风险；因此更新、验证和确认通信计划至关重要。信息分发关注几个不同方面，包括在正确的时间将正确的信息交给正确的人。对于渗透测试项目，通信计划受影响最大的需求包括利益相关者通信需求（下文讨论）、负责传递信息的、通信方式（电子邮件、电话等）以及升级流程。由于渗透测试的这一阶段可能涉及高成本和时间敏感的事件，请确保与紧急情况相关的通信项目包含反映渗透项目敏感性的通信计划。\n\
  \n\n\n\n\n# 漏洞验证\n\n漏洞验证主要涉及识别目标系统、应用程序和网络设备中的配置错误。在所有已验证的漏洞中，只有约 10%是已发布漏洞利用的结果。由于工程师在渗透测试任务的“漏洞识别”阶段无法识别所有潜在漏洞，项目经理必须为渗透测试项目的这一阶段分配额外时间。如果能为未发现的漏洞提供一个大致的时间估算那就太好了，但影响所需长度的因素太多，在不预先知道这些因素的情况下，这是无法可能的。这些因素包括目标系统或网络的规模和复杂性、目标与外部系统之间的信任关系、渗透测试团队的技能水平及其与目标的相关性等。与渗透测试团队沟通是衡量该阶段应分配多少时间的最佳方式。范围蔓延（scope\
  \ creep）问题之前提到过，但通常是从客户发起的范围变更角度来看。在漏洞验证阶段，扩大项目范围的压力来自于渗透测试团队内部。在充足的时间、精力和资源的情况下，渗透测试团队理论上可以破解任何系统。渗透测试项目经理将面临在项目此阶段将渗透测试团队限制在规定时间内的挑战，仅仅因为渗透测试团队往往接近实现额外的漏洞利用。项目经理会被那些对渗透测试最终报告产生积极影响的漏洞利用承诺所诱惑。是否为此阶段分配额外时间，应该与额外的攻破对目标系统和/或网络整体安全态势的实际影响进行仔细平衡。通常，额外的漏洞利用不会增强利益相关者对目标安全状况的理解。然而，在某些情况下，允许渗透测试团队获得额外时间可能是客户或高层的转折点。与渗透测试团队及利益相关者的有效沟通有助于确定采取最佳方案。\n\
  \n## 管理利益相关者\n\n项目经理负责利益相关者管理。理解利益相关者的需求、目标和目的，并促进满足这些需求、目标和目的所需的沟通水平，是项目经理职责。当渗透测试团队开始对跨网络系统发起攻击时，利益相关者的沟通需求会剧增。对他们需求的响应时间应以分钟计，而不是小时或天。在系统崩溃的最坏情况下，工程师必须立即停止活动，并对他们在崩溃前做什么提供极其详尽的信息，甚至细到在什么时间按了哪些键。这就是为什么在渗透测试期间向工程师强调日志的必要性至关重要。问题日志在渗透测试的这一阶段非常有帮助。通过对所有问题进行注释并监控它们的解决情况，项目经理可以跟踪发生了哪些问题，以及为了修复问题做了哪些工作。未能解决问题可能会导致冲突和延迟。\n\
  \n## 总结\n\n在本章中，我们跨越了审计工作与专业渗透测试人员预留工作之间的界限。通过利用我们的目标系统，我们能够验证审计项目只能预测的漏洞。大众有大量关于漏洞验证的书籍和在线教程供选择。然而，重要的是，在专业的渗透测试中，有许多外部因素影响着我们使用什么工具以及何时使用。项目范围可能会将你的攻击限制仅限于那些非破坏性的攻击。虽然这降低了系统崩溃的概率，但它并没有对目标安全态势提供全面的分析。此外，渗透测试项目始终存在时间限制，这迫使项目经理挑选哪些渗透测试任务可以尝试，以及持续多久——项目经理很少有奢侈让工程师完全放主性。由于这些限制，使用自动化工具和对范围变更进行严格控制是必不可少的。自动化工具的分析可能是错误的。工具可能会错误识别应用程序，导致遗漏利用机会。尽可能验证发现的结果。这并不意味着手动方法也是识别漏洞的最佳方法。模糊测试（Fuzzing）和暴力破解工具执行的操作在专业渗透测试中是人类无法完成的。总结一下：任何兴趣成为专业渗透测试人员或需要管理渗透测试项目的人，必须密切熟悉漏洞验证的所有方面。渗透测试人员不能仅仅依靠工具来识别和利用目标系统或网络上的所有漏洞。是的，工具可以加速进度，但工程师必须理解这些工具的优点和局限性。几，公司还满足于简单的\
  \ Nessus 扫描来建立安全态势基准。行业已经从那时走了很远，现在需要具备知识的工程师和项目经理深入研究其架构，因为公司知道这正是恶意用户正在做的。遗憾的是，执行专业渗透测试人员任务所需的知识仍在不断增长。对于刚进入该领域的人来说，有很多需要追赶的。这本书只是一个起点——只需确保在过程中完成所有的练习即可。对于那些已经在领域内工作了一段时间的人，你们会同意：学得越多，知道的越少，而且总有我们学得不够充分的东西。我们查看了数据库攻击、Web\
  \ 攻击、应用程序攻击、编码实践、缓冲区溢出等。我们只触及了在所有可能情况下要求的表面。对于那些想要避免不断学习的人来说，渗透测试领域可能是一个糟糕的选择。对于那些想在渗透测试领域追求职业的人来说，他们发现这是一个令人兴奋且充满持续挑战的。\n\
  \n## 解决方案快速通道\n\n## 漏洞代码 – 寻找与运行\n\n- 在使用任何漏洞之前，确保你查看并理解了其所有部分。\n- 始终使用至少两个工具来验证任何发现。\n\
  - 自动化工具可以节省时间，但需要验证发现结果的准确性。\n- 使用任务所需的工具——不要让资金成为问题。\n\n\n\n\n\n- 由于系统崩溃的风险增加，一个强有通信计划至关重要。\n\
  - 范围蔓延（Scope creep）是项目此阶段的一个问题——如有必要，请确定未来项目中应调查的领域，然后继续进行。\n\n**Q：** 寻找可用漏洞程序的好来源是什么？\n\
  **A：** 本章提到了 [www.milw0rm.org](http://www.milw0rm.org) 是许多漏洞程序的存储库，通常是一个极佳的起点。Metasploit\
  \ 框架也包含许多漏洞程序。当这两个来源都没有你需要的内容时，开始在互联网上寻找。许多安全专家仅在他们的个人网站上发布漏洞程序。\n\n**Q：** 我下载的漏洞程序不起作用——我该怎么办？\n\
  **A：** 通常情况下，漏洞程序是针对特定的操作系统和语言包编写的。不同的系统通常需要不同的漏洞利用方法。可能该漏洞程序是有效的，但需要重写以适应目标操作系统的版本。\n\
  \n**Q：** 在渗透测试的这一部分，防止范围蔓延的最佳方法是什么？\n**A：** 要完全理解网络或系统中安全威胁的全貌几乎是不可能的，因此几乎总会有新东西需要追求。根据工程师的反馈，新发现的漏洞可能产生不足以继续追求的结果。然而，该漏洞仍应在最终报告中提及，并在未来的渗透测试中进行检查。项目开始时定义良好的范围将帮助项目经理了解何时越界了，并需要实施控制措施以防止项目无限扩张。\n\
  \n**Q：** 你建议使用哪些额外的学习工具来更好地学习 Web 黑客、逆向工程、模糊测试（fuzzing）等？\n**A：** 有许多致力于这些主题的网站，可以对执行渗透测试所需的技术提供良好的理解。然而，这些主题属于高级内容，自学需要花费大量时间。对于专业的渗透测试人员，我强烈鼓励他们参加专业的培训课程并获取有关主题的最新书籍。合格的培训课程和行业认可的书籍是获取信息的更快方法，而在这一行业，时间就是金钱。\n\
  \n## 扩展你的技能\n\n想了解漏洞验证吗？以下练习旨在为你提供额外的知识和技能，以便你能更好地理解这一主题。请使用你的实验室进行以下练习。\n\n###\
  \ 查找并运行在网上找到的漏洞程序\n1. 在 [www.milw0rm.org](http://www.milw0rm.org) 上找到 Debian OpenSSH/OpenSSL\
  \ 软件包随机数生成器漏洞程序。\n2. 在你的渗透测试实验室中针对虚拟机中的 `pWnOS` 服务器执行该漏洞程序。\n3. 识别并解释书中示例与你个人经验之间的任何差异。\n\
  \n### 使用自动化工具\n1. 从 Tenable Network Security 获取并安装最新版本的 `Nessus`。\n2. 对渗透测试实验室中的\
  \ `pWnOS` 服务器进行扫描。识别并解释书中示例与你个人经验之间的任何差异。\n3. 对渗透测试实验室中的 `De-ICE 1.100 LiveCD` 进行\
  \ `Nessus` 扫描。记录结果。研究互联网上是否存在任何漏洞。\n\n### 使用模糊测试工具\n1. 在你的 `BackTrack LiveCD` 上找到\
  \ `Jbrofuzz` 工具。针对 `pWnOS` 服务器运行 `Jbrofuzz` 并执行目录扫描。记录发现的任何目录。识别并解释练习 11.2 中 `Nessus`\
  \ 扫描发现的目录与 `Jbrofuzz` 扫描发现的目录之间的任何差异。\n2. 针对 `Hackerdemia LiveCD` 运行 `Jbrofuzz`。识别\
  \ `Jbrofuzz` 发现的目录。\n\n## SQL 注入\n1. 研究互联网并识别 `SQL` 中所有可能的命令。找到 `SQL` 命令的示例并解释它们的工作原理。\n\
  2. 使用 `WebGoat`，尽可能完成`注入缺陷（Injection Flaws）`下列出的练习（参见图 11.45）。\n\n### XSS 攻击\n1.\
  \ 研究互联网并识别可能的 `XSS` 攻击。找到 `XSS` 攻击的示例并解释它们的工作原理。\n2. 使用 `WebGoat`，尽可能完成`跨站脚本（Cross\
  \ Site Scripting (XSS))`下列出的练习（参见图 11.46）。\n\n**参考文献**\nMertvago, P., *俄语谚语和格言对比俄英词典*.\
  \ (1995) Hippocrene Books, New 纽约 .\nNIST, *安全 Web 服务指南 SP800-95* (2007); [`csrc.nist.gov/publications/nistpubs/800-95/SP800-95.pdf`](http://csrc.nist.gov/publications/nistpubs/800-95/SP800-95.pdf)。\n\
  \n\n\n\n\n一只狼就能赶散一群羊。——俄语谚语：*“一只狼可以击溃一整群羊。”* (Mertvago, 1995) 信息系统安全评估框架 (ISSAF)\
  \ 仅用了一半页的内容来描述渗透测试中的攻破系统和提升权限。人们自然会假设，因为渗透测试中这一阶段分配的页面空间如此有限，它可能并不重要或者执行起来很简单——事实与此完全相反。一旦系统漏洞被识别并利用，渗透测试员通常会在系统中获得一个微小的立足点，且仅具有最低权限。尽管有限的访问可能足以得出渗透测试项目的结论，但项目的首要目标应该是完全攻破目标。在本节中我们要解决的挑战是如何从最小渗透到系统的完全攻破。ISAF\
  \ 将渗透测试中的“获取访问和权限提升”过程描述为四个可能的步骤。这些步骤不一定有顺序，甚至也不非都是必要的。它们如下：■ 获取最小权限 ■ 获取中间权限 ■\
  \ 攻破 ■ 最终攻破。在第 11 章中，我们获得了最小权限并执行了攻破。以 pWnOS 磁盘为目标，我们能够下载系统文件（包括系统的 shadow 文件，其中包含系统中所有用户的加密密码），并获得具有普通用户权限（`obama`）的远程\
  \ shell。在本章中，我们将讨论在专业渗透测试项目中实现此类攻破后，下一步该做什么。尽管“只要时间足够，任何系统都可以被攻破”的观点是一个逻辑假设，但在专业的渗透测试期间，时间是宝贵的资产。渗透测试结束时，系统可能未被攻破——因为寻找所有利用系统的方法成本太高了。我们在本章中继续渗透测试示例，并能够获得\
  \ root 访问，但在现实世界的渗透测试中，我们并不总是能取得成功。何时目标已达成以及何时结束项目取决于项目经理。用于在系统上获取额外权限的工具并没有明确定义，这使得知道对目标系统还可以采取什么措施变得更加困难。直到现在，工具的选择相当显而易见——信息收集使用互联网，漏洞识别使用端口扫描器，漏洞验证使用利用脚本（无论是手动启动还是从应用程序启动）。权限提升是一个过于宽泛的任务，因为可以使用许多方法实现\
  \ root 访问。提升权限的一种战术包括从内部视角寻找系统中额外的漏洞。如果我们获取了系统的*任何*访问，即使该访问具有有限的授权，我们也可能能够利用只有作为登录用户时才能访问的漏洞。外部防御通常比内部控制更强。如果我们能获得系统的任何访问，即使权限级别较低，我们也可能从内部攻破该系统。另一种获取高权限的战术是在网络上监听敏感数据，包括用户名和密码。如果我们能监听目标系统进出的所有流量，我们可能捕获到一段允许我们以更高权限访问系统的数据（例如管理员密码）。一种获取高权限的非常有效的策略是社会工程学。直接要求帮助台员工授予对目标系统的访问，可能比运行许多利用脚本更快、更容易。还有其他可用于克服网络防御的社会工程策略，包括使用邮件附件、窥视、对服务器的物理访问以及翻垃圾桶。直到为止，我们还没有在渗透测试中包含无线攻击。我们将在本章中介绍无线攻击。有些技术可以捕获无线流量并利用这些捕获的数据获取对网络的未经授权访问，即使使用了无线数据加密。\n\
  \n# 系统枚举\n\n如果我们通过漏洞获取了系统访问权限，就可以利用该访问来收集敏感信息，例如财务数据、配置信息、个人记录或公司机密文件。如果我们能够访问敏感信息，这可能足以认为渗透测试是成功的。在渗透测试项目中，只有比获取敏感数据更好的事情——获取系统的管理员访问权限。让未经授权的用户在关键服务器上获得管理员权限对于大多数系统管理员来说是一场噩梦——但对于大多数渗透测试工程师来说是一个荣誉勋。一旦我们通过漏洞获得系统访问权限，就可以搜索可能存在利用漏洞的内部应用程序。那些漏洞可能会授予我们高权限，包括管理控制。\n\
  \n## 内部漏洞\n\n在第 11 章中，我们使用 CORE IMPACT 演示了针对 pWnOS 服务器的漏洞利用。在 във利用中，我们获得了针对用户 `obama`\
  \ 的远程 shell 访问权限。练习 11.1 使用在 [www.milw0rm.org](http://www.milw0rm.org) 上的利用脚本重建了该示例，再次在不需要身份验证的情况下以\
  \ `obama` 用户身份获取系统访问。一旦我们获得了系统访问，就可以搜索可能存在利用漏洞的内部应用程序。那些漏洞可能会授予我们高权限，包括管理控制。\n\n\
