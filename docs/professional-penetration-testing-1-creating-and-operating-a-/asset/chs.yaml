  \n## 边界网络识别\n\n在大型组织中，渗透测试期间，你经常会作为目标范围的一部分遇到非军事化区（DMZ）。从简单的定义来说，DMZ 通常是直接连接到互联网的网络，并在互联网和公司网络之间提供缓冲区。其核心思想是你需要弄清楚是否可以渗透\
  \ DMZ 的防御并突破到公司网络。渗透测试人员面临的问题在于识别你的目标网络从哪里开始，以及连接目标到互联网的基础设施在哪里结束。尽管这听起来很有道理，但实施起来要困难得多。你必须小心选择的目标系统，以免攻击了不属于你客户的系统。通常认为客户会为你提供他们控制的所有系统的\
  \ IP 地址，但出现疏漏并不罕见，例如系统被添加到网络中但没有更新记录。如果你发现了这些“被忽视”的系统，那么在打补丁方面它们也可能被忽视了，这可能会让你的网络利用工作变得容易得多。在图\
  \ 9.25 中，我们看到了对目标系统——[Insecure.org](http://Insecure.org) 的 `traceroute` 结果。注意，有几个不同的域名我们需要进一步调查：`us.Above.net`\
  \ 和 [sv.Svcolo.com](http://sv.Svcolo.com)。图 9.26 和 9.27 显示了 `Above.net` 和 `Svcolo.com`\
  \ 的 `whois` 信息。我们就能发现这些系统并不属于 [Insecure.org](http://Insecure.org)。如果我们进一步调查这些域名，会发现\
  \ `Above.net` 提供连接，而 `Svcolo.com` 提供服务。\n\n| ![B9781597494250000142/f09-25.jpg is\
  \ missing](img/f09-25.jpg) |\n| --- |\n| 图 9.25. |\n| Traceroute Insecure.org |\n\
  \n| ![B9781597494250000142/f09-26.jpg is missing](img/f09-26.jpg) |\n| --- |\n|\
  \ 图 9.26. |\n| 关于 Above.net 的信息 |\n\n| ![B9781597494250000142/f09-27.jpg is missing](img/f09-27.jpg)\
  \ |\n| --- |\n| 图 9.27. |\n| 关于 Svcolo.com 信息 |\n\n让我们看看一些有趣的东西，在图 9.28 中，我们对某些东西进行了\
  \ `traceroute`。对 `66.249.94` 执行 `whois` 命令可以发现它属于 [Google.com](http://Google.com)。\n\
