  \ XP、`MSDE 2000 Release` 和 `.NET Framework v1.1`。\n2. `Hacme Bank` 模拟真实的在线银行，可以使用\
  \ SQL 和 Web 攻击进行利用。最低系统要求是 `.NET Framework v1.1`、`IIS`、`MSDE` 或 `Microsoft SQL Server\
  \ 2000` 以及 `Internet Explorer 6.0`。\n3. `Hacme Shipping` 模拟在线物流应用，可以使用 SQL、跨站脚本和原生漏洞进行利用。安装该场景的系统要求包括\
