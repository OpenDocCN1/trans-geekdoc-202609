  \ CISSP, RSA CSP, CCSP, CCNP, CCIP, CCNA, CCDA, INFOSEC Professional, Cisco WLAN\
  \ Support/Design Specialist, DCASI, DCASD) 目前担任 MSN Communications 的高级网络安全架构师。Jan\
  \ 专长多种技术的设计和售后实施，包括虚拟专用网络 (VPN)、入侵防御系统/入侵检测系统 (IPS/IDS)、局域网/广域网 (LAN/WAN)、防火墙、内容网络、无线和互联网协议语音\
  \ (VoIP)。除了网络设计和工程之外，Jan 的背景还包括开源应用和 Linux 方面的丰富经验。Jan 已为 10 多本 Syngress 著作做过贡献，涵盖无线、VoIP、安全、操作系统和其他技术领域。\n\
  \n\n\n\n## 致谢\n大多数人看书时，只会看到封面上的一两个名字，而从未意识到背后有许多人参与其中。这里是我的一份浅微的尝试，以感谢那些对本书的编写或在线培训课程开发做出贡献的人。\n\
  \n## 家人\n毫无疑问，本书开发团队中最有帮助、支持最大的成员是我的家人。如果没有我的妻子 Crystal 无遗留的支持，我投入在工作和教育中的所有时间都是不可能的。当我忙于事务时，她能够在幕后工作支持家庭（包括我们的两个女儿），这种能力值得认可。我们长女患有自闭症，这一事实让生活变得复杂；但\
  \ Crystal 一直提供着坚定不移的支持。为了她所做的一切，这本书献给她。我的父母对我一生的进步也产生了非常深远的影响。没有他们的支持和关怀，这一切都是不可能的。我将不断努力做我父亲的一半，并像我母亲那样体怀他人——他们树立了非常高的标准，我感激他们所做的一切。\n\
  \n书中的材料并非为了成书而准备。DVD 中包含的课程是作为在线课程开发的，但这本书是在线培训课程成功的直接结果。如果没有两位非常有才华的人士——Aaron Follette\
  \ 和 Jason Rohman 的支持，这种成功是不可能的。这两个个人在开发在线课程方面付出的努力，理应我在书中这一简短章节中无法给予的更多认可。他们不仅是我的极好朋友，还勤勤工作，帮助\
  \ [Heorot.net](http://Heorot.net)取得了成功。\n\n## 侧影\n两个人对本书的开发产生了影响——Jeff Langr 和 Nathan\
  \ Farrar。Jeff Langr 是迄今为止我见过的最好的项目经理和程序员。他的知识以及帮助他人学习的天生欲望极具启发性，我无法对他在编程领域已出版的贡献，以及对我个人职业和写作提供的实际帮助赞誉之加。Nathan\
  \ 是写作过程中不可或缺的一部分，我非常感谢他的帮助和热情。他是一个最近毕业并已投身更好事业的年轻人，毫无疑问，他的成就将使我的成就相形见�。祝他的职业生涯顺利。在结束之前，我必须感谢\
  \ DC303 夺旗赛（CTF）团队，多年来我有幸与他们一起“参与”。我被他们的技能所震撼，并期待我们真正赢得 DefCon CTF 比赛的那一天。\n\n##\
  \ 前言\n这本书与大多数书籍不同，因为它讨论了从构思到完成的专业渗透测试。我们并不仅仅关注信息系统漏洞的识别和利用，在本书结束时，我们将检查专业渗透测试的所有方面，包括项目管理、组织结构、团队建设、职业发展、指标、报告、测试数据归档方法、风险管理和培训……*此外还有*……信息收集、漏洞识别、漏洞利用、权限提升、维持访问以及掩盖踪迹。使这本书与众不同的第二个因素是包含了两个视频课程，旨在教授基础和中级信息系统渗透测试技术。这些课程作为在线培训课程开发，并通过\
  \ [Heorot.net](http://Heorot.net) 提供，针对的是经验丰富和初级渗透测试从业人员。课程为学习者提供了实践经验，以便他们将渗透测试的理论知识转化为现实世界的技能。本书的第三优势是上述的实践经验。随附的\
  \ DVD 包含了创建渗透测试实验室所需的一切，包括模拟真实服务器的目标系统。目标系统是专为在渗透测试实验室中进行攻击和黑客入侵而设计的，并提供了不同水平的复杂性和难度。对于那些不熟悉渗透测试技术的人来说，书中的目标系统提供了一个渐进的学习曲线，将同时挑战初学者和专家。Heorot.net\
  \ 网站应被视为本书的延伸。论坛部分对书中介绍的所有主题以及 De-ICE 挑战有许多讨论。新的 LiveCD 正在开发中以挑战技能，并正在添加教程视频。请利用这些共享的知识。如果你对本书、其内容或\
  \ Heorot.net 网站有任何问题或建议，请随时通过 twilhelm@heorot.net 直接与我联系。阅读愉快！\n\n## Setup\n对经验丰富的信息系统和网络渗透测试员的需求日益增长，已超过了整个信息技术（IT）行业渗透测试人员的能力。提供专业渗透测试相关课程的会议、训练营和大学数量不断增加；但他们无法跟上法规和客户压力，这些压力迫使公司增加其基础设施内渗透测试的数量和范围。复杂的是，渗透测试职业的道路一直很长。直到最近，唯一能够贡献渗透测试项目的是那些在系统安全领域拥有多年经验的人。然而，随着该专业变得更加成熟，教育和研究机构已开始完善信息系统安全领域内的攻击方法和技术。今天，专业渗透测试正在教授刚刚进入\
  \ IT 行业的年轻专业人士，公司正在聘佣没有实际经验的学生。本书分为三部分——设置（Setting Up）、运行渗透测试（Running a PenTest）和总结（Wrapping\
  \ Everything Up）。在书的第一部分，我们将讨论渗透测试团队中的专业人员以及成为有效团队成员所需的技能。更重要的是，我们将创建自己的渗透测试实验室，以便我们可以将理论知识转化为实践经验。章节末尾包含了练习，旨在基于书中课程的基础上进行学习。渗透测试不仅仅是攻击和攻破系统。在本书的第一部分中，我们将讨论项目管理如何是成功渗透测试项目的不可或组成部分。我们将查看项目中的不同阶段，并识别渗透测试工程师介入流程的领域。通过理解从构思到完成的渗透测试项目，工程师可以更好地理解自己在支持客户业务目标中的角色。理解渗透测试项目中的独特挑战和机会不仅限于渗透测试工程师。从未参与过专业渗透测试的经理和利益相关者需要理解有助于项目成功结束的不同角色、职责和流程。本书的第一部分将检查工程师和管理层准备专业渗透测试所需的步骤。\n\
  \n\n\n\n\n没有技能，武力也无用武。—— 俄罗斯谚语：*“技能能完成武力无法实现的事情。”* (Mertvago, 1995) 市场上有大量的书籍讨论如何使用各种“黑客”工具，其中我在一些书籍中也撰写过章节。然而，专业的渗透测试并非完全取决于工具——它需要超越仅仅理解如何使用工具的技能，包括对项目管理的知识、对方法论的理解与遵循，以及对系统和网络架构设计的理解。本书的主要目的是让读者对渗透测试的所有方面有深入的理解，而不是简单地讨论在何时使用何种工具。本书和随附的\
  \ DVD 设计旨在用于多种不同的方式。其初始意图是提供一个正式的渗透测试培训计划。DVD 包含了视频课程，这些课程已用于教授如何使用当前的 `PenTest`\
  \ 方法论并将这些方法论应用于渗透测试中。此外，本书也可用于技术课程——无论是教育机构还是“训练营”活动——为读者提供一种通过使用个人 `PenTest` 实验室，以受控且安全的方式学习使用各种黑客工具的方法。本书最终目标是让管理层了解专业渗透测试中发生了哪些工程活动、需要报告什么、如何获取指标、监控质量、识别风险以及其他关键流程，以便管理层能够为成功完成\
  \ `PenTest` 提供必要的资源、培训和资金。本书并非关于所有渗透测试相关主题的完整参考书；而是一份从构思到结论执行专业渗透测试的指南。针对书中讨论的每个主题都有专门的著作介绍，这将要求我们通过其他来源来扩展知识。为了加速学习过程，每章中都提供了实操练习，其编写方式将有助于定位权威来源并扩展读者的技能。DVD\
  \ 的另一个特点是它包含了几个服务器镜像（以 `LiveCDs` 或虚拟机 `VM]` 镜像的形式存在），这些镜像可用于渗透测试实验室。这些 `LiveCDs`\
  \ 专门设计用于模拟可被利用的真实服务器，以便我们能够安全、合法地练习视频课程和书籍中学到的技能。书和视频中的示例都引用了这些 `LiveCDs`，读者在搭建好自己的渗透测试实验室后，可以完全按照材料中所展示的内容进行操作。\n\
  \n# 关于本书\n\n本书与大多数书籍不同，在于你通过两种媒介学习渗透测试主题。第一种是纸质材料，第二种是随附的 DVD。从头到尾阅读纸质材料，为读者提供了一种系统学习如何专业地进行渗透测试以及成功完成\
  \ `PenTest` 需要哪些管理和工程技能。DVD 包含了两个不同的视频课程，这些课程已用于向全球学生教授基础和中级渗透测试技能。尽管 DVD 可以脱离书籍独立使用，但\
  \ DVD 中的材料和书中的内容互为补充，应当结合使用。DVD 还包含服务器的 `LiveCD` 镜像，可以作为学习平台，以便我们加强书中或视频中涵盖的内容。\n\
  \n## 目标读者群\n\n有三类人可以通过阅读本书并完成每章末尾的练习获益：\n- 渗透渗透测试领域的新手\n- 想要提高当前 `PenTest` 流程“能力成熟度”的专业渗透测试人员\n\
  - 试图理解如何进行渗透测试的管理人员\n\n对于专业渗透测试的新手来说，应该已经掌握了计算机系统或网络设备的知识——渗透测试领域并非信息技术（IT）中的入门职位，因此对计算机系统及其支持的网络先验知识是必要的。虽然本书将涵盖与\
  \ IT 相关的主题，包括协议和系统配置，但其目的并非指导读者网络中所使用的通信机制。具有 IT 经验的人可以在本书中使用个人知识作为基础，来学习渗透测试特有的挑战，以及如何在组织内部或为客户进行渗透测试。我们这些执行过或参与过渗透测试的人会明白，工具并不是成功完成\
  \ `PenTest` 的唯一必要条件。方法论对于确保评估员识别客户网络中的所有漏洞至关重要。本书和 DVD 上的中期视频课程可将方法论整合到 `PenTest`\
  \ 项目中，并让读者理解 `PenTest` 工程师在整个项目中的角色。新接触渗透测试项目的项目经理经常面临着与其他 IT 项目（如应用和工程项目）中发现截然不同的挑战。对项目管理和渗透测试领域内挑战的坚实理解，对于成功结束专业渗透测试至关重要。本书为负责监督\
  \ `PenTest` 的项目经理提供了有益信息，并讨论了将正式项目管理框架与渗透测试相关方法论相结合的方法。\n\n## 如何使用本书\n\n\n\n\n虽然本书和练习可以独立使用，但其设计初衷是配合附带的\
  \ DVD 使用。每个章节中的示例经常使用 DVD 中的材料，读者可以使用这些材料在实验室中重复示例。每章末尾都包含练习题，用于扩展对该章节主题的理解。本书的章节分为三个不同的部分：\n\
  \n### 第一部分 (#B978159749425000004X.xhtml#B978-1-59749-425-0.00004-X)\n涵盖了与搭建渗透测试（PenTest）实验室相关的主题，以及渗透测试专业领域必备的知识，包括伦理、方法论、指标和项目管理。以下章节包含在第一部分中：\n\
  - **伦理与黑客行为**：讨论针对渗透测试的伦理和法律\n- **作为职业的黑客技术**：识别职业路径、认证以及可以协助职业发展的安全组织信息\n- **搭建你的实验室**：设计企业或私人的渗透测试实验室\n\
  - **在实验室中创建和使用渗透测试目标**：在渗透测试实验室中使用现箱型场景和真实目标\n- **方法论**：研究专业渗透测试项目可用的不同方法论\n- **渗透测试指标**：识别将指标应用于渗透测试项目中发现的漏洞的不同方法\n\
  - **渗透测试管理**：解释影响渗透测试成功的团队成员、角色和组织结构\n\n### 第二部分 (#B9781597494250000130.xhtml#B978-1-59749-425-0.00013-0)\n\
  论述了实际的渗透测试，并引导读者使用经过评审的方法论，通过不同步骤检查目标系统和网络以寻找漏洞和利用程序。\n- **信息收集**：收集目标系统的信息\n- **漏洞识别**：检查目标系统可能存在的漏洞\n\
  - **漏洞验证**：尝试利用发现的漏洞\n- **攻破系统与权限提升**：寻找“控制”系统的方法\n- **维持访问**：讨论如何留在被利用的系统中\n- **掩盖踪迹**：操纵系统以保持不被发现\n\
  \n### 第三部分 (#B9781597494250000208.xhtml#B978-1-59749-425-0.00020-8)\n通过讨论报告、数据存档和准备下一次渗透测试来完成渗透测试项目。\n\
  - **结果报告**：编写报告并核实事实\n- **数据存档**：保存渗透测试数据\n- **清理实验室**：保存实验室的配置和数据\n- **规划下次渗透测试**：识别培训需求并获取资源\n\
  \n每个章节都包含了针对工程师和项目经理的信息。在渗透测试书籍中加入项目管理主题，让工程师更好地理解工程师在项目中的角色。它也为项目经理提供了一个视角，了解项目工程师必须执行哪些任务才能按时且预算内成功完成项目。\n\
  \n对于那些刚进入渗透测试世界的个人来说，充分利用这本书和 DVD 价值的方法是从阅读书籍的第一部分开始。之后，在学习书籍的第二部分的同时，观看 DVD 上的基础课程视频。书籍的最后部分第三部分提供了对专业渗透测试其他主题的见解，但可以留到充分理解基础且读者准备好提升技能时再看。\n\
  \n具有渗透测试经验的工程师应该回顾书籍第一部分的材料以温故。。应仔细阅读第 6 章方法论，因为理解方法论对于中级视频课程至关重要。第二部分应仔细阅读，因为理解方法论对于中级视频课程至关重要。第三部分应仔细阅读，因为理解方法论对于中级视频课程至关重要。对于渗透测试的\
  \ DVD \n\n（注：原文此处存在多处重复的句子，翻译已根据语意进行了整合以确保逻辑连贯）。\n\n对于渗透测试世界的初学者，充分利用这本书和 DVD 价值的方法是从阅读书籍的第一部分开始。之后，在学习书籍的第二部分的同时，观看\
  \ DVD 上的基础课程视频。书籍的最后部分第三部分提供了对专业渗透测试其他主题的见解，但可以留到充分理解基础且读者准备好提升技能时再看。\n\n具有渗透测试经验的工程师应该回顾书籍的第一部分的材料以温故。应仔细阅读第\
  \ 6 章方法论，因为理解方法论对于中级视频课程至关重要。第二部分和第三部分应仔细阅读，以便工程师更好地理解自己在渗透测试项目中的角色。\n\n（此处重复）\n\
  \n# 关于 DVD\n\nDVD 包含了以下材料：\n- Heorotnet 提供的视频课程\n  1. 渗透测试基础课程 (HPTF)\n  2. 渗透测试高级课程\
  \ (HIPT)\n- 渗透测试中使用的服务器镜像\n  1. `De-ICE Livecds`——提供不同难度的黑客挑战；旨在模拟真实世界的漏洞\n  2.\
  \ `pWOS`——使用 mil0rm.org 漏洞代码设计的服务器；旨在在虚拟机运行\n  3. `Hackerdemia`——用于学习渗透测试工具的 LiveCD\
  \ 平台\n  4. `WebGoat`——配置了多个 Web 漏洞的服务器；由开放 Web 安全项目 (OWASP) 开发维护\n  5. `BackTrack`——一个包含多个即用渗透测试工具的\
  \ LiveCD Linux 发行版\n\n## 参考资料\n\n\n\n`Hackerdemia` LiveCD 中包含了与网络和系统协议相关的信息，供快速参考。这些信息主要包括请求意见（`RFC`）文档，以及专业渗透测试中使用的工具。`Hackerdemia`\
  \ 磁盘还包含了有关如何使用书中提到的某些各种工具的教程，并被用于书中的示例。DVD 上还提供了与视频课程相关的参考资料，包括供快速参考的视频课程大纲和 PowerPoint\
  \ 幻灯片。视频中使用的方法可以在 `BackTrack` LiveCD 上找到。\n\n## LiveCDs\nLiveCD 和虚拟机（VM）镜像被用于书中和\
  \ DVD 视频课程中的示例。使用 LiveCD 而不是从零开始构建服务器为我们节省了大量时间，特别是当黑客尝试导致系统崩溃时。通过 LiveCD 或虚拟机镜像，只需快速重启系统或虚拟机即可在几分钟内将服务器恢复到原始状态。此外，使用\
  \ LiveCD 减少了渗透测试实验室对大量计算系统的需求。虚拟机的设计允许使用如 `VMware`、`Xen` 或 `Hyper-V` 等应用程序在宿主机上运行多个服务器。\n\
  \n### Hackerdemia\n`Hackerdemia` LiveCD 为练习渗透测试中使用的各种工具提供了一个目标。服务器镜像不包含任何已知的漏洞，但包含了大量会对探测和通信请求做出响应的服务。LiveCD\
  \ 包含一个 wiki，为查看者提供了教程，可以使用 `Hackerdemia` 服务器本身作为目标进行重复练习。\n\n## De-ICE\nDVD 上包含了三个\
  \ LiveCD 镜像，为我们提供了在现实服务器上发现渗透测试挑战。这些 LiveCD 是目标服务器，我们将使用它们来练习黑客技术，并遵循第 6 章 中讨论的方法论。其中两个\
  \ LiveCD 用于 HPTF 课程，并被认为是较易的挑战——`Disk 1.100` 和 `Disk 1.110`。另一个 LiveCD 用于 HIPT 课程，更具挑战性。`Disk\
  \ 2.100` 未在书中未使用，应在解决之前的挑战（包括 `pWnOS`、`WebGoat` 和另外两个 De-ICE 磁盘）后再进行尝试。De-ICE LiveCD\
  \ 挑战的解决方案未在 DVD 或书中提供，可以在 Heorot.net 论坛上找到。\n\n### pWnOS\n`pWnOS` 虚拟机镜像由 Brady Bloxham\
  \ 开发并维护，是一个 Linux 发行版，包含服务漏洞，可以使用 [www.milw0rm.org](http://www.milw0rm.org) 上的脚本进行利用。Brady\
  \ Bloxham 是布瑞根杨民大学的毕业生，曾在 `KPMG` 担任 IT 审计师，目前任职于 `USAF` 担任“网络战争专家”。`pWnOS` 虚拟机镜像用于学习如何发现漏洞以及如何使用代码利用发现的漏洞。\n\
  \n### WebGoat\nWebGoat 由开放应用安全项目（`OWASP`）设计并维护，该 Web 服务器包含 30 多个如何利用已知 Web 漏洞的示例和教程。`WebGoat`\
  \ 可以运行在多个平台上，包括 `Linux`、`Windows` 和伯克利标准发行版（`BSD`）。\n\n### BackTrack\n`BackTrack`\
  \ 是一个 Linux 发行版，预装了许多渗透测试工具，并作为 [www.Remote-Exploit.org](http://www.Remote-Exploit.org)\
  \ 的 LiveCD 形式提供。随附 DVD 中包含的是较旧的版本，特意包含该版本是因为复制书中和视频中示例所需的某些文件只能在 `BackTrack` 的版本\
  \ 1 和版本 2 中（特别是字典文件）找到。如果需要，可以从网上获取新版本。在现实渗透测试的大多数情况下，`BackTrack` 的早期版本已经足够了。\n\n\
  ## 总结\n在我们阅读书籍内容时，请记住本书的意图是提供渗透测试各个方面的信息——不仅仅是我们检查和攻击目标系统的部分。在渗透测试开始之前需要大量的准备，在结束时也会进行大量的活动。第\
  \ 1 部分 涵盖了如何准备渗透测试的基础知识，以及如何创建一个实验室来练习书中学习的技能。它还讨论了渗透测试人员的伦理和法律义务，以及为那些有意将渗透测试作为全职职业的人提供的专业路线图。第\
  \ 2 部分 带领我们完成了实际渗透测试中的步骤，并为工程师和经理提供了信息。第 2 部分 中讨论了不同的方法论，其中包含了 DVD 上的 LiveCD。在书的这一阶段，可以使用\
  \ HPTF 和 HIPT 课程来提高对方法论在成功的渗透测试中所作用的理解。\n\n\n\n法律不为无法法者制定。——俄罗斯谚语：*“法律不是为无法法者而写的。”*\
  \ (Mertvago, 1995) 在我教的一门课上，我问学生：“白帽客和黑帽客的区别是什么？”不可避免地，涉及到伦理问题。对于那些认为伦理是区分这两者的标准的人来说，答案是错误的（“正确”的答案是“许可”）。白帽客的一种定义包括在合同协议内执行安全评估的人，而黑帽则是对信息系统进行未经授权的渗透攻击的人。即使是黑帽有时也会表现出道德行为。看看阿德里安·拉莫（Adrian\
  \ Lamo）的历史，他告知受害者他渗透其网络的步骤，以及未来保护其网络免受入侵的方法。此外，拉莫在受害者网络内采取了非凡措施以防止数据或财务损失，并因在识别其\
  \ Web 呈现漏洞方面的贡献受到了许多公司的认可和感谢。这显示了拉莫强烈的伦理信念；唯一的问题是，他对伦理行为的定义与美国法律相悖，这最终导致他在 2004\
  \ 年被判定犯一项计算机犯罪。\n\n对于商界的大多数人来说，伦理是每年在强制性伦理培训期间遇到的烦恼，以无聊的 PowerPoint 幻灯片或单调的网络研播形式呈现。然而，对于我们这些自认为是白帽的人来说，我们不仅要理解职业的伦理约束，还必须积极推动信息安全社区内部伦理行为的改进。联邦和州政府试图通过法律要求（如《萨班斯-奥克斯莱法案》(SOX)\
  \ 和《健康保险流通性与责任法案》(HIPAA)）迫使美国企业采取伦理行为，但这种行动本身的效果微乎其微。信息安全伦理行为要取得真正的进展，需要将整个企业世界的强制性与社区支持性伦理要求相结合，包括管理支持结构以及设计和支持通信及数据基础设施的工程师。我已经提到了政府的努力，但社区支持体现在：作为获得或维持信息安全认证的条件，必须遵守并执行伦理要求，例如认证信息系统安全专业人员\
  \ (CISSP)，该认证将十个安全领域中的一个专门用于“法律、调查与伦理”。\n\n## 伦理准则\n\\[(ISC)²\\]\n■ 保护社会、公共和基础设施\n\
  ■ 以荣誉、诚、公正、负责和合法的方式行动\n■ 为委托人提供勤勉且胜任的服务\n■ 促进并保护行业\n\n我们社区对伦理的强调是一个需要不断解决的问题，因为它在我们作为专业人士的年度目标列表中，往往被忽视或被降级为脚注。不可避免地，在职业生涯中，我们会面临一个伦理抉择，并且必须做出正确的选择。遗憾的是，正确的选择往往不是最方便的选择。根据好莱坞的说法，人们决定违反伦理或法律规则的主要原因之一是钱。尽管媒体试图围绕这一同样的（简单化的）原因来定义计算机犯罪元素的活动，但要准确地定义什么构成了伦理或不伦理的黑客是非常困难的。部分原因是由于全球范围内关于网络犯罪法律的不断变化。更复杂的是，一个国家的法律与另一个国家的法律并不兼容；在某些情况下，它们甚至相互矛盾。由于这种情况，几乎不可能在所有场景下准确地定义伦理行为。我们讨论所能做的是谈论关于伦理的一些更普遍的共识以及描述不伦理行为的标签。我承认，这些定义相当模糊，实际上只有在媒体炒作恶意系统攻击时才会获益。然而，让我们谈谈它们吧。\n\
  \n## 为什么要保持伦理？\n\n尽管我暗示了金钱动机是一个成为犯罪犯过于简单的理由，但在执行渗透测试的背景下，金钱确实在选择加入黑客社区方面起了作用——现在，信息安全领域有很多钱可以赚。在这一部分，我们将讨论不同类型的计算机黑客以及他们在该领域中扮演的角色。\n\
  \n**注意**：我认为在这里有必要进行免责声明：我不是律师，强烈建议您在渗透测试项目之前（可能在期间）寻找律师。为了确保这部分正确而花费在律师身上的费用，远少于出问题后聘佣律师辩护您的行为的费用。\n\
  \n## 黑帽客\n\n在计算机安全中，黑帽是指那些对信息系统进行未经授权渗透攻击的人。尽管这种活动背后的原因从好奇到财务收益不等，但共同点是他们在未经许可的情况下这样做。在某些情况下，这些黑帽实际上位于其他国家，他们的活动并没有违反其所在国家的法律。然而，当他们的行为违反目标所在国的法律（取决于目标国家的政府机构）时，其行为可能仍被视为非法——更不用说黑帽使用分布在全球的多个服务器作为其攻击的代理。困难在于，当这些黑帽自己的国家认为他们的行为没有问题时，如何起诉他们。这种困难可以通过\
  \ 2001 年逮捕德米特里·斯克里亚罗夫（Dmitry Sklyarov）得到最好的说明。德米特里在抵达美国参加 DefCon 安全会议后被捕。他的逮捕与他破解电子书复制保护以及\
  \ Adobe 系统设计的加密方法有关。德米特里因违反《数字千年版权保护法案》（`DMCA`）被捕，该法案旨在防止人们寻找绕过或破解软件加密的方法。问题是，`DMCA`\
  \ 是美国的版权法，在德米特里进行和发布研究的俄罗斯是不具执行力的。尽管如此，FBI 在他在美国土地上逮捕了他。最终，所有指控都以他的证言作为交换撤销。在美国，德米特里的行为被认为是非法的，但在他自己的国家并没有此类禁止——他没有违反俄罗斯版权法的任何行为。事实上，随后关于德米特里努力的诉讼使他和他工作的公司得以清白。无论如何，德米特里的工作是在未经\
  \ Adobe 系统许可的情况下完成的，并且破坏了 Adobe 系统使用的复制保护方案，这确实符合黑帽的定义。那么这让德米特成为黑帽了吗？严格根据我们的定义，是的。但如果这不是非法的，为什么应该被认为是不恰当的行为？我将由你们来决定在德米特里的情况下这个标签是否合适。\n\
  \n**地下室笔记……**\n\n# 罪犯还是国家英雄？\n\n\n\n\n\n大量的犯罪活动正为了推动政治或宗教意识形态而进行。美国和德国指责中国对其军队和企业发动网络战争（Messmer,\
  \ 2000）；爱沙尼亚指责俄罗斯破坏了该国的通信基础设施（Bright, 2007）；韩国则指责北朝鲜进行网络战争（Leyden, 2008; 北朝鲜间谍软件针对韩国军队,\
  \ 2008）。你如何被看待取决于你处于政治意识形态立场的哪一方。还有其他一些问题使得这个问题变得更加复杂。存在一些例外，特别是在研究和学术领域。尽管有这些例外，公司仍威胁要起诉一些研究人员，而这些人员可能完全有权对软件公司使用的专有代码进行检查和测试。这种情况发生在\
  \ 2005 年，当时迈克尔·林（Michael Lynn）试图披露有关 `Cisco` 网络操作系统（`IOS`）内部漏洞的信息。迈克尔原计划在黑帽安全会议上讨论该漏洞。思科最终对这一主题表示异议，并威胁如果迈克尔在会议上展示他对该漏洞的发现，将采取法律行动。尽管达成了相反协议，迈克尔确实展示了他的发现，并随后被思科起诉。诉讼在法庭外和解，但迈克尔获得了一份永久禁令，禁止他讨论该漏洞或利用方法。再次，关于迈克尔的行为是非违法的、恶意的，还是通过让拥有\
  \ `Cisco` 设备的公司了解漏洞来提供帮助，存在疑问。这就是标签的问题所在——存在多种观点，并不像标签所暗示的那样简单。无论如何，这些标签被工业界和媒体用于描述合法和非法攻击系统的人员之间的冲突。让我们假设黑帽（Black\
  \ Hats）是指那些实施非法行为的人，如果被抓到就会入狱。这规避了“无罪直到原则”的整个哲学，但让我们暂且接受这一观点。过去一些著名的黑帽黑客在服刑或完成假释后，能够将不幸转化为丰收的职业生涯。在今天，这种通往名声和财富的快速通道几乎不存在了。一个值得浏览的网站是美国司法部网站上的“计算机犯罪与知识产权部门”（[`www.usdoj.gov/criminal/cybercrime/cccases.html`](http://www.usdoj.gov/criminal/cybercrime/cccases.html)）。在上面，你会找到当前的计算机犯罪案件列表，以及追溯到\
  \ 1998 年的案件。列表中包含了损害金额的估计（美元）以及对犯罪行为的惩罚。在那里，你将看到从 0 个月到 108 个月不等的惩罚（`U.S. versus\
  \ Salcedo et al.`，因意图入侵劳氏（Lowe's）计算机网络盗取信用卡信息）以及从 0 美元到 780 万美元不等的罚金（`U.S. versus\
  \ Osowski`，非法向自己发行 `Cisco` 股票的会计师）。是的，非法获利的可能存在；然而，被捕后相关的惩罚旨在震慑此类活动。随着时间的推移，越来越多的法律被加入，以使计算机犯罪的惩罚变得严厉得多。\n\
  \n## 白帽黑客\n\n白帽黑客的一种定义包括那些在合同协议内执行安全评估的人员。尽管这个定义在大多数情况下有效，但它并没有包含任何法律或伦理要素。与黑帽的定义相比，这种遗漏变得显而易见。然而，这是大多数人在谈论白帽时会想到的定义，并将将用于我们的讨论。就像在西部牛仔的电影一样，白帽黑客被认为是好人。他们与公司合作，在系统或网络层面提高其客户的安全态势，或者寻找可能被恶意或未经授权的用户使用的漏洞和利用方法。希望是，一旦白帽发现了漏洞或利用方法，公司就会降低风险。关于谁更有能力——黑帽黑客还是白帽黑客，一直存在争论。论点大致如下：黑帽黑客拥有优势，因为他们不需要遵守任何行动规则。尽管这听起来很有道理，但有些问题被忽视了。最大的问题是教育。发现发现大多数白帽黑客受雇于有培训预算的公司，或鼓励员工在职期间学习黑客技术的公司，并不罕见。这赋予了白帽相对于黑帽的巨大优势。这些培训机会中的许多包含了恶意黑客渗透企业网络时所使用的最新技术。此外，那些受雇于大型组织的白帽黑客可以获得黑帽无法拥有的资源。这可能包括使用尖协议和设备的复杂架构、新技术，甚至是研发团队。尽管有这些优势，白帽黑客在活动期间往往会受到限制。许多攻击可能会导致系统崩溃，或者更糟糕的是数据丢失。如果这些攻击是针对真实系统进行的，公司可能会轻易失去收入和客户。为了防止此类损失，白帽必须对他们做的事情以及如何做非常谨慎。通常情况下，只有最细微的扫描或攻击可以用于生产机器，而更具侵略性的扫描则被分配到测试网络，而测试网络通常无法真实模拟现实世界。这还是假设测试网络确实存在。发现某些生产系统的成本之高，以至于为了测试网络而进行多次购买在经济上是不可行的并不罕见。在这些情况下，白帽很难知道系统漏洞或可利用性的真实程度。从财务角度来看，专门从事信息安全是有益的。薪水持续上涨，因为联邦对审计和安全评估的要求迫使许多公司寻找具有进行有效渗透测试独特能力的人才。公司满足于基础的\
  \ Nessus 扫描而别无他的时代已一去不返。今天，安全专业人员的需求很大，公司意识到安全不仅仅是防火墙或防病毒软件，而是一个涉及安全策略、培训、合规性、风险评估和基础设施的生命周期。\n\
  \n## 灰帽黑客\n\n\n\n\n我们已经讨论过尝试为该行业内的人员划分标签的问题。由于这种困难，产生了一个新的标签，作为某种通用的统称。`Gray Hat`（灰帽）这一术语旨在包含那些通常在法律范围内活动，但可能会稍微触及边界的人。那些对专有软件代码进行反向工程，且无意通过其努力获得财务收益的人往往被归入此类。。许多人认为是\
  \ `灰帽` 的一个例子是约翰·约翰森（Jon Johansen），也被称为 `DVD Jon`。约翰因为反向工程 DVD 内容混淆系统（其目的是防止 DVD\
  \ 复制）而闻名。约翰在挪威法院系统被捕并接受审判，结果发现他的活动并非非法，他被判定没有违反版权法或挪威国家法律。\n\n## 工具与陷阱……\n\n# 你可能已经犯了计算机犯罪\n\
  \n定义什么是计算机犯罪的法律正在不断变化。遗憾的是，有时法官也不理解技术，正如“Sierra Corporate Design, Inc. 诉 David Ritz”案所示（在\
  \ Sierra Corporate Design v. Falk）中），法官裁定进行域名系统（DNS）区域传输（在计算机上运行 `host -l`）构成了刑事活动。有时，看起来你似乎无法不犯法。\n\
  \n## 伦理标准\n\n人们一直在努力将信息安全专员的伦理责任法典化，以便雇主和聘用承包商的人了解在渗透测试期间机密数据将如何被处理。根据你的认证/地点/所属机构，这些标准可能部分适用于你，或者完全不适用。重要的是要理解，每项标准都试图解决一个问题或感知到的威胁。在国际组织的情况下，这种威胁通常是个人隐私，而不是公司隐私。\n\
  \n# 认证\n\n正如章节开头提到的，许多信息安全认证现在都包含了获得和维持认证的伦理要求。最广为人知的认证之一 `CISSP` 对其成员有以下要求，按重要性排序如下\
  \ `(ISC)²]`：1. 保护社会、公共和基础设施 2. 以荣誉、诚实、公正、负责和合法的方式行动 3. 为委托人提供勤勉且胜任的服务 4. 促进和保护行业。国际信息系统安全认证联盟\
  \ `(ISC)²` 对于其成员应当如何表现提供了额外的指导，但上述四项准则提供了一个高级的强制性规范。尽管这些被认为是高层级的，但如果 `(ISC)²` 发现成员违反了四项准则中的任何一项，可以剥夺该成员的认证。虽然这看起来可能并不重要，但如今的许多政府工作都需要\
  \ `CISSP` 认证才能就业。SANS 学院有其自己的信息技术（IT）伦理版本，分为三个大规则（`SANS Institute, 2004`：1. 我将努力了解自己，并对自己的能力保持诚实。2.\
  \ 我将以这种方式开展，确保 IT 行业被视为具有诚信和专业精神的行业。3. 我尊重隐私和机密。）\n\n## 承包商\n\n在信息安全行业内，没有许可机构或监督委员会来管理渗透测试员的行为和标准。正因如此，除了法律系统之外，客户没有其他途径来纠正错误行为。我确定我们都都听过这样的故事或见过这样的情况：一家公司委托进行网络风险评估，结果得到的只有\
  \ `Nessus` 扫描结果。我必须承认，亲眼目睹这些令人沮丧。时代在变，但并没有变太大。仍然有“人士”进行渗透测试，但他们的技能水平太低，以至于让公司感到安全这反而是在损害公司，因为存在着缺乏经验的渗透测试员根本无法发现的明显安全漏洞。这就是为什么出现了许多围绕信息安全甚至黑客攻击的各种认证。行业内有一种希望，即公司会将伦理行为与能够证明自己拥有此类认证的专业渗透测试员联系起来，特别是那些带有为了维持认证而必须遵守的伦理政策的认证。我不确定该行业是否会保持现状，或者是否会有那么一天，人们必须获得执照并通过考试才能自称为专业渗透测试员。老实说，我不确定这能否解决任何问题。然而，客户眼中的许多神秘色彩已经消失了，他们开始理解渗透测试是如何以及为什么要这样工作的，并越来越意识到什么是良好的渗透测试工作。这比任何事情都能提高渗透测试员的伦理行为。目前，施加在专业渗透测试员身上的唯一伦理标准是他们自己采纳的标准。\n\
  \n## 雇主\n\n几乎每家公司都有伦理标准政策。它可能不直接涉及信息安全，但通常写得很高层，以涵盖业务活动期间所有活动的行为。公司在聘用承包商时，要求承包商遵守其自身的伦理政策这并不稀奇。正如我上面提到的，承包商没有任何可以规定其行为的东西。当然，某些认证和组织关系强制接受某些伦理标准，但它们没有任何法律权威可以强制承包商遵守它们。如果你雇佣了承包商或雇某人在组织内工作，请确保在合同中加入一项接收方义务的条款，规定他们已阅读并将遵循贵公司的信息安全政策和伦理标准。到那时，如果他们没有做到，你可以对他们采取法律行动。\n\
  \n**警告** 太多次安全政策写得很有威慑力，但当有人违反政策时，管理层缺乏行动使得任何政策都变得无力。对于任何政策的有效性，都需要高层的支持。如果政策不被执行，就不应该被制定。只需确保你的政策和标准是以清晰定义不当行为的方式编写的——如有必要咨询律师，但不要假设从互联网上下载的东西具有执行力，甚至是连贯的。\n\
  \n## 教育与机构组织\n\n许多机构制定了自己的伦理标准，使该组织的成员身份取决于对这些伦理标准的接受。这种努力是为了填补前面提到的缺乏许可机构或监督委员会的空白。这些机构在提高信息安全伦理标准方面的努力应该受到表扬和支持。以下列表并非详尽。\n\
  \n### 信息系统安全协会 (ISSA)\n\n\n\n\n\n`ISSA` 是一个非营利组织，致力于促进信息技术领域的安全与教育。成为会员需要需要遵守一套伦理准则，该准则规定了如下（信息系统安全协会,\
  \ 2009）：\n\n-   根据所有适用法律和最高伦理原则履行所有专业活动和职责。\n-   推广广泛公认的信息安全当前最佳实践和标准。\n-   对在专业活动过程中遇到的专有或其他敏感信息保持适当的机密性。\n\
  -   以勤勉和诚实的态度履行专业责任。\n-   避免任何可能构成利益冲突或以损害雇主、信息安全专业领域或协会声誉的活动，且\n-   不故意伤害或诋毁同事、客户或雇主的专业声誉或执业行为。\n\
  \n### 互联网活动委员会 (IAB)\n\n`IAB` 将任何符合 (RFC 1087) 的活动视为不符合道德的行为。这是一份没有约束力的出版物，旨在为 `IAB`\
  \ 成员在开发意见征求（`RFC`）和互联网标准期间提供一套伦理指南（网络工作组, 1989）：\n\n-   试图未经授权地访问互联网资源。\n-   干扰互联网的预期用途。\n\
  -   通过此类行为浪费资源（人员、带宽、计算机）。\n-   破坏基于计算机信息的完整性，和/或\n-   侵犯用户隐私。\n\n### 电气与电子工程师学会\
  \ (IEEE)\n\n`IEEE` 是一个非营利协会，其成员还必须遵守下列的一系列标准（IEEE, 2006）：\n\n1.  接受承担做出与公众安全、健康和福祉一致决策的责任，并及时披露可能危害公众或环境的因素。\n\
  2.  尽可能避免实际或感知的利益冲突，并在冲突确实存在时向影响方披露。\n3.  在根据可用数据陈述主张或估算时保持诚实和现实。\n4.  拒绝任何形式的贿赂。\n\
  5.  加强对技术及其恰当应用以及潜在的理解。\n6.  维护并提高我们的技术能力，并仅在通过培训或经验获得资质，或在充分披露相关局限性后，为他人承担技术任务。\n\
  7.  寻求、接受并对技术工作提出诚实的批评，承认并纠正错误，并正确归功他人的贡献。\n8.  公平地对待所有人，无论其种族、宗教、性别、残障、年龄或国籍等因素。\n\
  9.  避免通过虚假或恶意行为伤害他人的财产、声誉或职业。\n10. 协助同事和同伴进行职业发展，并支持他们遵循本伦理准则。\n\n### 经济合作与发展组织\
  \ (OECD)\n\n1980 年，人们曾努力在欧洲建立一个统一且全面的数据保护系统。`OECD` 为跨国个人数据提供了以下指南（[www.privacy.gov.au/publications/oecdgls.pdf](http://www.privacy.gov.au/publications/oecdgls.pdf)；经济合作与发展组织）：\n\
  \n-   **收集限制原则**：个人数据的收集应有限制，任何此类数据都应通过合法公平的手段获得，并在适当情况下经数据主体知情或同意后获得。\n-   **数据质量原则**：个人数据应与其使用的目的相关，并在实现这些目的的必要范围内，保持准确、完整并定期更新。\n\
  -   **目的明确原则**：收集数据的目的应在收集时或更晚明确规定。\n-   **使用限制原则**：个人数据不应用于所规定目的之外的披露、提供或其他使用，除非：\n\
  \    a)获得数据主体的同意\n    b)法律授权\n-   **安全保障原则**：个人数据应受到合理的安全措施保护，防止未经授权的访问、破坏、使用或泄露。\n\
  -   **开放原则**：关于数据的开发和做法应有一个通用的开放政策。\n-   **个人参与原则**：个人应有权：\n    a) 向数据控制者获取其是否拥有其个人数据的确认；\n\
  \    b) 要求数据控制者就其有关数据，\n        i) 在合理时间内\n        ii) 以不合理的费用（如有任何）\n        iii)\
  \ 以合理的方式\n        iv) 以易于理解的形式\n    c) 如果根据第 (a) 和 (b) 项的要求被拒绝，有权对拒绝提出挑战；\n    d)\
  \ 若挑战成功，有权要求删除、纠正或修订其数据。\n-   **问责原则**：数据控制者应对遵守落实上述原则的措施负责。\n\n\n\n\n民法旨在纠正针对个人或组织的错误，这些错误导致了某种损失或损害。被判定违反民法的人不会被监禁，但可能被要求提供经济赔偿。属于此类信息的安全相关法律包括专利、版权、商业秘密、商标和保修。\n\
  \n### 刑法\n刑法旨在纠正针对社会的错误。被判定违反刑法的人不仅可能被监禁，还可能被要求提供经济赔偿。本章稍后列出的许多计算机犯罪类型都属于此类。\n\n\
  ### 行政法/监管法\n监管法旨在纠正政府机构、组织、官员以及这些组织或机构人员的行为。与刑法类似，处罚可以包括监禁，或要求提供经济赔偿。监管法的示例包括法定代码，例如\
  \ `Title 12`（银行与银行业）和 `Title 15`（商业与贸易）。其他可能影响渗透测试的法律还包括普通法和习惯法。在开始项目之前，了解可能影响项目的所有法律至关重要。\n\
  \n## 计算机犯罪与攻击类型\n当你进行渗透测试时，必须完全改变你的思维方式。当你攻击网络时，必须考虑你可能执行的所有犯罪活动以及你将如何设此类任务。通过置身于恶意黑客的思维中，你开始以不同的方式看待威胁；这允许你在项目报告阶段向客户展示最坏的情况。\n\
  \n* **拒绝服务**：几乎所有系统都容易受到拒绝服务攻击。这可能导致带宽问题、处理能力问题，甚至由于软件设计不当导致资源枯竭。\n* **信息的破坏或篡改**：一旦恶意用户获取了你的数据，你如何知道哪些被更改了而哪些没有？篡改信息的成本通常比简单的破坏要贵得多。\n\
  * **翻垃圾桶**：虽然从垃圾桶里拿垃圾本身通常并不违法（除非是在私人财产上，且有反侵入警告，在大多数情况下如此），但人们偷垃圾并不是仅仅因为可以这样做。他们这样做是为了获取可以用于伤害的信息。无论是简单的姓名和电话列表，还是在落入错误的人手中更危险的东西（如客户或隐私数据），翻垃圾桶都是恶意攻击中一个非常有效的初始步骤。\n\
  * **辐射窃听**：在冷战期间，人们有一种真实的担心，即外国可以通过获取终端无意中广播的射频（RF）信号数据来监视美国。尽管今天的大多数设备产生的射频噪声非常少，但无线网络的使用正在巨大增长。窃听无线通信是所有组织都应该关注的问题。\n\
  * **挪用资金**：某些犯罪将永远流行，挪用就是其中之一。问题是，计算机的引入使得挪用更容易被隐藏，因为一切都是“0 和 1”。在识别财务数据修改方面已经取得了巨大进步，但应用程序背后的代码强度取决于开发者将其编写到什么程度。我们都知道，没有所谓的完美安全代码。\n\
  * **间谍活动**：无论是在竞争国家之间还是竞争公司之间，间谍活动都是一个常青的问题。在国家层面，遭受间谍活动会严重损害公民的安全和利益。在公司层面，间谍活动可能导致一家公司财务破产。\n\
  * **欺诈**：与计算机犯罪，欺诈通常与假拍卖有关。从渗透测试的角度来看，欺诈可以包括网络钓鱼、跨站脚本和重定向。\n* **非法内容**：一旦恶意用户获取了系统的访问权限，他们有很多选择来利用该系统为自己牟利。这可能是盗版软件、音乐或电影的形式。\n\
  * **信息战**：许多政治组织希望尽一切可能的手段传播他们的信息，以破坏国家的信息架构。信息战有许多形式，从简单的网页篡改到对军事系统的攻击。\n* **恶意代码**：病毒和蠕虫每年花费数十亿美元。恶意代码的创建和分发由于各种原因产生——从寻求刺激到有组织的犯罪活动。\n\
  * **伪装**：这是通过假装成别人来实现的——即一个比恶意用户可能具有更高访问权限的人。这可能发生在系统级别。\n* **社会工程**：这种技术通常是获取数据最简单、最有效的方法。通过利用自己的社交技巧，人可以让别人透露他们不应该透露的信息。问题是大多数人都乐于提供帮助，而社会工程可以利用这种乐于助的需求。\n\
  * **软件盗版**：软件开发者和所有者希望通过为大众提供有用且高效的软件来获得报酬。软件盗版破坏了他们的盈利能力，并在许多国家是违法的。\n* **IP 地址欺骗**：IP\
  \ 协议（IP）地址欺骗通常用于规避检测或隐藏源点。它还可用于访问使用 IP 地址作为安全过滤形式的系统。\n* **恐怖主义**：大多数人在想到恐怖主义攻击时会想到炸弹。然而，互联网和网络已成为我们日常业务不可或缺的一部分，对通信基础设施的攻击可能对国家公民产生相同甚至更大的影响。它可能没有晚间新闻中看到的爆炸那样的视觉冲击，但如果目标是瘫痪一个国家，通信基础设施无疑是一个目标。\n\
  * **密码窃取**：无论是使用简单的技术（如窥视），还是更具侵入性的暴力破解技术，密码的泄露对数据的机密性和完整性都是严重威胁。另一种关注密码窃取的犯罪类型包括网络钓鱼攻击。\n\
  * **使用易于获取的利用脚本**：我们在专业渗透测试中使用的许多工具使用利用脚本来破坏系统；许多网站也有许多旨在破坏系统的脚本。获取这些脚本和工具轻而易举。\n\
  * **网络入侵**：在某些情况下，目标是网络本身。在不久以前，电话网络一直是电话黑客的目标，这样他们就可以免费拨打电话。在如今的网络中，新的通信技术为恶意黑客提供了诱人的目标，包括\
  \ IP 语音（VoIP）。\n\n\n\n\n如果你计划进行任何形式的渗透测试，那么至少熟悉以下法律是重要的。无论如何，如果你在从事合同工作或作为员工，很可能有一或多项此类法律影响到你或你测试的系统，特别是当你的客户或公司拥有维护个人或财务数据的系统时(康奈大学法学院)。\n\
  \n### 1970 年美国《公平信用报告法》\n该法案规定了消费者信贷信息的收集、传播和使用，并为消费者对其信贷信息的权利提供了基准。\n\n### 1970\
  \ 年美国《受敲手者影响和腐败组织法》(RICO Act)\n该法案扩大了对作为持续犯罪组织部分而实施的行为的刑事和民事处罚。该法旨在打击大型有组织犯罪集团伙，`RICO`\
  \ 法案涵盖了许多非法活动，包括`Title 18`（《联邦刑法》）涵盖的几项罪行，如勒索和敲诈。\n\n### 1973 年美国《公平信息实践法典》\n该`U.S.\
  \ Code`（`U.S.C.`）旨在提高个人数据系统的安全性。它包含五个基本原则(Gellman, 2008)：\n1. 不存在本身就是秘密的个人数据记录系统。\n\
  2. 必须有一种方法让个人了解记录中有关于他们的信息以及这些信息是如何使用的。\n3. 必须有一种方法防止为了特定目的获取的个人信息在未经许可的情况下被用于或其他目的或提供。\n\
  4. 个人必须有一种方法纠正或修改关于其可识别身份信息的记录。\n5. 任何创建、维护、使用或传播可识别个人数据记录的组织，必须确保数据在其预期用途中的可靠性，并必须采取措施防止数据滥用。\n\
  \n### 1974 年美国《隐私法》\n该`U.S.C.` 定义了谁可以访问包含身份识别信息（包括但不限于教育、财务交易、医疗史以及犯罪或就业历史的姓名、身份证号、符号、指纹、声纹或照片）的信息。\n\
  \n### 1978 年美国《外国情报监督法》(FISA)\n该法案描述了进行电子监控和收集外国情报信息的流程。该法案在 2001 年通过`PATRIOT Act`进行了修订，将不一定与外国政府有关或有关系的恐怖组织纳入其中。随后还通过了额外的修订来处理无证窃听的问题。\n\
  \n### 1986 年美国《计算机欺诈和滥用法》(1996 年修订）\n该法案旨在减少针对计算机系统的恶意和未经授权攻击的威胁。`PATRIOT Act`增加了与该法案相关的处罚严重性，并将调查和响应安全事件所花费的时间成本加入了“损失”的定义中。这是法律的一项重要扩展，考虑到以前对损失的指控通常不是基于实际损失或成本，而是基于许多人认为夸张的索赔。\n\
  \n### 1986 年美国《电子通信隐私法》\n该法扩大了政府对窃听的限制。该法最初限于电话通话，后来扩展到了对截获传输的权利。\n\n### 1987 年美国《计算机安全法》\n\
  该法试图提高联邦计算机系统的安全性和隐私，已被 2002 年的《联邦信息安全管理法》(`FISMA`)取代。\n\n### 1991 年美国《联邦量刑指南》\n\
  这些是对美国被定重罪犯的量刑指南。\n\n### 1994 年美国《执法协助通信法》\n该法要求所有通信运营商必须为执法机构进行窃听提供功能和能力。\n\n###\
  \ 1996 年美国《经济和机密所有权保护法》\n该法通过扩大财产的定义以涵盖专有信息，旨在提高企业和工业免受间谍活动侵害的能力。\n\n### 1996 年美国《第一章：经济间谍法》\n\
  该法将盗取商业秘密定为联邦犯罪。\n\n### 1996 年美国《肯尼迪-卡瑟鲍姆健康保险可携带性法》(HIPPA)（2000 年修订）\n该法重点关注保护健康行业内的个人信息。\n\
  \n### 1998 年美国《数字千年版权法》(DMCA)\n该法禁止制造、交易或销售任何规避版权保护的设备、设备或服务。\n\n### 1999 年美国《统一计算机交易法》(UCITA)\n\
  该法旨在提供一套统一的规则，规范软件许可、在线访问以及计算系统之间发生的各种其他交易。它赋予了“缩壳”（`shrink–wrap`）许可协议的有效性。\n\n\
  ### 2000 年美国《全球和国家商业电子签名法》(ESIGN)\n该法为电子签名和记录提供了法律依据，电子合同不能仅仅因为其是电子形式而被否定其法律效力、有效性或可执行性。\n\
  \n### 2001 年美国《提供拦截和阻止恐怖主义所需的适当工具法案》(PATRIOT Act)\n该法扩大了执法执法部门搜索电话、电子邮件、医疗和财务记录的能力。它还放宽了在美国境内进行外国情报工作的一些限制。\n\
  \n### 2002 年美国《电子政府法》第三章：联邦信息安全管理法 (FISMA)\n该`U.S.C.`旨在提高联邦政府内部的计算机和网络安全，并取代了《1987\
  \ 年美国计算机安全法》。\n\n## 美国州法律\n一些美国州在保护公民隐私方面采取了主动措施。其中一个较著名的努力是 2003 年的加州`SB 1386`法案。它要求任何在加州运营的机构、个人或企业必须披露任何涉及加州居民的安全漏洞。到\
  \ 2005 年，已有 22 州颁布了类似的法律，旨在发生隐私泄露时保护其公民。在某些情况下，这些法律扩展到了其他数据，包括医疗信息、生物识别数据、电子签名、雇主识别号等。\n\
  \n\n\n\n\n`Warning` 随着律师和法官开始真正理解计算机技术，法律正在不断变化。如果你对`任何事情*`有任何疑问，请联系律师。由于每个州都有权定义自己的关于计算机犯罪的法律，在某个州进行的计算机活动可能是合法的，而在邻州则可能是非法的。垃圾邮件（Spam）就是法律差异巨大的领域之一，以至于几乎无法跟上这些差异。虽然我每天在个人信箱中也深受垃圾邮件的困扰，并希望它们能全部消失，但某些垃圾邮件法已因为违反了言论自由而被推翻。这些法律的编写得并不好，正如杰米·杰内斯（Jeremy\
  \ Jaynes）的案例所示，他最初被发现触犯了弗吉尼亚州的反垃圾邮件法并被判处九年监禁。他的判决最终被弗吉尼亚州最高法院推翻，因为该州规章“在表面上具有违反宪法的的过度扩张性，因为它禁止了匿名传输所有未经请求的批量电子邮件，包括包含受美国联邦宪法第一条修正案保护的政治、宗教或其他言论的邮件。”(Jeremy\
  \ Jaynes v. Commonwealth of Virginia, 2008) 国家立法层面已经进行了一些努力，以帮助并创建同时对所有州都有益的计算机犯罪法。例如是《CAN-SPAM\
  \ 法案》，它处理了垃圾邮件问题并考虑了第一条修正案的权利。然而，各州倾向于避免使用联邦法律；如果某人在联邦法院受到审判并被判处无罪，提起诉讼的人可能最终支付被告的法律费用，正如根据《CAN-SPAM\
  \ 法案》提诉的 Gordon 诉 Virtumundo 案所示。Virtumundo 被判定为无罪，Gordon 必须支付 111,000 美元的诉讼费和律师费。大多数州法律并没有在被判处无罪时补偿被告的规定。考虑到这一点，请记住，仅仅理解联邦法律是不够的。有许多措辞糟糕的州法律可以将你诱入法庭，即使这种活动在你的管辖区内并非非法，仅仅是因为你的“0”和“1”数据包跨越了他们的州。另一个关注的问题是民事责任，由于缺乏尽职调查和正当注意——这些法律描述概述了个人在正常业务过程中应有的适当行为。\n\
  \n## 国际法律\n\n本节提供了一份与隐私和/或计算机犯罪相关的非美国法律列表。此列表并非详尽，应作为你在处理可能受国际规则和法律约束的系统时理解自己渗透测试人员角色的起点。对于在欧洲拥有系统或业务往的公司，渗透测试人员必须非常熟悉《欧盟个人数据保护指令》。\n\
  \n### 加拿大\n\n■ 《加拿大刑法典》第 342 条 – 未经授权使用计算机 ■ 《加拿大刑法典》第 184 条 – 截获通信\n\n### 英国\n\n\
  ■ 《1990 年计算机滥用法》(CMA)（第 18 章） ■ 《2000 年调查权力法案》（第 23 章） ■ 《2001 年反恐怖主义、犯罪与安全法案》（第\
  \ 24 章） ■ 《1998 年数据保护法案》（第 29 章） ■ 《2006 年欺诈法案》（第 35 章） ■ 可能的《1981 年伪造与假币法案》（第 45\
  \ 章）也可能适用于在英国境内接受的电子支付工具的伪造。■ CMA 最近由《2006 年警察与司法法案》（第 48 章）进行修订 ■ 《2003 年隐私与电子通信（EC\
  \ 指令）条例》（法定文书 2003 年第 242 号）\n\n### 澳大利亚\n\n■ 《2001 年网络犯罪法》（联邦） ■ 《1900 年刑法典》（新南威尔士州）第\
  \ 6 部分，第 308 条 ■ 《1913 年刑法典汇编》（西澳州）第 440 条，未经授权使用计算机\n\n### 马西亚\n\n■ 《1997 年计算机犯罪法》（第\
  \ 563 号）\n\n### 新加坡\n\n■ 《1993 年计算机滥用法》（第 50A 章）\n\n### 委内瑞拉\n\n■ 《计算机犯罪法》（Ley Especial\
  \ de Delitos Informáticos）\n\n## 安全港与 95/46 指令\n\n1995 年，欧盟委员会实施了“关于个人数据保护以及此类数据自由流动的\
  \ 95/46 指令”。该指令禁止从采纳指令的国家向未采纳指令的国家传输隐私数据。美国是未采纳该指令的国家之一。由于获取隐私数据会严重损害业务活动（即利润），该指令引入了“安全港”（Safe\
  \ Harbor）的概念。安全港背后的理念是，希望参与数据自由流动的公司无论位于何地都可以，只要它们遵守 95/46 指令的所有规定。那么，公司如何获得安全港的资格呢？在美国，公司可以自我证明符合\
  \ 95/46 指令。没有监管机构来确保公司声称遵守指令后的执行；然而，对那些不当声称安全港港但不符合要求的公司可以提出投诉。\n\n## 获取黑客许可\n\n\
  \n\n\n在合同谈判过程中，你可能会在看到任何其他文件之前先看到一份保密协议。其目的是保护你在项目过程中收集的任何信息的机密性和隐私性。请理解，当你签署此协议时，你不仅承诺在渗透测试期间对客户的数据保持保密，还承诺在持有这些数据的整个期间都对其保持保密，即直到按照约定的时间表和方法对其进行妥善销毁为止（假设客户愿意解除合同规定的保密协议）。\n\
  \n保密不再生效的实际日期可能有所不同，取决于组织和法律；举个例子，从我个人的角度来说，由于我在美国陆军服役期间学到的任何军事机密，在 2096 年之前都是无法讨论的，那是我离开军队\
  \ 99 年之后……我想这相当安全了。该协议包括截图、击键记录、文档（包括所有草稿以及最终发布版）、项目期间记录你击键的文件、你可能与客户交换的任何电子邮件、你获得的手册（无论是从客户还是从供应商获得的）、任何业务计划、营销计划、财务信息以及其他与项目有任何关联的内容。\n\
  \n我确定我漏掉了一些项目，但这一切的重点是，到项目结束时，你对客户网络或系统的理解可能比他们自己还要深，包括利用其资产的所有可能方式……而且这一切都集中在一个地方（你的电脑或办公室）。自然，客户会对这种情况感到紧张。这一切的意义在于，当你签署保密协议时，它不仅仅是你单方面同意不谈论客户资产的协议——它是一份将所有与客户相关的数据封锁起来的协议。想象一下，如果有人黑入了你的系统，并发现了如何渗透你客户网络的细节，那将是多么可怕。\n\
  \n## 公司义务\n许多人认为合同主要服务公司的利益。毕竟，他们有钱——为什么不能从中获得最大的利益呢？即使在对抗性谈判中，也存在一个假设，即相互互利是成功合同谈判的关键组成部分。任何承包商都不应该签署一份在短期或长期内对他们无益的协议。\n\
  \n尽管如此，让我们从伦理角度来看公司的义务，使承包商和公司都能获益。一旦双方签署了合同，公司就有义务平等地遵守合同。然而，确保已采取保护措施来保护你的组织，并给予承包商恰当的访问权限来完成你要求的任务，而不多也不少，这一点非常重要。\n\
  \n一种可能的保护措施包括针对渗透测试人员的网络和系统监控及日志记录。在系统崩溃或意外破坏数据的情况下，你可以判断承包商是否违反了合同协议。另一种保护措施是在公司财产范围内由专人陪同。这并不是为了阻碍专业人员的活动，而是为了减少意外泄露与项目无关的信息的概率。如果承包商仅仅因为在错误的时间出现在错误的走廊，就偷听了与公司业务策略相关的专有信息，那将是非常不快的。陪同的另一个好处是，如果承包商遇到问题，会有人立即着解决问题，为双方节省时间。\n\
  \n在一些更为敏感的环境中，控制承包商活动的每一个方面也并不罕见。在存在机密数据和网络的军事及政府设施内部进行渗透测试时，会采取极端措施限制数据离开设施。通常，所有的渗透测试都在设施内进行，不允许任何文档或计算机系统进入或离开设施（实际上，如果它们进入了设施，通常不被允许离开）。执行测试的承包商会事先向政府机构提供设备和软件清单，以便机构为他们获取。对于难以获取的特殊设备，允许其进入，但在离开之前必须进行清理；离开设施时拆除硬盘并关闭系统电源并不罕见。这些无疑是更极端的措施，但被认为是国家安全所必要的。一些公司可能会从在渗透测试项目期间投入同等努力来保护其公司数据中受益。\n\
  \n## 承包商义务\n\n\n\n\n\n除了承包商将对所有数据保密的规定外，还应该有一项条款详细说明承包商如何使用他们收集的任何信息。通常，此类表述表明承包商仅会将信息披露给有“知情”的官员、董事或员工。唯一的例外是存在额外的书面协议授权向第三方披露。这显然不是什么不寻常的要求，但有些需要考虑的问题，它们可能会在未来产生麻烦。\n\
  \n如果你一直合作的官员、董事或员工不在位了怎么办？如果他们离开了公司怎么办？你验证和更新此授权接收人列表的程序是什么？如果一份合同只持续几天，可能没没什么理由担心这一点。然而，如果项目持续好几个月（这并不罕见），你的联系人（`PoC`）完全可能发生变化。确保在在你发送任何内容之前，你的授权接收人名单没有发生变化。\n\
  \n合同中通常包含的另一项义务是关于数据交付和销毁的细节。这通常包括你交回所有机密信息的时间限制（即使在合同提前终止的情况下），以及你将如何销毁与你的客户相关的其他介质（包括在此过程中生成的任何笔记、截图等）。你通常需要在销毁材料后的规定天数向客户提交一份销毁证明。对于不熟悉销毁证明的人来说，该文件通常包含一份详细列表，列出被处理信息的描述、销毁日期、授权销毁的人员、销毁方法（覆盖、粉碎、重新格式化等）以及见证销毁的人员。\n\
  \n销毁方法可能由客户规定。承包商几乎肯定会受到额外的限制，包括使用指定的登录名/密码（他们可能禁止你向系统或网络添加新用户）、你何时以及如何登录他们的系统、你被允许访问什么数据、你可以使用的软件工具（他们可能会禁止使用后门、病毒等）以及你可以执行何种类型的攻击（拒绝服务攻击通常是被禁止的）。\n\
  \n作为承包商，如果你发现合同中缺失了上述任何一个问题，你可能面临风险。这些义务不仅保护雇佣你的公司，也保护你——承包商。通常，会有一个兜底的短语，暗示承包商在项目过程中将“采取所有审慎措施”。如果这在合同中没有明确定义，其含义在两个签约双方之间的解释可能截然不同，这通常只能通过民事诉讼来解决。将每个小细节都写在纸面上比诉诸诉讼来解决差异要好得多。\n\
  \n## 审计与监控\n\n当我们在这节提到审计时，我们并不是在说你去审计客户的安全基础设施；而是说你的客户审计你的系统，以确保你符合合同。通常，你的客户想要审计你存储他们数据的方法，以及你如何管理、存储、转移和传输他们的机密数据。他们还希望审计你的系统，以确保它们能够防止安全违规或意外泄露。\n\
  \n我们将在本书后面的部分讨论如何最好保护你的实验室和 `PenTest` 系统，但请注意，客户期望你的系统能成为信息安全的典范。监控还涉及客户对你的调查。这通常发生在\
  \ `PenTest` 之前，但也可能延伸到期间。监控是为了让你的客户确信你只执行了合同中同意的测试。偏离协商好的协议通常会导致合同终止，并可能引发法律斗争。\n\
  \n## 冲突管理\n\n不可避免，双方都会产生分歧。你如何管理这些分歧将决定你的项目是否成功。所有合同都应该有规定的冲突解决方法。然而，它们通常只处理最坏的情况，即仲裁失败后通常会引发诉讼。对于那些没有升级到这种严重程度的问题，需要有一个冲突管理计划。\n\
  \n属于这种场景的情况通常包括承包商与你客户公司的某个利益相关者之间的分歧。这可能是一个对你对其网络进行探测行为感到不悦的网络管理员，或者是一个没有被纳入聘用你决策的经理。在这些情况下，受挫的尊可能会导致冲突，而你对此可能没有任何真正的控制力。\n\
  \n**提示**：如果在项目开始时建立一个可靠的沟通管理计划，几乎所有冲突的严重程度都可以降低。项目团队与利益相关者之间的沟通量往往存在限制的习惯，主要因为没有人喜欢传递坏消息。然而，问题越早沟通，解决得越快。它们可能也可能是合法的问题，例如阻碍你开展工作的技术障碍。无论情况如何，都需要一种处理冲突的方法。在某些情况下，`PoC`\
  \ 并没有足够的权力来解决问题。在这种情况下，需要替代的沟通渠道。如果你发现自己处于需要越界的情况下，你需要停止活动并重新协商协议。你的 `PoC` 的口头或书面批准永远是不够的，合同是具有约束力的协议，你可能会因违反合同而承担责任。除非合同明确说明\
  \ `PoC` 有权修改协议（我从未见过这种情况），否则你需要启动你的合同管理计划。任何其他行动都太有风险了。\n\n\n\n\n伦理不应被沦为人们每年勾选一次以符合人力资源要求的复选框。理解伦理并实践本章介绍的任何准则中的原则，将对专业渗透测试员产生极大帮助，无论是在工作质量还是行业认可度方面。尽管政府正试图规管伦理行为，但行业本身应该在确保任何参与专业渗透测试的人都遵守伦理行为方面发挥主要作用。有许多与隐私相关的法律，在执行\
  \ `PenTest` 项目期间需要考虑。`PenTest` 跨越国界的情况并不罕见；当这种情况发生时，项目成员需要充分了解所有相关法律。即使渗透测试完全在美国境内进行，也有新的州法律正在制定中，这可能会影响项目。一位熟悉隐私法的律师将变得无价之宝，并且在任何\
  \ `PenTest` 活动开始之前都应该咨询他们。合同义务是渗透测试团队需要解决的另一个问题。合同旨在保护所有方，因此请确保 `PenTest` 团队的需求得到满足。再次，律师对于保护任何进行渗透测试人员的利益至关重要。从长远来看，律师的费用是微不足道的，尤其是与诉讼成本相比时。\n\
  \n## 解决方案快速通道\n\n## 为什么要保持伦理？\n\n- 黑帽客具有优势，因为他们不需要遵守任何交战规则，可以进行任何类型的攻击，甚至是那些具有破坏性的攻击。\n\
  - 受大型组织雇佣的白帽客拥有黑帽客不具备的资源，包括付费培训、使用先进协议和设备的复杂架构、新技术，甚至是研发团队。\n- 白帽客在活动期间通常会受到限制，必须对他们执行的攻击类型以及何时可以进行攻击进行非常谨慎的选择。\n\
  \n## 伦理标准\n\n- 在信息安全行业中，没有颁发许可的机构或监督委员会来管理渗透测试员的行为和标准。\n- 客户正开始理解渗透测试的工作原理和为什么需要进行，并对什么构成了一次良好的渗透测试工作变得更加重视。\n\
  - 许多机构建立了了自己的伦理标准，使得在该机构的成员身份取决于是否接受这些伦理标准。\n\n## 计算机犯罪法\n\n- 民事法旨在纠正针对个人或组织的错误，这种错误导致了某种程度的损失或损害。\n\
  - 刑法旨在纠正针对社会的错误。被判定违反刑法的人可能面临监禁，并被要求提供经济赔偿。\n- 监管法旨在纠正政府机构、组织、官员以及组织或机构人员的行为。与刑法类似，惩罚可以包括监禁或要求提供经济赔偿。\n\
  \n## 获取黑客许可\n\n- **Q:** 我没有专业渗透测试的经验，这导致了我无法找到工作。我该如何获得经验？我可以做一些黑帽攻击并将其转化为职业吗？\n\
  \  **A:** 二十年前，并没有多少人理解信息系统安全，这迫使许多公司聘用黑帽来提供关于如何加固网络并防御恶意攻击的建议。今天，情况已经发生了变化；大多数被捕非法黑客的人最终都会进监狱，他们进入信息系统安全领域的长期前景也随之毁灭。如今市场上存在足够的专业渗透测试员，公司可以聘用那些没有法律纠葛的专业人士。\n\
  - **Q:** 我如何了解更多在专业渗透测试期间可能影响我的当地法律？\n  **A:** 律师是你最好的朋友。请请一位专攻合同和计算机法的律师。花在律师身上的钱是花得非常值的钱。\n\
  - **Q:** 我是渗透测试的新手，不知道从哪里开始。我有多年系统管理经验，并且很擅长我的工作。我该如何迈下一步？\n  **A:** 加入一些关注信息系统安全的当地组织。不仅可以建立当地联系，你还可以发现哪些类型的渗透测试服务。\n\
  \n\n\n\n\n## 审查组织伦理\n1. 找到 `RFC 1087` 的最新版本。备忘录的日期是？\n2. 哪个组织确定了 `RFC 1087` 定义的五种不道德且不可接受的行为？\n\
  3. `RFC` 将互联网与哪些常见的基础设施进行了比较？\n\n## 理解项目冲突管理\n1. 从可靠来源找到一个“冲突管理”的定义。它是如何定义的？\n2.\
  \ 寻找一份关于如何在项目内部专门处理冲突的建议列表。描述这些建议。提供一个场景，并说明你将如何根据这些建议解决冲突。\n\n## 理解“安全港协议”\n1.\
  \ 访问 [www.export.gov/safeharbor/](http://www.export.gov/safeharbor/) 并找到“安全港协议文档”（Safe\
  \ Harbor Documents）链接。查看标题为“安全港协议隐私原则”的文档。如果组织创建、维护、使用或传播个人信息，必须采取哪些安全措施？这些信息是太模糊还是太具体？为什么？\n\
  2. 在“安全港协议文档”页面中，查看标题为“安全港协议执行概述”（Safe Harbor Enforcement Overview）的文档。谁有权“对未能按照其陈述和/或承诺保护个人信息隐私的人员采取行动”？哪项\
  \ `U.S.C.` 赋予了该组织权力？该组织可以对违规公司下达什么样的民事处罚？\n\n### 参考文献\n- Bright, A., 爱沙尼亚指责俄罗斯进行“网络攻击”，《基督教科学监测报》\
  \ (2007)；检索自 [www.csmonitor.com/2007/0517/p99s01-duts.html](http://www.csmonitor.com/2007/0517/p99s01-duts.html)。\n\
  - 康奈尔大学法学院，*美国法典汇集*，检索自 [www.law.cornell.edu/uscode/](http://www.law.cornell.edu/uscode/)。\n\
  - Gellman, R., *公平信息实践：简史* (2008)；检索自 [`bobgellman.com/rg-docs/rg-FIPshistory.pdf`](http://bobgellman.com/rg-docs/rg-FIPshistory.pdf)。\n\
  - Giles, L., *孙子兵法。古古登堡计划* (1910)；检索自 [www.gutenberg.org/files/132/132.txt](http://www.gutenberg.org/files/132/132.txt)。\n\
  - IEEE, *IEEE 道德准则* (2006)；检索自 [www.ieee.org/portal/pages/iportals/aboutus/ethics/code.html](http://www.ieee.org/portal/pages/iportals/aboutus/ethics/code.html)。\n\
  - 信息系统安全协会，*ISSA 道德准则* (2009)；检索自 [www.issa.org/Association/Code-of-Ethics.html](http://www.issa.org/Association/Code-of-Ethics.html)。\n\
  - (ISC) (ISC)²，*(ISC)² 道德准则*，检索自 [www.isc2.org/ethics/default.aspx](http://www.isc2.org/ethics/default.aspx)。\n\
  - Jeremy Jaynes 诉 弗吉尼亚州，*G. Steven Agee 法官的意见书* (2008 年 9 月 12 日)；检索自 [www.courts.state.va.us/opinions/opnscvwp/1062388.pdf](http://www.courts.state.va.us/opinions/opnscvwp/1062388.pdf)。\n\
  - Leyden, J., 涉嫌网络间谍计划的北朝鲜马塔·姬，《注册表》 (2008)；检索自 [www.theregister.co.uk/2008/09/north_korea_espionage/](http://www.theregister.co.uk/2008/09/north_korea_espionage/)。\n\
  - Mertvago, P., *俄俄英语谚语词典*。(1995) Hippocrene 出版社，纽约。\n- Messmer, E., 美国军启动网络战争，《CNN\
  \ 新闻》 (2000)；检索自 [`archives.cnn.com/2000/TECH/11/22/cyberwar.machine.idg/index`](http://archives.cnn.com/2000/TECH/11/22/cyberwar.machine.idg/index)。\n\
  - 网络工作组，《互联网与道德》，互联网活动委员会 (1989)；检索自 [www.ietf.org/rfc1087.txt](http://www.ietf.org/rfc1087.txt)。\n\
  - 北朝鲜间谍攻击韩国军队，《悉尼早报》 (2008)；检索自 [`news.smh.com.au/world/north-korea-spyware-targets-south-army-20080902-47wp.html`](http://news.smh.com.au/world/north-korea-spyware-targets-south-army-20080902-47wp.html)。\n\
  - 经济合作发展组织，《OECD 关于隐私保护和个人数据跨境流动的准则》，检索自 [www.oecd.org/document/18/0,2340,en_2649_34255_1815186_1_1_1_1,00.html](http://www.oecd.org/document/18/0,2340,en_2649_34255_1815186_1_1_1_1,00.html)。\n\
  - SANS 学院，《IT 道德准则* (2004)；检索自 [www.sans.org/resources/ethics.php](http://www.sans.org/resources/ethics.php)。\n\
  \n# 第 3 章 职业黑客\n\n## 引言\n\n\n\n\n\n不要看开头，要看结尾。——俄罗斯谚语：“在考虑好如何结束之前，先不要开始任何事情。”(Mertvago,\
  \ 1995) 我经常被问到，如何才能成为一名专业的渗透测试员。尽管与计算机和网络黑客相关的认证、大学学位和第三方培训课程不断增加，但并没有什么东西能明确反映出你进行渗透测试的能力。考虑到信息系统安全（ISS）领域攻防措施的不断演进，这一点可能也不会发生改变。\n\
  \n与信息技术（IT）中的某些职业不同，专业的渗透测试员必须不断学习新技能——有时是每天如此。当我从事系统管理工作时，作为一名 `sysadmin`，扩展知识所做的最多事情就是等待补丁公告，并阅读与我的工作及我负责的架构相关的双月刊杂志。除此之外，我只是被系统管理的任务淹没。换句话说，我的活动\
  \ 90% 是在做，只有 10% 是学习。\n\n专业渗透测试员的生活几乎是反向的，我的大部分时间花在学习上——有时甚至是在渗透测试过程中。作为渗透测试员，我每天的工作步骤包括阅读如\
  \ `bugtraq` ([www.securityfocus.com/archive/1](http://www.securityfocus.com/archive/1))\
  \ 等邮件列表，查看了哪些新的漏洞或利用。在实验室中重现利用可能是验证结果的下一步，特别是当该漏洞针对任何未来或过去的渗透测试中的系统时。由于我的工作描述部分涉及定期对企业系统进行渗透测试，因此猎捕开始寻找哪些系统可能受到影响。\n\
  \n即使在渗透测试期间，也存在大量的研究。在确定了系统或应用程序后，需要大量的文档挖掘工作，以理解协议、通信方法、默认密码、目录结构等。之后，还有更多的研究来寻找漏洞和利用（这些利用在不进行某些修改的情况下通常无法作用）。现实中，渗透测试涉及大量的研究，才能在攻击阶段取得任何进展。如果进行大量的研究不在你的舒适区，那么渗透测试可能不是一个作为职业的正确选择。如果你觉得研究听起来很有趣，请继续读下去。\n\
  \n## “大师”策略\n你可能注意到我没有回答关于如何成为专业渗透测试员的问题，所以我现在来回答：“先成为某个领域的大师，然后再成为渗透测试员。”好，，等一下——在你放弃并放下这本书之前，让我进一步详细说明一下。我从未遇到过任何专业的渗透测试员（我将其定义为那些只做渗透测试并以此为生的人）是样样精通但无一精通的专家；换句话说，我遇到的每一个人在某方面都极其擅长，无论是编程、系统管理还是网络，此外还有作为渗透测试员的技能。\n\
  \n这种*大师*身份使他们能够更快地操纵目标系统，并根据已知能力了解他们可以对系统进行多大程度的利用（假设是目标系统的大师）。对于他们不熟悉的系统，可能会有一些交叉知识能让他们在\
  \ `PenTest` 期间占据优势。然而，对不熟悉的系统或网络进行攻击是非常困难的，这通常促使渗透测试员要么将自己的技能“孤立化”（仅在某领域进行过度专精），要么扩展领域并尝试成为多个领域的大师。\n\
  \n## 专业化 vs 通用化\n每个选择的动机都基于几个因素。例如，如果你想以监控控制和数据采集（SCADA）黑客方面的技能而闻名，那么成为 IP 语音协议（VoIP）专家并没有太大意义。然而，如果你在一家拥有完全不同的操作系统和网络架构的大型公司工作，扩展领域可能是你唯一的真正选择。\n\
  \n这带来了另一个问题——时间。一天之中真的没有足够的时间让你成为渗透测试中所有不同领域的大师，这就是为什么最好的方法首先专注于一个特定的技能，之后再添加。过度专精需要大量的精力和渗透测试工作描述之外的工作。\n\
  \n我个人的背景涉及了大量作为 `Solaris` 服务器系统管理员的时间；虽然我犹豫于称自己为大师，但我已经在 `command prompt` 前度过了很多年。有一段时间，我甚至不知道渗透测试是否对我感兴趣。事实证明，在此过程中，我开始对\
  \ ISS 产生兴趣，并围绕这一兴趣定制了我的教育。\n\n## 突破行业\n在成为渗透测试员后，我发现许多其他人遵循同样的基本路径——先做大师，后做渗透测试员。真正的困难在于说服别人我实际上具备执行渗透测试工作的能力，这就是认证发挥作用的地方。此外，我必须说，与其他\
  \ ISS 职业机会相比，专业的渗透测试职位很少。似乎想做渗透测试工作的人比可用的职位要多。\n\n如果你真的认真想成为一名 `PenTest` 工程师，你需要尽快且尽可能完整地朝着该目标规划你的职业。你可以通过专业化（这是我们将要讨论的）、获取相关认证、参加当地和国际会议、寻找当地社区等——采取任何可以让你被认可为渗透测试领域内人士的方法，即使仅仅是作为一个观察者。\n\
  \n关键在于对该职业领域充满热情并不断学习；没有人会把信息喂到我们嘴里，所以我们需要阅读书籍、上网、建立自己的测试实验室等。\n\n\n\n\n\n当我刚开始接触信息系统时，唯一一个与安全相关的真实职业是网络和系统认证与认可（C&A）领域。今天，对于进入该领域的人来说，有极其大量的选择。然而，这本书此书仅关于一种职业——专业渗透测试员。问题在于，即使将职业选择缩小到“渗透测试员”，仍然无法帮助建立职业规划——因为当轮到选择专长方向时，仍然有太多的选项可供。这些选择可以缩小为三个不同的方向：网络、系统和应用程序。我们将分别讨论每一个。请记住，我们仍然是从高层面上讨论渗透测试的职业路径。以下每项描述都可以根据需要拆分为更具体的学习领域。同时要理解的是，在任何渗透测试工作中，不同领域之间都存在大量的交叉。简单来说，没有系统，网络就没有必要；没有应用程序，系统就没有必要；而如果没有网络来传播信息，应用程序也就没有必要。这是一个相互依赖的循环；理解任何部分都不比其他部分更重要，将有助于你进行自己的渗透测试。\n\
  \n## 网络架构\n\n当有人提到 `network architecture` 时，大多数人脑海中浮出的第一个词是 IT。学校已经围绕 IT 主题以及如何在组织内部最好地使用和保护网络架构设计了高级学位。无疑，这似乎是大多数渗透测试员的一条可能路径；然而，根据个人经验，情况并非如此——大多数人来自信息系统领域，这很令人遗憾。具有网络架构背景的渗透测试员可以识别出各种网络设计中的缺陷，以及这些设计中元素的放置问题。缺陷可能涉及网络内部使用的不同通信协议，也涉及用于传输和保护通信流量的设备。近期，市场对熟悉网络的渗透测试员需求日益增长。现在公司终于意识到了信息安全的价值（好吧，也许我说这话是表现出一种盲目乐观主义），已经建立了了相关流程来定期分析应用程序和系统，包括企业扫描和第三方审计。然而，网络被忽视了，通常是因为多年来一直存在一种错误观念，认为防火墙和入侵检测系统（IDSes）是有效的工具，仅仅是因为它们存在于网络中。事实是，这些网络设备仅仅是“速度减速带”，而网络设备和通信协议被利用的程度与应用程序和操作系统一样容易，甚至更容易，这取决于网络管理员的技能。和信息安全领域的任何事物一样，设备的设备的安全性直接取决于配置和维护这些设备的人所拥掌握的知识和付出的努力。通过专攻网络架构，渗透测试员有多种选择。有多个认证、组织和本地小组专门设计、运营和保护网络。由于市场对防火墙和\
  \ IDS 专家有巨大的支持网络和需求，许多信息安全专家最终只从事这些工作——防火墙和 IDS。这些知识无疑会对渗透测试员有所帮助；但因为有很多此类系统的管理员和经理职位，这使得以后很难转到渗透测试职位。无论如何，如果你想成为一名\
  \ PenTest 工程师，请确保你尽可能地了解网络架构的不同侧面。学习通信协议、VoIP、路由器、交换机、IDS、防火墙、传输控制协议 (`TCP`) 以及你能想到的任何其他东西。我个人就不得不学习这一切以及更多。\n\
  \n## 系统管理\n\n系统管理结合了许多不同的概念。专攻系统管理的专业渗透测试员通常从一种操作系统开始，通过学习安全通信协议、文件共享、目录服务、系统加固、备份流程等内容在此基础上进行扩展——基本上是任何与计算机及其运行有关的内容。每个月都会发布许多针对底层系统的漏洞，而不仅仅是安装在服务器上的应用程序。理解服务器的复杂性对于任何想要使用这些漏洞的渗透测试员来说都是非常有益的。熟悉系统的另一个额外优势在于，进入系统的方法通常涉及人为错误而不是漏洞。系统中有许多可以配置错误的地方（例如文件权限、密码策略等），这些可以被用来获取系统访问。如果你已经熟悉设计良好和糟糕的服务器是什么样，那么知道要找什么会容易得多。在这个领域，可以获得许多认证，包括专门针对安全的认证。\n\
  \n我看到系统管理员掉入的一个陷阱是错误地认为系统和应用程序之间应该有一条清晰的分界线。通常，我经常看到系统管理员和应用程序管理员之间对责任产生分歧。如果你打算选择渗透测试作为职业，你对应用程序要求的了解越多，你在该领域就越有效。记住，一切都在相互依赖的循环之中。一旦你熟悉了系统设计，不可避免会出现一些交叉。如果你负责维护一个每月数百万美元应用程序的系统，你无疑会非常熟悉应用程序和数据库的安全问题。\n\
  \n## 应用程序与数据库\n\n\n\n\n市场对应用和数据库渗透测试专业人员有着巨大的需求。在当今的互联网世界中，大多数公司通过使用应用程序来盈利，因此应用需要确保安全，以防止资金或客户的损失。已经有整个行业专门专注于应用安全。虽然有些渗透测试扫描应用程序可以帮助识别应用程序中的漏洞，但通过点击按钮并不总是发现问题的最佳选择。这正是渗透测试（PenTest）工程师大显身场的地方。\n\
  \n该领域的专业人士通常理解创建应用程序所需的要素（作为程序员或编程团队的经理），以及它们如何与数据库交互。通常，这些人也理解如何创建和与数据库交互。这种知识让渗透测试专业人员在其他专业领域中具有优势，特别是在跨越非常安全的网络进行远程攻击时。不可避免的是，一个应用要产生益处，就必须与人进行交互。如果这些人人在互联网上，那么对于渗透测试人员来说，黑入应用程序本身可能是唯一的选择方案。针对应用和数据库渗透测试员的安全认证远少于与网络和系统的认证。这使得专攻应用和数据库渗透测试的人士很难进入该领域。在渗透测试职位的工作面试中，以往的经验（通常是编程经验）变得至关重要；通常，你工作过的公司不愿详细说明你渗透其防御的有效性，这使得在该职业中进步变得更加困难。\n\
  \n`Warning` 不要指望有人根据针对面向互联网应用的任何非法攻击来雇佣你。虽然非法黑客行为曾让人们关注，但今天企业对 `Black Hats`（黑帽客）的观点相当负面。确保你的所有工作都是合法的将有助于说服招聘经理你是“系统的一部分”而非对立面，无论你真实的哲学如何。无论如何，在这个职业领域成为一名专业的渗透测试员是可能的；这比另外两个选择需要更高水平的努力。如果你能将知识和技能扩展到另外两个领域之一，将会有巨大的帮助。\n\
  \n# 认证\n\n`工具与陷阱……`\n\n## 认证主题\n等一下，修正一下：\n我不想在本章中陷入关于认证或大学学位价值的哲学争论。让我直接陈述以下内容，以便我们继续：\n\
  - 认证和学位除了证明你能参加考试之外，不能“证明”任何事情。\n- 认证和学位通常是通过人力资源（`HR`）筛选的必要条件，这样你才能获得面试机会。\n- 政府机构要求某些职业拥有特定的认证。\n\
  - 有意竞标政府合同的公司必须符合认证要求，这通常要求公司内部拥有最低数量的信息安全认证，以及将分配到政府项目的人员。\n- 某些公司（包括 `Cisco` 和\
  \ `Sun Microsystems`）要求供应商在销售服务或硬件之前拥有认证。\n- 在其他条件相同的情况下，认证和学位是员工之间的区别因素，可以增加你加薪、晋升的机会，或提供逃避裁员的机会。\n\
  \n如果我们能同意上述陈述，我们就可以继续并说，获得认证确实非常重要。它向雇主展示了他们的员工有改进自己的动力，这在理论上转化为更高技能的劳动力、更高的竞争程度以及公司的长期利润。在大型组织中，认证在个人的职业生涯中起着更大的作用，这仅仅是因为\
  \ `HR` 部门必须将一切视为一场数字游戏——如果他们需要裁员 2500 人，他们无法花时间去了解每个人的情况；他们需要高效，并找到一个简单的标准来决定谁留谁走。认证和大学教育提供了这一标准。\n\
  \n\n\n\n在本章中，我包含了大量的项目列表，以识别信息安全和渗透测试领域的关键知识点。危险在于，这些列表可能被扫草一眼，而没有真正仔细阅读其内容。我鼓励你——读者——要真正关注本章提供的信息，尤其是那些项目符号。它们曾亲自帮助我识别出我需要关注的领域，并协助我制定了职业发展路线。它们对你可能也会很有帮助。在较小的公司中，当涉及到裁员、晋升或加薪时，`HR`\
  \ 的决策可能会考虑更多的人性因素。通常情况下，经理拥有更大的权力来决定这些类型的活动。然而，如果一家小公司依靠政府合同生存，或者需要从竞争对手中脱颖而出，那么证书就会很快变得非常重要。情况是（对于那些不熟悉政府机构授予合同方式的人来说），当公司对政府机构提供的合同进行投标时，公司必须包含一份分配到该合同的人员名单，以及相关的证书和学位。他们包含的证书和学位越多，赢得合同的机会就越大。即使你永远不需要赢得政府合同，或者不需要说服\
  \ `HR` 你是胜任的，如果你以后需要寻找渗透测试员的工作，获得证书仍然很重要。它向雇主展示了你足够在意自己的简历，并愿意为获得证书做出必要的工作。我曾与招聘经理谈过，他们直率地解释说，当他们面试一个声称知道如何做某工作但没有证书的人时，招聘经理对雇用这个人并不感兴趣。原因各异，但经理们似乎认为该人符合以下一种或多种情况：\n\
  \n- 过于自大且自我评价过高，这会让面试者很难融入团队环境\n- 太懒惰，如果他们甚至无法坐完一场仅持续几小时的考试\n- 对该主题过于有主见，这可能表明固执——这是另一种不适合团队环境的负面性格特质\n\
  \n我不认为这总是如此的，但无论对错，这些观点都已经被表达出来了。事实上，并没有什么真正合理的理由让人不去追求证书。即使你不认同证书背后的理念，也有许多理由去获得它——最的理由是它可能会让你获得一份工作，或者可能在困难时期帮助你保住工作。那么，为了成为一名专业的渗透测试员，你应该获得哪种证书？我将给出一个通用的“滑头”回答，说“这取决于”。但它确实取决于你的兴趣是什么，所以我的回答并不是在推辞。在我的个人目标中，我决定获得以下证书：\n\
  \n- 特定系统：Sun 认证系统管理员 (`SCSA`)、Sun 认证网络管理员 (`SCNA`)、Sun 认证安全管理员 (`SCSECA`)\n- 通用安全：国际信息系统安全认证协会\
  \ `[(ISC)²]` 认证信息系统安全专家 (`CISSP`)、`(ISC)²` 信息系统安全管理专家 (`ISSMP`)\n- 评估技能：国家安全局 INFOSEC\
  \ 评估方法 (`IAM`)、国家安全局 INFOSEC 评估方法 (`IEM`)\n\n这给了我一份与 `ISS` 全面的证书列表，并且对我目前的工作非常有帮助。我需要明确的是，这些证书对我有效，不应作为其他人职业生涯的蓝图。例如，如果你对进行\
  \ VoIP 渗透测试感兴趣，我的证书中除了几个外都与无关。为了让你更好地了解哪些类型的证书可能与自己的职业路径更相关，我列出了一份业内知名较高的证书列表。\n\
  \n## 高级证书\n\n请理解，在不久前，还没有任何涉及 `ISS` 的证书。事实上，`ISS` 是一门非常新的学科，长期以来被归类于灾恢复的研究。试图识别关于\
  \ `ISS` 的“最佳实践”几乎是一项不可能的任务。20 世纪 80 年代后期，美国政府试图在《彩虹系列》（Rainbow Series）中对系统配置管理进行规范；具体是在\
  \ `NCSC-TG-006`，即闻名的“橙色书”（the Orange Book）。尽管《彩虹系列》提供了许多特定系统的指南和系统安全信息，但并没有更高层次的内容，特别是管理方面。为了填补这一空白，开发了各种证书和标准；但最终只有几个不同的组织成为了高级\
  \ `ISS` 证书的实际选择。\n\n### 工具与陷阱\n\n## 彩虹系列\n\n虽然许多人认为《彩虹系列》是过时的历史，但《彩虹系列》仍然被作为某些政府合同的标准在使用。通常，这些合同已经存在了多年，真的应该重写了；但与其花钱重写合同（这将使合同符合现行联邦法规的总成本高得多），合同被保持原样。如果你真的有兴趣阅读《彩虹系列》，即使仅仅是为了理解\
  \ `ISS` 的历史，请访问 `[www.fas.org/irp/nsa/rainbow.htm](http://www.fas.org/irp/nsa/rainbow.htm)`\n\
  \n### (ISC)²\n\n`(ISC)²` 可能是最受认可的 `ISS` 认证机构。其互联网官方网站为 `[www.isc2.org](http://www.isc2.org)`，他们提供了关于自己的信息\
  \ `(ISC)²]`：\n\n#### 关于 (ISC)²\n\n总部位于美国，在伦敦、香港和东京设有办事处，是全球领先的非营利机构，致力于为职业专业人士提供教育和认证。我们因金标准认证和世界级教育计划而闻名。我们为\
  \ 135 国家的专业人士提供供应商中立的教育产品、职业服务和金标准证书。我们对基于信任、诚信和专业的声誉感到自豪。我们也为我们的成员群体感到自豪——这是一个全球近\
  \ 6 万认证行业人士的精英网络。\n\n## 我们的使命\n\n我们的目标是通过将信息安全提升到公众领域，并通过支持和培养全球范围内的信息安全专业人士，使网络世界变得更加安全。\n\
  \n#### (ISC)² CBK\n\n`(ISC)²` 开发并维护 `(ISC)² CBK`，这是一部信息安全主题汇编。`CBK` 是定义全球行业标准的关键知识体系，作为我们证书的基础术语和原则框架，并允许全球专业人士讨论、辩论和解决相关领域的问题。主题专家不断审查和更新\
  \ `CBK`。\n\n## 认证计划\n\n我们的证书被公认为信息安全认证的金标准，对于个人和雇主来说，对于信息资产和基础设施的无缝安全至关重要。\n\n\n\
  \n\n\n**提示** 如果你对从事政府合同稍有一点兴趣，你就需要熟悉认证要求。国防部（DoD）已发布 `DoD Directive 8570`，规定了其对各种就业职位的要求。你可以在\
  \ [www.dtic.mil/whs/directives/corres/pdf/857001m.pdf](http://www.dtic.mil/whs/directives/corres/pdf/857001m.pdf)\
  \ 阅读整个指令。`(ISC)²` 为信息安全系统（ISS）计划内的不同功能提供了 ISS 认证，包括工程、架构、管理和软件生命周期专业领域。每个认证在 ISS\
  \ 中都有不同的主题领域。以下是与每个认证相关的不同领域列表。我包含了机构对每个项目的定义，以对其在 ISS 职业的适用性提供一些说明。\n\n### Associate\
  \ of (ISC)² (关联成员)\n\n该称号是为不符合获得 `(ISC)²` 其他任何认证经验要求的人员设计的。`Associate of (ISC)²`\
  \ 称号向（潜在）雇主证明，这些成员具备获得认证的知识，即使他们还没有相关经验。一旦成员获得了所需的经验，他们就可以获得 `Systems Security Certified\
  \ Practitioner (SSCP)` 或 `CISSP`，取决于他们在作为获得 `Associate` 称号的要求时参加了其中哪项测试。\n\n###\
  \ SSCP [(ISC)²]\n\n“在信息安全领域仅需最一年的工作经验，你就可以获得 `Systems Security Certified Practitioner\
  \ (SSCP)` 认证。`SSCP` 非常适合那些从事`网络安全工程师`、`安全系统分析师`或`安全管理员`等职位的人。对于许多其他非安全学科的人员来说，这也是完美的课程，他们需要理解安全，但信息安全并不是其工作描述的主要部分。这个庞大且不断增长的群体包括信息系统审计员；应用程序程序员；系统、网络和数据库管理员；业务部门代表以及系统分析师。”\
  \ `SSCP` 领域：■ 访问控制 ■ 分析与监控 ■ 密码 `SSCP` ■ 恶意代码 ■ 网络与电信 ■ 风险、响应与恢复 ■ 安全运营与管理\n\n###\
  \ Certification and Accreditation Professional (CAP) (认证与认可专业人员)\n\n“对参与信息系统安全认证和认可过程的人员所需的知识、技能和能力进行客观衡量。具体而言，此凭证适用于负责形式化用于评估风险和建立安全要求的流程的人员。他们的决策将确保信息系统拥有的安全性与其潜在风险暴露水平以及对资产或个人的损害程度相适应。该凭证适用于美国民政府、州政府和地方政府，以及商业市场。职能部门如授权官员、系统所有者、信息所有者、信息系统安全官和认证人员，以及所有高级系统经理均适用。”\
  \ `CAP` 领域 [(ISC)²]: ■ 理解认证目的 ■ 启动系统授权流程 ■ 认证阶段 ■ 认可阶段 ■ 监控阶段\n\n### Certified Secure\
  \ Software Lifecycle Professional (CSSLP) (认证安全软件生命周期专业人员) [(ISC)²]\n\n“由于 `SLC`（软件生命周期）的每一个人都需要理解安全，`CSSLP`\
  \ 是任何软件开发人员、工程师、项目经理、QA（质量保证）、测试人员的指南。”`CSSLP` 领域：■ 安全软件概念 ■ 安全软件设计 ■ 安全软件实现 ■ 软件验收\
  \ ■ 软件部署、运营、维护\n\n### CISSP [(ISC)²]\n\n“`CISSP` 是信息安全领域的第一个认证，经 `ANSI`（美国标准协会）认可\
  \ `ISO`（国际标准组织）`17024:2003`。`CISSP` 不仅是一项客观衡量，还是全球认可的成就标准。”`CISSP` 领域：■ 访问控制 ■ 应用安全\
  \ ■ 业务连续性和灾难计划 ■ 密码 ■ 信息安全与风险管理 ■ 法律、法规与合规 ■ 安全安全 ■ 安全架构与设计 ■ 电信与网络\n\n### CISSP–ISSAP\
  \ [(ISC)²]\n\n“该专业方向要求候选人在架构领域具备两年的专业经验，是`首席安全架构师`和`分析师`的适当凭证。架构师在信息安全部门中起着关键作用，其职责在功能上介于高管及高级管理层与安全计划的实施之间。”`ISSAP`\
  \ 领域：■ 访问控制系统与方法 ■ 密码 ■ 物理安全集成 ■ 要求分析以及安全标准、指南和标准 与 技术相关的业务连续性和灾难计划 ■ 电信与网络安全\n\n\
  ### CISSP–ISSEP [(ISC)²]\n\n“该专业方向与美国国家安全局（NSA）合作开发，为任何系统安全工程专业人士提供了宝贵的工具。`CISSP–ISSEP`\
  \ 是将安全整合到项目、应用程序、业务流程和所有信息系统的指南。”`ISSEP` 领域：■ 认证与认可 ■ 系统安全工程 ■ 技术管理 ■ 美国政府信息保证条例\n\
  \n### CISSP–ISSMP [(ISC)²]\n\n\n\n\n“这种专业方向要求候选人在管理领域具有两年的专业经验，并将其置于更大的企业级安全模型中考虑。该方向包含了更深层次的管理元素，如项目管理、风险管理、制定和交付安全意识计划，以及管理业务连续性计划。`CISSP-ISSMP`\
  \ 建立、展示并治理支持整体业务目标的信息安全策略和程序，而不是资源的消耗。通常，`CISSP-ISSMP` 认证持有者或候选人将负责构建信息安全部门的框架，并定义内部支持的手段。”\n\
  \n### ISSMP 领域：\n- 业务连续性计划 (BCP) 和灾难恢复计划 (DRP) 以及业务连续性计划 (COOP)\n- 企业安全管理实践\n- 全企业系统开发安全\n\
  - 法律、调查、取证与职业伦理\n- 监督运营安全的合规性\n\n这些认证在 ISS（信息安全）领域内广受认可。我在判断一个认证的价值时，要做的事情之一就是查看有多少专门寻找该认证的职位。尽管这不能真正告诉我这些认证转化为职业渗透测试工作的效果如何，但在投入相关培训之前，了解这些认证的需求量总是是好的，特别是当谈论高级别认证时。自然，不同认证的需求会随时间而变化，但在尝试决定如何投入资金进行培训时，这仍然很有。在\
  \ [www.Monster.com](http://www.Monster.com) 招聘网站上，美国发布的职位分类如下：\n- `SSCP`: 53 个职位\n\
  - `CISSP`: 722 个职位\n- `ISSAP`: 8 个职位\n- `ISSEP`: 19 个职位\n- `ISSMP`: 2 个职位\n\n虽然这些专业方向认证的可用职位并不并不，但这并不意味着对这些技能没有需求。如前提到的，国防部（DoD）对不同的工作要求特定的认证，而\
  \ `ISSEP` 和 `ISSAP` 是符合国防部要求的两个认证。根据个人目标定制你的认证是非常关重要的，这就是为什么我个人拥有 `ISSMP`，尽管它在行业内的需求相当低。\n\
  \n### 信息系统审计与控制协会 (ISACA)\n\n位于 [www.isaca.org](http://www.isaca.org) 的 `ISACA`\
  \ 拥有几个可以转化为职业渗透测试的认证，特别是作为高级别认证。`ISACA` 始于 1967 年，其主要焦点一直是系统审计。尽管审计本身与渗透测试是截然不同的重点，但有很多技能在这两个职业领域之间是重叠的。对于工程师来说，注册信息系统审计师\
  \ (`CISA`) 会更合适，而管理人员则更适合注册信息安全经理 (`CISM`) 认证。`ISACA` 对其领域的定义与 (ISC)² 有些不同。`ISACA`\
  \ 并不关注知识领域，而是关注 ISS 内部的工作。\n\n### CISA\n\n根据 `ISACA` (ISACA)，“拥有 `CISA` 称号证明了精通程度，并是该职业的衡量标准。随着对拥有信息系统审计、控制和安全技能的专业人员的需求日益增长，`CISA`\
  \ 已成为全球个人和组织首选的认证计划。`CISA` 认证标志着对卓越服务组织以及信息审计、控制和安全行业的承诺。”\n\n`CISA` 岗位实践领域 (ISACA):\n\
  - 信息审计流程\n- IT 治理\n- 系统和基础设施生命周期管理\n- IT 服务交付与支持\n- 信息资产保护\n- 业务连续性与灾难恢复\n\n###\
  \ CISM\n\n`ISACA` 表示，`CISM` “专为有经验的信息安全经理以及那些承担信息安全管理责任的人士开发的。`CISM` 认证面向那些管理、设计、监督和/或评估企业信息安全\
  \ (IS) 的个人。`CISM` 认证促进国际实践，并为执行管理提供保证，确保获得该称号的人具有所需的经验和知识，以提供有效的安全管理和咨询服务” (ISACA)。\n\
  \n`CISM` 岗位实践领域 (ISACA):\n- 信息安全治理\n- 信息风险管理\n- 信息安全计划开发\n- 信息安全计划管理\n- 事件管理\n\n\
  虽然这些专业方向认证的可用职位并不多，但这并不意味着对这些技能没有需求。如前提到的，国防部（DoD）对不同的工作要求特定的认证，而 `ISSEP` 和 `ISSAP`\
  \ 是符合国防部要求的两个认证。根据个人目标定制你的认证是非常关重要的，这就是为什么我个人拥有 `ISSMP`，尽管它在行业内的需求相当低。\n\n在 [www.Monster.com](http://www.Monster.com)\
  \ 招聘网站上，美国发布的职位分类如下：\n- `SSCP`: 53 个职位\n- `CISSP`: 722 个职位\n- `ISSAP`: 8 个职位\n-\
  \ `ISSEP`: 19 个职位\n- `ISSMP`: 2 个职位\n\n\n\n\nGSLC 是管理方向的一部分，旨在面向“对信息安全人员具有管理或监督责任的安全专业人员”(Global\
  \ Information Assurance Certification, Global Information Assurance Certification,\
  \ Global Information Assurance Certification, Global Information Assurance Certification,\
  \ Global Information Assurance Certification, Global Information Assurance Certification\
  \ 以及 Global Information Assurance Certification)。该认证的知识没有非常深入到技术层面，涵盖了与 ISACA 和\
  \ (ISC)² 管理认证许多相同的知识领域。GSLC 相关的主题列表可以在表 3.1 (GIAC) 中找到。\n\n**表 3.1.** GSLC 主题\n\n\
  | | 考试认证目标 |\n| :--- | :--- |\n| ■ 802.11 ■ 访问控制与密码管理 ■ 高级侦察与漏洞扫描 ■ 构建安全意识计划 ■ 业务态感知\
  \ ■ 变更管理与安全 ■ 计算机与网络地址 ■ 加密算法与概念 ■ 加密应用、VPN 和 IPSec ■ 加密基础 ■ 深度防御 ■ 防御性操作安全 (OPSEC)\
  \ ■ 灾难恢复/应急计划 ■ DNS ■ 设施、安全与物理安全 | ■ 欺诈管理 ■ 通用加密系统类型 ■ 蜜罐与蜜骗网络 ■ 事件处理与法律体系 ■ 事件处理基础\
  \ ■ 信息战 ■ IP 术语和概念 ■ 恶意软件 ■ 管理智慧 ■ 管理伦理 ■ 全球化管理 ■ 管理知识产权 ■ 管理 IT 业务和计划增长 ■ 管理法律责任\
  \ ■ 管理谈判 ■ 管理隐私 ■ 管理安全策略 ■ 管理软件安全 | ■ 管理技术人员 ■ 管理任务 ■ 管理采购流程 ■ 管理总拥有成本 ■ 攻击方法 ■\
  \ Mitnick-Shimomura ■ 攻击性 OPSEC ■ 攻击性漏洞扫描 ■ PGP 和 PKI ■ 安全领导者的项目管理 ■ 风险管理与审计 ■ 安全与组织结构\
  \ ■ 隐写 ■ 智能网络 ■ 网络基础设施 ■ Web 与通信安全 ■ 无线优势与蓝牙 |\n\n### GSE\n\nGSE 与其他 GIAC 认证略有不同，因为它要求具备多个高级认证的知识。参加\
  \ GSE 所必须具备的认证是 `GSEC`、`GIAC 认证入侵分析师 (GCIA)` 和 `GIAC 认证事件处理员 (GCIH)`，这些都在安全管理认证的列表中。GSE\
  \ 还被分为不同的专业领域，包括 `GSE-Malware` 和 `GSE-Compliance`，它们要求的认证与 GSE 列出的认证不同。实际上拥有这些认证的人非常少，但这确实能与其他认证区分开来。GSE\
  \ 的知识领域如下 (GIAC)：■ IDS 和流量分析领域 捕获流量、分析流量、解释流量、IDS 工具 ■ 事件处理领域 IH 流程、常见攻击、恶意软件、保护证据\
  \ ■ ITSEC 领域 Windows 安全、UNIX 安全、安全通信协议、安全原理 ■ 安全技术领域 防火墙、漏洞扫描器和端口扫描器、嗅探器和分析器、常用工具\
  \ ■ 软技能领域 安全策略与业务问题、信息战与社会工程能力、写作能力、演讲能力、分析能力、团队协作 GSE 认证要求成功完成两项活动——笔试和上手实验。实验为期\
  \ 2 天，并要求申请者提交一份符合 GIAC 标准的书面和口头报告，以证明在事件处理和入侵检测方面的知识。其他 GIAC 认证将在本章稍后部分讨论。要了解更多关于\
  \ GSE 认证的信息，请访问 `www.giac.org/certifications/gse.php`。\n\n### CompTIA\n\n\n\n\n\n\
  CompTIA 自称为“全球最大的中立性 IT 认证考试开发商”，它开发了一项专门针对信息安全的认证，即 `Security+`。\n\n### 系统安全\n\
  区分各种系统安全威胁。解释与系统硬件及外围的安全风险。实施 `OS` 加固实践和程序，以实现工作站和服务器安全。执行适当的程序以建立应用安全。实施安全应用程序。解释虚拟化技术的目的和应用。\n\
  \n## 网络基础设施\n区分不同的端口和协议及其各自的威胁和缓解技术。区分网络设计元素和组件。确定使用网络安全工具以促进网络安全。应用适当的网络工具促进网络安全。解释与网络设备相关的漏洞和缓解措施。解释与各种传输介相关的漏洞和缓解措施。解释与无线网络相关的漏洞并实施缓解。\n\
  \n## 访问控制\n识别并应用访问控制方法的行业最佳实践。解释常见的访问控制模型及其之间的区别。将用户和计算机组织到适当的安全组和角色中，同时区分适当的权限。对文件和打印机资源应用适当的安全控制。比较并实施逻辑访问控制方法。总结各种身份验证模型并识别每种模型的组件。部署各种身份验证模型并识别每种模型的组件。解释身份识别与身份验证（身份证明）的区别。解释并应用物理访问安全方法。\n\
  \n### 评估与审计\n进行风险评估并实施风险缓解。使用常用工具进行漏洞评估。在漏洞评估领域，解释渗透测试与漏洞扫描的正确用法。在系统和网络上使用监控工具检测安全相关的异常。对比不同类型的监控方法。执行适当的日志记录并评估结果。对系统安全设置进行定期审计。\n\
  \n### 密码学\n解释通密码学概念。解释基本哈希概念并将各种算法映射到相应的应用。解释基本加密概念并将各种算法映射到相应的应用。解释并实施协议。解释公密钥加密的核心概念。实施\
  \ `PKI` 和证书管理。\n\n### 组织安全\n解释冗余计划及其组件。实施灾难恢复程序。区分并执行适当的事件响应程序。识别并解释相关的法律和组织政策。解释环境控制的重要性。解释社会工程的概念以及如何减少其风险。\n\
  \nCompTIA `Security+` 是 `DoD Directive 8570` 中指定的认证之一，考试涵盖的主题列表提供了 `ISS` 问题的广泛覆盖。从与行业内人士的交流来看，CompTIA\
  \ `Security+` 认证似乎被认为是获得更高级认证（尤其是 `CISSP`）的第一步。尽管这基于 `DoD Directive 8570` 看起来确实是合理的，但请记住，每个人的认证和职业规划都应该围绕长期目标设计，而不仅仅基于\
  \ `DoD` 认为他们应该拥有什么。正如我们稍将看到的，`Microsoft` 也接受 `CompTIA Security+` 作为能够满足 `MSCE: Security`\
  \ 认证要求的之一的认证。再次，根据你的职业目标选择合理的认证。最终，`Directive 8570` 将被修改，并可能将新认证纳入列表（或删除其他认证）。如果你的整个职业生涯仅仅基于\
  \ `DoD 8570` 之类的东西，而仅仅是因为别人说那是最好的做法，那将是非常遗憾的。\n\n### 项目管理协会 (PMI)\n`PMI` 提供多种认证，包括其最为人知的——项目管理专业\
  \ (`PMP`) 证书。虽然这项认证与 `ISS` 无直接关系，但在渗透测试期间团队中有一位熟练的 `PM` 非常有利，前提是 `PM` 能够将他们的技能转化到\
  \ `PenTest` 领域。`PMP` 的知识领域如下：\n* 启动\n* 计划\n* 执行\n* 监控与控制\n* 收尾\n* 专业与社会责任\n\n我们将在书中将这些领域与不同的渗透测试方法相结合；但是，我们只讨论渗透测试特定的问题。与\
  \ `PM` 相关的知识非常多，我们无法在书中可行地涵盖 `PM` 的所有方面。对于那些完全不熟悉项目管理的人，我将尝试解释我们在书中讨论的任何与 `PM` 相关的内容；只需理解，像书中的任何其他主题一样，你将需要花时间阅读我们所涵盖之外的其它参考资料。\n\
  \n### 动态系统开发方法 (DSDM) 联盟会\n\n\n\n\n\n我不提一下敏捷项目管理将是我的失职。大多数人至少听过敏捷编程，但现在有很多项目经理（PM）已经转向了更灵活的项目管理风格。`DSDM`\
  \ 是一种软件开发方法论，最初基于`快速应用开发 (Rapid Application Development)` 方法。诚然，`DSDM` 只是众多敏捷软件开发方法之一；然而，对于发现敏捷管理对你的渗透测试工作是否有帮助，这是一个很好的起点。其他的敏捷方法还包括：`极限编程\
  \ (Extreme Programming)`、`Scrum`、`自适应软件开发 (Adaptive Software Development)`、`水晶 (Crystal)`、`特征驱动开发\
  \ (Feature Driven Development)` 以及 `实用编程 (Pragmatic programming)`。你使用哪种方法取决于你自己，但所有形式的敏捷方法都存在一些基本原则，这些原则在《敏捷宣言》（Beck\
  \ et al., 2001）中规定：我们的最高优先级是通过早期和持续交付交付价值软件来满足客户。欢迎需求的变化，即使在开发后期也是如此。敏捷过程利用变化为客户赢得竞争优势。频繁地交付工作软件，从几周到几个月不等，并倾向于更短的时间。业务人员和开发人员在整个项目中必须每天工作。围绕有激情的个人构建项目。给予他们所需的环境和支持，并信任他们能够完成工作。向开发团队内部及传递信息的最高效且有效的方法是面对面交流。工作软件是衡量进展的主要标准。敏捷过程促进可持续开发。赞助者、开发者和用户应该能够无限保持恒的速度。对技术卓越和良好设计的持续关注增强敏捷性。简单——即最大化未完成工作量的艺术——至关重要。最好的架构、需求和设计源于自组织团队。团队定期反思如何变得高效，然后相应地调整和优化行为。敏捷方法相比于\
  \ `PMI` 所提倡的更具结构化的方法，其优势在于敏捷方法非常适用于那些不产生可重用组件的项目。在渗透测试中，两个`PenTest` 项目完全相同的情况非常罕见；使用敏捷过程允许你的团队在面对不可预见的挑战时更加灵活。有一些与敏捷编程和项目管理相关的认证，包括由\
  \ `DSDM Consortium` 提供的一些；但敏捷方法背后的理念倾向于认为，认证永远不应该用作职场的筛选标准。这的效果是降低了个人持有的任何与敏捷过程相关的认证权重，并迫公司仔细检查工作历史，以确定组织内最优秀的人才。尽管这让人们能够根据自己的实力而不是一张纸来立足，但这确实给招聘经理带来了问题，因为没有统一的标准来衡量看似相似的申请者。对于本书，我们将坚持使用\
  \ `PMI` 的项目管理标准，主要因为该方法论在 IT 行业内有更大的接受度。再次，这并不意味着 `PMI` 更好；事实上，我认为与敏捷方法相比，情况恰恰相反。\n\
  \n## 针对特定技能和厂商的认证\n\n对于管理层人员来说，拥有高级认证通常就足够了。毕竟，经理真的不需要知道 `TCP` 报头中的控制位是如何存在的——他们只需要知道有这些位位，并且\
  \ `PenTest` 工程师可以操纵这些位位。然而，如果你是工程师，你应该非常熟悉信息安全的技术方面。\n\n**注意**：本节讨论的许多认证有效期仅 2 或\
  \ 3 年，并需要重新认证。某些认证是特定厂商的。根据你的关注点，你可以获得厂商中性的认证。选择的原因是多样的。\n\n### Cisco\n\n虽然 `Cisco`\
  \ 有多个网络认证路径，但在信息安全领域内兴趣和吸引力最大的是网络安全路径。该路径包含三种认证：思科认证网络关联助理 (`CCNA`)、思科认证安全专业人员 (`CCSP`)\
  \ 和思科认证互联网互域专家 (`CCIE`)。虽然这些认证涉及对思科设备的实际操作经验，但在获得认证时获得的知识将很好地转化为渗透测试。\n\n### CCNA\
  \ Security\n\n`CCNA Security` 认证要求申请者已拥有有效的 `CCNA` 认证。申请者随后可以参加另一项目前名为 `640-553\
  \ IINS`（代表`Implementing Cisco IOS Network Security`）的考试以获得 `CCNA Security` 标识。`IINS`\
  \ 考试涵盖以下额外主题（Cisco Systems, Inc., 2009b）：\n\n- 描述现代基础设施面临的安全威胁\n- 保护思科路由器\n- 使用本地路由器数据库和外部\
  \ `ACS` 在思科路由器上实现 `AAA`\n- 使用 `ACLs` 缓解针对思科路由器和网络的威胁\n- 实现安全的网络管理和报告\n- 缓解常见的第二层攻击\n\
  - 使用 `SDM` 实现 Cisco IOS 防火墙功能 set\n- 使用 `SDM` 实现 Cisco IOS IPS 功能 set\n- 使用 `SDM`\
  \ 在思科路由器上实现站点到站点 `VPNs`\n\n#### CCSP\n\n此认证将 `CCNA Security` 认证列为前提，并要求申请者在授予证书之前参加额外的四项测试。这些测试是（Cisco\
  \ Systems, Inc., 2009a）：\n\n- 使用思科路由器和交换机保护网络\n- 使用自适应安全设备 (`ASA`) Foundation 保护网络\n\
  - 实现思科入侵防御系统\n- 以及以下项之一：\n    1. 实现思科网络准入控制 (`NAC`) 设备\n    2. 实现思科安全监控、分析和响应系统\n\
  \    3. 带有 `ASA` 的网络\n\n#### CCIE Security\n\n\n\n\n坦率地说，我从未见过有 `CCIE` 参与过渗透测试项目。我绝不是说在渗透测试项目中拥有一位\
  \ `CCIE` 是多此一举或毫无效率的——仅仅是 `CCIE` 有许多大得多的问题需要处理，而且他们的薪水远高于普通渗透测试工程师能拿到的。如果能聘请一位 `CCIE`\
  \ 作为领域专家并在偶尔需要时使用，那将是太棒了，这在拥有永久性渗透测试团队的大型组织中是有可能实现的。否则，你可能只需要满足于拥有 `CCNA`、`CCNP`\
  \ 或 `CCSP`（如果你真的足够幸运的话）。无论难度如何，了解 `CCIE Security` 专家精通哪些领域仍然很有帮助，这样你可以针对性地分配培训预算来扩展渗透测试团队的技能（表\
  \ 3.2)（(Cisco Systems, Inc）。\n\n**表 3.2.** CCIE Security 主题\n\n| 主题领域 | 具体主题 |\n\
