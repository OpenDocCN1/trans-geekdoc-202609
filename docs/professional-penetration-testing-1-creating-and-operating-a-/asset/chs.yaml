  \n# 第 4 章 搭建你的实验室\n\n## 引言\n\nДело право, толко гляди прямо. 俄罗斯谚语：“最好的答案是行动。”(Mertvago,\
  \ 1995) 对于那些对学习如何进行`渗透测试`（或者如果你想显得“酷”一点，就是黑客）的人来说，有很多工具可用，但可以安全练习的目标非常少——更不用说合法目标了。对许多人来说，学习渗透策略是通过攻击互联网上的系统来实现的。虽然这提供了大量的机会和目标，但也是非法的。许多人因此入狱或支付巨额罚款和赔偿——这一切都是为了黑进网站。对于那些想要合法学习渗透测试的人来说，唯一的实际选择是创建一个渗透实验室。对于许多人来说，特别是网络领域的新手，这可能是一项艰巨的任务。此外，创建用于练习的真实场景还增加了难度，特别是对于那些不知道真实场景是什么样子的的人来说。这些障碍往往足以让许多人放弃学习如何开展\
  \ `PenTest` 项目。本章和下一章将讨论如何搭建不同的渗透实验室，并提供模拟真实的场景，提供学习（或提高）专业渗透测试员所用技能的机会。\n\n\n\n\
  \n\n对个人实验室的需求非常高——即使是专业的渗透测试员也会在家里搭建小型个人实验室来进行实验。需要注意的是，个人实验室与专业实验室之间是有区别的。专业实验室即使由个人维护，也可以用于识别和报告发现的漏洞。对于那些对维护专业实验室感兴趣的读者，应该跳到标题为“企业实验室”的章节。该章节将侧重于创建一个供个人使用的小型实验室，在那个环境中可以学习和复现不同的黑客技术，但许多安全特性会被放宽。个人实验室的主要目标几乎纯粹是为了教育目的，通常用于复制或创建利用程序。这与用于攻击企业资产的企业实验室不同。\n\
  \n## 保持简单\n\n在尝试保持个人实验室小型化时，成本通常是保持其规模较小且易于管理的驱动因素。除非需要包含大量设备，否则可以使用虚拟机（`VM`）应用程序运行在单一系统中。此外，没有必要维护大型应用程序库。需要时可以下载开源应用程序，而且小型实验室中的系统可以轻松重新配置。除非个人实验室保留了任何敏感数据，否则可以消除许多安全控制，包括本章提到的安全问题。然而，如果实验室使用了无线连接，则应该保留访问控制。\n\
  \n## 设备\n\n虽然渗透测试实验室可以使用旧的计算机设备，但旧设备具有通常不被考虑的额外成本，包括时间和电力。一个仅关注应用程序和操作系统（`OS`）攻击的个人实验室不需要任何先进的网络设备，但需要一个更强大的计算平台来处理同时运行的多个\
  \ `VMs`。在进行暴力破解或密码攻击时，更快的处理速度是有益的——这是旧系统并不总是能提供的。虽然旧系统更容易获得（总有人想把他们的旧电脑送给我），但它们实际上可能帮得不反。\n\
  \n提示：我发现我只需要用一台良好的笔记本电脑和 `VMware Player` 作为虚拟机引擎，就可以进行所有的应用程序和操作系统渗透测试。过去，我使用只能一次运行一个镜像的旧系统，这需要我维护多个系统；所有系统都会产生大量的热量并消耗大量的电力。凭借今天的技术，寻找更便宜、更环保的替代方案才有意义。\n\
  \n## 软件\n\n对于创建个人实验室的人来说，一个优势在于在如今的信息技术环境中，企业网络中许多应用程序都是开源的，容易且免费获取。专利软件（包括 `OSes`）则是另一回事。在个人实验室中，需要做一个艰难的选择——是坚持使用开源应用程序，还是根据需要购买应用程序。虽然\
  \ `Microsoft Developer Network` 为许多 `Microsoft` 产品提供年度订阅，从长远来看可能是一个具有成本效益的替代方案，但仍然可以在网上购买旧版本的应用程序和操作系统。在某些情况下也可以免费下载试版。除非需要获取专利软件（例如复制新发现的漏洞），否则开源软件通常足够学习黑客技术，包括系统、应用程序、数据库和\
  \ Web 攻击。获取软件另一种方法是访问 `VMware`并在 `www.vmware.com/appliances/` 下载一些包含应用程序的预构建 OS\
  \ 镜像。这些“虚拟设备”可以作为实验室中的目标，它们还提供了练习书中后文描述的渗透测试方法的机会。\n\n注意：使用开源工具还有其他缺点——其中之一就是应用程序支持。大型商业工具通常会有支持人员快速响应你的问题和需要解决的故障（考虑到它们通常很昂贵，它们最好是这样）。开源工具通常没有这种支持——相反，大多数问题必须通过\
  \ wiki 页面或散落在互联网上的各种论坛进行搜索。\n\n## 书中练习的实验室\n\n在书的`第二部分` 中，我们将为个人实验室使用以下通用配置，如`图\
  \ 4.1` 所示。我们可以看到，有两件硬件——路由器和一台计算机。尽管`图 4.1` 显示的是笔记本电脑和无线路由器，但这些并不是要求的；有线路由器和台式机同样可行。计算机上的\
  \ `OS` 将是 `Microsoft Windows`。所有的 `LiveCDs` 都将在 `VM` 中运行——对于我们的示例，我们将使用 `VMware\
  \ Player`。\n\n| ![B9781597494250000087/f04-01.jpg is missing](img/f04-01.jpg) |\n\
  | --- |\n| 图 4.1. |\n| 实验室配置 |\n\n以下是可以在尝试重复书中示例的任何实验室中实现的配置信息列表。路由器配置：\n- `动态主机配置协议\
  \ (DHCP) 服务器`：激活\n- `地址池起始地址`：`192.168.1.2`\n- `局域网传输控制协议/网协议 (LAN TCP/IP)`：\n \
  \   - `IP 地址`：`192.168.1.1`\n    - `IP 子网掩码`：`255.255.255.255`\n- 计算机配置：`400 MHz`\
  \ 或更快（推荐 `500 MHz`），`512MB` 随机访问内存（推荐 `2GB`）\n- `VM`：`VMware Player` 可于 `www.vmware.com/appliances/`\n\
  \n每个 `LiveCD`（包括 `BackTrack` 镜像）都作为国际标准组织 (`ISO`) 磁盘镜像提供在 DVD 上。在希望使用 `LiveCD` 的情况下，两个\
  \ `ISO` 镜像需要在同一个目录下，如`图 4.2` 所示。\n\n| ![B9781597494250000087/f04-02.jpg is missing](img/f04-02.jpg)\
  \ |\n| --- |\n| 图 4.2. |\n| 包含 ISO 和 VMX 文件的目录 |\n\n如果安装了 `VMware`，`Microsoft OS`\
  \ 将识别 `VMX` 文件为 VMware 配置文件。启动 `VMX` 文件将在 `VM` 中运行 `ISO` 文件。在`图 4.3` 中列出了 `VMX`\
  \ 文件的内容。`ide1:0.fileName = \"bt2final.iso\"` 可以修改以匹配 `ISO` 文件名。\n\n| ![B9781597494250000087/f04-03.jpg\
  \ is missing](img/f04-03.jpg) |\n| --- |\n| 图 4.3. |\n| VMX 文件内容 |\n\n对于 `WebGoat`，该应用程序并非设计在\
  \ `VM` 中运行。对于本书，我们将在计算机系统上运行 `WebGoat`。`图 4.4` 显示了 `WebGoat` 使用的文件和目录。我们可以看到，有两个启动\
  \ `WebGoat` 的批处理文件。\n\n| ![B9781597494250000087/f04-04.jpg is missing](img/f04-04.jpg)\
  \ |\n| --- |\n| 图 4.4. |\n| WebGoat 目录 |\n\n\n\n\n文件和目录位于一个压缩文件中，该文件可以通过随附的 DVD\
  \ 获取或在 [`code.google.com/p/webgoat/`](http://code.google.com/p/webgoat/) 下载。WebGoat\
  \ 的历史和文档可以在 [www.owasp.org/index.php/Category:OWASP_WebGoat_Project](http://www.owasp.org/index.php/Category:OWASP_WebGoat_Project)找到。压缩文件可以解压到计算机系统上的任何目录（参见图\
  \ 4.1 中的笔记本电脑）。解压后，可以执行任意 `bat` 文件，这将在第 11 章中进行演示。\n\n# 公司实验室\n\n许多公司仍然未将安全视为提高利润的一种，并且不愿意建立公司级的渗透测试团队。这些组织通常简单地外包安全审计，并且可能外包也可能不包渗透测试。然而，许多公司正在采用不同的观点，它们正在创建风险评估小组来评估公司资产。本节将讨论具有公司支持的渗透测试实验室。公司实验室的功能与实验室不同。个人实验室的目标通常纯粹是为了教育。公司实验室包含各种黑客工具的系统，以便渗透工程师能够攻击公司资产，寻找可利用的漏洞。人们预期渗透工程师已经知道如何进行攻击和攻破漏洞，因此很少创建练习实验室。在工程师需要测试漏洞程序的情况下，通常会为渗透测试团队提供镜像生产环境的测试网络。维护和修补扫描并攻击公司资产的系统至关重要，而且通常是公司政策的强制要求。除了补丁之外，必须对系统访问进行严格控制。在渗透测试期间收集的信息极其敏感，对收集数据的未经授权访问不仅会危及目标系统，还会危及整个公司。有许多不同的方法可以防止对公司渗透实验室系统的未经授权访问，包括防火墙、访问控制和一次性密码。渗透系统周围的架构将根据公司的业务需求和渗透测试期间收集数据的敏感性而异。\n\
  \n## 内部实验室\n\n在硬件和软件方面，内部和外部渗透实验室之间没有太大区别。这两者的区别在于可访问性。内部实验室位于公司的内网中，内网通常对网络资产和服务器的访问限制较少。公司网络内部的渗透测试通常比外部渗透测试获得更大的成功，主要因为系统管理员之间存在一种普遍观点，认为公司员工应该是值得信任的。内部渗透测试的目的是识别易受来自“内部威胁”攻击的漏洞。内部攻击并不仅仅归因于员工——有权访问内部服务器的承包商和供应商都是内部威胁的一部分。\n\
  \n**注意** 尽管好莱坞喜欢在电影情节中使用邪恶黑客入侵公司网络，但现实情况大不相同。大多数攻击（无论是有意的还是无意的）都来自员工或承包商的系统，并从公司网络内部发起，而不是从外部。渗透测试应该包含内部和外部渗透测试，以确保所有安全漏洞都被识别。\n\
  \n## 外部实验室\n\n在外部渗透测试项目中，目标是识别穿越网络中各种障碍（如防火墙和入侵检测系统 [`IDSes`）的方法，并获得这些防御背后的系统。为了完成这项任务，渗透测试系统需要放置在外部网络中。通常，系统被放置在独立的*非军事区*中，以便对渗透实验室系统的访问受到限制，但对公司资产的访问与任何连接互联网的系统类似。\n\
  \n## 设备\n\n进行内部或外部渗透测试所需的设备各异，取决于公司的大小和需求。通常，使用多个平台来托管不同的应用程序，例如漏洞识别程序、漏洞利用平台、网络扫描器和其他黑客工具。在进行远程破解攻击的情况下，必须解决带宽限制。公司渗透测试人员还可以从具有处理能力的服务器受益，特别是当需要进行密码或加密破解时。渗透测试设备的物理访问应受到控制。实验室设备不应让渗透项目之外的任何人访问。可能的物理访问使得访问系统变得更容易，因此应根据数据敏感性评估并加强物理安全。\n\
  \n## 软件\n\n有很多商业和开源工具供渗透测试人员使用，可以提高渗透测试的速度和准确性。可以在 [www.sectools.org](http://www.sectools.org)\
  \ 获取工具列表。我们在第二部分讨论 sectools.org 网站列出的工具，并在章节示例中使用商业和开源工具。使用哪些工具取决于渗透测试的目的、业务需求和预算——在大型组织中，包含各种应用程序以涵盖所有类型的渗透测试并不罕见，包括针对网络、系统、数据库和\
  \ Web 攻击设计的应用程序。\n\n### 保护渗透测试数据\n\n在渗透测试过程中，工程师会访问性质敏感的客户数据。在渗透测试期间保护收集的客户数据至关重要。本节将讨论保护客户数据和渗透测试系统的一些挑战和解决方案。\n\
  \n## 加密方案\n\n在渗透实验室中，使用了许多不同的操作系统和软件应用程序。安全地存储这些磁盘非常重要，原因有二：(1) 磁盘会长脚并“走出”实验室（无论是有意的无意的）；(2)\
  \ 磁盘上数据的完整性至关重要。\n\n### 数据加密\n\n\n\n\n\n关于安装盘的“流失”问题，任何支持过网络的人都会发现自己光盘短缺。有时是因为人们借走了它们，或者网络管理员忘记将光盘留在了光驱槽中。虽然这看起来可能并不严重，但软件的丢失通常意味着程序和控制措施薄弱，这可能会威胁渗透测试团队的信誉。如果任何包含第三方应用程序或操作系统的安装盘离开了渗透测试实验室，敏感数据泄露的风险可能较低。然而，如果安装盘包含敏感信息（例如专有软件代码或配置信息），数据丢失可能会造成财务上的损失。为了防止任何损失演变成公司灾难，应尽可能对所有数据进行加密。这包括实验室系统中的静态数据——因为设备也可能像安装盘一样容易被“流失”。对所有静态数据强制加密给实验室工程师增加了了额外责任，因为加密密钥必须得到妥善保护。其他可以考虑的加密方法包括硬盘加密和基本输入/输出系统（BIOS）密码保护。存在某些应用程序可以加密整个整个硬盘，这可以在硬盘（或整个系统）被盗时保护数据免受未经授权的泄露。虽然设备丢失可能代价高昂，但任何敏感数据的丢失可能会糟糕得多。BIOS\
  \ 密码保护还降低了恶意用户访问系统数据的风险，特别是对于笔记本电脑。系统可以配置为在启动前需要 BIOS 密码，从而有效防止未经授权的用户访问系统。\n\n\
  ### 数据哈希\n\n安装盘的完整性问题也是一个严肃的问题。某些操作系统和补丁盘是通过定义良好且安全的通道交付的；但大多数情况下，补丁和更新是直接从互联网下载的。通过互联网下载软件的人如何知道他们下载的内容是文件的真实副本，且没有被损坏或被恶意篡改呢？答案是哈希函数。所有为渗透测试实验室下载应用程序和软件都应该使用哈希函数进行验证。`hash\
  \ function` 是一种数学过程，将文件转换为单个值。这个值在（理论上）对于每个文件都是唯一的。对文件的任何修改，即使只改变一个位，也会剧烈改变哈希值。最流行的是\
  \ `MD5`，对于那些具有安全意识的软件编写者，每个下载项通常都有一个发布的 `MD5` 值。一旦渗透测试团队下载了文件，关键的一点是对文件进行 `MD5 hash`\
  \ 校验并与作者发布的值进行比较，以确保他们拥有文件的真实副本。一旦验证通过，应将该值记录在某处以备后参考，例如存储在保险箱的文件夹中。\n\n**警告** 程序可能具有不同的哈希值，取决于它被编译运行的操作系统。在一个\
  \ Linux 发行版中的 `MD5 hash` 可能在另一个发行版（如 Microsoft Windows）中有所不同。在记录哈希时，跟踪你正在使用的哪种操作系统发行版非常重要。`MD5\
  \ hashes` 也应该在任何安装盘上使用，以验证使用的是正确的光盘，特别是在它们被用于渗透测试实验室之前。这让渗透测试团队确信他们使用的是文件的真实副本。验证哈希可以提供一种机制，用于检测何时考虑在实验室中使用错误版本的应用程序。通过将应用程序的\
  \ `MD5 hash` 与一份打印的列表进行比较，可以很快看出是否在实验室中选择了错误的光盘或文件。\n\n### 加固渗透测试系统\n\n作为最佳实践，所有计算机都需要具备防护措施，其强度至少应与其存储数据的价值相等。保护你的系统所需的最低保护水平应由你的公司政策概述。然而，超出这一水平总是可以接受的。在公司政策似乎并不足够的情况下，这里是一些可以改进你的保护措施的建议：\n\
  \n- **加密硬盘**：在 Windows 的后续版本中，文件、目录甚至整个硬盘都可以被加密。然而，要理解解密硬盘有多种方法——计算机加密通常由公司控制，并希望掌握在渗透测试人员手中。\n\
  - **将硬盘锁在保险箱中**：如果硬盘可以从工作电脑上取出，将硬盘放在保险箱中是保护它们的极佳方法。在火灾或地震等物理灾害发生，硬盘可能会完好无损地出来（取决于保险箱的质量）。如果工作电脑是笔记本电脑，请将整个笔记本放在保险箱内。在客户现场使用的笔记本电脑应该始终处于安全状态，并且绝不能无人看管。将笔记本留在汽车内绝不能被视为保护方法。\n\
  - **将系统存放在物理控制的内**：渗透测试实验室应位于具有物理安全控制的独立房间，以限制授权的人员访问。在许多大型组织中，测试实验室是分开并位于钥匙控制门后的。然而，在许多情况下，渗透测试实验室占据了来自各个部门服务器的空间。这可能会产生问题；拥有这些其他服务器合法权限的人可能不应该拥有渗透测试服务器的物理访问权限，因为它们可能包含比房间内其他系统更具性质的数据。\n\
  - **对渗透测试系统进行渗透测试**：了解渗透测试系统是否容易受到攻击，最好的方法莫过于实际上攻击它们。自然地，需要提前进行备份（并妥善保护），并在之后执行清理程序。\n\
  \n**备份可能会被感染**\n\n我最糟糕的经历之一是处理 `Blaster Worm`。我当时工作的公司遭受了严重打击，花了很长时间才清理网络。更糟糕的是，我们近一年的时间里每月至少感染一次，网络团队和安全团队都无法弄清楚\
  \ `Blaster` 是如何穿透我们的防御的。后来，我们发现生产实验室创建了各种受感染服务器的副本作为“镜像”映像，这些镜像可以快速恢复服务器。虽然对于实验室团队来说这是一个非常节省时间的工具，但每当他们使用受感染的镜像映像启动服务器时，网络就会受到冲击。\n\
  \n\n\n\n\n许多渗透测试是在客户的财产附近或其内部进行的。随着当今移动技术的发展，许多渗透测试都包含了对无线网络的检查。在涉及无线网络（或任何网络）的渗透测试中，必须发生的第一件事是\
  \ `PenTest` 团队需要获得该网络的访问权限。是通过网络的无线部分还是通过墙上的插座进行访问，这并不重要，重要的是建立了访问。当通过无线进行访问时，会产生额外的风险——敏感数据被截获。在某些情况下，客户的无线接入点没有使用强效的加密方法来保护传输到连接客户端的数据。如果渗透测试涉及访问无线接入点，最好限制无线访问并仅在需要时使用。一旦完成无线网络访问，渗透测试人员应尝试将该访问权限转移到有线网络，以便在何可以实施额外的保护措施。\n\
  \n另一个与移动计算相关的安全问题是对 `PenTest` 系统的访问。在大型企业中，`PenTest` 系统被永久放置在不同地理位置的内部和外部网络中，以便渗透测试人员可以远程攻击资产。这有助于更好地了解内部和外部威胁存在哪些风险，从而针对威胁采取适当的安全措施。对远程\
  \ `PenTest` 系统的访问需要使用强安全控制进行管理。网络 `PenTest` 系统应该放置在限制了外部访问的安全网络中；可以使用虚拟专用网络（VPN）来控制对网络的访问，同时仍允许渗透测试工程师访问其系统以便他们发起攻击。\n\
  \n## 无线实验室数据\n\n渗透测试实验室可能包含无线接入点，为 `PenTest` 工程师提供测试无线黑客技术的环境。在需要无线接入点的情况下，保护实验室内的系统非常重要，因为无线信号的访问会延伸墙壁和地板。为了保护系统免受未经授权的访问，应该创建两个独立的实验室——一个用于练习无线攻击的无线实验室，和一个用于进行系统攻击的独立实验室。无线实验室应用于训练无线黑客技术或对自定义配置进行测试。在你的无线实验室附近有多个无线接入点的情况下，需要极其小心，以确保对实验室无线网络的访问受到控制，至少要使用强加密和强身份验证方法。目前的科技（如\
  \ `WPA2`）应当是建立和运行无线渗透测试实验室的标准做法。强安全和隔离的无线网络不仅保护了渗透测试实验室内的数据，还保护了意外连接到实验室的任何人，特别是在那些将病毒、蠕虫或僵尸网络用于测试目的的情况下。\n\
  \n## 工具与陷阱……\n\n## 自动连接的危险\n\n不久前，我在家里搭建了一个无线实验室。事实证明，我公寓隔壁的当地警察局与我打算用于测试的无线配置相同。经过进一步检查，我意识到警察局设置其无线接入点时没有进行加密。如果我当时直接插上\
  \ `BackTrack LiveCD` 并开始黑客攻击，很有可能我攻击的是警察的网络，而不是我自己的。我不确定他们是否会对我的活动表现得友善。\n\n## 额外的网络硬件\n\
  \n在企业环境中，网络硬件通常包含在网络评估的渗透测试中。在生产网络中，攻击网络设备（如 `routers`、`IDSes`、`firewalls` 和 `proxies`）有时会导致网络崩溃或拒绝服务\
  \ (`DoS`）。\n\n在企业环境中，`PenTest` 项目通常将它们的攻击分为两种不同的场景。第一种场景是攻击与生产网络相同的测试网络。这允许网络管理员监控\
  \ `PenTest` 对网络的影响。在测试网络经过充分测试后，从攻击测试网络中学到的知识将用于攻击生产网络，但会排除那些更具攻击性的方法。对于个人渗透测试实验室来说，访问网络设备比在企业世界要困难得多。为了练习针对网络设备的攻击和规避技术，通常需要硬件。如果个人实验室的唯一目标是学习如何攻击应用程序和操作系统，则可以忽略网络硬件。然而，为了理解网络攻击涉及的所有细微差别，真的没有购买硬件的选择。\n\
  \n注意：尽管网络配置似乎在渗透测试的主题之外，但理解如何读取配置并学习网络设计的“最佳实践”对于渗透测试是非常有帮助的。正如我们在第 3 章中讨论的，具有网络架构背景的渗透测试人员可以识别各种网络设计中的缺陷，这可能是渗透测试项目成功的关键。\n\
  \n### 路由器\n\n路由器攻击可能是网络渗透测试中最常见的攻击类型。在 `PenTest` 实验室中包含路由器和交换机将为网络攻击提供额外的教育维度，包括路由器配置错误、网络协议攻击和\
  \ `DoS` 攻击。家用路由器不是包含在个人实验室中的良好选择，因为它们仅仅是真实网络设备的精简版。购买哪种路由器是个人选择，取决于选择了何种网络架构职业路径。提供网络认证的公司是选择哪些路由器的良好信息来源。例如，在选择\
  \ Cisco 或 Juniper 认证时，获得建议的用于 Cisco 认证网络专业人员 (`CCNP`) 或 Juniper 认证互联网专家 (`JNCIS-ER`)\
  \ 的路由器是明智的。如果资金不是问题，那么获得建议的 Cisco 认证互联网专家 (`CCIE`) 或 Juniper 网络认证互联网专家 (`JNCIE-ER`)\
  \ 实验室设备是最合理的。\n\n### 防火墙\n\n\n\n\n规避防火墙是一项需要练习的高级技能。其困难之处之一在于识别何时是防火墙阻止了后端系统的访问，而何时系统本身才是障碍。有状态和无状态的防火墙会带来不同的问题，这同样需要通过练习来识别和克服。网络防火墙设备可以从供应商处获得，例如\
  \ `Cisco`、`Juniper`、`Check Point` 等。也有一些开源替代方案，包括客户端防火墙（如 `netfilter/iptables`）。开源替代方案提供了一个真实的目标，并且具有免费的额外优势。从供应商处获取设备的优势用在于，熟悉商业防火墙上不同的配置有助于企业渗透测试，因为在大型组织中很少看到开源防火墙。渗透测试实验室并不需要购买高端防火墙。低端厂商产的防火墙包含与高端防火墙相同的操作系统和代码库。通常，廉价和昂贵厂商设备之间的区别在于带宽。\n\
  \n## 入侵检测系统/入侵防御系统\n\n`IDS` 和入侵防御系统（`IPS`）的规避在渗透测试的早期非常有帮助。最终，渗透测试团队将尝试触发 `IDS/IPS`\
  \ 系统以警报网络管理员注意团队的黑客尝试，但最初，渗透测试团队将尝试在不被发现的情况下获取尽可能多的信息，以测试客户的应急响应程序。可能被广泛使用的 `IDS/IPS`\
  \ 系统是名为 `Snort` 的开源软件应用程序，可以在 [www.snort.org](http://www.snort.org) 获取。许多用于检测网络目标上恶意活动的规则针对病毒和蠕虫活动设计。然而，也有一些规则设计用于检测黑客尝试，例如暴力破解攻击和网络扫描。理解“事件阈值”并学习修改攻击速度可以帮助成功完成专业的渗透测试。\n\
  \n## 总结\n\n在本章中，我们讨论了围绕渗透测试实验室的一些通用概念，包括个人实验室和企业实验室。个人实验室的首要目的是教育，可用于重现针对专有和开源软件及操作系统的漏洞利用。我们将使用\
  \ `VMs` 在个人实验室中完成书本及附带 DVD 中的示例。如果 `VM` 软件不是一个选项，可以将 `LiveCDs` 刻录到 CD 介质并在物理实验室内的系统上使用。在\
  \ 第 5 章 中，我们将更详细地介绍在实验室中使用 `LiveCDs`。然而，企业实验室用于识别内部和外部网络中的系统漏洞。预计工程师已经具备了进行渗透测试所需的知识；在需要测试的情况下，在对生产服务器进行任何渗透测试之前，测试实验室是首选目标。可以将网络设备添加到渗透测试实验室，以提供额外的真实感和学习机会。对于路由器和交换机，最好获取商业版本，因为为家庭用户设计的设备往往不是大型企业所用设备的良好范例。对于防火墙和\
  \ `IDS` 设备，有开源版本可以准确地模拟商业设备。\n\n## 解决方案快速车道\n\n### 个人实验室\n\n- 成本通常是保持个人实验室较小且易于管理的驱动因素。\n\
  - 除非个人实验室保留任何敏感数据，否则可以消除许多安全控制。\n- 开源软件通常足以学习黑客技术，包括系统、应用、数据库和 Web 攻击，除非需要获取专有软件。\n\
  \n### 企业实验室\n\n- 渗透测试系统的精确架构将取决于公司的业务需求以及渗透测试期间收集的数据的敏感性。\n- 内部渗透测试的目的是识别易受“内部威胁”攻击的漏洞。\n\
  - 在外部渗透测试项目中，目标是识别穿透防御的方法。\n\n### 保护渗透测试数据\n\n- 在实验室中使用的所有应用程序和软件都应使用哈希函数进行验证，以保护渗透测试资产。\n\
  - 渗透测试系统通常包含需要安全控制的数据。\n\n### 附加网络硬件\n\n- 在生产网络中，攻击设备有时会导致网络崩溃或服务器 `DoS`。在针对生产网络之前，在测试网络中进行是谨慎的。\n\
  - 渗透实验室可以引入路由器以学习网络渗透技术。商业路由器和交换机优于家庭设计的设备。\n- 开源防火墙可以用于学习防火墙规避技术。如果目标是学习防火墙配置及其误配置，商业防火墙是有益的。\n\
  - `Snort` `IDS` 应用程序是实验室中的价值工具，用于学习如何修改攻击速度以避免检测。\n\nQ：Linux 系统上还有其他 `VM` 软件吗？答：`Xen\
  \ Hypervisor` 已成功在 Linux 上用于托管 `De-ICE LiveCDs`。`Xen` 可以在 [www.xen.org](http://www.xen.org)\
  \ 获取。\n\nQ：如果我在实验室中使用无线接入点，或者使用任何加密，我应该关心什么？答：围绕未经访问无线网络的法律仍在制定中。问题是大多数无线设备被配置为自动连接到最强信号。如果该信号来自实验室，用户可能甚至没有意识到他们已经连接到了敌对网络。强加密可以防止事故的发生。\n\
  \nQ：如果我感兴趣的只是 Web 黑客攻击，我应该考虑在向我的实验室中添加网络设备吗？答：可能不需要。然而，网络中使用 Web 代理将提供额外的挑战，并提供更符合大型企业保护其\
  \ Web 服务器的真实场景。在实验室引入网络设备增加了真实性，并可以提高渗透工程师的技能和知识。\n\n## 扩展你的技能\n\n想了解漏洞验证吗？以下练习旨在为你提供额外的知识和技能，以便你更好地理解此主题。请使用你的实验室进行以下练习。\n\
  \n\n\n\n\n## 使用 VMware 创建个人实验室\n\n1. 从 [VMware.com](http://VMware.com) 下载 VMware\
  \ Player。在符合本章列出要求的 Windows 系统上安装该软件。\n2. 通过下载并运行 VMware 网站提供的预制“虚拟设备”来测试安装情况，地址为：[www.vmware.com/appliances/](http://www.vmware.com/appliances/)。不要关闭此虚拟机（VM）。\n\
  3. 使用随附 DVD 提供的 BackTrack ISO 和 `VMX` 文件，通过双击 `VMX` 文件启动镜像。你应该会有两个 VM Player 实例在运行——一个是第\
  \ 2 步中下载并启动的虚拟设备，另一个 BackTrack 镜像。如果两个系统都能运行且没有性能下降，那么你的系统将能够完成书中提供的练习以及 DVD 上的视频教程。\n\
  \n## 使用网络设备扩展个人实验室\n\n1. 在互联网搜索引擎上查询“CCIE Lab Equipment”。列出推荐的路由器。推荐哪些交换机？推荐哪种网络操作系统（`IOS`）？\n\
  2. 访问 [Snort.org](http://Snort.org)，从网站的文档部分获取“Snort 用户手册”。识别手册中列出的“预处理器”（Preprocessors）。什么是事件阈值触发（Event\
  \ Thresholding）？根据 Snort 手册，“三种类型的阈值触发”是什么？它们的警报频率是多少？\n3. 定义 `iptables` 和 `netfilter`。两者之间有什么区别？请参考\
  \ Mertvago, P., *The comparative Russian-English dictionary of Russian proverbs\
  \ & sayings*. (1995) Hippocrene Books, New York 。\n\n# 第 5 章：在实验室中创建和使用渗透测试目标\n\n\
  ## 引言\n\nУчение в счастье украшает， а в несчастьи утешает。 俄罗斯谚语：*“学习是幸运中的点缀，是不幸中的慰藉。”*\
  \ (Mertvago, 1995)。在上一章中，我们讨论了不同类型的渗透测试实验室，包括个人和企业级。我们还探索了书中练习所需的渗透测试实验室配置是怎样的。在本章中，我们将更更详细地讨论实验室设计，并探讨练习渗透测试技能的几种不同方法。我们已经讨论过未经许可的情况下攻击目标的伦理问题，因此为了论证起见，我们假设所有对真实目标的攻击引用都是在法律和伦理允许范围内进行的。真实目标提供了学习黑客技巧的绝佳机会，因为它们是学习黑客所花费资金和时间的合理理由。然而，真实世界的服务器很难获得（即使通过合法渠道），这就是为什么渗透测试实验室如此重要。实验室提供了一个训练场地，可以在那里犯错、吸训并精炼技能。遗憾的是，渗透测试实验室可能昂贵，并且可能无法反映真实目标。我们将讨论真实攻击与实验室场景之间的差异，以便我们有效管理学习黑客的成本和时间。某些应用程序被开发用于在受控环境中学习渗透测试技术。我们将识别那些可以在实验室使用的、模拟包含可利用漏洞的真实服务器的应用。我们还将识别有助于专业渗透测试人员提高技能的\
  \ Web 挑战以及黑客大赛。恶意软件分析是渗透测试可能的可能的用途。本章还将讨论如何从互联网获取恶意软件，以及如何在受控且安全的情况下分析恶意二进制文件。\n\
  \n## 开箱方案对比真实目标\n\n无论某人是在大型全球性公司的渗透测试团队，还是刚刚在公寓的空房间里起步，并不重要。对于那些拥有公司资金支持的人，练习目标通常是内部系统，或已签约渗透测试的客户系统。对于那些没有“现成”系统的人，目标必须临时凑出来，希望从中能学到有价值的东西。在本节中，我们将讨论在实验室环境中学习进行渗透测试相关的问题，并查看开箱方案和真实目标的优缺点。\n\
  \n## 学习黑客的问题\n\n为了最好地描述学习黑客的问题，我想分享一下我自己的个人经历。当我第一次想学习如何攻击计算机系统时，我发现有几本书可以指导我如何进行渗透测试。然而，我确实在互联网上发现了大量的渗透测试工具，以及许多使用这些工具的示例。我很快发现，尽管有许多工具和示例，我无法在网上找到任何合法的目标来练习。那时，我决定需要一个自己的渗透测试实验室。作为一个电脑极客，我自然有很多闲置的额外系统。我拿了一个旧系统，加载了没有打补丁的\
  \ `Microsoft NT`。我安装了微软的 `IIS` Web 服务器并创建了一个非常无聊的 Web 页面，以便我有东西测试。我对目标运行了 `Nessus`\
  \ 扫描，发现 `Microsoft NT` 确实存在可利用漏洞。我启动了 `Metasploit` 来利用发现的漏洞之一。果如其然——我进入了系统，并获得了管理员权限。然后我修改了\
  \ Web 页面以证明我可以篡改它，并且成功了。之后，我坐下来思考我刚才做了什么。然后我嘲笑自己，我什么都没学到——我攻击了一个我已知有漏洞的机器，并使用了完成所有工作的工具。在他们看来，这是一次毫无意义的尝试。我知道我自己的个人经历已经根据\
  \ [Heorot.net](http://Heorot.net) 论坛上的帖子被多次上演。根本问题在于，一个人无法创建一个可以让自己从中学习的渗透测试场景。通过开发渗透测试场景，创建者会自动知道如何利用系统；唯一的学习方法是针对他人创建的场景进行练习。学习任何东西都必须存在不确定因素。直到最近，还没有可以练习的开箱方案。这种情况在过去几年里发生了变化，进入专业渗透测试领域的人可以在比以前安全得多的环境中学习攻击技术。\n\
  \n## 真实场景\n\n\n\n\n使用真实世界的服务器学习黑客是有风险的。如果操作失误，拥有该服务器的公司可能会遭受财务损失。即使没有产生损失，也有很大可能发生疏忽，导致系统漏洞未被识别。由于\
  \ `learning` 一词意味着渗透测试工程师可能没有足够的知识来识别所有漏洞，因此不能假设发现结果是准确或完整的。在某些情况下，公司会为渗透测试人员提供生产测试实验室。这些实验室通常与生产系统非常接近，可以为渗透测试团队提供一个无风险的培训机会。遗憾的是，生产实验室非常昂贵，而且实验室的可用性通常有限；生产实验室通常忙于测试新的补丁、软件和硬件。允许渗透测试人员在实验室中进行练习通常被分配到非常低的优先级。使用生产测试实验室的一个更严重的障碍是，网络和系统管理员通常不希望渗透测试工程师攻击他们的系统，即使在实验室里也是如此。在实验室中的任何发现都会让实验室所有者面临巨大的压力，要求他们增加测试系统和生产网络的安全性。除了额外的工作负载，安全发现可能会让实验室所有者觉得自己也成了目标，并被针对了。他们可能认为任何发现都会反映他们作为网络或系统管理员的水平。为了有效地允许渗透测试人员在生产测试实验室或针对生产系统进行练习，资产所有者与渗透测试团队之间存在高水平的沟通与合作，并且高层必须支持这项工作。在个人实验室中使用真实目标也是可能的。真实世界的漏洞几乎每天出现在新闻中；在某些情况下，可能可以使用相同的软件和硬件在实验室中重建事件。复制真实事件的缺点是，并不总是能够完全重现事物。公司不愿讨论攻击的细节或被利用网络的详细信息。重建真实事件通常是最好的猜测，并且可能不包括安全事件中发现的防御措施，如防火墙和入侵检测系统。大型公司中的可利用漏洞通常会通过多种防御措施得到缓解，由于没有在实验室中包含这些防御，学习体验会受到损害，因为在没有防火墙和入侵防御系统的情况下，利用系统通常更容易。如果有人试图理解针对公司的真实漏洞利用的全貌，必须也识别网络防御措施；在许多情况下，导致安全泄露的不仅仅是一个漏洞系统。\n\
  \n# 开箱场景 (Turn-Key Scenarios)\n\n如所述，现在创建的开箱渗透测试场景比过去要多。结果是更多的人能够学习如何安全地进行渗透测试。开箱渗透测试场景的缺点是它们只是\
  \ `imitate` 真实服务器，但可能并得不忠实。大多数开箱解决方案专注于渗透测试中的一个特定方面。`Foundstone` 和 `WebGoat` 服务器集中于结构化查询语言\
  \ (`SQL`) 和基于 Web 的漏洞，而 `Damn Vulnerable Linux (DVL)` 专注于 Linux 操作系统 (`OS`)攻击。`De-ICE\
  \ LiveCD` 服务器试图模拟可利用的应用程序和配置漏洞，而 `pWnOS` 提供了各种可用于脚本攻击的应用程序。所有这些场景都模拟了真实事件，但可能无法反映今天的真实环境。尽管有这些缺点，开箱场景仍然学习如何进行渗透测试的首选方法。测试服务器可以快速重建（特别是使用\
  \ `LiveCDs` 和虚拟机时），并且通常提供说明文档，当用户卡住时，文档会引导他们完成漏洞利用。尽管这些开箱解决方案专注于几个不同的攻击向量，但它们通过包含在现实情况中见过的漏洞来挑战用户；它们可能无法反映在专业渗透测试中遇到的所有组件，但它们确实提供了关于渗透测试如何演变的接触。结合正式的方法论培训，开箱场景有助于学习执行专业渗透测试所需的基础知识和中间技能。目前，渗透测试实验室仅有少数基于实验室的场景。有很多网站提供模拟的\
  \ Web 攻击，例如 `SQL` 攻击、目录遍历和 Cookie 操纵；虽然 Web 漏洞攻击是一项关键技能，但它只是开展全面渗透测试项目的一个小部分。对于那些在有现有生产目标供训练的公司工作的人，请认为自己是幸运的。对于大多数人来说，我们必须依靠创建自己的场景，或者寻找预先制作的场景。以下是一些较著名的开箱场景，可以使用它们进行练习以学习渗透测试技能。\n\
  \n## 什么是 LiveCD？\n\n`LiveCD` 是一种可启动光盘，包含一个完整的操作系统，能够运行和服务和应用程序，就像安装在硬盘上的服务器一样。然而，该操作系统自包含在\
  \ CD 中，不需要安装到你的计算机硬盘上即可工作。`LiveCD` 在运行时既不会改变你系统当前的操作系统，也不会修改系统硬盘；`LiveCDs` 可以用于不包含硬盘的系统上。`LiveCD`\
  \ 不改变任何内容，因为它从内存中运行一切——它也将所有目录都挂载到内存中。因此，当系统“写入数据”时，它实际上是将该数据保存在内存中，而不是某些存储设备上。当我们使用完随附\
  \ DVD 中包含的任何 `LiveCDs` 后，只需拔掉光盘，重启系统，就会回到原始的操作系统和系统配置。虽然我们在整书中都会提到 `LiveCDs`，但另一个选项是使用\
  \ `Live USB` 闪存。优存盘可以包含与 `LiveCDs` 相同的文件，并且启动方式与 `LiveCDs` 类似；`Live USBs` 比 `LiveCDs`\
  \ 的优势在于优存盘上的数据可以轻松更改并持久化。有关下载的 `LiveCD`（或 `Live USB`）镜像列表，请访问 [www.livecdlist.com](http://www.livecdlist.com)。\n\
  \n## De-ICE\n\n\n\n\nDe-ICE LiveCD 旨在为提供练习和学习渗透测试（PenTest）技能的合法目标，它们是包含真实挑战的服务器。每张光盘提供了一个探索渗透测试世界的机会，既适用于初学者也适用于专业人士。De-ICE\
  \ 项目自 2007 年 1 月起发布，已在美国各地的安全会议上进行过，并首次在 Syngress 于同年 9 月出版的名为 *Metasploit Toolkit\
  \ for Penetration Testing, Exploit Development, and Vulnerability Research* 的书中被提及。\n\
  \n目前位于 [www.heorot.net/livecds/](http://www.heorot.net/livecds/)，那里有多个 LiveCD 可供免费下载（这些也包含在附带的\
  \ DVD 中）。这些服务器提供了基于 Linux 发行版“Slax”（源自 slackware）构建的真实世界场景。在这些光盘上，包含了可能可以被利用也可能不可被利用的不同应用程序，这就像现实世界一样。挑战在于发现哪些应用程序配置不当或可被利用，并获取\
  \ root 账户的未经授权访问权限。\n\n使用这些 LiveCD 的优势是不需要任何服务器配置——LiveCD 可以直接放入 CD 驱器，配置系统从 CD\
  \ 启动，几分钟内，实验室中就会运行一个功能完全的可黑客攻击服务器。我们也可以直接在虚拟机中使用 LiveCD 镜像，如第 4 章 所示，这让事情变得更加简单。De-ICE\
  \ 光盘的开发旨在演示系统和应用程序配置中常见的问题。\n\nDe-ICE 光盘中包含的可能漏洞列表如下：\n* 错误/弱密码\n* 不必要的服务（文件传输协议\
  \ [`ftp`]、`telnet`、`rlogin` [`?!?!]`）\n* 未打补丁的服务\n* 可用信息过多（联系信息等）\n* 糟糕的系统配置\n*\
  \ 糟糕或无加密方法\n* 权限过大的用户权限（Elevated user privileges）\n* 无 IP 协议安全 (IPSec) 过滤\n* 错误的防火墙规则（插上就忘了？）\n\
  * 明文密码\n* 软件中嵌入用户名/密码\n* 无告警监控\n\nDe-ICE 挑战中不包含已知的漏洞利用，消除了使用自动化漏洞识别应用程序的可能性。\n\n\
  ## 场景\n\n附带的 DVD 包含了三个提供的 De-ICE LiveCD。它们每一个都有一个不同的场景，并需要不同的技能来解决。较易的挑战是 1.100\
  \ 和 1.110 场景，而更困难的场景是 2.100。\n\n### 1.100\n\n此 LiveCD 配置的互联网协议 (IP) 地址为 `192.168.1.100`——不需要对服务器进行任何额外配置。此\
  \ LiveCD 的场景是：一家小公司的首席执行官 (CEO) 在董事会的压力下，要在公司内部进行渗透测试。CEO 认为他的公司是安全的，觉得这极度浪费资金，特别是他已经让一家公司使用\
  \ `Nessus` 扫描过其网络漏洞了。\n\n为了让董事会满意，他决定雇你做一份为期 5 天的工作；由于他真的不相信公司是不安全的，他合同让你只查看一台服务器——一个旧系统，上面只有一个基于\
  \ Web 的公司联系信息列表。CEO 期望你证明系统管理员遵循了所有适当且认可的安全实践，并且你无法获得该机器的访问权限。PenTest 实验室系统和 PenTest\
  \ 机器必须连接到配置了以下值的路由器：\n* 动态主机配置协议 (DHCP) 服务器：已激活\n* 地址池起始地址：`192.168.1.2`\n* 局域网传输控制协议/网协议\
  \ (LAN TCP/IP)：\n* IP 地址：`192.168.1.1`\n* IP 子网掩码：`255.255.255.0`\n\n**警告**：大多数人在使用\
  \ De-ICE 光盘搭建 PenTest 实验室时，会尝试“ping”系统以查看一切配置是否正确。某些真实世界的系统被`刻意`配置为`忽略` ping 请求。不要仅仅因为服务器对\
  \ ping 没有响应，就假设实验室设置有问题。\n\n**注意**：在图 5 中，大多数人在使用 De-ICE 光盘搭建 PenTest 实验室时，会尝试“ping”系统以查看一切配置是否正确。某些真实世界的系统被`刻意`配置为`忽略`\
  \ ping 请求。不要仅仅因为服务器对 ping 没有响应，就假设实验室设置有问题。\n\n### 1.110\n\n此 LiveCD 配置的互联网协议 (IP)\
