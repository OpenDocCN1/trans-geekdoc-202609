    # CHAPTER 3


    # Attack Vectors Management on Blockchain


    ## Introduction


    Crypto investors lost nearly $4 billion to hackers in 2022, with DeFi protocols
    being hit the hardest by cryptocurrency hacks. To better understand what has happened
    in recent years, the following analysis chart can provide you with the seriousness
    of the matter. What could have been the main reason for these exploitations? If
    you are thinking about code, AKA Smart contract vulnerabilities, you are right.
    However, that is just the tip of the Iceberg.


    The truth is, all of these losses could have been significantly reduced if platform
    vulnerabilities had been identified early in the design. It could have been much
    less if the risk management had been performed, based on the impact and probability
    of occurrence, and followed up with mitigating controls and remediation procedures.


    It is a well-known known fact that if hackers can see your application on the
    internet, they will do whatever they can to exploit the weakness, as evidenced
    by news reports and the numbers on social media. It is also true that the hacks
    can be mitigated; there are methods for handling these risks and safeguarding
    your system.


    To accomplish this, it is crucial to detect any potential vulnerabilities in your
    system at an early stage, classify and filter whether these risks can be exploited,
    and do the math to determine if it makes sense to safeguard them. As an example
    of effective risk management, there are cases when vulnerable network elements,
    which you are trying to secure, are present in a private subnet, not exposed to
    the outside world nor part of critical assets. The risk score for such elements
    can be low, you wouldn’t want to spend 100$ worth of a lock to protect 10$ worth
    of an isolated asset.


    In this chapter, I will walk you through the cycle of blockchain risk management.
    We will then learn the tools like threat modeling and the classification matrix
    to scope and prioritize the risk domains. While doing all this, we will explore
    and analyze some use cases and examples of sample attacks to see how all of this
    applies.


    # Structure


    We will be covering the following topics in this chapter:


    * Blockchain risk management

    * Top security risk in blockchain

    * Threat model overview and architecture

    * Applying Threat Modeling to Blockchain

    * Mitigation against STRIDE Attack Vectors


    ## Blockchain risk management


    New technologies may have drawbacks that need to be discovered and dealt with.
    This is especially true when the technology is a fundamental component of the
    organization''s underlying IT infrastructure, rather than just an overlaying application,
    as is frequently the case with the blockchain.


    If I ask you a simple question: how much security is enough in your blockchain
    application? Or rather how much are you willing to spend on security controls?
    The answer to this depends on your risk management exercise. However, before we
    go any further, let’s start with the basics, by defining risk, attack vector,
    and mitigation.


    * **Risk** is a potential problem and its effects if the problem occurs.

    * **Threat or Attack vector** is a path that can be exploited in the risk occurrence.
    A common example includes infected email attachments and malicious web page pop-ups.

    * **Mitigation** is a countermeasure against a threat, something you can do to
    prevent the threat or, at a bare minimum, reduce the likelihood of its success.


    To better understand all this, consider a good example where there is a risk that
    someone could steal your car keys from your house and drive off in your car. The
    attack vector is the different way the attacker can accomplish this, such as breaking
    a window to reach in or breaking the door lock, all this can happen if the breakpoints
    are not hardened. Mitigation is something when you keep the car key out of sight
    or store it in a vault protected with strong cryptographic passwords. Other ways
    could be to protect against all possible attack vectors, such as window and door
    locks should be protected with alarms and watched by a security guard.


    Businesses should be proactive when they look for new risks linked to blockchain.
    You shouldn''t wait until the last minute to do risk management. This should be
    a part of every step of the planning and marketing process for a blockchain project
    from the very beginning.


    The blockchain risk management cycle starts with defining the security objective,
    performing a threat and vulnerability assessment, classifying and quantifying
    risk, and then take the remediation actions.


    ![](images/Figure-3.01.jpg)


    **Figure 3.1:** Risk Management lifecycle


    ## Security objective


    This forms the basis for the risk assessment as a whole and provides guidance
    for all subsequent steps. Considering the plan of action that will be upheld by
    blockchain, what are the key security targets to develop? Should availability
    be more important than confidentiality? Should complete anonymity be ensured?
    What parts of the framework should safeguard data integrity other than a blockchain
    stage?


    The security objective should align with the business goal and be clearly verified.
    For example, providing secure and reliable data storage to authorized third parties
    with the assurance that the platform is appropriate to process sensitive information.
    Here, we are targeting availability and confidentiality. It varies for different
    blockchain platforms; private blockchains support availability and confidentiality,
    whereas data integrity can be difficult to achieve. This is because you rely on
    access control for who can write but cannot control the intent of validators,
    due to no incentive program. On the other hand, with public blockchains, data
    integrity and availability can be achieved, but the goal of data confidentiality
    is difficult to achieve.


    ## Risk Identification


    This exercise will identify the top security threats in your blockchain architecture.
    There are numerous techniques for achieving this, like threat modeling, vulnerability
    scanning, end point detection agents, security audits, and penetration testing
    are the most common tools an organization uses. The goal is to identify what and
    where are the weak links are in our solution before the attacker catches it. This
    evaluation exercise also tells how strong the security posture is, in terms of
    the types of security controls implemented. what would be the outcome of a potential
    attack, and what key data assets do we need to guard against.


    **Note**


    *You will end up with more than 1000 weaknesses if you do this practice all the
    way through. It''s a good idea to start with a high-level design, then do some
    threat modeling to see how the system reacts to an attack, such as what security
    controls are built in by default. This will help you narrow down what''s important
    to you, like if the Man in the Middle (MIM) attack is done by an intruder using
    a sniffer to look for incoming traffic and if you already have strong access control
    with `TLS` enabled.*

