- raw: 'Who are you on the internet? And how much personal information are you sharing
    on the web? As more and more of our lives are spent online and the digital world
    forges stronger connections with the physical world, our electronic identities
    are becoming as important as who we are in real life. Authenticating who you are
    and securing access to your personal information on the internet are now critical
    components of operating in the modern world for both individuals and organizations.


    If you think that you have figured out the identity part, think again. What if
    the identity is spoofed and the request you receive from the trusted IP source
    has been compromised? What will you do then? If you have a distributed and decentralized
    network, then establishing trusted identities becomes even more complicated. The
    only way to control is through the mechanism where trust is established using
    cryptography and by enabling logging and monitoring within your network.


    In this chapter, we will cover blockchain security solutions that can be applied
    to wallets, smart contracts, and infrastructure components to secure confidentiality,
    integrity, and repudiation attacks. The examples and use cases will help you understand
    the concept. This is so fascinating that I cannot wait to take a deep dive straight
    into it. Let’s look at the contents of this chapter.


    # [Structure](#toc.xhtml#s105a)


    We will be covering the following topics in this chapter:


    *   Zero Knowledge Proof


    *   Identity and access management


    *   Public key infrastructure


    *   Security logging and monitoring


    # [Zero-Knowledge Proof](#toc.xhtml#s106a)


    Giving proof to someone without revealing any information. Does this sound complex
    to you? In other words, with zero-knowledge proof, you can provide the validity
    of any claim or statement, without revealing that statement.


    To explain, consider how you might prove a claim (for example, *I am a citizen
    of X1 country*) to an airport control agent (for example, a service provider).
    You would need to provide **evidence** to back up your claim, such as a national
    passport or driver’s license.


    So why do we care, even if we must provide the actual statement, like an ID card,
    to anyone? The problem lies in the handling of such private information. You need
    to store that information in some database if it’s an online portal, and then
    adopt security measures to protect it, for example, encryption access control,
    etc. If your storage endpoints are vulnerable, you can expect a hacker to exploit
    these vulnerabilities. If the leaked information comprises PI data elements, then
    you must face GDPR compliance issues as well.


    To make this all quantifiable and make more sense, consider that 4% of your annual
    revenue and the trust of your customers are at stake.


    Now that you understand the problem, let us see how zero-knowledge proof helps
    in solving it.


    Zero-knowledge proof is a process where the need to share actual information to
    prove the claims is eliminated. The process uses statements as input to generate
    proof of validity without revealing information.


    The process consists of an algorithm that takes some data and returns some output
    as true or false. Here is a breakdown of the components that make up this algorithm:


    *   **Witness**: In a zero-knowledge proof, the person making the claim wants
    to establish that they know something that is hidden. The hidden information is
    the *witness* to the proof, and the prover''s intended knowledge of the witness
    sets up a set of questions that can only be answered by someone who knows the
    information. So, to start the process of proving, the prover picks a question
    at random, figures out the answer, and sends it to the checker.


    *   **Challenge:** The checker picks a random question from the set and asks the
    prover to answer it.


    *   **Response**: The prover takes the question, figures out the answer, and sends
    it back to the checker. The prover''s answer lets the validator find out if the
    prover really has access to the witness. The verifier asks more questions to make
    sure the prover isn''t just guessing and getting the right answers by chance.
    By doing this several times, the chance that the prover may lie about knowing
    the witness reduces significantly until the checker is satisfied.


    Let me explain you this concept with the help of a story.


    *In the story, Peggy is the person who proves the statement, and Victor is the
    person who checks the statement.*


    *Peggy has found the magic word that can be used to open a door in a cave. The
    cave is in the shape of a ring, with the entry on one side and the magic door
    blocking the other. Victor wants to know if Peggy knows the secret word, but Peggy
    is very private and doesn''t want to share either the secret word or the fact
    that she knows it with Victor or the rest of the world.*


    *The left and right paths from the door are marked with A and B. First, Victor
    watches Peggy goes into the cave while he waits outside. Peggy can take either
    road A or B, but Victor can''t see which one she chooses. Then, Victor goes into
    the cave and shouts the name of the way he wants her to take back, either A or
    B. If she really does know the magic word, this is easy. If she needs to, she
    opens the door and goes back the way she came.*


    *But what if she didn''t know the word? Then, she could only go back by the named
    path if Victor told her the name of the same road she had come in on. Victor would
    pick either A or B at random, so she would have a 50/50 chance of being right.*


    *A side point about third-party observers: Even if Victor is wearing a secret
    camera that records the whole deal, the camera will only record Victor shouting
    "A!" and Peggy showing up at A, or Victor shouting "B!" and Peggy showing up at
    B. A tape like this would be easy for any two people to make. All Peggy and Victor
    would need to do is agree ahead of time on the order of the A''s and B''s that
    Victor will shout. A tape like this will never be believable to anyone but the
    people who were there at the time. Even someone who was there to watch the original
    experiment would not be satisfied, because Victor and Peggy might have planned
    the whole "experiment" from beginning to end.*


    *Alternatively,* *Peggy could show Victor that she knows the magic word in just
    one try, without telling him what it is. If Victor and Peggy go to the mouth of
    the cave together, Victor can watch Peggy go in through A and come out through
    B. This would show for sure that Peggy knows the magic word, but she wouldn''t
    have to tell Victor what it is. But a proof like that could be seen by a third
    party or taped by Victor, and that would be enough to convince anyone. In other
    words, Peggy couldn''t get rid of such proof by saying she worked with Victor,
    and she can''t choose who knows what she knows because of that.*


    *Below is a picture of this story. You can think of a million ways that Peggy
    can prove to Victor that she knows the secret, but she doesn''t have to tell him.
    Other people should believe that she did prove to Victor that she knows the secret.*


    ![](images/Figure-6.1.jpg)


    **Figure 6.1:** Conceptual example of zero-knowledge proof (source: Chain-link)


    Now, to explain further, let us understand the different types of Zero-Knowledge
    proof solutions available.


    # [Types of Zero-Knowledge (ZK) Proof](#toc.xhtml#s107a)


    They can be interactive as well as non-interactive. Interactive proof solutions
    need the prover and verifier to exchange messages repeatedly and be available.
    For example, even if a verifier is convinced of a prover’s honesty, the proof
    would be unavailable for independent verification (computing a new proof requires
    a new set of messages between the prover and verifier).'
