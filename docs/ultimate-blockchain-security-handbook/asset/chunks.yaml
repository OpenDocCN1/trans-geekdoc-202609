    它是对开放端口的扫描、公共 IP 地址扫描，以及通过业务逻辑错误和针对所用软件库的常见漏洞检测潜在漏洞。


    Nessus 漏洞扫描是首选方案。它具有良好的覆盖范围，并提供了一个你可以根据区块链应用设计进行自定义的模板。`Nessus` 的工作原理是测试区块链网络上的每个端口，找出了哪些服务，并对每个服务进行漏洞测试。


    `Figure 4.6` 展示了 Nessus 扫描结果的快照。在这里，你可以看到带有评级的漏洞和汇总结果。这让你对应用程序的安全状况有一个大致的了解。


    ![](img/Figure-4.6.jpg)


    **图 4.6：** Nessus 漏洞扫描结果


    此外，Nessus 还提供了极佳的扩展性。你可以利用 Nessus 预设语言编写针对你框架的特定测试。此外，通过 Nessus 还可以使用 Nessus 攻击脚本语言
    (`NASL`) 编写的插件。这些模块包含了弱点信息、建议修复措施的简要数据，以及用于考虑对安全问题进行进一步测试的计算方法。这里是一些插件示例：`[`www.tenable.com/plugins`](https://www.tenable.com/plugins)`。


    # 你知道吗？


    Nessus 经常与 `OpenVAS` 进行对比。`OpenVAS` 是一个基于最初用于 Nessus 的开源代码分支创建的开源弱点扫描器。Nessus
    的代码分支 `GNessUs` 在 Tenable Networks 开始销售 Nessus 后被重命名为 `OpenVAS`。由于其漏洞覆盖的广度和深度，Nessus
    占据了令人羡慕的位置。Nessus 可能已知超过 47,000 个常见漏洞和披露 (`CVEs`)，提供了极好的覆盖。


    除了 Nessus 之外，你还可以利用 smart bugs 框架来分析以太坊智能合约。Smart bugs 框架可以在 GitHub 上获取，它可以扩展并有一种标准方式连接到检查区块链程序漏洞或其他问题的工具。最棒的部分是，它支持多种工具，并对
    solidity、部署字节码和运行时代码采用多种模式。


    `Figure 4.7` 是从 GitHub 截取的片段，显示了 smart bug 框架支持的工具数量。


    ## 注意


    列表仅显示部分工具，并非完整列表。


    ![](img/Figure-4.7.jpg)


    **图 4.7：** Smart Bug Framework 支持的工具


    关于 Smart bugs 的安装、用法和要求的更多细节，可以查看 GitHub URL - `[`github.com/smartbugs/smartbugs`](https://github.com/smartbugs/smartbugs)`。


    # 漏洞利用 (#toc.xhtml#s76a)


    在此阶段，使用 Web 攻击（如跨站脚本、SQL 注入和后门）来寻找目标的弱点。道德黑客随后尝试并利用这些弱点，通常通过提升权限、获取信息、捕获流量等，以理解它们可能造成的伤害。


    这的一个例子是 SQL 注入攻击，它是目前 web3 行业中最普遍的 Web 黑客攻击之一，攻击者利用网站页面贡献在 SQL 语句中嵌入有害代码。这通常发生在网站请求输入时。`Figure
    4.8` 展示了该快照。


    ![](img/Figure-4.8.jpg)


    **图 4.8：** SQL 注入


