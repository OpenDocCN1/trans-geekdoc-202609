    \nNow let’s move one step forward and examine how it works and how it protects\
    \ the users from the lens of confidentiality, integrity, availability, and traceability.\n\
    \nI will try to keep my context on a high level since digging deep into Bitcoin\
    \ core architecture and its various components is beyond the scope of this book.\
    \ We will try to cover all the pieces from a security standpoint. Having said\
    \ that, developing a thorough understanding is equally important, so the reference\
    \ URLs have been provided for you to explor in parallel.\n\n# Bitcoin Working\
    \ Process Overview\n\nTo recap, decentralized trust is the foundation of the Bitcoin\
    \ system, in contrast to conventional banking and payment methods. In Bitcoin,\
    \ instead of relying on a single trusted authority, trust emerges naturally from\
    \ the interactions of various system participants.\n\nBy following a single transaction\
    \ through the Bitcoin system and watching it become trusted and accepted by the\
    \ Bitcoin mechanism of distributed consensus before being recorded on the blockchain,\
    \ the distributed ledger of all transactions.\n\nWe can see in the Bitcoin process\
    \ overview illustration (refer to [Figure 1.5](#c01.xhtml#fig1_5)) that the Bitcoin\
    \ system is made up of users who have wallets that contain both public and private\
    \ keys. Consider a public key like an email address or the identity of a user,\
    \ while the private key unlocks the spends and signs transactions that are spread\
    \ across the network. Miners who produce the consensus blockchain, which is the\
    \ authoritative ledger of all transactions, through competitive computation.\n\
    \nIn addition, there are other participants like exchanges, and merchants, which\
