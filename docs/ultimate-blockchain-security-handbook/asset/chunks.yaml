- raw: 'To explain all this, let us take a look at how you can use foundry to perform
    fuzzing on a command-line tool, Forge, on the contracts.


    **Note**


    *Forge tests, builds, and deploys your smart contracts.*


    Forge will look for the tests anywhere in your source directory. Any contract
    with a function that starts with test is considered to be a test. Usually, tests
    will be placed in test/ by convention and end with **.t.sol**.


    Here is an example of running a forge test in a newly created project, which only
    has the default test:


    `****************`


    `$ forge test`


    `No files changed, compilation skipped`


    `Running 2 tests for test/Counter.t.sol:CounterTest`


    `[PASS] testIncrement() (gas: 28312)`


    `[PASS] testSetNumber(uint256) (runs: 256, μ: 27376, ~: 28387)`


    `Test result: ok. 2 passed; 0 failed; finished in 24.43ms`


    `**********************************************************`


    Let''s write a unit test using Forge, identify the general property we are testing
    for, and change it to a property-based test to see what that means.


    ![](images/Figure-5.1.jpg)


    **Figure 5.1:** Figure sample contract


    Running the test, we see it passes:


    `************************************`


    `$ forge test`


    `Compiling 6 files with 0.8.10`


    `Solc 0.8.10 finished in 3.78s`


    `Compiler run successful`


    `Running 1 test for test/Safe.t.sol:SafeTest`


    `[PASS] testWithdraw() (gas: 19462)`


    `Test result: ok. 1 passed; 0 failed; finished in 873.70µs`


    `*************************************`


    The ability to withdraw ether from our safe is tested in this unit test. However,
    how do we say whether it applies to all amounts or just one ether?


    Here, the general property is as follows: If we have a safe balance, we should
    get whatever is in the safe when we withdraw.


    As a property-based test, let us rewrite: Forge will execute any test that takes
    at least one parameter.


    `***************************************************`


    `contract SafeTest is Test {`


    `// …`


    `function testFuzz_Withdraw(uint256 amount) public {`


    `payable(address(safe)).transfer(amount);`


    `uint256 preBalance = address(this).balance;`


    `safe.withdraw();`


    `uint256 postBalance = address(this).balance;`


    `assertEq(preBalance + amount, postBalance);`


    `}`


    `*******************************************************`


    If we run the test now, we can see that Forge runs the property-based test, but
    it fails for high values of amount:


    `*********************************************************`


    `$ forge test`


    `Compiling 1 files with 0.8.10`


    `Solc 0.8.10 finished in 1.69s`


    `Compiler run successful`


    `Running 1 test for test/Safe.t.sol:SafeTest`


    `[FAIL. Reason: EvmError: Revert Counterexample: calldata=0x215a2f200000000000000000000000000000000000000001000000000000000000000000,
    args=[79228162514264337593543950336]] testWithdraw(uint256) (runs: 47, μ: 19554,
    ~: 19554)`


    `Test result: FAILED. 0 passed; 1 failed; finished in 8.75ms`


    `*********************************************************`


    The default amount of ether that the test contract is given is 2\*\*96 wei (as
    in DappTools), so we have to restrict the type of amount to uint96 to make sure
    we don''t try to send more than we have:


    `function testFuzz_Withdraw(uint96 amount) public {`


    Now, we see it passes:


    `*****************************************************`


    `$ forge test`


    `Compiling 1 files with 0.8.10`


    `Solc 0.8.10 finished in 1.67s`


    `Compiler run successful`


    `Running 1 test for test/Safe.t.sol:SafeTest`


    `[PASS] testWithdraw(uint96) (runs: 256, μ: 19078, ~: 19654)`


    `Test result: ok. 1 passed; 0 failed; finished in 19.56ms`


    `*****************************************************`


    For configuring fuzz test execution, Fuzz tests execution is governed by parameters
    that can be controlled by users via Forge configuration primitives. Configs can
    be applied globally or on a per-test basis.


    For details, please visit **[https://book.getfoundry.sh/reference/config/testing](https://book.getfoundry.sh/reference/config/testing),
    [https://book.getfoundry.sh/reference/config/inline-test-config](https://book.getfoundry.sh/reference/config/inline-test-config)**


    # [Manual testing](#toc.xhtml#s96a)


    After running automated tests, manual testing of smart contracts typically occurs
    later in the development cycle. The smart contract is evaluated in this way as
    a single, fully integrated product to see if it meets the technical requirements.


    # Testing contracts on Local Blockchain


    While automated testing performed in a local development environment can provide
    useful debugging information, you''ll want to know how your smart contract behaves
    in a production environment. However, deploying to the main Ethereum chain incurs
    gas fees, not to mention that you or your users can lose real money if your smart
    contract contains bugs.


    An alternative to testing on the Mainnet is to test your contract on a local blockchain,
    also known as a development network. A local blockchain is a local copy of the
    Ethereum blockchain that runs on your computer and mimics the behavior of the
    execution layer. As a result, transactions can be programmed to interact with
    a contract without causing a lot of overhead.


    Manual integration testing can benefit from running contracts on a local blockchain.
    Although smart contracts are highly composable, you will still need to ensure
    that such intricate on-chain interactions result in the desired outcomes. However,
    smart contracts allow you to integrate with existing protocols.


    # Testing Contracts on Testnet


    Similar to the Ethereum Mainnet, a test network or testnet uses Ether (ETH) with
    no real-world value. Anyone can interact with your contract on a testnet, such
    as through the dapp''s frontend, without risking funds.


    This kind of manual testing is helpful when looking at your application''s flow
    from beginning to end from a user’s perspective. Additionally, beta testers can
    conduct trial runs and report any issues with the contract''s overall functionality
    and business logic.


    After testing on a local blockchain, deploying on a testnet is preferable because
    of its close resemblance to the Ethereum Virtual Machine operations. As a result,
    it is common practice for many Ethereum-native projects to deploy dapps on testnets
    to test the operation of smart contracts in the real world.


    When evaluating the correctness of a smart contract, manual testing, or human-assisted
    testing entails running each test case in your test suite sequentially. This is
    different from automated testing, where you can run multiple isolated tests on
    a contract at the same time and get a report showing all the tests that failed
    and passed.


    A single person can perform manual testing by following a written test plan that
    covers various test scenarios. As part of manual testing, you can also have multiple
    individuals or groups interact with a smart contract over a predetermined time.
    The contract''s actual and expected behavior will be compared by the testers,
    and any difference will be reported as a bug.


    After running automated tests, manual testing of smart contracts typically occurs
    later in the development cycle. The smart contract is evaluated in this way as
    a single, fully integrated product to see if it meets the technical requirements.


    Comparing this with automated testing, manual testing requires considerable resources
    (skill, time, money, and effort) and is possible—due to human error—to miss certain
    errors while executing tests. However, manual testing can also be beneficial—for
    example, a human tester (for example, an auditor) may use intuition to detect
    edge cases that an automated testing tool would miss.


    For more details on Ethereum testnets, please visit: **[https://ethereum.org/pt/developers/docs/development-networks/#public-beacon-testchains](https://ethereum.org/pt/developers/docs/development-networks/#public-beacon-testchains)**


