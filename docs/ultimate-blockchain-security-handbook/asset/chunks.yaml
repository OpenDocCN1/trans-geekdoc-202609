    你在互联网上是谁？你在网络上分享了多少个人信息？随着我们越来越多的生活在在线上度过，数字世界与物理世界建立了更紧密的联系，我们的电子身份正变得和我们在现实生活中的身份一样重要。对于个人和组织而言，在互联网上验证你的身份并确保你的个人信息的访问安全现在都是在现代世界中运行的关键组成部分。


    如果你认为你已经解决了身份问题，请再想一遍。如果身份被伪造，且你收到的来自可信 IP 源的请求被破解了，你该怎么办？如果你拥有一个分布式且去中心化的网络，那么建立可信身份将变得更加复杂。唯一的控制方法是通过使用密码学建立信任的机制，并在你的网络中启用日志和监控。


    在本章中，我们将介绍区块链安全解决方案，这些解决方案可以应用于钱包、智能合约和基础设施组件，以确保机密性、完整性并防止抵赖攻击。示例和用例将帮助你理解这一概念。这太迷人了，我等不及要直接深入研究了。让我们来看看本章的内容。


    # 结构


    我们将在本章中涵盖以下主题：


    *   零知识证明

    *   身份与访问管理

    *   公钥基础设施

    *   安全日志与监控


    # 零知识证明


    在向某人提供证明而不泄露任何信息。这听起来很复杂吗？换句话说，通过零知识证明，你可以提供任何主张或声明的有效性，而无需揭露该声明。


    为了解释这一点，考虑你如何向机场控制人员（例如，服务提供商）证明一个主张（例如，`我是 X1 国的公民`）。你需要提供 `evidence` 来支持你的主张，例如护照或驾照。


    那么，即使我们必须向任何人提供实际陈述（如身份证），我们为什么还要关心这个呢？问题在于对这类隐私信息的处理。如果是一个在线门户，你需要将这些信息存储在某些数据库中，然后采取安全措施来保护它，例如加密、访问控制等。如果你的存储端点存在漏洞，你可以预计黑客会利用这些漏洞。如果泄露的信息包含个人身份（PI）数据元素，你还必须面对
    GDPR 合规问题。


    为了让这一切变得可量化并更有意义，请考虑年收入的 4% 以及客户的信任正面临风险。


    现在你已经理解了这个问题，让我们看看零知识证明如何帮助解决它。


    零知识证明是一个消除了通过共享实际信息来证明主张的需求的过程。该过程使用声明作为输入，在不泄露信息的情况下有效性证明。


    该过程由一个算法组成，该算法接收某些数据并返回真或假的输出。是组成该算法的组件详细说明：


    *   **Witness（见证）**：在零知识证明中，做出主张的人想要证明他们知道某些被隐藏的信息。这些隐藏信息就是证明的 `witness`，证明者对
    `witness` 的意图知识设定了一系列只有知道信息的人才能回答的问题。因此，在开始证明过程时，证明者随机选择一个问题，算出答案并将其发送给检查者。

    *   **Challenge（挑战）**：检查者从集合中随机选取一个问题，并要求证明者回答。

    *   **Response（响应）**：证明者获取问题，算出答案并发回给检查者。证明者的答案让验证者发现证明者是否真的可以访问 `witness`。验证者会询问更多问题，以确保证明者不是在随机猜测并偶然得到正确答案。通过多次这样做，证明者关于谎称知道
    `witness` 的概率会显著降低，直到检查者满意为止。


    让我通过一个故事向你解释这个概念。


    在故事中，Peggy 是证明声明的人，而 Victor 是检查声明的人。


    Peggy 发现了一个可以打开洞穴大门的魔力词。洞穴呈环形，入口在一侧，另一侧被魔门封堵。Victor 想知道 Peggy 是否知道这个秘密词，但 Peggy
    非常注重隐私，不想与 Victor 或世界上其他地方分享这个秘密词或她知道这个词的事实。


    （注：原文此处存在重复段落，已根据逻辑处理）


    等等，让我们简化这个故事：

    Peggy 是证明者，Victor 是验证者。


    Peggy 发现了一个可以打开洞穴大门的魔力词。洞穴呈环形，入口在一侧，另一侧被魔门封堵。Victor 想知道 Peggy 是否知道这个秘密词，但 Peggy
    非常注重隐私，不想与 Victor 或世界上其他地方分享这个秘密词或她知道这个词的事实。


    （注：原文此处存在重复段落，已根据逻辑处理）


    检查者随机选择一个路径（A 或 B）并要求 Peggy 从该路径出现。如果 Peggy 知道这个词，她总是可以从该路径出现。如果她不知道，她只能偶然猜测路径。通过多次重复，Peggy
    每次都猜中的概率变得微乎其微。


    ![](img/Figure-6.1.jpg)


    **图 6.1：零知识证明的概念示例（来源：区块链）


    # 零知识（ZK）证明的类型


    它们可以是交互式的，也可以是非交互式的。交互证明解决方案需要证明者和验证者反复交换消息并保持可用。例如，即使验证者相信证明者的诚实，该证明也无法用于独立验证（计算新证明需要证明者和验证者之间的一组新消息）。

