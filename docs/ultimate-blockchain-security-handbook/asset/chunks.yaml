    # Maintaining Access (#toc.xhtml#s77a)


    This stage aims to determine if the vulnerability can be exploited to establish
    long-term presence. The goal is to mimic advanced persistent threats, which frequently
    stay in to mine sensitive data.


    Here, I would like to introduce you to `APT` (Advanced persistent threats). `APT`
    is a broad term for an attack campaign in which an intruder or group of intruders
    establish an illegal, long-term presence on a network to mine data.


    Just looking at how APT attacks are different from traditional application threats,
    I have listed a few checkpoints as follows:


    - They are notably more complicated.

    - They are not hit-and-run attacks, meaning once the network is penetrated, they
    remain in to discover more.

    - They are not automated against a specific target but are executed against a
    large pool.


    - ... etc.


    `[Figure 4.9](#c04.xhtml#fig4_9)` provides details on APT progression and some
    of the security measures.


    ![](images/Figure-4.9.jpg)


    **Figure 4.9:** APT Progression Matrix


    # Analysis and Reporting


    The pen tester must complete everything during this phase, keeping an eye on everything
    they do, particularly during the process of discovery and exploitation. In order
    to provide a report that highlights the methods used to successfully penetrate
    the dApp, as well as any security flaws and other relevant information discovered,
    they are analyzing every detail and step, delving into each problem in great detail
    and devising strategies to reduce vulnerabilities.

