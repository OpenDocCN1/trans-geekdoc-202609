- raw: "    **Attack scenario:** John is only sending a file to Peter, and he doesn't\
    \ want anyone else to see it. However, Henry intercepted the message and read\
    \ it.\n\n*   **Integrity:** The accuracy, completeness, and consistency of the\
    \ data as a whole constitute data integrity.\n\n    **Example:** A specific *employee\
    \ number* and their name should be the primary keys in a database of employees.\
    \ In simple words, if John is sending an X file to Peter with Y contents, Peter\
    \ should not receive a Y file with X contents.\n\n    **Attack scenario:** A file\
    \ is accessed without authorization and altered to reflect information other than\
    \ what authorized users intend. For instance, John is sending an X file only to\
    \ Peter because he does not want anyone to alter or change the file's content.\
    \ However, Henry intercepted the file and changed the file's content from X to\
    \ Y.\n\n*   **Availability:** The frequency with which your data can be utilized\
    \ by either your own organization or one of your partners is known as data availability.\
    \ It would be ideal for your data to be accessible round-the-clock, 365 days a\
    \ year, allowing your business to continue uninterrupted.\n\n    **Example:**\
    \ A customer-serving application's data processing server is up and running without\
    \ interruption. Availability guarantees that users can access systems, applications,\
    \ and data at any time.\n\n    **Attack Scenario:** John's laptop's operating\
    \ system has crashed due to ransomware and is no longer accessible or usable,\
    \ so he is unable to send any data to Peter.\n\n*   **Traceability:** Any data\
    \ event that occurs on your server or in a network can be identified by its subject,\
    \ whether a human or a non-human user. It’s the capacity to locate the source\
    \ of a particular piece of content or message.\n\n    **Example:** To keep track\
    \ of all data accesses and modifications, data traceability follows the lifecycle\
    \ of the data providing audit trails to the legal and quality assurance teams.\n\
    \n    **Attack Scenario:** Peter receives a message from John, but he is unable\
    \ to determine whether the message is from John. Tracing gives us the data we\
    \ need in real-time to detect and stop attacks.\n\nNow, let us take a look at\
    \ how it all makes sense in the context of security attributes in the blockchain.\
    \ We need to see if the Blockchain security ecosystem protects users under the\
    \ CIAT umbrella. Let us take a look in the context of *Public blockchains*.\n\n\
    # [Confidentiality in Blockchain](#toc.xhtml#s5a)\n\nA transaction's counterparties\
    \ should not be identifiable by an unauthorized third party in a blockchain until\
    \ their counterparties reveal that information.\n\nSecond, unless the parties\
    \ to the transaction do not disclose their information, the details of the transaction\
    \ must not be visible to anyone who is not a party to it.\n\nWithin a blockchain\
    \ network, there is no middleman involved, meaning that if John is sending the\
    \ transaction to Peter with no intentions of withdrawing it to the bank account,\
    \ he just needs to have a wallet. There is no bank or financial intermediary like\
    \ a payment gateway that will facilitate the transaction. With this, no personal\
    \ information between the sender and receiver will be shared. The distribution\
    \ network sits in between John and Peter, does the validation for that transaction\
    \ with signature to public key mapping and performing the math equation.\n\nInstead,\
    \ a string of alphanumeric characters known as a public key is the only way to\
    \ identify transactions on the blockchain. This key renders transactions in Bitcoin\
    \ pseudo-anonymous. This means that even though other people can look at your\
    \ holdings and transactions, they can't figure out who the real person behind\
    \ the public key is. While knowing the public key, allows you to see all the transaction\
    \ history, the fact that the actual identity, such as the name and address, is\
    \ unknown, doesn’t raise any concerns.\n\nThere are two main concerns about the\
    \ confidentiality of a public blockchain network. The first is the point where\
    \ anyone goes to third parties, such as wallet providers and centralized exchanges,\
    \ to store or transact cryptos. They can consume personal information in the shape\
    \ of account sign-ups.\n\nSecond, miners of the network, who actually process\
    \ the blocks can see how much money the public key holder has. However, due to\
    \ the economic factor of rewards, the fair play rule, downplays any misuse of\
    \ exploiting the block information.\n\n# [Data Integrity in Blockchain](#toc.xhtml#s6a)\n\
    \nIt ought to guarantee that the data written to the blockchain is accurate and\
    \ cannot be altered in the future. Additionally, blockchain only allows authorized\
    \ parties to add transactions, and once a transaction is committed, it cannot\
    \ be denied later.\n\nSince every transaction is immutable, editing it after it\
    \ has been completed is difficult. There is no way to reverse or cancel any transaction.\n\
    \nData Integrity is achieved in blockchain in the following ways.\n\n*   In the\
    \ blockchain mining process, each block is represented by a hash value. Any alteration\
    \ of data would result in a different hash.\n\n*   Excluding the genesis block,\
    \ every block represents a hash of its neighboring block. So, any changes to any\
    \ block’s data would break the chain.\n\n*   Consistency is maintained due to\
    \ the distribution of nodes. In a blockchain network, the nodes are peer-to-peer\
    \ distributed, and the addition of any new block means that every participant\
    \ in a network will have to update their records. Think of this like a WhatsApp\
    \ group: any new message in the group reaches every group member, and everyone\
    \ will have a copy on their phones.\n\n# [Data Availability in Blockchain](#toc.xhtml#s7a)\n\
    \nThe capacity of blockchain systems to withstand outages and attacks is referred\
    \ to as their availability. In blockchain, data should always be accessible to\
    \ all participating nodes. This is inherent in the distributed nature of blockchain\
    \ technologies. The main concern in the availability domain is the chance of pulling\
    \ up a Denial of Service or a Distributed denial of service attack. However, given\
    \ the millions of nodes involved in the validation process, any chance of a few\
    \ numbers of nodes crashing down will not make any difference, the mining process\
    \ would still continue.\n\nHowever, if you look at the endpoints where the user\
    \ operates, like wallets, APIs, and exchanges, any network entity that is part\
    \ of the ecosystem can be exploited. There is a lot to talk about regarding the\
    \ availability aspect while discussing private blockchains.\n\n# [Traceability\
    \ in Blockchain](#toc.xhtml#s8a)\n\nTraceability is also referred to as the non-repudiation\
    \ principle. In simple words, a person cannot deny receiving or sending it; the\
    \ transaction should be able to trace back to the sender without tampering. Lastly,\
    \ the receiver of the message can only read it, and nobody else in the network\
    \ can view it until the block data is updated on the chain. Let us dissect all\
    \ this magic into two categories.\n\nFirstly, the blocks are immutable through\
    \ hashing reference code, meaning data cannot be changed or altered, a topic we\
    \ covered earlier. So, whatever information has been stored in a block, let’s\
    \ say block 1, can be visible and tracked down even if you have reached up to\
    \ 1 million blocks of information in your chain. From a security standpoint, this\
    \ gives better control and visibility in case you have to reverse engineer up\
    \ to some point to extract information for a compliance use case or auditing purposes.\n\
    \nSecondly, sender authentication in the process involves validation of the sender\
    \ by the miner, the encrypted flow of the data across the chain, and the sender\
    \ being able to decrypt the message. All this happens with the help of cryptography."
