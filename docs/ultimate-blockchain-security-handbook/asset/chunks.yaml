- raw: 'If you think about the exact features of cryptography, blockchain inherits
    the use of hashing for data integrity use cases, the use of public and private
    keys for the sender’s address, unlocking the funds, and finally digital signature
    for non-repudiation and authenticity and encrypting the data in transit as it
    leaves the wallet to travel across the chain.


    Digital signatures are similar to proof that a user provides to the recipient
    and other network nodes to demonstrate that the node is a legitimate one for carrying
    out transactions. The user must first use a special algorithm to combine the transaction
    data with the user''s private key to create a unique digital signature before
    initiating a transaction with other nodes in the blockchain network. Both the
    integrity of the data and the authenticity of the node will be guaranteed by this
    procedure.


    Now that you have understood the key security principles of blockchain, let’s
    take a look at the overview of blockchain architecture to understand how these
    controls are in place in the stack.


    # [Blockchain Security ecosystem](#toc.xhtml#s9a)


    Blockchain, like most modern technologies, is not a single entity. It has several
    distinct layers, each with its own advantages and security concerns. An understanding
    of the system as a whole requires an understanding of how each level functions
    and the security assumptions it makes.


    In *[Figure 1.1](#c01.xhtml#fig1_1)*, you can see the layered structure of a blockchain
    stack. When people discuss blockchain, they usually discuss only a few layers,
    such as smart contracts and consensus algorithms. Data, network, and infrastructure
    layers are often missed. When designing a security architecture of the stack,
    understanding each layer is important. It’s like if you want to protect your house
    worth $$$$$$, you don’t just lock the main doors; you lock cupboards, safe vaults,
    install security cameras, fences, etc. If you don’t know what you are protecting,
    a good view of the inventory, the chance of missing some valuable entry points
    is high, and leaving back doors open is high.


    ![](images/Figure-1.1.jpg)


    **Figure 1.1:** Layered view of the blockchain stack


    Now let us take a look at each layer from the conceptual as well as from the security
    risk standpoint.


    # [Application Layer](#toc.xhtml#s10a)


    The application layer is made up of chain code, smart contracts, and decentralized
    applications (DApps). The protocols in the application layer are further broken
    down into the application and execution layers. The applications that end-users
    use to communicate with the blockchain network are included in the application
    layer. It includes user interfaces, frameworks, application programming interfaces
    (APIs), and scripts.


    Smart contract platforms, like Ethereum, are designed to enable the creation of
    Turing-complete programs that run on the blockchain. These programs are associated
    with accounts on the blockchain network and are called via transactions that contain
    code to be executed. Each node in the blockchain network executes the same code
    and updates the state of the blockchain in the same way, maintaining consistency
    across the network.


    The addition of programs that run on top of the blockchain network introduces
    new potential security risks to the blockchain. These programs run on virtual
    machines, which may have security flaws. Secure coding practices and a secure
    software development lifecycle need to be adopted to ensure the security of an
    application layer.


    # [Consensus Algorithm Layer](#toc.xhtml#s11a)


    Getting everyone into an agreement is such a difficult task. The capacity to implement
    a digital ledger that is completely decentralized is one of the main advantages
    of blockchain technology. For this to be possible, there needs to be a way to
    make sure that everyone agrees on the current state of the ledger, which is the
    transactions in each block.


    Blockchain consensus algorithms take on this responsibility. It is the mechanism
    in which participant in a distributed network, validates the truthfulness of a
    transaction before it gets added on the chain (This is covered in more detail
    under Bitcoin Overview topic). Security is mapped to economic principles such
    as supply and demand, and no consensus algorithm is perfect. These principles
    generally shield blockchains from attack; however, there is a point where the
    security of consensus algorithms breaks down. The most frequently used consensus
    algorithms have flaws that can be exploited by an attacker, giving them a slight
    advantage when trying to take over a blockchain network.


    *Please visit **[https://cointelegraph.com/news/what-is-a-51-attack-and-how-to-detect-it](https://cointelegraph.com/news/what-is-a-51-attack-and-how-to-detect-it)**,
    for an example of an attack targeting the consensus algorithm layer. We will cover
    all of this in greater detail later in the book.*


    # [Network Layer](#toc.xhtml#s12a)


    The theory of blockchain technology is hammered out in the first two layers of
    the blockchain stack. A blockchain platform can theoretically operate over any
    communication medium, such as routers and computers that are used to build up
    the network. Basically, the network is implemented on computers, the internet,
    and private corporate networks in practice.


    A variety of conventional cyberattacks can target a blockchain network because
    it is essentially software running on a collection of computers connected by peer-to-peer
    networks. Malware or phishing attacks directed at a computer running the software,
    or a **node**, have the potential to compromise a user''s account and impact the
    network as a whole. An attacker can also target the network infrastructure of
    a blockchain network, which can have an impact on the blockchain''s functionality
    and security guarantees.


    # [Data layer](#toc.xhtml#s13a)


    Blockchain technology is made up of cryptographic algorithms and data structures
    at the base. Blockchain''s **blocks** are made to store data, including the actual
    transactions themselves and additional metadata. Cryptographic hashes are used
    to connect blocks in the blockchain''s **chains**, making it much harder to change
    them later.


    At this point, the security of a blockchain depends on the safety of its cryptographic
    algorithms. The use of prime numbers, the length of the key, the bits in the hashing
    algorithm, and other factors can have a significant impact on the strength of
    public-key cryptography and blockchain. These need to be rigorously tested with
    threat modeling taking into account both internal and external threat actors.
    We are in charge of the risk.


    **Note**


    *The hardening of the cryptographic algorithm and how strong it is depends upon
    what ingredients are used in its formation. If you want to learn more about prime
    numbers, key formation, and length in developing a safe crypto algorithm, please
    visit **[https://www.baeldung.com/cs/prime-numbers-cryptography](https://www.baeldung.com/cs/prime-numbers-cryptography)***.


    # [Infrastructure and Virtualization Layer](#toc.xhtml#s14a)


    The blockchain''s content is stored on a server in a data center somewhere on
    this lovely globe. Clients request content or data from application servers while
    browsing the web or utilizing any apps, which is known as the client-server architecture.
    This consists of virtual machines, containers, services, and messaging. Infrastructure
    can be on-premise using bare metal or private cloud setups. In addition, blockchain
    can also be deployed in the public cloud. The security of this layer comes down
    to how many security controls you have used in Session, TCP, IP, and data switch
    layers if you have an on-premise setup. Whereas, in the case of a public cloud,
    service-level agreement in contractual agreements with cloud providers plays a
    pivotal role.


    # [Exploring blockchain security benefits](#toc.xhtml#s15a)


