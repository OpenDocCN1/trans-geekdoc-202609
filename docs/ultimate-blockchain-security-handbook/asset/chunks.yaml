- raw: 'Below is a picture of SSI design, which shows the different parts of the process.
    The goal is for the person with the claim to be able to show the checker that
    the claim is real.


    ![](images/Figure-6.3.jpg)


    **Figure 6.3:** Self Sovereign Identity high-level architecture


    In addition, Zero-knowledge proofs were also implemented in the Zerocoin and Zerocash
    protocols, which led to the development of the cryptocurrencies Zcoin, which changed
    its name to Firo and then to and Zcash. Zerocoin has a built-in mixing model that
    doesn''t trust peers or centralized mixing sources to make sure that transactions
    are anonymous.


    # [Identity and Access Management](#toc.xhtml#s109a)


    Who are you on the internet? And how much personal information are you sharing
    on the web? As more and more of our lives are spent online and the digital world
    forges stronger connections with the physical world, our electronic identities
    are becoming as important as who we are in real life. Authenticating who you are
    and securing access to your personal information on the internet are now critical
    components of operating in the modern world for both individuals and organizations.


    Indeed, Identity management is an integral part of any network infrastructure,
    whether you have a public blockchain or a private blockchain. If you have a robust
    and resilient Identity management solution in place, then most of the cyber-attacks
    can be mitigated.


    In general, it comprises processes, policies, and technologies to ensure that
    only authorized people have access to technology resources, information, or services.
    These systems are continuously evolving to improve security and the user experience.
    A common example is the ‘Know your customer’ process, in which users register
    themselves with an application to use its services. First, the user enters their
    name, email ID, and phone number, which need to be authenticated and validated
    through a backend process before their credentials are accepted and allocated
    to them.


    There is a lot of content and discussion available on how blockchain plays an
    important role in identity and access management, with its salient features of
    immutability, smart contacts, and cryptography. So, just to set the stage and
    build the context, in this topic, we are taking the opposite side, meaning how
    a security-hardened access control solution can aid blockchain projects. In other
    words, how enforcing authentication, authorization, and accounting can power up
    the blockchain network and help reduce vulnerabilities.


    If you look at the blockchain network and the ecosystem, it comprises the technology
    stack of the protocol, for example, Bitcoin, Ethereum, and Hyperledger, as well
    as the infrastructure and interworking components like Wallets, APIs, networking
    nodes, and Layer 1 and Layer 2 protocols. The data assets are distributed across
    multiple layers with accessibility needs for both human and machine users, as
    per the data flow and routine operations.


    The access use cases can be several, a few of which include:


    *   A private blockchain network needs to authenticate and authorize validating
    nodes so that consensus operations can be performed.


    *   User registration is required by the blockchain mobile or web application.


    *   Smart contract code that checks whether any calls made to the contract are
    legitimate or not.


    *   A backend administrator of a blockchain application is performing troubleshooting
    for a customer complaint.


    *   Blockchain developers and quality assurance team to integrate a new feature.


    *   API Calls are made between oracles to query data on the blockchain.


    Now, with all these use cases, if authentication measures are not taken care of,
    you will not know whether the request is made by a spoofed user or a legitimate
    user. Whether the person or machine making the request is allowed to query that
    data or not. Whether we are logging each request query or not, this would help
    in tracking down repudiation attacks.


    Another consideration is that we have different types of blockchains, such as
    Public and Consortium/private blockchains. Most of the private ones are architected
    on a public cloud like AWS, whereas access control for Dapps, wallets, the consensus
    layer, and smart contracts is an integral part of public blockchains. So, let
    us look at IAM from the perspective of the type of blockchain application.


    # [Identity and Access Management for Public Blockchain](#toc.xhtml#s110a)


    The Internet is a scary place to do business. If you are unaware of who is talking
    to you or whether a known person is accessing the authorized resources, then you
    will be in trouble. It is similar to not allowing anyone inside your home and
    limiting them to whatever they can take.


    We tried to illustrate this concept with the help of *[Figure 6.4](#c06.xhtml#fig6_4)*.
    As you can see, when the wallet or a decentralized application wants to connect
    to the network, the request must be authenticated and authorized as it interacts
    with the blockchain smart contracts.


    The Identity and access management server shown in *[Figure 6.4](#c06.xhtml#fig6_4)*
    connects with an active directory server, which authenticates the request and
    passes it on with the token with the role to the identity and access management
    server. You can define the policies and roles in the Active Directory, and the
    same will be applied. The roles will depend on the subjects, resources, and purpose
    of access. To better secure yourself, you can go as granular as you can.


    For example, an administrator developer accessing the smart contract is allowed
    to make changes to specific functions, whereas a normal wallet user can just submit
    the transaction on the blockchain network. Other categories of requests from external
    smart contracts need to be validated.


    ![](images/Figure-6.4.jpg)


    **Figure 6.4:** Identity and Access Management Architecture for Blockchain


    In addition, for any registration or sign-ups to Wallet or Daps, it is recommended
    to use a federated identity mechanism like a Single Sign-On (SSO). It offers two
    main advantages: first, users do not have to store and memorize the credentials;
    second, the platform doesn’t need to enforce security controls over the datasets,
    as the information is transparent.


    There is a good blog where you can read more details on SSO:


    In other words, when you use Single Sign-On, the authentication request is redirected
    to an identity provider like Google or Facebook. For example, if you are using
    a Gmail account, then Google is responsible for user authentication. If the request
    is successfully authenticated, then only you will be allowed to login to the Dapp.


    With the authentication and authorization layer, you can secure your Blockchain
    APIs with industry-standard protocols, including OpenID Connect, OAuth 2.0, and
    SAML.


    You can use either of these protocols in your Single Sign-On solution, and each
    supports the integration with your enterprise ID registry, including LDAP or Active
    Directory servers.


    Here is a typical example of an OAuth 2.0 Authorization Code flow with Key Cloak
    running alongside an application backend on a private network.


    ![](images/Figure-6.5.jpg)


    **Figure 6.5:** Single Sign-On flow example of Kaleido


