- raw: "*   **Role-based access control**: A single point of failure occurs when a\
    \ single address is registered as the Owner of a smart contract, increasing the\
    \ risk of centralization and a vulnerability to be used as an attack vector.\n\
    \n    Under role-based access management, a group of known people are given access\
    \ to different private functions. For example, one account might be in charge\
    \ of making tokens, while another might be in charge of upgrading contracts or\
    \ stopping them. By making access control less centralized in this way, customers'\
    \ expectations of trust are lowered, and single points of failure are taken away.\n\
    \n*   **Multi-signature**: With multi-sig, accounts are owned by multiple entities\
    \ and require signatures from a minimum number of accounts to execute a transaction.\
    \ Since multiple parties must agree before taking any action on the target contract,\
    \ using a multisig for access control adds an additional layer of security. Since\
    \ it makes it more challenging for an attacker or rogue insider to manipulate\
    \ sensitive contract functions for malicious purposes, this is especially helpful\
    \ if the Ownable pattern is required.\n\n# Testing and auditing\n\nSmart contracts\
    \ necessitate a more rigorous degree of quality evaluation throughout the development\
    \ process due to the immutability of code executing in the Ethereum Virtual Machine.\
    \ Long-term security will be greatly enhanced and your users will be protected\
    \ if you thoroughly test your contract and keep an eye out for any unexpected\
    \ outcomes.\n\nIt is advisable to ask others to review the source code for potential\
    \ security flaws once you have tested your contract. While testing won't find\
    \ every bug in a smart contract, getting an outside opinion increases the likelihood\
    \ of finding security flaws.\n\nJust unit and regression testing on the code is\
    \ not enough. A more effective strategy is to combine property-based testing with\
    \ unit testing, which is carried out via static and dynamic analysis. To examine\
    \ attainable program states and execution routes, the static analysis uses low-level\
    \ representations like control flow graphs and abstract syntax trees. Dynamic\
    \ analysis methods, like fuzzing, execute contract code with random input values\
    \ in order to find actions that go against security principles.\n\n*   **Bug bounty**\n\
    \n    Another useful approach is to set up a bug bounty program is another approach\
    \ for implementing external code reviews. A bug bounty is a financial reward given\
    \ to individuals (usually white hat hackers) that discover vulnerabilities in\
    \ an application.\n\n    When implemented effectively, bug bounties provide the\
    \ hacker community with an incentive to review your code for serious issues. The\
    \ **infinite money bug** on Optimism, a Layer 2 protocol running on Ethereum,\
    \ is a real-world illustration of this. It allowed an attacker to generate a limitless\
    \ supply of Ether. Fortunately, a whitehat hacker found the vulnerability and\
    \ alerted the team, earning an enormous prize in the process.\n\n    Setting a\
    \ bug bounty program's reward proportionate to the amount of money at risk is\
    \ a smart move. This strategy, known as the **scaling bug bounty** offers cash\
    \ incentives for people to properly report vulnerabilities as opposed to abusing\
    \ them. I will cover this topic in much more detail in *[Chapter 5, Blockchain\
    \ Application Audit](#c05.xhtml)*.\n\n    *Immunefi is a good Bug bounty platform\
    \ for smart contracts and DeFi projects, where security researchers review code,\
    \ disclose vulnerabilities, get paid, and make crypto safer.*\n\n*   **Smart Contract\
    \ Weakness (SWC) registry**\n\n    The weakness classification system described\
    \ in EIP-1470 is implemented in the Smart Contract Weakness Classification registry\
    \ (SWC registry).\n\n**Note**\n\n*There are multiple opcodes in the Ethereum bytecode,\
    \ which is written in assembly language. On the Ethereum blockchain, each opcode\
    \ carries out a particular function. Ethereum Virtual Machines compile smart contract\
    \ functionalities into low-level language as bytecodes to carry out actions, while\
    \ developers construct them using high-level languages like Solidity.*\n\nIt can\
    \ be seen from the following figure, that smart contract weakness decreased over\
    \ time. It shows three stages of smart contract security with respect to mean\
    \ and variance. It was high in the initial stages, but right after April 2017,\
    \ the smart contract got solid.\n\n![](images/Figure-2.18.jpg)\n\n**Figure 2.18:**\
    \ Analysis of SWCs over time\n\nIt is recommended to scan your smart contract\
    \ through all SWCs and use the following test cases to ensure that the contract\
    \ is hardened. The following table extracted from **[https://swcregistry.io/](https://swcregistry.io/)**\
    \ is a good starting point in your Ethereum security journey.\n\n![](images/Figure-2.19.jpg)\n\
    \n**Figure 2.19:** SWC Registry\n\nSome useful resources related to Ethereum security\
    \ testing and auditing are as follows.\n\n**[https://ethereum.org/en/developers/docs/smart-contracts/testing/#testing-tools-and-libraries](https://ethereum.org/en/developers/docs/smart-contracts/testing/#testing-tools-and-libraries)**.\n\
    \n# [Hyperledger fabric](#toc.xhtml#s42a)\n\nHyperledger Fabric is a permissioned,\
    \ open-source, enterprise-grade distributed ledger technology (DLT) platform designed\
    \ for use in business settings that offers a few key capabilities that set it\
    \ apart from other popular DLT platforms.\n\nFabric's architecture is highly modular\
    \ and configurable, allowing for innovation, adaptability, and optimization for\
    \ a wide range of industry use cases, such as supply chain, healthcare, human\
    \ resources, and even digital music delivery.\n\nFabric is the first distributed\
    \ ledger platform to support smart contracts written in general-purpose programming\
    \ languages like Java, Go, and Node.js as opposed to domain-specific languages\
    \ (DSL), which are constrained. This indicates that no additional training to\
    \ learn a new language or DSL is required for the majority of businesses to develop\
    \ smart contracts.\n\nIn addition, the Fabric platform is permissioned, which\
    \ means that, in contrast to a public permissionless network, participants are\
    \ known to one another rather than completely untrusted. This means that a network\
    \ can operate under a governance model based on the trust that exists between\
    \ participants, such as a legal agreement or framework for handling disputes,\
    \ even though the participants may not fully trust one another (for instance,\
    \ they may be competitors in the same industry).\n\nThe platform's support for\
    \ pluggable consensus protocols, which makes it easier to tailor the platform\
    \ to specific use cases and trust models, is one of its most significant points\
    \ of differentiation. For instance, a fully byzantine fault-tolerant consensus\
    \ may be deemed unnecessary and detrimental to performance and throughput when\
    \ implemented within a single company or under the direction of a reputable authority.\
    \ A crash fault-tolerant (CFT) consensus protocol may be sufficient in such circumstances,\
    \ whereas a more conventional byzantine fault-tolerant (BFT) consensus protocol\
    \ may be required in a multi-party, decentralized use case.\n\nFabric can use\
    \ consensus protocols that do not need a native cryptocurrency to encourage expensive\
    \ mining or drive the execution of smart contracts. The absence of cryptographic\
    \ mining operations means that the platform can be deployed at roughly the same\
    \ cost of operation as any other distributed system. Avoiding cryptocurrencies\
    \ also reduces some significant risks and attack vectors.\n\nFabric is one of\
    \ the best-performing platforms currently available in terms of transaction processing\
    \ and confirmation latency thanks to the combination of these distinguishing design\
    \ features. Additionally, Fabric makes it possible to maintain the privacy and\
    \ confidentiality of transactions as well as the smart contracts (which Fabric\
    \ refers to as \"chain code\") that carry them out.\n\n**The following are the\
    \ architecture components of fabric:**"
