    # [CHAPTER 4](#toc.xhtml#c04)


    # [Blockchain Application Exploitation](#toc.xhtml#c04)


    # [Introduction](#toc.xhtml#s71a)


    With the developing prominence of digital currencies, the number of individuals
    entering the market is expanding emphatically. Tragically, a portion of these
    individuals aren''t keen on putting resources into digital currencies as their
    only object is to hack and take resources that have a place with others. To make
    their task even more easier, there isn’t enough attention given in this area.


    Take a look at various blockchain applications, one common thing you will notice
    is the neglecting attitude towards securing the blockchain applications. Either
    they are too naïve to think that the blockchain is built-in secure, or the only
    security they need is just the testing and auditing of smart contracts. All of
    this results in widening the attack surface, leaving backdoors and vulnerabilities
    for hackers to exploit.


    Now the question arises: How do we know where are the weaknesses and how much
    security is enough? We tried to partially cover this topic through threat modeling
    analysis in the previous chapter, but there is more to that. No matter how closely
    we analyze, there is only a handful that we can do, considering the width of the
    blockchain paradigm we are dealing with. Another argument that arises as we progress
    in securing blockchain is: Why should I put my efforts and resources in the security
    aspect of blockchain? How do we know these weaknesses are exploitable? In other
    words, I need a business reason to implement security – Security isn’t cheap.


    To answer this tricky question, we have to use tools and strategies such as penetration
    testing, validate the strength of crypto wallets, examine smart contracts code,
    and lastly, understand the scenarios where hackers were successful in their attempts.
    By doing so, you can take these considerations into account when you architect
    security solutions in your application.


    # [Structure](#toc.xhtml#s72a)


    We will be covering the following topics in this chapter:


    *   Blockchain Penetration Testing


    *   Hacking Smart Contract with Lab


    *   Integer Overflow and Underflow Threat Mitigations


    *   Top attack vector analysis on Smart contracts.


    *   Useful tools and resources


    # [Blockchain Penetration Testing](#toc.xhtml#s73a)


    Imagine a team competition to hack a secure blockchain application, with winners
    earning huge cash prizes for a weekend’s worth of work exploiting weaknesses.
    These Hackathons actually happen frequently in real life. Cybersecurity companies
    put them on to identify weaknesses in their systems. It’s a practice known as
    ethical hacking because you intentionally invite someone to hack your computer
    so you know how to fortify your defenses. It gives you the following benefits:


    *   Protects against hacks and attacks by identifying vulnerabilities that attackers
    can exploit.


    *   Ensures trust and compliance, which can build trust and credibility with investors
    and customers.


    *   Improves user experience by helping to identify issues and bugs, such as broken
    links or slow loading time.


    *   Saves time and money by findings issues upfront; it is cheaper to fix vulnerabilities
    in the development stage rather than after rollout.


    In this lesson, I’ll explain how penetration testing works and how it helps blockchain
    solutions strengthen their security defences by identifying a probable adversarial
    path to compromise and move laterally within a blockchain network. As always,
    let’s start with the basics.


    # What is penetration testing or Ethical hacking?


    Ethical hacking, also known as penetration testing or pen testing for short, refers
    to the security process of evaluating your computer system’s applications for
    vulnerabilities and susceptibility to threats like hackers and cyberattacks.


    Let me break down the roadmap for blockchain penetration testing. It has mainly
    six phases, as shown in *[Figure 4.1](#c04.xhtml#fig4_1)*.


    ![](images/Figure-4.1.jpg)


    **Figure 4.1:** Roadmap for blockchain penetration testing


    # [Planning](#toc.xhtml#s74a)


    This is the information-gathering stage. It includes the following checks:


    *   Determining the objectives and scope of a test, as well as the systems that
    will be tested and their methods.


    *   Acquiring intelligence, such as the names of a target''s network and domain,
    its mail server, and other details, to comprehend a target''s workings and potential
    weaknesses.


    In this stage, information is collected about the blockchain platform. Here, you
    analyze the architecture, determine threat entry points, and collect data for
    potential threats. The popular tools you can leverage are Nessus, Nmap, and Spyse
    to check open ports, public-facing Ips, and common vulnerabilities.


    **[https://pentestlab.blog/2020/06/15/spyse-a-cyber-security-search-engine/](https://pentestlab.blog/2020/06/15/spyse-a-cyber-security-search-engine/)**


    For example, using Spyse:


    To make asset discovery easier, subdomains of a given domain can be easily found.
    During Open Source Intelligence Assessments or when examining the client''s external
    attack surface, penetration testers and red teamers should be able to use it.
    The results also include A records, DNS CNAME, and the version of TLS/SSL. Since
    there are a number of vulnerabilities in TLS and SSL, they could be used first
    before any other tools. *[Figure 4.2](#c04.xhtml#fig4_2)* is the snapshot for
    the same.


    ![](images/Figure-4.2.jpg)


    **Figure 4.2:** Discovery of sub-domains list


    In order to retrieve information such as links, robots.txt files, and HTTP headers,
    you can also perform web spidering (following links on the web page to find useful
    information) on the target domain. This can help towards fingerprinting the current
    advancements used by the site in scope, recognizing proof of sensitive URLs, and
    planning the application.


    *[Figure 4.3](#c04.xhtml#fig4_3)* depicts a snapshot of the information under
    the links tab.


    ![](images/Figure-4.3.jpg)


    **Figure 4.3:** Application Mapping on links tab


    In addition, *[Figure 4.4](#c04.xhtml#fig4_4)* displays the information under
    the HTTP headers tab. Here, you can see the payload information and cookies being
    used.


    ![](images/Figure-4.4.jpg)


    **Figure 4.4:** HTTP Headers


    Next is the information that you can see under the robots.txt. The asterisk (\*)is
    listed as a wildcard, meaning any user agent can access it. However, this can
    also be a signal for an attacker.


    ![](images/Figure-4.5.jpg)


    **Figure 4.5:** Robots.txt content


