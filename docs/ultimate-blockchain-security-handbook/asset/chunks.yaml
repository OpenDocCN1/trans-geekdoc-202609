    现在，在我的区块链应用中应该使用哪种算法，以及何时应该使用非对称加密而非对称加密，理解它们之间的关系至关重要。


    # 非对称加密与对称加密的关系


    由于密钥长度和涉及的计算，非对称加密比对称加密慢得多，因此两者通常结合使用。例如，某人可以使用对称加密保护消息，然后使用非对称加密发送解码该消息的密钥。这将加速解密过程，因为密钥比消息小得多。*[图
    6.8* 解释了这种对称加密和非对称加密共同使用的概念。


    ![](img/Figure-6.8.jpg)


    **图 6.8：** 对称加密与非对称加密的应用


    因此，公钥和私钥加密的概念支撑了 PKI（公钥基础设施）并实现了 PKI 的功能。


    对称加密和非对称加密都有一个主要挑战：如何确定你收到的公钥确实属于你认为的个人？


    即使使用非对称加密，仍然存在`中间人攻击`的风险。例如，如果有人截获了 Bob 的公钥，制作了自己的私钥，然后为 Alice 生成了一个新的公钥怎么办？在这种情况下，Alice
    会为 Bob 加密消息，但中间人可以解密、修改并重新加密这些消息，而 Alice 和 Bob 都将无所不知。


    所以，问题在于，仅凭加密技术不足以保护双方之间的通信通道。你需要额外的安全层，它可以帮助在不同实体之间建立信任。


    欢迎使用 PKI 作为解决方案。以下是它解决问题的方法。


    这个问题通过 PKI 解决，它颁发并管理数字证书，证明拥有私钥和公钥的人、设备或应用程序的身份。简而言之，PKI 为密钥命名，这样使用它们的人就可以确定它们的所有者。这种确认让用户放有信心，如果他们向该个人（或设备）发送加密消息，预期接收者将读取它，而不是`中间人`。


    当消息到达任何一方时，它包含一个受信任权威的签名，双方都信任该权威。如果你正在考虑如何防止证书签名伪造，这就是证书吊销列表的用场。在这种情况下，证书机构（也称为
    `根 CA`）可以向所有相关方发送消息，让他们不要信任特定的证书。


    让我通过分解公钥基础设施的组件来解释这个概念。


    # 公钥基础设施的组件


    它包含三个主要部分：X.509 证书、公钥和私钥，以及证书机构、链或信任。让我们来看每一个。


    ## X.509 数字证书


    X.509 是一种类似于驾照的数字证书，它是公司和团体在网上证明自己身份的一种。PKI 使两台机器能够安全地通信，因为可以使用证书检查双方的身份。*[图 6.9*
    显示了数字证书的样子。


    ![](img/Figure-6.9.jpg)


    **图 6.9：** SSL 证书


    一旦拥有数字证书，维护证书的生命周期就至关重要，从注册和颁发到吊销和更新。


    ## 公钥与私钥


    公钥是可以分发给公众的加密密钥，不需要安全存储。只有相应的私钥才能可以解密由公钥加密的消息。在区块链生态系统中，你已经熟悉公钥作为用户身份的概念，但这些也被用于数字签名以加密消息。


    另一方面，`私钥` 供接收者用于解密使用公钥加密的消息。由于消息是使用给定的公钥加密的，它只能通过匹配的私钥解密。此外，这些密钥还用于签署交易，与它们在区块链中的功能类似。


    ## 定义证书机构和信任链


    证书机构（`Cas`）负责制作数字证书，并拥有验证用户和颁发证书的策略、实践和流程。


    ![](img/Figure-6.10.jpg)


    **图 6.10：** 颁发数字证书的证书机构


    数字身份以加密验证的数字证书形式存在，符合 X.509 标准并由证书机构（`CA`）颁发。另一方面，信任链是指将银行与受信任认证机构连接起来的证书。SSL
    证书要被信任，它必须能够追溯到签署它的受信任根证书，这意味着链中的所有服务器证书、中间和根证书都需要被正确信任。


    ![](img/Figure-6.11.jpg)


    **图 6.11：** 验证信任的证书路径


    在上一张图中，我们可以看到 [google.com](http://google.com) 是我们连接的服务器。`GTS-CA 1C3` 是一个中间 CA。`GTS-Root
    R1` 是另一个中间 CA。`GlobalSign Root CA-R1` 是顶层根 CA。通过这种方式，可以建立信任链。


    信任链包含三个部分：


    - **根证书**：根证书是由颁发它的证书机构提供的数字证书。大多数浏览器已将其保存在信任存储中。例如，*[图 6.8* 显示了 `GlobalSign Root
    CA-R1` 是一个根 CA。在企业区块链网络中，可以使用自己的 `CA` 作为根。

    - **中间 CA**：中间证书从根证书分叉出来，就像树枝。它们在受保护的根证书和服务器证书之间充当中间人。如果你在组织的两个部门之间建立信任网络，可以创建两个中间
    CA 并连接回根 CA。

    - **服务器证书**：服务器证书是颁发给特定域名的。例如，*[图 6.8* 显示服务器证书颁发给 [google.com](http://google.com)，这可以是你的任何
    `DaPPs` 或区块链节点。


    # PKI 在区块链中的应用


    现在，如果你从私有区块链网络的背景下考虑，所有使用的基础设施网络组件或参与网络的节点如果颁发了数字证书，都是可信的。人们可能会认为区块链是一个去信任系统，信任是通过共识算法和协议本身实现的。然而，在希望增加额外安全层的私有或联盟区块链网络中，每当一个节点进入链时，它必须拥有有效的证书。


    此外，区块链网站上有效的 SSL 证书有助于确保用户数据安全，证明你是该网站的所有者，并防止攻击者制作伪造网站。最后，这将帮助人们信任你。

