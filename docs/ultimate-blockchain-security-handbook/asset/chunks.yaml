    \ returning false.\n\nHere are just two examples that were shown to explain the\
    \ mapping of templates into developing formulas to audit the behavior of a contract.\n"
  trans: "\n\n一个简单的智能合约被用于 DEFI 应用。我们定义了它的规格并对其进行验证，以测试区块链上的形式化验证。在研究形式化验证时，最好使用现有的框架。执行这项工作最常用的工具是以太坊虚拟机的\
    \ `K Framework` 及其 `KEVM` 实现。在我们的每一个示例中，我们都将使用 `KEVM`。\n\n以下是一个 ICO 的智能合约，它是 `ERC-20`\
    \ 代币的一部分。它有两个可调用函数，如下：\n\n* `Buy`：接收 Ether 并分发代币。\n* `BalanceOf`：返回任何给定账户的余额。\n\
    \n```solidity\npragma solidity 0.4.25;\ncontract ICO {\n    mapping (address =>\
    \ uint256) private _balances;\n    uint256 private _totalSupply;\n    uint256\
    \ private _decimals = 18;\n    uint256 private _hardCap = 200 * (10 ** _decimals);\n\
    \    uint256 private _rate = 2;\n    function balanceOf(address owner) public\
    \ view returns (uint256) {\n        return _balances[owner];\n    }\n    function\
    \ buy() public payable {\n        require(msg.value != 0);\n        require(_hardCap\
    \ <= _totalSupply + msg.value * _rate);\n        _balances[msg.sender] += msg.value\
    \ * _rate;\n        _totalSupply += msg.value * _rate;\n    }\n}\n```\n\n下一步是将智能合约的需求输入到规格中。这是一个基础的\
    \ ICO 示例，需求如下：\n\n* ICO 最多将收集 100 个 Ether 并分发 200 个代币。\n* ICO 没有时间限制。\n* 发行速率为每个\
    \ Ether 2 个代币（例如，对于 0.1 个 Ether，你将收到 0.2 个代币）。\n\n*图 5.6* 显示了该合约的高级规格。\n\n![](img/Figure-5.6.jpg)\n\
    \n**图 5.6：**智能合约规格\n\n你可以看到这两个函数的定义，以及这些函数在每情况下应该执行的规则。然后，我们需要定义 EVM 规格。\n\n##\
    \ 定义 EVM 规格\n\n你必须准备一个初始化文件，其中定义了每个函数的需求，以及 EVM 中所有参数的细节\n\n![](img/Figure-5.7.jpg)\n\
    \n**图 5.7：**EVM 规格细节\n\n为了从中产生规格，我们可以按照如下方式调用 `KEVM` 仓库中的 `gen-spec` 脚本：\n\nShell\
    \ Script >\n\n```bash\npython3 gen-spec.py spec-tmpl.k ico-spec.ini ico-spec ico-spec\
    \ > ico-spec.k\n```\n\n现在，让我们验证这个智能合约：\n\n```bash\nkevm prove ./ico-spec.k\n```\n\
    \n一旦证明按照规格执行，框架应该显示：\n\n# > True\n\n这意味着该文档已成功通过验证。\n\n现在，让我们尝试看看如果我们在合约中添加一个\
    \ bug，结果会是什么样。\n\n```solidity\nfunction buy() public payable {\n    require(msg.value\
    \ != 0);\n    require(_hardCap <= _totalSupply + msg.value * _rate);\n    if (msg.value\
    \ == 42) {\n        return;\n    }\n    _balances[msg.sender] += msg.value * _rate;\n\
    \    _totalSupply += msg.value * _rate;\n}\n```\n\n如果我们现在进行验证，将收到一个通用的错误指示。虽然\
    \ bug 是显而易见的，但在没有源代码的情况下，通过传统的单元测试或渗透测试发现它是非常挑战性的。\n\n## 案例研究 - Open Zeppelin\
    \ 的形式化验证\n\nWeb3 广泛使用 Open Zeppelin 的 ERC20 实现。如果它存在缺陷，它的合约将受到严重影响。然而，我们如何确定这一点呢？另外，我们如何知道从那里接收的数据是准确且没有\
    \ bug 的呢？\n\n首先，你需要指定 ERC20 合约预期行为的模板。主要函数包括 `transfer`、`transferFrom`、`approve`、`balanceOf`\
    \ 和 `totalSupply`。然后你需要添加与每个函数相关的特性：\n\n* `erc20-transfer-revert-zero`：函数 `transfer`\
    \ 防止向零地址转移。如果接收地址是零地址，任何 `transfer(recipient, amount)` 的调用必须失败。\n  规格：`[](started(contract.transfer(to,\
    \ value), to == address(0)) == (reverted(contract.transfer) || finished(contract.transfer(to,\
    \ value), false))`\n\n* `erc20-transfer-succeed-normal`：函数 `transfer` 在允许的非自转移上成功。如果满足以下条件，所有对\
    \ `transfer(recipient, amount)` 的调用必须成功并返回 true：\n  - 接收地址不是零地址。\n  - 金额未超过余额。\n\
    \  - 转移金额不会导致接收方溢出。\n  - 提供的 gas 足够完成调用。\n  规格：`[](started(contract.transfer(to,\
    \ value), to != address(0) && to != msg.sender && value >= 0 && value <= _balances[msg.sender]\
    \ && _balances[to] + value < 0x1000000000000000000000000000000000000000) == (finished(contract.transfer(to,\
    \ value), true))`\n\n有了这些模板和特性，我们需要定义公式。例如：\n\n![](img/Figure-5.8.jpg)\n\n**图\
    \ 5.8：**合约中的 transferfrom 函数\n\n"
