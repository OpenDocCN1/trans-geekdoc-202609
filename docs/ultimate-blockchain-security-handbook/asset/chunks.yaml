  trans: '

    -   区块链是去中心化的，因此没有单一的数据源可以被黑客攻击，也不需要引入第三方供应商（这些供应商也可能被攻击）来处理交易。

    -   区块链使用 `private key`（私钥）进行加密，以提供额外的安全保障，并确保数据不会落入他人之手中。

    -   所有更改都在所有节点中实时完成，这增加了账本的透明度和信任度，并确保了没有单点故障。

    -   区块链几乎是不可篡改的，因为更改任何记录将使其文件签名失效并引发巨大的警报。

    -   共识过程要求网络成员解决一个需要强大计算能力的数学谜题。例如，你必须得出一个与难度级别匹配的 `nonce`（随机数）值，如果矿工得到了正确答案，结果将广播到网络进行验证。最长链规则在网络接受任何交易之前会检查所做的工作（链的长度、为构建该链付出了多少精力），以防止通过构建一个比真实链更长或更强大的伪链来让网络认可，如`Figure
    1.2`所示。


    ![](img/Figure-1.2.jpg)


    **图 1.2:** 区块链网络中最长链说明


    为了解释我关于最长链和投入最多工作的观点，请考虑以下示例；如果链的区块更多但难度级别较低，它将不会被网络接受（参考`Figure 1.3`）。


    构建所需能量最大的区块链被称为 `longest chain`（最长链）。通常，这是拥有区块最多的链，或者更准确地说，包含工作量最多的链。


    ![](img/Figure-1.3.jpg)


    **图 1.3:** 最长链的接受标准


    **注意**


    请访问`[https://learnmeabitcoin.com/technical/longest-chain]` 了解更多。建议充分理解链长度的计算方法、链工作公式及其结果。


    如果你必须伪造链（即创建一个相似的副本链，但付出了更多工作、更多区块，并且比网络中任何其他矿工都更快地广播区块），你需要开发一台超级计算机，这在技术和经济上对于所获的收益来说是不可行的。


    参与验证过程的矿工将获得经济激励，目前的奖励费用为 6.25 比特。


    任何区块包含以下数据：


    -   **Version（版本）：**区块的当前版本。

    -   **Previous block header hash（上一个区块头哈希）：** 父区块的引用哈希。

    -   **Merkel root hash（Merkle 根哈希）：**区块中所有交易的加密哈希。

    -   **Time（时间）：** 区块创建的时间。

    -   **nBits:** 目标阈值和区块当前难度的编码形式。

    -   **Nonce（随机数）：** `number used once` 的缩写，是矿工添加到区块中的随机数。


    当区块进行哈希处理时，区块内所有的元数据都会作为哈希函数的输入，这些值中的任何一个更改都会产生不同的哈希值。


    如果你想写下区块链的安全优势，请考虑前述规则以及构成区块链的安全特性。因此，无论这些安全特性带来什么益处，区块链技术都已经内置了它们。


    我们将在讨论区块链如何赋能安全并帮助多个行业时，看到这些是如何结合在一起的。


    # 制造业


    由于供应链广泛且复杂，制造商需要确保从上游合作伙伴发送的规格是可信的。在此时，区块链的抗篡改性就派上了用场。区块的时间戳提供了额外的细粒度，进一步增强了保障。


    # 医疗保健


    通过安全地加密电子患者记录并使用区块链技术，可以保护网络中个人患者的匿名性，防止它们被攻击。这保证了患者、医疗提供者和临床医生可以无缝共享数据，而不必担心隐私或安全问题。


    此外，医疗机构很难跨平台安全地共享数据。最终，服务提供者之间改进的数据协作可能会导致更准确的诊断、更有效的治疗和更具效益的护理。


