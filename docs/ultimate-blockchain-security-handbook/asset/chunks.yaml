    # [Topics and Data in Ethereum Log Records](#toc.xhtml#s127a)


    In the first part of a log record, there are several different issues. These things
    are used to explain what happened. The signature (a keccak256 hash) of the name
    of the event that happened and the types (uint256, string, and so on) of its inputs
    are usually the first subjects.


    Note that this signature is not always the first subject. One case where it is
    not is when unnamed events are sent.


    Since topics can only hold up to 32 bytes of information, they can''t be used
    to store groups or words. Instead, it should be part of the log record as information,
    not as a topic.


    In the second part of the log record, there is more information. Topics and facts
    work best together because they both have pros and cons. For example, you can
    look for ideas, but not for data. Adding facts, on the other hand, is a lot cheaper
    than adding topics. Topics are also limited to 4 \* 32 bytes, but event data is
    not. This means that event data can include big or complicated data like lists
    or strings. So, the event data, if there is any, can be thought of as the value.


    # [Storage of Ethereum logs](#toc.xhtml#s128a)


    When a smart contract sends out an event, the log data that goes with it is written
    down and kept in a transaction report. Every transaction has a receipt that shows
    the results of the operation, such as the state and event logs. In addition, the
    transaction logs contain the gas amount used. Let us understand a bit more by
    looking through the two main use cases.


    *   **Asynchronous Triggers with Data:** When building daps and other Web3 platforms,
    you generally set up your projects so that they monitor relevant Ethereum smart
    contract events. These event logs allow the smart contract to interact with Dapp’s
    frontend.


    *   **Smart Contract Return Values:** This is to pass along the return value of
    a contract to a Dapp’s frontend, which will enable monitoring of the process flow
    of your blockchain application.


    Here is an example that will help you understand how topics, data, and log records
    work together.


    Token contracts that adhere to ERC20 use the Transfer event, which is what this
    contract uses:


    ![](images/Figure-6.16.jpg)


    **Figure 6.16:** Transfer function contract to show events


    Since this is not an anonymous event, the first topic will consist of the event
    signature:


    ![](images/Figure-6.17.jpg)


    **Figure 6.17:** First Topic analysis


    Let’s look at the arguments (from, to, value) of this Solidity event:


    ![](images/Figure-6.18.jpg)


    **Figure 6.18:** Solidity event matrix


    Since the first two arguments are stated to be indexed, they are treated as extra
    topics. Our final argument will not be indexed, meaning that it will be attached
    as data instead of a different topic. Therefore, we can search for things like
    “find all Transfer logs from address 0x0000… to address 0x0000”. or “find all
    logs to address 0x0000”. but not for things like “find all Transfer logs with
    value “x”.” We know that this event will have three items, so the LOG3 opcode
    will be used to log it.


    ![](images/Figure-6.19.jpg)


    **Figure 6.19:** Log 3 analysis


    **LOG3(memoryStart, memoryLength, topic1, topic2, topic3)**.


    Here’s how memory is used to read event data:


    **memory\[memoryStart… (memoryStart + memoryLength)\]**


    With higher-level smart contract programming languages like Solidity, Vyper, or
    Bamboo, they will write event data to memory for us. This implies that you can
    usually pass data directly as a parameter when producing logs.


    **Retrieving event logs**


    The following code sends an alert whenever a new SAI token transfer happens. This
    can be useful for various purposes. For instance, a wallet display could tell
    you when your Ethereum address gets coins.


    ![](images/Figure-6.20.jpg)


    **Figure 6.20:** Retrieving event logs


    The next step in your logging journey is to understand the high-level architecture,
    where the logs need to be generated, and how they can be forwarded.


    **Security logging and monitoring architecture**


    When your architecture is distributed and decentralized, this task becomes more
    complex. To better control the risk and prevent repudiation attacks, you need
    to have a robust logging and monitoring infrastructure for your blockchain network.


    To architect a logging and monitoring solution, the first step is to identify
    the data sources, the interfaces, and the storage elements where the data is parsed
    and stored. The second step is to ensure that the data sets are marked based on
    what you want to capture and filter. For example, out of the fields `Name`, `Address`,
    `Phone Number`, `Public Key`, `Time`, `Event`, you need to extract only the public
    key and Time fields, as the other fields hold PI information and would not be
    beneficial, in addition to increasing the overall size.


    The last step is to hook up and forward the filtered events into a data lake,
    where you can get a visual view of the fault management. The architecture of Splunk
    Cloud, as shown in *[Figure 6.21](#c06.xhtml#fig6_21)*, gives a good representation
    of how to architect a secure logging and monitoring solution for your WEB3 Dapp.


    ![](images/Figure-6.21.jpg)


    **Figure 6.21:** Splunk cloud for blockchain logging and monitoring


    *[Figure 6.22](#c06.xhtml#fig6_22)* displays the anticipated view when the data
    is injected into the data lake. This offers not only meaningful insights like
    alarms, health status, faults, and security audit logs but also the ability to
    understand your user’s behavior and performance indicators.


    ![](images/Figure-6.22.jpg)


    **Figure 6.22:** Splunk Cloud – Data insights


    By using these add-ons, you can have good visibility of your blockchain data,
    thereby reducing risk in your blockchain application. For more information, please
    visit: **[https://lantern.splunk.com/Data\_Descriptors/Blockchain\_data](https://lantern.splunk.com/Data_Descriptors/Blockchain_data).**


    # [Conclusion](#toc.xhtml#s129a)


    You made it! Congratulations on reaching the end. This final chapter has covered
    blockchain security solutions in great detail. We learned zero-knowledge proof
    concepts and looked at identity and access management and PKI architecture, which
    will help you enforce security in transit and at rest and make your architecture
    components trustworthy. We also looked at the security logging architecture and
    took a deep dive into smart contract logging. All these tools and frameworks will
    strengthen your defense and allow you to establish trust with your customers.


    Now that you have completed the book, you’re ready to plan and architect your
    blockchain solution with confidence.


    # [Points to remember](#toc.xhtml#s130a)


    *   With zero-knowledge proof, you can prove to the second party that the information
    you are sharing is legitimate and proven.


    *   Identity and access management principles protect the resources from unauthorized
    access. You can control who is accessing your smart contracts and resources and
    limit how much they can access.


    *   The public key infrastructure consists of public and private key pairs, certificate
    authorities, and digital certificates. It helps you ensure trust in your network
    and enables authentication and confidentiality in your blockchain network.


    *   Security logging is the way to filter events in your network to give you meaningful
    insights that can be used to debug, trace, and monitor suspicious activity in
    your network.


    *   Logging infrastructure consists of logging hooks from data processing components
    and log forwarding agents to consolidate the events in one place and provide a
    dashboard view.


    # [References](#toc.xhtml#s131a)


    *   **[https://www.kaleido.io/blockchain-platform/aws-enterprise-single-sign-on](https://www.kaleido.io/blockchain-platform/aws-enterprise-single-sign-on)**'
