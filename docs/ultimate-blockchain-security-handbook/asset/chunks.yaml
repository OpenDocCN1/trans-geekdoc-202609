- raw: "Trust boundaries are created depending on the asset type and actors' interaction.\
    \ As a general rule, sensitive information such as private keys, tokens, and key\
    \ access, should be restricted to a private boundary. Anything exposed to the\
    \ public should be in a separate zone, while interaction with external API or\
    \ cloud providers sits in a different zone.\n\nEach zone will have its own security\
    \ posture. There will be a separation between each zone, and inter-zone movement\
    \ will be restricted through confidentiality, integrity, and authentication checks.\n\
    \nBased on the information we have of the use case, this is what the architecture\
    \ looks like, as shown in *[Figure 3.7](#c03.xhtml#fig3_7)*.\n\n![](images/Figure-3.07.jpg)\n\
    \n**Figure 3.7:** Crypto Wallet threat modeling diagram\n\nThe third step is to\
    \ discover threats using STRIDE, which can potentially be attacked, keeping in\
    \ view the security architecture that we build earlier.\n\nBut what is STRIDE,\
    \ and how does it apply to the threat modeling data flow? Let me explain.\n\n\
    STRIDE is an acronym for Spoofing, Tampering, Repudiation, Information disclosure,\
    \ Denial of service, and Escalation of privilege.\n\nLet me expand on what STRIDE\
    \ means by explaining the meaning of each letter:\n\n*   **Spoofing** is the act\
    \ of disguising a communication or identity so that it appears to be associated\
    \ with a trusted and authorized source.\n\n*   **Tampering** is when someone hacks\
    \ the software parameters in the e-wallet to produce different behavior.\n\n*\
    \   **Repudiation** is when someone denies another from performing their action.\n\
    \n*   **Information Disclosure** is sharing some of the system’s private information\
    \ with others.\n\n*   **Denial of service** occurs when users are unable to access\
    \ information, systems, or resources.\n\n*   **Elevation of Privileges** gives\
    \ authorization permissions beyond those initially granted.\n\n**Note**\n\n*Not\
    \ all of the STRIDE elements apply to each use case. Quickly evaluate if it applies.\
    \ For example, if you're using a public cloud like AWS to host your infrastructure,\
    \ then Denial of service on hardware isn't your responsibility because it’s taken\
    \ care of by the cloud provider under a service-level agreement.*\n\nIn *[Figure\
    \ 3.8](#c03.xhtml#fig3_8)*, we have mapped the STRIDE framework into the data\
    \ flow diagram where it applies. For example, Spoofing applies to users who are\
    \ onboarded into the application. This can also be targeted for the banks where\
    \ users will go to withdraw the cryptocurrency into cash.\n\nOn the other hand,\
    \ tampering attempts can be done on crypto exchanges, and information disclosure\
    \ can be carried out in the database and memory where sensitive data like user\
    \ information, token, and secrets are stored.\n\nLastly, a Denial of service (DOS)\
    \ attack can be carried out on the DaPP and API gateway, since they are mostly\
    \ exposed to the internet. So, they can be the low-hanging fruit for attackers.\n\
    \n![](images/Figure-3.08.jpg)\n\n**Figure 3.8:** Threat Modeling Implementation\
    \ on Blockchain with STRIDE\n\n# [Mitigations against STRIDE Attack Vectors](#toc.xhtml#s66a)\n\
    \nThe final step of the threat modeling exercise is to tighten your architecture\
    \ with mitigating controls against the STRIDE attack vectors. There are several\
    \ ways to accomplish this, and my recommendation is to understand and classify\
    \ each of these attacks in terms of probability and impact, and then apply the\
    \ control.\n\nLet us take a detailed look at each STRIDE vulnerability and mitigation\
    \ control:\n\n*   **Spoofing:** Spoofing attacks include cookie replay attacks,\
    \ session hijacking, and cross-site request forgery (CSRF) attacks.\n\n    Since\
    \ spoofing is an attack on user authentication, the best form of prevention is\
    \ to implement secure user authentication methods, including both secure password\
    \ requirements and multi-factor authentication (MFA).\n\n*   **Tampering**: Tampering\
    \ attacks such as Cross-Site Scripting (XSS) and SQL injection damage the integrity\
    \ of the application. In order to protect against tampering, the application should\
    \ be designed to validate user inputs and encode outputs. Static code analysis\
    \ should be used to identify vulnerabilities to tampering in the application,\
    \ both during the development stage and once the application is in production.\n\
    \n*   **Repudiation**: A repudiation attack is an attack on the validity and integrity\
    \ of actions on the application. Repudiation attacks take advantage of a lack\
    \ of controls that properly track and log user actions, using this to manipulate\
    \ or forge the identification of new, unauthorized actions, delete logs, log wrong\
    \ data to log files, and deny actions or receipt of service (for example, committing\
    \ fraud).\n\n    This can be prevented by incorporating digital signatures in\
    \ the application, which provide proof of actions, or by ensuring that there are\
    \ full, tamper-proof logs in place.\n\n*   **Information Disclosure:** This information\
    \ can then be used by attackers to force access to the application, gathering\
    \ information about customers, which can be used in a further crime, or gaining\
    \ privileges that will give access to more sensitive areas of the application.\n\
    \n    Prevention methods include ensuring that error messages, response headers,\
    \ and background information should be as generic as possible to avoid revealing\
    \ clues about the application’s behavior.\n\n    Proper access controls and authorizations\
    \ should be in place to prevent unauthorized access to information.\n\n*   **Denial\
    \ of service:** Denial of service (DoS) attacks flood the target with traffic,\
    \ triggering a crash and shutting it down to legitimate traffic. DoS attacks typically\
    \ cost time and money but do not cause other damage to their victims. The most\
    \ common form of DoS attack is a buffer overflow attack, which simply sends excessive\
    \ traffic to the application. Other attacks exploit vulnerabilities to cause systems\
    \ to crash.\n\n    Applications can be protected against DoS attacks by configuring\
    \ firewalls to block traffic from certain sources, such as reserved, loopback,\
    \ or private IP addresses, unassigned DCHPDHCP clients, or introducing rate limiting\
    \ to manage traffic.\n\n*   **Escalation of privilege**: Privilege escalation\
    \ attacks exploit vulnerabilities and misconfigurations in the application to\
    \ gain illicit access to elevated or privileged rights. Privilege escalation attacks\
    \ may exploit credential and authentication processes, compromise vulnerabilities\
    \ in code and design, take advantage of misconfigurations, or use malware or social\
    \ engineering to gain access.\n\n    Mitigation includes hardening systems and\
    \ applications through configuration changes, removing unnecessary rights and\
    \ access, closing ports, and more.\n\nThe following table provides a good, summarized\
    \ view for your reference.\n\n![](images/Figure-3.9.jpg)\n\n**Figure 3.9:** Summary\
    \ of STRIDE with Controls\n\n# [Conclusion](#toc.xhtml#s67a)\n\nGreat job on completing\
    \ the third chapter! With this knowledge, you can easily do risk management for\
