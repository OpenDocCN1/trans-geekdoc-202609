    \ You have also learned the tool of threat modeling, equipping you to build a\
    \ security architecture for your blockchain application. Any direct security controls\
    \ can be applied to the architecture as you build the data flow diagram, and any\
    \ security gaps can be filled up through STRIDE evaluation. This chapter has given\
    \ you a lot of hands-on work and will prove vital as you progress through this\
    \ book.\n\nIn the next chapter, we will look at the ways to exploit blockchain\
    \ applications, which means taking a deep dive into attack vectors, penetration\
    \ testing tools, infrastructure, and smart contracts with real-world examples.\n\
    \n# [Points to remember](#toc.xhtml#s68a)\n\n*   Blockchain risk management is\
    \ like risk management you would do in any other project. It includes identification,\
    \ classification, and mitigation stages."
