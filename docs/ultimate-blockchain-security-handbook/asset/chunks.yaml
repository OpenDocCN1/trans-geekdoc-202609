    The Nessus vulnerability is the preferred option. It has good coverage and provides
    a template that you can customize as per your blockchain application design. `Nessus`
    works by testing every port on a blockchain network, figuring out which services
    are are running, and testing each service for vulnerabilities.


    `[Figure 4.6](#c04.xhtml#fig4_6)` depicts the snapshot taken from the Nessus scanning
