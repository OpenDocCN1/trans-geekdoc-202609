  trans: '


    - **可操纵用户（Malleable user）：** 该漏洞与调用同一智能合约的两个依赖交易之间的执行顺序有关。如果没有按照正确的顺序执行，恶意用户可以利用此漏洞进行攻击。交易的执行顺序由矿工决定，但如果攻击者本身就是矿工，这将是一个非常灾难的局面。建议强制要求合约代码要么返回预期输出，要么失败。应该强制执行交易顺序，否则应生成错误。

    - **不可信的数据馈送（Untrustworthy data feeds）：** 某些智能合约需要来自区块链外部的数据馈送，但无法保证外部数据源是可靠的。因此，当攻击者故意发送错误信息导致智能合约操作失败时，将会处于危险状态。任何来自外部的请求都需要经过适当的身份验证和授权，例如使用带有有效证书的
    HTTPS，并且这应该落在 API 网关上。

    - **共识机制：** 在以太坊转向权益证明（PoS）后，它采取了以下安全措施来克服恶意用户利用网络。

    - **惩罚（Slashing）：** 以太坊实现了一种名为 `slashing` 的机制，以威慑并减轻对网络的攻击。惩罚是对实施恶意行为或未能遵守网络规则的验证者实施的处罚。如果发现验证者有恶意行为或违反网络规则，将根据违规的程度部分或全部没收其质押资金。以太坊社区有权销毁不诚实验证者的代币。

    - **检查点（Checkpointing）：** 以太坊还有一种名为 `checkpointing` 的机制来帮助从攻击中恢复。检查点涉及在区块链中定期创建参考点或“检查点”。如果发生攻击，网络可以回溯到最近的检查点，从而撤销恶意活动并将网络恢复到之前的状态。


    在 PoS 系统中，网络能够抵御 51% 的攻击，且验证者需要质押自己的加密货币作为抵押来参与共识过程。这意味着，试图通过创建无效区块或批准欺诈交易来欺骗系统的验证者，其质押将将被没收。这对恶意行为构成了强力威慑，因为验证者有财务动机去诚实守并保护网络。


    以太坊网络在受到任何攻击时可以利用一系列防御策略，最小的响应可以是强制在没有任何额外惩罚的情况下将攻击者的验证者从网络中移出，社区也可以决定采取更严厉的手段惩罚攻击者，例如撤销过去的奖励或销毁其部分（最高
    100%）的质押资金。


    # 以太坊安全考量


    尽管以太坊基金通过赏金计划在识别和处理智能合约层的所有漏洞方面尽了尽职调查，并且还有不同的审计工具可以被适配以识别和缓解协议、客户端和 solidity 中的漏洞，但尽管如此，仍然有一些领域值得关注。


    **你知道吗？**


    *通过发现影响以太坊网络的协议、客户端和 solidity 漏洞，你可以获得高达 $250,000 的奖励并进入榜单 – 以太坊.org*


    # 共识层的中心化


    一个潜在的漏洞区域是共识层，大多数验证者都位于 Coinbase、Kraken 和 Binance 等大型交易所之下。这可能导致中心化问题，并在核心位置产生攻击面。例如，由于某种原因，如果监管机构制裁或禁止了某些大机构，那么整个以太坊验证生态系统将面临风险，这就像面临着*大到不能倒*的风险。


    另一个漏洞领域是钱包，例如 MetaMask 以及你与以太坊交互的软件，如使用 `geth`（go 以太坊客户端）。


    # MetaMask


    当你使用 MetaMask 时，请确保浏览器上安装了最新版本，并安全地保存了密码。当你第一次创建钱包时，你会收到 12 个单词的秘密恢复词（Secret Recovery
    Phrase）。


    MetaMask 不使用云端。假设你的设备损坏、丢失、被盗或信息被篡改，MetaMask 支持小组无法为你恢复这些内容。恢复 MetaMask 账户的唯一方法是使用这个秘密恢复词。其次，请对你的私钥和秘密恢复词加密。如果你账户中有大量代币，请考虑购买硬件钱包。


    # 漏洞管理


    当你与以太坊 Geth 客户端或 EVM 交互时，请交叉验证 `https://www.cvedetails.com/vulnerability-list/vendor_id-17524/product_id-51210/Ethereum-Go-Ethereum.html`
    下的 CVE，然后查看漏洞披露页面 - `https://geth.ethereum.org/docs/developers/geth-developer/disclosures`。


    如果你查看以下 CVE，你会对预期情况有一个良好的了解。确保你的软件中没有开放的 CVE，并且正在运行最新的补丁。


    保护自己免受典型的智能合约弱性影响，如重入（Reentrancy）、整数下溢和溢出以及预言机操纵（Oracle manipulation）。确保所有相关漏洞都已修复、测试并验证。


    ![](img/Figure-2.17.jpg)


    **图 2.17：** 以太坊常见漏洞披露 (CVE)


    **注意**


    *对你在区块链产品上使用的任何开源软件进行尽职调查总是更好的，例如：保持补丁更新、定期进行威胁建模、通过模拟（即红蓝对抗演练）进行审计和风险分类等。CVE
    在漏洞利用发生后才会发布，你仅可以将 CVE 矩阵作为参考*。


    书中后后会有更多内容，届时我们将详细介绍区块链漏洞及其补救措施。


    # 加固访问控制


    任何外部所有账户 (EOA) 或合约账户都可以调用智能合约中标记为 `public` 或 `external` 的函数。如果你认为他人应该根据你的约定进行连接，那么标记功能的可感知性是重要的。然而，智能合约内部的函数——而非外部账户——只能调用私有函数（private
    functions）。


    需要安全的访问控制来防止未经授权使用智能合约函数。智能合约的访问控制机制限制了谁可以使用某些函数，例如负责管理合约的账户。用于实现智能合约访问控制的两种模式是
    Ownable 模式、基于角色的控制以及使用多签名。


    - **Ownable 模式：** 使用 Ownable 模式，在创建合约的过程中会选择一个地址作为合约的 `owner`（所有者）。在私有方法上添加 `Only
    Owner` 修饰符。这确保了合约在运行代码之前检查调用地址的名称。这样，不是所有者的人就无法许可进入，来自合约所有者其他地址对保护服务的调用都会被拒绝。


