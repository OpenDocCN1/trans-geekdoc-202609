    \ Consequently, a designer could run a unit test to check if calls to `bid()`\
    \ succeed or come up short when the closeout is finished (that is, when `auctionEndTime`\
    \ > `block.timestamp`).\n\n```javascript\nconstructor(\n    uint biddingTime,\n\
    \    address payable beneficiaryAddress\n) {\n    beneficiary = beneficiaryAddress;\n\
