- raw: '    Every good thing comes at a cost, so what is the trade-off of having fast
    performance and improved scalability? Trust and centralization aspects directly
    impact security tolerance. Let us have a look.


    *   **Trust dependency:** Private blockchains have a decent level of scalability.
    This means that your needs can dictate the size of your private blockchain. For
    instance, a blockchain can be easily implemented by an organization with just
    20 nodes. They won''t have any trouble adding more nodes as a result of the expansion.


    *   **Tight centralization:** Since they require a central Identity and Access
    Management (IAM) system for proper operation, private blockchains are restricted.
    This framework has all the observing and managerial privileges. It grants permission
    to either select the level of access they have to the data stored in the blockchain
    or to add a new node to the network. The concept of decentralization, which is
    one of the pillars of blockchain technology, is in direct opposition to this system
    as shown below.


    ![](images/Figure-2.4.jpg)


    **Figure 2.4:** Centralization aspect of Private blockchain as compared to Public
    Blockchains


    Both aforementioned factors influence the security aspect, such that a private
    blockchain network is more vulnerable to security breaches because it has fewer
    participants or nodes. Assuming anybody of the hubs accesses the focal administration
    framework, it can get close enough to every one of the hubs in the organization.
    This makes it more straightforward for a hub to hack the whole private blockchain
    and abuse the data.


    **Case study:** Hyperledger Fabric is a blockchain framework for application development
    with unique access control and identity management features. Walmart uses a private
    Hyperledger Fabric-based blockchain system. An illustration of a permissioned
    blockchain is the Linux Foundation''s open-source framework.


    It lets Walmart find out where its products came from. The certificates of authenticity
    are added to the ledger by its suppliers. The business is able to track the origin
    of their products in seconds rather than days thanks to this.


    # [Hybrid blockchain](#toc.xhtml#s28a)


    It is the mingled content of the private and public blockchains, with some parts
    under the control of a specific organization and others made public. You can think
    of an implementation of Ethereum and a Hyperledger fabric. Any industry can be
    benefitted from such a design, where in some cases, where information can’t be
    shared with the public yet needs to be kept unaltered, and automated with a workflow,
    you can leverage a private blockchain. Whereas in the same organization, where
    you want to target public trust and enable P2P transactions, a Bitcoin or an Ethereum
    can be used.


    **Case Study:** It gives a more noteworthy answer for the medical services industry,
    government, land, and monetary organizations. It offers a solution when data must
    be kept private but can be accessed by the public. A good example would be when
    a patient wants to share medical data with the doctor and health insurance company
    but also wants to ensure personal privacy and security.


    The other good use case would be to use a private payment system on public networks.
    The following figure is a good illustration to see the difference, you get the
    best of both Public and Private blockchain types.


    ![](images/Figure-2.5.jpg)


    **Figure 2.5:** Hybrid Blockchain type


    # [Consortium blockchain](#toc.xhtml#s29a)


    Nodes from multiple businesses or organizations govern the network in a consortium
    blockchain in much greater privacy. Through this platform, they collaborate to
    share and modify information to maintain workflow, scalability, and accountability.
    This can be seen from the following figure that consortium blockchain is restricted
    to the organization that is part of the consortium group.


    ![](images/Figure-2.6.jpg)


    **Figure 2.6:** Consortium Blockchain


    The primary objective of a consortium blockchain is to assist institutions in
    resolving issues and locating applicable solutions through this platform. CORDA
    and Quorum are two well-known consortium blockchains in which different organizations
    are involved.


    To be clear, and separate it from a Private blockchain, while a consortium blockchain
    has a few chosen members (for example a few associations), a private blockchain
    has a member who has sole command over the principles of the blockchain, meaning
    he can use the same blockchain platform, for example, HL Fabric in a private enterprise
    setup.


    **Case Study**: In the Financial sector, KYC is a part of the business of issuing
    and trading assets in this sector. Dataset information is centrally stored by
    all participating banks in a consortium. This distributed ledger will be there
    for a bank whenever it needs to verify or access the creditor''s information.
    A detailed analysis reveals that consortium is the best option for implementing
    cross-sector projects.


    Other blockchain implementations can be seen as follows. It extends from healthcare
    to energy, all the way to technology and media, where common groups combine to
    solve a specific solution. The following figure gives a good indication of how
    consortium blockchain implementation is distributed across various sectors, with
    the financial sector taking the majority of the share.


    ![](images/Figure-2.7.jpg)


    **Figure 2.7:** Consortium Blockchain Sector Distribution


    # [Ethereum Overview](#toc.xhtml#s30a)


    Before going into its security posture, let us take a moment to review Ethereum.


    # [Introduction to Ethereum](#toc.xhtml#s31a)


    Let us start with the basics. What is Ethereum, how is it different from Bitcoin,
    and what does the architecture look like? These are all important questions to
    unfold, before going into deep dive, reviewing the security posture, and then
    finding ways to exploit and finally secure it.


    This also comes under the public blockchain category. You must be wondering why
    we didn’t discuss it in *[Chapter 1, Blockchain Security Overview](#c01.xhtml)*.
    One reason is that its architecture is a bit different from the Bitcoin blockchain,
    in way that it involves smart contact and enables the creation of decentralized
    application, which can be tuned for a private blockchain as well, so I wanted
    to open it up after we discussed different types of blockchain, so you don’t get
    confused. Let’s start.


    Ethereum is a decentralized technology that can be used to build apps and organizations,
    hold assets, conduct business, and communicate. Ethereum lets you keep control
    of your own data and what is shared, so you do not have to hand over all of your
    personal information. Ether, Ethereum''s own cryptocurrency, is used to pay for
    certain network-based activities.


    # [Difference between Ethereum and Bitcoin](#toc.xhtml#s32a)


    Both are public blockchains, which let you use digital money to send without involving
    centralized payment providers or banks. But Ethereum is programmable, meaning
    you can build applications on top of its network. Being decentralized, the applications
    are known as decentralized applications.


    Ethereum is more like a marketplace for financial services, games, social networks,
    and other apps that respect your privacy and cannot censor you than Bitcoin is
    just a payment network.


    The native cryptocurrency of Ethereum is called Ether (ETH). It can be sent instantly
    to anyone in the world because it is entirely digital. Decentralized and transparent,
    the supply of ETH is not controlled by any government or business. Only validators
    (like miners in the POW consensus mechanism), who have staked their coins, and
    who work to protect the network receive new coins, which are also referred to
    as tokens.


    On the Ethereum network, a certain amount of computational power is required for
    each action. The payment for this service is made in ether. This means that to
    use the network, you need at least a small amount of ETH.


    # [Working of Ethereum](#toc.xhtml#s33a)'
