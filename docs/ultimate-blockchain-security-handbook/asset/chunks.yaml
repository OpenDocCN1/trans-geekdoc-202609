    ### 案例研究：Enno Wallet 移动应用程序威胁模型


    [`blog.ennowallet.com/introducing-enno-wallet-threat-model-for-mobile-apps-22a519df46bc`](https://blog.ennowallet.com/introducing-enno-wallet-threat-model-for-mobile-apps-22a519df46bc)


    # 第 4 章 (#toc.xhtml#c04)


    # 区块链应用利用 (#toc.xhtml#c04)


    # 引言 (#toc.xhtml#s71a)


    随着数字货币日益凸显，进入市场的人数正在迅速增加。遗憾的是，这些人中的一部分并不热衷于投资数字货币，因为他们的唯一目标是黑入并夺取他人的资源。为了让他们的任务更容易，这一领域并没有得到足够的关注。


    看看各种区块链应用，你会发现一个共同点是对比区块链应用安全的忽视态度。他们要么是太天真，认为区块链内置安全，要么认为他们需要的唯一安全就是对智能合约进行测试和审计。这一切都导致了攻击面的扩大，为黑客的利用留下了后门和漏洞。


    现在问题出现了：我们如何知道弱点在哪里，多大的安全性才足够？我们在上一章中尝试通过威胁建模分析部分涵盖了这个主题，但除此之外还有更多内容。无论我们分析得多么仔细，考虑到我们所处理的区块链范式的广泛性，我们能做的非常有限。在我们加强区块链安全的过程中，另一个出现的问题是：我为什么要把精力和资源投入到区块链的安全方面？我们如何知道这些漏洞是可利用的？换句话说，我需要一个实施安全的业务理由——安全并不便宜。


    为了回答这个棘手的问题，我们必须使用如渗透测试等工具和策略，验证加密钱包的强度，检查智能合约代码，最后，理解黑客尝试成功的场景。通过这种方式，你可以在设计应用程序的安全解决方案时考虑这些因素。


    # 结构 (#toc.xhtml#s72a)


    我们将在本章中涵盖以下主题：


    * 区块链渗透测试

    * 使用实验室黑入智能合约

    * 整数溢出和下溢威胁缓解

    * 智能合约的顶级攻击向量分析

    * 有用的工具和资源


    # 区块链渗透测试 (#toc.xhtml#s73a)


    想象一场黑入安全区块链应用程序的团队竞赛，获胜者将通过周末的工作利用漏洞来赚取巨额现金奖金。这些黑客松在现实生活中经常发生。网络安全公司举办此类活动以识别其系统中的弱点。这种做法被称为**道德黑客**，因为你故意邀请他人黑入你的计算机，以便知道如何加强防御。它带给你以下益处：


    * 通过识别攻击者可以利用的漏洞来防止黑客和攻击。

    * 确保信任和合规性，从而与投资者和客户建立信任和信誉。

    * 通过帮助识别问题和错误（如断链或加载速度缓慢）来改善用户体验。

    * 通过提前发现问题来节省金钱；在开发阶段修复漏洞比发布后修复要便宜得多。


    在本节中，我将解释渗透测试是如何工作的，以及它如何通过识别可能的攻击路径并在区块链网络中横向移动的路径，帮助区块链解决方案加强安全防御。一如既常，让我们从基础知识开始。


    ## 什么是渗透测试或道德黑客？


    道德黑客，也称为渗透测试（简称 pen testing），是指评估你的计算机系统应用程序是否存在漏洞以及对黑客和网络攻击等威胁的敏感性的安全过程。


    让我来梳理一下区块链渗透测试的路线图。它主要包含六阶段，如图 4.1 所示。


    ![](img/Figure-4.1.jpg)


    **图 4.1：** 区块链渗透测试路线图


    # 计划 (#toc.xhtml#s74a)


    这是信息收集阶段。它包括以下检查：


    * 确定测试的目标和范围，以及测试的系统及其方法。

    * 获取情报，例如目标网络和域名的名称、邮件服务器和其他细节，以理解目标的运行机制和潜在弱点。


    在这个阶段，会收集有关区块链平台的信息。在这里，你分析架构，确定威胁切入点，并为潜在威胁收集数据。你可以利用流行的工具如 `Nessus`、`Nmap` 和
    `Spyse` 来检查开放端口、面向公共 IP 和常见漏洞。


    [`pentestlab.blog/2020/06/15/spyse-a-cyber-security-search-engine/`](https://pentestlab.blog/2020/06/15/spyse-a-cyber-security-search-engine/)


    例如，使用 `Spyse`：


    为了让资产发现更容易，可以轻松找到给定域的子域名。在开源情报评估或检查客户的外部攻击面时，渗透测试人员和红队应该能够使用它。结果还包括 `A` 记录、`DNS
    CNAME` 和 `TLS/SSL` 的版本。由于 `TLS` 和 `SSL` 中存在许多漏洞，可以在任何其他工具之前先使用它们。图 4.2 是该项内容的截图。


    ![](img/Figure-4.2.jpg)


    **图 4.2：** 子域名列表


    为了检索链接、`robots.txt` 文件和 `HTTP headers` 等信息，你还可以对目标域名进行网络爬虫（跟踪网页上的链接以寻找有用信息）。这有助于识别网站当前使用的技术栈、识别敏感
    URL 的证据并规划应用程序。


    图 4.3 显示了链接标签页下信息的截图。


    ![](img/Figure-4.3.jpg)


    **图 4.3：** 链接标签页上的映射


    此外，图 4.4 显示了 HTTP headers 标签页下的信息。在这里，你可以看到使用的负载信息和 Cookie。


    ![](img/Figure-4.4.jpg)


    **图 4.4：** HTTP Header


    接下来是在 `robots.txt` 下看到的信息。星号 `*` 被列为通配符，意味着任何用户代理都可以访问它。但也可以成为攻击者的信号。


    ![](img/Figure-4.5.jpg)


    **图 4.5：** Robots.txt 内容


