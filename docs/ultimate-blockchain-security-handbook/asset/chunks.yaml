- raw: "Next, put your blockchain app's images, smart contracts, OS, and files through\
    \ a vulnerability check to look for common vulnerabilities (CVEs). This will let\
    \ you know if there are any out-of-date patches and how exposed the apps are to\
    \ major attacks. Finally, use all the knowledge you got in the previous steps\
    \ to do a penetration testing exercise with both red and blue teams. This will\
    \ make it easy for you to choose the right risk to deal with. This is the point:\
    \ get the risk from various tools and assess them until you have a good idea of\
    \ how bad it is.\n\n**Note**\n\n*A review of vulnerabilities helps the project\
    \ team understand what parts of the blockchain solution will be open to attackers\
    \ and what weak places could cause problems in the future. Finding holes is hard,\
    \ so all companies that use blockchain solutions should regularly do security\
    \ testing on every part of those solutions. Tests for smart contracts need to\
    \ be given extra care. To limit the risks, it's important to set up a way to protect\
    \ smart contract code early on.*\n\nWe will cover the threat assessment using\
    \ threat modeling in the next topic in much more detail, whereas the other topics\
    \ like vulnerability scanning, penetration testing will be covered in the following\
    \ chapters.\n\nAs the next step, let us understand the concept for classifying\
    \ the risk.\n\n# [Risk classification](#toc.xhtml#s55a)\n\nVulnerabilities and\
    \ threats combine to form risks, as defined in the previous steps. Prioritizes\
    \ risks by figuring out how likely it is that a particular vulnerability will\
    \ cross paths with threats and, if that does happen, how important the impact\
    \ will be. A risk with a significant impact but very unlikely to occur will be\
    \ managed differently than a risk with a moderate impact that is likely to occur\
    \ frequently.\n\nYou can use the following grid to rank the risks that come with\
    \ different blockchain application options.\n\n![](images/Figure-3.02.jpg)\n\n\
    **Figure 3.2:** Criticality estimates by likelihood and impact\n\nBring all your\
    \ teams together for a tabletop exercise. The people who own the assets should\
    \ figure out how important the data they hold is, and the people who design the\
    \ networks should be able to say whether the endpoints' IP addresses, ports, and\
    \ services are open or not. The company that sold the goods should also be involved\
    \ to explain any controls that are in place to make up for any mistakes or false\
    \ results.\n\nWhen classifying risks, the best thing to do is to group them down\
    \ to a very fine level. For instance, for any CVE or risk that has already been\
    \ discovered, if the underlying application has a routable IP address and holds\
    \ PI or SNPI data or any cryptographic keys, this means that anyone in the network\
    \ can reach that IP address. During the risk assessment process, direct and compensating\
    \ controls should also be checked to make sure they prevent CVEs for getting exploited.\
    \ A high score would be given to the risk that has high-value data, an IP address\
    \ that can be routed, and no security controls.\n\nNext, you need to put a dollar\
    \ amount on the risk. Let's say that the protected keys are lost or stolen. It\
    \ will be harder to get the data back. You can only handle clear text input, so\
    \ this would make things take longer. The program that has that data won't be\
    \ able to be used for a few hours while the backups are being restored. In terms\
    \ of money, this might be around $10,000.\n\n**Note**\n\n*The numbers don't have\
    \ to be exact; a calculate estimate will do*.\n\n# [Mitigation strategy](#toc.xhtml#s56a)\n\
    \nDeciding what to do with each risk in an important task. There are mainly the\
    \ following ways of addressing the risk.\n\n*   **Mitigate or reduce the risk**:\
    \ Do something about the risk and/or the defect right away to lessen its effects.\
    \ It might be harder to limit the effects of blockchain than with other technologies.\
    \ More attention should be paid to making systems less vulnerable and preventing\
    \ risks. This approach controls risk the best, but it usually costs a lot. It's\
    \ best for very high and very important risks.\n\n    **Example:** Code hardening\
    \ of smart contracts, patching the endpoints, and API Firewall filtering for any\
    \ incoming traffic towards blockchain oracles.\n\n*   **Accept the risk**. Risk\
    \ acceptance is when you choose to live with or accept a potential risk instead\
    \ of taking steps to reduce or avoid it. This approach is best advised for low\
    \ to medium risks.\n\n    **Example**: No security measures on securing the consensus\
    \ layer, assuming that the trust is achieved through the computation process,\
    \ the risk is low since the likelihood of pulling off a 51% attack is low in a\
    \ public blockchain as compared to the private blockchain, assuming the public\
    \ blockchain network is highly distributed.\n\n    **Note**\n\n    *But it's much\
    \ more likely that a 51% attack will work when there are hard forks that leave\
    \ behind a smaller blockchain with fewer nodes. A very small network can become\
    \ even smaller during times of the day when most miners turn off their nodes.\
    \ This makes 51% strikes very easy.*\n\n    In other case, the small to medium-sized\
    \ business that made the blockchain wallet might decide to take the chance of\
    \ a breach by not spending money on a hardware security tool for key management.\n\
    \n*   **Avoid the risk**. Change the way the system works to get rid of the unique\
    \ security problem. Usually, this means making trade-offs and letting go of some\
    \ features to build a system efficiently.\n\n    **Example**: No PI or SNPI information\
    \ is taken from the users in the blockchain onboarding process to avoid privacy\
    \ breaches in case of a cyber-attack.\n\n*   **Transfer the risk**. Involve a\
    \ third party, such as an insurance company or an external service provider, to\
    \ address the risk.\n\n    **Example**: Using a custodial wallet service using\
    \ an HSM on a cloud provider, where the cloud provider will be responsible to\
    \ manage security around the key lifecycle management.\n\n    But for the HSM\
    \ product, the wallet service provider needs to work out a service level agreement\
    \ with a cloud provider. If they do this, there is a risk of going against the\
    \ other party or terms not been followed. When you buy insurance, on the other\
    \ hand, you can give the risk to the insurance company in exchange for a price.\
    \ It all depends on the use case\n\n    **Note**\n\n    Transferring risk never\
    \ frees the owner from some risk. Not all risk can be transferred, but it can\
    \ be shared.\n\nThe following table is a good summary to understand the strategies.\n\
    \nIn the matrix below, avoid would also include the consideration of how costly\
    \ the mitigation is. If the cost of remediation is reasonable, then mitigation\
    \ is the recommended path. But if remediation is either cost prohibitive or there\
    \ is no known solution, coupled with the high-risk ranking (vulnerability \\*\
    \ threat), then risk avoidance would be recommended.\n\n![](images/Figure-3.03.jpg)\n\
    \n**Figure 3.3:** Strategies to counter the risk\n\n# [Risk management template](#toc.xhtml#s57a)\n\
    \nThere can be different attack scenarios and risk events that can happen on the\
    \ blockchain application, such as:\n\n*   A scenario where an attacker rewrites\
    \ the ledger by compromising enough nodes. This will put the community (in this\
    \ case, a consortium) at serious risk.\n\n*   The administrator’s secret key becomes\
    \ accessible to other parties, who can then impersonate the administrator and\
    \ even change the smart contracts.\n\n*   Node administrators can access confidential\
    \ data stored in the node.\n\nTo arrive at the best course of action, the following\
    \ worksheet will give you a good cheat sheet. While doing the risk assessment\
    \ for your blockchain application, ensure that you have knowledge of all these\
    \ areas and then adopt the controls appropriately.\n\n![](images/93.jpg)\n\n**Table\
    \ 3.1:** Risk Management Template\n\n**Note**"
  fmt: "\nNext, put your blockchain app's images, smart contracts, OS, and files through\
    \ a vulnerability check to look for common vulnerabilities (CVEs). This will let\
    \ you know if there are any out-of-date patches and how exposed the apps are to\
    \ major attacks. Finally, use all the knowledge you got in the previous steps\
    \ to do a penetration testing exercise with both red and blue teams. This will\
    \ make it easy for you to choose the right risk to deal with. This is the point:\
    \ get the risk from various tools and assess them until you have a good idea of\
    \ how bad it is.\n\n### Note\nA review of vulnerabilities helps the project team\
    \ understand what parts of the blockchain solution will be open to attackers and\
    \ what weak places could cause problems in the future. Finding holes is hard,\
    \ so all companies that use blockchain solutions should regularly do security\
    \ testing on every part of those solutions. Tests for smart contracts need to\
    \ be given extra care. To limit the risks, it's important to set up a way to protect\
    \ smart contract code early on.\n\nWe will cover the threat assessment using threat\
    \ modeling in the next topic in much more detail, whereas the other topics like\
    \ vulnerability scanning, penetration testing will be covered in the following\
    \ chapters.\n\nAs the next step, let us understand the concept for classifying\
    \ the risk.\n\n# Risk classification\n\nVulnerabilities and threats combine to\
    \ form risks, as defined in the previous steps. Prioritizes risks by figuring\
    \ out how likely it is that a particular vulnerability will cross paths with threats\
    \ and, if that does happen, how important the impact will be. A risk with a significant\
    \ impact but very unlikely to occur will be managed differently than a risk with\
    \ a moderate impact that is likely to occur frequently.\n\nYou can use the following\
    \ grid to rank the risks that come with different blockchain application options.\n\
    \n![](images/Figure-3.02.jpg)\n\n**Figure 3.2: Criticality estimates by likelihood\
    \ and impact**\n\nBring all your teams together for a tabletop exercise. The people\
    \ who own the assets should figure out how important the data they hold is, and\
    \ the people who design the networks should be able to say whether the endpoints'\
    \ IP addresses, ports, and services are open or not. The company that sold the\
    \ goods should also be involved to explain any controls that are in place to make\
    \ up for any mistakes or false results.\n\nWhen classifying risks, the best thing\
    \ to do is to group them down to a very fine level. For instance, for any `CVE`\
    \ or risk that has already been discovered, if the underlying application has\
    \ a routable IP address and holds `PI` or `SNPI` data or any cryptographic keys,\
    \ this means that anyone in the network can reach that IP address. During the\
    \ risk assessment process, direct and compensating controls should also be checked\
    \ to make sure they prevent `CVEs` for getting exploited. A high score would be\
    \ given to the risk that has high-value data, an IP address that can be routed,\
    \ and no security controls.\n\nNext, you need to put a dollar amount on the risk.\
    \ Let's say that the protected keys are lost or stolen. It will be harder to get\
    \ the data back. You can only handle clear text input, so this would make things\
    \ take longer. The program that has that data won't be able to be used for a few\
    \ hours while the backups are being restored. In terms of money, this might be\
    \ around $10,000.\n\n### Note\nThe numbers don't have to be exact; a calculate\
    \ estimate will do.\n\n# Mitigation strategy\n\nDeciding what to do with each\
    \ risk in an important task. There are mainly the following ways of addressing\
    \ the risk.\n\n- **Mitigate or reduce the risk**: Do something about the risk\
    \ and/or the defect right away to lessen its effects. It might be harder to limit\
    \ the effects of blockchain than with other technologies. More attention should\
    \ be paid to making systems less vulnerable and preventing risks. This approach\
    \ controls risk the best, but it usually costs a lot. It's best for very high\
    \ and very important risks.\n  **Example:** Code hardening of smart contracts,\
    \ patching the endpoints, and `API Firewall` filtering for any incoming traffic\
    \ towards blockchain oracles.\n\n- **Accept the risk**. Risk acceptance is when\
    \ you choose to live with or accept a potential risk instead of taking steps to\
    \ reduce or avoid it. This approach is best advised for low to medium risks.\n\
    \  **Example**: No security measures on securing the consensus layer, assuming\
    \ that the trust is achieved through the computation process, the risk is low\
    \ since the likelihood of pulling off a 51% attack is low in a public blockchain\
    \ as compared to the private blockchain, assuming the public blockchain network\
    \ is highly distributed.\n  **Note**: But it's much more likely that a 51% attack\
    \ will work when there are hard forks that leave behind a smaller blockchain with\
    \ fewer nodes. A very small network can become even smaller during times of the\
    \ day when most miners turn off their nodes. This makes 51% strikes very easy.\n\
    \  In other case, the small to medium-sized business that made the blockchain\
    \ wallet might decide to take the chance of a breach by not spending money on\
    \ a hardware security tool for key management.\n\n- **Avoid the risk**. Change\
    \ the way the system works to get rid of the unique security problem. Usually,\
    \ this means making trade-offs and letting go of some features to build a system\
    \ efficiently.\n  **Example**: No `PI` or `SNPI` information is taken from the\
    \ users in the blockchain onboarding process to avoid privacy breaches in case\
    \ of a cyber-attack.\n\n- **Transfer the risk**. Involve a third party, such as\
    \ an insurance company or an external service provider, to address the risk.\n\
    \  **Example**: Using a custodial wallet service using an `HSM` on a cloud provider,\
    \ where the cloud provider will be responsible to manage security around the key\
    \ lifecycle management.\n  But for the `HSM` product, the wallet service provider\
    \ needs to work out a service level agreement with a cloud provider. If they do\
    \ this, there is a risk of going against the other party or terms not been followed.\
    \ When you buy insurance, on the other hand, you can give the risk to the insurance\
    \ company in exchange for a price. It all depends on the use case.\n  **Note**:\
    \ Transferring risk never frees the owner from some risk. Not all risk can be\
    \ transferred, but it can be shared.\n\nThe following table is a good summary\
    \ to understand the strategies. In the matrix below, avoid would also include\
    \ the consideration of how costly the mitigation is. If the cost of remediation\
    \ is reasonable, then mitigation is the recommended path. But if remediation is\
    \ either cost prohibitive or there is no known solution, coupled with the high-risk\
    \ ranking (`vulnerability * threat`), then risk avoidance would be recommended.\n\
    \n![](images/Figure-3.03.jpg)\n\n**Figure 3.3: Strategies to counter the risk**\n\
    \n# Risk management template\n\nThere can be different attack scenarios and risk\
    \ events that can happen on the blockchain application, such as:\n\n- A scenario\
    \ where an attacker rewrites the ledger by compromising enough nodes. This will\
    \ put the community (in this case, a consortium) at serious risk.\n\n- The administrator’s\
    \ secret key becomes accessible to other parties, who can then impersonate the\
    \ administrator and even change the smart contracts.\n\n- Node administrators\
    \ can access confidential data stored in the node.\n\nTo arrive at the best course\
    \ of action, the following worksheet will give you a good cheat sheet. While doing\
    \ the risk assessment for your blockchain application, ensure that you have knowledge\
    \ of all these areas and then adopt the controls appropriately.\n\n![](images/93.jpg)\n\
    \n**Table 3.1: Risk Management Template**\n\n**Note**\n"
  trans: "\n接下来，对你的区块链应用程序镜像、智能合约、操作系统和文件进行漏洞检查，以寻找常见的漏洞（CVE）。这将让你了解是否存在任何过期的补丁，以及应用程序对主要攻击的暴露程度如何。最后，利用你在之前几个步骤中获得的所有知识，进行一次红蓝双方对抗的渗透测试练习。这将你能够容易地选择需要处理的正确风险。这里的关键在于：从各种工具中获取风险并对其进行评估，直到你对风险的严重程度有一个清晰的认识。\n\
    \n### 注意事项\n漏洞审查有助于项目团队理解区块链解决方案的哪些部分会暴露给攻击者，以及哪些弱环节可能会在未来引发问题。发现漏洞是困难的，因此所有使用区块链解决方案的公司都应该对这些解决方案的每个部分定期进行安全测试。智能合约的测试需要额外关注。为了限制风险，尽早建立一种保护智能合约代码的方法是非常重要的。\n\
    \n我们将在下一个主题中更详细地介绍使用威胁建模进行威胁评估，而漏洞扫描、渗透测试等主题将在接下来的章节中介绍。\n\n作为下一步，让我们理解风险分类的概念。\n\
    \n# 风险分类\n\n正如前面的步骤所示，漏洞和威胁结合构成了风险。通过确定特定漏洞与威胁碰撞的概率，以及如果确实发生，影响将有多重要，从而对风险进行优先级排序。一个影响巨大但发生概率极小的风险，其管理方式将与一个影响中等但可能频繁发生的风险有所不同。\n\
    \n你可以使用下面的网格对不同区块链应用选项带来的风险进行排序。\n\n![](img/Figure-3.02.jpg)\n\n**图 3.2：基于可能性和影响的严重性估计**\n\
    \n召集你所有的团队进行一次桌面演练（tabletop exercise）。资产所有者应该弄清楚他们持有的数据有多重要，而网络设计人员应该能够说明端点的 IP\
    \ 地址、端口和服务是否开放的。销售商品的公司也应该参与进来，解释已实施的任何弥补错误或错误结果的控制措施。\n\n在对风险进行分类时，最好的方法是将它们细分为非常精细的级别。例如，对于任何已发现的\
    \ `CVE` 或风险，如果底层应用程序具有可路由的 IP 地址，并持有 `PI` 或 `SNPI` 数据或任何加密密钥，这意味着网络中的任何人都可以访问该\
    \ IP 地址。在风险评估过程中，还应该检查直接控制和补偿控制，以确保它们能够防止 `CVEs` 被利用。对于具有高价值数据、可路由 IP 地址且没有安全控制措施的风险，将给出高分。\n\
    \n接下来，你需要为风险设定一个美元金额。假设受保护的密钥丢失或被盗。取回数据将变得困难。你只能处理明文输入，这将导致处理时间变长。在恢复备份期间，拥有该数据的程序将无法使用几个小时。在资金方面，这可能大约是\
    \ 10,000 美元。\n\n### 注意事项\n数字不需要精确；一个计算出的估算值即可。\n\n# 缓解策略\n\n决定如何处理每种风险是一项重要任务。处理风险主要有以下几种方式：\n\
    \n- **缓解或减少风险**：立即对风险和或缺陷采取措施以减轻其影响。与其他技术相比，限制区块链的影响的影响可能更困难。应该更多地关注降低系统的脆弱性并防止风险。这种方法控制风险的效果最好，但通常成本很高。它最适用于非常高且非常重要的风险。\n\
    \  **示例：**智能合约的代码加固、端点的补丁，以及针对指向区块链预言机的任何入站流量的 `API Firewall` 过滤。\n\n- **接受风险**。风险接受是指你选择与潜在风险共存或接受它，而不是采取步骤来减少或避免它。这种方法建议用于中低风险。\n\
    \  **示例：**不对共识层采取任何安全措施，假设信任是通过计算过程实现的；由于与私有链相比，假设公有链网络高度分布的，实施 51% 攻击的概率较低，因此风险很低。\n\
    \  **注意：**但当存在硬分叉并留下一个节点更少、较小的区块链时，51% 攻击更有可能成功。在大多数矿工关闭节点的白天时段，非常小的网络可能会变得更小。这使得\
    \ 51% 攻击变得非常容易。\n  在其他情况下，制作区块链钱包的中小型企业可能会决定不在硬件安全工具（密钥管理）上花钱，从而承担泄露的风险。\n\n-\
    \ **避免风险**：改变系统的工作方式以消除特定的安全问题。通常，这意味着通过权衡和放弃某些功能来高效地构建系统。\n  **示例：**在区块链入驻过程中不获取\
    \ `PI` 或 `SNPI` 信息，以避免在网络攻击时发生隐私泄露。\n\n- **转移风险**：引入第三方（如保险公司或外部服务供应商）来处理风险。\n\
    \  **示例：**使用云供应商的 `HSM` 使用托管钱包服务，由云供应商负责管理密钥生命周期的安全。\n  但对于 `HSM` 产品，钱包服务供应商需要与云供应商商定服务水平协议。如果他们这样做，存在违反对方或未遵守条款的风险。另一方面，当你购买保险时，你可以将风险转移给保险公司，这完全取决于用例。\n\
    \  **注意：**转移风险永远不会让所有者完全脱。并不是所有风险都可以转移，但可以分担。\n"
