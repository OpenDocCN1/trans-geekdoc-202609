    \ owned contract\n\n# [Answers](#toc.xhtml#s49a)\n\n1.  **a**\n\n2.  **e**\n\n\
    3.  **a**\n\n4.  **a, c**\n\n5.  **a, b**\n\n# [CHAPTER 3](#toc.xhtml#c03)\n\n\
    # [Attack Vectors Management on Blockchain](#toc.xhtml#c03)\n\n# [Introduction](#toc.xhtml#s50a)\n\
    \nCrypto investors lost nearly $4 billion to hackers in 2022, with DeFi protocols\
    \ being hit the hardest by cryptocurrency hacks. To better understand what has\
    \ happened in recent years, the following analysis chart can provide you with\
    \ the seriousness of the matter. What could have been the main reason for these\
    \ exploitations? If you are thinking about code, AKA Smart contract vulnerabilities,\
    \ you are right. However, that is just the tip of the Iceberg.\n\nThe truth is,\
    \ all of these losses could have been significantly reduced if platform vulnerabilities\
    \ had been identified early in the design. It could have been much less if the\
