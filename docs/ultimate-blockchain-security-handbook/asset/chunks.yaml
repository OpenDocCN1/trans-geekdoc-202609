    ```\n\n为了配置模糊测试执行，`fuzz` 测试的执行受用户可以通过 `Forge` 控制的参数限制。配置可以全局应用，也可以按每个测试应用。详细信息，请访问\
    \ https://book.getfoundry.sh/reference/config/testing，https://book.getfoundry.sh/reference/config/inline-test-config。\n\
    \n### 手动测试\n在运行自动化测试后，智能合约的手动测试通常发生在开发周期的后期。智能合约以单一、完全集成的产品形式进行这种评估，以查看它是否满足技术要求。\n\
    \n### 在本地区块链上测试合约\n虽然在本地开发环境中执行的自动化测试可以提供有用的调试信息，但你会想知道你的智能合约在生产环境中的表现。然而，部署到主网会产生\
    \ gas 费用，更不用说如果你的智能合约包含错误，你或你的用户可能会丢失真实的钱。\n\n在主网进行测试的替代方案是在本地区块链上测试，它也被称为开发网络。本地区块链是以太坊区块链的本地副本，运行在你的计算机上并模拟执行层的操作。结果是，交易可以在不产生大量开销的情况下进行交互。\n\
    \n手动集成测试可以从在本地区块链上运行受益。尽管智能合约具有高度组合性，但你仍然需要确保复杂的链上交互产生预期的结果。许多以太坊原生项目的做法是在测试网上部署\
    \ dapps。\n\n### 在测试网上测试合约\n类似于以太坊主网，测试网络或测试网使用没有实际价值的以太坊（ETH）。任何人都可以在测试网上与你的合约交互，而不会导致资金风险。这种手动测试有助于从用户的角度从头到尾查看应用程序的流程。此外，测试测试人员可以运行并报告功能业务逻辑方面的任何问题。\n\
    \n在本地区块链上测试后，部署到测试网是更优的，因为它接近以太坊虚拟机的操作。结果是，在现实世界测试智能合约的操作是常见做法。\n\n在评估智能合约的正确性时，手动测试或人工辅助测试意味着顺序执行测试套件中的每个用例。这与自动化测试不同，后者可以同时对合约运行多个隔离测试，并获得显示所有失败和通过测试的报告。\n\
    \n单个人可以通过遵循涵盖测试场景的编写好的测试计划来执行手动测试。作为手动测试的一部分，你还可以让多个个人或小组在预定的时间内与智能合约交互。测试人员将比较合约的实际行为和预期行为，并将任何差异报告为错误。\n\
    \n有关以太坊测试网的更多详细信息，请访问：https://ethereum.org/pt/developers/docs/development-networks/#public-beacon-testchains.\n\
    \n### 智能合约的形式化验证\n"
