  trans: '


    如果你思考密码学的具体特征，区块链继承了使用哈希用于数据完整性用例、使用公钥和私钥用于发送者地址以及解锁资金，最后通过数字签名来实现不可否认性和真实性，并在数据离开钱包并在跨链传输时对其进行加密。


    数字签名类似于用户提供给接收者和其他网络节点的证明，用以证明该节点是执行交易的合法节点。在与区块链网络中的其他节点发起交易之前，用户必须先使用特殊算法将交易数据与用户的私钥结合，以创建一个唯一的数字签名。通过这一程序，数据的完整性和节点的真实性都将得到保证。


    既然你已经理解了区块链的核心安全原则，让我们来看区块链架构的概览，以了解这些控制措施在堆栈（stack）中是如何部署的。


    # 区块链安全生态系统


    区块链与大多数现代技术一样，并不是一个单一的实体。它由几个截然不同的层组成，每一层都有自己的优势和安全考量。理解整个系统需要了解每一层是如何运作的以及它所做的安全假设。


    在`图 1.1`中，你可以看到区块链堆栈的分层结构。当人们讨论区块链时，通常只讨论少数几层，例如智能合约和共识算法。数据、网络和基础设施层经常被忽视。在设计堆栈的安全架构时，理解每一层都是关重要的。这就像如果你想保护一栋价值
    $$$$$$$ 的房子，你不能只锁上大门；还要锁上柜子、保险箱，安装监控摄像头、围栏等。如果你不知道自己在保护什么，即使对清单一目了然，遗漏某些重要入口点的概率也很高，留下后门开启的风险也。


    ![](img/Figure-1.1.jpg)


    **图 1.1:** 区块链堆栈的分层视图


    现在，让我们从概念和安全风险的角度来看每一层。


    # 应用层


    应用层由链码、智能合约和去中心化应用程序（DApps）组成。应用层的协议进一步细分为应用层和执行层。终端用户用于与区块链网络通信的应用程序包含在应用层中。它包括用户界面、框架、应用程序接口（API）和脚本。


    智能合约平台（如以太坊）旨在实现在区块链上运行的图灵完备程序的创建。这些程序与区块链网络上的账户相关，并通过包含待执行代码的交易进行调用。区块链网络中的每个节点执行相同的代码并以相同的方式更新区块链状态，从而维护整个网络的一致性。


    在区块链网络之上运行程序的引入为区块链带来了新的潜在安全风险。这些程序运行在虚拟机上，虚拟机可能存在安全漏洞。需要采用安全的编码实践和安全的软件开发生命周期，以确保应用层的安全。


    # 共识算法层


    让所有人达成一致是一项非常困难的任务。实现完全去中心化的数字账本的能力是区块链技术的主要优势之一。为了实现这一点，需要一种方法确保所有人对账本的当前状态（即每个区块中的交易）达成一致。


    区块链共识算法承担了这一责任。它是分布式网络中的参与者在交易加入链之前验证其真实性的机制（这在“比特币概述”主题中有更详细的介绍）。安全被映射到供需等经济原则，没有任何共识算法是完美的。这些原则通常能保护区块链免受攻击；然而，共识算法的安全性存在崩溃点。最常用的共识算法存在可以被攻击者利用的漏洞，使其在尝试接管区块链网络时获得微弱优势。


    *请访问`[`cointelegraph.com/news/what-is-a-51-attack-and-how-to-detect-it`](https://cointelegraph.com/news/what-is-a-51-attack-and-how-to-detect-it)`查看针对共识算法层的攻击示例。我们将在书的后部分更详细地介绍这些内容。*


    # 网络层


    区块链技术的理论在区块链堆栈的前两层中已经确定。理论上讲，区块链平台可以在任何通信介质上运行，例如用于构建网络的路由器和计算机。在实践中，网络实现在计算机、互联网和私有企业网络上。


    各种传统的网络攻击可能会针对区块链网络，因为它本质上是运行在通过点点网络连接的计算机集合上的软件。针对运行软件的计算机或`node`（节点）的恶意软件或钓鱼攻击有潜力损害用户的账户并影响整个网络。攻击者还可以针对区块链网络的基础设施，这会对区块链的功能和安全保障产生影响。


    # 数据层


    区块链技术底层由加密算法和数据结构组成。区块链的`blocks`（区块）用于存储数据，包括实际交易本身和额外的元数据。加密哈希用于连接区块链`chains`（链）中的区块，使其日后修改变得困难得多。


    此时，区块链的安全性取决于其加密算法的安全性。质数的使用、密钥的长度、哈希算法中的位以及其他因素会对公钥加密和区块链的强度产生显著影响。这些需要通过威胁建模进行严格测试，并考虑到内部和外部威胁者。我们负责风险。


    **注意**


    # 基础设施与虚拟化层


    区块链的内容存储在地球上某处数据中心的服务器上。客户端在浏览网页或使用任何应用程序时，从应用程序服务器请求内容或数据，这被称为客户端服务器架构。它由虚拟机、容器、服务和消息组成。基础设施可以使用裸机或私有云设置进行本地部署。此外，区块链也可以部署在公有云中。对于本地部署，该层面的安全性取决于你在会话、TCP、IP
    和数据交换层使用了多少安全控制。而在公有云的情况下，与云服务提供商合同中的服务水平协议起着至关的作用。


    # 探索区块链安全优势


    回顾一下我们对区块链规则的了解：


    '
