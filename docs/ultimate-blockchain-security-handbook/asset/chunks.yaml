    \ Review  \n\n**Source:** [https://cypherpunks-core.github.io/]\n\nThe resulting\
    \ transaction can be seen using a blockchain explorer web application, as shown\
    \ in Alice’s transaction to Bob’s Cafe (refer to *[Figure 1.7](#c01.xhtml#fig1_7)*).\
    \ So, if anybody has a transaction address or an Alice public key, blockchain\
    \ explorer can be used to view the history.\n\n![](images/Figure-1.7.jpg)\n\n\
    **Figure 1.7:** Alex Transaction to Bob’s cafe  \n\n**Source:** [https://cypherpunks-core.github.io/]\n\
    \n# Adding the Transaction to the Ledger\n\nThe transaction created by Alice's\
    \ wallet application is 258 bytes long and contains everything required to identify\
    \ new owners and confirm ownership of the funds. The transaction needs to be sent\
    \ now to the Bitcoin network, where it will be added to the blockchain. We'll\
    \ see how a transaction becomes a part of a new block and how the block is \"\
    mined\" in the next section. Last but not the least, we will observe how the network's\
    \ trust in the new block grows as more blocks are added to the blockchain.\n\n\
    It doesn't matter how or where the transaction is sent to the Bitcoin network\
    \ because it contains all of the information needed for processing. Each Bitcoin\
    \ client contributes to the Bitcoin network by connecting to a number of other\
    \ Bitcoin clients. The Bitcoin network is a peer-to-Bitcoin network.\n\nA Bitcoin\
    \ node is any system that participates in the Bitcoin network by \"speaking\"\
    \ the Bitcoin protocol, such as a server, desktop application, or wallet. The\
    \ new transaction can be sent to any Bitcoin node that Alice's wallet application\
    \ is connected to via any connection: mobile, WiFi, wired, etc.\n\nA method of\
    \ propagation known as flooding occurs when any Bitcoin node that has never seen\
    \ a valid transaction will immediately forward it to all other nodes. As a result,\
    \ the transaction spreads quickly across the peer-to-peer network, reaching many\
    \ nodes within a few seconds.\n\nFrom user wallets and other applications, the\
    \ network is constantly receiving new transactions. These are added to a temporary\
    \ mining pool of unverified transactions that each Bitcoin network node manages\
    \ as they see them. Using the mining algorithm (`Proof-of-Work`), miners attempt\
    \ to establish the validity of a new block by including unverified transactions\
    \ from this mining pool into it as they create it.\n\nA mining pool is a joint\
    \ group of cryptocurrency miners who combine their computational resources over\
    \ a network to strengthen the probability of finding a block or otherwise successfully\
    \ mining for cryptocurrency.\n\nThe highest-fee transactions and a few other criteria\
    \ determine the order in which transactions are added to the new block. Knowing\
    \ that they lost the previous competition, each miner begins mining a new block\
    \ of transactions as soon as they receive the previous block from the network.\
    \ The miner immediately starts calculating the `Proof-of-Work` for the new block\
    \ and populates it with transactions and the fingerprint of the previous block.\
    \ Each miner adds a unique transaction to his or her block.\n\nThis transaction\
    \ pays the miner’s Bitcoin address the block reward, which is currently equal\
    \ to 12.5 newly created bitcoins, in addition to the total amount of transaction\
    \ fees from all of the transactions in the block. The miner\"wins\" this reward\
    \ if they solve the problem and validate that block, as their successful block\
    \ is added to the global blockchain and the included reward transaction can be\
    \ spent.\n\n# Bitcoin Security Review\n"
  trans: "\n\n此处显示的示例基于一次真实的比特币交易，模拟了 Joe、Alice、Bob 和 Gopesh 在将资金从一个钱包转移到另一个钱包时的交互。在跟踪交易通过比特币网络到达区块链的过程中，我们将使用区块链查看器网站来可视化每一步。\n\
    \n注意：就像比特币搜索引擎一样，区块链查看器是一个 Web 应用程序，允许你搜索地址、交易和区块，并查看它们之间的关系。\n\n流行的区块链查看器包括：\n\
    - BlockCypher Explorer\n- `blockchain.info`\n- Blockstream Explorer\n\n使用比特币地址、交易哈希值、区块号或区块哈希值，可以搜索这些工具中的任何一个来查找比特币网络上的相关信息。我将为每个交易或区块示例提供\
    \ URL，以便你自己进行深入检查。\n\n对于咖啡爱好者来说，让我们看看用比特币买咖啡是什么样子的。\n\nAlice 是一位咖啡爱好者，是一个拥有 0.10\
    \ 比特币的新用户，这是她从 Joe 那里收到的。现在她将在加利尼亚州帕罗奥托的 Bob 咖啡馆进行第一次购买，买一杯咖啡。\n\nAlice 用智能手机扫描显示的条形码并点击\
    \ `Send` 授权支付，她的手机上显示支付给 Bob 咖啡馆 0.0150 BTC。Bob 在收银机上看到这笔交易，并在几秒钟内完成——这与信用卡授权的时间大致相同。\n\
    \n你可以使用区块查看器网站查看区块链上 Alice 向 Bob 咖啡馆的交易（在 `blockchain.info` 上查看 Alice 的交易）：\n\n\
    示例：在 `blockchain.info` 上查看 Alice 的交易\n\nhttps://blockchain.info/tx/0627052b6f28912f2703066a912ea577f2ce4da4caa5a5fbd8a57286c\
    \ \n\n简单来说，交易通知网络，某位比特币价值的所有者之一已授权将其转移给另一个人。在所有权链中，新所有者现在可以通过启动另一个交易（授权转移给另一个所有者）来花费这些比特币，以此此类推。困惑吗？等一下，过会儿这些都会变得容易理解。\n\
    \n# 用于真实性的交易链\n\n请记住，Alice 已经从 Joe 那里收到了 BTC，并在她在 Bob 的咖啡馆花掉了。在她的账本中，Alice 从 Joe\
    \ 那里收到的记录将是一个输入，而她花费买咖啡的金额将是一个输出。作为输入，差额将返回到她的钱包。\n\nAlice 的密钥作为交易的结果锁定了一个比特币价值。你会发现，她与\
    \ Bob 咖啡馆进行的后续交易使用之前一笔交易作为输入，并为支付咖啡和接收找零生成了新的输出。解锁这些之前的交易输出的签名由 Alice 的密钥提供，向比特币网络证明了她拥有这些资金。\n\
    \n这一切都创建了真实性，并确保 Alice 仅花费她拥有的资金，而不是向任何其他人员发送相同的金额。图 1.6 说明了这一切，这些账本堆积在一个比特币区块中。如果你在所有这一切之上加上哈希算法和私钥签名，就提供了深度安全，这意味着通过真实性的同时，你还可以从想要篡改的人那里获得数据完整性和机密性。\n\
    \n![](img/Figure-1.6.jpg)\n\n**图 1.6:** 比特币交易审查\n\n**来源：** [https://cypherpunks-core.github.io/]\n\
    \n可以使用区块链查看器 Web 应用程序查看生成的交易，如 Alice 向 Bob 咖啡馆的交易所示（参见 *图 1.7*）。因此，如果任何人有交易地址或\
    \ Alice 的公钥，可以使用区块链查看器查看历史记录。\n\n![](img/Figure-1.7.jpg)\n\n**图 1.7:** Alex 向\
    \ Bob 咖啡馆的交易\n\n**来源：** [https://cypherpunks-core.github.io/]\n\n# 将交易添加到账本\n\n\
    Alice 钱包应用程序创建的交易长度为 258 字节，包含了识别新所有者和确认资金所有权所需的一切。现在需要将交易发送到比特币网络，它将被添加到区块链中。我们将在下一节中查看交易是如何成为新区块的一部分，以及区块是如何被“挖掘”的。最后但同样重要的是，我们将观察随着更多区块添加到区块链中，网络对新区块的信任是如何增长的。\n\
    \n交易如何或从哪里发送到比特币网络并不重要，因为它包含了处理所需的所有信息。每个比特币客户端通过连接到许多其他比特币客户端为比特币网络做出贡献。比特币网络是一个对点网络。\n\
    \n比特币节点是任何通过“说”比特币协议参与比特币网络的系统，例如服务器、桌面应用程序或钱包。新交易可以通过 Alice 钱包应用程序连接的任何连接（移动端、WiFi、有线等）发送到任何比特币节点。\n\
    \n一种被称为“泛洪”（flooding）的传播方法发生时，任何从未见过有效交易的比特币节点都会立即将其转发给所有其他节点。结果是，交易在点点网络中迅速传播，几秒钟内到达许多节点。\n\
    \n从用户钱包和其他应用程序，网络不断接收新交易。这些交易被添加到未验证交易的临时矿池中，每个比特币网络节点在看到它们时都会进行管理。使用挖掘算法（`Proof-of-Work`），矿工试图在创建新区块时通过将该矿池中的未验证交易包含在内来建立新区块的有效性。\n\
    \n矿池是加密货币矿工的联合小组，他们在网络上结合计算资源以增加发现区块或其他成功挖掘加密货币的概率。\n\n手续费最高的交易和其他几个标准决定了交易添加到新区块的顺序。由于他们输掉了上一次竞争，每个矿工一旦从网络收到上一个区块，就会开始挖掘一个新的交易区块。矿工立即开始计算新区块的\
    \ `Proof-of-Work`，并用填充交易和上一个区块的指纹。每个矿工向他的区块添加一个唯一的交易。\n\n这笔交易向矿工的比特币地址支付区块奖励，目前等于\
    \ 12.5 个新创建的比特币，加上区块中所有交易的总手续费。如果矿工解决了问题并验证了该区块，他们就“赢得”了奖励，因为他们成功的区块会被添加到全局区块链中，且包含的奖励交易可以被花费。\n\
    \n# 比特币安全审查\n\n"
