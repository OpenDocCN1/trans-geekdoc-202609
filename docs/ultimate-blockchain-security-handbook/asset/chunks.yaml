    \ 发送交易的结果\n\n运行脚本后，我们可以通过返回交易哈希和其他数据看到交易是成功的。一旦我们更改了区块链状态并利用了漏洞，让我们来验证一下。\n\n\
    ![](img/Figure-4.24.jpg)\n\n**图 4.24:** 漏洞利用\n\n现在，检查地址所有者是否不同。在利用代码后，我们的合约地址现在成为了合约的所有者。因此，我们成功利用了该漏洞，如图\
    \ 4.25 所示。\n\n![](img/Figure-4.25.jpg)\n\n**图 4.25:** 利用漏洞后的合约地址对比\n\n恭喜你走到这里！你已经成功破解了智能合约。现在，重复这个练习并尝试自己完成挑战。遵循我们刚刚学到的步骤进行操作。\n\
    \n在进入下一个主题之前，让我们看看可以防止缓冲区溢出和下溢攻击的缓解措施。\n\n# 防止溢出和下溢攻击的措施](#toc.xhtml#s81a)\n\n\
    以下是缓解溢出和下溢攻击的一些方法：\n\n*   **SafeMath 库**：开发者应该使用 SafeMath 库或带有溢出检测的适当类型，以避免整数溢出或下溢攻击。该库提供基础数学运算，还可以检查前置条件和后置条件来判断是否发生了溢出。在发生错误时，库会取消交易并将状态更改为\
    \ `Reverted`（回滚）。\n*   **编译器版本**：可以使用健壮性 >= 0.8 的版本来防止攻击。使用新版本的编译器编译智能合约。这样 SafeMath\
    \ 等外部库的预防性代码就会包含在编译后的代码中。\n*   **使用修饰符 ‘onlyOwner’**：你也可以使用如 `onlyOwner` 等增强安全性的修饰符，或者检查代码以确保值永远不会超过预期范围。\n\
    *   **定期更新代码**：保持代码更新也很重要。\n    **数据执行保护（DEP）**：攻击者在利用缓冲区溢出时，经常将恶意代码注入栈和堆等位置，以获得未经授权的应用程序执行。因此，引入了新的缓冲区溢出缓解策略——数据执行保护。这在\
    \ Linux 中被称为 `NX`（禁止执行）。硬件和软件层面都可以启用 DEP。当启用 `NX` 时，栈将不再可执行，作为攻击部分的任何恶意代码也不再被视为可用。\n\
    *   **地址空间布局随机化**：地址空间布局随机化（ASLR）会将库和其他内存区域的基地址随机化。这使得攻击者构建 ROP 链变得困难，因为 ROP 链依赖于这些库的指令地址，而这些是加载到程序中的。要检查\
    \ Linux 机器（特别是 Ubuntu）上是否启用了 ASLR，可以使用以下命令：\n\n```\n$ sudo cat /proc/sys/kernel/randomize_va_space\n\
    ```\n`1`\n\n如你所见，上述摘出的文件值设置为 1，这意味着 ASLR 已完全启用。\n\n为了更深入地理解这个主题，建议阅读以下文章：\n\n\
    **[`www.geeksforgeeks.org/overflow-and-underflow-attacks-on-smart-contracts/`](https://www.geeksforgeeks.org/overflow-and-underflow-attacks-on-smart-contracts/),**\n\
    \n"
