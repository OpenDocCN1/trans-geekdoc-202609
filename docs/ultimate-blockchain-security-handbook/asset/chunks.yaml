    ![](images/188.jpg)


    Now, which algorithm to use and when I should use asymmetric over symmetric in
    my blockchain application, it is important to understand the relationship between
    them.


    # Asymmetric and Symmetric encryption relationship](#toc.xhtml#s121a)


    Asymmetric encryption is much slower than symmetric encryption due to the key
    length and computation involved, so the two are often used in tandem. For example,
    someone might protect a message using symmetric encryption and then send the key
    to decode the message using asymmetric encryption. This would speed up the decryption
    process because the key is much smaller than the message. *[Figure 6.8](#c06.xhtml#fig6_8)*
    explains this concept where both Symmetric and Asymmetric key encryption are used
    together.


    ![](images/Figure-6.8.jpg)


    **Figure 6.8:** The application of symmetric and asymmetric encryption


    So, the concept of public and private key encryption powers the PKI and enables
    what the PKI does.


    Both symmetric and asymmetric encryption have one major challenge: How do you
    know that the public key you received belongs to the person you think it does?


    Even with asymmetric encryption, the risk of the `man in the middle` exists. For
    example, what if someone intercepted Bob’s public key, made his own private key,
    and then generated a new public key for Alice? In this case, Alice would encrypt
    messages for Bob, but the man in the middle could decrypt, change, and then re-encrypt
    the messages, and neither Alice nor Bob would be any wiser.


    So, the problem statement is that cryptography is not enough to secure the communication
    channel between two parties. You need an additional layer of security, which can
    help establish trust between different parties.


    Welcome to PKI as the solution. Here is how it solves our problem.


    This problem is solved by PKI, which gives out and manages digital certificates
    that prove the names of people, devices, or apps that have both private and public
    keys. In short, PKI gives keys names so that people who use them can be sure who
    owns them. This confirmation gives users confidence that if they send an encrypted
    message to that person (or device), the intended recipient will read it and not
    a `man in the middle`.


    As the message reaches any of the parties, it holds the signature of a certified
    authority, which both parties trust. If you are thinking about how to prevent
    the spoofing of a certificate signature, this is where the certificate revocation
    list comes in. In such cases, the certificate authority, also known as `Root CA`,
    can send a message to all the parties involved to not trust a particular certificate.


    Let me explain this concept by breaking down the components of public key infrastructure.


    # Components of Public Key Infrastructure](#toc.xhtml#s122a)


    It comprises three major components: X.509 certificates, public and private keys,
    and certificate authorities, chains, or trust. Let us look at each one.


    ## X.509 Digital Certificates


    X.509 is a digital certificate like a driver''s license, it is a way for companies
    and groups to prove who they are online. PKI makes it possible for two machines
    to talk to each other securely because certificates can be used to check the names
    of the two parties. *[Figure 6.9](#c06.xhtml#fig6_9)* displays what a digital
    license looks like.


    ![](images/Figure-6.9.jpg)


    **Figure 6.9:** SSL Certificate


    Once you have a digital certificate, it is important to maintain the lifecycle
    of the certificate, from enrollment and issuance to revocation and renewal.


    ## Public and Private Keys


    A public key is a cryptographic key that can be distributed to the public and
    does not require secure storage. Only the corresponding private key can decrypt
    messages encrypted by the public key. In the blockchain ecosystem, you are already
    familiar with the concept of the public key as an identity for the user, but these
    are also used in a digital signature to encrypt the message.


    On the other hand, `private Keys` are used by the recipient to decrypt a message
    that is encrypted using a public key. Since the message is encrypted using a given
    public key, it can only be decrypted by the matching private key. Also, these
    are used to sign a transaction, similar to their function in the blockchain.


    ## Defining Certificate Authorities and Chain of Trust


    Certification Authorities (`Cas`) are in charge of making digital certificates
    and owning the policies, practices, and processes for verifying users and giving
    out certificates.


    ![](images/Figure-6.10.jpg)


    **Figure 6.10:** Certificate authorities issuing digital certificates


    Digital identities take the form of cryptographically validated digital certificates
    that comply with the X.509 standard and are issued by a Certificate Authority
    (`CA`). On the other hand, the chain of trust refers to the certificate that links
    the bank to a trusted certifying authority. For an SSL certificate to be trusted,
    it must be traceable back to the trusted root from which it was signed, meaning
    all certificates in the chain server, intermediate, and root need to be properly
    trusted.


    ![](images/Figure-6.11.jpg)


    **Figure 6.11:** Certificate path to validate trust


    In the preceding figure, we can see that [google.com](http://google.com) is the
    server to which we are connected. `GTS-CA 1C3` is an intermediate CA. `GTS-Root
    R1` is another intermediate CA. `GlobalSign Root CA-R1` is the top root CA. In
    this way, a chain of trust can be built.


    The chain of trust comprises three parts:


    - **Root certificate:** A root certificate is a digital certificate that comes
    from the Certificate Authority that gave it out. Most browsers already have it
    saved and kept in a "trust store." For example, *[Figure 6.11](#c06.xhtml#fig6_8)*
    shows that `GlobalSign Root CA-R1` is a root CA. In an enterprise blockchain network,
    you can use your own `CA` as the root.

    - **Intermediate CA:** Intermediate certificates branch out from root certificates,
    like branches of a tree. They act as middlemen between the protected root certificates
    and the server certificates. If you have two departments in an organization where
    you want to establish a trusted network, you can make two Intermediate CAs, which
    can be linked back to the Root CA.

    - **Server Certificate:** The server certificate is the one issued to the specific
    domain. For example, *[Figure 6.11](#c06.xhtml#fig6_8)* shows that a server certificate
    is an issue to [google.com](http://google.com), which can be any of your `DaPPs`
    or a blockchain node in a network.


    # PKI Applications to Blockchain](#toc.xhtml#s123a)


    Now, if you think in the context of a private blockchain network, all the infrastructure
    network components used or the nodes participating in the network can be trusted
    if digital certificates are issued to them. There can be an argument that blockchain
    is a trustless system, and trust is achieved with a consensus algorithm and the
    protocol itself. However, in a private or consortium blockchain network where
    you want to add an extra layer of security, whenever a node is entered into the
    chain, it must have a valid certificate.


    Moreover, a valid SSL Certificate on your blockchain website helps keep user data
    safe, proves that you own the site, and stops attackers from making a fake version
    of the site. Finally, this will also help your people trust you.


    **Note**

