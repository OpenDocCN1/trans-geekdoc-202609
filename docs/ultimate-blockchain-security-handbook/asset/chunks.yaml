    \n由于我们需要与外部区块链通信，我们必须创建一个能够执行刚才在本地系统上测试的操作的脚本。\n\n# 远程利用\n\n与以太坊交互的 Python 库被称为\
    \ `Web3.py`。它经常用于去中心化应用（dapps），以便发送交易、智能合约交互、区块数据读取和其他应用。\n\n通过调用相关函数，我们可以使用 ABI\
    \ 与智能合约通信。\n\n让我们理解图中所示底层代码：\n\n*   我们有一个 HTTP 的 URL；这是 ganache 提供程序，它让我们能够使用\
    \ RPC 调用与智能合约通信。\n*   我们从该点导入我们的 ABI 以调用必要的函数。\n*   我们连接到 `we3.eth.contract` 命令并建立智能合约的地址。\n\
    *   从这里，我们可以调用 `getOwner` 等函数。注意，不改变状态的调用被称为调用（calls），因为它们仅用于读取值而不改变区块链的状态。\n\n\
    ![](img/Figure-4.21.jpg)\n\n**图 4.21:** 通过 ABI 与智能合约通信\n\n运行脚本后，我们可以在控制台中看到合约的所有者、余额和随机数（nonce）。查看接下来的快照：\n\
    \n![](img/Figure-4.22.jpg)\n\n**图 4.22:** 脚本输出\n\nnonce 只是一个记录已交易通知的计数器。在这个例子中，只有一次交易，因为合约只部署了一次。\n\
