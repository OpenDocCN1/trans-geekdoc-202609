- raw: "Blockchain security audits are also used to define compliance with regulations\
    \ and show customers and regulators that you focus on all aspects of security.\
    \ It also protects your stack from vulnerabilities in design, smart contracts,\
    \ and the data you are storing of your users. It optimizes your code and increases\
    \ audience trust. This all looks important, so the question now is: do all blockchain\
    \ projects needs to be audited? At what stages does the project need to be audited?\
    \ What process does it have to follow? What are the solutions available in the\
    \ market that one should adopt?\n\nIn this chapter, we will try to uncover all\
    \ of this. We will start by taking a deep dive into smart contract testing, exploring\
    \ different methods from unit to integration testing, testing frameworks, and\
    \ formal verification of smart contracts. We will also take a look at independent\
    \ audits, such as bug bounty programs. While discussing all of this, we will take\
    \ a look at various use cases of how formal verification has been applied to smart\
    \ contracts and other projects. This topic is so interesting that I can’t wait\
    \ to take a deep dive straight into it. Let’s take a look at the contents of this\
    \ chapter.\n\n# [Structure](#toc.xhtml#s89a)\n\nWe will be covering the following\
    \ topics in this chapter:\n\n*   Smart Contract Testing\n\n*   Formal verification\
    \ overview\n\n*   Applying formal verification to smart contracts\n\n*   Case\
    \ Study – Verifying Open Zeppelin’s ERC-20 Implementation\n\n*   Bug Bounty Programs\n\
    \n# [Smart Contract Auditing](#toc.xhtml#s90a)\n\nBecause public blockchains like\
    \ Ethereum cannot be changed, it is difficult to modify a smart contract's code\
    \ after it has been deployed. There are contract upgrade patterns for *virtual\
    \ upgrades*, but these are hard to put into practice and require social agreement.\
    \ Furthermore, if an attacker discovers the vulnerability first, your smart contract\
    \ is vulnerable to exploits because an upgrade cannot fix it.\n\n*If you want\
    \ to explore more on how smart contracts can be upgraded, there is a good article*\
    \ available at **[https://ethereum.org/pt/developers/docs/smart-contracts/upgrading/](https://ethereum.org/pt/developers/docs/smart-contracts/upgrading/)**\n\
    \nDue to this, it is important to test and audit the smart contracts before they\
    \ get to the main net. Several methods can be adopted to test your code; there\
    \ is no single best method. However, it is recommended to do the risk assessment,\
    \ evaluate the threat vectors in terms of probability and impact, and then choose\
    \ a suite test suite, which is a mixture of different tools. The objective should\
    \ be to identify any possible minor or major issues your contract may have.\n\n\
    # [Methods for testing smart contract](#toc.xhtml#s91a)\n\nSmart contract testing\
    \ falls under two main categories of testing methods: automated and manual testing.\
    \ Before we look at some examples, let us start from the basics.\n\n# [Automated\
    \ Testing](#toc.xhtml#s92a)\n\nAutomated testing includes tools to check if a\
    \ smart contract executes and generates errors if something is not right. Scripts\
    \ are involved in this process, allowing automation through the scheduling of\
    \ test cases. These are useful for handling repetitive tasks or important tasks\
    \ as you don’t want human errors. The drawbacks that we see are false positives,\
    \ which means the bugs that are coming out of the result are not correct.\n\n\
    To find more on false positives, please visit **[https://www.contrastsecurity.com/glossary/false-positive](https://www.contrastsecurity.com/glossary/false-positive)**\n\
    \nThe following are some of the examples and use cases for automated testing.\n\
    \n# [Unit testing](#toc.xhtml#s93a)\n\nDuring unit testing, contract functions\
    \ are evaluated separately, which ensures that each component functions properly.\
    \ If a unit test fails, it should be clear what went wrong and should be easy\
    \ to run.\n\nUnit tests are useful for ensuring that contract storage is correctly\
    \ updated following function execution and that functions return expected values.\
    \ In addition, running unit tests after making changes to a contract's codebase\
    \ makes sure that adding new logic doesn't cause problems. The following are some\
    \ recommendations for running efficient unit tests:\n\n*   Understand your Smart\
    \ contracts business logic and process flow\n\n    First, check if your smart\
    \ contract is delivering what it is designed for. You can try running the happy\
    \ path test, which determines if functions in a contract return the correct output\
    \ for valid user inputs. This is explained with a sample bidding contract as follows:\n\
    \n    `***************************************`\n\n    `constructor(`\n\n    `uint\
    \ biddingTime,`\n\n    `address payable beneficiaryAddress`\n\n    `) {`\n\n \
    \   `beneficiary = beneficiaryAddress;`\n\n    `auctionEndTime = block.timestamp\
    \ + biddingTime;`\n\n    `}`\n\n    `function bid() external payable {`\n\n  \
    \  `if (block.timestamp > auctionEndTime)`\n\n    `revert AuctionAlreadyEnded();`\n\
    \n    `if (msg.value <= highestBid)`\n\n    `revert BidNotHighEnough(highestBid);`\n\
    \n    `if (highestBid != 0) {`\n\n    `pendingReturns[highestBidder] += highestBid;`\n\
    \n    `}`\n\n    `highestBidder = msg.sender;`\n\n    `highestBid = msg.value;`\n\
    \n    `emit HighestBidIncreased(msg.sender, msg.value);`\n\n    `}`\n\n    `function\
    \ withdraw() external returns (bool) {`\n\n    `uint amount = pendingReturns[msg.sender];`\n\
    \n    `if (amount > 0) {`\n\n    `pendingReturns[msg.sender] = 0;`\n\n    `if\
    \ (!payable(msg.sender).send(amount)) {`\n\n    `pendingReturns[msg.sender] =\
    \ amount;`\n\n    `return false;`\n\n    `}`\n\n    `return true;`\n\n    `function\
    \ auctionEnd() external {`\n\n    `if (block.timestamp < auctionEndTime)`\n\n\
    \    `revert AuctionNotYetEnded();`\n\n    `if (ended)`\n\n    `revert AuctionEndAlreadyCalled();`\n\
    \n    `ended = true;`\n\n    `emit AuctionEnded(highestBidder, highestBid);`\n\
    \n    `beneficiary.transfer(highestBid);`\n\n    `}`\n\n    `***************************************`\n\
    \n    This is a simple auction contract designed to receive bids during the bidding\
    \ period. If the highestBid increases, the previous highest bidder receives their\
    \ money; once the bidding period is over, the beneficiary calls the contract to\
    \ get their money.\n\n    The various functions that a user might call when interacting\
    \ with this contract would be covered by unit tests for that contract. Examples\
    \ of unit tests include checking whether a user can place a bid while the auction\
    \ is ongoing (that is, calls to `bid()` succeed) or if a user can place a higher\
    \ bid than the current `highestBid`.\n\n    Writing unit tests to determine whether\
    \ execution satisfies requirements also benefits from understanding a contract's\
    \ operational workflow. For instance, when auctionEndTime is lower than `block.timestamp`,\
    \ the auction contract says that users cannot place bids. Consequently, a designer\
    \ could run a unit test to check if calls to the `bid()` capability succeed or\
    \ come up short when the closeout is finished (that is, when `auctionEndTime`\
    \ > `block.timestamp`).\n\n*   **Evaluate all assumptions related to contract\
    \ execution**\n\n    It is critical to report any suppositions about an agreement's\
    \ execution and compose unit tests to confirm the legitimacy of those suspicions.\
    \ Testing assertions force you to think about operations that could break a smart\
    \ contracts security model in addition to protecting unexpected execution. Going\
    \ beyond *happy user tests* and writing negative tests to see if a function fails\
    \ for the wrong inputs is a helpful trick.\n\n    You can create assertions, which\
    \ are straightforward statements stating what a contract can and cannot do, and\
    \ run tests to see if those assertions hold up under execution with many unit\
    \ testing frameworks. Before conducting negative tests, a developer working on\
    \ the auction contract described earlier might assert the following about its\
    \ behavior:\n\n    *   When the auction is over or hasn't started, users can't\
    \ make bids.\n\n    *   If a bid is lower than the acceptable threshold, the auction\
    \ contract is reversed."
