    既然你已经知道了如何为你的区块链应用构建身份和访问管理（Identity and Access Management）解决方案，让我给你讲一个有趣的故事。我曾是一个虚假购物平台的受害者。


    我被迫将 `BTC` 发送到一个我以为是正规业务的假网站。在操作了两周后，我很快自己陷入了一个骗局。然后，我想弄清楚我的交易流向了何处，以便找到是谁干的并惩罚他们。


    通常情况下，如果有人在网上进行诈骗，他们会使用 `bitcoin`。作为一个标准，他们都想通过兑换将他们的 `bitcoin` 变成现金，比如美元或他们本国的货币。交易
    `Hash` 就是追踪轨迹的方法。


    查看下面的图片，你可以看到交易 `Hash` `C1` 被发送到地址 `a1`，然后发送到地址 `a2`，最后发送到 `VASP 1` 地址 `a3`。`VASP`
    代表“虚拟资产服务提供者”，也就是人们通常所说的“加密交易所”。


    处理 `Hash` `C1` 是我的交易，在其中我将比特币发送到了犯罪分子给我的地址。`Hash` `C3` 的最后一笔交易发送到了一个名为 `a3` 的交易所钱包地址。可以根据信息联系交易所的法律部门或客户服务，查询该交易所中钱包地址的所有者。通常，除非警察要求，否则他们不会所有者的姓名。


    所以，如果你认为自己是涉及加密货币在线诈骗的受害者，你应该尝试通过交易日志查出你的钱去向了哪里。有很多优秀的加密取证公司，一旦你提供交易细节，他们就能为你提供所需的信息。最后，你需要报警，这样交易所就可以告诉你是谁干的，并帮助你采取正确的措施。


    我在下方复制了一张来自调查报告的交易流图片供你参考，这样你就能知道可以做什么。


    ![](img/Figure-6.6.jpg)


    图 6.6：从加密钱包到交易所的 BTC 交易流


    # 智能合约的身份和访问管理


    在智能合约的世界，访问控制——即*谁被允许执行什么*——非常重要。你的合约的访问控制可能会规定谁可以创建新标记、对想法进行投票、停止交易以及许多其他事情。由于这一点，了解如何实现它并防止滥用至关重要。


    智能合约中的访问控制是一种控制谁被允许执行合约中某些操作的方法。大多数时候，这些是对系统安全和正常运行非常重要的活动，例如创建新标记、停止转账和提现或安装升级。


    某些函数对于智能合约的安全性至关重要。考虑一个使用 `proxy` 方法进行更新的合约。如果对 `upgrade` 函数的访问从不受限制，那么具有恶意意的人可能会更改合约的含义或运行影响性能的命令。


    以 Temple DAO Stax 黑客攻击为例。由于没有访问控制，黑客能够创建新标记。攻击者利用了合约中的漏洞。这种发生是因为本不该这样做的人调用了秘密函数
    `migrateStake()`。


    升级不是唯一需要妥当访问控制的函数。任何可能对协议运行方式产生巨大影响的函数都需要受到适当的保护。例如，DeFi 协议 Maker DAO 使用访问控制来限制谁可以提交价格预言机更新（这样攻击者就无法更改系统中资产的价格）。


    虽然我在之前的章节在解释智能合约安全时已更详细地介绍过这个主题，但我在这里再次简述这些概念，以便清楚地理解加强智能合约访问控制的关键要点。


    以下是你可以采用的一些最佳实践。在当今的智能合约中，建立访问控制的两种常用方法是`Ownable 模式`和`基于角色的权限`。


    # Ownable 模式


    这种模式基于这样一种理念：合约的所有者拥有特殊特权，作为该合约中的一种管理功能，尽管这些权利也可以转移给其他账户。


    在 `Ownable 模式` 下，受限的函数有一个 `only Owner` 修饰符，它在执行之前会检查调用账户的身份。如果调用者的地址与合约存储器中存储的所有者地址不匹配，调用将回滚（reverts）。


    这种类型的账户增加了中心化和单点故障的风险，正如最近的 Ronin 黑客攻击所示。从后来看来看，给一个账户授予特殊账户权限可以减少由其他账户导致的误操作风险，并减少管理开销，以防账户因漏洞或攻击而需要冻结。


    这种方法在预构建阶段可以运行，但当合约部署到主网时，应该应用基于角色的权限。让我们来看看它是什么样的。


    # 基于角色的权限


    查看角色访问，顾其名，访问被限制为主体所拥有的角色。员工或开发者对访问的访问级别在 RBAC（基于角色的访问控制）中被称为“角色”。


    这将使得权力从一个中心化账户扩展到多个账户，例如标记铸造者角色、标记销毁者角色、实施升级的角色等。单个角色仅访问合约所需的函数。它是基于最小权限原则的，这意味着用户只能执行分配的职责。以下是实现
    RBAC 的代码片段，例如，只有管理员（`borrow cap guardian`）可以调用 `setBorrowCap` 函数为 `cToken` 市场设置新的借贷额度。


    ```

    ********************************************

    function _setMarketCaps(DToken[] calldata dTokens, uint[] calldata newBorrowCaps)
    external {

    require(msg.sender == admin || msg.sender == borrowCapGuardian, "only admin or
    borrow cap guardian can set borrow caps");

    }

    ********************************

    ```


    完整的代码可以在 [`github.com/compound-finance/compound-protocol/blob/master/contracts/Comptroller.sol`](https://github.com/compound-finance/compound-protocol/blob/master/contracts/Comptroller.sol)
    找到。


    # 多签名


    多签名账户是一种特殊的账户，在合约执行之前需要至少数量的地址签名。这将允许权力分配并提供去中心化。这是 Compound 和 Balancer 等项目使用的技术。


    具有多签名特性的另一个重要方面是通过采用 `m` of `n` 方案来实现容错性。这简单来说意味着如果四个账户中有两个可用，那么函数就会执行。


    # 定时锁


    在时间锁定的合约中，智能合约的状态会被锁定一段时间，在计时器过期之前，任何状态更改操作都不会执行。这提供了两个益处：首先，它延迟了合约的执行，这意味着如果合约协议发生变化，用户有足够的时间做出反应并可能退出系统。


    它提供的另一个益处是延迟恶意行为。通过增加另一层安全，区块链使得转移所有权或创建新币变得更加安全。即使攻击者获得了某些权力（通过接管白名单账户或针对未保护的功能），你仍然有时间阻止他们。


    Uniswap Timelock 合约是使用时间锁控制常规操作的极佳示例。


    # 在智能合约中记录审计事件


    '
