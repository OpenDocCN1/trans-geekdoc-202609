    \ having a multi-signature property is the implementation of fault tolerance by\
    \ adopting an `m` of `n` scheme. It simply means that if two out of four are available,\
    \ then the function is to be executed.\n\n# Time locks\n\nIn a time-locked contract,\
    \ the state of a smart contract gets locked for a specified period of time, and\
    \ any state change operation will not be executed until the timer expires. This\
    \ offers two benefits: first, it delays the contract execution, which means if\
    \ there is a change coming in the protocol of a contract, users get enough time\
    \ to react and potentially exit the system.\n\nThe other benefit it gives is stalling\
    \ malicious actions. By adding another layer of security, the blockchain makes\
    \ it safer to transfer ownership or make new coins. Even if an attacker gets certain\
    \ powers (by taking over whitelisted accounts or going after features that aren't\
    \ protected), you still have time to stop them.\n\nThe Uniswap Timelock contract\
    \ is a great example of how timelocks can be used to control routine actions.\n\
    \n# Logging audit events in a Smart Contract\n"
