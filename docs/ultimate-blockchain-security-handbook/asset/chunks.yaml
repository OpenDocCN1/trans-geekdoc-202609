    # 第一章


    # 区块链安全概览


    # 引言


    如果你浏览互联网搜索区块链，你一定听过关于区块链技术的几种用例的新闻、它提供的`收益`、人们寻找转行区块链行业的机会，以及可能达到 10 倍收益的投资机会。另一方面，你也听过交易所被黑、庞氏骗局、比特币价格的通货膨胀、监管机构打击初创公司、创始人入狱等。。这一切的结果可能会让任何人感到困惑；真实情况是这样的：信息非常多，但对于一个专业人士来说，区块链技术并没有一个清晰且更安全的方向，而这本书提供的正是如此。所以，恭喜你选择和我一起开启这本书的旅程。


    为了进一步强调我的观点，如果区块链真的是革命性的、解决了现实世界的问题并吸引了大量关注，为什么它没有被更广泛地使用呢？其次，尽管它自诞生以来一直在不断发展，为什么它仍然是黑客的便利目标？我们谈论的是全球范围内
    100 多起事件中超过 100 亿美元的损失。`币安区块链遭袭`导致 5.7 亿美元被盗，是最近登上头条的重大网络攻击之一。除了金钱和睡眠损失，这些网络事件还导致了信心的缺失。如果这些攻击继续，人们最终将失去对区块链技术的信任。


    # 结构


    在本章中我们将涵盖以下主题：


    *   区块链基础


    *   区块链安全概览


    *   探索区块链安全优势


    *   比特币内在的安全能力


