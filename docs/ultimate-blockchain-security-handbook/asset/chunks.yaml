    # [CHAPTER 5](#toc.xhtml#c05)


    # [Blockchain Application Audit](#toc.xhtml#c05)


    # [Introduction](#toc.xhtml#s88a)


    Due to the rise in cyber hacks on DeFi and blockchain platforms in general, the
    FBI has issued a public service announcement to perform security audits on various
    platforms. A Blockchain security audit is a systematic examination of the security
    of a blockchain-based application by measuring how well it conforms to an established
    set of standards and security checklists. An audit typically assesses the security
    of the system''s physical configuration and environment, software, information
    handling processes, and system design and integrations.'
