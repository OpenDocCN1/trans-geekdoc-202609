    如果网站要求用户登录、输入信用卡号等个人信息，或查看健康福利或财务信息等敏感信息，那么保持数据的机密性至关重要。SSL 证书有助于保持互联网交易的私密性，并让用户对网站是真实的且可以共享私人信息充满信心。


    现在你已经理解了 PKI（公钥基础设施）的概念以及它如何帮助区块链网站和网络基础设施，我们将在深入探讨它在 Hyperledger Fabric 中的应用。


    我们知道 PKI 由证书颁发机构（CA）组成，它们向各方（例如服务用户、服务提供者）颁发数字证书，随后这些各方使用证书在它们环境中交换的消息中进行身份验证。


    这可以在 图 6.12 中看到，其中主体正在向 CA 请求证书，CA 负责颁发证书。


    ![](img/Figure-6.12.jpg)


    **图 6.12:** Hyperledger Fabric CA 架构


    此外，证书吊销列表由身份受损或不符合发证标准的 CA 主体维护。这类似于访问控制列表（ACL）的概念，即你允许特定的 IP 而非其他 IP。由用户维护的公钥带有
    CA 的签名。通过这种，当主体与任何其他用户通信时，它可以建立真实性。


    ![](img/Figure-6.13.jpg)


    **图 6.13:** 向主体颁发签名证书


    图 6.13 帮助我们可视化信任分层，其中所有主体都由 CA 验证，且每个主体都持有一个签名的证书。每个希望交互的主体都必须拥有有效的证书（公钥）。


    如果你正在寻找更多关于使用 DIGI-CERT CA 辅助 Hyperledger Fabric 的详细信息，请访问：


    **[`www.hyperledger.org/learn/publications/thales-digicert-case-study`](https://www.hyperledger.org/learn/publications/thales-digicert-case-study)**


    # 安全日志与监控


    我们生活在一个日益复杂的环境中，泄露、黑客攻击和其他恶意在线活动似乎无不在新闻中。安全系统需要足够强大，以应对公司今天面临的持续威胁。


    安全专业人员有大量工作要做，包括识别与身份验证、访问控制、传输中和静态数据的加密、数据完整性、系统和数据可用性、供应商管理、事件响应、人员安全、漏洞管理、恶意软件防御、应用安全等。对于他们来说，能够收集、分析和报告有助于这些工作的信息至关重要，区块链也不例外。有了区块链，由于网络是分布式的，你最终会有更多的入侵途径。


    ## 为什么日志如此重要？


    简单来说，系统日志是单条独立记录的列表，显示了信息系统或网络的特定活动、事件、错误状况、缺陷或一般状态。这些日志记录包含了重要信息，帮助系统和安全管理员了解信息系统内部正在发生什么。


    - 此外，由于许多日志包含安全相关信息（如身份验证事件、访问更改、系统配置更改等），它们帮助管理员跟踪系统上的潜在（或实际的）恶意活动，或者跟踪可能削弱系统安全性的更改。


    如果系统不生成日志，经理、安全人员和开发团队将无法真正知道系统内部发生了什么。他们将不知道系统中是否发生了任何恶意活动，并且无法对此采取任何措施。他们将不知道泄露是如何发生的，也不知道攻击者在第一次突破后去了哪里。只要数据正在被盗且其有害影响仍然存在，无论是失败还是成功的尝试将不被注意到。日志有多种类型，它们取决于底层基础设施、应用程序以及涉及的活动类型。


    ## 安全日志分析


    在数字世界中，日志文件是以信息形式存在的，可以是发生在任何数字设备上的事件，或者是不同用户之间的通信信息。简单来说，它是在特定时间发生的事件，并可能带有提供背景信息的元数据。以下是日志文件的示例：


    ![](img/Figure-6.14.jpg)


    **图 6.14:** 日志文件示例


    通常，它们包含时间戳、用户和事件信息，如 图 6.14 所示。


    你可能从设备中收集许多类型的事件和信号。监控设备应该是你组织更广泛的日志和监控方法的一部分。通常情况下，成功的入侵检测需要多个来源的信息。


    网络网络的所有计算机系统都会生成日志，这些可以是应用、容器、数据库、防火墙、端点、Web 服务和智能合约。


    你的环境中存在数百种可能的日志源类型，选择哪些能够脱颖而出进入你的 IT 意识可能是困难的。根据经验，你应该监控区块链网络中的以下日志：


    *   **系统日志 (`syslog`)：** 这是记录操作系统事件的地方。它显示了关于启动、系统更改、突然关机、问题和警告以及其他重要信息。Syslog
    支持 Windows、Linux 和 macOS。

    *   **以太坊事件日志：** 当以太坊智能合约运行时，它们可以发送事件。当这种情况发生时，合约还会保留提供发生情况信息的日志。`LOG0`、`LOG1`、`LOG2`、`LOG3`
    和 `LOG4` 是用于此目的五个操作码。

    *   **访问日志与授权：** 这些日志包含了访问某些应用或文件的用户或机器人列表。

    *   **威胁日志：** 它们包含了符合安全规则或违规的系统、文件或应用程序活动。你必须在操作系统内部安装防火墙或检测代理才能生成威胁日志。一个常见的例子是由于黑客意网络内部进行横向移动的恶意系统调用。


    在上述类别中，系统日志和审计日志是内置在操作系统中的。更详细的审计日志可以从身份访问管理平台启用，而威胁日志取决于你是否拥有防火墙、运行时代理等安全工具。由于大多数区块链应用开发使用以太坊，明确
    EVM 上的安全日志将为你提供区块链架构内部的深度视图并加强你的防御机制。


    ## 以太坊事件日志


    以太坊虚拟机 (`EVM`) 有五个用于传输以太坊事件日志的操作码 (opcodes)：`LOG0`、`LOG1`、`LOG2`、`LOG3` 和 `LOG4`。通过这些操作码，Web3
    开发人员可以描述智能合约中发生情况的日志记录。


    主题和数据构成了日志记录的一部分。主题是 32 字节（256 位）字，用于解释事件发生的情况。根据日志记录中需要多少主题，使用不同的操作码（`LOG0`–`LOG4`）。例如，`LOG1`
    只有一个主题，而 `LOG4` 有四个。正如此，单个日志记录最多只能四个主题。


    这些日志字段可以在以太坊黄皮书中看到，如 图 6.15 所示。


    ![](img/Figure-6.15.jpg)


    '
