- raw: "*   Blockchains are decentralized, so there's no single source of data to\
    \ hack, and there's no need to bring in third-party suppliers—who may also be\
    \ hacked—to process transactions.\n\n*   Blockchains are encrypted with a private\
    \ key to provide an extra layer of security and ensure data doesn't fall into\
    \ the wrong hands.\n\n*   All changes are made in real time across all nodes,\
    \ which adds transparency and trust in the ledger and ensures there's no single\
    \ point of failure.\n\n*   Blockchains are virtually tamper-proof because changing\
    \ a record would invalidate its file signature and raise a massive red flag.\n\
    \n*   The consensus process requires members of the network to solve a mathematical\
    \ puzzle that requires strong computational power. For example, you have to come\
    \ up with a nonce value to match the difficulty level, and if the miner gets that\
    \ right, the result is broadcast to the network for validation. The longest chain\
    \ rule, which checks the work done (how long the chain is, how much effort is\
    \ put in place to build the chain) before the network accepts any transaction,\
    \ like building a spoofed chain that is longer/more powerful than the real chain\
    \ for the network to agree, as shown in *[Figure 1.2](#c01.xhtml#fig1_2)*.\n\n\
    \    ![](images/Figure-1.2.jpg)\n\n    **Figure 1.2:** Longest chains illustration\
    \ in a blockchain network\n\nJust to explain my point about the longest chain\
    \ and with the most effort, consider the following example; if the chain has more\
    \ blocks but the difficulty level is less, it will not be accepted by the network\
    \ (refer to *[Figure 1.3](#c01.xhtml#fig1_3)*).\n\nThe blockchain that has required\
    \ the most energy to construct is referred to as the *longest chain*. Typically,\
    \ this is the chain with the most blocks or, more accurately, the chain with the\
    \ most work in it.\n\n![](images/Figure-1.3.jpg)\n\n**Figure 1.3:** Longest Chain\
    \ acceptance criteria\n\n**Note**\n\n*Please visit **[https://learnmeabitcoin.com/technical/longest-chain](https://learnmeabitcoin.com/technical/longest-chain)**\
    \ to learn more. It is recommended to develop a good understanding of how long\
    \ the chain is calculated, chain work formulas and results.*\n\nIf you have to\
    \ spoof a chain, meaning to create a duplicate similar chain but with more work\
    \ done, more blocks, and broadcast the block faster than any other miner in the\
    \ network, you need to have developed a supercomputer, which is technically and\
    \ economically not feasible for such gains.\n\nEconomic incentives are given to\
    \ miners who are part of the validation process, with the current reward fee being\
    \ 6.25 bitcoins.\n\nAny block contains the following data:\n\n*   **Version:**\
    \ current version of the block.\n\n*   **Previous block header hash:** reference\
