- raw: "The example shown here is based on a real-world Bitcoin transaction that simulated\
    \ Joe, Alice, Bob, and Gopesh's interactions as they moved money from one wallet\
    \ to another. We will use a blockchain explorer site to visualize each step as\
    \ we follow a transaction through the Bitcoin network to the blockchain.\n\nNote:\
    \ In the same way that a bitcoin search engine does, a blockchain explorer is\
    \ a web application that lets you search for addresses, transactions, and blocks\
    \ and see how they relate to one another.\n\nPopular blockchain explorers include:\n\
    \n*   BlockCypher Explorer\n\n*   blockchain.info\n\n*   Blockstream Explorer\n\
    \nUsing a bitcoin address, transaction hash, block number, or block hash, any\
    \ of these can be searched to find the relevant information on the Bitcoin network.\
    \ I will provide a URL for each transaction or block example so that you can examine\
    \ it in depth yourself.\n\nFor coffee lovers, let us see what buying coffee with\
    \ Bitcoin looks like.\n\nAlice, a coffee lover, is a brand-new user with 0.10\
    \ Bitcoin. which she has received from Joe. She will now make her first purchase\
    \ at Bob's coffee shop in Palo Alto, California, for a cup of coffee.\n\nAlice\
    \ scans the displayed barcode with her smartphone and selects Send to authorize\
    \ the payment, which is shown on her smartphone as 0.0150 BTC being paid to Bob's\
    \ Cafe. Bob sees the transaction on the register and completes it within a few\
    \ seconds—roughly the same amount of time as a credit card authorization.\n\n\
    You can examine Alice’s transaction to Bob’s Cafe on the blockchain using a block\
    \ explorer site (View Alice’s transaction on blockchain.info):\n\nExample: View\
    \ Alice’s transaction on blockchain.info\n\n**[https://blockchain.info/tx/0627052b6f28912f2703066a912ea577f2ce4da4caa5a5fbd8a57286c](https://blockchain.info/tx/0627052b6f28912f2703066a912ea577f2ce4da4caa5a5fbd8a57286c)**\n\
    \nSimply put, a transaction informs the network that one owner of a bitcoin value\
    \ has authorized its transfer to another. In a chain of ownership, the new owner\
    \ can now spend the bitcoin by initiating another transaction that authorizes\
    \ the transfer to another owner, and so on. Confused? Hold on, all this will make\
    \ sense in a while.\n\n# Transactions chaining for Authenticity\n\nJust keep in\
    \ mind that Alice has received BTC from Joe, which she has spent at Bob's café.\
    \ In her ledger, Alice's receipt from Joe will be an input, and the amount she\
    \ would have spent on coffee will be an output. As an input, the difference will\
    \ be returned to her wallet.\n\nAlice's key secured a bitcoin value as a result\
    \ of the transaction. You see, the new transaction she made with Bob's Café uses\
    \ the previous one as an input and generates new outputs for paying for the coffee\
    \ and receiving change. The signature that unlocks those previous transaction\
    \ outputs is provided by Alice's key, demonstrating to the Bitcoin network that\
    \ she owns the funds.\n\nAll of this creates authenticity and ensures that Alice\
    \ is only spending what she has, and not sending the same amount to any other\
    \ person. [Figure 1.6](#c01.xhtml#fig1_6) illustrates all of this, and these ledgers\
    \ pile up in a Bitcoin block. If you add a hashing algorithm and a private key\
    \ signature on top of all this, this gives security in-depth, meaning that with\
    \ authenticity, you get data integrity and confidentiality from someone who wishes\
    \ to tamper.\n\n![](images/Figure-1.6.jpg)\n\n**Figure 1.6:** Bitcoin Transaction\
    \ Review  \n\n**Source:** [https://cypherpunks-core.github.io/](https://cypherpunks-core.github.io/)\n\
    \nThe resulting transaction can be seen using a blockchain explorer web application,\
    \ as shown in Alice’s transaction to Bob’s Cafe (refer to *[Figure 1.7](#c01.xhtml#fig1_7)*).\
    \ So, if anybody has a transaction address or an Alice public key, blockchain\
    \ explorer can be used to view the history.\n\n![](images/Figure-1.7.jpg)\n\n\
    **Figure 1.7:** Alex Transaction to Bob’s cafe  \n\n**Source:** [https://cypherpunks-core.github.io/](https://cypherpunks-core.github.io/)\n\
    \n# Adding the Transaction to the Ledger\n\nThe transaction created by Alice's\
    \ wallet application is 258 bytes long and contains everything required to identify\
    \ new owners and confirm ownership of the funds. The transaction needs to be sent\
    \ now to the Bitcoin network, where it will be added to the blockchain. We'll\
    \ see how a transaction becomes a part of a new block and how the block is \"\
    mined\" in the next section. Last but not the least, we will observe how the network's\
    \ trust in the new block grows as more blocks are added to the blockchain.\n\n\
    It doesn't matter how or where the transaction is sent to the Bitcoin network\
    \ because it contains all of the information needed for processing. Each Bitcoin\
    \ client contributes to the Bitcoin network by connecting to a number of other\
    \ Bitcoin clients. The Bitcoin network is a peer-to-Bitcoin network.\n\nA Bitcoin\
    \ node is any system that participates in the Bitcoin network by \"speaking\"\
    \ the Bitcoin protocol, such as a server, desktop application, or wallet. The\
    \ new transaction can be sent to any Bitcoin node that Alice's wallet application\
    \ is connected to via any connection: mobile, WiFi, wired, etc.\n\nA method of\
    \ propagation known as flooding occurs when any Bitcoin node that has never seen\
    \ a valid transaction will immediately forward it to all other connected nodes.\
    \ As a result, the transaction spreads quickly across the peer-to-peer network,\
    \ reaching many nodes within a few seconds. This peer-to-peer network offers resilience\
    \ and availability. And in case a few nodes are down due to a denial of service\
    \ attack, for instance, the process will not be stopped, it continues as there\
    \ are thousands of other servers that would be interested in getting this transaction\
    \ across the mining journey.\n\n# Mining of Bitcoin Transactions\n\nFrom user\
    \ wallets and other applications, the network is constantly receiving new transactions.\
    \ These are added to a temporary mining pool of unverified transactions that each\
    \ Bitcoin network node manages as soon as they see them. Using the mining algorithm\
    \ (Proof-of-Work), miners attempt to establish the validity of a new block by\
    \ including unverified transactions from this mining pool into it as they create\
    \ it.\n\n*A mining pool is a joint group of cryptocurrency miners who combine\
    \ their computational resources over a network to strengthen the probability of\
    \ finding a block or otherwise successfully mining for cryptocurrency.*\n\nThe\
    \ highest-fee transactions and a few other criteria determine the order in which\
    \ transactions are added to the new block. Knowing that they lost the previous\
    \ competition, each miner begins mining a new block of transactions as soon as\
    \ they receive the previous block from the network. The miner immediately starts\
    \ calculating the Proof-of-Work for the new block and populates it with transactions\
    \ and the fingerprint of the previous block. Each miner adds a unique transaction\
    \ to his or her block.\n\nThis transaction pays the miner’s Bitcoin address the\
    \ block reward, which is currently equal to 12.5 newly created bitcoins, in addition\
    \ to the total amount of transaction fees from all of the transactions in the\
    \ block. The miner\"wins\" this reward if they solve the problem and validate\
    \ that block, as their successful block is added to the global blockchain and\
    \ the included reward transaction can be spent.\n\nThe economics of rewards and\
    \ transaction fees, which go to the miners prevent them from any foul play. In\
    \ other words, the Bitcoin protocol is designed in a way that the chances of manipulation,\
    \ double spending, and corruption are practically not possible.\n\n# Bitcoin Security\
    \ Review"
