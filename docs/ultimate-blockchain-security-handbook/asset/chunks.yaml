  trans: '

    虽然测试有助于确认合约在某些数据输入时返回预期结果，但它无法明确证明对于测试期间未被使用的输入值也具有相同的结果。因此，在测试智能合约时，无法保证其`功能正确性`（即证明程序对所有输入值集合均按要求运行的能力）。


    因此，我们需要一种像形式化验证这样的流程，通过将程序的形式化模型与其形式化规范进行比较，确定软件是否正确。形式化规范了程序的属性（即关于程序执行的逻辑断言），而形式化模型则代表了程序的抽象数学表示。


    与测试不同，形式化验证可用于检查智能合约的执行在所有执行情况下是否符合形式化规范（即它不包含漏洞），而无需使用样本数据进行执行。这不仅在运行数十个单元测试时节省了时间，还能更有效地发现以前未被检测到的漏洞。传统的安全审计不等同于形式化验证。通过形式化检查，利用基于
    `EVM` 数值模型开发的工具，在字节码层面对合约代码进行确认。


    # 智能合约的形式化验证是如何工作的


    让我们来看一下使用形式化验证验证智能合约的过程。智能合约使用 `Solidity` 编写，然后转换为字节码。一旦还原为字节码，智能合约就可以部署在区块链上，某个地址的合约账户。


    ![](img/Figure-5.2.jpg)


    **图 5.2：** 编译 Solidity 合约


    在接下来的示例中，合约已部署在 `0x4ab05`。合约账户包含资金、编译后的合约和其他数据。图片还包含一个外部拥有账户（位于 `0x6eae7`）。此类账户仅包含资金（在本例中为
    100 ether）。


    ![](img/Figure-5.3.jpg)


    **图 5.3：** 已部署合约的地址


    当发送给合约的交易提交到网络后，合约开始工作。这里有一笔将 ether 从提交者账户转移到另一个账户的交易：


    ```

    transfer(4000 ether, address(0x6eae7)).

    ```


    数千台运行相同虚拟机（`VM`）副本的计算机（矿工）将执行这笔交易。在这种情况下，`VM` 将通过解释 `transfer` 函数的字节码，被指令向 `0x6eae7`
    添加 4000 ether，并从 `0x4ab05` 减去 4000 ether，如图 5.4 所示。


    ![](img/Figure-5.4.jpg)


    **图 5.4：** 虚拟机节点进行的合约验证


    由于所有 `VMs` 都使用相同的字节码处理相同的数据，它们将产生相同的答案。


    再次，我们的目标是确信合约将正确运行，无论转移的值、两个账户的余额以及哪个账户接收价值。


    以下是防止我们获得预期结果的各种方式：


    *   程序员可能会误解意图。例如，假设没有人说明如果没有足够的资金进行转移该怎么办，`transfer` 函数应该失败吗？还是合约应该“尽力而为”只转移可用的部分？


    *   程序员可能会犯错。


    *   程序员可能会在不进行验证的情况下假设代码是正确的。


    *   传统的安全审计不等同于形式化验证。通过形式化检查，利用基于 `EVM` 数值模型开发的工具，在字节码层面对合约代码进行确认。

