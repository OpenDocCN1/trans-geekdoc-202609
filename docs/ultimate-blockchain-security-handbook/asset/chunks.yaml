    \ `if` statement will be executed by the contract, resulting in the mathematical\
    \ underflow. This time, the address balance of `msg.sender` will be greater than\
    \ the owner's balance in the second `if` statement, allowing us to take advantage\
    \ of the smart contract's flaw and claim ownership.\n\n![](images/Figure-4.20.jpg)\n\
    \n**Figure 4.20:** Snapshot for the explanation of the vulnerability\n\nNow that\
    \ we understand the vulnerability, we can return to the PWNX challenge and complete\
    \ the lab.\n\nSince we need to communicate with an external blockchain, we must\
    \ create a script capable of doing what we just tested on our local system.\n\n\
    # Remote Exploitation\n\nA Python library for interacting with Ethereum is called\
    \ `Web3.py`. It is frequently used in decentralized apps (dapps) to facilitate\
    \ transaction sending, smart contract interaction, block data reading, and other\
    \ applications.\n\nBy calling the relevant functions, we can use the ABI to communicate\
    \ with smart contracts.\n\nLet’s understand the code underneath in the depiction:\n\
    \n*   We have a URL for HTTP; this is the ganache provider that makes it possible\
    \ for us to use RPC calls to communicate with the smart contract.\n*   We import\
    \ our ABI from this point to call necessary functions.\n*   We connect to the\
    \ `we3.eth.contract` command and establish the smart contract's address.\n*  \
    \ From here, we can call functions like `getOwner`. Note that the calls that do\
    \ not change the state are called calls because they go to read values without\
    \ changing the state of the blockchain.\n\n![](images/Figure-4.21.jpg)\n\n**Figure\
    \ 4.21:** Communication with smart contracts through the ABI\n\nAfter running\
    \ the script, we can see the owner of the contract, the balance, and the nonce\
    \ in the console. See the following snapshot:\n\n![](images/Figure-4.22.jpg)\n\
    \n**Figure 4.22:** Output from the script\n\nThe nonce is only a counter that\
    \ records notifications of transactions made. In this example, there was only\
    \ one transaction because the contract was deployed only once.\n\nThe transaction\
    \ that invokes the transfer function and causes underflow will now be created\
    \ once we tweak our exploit.\n\nAs you can see, once the transaction is created,\
    \ we sign it using the challenge's private key before executing it using the `rawTransaction`\
    \ function. This time, we use the `buildTransaction` method to generate the transaction\
    \ that will alter the blockchain's state.\n\n![](images/Figure-4.23.jpg)\n\n**Figure\
    \ 4.23:** Result of sending the transactions\n\nAfter running the script, we can\
    \ see that the transaction is successful by returning the transaction hash and\
    \ other data. Once we've changed the state of the blockchain and exploited the\
    \ vulnerability, let us verify.\n\n![](images/Figure-4.24.jpg)\n\n**Figure 4.24:**\
    \ Verification of the exploit\n\nNow, check whether the address owner is different.\
    \ After exploiting the code, our contract address now becomes the owner of the\
    \ contract. Hence, we have successfully exploited the vulnerability, as shown\
    \ in [Figure 4.25](#c04.xhtml#fig4_25).\n\n![](images/Figure-4.25.jpg)\n\n**Figure\
    \ 4.25:** Comparison of contract address after exploiting the vulnerability\n\n\
    Congratulations on making it this far! You have successfully hacked the smart\
    \ contract. Now, repeat this exercise and try to take the challenge yourself.\
    \ Follow the steps that we have just learned.\n\nBefore we go to the next topic,\
    \ let us see the mitigation that you can use to prevent buffer overflow and underflow\
    \ attacks.\n\n# Mitigations against Overflow and Underflow Attacks](#toc.xhtml#s81a)\n\
    \nFollowing are some of the ways to mitigate overflow and underflow attacks:\n\
    \n*   **SafeMath library**: Developers should use safeMath libraries or appropriate\
    \ types with overflow detection to avoid an integer overflow or underflow attack.\
    \ This library not only gives fundamental math activities but can also really\
    \ look at the preconditions and postconditions to decide if a flood has happened\
    \ or not. In the event of an error, the library cancels the transaction and changes\
    \ its status to `Reverted`.\n*   **Compiler Version**: The attack can be prevented\
    \ by using robustness >= 0.8. Compile smart contracts with a newer variation of\
    \ the compiler. The preventative code of external libraries like SafeMath is thus\
    \ incorporated into the compiled code.\n*   **Use modifier ‘onlyOwner’**: You\
    \ can also use security-enhancing modifiers like `onlyOwner` or check their code\
    \ to ensure that the values never exceed their expected range.\n*   **Regularly\
    \ update code**: It is also important to keep the code updated.\n    **Data Execution\
    \ Prevention**: Attackers frequently inject malicious code into locations like\
    \ stacks and heaps when utilizing buffer overflows to gain unauthorized application\
    \ execution. As a result, data execution prevention, a new buffer overflow mitigation\
    \ strategy, is presented. This is referred to as `NX` (No Execute) in Linux. Both\
    \ hardware and software levels can enable DEP. When `NX` is enabled, the stack\
    \ is no longer executable, and any malicious code added as part of an attack is\
    \ also no longer considered to be executable.\n*   **Address Space layout randomization**:\
    \ Address space layout randomization (ASLR) randomizes the base addresses of the\
    \ libraries and other memory areas such as the stack. This makes it harder for\
    \ an attacker to build ROP chains. As ROP chains rely on the addresses of instructions\
    \ from these libraries, which are loaded into the program.To check if ASLR is\
    \ enabled on a Linux machine (specifically, Ubuntu), the following command can\
    \ be used:\n\n```\n$ sudo cat /proc/sys/kernel/randomize_va_space\n```\n`1`\n\n\
    As you can see, the value of the file shown in the preceding excerpt is set to\
    \ 1, which means ASLR is fully enabled is enabled.\n\nFor more deep understanding\
    \ of this topic, it is recommended to go through the following article:\n\n**[https://www.geeksforgeeks.org/overflow-and-underflow-attacks-on-smart-contracts/](https://www.geeksforgeeks.org/overflow-and-underflow-attacks-on-smart-contracts/),**\n"
