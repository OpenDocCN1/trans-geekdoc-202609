- raw: 'Now that you know how to build an Identity and Access Management solution
    for your blockchain application, let me tell you an interesting story. I fell
    victim to a fake shopping platform.


    I was forced to send the BTC to a fake website that I thought was a real business
    at first. After two weeks of doing things, I quickly understood that I was part
    of a scam. Then, I wanted to figure out where my trade went so, I could find out
    who did it and punish them.


    As a rule, if someone is pulling a scam on the internet, they are using bitcoin.
    As a standard, they all want to use swaps to turn their bitcoin into real money,
    like US dollars or the currency of their home country. The transaction Hash is
    the way to keep track of it.


    If you look at the picture below, you can see that transaction Hash C1 is sent
    to address a1, then to address a2, and finally to VASP 1 address a3. VASP stands
    for **virtual asset service provider**, which is what people usually call **crypto
    exchanges**.


    Dealing with Hash C1 is my transaction, in which I sent Bitcoin to the address
    that the criminals gave me. Hash C3''s last transaction is sent to an exchange
    wallet address called a3. Legal or customer service of an exchange can be called
    with the information to find out who owns the wallet address in that exchange.
    Usually, they won''t tell the owner''s name unless the cops ask them to.


    So, if you think you have been a victim of an online scam involving crypto currency,
    you should try to find out where your money went through the transaction logs.
    There are good crypto forensics companies that can give you the information you
    need once you give them the details of the deal. Lastly, you need to make a police
    report so that an exchange can tell you who did it and help you take the right
    steps.


    I have copied a picture of a transaction flow from an investigation report below
    for your reference, so you can know what you can do.


    ![](images/Figure-6.6.jpg)


    **Figure 6.6:** BTC Transaction flow from Crypto wallets to an exchange


    # [Identity and Access Management for Smart Contracts](#toc.xhtml#s111a)


    In the world of smart contracts, access control—that is, *who is allowed to do
    what*—is very important. Your contract''s access control may say who can create
    new tokens, vote on ideas, stop trades, and do many other things. Due to this,
    it is important to know how to implement it and prevent abuse.


    Access control in smart contracts is a way to control who is allowed to do certain
    things in a contract. Most of the time, these are activities that are important
    for the security and proper operation of the system, like creating new tokens,
    stopping transfers and withdrawals, or installing upgrades.


    There are some functions that are essential to a smart contract''s safety. Consider
    a contract that uses the proxy method to do updates. If access to the upgrade
    function is never limited, someone with malicious intentions could change the
    meaning of the contract or run commands that impact performance.


    Take the Temple DAO Stax hack as an example. Because there were no access controls,
    the hacker was able to make new tokens. The attacker took advantage of flaws in
    the contract. This occurred because people who weren''t meant to could call a
    secret function (migrateStake).


    Upgrades are not the only functions that need proper access control. Any function
    that can have a big impact on how a protocol works needs to be properly protected.
    For instance, the DeFi protocol Maker DAO uses access control to limit who may
    submit a price oracle update (so attackers cannot alter the prices of assets in
    the system).


    Although I have covered this topic in more detail in a previous chapter while
    explaining smart contract security, I am briefing the concepts here again, so
    that the key takeaways for strengthening smart contract access control can be
    understood clearly.


    Following are some of the best practices you can adopt. In today''s smart contracts,
    two common methods for establishing access control are the **Ownable pattern**
    and **Role-based permissions**.


    # [Ownable Pattern](#toc.xhtml#s112a)


    This works on the idea that the owner of the contracts holds special privileges,
    as an administrative function in that contract, although the rights are transferable
    to other accounts as well.


    Under the Ownable pattern, restricted functions have an only Owner modifier that
    checks the identity of the calling account before executing. If the caller’s address
    fails to match the owner’s address stored in the contract storage, the call reverts.


    This type of account increases the risk of centralization and single point of
    compromise, as seen in the recent Ronin hack. In hindsight, giving special account
    privileges to one account can reduce the risk of mishandling caused by other accounts
    and reduce management overhead, in case the account needs to be frozen due to
    a vulnerability or an exploit.


    This approach can work during the pre-build phase, but as the contract gets deployed
    to the main network, role-based permissions should be applied. Let us look at
    what this looks like.


    # [Role-Based Permissions](#toc.xhtml#s113a)


    Looking at the role access, as the name says, the access is restricted to the
    role the subject has. The levels of access that employees or a developer have
    to the network are referred to as roles in RBAC.


    This would enable the power to go from one centralized account into multiple accounts,
    such as a role for token minter, token burner, implementing upgrades, and so on.
    The individual roles have access to only the functions needed in the contract.
    It is based on the principle of least privilege, meaning that only the user can
    perform the assigned duties. Following is a snippet of the code where the RBAC
    is implemented, for example, only the admin, or *borrow cap guardian*, can call
    the setBorrowCap function to set new borrowing limits for cToken markets.


    `*******************************************`


    `function _setMarketBorrowCaps(DToken[] calldata dTokens, uint[] calldata newBorrowCaps)
    external {`


    `require(msg.sender == admin || msg.sender == borrowCapGuardian, "only admin or
    borrow cap guardian can set borrow caps");`


    `****************************************************`


    The complete code can be found at **[https://github.com/compound-finance/compound-protocol/blob/master/contracts/Comptroller.sol](https://github.com/compound-finance/compound-protocol/blob/master/contracts/Comptroller.sol)**


    # [Multi-Signature](#toc.xhtml#s114a)


    A multi-signature account is a special type of account that requires a minimum
    address signature before contract execution. This will allow the power to be distributed
    and offer decentralization. This is a technique used by projects like Compound
    and Balancer.


    Another important aspect of having a multi-signature property is the implementation
    of fault tolerance by adopting an m of n scheme. It simply means that if two out
    of four are available, then only the function is to be executed. This is an alternative
    way of controlling access.


    # [Time locks](#toc.xhtml#s115a)


    In a time-locked contract, the state of a smart contract gets locked for a specified
    period of time, and any state change operation will not be executed until the
    timer expires. This offers two benefits: first, it delays the contract execution,
    which means if there is a change coming in the protocol of a contract, users get
    enough time to react and potentially exit the system.


    The other benefit it gives is stalling malicious actions. By adding another layer
    of security, the blockchain makes it safer to transfer ownership or make new coins.
    Even if an attacker gets certain powers (by taking over whitelisted accounts or
    going after features that aren''t protected), you still have time to stop them.


    The Uniswap Timelock contract is a great example of how timelocks can be used
    to control routine actions.


