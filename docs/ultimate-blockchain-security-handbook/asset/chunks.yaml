  trans: "\n\n在你的智能合约层中启用事件日志，例如在智能合约系统中高亮显示不同的特权账户，并对每个角色进行描述。此外，当访问控制机制中的任何细节发生变化时（例如通过日志事件），请通知管理员。\n\
    \n之前学到的所有功能都将加强你的智能合约访问控制，并为你提供深层防御的安全态势。\n\n# 公钥基础设施\n\n2020 年，SolarWinds Orion\
    \ 平台遭到入侵，黑客注入了名为 Sunburst 的恶意代码，以未经授权的方式访问了属于美国财政部和商务部等美国政府机构的大量敏感信息。这次重大攻击的幕后黑手破坏了公钥证书，并进一步利用了公钥基础设施，或称\
    \ `PKI`。这是历史上最受关注的网络攻击事件之一。\n\n在本主题中，我们将介绍 `PKI` 的概念、其重要性、挑战、它在区块链栈中的位置（如何加固安全性），以及你可以用于构建解决方案的工具。\n\
    \n让我们从基础知识开始。\n\n公钥基础设施，或 `PKI`，是一个用于建立和管理公钥加密的所有内容的统术语，公钥加密是互联网上保持信息安全的最常见形式之一。它已内置在如今使用的每个网络浏览器中，以保护跨越互联网的流量。例如，当你在浏览器中启用\
    \ `HTTPS` 时，你可以在 URL 中看到锁图标，表示你的浏览器信任你正在通信的服务器，并且跨越它的任何消息都经过了加密。\n\n现在，如果你考虑安全控制及其用例，它们可以分为以下几类：\n\
    \n*   **强制机密性：** `SSL/TLS` 加密确保了跨越区块链架构的任何传输通信。例如，从 API 网关发往区块链预言机的 `HTTPS` 请求，或者区块链节点之间的\
    \ `HTTPS` 通信。\n\n*   **启用身份验证：** 它包括网页身份验证、机器和用户验证以及双因子身份验证。例如，去中心化 Web 应用仅接受来自信任源的。另一个重要实体是区块链第\
    \ 2 层和第 3 层使用的不同协议。通过启用身份验证，可以从伪造或恶意节点获得信任，使得节点只有在持有有效证书的情况下才能网络的一部分。\n\n*   **数据完整性：**\
    \ 这可以实现静态安全；在两个网络元素之间传输的信息都可以启用数据完整性检查。例如，数据值可能具有一个摘要，当它被更改时可以被轻松识别。你还可以强制执行静态加密，以便数据无法被直接读取。\n\
    \n现在我们已经理解了用例以及它们如何帮助保护你的区块链应用程序，让我们看看它如何通过其基本支柱发挥作用。\n\n要理解 `PKI` 如何运行，回到最初建立加密的基础原理是非常关重要的。我们应该学习更多关于加密方法和数字证书的知识。\n\
    \n# 公钥加密\n\n加密方法是复杂的数学公式，用于隐藏或加密以及揭示或解密消息。它们也是 `PKI` 验证的构建块。公钥加密在区块链中至关重要。想想钱包中公钥和私钥对的使用、构建区块时使用的哈希算法\
    \ `SHA256`，以及提交交易时使用私钥签名的数字签名。所有这些用例都是通过公钥加密实现的。它主要分为非对称加密和对称加密。\n\n# 对称加密\n\n\
    使用对称加密时，以明文编写的消息会通过复杂的模式变成加密状态。加密后的消息很难破解，因为明文中的相同字母在加密文中并不总是看起来一样。例如，`XYZ` 单词不会转换为三个相同的字母。\n\
    \n对于对称加密，你需要同一个密钥来加密和解密消息。没有密钥，很难弄清楚如何解密消息。然而，使用同一个密钥来保护和解密消息是一个巨大的风险。这是因为如果共享密钥的方式或密钥本身被破解，发送安全文本的整个目的和过程就会丢失。\n\
    \n# 非对称加密\n\n使用非对称加密，消息仍然通过数学公式加密，但只有接收者需要知道私钥来解密。同时，任何人都可以公钥加密消息。\n\n这里有一个使用著名角色\
    \ Bob 和 Alice 的例子：\n\n*   Alice 想给 Bob 发送一条秘密消息，因此她使用 Bob 的公钥创建加密密文，只有 Bob 的私钥才能解码。\n\
    \n*   由于只有 Bob 的私钥可以解密消息，Alice 可以放心地发送，知道没有其他人（即使是窃听者）可以读取，只要 Bob 确保没有其他人拥有他的私钥。\n\
    \n非对称加密还让你能够完成一些对称加密难以实现的事情，例如创建数字签名，其功能如下：\n\n*   Bob 可以向 Alice 发送消息，然后使用他的私钥对消息末尾进行签名加密。\n\
    \n*   当 Alice 接收消息时，她可以使用 Bob 的公钥向 Bob 检查两点：\n\n    *   Bob 或拥有 Bob 密钥的其他人发送了消息。\n\
    \n    *   消息在传输过程中没有被更改，因为如果更改了，证明将失败。\n\n在任何一种情况下，Alice 都没有创建自己的密钥。仅通过交换公钥，Alice\
    \ 就可以给 Bob 发送秘密消息并检查 Bob 签署纸纸上的签名。重要的是，这些操作不是双向的。为了让 Bob 能够向 Alice 发送秘密消息并检查她的签名，Alice\
    \ 需要创建自己的密钥并给 Bob 对应的公钥。\n\n*图 6.7* 是使用不同算法说明这一概念的插图，我还在框中列出了用例。\n\n![](img/Figure-6.7.jpg)\n\
    \n**图 6.7：** 非对称加密示例\n\n现在，如果只需要公钥和私钥用于加密、解密和数字签名，如何生成这些密钥？我们使用哪些算法？\n\n答案是 `RSA`、`ECC`\
    \ 和 `Diffie-Hellman` 算法。每个算法使用不同的规则生成加密密钥，但在公钥和私钥的关系方面，它们都依赖于相同的基本原理。\n\n作为一个例子，让我们看看\
    \ `RSA` 加密方案。`RSA` 加密通常与其他类型的加密一起使用或用于数字签名，可以显示消息是真实的且未被篡改。一个很好的用例是使用对称密钥加密文件，然后使用\
    \ `RSA` 密钥加密对称密钥，这意味着只有 `RSA` 私钥会被用于解密对称密钥。多个钱包创业公司使用了这种策略。你可以使用 `open SSL`、`cryptolib`\
    \ 和其他加密库实现 `RSA`。\n\n另一个很好的用例是 `TLS`，它用于在两个实体（Web 客户端和服务器）之间实现安全通信。`HTTP` 通信已通过\
    \ `RSA` 变为 `HTTPS`。\n\n以下步骤解释了如何使用 `RSA` 计算公钥和私钥：\n\n*   选择两个大素数，`X` 和 `Y`。然后计算它们的积，`n=x*y`\n\
    \n*   计算欧函数（乘法函数），使得 `ϕ(n)=(`x`−1) (`y`−1)`。\n\n*   选择整数 `f`，使得 `f` 与 `ϕ(n)` 互质且\
    \ `1<f<ϕ(n)`。数对 `(n, f)` 为公钥。\n\n"
