  trans: '

    任何好事事都是需要付出代价的，那么获得快速性能和改进的可扩展性的权衡是什么呢？信任和中心化方面直接影响安全容忍度。让我们来看一下。


    *   **信任依赖：** 私有链具有相当水平的可扩展性。这意味着你的需求可以决定私有链的大小。例如，一个组织仅需 20 个节点即可轻松实现一个区块链。结果是它们在扩展时增加更多节点将不会遇到任何困难。

    *   **高度中心化：** 由于私有链需要一个中央身份和访问管理（IAM）系统才能正常运行，因此它们受到了限制。该框架拥有所有的观察和管理权限。它允许选择对区块链中存储数据的访问权限级别，或者向网络添加新节点。如下所示，区块链技术支柱之一的去中心化概念与这一系统直接对立。


    ![](img/Figure-2.4.jpg)


    **图 2.4：** 私有链与公有链相比的中心化方面


    上述两个因素都会影响安全方面，导致私有链网络因为参与者或节点较少而更容易受到安全攻击。假设任何一个枢纽访问了核心管理框架，它就可以足够地接触组织中的每一个枢纽。这使得枢纽更容易黑入整个私有链并滥用数据。


    **案例研究：** Hyperledger Fabric 是一个用于应用程序开发的区块链框架，具有独特的访问控制和身份管理功能。沃尔玛使用了一个基于 Hyperledger
    Fabric 的私有区块链系统。Linux 基金会的开源框架是许可链区块链的一个示例。


    它让沃尔玛能够查出其产品的源头。其供应商将真实性证书添加到账本中。得益于此，该业务能够在几秒钟而非几天内追踪到产品的来源。


    # 混合区块链


    它是私有链和公有链的混合内容，某些部分由特定组织控制，其他部分则公开。你可以认为是以太坊和 Hyperledger fabric 的实现。任何行业都可以从这种设计中受益，在某些情况下，如果信息无法与公众共享但需要保持不可篡改，并通过工作流实现自动化，你可以利用私有链。而在同一个组织内部，如果你想针对公共信任并启用
    P2P 交易，可以使用比特币或以太坊。


    **案例研究：** 它为医疗服务行业、政府、土地货币机构提供了更具意义的答案。当数据必须保持私有但可以被公众访问时，它提供了一种解决方案。一个很好的例子是，患者想与医生和医疗保险公司共享医疗数据，同时也想确保个人隐私和安全。


    另一个很好的用例是在公共网络上使用私有支付系统。底图是观察差异的良好说明，你获得了公有链和私有链两种类型的优点。


    ![](img/Figure-2.5.jpg)


    **图 2.5：** 混合区块链类型


    # 联盟链


    在联盟链中，来自多个业务或组织的节点以更大的私密性管理网络。通过该平台，他们协作共享和修改信息以维护工作流、可扩展性和问责制。从下图可以看出，联盟链被限制属于联盟组的组织。


    ![](img/Figure-2.6.jpg)


    **图 2.6：** 联盟链


    联盟链的主要目标是通过该平台协助机构解决问题并找到适用的解决方案。`CORDA` 和 `Quorum` 是两个涉及不同组织的知名联盟链。


    为了清楚起见并将其与私有链区分来：联盟链有几个选定的成员（例如几个协会），而私有链有一个对区块链原则拥有绝对指挥权的成员，这意味着他可以使用相同的区块链平台，例如在私有企业设置中使用
    `HL Fabric`。


    **案例研究：** 在金融领域，KYC（了解您的客户）是该领域发行和交易资产业务的一部分。数据集信息由联盟中的所有参与银行进行集中存储。当银行需要验证或访问债权人信息时，这个分布式账本将一直为该银行可用。详细分析显示，联盟链是实施跨部门项目的最佳选择。


    其他的区块链实现如下。它从医疗保健到能源，一直延伸到技术和媒体，共同小组结合解决特定的解决方案。下图很好地说明了联盟链的实现如何分布在各个领域，其中金融部门占大部分份额。


    ![](img/Figure-2.7.jpg)


    **图 2.7：** 联盟链部门分布


    # 以太坊概述


    在进入其安全态势之前，让我们先花点回顾一下以太坊。


    ## 以太坊简介


    让我们从基础开始。什么是以太坊？它与比特币有什么区别？它的架构是什么样的？在深入研究、审查安全态势，然后寻找利用方法并最终加固它之前，这些都是需要展开的重要问题。


    这也属于公有链类别。你可能在奇怪我们为什么没有[第 1 章，区块链安全概述]中讨论它。原因之一是它的架构与比特币区块链略有不同，因为它涉及智能合约并允许创建去中心化应用程序，这些也可以为私有链进行调整，因此我想在在我们讨论过不同类型的区块链之后介绍它，以免你感到困惑。让我们开始。


    以太坊是一种去中心化技术，可用于构建应用和组织、持有资产、进行业务和通信。以太坊让你控制自己的数据和共享内容，因此你不需要交出所有的个人信息。`Ether`
    是以太坊自己的加密货币，用于支付某些基于网络的活动。


    ## 以太坊与比特币的区别


    两者都是公有链，允许你使用数字货币发送而不涉及中心化的支付提供商或银行。但以太坊是可编程的，这意味着你可以在其网络之上构建应用程序。由于去中心化，这些应用程序被称为去中心化应用程序。


    以太坊更像是一个金融服务、游戏、社交网络和其他尊重你的隐私且无法对你进行审查的市场，而比特币仅仅是一个支付网络。


    以太坊的原生加密货币被称为 `Ether` (`ETH`)。它可以立即发送给世界上任何地方，因为它是完全数字化的。由于去中心化和透明性，`ETH` 的供应不受任何政府或企业的控制。只有质押了代币（如
    POW 共识机制中的矿工）并工作保护网络的验证者才能获得新币，这些币也被称为代币。


    在以太坊网络上，每个操作都需要一定数量的计算能力。该服务的支付使用 `ether` 完成。这意味着为了使用网络，你至少需要少量的 `ETH`。


