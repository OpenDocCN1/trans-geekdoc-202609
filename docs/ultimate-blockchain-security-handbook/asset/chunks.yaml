    \nFollowing are some of the ways to mitigate overflow and underflow attacks:\n\
    \n*   **SafeMath library**: Developers should use safeMath libraries or appropriate\
    \ types with overflow detection to avoid an integer overflow or underflow attack.\
    \ This library not only gives fundamental math activities but can also really\
