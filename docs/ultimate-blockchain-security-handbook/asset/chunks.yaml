- raw: '*If a website asks users to sign in, enter personal information like their
    credit card numbers, or view sensitive information like health benefits or financial
    information, it is important to keep the data confidential. SSL certificates help
    keep internet transactions private and give users confidence that the website
    is real and safe to share private information.*


    Now that you have understood the concept of PKI and how it can aid blockchain
    websites and network infrastructure, we will take a deep dive into verifying its
    application in Hyperledger Fabric.


    We know that a PKI is composed of Certificate Authorities who issue digital certificates
    to parties (for example, users of a service, service providers), who then use
    them to authenticate themselves in the messages they exchange in their environment.


    This can be seen in *[Figure 6.12](#c06.xhtml#fig6_12)*, where the principal is
    requesting a certificate from CA, who is responsible for issuing the certificate.


    ![](images/Figure-6.12.jpg)


    **Figure 6.12:** Hyperledger Fabric CA Architecture


    Also, the certificate revocation list is maintained by the CA principals whose
    identities are compromised or are not qualified to issue the certificates. This
    is like the concept of an access control list, where you allow specific IPs over
    another. The Public key, which is maintained by the user, has the signature of
    a CA. In this way, when the principal communicates with any other users, it can
    establish the truth.


    ![](images/Figure-6.13.jpg)


    **Figure 6.13:** Issuance of signed certificates to principals


    *[Figure 6.13](#c06.xhtml#fig6_13)* helps us visualize the trust hierarchy, where
    all principals are verified by the CA, and each holds a signed certificate. Every
    such principal who wishes to interact must have a validated certificate (public
    key).


    If you are looking for more details about PKI aiding Hyperledger Fabric using
    DIGI-CERT CA, please visit:


    **[https://www.hyperledger.org/learn/publications/thales-digicert-case-study](https://www.hyperledger.org/learn/publications/thales-digicert-case-study)**


    # [Security Logging and Monitoring](#toc.xhtml#s124a)


    We live in an increasingly complex environment where breaches, hacks, and other
    malicious online activities seem to be in the news all the time. Security systems
    need to be strong enough to deal with the constant threats that companies face
    today.


    Security professionals have a lot to do identification and authentication, access
    control, encryption of data in transit and at rest, data integrity, system and
    data availability, vendor management, incident response, personnel security, vulnerability
    management, malware defenses, application security, etc. It''s important for them
    to be able to gather, analyze, and report information that helps with all these
    things, and blockchain is no different. With blockchain, you end up with more
    ways to get in because the network is spread out.


    # Why logging is important?


    Put simply, a system log is a list of individual records that show specific activity,
    events, error conditions, flaws, or the general state of an information system
    or network. These log records have important information that helps system and
    security managers understand what is going on in an information system.


    As many logs contain security-related information (like authentication events,
    changes in access, changes in system configuration, and so on), they help administrators
    keep track of potential (or actual) malicious activity on the system or changes
    that may weaken the security of the system.


    If the system does not make logs, managers, security staff, and development teams
    will not really know what is going on in the system. They won''t know if any malicious
    activities are happening in the system and will not be able to do anything about
    it. They will not know how a breach happened or where the attacker went after
    the first break. As long as data is being stolen and their harmful presence is
    still there, both failed and successful attempts will go unnoticed. Logs are of
    various types, and they depend upon the underlying infrastructure, the application,
    and the type of activities involved.


    # [Security Logs Analysis](#toc.xhtml#s125a)


    In a digital world, a log file is information either in the form of events that
    occur on any digital device or communication information between different users.
    In simple words, it is an event that took place at a certain time and might have
    metadata that contextualizes it. Following is an example of a log file:


    ![](images/Figure-6.14.jpg)


    **Figure 6.14:** Example log file


    In general, they contain timestamp, user, and event information, as shown in *[Figure
    6.14](#c06.xhtml#fig6_14)*.


    There are many types of events and signals that you may be able to collect from
    devices. Monitoring devices should form part of your organization’s wider approach
    to logging and monitoring. Very often, successful intrusion detection requires
    multiple sources of information.


    All the computer systems that are part of the network generate logs, which can
    be apps, containers, databases, firewalls, endpoints, web services, and smart
    contracts.


    There are hundreds of possible types of log sources in your environment, and choosing
    which bubbles to the top of your IT consciousness can be difficult. As a rule
    of thumb, you should be monitoring the following logs in your blockchain network:


    *   **System Log (syslog):** This is where operating system events are written
    down. It shows information about starting up, changes to the system, sudden shutdowns,
    problems and warnings, and other important things. Syslog is made for Windows,
    Linux, and macOS.


    *   **Event logs on Ethereum:** When Ethereum smart contracts run, they can send
    out events. When this happens, the contracts also keep logs that give information
    about what happened. LOG0, LOG1, LOG2, LOG3, and LOG4 are the five opcodes that
    the EVM can use to send out event logs.


    *   **Access logs and authorization:** These logs include a list of the people
    or bots who accessed certain apps or files. These can be taken from Active Directory,
    LDAP, or AAA servers.


    *   **Threat Logs**: They contain information about system, file, or application
    activity that meets a security rule or a breach. You must install a firewall or
    a threat detection agent inside your OS for threat logs to appear. A common example
    of a threat log is a malicious system call generated due to a hacker''s intent
    to perform lateral movements inside the network.


    Out of the aforementioned categories, system logs and audit logs are built into
    the operating system. More granular audit logs can be enabled from the identity
    and access management platform, whereas threat logs depend upon whether you have
    any security tools like firewalls, runtime threat detection agents like antivirus
    software, etc. As most blockchain application development uses Ethereum, clarity
    on security logging on EVM will give you thorough visibility inside your blockchain
    architecture and strengthen your defense mechanism.


    # [Ethereum Event logs](#toc.xhtml#s126a)


    Ethereum Virtual Machine (EVM) has five **operation codes** (opcodes) for transmitting
    Ethereum event logs: LOG0, LOG1, LOG2, LOG3, and LOG4. With such opcodes, Web3
    developers can make log records that describe what happened in smart contracts.
    This can happen, for example, when the owner of an NFT changes or when a coin
    is transferred.


    Topics and data constitute a part of each log record. Topics are 32-byte (256
    bit) **words** that explain what''s going on in an event. Depending on how many
    topics need to be in the log record, different opcodes (LOG0–LOG4) are used. For
    example, LOG1 has only one topic, while LOG4 has four. Because of this, a single
    log record can only have a maximum of four issues.


    These log fields can be seen in the Ethereum yellow paper, as shown in *[Figure
    6.15](#c06.xhtml#fig6_15)*.


    ![](images/Figure-6.15.jpg)'
