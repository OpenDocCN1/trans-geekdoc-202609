  trans: "\n\n- **基于角色的访问控制**：当单个地址被注册为智能合约的 `Owner` 时，就会发生单点故障，这增加了中心化风险，并成为一个可用作攻击向量的漏洞。\n\
    \n在基于角色的访问管理下，一组已知的人员获得访问不同私有函数的权限。例如，一个账户可能负责发行代币，而另一个账户可能负责升级或停止合约。通过这种方式降低访问控制的中心化程度，降低了客户对信任的预期，并消除了单点故障。\n\
    \n- **多签名**：通过多签名（multi-sig），账户由多个实体拥有，并且需要最小数量账户的签名才能执行交易。由于对目标合约采取任何行动之前多方必须达成一致，因此使用多签名进行访问控制增加了一层安全性。由于这增加了攻击者或违规内部人员为了恶意目的操纵敏感合约函数的难度，因此在需要使用\
    \ `Ownable` 模式时，这特别有帮助。\n\n# 测试与审计\n\n由于在 `Ethereum Virtual Machine` 中执行的代码具有不可变性，智能合约在整个开发过程中需要更严谨的质量评估。如果你彻底测试了合约并关注任何意外结果，长期的安全性将得到极大增强，你的用户也将获得保护。\n\
    \n建议在测试完合约后，请他人审查源代码以发现潜在的安全漏洞。虽然测试无法发现智能合约中的每一个 错误，但获取外部意见可以增加发现安全漏洞的概率。\n\n\
    仅对代码进行单元测试和回归测试是不够的。更有效的策略是将基于属性测试（property-based testing）与单元测试相结合，并通过静态和动态分析来实现。静态分析使用控制流图和抽象语法树等底层表示来检查可达程序状态和执行路径。动态分析方法（如模糊测试\
    \ fuzzing）使用随机输入值执行合约代码，以寻找违背安全原则的操作。\n\n- **漏洞赏金** \n\n另一种实用方法是建立赏金计划，这是实现外部代码审查另一种方法。赏金是给予发现应用程序漏洞的个人（通常是白帽黑客）的财务奖励。\n\
    \n如果实施有效，赏金将为黑客社区提供激励，使其审查你的代码是否存在严重问题。运行以太坊上的 Layer 2 协议 `Optimism` 上的“无限钱漏洞”（`infinite\
    \ money bug`）就是一个真实的案例。它允许攻击者生成无限供应的 Ether。幸运的是，一位白帽黑客发现了漏洞并警告了团队，在此过程中获得了巨额奖金。\n\
    \n将赏金计划的奖励与风险金额成正比是一个明智之举。这种策略被称为 `扩展漏洞赏金`（scaling bug bounty），提供现金激励人们正确报告漏洞而非滥用它们。我将在\
    \ `第 5 章，区块链应用审计` 中更详细地讨论这个主题。\n\n- **智能合约漏洞（SWC）注册表**\n\n`EIP-1470` 中描述的漏洞分类系统实现在智能合约漏洞分类注册表（SWC\
    \ registry）中。\n\n## 注意\n\n*太坊字节码中有多个操作码，它是用汇编语言编写的。在太坊区块链上，每个操作码执行特定的功能。以太坊虚拟机将智能合约功能编译为底层语言字节码以执行操作，而开发者使用\
    \ Solidity 等高级语言来构建它们。*\n\n从图中可以看出，智能合约漏洞随着时间的推移而减少。它展示了智能合约安全性在均值和方差方面的三个阶段。在初始阶段较高，但在\
    \ 2017 年 4 月之后，智能合约变得稳固了。\n\n![](img/Figure-2.18.jpg)\n\n**图 2.18：** SWCs 随时间的分析\n\
    \n建议通过所有 SWCs 扫描你的智能合约，并使用以下测试用例确保合约已经加固。从 `[`swcregistry.io/`](https://swcregistry.io/)`\
    \ 提取的下表是你以太坊安全之旅的良好起点。\n\n![](img/Figure-2.19.jpg)\n\n**图 2.19：** SWC 注册表\n\n\
    与太坊安全测试和审计相关的一些资源如下。\n\n`[`ethereum.org/en/developers/docs/smart-contracts/testing/#testing-tools-and-libraries`](https://ethereum.org/en/developers/docs/smart-contracts/testing/#testing-tools-and-libraries)`。\n\
    \n# Hyperledger fabric (#toc.xhtml#s42a)\n\nHyperledger Fabric 是一个许可的、开源的企业级分布式账本技术（DLT）平台，专为业务环境设计，提供了几个使其与其他流行的\
    \ DLT 平台区分来的关键能力。\n\nFabric 的架构高度模块化且可配置，允许针对广泛的行业用例（如供应链、医疗保健、人力资源甚至数字音乐传输）进行创新、适应和优化。\n\
    \nFabric 是第一个支持使用 `Java`、`Go` 和 `Node.js` 等通用编程语言编写智能合约的分布式账本平台，而不是受限的领域特定语言（DSL）。这意味着大多数企业在开发智能合约时不需要额外培训来学习新语言或\
    \ DSL。\n\n此外，Fabric 平台是许可的，这意味着与公共无许可网络相比，参与者之间是彼此互知的，而不是完全不可信的。这意味着网络可以基于参与者之间存在的信任模型（例如法律协议或处理争议的框架）进行运行，尽管参与者之间可能并不完全信任对方（例如，他们可能是同一行业内的竞争对手）。\n\
    \n平台对可插拔共识协议的支持是其显著的差异点之一，这使得根据特定的用例和信任模型定制平台变得更容易。例如，在单一公司内部或在信誉良好的机构指导下实施时，完全拜庭容错共识可能被认为是不必要的且对性能和吞吐量有害的。在这种情况下，崩溃故障容错（CFT）共识协议可能足够，而在多方、去中心化的用例中，可能需要更传统的拜庭容错（BFT）共识协议。\n\
    \nFabric 可以不需要原生加密货币即可鼓励昂贵的挖矿或驱动智能合约执行的共识协议。由于缺少加密挖矿操作，该平台的部署成本与任何其他分布式系统的运行成本大致相同。避免加密货币还减少了一些重大风险和攻击向量。\n\
    \n得益于这些独特设计特征的结合，Fabric 在交易处理和确认延迟方面是目前可用性能平台之一。此外，Fabric 使得维护交易的隐私和机密性，以及执行交易的智能合约（Fabric\
    \ 将其称为“链代码”）成为可能。\n\n**以下是 fabric 的架构组件：**\n\n"
