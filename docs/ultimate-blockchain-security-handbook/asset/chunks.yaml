    图 6.15：以太坊黄皮书 – 拜占庭版本


    # 以太坊日志记录中的主题与数据


    在日志记录的第一部分，包含几个不同的主题（topics）。这些内容被用于解释发生了什么。发生事件名称的签名（一个 `keccak256` 哈希值）以及其输入的类型（`uint256`、`string`
    等）通常是第一个关注点。


    请注意，此签名并不总是第一个主题。当发送未命名的事件时，它就不是第一个主题。


    由于主题（topics）只能包含最多 32 字节的信息，因此它们不能用于存储数据组或单词。相反，它们应该作为信息作为日志记录的一部分，而不是作为主题。


    在日志记录的第二部分，有更多信息。主题（topics）和事实（facts）结合使用效果最好，因为它们各有优缺点。例如，你可以查找想法，但不能查找数据。另一方面，添加事实比添加主题要便宜得多。主题也被限制
    4 * 32 字节，但事件数据并非如此。这意味着事件数据可以包含大型或复杂的数据，如列表或字符串。因此，如果有事件数据，可以被视为值（value）。


    # 以太坊日志的存储


    当智能合约发送事件时，随之产生的日志数据会被记录并保留在交易报告中。每笔交易都有一个收据（receipt），显示操作的结果，例如状态和事件日志。此外，交易日志还包含了使用的
    gas 消耗量。让我们通过查看两个主要用例来进一步了解。


    *   **带数据的异步触发**：在构建 daps 和其他 Web3 平台时，你通常会设置项目，使其监控相关的以太坊智能合约事件。这些事件日志允许智能合约与
    Dapp 的前端进行交互。

    *   **智能合约返回值**：这是为了将合约的返回值传递给 Dapp 前端，这将实现对你的区块链应用程序流程流的监控。


    以下示例将帮助你理解主题、数据和日志记录是如何协同工作的。


    遵循 `ERC20` 的代币合约使用 `Transfer` 事件，这也是该合约使用的事件：


    ![](img/Figure-6.16.jpg)


    图 6.16：显示事件的 Transfer 函数合约


    由于这不是匿名事件，第一个主题将包含事件签名：


    ![](img/Figure-6.17.jpg)


    图 6.17：第一个主题分析


    让我们看看这个 Solidity 事件的参数（`from`、`to`、`value`）：


    ![](img/Figure-6.18.jpg)


    图 6.18：Solidity 事件矩阵


    由于前两个参数被声明为索引（indexed），因此它们被视为额外的主题。最后一个参数将不会索引，这意味着它将作为数据而不是不同的主题附加。因此，我们可以搜索如“查找从地址
    `0x0000…` 到地址 `0x0000` 的所有 Transfer 日志”或“查找到地址 `0x0000` 的所有日志”，但无法搜索“值为 `x` 的所有
    Transfer 日志”。我们知道此事件将三个项目，因此将使用 `LOG3` 操作码来记录。


    ![](img/Figure-6.19.jpg)


    图 6.19：LOG3 分析


    ```

    `LOG3(memoryStart, memoryLength, topic1, topic2, topic3)`

    ```


