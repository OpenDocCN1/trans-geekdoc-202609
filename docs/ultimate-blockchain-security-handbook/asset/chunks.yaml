  trans: "\n\n你可以使用带有私有区块链的本地部署模型来存储数据。在这种场景下，可以采取数据机密性、完整性、可用性和不可否赖性等传统安全措施。数据只有那些同意保持私密的参与者才能访问。完整性意味着信息在传输过程中不应被篡改。与冗余类似，可用性要求每台处理消息的计算机都要有备份。最后，不可否赖原则使得网络访问日志监控成为可能，该原则指出，如果有人发现你正在做错事，你就无法否认。\n\
    \n## 云部署\n\n另一方面，你可以决定在云管理上运行你的私有区块链网络。然而，请记住，你仍然对云端数据发生的任何事情负责；因此，你必须确保已建立服务水平协议和安全控制。\n\
    \n## 治理\n\n治理可能会影响基于分布式账本技术（DLT）实现的架构选择，固定架构可能会限制可用的治理模型。简而言之，治理涉及权限、决策权和对良好行为的奖励。例如，谁是系统的一部分是由治理模型决定的。私有区块链可能具有许可环境，并需要一个层级结构来定义参与者角色。设计挑战在于如何通过治理结构有效地管理安全，这种结构很可能由企业并在公共利益者的参与下管理，因为这种复杂性具有引入额外漏洞的潜力。\n\
    \n角色和权限由治理模型定义，但在 DLT 中使用共识来做出决策，特别是在确定交易的最终性时。治理模型决定哪些节点参与共识过程，随着节点数量的增加，系统的通信复杂性随之增加。此外，利用未由组织直接控制的节点（例如第三方供应商）会增加系统的攻击面和达到最终所需的时间，从而对吞吐量产生影响。\n\
    \n系统架构应在私有区块链中明确定义安全治理的边界，明确的角色、权限和许可范围也应是如此。有必要以这种方式应用安全框架，使治理模型能够充分解决权限和责任。治理在运营阶段也至关重要，此时系统必须快速分发代码更新、漏洞补丁和其他系统更改。此外，事件报告和系统维护等任务可能需要系统参与者之间的协调以确保安全。如果结构是去中心化的，参与实体将需要明确传达他们对遵守安全要求的预期。\n\
    \n## 密钥管理\n\n当前的 DLT 版本严重依赖于使用公钥加密来验证和签名交易，并在某些情况下用于保护区块。这种公钥加密的使用在用户可能更熟悉生物识别或密码启用安全功能的场景中带来了易用性问题。为了解决可用性挑战，密钥管理托管人在加密货币领域应运而生。作为区块链系统之外的第三方，托管人构成了具有吸引力的攻击目标，并已被证明是许多加密货币的关键漏洞点，应对其进行彻底的评估。\n\
    \n*   使用裸机硬件安全模块（HSM）作为保险箱，实施严格的访问控制，并使用信加密（envelope encryption）强制轮密钥。这意味着保险箱内的密钥使用二级密钥加密。\n\
    *   密钥通过密钥仪式（key ceremony）过程生成，该过程具有传输数据安全标准，其余部分已实现。\n*   确保保险箱的备份和系统恢复能力的测试。\n\
    \n## 结论\n\n恭喜你！你已经来到了本章的最后。我们涵盖了许多重要信息。考虑到我们涵盖的内容，这可能看起来精疲力竭，但请相信，一旦你将这些知识应用到组织中，你就会把它们联系起来。\n\
    \n我们从区块链类型的讨论开始本章，通过向你展示它们的差异，让你确切知道选择哪一个而不是另一个。然后我们开始介绍以太坊区块链，我们详细解释了其基础知识和架构，以便我们在回顾漏洞时你能将其联系起来。由于以太坊是区块链应用的核心，对其进行深入介绍是非常重要的。在本章的后半部分，我们将重点转移到私有区块链，我们涵盖了\
    \ Hyperledger Fabric，展示了其组件以及存在哪些漏洞，并在解释公链和私有链的同时涵盖了安全考量。现在有了这些知识，你将对安全如何在不同区块链类型之间变化充满信心，并知道如何安全地构建解决方案，无论你遇到什么种用例。\n\
    \n## 记忆点\n\n*   并非每个区块链平台都是相同的。差异取决于谁可以读写写数据。\n*   区块链平台的选择取决于用例，取决于它是否支持交易速度、数据隐私和成本。\n\
    *   以太坊区块链是构建 dApps 的理想平台，由于其在金融（去中心化金融，或 DeFi）、艺术和收藏品（非同化代币，或 NFT）、游戏和技术等领域的日益普及，拥有庞大的生态系统。\n\
    *   以太坊的脆弱区域包括共识层、智能合约漏洞、交易隐私、合约调用以及如 Metamask 和钱包之类的客户端终端。\n*   Hyperledger Fabric\
    \ 是最流行的企业解决方案，全球前 100 家公司中有 38% 实现了它，包括微软、亚马逊、Alphabet 和 Visa，它也是 CBDC 项目的首选平台。\n\
    *   HL Fabric 的漏洞包括成员服务提供商、验证节点、代码漏洞、密钥管理系统、防止 DOS 攻击、中心化和可用性攻击，这些都需要考虑。\n\n##\
    \ 参考文献\n\n*   `https://ethereum.org/`\n*   `https://swcreistry.io/`\n*   `https://www.cvedetails.com/vulnerability-list/vendor_id-17524/Ethereum.html`\n\
    *   `https://www.hyperledger.org/`\n\n## 单选题\n\n1. **SWC 代表什么？**\n   1. 智能合约缺陷分类\
    \ (Smart Contract Weakness Classification)\n   2. 智能合约缺陷类\n   3. 智能通道缺陷分类 (Smart\
    \ channel Weakness Classification)\n   4. 以上所有\n\n2. **EVM 包含什么？**\n   1. Gas\n\
    \   2. 字节码 (Bytecode)\n   3. 内存 (Memory)\n   4. 程序计数器 (Program Counter)\n   5.\
    \ 以上所有\n\n3. 以下哪项是以太坊中外部拥有账户（externally owned accounts）的示例？\n   1.它们由私钥控制且没有与之关联的代码\n\
    \   2.它们由公钥控制并与之关联的代码\n   3 它们由公钥控制且没有与之关联的代码\n   4. 以上所有\n\n4. **防止重入攻击（Re-entrancy\
    \ Attack）的方法是什么？**\n   1. 在编写智能合约时使用“检查-影响-交互”（checks-effects-interactions）设计\n\
    \n"
