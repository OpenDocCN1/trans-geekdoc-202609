    # Ethereum Overview


    Before going into its security posture, let us take a moment to review Ethereum.


    ## Introduction to Ethereum


    Let us start with the basics. What is Ethereum, how is it different from Bitcoin,
    and what does the architecture look like? These are all important questions to
    unfold, before going into deep dive, reviewing the security posture, and then
    finding ways to exploit and finally secure it.


    This also comes under the public blockchain category. You must be wondering why
    we didn’t discuss it in [Chapter 1, Blockchain Security Overview]. One reason
    is that its architecture is a bit different from the Bitcoin blockchain, in way
    that it involves smart contact and enables the creation of decentralized application,
    which can be tuned for a private blockchain as well, so I wanted to open it up
    after we discussed different types of blockchain, so you don’t get confused. Let’s
    start.


    Ethereum is a decentralized technology that can be used to build apps and organizations,
    hold assets, conduct business, and communicate. Ethereum lets you keep control
    of your own data and what is shared, so you do not have to hand over all of your
    personal information. `Ether`, Ethereum''s own cryptocurrency, is used to pay
    for certain network-based activities.


    ## Difference between Ethereum and Bitcoin


    Both are public blockchains, which let you use digital money to send without involving
    centralized payment providers or banks. But Ethereum is programmable, meaning
    you can build applications on top of its network. Being decentralized, the applications
    are known as decentralized applications.


    Ethereum is more like a marketplace for financial services, games, social networks,
    and other apps that respect your privacy and cannot censor you than Bitcoin is
    just a payment network.


    The native cryptocurrency of Ethereum is called `Ether` (`ETH`). It can be sent
    instantly to anyone in the world because it is entirely digital. Decentralized
    and transparent, the supply of `ETH` is not controlled by any government or business.
    Only validators (like miners in the POW consensus mechanism), who have staked
    their coins, and who work to protect the network receive new coins, which are
    also referred to as tokens.


    On the Ethereum network, a certain amount of computational power is required for
    each action. The payment for this service is made in `ether`. This means that
    to use the network, you need at least a small amount of `ETH`.


    ## Working of Ethereum

