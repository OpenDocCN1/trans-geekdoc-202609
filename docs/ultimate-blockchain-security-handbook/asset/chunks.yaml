    其次，报告的其他部分应该向我们介绍发现的漏洞。`图 4.11` 显示了发现漏洞报告的示例快照。


    漏洞的细节必须包含影响、CVSS 分数以及建议的修复方案。还建议显示漏洞影响是否会影响关键性能指标，例如客户体验、增加 CPU 使用、内存利用率等。


    另一方面，建议的修复方案应包含直接控制和补偿性控制的结合。在某些情况下，如果直接安全控制成本高昂且组织愿意接受风险，那么补偿性控制可能会很有用。


    ![](img/Figure-4.11.jpg)


    **图 4.11：**缺失 API 安全标头的漏洞详情


    你可以在此处找到详细的示例报告 - [`www.getastra.com/blog/wp-content/uploads/2021/06/Astra-Security-Sample-VAPT-Report.pdf`](https://www.getastra.com/blog/wp-content/uploads/2021/06/Astra-Security-Sample-VAPT-Report.pdf)


    # 修复


    在最后阶段，你将对报告提出的修复措施采取行动。最佳实践是使用变更管理窗口来应用更改。更改必须通过操作程序（MOP）实施。这应该包含预检查、活动详情、回滚程序以及功能测试、单元测试和回归测试的结合，以确保修复在应用时不会对系统产生任何问题。


    # 攻击智能合约](#toc.xhtml#s78a)


    在本节中，我们将尝试解释如何使用 PWNX Labs 攻击智能合约。我们将查看溢出和下溢漏洞以及相应的修复措施。


    PWNX 提供了用于训练的计算机系统和应用程序 CTF 实验室。


    # 实验环境搭建](#toc.xhtml#s79a)


    使用 VPN 尝试连接到 PWNX 的内部网络，那里有一个服务器通过 Ganache 暴露本地区块链。


    请注意，Ganache 是一个用于快速开发以太坊和其他区块链的个人区块链。你可以在整个区块链开发周期中使用 Ganache，在安全的沙箱环境中开发、部署和测试你的去中心化应用程序
    (dApps)。


    `图 4.12` 仅显示了你需要执行的设置。你可以在笔记本电脑上安装 OVPN，并通过访问 PWNX 网站设置下载 VPN 配置。


    要安装 Ganache，请访问 [`trufflesuite.com/docs/ganache/`](https://trufflesuite.com/docs/ganache/)。


    ![](img/Figure-4.12.jpg)


    **图 4.12：**本地终端到 PWNX 内部网络的连接图


    # 查看源码](#toc.xhtml#s80a)


    当你进入实验室并连接到内部网络时，会有一些数据和代码。在左侧，你会看到用 Solidity 编写的智能合约代码，它解释了合约逻辑。右侧可以找到 ABI 代码，如`图
    4.13`所示。


    ![](img/Figure-4.13.jpg)


    **图 4.13：** 合约代码与 ABI 的比较


    在以太坊生态系统中，与合约交互的最常见方式（包括区块链外部以及合约之间）是通过应用二进制接口 (ABI)。


    请记住，目标是获取以下智能合约的所有权。


    你应该有一个钱包地址、一个用于签名的私钥以及明智协议（Agreement）的位置。


    作为第一步，从在本地拆解智能合约代码开始。我们可以借助 REMIX IDE 在本地系统上编译并测试合约。


    Remix Online IDE 是一个强大的工具集，用于开发、部署、调试和测试以太坊及与 EVM 的智能合约。它不需要任何设置，并且具有灵活、直观的用户界面。


    solidity 代码 `PWNX.SOL` 可以复制到 Remix IDE 中。这是一个漏洞合约，由不同的函数组成，如`图 4.14`所示。在进入漏洞利用阶段之前，我们将解释以下合约的细节。


    ![](img/Figure-4.14.jpg)


    **图 4.14：** 漏洞智能合约


    注意，一旦智能合约部署在区块链上，构造函数就会被调用，分配给合约的地址将成为合约的所有者（所有权操作）。


    以下是细节：


    *   当调用构造函数时，会设置类型为 `address` 的私有变量，即 `owner`。

    *   在合约中有一个名为 `balances` 的映射。Solidity 中的 mapping 类似于字典或 HashMap（类似于 Java）。

    *   在我们的场景中，该映射是一个地址数据库，记录了每个地址拥有的 ether 或代币数量。

    *   两个较短的函数 `getOwner` 和 `getBalance` 对公可见。它们不会影响区块链状态；`getBalance` 返回用户在映射数据结构中拥有的
    ether 或代币数量，仅返回数据。我们可以在 Solidity 中使用 `msg.sender` 来实现这一点。

    *   事务的全局变量 `msg` 可以在你的 Solidity 代码中找到。`msg` 对象的源是消息的实际发送者。


    # 漏洞解释


    现在，让我们理解下部分的漏洞：


    *   需要一个 `uint` 类型（无符号整数值）以及一个返回布尔值的公共函数。

    *   第 16 行包含必要的语句。命令返回两个布尔值：真或假。如果指示条件产生真响应，代码将按预期执行。如果返回值为假，代码在该处结束。

    *   为了满足条件，地址必须大于或等于 20 且小于 100。

    *   第 24 行有一个第二个 if 语句，用于确定所有者的账户余额是否低于交易者 `msg.sender` 的账户余额。


    第 18 行检查映射数据结构内部 `msg.sender` 的余额，这意味着如果交易地址在映射数据结构中的余额为 0，它将加上要传输的金额并减去 20。否则，它将扣除插入函数的金额并加上
    20。


    注意，这是智能合约中经典的溢出/下溢漏洞示例，如`图 4.15`所示。


    ![](img/Figure-4.15.jpg)


    **图 4.15：** 溢出与下溢漏洞快照


    `uint` 下溢/溢出是智能合约中最常见的安全漏洞之一。下溢溢问题很容易让加密黑客变得富有，并导致持有者账户遭受巨大损失。


    `uint` 溢出/下溢也称为 `uint` 回绕（wrapping around），是一种产生大于 N 位整数最大值的输出，或产生小于 N 位整数最小结果的数学操作。


    ![](img/Figure-4.16.jpg)


    **图 4.16：** 下溢逻辑运算视图


    `图 4.15` 展示了一个很好的下溢示例。如果你从一个值为 0 的 `uint` 减去 2，它的值将变为 $2^{256}-2$。

