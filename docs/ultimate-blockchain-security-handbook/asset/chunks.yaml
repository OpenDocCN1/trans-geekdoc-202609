- raw: "Everywhere you look in the news, there will be headlines about blockchain,\
    \ usually about cryptocurrencies rising or falling. However, the what, why, and\
    \ how of blockchain can quickly become confusing if you read beyond the headlines.\
    \ Imagine a Super Mario LEGO game, where to complete the structure, you need to\
    \ fit the pieces in a specified order, following the rules of the manual.\n\n\
    I'll walk you through the fundamentals of how blockchain technology works on this\
    \ topic by giving you a heads-up and then explaining the pieces through the analogy.\
    \ Why is this important? As they say, if you want to protect your house, you have\
    \ to know the functions inside your house, such as the entry and exit, the safe\
    \ location, etc. You can put the right locks on the right door, if you know the\
    \ fundamentals, your foundation will be built, which will support your future\
    \ learning.\n\nBlockchain is a database made up of chunks of data. Each chunk\
    \ of data is piled up into a block. As additional chunks of related data are added,\
    \ they are piled into new blocks and linked to the previous ones to create a chain.\
    \ How does it sound, easy right? Let's visualize this.\n\nConsider a row of three\
    \ interconnected boxes. Inside these boxes are the plans for the office improvement\
    \ project you're currently working on. The plans for your cafeteria are in the\
    \ first box, those for your conference room are in the second box, and those for\
    \ your employee cabins are in the third box.\n\nBlockchain technology keeps blueprints\
    \ secure by assigning each block a unique alphanumeric code related to the data\
    \ inside. This code is known as a hash. The hash for each block is linked to the\
    \ hash of the next block in the chain. So, the box of your cafeteria blueprints\
    \ is labeled with the hash 01CAFE, then the box of your Conference room blueprints\
    \ gets both the hashes 01CAFE and 02CONF, and finally, the box of your employee\
    \ cabin blueprints is assigned the hashes 02CONF and 03CABIN.\n\nYou employ a\
    \ group of skilled craftspeople to carry out the work on your Office improvement\
    \ project to guarantee its success. You don't hire a contractor to supervise them\
    \ on purpose because you want everyone working in your home to be treated equally.\
    \ A carpenter with an axe to grind ruining the wood in your cafeteria and preventing\
    \ the plumber and electrician from doing their jobs is an example of how decentralizing\
    \ the workers' power prevents any one worker from ruining the entire project.\
    \ Having multiple artisans with shared responsibilities enables everyone to stay\
    \ on task and under control.\n\nThese construction professionals are known as\
    \ the miners or participants in your network, with each one first looking to make\
    \ sure the hashes labeled on the boxes correspond to the blueprints inside. So,\
    \ if the craftspeople peek into box 01CAFE and see the Cafeteria blueprints, they’d\
    \ validate the block and use it to start the chain. Since this is the first block,\
    \ it is called a Genesis block. Then they’d repeat the process for boxes 02CONF\
    \ and 03CABIN, checking that they have the Conference room and Cabin area blueprints,\
    \ respectively.\n\n**Note**\n\n*What do you think would be in the blueprint? If\
    \ you are thinking that the blueprints are validation rules, or in the blockchain\
    \ language, mining rules, or simply how blocks need to be mined, you are absolutely\
    \ right. I will add more light to it later in the chapter.*\n\nAfter they’re validated,\
    \ these hashes become the glue that binds the boxes together. Your blueprints,\
    \ or data, are secure because if someone tampered with the contents of any single\
    \ box from the chain, the hashes would change and the boxes would no longer be\
    \ glued together. This would cause the whole blockchain to fall apart, and your\
    \ office improvement project plans would become an indecipherable pile of rubble.\n\
    \nTo help make the home improvement process smoother, you can add an automated\
    \ feature to the project's workflow. Along with the blueprints in the boxes, there’s\
    \ also a contract that specifies when and how the craftspeople get paid. For example,\
    \ in box 01CAFE with the data for the CAFE, the contract states that *If carpenter\
    \ builds counters and plumber installs sink and electrician adds lights, then\
    \ each worker gets a direct deposit as payment in their bank accounts*. This is\
    \ a smart contract, in this case, services were exchanged for money, with a digital\
    \ bank or computer handling the whole transaction. It helps keep your OFFICE improvement\
    \ project moving forward because the craftspeople don’t have to wait for you to\
    \ hand them cash after they complete their work.\n\n*Highlight the terms Decentralization,\
    \ miners, Smart contract, Hashes, and of course immutability (block is linked)\
    \ in the preceding context.*\n\nIt is merely an illustration of blockchain in\
    \ its physical form. However, blockchains in the real world are only digital,\
    \ so allow me to demonstrate how this might actually function with a Bitcoin transaction.\n\
    \nSay John sends 10 Bitcoins to their friend Tina. First, a block is created containing\
    \ a record of the transaction and is assigned a unique hash. While Bitcoin hashes\
    \ are actually 256 alphanumeric characters long, for simplicity’s sake, let us\
    \ say this transaction’s hash is JOHN2TINA10.\n\nNext, the record is checked by\
    \ the network. The computers owned by the workers in the network – the participants\
    \ or miners – inspect the details of the trade to make sure it is valid. For example,\
    \ they’d make sure that John wasn’t also sending the same 10 Bitcoins to someone\
    \ else at the same time. Is the transaction signed by John's private key, the\
    \ math game AKA Proof of Work?\n\n*Don’t worry; I will come back to the private\
    \ key and math game AKA proof of work part later. For now, just consider it as\
    \ part of the blueprint process.*\n\nAfter the record is accepted, the block is\
    \ finally added to the blockchain. The hashcode of a previous transaction – ALX2JOHN10\
    \ – from when Alex sent 10 Bitcoin to JOHN would be added to and referenced in\
    \ this one, connecting the blocks together in a specific order. This provides\
    \ security because if someone tries to change the record of the transactions within\
    \ the blocks, they would cause the whole chain to fall apart.\n\nNow that you\
    \ can visualize the fundamental parts of a blockchain, keep this picture in mind\
    \ the next time you read about this novel technology in the news.\n\n# [Blockchain\
    \ security overview](#toc.xhtml#s4a)\n\nIs the blockchain actually safe? How can\
    \ millions of people trust a technology with their hard-earned money, without\
    \ knowing its creator, without anybody controlling the governance like in a traditional\
    \ organization? What has made it so trustworthy that even countries are adopting\
    \ it as a legal tender for their public?\n\nLet’s dissect it by getting to know\
    \ the security features it relies on. Blockchain security principles like immutability,\
    \ decentralization, cryptography, and consensus algorithms have been discussed,\
    \ but how do they actually operate and where do they apply? You need to acquire\
    \ a solid understanding of such security principles to conduct a thorough investigation\
    \ into its security, identify areas where vulnerabilities exist, and determine\
    \ the additional layers you can employ to strengthen it.\n\nA process known as\
    \ *minting or mining* a new block of data adds new transactions to the blockchain.\
    \ A few characteristics are shared by all block-minting systems. Let us first\
    \ learn about the security concept, and then see how it applies to blockchain.\n\
    \nEvery security attack, control, and mitigation revolves around these basic security\
    \ principles.\n\n*   **Confidentiality**: The protection of data from unauthorized\
    \ access and disclosure, as well as methods for safeguarding personal privacy\
    \ and proprietary information, is referred to as data confidentiality.\n\n   \
    \ **Example:** Any data that does not contain any information must be disclosed.\
    \ It can be phone numbers, names, email addresses, company records, financial\
    \ transactions, and so on."
