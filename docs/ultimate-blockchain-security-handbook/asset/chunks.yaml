    既然你已经详细了解了案例研究，并查看了几个漏洞的缓解措施，让我们进一步深入了解更多的智能合约漏洞吧。


    # 智能合约攻击向量分析


    Solidity 的安全缺陷源于智能合约的操作未按照其预期的行为运行。其结果可能如下：


    * 资金被盗

    * 资金被锁定或冻结在合约内部

    * 人收到的奖励比预期少（奖励延迟或减少）

    * 人收到的奖励比预期多（导致通货膨胀和贬值）


    我将尝试涵盖大部分漏洞，尽管这些列表并没有涵盖 Solidity 拥有的我遇到过的每一个 bug。不过，它可以作为一个需要留心和学习的事项检查清单。如果某个主题看起来很陌生，这说明练习识别该类别的漏洞是值得的。


    作为一个前提，我假设你对 Solidity 有了相当不错的熟练程度。在 `[`www.rareskills.io/learn-solidity`](https://www.rareskills.io/learn-solidity)`
    有一个非常好的教程可以参考。


    # 重入攻击 (Re-entrancy)


    在重入攻击中，攻击者调用一个与另一个合约交互的函数，然后在第一个函数调用完成之前立即再次调用该函数。这可以利用合约逻辑中的缺陷，并允许攻击者操纵合约状态，造成重大损害。


    每当智能合约调用另一个智能合约的函数、向其发送 Ether 或向其传输代币时，就存在重入的可能性。


    * 当传输 Ether 时，会调用接收方合约的 `fallback` 或 `receive` 函数。这会将控制权移交给接收者。

    * 某些代币协议通过调用预定义的函数来通知接收方智能合约它们已收到了代币。这会将控制流移交给该函数。

    * 当攻击合约接收到控制权时，它不需要调用交出控制权的同一个函数。它可以调用受害者智能合约中的另一个函数（跨函数重入），甚至调用另一个不同的合约（跨合约重入）。

    * 只读重入（Read-only re-entrancy）发生在当合约处于中间状态时访问了 `view` 函数的情况。


    *真实世界示例：DAO 黑客攻击：攻击者利用以的 fallback 函数执行重入。每个以太智能合约字节码都包含所谓的默认 fallback 函数。更多细节可以在
    `[`quantstamp.com/blog/what-is-a-re-entrancy-attack`](https://quantstamp.com/blog/what-is-a-re-entrancy-attack)`
    中找到。


    *更多此类攻击可以在 `[`github.com/pcaversaccio/reentrancy-attacks`](https://github.com/pcaversaccio/reentrancy-attacks)`
    中找到。*


    *在哪里找到重入攻击：截至 2023 年 4 月，该仓库中记录了 46 处重入攻击。更多细节可以在 `[`www.rareskills.io/post/where-to-find-solidity-reentrancy-attacks`](https://www.rareskills.io/post/where-to-find-solidity-reentrancy-attacks)`
    中找到。*


    如果开发者覆盖了默认实现，此默认 fallback 函数将包含任意代码。如果它被重写为 `payable`，则智能合约就可以接受 ether。每当 ether
    传输到合约时，该函数就会执行。


    *[图 4.25]* 为重入攻击的流程提供了一个很好的示例。


    ![](img/Figure-4.26.jpg)


    **图 4.26：** DAO 攻击示意图


    ## 预防


    以下是编写智能合约代码时遵循的最佳实践，以防止重入攻击的发生。


    ### 简单性与代码复用

    简单的代码可以减少代码遇到 bug 的概率，并有助于防止意外的影响。保持代码基础且无瑕疵，遵循 DRY（不要重复）准则。浏览精妙的协议代码，并尝试用更少的代码行寻找简化它的方法。这将有助于你找到代码中任何存在漏洞的部分。


    ### 检查-影响-交互模式 (CEI)

    这个示例是防止智能合约代码中发生重入攻击的一种强有力方法。合约流程中的检查和验证是使用此模式的第一步。在与另一个合约交互之前，应该先对当前合约的状态变量进行更改。


    ### 设置 gas 限制 (gas limit)

    使用 `send()` 和 `transfer()` 函数会将交易中可以使用的 gas 限制设置为 2300 个。这有助于防止重入攻击的发生，因为没有足够的
    gas 来递归地调用漏洞函数来掠取资金。


    ### 互斥锁/重入锁 (Mutex/re-entrancy guard)

    OpenZeppelin 有一个重入锁库。重入锁提供了一个名为 `nonReentrant()` 的修饰符，它可以阻止其应用于函数中的重入攻击。以下是它的应用代码。


    ![](img/Figure-4.27.jpg)


    **图 4.27：** 重入合约代码


    ## 检查第 7 行和第 8 行：


    * 创建布尔尔 `locked` 并将其设为私有（private）。

    * 创建 `nonReentrant()` 修饰符，在单次传输后锁定 `withdraw()` 函数。


    当我们将 `nonReentrant()` 修饰符应用于之前提到的 `withdraw()` 函数时，它防止了重入。这是因为所需的语句将等于 `false`
    并回滚交易（revert）。


    # 访问控制 (Access Control)


    这看起来可能是一个简单的错误，但忘记限制谁可以调用敏感函数（例如更改所有权或提取）是非常常见的。


    即使有了修饰符，也出现过修饰符使用不当的情况，例如下面示例中缺少 `require` 语句：


    ![](img/Figure-4.28.jpg)


    **图 4.28：** 访问控制漏洞 #1


    此前的代码是此审计中的真实示例：`[`coderena.com/reports/2023-01-rabbithole/h-01-bad-implementation-in-minter-access-control-for-rabbitholereceipt-and-rabbithole-contracts`](https://coderena.com/reports/2023-01-rabbithole/h-01-bad-implementation-in-minter-access-control-for-rabbitholereceipt-and-rabbithole-contracts)`
    **这是另一种访问控制出错的方式：**


    ![](img/Figure-4.29.jpg)


    **图 4.29：** 访问控制漏洞 #2


    在这种情况下，`alreadyClaimed` 从未设置为 `true`，所以领取者可以多次调用该函数。


    # 真实案例：交易机器人被利用


    最近的一个访问控制不足的示例是交易机器人未受保护的闪电接收函数（该机器人以 0xbad 命名，因为地址以该序列开头）。它赚取了超过一百万美元的利润，直到某天攻击者发现任何地址都可以调用闪电贷接收函数，而不仅仅是闪电贷供应商。


    更多细节请访问 `[`rekt.news/ripmevbot/`](https://rekt.news/ripmevbot/)`。


    # 输入验证不当 (Improper Input Validation)


    如果说访问控制是控制谁调用函数，那么输入验证就是控制他们用什么来调用合约。


    这通常归于忘记放置正确的 `require` 语句。

