- raw: '*   **Network Layer:** The network layer of Ethereum is responsible for managing
    the peer-to-peer network of nodes that make up the Ethereum network. It allows
    nodes to communicate and share information with each other and is crucial for
    ensuring that the blockchain is secure and operates smoothly.


    To break it down, it comprises the following:


    *   **Peers**: The Ethereum network is made up of nodes, also known as "peers".
    These nodes run Ethereum software and are connected to each other via the internet.


    *   **Communication**: Nodes on the network communicate with each other using
    the Ethereum Wire Protocol, which is a peer-to-peer networking protocol that allows
    nodes to send and receive messages.


    *   **Discovery:** Nodes can discover other nodes on the network through a process
    known as "node discovery". This involves sending messages to other nodes to find
    out information about their peers, such as their IP address and port number.


    *   **Synchronization**: Nodes on the network synchronize with each other to ensure
    that they have the latest copy of the blockchain. This is done through a process
    known as "blockchain synchronization", which involves downloading and verifying
    each block.


    *   **Consensus**: Nodes on the network work together to reach a consensus on
    the current state of the blockchain. This is achieved through the consensus layer,
    which has been transitioned from Proof of Work (PoW) to Proof of Stake (PoS) to
    validate transactions and create new blocks.


    *   **Incentives**: Nodes on the network are incentivized to participate in the
    network by earning transaction fees and block rewards. This helps to ensure that
    the network is secure and that there are enough nodes participating to prevent
    centralization.


    # [Ethereum security review](#toc.xhtml#s38a)


    Now that you have understood the fundamentals, Ethereum architecture and different
    layers, now we are in a position to review the Security posture. Before we go
    any further, take a look at the following picture, it shows the attack history
    on the Ethereum blockchain, one thing which is evident by examining the following
    figure, most exploits are done on the application layer, which includes EVM and
    smart contracts, exploiting code vulnerabilities, the other attacks fall under
    blockchain design weakness, such as consensus mechanism, oracle feeds, clients
    interaction, and so on. whereas other layers like the network, data layer are
    generally solid.


    ![](images/Figure-2.15.jpg)


    **Figure 2.15:** Ethereum Security breaches overview


    # [Smart contract review](#toc.xhtml#s39a)


    There have been several high-profile smart contract vulnerabilities that have
    been exploited over the years. Some of the main ones include:


    *   **Re-entrancy attacks**: This is when a malicious contract repeatedly calls
    back into itself before the initial transaction is completed. This can allow an
    attacker to drain the contract of its funds.


    *   **Integer overflow/underflow**: If a contract uses integers to track balances
    or other values, an attacker may be able to manipulate these values by causing
    them to overflow or underflow. This can lead to unexpected behavior and potentially
    allow an attacker to steal funds.


    *   **Unchecked external calls**: If a contract makes external calls to other
    contracts without checking the return value, an attacker can create a malicious
    contract that reverts the transaction or steals funds.


    *   **Access control**: If a contract relies on a single address or account to
    control access, an attacker may be able to take control of the contract by compromising
    that account.


    *   **Time manipulation**: If a contract relies on timestamps to determine when
    certain actions can be taken, an attacker may be able to manipulate these timestamps
    to their advantage.


    *   **Lack of input validation**: If a contract does not validate input data,
    an attacker may be able to submit malicious data that can cause unexpected behavior
    or lead to the theft of funds.


    *   **Bad randomness**: If a contract relies on a source of randomness that is
    predictable or controllable by an attacker, the attacker can manipulate the results
    to their advantage.


    The root cause of these vulnerabilities falls under either one of these sub-causes,
    the following figure can give an idea about what to look for when you audit smart
    contracts.


    ![](images/Figure-2.16.jpg)


    **Figure 2.16:** Vulnerabilities Breakdown


    It is important for developers, architects, and security leads to perform threat
    modeling, see if any of these attack vectors make sense, assess their impact from
    a confidentiality, data integrity, and traceability standpoint, perform a thorough
    test on their contracts, and follow the best practices to minimize the risk of
    exploitation. Also, there are security audit tools available, such as Mythril,
    Slither, and Remix, but it is important to note that no tool can guarantee the
    absence of vulnerabilities, and manual code review and testing should also be
    conducted.


    We will go into more details on the vulnerabilities analysis and remediation later
    in this book, but here to just give an idea about what to expect.


    # [EVM security review](#toc.xhtml#s40a)


    The Ethereum Virtual Machine (EVM) is a crucial component of the Ethereum network,
    as it is responsible for executing the smart contracts that power decentralized
    applications (dApps) on the blockchain. However, like any other software, the
    EVM is not immune to vulnerabilities and exploits; the vulnerabilities fall under
    the following categories:


    *   **Denial-of-service attacks:** The EVM can also be vulnerable to denial-of-service
    (DoS) attacks, where an attacker floods the network with transactions that consume
    excessive gas, leading to slower transaction processing and higher fees.


    *   **Immutable bugs or mistakes:** It is related to the immutability of the Ethereum
    blockchain. Because once a contract is deployed on the blockchain, it cannot be
    altered due to the immutability feature of the blockchain. It is against the legal
    law that allows being modified and terminated. However, it may lead to problems
    if the deployed smart contract contains bugs because after deployment it is impossible
    to alter.


    *   **Missing orphan block:** Ether can be lost in the transfer. Ethers can be
    transferred to a contract to its unique address, but the contract must not be
    orphan, because in that case the transferred ether will be lost forever. There
    is a mechanism to revert the ether transfer. Developers need to physically guarantee
    the rightness of the recipient addresses. The address of the recipient contract
    must be verified manually to avoid the loss of ether in the transfer.


    # [Ethereum security design review](#toc.xhtml#s41a)


    Ethereum design principles are set by the architecture, which shows how the transaction
    is mined, the call flow of the architecture, and the network components parameters,
    the vulnerable areas fall into the following sub-categories:


    *   **Transactional privacy:** Transaction balance details of the users are publicly
    available. But, users want that their financial details and transactions should
    not be visible to others. It may limit the users of smart contracts since attackers
    can monitor the transaction-related details of users. Attackers can use this information
    for various kinds of unethical uses.


    It is suggested the encryption of the smart contracts before deploying them on
    the blockchain, also never share the financial transaction information on smart
    contracts.'
