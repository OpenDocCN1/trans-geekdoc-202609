  trans: "\n区块链安全审计还用于定义合规性，并向客户和监管机构展示你对安全各个方面的关注。它还能保护你的技术栈免受设计、智能合约以及你存储的用户数据中漏洞的影响。它可以优化你的代码并增加受众的信任。这一切看起来都非常重要，因此现在的问题是：是否所有的区块链项目都需要审计？项目在什么阶段需要进行审计？它必须遵循什么流程？市场上有哪些可以采用的解决方案？\n\
    \n在本章中，我们将尝试揭示所有这些。我们将从深入研究智能合约测试开始，探索从单元测试到集成测试的各种方法、测试框架以及智能合约的形式化验证。我们还将查看独立审计，例如漏洞赏金计划。在讨论所有这些内容时，我们将查看形式化验证应用于智能合约和其他项目的各种用例。这个话题非常有趣，我等不及待要直接深入研究它了。让我们来看看本章的目录。\n\
    \n# 章节结构\n\n我们将在本章中涵盖以下主题：\n\n*   智能合约测试\n*   形式化验证概述\n*   将形式化验证应用于智能合约\n*  \
    \ 案例研究——验证 Open Zeppelin 的 ERC-20 实现\n*   漏洞赏金计划\n\n# 智能合约审计\n\n因为像 `Ethereum`\
    \ 这样的公共区块链是无法变的，所以在部署后修改智能合约代码是非常困难的。虽然有 `virtual upgrades` 的合约升级模式，但这些难以实施且需要社会共识。此外，如果攻击者先发现了漏洞，你的智能合约将面临被攻击的风险，因为升级无法修复它。\n\
    \n如果你想了解更多关于智能合约如何升级的知识，可以在 `https://ethereum.org/pt/developers/docs/smart-contracts/upgrading/`\
    \ 找到很好的文章。\n\n由于由于，在智能合约进入主网之前对其进行测试和审计至关重要。可以采用多种方法测试你的代码；没有单一的最佳方法。然而，建议进行风险评估，从概率和影响方面评估威胁向量，然后选择一套混合了不同工具的测试套件。目标应该是识别你的合约可能存在的任何微小或重大问题。\n\
    \n# 智能合约测试方法\n\n智能合约测试主要分为两种测试方法：自动化测试和手动测试。在我们看一些示例之前，让我们从基础知识开始。\n\n# 自动化测试\n\
    \n自动化测试包括检查智能合约是否执行以及在出现问题时生成错误的工具。此过程涉及脚本，通过调度测试用例来实现自动化。这些对于处理重复性任务或重要任务非常有用，因为你不希望出现人为错误。我们看到的缺点是误报（false\
    \ positives），这意味着结果中出现的 bug 并不正确。\n\n要找到更多关于误报的信息，请访问 `https://www.contrastsecurity.com/glossary/false-positive`。\n\
    \n# 单元测试\n\n在单元测试期间，组件会被分别进行评估。以下是自动化测试的一些示例和用例：\n\n编写单元测试来确定执行是否符合要求，也有益于理解合约的操作工作流。例如，当\
    \ `auctionEndTime` 低于 `block.timestamp` 时，拍卖合约会显示用户无法出价。因此，设计人员可以运行单元测试，检查在结束时（即当\
    \ `auctionEndTime` > `block.timestamp` 时）调用 `bid()` 是成功还是失败。\n\n```javascript\n\
    constructor(\n    uint biddingTime,\n    address payable beneficiaryAddress\n\
    ) {\n    beneficiary = beneficiaryAddress;\n    auctionEndTime = block.timestamp\
    \ + biddingTime;\n}\n\nfunction bid() external payable {\n    if (block.timestamp\
    \ > auctionEndTime) {\n        revert AuctionEnded();\n    }\n    if (msg.value\
    \ <= highestBid) {\n        revert BidNotEnough(highestBid);\n    }\n    if (highestBid\
    \ != 0) {\n        pendingReturns[highestBidder] += highestBid;\n    }\n    highestBidder\
    \ = msg.sender;\n    highestBid = msg.value;\n    emit BidIncreased(msg.sender,\
    \ msg.value);\n}\n\nfunction withdraw() external returns (bool) {\n    uint amount\
    \ = pendingReturns[msg.sender];\n    if (amount > 0) {\n        pendingReturns[msg.sender]\
    \ = 0;\n        if (!payable(msg.sender).send(amount)) {\n            pendingReturns[msg.sender]\
    \ = amount;\n            return false;\n        }\n    }\n    return true;\n}\n\
    \nfunction auctionEnd() external {\n    if (block.timestamp < auctionEndTime)\
    \ {\n        revert AuctionNotYetEnded();\n    }\n    if (ended) {\n        revert\
    \ AuctionAlreadyCalled();\n    }\n    ended = true;\n    emit AuctionEnded(highestBidder,\
    \ highestBid);\n    beneficiary.transfer(highestBid);\n}\n```\n"
