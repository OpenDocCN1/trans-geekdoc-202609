- raw: 'Secondly, the other section of the report should tell us about the discovered
    vulnerabilities. *[Figure 4.11](#c04.xhtml#fig4_11)* shows a sample snapshot of
    how the discovered vulnerabilities should be reported.


    The details of the vulnerabilities must include the impact, the CVSS Score, and
    suggested fixes. It is also recommended to show if the vulnerability impact can
    affect key performance indicators, such as customer experience, increase the CPU,
    Memory utilization, and so on.


    On the other hand, the suggested fix should include a mixture of direct and compensating
    controls. In some cases, compensating controls can be useful if direct security
    controls are costly and the organization is willing to accept the risk.


    ![](images/Figure-4.11.jpg)


    **Figure 4.11:** Vulnerability details of missing API Security header


    *A detailed sample report can be found here -* ***[https://www.getastra.com/blog/wp-content/uploads/2021/06/Astra-Security-Sample-VAPT-Report.pdf](https://www.getastra.com/blog/wp-content/uploads/2021/06/Astra-Security-Sample-VAPT-Report.pdf)***


    # Remediation


    In the final stage, this is where you take action on the remediation actions that
    come out from the report. The best practice is to use a change management window
    to apply the changes. The changes have to be applied through the Method of procedure
    (MOP). This should contain Pre-checks, Activity details, Rollback procedures,
    and a combination of functional, unit, and regression testing to ensure that the
    fix is applied without any issues happening to the system.


    # [Hacking Smart contracts](#toc.xhtml#s78a)


    In this section, we will try to explain how smart contracts can be exploited using
    PWNX Labs. We will look at overflow and underflow vulnerabilities with remediation
    measures.


    *PWNX provides CTF labs on computer systems and applications for training purposes.*


    # [The Lab setup](#toc.xhtml#s79a)


    Using VPN, try to connect to the PWNX''s internal network, where a server exposes
    a local blockchain via Ganache.


    Note that Ganache is a personal blockchain for rapidly developing Ethereum and
    other blockchains. You can use Ganache throughout the blockchain development lifecycle
    to develop, deploy, and test your decentralized applications (dApps) in a secure
    and sandboxed environment.


    *[Figure 4.12](#c04.xhtml#fig4_12)* just shows the setup that you need to do.
    You can install OVPN on your laptop and download the VPN configuration file by
    accessing the settings of PWNX’s website.


    To install Ganache, please visit **[https://trufflesuite.com/docs/ganache/](https://trufflesuite.com/docs/ganache/)**.


    ![](images/Figure-4.12.jpg)


    **Figure 4.12:** Connectivity diagram between Local terminal to PWNX internal
    network


    # [Examining the source code](#toc.xhtml#s80a)


    There will be some data and code when you enter the lab and connect to the internal
    network. On the left, you will see the Solidity-written smart contract code that
    explains the contract''s logic. A code for the ABI can be found on the right side,
    as shown in *[Figure 4.13](#c04.xhtml#fig4_13)*.


    ![](images/Figure-4.13.jpg)


    **Figure 4.13:** Comparison of contracts code with ABI


    The most common way to interact with contracts in the Ethereum ecosystem, both
    outside of the blockchain and between contracts, is through the Application Binary
    Interface (ABI).


    Keep in mind that the goal is to claim ownership of the following smart contract.


    You ought to have a wallet address, a confidential key to sign, and the location
    of the shrewd Agreement.


    As an initial step, begin by breaking down the Smart contract code locally. We
    can compile and test the contract on our local system with the help of REMIX IDE.


    *Remix Online IDE is a powerful toolset for developing, deploying, debugging,
    and testing Ethereum and EVM-compatible smart contracts. It requires no setup
    and has a flexible, intuitive user interface*


    The solidity code PWNX.SOL can be copied to Remix IDE. This is a vulnerable contract,
    which consists of different functions, as shown in *[Figure 4.14](#c04.xhtml#fig4_14)*.
    The details of the following contract will be explained before we get into the
    exploitation stage.


    ![](images/Figure-4.14.jpg)


    **Figure 4.14:** Vulnerable smart contract


    Note that once smart contracts are placed on the blockchain, the constructor function
    is called, and the address that was assigned to the contract becomes the contract''s
    owner (ownership action).


    Here are the details:


    *   When the constructor is called, a private variable of the type address, known
    as the owner, is set.


    *   On the agreement, there is a planning called balances. The mapping in Solidity
    is a dictionary or HaspMap (similar to Java).


    *   In our scenario, this mapping is a **database** of addresses that records
    the amount of ether or tokens each address possesses.


    *   Two smaller functions, `getOwner` and `getBalance`, are visible to the public.
    They do not affect the blockchain''s state; `getBalance` returns the amount of
    ether or tokens the user has in the mapping data structure, returning data only.
    We can use the `msg.sender` in Solidity to accomplish this.


    *   The transaction''s global variable, msg, can be found in your Solidity code.
    The source worth of the msg object is the actual sender of the exchange that conveyed
    the smart contract.


    *   As the \_owner parameters were declared in the constructor, the `getOwner`
    function returns the smart contract''s owner address.


    Now, let us understand the vulnerability in the following section.


    # The vulnerability explanation


    We can see a function named `transfer` in the following code snippet that enables
    an address to transfer money into the smart contract:


    *   A `uint` (unsigned integer value), a public function that returns a boolean
    value, is needed for the function transfer.


    *   Line 16 contains the necessary statement. Two boolean values, either true
    or false, are returned by the command required. If the indicated condition yields
    a true response, the code can proceed and operate as intended. The code ends there
    if the returned value is false and an error is triggered.


    *   The address must be greater than or equal to 20, but less than or equal to
    100, for the condition to be satisfied.


    *   Line 24 has a second if statement that determines whether the account balance
    of the owner’s address is lower than the account balance of the transaction''s
