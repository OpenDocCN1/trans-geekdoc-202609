- raw: "You can store data using an on-premise model with a private blockchain. Traditional\
    \ security measures like data confidentiality, integrity, availability, and non-repudiation\
    \ are able to be taken in this scenario. The data can only be accessed by participants\
    \ who have agreed to be kept private. Respectability implies that information\
    \ should be communicated without alteration. Similar to redundancy, availability\
    \ requires a backup for each computer processing messages. Lastly, network access\
    \ log monitoring is made possible by the non-repudiation principle, which states\
    \ that if someone catches you doing something wrong, you cannot deny it.\n\n**Cloud\
    \ deployments**\n\nOn the other hand, you can decide to run your private blockchain\
    \ network on cloud administration. However, keep in mind that you are still responsible\
    \ for anything that happens to your cloud-based data; consequently, you must ensure\
    \ that service level agreements and security controls are in place.\n\n**Governance**\n\
    \nGovernance may influence the choice of architecture in a DLT-based implementation,\
    \ a fixed architecture may limit the available governance models. To put it succinctly,\
    \ governance is concerned with authorities, decision rights, and rewarding good\
    \ behavior. Who is a part of the system, for example, is decided by governance\
    \ models. It is likely that a private blockchain would be having a permissioned\
    \ environment and necessitate a hierarchy for defining participant roles. A design\
    \ challenge is how security can be effectively managed through the governance\
    \ structure, one that is likely to be managed by the enterprise with public stakeholder\
    \ involvement, because this complexity has the potential to introduce additional\
    \ vulnerabilities.\n\nRoles and authority are defined by governance models, but\
    \ the consensus is used to make decisions in DLTs, particularly when determining\
    \ the finality of a transaction. The governance model determines which nodes participate\
    \ in the consensus process, and as the number of nodes grows, so does the system's\
    \ complexity of communication. Additionally, the utilization of nodes that are\
    \ not directly controlled by the organization, for instance, third-party vendors—increases\
    \ the system's attack surface and the amount of time required to reach finality,\
    \ which has an impact on throughput.\n\nThe system architecture should clearly\
    \ define boundaries in a private blockchain for security governance, as should\
    \ clear roles, authorities, and permissions. It is necessary to apply security\
    \ frameworks in such a way that governance models adequately address authorities\
    \ and responsibilities. Governance is also essential in operational stages, where\
    \ the system must quickly distribute code updates, vulnerability patches, and\
    \ other system changes. Additionally, tasks like incident reporting and system\
    \ maintenance may require coordination among system participants to guarantee\
    \ security. If the structure were decentralized, participating bodies would be\
    \ required to clearly communicate their expectations regarding the observance\
    \ of security requirements.\n\n**Key management**\n\nCurrent iterations of DLTs\
    \ rely heavily on the use of public key cryptography for verifying and signing\
    \ transactions and in some cases for securing blocks. This use of public key cryptography\
    \ poses a problem for usability in scenarios where users may be more familiar\
    \ with biometric or password-enabled security functionality. To address usability\
    \ challenges, key management custodians have emerged in the cryptocurrency landscape.\
    \ As third parties outside of the blockchain system itself, custodians constitute\
    \ an attractive attack target and have been demonstrated to be a key point of\
    \ vulnerability for many cryptocurrencies, their evaluation should be done thoroughly.\n\
    \n*   The use of a bare metal hardware security module, to serve as a vault, with\
    \ strict access control and key rotation is enforced with envelope encryption.\
    \ Meaning that keys inside the vault are encrypted with a secondary key.\n\n*\
    \   Keys are generated with a key ceremony process, which has data security standards\
    \ in transit and the rest has been implemented.\n\n*   Testing for Key Backups\
    \ and System Resiliency is ensured of the vaults.\n\n# [Conclusion](#toc.xhtml#s45a)\n\
    \nCongratulations! You have made it to the end of this chapter. We have covered\
    \ lots of important information. It may seem draining considering the amount of\
    \ content we covered, but trust me you will be connecting all the dots once you\
    \ apply this knowledge in your organization.\n\nWe started this chapter with a\
    \ discussion of blockchain types, by showing you the differences, so you know\
    \ exactly which one to choose over another. Then we started the Ethereum blockchain,\
    \ where we explained the fundamentals and the architecture in detail so that when\
    \ we review the vulnerabilities, you can relate to it. Since Ethereum is the heart\
    \ of blockchain applications, it was important to cover it in depth. Later in\
    \ this chapter, we shifted our focus to private blockchains, where we covered\
    \ Hyperledger Fabric, showcased the components and what vulnerabilities exist,\
    \ and covered security considerations while explaining both public and private\
    \ blockchains. Now with this knowledge, you will feel confident about how security\
    \ varies across different blockchain types, and how to architect the solution\
    \ securely, no matter what use case you land up with.\n\n# [Points to remember](#toc.xhtml#s46a)\n\
    \n*   Every blockchain platform is not the same. The variation mainly depends\
    \ upon who can write, validate and read the data in the blockchain.\n\n*   The\
    \ selection of a blockchain platform depends upon the use case if it supports\
    \ the transaction speed, data privacy concerns and validation concerns over the\
    \ consensus layer, compatibility with existing systems, and cost.\n\n*   Ethereum\
    \ blockchain is a preferable platform to build Dapps, due to its massive ecosystem\
    \ due to its surging popularity of its dApps in areas such as finance (decentralized\
    \ finance, or DeFi apps), arts and collectibles (non-fungible tokens, or NFTs),\
    \ gaming, and technology.\n\n*   Ethereum's vulnerable areas include the consensus\
    \ layer, smart contract bugs, transaction privacy, contract calls, common vulnerabilities,\
    \ and client endpoints like metamasks and wallets.\n\n*   Hyperledger Fabric is\
    \ the most popular enterprise blockchain solution, with 38% of the top 100 global\
    \ companies implementing it, including Microsoft, Amazon, Alphabet, and Visa,\
    \ also being the preferred platform for CBDC projects.\n\n*   HL Fabric vulnerability\
    \ domain includes Membership service providers, validation nodes, code bugs, key\
    \ management systems, prevention against DOS attacks, centralization, and availability\
    \ attacks that need to be considered.\n\n# [References](#toc.xhtml#s47a)\n\n*\
    \   **[https://ethereum.org/](https://ethereum.org/)**\n\n*   **[https://swcregistry.io/](https://swcregistry.io/)**\n\
    \n*   **[https://www.cvedetails.com/vulnerability-list/vendor\\_id-17524/Ethereum.html](https://www.cvedetails.com/vulnerability-list/vendor_id-17524/Ethereum.html)**\n\
    \n*   **[https://www.hyperledger.org/](https://www.hyperledger.org/)**\n\n# [Multiple\
    \ choice questions](#toc.xhtml#s48a)\n\n1.  **What does SWC stand for?** \n\n\
    \    1.  Smart Contract Weakness Classification\n\n    2.  Smart contract weakness\
    \ class\n\n    3.  Smart channel Weakness Classification\n\n    4.  All of the\
    \ above\n\n2.  **What does EVM consist of?** \n\n    1.  Gas\n\n    2.  Bytecode\n\
    \n    3.  Memory\n\n    4.  Program Counter\n\n    5.  All of the above\n\n3.\
    \  **Which of the following is an example of externally owned accounts in Ethereum?**\
    \ \n\n    1.  They are controlled by private keys and have no code associated\
    \ with them\n\n    2.  They are controlled by Public keys and have code associated\
    \ with them\n\n    3.  They are controlled by Public keys and have no code associated\
    \ with them\n\n    4.  All of the above\n\n4.  **What is the prevention against\
    \ Re-entrancy Attack?** \n\n    1.  Use the checks-effects-interactions design\
    \ while coding smart contracts"
