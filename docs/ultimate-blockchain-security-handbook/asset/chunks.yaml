- raw: "If a Smart Contract has been published on Ethereum, it will stay live and\
    \ work as long as Ethereum is around. Even the person who wrote it can't take\
    \ it down. Since smart contracts are digital, they don't force anyone and are\
    \ always ready to use. Lending apps, insurance apps, crowdfunding apps, and decentralized\
    \ trading exchanges are all popular examples of smart contracts.\n\nDid you know,\
    \ Szabo came up with the term *smart contract* in 1994? He defines *a smart contract\
    \ as a computerized transaction protocol that executes the terms of a contract*\
    \ as the definition he uses.\n\nAnother important thing to note here is the source\
    \ code and bytecode differentiation in the Ethereum Smart Contract.\n\nThe syntax\
    \ of Solidity, which is similar to that of JavaScript, is typically used to write\
    \ the Smart Contract's source code. A Solidity Smart Contract's structure is similar\
    \ to that of an object-oriented programming class.\n\nThe Solidity compiler also\
    \ produces a bytecode version of the source code, just like the Java compiler\
    \ does. This bytecode version is run by the Ethereum Virtual Machine (EVM).\n\n\
    The Ethereum bytecode is made up of several low-level commands called opcodes.\
    \ It is written in a language called assembly. Ethereum only stores the text of\
    \ a smart contract.\n\nMore details on solidity can be found at **[https://github.com/ethereum/wiki/wiki/Proof-of-Stake-FAQ](https://github.com/ethereum/wiki/wiki/Proof-of-Stake-FAQ)**\n\
    \nHere is a sample Solidity Smart Contract code along with a brief description\
    \ and use case:\n\n`************************************************************************`\n\
    \n`pragma solidity ^0.8.0;`\n\n`contract Voting {`\n\n`mapping(address => bool)\
    \ public hasVoted;`\n\n`mapping(bytes32 => uint256) public voteCount;`\n\n`function\
    \ vote(bytes32 candidate) public {`\n\n`require(!hasVoted[msg.sender], \"You have\
    \ already voted.\");`\n\n`voteCount[candidate] += 1;`\n\n`hasVoted[msg.sender]\
    \ = true;`\n\n`}`\n\n`function getVoteCount(bytes32 candidate) public view returns\
    \ (uint256) {`\n\n`return voteCount[candidate];`\n\n`}`\n\n`}`\n\n`************************************************************************`\n\
    \n# Description:\n\nThis is a simple Smart Contract that enables users to vote\
    \ for a candidate by calling the vote function. Each user can only vote once,\
    \ as the contract keeps track of whether or not a user has already voted. The\
    \ contract stores the vote count for each candidate in a mapping called voteCount\
    \ and provides a function to retrieve the vote count for a given candidate called\
    \ getVoteCount.\n\nThe number of votes that users enter is the trigger condition.\
    \ If the value of vote is more than 1, the result will say *you have already voted*.\
    \ Trigger to contract can also happen in several other ways also, like time and\
    \ schedule, event triggers, harvesting yield, minting NFTs, liquidation of loans\
    \ etc.\n\nNo matter how small or big the contract is, from the security standpoint,\
    \ there should be some important consideration that can be done:\n\n*   **Secure\
    \ Authentication**: The contract should implement strong authentication measures\
    \ to prevent any un-authorized access, this can be achieved using public, private\
    \ key pair, controller subjects and resources by policy enforcements, or simply\
    \ using ACLs at the perimeter level, if you know the ports, source, and destination\
    \ Ips.\n\n*   **Encryption at rest and transit**: The vote count result should\
    \ be encrypted at rest; confidentiality can be achieved using secure vault like\
    \ HSM. Also, if the data must be sent outside, the API should have TLS enabled.\n\
    \nMore on this and lot more on blockchain security solutions will be discussed\
    \ in *[Chapter 6, Blockchain Security Solution](#c06.xhtml)*.\n\n# [Use case](#toc.xhtml#s36a)\n\
    \nThis smart contract could be used to implement a simple voting system, where\
    \ users can cast their votes for a candidate in a transparent and secure manner.\
    \ For example, it could be used in a student government election or a company\
    \ board member election, where votes need to be tallied and verified in a decentralized\
    \ and trustworthy manner.\n\n*You can learn more about the Ethereum community,\
    \ and different Dapps at* **[https://ethereum.org/](https://ethereum.org/)**\n\
    \nNow that you have understood the fundamentals of Ethereum and smart contracts,\
    \ let’s take a look at the structure of an Ethereum node.\n\n# [Structure of an\
    \ Ethereum node](#toc.xhtml#s37a)\n\nEthereum can be divided into several layers,\
    \ the Application layer, consensus layer, data layer, and network layer as shown\
    \ in the following figure. These are then subdivided into other various types,\
    \ depending on the design and the use case.\n\n![](images/Figure-2.14.jpg)\n\n\
    **Figure 2.14:** Layered Structure of Ethereum\n\n*   **Application Layer:** The\
    \ application layer of the Ethereum blockchain is where smart contracts are executed\
    \ and decentralized applications (dApps) are built. We talked about smart contracts\
    \ earlier, and here I would like to emphasize how users interact with the Ethereum\
    \ blockchain. This can be done in the following ways. \n\n    *   **web3-enabled\
    \ browser**: Many modern web browsers, such as MetaMask, Brave, and Opera, come\
    \ with built-in support for the Ethereum blockchain. Users can install these browser\
    \ extensions to interact with dApps and smart contracts directly from their browser.\n\
    \n    *   **Ethereum wallet**: Users can download and install a dedicated Ethereum\
    \ wallet, such as MyEtherWallet, Trust Wallet, or Coinbase Wallet. These wallets\
    \ allow users to send and receive Ethereum, as well as interact with smart contracts\
    \ and dApp.\n\n    *   **Command-line interface**: Advanced users can interact\
    \ with the Ethereum blockchain using a command-line interface (CLI) such as Geth\
    \ or Parity. These tools provide direct access to the Ethereum network and allow\
    \ users to perform more complex operations, such as deploying their own smart\
    \ contract.\n\n    *   **Geth(Go-Ethereum)**: Geth is an Ethereum execution client,\
    \ which means that it runs smart contract deployment, execution, and transactions.\
    \ It also has an embedded computer called the Ethereum Virtual Machine.\n\n* \
    \  **Consensus Layer:** Ethereum has switched on its proof-of-stake mechanism\
    \ considering it is more secure, less energy-intensive, and better for implementing\
    \ new scaling solutions compared to the previous proof-of-work architecture.\n\
    \n    *   Proof of Stake (PoS) is an alternative consensus mechanism to Proof\
    \ of Work (PoW) used by some blockchain networks, including Ethereum. Unlike PoW,\
    \ which relies on miners to solve cryptographic puzzles to validate transactions\
    \ and create new blocks, PoS relies on validators to secure the network.\n\n \
    \   In a nutshell, the PoS consensus layer in Ethereum is designed to be more\
    \ energy-efficient and secure than PoW, as it does not require miners to solve\
    \ computationally expensive puzzles to validate transactions and create new blocks.\
    \ Instead, validators are chosen based on the amount of Ether they have staked\
    \ and are incentivized to act honestly and follow the rules of the network to\
    \ avoid losing their stake.\n\n*   **Data Layer:** The data layer of Ethereum\
    \ refers to how data is stored and managed on the Ethereum blockchain. The Ethereum\
    \ blockchain is a decentralized, distributed ledger that stores transactions and\
    \ data in a series of blocks. Each block contains a cryptographic hash of the\
    \ previous block, creating an unbreakable chain of the block.\n\nIn Ethereum,\
    \ the data layer consists of two main components: the state trie and the transaction\
    \ trie. The state trie is a data structure that stores the current state of the\
    \ Ethereum network, including account balances and contract codes. The transaction\
    \ trie is a data structure that stores all the transactions that have been processed\
    \ by the network."
  fmt: "\nIf a Smart Contract has been published on Ethereum, it will stay live and\
    \ work as long as Ethereum is around. Even the person who wrote it can't take\
    \ it down. Since smart contracts are digital, they don't force anyone and are\
    \ always ready to use. Lending apps, insurance apps, crowdfunding apps, and decentralized\
    \ trading exchanges are all popular examples of smart contracts.\n\nDid you know,\
    \ Szabo came up with the term `smart contract` in 1994? He defines `a smart contract\
    \ as a computerized transaction protocol that executes the terms of a contract`\
    \ as the definition he uses.\n\nAnother important thing to note here is the source\
    \ code and bytecode differentiation in the Ethereum Smart Contract.\n\nThe syntax\
    \ of `Solidity`, which is similar to that of `JavaScript`, is typically used to\
    \ write the Smart Contract's source code. A Solidity Smart Contract's structure\
    \ is similar to that of an object-oriented programming class.\n\nThe Solidity\
    \ compiler also produces a bytecode version of the source code, just like the\
    \ Java compiler does. This bytecode version is run by the Ethereum Virtual Machine\
    \ (`EVM`).\n\nThe Ethereum bytecode is made up of several low-level commands called\
    \ `opcodes`. It is written in a language called assembly. Ethereum only stores\
    \ the text of a smart contract.\n\nMore details on solidity can be found at `[https://github.com/ethereum/wiki/wiki/Proof-of-Stake-FAQ](https://github.com/ethereum/wiki/wiki/Proof-of-Stake-FAQ)`.\n\
    \nHere is a sample Solidity Smart Contract code along with a brief description\
    \ and use case:\n\n```\n************************************************************************\n\
    pragma solidity ^0.8.0;\n\ncontract Voting {\nmapping(address => bool) public\
    \ hasVoted;\nmapping(bytes32 => uint256) public voteCount;\nfunction vote(bytes32\
    \ candidate) public {\nrequire(!hasVoted[msg.sender], \"You have already voted.\"\
    );\nvoteCount[candidate] += 1;\nhasVoted[msg.sender] = true;\n}\n\nfunction getVoteCount(bytes32\
    \ candidate) public view returns (uint256) {\nreturn voteCount[candidate];\n}\n\
    }\n************************************************************************\n\
    ```\n\n## Description\n\nThis is a simple Smart Contract that enables users to\
    \ vote for a candidate by calling the `vote` function. Each user can only vote\
    \ once, as the contract keeps track of whether or not a user has already voted.\
    \ The contract stores the vote count for each candidate in a mapping called `voteCount`\
    \ and provides a function to retrieve the vote count for a given candidate called\
    \ `getVoteCount`.\n\nThe number of votes that users enter is the trigger condition.\
    \ If the value of `vote` is more than 1, the result will say `you have already\
    \ voted`. Trigger to contract can also happen in several other ways also, like\
    \ time and schedule, event triggers, harvesting yield, minting NFTs, liquidation\
    \ of loans etc.\n\nNo matter how small or big the contract is, from the security\
    \ standpoint, there should be some important consideration that can be done:\n\
    \n*   **Secure Authentication**: The contract should implement strong authentication\
