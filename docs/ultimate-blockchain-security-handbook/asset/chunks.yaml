- raw: 'Data communications risks relate to the security posture of the data in transit,
    during processing, and at rest. It means how vulnerable the communication is in
    the architecture. If an attacker gets between two network elements while they
    are talking, can he read the data? This is known as a "man-in-the-middle" attack.
    Are there any security tools that can find and stop this kind of attack? In addition,
    the network elements accept and process the data from a trusted source. If data
    is stored across the network, who can access the data under what circumstances?
    Where is it hosted and how the access is granted?


    Security controls involved in these domains includes identity and access management,
    Public Key Infrastructure, infrastructure security hardenings, and service level
    agreements with cloud service providers if the network is hosted on the public
    cloud. Some important checklists to follow are as follows:


    *   Is data encrypted between two network elements in your blockchain architecture?


    *   Is data encryption applied to sensitive information such as secrets, tokens,
    and information containing PII data?


    *   Is there any policy governing data access, and how is authorization granted
    to subjects?


    *   How do you ensure that the network nodes in the network are trusted?


    *   How are security controls defined by the cloud providers in case of any security
    incident, and how soon the network is restored to its full service?


    *   How much downtime is expected after the incident?


    *   How is the data request coming inside your blockchain network, is the request
    getting authentication and authorized.


    *   Are the subjects only given access to specific allowed resources or they can
    access multiple data sets.


    *   Are there any audit logs maintained of the activity?


    *   Is there any network management system in place to monitor the activity happening
    inside your blockchain network.


    Now you have the tools to identify and classify the risks in your blockchain solution
    based on the various checklist you have learned. Use them early in your solution
    design to keep you aligned with a security posture. This topic has given you a
    good overview of the risk management tactics for your blockchain application.
    The next step is to focus on how to identify the attack patterns in your application,
    which we will learn in the threat modeling topic.


    # [Threat model overview](#toc.xhtml#s63a)


    Understanding blockchain can be challenging. Keeping its decentralized and distributed
    nature in mind, knowing how many assets and participants a blockchain network
    has, and tracking the flow of data across different components can make your head
    spin. The dizzying data can prevent you from identifying potential risks and assessing
    their impact, making risk mitigation control an afterthought – a corrective measure
    when it should be a proactive move.


    The best way to cover all this is through a tool known as threat modeling. Threat
    modeling is an exercise designed to help an organization identify potential threats
    and cybersecurity risks within their organization and systems. This is an essential
    first step toward designing defenses and solutions to help eliminate or reduce
    these risks. I’ll give you the framework for threat modeling to uncover hidden
    vulnerabilities in your blockchain application and get one step closer to securing
    the solution by design.


    First things first, what is threat modeling?


    Threat modeling is a process by which potential vulnerabilities, or the absence
    of appropriate safeguards, are identified so that countermeasures can be prioritized.


    The process can be divided into four sections: digging down on the architecture,
    drawing a data flow diagram to show zones of trust, discovering threats with STRIDE,
    and following up with architecting mitigation and security controls mapping with
    OWASP. We will explain all the components in detail. Let us get straight to this.


    # [Threat model architecture](#toc.xhtml#s64a)


    In the first stage, you need to build the data flow diagram (DFD), outlining the
    detailed architecture of your application, the interaction between different assets,
    how requests come into the network from different subjects, how it is been processed,
    and where the data is stored.


    The main reason to use a Data Flow Diagram in threat modeling is to have a simple
    and common understanding of the main components and communication flows within
    threat modeling among all team members. It has five main components as follows:


    *   **Data Flow**: Consists of an arrow symbol that shows how the data is flowing
    from source to destination.


    *   **Data Store**: Consists of two lines or a database symbol (you can choose
    from both options). It depicts the storage location.


    *   **Process:** Consists of a circle or a rounded rectangle, it shows the process
    that modifies the data.


    *   **Interactors**: Consist of a rectangle. It depicts an endpoint (person or
    system) that interacts with or uses the process. An Interactor is external to
    the system in scope and can be an individual person or system, or can also be
    an entity such as a *Customer*, or *Third Party*.


    *   **Trust boundary**: Consists of a dotted line, multiple dotted lines. It depicts
    a boundary between trust zones (that is, the boundary between trusted and non-trusted
    zone).


    *[Figure 3.5](#c03.xhtml#fig3_5)* is a good representation of the topics we have
    just discussed.


    ![](images/Figure-3.05.jpg)


    **Figure 3.5:** Data flow diagram symbols


    It is recommended that you use only these symbols in your architecture diagram
    to make it look neat.


    Next, the Blockchain Threat model consists of three main architecture components
    as follows:


    *   **Assets:** What, where, and how is the data stored?


    *   **Security Controls:** What Security measures/controls do we have?


    *   **Threat Actors:** Who can penetrate the network, and what kind of acts (internal,
    external)?


    *[Figure 3.6](#c03.xhtml#fig3_6)* provides a sample of how it will look once you
    complete all phases of the cycle. Doesn’t that look good? Believe me, you will
    feel a sense of accomplishment that you have carried out due diligence. In addition,
    you will uncover some hidden attack patterns in your network, which you might
    have missed with your current security posture.


    ![](images/Figure-3.06.jpg)


    **Figure 3.6:** Sample Threat Modeling Diagram


    # [Applying Threat Modeling to Blockchain](#toc.xhtml#s65a)


    Now that you have looked at the sample architecture, let us try building a new
    one from scratch. We will consider a common use case: *A Crypto wallet Application
    for IOS*.


    First, what do we need to draw the architecture diagram for this use case? We
    first need the tool which we can use to draw; it should have all the components
    built in.


    The following is the URL of the free tool, which can you leverage in your project:


    **[https://online.visual-paradigm.com/app/diagrams/#diagram:proj=0&type=ThreatModelDiagram&width=11&height=8.5&unit=inch](https://online.visual-paradigm.com/app/diagrams/#diagram:proj=0&type=ThreatModelDiagram&width=11&height=8.5&unit=inch)**


    In the first section, we need to identify the architecture components, which are
    assets, interaction with various actors, and the trust boundaries across these
    components.


    The actors and their interactions can be as follows:


    *   Users – User onboarding


    *   Cloud provider – API server, database, HSM


    *   Third-party services – Crypto exchange


    *   Security administrator – Penetration testing and compliance


    Assets can be classified as follows:


    *   Private key


    *   User email address


    *   User passcode


    *   Public blockchain data


    *   Device data


    *   Transaction history


    *   Tokens and keys'
