    are computers that store a copy of the Ethereum blockchain''s data, are run by
    volunteers to replace individual cloud and server systems owned by major internet
    service providers.


    Essentially, the Ethereum blockchain is a transaction-based state machine. A machine
    that reads a series of inputs and changes its state based on those inputs is known
    as a state machine.


    A *genesis state* is where we start with Ethereum’s state machine. This is like
    starting from scratch before any network transactions have taken place. This genesis
    state changes into a final state when transactions are carried out. This final
    state is the current state of Ethereum at any given time.


    This can be seen in the following figure; it all starts from genesis and then
    the state changes as the inputs are fed.


    ![](images/Figure-2.8.jpg)


    **Figure 2.8:** State transition in Ethereum


    There are millions of transactions in the Ethereum state. These exchanges are
    gathered into "blocks." A block is a collection of transactions, and each block
    is linked to the one before it. Now that you have understood the fundamental concept,
    let us take a look at important features such as accounts, states, and gas and
    payment.


    # Accounts


    Ethereum''s global *shared state* is made up of many small objects, or *accounts*,
    that can communicate with one another using a message-passing framework. A 20-byte
    address and a state are associated with each account. In Ethereum, any account
    is identified by a 160-bit identifier known as an address. There are two types
    of accounts:


    *   Externally owned: They are controlled by private keys and have no code associated
    with them.


    *   Contact accounts: They are controlled by their contract code and have code
    associated with them.


    So, what is the difference between them?


    By creating and signing a transaction with its private key, an externally owned
    account can send messages to other externally owned accounts OR to contract accounts.
    A message between two externally owned accounts is simply a value transfer. But
    a message from an externally owned account to a contract account activates the
    contract account’s code, allowing it to perform various actions (for example,
    transfer tokens, write to internal storage, mint new tokens, perform some calculations,
    create new contracts, and so on).


    Contract accounts, in contrast to accounts owned by third parties, are unable
    to independently initiate new transactions. Contract accounts, on the other hand,
    can only initiate transactions in response to other transactions they have received
    (either from another contract account or an externally owned account). You can
    conceptualize better with the following figure, where the difference between both
    account types is shown.


    ![](images/Figure-2.9.jpg)


    **Figure 2.9:** Difference between Externally owned and Contract Accounts


    So, any transactions that you see on the Ethereum blockchain are the ones that
    are triggered by an externally owned account.


    # Account state


    The account state consists of four components, which are present regardless of
    the type of account:


    *   **nonce:** If the account is externally owned, this number represents the
    number of transactions sent from the account’s address. If the account is a contract
    account, the nonce is the number of contracts created by the account.


    *   **balance:** The number of Wei owned by this address. There are 1e+18 Wei
    per Ether.


    *   **Storage Root:** A hash of the root node of a Merkle Patricia tree (we’ll
    explain Merkle trees later on). This tree encodes the hash of the storage contents
    of this account and is empty by default.


    *   **Code Hash:** The hash of the EVM (Ethereum Virtual Machine — more on this
    later) code of this account. For contract accounts, this is the code that gets
    hashed and stored as the code Hash. For externally owned accounts, the code Hash
    field is the hash of the empty string.


    The following figure gives a good view of how components are held in each account
    type.


    ![](images/Figure-2.10.jpg)


    **Figure 2.10:** Components in Account states


    # Gas and Payment


    No freebie here. There is a fee associated with each computation carried out on
    the Ethereum network as a result of a transaction.


    The currency used to pay this fee is called **gas**. Gas is the unit used to quantify
    the charges expected for a specific calculation.


    A sender sets a gas limit and gas price for each transaction. The maximum amount
    of Wei that the sender is willing to pay to carry out a transaction is the sum
    of the gas price and the gas limit.


    Let''s say, for instance, that the sender specifies a 50,000-gallon gas cap and
    a 20-gwei gas price. This indicates that the sender is prepared to spend no more
    than 50,000 x 20 gwei, which equals 1,000,000,000,000,000 Wei, or 0.001 Ether,
    to carry out the transaction.


    Keep in mind that the sender''s maximum expenditure for gas is represented by
    the gas limit. They are good to go if they have enough Ether in their account
    balance to cover this maximum. At the conclusion of the transaction, the sender
    receives a refund equal to the original rate for any gas that was not utilized.


    In the following figure, you can see how the payment and gas fees are related
    in a transaction.


    ![](images/Figure-2.11.jpg)


    **Figure 2.11:** Payment and GAS relationship


    The transaction is deemed invalid when the sender fails to provide the necessary
    gas to complete the transaction. The transaction processing is halted in this
    instance, and any previous state changes are reversed.


    Additionally, since the machine had already exerted effort to perform the calculations
    before running out of gas, it stands to reason that the sender receives no reimbursement
    for the gas it used. The **beneficiary** address, which is typically the miner''s
    address, receives all the sender''s gas money. The concept is illustrated in the
    following figure.


    ![](images/Figure-2.12.jpg)


    **Figure 2.12:** GAS Money going to Miner account


    Now, it’s time to talk about the most talked about feature of blockchain in general,
    the Smart Contract. Yes, Smart Contracts are Ethereum discoveries.


    # [Ethereum virtual machine](#toc.xhtml#s34a)


    The Ethereum virtual machine (EVM), which is Ethereum''s very own virtual machine,
    is the component of the protocol that takes care of processing the transactions.
    The architecture view shown in the following figure will help to picture all this
    as we move along.


    ![](images/Figure-2.13.jpg)


    **Figure 2.13:** Ethereum Virtual Machine Architecture


    The EVM is a Turing complete virtual machine. Because it is intrinsically bound
    by gas, the EVM has no limitations that a typical Turing complete machine does
    not. As a result, the total amount of computation that can be performed is intrinsically
    constrained by the gas supply.


    Items are stored in word-addressed byte arrays in the EVM''s memory. Memory is
    unpredictable, it isn''t super durable to mean it that way.


    The EVM has storage as well. Storage is non-volatile and is maintained as part
    of the system state, unlike memory. Program code is stored separately by the EVM
    in a virtual ROM that can only be accessed by following specific instructions.


    # [Smart contracts](#toc.xhtml#s35a)


    Smart Contracts are nothing more than computer programs or scripts for the blockchain
    environment. They only take effect when prompted by a user transaction (or another
    contract). They set Ethereum apart from other cryptocurrencies by making it very
    adaptable in its capabilities. We now refer to these programs as decentralized
    apps or dapps.'
