    ## 安全日志与监控架构


    当你的架构是分布式且去中心化的，这项任务变得更加复杂。为了更好地控制风险并防止否认攻击，你需要一个健壮的日志监控基础设施。


    要构建日志监控解决方案，第一步是识别数据源、接口和存储元素。第二步是根据你的需求捕获并过滤数据。例如，你需要 `Name`、`Address`、`Phone
    Number`、`Public Key`、`Time`、`Event` 等字段。最后一步是将过滤后的事件连接到数据湖，从而获得可视化视图。


    如图 6.21 所示，Splunk Cloud 的架构为你的 Web3 Dapp 提供了一个安全的日志监控解决方案。


    ![](img/Figure-6.21.jpg)


    图 6.21：用于日志监控的 Splunk Cloud


    [图 6.22] 显示了数据注入数据湖时的预期视图。它不仅提供了警报、健康状态、故障和安全审计日志等有见地的信息，还提供了理解用户行为和性能指标的能力。


    ![](img/Figure-6.22.jpg)


    图 6.22：Splunk Cloud – 数据洞察


    通过使用插件，你可以对区块链数据获得良好的可见性，从而降低区块链应用程序的风险。更多信息，请访问：[`lantern.splunk.com/Data_Descriptors/Blockchain_data`](https://lantern.splunk.com/Data_Descriptors/Blockchain_data)。


    # 结语


    你做到了！恭喜读到最后。最后一章详细涵盖了区块链安全解决方案。我们学习了零知识证明概念，并查看了身份访问管理和 PK 架构（公密钥基础设施），这有助于你执行传输和存储的安全。我们还查看了安全日志架构，并深入探讨了智能合约日志。现在你已经完成了这本书，可以心地规划和设计你的区块链解决方案了。


    # 重点


    *   通过零知识证明，你可以向对方证明你所分享的信息是合法且经过验证的。

    *   身份访问管理原则保护资源免受未经的访问。你可以控制谁访问你的智能合约和资源，并限制他们的访问权限。

    *   公密钥基础设施（PKI）由公私钥对、证书颁发机构和数字证书组成。它可以帮助确保网络信任，并为区块链网络提供身份验证和机密。

    *   安全日志是过滤网络事件的方式，从而提供有见地的信息，用于调试、跟踪和监控可疑活动。

    *   日志基础设施由数据处理组件的日志钩子和日志转发代理组成，用于将事件汇总并在一处提供仪表板视图。

