- raw: "Enable event logging in your smart contract layer, such as highlighting different\
    \ privileged accounts in a smart contract’s system with a description of each\
    \ role. And also, notify administrators if any detail in the access control mechanism\
    \ changes (for example, via log events).\n\nAll these features learned earlier\
    \ will strengthen your smart contract access control and offer you a defense in\
    \ depth security posture.\n\n# [Public Key Infrastructure](#toc.xhtml#s117a)\n\
    \nIn 2020, the SolarWinds Orion platform was compromised when hackers injected\
    \ malicious code, known as Sunburst, to gain unauthorized access to a plethora\
    \ of sensitive information belonging to US government agencies like the Treasury\
    \ and Commerce Department. The culprit behind this major attack compromised public\
    \ key certificates and went on to exploit public key infrastructure, or PKI. It\
    \ is one of the highest-profile cyber-attacks in history.\n\nIn this topic, we\
    \ will cover the concepts of PKI, its importance, the challenges, where it fits\
    \ in the blockchain stack to harden the security, and tools you can use to architect\
    \ the solutions.\n\nLet us start with the basics.\n\nPublic key infrastructure,\
    \ or PKI, is a catch-all term for everything used to establish and manage public\
    \ key encryption, which is one of the most common forms of keeping information\
    \ secure on the internet. It’s baked into every web browser in use today to secure\
    \ traffic across the public internet. For example, when you enable HTTPS in your\
    \ browser, you can see a lock symbol in the URL, indicating your browser trusts\
    \ the server you are talking to, and any messages going across it are encrypted.\n\
    \nNow, if you think about security controls and their use cases, they fall into\
    \ the following categories:\n\n*   **Enforcing Confidentiality:** SSL/TLS encryption\
    \ secures any communication in transit across the blockchain architecture. For\
    \ example, an HTTPS request from an API gateway going towards blockchain oracles,\
    \ or the HTTPS communication between the blockchain nodes.\n\n*   **Enabling Authentication**:\
    \ It includes web page authentication, Machine and User authentication, and Two-Factor\
    \ Authentication. For example, a decentralized web application can only accept\
    \ requests from trusted sources. Another important entity is the different protocols\
    \ used in layers 2 and 3 of the blockchain. By enabling authentication, trust\
    \ can be gained from a spoofed or malicious node, such that a node can only become\
    \ part of the network if it holds a valid certificate.\n\n*   **Data Integrity**:\
    \ This can enable security at rest; any information sent between two network elements\
    \ can have a data integrity check enabled. For instance, data values may have\
    \ a digest that can be easily recognized when it has been altered. You can also\
    \ enforce data encryption at rest so that data cannot be read through.\n\nNow\
    \ that we have understood the use cases and how they can help secure your blockchain\
    \ application, let us look at how it works with its fundamental pillars.\n\nIt\
    \ is essential to return to the fundamentals that established encryption in the\
    \ first place to comprehend how PKI functions. We should learn more about cryptography\
    \ methods and digital certificates.\n\n# [Public Key Cryptography](#toc.xhtml#s118a)\n\
    \nCryptographic methods are complex mathematical formulas that are used to hide\
    \ or encrypt and uncover or decrypt messages. They are also the building blocks\
    \ for PKI verification. Public key cryptography is essential in blockchain. Think\
    \ of the use of public and private key pairs in wallets, the hashing algorithm\
    \ SHA256 in building a block, and the use of digital signatures with the signing\
    \ of the private key in submitting a transaction. All these use cases are made\
    \ possible by public key cryptography. It mainly falls into Asymmetric and Symmetric\
    \ encryption.\n\n# [Symmetric Encryption](#toc.xhtml#s119a)\n\nWith symmetric\
    \ encryption, a message written in plain text goes through complex patterns to\
    \ become encrypted. The encrypted message is difficult to break because the same\
    \ letter in plain text does not always look the same in encrypted text. For example,\
    \ the word **XYZ** would not be turned into three of the same letters.\n\nFor\
    \ symmetric encryption, you need the same key to both encrypt and decrypt the\
    \ message. Without the key, it's very difficult to figure out how to decrypt a\
    \ message. However, using the same key to secure and decrypt the message is a\
    \ big risk. This is because if the way the key is shared or the key itself gets\
    \ compromised, the whole purpose and process for sending secure texts are lost.\n\
    \n# [Asymmetric Encryption](#toc.xhtml#s120a)\n\nWith asymmetric encryption, a\
    \ message is still encrypted through mathematical formulas, but only the receiver\
    \ needs to know the private key to decrypt it. Meanwhile, anyone can use the public\
    \ key to encrypt a message.\n\nHere's an example using the well-known characters\
    \ Bob and Alice:\n\n*   Alice wants to send a secret message to Bob, so she uses\
    \ Bob's public key to create encrypted ciphertext that only Bob's private key\
    \ can decode.\n\n*   Since only Bob's private key can decrypt the message, Alice\
    \ can send it knowing that no one else, not even an eavesdropper, can read it,\
    \ as long as Bob makes sure no one else has his private key.\n\nAsymmetric encryption\
    \ also lets you do things that are harder to do with symmetric encryption, such\
    \ as creating digital signatures, which function as follows:\n\n*   Bob can send\
    \ a message to Alice and then use his private key to encrypt a signature at the\
    \ end of the message.\n\n*   When Alice receives the message, she can check two\
    \ things with Bob's public key: \n\n    *   Bob or someone else who had Bob's\
    \ secret key sent the message.\n\n    *   The message was not changed while it\
    \ was in transit, because if it had, the proof would have failed.\n\nIn either\
    \ case, Alice has not made her own key. With just an exchange of public keys,\
    \ Alice can send Bob secret messages and check the signatures on papers signed\
    \ by Bob. Importantly, these things do not work both ways. For Bob to be able\
    \ to send secret messages to Alice and check her signature, Alice would need to\
    \ make her own private key and give Bob the public key that goes with it.\n\n\
    *[Figure 6.7](#c06.xhtml#fig6_7)* is an illustration of this concept using different\
    \ algorithms, and I have also listed the use cases in the box.\n\n![](images/Figure-6.7.jpg)\n\
    \n**Figure 6.7:** Asymmetric encryption example with use cases\n\nNow, how do\
    \ we generate these keys if only public and private keys are necessary for all\
    \ encryption, decryption, and digital signatures? Which algorithms do we use?\n\
    \nThe answer to this is the RSA, ECC, and Diffie-Hellman algorithms. Each uses\
    \ a different set of rules to generate encryption keys, but they all rely on the\
    \ same basic principles as far as the relationship between the public key and\
    \ the private key is concerned.\n\nAs an example, let us look at the RSA encryption\
    \ scheme. RSA encryption is often used with other types of encryptions or for\
    \ digital signatures, which can show that a message is real and hasn't been tampered\
    \ with. A good use case is to use a symmetric key to encrypt the file and then\
    \ use the RSA key to encrypt the symmetric key, which means that only the RSA\
    \ private key would be used to decrypt the symmetric key. Several wallet startups\
    \ have used this strategy. You can implement RSA using open SSL, cryptolib, and\
    \ other cryptographic libraries.\n\nAnother good use case is TLS, which is used\
    \ to implement secure communication between two entities: Web/VPN clients and\
    \ Web/VPN Servers. HTTP communication has turned to HTTPS using RSA.\n\nThe following\
    \ steps explain how public and private keys are calculated using RSA:\n\n*   Select\
    \ two large prime numbers, X and Y. Then compute their product, `n=x*y`\n\n* \
    \  Compute the totient (multiplicative) function, such that ϕ(`n`)=(`x`−1) (`y`−1).\n\
    \n*   Select integer f such that f is co-prime to ϕ`(n)` and `1<f<` ϕ`(n)`. The\
    \ pair (n, f) is the public key. \n\n    **Note**"
