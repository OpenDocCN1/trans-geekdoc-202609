- raw: 'While testing contributes to the confirmation that a contract returns the
    anticipated results for some data inputs, it is unable to definitively demonstrate
    the same for inputs that are not utilized during tests. As a result, *functional
    correctness*, or the ability to demonstrate that a program behaves as required
    for all sets of input values, cannot be guaranteed when testing a smart contract.


    Hence, we need a process like formal verification to determine whether the software
    is correct by comparing the program''s formal model to its formal specification.
    While a formal specification specifies a program''s properties (that is, logical
    assertions regarding the program''s execution), a formal model represents an abstract
    mathematical representation of a program.


    Formal verification, in contrast to testing, can be used to check that an execution
    of a smart contract satisfies a formal specification for all executions (that
    is, it does not contain bugs) without having to execute it with sample data. This
    not only saves time when running dozens of unit tests but also finds previously
    undetected vulnerabilities more effectively. A traditional security audit is not
    the same as formal verification. With a formal check, the contract code is confirmed
    at the bytecode level utilizing tools developed in light of a numerical model
    of the EVM.


    # How Formal Verification of Smart Contracts Works


    Let’s take a look at the process of verifying a smart contract using formal verification.
    A smart contract is written in Solidity and then converted into bytecodes. Once
    reduced to bytecodes, a smart contract can be deployed on the blockchain as a
    contract account at some address.


    ![](images/Figure-5.2.jpg)


    **Figure 5.2:** Solidity Contract with compilation


    In the following example, the contract has been deployed at 0x4ab05. A contract
    account contains funds, a compiled contract, and other data. The picture also
    contained an externally owned account (at 0x6eae7). Such an account contains only
    funds (100 ether in this case).


    ![](images/Figure-5.3.jpg)


    **Figure 5.3:** Address of a deployed contract


    A contract begins working after a transaction addressed to it is submitted to
    the network. Here''s a transaction that transfers ether from the submitter''s
    account to another account:


    transfer(4000 ether, address(0x6eae7)).


    Thousands of computers (miners) running identical copies of the same virtual machine
    (VM) will carry out this transaction. In this instance, the VM will be instructed
    to add 4000 ether to 0x6eae7 and subtract 4000 ether from 0x4ab05 by interpreting
    the bytecodes of the transfer function, as shown in *[Figure 5.4](#c05.xhtml#fig5_4)*.


    ![](images/Figure-5.4.jpg)


    **Figure 5.4:** Contract verification by nodes in virtual machines


    As all the VMs are processing the same data with the same bytecodes, they''ll
    all produce the same answer.


    Once again, our goal is to have great confidence that the contract will behave
    correctly, regardless of the value being transferred, the balances of the two
    accounts, and which account is to receive the value.


    Following are the various ways that could prevent us from getting the desired
    result:


    *   The programmer could misunderstand the intent. For example, suppose no one
    said what to do if there was not enough money to transfer, should the transfer
    function fail? Or should the contract make a *best effort* and transfer only what
    was available?


    *   The programmer might assume one – the wrong one – is the *obvious* choice
    and implement it.


    *   Despite knowing what was needed, the programmer might make a mistake when
    implementing the intent. For example, the Hackergold exploit was due to mistyping
    += as =+.


    During testing, the following conditions are usually checked:


    1.  Transfer zero ether


    2.  Transfer all the ether


    3.  Transfer slightly more than all the ether


    4.  Transfer the largest possible amount of ether (hoping to discover overflow
    bugs)


    5.  Transfer an account''s value to itself


    The tester would turn that into tests by picking specific values for each of the
    preceding points. (You cannot just *transfer all the ether*. Instead, you have
    to pick a specific number for both the contract and receiver''s starting balances,
    and you need to provide a transfer with a specific address.) Running a test means
    predicting the final balances, making the transfer, and checking if what the contract
    did is the same as what it should have done.


    So, what do we really do in formal verification that traditional testing cannot?


    If we are to prove that a program always does what it should, we have to be precise
    about what *should* means. This is known as the contract''s specification. This
    should apply in various hops, such as Solidity code, virtual machine, and bytecode
    specifications, and this all can be verified using K verification frameworks.
    The result of which can be either the contract is wrong or the proof is created
    where the contract is right.


    ![](images/Figure-5.5.jpg)


    **Figure 5.5:** Formal verification of a smart contract using the K framework


    **Note**


    *K is a rewrite-based executable semantic framework in which programming languages,
    type systems, and formal analysis tools can be defined using configurations and
    rules. Out of the several projects aiming to create formally specified execution
    environment, K frameworks are mostly used. It provides a user-friendly, modular,
    and mathematically rigorous meta-language for defining programming languages,
    type systems, and analysis tools. K includes formal specifications for C, Java,
    JavaScript, PHP, Python, and Rust.*


    The detailed analysis of this topic is beyond the scope of this book. We suggest
    you take a look at the following URLs and engage with concerned teams if you wish
    to pursue this.


    Remember, the higher the stakes, the fancier the attack surface becomes.


    For more details on the formal verification, please refer to the Wikipedia page:
    **[https://en.wikipedia.org/wiki/Formal\_specification](https://en.wikipedia.org/wiki/Formal_specification)**


    Following are some useful links to see the formal verification done on smart contracts:


    *   **[https://github.com/runtimeverification/verified-smart-contracts/blob/master/deposit/deposit-formal-verification.pdf](https://github.com/runtimeverification/verified-smart-contracts/blob/master/deposit/deposit-formal-verification.pdf)**


    *   **[https://runtimeverification.com/blog/end-to-end-formal-verification-of-ethereum-2-0-deposit-smart-contract](https://runtimeverification.com/blog/end-to-end-formal-verification-of-ethereum-2-0-deposit-smart-contract)**


    # [KEVM as a specific application of the K Framework](#toc.xhtml#s98a)


    The K semantics of the Ethereum Virtual Machine (KEVM) is an application of the
    K Framework on Ethereum. It specifies the full semantics of the Ethereum Virtual
    Machine (EVM), adding all the benefits of the formal specification to Ethereum
    smart contracts. The KEVM provides the first machine-executable, mathematically
    formal, human-readable, and complete semantics for the EVM.


    The specification includes the following three main components:


    *   The syntax of the language.


    *   A description of the state/configuration.


    *   The transition rules that drive the execution of programs.


    The KEVM implements both the stack-based execution environment, with all the EVM’s
    opcodes, as well as the network’s state, gas simulation, and even high-level aspects
    such as ABI call data.


    This allows for the simplified creation of formal specifications for smart contracts.
    It provides auditors with all the tools necessary to verify a smart contract.
    And the KEVM isn’t limited to any specific programming language.


    # Applying formal verification to a smart contract'
  fmt: '

    While testing contributes to the confirmation that a contract returns the anticipated
    results for some data inputs, it is unable to definitively demonstrate the same
    for inputs that are not utilized during tests. As a result, `functional correctness`,
    or the ability to demonstrate that a program behaves as required for all sets
    of input values, cannot be guaranteed when testing a smart contract.


    Hence, we need a process like formal verification to determine whether the software
    is correct by comparing the program''s formal model to its formal specification.
    While a formal specification specifies a program''s properties (that is, logical
    assertions regarding the program''s execution), a formal model represents an abstract
    mathematical representation of a program.


    Formal verification, in contrast to testing, can be used to check that an execution
    of a smart contract satisfies a formal specification for all executions (that
    is, it does not contain bugs) without having to execute it with sample data. This
    not only saves time when running dozens of unit tests but also finds previously
    undetected vulnerabilities more effectively. A traditional security audit is not
    the same as formal verification. With a formal check, the contract code is confirmed
    at the bytecode level utilizing tools developed in light of a numerical model
    of the `EVM`.


    # How Formal Verification of Smart Contracts Works


    Let’s take a look at the process of verifying a smart contract using formal verification.
    A smart contract is written in `Solidity` and then converted into bytecodes. Once
    reduced to bytecodes, a smart contract can be deployed on the blockchain as a
    contract account at some address.


    ![](images/Figure-5.2.jpg)


    **Figure 5.2:** Solidity Contract with compilation


    In the following example, the contract has been deployed at `0x4ab05`. A contract
    account contains funds, a compiled contract, and other data. The picture also
    contained an externally owned account (at `0x6eae7`). Such an account contains
    only funds (100 ether in this case).


    ![](images/Figure-5.3.jpg)


    **Figure 5.3:** Address of a deployed contract


    A contract begins working after a transaction addressed to it is submitted to
    the network. Here''s a transaction that transfers ether from the submitter''s
    account to another account:


    ```

    transfer(4000 ether, address(0x6eae7)).

    ```


    Thousands of computers (miners) running identical copies of the same virtual machine
    (`VM`) will carry out this transaction. In this instance, the `VM` will be instructed
    to add 4000 ether to `0x6eae7` and subtract 4000 ether from `0x4ab05` by interpreting
    the bytecodes of the `transfer` function, as shown in `[Figure 5.4](#c05.xhtml#fig5_4)`.


    ![](images/Figure-5.4.jpg)


    **Figure 5.4:** Contract verification by nodes in virtual machines


    As all the `VMs` are processing the same data with the same bytecodes, they''ll
    all produce the same answer.


    Once again, our goal is to have great confidence that the contract will behave
    correctly, regardless of the value being transferred, the balances of the two
    accounts, and which account is to receive the value.


    Following are the various ways that could prevent us from getting the desired
    result:


    *   The programmer could misunderstand the intent. For example, suppose no one
    said what to do if there was not enough money to transfer, should the `transfer`
    function fail? Or should the contract make a `best effort` and transfer only what
    was available?


    *   The programmer might make a mistake.


    *   The programmer might assume the code is correct without verifying it.


    *   A traditional security audit is not the same as formal verification. With
    a formal check, the contract code is confirmed at the bytecode level utilizing
    tools developed in light of a numerical model of the `EVM`.

