    \n![](img/Figure-4.19.jpg)\n\n**图 4.19:** 漏洞解释快照\n\n现在，下一步是重复该过程。通过再次调用一次传输函数，我们在映射中的余额将不再为\
    \ 0。合约将执行第二个 `if` 语句中的代码，导致数学上的下溢。这一次，`msg.sender` 的地址余额将在第二个 `if` 语句中大于所有者的余额，从而允许我们利用智能合约的缺陷并声称所有权。\n\
