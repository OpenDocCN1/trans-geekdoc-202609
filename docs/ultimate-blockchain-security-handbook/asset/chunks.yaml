- raw: '*   **Malleable user:** This vulnerability is related to the execution order
    of two dependent transactions that are invoking the same smart contract. A malevolent
    user can utilize this vulnerability to attack if the transactions are not executed
    in the proper order. The order of transaction execution is decided by the miners,
    but if the adversary is the miner itself, then this will be a very disastrous
    situation. Suggested to enforce such that the contract code either returns the
    expected output or fails. Order of transaction should be enforced, otherwise should
    be an error generated.


    *   **Untrustworthy data feeds:** Some smart contracts need data feeds from outside
    the blockchain, but there is no guarantee that the external data source is trustworthy.
    So, in the case when an attacker is intentionally sending wrong information to
    fail the smart contract operation then it will be a hazardous situation. Any request
    coming from outside needs to be properly authenticated and authorized, such as
    using HTTPS with a valid Certificate, which should land on an API Gateway.


    *   **Consensus mechanism:** After Ethereum has moved to Proof of Stake, it has
    adopted the following security measures to overcome malicious users exploiting
    the network.


    *   **Slashing:** Ethereum has implemented a mechanism called **slashing** to
    deter and mitigate attacks on the network. Slashing is a penalty imposed on validators
    who act maliciously or fail to follow the rules of the network. If a validator
    is found to have acted maliciously or in violation of the network rules, their
    staked funds are partially or entirely confiscated, depending on the severity
    of the offense. The Ethereum community has the power to burn the coins for dis-honest
    validators.


    *   **Checkpointing:** Ethereum also has a mechanism called **checkpointing**
    to help recover from the attack. Checkpointing involves creating a reference point
    or "checkpoint" at regular intervals in the blockchain. If an attack occurs, the
    network can roll back to the most recent checkpoint, effectively undoing the malicious
    activity and restoring the network to a previous state.


    In a PoS system, the network is resilient for 51% of attacks, and validators are
    required to stake their own cryptocurrency as collateral in order to participate
    in the consensus process. This means that a validator who tries to cheat the system
    by creating invalid blocks or approving fraudulent transactions will have their
    stake confiscated. This serves as a strong deterrent against malicious behavior,
    as validators have a financial incentive to act honestly and protect the network.


    There is a range of defense strategies that the Ethereum network can leverage
    upon any attack, A minimal response could be to forcibly exit the attackers’ validators
    from the network without any additional penalty, the community could also decide
    to penalize the attacker more harshly, by revoking past rewards or burning some
    portion (up to 100%) of their staked capital.


    # Ethereum security considerations


    Although the Ethereum foundation has done its due diligence in identifying and
    taking care of all the vulnerabilities in the smart contract layer, through bounty
    programs and then there are different audit tools that can be adapted to identify
    and mitigate bugs in protocols, clients, and solidity. But still, there are some
    areas which can be looked upon.


    **Do you know?**


    *You can earn up to $250,000 and a place on the leaderboard by finding protocols,
    clients, and solidity bugs affecting the Ethereum network – Ethereum.org*


    # Centralization of the consensus layer


    One potential vulnerable area is in the consensus layer, with the majority of
    the validators coming under the umbrella of big exchanges such as Coinbase, Kraken,
    and Binance. This may lead to a centralization issue, with an attack surface at
    the core. For example, for some reason, if the regulator sanctions or bans some
    of the big names, then the whole Ethereum validation ecosystem would be at risk,
    it is like having the risk of being *too big to fail*.


    Another vulnerable domain is the wallets, like meta masks and software where you
    interact with Ethereum, like the use of geth (go Ethereum client).


    # MetaMask


    When you use MetaMask, ensure that the latest version is installed on your browser
    and you have saved the passphrase securely. You receive the 12-word Secret Recovery
    Phrase when you first create your wallet.


    MetaMask does not use the cloud. Assuming your gadget breaks, is lost, taken,
    or has information defilement, it is impossible for the MetaMask Backing group
    to recuperate this for you. The only way to recover your MetaMask accounts is
    to use this Secret Recovery Phrase. Secondly, Keep your private keys and secret
    recovery phrases confidential. If you have a large value of tokens in your account(s),
    consider getting a hardware wallet.


    # Vulnerability management


    When you interact with the Ethereum Geth client or EVM, cross-verify the CVE under
    the **[https://www.cvedetails.com/vulnerability-list/vendor\_id-17524/product\_id-51210/Ethereum-Go-Ethereum.html](https://www.cvedetails.com/vulnerability-list/vendor_id-17524/product_id-51210/Ethereum-Go-Ethereum.html)
    and then go through vulnerability disclosure** - **[https://geth.ethereum.org/docs/developers/geth-developer/disclosures](https://geth.ethereum.org/docs/developers/geth-developer/disclosures)**


    If you look at the following CVE, you can have a good idea of what to expect.
    Ensure that there are no open CVEs in your software and you are running the latest
    patch.


    Protect yourself from typical smart contract weaknesses such as Reentrancy, Integer
    underflows and overflows, and Oracle manipulation. Ensure that all related bugs
    are fixed, tested, and validated.


    ![](images/Figure-2.17.jpg)


    **Figure 2.17:** Ethereum Common Vulnerability Exposures (CVE)


    **Note**


    *it is always better to do your due diligence on any open software you are using
    on your blockchain product, for example, running the patches up to date, routinely
    performing threat modeling, auditing, classifying risk by performing simulation,
    AKA red vs blue teaming exercises, etc. CVE gets posted once the exploit has been
    made, you can take the CVE matrix as a reference only*.


    More to come later in the book, where we will go through blockchain vulnerabilities
    and remediation in much detail.


    # Hardening access control


    Any externally owned account (EOA) or contract account can call functions marked
    public or external in smart contracts. Indicating public perceivability for capabilities
    is important assuming that you believe others should connect with your agreement.
    However, functions within the smart contract—not external accounts—can only call
    private functions. Problems can arise if every network participant has access
    to contract functions, particularly if this means that anyone can carry out sensitive
    operations (like minting new tokens).


    Secure access controls are required to prevent unauthorized use of smart contract
    functions. A smart contract''s access control mechanisms limit who can use certain
    functions, like accounts that are in charge of managing the contract. Two patterns
    that can be used to implement access control in smart contracts are the Ownable
    pattern, role-based control, and by using multi-signature.


    *   **Ownable pattern**: Using the Ownable pattern, an address is chosen as the
    **owner** of a contract during the process of making it. The Only Owner modifier
    is added to methods that are private. This makes sure that the contract checks
    the name of the calling address before running the code. So that people who aren''t
    the contract owner can''t get in without permission, calls to protected services
    from addresses other than the contract owner always go back.'
