    \ result should be encrypted at rest; confidentiality can be achieved using secure\
    \ vault like `HSM`. Also, if the data must be sent outside, the `API` should have\
    \ `TLS` enabled.\n\nMore on this and lot more on blockchain security solutions\
    \ will be discussed in `[Chapter 6, Blockchain Security Solution](#c06.xhtml)`.\n\
    \n## Use case\n\nThis smart contract could be used to implement a simple voting\
    \ system, where users can cast their votes for a candidate in a transparent and\
    \ secure manner. For example, it could be used in a student government election\
    \ or a company board member election, where votes need to be tallied and verified\
    \ in a decentralized and trustworthy manner.\n\n*You can learn more about the\
    \ Ethereum community, and different Dapps at `[https://ethereum.org/](https://ethereum.org/)`*.\n\
    \nNow that you have understood the fundamentals of Ethereum and smart contracts,\
    \ let’s take a look at the structure of an Ethereum node.\n\n## Structure of an\
    \ Ethereum node\n\nEthereum can be divided into several layers, the Application\
    \ layer, consensus layer, data layer, and network layer as shown in the following\
    \ figure. These are then subdivided into other various types, depending on the\
    \ design and the use case.\n\n![](images/Figure-2.14.jpg)\n\n**Figure 2.14:**\
    \ Layered Structure of Ethereum\n\n*   **Application Layer**: The application\
    \ layer of the Ethereum blockchain is where smart contracts are executed and decentralized\
    \ applications (dApps) are built. We talked about smart contracts earlier, and\
    \ here I would like to emphasize how users interact with the Ethereum blockchain.\
    \ This can be done in the following ways.\n    *   **web3-enabled browser**: Many\
    \ modern web browsers, such as `MetaMask`, `Brave`, and `Opera`, come with built-in\
    \ support for the Ethereum blockchain. Users can install these browser extensions\
    \ to interact with dApps and smart contracts directly from their browser.\n  \
    \  *   **Ethereum wallet**: Users can download and install a dedicated Ethereum\
    \ wallet, such as `MyEtherWallet`, `Trust Wallet`, or `Coinbase Wallet`. These\
    \ wallets allow users to send and receive Ethereum, as well as interact with smart\
    \ contracts and dApp.\n    *   **Command-line interface**: Advanced users can\
    \ interact with the Ethereum blockchain using a command-line interface (`CLI`)\
    \ such as `Geth` or `Parity`. These tools provide direct access to the Ethereum\
    \ network and allow users to perform more complex operations, such as deploying\
    \ their own smart.\n    *   **Geth(Go-Ethereum)**: `Geth` is an Ethereum execution\
    \ client, which means that it runs contract deployment, execution, and transactions.\
    \ It also has an embedded computer called the Ethereum Virtual Machine.\n*   **Consensus\
    \ Layer**: Ethereum has switched on its proof-of-stake mechanism considering it\
    \ is more secure, less energy-intensive, and better for implementing new scaling\
    \ solutions compared to the previous proof-of-work architecture.\n    *   Proof\
    \ of Stake (`PoS`) is an alternative consensus mechanism to Proof of Work (`PoW`)\
    \ used by some blockchain networks, including Ethereum. Unlike `PoW`, which relies\
    \ on miners to solve cryptographic puzzles to validate transactions and create\
    \ new blocks, `PoS` relies on validators to secure the network.\n    In a nutshell,\
    \ the `PoS` consensus layer in Ethereum is designed to be more energy-efficient\
    \ and secure than `PoW`, as it does not require miners to solve computationally\
    \ expensive puzzles to validate transactions and create new blocks. \n*   **Data\
    \ Layer**: The data layer of Ethereum refers to how data is stored and managed\
    \ on the Ethereum blockchain. The Ethereum blockchain is a decentralized, distributed\
    \ ledger that stores transactions and data in a series of blocks. Each block contains\
    \ a cryptographic hash of the previous block, creating an unbreakable chain of\
    \ the block.\n\nIn Ethereum, the data layer consists of two main components: the\
    \ `state trie` and the `transaction trie`. The `state trie` is a data structure\
    \ that stores the current state of the Ethereum network, including account balances\
    \ and contract codes. The `transaction trie` is a data structure that stores all\
    \ the transactions that have been processed by the network.\n"
  trans: "\n\n如果一个智能合约已发布在以太坊（Ethereum）上，只要以太坊存在，它就会一直运行。即使是编写它的人也无法将其删除。由于智能合约是数字化的，它们不会强迫任何人，并且随时准备好使用。借贷应用、保险应用、众筹应用和去中心化交易所都是智能合约的流行例子。\n\
    \n你知道吗，Szabo 在 1994 年提出了 `smart contract`（智能合约）这一术语？他将智能合约定义为`一种执行合约条款的计算机交易协议`。\n\
    \n这里另一个需要注意的重要点是以太坊智能合约中源代码和字节码之间的区别。\n\n`Solidity` 的语法与 `JavaScript` 相似，通常用于编写智能合约的源代码。Sol\
    \ 智能合约的结构类似于面向对象编程中的类。\n\nSolidity 编译器也会像 Java 编译器一样产生源代码的字节码版本。这个字节码版本由以太坊虚拟机（`EVM`）运行。\n\
    \n以太坊字节码由几个称为 `opcodes`（操作码）的低级指令组成。它是用一种汇编语言编写的。以太坊只存储智能合约的文本。\n\n关于 solidity\
    \ 的更多细节可以在 `[`github.com/ethereum/wiki/wiki/Proof-of-Stake-FAQ`](https://github.com/ethereum/wiki/wiki/Proof-of-Stake-FAQ)`\
    \ 中找到。\n\n以下是一个示例 Solidity 智能合约代码，以及简要的描述和用例：\n\n```\n************************************************************************\n\
    pragma solidity ⁰.8.0;\n\ncontract Voting {\nmapping(address => bool) public hasVoted;\n\
    mapping(bytes32 => uint256) public voteCount;\nfunction vote(bytes32 candidate)\
    \ public {\nrequire(!hasVoted[msg.sender], \"You have already voted.\");\nvoteCount[candidate]\
    \ += 1;\nhasVoted[msg.sender] = true;\n}\n\nfunction getVoteCount(bytes32 candidate)\
    \ public view returns (uint256) {\nreturn voteCount[candidate];\n}\n}\n************************************************************************\n\
    ```\n\n## 描述\n\n这是一个简单的智能合约，允许用户通过调用 `vote` 函数为候选人投票。每个用户只能投票一次，因为合约会跟踪用户是否已经投票。合约在名为\
    \ `voteCount` 的映射中存储每个候选人的票数，并提供了一个名为 `getVoteCount` 的函数来检索指定候选人的票数。\n\n用户输入的票数数量是触发条件。如果\
    \ `vote` 的值大于 1，结果将显示 `you have already voted`（你已经投票过了）。合约的触发也可以通过其他几种方式发生，例如时间、计划、事件触发、收获收益、铸造\
    \ NFT、贷款清算等。\n\n无论合约大小如何，从安全性的角度来看，都应该有一些可以完成的重要考虑因素：\n\n*   **安全身份验证**：合约应该实施强身份验证措施以防止任何未经授权的访问，这可以使用公私钥对、通过策略强制执行的主体和资源来实现，或者如果你知道端口、源和目的\
    \ IP，也可以在边界层简单地使用 `ACLs`。\n*   **静态存储和传输加密**：票数结果应在静态存储时加密；可以使用像 `HSM` 这样的安全存储库来实现机密性。此外，如果数据必须发送到外部，`API`\
    \ 应该启用 `TLS`。\n\n关于此以及更多关于区块链安全解决方案将在 `第 6 章，区块链安全解决方案` 中讨论。\n\n## 用例\n\n此智能合约可以用于实现一个简单的投票系统，用户可以以透明且安全的方式为候选人投票。例如，它可以用于学生会选举或公司董事成员选举，在这些选举中，需要以去中心化且信任的方式进行投票计数和验证。\n\
    \n*你可以在 `[`ethereum.org/`](https://ethereum.org/)` 学习更多关于以太坊社区的信息*。既然你已经理解了以太坊的基础知识和智能合约，让我们来看看以太坊节点的结构。\n\
    \n## 以太坊节点的结构\n\n以太坊节点可以分为几个层：应用层、共识层、数据层和网络层，如下所示。这些被细分为不同的类型，取决于用例。\n\n![](img/Figure-14.jpg)\n\
    \n**图 14：以太坊的分层结构**\n\n*   **应用层**：以太坊区块链的应用层是执行智能合约和构建去中心化应用（dApps）的地方。我们之前讨论过智能合约，在这里我想强调用户如何与以太坊交互。可以通过以下方式进行：\n\
    \    *   **支持 web3 的浏览器**：许多现代浏览器如 `MetaMask`、`Brave` 和 `Opera` 都内置了对以太坊的支持。用户可以安装这些浏览器插件直接从浏览器与\
    \ dApps 和智能合约交互。\n    *   **以太坊钱包**：用户可以下载并安装专用以太坊钱包，如 `MyEtherWallet`、`Trust\
    \ Wallet` 或 `Coinbase Wallet`。这些钱包允许用户发送和接收以太坊，并与智能合约交互。\n    *   **命令行界面**：高级用户可以使用命令行界面（CLI）如\
    \ `Geth` 或 `Parity` 与以太坊区块链交互。这些工具提供了对以太坊网络的直接访问，允许执行更复杂的操作，例如部署自己的智能。\n    *\
    \   **Geth (Go-Ethereum)**：`Geth` 是一个以太坊执行客户端，这意味着它运行部署、执行和交易。它还有一个嵌入计算机称为以太坊虚拟机。\n\
    *   **共识层**：以太坊切换到权益机制是因为它比之前的工作量架构在实现新的扩展解决方案方面更安全、更节能。\n    *   证明权益（PoS）是某些区块链网络（包括以太坊）使用的工作量（PoW）的替代共识机制。与依靠矿工解决密码难题来验证交易并创建新区块的\
    \ PoW 不同，PoS 依靠验证者来维护网络。\n    简而言之，以太坊的 PoS 共识层设计得比 PoW 更节能、更安全，因为它不需要矿工通过计算密集型的难题来验证交易并创建新区块。\n\
    *   **数据层**：以太坊的数据层指的是数据如何在以太坊区块链上存储和管理。以太坊区块链是一个去中心化的分布式账本，以区块的形式存储交易和数据。每个区块都包含前一个区块的加密哈希，形成不可破坏的区块链。\n\
    \n在以太坊中，数据层由两个部分组成：`state trie` 和 `transaction trie`。`state trie` 是存储以太坊网络当前状态的数据结构，包括账户余额和合约代码。`transaction\
    \ trie` 是存储所有网络处理过的交易的数据结构。\n\n"
