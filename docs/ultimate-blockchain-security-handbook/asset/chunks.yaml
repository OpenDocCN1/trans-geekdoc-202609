  trans: '


    以太坊没有单一的实体负责。这之所以可能，是因为社区的去中心化参与和协作。节点是存储以太坊区块链数据副本的计算机，它们由志愿者运行，取代了大型互联网服务提供商拥有的个人云系统和服务器系统。


    本质上，以太坊区块链是一个基于交易的状态机。读取一系列输入并根据这些输入改变其状态的机器被称为状态机。


    `genesis state`（初始状态）是我们在以太坊状态机开始的地方。这就像是在任何网络交易发生之前从零开始。当交易执行时，这个初始状态会变为最终状态。这个最终状态就是以太坊在任何给定时间的当前状态。


    从下图中所示；一切都从初始开始，然后随着输入的输入，状态发生发生变化。


    ![](img/Figure-2.8.jpg)


    **图 2.8:** 以太坊的状态转换


    以太坊状态中存在数百万次交易。这些交易被聚集在“区块”中。区块是交易的集合，每个区块都与上一个区块相连。现在你已经理解了基本概念，让我们来看看账户、状态以及
    Gas 和支付等重要特性。


    # 账户


    以太坊的全局 `shared state`（共享状态）由许多小对象或 `accounts`（账户）组成，可以使用消息传递框架相互通信。每个账户关联一个 20
    字节的地址和一个状态。在以太坊中，任何账户都通过称为地址的 160 位标识符来识别。账户有两种：


    * 外部账户（Externally owned）：它们由私钥控制，没有与之关联的代码。

    * `Contact accounts`（合约账户）：它们由其合约代码控制并关联代码。


    那么，它们之间有什么区别呢？


    通过使用私钥创建并签名交易，外部账户可以向其他外部账户**或**向合约账户发送消息。两个外部账户之间的消息仅仅是价值转移。但从外部账户到合约账户的消息会激活合约账户的代码，允许其执行各种操作（例如，转移代币、写入内部存储、铸造新代币、执行某些计算、创建新合约等）。


    相比之下，由第三方拥有的账户无法独立地发起新交易。相反，合约账户只能响应它们收到的其他交易（无论是来自另一个合约账户还是外部账户）来发起交易。你可以通过下面的图更好地理解，图中展示了两种账户类型的区别。


    ![](img/Figure-2.9.jpg)


    **图 2.9:** 外部账户与合约账户的区别


    因此，你在以太坊区块链上看到的任何交易都是由外部账户触发的交易。


    # 账户状态


    账户状态由四个部分组成，无论账户类型如何都存在：


    * `nonce`：如果账户是外部账户，此数字代表从该地址发送的交易次数。如果账户是合约账户，nonce 是该账户创建的合约数量。

    * `balance`：该地址拥有的 Wei 数量。1 Ether 等于 1e+18 Wei。

    * `Storage Root`（存储根）：Merkle Patricia 树的根节点的哈希值（我们稍后会解释 Merkle 树）。该树编码了此账户存储内容的哈希，默认情况下为空。

    * `Code Hash`（代码哈希）：该账户 EVM（以太坊虚拟机——稍后详细介绍）代码的哈希。对于合约账户，这是被哈希并存储为 `code Hash`
    的代码。对于外部账户，`code Hash` 字段是空字符串的哈希。


    下图很好地展示了每种账户类型中持有的组件。


    ![](img/Figure-2.10.jpg)


    **图 2.10:** 账户状态中的组件


    # Gas 和支付


    这里没有免费。以太坊网络上因交易执行的每项计算都有相关的费用。


    用于支付此费用的货币被称为 `gas`。Gas 是用于量化特定计算预期费用的单位。


    发送者为每笔交易设置 gas limit（Gas 限制）和 gas price（Gas 价格）。发送者愿意执行交易支付的最大 Wei 数是 `gas price`
    和 `gas limit` 之和。


    例如，假设发送者指定了 50,000 的 gas cap（上限）和 20 gwei 的 gas price。这意味着发送者准备花费不超过 50,000 x
    20 gwei（即 1,000,000,000,000,000 Wei，或 0.001 Ether）来执行交易。


    请记住，发送者对 Gas 的最大支出由 `gas limit` 表示。如果他们的账户余额有足够的 Ether 来覆盖这一最大值，就可以进行。交易结束时，发送者将获得任何未使用的
    Gas 等同于原始费率的退还。


    在图中你可以看到交易中支付和 Gas 费用是如何相关的。


    ![](img/Figure-2.11.jpg)


    **图 2.11:** 支付与 GAS 的关系


    当发送者未能提供完成交易所需的 Gas 时，交易被视为无效。在这种情况下，交易处理将停止，任何之前的状态更改都会撤销。


    此外，由于机器在耗尽 Gas 之前已经付出了努力进行计算，因此发送者不会获得已用 Gas 的补偿。`beneficiary`（受益者）地址（通常是矿工地址）接收发送者所有的
    Gas 费。该概念在图中所示。


    ![](img/Figure-2.12.jpg)


    **图 2.12:** 进入矿工账户的 GAS 费用


    现在是时候谈论区块链中最受关注的话题了：智能合约。是的，智能合约是以太坊发现。


    # 以太坊虚拟机


    以太坊虚拟机（`EVM`）是以太坊特有的虚拟机，是协议中负责处理交易的组件。下图所示的架构视图将帮助我们在后续过程中想象出这一切。


    ![](img/Figure-2.13.jpg)


    **图 2.13:** 以太坊虚拟机架构


    `EVM` 是一个图完备虚拟机。因为它本质上受到 Gas 的限制，`EVM` 并没有典型的图完备机器不具备的限制。因此，可以执行的计算总量本质上受到 Gas
    供应的限制。


    项存储在 `EVM` 内存的字寻址字节数组中。内存是不可预测的，它并不意味着持久。


    `EVM` 也有存储。与内存不同，存储是非持久性的，并作为系统状态的一部分维护。程序代码分单独存储在虚拟 ROM 中，只能通过特定指令访问。


    # 智能合约


    智能合约只是区块链环境中的计算机程序或脚本。它们只有在用户交易（或其他合约）触发时才会生效。它们通过使其极具适应性将以太坊与其他加密货币区分开来。我们现在将这些程序称为去中心化应用或
    dapps。


    '
