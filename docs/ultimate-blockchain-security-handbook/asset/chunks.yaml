  fmt: '

    - **Peer nodes**: Peer nodes are the foundation of the Fabric architecture. The
    distributed ledger is hosted by these nodes, which also carries out chain codes
    or smart contracts. In Fabric, there are two types of peer nodes: committing and
    recommending peers.

    - **Endorsing peers**: These nodes carry out the chain code and provide the client
    application with a proposal response. Peers who endorse, validate transactions,
    and support the outcomes.

    - **Committing peers**: These nodes commit the transaction to the distributed
    ledger and verify the endorsement policy.

    - **Ordering service**: The broadcasting of the block to the committing peers
    for validation and commitment to the ledger is the job of this service, which
    is in charge of receiving endorsed transactions from the committing peers, and
    organizing them into a block.

    - **Membership service providers**: The management of the permissions and identities
    of network participants is the responsibility of this component.

    - **Client software**: To carry out transactions and obtain data from the ledger,
    the client application communicates with the peer nodes.

    - **Chain code**: The smart contract, known as chain code, specifies the rules
    and logic that govern the ledger''s transactions.

    - **Channels**: Within the Fabric network, channels enable the creation of private
    subnetworks that guarantee the privacy and confidentiality of transactions between
    specific participants.


    Hyperledger Fabric''s modular and adaptable architecture makes it a popular choice
    for building enterprise-grade blockchain applications because it can be customized
    and integrated with other enterprise systems.


    Now that you have understood the basics of Fabric, let us review it from a security
    standpoint.


    # Hyperledger Fabric security review


    The purpose of Hyperledger Fabric is to make it possible for multiple organizations
    with limited trust to work together securely. Despite Hyperledger Fabric''s security
    enhancements, deployments still require careful configuration and monitoring to
    ensure their safe operation. In this section, we''ll look at various threats that
    HyperLedger Fabric administrators should be aware of and discuss ways to mitigate
    them.


    Hyperledger Fabric''s network threats differ from those of popular permissionless
    chains because it is a permissioned blockchain. On permissioned networks, for
    instance, users are known, their activities can be monitored, and access is managed
    by access control lists, so 51% of attacks and network partitioning attacks are
    less of a threat. Denial of Service (`DoS`) attacks and consensus manipulation
    are two examples of these types of attacks that affect all distributed systems.
    The Membership Service Provider (`MSP`) is a target of other attacks in a Hyperledger
    Fabric network.


    - **DOS attack**: `DoS` attacks pose a threat to any distributed system and disrupt
    the availability of the network. Denial of service attacks can come from a wide
    variety of sources, making proactive prevention difficult. By collecting performance
    metrics like transaction throughput and latency, compromised availability can
    be detected early on, reducing this risk.


    `DOS` can impact the availability of any of the components of the Hyperledger
    fabric network, so there have to be proper measures of identification, remediation
    like network isolation and monitoring principles to be applied.


    - **Consensus mechanism**: Assaults on the organization agreement incorporate
    `DoS` and exchange reordering assaults. Crash Fault Tolerant (`CFT`) consensus
    algorithms are the only ones Hyperledger Fabric currently uses, so they cannot
    tolerate any malicious actors. Byzantine Fault Tolerant (`BFT`) algorithms are
    currently being developed, which will be able to tolerate up to one-third of the
    network being malicious. This threat can be mitigated by early detection of malicious
    behavior, regardless of the consensus algorithm used. For the purpose of detection,
    it is essential to log threat indicators like elections in leadership and transaction
    delays.


    - **MSP downtime**: Fabric-specific threats can be significant when an `MSP` is
    compromised. The `MSP` has the ability to alter network access control and, if
    malicious, could deny service and launch sybil attacks. Private key theft or a
    rogue insider can compromise the `MSP`, which may only be discovered after it
    has been exploited. It is essential to adhere to best practices with key management
    to reduce this risk. In the event of a breach, logging `MSP` actions like certificate
    creation and revocation can assist in identifying malicious behavior. Early detection
    and remediation are the results of alerting based on that logging.


    - **Chain code exploits**: In contrast to cryptocurrencies, where the cost of
    smart contract attacks is easier to quantify, attacks on Hyperledger Fabric can
    compromise business logic and network performance. Notwithstanding standard programming
    rationale bugs, normal mistakes can likewise come from improperly taking care
    of simultaneousness or non-determinism. Using a secure software development life
    cycle framework, smart contracts should be designed with security in mind from
    the start to reduce this risk. Utilizing smart contract analysis tools like the
    Hyperledger Lab Chain code Analyzer, smart contract security should be evaluated
    before deployment to identify potential threats. Consider a formal verification
    or external security audit for more sensitive applications. Finally, after the
    smart contract has been deployed, it should be monitored to identify unusual behavior.


    # Use Case - Central Bank Digital Currency


    Over 105 nations, representing more than 95% of the worldwide Gross Domestic Product
    (GDP), are exploring a central bank that utilizes just digital currency. A record-breaking
    fifty nations are well on their way towards implementing a blockchain-based economy.
    This has been made conceivable by private blockchains, which are the basic foundation
    for these enormous tasks.


    Several Central Bank Digital Currency projects have used hyper ledger fabric as
    the blockchain platform. One good example that can be seen is the ABER project
    between Saudi Arabia and the UAE. It is important to use the best security practices
    outlined as follows while using a private blockchain. We will explore more on
    the Central Bank Digital Currency security design later in the book.


    # Private blockchain security consideration


    Network sharing at the corporate level frequently requires a higher level of privacy
    due to concerns about data confidentiality. A private blockchain is your best
    option if this is one of your requirements. Since only a small number of users
    have access to specific transactions, private blockchains are unquestionably a
    more stable alternative to the network. However, that doesn''t mean they can''t
    be penetrated.


    ## Network availability


    While having complete control over who has access to the network increases security,
    it also creates a single point of failure for the server(s) that act as validation
    computers. This means that anyone can enter the network without proper verification
    if the certified authority is attacked or fails.


    You can add back-ups and modify the architecture of your network to make it more
    resilient against failures of this kind.


    ## On-premise deployment

