- raw: 'At this point you may be wondering, are we talking about the Ethereum blockchain
    or the Bitcoin blockchain? What about the other blockchains on the market, like
    the hyper ledger and Solana? Somebody also mentioned Defi, and how they are different.
    You are correct; things start to get confusing as we dig deep, and it gets difficult
    to get a hold of it. What happens in a situation like this, is that you happen
    to apply security controls the same as an IT, and when the reality hits you in
    the shape of a security incident, then you start to backtrack it and, in most
    cases, reach out to security consultants.


    The question now is, how would you decide which blockchain to use, which one is
    the best fit for your problem, and, most importantly, how to categorize each from
    a risk identification and mitigation perspective? We will try to answer these
    questions in this chapter, taking you to the different blockchain flavors, discussing
    the use case selection process, from Ethereum to Hyperledger, and Defi, taking
    a deep dive into the security features each brings, weaknesses, and then closing
    it with wallets and exchanges.


    # [Structure](#toc.xhtml#s24a)


    In this chapter, we will cover the following topics:


    *   Types of blockchain


    *   Security overview of Ethereum


    *   Ethereum security consideration


    *   Security overview of Hyperledger fabric


    *   Private blockchain security considerations


    # [Types of blockchain](#toc.xhtml#s25a)


    There is no question that blockchain has developed a ton somewhat recently. It
    all started with Bitcoin, which offered the first kind of blockchain, the public
    blockchain. The Bitcoin blockchain can also be referred to as the first generation
    of blockchain technology.


    Before we have a genuine conversation about blockchain types, we should realize
    the reason why we want them in any case.


    When blockchain technology was first made available to the public, it was a type
    of public blockchain that was used for cryptocurrencies. Although it is extremely
    difficult to comprehend the creator’s intention, it generally introduced the concept
    of decentralized ledger technology (DLT). The DLT idea changed how we solve problems
    in our environment. It enabled organizations to function independently of a centralized
    body.


    While distributed technology eliminates the drawbacks of centralization, it also
    brought with it a slew of additional challenges when it comes to implementing
    blockchain technology in various contexts. Proof-of-Work, for instance, was an
    ineffective consensus algorithm utilized in Bitcoin. It expected the hubs to settle
    numerical estimations utilizing energy.


    It wasn''t a problem at first, but as the difficulty grew, so did the amount of
    time and effort required to solve those mathematical equations. This shortcoming
    makes it inadequate for an organization to adopt. For instance, banks manage a
    ton of exchanges consistently. As a result, this particular kind of blockchain
    is unsuitable, since the bank has to settle x number of transactions each day,
    and the information does not need to be disclosed.


    Additionally, A public blockchain is not appropriate for private companies for
    data storage use cases. For example, if Amazon or Google put their confidential
    information on a public blockchain, then this data can be used against them by
    their competitors. It also doesn’t make business sense to use blockchain, just
    for the sake of using it, not being able to solve a genuine problem which also
    yields cost benefits. Although, some would argue that putting data on a public
    blockchain means anybody can view the record, which in turn attracts trust from
    their customers but such a use case is weak.


    Private or federated blockchain was developed to address the aforementioned use
    cases. Private blockchains provide an entirely private environment in which the
    organization selects participants. They can take advantage of the features of
    the blockchain without having to publish everything.


    The following figure shows the four major types of blockchain technologies. They
    mainly fall under permissioned and permissionless, which are further classified
    into public, private, hybrid, and consortiums.


    ![](images/Figure-2.1.jpg)


    **Figure 2.1:** Types of blockchain technologies


    Let us take a look at each one from features, pros, and cons, as well as from
    the use case perspective.


    # [Public blockchain](#toc.xhtml#s26a)


    The idea of decentralization is completely supported by these blockchains. Anyone
    with a computer and access to the internet can join the network—there are no restrictions.
    This is what we have covered in *[Chapter 1: Blockchain Security Review](#c01.xhtml)*.
    We will try to look at this now from the comparative analysis lens, so you can
    understand the differences.


    *   It’s open to the public because of its name, meaning that no one owns it.


    *   It allows anyone with access to the internet and a computer with high-quality
    hardware to participate.


    You can verify transactions or records because every computer in the network stores
    a copy of other nodes or blocks. This can be seen from the following figure, a
    new node joining the network from anywhere in the world, will also maintain a
    copy of the transaction.


    ![](images/Figure-2.2.jpg)


    **Figure 2.2:** Public Blockchain type


    So what are the disadvantages, and why do we need to seek out other versions of
    blockchain? There are a few core problems, such as:


    *   **Lower TPS:** In a public blockchain, the number of transactions per second
    is extremely low. This is because it takes time to verify a transaction and perform
    proof-of-work due to the large network''s many nodes.


    *   **Scalability issues:** It takes a long time to process and complete its transactions.
    Scalability is harmed by this. Because the network will become slower the more
    we try to expand its size.


    *   **High energy consumption:** Because it requires specialized systems (hardware
    components) to run a particular algorithm, the proof-of-work procedure consumes
    a significant amount of energy. Both the economic and environmental aspects of
    it are cause for concern.


    *   **Case studies:** Because they are protected by proof of work or proof of
    stake, public blockchains have the potential to replace conventional financial
    systems. The smart contract that made it possible for this blockchain to support
    decentralization is the more advanced aspect of this blockchain. Instances of
    public blockchain are Bitcoin and Ethereum.


    *   **Voting:** Governments can use a public blockchain to vote, ensuring openness
    and trust.


    *   **Fundraising:** Businesses or initiatives can use the public Blockchain to
    improve transparency and trust.


    # [Private blockchain](#toc.xhtml#s27a)


    Private blockchains are a confined organization of approved hubs. Information
    exchanged between two nodes can''t be accessed by anyone outside the private network.
    Private blockchains are impressive, but they also have some drawbacks. The following
    figure is an illustration of a private blockchain, in which if a new node has
    to participate, it has to be explicitly allowed.


    ![](images/Figure-2.3.jpg)


    **Figure 2.3:** Private Blockchain type


    They differ from public blockchains in their transactions per second (TPS) and
    scalability:


    *   **TPS - Speed:** In contrast to a public network, a private network only has
    a limited number of nodes. This speeds up a transaction''s consensus or verification
    process by all network nodes. Also, new transactions are added to a block quickly.
    Up to thousands or hundreds of thousands of TPS can be processed at once by private
    blockchains.


    *   **Scalability:** Scalability is fairly good with private blockchains. That
    is, you can decide how big your private blockchain should be based on your requirements.
    For instance, if an organization only requires 20 nodes, it can easily deploy
    a blockchain. After expansion, they will have no trouble adding additional nodes.'
