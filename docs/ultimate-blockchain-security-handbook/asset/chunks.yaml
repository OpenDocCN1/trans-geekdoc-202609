- raw: "Now that you have understood how Bitcoin works in detail and its ecosystem,\
    \ let us dissect it even further to understand where the vulnerability exists.\
    \ If you have noticed in all the earlier explanations, it comes down to the core\
    \ concepts of decentralization, the P2P network, wallet keys, exchanges, bitcoin\
    \ source code, mining pool operation, and the bitcoin networking nodes that are\
    \ holding up the chain.\n\n# Decentralization Aspect\n\nDecentralization is at\
    \ the heart of Bitcoin, and it has significant security implications. A decentralized\
    \ system like Bitcoin gives users control and responsibility. The network's security\
    \ is based on Proof-of-Work and not access control, so it can be open. Bitcoin\
    \ Core is essentially an open-source software used to connect to the Bitcoin network\
    \ and run a node. While anyone can suggest modifications, not all proposed code\
    \ modifications are incorporated into Bitcoin Core. Instead, each proposed change\
    \ is thoroughly reviewed and debated by the community before acceptance or rejection\
    \ is decided, and the security is maintained by the overall community.\n\nIf you\
    \ compare it with a traditional payment system, which contains the user's private\
    \ identifier (the credit card number), it is open-ended on a traditional payment\
    \ network like a credit card system. Anyone with access to the identifier can\
    \ \"pull\" funds and charge the owner multiple times after the initial charge.\n\
    \nAs a result, the payment network must be encrypted from beginning to end to\
    \ ensure that neither eavesdroppers nor intermediaries can compromise payment\
    \ traffic while it is in transit or stored (at rest). A bad actor can compromise\
    \ both existing transactions and payment tokens that can be used to create new\
    \ ones if he gains access to the system. Worse still, when customer data is compromised,\
    \ customers are at risk of identity theft and must protect their accounts from\
    \ fraudulent use.\n\nThe decentralized security model of Bitcoin gives users a\
    \ lot of control. The responsibility to keep the keys secret comes with that authority.\
    \ This is difficult for the majority of users, particularly on general-purpose\
    \ computing devices like smartphones and laptops connected to the internet. Although\
    \ Bitcoin's decentralized model prevents the kind of widespread compromise that\
    \ occurs with credit cards, many users fail to adequately protect their keys and\
    \ are hacked one at a time.\n\n# Handling of Keys and Transactions\n\nThe security\
    \ of Bitcoin is dependent on miners independently validating transactions and\
    \ having decentralized control over keys. In order to take advantage of Bitcoin's\
    \ security, one must adhere to the Bitcoin security model. Simply stated: Users\
    \ should not be given control over keys, and transactions should not be removed\
    \ from the blockchain. Avoid giving the custody of your keys to an exchange or\
    \ a third party. Exercise proper diligence when it comes to key backups.\n\nAs\
    \ a result of always-on internet connections, our computers are constantly exposed\
    \ to threats from the outside. They frequently possess unrestricted access to\
    \ the user's files and run thousands of software components from hundreds of authors.\
    \ Among the many thousands of malicious programs that are installed on your computer,\
    \ a single piece of malicious software can compromise your keyboard and files,\
    \ stealing any Bitcoin stored in wallet applications. Only a small percentage\
    \ of computer users are capable of performing the level of computer maintenance\
    \ required to maintain viruses and trojan-free computers. So this is one vulnerability\
    \ area to take care of.\n\nAnother common error is to \"take transactions off\
    \ the blockchain\" in an erroneous attempt to speed up transaction processing\
    \ or reduce transaction fees. Transactions will be recorded on an internal, centralized\
    \ ledger in an \"off-blockchain\" system, with occasional synchronization to the\
    \ Bitcoin blockchain. Again, this practice uses a proprietary and centralized\
    \ method to replace decentralized Bitcoin security. Inadequately secured centralized\
    \ ledgers can be tampered with during off-chain transactions, causing funds to\
    \ be diverted and reserves to be depleted without being noticed.\n\n# [Conclusion](#toc.xhtml#s18a)\n\
    \nGreat job in completing the first chapter! With this knowledge, you can easily\
    \ comprehend the buzz around blockchain. With the concepts and toolsets you were\
    \ able to grasp, you will be able to find a use case in your organization where\
    \ blockchain can be applied. Also, you can advise your peers on how to use bitcoin\
    \ blockchain securely.\n\nIn the next chapter, we will take a look at other public\
    \ blockchain variants like Ethereum and Solana in detail. We will showcase how\
    \ private and hybrid blockchains are different from the security and architecture\
    \ standpoint while exploring the ecosystem of wallets, and exchanges. This will\
    \ be interesting!\n\n# [Points to remember](#toc.xhtml#s19a)\n\n*   Blockchain\
    \ is a suite of technologies; the underlying features like decentralization, peer-to-peer\
    \ network, cryptography, and immutability are what make blockchain useful.\n\n\
    *   Blockchain can be applied in any industry where the information is stored,\
    \ transmitted, and valued.\n\n*   Bitcoin is not a blockchain, but rather an open-source\
    \ software protocol, composed of source code, client, and cryptographic keys.\
    \ It is the decentralized nature, economic design, and cryptographic functions\
    \ which gives security.\n\n*   Vulnerability areas of bitcoin are the wallet keys,\
    \ user terminals, and offline transactions.\n\n*   Due diligence is required when\
    \ it comes to storing wallet keys.\n\n# [References](#toc.xhtml#s20a)\n\n*   **[https://www.baeldung.com/cs/prime-numbers-cryptography](https://www.baeldung.com/cs/prime-numbers-cryptography).**\n\
    \n*   **[https://cypherpunks-core.github.io/bitcoinbook/](https://cypherpunks-core.github.io/bitcoinbook/)**\n\
    \n*   **[https://research.aimultiple.com/blockchain-case-studies/](https://research.aimultiple.com/blockchain-case-studies/)**\n\
    \n*   **[https://learnmeabitcoin.com/technical/longest-chain](https://learnmeabitcoin.com/technical/longest-chain)**\n\
    \n*   **[https://bitcoin.org/](https://bitcoin.org/)**\n\n# [Multiple choice questions](#toc.xhtml#s21a)\n\
    \n1.  **What does blockchain comprise?** \n\n    1.  Peer-to-peer network\n\n\
    \    2.  Cryptography\n\n    3.  Consensus algorithm\n\n    4.  All of the above\n\
    \n2.  **What does the block in a blockchain contain?** \n\n    1.  Hash\n\n  \
    \  2.  Bitcoins\n\n    3.  Nonce value\n\n    4.  Transaction ledger\n\n    5.\
    \  Name and address\n\n3.  **Which of the following security principles is provided\
    \ by hashing?** \n\n    1.  Confidentiality\n\n    2.  Integrity\n\n    3.  Availability\n\
    \n    4.  All of the above\n\n4.  **Why do we use a private key in a wallet?**\
    \ \n\n    1.  To unlock the unspent transactions\n\n    2.  To sign the transaction\n\
    \n    3.  To view the transactions\n\n    4.  None of the above\n\n5.  **What\
    \ is the purpose of the public key?** \n\n    1.  To identify a user\n\n    2.\
    \  To sign a transaction\n\n    3.  To mine a transaction\n\n    4.  To store\
    \ the transactions\n\n# [Answers](#toc.xhtml#s22a)\n\n1.  **d**\n\n2.  **a, b,\
    \ c, d**\n\n3.  **b**\n\n4.  **a, b**\n\n5.  **a**\n\n# [CHAPTER 2](#toc.xhtml#c02)\n\
    \n# [Blockchain Security Variations](#toc.xhtml#c02)\n\n# [Introduction](#toc.xhtml#s23a)\n\
    \nThere are numerous use cases for blockchain at the moment: thousands of cryptocurrency\
    \ projects, hundreds of live blockchain applications, and billions of dollars\
    \ in market capital flowing into this new technology. I would also add that most\
    \ of the issues we face in your financial ecosystem—taking out a loan from a bank,\
    \ sending money to your peers, or just moving and storing data—can be solved by\
    \ using blockchain. In other words, any issue involving information that needs\
    \ to be shared or validated can be solved by using blockchain."
