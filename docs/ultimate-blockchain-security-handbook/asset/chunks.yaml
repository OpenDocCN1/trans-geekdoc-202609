  trans: '


    - **同行节点 (Peer nodes)**：同行节点是 Fabric 架构的基础。分布式账本由这些节点托管，它们还执行链码或智能合约。在 Fabric
    中，同行节点有两种：提交节点和背书节点。

    - **背书节点 (Endorsing peers)**：这些节点执行链码并为客户端应用程序提供建议响应。背书节点背书、验证交易并支持结果。

    - **提交节点 (Committing peers)**：这些节点将交易提交到分布式账本并验证背书策略。

    - **排序服务 (Ordering service)**：该服务负责将区块广播到提交节点进行验证并提交到账本，它负责从提交节点接收已背书交易并将其组织成区块。

    - **成员服务提供商 (Membership service providers)**：该组件负责网络参与者权限和身份的管理。

    - **客户端软件 (Client software)**：为了执行交易并从账本中获取数据，客户端应用程序与同行节点进行通信。

    - **链码 (Chain code)**：智能合约被称为链码，规定了管理账本交易的规则和逻辑。

    - **通道 (Channels)**：在 Fabric 网络中，通道允许创建私子网络，以确保特定参与者之间交易的隐私性和机密性。


    Hyperledger Fabric 模块化且适应性的架构使其成为企业级区块链应用程序的热选，因为它可以自定义并与其他企业系统集成。


    现在你已经了解了 Fabric 的基础知识，让我们从安全的角度来复习它。


    # Hyperledger Fabric 安全审查


    Hyperledger Fabric 的目的是让多个信任有限的组织能够安全地合作。尽管 Hyperledger Fabric 增强了安全性，但部署仍需要仔细的配置和监控以确保其安全运行。在本节，我们将查看
    Hyperledger Fabric 管理员应该注意的各种威胁，并讨论减轻这些威胁的方法。


    Hyperledger Fabric 的网络威胁与流行的许可链不同，因为它许可区块链。例如，在许可网络上，用户是已知的，其活动可以被监控，访问由访问控制列表管理，因此
    51%%攻击和网络分区攻击的威胁较小。拒绝服务 (`DoS`) 攻击和共识操纵是影响所有分布式系统的此类攻击示例。成员服务提供商 (`MSP`) 是 Hyperledger
    Fabric 网络其他攻击的目标。


    - **DoS 攻击**：`DoS` 攻击对任何分布式系统都构成威胁并破坏网络的可用性。拒绝服务攻击可能来自各种来源，使得主动预防变得困难。通过收集交易吞吐量和延迟等性能指标，可以尽早发现可用性损坏，从而降低风险。


    `DOS` 可能会影响 Hyperledger fabric 网络中任何组件的可用性，因此必须应用适当的识别、修复措施（如网络隔离）和监控原则。


    - **共识机制**：针对组织共识的攻击包括 `DoS` 和交易重排序攻击。Hyperledger Fabric 目前仅使用崩溃容错 (`CFT`) 共识算法，因此它们无法容忍任何恶意参与者。拜庭容错
    (`BFT`) 算法正在开发中，它们将能够允许网络中多达三分之一的恶意。无论使用何种共识算法，都可以通过早期检测恶意行为来减轻这种威胁。为了检测，记录如领导层选举和交易延迟等威胁指标是关重要的。


    - **MSP 停机**：当 `MSP` 被攻破时，Fabric 特有的威胁可能是巨大的。`MSP` 有更改网络访问控制的能力，如果存在恶意，可能会拒绝服务并发起女巫攻击。私钥被盗或内部鬼鬼可能会破坏
    `MSP`，这可能在被利用后才被发现。遵循密钥管理的最佳实践以降低这种风险至关重要。在发生泄露时，记录证书创建和撤销等 `MSP` 操作可以帮助识别恶意行为。基于这些日志的告警是早期检测和修复的结果。


    - **链码漏洞**：与加密货币相比（智能合约攻击的成本更容易量化），对 Hyperledger Fabric 的攻击可能会损害业务逻辑和网络性能。除了标准的编程逻辑漏洞外，普通的错误也可能源于对并发性或非确定性的处理不当。使用安全的软件开发生命周期框架，设计智能合约时从开始就应考虑安全性以降低这种风险。利用
    Hyperledger Lab Chain 码分析器等智能合约分析工具，在部署之前评估智能合约安全性以识别潜在威胁。对于更敏感的应用，可以考虑形式验证或外部安全审计。最后，在部署智能合约后，应对进行监控以识别异常行为。


    # 用例 - 央行数字货币


    全球超过 105 个国家（占全球国内总值 GDP 的 95% 以上）正在探索仅使用数字货币的央行。创纪录的五十个国家正朝着实现基于区块链的经济迈进。私有区块链使得这一巨大任务成为可能，它们是这些宏大任务的基础。


    有几个央行数字货币项目使用了 hyper ledger fabric 作为区块链平台。一个很好的例子是沙特阿拉伯和阿联酋之间的 ABER 项目。在使用私有区块链时，使用以下概述的最佳安全实践是重要的。我们将在书中后面更多探讨央行数字货币的设计。


    # 私有区块链安全考虑


    由于对机性的考虑，企业级的网络共享通常需要更高的隐私。如果这是你的需求之一，私有区块链是你的最佳选择。由于只有少数用户可以访问特定交易，私有区块链无疑是网络更稳定的替代方案。然而，这并不意味着它们无法被渗透。


    ## 网络可用性


    虽然完全控制访问权限增加了安全性，但也为作为验证的服务器创建了单点故障。这意味着如果授权机构受到攻击或故障，任何人都可以在没有适当验证的情况下进入网络。


    你可以添加备份并修改网络架构，使其对此类故障更具韧性。


    ## 本地部署


