    # Pen testing vs Bug Bounty


    Now you must be thinking is this another name given to penetration testing. No,
    it is not. The main difference lies in the scope and the execution method. Penetration
    testing is a dynamic assessment where a tester attempts to exploit vulnerabilities
    within a specific timeframe. In contrast, a bug bounty program is a continuous,
    crowdsourced effort where ethical hackers are incentivized to find and report
    vulnerabilities at any time.


    Vulnerabilities found during penetration testing are often focused on specific
    targets or entry points, whereas bug bounty programs can uncover a wider range
    of issues from a diverse set of researchers and perspectives. This leads to a
    more robust security posture for the blockchain project over time.

