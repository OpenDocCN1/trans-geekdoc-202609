    Trust boundaries are created depending on the asset type and actors'' interaction.
    As a general rule, sensitive information such as private keys, tokens, and key
    access, should be restricted to a private boundary. Anything exposed to the public
    should be in a separate zone, while interaction with external API or cloud providers
    sits in a different zone.


    Each zone will have its own security posture. There will be a separation between
    each zone, and inter-zone movement will be restricted through confidentiality,
    integrity, and authentication checks.


    Based on the information we have of the use case, this is what the architecture
    looks like, as shown in `[Figure 3.7](#c03.xhtml#fig3_7)`.


    ![](images/Figure-3.07.jpg)


    **Figure 3.7:** Crypto Wallet threat modeling diagram


    The third step is to discover threats using STRIDE, which can potentially be attacked,
    keeping in view the security architecture that we build earlier.


    But what is STRIDE, and how does it apply to the threat modeling data flow? Let
    me explain.


    STRIDE is an acronym for Spoofing, Tampering, Repudiation, Information disclosure,
    Denial of service, and Escalation of privilege.


    Let me expand on what STRIDE means by explaining the meaning of each letter:


    *   **Spoofing** is the act of disguising a communication or identity so that
    it appears to be associated with a trusted and authorized source.

    *   **Tampering** is when someone hacks the software parameters in the e-wallet
    to produce different behavior.

    *   **Repudiation** is when someone denies another from performing their action.

    *   **Information Disclosure** is sharing some of the system’s private information
    with others.

    *   **Denial of service** occurs when users are unable to access information,
    systems, or resources.

    *   **Elevation of Privileges** gives authorization permissions beyond those initially
    granted.


    ## Note


    *Not all of the STRIDE elements apply to each use case. Quickly evaluate if it
    applies. For example, if you''re using a public cloud like AWS to host your infrastructure,
    then Denial of service on hardware isn''t your responsibility because it’s taken
    care of by the cloud provider under a service-level agreement.*


    In `[Figure 3.8](#c03.xhtml#fig3_8)`, we have mapped the STRIDE framework into
    the data flow diagram where it applies. For example, Spoofing applies to users
    who are onboarded into the application. This can also be targeted for the banks
    where users will go to withdraw the cryptocurrency into cash.


    On the other hand, tampering attempts can be done on crypto exchanges, and information
    disclosure can be carried out in the database and memory where sensitive data
    like user information, token, and secrets are stored.


    Lastly, a Denial of service (DOS) attack can be carried out on the DaPP and API
    gateway, since they are mostly exposed to the internet. So, they can be the low-hanging
    fruit for attackers.


    ![](images/Figure-3.08.jpg)


    **Figure 3.8:** Threat Modeling Implementation on Blockchain with STRIDE


    # Mitigations against STRIDE Attack Vectors (#toc.xhtml#s66a)


    The final step of the threat modeling exercise is to tighten your architecture
    with mitigating controls against the STRIDE attack vectors. There are several
    ways to accomplish this, and my recommendation is to understand and classify each
    of these attacks in terms of probability and impact, and then apply them.


    ### Spoofing

    Spoofing attacks include session hijacking and cross-site forgery (CSRF). Since
    spoofing is an attack on authentication, mitigation includes secure authentication
    and multi-factor authentication (MFA).


    ### Tampering

    Tampering attacks exploit vulnerabilities in code and design. To protect against
    tampering, applications should validate inputs and encode outputs. This includes
    Cross-Site Scripting (XSS) and SQL injection.


    ### Repudiation

    Repudiation attacks exploit the lack of controls to manipulate or forge actions.
    This can also lead to fraud. It can be prevented by properly tracking user actions
    and incorporating digital signatures.


    ### Information Disclosure

    Information disclosure attacks exploit vulnerabilities to gain access to sensitive
    areas. Prevention includes ensuring error messages and response headers are as
    generic as possible to avoid revealing clues.


    ### Denial of service

    Denial of service (DoS) attacks flood the target with traffic, causing systems
    to crash. The most common form of DoS attack is a buffer overflow attack. Applications
    can be protected by configuring firewalls to block traffic from certain sources
    (such as reserved, loopback, or private IP addresses), unassigned DHCP clients,
    and introducing rate limiting.


    ### Elevation of Privilege

    Privilege escalation attacks exploit vulnerabilities and misconfigurations to
    gain illicit access to elevated rights. Mitigation includes hardening systems
    and applications through configuration changes, removing unnecessary rights and
    access, and closing ports.


    The following table provides a good, summarized view for your reference.


    ![](images/Figure-3.9.jpg)


    **Figure 3.9:** Summary of STRIDE with Controls


    # Conclusion (#toc.xhtml#s67a)


    Great job on completing the third chapter! With this knowledge, you can easily
    do risk management for your blockchain application. You can identify risks, quantify
    them in terms of probability and impact, and most importantly, apply mitigation
    controls. You have also learned the tool of threat modeling, equipping you to
    build a security architecture for your blockchain application. Any direct security
    controls can be applied to the architecture as you build the data flow diagram,
    and any security gaps can be filled up through STRIDE evaluation. This chapter
    has given you a lot of hands-on work and will prove vital as you progress through
    this book.


    In the next chapter, we will look at the ways to exploit blockchain applications,
    which means taking a deep dive into attack vectors, penetration testing tools,
    infrastructure, and smart contracts with real-world examples.


    # Points to remember (#toc.xhtml#s68a)


    *   Blockchain risk management is like risk management you would do in any other
    project. It includes identification, classification, and mitigation stages.

