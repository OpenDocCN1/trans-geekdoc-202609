- raw: "Now that you have understood the case study in detail and also looked at the\
    \ mitigation steps for a few vulnerabilities, let us take a deeper dive into understanding\
    \ more smart contract vulnerabilities.\n\n# [Smart Contract Attack Vectors Analysis](#toc.xhtml#s82a)\n\
    \nSolidity's security flaw stems from smart contracts not operating in accordance\
    \ with their intended behavior. The outcome of such can be as follows:\n\n*  \
    \ Funds getting stolen\n\n*   Funds getting locked up or frozen inside a contract\n\
    \n*   People receiving fewer rewards than anticipated (rewards are delayed or\
    \ reduced)\n\n*   People receiving more rewards than anticipated (leading to inflation\
    \ and devaluation)\n\nI will try to cover most of the vulnerabilities here, although\
    \ these lists do not cover every bug that Solidity has and have come across. However,\
    \ it serves as a checklist of things to keep an eye out for and study. If a subject\
    \ seems unfamiliar, it should be an indication that practicing identifying that\
    \ category of vulnerability is worthwhile.\n\n*As a pre-requirement, I assume\
    \ you have a reasonably good proficiency in Solidity. There is a good tutorial\
    \ available at **[https://www.rareskills.io/learn-solidity](https://www.rareskills.io/learn-solidity)***.\n\
    \n# Re-entrancy\n\nIn a re-entrancy attack, an attacker calls a function that\
    \ interacts with another contract and then immediately calls the same function\
    \ again before the first function call completes. This can exploit a flaw in the\
    \ contract's logic and allow the attacker to manipulate the contract's state,\
    \ causing significant damage.\n\nIt happens whenever a smart contract calls the\
    \ function of another smart contract, sends Ether to it, or transfers a token\
    \ to it, then there is a possibility of re-entrancy.\n\n*   When Ether is transferred,\
    \ the receiving contract’s fallback or receive function is called. This hands\
    \ the control over to the receiver.\n\n*   Some token protocols alert the receiving\
    \ smart contract that they have received the token by calling a predetermined\
    \ function. This hands the control flow over to that function.\n\n*   When an\
    \ attacking contract receives control, it doesn’t have to call the same function\
    \ that handed over control. It could call a different function in the victim smart\
    \ contract (cross-function re-entrancy) or even a different contract (cross-contract\
    \ re-entrancy)\n\n*   Read-only re-entrancy happens when a view function is accessed\
    \ while the contract is in an intermediate state.\n\n*Real-world Example: The\
    \ DAO Hack: The attacker took advantage of Ethereum’s fallback function to perform\
    \ re-entrancy. Every Ethereum smart contract byte code contains the so-called\
    \ default fallback function. More details can be found at* ***[https://quantstamp.com/blog/what-is-a-re-entrancy-attack](https://quantstamp.com/blog/what-is-a-re-entrancy-attack)***\n\
    \n*More such attacks can be found at **[https://github.com/pcaversaccio/reentrancy-attacks](https://github.com/pcaversaccio/reentrancy-attacks)***\n\
    \n*Where to find re-entrancy attacks: As of April 2023, 46 re-entrancy attacks\
    \ have been documented in that repository. More details can be found at **[https://www.rareskills.io/post/where-to-find-solidity-reentrancy-attacks](https://www.rareskills.io/post/where-to-find-solidity-reentrancy-attacks)***\n\
    \nThis default fallback function contains an arbitrary code if the developer overrides\
    \ the default implementation. If it is overridden as payable, the smart contract\
    \ can accept ether. The function is executed whenever ether is transferred to\
    \ the contract.\n\n*[Figure 4.25](#c04.xhtml#fig4_25)* provides a good example\
    \ of the process flow of a re-entrancy attack.\n\n![](images/Figure-4.26.jpg)\n\
    \n**Figure 4.26:** Illustration of a DAO Attack\n\n*   **Prevention**\n\n    The\
    \ following are the best practices to follow when writing your smart contract\
    \ code to prevent re-entrancy attacks from occurring.\n\n*   **Simplicity and\
    \ code reuse**\n\n    A simple code reduces the likelihood that your code will\
    \ encounter a bug and assists in preventing an unanticipated effect. Keep the\
    \ code basic and spotless, following the DRY guideline. Glance through the brilliant\
    \ agreement code and attempt to track down ways of simplifying it utilizing fewer\
    \ lines of code. This will make it simple for you to find any part of your code\
    \ that is vulnerable.\n\n*   **Checks effects interactions patterns (CEI)**\n\n\
    \    This example is a powerful method for preventing re-entrancy attacks in a\
    \ smart contract code. Checks and verifications in the contract flow are the first\
    \ steps in using this pattern. Before interacting with another contract, changes\
    \ to the current contract's state variables should be made.\n\n*   **Setting gas\
    \ limit**\n\n    Using both the send() and transfer() functions set the gas limits\
    \ that can be used in a transaction to 2300 units. This helps prevent a re-entrancy\
    \ attack from occurring because there wouldn’t be enough gas to recursively call\
    \ back into the vulnerable function to exploit funds.\n\n*   **Mutex/re-entrancy\
    \ guard**\n\n    Open Zeppelin has a re-entrancy guard library. The re-entrancy\
    \ guard provides a modifier called `nonReentrant()` that blocks re-entrancy attacks\
    \ in the function it is applied. Following is the code of how it applies.\n\n\
    ![](images/Figure-4.27.jpg)\n\n**Figure 4.27:** Re-entrancy Contract Code\n\n\
    # Check Line 7 and Line 8:\n\n*   Create a boolean locked and make it private.\n\
    \n*   `nonReentrant()` modifier is created that locks the withdraw() function\
    \ after a single transfer.\n\nWhen we apply the `nonReentrant()` modifier to the\
    \ `withdraw()` function that was stated earlier, it prevents reentrancy. This\
    \ is because the first required statement will equate to false and revert the\
    \ transaction. As a result of this, the attacker is no longer able to exploit\
    \ the withdraw function with a recursive call. In addition, when the modifier\
    \ is applied to the cross-function reentrancy attack, the function will be locked\
    \ when that attacker tries to call it repeatedly.\n\n# [Access Control](#toc.xhtml#s83a)\n\
    \nIt may appear to be a straightforward error, but it is actually quite common\
    \ to forget to restrict who can call a sensitive function, such as changing ownership\
    \ or withdrawing ether.\n\nEven when a modifier is in place, there have been instances\
    \ in which the modifier was not used appropriately, as in the case where the require\
    \ statement is missing in the following example:\n\n![](images/Figure-4.28.jpg)\n\
    \n**Figure 4.28:** Access control vulnerability example#1\n\n**This preceding\
    \ code is a real example from this audit: [https://code4rena.com/reports/2023-01-rabbithole/#h-01-bad-implementation-in-minter-access-control-for-rabbitholereceipt-and-rabbitholetickets-contracts](https://code4rena.com/reports/2023-01-rabbithole/#h-01-bad-implementation-in-minter-access-control-for-rabbitholereceipt-and-rabbitholetickets-contracts)**\
    \ **Here is another way access control can go wrong:**\n\n![](images/Figure-4.29.jpg)\n\
    \n**Figure 4.29:** Access control vulnerability example#2\n\n**In this case,**\
    \ `alreadyClaimed` **is never set to true, so the claimant can issue call the\
    \ function multiple times.**\n\n# Real-life example: Trader bot exploited\n\n\
    A fairly recent example of insufficient access control was an unprotected function\
    \ to receive flashloans by a trading bot (which went by the name 0xbad, as the\
    \ address started with that sequence). It racked up over a million dollars in\
    \ profit until one day an attacker noticed any address could call the flashloan\
    \ receive function, not just the flashloan provider.\n\nAs is usually the case\
    \ with trading bots, the smart contract code to execute the trades was not verified,\
    \ but the attacker discovered the weakness anyway.\n\nFor more details, please\
    \ visit **[https://rekt.news/ripmevbot/](https://rekt.news/ripmevbot/)**\n\n#\
    \ Improper Input Validation\n\nIf access control is about controlling who calls\
    \ a function, input validation is about controlling what they call the contract\
    \ with.\n\nThis usually comes down to forgetting to put the proper required statements\
    \ in place."
  fmt: 'Now that you have understood the case study in detail and also looked at the
    mitigation steps for a few vulnerabilities, let us take a deeper dive into understanding
    more smart contract vulnerabilities.


    # Smart Contract Attack Vectors Analysis


    Solidity''s security flaw stems from smart contracts not operating in accordance
    with their intended behavior. The outcome of such can be as follows:


    * Funds getting stolen

    * Funds getting locked up or frozen inside a contract

    * People receiving fewer rewards than anticipated (rewards are delayed or reduced)

    * People receiving more rewards than anticipated (leading to inflation and devaluation)


    I will try to cover most of the vulnerabilities here, although these lists do
    not cover every bug that Solidity has and have come across. However, it serves
    as a checklist of things to keep an eye out for and study. If a subject seems
    unfamiliar, it should be an indication that practicing identifying that category
    of vulnerability is worthwhile.


    As a pre-requirement, I assume you have a reasonably good proficiency in Solidity.
    There is a good tutorial available at `[https://www.rareskills.io/learn-solidity](https://www.rareskills.io/learn-solidity)`.


    # Re-entrancy


    In a re-entrancy attack, an attacker calls a function that interacts with another
    contract and then immediately calls the same function again before the first function
    call completes. This can exploit a flaw in the contract''s logic and allow the
    attacker to manipulate the contract''s state, causing significant damage.


    It happens whenever a smart contract calls the function of another smart contract,
    sends Ether to it, or transfers a token to it, then there is a possibility of
    re-entrancy.


    * When Ether is transferred, the receiving contract’s fallback or receive function
    is called. This hands the control over to the receiver.

    * Some token protocols alert the receiving smart contract that they have received
    the token by calling a predetermined function. This hands the control flow over
    to that function.

    * When an attacking contract receives control, it doesn’t have to call the same
    function that handed over control. It could call a different function in the victim
    smart contract (cross-function re-entrancy) or even a different contract (cross-contract
    re-entrancy)

    * Read-only re-entrancy happens when a view function is accessed while the contract
    is in an intermediate state.


    *Real-world Example: The DAO Hack: The attacker took advantage of Ethereum’s fallback
    function to perform re-entrancy. Every Ethereum smart contract byte code contains
    the so-called default fallback function. More details can be found at `[https://quantstamp.com/blog/what-is-a-re-entrancy-attack](https://quantstamp.com/blog/what-is-a-re-entrancy-attack)`


    *More such attacks can be found at `[https://github.com/pcaversaccio/reentrancy-attacks](https://github.com/pcaversaccio/reentrancy-attacks)`*


    *Where to find re-entrancy attacks: As of April 2023, 46 re-entrancy attacks have
    been documented in that repository. More details can be found at `[https://www.rareskills.io/post/where-to-find-solidity-reentrancy-attacks](https://www.rareskills.io/post/where-to-find-solidity-reentrancy-attacks)`*


    This default fallback function contains an arbitrary code if the developer overrides
    the default implementation. If it is overridden as payable, the smart contract
    can accept ether. The function is executed whenever ether is transferred to the
    contract.


    *[Figure 4.25]* provides a good example of the process flow of a re-entrancy attack.


    ![](images/Figure-4.26.jpg)


    **Figure 4.26:** Illustration of a DAO Attack


    ## Prevention


    The following are the best practices to follow when writing your smart contract
    code to prevent re-entrancy attacks from occurring.


    ### Simplicity and code reuse

    A simple code reduces the likelihood that your code will encounter a bug and assists
    in preventing an unanticipated effect. Keep the code basic and spotless, following
    the DRY guideline. Glance through the brilliant agreement code and attempt to
    track down ways of simplifying it utilizing fewer lines of code. This will make
    it simple for you to find any part of your code that is vulnerable.


    ### Checks effects interactions patterns (CEI)

    This example is a powerful method for preventing re-entrancy attacks in a smart
    contract code. Checks and verifications in the contract flow are the first steps
    in using this pattern. Before interacting with another contract, changes to the
    current contract''s state variables should be made.


    ### Setting gas limit

    Using both the `send()` and `transfer()` functions set the gas limits that can
    be used in a transaction to 2300 units. This helps prevent a re-entrancy attack
    from occurring because there wouldn’t be enough gas to recursively call back into
    the vulnerable function to exploit funds.


    ### Mutex/re-entrancy guard

    Open Zeppelin has a re-entrancy guard library. The re-entrancy guard provides
    a modifier called `nonReentrant()` that blocks re-entrancy attacks in the function
    it is applied. Following is the code of how it applies.


    ![](images/Figure-4.27.jpg)


    **Figure 4.27:** Re-entrancy Contract Code


    ## Check Line 7 and Line 8:


    * Create a boolean `locked` and make it private.

    * `nonReentrant()` modifier is created that locks the `withdraw()` function after
    a single transfer.


    When we apply the `nonReentrant()` modifier to the `withdraw()` function that
    was stated earlier, it prevents reentrancy. This is because the required statement
    will equate to false and revert the transaction.


    # Access Control


    It may appear to be a straightforward error, but it is actually quite common to
    forget to restrict who can call a sensitive function, such as changing ownership
    or withdrawing.


    Even when a modifier is in place, there have been instances in which the modifier
    was not used appropriately, as in the case where the require statement is missing
    in the following example:


    ![](images/Figure-4.28.jpg)


    **Figure 4.28:** Access control vulnerability#1


    **This preceding code is a real example from this audit: `[https://coderena.com/reports/2023-01-rabbithole/h-01-bad-implementation-in-minter-access-control-for-rabbitholereceipt-and-rabbithole-contracts](https://coderena.com/reports/2023-01-rabbithole/h-01-bad-implementation-in-minter-access-control-for-rabbitholereceipt-and-rabbithole-contracts)`
    **Here is another way access control can go wrong:**


    ![](images/Figure-4.29.jpg)


    **Figure 4.29:** Access control vulnerability#2


    **In this case, `alreadyClaimed` is never set to true, so the claimant can call
    the function multiple times.**


    # Real-life example: Trader bot exploited


    A fairly recent example of insufficient access control was an unprotected function
    to receive flashloans by a trading bot (which went by the name 0xbad, as the address
    started with that sequence). It racked up over a million dollars in profit until
    one day an attacker noticed any address could call the flashloan receive function,
    not just the flashloan provider.


    For more details, please visit `[https://rekt.news/ripmevbot/](https://rekt.news/ripmevbot/)`.


    # Improper Input Validation


    If access control is about controlling who calls a function, input validation
    is about controlling what they call the contract with.


    This usually comes down to forgetting to put the proper required statements in
    place.

