- raw: "A prime example of how the technology could be used to track ownership with\
    \ a tamper-proof, neutral, and resilient system is by recording physical assets\
    \ like auto parts on a blockchain. Blockchains are immutable and have no single\
    \ entity controlling the ledger, whereas paper records are susceptible to forgery\
    \ and/or physical degradation, and centralized databases may be vulnerable to\
    \ hacking, human error, and/or tampering.\n\nBlockchains could be used to identify\
    \ counterfeit parts in a supply chain and track them. The technology also has\
    \ significant effects on recalls of automobiles, which will affect approximately\
    \ 32 million vehicles in 2020. Blockchain could enable targeted recalls by keeping\
    \ track of where parts have gone, from the supplier to the individual vehicle.\n\
    \n*The Mobility Open Blockchain Initiative (MOBI), a consortium that includes\
    \ automakers like Ford, BMW, Honda, and GM, has been working on a vehicle and\
    \ parts tracking initiative.*\n\n# Real estate\n\nA lack of transparency during\
    \ and after a property transaction, a lot of paperwork, the possibility of fraud,\
    \ and errors in public records pose significant challenges. Blockchain provides\
    \ a means to speed up transactions and eliminate the need for paper-based record-keeping,\
    \ thereby assisting stakeholders in enhancing efficiency and lowering transaction\
    \ costs on all sides.\n\n**Note**\n\n*Propy is seeking to offer secure home buying\
    \ through a blockchain-based smart contract platform. All documents are signed\
    \ and securely stored online, while deeds and other contracts are recorded using\
    \ blockchain technology as well as on paper.*\n\nYou must be wondering, if all\
    \ this information is good, but can we see the real-world benefits of blockchain?\
    \ What focused area the investors should consider? With blockchain reaching 20\
    \ Billion dollars in 2023 and expected to reach 200 billion by 2027 (refer to\
    \ *[Figure 1.4](#c01.xhtml#fig1_4)*), let us identify key domains while looking\
    \ at the results from blockchain case study.\n\n![](images/Figure-1.4.jpg)\n\n\
    **Figure 1.4:** Blockchain market size in billion US dollars  \n\n**Source:**\
    \ Statista\n\n# [Case Study: Procurement and Supply Chain](#toc.xhtml#s16a)\n\n\
    Blockchain eases supplier master data management: **Trust Your Supplier**\n\n\
    **Challenges**: When it came to finding and integrating a reputable supplier,\
    \ ‘Trust Your Supplier’ saw an opportunity to save time and money. Companies must\
    \ deal with supply chain disruptions and quality expectations to comply with regulations\
    \ or stakeholders’ environmental and social concerns. Businesses spend a lot of\
    \ time and money trying to find a good supplier. This is because it’s hard to\
    \ verify and get data from providers, as companies don’t want to openly share\
    \ their data.\n\n**Solution**: An open-source blockchain platform that allows\
    \ businesses to securely and effectively share data with permissions third-party\
    \ partners.\n\nOnce the company’s data is confirmed, a blockchain-based corporate\
    \ digital passport is created, allowing:\n\n*   Enhanced compliance\n\n*   Enhanced\
    \ risk management\n\n*   Reduced onboarding duration of suppliers\n\nThe digital\
    \ password contains the hash output of the data, which gives the data integrity.\
    \ Third-party verifiers give the view of the P2P network and validate the supplier\
    \ information, which gives authenticity, and supplier data on the blockchain gives\
    \ traceability. So, what you see here, as explained earlier, ensures that all\
    \ security domains are covered when you use blockchain.\n\nResults:\n\n*   Reduces\
    \ the supplier onboarding duration by more than 70%.\n\n*   Lessens the cost of\
    \ data verification to work with a suitable supplier by 50%.\n\n*   Improves compliance\
    \ by almost instantaneously checking international quality certificates of other\
    \ parties like GRI, ISO, SASB, etc.\n\n# [Inherent security capabilities of Bitcoin](#toc.xhtml#s17a)\n\
    \n# Bitcoin Overview\n\nA digital money ecosystem is built on the ideas and technologies\
    \ contained in Bitcoin. Value is stored and transferred among participants in\
    \ the Bitcoin network using Bitcoin units. It is worth mentioning, there are thousands\
    \ of cryptocurrencies globally, and bitcoin is the most well-known and widely\
    \ used. The internet and other transport networks can also be used by Bitcoin\
    \ users to communicate with one another using the Bitcoin protocol. Open-source\
    \ software known as the bitcoin protocol stack is compatible with a wide range\
    \ of computing platforms, including smartphones and laptops, making the technology\
    \ readily available.\n\nBitcoin, in contrast to conventional currencies, is entirely\
    \ virtual. There are neither actual coins nor digital coins. In transactions where\
    \ value is transferred from one party to another, the coins are implied. The keys\
    \ that enable Bitcoin users to demonstrate ownership in the Bitcoin network are\
    \ their own. They can sign transactions with these keys to unlock the value and\
    \ spend it by giving it to a new owner. Keys are frequently kept in a digital\
    \ wallet on each user's smartphone or computer. The only requirement to spend\
    \ Bitcoin is possession of the key that can sign a transaction, giving each user\
    \ complete control.\n\nWe will be going through the concepts repeatedly that we\
    \ have learned as we unfold Bitcoin. Hold tight, as this will all help you to\
    \ clear your concepts and allow you to join the missing dots as we march along\
    \ in this book. In a nutshell, bitcoin consists of:\n\n*   A decentralized P2P\
    \ network (the Bitcoin protocol)\n\n*   A public transaction ledger (the blockchain)\n\
    \n*   A set of rules for independent transaction validation and currency issuance\
    \ (consensus rules)\n\n*   A mechanism for reaching decentralized global consensus\
    \ on the valid blockchain (Proof-of-Work algorithm)\n\nNow let’s move one step\
    \ forward and examine how it works and how it protects the users from the lens\
    \ of confidentiality, integrity, availability, and traceability.\n\nI will try\
    \ to keep my context on a high level since digging deep into Bitcoin core architecture\
    \ and its various components is beyond the scope of this book. We will try to\
    \ cover all the pieces from a security standpoint. Having said that, developing\
    \ a thorough understanding is equally important, so the reference URLs have been\
    \ provided for you to explor in parallel.\n\n# Bitcoin Working Process Overview\n\
    \nTo recap, decentralized trust is the foundation of the Bitcoin system, in contrast\
    \ to conventional banking and payment methods. In Bitcoin, instead of relying\
    \ on a single trusted authority, trust emerges naturally from the interactions\
    \ of various system participants.\n\nBy following a single transaction through\
    \ the Bitcoin system and watching it become *trusted* and accepted by the Bitcoin\
    \ mechanism of distributed consensus before being recorded on the blockchain,\
    \ the distributed ledger of all transactions.\n\nWe can see in the Bitcoin process\
    \ overview illustration (refer to *[Figure 1.5](#c01.xhtml#fig1_5)*) that the\
    \ Bitcoin system is made up of users who have wallets that contain both public\
    \ and private keys. Consider a public key like an email address or the identity\
    \ of a user, while the private key unlocks the spends and signs transactions that\
    \ are spread across the network. Miners who produce the consensus blockchain,\
    \ which is the authoritative ledger of all transactions, through competitive computation.\n\
    \nIn addition, there are other participants like exchanges, and merchants, which\
    \ are part of this ecosystem as well. Recall the initial topic of this chapter,\
    \ where we saw the analogy of an office improvement project; with that in mind,\
    \ exchanges and merchants are part of the supply chain, which fuels the marketplace.\n\
    \n![](images/Figure-1.5.jpg)\n\n**Figure 1.5:** Bitcoin Process Overview  \n\n\
    **source:** [https://cypherpunks-core.github.io/](https://cypherpunks-core.github.io/)"
  fmt: "\nA prime example of how the technology could be used to track ownership with\
    \ a tamper-proof, neutral, and resilient system is by recording physical assets\
    \ like auto parts on a blockchain. Blockchains are immutable and have no single\
    \ entity controlling the ledger, whereas paper records are susceptible to forgery\
    \ and/or physical degradation, and centralized databases may be vulnerable to\
    \ hacking, human error, and/or tampering.\n\nBlockchains could be used to identify\
    \ counterfeit parts in a supply chain and track them. The technology also has\
    \ significant effects on recalls of automobiles, which will affect approximately\
    \ 32 million vehicles in 2020. Blockchain could enable targeted recalls by keeping\
    \ track of where parts have gone, from the supplier to the individual vehicle.\n\
    \nThe Mobility Open Blockchain Initiative (MOBI), a consortium that includes automakers\
    \ like Ford, BMW, Honda, and GM, has been working on a vehicle and parts tracking\
    \ initiative.\n\n# Real estate\n\nA lack of transparency during and after a property\
    \ transaction, a lot of paperwork, the possibility of fraud, and errors in public\
    \ records pose significant challenges. Blockchain provides a means to speed up\
    \ transactions and eliminate the need for paper-based record-keeping, thereby\
    \ assisting stakeholders in enhancing efficiency and lowering transaction costs\
    \ on all sides.\n\n## Note\n\nPropy is seeking to offer secure home buying through\
    \ a blockchain-based smart contract platform. All documents are signed and securely\
    \ stored online, while deeds and other contracts are recorded using blockchain\
    \ technology as well as on paper.\n\nYou must be wondering, if all this information\
    \ is good, but can we see the real-world benefits of blockchain? What focused\
    \ area the investors should consider? With blockchain reaching 20 Billion dollars\
    \ in 2023 and expected to reach 200 billion by 2027 (refer to [Figure 1.4](#c01.xhtml#fig1_4)),\
    \ let us identify key domains while looking at the results from blockchain case\
    \ study.\n\n![](images/Figure-1.4.jpg)\n\n**Figure 1.4:** Blockchain market size\
    \ in billion US dollars  \n\n**Source:** Statista\n\n# Case Study: Procurement\
    \ and Supply Chain\n\nBlockchain eases supplier master data management: Trust\
    \ Your Supplier\n\n**Challenges**: When it came to finding and integrating a reputable\
    \ supplier, ‘Trust Your Supplier’ saw an opportunity to save time and money. Companies\
    \ must deal with supply chain disruptions and quality expectations to comply with\
    \ regulations or stakeholders’ environmental and social concerns. Businesses spend\
    \ a lot of time and money trying to find a good supplier. This is because it’s\
    \ hard to verify and get data from providers, as companies don’t want to openly\
    \ share their data.\n\n**Solution**: An open-source blockchain platform that allows\
    \ businesses to securely and effectively share data with permissions third-party\
    \ partners.\n\nOnce the company’s data is confirmed, a blockchain-based corporate\
    \ digital passport is created, allowing:\n\n* Enhanced compliance\n* Enhanced\
    \ risk management\n* Reduced onboarding duration of suppliers\n\nThe digital password\
    \ contains the hash output of the data, which gives the data integrity. Third-party\
    \ verifiers give the view of the P2P network and validate the supplier information,\
    \ which gives authenticity, and supplier data on the blockchain gives traceability.\
    \ So, what you see here, as explained earlier, ensures that all security domains\
    \ are covered when you use blockchain.\n\n**Results**:\n\n* Reduces the supplier\
    \ onboarding duration by more than 70%.\n* Lessens the cost of data verification\
    \ to work with a suitable supplier by 50%.\n* Improves compliance by almost instantaneously\
    \ checking international quality certificates of other parties like GRI, ISO,\
    \ SASB, etc.\n\n# Inherent security capabilities of Bitcoin\n\n# Bitcoin Overview\n\
    \nA digital money ecosystem is built on the ideas and technologies contained in\
    \ Bitcoin. Value is stored and transferred among participants in the Bitcoin network\
    \ using Bitcoin units. It is worth mentioning, there are thousands of cryptocurrencies\
    \ globally, and bitcoin is the most well-known and widely used. The internet and\
    \ other transport networks can also be used by Bitcoin users to communicate with\
    \ one another using the Bitcoin protocol. Open-source software known as the bitcoin\
    \ protocol stack is compatible with a wide range of computing platforms, including\
    \ smartphones and laptops, making the technology readily available.\n\nBitcoin,\
    \ in contrast to conventional currencies, is entirely virtual. There are neither\
    \ actual coins nor digital coins. In transactions where value is transferred from\
    \ one party to another, the coins are implied. The keys that enable Bitcoin users\
    \ to demonstrate ownership in the Bitcoin network are their own. They can sign\
    \ transactions with these keys to unlock the value and spend it by giving it to\
    \ a new owner. Keys are frequently kept in a digital wallet on each user's smartphone\
    \ or computer. The only requirement to spend Bitcoin is possession of the key\
    \ that can sign a transaction, giving each user complete control.\n\nWe will be\
    \ going through the concepts repeatedly that we have learned as we unfold Bitcoin.\
    \ Hold tight, as this will all help you to clear your concepts and allow you to\
    \ join the missing dots as we march along in this book. In a nutshell, bitcoin\
    \ consists of:\n\n* A decentralized P2P network (the Bitcoin protocol)\n* A public\
    \ transaction ledger (the blockchain)\n* A set of rules for independent transaction\
    \ validation and currency issuance (consensus rules)\n* A mechanism for reaching\
