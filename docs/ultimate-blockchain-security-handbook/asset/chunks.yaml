    `Waqar Ahmed` 拥有超过十年网络安全专业经验，职业生涯卓越。他一直领导加固全球企业网络安全计划的工作，通过重塑政策和程序、差距分析、渗透测试以及开发和部署尖安全工具，展示了其敏锐的分析才智。他的经验包括与英国、新加坡、卡塔尔和阿拉伯联合酋国等不同国家的政府机构、金融机构和全球公司合作。


    Waqar 拥有伦敦皇后玛丽大学的网络安全硕士学位，将卓越的学术成就与实战经验相结合。他的教育历程培养了他严谨且结构化的思维方式，这种特质在他精心撰写的书评中得以充分体现。这种坚实的学术基础使
    Waqar 具备了分析技能，能够深入研究技术修正和文学改进的复杂层面。


    此外，Waqar 还获得了一系列认证，包括 `OSCP`、`CEH`、`CISSP`、`ECIH`、`ISO27001`、`认证区块链安全工程师`以及 `API
    安全架构师`。这些认证不仅强调了 Waqar 对持续学习的奉献，也增强了他批判性地评估环境和工具的能力。Waqar 在网络安全领域的认证证明了他对卓越的追求和细节的关注，这些品质无缝地延伸到了评论领域。


    除了学术成就和认证外，Waqar 还曾作为 `SANS HackFest` 的讲师分享了他的专业知识。在这里，Waqar 为听如痴的观众讲解了智能合约安全这一复杂话题——这证明了他能够清晰且权威地传播复杂思想的能力。


    本质上，Waqar 在书评艺术中融入了学术严谨性、实战网络安全经验以及对文学的热爱的独特结合。凭借卓越的资历和天生的剖析分析能力，Waqar 拥有丰富的学术背景和一系列认证，这些背景对于塑造他见解独到的书评方法至关重要。


    # 致谢


    我想感谢几位在本书写作期间向我提供持续支持的人。首先，我要感谢我的家人，他们不断鼓励我写这本书——如果没有他们的支持，我永远无法完成这本书。


    谢谢爸爸妈妈，这是送给你们的。爸爸，感谢你让我保持动力并及时跟进。妈妈，感谢你不懈的祈祷，让我顺利度过这段旅程。


    我感谢我不起的妻子 Ayesha，她从照顾孩子到准备美味的比利亚饭，并保持家庭安静让我能够专注，“非常感谢你，亲爱的。”


    接下来，我想感谢我来自尼科斯亚大学的校友和同事，我的区块链网络，以及整个 LinkedIn 庭，每当我演示和发布时，他们总是认可我的努力，并在我无知许多时一直在我身边。这激励了我不断向更远迈一步，这也是我想出要写这本书的初衷。


    我非常推崇我书的技术评审员 `Waqar Ahmed` 和 `Hasshi Sudler`，感谢他们周全的意见和可操作的反馈，确保我传达了正确的信息。


    我的感谢还来自 `Orange AVA` 团队，特别是编辑 `Sonali` 和 `Shubha`，他们确保了一切按计划进行，并确保书籍符合标准。


    # 前言


    区块链技术目前正在多个领域接受测试并投入应用。许多国家的中央银行也在研究如何利用区块链和分布式账本技术来解决长期存在的问题。从生产到银行服务，零售和电信是其他一些开始尝试可能用途的行业。


    讨论区块链安全比以往任何时候都更重要，因为如果不解决这个问题，它很快就会变成每个家庭的问题。没有理由将其听天由命或聘佣安全审计公司，尽管我们认为区块链由于使用了加密技术已经是安全的。所有参与区块链业务和技术的人都应该共同努力，确保设计是安全的，从代码到用户钱包，一直到基础设施的底层。存在一种极大的可能性，区块链协议的攻击或崩溃可能会导致经济、金融市场和企业面临更大的风险。


    本书分为 6 个章节。这些章节将涵盖公有链和私有链的安全设计、固有的安全能力和漏洞。章节触及了区块链风险识别、分类方法和工具，以及这些风险如何被进一步分析和利用。书的后半部分提供了修复措施和安全解决方案。有趣的是，在其中一个章节，作者讨论了避免加密诈骗的策略，以及受受害者如何追踪和追回资金的指南。


    各章节的详情列如下：


    `第 1 章` 将从区块链的基础知识、区块链类型、区块链用例和优势开始，然后涵盖 `bitcoin` 的技术设计，在其中解释了交易链、挖矿和真实性。最后部分涵盖了考虑到去中心化以及钱包和加密密钥处理的
    `Bitcoin` 安全。


    `第 2 章` 将涵盖区块链类型并解释 `Ethereum` 架构、智能合约和 `EVM` 设计。然后涵盖对 `EVM` 节点的深度安全审查、带有根源分析和安全建议的智能合约漏洞。最后一个主题涵盖了
    `hype ledger fabric` 架构和安全设计审查，以及私有链安全开发的最佳设计实践。讨论点围绕链代码漏洞、`MSP` 停时间考虑、密钥管理、治理和云部署原则，并配有案例。


    `第 3 章` 将涵盖区块链风险管理和区块链应用中的顶级安全风险。然后涵盖区块链风险识别方法和风险分析，我们深入讨论了分类场景，其中引入并解释了一个威胁建模工具，并说明了如何将其应用于钱包应用程序的案例。该章还强调了作为风险响应的缓解策略，通过示例和实验工作建议解决了威胁建模的攻击向量。


    `第 4 章` 将涵盖利用区块链应用程序的技术和工具。它从区块链渗透测试开始，解释不同的阶段，并触及漏洞扫描工具如 `Nessus`、`OpenVAS` 和
    `smart bugs 框架`，以深度分析 `solidity`、字节码和运行时代码。然后该章通过深入挖掘注入攻击和溢出攻击的 `CVE` 分析解释了利用阶段。我们还讨论了最后一个阶段，即攻击者通过
    `APT` 进展矩阵结合安全措施维持访问。章节的后半部分展示了智能合约如何被黑客攻击的示例，深入讨论了漏洞代码。该章结束关于保护智能合约的最佳安全实践和工具的建议。


