  trans: "\n\n**攻击场景：** John 正在向 Peter 发送一个文件，他不希望其他人看到它。然而，Henry 拦截了消息并读取了它。\n\n\
    - **完整性（Integrity）：** 数据的整体准确性、完整性和一致性构成了数据完整性。\n    - **示例：** 在员工数据库中，特定的 `employee\
    \ number` 及其姓名应该是主键。简单来说，如果 John 正向 Peter 发送一个内容为 `Y` 的 `X` 文件，那么 Peter 不应该收到一个内容为\
    \ `X` 的 `Y` 文件。\n    - **攻击场景：** 文件在未经授权的情况下被访问并被修改，以反映授权用户意图之外的信息。例如，John 仅向\
    \ Peter 发送一个 `X` 文件，因为他不希望任何人修改或更改文件内容。然而，Henry 拦截了该文件，并将文件内容从 `X` 更改为 `Y`。\n\n\
    - **可用性（Availability）：** 你的数据被你自己的组织或合作伙伴利用的频率被称为数据可用性。理想情况下，你的数据应该是 24 小时、全年\
    \ 365 天可访问，从而确保你的业务能够不间断地运行。\n    - **示例：** 服务客户应用程序的数据处理服务器正常运行，不受中断。可用性保证了用户可以任何时候访问系统、应用程序和数据。\n\
    \    - **攻击场景：** John 的笔记本操作系统由于勒索软件而崩溃，无法访问或使用，因此他无法向 Peter 发送任何数据。\n\n- **可追溯性（Traceability）：**\
    \ 发生在你的服务器或网络上的任何数据事件都可以通过其主体（无论是人类用户还是非人类用户）进行识别。它是定位特定内容或消息来源的能力。\n    - **示例：**\
    \ 为了跟踪所有数据访问和修改，数据可追溯性遵循数据的生命周期，为法律和质量保证团队提供审计轨迹。\n    - **攻击场景：** Peter 收到了了一封来自\
    \ John 的消息，但他无法确定该消息是否真的来自 John。溯源为我们提供了所需的实时数据，以便检测并停止攻击。\n\n现在，让我们来看看在区块链安全属性的语境下，这一切是如何联系起来的。我们需要查看区块链安全生态系统是否在\
    \ CIAT 伞下保护用户。让我们从 `Public blockchains`（公共区块链）的角度来看。\n\n# 区块链中的机密性（Confidentiality）\n\
    \n区块链中交易的双方在对方揭示该信息之前，不应被未经授权的第三方识别身份。\n\n其次，除非交易双方不披露自己的信息，否则交易细节对任何非交易方的人都是不可见的。\n\
    \n在区块链网络中，不涉及中间人，这意味着如果 John 向 Peter 发送交易且没有打算将其提取到银行账户，他只需要有一个钱包即可。没有像支付网关那样的银行或金融机构来促进交易。借此，发送者和接收者之间不会共享任何个人信息。分布式网络位于\
    \ John 和 Peter 之间，通过签名到公钥映射以及执行数学方程对该交易进行验证。\n\n相反，一种被称为 `public key`（公钥）的字母数字数字字符串是识别区块链上交易的唯一方式。该密钥使得比特币中的交易呈现伪匿名状态。这意味着，尽管其他人可以查看你的持仓和交易，他们也无法确定\
    \ `public key` 后的真实身份是谁。虽然知道 `public key` 允许你看到所有的交易历史，但实际身份（如姓名和地址）未知的这一事实并不会引起任何担忧。\n\
    \n关于公共区块链网络的机密性有两个主要的关注点。第一是任何人都会去第三方（如钱包提供商和中心化交易所）来存储或交易加密货币的点。他们会以账户注册的形式消耗个人信息。\n\
    \n其次，实际处理区块的网络矿工可以看到看到 `public key` 持有者拥有多少钱。然而，由于奖励的经济因素和公平竞争规则，降低了任何利用区块信息的滥用行为。\n\
    \n# 区块链中的数据完整性（Data Integrity）\n\n它应该保证写入区块链的数据是准确的，并且在未来不能被更改。此外，区块链仅允许授权方添加交易，一旦交易提交，以后就无法否认。\n\
    \n由于每笔交易都是不可不可变的，在完成后对其进行编辑是非常困难的。没有方法可以撤销或取消任何交易。\n\n区块链通过以下方式实现数据完整性：\n\n- 在区块链挖掘过程中，每个区块由一个\
    \ `hash value` 表示。任何数据的更改都会导致不同的 `hash`。\n- 除了创世区块（genesis block）外，每个区块都代表了其邻接区块的\
    \ `hash`。因此，对任何区块数据的任何更改都会破坏链。\n- 由于节点的分布，维持了一致性。在区块链网络中，节点是点对点分布的，添加任何新区块都意味着网络中的每个参与者都必须更新他们的记录。把这比作\
    \ WhatsApp 群：群中的任何新消息都会到达每个群成员处，每个人都会有一个副本。\n\n# 区块链中的数据可用性（Data Availability）\n\
    \n区块链系统抵抗故障和攻击的能力被称为可用性。在区块链中，数据应该对所有参与节点都是可用的。这是区块链技术固有的特性。可用性领域主要的关注点是拒绝服务攻击（DoS）或分布式拒绝服务攻击（DDoS）。然而，考虑到验证过程中涉及的数百万个节点，少数节点的崩溃不会产生任何影响，挖掘过程将继续进行。\n\
    \n然而，如果你查看用户操作的终端，如钱包、`APIs` 和交易所，生态系统的任何网络实体都可能被利用。在讨论私有链时，关于可用性方面有很多要说的。\n\n\
    # 区块链中的可追溯性（Traceability）\n\n可追溯性也被非否认原则（non-repudiation）。简单来说，一个人无法否认接收或发送它；交易应该能够追溯回发送者而不被篡改。最后，消息的接收者可以读取它，在区块数据更新到链之前，网络中的其他人无法查看它。让我们将这一切魔法拆分为两类。\n\
    \n首先，区块通过 `hashing reference code` 是不可变的，这意味着数据无法更改或修改，这是我们之前讨论过的话题。因此，存储在某个区块中的任何信息（例如\
    \ `block 1`），即使你的链中达到了 100 万个区块的信息，也是可见且可追踪的。\n\n其次，过程中的发送者身份验证涉及矿工对发送者的验证、数据跨链的加密流，以及发送者能够解密消息。这一切都是在密码学的帮助下完成的。\n\
    \n"
