    Compensating controls are a good way to check how much the solution is secure
    if the direct security controls are missing. It also ensures the defense''s in-depth
    coverage. If the attack launches a sophisticated attack, it prevents the attacker
    to penetrate further, moving laterally within the network.


    # Top security risk in blockchain


    Blockchain security risk can be broadly categorized into four main categories,
    as shown in [Figure 3.4](#fig3_4). Each of these categories can be further divided.
    However, to start assessing your blockchain solution, you need to see how you
    are handling these risks.


    ![](images/Figure-3.04.jpg)


    **Figure 3.4:** Blockchain Risk Ecosystem


    # Technology stack


    Blockchain protocol has some underlying features such as cryptographic keys, consensus
    mechanisms, confidentiality concerns, availability drawbacks, process logic of
    smart contract layer, and validation nodes.


    Risk management of the protocol stack is equally as important as any other domain.
    Let me explain further by breaking down each element.


    *   Cryptographic keys created to store digital assets are an integral part. Considerations
    include how the keys are created, shared, stored, and managed throughout the lifecycle.
    Is there enough awareness given to the user to handle their sensitive keys? How
    are funds restored if a user loses their keys?

    *   Validation nodes pose a potential security risk. How are the nodes patched
    and configured? Is there any endpoint detection and response tool configured to
    detect malicious events and take responsive actions?

    *   Has secure development practice been adopted to develop the App throughout
    different layers, from UI to Smart contact, extending all the way to the infrastructure?

    *   How is the availability risk addressed? What happens if the blockchain networking
    nodes are compromised? Is a Disaster recovery plan prepared to recover services
    through backups? What is the Recovery time objective (`RTO`) and Recovery point
    objective (`RPO`) metrics and have they been tested?

    *   Are the performance checks been performed on the application and underlying
    blockchain platform in terms of measuring transaction throughput, settlement time,
    CPU, I/O, and memory utilization.

    *   Are there standards that can be used to connect blockchain apps to enterprise
    systems?


    The recommendation is to perform due care and due diligence and apply a defense-in-depth
    strategy to each layer of the technology stack, which means securing data confidentiality,
    integrity, and availability while designing the architecture.


    Controls should be designed for hardening and the store of the public/private
    keys, addressing application, infrastructure and smart contract vulnerabilities,
    and strong consideration for consensus committee delegations.


    # Regulatory and Data privacy


    The privacy risk deals with how the sensitive data call flow is handled within
    the blockchain architecture and which regulatory framework applies to your solution
    in your jurisdiction. The checks include the following:


    *   Could non-compliance with data-related regulations or confidentiality agreements
    result from design flaws in a blockchain-based system? For example, does the application
    include by and by recognizable data personally identifiable information (`PII`)?
    Do the requirements require data to be stored off-chain, or can it be stored on-chain?

    *   Does the application have the right controls in place throughout the data
    lifecycle, such as when data is collected or created, stored, used, and shared
    between blockchain nodes?

    *   Is there a gamble of openness of delicate information because of insufficient
    strategies, methods, principles, and rules for information encryption and confusion?

    *   Is there a possibility of incorrect data entering the system? If so, how can
    errors be identified and corrected?

    *   Is it necessary for the blockchain system to adhere to regulations regarding
    the `right to be forgotten`? If so, does it conflict with the possibility that
    data stored on a blockchain cannot be changed?

    *   Is there a legal requirement indicating that data must be seen by certain
    participants, with strong access and security control enforced on Personal Identifiable
    information, known as `PII`? If so, then implementing such a policy across thousands
    of computers in a network requires a massive amount of infrastructure and resources.

    *   How are the smart contracts perceived legally in your jurisdiction?

    *   Are the Anti-money laundering (`AML`) and know your customer (`KYC`) checks
    are passed?

    *   Are there ways to make sure that money does not go to or come from people
    or countries that are subject to international penalties or the position of `politically
    exposed person`?


    The general rule of thumb is to always set up the data privacy framework of your
    blockchain solution by understanding the compliance requirements around data management
    in your jurisdiction. The second is to collect the minimum amount of data to avoid
    spending too much on maintenance and compliance. Last, but not least, consult
    with a lawyer and make sure your blockchain solution is properly audited from
    the legal standpoint.


    # Governance


    Governance risks emanate primarily from the decentralized nature of blockchain
    solutions and require strong controls on decision criteria, governing policies,
    and handling of security incidents.


    Here are some checklists you can go through while setting up a governance model:


    *   How will incident, fault, and change management be handled for any operational
    issue?

    *   Do we have any policy and guidelines, or `RACI` matrix defined for different
    teams across various domains in the blockchain solution?

    *   Consistency on the accountability and auditing criteria for different design
    and operational phases.

    *   How will the Security baseline golden configuration will be maintained?

    *   Security policy regarding bringing in new vendors, integration with `APIs`,
    blockchain exchanges, and protocols.

    *   What Security standards are to be followed for interoperability?

    *   How will communication be conducted with internal and external stakeholders
    upon any incident?

    *   How is the liquidity risk taken care of? how are the disputes handled? in
    the traditional business model intermediary take on the counterparty risk and
    resolve disputes.

    *   How is the Permanence or the data immutability will be handled incase if the
    transaction or the smart contract needs to be revised? When people carry out a
    deal through a smart contract, they usually can''t go back on it. When two people
    use a third party''s smart contract system, they can''t back out of the deal or
    change its rules.


    **Note**


    *To make changes to the smart contract, you must stop the old one and start a
    new one with the new terms, however the parties holding the private key of the
    contract can only modify the contract if the code allows it.*


    The best way to tackle data governance issues in your blockchain solution, is
    to design a data governance program by firstly defining objectives and policies
    around all above points, Next is to set desired outcomes and identify key stake
    holders. The policy objectives should meet the organizational goals and stakeholders
    should take the ownership. Lastly, ensure if the policies defined are getting
    executed and measured.


