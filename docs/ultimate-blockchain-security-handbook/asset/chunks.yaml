    In summary, following are the takeaways:


    Formal verification can reliably identify bugs that testing and auditing frequently
    overlook, such as self-transfers or tricky arithmetic overflows.


    The cycle requires a lot of manual work, a lot of it profoundly talented and consequently
    costly.


    Formal verification has become practical today. I believe that the cost is comparable
    to that of a thorough human audit and that it boosts confidence for both the contract
    owner and the customers signing the contract.


    The field of smart contracts is distinct and specialized. This increases the power
    of formal verification. Full verification is less expensive because of smart contracts''
    small size as compared to non-blockchain projects. The domain only contains a
    few key concepts, making it easy to adapt the tools to it; further lowering costs
    and enhancing efficiency.


    # [Bug Bounty Program](#toc.xhtml#s100a)


    So, are you sure that your systems will survive cyberattacks? The best way to
    find out is through a bug bounty program. Before we start any further, I want
    to emphasize again that security should be the number one priority for you if
    you are building a blockchain project, because if hackers can see it, they will
    surely be targeting it.


    You must be wondering why we have already covered penetration testing, threat
    modeling, security auditing, formal verification, and so on. earlier in the book,
    and where bug bounty fits in the list. These are all good considerations, so let
    me decipher this by first explaining what bug bounty programs are and how they
    work.


    A blockchain Bug Bounty is a reward program set up by organizations for ethical
    hackers to identify and exploit blockchain applications in exchange for a reward.
    There are a few reasons why a blockchain Bug Bounty program is important. First
    and foremost, they successfully identify and resolve software based on blockchain
    issues. It is to be noted that as blockchain applications expand more in scope
    due to their being distributed and decentralized than any other centralized application,
    the potential attack surface also expands as the ecosystem builds. Such a program
    can aid in the prevention of potential attacks and safeguard user funds by locating
    and resolving issues before they go to production.


    It also gives non-monetary incentives to hackers, where not only they can enhance
    the decentralized web''s security but also can improve their standing in the community.


    It is a three-step process, which starts with security assessment, reporting,
    and reward distribution.


    *   **Assessment**: It is requested that ethical hackers evaluate the software''s
    security. The goal of this is to find any potential problems with the software
    by going over the code, infrastructure, and user interface of the software thoroughly.


    *   **Reporting**: The ethical hacker is obligated to report any problem they
    find to the project or business offering the bounty. A thorough explanation of
    the problem and its potential exploitation ought to be included in the report.


    *   **Distribution of reward**: A bounty is paid to the ethical hacker if the
    problem is found and resolved. The amount of the bounty varies based on the severity
    of the problem. This is because it is necessary to consider the consequences that
    could result from exploiting the problem.


    # Pen testing vs Bug Bounty


    Now you must be thinking is this another name given to penetration testing. No,
    it is not true, both are different. It’s just that you have expanded the pen testing
    to a bigger community with no time restrictions. You can do it anytime you feel
    like it, depending on your organization’s risk appetite. It is recommended to
    do a bug bounty program twice a year.


    Another key difference is the company receives a payment for each vulnerability
    discovered through a bug bounty. The hacker is compensated according to the severity
    of the vulnerability once a vulnerability report is confirmed to be accurate.
    Therefore, ethical hackers are compensated for the results of their hunts, and
    not for the amount of time they spend hunting.


    The project is billed for pen testing. The scope, duration, required skills, and
    number of pen testers, all play a role in determining the project''s overall cost.
    The number of vulnerabilities discovered during the pen test has no bearing on
    the amount billed to the client organization.


    For details on the smart contract audit, please visit **[https://www.immunebytes.com/blog/what-is-a-smart-contract-audit/](https://www.immunebytes.com/blog/what-is-a-smart-contract-audit/)**


    For more details on bug bounties, please visit **[https://medium.com/immunefi/a-defi-security-standard-the-scaling-bug-bounty-9b83dfdc1ba7](https://medium.com/immunefi/a-defi-security-standard-the-scaling-bug-bounty-9b83dfdc1ba7)**


    In addition, there are interesting case studies where the negotiations took place
    with the hackers in which some portion of the funds are returned. More can be
    found at **[https://www.certik.com/resources/blog/4wD02hUnaJlHPfAi0TPHdK-a-grey-area-retroactive-bug-bounty-negotiations](https://www.certik.com/resources/blog/4wD02hUnaJlHPfAi0TPHdK-a-grey-area-retroactive-bug-bounty-negotiations)**


    # [Conclusion](#toc.xhtml#s101a)


    Well done, in making it to the end of this chapter. This chapter covers a complete
    suite of tools and recommendations on blockchain testing, in particular smart
    contracts testing. We learned different testing techniques from manual to automated,
    and then we covered formal verification of smart contracts and looked at case
    studies and examples. Then, we looked at the independent type of audits, such
    as bug bounty programs, in which white hackers get involved. With all this information,
    your blockchain project will be in good hands; you now have enough armory that
    would make attackers think several times before attempting an attack.


    In the next chapter, we will look at the various type of mitigation solutions
    that you can adopt, from Identity access management to public key infrastructure.
    We will also discuss infrastructure security measures for various deployment models.


    # [Points to Remember](#toc.xhtml#s102a)


    *   Smart contract testing has gained momentum over the years and several tools
    have been introduced. Remember to start with manual testing, and then adopt automated
    testing to expedite the process.


    *   Bugs coming out of the Unit and integration testing should be mitigated. Integration
    tests evaluate the entire smart contract, whereas unit testing debugs individual
    contract functions.


    *   If your contract has a modular architecture or interacts with other on-chain
    contracts during execution, integration testing is helpful.


    *   Hardhat, Brownie, and Foundry: Using these tools allow you to expedite your
    solidity testing. They provide built-in fuzz testing, which means injecting invalid,
    malformed, or unexpected inputs into a system to reveal software vulnerabilities.


    *   Formal verification, in contrast to testing, can be used to check that an
    execution of a smart contract satisfies a formal specification for all executions.


    # [References](#toc.xhtml#s103a)


    *   **[https://soliditylang.org/](https://soliditylang.org/)**


    *   **[https://ethereum.org/en/](https://ethereum.org/en/)**


    *   **[https://runtimeverification.com](https://runtimeverification.com)**


    *   **[https://forum.openzeppelin.com/t/formal-verification-of-open-zeppelin-contracts/3871](https://forum.openzeppelin.com/t/formal-verification-of-open-zeppelin-contracts/3871)**


