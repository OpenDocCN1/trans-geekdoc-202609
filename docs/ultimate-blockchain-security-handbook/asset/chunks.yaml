- raw: 'Another type is non-interactive proof, which requires only one round of communication.
    In this case, the prover gives the secret information to an algorithm to generate
    a zero-knowledge proof. This proof is then sent to the validator, who uses a different
    algorithm to check if the prover knows the secret information.


    Non-interactive proving makes ZK-proofs more efficient since both the prover and
    the checker do not have to talk to each other more frequently. Also, once a proof
    is made, anyone who has access to the shared key and the verification method can
    check it. This can be divided into two groups.


    # ZK-SNARKs


    ZK-SNARK stands for Zero-Knowledge Succinct Non-Interactive Argument of Knowledge.
    The ZK-SNARK algorithm has the following features:


    *   **Zero-knowledge:** A validator can confirm the truthfulness of a statement
    without knowing anything else about it. The only thing known to the person doing
    the checking is whether the statement is true or false.


    *   **Succinct:** The zero-knowledge proof is smaller than the witness and can
    be quickly checked.


    *   **Non-interactive:** The proof is not interactive because the prover and the
    checker only talk to each other once. Interactive proofs, on the other hand, require
    more than one round of conversation.


    *   **Argument:** The proof meets the "soundness" requirement, so cheating is
    extremely improbable.


    *   **(Of) Knowledge:** The zero-knowledge proof cannot be made without access
    to the secret information (the witness). A true zero-knowledge proof is hard,
    if not impossible, without the presence of the witness.


    Note that the shared key that is used in the algorithm to calculate proof should
    be handled carefully, if the nonce, or the unique value it is made up of, has
    been taken down, false proof can be calculated.


    The key ceremony process, or multi-party computation, is the process that can
    be adopted to strengthen the parameters. For example, in multi-party computation,
    the participants in a network each provide an input.


    # ZK-STARKs


    ZK-SNARK stands for Zero-Knowledge Scalable Transparent Argument of Knowledge.
    ZK-STARKs are similar to ZK-SNARKs, except for the following features:


    *   **Scalable:** ZK-STARK makes and checks proofs faster than ZK-SNARK when the
    size of the witness is large. With STARK proofs, the time it takes to prove and
    verify doesn''t change much as the number of witnesses grows. With SNARK proofs,
    on the other hand, the time it takes to prove and verify grows linearly with the
    number of witnesses.


    *   **Transparent:** To create public conditions for proving and verifying, ZK-STARK
    uses randomness that the general public can check instead of a known context.
    So, when compared to ZK-SNARKs, they are clearer.


    To understand more about the application and to make sense of what we have studied
    so far, let’s look at their use cases.


    # Use cases for Zero-Knowledge Proofs


    There are several use cases where zero-knowledge proofs are useful. Not being
    able to collect user information can help the platform owners avoid the risk of
    any potential data compromise. The use cases range from not revealing your driving
    license, pay stubs, W-2s, and proof of residence all the way to sharing your college
    transcripts. For me, the best application of ZKP lies in the financial ecosystem
    due to its complex nature and high regulatory oversight. The second application
    is in the WEB3 space, especially in the DeFi ecosystem. By decoupling data from
    layer 2, you can solve the scalability issue on the blockchain.


    # Decoupling Identity in Payments Infrastructure


    Card payments are often visible to multiple parties as part of the payment trail
    infrastructure, which includes merchants who handle the Point-of-sale terminals
    (POS), payment gateways and processors like banks and financial intermediaries,
    and other interested parties (for example, government authorities). All these
    entities collect user and payment-related information. While financial surveillance
    has benefits for identifying illegal activity and is part of the standard of cash
    flow, it has undermined the privacy of ordinary citizens. If those databases come
    under attack, then it''s a different ballgame.


    Then, if you look at cryptocurrencies, they were created so that people could
    make private and peer-to-peer transactions with each other. However, on public
    blockchains, most of the crypto activities are public and can be seen by anyone
    if the public key or transaction ID is known. User identities can be established
    and linked to real-world identities either on purpose (by putting ETH addresses
    on Twitter or GitHub pages, for example) or by using simple on-chain and off-chain
    data analysis with the help of forensic firms like CNC intelligence or chain analysis.


    It is critical to understand that most crypto transactions get terminated at exchanges,
    where the users must cash out the cryptocurrency in fiat. All exchanges know the
    identity of the users, so they end up getting personal information upon registration.


    ZK Proof will help individuals and associated parties prove their valid identity
    to financial entities, without the exchange of personal data. This will also save
    on the cost of managing and securing the data. This doesn’t mean that the financial
    surveillance would face obstacles; any regulatory entity or platform can request
    or revoke the validation if the proof conditions are not met.


    # Improving WEB3 Layer 2 Protocols


    Scaling blockchain networks to support the demand is challenging. As demand for
    block space on layer-1 increases, it leads to network congestion and high transaction
    costs, which in turn reduces the demand and growth of Web 3. Just to recall, layer-1
    is the asset layer, like ethers, and layer 2 is where consensus happens.


    A zero-knowledge solution can batch up thousands of transactions and then publish
    a zero-knowledge proof, like a message hash, validating the correctness of transactions
    on the underlying layer-1 blockchain. These proofs require far less space than
    complete transaction data, helping relieve layer-1 network congestion while creating
    a highly secure environment with high throughput and low transaction costs. An
    example of such a solution is known as ZK-rollups, which have two versions falling
    under the ZK-SNARK and STARK categories. There are also a few other protocols.
    *[Figure 6.2](#c06.xhtml#fig6_2)* provides a good view.


    ![](images/Figure-6.2.jpg)


    **Figure 6.2:** Examples of projects using different zero-knowledge solutions


    # [Application of Zero-Knowledge Proof](#toc.xhtml#s108a)


    To help solve the identity problem and achieve zero-knowledge proof, we welcome
    Self-Sovereign Identity (SSID), which enables users to own, control, and present
    their identity data as needed while enabling service providers to securely validate
    and trust the identity claim.


    So how does this magic happen? Let me explain this concept with the help of the
    following illustration. It comprises three parties: one is the claim holder, which
    is the user, the other is the claim verifier, which needs proof; and the last
    party is the claim issuer, who certifies that the claim is legitimate.


    The other important component is the decentralized identity tag, commonly known
    as the DID, which is stored on the blockchain. The issuer and the holder both
    sign the DID before storing it on the chain. Any verification needed by the verifier
    should happen after consent is given by the claim holder. Afterward, the verifier
    can query the blockchain to check the claim. He will find the digital signature
    of the claim issuer, allowing them to verify its authenticity. Here, the verifier
    does not even need an actual copy of the data from the prover. The digital signatures
    in the claim of the prover and the issuer will be enough to prove that the information
    he is requesting is accurate.'
