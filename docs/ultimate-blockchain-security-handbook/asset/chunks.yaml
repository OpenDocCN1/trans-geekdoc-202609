    \ peers, or just moving and storing data—can be solved by using blockchain.\n"
  trans: "\n既然你已经详细了解了比特币的工作原理及其生态系统，让我们进一步剖析它，以了解漏洞存在于。如果你在之前所有的解释中注意到了，这归结为核心概念：去中心化、P2P\
    \ 网络、钱包密钥、交易所、比特币源代码、矿池操作以及支撑链的比特币网络节点。\n\n## 去中心化方面\n\n去中心化是比特币的核心，它具有重大的安全影响。像比特币这样的去中心化系统赋予了用户控制权和责任。网络的安全性基于\
    \ `Proof-of-Work`（工作量证明）而非访问控制，因此它是开放的。`Bitcoin Core` 本质上是一个用于连接比特币网络并运行节点的开源软件。虽然任何人都可以建议修改，但并非所有提议的代码修改都会被纳入\
    \ `Bitcoin Core`。相反，每一项提议的更改在决定接受或拒绝之前，都会由社区进行彻底的审查和辩论，安全性由整个社区共同维护。\n\n如果你将其与传统的支付系统（该系统包含用户的私有标识符，即信用卡号）相比，后者在像信用卡系统这样的传统支付网络上是开放的。任何可以访问该标识符的人都可以“取走”资金，并在初始扣款后对所有者多次收费。\n\
    \n因此，支付网络必须从头到尾加密，以确保窃听者或中间人都不会在交易传输或存储（静态）期间破坏支付流量。如果恶分子获取了系统的权限，可能会同时破坏现有的交易和用于创建新交易的支付令牌。更糟糕的是当客户数据泄露时，客户面临身份盗窃的风险，必须保护他们的账户免受欺诈使用。\n\
    \n比特币的去中心化安全模型赋予了用户大量的控制权。保持密钥保密的责任也随之而来。这对于大多数用户来说，特别是对于连接到互联网的手机和笔记本电脑等通用计算设备用户来说是非常困难的。尽管比特币的去中心化模型防止了像信用卡那样的大规模破坏，但许多用户未能充分保护他们的密钥，导致一个个被黑客攻击。\n\
    \n## 密钥与交易的处理\n\n比特币的安全性取决于矿工独立地验证交易以及对密钥的去中心化控制。为了利用比特币的安全性，必须遵循比特币安全模型。简单来说：不应赋予用户密钥的控制权，也不应从区块链上移除交易。避免将密钥的托管权交给交易所或第三方。在进行密钥备份时，要尽到尽职调查。\n\
    \n由于网络始终连接，我们的计算机不断暴露在外部威胁之下。它们经常拥有对用户文件的无限制访问权限，并运行来自数百位作者的数千个软件组件。在安装在你计算机上的数千个恶意程序中，单个恶意软件就可以破坏你的键盘和文件，盗取存储钱包应用程序中的任何比特币。只有极少数计算机用户能够执行维护无病毒无木马计算机所需的计算机维护。因此，这是需要关注的一个漏洞领域。\n\
    \n另一个常见的错误是为了试图加速交易处理或降低交易手续费而“将交易从区块链上移除”。交易将记录在“离链”系统中的内部中心化账本上，并偶尔与比特币区块链进行同步。再次，这种做法使用专有且中心化的方法来取代去中心化的比特币安全性。安全性不足的中心化账本在离链期间可能会被篡改。\n\
    \n## 结论\n\n祝喜完成第一章！在下一章中，我们将查看以太坊等其他变体。\n\n## 记忆点\n\n*   区块链是一套技术，并且很有用。\n*  \
    \ 区块链不是货币，而是去中心化的。\n*   区块链可以应用于任何行业。\n*   去中心化的本质和加密学功能提供了安全性。\n*   比特币的漏洞领域是钱包密钥和交易。\n\
    *   在涉及……时需要尽职调查。\n\n## 参考文献\n\n*   `https://www.baeldung.com/cs/prime-numbers/`\n\
    *   `https://cypherpunks.github.io/bitcoinbook/`\n*   `https://research.aimultiple.com/case-studies/`\n\
    *   `https://learnmebitcoin.com/technical/longest-chain`\n*   `https://bitcoin.org/`\n\
    \n## 选择题\n\n1. **区块链包含？**\n    a. 点点网络\n    b. 加密算法\n    c. 共识算法\n    d. 以上所有\n\
    \n2. **区块链中的区块包含什么？**\n    a. 哈希值 (Hash)\n    b. 比特币\n    c. 随机数 (Nonce)\n   \
    \ d. 交易账本\n    e. 姓名和地址\n\n3. **哈希提供了哪种安全原则？**\n    a. 机密性\n    b. 完整性\n    c.\
    \ 可用性\n    d. 以上所有\n\n4. **为什么我们在钱包中使用私钥？**\n    a. 解锁未花费的交易\n    b. 签名交易\n  \
    \  c. 查看交易\n    d. 以上都不是\n\n5. **公钥的作用是什么？**\n    a. 识别用户\n    b. 签名交易\n    c.\
    \ 挖掘交易\n    d. 存储交易\n\n## 答案\n\n1. **d**\n2. **a, b, c, d**\n3. **b**\n4. **a,\
    \ b**\n5. **a**\n\n## 第二章\n\n## 区块链安全变\n\n## 引言\n\n目前区块链有许多应用场景：成千上万的加密货币项目、数百个运行中的区块链应用程序，以及数十亿美元的市场资金流入这项新技术。我还会补充一点，我们在金融生态系统中面临的大多数问题——从银行贷款、向同伴发送资金，或仅仅移动和存储数据——都可以通过使用区块链来解决。\n\
    \n"
