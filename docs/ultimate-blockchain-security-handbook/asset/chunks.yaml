    Web 攻击（如跨站脚本、SQL 注入和后门）在此阶段被用于寻找目标的弱点。道德黑客随后尝试并利用这些弱点，通常通过提升权限、获取信息、捕获流量等，以理解它们可能造成的伤害。


    这的一个例子是 SQL 注入攻击，它是目前 web3 行业中最普遍的 Web 黑客攻击之一，攻击者利用网站页面贡献在 SQL 语句中嵌入有害代码。这通常发生在网站请求输入时。`Figure
    4.8` 展示了该快照。


    # 维持访问 (#toc.xhtml#s77a)


    此阶段旨在确定是否可以利用漏洞建立长期存在。其目标是模拟高级持续威胁，它们经常留存在内部以挖掘敏感数据。


    在这里，我想向你们介绍 `APT`（高级持续威胁）。`APT` 是一个广术，指的是入侵者或入侵者小组在网络上建立非法的长期存在以挖掘数据的攻击活动。


    通过 APT 攻击与传统应用程序威胁的区别，我列出了以下检查点：


    - 它们明显更加复杂。

    - 它们不是击完就走的攻击，意味着一旦渗透网络，它们就会留下来发现更多。

    - 它们不是针对特定目标的自动化，而是针对大池执行的。


    - ……等等。


    `Figure 4.9` 提供了 APT 进展及一些安全措施的细节。


    ![](img/Figure-4.9.jpg)


    **图 4.9：** APT 进展矩阵


    # 分析与报告


    渗透测试人员必须在此阶段完成所有工作，密切关注他们所的一切，特别是在发现和利用过程中。为了提供一份突出显示成功渗透 dApp 的方法、以及发现的任何安全缺陷和其他相关发现信息的报告，他们正在分析每一个细节和步骤，深入研究每个问题并制定减少漏洞的策略。


