    以下是 SSI 设计图，它展示了流程的不同部分。其目标是让持有主张的人能够向检查者证明该主张是真实的。


    ![](img/Figure-6.3.jpg)


    **图 6.3：** 自主身份（SSI）高层架构


    此外，零知识证明也被应用于 `Zerocoin` 和 `Zerocash` 协议中，这导致了加密货币 Zcoin 的开发，其随后更名为 Firo，然后是 Zcash。Zerocoin
    具有内置的混合模型，该模型不信任对等节点或中心化的混合源，以确保交易的匿名性。


    # 身份与访问管理 (IAM)


    在互联网上你是谁？你在网页上分享了多少个人信息？随着我们越来越多的生活在在线上，并且数字世界与物理世界建立了更紧密的联系，我们的电子身份正变得和现实生活中的身份一样重要。验证你的身份并确保对互联网上个人信息的访问安全，现在是个人和组织在现代世界中运行的关键组件。


    事实上，身份管理是任何网络基础设施不可或缺的一部分，无论你拥有的是公共区块链还是私有区块链。如果你有一套健壮且具韧性的身份管理解决方案，那么大多数网络攻击都可以被缓解。


    通常情况下，它由流程、策略和技术组成，以确保只有授权人员才能访问技术资源、信息或服务。这些系统不断演进以提高安全性和用户体验。一个常见的例子是“了解你的客户”（KYC）流程，用户在应用程序中注册以使用其服务。首先，用户输入其姓名、电子邮件
    ID 和电话号码，在这些凭据被接受并分配给他们之前，需要通过后端过程进行身份验证和校验。


    关于区块链如何在身份与访问管理中发挥重要作用，有大量的内容和讨论，其具有不可篡改性、智能合约和密码学等显著特征。因此，为了铺垫背景并构建语，在本主题中，我们采取相反的立场，即安全加固的访问控制解决方案如何帮助区块链项目。换句话之，执行身份验证、授权和审计（AAA）如何增强区块链网络并帮助减少漏洞。


    如果你观察区块链网络及其生态系统，它包含了协议的技术栈（例如，比特币、以太坊和 Hyperledger），以及基础设施和互操作组件，如 `Wallets`（钱包）、`APIs`、网络节点以及
    `Layer 1` 和 `Layer 2` 协议。数据资产分布在多个层级，根据数据流和日常操作，人类用户和机器用户都有访问性需求。


    访问用例有多种，其中几个包括：


    *   私有区块链网络需要对验证节点进行身份验证和授权，以便执行共识操作。

    *   区块链移动端或 Web 应用程序需要用户注册。

    *   智能合约代码用于检查对合约进行的任何调用是否合法。

    *   区块链应用程序的后端管理员正在对客户投诉进行故障排除。

    *   区块链开发者和质量保证团队正在集成新功能。

    *   预言机（oracles）之间进行 `API Calls` 以查询区块链上的数据。


    现在，有了所有这些用例，如果妥采取身份验证措施，你将不知道请求是由伪造用户还是合法用户发出的。将不知道发起请求的人或机器是否被允许查询该数据。无论我们是否记录了每个请求查询，这都有助于追溯否认攻击。


    另一个考虑因素是我们有不同类型的区块链，例如公共区块链和联盟链/私有区块链。大多数私有链构建在 `AWS` 等公有云上，而对于 Dapps、钱包、共识层和智能合约的访问控制是公共区块链不可或缺的一部分。因此，让我们从区块链应用类型来看
    IAM。


    # 公共区块链的身份与访问管理


    互联网是一个做生意的危险地方。如果你不知道谁在与你通信，或者一个已知用户正在访问资源，那么你会有麻烦。类似于单点登录（SSO），允许内部人员访问并限制他们。


    让我们从区块链应用类型的角度来看 IAM。我们通过图 6.4 尝试说明这一概念。如你所示，当钱包或去中心化应用想要连接网络时，请求必须经过身份验证和授权。


    如图 6.4 所示，身份管理服务器与活动目录连接，对请求进行身份验证并将令牌传递。IAM 服务器可以定义策略和角色。例如，访问智能合约的管理员允许更改功能，而普通钱包用户可以在区块链上提交交易。


    ![](img/Figure-6.4.jpg)


    **图 6.4：** 区块链的身份与访问管理架构


