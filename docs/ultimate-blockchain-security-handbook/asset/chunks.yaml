  trans: '


    另一种类型是非交互证明，它只需要一轮通信。在这种情况下，证明者将秘密信息提供给算法以生成零知识证明。然后将此证明发送给验证者，验证者使用不同的算法来检查证明者是否知道秘密信息。


    非交互证明使得 ZK 证明更加高效，因为证明者和检查者不需要频繁地相互通信。此外，一旦生成证明，任何拥有共享密钥和验证方法的人都可以进行检查。这可以分为两类。


    # ZK-SNARKs


    ZK-SNARK 代表零知识简洁非交互知识论证（Zero-Knowledge Succinct Non-Interactive Argument of Knowledge）。`ZK-SNARK`
    算法具有以下特征：


    - **零知识**：验证者可以在不知道关于陈述任何其他信息的情况下确认陈述的真实性。检查者唯一知道的是该陈述是真是假。

    - **简洁**：零知识证明比见证（witness）更小，并且可以快速检查。

    - **非交互**：该证明不是交互性的，因为证明者和检查者只通信一次。相比之下，交互式证明需要多轮对话。

    - **论证**：证明满足“可靠性”要求，因此作弊极不可能。

    - **（之）知识**：如果没有访问秘密信息（见证），就无法生成零知识证明。如果没有见证的存在，真正的零知识证明是非常困难的，甚至是不可能的。


    注意，算法中用于计算证明的共享密钥应该谨慎处理，如果 `nonce`（或其组成的唯一值）被泄露，就可以计算出虚假的证明。


    密钥仪式过程（或多方计算）是一种可以用于加强参数的过程。例如，在多方计算中，网络中的参与者各自分提供一个输入。


    # ZK-STARKs


    ZK-SNARK 代表零知识可扩展透明知识论证（Zero-Knowledge Scalable Transparent Argument of Knowledge）。`ZK-STARKs`
    与 `ZK-SNARKs` 类似，区别在于以下特征：


    - **可扩展**：当见证尺寸很大时，`ZK-STARK` 生成和检查证明的速度比 `ZK-SNARK` 快。使用 `STARK` 证明，随着见证数量的增加，证明和验证所需的时间变化不大。相反，使用
    `SNARK` 证明，证明和验证的时间会随见证数量增加而线性增长。

    - **透明**：为了创建证明和验证的公共条件，`ZK-STARK` 使用公众可以检查的随机性，而不是已知的上下文。因此，与 `ZK-SNARKs` 相比，它们更加清晰。


    为了进一步了解应用并理解我们目前所学的内容，让我们来看看它们的用例。


    # 零知识证明的用例


    零知识证明在多个用例中非常有用。无法收集用户信息可以帮助平台所有者避免任何潜在数据泄露的风险。用例范围广泛，从不泄露驾照、工资单、`W-2s` 和居住证明，到分享你的大学成绩单。对于我来说，`ZKP`
    的最佳应用在于金融生态系统，由于其复杂性和高强度的监管。第二个应用是在 `WEB3` 空间，特别是 `DeFi` 生态系统。通过将数据从 `layer 2`
    解耦，你可以解决区块链上的可扩展性问题。


    # 支付基础设施中的身份解耦


    卡片支付通常作为支付追踪基础设施的一部分对多个方可见，这包括处理销售点终端（`POS`）的商户、支付网关和处理器（如银行和金融中介），以及其他相关方（例如政府机构）。所有这些实体都会收集用户和支付相关的信息。虽然金融监管对于识别非法活动有益，是现金流标准的一部分，但它破坏了普通公民的隐私。如果这些数据库受到攻击，情况就完全不同了。


    那么，如果你看加密货币，它们的创建是为了让人们能够相互进行私有的对点交易。然而，在公有区块链上，大多数加密活动都是公开的，如果已知公钥或 `transaction
    ID`，任何人都可以看到。用户身份可以有意识地建立并与真实身份联系起来（例如，通过将 `ETH` 地址放在 `Twitter` 或 `GitHub` 页面上），也可以通过在
    `CNC intelligence` 等取证公司或链分析的帮助下使用简单的链上和线下数据分析。


    至关重要的一点是，大多数加密交易在交易所终止，用户必须将加密货币兑换为法币。所有的交易所都知道用户的身份，因此他们在注册时就会获得个人信息。


    `ZK Proof` 将帮助个人和相关方向金融实体证明其有效身份，而无需交换个人数据。这将节省管理和保护数据的成本。这并不意味着金融监管将面临障碍；如果不符合证明条件，任何监管实体或平台都可以请求或撤销验证。


    # 改进 WEB3 Layer 2 协议


    扩展区块链网络以支持需求是挑战性的。随着对 `layer-1` 块空间的需求增加，会导致网络拥堵和高交易成本，反过来减少了 `Web 3` 的需求和增长。回顾一下，`layer-1`
    是资产层（如 `ethers`），而 `layer 2` 是发生共识的地方。


    零知识解决方案可以将成千上万交易打包，然后发布零知识证明（如 `message hash`），验证底层 `layer-1` 区块链交易的正确性。这些证明所需的空间远比完整的交易数据少，有助于缓解层-1
    网络拥堵，同时创建一个高吞吐量和低交易成本的高度安全环境。此类解决方案的示例被称为 `ZK-rollups`，它们有两个版本属于 `ZK-SNARK` 和
    `STARK` 类。还有其他几个协议。


    # 零知识证明的应用


    为了帮助解决身份问题并实现零知识证明，我们欢迎主权身份（`SSID`），它使用户根据需要拥有、控制并展示其身份数据，同时允许服务提供商安全地验证并信任身份主张。


    那么，这种魔法是如何发生的？让我通过下面的插图来解释这个概念。它包含三方：一个是主张持有者（即用户），另一个是主张验证者（他们需要证明）；最后一个方是主张发行者（他负责证明该主张是合法的）。


    另一个重要组件是去中心化身份标签，通常称为 `DID`，它存储在区块链上。发行者和持有者在存储到链上之前都会对 `DID` 进行签名。


    '
