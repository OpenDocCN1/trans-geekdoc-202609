    pre-arranging language to compose tests quite certain to your framework. Additionally,
    plug-ins written in the Nessus Attack Scripting Language (`NASL`) are available
    through Nessus. The modules incorporate weakness information, brief data on suggested
    remediation, and a calculation to take into consideration further testing of the
    security issue. Here are some plug-in examples: `[https://www.tenable.com/plugins](https://www.tenable.com/plugins)`.


    # Did you know?


    Nessus is frequently contrasted with `OpenVAS`. `OpenVAS` is an open-source weakness
    scanner made as a fork of the open-source code initially used for Nessus. The
    Nessus fork of the code, `GNessUs`, was later renamed `OpenVAS` once Tenable Networks
    began selling Nessus. Nessus occupies an enviable position due to the breadth
    and depth of its vulnerability coverage. Over 47,000 common vulnerabilities and
    exposures (`CVEs`) may be known to Nessus, providing excellent coverage.


    In addition to Nessus, you can also leverage smart bugs framework for analyzing
    Ethereum smart contract. Smart bugs framework is available at GitHub, that can
