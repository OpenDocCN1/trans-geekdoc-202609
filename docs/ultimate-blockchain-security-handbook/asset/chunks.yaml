    \ exchanges and merchants are part of the supply chain, which fuels the marketplace.\n\
    \n![](images/Figure-1.5.jpg)\n\n**Figure 1.5:** Bitcoin Process Overview  \n\n\
    **source:** [https://cypherpunks-core.github.io/](https://cypherpunks-core.github.io/)\n"
  trans: "\n\n该技术如何通过一种防篡改、中立且韧性的系统来跟踪所有权，一个典型的例子是在区块链上记录汽车零部件等物理资产。区块链是不可篡改的，且没有单一实体控制账本，而纸质记录容易被伪造和/或发生物理损坏，中心化数据库则可能受到黑客攻击、人为错误和/或篡改的威胁。\n\
    \n区块链可以用于识别供应链中的伪造零件并进行追踪。该技术对汽车召回也有重大影响，预计 2020 年将影响约 3200 万辆汽车。区块链通过追踪零部件从供应商到单辆车辆的去向，能够实现定向召回。\n\
    \n移动开放区块链倡议（MOBI）是一个包括福特、宝马、本田和通用汽车等汽车制造商在内的财团，他们一直在致力于一项车辆和零部件追踪计划。\n\n# 房地产\n\
    \n物业交易期间和之后缺乏透明度、大量的文书工作、欺诈的可能性以及公共记录中的错误构成了重大挑战。区块链提供了一种加速交易并消除对纸质记录需求的方法，从而帮助所有利益相关方提高效率并降低各方的交易成本。\n\
    \n## 注意事项\n\nPropy 寻求通过基于区块链的智能合约平台提供安全的购房服务。所有文档都经过签名并安全地存储在网上，而契据和其他合同既使用区块链技术记录也在纸质。\n\
    \n你可能会想，如果这些信息都很好，但我们能看到区块链的现实收益吗？投资者应该考虑哪些重点领域？随着区块链在 2023 年达到 200 亿美元，并预计在 2027\
    \ 年达到 2000 亿美元（参见图 1.4），让我们在查看区块链案例结果的同时识别关键领域。\n\n![](img/Figure-1.4.jpg)\n\n\
    **图 1.4:** 区块链市场规模（十亿美元）  \n\n**来源：** Statista\n\n# 案例研究：采购与供应链\n\n区块链简化供应商主数据管理：信任你的供应商\n\
    \n**挑战**：在寻找和整合声誉良好的供应商时，“信任你的供应商”看到了节省时间和金钱的机会。公司必须处理供应链中断和质量预期，以符合法规或利益相关者对环境和社会的关注。企业花费大量的时间和金钱试图寻找良好的供应商。这是因为很难验证并获取提供者的数据，因为公司不希望公开共享数据。\n\
    \n**解决方案**：一个开源区块链平台，允许企业安全、有效地与获得许可的第三方合作伙伴共享数据。\n\n一旦公司数据得到确认，就会创建一个基于区块链的企业数字护照，允许实现：\n\
    \n* 增强合规性\n* 增强风险管理\n* 缩短供应商的入驻周期\n\n数字密码包含数据的哈希输出，这确保了数据的完整性。第三方验证者提供 P2P 网络的视图并验证供应商信息，这提供了真实性，而区块链上的供应商数据提供了可追溯性。因此，正如之前解释的，你在这里看到的内容确保了当你使用区块链时涵盖了所有安全领域。\n\
    \n**结果**：\n\n* 将供应商入驻周期缩短了 70% 以上。\n* 将与合适的供应商合作时的数据验证成本降低了 50%。\n* 通过几乎即时检查 GRI、ISO、SASB\
    \ 等第三方的国际质量证书，改进了合规性。\n\n# 比特币固有的安全能力\n\n# 比特币概览\n\n数字货币生态系统建立在比特币所包含的思想和技术之上。价值通过比特币单位在比特币网络参与者之间进行存储和传输。值得注意的是，全球有数千种加密货币，而比特币是最知名且使用最广泛的。比特币用户还可以互联网和其他传输网络通过比特币协议相互进行通信。被称为比特币协议栈的开源软件兼容各种计算平台，包括智能手机和笔记本电脑，使得该技术触手可及。\n\
    \n与传统货币相比，比特币完全是虚拟的。它没有实际货币，也没有数字货币。在价值从一方转移到另一方的交易中，比特币网络通过密钥来证明所有权，这些密钥通常存在用户的智能手机或电脑钱包中。用户通过这些密钥签名交易并花费比特币。\n\
    \n"
