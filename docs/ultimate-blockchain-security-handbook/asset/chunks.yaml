    ![](img/Figure-4.30.jpg)


    **图 4.30：** 不恰输入验证示例


    该合约检查你提取的金额是否超过了账户余额，但它并不能防止从任意账户进行提现。


    # 现实案例：Sushiswap


    Sushiswap 曾经历过此类攻击，原因是由于外部函数的一个参数未经过清理。


    ![](img/Figure-4.31.jpg)


    **图 4.31：** Sushiswap 攻击原因的 Twitter 推馈


    欲更多详情，请访问 `[`twitter.com/peckshield/status/1644907207530774530`](https://twitter.com/peckshield/status/1644907207530774530)`。


    # 拒绝服务 (Denial of Service)


    一种可能导致代码逻辑错误、兼容性问题或调用深度过深（区块链虚拟机的特性）的安全问题，导致智能合约无法正常运行。


    一个例子是，智能合约可以通过进入无限循环来恶意耗尽转发给它的 gas。考虑以下示例：


    ![](img/Figure-4.32.jpg)


    **图 4.32：** 用于 DOS 攻击的恶意循环代码


    如果另一个合约向地址列表分发 ether，如下所示：


    ![](img/Figure-4.33.jpg)


    **图 4.33：** 用于 DOS 的分发合约


    那么当该函数向 Mal 发送 ether 时将会回滚（revert）。前代码中的调用转发了可用 Gas 的 `63 / 64`（在我们对关于 `EIP 150`
    的文章中阅读更多关于该规则的信息），因此仅剩余 `1/64` 的 Gas，可能不足以完成操作。


    智能合约可以返回一个消耗大量 Gas 的内存数组。


    考虑以下示例：


    ![](img/Figure-4.34.jpg)


    **图 4.34：** 消耗 Gas 的合约漏洞示例


    内存数组在超过 `724 bytes` 之后会消耗呈二次增长的 Gas，因此精心选择的返回数据大小可能会让调用者崩溃。


    即使变量 `result` 未被使用，它仍然会被复制到内存中。如果你想限制返回大小到特定数量，可以使用汇编。


    ![](img/Figure-4.35.jpg)


    **图 4.35：** 避免 DOS 漏洞的缓解措施示例


    注意，删除他人可以添加内容的数组也是一种拒绝服务的攻击向量。此外，`ERC777`、`ERC721` 和 `ERC1155` 合约也可能面临 DOS。例如，如果智能合约转移了带有传输钩子（transfer
    hooks）的令牌，攻击者可以设置一个不接受令牌的合约（它要么没有 `onReceive` 函数，要么将该函数程序设置为回滚）。


    现在你已经通过示例和案例研究理解了主要的攻击向量，让我们来看看一些增强智能合约安全的最佳实践。最后，我们将查看一些工具和资源。


    # 安全智能合约的最佳实践与工具


    智能合约是区块链技术不可或缺的特性，因为它实现了数字资产的安全和自动化管理。然而，这些智能合约可以通过直接和补偿性安全措施来受恶意攻击的保护。为了维护其安全性，组织必须确保智能合约得到正确更新并进行安全加固。


    以下是智能合约安全的最佳实践：


    * 使用安全的编程语言

    * 实施适当的输入验证和清理

    * 进行彻底的测试和审计

    * 实施访问控制和权限

    * 避免不必要的复杂度

    * 使用标准库并避免自定义代码

    * 实施断路器或其他故障机制


    以下工具可以帮助智能合约开发者确保代码安全：


    * 开发框架：`Truffle`、`Embark`、`Hardhat`

    * 安全分析工具：`Mythril`、`Oyente`、`Slither`

    * 漏洞赏金计划

    * 安全审计公司：智能合约审计的 `QuillAudits`

    * 测试框架：`Brownie`、`Hardhat`、`Waffle`

    * 代码审查工具

    * 专注于安全的编程语言：`Solidity`、`Vyper`、`Rust`

    * 标准库：`OpenZeppelin`

    * 文档和资源：Ethereum 开发者文档、Solidity 文档、EIPs（以太坊提案）

    * 社区论坛和频道：Ethereum Stack Exchange，以及特定项目或协议的 Discord 和 Telegram 群组。


    # 结论


    恭喜你完成本章；我们涵盖了许多主题。我本可以将这些主题拆分并在不同的章节中介绍，但考虑到渗透测试程序的重要性，严密检查并分析智能合约拥有的不同漏洞和利用程序是至关重要的，因为这是区块链技术（包括去中心化金融）的核心特性。始终记住渗透测试的步骤，并确保定期进行。本章还解释了加强智能合约的重要性以及你可以寻找的各种漏洞领域。在继续阅读此书时，请记住所有这些。


    在下一章中，我将带你了解区块链应用的审计技术，你将在其中学习不同的程序（如漏洞赏金）以及用于代码和框架静态动态测试的工具。此外，我们查看各种案例研究，帮助你进一步加固区块链代码。


    # 要点


    * 渗透测试也称为道德黑客，是一种利用系统漏洞并提出业务理由在解决方案中包含预防措施的方法。

    * 你可以使用 `Ganache` 和 `Remix` 配置实验环境来审计代码。确保你识别出的任何漏洞都经过分类和修复。

    * 智能合约中已有许多漏洞和 Bug 被利用并修复了。在对智能合约审计时，确保顶部的 OWASP 攻击向量得到处理、监控和修复。


    # 参考文献


    * `[`pentestlab.blog/2020/06/15/spyse-a-cyber-security-search-engine/`](https://pentestlab.blog/2020/06/15/spyse-a-cyber-security-search-engine/)`

    * `[`www.tenable.com/blog/how-to-run-your-first-vulnerability-scan-with-nessus`](https://www.tenable.com/blog/how-to-run-your-first-vulnerability-scan-with-nessus)`

