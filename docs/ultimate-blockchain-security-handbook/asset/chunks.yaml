    # 第 3 章


    # 块链上的攻击向量管理


    ## 引言


    2022 年，加密货币投资者向黑客损失了近 40 亿美元，其中 DeFi 协议受加密货币攻击的打击最严重。为了更好地了解近年来发生的情况，以下分析图表可以让你了解此问题的严重性。导致这些利用行为的主要原因可能是什么？如果你在考虑代码，即智能合约漏洞，那么你是正确的。然而，这只是冰山一角。


    事实是，如果能在设计早期就识别出平台漏洞，所有这些损失都可以被大幅减少。如果根据影响和发生概率进行风险管理，并辅以缓解措施和修复程序，损失将会少得多。


    一个众所周知的事实是，如果黑客可以在互联网上看到你的应用程序，他们将竭尽全力利用这些弱点，新闻报道和社交媒体上的数据证明了这一点。同样，黑客攻击是可以被缓解的；有处理这些风险和保护你的系统的方法。


    为了实现这一点，在早期阶段检测系统中的任何潜在漏洞至关重要，分类并过滤这些风险是否可以被利用，并通过计算来确定保护它们是否有意义。作为有效风险管理的一个例子，某些情况下，你正试图保护的易漏洞网络元素存在私有子网中，既不暴露给外部世界，也不是关键资产的一部分。此类元素的风险评分可能很低，你不会想花价值
    100 美元的“锁”来保护一个价值 10 美元的孤立资产。


    在本章中，我将带你走过区块链风险管理的周期。我们将学习诸如威胁建模和分类矩阵等工具，对风险领域进行界定并确定优先级。在进行所有操作的同时，我们将探索并分析一些用例和攻击示例，以查看这一切如何应用。


    # 结构


    我们将在本章中涵盖以下主题：


    * 区块链风险管理

    * 区块链中的安全风险

    * 威胁模型概述与架构

    * 将威胁建模应用于区块链

    * 针对 STRIDE 攻击向量的缓解措施


    ## 区块链风险管理


    新技术可能具有需要发现和处理的缺点。当这项技术是组织底层 IT 基础设施的基础组件，而不仅仅是上层应用时（区块链通常如此），尤其是如此。


    如果我问你一个简单的问题：你的区块链应用中多大的安全性才足够？或者说，你愿意在安全控制上花费多少钱？答案取决于你的风险管理实践。然而，在我们继续之前，让我们从基础知识开始，定义风险、攻击向量和缓解。


    * **风险（Risk）** 是一个潜在问题以及该问题发生时的影响。

    * **威胁或攻击向量（Threat or Attack vector）** 是风险发生时可以被利用的路径。常见的示例包括感染的邮件附件和恶意网页弹窗。

    * **缓解（Mitigation）** 是针对威胁的应对措施，你可以采取的防止威胁的方法，或者至少减少其成功的概率。


    为了更好地理解这一切，请考虑一个很好的例子：存在有人可能从你家里偷走车钥匙并开车离开的风险。攻击向量是攻击者实现此目的的不同方式，例如打破窗户伸手进去或破开门锁，这些都是可能的。对于此类元素的风险评分可能很低，你不会想花价值
    100 美元的锁来保护价值 10 美元的孤立资产。


    在本章中，我将带你走过区块链风险管理的周期。我们将学习诸如威胁建模和分类矩阵等工具，对风险领域进行界定并确定优先级。在进行所有操作的同时，我们将探索并分析一些用例和攻击示例，以查看这一切如何应用。


    # 结构


    本章涵盖以下主题：


    * 区块链风险管理

    * 区块链中的顶级安全风险

    * 威胁模型概述与架构

    * 将威胁建模应用于区块链

    * 针对 STRIDE 攻击向量的缓解措施


