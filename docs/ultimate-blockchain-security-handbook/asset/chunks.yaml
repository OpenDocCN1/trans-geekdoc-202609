    此外，Nessus 还提供了极佳的扩展性。…… 这里是一些漏洞修复插件示例：


    - `CVE-2018-1141`

    - `CVE-2018-1133`

    - `CVE-2018-1167`

    - `CVE-2018-1046`

    - `CVE-2018-1029`

    - `CVE-2018-1039`

    - `CVE-2018-1018`

