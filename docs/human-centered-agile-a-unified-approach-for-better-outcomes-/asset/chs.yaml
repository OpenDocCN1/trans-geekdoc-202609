  \n设计，，，团队团队，，，，，，，团队，，，这种研究是运营的。\n\n### 设计运营 (Design Operations)\n\n正如设计运营（design\
  \ ops）涵盖了基础交付相关的支持和支撑活动一样，研究运营（research operations）涉及研究人员进行研究所需的工具和流程。随着从业者和团队数量的增加，需要协作来进行工作。\n\
  \n设计是关于确保一致性，而研究协调是关于为未来的活动提供更好的视野，中心化招募并共享价值。\n\n### 临时研究 (Out Hoc Research)\n\n\
  当作为单个团队工作时，计划和执行研究是直接的。任何见解都存在正式文档（画像和用户地图）或非正式的共享理解中。在某种意义上，单个团队的研究可以被视为定制的（bespoke）方法。研究是为了满足团队的个人需求并根据情况设计的。发现也可能成为他们对用户基础理解的一部分。\n\
  \n相比之下，在分布式环境中，一个团队的研究对其他团队可能很有价值。团队可能可以继续这种研究方法，前提是：\n\n*   研究量已经与团队规模匹配（即没有空闲的研究人员，也没有工作超过了研究人员的能力）。\n\
  *   团队的研究领域足够独立，其探索性研究和方案验证见解对彼此没有价值。\n*   团队的参与者池相互独立，团队可以确保不会过度使用参与者。\n\n相反，当需要共享跨团队见解、在优先考虑执行研究时面临资源挑战或共享共同参与者池时，团队会发现需要协调研究活动。\n\
  \n在多个团队之间协调研究时，必须启动多项工作，包括：\n\n*   协作研究工作，包括招募以及共享工具和模板\n*   学习策略\n*   研究路线图\n*\
  \   见解库\n\n### 设计运营 (Design Operations)\n\n在管理参与者招募时，团队在用户互动时使用的语言和频率保持一致很重要。这维护了组织的信誉并保持了用户的参与意愿。\n\
  \n#### 招募共同参与者池 (Recruiting a Common Participant Pool)\n\n如果团队需要相同的参与者，完全独立的招募努力没有意义。从更大的参与者池中提取用户比两个独立的较小池要好。此外，共同池减轻了每个团队生成自己的参与者的负担，并避免了同一个候选参与者被初始招募活动联系多次的情况。\n\
  \n#### 每个参与者的参与率 (Participation Rate per Participant)\n\n\n\n\n尽管参与热情很高，参与研究可能成为一种产生焦虑、疲惫的体验。由于任何原因导致参与人池较小（例如，产品有特定的用户群体，或团队的覆盖范围仍然较小），团队将确保不会过度消耗他们提供实质性贡献的能力。频繁联系同一批人的团队可能会导致参与率的急剧下降（类似于“调查疲劳”）。\n\
  \n## 统一的声音 (Common Voice)\n\n与其他任何通信渠道一样，与研究参与者的沟通应该感觉像来自同一个组织，而不是不同的个人。这意味着：\n\n\
  * 发出的邀请函听起来彼此相似。\n* 拥有通用的沟通节奏——提醒、跟进沟通等的频率和时间。\n* 确保任何规则和标准都得到了良好的解释，无论哪个团队或哪项工作。\n\
  \n## 通用标准与预期 (Common Standards and Expectations)\n\n清晰定义实践和程序至关重要，例如参与激励、收集的数据管理以及参与者隐私。参与者应该清楚地了解他们的承诺是什么。除了让重复参与的者感到熟悉外，还必须考虑这些因素。这就是为什么确认标准和指南已到位并得到遵循至关重要。\n\
  \n## 工具与模板 (Tools and Templates)\n\n有许多研究流程和产物需要协调，以在不同工作之间保持一致。在招募产物方面尤其如此，例如：\n\
  \n* 政策\n* 参与流程\n* 通信模板\n* 研究计划\n* 脚本\n* 进行研究的工具\n* 综合分析 (Synthesis)\n* 成果分享 (Share\
  \ outs)\n\n### 政策 (Policies)\n\n政策包括关于是否录制会议以及这些录像将如何处理、如何处理客户隐私、参与激励政策，以及是否以及何时需要任何类型的保密协议（NDA）或业务保护。\n\
  \n## 参与流程 (Engagement Process)\n\n无论研究请求是来自领导层（例如“探索与创新”工作），还是来自为了验证或评估解决方案的团队，关键利益相关者都需要了解研究过程在开展和汇总研究方面所需的时间和精力预期，以便做出相应计划。如果对研究流程缺乏清晰且共享的理解，团队将面临不切实际的交付周期或不符合实际学习目标的研究请求。\n\
  \n## 通信模板 (Communications Templates)\n\n团队还应该拥有用于与参与者沟通的标准模板。模板可以确保必要信息得到清晰且一致的传递。模板还确保了组织的统一声音，这对于信任和信誉至关重要。除了面向参与者的沟通外，团队可能还需要创建用于处理利益相关者关系的脚本和模板，以确保通过包含与他们特定的相关的细节，一致地满足这些利益相关者的信息需求。\n\
  \n## 研究计划 (Research Plans)\n\n研究计划确定了研究的目的和范围，并使个人研究工作保持正轨。它应该识别研究的学习目标，以及方法、里程碑和时间表。它还应该包括展示结果的观众和交付物。\n\
  \n## 脚本 (Scripts)\n\n在进行特定测试时，团队应保持参与者体验的一致性——其目的是让每个参与者对发生的情况有相同的理解，并对相同的问题和提示做出反应。随着研究严谨性的增加，这一点尤为真实——在发现阶段进行的探索性访谈可能从相同的初始提示开始，但为访谈者决定如何跟进留下了大量空间；而在验证/评估工作中，用户应被赋予相同的任务。此外，每个参与者在开始时应该知道引导性信息，例如参与将花费多长时间、包含什么，以及如果出于任何原因如何结束会议。脚本确保了所有这些都得到了适当的沟通。\n\
  \n## 进行研究和汇总发现的工具 (Tools for Conducting Research and Synthesizing Findings)\n\n\
  虽然研究方法的复杂性可能存在巨大差异——从仅涉及访谈脚本和纸质原型的用户会议，到观察人们与完全开发的产品交互——但独立工作的团队将从使用相同的工具中获益。例如，所有参与异步远程测试的团队应该使用相同的工具。同样，无论汇总研究的过程如何，所使用的平台或工具在组织内部应该是通用的。\n\
  \n## 成果分享 (Share-Outs)\n\n研究人员应该有一个既定的流程，与其团队分享收集到的任何洞察。开发和使用记录这些洞察的产物模板是重要的，还要确保在过程中有涉及适当利益相关者的演示和会议。\n\
  \n## 洞察库 (An Insight Repository)\n\n洞察库的目标是以一种方式捕捉发现，使其跨团队、跨时间可访问且易于消费。洞察库与成果分享略有不同，因为它旨在为执行工作的团队提供可探索性和信息丰富的内容。\n\
  \n### “洞察”是洞察库的原子单元 (An “Insight” is the Atomic Unit of the Insight Repository)\n\
  \n洞察是关于（所有或特定）用户的态度、行为或期望的基于研究支持的主张。对于库来说，HCD 实践者想要提取研究中展示的任何洞察，并将它们作为经过某种测试的主张提出。这并不是说研究库将不包含基础数据或完整报告，而是说团队主要寻找洞察本身（而不是需要检查的长篇报告），这就是之所以这样组织的原因。\n\
  \n洞察库的建立需要完成三件事：\n\n1. 利益相关者第一眼就能看到关键信息。除了洞察本身，还应该包括有关研究的细节，如日期、方法和相关背景，以及产生洞察的产品以及研究试图回答的问题。这不是详尽列表。某些团队可能会发现他们正在进行针对特定人物或旅程中特定时刻定制的研究。任何与组织搜索洞察相关的维度都将放在这里。\n\
  2. 利益相关者可以找到与洞察相关的生成的报告。无论这些报告包含在洞察库中还是其他地方，对于想要更完整了解研究如何进行以及得出结论的利益相关者来说，这些信息应该是可用的。\n\
  3. 将洞察库与学习策略连接。洞察库通过两种关键方式与学习策略连接。第一点显而易见——如果团队的策略缺乏基础信息，他们可能会发现一个组织良好的库可以提供必要的澄清。第二点是学习策略应该指导洞察库的内容组织，从而在决定需要学习什么、何时以及如何学习，以及如何捕捉时有一个全局方法。\n\
  \n\n\n\n\n如果还没有一个命名巧妙的定律来描述“成功的团队不可避免会不断增长”这一事实，那么应该有了。成功的团队会产生业务价值并创造新机会。他们会被关注，并被要求交付越来越多的价值。为了实现更具雄心的目标，团队成员会不断增加。规模较大的团队变得臃肿，并开始在小团队不会遇到的问题上挣扎。这种不可避免的拆分为两个较小团队虽然带来了更多成功，但也带来了一系列完全不同的问题。当一个项目包含多个团队时，团队需要开始开发相应的流程来协调他们的整体交付工作。\n\
  \n## 需要有多少个产品负责人（Product Owner）？\n\n随着项目规模扩大到拥有一个以上团队或一小组团队的程度，考虑它们是否仍能由单个 `Product\
  \ Owner`（产品负责人）处理至关重要。`Product Owner` 角色恰好是敏捷开发中扩展性不好的角色之一。即使是一个优秀、经验丰富、投入度且没有其他事务的\
  \ `Product Owner`（这显然是一个虚构的角色），最多也只能处理两个敏捷团队。`Scrum Masters`（敏大师）的扩展性稍好一点，但一个全职的\
  \ `Scrum Master` 仍然只能同时处理三个团队。有时在这种情况下，不断增长的项目会要求其他成员兼任 `Scrum Master`。如果可能，请避免这种反模式，因为它会产生利益冲突。\n\
  \n## 更新团队拓扑结构\n\n在敏捷环境中，协调分布式设计和研究会伴随着各种新的活动和职责。通常会专门引入新的人员来管理或执行团队协调活动，特别是当团队挣扎于处理额外的\
  \ HCD（以人为中心的设计）职责并维持其速度，或者达成共识变得更加困难时。\n\n### 设计或创意主管（Design or Creative Lead）—\n\
  此人负责定义设计标准并确保按照要求的程度执行标准。他们还负责维护工具和模板，并在项目层面对设计工作进行评估，以确保设计质量是合适的。\n\n### 研究协调员（Research\
  \ Coordinator）—\n此人负责研究运营（research ops）部分中描述的所有材料的维护，确保研究计划有足够的时间的设计和执行，并留出额外时间让团队在交付周期内吸收这些见解。\n\
  \n### 招聘协调员（Recruitment Coordinator）—\n由于招聘是研究过程中“最重”的部分之一，通常会安排专人来处理必要研究的所有招聘细节和活动。\n\
  \n有时，前两个角色会合并为听起来更像“UX 架构师”或其他通用型设计领导角色，其任务涵盖了个人贡献者层级以上。虽然新角色的出现并不意味着需要新人来执行该活动，但它确实要求留出专门的时间用于规划和协调活动本身。\n\
  \n## Scrum 之会（Scrum of Scrums）——有机扩展 Scrum\n\n人越多，意味着会议时间越长、生产力越低。这是团队在尝试扩展 Scrum\
  \ 时遇到的首要问题之一。一种解决此问题的常见模式是将每日站会（技术上称为“每日 Scrum”）扩展到更高层级的“Scrum of Scrums”（所示于图 10.1）。这种每日的“Scrum\
  \ of Scrums”只涉及每个团队的一到两个成员，其目的是保持成员规模较小并严格控制会议时间盒限制。对于团队来说，规模越小越好。\n\n![图 10.1 一小组团队和\
  \ Scrum 之会。](img/Figure10_1.jpg)\n\n图 10.1 一小组团队和 Scrum 之会。\n\n任何团队自身或其 `Scrum Master`\
  \ 无法消除的障碍都会被带到 Scrum 之会上。`Scrum Masters` 会参加，对团队所面临的任何问题有最了解的人员也会参加。`Scrum Masters`\
  \ 轮流主持这些会议，并在会议上学到的任何内容会立即带回团队。\n\n## 团队对齐活动\n\n### 需求接入、问题定义和设计目标沟通\n\n在以人为中心的敏捷（Human-Centered\
  \ Agile）中，在功能层面（以及更大范围）进行正确的工作启动至关重要。这始于清晰的问题定义，并辅以编写良好的史诗（epics），以阐述对用户需求或问题的解决方案。如果团队内部对某功能应产生的影响无法达成共识，团队将难以超越基础的任务管理，转向更敏捷的思维——即创建能够交付最佳价值并可以迭代的解决方案。简单来说，良好的问题定义是有效的敏捷与仅仅尝试将敏捷术语应用于旧流程之间的区别。\n\
  \n团队应该从问题定义步骤开始功能（或史诗）工作，这包括定义用户产出和成功指标。这一步骤发生在团队接手任何工作之前，并捕获了团队即将参与的工作背景。顺便提一下，这被称为“问题定义”而非\
  \ `kickoff`（启动会议），因为 `kickoff` 的使用范围更广，可以意味着从是否应该做某工作的战略考量，到仅仅是一个分配团队去接手已定义工作的会议。\n\
  \n## 全方位型团队，全方位工作\n\n以人为中心的敏捷对团队采取全方位方法，既是为了保持团队在解决问题时的独立性和活性，也是为了确保解决方案是由识别并理解问题的团队进行交付和评估。这种“整个团队、整个问题、整个结果”的心态是一个核心概念。\n\
  \n以人为中心的敏捷理念是：处理问题的团队从问题定义阶段到产品评估都拥有所有权。让一个团队从问题定义一直参与到解决方案交付，可以保持工作目标的一致，并确保团队根据预期结果做出决策，而不是倾向于开发角度上更便利的决策。\n\
  \n### 团队间的交接\n\n理想情况下，敏捷团队从端到端处理问题，在以人为中心的敏捷中也是如此。然而，当扩展到一组协作的团队时，让一个团队从端到端处理功能变得越来越具有挑战性。回顾第\
  \ 7 章中提到的创建“下班支持”能力的案例，最初研究的团队可能建议使用聊天机器人服务部分客户，并使用独立的应用程序服务其他客户。这些解决方案对于单个团队交付来说太大，因此引入了另一个团队。\n\
  \n在以人为中心的敏捷中，被引入的团队现在对问题（下班支持）、解决方案（应用程序）和结果负责，包括如何最好衡量成功。新团队很可能会发现人们并不需要支持（噢，发现错了！），或者他们根本不想要应用（你们真的验证过人们想要这个东西吗？）。在这种语境下，新团队被许可可以质疑先前的任何发现或决策，并填补尚未完成的发现或概念验证。换句话说，一个团队绝不会仅仅向另一个团队指派开发任务。\n\
  \n\n\n\n交接（handoff）步骤目的是让新团队在对已完成的工作有充分理解的基础上进入生命周期，这样接手团队就能对已做出的决策和已完成的工作充满信心，确保这些工作与已识别的工作一致，并能够识别出尚未解决的问题。这项活动确保团队从参与的那一刻起保持一致，并确保做出交付决策或任何调整都是以原始目标和预期结果为考虑的。\n\
  \n## 良好的交接应包含的内容\n\n交接应包含以下项目，这些项目本应在工作的问题定义阶段生成。如果这些信息存在空白，则由新团队有责任确保填补这些空白。\n\n\
  *   以用户为中心描述的努力目标\n*   基于结果的成功标准，以便任何接手功能交付的团队都理解将如何评估成功\n*   支持该工作所收集的任何用户洞察的记录\n\
  *   截至为止所进行的任何验证工作的记录\n*   其他提供交付限制的信息，例如：\n    *   已知的技术限制\n    *   已知的影响（系统、流程或必须适应新交付解决方案的进行中的工作）\n\
  \    *   已知的依赖关系（团队交付解决方案作为先决条件的系统、流程或进行中的工作）\n    *   关键日期及其业务驱动因素\n\n## 团队形成的成功因素\n\
  \n团队成功的一个经常被忽视的因素是团队形成本身以及启动前的活动。敏捷教练经常会反思自己，问为什么他们指导的团队没有取得预期的进展。原因是为了确保团队的成功需要进行准备工作，这些工作需要在团队启动很久之前就要完成。没有这些前期工作，即使是最好的教练也只能产生微乎其微的影响。\n\
  \n团队形成期间，经理必须仔细考虑不仅是章程（我们希望这个团队交付什么价值和解决方案？）和技术领域（我们需要什么样的技术专家组合来交付这些价值？），还要考虑关键的工作方式问题（团队将如何共同工作？他们的时区是什么？他们说同一种语言吗？拥有这些成员是否构成了真实团队的基础，还是他们仅仅是一群聚在一起工作的人？）。\n\
  \n“形成、震荡、规范和表现”¹³\n\n*   该团队将支持什么产品？\n*   团队的产品如何符合企业战略？\n*   产品是否有清晰定义的路线图？\n*\
  \   该团队将支持哪些用户？\n*   团队成员是否有时间投入到这个产品，还是他们被分配到了另一个产品（或可能是几个）？\n*   团队是否拥有成功所需的自动化和工具？\n\
  \n很容易看出，忽视这些基础性问题并直接跳到团队启动有多大的风险。研究表明，团队 60% 的成功可以直接归因于启动活动，30% 可以归因于启动本身。¹⁴\n\n\
  将以人为本的设计（HCD）引入敏捷计划的主要成功因素是：\n\n### 高层支持\n\n如果没有投入且支持的高层领导，即使是启动良好且采用最佳实践的团队也无法成功。需要强大的高层拥护者的持续支持，以确保团队的工作与企业战略保持一致。此外，高层处于独特的地位，可以支持并锚定以人为本敏捷（或实际上是任何敏捷方法）成功所需的心态转变。团队需要知道，他们“快速失败”真的是没问题的。他们需要在一个心理安全的环境中工作，在其中他们可以进行实验并真正质疑假设。团队成员也不需要被多重分配任务以发挥最大的效能。只有高层才能确保这一切。\n\
  \n### 对自管理清晰的预期\n\n敏捷的核心理念是让团队自我管理。然而，在团队开始工作之前，必须清晰理解管理层对团队交付内容的预期，并理解任何限制或局限性，例如他们将被执行的其他工作。每个团队都有边界，从一开始就让所有人理解边界是非常重要的。\n\
  \n**团队工作协议（Team Working Agreements）**——在团队形成时，他们应该以“团队工作协议”的形式将他们的标准、预期和规范法化。这些文档通常详细说明团队的“完成定义”（definition\
  \ of done）、每日站会何时以及何地举行、共享和协作工具（如应用生命周期管理工具）的规范和预期，以及其他有助于管理预期的有用信息。此工作协议应在回顾会议中定期审视。\n\
  \n**与积极投入的产品负责人的日常互动**——来自知识丰富的产品负责人的活跃、实地参与是另一个关键成功因素。由于没有需求文档，敏捷团队会进行一系列实验并需要对这些实验进行反馈。他们会有问题，而且产品负责人负有接受团队工作的最终责任。能够方便接触产品负责人意味着团队不需要等待反馈；他们可以做出更快的决策，更容易地调整，并比那些等待反馈的团队交付得更快。\n\
  \n### 待解决的问题积压列表，而非任务列表\n\n最成功的团队是那些被赋予一组目标，然后让他们自己发现实现这些目标的最佳方式，而一个允许他们做到此点的积压列表是关键。团队面临的限制越多，他们进行实验和创新的自由就越少。有时，团队会拥有等同于需求文档的内容（带有关于如何交付所有内容的痛苦细节）。这就是组织对冲刺阶段进行“瀑布式”管理的典型例子。\n\
  \n### 自主性与目的\n\n让知识工作者发挥最大生产力的方法是给他们创新的自主权。阐明“为什么”和“什么”，然后让他们自己去做。如果有必要，让他们反复失败。让他们进行实验和创新。最重要的是，让他们控制“如何做”。方法被管理过度限制的团队，风险在瀑布方法上套上敏捷的外壳。\n\
  \n在团队成功因素排行榜上，目的与自主性并肩。知识工作者渴望比自己更大的目标。领导层必须确保他们对这一目的有共同的理解。关于自主性、精通和目的是释放知识工作者创新和生产力的关键的更多信息，请阅读丹·平克的《驱动力》（Drive）。¹⁵\n\
  \n### 对团队稳定性的预期\n\n敏捷团队在初期往往不是最高效的。布鲁斯·塔克曼在 1965 年确定了小小组发展序列模型，即“形成、震荡、规范和表现”。¹⁶\n\
  \n### 团队参与 HCD 活动\n\n保罗·吉布斯在《组织变革科学与影响》中论述了插入式团队是不够的：“变革专家太重要了，不能交给专家。”¹⁷\n\n##\
  \ 跨越小团队集群\n\n当计划规模扩大到小团队集群无法满足业务机会时（总人数超过约 50 人），就会出现几种功能失调的模式。\n\n### 具有竞争愿景的产品负责人\n\
  \n\n\n\n\n多个产品负责人（Product Owners）在跨团队保持愿景统一方面面临着困难。单一团队之所以拥有且仅有一个产品负责人，是因为他们需要一个统一的愿景。当存在多个团队和多个产品负责人时，就会出现多个愿景。一些产品负责人对优先事项有不同意见，而另一些则在用户的基本需求上存在分歧。在就共同使命达成共识之前，目标不一致的产品负责人很难产生任何价值。每当项目规模扩大到多个团队时，这种情况尤其容易发生，因为产品负责人这样一个人无法将每个团队的愿景与交付统一。\n\
  \n## 具有竞争优先级的战略级利益相关者\n\n除了在产品交付层面存在愿景竞争的产品负责人外，大型项目在产品交付过程中还可能面临挑战：多个执行级利益相关者表达相互竞争的战略优先事项。当这种情况发生时，工作会被经常重定向（有时会转向某些定义并不明确的工作），团队会觉得自己的工作被低估。当团队无法识别和理解其工作的战略价值时，人员流动和士气低落就会产生。\n\
  \n## 待办列表过多导致有效协调\n\n相互竞争的产品负责人对最佳解决方案及其相对优先级有不同的想法，导致了相互竞争的待办列表（backlogs）。由于协调待办列表的方法，团队将陷入挣扎，因为保持相互独立会导致重复工作、产品不一致或代码冲突。此外，速率（velocity）的自然波动可能会导致某些情况：没有深度就绪用户故事（ready\
  \ stories）或与其他团队有依赖关系的团队处于空闲状态，而其他团队则任务过重。此前帮助团队看到并响应彼此进展的会议，随着参与者的增加而变得具有挑战性，团队缺乏解决依赖关系的机制。\n\
  \n当团队忙于如何共享共同待办列表、识别并解决团队间的依赖关系以及如何最好组织时，其他类型的问题随之出现。\n\n## 团队增长到低效规模\n\n意识到这些功能性缺陷后，团队试图通过增加团队规模来解决问题。这可能是为了保持敏捷团队的数量在可管理范围内，或者可能为了从一个已经高效的团队中获得更多产出。错误的逻辑认为，如果一个\
  \ 10 人的团队是好的，那么一个 20 人或 30 人的团队一定更好。敏捷要求小团队（成员 10 人或更少）有非常特定的原因。研究表明，最佳团队规模要小得多，接近\
  \ 4.8。\n\n较小的团队更成功，因为它们比大团队能更好地、更快地进行沟通和学习。团队越大，潜在的通信线路就越多，导致通信变慢且效率降低，并且信息丢失或被扭曲的概率增加，就像儿童游戏“传声筒”一样。学习变慢了，敏捷性也随之降低了。\n\
  \n## 多个 Scrum Master 需要协调\n\nScrum Master 也没有被排除在那些随项目规模扩大而改变需求的群体之外。他们挣苦于缺乏一种机制来让他们都了解来自其他团队的问题，也缺乏一种方式来升级他们或团队无法自行消除的障碍。有些团队采用两周一次的冲刺（sprints），另一些则是一周一次。有些团队在周三开始冲刺，而另一些则在周一开始。有些敏捷团队根本不使用\
  \ Scrum，而是使用看板，这是一种没有迭代、没有交付时间盒（timebox）的框架，但其工作仍然必须计划和整合。这这是一片混乱。\n\n## 技术领导力的“空缺”变得显现\n\
  \n开发者在跨团队维护编码标准，甚至在选择使用什么技术方面面临困难。很容易想象这样一种：例如，某些团队选择 `Java`，而另一些团队选择 `C#`。任何一种技术都是有效的，都能解决问题，并且各有优缺点，但缺乏协调的团队无法就哪种技术对整个项目最好达成共识。此外，规模化的团队需要基础设施（自动化工具、测试环境、HCD\
  \ 研究）得到协调并准时交付，否则他们将不得不一直等待。在较大的项目中，通常还会有独特的安全和审计要求，必须进行记录并满足。随着项目规模的扩大，单一团队中并不存在的技术真空变得显眼起来。\n\
  \n## 老板在哪里？\n\n更大的项目也带来了更高的风险。随着组织面临的风险增加，项目会获得更多高级利益相关者以及最终对项目成功负责的执行官（Executives）的关注。在没有既有标准的情况下，他们可能会对问题得到不同的答案，并发现团队之间缺乏协调的愿景。通过仔细检查，他们可能会发现团队甚至无法对交付计划达成一致。在这些情况下，高级利益相关者需要一种方法来查看并控制这些许多团队正在构建的内容，以协调他们的愿景和活动。\n\
  \n大型项目需要一种方法来：\n\n*   将他们的敏捷团队扩展为“敏捷团队之团队”（team of Agile teams），将总努力整合到比两周冲刺更长的时间跨度的更大、更基本的的用户价值单元中。\n\
  *   规划近期工作和未来路线图，并保持足够的灵活性允许团队在需要时进行转型（pivot）。\n*   同步计划以规划和定义交付节奏，让他们能够共同学习，以及一种在许多团队之间交流新学习成果的机制。\n\
  *   寻找团队层面之外的改进和创新机会，包括这种新的“团队之团队”层面。\n*   使他们的技术成员统一在技术、架构和规范的共同愿景上。\n*   通过使用稳健的“企业资源计划”（Enterprise\
  \ resource planning）机制管理更大型的项目和预算。\n\n单个团队仍然希望继续使用 `Scrum` 和/或 `Kanban`，但需要更多方法来填补这些空白。遗憾的是，尽管增加了一些如\
  \ `Scrum of Scrums`（Scrum 会议）之类的流程，但在处理单一团队或小团队集群时成功的框架，在规模化时显得力不从心。\n\n解决方案是一个专门解决这些问题的框架，同时允许单个团队获得成功所需的自由和创造力。规模化框架（scaling\
  \ frameworks）的数量比单一团队框架多，因此组织有许多选择。正如 `Scrum`、`XP` 和 `Kanban` 等框架为单一团队提供了应用敏捷思维的方法，规模化框架允许团队之团队应用敏捷思维，同时解决之前确定的问题以及一系列其他出现的问题。\n\
  \n流行的规模化框架包括 `SAFe®`、`Scrum of Scrums`、`Scrum@Scale`、`Disciplined Agile` 和 `Large-Scale\
  \ Scrum (LeSS)`。书中讨论规模化时通用 `SAFe` 框架。虽然不会详细介绍其他规模化框架，但描述的思想和概念适用于所有。在接下来的章节中，这些问题将映射到解决它们的\
  \ `SAFe` 关键角色和构造上。然后将 `SAFe` 工作流，重点关注 HCD 从者如何在整个 `SAFe` 产品开发生命周期增加价值。\n\n## 为什么需要规模化框架？\n\
  \n随着项目规模的扩大，它们开始遇到在规模较小时没有（或注意到）的问题。简而言之，这些是：\n\n*   一种让许多团队统一到愿景的方法。\n*   一种识别和管理团队间依赖关系的方法。\n\
  *   一种规划和管理所有（或许多）团队所需的关键活动的方法。\n*   一种确保更广泛的团队和工作交付质量的方法。\n\n\n\n\n\n*   为团队团队提供更大型工作单元的时间盒（timebox）。\n\
  *   扩展和协调产品负责人（Product Owner）与 Scrum Master（Scrum Master）角色的方法。\n*   一种在大规模规划预算和资源分配的方法。\n\
  \n当一个项目拥有数十个团队或数百名从业者时，运行一个“扁平”的分布式团队系统就变得不再适了，因为缺乏扩展角色、对齐多个团队的共同愿景、管理共同积压列表，以及最重要的——为大型项目进行预算和资源规划所需的结构。如果一个项目变得过大，如果没有额外的结构，就无法创建一个统一的愿景以及凝聚性的流程和产品集。\n\
  \n这些正是扩展框架旨在解决的问题。诀窍在于解决这些问题的同时，保持单个团队能够自由地创造和创新。\n\n# V\n\n# 最大规模项目：以人为中心的敏捷与 SAFe^®\n\
  \n# 第 11 章 SAFe^® 简介\n\nDOI: [10.4324/9781003188520-16](https://doi.org/10.4324/9781003188520-16)\n\
  \n有很多扩展框架可以选择，但最常用的是扩展敏捷框架^®（Scaled Agile Framework^®），简称 `SAFe®`。\n\n例如，`SAFe®`\
  \ 明确地提出并重视`以客户为中心`，\n\n本章重点关注：\n*   理解 `SAFe®` 如何帮助确定哪些是正确的工作（“正确的问题”）\n*   如何生成和验证解决方案（“正确的解决方案”），以及如何交付这些价值\n\
  \n## 什么是 SAFe®？\n\n`SAFe®` 是一个扩展 Scrum 和看板的框架，它允许多个团队团队（甚至是“团队的团队的团队”）共同协调、计划、交付、学习和改进。`SAFe`\
  \ 是一个经过验证的扩展敏捷实践库，基于十项原则、七项能力、四个核心价值观以及许多旨在扩展和整合精益、敏捷、DevOps……以及现在的 HCD（以人为中心的设计）。\n\
  \n**核心价值观——****`SAFe®` 包含了四个核心价值观\n\n理解“内置质量”而不仅仅是质量非常重要。其理念是：在大规模范围内快速前进并成功的唯一方法，是确保团队在推进过程中没有缺陷并交付用户价值。无论他们做多少测试，也无法在一个糟糕的解决方案中测试出高质量。团队能够快速进行并保持高质量的唯一方法，是确保质量从第一次就融入到流程的每一个步骤中。这意味着要在解决方案验证上花时间，以确保解决方案是“正确的”。如果团队必须停止新工作去回头修复之前“已完成”工作中的问题，那么他们在新工作的进展上将一直挣扎，因此质量必须在执行过程中构建到一切中。`SAFe`\
  \ 中没有所谓的修复 Bug 的“硬化冲刺（hardening sprint）”。团队可以通过采用“完成定义”（definition of done）来确保他们交付的是可生产的解决方案。\n\
  \n对于以人为中心的敏捷人士来说，结论是：这四个核心价值观应该指导团队层面、扩展的“团队团队”层面以及企业层面发生的一切事情。这些核心价值观为团队提供了心态和理由，去进行必要的\
  \ HCD 工作（以及相关学习），以构建质量、保持透明并按照最高标准执行。当团队思考他们的流程或考虑对流程进行更改或实验时，他们应该考虑这如何支持这四个核心价值观。任何削弱或与这四个价值观中的任何一个不匹配的流程更改都应该被重新考虑。\n\
  \n### SAFe® 原则\n\n与敏捷一样，`SAFe®` 构建在原则之上，成功的团队在自定义其 `SAFe` 实现时会综合这些原则。这些原则建立在四个价值观的基础之上，旨在指导团队的实践。团队在回顾会议中经常回溯这些原则，以确保他们的实践与之一致。这十项原则是：\n\
  \n1.  采取经济视角。\n2.  应用系统思维。\n3.  假设可变性并保留选择。\n4.  通过快速、集成的学习周期进行增量式构建。\n5.  基于对运行系统的客观评估设定里程碑。\n\
  6.  让价值在不受干扰的情况下流动。\n7.  应用节奏并与跨领域规划保持同步。\n8.  释放知识工作者的内在动力。\n9.  决策去中心化。\n10. 围绕价值组织。\n\
  \n任何扩展框架都无法在不进行至少某些自定义的情况下直接作为清单来实施。每个项目和组织都有其独特的约束和需求，必须得到解决。这些原则的目的是使这四个价值观具有可操作性，并在团队修改流程时提供一个可以遵循的指南针。团队应该关注这些原则而非敏捷实践，并将这些原则视为框架的“为什么”。\n\
  \n### 能力\n\n`SAFe®` 识别了七项核心能力（技能领域），最成功的企业在这些领域脱颖而出。如图 11.1 所示，`SAFe` 将这些能力描述为“理解和实施\
  \ `SAFe` 的主要视角”。\n\n![图 11.1 七项 SAFe® 能力以及每项的三个子维度](img/Figure11_1.jpg)\n\n图 11.1\
  \ 七项 SAFe® 能力以及每项的三个子维度。\n\n将这些能力视为框架的“如何做”。\n\n### 实践\n\n`SAFe®` 实践包括新的角色和新的仪式，以帮助团队在大范围内对齐、协调和交付价值。接下来的几章将详细介绍对\
  \ HCD 从业者重要的关键实践，并说明 HCD 和敏捷如何共同扩展，从而形成一种比单独使用 HCD 或敏捷更强大的工作方式。\n\n`SAFe®` 网站可以在\
  \ `www.scaledagileframework.com` 找到。对于对进一步探索感兴趣的读者来说，这是一个丰富的信息源，`SAFe 大图` 上的每个文字和图像都是点击链接，将引导读者进入相关信息。同样，本章中的脚注也会引导读者进入相应的\
  \ `SAFe` 文章。正如敏捷人士所期待，在 `https://community.scaledagile.com` 还有一个虚拟实践社区。\n\n## 四种\
  \ SAFe 配置\n\n像 `SAFe` 这样的扩展框架带有大量的开销——它们包含了新的角色、活动和实践。为了确保项目包含其独特需求所需的最小且足够的开销，`SAFe`\
  \ 有四种尺寸。这些尺寸被称为配置，可以被认为 T 码一样的小、中、加大。随着尺寸的增加，新角色、流程和实践的数量也之增加。`SAFe` 项目应该使用满足其需求的最小配置。\n\
  \n将 HCD 整合到扩展流程中的基本概念适用于所有四个配置。关于这一点有两点需要理解：第一，即使“在大范围内”，不同的规模也有不同的需求；第二，之前章节中描述的所有\
  \ HCD 工作都适用于任何规模。没有理由认为任何项目会“大到”无法纳入这项工作。\n\n四种 `SAFe` 配置分别是：\n\n*   基础 SAFe (Essential\
  \ SAFe)\n*   大型解决方案 SAFe (Large Solution SAFe)\n*   组合 SAFe (The Portfolio SAFe)\n\
  *   最后全 SAFe (Full SAFe)\n\n\n\n\n\nSAFe^® 用于管理工作的许多术语（如 `epics`、`features` 和 `stories`）对于任何以前在敏捷环境中工作过的人来说都是熟悉的。SAFe\
  \ 还规定了特定的“赋能者”（enabler）工作，即旨在支持团队构建功能特性的工作。\n\n尽管这些术语很熟悉，但值得花时间理解它们的含义，特别是在 SAFe^®\
  \ 语境下的含义。\n\n### 史诗 (Epics)\n\n与任何敏捷 MVP（最小可行性产品）一样，团队努力构建一个微小的、廉价的可用功能部分，以测试他们的方法和结果，从而评估收益假设并做出\
  \ `pivot`（转型）或坚持的决策。团队经常会构建多个轻量级原型以获取反馈，并在投入构建解决方案的方法之前降低成本和风险。使用精益业务案例和收益假设进行的\
  \ MVP 评估，是 `第 3 章` 中讨论的精益创业循环的应用。\n\n即使所采取的方法 `doesn’t`（没有）证明收益假设，它也应该被视为 `success`（成功），因为只花费了极少的时间和资金。尽早了解哪些方案不可行是一种胜利，因为防止了时间和金钱的错误投资，并允许更早地尝试替代方法。\n\
  \n### 特性 (Features)\n\n史诗被分解为特性。\n\n特性和史诗一样，也具有收益假设，这有助于团队关注预期结果、反思所交付的价值，并确定特定解决方案是否按照预期发挥了作用。像史诗一样，特性的收益假设有助于团队“毫不留情且不带内疚地转型”。\n\
  \n### 故事 (Stories)\n\n### 赋能者工作 (Enabler Work)\n\nSAFe^® 承认并非所有工作都是用户工作。SAFe 将非用户工作称为赋能者工作。\n\
  \n为了在整个项目中容纳这类工作，SAFe^® 创建了一个规划和待办列表工具，称为 `Architectural Runway`（架构跑道）。需要注意的是，`HCD`\
  \ 工作是该待办列表中探索性赋能者的一部分。SAFe 架构跑道与 `Research Roadmap`（研究路线图）的交集在 `第 14 章` 中进行了讨论。\n\
  \n### 程序待办列表 (The Program Backlog)\n\n程序待办列表由 `ART` 需要交付的 `features`（而不是 `stories`）组成，并由\
  \ `Product Manager` 拥有，该经理负责对这些特性进行优先级排序和验收（就像 `Product Owner` 在团队层面对 `stories`\
  \ 进行优先级排序一样）。\n\n## SAFe^® 中新的规划与交付时间盒\n\nSAFe^® 的优势之一在于其对工作时长的灵活性。达到一定规模后，项目不可避免地开始考虑更大的工作，因此必须在比两周冲刺更长的时间范围内运行。这并不会降低其敏捷性。由于对程序待办列表有更深入的，并不意味着团队突然要负责交付涵盖\
  \ 12 周工作量的详尽需求大书（通常，后期冲刺中的 `stories` 仍在编写和审查中）。这意味着 `epics` 具有足够的复杂性，因此协调工作的窗口更长。团队在执行过程中边学习边适应，并对规划和实施自己的工作具有灵活性责任。对于以人为中心的敏捷来说，这意味着团队应该有足够的前置时间来规划、进行和综合研究活动，以能够指导决策并改进交付的产品。这种更长的时间盒有助于他们规划这些工作。\n\
  \n### 计划间隔 (PI)\n\n为了适应更复杂且需要更长跑道的工作，SAFe^® 使用更长的时间盒规划间隔，或 `PI`。\n\n## 大规模下的新流程\n\
  \n随着更多团队、更大的工作单元以及更长交付时间盒的出现，了一些额外的流程，旨在保持团队同步、管理依赖关系并改进流程。\n\n### PI 规划 (PI Planning)\n\
  \n在 SAFe^® 中，整个 `ART` 在每个 `PI` 结束时聚在一起（如果可能的话在线下）识别风险和依赖，并规划下一个 `PI` 的工作，这是 SAFe\
  \ 中具有开创意义（且有趣的！）事件，被称为 `planning interval planning` (`PI planning`）。\n\n`PI planning`\
  \ 必须是一个结构化的事件，因为涉及的人很多，他们都必须统一共同的战略、愿景和架构。每个团队都被要求清楚地阐述涵盖整个 `PI` 期间的目标，这些目标反映并支持了整体愿景。在\
  \ PI 规划过程中，团队可以看到并讨论其他团队的目标和工作，进行专门的练习来识别依赖关系，并评估每个团队正在解决的问题所带来的预期价值。\n\n这些活动通常以\
  \ `Executives`（高管）、`Product Managers`（产品经理）和 `System Architects`（系统架构师）围绕他们为什么、做什么以及如何构建（按此顺序）的共同愿景统一团队开始。`Executive`\
  \ 解释战略、计划工作如何与该战略对齐以及为什么这很重要。`Product Manager` 解释为 `PI` 优先级排序的 `features`、它们为用户交付了什么价值，以及收益假设和\
  \ `acceptance criteria`（验收标准）是什么。`System Architect` 最后发言，就将使用的技术、技术使用规范以及任何其他保持团队统一共同技术愿景的必要实践与各小组达成一致。`Experience\
  \ Architect`（体验架构师）可能会展示在上 `PI` 中收集的实验结果或用户洞察、当前的评估方法，以及要考虑的整体体验方向的任何新方法，特别关注由于这些洞察而产生的策略转型。\n\
  \n在这些简报之后，团队进入自己的区域（通常带有画板，或者更好是满墙的画板）进行分组会议，分解优先级排序的特性，识别与其他团队的风险和依赖关系，并为工作制定高层计划。团队将他们的目标总结为一组用业务语言编写的目标，然后由\
  \ `Business Owners`（业务所有者）批准并分配业务价值。团队对即将到来的 `PI` 承诺这些目标，但他们不会对每个冲刺的 `stories` 承诺，保留每两周进行一次冲刺规划的自由，并在每个冲刺中考虑学习结果。团队展示他们的计划以便对所有人透明，并识别和审查风险，以便程序在休会前进行信心投票，以确保所有团队对交付计划的能力有信心。\n\
  \n`HCD` 实践者应该在各个团队之间流动，听取并观察针对假设的计划，以及任何其他与最终用户情感脱节的内容。\n\n### 产品所有者同步 (The Product\
  \ Owner Sync)\n\n在许多 `Product Owners` 之间保持愿景的一致。\n\n在 SAFe,® 中，`Product Manager`\
  \ 和 `Product Owner` 的角色是分开且不同的。`Product Managers` 在 `ART` 级别工作，负责 `features`——这些工作集非常大，需要整个\
  \ `ART` 花费一个 `PI` 才能完成。然而，`Product Owners` 与单个敏捷团队合作，负责 `stories`——这是单个团队可以在一次迭代中完成的得得的工作单元。举行\
  \ `Product Owner sync` 或 `PO sync` 会议是为了了解 `ART` 在实现目标方面的进展，并将 `Product Manager`\
  \ 的愿景与各个 `Product Owners` 的愿景对齐（此会议有时与 `Scrum of Scrums` 会议合并并称为 `ART sync`）。\n\n\
  \n\n\n\nHCD 执行者与产品所有者（Product Owner）产品经理（Product Manager）应该是天然盟友，将他们加入这个已经稳健的 SAFe^®\
  \ 活动以获得更好的结果是有合理的。HCD 执行者对产品通常具有独特的观点，这些观点是产品经理或产品所有者所不具备的，而且他们能够识别“盲点”。体验架构师（Experience\
  \ Architects）会就哪些已经过验证、哪些仍然代表风险提供意见，并脑暴可以进行哪些额外的探索来缓解这些风险。\n\nHCD 执行者通过识别可能错过的或由于新学习而近期产生的研究机会，在本次活动中创造了价值。此外，HCD\
  \ 执行者通常能够察觉到计划的用户体验与实际用户体验之间的细微差异，因此这次会议是处理这些问题的绝佳场所。一旦识别并透明化，产品经理可以决定如何最佳进展，而 HCD\
  \ 执行者可以做记录，以便在回顾会议中提出。\n\n### Scrum 捷会 (Scrum of Scrums)\n\n与非 SAFe^® 背景下的 Scrum\
  \ 捷会一样，每个团队的成员至少每周聚集一次，讨论交付过程中的依赖关系、阻碍和障碍。Scrum 捷会⁴³ 的目的是\n\n### 检查与适应事件 (Inspect\
  \ and Adapt Event)\n\n在 SAFe^® 中，PI（计划间隔）的最后一个冲刺与其他所有冲刺不同。它被称为创新与规划迭代，⁴⁴\n\n* 用于溢出工作的估算缓冲\n\
  * 团队整合其工作的额外时间\n* 留给创新的时间（黑客松、与用户互动、培训等）\n* 用于检查与适应事件以及 PI 规划的时间\n\n敏捷发布火车（ART）上的所有团队以及一组扩展的利益相关者聚集在一起进行检查与适应事件。⁴⁵\n\
  \n检查与适应事件始于演示所有团队在上一个 PI 中完成的所有工作，以及获得的任何学习、技术研究（spikes）或 HCD 洞察（后一部分对以人为中心的敏捷者至关重要）。演示完成后，业务所有者（Business\
  \ Owners）将对交付工作的业务价值进行评估。最后，将创建临时的特别小组，并进行一个名为“问题解决工作坊”的项目级回顾。在这次工作会上，团队识别其流程中的任何问题，确定其根源，并脑暴解决方案。这就是流程在\
  \ ART 级别进行改进的方式。\n\n到此时，共享服务 HCD 团队已经进行了大量研究和情感收集，以确保产品经理和业务所有者拥有规划下一个 PI 所需的信息。这通常是\
  \ HCD 执行者与产品经理、产品所有者配对的时间，以确保他们意识到上一个 PI 中发生的所有 HCD 学习成果，并对这些学习进行定位，以便在下一个 PI 中能够轻松应用。这是在下一个计划间隔开始之前，向研究路线图（Research\
  \ Roadmap）添加任何遗漏或需要进一步阐述内容的最后机会。\n\n检查与适应事件本身包含三个部分：\n\n1. PI 系统演示（Demo），展示已完成并集成的工作以获取反馈。\n\
  2. 定量和定性衡量，基于所交付工作的业务价值。SAFe^® 有一个名为“项目可预测性衡量”的指标，衡量团队履行其承诺的程度以及交付的价值。简单来说，该指标是团队（或\
  \ ART）在 PI 期间交付的业务价值除以计划的业务价值。⁴⁶\n3. 问题解决工作坊，这是一个 ART 级别的回顾，在期间期间，整个项目的成员将脑暴他们最大的问题及其根源，并思考改进流程的方法。\n\
  \n利用 HCD 执行者在阅读和对人们的反应做出反应方面的培训的一种方法，是要求他们在 PI 系统演示期间进行全局的情感捕捉。HCD 专业人士将分散在观看演示的群体中，以观察更广泛的参与者的反应，而不仅仅是那些恰好坐在他们旁边的人。这是一个寻找并记录离群值的绝佳机会；当所有人都普遍地喜欢某个功能时，但坐在旁边的一个个人面色难看。那个人可能知道其他人人都不知道的事情。观众越多，HCD\
  \ 团队越应该散得开。\n\n演示之后，让 HCD 团队与任何离群者进行交谈，并对演示中每个有意义片段的“局部”反应进行评分/比较也是很好的。观众参与感如何？是怀疑的？还是理解的？这可以是非正式的，也可以正式化为适用于该团队和观众的特定量表。演示本身是\
  \ HCD 团队未来研究问题和想法的绝佳来源。\n\n在问题解决工作坊期间，HCD 可以帮助 ART 同意要解决的问题，然后深入研究其根源，识别哪些是已知的哪些需要学习。HCD\
  \ 执行者接受过通过提问几个问题将观察转化为行动/协议的培训：\n\n* 团队试图解决什么问题？\n* 问题解决后会有什么改进？\n* 利益相关者如何知道问题已得到解决？\n\
  \nHCD 执行者可以确保团队关注问题的根源，而不仅仅是症状。\n\n### 战略组合评审 (Strategic Portfolio Review)\n\n战略组合评审⁴⁷\n\
  \n体验架构师在其中起着关键作用，为对话带来新的且来之不易的见解，确保策略不会从高管层向下流动，而完全不考虑现实世界中用户的想法和感受。这次会议的核心在于评估“正确的问题——正确的解决方案”，并防止高管在真空状态做出策略决策。在\
  \ PI 规划前几周举行这些战略评审是一个好主意，因为给产品经理和业务所有者提供了时间在规划和安排下一个 PI 功能优先级之前，考虑上一个 PI 学到的内容。它还为他们提供了让其\
  \ HCD 执行者深入挖掘需要更多洞察的领域。这确保了他们在为下一个 PI 确定功能优先级时，其策略是与最新洞察同步的。\n\n组合愿景⁴⁸\n\n* 用户如何想和感受？\n\
  * 我们在上一个 PI 中对用户和市场学到了什么？\n* 根据这些学习，我们的策略应该如何演变？\n* 考虑到这些新学习，在下一次 PI 规划之前是否有我们必须参与的新学习领域？\n\
  * 哪些未知可以变成已知？\n* 个体解决方案或产品如何根据这些学习调整策略？\n\n体验架构师在这里展示“实验墙”并不少见，使他们的所有工作透明化。通常，用户参与实验以“待办–进行中–已完成”的格式呈现，特别强调那些产生了新客户洞察、新功能想法或可以反驳之前假设的完成实验。演示中还会考虑风险价值，因为高风险工作通常需要更多的\
  \ HCD 研究投入。\n\n解决方案架构师和其他技术从业人员也会参加这次会议，会议通常包含技术部分。\n\n\n\n\n\n如果说战略组合评审（strategic\
  \ portfolio review）是重新评估和对齐策略的地方，那么组合同步会议（portfolio sync meeting）……\n\n有些组织选择在举行战略组合评审的月份跳过组合同步会议。这是一个错误。这两个会议的成员通常有重叠，虽然大家都希望参加的会议少，但这些会议的目的是不同的，因此跳过组合同步会议的组织错过了检查其组合状态的宝贵机会。\n\
  \n还需要注意的是，有时直接影响策略的见解会在这些会议上进行传达。当这种情况发生时，要抓住机会，不要等待下一次战略组合评审。将这些见解直接提供给需要它们来做出决策的利益相关者，以免其过时失去价值。这是根据见解和快速学习动态调整策略的关键组成部分。\n\
  \n### 欢乐时光 (Happy Hour)\n\n这是大家说出心里话的地方。（开玩笑的。大体如此。）\n\n说认真的，非正式会议对于完成工作至关重要，对于团队建立信任和联系也同样重要。这不仅意味着对工作进行无过滤的对话，还意味着讨论非工作相关的话题。在这种环境下，团队有机会了解彼此的兴趣和爱好，并将同事视为独立的人来认识。这种熟悉感产生了信任，正如西蒙·辛奈克（Simon\
  \ Sinek）所说：“团队不是一群一起工作的人。团队是一群相互信任的人。”\n\n# 第 13 章 扩展团队结构\n\nDOI: [10.4324/9781003188520-18](https://doi.org/10.4324/9781003188520-18)\n\
  \n在小型范围内，单个敏捷团队在很大程度上是独立的，与其他团队很少或没有依赖。随着规模和复杂性的增长，需要更多的从业者和团队。在某一点，团队集群会失去焦点，并产生竞争性的优先事项和目标。为了让大量团队达成一致，SAFe®\
  \ 使用了一种称为敏捷发布火车（Agile Release Train, ART）的概念。\n\n## ART 在更长跨度内的计划\n\nART 允许大量人在比单个团队迭代更长的时间跨内进行思考和合作。计划间隔（Planning\
  \ Intervals）是 8-12 周的迭代集合，允许团队在更长的时间范围内上规划更大的工作。除了允许在更长的时间范围内规划更大的工作外，在整个项目中具有这种级别的可见性意味着团队和领导层能够意识到工作之间的依赖关系。对于\
  \ HCD（以人为本的设计）从业者来说，这种额外的结构使得在开发者提取故事进行实现之前，计划和协调研究与设计工作变得容易得多。\n\n### ART 交付特定的客户价值\n\
  \nART 并非由随机、不相关的工作组成。相反，它们围绕工作交付给用户的特定价值进行组织。这很重要，因为新角色和活动的目的是为了确保史诗（epics）和特性（features）作为一个整体支持共同目标，并在连贯的成功愿景中共同工作。产品经理负责确保\
  \ ART 上所有团队的工作都支持 ART 的总体目标，而这些目标反过来又支持更大的组织目标。不能因为“他们有空闲”就将随机、不相关的工作分配给 ART。\n\n\
  ## 更新用于规模敏捷的团队角色\n\n扩展敏捷需要新的角色来跨团队进行协调并提供战略指导，管理优先级和资源冲突，并确保 ART 上的所有团队协作工作，共享共同的产品愿景和技术愿景。\n\
  \n### 产品经理\n\n必须由单个人而非小组或委员会负责开发和传达产品愿景。\n\n### 发布火车工程师 (Release Train Engineer)\n\
  \n大型团队集合（如 ART）需要一个人（具体说是一名敏捷专家）来协调许多 Scrum Master，促进 ART 级事件，并对 ART 和利益相关者进行敏捷实践教练。这名“首席\
  \ Scrum Master”被称为发布火车工程师 (RTE)。\n\n*   促进 ART 级事件和规划会议\n*   设定并传达这些事件的日历表\n*  \
  \ 跟踪 ART 级指标\n*   确保所有 Scrum Master 保持一致，并快速消除 Scrum Master 提交的阻碍\n*   帮助识别风险并管理依赖关系\n\
  *   跟踪特性完成的进度\n*   确保产品经理与产品所有者之间达成一致\n*   帮助识别并消除瓶颈\n*   确保产品愿景、路线图和项目待办事项列表（program\
  \ backlog）得到整合\n\n该角色的责任比描述所暗示的更大、更难。\n\n### 系统架构师/工程师 (System Architect/Engineer)\n\
  \n需要的下一个主要新角色是某来让许多团队（甚至是供应商）对齐共同的架构愿景，并填补第 12 章描述的在规模化时出现的技术空白。这一关键角色负责评估技术替代方案、创建持续交付流水线，\n\
  \n### 业务所有者 (Business Owner)\n\n最后，在扩展时，需要对解决方案成功负最终责任的高级利益相关者或高管。SAFe® 将这些人称为业务所有者，他们负责“由\
  \ ART 开发的解决方案的治理、合规性和投资回报率（ROI）”。\n\n### UX 架构师 (UX Architect)\n\n虽然不是 SAFe® 的正式组成，但团队可能需要某人来管理设计并协调研究，就像系统架构师/工程师对齐技术利益一样。此人负责设定设计标准和治理，确保研究得到适当协调和执行，并确保整体产品（或价值）与整体体验保持一致。如果没有专门的人管理体验，ART\
  \ 可能会出现“体验漂移”，即单个体验本身是合理的，但它们无法协同作用以形成完整的、整体的体验。鼓励实践 SAFe 的团队思考 UX 架构师如何让其项目受益益，通常是通过在团队内部及团队之间建立设计评审和批判的实践。\n\
  \n## 更新用于大规模 HCD 的团队拓扑结构\n\n从少数团队的敏捷变为许多团队的敏捷时，团队组成会发生变化。目标仍然是拥有完全自给足的团队，但在实践中，某些团队在特定时间或间隔只需要某些技能组合（特别是\
  \ HCD 技能）。任何扩展敏捷的方法，特别是敏捷中的 HCD，最终都必须解决完全独立的团队并不总是高效模型的问题。\n\n确定在 SAFe® 项目中部署 HCD\
  \ 从业者以产生最大效果至关重要。最终，团队拓扑结构和 HCD 从业者的部署取决于几个因素，例如 ART 上的从业者人数、工作总量以及正在进行的工作类型。为了做到这一点，应该：\n\
  \n*   一名 UX 架构师协调工作\n*   将 HCD 从业者嵌入到有足够工作的团队中\n*   一个 HCD 共享服务团队，可以支持有限的参与并管理设计和研究运营活动\n\
  \n### 将 HCD 从业者嵌入敏捷团队\n\n\n\n\n某些团队自身需要完成足够的人性中心设计（HCD）工作，以至于将 HCD 作为团队的直接且持续的组成部分是值得投入的而另一些团队可能仅在需要时（ad\
  \ hoc）才需要 HCD 支持。将 HCD 实践者嵌入到有足够支持工作的团队中，意味着他们可以承担所有的团队职责，并充分参与所有团队活动。结果是他们对正在构建的产品有了更深入的理解。因此，他们可以更方便地支持日常决策，包括实施过程中任何影响终端用户体验的调整，并能提供更好的保证，确保体验按预期交付的。\n\
  \n判断一个团队是需要专门的还是临时的 HCD 支持，涉及几个关键决策因素：\n\n*   该团队对终端用户体验进行更改的频率有多高？某些团队频繁进行此类操作；另一些团队的工作中终端用户体验只是所谓的“冰山一角”。\n\
  *   终端用户体验的变化幅度有多大？这些变化会影响多少用户？风险/收益有多大？\n\n### 扩展到共享服务 HCD 团队\n\n在大多数计划中，并不是每个团队都需要全职\
  \ HCD 支持，某些团队（那些本质上更具技术性的团队）可能完全不需要。对于较大的计划，建立共享服务团队是有意义的，它可以为那些不需要嵌入式实践者、或者实践者定期需要额外支持的团队提供灵活支持。这个共享服务\
  \ HCD 团队应该像其他团队一样运行，拥有自己的 `Product Owner`（产品负责人）、`Scrum Master`（敏大师）和待办列表（backlog）。\n\
  \n在战术层面，共享服务团队允许计划在关键点将 HCD 服务引入团队，这使得开展发现、构思、精炼、概念验证、解决方案验证和评估活动变得要容易得多。通过这种方式，共享服务团队让\
  \ HCD 的参与在计划内部更加稳健且更加灵活。\n\n除了为团队提供直接支持外，HCD 共享服务团队还是设计运营（design operations）、研究运营以及跨团队活动的天然归宿。请参见图\
  \ 13.1 对这两种团队拓扑结构的描述。\n\n![图 13.1 左侧显示了集成到敏捷团队中的 HCD 实践者，右侧显示了首选的集中式“共享服务”HCD 团队，某些单个团队拥有自己的\
  \ HCD 资源。](img/Figure13_1.jpg)\n\n图 13.1 左侧显示了集成到敏捷团队中的 HCD 实践者，右侧显示了首选的集中式“共享服务”HCD\
  \ 团队，某些单个团队拥有自己的 HCD 资源。\n\n### 战略规划与支持\n\n除非某个计划在整合 HCD 方面已经达到了相当先进的成熟，否则没有嵌入 HCD\
  \ 实践者的团队将需要如何在自己的交付周期内开展 HCD 活动的战略指导。拥有拥有自己的 `Product Owner` 和 `Scrum Master` 并能够帮助其他团队的共享服务团队，会让计划将\
  \ HCD 整合到工作中变得更容易。这是因为，让非 HCD 实践者（`Product Owners` 和 `Scrum Masters`）能够从他们自身角色的角度谈论\
  \ HCD，对于 HCD 被采纳计划的程度将产生巨大的影响。\n\n### 设计与研究运营\n\n在建立共享服务团队时，计划为所有属于这两个类别的活动获得了一个清晰的操作基础，而不是希望在团队资源之间进行临时的协调来完成相同的任务。此外，这一点再强调也不为过，拥有一种集中的方式来处理研究活动的招募将为每个团队节省大量工作。\n\
  \n### 技能支持与增长\n\nHCD 通常被谈论得像是一项技能，但实际上，它是许多技能的融合，结合了设计和研究实践。拥有共享服务团队的一个虽然微妙但非常有价值的结果是，嵌入团队成员有了一个可以进行教练和反思的地方，这种增长是仅靠嵌入式实践者无法实现的\
  \ HCD 技能增长。\n\n\n\n\n\nSAFe® 在持续探索（continuous exploration）中定义了两个对 HCD（以人为的设计）从业者特别感兴趣的活动：`hypothesize\
  \ and collaborate`（假设与协作）以及 `research`（研究）。\n\n对于交付工作的从业者和团队执行这项研究是一项良好的实践，这样对于解决的问题以及解决方案的用户背景的共享理解就能尽可能贯穿整个交付生命周期。\n\
  \n![图 14.2 持续探索中的活动已高亮。对 HCD 从业者而言最重要的活动是假设、研究和协作。](img/Figure14_2.jpg)\n\n图 14.2\
  \ 持续探索中的活动已高亮。对 HCD 从业者而言最重要的活动是假设、研究和协作。\n\nSAFe® 对持续探索的需求意味着，需要建立机会和流程，让团队能够开展产生关于用户需求和预期的见解的工作，对问题的多种解决方案路径进行思考，并在代码交付之前完成概念和解决方案的评估工作——即将部分工作“左移”到学习成本更低的地方。\n\
  \n## 持续部署与发布后评估\n\n持续部署如图 14.3\n\n图 14.3 按需发布的四个活动已高亮。HCD 团队将对这些活动应用定量和定性方法。\n\n\
  当 SAFe® 用于软件开发（这是它的高光领域）时，将部署与发布分离的威力变得显而易见。部署会持续发生，至少每两周一次。然而，发布是业务所有者决定何时让功能可用。这使得团队永远不需要回头查看某项，并且通常通过切换机制实现，该机制允许业务所有者随意开启或关闭功能。这可以在一小部分用户上测试新功能以获得额外反馈，或者在功能具有最大经济效益时发布它。\n\
  \n使用这种范式，业务可以驱动功能的发布，而不是由技术或迁移进度来决定发布日期。最后，这有助于 ART（敏捷发布团队）确保。\n\nHCD 从业者对 `overall\
  \ experience`（整体体验）有直接兴趣。定量和定性评估的结果会被引入迭代计划、Backlog 细化和 PI 计划。\n\n`表 17.1` 中列出的定量和定性活动至关重要，因为它们在受控环境中的表现总是与预期不同。用户也是如此。这些活动以及它们按节奏产生的见解，让\
  \ ART 能够确保。\n\n### 整体解决方案衡量与持续评估\n\n在团队专注于交付特定功能的高峰，确保程序不忽视整体体验至关重要。完全有可能构建出一系列按预期工作的功能，但从整体体验来看却开始产生负面影响。\n\
  \n产品管理团队（`Product Manager`、`RTE`、`System Architect/Engineer` 和 `UX Architect`）应该制定一个解决方案层面的评估计划，这通常比所有功能级评估的总和要多。定量和定性衡量是胶相成的，因为定量帮助团队理解“是什么”（因为行为在大规模上是可见的），而相比之下，定性衡量提供了关于用户如何思考以及他们为何这样反应的感觉。\n\
  \n虽然在 SAFe® 中没有专门的官方阶段（所有这些工作都可以轻松地存在持续部署中），但使用“持续评估”的概念是值得的，这可以强化这样一个观点：评估并仅在发布新功能时逐个功能地进行；它旨在覆盖整个体验。通过这种方式，HCD\
  \ 从业者可以将持续交付流水线想象为四个无限循环，而不是三个，第四个循环就是持续评估。\n\n## 研究路线图与 SAFe® 架构跑道\n\n前面的章节讨论了“运营”层面的活动，它为团队开展自己的工作提供了脚手架。无论是技术运营提供开发者将要使用的工具链、支持一致的面向客户产品的设计模式、模板和代码库，还是研究招聘，都需要一定程度的支持工作来确保每个团队避免从零开始构建自己的微型组织。\n\
  \n为了做到这一点，SAFe® 使用之前介绍的“架构跑道”（Architectural Runway）概念，它规定基础设施和 HCD 研究应“恰时”交付给 ART，而不是作为一项大规模的“启动式”工作——这种工作有时看起来像是在转向敏捷开发时被抛弃的旧“大前期设计”模型的组织版本。这项基础设施工作被纳入架构跑道并进行正常计划。区别在于，它代表的是组织价值，而不是被团队消耗的特定客户价值。\n\
  \n随着 ART 在架构跑道内开发功能，架构跑道会被消耗，然后通过下一批支持性工作（enabler work）再次构建。这本质上是来自 Backlog 的持续交付的滚动下降图。\n\
  \n\n\n\n与许多敏捷环境一样，SAFe® 倾向于将 `development` 工作视为需要跟踪的关键工作，因此程序通常由企业架构师在组合层（portfolio\
  \ level）定义并优先考虑赋能工作（enabler work），并在发布节点（ART）层面由系统架构师/工程师完成。\n\nSAFe® 识别了架构跑道（Architectural\
  \ Runway）上的四种不同类型的赋能工作：\n\n*   架构赋能（Architectural enablers）构建跑道（网络、服务器、防火墙等）。\n\
  *   基础设施赋能（Infrastructure enablers）自动化团队工作的测试和部署（自动化测试工具、构建和部署工具、监控工具等）。\n*   合规赋能（Compliance\
  \ enablers）管理文档和监管合规。\n*   探索赋能（Exploration enablers）管理旨在获取用户洞察的研究和其他活动。\n\n然而，观察最后这一类别，显然某些工作超出了技术领域，需要包含在非技术的“脚手架”概念中。当然，以人为中心的敏捷（Human-Centered\
  \ Agile）最关注的正是这类赋能（尽管需要注意的是，并非所有的探索性赋能都是为了 HCD 工作——也有技术性的探索）。\n\n在 SAFe® 中，研究路线图应该是架构跑道的一部分，并由体验架构师和或系统架构师组织。研究路线图包含以下类型的活动：\n\
  \n*   探索性研究，例如为即将到来的迭代所需的访谈、情境观察、服务映射和相关分析。除了针对特定计划功能的工作外，HCD 从业者可能还会参与进行更广泛的探索性工作，寻找未满足的需求或潜在的机会（解决正确的问题）。\n\
  *   协作构思活动，这些活动需要利益相关者（有时包括用户）与团队之间进行协调，以产生可测试的解决方案概念。在这些点上，可能会考虑多条解决方案路径。\n*  \
  \ 概念验证研究，用于支持协作构思中产生的拟议解决方案概念（正确的解决方案）。\n*   对正在开发中的设计进行解决方案验证/可用性测试（以正确的方式完成）。\n\
  *   评估性研究，用于支持已发布或上市的产品，并为程序或组合策略提供信息（以正确的方式完成）。\n\n重要的是，研究路线图中描述的 HCD 工作通常与架构跑道中的技术工作有所不同。因此，HCD\
  \ 从业者必须与系统架构师（拥有并优先考虑架构跑道的人）紧密合作，以确保他们能够看到这些工作。很多，系统架构师需要接受关于 HCD 工作及其对程序重要性的教育。\n\
  \n理想情况下，赋能工作应“及时”（just in time）交付给需要它的敏捷团队以便消费。这有时被描述为“在火车正前方铺设轨道”。这很重要，因为就像需求一样，HCD\
  \ 的洞察和发现会随着时间的推移而失效。虽然某些洞察是持久的（例如少数用户群中的长期态度），但其他方面（例如行为模式、预期或未满足的需求）会随着触达用户的新功能和体验的发布而改变。在实践中，许多洞察过时的速度比想象的要快。\n\
  \n此外，规模的扩大增加了对洞察存储库的需求。随着所需研究量的增加，以一种跨项目可搜索和可消费的方式捕获这些洞察变得比以往任何时候都更加重要。\n\n![图 14.4\
  \ “核心 SAFe®”配置，包含了程序在大规模上成功的基础要素。](img/Figure14_4.jpg)\n\n图 14.4 “核心 SAFe®”配置，包含了程序在大规模上成功的基础要素。\n\
  \n图 14.4 展示了本章中讨论的所有结构，并整合进 SAFe® 的“大蓝图”。它展示了框架的“核心 SAFe”或最轻量级的配置。核心能力显示在周围周围的圆中（较大的配置提供更多能力），以精益-敏捷领导力为基础，并在\
  \ SAFe 核心价值观、SAFe 原则和精益-敏捷思维的支持。扩展角色都可以在左侧列中找到，而程序和团队待办列表位于角色的右侧。\n\n在图 14.4 中，持续交付流水线显示在两个规划间隔的可视化之上，包含了\
  \ PI 规划和检查与适应事件（图中的“I&A”）。底部是架构跑道的视觉描述，其中包含了研究路线图。最右侧是“跨越调板”，它包含了愿景、路线图以及构建架构跑道部分技术内容的系统团队。跨越调板随配置而增长。\n\
  \n# VI 衡量与应用以人为中心的敏捷\n\n# 第 15 章衡量解决方案性能\n\nDOI: [10.4324/9781003188520-21](https://doi.org/10.4324/9781003188520-21)\n\
  \n> *人们想要的不是一个英寸的钻。他们想要一个英寸的孔！*\n> ——西奥多·列维特\n\n在第 2 章中，设计被定义为“刻意创造特定的体验或结果”。在软件交付的背景下，存在一种为客户提供预期的价值（所谓的英寸的孔）。无论团队交付产品多么高效，如果该产品没有解决用户的问题（正确的问题），或者没有以有效的方式执行（正确的解决方案），或者没有以正确的方式完成（正确的方式完成），都是没有意义的。为了确保用户从产品中获得价值，团队需要一种衡量交付价值的方法，以反映他们的态度。\n\
  \n## 行为指标与态度指标\n\n简单来说，行为指标描述用户`做什么`，而态度指标描述他们`感受如何`。在大多数情况下，行为指标也是定量指标——即大量收集的行为（点击、页面停留时间、注册）。然而，态度指标通常是定性指标，通过访谈、观察和其他技术在较小规模上收集。它们被用于分析人们产生某种行为的因果，并对新功能将如何影响客户体验建立假设。虽然情况通常是如此，但这并非完美的划分：存在定量的态度指标（如净推荐值\
  \ [NPS] 和问卷）在大范围内汇总情感，而进行小规模定性研究的研究人员仍然观察并报告用户行为。\n\n\n\n\n\n在任何工作的问题定义阶段，都应该建立“北极星指标”（True\
  \ North metrics），以便在交付新功能时，能够评估该发布的成功程度。这应该在形成最小可行性产品（MVP）时就植入流程中，因为 MVP 是关于某项工作如何交付价值的假设。\n\
  \n## 信号指标 (Signal Metrics)\n\n任何旨在提供关于产品可能表现如何的间接信息的指标都是信号指标，团队可能受益于跟踪多种不同的信号指标。\n\
  \n在线产品信号指标的经典示例包括跳出率、页面停留时间、网站访问时间、总页面浏览等。另一个例子是，对于从参与到交易有清晰路径的产品，通常会有某种漏斗分析，以检查客户在流程中进展了多远。如果用户在购买过程的特定节点流失，这可能表明流程存在许多种值得进一步探索的问题。\n\
  \n## 确定跟踪哪些指标\n\n指标的讨论通常从一个问题：“我们可以跟踪哪些统计数据？”开始。然而，并非所有指标都是等同的。花费在所谓“虚荣指标”（vanity\
  \ metrics，即那些在报告中看起来很有价值，但实际上无法为产品策略决策提供依据的指标）上的时间和精力可能是浪费，或者可能导致优化某些适得其反目标的决策。此外，并非所有的指标收集工作都是完全被动的。在体验过程中的某些点，团队想要要求终端用户提供特定的反馈（“评价您的体验”）。与其尝试解释所有可用信号，不如识别出关于正在创建的产品或体验*需要*回答的问题，这是一个更好的方法。\n\
  \n这些问题可以是高层面的，也可以是细粒度的。团队提出一系列想要了解的问题并不罕见，其范围从对整个产品/体验的态度，到用户在大型整体旅程中特定时刻、互动或步骤中的感受和行为动机。\n\
  \n一旦制定了待回答的问题列表，敏捷团队应该举办一次工作讨会或练习，以确定哪些问题可以回答，以及回答成本如何。即使是关于投入多少精力收集指标的决策，也是基于风险的决策！\n\
  \n## 简单调查 (Simple Surveys)\n\n简单调查是直接从客户那里收集信息的常用工具。在以人为中心的设计（HCD）从业者中，调查的声誉有所下降，因为这是一种低保真的反馈收集方法。在使用调查时，团队无法直接观察或提出后续问题，因此他们依赖于用户的自述。调查还可能受到动机偏差的影响（只有最开心和最不快乐的用户提供反馈）。尽管有这些缺点，调查作为一种方法仍然具有几个优点：它们实施简单且成本相对较低，可以提供跨广泛用户群的纵向信息，并且在经过仔细创建和分析时，可以产生宝贵的见解。\n\
  \n### 净推荐值 (NPS)\n\nNPS 试图通过询问用户在 1–10 分的范围内有多可能向朋友推荐该解决方案，将用户情感简化为一个单一数字。自评 9 或\
  \ 10 分的用户被称为“推广者”，评分 7–8 分的用户被“中立者”，评分 6 分及以下的被认为是“反对者”。从这里开始计算，从推广者的百分比中减去反对者的百分比，并将结果表示为整数。理想情况下，按周期进行调查，以便通过图表查看\
  \ NPS 的趋势。\n\n虽然 NPS 很流行，但并非没有批评。主要的批评是该得分过于宽泛和简化，以至于其用途有限。团队可以在最高层面判断对产品的情绪是正向趋势还是负向趋势，但没有任何迹象表明*为什么*。虽然对于分数本身确实如此，但\
  \ NPS 也可以用来征评论和直接反馈，因此团队至少具有利用其进行更稳健的情感分析的额外潜力。此外，NPS 最适用于商业体验。并非所有体验都符合推荐/反对模型，这对于交付政府服务或提供基于需求的非营利捐赠的团队来说是显而易见的。\n\
  \n最后，在处理复杂体验或持续时间较长且具有多个触点的体验时，识别 NPS 代表的是整体体验还是特定的时刻/互动可能变得具有挑战性。顺便提，这种批评对于复杂体验的任何单分评分都很重要，无论是\
  \ NPS 还是替代方案，例如 `图 15.1` 所示的李克特量表评分系统。\n\n### 评分与直接反馈时刻\n\n* *你觉得这一章对你有帮助吗？* \U0001F44D\
  \ \U0001F44E\n* *你会如何评价这本书？* ☆☆☆☆☆（请给五星好评！）\n\n![图 15.1 一个李克特量表评分示例，通常以 5 点、7 点或\
  \ 9 点的形式呈现](img/Figure15_1.jpg)\n\n`图 15.1` 一个李克特量表评分示例，通常以 5 点、7 点或 9 点的形式呈现。\n\
  \n用户经常被要求提供即时反馈。很多时候，在提供负面反馈时，用户会被提示提供评论以进一步描述他们遇到的任何问题。与 NPS 类似，这些评分在存在某种信息性的、同质的比较（例如，相似产品的评分对比）或对体验进行纵向跟踪（即评分上升或下降，反映了所做的更改）时最有价值。这些是粗线条工具，团队可能会在特定的评论中发现比分值更具操作性的见解。与\
  \ NPS 不同，这些评分可以更容易地应用到团队感兴趣衡量的特定时刻或体验上。\n\n### 系统可用性量表 (SUS)\n\n系统可用性量表（SUS）评分比\
  \ NPS 稍微严格。\n\n该量表通过询问用户对 10 个陈述的同意程度来计算，使用 5 点李克特量表。以下是 SUS 调查中的问题：\n\n1. 我想经常使用这个系统。\n\
  2. 我觉得这个系统过于复杂。\n3. 我认为这个系统很容易用。\n4. 我认为我需要技术人员的支持才能使用这个系统。\n5. 我觉得系统中的各种功能整合得很好。\n\
  6. 我觉得这个系统中存在太多不一致之处。\n7. 我想象大多数人会很快学会使用这个系统。\n8. 我觉得这个系统用起来很笨。\n9. 我对使用这个系统很有信心。\n\
  10. 在开始使用这个系统之前，我需要学习很多东西。\n\n### 自定义调查\n\n由于调查非常流行，团队经常创建自己的调查以更好地了解用户对其产品的看法。自定义调查具有巨大的优势，因为团队可以根据学习目标来构建问题（而不是使用通用的类\
  \ NPS 评分），并将定量评分问题与寻求开放式反馈的定性问题结合。\n\n\n\n\n\n调查问卷有几个需要注意的关键限制。对于希望跨时间或跨小组比较调查结果的团队来说，保持标准化的问题并在所有调查中使用一致的衡量方法是非常重要的（即团队之间使用相同的衡量量表，并以相同的方式获取情感）。此外，由于调查问卷对清晰度和语气非常敏感，它们应该遵循适用于团队其他产品的相同内容指南。最后，调查问卷在被测量的体验结束后立即完成（或尽可能在结束后立即完成）时最为准确。\n\
  \n除了内容之外，考虑给用户提供多少问题以及完成问卷需要多长时间也很重要。时间较长的问卷通常返回的结果较少，而且并非所有类型的问题问都需要相同的时间来完成。\n\
  \n### 其他定性评估方法\n\n访谈、情境探究（contextual inquiry）甚至异步可用性测试在之前在发现或验证的背景下都已描述过。对于已经发布的产品的评估过程，这些方法同样具有价值。团队可能还计划了远程情感分析或数字民族志，以获得对对产品态度的定性理解。评估工作需要与项目其他阶段相同类型的规划。\n\
  \n### 指标框架\n\n对于那些难以识别解决方案或功能的“北极星”（True North）和信号指标的团队，以下框架可能提供一个很好的起点。每个框架都关注用户体验的不同方面，并提供了一个结构，用于思考在审视指标时需要回答哪些类型的问题。\n\
  \n### Google HEART 框架\n\nGoogle HEART 指标框架。\n\n值得的是，这个框架以及专门对参与度（engagement）的关注往往适用于某些类型的产品，例如那些通过持续使用获得业务成果的产品。当然，也有一些产品（如汽车保险），它们通过在用户生活中留下尽可能*轻*而不是最重的负担来让用户感到快乐。\n\
  \n### 海盗指标\n\n“海盗指标”（Pirate metrics）是一些从业者可能会听到的另一个术语，特别是针对数字产品。这个名字来自于缩写 `AARRR`，它代表获取（acquisition）、激活（activation）、留存（retention）、推荐（referrals）和收入（revenue）。海盗指标很有趣，因为团队喜欢像海盗一样大喊\
  \ `AARRR!`。（试试看。）它们对于为数字产品的利益者提供一组“全方位”指标也很有，可以向他们展示产品性能的整体状况。\n\n表 15.1 受 CleverTap\
  \ 的 Emily Bonnie 工作启发的 Google HEART 指标示例\n\n| | 目标 (Goal) | 信号 (Signal) | 指标 (Metric)\
  \ |\n| :--- | :--- | :--- | :--- |\n| **幸福度 (Happiness)** | 应用、解决方案或产品是否易用、有用、直观且有趣？\
  \ | 积极反馈；良好的评价 | `NPS` 或 `SUS`；应用/产品评分；积极的调查或评价结果 |\n| **参与度 (Engagement)** | 用户是否喜欢使用该应用程序？他们是否计划继续使用它？\
  \ | 应用或产品使用量增加；经常回来；参与在线论坛和/或订阅邮件 | 在应用或解决方案中花费的时间；社交媒体上的提及；应用内的点击次数 |\n| **采纳 (Adoption)**\
  \ | 用户是否看到了产品或解决方案的价值？新用户是否正在采用它，并优于替代解决方案？ | 购买应用程序、产品或解决方案；在新功能开发时使用新功能 | 新订阅；推荐订阅\
  \ |\n| **留存 (Retention)** | 用户是否经常返回该应用程序或解决方案？ | 续订会员或订阅；推荐朋友；不切换到竞争解决方案 | 高级订阅升级；重复订阅；付费用户数量\
  \ |\n| **任务成功 (Task Success)** | 用户是否能够轻松高效地完成他们的预定任务？ | 完成的任务；缺乏错误；无需重做 | 任务放弃率；错误率；每个任务耗时\
  \ |\n\n对这些每个类别的探索顺序如下：\n\n-   **获取 (Acquisition)**——这组指标捕捉了用户如何进入网站。他们是来自 `SEO`\
  \ 和搜索引擎、在线广告、邮件邀请、公共关系等吗？利益者通常对影响最大的获取渠道感兴趣，即那些低成本/高流量的渠道。\n-   **激活 (Activation)**——这意味着给用户提供良好的产品初体验，使他们对它感到兴奋并投入其中。在这里，团队通常会衡量一些事宜，如页面停留时间、页面点击以及任何其他衡量用户与产品或网站交互程度的指标。他们的访问体验得好吗？他们他们在访问期间购买了溢值服务吗？他们使用了多少功能？\n\
  -   **留存 (Retention)**——这组指标衡量了用户返回使用产品或网站的频率，通常是在 30 天内。这种指标有时可以通过通过在正确的时间进行正确的跟进沟通来提高。例如，通过自动邮件告知新用户其他功能或特别优惠。这些邮件的指标可能会捕捉接收者中点击链接跳转到网站的百分比。\n\
  -   **推荐 (Referrals)**——这是一组关于理解哪些用户推荐其他用户注册的指标。如果用户对产品足够满意并愿意推荐朋友，那么他们处于一个良好的状态，可以激励这种行为并启动病毒式营销活动。\n\
  -   **收入 (Revenue)**——这组指标帮助利益者理解用户从产品中获得的价值，以及产品产生收入的位置。通常，产品所有者（Product Owners）想要知道需要多少收入才能收支平衡，以及多少才能让老板满意。团队经常根据最近发布或更改的功能来衡量收入波动。\n\
  \n尽管指标非常有用，但团队的一个常见模式是使用的指标*过多*。正如生活中的许多事情一样，少即是多。不要试图将产品性能的所有复杂性和细微差别过度简化为一或两个狭窄的指标。同时，避免使用应用程序管理工具建议的所有指标的诱惑。团队需要追踪几十个指标指标的情况非常罕见。\n\
  \n### 目标与关键结果\n\n目标和关键结果 (`OKRs`) 最近已成为敏捷领域的热点话题。甚至有了 OKR 认证。OKRs 与敏捷开发非常契合，因为两者都将大型工作单元拆分为较小的单元，并关注结果。目标是更大的、宏性的目标或结果，而敏捷特别是以人为中心的敏捷开发是关注结果的。关键结果是有助于实现大目标或目标的较小结果。\n\
  \n\n\n\n作为一套步骤和实践，构建一套“以人为中心的敏捷实践”听起来可能既复杂又令人生畏。但它并不非得是如此；它是一个从几个基本原则和实践建立起来的迭代过程。\n\
  \n为了说明这一点，我们将使用一家名为 `DIY Fly` 的虚拟公司以及他们（刻意为之）非软件产品作为示例。我们出版社的律师要求我们声明，本书中提到的任何人物、公司或产品与实际人物、公司或产品之间的任何相似之处均非本意。（这恰恰具有真实的优点。）\n\
  \n# 人与想法\n\nWilliam 小时候就喜欢制作模型飞机。他从基础的纸飞机开始，然后转向轻木制滑翔机，随着年龄增长，进化到了简单的遥控模型。大学毕业后，他在一家大型软件公司从事营销工作，但在业余时间里，模型飞机依然是他的爱好。多年来，他设计了许多日益复杂的模型，并且在材料使用上极具创造力，利用能找到的任何材料来加固飞机，同时仍让它们保持在空中——纸盒、庭院告示牌以及（最有创意的）电子屏幕保护塑料，这种塑料既薄又结实，足以保护他最轻的纸质模型而不会对飞行产生太大干扰。\n\
  \nTom 是受过空军训练的飞行员，退伍后在一家航空货运公司担任经理。和 William 一样，他童年的大部分时间都在制作飞行模型飞机，并将这一爱好带到了成年。作为一名持证飞行员，Tom\
  \ 倾向于选择那些昂贵且复杂的遥控模型，这些模型拥有先进的电子系统、高科技充电电池和其他高级功能。Tom 更像是一个带摄像头的无人机玩家，但也喜欢自己制作和定制自己的飞行模型。\n\
  \n两人在当地的爱好商店相遇。William 是为了为他最新的设计购买一个小橡皮筋驱动螺旋桨，当 Tom 听到他与店员的对话时，他走上前来自我介绍。两人讨论了\
  \ William 用纸张和薄塑料片制作滑翔机的实验，以及他希望通过增加螺旋桨来延长飞行时间的想法。Tom 当正要去当地飞行模型俱乐部的机场试飞他的大遥控模型，于是他建议\
  \ William 加入他们，友谊就此产生。\n\nTom 对 William 仅用纸张和薄塑料就开发的各种“扁直”设计留下了深刻印象，并想进一步了解。在几个周末里，Tom\
  \ 与 William 一起努力，利用他在空气动力学方面的知识帮助设计新模型。他们在机翼上增加了上仰角（或“倾角”），在水平稳定器上增加了升降舵以延长飞行，最后增加了一个垂直稳定器，这极大地提升了飞行性能。\n\
  \n# 第一年\n\n在初期，他们会制作各种模型飞机，然后带着家属（如侄女和侄子）出去一起测试飞行。事实证明，这是享受户外时光的一种极佳方式，同时也为远离电脑屏幕提供了一个受欢迎的休息机会。最终，观众扩大到了他们的朋友，并很快包括了朋友的朋友们。Tom\
  \ 和 William 本并没有打算在爱好上花费这么多时间，但他们的玩具变得越来越受欢迎。作为爱好者，他们将自己和朋友用作即时发现和概念验证的受试者。不久后，有人建议\
  \ Tom 和 William 创办一个众筹的创业项目，两人同意尝试一下这一想法。众筹将作为问题验证和概念验证的第二个阶段。\n\n合伙人决定制造并销售 William\
  \ 在两人相遇时一直在制作的那种塑料滑翔机的高级版本。他们获取原材料相当容易，尽管由于数量较小导致单位成本比他们预期的（或希望的）要高。他们很容易获得了纸板箱来包装完产品，当地的快打印店也非常乐意帮助他们设计标签和说明书。他们面临的大问题仍然找到切割塑料的方法。他们需要工业级的模切资源，而找到一个能够挤进他们较小生产规模的资源比预想的要困难。在这个阶段，他们仍然根据产品性能来衡量成功，而不是根据他们的产品对客户产生。\n\
  \n在克服了在“空闲”时间里建立小型制造业务的初期起伏和停顿后，他们对第一批产品的销售情况感到非常满意。当小型爱好店开始表现出零售兴趣时，他们感到很惊讶。\n\n\
  他们想知道如何交付订单，主要担心他们突然需要大量原材料的采购问题。这项企业从一种消遣迅速成长为半职业。他们建立了法律合伙关系，并开通了信贷额度来支付费用。然后，他们安排了供应商，并将以前的随机性过程进行了标准化。很快，他们发现自己需要额外的帮助，并雇用了一名全职员工。接着，他们又雇佣了一个。不久后，他们就有六个人为他们工作了。尽管如此，收入还不足以辞去工作，但很明显，这不再仅仅是一个爱好了。他们现在有一有一产品、稳定但小规模收入流以及一个基础构思和完善流程的公司，这个流程仅涉及制造他们喜欢的东西并自己进行测试。他们在观察人们飞飞机时收集反馈，但他们的设计修改完全基于自己对什么才算成功的想法。这太棒了！\n\
  \n# 新产品\n\n对最初的成功以及创造了一个充满活力的小企业的实感到兴奋，William 和 Tom 开始梦想更宏大的目标，思考需要什么才能将这变成一家“真正的”业务，以便辞去“朝”工作。\n\
  \n他们开发了基础的产品组合：一个全组装塑料滑翔机、一个发射滑翔机的弹弓，以及一个带有橡皮筋驱动螺旋桨的全组装塑料飞机。每一个新产品都是原型的改进，并借鉴了 Tom\
  \ 和 William 的经验。这些迭代产品的飞行性能确实更好。\n\n# 与用户互动\n\n\n\n\n对于汤姆和威廉来说，幸运的是，汤姆的妻子洛里（Laurie）是一位丰富的用户体验（UX）专业人士。由于知道参与丈夫的工作可能会产生婚姻紧张和压力，洛里一直对\
  \ DIY Fly 保持距离。然而，当她看到汤姆在那些在她看来是创业基础的基础上挣扎时，她觉得是时候介入了。\n\n洛里告诉合伙人，他们需要花更多时间来了解客户。诚然，他们了解产品，但如果他们不知道是在为谁构建产品，那么这一切毫无意义；洛里指出，他们一直以来只是为了自己，而不是为了别人。她建议直接与现有客户交流。他们需要来自那些购买并飞过\
  \ DIY Fly 飞机的人的反馈，而不仅仅是那些已经支持他们的人。\n\n在洛里的建议下，他们首先开展了若干活动，旨在识别、分类并理解他们的客户。他们意识到自己需要更好地了解：\n\
  \n* 谁在买他们的产品，更重要的是，为什么。\n* 他们的客户对产品是否满意。\n* 他们如何调整产品组合以使其更具吸引力。\n* 客户是否想要任何额外的功能或不同的产品变体，他们可以完善并随后验证这些想法。\n\
  \n由于他们使用过 Kickstarter，他们最初就拥有一大量的客户联系信息。尽管在第一批飞机发货一个月后已经发送了一份满意度调查，但除了几个热情的回复和一些投诉外，他们没有收到许多实质性的回应。他们需要详细的反馈。\n\
  \n### 招募\n\n威廉和汤姆决定通过招募激励联系特定个人。在排除亲友后，他们向信息收集会议发送了邮件邀请，提供 20 美元的亚马逊礼卡作为参与奖励。他们对自己的这次招募努力感到自豪，并认为自己搞定了一切。随着业务的增长，他们会发现，看起来如此简单容易的事情其实两者皆非如此，而且对于他们整个研究工作的成功至关重要。多年后，当他们费力招募会说西班牙语且尚未在学生中使用过他们产品的教师（学习目标是确保他们的说明清晰）时，最初向“任何人”发送邀请函和礼品卡优惠的简单做法显得是很古老。\n\
  \n## DIY Fly 启动\n\n协调采访的时间比预想的要长，但他们成功安排了相当数量的访谈。尽管经历了几次缺席和少数人提供的反馈无关紧要，他们从许多参与者那里获得了宝贵的信息。汤姆和威廉注意到某些主题的出现，这促使他们改变产品开发（以及待办事项细化）的方法。他们还发现客户可以分为以下几类：\n\
  \n* **爱好者**——当他们开始商业化销售产品时假设的“首要”市场。这些客户通常对预装滑翔机、电池动力飞机以及制作纸质滑翔机的模板和设计等产品想法反应良好。\n\
  * **家长**——“次要”市场，他们希望买一些可以和孩子一起度过的东西。然而，这组人的产品组合具有挑战性，开发更复杂产品的想法行不通。\n* **STEM 教师**——“意料之外”的市场，包括为了教学空气动力学基础而进行的购买。适合这些用户的产品是纸滑翔机的设计模板、帮助教师学习并向学生教授这些内容的说明书，以及用于课堂的幻灯片和其他教学辅助；参见图\
  \ 16.1。在采访期间，汤姆和威廉了解到这一群体需要保持成本最低，因此他们希望采用自行组装的方法。\n* **高级爱好者**——“更有经验”的用户市场，由年龄较大的孩子、青少年和已经接触过他们的产品并想作为爱好继续学习和钻研的学生组成。这组人表示想要某些产品，例如包含更复杂、细微空气动力学理论的高级设计模板、可以连接到任何纸质或塑料滑翔机设计上的独立电池驱动螺旋桨，以及飞行时间更长的简单低成本遥控电池动力飞行模型。\n\
  \n![图 16.1 DIY Fly 开发的 STEM 教师画像。](img/Figure16_1.jpg)\n\n图 16.1 DIY Fly 开发的 STEM\
  \ 教师画像。\n\n### 理解并捕捉用户需求与愿望\n\n当汤姆和威廉开始将现有的产品线映射到他们开发的客户细分和用户画像时，他们发现他们的产品组合存在明显的空白，导致整个客户群体对他们的需求没有理想的解决方案；参见表格\
  \ 16.1。\n\n表格 16.1 按客户细划分的 DIY Fly 产品及产品空白\n\n| 客户细分 | 现有产品 | 产品空白 |\n| --- | ---\
  \ | --- |\n| 爱好者 | 预装滑翔机、简单电池动力飞机 | 制作纸质滑翔机的模板和设计书籍 |\n| 高级爱好者 | 无 | 遥控和方向技术、包含更复杂细微的高级设计模板书籍\
  \ |\n| 幼童的家长 | 预装滑翔机 | 更易组的飞机、更多装饰且更具“玩具感” |\n| STEM 教师和学生 | 制作纸质滑翔机的模板和设计书籍、简单电池动力飞机\
  \ | 帮助教师学习并向学生教授这些材料的书籍、帮助课堂的幻灯片和其他教学工具（例如设计中的空气动力学理论）、可以连接到任何纸质或塑料滑翔机设计的独立电池驱动螺旋桨\
  \ |\n\n这个矩阵显示，他们的客户识别出了汤姆和威廉甚至没有想过的需求。当他们考虑如何修改当前的产品组合以服务这些未充分服务或未服务的客户细分时，他们最初的担心很快变成了兴奋。他们使用便利贴记录想法，迅速开发了一份满足这些需求的长期功能清单。他们的一些想法看起来很具有挑战性，而另一些则是对现有产品的简单调整。\n\
  \n汤姆和威廉还转离了对“飞行时刻”和“空中时间”的关注（这些主导了他们迄为止的构建工作），并开始整合采访会议的反馈，包含围绕“飞行”的整个时间线和系列互动。其他阶段是：\n\
  \n* 探索产品（购买前）\n* 预期产品（购买后）\n* 开箱（产品到达）\n* 建造/组装\n* 飞行\n* 记录飞行\n\n这些步骤中的每一步都包含了特定的改进机会。他们的产品描述很详尽，但客户分享过使用/组装说明需要改进，这表明加入教学视频并对组装更困难的部分进行详细说明将会有帮助。汤姆和威廉对识别出的“预期”步骤感到惊讶，并对自己没有将“记录”视为一个独立的步骤感到失望。诚然，他们不太确定对这些步骤该做什么，但至少他们对用户眼中使用他们的产品的样子和感觉如何有了更完整的画面。\n\
  \n\n\n\n合作伙伴们对收集到的反馈进行评审和头脑风暴得越充分，就越开始理解自己的竞争地位。制作`model planes`是这种乐趣的一部分，无论客户的年龄或技能如何。比起仅仅买一架飞机，人们更享受制作飞机的体验（以及怀旧之情）。威廉想起曾读到关于贝蒂·克罗奇（Betty\
  \ Crocker）的故事，她发现烘焙配料中要求加入鸡蛋或其他简单原料，比做成最简单的产品更成功，因为这让客户参与其中。\n\n他们还意识到，通过为客户提供这种体验，他们的产品成本反而更低。汤姆和威廉感觉到，如果价格变得更高，他们可能需要考虑自己的飞机作为一种体验，与更昂贵的电子产品相比时处于如何。看来，“组装成品”是一个比最初预期的更具风险的方向。\n\
  \n在此时，汤姆和威廉根据他们的新发现设定了目标。他们希望制作并测试至少一种符合他们新目标客户的新产品，并看看是否可以衡量并提高现有客户从版本到版本的幸福感。他们还想找到改进客户体验每个\
  \ `step` 的方法，即使只是微小的改进。\n\n罗里不断向他们强调，为每个新功能想法建立“利益假设”中有一个是不符合直觉的部分。这是概念验证：通过这种策略在足够早的阶段确认假设，以便在早期工作未证明成功时，能够转向其他方法。罗里还提倡进行小批量工作、快速获取反馈并持续改进。\n\
  \n## DIY 飞行创造了新产品\n\n汤姆和威廉决定，一次传统的头脑风暴会议是必要的。在罗里的建议下，他们租了一个会议空间来容纳员工、客户和潜在客户，这样他们就能拥有一个有充足白板空间供构思的大房间。他们预订了一整天的时间，并准备了优质的外卖作为午餐和零食。随着他们举办了更多会议，他们学会了此类活动的永恒法则：提供\
  \ `good` 食物（而不只是披萨和甜甜圈）的成本是分分钱值的，并且能带来更高的参与者（以及员工）的投入度和幸福感。\n\n罗里建议他们采取更现代的方法，而不是简单地把每个人推进会议室并问：“你们有什么想法？”听从了她的建议，他们花第一个小时回顾了关于客户的已知信息。他们讨论了创建的用户画像，确保所有人对客户旅程的样子达成共识。罗里还邀请了客户来电，分享了他们在购买和飞行飞机体验中最喜欢和最不喜欢的部分。\n\
  \n接下来，汤姆和威廉发布了他们的目标：为每个画像至少提供三个全面的新产品或改进，目标是尽可能触及多的“关键时刻”。他们将这些时刻表述为带有特定目标的问题，诸如他们如何能让较小孩子制作得更容易，以及如何向“期待”中增加更多乐趣。\n\
  \n他们从识别一些灵感开始——他们每人都带进了一个他们非常喜欢的产品或体验的例子，并解释了为什么喜欢它。然后，他们进行了一项旨在识别愿的创意练习：他们每个人为自己写了一张“来自未来的明信片”（一张来自明年的祝贺明信片），关于取得了什么，然后进行了分享。最后，为了进入创作自由的氛围，他们进行了一项名为“坏主意”的练习，期间他们每个人都尝试想出一个能想到的最糟糕的新产品想法，但这个想法仍要某种程度上符合目标。（这让他们开始讨论最初是什么让想法变得“好”或“坏”的。）这帮助他们转向个人构思工作，然后转向对这些已确定目标的潜在解决方案的协作工作。他们讨论了彼此的工作，然后分成不同的小组进行进一步分析。\n\
  \n小组迅速为每个提议的产品或修改方案生成了“待办列表（backlogs）”。他们想出了数量惊人的“显然”的改进，例如提供其他语言的说明书，并提供用于装饰飞机的贴纸书，让较小的孩子即使是预组装模型也能进行个性化。一旦所有的想法都被捕获，他们就拍了照片记录。清单上的所有事情是不可能的，至少无法一次性完成，所以第二天，他们根据潜在价值对待办事项进行分类，这种方法被称为\
  \ MoSCoW 方法——必须有、应该有、可以有、不要求。\n\n\n\n\n研讨会取得了圆满成功。Tom 和 William 的想法多得说不完，这既让他们感到压力，又让他们感到兴奋。他们精力充沛，从“必选”清单中挑选了前几个想法，团队也投入了工作。\n\
  \n### 他们的计划\n\n他们的第二个 Kickstarter 项目恰好赶上了假日品季，而现在已经是二月了——他们希望在明年春/夏季推出新产品。他们希望从\
  \ Kickstarter 转向更传统的分销模式——包括通过大型在线零售商和实体店。他们开始意识到玩具的订购季节，这些季节发生在实际购买热潮（春季/夏季、开学季、假期）之前。目前，他们计划继续与几家分销商合作，直到他们认为对销售和产品开发有了更好的控制，但仍需满足特定日期以确保有可出货库存。\n\
  \n他们决定专注于三个领域：\n\n1.  **各层面的改进说明。** 他们需要考虑如何提供其他语言的翻译（最初的想法是付钱大学生翻译法语和西班牙语，这可以涵盖大多数北美观众）。他们还需要探索为现有和未来的产品制作组装视频（并考虑\
  \ `those` 视频是否也需要提供其他语言）。这项工作是“触手可得的果实”——容易完成，而且在使用现有产品线的同时，极大提升了许多用户的体验。\n2.  **对\
  \ STEM 教师的支持。** 解决方案的想法列表从创建针对初中学生的空气动力学教学材料，到让他们的产品对于“实验”更具“定制性”。这需要更多的研究，因此 William\
  \ 和 Tom 开始制定一个计划，进行更多访谈，希望能更好地了解什么是最合适的。\n3.  **一个针对“小手”设计的产品版本。** 他们没有做预组装，而是考虑可以卡扣在一起的产品，或者至少拥有更少、更大且容易组装的零件。大家都同意，除了零件更少/更大，包含一套贴纸让飞机可以个性化也是一个很棒的主意。\n\
  \n显而易见，团队在接下来的 6-12 个月里有大量工作要做，他们推测过程中会有更多想法浮现。每个重点都会占据他们大部分的时间，他们希望在下学年开始之前为老师提供一些东西。为了帮助他们可视化所有这些工作、针对哪个产品以及支持哪个用户群体，Laurie\
  \ 引入了“影响地图”的概念，他们共同开发了这张地图（类似于 `图 16.4` 中的图像）。有关关于影响映射的更多信息，请访问 `[www.ImpactMapping.org](http://www.ImpactMapping.org)`。![图\
  \ 16.4 一个说明目标、用户画像、影响和功能的影响地图](img/Figure16_4.jpg)\n\n`图 16.4` 一张说明目标、用户画像、影响和功能的影响地图。\n\
  \n### 工作流\n\n起初，新的工作流相当简单。William 和 Tom 每周与团队开会，根据大图审查进展。合伙人们也以某种方式参与了大部分工作。Tom\
  \ 和 William 紧密合作他们新的“小手”飞机，这非常让人联想起……。\n\n### DIY 飞行的学习与改进\n\nTom 和 William 接触客户的最初经历让他们大开眼界，发现了他们一直错过的可能性。尽管他们之前非正式地与产品客户互动过，但通过正式焦点小组和访谈产生的洞察令他们感到惊讶。尽管涉及成本，但他们都坚信继续与当前和潜在客户进行这种互动的价值，以发现新产品或改进产品的想法。\n\
  \n他们曾希望电子邮件调查能让他们对驱动客户首次购买的因素有一定的见解，甚至可能为未来产品获取想法，但事实证明，仅通过电子邮件调查他们无法获得充分的了解。他们通过这种方法获得的洞察已经足够价值，让他们继续进行调查，但他们也了解到，如果想收集完整且可操作的洞察，就必须提高水平。\n\
  \n\n\n\n在 Laurie 的帮助下，他们制定了一项招聘策略，旨在从他们确定的每个细分市场中持续吸引现有和潜在客户：这些细分市场包括：爱好者、高级爱好者、幼年儿童的父母，以及\
  \ STEM 教师和学生。Laurie 帮助他们为产品生成了一套满意度指标，并要求焦点小组和个人访谈对象对这些指标进行评分。\n\n他们要求客户：\n\n* \
  \  填写李克特尺度量表（即 1–5 分），对他们之前识别的每个步骤的体验进行评分。\n*   提供三个描述性形容词，可以通过分析这些词来收集对产品的情感，并了解用户特别看重什么。\n\
  *   提供关于他们如何使用飞机的自我报告（回答诸如“你多久带飞机出去飞一次？”、“你花费了多长时间？”他们甚至问：“你会录制飞行视频并在稍后观看吗？”，以了解他们对视频录飞的兴趣）。\n\
  \n拥有一套稳定的指标使他们能够评估产品改进的成效。通过频繁且定期地进行访谈，他们能够在需要时快速调整。与目标市场的这些面对面互动也是新产品创意的常青源泉。能够反复寻求反馈有助于他们优先考虑即将开展的新工作，找到改进已良好工作方面的领域，并直接了解新产品在客户中的反响如何。例如，他们发现让客户帮助优先排序他们的待办事项（backlog）非常有价值，奇奇的是，如果没有用户的洞察，Tom\
  \ 和 William 绝不会以同样的方式对其进行优先级排序。有时他们会发现，一个新功能对用户的吸引力远不如对现有功能的改进。这种洞察对他们来说如金子般，因为这让他们能够持续关注那些为用户提供最大效用的项目。\n\
  \n在年底，随着几款新产品的开发进行，Tom 和 William 开始直接与客户测试新产品的原型。他们的第一次测试非常有趣——在投入量产之前，他们想看看小手在操作他们的“小手专用”飞机时实际表现如何——毕竟，观察孩子对这些新飞机表现如何的唯一方法就是让他们去操作这些新飞机。他们担心某些部分使用的厚纸板会撕裂，但事实证明这并不是问题。贴纸大受欢迎！（孩子们可以留着原型飞机。“这是他们应得！”Tom\
  \ 笑着说。当然，父母们还是收到了礼品卡。）\n\n## 第 2–3 年\n\n随着时间的推移，DIY Fly 继续增长，并保持专注于为客户提供更好的价值。通过一些研究和阅读，他们发现许多精益制造（Lean\
  \ manufacturing）实践是对他们在业务增长过程中采用的敏捷产品开发（Agile product development）实践的完美补充。他们完善了改进质量的流程，包括“质量小组”，在小组中，所有员工无论职位如何都处于平等地位，可以与管理层进行开放讨论，并被鼓励针对问题症状以及根源解决方案进行头脑风暴。他们将所有工作展示在一个巨大的“工作墙”上，最重要的是，将质量融入到他们所做的一切工作中，使其成为文化的一部分，而不是试图在流程后期通过检查来实现质量。\n\
  \n\n\n这种思考自然地引导他们对评估有了不同的看法，并对其进行了改进。为了给他们的流程提供帮助，他们聘请 Laurie 的前同事 Julia 担任全职 `Product\
  \ Owner`（产品负责人），他们只后悔没有更早地做这个决定。\n\n尽管他们的每个产品都大到足以拥有自己的 `backlog`（待办事项列表），但现有的工作和它们之间的依赖关系需要专门的人来管理。例如，每架出货的飞机都必须有说明书和在线视频。有时这导致产品已经完成但无法发货，因为他们正在等待其他组件。事实证明，将依赖关系可视化是管理和最小化偶尔发生的瓶颈的关键——一个单一的视觉参考比他们之前使用的电子表格要有价值得多。这种形式呈现为一面大墙，每个功能点都有一张便利贴，并标明了可能交付的时间表。依赖关系用红色标记笔标出（如果墙面允许的话），让所有团队都能看到自己的依赖关系和集成点。这被用于使\
  \ `Scrum of Scrums（敏捷联盟会议）变得更快、更高效。\n\n在经历了几次未能产生价值的失败 `sprints`（冲刺）后这一点变得显而易见，因为依赖关系（特别是广告和视频制作）没有得到协调，在团队之间制造了\
  \ Tom 和 William 以前从未察觉的摩擦，导致了一些员工流失。他们很快意识到更换人员的成本（从时间、金钱和机会成本来看）是多么高昂。\n\nJulia\
  \ 敦促他们聘请全职人员来识别和管理依赖关系，并指导团队实现“自我管理”。Tom 和 William 未能看到这种做法的价值并抵制了这一想法。将这一必要角色称为\
  \ `Scrum Master（敏捷大师）`——一个他们以前从未听过的术语——这增加了他们的抵触情绪。`Agile（敏捷）`和 `Scrum` 的特殊词汇是采纳过程中的共同障碍，并非\
  \ DIY Fly 所有。直到他们参加了一场当地商会的企业主活动，并听到 Julia 之外的人使用这个术语时，他们才对这一想法敞开了态度。他们听了其他领导者详细介绍他们在\
  \ `Agile` 和 `Scrum` 方面的成功经验，以及他们对 `backlog` 和 `Scrum Master` 等非直观术语的挫败感，并决定放手一搏，最终聘请了人。Jeff\
  \ 是一位认证 Scrum Master，他被请来帮助他们过渡到 `Agile` 和 `Lean（精益）` 体验——`Agile` 用于 `Product Development（产品开发）`，`Lean`\
  \ 用于制造运营。他们物有所值。\n\n从第一天起，Jeff 和 Julia 的协同效应就体现在流程显而易见的改进中。他们将不断壮大的员工团队从一个大团队组织成几个不同的团队：制造、`marketing（营销）`以及\
  \ `product development/improvement（产品开发/改进）`。制造团队使用 `Kanban（看板）` 来交付产品，而营销团队使用它将其工作可视化，并帮助每天决定最重要的工作。产品开发/改进团队使用\
  \ `Scrum`，因为他们发现以一周为增量来计划工作很有帮助（尽管他们最初是从两周一次 `sprints` 开始的，但他们决定尝试一周一次 `sprint`\
  \ 并坚持了下去）。\n\nJeff 和 Julia 建立了每周两次的 `Scrum of Scrums` 会议，以暴露依赖关系和风险，并确保团队始终协调工作。这是通过让每个团队派一两个代表参加简短会议，详细说明与其他团队的任何依赖关系来实现的。一旦确定了依赖关系，另一个团队就会承诺解决时间，以便所有人更好地计划。\n\
  \n每个团队的工作在 `Kanban` 和 `Scrum` 板上保持可见。尽管运营已扩大到 23 人，但这种透明度提供了对其他人正在工作内容的洞察。Julia\
  \ 已经将融入用户洞察完善为一门科学：避免关键假设，并与用户验证任何重大的产品变更，然后评估结果变成了文化的一部分。\n\n这种心态使他们的产品质量和“适配性”提高了数倍，并极大地扩大了\
  \ STEM 教师和学生市场的销量。DIY Fly 变得声名显噪，在所有“大型超市”销售，他们的用户调查显示他们已成为市场中受信赖的名字。然而，William\
  \ 和 Tom 并没有打算安于现状。由于他们之前没有从公司中提取利润，现在他们有一笔相当的资金进行再投资，而他们确实这么做了。\n\n## 第 4 年及以后\n\
  \n将所有利润投资于开发新产品和改进现有产品的想法被证明是明智之举。随着产品数量的增加（现在包括针对每个个人数据的不同飞机设计，以及针对年幼儿童的各种“活动包”和针对\
  \ STEM 教师的额外课堂练习），他们在焦点小组中确定的所有目标客户群的市场份额缓慢增长。随着这种增长，寻找新的分销渠道和销售点变得更容易，这增加了他们的盈利能力。他们的员工也在增长，这为扩大他们在第\
  \ 2 年和第 3 年建立的小团队集群带来了新挑战。\n\n随着产品组合的增加以及几个产品在技术上变得更加复杂，他们无法仅依靠三个核心制造团队来运作。他们必须扩大规模，尽管他们成功地使用了\
  \ `Kanban`，但他们发现需要额外的专业团队。\n\n因此，他们建立了一个团队负责为他们新的精密遥控模型系列制作电子设备，另一个团队负责管理所有的打印和冲裁。这两个团队都从\
  \ `Scrum` 转向使用 `Kanban`，因为在经过多次实验后，他们发现工作不够稳定，无法承诺持续两周甚至一周的 `sprint` 目标。例如，一次专注于滑翔机组装的\
  \ `sprint` 因为零件未如预期到位而不得不取消。这让团队成员感到非常沮丧。使用 `Kanban` 而不是 `Scrum` 使他们能够灵活性，每天早上检查工作并根据当天的情况重新设定优先级。\n\
  \n\n\n另一个团队完全致力于教育业务，其业务已从仅服务于高中和 STEM 营地市场扩展到高等教育领域，高等教育者发现该团队的产品是其课程的宝贵补充。该团队由一位前教育工作者兼飞行员领导，使用\
  \ `Scrum` 来管理工作。所有团队都结合使用了质量、流、可预测性和解决方案质量指标，以确保良好的产出和结果。团队指标会在每个迭代（sprint）结束时进行审查，包括完成的任务（stories）数量和故事点（story\
  \ points），以及被团队称为“言行率”（say-do）的承诺完成率。他们将质量指标分为两类：基于缺陷的返回率以及基于客户未满足预期的指标。这些指标都是团队回顾会议的输入，并被严格作为帮助团队改进的工具；它们从未被武器化或用于绩效考核。\n\
  \nWilliam 和 Tom 通过追踪史诗（epics）来保持对他们不断增长的企业业务的了解。Jeff 采用类似的方法管理工作：使工作透明化、限制在制品量（WIP）、进行小规模实验，并根据实验结果做出未来的决策。有时，William\
  \ 和 Tom 需要 Jeff 介入并帮助他们专注于完成一件事，然后再开始另一件事，Jeff 将这种需求称为“停止开始，开始完成”。\n\n例如，他们当时在为较小儿童开发一套新的活动包，同时在为一种电池动力遥控飞机进行复杂的设计，导致两者的进展都微乎其微。听了\
  \ Jeff 的建议后，他们很快意识到，将精力限制在一个目标上（即使这看起来违背直觉）也能完成更多工作。因此，他们放下了复杂任务，专注于针对儿童市场的产品，并等到该产品完成后再重新开始新遥控产品的工作。\n\
  \n每个季度，所有团队仍然会聚在一起进行为期两天的大型规划会议。每个人都期待与其他团队的同仁交流的机会，以及 William 和 Tom 挥霍提供的餐饮，其中包括为欢乐时光（happy\
  \ hour）买单（这是一个重要的成功因素）。这些规划会议对于维持团队协作、减少依赖以及管理无法缓解的风险至关重要。\n\n随着员工人数增加，William 和\
  \ Tom 聘请了一位首席制造官，并将 Julia 晋升为首席产品负责人（Chief Product Owner），她下面还有三位产品负责人。需要这一新的管理层来协调许多团队和多个产品的生产活动。Julia\
  \ 现在与所有团队运行产品负责人同步会议，以确保愿景一致，而该策略会根据学习和客户洞察不断演进。Jeff 运行配套会议——Scrum of Scrums，以确保障碍得到快速解决，并在依赖关系成为瓶颈之前进行管理。他们甚至聘请了一位电子工程师来让大家达成共同的技术愿景，随着产品技术复杂性的增加，这变得越来越重要。这个小组构成了管理团队的核心。\n\
  \n无论如何，他们的团队每天都会单独开 15 分钟会议规划当天的工作。多年来，有些团队尝试过这种每日会议的变体，减少频率或要求的参会人员，但最终回到了原始流程，因为每日规划和同步对于必要时进行协调和转型的能力至关重要。\n\
  \n随着 William 和 Tom 业务的增长，他们发现自己疏远了日常运营。对事物的热情依然存在，但产品线已经了自己的生命，并交给了能干的人手。这家公司是他们的孩子，尽管他们不再那么亲力亲为并可以考虑出售，但他们还没有准备好将产品、人员或流程委托给另一公司。相反，他们决定寻找机会，在积累经验的同时提供新的挑战。\n\
  \n为了呼应过去，他们召集了几位最信任的员工并进行了一场工作坊。他们回到最初聚在一起脑暴产品构思的会议室，甚至仍由同一家公司提供餐饮（以示怀旧）。这次，目标是识别他们可以如何扩张，而不是思考如何将几个产品变成更多几个。\n\
  \n每一个想法都挂在墙上：无人机、船、潜水器、更先进的航空电子设备、风筝，甚至包括物理辅导。这些指标都是团队回顾会议的输入，并被严格作为帮助团队改进的工具；它们从未被武器化或用于绩效考核。（*注：此处原文似乎存在部分逻辑重复或衔断问题，已按原意翻译*）\n\
  \n……由于原文后续的逻辑混乱……（*注：原文在此处出现了语义违和或重复的表达*）\n\n最后，William 和 Tom 决定，对模型飞机的热爱将他们带入了业务，然而他们也在思考“飞行”在\
  \ DIY 中有多重要。最后，他们排除了非教育类产品（空间太拥挤了）和遥控技术（太危险了）。他们选择了船、潜水器，以及一个名为“户外探险盒”的承诺装备。凭借清晰的愿景、一系列新想法以及他们信任的方法，未来的道路尚不确定，但他们知道这不会无聊。\n\
  \n# 结论\n\nDOI: [10.4324/97810318852023](https://doi.org/10.4324/97810318852023)\n\
  \n将敏捷与以人为的设计相结合的挑战对于任何尝试让两者运作的人来说都是显而易见的。为了使其运作，团队需要对做好设计和研究有健康的理解，还需要一个对执行这些工作感兴趣的团队（或项目）。还需要一种允许开发者\
  \ `hands on keys` 之前进行所有战术工作的结构，并将学习的战略价值纳入决策。\n\n当执行得当时，以最快、最廉的方式获取成功所需知识的这一和谐目标，正是这项工作的意义所在。在降低生产成本和规避风险方面，回报是巨大的。\n\
  \n\n\n*   `Essential Scrum`（精要 Scrum），Ken Rubin——这是对 Scrum 各层面的全面深入探讨。对于那些深入理解 Scrum（并且这是一本很好的参考书）的人来说，该主题的必备书籍。Ken\
  \ Rubin 描述了 Scrum 事件。\n\n*   `Scrum: The Art of Doing Twice the Work in Half the\
  \ Time`（Scrum：用一半的时间完成双倍工作的艺术），Jeff Sutherland 和 Jeff Sutherland——这是一本非常易读的书，在让读者熟悉敏捷宏观理念方面比熟悉\
  \ Scrum 的具体机制更为有效。\n\n*   `User Stories Applied`（用户故事应用），Mike Cohn——用户故事是敏捷团队最挣扎的领域。这是该领域最受尊敬的作者之一关于该主题的著作。\n\
  \n*   `Agile Estimating and Planning`（敏捷估算与计划），Mike Cohn——这是一本为产品主、产品经理或任何对进度负责的人编写的优秀书籍。\n\
  \n*   `Innovation Games: Creating Breakthrough Products Through Collaborative Play`（创新游戏：通过协作游戏创造突破产品），Luke\
  \ Hohmann——这是为与用户互动有困难的从业人员（尤其是敏捷专家）编写的。这本书由公认的敏捷专家编写，充满了帮助团队理解用户真实需求的练习。\n\n* \
  \  `Kanban`（看板），David J. Anderson——看板是一种被低估的比 Scrum 更适合许多团队的无迭代敏捷框架。这本书将使从业人员能够使用看板完成更多工作。强烈推荐。\n\
  \n*   `SAFe® Distilled`（SAFe 精要），Richard Knaster 和 Dean Leffing——这是一个对 SAFe 的优秀介绍，带有许多描述性的彩色插图，非常推荐新接触\
  \ SAFe 的从业人员。应该获取最新版本，因为 SAFe 模型经常更新。\n\n*   `SAFe® Training`（SAFe 培训）——强烈鼓励寻求实施\
  \ SAFe 的从业人员参加导师的培训（无论是线下还是虚拟）。有至少 12 种基于角色的 SAFe 认证供选择。列表和课程表可以在此处找到：[https://scaledagile.com/safe-certification/]。更多信息请访问：www.scaledagileframework.com/。\n\
  \n*   `Team Topologies: Organizing Business and Technology Teams for Fast Flow`（团队拓扑：为了快速流动组织业务和技术团队），Matthew\
  \ Skelton 和 Manuel Pais——对于那些寻求深入了解如何形成团队以实现价值最优流动的人来说，这本书不是轻松的读物，而是非常详细。\n\n* \
  \  `Project to Product: How to Survive and Thrive in the Age of Digital Disruption`（从项目到产品：在数字化变革时代生存与发展），Mik\
  \ Kirsten——寻求提升敏捷知识水平的从业人员将从这本书引入的“流动框架”中受益。\n\n*   `Continuous Discovery Habits:\
  \ Discover Products That Create Customer Value and Business Value`（持续发现习惯：发现创造客户和业务价值的产品），Theresa\
  \ Torres——鼓励希望更好地与用户互动、建立洞察库并使用这些数据改进产品的敏捷团队阅读这本书。\n\n*   `When Will It Be Done:\
  \ Lean-Agile Forecasting to Answer Your Customers’ Most Important Question`（何时完成：精益敏捷预测回答客户最的问题），Daniel\
  \ S. Vacanti——这本开创性的书籍改变了许多对故事点估算有效性的看法，并帮助许多团队转向使用历史数据的统计预测。对于估算困难的人，这本书是必读的。\n\
  \n*   `Coaching Agile Teams: A Companion for Scrum Masters, Agile Coaches, and Project\
  \ Managers in Transition`（教练敏捷团队：转型中的 Scrum Master、敏捷教练和项目经理的伴侣），Lyssa Adkins——这是敏捷教练文本中的金标准。\n\
  \n*   `Drive`（驱动），Dan Pink——这本书与其说是关于敏捷，不如说是关于创造激励知识工作者并培养创造力的环境。强烈推荐。\n\n### 设计师的书单\n\
  \n*   `Radical Focus: Achieving Your Most Important Goals with Objectives and Key\
  \ Results (Empowered Teams)`（极致聚焦：通过目标和关键结果实现最重要的目标（赋权团队）），Christina Wodtke——一个团队应用\
  \ OKR 的虚构描述，这本书简单易读，并将 OKR 方法落实于相关的实践。\n\n*   `Communicating Design`（设计沟通），Dan Brown——对设计交付物的更深入的探讨，以及如何在设计过程的任何阶段创建和展示它们以实现有效沟通。\n\
  \n*   `Just Enough Research`（恰当的研究），Erika Hall——这是一本关于交付导向型信赖研究方法的极佳入门指南，无论团队规模或预算如何，都可以立即实施。\n\
  \n*   `The Design of Everyday Things`（日常用品设计），Donald Norman——这是关于设计如何创造成功或失败体验的最早且仍最有趣的文本之一。他还写了另外两个优秀的续作：`The\
  \ Design of Future Things`（未来产品设计）和 `Emotional Design: Why We Love (or Hate) Everyday\
  \ Things`（情感设计：我们为什么喜欢或讨厌日常用品）。\n\n*   `Don’t Make Me Think`（别让我思考），Steve Krug——关于可用性和直观信息设计核心概念的通俗且趣味的介绍。\n\
  \n*   `Designing Connected Content`（设计连接内容），Mike Atherton 和 Carrie Hane——内容是设计。内容是可用性。内容是体验。这本书是构建结构化内容框架的端端流程。\n\
  \n*   `The User Experience Team of One: A Research and Design Survival Guide`（单人用户体验团队：研究与设计生存指南），Leah\
  \ Buley——针对 HCD（以人为中心的设计）从业人员的实用指南，也是对敏捷专家和产品主关于个人如何在团队中作为唯一专家工作的要求的优秀调研。\n\n* \
  \  `Outcomes Over Output: Why Customer Behavior Is The Key for Business Success`（结果重于产出：为什么客户行为是业务成功的关键），Jeff\
  \ Seiden——一本关于从无止尽的功能交付转向可衡量的用户价值思维的简洁而强大的书籍。\n\n*   `How Music Works`（音乐如何运作），David\
  \ Byrne——并不是一本“专业书籍”或关于 HCD 的书，尽管作者仍然对音乐创作的各个方面进行了迷人的描述——从音乐表演的环境类型到激励结构——都是听众和观众体验的一部分。\n\
  \n*   `Lean UX: Designing Great Products with Agile Teams`（精益 UX：与敏捷团队一起设计产品），Jeff\
  \ Gothelf——对于了解 UX 如何融入战略决策的人非常有价值，是开始战略实验的实用方法。\n\n*   `Accessibility for Everyone`（人人皆无障碍），Laura\
