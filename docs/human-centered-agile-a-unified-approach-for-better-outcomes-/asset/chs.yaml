  \nJoe Hohmann\n\n\n我们要感谢并感谢以下人员和组织在准备本手稿期间提供的帮助和指导：\n\n- Lorelei Brown 和 Dawn Barton\
  \ 提供的时间和智慧。\n- Ed Galm 提供的封面设计。\n\n\n\n\n\n\n# 关于作者\n\n`Joe Montalbano` 是一位管理顾问、企业敏捷教练和业务敏捷性专家，拥有超过\
  \ 20 本的经验，主要从事大型软件开发环境。他成功领导了多个大规模的敏捷转型，并利用大量的岸、离岸、分布式和虚拟开发团队管理了数十项软件开发工作。他在整个 Microsoft\
  \ 技术栈方面也拥有丰富的实战技能。\n\n`Joe` 是一位热情的教练、老师和协调师。他持有 `CSP`、`SPC`、`KMP`、`PMI-ACP`、`PMP`\
  \ 等认证，是 `SAFe` 贡献者。他是亚马逊畅销书*Agile Almanac Book 2: Programs with Multi- and Virtual\
  \ Team Environments* 的合作者，拥有约翰霍普金斯大学的 MBA 学位。他还是狂热的野生动物摄影师，也是一名业余无线电操作员。这是他的第二本书。\n\
  \n`Brad Lehman` 从前端编码员起步，当时他的女朋友（现在的妻子）教他 `HTML`，以便他为他的唱片公司创建一个网站（“建议使用 Netscape\
  \ 3.0 或更高版本查看！”）。不久后，他成为了“单人设计团队”，自 2010 年以来一直与敏捷团队和项目合作。他还是一个丈夫、父亲、设计教练、社区电台 DJ\
  \ 以及狂热的咖啡烘焙师和咖啡爱好者。\n\n# 引言——本书的结构\n\n本书的目标是帮助读者将以人为中心的设计（`HCD`）实践整合到敏捷中，这种方式可以扩展敏捷思维，支持团队工作，并让他们更快、低风险地学习并交付真正价值的产品。我们将内容分为六部分，以便你轻松地找到对你最有价值的内容。\n\
  \n## 第一部分——介绍以人为中心的敏捷\n\n* **第 1 章**：什么是以人为中心的敏捷？为什么需要它？\n  本章介绍了什么是以人为中心的敏捷以及我们我们认为它非常重要。`Part\
  \ I` 阐述了以人为中心的敏捷的基础，并开始让读者以“以人为中心的敏捷”的思维进行思考。本章还探讨了为什么 `HCD` 与敏捷的结合是一项挑战，并提出了一个对齐这两种思维的框架。\n\
  \n## 第二部分——理解恰好且足够的 HCD\n\n* **第 2 章**：以人为中心的设计入门\n* **第 3 章**：从发现到概念验证的 `HCD` 活动与产物\n\
  * **第 4 章**：从精炼到评估的 `HCD` 活动与产物\n\n这部分为需要这些知识的人提供了 `HCD` 介绍。它介绍了设计过程的各个阶段，并深入探讨了构成这些阶段每个阶段\
  \ `HCD` 工作的活动和产物。本节为读者提供了应该引入到其敏捷项目中的 `HCD` 活动和产物的“是什么”以及“为什么”。\n\n## 第三部分——多少以及何时？在敏捷中规划和执行\
  \ HCD\n\n* **第 5 章**：将以人为中心的设计引入敏捷\n* **第 6 章**：“风险是什么？”\n* **第 7 章**：在敏捷中规划和开展\
  \ `HCD` 活动\n\n这部分试图消除误导性的观点，即 `HCD` “会拖慢你的速度”以及“我们试图看到每一个角落”（或“煮海水”；选一个你喜欢的比喻）。以人为中心的敏捷并没有规定每项工作都需要执行每一个研究步骤。相反，以人为中心的敏捷将研究工作与交付解决方案的预期影响和风险对齐，并在每一步都有特定的学习目标。这些章节描述了如何做到。\n\
  \n## 第四部分——更大的项目，不同的需求\n\n* **第 8 章**：在敏捷中管理分布式设计工作\n* **第 9 章**：在敏捷中管理分布式研究工作\n\
  * **第 10 章**：扩展到小型敏捷团队小组\n\n随着项目规模和风险的增长，其研究和设计也需要相应增长。这种增长意味着项目层面的协调和运作，而不仅仅是团队层面。这部分对于处于这一阶段的读者很有用。\n\
  \n## 第五部分——最大的项目，以人为中心\n\n* **第 11 章**：`SAFe` 简介\n* **第 12 章**：更新 `SAFe`\n* **第\
  \ 13 章**：`SAFe` 结构\n* **第 14 章**：大规模交付\n\n## 第六部分——衡量和应用以人为中心\n\n* **第 15 章**：衡量衡量\n\
  * **第 16 章**：以人为中心的敏捷应用\n\n\n\n\n敏捷开发（Agile）和以人为本的设计（HCD）是两个广泛使用的学科，它们追求相似的结果，但往往难以相互进行“对话”。HCD\
  \ 和敏捷开发都采纳了关注交付过程不同阶段的工作方式。虽然它们在某些目标上相似，即通过了解用户想要什么的产品来交付有用的解决方案，但这两个学科的思维截然不同。正因如此，当被要求同时应用这两个学科时，敏捷和\
  \ HCD 的从业者往往难以理解对方的观点，并且经常设计出一个在问题空间和解决方案空间都缺乏足够时间的流程。当敏捷和 HCD 从业者合作工作时，他们往往无法向业务利益相关者解释应该发生什么以及何时发生。\n\
  \n这种情况可能表现为直接的竞争，甚至是冲突，因为由敏捷驱动的团队将 HCD 视为障碍或资源的直接竞争者，而 HCD 从业者则难以为那些长远来看非常有价值的早期阶段工作赢得立足之地尝试将\
  \ HCD 能力整合到现有的敏捷计划中，通常会导致摩擦、效率低下的冲突。\n\n情况并非必须如此。本书为这两个学科提供了一种能够和谐相处并交付更好结果的方法。\n\
  \n以人为本的敏捷（Human-Centered Agile）是在整个产品生命周期内对敏捷产品开发和 HCD 的整体、同步应用。这有助于团队产生洞察、验证设计，并比单独的敏捷或\
  \ HCD 都能更快地对设计和完成的工作进行评估。以人为本的敏捷并非仅仅将 HCD 作为一种“插件”包含在敏捷流程中，而是一种全新的工作和思维方式，这种方式从头到尾整合到敏捷交付中。要实现以人为本的敏捷，并不是在敏捷工作流中的某一个特定位置应用\
  \ HCD。\n\n以人为本的敏捷利用通过 HCD 方法收集的用户洞察，来更好地指导敏捷生命周期中的每个活动和产物。以人为本的敏捷使单一团队能够应用 HCD 方法来测试假设、发现用户需求，甚至弄清楚哪些方法不可行。这感觉与传统的敏捷开发不同（参见图\
  \ 1.1）。客户的感和参与度更高，消除了产品负责人（Product Owner）在团队和终端用户之间的隔阂。在开发过程中甚至部署后，都会直接且持续地咨询用户。这种活动是经过计划并融入流程的。\n\
  \n以人为本的敏捷团队被允许在构建东西之前思考需要构建什么，比较多个设计方案，并通过通过产生用户理解的活动来验证他们的假设以降低风险。这与选择一个最小可行性产品（MVP）并构建它并在*之后*才获取用户反馈的做法形成对比。\n\
  \n将 HCD 思维和工具整合到敏捷团队中，帮助他们为用户交付最大的价值。团队在整个产品生命周期中应该提出的三个基础但关键的问题是：\n\n*   “我们正在解决正确的问题吗？”（`right\
  \ problem`）\n*   “考虑到所有的限制，这是最佳解决方案吗？”（`right solution`）\n*   “我们正确地交付了这个解决方案吗？”（`done\
  \ right`）\n\n回答这些问题对于以成本效益的方式交付产品至关重要。虽然传统敏捷经常采用“边看”的方法来同时回答这三个问题（有时是在投入大量工作之后），但以人为本的敏捷的关键要素是：\n\
  \n*   在整个敏捷过程中使用 HCD 方法来弥补`发现`（discovery）、`构思`（ideation）和`概念验证`（concept validation）方面的空白。\n\
  *   在各个阶段应用 HCD 实践，以确保产品在发布时具有价值。\n*   以人为本的敏捷允许团队计划并执行可能不会被立即使用的 HCD 工作，提供一份`研究路线图`（Research\
  \ Roadmap）。\n*   以人为本的敏捷将 HCD 的发现引入产品策略，并根据来自用户的最新洞察不断更新策略。\n\n\n\n\n如果同时应用敏捷开发（Agile）和以人为中心的设计（HCD）很容易，那么就不需要这本书了。这一切自然会发生。毕竟，它们的目标都是以更快、更廉的价格为用户交付更好的产品，这本应该让它们天然地兼容。\n\
  \n结合这两项实践需要弥合不同思维模式之间的鸿沟，并尝试为它们的特定活动提供时间和空间。人们对于时间跨度、规划周期、什么算关键活动，以及如何以及何时做出决策最为合适，往往有不同的预期。此外，整合这两项实践的挑战根据运行它们的团队或计划规模的大小而异。产品复杂性和团队规模影响了整合两者的所需方法。\n\
  \n当敏捷开发和 HCD 尝试融合时，也可能产生怨恨情绪。既有的敏捷驱动型团队可能将 HCD 视为障碍或必要资源的直接竞争者，这使得 HCD 从业者觉得他们必须为自己的存在辩护，因为他们关注的是早期工作，而这些工作从长远来看被证明非常有价值。当\
  \ HCD 团队被要求在缺乏证据或时间的情况下做出决策时，可能会觉得吃亏了。\n\n情况并非如此。\n\n## 问题空间 vs 解决方案空间\n\n> *问题表述清楚，就解决了一半。*\n\
  >> —Charles Kettering\n\n理解敏捷开发和 HCD 从业者在方法上的差异，从理解问题空间与解决方案之间的区别开始。这种区分是关于如何廉且高效地构建新产品的许多实践决策的核心。\n\
  \n\n图 1.1 正确的问题，正确的解决方案，正确的执行。\n\n问题空间是团队投入所需的时间注意力来理解他们试图解决的问题的地方。这是解决方案的整个上下文，包括对用户及其可能需求的理解、团队能力、业务限制、预期结果，以及与这些用户和业务相关的成功衡量标准。\n\
  \n相比之下，解决方案空间是团队投入时间和注意力解决他们所定义的任何问题的地方，对功能将是什么样以及如何交付做出所有决策（参见图 1.1）。这包括构思、用户故事编写以及对将交付的验收标准（`AC`）或需求的分析，以及开发工作的规模估算、优先级排序和执行。\n\
  \n在思考问题空间与解决方案空间时，确保团队不断提问以下三个问题是有用的，富达（Fidelity Investments）用户研究与洞负责人 Jen Cardello\
  \ 对这些问题的表述最为清晰：\n\n* “我们正在解决的是正确的问题吗？”（正确的问题）\n* “考虑到我们所有的限制条件，这是最佳解决方案吗？”（正确的解决方案）\n\
  * “我们是以正确的方式交付这个解决方案吗？”（正确的执行）\n\n这些问题在整个以人为中心的敏捷生命周期中起着工具性的。重要的是，在任何时候，都可能学习新信息，导致团队重新审视对这些问题中*任何一个*问题的原始答案。\n\
  \n### 正确的问题\n\n团队的所有工作都应该解决使用工具的客户的现有问题或需求。敏捷宣言中的一个关键原则指出：“简单性——最大化未完成工作的艺术是至关重要的。”¹\n\
  \n以人为中心的敏捷开发承认理解并清晰定义待解决问题的价值——在问题空间中花费时间创建一个`problem definition`，为团队提供一个坚实的基础。该问题定义需要包含用户和业务目标，以及一种衡量的方法，以衡量团队是否正在创造成功的`outcomes`，而不仅仅是交付功能。\n\
  \n### 正确的解决方案\n\n解决任何问题都有多种方法。解决方案的想法在可行性、成本、发布时间和对用户的价值方面可能差异巨大。作为以人为中心的敏捷实践者，目标是识别出与用户需求以及交付产品的业务目标一致的最佳解决方案。某些问题可以通过小规模解决方案来解决，而另一些则需要更大的努力。有时，能做的最好的只是缓解问题。团队通常会找到一种结合了短期缓解/改进策略与长期良好体验愿景的策略。\n\
  \n确定一个解决方案是正确的解决方案并且该解决方案是可持续的是非常重要的。显然，业务和技术因素是这一过程中的关键输入。考虑解决方案是否满足了用户需求并与他们的目标和预期一致也是如此。如果不考虑用户，团队面临着真正的风险，即开发出的产品在产品主的白板上看起来很棒，但在发布时一败糊涂。\n\
  \n### 正确执行\n\n最容易理解且最常整合到开发过程中的 HCD 工作属于“正确的执行”步骤，该步骤直接与用户验证产品的具体细节。团队可能会进行一些可用性测试来回答诸这样的问题：他们可以在不困惑的情况下使用产品吗？它在整体和每一步中是否符合他们的预期？有许多方法可以获取直接反馈，例如可用性测试、有针对性的试点和\
  \ A/B（或多元）测试以及问卷。\n\n## 问题空间和解决方案空间中的敏捷与 HCD 从业者\n\n敏捷团队习惯在解决方案空间工作，并有一个 `Product\
  \ Owner`（产品主），他担任客户需求和态度的代表，以及团队的“价值最大化者”。产品主的职责是对哪些内容能提供最大的终端用户价值做出决策，并确保团队始终致力于这些工作。\n\
  \n敏捷之所以成功是因为团队能够以最快的速度构建小增量的价值。然后，在收到用户反馈后，他们迭代该解决方案，直到产品主将其转向其他提供更高价值的事物。理想情况下，这个过程既是`incremental`的又是`iterative`的，允许团队在以小增量交付更高层次价值的同时共同学习。整个过程中，敏捷团队与产品主之间也存在不断的沟通，以改进当前和未来的流程。\n\
  \n重要的是，许多敏捷团队将产品主作为终端用户的代理，并且与*实际*终端用户很少或没有互动。这产生了一个风险：如果产品主做出错误的决策或误解了用户需求，交付的工作可能无法提供价值。这是敏捷产品开发中的巨大盲点，以人为中心的敏捷开发试图解决这个问题。\n\
  \n相反，HCD 从业者习惯在问题空间中操作，并依赖与终端用户的交互。与敏捷团队一样，他们寻求关于终端用户需求的知识，以及如何设计理想解决方案来解决这些需求的信息。\n\
  \n为了实现这一点，HCD 从业者有各种工具在构建 MVP 之前识别、精炼和记录终端用户的需求和愿望，并在发布后进行评估。HCD 团队并不完全依赖产品主的视角，而是通过与终端用户的直接交互在流程早期获取敏捷团队通过创建\
  \ MVP 获取的知识。他们将这些知识带入解决方案空间，在那里生成解决方案的视觉表示以展示并验证他们的理解，并在整个构建和启动过程中对解决方案进行评估。\n\n\
  \n\n\n在实际上，问题空间与解决方案之间的划分并不是绝对的。即使从发现的最早期开始，利益相关者（包括用户）就会提出具体的解决方案，而在识别问题的那一刻，思考如何解决问题是自然而。同样，随着解决方案的开发以及被用户接受或拒绝，所解决的问题本质可能会变得清晰并不断演变。团队在整个`delivery\
  \ cycle`中都应该检查问题和解决方案，理解在每个空间花费的时间和工作比例将会发生变化。在一个特定产品或功能的交付周期之初，团队几乎所有的注意力都应该放在问题定义上。接近发布时，几乎所有的工作都是为了交付解决方案。\n\
  \n# II\n\n理解恰好的人为中心的设计\n\n# 第 2 章 以人为中心的设计导论\n\n\n“设计”是一个棘手的词汇——问十个人对设计的理解，会有十二种不同的答案。为了理解以人为中心的设计（HCD），了解本书书中所谓的“设计”是指什么是有帮助的。\n\
  \n*设计是有意地创造一种特定的体验或结果*。\n\n仅此而已。无论开发的的产品是网站还是椅子（而且天哪，设计师们有多爱他们的椅子了！）。体验是为产品用户创建的。当讨论设计时，特别是在软件领域，人们通常想到的是`视觉设计`——调色板、图片和元素的平衡。然而，视觉设计只是其中一个方面。其他方面，如`交互设计`、信息架构和`内容策略`，对良好的软件开发也至关重要，而与“设计用户体验”成为同义的研究和测试活动也是如此。\n\
  \n一个常见的误解是，设计是对特定体验或结果的`definition`，就像建筑的蓝图和计划被视为“设计”一样。建筑的`construction`过程也是设计过程的一部分。这包括在此过程中做出的每一个独立决策（甚至细到门把手！），这些决策影响了人们*体验*建筑的方式，即使这些决策是在初始计划生成后才做出或更改的。\n\
  \n设计与交付之间的人为分离，也渗透到了团队思考软件设计的方式中。产品的定义和规划与交付是完全分离的。在实践中，特别是在软件领域，这种分离很少是清晰的。即使在产品生成需求后，交付过程中也会做出影响最终体验的决策。\n\
  \n初始故事中的差距、最初未被完全理解的技术限制或业务逻辑不可预见的更新，都是可能改变计划的因素，而无论是谁在做这些更改——`Designer`、`Business\
  \ Analyst`、`Developer`、`Product Owner`——在那个时刻，他们都在*设计*该产品。如果团队将产品的`definition`与产品交付完全分开，他们就忽略了设计在整个过程中进行的这一事实。\n\
  \n## HCD = 研究 + 设计\n\n设计（尤其是 HCD）的永恒陷阱之一是，`design`这个词本身容易引起许多误解。人们经常考虑到视觉设计，并使用“外观和感觉”等术语，将其视为涂层油漆。\n\
  \n为了尽可能清楚地说明：**HCD 是研究与设计的结合。** 没有研究，设计中就没有“人”。HCD 是一种从一开始就将业务目标与用户需求对齐的方法论。无论设计是简单还是复杂，都是如此。HCD\
  \ 通过确保在整个开发过程中将人置于框架内，确保产品得以交付。\n\n## 介绍 HCD 的阶段\n\nHCD 包含七个关键步骤：\n1. `Discovery`\n\
  2. `Ideation`\n3. `Concept Validation`\n4. `Refinement`\n5. `Development`\n6. `Evaluation`\n\
  \n这些步骤的范围和持续时间根据团队的方法而异。\n\n\n### Discovery (发现)\n\n*Discovery 为构思产生所需的输入，或者产生“正确的问题”。*\
  \ 发现的目的是定义并阐述要解决的问题，理解用户需求并适当评估限制条件。\n\n在发现过程中，看到以下某些内容是典型的：\n* 业务需求收集\n* 设计需求收集\n\
  * 内容/资产清单\n* 用户研究/用户理解工作\n* 假设的成功标准\n\n在此阶段，收集有效解决问题所需的背景需要从各种利益相关者（例如`Product Owners`\
  \ 和其他业务利益相关者）处获取。这样团队就能理解产品应该交付的能力。团队需要技术利益相关者（例如`technical architect`）的参与，以理解解决方案的限制。\n\
  \n在以人为中心的敏捷（Human-Centered Agile）中，发现活动还包括从用户处获取，以便团队对态度和行为有必要的理解，并收集设计限制。这整组信息构成了问题的`problem\
  \ definition`。没有这些信息，团队可能会设计出不可行的、或成本高昂且低效的解决方案。\n\n最后，在考虑正在解决的问题时，团队应该考虑如何定义成功，以及衡量成功的标准是什么。在这一早期，团队应该考虑从用户和业务的角度来看成功应该是什么样，以便在之后确定解决方案时，能够开发出衡量方法。思考这种问题的一种方法是使用\
  \ Jeff Gothelf 和 Josh Seiden 提出的“结果”（outcomes）的定义：\n\n> 结果是驱动业务结果的人类行为的变化。结果与制造东西无关——尽管它们有时是通过制造正确的东西来创造的。相反，结果是客户、用户、员工行为的变化，这些变化为你的公司、你的组织或你工作的任何关注对象带来了益处。²\n\
  \n这个定义非常有用，因为它让团队远离了挑选解决方案并通过衡量构建的功能数量来衡量成功的做法，转而去理解他们所构建的产品实际上是如何改变某人的行为的。\n\n\
  发现的输出是对通过这些活动所满足的需求的清晰阐述的问题定义，并带有定义的`benefit hypothesis`、`value proposition`和成功标准。\n\
  \n### Ideation (构思)\n\n构思和概念验证结合在一起以确保正确的解决方案。在构思步骤中，团队探索并评估多个解决方案概念（通常被称为`lateral`或`发散性思维`），然后选择要开发的解决方案路径。\n\
  \n\n\n\n在软件设计中，这可能通过研讨会或其他协作活动进行，也可以作为由利益相关者评审的异步设计活动进行。在这种语境下，典型的构思交付物包括白板图或线框图图、用户流和屏幕流等。然后，团队会对这些概念的总体可行性和工作量进行评估，以此作为决定哪些方案可以进入后续阶段（概念验证）的依据。\n\
  \n对于敏捷团队中的设计师来说，构思可能面临独特的挑战，因为设计步骤往往被压缩到单个冲刺中，呈现出一种“满意满足”（`satisficing`）的方式——即第一个听起来足够好的解决方案就会被尝试，几乎没有时间来探索替代方案。通常，工作始于产品负责人（Product\
  \ Owner）要求的特定解决方案，且缺乏产生挑战的横向维度。某些挑战是技术性的，另一些则涉及对工具的理解、功能的易用性/发现性，甚至只是对产品美学特性的意料之外的反。真实环境中的产品表现与其在受控环境中验证时总是不同。\n\
  \n实际用户的发布后体验决定了发布的成败。理解这些体验对于提供所需的洞察至关重要，能够正确引导对产品组合的战略性投资。以人为中心的敏捷方法承认，做到这一点需要理解用户对团队产品及其体验的态度和情感，而不仅仅是衡量特定的业务价值指标（这些通常代表已交付价值的滞后指标）。\n\
  \n评估的产出是理解你的产品如何为用户带来价值，并在不足之处为未来的产品策略提供参考。\n\n## 以人为中心 vs. 以用户为中心 …… 有什么区别？\n\n\
  \n\n\n\n虽然一些从业者强烈倾向于其中一个术语而非另一个，但在操作层，它们之间并没有本质区别。在流程的不同阶段，团队会与使用（或可能使用）其产品的人进行互动，以挖掘他们的需求和愿望并验证他们的解决方案。“用户体验”是一个涵盖性术语，涵盖了影响用户对产品感受的所有设计部分，并且在应用时，它可能或不会在关键点纳入用户反馈。\n\
  \n\n\n\n以人为中心的设计（HCD）的每个阶段都提供了特定的、针对团队的益处（参见图 3.1）。了解每个阶段发生的活动类型及其特定目的是有帮助的，这样从业者就可以有策略地将这些活动整合到敏捷交付中。\n\
  \n本章并没有（也无法！）提供为了理解用户态度和行为而可以采用的所有研究技术的详尽列表。这些示例为理解每一步发生的活动提供了一个起点，使用了一些最常见的方法。\n\
  \n这里描述的活动侧重于 HCD 的早期阶段，这些阶段旨在确保团队实际上在以实用的方式（正确的解决方案）解决用户需求（正确的问题）。这些活动应该引导团队做出“转型还是坚持”的决策，为有信心地进入交付阶段铺平道路。\n\
  \n![图 3.1 发现阶段的 HCD 活动与产物。](img/Figure3_1.jpg)\n\n\n## HCD 与发现\n\n在发现阶段，通过特定的努力来理解产品是如何置于用户生活和使用语境中的，以及用户对产品和或类似产品的态度如何。这种研究可能针对已经在使用的现有产品，以便观察其周围的行为；也可能是对语境和态度的理解，这些影响了用户将如何对新产品做出反应。\n\
  \n无论何种，目标都是理解人们是否可能重视某个特定的产品或功能以及为什么，然后学习团队如何增加该价值。这在投入工作之前完成，因为用户甚至会让最投入的产品团队感到惊奇。\n\
  \n从团队交付的角度来看，发现工作会带来几个关键结果（另见图 3.1）：\n\n*   清晰晰的问题定义\n*   问题已通过用户验证\n*   团队在冲刺和发布目标上达成共识\n\
  *   产品所有者（Product Owner）的信心\n\n### 清晰的问题定义\n\n团队通过他们的发现活动对自己构建有价值解决方案的能力建立了信心。通过这些活动，他们开始了解用户，并对想要和需要什么产生了想法，特别是团队具体如何如何提供有价值的解决方案。如果没有良好的问题定义，路线图往往会根据心血来潮、新奇事物或对什么能让用户发现价值的希望性猜测而设定。“只要你建立，他们就会来”是一个神话。与电影*梦想球场*不同，用户很少仅仅因为构建了产品或功能就过来了。良好的问题定义还允许团队开发基于结果的成功标准，以便团队理解他们是否构建了成功的解决方案。\n\
  \n### 问题已通过用户验证\n\n一旦团队想出需要为用户解决哪些问题，他们就可以向验证他们所学的内容迈出一步。这种验证建立了对他们工作的信心。\n\n###\
  \ 团队在冲刺和发布目标上达成共识\n\n团队通过他们的发现活动对自己构建有价值解决方案的能力建立了信心。通过这些活动，他们开始了解用户并对想要和需要什么产生了想法\n\
  \n### 产品所有者的信心\n\n从“希望性猜测”转向经过验证的问题，使团队对工作更有信心。在交付具体功能的过程中，很容易失去目标。\n\n### 发现活动\n\
  \n发现阶段用户研究的目的是为了确保团队理解用户。Tony Ulwick 和 Clayton Christensen 提出了“待办任务 6\n\n常见的发现活动是：\n\
  \n*   实地观察/语境调查\n*   走入式测试/焦点小组\n*   个人情感收集\n*   间接情感收集\n*   数字民族学\n\n**实地观察和语境调查**仅仅是两种不同的方式，即观察用户（或潜在用户）完成他们的任务。理想情况下是在尽可能接近用户的自然环境中进行，尽管“直接观察”通常发生在实验室或其他控制环境中。鼓励用户“大声思考”或描述他们的态度，研究人员记录他们的行为和想法。\n\
  \n**走入式测试/焦点小组**是设计用于一次性收集多个用户反馈的方法。走入式测试在整个过程中引导用户寻求反馈。以这种方式，它们是语境调查的小组版本。焦点小组更多关注态度而非行为，因为它们发生在之后，以这种方式，它们是用户访谈的集体版本。\n\
  \n**直接情感收集**以一对访谈为典型，是用户态度的丰富来源。虽然这些没有提供直接的行为观察，参与者可以报告他们如何使用工具或是否有特定问题。关于直接体验的访谈最好在接近用户的预期体验时进行，以便参与者的记忆尽可能新鲜，从而提供基于经验的示例。\n\
  \n### 发现产物\n\n研究产物是团队之间编码和共享研究的方式，并保留以备后用。它们确保团队从已的研究活动中获得最大的益处。在计划期间，记住将原始笔记和活动记录提炼为准确且实用的见解（这一过程被称为研究合成）是需要的。想象进行了\
  \ 20 场访谈——研究团队不会交出几十页笔记，也不会仅仅在构思期间评论他们的印象。相反，他们将重要的发现汇总成表达见解的文档。\n\n#### 用户画像与共情图\n\
  \n用户画像是对常见角色或用户类型的描述，通过影响其态度或行为的因素进行区分。它们作为已知用户信息的传播辐射器，有助于将对话和产品设计决策集中在考虑理解的用户语境的情况下开发新功能上。正如此，当用户画像提供可能影响设计决策的信息时它们最有效。\n\
  \n影响设计的信息示例是：\n\n*   他们多久使用或可能使用实现特定目的的产品？\n\n\n\n\n\n*   他们是那种预期能够学习和探索的日常用户，还是需要定期重新引导的低频用户？\n\
  *   他们使用该产品的动力是什么？\n*   他们使用该产品的背景是什么？他们在何处，有什么东西在竞争他们的注意力，等等？\n*   该产品在多大程度上契合他们已有的习惯和行为？\n\
  *   他们对产品可能的替代方案或替代品是什么？\n*   他们熟悉哪些术语和语言，哪些是新学的？\n\n共情图（Empathy maps）与用户画像（personas）相关，它以视觉化的方式展示了用户在接触或参与使用正在开发的或或服务时的感受。共情图通常包含较少的通用的背景信息，更多地关注在特定互动时刻的情绪状态。虽然用户画像信息与共情图信息之间存在很大的重叠可能，但在帮助团队达成共识以确定正确解决方案时，它们各自发挥着有用的沟通功能。\n\
  \n`Scenarios`（场景）是用户尝试完成的关键任务，并包含了任务周围的背景，例如用户何时或为何执行某项操作。通常针对使用特定系统的用户画像会有几个关键场景，这些场景直接与用户画像相结合，这样团队在设计解决方案时，既能了解用户是谁，也能了解他们希望实现什么。\n\
  \n场景与 `use cases`（用例）的主要区别在于，场景侧重于用户对完成任务的特定情感、期望以及屏幕之外的体验。例如，可能会询问用户：“在尝试完成任务 X\
  \ 时，什么最可能让你感到沮丧？”\n\n关于场景的一个经典设计决策是，用户在一次操作中有多大可能实际上`complete`完成交互。与用户一起设计数据输入表单，如果是包含已知信息的短表单，与需要从多个来源收集信息且可能耗时的表单相比，看起来是完全不同的。\n\
  \n### 旅程地图与服务蓝图\n\n![](img/pg37.jpg)\n\n旅程地图（Journey map）是对`对用户呈现的过程`的端到端拆解，即使其中涉及其他参与者，并丰富了对态度和行为的观察。它们记录了用户遇到多少个触点，以及他们在每一步的期望、挫败感或愉悦点是什么。旅程地图特别适用于从整体观察流程，以识别改进体验的领域，而不是简单地将每次接触视为孤立的体验。服务蓝图（Service\
  \ blueprints）亦是如此，但明确旨在从业务的角度完全识别整体体验中的“后台”或“幕后”部分。\n\n### 发现阶段的设计活动\n\n![](img/pg37.jpg)\n\
  \n虽然发现阶段的研究活动侧重于理解用户，但在期间还应进行一系列行的设计活动。设计活动侧重于从业务角度理解设计目标和限制（例如品牌考量），并根据最佳实践识别改进机会。\n\
  \n#### 启发式评审 (Heuristic Reviews)\n\n启发式评审是解决问题的一种快捷方法，它使用非传统的方法，旨在在非常紧的时间限制内得出一个“足够好”的解决方案。启发式评审是对现有产品或流程的专业评审，旨在将该流程与通用最佳实践进行比较，通常使用特定的框架进行评估内容。启发式评审使用通用框架且从根本上是主观的，因此最好由多位专家进行评审并比较答案。\n\
  \n#### 竞争/对比性评审 (Competitive/Comparative Review)\n\n`competitive`（竞争性）或 `comparative`（对比性）评审是对现有产品或流程的专业评审，旨在将该流程与通用最佳实践进行比较，通常使用特定的框架进行评估内容。启发式评审使用通用框架且从根本上是主观的，因此最好由多位专家进行评审并比较答案。\n\
  \n#### 收集输入/创意工作坊 (Gathering Inputs/Creative Workshops)\n\n根据项目类型和成熟度，某些发现活动可能会关注于：\n\
  *   产品是如何呈现的？\n*   受众是谁？\n*   产品的目标是什么？\n\n由于产品的身份尚未定义，或者在创意工作坊期间，目标是定义基调和风格。\n\n\
  ### 发现阶段的设计产物 (Design Artifacts)\n\n对于这些活动中的许多，活动与产物之间存在一对一的关系，这正是它们存在的原因。它们包括：\n\
  \n*   启发式分析/评分\n*   竞争性分析\n*   情绪板（Mood board）和品牌手册（Brand book）\n*   创意简介（Creative\
  \ brief）\n*   样式指南和组件库\n*   早期史诗定义（Early epic definition）\n\n#### 启发式评分 (Heuristic\
  \ Score)\n\n启发式评审的结果应该是一份根据最佳实践对产品进行评分的文档，突出其优缺点。\n\n#### 竞争/对比分析 (Competitive/Comparative\
  \ Analysis)\n\n竞争性或对比分析的结果通常是对竞争对手产品优缺点的拆解，识别出解决方案呈现方式中的惯例（即模式）。该报告用于识别有帮助的惯例和改进机会，以及交付内容中的空白。\n\
  \n#### 情绪板和品牌手册 (Mood Board and Brand Book)\n\n情绪板是一组收集的材料（图像、颜色、其他产品示例），旨在为正在开发的解决方案的基调和风格提供灵感。品牌手册是一组关于品牌在整个产品营销和开发周期中如何呈现的特定指令。虽然它们在灵活性上有所不同（情绪板是指南，品牌手册是一组限制条件），但它们的共同目标是定义产品的视觉身份。\n\
  \n#### 创意简介 (Creative Brief)\n\n创意简介是一种用于传达所构建产品创意策略的文档。它是一份包含用户理解相关的细节文档（例如：为谁设计、基调和风格是什么、将采用什么样的沟通方法、从用户角度来看关键价值差异点是什么等）。\n\
  \n#### 样式指南和组件库 (Style Guides and Pattern Libraries)\n\n样式指南是针对产品交付的一系列既定实践。例如，在软件产品中，样式指南定义了字体使用（字体族、大小等）、图标使用、产品颜色（不仅是主色调，还是一组主色、次色和三级颜色，以及关于在产品内部如何使用这些颜的具体说明）、按钮的大小、形状和颜色、基础字段外观、常见重复值（如日期），以及特定的交互行为。\n\
  \n\n\n\n\n模式库（Pattern library）是共同使用的常用样式集合。例如，样式指南可能对文本字段的显示方式有特定定义，而模式库可能会定义如何处理地址条目（字段的顺序和标签、邮政编码是五位还是九位，甚至是否有地址验证服务）。在实践中，这两者之间没有完美的界限，但模式库往往更具健壮性。无论哪种，这些通常被视为动态文档，团队必须就如何管理对指南的合规性做出决策。\n\
  \n## 问题定义（以“史诗”形式呈现）\n\n发现阶段（Discovery）的目的是引导并为用户生成值得解决的问题。一旦识别出这些问题，它们就可以被捕获为“史诗”（Epics），即宏大的工作单元，其规模之大以至于可能需要几个月才能交付。它们将每个待解决的具体问题提炼到一个单一的可追踪位置，并从用户价值的角度来描述这些问题。这为团队提供了空间，让他们通过构建一个小型的\
  \ MVP（最小可行性产品）来验证他们的概念，并从用户与领域真实产品的互动中获得早期学习。这种洞察对于帮助团队尽早避开失败的方案至关重要。\n\n史诗被分解为“功能”（Features），即中等规模的工作单元，专注于为用户交付解决方案。功能进一步被分解为“故事”（Stories），故事的粒度比史诗细得多，且规模恰使其可以在单个冲刺（Sprint）内完成（参见图\
  \ 3.2）。在每个冲刺期间，团队专注于故事这一最细粒度的价值交付单元。用户故事足够小，可以在单个冲刺内完成，同时也足够大，包含了通过故事交付给用户的特定价值。\n\
  \n\n图 3.2 一个史诗如何分解为许多功能，这些功能又分解为多个故事。\n\n史诗还让团队能够回答以下问题：\n\n1. “我们正试图为用户解决的问题是什么？我们期望他们获得什么价值？”\n\
  2. “这是一个需要解决的问题吗？”\n3. “‘利害’是什么？”（关于“利害”，更多内容见第 6 章。）\n4. “解决这个问题对公司业务有什么好处？”\n\
  5. “在适合问题的投入范围内，什么样的解决方案是用户可以接受且可行交付的？”\n6. “如何衡量该方案的成功？”\n\n## HCD 与构思\n\n在以人为本的敏捷开发（Human-Centered\
  \ Agile）构思期间，团队会产生竞争性的方案概念以供进一步评估。这确保了团队不会“过度工程”那些复杂程度或劳动密集程度超过其所产生价值的解决方案。在可能的情况下，构思是与用户协作完成，以便引导团队创造更有可能成功的体验。\n\
  \n构思的目标是确保团队通过对要解决的问题进行良好的理解，来识别出对用户有效且对业务成功的解决方案。\n\n从团队交付的角度来看，构思期间的协作和发散思维会导致几个关键结果（另见图\
  \ 3.3）：\n\n* 预先考虑多个 `solution candidates`（方案候选）\n* 对方案候选的选择标准有共同理解\n* 对方案候选的体验目标、风险和权衡有共同理解\n\
  * 产品所有者（Product Owner）的信心和团队的认可\n\n### 多种方案候选\n\n团队往往会收到以特定请求方案形式呈现的指示，可能来自领导层或其他利益相关者。如果没有一个步骤来确定该请求是否符合一个验证过的问题（正确的问题），或者该方案在用户预期或投入水平方面是否合适，并且没有考虑替代的方案候选，团队产生不符合意愿或过度工程方案的风险将大得多。\n\
  \n\n图 3.3 构思期间的 HCD 活动和产物。\n\n### 方案候选选择标准\n\n知道为什么要构建某个解决方案的团队，将对交付该方案有更清晰的使命感和理解。协作构思允许团队成员了解考虑了哪些竞争性的方案候选，以及它们为何被排除。那些有机会探索过“什么”（what）和“为什么”（why）的团队，不容易因所选方案路径的持续疑虑而偏离。\n\
  \n### 体验目标、风险与权衡\n\n由于方案选择是一个协作过程，在考虑解决方案时会兼顾多个标准。拥有正确的参与者意味着风险可以尽早被识别和处理，高风险的解决方案可以被排除为不合适。这也意味着当团队进入开发阶段时，未来的决策可以参考已知风险做出，以便在开发过程中得到解决。\n\
  \n### 产品所有者的信心\n\n从发现到概念验证的每个阶段，都旨在给产品团队以及产品所有者信心，确保他们正在解决正确的问题，并且正在获得正确的解决方案。协作构思意味着产品所有者更有信心认为已经考虑了一系列解决方案，并且没有没被考虑过的更好的方案。\n\
  \n### 构思期间的研究活动\n\n构思消耗的是发现阶段产生的研究信息。构思本身不产生新的研究洞察；然而，确保研究人员产生的洞察是可用的且`实际上被使用`是至关重要的。这种方式取决于团队规模和投入的规模。\n\
  \n在这一阶段，研究团队可能以两种方式之一参与：\n\n* **非正式知识传递**——在较小的团队中，特别是当研究人员和设计师（Designer）是同一个人时，知识传递通常是非正式的，主要发生在故事细化以及与产品所有者或其他团队成员的其它沟通点中。虽然可能没有专门用于分享洞察的活动，但思考如何编码和共享研究洞察以达到最大效果仍然是一种良好的做法。这确保了它们在团队增长、成员变动或仅仅随着时间推移时依然有效。\n\
  * **洞察分享**——对于较大的团队，或者研究与设计分离的情况，可能需要安排特定的会议来解释并解答有关生成洞察的问题，以及它们可能如何影响正在构建的产品。配合交付的研究产物，这使得用户知识在构建的决策过程中处于领先位置。\n\
  * **直接参与工作坊**——当构思通过协作工作坊进行时，研究团队的成员应该是全员参与的。通过参与，他们根据研究洞察作为用户的倡导者。\n\n### 构思期间的设计活动\n\
  \n\n\n\n构思（Ideation）是团队生成多个`high-level`解决方案概念的阶段。这些概念需要足够稳健，以便团队对每个候选方案的投入和风险进行粗略评估，并决定哪些方案需要通过用户进行验证。这样做是为了让团队就哪种方案最适合要解决的问题做出明智的决策。在此阶段，解决方案的整体蓝图已经清晰，但细节可能尚不明确。\n\
  \n团队在尝试对产品的基础设计达成共识时，基本上有两种路径：协作设计工作坊和概念性设计。\n\n## 协作设计工作坊\n\n在这种情况下，`Designer`\
  \ 会与其他利益相关者（有时包括用户本身）共同头脑风暴解决方案。。工作坊在结构和持续时间上会有很大差异，但目标是让团队和利益相关者对解决方案的目的以及要解决的问题产生共同理解，然后让他们在（任何适用的限制范围内）发挥创造力来解决这些问题。\n\
  \n## 独立设计\n\n在这种情况下，`Designer` 独立使用发现产物来创建设计方案，并提交给 `Product Owner` 和团队以获取反馈。在这个设计阶段，会考虑主要/关键步骤，并将其限于所谓的“快乐路径”活动（不探索边缘情况或错误处理）。解决方案概念足够清晰，可以启动讨论并开始接收关于交付所需投入和整体用户价值的反馈。\n\
  \n## 体验风险评估\n\n协作构思（包含多个利益相关者）的优势之一是体验风险会及早出现。以人为中心的敏捷实践者关注关于团队是否正在构建不受欢迎或令人不满意的解决方案的风险，但协作构思还能提高对其他风险（技术风险、政策风险等）的早期意识，这些风险可以被发现、捕捉并解决。\n\
  \n### 构思的设计产物\n\n\n`storyboard`（故事板，以及它的近亲漫画）是对待开发解决方案的叙述性描述，并由示例或低成熟度的视觉效果支持，这些视觉效果代表了用户如何完成整个过程。故事板的价值在于它作为一个解决方案概念易于理解和分享，并且明确将用户及其思考作为解决方案描述的一部分包含进来。作为额外收益，叙述性的解释可以激发进一步的想象和探索工作。\n\
  \n`Screen/user flows`（屏幕/用户流程）与故事板类似，但它们是从产品角度呈现的，而不是以叙述格式呈现。`Screen flows`（或 `user\
  \ flows`）是屏幕或其他交互触点的逐步序列，将引导用户从预期的操作到完成的操作。屏幕流程的价值在于，团队可以稍微深入地了解解决方案如何运作，并使用其创建的平台（例如移动设备、电脑屏幕、收银台接口等）。\n\
  \n`Wireframes`（线框图）是屏幕的低保真版本。在这一阶段，这些可以从白板画或纸笔绘图范围到高保真渲染图不等，但设计成熟度仍然较低。\n\n## HCD\
  \ 与概念验证\n\n在概念验证期间，团队与用户一起审查概念设计，以确保解决方案正在以有效的方式解决用户需求。如果正在考虑多个候选方案，收集用户对每个方案的态度也有助于对哪种方案将提供最佳体验做出更好的决策。这些努力确保团队花时间在开发用户想要并理解的产品上。\n\
  \n概念验证是一个研究步骤——无论是 `HCD` 实践者还是 `Agile` 团队，无法在不参与用户的情况下验证其预期的解决方案是成功的。（注：原文此处存在大量重复段落，译文已按要求去重并保留核心逻辑）。\n\
  \n概念验证是一个研究步骤——无论是 `HCD` 实践者还是 `Agile` 团队，无法在不参与用户的情况下验证其预期的解决方案是成功的。\n\n\n\n\n\
  - **印象测试（Impression Tests）：** 向用户展示关键交互点（如首页）的表示形式，并询问他们对所见内容的目的和行为的理解。这有助于团队了解到达体验对用户来说是否清晰，以及用户是否对后续步骤和预期价值有清晰的认知。后者用于收集对团队正在交付的预期价值的态度反馈。\n\
  - **转述测试（Paraphrase Tests）：** 要求用户用自己的话转述他们对该体验所提供内容的理解。这种测试针对所使用的语言，无论是作为内容或导航的标签，还是作为用户需要理解的解释和描述。\n\
  - **卡片分类（Card Sorting）：** 要求用户以与其自身相关的方式组织信息。根据具体方法，这可能还包括添加他们预期的内容类型并为内容组命名。这种方法对于理解用户对复杂内容结构或交互集的心理模型特别有用。\n\
  - **任务完成测试（Task Completion Tests）：** 向用户展示解决方案的端到端表示形式，并要求其完成某些非常具体的任务。这种方法用于观察他们从开始到结束的顺畅程度。在概念验证期间，这种方法旨在理解预期的体验与用户所需的结果之间是否存在良好的匹配度。\n\
  - **功能排序（Feature Ranking）：** 要求用户对产品交付的多个潜在解决方案进行排序。这种方法有助于理解和验证用户对特定功能的兴趣，特别是为了确定优先顺序的目的。这种方法还可以揭示提议功能中的风险点（red\
  \ flags）。\n\n准备上述任何一项工作都将包括识别用于测试的工具、生成测试脚本，以及规划一种适用于结果受众的报告方法论。\n\n### 招募研究参与者\n\
  \n招募不应被低估，它是任何研究工作中最为繁重的任务之一。团队需要识别合适的参与者特征（例如，创建面向首次用户的团队将不会希望与经验丰富的用户进行测试）。\n\n\
  对于引导式测试（moderated tests），需要联系这些候选人、安排时间并授予他们对使用的任何测试平台的权限，这些都需要考虑在内。有些组织会有专门的研究运营团队来处理这项工作；对于没有此类团队的组织，这一步不应被视为理所当然。最后，任何安排会议的人都需要记住，引导和记录员需要时间在会议之前进行准备，并在会议之后花时间整理笔记。\n\
  \n### 执行研究工作\n\n开展研究工作可能意味着设置异步测试，在这种情况下，这一步所需的工作很少；监控参与情况；以及在参与者有问题或困难时提供支持。如果研究工作包括与用户进行的任何引导式或面对面的互动，将花费更多时间。在这一步，不仅包含以人为中心的设计（HCD）从业者是有益的——当其他团队成员担任记录员和观察者时，他们的参与也强化了创造良好结果是团队责任的观点，而且洞察会在整个团队中产生共鸣。\n\
  \n### 综合研究发现\n\n最后，收集和分析结果是一项耗时的工作；原始结果可能很有趣，但如果不经过分析，对大多数利益相关者来说并没有用处。执行此工作的 HCD\
  \ 从业者需要知道预期的交付物是什么、受众是谁，以及正在支持哪些决策。有了这些信息，团队就可以有效地报告他们的洞察了。\n\n### 概念验证的研究产物\n\n\
  **测试计划（Test Plan）：** 这是描述测试本身目的和方法论的文档，应该在任何研究启动之前制定。测试计划记录了学习目标和所使用的方法论。它还可以包括后勤安排，例如招募策略和时间安排信息。\n\
  \n**测试脚本（Test Script）：** 对于引导式研究，脚本可以引导参与者进入研究环节，让他们理解自己将要做什么以及为什么这样做。它还确保团队在所有参与者中正确地收集数据——例如，以相同的方式提问相同的问题。这使得数据在综合过程中更具一致性和用处。\n\
  \n**测试数据（Test Data）：** 无论使用何种方法，都会从研究中获取一组原始数据。这组数据可能是面试笔记、卡片分类的参与者结果或原始问卷调查数字。\n\
  \n**洞察（Insights）：** 综合过程产生洞察——即那些具体的、可操作的观察结果，被用于做出产品设计决策。\n\n**发现总结（Summary of\
  \ Findings）：** 除了具体的洞察之外，几乎每项研究都会产生总结性文档——对所学内容的叙述性解释，包括支持性证据。一次研究可以产生多个总结（例如，根据针对的对象的需求产生摘要和详细报告）。\n\
  \n### 概念验证期间的设计活动和产物\n\n\n由于概念验证主要是一项研究活动，因此设计活动仅限于对测试原型所需的任何设计改进。设计师需要确保任何设计都拥有足够的信息，让测试参与者理解并提供有意义的反馈。\n\
  \n#### 设计改进（Design Refinement）\n\n从构思阶段产生的方案设计应该已经在团队内部建立了共享的理解。这并不意味着它们对用户来说是可以理解的，或者已经准备好进行研究。可能仍需要设计工作来创建一个适用于测试方法论的产品。例如，这些更改可能包括提高设计的保真度以便用户获得足够的上下文，调整显示的语言以更好地匹配用户的词汇，或者创建一系列特定的屏幕来代表特定的交互，以验证效果。\n\
  \n# 第四章 从精炼到评估的 HCD 活动和产物\n\n本章描述了在选择交付方案后，以人为中心的设计（HCD）为团队带来的益处。它有助于理解整个交付过程中（包括精炼和方案验证）发生的活动类型。\n\
  \n\n## HCD 与精炼（Refinement）\n\n在精炼期间，团队对具体要交付的内容达成清晰、共享的理解。对于采用敏捷开发的团队，精炼已经是一项熟悉的活动，形式为用户故事编写和精炼。\n\
  \n从 HCD 的角度来看，精炼重点关注识别并做出任何将被团队提取实施的剩余设计决策，并提供任何支持故事理解和一致的视觉参考。此外，在精炼期间，团队确定了在评估期间衡量解决方案成功的具体方式。\n\
  \n\n\n\n此前生成的调研产品会在细化（refinement）过程中被团队消耗，以确保决策是以用户为中心做的。否则，调研活动将仅限于研究人员作为团队成员参与故事编写和细化的部分工作。\n\
  \n从团队的角度来看，使用视觉化参考文档进行细化会带来比典型细化之外的一些关键结果（另参见图 4.1）：\n\n*   团队更有可能在开始之前发现缺陷。\n*\
  \   产品所有者（Product Owner）达成更强的共识，且每个故事都有更清晰的完成定义（Definition of Done）。\n*   团队拥有明确定义的基于结果的成功衡量方法。\n\
  \n## 团队更有可能在开始之前发现缺陷\n\n团队视觉化呈现即将发生的工作的好处之一是，团队更容易发现解决方案交互设计中的缺陷。一旦解决方案的真实呈现呈现在面前，团队就能识别出用户需要的额外功能，并考虑不那么明显的特殊情况。\n\
  \n## 产品所有者更强的共识以及每个故事更清晰的完成定义\n\n视觉化呈现的另一个益处是，产品所有者对交付的内容有一个清晰的认知，这最大限度地减少了团队听到“这不是我的意思”的次数。在细化过程中达成共识花费的时间，比团队先构建产品然后又不得不迭代以达到产品所有者的预期结果要少得多。\n\
  ![图 4.1 细化过程中的 HCD 活动和产物](img/Figure4_1.jpg)\n\n图 4.1 细化过程中的 HCD 活动和产物。\n\n## 团队拥有明确定义的基于结果的成功衡量方法\n\
  \n团队确定什么样的指标和信号适用于学习解决方案是否对用户产生了预期影响。然后，他们创建故事以便在评估期间收集这些指标。这项工作是一项团队活动，因此在此阶段不需要特定的设计或调研活动，但会影响下游的调研活动。\n\
  \n## 细化的设计活动\n\n`Design refinement` 有许多形式，但目标本质上是相同的——通过阐述所有设计细节，让团队对交付内容达成共同理解。这包括视觉元素、预期的行为（包括特定的交互行为）、反馈消息，以及用户在参与过程中会体验的解决方案任何其他方面。强烈建议对于除极小之外的所有故事，都为交付的工作提供视觉参考。\n\
  \n`Content generation/revision` 对成功至关重要。解决方案所需的任何内容都需要在细化过程中进行创建或评审。这包括作为体验一部分的任何文案，与交互相关的内容（字段标签、提示文本等）以及交互过程中的反馈。\n\
  \n`Design standards review and updates` 是协作过程的一部分。即使在单个团队内部，通常也需要维护样式指南和模式库以确保产品的一致性，这对于生命周期长且更新频繁的产品来说尤为真实。对即将上线故事的设计应该根据现有标准进行评审，并在需要时整合新的样式/模式。\n\
  \n## 细化的设计产物\n\n### 内容\n\n将内容视为一种与代码、交互设计和视觉设计同等地位的、值得评审和细化的产品是至关重要的。易用性的每个方面在某种程度上（且通常在最大程度上）都取决于内容运作的优劣程度：路径引导、定向和决策支持都取决于良好的标签、清晰的描述、有意义的反馈等。团队应该寻求确保内容简洁，并使用用户熟悉的语言编写，同时符合预期的语调。可以像其他任何易用性一样对内容易用性进行测试，内容测试应该像所有易用性测试一样引导至细化。\n\
  \n此外，产品用户看到的任何文案都需要以这种方式记录，以便团队能够准确地交付。这看起来像是一个简单点，但值得指出，团队有时在确保交付团队能正确引用内容方面面临困难。\n\
  \n### 线框图、原型……以及验收标准\n\n并没有一种特定的、正确的交付物来产生对设计交付内容的共同预期。共同理解可以通过线图（wireframes）、原型（mock-ups）、带注释的截图，甚至是编写良好的故事来实现。视觉参考为团队带来了优势，因为当对书面标准可能存在多种解释时，它们减少了误解。重要的结果是团队的产出符合一组共同预期，团队避免了与产品所有者或其他利益相关者发生“这不是我的意思”的对话。\n\
  \n此阶段的线图或任何其他视觉化方案与流程之前提到的相比，区别在于它们的成熟度。当故事被细化时，线框图可能需要更新，以展示特定的、最初未考虑的额外交互，以应对新出现的技术限制。原型在细化阶段并不是需要的。它们的生成是为了定稿新产品和功能的视觉设计，或将新的视觉设计元素整合到产品中。换句话说，从单选按钮变为下拉菜单的故事不需要原型，但添加一个收集信息的新“向导”故事通常需要。\n\
  \n### 样式指南和模式库更新\n\n任何所需的新样式或识别出的设计模式一旦同意实施，就应立即更新样式指南、模式库或任何其他管理文档。\n\n## HCD 与开发\n\
  \n在开发期间，团队确保正在构建的解决方案与已编写的故事匹配。从设计和调研的角度来看，特定活动侧重于评审，并在需要时进行任何进行中的调整。这主要是一个设计步骤，尽管团队在进行中的设计更新时可能会寻求相关的现有调研洞解。\n\
  \n从团队的角度来看，开发支持带来两个关键结果（另参见图 4.2）：\n\n*   按预期生产的可发布产品\n*   反映设计意图的进行中的决策/调整\n\n\n\
  在创建视觉参考（如原型或线框图）的同时，让设计师评审故事的完成情况，可以确保它们是按照约定和预期完成的。这包括确保一切看起来和感觉都与故事或验收标准的描述一致，并且交付的产品符合既定的样式指南和设计模式。\n\
  \n## 反映设计意图的进行中的决策/调整\n\n开发者在开发过程中遇到意外问题是常见现象，例如意外的技术限制或未记录的新异常情况。对设计的调整最好通过设计师和开发人员之间的协作来处理，这样就可以找到包含用户需求并符合设计意图的最佳替代方案。\n\
  \n## 开发的设计活动\n\n`In-flight design support` 是设计师根据新发现的限制调整设计所做的任何工作。\n\n\n\n\nUX\
  \ 保证（也称为设计评审）通常是团队定义用户故事“已完成”（done）的一个正式步骤，设计师在此期间审查开发工作，以确保其符合任何约定的标准。\n\n![图 4.2\
  \ 开发中的 HCD 活动和产物。](img/Figure4_2.jpg)\n\n图 4.2 开发中的 HCD 活动和产物。\n\n## 开发的设计产物\n\n\
  更新样式指南或模式库——如果正在进行中的设计支持创建了新的设计模式，设计师应该更新相关文档。\n\n## HCD 与解决方案验证\n\n在解决方案验证期间，团队确保他们正在构建的解决方案符合发布的“正确完成”（done\
  \ right）标准。团队进行解决方案验证的保真度比之前的概念验证工作更高。这可能是一个更接近最终产品的的模型或原型，也可能是正在构建的实际产品。无论何种情况，团队都旨在确保用户能够理解并成功使用将交付的解决方案。解决方案验证是一项发布前的活动，这意味着研究是在产品或功能完全发布之前进行的，以便能够及时为计划的发布做出决策。\n\
  \n从团队的角度来看，解决方案验证会导致两个关键结果（另参见图 4.3）：\n![图 4.3 解决方案验证中的 HCD 活动和产物。](img/Figure4_3.jpg)\n\
  \n图 4.3 解决方案验证中的 HCD 活动和产物。\n\n* 发布时风险降低\n* 改进发布后的工作规划和优先级\n\n### 发布时风险降低\n\n解决方案使用真实用户测试高保真产品。通过这种方式，团队能够识别体验中的任何困惑或挫败点，并在产品接触更广泛观众之前解决任何风险信号。这降低了在问题修复期间疏远用户或产生高昂支持成本的风险。\n\
  \n### 改进发布后的工作规划和优先级\n\n除了发布前需要解决的“红旗”问题外，解决方案验证还可以揭示较小的问题或优化体验的机会。团队通常会开发一个“快速跟进”工作待列表，以处理不被认为是关键的已知问题。\n\
  \n### 解决方案验证的研究活动\n\n解决方案验证的活动与概念验证中描述的相似，包括确定团队的学习目标、招募参与者、进行研究以及分享发现。主要区别是研究使用了更高保真度的产品。最常见的解决方案验证研究是任务完成测试，尽管也可以其他测试来验证体验的特定部分。例如，团队可能会进行转述测试，以确保特定的文案提供了良好的引导或决策支持。\n\
  \n### 解决方案验证的研究产物\n\n与活动一样，解决方案验证的产物与概念验证的产物相似，包括用于规划的产物（测试计划和测试脚本）以及研究本身的产物（洞察和报告文档）。\n\
  \n## HCD 与评估\n\n在评估期间，团队确保他们构建的内容在现实世界中是有用的。团队有多种方法可以做到。除了包含之前阶段定性技术的方法（如访谈和可用性测试）外，团队现在可以观察用户在实际使用场景下操作他们的解决方案。此外，团队还可以整合定量信息收集（如分析、问卷和评分工具，如净推荐值\
  \ NPS），以反映大规模的行为模式。\n\n发布后的定量和定性评估结果都会被引入后续的迭代规划和待办列表细化。通常，这些洞察会为开发产生新的功能和用户故事。\n\
  \n从团队的角度来看，评估会导致三个关键结果（另参见图 4.4）：\n\n* 识别意外之外的问题\n* 改进的识别与优先级排序\n* 产品级的成功衡量\n\n\
  ### 识别意外之外的问题\n\n定量和定性评估活动都是至关重要的，因为真实环境中的产品（和用户）的表现与在受控环境中验证时的预期至少会有一点点不同。\n\n\n\
  图 4.4 评估中的 HCD 活动和产物。\n\n### 改进的识别与优先级排序\n\n除了衡量解决方案的效果如何之外，评估工作还会暴露出未满足的用户需求以及解决这些需求的想法。对于正在遇到问题甚至仅仅是体验不佳的用户来说，对产品下一步的走向提出建议是自然的。建议改进的频率和紧迫性为团队决定下一步做什么提供了极佳的第一步。\n\
  \n### 产品级的成功衡量\n\nHCD 从业者将功能级评估转化为整体解决方案级评估。解决方案的满意度很少是该解决方案组成部分的总和，在考虑定性和情感影响时尤为如此——这种影响一方面可能导致解决方案的采纳和忠诚，另一方面则可能导致挫败感和放弃。定量和定性评估并行是关键。定量衡量为团队提供了行为上的“什么”，而定性衡量则提供了“为什么”。\n\
  \n### 评估的研究活动\n\n**情境查询（Contextual inquiry）**指的是观察在自然语境下使用的解决方案。与受控环境下的可用性测试不同，这让团队更清楚地看到用户的动机和他们对产品的态度。团队还能看到用户行动的背景，包括干扰因素和并发任务等内容。\n\
  \n**问卷（Surveys）**在目前几乎无处不在，为团队提供了快速从广泛用户中收集信息的机会。对于纵向反馈，它们可能特别有用，可以了解随着产品本身以及竞品环境的变化，用户态度是如何随时间演变的。\n\
  \n**间接情感收集（Indirect sentiment gathering）**指的是通过远程、异步的方式来调查用户对产品或体验的感受。有一些熟悉的工具会要求用户在体验后直接进行报告。还有更先进的工具和方法，寻求从其他信息池中聚合情感，例如：\n\
  \n* 帮助热线/支持工单\n* 社区讨论板\n* 社交媒体提及和活动\n\n间接收集情感的目标是了解人们在各种语境下对产品的看法，而不仅仅是在计划的研究活动期间。关注这种直接渠道之外的一个优势是它可以消除了任何参与偏差（参与者通常有讨好或提供帮助的愿望；而打帮助热线或在讨论板上互动的人没有）。从这些背景中收集情感可以揭示比向研究人员陈更多的担忧或问题。\n\
  \n#### 数字民族学（社区浸入）\n\n\n\n\n\n民族志是对文化进行的参与式观察。在人机交互辅助（HCA）和软件开发中，它通常指的是通过检查社区的数字足迹来理解社区的沉浸式方法（因为更具字面意义上的沉浸式技术即使可用，也极其繁琐）。这可以通过审查他们的在线社区行为（例如讨论论坛或社交媒体）来实现，这种观察可以在不具有侵入性的情况下进行。\n\
  \n### 分析回顾\n\n数据分析回顾顾如其名，是对被跟踪的用户行为进行审查。这允许团队识别用户可能面临的潜在困难，这些困难可能需要进一步的定性调查。\n\n\
  ### 评估的研究产物\n\n来自情境性调查（contextual inquiry）的研究产物将与之前讨论过的概念和方案验证的研究工作产物相似。\n\n`Sentiment\
  \ analysis reports` 是团队进行的任何情绪收集（如调查问卷等）的汇总报告。当从问卷或帮助热线日志等来源收集情绪时，通常会对用户评论进行额外分析，寻找关键词或其他非数值的情绪指标。\n\
  \n请注意，提取情绪的数据池可能包含偏差。例如，人们对通过问卷征求的意见（极化的反应）与对支持电话的预期可能不同，后者可能反映了对工具的挫败感或对支持过程本身的情绪，而不是产品，并且可能与问卷的结果不同。\n\
  \n# 第三部分：多少以及何时？在敏捷中规划和执行 HCD\n\n# 第 5 章：将以人为中心的设计引入敏捷\n\n\n项目管理的核心在于风险管理。传统的项目交付方法依赖于“瀑布”方法来管理项目风险。该过程中的阶段通常是分析、需求收集、设计、构建、测试和部署（或类似的阶段）。这种方法的逻辑是，通过在每个阶段之前进行审查，项目经理只需确保在上阶段工作完成之前不开始下一阶段的工作，就能最大限地减少风险。然而，这比听起来要困难。他们如何知道工作是否真的完成了呢？\n\
  \n在瀑布模型中，设计发生在特定的、有时很长的阶段。“需求收集”阶段意味着与利益相关者交谈以听取他们的要求，然后创建一个庞大的需求列表，并进入设计阶段创建一个以某种方式实现所有这些需求的方案。\n\
  \n使用这种方法，风险会不断累积，因为传统项目每个阶段所做的假设从未在用户那里进行测试或验证，而是仅仅在团队内部的业务分析师和领域专家之间进行审查。由于一个阶段必须在下一个阶段开始之前完成，分析和设计阶段可能花费一\
  \ 年（或更久！）来完整记录所交付交付的每一个细微细节。到那时，这些阶段的输出不仅过时了，而且没有经过实际用户的测试和验证。结果就是“大爆炸”式发布，将所有开发出的功能一次性地发布给用户。这增加了发布一个无法提供用户所需所有特性和功能的产品的风险。它也增加了由于技术原因导致发布完全失败的风险。\n\
  \n## “瀑布式”交付及其挑战\n\n糟糕的用户体验并不是瀑布模型的唯一风险。在足够大的规模上实施和交付可运行软件时，还有特定的额外关注。\n\n即使拥有一套全面的需求，在瀑布式发布的实施阶段也可能出现问题，对于大型项目尤为如此。一个主要问题是，即使花费了所有时间，技术假设往往是错误的。产生需求的人要么对用户需求了解不够深，要么没有时间处理细节，或者对特定方面缺乏完美的预见。错误的假设也可能在团队无错的情况下发生。由于需求定义过程可能耗时很久，技术的进步可能意味着设计是使用一组约束创建的，而交付时却是在不同的约束下完成的。\n\
  \n为了进一步增加复杂性，技术问题通常在代码集成期间出现。巨大的问题。因为各个团队的代码在项目结束之前没有作为一个单元进行集成和测试，构建失败和昂贵的重工作工作成了常态。瀑布式开发中的版本控制系统倾向于包含多个分支，要求在项目结束时进行费力的合并，这个过程几乎总是会导致某些东西崩溃。在此过程中的\
  \ Bug 以难以识别而闻名，修复它们可能是一场噩梦。开发者、分析师和测试人员之间关于谁该负责的指责变得司空见惯，如果代码最终集成了，进度的严重滞后是最可能的结果。\n\
  \n此时，对新集成的代码库进行测试开始，通常以悲剧性的结束，出现多个需要团队协作才能解决的错误。这些通常不是小问题，而是致命的缺陷，迫使进行重新分析以及主要的重新设计和重工作。并不罕见整个功能需要被取消范围，因为团队知道他们在剩余的时间内永远无法让它们运行。正是在这段时期，团队意识到他们设计和构建的内容并没有完全解决当前的问题，或者是以一种次优的方式解决的。图\
  \ 5.1 显示了风险如何在瀑布项目中累积，价值交付如何被推迟。\n\n\n图 5.1 瀑布项目中的风险和价值交付。\n\n## 用敏捷取代瀑布模型\n\n考虑到瀑布模型的所有风险，巨大且昂贵的工程完全失败的情况并不罕见。敏捷开发的出现是为了通过改进知识工作者的协作方式来缓解这些风险。在敏捷开发中，形成跨职能团队，目标是理解用户需求，并通过快速交付小批价值并获取用户反馈，在迭代和增量地改进方案之前测试解决方案。\n\
  \n敏捷产品开发代表了心态的清晰转变，它更关注客户和快速提供终端用户价值，而不是广泛的计划和文档工作。敏捷从未假设在项目开始时有一份全面的“需求”文档，因为经验表明在那个时候创建这样的文档简单是不可能的。相反，敏捷方法通过向终端用户交付一小单元的价值来测试假设，从中学习，然后根据这些学习进行迭代。\n\
  \n敏捷在软件开发中特别有效，但这种心态和方法可以成功应用于任何类型的知识工作，知识工作被定义为任何工作者比经理更了解该主题的工作。⁸\n\n\n图 5.2 敏捷项目中的风险缓解和早期价值交付。这里的条形代表累积价值交付。\n\
  \n\n\n\n\nHCD（以人为中心的设计）与敏捷开发共享一个重要的哲学基础，这两种方法的整合都基于此：即以最简单、最快、最廉价的方式了解产品和交付工作。图\
  \ 5.2 展示了在敏捷项目中，如何通过小增量的早期价值交付来降低风险。\n\n## 敏捷与 HCD 之间的有机重叠\n\n敏捷实践者熟悉“快速失败，经常失败”的方法。在敏捷开发中，团队花费少部分时间开发一个失败的方案被认为是一好事，这样他们就可以快速转向对另一种方案的测试。其核心理念是将产品交付切分成足够小的碎片，以便能够快速测试团队底层假设中存在的问题，使开发过程中出现的问题能够被识别并修复，并让学习在不危及整个产品发布的情况下进行。为了快速交付并获取真实反馈，接受一定程度的重工作（敏捷实践者称为重重构），而不是试图预见到每一个可能的细节。\n\
  \nHCD 是一项旨在避免许多相同风险的实践，尽管这些风险有时出现在交付的不同阶段，同时它处理了额外的共同风险。\n\n*   通过识别和验证用户需求，敏捷团队降低了浪费时间构建用户实际上并不需要或想要的东西的风险。追逐不必要的功能是一个极其昂贵的提议。\n\
  *   通过在关键点与产品用户验证设计，敏捷团队最大限度地减少了基于不成功的设计方案或错误假设而导致的重工作。\n*   通过在产品交付后进行评估，敏捷团队确保了其对进一步改进产品的投资具有良好的针对性。\n\
  \n即使没有正式地引入以人为中心的设计（HCD），敏捷开发在传统上已经将*部分* HCD 整合作为其方法的一部分。在`构建 > 评估 > 迭代` 的循环中，评估阶段是所有\
  \ HCD 发生的地方。也就是说，即使在发现或构思阶段没有与用户接触，也预期在产品发布时收集用户反馈，并让这些反馈为团队提供改进。在某种意义上，评估阶段代表了发现（用户现在会告诉团队他们解决的是否是一个并不存在的问题）、概念验证（用户会告诉团队某个是否是一个坏主意）以及方案验证（用户会告诉团队在哪些特定位置存在问题）。\n\
  \n对于某些类型的项目，评估阶段可能足以让团队在正确的方向上进行。\n\n以下是其中的两个典型例子：\n\n1.  **新产品或功能的极早期阶段，进行快速迭代**\n\
  \    寻找敏捷与 HCD 之间重叠部分最简单的方法是考虑当新项目或功能启动时会发生什么。通常，一个想法被表达为一个两个需要发生的重要事项，然后被快速开发并展示给少数关键人物以获取反馈并进行迭代。当这些人代表用户和利益相关者时，这就取代了用户调研的步骤。这通常发生在小团队中，每次迭代的风险足够低，使得团队可以安全地遵循所获得的反馈。然而，一旦产品具有足够的知名度或团队足够大，这种方法往往会变得具有风险或不足。\n\
  \n2.  **预期将退市的非常成熟的产品**\n    偶尔，产品处于一种只需要微小更改的状态，通常是基于持续的反馈。当大多数战略决策已经确定，只需要对产品的剩余生命周期进行微调时，情况就是如此。\n\
  \n## HCD 如何融入敏捷开发？\n\n当团队和组织从瀑布模型转型到敏捷开发时，弄清楚设计如何融入新的交付方法可能会变得令人困惑。瀑布模型的定义步骤（需求收集和设计等）为团队提供了完成发现和构思阶段的时间。在敏捷开发中，这些步骤如何融入大图可能变得相当不清晰。\n\
  \n从一开始就必须理解，在将敏捷与 HCD 整合时，这些活动并不会进入一个单一、整洁的线性位置。然而，*这并不意味着它们没有发生*。相反，这意味着每一步都对团队正在进行的活动进行适应。就像没有一种完全正确的实现敏捷的方法一样，也没有一种通用的方法来整合敏捷和\
  \ HCD。\n\n具体来说，设计步骤何时以及如何发生将取决于：\n\n*   产品规模\n*   团队/组织的规模以及团队之间的相互依赖程度\n*   发布的风险程度（后文将详细介绍）\n\
  \n### 为什么不用 HCD “替代”敏捷开发？\n\n如果团队从一开始就能通过 HCD 方法从终端用户那里获取要做什么的信息，为什么还要使用敏捷开发？为什么不直接构建用户要求的东西并假设这会成功呢？答案是，用户和产品团队都不是无懈可击的。如果不获取用户反馈，根本不可能团队是否构建了一个良好的解决方案，而且总会有方法让它变得更好。敏捷提供了恰恰那样的框架和心态。以人为中心的敏捷开发由于其持续包含利益相关者，从第一次迭代开始就提供了改进的“任何东西”。\n\
  \n### HCD 如何应用于敏捷思维\n\nHCD 工作不仅关注“正确的问题”和“正确的解决方案”问题，还关注评估已构建的产品（“做得很对”）。HCD 有兴趣于理解用户的态度、行为和期望，以更好地指导开发工作。开发工作本质上受限于一种解决方案，并按照指示交付（这是对“做得对”的另一个不同但重要的视角）。这贯穿整个交付生命周期，而不仅仅是几个特定时刻。\n\
  \n敏捷实践者通常认为产品主（Product Owner）是决定构建、发布和迭代内容的客户第一个声音。然后，发布后的某种形式的评估和反馈提供了客户的第二个声音。表\
  \ 5.1 显示了在使用传统敏捷流程与以人为中心的敏捷开发相比时，每个设计阶段的团队活动情况。\n\n表 5.1 不带 HCD 的敏捷与带 HCD 的敏捷对比表\n\
  \n| || 不带 HCD 的传统敏捷 | 以人为中心的敏捷 |\n| --- | --- | --- |\n| **发现** | 团队根据产品主的解释接收需求和期望，这通常是业务需求和有限用户反馈的混合。\
  \ | 团队学习和或主动验证用户需求和期望，寻求对建议的产品愿景或更新的具体态度。同时，从产品主和其他业务利益相关者处获取业务需求。 |\n| --- | ---\
  \ | --- |\n| **构思** | 团队根据产品主的要求工作。技术可行性和舒适度是产品设计最大的限制因素。通常只考虑一种解决方案。 | 团队利用发现阶段的知识，与产品主和其他团队成员（包括业务分析师、开发、HCD\
  \ 从业人员以及可能的用户）进行协作构思，生成并比较多个概念。 |\n| --- | --- | --- |\n| **概念验证** | 团队假设他们的解决方案是有价值的，并且发布后可以进行迭代。\
  \ | 团队通过用户反馈对其解决方案概念进行受验证，以支持在流程早期做出转型或坚持的决策。 |\n\n\n\n\n\n| 阶段 | 传统敏捷方法 | 以人为本的敏捷方法\
  \ |\n|---|---|---|\n| 完善 | 产品负责人（Product Owner）和团队根据技术约束更新用户故事。产品负责人根据需要为开发提供额外的指导。\
  \ | 团队将验证中获得的洞察应用于解决方案的开发。以人为本（HCD）从业者参与故事完善，以确保开发反映了预期的解决方案，并足于用户需求和期望。 |\n| 开发\
  \ | 开发人员根据新需求或不可预见的约束进行更改，并倾向于追求效率。 | 对开发的内进行 UX（用户体验）保障评审。开发人员和设计师共同根据新需求或不可预见的约束进行更改，并在效率与体验之间进行权衡。\
  \ |\n| 解决方案验证 | 团队假设他们的解决方案通常是正确的，任何出现的问题可以在发布后通过迭代解决。 | 团队将解决方案（或不同保真度的原型）展示给终端用户，以确保产品在发布前被用户理解并按预期满足需求。\
  \ |\n| 评估 | 团队将发布后从真实用户那里收集的任何反馈和洞察整合到下一个产品周期中。这通常是使用高层产品成功指标、广泛适的满意度结果或帮助热线/支持问题报告获取的。\
  \ | 团队包含基于用户的产品发布后成功衡量，并根据反馈对任何缺口或额外功能进行优先级排序。 |\n\n在引入以人为本（HCD）时，团队将转变为一个在五个阶段中尽可能让最终产品用户参与的流程。\n\
  \n在整个过程中让用户参与可以减少误判以及交付无法实际满足用户需求的产品的风险，从而改进产品生命周期的每一个步骤。从初始概念到实现，用户都是关键的利益相关者，团队应该寻求他们的投入。在早期阶段，他们帮助团队确保正在解决正确的问题；在后期阶段，他们帮助团队有效地构建出正确的解决方案。\n\
  \n## “实验性”心态\n\n实验帮助团队和领导者拥抱不确定性。将实验作为一种实践引入，是一个明确的信号，表明承认未知是有有价值的，同时正努力填补知识空白。它还为团队改进产品和流程提供了机会。\n\
  \n在团队层面，实验是相当自然的。实验旨在通过一个清晰的假设来回答特定问题。例如，“更大的按钮会被点击得更频繁。”实验是一种特定的研究方法，是引入研究的一种可行方式，但它不是唯一的方法。\n\
  \n### 实验从哪里来？\n\n在产品层面，实验源于团队希望学习用户偏好的解决问题方法的愿望。这表现为对用户可能想要的内容提出假设并测试这些假设的机会。这可以在发现阶段发生（形式为从用户那里收集信息），也可以发生在构思阶段（即产生解决方案概念（如轻量级原型）并将其展示给用户）。在这两种情况下，这些都被视为具有特定学习目标的实验，团队有权既验证也可以推翻他们的假设，并有机会对如何继续进行做出决策。通过这种方式，这些实验产生的学习通过帮助团队理解用户对于“什么是正确的解决方案”以及“如何正确完成”的态度，来指导交付。\n\
  \n在流程层面，实验可能以团队回顾的形式出现，表现为一种新的工作协议，供在一个或两个冲刺中进行尝试，“仅仅为了看看这样做效果是否更好”。同样，实验也可以源于项目级的回顾，项目回顾的结构和重点与团队回顾不同，但仍然提供了关于项目级行为和改进机会的洞察。\n\
  \n### 如何进行实验？\n\n支持向实验心态的转变需要在整个项目范围内征集实验想法。这些想法可能来自想要获得特定实验支持的团队，来自个人提出实验以解决担忧或知识空白的项目级会议，甚至来自某些渠道（如建议箱或“建议墙”），这些渠道允许个人异步且匿名地提出想法。一旦确定了实验，重要的是以这种方式对其进行记录，以便日后团队可以查看结果以指导未来的活动。\n\
  \n确保实验、其进展和结果对所有人可见（而不仅仅是少数人）是至关重要的。此外，失败的实验应该被庆祝——拥有真正的实验心态，团队在获得“成功”（经过验证的假设）的同时，也会有一些“失败”（被推翻的假设）。事实上，“失败”是一个误导性的词，因为只要实验产生了学习，它就没有失败。通过频繁强调这一点，并关注实验带来的良好益处而不是它们“失败”了的事实，领导层可以展示出对团队以及这种这种新的工作和思维方式的支持。\n\
  \n项目应该在项目内部强调实验及其结果。\n\n### 迭代，而不仅仅是增量\n\n实验（事实上是所有研究）的结果之一是迭代。令人惊讶的是，团队和项目经常不理解迭代（iterations）和增量（increments）之间的区别，这类似于绘画（迭代）与拼图（增量）之间的区别。\n\
  \n在拼图中，拼块一块接一块地添加，直到完成。构建拼图的人从不回去改进某块拼图或一组拼图。它是一个*组装过程*，而不是一个*改进过程*。\n\n绘画倾向于相反的方式。画家从草图和基础构图开始，在过程中不断完善。他们可能在不同阶段进行，但绘画的每个区域都被重做过一次。画家退后，评估他们的工作并迭代，直到光线、阴影和纹理完成。\n\
  \n对于任何敏捷团队（特别是以人为本的敏捷团队）来说，迭代是至关重要的。不迭代的团队就不会创新。以增量而非迭代方式构建产品是非常常见的反模式。小批量构建的意义在于从用户那里获得快速且频繁的反馈。反馈的意义在于改进未来的交付。不接收反馈或不使用反馈改进产品的团队往往是在给瀑布模型披上敏捷的外壳。不要这样做。\n\
  \n## 从“构建并观察”的敏捷到从“构建并观察”转向基于风险的思维是迈向以人为本敏捷的关键步骤，因为这种思维允许团队将投入在 HCD 研究上的时间、金钱和精力水平与功能或产品的风险相匹配。这种转变鼓励早期讨论功能的风险，以及通过更深入了解用户或直接观察用户与拟议特征的交互来缓解哪些风险。它还强调了一致地衡量结果。\n\
  \n### 以人为本的敏捷赋能团队\n\n\n\n\n\n产品负责人（Product Owners）负责敏捷团队待办事项列表的所有权和优先级排序，这在以人为中心的敏捷（Human-Centered\
  \ Agile）中也是如此。区别在于团队如何获取用户需求、洞察和偏好的信息。在以人为中心的敏捷中，团队不再依赖产品负责人作为用户的代理。相反，他们可以获取来自数十、数百甚至数千名用户的汇总、组织化和分析后的情感反馈。这些洞察有助于团队编写更好的故事、选择更好的设计方案、完善验收标准，并为待办事项的排序和完善提供支持。\n\
  \n## 拥抱不确定性\n\n转向敏捷和产品思维时，困难的部分之一在于：团队在开始时并不一定“知道”他们的最终产品会是什么。这产生了两种不同的不确定性：\n\n\
  * 产品不确定性\n* 交付不确定性\n\n接受这两种不确定性需要进一步的转变，即愿意将整体战略视为灵活的并能对新信息做出响应。\n\n### 产品不确定性\n\
  \n习惯于传统方法的团队通常从一份厚如电话簿的需求列表开始工作。这些团队通常对这份需求文档感到非常安心，因为他们构建的是列表中的内容，就意味着他们“处于正确的轨道上”。除非他们并没有做对，而这种情况经常发生。通常，团队直到项目结束时才知道这一点，此时会签发变更订单，导致成本增加并超出预算。这时，寻找某人来归责就成了必然。\n\
  \n敏捷开发和产品思维认为，项目开始时的一份“正确”的需求文档提供了一种虚假的安全感。在任何领域使用传统方法的专业人士，从未有人发现甘特图在重大项目结束时与开始时看起来是一样的。这是因为情况在发生变化，而敏捷帮助团队拥抱这种变化。\n\
  \n敏捷有助于关注价值，即团队希望通过工作实现的结果。通过关注并衡量交付的**价值**而非**完成百分比**，团队可以通过允许自己进行实验来降低压力水平。一旦发生这种情况，他们就可以自由地挑战所做出的假设，并尝试创新的解决方案，并且知道并非所有的实验都会成功，而这没关系。为了支持这种变化，团队应该：\n\
  \n* 识别每个功能交付的成果，并明确说明如何衡量成功。\n* 确保团队意识到，他们的成功主要取决于产品表现优坏，而不是交付速度有多快。\n* 在约定的频率上建立实际的衡量会议。\n\
  \n### 交付不确定性\n\n随着转向以结果为导向并解决问题的方法，团队和项目需要接受这样一个观点：最初他们可能不知道完成某事需要多久。随着工作的进行，他们对努力和进展的感觉会变得清晰。敏捷拥有处理这一点的工具，初始估计被认为不如后期的可靠，允许团队在假设被证实或证伪时完善并调整工作规模。然而，仅仅说“这就是敏捷的工作方式”并寄希望交付不确定性会被接受是不够的。许多项目往往未能完成让敏捷团队成功的思维转变。为了支持这种变化，团队应该：\n\
  \n* 确保他们理解规模评估是一个迭代过程，会随着功能和故事的完善而发生变化。\n* 定期纳入识别和讨论风险的活动。毕竟，对类瀑布式交付预测性的渴望是建立在可以在最后一刻掌握所有关键点的假设之上的。\n\
  \n## 风险是什么？\n\n如果问题是“风险是什么？”，答案可能有几种不同的形式，有些比其他的更显明显。在考虑进行或放弃研究的风险时，请考虑以下几点：\n\n\
  ### 投入精力\n\n这是风险中第一个也是最显而易见的因素。生产级代码的创建是昂贵的。团队将投入多少时间和金钱到他们认为用户想要的东西上？如果用户并不想要呢？\n\
  \n### 支持成本\n\n像交付成本一样，这是直接成本。发布令人困惑的软件会导致以帮助台支持形式体现的额外成本。在这种情况下，“量两次切一刀”可以避免一些真实的头疼问题。\n\
  \n### 受众规模\n\n受发布影响的受众有多大？如果团队和几个友好的利益相关者是第一批用户，那么风险就很低。如果他们搞砸了，团队会解决它，每个人都会将失误视为进展。如果有百万用户，即使是一个小失误也可能导致混乱（再次产生支持请求）或不满。\n\
  \n值得注意的是，寻求定性反馈只是减少大规模发布风险的工具之一。团队通常会进行功能试点，例如 A/B 测试或多变量测试，允许小部分功能向有限受众开放。\n\n\
  ### 沟通投入和受众预期\n\n投入了什么样的精力来提高对发布的知名度和热情？这是一次预料中的发布还是更新吗？是否通过营销或其他沟通提升了受众预期？如果该功能非常知名，发布一个令人失望的产品潜在负面影响可能高于其开发成本。这很重要，因为并不是每个用户都会给产品第二次机会，对于发布一个备受推崇但表现糟糕的产品来说，这是一个非常真实的采用风险。\n\
  \n### 体验的核心性\n\n游戏设计师使用“核心循环”（core loop）的概念来描述体验的核心内容。\n\n> 核心循环本质上是你的游戏的心跳。它是一系列或一系列动作，作为玩家体验的主流程不断重复。它是我们反复回来玩游戏的核心本质。\n\
  \n\n\n\n\n> — **Kevin Wolstenholme**\n\n这一概念适用于许多产品——团队是否正在改变其所提供的体验中的核心内容，而这正是客户回流的原因之一？一个开发在线购物网站的团队如果更改了结账交互，那么其改变的体验内容要比更新“再次购买”提醒功能的团队更具核心性。这并不意味着该体验不重要，而是意味着该变更对用户的即时影响较低，可能允许在发布后进行更好的问题解决。如果团队正在更新体验的核心部分，那么在团队评估风险利害时，这应该是一个考虑的因素——如果更新没有用处或损害了体验，那么改变核心体验的发布将带有极高的风险。\n\
  \n## 声誉\n\n除了用户接受产品的即时成本外，还有一种风险：那些无用或令人困惑的发布会随着时间的推移，损害体验质量以及产品在用户（可能还有潜在用户）中的声誉。在考虑将声誉作为确定风险的因素时，团队应该考虑他们通常进行评估工作的频率，而不仅仅是针对某次特定的发布。\n\
  \n## 士气成本\n\n发布糟糕产品时会想到的成本通常是构建和支持软件本身的成本，或者是构建和维护用户群的成本。然而，在评估发布风险时，还有另一个值得考虑的风险：团队士气。如果团队成员反复感到无法发布交付价值的产品，他们往往会寻找更有成就感的机会。\n\
  \n## 每个生命周期阶段的风险\n\n### 发现\n\n如果团队尚未发现用户的需求，他们就面临构建出完全不受欢迎内容的风险，这可能是一项昂贵的任务。此外，如果团队构建了许多不想要的功能，这些功能可能会挤占用户所需的体验。功能越多并不总是意味着越成功。事实上，“功能堆砌”是一个已知的产品风险。有时，不构建不需要的功能确实是最佳决策。这同时是最廉的决策，符合敏捷宣言的原则：“简单——最大化减少未完成工作的艺术——至关重要。”⁹](#fn9)\n\
  \n### 构思与概念验证\n\n无论是从构思中产生具有竞争性的概念，还是希望沿着某个特定概念继续推进，概念验证的结果都是“转型还是坚持”（pivot-or-persevere）的决策——团队试图决定是否继续推进给定的解决方案。在某种意义上，风险在于精炼、构建和支持产品的成本。如果团队仅验证了一个问题，却在没有比较备选方案的情况下，就抓住脑中第一个解决方案或技术上最方便的解决方案，他们就面临着生成比需要更复杂或更昂贵的解决方案，或者在解决问题上无法达到用户预期效用的风险。\n\
  \n### 解决方案验证\n\n解决方案验证可以决定发布一个带有重大问题和高支持成本的产品，还是发布一个表现良好的产品。未被察觉的问题可能会导致高昂成本，表现为用户完全拒绝该解决方案，或者需要昂贵的技术支持。解决方案验证不应局限于功能测试和技术成功——糟糕或困惑的体验对用户来说，可能与功能故障一样成为问题。发布前的测试可以降低带有“红旗”问题上线的风险，并避免用户对他们的体验感到失望或沮丧。\n\
  \n### 评估\n\n了解产品的健康状况对于确定和优先考虑未来的工作至关重要。如果产品表现不佳且团队没有对其进行评估，可能会产生影响。\n\n## 每个特定决策的风险\n\
  \n了解产品的健康状况对于确定和优先考虑未来的工作至关重要。如果产品表现不佳且团队没有对其进行评估，可能会产生影响。\n\n# 第 7 章：在敏捷中规划和开展\
  \ HCD 活动\n\nDOI: [10.4324/9781031885210](https://doi.org/10.4324/9781031885210)\n\
  \n在开发工作之前、期间和之后，存在着各种 HCD 工作。由于研究有一段先于开发工作的跑道，产品所有（Product Owners）和 HCD 实践者必须超越当前的迭代（Sprint）来规划他们的工作。\n\
  \n这种早期的生命周期工作很难追踪，对于习惯于只将开发工作视为“工作”的团队来说，这可能是一个挑战。前瞻性可能会在 HCD 和敏捷思维之间产生摩擦，但不应该如此。这种规划并不意味着团队变得缺乏灵活性（被长期承诺锁定），但它意味着团队可以比仅通过构建发布级软件来学习更低的成本进行学习、迭代并降低风险。\n\
  \n## 使用研究路线图\n\n研究路线图（Research Roadmap）通过将敏捷价值观和规划引入研究背景，帮助团队弥补这一差距。例如，通过整合研究路线图，团队可以保持运营的灵活性和对目标清晰、共享的理解，同时改进对工作量的估算，并保持研究与近期工作保持相关性。\n\
  \n![图 7.1 研究路线图。](img/Figure7_1.jpg)\n\n研究路线图（见图 7.1）类似于产品路线图。其目标是为即将进行的研究工作提供高层概览，包括它们所服务的整体学习目标，以及在时间和优先级方面处于什么位置。研究路线图与产品路线图并行，因为两者之间存在依赖关系。\n\
  \n通过路线图视图查看研究，可以查看计划中的 HCD 工作范围，并作为一个整体进行优先级排序。这还让团队能够查看每个史诗（epic）和每个功能的 HCD 工作，以确定关键未知因素是否得到了解决，从而使团队能够策略性地尽可能降低产品开发风险。\n\
  \n\n\n\n\n从业者会注意到此图的两个点：研究与设计活动是分离的，且许多以人为中心的设计（HCD）活动不在同一个冲刺（sprint）中完成。\n\n##\
  \ 研究与设计活动分离\n\n将研究与设计活动分离，是为了强调研究是以人为中心的设计（HCD）过程中不可或缺的一部分，并突出它需要不同类型的工作，而这种工作通常被认为是设计的一部分。`Designer`\
  \ 仅凭一个想法（或一组需求）和计算机就能制作原型图，但无法通过这种方式制作用户旅程图。同样，由之前的研究或最佳实践引导的设计活动贯穿整个过程，不需要进一步的研究。故事（Stories）基于对用户的了解，但它们通常会根据技术和业务限制或简单的新决策进行细化。当这些完善对前端产生影响时，`Designer`\
  \ 应该参与到完善过程中，以确保更新反映的是用户目标，而不是为了方便而做的决策。\n\n### 许多 HCD 活动未在当前冲刺中完成\n\n研究活动需要时间让团队进行消化和响应。显然，想要学习或验证用户需求和欲望的团队，无法在实施的一周前完成这一点，并仍留出细化的时间。相反，已经承诺在下一个冲刺中开展工作的团队，将无法看到通过发现（discovery）来影响当前计划发布版本的意义。在那个阶段，任何发现性活动只会影响未来的发布版本。\n\
  \n## 研究路线图与研究策略\n\n将 `Research Roadmap` 与产品路线图对齐，允许团队能够清晰地了解整体工作量，从而看到管线中中有哪些产品/功能，即使只是概括性的描述。同时查看这两者可以帮助团队清楚地看到哪些发布版本已经有或可能需要研究支持。\n\
  \n在审查产品路线图之后直接审查 `Research Roadmap` 是一个很好的做法，这样产品研究需求就会显而易见。通过查看所有这些功能处于周期的什么阶段，团队可以开始回答问题，例如：\n\
  \n*   还需要哪些发现工作？\n*   发现性研究可以支持多个发布版本吗？\n*   团队的时间有多少比例将花在“正确的问题、正确的解决方案、正确地完成”这些问题上？\n\
  \n例如，团队可能希望进行：\n\n*   真正的探索性研究，并围绕发现未满足的需求和机会展开的发现性研究。\n*   某些功能在实施远之前所需的发现性研究，以确保预期的功能解决了用户的需求。\n\
  *   针对某些功能的协作式构思，随后对高层解决方案进行概念验证，以便规划正确的解决方案。\n*   针对一到三个冲刺后发布的产品进行解决方案验证（可用性测试），以便将发现整合到故事和实施中。\n\
  *   针对特定发布版本后的评估工作。\n\n## 将 HCD 故事与产品路线图关联\n\n为了使用 `Research Roadmap`，团队需要能够将研究故事与其产品路线图上的相应工作相关起来。对于早期研究和设计工作（从发现到概念验证），这将意味着链接到一个描述团队试图解决的问题的\
  \ `epic`（史诗任务/巨型任务）。对于较后的工作（解决方案验证或评估），这些故事可以与功能挂钩。无论何种情况，研究工作都应该作为产品路线图上所反映的工作的一部分，并且是可识别和可追踪的。这确保了团队正在跟踪所有的研究和设计活动（即没有“账外”工作），并且所有工作都有约定的目的（即没有“悬浮”工作）。\n\
  \n### 巨型任务（Epics）、发现工作与“正确的问题”\n\n在其他方面，包括创建清晰的验收标准以及进行基于团队的细化和故事点（story-pointing）工作，故事应该被像其他故事一样对待。在\
  \ `Chapter 3` 中，对巨型任务的讨论集中在以下方面：\n\n1.  我们预期获得什么收益？\n2. 这是一个需要解决的问题吗？\n3.  什么样的解决方案是可以接受的？\n\
  4. 解决这个问题对业务有什么好处？\n5.  什么样的解决方案是可行的？\n6.  如何衡量成功？\n\n### 巨型任务示例\n\n假设一家公司在工作时间内提供支持。他们收到了一些\
  \ 24/7 支持的请求。该巨型任务将包含一个团队视角的陈述。\n\n> **EPIC-001：非工作时间支持**\n>\n> **团队认为有大量的额外需求，并需要确定如何提供支持以便客户在关系中感到放心。**\n\
  >\n> * 预期结果：\n> *   验证是否存在未满足的额外需求\n> *   识别用户对额外支持的期望（什么样的支持是可以接受的）\n> *   产生额外支持的想法\n\
  > *   验证并选择功能\n> *   为功能生成成功标准\n\n### 发现性研究故事示例\n\n以下是可能与示例巨型任务关联的示例研究故事，旨在满足验收标准（ACs）1\
  \ 和 2。由于研究故事是关于收集证据的，在完成后，团队可能会认为已经收集了足够的证据来做出决策，并且这些验收标准已满足；或者他们可能会认为需要额外的证据，从而额外的精力。\n\
  \n> **故事：作为一个产品团队，我们想要验证用户是否经常因非工作时间无法解决问题而感到困扰，以便我们以适当的方式解决他们的问题。**\n>\n> 学习目标\
  \ 1：识别用户对支持的现状。我们想知道用户是否意识到支持仅在有限的小范围内提供，还是他们的最初期望是拥有 24 小时的支持。了解期望与实际体验之间的差距将帮助我们决定是否要进一步提供支持。\n\
  \n\n\n\n\n## 学习目标 2：识别优先的支持方式。我们将包含一个关于他们期望和/或倾向于在非工作时间与我们联系的问题。\n\n**方法论**：12–15\
  \ 一对一访谈，预计每次时长 10 分钟或以内。\n\n**招募**：我们将提供小额奖励（10 美元账户额度），并向已加入研究计划的用户样本组发送招募邮件。\n\
  \n**成果共享**：将有一份页或更短的回复总结，包含对当前支持预期以及偏好支持渠道/方法的分析。\n\n**用户故事：作为产品产品团队，我们想要验证用户是否经常遇到问题在非工作时间无法得到解决的挫败感，以便我们能以适当的方式满足他们的需求。**\n\
  \n## 学习目标 1：识别最近联系过客户支持的用户是否因为无法立即联系到我们而经历了“等待挫败感”。\n\n**方法论**：对过去一个月内联系过客户支持的用户进行一次简短的（不超过\
  \ 3 个问题）多选择调查，并提供额外评论选项。\n\n我们预计会收到“两极化”的回复，且感到沮败的用户会有更强的参与意愿。在这种情况下，这并不是问题——我们将根据受访者百分比和调查接收者百分比来评估挫败感的报告。\n\
  \n**招募**：我们将提供小额奖励（10 美元账户额度），并向所有在过去 30 天内联系过客户支持的用户发送调查卷进行回复。\n\n**成果共享**：将有一份页或更短的回复总结。\n\
  \n与任何用户故事一样，研究故事应该由整个团队进行评审、完善和估算，团队可能对提供的任何细节（方法论、感兴趣的问题或信息分发方式）有疑问或额外想法。此外，团队还需决定如何捕获额外工作——例如，产出访谈大纲可能成为一个验收标准项，而实际执行访谈可能是一项任务。\n\
  \n这些示例是与史诗任务（epic）相关的问题验证，但这种故事结构适用于任何研究故事，包括概念验证故事和解决方案验证故事。\n\n字体 功能开发前的构思与概念验证故事\n\
  \n与研究故事类似，构思故事也与史诗任务相关，并先于特定解决方案的确定。构思故事的目标是生成可以相互评估的解决方案概念。在提供的示例中，如果团队验证了对额外支持的需求，则将有一个后续故事来生成提供该支持的解决方案概念。\n\
  \n**用户故事：作为产品团队，我们想要生成并估算多种解决方案，以解决用户对非工作时间支持的需求，以便我们能够识别出最有前景的候选方案进行交付。**\n\n**AC1**：我们将进行一次工作坊风格的构思会议，目标是产出\
  \ 3–5 种可行的设计。\n\n**AC2**：所有设计都将获得工作量的粗略估算（T 码大小）、可行性评分以及预期用户喜好度评分。\n\n在完成此故事后，将选择候选解决方案进行开发，或者在识别出风险（包括可行性评估和/或用户验收）时进行进一步验证。\n\
  \n请注意，该团队选择在构思上进行协作，因此他们没有描述具体数量的设计，而是设定了一个目标结果。这为他们的构思过程留了灵活性。如果该团队产生了看起来很有前景的想法，并希望在投入大量的开发工作之前确保用户对他们的解决方案能够接受，那么他们可能会再为概念验证创建一个新的研究故事。\n\
  \n**用户故事：作为产品团队，我们想要了解用户认为哪些拟定的非工作时间支持选项最有帮助，以便我们知道是否继续推进该解决方案。**\n\n**学习目标 1**：从我们的可行解决方案列表中，识别用户认为最有价值的支持渠道。\n\
  \n**方法论**：这将是一项针对约 50 名用户的异步排名任务。我们将向用户展示五个候选方案方案，并要求他们按照偏好顺序进行排名。我们还会包含一个“不使用”的选项，并提供额外评论的机会。\n\
  \n**招募**：我们将提供小额奖励（10 美元账户额度），并向已加入研究计划的用户样本组发送参与链接。\n\n**成果共享**：解决方案将按照偏好评分顺序展示。总结性文件中还将突出显示有见地的评论。\n\
  \n显显然，这并不是团队可能用于学习此点的唯一方法论。对团队来说，重要的是他们有一个明确的学习目标，并且对于什么样的证据在做出后续决策时是有价值的达成共识。\n\
  \n### 与功能相关的故事\n\n一旦选择了解决方案并创建了功能（当然，是绑定到史诗任务上的），现在任何进一步的研究或设计故事都可以附加到该功能上，例如在发布之前进行测试的任何解决方案验证故事。\n\
  \n## 估算、规划和调度特定的 HCD 活动\n\n访谈需要时间。线框图需要时间。研究和设计与其他工作并无异——工作本身需要达成一致、估算并交付，就像开发工作一样。考虑到依赖关系也是重要的。\n\
  \n那么，需要多长时间呢？“取决于具体情况。”这是任何 HCD 从业者在被问及工作需要多久时给出的第一个答案。设计师们因此闻名。良好的估算需要与设计师进行讨论，基于他们的特定技能、被要求解决的问题，以及他们开始时拥有的工具和资源。（事实证明设计师和开发者很像）。\n\
  \n通常情况下，为了充分交付“以人为中心的敏捷”的价值，待办列表（backlogs）需要足够稳定，反映大约 3–6 个冲刺（通常为 6–12 周）的即将进行的标准工作，并留出更多前置时间处理可能需要长时间研究和设计的复杂或高风险工作。\n\
  \n### 发现工作（估算：1–4 个冲刺）\n\n发现工作意味着与用户交流以了解他们想要什么。如果用户就在附近且学习范围窄，这可能只需要几天时间来访谈并汇总发现。然而，如果团队\n\
  \n*   拥有难以触达的受众且缺乏足够的既有信息（如果需要旅行则如此）\n*   拥有开放式的（探索性）学习目标，或更具体的问题验证目标\n\n那么某些发现工作可能需要多个冲刺（周或几个月）来规划和执行。\n\
  \n根据学习目标，团队将估算准备、执行和分析获取必要答案所需的访谈或其他工作需要多久。\n\n### 构思（估算：1 个冲刺）\n\n\n\n\n\n# 构思\
  \ (Ideation)\n\n构思涉及根据已有的用户和业务利益相关者信息，并确定如何解决他们的问题或满足他们的需求（有时被称为“我们可能如何……？”）。这意味着要决定哪种类型的解决方案最适合任务，并理解该解决方案在现实中可能是什么样的。为了这一点，团队必须确定可接受的方案范围——由于通过之前的步骤，我们已经对用户想要什么以及如何判断成功有了明确思路，因此选择方案就变成了在业务愿意投入的时间和精力范围内，找出哪种方案能最有效地交付结果。务必记住，这种构思工作仍然是一项相当“宏观”的工作。\n\
  \n本章较早关于制作额外支持渠道的构思示例，可能会产生几个候选方案：\n\n* 一个 常见问题解答（FAQ）页面和一个 help@yourcompany.com\
  \ 邮箱地址\n* 一个带有预定义答案的问题或带有自动填充的开放文本字段的表单\n* 与专业支持人员的在线会话\n* 基于人工智能/机器人的支持，它利用广泛的数字数据源学习如何有效地向客户提供回答\n\
  * 一个独立的支持应用程序，包含自服务信息和基于位置的问题报告功能，包括照片/视频上传\n\n显然，列出的解决方案示例并不详尽，它们也没有考虑主动的支持措施（例如对客户进行定期外访）。显而易见，设计和交付每个方案的投入程度可能差异巨大。\n\
  \n对于最简单的解决方案，团队可以预计大部分构思工作可以在单个冲刺（sprint）内完成（可能只需要几天）。这是一种常见的结果，但并非必然。随着解决方案的想法变得越来越复杂（且可以借用的良好定义约越少），特定功能的概念设计可能会花费更长时间——在示例中，支持应用的设计将需要更长时间。\n\
  \n## 概念验证（预计：1–2 个冲刺）\n\n![](img/pg109.jpg)\n\n以人为中心的敏捷开发（Human-Centered Agile）意味着计划从用户那里学习，以降低构建不受欢迎产品的风险。团队应该根据构建提议功能的风险来计划概念验证，这些风险包括时间、交付成本，或者如果发布不当可能导致的声誉损失或机会错失成本。\n\
  \n在上一个示例中，团队可能不需要对电话或电子邮件解决方案进行概念验证，但可能会对基于表单的解决方案考虑验证（特别是对于那些需要构建大量表单、表单包含大量逻辑，或需要用户提供大量时间或敏感信息才能完成的方案）。如果客户只习惯于直接与代表交谈（特别是在提供敏感信息时），构建聊天解决方案将是错误的；如果客户无法想象在稀有的支持场合需要或使用一个独立的、单一用途的应用程序，那么开发一个专门的\
  \ App 也是错误的。\n\n与所有测试一样，投入的精力将取决于需要学习的什么。方法论应由特定的学习需求驱动，而投入水平应由结果的风险大小驱动（是需要原型，还是通过简单的访谈甚至焦点小组会议即可完成学习？）。\n\
  \n## 精炼（Refinement）（预计：1–2 个冲刺）\n\n![](img/pg110.jpg)\n\n精炼是以人为中心的设计（HCD）与传统敏捷开发协作最直接的地方。当用户故事（stories）被精炼到开发者可以处理的程度时，可能会创建特定的设计产物来支持开发工作，例如描述特定交互、行为和结果的线框图或截图。这通常可以在精炼进行的同时发生（提前\
  \ 1–2 个冲刺），尽管更复杂的设计和交互可能需要更长时间。\n\n## 方案验证（预计：1–3 个冲刺）\n\n![](img/pg111.jpg)\n\n\
  通常，方案验证以可用性测试的形式出现。与早期的研究一样，所需的时间取决于用户招募的组织程度、从可用性测试中学习多少内容，以及为了获得预期的学习结果测试需要多严谨。\n\
  \n例如，团队可能希望进行类似于可用性的“烟雾测试”，向用户展示新功能以确保他们理解其用途并能够完成任务。这与“功能测试”的区别在于，后者只提供了一个任务，而没有提供完成任务的脚本操作。这凸显了导航问题或缺陷，特别是当每个功能运行正常但用户无法确定正确路径时。这种类型的任务可以指导“通过/否”的决策，且执行较快。学习目标仅仅是确保用户不会带着困惑的问题冲击支持团队。\n\
  \n或者，团队可能希望更全面地了解用户如何体验复杂流程、产生的情绪（沮丧还是惊喜）、特定的步骤、交互、语言片段或改进体验的支持功能。深入探讨额外的问题和复杂的路径在设置、实施和分析方面需要更长时间。\n\
  \n## 评估（预计：1–2 个冲刺）\n\n![](img/pg111a.jpg)\n\n评估是以人为中心的敏捷开发的一个基本环节，因为如果不衡量发布，几乎无法判断创建的解决方案是否实现了预期结果。以人为中心的敏捷开发意味着评估产品并将见解带回整体产品策略，以便团队对如何投入精力以产生预期结果做出正确的选择。\n\
  \n评估需要与其他研究工作类似的规划和准备。团队为衡量成功的任何工作（希望在过程早期已定义）都需要投入，也需要计划。这里的区别在于，评估工作的部分计划可以在开发期间进行，但由于评估在发布后才能进行，某些计划必须等待。例如，招募应该在确定发布后才进行，测试脚本必须反映最终发布的的产品。\n\
  \n# 使用估算计划 HCD 工作\n\n\n\n\n\n并非所有在实施之前进行的工作都具有相同的利益相关者或投入程度。视觉设计可能也可能不需要与其他利益相关者进行协调，例如提供反馈或批准的创意团队或品牌经理。内容创建的生命周期和工作流可能是极其复杂的，会有各种利益相关者参与其中（法务部门、营销团队等）。那些具有独立工作流和审批流程的依赖项，如果团队等到临近发布时才去确保满足这些需求，往往会令团队陷入困境。\n\
  \n此外，营销或传播通常需要并行工作，以确保产品发布时具有适当的营销和客户支持。在计划发布工作时，每项工作可能都需要一个独立的路线图和待办列表（backlog）来跟踪进行中的工作。\n\
  \n##敏捷事件中的 HCD\n\n除了计划和执行特定 HCD 的用户故事（stories）外，思考 HCD 从业者在典型敏捷事件中的角色也很有帮助。虽然 HCD\
  \ 从业者是平等的参与者，与任何其他成员无异，但他们被明确赋予了比其他角色更直接地代表用户利益的任务。因此，他们可能会与其他团队成员有不同类型的问题和投入。\n\
  \n### 迭代计划中的 HCD：通过提问调整重点\n\n在冲刺或迭代计划中，即使是成熟的团队也经常执行“准备好、开火、再瞄准”的模式。让 HCD 从业者参与冲刺计划及其配套活动——待办列表精化（backlog\
  \ refinement），非常有帮助，因为他们会提出具有启发性的问题，例如：\n\n* 团队是否对用户进行了调查，以找出他们为什么想要这个，并发现是否存在潜在需求？\n\
  * 如果团队以不同的方式解决用户的问题会发生什么？团队是否考虑了多种解决方案，并从成本、灵活性和意愿方面对其进行了评估？\n* 团队如何建立一个廉价且可以快速构建的最小可行性产品（MVP），并在进行进一步投资之前通过实际终端用户验证该解决方案是否可行？\n\
  * 团队是否确定他们提的解决方案符合产品中已有的模式，且不会误导用户？\n* 团队是否创建了解决方案的可视化，以确保产品负责人（Product Owners）和交付团队脑海中的目标真正一致？\n\
  * 团队是否识别出该解决方案使用了最佳设计实践（例如错误处理、交互反馈、清晰的视觉层次结构等）？\n* 团队是否创建了映射回用户情感或用户行为的评估计划？（很多时候，功能交付被视为成功的衡量标准，而不顾结果。）\n\
  \n### 故事生成与故事精化中的 HCD\n\nHCD 在故事精化中的典型角色类似于其在冲刺计划中的角色，但时间跨度更长，更具战略性。HCD 从业者能够在故事精化期间增加价值，恰是因为在会议期间考虑的事项至少在下一个冲刺内都不属于范围内。HCD\
  \ 从业者有时间为这些事项收集并应用见解，并在下一次冲刺计划会议之前将它们“准备就绪”。\n\n### 冲刺评审：接收增量反馈\n\n虽然有些团队利用这个机会提供有意义的反馈，但冲刺评审往往是一种仪式性的工作——即产品负责人已经同意并看到的工作正被此获胜地向更广泛的利益相关者群体推出。会查看进度图和燃烧图（burn-down\
  \ charts）。有时完全没有提到路线上的后续计划。这并不是它应该有的。\n\n冲刺评审是听取关键利益相关者对体验反馈的绝佳机会。如果鼓励他们提问或报告体验，HCD\
  \ 从业者可能会帮助引导出进一步的见解，将其纳入未来的迭代中，成为画像（persona)/场景文档的一部分，或简单地加强有助于接触用户的关系。一种“开放式”式的冲刺评审也可能建立利益相关者对所构建产品的信心，因为设计决策和权衡是可以进行协商的。\n\
  \n### 冲刺回顾：支持流程改进\n\n冲刺回顾是敏捷流程中另一个与 HCD 结合得良好的领域。\n\n## 第四部分：大型项目，不同需求\n\n## 第 8\
  \ 章：在敏捷中管理分布式设计工作\n\nDOI: `[10.4324/9781003188520-12](https://doi.org/10.4324/9781003188520-12)`\n\
  \n随着团队和项目增长到多个团队并进入规模化运营，新的需求和复杂性随之出现。项目增长的第一个自然阶段是从单团队转变为几个协作工作的小团队。如果工作被拆分使得这些团队是真正的独立的，那么扩展\
  \ HCD 规模就像是使用研究路线图（Research Roadmap）来计划和整合 HCD 活动，并对 HCD 工作进行评审评估。也就是说，当团队处理的产品互不依赖，或者依赖关系小到可以非正式处理时，他们可以继续独立工作；他们各自拥有一个产品路线图、一个记录支持\
  \ HCD 工作的研究路线图，以及适用于其工作的设计和研究标准。\n\n当团队开始在共同的产品生态系统或解决方案中工作时，他们必须更新方法。当他们遇到不同团队交付的产品和解决方案的设计一致性问题时，这一点尤为明显。在数字产品中，这通常表现为多种形式：屏幕之间的字体、图形或文案风格不一致；交互设计不同导致完成基本任务（如输入地址）有多种方式；或者反馈和错误信息的交付令人混乱。这甚至会导致用户不确定自己是否处于同一个体验中。不那么严重的不一致会导致用户质疑产品的信誉，或要求他们在学习新功能时花费额外时间。\n\
  \n在不同团队中工作的 HCD 从业者需要一种让他们的工作保持一致的方法。如果产品相关，设计选择应该反映这一点，而实现这一点的唯一方法是对这些团队进行积极协调。在实践中，这可以从允许团队根据自己的判断偏离的指导，到需要集中设计审批的更严格的治理不等。\n\
  \n\n\n\n\n当开始处理分布式设计工作时，产品团队通常会尝试先建立基础的设计标准（如果这些标准尚未建立的话）。在之前的单团队阶段，设计标准根据所需的具体化程度，通常被归纳到样式指南或模式库中，以保持一致性。在之前的阶段，这些文档的目的主要是`纵向`的，团队希望确保其未来的决策与过去的决策保持一致。此外，他们可能为了效率而开发一些产出物，例如可重用的模板，以便更快速地描述设计。\n\
  \n当组织转向分布式工作时，对维护一致性的关注就不再仅仅是`纵向`的，还涵盖了`横向`维度。一个团队做出的影响整个设计生态系统的决策，需要尽可能快地被其他设计团队同意并同化。否则，竞争性的设计方案就会出现。\n\
  \n# 产品设计的一致性\n\n`design ops` 的目标是让团队层面的`Designers` 足够的独立性和灵活性来解决他们眼前的特定问题，同时确保他们的设计符合其部署的上下文。\n\
  \n设计一致性是指设计中`所有`方面的一致性：\n\n* `视觉—`使用相同的颜色、字体和字体大小\n* `交互—`从一个用户到另一个用户的产品外观、行为和错误管理都是统一的\n\
  * `内容与语气—`整个产品组合中使用标准化的词汇和语气\n\n根据环境的不同，团队在产品设计方面可能有多个利益相关者。应该有人跟踪品牌元素的使用（如颜色、标志等），以及材料在使用上是否存在政策或法律限制。确保新设计反映了良好的产品愿景并遵守任何其他限制条件，对于交付产品至关重要。\n\
  \n## 确保跨团队一致性的工具\n\n目前的文档可能仅仅是定义性的，例如某些颜色值的使用或特定字体的指示。作为一个单团队，关于如何以及何时使用这些元素的持续讨论（例如，什么样才是对强调色的良好使用，或者不同的标题样式）虽然很重要，但可能是在产品设计和实施的流转中自然发生的。作为一个分布式团队，能够参考多个团队共同贡献并并在其中拥有利益的决策是至关重要的。\n\
  \n如果一个团队已经在使用样式指南或模式库，那么向分布式团队的转型就需要对这些文档进行演进。除了样式的`定义`（例如，不同标题在字体族和大小方面看起来什么样），文档现在还应该包含样式`指导`（例如，何时使用每个标题是合适的）。指导会与新的`Designers`进行评审，以确保他们理解了如何应用这些模式。\n\
  \n如果团队尚未开始使用样式指南和模式库，那么现在开发它们就是至关重要的。对于受益于更稳健的中心化设计的大型项目，两个新概念——代码库和设计系统提供了更高水平的细节和效率，因为前端代码被整合到集中维护的设计资源中。\n\
  \n`Code Libraries—`一组开发的代码，用于以重复的方式一致地渲染设计并促进代码复用。它们通常（但并非总是）构建在特定的前端框架之上——一个通常混合了\
  \ `HTML`、`CSS` 和 `JavaScript` 的通用代码库，创建出一致的外观和行为（示例包括 `Twitter` 开发的 `Bootstrap`，或基于\
  \ `Google` `Material Design` 的 `Material-UI`）。\n\n`Design Systems—`一种旨在将样式、模式、代码和指导（包括高级设计原则）完全聚合到一个管理且可实施系统中的工具。通过创建设计系统，团队为他们的`Designers`提供了工具，这些工具应该帮助他们分配更多时间处理设计过程中更困难的部分。在分布式团队层面，团队可能会发现创建一个早期且非常基础的设计系统是有用的。要查看一些设计系统示例，请查看\
  \ `IBM` 的 `Carbon Design System`。\n\n## 设计治理\n\n与任何标准实践一样，创建预期`Designers` 遵循的设计标准也有其优缺点。一方面，产品的外观和行为将保持一致，更紧密地反映组织对于“产品应该是什么样”的直觉。设计标准还为微观层面的决策提供了指导，例如如何处理特定的重复交互以及应用指定的视觉样式。这使得团队能够更快地生产高保真的设计。\n\
  \n另一方面，设计系统本身需要维护投入，单个团队或`Designers` 可能会觉得在能够产出的方面受到过度限制。根据团队文化和利益相关者义务的限制，团队必须确定正确的治理水平来补充他们的标准。\n\
  \n对于样式指南或模式库，没有唯一的“正确”细节程度。“正确”的细节程度是适用于所有团队的水平。然而，处理此问题的最常见方法有三方式：\n\n`自愿合规—`这种方法通常适用于小团队，它产生了标准，但允许在团队层面完全自愿合规。换句话说，`Designers`\
  \ 拥有一套可以根据意愿选择（或不选择）的工具，而关于什么是“足够好”的一性的判断发生在团队层面。这避免了治理中带来的任何额外开销的烦恼。然而，不强制的标准可能会导致更多的一致，但不是完美的一致。\n\
  \n`中心化设计评审与审批—`创建一个中心化的评审和审批流程是向创建更多一致性的下一步。设计在开发者实现 `之前` 就会对其对标准的合规性进行评审。`Designers`\
  \ 通常会提交提议的设计进行评估，作为该评估过程的一部分，将审查其是否遵循或不既定标准。\n\n`外部设计评审与审批—`如果组织要求额外的利益相关者评审设计的任何部分或文案，团队也将希望这些审批在设计被认为“准备就绪”之前完成。\n\
  \n# 协调设计活动\n\n### 协作构思\n\n\n\n\n无论团队将此视为正式仪式还是非正式活动，设计师都应该定期会面（通常为每个冲刺（sprint）一次或两次），以评审彼此正在进行中的设计。这种会议应该涵盖既处于构思阶段又处于精炼阶段的设计。该会议的目标与设计评判（design\
  \ critique）相似，但不同之处在于它是一场设计师作为伙伴对工作进行评审的 `internal`（内部）会议。\n\n在会议期间，设计师通过评审彼此的工作来确保：\n\
  \n*   能够产出高质量的设计，并解决其所在团队试图解决的问题。\n*   确保设计具有一致性，符合设计标准，并融入整体设计生态系统。\n\n### 标准的维护与更新\n\
  \n团队标准文档是“活”的文档。不要指望每位设计师都能预先了解每种风格或模式。当各个团队应对新的设计挑战时，他们会遇到现有设计模式无法提供足够支持的情况，此时团队将希望创建新的模式，而这些模式可能会影响所有团队使用的设计标准。在其他情况下，模式可能需要更新或拆分为同伴模式（peer\
  \ patterns）。每当模式需要更新或拆分为同伴模式时，团队就需要协作。每当模式需要更新或拆分为同伴模式时，团队就需要协作。每当模式需要更新或拆分为同伴模式时，团队就需要协作。每当模式需要更新或拆分为同伴模式时，团队就需要协作。每当模式需要更新或拆分为同伴模式时，团队就需要协作。每当模式需要更新或拆分为同伴模式时，团队就需要协作。每当模式需要更新或拆分为同伴模式时，团队就需要协作。每当模式需要更新或拆分为同伴模式时，团队就需要协作。每当模式需要更新或拆分为同伴模式时，团队就需要协作。每当模式需要更新或拆分为同伴模式时，团队就需要协作。每当模式需要更新或拆分为同伴模式时，团队就需要协作。每当模式需要更新或拆分为同伴模式时，团队就需要协作。每当模式需要更新或拆分为同伴模式时，团队就需要协作。每当模式需要更新或拆分为同伴模式时，团队就需要协作。每当模式需要更新或拆分为同伴模式时，团队就需要协作。每当模式需要更新或拆分为同伴模式时，团队就需要协作。每当模式需要更新或拆分为同伴模式时，团队就需要协作。每当模式需要更新或拆分为同伴模式时，团队就需要协作。每当模式需要更新或拆分为同伴模式时，团队就需要协作。每当模式需要更新或拆分为同伴模式时，团队就需要协作。每当模式需要更新或拆分为同伴模式时，团队就需要协作。每当模式需要更新或拆分为同伴模式时，团队就需要协作。每当模式需要更新或拆分为同伴模式时，团队就需要协作。每当模式需要更新或拆分为同伴模式时，团队就需要协作。每当模式需要更新或拆分为同伴模式时，团队就需要协作。每当模式需要更新或拆分为同伴模式时，团队就需要协作。每当模式需要更新或拆分为同伴模式时，团队就需要协作。每当模式需要更新或拆分为同伴模式时，团队就需要协作。每当模式需要更新或拆分为同伴模式时，团队就需要协作。每当模式需要更新或拆分为同伴模式时，团队就需要协作。每当模式需要更新或拆分为同伴模式时，团队就需要协作。每当模式需要更新或拆分为同伴模式时，团队就需要协作。每当模式需要更新或拆分为同伴模式时，团队就需要协作。每当模式需要更新或拆分为同伴模式时，团队就需要协作。每当模式需要更新或拆分为同伴模式时，团队就需要协作。每当模式需要更新或拆分为同伴模式时，团队就需要协作。每当模式需要更新或拆分为同伴模式时，团队就需要协作。每当模式需要更新或拆分为同伴模式时，团队就需要协作。每当模式需要更新或拆分为同伴模式时，团队就需要协作。每当模式需要更新或拆分为同伴模式时，团队就需要协作。每当模式需要更新或拆分为同伴模式时，团队就需要协作。每当模式需要更新或拆分为同伴模式时，团队就需要协作。每当模式需要更新或拆分为同伴模式时，团队就需要协作。每当模式需要更新或拆分为同伴模式时，团队就需要协作。\
