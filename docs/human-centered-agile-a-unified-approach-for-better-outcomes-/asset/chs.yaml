- "# 以人为本敏捷开发：更佳成果的统一方法\n\n\n\n\n\n“`Human-Centered Agile` 将以人为中心的设计（Human-Centered\
  \ Design）思维和工具整合到敏捷实践环境中。书中提供了结合这两个门学科的实用方法，并可以根据需要进行扩展。在书中，你可以预期学习到：\n\n*   一套将以人为中心的设计活动和产物与敏捷实践对的流程，从而构建出更好的产品。\n\
  *   产品生命周期工作（如评估相关者、定义问题陈述以及在用户手中评估产品）如何无缝集成到敏捷工作流中。\n*   研究路线图（Research Roadmaps）如何与产品路线图并行运行，并提供整体工作负载的清晰视图。\n\
  *   研究故事（research stories）的要素以及带有验收标准的示例故事。\n*   关于如何将以人为中心的敏捷从一个团队扩展到多个团队的技巧。\n\
  *   以人为中心的设计持续评估如何与持续部署对齐。\n*   研究路线图如何扩展并与架构跑道（Architectural Runway）协作。\n*   创建洞察库（Insight\
  \ Repository）的想法，以及将这些框架整合为单一无缝方法论的教训。\n\n这本全面的指南帮助你确定从发现和构思阶段到评估客户手中的终端产品，应该在何时做、以及做多少）！”\n\
  \nDiane Brady\n企业级敏捷教练\n\n“`Human-Centered Agile` 引入了一个迫需的话题，并就如何从最小的敏捷团队到最大的产品组合应用该概念和方法提供了实用建议。该方法解决了在意图良好的敏捷团队中可能出现的许多反模式。书中提供了我遇到过的最佳实践建议，以解决敏捷扩展过程中一个经常遇到的困扰——当开发扩展到多个敏捷团队时，你如何保持用户体验的连续性？Joe\
  \ 和 Brad 为我们其他人完成了最艰巨的工作，并弄清楚了如何将以人为中心的设计概念映射到你可能正在进行的任何类型的敏捷开发中。”\n\nDouglas Peyton\
  \ Martin\n`Project Management Hacking` 作者\n\n“准备好为你的组织提供所需的竞争优势了吗？看看 Montalbano\
  \ & Lehman 编写的 `Human-Centered Agile` 就好了。这本开创性的著作是寻求变革其敏捷方法和企业转型方式的变革领导者的终极指南。书中充满了真实的案例和可操作的策略，这本必读资源将赋能你不仅能够高效交付，还能加速整个组织的创新。无论你是高管还是组织教练，这本书对于任何想要在当今快速变化的业务环境中保持领先的人来说都是必不可少的。”\n\
  \nJorgen Hesselberg\nComparative Agility 联合创始人\n\n“`Human-Centered Agile` 是一种整合敏捷与以人为中心的设计（HCD）的整体方法，它促进了至关重要的企业敏捷性，这也是我过去十年工作的重点。敏捷和\
  \ HCD 同时运行并相互作用，为产品交付生命周期注入能量并使其聚焦，而这正是决定未来组织成功的因素。从概念上说，`Human-Centered Agile`\
  \ 简单来说就是团队同时做这两件事，持续不断释放惊人的结果。\n\n`Human-Centered Agile` (`HCA`) 是一种整合敏捷与以人为中心的设计（HCD）的整体方法，它促进了至关重要的企业敏捷性，这也就是我过去十年工作的重点。敏捷和\
  \ HCD 同时运行并相互作用，为产品交付生命周期注入能量并使其聚焦，而这正是决定未来组织成功的因素。从概念上说，`Human-Centered Agile`\
  \ 简单来说就是团队同时做这两件事，持续不断释放惊人的结果。\n\n（注：原文后续段落为重复内容，已按要求不再进行重复输出）”\n\n\n\n\n\n\n# 前言\n\
  \n专家们断言，技术的变化速度“比以往任何时候都快”，我们需要跟上步伐。\n\n确实如此。但如何做呢？\n\n一种方法是拥抱帮助我们快速高效开发软件的创新。诸如\
  \ `DevOps`、`automation` 和 `AI` 增强型开发环境，都是帮助我们更好地服务的许多创新示例之一。\n\n另一种方法是对对永恒原则的理解和欣赏，并拥抱它们。\n\
  \n这正是人为中心的设计（HCD）、敏捷软件开发和规模化敏捷框架（SAFe）整合发挥作用的地方。这些方法论结合在一起，创造了一种强大的软件开发方法，将客户置于开发过程的中心，同时促进了协作、灵活性和持续改进。\n\
  \n在书中，Joe 和 Brad 承担了这项挑战性任务，将这些方法论整合成一种凝聚的以用户为中心的软件开发方法。他们借鉴了在该领域的丰富经验，提供了实用的指导，说明如何使用人为中心的设计来识别和理解客户需求，如何实施敏捷软件开发实践以快速迭代地开发软件，以及如何使用规模化敏捷框架来有效地管理大型软件开发项目。\n\
  \n我非常欣赏这本书的一点是它对软件开发采取了整体方法。它意识到软件开发不仅是关于编写代码，还关乎理解客户需求并确保软件满足这些需求。它还意识到软件开发是一项团队运动，有效的协作和沟通对于成功至关重要。\n\
  \n无论你是软件开发人员、项目经理还是业务领导者，这本书都就如何使用人为中心的设计、敏捷软件开发和规模化敏捷框架来开发既满足客户需求又能为组织提供价值的软件提供了宝贵的见解和指导。我向向向任何人推荐这本书。\n\
