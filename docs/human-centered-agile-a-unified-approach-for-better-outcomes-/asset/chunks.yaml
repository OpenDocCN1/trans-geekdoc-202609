  trans: '


    ## 学习目标 2：识别优先的支持方式。我们将包含一个关于他们期望和/或倾向于在非工作时间与我们联系的问题。


    **方法论**：12–15 一对一访谈，预计每次时长 10 分钟或以内。


    **招募**：我们将提供小额奖励（10 美元账户额度），并向已加入研究计划的用户样本组发送招募邮件。


    **成果共享**：将有一份页或更短的回复总结，包含对当前支持预期以及偏好支持渠道/方法的分析。


    **用户故事：作为产品产品团队，我们想要验证用户是否经常遇到问题在非工作时间无法得到解决的挫败感，以便我们能以适当的方式满足他们的需求。**


    ## 学习目标 1：识别最近联系过客户支持的用户是否因为无法立即联系到我们而经历了“等待挫败感”。


    **方法论**：对过去一个月内联系过客户支持的用户进行一次简短的（不超过 3 个问题）多选择调查，并提供额外评论选项。


    我们预计会收到“两极化”的回复，且感到沮败的用户会有更强的参与意愿。在这种情况下，这并不是问题——我们将根据受访者百分比和调查接收者百分比来评估挫败感的报告。


    **招募**：我们将提供小额奖励（10 美元账户额度），并向所有在过去 30 天内联系过客户支持的用户发送调查卷进行回复。


    **成果共享**：将有一份页或更短的回复总结。


    与任何用户故事一样，研究故事应该由整个团队进行评审、完善和估算，团队可能对提供的任何细节（方法论、感兴趣的问题或信息分发方式）有疑问或额外想法。此外，团队还需决定如何捕获额外工作——例如，产出访谈大纲可能成为一个验收标准项，而实际执行访谈可能是一项任务。


    这些示例是与史诗任务（epic）相关的问题验证，但这种故事结构适用于任何研究故事，包括概念验证故事和解决方案验证故事。


    字体 功能开发前的构思与概念验证故事


    与研究故事类似，构思故事也与史诗任务相关，并先于特定解决方案的确定。构思故事的目标是生成可以相互评估的解决方案概念。在提供的示例中，如果团队验证了对额外支持的需求，则将有一个后续故事来生成提供该支持的解决方案概念。


    **用户故事：作为产品团队，我们想要生成并估算多种解决方案，以解决用户对非工作时间支持的需求，以便我们能够识别出最有前景的候选方案进行交付。**


    **AC1**：我们将进行一次工作坊风格的构思会议，目标是产出 3–5 种可行的设计。


    **AC2**：所有设计都将获得工作量的粗略估算（T 码大小）、可行性评分以及预期用户喜好度评分。


    在完成此故事后，将选择候选解决方案进行开发，或者在识别出风险（包括可行性评估和/或用户验收）时进行进一步验证。


    请注意，该团队选择在构思上进行协作，因此他们没有描述具体数量的设计，而是设定了一个目标结果。这为他们的构思过程留了灵活性。如果该团队产生了看起来很有前景的想法，并希望在投入大量的开发工作之前确保用户对他们的解决方案能够接受，那么他们可能会再为概念验证创建一个新的研究故事。


    **用户故事：作为产品团队，我们想要了解用户认为哪些拟定的非工作时间支持选项最有帮助，以便我们知道是否继续推进该解决方案。**


    **学习目标 1**：从我们的可行解决方案列表中，识别用户认为最有价值的支持渠道。


    **方法论**：这将是一项针对约 50 名用户的异步排名任务。我们将向用户展示五个候选方案方案，并要求他们按照偏好顺序进行排名。我们还会包含一个“不使用”的选项，并提供额外评论的机会。


    **招募**：我们将提供小额奖励（10 美元账户额度），并向已加入研究计划的用户样本组发送参与链接。


    **成果共享**：解决方案将按照偏好评分顺序展示。总结性文件中还将突出显示有见地的评论。


    显显然，这并不是团队可能用于学习此点的唯一方法论。对团队来说，重要的是他们有一个明确的学习目标，并且对于什么样的证据在做出后续决策时是有价值的达成共识。


    ### 与功能相关的故事


    一旦选择了解决方案并创建了功能（当然，是绑定到史诗任务上的），现在任何进一步的研究或设计故事都可以附加到该功能上，例如在发布之前进行测试的任何解决方案验证故事。


    ## 估算、规划和调度特定的 HCD 活动


    访谈需要时间。线框图需要时间。研究和设计与其他工作并无异——工作本身需要达成一致、估算并交付，就像开发工作一样。考虑到依赖关系也是重要的。


    那么，需要多长时间呢？“取决于具体情况。”这是任何 HCD 从业者在被问及工作需要多久时给出的第一个答案。设计师们因此闻名。良好的估算需要与设计师进行讨论，基于他们的特定技能、被要求解决的问题，以及他们开始时拥有的工具和资源。（事实证明设计师和开发者很像）。


    通常情况下，为了充分交付“以人为中心的敏捷”的价值，待办列表（backlogs）需要足够稳定，反映大约 3–6 个冲刺（通常为 6–12 周）的即将进行的标准工作，并留出更多前置时间处理可能需要长时间研究和设计的复杂或高风险工作。


    ### 发现工作（估算：1–4 个冲刺）


    发现工作意味着与用户交流以了解他们想要什么。如果用户就在附近且学习范围窄，这可能只需要几天时间来访谈并汇总发现。然而，如果团队


    *   拥有难以触达的受众且缺乏足够的既有信息（如果需要旅行则如此）

    *   拥有开放式的（探索性）学习目标，或更具体的问题验证目标


    那么某些发现工作可能需要多个冲刺（周或几个月）来规划和执行。


    根据学习目标，团队将估算准备、执行和分析获取必要答案所需的访谈或其他工作需要多久。


    ### 构思（估算：1 个冲刺）


