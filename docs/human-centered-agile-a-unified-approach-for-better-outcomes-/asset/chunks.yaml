    \ that work as intended but, from a holistic experience level, start to detract\
    \ by creating a feeling of “overcrowding” or eroding a product’s clear sense of\
    \ purpose. Solution satisfaction is rarely the sum of a solution’s technical capabilities,\
    \ which is important because customer satisfaction with the *overall experience*\
    \ will either lead to solution adoption and loyalty or frustration and abandonment.\n\
    \n    The product management team (Product Manager, RTE, System Architect/Engineer,\
    \ and UX Architect) should generate a plan for solution-level evaluation, which\
    \ is typically more than the sum of all the feature-level evaluations. It is key\
    \ that quantitative and qualitative evaluation go together because quantitative\
    \ measures help teams understand the “what” (since behaviors are visible at scale)\
    \ while qualitative measures, by contrast, provide a sense of how users are thinking\
    \ and why they are responding as they do.\n\n    While there is no official phase\
    \ for this in SAFe^® (all this work can comfortably live in continuous deployment),\
    \ it is worthwhile to use the concept of “continuous evaluation” to reinforce\
    \ the idea that evaluation does not only happen feature by feature when new functionality\
    \ is released, it is meant to cover the entire experience. In this way, HCD practitioners\
    \ can imagine the continuous delivery pipeline as four infinity loops instead\
    \ of three, with the fourth being continuous evaluation.\n\n    ## The Research\
    \ Roadmap and the SAFe^® Architectural Runway\n\n    Prior chapters discussed\
    \ “operations” level activity that provides scaffolding for teams to do their\
    \ own work. Whether technical operations provide the toolchains developers will\
    \ use, the design patterns, templates, and code libraries that support consistent\
    \ customer-facing products, or research recruiting support, there is a certain\
    \ amount of support work required to ensure each team avoids building their own\
    \ mini-organization from scratch.\n\n    To do this, SAFe^® uses the concept of\
    \ the previously introduced Architectural Runway, which dictates that infrastructure\
    \ and HCD research be delivered to the ART “just in time” rather than as a massive\
    \ “stand-up” effort that sometimes resembles an *organizational* version of the\
    \ old “big design up front” model that was discarded when moving to Agile. This\
    \ infrastructure work is brought into the Architectural Runway and planned normally.\
    \ The difference is that it represents *organizational* value rather than specific\
    \ *customer* value that gets consumed by teams.\n\n    As the ART develops features\
    \ within the Architectural Runway, the Architectural Runway is consumed, only\
    \ to be built up again with the next batch of enabler work. This is essentially\
    \ a rolling burn-down chart of ongoing delivery from a backlog."
