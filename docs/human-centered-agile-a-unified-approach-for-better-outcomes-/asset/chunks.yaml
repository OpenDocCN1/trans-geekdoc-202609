- raw: '> **— Kevin Wolstenholme**


    This concept is applicable to many products—is the team changing something that
    is central to the experience they are providing, and that is part of the reason
    a customer returns? A team working on an online shopping site that changes the
    checkout interaction is changing something more central to the experience than
    a team that is updating a “buy it again” reminder feature. This does not mean
    that the experience is unimportant, just that the immediate impact of the change
    to users is lower, possibly allowing for better postlaunch problem-solving. If
    the team is updating a central part of the experience, that should be a factor
    as teams evaluate the research stakes—releases that change primary experiences
    contain an elevated risk if the update isn’t useful or detracts from the experience.


    #### Reputation


    Independent of immediate costs of user acceptance of the product is the risk that
    releases that are not useful or confusing can, over time, degrade both the quality
    of the experience and the product’s (and perhaps the brand’s) reputation among
    users and potential users. When thinking about reputation as part of determining
    the stakes, teams should consider how often they are doing evaluative work in
    general, not just for a specific release.


    #### Morale Costs


    The costs of releasing a poor product that come to mind are usually the costs
    of building and supporting the software itself or building and maintaining a user
    base. However, there is an additional risk worth considering when evaluating the
    stakes of a release: team morale. Members of teams who repeatedly feel like they
    are unable to release products that deliver value tend to look for more fulfilling
    opportunities.


    ### Stakes per Life-Cycle Stage


    #### Discovery


    If teams have not uncovered their users’ needs, they risk building something that
    is simply unwanted, which can be an expensive undertaking. Additionally, if teams
    build many unwanted features, these may crowd the experience that was desired.
    More features do not always mean more success. In fact, “feature cramming” is
    a known product risk. Sometimes, not building an unnecessary feature really is
    the best decision. It also happens to be the cheapest one, mapping to the Agile
    Manifesto principle “Simplicity—the art of maximizing the amount of work not done—is
    essential.”[⁹](#fn9)


    #### Ideation and Concept Validation


    Whether emerging from ideation with competing concepts or hoping to move forward
    with one particular concept, the outcome of concept validation is a pivot-or-persevere
    decision—a team is trying to decide whether to move forward with a given solution.
    In a sense, the stakes are the cost of refining, building, and supporting the
    product. If the team has validated a problem only to latch onto the first solution
    that comes to mind or the most technically expedient solution without comparing
    alternatives, they risk generating solutions that are more complex or costly than
    necessary or are simply not as useful in solving the problem as the users want
    them to be.


    #### Solution Validation


    Solution validation can be the difference between releasing a product with major
    issues and support costs or releasing a product that performs well. Unnoticed
    issues can become costly in terms of users either rejecting the solution entirely
    or needing expensive technical support. Solution validation should not be limited
    to functional testing and technical success—a poor or confusing experience can
    be as much a problem for users as a broken piece of functionality. Testing prior
    to release mitigates the risk of going live with “red flag” issues and that users
    are disappointed or frustrated with their experience.


    #### Evaluation


    Understanding the health of the product is critical for determining and prioritizing
    future efforts. If the product is not performing well and the team is not evaluating
    it, this can have an ongoing impact on the product’s successful adoption and ongoing
    level of engagement from users, and future improvements will not be prioritized
    based on what audiences want or need. In considering the stakes of evaluation,
    teams should ask how they are determining whether their product is succeeding.


    ### Stakes per Specific Decisions


    Often, when teams first start taking on research as part of their delivery process,
    it can become tempting to frame every single design decision as something that
    requires a specific research effort. Which shade of blue? Should the call to action
    (CTA) be a circle, oval, or rounded rectangle? Should it have a 12- or 14-point
    font? Which typeface?


    Design is something that everyone has an opinion on. Often, there aren’t simple,
    objective measurements for these types of granular questions, especially during
    ideation. Teams can refer to best design practices appropriate to their solution
    and occasionally find research backing up specific design decisions, but while
    some usage patterns are observable and backed by research, teams will need to
    make many decisions using their own hypotheses and best judgments about what works
    best.


    It is possible to test granular decisions down to the micro level. There are tools
    for that kind of research, and there are definitely occasions for which testing
    granular details is warranted, but most decisions do not fall into this category
    for the vast majority of teams and products.


    Teams typically seek to answer more basic questions, such as:


    *   “Does the user notice that this button exists, or did they hunt for it?”


    *   “Did the user have clear expectations of what happens when they press these
    links or buttons?”


    *   “Can users find what they need and complete their tasks?”


    # Chapter 7Planning and Conducting HCD Activities in Agile


    DOI: [10.4324/9781003188520-10](https://doi.org/10.4324/9781003188520-10)


    There is a wide variety of HCD work that takes place before, during, and following
    development work. Since research has a runway that precedes development work,
    Product Owners and HCD practitioners must look beyond the current sprint to plan
    their work.


    This earlier life-cycle work can be difficult to keep track of and can be a particular
    challenge for teams used to thinking of only development work as “the work,” thus
    focusing on more immediate terms. Looking ahead can cause friction between the
    HCD and Agile mindsets, but it shouldn’t. This planning does not mean that teams
    become inflexible (locked into long-term commitments), but it does mean that teams
    can learn, iterate, and mitigate risks earlier and at lower cost than learning
    exclusively through building release-quality software.


    ## Using a Research Roadmap


    A Research Roadmap helps teams bridge that gap by bringing Agile values and planning
    into the context of research. For example, by incorporating a Research Roadmap,
    teams can maintain a flexibility of operations and a clear, shared understanding
    of goals while also improving their estimation of effort sizes and keeping research
    fresh and relevant to near-term work without sacrificing the value it brings.


    ![Figure 7.1 The Research Roadmap.](Images/Figure7_1.jpg)


    [Figure 7.1](#ch07.xhtml#R_15064-4445_ch007_Figure_001) The Research Roadmap.


    A Research Roadmap (see [Figure 7.1](#ch07.xhtml#_15064-4445_ch007_Figure_001))
    is similar to a product roadmap. Its goal is to give a high-level overview of
    the upcoming research efforts, including a sense of what overall learning goals
    they serve and where they fall in terms of timeline and priority. The Research
    Roadmap runs parallel to the product roadmap, since the two have interdependencies.


    Having research in a roadmap view makes it possible to look at the breadth of
    planned HCD work and prioritize it as a whole set. This also gives a team the
    ability to look at HCD work per epic and/or feature to see whether critical unknowns
    are being addressed so that the team is strategically mitigating as much product
    development risk as possible.'
