  trans: '

    UX 保证（也称为设计评审）通常是团队定义用户故事“已完成”（done）的一个正式步骤，设计师在此期间审查开发工作，以确保其符合任何约定的标准。


    ![图 4.2 开发中的 HCD 活动和产物。](img/Figure4_2.jpg)


    图 4.2 开发中的 HCD 活动和产物。


    ## 开发的设计产物


    更新样式指南或模式库——如果正在进行中的设计支持创建了新的设计模式，设计师应该更新相关文档。


    ## HCD 与解决方案验证


    在解决方案验证期间，团队确保他们正在构建的解决方案符合发布的“正确完成”（done right）标准。团队进行解决方案验证的保真度比之前的概念验证工作更高。这可能是一个更接近最终产品的的模型或原型，也可能是正在构建的实际产品。无论何种情况，团队都旨在确保用户能够理解并成功使用将交付的解决方案。解决方案验证是一项发布前的活动，这意味着研究是在产品或功能完全发布之前进行的，以便能够及时为计划的发布做出决策。


    从团队的角度来看，解决方案验证会导致两个关键结果（另参见图 4.3）：


    ![图 4.3 解决方案验证中的 HCD 活动和产物。](img/Figure4_3.jpg)


    图 4.3 解决方案验证中的 HCD 活动和产物。


    * 发布时风险降低

    * 改进发布后的工作规划和优先级


    ### 发布时风险降低


    解决方案使用真实用户测试高保真产品。通过这种方式，团队能够识别体验中的任何困惑或挫败点，并在产品接触更广泛观众之前解决任何风险信号。这降低了在问题修复期间疏远用户或产生高昂支持成本的风险。


    ### 改进发布后的工作规划和优先级


    除了发布前需要解决的“红旗”问题外，解决方案验证还可以揭示较小的问题或优化体验的机会。团队通常会开发一个“快速跟进”工作待列表，以处理不被认为是关键的已知问题。


    ### 解决方案验证的研究活动


    解决方案验证的活动与概念验证中描述的相似，包括确定团队的学习目标、招募参与者、进行研究以及分享发现。主要区别是研究使用了更高保真度的产品。最常见的解决方案验证研究是任务完成测试，尽管也可以其他测试来验证体验的特定部分。例如，团队可能会进行转述测试，以确保特定的文案提供了良好的引导或决策支持。


    ### 解决方案验证的研究产物


    与活动一样，解决方案验证的产物与概念验证的产物相似，包括用于规划的产物（测试计划和测试脚本）以及研究本身的产物（洞察和报告文档）。


    ## HCD 与评估


    在评估期间，团队确保他们构建的内容在现实世界中是有用的。团队有多种方法可以做到。除了包含之前阶段定性技术的方法（如访谈和可用性测试）外，团队现在可以观察用户在实际使用场景下操作他们的解决方案。此外，团队还可以整合定量信息收集（如分析、问卷和评分工具，如净推荐值
    NPS），以反映大规模的行为模式。


    发布后的定量和定性评估结果都会被引入后续的迭代规划和待办列表细化。通常，这些洞察会为开发产生新的功能和用户故事。


    从团队的角度来看，评估会导致三个关键结果（另参见图 4.4）：


    * 识别意外之外的问题

    * 改进的识别与优先级排序

    * 产品级的成功衡量


    ### 识别意外之外的问题


    定量和定性评估活动都是至关重要的，因为真实环境中的产品（和用户）的表现与在受控环境中验证时的预期至少会有一点点不同。


    ![图 4.4 评估中的 HCD 活动和产物。](img/Figure4_4.jpg)


    图 4.4 评估中的 HCD 活动和产物。


    ### 改进的识别与优先级排序


    除了衡量解决方案的效果如何之外，评估工作还会暴露出未满足的用户需求以及解决这些需求的想法。对于正在遇到问题甚至仅仅是体验不佳的用户来说，对产品下一步的走向提出建议是自然的。建议改进的频率和紧迫性为团队决定下一步做什么提供了极佳的第一步。


    ### 产品级的成功衡量


    HCD 从业者将功能级评估转化为整体解决方案级评估。解决方案的满意度很少是该解决方案组成部分的总和，在考虑定性和情感影响时尤为如此——这种影响一方面可能导致解决方案的采纳和忠诚，另一方面则可能导致挫败感和放弃。定量和定性评估并行是关键。定量衡量为团队提供了行为上的“什么”，而定性衡量则提供了“为什么”。


    ### 评估的研究活动


    **情境查询（Contextual inquiry）**指的是观察在自然语境下使用的解决方案。与受控环境下的可用性测试不同，这让团队更清楚地看到用户的动机和他们对产品的态度。团队还能看到用户行动的背景，包括干扰因素和并发任务等内容。


    **问卷（Surveys）**在目前几乎无处不在，为团队提供了快速从广泛用户中收集信息的机会。对于纵向反馈，它们可能特别有用，可以了解随着产品本身以及竞品环境的变化，用户态度是如何随时间演变的。


    **间接情感收集（Indirect sentiment gathering）**指的是通过远程、异步的方式来调查用户对产品或体验的感受。有一些熟悉的工具会要求用户在体验后直接进行报告。还有更先进的工具和方法，寻求从其他信息池中聚合情感，例如：


    * 帮助热线/支持工单

    * 社区讨论板

    * 社交媒体提及和活动


    间接收集情感的目标是了解人们在各种语境下对产品的看法，而不仅仅是在计划的研究活动期间。关注这种直接渠道之外的一个优势是它可以消除了任何参与偏差（参与者通常有讨好或提供帮助的愿望；而打帮助热线或在讨论板上互动的人没有）。从这些背景中收集情感可以揭示比向研究人员陈更多的担忧或问题。


    #### 数字民族学（社区浸入）


    '
