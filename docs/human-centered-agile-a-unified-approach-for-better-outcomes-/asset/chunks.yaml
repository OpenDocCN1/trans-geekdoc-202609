- raw: 'Whether teams treat this as an official ceremony or unofficial activity, Designers
    should meet periodically (once or twice a sprint is typical) to review each other’s
    in-progress designs. This meeting should cover designs that are both in the ideation
    process and in the refinement process. The goal of this meeting is similar to
    design critique but differs in that it is an *internal* meeting of Designers reviewing
    work as peers.


    During this meeting, Designers review each other’s work to ensure


    *   that high-quality designs are being produced that address the problems their
    teams are trying to solve.


    *   that designs are consistent, comply with design standards, and fit within
    the overall design ecosystem.


    ### Maintaining and Updating Standards


    Team standards documents are living documents. Don’t expect that it is possible
    for every Designer to know every style or pattern up front. As individual teams
    work on new design challenges, they run into situations in which existing design
    patterns don’t provide quite enough support and that team will want to create
    new patterns that can impact design standards used by all teams. At other times,
    patterns will need updating or splitting into peer patterns. Every so often, even
    with the most robust of standards-compliant governance processes, a team decides
    that there is an excellent reason not to use an established standard and leave
    a one-off exception in its place.


    It is impossible to deal with all these additional needs in the heat of the day-to-day
    story-level design activities that go along with supporting teams. Specific activities
    are needed to ensure they happen. Therefore, teams must reserve some portion of
    their capacity for such activities.


    ## Design Operations


    It is worth noting that management of design standards falls under the general
    umbrella of design operations (“design ops”), which is a rich topic outside the
    scope of this book. However, to ensure comprehension of the content that is within
    the scope of this book, a high-level overview follows.


    The Nielsen Norman Group[^(11)](#fn11)


    Design ops encompasses all the support and scaffolding activities surrounding
    the basic delivery of design but not as part of the design itself. For the purposes
    here, this means:


    *   Any activity that goes into the creation, maintenance, and documentation of
    standards, whether they are simple style guides, fully articulated design systems
    that require updates to code, or anything in between


    *   Any activity performed for the specific reason of ensuring standards compliance.
    This includes cross-team design reviews to help evaluate standards compliance
    or identify candidate updates (such as new patterns or system components). It
    also includes any review sessions with external stakeholders to ensure products
    are appropriate for release.


    *   Any effort spent managing the tools of design. In order to make sure designs
    can be worked on collaboratively across teams, it is important that teams use
    the same tool stack, including whatever tools are being used to generate design,
    share out design, and manage version control.


    *   Any effort spent creating and managing the processes that Designers use, such
    as design charters and cross-team creative reviews or design critiques


    *   Any effort spent on recruiting, onboarding, and offboarding Designers


    When creating a design organization, these subjects are important. This book is
    interested in integrating program-level activities at the right point but will
    not be covering the full scope of design ops. For an excellent introduction to
    the topic, see *Org Design for Design Orgs* by Peter Merholz and Kristin Skinner.[^(12)](#fn12)


    # Chapter 9Managing Distributed Research Efforts in Agile


    DOI: [10.4324/9781003188520-13](https://doi.org/10.4324/9781003188520-13)


    Just as Designers working on different teams need a way for their work to be consistent
    with one another, researchers also need coordination to avoid redundant work and
    ensure their work brings maximum value.


    While design is about ensuring consistency, research coordination is about providing
    a better view of upcoming efforts for planning and prioritization, creating standards
    and templates to make individual research activities more consistent and efficient,
    centralizing specific support activities such as recruiting, and sharing value
    from captured insights for use across teams and efforts.


    ## Outgrowing Ad Hoc Research


    When working as a single and fully independent Agile team, it is straightforward
    to plan and conduct research needed for their own operations. Any insights live
    within that one team, either in formal capture documents (personas and journey
    maps) or in an informal collective shared understanding.


    In a sense, a single team’s research efforts can be thought of as a *bespoke*
    approach. The research is designed to meet the team’s individual needs and serve
    them in their decision-making on a case-by-case basis. Findings may also become
    part of their foundational shared understanding of their users or vision, as the
    team plans, conducts, synthesizes, and shares their work. By contrast, in a distributed
    environment, research is conducted by one team that may be valuable to other teams
    with interest in similar users or use cases.


    Teams may be able to maintain this research approach after work is distributed
    across teams, if


    *   the amount of research happening is already “right sized” to the team (i.e.,
    there aren’t idle researchers or more work than those researchers can handle).


    *   the teams’ research domains are independent enough that their exploratory
    research and solution validation insights would not be valuable to each other.


    *   the teams’ participant pools are independent of one another, and teams can
    be sure not to accidentally overtax participants.


    Conversely, teams will find a need to coordinate research activities when gaining
    insights that should be shared across efforts, experiencing resource challenges
    in prioritizing or conducting research, or sharing a common participant pool.


    At the point where research needs to be coordinated across multiple teams, several
    efforts must be initiated, including:


    *   Coordinated research efforts, including recruiting and shared tools and templates


    *   A learning strategy


    *   A Research Roadmap


    *   An insights repository


    ## Coordinated Research Efforts


    Just as design ops encompasses all the support and scaffolding activities surrounding
    the basic delivery of design, research operations (research ops) involve the tools
    and processes needed by researchers to conduct their research. As the number of
    practitioners and teams grows, teams require processes that support multiple people
    doing coordinated work.


    ### Coordinated Recruitment and Messaging


    As participant recruitment is managed, it is important that teams are consistent
    in the language they use to interact with users and their frequency of contact.
    This maintains the credibility of the organization and preserves user willingness
    to participate.


    #### Recruiting a Common Participant Pool


    If teams need the same participants, it does not make sense to have fully independent
    recruitment efforts. A larger pool of participants from which users are drawn
    is better than two separate, smaller pools. Additionally, a common pool lessens
    the burden (per team) of generating their own participants while avoiding the
    potential for the same candidate participant to be contacted with an initial outreach
    campaign more than once.


