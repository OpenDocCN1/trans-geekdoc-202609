  trans: '

    作为一套步骤和实践，构建一套“以人为中心的敏捷实践”听起来可能既复杂又令人生畏。但它并不非得是如此；它是一个从几个基本原则和实践建立起来的迭代过程。


    为了说明这一点，我们将使用一家名为 `DIY Fly` 的虚拟公司以及他们（刻意为之）非软件产品作为示例。我们出版社的律师要求我们声明，本书中提到的任何人物、公司或产品与实际人物、公司或产品之间的任何相似之处均非本意。（这恰恰具有真实的优点。）


    # 人与想法


    William 小时候就喜欢制作模型飞机。他从基础的纸飞机开始，然后转向轻木制滑翔机，随着年龄增长，进化到了简单的遥控模型。大学毕业后，他在一家大型软件公司从事营销工作，但在业余时间里，模型飞机依然是他的爱好。多年来，他设计了许多日益复杂的模型，并且在材料使用上极具创造力，利用能找到的任何材料来加固飞机，同时仍让它们保持在空中——纸盒、庭院告示牌以及（最有创意的）电子屏幕保护塑料，这种塑料既薄又结实，足以保护他最轻的纸质模型而不会对飞行产生太大干扰。


    Tom 是受过空军训练的飞行员，退伍后在一家航空货运公司担任经理。和 William 一样，他童年的大部分时间都在制作飞行模型飞机，并将这一爱好带到了成年。作为一名持证飞行员，Tom
    倾向于选择那些昂贵且复杂的遥控模型，这些模型拥有先进的电子系统、高科技充电电池和其他高级功能。Tom 更像是一个带摄像头的无人机玩家，但也喜欢自己制作和定制自己的飞行模型。


    两人在当地的爱好商店相遇。William 是为了为他最新的设计购买一个小橡皮筋驱动螺旋桨，当 Tom 听到他与店员的对话时，他走上前来自我介绍。两人讨论了
    William 用纸张和薄塑料片制作滑翔机的实验，以及他希望通过增加螺旋桨来延长飞行时间的想法。Tom 当正要去当地飞行模型俱乐部的机场试飞他的大遥控模型，于是他建议
    William 加入他们，友谊就此产生。


    Tom 对 William 仅用纸张和薄塑料就开发的各种“扁直”设计留下了深刻印象，并想进一步了解。在几个周末里，Tom 与 William 一起努力，利用他在空气动力学方面的知识帮助设计新模型。他们在机翼上增加了上仰角（或“倾角”），在水平稳定器上增加了升降舵以延长飞行，最后增加了一个垂直稳定器，这极大地提升了飞行性能。


    # 第一年


    在初期，他们会制作各种模型飞机，然后带着家属（如侄女和侄子）出去一起测试飞行。事实证明，这是享受户外时光的一种极佳方式，同时也为远离电脑屏幕提供了一个受欢迎的休息机会。最终，观众扩大到了他们的朋友，并很快包括了朋友的朋友们。Tom
    和 William 本并没有打算在爱好上花费这么多时间，但他们的玩具变得越来越受欢迎。作为爱好者，他们将自己和朋友用作即时发现和概念验证的受试者。不久后，有人建议
    Tom 和 William 创办一个众筹的创业项目，两人同意尝试一下这一想法。众筹将作为问题验证和概念验证的第二个阶段。


    合伙人决定制造并销售 William 在两人相遇时一直在制作的那种塑料滑翔机的高级版本。他们获取原材料相当容易，尽管由于数量较小导致单位成本比他们预期的（或希望的）要高。他们很容易获得了纸板箱来包装完产品，当地的快打印店也非常乐意帮助他们设计标签和说明书。他们面临的大问题仍然找到切割塑料的方法。他们需要工业级的模切资源，而找到一个能够挤进他们较小生产规模的资源比预想的要困难。在这个阶段，他们仍然根据产品性能来衡量成功，而不是根据他们的产品对客户产生。


    在克服了在“空闲”时间里建立小型制造业务的初期起伏和停顿后，他们对第一批产品的销售情况感到非常满意。当小型爱好店开始表现出零售兴趣时，他们感到很惊讶。


    他们想知道如何交付订单，主要担心他们突然需要大量原材料的采购问题。这项企业从一种消遣迅速成长为半职业。他们建立了法律合伙关系，并开通了信贷额度来支付费用。然后，他们安排了供应商，并将以前的随机性过程进行了标准化。很快，他们发现自己需要额外的帮助，并雇用了一名全职员工。接着，他们又雇佣了一个。不久后，他们就有六个人为他们工作了。尽管如此，收入还不足以辞去工作，但很明显，这不再仅仅是一个爱好了。他们现在有一有一产品、稳定但小规模收入流以及一个基础构思和完善流程的公司，这个流程仅涉及制造他们喜欢的东西并自己进行测试。他们在观察人们飞飞机时收集反馈，但他们的设计修改完全基于自己对什么才算成功的想法。这太棒了！


    # 新产品


    对最初的成功以及创造了一个充满活力的小企业的实感到兴奋，William 和 Tom 开始梦想更宏大的目标，思考需要什么才能将这变成一家“真正的”业务，以便辞去“朝”工作。


    他们开发了基础的产品组合：一个全组装塑料滑翔机、一个发射滑翔机的弹弓，以及一个带有橡皮筋驱动螺旋桨的全组装塑料飞机。每一个新产品都是原型的改进，并借鉴了 Tom
    和 William 的经验。这些迭代产品的飞行性能确实更好。


    # 与用户互动


