    \n*   agile, *see also*, [human-centered agile](#index.xhtml#IN0013); [human-centered\
    \ design (HCD) brought into agile](#index.xhtml#IN0132); [human centered design\
    \ (HCD) activities in agile (planning and conducting)](#index.xhtml#IN0014) \n\
    \n    *   agile at scale, updating team roles for, [178–180](#ch13.xhtml#p178_a)\n\
    \n    *   agile framework for decomposing and estimating design concepts, [107–109](#ch07.xhtml#p107_a)\
