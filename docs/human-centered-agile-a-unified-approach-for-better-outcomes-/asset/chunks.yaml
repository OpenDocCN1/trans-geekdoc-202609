    尽管参与热情很高，参与研究可能成为一种产生焦虑、疲惫的体验。由于任何原因导致参与人池较小（例如，产品有特定的用户群体，或团队的覆盖范围仍然较小），团队将确保不会过度消耗他们提供实质性贡献的能力。频繁联系同一批人的团队可能会导致参与率的急剧下降（类似于“调查疲劳”）。


    ## 统一的声音 (Common Voice)


    与其他任何通信渠道一样，与研究参与者的沟通应该感觉像来自同一个组织，而不是不同的个人。这意味着：


    * 发出的邀请函听起来彼此相似。

    * 拥有通用的沟通节奏——提醒、跟进沟通等的频率和时间。

    * 确保任何规则和标准都得到了良好的解释，无论哪个团队或哪项工作。


    ## 通用标准与预期 (Common Standards and Expectations)


    清晰定义实践和程序至关重要，例如参与激励、收集的数据管理以及参与者隐私。参与者应该清楚地了解他们的承诺是什么。除了让重复参与的者感到熟悉外，还必须考虑这些因素。这就是为什么确认标准和指南已到位并得到遵循至关重要。


    ## 工具与模板 (Tools and Templates)


    有许多研究流程和产物需要协调，以在不同工作之间保持一致。在招募产物方面尤其如此，例如：


    * 政策

    * 参与流程

    * 通信模板

    * 研究计划

    * 脚本

    * 进行研究的工具

    * 综合分析 (Synthesis)

    * 成果分享 (Share outs)


    ### 政策 (Policies)


    政策包括关于是否录制会议以及这些录像将如何处理、如何处理客户隐私、参与激励政策，以及是否以及何时需要任何类型的保密协议（NDA）或业务保护。


    ## 参与流程 (Engagement Process)


    无论研究请求是来自领导层（例如“探索与创新”工作），还是来自为了验证或评估解决方案的团队，关键利益相关者都需要了解研究过程在开展和汇总研究方面所需的时间和精力预期，以便做出相应计划。如果对研究流程缺乏清晰且共享的理解，团队将面临不切实际的交付周期或不符合实际学习目标的研究请求。


    ## 通信模板 (Communications Templates)


    团队还应该拥有用于与参与者沟通的标准模板。模板可以确保必要信息得到清晰且一致的传递。模板还确保了组织的统一声音，这对于信任和信誉至关重要。除了面向参与者的沟通外，团队可能还需要创建用于处理利益相关者关系的脚本和模板，以确保通过包含与他们特定的相关的细节，一致地满足这些利益相关者的信息需求。


    ## 研究计划 (Research Plans)


    研究计划确定了研究的目的和范围，并使个人研究工作保持正轨。它应该识别研究的学习目标，以及方法、里程碑和时间表。它还应该包括展示结果的观众和交付物。


    ## 脚本 (Scripts)


    在进行特定测试时，团队应保持参与者体验的一致性——其目的是让每个参与者对发生的情况有相同的理解，并对相同的问题和提示做出反应。随着研究严谨性的增加，这一点尤为真实——在发现阶段进行的探索性访谈可能从相同的初始提示开始，但为访谈者决定如何跟进留下了大量空间；而在验证/评估工作中，用户应被赋予相同的任务。此外，每个参与者在开始时应该知道引导性信息，例如参与将花费多长时间、包含什么，以及如果出于任何原因如何结束会议。脚本确保了所有这些都得到了适当的沟通。


    ## 进行研究和汇总发现的工具 (Tools for Conducting Research and Synthesizing Findings)


    虽然研究方法的复杂性可能存在巨大差异——从仅涉及访谈脚本和纸质原型的用户会议，到观察人们与完全开发的产品交互——但独立工作的团队将从使用相同的工具中获益。例如，所有参与异步远程测试的团队应该使用相同的工具。同样，无论汇总研究的过程如何，所使用的平台或工具在组织内部应该是通用的。


    ## 成果分享 (Share-Outs)


    研究人员应该有一个既定的流程，与其团队分享收集到的任何洞察。开发和使用记录这些洞察的产物模板是重要的，还要确保在过程中有涉及适当利益相关者的演示和会议。


    ## 洞察库 (An Insight Repository)


    洞察库的目标是以一种方式捕捉发现，使其跨团队、跨时间可访问且易于消费。洞察库与成果分享略有不同，因为它旨在为执行工作的团队提供可探索性和信息丰富的内容。


    ### “洞察”是洞察库的原子单元 (An “Insight” is the Atomic Unit of the Insight Repository)


    洞察是关于（所有或特定）用户的态度、行为或期望的基于研究支持的主张。对于库来说，HCD 实践者想要提取研究中展示的任何洞察，并将它们作为经过某种测试的主张提出。这并不是说研究库将不包含基础数据或完整报告，而是说团队主要寻找洞察本身（而不是需要检查的长篇报告），这就是之所以这样组织的原因。


    洞察库的建立需要完成三件事：


    1. 利益相关者第一眼就能看到关键信息。除了洞察本身，还应该包括有关研究的细节，如日期、方法和相关背景，以及产生洞察的产品以及研究试图回答的问题。这不是详尽列表。某些团队可能会发现他们正在进行针对特定人物或旅程中特定时刻定制的研究。任何与组织搜索洞察相关的维度都将放在这里。

    2. 利益相关者可以找到与洞察相关的生成的报告。无论这些报告包含在洞察库中还是其他地方，对于想要更完整了解研究如何进行以及得出结论的利益相关者来说，这些信息应该是可用的。

    3. 将洞察库与学习策略连接。洞察库通过两种关键方式与学习策略连接。第一点显而易见——如果团队的策略缺乏基础信息，他们可能会发现一个组织良好的库可以提供必要的澄清。第二点是学习策略应该指导洞察库的内容组织，从而在决定需要学习什么、何时以及如何学习，以及如何捕捉时有一个全局方法。


    '
