    \ of Scrum (and a fine reference book), this is the only book needed on the subject.\
    \ Ken Rubin has even developed a visual lexicon to describe Scrum events and artifacts.\
    \ This book is thorough and highly recommended.\n\n*   *****Scrum: The Art of\
    \ Doing Twice the Work in Half the Time*** by Jeff Sutherland and J.J. Sutherland**—This\
    \ is a very light read that is better at acquainting readers with the broad strokes\
    \ of the Agile mindset than it is with the actual mechanics of Scrum. It is invaluable,\
    \ nonetheless.\n\n*   *****User Stories Applied*** by Mike Cohn**—User stories\
    \ are the area where Agile teams struggle the most. This is the definitive book\
    \ on the subject by one of the most respected authors in the field.\n\n*   *****Agile\
    \ Estimating and Planning*** by Mike Cohn**—An outstanding book for Product Owners,\
    \ Product Managers, or anyone else who finds themselves accountable for schedules\
    \ on an Agile project.\n\n*   *****Innovation Games: Creating Breakthrough Products\
    \ Through Collaborative Play*** by Luke Hohmann**—This is for practitioners, especially\
    \ Agilists, who are having difficulty engaging with users. The book, written by\
    \ a recognized Agile expert, is filled with exercises that help teams understand\
    \ their users’ true needs.\n\n*   *****Kanban*** by David J. Anderson**—Kanban\
    \ is an underutilized, iteration-less Agile framework better suited to many teams\
    \ than Scrum. This book will equip practitioners to use Kanban to do more than\
    \ visualize work. It is highly recommended.\n\n*   *****SAFe^(*®*) Distilled***\
    \ by Richard Knaster and Dean Leffingwell**—This is an excellent introduction\
    \ to SAFe, with many descriptive, full-color illustrations, and is highly recommended\
    \ for practitioners new to SAFe. Care should be taken to get the most recent version\
    \ of this book, as the SAFe model is updated frequently.\n\n*   **SAFe^(*®*) Training**—Practitioners\
    \ seeking to implement SAFe are strongly encouraged to take instructor-led training\
    \ (either in person or virtually). There are no less than 12 different role-based\
    \ SAFe certifications to choose from. The list and a calendar of classes can be\
    \ found at this URL: [https://scaledagile.com/safe-certification/](https://scaledagile.com).\
    \ For more information visit: [www.scaledagileframework.com/](http://www.scaledagileframework.com).\n\
    \n*   *****Team Topologies: Organizing Business and Technology Teams for Fast\
    \ Flow*** by Matthew Skelton and Manuel Pais**—For those seeking a deep dive into\
    \ how to form teams for the optimal flow of value, this is the book. It is not\
    \ light reading and goes into considerable detail.\n\n*   *****Project to Product:\
    \ How to Survive and Thrive in the Age of Digital Disruption*** by Mik Kirsten**—Practitioners\
    \ seeking to take their Agile knowledge to the next level will benefit from this\
    \ book and the “flow framework” that it introduces.\n\n*   *****Continuous Discovery\
    \ Habits: Discover Products That Create Customer Value and Business Value*** by\
    \ Theresa Torres**—Agile teams seeking to get better at engaging with users, building\
    \ an insight repository, and using this data to make their products better are\
    \ encouraged to read this book.\n\n*   *****When Will It Be Done: Lean-Agile Forecasting\
    \ to Answer Your Customers’ Most Important Question*** by Daniel S. Vacanti**—This\
    \ trailblazing book has changed many minds about the effectiveness of estimating\
    \ with story points and has helped many teams make the shift to statistical forecasting\
    \ using historical data. For those struggling with estimates, this book is must-read.\n\
    \n*   *****Coaching Agile Teams: A Companion for Scrum Masters, Agile Coaches,\
    \ and Project Managers in Transition*** by Lyssa Adkins**—This is the gold standard\
    \ in Agile coaching texts.\n\n*   *****Drive*** by Dan Pink**—This book is less\
    \ about Agile and more about creating environments that motivate knowledge workers\
    \ and nurture creativity. It is highly recommended.\n\n### ***Book Recommendations\
    \ from the Designer***\n\n*   *****Radical Focus: Achieving Your Most Important\
    \ Goals with Objectives and Key Results (Empowered Teams)*** by Christina Wodtke**—A\
    \ fictionalized account of a team applying OKRs, this book is easy to read, and\
    \ grounds the OKR approach in relatable practice.\n\n*   *****Communicating Design***\
    \ by Dan Brown**—A much deeper dive into design deliverables and how to create\
    \ and present them for effective communication at any stage of the design process.\n\
    \n*   *****Just Enough Research*** by Erika Hall**—A terrific primer on a delivery-minded\
    \ approach to trusted research methods that can be implemented right away, no\
    \ matter what size team or budget being worked with.\n\n*   *****The Design of\
    \ Everyday Things*** by Donald Norman**—One of the earliest and still most entertaining\
    \ texts about how design creates successful and unsuccessful experiences. He has\
    \ also written two excellent follow-up books: *The Design of Future Things* and\
    \ *Emotional Design: Why We Love (or Hate) Everyday Things*.\n\n*   *****Don’t\
    \ Make Me Think*** by Steve Krug**—An approachable (and even fun!) introduction\
    \ to key concepts of usability and intuitive information design.\n\n*   *****Designing\
    \ Connected Content*** by Mike Atherton and Carrie Hane**—Content is design. Content\
    \ is usability. Content is experience. This book is an end-to-end process for\
    \ building a structured content framework.\n\n*   *****The User Experience Team\
    \ of One: A Research and Design Survival Guide*** by Leah Buley**—A practical\
    \ guide for HCD practitioners, and an excellent survey for Agilists and Product\
    \ Owners of what it takes for an individual to work as the only practitioner on\
    \ a team.\n\n*   *****Outcomes Over Output: Why Customer Behavior Is the Key Metric\
    \ for Business Success*** by Jeff Seiden**—A concise yet powerful book on how\
    \ to shift in thinking from the endless delivery of features and functionality\
    \ to the delivery of actual, measurable user value.\n\n*   *****How Music Works***\
    \ by David Byrne**—Not a “professional book” or a book about HCD, David Byrne\
    \ nonetheless writes a fascinating account of how every aspect of the creation\
    \ of music—from the type of performance environment the music will be performed\
    \ into the incentive structure for creating it—becomes part of the listener and\
    \ audience experience.\n\n*   *****Lean UX: Designing Great Products with Agile\
    \ Teams*** by Jeff Gothelf**—A valuable book for understanding how UX can fit\
    \ into strategic decision-making and a practical approach for getting started\
    \ with strategic experimentation.\n\n*   ***Accessibility for Everyone*** **by\
    \ Laura Kalbag**—A practical approach to ensuring that designs and products can\
    \ be successful for as many people as possible.\n\n### ***Need More Help? Just\
    \ Want to Say Hi?***\n\nFor those struggling with implementing the ideas in this\
    \ book or wanting to share the results of their work, reach out to the authors\
