    调查问卷有几个需要注意的关键限制。对于希望跨时间或跨小组比较调查结果的团队来说，保持标准化的问题并在所有调查中使用一致的衡量方法是非常重要的（即团队之间使用相同的衡量量表，并以相同的方式获取情感）。此外，由于调查问卷对清晰度和语气非常敏感，它们应该遵循适用于团队其他产品的相同内容指南。最后，调查问卷在被测量的体验结束后立即完成（或尽可能在结束后立即完成）时最为准确。


    除了内容之外，考虑给用户提供多少问题以及完成问卷需要多长时间也很重要。时间较长的问卷通常返回的结果较少，而且并非所有类型的问题问都需要相同的时间来完成。


    ### 其他定性评估方法


    访谈、情境探究（contextual inquiry）甚至异步可用性测试在之前在发现或验证的背景下都已描述过。对于已经发布的产品的评估过程，这些方法同样具有价值。团队可能还计划了远程情感分析或数字民族志，以获得对对产品态度的定性理解。评估工作需要与项目其他阶段相同类型的规划。


    ### 指标框架


    对于那些难以识别解决方案或功能的“北极星”（True North）和信号指标的团队，以下框架可能提供一个很好的起点。每个框架都关注用户体验的不同方面，并提供了一个结构，用于思考在审视指标时需要回答哪些类型的问题。


    ### Google HEART 框架


    Google HEART 指标框架。


    值得的是，这个框架以及专门对参与度（engagement）的关注往往适用于某些类型的产品，例如那些通过持续使用获得业务成果的产品。当然，也有一些产品（如汽车保险），它们通过在用户生活中留下尽可能*轻*而不是最重的负担来让用户感到快乐。


    ### 海盗指标


    “海盗指标”（Pirate metrics）是一些从业者可能会听到的另一个术语，特别是针对数字产品。这个名字来自于缩写 `AARRR`，它代表获取（acquisition）、激活（activation）、留存（retention）、推荐（referrals）和收入（revenue）。海盗指标很有趣，因为团队喜欢像海盗一样大喊
    `AARRR!`。（试试看。）它们对于为数字产品的利益者提供一组“全方位”指标也很有，可以向他们展示产品性能的整体状况。


    表 15.1 受 CleverTap 的 Emily Bonnie 工作启发的 Google HEART 指标示例


    | | 目标 (Goal) | 信号 (Signal) | 指标 (Metric) |

    | :--- | :--- | :--- | :--- |

    | **幸福度 (Happiness)** | 应用、解决方案或产品是否易用、有用、直观且有趣？ | 积极反馈；良好的评价 | `NPS` 或 `SUS`；应用/产品评分；积极的调查或评价结果
    |

    | **参与度 (Engagement)** | 用户是否喜欢使用该应用程序？他们是否计划继续使用它？ | 应用或产品使用量增加；经常回来；参与在线论坛和/或订阅邮件
    | 在应用或解决方案中花费的时间；社交媒体上的提及；应用内的点击次数 |

    | **采纳 (Adoption)** | 用户是否看到了产品或解决方案的价值？新用户是否正在采用它，并优于替代解决方案？ | 购买应用程序、产品或解决方案；在新功能开发时使用新功能
    | 新订阅；推荐订阅 |

    | **留存 (Retention)** | 用户是否经常返回该应用程序或解决方案？ | 续订会员或订阅；推荐朋友；不切换到竞争解决方案 | 高级订阅升级；重复订阅；付费用户数量
    |

    | **任务成功 (Task Success)** | 用户是否能够轻松高效地完成他们的预定任务？ | 完成的任务；缺乏错误；无需重做 | 任务放弃率；错误率；每个任务耗时
    |


    对这些每个类别的探索顺序如下：


    -   **获取 (Acquisition)**——这组指标捕捉了用户如何进入网站。他们是来自 `SEO` 和搜索引擎、在线广告、邮件邀请、公共关系等吗？利益者通常对影响最大的获取渠道感兴趣，即那些低成本/高流量的渠道。

    -   **激活 (Activation)**——这意味着给用户提供良好的产品初体验，使他们对它感到兴奋并投入其中。在这里，团队通常会衡量一些事宜，如页面停留时间、页面点击以及任何其他衡量用户与产品或网站交互程度的指标。他们的访问体验得好吗？他们他们在访问期间购买了溢值服务吗？他们使用了多少功能？

    -   **留存 (Retention)**——这组指标衡量了用户返回使用产品或网站的频率，通常是在 30 天内。这种指标有时可以通过通过在正确的时间进行正确的跟进沟通来提高。例如，通过自动邮件告知新用户其他功能或特别优惠。这些邮件的指标可能会捕捉接收者中点击链接跳转到网站的百分比。

    -   **推荐 (Referrals)**——这是一组关于理解哪些用户推荐其他用户注册的指标。如果用户对产品足够满意并愿意推荐朋友，那么他们处于一个良好的状态，可以激励这种行为并启动病毒式营销活动。

    -   **收入 (Revenue)**——这组指标帮助利益者理解用户从产品中获得的价值，以及产品产生收入的位置。通常，产品所有者（Product Owners）想要知道需要多少收入才能收支平衡，以及多少才能让老板满意。团队经常根据最近发布或更改的功能来衡量收入波动。


    尽管指标非常有用，但团队的一个常见模式是使用的指标*过多*。正如生活中的许多事情一样，少即是多。不要试图将产品性能的所有复杂性和细微差别过度简化为一或两个狭窄的指标。同时，避免使用应用程序管理工具建议的所有指标的诱惑。团队需要追踪几十个指标指标的情况非常罕见。


    ### 目标与关键结果


    目标和关键结果 (`OKRs`) 最近已成为敏捷领域的热点话题。甚至有了 OKR 认证。OKRs 与敏捷开发非常契合，因为两者都将大型工作单元拆分为较小的单元，并关注结果。目标是更大的、宏性的目标或结果，而敏捷特别是以人为中心的敏捷开发是关注结果的。关键结果是有助于实现大目标或目标的较小结果。


    '
