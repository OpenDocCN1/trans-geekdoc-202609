    For example, a team may wish to do the equivalent of a usability “smoke test”
    that shows users a new feature to ensure they understand its purpose and can do
    basic task completion. This is different from “functional testing” in that the
    user is provided a task but not the scripted set of actions to complete it. This
    highlights navigational concerns or gaps, especially when every function is working
    properly, but users get stuck on determining the correct path forward. Thisthis
    kind of task might inform a “go/no-go” decision and be relatively fast to conduct.
    The learning objective is simply to be reassured that users will not flood the
    product support team with confused questions.


    Alternatively, a team may wish to learn more comprehensively about how users experience
    a complex process, the resulting emotion (frustration or delight), or specific
    steps, interactions, pieces of language, or supporting features that would improve
    an experience. Diving deeper into additional questions and more involved behavior
    paths takes longer in setup, implementation, and analysis.


    ## Evaluation (Estimate: 1–2 Sprints)


    ![](Images/pg111a.jpg)


    Evaluation is an essential aspect of Human-Centered Agile because, without measuring
    releases, it will be nearly impossible to determine whether the solution being
    created achieves the intended outcomes. Human-Centered Agile means evaluating
    products and bringing insights back into the overall product strategy so that
    teams can make good choices about how to invest their efforts in generating the
    desired outcomes.


    Evaluation takes the same kind of planning and preparation as other research work.
    Whatever teams do to measure success (hopefully defined earlier in the process)
    will take work, which needs to be planned as well. The key difference here is
    that some planning for evaluation work can be done during the time that development
    is taking place, but because evaluation will not take place until after a release,
    some planning will have to wait. For example, recruiting should only take place
    after release is certain, and test scripts must reflect the final released product.


    # Using Estimates to Plan HCD Work


    As with any Agile work, that estimation and planning come from the team and are
    revalidated and tracked as the team measures the team output and outcomes of the
    work itself. Any discovery, ideation, and concept or solution validation efforts
    must take place in advance of a release, sometimes several sprints ahead, so the
    results can be successfully incorporated by the development team. The order of
    the steps matters. Teams in usability testing don’t want to discover that they
    are solving the wrong problem or have the wrong kind of solution altogether, especially
    after putting in substantial work to deliver a product. They may learn exactly
    that if they have not done discovery or ideation work and are only doing validation
    via usability testing just prior to release, for example.


    ### Consider Additional Dependent Workflows

