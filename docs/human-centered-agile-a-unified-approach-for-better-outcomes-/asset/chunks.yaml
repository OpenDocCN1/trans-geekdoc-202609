- raw: 'While some practitioners feel strongly about one term over the other, operationally
    there is no important distinction. During various phases of the process, teams
    interact with the people that use (or might use) their products to elicit their
    needs and desires and validate their solutions. “User experience” is a catchall
    term for all the parts of the design that impact how a user feels about it and
    that, when applied, may or may not incorporate user feedback at critical points.


    # Chapter 3HCD Activities and Artifacts from Discovery through Concept Validation


    DOI: [10.4324/9781003188520-5](https://doi.org/10.4324/9781003188520-5)


    ![](Images/pg27.jpg)


    Each phase of Human-Centered Design (HCD) provides specific team-focused benefits
    (see [Figure 3.1](#ch03.xhtml#_15064-4445_ch003_Figure_001)). It helps to understand
    the types of activities that occur in each phase and the specific purpose they
    serve so that practitioners can strategically integrate these activities into
    Agile delivery.


    This chapter does not (and could not!) provide an exhaustive list of possible
    research techniques that can be employed in order to understand user attitudes
    and behaviors. These examples provide a starting point for understanding the activities
    that happen at each step, using some of the most common approaches.


    The activities described here are geared toward the earliest phases of HCD, which
    are designed to make sure that teams are actually addressing user needs (right
    problem) in a useful way (right solution). These activities should lead teams
    to a pivot-or-persevere decision, paving the way to confidently move into delivery.


    ![Figure 3.1 HCD activities and artifacts of discovery.](Images/Figure3_1.jpg)


    [Figure 3.1](#ch03.xhtml#R_15064-4445_ch003_Figure_001) HCD activities and artifacts
    of discovery.


    ## HCD and Discovery


    During discovery, there are specific efforts that build an understanding of how
    the product is situated within the user’s life and the context of usage, as well
    as what the user’s attitude is toward the product and/or similar products. This
    research may be specific to an existing product already in use, allowing for observation
    of the behaviors around it, or it may be an understanding of the context and attitudes
    that inform how a user will react to a new product.


    Either way, the goal is to understand whether people might value a specific product
    or feature and why, then learn how the team might increase that value. This is
    done before work is committed, because users can surprise even the most involved
    product teams.


    From a team delivery standpoint, the discovery effort leads to a few key outcomes
    (see also [Figure 3.1](#ch03.xhtml#_15064-4445_ch003_Figure_001)):


    *   A clear problem definition


    *   Problems have been validated by users


    *   Team alignment on sprint and release goals


    *   Product Owner confidence


    ### A Clear Problem Definition


    The team gains confidence in their ability to build a valuable solution through
    their discovery activities. Through these activities, they come to understand
    their users and develop ideas about what is wanted and needed and, specifically,
    how the team can provide a valuable solution. Without good problem definition,
    roadmaps tend to get set by whim, shiny objects, or hopeful guesses about what
    will make users find value. “If you build it, they will come” is a myth. Unlike
    the movie *Field of Dreams*, users rarely come just because products or features
    are built. A good problem definition also allows teams to develop outcome-based
    success criteria so that teams understand whether they have built a successful
    solution.


    #### Problems Have Been Validated by Users


    Once the team has an idea of what problems need to be solved for their users,
    they may take a step toward validating what they have learned. This validation
    builds confidence that their work will have value. This is typical when insights
    come indirectly, such as through some form of sentiment gathering or support ticket
    analytics.


    #### Team Alignment on Sprint and Release Goals


    It is hard to overstate how much value there is in clear, agreed-on overall goals
    and problem definitions. Being able to refer back to the core purpose of a release
    is valuable throughout refinement and delivery activities because, once the team
    is in the weeds of delivering specific functionality, it is easy to lose sight
    of the purpose.


    #### Product Owner Confidence


    Shifting from “hopeful guessing” to user-validated problems results in teams having
    increased confidence that their work will make a difference.


    ### ***Discovery Research Activities***


    The purpose of user research during discovery is to ensure that teams have an
    understanding of who their users are and what attitudes and expectations exist
    about the product and/or similar products—and gain a clear understanding of what
    Tony Ulwick and Clayton Christensen coined the “jobs to be done”[⁶](#fn6)


    The most common discovery research activities are:


    *   Field observation/contextual inquiry


    *   Pluralistic walkthroughs/focus groups


    *   Individual sentiment gathering


    *   Indirect sentiment gathering


    *   Digital ethnography


    **Field observation and contextual inquiry** are merely different ways of saying
    that someone is observing users (or potential users) as they accomplish their
    tasks. It is ideal to do this in a setting as close to the user’s natural context
    as possible although “direct observation” often occurs in labs or other controlled
    environments. Users are encouraged to “think aloud” or describe their attitudes
    and the reasons for their behaviors, and researchers record both the behaviors
    and the thoughts expressed by the user.


    **Pluralistic walkthroughs/focus groups** are methods designed to collect feedback
    from more than one user at a single time. Pluralistic walkthroughs guide users
    through the experience, seeking feedback throughout the process. In this way,
    they are like a group version of contextual inquiry. Focus groups are more concentrated
    on attitudes than behaviors, since they take place after the fact and, in this
    way, are more like a collective version of a user interview.


    **Direct sentiment gathering** is typified by one-on-one interviews and is a rich
    source of user attitudes. While these do not provide direct behavioral observation,
    the participant can report how they used the tool or whether they had specific
    problems. Interviews regarding direct experience with a tool are best conducted
    close to the user’s intended experience so the participant’s recollections are
    as fresh as possible, allowing the provision of direct examples based on experience.


    ### ***Discovery Research Artifacts***


    Research artifacts are the way that research is encoded and shared across teams,
    and insights are preserved for later use. They ensure that teams get the maximum
    benefit from the research activities conducted. During planning, it is important
    to remember that distilling the raw notes and records of activities into accurate
    and useful insights, a process called research synthesis, requires time. Imagine
    conducting 20 interviews—the research team doesn’t hand off several dozens of
    pages of notes, nor do they just comment on their impressions during ideation
    and refinement. Instead, they aggregate the important findings into documents
    that express the insights that a team will need.


    #### Personas and Empathy Maps


    Personas are a description of common roles or types of users differentiated by
    factors that affect their attitudes or behaviors. They serve as information radiators
    about known user information, helping to focus conversations and product design
    decisions on developing new features with the understood user context in mind.
    Because of this, personas are most effective when they provide information that
    is likely to affect design decisions.


    Some examples of information that impacts design are:


    *   How often do/might they use a product that accomplishes a specific purpose?'
