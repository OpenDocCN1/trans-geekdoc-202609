    某些团队自身需要完成足够的人性中心设计（HCD）工作，以至于将 HCD 作为团队的直接且持续的组成部分是值得投入的而另一些团队可能仅在需要时（ad hoc）才需要
    HCD 支持。将 HCD 实践者嵌入到有足够支持工作的团队中，意味着他们可以承担所有的团队职责，并充分参与所有团队活动。结果是他们对正在构建的产品有了更深入的理解。因此，他们可以更方便地支持日常决策，包括实施过程中任何影响终端用户体验的调整，并能提供更好的保证，确保体验按预期交付的。


    判断一个团队是需要专门的还是临时的 HCD 支持，涉及几个关键决策因素：


    *   该团队对终端用户体验进行更改的频率有多高？某些团队频繁进行此类操作；另一些团队的工作中终端用户体验只是所谓的“冰山一角”。

    *   终端用户体验的变化幅度有多大？这些变化会影响多少用户？风险/收益有多大？


    ### 扩展到共享服务 HCD 团队


    在大多数计划中，并不是每个团队都需要全职 HCD 支持，某些团队（那些本质上更具技术性的团队）可能完全不需要。对于较大的计划，建立共享服务团队是有意义的，它可以为那些不需要嵌入式实践者、或者实践者定期需要额外支持的团队提供灵活支持。这个共享服务
    HCD 团队应该像其他团队一样运行，拥有自己的 `Product Owner`（产品负责人）、`Scrum Master`（敏大师）和待办列表（backlog）。


    在战术层面，共享服务团队允许计划在关键点将 HCD 服务引入团队，这使得开展发现、构思、精炼、概念验证、解决方案验证和评估活动变得要容易得多。通过这种方式，共享服务团队让
    HCD 的参与在计划内部更加稳健且更加灵活。


    除了为团队提供直接支持外，HCD 共享服务团队还是设计运营（design operations）、研究运营以及跨团队活动的天然归宿。请参见图 13.1 对这两种团队拓扑结构的描述。


    ![图 13.1 左侧显示了集成到敏捷团队中的 HCD 实践者，右侧显示了首选的集中式“共享服务”HCD 团队，某些单个团队拥有自己的 HCD 资源。](img/Figure13_1.jpg)


    图 13.1 左侧显示了集成到敏捷团队中的 HCD 实践者，右侧显示了首选的集中式“共享服务”HCD 团队，某些单个团队拥有自己的 HCD 资源。


    ### 战略规划与支持


    除非某个计划在整合 HCD 方面已经达到了相当先进的成熟，否则没有嵌入 HCD 实践者的团队将需要如何在自己的交付周期内开展 HCD 活动的战略指导。拥有拥有自己的
    `Product Owner` 和 `Scrum Master` 并能够帮助其他团队的共享服务团队，会让计划将 HCD 整合到工作中变得更容易。这是因为，让非
    HCD 实践者（`Product Owners` 和 `Scrum Masters`）能够从他们自身角色的角度谈论 HCD，对于 HCD 被采纳计划的程度将产生巨大的影响。


    ### 设计与研究运营


    在建立共享服务团队时，计划为所有属于这两个类别的活动获得了一个清晰的操作基础，而不是希望在团队资源之间进行临时的协调来完成相同的任务。此外，这一点再强调也不为过，拥有一种集中的方式来处理研究活动的招募将为每个团队节省大量工作。


    ### 技能支持与增长


    HCD 通常被谈论得像是一项技能，但实际上，它是许多技能的融合，结合了设计和研究实践。拥有共享服务团队的一个虽然微妙但非常有价值的结果是，嵌入团队成员有了一个可以进行教练和反思的地方，这种增长是仅靠嵌入式实践者无法实现的
    HCD 技能增长。


