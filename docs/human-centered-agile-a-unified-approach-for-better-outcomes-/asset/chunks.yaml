    A pattern library is a collection of common styles used together. For example,
    a style guide may have specific definitions for how text fields are to be displayed,
    while a pattern library may define how address entries are handled (the order
    and labels of the fields, whether the zip code is five or nine digits, and even
    whether there is an address validation service). In practice, there is no perfect
    line between the two, but pattern libraries tend to be more robust. In either
    case, these are usually treated as living documents, and the team will have to
    make decisions about how to manage compliance with the guidance.


    ## Problem Definitions (as Epics)


    The purpose of discovery is to guide the generation of worthwhile problems to
    be solved for users. Once these problems are identified, they can be captured
    as epics, overarching units of work that are so large that they can take several
    months to deliver. They distill each of the specific problems to be solved into
    a single trackable place and describe this problem in terms of user value. This
    gives teams space to experiment with how to best solve the problem by building
    a small MVP to validate their concept and get early learning from users interacting
    with a real product in the field. This insight is key to helping teams pivot away
    from unsuccessful solutions early.


    Epics break down into features that are medium-sized units of work that focus
    on delivering solutions to users. Features, in turn, break down into stories,
    which are much more granular than epics and are sized such that they can be completed
    in a single sprint (see [Figure 3.2](#ch03.xhtml#_15064-4445_ch003_Figure_002)).
    During each sprint, teams focus on stories as the most granular unit of value
    delivery. User stories are small enough to complete in a single sprint but large
    enough to contain specific value to be delivered to the user through the story.


    ![Figure 3.2 How an epic breaks down into many features, which, in turn, break
    down into multiple stories.](Images/Figure3_2.jpg)


    [Figure 3.2](#ch03.xhtml#R_15064-4445_ch003_Figure_002) How an epic breaks down
    into many features, which, in turn, break down into multiple stories.


    Epics also equip teams to answer the following questions:


    1. “What is the problem that we are trying to solve for users, and what value
    do we expect them to receive?”

    2. “Is this a problem that needs to be solved?”

    3. “What are the “stakes?” (More on “stakes” in [Chapter 6](#ch06.xhtml#_15064-4445_ch006).)

    4. “What is the benefit to the business of solving this problem?”

    5. “What types of solutions are acceptable to users and feasible to deliver, at
    a level of effort appropriate to the problem?”

    6. “How might the success of this solution be measured?”


