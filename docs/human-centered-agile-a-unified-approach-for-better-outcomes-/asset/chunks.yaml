    Practitioners will notice two things about this figure: research and design activities
    are separated and many HCD activities are not consumed in the same sprint.


    ## Research and Design Activities Are Separated


    Research and design activities are separated to emphasize that research is an
    integral part of the Human-Centered Design (HCD) process and highlight the fact
    that it requires a different sort of work, which is often thought of as part of
    design. A `Designer` can make a wireframe with just an idea (or set of requirements)
    and a computer but cannot make a journey map that way. Similarly, design activities
    guided by previous research or best practices are ongoing throughout the process,
    without requiring further research. Stories are based on the knowledge of the
    users, but they often get refined based on technical and business constraints
    or simply new decisions. When those refinements have a front-end impact, the `Designer`
    should be involved in the refinement process to make sure the updates reflect
    the user goals rather than being decisions for expediency.


    ### Many HCD Activities Are Not Consumed in the Current Sprint


    Research activities require time for team digestion and response. Obviously, teams
    wishing to learn or validate what users’ needs and desires are cannot do so a
    week before implementation and still expect time for refinement. Conversely, teams
    already committed to doing work in an upcoming sprint would fail to see the purpose
    of doing discovery to impact the current planned release. Any discovery activities
    at that point would only influence future releases.


    ## The Research Roadmap and Research Strategy


    Aligning a `Research Roadmap` and a product roadmap allows the team to get a clear
    enough picture of their overall workload to see what products/features are in
    the pipeline, even if just in general terms. Seeing both gives teams a clear picture
    of which releases have, or might need, research support.


    It is a good practice to review the `Research Roadmap` directly following a review
    of the product roadmap so the product research needs are apparent. By seeing where
    all these features are in their cycle, teams can begin to answer questions, like:


    *   What discovery is still needed?

    *   Can discovery research support multiple releases?

    *   What proportion of the team’s time is going to be spent on each of the “right
    problem, right solution, done right” questions?


    For example, the team might wish to conduct:


    *   discovery research that is truly exploratory and organized around discovering
    unmet needs and opportunities.

    *   discovery research that is required well ahead of implementation for certain
    features to ensure the intended feature solves a need for users.

    *   collaborative ideation for some features, followed by concept validation of
    the high-level solutions, so the right solution can be planned.

    *   solution validation (usability testing) for products one to three sprints
    out so findings can be integrated into stories and implementation.

    *   evaluation efforts following specific releases.


    ## Linking HCD Stories with the Product Roadmap


    In order to use a `Research Roadmap`, teams need to be able to link research stories
    to their corresponding efforts on a product roadmap. For early-stage research
    and design work (discovery through concept validation), this will mean linking
    to an `epic` that describes the problem a team is seeking to address. For later
    work (solution validation or evaluation), these stories can be tied to features.
    In either case, research work should be identifiable and trackable as part of
    an effort that is reflected on the product roadmap. This ensures that the team
    is tracking all research and design activities (i.e., there is no “off the books”
    work) and that all work has an agreed-on purpose (i.e., there is no “free-floating”
    work).


    ### Epics, Discovery Work, and “Right Problem”


    In other aspects, which include creating clear acceptance criteria and doing a
    team-based refinement and story-pointing effort, the story should be treated as
    any other. In `Chapter 3`, the discussion of epics focused on the following:


    1.  What is the benefit we expect to receive?

    2.  Is this a problem that needs solving?

    3.  What types of solutions are acceptable?

    4.  What is the benefit to the business of solving this?

    5.  What types of solutions are feasible?

    6.  How might success be measured?


    ### Example Epic


    Imagine that a company has been providing support during hours. They have received
    a handful of requests for 24/7 support. The epic will contain a statement from
    team perspective.


    > **EPIC-001: After-Hours Support**

    >

    > **The team believes there is a significant need for additional support and needs
    to determine how to provide support so that customers feel confident in their
    relationship.**

    >

    > * Expected outcomes:

    > *   Validate whether there is unmet need in additional support

    > *   Identify user expectations about additional support (what kind of support
    is acceptable)

    > * *Generate ideas for additional support

    > *   Validate and select features

    > *   Generate success criteria for features


    ### Example Research Stories for Discovery


    The following are example research stories that might be tied to the example epic
    and are intended to fulfill acceptance criteria (ACs) 1 and 2. Because research
    stories are about gathering evidence, on completion, the team may decide that
    enough evidence was gathered to make good decisions and that these AC were met
    or that they may decide that additional evidence is needed that requires additional
    effort.


    > **Story: As a product team, we want to validate that users are regularly experiencing
    frustration that their issues cannot be addressed after hours so that we can address
    their needs in an appropriate way.**

    >

    > Learning goal 1: Identify current user expectation of support. We would like
    to know whether users are aware that support is only available during limited
    hours or whether their initial expectation is that they have 24-hour support.
    Understanding whether there is a gap between expectation and actual experience
    will help us determine whether to provide further support.

