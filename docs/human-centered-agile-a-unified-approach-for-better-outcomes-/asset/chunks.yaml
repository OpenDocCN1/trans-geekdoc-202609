    > — **Kevin Wolstenholme**


    这一概念适用于许多产品——团队是否正在改变其所提供的体验中的核心内容，而这正是客户回流的原因之一？一个开发在线购物网站的团队如果更改了结账交互，那么其改变的体验内容要比更新“再次购买”提醒功能的团队更具核心性。这并不意味着该体验不重要，而是意味着该变更对用户的即时影响较低，可能允许在发布后进行更好的问题解决。如果团队正在更新体验的核心部分，那么在团队评估风险利害时，这应该是一个考虑的因素——如果更新没有用处或损害了体验，那么改变核心体验的发布将带有极高的风险。


    ## 声誉


    除了用户接受产品的即时成本外，还有一种风险：那些无用或令人困惑的发布会随着时间的推移，损害体验质量以及产品在用户（可能还有潜在用户）中的声誉。在考虑将声誉作为确定风险的因素时，团队应该考虑他们通常进行评估工作的频率，而不仅仅是针对某次特定的发布。


    ## 士气成本


    发布糟糕产品时会想到的成本通常是构建和支持软件本身的成本，或者是构建和维护用户群的成本。然而，在评估发布风险时，还有另一个值得考虑的风险：团队士气。如果团队成员反复感到无法发布交付价值的产品，他们往往会寻找更有成就感的机会。


    ## 每个生命周期阶段的风险


    ### 发现


    如果团队尚未发现用户的需求，他们就面临构建出完全不受欢迎内容的风险，这可能是一项昂贵的任务。此外，如果团队构建了许多不想要的功能，这些功能可能会挤占用户所需的体验。功能越多并不总是意味着越成功。事实上，“功能堆砌”是一个已知的产品风险。有时，不构建不需要的功能确实是最佳决策。这同时是最廉的决策，符合敏捷宣言的原则：“简单——最大化减少未完成工作的艺术——至关重要。”⁹](#fn9)


    ### 构思与概念验证


    无论是从构思中产生具有竞争性的概念，还是希望沿着某个特定概念继续推进，概念验证的结果都是“转型还是坚持”（pivot-or-persevere）的决策——团队试图决定是否继续推进给定的解决方案。在某种意义上，风险在于精炼、构建和支持产品的成本。如果团队仅验证了一个问题，却在没有比较备选方案的情况下，就抓住脑中第一个解决方案或技术上最方便的解决方案，他们就面临着生成比需要更复杂或更昂贵的解决方案，或者在解决问题上无法达到用户预期效用的风险。


    ### 解决方案验证


    解决方案验证可以决定发布一个带有重大问题和高支持成本的产品，还是发布一个表现良好的产品。未被察觉的问题可能会导致高昂成本，表现为用户完全拒绝该解决方案，或者需要昂贵的技术支持。解决方案验证不应局限于功能测试和技术成功——糟糕或困惑的体验对用户来说，可能与功能故障一样成为问题。发布前的测试可以降低带有“红旗”问题上线的风险，并避免用户对他们的体验感到失望或沮丧。


    ### 评估


    了解产品的健康状况对于确定和优先考虑未来的工作至关重要。如果产品表现不佳且团队没有对其进行评估，可能会产生影响。


    ## 每个特定决策的风险


    了解产品的健康状况对于确定和优先考虑未来的工作至关重要。如果产品表现不佳且团队没有对其进行评估，可能会产生影响。


    # 第 7 章：在敏捷中规划和开展 HCD 活动


    DOI: [10.4324/9781031885210](https://doi.org/10.4324/9781031885210)


    在开发工作之前、期间和之后，存在着各种 HCD 工作。由于研究有一段先于开发工作的跑道，产品所有（Product Owners）和 HCD 实践者必须超越当前的迭代（Sprint）来规划他们的工作。


    这种早期的生命周期工作很难追踪，对于习惯于只将开发工作视为“工作”的团队来说，这可能是一个挑战。前瞻性可能会在 HCD 和敏捷思维之间产生摩擦，但不应该如此。这种规划并不意味着团队变得缺乏灵活性（被长期承诺锁定），但它意味着团队可以比仅通过构建发布级软件来学习更低的成本进行学习、迭代并降低风险。


    ## 使用研究路线图


    研究路线图（Research Roadmap）通过将敏捷价值观和规划引入研究背景，帮助团队弥补这一差距。例如，通过整合研究路线图，团队可以保持运营的灵活性和对目标清晰、共享的理解，同时改进对工作量的估算，并保持研究与近期工作保持相关性。


    ![图 7.1 研究路线图。](img/Figure7_1.jpg)


    研究路线图（见图 7.1）类似于产品路线图。其目标是为即将进行的研究工作提供高层概览，包括它们所服务的整体学习目标，以及在时间和优先级方面处于什么位置。研究路线图与产品路线图并行，因为两者之间存在依赖关系。


    通过路线图视图查看研究，可以查看计划中的 HCD 工作范围，并作为一个整体进行优先级排序。这还让团队能够查看每个史诗（epic）和每个功能的 HCD 工作，以确定关键未知因素是否得到了解决，从而使团队能够策略性地尽可能降低产品开发风险。


    '
