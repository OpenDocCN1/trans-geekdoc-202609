    \ still most entertaining texts about how design creates successful and unsuccessful\
    \ experiences. He has also written two excellent follow-up books: `The Design\
    \ of Future Things` and `Emotional Design: Why We Love (or Hate) Everyday Things`.\n\
    \n*   `Don’t Make Me Think` by Steve Krug—An approachable (and even fun!) introduction\
    \ to key concepts of usability and intuitive information design.\n\n*   `Designing\
    \ Connected Content` by Mike Atherton and Carrie Hane—Content is design. Content\
    \ is usability. Content is experience. This book is an end-to-end process for\
    \ building a structured content framework.\n\n*   `The User Experience Team of\
    \ One: A Research and Design Survival Guide` by Leah Buley—A practical guide for\
    \ HCD practitioners, and an excellent survey for Agilists and Product Owners of\
    \ what it takes for an individual to work as the only practitioner on a team.\n\
    \n*   `Outcomes Over Output: Why Customer Behavior Is the Key Metric for Business\
    \ Success` by Jeff Seiden—A concise yet powerful book on how to shift in thinking\
    \ from the endless delivery of features and functionality to actual, measurable\
    \ user value.\n\n*   `How Music Works` by David Byrne—Not a “professional book”\
    \ or a book about HCD, David nonetheless writes a fascinating account of how every\
    \ aspect of the creation of music—from the type of performance environment the\
    \ music will be performed into the incentive structure for creating—becomes part\
    \ of the listener and audience experience.\n\n*   `Lean UX: Designing Great Products\
    \ with Agile Teams` by Jeff Gothelf—A valuable book for understanding how UX can\
    \ fit into strategic decision-making and a practical approach for getting started\
    \ with strategic experimentation.\n\n*   `Accessibility for Everyone` by Laura\
    \ Kalbag—A practical approach to ensuring that designs and products can be successful\
    \ for as many people as possible.\n\n### Need More Help? Just Want to Say Hi?\n\
    \nFor those struggling with implementing the ideas in this book or wanting to\
    \ share the results of their work, reach out to the authors at the following email\
    \ addresses:\n\n*   `Joe@HumanAgile.com`\n*   `Brad@HumanAgile.com`\n\n*   You\
    \ can also connect with us on LinkedIn:\n\n*   `www.linkedin.com/in/joemontano/`\n\
    *   `www.linkedin.com/in/brad-lehman-hca/`\n\n# Index\n\nNote: numbers in **bold**\
    \ indicate a table. Numbers in *italics* indicate a figure on the corresponding\
    \ page.\n\n*   **A**\n\n*   Adkins, Lyssa, [235]\n\n*   agile, *see also*, [human-centered\
    \ agile]; [human-centered design (HCD) brought into agile]; [human centered design\
    \ (HCD) activities in agile (planning and conducting)]\n\n    *   agile at scale,\
    \ updating team roles for, [178–180]\n\n    *   agile framework for decomposing\
    \ and estimating design concepts, [107–109] (box)\n\n    *   “Build and See” agile,\
    \ [87–88]\n"
  trans: '

    *   `Essential Scrum`（精要 Scrum），Ken Rubin——这是对 Scrum 各层面的全面深入探讨。对于那些深入理解 Scrum（并且这是一本很好的参考书）的人来说，该主题的必备书籍。Ken
    Rubin 描述了 Scrum 事件。


    *   `Scrum: The Art of Doing Twice the Work in Half the Time`（Scrum：用一半的时间完成双倍工作的艺术），Jeff
    Sutherland 和 Jeff Sutherland——这是一本非常易读的书，在让读者熟悉敏捷宏观理念方面比熟悉 Scrum 的具体机制更为有效。


    *   `User Stories Applied`（用户故事应用），Mike Cohn——用户故事是敏捷团队最挣扎的领域。这是该领域最受尊敬的作者之一关于该主题的著作。


    *   `Agile Estimating and Planning`（敏捷估算与计划），Mike Cohn——这是一本为产品主、产品经理或任何对进度负责的人编写的优秀书籍。


    *   `Innovation Games: Creating Breakthrough Products Through Collaborative Play`（创新游戏：通过协作游戏创造突破产品），Luke
    Hohmann——这是为与用户互动有困难的从业人员（尤其是敏捷专家）编写的。这本书由公认的敏捷专家编写，充满了帮助团队理解用户真实需求的练习。


    *   `Kanban`（看板），David J. Anderson——看板是一种被低估的比 Scrum 更适合许多团队的无迭代敏捷框架。这本书将使从业人员能够使用看板完成更多工作。强烈推荐。


    *   `SAFe® Distilled`（SAFe 精要），Richard Knaster 和 Dean Leffing——这是一个对 SAFe 的优秀介绍，带有许多描述性的彩色插图，非常推荐新接触
    SAFe 的从业人员。应该获取最新版本，因为 SAFe 模型经常更新。


    *   `SAFe® Training`（SAFe 培训）——强烈鼓励寻求实施 SAFe 的从业人员参加导师的培训（无论是线下还是虚拟）。有至少 12 种基于角色的
    SAFe 认证供选择。列表和课程表可以在此处找到：[https://scaledagile.com/safe-certification/]。更多信息请访问：www.scaledagileframework.com/。


    *   `Team Topologies: Organizing Business and Technology Teams for Fast Flow`（团队拓扑：为了快速流动组织业务和技术团队），Matthew
    Skelton 和 Manuel Pais——对于那些寻求深入了解如何形成团队以实现价值最优流动的人来说，这本书不是轻松的读物，而是非常详细。


    *   `Project to Product: How to Survive and Thrive in the Age of Digital Disruption`（从项目到产品：在数字化变革时代生存与发展），Mik
    Kirsten——寻求提升敏捷知识水平的从业人员将从这本书引入的“流动框架”中受益。


    *   `Continuous Discovery Habits: Discover Products That Create Customer Value
    and Business Value`（持续发现习惯：发现创造客户和业务价值的产品），Theresa Torres——鼓励希望更好地与用户互动、建立洞察库并使用这些数据改进产品的敏捷团队阅读这本书。


    *   `When Will It Be Done: Lean-Agile Forecasting to Answer Your Customers’ Most
    Important Question`（何时完成：精益敏捷预测回答客户最的问题），Daniel S. Vacanti——这本开创性的书籍改变了许多对故事点估算有效性的看法，并帮助许多团队转向使用历史数据的统计预测。对于估算困难的人，这本书是必读的。


    *   `Coaching Agile Teams: A Companion for Scrum Masters, Agile Coaches, and Project
    Managers in Transition`（教练敏捷团队：转型中的 Scrum Master、敏捷教练和项目经理的伴侣），Lyssa Adkins——这是敏捷教练文本中的金标准。


    *   `Drive`（驱动），Dan Pink——这本书与其说是关于敏捷，不如说是关于创造激励知识工作者并培养创造力的环境。强烈推荐。


    ### 设计师的书单


    *   `Radical Focus: Achieving Your Most Important Goals with Objectives and Key
    Results (Empowered Teams)`（极致聚焦：通过目标和关键结果实现最重要的目标（赋权团队）），Christina Wodtke——一个团队应用
    OKR 的虚构描述，这本书简单易读，并将 OKR 方法落实于相关的实践。


    *   `Communicating Design`（设计沟通），Dan Brown——对设计交付物的更深入的探讨，以及如何在设计过程的任何阶段创建和展示它们以实现有效沟通。


    *   `Just Enough Research`（恰当的研究），Erika Hall——这是一本关于交付导向型信赖研究方法的极佳入门指南，无论团队规模或预算如何，都可以立即实施。


    *   `The Design of Everyday Things`（日常用品设计），Donald Norman——这是关于设计如何创造成功或失败体验的最早且仍最有趣的文本之一。他还写了另外两个优秀的续作：`The
    Design of Future Things`（未来产品设计）和 `Emotional Design: Why We Love (or Hate) Everyday
    Things`（情感设计：我们为什么喜欢或讨厌日常用品）。


    *   `Don’t Make Me Think`（别让我思考），Steve Krug——关于可用性和直观信息设计核心概念的通俗且趣味的介绍。


    *   `Designing Connected Content`（设计连接内容），Mike Atherton 和 Carrie Hane——内容是设计。内容是可用性。内容是体验。这本书是构建结构化内容框架的端端流程。


    *   `The User Experience Team of One: A Research and Design Survival Guide`（单人用户体验团队：研究与设计生存指南），Leah
    Buley——针对 HCD（以人为中心的设计）从业人员的实用指南，也是对敏捷专家和产品主关于个人如何在团队中作为唯一专家工作的要求的优秀调研。


    *   `Outcomes Over Output: Why Customer Behavior Is The Key for Business Success`（结果重于产出：为什么客户行为是业务成功的关键），Jeff
    Seiden——一本关于从无止尽的功能交付转向可衡量的用户价值思维的简洁而强大的书籍。


    *   `How Music Works`（音乐如何运作），David Byrne——并不是一本“专业书籍”或关于 HCD 的书，尽管作者仍然对音乐创作的各个方面进行了迷人的描述——从音乐表演的环境类型到激励结构——都是听众和观众体验的一部分。


    *   `Lean UX: Designing Great Products with Agile Teams`（精益 UX：与敏捷团队一起设计产品），Jeff
    Gothelf——对于了解 UX 如何融入战略决策的人非常有价值，是开始战略实验的实用方法。


    *   `Accessibility for Everyone`（人人皆无障碍），Laura Kalbag——一种确保设计和产品能够让尽可能的人成功的实用方法。

