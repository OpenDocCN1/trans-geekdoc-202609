    在实际上，问题空间与解决方案之间的划分并不是绝对的。即使从发现的最早期开始，利益相关者（包括用户）就会提出具体的解决方案，而在识别问题的那一刻，思考如何解决问题是自然而。同样，随着解决方案的开发以及被用户接受或拒绝，所解决的问题本质可能会变得清晰并不断演变。团队在整个`delivery
    cycle`中都应该检查问题和解决方案，理解在每个空间花费的时间和工作比例将会发生变化。在一个特定产品或功能的交付周期之初，团队几乎所有的注意力都应该放在问题定义上。接近发布时，几乎所有的工作都是为了交付解决方案。


    # II


    理解恰好的人为中心的设计


    # 第 2 章 以人为中心的设计导论


    DOI: [10.4324/9781003188520-4](https://doi.org/10.4324/9781003188520-4)


    “设计”是一个棘手的词汇——问十个人对设计的理解，会有十二种不同的答案。为了理解以人为中心的设计（HCD），了解本书书中所谓的“设计”是指什么是有帮助的。


    *设计是有意地创造一种特定的体验或结果*。


    仅此而已。无论开发的的产品是网站还是椅子（而且天哪，设计师们有多爱他们的椅子了！）。体验是为产品用户创建的。当讨论设计时，特别是在软件领域，人们通常想到的是`视觉设计`——调色板、图片和元素的平衡。然而，视觉设计只是其中一个方面。其他方面，如`交互设计`、信息架构和`内容策略`，对良好的软件开发也至关重要，而与“设计用户体验”成为同义的研究和测试活动也是如此。


    一个常见的误解是，设计是对特定体验或结果的`definition`，就像建筑的蓝图和计划被视为“设计”一样。建筑的`construction`过程也是设计过程的一部分。这包括在此过程中做出的每一个独立决策（甚至细到门把手！），这些决策影响了人们*体验*建筑的方式，即使这些决策是在初始计划生成后才做出或更改的。


    设计与交付之间的人为分离，也渗透到了团队思考软件设计的方式中。产品的定义和规划与交付是完全分离的。在实践中，特别是在软件领域，这种分离很少是清晰的。即使在产品生成需求后，交付过程中也会做出影响最终体验的决策。


    初始故事中的差距、最初未被完全理解的技术限制或业务逻辑不可预见的更新，都是可能改变计划的因素，而无论是谁在做这些更改——`Designer`、`Business
    Analyst`、`Developer`、`Product Owner`——在那个时刻，他们都在*设计*该产品。如果团队将产品的`definition`与产品交付完全分开，他们就忽略了设计在整个过程中进行的这一事实。


    ## HCD = 研究 + 设计


    设计（尤其是 HCD）的永恒陷阱之一是，`design`这个词本身容易引起许多误解。人们经常考虑到视觉设计，并使用“外观和感觉”等术语，将其视为涂层油漆。


    为了尽可能清楚地说明：**HCD 是研究与设计的结合。** 没有研究，设计中就没有“人”。HCD 是一种从一开始就将业务目标与用户需求对齐的方法论。无论设计是简单还是复杂，都是如此。HCD
    通过确保在整个开发过程中将人置于框架内，确保产品得以交付。


    ## 介绍 HCD 的阶段


    HCD 包含七个关键步骤：

    1. `Discovery`

    2. `Ideation`

    3. `Concept Validation`

    4. `Refinement`

    5. `Development`

    6. `Evaluation`


    这些步骤的范围和持续时间根据团队的方法而异。


    ![图 2.1 以人为中心的设计阶段](img/Figure2_1.jpg)


    ### Discovery (发现)


    *Discovery 为构思产生所需的输入，或者产生“正确的问题”。* 发现的目的是定义并阐述要解决的问题，理解用户需求并适当评估限制条件。


    在发现过程中，看到以下某些内容是典型的：

    * 业务需求收集

    * 设计需求收集

    * 内容/资产清单

    * 用户研究/用户理解工作

    * 假设的成功标准


    在此阶段，收集有效解决问题所需的背景需要从各种利益相关者（例如`Product Owners` 和其他业务利益相关者）处获取。这样团队就能理解产品应该交付的能力。团队需要技术利益相关者（例如`technical
    architect`）的参与，以理解解决方案的限制。


    在以人为中心的敏捷（Human-Centered Agile）中，发现活动还包括从用户处获取，以便团队对态度和行为有必要的理解，并收集设计限制。这整组信息构成了问题的`problem
    definition`。没有这些信息，团队可能会设计出不可行的、或成本高昂且低效的解决方案。


    最后，在考虑正在解决的问题时，团队应该考虑如何定义成功，以及衡量成功的标准是什么。在这一早期，团队应该考虑从用户和业务的角度来看成功应该是什么样，以便在之后确定解决方案时，能够开发出衡量方法。思考这种问题的一种方法是使用
    Jeff Gothelf 和 Josh Seiden 提出的“结果”（outcomes）的定义：


    > 结果是驱动业务结果的人类行为的变化。结果与制造东西无关——尽管它们有时是通过制造正确的东西来创造的。相反，结果是客户、用户、员工行为的变化，这些变化为你的公司、你的组织或你工作的任何关注对象带来了益处。²


    这个定义非常有用，因为它让团队远离了挑选解决方案并通过衡量构建的功能数量来衡量成功的做法，转而去理解他们所构建的产品实际上是如何改变某人的行为的。


    发现的输出是对通过这些活动所满足的需求的清晰阐述的问题定义，并带有定义的`benefit hypothesis`、`value proposition`和成功标准。


    ### Ideation (构思)


    构思和概念验证结合在一起以确保正确的解决方案。在构思步骤中，团队探索并评估多个解决方案概念（通常被称为`lateral`或`发散性思维`），然后选择要开发的解决方案路径。


    '
