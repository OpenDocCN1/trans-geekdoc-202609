    Surveys have a few key constraints to be aware of. For teams wishing to compare
    survey results across time or groups, maintaining standardized questions and employing
    a consistent measurement approach across surveys is important (i.e., teams use
    the same measurement scales and capture sentiment in the same ways as one another).
    Also, since surveys are highly sensitive to clarity and tone, they should follow
    the same content guidance that applies to any of the teams’ other products. Finally,
    surveys are most accurate when they are completed immediately following the experience
    being measured (or as close to immediately as possible).


    In addition to the content, it is important to consider how many questions a user
    is given and how long the survey will take to complete. Longer surveys typically
    return fewer results, and not all question types require the same amount of time
    to complete.


    ### Other Qualitative Evaluation Methods


    Interviews, contextual inquiry, and even asynchronous usability tests have all
    been described earlier in the context of discovery or validation. They are just
    as valuable in the evaluation process for products already released. Teams may
    also have planned remote sentiment analysis or digital ethnography to gain a qualitative
    understanding of user attitudes toward their product. Evaluative efforts require
    the same type of planning as in other phases of the project.


    ### Metrics Frameworks


    For teams that are struggling to identify True North and signal metrics for their
    solutions or features, the following frameworks might provide a good starting
    point. Each focuses on different aspects of their users’ experience and gives
    a structure for thinking about which kinds of questions need to be answered when
    reviewing metrics.


    ### Google HEART Framework


    The Google HEART metrics framework.


    It is worth recognizing that this framework, and a focus specifically on engagement,
    tends to work better for certain kinds of products, such as those whose business
    outcomes are rewarded by sustained usage. Of course, there are products, like
    auto insurance, that make users happy by having the `lightest` possible footprint
    in their lives rather than the heaviest.


    ### Pirate Metrics


    “Pirate metrics” is another term some practitioners may hear, particularly with
    respect to digital products. This name comes from the abbreviation `AARRR`, which
    stands for acquisition, activation, retention, referrals, and revenue. Pirate
    metrics are fun because teams enjoy saying `AARRR!` like a pirate. (Try it and
    see.) They are also useful in providing stakeholders of digital products a “full
    spectrum” set of metrics that shows them the big picture of their product’s performance.


    Table 15.1 Google HEART Metric Examples Inspired by the Work of Emily Bonnie at
    CleverTap


    | | Goal | Signal | Metric |

    | :--- | :--- | :--- | :--- |

    | **Happiness** | Is the application, solution, or product easy to use, helpful,
    intuitive, and fun? | Positive feedback; Good reviews | `NPS` or `SUS`; App/product
    rating; Positive survey or review results |

    | **Engagement** | Do users enjoy using the application and do they plan to continue
    using it? | Increasing app or product usage; Keeps coming back; Participates in
    online forums and/or subscribes to emails | Time spent in app or solution; Mentions
    on social media; Number of clicks within app |

    | **Adoption** | Do users see value in the product or solution and are new users
    adopting it, preferring it over substitute solutions? | Buying the application,
    product, or solution; Using new features as they are developed | New subscriptions;
    Referral subscriptions |

    | **Retention** | Do users keep coming back to the application or solution? |
    Renewing membership or subscription; Referring friends; Not switching to competing
    solutions | Premium subscription upgrades; Repeat subscriptions; Number of paid
    users |

    | **Task Success** | Are users able to complete their intended task(s) easily
    and efficiently? | Completed tasks; Lack of errors; No need for rework | Task
    abandonment ratio; Error rate; Time per task |


    An exploration of each of these categories is in order:


    - **Acquisition**—This set of metrics captures how users get to the website. Do
    they come from `SEO` and search engines, online ads, email solicitations, public
    relations, and so on? Stakeholders are typically interested in the acquisition
    channels with the biggest impact, that is, those with the lowest-cost/highest-volume
    channels.

    - **Activation**—This means giving the users a good first experience with the
    product so they will be excited about it and engaged with it. Here, teams typically
    measure things, like time on page, clicks from page, and any other metrics that
    measure the degree to which users are interacting with the product or website.
    Did they have a good visit? Did they purchase a premium service during their visit?
    How many features did they use?

    - **Retention**—This set of metrics measures how often users come back to use
    the product or website, usually within 30 days. This metric can sometimes be improved
    by the right follow-up communication at the right time. Automated emails, for
    example, informing new users about additional features or special offers. Metrics
    for those emails may capture the percentage of recipients that clicked the link
    within to take them to the website.

    - **Referrals**—This is a set of metrics around understanding which users refer
    other users to sign up. Products whose users are happy enough with it that they
    would refer friends are in a good place to incentivize this and start viral marketing
    campaigns.

    - **Revenue**—This set of metrics helps stakeholders understand the value users
    derive from their product and the positions of that product that generate revenue.
    Typically, Product Owners will want to know how much revenue they need to break
    even and how much they need to make their bosses happy. Teams often measure fluctuations
    in revenue with respect to recently fielded or changed features.


    As useful as metrics are, there is a common pattern for teams to use `too many`.
    As with many things in life, less is more. Don’t try to oversimplify all the complexity
    and nuance of the product’s performance into one or two narrow metrics. At the
    same time, avoid the temptation to use all the metrics suggested by application
    management tools. It is rare for a team to need to track dozens and dozens of
    metrics.


    ### Objectives and Key Results


    Objectives and key results (`OKRs`) have recently become a hot topic in Agile
    circles. There are even OKR certifications. OKRs fit well with Agile development
    because both break down large units of work into smaller units, focusing on outcomes.
    Objectives are larger, overarching goals or outcomes, and Agile and Human-Centered
    Agile, especially, are outcome-focused. Key results are smaller outcomes that
    help build to the overarching goal or objective.

    '
