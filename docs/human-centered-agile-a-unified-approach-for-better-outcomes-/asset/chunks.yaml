    \n# Foreword\n\nPundits assert that the technology is changing “faster than ever”\
    \ and that we need to keep pace.\n\nSure. But how?\n\nOne approach is to embrace\
    \ innovations that help us develop software quickly and efficiently. Such things\
    \ as DevOps, automation, and AI-enhanced development environments are among the\
    \ many examples of innovations that help us serve customers better.\n\nAnother\
    \ is to develop an understanding and appreciation of timeless principles and embrace\
    \ them.\n\nThis is where the integration of Human-Centered Design, agile software\
    \ development, and the scaled agile framework comes into play. These methodologies,\
    \ when combined, create a powerful approach to software development that puts\
    \ the customer at the center of the development process, while also promoting\
    \ collaboration, flexibility, and continuous improvement.\n\nIn this book, Joe\
    \ and Brad have taken on the challenging task of integrating these methodologies\
    \ into a cohesive approach to user-centric software development. They have drawn\
    \ on their extensive experience in the field to provide practical guidance on\
    \ how to use Human-Centered Design to identify and understand customer needs,\
    \ how to implement agile software development practices to quickly and iteratively\
    \ develop software, and how to use the Scaled Agile Framework to effectively manage\
    \ large-scale software development projects.\n\nOne of the things that I appreciate\
    \ about this book is the way that it takes a holistic approach to software development.\
    \ It recognizes that developing software is not just about writing code, but also\
    \ about understanding the needs of customers and ensuring that the software meets\
    \ those needs. It also recognizes that software development is a team sport, and\
    \ that effective collaboration and communication are essential for success.\n\n\
    Whether you are a software developer, project manager, or business leader, this\
    \ book provides valuable insights and guidance on how to use Human-Centered Design,\
    \ agile software development, and the scaled agile framework to develop software\
    \ that meets the needs of your customers while also delivering value to your organization.\
    \ I highly recommend it to anyone who is interested in improving their software\
    \ development practices.\n\nLuke Hohmann  \n\nAuthor of *Innovation Games* and\
    \ *Beyond Software Architecture*  \n\nco-Author of *Software Profit Streams™*\
    \  \n\nSAFe Contributor  \n\nChief Innovation Officer, Applied Frameworks\n\n\
    # Preface\n\nThe techniques described in this book were pioneered at a large government\
    \ agency that we cannot name. Management had been using Agile methods for years\
    \ and knew that Agile allowed them to learn faster and deliver faster with more\
    \ predictability and higher quality. They also had success using Human-Centered\
    \ Design (HCD) methods to get better insight into the needs, attitudes, and priorities\
    \ of their customers and end users. Unfortunately, their Agile and HCD initiatives\
    \ were siloed and divorced from one another.\n\nTheir request seemed simple enough:\
    \ Get the experts who had successfully led their transition to Agile methods to\
    \ collaborate with experts in HCD to give them a “best of both worlds” implementation.\
    \ Of course! It was common sense. It sounded easy.\n\nThe reality was that combining\
    \ these ways of thinking and working turned out to be much harder than anyone\
    \ expected it to be. Agile practitioners initially misunderstood the need for\
    \ HCD. “Can’t we just iterate our solution and refine it with feedback until we\
    \ get it right?” HCD practitioners, however, were often included as an afterthought\
    \ in the early stages, leading to less-than-optimal outcomes and not just a little\
    \ bit of frustration and hurt feelings.\n\nOne day we were having lunch and brainstorming\
    \ through some implementation challenges, and we joked that “we should write a\
    \ book about this.” As the engagement went on and we had our fair share of hard-fought\
    \ victories as well as stinging defeats, the idea of documenting our experiences\
    \ and sharing them with the Agile and HCD communities kept coming up more and\
    \ more frequently. Every time we learned something the quip was “that’s another\
    \ chapter.”\n\nAt some point, our client finally got to their desired state with\
    \ “Human-Centered Agile.” We wrote a SAFe^® Advanced Topics article about our\
    \ experiences and then presented a talk about our experiences at the Agile 2021\
    \ Conference (which was virtual due to COVID-19). It seemed like we had not only\
    \ a set of lessons learned but also some successes and client outcomes to go with\
    \ them, and we started writing in earnest.\n\nThis book is the result of those\
    \ lessons learned and is designed to help Agilists and HCD practitioners build\
    \ “best of breed” programs of their own while avoiding all the mistakes we made.\
    \ We hope that the ideas and techniques presented here can help make existing\
    \ Agile programs even better and help HCD practitioners iterate more predictably\
    \ with better outcomes for both.\n\n# Acknowledgments\n\nWe would like to acknowledge\
    \ and thank the following people and organizations for their help and guidance\
    \ during the preparation of this manuscript:\n\n*   Lorelei Brown and Dawn Barton\
    \ for their time and wisdom.\n\n*   Sandy Dorr for her awesome illustrations and\
    \ good humor through ceaseless rounds of changes. And more changes.\n\n*   Ed\
    \ Galm for his cover art.\n\n*   Lauren Mix for her developmental editorial prowess.\n\
    \n*   Our friends at Scaled Agile, Inc: Dr. Steve Mayner, Marc Rix, Kevin Wells,\
    \ Stosh Misiaszek, David Freed, Michelle Stoll, Lorienne Neska, and Risa Wilmeth\
    \ for their help with copyright permissions, article review, graphics, and such.\n\
    \n*   Jen Cardello whose formulation of “right problem, right solution, done right”\
    \ has heavily influenced our approach.\n\n*   Luke Hohmann for generously donating\
    \ his time, his sage guidance, and for the gift of feedback.\n\n*   John Stenbeck\
    \ for his mentorship, advice, and wisdom."
