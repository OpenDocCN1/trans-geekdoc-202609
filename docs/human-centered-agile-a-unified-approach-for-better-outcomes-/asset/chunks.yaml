    \n*   [Brad@HumanCenteredAgile.com](mailto:Brad@HumanCenteredAgile.com)\n\n* \
    \  You can also connect with us on LinkedIn:\n\n*   [www.linkedin.com/in/joemontalbano/](http://www.linkedin.com)\n\
    \n*   [www.linkedin.com/in/brad-lehman-hca/](http://www.linkedin.com)\n\n# Index\n\
    \nNote: numbers in **bold** indicate a table. Numbers in *italics* indicate a\
