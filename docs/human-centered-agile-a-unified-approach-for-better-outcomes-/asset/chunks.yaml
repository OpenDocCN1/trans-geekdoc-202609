    UX assurance (also known as design review) often takes the form of a formal step
    in the team’s definition of “done” for stories and is the time the Designer spends
    reviewing development work to ensure that it meets any agreed standards.


    ![Figure 4.2 HCD activities and artifacts in development.](Images/Figure4_2.jpg)


    [Figure 4.2](#ch04.xhtml#R_15064-4445_ch004_Figure_002) HCD activities and artifacts
    in development.


    ## Design Artifacts of Development


    Updates to style guides or pattern libraries—if in-flight design support creates
    a new design pattern, the Designer should update the relevant documentation.


    ## HCD and Solution Validation


    During solution validation, the team ensures that the solution they are building
    meets the “done right” criteria for release. The team does solution validation
    at a higher level of fidelity than previous concept validation efforts. This may
    be a model or prototype that more closely resembles the product that will be built,
    or it may be the actual product as it is being built. In either case, the team
    is looking to ensure that users understand and can successfully use the solution
    that will be delivered. Solution validation is a prelaunch activity, which means
    that the research is conducted ahead of the full release of the product or feature,
    so decisions can be made in time for the planned release.


    From a team standpoint, solution validation leads to two key outcomes (see also
    [Figure 4.3](#ch04.xhtml#_15064-4445_ch004_Figure_003)):


    ![Figure 4.3 HCD activities and artifacts in solution validation.](Images/Figure4_3.jpg)


    [Figure 4.3](#ch04.xhtml#R_15064-4445_ch004_Figure_003) HCD activities and artifacts
    in solution validation.


    * Lower risk at launch

    * Improved postlaunch work planning and prioritization


    ### Lower Risk at Launch


    Solution validation tests a high-fidelity product with actual users. In doing
    so, the team is able to identify any points of confusion or frustration within
    the experience and address any red flags before the product reaches its widest
    audience. This reduces the risk of alienating users or costly support while problems
    get remediated.


    ### Improved Postlaunch Work Planning and Prioritization


    In addition to “red flag” issues that need to be resolved prior to launch, solution
    validation can reveal smaller issues or opportunities to optimize the experience.
    It is very common for teams to develop a backlog of “fast follow” work to address
    known issues that are not considered critical.


    ### Research Activities of Solution Validation


    The activities of solution validation are very similar to those described in concept
    validation, including identifying the team’s learning goals, recruiting participants,
    conducting the research, and sharing findings. The primary difference is that
    the research is conducted using higher-fidelity products. The most common solution
    validation research is task completion testing, although other tests can be used
    to validate specific parts of the experience. For example, a team might do paraphrase
    testing to ensure that specific copy provides good orientation or decision support.


    ### Research Artifacts of Solution Validation


    Just as with activities, the artifacts of solution validation are similar to the
    artifacts of concept validation, including artifacts used for planning (test plans
    and test scripts), and the artifacts of the research itself (insights and reporting
    documentation).


    ## HCD and Evaluation


    During evaluation, the team ensures that what they have built is useful in the
    real world. There are a number of methods the team has to do this. In addition
    to methods incorporating qualitative techniques of previous stages (such as interviews
    and usability tests), the team can now observe users working with their solutions
    in the context of actual use. Additionally, teams can incorporate a quantitative
    gathering of information (such as analytics, surveys, and ratings tools, such
    as Net Promoter Score (NPS) that reflect large-scale behavior patterns.


    The results of both post-release quantitative and qualitative evaluations are
    brought into subsequent iteration planning and backlog refinement. Frequently,
    this insight will generate new features and stories for development.


    From a team standpoint, evaluation leads to three key outcomes (see also [Figure
    4.4](#ch04.xhtml#_15064-4445_ch004_Figure_004)):


    * Identifying unforeseen issues

    * Identification and prioritization of improvements

    * Product-level success measurement


    ### Identifying Unforeseen Issues


    Both quantitative and qualitative evaluation activities are critical because products
    (and users) in the wild always perform at least a little differently than expected
    when they were validated in a controlled environment.


    ![Figure 4.4 HCD activities and artifacts in evaluation.](Images/Figure4_4.jpg)


    [Figure 4.4](#ch04.xhtml#R_15064-4445_ch004_Figure_004) HCD activities and artifacts
    in evaluation.


    ### Identification and Prioritization of Improvements


    In addition to measuring how well a solution is doing, evaluation efforts surface
    unmet user needs and ideas for how to solve them. It is natural for users that
    are experiencing a problem or even simply having a suboptimal experience to make
    suggestions on where the product should go next. The frequency and urgency of
    suggested improvements provide a great first step for teams deciding what to do
    next.


    ### Product-Level Success Measurement


    HCD practitioners turn feature-level evaluation into a holistic solution-level
    evaluation. Solution satisfaction is rarely the sum of that solution’s parts,
    which is especially true when considering the qualitative and emotional impact
    that can lead to solution adoption and loyalty, on one hand, or frustration and
    abandonment, on the other. It is key that quantitative and qualitative evaluation
    go hand in hand. Quantitative measures give teams the behavioral “what” while
    qualitative measures, by contrast, provide the “why.”


    ### Research Activities of Evaluation


    **Contextual inquiry** refers to observing a solution being used in its natural
    context. Unlike usability tests in a controlled environment, this gives the team
    clearer visibility into user motivations and their attitudes toward the product.
    The team also gets to see the context within which the user is acting, including
    things like distractions and concurrent tasks.


    **Surveys** are practically ubiquitous at this point and provide an opportunity
    for teams to gather information from a wide set of users quickly. They can be
    particularly valuable for longitudinal feedback understanding how user attitudes
    change over time as both the product and the landscape of comparable product changes.


    **Indirect sentiment gathering** refers to remote, asynchronous ways to investigate
    how users are feeling about a product or experience. There are familiar tools
    that ask users to report directly after their experience. There are more advanced
    tools and methods that seek to aggregate sentiments from other pools of information,
    such as:


    * help desk/support tickets

    * community discussion boards

    * social media mentions and activity


    The goal of gathering sentiment indirectly is to understand what people say about
    the product in a variety of contexts, not just during planned research activities.
    One advantage of looking outside of direct channels like this is that it removes
    any participation bias (participants often have a desire to either please or be
    helpful; people calling a help desk or engaging on a discussion board do not).
    Gathering sentiment from these contexts can reveal reveal concerns or problems
    than are stated to researchers.


    #### Digital Ethnography (Community Immersion)

