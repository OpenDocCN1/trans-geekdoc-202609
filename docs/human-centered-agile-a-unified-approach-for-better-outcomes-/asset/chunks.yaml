    “`Human-Centered Agile` incorporates Human-Centered Design thinking and tools
    into the agile practice environment. The book offers practical ways to combine
    these two disciplines and scale as needed. In this book you can expect to learn:


    *   A process for Human-Centered Design activities and artifacts alignment with
    Agile practices that will build better products.

    *   How product lifecycle work such as evaluating stakes, defining a problem statement
    and evaluating products in the hands of users can be seamlessly integrated with
    the Agile workflow.

    *   How Research Roadmaps can run parallel to the product roadmap and provide
    a clear picture of the overall workload.

    *   The elements of research stories and sample stories with acceptance criteria.

    *   Tips on how to scale Human-Centered Agile from one team to many teams.

    *   How Human-Centered Design continuous evaluation aligns with continuous deployments.

    *   How Research Roadmaps scale and work with the Architectural Runway.

    *   Ideas for creating an Insight Repository and lessons learned from incorporating
    these frameworks into one seamless methodology.


