    \nBuilt-in quality, not just quality, is very important to understand. The idea\
    \ is that the only way to go fast and succeed at scale is to ensure the absence\
    \ of defects and delivery of user value as teams progress. No matter how much\
    \ testing they do, teams cannot test quality into a poor solution. The only way\
    \ for teams to go fast and have high quality is to ensure that quality is baked\
    \ into every step of their process the first time. This means spending time on\
    \ solution validation to ensure the solution is “done right.” Teams who must stop\
    \ working on new things to go back and remediate problems with previous “done”\
    \ work will always struggle to make progress on new work, so quality has to be\
    \ built into everything as they go. There’s no such thing as a “hardening sprint”\
    \ in SAFe where bugs are fixed. Teams can ensure they are delivering production-ready\
    \ solutions by adopting a “definition of done”[^(22)](#fn22)\n\nThe takeaway for\
    \ Human-Centered Agilists is that these four core values should guide everything\
    \ happening at the team level, the scaled “team of teams” level, and the enterprise\
    \ level. These core values provide teams with the mindset and justification to\
    \ do the HCD work (and related learning) that are necessary to build quality in,\
