- raw: "HCD shares an important philosophical foundation with Agile, upon which all\
    \ integration of the two approaches will rest: It is best to learn about product\
    \ and delivery efforts in the simplest, fastest, and cheapest way possible. [Figure\
    \ 5.2](#ch05.xhtml#_15064-4445_ch005_Figure_002) shows how risk is mitigated by\
    \ small increments of early value delivery in an Agile project.\n\n## Organic\
    \ Overlaps between Agile and HCD\n\nAgilists are familiar with the “fail fast,\
    \ fail often” approach. In Agile, it is considered a good thing for a team to\
    \ spend a small amount of time developing a solution that fails so they can quickly\
    \ pivot to testing an alternate solution. The very idea is to slice product delivery\
    \ into small enough pieces that problems with the team’s underlying assumptions\
    \ can be tested quickly, issues that show up in development can be identified\
    \ and fixed, and the learning can happen in a way that doesn’t jeopardize entire\
    \ product launches. A certain amount of rework (called refactoring by Agilists)\
    \ is accepted in the name of delivering quickly and taking in real feedback rather\
    \ than being able to see around every possible corner.\n\nHCD is a practice built\
    \ around avoiding many of the same risks, although sometimes at different stages\
    \ of delivery, and addressing additional common risks as well.\n\n*   By identifying\
    \ and validating user needs, Agile teams mitigate the risk of spending time building\
    \ things that users don’t actually need or want. Chasing unnecessary features\
    \ is an incredibly expensive proposition.\n\n*   By validating designs with the\
    \ users of their products at key points, Agile teams minimize rework based on\
    \ unsuccessful design approaches or poor assumptions.\n\n*   By evaluating products\
    \ after they are delivered, Agile teams ensure that their investment in further\
    \ product improvement is well targeted.\n\nEven without formally incorporating\
    \ Human-Centered Design (HCD), Agile classically already integrates *some* HCD\
    \ as part of its approach. In the cycle of build > evaluate > iterate, the evaluation\
    \ stage is where all HCD takes place. That is to say, even if there is no engagement\
    \ with users in discovery or ideation, there is an expectation that user feedback\
    \ is gathered when products are released and that this feedback provides a team\
    \ with improvements. In a sense, the evaluation stage stands in for discovery\
    \ (users will now tell teams if they are solving a problem they don’t have), concept\
    \ validation (users will tell teams if something was a bad idea), and solution\
    \ validation (users will tell teams if there are specific places where they are\
    \ having problems).\n\nFor certain kinds of projects, the evaluation phase can\
    \ be enough to keep the team moving in a good direction.\n\nHere are two prime\
    \ examples of this.\n\n1.  **The very beginning stages of a new product or feature,\
    \ iterated rapidly**  \n\n    The easiest way to locate the overlaps between Agile\
    \ and HCD is by considering what can happen when new projects or features get\
    \ spun up. Often, an idea is expressed as one or two important things that need\
    \ to happen then developed very quickly and shown to a handful of key people to\
    \ get feedback and iterate. When they represent users and stakeholders, this takes\
    \ the place of user outreach steps. This typically happens with a small team,\
    \ where each iteration has low-enough stakes that the team can safely follow the\
    \ feedback they get. Once a product has a high-enough profile or a large-enough\
    \ team, however, this approach tends to become risky or inadequate.\n\n2.  **A\
    \ very mature product with an expected sunset**  \n\n    Occasionally, products\
    \ live in a state where only small changes are required, usually based on ongoing\
    \ feedback. This is the case when most strategic decisions have already been baked\
    \ in and only small refinements are necessary for the remaining life cycle of\
    \ the product.\n\n## Where Does HCD Fit in Agile?\n\nWhen teams and organizations\
    \ transition from waterfall to Agile, figuring out how design fits into the new\
    \ delivery method can become confusing. Waterfall’s defined steps (requirements\
    \ gathering and design, etc.) give teams time to complete the discovery and ideation\
    \ phases. In Agile, it can be considerably less clear where these steps fit into\
    \ the picture.\n\nIt is important to understand from the outset that these activities\
    \ do not go into a single, neat, linear place when integrating Agile with HCD.\
    \ However, *this does not mean that they don’t take place*. Instead, it means\
    \ that each step is adaptive to the team’s ongoing activities. Just as there is\
    \ no one exactly right way to implement Agile, there is no one-size-fits-all way\
    \ to integrate Agile and HCD.\n\nSpecifically, when and how design steps occur\
    \ is going to depend on:\n\n*   The size of the product\n\n*   The scale of the\
    \ team/organization and the amount of interdependency between teams\n\n*   The\
    \ stakes of the release (more on this later)\n\n### Why Not Use HCD “Instead”\
    \ of Agile?\n\nIf teams can get information about what to make from end users\
    \ using HCD methods at the outset, why use Agile at all? Why not just build what\
    \ users have asked for and assume this will be successful? The answer is that\
    \ neither users nor product teams are infallible. It is simply impossible to know\
    \ that the team has built a good solution without getting user feedback, and there\
    \ will always be ways to make it better. Agile provides the framework and mindset\
    \ to do exactly that. Human-Centered Agile provides an improved “anything” from\
    \ the very first iteration because of its constant stakeholder inclusion.\n\n\
    ### How HCD Applies to the Agile Mindset\n\nHCD work is directed at the questions\
    \ of “right problem” and “right solution” in addition to evaluating built products\
    \ (“done right”). HCD is interested in understanding users’ attitudes, behaviors,\
    \ and expectations to better inform development work. Development work, by nature,\
    \ is confined to one solution, delivered as instructed (which is a different,\
    \ but important, perspective on “done right”). This happens throughout the delivery\
    \ life cycle, not just at a few specific moments.\n\nAgilists often consider the\
    \ Product Owner the first voice of the customer in deciding what to build, release,\
    \ and iterate upon. Then, some form of post-release evaluation and feedback provides\
    \ the second voice of the customer. [Table 5.1](#ch05.xhtml#_15064-4445_ch005_tab_001)\
    \ shows what team activity looks like in each of the design phases when using\
    \ traditional Agile processes (without incorporating HCD practices) compared with\
    \ Human-Centered Agile.\n\n[Table 5.1](#ch05.xhtml#R_15064-4445_ch005_tab_001)\
    \ A Side-by-Side Comparison of Agile without and with HCD\n\n|  || Traditional\
    \ Agile without HCD || Human-Centered Agile |\n\n| --- | --- | --- |\n\n| **Discovery**\
    \ || Teams receive user needs and desires based on the Product Owner’s interpretation,\
    \ which is typically a mix of business needs and limited direct user feedback.\
    \ || Teams learn and/or proactively validate user needs and desires, seeking to\
    \ understand specific attitudes and behaviors toward their proposed product vision\
    \ or product updates. At the same time, business needs are elicited from the Product\
    \ Owner and other business stakeholders. |\n\n| --- | --- | --- |\n\n| **Ideation**\
    \ || Teams work on whatever the Product Owner requests. Technical feasibility\
    \ and comfort are the most significant constraints on product design. Often, only\
    \ one solution is considered. || Teams use their learnings from discovery to conduct\
    \ collaborative ideation with the Product Owner and other team members, including\
    \ business analysts, developers, HCD practitioners, and possibly even users, to\
    \ generate and compare multiple concepts. |\n\n| **Concept Validation** || Teams\
    \ assume that their solution is valuable and that it can be iterated upon after\
    \ release. || Teams subject their solution concepts to feedback from users for\
    \ validation, to support a pivot-or-persevere decision at an early stage in the\
    \ process. |"
  fmt: "\nHCD shares an important philosophical foundation with Agile, upon which\
    \ all integration of the two approaches will rest: It is best to learn about product\
    \ and delivery efforts in the simplest, fastest, and cheapest way possible. [Figure\
    \ 5.2](#ch05.xhtml#_15064-4445_ch005_Figure_002) shows how risk is mitigated by\
    \ small increments of early value delivery in an Agile project.\n\n## Organic\
    \ Overlaps between Agile and HCD\n\nAgilists are familiar with the “fail fast,\
    \ fail often” approach. In Agile, it is considered a good thing for a team to\
    \ spend a small amount of time developing a solution that fails so they can quickly\
    \ pivot to testing an alternate solution. The very idea is to slice product delivery\
    \ into small enough pieces that problems with the team’s underlying assumptions\
    \ can be tested quickly, issues that show up in development can be identified\
    \ and fixed, and the learning can happen in a way that doesn’t jeopardize entire\
    \ product launches. A certain amount of rework (called refactoring by Agilists)\
    \ is accepted in the name of delivering quickly and taking in real feedback rather\
    \ than being able to see around every possible corner.\n\nHCD is a practice built\
    \ around avoiding many of the same risks, although sometimes at different stages\
    \ of delivery, and addressing additional common risks as well.\n\n*   By identifying\
    \ and validating user needs, Agile teams mitigate the risk of spending time building\
    \ things that users don’t actually need or want. Chasing unnecessary features\
    \ is an incredibly expensive proposition.\n*   By validating designs with the\
    \ users of their products at key points, Agile teams minimize rework based on\
    \ unsuccessful design approaches or poor assumptions.\n*   By evaluating products\
    \ after they are delivered, Agile teams ensure that their investment in further\
    \ product improvement is well targeted.\n\nEven without formally incorporating\
    \ Human-Centered Design (HCD), Agile classically already integrates *some* HCD\
    \ as part of its approach. In the cycle of `build > evaluate > iterate`, the evaluation\
    \ stage is where all HCD takes place. That is to say, even if there is no engagement\
    \ with users in discovery or ideation, there is an expectation that user feedback\
    \ is gathered when products are released and that this feedback provides a team\
    \ with improvements. In a sense, the evaluation stage stands in for discovery\
    \ (users will now tell teams if they are solving a problem they don’t have), concept\
    \ validation (users will tell teams if something was a bad idea), and solution\
    \ validation (users will tell teams if there are specific places where they are\
    \ having problems).\n\nFor certain kinds of projects, the evaluation phase can\
    \ be enough to keep the team moving in a good direction.\n\nHere are two prime\
    \ examples of this:\n\n1.  **The very beginning stages of a new product or feature,\
    \ iterated rapidly**\n    The easiest way to locate the overlaps between Agile\
    \ and HCD is by considering what can happen when new projects or features get\
    \ spun up. Often, an idea is expressed as one or two important things that need\
    \ to happen then developed very quickly and shown to a handful of key people to\
    \ get feedback and iterate. When they represent users and stakeholders, this takes\
    \ the place of user outreach steps. This typically happens with a small team,\
    \ where each iteration has low-enough stakes that the team can safely follow the\
    \ feedback they get. Once a product has a high-enough profile or a large-enough\
    \ team, however, this approach tends to become risky or inadequate.\n\n2.  **A\
    \ very mature product with an expected sunset**\n    Occasionally, products live\
    \ in a state where only small changes are required, usually based on ongoing feedback.\
    \ This is the case when most strategic decisions have already been baked in and\
    \ only small refinements are necessary for the remaining life cycle of the product.\n\
    \n## Where Does HCD Fit in Agile?\n\nWhen teams and organizations transition from\
    \ waterfall to Agile, figuring out how design fits into the new delivery method\
    \ can become confusing. Waterfall’s defined steps (requirements gathering and\
    \ design, etc.) give teams time to complete the discovery and ideation phases.\
    \ In Agile, it can be considerably less clear where these steps fit into the picture.\n\
    \nIt is important to understand from the outset that these activities do not go\
    \ into a single, neat, linear place when integrating Agile with HCD. However,\
    \ *this does not mean that they don’t take place*. Instead, it means that each\
    \ step is adaptive to the team’s ongoing activities. Just as there is no one exactly\
    \ right way to implement Agile, there is no one-size-fits-all way to integrate\
    \ Agile and HCD.\n\nSpecifically, when and how design steps occur is going to\
    \ depend on:\n\n*   The size of the product\n*   The scale of the team/organization\
    \ and the amount of interdependency between teams\n*   The stakes of the release\
    \ (more on this later)\n\n### Why Not Use HCD “Instead” of Agile?\n\nIf teams\
    \ can get information about what to make from end users using HCD methods at the\
    \ outset, why use Agile at all? Why not just build what users have asked for and\
    \ assume this will be successful? The answer is that neither users nor product\
    \ teams are infallible. It is simply impossible to know that the team has built\
    \ a good solution without getting user feedback, and there will always be ways\
    \ to make it better. Agile provides the framework and mindset to do exactly that.\
    \ Human-Centered Agile provides an improved “anything” from the very first iteration\
    \ because of its constant stakeholder inclusion.\n\n### How HCD Applies to the\
    \ Agile Mindset\n\nHCD work is directed at the questions of “right problem” and\
    \ “right solution” in addition to evaluating built products (“done right”). HCD\
    \ is interested in understanding users’ attitudes, behaviors, and expectations\
    \ to better inform development work. Development work, by nature, is confined\
    \ to one solution, delivered as instructed (which is a different, but important,\
    \ perspective on “done right”). This happens throughout the delivery life cycle,\
    \ not just at a few specific moments.\n\nAgilists often consider the Product Owner\
    \ the first voice of the customer in deciding what to build, release, and iterate\
    \ upon. Then, some form of post-release evaluation and feedback provides the second\
    \ voice of the customer. [Table 5.1](#ch05.xhtml#_15064-4445_ch005_tab_001) shows\
    \ what team activity looks like in each of the design phases when using traditional\
    \ Agile processes (without incorporating HCD practices) compared with Human-Centered\
    \ Agile.\n\n[Table 5.1](#ch05.xhtml#R_15064-4445_ch005_tab_001) A Side-by-Side\
    \ Comparison of Agile without and with HCD\n\n| || Traditional Agile without HCD\
    \ | Human-Centered Agile |\n| --- | --- | --- |\n| **Discovery** | Teams receive\
    \ user needs and desires based on the Product Owner’s interpretation, which is\
    \ typically a mix of business needs and limited direct user feedback. | Teams\
    \ learn and/or proactively validate user needs and desires, seeking to understand\
    \ specific attitudes and behaviors toward their proposed product vision or product\
    \ updates. At the same time, business needs are elicited from the Product Owner\
    \ and other business stakeholders. |\n| --- | --- | --- |\n| **Ideation** | Teams\
    \ work on whatever the Product Owner requests. Technical feasibility and comfort\
    \ are the most significant constraints on product design. Often, only one solution\
    \ is considered. | Teams use their learnings from discovery to conduct collaborative\
    \ ideation with the Product Owner and other team members, including business analysts,\
    \ developers, HCD practitioners, and possibly even users, to generate and compare\
    \ multiple concepts. |\n| --- | --- | --- |\n| **Concept Validation** | Teams\
    \ assume that their solution is valuable and that it can be iterated upon after\
    \ release. | Teams subject their solution concepts to feedback from users for\
    \ validation, to support a pivot-or-persevere decision at an early stage in the\
    \ process. |\n"
  trans: "\n\nHCD（以人为中心的设计）与敏捷开发共享一个重要的哲学基础，这两种方法的整合都基于此：即以最简单、最快、最廉价的方式了解产品和交付工作。图\
    \ 5.2 展示了在敏捷项目中，如何通过小增量的早期价值交付来降低风险。\n\n## 敏捷与 HCD 之间的有机重叠\n\n敏捷实践者熟悉“快速失败，经常失败”的方法。在敏捷开发中，团队花费少部分时间开发一个失败的方案被认为是一好事，这样他们就可以快速转向对另一种方案的测试。其核心理念是将产品交付切分成足够小的碎片，以便能够快速测试团队底层假设中存在的问题，使开发过程中出现的问题能够被识别并修复，并让学习在不危及整个产品发布的情况下进行。为了快速交付并获取真实反馈，接受一定程度的重工作（敏捷实践者称为重重构），而不是试图预见到每一个可能的细节。\n\
    \nHCD 是一项旨在避免许多相同风险的实践，尽管这些风险有时出现在交付的不同阶段，同时它处理了额外的共同风险。\n\n*   通过识别和验证用户需求，敏捷团队降低了浪费时间构建用户实际上并不需要或想要的东西的风险。追逐不必要的功能是一个极其昂贵的提议。\n\
    *   通过在关键点与产品用户验证设计，敏捷团队最大限度地减少了基于不成功的设计方案或错误假设而导致的重工作。\n*   通过在产品交付后进行评估，敏捷团队确保了其对进一步改进产品的投资具有良好的针对性。\n\
    \n即使没有正式地引入以人为中心的设计（HCD），敏捷开发在传统上已经将*部分* HCD 整合作为其方法的一部分。在`构建 > 评估 > 迭代` 的循环中，评估阶段是所有\
    \ HCD 发生的地方。也就是说，即使在发现或构思阶段没有与用户接触，也预期在产品发布时收集用户反馈，并让这些反馈为团队提供改进。在某种意义上，评估阶段代表了发现（用户现在会告诉团队他们解决的是否是一个并不存在的问题）、概念验证（用户会告诉团队某个是否是一个坏主意）以及方案验证（用户会告诉团队在哪些特定位置存在问题）。\n\
    \n对于某些类型的项目，评估阶段可能足以让团队在正确的方向上进行。\n\n以下是其中的两个典型例子：\n\n1.  **新产品或功能的极早期阶段，进行快速迭代**\n\
    \    寻找敏捷与 HCD 之间重叠部分最简单的方法是考虑当新项目或功能启动时会发生什么。通常，一个想法被表达为一个两个需要发生的重要事项，然后被快速开发并展示给少数关键人物以获取反馈并进行迭代。当这些人代表用户和利益相关者时，这就取代了用户调研的步骤。这通常发生在小团队中，每次迭代的风险足够低，使得团队可以安全地遵循所获得的反馈。然而，一旦产品具有足够的知名度或团队足够大，这种方法往往会变得具有风险或不足。\n\
    \n2.  **预期将退市的非常成熟的产品**\n    偶尔，产品处于一种只需要微小更改的状态，通常是基于持续的反馈。当大多数战略决策已经确定，只需要对产品的剩余生命周期进行微调时，情况就是如此。\n\
    \n## HCD 如何融入敏捷开发？\n\n当团队和组织从瀑布模型转型到敏捷开发时，弄清楚设计如何融入新的交付方法可能会变得令人困惑。瀑布模型的定义步骤（需求收集和设计等）为团队提供了完成发现和构思阶段的时间。在敏捷开发中，这些步骤如何融入大图可能变得相当不清晰。\n\
    \n从一开始就必须理解，在将敏捷与 HCD 整合时，这些活动并不会进入一个单一、整洁的线性位置。然而，*这并不意味着它们没有发生*。相反，这意味着每一步都对团队正在进行的活动进行适应。就像没有一种完全正确的实现敏捷的方法一样，也没有一种通用的方法来整合敏捷和\
    \ HCD。\n\n具体来说，设计步骤何时以及如何发生将取决于：\n\n*   产品规模\n*   团队/组织的规模以及团队之间的相互依赖程度\n*   发布的风险程度（后文将详细介绍）\n\
    \n### 为什么不用 HCD “替代”敏捷开发？\n\n如果团队从一开始就能通过 HCD 方法从终端用户那里获取要做什么的信息，为什么还要使用敏捷开发？为什么不直接构建用户要求的东西并假设这会成功呢？答案是，用户和产品团队都不是无懈可击的。如果不获取用户反馈，根本不可能团队是否构建了一个良好的解决方案，而且总会有方法让它变得更好。敏捷提供了恰恰那样的框架和心态。以人为中心的敏捷开发由于其持续包含利益相关者，从第一次迭代开始就提供了改进的“任何东西”。\n\
    \n### HCD 如何应用于敏捷思维\n\nHCD 工作不仅关注“正确的问题”和“正确的解决方案”问题，还关注评估已构建的产品（“做得很对”）。HCD 有兴趣于理解用户的态度、行为和期望，以更好地指导开发工作。开发工作本质上受限于一种解决方案，并按照指示交付（这是对“做得对”的另一个不同但重要的视角）。这贯穿整个交付生命周期，而不仅仅是几个特定时刻。\n\
    \n敏捷实践者通常认为产品主（Product Owner）是决定构建、发布和迭代内容的客户第一个声音。然后，发布后的某种形式的评估和反馈提供了客户的第二个声音。表\
    \ 5.1 显示了在使用传统敏捷流程与以人为中心的敏捷开发相比时，每个设计阶段的团队活动情况。\n\n表 5.1 不带 HCD 的敏捷与带 HCD 的敏捷对比表\n\
    \n| || 不带 HCD 的传统敏捷 | 以人为中心的敏捷 |\n| --- | --- | --- |\n| **发现** | 团队根据产品主的解释接收需求和期望，这通常是业务需求和有限用户反馈的混合。\
    \ | 团队学习和或主动验证用户需求和期望，寻求对建议的产品愿景或更新的具体态度。同时，从产品主和其他业务利益相关者处获取业务需求。 |\n| --- |\
    \ --- | --- |\n| **构思** | 团队根据产品主的要求工作。技术可行性和舒适度是产品设计最大的限制因素。通常只考虑一种解决方案。 | 团队利用发现阶段的知识，与产品主和其他团队成员（包括业务分析师、开发、HCD\
    \ 从业人员以及可能的用户）进行协作构思，生成并比较多个概念。 |\n| --- | --- | --- |\n| **概念验证** | 团队假设他们的解决方案是有价值的，并且发布后可以进行迭代。\
    \ | 团队通过用户反馈对其解决方案概念进行受验证，以支持在流程早期做出转型或坚持的决策。 |\n\n"
