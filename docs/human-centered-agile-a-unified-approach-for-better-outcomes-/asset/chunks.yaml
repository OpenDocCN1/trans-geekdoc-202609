- raw: "The purpose of a handoff step is to bring the newer team into the life cycle\
    \ with a complete understanding of the work that has already been done so the\
    \ incoming team can be confident in the decisions that have been made and the\
    \ work that has already been accomplished, is in agreement with any work that\
    \ has been identified, and can identify unresolved questions. This activity puts\
    \ the team on the same page from the moment they are engaged and ensures that\
    \ delivery decisions or any adjustments are made with the original goals and intended\
    \ outcomes in mind.\n\n#### What a Good Handoff Includes\n\nThe handoff should\
    \ include the following items, which should have been generated in the problem\
    \ definition phase of work. If there are gaps in this information, it becomes\
    \ incumbent on the new team to make sure they are filled.\n\n*   The goal of effort,\
    \ described in a user-centric way\n\n*   Outcome-based success criteria so any\
    \ team taking on a feature for delivery understands what will be evaluated for\
    \ success\n\n*   Documentation of any user insights gathered in support of the\
    \ work\n\n*   Documentation of any validation efforts undertaken to this point\n\
    \n*   Other information that provides constraints on what can be delivered, such\
    \ as: \n\n    *   – known technical constraints\n\n    *   – known impacts (systems,\
    \ processes, or in-flight work that will have to adapt to newly delivered solutions)\n\
    \n    *   – known dependencies (systems, processes, or in-flight work that the\
    \ team needs as a prerequisite to delivering the solution)\n\n    *   – key dates\
    \ and their business drivers\n\n### Team Formation Success Factors\n\nAn often-overlooked\
    \ component of team success is team formation itself and the activities that precede\
    \ launch. Agile Coaches often look themselves in the mirror and ask why the team\
    \ they are coaching isn’t making the sort of progress they might expect. The reason\
    \ is that there is prework needed to ensure the team’s success that needs to be\
    \ done long in advance of team launch. Without that up-front work, even the best\
    \ coaching will have only a marginal effect.\n\nDuring team formation, managers\
    \ must carefully consider not only charter (“What value and solutions do we want\
    \ this team to deliver?”) and technical domain (“What mix of technology specialists\
    \ do we need to deliver this value?”) but also critical ways of working issues\
    \ (“How will this team work together? What are their time zones? Do they speak\
    \ the same language? Do we have the basic building blocks of a real team with\
    \ these individuals, or would they just be a group of people who work together?”).\n\
    \n“Forming, storming, norming, and performing”[^(13)](#fn13)\n\n*   What product\
    \ will this team be supporting?\n\n*   How does the team’s product fit into the\
    \ enterprise strategy?\n\n*   Does the product have a clearly defined roadmap?\n\
    \n*   Who are the users this team will be supporting?\n\n*   Do the individuals\
    \ on the team have the time to dedicate to this product, or are they allocated\
    \ to another product (or perhaps several)?\n\n*   Does the team have the automation\
    \ and tooling they need to be successful?\n\nIt’s easy to see how overlooking\
    \ these foundational questions and jumping right into team launch can be risky.\
    \ Research shows that 60% of a team’s success can be directly attributed to prelaunch\
    \ activities and 30% can be attributed to the launch itself.[^(14)](#fn14)\n\n\
    The chief success factors for incorporating HCD into Agile programs are:\n\n####\
    \ Executive Support\n\nWithout an engaged and supportive Executive, even properly\
    \ launched teams with the best practices cannot succeed. Ongoing support of a\
    \ powerful Executive champion is necessary to ensure that the work of the teams\
    \ is aligned with the enterprise strategy. Beyond that, Executives are uniquely\
    \ situated to support and anchor the mindset shift that is needed for Human-Centered\
    \ Agile (or any Agile, really) to succeed. Teams need to know that it really is\
    \ OK for them to “fail fast.” They need to work in a psychologically safe environment\
    \ where they can experiment and truly question assumptions. Team members also\
    \ need not be multiply allocated in order to be maximally effective. Only an Executive\
    \ can ensure all these things.\n\n#### Clear Expectations for Self-Management\n\
    \nThe whole idea of Agile is for teams to manage themselves. However, before teams\
    \ start work, a clear understanding of management’s expectations of what the team\
    \ will deliver as well as an understanding of any constraints or limitations,\
    \ such as other work they will be expected to perform. Every team has boundaries,\
    \ and it is important they be understood by all from the beginning.\n\n**Team\
    \ Working Agreements**—At the time a team is formed, they should codify their\
    \ standards, expectations, and norms in the form of a “team working agreement.”\
    \ These documents typically spell out the team’s definition of done, when and\
    \ where their daily standups will be held, the norms and expectations for shared\
    \ and collaborative tools (such as application life-cycle management tools), and\
    \ any other information useful in managing expectations. This working agreement\
    \ should be revisited periodically at retrospectives.\n\n**Daily Interactions\
    \ with an Engaged Product Owner**—The active, hands-on engagement from a knowledgeable\
    \ Product Owner is another key success factor. Because there is no requirements\
    \ document, Agile teams engage in a series of experiments and need feedback on\
    \ them. They will have questions, and since the Product Owner has the ultimate\
    \ responsibility to accept the team’s work. Having easy access to the Product\
    \ Owner means teams don’t have to wait for feedback; they make faster decisions,\
    \ pivot with greater ease, and deliver faster than teams that have to wait for\
    \ this feedback.\n\n#### A Backlog of Problems to be Solved, Not a Task List\n\
    \nThe most successful teams are those who are given a set of goals and then left\
    \ to discover the best way of achieving those themselves and having a backlog\
    \ that allows them to do this is key. The more constraints the team is given,\
    \ the less freedom they have to experiment and innovate. Sometimes teams will\
    \ have what amounts to a requirements document (complete with painful detail about\
    \ how everything is to be delivered). That’s a classic example of an organization\
    \ “waterfalling” a sprint.\n\n#### Autonomy and Purpose\n\nThe way to get maximum\
    \ productivity out of knowledge workers is to give them autonomy to innovate.\
    \ Articulate the “why” and “what” then get out of their way. Let them fail, repeatedly,\
    \ if necessary. Let them experiment and innovate. Most important, let them be\
    \ in control of the “how.” Teams who are overly constrained in their approach\
    \ by management risk applying the veneer of Agile to waterfall methods.\n\nPurpose\
    \ goes hand in hand with autonomy on the hit parade of team success factors. Knowledge\
    \ workers thrive on having a purpose bigger than themselves. Leadership must ensure\
    \ that they share a common understanding of this purpose. For more information\
    \ about how autonomy, mastery, and purpose are the keys to unlocking innovation\
    \ and productivity in knowledge workers, read *Drive* by Dan Pink.[^(15)](#fn15)\n\
    \n#### Expectation of Team Stability\n\nAgile teams tend not to be optimally productive\
    \ at the outset. Bruce Tuckman identified the “developmental sequence of small\
    \ groups” model of “forming, storming, norming, and performing” in 1965.[^(16)](#fn16)\n\
    \n#### Team Participation in HCD Activities\n\nWriting about how drop-in teams\
    \ aren’t enough in *The Science and Impact of Organizational Change*, Paul Gibbons\
    \ asserts, “Change expertise is too important to be left to the specialists.”[^(17)](#fn17)\n\
    \n## Moving Past Small Team Clusters\n\nAs programs grow in size past the point\
    \ where business opportunities can be met by a small cluster of teams (more than\
    \ about 50 total people), several patterns for dysfunction emerge.\n\n### Product\
    \ Owners with Competing Visions"
