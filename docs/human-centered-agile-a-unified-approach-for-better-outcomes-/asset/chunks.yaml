- raw: '*   **Impression Tests:** A user is shown representations of key interaction
    points (such as a home page) and asked what they understand to be the purpose
    and behaviors of what they see. This helps teams understand whether the arrival
    experience is clear for users and whether users have a clear idea of next steps
    and anticipated value. The latter is used to gather attitudinal feedback on the
    expected value that a team is delivering.


    *   **Paraphrase Tests:** A user is asked to restate their understanding of what
    the experience is offering. This test is specific to the language used, whether
    as labels for content or navigation or for an explanation and description that
    the user needs to understand.


    *   **Card Sorting:** A user is asked to organize information in ways that are
    relevant to them. Depending on the specific methodology, this may also include
    adding their own expected content types and titling content groups. This method
    is particularly useful for understanding user mental models of complex content
    structures or interaction sets.


    *   **Task Completion Tests:** The user is shown an end-to-end representation
    of a solution and asked to accomplish something very specific. This method is
    useful to see how easily they go from start to finish. During concept validation,
    this method is seeking to understand whether there is a good fit between the intended
    experience and the outcome the user needs.


    *   **Feature Ranking:** A user is asked to rank multiple potential solutions
    to be delivered by a product. This method is good for understanding and validating
    user interest in specific features, particularly for prioritization purposes.
    This method can also reveal red flags in proposed features.


    Preparing for any of these efforts will include identifying the tools being used
    for the test, generating a test script, and planning a reporting methodology that
    is suited to the audience of the results.


    #### Recruit Research Participants


    Recruitment is not to be underestimated as one of the heaviest lifts in any research
    effort. The team needs to identify the appropriate participant characteristics
    (e.g., teams creating something geared toward first-time users won’t want to test
    with experienced users).


    For moderated tests, those candidates need to be contacted, scheduled, and granted
    access to whatever testing platforms are being used all need to be accounted for.
    Some organizations will have a separate research operations team to handle this
    work; for those that do not, this step should not be taken for granted. Finally,
    anyone scheduling sessions needs to remember that facilitators and note-takers
    need time to prepare ahead of a session and time to consolidate notes after a
    session.


    #### Conduct Research Efforts


    Conducting the research effort might mean setting up an asynchronous test, in
    which case this step requires little work; monitoring participation; and supporting
    participants if they have questions or issues. If the research effort includes
    any moderated or in-person time with users, it will take more time. It is also
    beneficial to include not just HCD practitioners in this step—when other team
    members act as notetakers and observers, their participation also reinforces the
    idea that creating good outcomes is a team responsibility, and the insights resonate
    across the entire team.


    #### Synthesize Research Findings


    Finally, collecting and analyzing results is an effort that takes time; raw results
    may be interesting but are not useful for most stakeholders without analysis.
    The HCD practitioners doing this will need to know what deliverable is expected,
    who the audience is, and what decisions are being supported. With this information,
    the team can effectively report their insights.


    ### ***Research Artifacts of Concept Validation***


    **Test Plan:** This is the document that describes the purpose and methodology
    of the test itself and should be in place by the time any research is kicked off.
    The test plan captures the learning goals and the methodology used. It can also
    include logistics, such as the recruitment strategy and scheduling information.


    **Test Script:** For moderated research, having a script orients participants
    to the research session, giving them an understanding of what they are about to
    do and why. It also ensures that the team is gathering data properly across all
    their participants—for example, that the same questions are being asked in the
    same way. This makes the data more consistent and useful during synthesis.


    **Test Data:** Whatever is method used, there is a set of raw data that is captured
    from the research. This set might be interview notes, participant results from
    a card sort, or raw survey numbers.


    **Insights:** The synthesis process produces insights—the individual, actionable
    observations that get used to make product design decisions.


    **Summary of Findings:** In addition to specific insights, almost every research
    effort produces summarizing documentation—a narrative explanation of what was
    learned, including supporting evidence. There can be multiple summaries from a
    single effort (e.g., an executive summary *and* a detailed report, depending on
    the audience addressed and their needs).


    ### ***Design Activities and Artifacts during Concept Validation***


    ![](Images/pg55.jpg)


    Because concept validation is primarily a research activity, design activity is
    limited to any design refinement that is required for the prototypes being tested.
    Designers need to make sure that any designs have enough information for test
    participants to understand and provide meaningful feedback.


    #### Design Refinement


    The designs for solution candidates that came out of ideation should have created
    a shared understanding within the team. This does not necessarily mean they will
    be understandable for users or ready for research. There can still be design work
    required to create a product suitable for users that can be used for testing and
    organizing the designs as needed by the test methodology. For example, these changes
    might include changing the fidelity of the design so that the users have enough
    context, the language and content being shown to better match user vocabulary
    or creating a series of specific screens to represent a specific interaction to
    validate that users understand how the solution is intended to work.


    # Chapter 4HCD Activities and Artifacts from Refinement through Evaluation


    DOI: [10.4324/9781003188520-6](https://doi.org/10.4324/9781003188520-6)


    This chapter describes the team-focused benefits provided by Human-Centered Design
    (HCD) once the team has chosen solutions to deliver. It helps to understand the
    types of activities that occur throughout the overall delivery process, which
    includes refinement and solution validation, and the specific purpose these activities
    serve.


    The activities are designed to make sure that teams are delivering their solution
    in a clear and usable way (done right). These activities should help teams find
    gaps and issues that users encounter, allowing them to lower the risk of costly
    issues at release, and inform their improvement and maintenance as they look forward.


    ![](Images/pg59.jpg)


    ## HCD and Refinement


    During refinement, the team comes to a clear, shared understanding of what exactly
    is going to be delivered to users. For teams working in Agile, refinement is already
    a familiar activity, in the form of story writing and refinement.


    From an HCD perspective, refinement focuses on identifying and making any remaining
    design decisions that will get picked up by the team for implementation and providing
    any visual references needed to support story understanding and agreement. Additionally,
    during refinement teams identify the specific ways in which their solutions will
    be measured for success during evaluation.'
