- raw: 'The more the partners reviewed the gathered feedback and brainstormed solutions,
    the more they began to understand their competitive position. Building model planes
    was part of the pleasure, regardless of the age or skill of the customer. People
    enjoyed the experience (and nostalgia) of building a plane more than just buying
    one. William recalled reading about how Betty Crocker learned that requiring an
    egg or other simple ingredient for their baking mix was more successful than making
    it the simplest possible product since this engaged the customers.[^(72)](#fn72)


    They also realized that, by providing their customers with this experience, their
    products were cheaper to produce. Tom and William had a sense that if they got
    more expensive, they might have to consider how their planes compare, as an experience,
    to more expensive electronics. It seemed that “prebuilts” were a riskier direction
    than first expected.


    At this point, Tom and William set goals around their new findings. They wanted
    to make and test at least one new product that suited their newly identified customers
    and see if they could measure and improve the happiness of their existing customers
    from version to version. They also wanted to identify ways to improve each *step*
    of their customers’ experience, even if only in small ways.


    Laurie kept drilling into them the non-intuitive portion of having a “benefit
    hypothesis” for each new feature idea. This was concept validation: The strategy
    for doing so was to confirm the hypothesis early enough to allow for pivoting
    toward another approach if the early work did not prove successful. Laurie also
    preached to work in small batches, get feedback rapidly, and improve continuously.


    ## DIY Fly Creates New Products


    Tom and William decided an old-fashioned brainstorming session was necessary.
    At Laurie’s suggestion, they rented a conference space to accommodate employees,
    customers, and potential customers so that they could have a large room with plenty
    of whiteboard space for ideas. They booked a whole day and had quality catered
    food brought in for lunch and snacks. As they held more of these meetings, they
    learned the immutable law of such events; that the cost of catering *good* food
    (not just pizza and doughnuts) was worth every penny and yielded much greater
    participant (and employee) engagement and happiness.


    Laurie advised that they take a more modern approach than simply rolling everyone
    into a conference room and asking, “What ideas do you have?” Heeding her advice,
    they spent the first hour reviewing what was known about their customers. They
    talked through the personas they’d created, making sure all agreed on what the
    customer journey looked like. Laurie had also invited customers to phone in and
    share their favorite and least favorite parts of the experience of buying and
    flying the planes.


    Next, Tom and William posted their goal: to have at least three overall new products
    or improvements for each persona, with an aim toward hitting as many of the “key
    moments” as possible. They phrased the moments as questions with specific goals,
    asking such things as how they could make building easier for younger kids and
    add more fun into “anticipation.”


    They started by identifying some of their inspirations—they each brought in an
    example of a product or experience that they really loved and explained why they
    loved it. Then, they did a creative exercise designed to identify aspirations:
    They each wrote themselves a “postcard from the future” (a congratulatory postcard
    from next year) about what they’d accomplished and then shared them. Finally,
    to get into a spirit of creative freedom, they did an exercise called “bad ideas”
    during which they each tried to come up with the worst new-product idea they could
    think of that still somehow met an objective. (This got them talking about what
    made ideas “good” or “bad” to begin with.) This helped them move to individual
    ideation work and then onto collaborative work on potential solutions for these
    identified goals. They discussed each other’s work and then broke into different
    teams to analyze further.


    The group quickly generated “backlogs” for each proposed product or modification.
    They had thought up a surprising number of “obvious” improvements, such as providing
    instructions in other languages and offering a sticker book for decorating the
    planes, allowing the younger kids to personalize even prebuilt models. Once all
    the ideas were captured, they took pictures for their records. There was no way
    to achieve everything on their list, at least not all at once, so the next day,
    they assigned a name to each new prominent feature or product and ranked them
    on their overall potential.


    Tom had read about a quick, “lightweight, and actionable” way for them to separate
    their backlogs into four categories called the MoSCoW method—must have, should
    have, could have, and won’t have.


    The MoSCoW method[^(73)](#fn73)


    ![Figure 16.2 The MOScOW method of grouping the backlog into four buckets.](Images/Figure16_2.jpg)


    [Figure 16.2](#ch16.xhtml#R_15064-4445_ch016_Figure_002) The MOScOW method of
    grouping the backlog into four buckets.


    ![Figure 16.3 Risk vs. value in a 2 × 2 grid.](Images/Figure16_3.jpg)


    [Figure 16.3](#ch16.xhtml#R_15064-4445_ch016_Figure_003) Risk vs. value in a 2
    × 2 grid.


    The MoSCoW method and dot voting had given them the momentum and focus to eliminate
    the items in their backlog that weren’t of value, but they still needed help prioritizing
    the features within each category. Laurie suggested a simple matrix for balancing
    risk against value, as shown in [Figure 16.3](#ch16.xhtml#_15064-4445_ch016_Figure_003).
    Each feature in the backlog, starting with the must-have category, would be analyzed
    based on customer value delivered and potential risk, whether that be the risk
    inherent in building the product, monetary risk, or simply the risk of not doing
    it.


    Features were discussed, one by one, and given a value for several different facets:


    1.  **Customer value**—How much would it improve a customer’s experience? How
    many customers will it affect?


    2.  **Business value**—How does it lead to future sales or revenue?


    3.  **Effort**—How long would it take to make? How many people are needed?


    4.  **Risk**—How confident is the team in all the preceding assessments? What
    is the likelihood of their assumptions being wrong, and what is the outcome if
    they are?


    Since this was a small team, they paid specific attention to features requiring
    skills that would have to be filled by outside sources due to their current bandwidth
    and skill sets. The team used the first three scores to reorganize features by
    priority. Instructional videos? High value, low cost, as long as they didn’t mind
    production values that felt a little rough around the edges. Must have! An app
    that helps users store flight information? Between the cost of new measurement
    devices and the software know-how needed to build it, that idea did not get off
    the ground.


    One team member suggested building the anticipation stage by sending out an email
    containing the weather forecast and park/school locations based on the shipping
    address several days ahead of the expected product arrival. That idea went into
    the “could have” category. They didn’t have a software developer on staff, but
    it sounded like something worth checking out. Items with the highest risk required
    additional learning before the team could decide how to proceed.


    Other high-value items with more conventional risks (“we know what to do, but
    it’s hard to tell how long it will actually take”), along with any “low-hanging
    fruit,” were first up for production. For the risky items, they installed reevaluation
    points so they did not get too far along without checking in (Was progress happening
    faster or slower than expected? Were there still unresolved issues that could
    kill the work?).


    ## The Backlog Refinement (and Roadmapping)'
