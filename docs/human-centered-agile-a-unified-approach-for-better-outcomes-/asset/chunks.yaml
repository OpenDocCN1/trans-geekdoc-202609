  trans: '

    在 Laurie 的帮助下，他们制定了一项招聘策略，旨在从他们确定的每个细分市场中持续吸引现有和潜在客户：这些细分市场包括：爱好者、高级爱好者、幼年儿童的父母，以及
    STEM 教师和学生。Laurie 帮助他们为产品生成了一套满意度指标，并要求焦点小组和个人访谈对象对这些指标进行评分。


    他们要求客户：


    *   填写李克特尺度量表（即 1–5 分），对他们之前识别的每个步骤的体验进行评分。

    *   提供三个描述性形容词，可以通过分析这些词来收集对产品的情感，并了解用户特别看重什么。

    *   提供关于他们如何使用飞机的自我报告（回答诸如“你多久带飞机出去飞一次？”、“你花费了多长时间？”他们甚至问：“你会录制飞行视频并在稍后观看吗？”，以了解他们对视频录飞的兴趣）。


    拥有一套稳定的指标使他们能够评估产品改进的成效。通过频繁且定期地进行访谈，他们能够在需要时快速调整。与目标市场的这些面对面互动也是新产品创意的常青源泉。能够反复寻求反馈有助于他们优先考虑即将开展的新工作，找到改进已良好工作方面的领域，并直接了解新产品在客户中的反响如何。例如，他们发现让客户帮助优先排序他们的待办事项（backlog）非常有价值，奇奇的是，如果没有用户的洞察，Tom
    和 William 绝不会以同样的方式对其进行优先级排序。有时他们会发现，一个新功能对用户的吸引力远不如对现有功能的改进。这种洞察对他们来说如金子般，因为这让他们能够持续关注那些为用户提供最大效用的项目。


    在年底，随着几款新产品的开发进行，Tom 和 William 开始直接与客户测试新产品的原型。他们的第一次测试非常有趣——在投入量产之前，他们想看看小手在操作他们的“小手专用”飞机时实际表现如何——毕竟，观察孩子对这些新飞机表现如何的唯一方法就是让他们去操作这些新飞机。他们担心某些部分使用的厚纸板会撕裂，但事实证明这并不是问题。贴纸大受欢迎！（孩子们可以留着原型飞机。“这是他们应得！”Tom
    笑着说。当然，父母们还是收到了礼品卡。）


    ## 第 2–3 年


    随着时间的推移，DIY Fly 继续增长，并保持专注于为客户提供更好的价值。通过一些研究和阅读，他们发现许多精益制造（Lean manufacturing）实践是对他们在业务增长过程中采用的敏捷产品开发（Agile
    product development）实践的完美补充。他们完善了改进质量的流程，包括“质量小组”，在小组中，所有员工无论职位如何都处于平等地位，可以与管理层进行开放讨论，并被鼓励针对问题症状以及根源解决方案进行头脑风暴。他们将所有工作展示在一个巨大的“工作墙”上，最重要的是，将质量融入到他们所做的一切工作中，使其成为文化的一部分，而不是试图在流程后期通过检查来实现质量。

    '
