- raw: "Ideation is the phase during which teams generate multiple *high-level* solution\
    \ concepts. These concepts need to be robust enough for the team to do a rough\
    \ evaluation of the effort and risk of each solution candidate and to decide which\
    \ solution candidates to validate with users. This is so the team can make informed\
    \ decisions about which solution is the best fit for the problem being solved.\
    \ At this point, the big picture of the solution is clear, but the details may\
    \ not be.\n\nThere are fundamentally two paths that teams choose when trying to\
    \ get to agreement on the basic design of a product—collaborative design workshops\
    \ and conceptual designs.\n\n#### Collaborative Design Workshops\n\nIn this scenario,\
    \ the Designer works with other stakeholders (sometimes including users themselves)\
    \ to collectively brainstorm solution possibilities. Workshops can vary a great\
    \ deal in structure and duration, but the goal is to give teams and stakeholders\
    \ a shared understanding of the purpose of the solution and problems to be solved\
    \ and then to set them loose creatively (within whatever constraints apply) in\
    \ solving those problems.\n\n#### Independent Design\n\nIn this scenario, the\
    \ Designer works independently using discovery artifacts to create design approaches\
    \ that are presented to the Product Owner and team for feedback. At this design\
    \ stage, major/key steps are considered and limited to so-called happy path activities\
    \ (without exploring edge cases or error handling). The solution concepts are\
    \ clear enough to initiate discussions and begin receiving feedback about the\
    \ level of effort required for delivery and overall user value.\n\n#### Experience\
    \ Risk Evaluation\n\nOne of the advantages of collaborative ideation, which includes\
    \ multiple stakeholders, is that experience risks emerge early. Human-Centered\
    \ Agile practitioners are focused on risks regarding whether a team is building\
    \ unwanted or unsatisfying solutions, but collaborative ideation also promotes\
    \ early awareness of other risks (technical risks, policy risks, etc.) that can\
    \ surface and be captured and addressed.\n\n### ***Design Artifacts of Ideation***\n\
    \n![](Images/pg47.jpg)\n\nA **storyboard** (and its cousin, the comic) is a narrative\
    \ description of the solution to be developed, supported by sample or low-maturity\
    \ visuals that represent how a user is moving through the process. The value of\
    \ the storyboard is that it is easy to understand and share as a solution concept\
    \ and explicitly includes the user and their thinking as part of the description\
    \ of the solution. As a side benefit, narrative explanation can spark further\
    \ imagination and exploration work.\n\n**Screen/user flows** are similar to storyboards\
    \ but are presented from a product perspective rather than in a narrative format.\
    \ Screen flows (or user flows) are a step-by-step sequence of screens or other\
    \ interaction touchpoints that will take the user from intended action(s) to completed\
    \ action(s). The value of a screen flow is that teams can dive slightly deeper\
    \ into how the solution works, using the platform it is being created on (e.g.,\
    \ mobile devices, computer screens, point-of-sale interfaces, etc.).\n\n**Wireframes**\
    \ are a low-fidelity version of the screen. At this stage, these can range from\
    \ whiteboard or pen-and-paper drawings to higher-fidelity renderings but are still\
    \ low in design maturity.\n\n## HCD and Concept Validation\n\nDuring concept validation,\
    \ the team reviews conceptual designs with users, to ensure that solutions are\
    \ addressing user needs in a useful way. If multiple solution candidates are under\
    \ consideration, gathering user attitudes toward each also allows for a better\
    \ decision on which solution will provide the best experience. These efforts ensure\
    \ that teams spend time working on products that users want and understand.\n\n\
    Concept validation is a research step—neither an HCD practitioner nor an Agile\
    \ team can validate that their intended solution is successful without engaging\
    \ their users. Deciding which research to undertake is also a “stakes-based” process;\
    \ the amount of effort put into solution validation should align with the investment\
    \ a team will make in delivering that solution and the risk of delivering something\
    \ unwanted or ineffective.\n\nFrom a team standpoint, concept validation leads\
    \ to two key outcomes, including (see also [Figure 3.4](#ch03.xhtml#_15064-4445_ch003_Figure_004)):\n\
    \n*   A “pivot or persevere” decision based on evidence\n\n*   An early signal\
    \ of experience risks or challenges\n\n### A Pivot or Persevere Decision\n\nJust\
    \ as ideation ensures the team considers multiple solutions to any problem they\
    \ are trying to solve, concept validation provides a natural step for a pivot-or-persevere.\
    \ During ideation, teams compared the business value and technological level of\
    \ effort of different solutions; here, they get enough user input to make a good\
    \ decision about whether they are creating good experiences that support their\
    \ goals.\n\n ![Figure 3.4 HCD activities and artifacts in concept validation.](Images/Figure3_4.jpg)\n\
    \n[Figure 3.4](#ch03.xhtml#R_15064-4445_ch003_Figure_004) HCD activities and artifacts\
    \ in concept validation.\n\n#### An Early Signal of Experience Risks or Challenges\n\
    \nEven in cases where teams get a clear signal that it is worth moving forward,\
    \ the team may uncover risks that need to be addressed further along in the refinement\
    \ stage. Are there specific concepts, labels, or interactions that are unclear?\
    \ Does it take more work than expected to explain what the intended value of a\
    \ solution is? What types and levels of risk can the team accept and still be\
    \ confident they have identified the right solution?\n\n### ***Research Activities\
    \ of Concept Validation***\n\nIn concept validation, the team uses early-stage\
    \ designs (sometimes in the form of paper prototypes or other low-fidelity versions)\
    \ with potential users for direct feedback. The amount of work it can take to\
    \ do this varies greatly, depending on how much existing research operations support\
    \ there is, and how extensive the research itself is. When coordinating both concept\
    \ validation and solution validation research, teams will want to use a Research\
    \ Roadmap (see [Chapter 7](#ch07.xhtml#_15064-4445_ch007)) to ensure that there\
    \ is enough time and alignment between research and development work.\n\n####\
    \ Identify Learning Goals\n\nThe first task of any research effort is to identify\
    \ specific learning goals. It is not usually enough to merely show something and\
    \ “get feedback”—it is important that the team consider what it is actually hoping\
    \ to learn. At the concept validation stage, these will be big-picture questions\
    \ that take the form of questions such as:\n\n*   Do users understand what we\
    \ are making and how it will help them?\n\n*   What is their attitude toward the\
    \ type of solution we are considering?\n\n*   What are the risks or challenges\
    \ that they might experience when faced with this solution?\n\n#### Prepare a\
    \ Research Effort\n\nOnce a learning goal is established, the team will prepare\
    \ for the research effort. This means picking the methodology that works best.\
    \ In addition to selecting a method best suited to answer the learning goals,\
    \ additional factors may include what type of tools teams have access to and whether\
    \ they can devote time and have access to direct interaction with users via moderated\
    \ tests (whether in person or remote).\n\nThere are a wide number of testing methodologies\
    \ aimed at understanding different aspects of how the user will interact with\
    \ the solution. Each method tests for a specific kind of insight, and methods\
    \ are not universal in the type of prototype or model required to conduct the\
    \ test. The following list is not an exhaustive list of research methodologies.\
    \ For an approachable and useful rundown of research methodologies, read Erika\
    \ Hall’s *Just Enough Research.[⁷](#fn7)*"
