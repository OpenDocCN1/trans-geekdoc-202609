- raw: "Ethnography is the participant observation of culture. In HCA and software\
    \ development, it will usually refer to immersive methods of understanding communities\
    \ by examining their digital footprint (as more literally immersive techniques\
    \ are cumbersome if even available). This can be done by reviewing their online\
    \ community behaviors (such as in discussion forums or across social media) where\
