- raw: 'Despite the level of enthusiasm, participating in research can be an anxiety-producing,
    tiring experience. Given a small pool of participation candidates for any reason
    (e.g., the product has a specialized set of users or teams still have a fairly
    small reach), teams will want to make sure they don’t overtax their ability to
    meaningfully contribute. Teams that reach out to the same people too often can
    suffer precipitous drops in participation rates (not unlike “survey fatigue”).


    #### Common Voice


    Like any other communications channel, communications with research participants
    should feel as if they come from one single organization, not different individuals.
    This means


    *   sending out invitations that sound similar to one another.


    *   having a common communication cadence—frequency and timing of reminders, follow-up
    communications, and so on.


    *   ensuring any rules and standards are well explained, no matter the team or
    the effort.


    #### Common Standards and Expectations


    It is critical to clearly define practices and procedures, such as participation
    incentives, the management of collected data, and participant privacy. Participants
    should have a clear understanding of what their commitment is. These considerations
    must be accounted for in addition to the experience feeling familiar to repeat
    participants. This is why it is important to confirm that standards and guidelines
    are in place and followed.


    ### Tools and Templates


    There are many research processes and artifacts to coordinate to remain consistent
    from effort to effort. This is particularly true of recruiting artifacts, such
    as:


    *   Policies


    *   Engagement process


    *   Communications templates


    *   Research plans


    *   Scripts


    *   Tools for conducting research


    *   Synthesis


    *   Share outs


    #### Policies


    Policies include decisions about whether sessions are recorded and what happens
    to those recordings, how customer privacy is handled, what the incentive policy
    is for participation, and whether and when any sort of non-disclosure agreement
    (NDA) or business protection is required.


    #### Engagement Process


    Whether research requests come from leadership (such as with “exploration and
    innovation” efforts) or from teams to validate or evaluate solutions, key stakeholders
    need to know what to expect from the research process in terms of the time and
    effort required to conduct and synthesize research in order to plan accordingly.
    Without a clear and shared understanding of the research process, teams will be
    saddled with unrealistic turnarounds or research requests that don’t align to
    the actual learning goals.


    #### Communications Templates


    Teams should also have standard templates for communicating with participants.
    Templates ensure that necessary information is clearly and consistently conveyed.
    Templates also ensure that there is a singular organizational voice, which is
    important for trust and credibility. In addition to participant-facing communications,
    teams may need to create scripts and templates for use in dealing with stakeholders
    to make sure that they are consistently addressing the information needs of those
    stakeholders by including details that are relevant to them specifically.


    #### Research Plans


    A research plan identifies the purpose and scope of research and keeps individual
    research efforts on track. It should identify the learning goals of the research,
    as well as the methodology, milestones, and timeframe. It should also include
    the share-out audiences and deliverables to present findings.


    #### Scripts


    When conducting specific tests, teams should keep the participant experience consistent—the
    idea is for each participant to have the same understanding of what is happening
    and respond to the same questions and prompts. This is particularly true as the
    rigor of study increases—exploratory interviews that happen in discovery may start
    with the same basic initial prompts but leave plenty of room for the interviewer
    to decide how to follow up, whereas in validation/evaluation efforts, users should
    be given identical tasks. There is also orienting information that every participant
    should know at the outset, such as how long their involvement will take, what
    it entails, and how to end a session if they need to for any reason. A script
    ensures all of this is appropriately communicated.


    #### Tools for Conducting Research and Synthesizing Findings


    While research methodologies can vary wildly in complexity—ranging from sessions
    with users that involve no more than interview scripts and paper prototypes to
    watching people interact with fully developed products—teams working separately
    will benefit from using the same tools as one another. All teams engaged in asynchronous
    remote testing, for example, should use the same tool. Similarly, whatever the
    process is for synthesizing research, the platform or tools used should be common
    across the organization.


    #### Share-Outs


    There should be an established process for researchers to share any insights gathered
    with their teams. It is important to develop and use templates for the artifacts
    that capture these insights, as well as to ensure there are presentations and
    meetings involving the proper stakeholders in the effort.


    ## An Insight Repository


    The goal of an insight repository is to capture findings in a way that makes them
    accessible and easy to consume across teams and time. An insight repository is
    a bit different from a share-out since it is meant to be explorable and informative
    to the teams doing related work, not drive specific, time-bound decisions.


    ### An “Insight” is the Atomic Unit of the Insight Repository


    An insight is a research-supported claim about the attitudes, behaviors, or expectations
    that (all or specific) users have. For a repository, HCD practitioners want to
    extract any insights demonstrated in research and bring them forward as claims
    that have been tested in some way. This is not to say that a research repository
    will not include the foundational data or full reports, just that the teams are
    primarily looking for the insights themselves (and not long detailed reports that
    require examination), which is why it is organized this way.


    The insight repository needs to be built to accomplish three things:


    1.  **Stakeholders can see key information at the first view.** In addition to
    the insight itself, this should include details about the research, like the date,
    method, and relevant context, as well as the product for which the insight was
    generated, and the question that the research sought to answer. This is not an
    exhaustive list. Some teams may find that they are doing research tailored to
    specific personas or specific moments within a journey. Any facets relevant to
    the organization for searching insights would go here.


    2.  **Stakeholders can locate the generated reports related to the insight.**
    Whether these are contained in the insight repository or elsewhere, this information
    should be available for stakeholders wanting a more complete picture of how the
    research was conducted and the conclusions reached.


    3.  **Connect the insight repository to the learning strategy.** The insight repository
    connects to the learning strategy in two key ways. The first should be obvious—if
    teams are missing basic information for their strategy, they may find that a well-organized
    repository can provide the necessary clarification. The second is that a learning
    strategy should inform the content organization of the repository, so there is
    a holistic approach to deciding what needs to be learned, when and how to learn
    it, and how to capture it.


    # Chapter 10Expanding to Small Groups of Agile Teams


    DOI: [10.4324/9781003188520-14](https://doi.org/10.4324/9781003188520-14)'
  fmt: '

    Despite the level of enthusiasm, participating in research can be an anxiety-producing,
    tiring experience. Given a small pool of participation candidates for any reason
    (e.g., the product has a specialized set of users or teams still have a fairly
    small reach), teams will want to make sure they don’t overtax their ability to
    meaningfully contribute. Teams that reach out to the same people too often can
    suffer precipitous drops in participation rates (not unlike “survey fatigue”).


    ## Common Voice


    Like any other communications channel, communications with research participants
    should feel as if they come from one single organization, not different individuals.
    This means:


    * sending out invitations that sound similar to one another.

    * having a common communication cadence—frequency and timing of reminders, follow-up
    communications, and so on.

    * ensuring any rules and standards are well explained, no matter the team or the
    effort.


    ## Common Standards and Expectations


    It is critical to clearly define practices and procedures, such as participation
    incentives, the management of collected data, and participant privacy. Participants
    should have a clear understanding of what their commitment is. These considerations
    must be accounted for in addition to the experience feeling familiar to repeat
    participants. This is why it is important to confirm that standards and guidelines
    are in place and followed.


    ## Tools and Templates


    There are many research processes and artifacts to coordinate to remain consistent
    from effort to effort. This is particularly true of recruiting artifacts, such
    as:


    * Policies

    * Engagement process

    * Communications templates

    * Research plans

    * Scripts

    * Tools for conducting research

    * Synthesis

    * Share outs


    ### Policies


    Policies include decisions about whether sessions are recorded and what happens
    to those recordings, how customer privacy is handled, what the incentive policy
    is for participation, and whether and when any sort of non-disclosure agreement
    (NDA) or business protection is required.


    ## Engagement Process


    Whether research requests come from leadership (such as with “exploration and
    innovation” efforts) or from teams to validate or evaluate solutions, key stakeholders
    need to know what to expect from the research process in terms of the time and
    effort required to conduct and synthesize research in order to plan accordingly.
    Without a clear and shared understanding of the research process, teams will be
    saddled with unrealistic turnarounds or research requests that don’t align to
    the actual learning goals.


    ## Communications Templates


    Teams should also have standard templates for communicating with participants.
    Templates ensure that necessary information is clearly and consistently conveyed.
    Templates also ensure that there is a singular organizational voice, which is
    important for trust and credibility. In addition to participant-facing communications,
    teams may need to create scripts and templates for use in dealing with stakeholders
    to make sure they are consistently addressing the information needs of those stakeholders
    by including details that are relevant to them specifically.


    ## Research Plans


    A research plan identifies the purpose and scope of research and keeps individual
    research efforts on track. It should identify the learning goals of the research,
    as well as the methodology, milestones, and timeframe. It should also include
    the share-out audiences and deliverables to present findings.


    ## Scripts


    When conducting specific tests, teams should keep the participant experience consistent—the
    idea is for each participant to have the same understanding of what is happening
    and respond to the same questions and prompts. This is particularly true as the
    rigor of study increases—exploratory interviews that happen in discovery may start
    with the same basic initial prompts but leave plenty of room for the interviewer
    to decide how to follow up, whereas in validation/evaluation efforts, users should
    be given identical tasks. There is also orienting information that every participant
    should know at the outset, such as how long their involvement will take, what
    it entails, and how to end a session if they need to for any reason. A script
    ensures all of this is appropriately communicated.


    ## Tools for Conducting Research and Synthesizing Findings


    While research methodologies can vary wildly in complexity—ranging from sessions
    with users that involve no more than interview scripts and paper prototypes to
    watching people interact with fully developed products—teams working separately
    will benefit from using the same tools as one another. All teams engaged in asynchronous
    remote testing, for example, should use the same tool. Similarly, whatever the
    process is for synthesizing research, the platform or tools used should be common
    across the organization.


    ## Share-Outs


    There should be an established process for researchers to share any insights gathered
    with their teams. It is important to develop and use templates for the artifacts
    that capture these insights, as well as to ensure there are presentations and
    meetings involving the proper stakeholders in the effort.


    ## An Insight Repository


    The goal of an insight repository is to capture findings in a way that makes them
    accessible and easy to consume across teams and time. An insight repository is
    a bit different from a share-out since it is meant to be explorable and informative
    to the teams doing work.


    ### An “Insight” is the Atomic Unit of the Insight Repository


    An insight is a research-supported claim about the attitudes, behaviors, or expectations
    that (all or specific) users have. For a repository, HCD practitioners want to
    extract any insights demonstrated in research and bring them forward as claims
    that have been tested in some way. This is not to say that a research repository
    will not include the foundational data or full reports, just that the teams are
    primarily looking for the insights themselves (not long detailed reports that
    require examination), which is why it is organized this way.


    The insight repository needs to be built to accomplish three things:


    1. Stakeholders can see key information at first view. In addition to the insight
    itself, this should include details about the research, like the date, method,
    and relevant context, as well as the product for which the insight was generated,
    and the question that the research sought to answer. This is not an exhaustive
    list. Some teams may find that they are doing research tailored to specific personas
    or specific moments within a journey. Any facets relevant to the organization
    for searching insights would go here.

    2. Stakeholders can locate the generated reports related to the insight. Whether
    these are contained in the insight repository or elsewhere, this information should
    be available for stakeholders wanting a more complete picture of how the research
    was conducted and the conclusions reached.

    3. Connect the insight repository to the learning strategy. The insight repository
    connects to the learning strategy in two key ways. The first should be obvious—if
    teams are missing basic information for their strategy, they may find that a well-organized
    repository can provide the necessary clarification. The second is that a learning
    strategy should inform the content organization of the repository, so there is
    a holistic approach to deciding what needs to be learned, when and how to learn
    it, and how to capture it.

