    构思（Ideation）是团队生成多个`high-level`解决方案概念的阶段。这些概念需要足够稳健，以便团队对每个候选方案的投入和风险进行粗略评估，并决定哪些方案需要通过用户进行验证。这样做是为了让团队就哪种方案最适合要解决的问题做出明智的决策。在此阶段，解决方案的整体蓝图已经清晰，但细节可能尚不明确。


    团队在尝试对产品的基础设计达成共识时，基本上有两种路径：协作设计工作坊和概念性设计。


    ## 协作设计工作坊


    在这种情况下，`Designer` 会与其他利益相关者（有时包括用户本身）共同头脑风暴解决方案。。工作坊在结构和持续时间上会有很大差异，但目标是让团队和利益相关者对解决方案的目的以及要解决的问题产生共同理解，然后让他们在（任何适用的限制范围内）发挥创造力来解决这些问题。


    ## 独立设计


    在这种情况下，`Designer` 独立使用发现产物来创建设计方案，并提交给 `Product Owner` 和团队以获取反馈。在这个设计阶段，会考虑主要/关键步骤，并将其限于所谓的“快乐路径”活动（不探索边缘情况或错误处理）。解决方案概念足够清晰，可以启动讨论并开始接收关于交付所需投入和整体用户价值的反馈。


    ## 体验风险评估


    协作构思（包含多个利益相关者）的优势之一是体验风险会及早出现。以人为中心的敏捷实践者关注关于团队是否正在构建不受欢迎或令人不满意的解决方案的风险，但协作构思还能提高对其他风险（技术风险、政策风险等）的早期意识，这些风险可以被发现、捕捉并解决。


    ### 构思的设计产物


    ![](img/pg47.jpg)


    `storyboard`（故事板，以及它的近亲漫画）是对待开发解决方案的叙述性描述，并由示例或低成熟度的视觉效果支持，这些视觉效果代表了用户如何完成整个过程。故事板的价值在于它作为一个解决方案概念易于理解和分享，并且明确将用户及其思考作为解决方案描述的一部分包含进来。作为额外收益，叙述性的解释可以激发进一步的想象和探索工作。


    `Screen/user flows`（屏幕/用户流程）与故事板类似，但它们是从产品角度呈现的，而不是以叙述格式呈现。`Screen flows`（或 `user
    flows`）是屏幕或其他交互触点的逐步序列，将引导用户从预期的操作到完成的操作。屏幕流程的价值在于，团队可以稍微深入地了解解决方案如何运作，并使用其创建的平台（例如移动设备、电脑屏幕、收银台接口等）。


    `Wireframes`（线框图）是屏幕的低保真版本。在这一阶段，这些可以从白板画或纸笔绘图范围到高保真渲染图不等，但设计成熟度仍然较低。


    ## HCD 与概念验证


    在概念验证期间，团队与用户一起审查概念设计，以确保解决方案正在以有效的方式解决用户需求。如果正在考虑多个候选方案，收集用户对每个方案的态度也有助于对哪种方案将提供最佳体验做出更好的决策。这些努力确保团队花时间在开发用户想要并理解的产品上。


    概念验证是一个研究步骤——无论是 `HCD` 实践者还是 `Agile` 团队，无法在不参与用户的情况下验证其预期的解决方案是成功的。（注：原文此处存在大量重复段落，译文已按要求去重并保留核心逻辑）。


    概念验证是一个研究步骤——无论是 `HCD` 实践者还是 `Agile` 团队，无法在不参与用户的情况下验证其预期的解决方案是成功的。

