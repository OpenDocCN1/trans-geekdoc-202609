  trans: '


    *   他们是那种预期能够学习和探索的日常用户，还是需要定期重新引导的低频用户？

    *   他们使用该产品的动力是什么？

    *   他们使用该产品的背景是什么？他们在何处，有什么东西在竞争他们的注意力，等等？

    *   该产品在多大程度上契合他们已有的习惯和行为？

    *   他们对产品可能的替代方案或替代品是什么？

    *   他们熟悉哪些术语和语言，哪些是新学的？


    共情图（Empathy maps）与用户画像（personas）相关，它以视觉化的方式展示了用户在接触或参与使用正在开发的或或服务时的感受。共情图通常包含较少的通用的背景信息，更多地关注在特定互动时刻的情绪状态。虽然用户画像信息与共情图信息之间存在很大的重叠可能，但在帮助团队达成共识以确定正确解决方案时，它们各自发挥着有用的沟通功能。


    `Scenarios`（场景）是用户尝试完成的关键任务，并包含了任务周围的背景，例如用户何时或为何执行某项操作。通常针对使用特定系统的用户画像会有几个关键场景，这些场景直接与用户画像相结合，这样团队在设计解决方案时，既能了解用户是谁，也能了解他们希望实现什么。


    场景与 `use cases`（用例）的主要区别在于，场景侧重于用户对完成任务的特定情感、期望以及屏幕之外的体验。例如，可能会询问用户：“在尝试完成任务 X
    时，什么最可能让你感到沮丧？”


    关于场景的一个经典设计决策是，用户在一次操作中有多大可能实际上`complete`完成交互。与用户一起设计数据输入表单，如果是包含已知信息的短表单，与需要从多个来源收集信息且可能耗时的表单相比，看起来是完全不同的。


    ### 旅程地图与服务蓝图


    ![](img/pg37.jpg)


    旅程地图（Journey map）是对`对用户呈现的过程`的端到端拆解，即使其中涉及其他参与者，并丰富了对态度和行为的观察。它们记录了用户遇到多少个触点，以及他们在每一步的期望、挫败感或愉悦点是什么。旅程地图特别适用于从整体观察流程，以识别改进体验的领域，而不是简单地将每次接触视为孤立的体验。服务蓝图（Service
    blueprints）亦是如此，但明确旨在从业务的角度完全识别整体体验中的“后台”或“幕后”部分。


    ### 发现阶段的设计活动


    ![](img/pg37.jpg)


    虽然发现阶段的研究活动侧重于理解用户，但在期间还应进行一系列行的设计活动。设计活动侧重于从业务角度理解设计目标和限制（例如品牌考量），并根据最佳实践识别改进机会。


    #### 启发式评审 (Heuristic Reviews)


    启发式评审是解决问题的一种快捷方法，它使用非传统的方法，旨在在非常紧的时间限制内得出一个“足够好”的解决方案。启发式评审是对现有产品或流程的专业评审，旨在将该流程与通用最佳实践进行比较，通常使用特定的框架进行评估内容。启发式评审使用通用框架且从根本上是主观的，因此最好由多位专家进行评审并比较答案。


    #### 竞争/对比性评审 (Competitive/Comparative Review)


    `competitive`（竞争性）或 `comparative`（对比性）评审是对现有产品或流程的专业评审，旨在将该流程与通用最佳实践进行比较，通常使用特定的框架进行评估内容。启发式评审使用通用框架且从根本上是主观的，因此最好由多位专家进行评审并比较答案。


    #### 收集输入/创意工作坊 (Gathering Inputs/Creative Workshops)


    根据项目类型和成熟度，某些发现活动可能会关注于：

    *   产品是如何呈现的？

    *   受众是谁？

    *   产品的目标是什么？


    由于产品的身份尚未定义，或者在创意工作坊期间，目标是定义基调和风格。


    ### 发现阶段的设计产物 (Design Artifacts)


    对于这些活动中的许多，活动与产物之间存在一对一的关系，这正是它们存在的原因。它们包括：


    *   启发式分析/评分

    *   竞争性分析

    *   情绪板（Mood board）和品牌手册（Brand book）

    *   创意简介（Creative brief）

    *   样式指南和组件库

    *   早期史诗定义（Early epic definition）


    #### 启发式评分 (Heuristic Score)


    启发式评审的结果应该是一份根据最佳实践对产品进行评分的文档，突出其优缺点。


    #### 竞争/对比分析 (Competitive/Comparative Analysis)


    竞争性或对比分析的结果通常是对竞争对手产品优缺点的拆解，识别出解决方案呈现方式中的惯例（即模式）。该报告用于识别有帮助的惯例和改进机会，以及交付内容中的空白。


    #### 情绪板和品牌手册 (Mood Board and Brand Book)


    情绪板是一组收集的材料（图像、颜色、其他产品示例），旨在为正在开发的解决方案的基调和风格提供灵感。品牌手册是一组关于品牌在整个产品营销和开发周期中如何呈现的特定指令。虽然它们在灵活性上有所不同（情绪板是指南，品牌手册是一组限制条件），但它们的共同目标是定义产品的视觉身份。


    #### 创意简介 (Creative Brief)


    创意简介是一种用于传达所构建产品创意策略的文档。它是一份包含用户理解相关的细节文档（例如：为谁设计、基调和风格是什么、将采用什么样的沟通方法、从用户角度来看关键价值差异点是什么等）。


    #### 样式指南和组件库 (Style Guides and Pattern Libraries)


    样式指南是针对产品交付的一系列既定实践。例如，在软件产品中，样式指南定义了字体使用（字体族、大小等）、图标使用、产品颜色（不仅是主色调，还是一组主色、次色和三级颜色，以及关于在产品内部如何使用这些颜的具体说明）、按钮的大小、形状和颜色、基础字段外观、常见重复值（如日期），以及特定的交互行为。


