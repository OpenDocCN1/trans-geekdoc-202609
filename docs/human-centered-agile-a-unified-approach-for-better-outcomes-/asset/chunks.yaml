    Some teams need enough HCD work on their own that it is worth the investment of
    including HDC as a direct and ongoing part of the team, while others may only
    need HCD support on an ad hoc basis. Embedding HCD practitioners on teams with
    the work to support it means they can share all the team responsibilities and
    participate fully in all team activities. As a result, they gain a deeper understanding
    of the products being built. Thus, they become more available to support day-to-day
    decision-making, including any adjustments during implementation that impact the
    end-user experience, and can provide better assurance that the experience is being
    delivered as intended.


    Determining whether a team requires dedicated versus ad hoc HCD support involves
    several key decision factors:


    * How often is that team making changes to the end-user experience? Some teams
    do this frequently; others may have work where the end-user experience is the
    tip of the proverbial iceberg.

    * How big are the changes to end-user experience, and how many users will those
    changes affect? What are the stakes?


    ### Scaling to a Shared Services HCD Team


    In most programs, not every team requires full-time HCD support, and some (those
    more technical in nature) may not require it at all. A shared services team makes
    sense in larger programs as a way to provide flexible support for teams that don’t
    require an embedded practitioner or that have practitioners who periodically need
    additional support. This shared services HCD team should operate as any other,
    with a `Product Owner`, `Scrum Master`, and backlog.


    At a tactical level, a shared services team allows the program to pull HCD services
    to teams at key points, making it much easier to conduct discovery, ideation,
    refinement, concept validation, solution validation, and evaluation activities.
    In this way, a shared services team allows HCD participation to be more robust
    and more flexible within the program.


    In addition to providing direct support to teams, an HCD shared services team
    is a natural home for design and research operations and other inter-team activities.
    See [Figure 13.1](#ch13.xhtml#_15064-4445_ch013_Figure_001) for a depiction of
    these two team topologies.


    ![Figure 13.1 HCD practitioners integrated into Agile teams are shown on the left,
    and the preferred centralized “shared services” HCD team with some individual
    teams having their own HCD resources is shown on the right.](Images/Figure13_1.jpg)


    [Figure 13.1](#ch13.xhtml#R_15064-4445_ch013_Figure_001) HCD practitioners integrated
    into Agile teams are shown on the left, and the preferred centralized “shared
    services” HCD team with some individual teams having their own HCD resources is
    shown on the right.


    ### Strategic Planning and Support


    Unless a program has already reached a fairly advanced state of maturity in incorporating
    HCD, teams without embedded HCD practitioners will require strategic guidance
    on how to conduct HCD activities within their own delivery cycle. Having a shared
    services team with its own `Product Owner` and `Scrum Master` who can help other
    teams makes it easier for programs to incorporate HCD into their work. This is
    because having non-HCD practitioners (`Product Owners` and `Scrum Masters`) with
    the ability to talk about HCD from the perspective of their own role can make
    an incredible difference in how well HCD is adopted into the program.


    ### Design and Research Operations


    When establishing a shared services team, the program gets a clear base of operations
    for all the activities that fall under both buckets rather than hoping to do ad
    hoc coordination among team resources to accomplish the same tasks. Additionally,
    and this cannot be overstated, having a centralized way to handle recruiting for
    research activities will save every team a tremendous amount of work.


    ### Skills Support and Growth


    HCD is often spoken about as if it were one skill when, in fact, it is a blend
    of many, incorporating both design and research practices. One of the subtler,
    yet very valuable, outcomes of having a shared services team is that embedded
    team members have a place to go for coaching and reflection as well as to discuss
    the approach to work on their team and their actual deliverables. Teams and embedded
    `Designers` can now observe considerable HCD skill growth in a way not possible
    with embedded and siloed `Designers` alone.


    # Chapter 14 Delivery at Scale: The SAFe® Continuous Delivery Pipeline


    DOI: [10.4324/9781003188520-19](https://doi.org/10.4324/9781003188520-19)


    SAFe® uses the continuous delivery pipeline[^(58](#fn58)


    * **Continuous Exploration—**The ongoing process of exploring the market and user
    needs and then defining a vision, a roadmap, and a set of hypotheses to address
    those needs.[^(59](#fn59)

    * **Continuous Integration—**The process of taking features from the program backlog
    and then developing, testing, integrating, and validating them in a staging environment
    where they are ready for deployment and release.[^(60](#fn60)

    * **Continuous Deployment—**The process that takes validated features and deploys
    them into the production environment where they’re tested and ready for release,
    usually through an automated process.[^(61](#fn61)

    * **Release on Demand—**SAFe® decouples release from deployment (this especially
    makes sense for software teams, for whom deploying is a technical decision while
    release is a business decision). Teams that deploy continuously put their `Business
    Owners` in charge of when the functionality will be made available to users. Sometimes
    it makes sense to do a “dark launch” or “pilot test.” releasing new functionality
    only to select users in order to get feedback. Other times, the feature can be
    toggled on or off for everyone at the same time.[^(62](#fn62)


    ![Figure 14.1 HCD practitioners integrated into Agile teams are shown on the left,
    and the preferred centralized “shared services” HCD team with some individual
    teams having their own HCD resources is shown on the right.](Images/Figure14_1.jpg)


    [Figure 14.1](#ch14.xhtml#R_15064-4445_ch014_Figure_001) The SAFe® continuous
    delivery pipeline. HCD is focused most on continuous exploration, and the measure
    and learn activities in release on demand that can be thought of as “continuous
    evaluation.”


    This section delves into the aspects of the continuous delivery pipeline that
    are of most interest to HCD practitioners and discusses the planning and timing
    of HCD activities.


    Table 14.1 Activities That Take Place in the Continuous Delivery Pipeline


    | Continuous Delivery Pipeline Aspect | Activities within the Aspect | Human-Centered
    Agile Support Activities |

    | --- | --- | --- |

    | Continuous Exploration | Hypothesize, Collaborate & Research, Architect, Synthesize
    | Discovery Research, Ideation (lateral thinking), Concept Validation |

    | Continuous Integration | Develop, Build, Test End-to-End, Stage | Refinement,
    Solution Validation |

    | Continuous Deployment | Deploy to Production, Verify the Solution, Monitor for
    Problems, Respond & Recover | Design Ops, Research Ops |

    | Release on Demand | Release, Stabilize & Operate, Measure, Learn | Evaluation
    |


    ## Continuous Exploration with HCD


    Continuous exploration, shown in [Figure 14.2](#ch14.xhtml#_15064-4445_ch014_Figure_002),
    focuses on ensuring teams engage with users so they can innovate and gain alignment
    about what should be built and in what order. Going back to those concepts of
    “right problem” and “right solution,” continuous exploration is the set of activities
    that are devoted to learning a user’s needs, validating problems, and ideating
    and evaluating multiple solution paths to develop a benefit hypothesis.

