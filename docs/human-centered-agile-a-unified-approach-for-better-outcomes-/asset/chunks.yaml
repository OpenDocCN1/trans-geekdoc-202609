    # III: How Much and When? Planning and Executing HCD within Agile


    # Chapter 5: Bringing Human-Centered Design into Agile


    DOI: [10.4324/9781003188520-8](https://doi.org/10.4324/9781003188520-8)


    Project management, at its heart, is about risk-management. Traditional project
    delivery methods rely on a “waterfall” approach to managing project risks. The
    phases in this process are usually analysis, requirements gathering, design, construction,
    testing, and deployment (or something similar). The thinking is that by conducting
    a review before each stage, project managers can minimize risk simply by ensuring
    that work on the next phase does not begin until work on the previous phase is
    completed. This is more difficult than it sounds, however. How can they know if
    the work is really complete?


    In waterfall, design happened in specific and sometimes lengthy stages. A “requirements
    gathering” stage meant talking to stakeholders to hear what they wanted and then
    creating a large list of needs and a design stage to create a solution that somehow
    accomplished all those needs.


    Using this approach, risk accumulates because assumptions made in each phase of
    the traditional project are never tested or validated with users and are, instead,
    merely vetted internally among the business analysts and subject-matter experts
    on the team. Because one stage needs to be completed before the next starts, the
    analysis and design phases can take a year (or more!) to fully document every
    nuanced detail of the product to be delivered. At that point, the output of these
    phases is not only stale but also untested and unvalidated by actual users. The
    result is a “big bang” release where all the functionality developed is released
    to users all at once. This increases the risk of releasing a product that doesn’t
    offer all the features and functionality the users desire. It also increases the
    risk of a complete launch failure for technical reasons.


    ## “Waterfall” Delivery and Its Challenges


    Poor customer experience is not the only risk of waterfall. There are additional
    concerns specific to the implementation and delivery of working software at a
    large enough scale.


    Even with a comprehensive set of requirements, issues can arise during the implementation
    stage of waterfall releases, especially for large efforts. One major problem is
    that, even with all the time spent, technical assumptions are often wrong. The
    people generating the requirements either don’t have a deep enough knowledge of
    user needs or the time to work through the details or perfect foresight about
    specific aspects. Bad assumptions can also occur through no fault of the team.
    Because the requirements definition process can take so long, technology advances
    can mean that the design was created using one set of constraints while delivery
    is being accomplished with different constraints.


    To further complicate things, technical problems typically arise during code integration.
    Big ones. Because code from the various teams is not integrated and tested as
    a unit until the end of the project, broken builds and costly rework become the
    norm. Source control systems in waterfall development tend to contain multiple
    branches, requiring painstaking merging at the end of the project, a process that
    almost always results in something breaking. Bugs in this process are notoriously
    difficult to identify and fixing them can be a nightmare. Recriminations between
    developers, analysts, and testers about who is to blame become commonplace, and
    if the code eventually does get integrated, major schedule slippage is the most
    likely result.


    At this point, testing on the newly integrated codebase begins, often ending tragically
    with multiple errors that require a coordinated effort by teams to resolve. These
    are generally not small issues but showstopping flaws forcing reanalysis along
    with major redesign and rework. Not infrequently, entire features need to be de-scoped
    because the team knows they can never make them work in the remaining time. It
    is during this period that teams realize that what they designed and constructed
    doesn’t quite solve the problem at hand or did so in a suboptimal way. [Figure
    5.1](#ch05.xhtml#_15064-4445_ch005_Figure_001) shows how risk accumulates and
    value delivery is deferred on a waterfall project.


    ![Figure 5.1 Risk and value delivery on a waterfall project.](Images/Figure5_1.jpg)


    [Figure 5.1](#ch05.xhtml#R_15064-4445_ch005_Figure_001) Risk and value delivery
    on a waterfall project.


    ## Replacing Waterfall with Agile


    With all the risks of waterfall, it was not uncommon for huge, expensive efforts
    to fail altogether. Agile development emerged to mitigate these risks with an
    improved way for knowledge workers to collaborate. In Agile development, cross-functional
    teams are formed with the goal of understanding user needs and then testing solutions
    by delivering small batches of value rapidly and getting user feedback before
    iteratively and incrementally enhancing the solution.


    Agile product development represents a clear shift in mentality that is more focused
    on the customer and providing end-user value quickly than on extensive planning
    and documentation. Agile never supposes that there is a comprehensive “requirements”
    document at the beginning of the project because experience has shown that creating
    such a document at that point is simply not possible. Instead, the Agile approach
    tests assumptions by delivering a small unit of value to the end user, learning
    from it, then iterating based on that learning.


    Agile is especially effective in software development, but this mindset and approach
    can be used successfully for any type of knowledge work, which is defined as any
    work in which the workers know more about the subject than their managers.[⁸](#fn8)


    ![Figure 5.2 Risk is mitigated and value delivered early in Agile projects. The
    bars here represent cumulative value delivery.](Images/Figure5_2.jpg)


    [Figure 5.2](#ch05.xhtml#R_15064-4445_ch005_Figure_002) Risk is mitigated and
    value delivered early in Agile projects. The bars here represent cumulative value
    delivery.

