- raw: 'HCD practitioners and the Product Owner/Product Manager should function as
    natural allies, and it makes sense to add them to this already-robust SAFe^® event
    to achieve better outcomes. HCD practitioners frequently have unique perspectives
    on the product that neither Product Managers nor Product Owners have and are more
    able to recognize “blind spots.” Experience Architects weigh in on what has already
    been validated and still represents risk, brainstorming additional discovery that
    could be done to mitigate it.


    HCD practitioners add value at this event by identifying areas where opportunities
    for research may have been missed or recently arisen due to new learning. In addition,
    HCD practitioners are often able to detect slight variances between planned user
    experiences and actual user experiences, so this meeting is the perfect spot for
    that. Once identified and made transparent, PMs can decide how to best proceed,
    and HCD practitioners can make notes so they can bring this up at the retrospective.


    ### The Scrum of Scrums


    Like the Scrum of Scrums in a non-SAFe^® context, members of each team get together
    at least once a week to discuss dependencies, blockers, and impediments in delivery.
    The purpose of the Scrum of Scrums[^(43)](#fn43)


    ### The Inspect and Adapt Event


    The last sprint in a PI is treated differently than all the others in SAFe^®.
    It is called the innovation and planning iteration,[^(44)](#fn44)


    *   An estimating buffer for overflow work


    *   Extra time for teams to integrate their work


    *   Time set aside for innovation (hackathons, working with users, training, etc.)


    *   Time for the inspect and adapt event and for PI planning


    All the teams on the Agile release train, as well as an extended set of stakeholders,
    get together for the inspect and adapt event.[^(45)](#fn45)


    The inspect and adapt event begins with a demonstration of all the work from all
    the teams in the last PI along with any learning, spikes, or HCD insights obtained
    (this last part being critical for Human-Centered Agilists). After the demonstration
    is complete, an evaluation of the business value of the work delivered is conducted
    by business owners. Finally, temporary ad hoc teams are created, and a program-level
    retrospective called a problem-solving workshop is conducted. In this workshop,
    teams identify any problems in their process, determine their root causes, and
    brainstorm solutions. This is how the process improves at the ART level.


    By this point, the shared services HCD team has done a lot of research and sentiment
    gathering to ensure the Product Manager and Business Owners have the information
    needed to plan the next PI. This is typically a time when HCD practitioners pair
    up with Product Managers and Product Owners to make sure they are aware of all
    the HCD learning that has taken place over the past PI and position that learning
    so it can be easily brought to bear in the next PI. This is the last chance to
    add anything to the Research Roadmap that was missed or needs further elaboration
    before the next planning interval begins.


    The inspect and adapt event itself has three parts:


    1.  A PI system demo, which shows the completed and integrated work for feedback


    2.  Quantitative and qualitative measurement, which is based on the business value
    of the work delivered. SAFe^® has a metric, called the program predictability
    measure, that measures the degree to which teams keep their commitments and values
    they deliver. To oversimplify, this metric is the business value delivered by
    the team (or ART) during the PI divided by the planned business value.[^(46)](#fn46)


    3.  The problem-solving workshop, which is an ART-level retrospective during which
    the members of the entire program brainstorm their biggest problems and the root
    causes and think of ways to improve their process.


    One way to leverage HCD Practitioners’ training in reading and reacting to people’s
    responses is to ask them to do a holistic sentiment capture during the PI system
    demo. HCD professionals will spread out among the group watching the demo to see
    reactions from a wider cross section of participants, not just those who happen
    to be seated near them. This is a great opportunity to look for and note outliers;
    when everyone universally loves a feature, but one person sitting nearby has a
    sour look on their face. That person might know something nobody else does. The
    larger the audience, the more the HCD team should spread out.


    Following the demo, it is also good to have the HCD team speak with any outliers
    and rate/compare their “local” reactions to each meaningful segment of the demo.
    Was the audience engaged? Skeptical? Understanding? This can be informal or formalized
    to a specific scale appropriate to the team and audience. The demo, itself, is
    a great source of questions and ideas for future research from the HCD team.


    During the problem-solving workshop, HCD can help the ART agree on the problem
    to be solved and then dive into its root cause, identifying what is known and
    what needs to be learned. HCD practitioners are trained in turning observations
    into actions/agreements by asking several questions:


    *   What problem is the team trying to solve?


    *   What will have improved when it is solved?


    *   How will stakeholders know it has been solved?


    HCD practitioners can ensure teams focus on the cause of their problems, not just
    the symptoms.


    ### Strategic Portfolio Review


    The strategic portfolio review[^(47)](#fn47)


    The Experience Architect plays a key role in this, bringing new and hard-won insight
    into the conversation and ensuring strategy doesn’t flow top-down from the C-suite
    without any regard for what users are thinking and feeling in the real world.
    The whole point of this meeting is to evaluate “right problem—right solution”
    and protect Executives from making strategy decisions in a vacuum. Holding these
    strategic reviews several weeks before PI planning is a good idea because it gives
    Product Managers and Business Owners time to consider what was learned in the
    last PI before planning and prioritizing features for the next one. It also provides
    them with the opportunity to task their HCD practitioners with digging deeper
    into areas where more insight is needed before the next planning. This ensures
    their strategy is up to date with the latest insight when it is time to prioritize
    features for the next PI.


    The portfolio vision[^(48)](#fn48)


    *   “What do the users think and feel?”


    *   “What did we learn about our users and the market during the last PI?”


    *   “How should our current strategy evolve based on this learning?”


    *   “Given this new learning, are there any new areas of learning that we must
    engage in before our next PI Planning?”


    *   “What known unknowns can we make knowable?”


    *   “How do individual solutions or products have to adapt their strategy based
    on this learning?”


    It is not uncommon for the Experience Architect to present a “wall of experiments”
    here, making all their work transparent. Typically, user engagement experiments
    are presented in “to do–doing–done” format with a special emphasis on completed
    experiments that result in new customer insight, ideas for new features, or learning
    that can disprove previous hypotheses. Stakes are also considered in this presentation,
    as higher stake work will usually call for a greater investment in HCD research.


    Solution Architects and other technical practitioners are also present at this
    meeting, which often has a technology component to it. Teams with a strategy informed
    by fresh user insight combined with a deep understanding of their technical landscape
    always have an advantage. SAFe^® has designed this meeting to be the place where
    teams can “engage both top-down strategic thinking with organic team-based innovations
    to create a synergistic ‘innovation riptide’ that powers a tidal wave of new products,
    services, and capabilities.”[^(49)](#fn49)


    ### Portfolio Sync'
