- raw: "Agile and Human-Centered Design (HCD) are two widely used disciplines that\
    \ strive for similar outcomes but often struggle to “speak” to one another. HCD\
    \ and Agile have embraced ways of working that focus on different phases of a\
    \ delivery process. While they share some similar goals of learning about what\
    \ product users want so that they can deliver useful solutions, the two disciplines\
    \ have very different mindsets. Because of this, when asked to apply both disciplines,\
    \ Agile and HCD practitioners struggle to understand each other’s point of view\
    \ and often craft a process that lacks the necessary time in both the problem\
    \ and solution spaces. When Agile and HCD practitioners work together, they are\
    \ often unable to explain to business stakeholders what should happen and when.\n\
    \nThis can take the form of direct competition, or even conflict, as Agile-driven\
    \ teams see HCD as either an obstacle or direct competitor for resources, while\
    \ HCD practitioners struggle to gain ground with the early-phase efforts that\
    \ can be very valuable in the long run. Attempting to integrate the HCD competency\
    \ into an existing Agile program often results in friction, inefficiency, and\
    \ conflict.\n\nIt doesn’t have to be this way. This book proposes a way for these\
    \ two disciplines to get along and deliver better outcomes.\n\nHuman-Centered\
    \ Agile is a holistic, simultaneous application of Agile product development and\
    \ HCD throughout the product life cycle. This helps teams generate insights, validate\
    \ designs, and get a faster evaluation of both designs and finished work than\
    \ either Agile or HCD could by themselves. Human-Centered Agile is not the mere\
    \ inclusion of HCD as a “bolt-on” to the Agile process but rather a whole new\
    \ way of working and thinking that is integrated into Agile delivery from beginning\
    \ to end. To achieve Human-Centered Agile, there isn’t one single place in the\
    \ Agile workflow where HCD is applied.\n\nHuman-Centered Agile uses user insights\
    \ gathered through HCD methods to better inform every event and artifact throughout\
    \ the Agile life cycle. Human-Centered Agile provides the ability for a single\
    \ team to apply HCD methods to test a hypothesis, discover user needs, or even\
    \ figure out which approaches don’t work. This feels different from traditional\
    \ Agile (see [Figure 1.1](#ch01.xhtml#_15064-4445_ch001_Figure_001)). The customer\
    \ is more present and involved, removing the Product Owner from standing between\
    \ the team and end users. Users are consulted directly and continuously through\
    \ development and even after deployment. This activity is planned and baked into\
    \ the process.\n\nThe Human-Centered Agile team is given permission to think about\
    \ what needs to be built before building something, compare several design options,\
    \ and mitigate risk by validating their assumptions through activities that generate\
    \ user understanding. This stands in contrast to picking a Minimum Viable Product\
    \ (MVP) and building it and only *then* getting user feedback.\n\nIncorporating\
    \ HCD thinking and tools into Agile teams helps them deliver the most value to\
    \ the user. Three basic yet crucial questions that teams should be asking throughout\
    \ the product life cycle are:\n\n*   “Are we solving the right problem?” (*****right\
    \ problem*****)\n\n*   “Is this the best solution, given all of our constraints?”\
    \ (*****right solution*****)\n\n*   “Are we delivering this solution correctly?”\
    \ (*****done right*****)\n\nAnswering these questions is essential to delivering\
    \ products in a cost-effective way. While traditional Agile frequently takes a\
    \ “build it and see” approach to answering all three questions at once (sometimes\
    \ after a good deal of work has been put in), HCD practitioners seek to learn\
    \ the answers to these questions in earlier stages. To effectively do this in\
    \ an Agile framework, HCD practitioners integrate a variety of tools and methodologies\
    \ across the Agile workflow.\n\nKey elements of Human-Centered Agile are:\n\n\
    *   The use of HCD methods throughout the entire Agile process can address traditional\
    \ gaps in Agile, specifically around *****discovery*****, *****ideation*****,\
    \ and *****concept validation*****. This gives teams tools to enhance the Product\
    \ Owner’s understanding of users’ needs.\n\n*   Human-Centered Agile is a holistic\
    \ process whereby one team focuses on a problem and is responsible for the outcome.\n\
    \n*   HCD practices are applied proportionately with the “*****stakes*****” or\
    \ risk of a product or enhancement in Human-Centered Agile. The greater the stakes,\
    \ the more investment teams will make in generating—and acting on—insights from\
    \ real users.\n\n*   Human-Centered Agile gives teams the tools and permission\
    \ they need to plan HCD work that might not be consumed during the current sprint,\
    \ something that might not feel Agile at first but that is a major success factor\
    \ for Human-Centered Agile teams. Human-Centered Agile allows for teams to plan\
    \ and execute HCD work that intentionally won’t be consumed immediately. This\
    \ is done using a “*****Research Roadmap*****” to align HCD activities with development\
    \ and delivery activities.\n\n*   The ability to scale as the number of teams\
    \ grows. Gaps in discovery, ideation, and concept validation get worse with scale.\
    \ Methods used in Human-Centered Agile work just as well at scale as they do on\
    \ a small stand-alone team.\n\n*   Human-Centered Agile brings HCD findings into\
    \ product strategy. Strategy is constantly informed—and updated—based on fresh\
    \ insight from users and teams.\n\n## **Agile and HCD as Practiced Separately**\n\
    \nOver the past decade or so, Agile has become the preferred method for software\
    \ delivery because it allows for short release cycles that yield fast learning.\
    \ As such, Agile replaced the previously used “Big Design Up Front” approach to\
    \ refining requirements and delivering projects.\n\nAgile has been a revolution\
    \ in software delivery but has also produced some product design drawbacks. Time\
    \ for the early-stage activities that help teams understand their users (called\
    \ discovery) is often all but eliminated. The exploration of competing solution\
    \ ideas (called ideation) is expected to happen in a very compressed timeframe,\
    \ sometimes within the same sprint as development itself, if it happens at all.\
    \ Evaluation work is often put off until after software is released, creating\
    \ risks to the success of the product itself. Agile teams often spend most of\
    \ their time thinking about the *execution* of solutions in an effort to deliver\
    \ as quickly as possible. Thus, they mostly live in the “solution space.”\n\n\
    At the same time—and perhaps because of these specific drawbacks—HCD, which can\
    \ be thought of as a specific form of “*****design thinking*****,” has gained\
    \ popularity as a way to set a clear vision for products to be released that prioritizes\
    \ understanding user needs from the very first steps. HCD develops solutions to\
    \ problems by involving the human perspective in all steps of the problem-solving\
    \ process. It ensures that products are delivered in such a way that they are\
    \ more likely to be valuable to users upon release, not just after multiple rounds\
    \ of refinement. In this way, much of HCD is spent thinking about the “*****problem\
    \ space*****.”\n\nThis dichotomy of Agile working in the *****solution space*****,\
    \ and HCD working in the problem space is a general pattern, not an absolute divide.\
    \ Agile teams write user stories from a user value perspective, and they learn\
    \ from users through sequential releases. HCD incorporates the work of seeking\
    \ feedback from users at each important step, iteratively, in the decision-making\
    \ process about what that product will be. But, as a mindset, it’s fair to say\
    \ that Agile and HCD practitioners are often thinking in somewhat different terms.\n\
    \n## **Why Is Human-Centered Agile Needed?**\n\n> *In theory, theory and practice\
    \ are the same. In practice, they are not*.\n\n> \n\n> **—attributed to Albert\
    \ Einstein**"
