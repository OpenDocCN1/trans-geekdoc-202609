  trans: '


    从业者会注意到此图的两个点：研究与设计活动是分离的，且许多以人为中心的设计（HCD）活动不在同一个冲刺（sprint）中完成。


    ## 研究与设计活动分离


    将研究与设计活动分离，是为了强调研究是以人为中心的设计（HCD）过程中不可或缺的一部分，并突出它需要不同类型的工作，而这种工作通常被认为是设计的一部分。`Designer`
    仅凭一个想法（或一组需求）和计算机就能制作原型图，但无法通过这种方式制作用户旅程图。同样，由之前的研究或最佳实践引导的设计活动贯穿整个过程，不需要进一步的研究。故事（Stories）基于对用户的了解，但它们通常会根据技术和业务限制或简单的新决策进行细化。当这些完善对前端产生影响时，`Designer`
    应该参与到完善过程中，以确保更新反映的是用户目标，而不是为了方便而做的决策。


    ### 许多 HCD 活动未在当前冲刺中完成


    研究活动需要时间让团队进行消化和响应。显然，想要学习或验证用户需求和欲望的团队，无法在实施的一周前完成这一点，并仍留出细化的时间。相反，已经承诺在下一个冲刺中开展工作的团队，将无法看到通过发现（discovery）来影响当前计划发布版本的意义。在那个阶段，任何发现性活动只会影响未来的发布版本。


    ## 研究路线图与研究策略


    将 `Research Roadmap` 与产品路线图对齐，允许团队能够清晰地了解整体工作量，从而看到管线中中有哪些产品/功能，即使只是概括性的描述。同时查看这两者可以帮助团队清楚地看到哪些发布版本已经有或可能需要研究支持。


    在审查产品路线图之后直接审查 `Research Roadmap` 是一个很好的做法，这样产品研究需求就会显而易见。通过查看所有这些功能处于周期的什么阶段，团队可以开始回答问题，例如：


    *   还需要哪些发现工作？

    *   发现性研究可以支持多个发布版本吗？

    *   团队的时间有多少比例将花在“正确的问题、正确的解决方案、正确地完成”这些问题上？


    例如，团队可能希望进行：


    *   真正的探索性研究，并围绕发现未满足的需求和机会展开的发现性研究。

    *   某些功能在实施远之前所需的发现性研究，以确保预期的功能解决了用户的需求。

    *   针对某些功能的协作式构思，随后对高层解决方案进行概念验证，以便规划正确的解决方案。

    *   针对一到三个冲刺后发布的产品进行解决方案验证（可用性测试），以便将发现整合到故事和实施中。

    *   针对特定发布版本后的评估工作。


    ## 将 HCD 故事与产品路线图关联


    为了使用 `Research Roadmap`，团队需要能够将研究故事与其产品路线图上的相应工作相关起来。对于早期研究和设计工作（从发现到概念验证），这将意味着链接到一个描述团队试图解决的问题的
    `epic`（史诗任务/巨型任务）。对于较后的工作（解决方案验证或评估），这些故事可以与功能挂钩。无论何种情况，研究工作都应该作为产品路线图上所反映的工作的一部分，并且是可识别和可追踪的。这确保了团队正在跟踪所有的研究和设计活动（即没有“账外”工作），并且所有工作都有约定的目的（即没有“悬浮”工作）。


    ### 巨型任务（Epics）、发现工作与“正确的问题”


    在其他方面，包括创建清晰的验收标准以及进行基于团队的细化和故事点（story-pointing）工作，故事应该被像其他故事一样对待。在 `Chapter 3`
    中，对巨型任务的讨论集中在以下方面：


    1.  我们预期获得什么收益？

    2. 这是一个需要解决的问题吗？

    3.  什么样的解决方案是可以接受的？

    4. 解决这个问题对业务有什么好处？

    5.  什么样的解决方案是可行的？

    6.  如何衡量成功？


    ### 巨型任务示例


    假设一家公司在工作时间内提供支持。他们收到了一些 24/7 支持的请求。该巨型任务将包含一个团队视角的陈述。


    > **EPIC-001：非工作时间支持**

    >

    > **团队认为有大量的额外需求，并需要确定如何提供支持以便客户在关系中感到放心。**

    >

    > * 预期结果：

    > *   验证是否存在未满足的额外需求

    > *   识别用户对额外支持的期望（什么样的支持是可以接受的）

    > *   产生额外支持的想法

    > *   验证并选择功能

    > *   为功能生成成功标准


    ### 发现性研究故事示例


    以下是可能与示例巨型任务关联的示例研究故事，旨在满足验收标准（ACs）1 和 2。由于研究故事是关于收集证据的，在完成后，团队可能会认为已经收集了足够的证据来做出决策，并且这些验收标准已满足；或者他们可能会认为需要额外的证据，从而额外的精力。


    > **故事：作为一个产品团队，我们想要验证用户是否经常因非工作时间无法解决问题而感到困扰，以便我们以适当的方式解决他们的问题。**

    >

    > 学习目标 1：识别用户对支持的现状。我们想知道用户是否意识到支持仅在有限的小范围内提供，还是他们的最初期望是拥有 24 小时的支持。了解期望与实际体验之间的差距将帮助我们决定是否要进一步提供支持。


    '
