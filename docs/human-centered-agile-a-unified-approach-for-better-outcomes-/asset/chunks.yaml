    mean anything from strategic consideration of whether work should be done all
    the way to just being a meeting that assigns a team to pick up already-defined
    work.


    ## Holistic Teams, Holistic Work


    Human-Centered Agile takes a holistic approach to teams, both to preserve team
    independence and flexibility in solving problems and to see that the solution
    is delivered and evaluated by the team that identified and understood the problem.
    This “whole team, whole problem, whole outcome” mindset is an essential concept.


    The idea in Human-Centered Agile is that the team working on the problem has ownership
    from the problem definition stage through the product evaluation. Keeping one
    team engaged from problem definition through solution delivery maintains alignment
    around the purpose of the work and ensures that the team makes decisions based
    on intended outcomes rather than drifting toward more convenient decisions in
    terms of development.


    ### Team-to-Team Handoffs


    Ideally, Agile teams work on a problem from end to end, which is true in Human-Centered
    Agile as well. However, when scaling to a group of coordinated teams, having a
    single team work through features end to end becomes increasingly challenging.
    Looking back at the example of creating an “after-hours support capability” that
    was presented in [Chapter 7](#ch07.xhtml#_15064-4445_ch007), the team that did
    the initial research might recommend a chatbot to serve some customers and a standalone
    application that serves others. These solutions may be too much for just one team
    to deliver, so another team is brought in.


    In Human-Centered Agile, the team being brought in is now given responsibility
    for the problem (after-hours support), the solution (an application), and the
    outcome, including determining how to best measure success. The new team could
    very well learn that people don’t need support (“oops the discovery was wrong!”)
    or that they don’t want an app at all (“did you all even validate that this is
    something people want?!?”). In this context, the new team has permission to question
    any previous findings or decisions and can fill in missing discovery or concept
    validation that hasn’t been completed. Put another way, one team never simply
    *tasks* another team with development work.

