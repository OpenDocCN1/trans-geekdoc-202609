  trans: '


    SAFe^® 用于管理工作的许多术语（如 `epics`、`features` 和 `stories`）对于任何以前在敏捷环境中工作过的人来说都是熟悉的。SAFe
    还规定了特定的“赋能者”（enabler）工作，即旨在支持团队构建功能特性的工作。


    尽管这些术语很熟悉，但值得花时间理解它们的含义，特别是在 SAFe^® 语境下的含义。


    ### 史诗 (Epics)


    与任何敏捷 MVP（最小可行性产品）一样，团队努力构建一个微小的、廉价的可用功能部分，以测试他们的方法和结果，从而评估收益假设并做出 `pivot`（转型）或坚持的决策。团队经常会构建多个轻量级原型以获取反馈，并在投入构建解决方案的方法之前降低成本和风险。使用精益业务案例和收益假设进行的
    MVP 评估，是 `第 3 章` 中讨论的精益创业循环的应用。


    即使所采取的方法 `doesn’t`（没有）证明收益假设，它也应该被视为 `success`（成功），因为只花费了极少的时间和资金。尽早了解哪些方案不可行是一种胜利，因为防止了时间和金钱的错误投资，并允许更早地尝试替代方法。


    ### 特性 (Features)


    史诗被分解为特性。


    特性和史诗一样，也具有收益假设，这有助于团队关注预期结果、反思所交付的价值，并确定特定解决方案是否按照预期发挥了作用。像史诗一样，特性的收益假设有助于团队“毫不留情且不带内疚地转型”。


    ### 故事 (Stories)


    ### 赋能者工作 (Enabler Work)


    SAFe^® 承认并非所有工作都是用户工作。SAFe 将非用户工作称为赋能者工作。


    为了在整个项目中容纳这类工作，SAFe^® 创建了一个规划和待办列表工具，称为 `Architectural Runway`（架构跑道）。需要注意的是，`HCD`
    工作是该待办列表中探索性赋能者的一部分。SAFe 架构跑道与 `Research Roadmap`（研究路线图）的交集在 `第 14 章` 中进行了讨论。


    ### 程序待办列表 (The Program Backlog)


    程序待办列表由 `ART` 需要交付的 `features`（而不是 `stories`）组成，并由 `Product Manager` 拥有，该经理负责对这些特性进行优先级排序和验收（就像
    `Product Owner` 在团队层面对 `stories` 进行优先级排序一样）。


    ## SAFe^® 中新的规划与交付时间盒


    SAFe^® 的优势之一在于其对工作时长的灵活性。达到一定规模后，项目不可避免地开始考虑更大的工作，因此必须在比两周冲刺更长的时间范围内运行。这并不会降低其敏捷性。由于对程序待办列表有更深入的，并不意味着团队突然要负责交付涵盖
    12 周工作量的详尽需求大书（通常，后期冲刺中的 `stories` 仍在编写和审查中）。这意味着 `epics` 具有足够的复杂性，因此协调工作的窗口更长。团队在执行过程中边学习边适应，并对规划和实施自己的工作具有灵活性责任。对于以人为中心的敏捷来说，这意味着团队应该有足够的前置时间来规划、进行和综合研究活动，以能够指导决策并改进交付的产品。这种更长的时间盒有助于他们规划这些工作。


    ### 计划间隔 (PI)


    为了适应更复杂且需要更长跑道的工作，SAFe^® 使用更长的时间盒规划间隔，或 `PI`。


    ## 大规模下的新流程


    随着更多团队、更大的工作单元以及更长交付时间盒的出现，了一些额外的流程，旨在保持团队同步、管理依赖关系并改进流程。


    ### PI 规划 (PI Planning)


    在 SAFe^® 中，整个 `ART` 在每个 `PI` 结束时聚在一起（如果可能的话在线下）识别风险和依赖，并规划下一个 `PI` 的工作，这是 SAFe
    中具有开创意义（且有趣的！）事件，被称为 `planning interval planning` (`PI planning`）。


    `PI planning` 必须是一个结构化的事件，因为涉及的人很多，他们都必须统一共同的战略、愿景和架构。每个团队都被要求清楚地阐述涵盖整个 `PI` 期间的目标，这些目标反映并支持了整体愿景。在
    PI 规划过程中，团队可以看到并讨论其他团队的目标和工作，进行专门的练习来识别依赖关系，并评估每个团队正在解决的问题所带来的预期价值。


    这些活动通常以 `Executives`（高管）、`Product Managers`（产品经理）和 `System Architects`（系统架构师）围绕他们为什么、做什么以及如何构建（按此顺序）的共同愿景统一团队开始。`Executive`
    解释战略、计划工作如何与该战略对齐以及为什么这很重要。`Product Manager` 解释为 `PI` 优先级排序的 `features`、它们为用户交付了什么价值，以及收益假设和
    `acceptance criteria`（验收标准）是什么。`System Architect` 最后发言，就将使用的技术、技术使用规范以及任何其他保持团队统一共同技术愿景的必要实践与各小组达成一致。`Experience
    Architect`（体验架构师）可能会展示在上 `PI` 中收集的实验结果或用户洞察、当前的评估方法，以及要考虑的整体体验方向的任何新方法，特别关注由于这些洞察而产生的策略转型。


    在这些简报之后，团队进入自己的区域（通常带有画板，或者更好是满墙的画板）进行分组会议，分解优先级排序的特性，识别与其他团队的风险和依赖关系，并为工作制定高层计划。团队将他们的目标总结为一组用业务语言编写的目标，然后由
    `Business Owners`（业务所有者）批准并分配业务价值。团队对即将到来的 `PI` 承诺这些目标，但他们不会对每个冲刺的 `stories` 承诺，保留每两周进行一次冲刺规划的自由，并在每个冲刺中考虑学习结果。团队展示他们的计划以便对所有人透明，并识别和审查风险，以便程序在休会前进行信心投票，以确保所有团队对交付计划的能力有信心。


    `HCD` 实践者应该在各个团队之间流动，听取并观察针对假设的计划，以及任何其他与最终用户情感脱节的内容。


    ### 产品所有者同步 (The Product Owner Sync)


    在许多 `Product Owners` 之间保持愿景的一致。


    在 SAFe,® 中，`Product Manager` 和 `Product Owner` 的角色是分开且不同的。`Product Managers` 在
    `ART` 级别工作，负责 `features`——这些工作集非常大，需要整个 `ART` 花费一个 `PI` 才能完成。然而，`Product Owners`
    与单个敏捷团队合作，负责 `stories`——这是单个团队可以在一次迭代中完成的得得的工作单元。举行 `Product Owner sync` 或 `PO
    sync` 会议是为了了解 `ART` 在实现目标方面的进展，并将 `Product Manager` 的愿景与各个 `Product Owners` 的愿景对齐（此会议有时与
    `Scrum of Scrums` 会议合并并称为 `ART sync`）。


    '
