    当一个项目拥有数十个团队或数百名从业者时，运行一个“扁平”的分布式团队系统就变得不再适了，因为缺乏扩展角色、对齐多个团队的共同愿景、管理共同积压列表，以及最重要的——为大型项目进行预算和资源规划所需的结构。如果一个项目变得过大，如果没有额外的结构，就无法创建一个统一的愿景以及凝聚性的流程和产品集。


