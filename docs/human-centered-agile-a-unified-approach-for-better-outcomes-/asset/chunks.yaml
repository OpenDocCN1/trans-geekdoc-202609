    ### Pivot or Persevere


    Just as ideation ensures the team considers solutions, concept validation provides
    a natural step for pivot-persevere. During ideation, teams consider what type
    of effort they make.


    ![Figure 3.4](Images/Figure3.jpg)


    ### Early Signal of Risks or Challenges


    Even in cases where teams get a clear signal that it is worth moving forward,
    the team may uncover risks that need to be addressed further along. Are there
    specific concepts, labels, or interactions that are unclear? Does it take more
    work than expected to explain what intended is?


    ### Research Activities of Concept Validation


    In concept validation, the team uses early-stage designs (sometimes in the form
    of paper prototypes or other low-fidelity versions) with potential users for direct
    feedback. The amount of work it can take to do this varies, depending on how much
    existing research support there is, and how extensive the research itself is.


    #### Identify Learning Goals


    The first task of any research effort is to identify specific learning goals.
    It is not usually enough to merely show something and "get feedback"—it is important
    that the team consider what it is actually hoping to learn. At the concept validation
    stage, these will be big-picture questions that take the form of questions such
    as:


    - Do users understand what we are making and how it will help them?

    - What is their attitude toward the type of solution we are considering?

    - What are the risks or challenges that they might experience when faced with
    this solution?


    #### Prepare a Research Effort


    Once a learning goal is established, the team will prepare for the research effort.
    This means picking the methodology that works best. In addition to selecting a
    method best suited to answer the learning goals, additional factors may include
    what type tools teams have access to and whether they can devote time and have
    access to direct interaction with users via moderated tests (whether in person
    or remote).

