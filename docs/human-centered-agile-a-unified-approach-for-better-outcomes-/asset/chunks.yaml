    * Mike Torppey and Bernardo Gonzales; without their vision and perseverance the
    first Human-Centered Agile project wouldn’t have happened.

    * Our advance readers for their time, attention, and fantastic feedback. This
    book would have been very different without all of you: Ann Aly, Sree Bhandaram,
    Michael Brown, Catherine Cartwright, Bella Jones, Anneliese LaTempa, Doug Martin,
    Diane McCann, Paul McInerny, Jeff Nichols, Amelia Shuler, James Sperry, David
    Tilghman, and Michael Williams.


    # About the Authors


    `Joe Montalbano` is a Management Consultant, Enterprise Agile Coach, and business
    Agility expert with over 20 years’ experience, primarily in large software development
    environments. He has successfully led multiple, large-scale Agile transitions
    and managed dozens of software development efforts using numerous onshore, offshore,
    distributed, and virtual development teams. He also has hands-on skills throughout
    the Microsoft technology stack.


    `Joe` is an enthusiastic coach, teacher, and facilitator. He holds certifications
    including `CSP`, `SPC`, `KMP`, `PMI-ACP`, `PMP`, and is a `SAFe` Contributor.
    He is co-author of the Amazon #1 best-selling book *Agile Almanac Book 2: Programs
    with Multi- and Virtual Team Environments* and has an MBA from Johns Hopkins University.
    He is an avid wildlife photographer and a less avid amateur radio operator. This
    is his second book.


    `Brad Lehman` began as a front-end coder when his girlfriend (now wife) taught
    him `HTML` so that he could create a website for his record label (“Best viewed
    in Netscape 3.0 or better!”). He became a “design team of one” shortly after that
    and has been working with Agile teams and programs since 2010. He is also a husband,
    parent, design coach, community radio DJ, and avid coffee roaster and drinker.


    # Introduction—How This Book is Organized


    The goal of this book is to help readers integrate Human-Centered Design (`HCD`)
    practices into Agile in a way that extends the Agile mindset and supports teams
    in their work and that lets them learn and deliver truly valuable products faster
    and at lower risk. We’ve divided the content into six parts so that you can easily
    find the content most valuable to you.


    ## Part I—Introducing Human-Centered Agile


    * **Chapter 1**: What Is Human-Centered Agile, and Why Is It Needed?

    This is an introduction to what Human-Centered Agile is and why we think it is
    important. `Part I` articulates the foundation of what Human-Centered Agile is
    and starts to get readers thinking in the “Human-Centered Agile” mindset. This
    chapter also explores why it is such a challenge for `HCD` and Agile to work together
    and proposes a framework for aligning the two mindsets.


    ## Part II—Understanding Just Enough HCD


    * **Chapter 2**: A Primer on Human-Centered Design

    * **Chapter 3**: `HCD` Activities and Artifacts from Discovery through Concept
    Validation

    * **Chapter 4**: `HCD` Activities and Artifacts from Refinement through Evaluation


    This part is an introduction to `HCD` for those who need it. It introduces phases
    of the design process and goes a little deeper into both the activities and artifacts
    that comprise `HCD` work in each of these phases. This section gives the reader
    both a `what` and a `why` of the `HCD` activities and artifacts that should be
    brought into their Agile program.


    ## Part III—How Much and When? Planning and Executing HCD Within Agile


    * **Chapter 5**: Bringing Human-Centered Design Into Agile

    * **Chapter 6**: “What Are the Stakes?”

    * **Chapter 7**: Planning and Conducting `HCD` Activities in Agile


    This part seeks to dispel the misguided myths that `HCD` “needs to slow you down”
    and that “we are trying to see around every corner” (or “boil the ocean”; pick
    your preferred metaphor). Human-Centered Agile doesn’t prescribe that every research
    step needs to happen for every effort. Instead, Human-Centered Agile aligns the
    research effort to the expected impact and risk of a solution being delivered,
    with specific learning goals at each step. These chapters describe how to do that.


    ## Part IV—Larger Programs, Different Needs


    * **Chapter 8**: Managing Distributed Design Efforts in Agile

    * **Chapter 9**: Managing Distributed Research Efforts in Agile

    * **Chapter 10**: Expanding to Small Groups of Agile Teams


    As programs grow in both size and stakes, their research and design need to grow
    as well. This growth means coordination and operations at a program level, not
    just a team level. This part is useful for readers who are at this stage.


    ## Part V—The Largest Programs, Human-Centered


    * **Chapter 11**: An Introduction to `SAFe`

    * **Chapter 12**: Updating `SAFe`

    * **Chapter 13**: `SAFe` Structure

    * **Chapter 14**: Delivery at Scale


    ## Part VI—Measuring and Applying Human-Centered


    * **Chapter 15**: Measuring Performance

    * **Chapter 16**: Human-Centered Agile Applied

