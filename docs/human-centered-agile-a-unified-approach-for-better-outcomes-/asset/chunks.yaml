- raw: "The workshop was a great success. Tom and William had more ideas than they\
    \ could deliver, which was both stressful and exciting. Energized, they picked\
    \ the first couple of ideas off the “must have” pile, and the team got to work.\n\
    \n### Their Schedule\n\nTheir second Kickstarter had corresponded with the holiday\
    \ gift season, and it was now February—they wanted to have new products to offer\
    \ by spring/summer. They hoped to shift from Kickstarter to more conventional\
    \ distribution—both through large online retailers and brick-and-mortar stores.\
    \ They were becoming aware of toy ordering seasons, which took place just ahead\
    \ of actual buying surges (spring/summer, back to school, holiday). Presently,\
    \ they planned to stick with a few distributors until they felt they had a better\
    \ handle on sales and product development but still needed to meet specific dates\
    \ to have shippable stock.\n\nThey decided to focus on three areas:\n\n1.  Better\
    \ instructions at all levels. They needed to consider how to offer other language\
    \ translations (the first thought was to pay college students for French and Spanish\
    \ translations, which would cover most North American audiences). They also needed\
    \ to explore creating assembly videos (and whether *those* would need to be in\
    \ other languages as well) for their current and future products. This work was\
    \ the “low-hanging fruit”—easily accomplished and improved the product dramatically\
    \ for many users while still working with their existing line of stuff.\n\n2.\
    \  Support for STEM teachers. The list of solution ideas ranged from creating\
    \ instructional materials about aerodynamics geared for middle school students\
    \ to making their products more “customizable” for “experiments.” This required\
    \ more research, so William and Tom started working on a plan to conduct more\
    \ interviews in hopes of gaining a better understanding of what would be best.\n\
    \n3.  A version of their product “for smaller hands.” Instead of doing prebuilts,\
    \ they considered products that could snap together, or at least have fewer, larger\
    \ pieces that could be easily assembled. Everyone agreed that, in addition to\
    \ fewer/bigger pieces, including a sticker set so that the planes could be personalized\
    \ was a great idea.\n\nIt became clear that the team had a lot of work to do in\
    \ the next 6–12 months, and they figured more ideas would surface along the way.\
    \ Each focus would occupy much of their time, and they hoped to have something\
    \ for teachers before the next school year started. To help them visualize all\
    \ this work, which product it was for, and which user segment it supported, Laurie\
    \ introduced the concept of an “impact map,” which they collaboratively developed\
    \ (similar image in [Figure 16.4](#ch16.xhtml#_15064-4445_ch016_Figure_004)).\
    \ For more on impact mapping, visit [www.ImpactMapping.org](http://www.ImpactMapping.org).\n\
    \n ![Figure 16.4 An impact map illustrating goals, personas, impact, and features.](Images/Figure16_4.jpg)\n\
    \n[Figure 16.4](#ch16.xhtml#R_15064-4445_ch016_Figure_004) An impact map illustrating\
    \ goals, personas, impact, and features.\n\n## The Workflow\n\nAt first, the new\
    \ workflow was fairly simple. William and Tom had a weekly meeting with the team\
    \ to review progress against the big picture. The partners remained involved in\
    \ most of the work in some way, as well. Tom and William worked closely on their\
    \ new “small hands” planes, which was very reminiscent of building their first\
    \ products. They were able to work on most parts of this product line, including\
    \ the light research on stickers, only outsourcing the sticker visual designs.\
    \ They ended up selecting three sets—one would be boxed with their distributed\
    \ products while the other two were offered as a bonus for online orders.\n\n\
    William discovered that he enjoyed shooting assembly instruction videos about\
    \ as quickly as Tom discovered that he didn’t. Writing the scripts was more time-consuming\
    \ than expected, so William tried improvising at first, but there were too many\
    \ long pauses. Even with editing, it felt awkward. Scripts resolved this issue\
    \ and made the closed-captioning and foreign language translation easier. William\
    \ knew that they weren’t being perfect about making sure that *anyone* could use\
    \ their products (yet), but he tried to include as many people as possible. He\
    \ loved his planes and wanted to make sure that anyone could enjoy them, topics\
    \ he later learned are usually called “accessibility” and/or “inclusivity” (more\
    \ on this in *Accessibility for Everyone*, in the Recommended Reading section\
    \ of the Conclusion). He learned that there are specific standards they would\
    \ need to meet if they ever sold educational products directly to government clients—a\
    \ distinct possibility for educational materials!\n\nThe partners began delegating\
    \ many tasks, relieving their direct involvement but were still able to oversee\
    \ the still-small operation. They had groups responsible for translating and reprinting\
    \ the instructions, fulfilling basic orders, and managing their online product\
    \ selection, email promotions, and social media outreach.\n\nTheir biggest challenge\
    \ remained how to best support STEM educators with their products. They needed\
    \ to spend time talking to actual teachers. Fortunately, Laurie found freelancers\
    \ to assist with user research who engaged with local teachers and camp organizers.\
    \ They quickly uncovered a new market that consisted of day- and week-long camps\
    \ needing educational, fun activities to do with their kids.\n\nDuring these interviews,\
    \ they learned they could likely find camp organizers willing to pay for plane\
    \ kits, as long as there was a proposed way to get a day’s worth of activity out\
    \ of them and the price point was low. On this note, Tom and William wondered\
    \ whether they could assemble a one-week set of activities, increasing from simple\
    \ to more complex activities, to support longer-duration camps.\n\nIn speaking\
    \ with teachers, they learned that, despite the interest, there was little they\
    \ could provide that would be part of the regular curriculum without a budget\
    \ to work with. They considered building a line of cheaper educational products\
    \ that could be used for after-school activities. It seemed that there was an\
    \ overlap between teachers interested in running “flight clubs” and day camps.\n\
    \nTom and William figured that, at the elementary and camp levels, a rudimentary\
    \ overview in understanding how aerodynamics worked with the planes would more\
    \ than suffice for the educational element. They also thought kids may be interested\
    \ in hearing them talk about their products and thought process behind deciding\
    \ what and how to build in conjunction with how aerodynamics affected their airplane\
    \ designs. This, they imagined, could even be an additional instructional video\
    \ offering!\n\n## DIY Fly Learns and Improves\n\nTom and William’s initial experience\
    \ engaging with customers had opened their eyes to possibilities they’d been missing.\
    \ Although they had informally interacted with customers of their products previously,\
    \ the insight generated through the formal focus groups and interviews surprised\
    \ them. Despite the cost involved, they were both convinced of the value of continuing\
    \ this engagement with their current and potential customers to uncover ideas\
    \ for new or improved products.\n\nThey had hoped the email surveys would give\
    \ them some insight into what was driving their customers to make their first\
    \ purchase and even possibly to get ideas for future products, but as it turned\
    \ out, they weren’t able to learn that well enough from email surveys alone. The\
    \ insight they gained through this method was valuable enough that they kept doing\
    \ surveys, but they learned that they had to raise their game if they wanted to\
    \ collect complete and actionable insights."
