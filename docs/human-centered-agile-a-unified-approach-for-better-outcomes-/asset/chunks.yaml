    SAFe® defines two activities within continuous exploration that are of particular
    interest to HCD practitioners: `hypothesize and collaborate` and `research`.


    It is a good practice for the practitioners and teams delivering the work downstream
    to perform this research so that as much of the shared understanding about the
    problem to be solved and user context for solving it as possible is carried through
    the full delivery life cycle.


    ![Figure 14.2 The activities in continuous exploration are highlighted. The ones
    most important to HCD practitioners are hypothesize, research, and collaborate.](Images/Figure14_2.jpg)


    [Figure 14.2](#ch14.xhtml#R_15064-4445_ch014_Figure_002) The activities in continuous
    exploration are highlighted. The ones most important to HCD practitioners are
    hypothesize, research, and collaborate.


    The need for Continuous Exploration within SAFe® means that there needs to be
    established opportunities and processes for teams to do the work that generates
    insights about user needs and expectations, to think along multiple solution paths
    to a problem, and to do both concept and solution evaluation work ahead of code
    delivery—i.e., to “shift” some of the work “left” where learning is less costly.


    ## Continuous Deployment and Post-Release Evaluation


    Continuous deployment, shown in [Figure 14.3](#ch14.xhtml#_15064-4445_ch014_Figure_003),
    is what SAFe® calls the process of taking tested, validated work and deploying
    it to production. SAFe defines four activities as part of continuous deployment:
    `deploy`, `verify`, `monitor`, and `respond`.


    Quality is built in, so the code can be `deployed` to the production environment
    at any time, making deployment a technical decision. Features are built with on/off
    toggles, so deciding when to `release` the feature becomes a business decision
    once it is in production. No longer must Business Owners plan for “migration weekend”
    a month in advance and coordinate heavily with information technology teams. In
    fact, most releases become so low risk that they can happen live during the day.


    ![Figure 14.3 The four activities in release on demand are highlighted. HCD teams
    will apply quantitative and qualitative methods to these activities.](Images/Figure14_3.jpg)


    [Figure 14.3](#ch14.xhtml#R_15064-4445_ch014_Figure_003) The four activities in
    release on demand are highlighted. HCD teams will apply quantitative and qualitative
    methods to these activities.


    When SAFe® is used for software development, a domain where it shines, the full
    power of separating deployment from release becomes apparent. Deployment would
    happen continuously or, at a minimum, every two weeks. Release, however, is when
    Business Owners decide to make that functionality available. This makes it so
    teams never look back at an item and is normally accomplished through a toggling
    mechanism that allows business owners to turn features on and off at will. This
    can be done to test new features on small subsets of users to get additional feedback
    or release functionality when it has the maximum economic benefit.


    Using this paradigm, the business can drive the release of functionality rather
    than having technology or migration schedules dictate the release date. Finally,
    this helps ARTs ensure that.


    HCD practitioners will have direct interest in the `overall experience`. The results
    of both quantitative and qualitative evaluations are brought into iteration planning,
    backlog refinement, and PI planning.


    The quantitative and qualitative activities listed in `Table 17.1` are critical
    because they always perform differently than expected in a controlled environment.
    The same goes for users. These activities, and the insight they generate on cadence,
    allow ARTs to ensure that.


    ### Overall Solution Measurement and Continuous Evaluation


    At the height of teams focusing on delivering specific features, it is essential
    that the program does not lose sight of the experience as a whole. It is entirely
    possible to build a series of features that work as intended but, from a holistic
    experience level, start to detract.


    The product management team (`Product Manager`, `RTE`, `System Architect/Engineer`,
    and `UX Architect`) should generate a plan for solution-level evaluation, which
    is typically more than the sum of all feature-level evaluations. Quantitative
    and qualitative measures go together because quantitative help teams understand
    the “what” (since behaviors are visible at scale) while qualitative measures,
    by contrast, provide a sense of how users are thinking and why they are responding
    as they do.


    While there is no official phase for this in SAFe® (all this work can comfortably
    live in continuous deployment), it is worthwhile to use the concept of “continuous
    evaluation” to reinforce the idea that evaluation does not only happen feature
    by feature when new functionality is released; it is meant to cover the entire
    experience. In this way, HCD practitioners can imagine the continuous delivery
    pipeline as four infinity loops instead of three, with the fourth being continuous
    evaluation.


    ## Research Roadmap and the SAFe® Architectural Runway


    Prior chapters discussed “operations” level activity that provides scaffolding
    for teams to do their own work. Whether technical operations provide the toolchains
    developers will use, the design patterns, templates, and code libraries that support
    consistent customer-facing products, or research recruiting, there is a certain
    amount of support work required to ensure each team avoids building their own
    mini-organization from scratch.


    To do this, SAFe® uses the concept of the previously introduced Architectural
    Runway, which dictates that infrastructure and HCD research be delivered to the
    ART “just in time” rather than as a massive “stand-up” effort that sometimes resembles
    an organizational version of the old “big design up front” model that was discarded
    when moving to Agile. This infrastructure work is brought into the Architectural
    Runway and planned normally. The difference is that it represents organizational
    value rather than specific customer value that gets consumed by teams.


    As the ART develops features within the Architectural Runway, the Architectural
    Runway is consumed, only to be built up again with the next batch of enabler work.
    This is essentially a rolling burn-down chart of ongoing delivery from a backlog.

    '
