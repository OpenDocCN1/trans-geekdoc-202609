    deliver, which was both stressful and exciting. Energized, they picked the first
    couple of ideas off the “must have” pile, and the team got to work.


    ### Their Schedule


    Their second Kickstarter had corresponded with the holiday gift season, and it
    was now February—they wanted to have new products to offer by spring/summer. They
    hoped to shift from Kickstarter to more conventional distribution—both through
    large online retailers and brick-and-mortar stores. They were becoming aware of
    toy ordering seasons, which took place just ahead of actual buying surges (spring/summer,
    back to school, holiday). Presently, they planned to stick with a few distributors
    until they felt they had a better handle on sales and product development but
    still needed to meet specific dates to have shippable stock.


    They decided to focus on three areas:


    1.  **Better instructions at all levels.** They needed to consider how to offer
    other language translations (the first thought was to pay college students for
    French and Spanish translations, which would cover most North American audiences).
    They also needed to explore creating assembly videos (and whether `those` would
    need to be in other languages as well) for their current and future products.
    This work was the “low-hanging fruit”—easily accomplished and improved the product
    dramatically for many users while still working with their existing line of stuff.

    2.  **Support for STEM teachers.** The list of solution ideas ranged from creating
    instructional materials about aerodynamics geared for middle school students to
    making their products more “customizable” for “experiments.” This required more
    research, so William and Tom started working on a plan to conduct more interviews
    in hopes of gaining a better understanding of what would be best.

    3.  **A version of their product “for smaller hands.”** Instead of doing prebuilts,
    they considered products that could snap together, or at least have fewer, larger
    pieces that could be easily assembled. Everyone agreed that, in addition to fewer/bigger
    pieces, including a sticker set so that the planes could be personalized was a
    great idea.


    It became clear that the team had a lot of work to do in the next 6–12 months,
    and they figured more ideas would surface along the way. Each focus would occupy
    much of their time, and they hoped to have something for teachers before the next
    school year started. To help them visualize all this work, which product it was
    for, and which user segment it supported, Laurie introduced the concept of an
    “impact map,” which they collaboratively developed (similar image in `[Figure
    16.4](#ch16.xhtml#_15064-4445_ch016_Figure_004)`). For more on impact mapping,
    visit `[www.ImpactMapping.org](http://www.ImpactMapping.org)`. ![Figure 16.4 An
    impact map illustrating goals, personas, impact, and features.](Images/Figure16_4.jpg)


    `[Figure 16.4](#ch16.xhtml#R_15064-4445_ch016_Figure_004)` An impact map illustrating
    goals, personas, impact, and features.


    ### The Workflow


    At first, the new workflow was fairly simple. William and Tom had a weekly meeting
    with the team to review progress against the big picture. The partners remained
    involved in most of the work in some way, as well. Tom and William worked closely
    on their new “small hands” planes, which was very reminiscent of.


    ### DIY Fly Learns and Improves


    Tom and William’s initial experience engaging with customers had opened their
    eyes to possibilities they’d been missing. Although they had informally interacted
    with customers of their products previously, the insight generated through the
    formal focus groups and interviews surprised them. Despite the cost involved,
    they were both convinced of the value of continuing this engagement with their
    current and potential customers to uncover ideas for new or improved products.


    They had hoped the email surveys would give them some insight into what was driving
    their customers to make their first purchase and even possibly to get ideas for
    future products, but as it turned out, they weren’t able to learn that well enough
    from email surveys alone. The insight they gained through this method was valuable
    enough that they kept doing surveys, but they learned that they had to raise their
    game if they wanted to collect complete and actionable insights.

