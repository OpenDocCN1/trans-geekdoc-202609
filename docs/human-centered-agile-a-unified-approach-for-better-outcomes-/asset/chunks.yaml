    ## Learning goal 2: Identify the preferred method of support. We will include
    a question about how they expect and/or would prefer to reach us after hours.


    **Methodology**: 12–15 one-on-one interviews, expected to take 10 minutes or less.


    **Recruitment**: We will be offering a small incentive ($10 account credit) and
    sending a recruitment email to a sample group of users who have opted in for research
    participation.


    **Share-out**: There will be a one-page or shorter summary of responses, with
    an analysis of current support expectations, and preferred support channels/methods.


    **Story: As a product team, we want to validate that users are regularly experiencing
    frustration that their issues cannot be addressed after hours so that we can address
    their needs in an appropriate way.**


    ## Learning goal 1: Identify whether users who have recently called customer support
    experienced “wait frustration” because they were not able to contact us immediately.


    **Methodology**: A onetime brief (no more than 3 questions) multiple-choice survey
    of customer support users in the past month, with an option for additional comments.


    We expect a “polar” response and that frustrated users will be more motivated
    responders. In this case, this is not a problem—we will evaluate reports of frustration
    both as a percentage of respondents and as a percentage of survey recipients.


    **Recruitment**: We will be offering a small incentive ($10 account credit) and
    sending a survey for response to all users that have contacted us for customer
    support in the past 30 days.


    **Share-out**: There will be a one-page or shorter summary of responses.


    As with any story, research stories should be reviewed, refined, and estimated
    with the whole team, who may have questions or additional thoughts about any of
    the details provided: methodology, questions of interest, or how information is
    distributed. It will also be up to the team to determine how to capture additional
    work—for example, the generation of an interview script might become an acceptance
    criteria item, while the actual conducting of an interview could be a task.


    These examples are for problem validation tied to an epic, but this story structure
    works for any research stories, including concept and solution validation stories.


    ### Ideation and Concept Validation Stories Prior to Features


    Like research stories, ideation stories are tied to an epic and precede identification
    of a specific solution. The goal of an ideation story is to generate solution
    concepts that can be evaluated relative to one another. In the example provided,
    if the team validated a need for additional support, there would be a follow-up
    story to generate solution concepts for providing that support.


    **Story: As a product team, we want to generate and estimate multiple-solution
    approaches that solve a user’s need for after-hours support so that we can identify
    the most promising solution candidates to deliver.**


    **AC1**: We will conduct a workshop-style ideation session, with the goal of producing
    3–5 feasible designs.


    **AC2**: All designs will be given a rough estimate (T-shirt size) for level of
    effort, a score for feasibility, and a score for expected user desirability.


    Upon completion of this story, candidate solution(s) will be selected for either
    development or for further validation if risks are identified (including feasibility
    assessment and/or user acceptance).


    Note that this team has chosen to collaborate on their ideation, so rather than
    describe a specific number of designs, they put a target outcome instead. This
    allows for flexibility in their ideation process. If this team were to produce
    ideas that seemed promising and wanted to ensure that users would be receptive
    to their solution(s) before investing in substantial development work, they might
    then create a new research story for concept validation.


    **Story: As a product team, we want to understand which proposed after-hours support
    options users will find most helpful so that we know whether to move forward with
    this solution.**


    **Learning goal 1**: Identify which support channels users find most valuable,
    from our list of feasible solutions.


    **Methodology**: This will be an asynchronous ranking task for about 50 users.
    We will present users with our five solution candidate options and ask them to
    rank them in order of preference. We will also include an indicator for “would
    not use” as an option and an opportunity for additional comments.


    **Recruitment**: We will be offering a small incentive ($10 account credit) and
    sending a participation link to a sample group of users who have opted in for
    research participation.


    **Share-out**: Solutions will be presented in order of preference score. Insightful
    comments will also be highlighted in a summary document.


    Obviously, this is not the only methodology a team might use to learn this. The
    important thing for the team is that they have a clear learning goal and a shared
    agreement about what kind of evidence is worthwhile in making the next decisions.


    ### Stories Tied to Features


    Once a solution has been chosen and a feature is created (tied to an epic, of
    course), any further research or design stories can now be attached to that feature,
    such as any solution validation stories to test it prior to launch.


    ## Estimating, Planning, and Scheduling Specific HCD Activities


    Interviews take time. Wireframes take time. Research and design are no different
    than other work—the work itself needs to be agreed on, estimated, and delivered,
    just like development work. It is also important for dependencies to be accounted
    for.


    So, how long does it take? “It depends.” That is the first answer given by any
    HCD practitioner when asked how long work will take. Designers are famous for
    it. Good estimation requires a discussion that happens with Designers based on
    their particular skills and the problems they are asked to solve, as well as the
    tools and resources they have available at the outset. (It turns out Designers
    are a lot like developers).


    Generally, however, in order to fully deliver the value of Human-Centered Agile,
    backlogs need to be stable enough to reflect approximately 3–6 sprints (typically
    6–12 weeks) worth of upcoming standard work, with more lead time to account for
    high-complexity and/or high-stakes work that may take longer to research and design.


    ### Discovery Work (Estimate: 1–4 Sprints)


    Discovery work means talking to users to learn what they want. If users are nearby
    and the necessary learning is narrow, this might only require a few days to conduct
    interviews and synthesize findings. However, some discovery work can take multiple
    sprints (weeks or months) to plan and conduct if teams


    *   have a harder-to-reach audience without enough established, understood information
    (this is especially true if travel is required).

    *   have open-ended (exploratory) learning goals or more narrowly focused goals
    of specific problem validation.


    Depending on the learning goals, the team will estimate how long it would take
    to prepare, conduct, and analyze the types of interviews or other work that will
    procure the necessary answers.


    ### Ideation (Estimate: 1 Sprint)

