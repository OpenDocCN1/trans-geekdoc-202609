  trans: '


    并非所有在实施之前进行的工作都具有相同的利益相关者或投入程度。视觉设计可能也可能不需要与其他利益相关者进行协调，例如提供反馈或批准的创意团队或品牌经理。内容创建的生命周期和工作流可能是极其复杂的，会有各种利益相关者参与其中（法务部门、营销团队等）。那些具有独立工作流和审批流程的依赖项，如果团队等到临近发布时才去确保满足这些需求，往往会令团队陷入困境。


    此外，营销或传播通常需要并行工作，以确保产品发布时具有适当的营销和客户支持。在计划发布工作时，每项工作可能都需要一个独立的路线图和待办列表（backlog）来跟踪进行中的工作。


    ##敏捷事件中的 HCD


    除了计划和执行特定 HCD 的用户故事（stories）外，思考 HCD 从业者在典型敏捷事件中的角色也很有帮助。虽然 HCD 从业者是平等的参与者，与任何其他成员无异，但他们被明确赋予了比其他角色更直接地代表用户利益的任务。因此，他们可能会与其他团队成员有不同类型的问题和投入。


    ### 迭代计划中的 HCD：通过提问调整重点


    在冲刺或迭代计划中，即使是成熟的团队也经常执行“准备好、开火、再瞄准”的模式。让 HCD 从业者参与冲刺计划及其配套活动——待办列表精化（backlog refinement），非常有帮助，因为他们会提出具有启发性的问题，例如：


    * 团队是否对用户进行了调查，以找出他们为什么想要这个，并发现是否存在潜在需求？

    * 如果团队以不同的方式解决用户的问题会发生什么？团队是否考虑了多种解决方案，并从成本、灵活性和意愿方面对其进行了评估？

    * 团队如何建立一个廉价且可以快速构建的最小可行性产品（MVP），并在进行进一步投资之前通过实际终端用户验证该解决方案是否可行？

    * 团队是否确定他们提的解决方案符合产品中已有的模式，且不会误导用户？

    * 团队是否创建了解决方案的可视化，以确保产品负责人（Product Owners）和交付团队脑海中的目标真正一致？

    * 团队是否识别出该解决方案使用了最佳设计实践（例如错误处理、交互反馈、清晰的视觉层次结构等）？

    * 团队是否创建了映射回用户情感或用户行为的评估计划？（很多时候，功能交付被视为成功的衡量标准，而不顾结果。）


    ### 故事生成与故事精化中的 HCD


    HCD 在故事精化中的典型角色类似于其在冲刺计划中的角色，但时间跨度更长，更具战略性。HCD 从业者能够在故事精化期间增加价值，恰是因为在会议期间考虑的事项至少在下一个冲刺内都不属于范围内。HCD
    从业者有时间为这些事项收集并应用见解，并在下一次冲刺计划会议之前将它们“准备就绪”。


    ### 冲刺评审：接收增量反馈


    虽然有些团队利用这个机会提供有意义的反馈，但冲刺评审往往是一种仪式性的工作——即产品负责人已经同意并看到的工作正被此获胜地向更广泛的利益相关者群体推出。会查看进度图和燃烧图（burn-down
    charts）。有时完全没有提到路线上的后续计划。这并不是它应该有的。


    冲刺评审是听取关键利益相关者对体验反馈的绝佳机会。如果鼓励他们提问或报告体验，HCD 从业者可能会帮助引导出进一步的见解，将其纳入未来的迭代中，成为画像（persona)/场景文档的一部分，或简单地加强有助于接触用户的关系。一种“开放式”式的冲刺评审也可能建立利益相关者对所构建产品的信心，因为设计决策和权衡是可以进行协商的。


    ### 冲刺回顾：支持流程改进


    冲刺回顾是敏捷流程中另一个与 HCD 结合得良好的领域。


    ## 第四部分：大型项目，不同需求


    ## 第 8 章：在敏捷中管理分布式设计工作


    DOI: `[10.4324/9781003188520-12](https://doi.org/10.4324/9781003188520-12)`


    随着团队和项目增长到多个团队并进入规模化运营，新的需求和复杂性随之出现。项目增长的第一个自然阶段是从单团队转变为几个协作工作的小团队。如果工作被拆分使得这些团队是真正的独立的，那么扩展
    HCD 规模就像是使用研究路线图（Research Roadmap）来计划和整合 HCD 活动，并对 HCD 工作进行评审评估。也就是说，当团队处理的产品互不依赖，或者依赖关系小到可以非正式处理时，他们可以继续独立工作；他们各自拥有一个产品路线图、一个记录支持
    HCD 工作的研究路线图，以及适用于其工作的设计和研究标准。


    当团队开始在共同的产品生态系统或解决方案中工作时，他们必须更新方法。当他们遇到不同团队交付的产品和解决方案的设计一致性问题时，这一点尤为明显。在数字产品中，这通常表现为多种形式：屏幕之间的字体、图形或文案风格不一致；交互设计不同导致完成基本任务（如输入地址）有多种方式；或者反馈和错误信息的交付令人混乱。这甚至会导致用户不确定自己是否处于同一个体验中。不那么严重的不一致会导致用户质疑产品的信誉，或要求他们在学习新功能时花费额外时间。


    在不同团队中工作的 HCD 从业者需要一种让他们的工作保持一致的方法。如果产品相关，设计选择应该反映这一点，而实现这一点的唯一方法是对这些团队进行积极协调。在实践中，这可以从允许团队根据自己的判断偏离的指导，到需要集中设计审批的更严格的治理不等。


