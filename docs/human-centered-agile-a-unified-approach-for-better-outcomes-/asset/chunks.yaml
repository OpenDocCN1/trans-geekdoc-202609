    \n“*Human-Centered Agile* incorporates Human-Centered Design thinking and tools\
    \ into the agile practice environment. The book offers practical ways to combine\
    \ these two disciplines and scale as needed. In this book you can expect to learn:\n\
    \n*   A process for Human-Centered Design activities and artifacts alignment with\
    \ Agile practices that will build better products.\n\n*   How product lifecycle\
    \ work such as evaluating stakes, defining a problem statement and evaluating\
    \ products in the hands of users can be seamlessly integrated with the Agile workflow.\n\
    \n*   How Research Roadmaps can run parallel to the product roadmap and provide\
    \ a clear picture of the overall workload.\n\n*   The elements of research stories\
    \ and sample stories with acceptance criteria.\n\n*   Tips on how to scale Human-Centered\
    \ Agile from one team to many teams.\n\n*   How Human-Centered Design continuous\
    \ evaluation aligns with continuous deployments.\n\n*   How Research Roadmaps\
    \ scale and work with the Architectural Runway.\n\n*   Ideas for creating an Insight\
    \ Repository and lessons learned from incorporating these frameworks into one\
    \ seamless methodology.\n\nThis comprehensive guide helps you determine how much\
    \ and when from the discovery and ideation phase to evaluating the end-product\
    \ in the customer’s hands!”\n\nDiane Brady  \n\nEnterprise Agile Coach  \n\nCo-author\
    \ of *The Agile Almanac Book Two: Programs with Multi- and Virtual-Team Environments*\n\
    \n“Human-Centered Agile introduces a much-needed topic with practical advice on\
    \ how to apply the concept and approach from the smallest agile team to the largest\
    \ product portfolio. The approach addresses many anti-patterns that can happen\
    \ with well-intentioned agile teams. The book has the best practical advice I\
    \ have encountered to address a frequent struggle as agile scales - How do you\
    \ maintain continuity with the user’s experience as development is scaled out\
    \ across multiple agile teams? Joe and Brad have done the heavy lifting for the\
    \ rest of us and have figured out how to map the concept of Human-Centered Design\
    \ to whatever flavor of agile development you might be doing.”\n\nDouglas Peyton\
    \ Martin  \n\nAuthor of *Project Management Hacking*\n\n“Ready to give your organization\
    \ the competitive edge it needs? Look no further than *Human-Centered Agile* by\
    \ Montalbano & Lehman. This groundbreaking book is the ultimate guide for Change\
    \ Leaders seeking to revolutionize their approach to Agile and enterprise transformation.\
    \ Packed with real-world examples and actionable strategies, this must-read resource\
    \ will empower you to not only deliver effectively but also accelerate innovation\
    \ throughout your entire organization. Whether you’re an executive or organizational\
    \ coach, this book is essential for anyone looking to stay ahead in today’s fast-paced\
    \ business environment.”\n\nJorgen Hesselberg  \n\nAuthor of *Unlocking Agility:\
    \ An Insider’s Guide to Agile Enterprise Transformation*  \n\nCo-founder of Comparative\
    \ Agility\n\n“Human-Centered Agile is a holistic approach to integrating Agile\
    \ and Human-Centered Design (HCD) that facilitates vital enterprise-agility, the\
    \ focus of my work for the past decade. Agile and HCD both operate concurrently\
    \ and interactively, energizing and focusing on the product delivery lifecycle,\
    \ which is the determinant of future organizational success. Conceptually, Human-Centered\
    \ Agile is simply teams doing both things at the same time, unleashing amazing\
    \ results consistently.\n\nHuman-Centered Agile (HCA) is a *must have* competitive\
    \ necessity for delivering a powerful *organizational impact*. It is a new way\
    \ of working and thinking that creates a successful competitive response to an\
    \ ever more insane marketplace, making mastery of product and delivery an existential\
    \ determinant. Thus, HCA should not be treated as an HCD “bolt-on” accessory for\
    \ the Agile process.\n\nThe existential reality of today’s marketplace competition\
    \ means only organizations that quickly deliver the “correct” solution will survive,\
    \ much less thrive. That requires building “something” and obtaining user feedback,\
    \ which Agile methods provide. The genius of Human-Centered Agile is that it provides\
    \ a toolkit to improve that “something” from the very first iteration! Human-Centered\
    \ Agile simultaneously and continuously accelerates the integration of learning\
    \ into product development, thereby delivering better products faster and, ultimately,\
    \ unleashing enterprise-wide agility … and the ability to thrive!”\n\nJohn G.\
    \ Stenbeck, PMP, CDAI, CSP,  \n\nThree-time Amazon #1 Best Selling Author, *Enterprise\
    \ Agility Expert*\n\nFirst published 2024\n\nby Routledge\n\n605 Third Avenue,\
    \ New York, NY 10158\n\nand by Routledge\n\n4 Park Square, Milton Park, Abingdon,\
