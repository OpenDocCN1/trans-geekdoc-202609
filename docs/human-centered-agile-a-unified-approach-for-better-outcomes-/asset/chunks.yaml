    \ processes or contemplate changes or experimentation to them, they should consider\
    \ how it supports these four core values. A process change that diminishes or\
    \ is misaligned with any of these four values should be reconsidered.\n\n### SAFe^®\
    \ Principles\n\nLike Agile, SAFe^® is built on principles that successful teams\
    \ will synthesize as they customize their SAFe implementation. These principles\
    \ are built on the foundation of the four values and are intended to inform the\
