  trans: '

    另一个团队完全致力于教育业务，其业务已从仅服务于高中和 STEM 营地市场扩展到高等教育领域，高等教育者发现该团队的产品是其课程的宝贵补充。该团队由一位前教育工作者兼飞行员领导，使用
    `Scrum` 来管理工作。所有团队都结合使用了质量、流、可预测性和解决方案质量指标，以确保良好的产出和结果。团队指标会在每个迭代（sprint）结束时进行审查，包括完成的任务（stories）数量和故事点（story
    points），以及被团队称为“言行率”（say-do）的承诺完成率。他们将质量指标分为两类：基于缺陷的返回率以及基于客户未满足预期的指标。这些指标都是团队回顾会议的输入，并被严格作为帮助团队改进的工具；它们从未被武器化或用于绩效考核。


    William 和 Tom 通过追踪史诗（epics）来保持对他们不断增长的企业业务的了解。Jeff 采用类似的方法管理工作：使工作透明化、限制在制品量（WIP）、进行小规模实验，并根据实验结果做出未来的决策。有时，William
    和 Tom 需要 Jeff 介入并帮助他们专注于完成一件事，然后再开始另一件事，Jeff 将这种需求称为“停止开始，开始完成”。


    例如，他们当时在为较小儿童开发一套新的活动包，同时在为一种电池动力遥控飞机进行复杂的设计，导致两者的进展都微乎其微。听了 Jeff 的建议后，他们很快意识到，将精力限制在一个目标上（即使这看起来违背直觉）也能完成更多工作。因此，他们放下了复杂任务，专注于针对儿童市场的产品，并等到该产品完成后再重新开始新遥控产品的工作。


    每个季度，所有团队仍然会聚在一起进行为期两天的大型规划会议。每个人都期待与其他团队的同仁交流的机会，以及 William 和 Tom 挥霍提供的餐饮，其中包括为欢乐时光（happy
    hour）买单（这是一个重要的成功因素）。这些规划会议对于维持团队协作、减少依赖以及管理无法缓解的风险至关重要。


    随着员工人数增加，William 和 Tom 聘请了一位首席制造官，并将 Julia 晋升为首席产品负责人（Chief Product Owner），她下面还有三位产品负责人。需要这一新的管理层来协调许多团队和多个产品的生产活动。Julia
    现在与所有团队运行产品负责人同步会议，以确保愿景一致，而该策略会根据学习和客户洞察不断演进。Jeff 运行配套会议——Scrum of Scrums，以确保障碍得到快速解决，并在依赖关系成为瓶颈之前进行管理。他们甚至聘请了一位电子工程师来让大家达成共同的技术愿景，随着产品技术复杂性的增加，这变得越来越重要。这个小组构成了管理团队的核心。


    无论如何，他们的团队每天都会单独开 15 分钟会议规划当天的工作。多年来，有些团队尝试过这种每日会议的变体，减少频率或要求的参会人员，但最终回到了原始流程，因为每日规划和同步对于必要时进行协调和转型的能力至关重要。


    随着 William 和 Tom 业务的增长，他们发现自己疏远了日常运营。对事物的热情依然存在，但产品线已经了自己的生命，并交给了能干的人手。这家公司是他们的孩子，尽管他们不再那么亲力亲为并可以考虑出售，但他们还没有准备好将产品、人员或流程委托给另一公司。相反，他们决定寻找机会，在积累经验的同时提供新的挑战。


    为了呼应过去，他们召集了几位最信任的员工并进行了一场工作坊。他们回到最初聚在一起脑暴产品构思的会议室，甚至仍由同一家公司提供餐饮（以示怀旧）。这次，目标是识别他们可以如何扩张，而不是思考如何将几个产品变成更多几个。


    每一个想法都挂在墙上：无人机、船、潜水器、更先进的航空电子设备、风筝，甚至包括物理辅导。这些指标都是团队回顾会议的输入，并被严格作为帮助团队改进的工具；它们从未被武器化或用于绩效考核。（*注：此处原文似乎存在部分逻辑重复或衔断问题，已按原意翻译*）


    ……由于原文后续的逻辑混乱……（*注：原文在此处出现了语义违和或重复的表达*）


    最后，William 和 Tom 决定，对模型飞机的热爱将他们带入了业务，然而他们也在思考“飞行”在 DIY 中有多重要。最后，他们排除了非教育类产品（空间太拥挤了）和遥控技术（太危险了）。他们选择了船、潜水器，以及一个名为“户外探险盒”的承诺装备。凭借清晰的愿景、一系列新想法以及他们信任的方法，未来的道路尚不确定，但他们知道这不会无聊。


    # 结论


    DOI: [10.4324/97810318852023](https://doi.org/10.4324/97810318852023)


    将敏捷与以人为的设计相结合的挑战对于任何尝试让两者运作的人来说都是显而易见的。为了使其运作，团队需要对做好设计和研究有健康的理解，还需要一个对执行这些工作感兴趣的团队（或项目）。还需要一种允许开发者
    `hands on keys` 之前进行所有战术工作的结构，并将学习的战略价值纳入决策。


    当执行得当时，以最快、最廉的方式获取成功所需知识的这一和谐目标，正是这项工作的意义所在。在降低生产成本和规避风险方面，回报是巨大的。

