    Ideation is the phase during which teams generate multiple `high-level` solution
    concepts. These concepts need to be robust enough for the team to do a rough evaluation
    of the effort and risk of each solution candidate and to decide which solution
    candidates to validate with users. This is so the team can make informed decisions
    about which solution is the best fit for the problem being solved. At this point,
    the big picture of the solution is clear, but the details may not be.


    There are fundamentally two paths that teams choose when trying to get to agreement
    on the basic design of a product—collaborative design workshops and conceptual
    designs.


    ## Collaborative Design Workshops


    In this scenario, the `Designer` works with other stakeholders (sometimes including
    users themselves) to collectively brainstorm solution possibilities. Workshops
    can vary a great deal in structure and duration, but the goal is to give teams
    and stakeholders a shared understanding of the purpose of the solution and problems
    to be solved and then to set them loose creatively (within whatever constraints
    apply) in solving those problems.


    ## Independent Design


    In this scenario, the `Designer` works independently using discovery artifacts
    to create design approaches that are presented to the `Product Owner` and team
    for feedback. At this design stage, major/key steps are considered and limited
    to so-called happy path activities (without exploring edge cases or error handling).
    The solution concepts are clear enough to initiate discussions and begin receiving
    feedback about the level of effort required for delivery and overall user value.


    ## Experience Risk Evaluation


    One of the advantages of collaborative ideation, which includes multiple stakeholders,
    is that experience risks emerge early. Human-Centered Agile practitioners are
    focused on risks regarding whether a team is building unwanted or unsatisfying
    solutions, but collaborative ideation also promotes early awareness of other risks
    (technical risks, policy risks, etc.) that can surface and be captured and addressed.


    ### Design Artifacts of Ideation


    ![](Images/pg47.jpg)


    A `storyboard` (and its cousin, the comic) is a narrative description of the solution
    to be developed, supported by sample or low-maturity visuals that represent how
    a user is moving through the process. The value of the storyboard is that it is
    easy to understand and share as a solution concept and explicitly includes the
    user and their thinking as part of the description of the solution. As a side
    benefit, narrative explanation can spark further imagination and exploration work.


    `Screen/user flows` are similar to storyboards but are presented from a product
    perspective rather than in a narrative format. `Screen flows` (or `user flows`)
    are a step-by-step sequence of screens or other interaction touchpoints that will
    take the user from intended action(s) to completed action(s). The value of a screen
    flow is that teams can dive slightly deeper into how the solution works, using
    the platform it is being created on (e.g., mobile devices, computer screens, point-of-sale
    interfaces, etc.).


    `Wireframes` are a low-fidelity version of the screen. At this stage, these can
    range from whiteboard or pen-and-paper drawings to higher-fidelity renderings
    but are still low in design maturity.


    ## HCD and Concept Validation


    During concept validation, the team reviews conceptual designs with users, to
    ensure that solutions are addressing user needs in a useful way. If multiple solution
    candidates are under consideration, gathering user attitudes toward each also
    allows for a better decision on which solution will provide the best experience.
    These efforts ensure that teams spend time working on products that users want
    and understand.


