    # 构思 (Ideation)


    构思涉及根据已有的用户和业务利益相关者信息，并确定如何解决他们的问题或满足他们的需求（有时被称为“我们可能如何……？”）。这意味着要决定哪种类型的解决方案最适合任务，并理解该解决方案在现实中可能是什么样的。为了这一点，团队必须确定可接受的方案范围——由于通过之前的步骤，我们已经对用户想要什么以及如何判断成功有了明确思路，因此选择方案就变成了在业务愿意投入的时间和精力范围内，找出哪种方案能最有效地交付结果。务必记住，这种构思工作仍然是一项相当“宏观”的工作。


    本章较早关于制作额外支持渠道的构思示例，可能会产生几个候选方案：


    * 一个 常见问题解答（FAQ）页面和一个 help@yourcompany.com 邮箱地址

    * 一个带有预定义答案的问题或带有自动填充的开放文本字段的表单

    * 与专业支持人员的在线会话

    * 基于人工智能/机器人的支持，它利用广泛的数字数据源学习如何有效地向客户提供回答

    * 一个独立的支持应用程序，包含自服务信息和基于位置的问题报告功能，包括照片/视频上传


    显然，列出的解决方案示例并不详尽，它们也没有考虑主动的支持措施（例如对客户进行定期外访）。显而易见，设计和交付每个方案的投入程度可能差异巨大。


    对于最简单的解决方案，团队可以预计大部分构思工作可以在单个冲刺（sprint）内完成（可能只需要几天）。这是一种常见的结果，但并非必然。随着解决方案的想法变得越来越复杂（且可以借用的良好定义约越少），特定功能的概念设计可能会花费更长时间——在示例中，支持应用的设计将需要更长时间。


    ## 概念验证（预计：1–2 个冲刺）


    ![](img/pg109.jpg)


    以人为中心的敏捷开发（Human-Centered Agile）意味着计划从用户那里学习，以降低构建不受欢迎产品的风险。团队应该根据构建提议功能的风险来计划概念验证，这些风险包括时间、交付成本，或者如果发布不当可能导致的声誉损失或机会错失成本。


    在上一个示例中，团队可能不需要对电话或电子邮件解决方案进行概念验证，但可能会对基于表单的解决方案考虑验证（特别是对于那些需要构建大量表单、表单包含大量逻辑，或需要用户提供大量时间或敏感信息才能完成的方案）。如果客户只习惯于直接与代表交谈（特别是在提供敏感信息时），构建聊天解决方案将是错误的；如果客户无法想象在稀有的支持场合需要或使用一个独立的、单一用途的应用程序，那么开发一个专门的
    App 也是错误的。


    与所有测试一样，投入的精力将取决于需要学习的什么。方法论应由特定的学习需求驱动，而投入水平应由结果的风险大小驱动（是需要原型，还是通过简单的访谈甚至焦点小组会议即可完成学习？）。


    ## 精炼（Refinement）（预计：1–2 个冲刺）


    ![](img/pg110.jpg)


    精炼是以人为中心的设计（HCD）与传统敏捷开发协作最直接的地方。当用户故事（stories）被精炼到开发者可以处理的程度时，可能会创建特定的设计产物来支持开发工作，例如描述特定交互、行为和结果的线框图或截图。这通常可以在精炼进行的同时发生（提前
    1–2 个冲刺），尽管更复杂的设计和交互可能需要更长时间。


    ## 方案验证（预计：1–3 个冲刺）


    ![](img/pg111.jpg)


    通常，方案验证以可用性测试的形式出现。与早期的研究一样，所需的时间取决于用户招募的组织程度、从可用性测试中学习多少内容，以及为了获得预期的学习结果测试需要多严谨。


    例如，团队可能希望进行类似于可用性的“烟雾测试”，向用户展示新功能以确保他们理解其用途并能够完成任务。这与“功能测试”的区别在于，后者只提供了一个任务，而没有提供完成任务的脚本操作。这凸显了导航问题或缺陷，特别是当每个功能运行正常但用户无法确定正确路径时。这种类型的任务可以指导“通过/否”的决策，且执行较快。学习目标仅仅是确保用户不会带着困惑的问题冲击支持团队。


    或者，团队可能希望更全面地了解用户如何体验复杂流程、产生的情绪（沮丧还是惊喜）、特定的步骤、交互、语言片段或改进体验的支持功能。深入探讨额外的问题和复杂的路径在设置、实施和分析方面需要更长时间。


    ## 评估（预计：1–2 个冲刺）


    ![](img/pg111a.jpg)


    评估是以人为中心的敏捷开发的一个基本环节，因为如果不衡量发布，几乎无法判断创建的解决方案是否实现了预期结果。以人为中心的敏捷开发意味着评估产品并将见解带回整体产品策略，以便团队对如何投入精力以产生预期结果做出正确的选择。


    评估需要与其他研究工作类似的规划和准备。团队为衡量成功的任何工作（希望在过程早期已定义）都需要投入，也需要计划。这里的区别在于，评估工作的部分计划可以在开发期间进行，但由于评估在发布后才能进行，某些计划必须等待。例如，招募应该在确定发布后才进行，测试脚本必须反映最终发布的的产品。


    # 使用估算计划 HCD 工作


