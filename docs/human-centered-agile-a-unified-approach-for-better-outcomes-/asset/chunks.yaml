  trans: '


    当开始处理分布式设计工作时，产品团队通常会尝试先建立基础的设计标准（如果这些标准尚未建立的话）。在之前的单团队阶段，设计标准根据所需的具体化程度，通常被归纳到样式指南或模式库中，以保持一致性。在之前的阶段，这些文档的目的主要是`纵向`的，团队希望确保其未来的决策与过去的决策保持一致。此外，他们可能为了效率而开发一些产出物，例如可重用的模板，以便更快速地描述设计。


    当组织转向分布式工作时，对维护一致性的关注就不再仅仅是`纵向`的，还涵盖了`横向`维度。一个团队做出的影响整个设计生态系统的决策，需要尽可能快地被其他设计团队同意并同化。否则，竞争性的设计方案就会出现。


    # 产品设计的一致性


    `design ops` 的目标是让团队层面的`Designers` 足够的独立性和灵活性来解决他们眼前的特定问题，同时确保他们的设计符合其部署的上下文。


    设计一致性是指设计中`所有`方面的一致性：


    * `视觉—`使用相同的颜色、字体和字体大小

    * `交互—`从一个用户到另一个用户的产品外观、行为和错误管理都是统一的

    * `内容与语气—`整个产品组合中使用标准化的词汇和语气


    根据环境的不同，团队在产品设计方面可能有多个利益相关者。应该有人跟踪品牌元素的使用（如颜色、标志等），以及材料在使用上是否存在政策或法律限制。确保新设计反映了良好的产品愿景并遵守任何其他限制条件，对于交付产品至关重要。


    ## 确保跨团队一致性的工具


    目前的文档可能仅仅是定义性的，例如某些颜色值的使用或特定字体的指示。作为一个单团队，关于如何以及何时使用这些元素的持续讨论（例如，什么样才是对强调色的良好使用，或者不同的标题样式）虽然很重要，但可能是在产品设计和实施的流转中自然发生的。作为一个分布式团队，能够参考多个团队共同贡献并并在其中拥有利益的决策是至关重要的。


    如果一个团队已经在使用样式指南或模式库，那么向分布式团队的转型就需要对这些文档进行演进。除了样式的`定义`（例如，不同标题在字体族和大小方面看起来什么样），文档现在还应该包含样式`指导`（例如，何时使用每个标题是合适的）。指导会与新的`Designers`进行评审，以确保他们理解了如何应用这些模式。


    如果团队尚未开始使用样式指南和模式库，那么现在开发它们就是至关重要的。对于受益于更稳健的中心化设计的大型项目，两个新概念——代码库和设计系统提供了更高水平的细节和效率，因为前端代码被整合到集中维护的设计资源中。


    `Code Libraries—`一组开发的代码，用于以重复的方式一致地渲染设计并促进代码复用。它们通常（但并非总是）构建在特定的前端框架之上——一个通常混合了
    `HTML`、`CSS` 和 `JavaScript` 的通用代码库，创建出一致的外观和行为（示例包括 `Twitter` 开发的 `Bootstrap`，或基于
    `Google` `Material Design` 的 `Material-UI`）。


    `Design Systems—`一种旨在将样式、模式、代码和指导（包括高级设计原则）完全聚合到一个管理且可实施系统中的工具。通过创建设计系统，团队为他们的`Designers`提供了工具，这些工具应该帮助他们分配更多时间处理设计过程中更困难的部分。在分布式团队层面，团队可能会发现创建一个早期且非常基础的设计系统是有用的。要查看一些设计系统示例，请查看
    `IBM` 的 `Carbon Design System`。


    ## 设计治理


    与任何标准实践一样，创建预期`Designers` 遵循的设计标准也有其优缺点。一方面，产品的外观和行为将保持一致，更紧密地反映组织对于“产品应该是什么样”的直觉。设计标准还为微观层面的决策提供了指导，例如如何处理特定的重复交互以及应用指定的视觉样式。这使得团队能够更快地生产高保真的设计。


    另一方面，设计系统本身需要维护投入，单个团队或`Designers` 可能会觉得在能够产出的方面受到过度限制。根据团队文化和利益相关者义务的限制，团队必须确定正确的治理水平来补充他们的标准。


    对于样式指南或模式库，没有唯一的“正确”细节程度。“正确”的细节程度是适用于所有团队的水平。然而，处理此问题的最常见方法有三方式：


    `自愿合规—`这种方法通常适用于小团队，它产生了标准，但允许在团队层面完全自愿合规。换句话说，`Designers` 拥有一套可以根据意愿选择（或不选择）的工具，而关于什么是“足够好”的一性的判断发生在团队层面。这避免了治理中带来的任何额外开销的烦恼。然而，不强制的标准可能会导致更多的一致，但不是完美的一致。


    `中心化设计评审与审批—`创建一个中心化的评审和审批流程是向创建更多一致性的下一步。设计在开发者实现 `之前` 就会对其对标准的合规性进行评审。`Designers`
    通常会提交提议的设计进行评估，作为该评估过程的一部分，将审查其是否遵循或不既定标准。


    `外部设计评审与审批—`如果组织要求额外的利益相关者评审设计的任何部分或文案，团队也将希望这些审批在设计被认为“准备就绪”之前完成。


    # 协调设计活动


    ### 协作构思


