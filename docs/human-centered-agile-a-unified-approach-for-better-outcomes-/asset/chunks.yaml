- raw: 'In the problem definition phase of any effort, True North metrics should be
    established, so when new features are delivered, it is possible to evaluate how
    successful the release was. This should be baked into the process at the point
    where the Minimum Viable Product (MVP) is formed as a hypothesis about how an
    effort delivers value.


    ### Signal Metrics


    Any metric meant to provide indirect information about how well a product is likely
    to perform is a signal metric, and there is a wide variety of signal metrics that
    teams may benefit from tracking.


    Classic examples of signal metrics for online products are bounce rates, time
    on a page, time on a site, total page views, and so on. Another example is that
    for products with a clear path from engagement to transaction, generally there
    is some sort of funnel analysis to examine how far customers get into the process.
    If a user is dropping out at a specific point of a purchase process, that might
    indicate any number of possible problems with the process that merit further exploration.


    ### Identifying Which Metrics to Track


    A metrics discussion ordinarily begins with the question, “What statistics can
    we track?” However, all metrics are not created equal. Time and effort spent on
    so-called vanity metrics (the kinds of metrics that might seem valuable on a report,
    but do not actually inform product strategy decisions) might be wasted or prompt
    decisions that optimize for something counterproductive. Additionally, not all
    metrics-gathering efforts are going to be completely passive. There are points
    during an experience during which teams want to ask their end users to provide
    specific feedback (“rate your experience”). Instead of trying to interpret all
    the signals available, identifying the questions that *need* to be answered about
    the product or experience being created is a better approach.


    These questions can be high level or granular. It is not uncommon for a team to
    propose a number of questions that they would love to have answered, ranging from
    attitudes about the product/experience as a whole to user feelings and behavior
    motivations during specific moments, interactions, or steps within a larger overall
    journey.


    Once a list of questions to answer has been developed, the Agile team should hold
    a workshop or exercise to determine which questions can and cannot be answered
    and at what cost. Even decisions about how much work to put into gathering metrics
    are stakes-based decisions!


    ### Simple Surveys


    Simple surveys are a common tool for gathering insight directly from customers.
    Among Human-Centered Design (HCD) practitioners, surveys have a somewhat diminished
    reputation as they are a lower-fidelity method to collect feedback. When utilizing
    surveys, teams cannot directly observe or ask follow-up questions, so they rely
    on a user’s self-report. Surveys may also be prone to motivation biases (only
    the happiest and unhappiest users provide feedback). Even with these shortcomings,
    surveys still have several strengths as a methodology: They are simple and relatively
    inexpensive to administer, can provide longitudinal information across a broad
    group of users, and, when created and analyzed thoughtfully, can yield valuable
    insights.


    #### Net Promoter Score (NPS)


    NPS attempts to boil down user sentiment into a single number by asking how likely
    they are to recommend the solution to a friend on a scale of 1–10. Users who rate
    themselves a 9 or 10 are referred to as “promoters,” users rating themselves 7–8
    are considered “passives,” and those rating themselves 6 or under are considered
    “detractors.” From there, a calculation is performed that subtracts the percentage
    of detractors from the percentage of promoters and expresses the result as an
    integer. Ideally, users are polled on cadence, so trends in NPSs can be seen graphically.


    While popular, NPS is not without critics. The main criticism is that the score
    is so broad and reductive that it is of limited use. A team can tell at the highest
    level whether sentiment about the product is trending positively or negatively,
    but there isn’t any indication of *why*. While this is true of the score itself,
    NPS can also be used to solicit comments and direct feedback, so there is at least
    some additional potential for a team to use it for more robust sentiment analysis.
    Additionally, NPS is best suited for commercial experiences. Not all experiences
    fit a recommend/detract model, which quickly becomes obvious for teams delivering
    government services or providing needs-based nonprofit giving.


    Finally, when dealing with a complex experience or an experience with a longer
    duration and multiple touchpoints, it may also become challenging to identify
    whether an NPS represents the holistic experience or a specific moment/interaction.
    Incidentally, this critique is important for any single-score rating of a complex
    experience, whether an NPS or alternative, such as the Likert scale scoring system
    shown in [Figure 15.1](#ch15.xhtml#_15064-4445_ch015_Figure_001).


    #### Ratings and Direct Feedback Moments


    *   *Are you finding this chapter helpful?* 👍 👎


    *   *How would you rate this book?* ☆☆☆☆☆ (Five stars, please!)


    ![Figure 15.1 A sample Likert scale rating, which is usually presented in a 5-,
    7-, or 9-point scale.](Images/Figure15_1.jpg)


    [Figure 15.1](#ch15.xhtml#R_15064-4445_ch015_Figure_001) A sample Likert scale
    rating, which is usually presented in a 5-, 7-, or 9-point scale.


    Users are regularly asked to provide in-the-moment feedback. Many times, when
    providing negative feedback, the user will also be prompted to offer comments
    to further describe any issues they encountered. Much like NPSs, these scores
    are most valuable when there is some sort of informative, apples-to-apples comparison
    (e.g., ratings scores across similar products) or a longitudinal tracking of experience
    (where ratings move up or down reflecting changes that have been made). These
    are blunt tools, and teams may find more actionable insight in specific comments
    than in a score. Unlike NPSs, these ratings can be more easily applied to a specific
    moment or experience that the team is interested in measuring.


    #### System Usability Scale


    Slightly more rigorous than NPSs are system usability scale (SUS) scores,[^(68)](#fn68)


    The scale is calculated by asking users their agreement with 10 statements, using
    a 5-point Likert scale. The following are the questions on the SUS survey:[^(69)](#fn69)


    1.  I think that I would like to use this system frequently.


    2.  I found the system unnecessarily complex.


    3.  I thought the system was easy to use.


    4.  I think that I would need the support of a technical person to be able to
    use this system.


    5.  I found the various functions in this system were well integrated.


    6.  I thought there was too much inconsistency in this system.


    7.  I would imagine that most people would learn to use this system very quickly.


    8.  I found the system very cumbersome to use.


    9.  I felt very confident using the system.


    10.  I needed to learn a lot of things before I could get going with this system.


    ### Custom-Built Surveys


    Because surveys are so popular, it is common for teams to create their own surveys
    to better understand how users feel about their products. Custom-built surveys
    offer a tremendous advantage in that teams can build questions based on their
    learning goals (rather than using generic NPS-like ratings) and mix quantitative
    score-gathering questions with qualitative questions that seek open-ended feedback.'
