- raw: 'If there isn’t already a cleverly named law to describe the fact that successful
    teams will inevitably grow, there should be. Successful teams generate business
    value and create new opportunities. They get noticed and asked to deliver increasing
    amounts of value. Team members are added to enable more ambitious goals. The larger
    team becomes unwieldy and starts to struggle in ways that the smaller team did
    not. The inevitable split into two smaller teams creates more success but adds
    a whole different set of problems. When programs incorporate multiple teams, teams
    will need to start developing processes for coordinating their overall delivery
    work.


    ## How Many Product Owners Should There Be?


    As programs grow in size to the point where they have more than one team or a
    small cluster of teams, it is critical to consider whether they can still be handled
    by a single Product Owner. The role of Product Owner happens to be one of the
    roles in Agile that doesn’t scale very well. Even a good, experienced, engaged
    Product Owner with no other commitments (clearly a fictional character) can handle
    two Agile teams at the very most. Scrum Masters scale a little better, but a full-time
    Scrum Master can still only handle three teams simultaneously. Sometimes, growing
    programs in this situation will ask other team members to do double duty as Scrum
    Master. Avoid this anti-pattern if possible, as it creates conflicts of interest.


    ## Updating Team Topology


    There are a variety of new activities and responsibilities that go along with
    coordinating distributed design and research in an Agile environment. New people
    are often brought in specifically to manage or conduct team coordination activities,
    particularly when teams are struggling to handle the extra HCD responsibilities
    and maintain their velocity or when consensus gets harder to reach.


    **Design or Creative Lead—**This person is responsible for defining design standards
    and ensuring they are followed to the degree required. They are also responsible
    for ensuring that tools and templates are maintained and evaluating design work
    at a program level to certify that the quality of design is appropriate.


    **Research Coordinator—**This person is responsible for the maintenance of any
    materials described in the research ops section, ensuring that research is planned
    in such a way that there is enough time for it to be designed and conducted with
    added time for teams to ingest those insights within their delivery cycle.


    **Recruitment Coordinator—**Because recruiting is one of the “heaviest” parts
    of the research process, it is very common to have someone handle all the details
    and activities of recruitment for the necessary research.


    Sometimes, the first two roles are combined into something that sounds more like
    a “UX Architect” or another generalized design leadership role that has tasks
    above the individual contributor layer. And while a new role doesn’t *necessarily*
    mean a new person to conduct that activity, it does require that time be set aside
    for the planning and coordination activities themselves.


    ## Scrum of Scrums—Organically Scaling Scrum


    More people means longer and less productive meetings. This is one of the first
    problems teams encounter when trying to scale Scrum. A common pattern to work
    around this issue is to scale the daily standup (technically called the “daily
    scrum”) to a higher level “Scrum of Scrums, (shown in [Figure 10.1](#ch10.xhtml#_15064-4445_ch010_Figure_001)).
    This daily “Scrum of Scrums” involves only one or two people from each team, specifically
    to keep the membership small and the meeting timebox tight. Where teams are concerned,
    smaller is better.


    ![Figure 10.1 A small cluster of teams and a Scrum of Scrums.](Images/Figure10_1.jpg)


    [Figure 10.1](#ch10.xhtml#R_15064-4445_ch010_Figure_001) A small cluster of teams
    and a Scrum of Scrums.


    Any impediments that cannot be removed by the team themselves or by their Scrum
    Master are brought to the scrum of scrums. Scrum Masters attend as do people with
    the best knowledge about whatever issues the teams are facing. Scrum Masters take
    turns facilitating these meetings, and anything learned at this meeting is then
    taken back to the teams immediately.


    ## Team Alignment Activities


    ### Intake, Problem Definition, and Communicating Design Goals


    It is critical to practice the proper initiation of work on a feature level (and
    larger) in Human-Centered Agile. This begins with a clear problem definition with
    well-written epics that articulate a solution to a user need or problem. Without
    a team-wide shared understanding of the impact a feature should provide, teams
    will struggle to move past basic task management to a more Agile mindset of creating
    solutions that deliver the best value and can be iterated on. Put simply, good
    problem definition is the difference between effective Agile and simply trying
    to apply Agile terminology to older processes.


    Teams should start feature (or epic) work with a problem definition step, which
    includes defining user outcomes and success metrics. This step takes place ahead
    of any work that the team picks up and captures the context of the work that the
    team is about to engage in. Incidentally, this is referred to as a problem definition
    rather than a *kickoff* because kickoff is often used more expansively and can
    mean anything from strategic consideration of whether work should be done all
    the way to just being a meeting that assigns a team to pick up already-defined
    work.


    ## Holistic Teams, Holistic Work


    Human-Centered Agile takes a *holistic* approach to teams, both to preserve team
    independence and flexibility in solving problems and to see that the solution
    is delivered and evaluated by the team that identified and understood the problem.
    This “whole team, whole problem, whole outcome” mindset is an essential concept.


    The idea in Human-Centered Agile is that the team working on the problem has ownership
    from the problem definition stage through the product evaluation. Keeping one
    team engaged from problem definition through solution delivery maintains alignment
    around the purpose of the work and ensures that the team makes decisions based
    on intended outcomes rather than drifting toward more convenient decisions in
    terms of development, which may not produce intended results. It also keeps teams
    from slowing down due to a lack of confidence in the “right problem” and “right
    solution” decisions, as that team has already worked through those steps together.


    ### Team-to-Team Handoffs


    Ideally, Agile teams work on a problem from end to end, which is true in Human-Centered
    Agile as well. However, when scaling to a group of coordinated teams, having a
    single team work through features end to end becomes increasingly challenging.
    Looking back at the example of creating an “after-hours support capability” that
    was presented in [Chapter 7](#ch07.xhtml#_15064-4445_ch007), the team that did
    the initial research might recommend a chatbot to serve some customers and a standalone
    application that serves others. These solutions may be too much for just one team
    to deliver, so another team is brought in.


    In Human-Centered Agile, the team being brought in is now given responsibility
    for the problem (after-hours support capabilities), the solution (an application),
    and the outcome, including determining how to best measure success. The new team
    could very well learn that people don’t need support (“oops the discovery was
    wrong!”) or that they don’t want an app at all (“did you all even validate that
    this is something people want?!?”). In this context, the new team has permission
    to question any previous findings or decisions and can fill in missing discovery
    or concept validation that hasn’t been completed. Put another way, one team never
    simply *tasks* another team with development work.'
