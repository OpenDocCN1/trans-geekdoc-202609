    Ethnography is the participant observation of culture. In HCA and software development,
    it will usually refer to immersive methods of understanding communities by examining
    their digital footprint (as more literally immersive techniques are cumbersome
    if even available). This can be done by reviewing their online community behaviors
    (such as in discussion forums or across social media) where the observation can
    occur without being intrusive.


    ### Analytics Review


    Analytics review is, as it sounds, a review of tracked user behaviors. This allows
    teams to identify potential difficulties users are having and which may need further
    qualitative investigation.


    ### Research Artifacts of Evaluation


    Research artifacts from a contextual inquiry will resemble the artifacts of previously
    discussed research efforts from concept and solution validation.


    `Sentiment analysis reports` are the synthesis of any sentiment gathering that
    the team conducts (such as surveys, etc.) into a report. When sentiment is gathered
    from sources like surveys or help desk logs, then user comments are often additionally
    analyzed for key words or other nonnumeric indicators of sentiment.


    Note that the data pools from which sentiment is being drawn may contain biases.
    For example, one might expect a different sentiment from solicited opinions through
    a survey (polar response) than support calls, which may reflect tool frustration
    or feelings about the support process itself rather than the product and may also
