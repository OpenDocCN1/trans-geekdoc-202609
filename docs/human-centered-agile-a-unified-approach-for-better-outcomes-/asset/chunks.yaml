- raw: 'Ideation involves taking what is known about users and business stakeholders
    and determining how to solve their problem or serve their needs (sometimes referred
    to as “How might we?”). This means deciding what type of solution is best for
    the job and understanding what that solution might look like in reality. To do
    this, the team must determine the acceptable range of solutions—and because there
    is already a clear idea of what users will want and how to determine success from
    prior steps, selecting the solution becomes a matter of figuring out which will
    most effectively deliver results within the amount of time and energy the business
    is willing to invest. It’s important to remember that this ideation effort is
    still a fairly “big picture” effort.


    The example ideation story earlier in the chapter, for producing additional support
    channels, might produce several candidate solutions:


    *   An FAQ page and a [help@yourcompany.com](mailto:help@yourcompany.com) email
    address


    *   A form with questions that have pre-defined answers or open text fields with
    auto-population


    *   A live chat session with a support professional


    *   Artificial intelligence/bot-based support that can learn to respond effectively
    to customers using a wide range of digital data sources to provide answers


    *   A stand-alone support app that includes self-service information and location-based
    issue reporting capabilities, including photo/video uploads


    Obviously, the listed solution examples are not comprehensive, nor do they consider
    proactive support measures, such as scheduled outreach to customers. It is clear
    that the range of effort in designing and delivering each can vary wildly.


    For the simplest solutions, teams could expect most of the ideation to be completed
    within a single sprint (maybe a couple of days). This is a common outcome but
    not a certain one. As solution ideas get more complex (and have fewer well-defined
    conventions to borrow), the conceptual design of specific features can take longer—in
    this example, the support app would take longer to design.


    ### Concept Validation (Estimate: 1–2 Sprints)


    ![](Images/pg109.jpg)


    Human-Centered Agile means planning to learn from users to mitigate the risk of
    building unwanted products. Teams should plan for concept validation based on
    the stakes of building a proposed feature, in time and either cost of delivery
    or cost in terms of reputation or lost opportunity if a rollout goes poorly.


    In the previous example, the team would likely not need to conduct a concept validation
    on the phone or email solutions and might consider it for a form-based solution
    (particularly for those that require building a high number of forms, forms with
    a great deal of logic, or a large amount of time or sensitive information from
    the user in order to complete). It would be a mistake to build a chat solution
    if the customer only feels comfortable speaking directly to a representative,
    especially when providing sensitive information, or a specialized app if the customer
    cannot imagine needing or using a standalone, single-purpose app for rare support
    occasions.


    As with all testing, the amount of effort will be determined by what needs to
    be learned. The methodology should be driven by the specific learning need, and
    the effort level should be driven by the stakes of the outcomes (is a prototype
    required, or can the learning be accomplished simply through interviews or even
    a focus group session?).


    ### Refinement (Estimate: 1–2 Sprints)


    ![](Images/pg110.jpg)


    Refinement is where HCD and conventional Agile development collaborate most directly.
    As stories get refined to the point that they can be worked on by developers,
    specific design artifacts may be created to support the development effort, such
    as wireframes or screenshots that depict specific interactions, behaviors, and
    outcomes. This can typically occur while the refinement itself is happening (1–2
    sprints ahead), although more complex designs and interactions may take longer.


    ### Solution Validation (Estimate: 1–3 Sprints)


    ![](Images/pg111.jpg)


    Ordinarily, solution validation occurs in the form of usability testing. As with
    earlier research, the required time varies based on how organized user recruiting
    is done, how much learning must take place from usability testing, and how rigorous
    that testing needs to be in order to achieve the desired learning outcomes.


    For example, a team may wish to do the equivalent of a usability “smoke test”
    that shows users a new feature to ensure they understand its purpose and can do
    basic task completion. This is different from “functional testing” in that the
    user is provided a task but not the scripted set of actions to complete it. This
    highlights navigational concerns or gaps, especially when every function is working
    properly, but users get stuck on determining the correct path forward. This kind
    of task might inform a “go/no-go” decision and be relatively fast to conduct.
    The learning objective is simply to be reassured that users will not flood the
    product support team with confused questions.


    Alternatively, a team may wish to learn more comprehensively about how users experience
    a complex process, the resulting emotion (frustration or delight), or specific
    steps, interactions, pieces of language, or supporting features that would improve
    an experience. Diving deeper into additional questions and more involved behavior
    paths takes longer in setup, implementation, and analysis.


    ### Evaluation (Estimate: 1–2 Sprints)


    ![](Images/pg111a.jpg)


    Evaluation is an essential aspect of Human-Centered Agile because, without measuring
    releases, it will be nearly impossible to determine whether the solution being
    created achieves the intended outcomes. Human-Centered Agile means evaluating
    products and bringing insights back into the overall product strategy so that
    teams can make good choices about how to invest their efforts in generating the
    desired outcomes.


    Evaluation takes the same kind of planning and preparation as other research work.
    Whatever teams do to measure success (hopefully defined earlier in the process)
    will take work, which needs to be planned as well. The key difference here is
    that some planning for evaluation work can be done during the time that development
    is taking place, but because evaluation will not take place until after a release,
    some planning will have to wait. For example, recruiting should only take place
    after release is certain, and test scripts must reflect the final released product.


    ## Using Estimates to Plan HCD Work


    As with any Agile work, that estimation and planning come from the team and are
    revalidated and tracked as the team measures the team output and outcomes of the
    work itself. Any discovery, ideation, and concept or solution validation efforts
    must take place in advance of a release, sometimes several sprints ahead, so the
    results can be successfully incorporated by the development team. The order of
    the steps matters. Teams in usability testing don’t want to discover that they
    are solving the wrong problem or have the wrong kind of solution altogether, especially
    after putting in substantial work to deliver a product. They may learn exactly
    that if they have not done discovery or ideation work and are only doing validation
    via usability testing just prior to release, for example.


    ### Consider Additional Dependent Workflows'
