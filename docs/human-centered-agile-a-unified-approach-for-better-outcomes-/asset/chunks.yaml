    我非常欣赏这本书的一点是它对软件开发采取了整体方法。它意识到软件开发不仅是关于编写代码，还关乎理解客户需求并确保软件满足这些需求。它还意识到软件开发是一项团队运动，有效的协作和沟通对于成功至关重要。


    无论你是软件开发人员、项目经理还是业务领导者，这本书都就如何使用人为中心的设计、敏捷软件开发和规模化敏捷框架来开发既满足客户需求又能为组织提供价值的软件提供了宝贵的见解和指导。我向向任何人推荐这本书。


    Joe Hohmann


    # 致谢


    我们要感谢并感谢以下人员和组织在准备本手稿期间提供的帮助和指导：


    - Lorelei Brown 和 Dawn Barton 提供的时间和智慧。

    - Sandy Dorr 提供的出色的插画以及在不断的修改中保持的幽默。

    - Ed Galm 提供的封面设计。

    - Lauren Mix 卓越的发展性编辑能力。

    - Scaled Agile, Inc. 的朋友们：Steve Mayner 博士、Marc Rix、Kevin Wells、Stosh Misiaszek、David
    Freed、Michelle Stoll、Lorienne Neska 和 Risa Wilmeth，他们在版权许可、文章评审、图表等方面的提供了帮助。

    - Jen Cardello 提出的“正确的问题、正确的解决方案、正确的执行”表述深刻影响了我们的方法。

    - Luke Hohmann 慷慨地投入了他的时间、睿智的指导以及反馈。

    - John Stenbeck 提供的指导、建议和智慧。


