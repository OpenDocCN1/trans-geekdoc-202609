- raw: "*   Mike Torppey and Bernardo Gonzales; without their vision and perseverance\
    \ the first Human-Centered Agile project wouldn’t have happened.\n\n*   Our advance\
    \ readers for their time, attention, and fantastic feedback. This book would have\
    \ been very different without all of you: Ann Aly, Sree Bhandaram, Michael Brown,\
    \ Catherine Cartwright, Bella Jones, Anneliese LaTempa, Doug Martin, Diane McCann,\
    \ Paul McInerny, Jeff Nichols, Amelia Shuler, James Sperry, David Tilghman, and\
    \ Michael Williams.\n\n# About the Authors\n\n**Joe Montalbano** is a Management\
    \ Consultant, Enterprise Agile Coach, and business Agility expert with over 20\
    \ years’ experience, primarily in large software development environments. He\
    \ has successfully led multiple, large-scale Agile transitions and managed dozens\
    \ of software development efforts using numerous onshore, offshore, distributed,\
    \ and virtual development teams. He also has hands-on skills throughout the Microsoft\
    \ technology stack.\n\n**Joe** is an enthusiastic coach, teacher, and facilitator.\
    \ He holds certifications including CSP, SPC, KMP, PMI-ACP, PMP, and is a SAFe\
    \ Contributor. He is co-author of the Amazon #1 best-selling book *Agile Almanac\
    \ Book 2: Programs with Multi- and Virtual Team Environments* and has an MBA from\
    \ Johns Hopkins University. He is an avid wildlife photographer and a less avid\
    \ amateur radio operator. This is his second book.\n\n**Brad Lehman** began as\
    \ a front-end coder when his girlfriend (now wife) taught him HTML so that he\
    \ could create a website for his record label (“Best viewed in Netscape 3.0 or\
    \ better!”). He became a “design team of one” shortly after that and has been\
    \ working with Agile teams and programs since 2010. He is also a husband, parent,\
    \ design coach, community radio DJ, and avid coffee roaster and drinker.\n\n#\
    \ Introduction—How This Book is Organized\n\nThe goal of this book is to help\
    \ readers integrate Human-Centered Design (HCD) practices into Agile in a way\
    \ that extends the Agile mindset and supports teams in their work and that lets\
    \ them learn and deliver truly valuable products faster and at lower risk. We’ve\
    \ divided the content into six parts so that you can easily find the content most\
    \ valuable to you.\n\n## **Part I—Introducing Human-Centered Agile**\n\n*   [Chapter\
    \ 1](#ch01.xhtml#_15064-4445_ch001)—What Is Human-Centered Agile, and Why Is It\
    \ Needed?\n\nThis is an introduction to what Human-Centered Agile is and why we\
    \ think it is important. [Part I](#parti.xhtml#_15064-4445_part001) articulates\
    \ the foundation of what Human-Centered Agile is and starts to get readers thinking\
    \ in the “Human-Centered Agile” mindset. This chapter also explores why it is\
    \ such a challenge for HCD and Agile to work together and proposes a framework\
    \ for aligning the two mindsets.\n\n## **Part II—Understanding Just Enough HCD**\n\
    \n*   [Chapter 2](#ch02.xhtml#_15064-4445_ch002)—A Primer on Human-Centered Design\n\
    \n*   [Chapter 3](#ch03.xhtml#_15064-4445_ch003)—HCD Activities and Artifacts\
    \ from Discovery through Concept Validation\n\n*   [Chapter 4](#ch04.xhtml#_15064-4445_ch004)—HCD\
    \ Activities and Artifacts from Refinement through Evaluation\n\nThis part is\
    \ an introduction to HCD for those who need it. It introduces phases of the design\
    \ process and goes a little deeper into both the activities and artifacts that\
    \ comprise HCD work in each of these phases. This section gives the reader both\
    \ a *what* and a *why* of the HCD activities and artifacts that should be brought\
    \ into their Agile program.\n\n## **Part III—How Much and When? Planning and Executing\
    \ HCD Within Agile**\n\n*   [Chapter 5](#ch05.xhtml#_15064-4445_ch005)—Bringing\
    \ Human-Centered Design Into Agile\n\n*   [Chapter 6](#ch06.xhtml#_15064-4445_ch006)—“What\
    \ Are the Stakes?”\n\n*   [Chapter 7](#ch07.xhtml#_15064-4445_ch007)—Planning\
    \ and Conducting HCD Activities in Agile\n\nThis part seeks to dispel the misguided\
    \ myths that HCD “needs to slow you down” and that “we are trying to see around\
    \ every corner” (or “boil the ocean”; pick your preferred metaphor). Human-Centered\
    \ Agile doesn’t prescribe that every research step needs to happen for every effort.\
    \ Instead, Human-Centered Agile aligns the research effort to the expected impact\
    \ and risk of a solution being delivered, with specific learning goals at each\
    \ step. These chapters describe how to do that.\n\n## **Part IV—Larger Programs,\
    \ Different Needs**\n\n*   [Chapter 8](#ch08.xhtml#_15064-4445_ch008)—Managing\
    \ Distributed Design Efforts in Agile\n\n*   [Chapter 9](#ch09.xhtml#_15064-4445_ch009)—Managing\
    \ Distributed Research Efforts in Agile\n\n*   [Chapter 10](#ch10.xhtml#_15064-4445_ch010)—Expanding\
    \ to Small Groups of Agile Teams\n\nAs programs grow in both size and stakes,\
    \ their research and design need to grow as well. This growth means coordination\
    \ and operations at a program level, not just a team level. This part is useful\
    \ for readers who are at this awkward stage of growth on their own programs, and\
    \ it also lays the groundwork for the next section on scaling Human-Centered Agile.\n\
    \n## **Part V—The Largest Programs: Human-Centered** Agile and SAFe^®\n\n*   [Chapter\
    \ 11](#ch11.xhtml#_15064-4445_ch011)—An Introduction to SAFe^®\n\n*   [Chapter\
    \ 12](#ch12.xhtml#_15064-4445_ch012)—Updating Requirements and Processes at Scale\n\
    \n*   [Chapter 13](#ch13.xhtml#_15064-4445_ch013)—Scaling the Team Structure\n\
    \n*    [Chapter 14](#ch14.xhtml#_15064-4445_ch014)—Delivery at Scale: The SAFe^®\
    \ Continuous Delivery Pipeline\n\nThis section focuses on how to apply Human-Centered\
    \ Agile at scale on programs with hundreds or even thousands of people working\
    \ on them, which introduces additional challenges. This section uses SAFe^® as\
    \ a reference point to discuss how to practice Human-Centered Agile at scale.\
    \ Don’t worry, this section also provides an orientation for practitioners who\
    \ have never worked with SAFe before.\n\n## **Part VI—Measuring and Applying Human-Centered\
    \ Agile**\n\n*   [Chapter 15](#ch15.xhtml#_15064-4445_ch015)—Measuring Solution\
    \ Performance\n\n*   [Chapter 16](#ch16.xhtml#_15064-4445_ch016)—Human-Centered\
    \ Agile Applied\n\nThe final part begins with a discussion about how Product Owners\
    \ and Product Managers might measure solution performance and why such measurement\
    \ is critical to Human-Centered Agile. The part closes with a case study in which\
    \ Human-Centered Agile is applied at a fictitious company.\n\n![Figure 0.1 Key\
    \ themes in Human-Centered Agile. Note: PO = Product Owner.](Images/Figure0_1.jpg)\n\
    \n[Figure 0.1](#introduction.xhtml#R_15064-4445_ch000_Figure_001) Key themes in\
    \ ***Human-Centered Agile.*** *Note:* PO = Product Owner.\n\nIt is our hope that\
    \ this final section illustrates the core themes of Human-Centered Agile (see\
    \ [Figure 0.1](#introduction.xhtml#_15064-4445_ch000_Figure_001)) and ties them\
    \ together in a way that helps readers synthesize and apply them to their own\
    \ programs.\n\nThere are several core themes that show up throughout the book.\
    \ A quick reference on finding them in the text:\n\n*   Collaborative ideation\
    \ and lateral thinking ([Chapter 2](#ch02.xhtml#_15064-4445_ch002))\n\n*   Frequent\
    \ user engagement ([Chapter 3](#ch03.xhtml#_15064-4445_ch003))\n\n*   Lightweight\
    \ experiments ([Chapter 5](#ch05.xhtml#_15064-4445_ch005))\n\n*   Stakes-driven\
    \ research ([Chapter 6](#ch06.xhtml#_15064-4445_ch006))\n\n*   Time to incorporate\
    \ insights ([Chapter 7](#ch07.xhtml#_15064-4445_ch007))\n\n*   A Research Roadmap\
    \ ([Chapter 7](#ch07.xhtml#_15064-4445_ch007))\n\n*   An insight repository ([Chapter\
    \ 9](#ch09.xhtml#_15064-4445_ch009))\n\n*   Empowered teams that own problems\
    \ ([Chapter 10](#ch10.xhtml#_15064-4445_ch010))\n\n*   Leadership support and\
    \ engaged Product Owners and Product Managers ([Chapter 10](#ch10.xhtml#_15064-4445_ch010))\n\
