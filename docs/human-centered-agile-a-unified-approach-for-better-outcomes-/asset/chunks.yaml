- raw: "Surveys have a few key constraints to be aware of. For teams wishing to compare\
    \ survey results across time or groups, maintaining standardized questions and\
    \ employing a consistent measurement approach across surveys is important (i.e.,\
    \ teams use the same measurement scales and capture sentiment in the same ways\
    \ as one another). Also, since surveys are highly sensitive to clarity and tone,\
    \ they should follow the same content guidance that applies to any of the teams’\
    \ other products. Finally, surveys are most accurate when they are completed immediately\
    \ following the experience being measured (or as close to immediately as possible).\n\
    \nIn addition to the content, it is important to consider how many questions a\
    \ user is given and how long the survey will take to complete. Longer surveys\
    \ typically return fewer results, and not all question types require the same\
    \ amount of time to complete.[^(70)](#fn70)\n\n### Other Qualitative Evaluation\
    \ Methods\n\nInterviews, contextual inquiry, and even asynchronous usability tests\
    \ have all been described earlier in the context of discovery or validation. They\
    \ are just as valuable in the evaluation process for products already released.\
    \ Teams may also have planned remote sentiment analysis or digital ethnography\
    \ to gain a qualitative understanding of user attitudes toward their product.\
    \ Evaluative efforts require the same type of planning as in other phases of the\
    \ project.\n\n## Metrics Frameworks\n\nFor teams that are struggling to identify\
    \ True North and signal metrics for their solutions or features, the following\
