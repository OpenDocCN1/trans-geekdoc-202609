    产品负责人（Product Owners）负责敏捷团队待办事项列表的所有权和优先级排序，这在以人为中心的敏捷（Human-Centered Agile）中也是如此。区别在于团队如何获取用户需求、洞察和偏好的信息。在以人为中心的敏捷中，团队不再依赖产品负责人作为用户的代理。相反，他们可以获取来自数十、数百甚至数千名用户的汇总、组织化和分析后的情感反馈。这些洞察有助于团队编写更好的故事、选择更好的设计方案、完善验收标准，并为待办事项的排序和完善提供支持。


    ## 拥抱不确定性


    转向敏捷和产品思维时，困难的部分之一在于：团队在开始时并不一定“知道”他们的最终产品会是什么。这产生了两种不同的不确定性：


    * 产品不确定性

    * 交付不确定性


    接受这两种不确定性需要进一步的转变，即愿意将整体战略视为灵活的并能对新信息做出响应。


    ### 产品不确定性


    习惯于传统方法的团队通常从一份厚如电话簿的需求列表开始工作。这些团队通常对这份需求文档感到非常安心，因为他们构建的是列表中的内容，就意味着他们“处于正确的轨道上”。除非他们并没有做对，而这种情况经常发生。通常，团队直到项目结束时才知道这一点，此时会签发变更订单，导致成本增加并超出预算。这时，寻找某人来归责就成了必然。


    敏捷开发和产品思维认为，项目开始时的一份“正确”的需求文档提供了一种虚假的安全感。在任何领域使用传统方法的专业人士，从未有人发现甘特图在重大项目结束时与开始时看起来是一样的。这是因为情况在发生变化，而敏捷帮助团队拥抱这种变化。


    敏捷有助于关注价值，即团队希望通过工作实现的结果。通过关注并衡量交付的**价值**而非**完成百分比**，团队可以通过允许自己进行实验来降低压力水平。一旦发生这种情况，他们就可以自由地挑战所做出的假设，并尝试创新的解决方案，并且知道并非所有的实验都会成功，而这没关系。为了支持这种变化，团队应该：


    * 识别每个功能交付的成果，并明确说明如何衡量成功。

    * 确保团队意识到，他们的成功主要取决于产品表现优坏，而不是交付速度有多快。

    * 在约定的频率上建立实际的衡量会议。


    ### 交付不确定性


    随着转向以结果为导向并解决问题的方法，团队和项目需要接受这样一个观点：最初他们可能不知道完成某事需要多久。随着工作的进行，他们对努力和进展的感觉会变得清晰。敏捷拥有处理这一点的工具，初始估计被认为不如后期的可靠，允许团队在假设被证实或证伪时完善并调整工作规模。然而，仅仅说“这就是敏捷的工作方式”并寄希望交付不确定性会被接受是不够的。许多项目往往未能完成让敏捷团队成功的思维转变。为了支持这种变化，团队应该：


    * 确保他们理解规模评估是一个迭代过程，会随着功能和故事的完善而发生变化。

    * 定期纳入识别和讨论风险的活动。毕竟，对类瀑布式交付预测性的渴望是建立在可以在最后一刻掌握所有关键点的假设之上的。


    ## 风险是什么？


    如果问题是“风险是什么？”，答案可能有几种不同的形式，有些比其他的更显明显。在考虑进行或放弃研究的风险时，请考虑以下几点：


    ### 投入精力


    这是风险中第一个也是最显而易见的因素。生产级代码的创建是昂贵的。团队将投入多少时间和金钱到他们认为用户想要的东西上？如果用户并不想要呢？


    ### 支持成本


    像交付成本一样，这是直接成本。发布令人困惑的软件会导致以帮助台支持形式体现的额外成本。在这种情况下，“量两次切一刀”可以避免一些真实的头疼问题。


    ### 受众规模


    受发布影响的受众有多大？如果团队和几个友好的利益相关者是第一批用户，那么风险就很低。如果他们搞砸了，团队会解决它，每个人都会将失误视为进展。如果有百万用户，即使是一个小失误也可能导致混乱（再次产生支持请求）或不满。


    值得注意的是，寻求定性反馈只是减少大规模发布风险的工具之一。团队通常会进行功能试点，例如 A/B 测试或多变量测试，允许小部分功能向有限受众开放。


    ### 沟通投入和受众预期


    投入了什么样的精力来提高对发布的知名度和热情？这是一次预料中的发布还是更新吗？是否通过营销或其他沟通提升了受众预期？如果该功能非常知名，发布一个令人失望的产品潜在负面影响可能高于其开发成本。这很重要，因为并不是每个用户都会给产品第二次机会，对于发布一个备受推崇但表现糟糕的产品来说，这是一个非常真实的采用风险。


    ### 体验的核心性


    游戏设计师使用“核心循环”（core loop）的概念来描述体验的核心内容。


    > 核心循环本质上是你的游戏的心跳。它是一系列或一系列动作，作为玩家体验的主流程不断重复。它是我们反复回来玩游戏的核心本质。


    '
