  trans: '

    此前生成的调研产品会在细化（refinement）过程中被团队消耗，以确保决策是以用户为中心做的。否则，调研活动将仅限于研究人员作为团队成员参与故事编写和细化的部分工作。


    从团队的角度来看，使用视觉化参考文档进行细化会带来比典型细化之外的一些关键结果（另参见图 4.1）：


    *   团队更有可能在开始之前发现缺陷。

    *   产品所有者（Product Owner）达成更强的共识，且每个故事都有更清晰的完成定义（Definition of Done）。

    *   团队拥有明确定义的基于结果的成功衡量方法。


    ## 团队更有可能在开始之前发现缺陷


    团队视觉化呈现即将发生的工作的好处之一是，团队更容易发现解决方案交互设计中的缺陷。一旦解决方案的真实呈现呈现在面前，团队就能识别出用户需要的额外功能，并考虑不那么明显的特殊情况。


    ## 产品所有者更强的共识以及每个故事更清晰的完成定义


    视觉化呈现的另一个益处是，产品所有者对交付的内容有一个清晰的认知，这最大限度地减少了团队听到“这不是我的意思”的次数。在细化过程中达成共识花费的时间，比团队先构建产品然后又不得不迭代以达到产品所有者的预期结果要少得多。


    ![图 4.1 细化过程中的 HCD 活动和产物](img/Figure4_1.jpg)


    图 4.1 细化过程中的 HCD 活动和产物。


    ## 团队拥有明确定义的基于结果的成功衡量方法


    团队确定什么样的指标和信号适用于学习解决方案是否对用户产生了预期影响。然后，他们创建故事以便在评估期间收集这些指标。这项工作是一项团队活动，因此在此阶段不需要特定的设计或调研活动，但会影响下游的调研活动。


    ## 细化的设计活动


    `Design refinement` 有许多形式，但目标本质上是相同的——通过阐述所有设计细节，让团队对交付内容达成共同理解。这包括视觉元素、预期的行为（包括特定的交互行为）、反馈消息，以及用户在参与过程中会体验的解决方案任何其他方面。强烈建议对于除极小之外的所有故事，都为交付的工作提供视觉参考。


    `Content generation/revision` 对成功至关重要。解决方案所需的任何内容都需要在细化过程中进行创建或评审。这包括作为体验一部分的任何文案，与交互相关的内容（字段标签、提示文本等）以及交互过程中的反馈。


    `Design standards review and updates` 是协作过程的一部分。即使在单个团队内部，通常也需要维护样式指南和模式库以确保产品的一致性，这对于生命周期长且更新频繁的产品来说尤为真实。对即将上线故事的设计应该根据现有标准进行评审，并在需要时整合新的样式/模式。


    ## 细化的设计产物


    ### 内容


    将内容视为一种与代码、交互设计和视觉设计同等地位的、值得评审和细化的产品是至关重要的。易用性的每个方面在某种程度上（且通常在最大程度上）都取决于内容运作的优劣程度：路径引导、定向和决策支持都取决于良好的标签、清晰的描述、有意义的反馈等。团队应该寻求确保内容简洁，并使用用户熟悉的语言编写，同时符合预期的语调。可以像其他任何易用性一样对内容易用性进行测试，内容测试应该像所有易用性测试一样引导至细化。


    此外，产品用户看到的任何文案都需要以这种方式记录，以便团队能够准确地交付。这看起来像是一个简单点，但值得指出，团队有时在确保交付团队能正确引用内容方面面临困难。


    ### 线框图、原型……以及验收标准


    并没有一种特定的、正确的交付物来产生对设计交付内容的共同预期。共同理解可以通过线图（wireframes）、原型（mock-ups）、带注释的截图，甚至是编写良好的故事来实现。视觉参考为团队带来了优势，因为当对书面标准可能存在多种解释时，它们减少了误解。重要的结果是团队的产出符合一组共同预期，团队避免了与产品所有者或其他利益相关者发生“这不是我的意思”的对话。


    此阶段的线图或任何其他视觉化方案与流程之前提到的相比，区别在于它们的成熟度。当故事被细化时，线框图可能需要更新，以展示特定的、最初未考虑的额外交互，以应对新出现的技术限制。原型在细化阶段并不是需要的。它们的生成是为了定稿新产品和功能的视觉设计，或将新的视觉设计元素整合到产品中。换句话说，从单选按钮变为下拉菜单的故事不需要原型，但添加一个收集信息的新“向导”故事通常需要。


    ### 样式指南和模式库更新


    任何所需的新样式或识别出的设计模式一旦同意实施，就应立即更新样式指南、模式库或任何其他管理文档。


    ## HCD 与开发


    在开发期间，团队确保正在构建的解决方案与已编写的故事匹配。从设计和调研的角度来看，特定活动侧重于评审，并在需要时进行任何进行中的调整。这主要是一个设计步骤，尽管团队在进行中的设计更新时可能会寻求相关的现有调研洞解。


    从团队的角度来看，开发支持带来两个关键结果（另参见图 4.2）：


    *   按预期生产的可发布产品

    *   反映设计意图的进行中的决策/调整


    ## 按预期生产的可发布产品


    在创建视觉参考（如原型或线框图）的同时，让设计师评审故事的完成情况，可以确保它们是按照约定和预期完成的。这包括确保一切看起来和感觉都与故事或验收标准的描述一致，并且交付的产品符合既定的样式指南和设计模式。


    ## 反映设计意图的进行中的决策/调整


    开发者在开发过程中遇到意外问题是常见现象，例如意外的技术限制或未记录的新异常情况。对设计的调整最好通过设计师和开发人员之间的协作来处理，这样就可以找到包含用户需求并符合设计意图的最佳替代方案。


    ## 开发的设计活动


    `In-flight design support` 是设计师根据新发现的限制调整设计所做的任何工作。


    '
