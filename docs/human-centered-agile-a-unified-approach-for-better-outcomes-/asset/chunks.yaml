  trans: '

    在软件设计中，这可能通过研讨会或其他协作活动进行，也可以作为由利益相关者评审的异步设计活动进行。在这种语境下，典型的构思交付物包括白板图或线框图图、用户流和屏幕流等。然后，团队会对这些概念的总体可行性和工作量进行评估，以此作为决定哪些方案可以进入后续阶段（概念验证）的依据。


    对于敏捷团队中的设计师来说，构思可能面临独特的挑战，因为设计步骤往往被压缩到单个冲刺中，呈现出一种“满意满足”（`satisficing`）的方式——即第一个听起来足够好的解决方案就会被尝试，几乎没有时间来探索替代方案。通常，工作始于产品负责人（Product
    Owner）要求的特定解决方案，且缺乏产生挑战的横向维度。某些挑战是技术性的，另一些则涉及对工具的理解、功能的易用性/发现性，甚至只是对产品美学特性的意料之外的反。真实环境中的产品表现与其在受控环境中验证时总是不同。


    实际用户的发布后体验决定了发布的成败。理解这些体验对于提供所需的洞察至关重要，能够正确引导对产品组合的战略性投资。以人为中心的敏捷方法承认，做到这一点需要理解用户对团队产品及其体验的态度和情感，而不仅仅是衡量特定的业务价值指标（这些通常代表已交付价值的滞后指标）。


    评估的产出是理解你的产品如何为用户带来价值，并在不足之处为未来的产品策略提供参考。


    ## 以人为中心 vs. 以用户为中心 …… 有什么区别？


    '
