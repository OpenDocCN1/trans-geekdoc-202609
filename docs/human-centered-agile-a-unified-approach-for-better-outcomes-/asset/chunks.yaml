    民族志是对文化进行的参与式观察。在人机交互辅助（HCA）和软件开发中，它通常指的是通过检查社区的数字足迹来理解社区的沉浸式方法（因为更具字面意义上的沉浸式技术即使可用，也极其繁琐）。这可以通过审查他们的在线社区行为（例如讨论论坛或社交媒体）来实现，这种观察可以在不具有侵入性的情况下进行。


    ### 分析回顾


    数据分析回顾顾如其名，是对被跟踪的用户行为进行审查。这允许团队识别用户可能面临的潜在困难，这些困难可能需要进一步的定性调查。


    ### 评估的研究产物


    来自情境性调查（contextual inquiry）的研究产物将与之前讨论过的概念和方案验证的研究工作产物相似。


    `Sentiment analysis reports` 是团队进行的任何情绪收集（如调查问卷等）的汇总报告。当从问卷或帮助热线日志等来源收集情绪时，通常会对用户评论进行额外分析，寻找关键词或其他非数值的情绪指标。


    请注意，提取情绪的数据池可能包含偏差。例如，人们对通过问卷征求的意见（极化的反应）与对支持电话的预期可能不同，后者可能反映了对工具的挫败感或对支持过程本身的情绪，而不是产品，并且可能与问卷的结果不同。


    # 第三部分：多少以及何时？在敏捷中规划和执行 HCD


    # 第 5 章：将以人为中心的设计引入敏捷


    DOI: [10.4324/9781003188520-8](https://doi.org/10.4324/9781003188520-8)


    项目管理的核心在于风险管理。传统的项目交付方法依赖于“瀑布”方法来管理项目风险。该过程中的阶段通常是分析、需求收集、设计、构建、测试和部署（或类似的阶段）。这种方法的逻辑是，通过在每个阶段之前进行审查，项目经理只需确保在上阶段工作完成之前不开始下一阶段的工作，就能最大限地减少风险。然而，这比听起来要困难。他们如何知道工作是否真的完成了呢？


    在瀑布模型中，设计发生在特定的、有时很长的阶段。“需求收集”阶段意味着与利益相关者交谈以听取他们的要求，然后创建一个庞大的需求列表，并进入设计阶段创建一个以某种方式实现所有这些需求的方案。


    使用这种方法，风险会不断累积，因为传统项目每个阶段所做的假设从未在用户那里进行测试或验证，而是仅仅在团队内部的业务分析师和领域专家之间进行审查。由于一个阶段必须在下一个阶段开始之前完成，分析和设计阶段可能花费一
    年（或更久！）来完整记录所交付交付的每一个细微细节。到那时，这些阶段的输出不仅过时了，而且没有经过实际用户的测试和验证。结果就是“大爆炸”式发布，将所有开发出的功能一次性地发布给用户。这增加了发布一个无法提供用户所需所有特性和功能的产品的风险。它也增加了由于技术原因导致发布完全失败的风险。


    ## “瀑布式”交付及其挑战


    糟糕的用户体验并不是瀑布模型的唯一风险。在足够大的规模上实施和交付可运行软件时，还有特定的额外关注。


    即使拥有一套全面的需求，在瀑布式发布的实施阶段也可能出现问题，对于大型项目尤为如此。一个主要问题是，即使花费了所有时间，技术假设往往是错误的。产生需求的人要么对用户需求了解不够深，要么没有时间处理细节，或者对特定方面缺乏完美的预见。错误的假设也可能在团队无错的情况下发生。由于需求定义过程可能耗时很久，技术的进步可能意味着设计是使用一组约束创建的，而交付时却是在不同的约束下完成的。


    为了进一步增加复杂性，技术问题通常在代码集成期间出现。巨大的问题。因为各个团队的代码在项目结束之前没有作为一个单元进行集成和测试，构建失败和昂贵的重工作工作成了常态。瀑布式开发中的版本控制系统倾向于包含多个分支，要求在项目结束时进行费力的合并，这个过程几乎总是会导致某些东西崩溃。在此过程中的
    Bug 以难以识别而闻名，修复它们可能是一场噩梦。开发者、分析师和测试人员之间关于谁该负责的指责变得司空见惯，如果代码最终集成了，进度的严重滞后是最可能的结果。


    此时，对新集成的代码库进行测试开始，通常以悲剧性的结束，出现多个需要团队协作才能解决的错误。这些通常不是小问题，而是致命的缺陷，迫使进行重新分析以及主要的重新设计和重工作。并不罕见整个功能需要被取消范围，因为团队知道他们在剩余的时间内永远无法让它们运行。正是在这段时期，团队意识到他们设计和构建的内容并没有完全解决当前的问题，或者是以一种次优的方式解决的。图
    5.1 显示了风险如何在瀑布项目中累积，价值交付如何被推迟。


    ![图 5.1 瀑布项目中的风险和价值交付。](img/Figure5_1.jpg)


    图 5.1 瀑布项目中的风险和价值交付。


    ## 用敏捷取代瀑布模型


    考虑到瀑布模型的所有风险，巨大且昂贵的工程完全失败的情况并不罕见。敏捷开发的出现是为了通过改进知识工作者的协作方式来缓解这些风险。在敏捷开发中，形成跨职能团队，目标是理解用户需求，并通过快速交付小批价值并获取用户反馈，在迭代和增量地改进方案之前测试解决方案。


    敏捷产品开发代表了心态的清晰转变，它更关注客户和快速提供终端用户价值，而不是广泛的计划和文档工作。敏捷从未假设在项目开始时有一份全面的“需求”文档，因为经验表明在那个时候创建这样的文档简单是不可能的。相反，敏捷方法通过向终端用户交付一小单元的价值来测试假设，从中学习，然后根据这些学习进行迭代。


    敏捷在软件开发中特别有效，但这种心态和方法可以成功应用于任何类型的知识工作，知识工作被定义为任何工作者比经理更了解该主题的工作。⁸


    ![图 5.2 敏捷项目中的风险缓解和早期价值交付。这里的条形代表累积价值交付。](img/Figure5_2.jpg)


    图 5.2 敏捷项目中的风险缓解和早期价值交付。这里的条形代表累积价值交付。


