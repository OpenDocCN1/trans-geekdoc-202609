    As with many Agile environments, SAFe® tends to regard `development` work as the
    key work to be tracked, so programs typically have Enterprise Architects define
    and prioritize enabler work at the portfolio level and System Architects/Engineers
    at the ART level.


    SAFe® identifies four different types of Enabler work accounted for on the Architectural
    Runway:


    *   Architectural enablers build the runway (networks, servers, firewalls, etc.).

    *   Infrastructure enablers automate the testing and deployment of the team’s
    work (automated testing tools, build and deploy tools, monitoring tools, etc.).

    *   Compliance enablers manage documentation and regulatory compliance.

    *   Exploration enablers manage research and other activities designed to gain
    user insight.


    Looking at this last category, however, it’s clear that some work falls outside
    of the technical realm and needs to be included within the nontechnical “scaffolding”
    concept. And it is, of course, this last category of enablers that Human-Centered
    Agile is most concerned with, (although it should be noted that not all exploration
    enablers are for HCD work—there is technical exploration as well).


    In SAFe®, the Research Roadmap should be part of the Architectural Runway and
    organized by the experience and/or System Architects. The Research Roadmap includes
    the following types of activities:


    *   Exploratory research, such as user interviews, contextual observation, service
    mapping, and related analytics needed for the upcoming iterations. In addition
    to work geared toward specific planned features, HCD practitioners might be engaged
    to do broader exploratory work, seeking unmet needs or potential opportunities
    (right problem).

    *   Collaborative ideation activities that require coordination between stakeholders
    (sometimes including users) and teams to generate testable solution concepts.
    These are the points at which multiple solution paths may be considered.

    *   Concept validation research to support proposed solution concepts generated
    in collaborative ideation (right solution).

    *   Solution validation/usability testing of designs that are in development (done
    right).

    *   Evaluative research to support launched or released products and inform the
    program or portfolio strategy (done right).


    It is important to note that the HCD work described in the Research Roadmap typically
    has a different flavor from the technical work in the Architectural Runway. As
    a result, HCD practitioners must work closely with the System Architects (who
    own and prioritize the Architectural Runway) to ensure they have visibility into
    this work. Many times, the System Architects will have to be educated about HCD
    work and its importance to the program.


    Ideally, enabler work is delivered to the Agile teams who need it “just in time”
    to be consumed. Sometimes this is described as “laying the tracks right in front
    of the train.” This is important because, just like requirements, HCD insights
    and findings can degrade over time. While some insights are durable (such as long-term
    attitudes among a narrow user base), other aspects (such as behavior patterns,
    expectations, or unmet needs) change over time with the release of new features
    and experiences that reach users. As a matter of practice, many insights become
    outdated faster than one would think.


    Additionally, the increase in scale increases the need for an insight repository.
    As the amount of research needed increases, it becomes more important than ever
    to capture it in a way that is searchable and consumable across projects.


    ![Figure 14.4 The “essential SAFe®” configuration, which contains the basic elements
    for programs to be successful at scale.](Images/Figure14_4.jpg)


    [Figure 14.4](#ch14.xhtml#R_15064-4445_ch014_Figure_004) The “essential SAFe®”
    configuration, which contains the basic elements for programs to be successful
    at scale.


    [Figure 14.4](#ch14.xhtml#_15064-4445_ch014_Figure_004) illustrates all the constructs
    discussed in this chapter synthesized into the SAFe® “big picture.” It shows the
    “essential SAFe” or most lightweight configuration of the framework. Core competencies
    are shown in the circles around the perimeter (more competencies are available
    in larger configurations) with Lean–Agile leadership as the foundation supported
    by SAFe core values, SAFe principles, and the Lean–Agile mindset. The scaled roles
    can all be found in the column to the left, and the program and team backlog is
    to the right of the roles.


    In [Figure 14.4](#ch14.xhtml#_15064-4445_ch014_Figure_004), the continuous delivery
    pipeline is shown over a visualization of two planning intervals, complete with
    PI planning and the inspect and adapt event (“I&A” in the figure). At the bottom
    is a visual depiction of the Architectural Runway, which contains the Research
    Roadmap. To the far right is the “spanning palette,” which contains the vision,
    roadmap, and system team who builds some of the technical portion of the Architectural
    Runway. The spanning palette grows with the configuration.


    # VI Measuring and Applying Human-Centered Agile


    # Chapter 15 Measuring Solution Performance


    DOI: [10.4324/9781003188520-21](https://doi.org/10.4324/9781003188520-21)


    > *People don’t want to buy a quarter-inch drill. They want a quarter-inch hole!*

    > — —Theodore Levitt


    In [Chapter 2](#ch02.xhtml#_15064-4445_ch002), design was defined as “the intentional
    creation of a specific experience or outcome.” In the context of software delivery,
    there is an expected business value of providing the customer with their intended
    outcome (their quarter-inch hole, so to speak). It doesn’t matter how efficiently
    teams deliver a product, if that product isn’t solving a user’s problem (right
    problem), doing it in an effective way (right solution), or created in such a
    way that the user can succeed throughout the experience (done right). In order
    to see that users are getting value out of a product, teams need a way of measuring
    the value delivered that reflects their attitudes toward their product.


    ## Behavioral vs. Attitudinal Metrics


    Put simply, behavioral metrics describe what users `do`, and attitudinal metrics
    describe how they `feel`. For the most part, behavioral metrics are also quantitative
    metrics—actions (clicks, time on page, registrations) gathered in large quantities.
    Attitudinal metrics, however, are usually qualitative metrics gathered through
    interviews, observation, and other techniques done on a much smaller scale. They
    are used for causal analyses about why people behave the way they do and to create
    hypotheses about how new features will impact customer experience. While it often
    works out this way, it’s not a perfect divide: There are quantitative attitudinal
    metrics (such as net promoter scores [NPSs] and surveys) that aggregate sentiment
    at a large scale, and researchers conducting smaller-scale qualitative research
    still observe and report on user behaviors.


    ### Minimum Viable Product and True North Metrics


    Every product should have a well-defined “True North” metric (or metrics) that
    evaluate how the team did. There may be more than one, but the number of metrics
    should be small and narrowly focused. Importantly, the True North metric is specific
    to the functionality and solution being produced. For example, if a team is working
    on a storefront, this could be revenue. If the team is building a newsletter subscription
    widget, this is sign-ups and the like. In a similar way, each epic or feature
    should have some outcome-based True North metrics for identifying whether user
    behavior is being impacted in a way that supports the overall product goals.

    '
  trans: '


    与许多敏捷环境一样，SAFe® 倾向于将 `development` 工作视为需要跟踪的关键工作，因此程序通常由企业架构师在组合层（portfolio level）定义并优先考虑赋能工作（enabler
    work），并在发布节点（ART）层面由系统架构师/工程师完成。


    SAFe® 识别了架构跑道（Architectural Runway）上的四种不同类型的赋能工作：


    *   架构赋能（Architectural enablers）构建跑道（网络、服务器、防火墙等）。

    *   基础设施赋能（Infrastructure enablers）自动化团队工作的测试和部署（自动化测试工具、构建和部署工具、监控工具等）。

    *   合规赋能（Compliance enablers）管理文档和监管合规。

    *   探索赋能（Exploration enablers）管理旨在获取用户洞察的研究和其他活动。


    然而，观察最后这一类别，显然某些工作超出了技术领域，需要包含在非技术的“脚手架”概念中。当然，以人为中心的敏捷（Human-Centered Agile）最关注的正是这类赋能（尽管需要注意的是，并非所有的探索性赋能都是为了
    HCD 工作——也有技术性的探索）。


    在 SAFe® 中，研究路线图应该是架构跑道的一部分，并由体验架构师和或系统架构师组织。研究路线图包含以下类型的活动：


    *   探索性研究，例如为即将到来的迭代所需的访谈、情境观察、服务映射和相关分析。除了针对特定计划功能的工作外，HCD 从业者可能还会参与进行更广泛的探索性工作，寻找未满足的需求或潜在的机会（解决正确的问题）。

    *   协作构思活动，这些活动需要利益相关者（有时包括用户）与团队之间进行协调，以产生可测试的解决方案概念。在这些点上，可能会考虑多条解决方案路径。

    *   概念验证研究，用于支持协作构思中产生的拟议解决方案概念（正确的解决方案）。

    *   对正在开发中的设计进行解决方案验证/可用性测试（以正确的方式完成）。

    *   评估性研究，用于支持已发布或上市的产品，并为程序或组合策略提供信息（以正确的方式完成）。


    重要的是，研究路线图中描述的 HCD 工作通常与架构跑道中的技术工作有所不同。因此，HCD 从业者必须与系统架构师（拥有并优先考虑架构跑道的人）紧密合作，以确保他们能够看到这些工作。很多，系统架构师需要接受关于
    HCD 工作及其对程序重要性的教育。


    理想情况下，赋能工作应“及时”（just in time）交付给需要它的敏捷团队以便消费。这有时被描述为“在火车正前方铺设轨道”。这很重要，因为就像需求一样，HCD
    的洞察和发现会随着时间的推移而失效。虽然某些洞察是持久的（例如少数用户群中的长期态度），但其他方面（例如行为模式、预期或未满足的需求）会随着触达用户的新功能和体验的发布而改变。在实践中，许多洞察过时的速度比想象的要快。


    此外，规模的扩大增加了对洞察存储库的需求。随着所需研究量的增加，以一种跨项目可搜索和可消费的方式捕获这些洞察变得比以往任何时候都更加重要。


    ![图 14.4 “核心 SAFe®”配置，包含了程序在大规模上成功的基础要素。](img/Figure14_4.jpg)


    图 14.4 “核心 SAFe®”配置，包含了程序在大规模上成功的基础要素。


    图 14.4 展示了本章中讨论的所有结构，并整合进 SAFe® 的“大蓝图”。它展示了框架的“核心 SAFe”或最轻量级的配置。核心能力显示在周围周围的圆中（较大的配置提供更多能力），以精益-敏捷领导力为基础，并在
    SAFe 核心价值观、SAFe 原则和精益-敏捷思维的支持。扩展角色都可以在左侧列中找到，而程序和团队待办列表位于角色的右侧。


    在图 14.4 中，持续交付流水线显示在两个规划间隔的可视化之上，包含了 PI 规划和检查与适应事件（图中的“I&A”）。底部是架构跑道的视觉描述，其中包含了研究路线图。最右侧是“跨越调板”，它包含了愿景、路线图以及构建架构跑道部分技术内容的系统团队。跨越调板随配置而增长。


    # VI 衡量与应用以人为中心的敏捷


    # 第 15 章衡量解决方案性能


    DOI: [10.4324/9781003188520-21](https://doi.org/10.4324/9781003188520-21)


    > *人们想要的不是一个英寸的钻。他们想要一个英寸的孔！*

    > ——西奥多·列维特


    在第 2 章中，设计被定义为“刻意创造特定的体验或结果”。在软件交付的背景下，存在一种为客户提供预期的价值（所谓的英寸的孔）。无论团队交付产品多么高效，如果该产品没有解决用户的问题（正确的问题），或者没有以有效的方式执行（正确的解决方案），或者没有以正确的方式完成（正确的方式完成），都是没有意义的。为了确保用户从产品中获得价值，团队需要一种衡量交付价值的方法，以反映他们的态度。


    ## 行为指标与态度指标


    简单来说，行为指标描述用户`做什么`，而态度指标描述他们`感受如何`。在大多数情况下，行为指标也是定量指标——即大量收集的行为（点击、页面停留时间、注册）。然而，态度指标通常是定性指标，通过访谈、观察和其他技术在较小规模上收集。它们被用于分析人们产生某种行为的因果，并对新功能将如何影响客户体验建立假设。虽然情况通常是如此，但这并非完美的划分：存在定量的态度指标（如净推荐值
    [NPS] 和问卷）在大范围内汇总情感，而进行小规模定性研究的研究人员仍然观察并报告用户行为。


    '
