    \ deploy, verify, monitor, and respond.[^(64)](#fn64)\n\n    Quality is built\
    \ in, so the code can be *deployed* to the production environment at any time,\
    \ making deployment a technical decision. Features are built with on/off toggles,\
    \ so deciding when to *release* the feature becomes a business decision once it\
    \ is in production. No longer must Business Owners plan for “migration weekend”\
    \ a month in advance and coordinate heavily with information technology teams.\
    \ In fact, most releases become so low risk that they can happen live during the\
    \ day.\n\n    ![Figure 14.3 The four activities in release on demand are highlighted.\
    \ HCD teams will apply quantitative and qualitative methods to these activities.](Images/Figure14_3.jpg)\n\
    \n    [Figure 14.3](#ch14.xhtml#R_15064-4445_ch014_Figure_003) The four activities\
    \ in release on demand are highlighted. HCD teams will apply quantitative and\
    \ qualitative methods to these activities.\n\n    When SAFe^® is used for software\
    \ development, a domain where it shines, the full power of separating deployment\
    \ from release becomes apparent. Deployment would happen continuously or, at a\
    \ minimum, every two weeks. Release, however, is when Business Owners decide to\
    \ make that functionality available. This makes it so teams never look back at\
    \ an item and is normally accomplished through a toggling mechanism that allows\
    \ business owners to turn features on and off at will. This can be done to test\
    \ new features on small subsets of users to get additional feedback or release\
    \ functionality when it has the maximum economic benefit.\n\n    Using this paradigm,\
    \ the business can drive the release of functionality rather than having technology\
    \ or migration schedules dictate the release date. Finally, this helps ARTs ensure\
    \ that proper change management activities have been conducted. Commonly, such\
    \ activities are overlooked, at worst, or poorly planned, at best.\n\n    HCD\
    \ practitioners will have a direct interest in the way teams conduct the measure\
    \ and learn activities described in release on demand. At a feature level or above,\
    \ there should already be a hypothesis as to how value is being delivered and\
    \ a plan for measuring it. This plan is likely to include a combination of quantitative\
    \ and qualitative measurements that aid the Product Manager in understanding how\
    \ well a feature is doing and investigating how to improve.\n\n    The results\
    \ of both the post-release quantitative and qualitative evaluations are brought\
    \ into subsequent iteration planning, backlog refinement, and PI planning. Frequently\
    \ this insight will generate new exploration stories for the Research Roadmap,\
    \ along with new features and stories for development.\n\n    The quantitative\
    \ and qualitative evaluation activities listed in Table 17.1 are critical because\
    \ a feature in the wild always performs a little differently than expected when\
    \ validated in a controlled environment. The same goes for users. These activities,\
    \ and the review of the insight they generate on cadence, allow ARTs to ensure\
    \ that they are effectively learning from each release and improving relentlessly.[^(65)](#fn65)\n\
    \n    ### Overall Solution Measurement and “Continuous Evaluation”\n\n    At the\
    \ height of teams focusing on delivering and evaluating specific new features\
    \ and functionality, it is essential that the program does not lose sight of assessing\
