    模式库（Pattern library）是共同使用的常用样式集合。例如，样式指南可能对文本字段的显示方式有特定定义，而模式库可能会定义如何处理地址条目（字段的顺序和标签、邮政编码是五位还是九位，甚至是否有地址验证服务）。在实践中，这两者之间没有完美的界限，但模式库往往更具健壮性。无论哪种，这些通常被视为动态文档，团队必须就如何管理对指南的合规性做出决策。


    ## 问题定义（以“史诗”形式呈现）


    发现阶段（Discovery）的目的是引导并为用户生成值得解决的问题。一旦识别出这些问题，它们就可以被捕获为“史诗”（Epics），即宏大的工作单元，其规模之大以至于可能需要几个月才能交付。它们将每个待解决的具体问题提炼到一个单一的可追踪位置，并从用户价值的角度来描述这些问题。这为团队提供了空间，让他们通过构建一个小型的
    MVP（最小可行性产品）来验证他们的概念，并从用户与领域真实产品的互动中获得早期学习。这种洞察对于帮助团队尽早避开失败的方案至关重要。


    史诗被分解为“功能”（Features），即中等规模的工作单元，专注于为用户交付解决方案。功能进一步被分解为“故事”（Stories），故事的粒度比史诗细得多，且规模恰使其可以在单个冲刺（Sprint）内完成（参见图
    3.2）。在每个冲刺期间，团队专注于故事这一最细粒度的价值交付单元。用户故事足够小，可以在单个冲刺内完成，同时也足够大，包含了通过故事交付给用户的特定价值。


    ![图 3.2 一个史诗如何分解为许多功能，这些功能又分解为多个故事。](img/Figure3_2.jpg)


    图 3.2 一个史诗如何分解为许多功能，这些功能又分解为多个故事。


    史诗还让团队能够回答以下问题：


    1. “我们正试图为用户解决的问题是什么？我们期望他们获得什么价值？”

    2. “这是一个需要解决的问题吗？”

    3. “‘利害’是什么？”（关于“利害”，更多内容见第 6 章。）

    4. “解决这个问题对公司业务有什么好处？”

    5. “在适合问题的投入范围内，什么样的解决方案是用户可以接受且可行交付的？”

    6. “如何衡量该方案的成功？”


    ## HCD 与构思


    在以人为本的敏捷开发（Human-Centered Agile）构思期间，团队会产生竞争性的方案概念以供进一步评估。这确保了团队不会“过度工程”那些复杂程度或劳动密集程度超过其所产生价值的解决方案。在可能的情况下，构思是与用户协作完成，以便引导团队创造更有可能成功的体验。


    构思的目标是确保团队通过对要解决的问题进行良好的理解，来识别出对用户有效且对业务成功的解决方案。


    从团队交付的角度来看，构思期间的协作和发散思维会导致几个关键结果（另见图 3.3）：


    * 预先考虑多个 `solution candidates`（方案候选）

    * 对方案候选的选择标准有共同理解

    * 对方案候选的体验目标、风险和权衡有共同理解

    * 产品所有者（Product Owner）的信心和团队的认可


    ### 多种方案候选


    团队往往会收到以特定请求方案形式呈现的指示，可能来自领导层或其他利益相关者。如果没有一个步骤来确定该请求是否符合一个验证过的问题（正确的问题），或者该方案在用户预期或投入水平方面是否合适，并且没有考虑替代的方案候选，团队产生不符合意愿或过度工程方案的风险将大得多。


    ![图 3.3 构思期间的 HCD 活动和产物。](img/Figure3_3.jpg)


    图 3.3 构思期间的 HCD 活动和产物。


    ### 方案候选选择标准


    知道为什么要构建某个解决方案的团队，将对交付该方案有更清晰的使命感和理解。协作构思允许团队成员了解考虑了哪些竞争性的方案候选，以及它们为何被排除。那些有机会探索过“什么”（what）和“为什么”（why）的团队，不容易因所选方案路径的持续疑虑而偏离。


    ### 体验目标、风险与权衡


    由于方案选择是一个协作过程，在考虑解决方案时会兼顾多个标准。拥有正确的参与者意味着风险可以尽早被识别和处理，高风险的解决方案可以被排除为不合适。这也意味着当团队进入开发阶段时，未来的决策可以参考已知风险做出，以便在开发过程中得到解决。


    ### 产品所有者的信心


    从发现到概念验证的每个阶段，都旨在给产品团队以及产品所有者信心，确保他们正在解决正确的问题，并且正在获得正确的解决方案。协作构思意味着产品所有者更有信心认为已经考虑了一系列解决方案，并且没有没被考虑过的更好的方案。


    ### 构思期间的研究活动


    构思消耗的是发现阶段产生的研究信息。构思本身不产生新的研究洞察；然而，确保研究人员产生的洞察是可用的且`实际上被使用`是至关重要的。这种方式取决于团队规模和投入的规模。


    在这一阶段，研究团队可能以两种方式之一参与：


    * **非正式知识传递**——在较小的团队中，特别是当研究人员和设计师（Designer）是同一个人时，知识传递通常是非正式的，主要发生在故事细化以及与产品所有者或其他团队成员的其它沟通点中。虽然可能没有专门用于分享洞察的活动，但思考如何编码和共享研究洞察以达到最大效果仍然是一种良好的做法。这确保了它们在团队增长、成员变动或仅仅随着时间推移时依然有效。

    * **洞察分享**——对于较大的团队，或者研究与设计分离的情况，可能需要安排特定的会议来解释并解答有关生成洞察的问题，以及它们可能如何影响正在构建的产品。配合交付的研究产物，这使得用户知识在构建的决策过程中处于领先位置。

    * **直接参与工作坊**——当构思通过协作工作坊进行时，研究团队的成员应该是全员参与的。通过参与，他们根据研究洞察作为用户的倡导者。


    ### 构思期间的设计活动


