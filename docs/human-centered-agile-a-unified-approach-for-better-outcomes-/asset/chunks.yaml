  trans: '

    合作伙伴们对收集到的反馈进行评审和头脑风暴得越充分，就越开始理解自己的竞争地位。制作`model planes`是这种乐趣的一部分，无论客户的年龄或技能如何。比起仅仅买一架飞机，人们更享受制作飞机的体验（以及怀旧之情）。威廉想起曾读到关于贝蒂·克罗奇（Betty
    Crocker）的故事，她发现烘焙配料中要求加入鸡蛋或其他简单原料，比做成最简单的产品更成功，因为这让客户参与其中。


    他们还意识到，通过为客户提供这种体验，他们的产品成本反而更低。汤姆和威廉感觉到，如果价格变得更高，他们可能需要考虑自己的飞机作为一种体验，与更昂贵的电子产品相比时处于如何。看来，“组装成品”是一个比最初预期的更具风险的方向。


    在此时，汤姆和威廉根据他们的新发现设定了目标。他们希望制作并测试至少一种符合他们新目标客户的新产品，并看看是否可以衡量并提高现有客户从版本到版本的幸福感。他们还想找到改进客户体验每个
    `step` 的方法，即使只是微小的改进。


    罗里不断向他们强调，为每个新功能想法建立“利益假设”中有一个是不符合直觉的部分。这是概念验证：通过这种策略在足够早的阶段确认假设，以便在早期工作未证明成功时，能够转向其他方法。罗里还提倡进行小批量工作、快速获取反馈并持续改进。


    ## DIY 飞行创造了新产品


    汤姆和威廉决定，一次传统的头脑风暴会议是必要的。在罗里的建议下，他们租了一个会议空间来容纳员工、客户和潜在客户，这样他们就能拥有一个有充足白板空间供构思的大房间。他们预订了一整天的时间，并准备了优质的外卖作为午餐和零食。随着他们举办了更多会议，他们学会了此类活动的永恒法则：提供
    `good` 食物（而不只是披萨和甜甜圈）的成本是分分钱值的，并且能带来更高的参与者（以及员工）的投入度和幸福感。


    罗里建议他们采取更现代的方法，而不是简单地把每个人推进会议室并问：“你们有什么想法？”听从了她的建议，他们花第一个小时回顾了关于客户的已知信息。他们讨论了创建的用户画像，确保所有人对客户旅程的样子达成共识。罗里还邀请了客户来电，分享了他们在购买和飞行飞机体验中最喜欢和最不喜欢的部分。


    接下来，汤姆和威廉发布了他们的目标：为每个画像至少提供三个全面的新产品或改进，目标是尽可能触及多的“关键时刻”。他们将这些时刻表述为带有特定目标的问题，诸如他们如何能让较小孩子制作得更容易，以及如何向“期待”中增加更多乐趣。


    他们从识别一些灵感开始——他们每人都带进了一个他们非常喜欢的产品或体验的例子，并解释了为什么喜欢它。然后，他们进行了一项旨在识别愿的创意练习：他们每个人为自己写了一张“来自未来的明信片”（一张来自明年的祝贺明信片），关于取得了什么，然后进行了分享。最后，为了进入创作自由的氛围，他们进行了一项名为“坏主意”的练习，期间他们每个人都尝试想出一个能想到的最糟糕的新产品想法，但这个想法仍要某种程度上符合目标。（这让他们开始讨论最初是什么让想法变得“好”或“坏”的。）这帮助他们转向个人构思工作，然后转向对这些已确定目标的潜在解决方案的协作工作。他们讨论了彼此的工作，然后分成不同的小组进行进一步分析。


    小组迅速为每个提议的产品或修改方案生成了“待办列表（backlogs）”。他们想出了数量惊人的“显然”的改进，例如提供其他语言的说明书，并提供用于装饰飞机的贴纸书，让较小的孩子即使是预组装模型也能进行个性化。一旦所有的想法都被捕获，他们就拍了照片记录。清单上的所有事情是不可能的，至少无法一次性完成，所以第二天，他们根据潜在价值对待办事项进行分类，这种方法被称为
    MoSCoW 方法——必须有、应该有、可以有、不要求。

    '
