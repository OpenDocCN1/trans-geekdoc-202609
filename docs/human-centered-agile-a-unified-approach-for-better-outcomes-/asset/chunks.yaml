- raw: '*   Will they be everyday users that can be expected to learn and explore,
    or infrequent users that will need regular reorientation?


    *   What are their incentives for using the product?


    *   What is the context of their usage of the product? Where are they, what is
    competing for their attention, and so on?


    *   How well will this product fit within the habits and behaviors they already
    have?


    *   What are their likely alternatives or substitutes to the product?


    *   Which terms and language are they familiar with, and which will be new?


    Empathy maps are related to personas and a visual representation of how a user
    feels when approaching or while engaging with the product or service being developed.
    Empathy maps tend to include less general contextual information, focusing more
    on the emotional state at the specific moment of engagement. While the potential
    for overlap between the information on a persona and an empathy map is great,
    they each still perform a useful communication function when getting a team aligned
    to figuring out the right solution.


    **Scenarios** are key tasks users try to accomplish, complete with the context
    around the task, such as when or why a user is undertaking their action. There
    are often a few key scenarios that are particular to a user persona using a system,
    which are combined directly with personas, so that when teams are designing a
    solution, they have a picture of both who the user is as well as what they hope
    to accomplish.


    Scenarios are distinguished from *use cases* mainly by the focus on user-specific
    emotions about getting a task done, expectations, and off-screen experiences.
    For example, a user may be asked, “What is likely to frustrate you as you try
    to accomplish task X?”


    One classic design decision around scenarios is how likely the user is to actually
    *complete* an interaction in one sitting. Designing a data-entry form with users
    looks very different when it is a short form that has well-known information versus
    one that requires gathering information from multiple sources, which might take
    time.


    #### Journey Maps and Service Blueprints


    A journey map is an end-to-end breakdown of a process *as it appears to the user*
    even as other actors are involved and are enriched with attitudinal and behavioral
    observations. They note how many touchpoints the user encounters and what their
    expectations, frustrations, or delight points might be at each step. Journey maps
    are particularly useful for looking holistically at a process to identify areas
    for experience improvement, rather than simply looking at each encounter as a
    discreet experience. Service blueprints do much the same but expressly aim to
    fully identify “backstage” or “behind the curtain” parts of the holistic experience
    from the business’s point of view.


    ### ***Design Activities during Discovery***


    ![](Images/pg37.jpg)


    While the research activities of discovery are focused on understanding the user,
    there are a series of parallel design activities that should take place during
    discovery. Design activities are focused on understanding the design goals and
    constraints (for example, brand considerations) from the business’s point of view
    as well as identifying opportunities for improvement based simply on best practices.


    #### Heuristic Reviews


    Heuristic reviews are expedient methods for problem-solving that use unconventional
    methods designed to arrive at a solution that is “close enough” given a very tight
    time constraint. A heuristic review is a professional review of an existing product
    or process that seeks to compare the process against general best practices, usually
    using a specific framework for what gets evaluated. Heuristic reviews use a common
    framework and are fundamentally subjective, so it is best to have more than one
    expert conduct the review and compare answers.


    #### Competitive/Comparative Review


    A **competitive** or **comparative** review is the evaluation of an existing or
    proposed product or process that seeks to compare it against similar processes
    using competitors as a key comparison point. The fundamental questions of a competitive/comparable
    review are along the lines of:


    *   How are comparable organizations/products/processes addressing specific problems?


    *   How do they present themselves?


    *   What makes them successful and what challenges them?


    #### Gathering Creative Inputs/Creative Workshops


    Depending on the type of project and maturity of the solution, some discovery
    activity is likely to be focused on identifying brand-related goals of the product.
    Here, information is explored, such as whether incorporating existing design or
    identity materials (e.g., logo or other branding) is necessary if there is an
    existing brand book, or if it requires the use of approved colors, photographs,
    and the like. If these aspects of design are not already refined, they will also
    seek to learn the desired tone for the audience.


    Because interactions with products are emotional as well as practical, if the
    product’s identity is undefined, the team may wish to go through creative workshops
    or other exercises designed to elicit the design goals and values from an emotional
    or tonal perspective.


    ### ***Design Artifacts during Discovery***


    For many of these activities, there is a one-to-one relationship between the activity
    and the artifact, which is why there is such frequent confusion between the two
    to begin with. These artifacts are still worth understanding as the deliverables
    of the activity itself. They include:


    *   Heuristic analysis/score


    *   Competitive analysis


    *   Mood board and/or brand book


    *   Creative brief


    *   Style guides and pattern libraries


    *   Early epic definition


    #### Heuristic Score


    The outcome of a heuristic review should be a document that scores the product
    against best practices, highlighting strengths and weaknesses. The scores should
    include analysis and suggestions for improvements that can often translate into
    the sort of quick wins that help a team’s credibility.


    #### Competitive/Comparative Analysis


    The result of a competitive or comparative analysis is usually a breakdown of
    competitor products into strengths and weaknesses, which identifies conventions
    (i.e., patterns) in the ways that solutions are presented and delivered. This
    report is used to identify helpful conventions and opportunities for improvement,
    as well as gaps in what is being delivered, so that the team can find ways to
    deliver new value.


    #### Mood Board and/or Brand Book


    A mood board is a set of gathered materials (images, colors, other product examples)
    meant to serve as inspiration for the tone and style of the solution being developed.
    A brand book is a set of specific instructions about how a brand is represented
    throughout a product’s marketing and development cycles. While they differ in
    how flexible they are (an inspiration board is a guide, a brand book is a set
    of visual constraints), their common purpose is to define the visual identity
    of a product.


    #### Creative Brief


    A creative brief is a document used to communicate the creative strategy of the
    product being built. It is a document containing details related to user understanding
    (i.e., who it is for, what the tone and style are, what the communications approach
    will be, what the key points of value differentiation are from a user perspective,
    etc.).


    #### Style Guides and Pattern Libraries


    A style guide is a product-specific set of established practices for delivery.
    For example, in software products, style guides define typography usage (typefaces,
    sizes, etc.), iconography usage, product colors (not just a palette of primary
    colors but a set of primary, secondary, and tertiary colors with specific instructions
    on where and how within the product those colors are used), button size, shape,
    and color, basic field appearance, commonly repeated values (such as dates), and
    perhaps specific interaction behaviors.'
