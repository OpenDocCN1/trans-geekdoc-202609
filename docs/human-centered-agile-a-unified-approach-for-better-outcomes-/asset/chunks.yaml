  trans: "\n交接（handoff）步骤目的是让新团队在对已完成的工作有充分理解的基础上进入生命周期，这样接手团队就能对已做出的决策和已完成的工作充满信心，确保这些工作与已识别的工作一致，并能够识别出尚未解决的问题。这项活动确保团队从参与的那一刻起保持一致，并确保做出交付决策或任何调整都是以原始目标和预期结果为考虑的。\n\
    \n## 良好的交接应包含的内容\n\n交接应包含以下项目，这些项目本应在工作的问题定义阶段生成。如果这些信息存在空白，则由新团队有责任确保填补这些空白。\n\
    \n*   以用户为中心描述的努力目标\n*   基于结果的成功标准，以便任何接手功能交付的团队都理解将如何评估成功\n*   支持该工作所收集的任何用户洞察的记录\n\
    *   截至为止所进行的任何验证工作的记录\n*   其他提供交付限制的信息，例如：\n    *   已知的技术限制\n    *   已知的影响（系统、流程或必须适应新交付解决方案的进行中的工作）\n\
    \    *   已知的依赖关系（团队交付解决方案作为先决条件的系统、流程或进行中的工作）\n    *   关键日期及其业务驱动因素\n\n## 团队形成的成功因素\n\
    \n团队成功的一个经常被忽视的因素是团队形成本身以及启动前的活动。敏捷教练经常会反思自己，问为什么他们指导的团队没有取得预期的进展。原因是为了确保团队的成功需要进行准备工作，这些工作需要在团队启动很久之前就要完成。没有这些前期工作，即使是最好的教练也只能产生微乎其微的影响。\n\
    \n团队形成期间，经理必须仔细考虑不仅是章程（我们希望这个团队交付什么价值和解决方案？）和技术领域（我们需要什么样的技术专家组合来交付这些价值？），还要考虑关键的工作方式问题（团队将如何共同工作？他们的时区是什么？他们说同一种语言吗？拥有这些成员是否构成了真实团队的基础，还是他们仅仅是一群聚在一起工作的人？）。\n\
    \n“形成、震荡、规范和表现”¹³\n\n*   该团队将支持什么产品？\n*   团队的产品如何符合企业战略？\n*   产品是否有清晰定义的路线图？\n\
    *   该团队将支持哪些用户？\n*   团队成员是否有时间投入到这个产品，还是他们被分配到了另一个产品（或可能是几个）？\n*   团队是否拥有成功所需的自动化和工具？\n\
    \n很容易看出，忽视这些基础性问题并直接跳到团队启动有多大的风险。研究表明，团队 60% 的成功可以直接归因于启动活动，30% 可以归因于启动本身。¹⁴\n\
    \n将以人为本的设计（HCD）引入敏捷计划的主要成功因素是：\n\n### 高层支持\n\n如果没有投入且支持的高层领导，即使是启动良好且采用最佳实践的团队也无法成功。需要强大的高层拥护者的持续支持，以确保团队的工作与企业战略保持一致。此外，高层处于独特的地位，可以支持并锚定以人为本敏捷（或实际上是任何敏捷方法）成功所需的心态转变。团队需要知道，他们“快速失败”真的是没问题的。他们需要在一个心理安全的环境中工作，在其中他们可以进行实验并真正质疑假设。团队成员也不需要被多重分配任务以发挥最大的效能。只有高层才能确保这一切。\n\
    \n### 对自管理清晰的预期\n\n敏捷的核心理念是让团队自我管理。然而，在团队开始工作之前，必须清晰理解管理层对团队交付内容的预期，并理解任何限制或局限性，例如他们将被执行的其他工作。每个团队都有边界，从一开始就让所有人理解边界是非常重要的。\n\
    \n**团队工作协议（Team Working Agreements）**——在团队形成时，他们应该以“团队工作协议”的形式将他们的标准、预期和规范法化。这些文档通常详细说明团队的“完成定义”（definition\
    \ of done）、每日站会何时以及何地举行、共享和协作工具（如应用生命周期管理工具）的规范和预期，以及其他有助于管理预期的有用信息。此工作协议应在回顾会议中定期审视。\n\
    \n**与积极投入的产品负责人的日常互动**——来自知识丰富的产品负责人的活跃、实地参与是另一个关键成功因素。由于没有需求文档，敏捷团队会进行一系列实验并需要对这些实验进行反馈。他们会有问题，而且产品负责人负有接受团队工作的最终责任。能够方便接触产品负责人意味着团队不需要等待反馈；他们可以做出更快的决策，更容易地调整，并比那些等待反馈的团队交付得更快。\n\
    \n### 待解决的问题积压列表，而非任务列表\n\n最成功的团队是那些被赋予一组目标，然后让他们自己发现实现这些目标的最佳方式，而一个允许他们做到此点的积压列表是关键。团队面临的限制越多，他们进行实验和创新的自由就越少。有时，团队会拥有等同于需求文档的内容（带有关于如何交付所有内容的痛苦细节）。这就是组织对冲刺阶段进行“瀑布式”管理的典型例子。\n\
    \n### 自主性与目的\n\n让知识工作者发挥最大生产力的方法是给他们创新的自主权。阐明“为什么”和“什么”，然后让他们自己去做。如果有必要，让他们反复失败。让他们进行实验和创新。最重要的是，让他们控制“如何做”。方法被管理过度限制的团队，风险在瀑布方法上套上敏捷的外壳。\n\
    \n在团队成功因素排行榜上，目的与自主性并肩。知识工作者渴望比自己更大的目标。领导层必须确保他们对这一目的有共同的理解。关于自主性、精通和目的是释放知识工作者创新和生产力的关键的更多信息，请阅读丹·平克的《驱动力》（Drive）。¹⁵\n\
    \n### 对团队稳定性的预期\n\n敏捷团队在初期往往不是最高效的。布鲁斯·塔克曼在 1965 年确定了小小组发展序列模型，即“形成、震荡、规范和表现”。¹⁶\n\
    \n### 团队参与 HCD 活动\n\n保罗·吉布斯在《组织变革科学与影响》中论述了插入式团队是不够的：“变革专家太重要了，不能交给专家。”¹⁷\n\n\
    ## 跨越小团队集群\n\n当计划规模扩大到小团队集群无法满足业务机会时（总人数超过约 50 人），就会出现几种功能失调的模式。\n\n### 具有竞争愿景的产品负责人\n\
    \n"
