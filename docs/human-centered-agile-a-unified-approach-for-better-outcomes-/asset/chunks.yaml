    \ Teacher that DIY Fly developed.](Images/Figure16_1.jpg)\n\n[Figure 16.1](#ch16.xhtml#R_15064-4445_ch016_Figure_001)\
    \ The persona of a STEM Teacher that DIY Fly developed.\n\n### Understanding and\
    \ Capturing User Needs and Desires\n\nAs Tom and William began mapping their existing\
    \ product line to the customer segments and personas they had developed, they\
    \ discovered that their product mix contained glaring gaps, which left entire\
    \ customer segments without a desirable solution for their needs; see [Table 16.1](#ch16.xhtml#_15064-4445_ch016_tab_001).\n\
    \n[Table 16.1](#ch16.xhtml#R_15064-4445_ch016_tab_001) DIY Fly Products and Product\
    \ Gaps by Customer Segment\n\n| Customer Segment | Existing Products | Product\
    \ Gaps |\n| --- | --- | --- |\n| Hobbyists | Prebuilt gliders, Simple battery-powered\
    \ planes | Books of templates and designs for making their own paper gliders |\n\
    | Advanced hobbyists | None | Radio control and directional technology, Books\
    \ of advanced design templates that incorporate more complex and nuanced |\n|\
    \ Parents of younger kids | Prebuilt gliders | Simpler-to-build planes, More decorations\
    \ and ‘toy-like’ |\n| STEM teachers and students | Books of templates and designs\
    \ for making their own paper gliders, Simple battery-powered planes | Books that\
    \ helped teachers learn and teach this material to students, Slide decks and other\
    \ instructional aides to help them in the classroom (e.g., aerodynamic theory\
    \ in their design), Stand-alone battery-driven propellers that could be attached\
    \ to any paper or plastic glider design |\n\nThis matrix showed that their customers\
    \ had identified needs Tom and William hadn’t even thought of. Their initial concern\
    \ quickly turned to excitement as they considered how to modify their current\
    \ product mix to serve these underserved or unserved customer segments. Using\
    \ sticky notes to capture ideas, they quickly developed a long list of features\
    \ to fill these needs. Some of their ideas looked challenging, while others were\
    \ simple adaptations of their existing products.\n\nTom and William also shifted\
    \ away from their focus on the “moment of flight” and “time aloft,” which had\
    \ dominated their building to date, and began incorporating the feedback from\
    \ their interview sessions to include a whole timeline and series of interactions\
    \ around “flight.” The other phases were:\n\n* Exploring the product (prior to\
    \ purchase)\n* Anticipating the product (post-purchase)\n* Unboxing (product arrival)\n\
    * Building/Assembling\n* Flight\n* Documenting the flight\n\nEach of these steps\
    \ held specific opportunities for improvement. Their product descriptions were\
    \ thorough, but their customers had shared that the instructions for use/assembly\
    \ needed improvement, suggesting that the inclusion of instructional videos and\
    \ elaboration on the more difficult parts of assembly would be helpful. Tom and\
    \ William were surprised by the identified “anticipation” step and were disappointed\
    \ in themselves for not thinking of “documenting” as its own step. Admittedly,\
    \ they weren’t quite sure what to do for these, but at least they had a more complete\
    \ picture of what using their product looked and felt like in the eyes of their\
    \ users.\n"
  trans: '

    对于汤姆和威廉来说，幸运的是，汤姆的妻子洛里（Laurie）是一位丰富的用户体验（UX）专业人士。由于知道参与丈夫的工作可能会产生婚姻紧张和压力，洛里一直对
    DIY Fly 保持距离。然而，当她看到汤姆在那些在她看来是创业基础的基础上挣扎时，她觉得是时候介入了。


    洛里告诉合伙人，他们需要花更多时间来了解客户。诚然，他们了解产品，但如果他们不知道是在为谁构建产品，那么这一切毫无意义；洛里指出，他们一直以来只是为了自己，而不是为了别人。她建议直接与现有客户交流。他们需要来自那些购买并飞过
    DIY Fly 飞机的人的反馈，而不仅仅是那些已经支持他们的人。


    在洛里的建议下，他们首先开展了若干活动，旨在识别、分类并理解他们的客户。他们意识到自己需要更好地了解：


    * 谁在买他们的产品，更重要的是，为什么。

    * 他们的客户对产品是否满意。

    * 他们如何调整产品组合以使其更具吸引力。

    * 客户是否想要任何额外的功能或不同的产品变体，他们可以完善并随后验证这些想法。


    由于他们使用过 Kickstarter，他们最初就拥有一大量的客户联系信息。尽管在第一批飞机发货一个月后已经发送了一份满意度调查，但除了几个热情的回复和一些投诉外，他们没有收到许多实质性的回应。他们需要详细的反馈。


    ### 招募


    威廉和汤姆决定通过招募激励联系特定个人。在排除亲友后，他们向信息收集会议发送了邮件邀请，提供 20 美元的亚马逊礼卡作为参与奖励。他们对自己的这次招募努力感到自豪，并认为自己搞定了一切。随着业务的增长，他们会发现，看起来如此简单容易的事情其实两者皆非如此，而且对于他们整个研究工作的成功至关重要。多年后，当他们费力招募会说西班牙语且尚未在学生中使用过他们产品的教师（学习目标是确保他们的说明清晰）时，最初向“任何人”发送邀请函和礼品卡优惠的简单做法显得是很古老。


    ## DIY Fly 启动


    协调采访的时间比预想的要长，但他们成功安排了相当数量的访谈。尽管经历了几次缺席和少数人提供的反馈无关紧要，他们从许多参与者那里获得了宝贵的信息。汤姆和威廉注意到某些主题的出现，这促使他们改变产品开发（以及待办事项细化）的方法。他们还发现客户可以分为以下几类：


    * **爱好者**——当他们开始商业化销售产品时假设的“首要”市场。这些客户通常对预装滑翔机、电池动力飞机以及制作纸质滑翔机的模板和设计等产品想法反应良好。

    * **家长**——“次要”市场，他们希望买一些可以和孩子一起度过的东西。然而，这组人的产品组合具有挑战性，开发更复杂产品的想法行不通。

    * **STEM 教师**——“意料之外”的市场，包括为了教学空气动力学基础而进行的购买。适合这些用户的产品是纸滑翔机的设计模板、帮助教师学习并向学生教授这些内容的说明书，以及用于课堂的幻灯片和其他教学辅助；参见图
    16.1。在采访期间，汤姆和威廉了解到这一群体需要保持成本最低，因此他们希望采用自行组装的方法。

    * **高级爱好者**——“更有经验”的用户市场，由年龄较大的孩子、青少年和已经接触过他们的产品并想作为爱好继续学习和钻研的学生组成。这组人表示想要某些产品，例如包含更复杂、细微空气动力学理论的高级设计模板、可以连接到任何纸质或塑料滑翔机设计上的独立电池驱动螺旋桨，以及飞行时间更长的简单低成本遥控电池动力飞行模型。


    ![图 16.1 DIY Fly 开发的 STEM 教师画像。](img/Figure16_1.jpg)


    图 16.1 DIY Fly 开发的 STEM 教师画像。


    ### 理解并捕捉用户需求与愿望


    当汤姆和威廉开始将现有的产品线映射到他们开发的客户细分和用户画像时，他们发现他们的产品组合存在明显的空白，导致整个客户群体对他们的需求没有理想的解决方案；参见表格
    16.1。


    表格 16.1 按客户细划分的 DIY Fly 产品及产品空白


    | 客户细分 | 现有产品 | 产品空白 |

    | --- | --- | --- |

    | 爱好者 | 预装滑翔机、简单电池动力飞机 | 制作纸质滑翔机的模板和设计书籍 |

    | 高级爱好者 | 无 | 遥控和方向技术、包含更复杂细微的高级设计模板书籍 |

    | 幼童的家长 | 预装滑翔机 | 更易组的飞机、更多装饰且更具“玩具感” |

    | STEM 教师和学生 | 制作纸质滑翔机的模板和设计书籍、简单电池动力飞机 | 帮助教师学习并向学生教授这些材料的书籍、帮助课堂的幻灯片和其他教学工具（例如设计中的空气动力学理论）、可以连接到任何纸质或塑料滑翔机设计的独立电池驱动螺旋桨
    |


    这个矩阵显示，他们的客户识别出了汤姆和威廉甚至没有想过的需求。当他们考虑如何修改当前的产品组合以服务这些未充分服务或未服务的客户细分时，他们最初的担心很快变成了兴奋。他们使用便利贴记录想法，迅速开发了一份满足这些需求的长期功能清单。他们的一些想法看起来很具有挑战性，而另一些则是对现有产品的简单调整。


    汤姆和威廉还转离了对“飞行时刻”和“空中时间”的关注（这些主导了他们迄为止的构建工作），并开始整合采访会议的反馈，包含围绕“飞行”的整个时间线和系列互动。其他阶段是：


    * 探索产品（购买前）

    * 预期产品（购买后）

    * 开箱（产品到达）

    * 建造/组装

    * 飞行

    * 记录飞行


    这些步骤中的每一步都包含了特定的改进机会。他们的产品描述很详尽，但客户分享过使用/组装说明需要改进，这表明加入教学视频并对组装更困难的部分进行详细说明将会有帮助。汤姆和威廉对识别出的“预期”步骤感到惊讶，并对自己没有将“记录”视为一个独立的步骤感到失望。诚然，他们不太确定对这些步骤该做什么，但至少他们对用户眼中使用他们的产品的样子和感觉如何有了更完整的画面。


    '
