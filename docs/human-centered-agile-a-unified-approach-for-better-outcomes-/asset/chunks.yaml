- raw: "If it were easy to apply Agile and HCD practices at the same time, there would\
    \ be no need for this book. It would all just happen. After all, they share a\
    \ goal of delivering a better product to users faster and cheaper, which should\
    \ make them naturally compatible.\n\nCombining these two practices requires bridging\
    \ the gap between different mindsets as well as trying to provide time and space\
    \ for their specific activities. There are often different expectations about\
    \ timeframes, planning horizons, what counts as key activities, and how and when\
    \ decisions are best made. What’s more, the challenges of integrating these two\
    \ practices vary based on the size of the teams or programs running them. Product\
    \ complexity and team size impact the required approach to integrating the two.\n\
    \nAs Agile and HCD attempt to mingle, a resentful mentality may also develop.\
    \ Established Agile-driven teams might view HCD as an obstacle to or a direct\
    \ competitor of necessary resources, making HCD practitioners feel that they must\
    \ justify their existence as they focus on the early-phase efforts that ultimately\
    \ prove to be very valuable in the long run. HCD teams may feel shortchanged when\
    \ asked to make decisions with little evidence or time.\n\nIt doesn’t have to\
    \ be this way.\n\n## **Problem Space vs Solution Space**\n\n> *A problem well-stated\
    \ is half-solved*.\n\n> \n\n> **—Charles Kettering**\n\nUnraveling the difference\
    \ in approach between Agile and HCD practitioners starts with an understanding\
    \ of the difference between the problem space and the solution spaces. This distinction\
    \ is the crux of much of the practical decision-making about how to build new\
    \ products cheaply and effectively.\n\n![Figure 1.1 Right problem, right solution,\
    \ done right.](Images/Figure1_1.jpg)\n\n[Figure 1.1](#ch01.xhtml#R_15064-4445_ch001_Figure_001)\
    \ Right problem, right solution, done right.\n\nThe problem space is where teams\
    \ devote the time and attention needed to understand the problem they are trying\
