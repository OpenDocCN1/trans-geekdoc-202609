    In software design, this may take place as a workshop or other collaborative exercise
    or as an asynchronous design activity where designs are reviewed by stakeholders.
    In this context, typical ideation deliverables include whiteboard diagrams or
    wireframes, user and screen flows, and so on. The team then evaluates these concepts
    for general feasibility and level of effort as part of deciding which solutions
    can move into the next step (concept validation).


    Ideation can present a unique challenge for Designers on Agile teams as the design
    step often gets compressed into a single sprint, taking on the manner of `satisficing`—that
    is, the first solution that sounds good enough is the one that gets tried, with
    little time to explore alternatives. Often, work begins as a specific solution
    demanded from a Product Owner with no laterals that create challenges. Some will
    be technical in nature, others will involve tool comprehension, feature findability/discoverability,
    or even just unanticipated responses to a product’s aesthetic qualities. A product
    in the wild always performs differently than when it was validated in a controlled
    environment.


    Actual users’ post-release experiences determine the success or failure of the
    release. Understanding those experiences is critical to providing the insight
    needed to guide strategic investment in the product portfolio properly. Human-Centered
    Agile recognizes that getting this right requires understanding user attitudes
    and sentiment toward the team’s products and their experience, not just measuring
    specific business-value metrics that often represent lagging indicators of value
    delivered.


    The output of evaluation is an understanding of how your product is bringing value
    to users and, where it is lacking, to inform future product strategy.


    ## Human-Centered vs. User-Centered … What’s the Difference?

