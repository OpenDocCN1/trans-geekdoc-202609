    In reality, the divide between the problem space and solution space is not absolute.
    Even from the earliest points of discovery, stakeholders (including users) will
    propose specific solutions, and it is natural to think about how to solve a problem
    from the moment it is identified. Similarly, as solutions are developed and accepted
    or rejected by users, the nature of the problem being solved may get clearer and
    evolve. Teams should check in on both the problem and the solution throughout
    the `delivery cycle`, understanding that the proportion of time and work spent
    in each space will change. At the beginning of the delivery cycle for a given
    product or feature, almost all of a team’s focus should be on problem definition.
    Toward release, almost all the work is on delivering the solution.


    # II


    Understanding Just Enough Human-Centered Design


    # Chapter 2A Primer on Human-Centered Design


    DOI: [10.4324/9781003188520-4](https://doi.org/10.4324/9781003188520-4)


    Design is a tricky term—ask ten people what design means, and there will be twelve
    different answers. To understand Human-Centered Design (HCD), it’s helpful to
    understand what is meant by design in this book.


    *Design is the intentional creation of a specific experience or outcome*.


    That’s it. It doesn’t matter whether the product being developed is a website
    or a chair (and boy, do Designers love their chairs!). An experience is created
    for the user of the product. When design is discussed, especially in software,
    people most often think about `visual design`—the color palette, pictures, and
    balance of elements. Visual design is only one aspect, however. Additional aspects,
    such as `interaction design`, information architecture, and `content strategy`,
    are also vital to good software development, as are the research and testing activities
    that have become synonymous with “designing a user experience.”


    A common misunderstanding is that design is the `definition` of a specific experience
    or outcome in the same way that the blueprints and plans for a building are considered
    “the design.” The `construction` of the building is also part of the design process.
    This includes each of the individual decisions that get made along the way (right
    down to the door handles!) that impact the way someone *experiences* the building,
    even if those decisions were made or changed after the initial plans were generated.


    An artificial separation of design from delivery permeates the way teams think
    about design in software, too. The definition and planning of a product is completely
    separated from delivery. In practice, especially in software, this separation
    is rarely clear. Even after requirements are generated for a product, there will
    be decisions made during the delivery process that affect the end experience.


    Gaps in the initial stories, technological constraints not fully understood initially,
    or unforeseen updates to business logic are all factors that can change the plan,
    and whoever is making these changes—`Designer`, `Business Analyst`, `Developer`,
    `Product Owner`—is, in that moment, *designing* the product. If teams fully separate
    the product `definition` from product delivery, they are ignoring the fact that
    the design is still happening throughout the process.


    ## HCD = Research + Design


    One of the evergreen pitfalls of design, especially HCD, is that the word `design`
    itself is prone to many misunderstandings. People often think of visual design
    and use terms like “look and feel,” treating it as a coat of paint.


    To be as clear as possible: **HCD is a combination of research and design.** Without
    research, there is no “human” in design. HCD is a methodology that aligns business
    goals with user needs from the outset. This is true whether the design is simple
    or complex. HCD ensures the product delivers by keeping the human in frame throughout
    development.


    ## Introducing the Phases of HCD


    HCD contains seven key steps:

    1. `Discovery`

    2. `Ideation`

    3. `Concept Validation`

    4. `Refinement`

    5. `Development`

    6. `Evaluation`


    The breadth and duration of these steps can vary depending on the team’s approach.


    ![Figure 2.1 Phases of Human-Centered Design](Images/Figure2_1.jpg)


    ### Discovery


    *Discovery generates the required input for ideation, or the “right problem.”*
    The point of discovery is to define and articulate the problem to be solved, understand
    user needs, and properly assess constraints.


    It is typical to see some of the following during the discovery process:

    * Business-requirements gathering

    * Design-requirements gathering

    * Content/asset inventory

    * User research/user-understanding efforts

    * Notional success criteria


    At this point, gathering the context for effective problem-solving requires elicitation
    from a wide variety of stakeholders, such as `Product Owners` and other business
    stakeholders. This is so the team understands the capabilities a product should
    deliver. The team needs the involvement of technical stakeholders, such as a `technical
    architect`, to understand solution constraints.


    In Human-Centered Agile, the discovery activities also include elicitation from
    users, so that the team has a necessary understanding of attitudes and behaviors,
    as well as the gathering of design constraints. This entire set of information
    forms the `problem definition` of the problem. Without this information, teams
    may design infeasible or costly and ineffective solutions.


    Finally, when considering the problem being solved, the team should consider how
    success will be defined and what the criteria for measuring success will be. At
    this early stage, teams should be thinking about what success looks like from
    the user and business standpoint so that as solutions are identified later, a
    measurement approach can be developed. One way to think about this is to use the
    definition of “outcomes” proposed by Jeff Gothelf and Josh Seiden:


    > An outcome is a change in human behavior that drives business results. Outcomes
    have nothing to do with making stuff—though they are sometimes created by making
    the right stuff. Instead, outcomes are the changes in customer, user, employee
    behavior that lead to good things for your company, your organization, or whomever
    is the focus of your work.²


    This definition is useful because it moves teams away from picking solutions and
    measuring success by measuring the amount of functionality built, replacing that
    with understanding how the products they build actually change someone’s behavior.


    The output of discovery is a well-articulated problem definition of the need that
    is being met through these activities, with a defined `benefit hypothesis`, `value
    proposition`, and `success criteria`.


    ### Ideation


    Ideation and concept validation combine to ensure the right solution. In the Ideation
    step, teams explore and evaluate multiple solution concepts (often referred to
    as `lateral` or `divergent thinking`) and then select the solution path to be
    developed.

