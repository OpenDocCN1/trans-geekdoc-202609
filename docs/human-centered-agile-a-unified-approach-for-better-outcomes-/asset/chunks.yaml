- raw: 'If the strategic portfolio review is where strategy is reassessed and realigned,
    the portfolio sync meeting,[^(50)](#fn50)


    Some organizations choose to skip the portfolio sync in months when the strategic
    portfolio review is held. This is a mistake. The two meetings often have overlapping
    membership, and while everyone is looking for fewer meetings to attend, these
    meetings have different purposes, so organizations that skip the portfolio sync
    miss a valuable opportunity to check the pulse of their portfolio.


    It should also be noted that, sometimes, insights directly affecting strategy
    are socialized at these meetings. When this happens, seize the opportunity, and
    do not wait for the next strategic portfolio review. Take these insights directly
    to the stakeholders who need the insights to inform their decisions before they
    get stale. This is a critical component of dynamically adjusting strategy based
    on insight and learning quickly.


    ### Happy Hour


    This is where people say what they really think. (Just kidding. Sort of.)


    In all seriousness, informal meetings are essential not only to accomplish the
    work but also for teams to build trust and bond. This doesn’t just mean having
    unfiltered conversations about work, but also getting to talk about non-work-related
    topics. In settings like this, teams have an opportunity to learn about each other’s
    interests and hobbies and get to know their teammates as people as well as co-workers.
    This familiarity breeds trust, and as Simon Sinek famously said, “A team is not
    a group of people who work together. A team is a group of people who trust each
    other.”


    # Chapter 13Scaling the Team Structure


    DOI: [10.4324/9781003188520-18](https://doi.org/10.4324/9781003188520-18)


    At a small scale, single Agile teams are largely independent with few, if any,
    dependencies on other teams. As size and complexity grow, more practitioners and
    teams are needed. At a certain point, clusters of teams become unfocused and develop
    competing priorities and goals. In order to create alignment across a wide group
    of teams, SAFe^® uses a concept called the Agile Release Train[^(51)](#fn51)


    ## ARTs Plan in a Longer Timeframe


    ARTs allow a large group of people to think and cooperate for a longer timeframe
    than the iterations individual teams work in. Planning Intervals, which are 8–12-week
    collections of iterations, allow teams to plan larger work on a longer time horizon.
    In addition to allowing planning for larger work over longer timeframes, having
    this level of visibility across a whole program means that teams and leadership
    are aware of dependencies across efforts. Critical for HCD practitioners, this
    additional structure makes it considerably easier to plan and coordinate research
    and design work ahead of developers picking up stories for implementation.


    ### ARTs Deliver Specific Customer Value


    ARTs aren’t composed of random, unrelated work. Rather, they are organized around
    the specific value the work delivers to users. This is important because the purpose
    of the new roles and activities is to make sure that the epics and features, taken
    as a whole, support common goals and work together in a coherent vision for success.
    The Product Manager has the responsibility for ensuring the work of all the teams
    on the ART supports the ART’s overarching goals, which must, in turn, support
    larger organizational goals. Random, unrelated work is not assigned to an ART
    “because they have capacity.”


    ## Updating Team Roles for Agile at Scale


    Scaling Agile requires new roles to coordinate and provide strategic guidance
    across teams, manage prioritization and resource conflicts, and ensure all the
    teams on the ART work collaboratively, sharing a common product vision and technology
    vision.


    ### Product Manager


    A single person, not a group or committee, must have responsibility for developing
    and communicating the product vision.[^(52)](#fn52)


    ### Release Train Engineer


    A large collection of teams, such as the ART, needs someone (specifically an Agilist)
    that coordinates the many Scrum Masters, facilitates ART-level events, and coaches
    the ART and stakeholders in Agile practices. This “Chief Scrum Master,” called
    the Release Train Engineer (RTE)[^(53)](#fn53)


    *   Facilitates ART-level events and planning sessions


    *   Sets and communicates calendars for these events


    *   Tracks ART-level metrics[^(54)](#fn54)


    *   Ensures all Scrum Masters are aligned and impediments escalated by Scrum Masters
    are removed quickly


    *   Helps identify risks and manage dependencies


    *   Tracks progress on feature completion


    *   Ensures alignment between the Product Manager and Product Owners


    *   Helps identify and remove bottlenecks


    *   Ensures the product vision, roadmap, and program backlog are synthesized


    This role’s responsibilities are even bigger and harder than the description implies.


    ### System Architect/Engineer


    The next of the major new roles needed is someone to align the many teams (and
    even vendors) to a common architectural vision and fill the technical void that
    emerges at scale as described in [Chapter 12](#ch12.xhtml#_15064-4445_ch012).
    This key role is responsible for evaluating technical alternatives, creating a
    continuous delivery pipeline,[^(55)](#fn55)


    ### Business Owner


    Finally, senior stakeholders or Executives with ultimate responsibility for a
    solution’s success are needed when scaling. SAFe^® calls these people Business
    Owners, and they have responsibility for “governance, compliance, and ROI of a
    solution being developed by an ART.”[^(56)](#fn56)


    These four roles together provide the leadership necessary to align and coordinate
    the ART as it elaborates the solution (the SAFe^® term for the “products, services,
    or systems delivered to the customer”[^(57)](#fn57)


    ### UX Architect


    While not officially part of SAFe^®, teams are likely to require someone to manage
    design and coordinate research in much the same way a System Architect/Engineer
    aligns technical interests. This person is responsible for setting design standards
    and governance, ensuring that research is properly coordinated and conducted and
    the overall product (or value) is cohesive with the overall experience. Without
    someone specifically managing experience, ARTs are likely to have “experience
    drift” whereby individual experiences make sense on their own but do not act in
    concert for a complete, holistic experience. Teams practicing SAFe are encouraged
    to think about how a UX Architect could benefit their programs, typically by establishing
    practices for design review and critique within and across teams.


    ## Updating the Team Topology for HCD at Scale


    Team composition changes when going from Agile with a few teams to Agile with
    many teams. The goal remains to have fully self-sufficient teams, but in practice,
    some teams only require certain skill sets (HCD skills in particular) at specific
    times or intervals. Any approach to scaling Agile, particularly HCD within Agile,
    will eventually have to address the issue that *fully* independent teams are not
    always an efficient model.


    Figuring out where to deploy HCD practitioners on SAFe^® programs for maximum
    effect is critical. Ultimately, team topology and HCD practitioner deployment
    will depend on several factors, such as the number of practitioners on the ART,
    the overall volume of work, and the type of work being conducted. In a Human-Centered
    Agile implementation, HCD practitioners should span the life cycle of products
    being produced.


    To do that, there should be:


    *   A UX Architect coordinating efforts


    *   HCD practitioners embedded on teams with the volume of work to support them


    *   An HCD shared services team that can support more limited engagements and
    manage design and research operations activities


    ### Embedding HCD Practitioners into Agile Teams'
