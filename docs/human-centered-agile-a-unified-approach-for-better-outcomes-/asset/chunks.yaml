    \ saying “AARRR!” like a pirate. (Try it and see.) They are also useful in providing\
    \ stakeholders of digital products a “full spectrum” set of metrics that shows\
    \ them the big picture of their product’s performance.\n\n[Table 15.1](#ch15.xhtml#R_15064-4445_ch015_tab_001)\
