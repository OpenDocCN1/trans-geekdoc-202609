    | Stage | Traditional Agile Approach | Human-Centered Agile Approach |

    |---|---|---|

    | Refinement | The Product Owner and team update stories based on technical constraints.
    The Product Owner provides additional guidance as required for development. |
    Teams apply insights from validation to solution development. HCD practitioners
    are engaged in story refinement to ensure that the development reflects the intended
    solution and is grounded in user needs and expectations. |

    | Development | Changes made based on new needs or unforeseen constraints are
    made by developers and favor expedience. | Developed product is reviewed for UX
    assurance. Changes made based on new needs or unforeseen constraints are made
    collaboratively by developers and Designers and weighing trade-offs between expedience
    and experience. |

    | Solution Validation | Teams assume that their solution will be generally correct,
    and any emergent issues can be resolved through iteration after release. | Teams
    put solutions (or prototypes in varying degrees of fidelity) in front of end users
    to ensure that the product is understood and serves needs as expected prior to
    release. |

    | Evaluation | Teams incorporate whatever live feedback and insight is gathered
    from actual users following a launch into the next product cycle. This is typically
    obtained using high-level product success metrics, broadly applied satisfaction
    results, or helpdesk/support issue reports. | Teams include user-based measurement
    of the postlaunch success of their product and prioritize any gaps or additional
    features based on feedback. |


    When incorporating HCD, teams transition to a process that involves users of their
    end product in as many of the five stages as possible.


    Engaging users throughout the entire process improves every step of the product
    life cycle by reducing the risk of misfiring and delivering products that don’t
    actually meet user needs. From initial concepts all the way through implementation,
    users are key stakeholders, and teams should seek their input. In the early steps,
    they help teams ensure that they are solving the right problems. In the later
    steps, they help teams build the right solutions effectively.


    ## The “Experimenting” Mindset


    Experiments help teams and leaders embrace uncertainty. Incorporating experiments
    as a practice is a clear way to signal that there is value in admitting what isn’t
    known while making an effort to address knowledge gaps. It also provides an opportunity
    for teams to improve their products and processes.


    At the team level, experimenting comes pretty naturally. The experiment is meant
    to answer a specific question with a clear hypothesis. For example, “A bigger
    button will get clicked more often.” An experiment is one specific research approach,
    and an approachable way to infuse some research, but it is not the only one.


    ### Where Do Experiments Come From?


    At a product level, experiments are born from a team’s desire to learn the approach
    to solving the problem that is preferred by their users. This takes the form of
    opportunities to make hypotheses about what users might want and test those hypotheses.
    This can happen in discovery, in the form of gathering information from users,
    and from ideation efforts that produce solution concepts (such as lightweight
    prototypes) that are presented to users. In both cases, these are treated as experiments
    with specific learning goals, and teams have permission to both validate and invalidate
    their assumptions, as well as the opportunity to make decisions about how to proceed.
    In this way, the learning that results from these experiments informs delivery
    by helping teams understand user attitudes about what constitutes the right solution
    and done right.


    At a process level, an experiment might emerge from a team’s retrospective in
    the form of a new working agreement to be tried for a sprint or two “just to see
    if it works better this way.” Similarly, experiments can emerge from program-level
    retrospectives, which have a different structure and focus than team retrospectives
    but still provide insights into program-level behaviors and opportunities for
    improvement.


    ### How Are Experiments Conducted?


    Supporting the change to an experimental mindset requires soliciting experiment
    ideas across the program. These ideas can come from teams wanting support for
    a particular experiment, program-level meetings where individuals propose experiments
    to address concerns or knowledge gaps, or even channels, like a suggestion box
    or “wall of suggestions,” that allow individuals to propose ideas asynchronously
    and anonymously. Once experiments are identified, it is important they be tracked
    in such a way that the results are available to the team later to inform future
    activities.


    It is crucial to ensure that experiments, their progress, and their outcomes are
    visible to all, not just a few people. Additionally, failed experiments should
    be celebrated—with a true experimental mindset, teams will have some “failures”
    (overturned assumptions) alongside their “successes” (validated assumptions).
    In fact, failure is a misleading word, because as long as the experiment resulted
    in learning, it didn’t fail. By highlighting this frequently and focusing on the
    good that came from the experiments instead of the fact that they “failed,” leadership
    can demonstrate support for their teams and this new way of working and thinking.


    Programs should highlight experiments, and their results, within the program.


    ### Iterations, Not Just Increments


    One outcome of experiments (and, in fact, all research) is iteration. It is surprising
    how often teams and programs do not understand the difference between iterations
    and increments, which is similar to the difference between a painting (iterative)
    and a jigsaw puzzle (incremental).


    In a jigsaw puzzle, one piece after another is added until it is done. The people
    building it never go back and improve a puzzle piece or group of pieces. It is
    an *assembly process*, not an *improvement process*.


    A painting tends to work the opposite way. The painters start with sketches and
    basic composition, refining along the way. They may refine in different stages,
    but every area of the painting is reworked more than once. The painters step back,
    evaluate their work, and iterate until the lighting, shading, and texture are
    done.


    It is essential for any Agile teams (perhaps especially Human-Centered Agile teams)
    to iterate. Teams that don’t iterate don’t innovate. Teams building products incrementally,
    not iteratively, is an all-too-common anti-pattern. The whole point of building
    work in small batches is to get fast and frequent feedback from users on it. The
    whole point of that feedback is to improve future deliveries. Teams who don’t
    receive feedback or use it to improve their product are often applying an Agile
    veneer to a waterfall process. Don’t do that.


    ## “Build and See” Agile to “Stakes-based” Human-Centered Agile


    Shifting from “build and see” to stakes-based thinking is a critical step in moving
    toward Human-Centered Agile because that thinking allows teams to match the level
    of time, money, and effort spent on HCD research to the stakes of the feature
    or product. This shift encourages early discussions about the stakes of features
    and which risks can be mitigated by better understanding users or through direct
    observation of user interactions with proposed features. It also emphasizes measuring
    outcomes consistently.


    ### Human-Centered Agile Empowers Teams

