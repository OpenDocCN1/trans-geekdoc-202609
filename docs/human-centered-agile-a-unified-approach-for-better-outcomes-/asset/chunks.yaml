    a combination of quality, flow, predictability, and solution quality metrics to
    ensure good output and good outcomes. Team metrics were reviewed at the end of
    each sprint, which included the number of stories and story points completed and
    a committed-to-done ratio that teams called their “say-do.” They grouped their
    quality metrics around returns based on defects and those based on customers having
    unmet expectations. These metrics were all inputs to the team’s retrospective
    and strictly used as tools to help teams improve; they were never weaponized or
    used in performance reviews.


    William and Tom stayed updated on their growing enterprise by tracking epics.
    Jeff managed the work in a similar fashion to their methods by making it visible,
    limiting the amount of work in progress, conducting small experiments, and making
    future decisions based on the results of those experiments. Sometimes, William
    and Tom needed Jeff to intervene and help them focus on finishing one thing before
    starting another, which Jeff referred to as needing to “stop starting and start
    finishing.”


    For example, they were developing a new activity kit for younger children while
    also working on a complex design for a battery-powered radio-controlled plane,
    making little progress on either one. After heeding Jeff’s advice, they quickly
    understood that they could get more done by limiting their efforts to one objective,
    even if that seemed counterintuitive. So, they put the complex task aside to focus
    on the product for the younger market and waited until that was completed before
    restarting work on their new radio-controlled product.


    Every quarter, all the teams would still gather for a big two-day planning session.
    Everyone looked forward to the opportunity to interact with their peers on other
    teams as well as the catering William and Tom splurged on, which included them
    picking up the tab for happy hour (an important success factor). These planning
    sessions were critical in maintaining team coordination, minimizing dependencies,
    and managing risks they weren’t able to mitigate.


    As their staff grew, William and Tom went on to hire a Chief of Manufacturing
    and promote Julia to their Chief Product Owner, with three other Product Owners
    under her. This new management layer was needed to coordinate the activities of
    the many teams and multiple products being produced. Julia now ran a Product Owner
    sync with all the teams to ensure alignment around a vision, and that strategy
    continually evolved based on learning and customer insight. Jeff ran the companion
    meeting, the Scrum of Scrums, to ensure impediments were resolved quickly and
    dependencies managed before becoming bottlenecks. They even hired an electronics
    engineer to align everyone with a common technical vision, which became increasingly
    important as the technical complexity of their products grew. This group made
    up the core of the management team.


    No matter what, their teams all met individually for 15 minutes daily to plan
    their work for that day. Over the years, some teams had tried variations of this
    daily meeting, reducing the frequency or required attendees, only to revert to
    the original process because daily planning and synchronization are essential
    to the ability to coordinate and pivot, when necessary.


    As William and Tom’s business grew, they found themselves feeling removed from
    the day-to-day workings. The passion for making things was still there, but the
    product lines had taken on lives of their own and been left in capable hands.
    This company was their baby, and although they weren’t as hands-on and could consider
    selling, they weren’t ready to trust their products, people, or processes to another
    company. Instead, they decided to look for opportunities to build on their experience
    while offering new challenges.


    In an echo of the past, they gathered a few of their most trusted employees and
    conducted a workshop. They returned to the same conference space room where they
    had first gathered to brainstorm product ideas and even had it catered by the
    same company (in a nod to nostalgia). This time, the goal was to identify how
    they might expand instead of figuring out how to turn a couple of products into
    a few more.


    Every idea went up on the walls: drones, boats, submersibles, more advanced avionics,
    elaborate kites, rocketry … there were even a few completely left-field ideas,
    like creating physics tutoring services. From each of these ideas, they created
    a canvas of what they would need to learn or know to determine whether to go forward.
    They also decided to come back and revisit their mission: was it primarily hobby
    education or could it encompass other industries? How important was the “Fly”
    in DIY Fly?


    In the end, Tom and William decided that it was their love of model airplanes
    that brought them into the business, yet they’d become driven by the educational
    experiences that they created. They ruled out pursuing noneducational products
    and, after some research and discovery work around what potential customers might
    use, also ruled out drones (the space was way too crowded) and rocketry (too dangerous).
    They settled on boats, submersibles, and a commitment to finding other “outdoor
    adventures in a box”—a mission that came with a name change to “DIY Launch.” Armed
    with a clear mission, a basket of new ideas, and an approach they trusted, the
    future path was uncertain, but they knew it wouldn’t be boring.


    # Conclusion


    DOI: [10.4324/9781003188520-23](https://doi.org/10.4324/9781003188520-23)


    The challenges in bringing Agile and Human-Centered Design are evident to anyone
    who has tried to get the two working together. For it to work, teams need a healthy
    understanding of what it actually means to do design and research well, as well
    as a team (or program) that is interested in actually doing it. A structure that
    allows for all the tactical work that must happen before developers put `hands
    on keys` and the strategic value of learning to be included in decision-making
    is also needed.


    When done right, the harmonious goal of learning what a team needs to know in
    order to be successful in the fastest and cheapest way possible is what makes
    this work. And the rewards, in terms of costly production and averted risks, are
    considerable.


    Change is difficult. “Culture eats strategy for breakfast.” Getting from Agile
    to Human-Centered Agile requires a mind shift, not just a bunch of meetings and
    tasks:


    - “Is this the right problem? How do we know?”

    - “Have we validated that this is the right solution? What others have we considered?”

    - “What are the stakes of our decisions? Have we done enough to make sure we are
    spending our time and money wisely?”

    - “How will we know when we’ve created a good experience?”


    When these questions become routine, the practices of change—all the tactics described
    in the book—get easier and easier to apply. And, as always, Agile is as much a
    process-building tool as it is a product-building tool. An environment that provides
    safety for teammates asking questions, allows for experimentation, and, perhaps
    most importantly, takes the time to retrospect and adapt can find success in implementing
    Human-Centered Agile.


    ## Recommended Reading


    For those wishing to dive deeper into some of the ideas and concepts presented
    throughout this book, the following list of suggested reading should help practitioners
    apply these ideas to their work more effectively.


    ### Book Recommendations from the Agile Coach

