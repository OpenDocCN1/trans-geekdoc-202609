- raw: 'Product Owners own and prioritize the backlog on Agile teams, and this is
    true in Human-Centered Agile as well. The difference is how teams get information
    about user needs, insights, and preferences. In Human-Centered Agile, the team
    no longer relies on the Product Owner as a proxy for the user. Instead, they have
    access to the aggregated, organized, and analyzed sentiment from dozens, hundreds,
    or sometimes thousands of users. That insight helps the team write better stories,
    select better design options, enhance their acceptance criteria, and inform backlog
    prioritization and refinement.


    ## Embracing Uncertainty


    One of the difficult parts about moving toward Agile and product thinking is the
    idea that teams don’t necessarily “know” what their final product is going to
    be when they begin. That generates two different kinds of uncertainty:


    *   Product uncertainty


    *   Delivery uncertainty


    Accepting both types of uncertainty requires an additional shift toward a willingness
    to see overall strategy as flexible and responsive to new information.


    ### Product Uncertainty


    Teams used to working with traditional methods often start with a list of requirements
    as thick as a telephone book. These teams typically feel great comfort in this
    requirements document because, if they are building what was in that list, they
    are “on the right track.” Except when they aren’t, which frequently turns out
    to be the case. Usually, teams don’t learn this until the end of the project,
    at which time change orders are issued, increasing costs and exceeding budgets.
    It then becomes necessary to find someone to blame.


    Agile and product thinking believe that a “correct” requirements document at the
    beginning of the project offers a false sense of security. No professional using
    traditional methods, in any field, has ever had a Gantt chart look the same at
    the end of a major project as it did in the beginning. That’s because things change,
    and Agile helps teams embrace that change.


    Agile helps focus on value, the outcomes a team hopes to achieve with their work.
    By focusing on and gauging delivery on the value rather than percent complete,
    teams can reduce their stress levels by allowing themselves to experiment. Once
    this occurs, they are free to challenge the assumptions they’ve made and try innovative
    new solutions, knowing that not all their experiments will be successful, which
    is OK. To support this change teams should


    *   identify the outcomes delivered by each feature and be explicit about how
    success is to be measured.


    *   make sure teams are aware that their success is determined primarily by how
    well the product does, not by how quickly something is delivered.


    *   create actual measurement meetings on an agreed-on cadence.


    ### Delivery Uncertainty


    Along with shifting to an outcome-driven approach with problem-solving, teams
    and programs need to embrace the idea that initially, they may not know how long
    something will take to accomplish. Their sense of effort and progress will get
    clearer as they go. Agile has tools to handle this, where initial estimates are
    seen as less reliable than later ones and teams are allowed to refine and resize
    work as their assumptions get proved or disproved. However, it’s not enough to
    say, “That’s just how Agile works,” and then trust that delivery uncertainty will
    be accepted. Many programs often fail to make the mindset shift that allows Agile
    teams to succeed. To support this change teams should


    *   make sure they understand that sizing is an iterative process, subject to
    change as features and stories are refined.


    *   regularly incorporate activities that identify and discuss risks. After all,
    a desire for waterfall-like delivery predictability rests on the idea that it’s
    possible to know everything crucial right up front. Discussions about risk, by
    their nature, invite understanding that this is not actually true.


    # Chapter 6“What Are the Stakes?”


    DOI: [10.4324/9781003188520-9](https://doi.org/10.4324/9781003188520-9)


    The goal of a product team’s research is to limit the risk and expense of solving
    the wrong problems or building solutions in ways that are not successful for the
    user. This risk affects more than just development costs, reaching into product
    reputation and customer confidence. With that in mind, teams should ask, “What
    are the consequences if our assumptions happen to be wrong?” Or, more succinctly,
    “What are the stakes of this research?” It is this question that drives which
    research is necessary and how research gets prioritized.


    ## Product Release Stakes


    Suppose a team is planning to spend a few hours building a small story and has
    little reason to think that adding the story would be harmful to the customer’s
    experience. The team may decide to forgo any research for it. After all, why spend
    ten times as many hours doing research than actually developing the story? In
    this case, the best path might be to build functionality and iterate after getting
    user feedback. By contrast, stories and larger units of work, like features, that
    are expensive to build or likely to have a large impact on user behavior merit
    more research.


    While lower stakes features are less likely to require research, it is worth noting
    that a large cluster of small features can amount to both a large shift in overall
    user experience and represent a volume of total development time and large enough
    to elevate it to a level that requires validation testing with users.


    ### The Factors of Stakes-Based Decision-Making


    If the question is, “What are the consequences if our assumptions happen to be
    wrong?” the answer can have a few different forms, some more obvious than others.
    When considering what the stakes are of conducting or foregoing research, consider
    the following factors.


    #### Level of Effort


    This is the first and most obvious factor in the stakes. Production quality code
    is expensive to create. How much time and money are about to be put into making
    something that the team thinks users want? What if they don’t?


    #### Support Costs


    Like delivery costs, this is a direct financial cost. Releasing confusing software
    leads to additional costs in the form of help desk support and communications.
    This is a case in which “measure twice, cut once” can save some real headaches
    for other teams that support the product.


    #### Audience Size


    How large is the audience that will be impacted by the release? The stakes are
    low if the team and a few friendly stakeholders are the first users. If they mess
    up, the team will work through it, and everyone will accept the missteps as progress.
    If there are a million users, even a small misstep can create confusion (again,
    support requests) or dissatisfaction.


    It’s worth noting that seeking qualitative user feedback is only *one* of the
    tools to reduce the stakes of a wide release. Teams will often engage in feature
    pilots, such as in A/B or multivariate testing, that allow a small subset of features
    to become available to a limited audience.


    #### Communications Investment and Audience Expectations


    What kind of effort has been spent to generate awareness and enthusiasm for the
    release? Is it an anticipated launch or update? Have audience expectations been
    raised through marketing or other communications? If the feature is high profile,
    the potential negative impact of releasing a disappointing product may be higher
    than the cost of developing it. This is important because not every user will
    give a product a second chance, a very real adoption risk to releasing a highly
    touted but poor-performing product.


    #### Centrality of Experience


    Game Designers use the concept of a “core loop” to describe what is central to
    the experience.


    > *The core loop is essentially the very heartbeat of your game. It is a series
    or chain of actions that is repeated over and over as the primary flow of your
    players’ experience. It’s the core essence of why we return to play games over
    and over again*.


