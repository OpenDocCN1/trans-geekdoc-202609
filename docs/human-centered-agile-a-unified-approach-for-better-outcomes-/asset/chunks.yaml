- raw: 'Previously generated research artifacts are consumed by the team during refinement
    so that decisions get made with users in mind. Otherwise, research activity is
    limited to any participation researchers take in story writing and refinement
    as part of the team.


    From a team standpoint, refinement using visual reference documentation leads
    to some key outcomes beyond typical refinement (see also [Figure 4.1](#ch04.xhtml#_15064-4445_ch004_Figure_001)):


    *   Teams are more likely to identify gaps before starting.


    *   Stronger Product Owner agreement and a clearer definition of done for each
    story.


    *   Teams have a clearly defined outcome-based success measurement approach.


    ### Teams Are More Likely to Identify Gaps before Starting


    One of the benefits of teams visually representing the work that is going to happen
    is that teams are more likely to find gaps in the interaction design of a solution.
    Teams identify additional features that users will need, and consider less obvious
    cases, once a realistic representation of the solution is in front of them.


    #### Stronger Product Owner Agreement and a Clearer Definition of Done for Each
    Story


    The other benefit of visual representation is that the Product Owner has a clear
    sense of what will be delivered, which minimizes the number of times a team hears,
    “That’s not what I meant.” There is less time spent in refinement getting to agreement
    than if the team builds a product only to have to iterate to achieve the Product
    Owner’s intended outcome.


    ![Figure 4.1 HCD activities and artifacts in refinement.](Images/Figure4_1.jpg)


    [Figure 4.1](#ch04.xhtml#R_15064-4445_ch004_Figure_001) HCD activities and artifacts
    in refinement.


    #### Teams Have a Clearly Defined Outcome-Based Success Measurement Approach


    The team determines what kinds of metrics and signals are appropriate to learn
    whether the solution has had the intended impact on users. They then create stories
    for gathering those metrics during evaluation. This work is a team activity, so
    it doesn’t require specific design or research activities at this stage but will
    impact research activities downstream.


    ### ***Design Activities of Refinement***


    **Design refinement** takes many forms, but the goal is essentially the same—to
    give the team a shared understanding of what is to be delivered by articulating
    all design details. This includes its visual elements, the expected behaviors
    (including specific interaction behavior), feedback messaging, and any other aspect
    of the solution a user will experience while engaged. It is highly recommended
    that for all but the smallest of stories, visual references are provided for the
    work being delivered.


    **Content generation/revision** is crucial to success. Any content required by
    the solution needs to be created or reviewed during the refinement process. This
    includes any copy that is part of the experience and pieces of content related
    to interaction (field labels, hint text, etc.) and feedback during interactions.


    **Design standards review and updates** are part of the collaborative process.
    Even within a single team, it is often necessary to maintain a style guide and
    pattern library to ensure product consistency, which is especially true for products
    with a long life cycle and frequent updates. Designs for upcoming stories should
    be reviewed against existing standards, and new styles/patterns should be incorporated
    when they are required.


    ### ***Design Artifacts of Refinement***


    #### Content


    It is important that content be considered a product worthy of review and refinement
    in equal standing to code, interaction design, and visual design. Every aspect
    of usability relies, to some degree (and often to its largest degree), on how
    well the content works: wayfinding, orientation, and decision support all depend
    on good labels, clear descriptions, meaningful feedback, and so on. Teams should
    be looking to ensure that content is concise and written in language that is familiar
    to the user, in addition to matching the intended tone. It is possible to test
    for content usability just as any other sort of usability, and content testing
    should lead to refinement as all usability testing does.


    Furthermore, any copy seen by a product’s user needs to be documented in such
    a way that the team can deliver it accurately. This seems like a simple point,
    but it is worth pointing out that teams sometimes struggle to ensure that content
    is referenced properly by the delivery team.


    #### Wireframes, Mock-Ups … and Acceptance Criteria


    There is not one specific, right deliverable to generate shared expectations of
    what the design will deliver. Shared understanding can be accomplished through
    wireframes, mock-ups, screenshots that are annotated, or even just well-written
    stories. Visual references give teams an advantage because they decrease miscommunication
    when there might be multiple interpretations of written criteria. The important
    outcome is that the team’s output matches a set of shared expectations, and the
    team avoids having “that’s not what I meant” conversations with the Product Owner
    or other stakeholders.


    The difference in wireframes, or any other visuals, in this phase compared to
    those mentioned earlier in the process is their maturity. When stories are refined,
    wireframes may need to be updated to demonstrate specific, additional interactions
    not initially considered to account for technical constraints that emerge. Mock-ups
    are not always needed in the refinement stage. They are generated to finalize
    the visual designs for new products and features or incorporate new visual design
    elements into the product. Put another way, a story changing from radio buttons
    to a drop-down menu doesn’t need a mockup, but a story adding a new “wizard” for
    collecting information usually does.


    #### Style Guide and Pattern Library Updates


    Any new styles required or design patterns identified should be updated in the
    style guide, pattern library, or any other governing documentation as soon as
    they are agreed on for implementation.


    ## HCD and Development


    During development, the team ensures that the solution being built matches the
    stories that have been written. From a design and research perspective, the specific
    activity is focused on review and, when needed, any in-flight adjustments that
    are required. This is primarily a design step, although it is possible for the
    team making an in-flight design update to seek relevant existing research insights.


    From a team standpoint, development support leads to two key outcomes (see also
    [Figure 4.2](#ch04.xhtml#_15064-4445_ch004_Figure_002)):


    *   Releasable products, produced as expected


    *   In-flight decisions/adjustments that reflect design intent


    ### Releasable Products, Produced as Expected


    Along with creating a visual reference (such as a mock-up or wireframe), having
    the Designer review stories for completion assures that they are completed as
    agreed and expected. This includes making sure that everything looks and feels
    as described in the story or acceptance criteria and that delivered products match
    established style guides and design patterns.


    #### In-Flight Decisions/Adjustments That Reflect Design Intent


    It is common for developers to run into unexpected issues during development,
    such as unexpected technical constraints or new exceptions that weren’t documented.
    Adjustments to design are best handled by collaboration between the Designer and
    developers so that the best possible alternative can be found that incorporates
    the user’s needs and matches the design intent.


    ### ***Design Activities of Development***


    **In-flight design support** is any work the Designer does to adjust designs based
    on newly uncovered constraints.'
