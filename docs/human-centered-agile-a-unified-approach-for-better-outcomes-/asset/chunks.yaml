- raw: 'A pattern library is a collection of common styles used together. For example,
    a style guide may have specific definitions for how text fields are to be displayed,
    while a pattern library may define how address entries are handled (the order
    and labels of the fields, whether the zip code is five or nine digits, and even
    whether there is an address validation service). In practice, there is no perfect
    line between the two, but pattern libraries tend to be more robust. In either
    case, these are usually treated as living documents, and the team will have to
    make decisions about how to manage compliance with the guidance.


    #### Problem Definitions (as Epics)


    The purpose of discovery is to guide the generation of worthwhile problems to
    be solved for users. Once these problems are identified, they can be captured
    as epics, overarching units of work that are so large that they can take several
    months to deliver. They distill each of the specific problems to be solved into
    a single trackable place and describe this problem in terms of user value. This
    gives teams space to experiment with how to best solve the problem by building
    a small MVP to validate their concept and get early learning from users interacting
    with a real product in the field. This insight is key to helping teams pivot away
    from unsuccessful solutions early.


    Epics break down into features that are medium-sized units of work that focus
    on delivering solutions to users. Features, in turn, break down into stories,
    which are much more granular than epics and are sized such that they can be completed
    in a single sprint (see [Figure 3.2](#ch03.xhtml#_15064-4445_ch003_Figure_002)).
    During each sprint, teams focus on stories as the most granular unit of value
    delivery. User stories are small enough to complete in a single sprint but large
    enough to contain specific value to be delivered to the user through the story.


    ![Figure 3.2 How an epic breaks down into many features, which, in turn, break
    down into multiple stories.](Images/Figure3_2.jpg)


    [Figure 3.2](#ch03.xhtml#R_15064-4445_ch003_Figure_002) How an epic breaks down
    into many features, which, in turn, break down into multiple stories.


    Epics also equip teams to answer the following questions:


    1.  “What is the problem that we are trying to solve for users, and what value
    do we expect them to receive?”


    2.  “Is this a problem that needs to be solved?”


    3.  “What are the “stakes?” (More on “stakes” in [Chapter 6](#ch06.xhtml#_15064-4445_ch006).)


    4.  “What is the benefit to the business of solving this problem?”


    5.  “What types of solutions are acceptable to users and feasible to deliver,
    at a level of effort appropriate to the problem?”


    6.  “How might the success of this solution be measured?”


    ## HCD and Ideation


    During ideation in Human-Centered Agile, the team generates competing solution
    concepts for further evaluation. This ensures that teams don’t “over-engineer”
    solutions that are more complex or labor-intensive than the value the solution
    returns. When possible, ideation is done collaboratively with users so that the
    team is directed toward creating experiences that are more likely to be successful.


    The goal of ideation is to ensure that the team uses a good understanding of the
    problem to be solved to identify solutions that will be effective for users and
    successful for the business.


    From a team delivery standpoint, collaboration and lateral thinking during ideation
    leads to a few key outcomes (see also [Figure 3.3](#ch03.xhtml#_15064-4445_ch003_Figure_003)):


    *   Consideration of multiple *****solution candidates***** up front


    *   Shared understanding of the solution candidate selection criteria


    *   Shared understanding of experience goals, risks, and trade-offs of solution
    candidates


    *   Product Owner confidence and team buy-in


    ### Multiple Solution Candidates


    Too often, teams receive direction in the form of a specific requested solution,
    possibly from leadership or other stakeholders. Without a step that determines
    whether this request fits a validated problem (right problem) or whether this
    solution is a good fit in terms of user expectations or level of effort and considers
    alternative solution candidates, the team is at much greater risk of producing
    unwanted or over-engineered solutions.


    ![Figure 3.3 HCD activities and artifacts in ideation.](Images/Figure3_3.jpg)


    [Figure 3.3](#ch03.xhtml#R_15064-4445_ch003_Figure_003) HCD activities and artifacts
    in ideation.


    #### Solution Candidate Selection Criteria


    A team that knows why they are building a solution is going to have a clearer
    sense of purpose and understanding about delivering that solution. Collaborative
    ideation allows team members to know which competing solution candidates were
    considered and why they were ruled out. Teams that have had a chance to explore
    the *what* and the *why* get derailed less easily by lingering doubt over the
    solution path that has been selected.


    #### Experience Goals, Risks, and Trade-Offs


    Because solution selection is a collaborative process, solutions are considered
    with multiple criteria in mind. Having the right contributors means that risks
    can be identified and addressed early and that solutions that are high risk can
    be ruled out as appropriate. This also means that when teams move into development,
    future decisions can be made with reference to known risks so that they are addressed
    along the way.


    #### Product Owner Confidence


    Each of the phases from discovery through concept validation is intended to give
    the product team, and the Product Owner, confidence that they are solving the
    right problem and that they are getting to the right solution. Collaborative ideation
    means that Product Owners have more confidence that a range of solutions has been
    considered and that there is not a better solution that never got considered.


    ### ***Research Activities during Ideation***


    Ideation consumes research information that was generated during discovery. Ideation
    doesn’t produce new research insights; however, it is crucial to ensure that insights
    generated by the researchers are available and *actually get used* by the team.
    How this happens depends on the size of the team and the size of the effort.


    During this phase, the research team is likely to participate in one of two ways:


    *   **Informal knowledge transfer**—On smaller teams, and especially when the
    researcher and the Designer are the same practitioner, knowledge transfer is often
    informal, largely happening during story refinement and other communication points
    with the Product Owner and/or other team members. While there may not be a specific
    activity devoted to sharing the insights gained with the rest of the team, it
    is still a good practice to think about how to codify and share research insights
    to be as effective as possible. This ensures that they remain valuable as teams
    grow, team membership changes, or simply as time goes by.


    *   **Insight share-outs**—For larger teams, or where research is separated from
    design, it can be necessary to plan specific meetings to explain and answer questions
    about insights generated and how they might impact the product being built. Along
    with the delivered research artifacts, this keeps user knowledge at the forefront
    of the decision-making process about what to build.


    *   **Direct workshop participation**—When ideation is done through collaborative
    workshops, members of the research team should be full participants. Through their
    participation, they act as an advocate for users, informed with research insights.


    ### ***Design Activities during Ideation***'
