- raw: 'As a set of steps and practices, building a Human-Centered Agile practice
    can sound both complex and daunting. It doesn’t have to be either of those things;
    it is an iterative process that builds up from a few basic principles and practices.


    To illustrate this, a fictitious company, DIY Fly, and their (purposefully) non-software
    products will be used as an example. The lawyers for our publisher have required
    us to say that any resemblance of the people, companies, or products in this chapter
    to actual people, companies, or products is unintentional. (This does have the
    virtue of being true.)


    ## The People and The Idea


    William always liked to build model airplanes when he was a child. He started
    with basic paper airplanes, then moved to balsa wood gliders before graduating
    to simple radio-controlled models as he got older. After college, he got a job
    working in marketing for a large software company, but toy airplanes remained
    a passion in his spare time. Over the years, he’d designed a number of increasingly
    complex models, being inventive with materials by using whatever he could find
    to reinforce his planes while still keeping them in the air—boxes, yard signs,
    and (most creative of all) protective plastic for electronics screens, which were
    thin and strong enough to protect his lightest paper models without interfering
    too much in flight.


    Tom was an Air Force–trained pilot who took a job as a manager at an air freight
    company after his discharge. Like William, he’d spent much of his childhood working
    on flying model airplanes and had also carried this hobby into his adulthood.
    As a licensed pilot himself, Tom gravitated toward expensive and elaborate radio-controlled
    models with state-of-the-art electronic systems, high-tech rechargeable batteries,
    and other advanced features. Tom was more of a drones-with-a-camera guy but also
    enjoyed building and customizing his own flying models.


    The two met at the local hobby store. William was there to purchase a small, rubber-band-powered
    propeller for his latest design, and when Tom overheard his conversation with
    the storekeeper, he approached and introduced himself. The two discussed William’s
    experiments with building gliders from paper and thin plastic sheets and how he
    wanted to add a propeller in hopes of extending the flight time. Tom, who was
    heading to his local flying model club’s airfield to fly his large radio-controlled
    model, suggested William join him, and a friendship was born.


    Tom was impressed by the different “flat” designs William developed using just
    paper and thin plastic and wanted to learn more. Over the course of several weekends,
    Tom worked with William, using his knowledge of aerodynamics to help design newer
    models. They added an up-angle or “dihedral” to the wings, elevators on the horizontal
    stabilizers to extend the flight, and, eventually, a vertical stabilizer, which
    improved the flight even more dramatically.


    ## Year 1


    In the beginning phases, they would build various model planes and then bring
    family members, such as nieces and nephews, out to test flying them together.
    This proved to be a nice way to enjoy time outside while providing a welcome break
    from computer screens. Eventually, the audience expanded to their friends, which
    quickly came to include friends of friends. Tom and William had not intended to
    spend this amount of time on their hobby, but their toys were growing in popularity.
    As hobbyists, they used themselves and their friends for ad hoc discovery and
    concept validation. Before long, someone suggested Tom and William start a crowdfunded
    business venture, and the two agreed to explore the idea. Crowdfunding would serve
    as a second level of problem validation *and* concept validation.


    The partners decided to build and sell an advanced version of the plastic gliders
    that William had been building when the two met. They sourced the raw materials
    pretty easily, though their small quantities made the unit cost higher than they
    expected (or preferred). They readily acquired paperboard boxes to package the
    finished product in, and the local quick print shop was more than happy to help
    them design labels and instruction booklets. Their big problem remained finding
    a way to cut the plastic. They needed an industrial die-cutting resource and finding
    one that could squeeze in their relatively small production runs was more difficult
    than anticipated. At this stage, they were still measuring success by product
    performance rather than by how their products impacted their customers.


    After overcoming the initial starts and stops of setting up a small manufacturing
    operation in their “spare” time, they were pleased with how well their initial
    production run sold. It surprised them when small hobby shops began showing retail
    interest.


    They wondered how they would fill their orders, concerned mostly with the procurement
    of all the raw materials they suddenly needed a lot more of. This enterprise had
    grown very quickly from an avocation to a semi-vocation. They created a legal
    partnership and opened a line of credit to cover expenses. They then lined up
    their parts suppliers and began standardizing what had previously been an ad hoc
    manufacturing process. Soon, they found themselves needing additional help and
    hired someone full-time. Then, they hired another. And another. Shortly thereafter,
    they had six people working for them. Despite this fact, the revenue wasn’t quite
    enough to quit their day jobs, but it was clear that this was no longer just a
    hobby.


    They were now a company with one product, a steady, yet small, stream of revenue,
    and a basic ideation and refinement process, which only involved building something
    they liked and testing it themselves. They gathered feedback while watching people
    fly their planes but based their design revisions solely on their own ideas of
    what counted as success, which really only included “time aloft.” The way they
    saw it was that they were making something for themselves, which happened to have
    an audience, and it was great!


    ### New Products


    Excited by their initial success and the fact that they had created a small-but-vibrant
    cottage business, William and Tom started dreaming bigger, wondering what it would
    take to turn this into a “real” business so they could quit their “day” jobs and
    focus on this exclusively.


    They developed a rudimentary product mix: a fully assembled plastic glider, a
    “slingshot” to launch the glider, and a fully assembled plastic airplane with
    a rubber-band-powered wind-up propeller. Each of these new products was an advancement
    on the original, informed by Tom and William’s experience. And these iterations
    really did fly better.


    All three products were launched through new Kickstarters with several hobby shops
    bolstering the sales, which were respectable but not as vibrant as the first round.
    This was not the outcome Tom and William had hoped for. It felt like they were
    making better products but taking a step backward.


    Although they had strong sales from individual hobbyists, a new class of customer
    surfaced; they started getting occasional emails from teachers using these products
    to get their students interested in the science of flight. Sometimes they’d just
    get a brief “thank-you note,” and sometimes they’d be asked whether the company
    had plans for additional products.


    That was something they hadn’t expected and didn’t quite know how to deal with.
    What, exactly, did these new customers (teachers) want from their product? How
    were they using the planes, anyway? Could their products be improved upon for
    this new type of customer that they hadn’t previously thought about? They knew
    they needed to get to know more about their customers and identify their attitudes
    and preferences … they just didn’t know how.


    ### Engaging with Users'
  fmt: '

    As a set of steps and practices, building a Human-Centered Agile practice can
    sound both complex and daunting. It doesn’t have to be either of those things;
    it is an iterative process that builds up from a few basic principles and practices.


    To illustrate this, a fictitious company, `DIY Fly`, and their (purposefully)
    non-software products will be used as an example. The lawyers for our publisher
    have required us to say that any resemblance of the people, companies, or products
    in this chapter to actual people, companies, or products is unintentional. (This
    does have the virtue of being true.)


    # The People and The Idea


    William always liked to build model airplanes when he was a child. He started
    with basic paper airplanes, then moved to balsa wood gliders before graduating
    to simple radio-controlled models as he got older. After college, he got a job
    working in marketing for a large software company, but toy airplanes remained
    a passion in his spare time. Over the years, he’d designed a number of increasingly
    complex models, being inventive with materials by using whatever he could find
    to reinforce his planes while still keeping them in the air—boxes, yard signs,
    and (most creative of all) protective plastic for electronics screens, which were
    thin and strong enough to protect his lightest paper models without interfering
    too much in flight.


    Tom was an Air Force–trained pilot who took a job as a manager at an air freight
    company after his discharge. Like William, he’d spent much of his childhood working
    on flying model airplanes and had also carried this hobby into his adulthood.
    As a licensed pilot himself, Tom gravitated toward expensive and elaborate radio-controlled
    models with state-of-the-art electronic systems, high-tech rechargeable batteries,
    and other advanced features. Tom was more of a drones-with-a-camera guy but also
    enjoyed building and customizing his own flying models.


    The two met at the local hobby store. William was there to purchase a small, rubber-band-powered
    propeller for his latest design, and when Tom overheard his conversation with
    the storekeeper, he approached and introduced himself. The two discussed William’s
    experiments with building gliders from paper and thin plastic sheets and how he
    wanted to add a propeller in hopes of extending the flight time. Tom, who was
    heading to his local flying model club’s airfield to fly his large radio-controlled
    model, suggested William join him, and a friendship was born.


    Tom was impressed by the different “flat” designs William developed using just
    paper and thin plastic and wanted to learn more. Over the course of several weekends,
    Tom worked with William, using his knowledge of aerodynamics to help design newer
    models. They added an up-angle or “dihedral” to the wings, elevators on the horizontal
    stabilizers to extend the flight, and, eventually, a vertical stabilizer, which
    improved the flight even more dramatically.


    # Year 1


    In the beginning phases, they would build various model planes and then bring
    family members, such as nieces and nephews, out to test flying them together.
    This proved to be a nice way to enjoy time outside while providing a welcome break
    from computer screens. Eventually, the audience expanded to their friends, which
    quickly came to include friends of friends. Tom and William had not intended to
    spend this amount of time on their hobby, but their toys were growing in popularity.
    As hobbyists, they used themselves and their friends for ad hoc discovery and
    concept validation. Before long, someone suggested Tom and William start a crowdfunded
    business venture, and the two agreed to explore the idea. Crowdfunding would serve
    as a second level of problem validation and concept validation.


    The partners decided to build and sell an advanced version of the plastic gliders
    that William had been building when the two met. They sourced the raw materials
    pretty easily, though their small quantities made the unit cost higher than they
    expected (or preferred). They readily acquired paperboard boxes to package the
    finished product in, and the local quick print shop was more than happy to help
    them design labels and instruction booklets. Their big problem remained finding
    a way to cut the plastic. They needed an industrial die-cutting resource and finding
    one that could squeeze in their relatively small production runs was more difficult
    than anticipated. At this stage, they were still measuring success by product
    performance rather than by how their products impacted their customers.


    After overcoming the initial starts and stops of setting up a small manufacturing
    operation in their “spare” time, they were pleased with how well their initial
    production run sold. It surprised them when small hobby shops began showing retail
    interest.


    They wondered how they would fill their orders, concerned mostly with the procurement
    of all the raw materials they suddenly needed a lot more of. This enterprise had
    grown very quickly from an avocation to a semi-vocation. They created a legal
    partnership and opened a line of credit to cover expenses. They then lined up
    their suppliers and standardizing what had previously been an ad hoc process.
    Soon, they found themselves needing additional help and hired someone full-time.
    Then, they hired another. Shortly thereafter, they had six people working for
    them. Despite this, the revenue wasn’t quite enough to quit their jobs, but it
    was clear that this was no longer just a hobby. They were now a company with one
    product, a steady, yet small, stream of revenue, and a basic ideation and refinement
    process, which only involved building something they liked and testing it themselves.
    They gathered feedback while watching people fly planes but based their design
    revisions solely on their own ideas of what counted as success, which really only
    included “time aloft.” The it was great!


    # New Products


    Excited by their initial success and the fact that they had created a small-but-vibrant
    cottage business, William and Tom started dreaming bigger, wondering what it would
    take to turn this into a “real” business so they could quit their “day” jobs.


    They developed a rudimentary product mix: a fully assembled plastic glider, a
    “slingshot” to launch the glider, and a fully assembled plastic airplane with
    a rubber-band-powered wind-up propeller. Each of these new products was an advancement
    on the original, informed by Tom and William’s experience. And these iterations
    really did fly better.


    All three products were launched through new Kickstarters with several hobby shops
    bolstering the sales, which were respectable but not as vibrant as the first round.
    This was not the outcome Tom and William had hoped for. It felt like they were
    making better products but taking a step backward.


    Although they had strong sales from individual hobbyists, a new class of customer
    surfaced; they started getting occasional emails from teachers using these products
    to get their students interested in the science of flight. Sometimes they’d just
    get a brief “thank-you note,” and sometimes they’d be asked whether the company
    had plans for additional products.


    That was something they hadn’t expected and didn’t quite know how to deal with.
    What, exactly, did these new customers (teachers) want from their product? How
    were they using the planes, anyway? Could their products be improved upon for
    this new type of customer that they hadn’t previously thought about? They knew
    they needed to get to know more about their customers and identify their attitudes
    and preferences … they just didn’t know how.


    # Engaging with Users

