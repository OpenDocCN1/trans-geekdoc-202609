- raw: 'With Laurie’s help, they developed a recruitment strategy for enticing a continuing
    stream of customers, current and potential, from each of their identified market
    segments: hobbyists, advanced hobbyists, parents of younger children, and STEM
    teachers and students. Laurie assisted them in generating a set of satisfaction
    metrics for their products, which they asked their focus groups and individual
    interview subjects to rate.


    They asked their customers to:


    *   Fill out a Likert scale (i.e., 1–5) rating their experience for each step
    they had previously identified.


    *   Provide three descriptive adjectives, which could be analyzed to gather sentiment
    on the product and see what users particularly valued.


    *   Provide a self-report of how they used the planes (answering questions such
    as, “How often do you take the plane out for a flight?” “How long do you spend?”
    They even asked, “Do you take videos of your flights and look at them later?”
    to get a sense of interest in video flight recording).


    Having a stable set of metrics enabled them to gauge the effectiveness of their
    product improvements. By conducting interviews frequently and at a regular cadence,
    they were able to pivot quickly when necessary. These in-person interactions with
    their target markets were also an evergreen source of ideas for new products.
    Being able to repeatedly seek feedback helped them prioritize upcoming new work,
    find areas to improve on what they already did well, and directly learn how well
    their new products did with customers. For example, they found great utility in
    getting help prioritizing their backlog from their customers, who curiously never
    prioritized it the same way Tom and William would have absent insight from users.
    Sometimes they would learn that a new feature was not nearly as desirable to users
    as improvements to existing features. This insight was like gold to them, as it
    enabled them to keep a constant focus on the items that provided the greatest
    utility to their users.


    Toward the end of the year, with a few new products being worked on, Tom and William
    started testing prototypes of new products with their customers directly. Their
    first test was a fun one—they wanted to see how small hands would actually do
    with their “small hands” planes before committing to a manufacturing run—after
    all, the only way to see how kids would do with these new planes was to *see*
    how kids would do with these new planes. They were concerned that the heavy cardboard
    used for some parts would tear, but that didn’t turn out to be a problem. And
    the stickers were a hit! (The kids got to keep the prototype planes. “They earned
    it!” Tom would say with a smile. The parents, of course, still received gift cards.)


    ## Years 2–3


    As time went on, DIY Fly continued growing, maintaining their focus on delivering
    ever-better value for their customers. After some research and reading, they found
    that many Lean manufacturing practices were the perfect complement to the Agile
    product development practices they had employed throughout their growing business.
    They formalized processes around improving quality, including “quality circles”
    where all employees, regardless of their role, were on an equal footing, had an
    open forum with management, and were encouraged to brainstorm solutions to the
    symptoms of problems as well as solutions to the root causes. They made all their
    work visible on a large “wall of work” and, most important, made it part of their
    culture to bake quality into everything they did instead of trying to achieve
    quality through inspection later in the process. This usually took the form of
    a highly detailed definition of done that included instructions, how-to videos,
    stickers, and everything else needed to ensure that the product was complete and
    ready to ship. They made extensive use of old-fashioned checklists to ensure that
    no steps were missed along the way, seeing no reason to change a formula that
    worked.


    As DIY Fly grew, not only did their process improve, but so did the way they thought
    about their products and how they would deliver them. Tom and William realized
    that they had dodged a bullet (or several bullets) early on by assuming that they
    didn’t need to be more deliberate about discovery. Armed with a newfound humility,
    they revisited their product life cycle with an eye toward incorporating more
    user insight at every phase, starting with discovery. Real discovery with real
    users, not friends and relatives, as had been the case early on.


    At first, this took the form of simply adding more focus groups and 1:1 interviews
    but later grew into a whole field research component that went to model airplane
    clubs and parks for informal observation and sentiment gathering. At one point,
    their Designers ended up putting on an impromptu model airplane design workshop
    for a group of interested hobbyists who had gathered around. Once they saw the
    value of bringing outside voices into the creative process, design workshops that
    included a few customers became a regular element of their discovery process;
    their insights started to become personas, empathy maps, and journey maps—living,
    updated artifacts that DIY Fly employees would constantly refer back to whenever
    they had questions about whether they were solving the right problem. They also
    approached discovery with clearer learning goals in mind—would users want certain
    features for their planes? How much did a packaging update or a change to the
    product itself change their customers’ sentiment at different points of their
    experience?


    Better discovery and problem definition paid immediate dividends by focusing their
    thinking and ensuring they were solving the right problem. Wanting more process
    improvements, they doubled down on collaboration with customers and occasionally
    ran sessions designed to test new models that were designed to let users help
    them find flaws in their prioritization and product mix. It turns out, ensuring
    they were building the right solution was more important than they first thought,
    and several ideas that Tom and William thought were great (like the plane that
    could make a landing on water) were panned relentlessly by the user community.
    The more they engaged with users, the more they learned the limits of their knowledge
    of the market and came to rely on the only people who had perfect knowledge of
    what their customers wanted: their customers.


    Fast on the heels of their success with discovery and ideation, they turned their
    attention to concept validation. Here, they formalized their learning goals and
    added some rigor to their existing research efforts. They found that giving some
    thought and reflection to what they wanted to learn and why they wanted to learn
    it helped them better focus the learning activities and yielded better results.
    The recruitment effort was front and center and, with more classes of users to
    engage with, got a little more complex. Different types of users were recruited
    for impression tests, card sorting tests, and feature ranking tasks (sometimes
    called “buy a feature”). This step was reinvigorated by the addition of learning
    goals and the critical use of something new: lightweight prototypes that could
    never be used in production but that were useful for gaining user sentiment. Sometimes
    this looked like a finished plane (that just wouldn’t fly), and other times prototypes
    were simple paper drawings of product concepts. Tom and William were initially
    reluctant to spend time and money producing nonproduction prototypes. If they
    were going to spend money, they initially reasoned, they could sell the product
    and get feedback from users in the field. After a series of experiments, however,
    they determined that the speed of the feedback they could get from lightweight
    prototypes alone made them superior to gaining insight from finished production-quality
    work. Product quality and user satisfaction both improved dramatically as a result.'
