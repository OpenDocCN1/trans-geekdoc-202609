    \ expected outcomes, and measures of success in relation to both those users and\
    \ the business.\n\nBy contrast, the solution space is where teams devote the time\
    \ and attention to solving any problem they have defined, making all the decisions\
    \ about what a feature will be and how it will be delivered (see [Figure 1.1](#ch01.xhtml#_15064-4445_ch001_Figure_001)).\
    \ This includes ideation, user story writing, and the analysis of acceptance criteria\
    \ (AC) or requirements that will be delivered, as well as sizing, prioritization,\
    \ and execution of development work.\n\nIn thinking about the problem space versus\
    \ the solution space, it is useful to ensure that teams are continuously asking\
    \ the following three questions, best articulated by Jen Cardello, head of UX\
    \ research and insights at Fidelity Investments:\n\n*   “Are we solving the right\
    \ problem?” (right problem)\n\n*   “Is this the best solution, given all of our\
    \ constraints?” (right solution)\n\n*   “Are we delivering this solution correctly?”\
    \ (done right)\n\nThese questions are instrumental throughout the Human-Centered\
    \ Agile life cycle. It is important to understand that, at any point, it is possible\
    \ to learn new information that requires a team to revisit its original answers\
    \ to *any* of these questions.\n\n### ***Right Problem***\n\nAll of a team’s work\
    \ should solve an existing problem or need for the customer using the tool. A\
    \ key principle from the Agile Manifesto states “Simplicity—the art of maximizing\
    \ the amount of work not done—is essential.”[¹](#fn1)\n\nHuman-Centered Agile\
    \ recognizes the value of understanding and clearly defining the problem to be\
    \ solved—spending time in the problem space, to create a *****problem definition*****\
    \ that gives the team a strong foundation. That problem definition needs to include\
    \ user and business goals as well as a clear way to measure whether the team is\
    \ creating successful *****outcomes*****, not just delivering features.\n\n###\
    \ ***Right Solution***\n\nThere are a variety of ways to solve any problem. Solution\
    \ ideas can vary wildly in feasibility, cost, time to release, and value to the\
    \ user. As Human-Centered Agilists, the goal is to identify the best solution\
    \ that aligns the users’ needs with the business goals of the product being delivered.\
    \ Some problems can be solved with small-scale solutions, while others require\
    \ larger efforts. Sometimes, the best that can be done is *to mitigate* a problem.\
    \ Teams often find a strategy that blends short-term mitigation/improvement strategies\
    \ with a long-term vision for a better experience.\n\nIt is important to determine\
    \ that a solution is the right solution and that a solution be sustainable. Obviously,\
    \ business and technical factors are critical inputs in this process. So, too,\
