    Agile and Human-Centered Design (HCD) are two widely used disciplines that strive
    for similar outcomes but often struggle to “speak” to one another. HCD and Agile
    have embraced ways of working that focus on different phases of a delivery process.
    While they share some similar goals of learning about what product users want
    so that they can deliver useful solutions, the two disciplines have very different
    mindsets. Because of this, when asked to apply both disciplines, Agile and HCD
    practitioners struggle to understand each other’s point of view and often craft
    a process that lacks the necessary time in both the problem and solution spaces.
    When Agile and HCD practitioners work together, they are often unable to explain
    to business stakeholders what should happen and when.


    This can take the form of direct competition, or even conflict, as Agile-driven
    teams see HCD as either an obstacle or direct competitor for resources, while
    HCD practitioners struggle to gain ground with the early-phase efforts that can
    be very valuable in the long run. Attempting to integrate the HCD competency into
    an existing Agile program often results in friction, inefficiency, and conflict.


    It doesn’t have to be this way. This book proposes a way for these two disciplines
    to get along and deliver better outcomes.


    Human-Centered Agile is a holistic, simultaneous application of Agile product
    development and HCD throughout the product life cycle. This helps teams generate
    insights, validate designs, and get a faster evaluation of both designs and finished
    work than either Agile or HCD could by themselves. Human-Centered Agile is not
    the mere inclusion of HCD as a “bolt-on” to the Agile process but rather a whole
    new way of working and thinking that is integrated into Agile delivery from beginning
    to end. To achieve Human-Centered Agile, there isn’t one single place in the Agile
    workflow where HCD is applied.


    Human-Centered Agile uses user insights gathered through HCD methods to better
    inform every event and artifact throughout the Agile life cycle. Human-Centered
    Agile provides the ability for a single team to apply HCD methods to test a hypothesis,
    discover user needs, or even figure out which approaches don’t work. This feels
    different from traditional Agile (see [Figure 1.1](#ch01.xhtml#_15064-4445_ch001_Figure_001)).
    The customer is more present and involved, removing the Product Owner from standing
    between the team and end users. Users are consulted directly and continuously
    through development and even after deployment. This activity is planned and baked
    into the process.


    The Human-Centered Agile team is given permission to think about what needs to
    be built before building something, compare several design options, and mitigate
    risk by validating their assumptions through activities that generate user understanding.
    This stands in contrast to picking a Minimum Viable Product (MVP) and building
    it and only *then* getting user feedback.


    Incorporating HCD thinking and tools into Agile teams helps them deliver the most
    value to the user. Three basic yet crucial questions that teams should be asking
    throughout the product life cycle are:


    *   “Are we solving the right problem?” (`right problem`)

    *   “Is this the best solution, given all of our constraints?” (`right solution`)

    *   “Are we delivering this solution correctly?” (`done right`)


    Answering these questions is essential to delivering products in a cost-effective
    way. While traditional Agile frequently takes a “build it and see” approach to
    answering all three questions at once (sometimes after a good deal of work has
    been put in), key elements of Human-Centered Agile are:


    *   The use of HCD methods throughout the Agile process to address gaps in `discovery`,
    `ideation`, and `concept validation`.

    *   HCD practices are applied throughout the `stakes` to ensure the product is
    valuable upon release.

    *   Human-Centered Agile allows teams to plan and execute HCD work that might
    not be consumed immediately, providing a `Research Roadmap`.

    *   Human-Centered Agile brings HCD findings into product strategy, which is constantly
    updated based on fresh insight from users.

