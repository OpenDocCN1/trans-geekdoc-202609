  trans: '

    这种思考自然地引导他们对评估有了不同的看法，并对其进行了改进。为了给他们的流程提供帮助，他们聘请 Laurie 的前同事 Julia 担任全职 `Product
    Owner`（产品负责人），他们只后悔没有更早地做这个决定。


    尽管他们的每个产品都大到足以拥有自己的 `backlog`（待办事项列表），但现有的工作和它们之间的依赖关系需要专门的人来管理。例如，每架出货的飞机都必须有说明书和在线视频。有时这导致产品已经完成但无法发货，因为他们正在等待其他组件。事实证明，将依赖关系可视化是管理和最小化偶尔发生的瓶颈的关键——一个单一的视觉参考比他们之前使用的电子表格要有价值得多。这种形式呈现为一面大墙，每个功能点都有一张便利贴，并标明了可能交付的时间表。依赖关系用红色标记笔标出（如果墙面允许的话），让所有团队都能看到自己的依赖关系和集成点。这被用于使
    `Scrum of Scrums（敏捷联盟会议）变得更快、更高效。


    在经历了几次未能产生价值的失败 `sprints`（冲刺）后这一点变得显而易见，因为依赖关系（特别是广告和视频制作）没有得到协调，在团队之间制造了 Tom
    和 William 以前从未察觉的摩擦，导致了一些员工流失。他们很快意识到更换人员的成本（从时间、金钱和机会成本来看）是多么高昂。


    Julia 敦促他们聘请全职人员来识别和管理依赖关系，并指导团队实现“自我管理”。Tom 和 William 未能看到这种做法的价值并抵制了这一想法。将这一必要角色称为
    `Scrum Master（敏捷大师）`——一个他们以前从未听过的术语——这增加了他们的抵触情绪。`Agile（敏捷）`和 `Scrum` 的特殊词汇是采纳过程中的共同障碍，并非
    DIY Fly 所有。直到他们参加了一场当地商会的企业主活动，并听到 Julia 之外的人使用这个术语时，他们才对这一想法敞开了态度。他们听了其他领导者详细介绍他们在
    `Agile` 和 `Scrum` 方面的成功经验，以及他们对 `backlog` 和 `Scrum Master` 等非直观术语的挫败感，并决定放手一搏，最终聘请了人。Jeff
    是一位认证 Scrum Master，他被请来帮助他们过渡到 `Agile` 和 `Lean（精益）` 体验——`Agile` 用于 `Product Development（产品开发）`，`Lean`
    用于制造运营。他们物有所值。


    从第一天起，Jeff 和 Julia 的协同效应就体现在流程显而易见的改进中。他们将不断壮大的员工团队从一个大团队组织成几个不同的团队：制造、`marketing（营销）`以及
    `product development/improvement（产品开发/改进）`。制造团队使用 `Kanban（看板）` 来交付产品，而营销团队使用它将其工作可视化，并帮助每天决定最重要的工作。产品开发/改进团队使用
    `Scrum`，因为他们发现以一周为增量来计划工作很有帮助（尽管他们最初是从两周一次 `sprints` 开始的，但他们决定尝试一周一次 `sprint`
    并坚持了下去）。


    Jeff 和 Julia 建立了每周两次的 `Scrum of Scrums` 会议，以暴露依赖关系和风险，并确保团队始终协调工作。这是通过让每个团队派一两个代表参加简短会议，详细说明与其他团队的任何依赖关系来实现的。一旦确定了依赖关系，另一个团队就会承诺解决时间，以便所有人更好地计划。


    每个团队的工作在 `Kanban` 和 `Scrum` 板上保持可见。尽管运营已扩大到 23 人，但这种透明度提供了对其他人正在工作内容的洞察。Julia
    已经将融入用户洞察完善为一门科学：避免关键假设，并与用户验证任何重大的产品变更，然后评估结果变成了文化的一部分。


    这种心态使他们的产品质量和“适配性”提高了数倍，并极大地扩大了 STEM 教师和学生市场的销量。DIY Fly 变得声名显噪，在所有“大型超市”销售，他们的用户调查显示他们已成为市场中受信赖的名字。然而，William
    和 Tom 并没有打算安于现状。由于他们之前没有从公司中提取利润，现在他们有一笔相当的资金进行再投资，而他们确实这么做了。


    ## 第 4 年及以后


    将所有利润投资于开发新产品和改进现有产品的想法被证明是明智之举。随着产品数量的增加（现在包括针对每个个人数据的不同飞机设计，以及针对年幼儿童的各种“活动包”和针对
    STEM 教师的额外课堂练习），他们在焦点小组中确定的所有目标客户群的市场份额缓慢增长。随着这种增长，寻找新的分销渠道和销售点变得更容易，这增加了他们的盈利能力。他们的员工也在增长，这为扩大他们在第
    2 年和第 3 年建立的小团队集群带来了新挑战。


    随着产品组合的增加以及几个产品在技术上变得更加复杂，他们无法仅依靠三个核心制造团队来运作。他们必须扩大规模，尽管他们成功地使用了 `Kanban`，但他们发现需要额外的专业团队。


    因此，他们建立了一个团队负责为他们新的精密遥控模型系列制作电子设备，另一个团队负责管理所有的打印和冲裁。这两个团队都从 `Scrum` 转向使用 `Kanban`，因为在经过多次实验后，他们发现工作不够稳定，无法承诺持续两周甚至一周的
    `sprint` 目标。例如，一次专注于滑翔机组装的 `sprint` 因为零件未如预期到位而不得不取消。这让团队成员感到非常沮丧。使用 `Kanban`
    而不是 `Scrum` 使他们能够灵活性，每天早上检查工作并根据当天的情况重新设定优先级。

    '
