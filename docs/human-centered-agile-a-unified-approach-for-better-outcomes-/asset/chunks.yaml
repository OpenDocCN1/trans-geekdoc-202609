  trans: '


    | 阶段 | 传统敏捷方法 | 以人为本的敏捷方法 |

    |---|---|---|

    | 完善 | 产品负责人（Product Owner）和团队根据技术约束更新用户故事。产品负责人根据需要为开发提供额外的指导。 | 团队将验证中获得的洞察应用于解决方案的开发。以人为本（HCD）从业者参与故事完善，以确保开发反映了预期的解决方案，并足于用户需求和期望。
    |

    | 开发 | 开发人员根据新需求或不可预见的约束进行更改，并倾向于追求效率。 | 对开发的内进行 UX（用户体验）保障评审。开发人员和设计师共同根据新需求或不可预见的约束进行更改，并在效率与体验之间进行权衡。
    |

    | 解决方案验证 | 团队假设他们的解决方案通常是正确的，任何出现的问题可以在发布后通过迭代解决。 | 团队将解决方案（或不同保真度的原型）展示给终端用户，以确保产品在发布前被用户理解并按预期满足需求。
    |

    | 评估 | 团队将发布后从真实用户那里收集的任何反馈和洞察整合到下一个产品周期中。这通常是使用高层产品成功指标、广泛适的满意度结果或帮助热线/支持问题报告获取的。
    | 团队包含基于用户的产品发布后成功衡量，并根据反馈对任何缺口或额外功能进行优先级排序。 |


    在引入以人为本（HCD）时，团队将转变为一个在五个阶段中尽可能让最终产品用户参与的流程。


    在整个过程中让用户参与可以减少误判以及交付无法实际满足用户需求的产品的风险，从而改进产品生命周期的每一个步骤。从初始概念到实现，用户都是关键的利益相关者，团队应该寻求他们的投入。在早期阶段，他们帮助团队确保正在解决正确的问题；在后期阶段，他们帮助团队有效地构建出正确的解决方案。


    ## “实验性”心态


    实验帮助团队和领导者拥抱不确定性。将实验作为一种实践引入，是一个明确的信号，表明承认未知是有有价值的，同时正努力填补知识空白。它还为团队改进产品和流程提供了机会。


    在团队层面，实验是相当自然的。实验旨在通过一个清晰的假设来回答特定问题。例如，“更大的按钮会被点击得更频繁。”实验是一种特定的研究方法，是引入研究的一种可行方式，但它不是唯一的方法。


    ### 实验从哪里来？


    在产品层面，实验源于团队希望学习用户偏好的解决问题方法的愿望。这表现为对用户可能想要的内容提出假设并测试这些假设的机会。这可以在发现阶段发生（形式为从用户那里收集信息），也可以发生在构思阶段（即产生解决方案概念（如轻量级原型）并将其展示给用户）。在这两种情况下，这些都被视为具有特定学习目标的实验，团队有权既验证也可以推翻他们的假设，并有机会对如何继续进行做出决策。通过这种方式，这些实验产生的学习通过帮助团队理解用户对于“什么是正确的解决方案”以及“如何正确完成”的态度，来指导交付。


    在流程层面，实验可能以团队回顾的形式出现，表现为一种新的工作协议，供在一个或两个冲刺中进行尝试，“仅仅为了看看这样做效果是否更好”。同样，实验也可以源于项目级的回顾，项目回顾的结构和重点与团队回顾不同，但仍然提供了关于项目级行为和改进机会的洞察。


    ### 如何进行实验？


    支持向实验心态的转变需要在整个项目范围内征集实验想法。这些想法可能来自想要获得特定实验支持的团队，来自个人提出实验以解决担忧或知识空白的项目级会议，甚至来自某些渠道（如建议箱或“建议墙”），这些渠道允许个人异步且匿名地提出想法。一旦确定了实验，重要的是以这种方式对其进行记录，以便日后团队可以查看结果以指导未来的活动。


    确保实验、其进展和结果对所有人可见（而不仅仅是少数人）是至关重要的。此外，失败的实验应该被庆祝——拥有真正的实验心态，团队在获得“成功”（经过验证的假设）的同时，也会有一些“失败”（被推翻的假设）。事实上，“失败”是一个误导性的词，因为只要实验产生了学习，它就没有失败。通过频繁强调这一点，并关注实验带来的良好益处而不是它们“失败”了的事实，领导层可以展示出对团队以及这种这种新的工作和思维方式的支持。


    项目应该在项目内部强调实验及其结果。


    ### 迭代，而不仅仅是增量


    实验（事实上是所有研究）的结果之一是迭代。令人惊讶的是，团队和项目经常不理解迭代（iterations）和增量（increments）之间的区别，这类似于绘画（迭代）与拼图（增量）之间的区别。


    在拼图中，拼块一块接一块地添加，直到完成。构建拼图的人从不回去改进某块拼图或一组拼图。它是一个*组装过程*，而不是一个*改进过程*。


    绘画倾向于相反的方式。画家从草图和基础构图开始，在过程中不断完善。他们可能在不同阶段进行，但绘画的每个区域都被重做过一次。画家退后，评估他们的工作并迭代，直到光线、阴影和纹理完成。


    对于任何敏捷团队（特别是以人为本的敏捷团队）来说，迭代是至关重要的。不迭代的团队就不会创新。以增量而非迭代方式构建产品是非常常见的反模式。小批量构建的意义在于从用户那里获得快速且频繁的反馈。反馈的意义在于改进未来的交付。不接收反馈或不使用反馈改进产品的团队往往是在给瀑布模型披上敏捷的外壳。不要这样做。


    ## 从“构建并观察”的敏捷到从“构建并观察”转向基于风险的思维是迈向以人为本敏捷的关键步骤，因为这种思维允许团队将投入在 HCD 研究上的时间、金钱和精力水平与功能或产品的风险相匹配。这种转变鼓励早期讨论功能的风险，以及通过更深入了解用户或直接观察用户与拟议特征的交互来缓解哪些风险。它还强调了一致地衡量结果。


    ### 以人为本的敏捷赋能团队


