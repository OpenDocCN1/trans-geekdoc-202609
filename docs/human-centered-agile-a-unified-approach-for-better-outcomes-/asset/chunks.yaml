- raw: 'When starting to handle distributed design work, product teams usually attempt
    to establish basic design standards first, if they aren’t already in place. At
    the previous single-team level, design standards, based on the degree of specificity
    required, were often captured into style guides or pattern libraries to maintain
    consistency. The purpose of these documents at the previous level was primarily
    *longitudinal*, the team wanted to make sure its future decisions were consistent
    with past decisions. Additionally, they may have developed artifacts for efficiency,
    such as reusable templates to articulate designs more quickly.


    When the organization moves to distributed work, the concern over maintaining
    consistency is no longer primarily longitudinal, it is also *latitudinal*. A decision
    made by one team, affecting the overall design ecosystem, needs to be agreed to
    and assimilated by other design teams as efficiently as possible. Otherwise, competing
    design approaches start to emerge.


    ## Consistency of Product Design


    The goal of design ops is to give Designers at the team level enough independence
    and flexibility to solve the specific problems in front of them while ensuring
    that their designs are appropriate for the context in which they will be deployed.


    Design consistency refers to consistency in *all* facets of the design:


    *   **Visual—**using the same colors, fonts, and font sizes


    *   **Interaction—**uniform product appearance, behavior, and error management
    from one user to another


    *   **Content and Voice—**standardized vocabulary and voice across the product
    portfolio


    Depending on the environment, teams may have multiple stakeholders for product
    design. Someone should track the use of brand elements, such as colors, logos,
    and so on, as well as whether there are policy or legal constraints on how the
    material is used. Making sure new designs reflect a good product vision and adhere
    to any other constraints is critical to getting products out the door.


    ### Tools for Ensuring Consistency across Teams


    It’s very possible that current documentation is simply definitional, such as
    the use of certain color values or font-specific indicators. As a single team,
    ongoing discussions about how and when to use these elements—what makes for good
    uses of accent colors, or different heading styles—is important but likely happened
    naturally within the flow of product design and implementation. As a distributed
    team, being able to refer to decisions that multiple teams contribute to and have
    a stake in is essential.


    If a team is already using a style guide or pattern library, moving to a distributed
    team requires evolving this documentation. In addition to the style *definition*
    (e.g., what different headers look like in terms of font family and size), documentation
    should now include style *guidance* as well (such as when it is appropriate to
    use each header). Guidance is reviewed with new Designers to ensure they understand
    how patterns are meant to be applied.


    If the teams have not yet started using style guides and pattern libraries, it
    is now essential that they develop them. For larger programs that would benefit
    from a more robust centralized design, two new concepts, code libraries and design
    systems, deliver higher levels of detail and efficiency, as the front-end code
    gets incorporated into the centrally maintained design resources.


    **Code Libraries—**A set of code developed to render designs consistently in a
    repeatable way and promote code reuse. They are often, but not always, built on
    a specific front-end framework—a common code base usually mixing HTML, CSS, and
    JavaScript that creates consistent appearance and behaviors (examples include
    Bootstrap, developed by Twitter, or Material-UI, based on Google’s Material Design).


    **Design Systems—**A tool meant to fully aggregate styles, patterns, code, and
    guidance (including high-level design principles) into a managed and implementable
    system. By creating a design system, teams give their Designers tools that should
    help them allocate more time to the harder parts of the design process. At the
    level of distributed teams, teams may find it useful to create an early and very
    basic design system. To see a couple of example design systems, check out IBM’s
    Carbon Design System[^(10)](#fn10)


    ### Design Governance


    As with any standard practice, there are pros and cons to creating design standards
    that Designers are expected to follow. On one hand, products will look and behave
    in a consistent fashion, more closely reflecting an organizational sensibility
    about what the product(s) should be. Design standards also provide guidance on
    micro-level design decisions, such as how to handle specific repeating interactions
    and apply specified visual styles. This enables teams to produce higher-fidelity
    designs more quickly.


    On the other hand, design systems themselves require a maintenance investment,
    and individual teams or Designers may feel overly limited in what they are able
    to produce. Depending on the team culture and constraints of stakeholder obligations,
    teams must determine the correct level of governance to complement their standards.


    There is no one “right” level of detail for a style guide or pattern library.
    The “right” level of detail is that which works across all the teams. However,
    the three most common ways to handle this are:


    **Voluntary Compliance—**This approach, often appropriate for small teams, produces
    standards but allows compliance to be fully voluntary at the team level. In other
    words, Designers have a tool set to choose from (or not) as they wish, and the
    determination about what is “good enough” consistency happens at a team level.
    This avoids the headache of any additional overhead that goes into governance.
    However, unenforced standards will likely lead to more consistency but not perfect
    consistency.


    **Centralized Design Reviews and Approval—**Creating a centralized review and
    approval process is the next step toward creating more consistency. Designs are
    reviewed for standards compliance *before* they are implemented by the developers.
    Designers will typically present proposed designs for evaluation that, as part
    of that evaluation process, will be vetted for whether they do or do not adhere
    to established standards.


    **External Design Reviews and Approval—**If an organization requires additional
    stakeholders to review any portion of the design or copy, teams will also want
    those approvals to happen before a design is considered “ready.”


    ## Coordinated Design Activities


    ### Collaborative Ideation


    If the program is growing from a single team to distributed teams, the process
    of collaborative ideation may need to change. What may have previously been ideation
    conducted through ad hoc conversations, story refinement, and other informal means,
    now needs to incorporate additional interests, specifically


    *   additional stakeholders from other Agile teams because of cross-team dependencies
    or impacts (or even needs).


    *   user research conducted on behalf of other teams to help in ideation.


    In order to ensure that the stakeholders are involved and that user understanding
    is maximized, collaborative ideation should become a more formal process. One
    particularly effective way to accomplish this is to do collaborative ideation
    as a workshop.


    ### Reviewing and Accepting Stories


    As stories are elaborated and questions answered, teams need a way to know when
    a story has enough definition for them to begin working on it. Many teams adopt
    a “definition of ready” or a “ready checklist” to help keep them from pulling
    stories into a sprint that they don’t know enough about to complete. In order
    to maintain consistency across teams, the definition of ready should include “designs
    have been reviewed for compliance with design standards” before they are deemed
    acceptable for development.


    ### The Designer Sync Meeting'
