- raw: 'This thinking naturally led them to think differently about evaluation and
    improve that as well.


    To assist in their proven processes, they hired a former colleague of Laurie’s,
    Julia, to be their full-time Product Owner, a decision they only regretted not
    making sooner. Having a single person to focus on their backlog helped them achieve
    a focus they hadn’t realized was lacking.


    Although each one of their products was large enough to have its own backlog,
    the existing “common” work and dependencies between them required a dedicated
    person to manage it. For example, every plane that shipped had to have instructions,
    an online video, and advertising. Sometimes this resulted in finished products
    that they were unable to ship because they were waiting for the other components
    to be done. Visualizing these dependencies turned out to be key to managing and
    minimizing the bottlenecks that occasionally occurred—having a single visual reference
    was far more valuable than the emails and spreadsheets that they had been using
    previously. This took the shape of a large wall that had a sticky note for each
    feature and a timescale with an approximate timeframe for when the feature might
    be delivered. Dependencies were identified with red yarn (or a red whiteboard
    marker if their wall permitted its use). This way all the teams could see where
    their dependencies and integration points were at a glance. This was used to make
    Scrum of Scrums meetings faster and more efficient.


    This became apparent after a few “failed” sprints that produced no value because
    dependencies (specifically advertising and video production) had not been coordinated,
    creating friction between teams that Tom and William had never noticed before,
    which resulted in some employee turnover. They quickly learned how expensive it
    was to replace someone (in terms of time, money, and opportunity cost).


    Julia urged them to hire a full-time person to identify and manage the dependencies
    as well as coach the teams in becoming “self-managing.” Tom and William failed
    to see the value in this and resisted the idea. Julia, referring to this necessary
    role as “Scrum Master,” a term they had never heard before, only added to their
    resistance. The peculiar vocabulary of Agile and Scrum is a common barrier to
    adoption and not isolated to DIY Fly.


    It wasn’t until they attended a local Chamber of Commerce event for business owners
    and heard someone other than Julia use the term that they opened up to the idea.
    They listened to other business leaders detail their success with Agile and Scrum
    as well as their frustrations with nonintuitive terms, like *backlog* and *Scrum
    Master*, and decided to take the plunge and finally hired someone. Jeff, a Certified
    Scrum Master, was brought in to help them transition to both an Agile and Lean
    experience—Agile for Product Development and Lean for their manufacturing operations.
    They got what they paid for.


    From day one, Jeff and Julia’s synergy was evident in the obvious improvements
    to their processes. They organized the still-growing staff from one large team
    into several distinct teams—manufacturing, marketing, and product development/improvement.
    The manufacturing team used Kanban to deliver the product while the marketing
    team used it to visualize their work and help decide, on a daily basis, the most
    important thing to work on. The product development/improvement team used Scrum
    because they found it helpful to plan their work in one-week increments (although
    they started with two-week sprints, they decided to experiment with a one-week
    sprint and stuck with it).


    Jeff and Julia established twice-weekly “Scrum of Scrums” meetings to expose dependencies
    and risks and ensure teams always coordinated their work. This was accomplished
    by having one or two representatives from each team attend a short meeting to
    detail any dependencies with other teams. Once a dependency was identified, the
    other team committed to a timeline for resolution so everyone could plan better.


    Each team’s work remained visible on the Kanban and Scrum boards. Although the
    operation had grown to 23 people, this transparency provided insight into what
    everyone else was working on. Julia had honed incorporating user insight into
    a science and avoiding key assumptions and validating any substantial product
    changes with users then evaluating the results became part of the culture.


    This mindset improved the quality and “fit” of their products several times over
    and helped dramatically expand sales in the STEM teacher and student market. DIY
    Fly became well known, available for sale in all the “big box” stores, and their
    user surveys indicated that they had become a trusted name in the market. However,
    William and Tom had no intention of resting on their laurels. Since they hadn’t
    been taking profits out of the company, they now had a decent amount of money
    to reinvest, which is exactly what they did.


    ## Years 4+


    The idea to reinvest all the profits in developing new products and improving
    existing products turned out to be a smart move. As the number of product offerings
    grew (now including several different plane designs for each demographic as well
    as a variety of “activity kits” for younger children and additional classroom
    exercises for STEM teachers), their market share across all the target customer
    groups identified in their focus groups slowly grew. As it did it became easier
    to find new distribution channels and sales outlets, which added to their profitability.
    Their staff also grew, which brought new challenges in scaling the small clusters
    of teams they had during Years 2 and 3.


    As their product mix grew and several products became technically more complex,
    they were unable to function with only their three, core manufacturing teams.
    They had to scale and, despite their successful use of Kanban, discovered the
    need for additional, specialized teams.


    So, they formed a team responsible for making the electronics for their new sophisticated
    line of radio-controlled models and another to manage all the printing and die-cutting.
    Both teams shifted from Scrum to using Kanban, finding their work not stable enough,
    after multiple experiments, to commit to sprint goals for two weeks or even one
    week at a time. For example, a sprint focusing on glider assembly had to be canceled
    when parts were not available as expected. This frustrated the teams enormously.
    Using Kanban instead of Scrum gave them the flexibility to examine their work
    each morning and reset priorities based on that day’s circumstances. They established
    a team to focus entirely on shipping, both in- and outbound, which used a fairly
    complex Kanban board to visualize their shipments from all over the world. Jeff
    set up a cumulative flow diagram for them, so they could visualize bottlenecks
    anywhere in their complex distribution system. For example, due to a fire at a
    large port, they had trouble getting raw materials shipped from a supplier in
    China. Seeing this, they were quickly able to minimize the delay to their planned
    production by pivoting to a secondary supplier in South America.'
