- raw: "As luck would have it for Tom and William, Tom’s wife, Laurie, was an experienced\
    \ user experience (UX) professional. Laurie had kept a distance from DIY Fly because\
    \ she knew that engaging with her spouse’s work could create marital tension and\
    \ strain. However, when she saw Tom struggling with what seemed to her to be the\
    \ basics of building a business, she felt it was time to step in.\n\nLaurie told\
    \ the partners they needed to spend more time learning about their customers.\
    \ Sure, they knew the product, but that meant nothing if they didn’t know who\
    \ they were building it for, which Laurie pointed out had been for themselves,\
    \ no one else. She suggested talking directly to their existing customers. They\
    \ needed feedback from the people who bought and flew DIY Fly airplanes, not just\
    \ from those who were already supportive of them.\n\nAt Laurie’s suggestion, they\
    \ first engaged in several activities designed to identify, catalog, and understand\
    \ their customers. They realized they needed to better understand\n\n*   who was\
    \ buying their products and, more important, why.\n\n*   whether their customers\
    \ were happy with the products.\n\n*   how they could change their product mix\
    \ to be more appealing.\n\n*   if their customers wanted any additional features\
    \ or different product variations, they could refine and then validate those ideas.\n\
    \nSince they had used Kickstarter, they had a large pool of customer contact information\
    \ to begin with. Despite having already sent out a satisfaction survey a month\
    \ after shipping out their first round of planes, they didn’t receive many substantial\
    \ responses outside of a few enthusiastic replies and some complaints. They needed\
    \ detailed feedback.\n\n### Recruitment\n\nWilliam and Tom decided to reach out\
    \ to specific individuals with recruitment incentives. Excluding family and friends,\
    \ they emailed invitations to an information-gathering session, offering $20 Amazon\
    \ gift cards for participation. They were proud of themselves for this recruitment\
    \ effort and thought they had it all figured out. As they grew, they would find\
    \ out that what seemed like such a simple, easy thing was neither of those things\
    \ and that it was critical to the success of their whole research effort. Years\
    \ later when they were struggling to recruit teachers who spoke Spanish and who\
    \ had not yet used their products with students (with a learning goal of making\
    \ sure their instructions were clear), the simplicity of sending out their first\
    \ invitations and gift card offers to “anyone” seemed quaint.\n\n## DIY Fly Gets\
    \ off the Ground\n\nCoordinating the interviews took longer than expected, but\
    \ they managed to get a useful amount scheduled. Even after several no-shows and\
    \ a handful of people providing insignificant feedback, they’d received valuable\
    \ information from many participants. Tom and William noticed certain themes emerge\
    \ that prompted a change in their approach to product development (and backlog\
    \ refinement). They also discovered that their customers could be divided up into\
    \ the following categories:\n\n*   **Hobbyists**—The “primary” market they assumed\
    \ would be their target when they started selling products commercially. These\
    \ customers generally responded well to product ideas like prebuilt gliders, battery-powered\
    \ planes, and templates and designs for making their own paper gliders.\n\n* \
    \  **Parents**—The “secondary” market comprised those wanting something they could\
    \ spend time doing with their kids. The product mix for this group was challenging,\
    \ however, and the idea of developing more complicated products was a nonstarter.\n\
    \n*   **STEM teachers**—The “unexpected” market that included purchases for the\
    \ purpose of teaching the basics of aerodynamics. Products appropriate for these\
    \ users were design templates for paper gliders, instruction books to help teachers\
    \ learn and teach the material to students, and slide decks and other instructional\
    \ aides for the classroom; see [Figure 16.1](#ch16.xhtml#_15064-4445_ch016_Figure_001).\
    \ During their interviews, Tom and William learned that this group needed to keep\
    \ costs minimal, so a do-it-yourself assembly approach was desired.\n\n*   **Advanced\
    \ hobbyists**—The “more experienced” market of users, consisting of older children,\
    \ young adults, and students who had already been introduced to their products\
    \ and wanted to continue learning and tinkering on their own as a hobby. This\
    \ group reported wanting products, such as advanced design templates incorporating\
    \ more complex and nuanced aerodynamic theory, stand-alone battery-driven propellers\
    \ that could be attached to any paper or plastic glider design, and simple, low-cost\
    \ radio-controlled, battery-powered flying models with longer flight times.\n\n\
    ![Figure 16.1 The persona of a STEM Teacher that DIY Fly developed.](Images/Figure16_1.jpg)\n\
    \n[Figure 16.1](#ch16.xhtml#R_15064-4445_ch016_Figure_001) The persona of a STEM\
    \ Teacher that DIY Fly developed.\n\n### Understanding and Capturing User Needs\
    \ and Desires\n\nAs Tom and William began mapping their existing product line\
    \ to the customer segments and personas they had developed, they discovered that\
    \ their product mix contained glaring gaps, which left entire customer segments\
    \ without a desirable solution for their needs; see [Table 16.1](#ch16.xhtml#_15064-4445_ch016_tab_001).\n\
    \n[Table 16.1](#ch16.xhtml#R_15064-4445_ch016_tab_001) DIY Fly Products and Product\
    \ Gaps by Customer Segment\n\n| Customer Segment || Existing Products || Product\
    \ Gaps |\n\n| --- | --- | --- |\n\n| Hobbyists || Prebuilt gliders  \n\nSimple\
    \ battery-powered planes || Books of templates and designs for making their own\
    \ paper gliders |\n\n| --- | --- | --- |\n\n| Advanced hobbyists || None || Radio\
    \ control and directional technology  \n\nBooks of advanced design templates that\
    \ incorporate more complex and nuanced |\n\n| Parents of younger kids || Prebuilt\
    \ gliders || Simpler-to-build planes  \n\nMore decorations and ‘toy-like’ |\n\n\
    | STEM teachers and students || Books of templates and designs for making their\
    \ own paper gliders  \n\nSimple battery-powered planes || Books that helped teachers\
    \ learn and teach this material to students  \n\nSlide decks and other instructional\
    \ aides to help them in the classroom (e.g., aerodynamic theory in their design)\
    \  \n\nStand-alone battery-driven propellers that could be attached to any paper\
    \ or plastic glider design |\n\nThis matrix showed that their customers had identified\
    \ needs Tom and William hadn’t even thought of. Their initial concern quickly\
    \ turned to excitement as they considered how to modify their current product\
    \ mix to serve these currently underserved or unserved customer segments. Using\
    \ sticky notes to capture ideas, they quickly developed a long list of features\
    \ to fill these needs. Some of their ideas looked challenging, while others were\
    \ simple adaptations of their existing products.\n\nTom and William also shifted\
    \ away from their focus on the “moment of flight” and “time aloft,” which had\
    \ dominated their building to date, and began incorporating the feedback from\
    \ their interview sessions to include a whole timeline and series of interactions\
    \ around “flight.” The other phases were:\n\n*   Exploring the product (prior\
    \ to purchase)\n\n*   Anticipating the product (post-purchase)\n\n*   Unboxing\
    \ (product arrival)\n\n*   Building/Assembling\n\n*   Flight\n\n*   Documenting\
    \ the flight\n\nEach of these steps held specific opportunities for improvement.\
    \ Their product descriptions were thorough, but their customers had shared that\
    \ the instructions for use/assembly needed improvement, suggesting that the inclusion\
    \ of instructional videos and elaboration on the more difficult parts of assembly\
    \ would be helpful. Tom and William were surprised by the identified “anticipation”\
    \ step and were disappointed in themselves for not thinking of “documenting” as\
    \ its own step. Admittedly, they weren’t quite sure what to do for these, but\
    \ at least they had a more complete picture of what using their product looked\
    \ and felt like in the eyes of their users."
