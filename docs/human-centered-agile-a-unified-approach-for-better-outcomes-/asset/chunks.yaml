- raw: "> Learning goal 2: Identify the preferred method of support. We will include\
    \ a question about how they expect and/or would prefer to reach us after hours.\n\
    \n> \n\n> Methodology: 12–15 one-on-one interviews, expected to take 10 minutes\
    \ or less.\n\n> \n\n> Recruitment: We will be offering a small incentive ($10\
    \ account credit) and sending a recruitment email to a sample group of users who\
    \ have opted in for research participation.\n\n> \n\n> Share-out: There will be\
    \ a one-page or shorter summary of responses, with an analysis of current support\
    \ expectations, and preferred support channels/methods.\n\n> **Story: As a product\
    \ team, we want to validate that users are regularly experiencing frustration\
    \ that their issues cannot be addressed after hours so that we can address their\
    \ needs in an appropriate way.**\n\n> \n\n> Learning goal 1: Identify whether\
    \ users who have recently called customer support experienced “wait frustration”\
    \ because they were not able to contact us immediately.\n\n> \n\n> Methodology:\
    \ A onetime brief (no more than 3 questions) multiple-choice survey of customer\
    \ support users in the past month, with an option for additional comments.\n\n\
    > \n\n> We expect a “polar” response and that frustrated users will be more motivated\
    \ responders. In this case, this is not a problem—we will evaluate reports of\
    \ frustration both as a percentage of respondents and as a percentage of survey\
    \ recipients.\n\n> \n\n> Recruitment: We will be offering a small incentive ($10\
    \ account credit) and sending a survey for response to *all* users that have contacted\
    \ us for customer support in the past 30 days.\n\n> \n\n> Share-out: There will\
    \ be a one-page or shorter summary of responses.\n\nAs with any story, research\
    \ stories should be reviewed, refined, and estimated with the whole team, who\
    \ may have questions or additional thoughts about any of the details provided:\
    \ methodology, questions of interest, or how information is distributed. It will\
    \ also be up to the team to determine how to capture additional work—for example,\
    \ the generation of an interview script might become an acceptance criteria item,\
    \ while the actual conducting of an interview could be a task.\n\nThese examples\
    \ are for problem validation tied to an epic, but this story structure works for\
    \ any research stories, including concept and solution validation stories.\n\n\
    ### Ideation and Concept Validation Stories Prior to Features\n\nLike research\
    \ stories, ideation stories are tied to an epic and precede identification of\
    \ a specific solution. The goal of an ideation story is to generate solution concepts\
    \ that can be evaluated relative to one another. In the example provided, if the\
    \ team validated a need for additional support, there would be a follow-up story\
    \ to generate solution concepts for providing that support.\n\n> **Story: As a\
    \ product team, we want to generate and estimate multiple-solution approaches\
    \ that solve a user’s need for after-hours support so that we can identify the\
    \ most promising solution candidates to deliver.**\n\n> \n\n> AC1: We will conduct\
    \ a workshop-style ideation session, with the goal of producing 3–5 feasible designs.\
    \  \n\n> AC2: All designs will be given a rough estimate (T-shirt size) for level\
    \ of effort, a score for feasibility, and a score for expected user desirability.\n\
    \n> \n\n> Upon completion of this story, candidate solution(s) will be selected\
    \ for either development or for further validation if risks are identified (including\
    \ feasibility assessment and/or user acceptance)\n\nNote that this team has chosen\
    \ to collaborate on their ideation, so rather than describe a specific number\
    \ of designs, they put a target outcome instead. This allows for flexibility in\
    \ their ideation process. If this team were to produce ideas that seemed promising\
    \ and wanted to ensure that users would be receptive to their solution(s) before\
    \ investing in substantial development work, they might then create a new research\
    \ story for concept validation.\n\n> **Story: As a product team, we want to understand\
    \ which proposed after-hours support options users will find most helpful so that\
    \ we know whether to move forward with this solution.**\n\n> \n\n> Learning goal\
    \ 1: Identify which support channels users find most valuable, from our list of\
    \ feasible solutions.\n\n> \n\n> Methodology: This will be an asynchronous ranking\
    \ task for about 50 users. We will present users with our five solution candidate\
    \ options and ask them to rank them in order of preference. We will also include\
    \ an indicator for “would not use” as an option and an opportunity for additional\
    \ comments.\n\n> \n\n> Recruitment: We will be offering a small incentive ($10\
    \ account credit) and sending a participation link to a sample group of users\
    \ who have opted in for research participation.\n\n> \n\n> Share-out: Solutions\
    \ will be presented in order of overall preference score and score distribution.\
