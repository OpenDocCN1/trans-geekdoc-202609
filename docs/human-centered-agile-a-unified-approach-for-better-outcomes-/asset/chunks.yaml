    \ tools. It is rare for a team to need to track dozens and dozens of metrics.\n\
    \n## Objectives and Key Results\n\nObjectives and key results (OKRs) have recently\
    \ become a hot topic in Agile circles. There are even OKR certifications. OKRs\
    \ fit well with Agile development because both break down large units of work\
    \ into smaller units, focusing on outcomes. Objectives are larger, overarching\
    \ goals or outcomes, and Agile and Human-Centered Agile, especially, are outcome-focused.\
    \ Key results are smaller outcomes that help build to the overarching goal or\
    \ objective.\n\nSometimes, objectives are given to teams by product management\
    \ or Executives. It then becomes up to the teams to determine the key results\
    \ that will build to that objective. Most often, teams work with their Product\
    \ Owners to determine both their objectives and the key results that build up\
