    如果说战略组合评审（strategic portfolio review）是重新评估和对齐策略的地方，那么组合同步会议（portfolio sync meeting）……


    有些组织选择在举行战略组合评审的月份跳过组合同步会议。这是一个错误。这两个会议的成员通常有重叠，虽然大家都希望参加的会议少，但这些会议的目的是不同的，因此跳过组合同步会议的组织错过了检查其组合状态的宝贵机会。


    还需要注意的是，有时直接影响策略的见解会在这些会议上进行传达。当这种情况发生时，要抓住机会，不要等待下一次战略组合评审。将这些见解直接提供给需要它们来做出决策的利益相关者，以免其过时失去价值。这是根据见解和快速学习动态调整策略的关键组成部分。


    ### 欢乐时光 (Happy Hour)


    这是大家说出心里话的地方。（开玩笑的。大体如此。）


    说认真的，非正式会议对于完成工作至关重要，对于团队建立信任和联系也同样重要。这不仅意味着对工作进行无过滤的对话，还意味着讨论非工作相关的话题。在这种环境下，团队有机会了解彼此的兴趣和爱好，并将同事视为独立的人来认识。这种熟悉感产生了信任，正如西蒙·辛奈克（Simon
    Sinek）所说：“团队不是一群一起工作的人。团队是一群相互信任的人。”


    # 第 13 章 扩展团队结构


    DOI: [10.4324/9781003188520-18](https://doi.org/10.4324/9781003188520-18)


    在小型范围内，单个敏捷团队在很大程度上是独立的，与其他团队很少或没有依赖。随着规模和复杂性的增长，需要更多的从业者和团队。在某一点，团队集群会失去焦点，并产生竞争性的优先事项和目标。为了让大量团队达成一致，SAFe®
    使用了一种称为敏捷发布火车（Agile Release Train, ART）的概念。


    ## ART 在更长跨度内的计划


    ART 允许大量人在比单个团队迭代更长的时间跨内进行思考和合作。计划间隔（Planning Intervals）是 8-12 周的迭代集合，允许团队在更长的时间范围内上规划更大的工作。除了允许在更长的时间范围内规划更大的工作外，在整个项目中具有这种级别的可见性意味着团队和领导层能够意识到工作之间的依赖关系。对于
    HCD（以人为本的设计）从业者来说，这种额外的结构使得在开发者提取故事进行实现之前，计划和协调研究与设计工作变得容易得多。


    ### ART 交付特定的客户价值


    ART 并非由随机、不相关的工作组成。相反，它们围绕工作交付给用户的特定价值进行组织。这很重要，因为新角色和活动的目的是为了确保史诗（epics）和特性（features）作为一个整体支持共同目标，并在连贯的成功愿景中共同工作。产品经理负责确保
    ART 上所有团队的工作都支持 ART 的总体目标，而这些目标反过来又支持更大的组织目标。不能因为“他们有空闲”就将随机、不相关的工作分配给 ART。


    ## 更新用于规模敏捷的团队角色


    扩展敏捷需要新的角色来跨团队进行协调并提供战略指导，管理优先级和资源冲突，并确保 ART 上的所有团队协作工作，共享共同的产品愿景和技术愿景。


    ### 产品经理


    必须由单个人而非小组或委员会负责开发和传达产品愿景。


    ### 发布火车工程师 (Release Train Engineer)


    大型团队集合（如 ART）需要一个人（具体说是一名敏捷专家）来协调许多 Scrum Master，促进 ART 级事件，并对 ART 和利益相关者进行敏捷实践教练。这名“首席
    Scrum Master”被称为发布火车工程师 (RTE)。


    *   促进 ART 级事件和规划会议

    *   设定并传达这些事件的日历表

    *   跟踪 ART 级指标

    *   确保所有 Scrum Master 保持一致，并快速消除 Scrum Master 提交的阻碍

    *   帮助识别风险并管理依赖关系

    *   跟踪特性完成的进度

    *   确保产品经理与产品所有者之间达成一致

    *   帮助识别并消除瓶颈

    *   确保产品愿景、路线图和项目待办事项列表（program backlog）得到整合


    该角色的责任比描述所暗示的更大、更难。


    ### 系统架构师/工程师 (System Architect/Engineer)


    需要的下一个主要新角色是某来让许多团队（甚至是供应商）对齐共同的架构愿景，并填补第 12 章描述的在规模化时出现的技术空白。这一关键角色负责评估技术替代方案、创建持续交付流水线，


    ### 业务所有者 (Business Owner)


    最后，在扩展时，需要对解决方案成功负最终责任的高级利益相关者或高管。SAFe® 将这些人称为业务所有者，他们负责“由 ART 开发的解决方案的治理、合规性和投资回报率（ROI）”。


    ### UX 架构师 (UX Architect)


    虽然不是 SAFe® 的正式组成，但团队可能需要某人来管理设计并协调研究，就像系统架构师/工程师对齐技术利益一样。此人负责设定设计标准和治理，确保研究得到适当协调和执行，并确保整体产品（或价值）与整体体验保持一致。如果没有专门的人管理体验，ART
    可能会出现“体验漂移”，即单个体验本身是合理的，但它们无法协同作用以形成完整的、整体的体验。鼓励实践 SAFe 的团队思考 UX 架构师如何让其项目受益益，通常是通过在团队内部及团队之间建立设计评审和批判的实践。


    ## 更新用于大规模 HCD 的团队拓扑结构


    从少数团队的敏捷变为许多团队的敏捷时，团队组成会发生变化。目标仍然是拥有完全自给足的团队，但在实践中，某些团队在特定时间或间隔只需要某些技能组合（特别是 HCD
    技能）。任何扩展敏捷的方法，特别是敏捷中的 HCD，最终都必须解决完全独立的团队并不总是高效模型的问题。


    确定在 SAFe® 项目中部署 HCD 从业者以产生最大效果至关重要。最终，团队拓扑结构和 HCD 从业者的部署取决于几个因素，例如 ART 上的从业者人数、工作总量以及正在进行的工作类型。为了做到这一点，应该：


    *   一名 UX 架构师协调工作

    *   将 HCD 从业者嵌入到有足够工作的团队中

    *   一个 HCD 共享服务团队，可以支持有限的参与并管理设计和研究运营活动


    ### 将 HCD 从业者嵌入敏捷团队


