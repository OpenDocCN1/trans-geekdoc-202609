  trans: '

    敏捷开发（Agile）和以人为本的设计（HCD）是两个广泛使用的学科，它们追求相似的结果，但往往难以相互进行“对话”。HCD 和敏捷开发都采纳了关注交付过程不同阶段的工作方式。虽然它们在某些目标上相似，即通过了解用户想要什么的产品来交付有用的解决方案，但这两个学科的思维截然不同。正因如此，当被要求同时应用这两个学科时，敏捷和
    HCD 的从业者往往难以理解对方的观点，并且经常设计出一个在问题空间和解决方案空间都缺乏足够时间的流程。当敏捷和 HCD 从业者合作工作时，他们往往无法向业务利益相关者解释应该发生什么以及何时发生。


    这种情况可能表现为直接的竞争，甚至是冲突，因为由敏捷驱动的团队将 HCD 视为障碍或资源的直接竞争者，而 HCD 从业者则难以为那些长远来看非常有价值的早期阶段工作赢得立足之地尝试将
    HCD 能力整合到现有的敏捷计划中，通常会导致摩擦、效率低下的冲突。


    情况并非必须如此。本书为这两个学科提供了一种能够和谐相处并交付更好结果的方法。


    以人为本的敏捷（Human-Centered Agile）是在整个产品生命周期内对敏捷产品开发和 HCD 的整体、同步应用。这有助于团队产生洞察、验证设计，并比单独的敏捷或
    HCD 都能更快地对设计和完成的工作进行评估。以人为本的敏捷并非仅仅将 HCD 作为一种“插件”包含在敏捷流程中，而是一种全新的工作和思维方式，这种方式从头到尾整合到敏捷交付中。要实现以人为本的敏捷，并不是在敏捷工作流中的某一个特定位置应用
    HCD。


    以人为本的敏捷利用通过 HCD 方法收集的用户洞察，来更好地指导敏捷生命周期中的每个活动和产物。以人为本的敏捷使单一团队能够应用 HCD 方法来测试假设、发现用户需求，甚至弄清楚哪些方法不可行。这感觉与传统的敏捷开发不同（参见图
    1.1）。客户的感和参与度更高，消除了产品负责人（Product Owner）在团队和终端用户之间的隔阂。在开发过程中甚至部署后，都会直接且持续地咨询用户。这种活动是经过计划并融入流程的。


    以人为本的敏捷团队被允许在构建东西之前思考需要构建什么，比较多个设计方案，并通过通过产生用户理解的活动来验证他们的假设以降低风险。这与选择一个最小可行性产品（MVP）并构建它并在*之后*才获取用户反馈的做法形成对比。


    将 HCD 思维和工具整合到敏捷团队中，帮助他们为用户交付最大的价值。团队在整个产品生命周期中应该提出的三个基础但关键的问题是：


    *   “我们正在解决正确的问题吗？”（`right problem`）

    *   “考虑到所有的限制，这是最佳解决方案吗？”（`right solution`）

    *   “我们正确地交付了这个解决方案吗？”（`done right`）


    回答这些问题对于以成本效益的方式交付产品至关重要。虽然传统敏捷经常采用“边看”的方法来同时回答这三个问题（有时是在投入大量工作之后），但以人为本的敏捷的关键要素是：


    *   在整个敏捷过程中使用 HCD 方法来弥补`发现`（discovery）、`构思`（ideation）和`概念验证`（concept validation）方面的空白。

    *   在各个阶段应用 HCD 实践，以确保产品在发布时具有价值。

    *   以人为本的敏捷允许团队计划并执行可能不会被立即使用的 HCD 工作，提供一份`研究路线图`（Research Roadmap）。

    *   以人为本的敏捷将 HCD 的发现引入产品策略，并根据来自用户的最新洞察不断更新策略。

    '
