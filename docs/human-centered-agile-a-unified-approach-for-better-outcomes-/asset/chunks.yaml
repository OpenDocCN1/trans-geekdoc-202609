    If it were easy to apply Agile and HCD practices at the same time, there would
    be no need for this book. It would all just happen. After all, they share a goal
    of delivering a better product to users faster and cheaper, which should make
    them naturally compatible.


    Combining these two practices requires bridging the gap between different mindsets
    as well as trying to provide time and space for their specific activities. There
    are often different expectations about timeframes, planning horizons, what counts
    as key activities, and how and when decisions are best made. What’s more, the
    challenges of integrating these two practices vary based on the size of the teams
    or programs running them. Product complexity and team size impact the required
    approach to integrating the two.


    As Agile and HCD attempt to mingle, a resentful mentality may also develop. Established
    Agile-driven teams might view HCD as an obstacle to or a direct competitor of
    necessary resources, making HCD practitioners feel that they must justify their
    existence as they focus on the early-phase efforts that ultimately prove to be
    very valuable in the long run. HCD teams may feel shortchanged when asked to make
    decisions with little evidence or time.


    It doesn’t have to be this way.


    ## Problem Space vs Solution Space


    > *A problem well-stated is half-solved*.

    >> —Charles Kettering


    Unraveling the difference in approach between Agile and HCD practitioners starts
    with an understanding of the difference between the problem space and the solution
    spaces. This distinction is the crux of much of the practical decision-making
    about how to build new products cheaply and effectively.


    ![Figure 1.1 Right problem, right solution, done right.](Images/Figure1_1.jpg)


    [Figure 1.1](#ch01.xhtml#R_15064-4445_ch001_Figure_001) Right problem, right solution,
    done right.


    The problem space is where teams devote the time and attention needed to understand
    the problem they are trying to solve. This is the entire context of the solution,
    including an understanding of users and what they might need, team capabilities,
    business constraints, expected outcomes, and measures of success in relation to
    both those users and the business.


    By contrast, the solution space is where teams devote the time and attention to
    solving any problem they have defined, making all the decisions about what a feature
    will be and how it will be delivered (see [Figure 1.1](#ch01.xhtml#_15064-4445_ch001_Figure_001)).
    This includes ideation, user story writing, and the analysis of acceptance criteria
    (`AC`) or requirements that will be delivered, as well as sizing, prioritization,
    and execution of development work.


    In thinking about the problem space versus the solution space, it is useful to
    ensure that teams are continuously asking the following three questions, best
    articulated by Jen Cardello, head of UX research and insights at Fidelity Investments:


    * “Are we solving the right problem?” (right problem)

    * “Is this the best solution, given all of our constraints?” (right solution)

    * “Are we delivering this solution correctly?” (done right)


    These questions are instrumental throughout the Human-Centered Agile life cycle.
    It is important to understand that, at any point, it is possible to learn new
    information that requires a team to revisit its original answers to *any* of these
    questions.


    ### Right Problem


    All of a team’s work should solve an existing problem or need for the customer
    using the tool. A key principle from the Agile Manifesto states “Simplicity—the
    art of maximizing the amount of work not done—is essential.”[¹](#fn1)


    Human-Centered Agile recognizes the value of understanding and clearly defining
    the problem to be solved—spending time in the problem space, to create a `problem
    definition` that gives the team a strong foundation. That problem definition needs
    to include user and business goals as well as a clear way to measure whether the
    team is creating successful `outcomes`, not just delivering features.


    ### Right Solution


    There are a variety of ways to solve any problem. Solution ideas can vary wildly
    in feasibility, cost, time to release, and value to the user. As Human-Centered
    Agilists, the goal is to identify the best solution that aligns the users’ needs
    with the business goals of the product being delivered. Some problems can be solved
    with small-scale solutions, while others require larger efforts. Sometimes, the
    best that can be done is to mitigate a problem. Teams often find a strategy that
    blends short-term mitigation/improvement strategies with a long-term vision for
    a better experience.


    It is important to determine that a solution is the right solution and that a
    solution be sustainable. Obviously, business and technical factors are critical
    inputs in this process. So, too, is considering whether a solution satisfies the
    users’ needs and aligns with their goals and expectations. Without regard for
    users, teams run a real risk of developing products that look great to Product
    Owners on a whiteboard but fall flat on release.


    ### Done Right


    Perhaps the HCD work that is easiest to understand and most commonly incorporated
    within the development process belongs to the Done Right step, which validates
    the specific details of the product directly with users. Teams might do some usability
    testing to answer questions like Can they use the product without confusion? and
    Does it deliver on their expectations, both overall and at each step? There are
    any number of ways to elicit direct feedback, such as usability testing, targeted
    piloting and A/B (or multivariate) tests, and surveys.


    ## Agile and HCD Practitioners Within Problem and Solution Space


    Agile teams are used to working in the solution space with a `Product Owner`,
    who acts as the representative for customer needs and attitudes as well as the
    “value maximizer” on the team. It is the Product Owner’s job to make decisions
    about what provides the most end-user value and ensure that the team always works
    on that.


    Agile succeeds because teams build small increments of value as fast as they can.
    Then, upon receipt of user feedback, they iterate that solution until the Product
    Owner switches their focus to something else providing higher value. Ideally,
    this process is both `incremental` and `iterative`, allowing teams to learn together
    as they deliver higher levels of value in small increments. There is also constant
    communication between the Agile team and the Product Owner throughout to improve
    the current and future processes.


    It is important to understand that many Agile teams use the Product Owner as a
    proxy for the end user and have little or no interaction with *actual* end users.
    This creates the risk of delivering work that does not provide value should the
    Product Owner make a wrong decision or misinterpret the users’ needs. This is
    a huge blind spot in Agile product development that Human-Centered Agile seeks
    to address.


    By contrast, HCD practitioners are used to operating in the problem space and
    depend on interaction with end users. Like Agile teams, they seek knowledge about
    the needs of end users and information about how to craft a desirable solution
    to address those needs.


    To achieve this, HCD practitioners have a variety of tools to help identify, refine,
    and catalog the needs and desires of end users before an MVP is ever built and
    evaluated after release. Instead of relying exclusively on the perspective of
    a Product Owner, HCD teams use direct interaction with end users to gain the knowledge
    earlier in the process that Agile teams gain through the creation of an MVP. They
    carry that knowledge into the solution space, where they generate visual representations
    of the solution to demonstrate and validate their understanding, evaluating the
    solution throughout the build and launch processes.

    '
  trans: '


    如果同时应用敏捷开发（Agile）和以人为中心的设计（HCD）很容易，那么就不需要这本书了。这一切自然会发生。毕竟，它们的目标都是以更快、更廉的价格为用户交付更好的产品，这本应该让它们天然地兼容。


    结合这两项实践需要弥合不同思维模式之间的鸿沟，并尝试为它们的特定活动提供时间和空间。人们对于时间跨度、规划周期、什么算关键活动，以及如何以及何时做出决策最为合适，往往有不同的预期。此外，整合这两项实践的挑战根据运行它们的团队或计划规模的大小而异。产品复杂性和团队规模影响了整合两者的所需方法。


    当敏捷开发和 HCD 尝试融合时，也可能产生怨恨情绪。既有的敏捷驱动型团队可能将 HCD 视为障碍或必要资源的直接竞争者，这使得 HCD 从业者觉得他们必须为自己的存在辩护，因为他们关注的是早期工作，而这些工作从长远来看被证明非常有价值。当
    HCD 团队被要求在缺乏证据或时间的情况下做出决策时，可能会觉得吃亏了。


    情况并非如此。


    ## 问题空间 vs 解决方案空间


    > *问题表述清楚，就解决了一半。*

    >> —Charles Kettering


    理解敏捷开发和 HCD 从业者在方法上的差异，从理解问题空间与解决方案之间的区别开始。这种区分是关于如何廉且高效地构建新产品的许多实践决策的核心。


    ![图 1.1 正确的问题，正确的解决方案，正确的执行](img/Figure1_1.jpg)


    图 1.1 正确的问题，正确的解决方案，正确的执行。


    问题空间是团队投入所需的时间注意力来理解他们试图解决的问题的地方。这是解决方案的整个上下文，包括对用户及其可能需求的理解、团队能力、业务限制、预期结果，以及与这些用户和业务相关的成功衡量标准。


    相比之下，解决方案空间是团队投入时间和注意力解决他们所定义的任何问题的地方，对功能将是什么样以及如何交付做出所有决策（参见图 1.1）。这包括构思、用户故事编写以及对将交付的验收标准（`AC`）或需求的分析，以及开发工作的规模估算、优先级排序和执行。


    在思考问题空间与解决方案空间时，确保团队不断提问以下三个问题是有用的，富达（Fidelity Investments）用户研究与洞负责人 Jen Cardello
    对这些问题的表述最为清晰：


    * “我们正在解决的是正确的问题吗？”（正确的问题）

    * “考虑到我们所有的限制条件，这是最佳解决方案吗？”（正确的解决方案）

    * “我们是以正确的方式交付这个解决方案吗？”（正确的执行）


    这些问题在整个以人为中心的敏捷生命周期中起着工具性的。重要的是，在任何时候，都可能学习新信息，导致团队重新审视对这些问题中*任何一个*问题的原始答案。


    ### 正确的问题


    团队的所有工作都应该解决使用工具的客户的现有问题或需求。敏捷宣言中的一个关键原则指出：“简单性——最大化未完成工作的艺术是至关重要的。”¹


    以人为中心的敏捷开发承认理解并清晰定义待解决问题的价值——在问题空间中花费时间创建一个`problem definition`，为团队提供一个坚实的基础。该问题定义需要包含用户和业务目标，以及一种衡量的方法，以衡量团队是否正在创造成功的`outcomes`，而不仅仅是交付功能。


    ### 正确的解决方案


    解决任何问题都有多种方法。解决方案的想法在可行性、成本、发布时间和对用户的价值方面可能差异巨大。作为以人为中心的敏捷实践者，目标是识别出与用户需求以及交付产品的业务目标一致的最佳解决方案。某些问题可以通过小规模解决方案来解决，而另一些则需要更大的努力。有时，能做的最好的只是缓解问题。团队通常会找到一种结合了短期缓解/改进策略与长期良好体验愿景的策略。


    确定一个解决方案是正确的解决方案并且该解决方案是可持续的是非常重要的。显然，业务和技术因素是这一过程中的关键输入。考虑解决方案是否满足了用户需求并与他们的目标和预期一致也是如此。如果不考虑用户，团队面临着真正的风险，即开发出的产品在产品主的白板上看起来很棒，但在发布时一败糊涂。


    ### 正确执行


    最容易理解且最常整合到开发过程中的 HCD 工作属于“正确的执行”步骤，该步骤直接与用户验证产品的具体细节。团队可能会进行一些可用性测试来回答诸这样的问题：他们可以在不困惑的情况下使用产品吗？它在整体和每一步中是否符合他们的预期？有许多方法可以获取直接反馈，例如可用性测试、有针对性的试点和
    A/B（或多元）测试以及问卷。


    ## 问题空间和解决方案空间中的敏捷与 HCD 从业者


    敏捷团队习惯在解决方案空间工作，并有一个 `Product Owner`（产品主），他担任客户需求和态度的代表，以及团队的“价值最大化者”。产品主的职责是对哪些内容能提供最大的终端用户价值做出决策，并确保团队始终致力于这些工作。


    敏捷之所以成功是因为团队能够以最快的速度构建小增量的价值。然后，在收到用户反馈后，他们迭代该解决方案，直到产品主将其转向其他提供更高价值的事物。理想情况下，这个过程既是`incremental`的又是`iterative`的，允许团队在以小增量交付更高层次价值的同时共同学习。整个过程中，敏捷团队与产品主之间也存在不断的沟通，以改进当前和未来的流程。


    重要的是，许多敏捷团队将产品主作为终端用户的代理，并且与*实际*终端用户很少或没有互动。这产生了一个风险：如果产品主做出错误的决策或误解了用户需求，交付的工作可能无法提供价值。这是敏捷产品开发中的巨大盲点，以人为中心的敏捷开发试图解决这个问题。


    相反，HCD 从业者习惯在问题空间中操作，并依赖与终端用户的交互。与敏捷团队一样，他们寻求关于终端用户需求的知识，以及如何设计理想解决方案来解决这些需求的信息。


    为了实现这一点，HCD 从业者有各种工具在构建 MVP 之前识别、精炼和记录终端用户的需求和愿望，并在发布后进行评估。HCD 团队并不完全依赖产品主的视角，而是通过与终端用户的直接交互在流程早期获取敏捷团队通过创建
    MVP 获取的知识。他们将这些知识带入解决方案空间，在那里生成解决方案的视觉表示以展示并验证他们的理解，并在整个构建和启动过程中对解决方案进行评估。


