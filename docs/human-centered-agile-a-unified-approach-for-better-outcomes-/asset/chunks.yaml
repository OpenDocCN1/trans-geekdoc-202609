- raw: 'Multiple Product Owners struggle to keep their visions unified across teams.
    The reason that single teams have one, and only one, Product Owner is because
    they need one unified vision. With multiple teams and multiple Product Owners,
    there are multiple visions. Some Product Owners will have differing views on priorities,
    while others differ on the basic needs of users. Until they align around a common
    mission, misaligned Product Owners will struggle to produce anything of value.
    This is particularly likely to happen when programs grow to a number of teams,
    and it becomes impossible for a single person such as a Product Owner to align
    vision to delivery on every team.


    ### Strategy-Level Stakeholders with Competing Priorities


    In addition to having Product Owners with competing visions at a product delivery
    level, large programs can also experience the challenge of multiple executive-level
    stakeholders expressing competing strategic priorities during the product delivery
    process. When this happens, work gets redirected regularly (sometimes toward work
    that is not well defined), and teams can feel that their work is undervalued.
    When teams cannot identify and understand the strategic value of their work, churn,
    and low morale build.


    #### Too Many Backlogs to Effectively Coordinate


    Competing Product Owners usually have different ideas about best solutions and
    their relative priority, yielding competing backlogs. Teams will struggle without
    a way to coordinate their backlogs because keeping them separate results in duplicative
    work, product inconsistencies, or code conflicts. Furthermore, natural ups and
    downs of velocity can create situations where teams without a deep backlog of
    ready stories or with dependencies on other teams can become idle, while other
    teams are overtasked. Meetings that previously helped teams see and respond to
    each other’s progress become challenging with more participants, and teams are
    left with no mechanism to resolve dependencies.


    While teams are busy figuring out how to share a common backlog, identify and
    resolve dependencies between teams, and best organize themselves, other types
    of problems arise.


    #### Teams Grow to Inefficient Size


    Realizing these dysfunctions, teams try to solve the problem by increasing team
    size. This could be an attempt to keep the number of Agile teams manageable or,
    perhaps, just to get more production out of an already-productive team. False
    reasoning determines that if a 10-person team is good, a 20- or 30-person team
    must be better. Agile calls for small teams, 10 or fewer members, for very specific
    reasons. Research indicates that the optimal team size is much smaller, closer
    to 4.8.[^(18)](#fn18)


    Smaller teams are more successful because they can communicate and learn better
    and faster than larger teams. The larger the team, the more potential lines of
    communication there are, leading to slower and less efficient communications with
    an increased probability of a message missing someone or changing, like in the
    children’s game “telephone.” Learning slows as does Agility.


    #### Multiple Scrum Masters Need Coordination


    Not to be left out of the groups whose needs have changed with the scale of the
    program are Scrum Masters. They struggle with a mechanism to keep them all informed
    about issues from other teams as well as a way for them to escalate impediments
    that neither they nor the team can remove themselves. Some teams have two-week
    sprints while others have one-week sprints. Some teams start their sprints on
    Wednesday while others start theirs on Monday. Some Agile teams don’t use Scrum
    at all, using Kanban instead, an iteration-less framework without a delivery timebox
    but whose work still must be planned and integrated. It’s chaos.


    #### A “Hole” in Technical Leadership Becomes Apparent


    Developers struggle with maintaining coding standards across teams and even about
    which technologies to use. It’s easy to imagine a situation in which some teams
    would choose Java and others C#, for example. Either technology works, would solve
    the problem, and has its pros and cons, but there’s no way for uncoordinated teams
    to agree on which is best for the program as a whole. Furthermore, teams at scale
    need to have infrastructure (automated tools, test environments, HCD research)
    coordinated and delivered just in time, or they will have to wait for it. In larger
    programs, there are also often unique security and audit requirements that must
    be documented and met. As programs scale, a technical void that wasn’t present
    in single teams becomes apparent.


    #### Where’s the Boss?


    Larger programs also bring higher stakes. As the stakes for the organization increase,
    programs garner more attention from the senior stakeholders and Executives ultimately
    responsible for the success of the program. Without established standards, they
    will likely receive differing answers to questions and find a lack of coordinated
    vision among teams. Upon closer inspection, they may find that teams cannot even
    agree on delivery schedules. In these situations, senior stakeholders need a way
    to get visibility into and control of what is being built by these many teams
    to coordinate their vision and activities.


    Larger programs need a way to:


    *   Scale their Agile teams into a *team of Agile teams*, integrating the total
    effort into larger, overarching units of user value on a longer time horizon than
    a two-week sprint.


    *   Plan near-term and roadmap future work that has enough flexibility to allow
    teams to pivot when necessary.


    *   Synchronize schedules to plan and define a delivery cadence that lets them
    learn together, as well as a mechanism to communicate new learning across the
    many teams.


    *   Look for improvement and innovation opportunities beyond the team level, including
    this new team of team level.


    *   Align their technical members to a common vision around technologies, architectures,
    and norms.


    *   Manage larger programs and budgets by using robust “Enterprise resource planning”
    mechanisms.


    Individual teams would still like to continue using Scrum and/or Kanban, but more
    is needed to address these gaps. Unfortunately, despite some process additions
    such as Scrum of Scrums, the frameworks that are successful when dealing with
    single teams or small clusters of teams fall short when scaling.


    The solution is a framework that specifically addresses these problems while allowing
    individual teams the freedom and creativity needed to be successful. There are
    more *scaling frameworks* than there are single-team frameworks, so organizations
    have plenty of options. Just as frameworks like Scrum, XP, and Kanban provide
    ways for single teams to apply the Agile mindset, scaling frameworks allow teams
    of teams to apply the Agile mindset while solving the problems previously identified
    as well as a range of other issues that arise at scale.


    Popular scaling frameworks include SAFe^®, Scrum of Scrums, Scrum@Scale, Disciplined
    Agile, and Large-Scale Scrum (LeSS). The SAFe framework will be used throughout
    this book when talking about scaling. While other scaling frameworks will not
    be detailed individually, the mindset and concepts described will be applicable
    to all. In the next chapters, these problems are mapped onto the key roles and
    constructs in SAFe that solve them. Then, the SAFe workflow is examined with an
    emphasis on how HCD practitioners can add value across the entire SAFe product
    development life cycle.


    ## Why Are Scaling Frameworks Needed?


    As programs scale, they start to encounter problems they didn’t have (or didn’t
    notice) when they were smaller. In brief, these are


    *   a way to align many teams to a common vision.


    *   a way to identify and manage dependencies between teams.


    *   a way to plan and manage key support activities that are required by all (or
    many) teams.


    *   a way to ensure the quality of delivery across a much wider set of teams and
    work.'
