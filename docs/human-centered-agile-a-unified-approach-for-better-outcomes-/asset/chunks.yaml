  trans: "\n\n* Mike Torppey 和 Bernardo Gonzales；没有他们的远见和坚持，第一个“以人为中心的敏捷项目”就不会发生。\n\
    * 感谢我们的优先读者的投入、关注和极佳的反。如果没有你们，这本书将大不相同：Ann Aly, Sree Bhandaram, Michael Brown,\
    \ Catherine Cartwright, Bella Jones, Anneliese LaTempa, Doug Martin, Diane McCann,\
    \ Paul McInerny, Jeff Nichols, Amelia Shuler, James Sperry, David Tilghman 以及\
    \ Michael Williams。\n\n# 关于作者\n\n`Joe Montalbano` 是一位管理顾问、企业敏捷教练和业务敏捷性专家，拥有超过\
    \ 20 本的经验，主要从事大型软件开发环境。他成功领导了多个大规模的敏捷转型，并利用大量的岸、离岸、分布式和虚拟开发团队管理了数十项软件开发工作。他在整个\
    \ Microsoft 技术栈方面也拥有丰富的实战技能。\n\n`Joe` 是一位热情的教练、老师和协调师。他持有 `CSP`、`SPC`、`KMP`、`PMI-ACP`、`PMP`\
    \ 等认证，是 `SAFe` 贡献者。他是亚马逊畅销书*Agile Almanac Book 2: Programs with Multi- and Virtual\
    \ Team Environments* 的合作者，拥有约翰霍普金斯大学的 MBA 学位。他还是狂热的野生动物摄影师，也是一名业余无线电操作员。这是他的第二本书。\n\
    \n`Brad Lehman` 从前端编码员起步，当时他的女朋友（现在的妻子）教他 `HTML`，以便他为他的唱片公司创建一个网站（“建议使用 Netscape\
    \ 3.0 或更高版本查看！”）。不久后，他成为了“单人设计团队”，自 2010 年以来一直与敏捷团队和项目合作。他还是一个丈夫、父亲、设计教练、社区电台\
    \ DJ 以及狂热的咖啡烘焙师和咖啡爱好者。\n\n# 引言——本书的结构\n\n本书的目标是帮助读者将以人为中心的设计（`HCD`）实践整合到敏捷中，这种方式可以扩展敏捷思维，支持团队工作，并让他们更快、低风险地学习并交付真正价值的产品。我们将内容分为六部分，以便你轻松地找到对你最有价值的内容。\n\
    \n## 第一部分——介绍以人为中心的敏捷\n\n* **第 1 章**：什么是以人为中心的敏捷？为什么需要它？\n  本章介绍了什么是以人为中心的敏捷以及我们我们认为它非常重要。`Part\
    \ I` 阐述了以人为中心的敏捷的基础，并开始让读者以“以人为中心的敏捷”的思维进行思考。本章还探讨了为什么 `HCD` 与敏捷的结合是一项挑战，并提出了一个对齐这两种思维的框架。\n\
    \n## 第二部分——理解恰好且足够的 HCD\n\n* **第 2 章**：以人为中心的设计入门\n* **第 3 章**：从发现到概念验证的 `HCD`\
    \ 活动与产物\n* **第 4 章**：从精炼到评估的 `HCD` 活动与产物\n\n这部分为需要这些知识的人提供了 `HCD` 介绍。它介绍了设计过程的各个阶段，并深入探讨了构成这些阶段每个阶段\
    \ `HCD` 工作的活动和产物。本节为读者提供了应该引入到其敏捷项目中的 `HCD` 活动和产物的“是什么”以及“为什么”。\n\n## 第三部分——多少以及何时？在敏捷中规划和执行\
    \ HCD\n\n* **第 5 章**：将以人为中心的设计引入敏捷\n* **第 6 章**：“风险是什么？”\n* **第 7 章**：在敏捷中规划和开展\
    \ `HCD` 活动\n\n这部分试图消除误导性的观点，即 `HCD` “会拖慢你的速度”以及“我们试图看到每一个角落”（或“煮海水”；选一个你喜欢的比喻）。以人为中心的敏捷并没有规定每项工作都需要执行每一个研究步骤。相反，以人为中心的敏捷将研究工作与交付解决方案的预期影响和风险对齐，并在每一步都有特定的学习目标。这些章节描述了如何做到。\n\
    \n## 第四部分——更大的项目，不同的需求\n\n* **第 8 章**：在敏捷中管理分布式设计工作\n* **第 9 章**：在敏捷中管理分布式研究工作\n\
    * **第 10 章**：扩展到小型敏捷团队小组\n\n随着项目规模和风险的增长，其研究和设计也需要相应增长。这种增长意味着项目层面的协调和运作，而不仅仅是团队层面。这部分对于处于这一阶段的读者很有用。\n\
    \n## 第五部分——最大的项目，以人为中心\n\n* **第 11 章**：`SAFe` 简介\n* **第 12 章**：更新 `SAFe`\n* **第\
    \ 13 章**：`SAFe` 结构\n* **第 14 章**：大规模交付\n\n## 第六部分——衡量和应用以人为中心\n\n* **第 15 章**：衡量衡量\n\
    * **第 16 章**：以人为中心的敏捷应用\n\n"
