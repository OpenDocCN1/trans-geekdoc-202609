- raw: 'Much of the terminology SAFe^® uses to manage work (epics, features, and stories)
    will be familiar to anyone who has worked in an Agile environment before. SAFe
    also has designated “enabler” work, which is work designed to support the team-building
    features.[^(31)](#fn31)


    Even though the terms are familiar, it is worth taking the time to understand
    what they mean, specifically within the SAFe^® context.


    ### Epics


    Epics[^(32)](#fn32)


    As with any Agile MVP, the team strives to build a small, inexpensive piece of
    usable functionality that tests their approach and outcome so the benefit hypothesis
    can be evaluated and a pivot or persevere decision made. Teams frequently build
    multiple lightweight prototypes to get feedback and reduce cost and risk before
    committing to an approach to building their solution. MVP evaluation, using the
    Lean business case and benefit hypothesis, is an application of the Lean start-up
    cycle discussed in [Chapter 3](#ch03.xhtml#_15064-4445_ch003).


    It should be considered a *success* even if the approach taken *doesn’t* prove
    the benefit hypothesis because a minimal amount of time and money has been spent.
    Learning which solutions don’t work early on is a win because it prevents bad
    investments of time and money and allows alternative methods to be tried sooner.


    ### Features


    Epics are decomposed into features,[^(33)](#fn33)


    Features, like epics, have a benefit hypothesis, which helps teams focus on intended
    outcomes, reflect on the value being delivered, and determine whether a particular
    solution is really delivering as intended. Also like an epic, the feature’s benefit
    hypothesis helps teams “pivot without mercy or guilt”[^(34)](#fn34)


    ### Stories


    Stories[^(35)](#fn35)


    ### Enabler Work


    SAFe^® recognizes that not all work is user work. SAFe calls non-user work-enabler[^(36)](#fn36)


    In order to accommodate this type of work across the program, SAFe^® has created
    a planning and backlog tool, called an Architectural Runway. It should be noted
    that HCD work is a part of the exploration enablers in this backlog. The intersection
    of the SAFe Architectural Runway and a Research Roadmap are discussed in [Chapter
    14](#ch14.xhtml#_15064-4445_ch014).


    ### The Program Backlog


    The program backlog comprises the features (not stories) to be delivered by the
    ART and is owned by the Product Manager, who has the responsibility for prioritizing
    and accepting these features (just as a Product Owner prioritizes the stories
    at the team level).[^(37)](#fn37)


    ## New Planning and Delivery Timebox in SAFe^®


    An advantage of SAFe^® is its flexibility regarding how long work takes. At a
    certain size, programs inevitably start considering larger work and, therefore,
    must operate on longer timeframes than a two-week sprint. This does not make it
    any less Agile. Having a deeper view of the program’s backlog does not mean teams
    are suddenly responsible for delivering big books of exhaustive requirements covering
    12 weeks’ worth of work (typically, the stories in later sprints are still being
    written and reviewed). It just means that the epics have enough complexity that
    the window for coordinating effort is longer. Teams still learn and adapt as they
    go and have the flexibility and responsibility for planning and implementing their
    work. For Human-Centered Agile, it means that teams should have enough lead time
    to plan, conduct, and synthesize research activities in a way that informs decisions
    and improves the delivered product. This longer timebox helps them plan that work.


    ### The Planning Interval (PI)


    To accommodate work that is more complex and requires a longer runway, SAFe^®
    uses a longer timebox planning interval, or PI[^(38)](#fn38)


    ## New Processes at Scale


    Along with more teams, larger units of work, and a longer timebox in which to
    deliver comes some additional processes designed to keep teams aligned, manage
    dependencies, and improve the process.


    ### Planning Interval (PI) Planning


    In SAFe^®, the entire ART gets together (in person, if possible) for two days
    at the end of each PI to identify risks and dependencies and plan their work for
    the next PI, a seminal (and fun!) event in SAFe known as planning interval planning
    (PI planning).[^(41)](#fn41)


    PI planning must be a structured event because there are so many people involved,
    and they all have to be aligned to a common strategy, vision, and architecture.
    Every team is asked to make sure it has clearly articulated objectives covering
    the duration of the PI that reflect and support the overall vision. During the
    PI planning process, teams can see and discuss the objectives and work of other
    teams and perform exercises specifically to identify dependencies and evaluate
    expected value from solving the problems each team is tackling.


    These events usually start with Executives, Product Managers, and System Architects
    aligning the teams around a common vision of why, what, and how they will be building
    (in that order). The Executive explains the strategy, how the work to be planned
    is aligned with that strategy, and why it is important. The Product Manager explains
    the top features prioritized for the PI, what value they deliver for users, and
    what the benefit hypothesis and acceptance criteria are. The System Architect
    goes last and aligns groups on the technologies to be used, norms for technology
    usage, and any other technical practices necessary to keep teams aligned to a
    common technical vision. An Experience Architect may present experiment results
    or user insight gathered over the last PI, the current evaluative approach, and
    any new approaches to the overall experience directions to be considered, paying
    special attention to pivots in strategy made as a result of this insight.


    After these briefings, teams go into their own areas (usually with easel pads
    or, better yet, walls of easel pads) for breakout sessions, decomposing the prioritized
    features, identifying risks and dependencies with other teams, and developing
    a high-level plan for the work. The teams summarize their goals as a set of objectives
    written in business language that is then approved and assigned business value
    by the Business Owners. Teams commit to these objectives for the upcoming PI,
    but they will not commit to stories for each sprint in the PI, retaining the freedom
    to do sprint planning every two weeks while taking learning into account at each
    sprint. Teams present their plans so they are transparent to all and identify
    and review risks so the program can do a confidence vote before adjourning to
    ensure all teams are confident in their ability to deliver on the plan.


    HCD practitioners should float from team to team, listening to and observing what
    is being planned for assumptions and anything else that is disconnected from the
    sentiment of the end user.


    ### The Product Owner Sync


    Maintaining alignment with the vision among the many Product Owners[^(42)](#fn42)


    In SAFe,^® the roles of the Product Manager and the Product Owner are separate
    and distinct. Product Managers work at the ART level and are responsible for features,
    sets of work so large that they require the entire ART up to a PI to complete.
    Product Owners, however, work with individual Agile teams and are responsible
    for stories, a much smaller unit of work that a single team can complete in one
    iteration. The Product Owner sync or “PO sync” meeting is held to gain visibility
    into the ART’s progress toward achieving its objectives and align the Product
    Manager’s vision with that of individual Product Owners (this meeting is sometimes
    combined with the Scrum of Scrums meeting and called an “ART sync”). Features
    are often broken down into stories that are spread across many teams, so it is
    important to have this forum to ensure alignment, especially as learning happens
    and plans change.'
