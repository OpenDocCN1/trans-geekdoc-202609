    Not all types of work that take place ahead of implementation have the same stakeholders
    or effort level. Visual design may or may not require coordination with other
    stakeholders, such as creative teams or brand managers that provide feedback or
    approval. The life cycle and workflow of content creation can be notoriously difficult,
    with a variety of stakeholders weighing in (legal departments, marketing teams,
    etc.). Dependencies that have a separate workflow and approval process are notorious
    for tripping up teams that wait until they are nearing release to make sure that
    these needs are met.


    Additionally, marketing or communications often requires parallel work so products
    are launched with proper marketing and customer support. When planning release
    work, each may warrant a separate roadmap and backlog for tracking work in progress.


    ## HCD within Agile Events


    In addition to planning and executing HCD-specific stories, it is helpful to think
    about what an HCD practitioner’s role is during typical Agile events. While HCD
    practitioners are equal participants no different than any other, they are specifically
    tasked with representing the users’ interests more directly than other roles are.
    Because of this, they are likely to have different sorts of questions and input
    than other team members.


    ### HCD at Sprint Planning: Asking Questions to Adjust Focus


    Too often at sprint or iteration planning, the “ready, fire, aim” pattern is executed,
    even by mature teams. Having an HCD practitioner participate in both sprint planning
    and its companion event, backlog refinement, is helpful because they ask thought-provoking
    questions, like:


    * Has the team probed the user to find out why they want this and discover if
    there are latent needs?

    * What would happen if the team solved the users’ problem in a different way?
    Has the team considered multiple solution approaches and evaluated them for cost,
    flexibility, and desirability?

    * How can the team set up an inexpensive Minimum Viable Product that can be built
    quickly, then validate with actual end users that this solution is acceptable
    before further investment is made?

    * Is the team sure their proposed solution follows the patterns that already exist
    in the product and won’t confuse users?

    * Has the team created a visualization of the solution to ensure that Product
    Owners and the delivery team truly have the same outcome in mind?

    * Has the team identified that the solution uses best design practices (e.g.,
    error handling, interaction feedback, clear visual hierarchy, etc.)?

    * Has the team created an evaluation plan that maps back to user sentiment or
    user behaviors? (Too often, feature delivery is the yardstick for success, without
    regard for outcomes.)


    ### HCD at Story Generation and Story Refinement


    The typical role for HCD at story refinement is like their role in sprint planning
    but with a longer timeframe and more strategic view. HCD practitioners can add
    value during story refinement precisely because the items being considered during
    this meeting won’t be in scope for at least another sprint. HCD practitioners
    have time to gather and apply insight to these items and get them “ready” before
    the next sprint planning session.


    ### Sprint Review: Receiving Incremental Feedback


    While some teams use this opportunity to provide meaningful feedback, the sprint
    review is often something of a ceremonial effort—work that has already been agreed
    to and seen by the Product Owner is being triumphantly rolled out to a wider stakeholder
    set. Progress and burn-down charts are reviewed. Sometimes there’s no mention
    of what’s next on the roadmap. This isn’t how it is supposed to be.


    The sprint review is a fantastic opportunity to hear from critical stakeholders
    about the experience. If they are encouraged to ask questions or report experiences,
    HCD practitioners might help elicit further insights to incorporate into future
    iterations, become part of the persona/scenario documentation, or simply strengthen
    relationships that facilitate access to users. An “open conversation”–style sprint
    review is also likely to build stakeholder confidence in the product being built,
    as design decisions and trade-offs can be negotiated.


    ### Sprint Retrospective: Supporting Process Improvement


    The sprint retrospective is another area of the Agile process that meshes well
    with HCDs.


    ## IV: Larger Programs, Different Needs


    ## Chapter 8: Managing Distributed Design Efforts in Agile


    DOI: `[10.4324/9781003188520-12](https://doi.org/10.4324/9781003188520-12)`


    As teams and programs grow into multiple teams and then into scaled operations,
    new needs and complexities enter the picture. The first natural phase of growth
    within a program is to go from a single team to a few small teams that work together.
    If the work is broken up so these teams are truly independent, scaling HCD looks
    like planning and incorporating HCD activities using a `Research Roadmap`, with
    a review of HCD work to evaluate stakes. That is to say, when teams are working
    on products that aren’t dependent on one another or the dependencies are limited
    enough to handle informally, they can continue working independently; they will
    each own a `product roadmap`, a `Research Roadmap` that captures the supporting
    HCD efforts, and their own design and research standards specific to their work.


    As teams start to work in common product ecosystems or solutions, they must update
    their approach. This becomes particularly apparent if they experience problems
    with the design consistency of products and solutions that are delivered by different
    teams. In digital products, this usually takes several forms: inconsistent fonts,
    graphics, or copy style from one screen to another; varying interaction design,
    which leads to multiple ways of completing basic tasks (such as entering addresses
    uniformly), or confusing delivery of feedback and error messages. This can even
    result in situations where users are unsure whether they are within a single experience.
    Less drastic inconsistencies can lead users to question product credibility or
    can require extra learning time with new features.


    HCD Practitioners working on different teams need a way for their work to be consistent.
    If products are related, design choices should reflect that and the only way to
    achieve that is through the active orchestration of these teams. In practice,
    this can range from the guidance that teams may deviate from based on their own
    judgment to much more rigid governance that requires centralized design approval.

