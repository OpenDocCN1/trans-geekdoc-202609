    # V


    # 最大规模项目：以人为中心的敏捷与 SAFe^®


    # 第 11 章 SAFe^® 简介


    DOI: [10.4324/9781003188520-16](https://doi.org/10.4324/9781003188520-16)


    有很多扩展框架可以选择，但最常用的是扩展敏捷框架^®（Scaled Agile Framework^®），简称 `SAFe®`。


    例如，`SAFe®` 明确地提出并重视`以客户为中心`，


    本章重点关注：

    *   理解 `SAFe®` 如何帮助确定哪些是正确的工作（“正确的问题”）

    *   如何生成和验证解决方案（“正确的解决方案”），以及如何交付这些价值


    ## 什么是 SAFe®？


    `SAFe®` 是一个扩展 Scrum 和看板的框架，它允许多个团队团队（甚至是“团队的团队的团队”）共同协调、计划、交付、学习和改进。`SAFe` 是一个经过验证的扩展敏捷实践库，基于十项原则、七项能力、四个核心价值观以及许多旨在扩展和整合精益、敏捷、DevOps……以及现在的
    HCD（以人为中心的设计）。


    **核心价值观——****`SAFe®` 包含了四个核心价值观


    理解“内置质量”而不仅仅是质量非常重要。其理念是：在大规模范围内快速前进并成功的唯一方法，是确保团队在推进过程中没有缺陷并交付用户价值。无论他们做多少测试，也无法在一个糟糕的解决方案中测试出高质量。团队能够快速进行并保持高质量的唯一方法，是确保质量从第一次就融入到流程的每一个步骤中。这意味着要在解决方案验证上花时间，以确保解决方案是“正确的”。如果团队必须停止新工作去回头修复之前“已完成”工作中的问题，那么他们在新工作的进展上将一直挣扎，因此质量必须在执行过程中构建到一切中。`SAFe`
    中没有所谓的修复 Bug 的“硬化冲刺（hardening sprint）”。团队可以通过采用“完成定义”（definition of done）来确保他们交付的是可生产的解决方案。


    对于以人为中心的敏捷人士来说，结论是：这四个核心价值观应该指导团队层面、扩展的“团队团队”层面以及企业层面发生的一切事情。这些核心价值观为团队提供了心态和理由，去进行必要的
    HCD 工作（以及相关学习），以构建质量、保持透明并按照最高标准执行。当团队思考他们的流程或考虑对流程进行更改或实验时，他们应该考虑这如何支持这四个核心价值观。任何削弱或与这四个价值观中的任何一个不匹配的流程更改都应该被重新考虑。


    ### SAFe® 原则


    与敏捷一样，`SAFe®` 构建在原则之上，成功的团队在自定义其 `SAFe` 实现时会综合这些原则。这些原则建立在四个价值观的基础之上，旨在指导团队的实践。团队在回顾会议中经常回溯这些原则，以确保他们的实践与之一致。这十项原则是：


    1.  采取经济视角。

    2.  应用系统思维。

    3.  假设可变性并保留选择。

    4.  通过快速、集成的学习周期进行增量式构建。

    5.  基于对运行系统的客观评估设定里程碑。

    6.  让价值在不受干扰的情况下流动。

    7.  应用节奏并与跨领域规划保持同步。

    8.  释放知识工作者的内在动力。

    9.  决策去中心化。

    10. 围绕价值组织。


    任何扩展框架都无法在不进行至少某些自定义的情况下直接作为清单来实施。每个项目和组织都有其独特的约束和需求，必须得到解决。这些原则的目的是使这四个价值观具有可操作性，并在团队修改流程时提供一个可以遵循的指南针。团队应该关注这些原则而非敏捷实践，并将这些原则视为框架的“为什么”。


    ### 能力


    `SAFe®` 识别了七项核心能力（技能领域），最成功的企业在这些领域脱颖而出。如图 11.1 所示，`SAFe` 将这些能力描述为“理解和实施 `SAFe`
    的主要视角”。


    ![图 11.1 七项 SAFe® 能力以及每项的三个子维度](img/Figure11_1.jpg)


    图 11.1 七项 SAFe® 能力以及每项的三个子维度。


    将这些能力视为框架的“如何做”。


    ### 实践


    `SAFe®` 实践包括新的角色和新的仪式，以帮助团队在大范围内对齐、协调和交付价值。接下来的几章将详细介绍对 HCD 从业者重要的关键实践，并说明 HCD
    和敏捷如何共同扩展，从而形成一种比单独使用 HCD 或敏捷更强大的工作方式。


    `SAFe®` 网站可以在 `www.scaledagileframework.com` 找到。对于对进一步探索感兴趣的读者来说，这是一个丰富的信息源，`SAFe
    大图` 上的每个文字和图像都是点击链接，将引导读者进入相关信息。同样，本章中的脚注也会引导读者进入相应的 `SAFe` 文章。正如敏捷人士所期待，在 `https://community.scaledagile.com`
    还有一个虚拟实践社区。


    ## 四种 SAFe 配置


    像 `SAFe` 这样的扩展框架带有大量的开销——它们包含了新的角色、活动和实践。为了确保项目包含其独特需求所需的最小且足够的开销，`SAFe` 有四种尺寸。这些尺寸被称为配置，可以被认为
    T 码一样的小、中、加大。随着尺寸的增加，新角色、流程和实践的数量也之增加。`SAFe` 项目应该使用满足其需求的最小配置。


    将 HCD 整合到扩展流程中的基本概念适用于所有四个配置。关于这一点有两点需要理解：第一，即使“在大范围内”，不同的规模也有不同的需求；第二，之前章节中描述的所有
    HCD 工作都适用于任何规模。没有理由认为任何项目会“大到”无法纳入这项工作。


    四种 `SAFe` 配置分别是：


    *   基础 SAFe (Essential SAFe)

    *   大型解决方案 SAFe (Large Solution SAFe)

    *   组合 SAFe (The Portfolio SAFe)

    *   最后全 SAFe (Full SAFe)


    '
