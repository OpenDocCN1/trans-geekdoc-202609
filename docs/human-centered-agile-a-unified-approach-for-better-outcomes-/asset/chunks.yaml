- raw: 'In software design, this may take place as a workshop or other collaborative
    exercise or as an asynchronous design activity where designs are reviewed by stakeholders.
    In this context, typical ideation deliverables include whiteboard diagrams or
    wireframes, user and screen flows, and so on. The team then evaluates these concepts
    for general feasibility and level of effort as part of deciding which solutions
    can move into the next step (concept validation).


    Ideation can present a unique challenge for Designers on Agile teams as the design
    step often gets compressed into a single sprint, taking on the manner of “*****satisficing*****”—that
    is, the first solution that sounds good enough is the one that gets tried, with
    little time to explore alternatives. Often, work begins as a specific solution
    demanded from a Product Owner with no lateral thinking at all. In Human-Centered
    Agile, teams identify candidate solutions and apply user feedback as a factor
    toward selecting the best approach(es).


    The output of ideation should be a small number of solution concepts, typically
    in an early (“low-fidelity”) form. The team brings these concepts forward into
    concept validation to gain user feedback to determine which solution (if any)
    is successful and reflects the best approach for users.


    ### ***Concept Validation***


    Concept validation ensures that users are included in the determination of whether
    a solution is worth delivering. Concept validation is perhaps the trickiest step
    to incorporate into Agile, where the “build it and see” philosophy demands a “Minimum
    Viable Product,” or MVP. The usual practice is to assume that this means writing
    code. The philosophy of producing an MVP and seeking feedback from users is no
    different in Human-Centered Agile. However, in order to provide an MVP that is
    as lightweight as possible and still validates the team is building the right
    kind of solution, Human-Centered Agile recognizes that other kinds of prototypes
    and feedback gathering may work faster and cost less than code-based MVPs. For
    concept validation, even early *****nonfunctional prototypes***** (such as “click-through”
    static prototypes, wireframes, or even paper illustrations) are appropriate, as
    long as the user can clearly understand what they represent.


    The output of concept validation is a decision to move forward with an intended
    solution; a specific “*****pivot or persevere*****” decision, using evidence,
    before investment becomes too great. In concert with a lateral thinking approach
    during ideation, this limits the risk of over-engineered solutions and of building
    expensive but unwanted “champion-driven” features.


    ### ***The Delivery Cycle***


    The next three phases (refinement, development, and solution validation) are best
    understood as a cycle. In this cycle, *****refinement***** will be a familiar
    step for Agilists and includes story writing and estimation. Human-Centered Agile
    recommends that refinement includes a visual reference point (such as a wireframe
    or mockup) so that there is truly a shared understanding of what is being delivered.
    *****Development*****, as a phase, requires a slightly more expansive definition
    than is often recognized—building non-code prototypes that articulate interaction
    design and information architecture and that can be tested, falls into this category.
    *****Solution validation***** is the testing of a developed product (code or otherwise)
    with users.


    The output of refinement is a set of actionable stories for developers or Designers
    to produce a testable product, which may be iterated upon further or released.


    #### Refinement


    Refinement ensures that the entire team has a shared understanding of what is
    going to be delivered. The refinement step begins when there is a clear enough
    agreed concept of what is to be developed that story writing can begin. Refinement,
    covering the time from story generation through story acceptance, is a familiar
    step for most Agilists already. In Human-Centered Agile, refinement typically
    includes a visual representation of the intended product. This ensures a shared
    understanding and provides the team with an opportunity to discuss assumptions
    and risks and uncover previously hidden considerations. Refinement also includes
    the identification of specific success measurements that can be used to evaluate
    how well a feature has solved the problem for users that was identified during
    discovery.


    The output of refinement is a set of actionable stories for developers or Designers
    to produce a testable product, which may be iterated upon further or released.


    #### Development


    Development creates a product that can be tested or released. Development means
    any work to get to a testable product; in Human-Centered Agile, this may mean
    more refined designs, nonfunctional prototypes, and other models of the delivered
    product, with the purpose of learning in the fastest and least expensive way.


    Even during code development, accepted stories and designs aren’t always delivered
    exactly as intended. During development, technical assumptions get overturned,
    new exceptions are found, and teams learn that their acceptance criteria weren’t
    perfect and may require a design update. Because this results in changes to what
    is delivered, it is crucial for Designers to remain available and engaged throughout
    delivery, so designs are updated while keeping the initial design goals and user
    outcomes in mind rather than focusing solely on technical expedience.


    The output of development is a testable product.


    #### Solution Validation


    Solution validation is the work that a team does to make sure that the chosen
    solution is succeeding for users (“done right”). Solution validation can be done
    with code prior to release, or with prototypes that are at a high enough fidelity
    for usability testing. The team is gathering user feedback that is intended to
    highlight trouble spots and confusing experiences so that they can identify clear
    improvements to be made.


    The output of solution validation is a set of bugs and improvements that are prioritized
    and, where necessary, addressed before product release.


    #### Evaluation


    Evaluation is the work that a team does to make sure that a released product is
    succeeding for users (“done right”). A common misconception about design thinking
    is that the process ends either at “deliver” or “test.” The inference is that
    the design process is over when the thing is built and released. **Launch/release
    is not where the design process ends.**


    No matter the rigor of testing and validation that has preceded a launch, there
    will be unpredicted outcomes. Users will have unexpected responses that create
    challenges. Some will be technical in nature, others will involve tool comprehension,
    feature findability/discoverability, or even just unanticipated responses to a
    product’s aesthetic qualities. A product in the wild always performs differently
    than when it was validated in a controlled environment.


    Actual users’ post-release experiences determine the success or failure of the
    release. Understanding those experiences is critical to providing the insight
    needed to guide strategic investment in the product portfolio properly. Human-Centered
    Agile recognizes that getting this right requires understanding user attitudes
    and sentiment toward the team’s products and their experience, not just measuring
    specific business-value metrics that often represent lagging indicators of value
    delivered.


    The output of evaluation is an understanding of how your product is bringing value
    to users and, where it is lacking, to inform future product strategy.


    ## Human-Centered vs. User-Centered … What’s the Difference?'
