  trans: '


    - **印象测试（Impression Tests）：** 向用户展示关键交互点（如首页）的表示形式，并询问他们对所见内容的目的和行为的理解。这有助于团队了解到达体验对用户来说是否清晰，以及用户是否对后续步骤和预期价值有清晰的认知。后者用于收集对团队正在交付的预期价值的态度反馈。

    - **转述测试（Paraphrase Tests）：** 要求用户用自己的话转述他们对该体验所提供内容的理解。这种测试针对所使用的语言，无论是作为内容或导航的标签，还是作为用户需要理解的解释和描述。

    - **卡片分类（Card Sorting）：** 要求用户以与其自身相关的方式组织信息。根据具体方法，这可能还包括添加他们预期的内容类型并为内容组命名。这种方法对于理解用户对复杂内容结构或交互集的心理模型特别有用。

    - **任务完成测试（Task Completion Tests）：** 向用户展示解决方案的端到端表示形式，并要求其完成某些非常具体的任务。这种方法用于观察他们从开始到结束的顺畅程度。在概念验证期间，这种方法旨在理解预期的体验与用户所需的结果之间是否存在良好的匹配度。

    - **功能排序（Feature Ranking）：** 要求用户对产品交付的多个潜在解决方案进行排序。这种方法有助于理解和验证用户对特定功能的兴趣，特别是为了确定优先顺序的目的。这种方法还可以揭示提议功能中的风险点（red
    flags）。


    准备上述任何一项工作都将包括识别用于测试的工具、生成测试脚本，以及规划一种适用于结果受众的报告方法论。


    ### 招募研究参与者


    招募不应被低估，它是任何研究工作中最为繁重的任务之一。团队需要识别合适的参与者特征（例如，创建面向首次用户的团队将不会希望与经验丰富的用户进行测试）。


    对于引导式测试（moderated tests），需要联系这些候选人、安排时间并授予他们对使用的任何测试平台的权限，这些都需要考虑在内。有些组织会有专门的研究运营团队来处理这项工作；对于没有此类团队的组织，这一步不应被视为理所当然。最后，任何安排会议的人都需要记住，引导和记录员需要时间在会议之前进行准备，并在会议之后花时间整理笔记。


    ### 执行研究工作


    开展研究工作可能意味着设置异步测试，在这种情况下，这一步所需的工作很少；监控参与情况；以及在参与者有问题或困难时提供支持。如果研究工作包括与用户进行的任何引导式或面对面的互动，将花费更多时间。在这一步，不仅包含以人为中心的设计（HCD）从业者是有益的——当其他团队成员担任记录员和观察者时，他们的参与也强化了创造良好结果是团队责任的观点，而且洞察会在整个团队中产生共鸣。


    ### 综合研究发现


    最后，收集和分析结果是一项耗时的工作；原始结果可能很有趣，但如果不经过分析，对大多数利益相关者来说并没有用处。执行此工作的 HCD 从业者需要知道预期的交付物是什么、受众是谁，以及正在支持哪些决策。有了这些信息，团队就可以有效地报告他们的洞察了。


    ### 概念验证的研究产物


    **测试计划（Test Plan）：** 这是描述测试本身目的和方法论的文档，应该在任何研究启动之前制定。测试计划记录了学习目标和所使用的方法论。它还可以包括后勤安排，例如招募策略和时间安排信息。


    **测试脚本（Test Script）：** 对于引导式研究，脚本可以引导参与者进入研究环节，让他们理解自己将要做什么以及为什么这样做。它还确保团队在所有参与者中正确地收集数据——例如，以相同的方式提问相同的问题。这使得数据在综合过程中更具一致性和用处。


    **测试数据（Test Data）：** 无论使用何种方法，都会从研究中获取一组原始数据。这组数据可能是面试笔记、卡片分类的参与者结果或原始问卷调查数字。


    **洞察（Insights）：** 综合过程产生洞察——即那些具体的、可操作的观察结果，被用于做出产品设计决策。


    **发现总结（Summary of Findings）：** 除了具体的洞察之外，几乎每项研究都会产生总结性文档——对所学内容的叙述性解释，包括支持性证据。一次研究可以产生多个总结（例如，根据针对的对象的需求产生摘要和详细报告）。


    ### 概念验证期间的设计活动和产物


    ![](img/pg55.jpg)


    由于概念验证主要是一项研究活动，因此设计活动仅限于对测试原型所需的任何设计改进。设计师需要确保任何设计都拥有足够的信息，让测试参与者理解并提供有意义的反馈。


    #### 设计改进（Design Refinement）


    从构思阶段产生的方案设计应该已经在团队内部建立了共享的理解。这并不意味着它们对用户来说是可以理解的，或者已经准备好进行研究。可能仍需要设计工作来创建一个适用于测试方法论的产品。例如，这些更改可能包括提高设计的保真度以便用户获得足够的上下文，调整显示的语言以更好地匹配用户的词汇，或者创建一系列特定的屏幕来代表特定的交互，以验证效果。


    # 第四章 从精炼到评估的 HCD 活动和产物


    DOI: [10.4324/9781003188520-6](https://doi.org/10.4324/9781003188520-6)


    本章描述了在选择交付方案后，以人为中心的设计（HCD）为团队带来的益处。它有助于理解整个交付过程中（包括精炼和方案验证）发生的活动类型。


    ![](img/pg59.jpg)


    ## HCD 与精炼（Refinement）


    在精炼期间，团队对具体要交付的内容达成清晰、共享的理解。对于采用敏捷开发的团队，精炼已经是一项熟悉的活动，形式为用户故事编写和精炼。


    从 HCD 的角度来看，精炼重点关注识别并做出任何将被团队提取实施的剩余设计决策，并提供任何支持故事理解和一致的视觉参考。此外，在精炼期间，团队确定了在评估期间衡量解决方案成功的具体方式。


    '
