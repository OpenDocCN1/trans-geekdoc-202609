  - 从“构建并观察”的敏捷到从“构建并观察”转向基于风险的思维是迈向以人为本敏捷的关键步骤，因为这种思维允许团队将投入在 HCD 研究上的时间、金钱和精力水平与功能或产品的风险相匹配。这种转变鼓励早期讨论功能的风险，以及通过更深入了解用户或直接观察用户与拟议特征的交互来缓解哪些风险。它还强调了一致地衡量结果。
