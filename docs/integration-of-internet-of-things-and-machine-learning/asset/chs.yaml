  \n# 36.3 利用机器学习和人工智能增强物联网智能智能决策\n\nSandeep Kumar Hegde\nDOI: [10.1201/9781003634768-3](http://doi.org/10.1201/9781003634768-3)\n\
  \n## 3.1 引言\n\n在医疗领域，人工智能 (`AI`) 正在显著连接物联网 (`IoT`)，以提供远程患者管理、疾病预测和创新的个性化治疗。`AI`\
  \ 算法同样在可穿戴设备中运行，监测生物体并根据这些系统的实时监测变化向健康专业人员发送警报，以便及早发现并促进及时的健康干预以改善结果。此外，由于实现了早期疾病检测和及时医疗干预，患者的效果得到了提高。基于\
  \ `AI` 的 `IoT` 解决方案带来了远程医疗、实时健康监测和自动诊断的改进，同时也使其在医疗领域更具成本效益且易于获取 [1]。\n\n简单来说，近期\
  \ `AI` 和机器学习 (`ML`) 集成 `IoT` 为传统领域带来了革命，旨在开发更智能、更高效的决策方法，解决这些领域面临的其他问题。这种集成包括用于处理大型数据集的智能系统，在各种应用中实现非常智能、多功能且自主的设计。该领域令人印象深刻的贡献之一是使用\
  \ `AI` 和 `ML` 来保护 `IoT` 系统。传统的 `IoT` 框架包含许多与数据漏洞和未经授权访问相关的问题。为了应对这些问题，研究人员提出了新的基于\
  \ `ML` 的安全模型，用于分析当前技术以及与智能 `IoT` 系统相关的漏洞。这些模型将使用 `ML` 分类器来检测和防止安全威胁，以提高 `IoT` 网络的健壮性\
  \ [2]。作为预防措施，已开发了基于 `AI` 的解决方案来分析数据以检测异常，从而提高医疗 `IoT` 系统的安全可靠性 [3]。这些数据集通过 `AI`\
  \ 算法进行分析，以优化流量、减少拥堵并增强应急响应系统。`AI` 驱动的 `IoT` 智慧城市计划促进了城市发展、降低碳排放并提高了市民的生活质量 [4]。\n\
  \n`AI` 与 `IoT` 的结合实施证明对农业领域的重大突破具有工具作用，其中智能农场利用 `AI` 赋能的设备进行精细农业。传感器随后为监测土壤状况、天气和作物健康提供了良好的平台，以便农民可以优化灌溉、施肥和害虫控制\
  \ [5]。通过 `AI` 算法处理信息以产生具有操作性的建议，从而减少资源浪费并提高粮食安全。另一个挑战是基于 `AI` 的 `IoT` 系统快速处理，特别是从边缘设备的角度来看。许多\
  \ `IoT` 设备在非常远程或低功耗环境中运行，这限制了它们可以运行的 `AI` 模型复杂度。因此，边缘 `AI` 和联邦学习 (`FL`) 正在被开发以实现本地处理，减少对云计算的依赖，这对\
  \ `AI` 驱动的 `IoT` 生态系统的决策是必要的 [6]。本文将努力强调 `IoT` 的关键 `ML` 算法及其用途以及智能推理中出现的问题。基本上，特定\
  \ `IoT` 的 `ML` 可进一步分类为监督学习、无监督学习和强化学习 (`RL`)。监督算法如支持向量机 (`SVMs`)、随机森林和深度神经网络用于预测性维护、健康监测以及故障诊断。聚类、异常和离群检测算法（如\
  \ `K-means` 聚类和主成分分析 `PCA`）解决了来自智能城市应用和工业 `IoT` 的问题。目前，`RL` 最流行的应用是机器人学、交通管理和智能电表计量，其重点是实时决策\
  \ [7]。\n\n为了预测未来趋势，可以通过 `AI` 和 `ML` 通过历史信息识别模式，从而实现预防性维护、需求预测和资源配置。在工业 `IoT` (`IIoT`)\
  \ 的情况下，预测分析可能指向故障预测，从而减少停机时间和维护成本 [8]。智能电网、智能农业和环境监测展示了本研究如何将灵活的解决方案可持续地实施到 `IoT`\
  \ 应用中。备期待的自动化设施来自 `AI` 与 `IoT` 的集成。本研究尝试分析使用 `AI` 和 `ML` 的 `IoT` 系统如何在无或极少人工干预的情况下辅助自主决策。基于\
  \ `AI` 的 `IoT` 应用将包括自动化运输、供应链管理和机器人流程自动化 [9]。投资 `AI` 驱动的 `IoT` 解决方案的企业将形成未来的市场，那里竞争将异常激烈。因此，本研究寻求探索\
  \ `AI` 和 `ML` 在 `IoT` 智能发展方面的应用、挑战和未来 [10]。\n\n\n\n\n\n## 3.2 文献综述\n\n本综述探讨了讨论 AI、ML\
  \ 和 IoT 交叉领域的关键研究论文，强调了其优势、应用和挑战。多位研究人员研究了 AI 与 IoT 中改进决策之间的关系。根据 Ficco 等人 \\[11\\\
  ]的观点，AI 不仅帮助 IoT 设备收集数据，还能提供实时洞察并实现决策自动化。IoT 系统可以使用 `ML` 算法预测未来结果、优化资源分配并识别模式。这些是用于智能家居、医疗保健、工业机器人和智慧城市的的一些智能决策过程。此外，另一项研究\
  \ \\[12\\] 强调，AI 驱动的 IoT 解决方案最适用于在复杂任务中以更少的人工输入实现更高的效率。它展示了深度学习（`DL`）模型（如卷积神经网络\
  \ `CNNs` 和循环神经网络 `RNNs`）如何帮助 IoT 设备分析图像数据、语音数据和传感器数据；得益于 AI 决策，这有助于车辆自动化、智能监控和环境监测的精细化和快速响应。\n\
  \nAI 增强 IoT 智能的一个广泛领域是预测性分析。Shams 等人 \\[13\\] 的解释了基于 AI 的 IoT 系统如何使用 `ML` 模型预测潜在的设备故障、优化供应链管理并提高能源效率。AI\
  \ 方法，特别是 `CNN` 和 `RNN` 等 `DL` 架构中的方法，已在实时分析领域取得了巨大成功。Rane 等人 \\[14\\] 综述的基于 `CNN`\
  \ 的 AI 模型在处理基于 IoT 的智能监控系统的明亮和多云视频流方面显示了显著成就，其处理准确率超过 92%，超越了安全性和自动化要求的标准。\n\n在考虑设备能够学习经验并适应动态环境的预测性\
  \ IoT 系统时，Simuni 等人 \\[15\\] 主要将 `RL` `ML` 方法作为关注领域。IoT 中的 `RL` 应用可以涵盖许多领域，例如能源管理、智能农业和自适应交通控制系统，在其中持续学习增强了决策机制。安全是\
  \ IoT 生态系统中的首要问题，AI 在推进网络威胁和异常检测技术方面起着至关重要的作用。根据 Hemamalini 等人 \\[16\\]，基于 AI 的异常检测通过识别网络流量、设备行为甚至系统日志中违背预期模式的模式，是提高\
  \ IoT 安全的技术之一。异常检测技术利用 `SVMs`、决策树和 `DL` 方法等学习算法在安全漏洞发生时进行检测。根据 Liao 等人 \\[17\\]\
  \ 的观点，AI 主导的入侵检测系统在 IoT 环境中运行良好。\n\n智慧城市倡议坚决依赖于支持 AI 的 IoT 解决方案，用于交通优化、废物管理和公共安全。文献\
  \ \\[18\\] 中的工作指出，AI 通过分析来自传感器、摄像头和环境监测设备的实时数据来增强支持 IoT 的智慧城市系统，从而使城市规划者能够就基础设施、污染控制和能源分配做出明智决策。智慧城市应用指的是部署基于\
  \ `RL` 的 AI 模型用于交通管理、能源优化和资源分配的领域。El Alaoui 等人 \\[19\\]的研究表明，基于 AI 的智能交通系统通过实时 IoT\
  \ 传感器数据动态调整交通灯模式，将拥堵率降低了高达 35%。\n\n文献 \\[20\\] 中的工作讨论了 AI  IoT 系统如何通过预测拥堵模式和调整信号计时来改进城市交通管理。AI\
  \ 支持的智能交通应用（如自动驾驶汽车和共享出行平台）尝试引入 `ML` 以优化路线、最小化燃料消耗并提高通勤者的整体体验。AI 和 IoT 在远程患者监测、疾病检测和个性化治疗领域引发了革命。正如\
  \ Hussein 等人 \\[21\\] 所报道，支持 AI 的 IoT 设备利用可穿戴传感器、医学影像和电子健康记录的数据分析，识别糖尿病、高血压和心脏状况等疾病的早期迹象。因此，它们为医疗部门根据实时收集的信息制定定制治疗方案提供协助。在这方面，Bharathi\
  \ 等人 \\[22\\]的工作分析了使用来自支持 IoT 健康监测设备的数据流进行流行爆发检测的预测性 AI 模型性能。文献 \\[23\\] 中的工作指出，AI\
  \ 驱动的机器人和预测性维护对工业效率做出了巨大贡献。研究表明，基于 AI 的入侵检测系统 (`IDS`) 在检测网络威胁方面的准确率超过 95%，从而增强了\
  \ IoT 的监控 \\[24\\]。为了异常检测和入侵防御，基于 AI 的模型（如 `Autoencoders`、孤立森林和生成对抗网络 `GANs`）提供了良好的研究基础。传统的\
  \ AI 模型需要在中心化点存储分类数据，这威胁到了隐私和数据安全信任。相反，`FL` 通过在多个去中心化的 IoT 设备上建立 AI 模型训练所需的必要机制而不共享原始数据，从而缓解了这一局面\
  \ \\[25\\]。\n\n\n\n\n文献 \\[26\\]提出的工作指出，应当借助 AI 的帮助实现自动化，特别是在工业物联网（IIoT）中，生产线的自学习机器人正在优化生产操作。根据\
  \ Dhiman 和 Alghamdi \\[27\\]的研究，这些机器人使用计算机视觉在各种制造任务中实现多样化应用，`DL` 和 `RL`。这一成就也确保了\
  \ AI 驱动的供应链管理中的预测性分析，从而实现了平稳的物流和库存控制。然而，AI 引入物联网引发了若干复杂问题，包括数据隐私、计算限制和伦理考量。基于 AI\
  \ 的物联网系统必须考虑隐私问题，因为它们处理着连接设备收集的海量个人数据 \\[28]。用户数据必须符合《通用数据保护条例》（`GDPR`）和 `HIPAA`\
  \ 等法规，以遵守用户保护措施。AI 驱动的物联网技术的未来在于动态流行的第五代（5G）网络、`DL` 能力的进步以及 AI 治理的加强之间的交汇。文献 \\\
  [29\\]提出的工作为这种超低延迟：具有更高可靠性的快速数据传输提供了充分的理论依据。自动驾驶汽车、智能医疗和工业自动化等实时应用将从这一进展中获得巨大益处。AI\
  \ 和 40.IoT 在远程患者组织监测、诊断和可穿戴健康设备方面取得了巨大进展。根据 Ala 等人 \\[30\\]]，用于解释 `ECG` 读数的基于 AI\
  \ 模型在发现 `ECG` 迹图中的异常方面实现了 93.4% 的成功率，有助于增强疾病的早期检测。物联网辅助 AI 医疗系统在实时紧急情况下会自动分析患者的生命体征，从而将患者入院的延迟减少了\
  \ 25%。基于 AI 的精准农业利用物联网传感器来监测土壤、管理灌溉并预测作物的任何疾病。根据 Ozkan-Okay 等人 \\[31\\]的研究，这些系统将使作物最高产量提高\
  \ 18%，用水量限制降低 25%。\n\nShwetabh 和 Ambhaikar \\[32\\]的另一研究小组基本上阐述了物联网背景下可解释 AI（`XAI`）在基于\
  \ AI 的决策过程中的透明度、可解释性和问责制机制。事实上，AI 模型的不断发展是为了使其符合伦理、公平且无偏见，从而为物联网生态系统中负责任地实施 AI 建立了协调一致。AI\
  \ 和 `ML` 在大多数物联网生态系统中发展迅速，导致在效率、自动化及其决策过程方面取得了显著改进。基于 AI 的物联网应用主要出现在智能城市、工业自动化、医疗和安全领域。研究人员探索了应用\
  \ `DL`、`RL` 和 `FL` 等其他 AI 技术来提高物联网智能性并增强实时决策能力。本章节提供了有关当前文献中物联网应用中 AI 和 `ML` 修改的额外见解。`DL`\
  \ 直接增强了基于物联网的分析和决策过程。根据 Nadella 和 Gonaygunta \\[33\\]]，`CNNs` 和长短期记忆（`LSTM`）`DL`\
  \ 架构通过处理比以前更复杂、更通用的数据模式，其和和促进并简化了物联网设备的数据处理任务。与依赖集中数据处理的传统 `ML` 相，`FL` 允许物联网设备协作训练模型，而无需实际共享精细提炼的信息本身\
  \ \\[34\\]。文献 \\[35\\]提出的工作研究了 `FL` 如何受益于医疗和智能家居等环境，在这些环境中，感兴趣的数据具有隐私担忧，但仍可以从集成设置中学习。这种去中心化机制为所处理的数据提供了安全方面的额外保障，并符合\
  \ `GDPR` 等隐私法规。AI 被激活用于优化智能电网中的能量消耗和分配。`ML` 模型更合逻辑地预测电力需求模式，从而优化电力分配。Nazir 等人 \\\
  [36\\]的研究表明，基于 AI 的智能电网通过根据物联网传感器的实时数据动态调整电力供应，减少了 20–25% 的能量浪费。\n\n`XAI` 近期在物联网应用中获得的关注，是因为\
  \ AI 驱动的决策需要透明度和问责制。Rafique 等人 \\[37\\]已指出传统模型的这种黑箱性质使得使用户无法检测其背后的原因。在物联网中简单地应用\
  \ `XAI` 技术是为了确保自动系统、医疗、金融等此类领域的可解释性和问责制。Kheder 和 Mohammed \\[38\\]的一的一项研究表明，对基于\
  \ Transformer 的自然语言处理（`NLP`）模型（如 `BERT` 和 `GPT`）的分析显示了它们通过物联网支持的智能助手以高准确率理解和处理人类语音的能力。此类\
  \ `NLP` 技术增强了自动化客户服务、复杂的智能家居自动化和对话式 AI 应用，从而使物联网系统更加直观和用户友好。边缘计算通过为物联网系统提供本地 DIY\
  \ 解决方案，开发了一种减少云端高延迟带宽限制的方法。根据 Bukhowah 等人 \\[39\\]，AI 驱动的边缘计算在极少连接云端的情况下在本地物联网设备上提供实时处理。Liu\
  \ 等人 \\[40\\]提出的工作证明，部署在边缘设备上的 AI 使处理延迟降低了 40–50%，从而为自动驾驶和工业自动化等物联网关键应用中的实时 AI 驱动决策铺平了道路。\n\
  \n\n\n强化学习（RL）在给定的自适应和自学习物联网环境中迈下了坚实的足迹。参考文献 [41] 中的工作描述了 RL 算法如何允许物联网设备通过试错来学习其最优策略，使其最终适用于智能电网优化、机器人自动化和自动驾驶车辆等应用。基于\
  \ RL 的物联网系统在适应各种状况的同时提高了决策效率，从而提升了系统的整体性能。AI 有效增强了智能电网系统中的能量管理和分配。正如研究观察到的，支持物联网的电网中的\
  \ ML 模型可以预测电力需求、检测故障并优化能源消耗。AI 驱动的智能电网通过融合 IoT 传感器数据进行实时能源管理，从而提高了电力系统的稳定性和可持续性。工业物联网（IIoT）从以\
  \ AI 为核心的异常检测技术取得了进展。参考文献 [42] 中的工作支持了 AI 辅助 ML 算法在预测设备故障和最大限度减少制造操作中停机时间方面的潜力。具有预测性维护模型的\
  \ AI  IoT 解决方案能够准确定机器运行中的异常情况，允许行业降低运营成本并提高效率。AI 赋物联网的另一面是偏见、公平性和伦理问题的存在。根据 Karimullah\
  \ 等 [43] 的研究，物联网决策系统中的 AI 算法可能会导致不公正的判断；继承其训练数据中存在的偏差。AI 为基于物联网的智能家居自动化系统提供了学习用户行为和优化能源使用的能力。在智能家中，AI\
  \ 模型可以预测用户偏好并自动控制设备，通过脸识别和语音助手增强安全性 [44]。在提高用户便利性的同时，观察到 AI 驱动的智能家居系统减少了 18–22%\
  \ 的能耗。IIoT 中 AI 的使得工业过程更加高效，确保了自动化，并保证了控制质量。参考文献 [45] 中的工作声称，AI 驱动的预测性维护、供应链分析和机器人自动化显著提升了制造效率。\n\
  \n## 3.3 提出的方法论\n\n所提出的方法通过集成 AI–ML 与物联网为特征的实时决策改进了智能环境能力。这主要涉及数据采集、预处理、选择和 AI 模型的应用以及评估。该研究解决的其他问题包括数据隐私、计算效率和可扩展系统。系统架构旨在构建三个大支柱：感知、网络和应用。感知层由收集实时数据的物联网传感器和设备组成。本研究旨在通过通过实现用于智能决策的\
  \ AI 和 ML 的平台安全来增强物联网智能化。所提出的解决方案是一种用于此类系统的结构化方法论，以便实时收集和处理数据，然后进行基于 AI 的分析、决策、安全提供和性能验证。\n\
  \n实现这些目标的初始阶段是通过物联网数据获取和预处理完成的，即从不同的智能传感器、连接设备和云平台收集数据。生成的数据大多是非结构化且带有噪声的，需要进行数据清洗、归一化和特征提取。实施了如\
  \ `PCA` 和 `Min-Max normalization` 等高级数据预处理技术，以使该方法能够为 AI 目的利用相关且高质量的数据。此外，数据通过 `Message\
  \ Queuing Telemetry Transport (MQTT)` 和 `Apache Kafka` 等协议实时获取，以便在处理前进行流处理和存储。然后，该方法使用预处理后的数据运行\
  \ AI 和 ML 算法以提取见解并做出智能决策。根据特定的物联网应用，将部署不同的 AI 技术。这涉及监督学习模型，如 `SVMs` 和 `Random Forest`，用于工业物联网的预测性维护活动和医疗物联网的疾病预测。\n\
  \nFigure 3.1 描述了所提出的架构流程图。物联网智能架构包括 AI 和 ML 的业务模型，从物联网设备和传感器捕获环境（温度、运动或图像）的原始数据开始，并将这些信息发送到数据采集层，在该层中数据通过\
  \ `MQTT` 或 `HTTP` 等专用通信协议传输到云端或边缘服务器。一旦进入系统，数据预处理层应用清洗、过滤和归一化，使数据保持可用且相关的格式，作为决策背景下进一步分析的输入。在某些情况下，边缘处理任务涉及对数据进行本地分析，允许系统通过绕过将所有数据发送到云端的延迟来实现实时决策。AI\
  \ 和 ML 层本质上形成了系统的核心，ML 模型在历史物联网数据上进行良好的训练，使其能够检测模式、做出预测并以增强决策的最优利益采取行动。虽然人机交互受益于改进的持续反馈循环——从数据采集到重新训练——但决策层将\
  \ AI 和 ML 的输出转换为某种可操作的形式，无论是警报还是控制操作。用户界面和可视化功能为用户提供了查看系统的手段并在并在时方便其他形式的人工干预。在这种情况下，建立了一个反馈循环，允许通过输入新数据对模型进行微调和改进使系统持续增长。最后，安全和隐私层负责安全数据传输和存储、用户隐私以及针对漏洞的系统完整性。\n\
  \n\n**图 3.1** 所提出的架构流程图。⏎\n\n43.44.（注：此处数字似乎连续，可能为格式问题，或指 3.4 节）所提出的框架通过轻量级 AI 模型优化了能耗，包括硬件加速技术，如\
  \ `tensor processing units (TPUs)` 和 `graphics processing units (GPUs)`。其他策略包括休眠调度和动态功率管理以节省闲能源损失，这使得物联网能耗更环保且具有成本效益。此外，在使物联网智能自适应方面，该方法引入了\
  \ `XAI` 来扩大决策透明度的范围。AI 模型相关的一个常见问题是它们作为黑箱系统运行。这阻碍了用户对 AI 生成的决策进行正确解释。通过采用多种 XAI\
  \ 方法论，如 `Shapley Additive Explanations (SHAP)` 和 `Local Interpretable Model-Agnostic\
  \ Explations (LIME)`，预期系统确保 AI 预测变得可解释且可理解，并具有良好的合理证明性。这在医疗保健和工业自动化等关键应用中特别有用，因为对\
  \ AI 决策的监督和信任变得非常重要。\n\n\n\n所提系统将根据准确率、精确率、召回率、F1 分数、响应时间和能量效率进行评估。性能指标将深入分析 AI\
  \ 驱动的 IoT 应用在有效性和可扩展性方面的可行性。将对不同的 `ML` 和 `DL` 模型进行效率、计算成本和准确性的比较。其中，将检查 `SVM`、`Random\
  \ Forest`、`CNN` 和基于 `transformer` 的模型，以寻找 IoT 应用中的最佳用例。此类详尽的仿真和现场试验将验证 AI 模型的性能，同时将使用\
  \ `TensorFlow`、`PyTorch` 和 `MATLAB` 工具包对 AI 算法进行实现和调优。所提方法通过模型量化、`pruning` 和 `knowledge\
  \ distillation` 在 IoT 设备的限制内使 AI 模型最大化，以提高计算效率并降低功耗。为此，还探讨了 AI 模型偏差、公平性和问责制的伦理问题。所有\
  \ AI 模型都通过了一系列偏差缓解技术，以确保所有应用决策的公平性。可扩展性的提升将通过网络优化、边缘计算能力的增强以及 AI 训练能力的扩展来实现。随后，改进将转向用于\
  \ IoT 的自学习 AI 系统。通过试点测试、用户反馈和持续改进，将构思一种将 AI 的 IoT 解决方案到工业、医疗、智能城市和物流中的增量部署策略。实时决策、增强的安全性和可持续计算被集成到该方法论中，以满足上述研究目标。该方法建立了一种结构化且系统化的方法，借助\
  \ `AI` 和 `ML` 获取智能、高效且安全的 IoT 智能。通过对数据处理、决策、安全、可扩展性和能量效率等主要挑战进行战略性考虑，所提框架为自主、自适应和高度智能的新代\
  \ IoT 生态系统开启了新的未来。\n\n## 45.3.4 实验结果\n\n实验调查所需的数据集收集自 Kaggle 仓库，包含了来自智能环境中大量传感器收集的各种\
  \ IoT 数据，如图 3.2 所示。\n\n![图 3.2 使用 Random Forest 对 IoT 传感器数据进行异常检测获得的混淆矩阵。](img/9781041062943_C003_002.jpg)\n\
  \n**图 3.2** 使用 `Random Forest` 对 IoT 传感器数据进行异常检测获得的混淆矩阵。⏎\n\n该大型数据集旨在开发 `ML` 和 `AI`\
  \ 应用，根据实时的 IoT 传感器输入做出智能决策。数据集包含大量属性，包括环境因素的测量值，如温度、湿度、压力、运动和光等。因此，每个数据点都包含关键的时间戳和元数据信息，并动态地反映了智能家居、工厂、城市等\
  \ IoT 系统的特性。该包含包含标记数据和未标记数据，其中某些传感器提供连续类型的数据流，而另一些则记录离散事件类型信息。由于该数据集量大且多样性高，为各种\
  \ `ML` 和 `AI` 算法实验提供了巨大的机会——从回归和分类到异常检测——能够实现有关多种用例的智能决策，例如能源效率、预测性维护、自动化和实时环境变化响应。\n\
  \n## 46. 图像与语音\n\n图像和语音是 `CNNs` 以及 `LSTMs` 的主要应用，以满足 IoT 系统的需求。在智能监控应用中，`CNNs` 的分类准确率达到\
  \ 96.3%，而 `RNN` 在语音识别中的准确率为 92.7%。基于 `Transformer` 的技术（如用于 `NLP` 应用的 `BERT`）具有更好的上下文理解，但计算成本较高。`AI`\
  \ 模型部署在边缘端时显示出比云处理更显著的延迟优势。与云 `AI` 服务相比，`NVIDIA Jetson` 的推理时间减少了 40%。这种改进很大程度上源于需要实时决策的自动汽车和工业自动化等应用。测试了\
  \ `FL` 以检查保护隐私的型 AI 在 IoT 应用中的适用性。从百分比来看，`FL` 达到了与传统集中式训练（89.3%）相似的 87.5%，同时数据传输成本降低了\
  \ 70%。这些结果表明 `FL` 可以在保持模型性能有效的同时增强数据安全。`RL` 模型被用于智能交通控制系统。基于 `RL` 的模型使拥堵减少了 35%，车辆吞吐量增加了\
  \ 28%。显然，`RL` 为动态环境下的自适应决策提供了空间。\n\n### 医疗保健\n\n医疗保健应用使用 `AI` 模型测试基于 IoT 的可穿戴设备。对于用于早期疾病检测的\
  \ AI 模型，其在预测心脏异常方面的准确率达到了 93.4%。智能警报系统通过在实时实现的场景中减少约 25% 的响应时间改善了患者福利。开发了先进的 `ML`\
  \ 模型，根据智能电网的理想能源管理需求优化预测电力需求。图 3.3 显示了使用 `CNN` 模型对 IoT 传感器数据进行异常检测获得的混淆矩阵。\n\n![图\
  \ 3.3 使用 CNN 模型对 IoT 传感器数据进行异常检测获得的混淆矩阵。](img/9781041062943_C003_003.jpg)\n**图 3.3**\
  \ 使用 `CNN` 模型对 IoT 传感器数据进行异常检测获得的混淆矩阵。⏎\n\n该智能系统将电力浪费减少到 22%，并将负载平衡效率范围提高了 18%。上述研究结果表明，`AI`\
  \ 能够充分提高能源系统的可持续性。基于对制造设备传感器数据分析的 AI 模型机器故障预测结果显示，准确率为 92%。注意到停机时间和机器维护成本均减少了 40%。图\
  \ 3.4 显示了使用 `XGBoost` 模型对 IoT 传感器数据进行异常检测获得的混淆矩阵。\n\n![图 3.4 使用 XGBoost 模型对 IoT\
  \ 传感器数据进行异常检测获得的混淆矩阵。](img/9781041062943_C003_004.jpg)\n\n**图 3.4** 使用 `XGBoost`\
  \ 模型对 IoT 传感器数据进行异常检测获得的混淆矩阵。⏎\n\n### 比较分析\n\n基于不同 `AI` 模型的比较研究考虑了准确率、推理时间和资源消耗等性能参数。得出的是，在进行更复杂的决策方面，`CNNs`\
  \ 和 `transformers` 可以比传统的 `ML` 产生更好的性能。然而，在结构化 IoT 数据源中，`Random Forest` 和 `XGBoost`\
  \ 提供了最优性能和效率。在 IoT 安全应用中评估了基于 `AI` 的异常检测。此类模型的示例包括 `Autoencoders` 和 `Random Forests`，结果显示对网络安全威胁的检测率为\
  \ 95.6%，从而显著提升了 IoT 网络安全和欺诈检测。图 3.5 显示了使用 `Random Forest` 对 传感器数据进行异常检测生成的 ROC 曲线。结果证明，分布式\
  \ `AI` 架构在集成 IoT 设备数量增加时，能够高效地扩展。未来的工作将主要关注在能源效率和对实时需求的适应性方面优化 `AI` 模型。\n\n\n\n\n\
  ![图 3.5 使用随机森林对 IoT 传感器数据进行异常检测生成的 ROC 曲线。](img/9781041062943_C003_005.jpg)\n**图\
  \ 3.5** 使用随机森林对 IoT 传感器数据进行异常检测生成的 ROC 曲线。#ch11.xhtml#f12b)\n\n原始 IoT 数据的质量显著影响\
  \ AI 模型的性能。实验结果显示，去噪、数值归一化和缺失数据处理使各种 ML 模型的预测准确率提升了 12%。在一个智能医疗应用中，在对 ECGG 传感器数据进行预处理后，AI\
  \ 心脏风险预测准确率从 81.4% 提高到 93.2%。这强调了高质量数据在决策活动中至关重要的意义。[图 3.6 显示了使用 `CNN Model` 对 IoT\
  \ 传感器数据进行异常检测获得的 ROC 曲线。在边缘计算设备上部署 AI 模型极大缩短了处理延迟。\n\n![图 3.6 使用 CNN 模型对 IoT 传感器数据进行异常检测获得的\
  \ ROC 曲线。](img/9781041062943_C003_006.jpg)\n**图 3.6** 使用 CNN 模型对 IoT 传感器数据进行异常检测获得的\
  \ ROC 曲线。#ch11.xhtml#f13b)\n\n[图 3.7 显示了使用 `XGBoost model` 对 IoT 传感器数据进行异常检测获得的\
  \ ROC 曲线。在涉及图像/语音识别等非结构化数据的任务中，观察到 `DL` 模型（`CNNs`、`LSTMs`、`transformers`）表现优异，而经典的\
  \ `ML` 技术（`Random Forest`、`SVM`、`XGBoost`）更适用于结构化的 IoT 数据集。例如，在视频异常检测中，`CNNs` 实现了\
  \ 96.29% 的准确率，而 `XGBoost` 在基于传感器的故障检测中达到了 94.5% 的准确率。结果表明，在选择 AI 模型时，数据类型和计算限制会影响决策。传统的\
  \ AI 模型涉及数据的集中收集，并带来隐私威胁。所提出的 `FL` 框架显示，在 IoT 设备上进行本地 AI 训练减少了 70%的数据传输，同时实现了 93.32%\
  \ 的模型准确率。这在医疗领域尤为重要，因为那里涉及到患者数据隐私。因此，研究表明 `FL` 可以在 AI IoT 中公平地分配隐私、效率和性能。使用支持 IoT\
  \ 的传感器技术，对 AI 智能能源管理进行了实时功率监控实践测试。AI 算法通过优化的电力分配抵消了 22% 的电能浪费，并将负载均衡效率提高了 15%。系统的预测分析可以根据需求模式动态管理电力供应。结果发现，AI\
  \ 可用于 IoT-云集成智能电网的能源优化。图 3.8 描绘了 AI/ML 模型对 IoT 传感器数据进行异常检测的性能。可以观察到，带有 `LSTM model`\
  \ 的 `CNN` 与其他模型相比获得了良好的准确率。IoT 网络中的安全威胁通过基于 AI 的异常检测模型进行研究。使用 `Autoencoders` 和 `Random\
  \ Forest` 模型进行网络入侵检测产生了 91.2% 的准确率性能指标，这在保障 IoT 安全方面带来了显著改进。该实施成功识别了智能家居和工业 IoT\
  \ 网络中的未经授权访问尝试，并偏转了可能的网络攻击。借此，这一论点更有力：AI 可以是构建 IoT 网络安全不可或缺的伙伴。\n\n![图 3.7 使用 XGBoost\
  \ 模型对 IoT 传感器数据进行异常检测获得的 ROC 曲线。](img/9781041062943_C003_007.jpg)\n**图 3.7** 使用\
  \ XGBoost 模型对 IoT 传感器数据进行异常检测获得的 ROC 曲线。#ch11.xhtml#f14b)\n\n![图 3.8 AI/ML 模型对 IoT\
  \ 传感器数据进行异常检测的性能。\n**图 3.8** AI/ML 模型对 IoT 传感器数据进行异常检测的性能。[#ch11.xhtml#f15b)\n\n\
  在这一关于智能交通管理的案例研究中，使用了来自 IoT 传感器的实时数据，通过 `RL` 模型优化交通信号计时。与基于旧计时器的传统交通信号系统相比，`RL`\
  \ 系统使拥堵减少了 51.35%，车流量提升了 28%。这为智能 IoT 在提高城市旅行时间更具流动性方面提供了可能。目前正在研究几种 AI 模型在基于 IoT\
  \ 的潜在应用方面，例如精准农业，以改善灌溉和土壤健康监测。此外，该系统通过分析热、湿和土壤水分传感器数据，将整体作物产量效率提高了 18%，并减少了约 25%\
  \ 的用水。\n\n## 3.5 结论\n\n关于利用 ML 和 AI 增强 IoT 智能化以实现智能决策的研究证明了 AI 驱动的解决方案在优化 IoT 生态系统方面的变革潜力。随着\
  \ IoT 网络中引入复杂的 AI 和 ML 算法，它将高效处理数据、自动化决策、提高安全性并增强系统的整体性能。该方法按时间顺序详述了数据获取、实时分析、异常检测、网络安全和能源效率等问题，这无疑使\
  \ IoT 应用在运行中变得智能、可扩展且可持续。这项研究揭示的最重要的一点是，实时决策在 IoT 环境中具有极重要的意义。\n\n## 参考文献\n\n* \
