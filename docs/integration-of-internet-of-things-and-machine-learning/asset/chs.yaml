  ## 301.13.8 结论与未来工作\n\n电力系统受攻击和扰动是由于人为或自然事件引发而最经常出现的问题。最大的困难在于识别电力中断的主要原因并采取采取适当的应对措施。仅凭人类判断对于预测扰动是不够有效的。对于操作人员来说，观察系统状态是一项挑战。本研究的目标是部署各种\
  \ `ML` 模型来识别扰动并可靠地将其分类为自然或有害攻击。`OAK` 数据集用于通过 `Python` 编程实现 `ML` 算法。两个系统的合并建立了物理设置。`PMU`\
  \ 在数字部分通过能量控制运行。相位数据包含了关于开关、断路器和继电器的电压测量。来自 `XAI` 的 `SHAP` 和 `LIME` 方法用于评估模型：`ETC`、`RF`\
  \ 和 `GBM`。从 `ETC` 模型获得了四个指标的最高值。可视化对于调试模型行为非常有帮助。蜂群图基于个人的 `SHAP` 值，点垂直排列。每个点代表该个人/特征的原始值。高原始值由红色表示，低原始值由蓝色表示。2.\
  \ 未来的研究应该处理电力系统中提出的 `ML` 的实时实现。扩展数据集，引入 `DL` 并融合多源数据可以提高准确性。`XAI` 的进一步开发将增强操作员在复杂、高风险物理场景下的信任和决策能力。\n\
