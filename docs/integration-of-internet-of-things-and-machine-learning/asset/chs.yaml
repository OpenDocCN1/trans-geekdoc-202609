  \ 1(2), 43–54。\n\n# 419.20A 基于心电图信号的心脏疾病分类深度学习与优化心脏诊断系统\n\nC. Venkatesh, L. Sivayamini,\
  \ M. Venkata Dasu, Shaik Karimullah, 和 T. Lakshminarayana。\n\nDOI: [10.1201/978103634768-20](http://doi.org/10.1201/978103634768-20)\n\
  \n## **20.1** 引言\n\n\n\n\n\n心血管疾病（CVDs）对全球健康构成了巨大挑战，占每年死亡人数的近三分之一[1]]。这一广泛的疾病类别影响心脏和血管系统，包括心律失常、心脏骤停等状况[2]]。心血管疾病发病率的上升受人口老龄化、生活方式改变以及高血压和糖尿病流行率增加等因素的影响，这些共同给国际医疗系统带来了沉重负担。作为首要死因，心血管疾病需要引起关注[3]]。及时准确地诊断心脏病至关重要，因为它直接影响患者的护理和预后。不同的心脏病会影响心脏的电功能、结构和机械性能，可以通过各种临床和生理体征观察到。保健提供人员通常依赖血管造影、心电图（ECGs）和血检等诊断工具来评估心脏健康[4]]。血管造影提供血管的详细成像以检测阻塞或异常，而血检则测量指示心肌损伤或压力的标志物。心电图仍然是最广泛使用且最易获取的诊断工具，它捕捉由调节心跳的心起结细胞产生的电信号。这使得心电图成为观察传导通路和其他其他重要心脏功能的宝贵策略，能够对多种心脏状况进行诊断[5]。\n\
  \n### 心电图分析的进展\n\n计算技术的进步彻底改变了心电图数据的解释。传统上，心电图分析依赖人工审查和经典信号处理，这涉及从信号中提取特定特征、选择相关特征并对其进行分类。这些方法可能非常耗力、容易产生人为错误，并受限于选择充分代表心脏信号复杂性特征的挑战。为了克服这些局限性，深度学习在近期已成为一种成熟的方法，用于自动化和增强心电图解释的准确性。\n\
  \n这些模型可以检测出数据中传统技术可能会错过的细微且复杂的模式。大型、良好标记数据集（例如来自 `PhysioNet/Computing in Cardiology\
  \ Challenge (CinC)` 的数据集）对于训练这些模型至关重要，使其在检测心律失常、冠心病和其他心脏疾病方面具有很高的准确性[6]。\n\n虽然深度神经网络对提高诊断准确性的影响已经在神经病、皮肤科和心脏病在内的多个医学领域得到广泛认可[7]]。总的来说，深度学习增强了分析复杂生物医学信号和医学图像的能力，使其成为推进医疗诊断和预后不可或缺的工具[8]。\n\
  \n### 鱼鹰优化程序\n\n为了进一步提高分类准确性，本研究在模型训练过程中引入了 `osprey optimization procedure`（鱼鹰优化程序），这是一种基于鱼鹰捕猎技术的自然启发元启发式算法[9]]。这种优化方法在解决复杂的非线性问题方面特别有效，不依赖梯度信息，从而提高了模型从心电图数据中准确分类心脏疾病的能力[10]]。该算法在各种工程和资源分配应用中被证明有效，为医学信号分析提供了一种具前景的策略[11]]。通过将这种优化与卷积神经网络（`CNNs`）相结合，研究旨在提高诊断精度，支持心血管疾病的早期检测，并最终帮助减少与心脏状况相关的死亡率。\n\
  \n## 20.2 文献综述\n\n心血管疾病诊断的最新进展日益关注利用深度学习和优化算法来增强预测的准确性和可靠性。\n\n2025 年，Zhang 等人[12]]引入了一种利用来自\
  \ `PhysioNet`数据库的多导联心电图记录进行早期心血管疾病检测的集成网络。他们的方法展示了整体诊断性能的显著提高，达到了 93.5%的准确率。这种集成策略允许模型有效捕获复杂的心脏信号动力学。然而，该方法需要大量的计算资源并依赖于大型良好标记的数据集，这可能会限制其在基础设施有限的临床环境中的可访问性。\n\
  \n2024 年，Kumar 等人[13]]研究了应用于电子健康记录（`EHRs`）的心血管疾病预测中，结合集成学习方法选择特征的若干方法。他们的研究发现，`RFE`结合`Gradient\
  \ Boosting`分类器的性能优于其他配置，达到了 89%的准确率水平。尽管结果令人鼓舞，但研究局限于单一机构数据集，这在验证模型在更广泛、更多样化的患者群体中的泛化和有效性方面带来了挑战。\n\
  \nLopez-Morales 等人[14]]在 2023 年的工作不仅关注了分类准确性，还通过提出一种基于注意力机制的`CNNs`的可解释人工智能（`XAI`）框架来从心电图数据检测心律失常，考虑了模型的透明度。他们的模型实现了\
  \ 91.2%的分类准确率，还生成了注意力地图，视觉化地突出了心电图信号中贡献预测的关键区域，从而培养了临床信任。尽管如此，该研究样本量较小，且对特定心律失常类的关注限制了其解决方案的适用范围和稳健性。\n\
  \nFarhan 等人[15]]在 2022 年探索了利用遗传算法优化一维（`1D`）`CNN`架构，通过心电图信号分析诊断冠心病。他们优化的`CNN`模型实现了\
  \ 90.7%的准确率，与基线网络相比，在训练期间表现出更快的收敛速度。然而，不平衡数据集的存在以及缺乏外部数据的验证限制了发现的可靠性和广泛的临床意义。\n\n\
  Singh 和 Gupta[16]]在 2022 年的综合综述强调了物联网（`IoT`）技术与机器学习在持续心血管健康监测中的日益融合，通过可穿戴设备检测心律失常的准确率超过\
  \ 92%。尽管有这些进展，他们强调了持续的挑战，包括对患者数据隐私的担忧以及大规模可用数据集的稀缺，这阻碍了广泛实施。\n\n2021 年，Hassan 等人[17]]提出了一种结合`CNNs`和`Random\
  \ Forest`算法的集成诊断模型，通过利用超声图像结合临床数据来预测心衰竭。他们的模型在多个患者队列中实现了 90.1%的准确率，证明了稳健性和有效性。然而，对超声成像的依赖限制了其在无法常规获得此类成像的环境中的应用。\n\
  \n\n\n\n同样，Oliveira 等人 18 在 2021 年开发了一种全面的深度学习流程，将原始 ECG 信号与元数据融合，以对多种心脏状况进行分类。该模型在大型数据集上进行训练，达到了\
  \ 88.6%的准确率。他们方法的主要限制是需要大量的精力，并且需要大量高质量的标记数据。总而言，这些研究反映了将深度学习和优化方法应用于心血管诊断的显著进展。然而，常见的局限性仍然存在：模型往往依赖于特定数据集，受到类别不平衡的影响，且有时缺乏解释性，而这对于临床认可至关重要。此外，高计算需求和有限的验证限制了其在现实世界的应用。本研究提出的方法旨在通过实现`CNN`进行全自动信号分类来克服这些挑战。通过优化算法`OOA`增强了这一点，这是一种元启发算法，旨在不依赖梯度信息的情况下有效微调模型参数\
  \ 422。这种策略减少了人为错误，促进了早期和准确的诊断，并增加了在不同数据集上的稳健性。\n\n## 20.3 拟议方法\n\n构建一种高效且精确的诊断方法，利用`ECG`数据识别和分类与心脏相关的疾病是核心目标。为了提供一种可靠的诊断解决方案，模型整合了信号预处理、特征提取和分类步骤。图\
  \ 20.1 展示了系统的架构流程。\n\n![图 20.1 拟议的框图。](img/9781041062943_C020_001.jpg)\n\n**图 20.1**\
  \ 拟议的框图。](#ch28.xhtml#f02\n\n本研究引入了一种结构化方法，通过`ECG`信号分析来识别心脏疾病。初始阶段涉及从`PhysioBank`等成熟的医学数据库获取`ECG`数据，该数据库是一个广泛认可且公开访问的存储库，提供了来自健康个体和患有各种心血管疾病患者的丰富记录。这些信号作为诊断系统的基础输入。为了提高质量并减少可能从单一来源产生的不一致性，研究采用了数据融合过程。通过结合来自不同导联或时间点的多个`ECG`信号，系统创建了心脏电活动更改进且合法的表示。这一预处理步骤有助于抑制不需要的噪声，并增强临床重要特征的清晰度。\n\
  \n一旦数据完成融合和归一化，下一步将重点于使用`Pan–Tompkins`策略提取诊断特征。该算法通过过滤信号、强调快速变化以及应用动态阈值来定位显著峰值。在识别这些关键特征后，在分类模型中引入了优化步骤。此处使用`OOA`通过优先考虑具有最大诊断价值的特征来微调所选特征。\n\
  \n精炼后的特征随后传递给`CNN`，一种对于模式识别任务特别有效的模型。`CNN`通过多个层 423 处理这些特征以对`ECG`信号进行分类。通过该系统早期识别异常有助于及时的医疗干预，从而提高患者的生存率并降低严重心脏事件的风险。\n\
  \n### 20.3.1 ECG 信号获取\n\n为了启动诊断过程，该研究依赖`ECG`信号作为主要数据源。这些信号获取自`PhysioBank`数据库，这是一个广为人知的且公开访问的存储库，存储了各种生理记录\
  \ 19。`PhysioBank`提供了来自健康个体以及患有心律失常、心力衰竭、癫痫和睡眠呼吸暂停等疾病患者的策划数据集。由于其质量、多样性和开放使用的可用性，这些记录在医学工程和医学研究中特别有用\
  \ 20。\n\n`ECG`信号通过跟踪每次心跳期间发生的电活动，在评估心脏功能方面起着至关重要的作用。这些活动通过放置在皮肤特定位置（通常是胸部和四肢）的一系列电极捕捉。信号反映了电脉冲跨心脏肌肉的流动，对应于收缩和舒张阶段\
  \ 21。\n\nECG 波形由几个关键部分组成，代表心脏循环的不同阶段。ECG 的表示所示图所示。\n\n![图 20.2 ECG 信号的表示。](img/9781041062943_C020_002.jpg)\n\
  \n**图 20.2** ECG 信号的表示。](#ch28.xhtml#f03)\n\n`P 波`显示心房已去极化，引发收缩。当心室突然去极化时，它们发生收缩。随后出现`T\
  \ 波`，意味着心室正在复极化。偶尔可见`U 波`，它与最终阶段有关 22。\n\n\n\n\n通过这种方式结合 ECG 导联，生成了一个融合信号 `P(t*)`，它能够更完整地捕捉心脏的电活动行为。这种增强信号允许更有效的特征提取，例如识别心跳、间隔和波形，从而提高心血管疾病（CVD）检测和分类模型的准确性\
  \ [30]。\n\n### 20.3.3 特征提取\n\n这是一个基础步骤，在减少原始数据不确定性的同时，保留准确分析所需的关键信息。该过程通过将原始信号转换为一组有意义且紧凑的特征，不仅降低了计算负载，还提高了分类模型的效率。在\
  \ CVD 诊断背景下，从 ECG 信号中提取精确的特征对于以最小的处理开销捕捉心脏电活动至关重要 [31]。\n\n采用 Pan–Tompkins 算法从 ECG\
  \ 信号中提取特征，主要关注实时检测 QRS 波群。Pan–Tompkins 方法通过结合信号预处理技术和决策规则高效地定位 R 峰。Pan–Tompkins\
  \ 的步骤所示图 20.3。\n\n![Figure 20.3 Steps of Pan–Tompkins.](img/9781041062943_C02_003.jpg)\n\
  \n**图 20.3** Pan–Tompkins 步骤。](#ch28.xhtml#f204b)\n\n425. 该算法遵循以下顺序步骤：\n\n1. **带通滤波：**\
  \ 标记为 `M(t*)` 的原始 ECG 信号包含各种干扰，如基线漂移和高频噪声。为了在保留 QRS 特性的同时消除这些不需要的成分，信号被送过一个带通滤波器。滤波过程可以使用公式\
  \ (20.2) 表示：\n\n```\nB(t*) = M(t*) * R, (20.2)\n```\n\n其中 `R` 代表滤波器的响应。这种滤波增强了信噪比，有利于后续的特征提取\
  \ [32]。\n\n2. **微分：** 为了强调 QRS 波群的特征性陡峭斜率，使用公式 (20.3) 对滤波后的信号进行微分。该操作通过计算相邻样本的加权差值来突出快速变化：\n\
  \n```\nS(t) = 1/8[- X(t - 2) + X(t + 2) + 2X(t + 1) - 2X(t - 1)]. . (20.3)\n```\n\
  \n这一步突出了边缘，有助于将 R 峰与其他波形成分区分离开来 [33]。\n\n3. **平方：** 随后使用公式 (20.4) 对微分后的信号 `S(t*)`\
  \ 进行平方，以放大与 QRS 波群相关的较大值，同时抑制噪声和其他 ECG 波产生的较小波动：\n\n```\nK(t*) = [S(t*)]² (20.4)\n\
  ```\n\n这种非线性操作确保了所有值为正，并增强了显著峰值的突出程度。\n\n4. **滑动窗口积分 (MWI)：** 为了同时捕捉 QRS 波群的持续时间和形状，滑动平均滤波器使用公式\
  \ (20.5) 在 `M` 个样本的窗口内对平方信号进行积分：\n\n```\nW(t) = 1/M * Σ_{n = t - M + 1}^{t} K(n).\
  \ (20.5)\n```\n\n426. 窗口大小 `M` 的选择至关重要，取决于 ECG 的采样频率。这种平滑处理有助于产生可靠反映 QRS 形形的波形，并便于峰检测。\n\
  \n5. **自适应阈值和决策：** 最后，应用公式 (20.6) 对积分后的信号 `W(t*)` 应用自适应阈值，以识别 R 峰的位置：\n\n```\nR[p]\
  \ = max(w(t).*T*) (20.6)\n```\n\n在这里，`T` 是动态调整的阈值因子，用于将真峰与噪声伪影分离。此外还采用了额外的决策规则（如峰宽和幅度检查）来减少误检。\n\
  \n虽然 Pan–Tompkins 算法是有效的，但在存在噪声或异常 ECG 形形的情况下，其性能可能会下降，导致漏检或虚假峰检测。为了解决这个问题，有必要对滤波器参数、阈值自适应和窗口选择进行优化。可以集成先进的方法（例如基于机器学习的阈值调优或滤波器设计改进）来提高鲁棒性，特别是对于移动或嘈杂环境的记录。通过此类优化增强\
  \ Pan–Tompkins 方法有望提高特征提取的效果 [34]。\n\n### 20.3.4 用于 CVD 分类特征选择的 OOA\n\n这是一种自然启发的群体元启发式算法，通过模拟鱼�的迁徙和捕食行为来解决复杂的优化问题\
  \ [35]。其设计使其特别适用于生物医学分类系统中的特征选择和参数微调任务。在研究中，采用了 OOA 来优化特征选择。该算法包含三个关键改进——自适应加权、柯西分布和\
  \ Fuchs 映射，以保持解的多样性。\n\n#### 20.3.4.1 初始化阶段\n\n算法从设置关键参数开始，包括种群数量（鱼�的数量）、搜索空间的维度（特征数量）以及上限和下界。每个代表潜在解的候选使用公式\
  \ (20.7) 在这些限制内随机初始化：\n\n```\nY[i] = L[b] + R(m, n) * (U[b] - L[b]) (20.7)\n```\n\
  \n其中 `Y[i]` 是第 `i` 个鱼�的位置，`L[b]` 和 `U[b]` 表示下界和上限，`m` 是鱼�的总数，`n` 是特征数量。\n\n####\
  \ 20.3.4.2 适应度评估\n\n初始化后，使用适应度函数衡量每个解的性能。在基于 ECG 的分类中，适应度函数通常源准确率或错误率 [36]。算法在每次迭代中使用公式\
  \ (20.8) 识别最优解：\n\n```\nY[best] = argmin O(Y[i]) (20.8)\n```\n\n其中 `O(Y[i])` 代表第\
  \ `i` 个候选的得分。\n\n#### 20.3.4.3 位置更新机制\n\n为了寻找更好的解并跳出局部最优，每个鱼�根据鱼�捕猎动力学的系列数学变换使用公式\
  \ (20.9) 更新其位置。对更新后的位置进行裁剪，以确保它们位于定义的边界内：\n\n```\nY[new] = max(min(Y[new], U[b]),\
  \ L[b]) (20.9)\n```\n\n这一过程确保了探索不会超出搜索空间，且所有解均可行。\n\n#### 20.3.4.4 探索增强\n\nOOA 集成了若干随机组件以增强搜索行为：\n\
  \n- **柯西变异：** 这允许在搜索空间中进行偶尔的长距离移动，有助于全局探索 [37]。\n- **Fuch 混沌映射：** 用于向优化过程注入不可预测性，减轻过早停滞的风险。\n\
  - **自适应加权：** 动态调整各项各项的影响，提高收敛可靠性。\n\n在第一轮位置更新后，使用第二轮公式 (20.7) 的随机采样重新计算一组新的候选位置。再次使用公式\
  \ (20.9) 对更新后的解进行边界处理。\n\n#### 20.3.4.5 选择与迭代\n\n\n\n\n对新生成的解决方案进行评估，如果任何方案比当前最佳方案有所改进，则将其替换较差方案。此过程反复迭代进行，当达到迭代次数或观察不到进一步改进时，算法将停止更新位置。\n\
  \n## 428.20.3.4.6 最终输出\n\n在优化运行结束，算法输出性能最佳解决方案，该方案对应于最有效的特征子集。优化后的特征集被传递给 `CNN`\
  \ 模型，由模型对 CVD 条件进行最终分类。\n\n## 20.3.4.7 使用 CNN 进行分类\n\n`CNNs` 因能够自动学习从低级边缘到高层语义概念的分层特征表示而广受欢迎\
  \ [38]。`CNNs` 广泛应用于许多领域，包括图像识别、目标检测和医学诊断。它们已成功应用于生物医学信号处理任务，例如从 ECG 信号中分类 CVD [39]。`CNNs`\
  \ 的结构和关键层所示图 20.4。\n\n![Figure 20.4 Structure of CNN.](img/9781041062943_C020_004.jpg)\n\
  \n**图 20.4** CNN 结构](#ch28.xhtml#f205b)\n\n一个 `CNN` 通常由几个基础层组成：\n\n1. **输入层**：对于基于图像或信号的任务，输入通常是代表多维数组（张量），表示像素强度或转换后的信号表示。输入的属性对应于数据的高度、宽度和深度（通道数）[40]。\n\
  \n2. **卷积层**：负责检测输入数据中的局部模式。它通过在输入卷上滑动多个小型滤波器（也称为卷积核）来实现这一点。每个滤波器与输入进行卷积以生成一个 2D\
  \ 特征图 [41]。输出特征图的大小取决于所使用的滤波器尺寸、步长（stride）和填充（padding），可以使用公式 (20.10) 计算：\n\n$S_{Z}\
  \ = \\frac{D - F_{s} + 2P_{a}}{S_{t}} + 1,$ (20.10)\n\n1. 其中 `D` 是输入维度，`F[s]` 是滤波器尺寸，`P[a]`\
  \ 是添加到输入边界的填充，`S[t]` 是滤波器移动的步长或步大小 [42]。\n\n2. **批归一化层**：该层通过调整激活值使其均值接近零、方差接近一来对进行归一化。批归一化通过减少内部协方偏移有助于稳定训练过程并\
  \ 429.加速收敛。它以每个小批量（mini-batch）为单位对后续层的输入进行归一化 [43]。\n\n3. **池化层**：例如，平均池化计算特征图每个区域的平均值，从而在降低分辨率的同时总结局部特征。池化还提供了一定的空间不变性，使网络对精确的特征位置不那么敏感\
  \ [44]。\n\n4. **全连接层**：位于网络输出端附近，全连接（密集）层的作用类似于传统的神经网络。它们接收来自上一层的扁坦化特征向量，并使用学习到的权重和偏置计算加权和，以生成最终分类输出。该层中的计算可以用公式\
  \ (20.11) 表示。\n\n$F = W[m] \\times v + b[i]$, (20.11)\n\n1. 其中 `W[m]` 表示权重矩阵，`v`\
  \ 是输入向量，`b[i]` 是偏置项 [45]。\n\n5. **激活函数：修正线性单元单元 (ReLU) 和 Softmax**：系统使用如 `ReLU`\
  \ 等非线性激活函数引入重要的非线性线性。对于负输入，`ReLU` 函数返回零；对于正输入，它返回输入值。\n\n$Re = max(0, X[i])$ (20.12)\n\
  \n1. 公式 (20.12) 所示的这种简单变换有助于网络建模复杂函数并缓解梯度消失等问题 [46]。在最后阶段，softmax 激活将多分类任务中的类别概率转换为概率。对于二分类，通常使用\
  \ sigmoid 激活 [47]。\n\n`CNNs` 通过其分层结构逐步学习特征。初始卷积层提取基本特征，如线条、边缘或颜色渐变。池化层系统地降低空间分辨率，有助于压缩信息并减轻计算负担\
  \ [48]。批归一化通过标准化激活值来支持一致的训练，从而稳定了梯度并提高了模型鲁棒性 [49]。\n\n在生物医学应用（如 ECG 信号）背景下，`CNNs`\
  \ 可以检测异常。它们捕捉空间和时间依赖的能力使其在这一目的上非常有效 [50]。\n\n## 20.3.4.8 统计属性\n\n为了评估所提模型的有效性，使用一组成熟的统计参数进行全面分析。这些包括准确率、灵敏度和特异性。这些分类结果主要分为\
  \ `Tpos`、`Fpos`、`Tneg`、`Fneg`。\n\n### 20.3.4.8.1 准确率\n\n在医学诊断中，准确率是理解模型有效性的基本重要标准。它使用公式\
  \ (20.13) 计算：\n\n$A = \\frac{Tpos + Tneg}{Tpos + Fpos + Tneg + Fneg}$ (20.13)\n\n\
  高准确率表明分类器通常做出正确的判断。然而，当数据集不平衡时，应与其他指标结合解释。\n\n### 20.3.4.8.2 灵敏度\n\n它是医疗保健领域的一个关键指标，因为漏检疾病可能会导致严重或威胁生命的后果。灵敏度使用公式\
  \ (20.14) 计算：\n\n$Sen = \\frac{Tpos}{Tpos + Fneg}$ (20.14)\n\n高灵敏度表示假阴性较少，确保系统在检测实际病例方面可靠可靠。\n\
  \n### 20.3.4.8.3 特异性\n\n特异性量化了正确识别负病例的比例。在医学应用中，这涉及到模型识别无疾病个体的准确性。减少假阳性对于避免不必要的医疗干预或焦虑至关重要。特异性的公式如公式\
  \ (20.15)所示：\n\n$Spe = \\frac{Tneg}{Tneg + Fpos}$ (20.15)\n\n与灵敏度一起，特异性有助于从患病和无病两个类别提供模型性能的平衡视角。\n\
  \n### 20.3.4.8.4 均方误差\n\n它在分析信号重建或输出图像时特别有用。MSE 值越低意味着预测精度越高。它使用公式 (20.16) 计算：\n\
  \n```\nMSE = m(sig)2\n```\n\n在这里，误差代表平均操作，它有助于对整个数据集平均这些误差。\n\n### 20.3.4.8.5 峰值信噪比\n\
  \n\n\n\n\n峰值信比（PSNR）是一种以分贝（dB）表示的比例值，用于比较信号的最大功率与干扰噪声功率之间的关系。它被广泛应用于图像质量评估，特别是比较原始医学图像与处理后的图像。较高的\
  \ PSNR 值通常意味着更好的视觉质量和更小的失真。PSNR 使用公式 (20.17) 计算：\n\n$PSNR = 10.log\\_{10}\\left(\
  \ \\frac{MAX\\_{1}^{2}}{MSE} \\right)$ (20.17)\n\n在这里，`MAX` 对于八位灰度图像表示 255。\n\n\
  ## 20.4 仿真结果与讨论\n\n本研究引入了一种复杂的深度学习框架，用于识别和分类三种心血管疾病：心律失常、冠状动脉疾病和主动脉疾病。诊断流程始于获取心电信号（ECG），这些信号来自已建立的公开的数据库，特别是\
  \ PhysioBank ATM 仓库。作为非侵入性诊断工具，ECG 捕捉心脏的电活动，通过分析 P 波、QRS 波群和 T 波等波形模式，在及时检测病理性心律方面起着工具性作用。\n\
  \n在这项研究中，ECG 数据收集自 30 个人，每人都被诊断患有一种一种心血管疾病。目标是设计一个全面且可靠的分类流程，能够区分不同疾病类别中的正常和病理性心律。三个不同患者的\
  \ ECG 信号如图图 20.5 所示。\n\n![Figure 20.5 输入 ECG 信号。(a) PE-1, (b) PE-2, 和 (c) PE-3。⏎](img/9781041062943_C020_005.jpg)\n\
  \n**图 20.5** 输入 ECG 信号。(a) PE-1, (b) PE-2, 和 (c) PE-3.⏎\n\n在获取数据后，原始 ECG 信号经过了采用信号融合技术的预处理阶段。具体而言，采用了多源融合策略，将多个\
  \ ECG 段整合成一个贯的信号表示。该方法通过整合来自不同时间范围的时间和形态模式来增强判别特征，从而提高分类的稳健性。对应三个代表性患者的融合信号显示在图\
  \ 20.6 中。\n\n![Figure 20.6 融合后的 ECG 信号。(a) PE-1, (b) PE-2, 和 (c) PE-3。⏎](img/9781041062943_C020_006.jpg)\n\
  \n**图 20.6** 融合后的 ECG 信号。(a) PE-1, (b) PE-2, 和 (c) PE-3.⏎\n\n下一阶段涉及从预处理后的 ECG 波形中提取特征。由于\
  \ Pan–Tompkins 算法在识别 ECG 信号中的 QRS 波群方面被证明是有效的，因此采用了该算法。算法按顺序应用滤波、微分、平方和积分，以分离 QRS\
  \ 波群，便于提取 RR 间期、波形幅度变化和心率变异性等关键生理特征。\n\n表 20.1 总结了研究的每种心脏状况通常相关的临床特征。例如，心律失常通常与不规则的脉搏模式和眩晕有关，而冠状动脉疾病表现为胸部不适和呼吸困难。主动脉疾病通常导致胸部或背部急性疼痛，偶尔伴有腹部附近的搏动。\n\
  \n**表 20.1** 不同疾病基于信号的特征⏎\n\n| **心血管类型** | **特征** |\n| --- | --- |\n| 主动脉疾病 | QRS\
  \ 波群增宽 |\n| --- | --- |\n| 心律失常 | RR 间期不规则，缺失 P 波/额外 P 波 |\n| 冠状动脉疾病 | ST 段抬高或压低\
  \ |\n\n特征提取之后，执行了优化阶段。这一步对于减少特征空间冗余、提高分类精度和最小化计算复杂度至关重要。利用了 OOA，它以其卓越的全局收敛能力和平衡的探索-利用动态而闻名。将其整合到特征选择过程中，对提高分类模型的效率和精度做了贡献。\n\
  \n对于分类阶段，采用了 `CNN` 架构，因为它在捕捉生物医学信号内部的空间和时间依赖方面具有卓越能力。`CNN` 不仅作为稳健的特征学习器，还充当主要分类器，根据学习到的判别特征将输入信号分为正常或异常类别。数据集包含\
  \ 30 个带标记的 ECG 信号，每个信号都根据是否存在病理状况进行了注释。\n\n`CNN` 生成的输出将信号分为两大类：\n\n* 正常：在临床接受的范围内，显示出规则节律模式和波形形态的\
  \ ECG 迹线。\n* 异常：反映出偏离的信号，例如 QRS 形态改变、T 波失真或预示潜在心脏功能障碍的节律不规则。\n\nQRS 波群的检测在此分类过程中起着关键作用，构成了准确识别心跳和节律评估的基础。\n\
  \n为了定量评估模型的性能，使用了几个标准评估指标：准确率、灵敏度、特异性、`PSNR` 和均方误差（`MSE`）。这些指标提供了对诊断准确性和分类后实现的信号质量的全面视图。所选三个案例的性能结果见表\
  \ 20.3。\n\n**表 20.2** 所提 CNN 框架的性能指标⏎\n\n| 参数 | ECG-1 | ECG-2 | ECG-3 |\n| --- |\
  \ --- | --- | --- |\n| 准确率 (%) | 98.76 | 98.84 | 98.57 |\n| --- | --- | --- | ---\
  \ |\n| 特异性 (%) | 95.96 | 96.24 | 95.82 |\n| 灵敏度 (%) | 97.58 | 98.01 | 97.43 |\n\
  | PSNR (%) | 48.27 | 49.68 | 47.98 |\n| MSE | 0.020 | 0.018 | 0.022 |\n| 疾病类型 |\
  \ 主动脉 | 心律失常 | 冠状 |\n\n表 20.2 显示了三种检测不同疾病的 ECG 模型的评估结果：主动脉疾病（ECG-1）、心律失常（ECG-2）和冠状动脉疾病（ECG-3）。每个模型都显示出优的准确率，接近\
  \ 99%，说明整体性能良好。特异性得分（模型识别健康个体的能力）在 95.8% 到 96.2% 之间。反映正确检测疾病患者能力的灵敏度值同样很高，在 97.4%\
  \ 到 98% 之间。衡量处理后信号质量的 `PSNR` 值持续较高，表明细节保留良好。低 `MSE` 值表明模型预测误差极小。这些结果证明了\n\n这些数值指标的图形化总结显示在图\
  \ 20.7 中，提供了三个患者分类效果的可视化对比。\n\n![Figure 20.7 统计参数的图形化表示。⏎](img/9781041062943_C020_007.jpg)\n\
  \n**图 20.7** 统计参数的图形化表示.⏎\n\n## 435.20.5 结论\n\n\n\n\n\n# 心脏疾病是全球首要死因，心律失常、冠状动脉疾病和主动脉疾病等状况显著增加了死亡率。早期且准确的诊断对于通过及时医疗干预和治疗降低这些率至关重要。本研究引入了一种基于\
  \ `CNN` 的深度学习框架，用于通过 ECG 信号分类心脏疾病。\n\n## 方法论\n\n研究使用的 ECG 数据来自 `PhysioBank` 数据库，这是一个广泛认可的生理记录集合。该方法通过数据融合结合来自多个源的信号，增强分析可用信息。在特征提取方面，应用\
  \ `Pan–Tompkins` 算法精确检测 `QRS` 复合，这对于理解心脏活动至关重要。\n\n为了优化模型的分类能力，使用 `OOA` 对参数进行微调并改进特征选择。通过检查准确率、敏感性和特异性来评估模型的有效性。准确率表示模型区分健康病例和疾病病例的能力；敏感性衡量其检测真阳性病例的能力；特异性则反映了模型正确识别健康个体的能力。\n\
  \n## 系统目标与影响\n\n该系统旨在将 ECG 信号可靠地分类为正常或异常类别，在提高诊断准确性的同时减少解读所需的辅助工作。这种方法具有加速诊断、支持临床决策，并最终通过促进早期发现降低致命性结果风险的潜力。\n\
  \n## 局限性与未来工作\n\n然而，该方法存在局限性。其性能严重依赖于训练数据的多样性和质量，这可能在应用于新型或罕见心脏疾病时限制其有效性。此外，深度学习模型通常缺乏可解释性，使得医疗提供者难以理解\
  \ `436.decisions` 是如何做出的。高计算需求也可能限制在资源有限的环境下的使用。\n\n未来的研究应关注于扩大数据集，包含更多多样化的心脏病例和患者人口统计数据，以增加模型的泛化能力。整合解释性特征的工作可以提高临床环境中的信任度和可用性。此外，开发实时监控和移动集成系统可以提供持续的心脏健康评估，提高可访问性并实现更早干预。\n\
