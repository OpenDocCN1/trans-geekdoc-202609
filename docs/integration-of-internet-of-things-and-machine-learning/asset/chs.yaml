  \ 升高）。这种关系是在预期之中的，因为交通量的增加通常会导致更高的排放。交通密度与电动充电站使用量之间的相关性中等，表明随着交通密度的增加，电动充电站的使用量也随上升。这可能表明电动汽车地区较高的流量会导致更多的充电。然而，AQI\
  \ 与电动充电 392.站使用量之间的相关性似乎较弱，意味着在该数据集中，空气质量并没有强烈影响电动汽车的充电习惯。\n\n![图 18.10 相关性热图。⏎](img/9781041062943_C018_010.jpg)\n\
