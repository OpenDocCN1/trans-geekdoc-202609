  \ Sugin 和 M. Kanchana\nDOI: [10.1201/978100363476812](http://doi.org/10.1201/978100363476812)\n\
  \n## 12.1 引言\n\n在我们生活的这个复杂世界中，国家、公司和人之间的互动众多且复杂。信息和通信技术（`ICT`）主要用于开展这些关系。随着在线设备数量的增加，试图利用系统漏洞的恶意用户数量也激增。这些恶意行为者可以使用各种攻击来针对组织、政府或个人。恶意活动范围从垃圾邮件或钓鱼等简单威胁、参数篡改，到更复杂的危险，例如高级持续性威胁（`APTs`）、僵尸网络或利用开源情报（`OSINT`）和域名生成算法（`DGAs`）的社会工程攻击。\n\
  \n网络安全专家旨在使用各种工具（如入侵检测系统（`IDSs`）、防病毒软件或防火墙）帮助客户保护其网络、系统和数字资产。这些工具通过各种正常交互和威胁交互产生大量的网络数据细节。此外，额外的活动日志和其他数字证据资产的适当组合对于成功执行安全生命周期至关重要。由于安全相关信息的建立，样本数据的自动分析和处理是实施自适应有效防御技术的关键步骤。因此，使用一种单一方法来分析这些日志以减少任务并支持分析师的决策是非常令人兴奋的。对于这项工作，我们的策略涉及开发无参数程序。\n\
  \n在研究中，我们分析并阐明了早期方法在当前网络安全背景下针对多个二分类问题进行数据压缩的使用。我们训练了一个机器学习（`ML`）系统，该系统通过归一化压缩距离（`NCD`）来识别描述每个问题相关不平衡网络数据的属性组，并利用这些特征进行数据分类。\n\
  \n\n\n\n\n在我们建议的方法中，创建了一种基于基尼不纯度的加权随机森林（`GIWRF`）模型，根据优先级选择关键且合适的属性。属性相关性评分通过使用基尼不纯度标准对树进行划分，并针对类别的不平衡分布修改随机森林（`RF`）算法的整体权重来确定。然而，对于基于机器学习（ML）的\
  \ IDS 框架，使用了数据集来创建 Ada Boost、梯度提升树（`GBT`）、决策树（DT）、门控循环单元（GRU）、长短期记忆（LSTM）和多层感知器（MLP）。在模型进行测试和训练之前，需要进行数据工程或数据预处理。数据预处理阶段由三个过程组成，将在本研究后续介绍。然而，为了进行分析，使用了网络数据集\
  \ UNSW-NB15 `[9, 10]`，这是一个包含现代攻击模式的较新数据集。\n\n本研究进行了一项使用监督机器学习模型的二分类任务。当监督机器学习方法被赋予将离散值分类为攻击实例或正常实例的任务时，就发生了二分类。该研究的数据集相当大，具有许多特征空间维度。选择一种属性选择策略来从海量数据集中移除不重要的特征，并在测试和训练步骤中仅使用关键特征集，这一点是至关重要的\
  \ `[11]`。在特征选择过程中减少相关数据集的方法被用于创建预测模型。大多数情况下，人们希望提高预测模型的性能。此外，不相关的特征会对模型性能产生负面影响。然而，由于\
  \ IDS 处理了许多具有冗余或无关属性的数据样本，这不仅增加了计算成本，还降低了检测分数的准确性 `[12]`。通过定位包含分类方法所需数据的相关属性，特征选择为\
  \ IDS 中经常发生的若干错误提供了解决办法 `[13]`。\n\n## 12.2 方法与材料\n\n需要注意的是，之前讨论的策略大部分是针对特定问题的。该领域缺乏一种能够从相似角度处理所有这些挑战的通用技术，尽管所描述的所有问题都包含了某种网络数据分析。在这一部分，讨论了一种基于压缩的分析（如\
  \ `NCD`）来提取定义数据集一组数值特征的通用方法。当给定文本 `T` 时，计算文本 `T` 与 `k` 个额外文本集（`g[1]`, `g[2]`, …,\
  \ `g[k]`，称为属性生成器 `AG`）之间的分离度是主要目标。这生成了一个包含 `k` 个数字的向量，在 `k` 维属性空间中表示文本 `T`，作为分类\
  \ `224.model` 的输入 [14]。然而，在本研究中，我们使用了机器学习分类器；需要强调的是，我们的与其他分类算法都可以配合属性提取。\n\n对于由两个不同类别数据组成的\
  \ UNSW-NB15 数据集，具体步骤如下：数据随机分为两组，`G` 和 `I`，每组包含 `m` 和 `n` 个数据。两组的两个类别数据集数量相等，因此它们都是平衡的。属性生成器使用第一组\
  \ `G` 构建。为了实现这一点，从 `G` 中的数据创建了 `k` 个仅包含一个类别数据的生成器文件。结果是每个类别都有 `k/2` 个生成器。在通过属性生成器的距离进行区分后，第二组（`I`）包含了用于指示分类器的数据集。为了得到向量，我们测量了\
  \ `I` 中每个字符串 `S[i]` 与每个 k` 个属性生成器之间的距离：\n\n```\nS[i] = (x[i 1], x[i 2], ..., x[i\
  \ k]) (12.1)\n```\n\n它用于描述数据 `S[i]`。以下方程提供了 `S[i]` 的组件 `x[ij]`：\n\n```\nx[ij] =\
  \ D(g[j], s[i]) (12.2)\n```\n\n其中 `D(g[j], s[i])` 表示字符串（`s[i]`）与生成器（`g[j]`）之间归一化条件的还原数据：\n\
  \n```\nD\\left( {g_{j~},~s_{i~}} \\right) = \\frac{C\\left( s_{i~|~~g_{j}~} \\right)}{C\\\
  left( {~s_{i~~}} \\right)}~ = ~\\frac{C\\left( {~g_{j}.~s_{i~}} \\right) - C\\left(\
  \ g_{j~} \\right)}{C\\left( s_{i~~}} \\right)}~~~$ (12.3)\n```\n\n点运算符用于表示总计，`C(s)`\
  \ 代表 `s` 的还原大小。我们在测试中使用 `gzip` 压缩器，因为它比其他压缩方法运行得更快。\n\n一旦利用 `I` 中全量数据的特征向量来训练一种分类算法，使用径向基函数（`RBF`）核来预测每项数据所属的类别。使用\
  \ Python 的 `scikit learn` 程序包来实现该方法，并使用接收机工作特征曲线测量值下的准确率和曲线下面积（`AUC`）来确定分类器的性能。机器学习模型的性能基于两个超参数：核函数复杂度\
  \ `C` 和宽度 `γ`，这些参数在每个 `k` 中通过引用 [14] 中定义的传统的五折交叉验证方法确定。![图 12.1 显示了从原始数据集到最终分类的完整过程。]\n\
  \n![图 12.1 所提方法的完整插图](img/978104062943_C01.jpg)\n\n## 12.3 网络数据集 UNSW-NB15\n\n该数据集由\
