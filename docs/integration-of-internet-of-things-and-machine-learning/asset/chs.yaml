  \ 最终模型。⏎](img/9781041062943_C022_009.jpg)\n\n**图 22.9** 最终模型。\n\n图 22.9 代表了动物检测系统的物理模型。该设置由盒子内的一个小森林组成，中间穿过一条道路，模拟了可能发生动物车辆碰撞的场景。PIR\
