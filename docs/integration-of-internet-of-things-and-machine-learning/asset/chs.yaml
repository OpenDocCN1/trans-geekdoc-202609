  \n# 115.7 用于提高作物产量的边缘计算与物联网技术\n\nRevanasiddappa Bandi\n\nDOI: [10.1201/9781003634768-7](http://doi.org/10.1201/9781003634768-7)\n\
  \n## 7.1 引言\n\n在印度，农业是大多数人收入的主要来源。人们注意到，过去十年农业业在作物发展方面没有很大进展。作物产量的下降是食品成本不断上升的原因。这种下降自\
  \ 2010 年以来已导致超过 4000 万人陷入贫困。导致这一现象的原因有多个，例如化肥使用不当、土壤肥力低、疾病、气候变化和水资源浪费。有效的农业干预至关重要，而物联网（`IoT`）与传感器网络以及机器学习（`ML`）算法结合提供了解决方案。它为实现农业智能化出了重大贡献，并能改变农业增长的进程。\n\
  \n`IoT`涉及三层，包括网络层、应用层和感知层。感知层的传感器和设备实时收集数据，然后对其进行评估以供进一步分析和预测。`IoT`网络层作为其基础设施提供通用服务。它指示了应用层和感知层如何协同工作。将行业特定技术与`IoT`相结合的层被称为应用层。几乎每个行业都在使用`IoT`，包括智能停车、智能建筑、智能农业、智能交通等。其中，农业是影响数百人的主要行业之一。\n\
  \n## 7.2 文献综述\n\nPatil and Kale [1]] 了一种与信息通信技术（`ICT`）相结合的智慧农业模型。`ICT`在农业领域一直非常重要。农村农民可能几个世纪以来种植相同的作物，但随着时间的推移，天气模式、土壤条件以及病虫害发生了变化。通过使用所提的方法，获取更新的信息使农民能够应对甚至从中获益。\n\
  \nCunningham and Holmes [2]] 认为`IoT`属性在蘑菇分级实践中可能有用。\n\nMinbo et al. [3]] 提出了一种`IoT`信息系统。\n\
  \nMohanraj et al. [4]] 解释了农民在作物生长不同阶段需要帮助，并且应该在正确的时间给予指导。\n\nSivakumar [5]] 解释了所有三个节点的传感器和微控制器已成功与`Raspberry\
  \ Pi`接口，并实现了不同节点之间的无线通信。\n\nRad et al. [6]] 提出未来世代的土豆作物需要可持续的实践、流程和系统。\n\n\n\n\n\
  Chandhini [7]] 提出基于物联网的农业生产系统建立在农民确保其土地在未来保持生产力的长期愿望之上。它还解决了社区对食品安全和环境保护的期望与关注。设计并实现了一个具有图形用户界面（GUI）的物联网农业生产系统，用于农场数据的进行实时监控和可视化。该系统集成了物联网技术来收集、分析和显示环境及作物相关的参数，从而实现农业生产中的高效决策。基于物联网的农业生产系统通过作物统计信息与农业环境信息之间的相关分析，增强了农民、研究人员和政府官员分析现状和预测未来收成的能力。此外，由于农民可以使用这种物联网的农业生产系统观察从种子到销售的全周期，农产品的质量可以提高。该生产系统可以改进以支持更多类型的产品并提供更多服务。利用物联网技术，可以显著提高农业生产效率。随着不断改进，农业物联网必须引领农业生产进入新时代。\n\
  \nSatyanarayana 和 Mazaruddin [8]] 描述了需要土壤环境监测系统的特定应用，并对监测系统中存在的问题进行了分析，因此我们设计并实现了一个基于土壤温湿度监测系统的无线传感器网络。该系统能够实现自动联网和实时数据采集、传输和显示，具有低成本、低功耗、灵活联网、无需布线、界面友好等特点。通过通用分组数据无线服务（GPRS）技术和\
  \ Web 服务技术，我们可以实现数据网络和远程监控功能；这表明该系统可以满足土壤环境温湿度监测和统一管理的要求。在未来，我们可以使用合适的传感器监测地下水位。此外，研究还可以加强，以产生一个能够监测州或国家等大区域整个天气状况的系统。\n\
  \n118.Managave 等[9]] 解释了无线传感器网络（WSN）在精准农业（PA）中的实施。由于该系统具有简单的用户界面（UI），农民可以方便地使用该系统。此外，系统会让农民及时了解田间发生的每一分钟事件，农民据此可以采取适当行动\
  \ [10]]。中央系统是 `Raspberry Pi`，它连接到 `Arduino UNO ATmega328P/Atmega16U2`（开发板），客户端通过\
  \ Wi-Fi 模块连接到路由器。路由器用于客户端通过 UI 访问网页 [ [[11]]。\n\nGonzález-Amarillo 和 Corrales-Muñoz\
  \ [12]] 展示了利用物联网进行幼苗记录和跟踪的温室追溯模型设计。开发了一个 Web 应用程序用于控制和监控温室，农民也可以利用该应用程序获取温室内开发的幼苗信息或产品收获信息。使用该系统，可以最大限度地减少用水量。\n\
  \nJosephine 和 Ramya [13]] 讨论了使用射频（RF）进行的小米作物预测，并实现了 99.74%的准确率。使用了土壤水分、最高温度、最低温度、湿度和降水量等不同输入。\n\
  \nMeeradevi 和 Mundada [14]] 陈述了使用线性回归技术进行作物产量预测。氮、磷、钾（NPK）、pH 和湿度由不同的传感器产生并存储在专用服务器中以便系统。\n\
  \n文献[15]]中的作者讨论了遥感系统如何在机器学习（ML）中广泛应用。系统使用 pH、温度、水分、降雨等传感器，并使用决策树、线性回归、梯度提升树（GBoost）等算法分析数据。在所有这些算法中，GBoost\
  \ 提供了最优预测 [17]]。该系统帮助农民根据环境条件预测种植作物种类。\n\nPriya 和 Yuvaraj [16]] 描述了系统利用了从不同传感器采集的湿度、温度、土壤水分水平和\
  \ pH 值。除了这些，在构建系统时还考虑了土地类型、土壤类型和种植面积等进一步参数。这些值被输入到开发的作物预测 GUI 中，并提供作物建议。使用深度神经网络（DNN）来预测所种的作物、产量范围和使用的肥料。\n\
  \nNarvekar 等[18]] 解释了物联网和无线传感器网络（WSN）的使用改变了我们收集和利用植物信息的方式。传感器可以追踪和预测作物和天气状况。通过卷积神经网络和数据集，识别出了马铃薯晚疫，并在土壤水分充足时实现自动灌溉。通过改进耕作方法并提供成本效益、一致的种植策略，农民将受益，从而提高农业水平。\n\
  \nBersani 和 Ruggiero [19]] 描述了农业中使用物联网解决方案导致了智能温室的发展。这些温室利用传感器和通信基础设施实时监控和收集数据，实现了对光、湿度、温度、CO[2]水平和通风的高效控制。\n\
  \nMamatha 和 Kavitha [20]] 提出了一种水培系统，其中使用有机椰壳基质代替了不可降解的岩棉。该系统在大规模实现了自动化，覆盖整个温室，不同作物在最佳条件下生长以获得最大产量。使用\
  \ K-近邻算法预测叶类蔬菜的绝对生长速率。营养液膜法（NFT）结合椰壳基质被证明是商业作物生长的最佳水培系统，准确率为 93%。\n\n\n\n\nML 是现代农业行业中使用的一项趋势技术。它有助于培育更健康的种子。在\
  \ ML 中，方法源自学习过程。这些方法论需要通过经验来学习以执行特定任务。ML 模型的性能随着时间的推移获得的经验而不断提高。一旦完成学习过程，模型就可以对数据进行假设、分类和测试。这是在获得训练过程经验后实现的。本研究的动机是在农业领域进行有效的开发。该研究旨在根据作物类型、面积、气候条件（温度和湿度）以及\
  \ pH 值来预测作物产量。实时数据通过使用 `Raspberry Pi` 的土地传感器进行采集，并上传到远程服务器。传感器数据将从服务器获取到集成开发环境（`IDE`），使用\
  \ ML 算法预测作物产量，如图 7.1 所示。\n\n![图 7.1 作物产量预测框图。⏎](img/9781041062943_C007_001.jpg)\n\
  \n**图 7.1** 作物产量预测框图。⏎\n\n对于 PA，我们拥有独立的系统来根据温度、湿度、pH 和土壤水分分析并预测作物产量：(1) 传感器数据可以通过电子邮件或短信息服务（`SMS`）获取。(2)\
  \ 进行实时分析用于监测植物生长。(3) 进行网络监控以实现持续警报和监测。\n\n## 120.7.4 拟议系统\n\n在这项研究中，开发了一个系统，用于根据不同地区根据温度、湿度、pH\
  \ 和土壤水分等参数预测不同作物的产量。为了通过传感器获取数据，我们使用了基于 `Flask` 框架的公共应用程序接口（`API`）。某区域作物产量的实时预测是使用\
  \ ML 算法（多元线性回归）完成的。数据挖掘通过逗号分隔值（`CSV`）文件导入多源数据来预测任何区域的作物产量。\n\n### 7.4.1 智能农业架构\n\
  \n系统架构是定义系统结构、行为和其他视图的概念模型。架构描述是对系统的正式描述和表示。系统架构由不同的组件组成，如 `Raspberry Pi`、传感器、模拟数字转换器（`ADC`、`MPC3008`）等。箭头的方向表示数据流的方向。一个基于\
  \ `Raspberry Pi` 传感器数据采集和分析的智能农业监测和预测系统如图图 7.2 所示。\n\n![图 7.2 智能农业架构。⏎](img/9781041062943_C007_002.jpg)\n\
  \n**图 7.2** 智能农业架构。⏎\n\n### 7.4.2 硬件元件\n\n接下来的章节将描述拟议系统中所使用的不同硬件和传感器。\n\n### 121.7.4.3\
  \ Raspberry Pi\n\n`Raspberry Pi` 是一种廉价的、信用卡大小的电脑，可以插入电脑显示器或电视机，并使用标准的键盘和鼠标。它是一个小型设备，能够让所有年龄段的人探索计算并学习使用\
  \ `Scratch` 和 `Python` 等语言进行编程。`Raspberry Pi` 运行 `Linux`，但它也提供了一通用输入/输出（`GPIO`）引脚，允许控制电子元件以进行物理计算并探索物联网。`Raspberry\
  \ Pi 3b+` 用于开发拟议的系统，如图图 7.3 所示。\n\n![图 7.3 Raspberry Pi 3b+.⏎](img/9781041062943_C007_003.jpg)\n\
  \n**图 7.3** Raspberry Pi 3b+。⏎\n\n### 7.4.4 温度湿度传感器 (DHT11)\n\n`DHT11` 温度湿度传感器具有带有温度和湿度传感器功能的校准数字信号输出。它与一个高性能的\
  \ 8 位微控制器集成。其技术确保了极高的可靠性和卓越的长期稳定性。该传感器包括一个电阻元件和一个用于湿性负温度系数（`NTC`）温度测量设备的传感器。它具有优异的质量、快速响应、抗干扰能力和高性能。每个\
  \ `DHT11` 传感器都具有对湿度校准室的极精确校准。存储在一次性可编程（`OTP`）内存中的校准系数是内部传感器在过程中检测到的信号，我们称这些为校准系数。集成了单线串口接口使其变得快速方便。其较小的尺寸、低功耗和长达\
  \ 20 米的信号传输距离使其适用于各种应用，甚至是最苛刻的应用。该产品封装在四引脚单行封装中，由电源电压（`VCC`）、数据（`Data`）、地（`GND`）和一个未连接（`NC`）引脚组成，如图图\
  \ 7.4 所示。\n\n![图 7.4 DHT11 传感器。⏎](img/9781041062943_C007_004.jpg)\n\n**图 7.4** DHT11\
  \ 传感器。⏎\n\n### 122.7.4.5 pH 传感器\n\npH 计 是一种用于测量酸碱性的隔离设备。从根本上讲，pH 计由电压表和电极组成，如图图\
  \ 7.5 所示。\n\n![图 7.5 pH 传感器。⏎](img/9781041062943_C007_005.jpg)\n\n**图 7.5** pH 传感器。⏎\n\
  \n### 7.4.6 土壤水分传感器 (Y38L69)\n\n土壤水分传感器或湿度通常用于检测土壤湿度。它由两部分组成：右侧的电子板和左侧带两个焊点的探针，如图图\
  \ 7.6 所示。该传感器有一个用于调节数字输出（`D0`）敏感度的内置电位器、一个发光二极管（`LED`）和一个数字输出，如图图 7.6 所示。\n\n![图\
  \ 7.6 (a) Y38L69; (b) Y38。⏎](img/9781041062943_C007_006.jpg)\n\n**图 7.6** (a) Y38L69;\
  \ (b) Y38。⏎\n\n### 123.7.4.7 模拟数字转换器 (MCP3008)\n\n`MCP3008` 是一个 10 位 8 通 `ADC`，如图图\
  \ 7.7 所示。它廉价、易于连接且不需要额外的组件。它使用串行外接口（`SPI`）总线协议，该协议由 Pi 的 `GPIO` 支持。`ADC` 还可以提供隔离测量，例如将输入的模拟电压或电流转换为代表电压或电流大小的数字。\n\
  \n![图 7.7 MCP3008 引脚图。⏎](img/9781041062943_C007_007.jpg)\n\n**图 7.7** MCP3008 引脚图。⏎\n\
