  ] | | UNSW-NB15 | 基于朴素贝叶的特征转换 | SVM | 93.75% |\n\n## 12.4 建议的方法\n\n为了提供比较，将使用熟悉的机器学习技术\
  \ (`DT`)、深度神经网络 (`LSTM`、`GRU`)、人工神经网络 (`MLP`) 和集成方法 (`AdaBoost`、`GBT`) 中的机器学习方法的结果，用于识别不平衡数据集中的入侵。研究的主要目标是针对不平衡数据集使用有效的特征选择策略。这些模型在\
  \ `UNSW-NB15` 网络数据集章节中描述的数据集上训练。建议的方法图如图图 12.2 所示。\n\n![图 12.2 基于机器学习模型的 IDS 框架建议](img/9781041062943_C012_002.jpg)\n\
  \n**图 12.2** 基于机器学习模型的 IDS 框架建议。⏎\n\n### 12.4.1 分类特征的编码\n\n`State`、`Proto` 和 `Service`\
  \ 是网络数据集 `UNSW-NB15` 中包含的三个分类特征。响应编码被用于转换 `UNSW-NB15` 数据集的字符串属性，而使用 `Label Encoding`（标签编码）来加密\
  \ `UNSW-NB15` 的分类特征。`Label Encoding` 中的每个分类特征都根据字母顺序确定一个不同的整数值。相比之下，编码技术显示了给定类别的信息实例属于特定类别的概率。针对\
  \ (`N`) 类分类，为每个类别构建了 `N` 个新特征，根据 227.category 数据值插入了信息实例属于每个类别的 (`P`) 概率。呈现数学表达式的一种方法是：\n\
  \n`P(X | B) = P(B ∩ X) / P(B)` (12.4)\n\n其中 `B` 代表特征类别，`X` 表示一个类。由于网络 `UNSW-NB15`\
  \ 数据集具有许多分类特征，其巨大的内存需求防止了其用于修改字符串特征。\n\n### 12.4.2 特征缩放\n\n数据集包含某些量级、单位和范围高度不可预测的特征。某些算法（如\
  \ `MLP`）因为数据集的高度变异性而做出错误的预测。此外，它还需要大量的计算能力。在归一化独立变量范围方面，一种常用方法是特征缩放。对于确定数据分离的机器学习算法，需要特征缩放。使用了两种常用的缩放特征。\n\
  \n### 12.4.3 基于基尼纯度的加权 RF\n\n`RF` 是一种支持不平衡数据分类的集成方法。该方法的目标是构建一个默认不识别多数类的分类器。加权去分类实例是由森林中树的基尼纯度决定的。在计算出每个节点的基尼纯度后，根据纯度的减少来选择特征。缩放的通用公式为：\n\
  \n`P(h) = (P(h) - min(h)) / (max(h) - min(h))` (12.5)\n\n### 12.4.4 评估指标\n\n\n\n\
  \n\n本次实验的目标是提高测试集中准确二分类结果的比例。采用了多种 ML 性能指标，包括假阳性率 (`FPR`)、`precision`（精确率）、`recall`（召回率）、`accuracy`（准确率）等，用于评估基于\
  \ ML 的 IDS 效果 [17]。然而，评估二分类情况下最常用的指标是准确率得分。它由下公式描述：\n\n$\\text{Accuracy} = \\\\\
  frac{\\left\\\\lbrack \\\\left( {~\\\\mathbf{TP}~ + ~\\\\mathbf{TN}~} \\\\right)\
  \ \\right\\\\rbrack}{\\left\\\\lbrack \\\\left( {\\\\mathbf{TP} + \\mathbf{TN} +\
  \ \\mathbf{FP} + \\mathbf{FN}} \\\\right) \\\\right\\\\rbrack}$ (12.10) 其中 `TN`\
  \ 和 `TP` 表示真负和真正。准确识别的攻击事件数量被称为真阳性率。被正确识别为正常的实例由 `TN` 计数。另一方面，假阳性（`FP`）是指被错误归类为攻击的真实流量数量。攻击的数量通过被误认为是典型实例的假负性（`FN`）案例进行计数。在入侵检测中，通常预期\
  \ `FN` 越少，因为它比 `FP` 具有更大的风险。尽管对于类别的不对称信息，特别是当目标是准确识别攻击时，在确定的原始值之外，还考虑了四个额外规则，如 `FPR`、`Recall`、`Precision`\
  \ 和 `F1 score`。\n\n### 1. `FPR`\n负性事件总数与误标记为正性的负性发生次数之比被称为 `FPR`。表达式描述如下：\n\n$\\\
  text{FPR} = \\frac{\\mathbf{FP}}{\\left( {\\\\mathbf{FP} + \\\\mathbf{FN}} \\\\\
  right)}$ (12.11)\n\n### 2. `Precision`\n当模型对实例进行正类预测时，`precision` 衡量预测准确的频率，以评估模型的性能优劣。可以使用下方的对其进行数学上的描述：\n\
  \n$\\text{Precision} = \\frac{\\mathbf{TP}}{\\left( {\\\\mathbf{TP} + \\\\mathbf{FP}}\
  \ \\\\right)}$ (12.12)\n\n### 3. `Detection Rate/Recall`\n它衡量了 ML 模型检测 `TPs` 发生情况的能力。`Recall`\
  \ 衡量了模型定位相关数据的精精确度。因此，它有时被识别为敏感度或 `TPR`。逻辑方程表示如下：\n\n$\\text{Detection~rate/recall}\
  \ = \\frac{\\mathbf{TP}}{\\left( {\\\\mathbf{TP} + \\\\mathbf{FN}} \\\\right)}$\
  \ (12.13)\n\n### 4. `F1 Score`\n`recall` 和 `precision` 之间的权衡通过考虑 `FP` 和 `FN` 决定了\
  \ ML 方法的整体准确率。下公式表示了 `F1 score`：\n\n$\\text{F}1\\\\text{~score} = \\frac{\\left(\
  \ {2*\\\\mathbf{Recall}*\\\\mathbf{Precision}} \\\\right)}{\\left( {\\\\mathbf{Recall}\
  \ + \\\\mathbf{Precision}} \\\\right)}$ (12.14)\n\n**表 12.5** 使用全属性 (49) 在 UNSW-NB15\
  \ 数据集上的 ML 算法性能⏎\n\n| **MLAlgorithm** | **Accuracy** | **Precision** | **Recall**\
