  \ \\[13]。`AI GestureDraw` 是基于计算机视觉和深度学习相关技术的坚实基础开发的。所提出的系统将允许人们通过手势创建一种交互式的绘画方式，从而可能加速绘画过程并通过\
  \ AI 辅助输出生成来提升水平 \\[14]。在完成草图后，系统会智能地分析绘画并给出特定任务的响应，使其成为各种应用程序的通用工具[15]。`AI GestureDraw`\
  \ 在允许流畅、引人的用户体验的同时，鼓励创造力，通过利用 AI 的分析能力，实时为草图赋予意义 \\[16]。该应用建议的方法涉及通过摄像头实时捕捉视频输入，如图\
  \ 14.1 所示，识别用户手势以解释他们的绘画，并根据绘画输入生成有意义的输出 \\[17]。\n\n```\n![Figure 14.1 AI 手势绘制工作流。⏎](img/9781041062943_C014_001.jpg)\n\
  ```\n\n**图 14.1** AI 手势绘制工作流。\\⏎\n\n图 14.1 所示的系统架构描述了所提模型的工作原理。首先，给出视频输入，这是通过摄像头；它捕捉用户的实时视频。摄像头首先检测用户。\n\
  \n\n\n\n\n图 14.2 展示了基于计算机视觉的 AI 接口如何操作。手部的关键点识别在第一阶段（图 14.2a–d）中演示，其中节点代表关节或手指，连接线（可能由姿态估计技术产生）创建了手的结构。活动手势检测在阶段（图\
  \ 14.2e）中演示，显示了原始视频流并使用边界框识别并跟踪用户的手。在最后一步（图 14.2f–h）中，显示界面，系统解码“数字 1”或“拳头”等手势，并产生标记为“答案”的\
  \ AI 输出。这展示了从手识别到手势解释的平滑过渡，为手语翻译、虚拟素描和基于手势的控制系统等应用开启了大门。\n\n手势识别模块能够识别多个命令。例如，当仅检测到食指时，系统能够进行“绘制”，但识别到五指全部合拢则会删除之前的画。缩放操作通过类似于食指和大拇指合并的手势进行，而除拇指以外的所有手指则代表视频冻结操作。一旦手势处理完成，将根据检测到的手势生成基于\
  \ AI 的输出。这种文本输出产生一个结果（如绘制空格或冻结区块）或系统响应的摘要。这种多层结构实现了实时手势识别、动作执行和反馈的无缝集成，适用于虚拟画板、手势控制演示或智能环境等应用。所有组件共同工作，提供了一个无缝且沉浸式的用户界面。\n\
  \n### 322.323.14.3.1 训练\n\n该模型用于涉及特征提取和分类的任务。它包含两个具有 16 个滤波器的卷积层（`Conv2D`）。虽然第二个卷积层将空间维度缩小到\
  \ (22, 22, 16)，但第一个卷积层生成的输出大小为 (48, 48, 16)。\n\n批归一化（Batch normalization）位于这些层之后，对特征图进行归一化以加速并稳定训练过程。模型具有有两个\
  \ `MaxPooling2D` 层，分别将特征图下采样到 (24, 24, 16) 和 (11, 11, 16)，以进一步缩小空间维度并避免过拟合。为了增强模型的泛化能力，每次池化操作后还使用了\
  \ `Dropout` 层，在训练期间随机移除部分神经元。图 14.2 中所示的图表显示了模型在跨多个 epoch 的训练和验证过程中的表现。训练和验证准确率的进展显示在准确图中。当训练准确率（蓝线）随着\
  \ epoch 的增加逐渐上升并接近 1.0 时，模型成功地从训练数据中学习。同样，验证准确率（橙色线）以极小的波动实现了极佳的准确率。由于训练和验证准确率之间的紧密对齐，模型似乎有效地泛化到了未知数据，而没有经历严重的过拟合。\n\
  \n损失和准确率图如图 14.3 所示。它显示训练和验证损失的曲线在同一时间段内都在下降。随着训练损失（蓝线）在前几个 epoch 中急剧下降，然后逐渐趋于零，模型在训练数据上的预测变得越来越准确。与训练损失类似，验证损失（橙色线）\
  \ 324 显示出类似的模式，急剧下降并稳定在低数值。对于训练和验证数据，模型整体表现优异，展示了高准确率和极小的损失。训练参数和验证参数之间的强相关性凸显了有效的学习和对未知数据的卓越泛化能力。这一结果表明数据集、模型架构和超参数都已为任务配置妥。\n\
  \n### 14.3.2 评估参数\n\n所提系统使用手势识别准确率（`GRA`）、延迟（`L`）和 AI 输出相关性（`OR`）来确保所提系统的性能。`GRA`\
  \ 使用公式 14.1 计算，有助于识别在执行的所有手势总数中正确手势的总数。\n\n`GRA = (T_correct/T_total) × 100%` (14.1)\n\
  \n其中 `T_correct` 是正确识别的手势数量，`T_total` 是测试的手势总数。`L` 使用公式 14.2 计算，有助于识别识别正在执行的手势的大致时间。\n\
  \n$$\\text{L} = \\frac{\\left( {\\sum\\_{\\text{i} = 1}^{\\text{n}}\\text{T}\\_recognize}_{\\\
  text{i}} \\right)}{}\\text{n}$$\n\n(14.2)\n\n其中 `T_recognize, i` 是识别手势 `I` 所花费。`n`\
  \ 是测试的手势数量。`OR` 使用公式 14.3 计算，有助于在接收到的输出总数中识别相关 AI 输出的数量。\n\n`OR = (S_relevant /\
  \ S_total) × 100 %` (14.3)\n\n其中 `S_relevant` 是评估者认为相关的 AI 输出数量，`S_total` 是评估的输出总数。\n\
  \n## 14.4 结果\n\n所提系统使用先进的手势识别技术，结合 `GenAI`，以确保响应和交互体验。该系统结合了计算机视觉、手部跟踪和 AI 驱动的能力，提供了实时的手势交互，设计用于创意、教育和解决问题的应用。它为用户提供了一个集成平台，用于可视化概念、执行操作并获取\
  \ AI 生成的答案。所提系统的结果展示了 AI 驱动的手势检测和交互应用的操作和输出。利用计算机视觉、手部跟踪和生成式 AI，该系统实时检查用户并开启了由手势驱动的交互体验。整个系统通过实时摄像头输入启动，其中\
  \ `cvzone HandTrackingModule` 获取并分析手势。当检测食指时，系统接收到该手势并开始跟踪其移动。然后用户就可以在虚拟画布上进行自由绘图（如图\
  \ 14.4 所示）。\n\n\n\n\n\n- **基于 AI 的解释：** 张起四根手指（如图 14.3 所示）可调用 Google 的生成式 AI 连接。它将用户的绘制存储为图像，并将其通过\
  \ AI 模型以生成上下文相关的响应。例如，如果画画布上勾勒出一个数学问题，AI 可以提供文本输出的解决方案（如图 14.5\n\n**图 14.3** 提议系统的准确率和损失图。#ch22.xhtml#f166b)\n\
