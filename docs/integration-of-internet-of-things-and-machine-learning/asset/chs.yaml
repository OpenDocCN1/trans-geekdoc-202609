  \n光电容积脉搏（PPG）是一种用于追踪组织微血管内血容量变化的流行无侵入光学技术。它对于可穿戴医疗技术至关重要，因为它能够实时追踪血氧饱和度和心率等生命体征\
  \ [1]。PPG 的原理是向皮肤发射光（通常为红光或红外光），并测量反射或透射的光。光强度随心脏周期引起的脉动血流而变化。PPG 信号的这些变化产生两个成分：交流电（AC）成分，与心跳相关并主要与生理测量有关；以及直流（DC）成分，与基线血量和静态组织有关。来自手腕或指尖的\
  \ PPG 信号通常以透射模式或反射模式记录。在反射模式下，光源和探测器都放置在肌肉的同一侧；而在透射模式下，光源穿过组织到达位于光源对侧的探测器。尽管这在可穿戴技术中上非常方便，但\
  \ PPG 信号极易受到多种伪影的影响，包括运动伪影、生理异常和环境光。这些噪声源会严重损害 PPG 信号的完整性，导致生理参数（如心率）估计错误 [2]。\n\
  \n需要一个强大的信号优性评估系统来解决信号可靠性的持续问题。信号质量评估（SQA）方法主要依赖于使用人工标注的人类员，这种方法是主观且耗时的 [3]。这导致了辅助信号的引入，特别是心电图（ECG），在这种情况下具有不可否认的优势。心电图记录心脏的电活动，是一种强中继信号，因为三种不同的信号——P\
  \ 波、QRS 波和 T 波都与心脏周期中不同不同的生理事件相关。尽管 ECG 具有明显的局限性（包括基线漂移、肌电图噪声和运动伪影等问题），但 ECG 仍然是基于心脏测量的金标准。基于\
  \ ECG 的 PPG SQA 系统通过利用 ECG 和 PPG 之间的功能关系，有可能提高 PPG 信号分类的准确性 [4]。在概述的方法中，可以将 PPG\
  \ 波形特征与从 ECG 中提取的心脏事件时间相匹配，从而将高质量信号段从受损信号段分离出来（图 16.1）。具体而言，ECG R 峰与相应的 PPG 脉冲之间的脉搏传输时间可用于测量同步性确认\
  \ PPG 信号的有效性。\n\n![图 16.1 ECG 和 PPG 波形关系。](img/9781041062943_C016_001.jpg)\n\n**图\
  \ 16.1** ECG 和 PPG 波形关系。#ch24.xhtml#f178b)\n\n深度学习（特别是卷积神经网络 CNN）的整合为信号质量评估增加了一个极其强大的新维度。神经网络（特别是类似于\
  \ AlexNet 的方法）通过从 PPG 信号频谱图图像中学习复杂的表示，能够实现信号质量的高精度自动分类 [[5]。CNN 可以发现指示运动损坏或噪声的细微模式，因为它们可以从时频表示中提取多个层次的特征。由于本研究旨在使用\
  \ AlexNet 将质量段分类为“高质量”，将仅对高质量段进行心率评估。质量评估后，在预处理的 PPG 波形上完成特征提取，以识别指示心脏周期的周期性峰值。心率源自脉冲间隔期（IPIs）；心率被确定为\
  \ IPI 的平均倒数。当从短时傅里叶变换（STFT）等谱分析方法推导时，也可以提取代表心率的主频。为了提供额外的鲁棒性，从 PPG 导出的心率的有效性需要与从\
  \ ECG 信号导出的心率进行交叉验证 [20]。\n\n新提出的 ECG 辅助 SQA 系统与常见的心率估计技术相比表现出优越的性能（图 16.2）。ECG\
  \ 辅助 SQA 在心率估计方面具有更低的平均绝对误差（MAE）（1.699 vs. 1.901 bpm），而且对低质量信号的剔除率更高（0.816 vs. 0.776）。心率估计的改进说明了在生物医学信号处理中集成更先进的生理知识神经网络模型的显著优势。最后，它通过确保生理评估仅使用高质量\
  \ PPG 数据，提高了可穿戴健康监测设备的可靠性。\n\n![图 16.2 所示的 ECG 辅助 PPG SQA 系统。](img/9781041062943_C016_002.jpg)\n\
  \n**图 16.2** 所示的 ECG 辅助 PPG SQA 系统。[#ch24.xhtml#f179b)\n\n## 16.2 文献回顾\n\n文献综述强调了数据增强策略对于增加训练数据量和多样性以提高深度学习模型性能有多么。它还强调需要标准的评估指标，以便比较各种策略的性能并确保研究的可重复性。然而，未来的研究需要恢复\
  \ PPG SQA 的准确性和可靠性，为了做到这一点，可以针对深度深度学习架构，并在使用数据增强时一致地应用其模型。大量文章关注于将深度学习引入 PPG 质量评估。最近的一项研究提供了一种利用多序列尺度数据和多类特征提高准确性的兴奋新方法。他们实现了\
  \ 94.21% 的最高准确率，并在混合模型中使用学习和决策规则来评估 PPG 信号的质量。在该模型中，学习和应用基于规则与基于学习的方法之间的权衡似乎已足够可靠地评估信号质量。此外，还应用了一种新方法，它仅学习了有限数量的可解释卷积核，并证明了在管理参数较少的情况下，表现出与深度神经网络相似的性能。在低功耗设备上，这种技术实现了有效、可靠且可解释的信号质量评估。\n\
  \n\n\n\n\n作者使用多尺度 CNN 和双向长短期记忆（LSTM），将多类特征与多尺度序列数据相结合，提出了一种评估 PPG 信号质量的新方法。与其他方法相比，所提方法的准确率达到了\
  \ 94.21%，为最高水平。文中并未专门提到在 PPG 信号质量评估（SQA）中使用深度学习的情况。该研究提出了一种结合了学习和决策规则的信号质量评估混合模型。为了帮助医生进行连续监测，研究建议了一种基于混合\
  \ `ResNet` 和 `bi-LSTM` 的深度学习模型 [6]，用于通过 PPG 信号诊断心血管疾病（CVDs）。蒙特卡洛丢弃（MCD）和贝叶斯优化技术被用于一种无袖指血压估计的保障性框架中\
  \ [7]。该框架的性能优于简单的 MCD，并能产生更准确的预测。`AvgPool_VGG-16` 是一种利用 PPG 信号和深度学习模型 [8] 对高血压分级进行分类的新方法。此外，为了对\
  \ PPG 信号进行去噪，提出了一种利用深度学习发挥小波多分辨率分析能力的混合方法 [9]。这项研究将定义带有修正线性单元（`ReLU`）激活函数的的最优滤波器数量（16,\
  \ 32, 64）和层数（2 层和 4 层），并使用不同噪声的隐藏 PPG 数据集评估所训练的 `CNN` 模型的鲁棒性 [12, 13]。Wang 等通过稀有\
  \ PPG 信号和 `CNN` 建立了一种基于 PPG 的 SQA 方法 [10, 11]，同时保留了最优边界。Sukor 等人 [14] 的研究使用了一种针对伪迹污染的\
  \ PPG 波形的自动拒绝方法，该方法检查了波形形态并使用了决策树分类器；然而，这些研究的复杂性较高。Li 和 Clifford [15] 引入了动态时间规整（`DTW`）技术来拉伸或压缩单周期脉冲波形以适应运行模板，并将其与其他信号质量指标相结合。同样，Couceiro\
  \ 等人 [16] 引入了一种基于 PPG 信号时域和频域特征变化的、并结合支持向量机（`SVM`）模型的运动伪迹检测算法。Cherif 等人 [17] 提出了一种新型的基于波形形态的自适应阈值方法，利用随机改变测试来识别\
  \ PPG 信号中的伪迹。Cherif 等人 [17] 展示了一种新型基于波形形态的自适应阈值技术，使用随机改变测试来识别 PPG 信号中的伪迹。Goh 等人\
  \ [18] 构建了一个 1 层卷积神经网络（`DCNN`）模型，将五秒钟的 PPG 段分类为清洁或受物体影响。Liu 等人 [19] 使用 `CNN` 和 `SVM`\
  \ 技术评估来自佩戴式额头脉搏血氧仪的 PPG 指征特征。因此，通过添加更多多类特征、研究提取多尺度序列信息的各种方法，并在更大、更多样化的数据集上测试所提方法，这些论文展示了未来研究增强\
  \ PPG SQA 的潜力。对于 PPG 信号质量的评估，他们建议对整合学习和决策规则的混合模型进行更多研究。这包括创建日益复杂的决策规则，并检查各种学习与基于规则的方法的组合。\n\
  \n## 16.3 提议的方法\n\n使用光学传感系统获取 PPG 信号是评估 PPG 信号质量方法的第一步。该设备被应用于指尖，通常由一个光电探测器和一个光二极管（`LED`）组成。`LED`\
  \ 发出的光进入皮肤并与下方的血管相互作用。随着心脏正常节奏收缩和舒张，这些血管中血量的变化会改变吸收的光量。在收缩期间血量增加，吸收光线并减少了到达探测器的光量。另一方面，在舒张期间血量减少，可以看到更多的光。原始\
  \ PPG 波形是通过将这些光吸收的变化转换为模拟信号创建的。\n\n该波形由一系列具有舒张波谷和收缩峰的周期性脉冲组成。舒张波谷显示出最低的血量和最高的检测光强度，而收缩峰代表了最大的血量和检测光强度的最低点。然而，运动伪迹、环境光干扰和传感器位置不当都会降低原始\
  \ PPG 信号的质量。使用了预处理技术，例如高通滤波或带通滤波（通常在 0.5–5 Hz 以内）来去除运动或呼吸引起的缓慢变化噪声。此外，还使用归一化来控制由手指结构、肤色或传感器位置变化引起的幅度波动。\n\
  \n在预处理信号后，通过定位收缩峰并确定 `IPIs`（连续峰之间的时间）来估算心率。根据这些间隔计算每分钟心跳数。为了提高可靠性，通过使用 `STFT` 进行频谱分析来识别主频率成分，提供了一种基于频率的心率估计方法。然而，输入\
  \ PPG 信号的质量对这一过程的准确性有显著影响。\n\n### 16.3.1 训练阶段\n\n提出了一种 ECG SQA 机制以提高心率读取的准确性（图 16.3）。ECG\
  \ 信号包含 P 波、QRS 复波和 T 波等独特波形，提供了心脏活动的可靠电学记录。电力和机械心脏事件之间的生理时间差导致 ECG 中的 R 峰与 PPG 波形中的相应特征对齐，以这种对齐作为指导来评估与\
  \ ECG 的同步性。如果 PPG 段不一致或显示出明显偏差，则将其标记为低质量且不再进一步处理。通过确保只使用精确、高完整性的片段，这种与 ECG 数据的交叉验证提高了\
  \ SQA 系统的稳健性。\n\n![图 16.3 训练阶段。⏎](img/9781041062943_C016_003.jpg)\n\n**图 16.3**\
  \ 训练阶段。⏎\n\n### 353.16.3.2 提议的 CNN 架构\n\n该系统使用 CNN 来自动进行评估，并以 `AlexNet` 作为核心模型（图\
  \ 16.4）。为了创建保留时间和频率信息的二维（2D）图像，首先使用 `STFT` 将 PPG 信号转换为时频图。在输入这些频谱图图像后，`CNN` 学习识别区分高质量与低质量信号的模式。`CNN`\
  \ 已训练能够识别传统过滤方法可能会忽略的细微失真或噪声特征。因此，系统具有了在广泛主题和情况下进行泛化的能力，这使其在实际应用中非常有用。\n\n![图 16.4\
  \ 提议的 CNN 架构。⏎](img/9781041062943_C016_004.jpg)\n\n\n\n\n通过一个输入层、多个卷积层（CL）、池化层、一个全连接层（FC）和一个输出层，CNN\
  \ 作为一个前馈网络运行。通过对输入数据应用滤波器，卷积层作为特征提取器，识别 STFT 图像中的关键特征和模式。池化层（也称为最大池化）在每次卷积后使用，用于降低\
  \ `354.feature` 特征图的维度并保留最相关的数据。通过在训练期间随机关闭特定的神经元，丢弃层（dropout）有助于网络避免过拟合，并提高模型对新数据的简化能力。\n\
  \n在这些层中，`ReLU` 作为主要的激活函数，因为它可以有效引入非线性，这有助于模型学习复杂的模式。所有提取的特征都由最后一个决策层（一个 FC 层）编译，该层随后采用\
  \ `sigmoid` 激活函数产生从 0 到 1 之间的概率分。该分数通过指示输入 PPG 信号属于高质量或低质量类别的概率，使得二分类变得更加容易。\n\n\
  在 ECG 引导架构中，ECG 和 PPG 信号被并发处理。在通过 ECG 通过 R 峰检测模块后，使用 R–R 间隔来计算心率。CNN 在分类 PPG 分段时使用此心率作为引导。在\
  \ PPG 信号输入 CNN 之前，它会并行经过预处理、特征提取并转换为 STFT 图像。系统通过将 CNN 分类结果与从 ECG 获取的参考进行比较，确保只使用可信的\
  \ PPG 分段进行心率估计。\n\n可以使用 `MAE`、均方根误差 (`RMSE`）和相关系数等多种指标来评估 CNN 模型。这些指标定义了 PPG 提示心率与心电图（ECG）参考心率的符合程度。根据实验结果，基于\
  \ ECG 的 SQA 系统在消除信号噪声方面更高效，提供的错误率比独立的 PPG 分析方法更低。总之，这种集成系统通过光学传感、信号处理、深度学习和来自 ECG\
  \ 的验证，为可穿戴医疗应用中的心率准确监测提供了一种可靠且可扩展的解决方案。\n\n## 16.4 数据收集\n\nPPG 信号质量的评估是准确监测血流和心血管健康的基础。传统方法需要人工审核，这可能非常枯燥且并不总是准确。CNN\
  \ 利用深度学习方法自动将 PPG 信号分类为高质量或低质量，以解决这一问题（图 16.5）。研究人员利用了 `Vital DB` 数据库，这是一个手术患者生命体征的公开数据库。使用手指传感器（`SNUADC`\
  \ 设备）以 125 Hz 的采样率采集了 200 个人的 PPG 信号。从这些数据中选择了 5,804 个信号段；其中 3,969 个被归为高质量，1,835\
  \ 个被归为低质量。ECG 信号作为专家审核产生这些标签的参考。消除了不确定或难以分类的信号。80% 的参与者数据用于训练，20% 用于测试。\n\n![Figure\
  \ 16.5 基于 CNN 的深度学习架构。](img/9781041062943_C016_005.jpg)\n\n**图 16.5** 基于 CNN 的深度学习架构。.\n\
  \n### 16.4.1 数据准备\n\n每个 10 秒的 PPG 信号段都使用 `STFT` 转换为 2D 图像，为 CNN 准备数据。通过显示信号随时间 `355.over`\
  \ 的频率变化，`STFT` 了 CNN 识别模式的能力。频率范围设置在 0 到 8 Hz 之间，并采用了大小为 256 的 `Hanning` 窗口。生成的\
  \ `STFT` 图像大小为 250 × 334 像素。CNN 经过训练以识别指示信号好坏的模式，并输入这些图像。高质量信号与 ECG 心率匹配良好且具有清晰的形状。质量差的信号包含噪声、模糊的模式或不匹配的心率。随后使用新数据评估了训练后的\
  \ CNN 模型区分好坏信号的能力。通过这种技术，PPG 信号检查变得更快速、更可靠，并适用于如医院设备或可穿戴设备等实时健康监测系统。\n\n## 16.5\
  \ 仿真与结果\n\n性能指标对于评估模型的性能至关重要。它们有助于确定模型完成任务的准确性、效率和可靠性。评估指标：准确率（accuracy）、精确率、召回率和\
  \ `F1-score` 显示了模型在分类问题中分类或分组的能力优劣。如果某一类占据绝对主导地位，准确率或正确预测的数量可能没有太大用处。精确率是在当假阳性成为问题时模型所做的正确正类比较的数量，它衡量了模型正类预测中正确的比例。召回率（有时称为灵敏度）是模型正确识别的正例数量，这在欺诈检测和医疗保健等应用中是一个受关注的指标。`F1-score`\
  \ 将提供召回率和精确率的合理总结。特异性（Specificity）监控模型检测负例的良好程度。通过利用所有这些重要指标，开发者将更好地了解其模型的性能，并注意到过拟合或偏差等问题，以改进模型。本研究将比较传统机器学习模型与所提深度学习模型的性能。我们将使用方向梯度直方图（`HOG`）从\
  \ 2D `STFT` 图像中提取特征，PPG 信号这是一种用于感知数据集中显著模式的常用特征提取策略。三三种机器学习模型——随机森林（`RF`）、`SVM`\
  \ 和多层感知器（`MLP`）使用这些特征进行训练。`MATLAB 2023a` 用于分析从每个 PPG 图像提取的 1,764 个 `HOG` 特征。原始 PPG\
  \ 波形也用于测试 `1D CNN` 以提供公平比较。本研究使用的基于 `STFT` 的 2D CNN 模型根据表 16.1 中的性能结果优于 `MLP`、`RF`\
  \ 和 `SVM` 模型。它显示出改进的指标。基于 `STFT` 频谱和 CNN 进行精确 PPG SQA 的优势通过 2D CNN 模型优于 `1D CNN`\
  \ 模型得到了进一步支持。\n\n**表 16.1** 不同方法的性能对比。.\n\n| **Methods** | **Sen (%)** | **Spe (%)**\
  \ | **F1-Score (%)** | **Acc (%)** |\n| --- | --- | --- | --- | --- |\n| MLP + HOG\
  \ | 91.5 | 83.1 | 92.5 | 89.2 |\n| RF + HOG | 91.4 | 87.6 | 93.3 | 90.4 |\n| SVM\
  \ + HOG | 93.0 | 68.2 | 90.8 | 86.2 |\n| 1D CNN | 97.1 | 93.5 | 97.6 | 96.6 |\n\n\
  ### 16.5.1 混淆矩阵\n\n二分类模型区分“好”和“坏” PPG 信号的能力在图 16.6 所示的混淆矩阵中详细说明。其中四个重要值：假阳性（`FP\
  \ = 31`），即“坏”信号被误判为“好；假阴性（`FN = 10`），即“好”信号被误分类为“坏”，真阳性（`TP = 437`），即模型正确识别了“好”信号；真阴性（`TN\
  \ = 174`），即模型正确识别了“坏”信号。\n\n\n\n\n\n为了评估分类性能并确定待改进领域，计算关键性能指标至关重要，而这通过混淆矩阵得以实现。\n\
  \n### 16.5.2 心率心电图 与 PPG 的估计\n\n图 16.7 显示了在 400 秒内使用 PPG 和 ECG 心率数据的对比。作为心率的参考标准，`ECG`\
  \ 信号由实心蓝线表示并保持相对恒定。相反，用红色表示的 `PPG` 心率信号在其持续时间内显示出差异，这表明 `PPG` 信号更容易受到噪声、运动伪影或可能损害心率准确性的外部影响的影响。尽管这种对比揭示了基于\
  \ `PPG` 监测的局限性，并再次强调了使用稳健的信号处理和质量评估方法的重要性，但鼓励在现实情况中使基于 `PPG` 的监测更具可重复性和可靠性。\n\n\
  ![图 16.6 提议信号质量评估的混淆矩阵。⏎](img/9781041062943_C016_006.jpg)\n\n**图 16.6** 提议信号质量评估的混淆矩阵。⏎\n\
  \n![图 16.7 ECG 与 PPG 的心率对比。](img/9781041062943_C016_007.jpg)\n\n**图 16.7** ECG 与\
  \ PPG 的心率对比。\n\n## 16.6 结论\n\n本研究通过实施一种 `ECG` 辅助的 `SQA` 系统，为基于 `PPG` 信号的心率估计提供了一个全面的深度学习框架。该方法识别了低质量的\
  \ `PPG` 部分并在心率估计之前将其剔除。具体而言，解决本研究问题的方法采用了 STFT 变换的 `PPG` 谱图，并使用 `AlexNet`（一种深层 CNN）进行分类；`MAE`\
  \ 和 `RMSE` 的改进表明，通过将从 `PPG` 与 `ECG`（无人公认的“金标准”）中收集和导出的心率联系起来，该过程保证了更好的性能、可靠性和更低的误差。\n\
  \n系统的准确性和可靠性由通过深度学习模型工程化的数据驱动，与传统用于 `PPG` 信号质量的基于规则的 `SQA` 相比，它提供了自动化的、数据驱动的分类。使用包含\
  \ 102 个人 600 秒连续 `PPG` 记录的数据集充分验证了建议方法的有效性。该模型以 98.3% 的准确率、98.9% 的灵敏度、96.7% 的特异性和\
  \ 98.8% 的 `F1` 分数表现优异。\n\n这些发现支持将生理信号交叉验证与深度学习相结合，以提供更可靠心率监测的可能。\n\n## 参考文献\n\n\
