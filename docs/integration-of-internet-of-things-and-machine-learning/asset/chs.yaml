  \n\n\n\n\n对古代印度文学中环境意识的研究，特别是针对《摩诃婆罗谭》（Mahabharata），为人类与自然和谐相处提供了重要信息。Mahata (2024)\
  \ 指出古代印度仪式和《吠俱陀》（Rigveda）等文学文本展现了对自然的深切尊重，自然不仅是一种商品，更是神圣的。Patra et al. (2016) 指出古代印度对河流、山脉和树木等自然元素持有巨大的尊重，并将“相互依存性”视为印度文明发展的核心。Prasad\
  \ (2015) 强调了人类与自然之间相互依存的关系，引用了《奥义树经》和《薄伽华奴歌》中描述的五大元素作为生命维持基础的意义，这些内容在当今的环境话语中仍然具有意义。在《摩诃婆罗谭》中，Jhaveri\
  \ (2006) 讨论了`Arjun`和`Krishna`对`Khandav Van`森林的破坏，这反映了与自然和谐相处的森林社会与正在破坏自然的城市力量之间的冲突。这是一个代表了当今环境损失的故事。Magar\
  \ (2020) 描写了《443.摩诃婆罗谭》中生态系统的灵性，主张`prakrti`（自然）与`purusa`（精神）之间的和谐以恢复宇宙秩序（`Rta`）并使环境免受伤害。Indriani\
  \ et al. (2023) 描述了`Pandava`兄弟`Nakula`和`Sahadewa`，他们对人道对待动物和恢复栖息地的承诺很好地说明了《摩诃婆罗谭》中的环境管理理念。这两个兄弟与自然的互动（表现为利用河流维持生存）是与环境互惠关系的表达。Devi\
  \ and Piraji (2023) 利用生态批评法说明了《摩诃婆罗谭》中自然是如何被描绘为仁慈与愤怒的，试图在自然界与人类之间达成和谐。\n\n### 21.2.2\
  \ 印度文本中的 NLP\n\n近年来，在古代印度文本上使用 `NLP` 变得越来越普遍。这使得古代宗教文化文本与当前的计算机方法相同步。Pare Guha 和\
  \ Patnaik（n.d.）的论文说明了一种在《薄伽华奴歌》中考虑正念的 `NLP` 方法。他们的论文使用`tokenization`（分词）、删除停用词和`lemmatization`（词干还原）来根据意识、专注和冷静等正念状态对诗节进行分类。他们的研究将古代精神文本与现代心理健康实践以及\
  \ AI 同步，并展示了 `NLP` 模型在数据和文化敏感性方面的缺失（Pare Guha & Patnaik, n.d.）。Tuhina and Vashist\
  \ (2024)](#ch29.xhtml#r693) 概述了 `NLP` 如何通过允许作者解决故事问题来支持创意写作。他们的研究概述了 AI 生成文学中的伦理问题（例如作者身份和偏见），并说明了\
  \ `NLP` 如何增强创造力、通过翻译提高文本的可读性，并为文学批评提供新方法。他们将 AI 和 `NLP` 视为创作工作的伙伴而非工具（Tuhina & Vashist,\
  \ 2024）。Geoffrey 等（n.d.）介绍了一种用于文本摘要和处理长文本的 `NLP` 工具。他们的工具利用`extractive`（抽取式摘要）和`abstractive\
  \ summarization`（生成式摘要）技术，支持学者研究关于流行的历史文本。通过对亚里士多德关于勇气的文本进行分析，该工具展示了其在当代全球问题（例如新冠肺炎）中的应用。这项研究证明了\
  \ AI 如何支持人文研究，并说明了为什么需要某些 `NLP` 算法（Geoffrey et al., n.d.）。Nigam and Chandra (2024)\
  \ 建议“法信息”（Dharmaśāstric Informatics），这是一个通过文本挖掘、基于 `NLP` 的`tokenization`、`sentiment\
  \ analysis`（情感分析）和概念标记来增强`Dharmaśāstra`文本的项目。他们的系统支持双语搜索、实时翻译和诠释，支持各个领域的研究并促进了全球范围内对梵文文学的获取。本文提到了引入\
  \ AI 以使古代印度学术研究对今天的学者更有用且易于获取（Nigam & Chandra, 2024）。Miyagawa et al. (2024) 使用`Word2Vec`\
  \ 和`stylometric analysis`（文体学分析）等计算机技术来分析吠陀梵文文本`Maitrayani Samhita` 和`Kathaka Samhita`。在本文中，他们展示了这些文本中语义相似性和编辑协作的模式，说明了古代文本是如何标准化的。这篇文章提到了计算机技术如何补充传统的文本研究，拓宽我们对吠陀文学的认知（Miyagawa\
  \ et al., 2024）。\n\n### 444.21.2.3 《摩诃婆罗谭》中的 NLP\n\n在《摩诃婆罗谭》中使用 `NLP` 为搜索这部史诗的社会关系、角色互动和情感基调引入了新方法。Mathangi\
  \ (2021) 采用`Latent Semantic Analysis (LSA)`（潜在语义分析）和局部加权 K 近邻算法等 `NLP` 技术，来确定《摩诃婆罗谭》中的人物网络。该研究能够识别主要的社会群体（包括`Pandavas`\
  \ 和 `Kauravas`），在无需了解角色的情况下证明了词向量技术在表征人物关系方面优于共现分析。Srijeyankesh et al. (2022) 利用`BERT`\
  \ 和 `GPT-2` 等复杂的 `NLP` 工具打破了情感和语义分析的边界。他们的工作绘制了《摩诃婆罗谭》中的情感和叙事发展，为这部史诗提供了计算增强的视角。Paul\
  \ and Das (2017) 将半监督学习工具`Named Entity Recognition (NER)`（命名实体识别）和`syntactic parsing`（句法分析）描述为角色识别活动。他们的研究证明了\
  \ `Neural Net` 分类器和 `FP-Growth` 算法如何提高角色识别的准确性，同时对文学结构进行高层次检查。Gultepe and Mathangi\
  \ (2023) 将定量社会网络应用于《摩诃婆罗谭》的人物网络。通过应用 `LSA` 和 `KNN` 等 `NLP` 技术，他们预测了人物关系并展示了 `Pandavas`\
  \ 和 `Kauravas` 之间的社会动态，同时证明了分析技术如何揭示历史著作中的复杂故事和社会关系。从文献综述来看，以往研究在《摩诃婆罗谭》中的环境意识以及使用\
  \ `NLP` 处理古代文本方面仍存在空白。尽管之前的著作（如 Mahata (2024)、Patra et al. (2016) 和 Jhaveri (2006);\
  \ Gadesha et al., 2022），在尝试表现可持续性的更抽象的主题或环境故事更具体的情感景观方面较少。\n\n\n\n\n本研究整合了自然语言处理（NLP）技术与机器学习技术，旨在分析《摩诃婆罗多》中的生态主题。通过情感分析、主题建模基于\
  \ `BERT` 的分类，本研究为古代文学如何参与可持续性、保护和生态平衡提供了一个计算视角。其方法论结构如下：\n\n1. **数据收集：** 《摩诃婆罗多》文本取自数字化的\
  \ `.docx` 文件。在 Excel 表格中指定了主题类别，如水资源保护、自然保护和生态灵性，并附带相应的关键词和同义词以便详细分析。\n2. **文本预处理：**\
  \ 使用 Python 的 `python-docx` 和 `nltk.tokenize.regexp_tokenize` 提取句子进行预处理，通过规范化确保一致性，为有效的\
  \ NLP 处理铺平道路。\n3. **关键词映射：** 将 Excel 文件中的主题话题和关键词应用于映射。选择包含关键词的句子进行研究，以侧重于环境议题。\n\
  4. **主题建模：** `LDA` 根据可持续性发现主题，聚类结果显示在森林保护、水资源可持续性和战争的环境成本上。\n5. **情感分析：** 将 `nlptown/bert-base-multilingual-uncased-sentiment`\
  \ 模型的情感评分（1–5 星）归类为负、中、正标签，以分析生态语言的情感基调。\n6. **情绪分类：** 使用 `cardiffnlp/twitter-roberta-base-emotion`\
  \ 模型对每个句子进行情绪分类（喜悦、悲、恐惧、愤怒），以衡量对环境的情感倾向性。\n7. **输出生成：** 将结果汇成一个包含以下数据的综合表格：\n  \
  \  * 文本中的句子\n    * 匹配关键词\n    * 主题类别（例如：水、保护）\n    * 情感标签和分数\n    * 主导情绪标签\n   \
  \ * 原始情绪分数\n    该表格保存为 Excel 文件，确保了分析的透明度和可重复性。\n8. **可视化：** 创建了各种可视化图形，如情感分布、情绪分布和词云，以展示发现。\n\
  9. **基于 BERT 的分类：** 在环境文本和《摩诃婆罗多》上训练的 `BERT` 模型将诗节分类在保护和水资源可持续性主题下。其上下文敏感性增强了准确性，为《摩诃婆罗多》中的环境话语提供了细致的分类。\n\
  \n通过结合这些先进的 NLP 技术，本研究为《摩诃婆罗多》中的生态主题提供了一个全面的计算计算视角。该方法论弥合了古代智慧与当代环境讨论之间的差距，为这部史诗中嵌入的可持续性概念及其与现代生态关注的相关性提供了见解。\n\
  \n## 21.4 发现与讨论\n\n### 21.4.1 摩诃婆罗多生态话语中的情感取向\n\n通过对图 21.1 所示的环境相关诗节进行详细情感分析，揭示了《摩诃婆罗多》环境话语中所蕴的情感底色。\n\
  \n![图 21.1 摩诃婆罗多中的情感分布。](img/9781041062943_C021_001.jpg)\n\n**图 21.1** 摩诃婆罗多中的情感分布。\n\
  \n#### 21.4.1.1.1 正向情感\n\n结果表明，文本对自然和可持续性问题的处理呈现出强烈的正向趋势，尽管负面和中性情感也有主要但对比明显的出现。正如情感分布图所示，大多数超过\
  \ 27,000 次提及的诗节带有正向情感。这种积极性的浪潮表明，《摩诃婆罗多》始终以敬畏、惊叹和深远的道德价值来描述自然。森林不仅被描述为地理位置，更是苦修之地和精神成就的场所。河流不仅是水体，还被尊为神圣的母亲和生命的赐予者。山脉、动物、树木和星辰交织着精神性、道德和情感故事，将自然世界从物质利用提升到了神圣的高度。这种强烈的正向情绪表明，《摩诃婆罗多》中的自然被认为是精神升华和道德正义所必需的。自然被描绘成一种值得崇拜、养育和感激的存在，而人与自然之间的共生互动被视为生存的理想状态。持续的正向情感定位，在这些概念正式形成几十年前就植入了一种敬畏的生态观和可持续性文化。\n\
  \n> 萨提随后说：“我向原始之者 Isana 俯首，众生向他献祭，他被众生崇拜；他是真实不朽的，梵，可感且不可感知的，永恒的；他既是不存在的，又是存在之不存在的存在；他既是宇宙，又独立于存在与不存在的宇宙；他是高低的创造者；是古老、崇高、无穷无尽的；他是毗湿奴，仁慈者也是仁慈本身，值得一切优待，纯洁而无瑕；他是哈利，感官的主宰，是所有灵动与不动之物的引导者；我将宣布显赫圣者雅沙那的神圣思想，以及在此受世人崇拜的伟大事迹。”\n\
  \n这段陈述是正向的，因为它赞美并尊崇了 Isana（湿婆的一种形式）的神圣特质，将其描述为不朽、永恒、纯洁和仁慈。所使用的语言强调了他至高无上的崇高本质以及作为万物创造者和统治者的角色，凸显了他在宇宙秩序中的神性和重要性。这种描述反映了深切的钦佩、敬畏和精神上的惊叹，这些共同构成了正向基调。\n\
  \n#### 21.4.1.2 负面情感\n\n相反，有约 12,000 个诗节被标记为负面语调。这些描述指向自然平衡被破坏的情况，通常是由于人类的贪婪、战争或伦理违规造成的。森林火、河流干涸、圣地的污染以及饥荒和生态灾难的记录被包含在此类中。负面情感的比例凸显了《摩诃婆罗多》对环境系统脆弱性的敏锐意识，并作为一个告诫滥用环境的故事。对自然毁坏或遗弃的情感表达包含了一个隐藏的道德教导：违背自然会导致精神和社会的崩溃。\n\
  \n> 恐吓寻求保护的人、杀害女性、盗取婆罗门的财产、以及伤害朋友，噢 萨克拉，我认为这四种行为中的每一种都等同于遗弃一个虔诚的人。\n\n这是一个这是一个负面陈述，因为它描绘了在伦理和道德上都是错误的行为，如杀害女性、抢劫婆罗门和伤害朋友。这些行为被认为是极具危害且不公平的，显示了对社会道德标准的违背。与遗弃虔诚者的对比进一步强调了此类行为的严重性和负面性。\n\
  \n#### 21.4.1.3 中性情感\n\n中性情感（少于 5,000 行）相对于负面和正向情感而言较小。这些句子通常是对自然的平实描述或仪式性的类比，在任何情感层面上都没有明显的感召。中性语调出现在描述某些国家的动植物、季节循环或王国地理范围的句子中。虽然在情感上是抽离，但这些句子通过创造生动的环境场景做出贡献，从而展示了自然现象在史诗世界中的无处不在和重要地位。\n\
  \n\n\n\n\n> 由于没能想出其他办法，我亲自下场以防止水流光。\n\n这句话具有中性极性，因为它仅仅报告了一项行动，没有表达任何强烈的情绪或价值判断，重点关注在特定情况下做出的实用主义选择。\n\
  \n通过这种方式分析情感极性可以发现，《摩诃婆罗多史》（Mahabharata）的生态话语不是单一的，而是复杂且动态的，它可以经历敬畏、尊崇、谨慎、哀伤和中性。积极情感的主导地位极大地指向了一种普遍的生态尊崇与和谐的哲学。情感分析表明，《摩诃婆罗多》中的生态叙事不仅仅是关于\
  \ 448.环境的故事，还将环境在情感上置于道德生活的核心位置。通过在环境困境周围放置高度的积极和负面情绪，叙事产生了一种道德想象力，使可持续性、和谐以及与自然的和谐成为有机价值。因此，通过情感取向描述的情感映射唤起了一种古老但无限细微的环境敏感性，这种敏感性对于我们当代的生态辩论仍然具有巨大的意义。\n\
  \n### 21.4.2 可持续性概念的主题表达\n\n对《摩诃婆罗多》通过可持续性类别强调环境主题的反应进行详尽审查，揭示了各种环境关注问题的偏好顺序。各种生态思想通过史诗中复杂的叙事网络获得优先考虑的方式，通过可持续性类别的分布反映出来，如图\
  \ 21.2 所示。所有类别中最占优势的主题是生态灵性，占据了分类诗节的大多数比例。\n\n![图 21.2 摩诃婆罗多可持续性类别的分布。](img/9781041062943_C021_002.jpg)\n\
  \n**图 21.2** 摩诃婆罗多可持续性类别的分布。⏎\n\n这种无处不在的存在告诉我们，《摩诃婆罗多》不断将环境元素与精神、道德和宇宙责任交织在一起。书中的自然往往不是一个被动的背景，而是一个与实现`dharma`（正义职责）相关的能量合侣。森林被描述为圣者的仙境，河流是女神，生物是天上的朋友。`生态灵性`的普遍性表明，古代哲学中的可持续性与宗教敏感性不可分地织在一起，其中环境管理是一种宗教责任，而不是一个物质问题。\n\
  \n> 我曾是一位名为`Sahasrapat`的离世者。正是因为一个`婆罗门`的诅咒，我才变成了一条蛇。\n\n> *第一卷 (Adi Parva)*\n\n\
  449.这节诗提到了人变成蛇的过程，反映了人类与动物之间的相互关联性，以及他们如何根据自己的行为发生相互转化。\n\n> 在万物之主`Pashupati`的命令下，我准备好变成一条虫或一棵有很多枝的树，这些都是`Sattwa`（和谐）、`Rajas`（拉性）和`Tamas`（黑暗）属性的结果。\n\
  \n> *教训卷 (Anushashana Parva)*\n\n同样，这节诗反映了`生态灵性`的概念，说话者表达了与自然融合的意愿，超越人类身份化身为宇宙秩序中的任何生命形式。它标志着所有生物的互连性和存在的流动性，强调了灵魂与自然世界之间的和谐，这种和谐由三`gunas`（`Sattwa`、`Rajas`和`Tamas`）支配。\n\
  \n在`生态灵性`之后，第二个主主题是`水可持续性`。《摩诃婆罗多》对河流、湖泊和圣水域极其重视，承认它们在维持生命、农业和仪式纯洁方面的关键作用。水主题的显著性表明早期就将水视为关键的生态和精神资源。强调河流的神圣性、通过神圣沐浴进行净化以及对污染水体的惩罚的叙事，展现了一个鼓励将节水视为道德必要性的故事。\n\
  \n> 我是`恒`，`Jahnu`的女儿。我一直被大圣者崇拜；为了完成天界的目标，我与你生活很久。\n\n> *第一卷 (Adi Parva)*\n\n在水灵性的背景下，这节诗将`恒`人格化为一个神圣的庄严实体，在宇宙秩序中起着至关重要的作用。`恒`被圣者尊敬并与天目的相关，象征着水净化、维持生命和提升精神的力量，体现了它的神圣本质以及与世俗和精神世界的深度联系。\n\
  \n> 然后，神圣而辉煌的海洋，作为雄性河流之主，被水生动物环绕，在幻象中出现在`Rama`面前。海洋的天才用甜美的语调对`Rama`说话，他被无数的宝石矿藏环绕，说道……\n\
  \n> *森林卷 (Vana Parva)*\n\n这节诗将海洋视为一个神圣且受尊敬的实体，象征着水广阔、赋予生命和神秘的本质。海洋被人格化为一个被水生生物和宝藏环绕的神灵，对`Rama`说话，体现了水在维持生命、财富和精神平衡方面神圣且本质的作用。海洋的存在强调了自然、精神与人类生命之间的互连性。\n\
  \n“随后，那些最优秀的战车（`Krishna`和`Arjuna`）驾着战车站在那片森林的两侧，开始在四周对居住在`Khandava`（集会卷, Sabha Parva）的生物进行大屠杀。”。这节诗象征着对自然的暴力破坏，`Krishna`和`Arjuna`杀掉`Khandava`森林中\
  \ 450.生物的行为代表了人类行为对环境的破坏性后果。森林在印度精神思想中通常被视为圣空间，作为更大宇宙秩序的一部分被破坏，凸显了自然资源保护与破坏之间的紧张关系，以及此类行为的业力报应。\n\
  \n> 圣贾亚说：“当名为`Narayana`的武器被唤起时，暴风开始吹起并伴随着暴雨，听听到雷声。尽管天空没有云。大地在震抖，大海在愤怒中涌起。河流开始倒流。噢，婆罗塔，山峰开始分裂。各种动物开始从`潘达婆`家族的左侧掠过。黑暗降临；太阳变得模糊。各种肉肉动物开始欢快地降落在田地上。神灵、`达罗婆`和`甘达罗婆`，噢君主，他们都感到恐惧。看到那种剧烈的动荡（自然界），他们开始大声互相询问它的……”\n\
  \n> *德罗奴卷 (Drona Parva)*\n\n这节诗象征着由暴力和战争驱动的人类行为所造成的灾难性影响，以唤起`Narayana`武器为例。暴烈的自然动荡——如河流倒流、地震和肉食动物的出现——代表了人类破坏自然平衡时产生的环境灾难。\n\
  \n\n\n\n\n> 它们还看到山丘上遍满了各种矿物，挤满了毗伽陀罗罗（Vidyadharas），四周被猴子、金那罗罗（Kinnaras）、金普鲁沙（Kimpurushas）以及甘达俱婆（Gandharvas）占据，充满了孔雀、妙伽罗（chamaras）、猿类、鲁鲁鹿（rurus）、熊、野马和水牛；溪流纵横交错，居住着各种鸟兽，并被大象点缀，树木茂盛，鸟鸣欢不已。在经过了许多国家和北库鲁输国（Uttarakurus）之后，他们看到了第一座山——凯拉斯山（Kailasa），那里充满了许多奇观。在山旁边，他们看到了那罗（Nara）和那拉亚那（Narayana）的隐居地，那里的天树四季开花结实。\n\
  \n这节诗描绘了一个诗意且充满活力的生态系统，动植物种类繁多，自然在这里和谐地繁荣。森林被各种生物栖息并被天树点缀，象征着一个未被破坏的神圣空间，孕育着平衡的生命。神圣隐居地的存在进一步强调了这种自然环境在古代思想中的神圣和精神意义。最后，主题制图揭示了《摩诃婆婆罗诗》中生存维持的层次结构：\n\
  \n* 生态灵性\n* 水\n* 灾害\n* 农业与森林\n\n451. 这种主题重点是对古古印度生态哲学的深刻洞察，表明环境意识必须置于宗教和道德语境中，而不能仅仅被视为一个实用性问题。\n\
  \n### 21.4.3 跨生态领域的词汇模式\n\n图 21.3 通过词云图可视化分析展示了词汇模式分析，这为研究《摩诃婆婆罗诗》如何表达其生态意识增添了深度。通过识别与可持续性课程相关的高频词汇，我们可以确定关键的环境主题，以及整部史诗中优先考虑的情感内涵。分类后的环境文本词云突显了如\
  \ `earth`（大地）、`river`（河流）、`forest`（森林）、`tree`（树）、`fire`（火）、`ocean`（海洋）、`sacred`（神圣）和\
  \ `destruction`（毁灭）等词汇。这些词在可视化中的尺寸和密度衡量了它们在可持续性叙事中的高频率和主题相关性。`earth` 一词占据了这一词汇场的中心，具有物理意义和精神层意义的双重内涵。在《摩诃婆婆罗诗》中，大地被反复拟人化为母亲，因为它代表了关怀、忍耐和力量。它的流行强化了文本深厚的生态根基，在这一语境下，生态健康与人类的道德行为是密不可分的。同样，`river`\
  \ 一词反复出现，证明了生态愿景中对水体的异常关注。河流始终被神圣化为生命的赐予者、仪式净化的场所和精神养分的来源。对恒恒河（Ganga）、`Yamuna`（雅穆纳河）和\
  \ `Saraswati`（萨拉斯沃蒂河）等河流的反复引用了一个事实：水的可持续性并非一种经验性要求，而是一种深层次的精神兴趣。`forest` 和 `tree`\
  \ 等词的出现是陆地生态核心性的指标。森林被定义为学习、冥想和庇护的神圣之地。对树的反复使用在符号和功能上都见证了对生物多样性及其在维持生态平衡中价值的欣赏。\n\
  \n452. 值得注意的是，`destruction` 和 `fire` 词也反复出现，特别是在灾害可持续性类别中。这些术语最可能指向灾难性事件，例如坎达瓦森林（Khandava\
  \ forest）被焚毁成毁灭，或其他由于人类活动导致环境破坏的故事。它们的使用证明了一种生态词汇体系，这种词汇承认毁灭是不尊重自然秩序所导致的真实且遗憾的后果。另一个无处不在的类别包括\
  \ `sacred`（神圣）、`divine`（神圣）和 `purity`（纯洁）等术语，这仍然证明了生态对象主要是用精神和道德词汇来描述的。自然不仅被感知，而且受到尊重，其保护是宗教义务和宇宙秩序的一部分。最后，词云提供的词汇密度为《摩诃婆婆罗诗》丰富的生态词汇提供了可靠的衡量标准。它表明，对可持续性的关注不仅通过显性词汇表达，还通过一种深层的符号化环境词汇表达，这种词汇始终指向自然的生存价值和精神价值。\n\
  \n![图 21.3 摩诃婆婆罗诗中跨生态领域的词汇模式。⏎](img/9781041062943_C021_003.jpg)\n\n**图 21.3** 摩诃婆婆罗诗中跨生态领域的词汇模式。⏎\n\
  \n词云显示了《摩诃婆婆罗诗》的环境想象力，具有广阔的愿景、情感的基调以及与其宇宙观和道德系统的深度参与。\n\n### 21.4.4 跨可持续性类别的情感叙事\n\
  \n《摩诃婆婆罗诗》中不同可持续性类别之间的情感分布显示了对自然细微的情感投入。通过将乐观、愤怒、悲伤和快乐等常见情感与主要的生态主题进行映射，该研究为如何策略性地部署情感来传递生态故事提供了更丰富的见解。图\
  \ 21.4 显示了与每个可持续性类别相关的主导情感，表明了史诗如何为环境话语的各个方面注入情感意义。\n\n![图 21.4 摩诃婆婆罗诗中每个可持续性类别的主导情感。⏎](img/9781041062943_C021_004.jpg)\n\
  \n**图 21.4** 摩诃婆婆罗诗中每个可持续性类别的主导情感。⏎\n\n453. 生态灵性课程本质上是乐观的。这种关联基于一个默含的假设：自然的和谐有助于精神的充实和社会福利。赞美神圣森林、圣洁溪流和大地母亲生命力量的赞歌唤起了一种明亮且乐观的愿景，在这种愿景中，生态平衡是可能且值得追求的。生态灵性的乐观让我们相信，古代人将可持续性视为一种与宇宙结构相协调的毫不费力且令人愉快的责任。形成鲜明对比的是，水的可持续性类别被压性的愤怒标记。这种情感反应源于有关水体亵渎、误用或污染的故事，这是一种严重的违背。《摩诃婆婆罗诗》中的河流不仅是生命的赐予者，还是精神上的净化者，亵渎会引发神灵的愤怒或灾难。水段落与愤怒情感的情感关联表明了对环境退化的敏锐道德意识，特别是对维持生命之资源的关注。灾害类别与悲伤相关。自然灾害如洪水和干旱，以及战争后的环境灾害，都是用巨大的哀伤和哀悼来描述的。这里的悲伤代表了不可持续活动所付的人力和环境代价，自然的流失是对当下和未来的损失。这种情感分配迫使我们意识到，忽视自然是以不可弥救的损害和集体哀伤为代价的。\n\
  \n\n\n\n\n因此，情感映射显示，《摩诃婆罗诗》中的生态故事在情感上是浓郁的，在策略上是微妙的。希望、愤怒、悲伤和喜悦并非随机分布，而是与主题关注点巧妙结合，旨在强调环境保护的道德和存在意义。此外，这种情感的范围也彰显了古代生态思想在没有内心独白情况下的深度。\n\
  \n---\n**Final Response structure (as requested):**\n[content] ... (formatted text)\
  \ ... \n\n\n\n第三，对包含“大地”、“河流”、“森林”和“神圣”等词汇的自然传说进行词汇分析表明，生态尊重已铭刻在语言之中。Jhaveri (2006)\
  \ 解释了《摩诃婆罗诗》如何通过生动的环境被亵渎故事（特别是在焚烧坎达瓦森林等事件中），来对环境退化产生强烈的情感反应（Jhaveri, 2006）。这种对语言的刻意使用赋予了生态事件情感、伦理和精神上的分量，这与词云分析的结果是一致的。\n\
  \n此外，情感映射显示对各种可持续性类别具有强烈的情感倾向：在生态灵性中乐观占主导，在水主题中充满愤怒，在灾难叙事中充满悲伤，在森林和农业主题中充满快乐。这一观察被\
  \ Indriani 等 (2023) 证实，他们指出潘婆人与自然的关系并非交易性的，而是本质上情感和精神性的，涵盖了生态损失期间的尊重、感激和悲痛（Indriani\
  \ et al., 2023）。同样，Brodbeck (2024) 揭示了地球的哀鸣以及时代末宇宙毁灭的描述是以忧伤、紧迫感和精神严肃性的交织叙述的（Brodbeck,\
  \ 2024）。因此，《摩诃婆罗诗》生态故事的情感丰富性立即反映在学术叙述中。\n\n扩展到现代背景，《摩诃婆罗诗》中的精神生态与 Magar (2020) 所指责的人类中心的世界观有显著不同，根据他的观点，现代环境危机源于对自然精神尊重的丧失（Magar,\
  \ 2020,](#ch29.xhtml#r683) 所论证的自然、人类与宇宙的互通性也证明了生态福祉与人类道德行为之间没有分离（Prasad, 2015）。《摩诃婆罗诗》将环境退化描绘为具有道德意义的，进一步凸显了古代生态学对环境退化的意义。对环境破坏的详细描述，特别是坎达瓦森林的焚毁，引发了强烈的情感反应，并突显了保护自然的紧迫需求。最后，环境问题的感性制图说明了多元的情感色彩：生态灵性情景下的乐观、水情景下的愤怒、灾难情景下的悲伤以及森林和农业情景下的快乐。这些情感基础展示了人物如何在精神和情感上与其周围相联系。\n\
  \n这些结果共同表明，《摩诃婆罗诗》为考虑环境可持续性提供了一种基于精神的方法。它对自然的可持续道德和情感反应提供了敏锐的建议。这些结果还为进一步研究提供了可能，即如何将《摩诃婆罗诗》的环境启示应用于指导当前的环境政策，特别是在可持续资源规划方面。此外，关于古代文献如何帮助解决现代环境主义的未来研究，也可以为古代理解如何帮助应对现代生态危机提供见解。其他古代文化书籍之间的比较研究也可以带来关于通用可持续性主题和生态灵性如何存在于所有文化中的见解。最后，对《摩诃婆罗诗》的生态思想与现代环境文学和哲学进行比较的研究，证明对今天的环境思想有巨大帮助。\n\
