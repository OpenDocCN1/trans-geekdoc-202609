  * Sim Chong Yuan\n* 清洁技术影响实验室\n* Taylor’s University\n\n# xviii.1.1 物联网的基础与挑战\n\n\
  Mohit Malik, Pooja Dhand 和 Parvinder Sandu\n\n\n## 1.1 引言\n\n物联网（IoT）的出现彻底改变了个人、网络和设备通过简单而易的相互关联对象系统与其他系统连接的方式。在过去的二十里，物联网已从一个学术概念转变为现实的运作，影响了制造业、医疗保健、农业部门和智能城市建设等行业。通过利用人工智能机器分析海量数据并预测结果，“万物互联”的人工智能技术改进了自动化和决策过程。区块链技术目前正在研究如何通过支持自主授权和信息一致性验证，来增强“人人网络（Network\
  \ of Everyone）”通信的安全性。由于物联网的不断进步，组织、议会议员和研究人员面临着许多机遇与挑战。为了促进物联网解决方案的有效采用，客户、政府机构和技术人员需要进行合作。为了在充分利用物联网的同时降低相关风险，企业必须将保护、无缝集成和环境责任放在首位。\n\
  \n## 1.2 文献综述\n\n\n\n\n# 研究概览\n\n本文讨论了云计算、移动传感器网络以及机器通信的集成使用。本研究将 `IoT` 引入为计算机范式的一种演进\
  \ [1]。这项研究概述了深度学习如何完美适用于智慧城市和医疗服务等 `IoT` 服务，因为该技术提供了卓越的特征提取和模型预测能力 [2]。\n\n## 机器学习与欺诈检测\n\
  \n研究调查强调了如何应用 `ML` 技术发现庞大数据集中的异常情况和模式，这些模式可能指向犯罪活动 [3, 4]。这项研究工作针对银行和保险行业中日益增加的先进欺诈操作。本研究研究了多种\
  \ `ML` 算法，以发现大数据集中的非法趋势 [5]。\n\n本文详细探讨了预测性 `ML` 方法在防御 `IoT` 设备网络中的重要性 [8]。这项工作研究了人工智能技术和学习算法在金融处理算法的风险缓解和欺诈识别中发挥的关键作用\
  \ [11]。\n\n本研究调查了 `ML` 和 `AI` 在金融交易平台风险缓解和欺诈识别中发挥的本质功能 [14]。此处的研究展示了 `blockchain`\
  \ 计算与计算智能的融合如何彻底改变银行欺诈预防的世界 [15]。\n\n## 行业特定应用\n\n### 智慧农业\n本文讨论了 `IoT` 如何在数据驱动下使农业自动监管和实时传感器成为可能，从而提高生产力和韧性\
  \ [6]。通过专注于精准耕作、疾病识别和资源优化，下文深入研究了智慧农业系统中 `ML` 驱动的 `IoT` 应用 [12]。\n\n### 医疗保健\n这项研究基于研究发现、技术以及海量信息，通过提供定制化治疗、降低成本和扩大患者满意度，转型了智慧医疗\
  \ [9]。本研究探讨了量子计算 (`QC`) 对制药和医疗行业的可能影响 [25]。\n\n## 先进技术与未来趋势\n\n根据研究发现，智能技术通过大幅提高欺诈者的检测和预防能力，正在彻底改变审计流程\
  \ [7]。\n\n当前研究显示了混合 `ML` 模型如何改变数字交易以及零售欺诈识别 [[16]](#ch09.xhtml#r016)]。通过提高人工智能结论的透明度和理解力，本文讨论了透明化\
  \ `ML` 如何改进欺诈识别系统 [17]。\n\n该调查由 `AI` 自动特征工程技术驱动，这些技术提高了欺诈检测模型的有效性 [18]。当前研究调查了智能驱动的网络评估的实现，用于识别支付中的非法趋势\
  \ [19]。\n\n为了缓解欺诈识别任务对海量标记数据集的需求，研究调查分析了利用 `transferred learning` 来使用已训练模型 [20]。\n\
  \n此处的研究突显了竞争性 `AI` 给欺诈检测系统带来的挑战，并提出了替代解决方案 [21, 22]。这项工作详述了 `quantum-enhanced learning\
  \ models` 的困难和潜在用途，本研究也对其进行了描述 [23]。这项研究关注算法突破、量子硬件进展以及这些方法在现实世界应用中的扩展 [24]。\n\n\
  ## 安全与基础设施\n\n调查强调了机密性、智能技术、防御竞争机制以及混合人工智能 (`AI`) 模型的重要性 [10]。这篇综述文章对用于金融网络欺诈识别的各种\
  \ `AI` 技术进行了全面讨论 [13]。\n\n本文对 `low-power wide-area networks` 进行了全面概述，其作为 `IoT` 的关键通信技术正在兴起。它设计用于实现低功耗的远距离通信，使其适用于能量受限的场景，例如远程传感器和\
  \ `IoT` 设备 [50]。\n\n\n\n\n\n\n图 1.1 IoT 的基础。#ch09.xhtml#f1b)\n\n## 1.3 IoT 框架\n\n\
  1. **通信：** 万物互联网是由互相互连接的项目组成的网络，这些项目可以传输信息、相互交互并执行特定任务，而不需要人类参与。\n2. **边缘计算：** 在\
  \ IoT 世界中，边缘计算的使用至关重要，因为它允许在数据产生处或非常靠近数据源的地方立即处理数据，减少了向位于云端的中央服务器发送大量信息的需求。除了降低延迟和提高安全性，它还提高了系统的效率。\n\
  3. **传感器和执行器：** 在机器人、自动化、智能制造和日益增长的万物互联（也称为执行器和传感器技术）领域，它们是关键部分。它们使得人们在现实世界中收集和通信信息变得可行，从而提高了组织的分析能力和反应能力。\n\
  4. **云计算：** 通过万维网，云计算技术提供了对存储、服务器、数据库、社交媒体、应用程序和统计等计算机设备的即时访问。消费者可以访问这些远程设施并仅对他们打算使用的部分付费，最大限地减少了购买和维护物理设备的需求。\n\
  5. **数据分析：** 收集、组织和评估由 IoT 设备、传感器和执行器产生的海量数据的技术被称为 IoT 数据分析。“实时决策过程、性能优化和有用知识的收集是其其目标之一。”\n\
  \n## 1.4 IoT 集成到机器学习（ML）中的优势\n\n1. **任务自动化带来的更高效率：** 应用创新技术来提高效率，并最大限度地减少执行工作所需的人力。效率和自动化的最终目标是在花费尽可能少资源和时间的情况下实现生产最大化。\n\
  2. **数据更高的可用性和可访问性：** 可用性和易用性对于提高各行业的决策水平、生产力和整体效率至关重要。公司和个人都可以通过增强数据的访问性并确保访问的简单性来提高盈利能力、做出更智能的选择并改进用户体验。\n\
  3. **改进系统和设备的监控与控制：** 实时监控和调节设备、系统和设备的运行涉及最新技术的实施。这提高了整体工作的信誉度，减少了中断并提高了生产力。\n4.\
  \ **提高数据采集和评估的能力：** 运营改进、预测建模和知情决策都依赖于成功收集和分析数据的能力。IoT、AI、大数据分析和自动化的进步都显著提升了信息收集和分析的加速、准确性和效率（[图\
  \ 1.2）。\n\n\n图 1.2 IoT 在 ML 中的优势。#ch09.xhtml#f2b)\n\n以下是展示 IoT 在多个领域中底层原理和相关问题的一些实例：\n\
  \n1. **微软云端研究：** 通过其微软平台，`Windows` 为智能设备提供基于云的计算、AI 和 IoT 解决方案。作为一个案例，微软被该公司在美国芝加哥的\
  \ `CityNext` 程序用于收集和分析与多个社区相关的信息。这允许市政当局通过提高公民平均生活环境水平来简化流程。这些包括环境监测、社区安全和交通控制。\n\
  2. **华为：** 华为提供广泛的 IoT 设备、云服务和网络组件，能够实现智能城市。例如，这家中国公司在中国深圳的智能城市技术结合了从环境监控、公共安全和交通网络收集的数据。\n\
  3. **约翰迪尔（John Deere）：** 支持 IoT 的设备、`GPS`引导的供应和统计分析解决方案构成了约翰迪尔公司提供的精准农业创新的一部分。这些解决方案使生产者能够最大限化播种、施肥和收割的收益。\n\
  4. **智能家居中的 IoT：Google Nest 和亚马逊 Alexa：**\n    * 通过 Google 的 `Nest` 和亚马逊的 `Alexa`\
  \ 等自动化家用，温度管理、照明和保护成为可能。安全风险：在家里使用支持 IoT 的电器时，可能会未经授权的使用和操控。\n5. **医疗保健中的 IoT：可穿戴健康监测设备：**\
  \ IoT 已被可穿戴设备（包括 `Apple` 和 `Pebble` 的手表）用于追踪运动、血氧和心率。智能手机提供了管理慢性疾病以及关注健康的即时信息（[图\
  \ 1.3）。\n\n\n图 1.3 不同领域 IoT 设备的案例研究。#ch09.xhtml#f3b)\n\n# 10.1.5 家庭技术中联网设备的应用涉及设备管理、加热和照明\n\
  \n1. **智能城市倡议：** 这些功能包括垃圾收集、低能耗建筑和交通监控。\n2. **医疗保健：** 自动健康监测系统和智能手表。\n3. **工业 IoT：**\
  \ 流程自动化和维护计划。\n4. **农业事务：** 自动化农业、土壤水分和精准农业。\n\n## 1.6 IoT 架构\n\n典型 IoT 架构的各个部分如下：\n\
  \n1. **感知层：** 感知层处理获取有关物理环境信息的传感器和执行器。\n2. **通信层：** 使用通信方法在不同设备和云服务之间传输信息。\n3. **中间件/处理层：**\
  \ 该层通常位于云端，负责信息处理、存储空间管理和分析。\n4. **应用层：** 该层提供特定领域独特的应用程序和功能（例如用于监控的医疗系统、家庭安全应用）。\n\
  \n## 1.7 连接挑战\n\n尽管 IoT 有许多优势，但它也存在一些缺点。\n\n1. **机密性和安全性：** 链接的机器面临信息泄露和数字威胁的风险。保持个人隐私和数据数据传输一直是首要关注的问题。\n\
  2. **互连性：** 由多个供应商制造的设备经常使用不同的接口，导致集成挑战。\n3. **灵活性：** 如[图 1.4 所示，在管理和决定由数百万连接产生的海量数据方面，技术面临额外的障碍。\n\
  \n\n图 1.4 IoT 的架构。[#ch09.xhtml#f4b)\n\n\n\n\n\n1. **数据管理**：必须建立一个可靠的平台，用于海量数据集的即时采集、保存、处理等的检索。\n\
  2. **功耗**：由于几乎每一个物联网设备都运行在电源上，节约能源是持续运行的必要条件。\n3. **流程标准化**：由于缺乏一致的需求，物联网生态系统发生了崩溃，这损害了消费者体验和合规性。\n\
