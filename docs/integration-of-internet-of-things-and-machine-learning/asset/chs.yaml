  \n# 333.15 使用混合小波去噪法改进胎儿心电图检测\n\nK. Naga Sankar Reedy, Peddapullaiahgari Hariobulesu,\
  \ Shaik Karimullah, Anwar Bhasha Pattan, Fahimuddin Shaik, and Mudassir Khan\n\n\
  DOI: [10.1201/9781003634768-15](http://doi.org/10.1201/9781003634768-15)\n\n## 15.1\
  \ 引言\n\n测量胎儿心电图（fECG）主要有两种方法：侵入性和非侵入性。非侵入性腹部心电图（ECG）记录包含母亲和婴儿心跳的信号。相反，侵入性方法需要在分娩过程中宫颈口打开后将电极准确地放置在婴儿头皮上[1]]。你可以通过在母亲腹部放置电极，在怀孕第一阶段就开始无手术地监测婴儿的心率。然而，来自电源线的噪声、皮肤电极阻抗以及母亲的肌肉活动往往会阻碍这种方法的运行[2]]。查看\
  \ fECG 以检查婴儿心脏状况并发现先天性心脏异常、心过缓、心过速和缺氧等问题非常重要[3]]。提取 fECG 数据有多种方法，即线性分解、自适应滤波和非线性变换[4]]。像单值分解（SVD）这样的线性方法将根据时间特频谱特征提供加性分离源，这些特征是基于可能是预先定义或数据驱动的基函数的[5]。一种盲分盲源分离（BSS）方法（如独立成分分析（ICA）及其变体）假设信号源矩阵在统计上是独立的。最近提出的周期分量分析（πCA）概念已被证明在有或无先验知识的情况下都可以作为一种半盲分离方法[6]]。在\
  \ fECG 数据被大量噪声污染的情况下，需要非线性方法，例如使用受干扰 334.信号的延迟副本来近似恢复其状态空间，从而继续使用主成分分析（PCA）或类似的方法来妥善滤波信号[7]]。这类方法确实相当良好，准确性显著提高，但计算量大，且可能取决于专家意见决定的主观边界[8]]。自适应滤波今天仍被频繁使用，但它通常需要来自母胎的\
  \ ECG 信号参考，而且如果它是独立的，则肯定需要来自母体心电图（mECG）的专用信号通道[9]]。在没有 ECG 参考源的情况下，可以使用连续消除法计算 fECG，尽管消除所有\
  \ mECG 活动并不一定会有令人满意的（图 15.1）。还有基于小波变换（WT）方法的变体也被证明也能达到良好的性能，特别是当将自适应阈值应用于小波系数时。扩展卡尔曼平滑器能够从单通道数据中提取\
  \ fECG，但当母亲和胎儿信号混合时它们会表现得很困难。总而言之，由于信号重叠和外部噪声，从腹部记录中提取胎儿 EC 是非常困难的[10]。复杂的信号处理技术对于提高信号质量和诊断水平是必要的。\n\
  \n![图 15.1 自适应滤波配置。⏎](img/9781041062943_C015_001.jpg)\n\n**图 15.1** 自适应滤波配置。⏎\n\n\
  提取 fECG 的方法有很多。卡尔曼滤波（KF）正成为减少自适应滤波中噪声的有效解决方案。建议可以使用扩展状态 KF 在混合的腹部信号后提取 fECG 数据。这种方法比标准的卡尔曼滤波方法更有效。最近，研究人员利用定性和定量测量研究了各种用于提取单通道\
  \ fECG 的方法。其中一项研究提出了一种新的自适应滤波方法来检测母腹部 ECG 信号中的胎儿 QRS 复合波。此外，还提出了一种自适应噪声去除器，它包含许多子滤波器以提供更好的\
  \ fECG。该研究非常丰富，335.且这些技术指向了利用不同技术来估计胎儿心率（FHR）的混合系统。然而，fECG 信号通常隐藏在腹部信号的噪声和伪影中，胎儿\
  \ R 峰无法被准确发现。在这些情况下，稳态小波变换（SWT）非常重要，因为它能够分析频率不断变化的平稳信号。SWT 是提取 fECG 的有用方法，它可以分解复杂的信号。这对于诊断出生前的异常特别有用。\n\
  \n## 15.2 文献综述\n\nCamps 等人[11]]建议使用有限脉冲响应（FIR）神经网络结合自适应降噪框架获取 fECG 数据。这种方法比典型的最小均方（LMS）和归一最小均方（NLMS）算法更好，因为它利用了非线性特征。它能够从模拟和真实的数据集中提取\
  \ f ECG。Sameni 和 Clifford[12]]对 fECG 信号处理的问题和未来进行了全面的评估。他们指出了重要的障碍，例如信噪比（SNR）低、缺乏基准数据库以及我们对心脏工作的了解较少。该研究还回顾了过去\
  \ 40 年信号采集和信号传输技术的改进。Kanjilal 等人[13]]提出了一种通过 SVD 提取单通道 fECG 的方法。他们证明了这种方法在分离母胎信号方面效果良好，且计算成本合理。Al-Zaben\
  \ 和 Al-Smadi[14]]在此基础上，创建了一种结合 SVD 和神经模糊推理系统的自适应消除噪声的混合方法。他们的解决方案结合了 SVD 产生的参考信号和模糊逻辑来改进滤波。它在合成和真实的\
  \ fECG 数据上均表现非常好。\n\n## 15.3 现有方法\n\n\n\n\n\n必须有一种方法能够正确找到胎心跳，以便在怀孕早期监测胎儿心脏健康状况。本文提出了两种使用递归最小二法（`RLS`）方法提取\
  \ fECG 数据的混合算法。准确找到胎儿 R 峰对于诊断和治疗先天性心脏问题至关重要。主要目标是从复合的腹部记录中分离出 fECG 信号。`RLS` 是自适应信号处理中常用的方法，用于减少噪声和分离信号\
  \ [15]。`RLS` 算法通过连续估计 `mECG`，然后随时间变化从腹部信号中减去估计的 `mECG`，使得剩余误差中的 fECG 更容易观察。`RLS`\
  \ 算法针对输入信号的不同时间点调整滤波器系数，以确保输入信号与参考信号之间的差异最小。`RLS` 的某些提取组件包括滤波器设置、残差计算、滤波器权重调整和卡尔曼增益计算。`RLS`\
  \ 非常适用于实时应用，因为它随着估计过程不断优化滤波器，使估计值更接近感兴趣的测量值 336。这些点使得 `RLS` 成为区分 fECG 与 mECG 及环境噪声的重要方法。\n\
  \n### 15.3.1 信号预处理\n\n- **带通滤波：** 对原始腹部 ECG 信号应用带通滤波器，以分离 ECG 的频率范围（例如 0.5–50 Hz）并去除高频噪声和基线漂移。\n\
  - **分段：** 如果为了处理效率需要，将信号分解为较段。\n\n### 15.3.2 RLS 滤波器设置\n\n- `RLS` 滤波器通过自适应最小化参考输入（`mECG`）与腹部\
  \ ECG（混合 `mECG` 和 fECG）之间的误差 `e(k)e(k)e(k)`。\n\n### 15.3.3 关键组件\n\n- **参考信号：** 从胸电极获取的洁净\
  \ `mECG` 作为参考信号。\n- **主信号：** 腹部 ECG，包含 `mECG` 和 fECG。\n- **滤波器系数：** 迭代更新的权重 `w(k)`。\n\
  \n### 15.3.4 滤波器方程\n\n- **预测误差：**\n`e(k) = d(k) − W^Tx(k)` (15.1)\n- 其中 `d(k)` 是期望信号，`x(k)`\
  \ 是输入向量（参考信号），`w(k)` 是权重向量。\n- **卡尔曼增益：**\n`$\\text{K}\\left( \\text{k} \\right)\
  \ = \\frac{\\\\text{P}\\left( {\\\\text{k} - 1} \\right)\\text{x}\\left( \\text{k}\
  \ \\right)}{\\lambda + \\text{X}^{\\text{T}}\\left( \\text{k} \\right)\\text{P}\\\
  left( {\\\\text{k} - 1} \\right)\\text{x}\\left( \\text{k} \\right)}$` (15.2)\n\
  - 其中 `P` 是相关矩阵的逆逆，`\\lambda` 是遗忘因子（接近 1 时适应速度越慢）。\n- **滤波器更新：**\n`w(k) = w(k−1) + K(k)e(k)`\
  \ (15.3)\n- **协方差更新：**\n`$P\\left( k \\right) = \\frac{1}{\\\\lambda}\\left\\\\\
  lbrack {P\\left( {k - 1} \\right) - K\\left( k \\right)X^{T}\\left( k \\right)P\\\
  left( {k - 1} \\right)} \\right\\\\rbrack$` (15.4)\n\n### 337.15.3.5 mECG 消除\n\n\
  字体 应用 `RLS` 滤波器自适应地从腹部 ECG 中减去（通过参考信号建模的）mECG`。\n- 输出 `e(k)e(k)e(k)` 主要是带有残余噪声的\
  \ fECG。\n\n### 15.3.6 后处理\n\n- 应用额外的滤波或降噪技术增强 fECG 信号。\n- 如如小波去噪或 `ICA` 技术可以进一步提高信号质量。\n\
  \n## 15.4 提议方法\n\n为了可靠地评估怀孕早期的胎儿心律活动，需要一种详细的方法来检测胎心跳。在本文，我们将提供两种结合 `SWT` 和 `RLS`\
  \ 算法的方法来恢复 fECG。在小波域中，我们将使用基于阈值的去噪技术或改进的空间选择噪声滤波 (`ISSNF`) 方法来增强 fECG 信号，去除噪声和伪影，并准确找到\
  \ R 峰。准确识别 R 峰有助于胎儿心脏异常的早期诊断和治疗，同时为医生提供有关胎儿状态的有价值演变数据。一个主要目标是从非常混乱的腹部 ECG 中产生清晰的波形\
  \ fECG。所提的方法首先使用 `SWT` 将腹部信号分离为多尺度成分。分解尺度可以根据噪声含量进行调整。在使用基于阈值的技术或 `ISSNF` 滤波方法抑制噪声之前，使用\
  \ `RLS` 算法抑制 fECG 中的母亲 ECG 成分。我们在合成数据集和真实数据集上使用了该方法。我们使用了定性和定量指标（如定性检查数据、识别 QRS\
  \ 复波和计算 `SNR`）来评估性能。实验结果表明，所提的方法优于传统方法，所得 `SNR` 一致，能够准确提取胎心活动（图 15.2）。\n\n![图 15.2\
  \ 提议方法的流程。](img/9781041062943_C015_002)\n\n图 15.2 提议方法的流程。](ch23.xhtml#f170)\n\n\
  `WT` 是处理生物信号的强大工具，广泛应用于噪声去除等领域。`WT` 没有任何限制，能够处理非平稳和时变信号，使其对 fECG 数据特别有用。小波处理允许进行更灵活的多分辨率分析，从而能够分析信号的低频趋势以及信号的高频成分。这对于\
  \ fECG 提取是必要的，因为胎心信号通常会丢失在 `mECG` 信号和其他噪声源中。此外，由于 `WT` 可能会跨多个频段，它为分离胎心活动提供了更大的能力。这里使用了\
  \ `SWT`，因为它提供了稳定的时频表示，这对于寻找 338.fECG 信号的动态特征非常有帮助。小波域也是过滤噪声的潜在路径，最终可以利用 fECG 信号的稀疏性和能量集中特征。我们在小波域使用\
  \ `RLS` 方法重构了提取过程，这为胎心属性提供了有用的能力。\n\n### 15.4.1 ISSNF 技术\n\n为了准确提取 fECG，需要开发一种基于小波分析的有效去噪策略，其衍生方法之一的空间选择噪声滤波器\
  \ (`SSNF`) 是分析生物信号和处理的稳健方法（图 15.3）。`SSNF` 可以有效去除噪声而不丢失原始 fECG 信号，包括由于波形形状、幅和频率内容产生的信号特征。`SSNF`\
  \ 方法可以在不改变 fECG 信号的情况下去除不需要的成分。重要的是，`SSNF` 可以拒绝多种干扰源，包括但不限于基线漂移、电源噪声和肌电信号噪声。在去除大部分（如果所有）噪声后，fECG\
  \ 信号可以提供诊断清晰度。\n\n![图 15.3 fECG 提取的方法。](img/9781041062943_C015_003)\n\n图 15.3 fECG\
  \ 提取的方法。](ch23.xhtml#f171)\n\n\n\n\n\n339. `ISSNF` 方法是传统 `SSNF` 的改进版本，用于提高 SNR 性能。该方法基于在每个小波尺度\
  \ `g` 下寻找信号不同部分之间的空间相关性 `CorR(g, k)`。该方法的核心思想是：信号分量在空间上具有更强的物理联系，而噪声分量的相关性较弱或不相关。`ISSNF`\
  \ 利用这种差异，倾向于保留信号中更重要的结构，同时消除不相关的噪声。这将有助于使信号的含义更加清晰，并确保获得最佳的 `fECG` 读数。\n\n### 15.4.2\
  \ 基于阈值的算法\n\n硬阈值和软阈值是小波域中用于去除噪声的常用方法。虽然软阈值通常非常擅长平滑地收缩小波系数，但在某些情况下，硬阈值已被证明具有更好的效果，特别是在侧重于保留信号中尖锐特征时。研究表明，硬阈值在配合非下采样小波变换\
  \ (`UWT`) 或 `SWT` 时运行良好良好。这是因为硬阈值能够在所有尺度上保留重要的信号模式。在这种情况下，描述了一种简单但有效的硬阈值算法。该算法是一种在保留\
  \ `fECG` 信号结构的同时实现去噪的简单方法。\n\n### 15.4.3 fECG 提取方法\n\n这项研究探讨了两种提取 `fECG` 信号的混合方法，因为腹部\
  \ ECG 信号是复杂且变化的。提出的方法提供了两种不同的处理路径，允许对两种方法的输出结果进行整体评估和比较。在方法 1 中采用了 `RLS` 算法、`340.SWT`\
  \ 和 `ISSNF`。方法 2 的安排类似，但它使用的是基于阈值的去噪方法而非 `ISSNF`。\n\n每种方法包含四个主要步骤：\n\n* 使用 `SWT`\
  \ 进行多分辨率分解\n* 使用基于 `RLS` 的自适应滤波消除母亲的 ECG\n* 使用 `ISSNF`（方法 1）或阈值法（方法 2）消除噪声\n* 测量并分析\
  \ `fECG`\n\n`SWT` 将腹部和胸部信号均分解为多个分辨率程度。我们评估了从 `MATLAB Wavelet Toolbox` 中选择的不同小波的重构性能。由于\
  \ `Bior 1.5` 的重构质量最好，因此选择了其重构性能。考虑到信号频率特性的性质，选择了五层分解。随后，在小波域内对近似系数和细节系数执行自适应 `RLS`\
  \ 滤波。腹部系数被视为主要输入，胸部系数被视为参考输入。这种自适应滤波技术将有效地开始隔离并消除 `mECG` 过程，同时仍将 `fECG` 过程置于其余信号之上。恢复的信号中可能仍存在伪影或噪声。方法\
  \ 1 使用 `ISSNF` 算法选择性地消除噪声。该算法假设信号分量在空间上强相关，而噪声分量相关性较弱。另一方面，方法 2 使用严格的阈值法在保留 `fECG`\
  \ 重要部分的同时消除噪声。对于每个小波尺度，都会对近似系数和细节系数计算空间相关性，以帮助去噪过程。我们评估了两种方法的发现，以查看它们保持信号完整性并使 `fECG`\
  \ 更清晰的效果如何。\n\n## 15.5 结果\n\n图 15.4 显示了方法 1 中 `fECG` 提取的信号处理的步骤。顶图显示了原始腹部信号，它是母亲\
  \ ECG、婴儿 ECG 和其他噪声信号的组合。该信号中的主峰大多由母亲的心跳引起，这可能会掩盖 `fECG` 的较小部分。中间图显示了从母亲胸部采集的胸部信号。其大部分是干净的\
  \ `mECG`。这种参考信号对于自适应滤波（尤其是 `RLS` 算法）非常重要，因为它让我们能够准确地估计从腹部信号中减去 `mECG`。底图显示了在使用 `ISSNF`\
  \ 算法、`SWT` 和逆小波重构等信号处理方法后提取的最终 `fECG`。生成的波形清晰地显示了胎儿活动，去除了大量的噪声和母亲伪影。这些结果表明方法 1 能够从复杂的腹部记录中分离\
  \ `fECG` 信号。\n\n![图 15.4 方法-1 处理的 ECG 信号。⏎](img/9781041062943_C015_004.jpg)\n\n\
  **图 15.4** 方法-1 处理的 ECG 信号。⏎\n\n图 15.5 显示了如何在使用方法 1 获取的 `fECG` 信号中寻找 R 峰。蓝色波形显示了提取\
  \ `341.out` 母亲 ECG 部分和噪声伪影后留下的最终 `fECG` 信号。该信号上方有红色标记，显示识别出的 R 峰位置。这些是每个心脏周期中最显著且快速的向上偏移。正确找到这些\
  \ R 峰对于确定 `FHR` 和在怀孕期间检查婴儿健康至关重要。R 峰的成功检测表明提取方法是有效的，且 `fECG` 的重要特征得到了保留。此外，准确识别\
  \ R 峰为验证整个信号处理流程的健性和准确性提供了方法。这些结果证明方法 1 可以可靠地从数据分离分离 fECG。\n\n![图 15.5 应用于 fECG\
  \ 信号的 R 峰检测过程。⏎](img/9781041062943_C015_005.jpg)\n\n**图 15.5** 应用于 fECG 信号的 R 峰检测过程。⏎\n\
  \n图 15.6 显示了方法 2 提取 fECG 的信号处理流程结果。顶部显示显示原始腹部信号，它是背景噪声、母亲 ECG 和 fECG 的混合。与方法 1 一，母亲的心脏活动是信号中最强大的部分，使得胎儿部分变得可见。中间图描述了从母亲胸部采集的胸部信号。它具有清晰的\
  \ `mECG`。这种参考信号对于自适应滤波寻找并去除腹部记录中的母亲信号非常重要。使用 `342.Method 2` 获取的最后 fECG 显示在底图中。在这种情况下，波形比方法\
  \ 1 获得的更尖锐、更明显且幅度更大。这表明方法 2 可能使用了更激进或改进的方法分离信号。这可能意味着胎儿信号得到了更好的隔离，但也可能意味着信号重构方法产生了一些放大效应。然而，恢复的波形清晰地显示了不同的胎儿心律，来自的干扰较少。结果表明方法\
  \ 2 能够分离 fECG，这对于后期分析（如估计 `FHR` 和出生前检查母亲健康）有用。\n\n![图 15.6 方法-12 处理的 ECG 信号。⏎](img/9781041062943_C015_006.jpg)\n\
  \n**图 15.6** 方法-12 处理的 ECG 信号。⏎\n\n\n\n\n\n图 15.7 显示了 R 波检测程序如何在通过方法 2 提取的 fECG\
  \ 数据上运行的。蓝色波形显示了在剔除母体部分并增强信号后的最终 fECG 信号。红色标记显示了识别出的 R 波，它们是每个心脏周期中幅度最大的点。这对于获取准确的胎心率（FHR）至关重要。与方法\
  \ 1 相比，方法 2 中的 R 波更尖锐、更清晰且更明显。这意味着方法 2 产生了更纯净、更强的 fECG 信号。观测到的峰值幅度超过了 200 个，这可能意味着信号变得更加清晰，或者在处理过程中加入了放大。对\
  \ R 波的准确且清晰的检测证明了方法 2 成功分离了心脏活动，同时保持了心脏形状完整，以便进行临床评估和持续胎儿监测。\n\n![图 15.7 应用于 fECG\
  \ 信号的 R 波检测过程。⏎](img/9781041062943_C015_007.jpg)\n\n**图 15.7** 应用于 fECG 信号的 R 波检测过程。⏎\n\
  \n344.通过对 12 个测试用例进行特征值分析，图 15.8 比较了方法 1 和方法 2 的信噪比（SNR）。数据显示，方法 1 总是获得更高的 SNR 值，在案例\
  \ 5 和 6 中出现峰值，SNR 超过了 4.5 dB。这意味着方法 1 在消除任何残留母体信号和噪声方面更擅长提取 fECG 信号。相比之下，方法 2 的可靠性较低，在某些情况下（如案例\
  \ 6）效果良好，但在其他情况下（如案例 9 345.and 10）显示 SNR 大幅下降。这种不一致性表明，方法 2 对于广泛的受试者或信号情况可能不够强健或实用。\n\
  \n![图 15.8 SNR 比较。⏎](img/9781041062943_C015_008.jpg)\n\n**图 15.8** SNR 比较。⏎\n\n\
  图 15.9 显示了互相关分析的结果，通过比较提取的 fECG 信号与理想参考波来检查 SNR。在案例 4 中，方法 1 再次显示出更好的性能，获得了接近 3.5\
  \ dB 的峰值 SNR，并在所有测试实例中保持了高值。这意味着使用方法 1 采集的 fECG 信号不仅更纯净，而且更符合真实的心律，这对于准确估计 FHR 非常重要。另一方面，方法\
  \ 2 提供的 SNR 水平较稳定但总体较低，通常在 2.7 到 2.9 dB 之间。这表明基准性能是稳定的，但也表明方法 2 在获得高信号纯度和与实际胎儿心脏活动同步方面存在困难。\n\
  \n![图 15.9 基于互相关分析的 SNR 评估。⏎](img/9781041062943_C015_009.jpg)\n\n**图 15.9** 基于互相关分析的\
  \ SNR 评估。⏎\n\n## 15.6 结论\n\n本研究通过将 RLS 自适应滤波与两种不同的去噪技术相结合，提出了一种估计 FHR 的混合方法。在方法\
  \ 1 中，在 RLS 和 SWT 的同时应用了基于阈值的去噪算法。在方法 2 中，将 SWT 和 RLS 结合。两种方法都在对胸部和腹部 ECG 信号进行分解后，在小波内利用\
  \ RLS 算法。所提技术有效地提取了 fECG 信号，即使在母胎信号叠加的情况下。使用 R 波检测和 SNR 分析进行的实验评估证明了两种方法的有效性。基于阈值的方法（方法\
  \ 1）在计算效率和增强 R 波检测方面具有优势。然而，这两种去噪方法对提取信号的清晰度和诊断可靠性都有所贡献。随后应用卷积神经网络（CNN）分类器进行胎儿健康评估验证了提取信号的质量。分类结果不仅显示了准确性的提高，还增强了提取流程的适应性。总体而言，所提方法在信号质量、鲁健性和诊断可靠性方面优于传统技术。\n\
