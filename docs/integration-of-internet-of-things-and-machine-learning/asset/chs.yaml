  \n\n\n### 概率预测\n输出每个类别的概率得分，有助于决策。\n\n### 正则化（L1 和 L2）\n防止过拟合并提高泛化能力。\n\n### 快速训练和推理\n\
  即使在大规模数据集上也具有高计算效率。\n\n### 适用于线性可分数据\n当类别呈线性可分时，表现良好。\n\n### 建议进行特征缩放\n在标准化或归一化的数据上表现效果最佳。\n\
  \n### 处理分类变量\n在编码得当（例如，独热编码）时，可以处理分类变量。\n\n### 对小数据集具有鲁棒性\n即使在训练数据有限的情况下也表现良好。\n\
