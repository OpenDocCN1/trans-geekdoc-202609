  \n\n\n所提模型使用了 `Adam` 优化器进行训练和调，学习率 `ε` 为 0.001，并采用均方根误差 (`RMSE`) 和平均绝对误差 (`MAE`)\
  \ 等性能指标。实验结果显示，该模型具有很高的预测准确性，其中温度预测的最大偏差为 0.48°C，降水预测的最大偏差为 7.5 mm/月。该模型还展示了一致的全球变暖模式，例如年均气温上升\
  \ 0.02°C/年，并能够捕捉高风险地区的降水异常。该框架也可应用于其他场景。它有助于资本资产的城市规划决策，对可再生能源预测非常有用，并通过提供气候相关灾害的预警来减少灾害风险。最后，建议在未来的工作中引入强化学习算法，以便在动态环境环境中部署后能够实现实地安排的自适应性。该框架通过整合先进的深度学习方法和高质量的环境数据集，代表了气候信息学的一大步。接下来的章节将提供模型概念和技术架构、数据流水线、实验验证以及操作用例的详细信息。\n\
  \n## 23.2 文献回顾\n\n准确的气候预测仍然是一项重大挑战，因为地球气候系统的本质是非线性的、动态的且多变量的。在过去的几十年里，对长期进行预测的标准方法主要是这类基于物理的数值模型，如广义环流模型\
  \ (`GCMs`)。这些模型通过一组在离散化空间网格上求解的偏微分方程，反映了大气、海洋和陆地表面的过程。它们提供了关于大区域气候行为的大量信息，但其缺点包括需要大量的计算时间、模拟的空间网格不够细，以及结果对输入不确定性敏感\
  \ [1]。\n\n为了弥补这些缺陷，科学家们越来越多地转向机器学习 (`ML`) 和深度学习 (`DL`) 方法。后者通过发现历史数据中隐藏的复杂关系和模式，能够发挥最佳性能，特别是在处理异构的大规模数据集时。基于领域知识的传统模型无法达到通过数据驱动方法开发的模型性能，即通过其性能技术的跨越式改进所达到的效果。\n\
  \n深度学习在环境领域具有优势，因为它能够高效地管理空间和时间数据。例如，`CNN` 已广泛应用于卫星航拍图像等地理空间数据集的分析。`CNNs` 最擅长识别数据对象的空间属性，这使得它们特别适用于气候研究中云层的时空分布、植被覆盖变化以及城市扩张检测的任务\
  \ [2]。`LSTM` 网络是循环神经网络 (`RNNs`) 的一种高级类型，被开发用于学习序列数据的长期结构，例如随季节变化的温度、空气中 `CO₂` 浓度的变化以及降雨季节的出现模式\
  \ [3]。\n\n最近的一系列研究证实了混合深度学习模型在气候相关应用中的性能非常有前景。Gao 等人 [4] 比较了空间和时间学习的效果，并证明不同 `DL`\
  \ 架构的组合可以显著提高多能预测结果。Moutis 和 Alizadeh-Mousavi [5] 在他们的研究中提出了用于实时变换器监控的数字孪生框架。该方法增强了电网的可靠性和运行效率，尽管大规模采用可能仍需要在不同的配电环境中进行校准工作。总的来说，这项工作强调了数字孪生技术在加强智能电网监控和预测性维护方面的实际潜力。\n\
  \n此外，基于自动编码器的聚类仍然是文献中的一种引人注目的尝试，旨在对天气模式进行准确分类 [6]。这些方法说明了无监督深度学习模型能够捕捉用于气候评估和政策引导的特征（见图\
  \ 23.2](#ch31.xhtml#f223)）。\n\n![图 23.2 传统与人工智能气候建模方法](img/9781041062943_02.jpg)\n\
  \n**图 23.2** 传统与人工智能气候建模方法。](#ch31.xhtml#f223)\n\n大多数模型并没有独立处理空间数据和时间数据，因此当特定的环境需求发生变化时，它可以为了适应新需求。\n\
  \n### 23.2.1 数据采集与处理\n\n准确的天气预测在很大程度上取决于数据的质量、多样性和详细程度。为了开发深度学习框架，采用了一个大型全面的数据集，包含了空间图像和通过传感器测量的测量值。这种多模态数据采集方法确保了空间模式和时间行为被准确表示\
  \ [7]。\n\n#### 23.2.1.1 数据源与类型\n\n数据集包含 2000 年至 2023 年 24 年的数据，并在以下数据流：\n\n1. *卫星数据：*\n\
  \   - MODIS 和 Sentinel 卫星提供了地表的高分辨率图像。\n   - 这些数据的关键特征是包含了地表温度 (`LST`)、归一化植被指数 (`NDVI`)、云覆盖和表面反射率。\n\
  \   - 按月或按季节定期下载并与区域坐标对齐。\n\n2. *IoT 传感器数据：*\n   - 这些建立在城市、农业和沿海地区的传感器网络，用于记录环境参数，如：\n\
  \     - 空气 (`^oC`)\n     - 降水量 (mm/月)\n     - 大气 `CO2` 浓度 (ppm)\n     - 湿度 (%)\n\
  \     - 风速 (m/s)\n\n两种数据的结合使得模型能够将热岛等空间模式和季风循环等时间行为整合到预测时间线中（见表 23.1](#ch31.xhtml#t59)）。\n\
  \n**表 23.1** 气候数据集特征概述 (2000–2023)\n\n| 数据源 | 参数 | 单位 | 频率 | 空间分辨率 |\n| --- | ---\
  \ | --- | --- | --- |\n| MODIS/Sentinel | `LST` | `^oC` | 月度 | 500 m 至 1 km |\n\n\
  \n\n\n\n| MODIS | NDVI | 指数 (0–1) | 双周 | 250 m |\n| :--- | :--- | :--- | :--- |\
  \ :--- |\n| Sentinel | 表面反射 | % | 每月 | 10–30 m |\n| IoT 传感器 | 空温度 | ^oC | 每小时 |\
  \ 特定区域 |\n| IoT 传感器 | 降水量 | mm/月 | 每日 | 特定区域 |\n| IoT 传感器 | CO[2] 浓度 | ppm | 每小时\
  \ | 特定区域 |\n| IoT 传感器 | 湿度 | % | 每小时 | 特定区域 |\n\n### 23.2.1.2 数据处理流水\n\n考虑到数据源的异质性和不同的格式，在将数据交给混合模型之前，使用了一个稳健的预处理工作流（参见图\
  \ 23.3）：\n\n![图 23.3 气候数据处理工作流。⏎](img/9781041062943_C023_003.jpg)\n\n**图 23.3**\
  \ 气候数据处理工作流。⏎\n\n1. **归一化**：为了转换所有连续变量，使用了最小-最大缩放技术，使数据能够拟合 `[0,1]` 区间。这对于提供变量在神经网络训练过程中的贡献对等性至关重要\
  \ [8]\\.。\n\n2. **缺失数据处理**：\n   - 在处理卫星图像数据时，由于云层覆盖或某些传感器问题，出现像素缺失是常见现象。\n   - 对于\
  \ IoT 设备，它们可能会受到网络断开的影响，导致时间戳缺失。\n   - 针对上述问题的解决方案是应用 K 近邻（KNN）插补，该方法基于数据的时空相关性，用于估计缺失值。\n\
  \n3. **特征工程**：\n   - 在这方面，我们不仅从原始特征中生成了新特征（例如温度异常），还重新计算了季节平均值，并计算了 CO₂ 的增长率。\n\
  \   - 与此同时，空间特征以类矩阵的形式获取以供 CNN 处理。此外，时间序列经过了形状处理以适应 LSTM 的读取。\n\n4. **数据分段**：\n\
  \   - 将数据集分为训练集（70%）、验证集（15%）和测试集（15%）。\n   - 避免时间洗牌，以确保季节性和逻辑一致性不被破坏。\n\n### 23.3\
  \ 建议的混合框架\n\n气候数据获取地点的增加需要建立良好的模型，这些模型应该熟练地涵盖空间和时间领域。为了实现这一目标，我们建议的方法利用了 CNN 擅长空间模式识别的优点以及\
  \ LSTM 网络在学习随时间序列方面的有效性 [9]\\.。该架构的共享特性培养了系统提取多变量数据之间复杂的依赖关系，这种操作对长期预测预测准确性产生了显著影响。\n\
  \n#### 23.3.1 架构概述\n\n混合深度学习模型由三个主要模块组成：\n\n1. **基于 CNN 的空间特征提取器**：\n   - 使用遥感数据解释\
  \ LST 和 NDVI 图，然后通过卫星传感器处理，以建立空间信息，如温度分布和植被特征。\n   - 应用各种卷积和最大池化层来过滤层，并利用减少的维度和抽象信息来调整空间特征。\n\
  \   - 将最后一层的特征向量与时间输入拼接，产生集成向量。\n\n2. **基于 LSTM 的时间分析器**：\n   - 从 IoT 设备获取时间序列数据（例如温度、湿度或空气质量）并输入系统。\n\
  \   - 涵盖数据季节性、周期性以及随时间增长的多值循环，这是通过在多年中堆叠 LSTM 层实现的。\n\n3. **全连接决策层**：\n   - 结合来自\
  \ CNN 和 LSTM 块输出的特征图。\n   - 实现一个具有大量神经元的层，每个神经元都有非激活的概率，以调节结果网络的学习过程。\n   - 生成来自不同来源的变量预测（例如温度、降雨量、CO₂\
  \ 水平）。\n\n### 23.3.2 模型配置\n\n深度学习模型（参见图 23.4）使用 TensorFlow 实现，参数如下：\n\n![图 23.4\
  \ 用于气候预测的混合深度学习框架。⏎](img/9781041062943_C023_004.jpg)\n\n**图 23.4** 用于气候预测的混合深度学习框架。⏎\n\
  \n1. **CNN 参数**：\n   - 三层卷积大小为 3 × 3 的卷积层，后跟 ReLU 激活。\n   - 2 × 2 滤波器的最大池化层。\n \
  \  - 为了降维，有一个平坦化层。\n\n2. **LSTM 参数**：\n   - 有两个 LSTM 层，分别具有 128 和 64 个隐藏单元。\n  \
  \ - 序列返回（Return sequence）允许堆叠。\n   - 丢弃率：0.2。\n\n3. **最终稠密层**：\n   - `Dense(64)`、`Dense(32)`\
  \ 和输出层。\n   - 隐藏层使用 `ReLU`，预测使用 `linear`。\n\n#### 23.3.3 训练配置\n\n- 优化器：`Adam`\n\
  - 学习率：`0.001`\n- 迭代次数（Epochs）：`100`\n- 损失函数：`均方误差`\n- 批量大小（Batch Size）：`32`\n\n\
  #### 23.3.4 模型训练与优化\n\n在训练期间，通过验证损失的平台作为避免过拟合的手段。为了判断进度，使用了均方误差（MSE）和 MAE（参见图 23.5）。\n\
  \n![图 23.5 模型训练损失](img/9781041062943_C023_005.jpg)\n\n**图 23.5** 模型训练损失。⏎\n\n###\
  \ 23.3.5 实验结果与讨论\n\n建议的混合框架的实验验证涉及多次测试，使用了 23.3.1 节提供的预处理气候数据。评估针对模型的三个重要方面：预测准确性、模型泛化能力以及传统的单流深度学习模型。模型在跨越\
  \ 2020 年到 2023 年的未见数据集上进行了测试（参见表 23.2）。为了定量评估，使用了以下指标：\n\n* MAE\n* RMSE\n* 决定系数\
  \ (R²)\n\n**表 23.2** 2020–2023 测试数据集上的模型性能⏎\n\n| 气候参数 | MAE | RMSE | R² 分 |\n| :---\
  \ | :--- | :--- | :--- |\n| 温度 (°oC) | 0.72 | 1.04 | 0.93 |\n| 降水量 (mm) | 4.31 |\
  \ 6.27 | 0.89 |\n| CO[2] 浓度 (ppm) | 2.18 | 3.02 | 0.91 |\n\n混合方法对各种指标显示出良好的预测能力，因为\
  \ R² 值始终高于 0.89 [11]\\.。温度和 CO₂ 浓度估计最为精确，表明该方法有效地表示了现象的长期和空间模式。\n\n#### 23.3.6 比较分析\n\
  \n为了验证混合模型的益处，将其效率与三个基准模型进行了对比（参见图 23.6 和 图 23.7）：\n\n（此处未提供图 23.6 和 23.7 的图片内容）\n\
