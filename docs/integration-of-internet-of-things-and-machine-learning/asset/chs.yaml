  \n**图 23.7** ROC 曲线。⏎\n\n1. *独立 LSTM:* 仅限时间序列。\n2. *独立 CNN:* 仅限空间数据。\n3. *传统 ARIMA:*\
  \ 统计学基准。\n\n#### 23.3.6.1 序预测可视化\n\n这是基于对混合模型在季节性时间线上预测结果的定性评估方法（图 23.8）。\n\n![图\
  \ 23.8 预测与实际温度趋势对比（2000–2023）。⏎](img/9781041062943_C023_008.jpg)\n\n**图 23.8** 预测与实际温度趋势对比（2000–2023）。⏎](#ch31.xhtml#f229b)\n\
  \n#### 23.3.6.2 观察结果与局限性\n\n该模型在表现非常有效的同时，也显示出了一些仍然存在的的局限性：\n\n* 486. *传感器偏差：* IoT\
  \ 设备之间校准未保持一致性可能会导致随机误差源。\n* *空间分辨率权衡：* 高分辨率卫星数据会导致处理时间增加和内存负载增大。\n* 487. *对未见地理区域的泛化：*\
  \ 模型在训练期间未充分代表且未被观测到的区域表现可能不佳 \\[12]。\n\n尽管存在这些局限性，该混合模型仍提出构建一个可扩展且灵活的框架，以适应气候变化，该框架可以扩展到新的预测问题中。\n\
  \n## 23.4 结论\n\n本章提供了一个详细且详尽的深度学习混合框架，该框架结合了卫星图像和 IoT 传感器数据，用于长期预测气候模式。所提模型利用 `CNNs`\
  \ 识别空间特征，并结合 `LSTM` 网络及其时间序列处理能力，在复杂情况下捕捉长时间跨度的环境动态变化。\n\n本研究的主要贡献是利用了 2000–2023\
  \ 年期间卫星和 IoT 传感器数据的多模态气候数据集。专门为数据归一化、填补和分段定制了预处理流水线。一种新的架构方案结合了 `CNN` 和 `LSTM` 网络，用于高分辨率的时空预测。实验结果在多个气候指标（温度、降水、`CO₂`）上均通过了正面测试。这一结论是在与传统及独立的深度学习模型进行比较后得出的。结果清楚表明，模型的混合内部结构可以提高气候预测的准确性和可靠性\
  \ 488.，这对于必须处理不同格式和大规模环境数据的情况尤为有益。\n\n## 参考文献\n\n* 1. Karimullah, S., Khan, M.,\
