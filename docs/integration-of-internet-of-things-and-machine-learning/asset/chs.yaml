  \ 0.946。图 7.9 显示了一个维（4D）图，描述了作物在不同参数值（如土壤水分、温度和 pH）下的产量。图 7.10、图 7.11 和图 7.12 展示了预测产量与水分、预测产量与温度以及预测产量与\
  \ pH 之间的图表。\n\n![图 7.8 不同作物产量的准确率。](img/9781041062943_C007_008.jpg)\n\n## 7.6 结论\n\
  \n所提的研究重点是将农业领域中不同问题描述的各种实现整合到一个单一的统一系统中。这可以提高整个系统的效率，并且与各个系统相比，有助于降低构建成本。当前系统使用连接到树莓派的计算机来运行\
  \ IDE 并进行预测。然而，未来的发展方向可能包括直接在树莓派上运行 IDE，并通过 API 而不是计算机来显示预测结果。在未来，上述拟议的系统可以通过使用无线传感器进行改进，以提高模型的效率。\n\
