  \ Pi 4 充当中央处理单元，实现实时处理和检测。它的灵活性允许摄像头与传感器之间的无缝通信，突显了 474.\n\n![图 22.7 置信度直方图。⏎](img/9781041062943_C022_007.jpg)\n\
