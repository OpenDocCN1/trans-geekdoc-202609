  \ 65–69, Jan. 2019.](#ch28.xhtml#r653b)\n\n\n\n\n《摩诃婆罗》是印度两大伟大的史诗之一，另一部是《罗摩衍那》（Thapar,\
  \ 2009）。这部史诗传统上被归于圣者毗婆罗（Vyasa），是一部巨著，据认为跨越了几个世纪才完成，其最终版本出现于公元 500 年左右（Jha, 1998）。这部史诗主要叙述了库鲁王朝的故事，以及潘达婆族与罗罗婆族这两个家族中的对立分支为了王国的正统继承权而引发的大战（Hooper,\
  \ 2018）。摩诃婆罗深深入探讨了复杂的哲学和精神教义，探索了道德、责任以及善恶之间永恒的斗争等主题（Hooper, 2018）。摩诃婆罗的核心主题是对正确行为或`dharma`（法）的探索，正如《薄伽梵吉达》中所强调的那样。这部史诗结构由\
  \ 18 个名为`parvas`（卷）的大部分组成，每一部分都探讨了宏大叙事的不同方面及其哲学基础（Prasad, 2015）。这场为了权力的斗争为更广泛的对道德困境、人性、责任（`dharma`）以及行为后果的探索提供了背景（Upadhyaya,\
  \ 2024）。摩诃婆罗最引注目的特点之一是它对人与自然关系的描绘（Agri, 2012）。森林不仅是战争或流放的背景，更是精神成长和生态和谐的场所。水、土、树都是神圣的，这种神性在整部史诗中都得到了强调（Chapple,\
  \ 2015）。自然的圣洁与文本中的道德教义交织在一起，强调了人类保护和维护自然世界的责任（Mahata, 2024）。摩诃婆罗教导我们关于自然的教训。它告诉我们人类与自然的关系，以及我们绝不能伤害自然、过度砍伐树木和剥夺资源（Brodbeck,\
  \ 2024）。\n\n在一个不断应对气候变化、森林砍伐和水资源短缺等环境问题的世界，像《摩诃婆罗》这样的古代著作含有丰富的信息，等待着被探索并转化为现代的可持续行动。这些古代著作不仅具有文化和历史价值，还包含了跨越时代的生态知识（Renugadevi,\
  \ 2012）。全球范围内已有若干研究旨在证实宗教文献在促进生态灵性与可持续性方面的重要性（Lal, 2015; Sivaramakrishnan, 2015）。多项研究表明，印度教文献与自然之间存在着错综的关系，这种关系反映在仪式、思想和实践中（Agoramoorthy,\
  \ 2015; *Environmental Ethics in the Hindu Vedas*, n.d.; Horn, 2006; Radhakrishnan,\
  \ 1922）。然而，在传统学术研究中，利用现代技术通过此类著作来解决现代全球生态问题的方法一直被忽视。将自然语言处理（`NLP`）等现代计算技术应用，为重新解读此类著作提供了一个新途径（McDonald,\
  \ 2014）。`NLP`作为人工智能的一个领域，允许对大规模文本集进行研究（McDonald, 2014 *注：此处原文有部分重复，译文已根据上下文逻辑处理*）。`NLP`允许通过对大量文本进行研究来提供全新的视角（McDonald,\
  \ 2014）。这场权力的争夺作为更广泛的道德困境、人性、责任（`dharma`）以及行为后果的探索的背景（Upadhyaya, 2024）。摩诃婆罗最引注目的特点之一是它对人与自然关系的描绘（Agri,\
  \ 2012）。森林不仅是战争或流放的背景，更是精神成长和生态和谐的场所。水、土、树都是神圣的，这种神性在整部史诗中都得到了强调（Chapple, 2015）。自然的圣洁与文本中的道德教义交织在一起，强调了人类保护和维护自然世界的责任（Mahata,\
  \ 2024）。摩诃婆罗教导我们关于自然的教训。它告诉我们人类与自然的关系，以及我们绝不能伤害自然、过度砍伐树木和剥夺资源（Brodbeck, 2024）。\n\
  \n在一个不断应对气候变化、森林砍伐和水资源短缺等环境问题的世界，像《摩诃婆罗》这样的古代著作含有丰富的信息，等待着被探索并转化为现代的可持续行动。这些古代著作不仅具有文化和历史价值，还包含了跨越时代的生态知识（Renugadevi,\
  \ 2012）。全球范围内已有若干研究旨在证实宗教文献在促进生态灵性与可持续性方面的重要性（Lal, 2015; Sivaramakrishnan, 2015）。多项研究表明，印度教文献与自然之间存在着错综的关系，这种关系反映在仪式、思想和实践中（Agoramoorthy,\
  \ 2015; *Environmental Ethics in the Hindu Vedas*, n.d.; Horn, 2006; Radhakrishnan,\
  \ 1922）。然而，在传统学术研究中，利用现代技术通过此类著作来解决现代全球生态问题的方法一直被忽视。将自然语言处理（`NLP`）等现代计算技术应用，为重新解读此类著作提供了一个新途径（McDonald,\
