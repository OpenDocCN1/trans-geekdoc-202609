  \ |\n\n## 12.5 结果\n该研究在两个状态下进行，包含了 `GBT`、`LSTM`、`DT`、`Ada Boost`、`GRU` 和 `MLP` 模型。在第一阶段，评估了\
  \ ML 的二分类有效性。在第二阶段，使用了六种模型，并根据 UNSW-NB15 数据集的属性进行了调整。`F1 score` 和 `FPR` 值通过表 12.5\
  \ 和 表 12.6 展示了二分类结果，而图 12.3 和 图 12.4 则提供了准确率的可视化表示。\n\n```\n![图 12.3 在 UNSW-NB15\
  \ 数据集上的完整属性性能](img/978104102943_C012_003.jpg)\n```\n**图 12.3** 在 UNSW-NB15 数据集上的完整属性性能\n\
  \n```\n![图 12.4 在 UNSW-NB15 数据集上的选取属性性能](img/978104102943_C012_004.jpg)\n```\n**图\
  \ 12.4** 在 UNSW-NB15 数据集上的选取属性性能\n\n\n\n\n\n然而，表 12.7 比较了在所有利用 `UNSW-NB15` 网络数据集的文献综述中选出有效算法后，与本文报告的有效算法\
  \ `DT` 的性能。已经证实，与其他工作相比，使用我们建议的属性选择方法（`GIWRF`）配合 `DT`，在 `F1-score` 方面取得了满意的性能，该指标是不准确数据的适宜评估标准。除了\
  \ `Gu` 和 `Lu` [18]\\] 的建议外，发现准确率值高于现有的类似工作。在这种情况下，建议的 `GIWRF-DT` 性能优于 `NB-SVM`，尽管准确率略低（0.74%），但检测率/召回率有所提高（0.03%）。这描述了所提\
  \ `DT` 有效识别入侵的能力。他们选择了与所提研究中使用的不同的训练规模。\n\n## 232.233.12.6 结论\n\n本研究旨在开发并确定用于基于机器学习的入侵检测系统（IDS）二分类挑战的机器学习算法：`GBT`、`LSTM`、`Ada\
  \ Boost`、`DT`、`GRU` 和 `MLP`。在类别不平衡分布会影响属性选择过程的基础上，提出了 `GIWRF` 作为属性选择程序，以从 `UNSW-NB15`\
  \ 不平衡集中选择合适的属性集合。通过特征选择技术将 `UNSW-NB15` 网络数据集的属性分别减少到 20 个（从 49 个）。使用 `FPR`、`Accuracy`、`Recall`、`Precision`\
  \ 和 `F1` 分数分析了模型检测入侵的有效性。研究最初使用了跨数据集的整个特征集。随后重复了该研究，仅利用属性选择算法提取的所选属性。对于几个数据集，将算法性能与全属性字段以及减少后的属性进行了比较。在在使用属性选择技术时，`DT`\
  \ 在 `UNSW-NB15` 网络数据集上的表现更好。\n\n## 参考文献\n\n* 1.Sfakianakis, A., Douligeris, C.,\
