  \nHarleenpal Singh 和 Akhil Kumar\n\nDOI: [10.1201/97810036478-24](http://doi.org/10.1201/97810036478-24)\n\
  \n## 24.1 引言\n\n物联网（IoT）指的是一个嵌入了传感器、执行器和通信技术的庞大设备生态系统，用于收集和交换数据。另一方面，机器学习（ML）包含了一系列算法和统计模型，使其能够识别模式并根据数据做出决策。这两个领域的交叉——即物联网与机器学习，已成为一种变革性范式，通过情感知自动化和决策赋予实时智能能力\
  \ \\[1]。\n\n物联网与机器学习之间的协同对于将海量原始传感器数据转化为可操作的洞察至关重要。例如，工业环境中的温度传感器产生持续的数据流；机器学习算法可以分析这些流以检测异常、预测系统故障或自动优化操作。\n\
  \n### 24.1.1 物联网系统中实时智能的演进（2015–2024）\n\n\n\n\n\n*   *2015–2018:* 主要以云端为中心的分析，高延迟，设备端智能水平有限。\n\
  *   *2019–2021:* 引入轻量化机器学习模型，边缘智能的开始，实时告警以及基于规则的决策。\n*   *2022–2024:* 边缘机器学习的普及、联邦学习\
  \ (FL) 以及在极少人工干预下实现自动化实时决策。\n\n最近的研究表明，向去中心化智能转变显著降低了延迟和网络拥塞，从而使自动驾驶和智能可穿设备等应用能够对环境变化做出做出响应\
  \ [2]。\n\n### ## 24.1.2 机器学习在 IoT 数据处理中的作用\n\n机器学习与 IoT 集成（如图 24.2\n\n**图 24.1**\
  \ 2015 年至 2024 年 IoT–机器学习技术与部署范式的演变。⏎\n\n1.  分类（例如：识别机器的故障类型）\n2.  回归（例如：预测能源消耗）\n\
  3.  聚类（例如：对智能家居设备中的相似行为进行分组）\n4.  异常检测（例如：识别网络安全漏洞）\n5.  强化学习（例如：优化暖暖通风空调 (HVAC)\
  \ 控制策略）\n\n这些任务对于 IoT 场景尤为重要，因为这些数据通常是噪声化的、高维且实时生成的。机器学习模型的适应性允许它们从新数据中不断学习，从而实现更具韧性和可扩展性的\
  \ IoT 部署 [3]。\n\n### ## 491.24.1.3 关键性能指标：准确性、效率和计算能力\n\n对于 IoT–机器学习系统，必须从多个维度进行性能评估：\n\
  \n1.  *准确性：* 模型预测正确结果的能力，在医疗保健和工业安全应用中至关重要。\n2.  *延迟：* 处理和对输入数据做出反应所需，在自动系统中特别重要。\n\
  3.  *计算效率：* 资源使用情况，特别是在嵌入式传感器或边缘设备等受限环境中。\n4.  *能耗：* 由于许多 IoT 设备由电池供电，机器学习模型必须针对低功耗运行进行优化。\n\
  5.  *可扩展性：* 系统随着设备数量或数据量增加时保持性能的能力。\n\n最近的研究表明，部署剪枝和量化模型可以在保留超过 95% 原始准确性的同时，将能耗降低高达\
  \ 60% [4]。\n\n### ## 24.1.4 行业应用与用例概述\n\nIoT–机器学习系统的应用格局广阔且不断增长。显著的用例包括：\n\n1. \
  \ *智能制造：* 实时故障检测、质量控制和预测性维护 (PdM) [5]。\n2.  *医疗保健：* 患者监测、疾病早期检测和药物依从性跟踪 [6]。\n3.\
  \  *城市基础设施：* 交通优化、废物管理和节能照明系统 [7]。\n4.  *精准农业：* 土壤质量分析、灌溉控制和作物健康监测。\n5.  *能源管理：*\
  \ 智能电网控制、负载预测和实时能源定价系统 [8]。\n\n## ## 492.24.2 文献综述\n\n### ### 24.2.1 IoT 中的早期机器学习技术\
  \ (2015–2019)\n\n2015 年至 2019 年间机器学习与 IoT 系统的集成以基础性但有限的应用为特征。在此期间，机器学习算法主要用于基本的分类和回归任务。机器学习模型的计算复杂性和资源需求要求将其部署在云服务器上，导致了显著的延迟并限制了设备端的自主性。此阶段常用的算法包括：\n\
  \n1.  *决策树和随机森林：* 因其可解释性和较低的计算开销受到重视，这些模型用于传感器故障检测和交通流预测等应用 [9]。\n2.  *支持向量机 (SVMs)：*\
  \ 应用于高精度的应用，如健康监测系统和入侵检测 [10]。\n3.  *K 近邻算法 (KNNs)：* 用于基于位置的服务和活动识别，尽管在内存使用和推理时间存在局限性\
  \ [11]。\n\n尽管这些方法在静态设置中有效，但它们往往无法适应 IoT 数据的实时流特性。此外，对云的依赖阻碍了响应速度并增加了网络拥塞，限制了可扩展性。\n\
  \n### ### 24.2.2 IoT 深度学习的进步 (2020–2024)\n\n如图 24.1 所示，2020 年至 2024 年见证了深度学习 (DL)\
  \ 兴起带来的范式转移。与经典的机器学习方法不同，深度学习模型（特别是卷积神经网络 CNN、循环神经网络 RNN 及其变体）能够从高维、高噪声数据中提取更细致的特征。进一步的发展进展还包括：\n\
  \n1.  *轻量化深度学习模型：* 出现了如 `MobileNet`、`SqueezeNet` 和 `TinyML` 等架构，专为 IoT 约束条件而设计 [12]。\n\
  2.  *神经网络量化与剪枝：* 这些优化技术允许大型模型在不显著降低准确性的情况下进行压缩 [13]。\n3.  *FL (联邦学习)：* 引入了一种保护隐私的方法，可以在分布式设备上训练模型，而无需将原始数据传输到中央服务器\
  \ [14]。\n\n上述技术使深度学习能够从云端系统转向设备端智能，实现了在自动驾驶等关键应用中的低延迟响应。\n\n### ### 493.24.2.3 传统与现代机器学习的对比分析\n\
  \n对传统和现代机器学习技术的并对比评估强调了其在效率、适应性和可扩展性方面的巨大演变，如表 24.1 所示。\n\n**表 24.1** 传统与现代机器学习算法对比⏎\n\
  \n| **标准** | **传统机器学习 (2015–2019)** | **现代机器学习/深度学习 (2020–2024)** |\n| :--- | :---\
  \ | :--- |\n| 部署模式 | 以云端为中心 | 边缘及云端协同 |\n| 延迟 | 由于远程处理延迟高 | 通过设备推理实现低延迟 |\n| 可扩展性\
  \ | 受限于网络容量 | 通过去中心化架构增强 |\n| 功耗效率 | 中等到高功率需求 | 通过量化/剪枝进行优化 |\n| 安全/隐私 | 集中化风险暴露\
  \ | 通过联邦学习和加密学习得到改进 |\n| 模型适应性 | 需要静态重训练 | 支持动态/在线学习 |\n\n这些差异凸显了技术成熟如何将 IoT–机器学习系统的范围从基础决策支持扩展到实时自主控制环境。\n\
  \n### ### 24.2.4 性能指标：准确性、延迟和功耗\n\n机器学习模型在 IoT 应用中的性能是多维的，高度取决于具体背景。因此，评估模型性能涉及准确性、延迟和能量消耗之间的权衡。\n\
  \n1.  *准确性：* 现代深度学习模型在视频监控或医疗诊断等复杂任务中通常获得更高的准确性，在基准研究中比传统模型高 10–30% [15]。\n\n\n\n\
  \n\n2. **延迟**：在优化的边缘硬件上运行深度神经网络（DNNs）可以提供低于 50 ms 的推理时间，适用于实时控制系统 [16]。\n\n3. **功耗**：模型压缩使得边缘设备能够在微控制器上运行功耗低于\
  \ 100 mW 的深度模型，这正如 TinyML 部署所示 [17]。\n\n选择模型架构时，必须根据特定的应用需求考虑这些限制条件。例如，工业安全系统可能将延迟优于绝对准确性，而农业中的能量采集传感器可能更倾向于预测性能中等的超低功耗模型。\n\
  \n### 494.24.2.5 案例研究：IoT-ML 实现的演进\n\n* **案例研究 1（制造业中的预测性维护）**：2017 年，一家欧洲制造公司使用托管在云基础设施上的\
  \ SVM 模型来分析振动信号以预测设备故障。由于网络和处理延迟，信号发出后的平均检测时间为 3–5 分钟。到 2023 年，该公司迁移到集成有工厂传感器的 Nvidia\
  \ Jetson Nano 板卡上的 FL 模型。检测时间缩短至 15 秒以下，模型准确性提高了 22%，并节省了大量带宽 [18]。\n\n* **案例研究\
  \ 2（通过智能可穿戴设备进行健康监测）**：在 2016 年至 2018 年，大多数智能健康跟踪器依赖基于阈值的警报和定期数据上传进行离线分析。这些设备的个性化程度有限，且假阳性率高。现代实现现在使用嵌入式\
  \ CNN 和循环模型，能够实时识别个性化的心脏异常。一项关于边缘深度学习（DL）模型检测心律失齐的研究显示，F1 分数从 0.74（传统 ML）提高到 0.91（现代\
  \ DL） [19]。\n\n## 24.3 用于实时智能的 IoT-ML 架构\n\n### 24.3.1 用于 IoT-ML 的边缘计算与 FL\n\n随着\
  \ IoT 设备的普及和产生海量数据，依赖以云为中心的模型已变得不再足够。延迟、带宽限制、隐私担忧和可扩展性挑战迫使向边缘计算转型，将计算带到数据源。在这种模型中，实时推理和决策在本地发生，从而缩短了到云服务器的往返时间并缓解了潜在的数据泄露风险\
  \ [20]。FL 通过允许在多个边缘设备上进行分布式模型训练而不聚合原始数据，弥补了这一范式。这种方法在保持稳健模型准确性的同时，保护了用户隐私并减少了网络流量。例如，Google\
  \ 在 Android 的 Gboard 中部署 FL，使得下一个词的预测模型可以在数百万设备上进行训练，而不会损害用户数据 [21]。IoT-ML 系统中边缘计算和\
  \ FL 的益处包括：\n\n1. **降低延迟**：在源头做出决策，最大限度地减少时间延迟。\n2. **能源效率**：本地处理节省了数据传输所需的能量。\n\
  3. **隐私合规**：用户数据保持去中心化，符合 GDPR 和 HIPAA。\n\n然而，在确保模型收敛、处理非独立同分布（non-IID）数据以及维护边缘节点之间的同步方面仍然存在挑战\
  \ [22]。\n\n### 495.24.3.2 用于 IoT 设备的迁移学习与模型压缩\n\n由于内存和计算限制，在受限的 IoT 硬件上部署全规模 DL\
  \ 模型通常是不可行的。为了解决这一问题，采用了迁移学习和模型压缩技术：\n\n1. **迁移学习**利用预训练模型（这些模型通常在如 ImageNet 等大型数据集上进行训练），并用较少的数据和更低的计算需求对特定的\
  \ IoT 任务进行微调。这极大地缩短了训练时间和资源需求 [23]。\n2. **模型压缩**涉及剪枝、量化和知识蒸馏等技术，以减少模型大小和能量消耗。剪枝移除冗余神经元或过滤器，量化降低权重精度，蒸馏则将知识从大型教师模型传输到较小的学生模型\
  \ [24]。\n\n研究表明，在 `MobileNet` 架构上应用量化感知训练可以将模型大小缩小 4 倍，而准确率损失小于 2%，使得在 `Arduino\
  \ Nano 33 BLE` 等微控制器上实现实时目标检测 [17]。\n\n### 24.3.3 实时数据流水线与处理工作流\n\n有效的 IoT–ML 系统需要良好配置的实时数据流水线，通常包括以下阶段：\n\
  \n1. **数据采集**：传感器持续收集环境或运行数据。\n2. **预处理**：对原始数据进行归一化、清洗，有时会进行实时增强。\n3. **模型推理**：压缩或轻量级\
  \ ML 模型运行在边缘设备或网关节点上。\n4. **反馈与执行**：根据推理结果执行控制操作或触发警报。\n5. **数据存储与学习**：将选择性数据转发到云层或雾层进行重新训练或分析。\n\
  \n`Apache Kafka`、`TensorFlow Lite` 和 `AWS Greengrass` 等中间件平台支持这些工作流，提供了管理延迟、吞吐量容错能力的集成和编排能力。用例案例：在智能农业中，IoT–ML\
  \ 流水线使传感器能够捕获土壤水分水平，本地处理数据以确定灌溉需求，并激活水泵 [25]。\n\n### 496.24.3.4 五/六代网络及其对 IoT-ML\
  \ 的影响\n\n第五代（5G）网络的出现以及对六代的研究显著增强了实时高性能 IoT-ML 系统的可行性。这些技术提供了：\n\n1. **超低延迟**：5G\
  \ 支持低至 1 ms 的延迟，实现了即时反馈。\n2. **高带宽**：允许海量数据传输，支持视频监控等应用。\n3. **设备密度**：5G 每平方公里可处理\
  \ 100 万设备，这是大规模 IoT 部署的关键 [26]。\n\n6G 技术预计提供更高的数据速率（高达 1 Tbps）、与卫星网络的集成以及网络层原生的\
  \ AI 支持 [27]。在工业自动化中，5G 已经实现了具有严格延迟和可靠要求的机器间通信，提升了预测性维护（PdM）系统和机器人控制环的性能 [28]。\n\
  \n### 24.3.5 中心化与去中心化架构的对比研究\n\nIoT-ML 架构设计从根本上影响了其性能、可扩展性和韧性。对比分析见表 24.2，并在图 24.3\
  \ 中也有说明。\n\n![图 24.3 中心化（云端）与去中心化（边缘/联邦）IoT–ML 架构](img/9781041062943_C024_003.jpg)\n\
  \n**图 24.3** 中心化（云端）与去中心化（边缘/联邦）IoT–ML 架构。[#ch32.xhtml#f232b]\n\n**表 24.2** 云端与去中心化对比[#ch32.xhtml#t62b]\
  \ \n\n| **特征** | **中心化（云端）** | **去中心化（边缘/联邦）** |\n| :--- | :--- | :--- |\n| **延迟**\
  \ | 由于网络往返而较高 | 由于本地推理而较低 |\n\n\n\n\n\n| 隐私/安全 | 因中心化数据聚合而存在风险 | 通过本地化处理有所改进 |\n\
  | :--- | :--- | :--- |\n| 可扩展性 | 受带宽和云资源限制 | 高，因为每个节点都处理本地负载 |\n| 可靠性 | 单点故障 | 具有冗余本地节点的容错能力\
  \ |\n| 能源效率 | 取决于传输频率 | 通过避免不必要的通信进行优化 |\n\n图 24.3 显示了中心化（基于云的）与去中心化（边缘/联邦的）IoT-ML\
  \ 架构的对比。\n\n## 497.498.24.4 IoT-ML 算法与技术\n\n### 24.4.1 用于 IoT 数据流的监督学习与无监督学习\n\n\
  IoT 数据通常具有海量、动态且以连续流的形式生成的特点。为了获得可操作的见解，根据任务性质和数据标签的可用性，广泛应用监督学习和无监督学习技术。\n\n####\
  \ 24.4.1.1 监督学习\n\n监督方法依赖于标记的数据集，通常用于分类和回归任务：\n\n1. `Classification`：检测设备状态（正常 vs.\
  \ 故障）和患者状态（稳定 vs. 危急）。\n2. `Regression`：预测环境变量，如温度、能量负载或需求。\n\n`SVMs`、`decision\
  \ trees`、`random forests` 和 `gradient boosting machines` 等算法在早期 IoT 系统中被广泛 [29]。然而，现代应用越来越多地部署\
  \ `DNNs` 和 `RNNs` 以对时间序列数据实现更好的泛化能力。\n\n#### 24.4.1.2 无监督学习\n\n在缺乏标记数据的场景下，无监督学习方法如\
  \ `K-means clustering`、`principal component analysis` (`PCA`) 和 `autoencoders` 能够实现异常检测、数据压缩和系统分析。例如，聚类被用于智能家居对用户行为模式进行分组，而\
  \ `autoencoders` 则压缩传感器数据以减少存储和传输开销 [30]。\n\n### 24.4.2 用于自主 IoT 系统的强化学习\n\n强化学习\
  \ (RL) 是一种学习范式，代理体通过在环境中采取行动来最大化累积奖励。对于必须在动态环境中适应的自主 IoT 系统非常有价值，例如：\n\n1. 根据占用情况和天气调整的智能\
  \ HVAC 系统 [31]。\n2. 在复杂地形中导航的自主无人机 [32]。\n3. 从车流量学习优化模式的交通灯控制系统 [33]。\n\n最近的进展包括深度强化学习\
  \ (`DRL`)，它将神经网络与 `RL` 结合，实现了高维空间中的决策。`Deep Q-Networks` (`DQN`) 和 `Proximal Policy\
  \ Optimization` (`PPO`) 等技术已集成到 IoT-ML 工作中，以便以最少的先验知识实现复杂行为。\n\n### 499.24.4.3 IoT\
  \ 安全中的异常检测技术\n\n考虑到 IoT 系统在基础设施和医疗保健中的关键性，稳健的异常检测对于识别网络攻击、故障或系统误行为至关重要。流行的基于 ML\
  \ 的方法包括：\n\n1. 统计方法（例如 `Z-score`、`Autoregressive Integrated Moving Average` (`ARIMA`)）。\n\
  2. 聚类算法（例如 `DBSCAN`、`Isolation Forest`）。\n3. 基于自动编码器的 `DL`，如图 24.4 所示，特别适用于高维或时间序列异常检测\
  \ [34]。\n\n![图 24.4 用于实时数据流异常检测的 IoT–ML 流水线](img/9781041062943_C024_004.jpg)\n\n\
  **图 24.4** 用于实时数据流异常检测的 IoT–ML 流水线。(#ch32.xhtml#f233b)\n\n最近一项使用长短期记忆 (`LSTM`) `autoencoders`\
  \ 检测工业控制系统攻击的研究，其检测率超过了 95%，凸显了时间建模在增强系统安全方面的作用 [8]。挑战包括数据集不平衡（正常行为占主导）、不断演变的攻击向量以及实时处理需求，所有这些都在通过混合和集成方法得到解决\
  \ [35]。\n\n### 24.4.4 使用 ML 模型的 PdM\n\nPdM 指预测性维护。制造业在工业 4.0 范式下处于采用 IoT–ML 系统的前沿。嵌入在机器中的传感器收集振动、温度和声学数据，ML\
  \ 算法分析这些数据以检测异常并预测故障。ML 模型包括：\n\n1. 用于估计 `Remaining Useful Life` (`RUL`) 的 `Regression`\
  \ 模型。\n2. 用于故障类型的 `Classification` 模型。\n3. 用于时间模式的 `Sequence` 模型（例如 `LSTM`）。\n\n\
  在一个里程碑案例中，通用电气在喷气发动机上部署了基于 `telemetry` 的故障预测，减少了 30% 的非计划维护并提高了资产利用率 [36]。这导致：\n\
  \n1. 停机时间减少了 20%。\n2. 维护成本降低了 25%。\n3. 整体设备效率 (`OEE`) 提高了 15%。\n\n### 24.4.5 用于\
  \ IoT–ML 的量子计算与区块链\n\n随着 IoT 系统变得越来越复杂且数据日益丰富，传统的计算和安全模型正接近极限。`Quantum computing`\
  \ 和 `blockchain` 是两种提供变革性潜力的新兴范式。\n\n#### 24.4.5.1 量子计算\n\n量子算法为 ML 任务（如优化、`classification`\
  \ 和密码学）提供了指数级更快的计算。例如，`quantum SVM` 和 `quantum Boltzmann machines` 在处理大规模 IoT 数据方面展现了前景\
  \ [37]。然而，量子计算仍处于早期阶段，面临稳定性、可访问性以及与边缘设备集成的挑战。混合量子-经典 ML 框架的研究正在进行。\n\n#### 24.4.5.2\
  \ 区块链\n\n区块链引入了去中心化的、防篡改的账本，确保了 IoT-ML 系统中的数据完整性和透明度。智能合约可以自动化验证和访问控制，使区块链在以下方面特别为有效：\n\
  \n1. 供应链透明化\n2. 医疗数据共享\n3. IoT 设备身份认证\n\n将区块链与 ML 结合增强了信任性和可审计性。例如，安全的 ML 更新可以通过区块链共识机制管理，减轻模型投毒或未经授权的访问\
  \ [39]。\n\n## 24.5 行业应用与案例研究\n\nIoT 与 ML 的融合正在催化各行业的转型，使系统具有主动性、预测性和自适应性。本章详细介绍了各特定领域的实施方案，并说明了从\
  \ IoT-ML 集成获得的实时智能如何提高效率、决策能力和服务质量。\n\n### 24.5.1 智能制造与 PdM\n\n制造业一直是采用 IoT–ML 系统的前沿。嵌入在机器中的传感器收集振动、温度和声学数据，ML\
  \ 算法分析这些数据以检测异常并预测故障。\n\n#### 24.5.1.1 案例研究：西门子的边缘 ML\n\n西门子在其工厂部署了基于边缘的 ML 模型，用于数控\
  \ (`CNC`) 机器的 PdM。通过使用历史故障模式训练的异常检测算法，系统可以实时检测偏差，能够在故障发生前安排维护。\n\n此外，`RL` 已应用于优化制造工作流，根据环境条件和机器健康状况动态调整生产参数\
  \ [40]。\n\n\n\n\n\n### 24.5.2 医疗保健中的 IoT–ML：远程监测与诊断\n\n医疗保健领域的 IoT–ML 应用实现了持续监测、早期诊断和个性化治疗。可穿戴设备捕捉心率、血糖水平和心电图（`ECG`）信号等实时生理数据。`ML`\
  \ 模型处理这些数据以自主识别健康风险。\n\n#### 24.5.2.1 案例研究：利用智能穿戴设备检测心律失常\n\n斯坦福人员与苹果公司合作，利用 `Apple\
  \ Watch ECG` 数据训练了一个 `DL` 模型，用于检测房颤（`AFib`）。这种基于 `CNN-LSTM` 混合模型的 `ML` 算法在临床试验中实现了\
  \ 98.3% 的敏感性和 99.6% 的特异性 [41]。\n\n#### 24.5.2.2 案例研究：COVID-19 监测\n\n在疫情期间，医院使用基于\
  \ IoT 的生命体征监测器结合 `ML` 分类器对患者进行远程分诊。`Random forest`（随机森林）和 `XGBoost` 模型预测重症监护室（`ICU`）入院的曲线下面积（`AUC`）大于\
  \ 0.90，为资源紧张的医疗机构实现了高效的资源配置 [42]。\n\n这些实施说明了 IoT-ML 在增强远程诊断、减少医院再入院和个性化护理方面的力量，同时通过联邦架构保护了隐私。\n\
  \n### 24.5.3 城市基础设施与智能城市\n\n智能城市计划利用 IoT–ML 整合来优化基础设施运行、提高公共安全并减少对环境的影响。\n\n####\
  \ 24.5.3.1 交通与环境监测\n\n巴塞罗那和新加坡等城市安装了传感器网络，收集交通密度、空气污染、噪声水平和能源使用的数据。`ML` 模型实时分析这些数据以：\n\
  \n1. 预测交通瓶颈并动态规划车辆路线。\n2. 使用运动和环境光传感器优化公共照明。\n3. 预测污染水平以发布健康建议。\n\n#### 24.5.3.2\
  \ 案例研究：阿姆斯特丹的废物管理优化\n\n阿姆斯特丹实施了一套由 `ML` 驱动的垃圾收集系统，使用填充水位传感器和 `logistic regression`\
  \ 模型预测垃圾桶使用情况。结果是收集频率降低了 30%，燃料节省了 23% [43]。这些示例反映了城市 IoT–ML（如图 24.5 所示）部署如何创建更具韧性、适应性且以市民为中心的城市服务。\n\
  \n![图 24.5 智能城市基础设施中流量优化和空气质量预测的 IoT–ML 系统。](img/9781041062943_C024_005.jpg)\n\n\
  **图 24.5** 智能城市基础设施中流量优化和空气质量预测的 IoT–ML 系统。](#ch32.xhtml#f234)\n\n### 24.5.4 精准农业与\
  \ IoT-ML 创新\n\n在农业领域，IoT–ML 系统支持资源高效和数据驱动的实践，提升了生产力和可持续性。\n\n#### 24.5.4.1 智能灌溉\n\
  \n土壤水分、温度和湿度传感器将数据馈给 `ML` 模型，以确定最佳灌溉计划。`SVMs` 和 `decision trees`（决策树）等技术已用于将土壤水分维持在理想范围内，用水量减少高达\
  \ 40% [44]。\n\n#### 24.5.4.2 作物病害检测\n\n无人机相机和高光谱成像系统结合基于 `CNN` 的分类器，可以检测植物疾病或营养缺乏的早期迹象。例如，印度的一项研究表明，使用集成\
  \ `DL` 模型检测水稻真菌感染的准确率达到 97% [45]。\n\n#### 24.5.4.3 产量预测\n\n在天气、土壤和作物数据上训练的 `ML`\
  \ 模型可以极高地预测产量。包括 `gradient boosting`（梯度提升）和 LSTMs 在内的 `Regression algorithms` 已用于优化种子选择和预测收获量，指导供应链决策。\n\
  \n### 24.5.5 能源管理与智能电网优化\n\n能源系统正在演变为由实时传感和 `ML` 驱动分析的智能电网。这些系统有助于平衡供需、检测故障并优化能源使用。\n\
  \n#### 24.5.5.1 需求预测与负载平衡\n\n公用事业使用 `ARIMA`、`Prophet` 和 LSTMs 等时间序列预测模型在细粒度上预测能源需求。这些预测为动态定价和自动负载分配策略提供了支持\
  \ [46]。\n\n#### 24.5.5.2 案例研究：智能电表与异常检测\n\n在英国，配备异常检测算法的智能电表可以识别窃电、电压波动和潜在故障。`ML`\
  \ 模型将误报减少了 60%，并将检测准确率从 72% 提高到 95% [47]。\n\n#### 24.5.5.3 可再生能源整合\n\n`ML` 通过预测输出和调整能量储备，促进太阳能风能等间歇性再生能源的最优调度。`RL\
  \ agents`（强化学习代理）越来越多地用于管理微电网，实现社区级的去中心化能源管理 [11, 48]。\n\n## 24.6 挑战、未来趋势与研究方向\n\
  \nIoT 与 ML 的融合在各行业产生了变革性成果，但它引入了巨大的技术、伦理和基础设施挑战。本章批判性地审查了这些挑战，识别了新兴趋势，并提出了可以解决未解决问题的研究方向。\n\
  \n### 24.6.1 互操作性与标准化挑战\n\n互操作性是 IoT–ML 整合的基础障碍之一。IoT 生态系统包含由不同厂商开发的异构设备、协议和平台，缺乏统一接口。面临的挑战包括：\n\
  \n1. 协议不兼容：设备可能使用 `MQTT`、`CoAP`、`HTTP` 或私有协议，增加了复杂性。\n2. 数据格式不一致：阻碍了统一的模型训练。\n3.\
  \ 缺乏通用 API：针对特定硬件设计的 `ML` 模型可能无法跨系统。\n\n如 `oneM2M`、`IEEE P2413` 和 `Open Connectivity\
  \ Foundation` (`OCF`) 等努力正在开发互操作框架，但应用仍处于碎片化状态 [49]。\n\n### 24.6.2 延迟、功耗与可扩展性问题\n\
  \n在成千上万 IoT 设备上部署 ML 模型需要平衡延迟、功耗和可扩展性。\n\n1. 延迟：对于自动驾驶等实时应用至关重要，几毫秒的延迟可能导致严重后果。\n\
  2. 功耗：电池供电设备面临能量限制，如果不进行模型压缩，大规模 DL 部署是不可行的。\n3. 可扩展性：随着设备增加，中心化云服务器在处理和带宽方面面临瓶颈，需要去中心化架构。\n\
  \n边缘计算、`TinyML` 和节能神经网络（例如`二值化神经网络`、`脉冲神经网络`）的进展提供了解决方案，但在性能与资源消耗之间仍存在权衡 [50]。\n\
  \n### 24.6.3 IoT–ML 系统中的安全与隐私担忧\n\nIoT–ML 系统面临广泛的安全和隐私威胁，这些威胁源于其分布式特性、持续连接和以数据为中心流。\n\
  \n1. 安全威胁：\n   1. 模型反向与提取攻击：攻击者通过查询 API 重构训练数据或提取模型。\n   2. 数据投毒：恶意输入可以操纵模型行为。\n\
  \n\n\n\n\n### 3. `设备欺骗`：受侵害的设备可能会向 ML 流水线传输伪造数据。\n\n### 2. `隐私挑战`：\n\n1. `敏感数据暴露`：在医疗健康和智能家居应用中尤为关键。\n\
  2. `加密不足`：轻量级设备可能缺乏稳健的加密实现。\n\n正在探索的解决方案包括：\n\n1. `差分隐私`：通过向数据或输出添加噪声来保护个人记录。\n\
  2. `同态加密`：允许对加密数据进行计算。\n3. `区块链与智能合约`：去中心化信任并实现访问控制自动化 [51]。\n\n尽管取得了进展，但针对 IoT–ML\
  \ 定制的内生安全框架仍不完善，需要迫切的研究关注。\n\n## ## 24.6.4 未来趋势：AI 驱动的 IoT、可解释的 ML 和绿色计算\n\n随着领域的发展，若干变革性趋势正在形成势头。\n\
  \n#### 24.6.4.1 AI 驱动的 IoT\n\nAI 与 IoT 的融合形成单一概念，即 AI 驱动的 IoT (AIoT)，它愿景了一个智能、自优化的设备网络。这涉及到：\n\
  \n1. 从上下文学习的设备。\n2. 协作多智能体系统。\n3. 跨传感器集群的实时决策 [52]。\n\nAIoT 正在驱动自主系统的创新，如送货无人机、机器人农场和自适应智能建筑。\n\
  \n#### 24.6.4.2 可解释的 ML\n\n随着 ML 模型变得越来越复杂，特别是在安全关键领域，解释性变得至关重要。诸如 SHapley 加性解释\
  \ (SHAP) 和局部可解释模型无关解释 (LIME) 等工具被用于：\n\n1. 可视化模型决策边界。\n2. 检测偏见或故障点。\n3. 确保符合欧盟（EU）的“解释权”等法规规定\
  \ [53]。\n\n将可解释 AI (XAI) 集成到 IoT–ML 中将提高自主系统的信任度、采用率和问责制。\n\n#### 24.6.4.3 绿色计算\n\
  \n面对气候担忧和 IoT 设备受限的电量，能源效率至关重要。绿色 AI 研究侧重于：\n\n1. 碳感知模型训练。\n2. 边缘设备优化。\n3. 减少浪费的模型生命周期管理\
  \ [54]。\n\n向可持续 AI 发展的运动与嵌入式系统的低功耗需求高度契合。\n\n## 24.6.5 研究方向与开放挑战\n\n为了弥补差距并充分利用\
  \ IoT–ML 的潜力，未来的研究应考虑以下方面：\n\n1. `联邦学习与持续学习`：设计具有韧性的学习算法，在保护隐私的同时适应不断变化的数据分布。\n\
  2. `鲁棒性与安全性测试`：开发仿真环境以测试对抗攻击，并设计具有形式化保证的 ML 模型。\n3. `边缘 AI 硬件协同设计`：联合优化硬件和模型设计，以满足延迟、能耗和准确性目标。\n\
  4. `多模态传感器融合`：使用基于注意力的模型结合视觉、声学、触觉和上下文数据以实现情感知。\n5. `伦理治理`：提出政策层面的指南，以监管数据收集和 ML\
  \ 部署，特别是在医疗和国防领域。\n\n## 结论\n\nIoT 与 ML 的融合代表了数字系统感知、处理和响应现实世界数据的方式深刻变革。本研究探索了 IoT-ML\
  \ 集成的动态演变，从其基础原理和早期技术，到边缘计算、联邦学习（FL）和实时决策的出现。IoT-ML 系统正在从静态的、特定领域的解决方案演变为通用且可扩展的平台。然而，实现这一愿景不仅需要技术的进步，还需要统一的标准化、跨学科协作以及基于伦理的设计。随着工业界和研究人员接受这种融合，IoT–ML\
  \ 将成为下一代智能环境的核心，为可持续且响应的数字生态系统铺平道路。\n\n## 参考文献\n\n1. J. Gubbi, R. Buyya, S. Marusic,\
