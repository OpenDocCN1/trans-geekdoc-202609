  \ GBM | 1.00 | 0.93 | 0.92 |\n\n## 13.6 在可解释性上的工作：Shap 的应用\n\n### 模型 1 XGB：折线图\n\
  SHAP 方法用于模型预测。第一条预测的解释使用 `shap.plots.waterfall(shap_values[0])` 进行可视化。提供此图的输入是解释对象的一行。折线图旨在显示单个预测的解释。XGB\
  \ 输出的期望值（此处为 0.351）显示在图底部。每行说明了每个特征的正向（红色）或负向（蓝色）贡献如何改变从预期模型输出到该预测输出的值。默认情况下，SHAP\
  \ 使用 `XGB Classifier` 的边缘输出在逻辑连接函数之前进行解释 [23]。因此，X 轴是对数几单位。\n\n### 折线图\n图 13.40](#ch21.xhtml#f120)\
  \ 显示了各种特征对第 50 个实例的影响。每一行说明了每个特征的负向（蓝色）或正向（红色）贡献如何改变从预期输出（E [f(x)= 0.351]）到模型预测值（f\
  \ (x)）。在这里，`f(x) = E(f(x)) + SHAP value` 适用于每个特征。\n\n\n\n\n\n![图 13.40 XAI 的工作流。](img/9781041062943_C013_040.jpg)\n\
  \n**图 13.40** XAI 的工作流。](#ch21.xhtml#f12b)\n\n此样本的每个特征值由特征名称前的灰色文本指示。当模型中的特征数量超过最大显示参数时，特征将根据\
  \ SHAP 绝对值排列在瀑布图的底部。89 个最不显著的特征在上面的解释中被合并成了一个术语。`max_display` 参数可用于更改默认的 10 行限制。在此图中，它保持为\
  \ 40。命令 `shap.plots.waterfall(shap_values = 50, max_display = 40)` 显示数据集中第 50 个实例的此图。红色特征是那些提高预测结果的特征，而蓝色特征是那些降低预测结果的特征。图\
  \ 13.40 显示了此图。\n\n### 13.6.1 标签为“0”的实例 (50) 的力图\n\n为了观察特征对模型预测的影响作用，SHAP 力图中的“标签”（label）指的是与数据点相关的预测类别或目标值，而“实例编号”（instance\
  \ number）指的是所选数据点的索引，本质上是指正在解释数据集中的哪一行 [24]。力图说明了每个特征如何影响该特定数据点的预测。图上的每条条都代表一个特征，条的长度显示了它对预测的贡献程度。贡献“0”结果的特征是通过查看测试集中的第一个样本来识别的。这将通过在提供此力图的同时提供\
  \ SHAP、期望值和测试样本来实现。红色条通常显示 `Positive_Contributions`（正向贡献），它们将预测推向更大的值；蓝色条显示 `Negative_Contributions`（负向贡献），它们将预测推向较小的值。\n\
  \n图 13.41 显示了使用命令通过力图对第 50 个实例的可视化。此图是通过选择实例编号 (50) 和对应的标签“0”创建的。索引 (0) 的模型输出为 0.95。在转换为概率空间后，这个“原始”值产生了最终的输出“0”和“1”。图\
  \ 13.41](#ch21.xhtml#f121) 显示了基础值以及特征对“0”结果的贡献。训练期间所有模型输出值的平均值即为基础值。特征 `RP-M410:\
  \ *I = 632.6` 的贡献以蓝色显示，而 `R2-PA5: IH = 162.4` 以红色显示。该实例对标签“0”的其他特征的贡献也显示在图 13.41\
  \ 中。模型预测的最终输出为“0”，因为预测值 (0.95) 高于 (0)。\n\n![图 13.41 力图-1。](img/9781041062943_C013_041.jpg)\n\
  \n**图 13.41** 力图-1。](#ch21.xhtml#f121b)\n\n### 13.6.2 标签为“1”的实例 (12) 的力图\n\n为了确定哪些特征贡献了标签“1”，选择了数据集的第\
