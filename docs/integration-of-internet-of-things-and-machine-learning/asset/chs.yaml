  \ 21–28)。](#ch21.xhtml#r450b)\n\n# 14.4 人工智能 (AI) GestureDraw：基于计算机视觉和 AI 辅助的手势绘图界面\n\
  \nSwathi Gowroju, Shilpa Choudhary, Annoji Sri Poojith, Puvvula Haritha, Shaga Preethika,\
  \ 以及 G. Sai Kiran\n\nDOI: [10.1201/978100634768-14](http://doi.org/10.1201/978100634768-14)\n\
  \n## 14.1 引言\n\n在过去的几十年里，人机交互 (HCI) 已从传统的键盘和鼠标输入设备向更自然、更直观的模式发生了巨大变化，例如触摸屏、语音命令和手势识别。在这些方式中，手势识别是人类与数字系统交互的最变革性方式之一。例如，1980\
  \ 代 Myron Krueger 开发的“Videoplace”中基于手势的界面，初衷是为了让技术变得易于获取且具有趣味。计算机视觉和人工智能技术已经进步，使得对手势进行非常准确且高效的识别，并将从游戏化到医疗、教育和创意设计的创新应用变为现实。现有的手势识别工作基于使用不同的算法和技术对人类手势进行准确解释。例如，传统方法依赖边缘检测和轮分析作为识别手势的手工特征。通常，所有这些方法由于光照条件的变化、背景干扰的存在以及手部位置或移动的不一致而容易失败，这不利于手势识别的准确性。316.得益于深度学习，这一学科经历了革命，让机器能够从大型数据集中学习甚至复杂的模式。目前为止，卷积神经网络\
  \ (CNN) 和循环神经网络 (RNN) 等模型已用于许多手势，以在不同的手势识别应用中实现卓越性能。预训练模型如 MediaPipe Hands 和 OpenPose\
  \ 持续通过手势识别应用中的稳健框架，使得实时手部检测和追踪变得更加容易。\n\n\n\n\n\n# 引言\n\n基于上述所有进展，所提出的系统——人工智能（AI）`AI\
  \ GestureDraw`，展示了一种结合了 AI 驱动输出生成的新型手势识别技术。`AI GestureDraw` 的独特之处在于它将实时手部追踪与超越简单解释能力的先进\
  \ AI 能力相结合，不仅增强了用户生成的草图，还确保了无缝、智能的用户体验。除了允许用户通过追踪实时手部动作来创建数字草图外，该系统还利用 AI 分析并增强用户的草图。因此，它本质上使用了计算机视觉技术结合深度学习模型，来理解手部动作如何转化为有意义的输出。`AI\
  \ GestureDraw` 具有几个构成其创新功能的关键要素：\n\n1. **手部追踪与手势识别**：(a) 系统采用了一些先进的手部检测和跟踪技术，可以识别手部最重要的关键点并以极高的准确度解释手势。(b)\
  \ 这如 `CNNs` 等算法可以分析手部动作的空间和时间特征，因此系统能够区分哪个手势代表绘图、清除画布或调用 AI 处理。\n2. **动态内容生成**：它利用人工智能来解释创建的任何草图，从而提供与上下文相关的输出。这种过程涉及解释手绘输入，并直接针对用户的意图找到响应或解决方案。\n\
  3. **交互式界面**：该系统提供了一个直观且易于使用的实时交互平台，用户可以在其中查看其手部动作转化为画布上的绘画，同时接收 AI 生成的反馈或解决方案。\n\
  \n所提出的系统通过人工智能和计算机视觉的应用，转化了数字创造和参与度。它通过破译自然手部动作摒弃了传统的输入设备，使用户能够自然地进行创作或素描。AI 通过改进形状、纠正错误或即时提供原创想法改进了这一过程。其应用非常广泛，包括康复（为运动功能障碍人士提供无障碍工具）、创意艺术与设计（能够实现复杂的创作）以及教育（提供交互式学习体验）。其他应用还包括产品设计与原型制作（简化构思生成）、沉浸式虚拟现实与增强现实（`VR/AR`）体验（使用户能够与三维\
  \ `3D` 环境交互）、游戏（实现基于手势的交互）以及用于 `317.virtual` 会议的协作工具。这项技术通过 AI 驱动的改进与简单性相结合实现了变革。`AI\
  \ GestureDraw` 是将人类对技术精度的直觉及其以系统化、整合方式的应用的一个卓越范例。通过将高级手势识别能力与生成式 AI (`GenAI`) 结合，该系统既简化了数字内容的创建与交互过程，又跨领域提供了新的创新空间。本文阐述了支持\
  \ `AI GestureDraw` 的技术基础，例如其开发过程和底层算法，旨在彻底改变数字系统的参与方式。\n\n论文的其余部分结构如下：`Section 14.2`\
  \ 包含文献综述，`Section 14.3` 讨论了提出的系统。`Section 14.4` 展示了所提系统的结果分析以及与先进技术的对比分析。`Sectiosn14.5`\
  \ 总结了本文工作。\n\n## 14.2 文献综述\n\n手势识别是人机交互（HCI）中不断发展的领域之一，已有若干突破旨在增强应用程序（包括无接触界面）的精度、实时执行和可用性。在该领域开展的大部分工作\
  \ `[1–12]]` 在应用技术上有所不同，例如 `CNNs`、`optical flow` 和基于媒体的手部追踪，每种技术都对手势识别的准确性和熟练度提供了独特的贡献。尽管如此，关于将基于手势的交互与\
  \ AI 驱动的反馈机制相结合的研究仍然很少，表明该领域仍有深度空间。`Table 14.1` 显示了基于 AI 的手势识别的文献综述。\n\nReddy 等\
  \ `[1]` 和 Khan 等 `[5]` 分别探索了基于 AI 的手势识别，分别提供了 95.2% 和 96.8% 的准确率。尽管这些方法在孤立手势识别方面运行良好，但在不受控的光照条件和复杂环境下的实际实现通常面临挑战。其他相关研究人员如\
  \ Yusuf 等 `[2]` 和 Podder 等 `[3]` 分别提出了基于 `MediaPipe` 和 `YOLO` 的手部检测方案，在动态设置下解决了上述某些问题，但在实时追踪方面仍有很大提高空间。\n\
  \n最近，识别手势并促进创意领域、绘画或教育工具的系统引起了极大兴趣。研究人员 `[4, 7]]` 探索了深度学习技术以及传统的计算机视觉算法，例如 `Haar\
  \ Cascade` 特征和方向直方图 `HOG` 特征。然而，这些方法虽然高效，但与更复杂的模型（特别是 `CNN` 和长短期记忆 `LSTM` 模型 `[6]]`）相比，准确性仍不从心。其他方法基于机器学习和光流技术，如\
  \ Alonazi 等 `[8]]` 和 Rastgoo 等 `[7]]`，它们在基于手势的用户界面中的应用中也显示出潜力，但在手势过快或模糊时在追踪方面存在困难。最后，几项研究实际上指出了上下文感知识别系统，特别是基于\
  \ AI 的反馈，如 Ansar 等 `[10]]` 所述。这些系统的设计旨在具有更强的适应性，取决于手部动作和手势驱动的智能应用。尽管如此，显而易见，设计更健壮、更灵活的系统以适应各种手部姿和实时情况仍然是未来研究的重要目标。\n\
