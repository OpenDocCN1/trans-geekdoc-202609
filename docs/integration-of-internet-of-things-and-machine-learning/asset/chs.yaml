  \ AQI 值的月份（例如峰值较高的 6 月份），并清晰地展示了 AQI 如何响应季节性变化产生波动。\n\n![图 18.12 2024 年每月 AQI 的箱线图。⏎](img/9781041062943_C018_012.jpg)\n\
