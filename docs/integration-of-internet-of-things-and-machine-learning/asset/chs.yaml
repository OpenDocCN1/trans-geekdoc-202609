  \ |\n\n## 22.3 方法论\n\n一种基于人工智能（AI）的动物入侵检测系统分三个阶段工作。第一阶段通过 IoT 传感器检查道路旁和农田附近动物的移动，并将数据发送到深度学习模型进行识别和分类。第二阶段接收来自\
  \ IoT 传感器模型的数据，并训练深度学习模型以对动物进行分类和识别。接下来，第三阶段使用带有蜂鸣器和 LED 的 IoT 传感器，帮助驾驶员避免道路碰撞，向森林管理部门发送信息，并通过自动灯光提醒村民以减少作物受损。\n\
  \n### 22.3.1 系统架构\n\n图 22.1 所示的动物入侵检测系统框图描绘了设备内部相互作用的主要组件。它始于 PIR 传感器和摄像头的输入，这些设备持续捕捉视频或检测运动。随后，视频流被发送到处理单元（通常是\
  \ `Raspberry Pi`），在那里，数据使用机器学习模型（如 `MobileNet SSD`）进行预处理和分析以识别动物。检测到动物时，系统会激活警报机制，可能包括蜂鸣器、LED\
  \ 或发送给驾驶员的数字通知。该图直观地展示了硬件与软件组件之间的协作，实现了实时检测和告警。\n\n![图 22.1 系统架构。](img/9781041062943_C022_001.jpg)\n\
  \n**图 22.1** 系统架构。(ch30.xhtml#f213b)\n\n所提出的动物入侵检测系统将 IoT 组件与深度学习技术相结合，创建一个实时、响应式的系统，用于检测道路附近的动物并向驾驶员发出立即警报。该系统从检测运动的\
  \ `PIR` 开始，该传感器对动物的热信号特别敏感。当传感器识别到移动时，它会信号 `Raspberry Pi 4 Model B` 激活 `Pi Camera`，捕捉周围区域的图像/视频。捕捉到的图像随后使用深度学习的目标检测模型（特别是\
  \ `MobileNet SSD`）进行分析，该模型经过预训练以识别各种物体，并经过微调以专注于识别动物。如果检测到动物，系统会同时触发蜂鸣器和 LED 灯，警报驾驶员和部门道路上或道路附近有动物。\n\
  \n### 22.3.2 SSD-MobileNet 架构\n\n与 `Faster R-CNN` 等传统检测器相比，`SSD` 框架能够高效地检测实时动物。`SSD`\
  \ 架构是一个单一卷积网络，可以在单次运行中同时预测边界框的位置并对这些位置进行分类。具有 `MobileNet` 架构的 `SSD` 模型在道路安全警报中具有即时警报的效率，并在动物检测中具有快速分类的自动响应，效率极高。\n\
  \n采用以 `ResNet` 为骨干的 `CNN` 用于从输入图像中提取显著特征。卷积层在输入图像上绘制边界框，以识别不同尺寸的各种动物，并附带分类评分。高置信度评分的锚框（anchor\
  \ box）通过抑制在其他特征周围绘制的锚框，有助于有效地在动物周围描定出边界框。\n\n### 22.3.3 动物检测模块\n\n动物入侵检测系统的核心是动物检测模块，它利用先进的深度学习技术进行实时动物识别。该模块利用\
  \ `MobileNet SSD` 模型，该模型在 `COCO` 数据集上经过预训练，该数据集包含各种物体图像。这使得系统在检测不同动物物种时具有高准确率。摄像头模块发挥着关键作用，捕捉周围环境的连续视频。当视频流输入时，由\
  \ `MobileNet SSD` 模型进行处理，该模型分析每一帧是否存在动物。一旦成功检测，系统将采取采取行动，例如保存视频片段并触发告警机制。整个处理任务由\
  \ `Raspberry Pi 4 Model B` 高效处理，它作为中央处理单元，确保系统流畅运行并对检测到的入侵做出快速响应。\n\n### 22.3.4\
  \ 运动检测系统\n\n作为动物检测能力的补充，运动检测系统利用 `PIR` 传感器监控环境运动。该传感器旨在检测红外辐射的变化，这种变化在物体在其范围内移动时会发生。当\
  \ `PIR` 传感器识别到移动时，它向系统发送信号，促使其激活摄像头并启动视频录制。`PIR` 传感器的数据由微控制器持续监控，确保系统对任何潜在入侵做出快速响应。除了视频录制外，LED\
  \ 指示器提供了视觉线索，以指示检测到了运动。同时，蜂鸣器发出声音警报，通知附近人员检测到的活动，从而增强对周围可能动物动物意识。\n\n### 22.3.5\
  \ 警报与通知系统\n\n\n\n\n警报与通知系统在向相关利益者通信检测到的动物入侵方面起着至关重要的作用。一旦检测算法识别出动物，系统即可启动警报以确保采取适当措施。该警报机制可能通过多种通信通道（如`SMS`或电子邮件）向定义的联系人发送实时通知。全球移动通信（`GSM`）模块的集成使得`SMS467.notifications`可以直接发送到手机上，提供动物活动的即时更新。或者，也可以利用云服务进行电子邮件警报，以便对事件进行全面的记录。为了进一步增强态感知，当检测到动物时，`buzzer`和次级`LED`指示器均会被激活，提醒附近的人注意动物入侵的潜在风险。\n\
  \n### 22.3.6 视频录制与存储\n\n视频录制与存储模块旨在通过仅在检测到动物时录制视频来优化存储效率。这种选择性录制确保了 `Raspberry Pi`\
  \ 上宝贵的存储空间不会浪费在必要的视频上。录制的视频以 `MP4` 格式保存，这是一种平衡了质量和文件大小的广泛接受的格式。存储位置专门设置为 `Raspberry\
  \ Pi` 上的 `/home/pi/Desktop` 目录，以便于访问和检索录制的视频。通过仅在发生重大事件时保留视频，该系统不仅节省了存储空间，还便于未来对动物入侵进行分析和归档。这一功能对于理解动物行为模式以及制定减轻潜在碰撞的策略至关重要。\n\
  \n这种全面的方法突显了开发动物入侵检测系统所采用的系统方法，强调了其各种组件及其集成，以增强管理道路附近动物出现的安全性和有效性。\n\n## 22.4 实现\n\
  \n在实现方面，我们需要考虑需要集成到我们的 `Raspberry Pi` 模块中的软件。众所周知，`Raspberry Pi` 是一台微型电脑，我们需要为其配备操作系统。`Raspbian\
  \ Buster OS` 是我们 `Raspberry Pi` 模块的理想操作系统。为了方便起见，我们可以选择使用 `Raspberry Pi Imager`\
  \ 在 `SD Card` 上安装它。在提议的系统中，由于我们需要访问命令行，可以下载并安装轻量版而不是用户界面。\n\n### 22.4.1 数据准备\n\n\
  动物入侵检测系统的开发关键取决于数据准备，这保证了模型的可靠性和正确性。模型在 `COCO` 数据集上训练，该数据集包含各种动物的标注图像。为了提高模型性能，使用\
  \ `Labeling` 对标注进行检查和升级，确保现有数据的高质量标注，并并在需要时插入更多照片。数据增强技术（如 `rotation` 和 `scaling`）被用于增加数据集的多样性，使模型能够更好地适应各种现实环境。随后，该数据集被划分为训练集、验证集和测试子集，这促进了模型的成功训练和评估。归一化和准备技术（如缩小照片和缩放像素值）对输入数据进行归一化，以实现有效学习。\n\
  \n### 22.4.2 开发动物检测模型\n\n构建动物检测器涉及整合各种组件和技术，以创建一个用于实时识别动物的可靠高效的系统。这一过程的核心是 `MobileNet\
  \ SSD` 模型，它使用 `COCO` 数据集进行训练，以准确识别各种动物物种。系统首先通过 `camera module` 录制视频片段，并将图像传输给 `MobileNet\
  \ SSD` 模型进行处理。该模型使用深度学习方法检查帧帧并根据既有特征识别动物。为了提高检测效能，系统采用了如 `non-maximum suppression`\
  \ 等方法。\n\n\n\n\nSSD 的训练目标源于 MultiBox 目标 [7, 8]，但对其进行了扩展，以处理多个物体类别。令 `x[i**j]^(p)\
  \ = {1, 0}` 表示第 `i` 个默认框与类别为 `p` 的第 `j` 个真实框（ground truth box）匹配的状态，`c[i]^(p)` 是位置\
  \ `I` 处类别 `p` 的预测置信度（softmax 之后），而 `c[i]⁰` 是背景类的预测置信度（softmax 之后）。\n\n470.471.在上述匹配策略中，我们可以得到\
  \ `Pi x[i**j]^(p) ≥ 1`。公式 22.3 给出的整体目标损失函数是定位损失 (`loc`) 和置信度损失 (`conf`) 的加权之和。\n\
  \n$L\\left( {x,c,l,g} \\right) = \\frac{1}{N}\\left( {L_{conf}\\left( {x,c} \\right)\
  \ + \\propto L_{loc}\\left( {x,l,g} \\right)} \\right)$ (22.3)\n\n其中 `N` 是匹配的默认框数量。如果\
  \ `N = 0`，我们将损失设为 0。定位损失是预测框 (`l`) 与真实框参数 (`g`) 之间的 Smooth L1 损失 [6]。与 Faster R-CNN\
  \ [4] 类似，我们对默认边界框 (`d`) 的中心 (`cx`, `cy`) 以及其宽度 (`w`) 和高度 (`h`) 的偏移量进行回归。\n\n公式 22.4\
  \ 中的置信度损失是针对多个类别置信度 (`c`) 的 softmax 损失，权重项 `α` 通过交叉验证设置为 1。\n\n$L_{conf}\\left(\
  \ {x,c} \\right) = - \\sum\\limits_{i \\in Pos}^{N}x_{ij}^{p}\\log\\left( c_{i}^{p}\
  \ \\right) - \\sum\\limits_{i \\in Neg}\\log\\left( c_{i}^{0} \\right)\\text{where~}c_{i}^{p}\
  \ = \\frac{\\text{exp}\\left( c_{i}^{p} \\right)}{\\sum\\limits_{p}\\text{exp}\\\
  left( c_{i}^{p} \\right)}$ (22.4)\n\n图 22.3 展示了动物检测系统的置信度直方图，显示了预测不同图像时的置信度得分分布。置信度得分范围从\
  \ 0.5 到 0.85，代表了模型在给定帧中检测到物体的确定性（图 22.5）。`Y`-轴显示置信度得分，而 `X`-轴反映检测次数，范围从 0 到 30。正如\
  \ 472. 观察到的，大多数检测落在中等置信度水平，这表明模型能够以 0.94 的较高准确率可靠地识别物体。这种分布突显了模型在现实场景中的性能，在精确率和召回率之间取得了平衡，其中中等置信度的检测更为频繁，从而可以在动物检测系统中进行实际应用。\n\
  \n![图 22.5 测试图像的置信度。⏎](img/9781041062943_C022_005.jpg)\n\n**图 22.5** 测试图像的置信度。⏎\n\
  \n总损失结合了定位损失和置信度损失，通过权重 `α = 1` 进行平衡，并根据匹配的默认框数量 (`N`) 进行归一化。损失曲线图见 图 22.6。该图显示损失在\
  \ 200 个 epoch 之后趋于饱和。\n\n图 22.7 显示了置信度得分与频率频率的直方图，阐明了动物检测系统中检测置信度水平的分布情况。置信度得分范围从\
  \ 0.5 到 0.85，`Y`-轴代表出现频率，从 0 到 8。直方图显示大多数预测具有中等置信度水平，反映了模型在识别动物方面的平衡性能。这种分布表明，虽然模型经常生成中等置信度的检测，但高置信度检测的发生较低。频率分布为模型预测的可靠性提供了宝贵的见解，突出了通过进一步调优或扩展数据集可以帮助提高预测置信度的区域。\n\
