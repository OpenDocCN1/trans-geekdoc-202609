  \ |\n| P A: Z | 阻抗 |\n| P A: Z H | 阻抗角 |\n| S | 继电器状态 |\n\n## 13.3 方法论\n\n在手稿中，多种机器学习分类器被应用于电力系统的入侵检测系统（IDS）。所有分类器都开发了\
  \ `CR` 和 `CM`。分类器的性能基于参考文献 [10] 进行评估：\n\n- `CM`: `CM` 用于显示分类器的运行良好程度。通过将实际类别与预测结果相结合，它可以显示分类器分类结果的细节。\n\
  - `ROCC`: 它被提作为一个新标准，因为当样本分布不平衡时，验证准确率无法准确代表分类器的真实性能。如图图 13.6\n\n**图 13.6** ROCC\
  \ 和 AUC。⏎ ¶ *来源：*文献 [2]。\n- `曲线下面积 (AUC)`: 一般而言，分类器距离 ROCC 到参考线（图 13.6 中的棕色线）越远，性能越好。尽管\
  \ ROCC 可以直观地代表分类器的性能，研究人员总是倾向于使用直观图表来评估性能。ROCC 下的面积被称为 `AUC`。因此，高 `AUC` 值表示分类器良好。246\
  \ 在本研究中，使用这些标准评估了多种分类器的有效性 [11]。\n\n### 13.3.1 CPPS 中的 XAI\n\n它涉及采用 AI 方法在复杂的电力系统框架内，为其选择和行为提供清晰、易理解且透明的依据\
