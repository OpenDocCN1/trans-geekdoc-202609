  \ 通过机器学习和可解释人工智能区分电力系统扰动与网络攻击\n\nNiharika Agrawal 和 Sheila Mahapatra\n\nDOI: `10.1201/9781003634768-13`\n\
  \n## 13.1 引言\n\n机器学习（ML）在现代智能电网（SGs）中区分电力系统扰动与网络攻击起着至关重要的作用。随着智能电网变得更加互联并依赖于数字通信，区分自然系统故障与蓄意网络威胁变得越来越具有挑战性。机器学习算法通过分析实时数据模式，帮助检测和分类电力系统中的事件。它们可以区分自然发生的扰动（如设备故障、线路故障或负载变化）与网络攻击（包括数据注入、拒绝服务\
  \ (DoS) 和控制信号操纵）。机器学习模型通过分析电压和电流波形、频率偏差、负载模式以及通信网络数据等特征，有助于区分合规扰动（例如短路）与恶意操控。机器学习模型可以使用自动编码器（autoencoders）对偏离正常运行的异常模式进行实时检测，并使用循环神经网络（RNNs）进行时间序列预测和识别时间异常。通过结合来自网络层（网络日志、用户活动）和物理层（传感器读数、控制命令）的数据，机器学习可以检测同时影响网络和物理系统的协同攻击。它可以识别诸如虚假数据注入等传统方法难以检测的微妙攻击。机器学习工具能够在故障发生前预测和预测可能的故障及网络威胁，有助于预测性维护规划和隔离受影响电网区域的自动化响应系统。不同的挑战在于：\n\
  \n* 237. 数据质量与可用性：网络攻击的标记数据通常有限。\n* 对抗攻击：如果没有妥善的安全保护，攻击者可以操纵机器学习系统。\n* 可扩展性：管理大规模电网需要高效的模型。\n\
  \n### 13.1.1 主要技术\n\n* 监督学习：（例如支持向量机 (SVM)、决策树 (DTs)）在标记数据上进行训练，以对事件进行分类。\n* 无监督学习：（例如\
  \ K-Means、基于密度的空间聚类算法 (DBSCAN)）在没有标记数据可用时用于异常检测。\n* 深度学习：（例如卷积神经网络 (CNNs)、长短期记忆网络\
  \ (LSTMs)）用于更复杂的模式识别和时间序列分析。图 13.1 显示了学习的类型。\n\n![图 13.1 学习的类型。](img/9781041062943_C013_001.jpg)\n\
  \n**图 13.1** 学习的类型。\n\n文献 [1] 提出了一种通过基于深度学习的混合攻击图模型来增强信息物理生产系统 (CPPS) 网络安全的新方法。作者专注于对网络攻击的早期检测，特别是针对运营技术\
  \ (OT) 网络的网络，结合了运营技术图卷积网络 (GC)-LSTM 和 CNN 进行实时异常检测。它实现了超过 96% 的准确率，优于现有的时间序列异常检测模型。它通过分布式拒绝服务\
  \ (DDoS) 和网络侦察等网络攻击模拟进行了测试。\n\n### 13.1.2 网络攻击类型\n\n* TSA：使用伪造的 GPS 信号干扰系统时钟。\n\
  * 拒绝服务 (DoS)/DDoS：阻塞或淹没通信通道。\n* DRA：重用有效数据包以欺骗系统。\n* FDIA：更改数据以操纵控制系统。\n* 238. MITM：隐蔽地拦截并修改通信。\n\
  \    * 物理攻击：包括直接干扰，如电磁损坏或 RA，它们会操纵系统频率。\n    * CCPA：结合网络和物理方法进行更具破坏性的同步的攻击。\n\n\
  2019 年委内瑞拉智能电网攻击同时使用了网络和电磁干扰。图 13.2 显示了网络攻击的类型。\n\n![图 13.2 不同类型的网络攻击。](img/9781041062943_C013_002.jpg)\n\
  \n**图 13.2** 不同类型的网络攻击。\n\n文献 [2] 提出了一种基于机器学习的侵入检测系统 (IDS)，旨在增强智能电网的网络安全。它侧重于使用电工委员会\
  \ (IEC) 61850 通用对象来保护通信。针对变电站自动化的面向对象的变电站事件 (GOOSE) 关键消息，开发了一种利用机器学习来区分正常运行和网络攻击的新颖\
  \ IDS。创建了正常运行和模拟网络攻击下的 GOOSE 消息数据集用于模型训练和验证。GOOSE 消息的漏洞在于没有内置加密、消息完整性和身份验证，且该协议易受到重放、中间人攻击和伪装攻击。IEC\
  \ 62351 具有某些局限性，它提供了通信层的安全，但在操作层缺乏检测机制。数据采集数据采集 (SCADA) 是一种用于监控、控制和自动化工业过程（包括电力系统）的关键系统。它促进了电网的实时控制和监控，使运营商能够管理跨区域的基础。该系统在确保智能电网的效率、可靠性和稳定性方面发挥着重要作用\
  \ [3]。其主要功能包含在图 13.3](#ch21.xhtml#f84) 中。SCADA 系统是网络攻击的主要目标。关键漏洞包括遗留系统、弱身份验证以及缺乏加密。随着远程访问和物联网设备的集成，攻击面显著扩大。与智能电网\
  \ SCADA 系统相关的各种网络安全措施包括：\n\n![图 13.3 SCADA 的功能。](img/9781041062943_C013_003.jpg)\n\
  \n**图 13.3** SCADA 的功能。\n\n* Stuxnet (2010)：一种针对工业控制系统的恶意软件攻击，展示了网络-物理破坏的潜力。\n*\
  \ 乌克兰电网攻击 (2015)：一次协同良好的网络攻击，使用旨在破坏 SCADA 系统的恶意软件中断了电力供应。\n\n### 239.240.13.1.3\
  \ 电力系统 SCADA 网络安全的未来趋势 [5, 6]\n\n图 13.4](#ch21.xhtml#t22) 显示了未来趋势。\n\n**图 13.4**\
  \ 未来趋势。\n\n### 241.13.1.4 印度的网络攻击\n\n\n\n\n印度电网作为该国基础设施的关键组成部分，已成为多次重大网络威胁的目标，特别是针对\
  \ `SCADA` 系统。这些事件凸显了 `SG` 控制系统中存在的漏洞，以及在增强网络安全措施方面所做的持续努力 [[7]]\n\n1. **中国政府背景小组的针对性攻击：**\
  \ 2021 年，网络安全公司 `recorded future` 识别出一项由中国政府背景小组发起的协同行动，目标是印度的关键基础设施。该行动集中于十个印度电力部门组织。此外，两个印度海港也成为攻击目标。这些攻击旨在收集信息并可能中断印度电网的运行。\n\
  \n2. **尝试在拉达克地区（Ladakh）附近干扰电力配电：** 2021 年初，印度政府报告了中国黑客两次试图针对电力配电中心进行攻击。虽然这些尝试未获成功，但它们凸显了对印度电力基础设施面临的持续威胁。电力部长\
  \ R.K. Singh 表示，已经加强了防御以应对此类网络攻击。\n\n3. **SCADA 系统的漏洞：** 来自印度计算机应急响应小组（`CERT-IN`）的机密数据显示，`SCADA`\
  \ 系统发生了多次攻击。虽然这些攻击中许多是小规模的，但间接证据表明，多年来攻击频率频率规模都在增加。互联网上关于破解 `SCADA` 系统的信息加剧了这些漏洞。\n\
  \n4. **库丹库拉姆（Kudankulam）核电站遭受恶意软件攻击：** 该电厂在 2019 年 9 月遭受了恶意软件攻击，病毒渗透了其管理网络。该恶意软件被识别为\
  \ `Dtrack`，并与与朝鲜的 `Lazarus Group` 相关，旨在收集敏感信息。虽然运行网络未受影响，但这一事件凸显了网络威胁对关键基础设施的潜在风险。\n\
  \n5. **安全增强与监控计划：** 针对这些威胁，`GRID-INDIA` 建立了 `SOC`，用于监控跨 `RLDCs` 和 `NLDC` 的安全事件和事故。此外，`NLDC`\
  \ 的 IT 基础设施已通过先进的安全功能进行了升级。另一个关键实体 `POWERGRID` 也建立了 `SOC`，对关键资产进行 24 × 7 全天监控。这些举措旨在增强印度电网的网络安全态势，并防御未来的攻击\
  \ [[8]]。\n\n这些事件强调了在保障印度电网内 `SCADA` 系统方面面临的持续挑战。[Table 13.1] 显示了来自文献 [[9]] 的描述。\n\
  \n**表 13.1** 关键目标与挑战\n\n| 章节 | 描述 |\n| :--- | :--- |\n| 目标 | 使用 `ML` 区分 `SGs` 中的网络攻击和扰动。\
  \ |\n| 挑战 | 网络攻击模拟自然故障，使操作人员的手工检测具有挑战性。 |\n| 方法论 | 在模拟数据上使用不同的分类方案测试了多种 `ML` 算法。\
  \ |\n| 测试的场景 | 电力系统故障、继电器设值变化以及数据注入攻击。 |\n| 关键算法 | `JRipper` + `AdaBoost`（最佳性能）–\
  \ `Random Forest` – `Naïve Bayes` – `SVM` – `OneR` |\n| 结果 | 使用三类分类方案的 `JRipper`+\
  \ `AdaBoost` 显示出最佳性能，准确率高且误报率低。 |\n| 特征分析 | 顶部特征：表观阻抗、电压、电流相位角和幅度对分类准确性的贡献最大。 |\n\
  | 结论 | `ML` 方法对于区分电力扰动是有效的，但在实际应用中需要针对特定系统的训练数据以获得最佳性能。 |\n\n*来源：* 文献 [[9]]。\n\n\
  此项工作的贡献在于：\n\n1. 在 `Python` 环境下实现了用于判别电力系统扰动和网络攻击的各种 `ML` 技术。\n2. 为 `ML` 模型开发了 `CM`、`CR`\
  \ 和受试者工作特征曲线（`ROCC`）。\n3. 为所有模型计算了不同的性能指标，如准确率、精确率。\n4. 针对三类分类器实现了基于 `SHAP` 和 `LIME`\
  \ 方法的 `XAI`。\n5. 该项研究有助于提高现代电力系统的可靠性、安全性和效率，这些都是实现联合国 17 个可持续发展目标（SDG）中目标 7 的基础。\n\
  6. 通过利用 `ML` 和 `XAI` 处理网络物理实体威胁，本研究为未来能源系统透明化、智能化，并成为清洁且负担得起的能源获取支柱做出了贡献。\n\n##\
