    ## ABOUT THE AUTHOR


    John Slavio is a programmer who is passionate about the reach of the internet
    and the interaction of the internet with daily devices. He has automated several
    home devices to make them ''smart'' and connect them to high speed internet. His
    passions involve computer security, iOT, hardware programming and blogging. Below
