  trans: '


    神经网络通常被设计为能够预测某些事物或对某事物进行分析。神经网络的一个更好的用例就是威胁检测本身。截至目前，威胁检测在很大程度上超出了神经网络的范畴，但它确实具有前景。神经网络目前之所以有点超出范畴，实际上是由于人类无法控制自身的偏见。人体，或者更准确地说是人类的思维，天生就对社区之外的陌生人带有偏见。人类通常是一种社会性动物，倾向于待在紧密团结的社区内，而社区之外的任何事物通常都被视为威胁。这就是为什么很难走向陌生人并开始交谈的部分原因，因为当你走向一个不认识的人并试图与之交谈时，你会感到一种危险感。这种陌生感以一些非常丑陋的方式表现出来，例如种族主义、精英主义，甚至年龄歧视。这些天生的偏见阻止我们真正预测谁是威胁、谁不是，但一些伪科学可能在这方面有所帮助，因为人类能够识别说谎者。嗯，这并不完全是人类的本性，而是我们创造了机器，可以给出一个人是否在说谎的高概率。这包括声音紧张、肢体语言以及其他多种不同的因素，但对于那些构成威胁的人来说，情况也可能是如此。例如，一个初次行动的自杀炸弹客在即将实施行动时，很可能会表现出紧张和焦虑的迹象。任何不该做某事却正在做这件事的帮派成员，都会表现出紧张、焦虑以及激素水平升高的迹象。从技术上讲，我们可以构建机器，获取人类思维的心理方面、构成人体的不同化学物质、流经个体（该个体即将做一件他知道是错的或可能会给生命带来危险的事情）的特定化学物质，并将这些结合起来，对个体是否威胁他人生命进行预测性分析。问题是，这极具侵入性，而且我们是基于已知知识来构建事物的，这意味着如果你对某个特定种族或特定性别特别偏爱，那么这些检测方法就会受到你认为威胁个体应如何被检测的影响。不仅如此，还有一个非常著名的例子，得益于谷歌，一台机器学会了对某个种族产生偏见，因为他们发现谷歌搜索引擎对黑人个体更具种族歧视，原因是黑人个体需要进行背景调查的次数较多。由于大幅增加，他们发现当你搜索黑人个体时，比搜索任何其他个体时，更有可能被建议进行背景调查。因此，我们放入系统的任何东西都依赖于我们当时拥有的偏见以及系统末端发生的偏见，因为神经网络是基于这样的知识构建的：在现实场景中，你通常不知道最终结果会是什么。


    # 神经网络的商业应用


    ## 消除琐碎任务的需求


    神经网络可以提供的所有不同商业应用中，第一个也是最明显的一个就是消除琐碎任务。我们利用机器来消除大部分琐碎任务的一个好例子是，世界上大多数先进公司的产品装配线。你有包装机、称重机、质量保证机，而且
    honestly 列表已经不再详尽了。然而，你确实还有几项仍然由人类执行的琐碎任务。其中第一个也是最明显的一个是归档，因为有些人被雇佣仅仅是为了归档文件。例如，记账员在工作期间需要归档大量文件，除非他们的公司是在线的或基于软件的。即便如此，记账员通常仍然需要归档一些东西，因为大多数人并不完全信任他们的软件。毕竟，如果软件所在的电脑爆炸了，信息会怎样。
    honestly，这可以通过训练神经网络来按正确顺序归档文件来轻松解决。许多不同的企业有许多不同的归档方式，但神经网络能够学习文件是如何被归档的，这样记账员就不需要花费近四分之一的时间来归档文件，只需将一叠文件放在由神经网络控制的架子上即可。然后，神经网络将能够利用给它的机器，按照企业的要求按正确顺序归档文件。这将节省记账员的时间，因此如果企业是那种记账员需要处理数百名客户的企业，他们就不必担心归档文件并浪费时间在那项琐碎任务上。这只是神经网络如何节省员工时间，使他们能够更高效地工作的一个独占示例。另一个例子是几乎无处不在的、毫无用处的手机维修店。作为一个之前修过很多手机的人，我可以告诉你，如果你修过一部
    iPhone，你就基本上修过几乎所有 iPhone。悲哀的事实是，许多 iPhone 在组件布局方面完全相同。更糟糕的是，Android 手机通常是如此难以修复，以至于修复它的价格通常比手机本身还要贵。因此，除非你需要从手机上获取某些非常特定的东西（这通常可以通过利用其他工具完成），否则你通常不会修理
    Android 手机屏幕。这就是为什么我说手机维修店是无用的，因为除非你有 iPhone，否则在手机维修店里很难赚到钱，除非你谈论的是次要服务，例如修理电脑和其他类型的机器。你可以，从技术上讲，构建一个能够处理更换手机屏幕的神经网络。这将在手机维修市场上消灭近一半的市场。另一方面，手机可能有多种问题，因此它并没有完全消灭市场，但它确实消除了更换手机
    LCD 屏幕这一不必要的琐碎任务。这也可以应用于手机维修店，任何不太了解技术如何修复的人都能以大致相同的方式让自己的手机得到修复。我说，当涉及到更换整个屏幕之类的东西时，神经网络会有好处，但它不会取代技术人员的必要性。例如，iPhone
    屏幕的问题可能是由 iPhone 内部的一些故障组件引起的，而不是 iPhone 屏幕本身。在这种情况下，修理 iPhone 所需的经验，与仅仅通过更换整个屏幕来修复
    iPhone 屏幕相比，是目前无法赋予神经网络的。这将需要了解电力如何工作、如何诊断问题、如何找到问题所在，以及如何实际拆下旧零件并焊接新零件。这比拧下几颗螺丝并更换屏幕要复杂得多。基本上，它消除了不太需要批判性思维的工作，但最终，给予足够的时间，你从技术上讲可以训练神经网络做同样的事情。这是当涉及到神经网络以及许多人在其中看到的潜力时的一个可怕因素。


    ## 有效广告


