- raw: 'This leads to our next benefit of having a neural network and that would be
    that they are better at dedicated tasks. A human mind has a lot of things going
    on whenever it focuses on work, which can actually get in front of the work and
    prevent them from doing the work. For instance, a human might have children that
    are constantly distracting them from completing the work, they might also have
    hardware issues that are completely negating what they''re trying to do, and even
    worse is that they may actually be sick. These are all outside variables that
    are affecting how the human is actually working and they are uniquely related
    to human biology. You might be thinking that I stretched it a little bit with
    “hardware issues” but what I''m talking about is someone at work didn''t do their
    job properly and now there is a slowing of traffic online so that the human is
    unable to look up web pages, which would affect neural networks that were specifically
    connected to the internet but since humans would likely be gathering databases
    and preventing neural networks from having access to the online world due to safety
    concerns, this makes the issue uniquely human. Additionally, while a neural network
    could throw all of its processing power at a mathematical problem, a human has
    to wait for something called creativity. Let''s say that we''re on the cutting
    edge of physics and we are trying to solve a problem that no one has ever tackled
    before. A human would likely break the things down into bite-size chunks and spend
    nearly a decade or more on solving a problem. There would be several moments where
    the human managed to overcome the new age mathematics but the problem would be
    that they didn''t know the next step. A neural network would be able to run through
    thousands of different calculations in order to come up with the necessary mathematical
    equation that you were dealing with at the time. The reason why the machine would
    be faster at doing this would simply be due to the fact that the human is only
    capable of sending one processor at the problem while we could send hundreds of
    thousands of processors with a machine.


    ## A Further Abstraction of Mathematics


    This leads to our next benefit of having a neural network that can be dedicated
    to a specific task, which is also capable of forming thoughts in a similar manner
    to a human being, which is to say that we are able to have a further abstraction
    of mathematics. Mathematics, as an industry, is about as abstract as it gets even
    when comparing it to some of the stuff that comes out of human artwork. For instance,
    reading the mathematical equations of quantum physics can often either make someone
    drool out of anticipation or make someone drool out of a coma. It''s not really
    something that''s for everyone but the abstraction level of quantum physics is
    remarkably high. The thing about it is that humans are not built to think abstractly
    because we are built to think in a way that allows us to function as the meat
    suit that we are in. This means that we look at everything from the vantage point
