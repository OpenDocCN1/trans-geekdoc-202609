- raw: 'Even advertisers hate advertisements, but you can''t really get in the marketing
    place without advertising that you have services. Therefore, finding effective
    ways to advertise to people is one of the crucial parts that neural networking
    can provide. We all know the annoying commercials that pop up in front of our
    YouTube videos or regular cable television, if you still have that for some reason,
    and they get really annoying. On the other hand, we also know those commercials
    that have that bit of comedy that we don''t mind missing out on our show for because
    the commercial itself is hilarious. As we have seen, commercials that don''t annoy
    us actually tend to do a lot better whenever advertising their services. I would
    have to say one of the only ways that an annoying commercial can really make any
    progress is to be as annoying as possible. A perfect example of this is the Kia
    radio commercial that always ends in “it''s going to be huge.” This has been said
    so much that it is burned into my brain and has become useful in ending some of
    my jokes. This is because I heard this commercial so much that I simply couldn''t
    remove it from my mind and that is really the only way an annoying commercial
    can effectively stick itself in somebody''s head. However, Mountain Dew is something
    that I remember for the funky monkey that showed on television and I found it
    so bizarre and funny that it has stuck in my head. I only saw that commercial
    once and it has left a permanent impact on me. As you can see, comedy and weirdness
    stick better than blasting me with advertisement after advertisement. However,
    how exactly do you make car insurance funny or how do you make law defense funny?
    The thing about neural networking is that it is built on pre-designed parameters
    that people set and so if you teach neural networking comedy or how to learn comedy,
    you will get a neural networking system that is capable of producing comedy. This
    would allow such a neural networking machine to provide more effective advertisements
    or more effective advertisement suggestions to the marketing team that develops
    the advertisements. Instead of wondering about whether your commercial will be
    successful or not, you can put in the numbers of how many individuals have watched
    your previous commercials and the different concepts that went into those commercials,
    which will give you a prediction from the neural network about whether your commercial
    idea is going to be successful or not. This would save companies thousands to
    millions of dollars when it comes to advertising to millions and billions of people.
    As you can see, such a neural network would have a huge impact on business. Additionally,
    we would get better commercials.


    ## A Very Precise Prediction Ability


    Remember that most of neural networking is centered around making machines think
    like a human so that it can do human tasks. This means that it is able to think
    like a human and therefore predict human actions. That doesn''t mean that it''s
    perfect in its predictions, it just means that it can give you a percentage of
    how much something is likely to happen. This is due to the probability analysis
    that occurs whenever you map out the commonality of certain actions. A great example
    is if an individual is likely to eat a chocolate bar on Sunday when he eats or
    she eats a chocolate bar every day of the week. You can expect the confidence
    level of the neural network to say that they are 99.9% repeating confident that
    the human is going to eat a chocolate bar. On the other hand, if the human eats
    a chocolate bar 3 times throughout the week then the neural network will likely
    predict that the odds of the human eating a chocolate bar is dependent on which
    days he ate the chocolate bar along with the amount of times he ate the chocolate
    bar. What I mean is, if you have the human eating a chocolate bar Monday, Tuesday,
    and Wednesday, then it would follow that there is a lower chance of the human
    eating a chocolate bar on Sunday due to the long strain of the human not eating
    chocolate bars up until the day of prediction. On the other hand, if the human
    were to eat a chocolate bar on Monday, on Wednesday, and then finally on Friday,
    then the odds of the neural network saying that the human is going to eat a chocolate
    bar on Sunday goes up. This is due to the fact that you can recognize the pattern
    of the human eating the chocolate bar every other day so since Sunday would technically
    be an “other” day, we would likely predict that Sunday would be a day where the
    chocolate was eaten. This not only calculates the probability of how often the
    human eats the chocolate bar but also in what order the human will eat the chocolate
    bar. If you complicate things by including the hours at which the human eats the
    chocolate bar then you also will have a prediction level of the exact hour or
    range of the hours that the human will eat the chocolate bar. This can be extrapolated
    to represent models of what humans are likely to do in certain circumstances based
    on past decisions that they made during those types of circumstances. This is
    something that a human can easily do on their own until the number of variables
    becomes too complex for a human to control. For example, in the recent hurricane,
    everyone rushed the I-75 road, which led to the fact that many individuals were
    incapable of evacuating due to the sheer volume of individuals on that road. This
    was not something that many people planned for and so thousands of individuals
    were left stranded on the road. They didn''t have enough gas to make it all the
    way through I-75. Now, if you take the population that encompasses Florida, you
    can easily calculate the likelihood that you will have traffic congestion based
    on the length of the road itself and the number of cars along with their lengths
    to determine how many cars can fit on a road maximally before you get traffic
    congestion. However, you will not be able to detect just how many of those people
    had iPhones with battery packs. I know that that kind of came out of left field
    so to say, but the truth is that there were so many variables that go into predicting
    how many people have battery packs and how many people have iPhones on I-75 that
    trying to predict such a thing during an emergency would be almost ludicrous for
    human being. As for whether it has a purpose or not, it''s not very clear as to
    why you would want to know why individuals might have an iPhone with battery backups.
    The point of the situation is that, as a human, this would be so complex that
    you wouldn''t be able to get a very accurate answer. On the other hand, the neural
    network would probably be able to give you a much better prediction than a human
    would be able to simply due to the fact that it would be able to calculate for
    several thousand different variables that you handed it. A human could do the
    calculations by the way, but they would need far more time since they would need
    to account for foreigners who owned iPhones, every iPhone that ever existed, every
    battery pack that ever existed, and how many illegal iPhones might be circulating
    the state plus more variables I may not be accounting for.


    # CONCLUSION'
