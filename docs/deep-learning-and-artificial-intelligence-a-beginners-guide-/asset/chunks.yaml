  trans: '


    我们更常见的数字神经网络的工作原理最初来源于我们自身大脑中存在的生物网络。科学家认为，在构建能够解决问题的复杂机器时，这将是唯一的解决方案之一。这是因为我们头脑中神经网络的简单性。你看，当我们产生一个想法时，电流会流经我们的神经元。神经元是大脑中膜的角状部件，充当输入和输出开关。神经元通过薄膜导线连接，允许电路在它们之间穿行。与我们所知的更适合硅的神经网络不同，我们大脑中的神经网络是由多个神经元相互连接而成的。一个神经节点可以有两个甚至八个不同的连接，甚至更多，这些连接允许电流流经该神经节点并流出。在某些情况下，我们已经能够复制如此先进的神经节点，但大多数情况下，从长远来看，我们仍然坚持使用两个连接的输入和输出。这是因为神经节点背后的本质非常简单。神经节点允许具有一些偏差、一些电路，并产生导致另一个神经节点的结果。这些神经元共同构成了我们的大脑，这就是它思考的方式。简单的部分在于，构成神经节点网络的总共只有大约四个组件。你有神经节点、连接、神经节点的输入以及网络本身。由于这个网络的简单性，你可以形成几个复杂且不断扩展的网络，来解决比你正在创建的网络复杂得多的问题。通过复制网络，科学家开始让我们能够用简单的解决方案解决复杂问题。毕竟，我们能够在树莓派处理器上创建一个神经网络，其性能足以运行神经网络可以提供的一些小规模应用。树莓派大约
    30 到 40 美元，这意味着我们可以基本上让几乎每个拥有电脑的人都能使用神经网络。


    ## 问题


    我们与生物神经网络存在的问题是，生物神经网络尚未被完全理解。当然，我们理解它们的一般功能，甚至理解我们大脑中神经网络的一些更深层次的组件。问题是，我们不完全了解它实际如何工作，因此在弄清楚神经元究竟如何工作时，我们在玩一种有根据的猜测游戏。例如，有几个不同的项目试图绘制神经元如何识别与之前识别过的相同对象的图谱。他们通过在头骨上种植大量电极来实现这一点，以便他们可以绘制出当物体放置在他们面前时出现的频率。因此，我们在机器中使用的神经网络是基于对我们头脑中网络的不完整了解。这意味着有几种巧妙的方法来设计神经网络以执行特定任务，但在神经网络方面，目前没有一种最佳方法。讽刺的是，这有点像编程，因为尽管像
    C 这样的语言速度极快，但仍有个人更喜欢 Python、PHP 和 Ruby 等东西。这些语言更容易使用，因此更受青睐，尽管 C 语言在许多情况下实际上更快。这不是关于程序本身的速度，而是关于你是否能够完全分解并理解程序本身是如何工作的。因此，许多人更喜欢解释型语言，因为理解人类语法比理解人类无法构思的机器码和字节码的许多不同细微差别更容易。


    这种解释上的差异通常源于我们作为人类存在的问题，即我们经常利用对象来描述我们的周围环境。我们以面向对象编程的形式直接在代码中体现了这一点，它允许我们在编程中定位对象或将编程与对象相关联，以便我们更容易地进行编程。曾经有几种不同的运动试图摆脱这种面向对象编程方法，但由于这种编程的易用性，要摆脱它非常困难。人们之前试图摆脱它的原因是，以一种对机器来说并不真正有意义但对人类有意义的方式编程时，会自然伴随几种非常明显的错误。


    ## 机器与人类


    神经网络的讽刺之处在于，我们也将其基于一个非常有缺陷的程序。人类的头脑实际上充满了错误，只需稍微深入心理学就能看出这一点。人类的头脑默认构建用于识别模式，这意味着我们会在最荒谬的事物中发现模式。一个很好的例子是将两个苹果相隔大约两英寸放置，然后在下面放一根香蕉。你会识别出要么是一个皱眉的脸，要么是一个微笑的脸。这绝对荒谬，因为那只是两个苹果和一根香蕉，但我们对识别模式如此敏感，以至于在没有实际面孔的情况下也会看到一张面孔。这成为神经网络的一个问题，因为它们无法立即识别面孔。因此，在刚开始时创建的最常见的初学者神经网络之一是能够识别面孔的网络，这是由
    Facebook 完成的。Facebook 能够让神经网络区分边缘，然后根据这些边缘开始拼凑出一个真实的人脸，如果人脸符合某一组参数，它会自动将其识别为面孔。这的问题是，它对面孔长什么样做出了几个不同的假设。例如，参数可能是中间有一个三角形，两侧有两个椭圆形，高于三角形，下方有一个椭圆形。之所以这是一个问题，是因为并不是每个人都有鼻子，并不是每个人都有两只眼睛，而且在非常罕见的情况下，有些人没有你期望看到的标准嘴巴。这种类型的神经网络造成了几个不同的问题，但由于我们的参数，我们开始看到人类心灵在识别面孔时具有特定的偏见。我们理解这些偏见会干扰神经网络应该如何学习识别面孔，但其中一些偏见几乎不可能修复。因此，在创建神经网络时，你也必须处理人类神经网络中存在的错误。


    # 人工神经网络


    ## 神经元


