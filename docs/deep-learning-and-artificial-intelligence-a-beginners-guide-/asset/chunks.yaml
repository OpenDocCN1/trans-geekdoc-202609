  trans: '


    即使广告商也讨厌广告，但如果不宣传你有服务，你就无法真正进入营销领域。因此，寻找向人们做广告的有效方法是神经网络能够提供的关键部分之一。我们都知道那些在 YouTube
    视频前或常规有线电视中弹出的烦人广告，如果你出于某种原因还在看的话，它们真的很烦人。另一方面，我们也知道那些带有一点喜剧元素的广告，我们并不介意错过节目，因为广告本身就很有趣。正如我们所见，那些不惹人烦的广告在宣传服务时往往效果更好。我不得不说，烦人的广告要想取得任何进展，唯一的办法就是尽可能地烦人。一个完美的例子是起亚汽车的广播广告，它总是以“它将会非常盛大”结束。这句话被说得太多次，以至于深深印在我的脑海里，并且在结束我的一些笑话时变得很有用。这是因为我听这个广告听得太多，以至于我无法将其从脑海中移除，而这确实是烦人的广告能够有效地在某人脑海中留下印象的唯一方式。然而，我记得百事山露是因为电视上出现的那只怪异的猴子，我觉得它非常古怪又有趣，以至于一直留在我的脑海里。我只看过那个广告一次，但它在我心中留下了永久的影响。正如你所见，喜剧和古怪比不断向我轰炸广告更容易让人记住。然而，你究竟如何让汽车保险变得有趣？又如何让法律辩护变得有趣？神经网络的特点在于它是基于人们设定的预先设计参数构建的，所以如果你教导神经网络喜剧或如何学习喜剧，你将得到一个能够产生喜剧的神经网络系统。这将使这样的神经网络机器能够向开发广告的营销团队提供更有效的广告或更有效的广告建议。与其猜测你的广告是否会成功，不如输入之前广告的观看人数以及这些广告中融入的不同概念，神经网络将据此预测你的广告创意是否会成功。这在面向数百万甚至数十亿人做广告时，可以为公司节省数千到数百万美元。正如你所见，这样的神经网络对商业将产生巨大影响。此外，我们还能看到更好的广告。


    ## 非常精确的预测能力


    请记住，大多数神经网络都集中在让机器像人类一样思考，以便它能够执行人类任务。这意味着它能够像人类一样思考，因此能够预测人类行为。这并不意味着它的预测是完美的，只是意味着它可以给出某事发生的可能性百分比。这是由于每当你绘制某些行为的共性时所发生的概率分析。一个很好的例子是，如果一个人每周每天都吃巧克力棒，那么他或她在星期日吃巧克力棒的可能性很大。你可以期望神经网络的置信度表示，他们有
    99.9% 循环的把握认为这个人会吃巧克力棒。另一方面，如果这个人一周吃三次巧克力棒，那么神经网络可能会预测，这个人吃巧克力棒的几率取决于他吃巧克力棒的日期以及他吃巧克力棒的次数。我的意思是，如果这个人在星期一、星期二和星期三吃巧克力棒，那么由于在预测日期之前这个人长时间没有吃巧克力棒，他星期日吃巧克力棒的机会就会较低。另一方面，如果这个人在星期一、星期三，最后在星期五吃巧克力棒，那么神经网络预测这个人会在星期日吃巧克力棒的几率就会上升。这是因为你可以识别出这个人每隔一天吃一次巧克力棒的模式，由于星期日从技术上讲是一个“其他”日子，我们可能会预测星期日会是吃巧克力棒的一天。这不仅计算了人类吃巧克力棒的频率概率，还计算了人类吃巧克力棒的顺序。如果你加入人类吃巧克力棒的小时数来使事情复杂化，那么你也将拥有关于人类将在哪个具体小时或小时范围内吃巧克力棒的预测水平。这可以推广为代表人类在某些情况下可能会做什么的模型，基于他们在过去那些情况下所做的决定。这是人类很容易自己做到的事情，直到变量数量变得太复杂，人类无法控制为止。例如，在最近的飓风期间，每个人都涌向
    I-75 公路，导致许多个人无法撤离，因为那条路上的人数实在太多了。许多人没有计划到这一点，因此成千上万的人被困在路上。他们没有足够的汽油走完整个 I-75。现在，如果你考虑涵盖佛罗里达州的人口，你可以很容易地根据道路本身的长度以及汽车数量和长度来计算交通拥堵的可能性，以确定在出现交通拥堵之前一条路最多能容纳多少辆汽车。然而，你将无法检测出其中有多少人带有电池组的
    iPhone。我知道这有点突兀，但事实是，预测有多少人带有电池组以及有多少人在 I-75 上拥有 iPhone 涉及如此多的变量，以至于在紧急情况下尝试预测这种事情对人类来说几乎是荒谬的。至于这是否有目的，不太清楚你为什么想知道个人可能带有电池备份的
    iPhone。情况的要点是，作为人类，这将非常复杂，以至于你无法得到非常准确的答案。另一方面，神经网络很可能能够给出比人类更好的预测，仅仅因为它能够计算你交给它的几千个不同变量。人类也可以进行计算，但他们需要花费更多时间，因为他们需要考虑拥有
    iPhone 的外国人、所有曾经存在过的 iPhone、所有曾经存在过的电池组、可能在该州流通的非法 iPhone 数量，以及我可能没有考虑到的更多变量。


    # CONCLUSION


    '
