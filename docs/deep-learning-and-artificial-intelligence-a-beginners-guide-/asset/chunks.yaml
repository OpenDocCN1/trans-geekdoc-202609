- raw: 'I know that this could have been included in a previous section but I wanted
    to wait until we got to talking about the different types of algorithms that networks
    can use because we need to talk about the one that started it all. The Perceptron
    was the very first and simplest neural network ever created. The best part about
    the Perceptron was that it was extremely simple to understand. It would take in
    an immeasurable amount of inputs and always produce either a one or a negative
    one. This is where you''re going to learn how your neuron works. Essentially,
    imagine you have however many inputs you have going into a singular neuron that
    is then connected to the output. The output will be your prediction and the inputs
    will be your data set. Inside of the neuron, you take the sum of the inputs that
    you''re going to give the neuron along with the weights that the inputs are traveling
    on. You then use a mathematical function to reduce the data that has been given
    to the neuron to either a one for activation or a negative one for deactivation.
    This is why this step is called the Activation Function and it is inside of every
    single neural network neuron. The most common implementation of how to get your
    +1 or -1 is to use the sine function. So, because this is so important, let’s
    get down into the math. Let’s say I have a pocketbook of bills but I don’t know
    if they are dollars or hundreds of dollars. Therefore, I will feed our imaginary
    machine all of the bills in my pocket and now there is a weight for every single
    bill I have. Let’s say that our weights go from one to ten because I have ten
    bills. Now, since I have ten bills and I’m trying to figure out how much of each
    I have, it becomes a different type of solution in the neuron. We’ll call this
    the “how much of each” function. You know that question you asked Google about
    how much of something is and it presents you with some actual measurements of
    its own? This is similar to that. Therefore, it takes each of them, one at a time,
    and counts them. Obviously, we could just set up an algorithm to count each of
    the bills and we’re done, but now I’m going to throw a monkey wrench in there.
    I want to know how much I keep on hand throughout the year by weeks. Now, instead
    of the algorithm calculating how much I keep on average, I want it to predict
    the following year of weekly money I have in my pockets. You might go, “well,
    that can be solved by finding the average of each month.” but I say, “Nay!” Let
    me show you why.


    Let’s say that I have a week, randomly according to human standards, where I don’t
    have any money. The algorithm would have been set up to keep track of how much
    money I had on hand each week for a year. Then the algorithm would have access
    to all of that data. As of right now, the program gives me a +1 if I will have
    over $500 and a -1 respectively. It will also do this for $200 and $100. In order
    to predict what I want it to predict, I need to hand it an equation that would
    be handled by one neuron. Remember, we’re just handling this with one neuron.
    This equation would have to figure out my average by month, by six-month, by bi-weekly,
    and by tri-month. It would then need to notice any similarities between the weeks
    I had nothing and the weeks I had something. We would say our habits are random,
    but, oh look, I’ve got no cash money either on a day near the end of the month
    or near the beginning of the month. For month 1, I had no money on the first week,
    then no money on the second week of month 2, no money on the third week of month
    3, no money on the first week of month 4, no money on the last week of month five,
    six, and seven, but then I have no money on the second week of month eight, no
    money in the third week of month 9, no money on the last week of month 10, 11,
    and 12. Now, most would think that the pattern is the end of the month but that
    only accounts for some of them. The last thing I’m going to do is give the algorithm
    access to the calendar and all events will be listed on it. Low and behold, 90%
    of the time the algorithm will now tell me I have no money on Holidays and Major
    Events. New Years, Valentine''s, March Madness, April Fool’s Day, Graduation Day
    for most kids, an oddity to the system, Independence Day, Start of School for
    most kids, a birthday, Halloween, Thanksgiving, and Christmas. As I said, the
    average person would look for a correlation for the end of the month but the machine
    would automatically see that there is an event nearly every time I’m broke. What
    about the rest of the guesses? Not just if I am broke, but the three remaining
    measurements. How can a single Neuron keep track of money, current date, future
    dates, previous dates, currency value, and events if it is meant to do something
    more than run the average mill of a program? It can’t without a heavy amount of
    writing, but what if it could? Let’s talk about the MLP.


    ## MLP: Multi-layer Perceptron


    Originally, the Perceptron was actually built to detect faces. That''s right,
    in 1957, they were trying to work out technology that would allow them to recognize
    faces and they failed horribly. However, due to their wonderful experiences, we
    now have what is known as neural networking and we also now have facial recognition
    software. What they found out with their first Perceptron was that it didn''t
    give back a lot of good predictions primarily because it couldn''t handle all
    of the different variables and it wasn''t good at keeping track of multiple layers
    of information. Who am I kidding, it was the humans that were the problem and
    they simply couldn''t program the neuron to do multiple layers of calculations
    that seem unconnected. Instead, they found out that if they used more than one
    perceptron, they could keep the code simple enough to where they could code what
    they needed to code and this became the first neural network. The Perceptron was
    a whole bunch of singularly powered neurons but they each worked on separate jobs,
    much like our computers do. We simply didn''t have the algorithms necessary for
    them to work interconnectedly. Now, going from a single process to a multi-process
    is actually pretty easy because all you have to do is figure out how to get them
    to work on separate jobs so that when they come together they produce a combined
    result. We do this all the time in programming, it''s just a little bit more difficult
    whenever you''re talking about hardware. This is where the MLP or Multi-layer
    perceptron comes from. They found that with the added amount of Perceptrons, the
    prediction rates became significantly better.


    ## Recurrent Net'
