- raw: 'The original concept for how our more common digital neural networks work
    come from the biological networks that we have within our own brains. Scientists
    believed that this would be one of the only solutions when it came to build a
    complex machine that could solve problems. This is due to the simplistic nature
    of the neural network that we have in our heads. You see, when we have a thought,
    we have electricity running through our neurons. Neurons are corner pieces of
    membranes within our brains that serve as an input and output switch. Neurons
    are connected through thin membrane wires that allow electrical pathways to traverse
    in between them. Unlike the more silicon friendly neural networks that we know
    of, neural networks in our brains are connected by multiple neurons going to and
    from them. A neural node can have anywhere from two to even eight different connections
    and maybe more that allow for electricity to go through and out of that neural
    node. In some instances, we have managed to get to the point where we are able
    to replicate such an advanced neural node but, for the most part, we stick with
    the input and output of two connections in the long run. This is because of how
    simplistic the nature behind neural nodes is. A neural node is allowed to have
    some bias, some electrical pathway, and to produce a result that leads to another
    neural node. These neurons collectively form our brains, which is how it thinks.
    The simplistic part of it is that there are only about four components in total
    that make up a neuron node network. You have the neuron node, the connections,
    the input to the neural node, and the network itself. Due to the simplicity of
    this network, you can form several complex and ever scaling networks to solve
    problems that are far more complex than the network that you''re creating. By
    replicating the network, scientists have begun to give us the ability to solve
    complex problems with simplistic solutions. After all, we are able to create a
    neural network on a Raspberry Pi processor that is sufficient enough to run some
    of the more small-scale applications that neural networks can provide. A Raspberry
    Pi is around $30 to $40, which means that we can basically give access to neural
    networks to nearly everyone who is capable of owning a computer.


    ## The Problem


    The problem that we have with biological neural networks is that biological neural
    networks are not completely understood yet. Sure, we understand their general
    function and even some of the deeper level components that come with the neuron
    network that we have in our brain. The problem is that we don''t fully understand
    how it actually works and so we''re making an educated guessing game when it comes
    to figuring out how neurons really work. For instance, there are several different
    projects that try to map out how neurons can actually identify objects as the
    same objects as they identified before. They do this by planting a whole bunch
    of electrodes on top of the skull so that they can map the frequency that occurs
    when an object is placed in front of them. Therefore, we are basing the neural
    network that we’re utilizing in our machine on an incomplete knowledge of networks
    inside of our heads. This means that there are several clever ways of devising
    neural networks to do specific tasks but there is no one best way when it comes
    to neural networking right now. The ironic part is that this is kind of like programming
    because even though a language like C is extremely fast, you still have individuals
    who prefer things like Python, PHP, and Ruby. Those languages are easier to work
    with and so they''re more preferred even though the language of C is actually
    faster in a lot of the cases. It''s not about the speed of the program itself,
    it''s about whether you can fully break down and understand how the program itself
    is working. Therefore, many people prefer interpreted languages because it''s
    easier to understand human syntax rather than the many different nuances that
    come with machine code and bytecode that humans aren''t capable of conceiving.


    This difference in interpretation normally comes from the issue that we have as
    humans in that we often describe our surroundings by utilizing objects. We have
    this directly in our code in the form of object-oriented programming, which allows
    us to orient the objects in programming or relate programming to objects so as
    to make it easier for us to program. There have been several different movements
    to try and get rid of this object-oriented programming methodology but due to
    the ease of this type of programming, it''s very difficult to get rid of. The
    reason why people have tried to get rid of it before is that there are several
    very pronounced bugs that naturally come with programming something in a way where
    the programming doesn''t really make sense for the machine but it makes sense
    for the human.


    ## Machines Vs. Humans


    The ironic thing about neural networks is that we''re also basing it off of a
    very buggy program. Human minds are actually littered with bugs and it only takes
    a minor delving into psychology to see this. The human mind is built to recognize
    patterns by default and this means that we will find patterns even in the most
    ridiculous of things. A good example of this is to put two apples about two inches
    apart and then a banana underneath it. What you will recognize is either a frowny
    face or a smiling face. This is absolutely ludicrous due to the fact that it''s
    just two apples and a banana, but we''re so tuned to recognizing patterns that
    we see a face when there is no actual face. This becomes a problem with neural
    networks due to the fact that they do not know how to recognize faces right off
    of the bat. Therefore, one of the most common beginner neural networks that was
    created when they were first starting out was one that could recognize faces and
    this was done by Facebook. Facebook was able to make a neural network tell the
    difference between edges and then begin to piece together an actual human face
    based off of those edges and if the human face met a certain set of parameters,
    it would auto-identify that as a face. The problem with this is that it takes
    in several different assumptions about what a face looks like. For instance, the
    parameters could be that it has a triangle in the middle with two ovals on either
    side that are raised above the triangle with an elliptical shape down below the
    triangle. The reason why this is a problem is that not everyone has a nose, not
    everyone has both eyes, and on a very rare occasion, some people do not have the
    standard mouth that you expect to see. This created several different issues with
    this type of neural network but because of our parameters, we begin to see how
    the human mind has a specific bias when it comes to recognizing faces. We understand
    that those biases will interfere with how a neural network should learn how to
    recognize a face but some of these biases are almost impossible to fix. Therefore,
    when creating a neural network you also have to deal with the bugs that are inside
    of the human neural network.


