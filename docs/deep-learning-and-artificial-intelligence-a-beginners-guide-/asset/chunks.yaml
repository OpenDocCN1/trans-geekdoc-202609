    ## 简介


    欢迎阅读本关于深度学习和神经网络的书籍。我们将深入探讨神经网络是什么，现有的神经网络通过 API 能做什么。一旦我们了解一切如何运作以及这些新技术各自如何工作，我们还将介绍由于神经网络的创建而可应用于日常生活和商业的众多不同应用。现在我希望你意识到，神经网络并非一个复杂的话题，但可能感觉像是一个复杂的话题。


    有很多新闻报道称将会出现自动驾驶汽车、自行制造产品的机器，以及许多其他神经网络的不同应用，听起来像是一个极其复杂的机器。然而，神经网络这一工具是一个非常简单的工具。当你听说正在创建利用神经网络的应用时，你实际上听说的是为了让神经网络做一些复杂但并非神经网络本身复杂的事情所付出的大量工作。正如你将在本书中发现的那样，神经网络非常容易理解，但问题在于人们让它们看起来复杂。因此，让我们继续揭开这个主题的神秘面纱，以便你自己进入神经网络领域并享受其中的乐趣。


    ## 什么是神经网络？


    神经网络是由模拟或非模拟的神经元组成的网络。你在新闻和技术杂志中听到的神经网络是由机器和代码构建的神经网络，但最初的想法来自于我们自身系统中拥有的生物神经网络。神经网络是一种非常高效且非常简单的逻辑进展形式，允许进行极端计算以解决复杂问题。


    ### 神经网络的类型


    由于神经网络可以以许多不同的方式使用，因此存在许多不同形式的神经网络。例如，用于识别图像中事物的同一种神经网络与最适合翻译人们日常使用的语言或口语的神经网络截然不同。你可以认为图像需要一个能够识别照片中不同颜色光谱的神经网络，而另一方面，语言检测神经网络需要不断改变它对你所使用的单词上下文的看法，这是因为语言会随时间变化并具有一定的流动性，这意味着你需要能够随着人们不断前进而改变单词的定义。另一方面，语音识别程序需要能够不断改变，因为语言和口语本身的性质在不断变化。一个很好的例子是
    Google Voice，这是 Google 多年前开发的一款软件，起初非常糟糕。然而，经过一段时间和大量练习后，Google 已经将这样一款糟糕的软件转变为地球上最好的语音识别软件之一，在识别我们的语音模式方面具有最高的准确性。它还能够使用当前句子中的单词和上下文来预测句子中的下一个单词。


    ### 应用


    神经网络的创建并非纯粹为了方便，而是由于神经网络可能提供的潜在用途。由于我们无法将自己放入机器中，因此在某些情况下，能够将我们自己的能力放入机器中将是非常有用的。图像识别可以告诉我们机场内是否有罪犯，语音识别可以检测某人是否目前处于非常紧张的情况，还有神经网络为律师提供服务，这些律师无法简单地查阅律师可以访问的整个数据库，以找到某人多年前处理的、证明或反驳宪法行为的那个非常具体的案例。神经网络在我们日常生活中利用时可以提供的不同类型的应用列表还在不断延续。它不仅对平民有用，而且对企业也有用，例如在预测未来市场、尝试制作新标志或图形设计，甚至从头开始自动构建经过彻底安全问题测试的网站方面。这些神经网络很容易取代地球上几乎每一份工作，这是这个星球上许多伟大的头脑已经开始看到甚至害怕的另一件事。毕竟，如果机器人可以做地球上所有的工作，那么我们为什么还需要呢？别担心，我们离神经网络具有自我意识的那一天还很远，但科学家说那一天会到来，一旦神经网络具有自我意识，它将能够以比我们目前快得多的速度构建新的神经网络。


    ### 神经网络的组件


    有三个组件构成神经网络，这些组件代表了进入我们体内的组件。你有信息输入，中间做某事的东西，以及作为结果的输出。如果这听起来很像你的标准程序，那么你的假设是正确的，因为神经网络并不那么复杂，其创建是对程序工作原理的一种相当巧妙的应用。在正常的人类大脑中，你有一个神经元、一个轴突，而我们既是输入的地方也是输出的地方。在神经网络中，你有一个输入，你有一个神经元，然后你放置输出的地方实际上决定了你在神经网络方面拥有什么类型的机器。


    ## 生物神经网络


