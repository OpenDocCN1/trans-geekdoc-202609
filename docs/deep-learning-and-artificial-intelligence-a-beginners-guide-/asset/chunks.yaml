    我知道这本可以包含在前面的章节中，但我想等到我们讨论完网络可以使用的不同类型的算法后再提，因为我们需要谈谈那个开创一切的算法。感知机（Perceptron）是有史以来创建的第一个也是最简单的神经网络。感知机最好的地方在于它极其容易理解。它会接收大量的输入，并且始终输出
    1 或 -1。这里你将学习你的神经元是如何工作的。基本上，想象你有多少个输入进入一个单一的神经元，然后该神经元连接到输出。输出将是你的预测，而输入将是你的数据集。在神经元内部，你将要给神经元的输入之和，以及输入传输所在的权重相加。然后你使用一个数学函数来将给神经元的数据减少为
    1（表示激活）或 -1（表示去激活）。这就是为什么这一步被称为激活函数，并且它存在于每一个神经网络神经元中。获得 +1 或 -1 的最常见实现方法是使用正弦函数。所以，因为这非常重要，让我们深入数学。假设我有一个装钞票的口袋书，但我不知道它们是美元还是几百美元的钞票。因此，我会把口袋里的所有钞票都输入我们的想象中的机器，现在我拥有的每张钞票都有一个权重。假设我们的权重从
    1 到 10，因为我有十张钞票。现在，既然我有十张钞票，并且我正在试图弄清楚每种有多少，这在神经元中就变成了一种不同类型的解决方案。我们将称之为“每种有多少”函数。你知道你问谷歌关于某种东西有多少的问题，它会向你展示一些它自己的实际测量值吗？这与那类似。因此，它一次一个地处理它们并计数它们。显然，我们可以设置一个算法来计算每张钞票，然后就完成了，但现在我要搅乱一下。我想知道我一年中每周手头保留多少钱。现在，算法不是计算我平均保留多少钱，而是我希望它预测我接下来一年每周口袋里有多少钱。你可能会说，“好吧，这可以通过找出每个月的平均值来解决。”但我说，“不！”让我向你展示为什么。


    假设我有一周，按照人类的标准随机地，我没有任何钱。算法已经设置为记录我一年中每周手头有多少钱。然后算法将能够访问所有这些数据。目前，如果我手头有超过 500
    美元，程序会给我 +1，否则给我 -1。它还会对 200 美元和 100 美元这样做。为了让它预测我想要它预测的内容，我需要给它一个由一个神经元处理的方程。记住，我们只是用一个神经元来处理这个。这个方程需要计算我按月、按六个月、按双周和按三个月的平均值。然后它需要注意我没有钱的周和我有钱的周之间的任何相似之处。我们会说我们的习惯是随机的，但是，哦，看，我在月底附近或月初附近要么没有现金。对于第
    1 个月，我第一周没有钱，第 2 个月的第二周没有钱，第 3 个月的第三周没有钱，第 4 个月的第一周没有钱，第 5、6、7 个月的最后一周没有钱，但第 8
    个月的第二周没有钱，第 9 个月的第三周没有钱，第 10、11、12 个月的最后一周没有钱。现在，大多数人会认为模式是月底，但这只解释了一部分。我要做的最后一件事是给算法访问日历的权限，所有事件都将列在上面。出乎意料的是，90%
    的时间，算法现在会告诉我我在假日和重大事件期间没有钱。新年、情人节、三月疯狂、愚人节、大多数孩子的毕业日、系统的一个奇特之处、独立日、大多数孩子的开学日、生日、万圣节、感恩节和圣诞节。正如我所说，普通人会寻找月底的相关性，但机器会自动看到几乎每次我没钱时都有事件。其余的猜测呢？不仅仅是我是否没钱，还有剩下的三个测量值。一个单一的神经元如何能跟踪金钱、当前日期、未来日期、过去日期、货币价值和事件，如果它被设计用来做的不仅仅是运行程序的平均磨坊？它不能，除非有大量的编写，但如果它能呢？让我们谈谈
    MLP。


    ## MLP：多层感知机


    最初，感知机实际上是用来检测人脸的。没错，在 1957 年，他们正在努力研发能够识别人脸的技术，但惨遭失败。然而，由于他们宝贵的经验，我们现在拥有了所谓的神经网络，我们也拥有了人脸识别软件。他们用第一个感知机发现，它没有给出很多好的预测，主要是因为它无法处理所有不同的变量，并且不擅长跟踪多层信息。我骗谁呢，是人类是问题所在，他们根本无法编程让神经元进行看似不相关的多层计算。相反，他们发现如果使用多个感知机，他们可以保持代码足够简单，以便他们可以编写所需的代码，这成为了第一个神经网络。感知机是一大堆单独驱动的神经元，但它们各自负责不同的工作，很像我们的计算机。我们只是没有必要的算法让它们相互连接地工作。现在，从单进程到多进程其实相当容易，因为你只需要想办法让它们负责不同的工作，这样当它们聚集在一起时就能产生一个组合结果。我们在编程中一直这样做，只是在谈论硬件时会困难一点。这就是
    MLP 或多层感知机的由来。他们发现，随着感知机数量的增加，预测率显著提高。


    ## 循环神经网络


