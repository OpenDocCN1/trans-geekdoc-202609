- raw: 'The primary component in an artificial neural network, the point of this book,
    is the actual neuron itself. The neuron is a decision tree that ultimately decides
    the next PATH for the data to go through. For instance, let''s say that the neuron
    has a Boolean value of false. This would mean that the neuron would send the information
    to point J, which will further decide, based on a Boolean value, where it''s going
    to send the next information. To do this, you not only have to have a decision
    tree inside of the neuron itself but also some weights and biases otherwise known
    as Pathways and biases. Let''s talk about the decision tree just so that you understand
    a little bit more about it. The decision tree is where your bulk code is going
    to go because it ultimately decides what the neural network is going to decide.
    Normally, such an area is vastly complex and has had months of work going into
    this because you don''t normally create a neural network by yourself. There is
    a reason why there are teams of people working on neural networks (such as Tensor
    made by Google). While implementing a neural network is extremely simplistic in
    some cases, depending on what you choose it can be really complex. A great example
    of a decision tree is if you are trying to find out if something looks like a
    face or not from a black and white photo. If there is more white than black inside
    of a photo, then you would say that you have found a contrast in the color. Based
    on the bias of the current node known as a neuron, you would determine that this
    area would need to be explored more. Thus, it would go to a more important node
    or neuron by utilizing a heavier weight in the neuron tree. If it was important
    at that point that the color was darker than the remainder of the colors then
    it would finally output that it found a darker color at that point. By collectively
    finding the darkest parts of a photo, you would essentially be able to find the
    outlines of a photo and thus be able to identify things like faces, trees, and
    other such objects. This is a very basic example of how to utilize a decision
    tree to find out if there is a face in a picture or not and it is only a partial
    representation of how Neural Networks are actually working today.


    ## Weights


    As we''ve mentioned before, weights are the pathways in which the neural network
    travels. There are some Pathways that are more important than others and so we
    put something called weights on them, which really just means that that pathway
    has a bigger integer than the other pathways or that the pathway has a smaller
    integer than other pathways. The bigger or smaller is really depending on how
    the neural network is developed. However, essentially, you are figuring out which
    paths are the more important pathways to travel so that information that is seen
    as important by the neural network travels down the more important pathways so
    that it ends up competing with more important information or becoming the output
    at the end. In most neural networks, the act of changing the weights is actually
    how the machine learns and how you train it. Essentially, during training, you
    figure out where the best paths are making the right choices so that you can lower
    the weights of those making the wrong choices. By fine-tuning the weights, you
    effectively make the machine recognize where the correct paths are much better
    than it had in the previous training sessions.


    ## Bias


    Another part that controls how the information travels through the network is
    the bias set by the neurons itself. For example, going back to the black and white
    photo, we can say that certain neurons set to look at the center of the picture
    are more important than the neurons that are set to look at the outside of a picture.
    By doing this, we are saying that the neurons have a heavier bias to the center
    neurons than the outer neurons. This is not how all biases work, but this is a
    good example of how a bias really should work because these biases allow them
    to judge whether an area that the neural network is working on needs a higher
    priority. The reason why we chose the center of a photograph is due to the fact
    that many people prefer to be the center shot in a photograph unless they are
    with other people.


    ## Input and Output


    The most crucial part of any neural network is what you put into it and what you
    get out of it. This is represented by the input and output, which is just like
    any other program that you put into a machine and that has been developed over
    time. The only difference is that machines work with numbers and you can''t really
    tell a machine that something looks black but, rather, you can provide it the
    hexadecimal number of #000000 and the Machine will process this as being the color
    black. This means that whenever you''re dealing with things like contrast where
    you''re trying to tell whether something is darker or brighter, you have to deal
    with numbers such as those found in HEX color or, ultimately, RGB or red, green
    and blue. The computer works off of a combination of 255 different variations
    of red, green, and blue with individual variations for each of them. Therefore,
    if you decide to say that the area is completely devoid of any color, otherwise
    known as black, you would see the RGB representation of this as RGB (0,0,0). Since
    the computer has no issue in finding colors that match a certain palette since
    it has to color those pictures in the first place, it will be able to easily tell
    whether a specific pixel is black or not. Even better, you could have a system
    that has a neural network studying sections and in which case you would have a
    bias if there is more black than white in a specific area but not all black. By
    saying something is all black, you are essentially saying that there is nothing
    there but black. Instead, such as in our face photo, you would want to find a
    varying shade of black that represents an outline. All information going into
    a neural network has to be represented by either string characters or numeric
    values. Let''s talk about the more meta part of this. In reality, you have one
    set of inputs and possibly thousand sets of outputs. You see, the output that
    you get at the very end of the neural network is the network output that you see.
    However, as we''ve already discussed, every neuron will produce a result that
    is ultimately sent out to a different neuron. The only difference is that by the
    time it reaches the output that you see, the final decision has been made at that
    point but when the neural network is passing the information along biases and
    weights you don''t see that information. We''ll talk about this a little bit more
    when we get to the different layers of a neural network.


    ## Classifications and Classifiers'
