- raw: 'Whenever a specific neuron decides what a specific thing is, it has made a
    classification. Depending on the size of a neural network, it could make tens
    to hundreds to even thousands of different classifications in the process of ultimately
    providing you with an output. We''ve already talked about what goes into these
    specific neurons but the method of classification is often determined by the classifier.
    As we''ve talked about in previous chapters, neural networks are not general-purpose
    tools and they have to be geared towards a specific task for now. They can''t
    really do anything too complicated when it comes to everyday life. But they do
    have some wonderful applications with the extreme dedication that they can provide.
    Whenever we talk about classifiers, we are basically talking about the method
    of choosing how to classify some of the information. Essentially, a classifier
    is really just the name of the methodology of classification. Thus, whenever you
    go searching for different types of neural networks, you have to actually search
    for classifiers. We will go over different deep learning methodologies in a separate
    chapter, but let’s make a clear distinction here. You can either have a classification
    or a recognized pattern. When we talk about classifications, we are actually talking
    about object classifications. This is different from numerical pattern recognition.
    Numerical pattern recognition is represented with graphs and data that only relates
    to numerical values. If we''re talking about something like the color of an object
    or the object itself, we are talking about a classification. If we are taking
    properties and utilizing those properties to make an object out of them then it
    becomes a classification but if we''re taking numerical values and providing numerical
    values based on patterns, we are talking about pattern recognition. There is a
    significant difference between the two individual forms since they provide you
    with different information.


    ## Vanishing Gradient


    Vanishing gradient refers to an obvious yet abstract pattern that occurs within
    a neural network. As you already know, neurons base their information on what
    the previous neuron gave it. This can happen with forward propagation and backwards
    propagation, which we will discuss in a later section. Essentially, as the information
    travels to neurons, the amount of information that travels to a specific neuron
    grows more complicated as it goes forwards or backwards. The Vanishing gradient
    refers to the fact that if something is exponentially complex, the time to make
    a decision on that data becomes exponentially high. For a very long time, deep
    belief networks and the majority of neural networks were extremely difficult to
    train in complex situations due to the vanishing gradient, which refers to how
    time can grow exponentially with complexity.


    ## Layers: Input, Hidden, and Output


    There are three layers when it comes to a neural network and the reason why I
    have a section on input and output and then also a section on layers is that most
    people who deal with neural networks refer to them as layers rather than input
    and output. The input layer is where the user is putting in the necessary information
    into the neural network. This could be any number of different data sets that
    they''re providing, but the idea is that this is the layer in which the individual
    is inputting information and it may not even be on a code level. You see, when
    we talk about the input layer we could actually be talking about a graphical user
    interface that the individual is using in order to put the input into the system.
    This would mean that the team of developers have created a neural network for
    non-developers to use. This is why it''s really referred to as the layer of inputs
    because not only could there be a vast difference in the inputs themselves but
    also a vast difference in the users of such technology. This is also why the output
    is actually called an output layer because not only could you be dealing with
    numbers coming from a command line but you could also be rendering it to HTML
    so that they could see it in the browser or into the Windows’ box so that they
    can see it on software. Essentially, calling it layers is much easier because
    then you can cover the vast differences in users and the variables that are sent
    out. After all, a programmer will be able to understand what RGB is but that doesn''t
    really mean anything for the average user. Now, we''ve already hit on this before
    but whenever the neural network is working on the information, the network is
    sending out tens to hundreds to even thousands of different outputs but only the
    end result is what the user sees. This area, because you don''t actually see it,
    is called the hidden layer and so whenever people are working on neural networks
    they refer to this area as the hidden layer not only because when someone else
    decides to use a neural network library they will likely not be looking inside
    the neural network to see how it works but also because you don''t actually see
    any of the decisions being made by the neural network until the neural network
    is finished with all the decisions that it makes, which produces the final output.


    ## Forward Propagation and Backward Propagation


    A lot of people like to talk about these two topics separately but I have no idea
    why since they''re so simple to understand. Forward propagation is what happens
    whenever you are putting in inputs and those inputs get to the output. This means
    that you are propagating the information forward. Likewise, when you are performing
    a backward propagation, you are taking the outputs that you figured out and going
    through the reverse process so that you can see what''s going on in the system
    or to produce different inputs to see if you are getting the correct pathways
    you intended.


    ## GPU Training


    For a long time, the CPU was the main component that was utilized in training
    neural networks but the problem with CPUs is that there aren''t enough cores to
    do anything truly complex. For instance, the most number of cores that a CPU has
    is around 32 to 64 cores, which are inside of server processors. Server processors
    are rather expensive. Therefore, some brilliant individual decided to change from
    using CPU cores to using GPU cores. Since the amount of GPU cores there are has
    skyrocketed over the years, one has access to not 32 cores but almost two thousand
    and more cores inside of a GPU. This can easily shrink years of training into
    days. Therefore, if you are going to play around with neural networks, I highly
    suggest that you get a really good graphics card so that you have plenty of cores
    to play around with.


    # KERAS MODEL AND LAYERS


    Keras is one of the easiest forms of neural networking that you can start out
    with when you''re just beginning your adventure on learning how neural networks
    works and how to implement them on your own. However, you will have to do a lot
    of research beforehand before you''re able to effectively use this API. Additionally,
    I highly suggest that if you don''t know Python that you go to some website and
    learn it or you can use this to translate what you already know in other programming
    languages to Python.


    ## What is Keras?'
