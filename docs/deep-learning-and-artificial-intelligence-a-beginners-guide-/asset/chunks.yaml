- raw: 'A Neural network is usually designed so that it can predict something or collect
    an analysis on something. One of the better use cases for a neural network is
    threat detection itself. As of right now, threat detection is a little bit outside
    of the scope of neural networks but it does hold some promise. The reason why
    neural networks are little bit out of the scope right now is actually due to humanity’s
    inability to control their biases. The human body or rather the human mind is
    built to be biased against others that are foreign to the community. Humans are,
    normally, a social creature that prefers to stay within tightly-knit communities
    and anything outside of the community is usually seen as a threat. This is part
    of the reason why it''s very difficult to go up to strangers and just start talking
    to them because you feel that sense of danger whenever you go up to something
    you don''t know and you attempt to converse with it. This strangeness shows itself
    in some very ugly ways such as racism, elitism, and even ageism. These natural
    biases prevent us from being able to truly predict who is threatening and who
    is not but some pseudoscience could help in this realm due to the fact that humans
    are capable of detecting liars. Well, that''s not entirely humanly true, it''s
    that we''ve created machines that can give you a high probability of whether a
    human is lying or not. This includes many things from stressing in the voice,
    body language, and several other different factors but the same can actually be
    true of those who pose a threat. For instance, a suicide bomber that''s brand
    new would likely show signs of being nervous and anxious when they''re about to
    do what they are about to do. Anyone that''s in a gang that''s not supposed to
    be doing what they are currently doing will show signs of being stressed, anxious,
    and an increased level of hormones. Technically speaking, we could build machines
    that take the psychological aspects of the human mind, the different chemicals
    that make up the human body, the specific chemicals that run through an individual
    that is going to do something that they know is wrong or that will likely bring
    danger to their life, and combine this into a predictive analysis of whether an
    individual is threatening the lives of others. The problem is that this is extremely
    invasive and we build things based on what we know, which means that if you are
    particularly partial towards a specific race or a specific gender than these detection
    methods would be affected by how you think a threatening individual should be
    detected. Not only that, there is a very famous example of a machine learning
    to be biased against a certain race thanks to Google because they found out that
    the Google search engine was more racist to black individuals due to a number
    of times that black individuals came under a need for a background search. Due
    to the heavy increase, they found that you were more likely to be suggested for
    background searches when you searched for black individuals then you would any
    other individuals. Therefore, anything that we put into the system relies on the
    biases that we have at the time and the biases that happen at the end of the system
    because neural networks are built with the knowledge that you don''t normally
    know what the end is going to be in a real-world scenario.


    # BUSINESS APPLICATIONS OF NEURAL NETWORKS


    ## Removing the Need for Mundane Tasks


    The first and most obvious of all the different business applications that neural
    networks could provide is the removal of mundane tasks. A good example of how
    we''ve used machines to remove a giant portion of mundane tasks are the assembly
    lines for most of the more advanced companies in the world that provide products.
    You have packaging machines, weight machines, quality assurance machines, and
    the list honestly just is not exhaustive anymore. However, you do have a few mundane
    tasks that are still performed by humans. The first and most obvious of them is
    filing because there are individuals who are hired simply to file away papers.
    For instance, a bookkeeper is required to file away a lot of papers during their
    work unless their company is online or software-based. Even then, a bookkeeper
    usually has to file something away because most people don''t just trust their
    software. After all, what happens to the information if the software is on a computer
    that blows up. Honestly, this could be easily solved by training a neural network
    to file papers away in the proper order. Many different businesses have many different
    ways of filing, but a neural network would be able to learn how the files are
    filed away so that instead of the bookkeeper spending nearly a quarter of her
    or his time filing paperwork the bookkeeper just places a stack of papers on a
    rack that is controlled by a neural network. The neural network would then be
    able to utilize the machines given to it to file away papers in the proper order
    according to the business. This would save the bookkeeper time so that if the
    business was one where the bookkeeper had to handle hundreds of customers, they
    wouldn''t have to worry about filing away the papers and wasting time on that
    mundane task. This is just one exclusive example of how neural networks could
    save the employee''s time so that they could work more proficiently. Another example
    is the ever-useless phone fix shops that are found practically everywhere. As
    an individual who has fixed many phones before, I can tell you that if you fixed
    one iPhone you''ve pretty much fixed almost all of them. The sad truth is that
    many iPhones are built exactly the same in terms of component placement. Even
    worse, Android phones are usually such a difficult fix that the price for fixing
    it is usually worth more than the phone. Therefore, unless you''re needing something
    very specific off of the phone, which can usually be done by utilizing other tools,
    you don''t normally fix an Android phone screen. This is why I say the phone fix
    shops are useless because unless you have an iPhone, there isn''t much profit
    to be made inside of a phone fix shop unless you''re talking about secondary services
    such as fixing computers and other types of machines. You could, technically,
    build a neural network that could handle replacing screens on phones. This would
    kill nearly half the market when it comes to phone fixing. On the other hand,
    there can be multiple things wrong with a phone so it doesn''t completely kill
    the market but it does remove the unnecessary mundane task of replacing an LCD
    screen on a phone. This could also go inside of a phone fix shop and anyone that
    didn''t really know about how technology is fixed would be able to get their phone
    fixed in much the same way. I say that neural networking would be beneficial when
    it came to replace something like an entire screen but it wouldn''t replace the
    necessity of technicians. For instance, the issue on an iPhone screen could be
    caused by some bad components inside of the iPhone itself rather than the iPhone
    screen. In this instance, repairing the iPhone would require more experience than
    could be given to a neural network at this time when comparing it to fixing an
    iPhone screen by replacing the entire screen. It would require knowledge about
    how electricity works, how to diagnose problems, how to find your way to the problem,
    and how to actually desolder the old part off and solder the new part on. That''s
    a lot more complex than taking out a couple of screws and replacing a screen.
    Essentially, it takes out the less critical thinking jobs but eventually, given
    enough time, you could technically train neural networks to do the same thing
    as a technician. This is one of the scary factors when it comes to neural networks
    and the potential that many people see in it.


