- raw: 'The problem with the deep learning patterns that we''ve discussed before is
    that They Don''t Really Work Well when you need to change it on the fly. A good
    example of this, which we have constantly come back to, is language. For instance,
    the phrase “Netflix and chill” has several different meanings to it and getting
    a computer to understand the new nuance of Netflix and chill requires that the
    machine learning process be able to stop and learn what that is. When you''re
    running something like a CNN, you can''t really stop the process mid process due
    to the fact that it is feeding the information for it and there is no way for
    it to temporarily halt so that you can change the data, which is where Recurrent
    networks come in handy. However, RNNs are not the best for language, but they
    can handle language. The best, current method for handling language is RNTN, which
    we will talk about next. Essentially, you should think of RNNs as networks that
    change with every set of neurons. Each set of neurons is handed the information
    from the previous set of neurons along with any set of neurons that may be running
    at the same time as those neurons. This allows the network to perform much more
    complex tasks. The difference between the network from the previous ones that
    we have been discussing is that the network is enclosed. The set of neurons is
    a single set of neurons rather than input neuron and a decision neuron. Instead,
    a single set of neurons serves as both an input and a decision maker. This allows
    each set of neurons to quickly capture information as it moves down the chain
    without being incapable of stopping midway to reorganize the information. This
    is why it''s really useful for things such as traffic predictions, language predictions,
    and many other “immediate change” types of data. The problem with this type of
    network is that it doesn''t really know when to forget the information because
    it''s useless. Since we''re basically utilizing each second in time as a separate
    neural network and passing it to the next second in time neural network, we run
    into the wall of the vanishing gradient. The only way to deal with this is known
    as gating, which is where we manually select when the network should forget something.
    There are several methods for gating such as Gradient Clipping, Steeper Gates,
    LSTM, and GRU. There is no set, defined way of handling the gating process. These
    types of networks are really only useful if you''re trying to deal with regression
    or forecasting of language rather than classification. This is due to the unique
    setup of the actual network in that being able to regress an item or forecast
    an item requires you to be able to control the time flow of data.


    ## RNTN: Recursive Neural Tensor Nets


    The complexity around language has to do with the syntactical nature of language
    itself. This means that in order to predict the words that are coming out of my
    mouth, Google Voice would have to be able to learn the structure of the syntactical
    language and this is rather difficult if you''re just dealing with strings. Therefore,
    instead of dealing with just strings they are vectorized. This means that each
    specific component in a string is given a number to represent its value and the
    string as well as its likelihood to be connected to certain other words in a dictionary.
    Once the entire string is completely formed, it chooses one of the different sets
    of strings that were judged by other methodologies and it compares the highest
    score of predictable analysis in order to see which is the best string. It must
    first recognize the different syntactical groupings such as a noun phrase or a
    verb phrase and give scores to those that make more sense than others. This calculates
    into the overall final value of the prediction. The recursive part of the neural
    network comes from the fact that it does this with every single set of words inside
    of a singular sentence. Therefore, if you had a sentence with only four words
    in it, this means that it would produce about three different trees due to the
    fact that you could group the words 3 times. You would have the first two words,
    the middle 2 words, and the last 2 words in your grouping but, as you can see,
    it gets rather difficult whenever there are more words in a sentence. Thanks to
    the thousands or millions or even billions of individuals utilizing Google Voice
    to do their typing, they''re texting, and even their searches, these people have
    dedicated themselves to the constant learning machine that is Google Voice.


    # BENEFITS OF NEURAL NETWORKS


    ## A Faster Human Brain


    There are several benefits to our creation of neural networks. However, the primary
    reason why most individuals want to create a fully optimized and fully working
    neural network is that it''s a faster human brain. You see, the brain does several
    things that machines simply can''t do such as be able to speak languages with
    ever-changing nuances and syntax modifications. A good example of this is the
    word “own.” This word has had a couple different changes throughout history. Over
    the general course of this words’ history, it has come to mean the possession
    of something and while possessing something is a very simplistic concept, the
    word itself has had different meanings in the contextual sense. For instance,
    you can own a building that employs workers but you can also, even though it''s
    really immoral and illegal to do so, own human beings. This is the property form
    of possession. However, you can also own up to your responsibilities or own up
    to your feelings, which means that you are emotionally possessing something that
    you previously were not possessing. This shows that there is a difference between
    possessing emotions and property. The last type of definition is one of saying
    that you owned a person after you''ve defeated them. This is a very unique and
    rather new version of the word that represents defeat rather than possession.
    You have three different contextual meanings of the word while also having the
    same definition for only two of them. If you owned a person, you either possess
    them as a property or you defeated them and this becomes a problem for regular
    machines developed by hand that are checking for syntax. If the sentence is talking
    about how they defeated someone in a game, a machine that has not been developed
    to take into account the newer definition of the word would be unable to correctly
    grammatically check that sentence. A neural network that constantly updates itself
    on the nuances of English would be able to predict this without a programmer having
    to manually input the language itself. On top of this, the programmer would not
    need to manually put in all the multitude of nuances, contexts, and grammar changes
    that affect our daily speech.


    ## Better at Dedicated Tasks'
