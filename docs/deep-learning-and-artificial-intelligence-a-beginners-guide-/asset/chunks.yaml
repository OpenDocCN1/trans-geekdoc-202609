- raw: 'If you are familiar with programming languages that are also interpreted programming
    languages then you will understand what I''m talking about when I say that Keras
    is an interpreted form of neural networking. The design principle behind this
    API is to make neural networking much easier to implement and much faster to scale.
    The beautiful thing about this API is that it not only shortens the amount of
    work that you need to do in order to get a fully functioning neural network in
    your hands but it also runs on top of pre-existing architecture like Theano and
    TensorFlow. Probably the best part about this API is that it is written in Python,
    which shows just how far the developing team wanted to make the API user-friendly.
    Python is a very easy programming language to pick up and it''s one of the recommended
    starter languages for people to learn about programming. You have to import the
    API into your file and then you can begin creating the model using the different
    layers of the API to create your neural network. This API works solely on models
    and layers so it''s very important that you understand the difference between
    the two and how they relate to each other. You can find Keras here.


    ## What is a Keras Model?


    Models are how you begin inside of this API and there are two specific models
    when talking about the different models that this API has. There is the Sequential
    model and then there''s the Model functional model. The Sequential model is a
    play on words, kind of like the actual name of the API itself, in that it runs
    everything sequentially. You can think of the model as the easy mode when it comes
    to handling this API and it is one of the very first models that you utilize in
    order to begin to understand how to work with this API. On the other hand, you
    have the Model model. Once you get a thorough understanding of the Sequential
    model, you can then move on to the more advanced model. This model allows you
    to fully customize how you want things to be carried out and that doesn''t necessarily
    mean that you''re going to want your actions to be carried out in sequential order.
    However, that doesn''t really tell you what a model is.


    Inside of this API, the Model Class is how you utilize the different aspects of
    the neural network. This means that if you are trying to create a neural network,
    you first have to set up your model so that you can sequentially or non-sequentially
    layout the necessary weights, biases, and even the information. Likewise, you
    can have models interacting with other models to create a more complicated model.
    Each model represents a separated neural network and so by utilizing your model
    to interact with other models, you can create a deep neural network. That isn''t
    to say that you can''t create one inside of a singular model, but for the purposes
    of keeping track of everything it''s usually good to modulate all the different
    responsibilities that you want a neural network to do and so that is why you are
    given the capability of calling on different models to do different things in
    order to get a completely different output. Now that we understand that the model
    basically represents a neural network, you now need to understand that each neural
    network has many and, I do mean, many different layers.


    ## What is a Keras Layer?


    Layers represent the different components of a neural network such as the density
    or the input of a neural network. They are the primary code that you''re going
    to deal with inside of the API and so you need to understand that the list of
    different layers that there are is not really exhaustive. If you decide to forgo
    the Sequential model, you can develop your own layers inside of the program so
    as to do specific things that you want to do such as much more complicated tasks
    than what is already set inside of the program but this is kind of rare. They
    leave it open just in case you''re one of those developers who''s working on a
    massively complex system that requires a lot of customization. If you''re trying
    to utilize models or layers, you''re going to have to import everything that you
    want to utilize. Again, this API doesn''t assume that you need everything that
    they''ve created and so you cannot simply import a model and gain access to the
    enormous API that they''ve created. This allows you to have code that runs smoothly
    and efficiently while also being user-friendly. Additionally, as you can use other
    models with a singular model, you can also utilize multiple layers with multiple
    inputs.


    ## What do you need to understand going into Keras?


    The developers of this API assume that you understand how neural networking works
    in the first place and if you don''t understand how neural networking works, I
    suggest you read the rest of the book and do a little further delving into the
    technology before you go about using this API. The reason why I suggest this is
    because it makes it so easy to implement a neural network that it clouds a lot
    of the technical definitions behind what you''re implementing. Therefore, if you
    don''t know what RELU is then you''re out of luck because this API assumes you
    already know that and if you want to implement it, you have to learn about what
    that is before you can apply it to the neural network properly.


    ## Like a Good Nerd, Classical Literature References Are There For You


    This is just a side note but the developers who decided to give us access to this
    API also have a deep love for Greek literature, specifically The Odyssey. The
    actual name of this API comes from the Odyssey where there is a tale of a horn
    gate and an ivory gate, which represents the horn gate as being the true gate
    to go through while the ivory gate is one of deceit. Whenever available, the developers
    of this group will often name important things in this API after the Greek literature.


    # DEEP LEARNING ALGORITHMS


    ## RBM: Restricted Boltzmann Machine


    The most prominent of all machine learning algorithms is RBM because it gave us
    the biggest breakthrough for developing neural networks by dealing with the vanishing
    gradient. Essentially, you have an input layer and a hidden layer with the input
    layer being the output layer. The hidden layer is only made up of a single set
    of neurons, which minimizes the amount of propagation. The important part here
    is that none of the nodes in the hidden layer share a connection to other nodes
    in the hidden layer. Training an RBM is a quick process due to these restrictions.
    The input is first sent to the hidden layer so that it can be transformed. After
    the data has been changed, a replacement of weights and/or biases is provided
    whether it be the same or different weights and/or biases. It is then sent back
    to the input layer, which has now become the output layer, to provide a reconstruction
    of that data. If the information is wrong, the weights and/or biases are adjusted
    until the reconstruction of the data is correct. RBM is part of the family known
    as Autoencoders and it works wonderfully with unlabeled data.


    ## DBN: Deep Belief Network'
