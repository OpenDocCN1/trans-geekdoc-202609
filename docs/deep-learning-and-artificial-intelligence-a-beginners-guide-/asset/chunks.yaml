    As you can tell, from the last Deep Learning Algorithm, we haven’t explained how
    an RBM helped solve the vanishing gradient issue, which is where DBN comes in.
    DBN is a combination of RBM’s that have been put together on the same job but
    working on different tasks. DBNs are similar to MLPs in their structure, but they
    are completely the opposite when it actually comes down to training the neural
    network and that has to do with their implementation. Essentially, with a DBN
    you have RBM’s interconnected by making each hidden layer the input layer in succession.
    Therefore, let’s go over this in four steps. In step one, we add an input into
    the input layer. In step two, that input goes through its first RBM to become
    changed output. In step three, that hidden layer becomes the new input layer for
    the next RBM. This cycle repeats until it gets to the end. With each layer of
    RBM, the classifications are handling different parameters of the feature that
    require less and less abstraction of the data.


