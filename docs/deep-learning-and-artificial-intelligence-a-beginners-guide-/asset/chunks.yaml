  trans: '


    我们之前讨论的深度学习模式的问题在于，当你需要即时更改时，它们效果并不理想。一个很好的例子，我们一直反复提到，就是语言。例如，“Netflix and chill”这个短语有几种不同的含义，要让计算机理解“Netflix
    and chill”的新含义，就要求机器学习过程能够停下来并学习这是什么。当你运行像 CNN 这样的东西时，你无法真正在过程中停止，因为它正在为其提供信息，并且没有办法暂时停止以便你更改数据，这时循环网络就派上用场了。但是，RNN
    对语言来说并不是最好的，但它们可以处理语言。目前处理语言的最佳方法是 RNTN，我们将在下一节讨论。基本上，你应该把 RNN 视为随每组神经元而变化的网络。每组神经元都会接收来自上一组神经元的信息，以及可能与这些神经元同时运行的任何一组神经元的信息。这使网络能够执行更复杂的任务。与我们之前讨论过的网络的区别在于，该网络是封闭的。神经元组是一组单一的神经元，而不是输入神经元和决策神经元。相反，一组单一的神经元既充当输入，也充当决策者。这使每组神经元能够在信息沿链条移动时快速捕获信息，而无需在中途停止以重新组织信息。这就是为什么它对于交通预测、语言预测以及许多其他“即时变化”类型的数据非常有用。这种网络的问题在于，它并不真正知道何时应该忘记信息，因为信息已无用。由于我们基本上将每一秒钟作为单独的神经网络并将其传递给下一秒钟的神经网络，我们遇到了梯度消失的问题。处理这个问题的唯一方法被称为门控，即我们手动选择网络何时应该忘记某些东西。门控有几种方法，例如梯度裁剪、更陡峭的门控、LSTM
    和 GRU。处理门控过程没有固定、明确的方法。这种类型的网络只有在你试图处理语言的回归或预测而不是分类时才真正有用。这是因为实际网络的独特设置，能够回归某个项目或预测某个项目要求你能够控制数据的时间流。


    ## RNTN：递归神经张量网络


    语言的复杂性与语言本身的句法性质有关。这意味着，为了预测我嘴里说出的词语，Google Voice 必须能够学习句法语言的结构，如果你只是处理字符串，这相当困难。因此，他们不再仅仅处理字符串，而是将其向量化。这意味着字符串中的每个特定组件都被赋予一个数字来表示其值，以及字符串及其与词典中某些其他单词连接的可能性。一旦整个字符串完全形成，它就会从其他方法论判断的不同字符串集合中选择一个，并比较可预测分析的最高分数，以查看哪个是最佳字符串。它必须首先识别不同的句法分组，例如名词短语或动词短语，并给那些比其他更合理的分组打分。这计入预测的总体最终值。神经网络的递归部分来自这样一个事实：它对单个句子中的每一组单词都这样做。因此，如果你有一个只有四个单词的句子，这意味着它会产生大约三棵不同的树，因为你可以将单词分组
    3 次。你会有前两个单词、中间两个单词和最后两个单词的分组，但正如你所看到的，当句子中有更多单词时，这变得相当困难。得益于成千上万甚至数十亿使用 Google
    Voice 进行打字、发短信甚至搜索的个人，这些人致力于 Google Voice 这个不断学习的机器。


    # 神经网络的优势


    ## 更快的人类大脑


    我们创建神经网络有几个好处。但是，大多数人想要创建一个完全优化且完全可用的神经网络的主要原因是，它是一个更快的人类大脑。你看，大脑做着几件机器根本无法做到的事情，例如能够说具有不断变化的细微差别和句法修改的语言。一个很好的例子是单词“own”。这个词在历史上经历过几次变化。在该词的整个历史过程中，它已经意味着拥有某物，虽然拥有某物是一个非常简单的概念，但这个词本身在语境意义上有过不同的含义。例如，你可以拥有一栋雇佣工人的建筑物，但你也可以，尽管这样做非常不道德且非法，拥有人类。这是所有权形式的占有。但是，你也可以对自己的责任负责或承认自己的感受，这意味着你在情感上占有了以前没有占有的东西。这表明占有情感和财产之间存在区别。最后一种定义是说，在击败某人之后你拥有了这个人。这是一个非常独特且相当新的词义，代表失败而非占有。你对这个词有三种不同的语境含义，同时只有其中两种具有相同的定义。如果你拥有某人，你要么将其作为财产占有，要么击败了他们，这成为手工开发的检查句法的常规机器的问题。如果句子在谈论他们在游戏中击败了某人，一个没有开发为考虑该词较新定义的机器将无法正确地语法检查该句子。一个不断更新自身以掌握英语细微差别的神经网络将能够预测这一点，而无需程序员手动输入语言本身。除此之外，程序员不需要手动输入所有影响我们日常言语的众多细微差别、语境和语法变化。


    ## 更擅长专用任务


