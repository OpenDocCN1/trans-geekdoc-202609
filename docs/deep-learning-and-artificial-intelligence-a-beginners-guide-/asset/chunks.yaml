- raw: Welcome to the end of this book and while this may be the end of the book,
    you are probably wondering whether there's more to learn about neural networking.
    Honestly, not really. I really hate to do this to you because normally I say that
    there is a large path ahead of you with tons of knowledge that you can just suck
    up but the honest truth is that we covered most of everything. The only thing
    that we didn't cover is how to actually do it and that can really depend on what
    you're using. For instance, we provided you with an excellent API that will help
    you get your feet wet with neural networking but that's only one of probably a
    hundred different types of API that are out there on the market. Python is just
    one of many of the languages out there and there are many languages where people
    have created APIs to handle neural networking from what they considered to be
    a great programming aspect. For instance, you have Java, C, and C# to begin with.
    Just these three languages would likely have around 5 to 10 different types of
    applications where you could employ a neural network. You might be thinking that
    there might be more complex neural networks out there but the truth of the matter
    is that neural networking is a pretty new topic and that's kind of why it's all
    of the rage in the news. It's not really that complicated of a topic, but because
    of how mystified it is and how giant corporations are in the business, people
    think that it's a lot more complicated than it really is. This effect is magnified
    whenever people try to describe it in mathematical terms. From a mathematical
    standpoint, it is kind of complicated but it's only complicated up until maybe
    the end of Algebra 2 in terms of understanding how it works. Now, that doesn't
    mean that you can't get seriously complex with it because it really depends on
    what you want to do with it. For instance, if you are trying to extrapolate a
    3D model from a 2D image then you're going to need some heavy mathematics behind
    it along with some predictive analysis and some database entries to the shapes
    of whatever you're trying to extrapolate a 3D model from. It can be as complicated
    as you want but the technology itself is pretty simple when you begin to understand
    it. We've actually covered how these things work several different times and the
    problem with this type of topic is that since you expected this to be a whole
    new field of technology, you also likely expected it to be far more complicated
    than it really is. If you understand how the neuron works, you understand how
    neural networks are connected to each other. What you don't understand at this
    point is the application of it such as the actual code of the programs that you
    might want to build off of it or where it can it be applied and this also includes
    how it can be applied. Basically, you've learned the tool but you haven't learned
    how to effectively utilize the tool and the only way that can be taught is if
    you go into a database and start playing around with it. Therefore, I will say
    my goodbyes and good luck to you on your adventures down the neural networking
    path.
