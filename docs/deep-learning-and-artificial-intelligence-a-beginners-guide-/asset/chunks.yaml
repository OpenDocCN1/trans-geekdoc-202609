    weights you don''t see that information. We''ll talk about this a little bit more
    when we get to the different layers of a neural network.


    ## Classifications and Classifiers

    '
  trans: '


    人工神经网络的主要组成部分，也是本书的重点，是神经元本身。神经元是一种决策树，最终决定数据应走的下一条 PATH。例如，假设神经元的布尔值为 false。这意味着神经元会将信息发送到点
    J，点 J 将根据布尔值进一步决定将下一条信息发送到哪里。为此，你不仅需要在神经元本身内部构建一个决策树，还需要一些权重和偏差，也称为路径和偏差。让我们先谈谈决策树，以便你对它多了解一些。决策树是你大部分代码将要放置的地方，因为它最终决定神经网络将做出什么决策。通常，这样的区域非常复杂，投入了数月的工作，因为你通常不会独自创建神经网络。这就是为什么会有团队致力于神经网络（例如
    Google 开发的 Tensor）的原因。虽然在某些情况下实现神经网络非常简单，但取决于你的选择，它可能会非常复杂。决策树的一个绝佳例子是：当你试图从黑白照片中判断某物是否像人脸时。如果照片中白色比黑色多，那么你会说你发现了颜色对比。基于当前节点（即神经元）的偏差，你会确定该区域需要进一步探索。因此，它会通过在神经元树中使用更重的权重，转到更重要的节点或神经元。如果在那个时刻，颜色比其余颜色更暗很重要，那么它最终会输出在该点发现了更暗的颜色。通过共同找到照片中最暗的部分，你基本上就能找到照片的轮廓，从而能够识别人脸、树木和其他此类物体。这是利用决策树判断图片中是否有人脸的一个非常基本的例子，它只是神经网络实际运作方式的部分表现。


    ## Weights


    如前所述，权重是神经网络传输的路径。有些路径比其他路径更重要，因此我们在它们上放置所谓的权重，这实际上意味着该路径的整数比其他路径大，或者该路径的整数比其他路径小。大小实际上取决于神经网络的开发方式。然而，本质上，你是在找出哪些路径是更重要的传输路径，以便神经网络视为重要的信息沿着更重要的路径传输，从而最终与更重要的信息竞争或成为最终输出。在大多数神经网络中，更改权重的行为实际上就是机器学习和你训练它的方式。本质上，在训练期间，你找出哪些路径做出了正确的选择，从而可以降低那些做出错误选择的路径的权重。通过微调权重，你有效地让机器比以往的训练会话更好地识别正确路径所在的位置。


    ## Bias


    控制信息如何在网络中传输的另一部分是神经元本身设置的偏差。例如，回到黑白照片，我们可以说，设置为观察图片中心的某些神经元比设置为观察图片外部的神经元更重要。通过这样做，我们说神经元对中心神经元的偏差比对外部神经元更重。这并不是所有偏差的工作方式，但这是偏差真正应该工作的一个好例子，因为这些偏差允许它们判断神经网络正在处理的区域是否需要更高的优先级。我们选择照片中心的原因是，许多人更喜欢在照片中成为中心拍摄对象，除非他们与其他人在一起。


    ## Input and Output


    任何神经网络最关键的部分是你输入什么以及你得到什么输出。这由输入和输出表示，这就像你输入机器的任何其他程序一样，并且是随着时间的推移开发出来的。唯一的区别是机器使用数字，你不能真正告诉机器某物看起来是黑色的，而是你可以向它提供十六进制数
    #000000，机器会将其处理为黑色。这意味着，每当你处理诸如对比度之类的事物时，试图判断某物是更暗还是更亮，你必须处理诸如 HEX 颜色中找到的数字，或者最终
    RGB（红、绿、蓝）中的数字。计算机基于 255 种不同的红、绿、蓝变化组合工作，每种颜色都有单独的变化。因此，如果你决定说某个区域完全没有任何颜色，也称为黑色，你会看到这种情况的
    RGB 表示为 RGB (0,0,0)。由于计算机在寻找匹配某个调色板的颜色方面没有问题，因为它首先必须为这些图片上色，因此它能够轻松判断特定像素是否为黑色。更好的是，你可以拥有一个系统，其中神经网络研究各个部分，在这种情况下，如果特定区域中黑色比白色多但并非全黑，你会有一个偏差。说某物全黑，本质上是说那里只有黑色而没有其他东西。相反，例如在我们的人脸照片中，你会想要找到代表轮廓的不同深浅的黑色。输入神经网络的所有信息都必须由字符串字符或数值表示。让我们谈谈这部分更元的方面。实际上，你有一组输入和可能数千组输出。你看，你在神经网络末尾得到的输出是你看到的网络输出。但是，正如我们已经讨论过的，每个神经元都会产生一个结果，最终发送到另一个神经元。唯一的区别是，当它到达你看到的输出时，最终决策已经做出，但当神经网络沿着偏差和权重传递信息时，你看不到这些信息。当我们讨论神经网络的不同层时，我们会再多谈谈这一点。


    ## Classifications and Classifiers


    '
