    # ARTICLE


    # ABSTRACT


    **Keywords:**

    Artificial intelligence

    Lung cancer diagnosis

    Natural language processing

    Machine learning and deep learning

    Precision oncology


    Lung cancer is one of the malignant tumors with the highest incidence and mortality
    in the world. The overall five-year survival rate of lung cancer is relatively
    lower than leading cancers. Early diagnosis and prognosis of lung cancer are essential
    to improve the patient''s survival. With artificial intelligence widely applied
    in lung cancer, diagnosis and prediction have achieved excellent performance in
    recent years. This review summarizes various types of AI algorithms in lung cancer,
    including natural language processing (NLP), machine learning and reinforcement
    learning. In addition, we provide reference regarding the application of AI in
    lung cancer diagnostic and clinical prognosis. This review aims to evaluate the
    utility of AI in lung cancer diagnosis and prognosis as the novel screening decision-making
    for the treatment of lung cancer.


    # 1. Introduction


    Lung cancer is one of the malignant tumors with the highest incidence and mortality
    in the world, where the survival rate is less than 20% [1,2]. In early-stage lung
    cancer patients, postoperative 5-year survival rate with micro-invasive adenocarcinoma
    and carcinoma was also over 90% [3,4], while the 5-year survival rate of advanced-stage
    lung cancer patients was only 2% [5,6]. Clinical diagnosis is still a major challenge
    to suggest treatment to patients who have advanced-stage lung cancer [3,7]. Early
    diagnosis of lung cancer and suitable treatment can effectively improve the survival
    rate of patients by 20% [6,8]. However, the outcome of lung cancer is still not
    optimal for many advanced-stage lung cancer patients in China.


    Biomarkers are expected to solve the current challenges in lung cancer diagnosis
    [11,12]. It remains challenging to deeply interpret information from data with
    clinical statistics. Recently, with the development of computer technology, AI
    has become an effective tool in lung cancer diagnosis. Fig 1 shows the historical
    milestones of AI in lung cancer diagnosis. In recent years, machine learning and
    deep learning have been used increasingly to improve the diagnosis and treatment
    of lung cancer [13]. This review summarizes various types of AI applications in
    lung cancer, including natural language processing, machine learning and reinforcement
    learning. In addition, we provide reference regarding the application of AI in
    lung cancer diagnostic and clinical prognosis. The purpose of this study is to
    illustrate and provide novel screening decision-making for the treatment of lung
    cancer. Diverse strategies and treatment of lung cancer have been applied in clinical
    practice. The survival of lung cancer patients is still not optimal [9]. Several
    studies show that population screening for lung cancer is cost-effective and has
    the value of early detection [10].


    # 2. Types of artificial intelligence applied in lung cancer


    The diagnosis of lung cancer has a long history. Pathological findings and analysis
    of tumor markers have become important tools. However, these approaches have limitations.
    Firstly, for pathological findings, the current gold for lung cancer diagnosis
    is mainly performed through invasive procedures and lacks accuracy. Secondly,
    tumor markers used in clinical applications (e.g., X-ray, computed tomography)
    have revolutionized the diagnosis of lung cancer, but small lymph nodes or nodal
    markers are still not readily detectable and may be missed. As discussed here
    the various types of artificial intelligence applied in lung cancer include NLP,
    deep learning and machine learning. As shown in Fig 2, we have the schematic of
    classical AI in lung cancer screening and detection.


    ## 2.1. Machine learning and deep learning


    In recent years, there are big data technologies to contribute to a spurt in the
    scale of medical data. The wide variety of data has placed greater demands on
    data processing, storage, and utilization. Advances in these fields have been
    widely incorporated with clinical applications in lung cancer [4]. All technologies
    include machine learning, deep learning, and natural language processing, and
    the relationship between them is shown in Fig 3.


    Despite the wide range of applications in lung cancer, AI diagnosis faces many
    difficulties in achieving the full process from automatic slide viewing to medical
    report compilation using digital health records. Electronic health records are
    helping the lung cancer diagnosis process and have important implications for
    pathologists, both in the first and in communicating with patients. However, information
    systems are only able to extract and translate this knowledge to manual processing.
    Manual processing of information is costly, error-prone and has inherent limitations.
    Information extraction can be improved by deep learning, which is represented
    by deep layers. The process of intelligent health diagnosis can be improved by
    deep fusion of NLP. It enables us to understand unstructured text or verbal data
    for potential applications in complex mining including information extraction
    and relation extraction, etc., and to assist decision-making in the treatment
    of cases. Machine learning techniques are currently achieving significant clinical
    value in the screening, diagnosis, and prognosis of lung cancer. Deep learning,
    such as Convolutional Neural Networks (CNN), Recursive Neural Network (RNN), Generative
    Adversarial Networks (GAN), and others, empower clinicians by automating complex
    realworld models to achieve powerful learning capabilities and functional genomics.


