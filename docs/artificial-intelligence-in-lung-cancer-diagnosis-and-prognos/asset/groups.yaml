    # 肺癌诊断与预后中的人工智能：现状应用与未来展望


    Shigao Huang¹¹, Jie Yang¹¹, Na Shen², Qingshou Xu⁴, Qi Zhao⁵,ᵉ*


    * 中国新疆信西县，空军医大学第一附属医院放射科

    * 中国重庆，重庆理工大学

    * 香港中文大学

    * 中国澳门大学，健康科学学院医学转化研究所癌症中心，澳门特别行政区氹

    * 中国澳门大学精准肿瘤学前沿科学中心，澳门特别行政区氹

    * 中国澳门大学科学与科技学院，澳门特别行政区氹


    # 论文


    # 摘要


    **关键词：**

    人工智能

    肺癌诊断

    自然语言处理

    机器学习与深度学习

    精准肿瘤学


    肺癌是世界上发病率和死亡率最高的恶性肿瘤之一。肺癌的总体五年生存率低于其他主要癌症。肺癌的早期诊断和预后对于提高患者生存率至关重要。随着人工智能在肺癌中的广泛应用，其诊断和预测在近年来取得了卓越性能。本综述总结了肺癌中各种类型的
    AI 算法，包括自然语言处理（NLP）、机器学习和强化学习。此外，我们提供了关于人工智能在肺癌诊断和临床预后中应用的参考。本综述旨在评估人工智能在肺癌诊断和预后中的作用，作为肺癌治疗的新型筛选决策依据。


    # 1. 引言


    肺癌是世界上发病率和死亡率最高的恶性肿瘤之一，生存率低于 20% [1,2]。在早期肺癌患者中，微浸润性腺癌和癌患者的术后五年生存率也超过了 90% [3,4]，而晚期肺癌患者的五年生存率仅为
    2% [5,6]。对于为晚期肺癌患者提供治疗建议，临床诊断仍是一项重大挑战 [3,7]。肺癌的早期诊断和适当治疗可以有效提高 20% 的生存率 [6,8]。然而，对于中国许多晚期肺癌患者来说，预后仍然不理想。


    生物标志物有望解决肺癌诊断中的当前挑战 [11,12]。从临床统计数据中深度解释信息仍然具有挑战性。最近，随着计算机技术的发展，人工智能已成为肺癌诊断的有效工具。图
    1 显示了人工智能在肺癌诊断中的历史里程碑。近年来，机器学习和深度学习越来越多地用于改善肺癌的诊断和治疗 [13]。本综述总结了肺癌中各种类型的 AI 应用，包括自然语言处理、机器学习和强化学习。此外，我们提供了关于人工智能在肺癌诊断和临床预后中应用的参考。本研究的目的是为肺癌治疗说明并提供新的筛选决策。临床实践中应用了多种肺癌策略和治疗方法。肺癌患者的生存率仍不理想
    [9]。多项研究表明，肺癌人群筛查具有成本效益，并具有早期检测的价值 [10]。


    # 2. 应用于肺癌的人工智能类型


    肺癌诊断有着悠久。病理发现和肿瘤标志物的分析已成为重要工具。然而，这些方法具有局限性。首先，对于病理发现，目前肺癌诊断的金标准主要通过侵入性程序进行，缺乏准确性。其次，临床应用中使用的肿瘤标志物（如
    X 射线、计算机断层扫描）彻底了肺癌诊断，但小淋巴结或结节标记仍无法轻易检测，并可能被遗漏。如本文所述，应用于肺癌的各种类型人工智能包括 NLP、深度学习和机器学习。如图
    2 所示，我们有了肺癌筛查和检测中经典 AI 的示意。


    ## 2.1. 机器学习与深度学习


    近年来，大数据技术促进了医疗数据规模的飞跃。多样化的数据对数据处理、存储和利用提出了更高要求。这些领域的进展已广泛纳入肺癌的临床应用中 [4]。所有技术包括机器学习、深度学习和自然语言处理，它们之间的关系如图
    3 所示。


    尽管人工智能在肺癌中应用广泛，但 AI 诊断在实现从自动切片查看到使用数字健康记录编制医学报告的全过程中面临着许多困难。电子健康记录正在帮助肺癌诊断过程，并对病理学家在第一阶段和与患者沟通方面具有重要意义。然而，信息系统仅能够提取并将这些知识翻译为手动处理。信息的手动处理成本高昂、容易出错并具有固有的局限性。信息的提取可以通过深度学习来改进，深度学习由深层表示。智能健康诊断可以通过
    NLP 的深度融合改进。它使我们能够理解非结构化文本或口头数据，用于复杂挖掘（包括信息提取和关系提取等）的潜在应用，并在病例治疗中辅助决策。机器学习目前在肺癌的筛选、诊断和预后方面实现了显著的临床价值。深度学习，如卷积神经网络（CNN）、递归神经网络（RNN）、生成对抗网络（GAN）等，通过自动化复杂的真实世界模型，赋予了临床医生强大的学习能力和功能基因组学能力。


    ## 2.2. 自然语言处理


    | 人工智能 | 机器学习 | 深度学习 |

    | :--- | :--- | :--- |

    | 任何使计算机模拟人类行为的技术 | 无需显式编程即可学习 | 其子集，由多层神经网络组成 |

    | 1954 年：计算机用于放射治疗诊断和制定治疗计划 | 1968 年：计算机辅助诊断（CAD）首次引入，导致了放射学的形成 | 2020 年：深度学习辅助检测获得
    FDA 批准 |

    | 1950 年代：数学模型引入一组病例的诊断，为计算机辅助诊断奠定了先例 | 1980 年代：“解释”临床支持系统，包含 2200 个病例和 5000 个系统
    | 2019 年：Google 的肺癌检测 AI 优于专家 |

    | 1992 年：第一个智能计算机辅助系统获得，知识库包含 572 个病例和约 4200 个病例 | | 2022 年：通过 AI 挖掘肺信息：预测肺癌 EGFR
    基因型和靶向反应 |


