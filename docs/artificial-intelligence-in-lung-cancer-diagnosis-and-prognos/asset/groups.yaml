    ## 5.2. 未来


    随着医疗技术的发展，非侵入性 AI 检测肿瘤和 PET/CT 分析已应用于临床。外血中肿瘤 DNA（ctDNA）的检测已有报道。外血中 RNA 和其他化学标志物的检测预计将在几年内实现。优化不同方法的评估和效果仍需解决。到目前，肺癌的治疗尚未基于
    AI 的使用。由于有效治疗主要取决于肿瘤中的 PD-1 表达水平，且 AI 技术在肿瘤分割、形态和异质性方面的开发面临许多挑战。肺癌的预后可以根据病理切片信息进行准确预测。通过
    AI 预测肺癌的准确性将会提高。


    一项研究分析了 TCGA 数据库中 2186 例腺癌和鳞癌患者 [69]。提取了图像的量化特征，这些特征对预测生存最为显著。结果显示，Cox 模型可以很好地预测腺癌（P
