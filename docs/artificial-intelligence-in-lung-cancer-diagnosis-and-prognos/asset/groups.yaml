    automated detection methods were developed, which created a precedent for CAD
    [71]. In 1986, Lee et al developed computer-aided markers for clinical diagnosis
    with medical use using Reed and Bobdens algorithm to build a powerful computerized
    diagnostic model, and analyzed a group of lung cancer cases, pioneering the application
    of CAD in clinical medical imaging [72]. In 1991, Barnett et al. published "Explanation"
    software containing 2200 cases and 5000 systems [83]. In 2019, Google used AI
    to mine lung-information for predicting EGFR genotype and targeted therapy response
    in lung cancer, which detected that genotype and genetic information could be
    obtained from the lung instead instead of only tumors [83].

