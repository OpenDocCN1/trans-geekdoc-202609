    # 2. Types of artificial intelligence applied in lung cancer


    The diagnosis of lung cancer has a long history. Pathological findings and analysis
    of tumor markers have become important diagnostic tools. However, these approaches
    have limitations. Firstly, for pathological findings, the current gold for lung
    cancer diagnosis is mainly performed through invasive procedures and lacks extensive
    clinical accuracy. Secondly, tumor markers used in clinical applications, some
    of which are cancer nonubigen, which may lead to many errors in clinical diagnosis.
    Diagnostic approaches (e.g., X-ray, computed tomography) have revolutionized the
    diagnosis of lung cancer, but small lymph nodes or nodal markers are still not
    readily detectable and may be missed. As discussed here the various types of artificial
    intelligence applied in lung cancer. They include NLP, deep learning and machine
    learning. As shown in Fig. 2, we have the schematic of classical AI in lung cancer
    screening and detection.


    # 2.1. Machine learning and deep learning


    In recent years, there are big data technologies to contribute to a spurt in the
    scale of medical data. The wide variety of data has placed greater demands on
    data processing, storage, analysis, and utilization. Advances in these fields
    have been widely incorporated with clinical applications in lung cancer [4]. All
    technologies include machine learning, deep learning, and natural language processing,
    and the relationship between them is shown in Fig. 3.


    Despite of the wide range of applications in lung cancer AI diagnosis, AI faces
    many difficulties in achieving the full process from automatic slide viewing to
    medical report compilation and using digital health records. Electronic health
    records are helping the lung cancer diagnosis process and have important implications
    for pathologists, both in the first and in communicating with patients. However,
    information systems are only able to extract and translate this knowledge to the
    manual processing. Manual processing of information is costly, error-prone and
    has inherent limitations. Information extraction can be improved by deep learning,
    which is represented by deep layers. As input datasets include high arithmetic
    requirements and difficulties in data circulation. The process of intelligent
    health diagnosis can be improved by a deep fusion of NLP. It enables us to understand
    unstructured text or verbal data for potential applications in complex mining
    elements including information extraction and relation extraction, etc.


    data, and provide to assist decision-making in the treatment of cases. Machine
    learning techniques are currently achieving significant clinical value in the
    screening, diagnosis, and prognosis of lung cancer. Deep learning, such as Convolutional
    Neural Networks (CNN), Recursive Neural Network (RNN), Generative Adversarial
    Networks (GAN), and others, empower clinicians by deep learning and automate complex
    real models to achieve powerful learning capabilities and functional genomics.
    The differences between machine learning and deep learning are shown in Fig. 2.


