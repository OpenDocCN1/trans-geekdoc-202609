    # Artificial intelligence in lung cancer diagnosis and prognosis: Current application
    and future perspective


    Shigao Huang¹¹, Jie Yang¹¹, Na Shen², Qingshou Xu⁴, Qi Zhao⁵,ᵉ*


    * Department of Radiology, The First Affiliated Hospital, Air Force Medical University,
    Xantai, Shenxi, China

    * Chongqing University of Technology, Chongqing, China

