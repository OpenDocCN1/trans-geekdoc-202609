    X-ray tomography (CT) has been used for decades in the management of lung cancer,
    including screening, diagnosis and treatment. The quantitative value of CT for
    lung nodules has also been recognized. However, multiple lung nodules are still
    common in clinical practice (41–42). For lung nodules, different shapes and sizes
    may and affect the patterns of metastasis [36,43]. CT images of lung nodules are
    multi-dimensional images. 3D convolutional neural networks (CNN) can utilize the
    full spatial content of lung nodule detection, which can improve the accuracy
    of 2D CNN for for lung nodules and reduce the false positive rate (44). The recent
    progression of CT in lung detection of automated 3-D tomography has been reported
    (34,45). These studies focus on the improvement of the detection accuracy and
    shapes of the different types of nodules detection capability. The work will able
    to build electronic medical record system and picture archive (46,47).


    AI is used in the diagnosis of benign and malignant nodules. For lung nodules,
    CT analysis can accurately determine benign and malignant nodules (48). Regular
    shape, ground shadow, margin spin, and sign are important for the basis for the
    analysis. The study reported that the detection rate of true positives by CT nodules
    by professional clinicians was 66.5%, much lower than 98.4% by AI technology (49).
    There are risks of misdiagnosis and misdiagnoses in CT scans. Some nodules are
    also related to mimic small lung special nodules, resulting in missed diagnosis
    and misdiagnoses. However, AI can effectively detect small lung nodules and reduce
    missed diagnoses (59–51). The true positive diagnosis rate of AI-based SVM is
    significantly higher than that of professional physicians (52,53).


