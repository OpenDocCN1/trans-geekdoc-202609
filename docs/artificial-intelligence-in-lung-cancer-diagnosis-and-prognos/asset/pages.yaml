    # 3.3. Prediction of lung cancer by mutant types


    Lung tumors of different subtypes may differ at the molecular level and therefore
    respond to their therapies. Genetic alterations with prognostic/predictive significance
    in NSCLC [52] include EGFR and anaplastic lymphoma kinase (ALK) gene mutations.
    EGFR status is the key to select appropriate treatment. Cox et al. developed a
    model for gene mutations in adenocarcinoma using deep learning technique [36].
    They trained and input into the model to predict mutation-related features from
    the cancer genome atlas.


    80%–90% of lung cancer have different histologies and include their main subtypes,
    namely squamous cell carcinoma, adenocarcinoma, and large cell carcinoma. Due
    to the differences in the subtypes of lung cancer, it is important to accurately
    classify the types of lung cancer in clinical practice. Deep learning could be
    used to identify the pathological patterns of lung cancer. Tracheobronchial cytology
    has been used to identify the different types of lung cancer. Teramato et al.
    analyzed the classification of 76 cases of lung cancer, including squamous cell
    carcinoma, adenocarcinoma, and large cell carcinoma. They used feature extraction
    to determine the type with an accuracy of 71.1%, which was compared to the classification
    of trained cytopathologists [54]. Khorani et al developed a new fine-tuned transformer
    model for the classification of adenocarcinoma from 100% high-resolution localization
    images with an accuracy of 75%–90% [55]. Cox and al normally used 1634 slide images
    (1176 tumor cases and 458 normal samples) to train the model with a 70% training
    set, a 15% validation set, and a 15% test set [56]. The method of image segmentation
    data were used to train input v-3, and further was used to verify and test in
    an independent data set. The results showed that the morphological characteristics
    of the images, such, nuclear shape, were normal, squamous cell carcinoma, and
    adenocarcinoma. The results showed comparable performance with pathologists''
    results with an accuracy of 97%.


    Lung adenocarcinoma has significant heterogeneity in histological, molecular,
    radiological, and pathological features [57]. The growth and pattern of lung adenocarcinoma
    vary in subtype, including micro-acinar adenocarcinoma, lepidic adenocarcinoma,
    glandular papillary adenocarcinoma, micropapillary adenocarcinoma, solid adenocarcinoma.
    These major subtypes of lung adenocarcinoma present different prognosis, outcomes
    [58] and responses to treatment [59]. The classification of subtypes remains a
    challenge. Accurate classification of each type which is time-consuming and inaccurate
    is, very necessary. At present, the research of deep learning in lung cancer typing
    mainly focuses on the classification of squamous cell type and adenocarcinoma.
