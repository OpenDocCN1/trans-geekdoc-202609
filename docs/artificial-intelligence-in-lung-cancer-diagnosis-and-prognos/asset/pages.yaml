    # 5.2. Future


    With the development of medical technology, non-invasive AI detection of tumors,
    and analysis of PET/CT and CT images, comprehensive profiling by deep sequencing
    (CAP-Seq) has been used in clinical setting. The detection of tumor DNA (ctDNA)
    in peripheral blood is reported by CAP-Seq. The detection of RNAs and other chemical
    markers in peripheral blood is expected to be achieved within a few years.


    To optimize the evaluation and the efficacy of the different methods still need
    to be addressed. To date, therapy of lung cancer is not based on the use of AI.
    Because effective therapy is primarily dependent on PD-1 expression levels in
    tumors, the PD-1 detection method still needs efficiency and convenience by staining
    in tumor tissues. However, there are many challenges in the development of AI
    technology for tumor segmentation, morphology and heterogeneity.


    The prognosis of lung patients can be accurately based on the information in pathological
    sections. A study analyzed 2186 patients with lung adenocarcinoma and squamous
    carcinoma from TCGA (microarray) database [69]. The quantitative features of images
    were extracted and the features were the most significant for predicting survival.
    The results showed that the Cox model could well predict the survival of patients
    with lung adenocarcinoma (P = 0.03) and lung squamous carcinoma (P < 0.02). In
    addition, data from the TCGA was used to verify the efficacy of the prediction.
    There was no significant difference in the accuracy of the prediction of these
    two types of tumors (P < 0.036), which indicated that the application of automated
    pathological image features predicted the prognosis of lung patients (60). However,
    AI application in lung cancer prognosis is likely to advance and will provide
    novel decision-making for clinicians.


    As a bridge toward prediction, AI-based lung cancer analysis has shown excellent
    performance and potential. In some studies, the performance of AI can be comparable
    to that of physicians. Especially with the development of Positron Emission Tomography
    (PET/CT), it is widely used as the method for early diagnosis of lung cancer.
    Recent years have shown the early diagnosis of lung cancer, which has cancer significance
    in the differentiation of benign and malignant nodules [70]. However, the application
    of AI is still under development. Due to various limitations and challenges, such
    as image quality control and lack of an authoritative lung cancer AI diagnosis
    tool may affect the accuracy of the AI system.


    # 6. Conclusion


    In summary, AI technology has made progress in early screening, pathological diagnosis,
    and classification, prognosis assessment, surgical navigation, and immunotherapy
    of lung cancer. Here, we evaluated the value of AI in lung cancer diagnosis and
    prognosis, which provide novel decision-making for the precision treatment of
    lung cancer patients.'
