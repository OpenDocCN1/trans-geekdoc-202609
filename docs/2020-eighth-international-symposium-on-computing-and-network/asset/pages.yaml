    # 4.2. Implementation Overview


    4.2.1. Case 1. Figure 5 shows the configuration of Case 1 and its data flow. This
    environment consists of a host machine, worker machines equipped with GPUs, and
    the proposed DPDK-based network switch. In Case 1, each learning iteration proceeds
    as:


    +   1. The host machine extracts minibatches from a training dataset and distributes
    them to each GPU.

    2. The GPU of each worker calculates the gradient by aggregating matches to the
    host machine using its own DNN model.

    3. The calculated gradient is sent to the host machine.

    4. These gradients are aggregated on the network switch of the host machine.

    5. The aggregated gradient is multiplied by the switch to each GPU, not the host
    machine.

    6. Instead of receiving gradients from each GPU, the host machine receives a signal
    indicating completion of the aggregation from the switch.


    These steps can be used to mitigate communication overhead for gradient data communication.
    In this implementation, we use UDP/IP and TCP/IP for other communication. Considering
    the transmission efficiency and the packet buffer size in DPDK switch, packet
    length containing gradient data is 1516 bytes, which includes additional headers
    indicating the type of data and the sequence number of gradients.


