  md: '# An In-Network Parameter Aggregation using DPDK for Multi-GPU Deep Learning


    Masaki Furukawa, Tomoya Itsubo, and Hiroshi Matsumoto

    Keio University, 3-14-1 Hiyoshi, Kohaka-ku, Yokohama, Japan 223-8552

    Email: {furukawa,itsubo,matutani}@arc.iec.co.jp


    Abstract—In deep neural network training using GPU nodes, communicate iteratively
    between nodes for parameter aggregation. Communication latency limits the benefit
    of training with faster GPUs. In distributed deep neural network training using
    GPU nodes, workload of gradient aggregation is performed on a host machine. We
    propose to offload the aggregation to a Data Plane Development Kit (DPDK)-based
    switch between the host machine and GPU. In this approach, the aggregation is
    completed in the network switch. We evaluate the switch using a standard IP communication
    over Express and EthernetX 40G (A PCIe over 40GbE product). The evaluation results
    show that the proposed switch provides a higher throughput compared to the method
    performed on the host machine. The evaluation results using the PCIe over 40GbE
    show that the proposed--DPDK-based switch reduces the aggregation time by the
    host machine by 1.66x. This approach is thus useful for distributed training with
    multiple GPUs.


    to the network switch and executed by its extra computing resources. We evaluate
    the switch GPU and the host machine with a standard IP communication and EthernetX
    40G (A PCIe over 40GbE product). The evaluation results show that the proposed
    switch provides a higher throughput compared to the method performed on the host
    machine.

    This paper is organized as follows: Section 2 introduces distributed training
    and GPU extension. Section 3 proposes the DPDK-based switch that performs the
    gradient aggregation. Section 4 describes the configuration and implementation.
    Section 5 evaluates the aggregation performance using the proposed switch. Section
    6 concludes this paper.


    # 1. Introduction


    Distributed learning using multiple GPUs is used to reduce training time. In data
    parallel training, training process has (1) GPU computation phase for backpass
    and (2) communication phase for parameter aggregation. The computation phase is
    accelerated by GPUs. However, the communication phase is not accelerated, and
    is not increased with GPU work counter. The performance of modern GPUs is significantly
    increased, the aggregation overhead limit the benefit of distributed training
    with multiple GPUs [1]. This paper proposes to offload the aggregation to a switch
    of distributed training.


    In this paper, we assume remote GPU environment using network-attached GPU, where
    a host machine and GPUs are connected over 40GbE. In this case since the aggregation
    is performed on the host machine, the aggregation depends on the performance of
    the host machine. We propose a DPDK (Data Plane Development Kit) [2] based switch
    which performs the aggregation in the network. The parameter aggregation is offloaded


    The training process is divided into three phases: forward pass, backward pass,
    and optimization. In the forward pass, a prediction is performed for each GPU.
    In the backward pass, the gradient is calculated for each GPU. In the optimization,
    parameters are updated using GPUs so that the errors are minimized. Generally,
    the communications are on a GPU and can be parallelized using multiple GPUs.


    There are two approaches to parallelize the training using multiple GPUs data
    parallel and model parallel [4]. In the data parallel, the network data is divided
    and applied to the neural network of each GPU. On the other hand, in the model
    parallel, training is performed by duplicating the model into each GPU. The distributed
    training using multiple GPUs requires an aggregation called All-Reduce. The performance
    of a single GPU is a bottleneck in a distributed training. In the distributed
    training, the gradients calculated by each GPU need to be aggregated between the
    backward pass and the optimization. By performing this All-Reduce process, a large-scale
    distributed training using a huge number bottleneck becomes possible. The model
    parameters are updated based on these aggregated gradients in the optimization
    phase.


