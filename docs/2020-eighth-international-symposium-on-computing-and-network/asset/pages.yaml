    \ communication between remote GPUs is required to aggregate gradients. The aggregation\
    \ is a sequential process. Furthermore, as the number of GPUs increase, parallel\
    \ computation becomes faster, but overhead of the aggregation process increase.\
    \ Communication latency of the network bottleneck. In [8], state-of-the-art DNN\
    \ (Deep Neural Networks) were trained using a five-node cluster with 10GbE connections.\
    \ In this case the communication time is a significant part of the total training\
    \ time. In [9], parameter optimization algorithms, accelerated in 100GbE-based\
    \ network.\n\nIn addition, some methods to de-centralize DNN using GPU clusters\
    \ were proposed [10] [11]. A cluster consisting of 128 nodes with 1024 Tesla P100\
    \ GPUs completed a training of ImageNet in 15 minutes. The nodes are connected\
    \ with InfiniBand as a high-speed interconnect. The communication libraries used\
    \ like NVIDIA Collective Communications and MPI accelerate the performance, but\
    \ the communication overhead increases as the number of GPUs increases. In [10],\
    \ it is reported that 20% of the training time with 1,024 GPUs is spent for the\
    \ communication bottleneck.\n\n![](img/8db08bcf098fb19248fde4b91cb00e0e_1_0.png)\n\
    \nSeveral variants of the gradient descent optimization algorithm have been proposed.\
    \ Using the commonly basic optimization is SGD (Stochastic Gradient Descent).\
    \ It is assumed that $\\beta_i$ is assigned to corresponding GPU, and $\\ell_i$\
    \ denotes the loss function for minibatch $\beta_i$. In SGD, the weights are updated\
    \ as follows:\n\n```\n$w^{(i+1)} = w^{(i)} - \\eta \\cdot \\sum_{j \\in \\beta_i}\
    \ \\nabla \\ell_j(w^{(i)})$\n```\n\nwhere $w^{(i)}$, $\\ell_i$, and $\\eta$ denote\
    \ the current weights, the current gradients, and the learning rate, respectively.\
    \ Then, the minibatch is trained. This process employs synchronous training, which\
    \ is important in terms of learning accuracy and convergence speed [5], but our\
    \ proposal is also useful for asynchronous training.\n\n# 2.2-Networked GPU Technology\n\
    \nDue to limitations in the number of PCIe slots and power, the number of GPUs\
    \ that can be equipped on a single machine is limited. To mitigate these limitations,\
    \ there is an approach to connect GPUs via remote network. This approach is also\
    \ effective in terms of GPU utilization and power efficiency. In this approach,\
    \ networked GPUs can be used as well as directly connected GPUs. The following\
    \ describes two remote extension technologies.\n\nExpEther [3] is a PCIe over\
    \ Ethernet that makes GPUs available via Ethernet. Each GPU and a host are connected\
    \ to Ethernet using a hardware ExpEther. PCIe packets are encapsulated into Ethernet\
    \ frames by this bridge and transmitted to remote nodes. We employ ExpEther 40G\
    \ as a case of remote GPU environment in this study.\n\nrCUDA (remote CUDA) [7]\
    \ is used to use GPUs via a network. rCUDA is a client-based server model. In\
    \ this approach, GPUs are connected to server machines via PCIe slots, and the\
    \ server machines are connected to the network. Clients request the server machines\
    \ for processing via TCP/IP communication. Then, the server machines instead of\
    \ clients perform the tasks using CUDA.\n\nMelanox SHARP (scalable Hierarchical\
    \ Aggregation Protocol) [12] is known as a reduction communication offload technology.\
    \ Reduction operations based on SHARP can be offloaded to InfiniBand switches\
    \ as well to reduce the communication latency between machines equipped with GPUs.\
    \ This paper targets the communication of the network-attached GPU clusters over\
    \ Ethernet expressed by switch.\n\nComputing clusters consisting of several GPUs\
