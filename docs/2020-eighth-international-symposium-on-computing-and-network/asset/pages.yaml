    # 6. Summary


    In distributed training using remote nodes, aggregation occurred between remote
    nodes when gradients are aggregated. This aggregation causes some overhead. We
    focused on remote GPU environments using network attached GPUs. In these environments,
    aggregation load is on a host machine which lowers aggregation throughput. Therefore
    we proposed to switch the aggregation to a DPDK-based network switch between the
    host machine and remote GPU. Our evaluation showed that the proposed switch outperformed
    the aggregation executed on the host machine by 2.2-5.4x. Our evaluation using
    ExpEther showed aggregation throughput was improved by 1.66x with our current
    implementation.


    As a future work, we are evaluating the scalability of the switch (which is using
    more GPUs in remote GPU environments). We are also planning to demonstrate the
    performance improvement of training using low-cost GPU clusters composed of power-efficient
    GPUs such as NVIDIA Jetson servers.


