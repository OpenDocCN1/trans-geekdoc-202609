    # 4.3. DPDK-Based Aggregation


    Figure 8 illustrates an overview of the implemented DPDK-based aggregation switch.
    The DPDK application receives packets directly in user space using a polling-receiving
    mechanism (PMD, Mode Driver). The received packet is placed in the packet buffer
    allocated on Huge, the adapter obtains the packet pointer using DPDK libraries.
    The aggregation switch mainly consists of a sending / receiving thread group and
    a aggregation thread group. These elements are implemented as DPDK threads, which
    require no linear locks. Threads guarantee the order of the received packets,
