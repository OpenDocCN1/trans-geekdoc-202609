    ## 3.3. DPDK-In-Network Aggregation


    We offload aggregation to a software network. Switches are typically programmable
    and can add many modules; they are useful for the aggregation task that needs
    to synchronize gradient data. There are many ways to implement the software network.
    In this case, we employ DPDK (2), which enables high-speed packet processing.
    The dedicated de-threading of a CPU core polls NIC (Network Interface Card), and
    an application controls the NIC directly. In distributed training with remote
    GPUs, all gradient passes through the proposed switch. The gradient data is aggregated
    at the same time by the switch. The switch reduces the gradient data in the network
    by $1/N$, where $N$ is the number of GPUs. By performing the aggregation in the
    network, the workload on a host machine is significantly mitigated.


    ## 3.2. Gradient aggregation using Network Switch


    In recent years, the size of DNN models has increased with the benefit of faster
    GPUs. The model size and number of connected GPUs, aggregation throughput is limited
    by the bandwidth of an Ethernet switch and host switch. We estimate the minimum
    communication time for each iteration. For a model of size $M$, with $N$ GPU workers,
    and $B$ batches iteration, assuming gradients from GPU workers arrive asynchronously,
    the minimum communication time between the switch and the GPU is $2M/B$, while
    the time between the switch and the GPU is limited to $B/N$.


    In this paper, we propose to offload the gradient aggregation to the network.
