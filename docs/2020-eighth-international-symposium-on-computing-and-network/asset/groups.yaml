    # 基于 DPDK 的多 GPU 深度学习网络参数聚合


    Masaki Furukawa, Tomoya Itsubo, 和 Hiroshi Matsumoto

    庆应义大学，3-14-1 Hiyoshi, Kohaka-ku, Yokohama, Japan 223-8552

    Email: {furukawa,itsubo,matutani}@arc.iec.co.jp


    摘要—在利用 GPU 节点的深度神经网络训练中，节点之间需要进行迭代通信以进行参数聚合。通信延迟限制了使用更快的 GPU 进行训练的收益。在利用 GPU 节点的分布式深度神经网络训练中，梯度聚合的负载是在主机上执行的。我们建议将聚合任务卸载到主机和
    GPU 之间基于数据平面开发包（DPDK）的交换机。在这种方法中，聚合在网络交换机中完成。我们使用通过 Express 和 EthernetX 40G（一种
    PCIe over 40GbE 产品）的标准 IP 通信对交换机进行了评估。评估结果表明，与在主机上执行的方法相比，提出的交换机提供了更高的吞吐量。使用 PCIe
    over 40GbE 的评估结果显示，基于基于 DPDK 的交换机比主机聚合时间减少了 1.66 倍。因此，这种方法对于多 GPU 分布式训练有用。训练过程分为三个阶段：前向传播、反向传播和优化。在前向传播中，对每个
    GPU 执行预测。在反向传播中，为每个 GPU 计算梯度。在优化阶段中，使用 GPU 更新参数以使误差最小化。通常，通信发生在 GPU 上，并可以使用多个
    GPU 进行并行化。


    使用多个 GPU 进行训练的并行化有两种方法：数据并行和模型并行 [4]。在数据并行中，网络数据被切分并应用到每个 GPU 的神经网络上。相反，在模型并行中，通过将模型复制到每个
    GPU 中进行训练。使用多个 GPU 的分布式训练需要一种称为 All-Reduce 的聚合。单个 GPU 的性能是分布式训练的瓶颈。在分布式训练中，每个
    GPU 计算的梯度需要在反向传播和优化之间进行聚合。通过执行此 All-Reduce 过程，使用大量瓶颈节点进行的大规模分布式训练变得成为可能。在优化阶段，根据这些聚合后的梯度更新模型参数。


    本文结构组织如下：第 2 节介绍分布式训练和 GPU 扩展。第 3 节提出了执行梯度聚合的基于 DPDK 的交换机。第 4 节描述了配置和实现。第 5 节使用提出的交换机评估了聚合性能。第
    6 节总结本文。


    # 1. 引言


    使用多个 GPU 的分布式学习用于缩短训练时间。在数据并行训练中，训练过程包括 (1) 用于反向传播的 GPU 计算阶段和 (2) 用于参数聚合的通信阶段。计算阶段由
    GPU 加速。然而，通信阶段没有被加速，且不会随着 GPU 工作计数器的增加而增加。现代 GPU 的性能显著提高，聚合开销限制了多 GPU 分布式训练的收益
    [1]。本文提出将聚合卸载到分布式训练的交换机。


    在本文中，我们假设一个使用网络连接 GPU 的远程 GPU 环境，其中主机和 GPU 通过 40GbE 连接。在这种情况下，由于聚合是在主机上执行的，聚合取决于主机的性能。我们提出了一种基于
    DPDK（数据平面开发包）[2] 的交换机，在网络中执行聚合。参数聚合被卸载到网络交换机并通过其额外的计算资源执行。我们使用标准 IP 通信和 EthernetX
    40G（一种 PCIe over 40GbE 产品）对交换机 GPU 和主机进行了评估。评估结果表明，与在主机上执行的方法相比，提出的交换机提供了更高的吞吐量。


    # 2. 相关工作


    ## 2.1. 分布式训练


    ## 2.3 通 通瓶颈


    在利用远程 GPU 的分布式训练中，需要远程 GPU 之间的通信来聚合梯度。聚合是一个顺序过程。此外，随着 GPU 数量的增加，并行计算变得更快，但聚合过程的开销会增加。网络延迟是瓶颈。在
    [8] 中，使用 10GbE 连接的五节点集群训练了 DNN。在这种情况下，通信时间占总训练时间的很大一部分。在 [9] 中，基于 100GbE 网络参数优化算法。


    此外，有人提出了使用 GPU 集群进行去中心化 DNN 方法 [10]。由 128 个 InfiniBand 节点组成的集群在 15 分钟内完成了训练。节点通过
    InfiniBand 进行高速互连。所使用的集合通信库加速了性能，但通信开销随 GPU 数量增加而增加。在 [10] 中，报告称训练时间的 20% 用于通信。


    ## 2.2. 网络 GPU 技术


    由于 PCIe 插槽数量和功率的限制，单机可配备的 GPU 数量是有限的。为了缓解这些限制，有一种通过远程网络连接 GPU 方法。这种方法在利用和功率效率方面也是有效的。在这种方法中，可以使用网络
    GPU 以及直接连接的 GPU。以下描述了两种扩展技术。


    ExpEther [3] 是一种基于 PCIe，通过以太网可以使用 GPU。每个 GPU 和主机通过硬件桥接连接到以太网。PCIe 包由该桥接封装成以太网帧并传输到远程节点。我们在研究中使用
    ExpEther 40G 作为远程 GPU 环境的案例。


    rCUDA [7] 用于通过网络使用 GPU。rCUDA 是基于客户端的服务器模型。在这种方法中，GPU 通过 PCIe 插槽连接到服务器，服务器连接到网络。客户端通过
    TCP/IP 请求服务器进行处理。然后，服务器代替客户端使用 CUDA 执行任务。


    墨ox SHARP（可扩展分层聚合协议）[12] 被称为一种归约通信卸载技术。基于 SHARP 的归约操作也可以卸载到 InfiniBand 交换机，以减少配备
    GPU 的机器之间的通信延迟。本文针对通过交换机表示的网络连接 GPU 集群的通信。


    # 3. 基于 DPDK 的交换机设计


    ## 3.1. 远程 GPU 环境


    本节提出了基于 DPDK 的深度学习梯度聚合加速。首先，描述了假设的 GPU 配置以及该配置中的瓶颈。远程环境由主机、一个以太网交换机和多个 GPU 工作节点组成，每个组件都连接到
    40GbE 网络。


