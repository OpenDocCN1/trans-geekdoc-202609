    ## 3.3. DPDK 网络内聚合


    我们将聚合操作卸载到软件网络中。交换机通常是可编程的，可以添加许多模块；它们对于需要同步梯度数据的聚合任务非常有用。实现软件网络有许多方法。在这种情况下，我们采用了
    DPDK (2)，它能够实现高速数据包处理。CPU 核心的专用去线程轮询 NIC（网络接口卡），由应用程序直接控制 NIC。在具有远程 GPU 的分布式训练中，所有梯度都通过提议的交换机。梯度数据在交换机处同时进行聚合。交换机将网络中的梯度数据减少了
    $1/N$，其中 $N$ 是 GPU 的数量。通过在网络中执行聚合，主机的工作负载得到了显著减轻。


    ## 3.2. 使用网络交换机进行梯度聚合


    近年来，得益于更快的 GPU，DNN 模型的大小不断增加。由于模型大小和连接的 GPU 数量，聚合吞吐量受到以太网交换机和主机交换机带宽的限制。我们估计每次迭代的最小通信时间。对于大小为
    $M$ 的模型，具有 $N$ 个 GPU 工作节点和 $B$ 个批次迭代，假设来自 GPU 工作节点的梯度异步到达，则交换机与 GPU 之间的最小通信时间为
    $2M/B$，而交换机与 GPU 之间的时间限制为 $B/N$。


    在本文，我们建议将梯度聚合卸载到网络中。图 3 展示了提议的系统，其中梯度由连接主机和每个 GPU 的交换机进行聚合。这种方法防止了任务时间随 GPU 数量成比例增加。


