    ### 5.2.2. 案例 2。我们评估了使用 ExEther 作为实际远程 GPU 实体时的执行时间。在 ReEther 中，ExEther 在私有协议上执行的套接字通信包含更多的包桥接，这降低了所提交换机的吞吐量。在本次评估中，考虑到
    1,000 个包，使用 32,000 个参数进行聚合。该执行时间定义为直到完成来自每个 GPU 的所有梯度叠加的时间。执行时间由两台配备的 GPU、一台主机和所提交换机组成。图
    11 显示了聚合执行时间的比较。注意，此时间不包括对聚合梯度的处理。在交换机上执行的聚合比在主机上快 1.6 倍。特别是使用参数尺寸。此外，控制 ExEther
    协议的包引入了不必要的开销。因此，我们的聚合有改进空间。通过进一步实现，结果表明所提交换机对于实际远程 GPU 环境是有用的。


    在评估中，聚合吞吐量提升了约 1.6 倍。根据第 3.1 节中训练时间的发展，进入时间缩短了约 1.25%。本文中仅使用了少量 GPU 进行评估，但通常会使用更多
    GPU。随着 GPU 节点数量的增加，开销随之增加。在具有更多 GPU 的分布式系统中，所提交换机将进一步减少总时间。请注意，聚合是通过网络完成的，主机的交换机计算资源可以用于其他任务。


    ## 6. 总结


    在使用远程节点的分布式训练中，当梯度聚合时，聚合发生在远程节点之间。在这些 环境中，聚合在主机上完成。我们关注的是在 GPU 环境中的网络聚合。因此，所提交换机在分布式训练中进一步减少了总时间。我们的评估表明，使用我们的实现方法，聚合吞吐量提升了
    1.6 倍。


