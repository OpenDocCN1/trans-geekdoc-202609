  md: '# # 3 Phylogenetics


    # ## 3.1 INTRODUCTION TO PHYLOGENETICS


    The term *species* is defined as a set of similar organisms. The degree of similarity
    is such that the amount of dissimilarity to other sets is significant. The similarity
    accounts for gene flow among the species. In other words, species grow by producing
    viable offsprings. Organisms that are isolated from this genetic transfer experience
    a drift from their species with due course of time. This is called speciation.
    Formally, speciation may be defined as an evolutionary process that leads to formation
    of new species. For example, a group of lizards may happen to move outside their
    native land. With due course of time, those lizards try to adapt to the environment
    in order to sustain life in the new environment. These lizards may undergo structural
    changes like change in colorful flap of skin under the lizard’s throat, leading
    to new species of lizards that no longer mate with the former species of lizards.
    Over a period of hundreds of years, the old species may not even recognize the
    new species, thereby creating biological taxonomy.


    This biological taxonomy relates to term *phylogeny*. Consequently, phylogenetics
    is a science of studying biological relationships between organisms that have
    emerged from a common ancestor over a period of time.


    Phylogenetic relationships are represented by a tree diagram or a hierarchical
    diagram called a phylogenetic tree. In other words, a phylogenetic tree is a method
    of showing the genetic relatedness between species. It portrays the evolutionary
    relationships that are developed over a period of time from a common ancestor.
    Figure 3.1 shows a phylogenetic tree wherein Taxa X and Taxa Y have a common ancestor.
    X, Y and Z are called leaves of the tree. Taxa X and Taxa Y are more closely related
    to each other than to Taxa Z because they share a common ancestor. But this doesn’t
    mean that Taxa X, Y and Z are not related. They are very much related because
    they also share a common ancestor at the second level. This way we can say a phylogenetic
    tree shows how closely or distantly the organisms are related.


    There are two types of phylogenetic trees: rooted phylogenetic trees and un-rooted
    phylogenetic trees.


    # ## 3.1.1 ROOTED PHYLOGENETIC TREE


    A rooted phylogenetic tree is as shown in Figure 3.1. Organisms here are clearly
    related to each other by a common ancestor. Evolutionary relationships can be
    built by means of physiological features, morphological features and significantly
    the genetic features of each of the organisms. Physiological features relate to
    the functioning of a particular organ; for example, how an organism’s metabolism
    works.'
