    # 1.3 CENTRAL DOGMA OF MOLECULAR BIOLOGY


    Molecular biology is the biology of molecules like RNA, DNA and protein, which
    actively participate in the processes called transcription and translation. The
    central dogma of molecular biology refers to the collective process of transcription
    followed by translation, often called gene expression. The gene expression process
    is the foundation of all the chemical reactions in our body.


    This process starts with DNA. As shown in Figure 1.7, double-stranded DNA replicates
    itself into two single-stranded DNA. This single-stranded DNA then converts into
    mRNA (messenger RNA). This process is called transcription. The alphabets or bases
    in mRNA are grouped together in a set of three. These sets are called codons.
    Each codon corresponds to a particular amino acid. tRNA (transfer RNA) translates
    these codons and transfers a free amino acid to the target. The target place where
    codon and amino acid bind takes place in the ribosome. Sequences of amino acids
    form polypeptide chains and thus proteins. Ribosomes then deliver the protein
    into the cell. These proteins are the building blocks of our body and are responsible
    for all the functions in our body.


    # 1.4 THE FOLDING PROBLEM


    The protein folding problem refers to the prediction of structures of proteins
    by analyzing the sequence of amino acids. In other words, if any of the twenty
    amino acids sequence together in a particular fashion, we should be able to judge
    how this polypeptide chain or amino acid sequence is going to fold and what will
    be the resultant proteins.


    Further, polypeptide chains may experience interactions between two pairs that
    are distantly related but eventually came close due to massive folding of the'
