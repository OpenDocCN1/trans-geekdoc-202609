    # 3.5 MAXIMUM LIKELIHOOD – CHARACTER-BASED METHOD FOR PHYLOGENETIC TREE CONSTRUCTION


    Character-based methods use the aligned characters, such as DNA or protein sequences,
    for constructing phylogenetic trees.


    For instance, consider aligned DNA sequences of species A to E (Figure 3.20(a)).
    The transition (or evolutionary steps) in the first set of characters may result
    in a phylogenetic tree, as shown in Figure 3.20(b).


    The input of this method is an n * m character matrix, where n denoted species
    and m depicts characters. The output is a tree in which species with similar character
    values appear near to each other. Characteristics could be number of fingers,
    number of walking legs, presence or absence of hair, etc. The characteristic data
    is placed in a character state matrix; the matrix is shown in Figure 3.21. The
    first step in a phylogenetic tree generation is arrangement of the matrix contents
    in such a way that it conveys some relationship between characteristics of species.
    Also, the number of evolutionary steps should be kept to a minimum while creating
    the tree.


    Figure 3.21 shows a character state matrix for various taxa (lancelet, lamprey,
    tuna, salamander, turtle, leopard) and their corresponding characteristics, namely
    hair, amniotic egg, four walking legs, hinged jaws and vertebral column. The taxa
    leopard has all five characteristics and the taxa lancelet has none of the given
    characteristics. So, these two taxa will appear at the extreme ends in the


