    # 5.4.5 KISSING HAIRPIN PSEUDOKNOT OR H-H-H TYPE PSEUDOKNOT


    Base pairing between multiple hairpin loops forms an H-H-H type of pseudoknot,
    as shown in Figure 5.21. Three hairpin loops are formed in sequence, one after
    the other. Afterwards, these hairpin loops form base pairs among their unpaired
    bases. Kissing hairpins are essential for replication in the Coxsackie virus.
    They also play a role in viral plasmid DNA replication or RNA synthesis. This
    interaction of two loops is exceptionally stable.


    # 5.4.6 THREE-KNOT PSEUDOKNOT


    A three-knot pseudoknot is formed by base-pair interactions among three H-type
    loops, as shown in Figure 5.22.


    ![](img/4cb83489753bba67a16c119dae990237_98_1.png)


    FIGURE 5.22 Three-Knot Pseudoknot'
