  md: '# ## 1.2 DNA, RNA AND PROTEIN SEQUENCES


    The house of bioinformatics is based on foundation of DNA, RNA and protein. These
    three are the building blocks of life.


    Organisms have cells that communicate and interact to form tissues, organs and
    organisms. Cells are made of membranes, proteins, carbohydrates, vitamins and
    nucleic acids. Bunches of cells form tissue. Lots of tissues form an organ and
    organs make a whole organism.


    Assembly of cell parts requires additional information that is contained in deoxyribonucleic
    acid (DNA). After assembly, the complete functionality of the body is taken care
    of by proteins. DNA is converted to proteins with RNA (ribonucleic acid) as an
    intermediate.


    # ### 1.2.1 DNA


    DNA is present inside the nucleus of cell. It is the cookbook for manufacturing
    proteins. It carries all the genetic information of a cell. Features of DNA are
    as follows:


    +   - It is a nucleic acid that encodes information necessary to build a cell.

    +   - It contains hereditary information that may be passed from one generation
    to another. For example, the colour of allele of the child''s eye is the same
    as that of the mother''s eye.

    +   - It stores and maintains cellular information and passes it from generation
    to generation.

    +   - It is a cookbook for synthesis of proteins.

    +   - DNA is a stable molecule.

    +   - A single copy of DNA exists per cell.

    +   - DNA replicates itself every time the cell is divided.

    +   - DNA structure

    +     - DNA is a double helix structure, as shown in Figure 1.3.

    +     - It contains four bases, namely A for adenine; G for guanine; C for cytosine;
    and T for thymine.


    # ### 1.2.2 RNA


    DNA is converted to RNA before being transformed to protein. RNA is another nucleic
    acid similar to DNA is some respects.


    The features of RNA are as follows:


    +   - RNA assists DNA in synthesizing a particular protein.

    +   - RNA is located in the nucleus, cytoplasm or ribosome i.e. inside and outside
    of the nucleus.

    +   - RNA is an unstable molecule.

    +   - Multiple copies of RNA exist per cell.

    +   - There are many types of RNA, namely mRNA, tRNA, rRNA, snRNA, siRNA, miRNA,
    asRNA

    +   - RNA structure'
