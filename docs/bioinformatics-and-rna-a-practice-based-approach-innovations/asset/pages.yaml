  md: '# 6.1 DYNAMIC PROGRAMMING TECHNIQUE


    Dynamic programming models assume a recursive solution for a given problem, sub-solutions
    being recorded for reuse. The minimum free energy of a structure is recursively
    calculated by adding the energy of its sub-structures. The energy of a sub-structure
    is calculated using standard thermodynamic parameters [27]. Unfortunately, the
    standard thermodynamic information for pseudoknots does not exist. So, researchers
    rely on its approximate values, leaving room for optimization. As the theory behind
    dynamic programming model and free energy minimization is "most stable is the
    most likely", so it computes one optimal structure of minimum energy. One of the
    earliest attempts to predict pseudoknots in an RNA secondary structure using dynamic
    programming was made by [22]. For predicting optimal minimum free energy structure
    for single sequence, they proposed various recurrence relations to find score
    for various sub-structures like bulges, hairpin loops and multi-loops as well
    as pseudoknots. Their model (pknots) calculated a minimum free energy score by
    adding the score of all its sub-structures. The score of non-pseudoknotted substructures
    was calculated using standard thermodynamic parameters while for pseudoknots,
    approximated parameters were used. The efficiency of pknots depends on the score
    parameters. So, it is important to have accurate values for these parameters.
    The pseudoknot structures were represented by graphical representation using gap
    matrices and recurrence relations were formed with the help of those gap matrices.
    This algorithm can handle structures having up to two gap matrices i.e. very complex
    structures are ignored. While calculating minimum free energy score of sub-structures,
    this algorithm also considered coaxialal stacking energies for nested and non-nested
    structures with the help of estimated score parameter. This again creates room
    for optimization. Although this algorithm worked well for small RNA sequences
    without producing any spurious pseudoknots, the biggest disadvantage of this model
    is its too high memory and time requirements due to consideration of the broadest
    class of Pseudoknot structures.


    Another researcher [24] used the recurrence relations of [22] and proposed another
    model based on dynamic programming. But his recurrence relations were more restricted
    than recurrence relations proposed by [22]. This dynamic programming model is
    also inspired from a model proposed by [47]. It is a complicated and difficult-to-understand
    Tree Adjoining Grammar (TAG) approach to predict pseudoknots. Uemura’s concept
    was used by [24] but without TAGs, making the algorithm simple and flexible. It
    is observed that both algorithms had the same time complexities. Initially, in
    this algorithm a scoring function was used that was based on the total number
    of base pairs. Then this algorithm was extended in various ways. Firstly, this
    algorithm was extended to include energy function based on adjacent base pairs.
    Another extension was the consideration of free energy of loop regions. Due to
    the unavailability of thermodynamic information for pseudoknots, the energy of
    loops was approximated from the length of the loop. This is where the algorithm’s
    performance could be enhanced. The free energy parameters of the RNA secondary
    structures were being worked upon by [48] including H-type pseudoknots to improve
    the performance of their model [49]. They have introduced a penalty factor while
    calculating the total free energy of the predicted structure. For'
  merge: -1
  img_proc: true
