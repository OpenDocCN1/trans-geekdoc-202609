    +   - Membrane Proteins – These proteins have multiple roles like connecting cells
    with each other, receptor proteins and transporting molecules. For example – histones,
    glucose transporter etc.


    They are made up of twenty amino acids that are linked together by bonds called
    peptide bonds. The source of amino acids in our body is our diet. A few amino
    acids'
