    # 8.4 BIOTERRORISM


    The advances in RNA and DNA have led to their use in areas like identification
    of victims, paternity test, medical diagnostics, forensic archaeology, DNA fingerprinting,
    RNA therapeutics, etc. But with these advents, there comes a danger of producing
    superbugs either accidentally as bioterrorism agents or explicitly for the use
    of biological weapons.


    Biological weapons are the combination of biological agents such as viruses, bacteria
    and their derivatives like toxins, and the means of keeping the agents alive and
    virulent, transporting them to where they will be dispersed and a dissemination
    mechanism.


    Bioterrorism is terrorism involving the intentional release or dissemination of
    biological agents. These agents are bacteria, viruses, insects, fungi or toxins,
    and may be be in a naturally occurring or a human-modified form, in much the same
    way in biological warfare.


    It is a type of warfare that makes use of biological agents or biological weapons
    to harm the enemy. These weapons use chemicals from either animals or plants or
    microorganisms. Apart from this, deadly infectious agents may also be used to
    turn these weapons into bioterrorism agents. These infectious agents may include
    viruses, protozoa or fungi. Bioterrorism agents may also be modified versions
    of normally occurring pathogens.


    There are three categories of bioterrorism agents. All of the three categories
    have the potential to be weaponized and they can cause substantial damage to human
    life.'
