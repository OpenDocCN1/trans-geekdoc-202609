    FIGURE 3.3 Paralogs and Orthologs


    In molecular phylogenetics, the rate of mutation in a molecular sequence is tracked
    in order to study evolutionary relationships among species. A mutation in a sequence
    refers to insertion, removal, inversion or replacement of nucleotides in a molecular
    sequence.


    Information is passed from generation to generation through gene evolution or
    through DNA sequence. Gene evolution results in paralogs, homologs and orthologs.
    Paralogs are homologous sequences that are related due to gene duplication, as
    shown in Figure 3.3. Orthologs are homologous sequences that are generated via
    speciation. In other words, orthologs have a last common ancestor. Homologs may
    result from speciation or gene duplication. Homologs may be paralogs or orthologs.


    The molecular structure of related species has a high degree of similarity.


    # 3.3 PHYLOGENETIC TREES AND THEIR CONSTRUCTION


    Understanding the phylogenetic relationships between organisms aids in creation
