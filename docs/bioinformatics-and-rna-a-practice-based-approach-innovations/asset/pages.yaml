    # FIGURE 3.1 Rooted Phylogenetic Tree


    Morphological features relate to various forms (morph) of an organ and other structural
    features for example structures of bones. Genetic features of an organism relate
    to features that are generally transmitted from parent to child; for example,
    colour of the allele of the eye of a mother and child.


    # 3.1.2 UNROOTED PHYLOGENETIC TREE


    Unlike rooted phylogenetic trees, unrooted trees are omnidirectional. More precisely,
    it is difficult to find ancestor of organisms by merely looking at the unrooted
    tree. In other words, an unrooted tree is constructed when we are not confident
    about the ancestor of two or more organisms. An unrooted tree is shown in Figure
    3.2 in which X, P, Y, Z. An unrooted try can also be transformed into a rooted
    try if additional information related to morphology, physiology or genetics is
    available. The resultant rooted tree may not always be correct due to lack of
    additional information.


    # 3.2 MOLECULAR PHYLOGENETICS


    Molecular phylogenetics is a branch of phylogeny that analyzes the difference
    in molecular sequences, essentially in a DNA sequence to understand the evolutionary
    relationships. Over a period of time, molecular sequences observe mutations.


    ![](img/4cb83489753bba67a16c119dae990237_50_1.png)


    # FIGURE 3.2 Unrooted Phylogenetic Tree'
