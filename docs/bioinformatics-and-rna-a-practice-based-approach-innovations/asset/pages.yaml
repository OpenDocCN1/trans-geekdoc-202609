    # 1.5.1 Genomics


    The study of genes in the genome is called genomics. The entire genetic content
    or DNA of an organism is called genome. Each cell in our body contains base pairs
    that are formed from four bases of DNA (A, C, G, T). There are approximately 3.5
    billion base pairs in a cell. The base-pair sequence folds multiple times to fit
    inside a cell. The most condensed form of this sequence is called a chromosome.
    We have twenty-three chromosomes in our body. Chromosomes contain genes, as shown
    in Figure 1.11. Massively coiled DNA exists in the form of chromosomes. Genes
    are the basic units of genetics. Each gene codes for a specific protein. The aim
