    # FIGURE 1.4 Protein Primary Sequence


    are alanine, lysine, glutamine, threonine and aspartic acid. There are four levels
    of protein structure – primary structure, secondary structure, tertiary structure
    and quaternary structure. Primary structure or primary sequence (Figure 1.4) is
    formed by a sequence of thousands of amino acids. Until this sequence folds, it
    is termed _primary sequence_. When this amino acid sequence folds and amino acids
    are linked through hydrogen bonds, the resulting structure is called a secondary
    structure of protein.


    The secondary structure further exists in two forms – α-helix structure and β-pleated
    sheet – as shown in Figure 1.5.


    Further, the secondary structure folds upon itself to form a tertiary protein
    structure i.e. bonding between α-helices and β-pleated sheets. This is a three-dimensional
    structure, as shown in Figure 1.6(a). A quarternary protein structure is formed
    when two or more amino acid chains bond together to form a structure. Amino acid
    chains are also called polypeptide chains. The quarternary structure of a protein
    is shown in Figure 1.6(b).


    Following are the functions of proteins:


    +   • Transport – Haemoglobin protein transports oxygen in our body.

    +   • Structural Components – Keratin protein forms structures for our skin and
    nails.

    +   • Hormones – Receptor proteins receive signals and send them further to other
    proteins.


