    # FIGURE 1.8 The Protein Folding Problem


    The second issue related to protein folding is proteins that erroneously folded,
    as shown in Figure 1.8. If the folded protein structure deviates from the expected
    or actual structure, it leads to diseases in our body. The cause of formation
    of deviated structures may be environmental factors, or external stimuli in our
    body etc. Scientists and researchers have been working on this for decades. This
    can be controlled at the gene expression level. Genes may be allowed to under-express
    or over-express so as to control the structure of the resultant protein. Lots
    of therapeutic techniques have been developed for this. Consequently, this information
    is used to invent new drugs for targeted diseases.


    # 1.5 GENOMICS AND PROTEOMICS


    The journey from genotype to phenotype is characterized by genomics and proteomics.
    Genotype refers to all genetic material inside our body and phenotype refers to
    how we look on the outside of our body. As shown in Figures 1.9 and 1.10, RNA
    is synthesized from DNA, which in turn manufactures proteins. Protein–protein
    interaction leads to chemical reactions in our body that catalyze metabolism.


    The aim of genomics and proteomics is the:


    +   - Identification of proteins as targets to cure diseases.

    +   - Understanding of cell processes and genetics.

    +   - Study of evolution through phylogenetic trees.'
  merge: -1
  img_proc: true
