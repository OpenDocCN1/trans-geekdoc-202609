  md: '# # 7 Pseudoknot Grammar


    # ## 7.1 CHOMSKY HIERARCHY OF GRAMMARS


    A grammar can be defined by four tuples (V, T, P, S) where V is the set of non-
    terminals, T stands for a set of terminals, P stands for a set of production rules
    and S stands for start symbol. A symbol is a basic building block in a language,
    e.g. 0 and 1. The number of symbols is predefined in any grammar. Grammar has
    a corresponding language. A finite non-empty set of symbols is called alphabet,
    e.g. {0,1}. The finite sequence of symbols is called a string, e.g. 001. Finally,
    a set of strings is called a language, e.g. 0n1m where n is even and m is odd
    that may generate 001, 000011, etc.


    As the production rules are applied on S, the construction of a derivation tree
    starts. The end nodes or leaf nodes of a derivation tree are called terminals.
    All the other nodes of the tree except leaf nodes are called non-terminals. The
    start symbol S is a special non-terminal that starts the derivation. A typical
    derivation tree for grammar G is shown in Figure 7.1.


    In the 1956, Noam Chomsky classified grammar into four types: Type 0, Type 1,
    Type 2 and Type 3 grammar. The properties of grammar are such that they are strictly
    nested, as shown in Figure 7.2. Type 3 is the most restrictive grammar and Type
    0 is the least restrictive. Each set of grammar is characterized by a set of rules.
    Also, each type has its corresponding language i.e. set of strings generated by
    grammar and associated automata. The types of grammar of the Chomsky hierarchy
    are shown in Figure 7.3.


    Also, Type<sub>i+1</sub> ⊂ Type<sub>i</sub> where i = 0, 1, 2 i.e. Type 3 grammar
    is a subset of Type 2, Type 1 and Type 0 grammar and so on. In other words, if
    a grammar is a regular grammar, it is automatically context free, context sensitive,
    and unrestricted grammar.


    ```

    S-> SS

    S-> a

    S-> b

    ```


    ![](img/4cb83489753bba67a16c119dae990237_117_0.png)


    FIGURE 7.1 Derivation Tree of Given Grammar'
  merge: -1
  img_proc: true
