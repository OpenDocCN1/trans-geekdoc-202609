  md: '# # 5 Pseudoknot


    The four bases in a primary sequence of RNA are adenine (A), guanine (G), cytosine
    (C) and uracil (U) which form a base pair. In other words, the primary sequence
    of RNA folds upon itself to form a secondary structure. The secondary structure
    in turn folds to form a tertiary structure. The function of RNA depends on its
    structure. It is quite costly to predict the tertiary structure of RNA. So, the
    secondary structure of RNA is focused upon by researchers for its accurate prediction.
    Various motifs in RNA secondary structure have been identified such as hairpin
    loop, bulge loop, internal loop, multi-branch loop, etc., as mentioned in Chapter
    4.


    Another important motif that was ignored by researchers for many years while predicting
    the RNA secondary structure is the pseudoknot. Reasons for ignoring the pseudoknot:


    +   - The presence of the pseudoknot makes the structure complex.

    +   - Prediction of the optimal structure using the ab initio recursive algorithms
    is not possible.

    +   - The frequency of occurrence of pseudoknots is less as compared to other
    motifs.


    Nevertheless, the prediction accuracy of RNA secondary structure prediction algorithms
    cannot be improved if pseudoknots are ignored. The major structural difference
    between a pseudoknot and other motifs is the way bases are paired, as shown in
    Figure 5.1(a) and (b). Without pseudoknot, the structure is recursive but the
    presence of a pseudoknot breaks the recurrence relation, thereby making its prediction
    difficult.


    # ## 5.1 DEFINITION


    The single-stranded RNA folds upon itself to form a secondary structure. A pseudoknot
    results when a loop in that secondary structure pairs with a complementary sequence
    outside the loop, as shown in Figure 5.1(a) and (b).


    A pseudoknot is just two overlapping base pairs. Two base pairs, i, j and i’,
    j’, respectively, are overlapping if i<i’<j<j’ or i’<i<j’<j. So, base pairing
    in a pseudoknot occurs in a non-nested fashion, contrary to the base paring in
    a non-pseudoknotted structure.


    # ### 5.1.1 Pseudoknot vs Knot


    A pseudoknot is sometimes called a false knot. If two ends of a pseudoknot are
    pulled in opposite directions, it turns into a straight line. This is the reason
    why pseudoknot is termed a false knot. Contrary to it, if two ends of a true knot
