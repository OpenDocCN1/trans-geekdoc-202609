    # FIGURE 7.2 Chomsky Hierarchy of Grammars


    | CLASS | GRAMMAR | LANGUAGE | AUTOMATON |

    |---|---|---|---|

    | Type 3 | Regular | Regular | Finite |

    | Type 2 | Context Free | Context Free | Pushdown |

    | Type 1 | Context Sensitive | Context Sensitive | Linear Bound |

    | Type 0 | Unrestricted | Recursive Enumerable | Turing Machine |


    # FIGURE 7.3 Types of Grammar in Chomsky Hierarchy


    But the reverse is not true. If grammar is context sensitive, it is not necessary
    that it is context free.


    Type 0 grammar or unrestricted grammar can have productions of the form:


    ```

    A → B

    ```


    where A can be terminal as well as non-terminal or a combination of both denoted
    by {VUT}+ and B can be a null, terminal, non-terminal or a combination of both
    terminals and non-terminals {VUT}*. In other words, both sides of production'
