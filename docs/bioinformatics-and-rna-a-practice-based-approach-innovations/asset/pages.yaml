  md: '![](img/4cb83489753bba67a16c119dae990237_22_0.png)


    FIGURE 1.12 Proteomics


    There are two major techniques for studying proteomics – two-dimensional electrophoresis
    and mass spectrometry.


    Two-dimensional electrophoresis is the process of separation of complex protein
    molecules. Mass spectrometry includes identification and structure analysis.


    Proteomics can be classified as follows (Figure 1.12):


    +   1. Protein Expression Comparison – Qualitative and quantitative study of protein
    expression between samples that differ by some variable.

    +   2. Structural Proteomics – The goal of structural proteomics is to map the
    three-dimensional structure of protein and protein complexes.

    +   3. Functional Proteomics – Functional proteomics aims to study protein-protein
    interactions, three-dimensional structure, cellular localization and post-translational
    modification in order to understand the functions of proteins.


