    # **FIGURE 3.8** UPGMA Method Example: Step 4


    Let us consider the tree once again. The distance of cluster “abc” is six which
    is divided into two halves amongst “a” and “bc”. Now the total distance from node
    “abc” to each leaf node should be 3. Distance from node “bc” to node “b” is already
    1.5. So the remaining distance will be,


    Distance (abc to bc) = distance (abc to b) – distance (bc to b) = 3 – 1.5 = 1.5


    Step 6. From Table 3.3, it is clear that nodes “d” and “e” will b clustered. The
    resultant tree and corresponding table are shown in Figure 3.9 and Table 3.4.


    Step 7. By repeating the procedure, the phylogenetic tree is as generated in Figure
    3.10.


    It may be noted that the sum of distances from each parent node to their respective
    leaves is the same. The distance from the root node to all leaves is same.


    This problem has been observed as the major disadvantage of the UPGMA algorithm
    as the number of mutations from one taxa to another may be different in the real
    world.


    To incorporate variable mutations, a new method was proposed – neighbor joining
    method.'
