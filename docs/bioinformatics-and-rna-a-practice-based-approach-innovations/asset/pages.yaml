    # 5.3.1 PLANAR GRAPH REPRESENTATION


    The planar graph structure of a pseudoknot can be seen as a graph, consisting
    of vertices and edges, as shown in Figure 5.12. The bases of RNA are vertices
    and the base pairs represent edges. Note that the planar representation of a pseudoknot
    has crossing edges.


    # 5.3.2 CIRCULAR REPRESENTATION


    Now consider the planar structure once again. If the two ends of a planar structure
    are joined to form a circle, stretching the length of base pairs, the resultant
    representation is called a circular representation, as shown in Figure 5.13. Crossing
    of edges in this representation ensures the presence of a pseudoknot in the structure.


    # 5.3.3 DOT BRACKET REPRESENTATION


    A dot bracket notation is a one-dimensional representation of RNA structure. All
    the bases of the RNA sequence are written from the left to right direction, as
    shown in Figure 5.14. Non-crossing base pairs are represented by round brackets
    (( )).'
