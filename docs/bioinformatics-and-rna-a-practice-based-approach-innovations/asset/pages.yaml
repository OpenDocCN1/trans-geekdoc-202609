    # 3.4 DISTANCE MATRIX METHODS OF PHYLOGENETIC TREE CONSTRUCTION


    Distance-based matrix methods use matrix as a data structure to conduct phylogenetic
    tree construction. The data is transformed into pairwise distances.


    # 3.4.1 UNWEIGHTED PAIR GROUP METHOD WITH ARITHMETIC MEAN (UPGMA) – DISTANCE MATRIX
    METHOD


    UPGMA is based on an agglomerative clustering technique. In this method, closely
    related clusters are progressively combined to form one cluster. Combining clusters
    carries on until all the clusters are combined to form a tree structure. Let us
    take an example of four nodes, namely a, b, c and d, as shown in Figure 3.6.


    The distance between the nodes is reflected in Table 3.1 as a two-dimensional
    matrix.


    +   Step 1. Find two nodes that are closest to each other. In the above example,
    the closest nodes are c and b, with a distance of three units.


    +   Step 2. Combine nodes b and c, as shown in Table 3.2, to form cluster bc.


    ```

    Distance (a to bc) = (7 + 5)/2 = 6

    Distance (d to bc) = (8 + 8)/2 = 8

    Distance (e to bc) = (5 + 15)/2 = 10

    ```


    +   Step 3. Create a phylogenetic tree according to new clusters, as shown in
    Figure 3.7. The new cluster is node “bc” and the distances from node “bc” to node
    “b” and from node “bc” to node “a” are equal. So, the distance 3 is divided into
    1.5 each.


    ![](img/4cb83489753bba67a16c119dae990237_52_1.png)


    FIGURE 3.6 UPGMA Method Example'
