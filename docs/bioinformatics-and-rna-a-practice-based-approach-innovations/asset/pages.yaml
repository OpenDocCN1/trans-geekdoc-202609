- pgno: 65
  md: 'Modern biological methods allow the use of molecular features, namely gene
    sequences and protein sequences. The goal is to generate a tree in which similar
    sequences with short distances are closer and the sum of the branch lengths of
    two nodes is equal to their distance.


    UPGMA: unweighted pair group method with arithmetic mean.


    +   • Assume a molecular clock (constant evolution rate)

    +   • Produce a rooted tree

    +   • Ultrametric condition: for any three taxa


    (a,b,c), dac <== max(dab, dbc).


    In other words: the two greatest distances must be equal.


    Or: constant evolutionary rate for all branches.


    # UPGMA condition


    dAB <== max(dAC,dBC)

    dAC <== max(dAB,dBC)

    dBC <== max(dAB, dAC)


    ![](img/4cb83489753bba67a16c119dae990237_65_0.png)


    Initialization: Define T to be the set of leaf nodes, one for each sequence. The
    height of each node is zero. Let L = T. Repeat


    +   • Select the closest two nodes (A, B) and create a parent node K for them.
    Join A, B and K, respectively. Set the height of node K to dAB/2. Set the branch
    length between K and A = height K – height A, and set the branch length between
    K and B = height K – height B.

    +   • Remove A, B from L and add K into L. Re-compute the distance between K and
    other nodes in L. The distance between K and the other nodes is the average distance
    of leaf sequences below K and the other node.


    Until there is only one node


