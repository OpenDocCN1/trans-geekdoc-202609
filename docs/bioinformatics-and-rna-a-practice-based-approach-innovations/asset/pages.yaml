  md: '# 6.3 HEURISTICS


    Heuristic pseudoknot prediction models are based on experimentation. These models
    are designed to reduce the computational time of approaches like dynamic programming.
    An earlier attempt in heuristic-based pseudoknot predictions was made by [62].
    This model (Kinefold) predicted pseudoknots by combining simple structural models
    and exact clustered stochastic (ECS) simulation. The ECS simulation uses a clustering
    technique to accelerate RNA folding stochastic simulations.


    Another heuristic model was proposed by [32]. Iterative Loop Matching (ILM) is
    a heuristic algorithm based on the Loop Matching (LM) algorithm. ILM is based
    on the combination of thermodynamic and comparative approach. It works on a single
    sequence. It takes as an input either an individual sequence or a sequence alignment.
    Pseudoknots are considered an interaction between two loop regions, so a number
    of iterations of LM algorithm are performed. The base pairs corresponding to secondary
    structure formed in a particular iteration are removed from the original sequence
    for the next iteration. During the iterations, only base pairs with the highest
    score are considered. A base-pair scoring matrix from sequence or sequence alignment
    is prepared by combining a covariance score and thermodynamic score. For individual
    sequences, the highest score calculation ignores covariance score. This heuristic
    algorithm also does not predict optimal structures. The algorithm is not too complex,
    works well on small sequences but is resource demanding. A number of models existed
    for predicting RNA pseudoknots, but it was soon realized that those models should
    be enhanced to predict occurring H-type pseudoknots. So, another model, HPknotter
    [63], was proposed combining some of the existing models, namely RNAMotif [64],
    pknots [22], Nupack [25] and pknotsRG [26]. The advantage of this combined model
    is its improved efficiency in predicting actual H-type pseudoknots by applying
    various filtering mechanisms from time to time in the prediction process.


    Another researcher proposed the heuristic model hotknots [33], which is an iterative
    procedure based on free energy minimization to predict an RNA secondary structure
    including pseudoknots. Hotknots were computed from an input sequence using a simple
    local alignment algorithm and then modified in order to keep the total length
    of hotknots from growing too large. A hotknot is defined as a stem structure composed
    of stacked pairs, bulge loops containing one unpaired base and interior loops
    with two (opposing) unpaired bases. A tree is made of a selected set of hotknots
    (good hotknots), each node of which having a set of hotknots is expanded into
    a secondary structure. In order to output a pseudoknot free secondary structure
    with minimum free energy, another algorithm, SimFold [65], was used. This algorithm
    also uses thermodynamic parameters of Turner [49,82], together with those of [25]
    for pseudoknotted loops to determine energy of structure and to prune a tree of
    partial structures. The heuristic hotknots model performs poorly in predicting
    optimal structures with respect to underlying energy model. Further, the running
    time of this model also needs to be improved. Inspired by the hotknots model,
    another iterative model based on evolutionary information as well as thermodynamics
    was proposed [66]. The performance of this model is better than hotknots in terms
    of sensitivity and specificity. Another heuristic attempt was made by [67]. Their
    implementation, Pkiss, combines dynamic programming and'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'canonization rules of [26] to reduce search space thereby lowering the space
    and time complexity. This heuristic model focused on kissing hairpin pseudoknots
    and is implemented in algebraic dynamic programming. This model was further improved
    [68]. Shape analysis and probabilities have been added to improve the prediction
    accuracy. Another heuristic pseudoknot prediction model [69] was proposed in 2007.
    They named it vsFold5 and it is available at http://www.rna.it-chiba.ac.jp/vsfold5.
    vsFold5 make use of biological features like polymer solvent interactions and
    Kuhn length to predict pseudoknots. Kuhn length is a measure of stiffness. The
    said model has the tendency to fold according to the thermodynamically most-probable
    folding pathway. It works for sequence lengths up to 450 nucleotides. The model
    takes as input, RNA sequence, minimum stem length and number of contiguous stems.
    Default values of most of the parameters are given. Polymer model options are
    also given. The output secondary structures are of minimum free energy based on
    Kuhn length, temperature and polymer solvent prominence irrespective of the fact
    that a pseudoknot is present or not. Pseudoknot structures have been categorized
    as core pseudoknots and extended pseudoknots. Extended pseudoknots are formed
    after secondary structures are formed, while core pseudoknots are formed before
    the formation of secondary structure.


    The worst case time complexity of vsFold5 corresponds to the sequence length.
    In this model, automated estimation of Kuhn length is an important factor. Also,
    their future work will be to accommodate parameters such as protein interactions,
    sub-optimal structures, etc. Another iterative model, Cyclofold [70], was proposed
    in 2010. This model folded the RNA sequence by choosing the helices iteratively
    on the basis of free energy. It also checked steric feasibility of these chosen
    helices to improve accuracy. Steric feasibility relates to the energy produced
