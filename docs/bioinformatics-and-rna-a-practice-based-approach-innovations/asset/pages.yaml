    because of the presence of multiple grammar components that communicate amongst
    each other. The time complexity of the algorithm is O(n^6) and space complexity
    is O(n^4).


    # 7.4 CONTEXT SENSITIVE GRAMMAR


    A context sensitive grammar is an unrestricted grammar in which all the productions
    are of the form:


    $\alpha \rightarrow \beta, \alpha, \beta \in (V \cup T)^* \text{ and } |\alpha|
    <= |\beta|$


    where $\alpha$ and $\beta$ are strings of non-terminals and terminals, respectively.
    Context sensitive grammars are more powerful than context free grammars because
    some languages can be described by CSG but not by context free grammars and CSL
    are less powerful than unrestricted grammar. That''s why context sensitive grammars
    are sited between context free and unrestricted grammars in the Chomsky hierarchy.


    +   Context sensitive grammar has 4-tuples. G = {N, $\Sigma$, P, S}, Where

    +   - N = Set of non-terminal symbols

    +   - $\Sigma$ = Set of terminal symbols

    +   - S = Start symbol of the production

    +   - P = Finite set of productions


    All rules in P are of the form a1 A a2 $\rightarrow$ a1 $\beta$ a2 where a1, a2
    $\in$ (N $\cup \Sigma$) and $\beta \in$ (N $\cup \Sigma$)+


    The production S $\rightarrow$ $\epsilon$ is also allowed if S is the start symbol
    and it does not appear on the right side of any production.


    CSG is a noncontracting grammar. The language generated by the context sensitive
    grammar is called context sensitive language. If G is a context sensitive grammar,
    then L(G) = {w | (w $\in \Sigma$ *) $\land$ (S $\Rightarrow$+G w)}.


    ```

    S -> aTblab

    aT -> aaTblac

    L(G) = {ab} U {a^rcb^n|ln > 0}

    ```


    This language is also context free.'
