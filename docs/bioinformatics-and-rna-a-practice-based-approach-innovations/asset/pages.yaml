- pgno: 119
  md: 'rules may contain a combination of terminals and non-terminals but the left-hand
    side will not include a null or empty symbol.


    In Type 1 grammar or context sensitive grammar, the left-hand side and right-hand
    side of the production rule belongs to { VUT }+ but there is a further restriction.


    The length of the left-hand side is less than or equal to the right-hand side
    i.e.


    |A| < |B| or |A| = |B|


    This is why these grammars are also called non-contracting grammars.


    The most common form of grammar is Type 2 grammar or context free grammar. In
    this grammar, the right-hand side can be any combination of terminals and non-terminals
    but the left-hand side contains a single non-terminal i.e. B ∈ { VUT }* but A
    ∈ { V }.


    A grammar is a regular grammar if it is a left linear grammar or right linear
    grammar but not both. A left linear grammar is the one whose derivation tree is
    right skewed. Similarly, a right linear grammar is the one whose derivation tree
    is left skewed. A middle-linear grammar is not regular. If grammar is regular
    it is also linear, but the reverse is not true. For example, A → aA | a produces
    a right skewed tree, and A → Aa | a produces a left skewed tree. Similarly, A
    → aAb | a produces a tree that grows in the middle.


    As restrictions on grammar increases from Type 0 to TYPE 3, their corresponding
    languages become simple from Type 0 to Type 3. In other words, the more complicated
    the grammar, the least complicated is its corresponding language.


    # 7.2 CONTEXT FREE GRAMMAR


    The class of context free languages generalizes over the class of regular languages,
    i.e. every regular language is a context free language.


    The reverse of this is not true, i.e. every context free language is not necessarily
    regular. For example, as we will see {0^k 1^k | k >= 0}, is context free but not
    regular.


    Formally, a Context Free Grammar (CFG) is a 4-tuple:


    |A| < |B| or |A| = |B|


    +   V – A finite set of variables or non-terminals


    +   T or Σ – A finite set of terminals (V and T do not intersect).


    +   P – A finite set of productions, each of the form A → α, where A is in V and
    α is in (V ∪ T)*


    +   Note that α may be ε


    +   S – A starting non-terminal (S is in V)


    **Example CFG:**


    G = ({A, B, C, S}, {a, b, c}, P, S)'
