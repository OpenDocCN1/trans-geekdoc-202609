  md: '# 4 RNA


    Biologically, living organisms must follow certain rules, regulations and guidelines
    such that the living cell are functioning properly. This very information is carried
    out by RNA, which stands for ribonucleic acid. It is a universal fact that proteins
    are building blocks of life. Without the above-mentioned information, by being
    transferred properly from nucleus to ribosomes, production of accurate proteins
    is impossible. This very fact conveys the importance of RNA. Underproduction,
    overproduction or faulty production of proteins leads to diseases.


    The structure of RNA is as follows: RNA is single-stranded molecule that folds
    upon itself to imitate a double helix structure of DNA (dexyribonucleic acid).
    The backbone of RNA contains ribose as a sugar with four bases: adenine, cytosine,
    guanine and uracil. Phosphate groups are also attached to ribose. The bases of
    RNA form base pairs in order to form secondary and tertiary structures. RNA may
    be synthesized from DNA. DNA (unlike RNA) has a double helix structure and stores
    the genetic code for long duration. Compared to DNA, RNA is more versatile. Apart
    from having a significant role in protein synthesis, RNA carries out bio-chemical
    reactions, gene regulation, methylation, etc. Also, RNA does not have a replicating
    capability like DNA. The life period of various types of RNA varies. Some of them
    have a long life and some get destroyed soon after their creation.


    # 4.1 STRUCTURE OF RNA


    RNA structure changes from primary structure to secondary structure and on to
    tertiary structure. All three types of structures are explained below.


    # 4.1.1 Primary Structure of RNA


    The primary structure of RNA is a sequence of nucleotides (A, G, C and U) that
    are linked together by phosphodiester bonds.

    RNA consists of nucleotides and a backbone. The backbone of RNA is made of a sugar
    phosphate. The RNA structure has three components: ribose (sugar), phosphate (PO4)
    and a nucleotide base. Figure 4.1 shows four bases of RNA, namely adenine, guanine,
    cytosine and uracil. Figure 4.2 elaborates the structures of the ribosome and
    phosphate. The chemical structure of RNA is shown in Figure 4.3.


    # 4.1.2 Secondary Structure of RNA


    The bases in a primary structure of RNA form base pairs to conceive a secondary
    structure. The secondary structure of RNA is characterized with Watson-Crick base
    pairs (GC or AU) and Wobble base pairs (G-U). GU and AU pairs have two'
