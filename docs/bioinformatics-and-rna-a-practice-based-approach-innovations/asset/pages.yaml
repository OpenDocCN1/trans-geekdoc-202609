  md: '# Glossary


    **Bioinformatics:** Bioinformatics is conceptualizing biology in terms of macro-molecules
    (in the sense of physical-chemistry) and then applying “informatics” techniques
    to understand and organize the information associated with these molecules, on
    a large scale.


    **Coaxial Stacking of Stems:** Long duplexes of RNA stack upon each other to form
    a long chain.


    **Computational Biology:** Computational biology involves writing algorithms and
    code for developing those tools that are to be used by bioinformaticists.


    **Epigenetics:** Studies of hereditary marks in chromatin (histones, DNA)


    **Gene Expression:** Foundation of all the chemical reactions in our body


    **Gene Silencing:** The process of prevention of the gene expression process during
    translation or transcription process is called gene silencing.


    **Genetic variation:** Studies of genome variations


    **Genomics:** Studies of genomes and functional and regulatory elements


    **Helix:** A helix is formed by stacking base pairs.


    **H-type Pseudoknot:** The most common type of pseudoknot is the H-type pseudoknot.


    **Metabolomics:** Studies of metabolites in cells, tissues, and body fluids


    **Non-coding RNA (ncRNA):** These are functional molecules of RNA that do not
    encode into protein.


    **Nutrigenetics:** Nutrigenetics can be defined as nutrition and inheritance studies.


    **Phylogenetics:** Phylogenetics is a science of studying biological relationships
    between organisms that have emerged from a common ancestor over a period of time.


    **Proteomics:** Studies of proteins, including their structure


    **Pseudoknot:** Important motif in RNA secondary structure


    **RNA Interference:** The mechanism of RNA Interference (RNAi) involves treating
    the disease-causing gene with a specific small interfering RNA (siRNA) that targets
    the specific messenger RNA (mRNA).


    **Sequence Alignment:** Sequence alignment is the process of placing two or more
    sequences one over the other such that regions of maximum similarity can be located.


    **Snurps:** Conserved RNA-protein complexes


    **Species:** Species is defined as a set of similar organisms.


    **Systems Biology:** Holistic analysis of cellular biochemical interaction networks


    **Toxicogenomics:** Toxicogenomics is the field of science that deals with the
    collection, interpretation and storage of information about gene and protein activities
    within a particular cell or tissue of an organism and response to toxic substances.


    **Transcriptomics:** Studies of transcripts, including non-coding RNA and microRNA'
