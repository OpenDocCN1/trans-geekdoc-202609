    # 5.4.1 H-TYPE PSEUDOKNOT


    The most common type of pseudoknot is an H-type pseudoknot, shown in Figure 5.16.
    An H-type pseudoknot is an extension of a hairpin structure of RNA. The hairpin
    structure forms base pairs with unpaired bases of leftover strands, thereby forming
    crossings of base pairs. PseudoBase++ [11], an extension to PseudoBase, contains
    236 H-type pseudoknots.


    # 5.4.2 H-H TYPE PSEUDOKNOT


    An H-H type of pseudoknot includes base pairing between two hairpin loops, as
    shown in Figure 5.17. PseudoBase contains one sequence with an H-H type pseudoknot.


    # 5.4.3 H-L TYPE PSEUDOKNOT


    An H-L type of pseudoknot is formed when base pairing occurs between a hairpin
    loop and a single-stranded part of a bulge loop or an internal or multiple loop.
    An H-L type of pseudoknot occurs in two forms: H-Lout type pseudoknot and H-Lin
    type pseudoknot. PseudoBase has twenty-four sequences that contain an H-Lout type
    of pseudoknot and eleven sequences that contain an H-Lin type of pseudoknot.


    # 5.4.3.1 H-Lout Type Pseudoknot


    An H-Lout type of pseudoknot is shown in Figure 5.18 and is formed when base pairing
    occurs between a hairpin loop and an internal loop or multiple internal loops.


    # 5.4.3.2 H-Lin Type Pseudoknot


    An H-Lin-type of pseudoknot, as shown in Figure 5.19, is formed when base pairing
    occurs between a hairpin loop and an external loop or multiple external loops.'
