    # 1.5.2 Proteomics


    The term *proteome* was coined in 1994 by Marc Williams. A collection of proteins
    in a cell is referred to as a proteome; the qualitative and quantitative study
    of proteomes of cellular organisms is proteomics.


    Specifically, proteomics can answer the following:


    +   - Identification of the structure of proteins

    +   - Protein function

    +   - Protein expression

    +   - Protein post-translational modification

    +   - Protein-protein interaction

    +   - Protein localization


    The protein-to-protein interaction is termed *proteomics*; in other words, the
    study of large sets of protein sequences is called proteomics.


    There are more than 25,000 genes within the human genome. Each gene can produce
    more than one protein product. The total number of proteins in the human proteome
    is estimated to be more than one million.


    The goal of proteomics is to study the dynamic protein product of genomes and
    their interactions. It leads to understanding cells, which are the units of life.
    Proteomics deals with the study of the interaction of RNA, DNA and proteins.'
  merge: -1
  img_proc: true
