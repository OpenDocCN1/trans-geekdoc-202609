    # 8.4.4 WHY ARE BIOLOGICAL WEAPONS OR BIOTERRORISM AGENTS SO DISRUPTIVE?


    Biological weapons or bioterrorism agents are termed as very disruptive because
    of the following reasons:


    +   • They can easily cause and transmit the infection.

    +   • Their life expectancy is high.

    +   • Capacity spreading is strong.

    +   • If warehoused, they will be stable.

    +   • They are resilient to environmental conditions.

    +   • They are difficult to trace.

    +   • They are unseen and microscopic.


    # 8.4.5 EFFECTS OF BIOLOGICAL ATTACK


    The consequences of biological attacks are very dangerous. According to the World
    Health Organization:


    +   • Release of 50 kg of Anthrax spores in a 40 km² area will cause 1 lac death
    in individuals.

    +   • Release of 50 kg of plague spores in a 20 km² area will cause 36,000 people
    to die.'
