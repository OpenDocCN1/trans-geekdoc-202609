    # 8.2.1 PROSPECTS AND APPLICATIONS OF NUTRIGENOMICS


    The word “nutrigenomics” was developed to determine the relationship between genes
    and nutrients. There is a lot of optimism that the new “omics” techniques will
    lead to a more comprehensive understanding of the impact on gene expression and
    cell biology of bioactive compounds in foods, such as components in fruits, vegetables
    and milk. New synergisms can be revealed between different bioactive components.
    The techniques can be used to research the impact of dietary ingredients on gene
    expression in blood leukocytes and other cells in human meal studies or intervention
    studies. This can also contribute to the development of new biomarkers to be used
    for dietary impact assessment. Also, for the assessment of the effectiveness of
    therapeutic diets in patients with particular diseases, certain approaches may
    be relevant in clinical nutrition. Detailed research on selected target genes
    would be required following the hunt for affected genes.


    In practice, the application of nutrigenomics uses several “omics” techniques
    in various disciplines, including genomics, epigenomics, transcriptomics, proteomics
    and metabolomics, to examine animal cellular and molecular responses to different
    dietary nutrients in an independent or integrated way, revealing the global effect
    of nutrients on animal genomes, methylomes/epigenomes, transcriptomes, proteomes
    and metabolomes, respectively [91].


    # 8.3 TOXICOGENOMICS


    Toxicogenomics is the field of science that deals with the collection, interpretation
    and storage of information about gene and protein activity within a particular
    cell or tissue of an organism and response to toxic substances. Toxicogenomics
    combines toxicology with genomics. It is a subdiscipline of pharmacogenomics.
    Various environmental exposures, age, organics and individual susceptibility are
    the factors related to toxicogenomics that are responsible for human diseases.
    It deals with how a genome responds to environmental stressors and toxicants.


    Toxicogenomics include studies of the cellular products controlled by the genome
    (messenger RNAs, proteins, metabolites, etc.). RNA, proteins and intermediary
    metabolites (Figure 8.2) have been termed “-omic” technologies, based on their
    ability to characterize all, or most, members of a family of molecules in a single
    analysis. The powerful methods used for such analysis are gene expression, microRNA
    network, etc. These advances present exciting opportunities for improved methods
    of identifying and evaluating potential human and environmental toxicants, and
    of monitoring the effects of exposures to these toxicants. It has been anticipated
    that these new technologies will (1) lead to new families of biomarkers that permit
    characterization and efficient monitoring of cellular perturbations, (2) provide
    an increased understanding of the influence of genetic variation on'
