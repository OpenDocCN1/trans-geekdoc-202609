  md: '# 2 Computational Biology


    A few researchers use the terms _bioinformatics_ and _computational biology_ interchangeably.
    But these terms are actually different. Bioinformatics more often is related to
    a biology background. It deals with solving biological problems with the help
    of available tools. On the other hand, computational biologists tend to write
    algorithms and code for developing those tools that are to be used by bioinformaticists.
    In other words, computational biologists are more computer professionals than
    bioinformaticists.


    In the previous chapter, we have learnt that there are three types of sequences:


    +   - RNA sequence

    +   - DNA sequence

    +   - Protein sequence


    In this chapter, we will learn about alignment of these sequences.


    # ## 2.1 SEQUENCE ALIGNMENT


    Sequence alignment is the process of placing two or more sequences one over the
    other such that regions of maximum similarity can be located, as shown below.


    | H | E | L | L | O | (Sequence 1) |

    |---|---|---|---|---|---|

    | H | E | L | P | — | (Sequence 2) |

    | ✓ | ✓ | ✓ | ✗ | o | |


    Sequence 1 has five letters and sequence 2 has four letters. A checkmark (✓) signifies
    a match of letter. A cross (✗) signifies a mismatch and a circle (O) signifies
    a gap. To summarize, we can say there can be three outcomes of similarity search.


    +   1. Match

    +   2. Mismatch

    +   3. Gap


    Another important aspect of sequence alignment is to discover regions of maximum
    similarity, as shown in the examples below.


    | U | C | A | U | G | (Sequence 1) |

    |---|---|---|---|---|---|

    | C | A | U | U | G | (Sequence 2) |'
  merge: -1
