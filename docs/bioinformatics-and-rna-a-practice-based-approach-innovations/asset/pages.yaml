  md: '# # 1 Introduction to Bioinformatics


    # ## 1 INTRODUCTION TO BIOINFORMATICS


    The term bioinformatics is a combination of “bio” + “informatics”. Here “Bio”
    stands for biology and “Informatics” related to information technology. Bioinformatics
    means informatics techniques are applied to biological problems for finding solutions.
    The term bioinformatics was coined in 1970 by a Dutch Article. Various researchers
    have defined bioinformatics as


    ... the study of how information is represented and analyzed in biological systems,
    information derived at molecular level [1].


    Bioinformatics is conceptualizing biology in terms of macromolecules (in the sense
    of physical-chemistry) and then applying "informatics" techniques (derived from
    disciplines such as applied maths, computer science, and statistics) to understand
    and organize the information associated with these molecules, on a large-scale
    [2].


    Bioinformatics has also been stated as a marriage between computer science and
    molecular biology. Bioinformatics is an inter-disciplinary area of research that
    integrates biology with information technology, mathematics, statistics, physics
    and chemistry, as shown in Figure 1.1.


    Today is the era of big data. A large number of bioinformatics projects subsist
    today to handle bioinformatics’ big data. The first project of bioinformatics
    was the Human Genome Project in 1990. The goal of this project was sequencing
    and annotation of the human genome. Another project, the Celera Genome Project,
    started in 1998. This project worked on the yeast genome. With the successful
    completion of these projects, several other projects were initiated; precisely,
    in 2001, the HapMap Project began.


    For carrying out such projects, the need to create, store and communicate huge
    databases arose. Moreover, biological data was needed in computer-readable form.
    Consequently, databases like GenBank [3], Ensembl [4], PubMed, M5NR [5], SWISS-PROT
    [6], OMIM [7], PDB [8], KEGG [9], etc. were coined. Today, large numbers of projects
    exist for bioinformatics because of the increasing number of researchers in the
    field of bioinformatics, the explosion of biological data and the increase in
    the number of funding agencies for projects. There are a number of ongoing projects
    in various bioinformatics areas like sequence analysis, genomics, structural bioinformatics
    and computational evolutionary biology. These areas have been illustrated in Figure
    1.2.'
  merge: -1
  img_proc: true
