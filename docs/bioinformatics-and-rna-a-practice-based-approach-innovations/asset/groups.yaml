    | b | 7 | - | - | - | - |

    | c | 5 | 3 | - | - | - |

    | d | 10 | 8 | 8 | - | - |

    | e | 8 | 5 | 15 | 7 | - |


    表3.2

    UPGMA示例：节点/簇之间的更新距离（步骤2）


    | | a | bc | d | e |

    |---|---|---|---|---|

    | a | - | - | - | - |

    | bc | 6 | - | - | - |

