    ## Preface


    The book aims to take the reader on a technological voyage of explosively growing
    new discipline – bioinformatics. After covering the most important topic of this
    area i.e. alignment, this book further covers phylogenetics. Also, it shelters
    the less explored topics such as pseudoknot grammar and its types. The book also
    highlights computational techniques used in bioinformatics to solve various problems.
    Lastly, it introduces the grey areas of bioinformatics. This book also contains
    implementation of few important algorithms in Dot Net framework with code.


    ## ORGANIZATION OF THE BOOK


    The book is organized so as to include related rudiments and applications of bioinformatics
    in various areas. The book comprises eight chapters. A brief description of each
    chapter of this book is as follows.


    ## INTRODUCTION TO BIOINFORMATICS


    Chapter 1 first describes the term bioinformatics, followed by a debate on the
    relevance of bioinformatics and its areas. The building blocks of human life,
    DNA, RNA and protein, are further addressed. Finally, the issue of protein folding,
    genomics and proteomics is discussed. Elaboration of the central dogma of molecular
    biology is also done.


    ## COMPUTATIONAL BIOLOGY


    Chapter 2 focuses on a very significant aspect of bioinformatics, i.e. the alignment
    of sequences. Pictorial representations are created step by step in the process
    of performing global sequence alignment and local sequence alignment. Additionally,
    multiple sequence alignment is also discussed.


    ## PHYLOGENETICS


    Chapter 3 elaborates on phylogenetics as a science of studying biological relationships
    between organisms. Further, molecular phylogenetics is explained. The latter half
    of this chapter focuses on phylogenetic tree construction. Using distance matrix
    methods and character-based methods, the step-by-step process for phylogenetic
    tree construction is explained.


    ## RNA


    Chapter 4 introduces RNA as one of life''s most important building blocks, with
    DNA and protein being the others. RNA is the most versatile agent among these
    molecules. Various RNA types have been discussed, such as rRNA, tRNA, snRNA, mRNA,
    etc. Lastly, RNA features are discussed at length.


    ## PSEUDOKNOT


    Chapter 5 introduces pseudoknot as an important motif in RNA secondary structure.
    As pseudoknot is not a real knot, real pictures have been shown to differentiate
    between them. Various example structures of pseudoknots are shown and various
    representations of pseudoknots are discussed. Finally, all types of pseudoknots
    are shown with structures.


    ## PSEUDOKNOT PREDICTION TECHNIQUES


    Chapter 6 presents, categorizes and contrasts current prediction models for pseudoknot.
    These models are divided into six classifications: dynamic programming, comparative
    approach, heuristic approach, formal grammar, inverse folding, integer programming
    and inverse folding technique models. The pros and cons of these approaches are
    discussed.


    ## PSEUDOKNOT GRAMMAR


    Chapter 7 begins with an introduction to the Chomsky hierarchy of formal grammars,
    accompanied by a discussion of the relation between these grammars. The correlation
    of RNA secondary structure and context free grammar is shown. Recently, formal
    grammar techniques are used to predict pseudoknots. Various types of grammar are
    further discussed: Parallel Communicating Grammar System, Pair Stochastic Tree
    Adjoining Grammar, Context Free Grammar, Multiple Context Free Grammar, Context
    Sensitive Grammar, Tree Augmented Grammar and Path Controlled Grammar.


    ## NEW AREAS OF BIOINFORMATICS


    Chapter 8 illuminates the latest and evolving fields of bioinformatics. Drug target
    identification and identification of target are discussed. Further, nutrigenomics
    and toxicogenomics are seen as important areas in bioinformatics that have a significant
    effect on human health. Finally, bioterrorism is deliberated, which is the hottest
    topic of today because of the current global pandemic SARS-COVID-19.


