    canonization rules of [26] to reduce search space thereby lowering the space and
    time complexity. This heuristic model focused on kissing hairpin pseudoknots and
    is implemented in algebraic dynamic programming. This model was further improved
    [68]. Shape analysis and probabilities have been added to improve the prediction
