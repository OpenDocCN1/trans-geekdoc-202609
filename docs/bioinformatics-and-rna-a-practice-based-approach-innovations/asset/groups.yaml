    \ form A → α, where A is in V and α is in (V ∪ T)*\n  - Note that α may be ε\n\
    - S – A starting non-terminal (S is in V)\n\n**Example CFG:**\n\nG = ({A, B, C,\
    \ S}, {a, b, c}, P, S)\n\n- P:\n  - 1. S -> ABC\n  - 2. A -> a\n  - 3. A -> ε\n\
    \  - 4. B -> bB\n  - 5. B -> ε\n  - 6. C -> c\n  - 7. C -> ε\n\n# Example Derivations:\n\
    \n```\nS => ABC\n=> BC\n=> C\n=> ε\n```\n\n```\nS => ABC\n=> aaABC\n=> aaABC\n\
    => aaBC\n=> aabBC\n=> aabC\n=> abcC\n=> abc\n```\n\nContext Free Grammar (CFG)\
    \ has been in focus for an RNA secondary structure prediction including pseudoknots.\
    \ A pattern matching technique using stochastic context free grammar was proposed\
    \ by [82]. Probabilities are assigned to rules of the said CFG model to convert\
    \ it to a stochastic context free model. Probabilities are calculated by extending\
    \ the covariance model. Emission and transmission probabilities have been assigned\
    \ to grammar rules. Multiple sequence alignment is used to find probable motifs\
    \ of RNA. Their concept divides the secondary structure into various substructures\
    \ which they call related residues and nonrelated residues. As the simultaneous\
