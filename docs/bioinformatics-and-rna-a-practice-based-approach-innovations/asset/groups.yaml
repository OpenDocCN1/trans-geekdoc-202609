    FIGURE 4.1 Four Bases of RNA – Adenine, Guanine, Cytosine and Uracil


    ![](img/4cb83489753bba67a16c119dae990237_76_1.png)


    FIGURE 4.2 (a) Ribosome; (b) Phosphate


    ![](img/4cb83489753bba67a16c119dae990237_76_2.png)


    FIGURE 4.3 RNA Chemical Structure


    ![](img/4cb83489753bba67a16c119dae990237_77_0.png)


    FIGURE 4.4 (a) GC Pair; (b) AU Pair


    hydrogen bonds. The GC pair has three hydrogen bonds. The GC base-pair structure
    and AU base-pair structure are shown in Figure 4.4(a) and (b), respectively. Apart
    from these common base pairs, RNA can even have AC, UU and GA base pairs.


    The secondary structures of RNA form specific structures like a hairpin loop,
    bulge loop, internal loop, exterior loop, pseudoknot, etc., as shown in Figure
    4.5. Each structure has its own characteristics and importance.


    - Helix – A helix is formed by stacking base pairs. A hairpin loop is shaped when
    at least three unpaired nucleotides exist in a helix. RNA forms a double helical
    structure by folding upon itself.

    - Bulge Loop – An unpaired nucleotide on either side of a helix is called a bulge
    loop. It can be termed an asymmetrical structure.


    ![](img/4cb83489753bba67a16c119dae990237_77_1.png)


    FIGURE 4.5 RNA Secondary Structure Motifs


    - Internal Loop – Unpaired nucleotides on both sides of the helix lead to formation
    of an internal loop. It can be termed a symmetrical structure.

    - Exterior Loop – An exterior loop contains the end of the sequence.

    - Multi-branch Loop – A multi-branch loop or junction loop is formed when various
    structures emerge from a helix.

    - Pseudoknot – A pseudoknot is a special structure that originates when the above-mentioned
    structures form base pairs with leftover unpaired bases.


    ## 4.1.3 TERTIARY STRUCTURE OF RNA


    A secondary structure can form base pairs in order to form a tertiary structure.
    Some of the unpaired bases in a secondary structure of RNA further form base pairs,
    resulting in a tertiary structure. A tertiary structure of RNA is common in tRNA.


    - Coaxial Stacking of Stems – Long duplexes of RNA stack upon each other to form
    a long chain. As the length of the chain increases, the chances of forming tertiary
    interactions also increase.

    - Tetraloop Receptor Motif – A common tetra loop nucleotide sequence is GAAA.
    And then there may be a corresponding receptor, for example CCUAAGUAUGG. A tetraloop
    receptor is shown in Figure 4.6.


    ## 4.2 TYPES OF RNA


    RNA has been categorized into three categories according to their nature, function
    and structure; namely, rRNA, tRNA and mRNA. They play a major role in the


    ![](img/4cb83489753bba67a16c119dae990237_78_0.png)


    FIGURE 4.6 Tetraloop Receptor Motif


    ![](img/4cb83489753bba67a16c119dae990237_79_0.png)


    protein assembly process. Apart from these, other types of RNA do exist, with
    significant roles, as discussed below.


    - A. Ribosomal RNA (rRNA): One of the RNA components of the ribosomes and necessary
    for protein synthesis. Due to critical functions of rRNA, protein synthesis occurs.
    A ribosome exists in all organisms and helps translate the information in mRNA
    (messenger RNA) into a protein. Ribosomes have 60% of rRNA approximately. An rRNA
    structure is represented in Figure 4.7.

    - B. Transfer RNA (tRNA): Transfer RNA acts as a physical connection between the
    DNA and RNA sequence of nucleic acids and protein sequence of amino acid. It helps
    in decoding mRNA (messenger RNA). tRNA is an important component of protein translation
    and contains 75 to 95 nucleotides. A tRNA structure is represented in Figure 4.8.

    - C. Messenger RNA (mRNA): mRNA is responsible for the transfer of genetic information
    from DNA to the ribosome and is the biggest family of RNA molecules. mRNA was
    discovered by two scientists, Elliot Volkin and Lazarus Astrachan, in 1956. DNA
    is copied into mRNA and then decoded into


    ![](img/4cb83489753bba67a16c119dae990237_79_1.png)


    ![](img/4cb83489753bba67a16c119dae990237_80_0.png)


    FIGURE 4.9 mRNA


    proteins. One molecule of mRNA is needed to encode the information of one protein
    but for bacteria more than one protein''s information can be encoded into one
    molecule of mRNA. An mRNA structure is represented in Figure 4.9.

    - D. Non-coding RNA (ncRNA): These are functional molecules of RNA that do not
    encode into protein. However, non-coding RNA contains crucial information and
    has several functions. One of the functions of ncRNA is to regulate the gene expression
    at the transcription level.

    - E. Transfer-messenger RNA (tmRNA): These are the RNA molecules that have similar
    properties like both tRNA and mRNA. Mostly bacteria produce single tmRNA; however,
    a few permuted tmRNA encode a two-piece tmRNA. It works like a quality control
    system that monitors the protein synthesis.

    - F. Small-nuclear RNA (snRNA): These are small RNA molecules and are involved
    in splicing or other reactions of RNA. The approximate length of snRNA is 150
    nucleotides. Complexes of snRNA are also known as snRNP (small nuclear ribonucleoproteins),
    generally called “snurps”.

    - G. MicroRNA (miRNA): MicroRNA also comes from a family of non-coding RNA. It
    plays an important role in regulation of gene expression and RNA silencing. These
    are single-stranded RNA molecules and are very short in length, only twenty-two
    nucleotides, approximately. Both animals and plants have MicroRNA.

    - H. Small interfering RNA (siRNA): Small interfering RNA is also known as silencing
    RNA or short interfering RNA. siRNA is formed from a double-stranded RNA molecular
    sequence of 20 to 25 base pairs. siRNAs is used for knockdown of long noncoding
    RNAs genes.

    - I. Small nucleolar RNA (snoRNA): These are a special category of small RNA molecules
    that signify the chemical changes of other RNAs, mainly ribosomal RNA, transfer
    RNA and snRNA small nuclear RNAs. It is also proposed that these came from the
    evolution in gene duplication of transfer RNA (tRNA).

    - J. Antisense RNA (asRNA): These are single-stranded RNA, complementary to messenger
    RNA. asRNA is sometimes referred to as mRNA-interfering complementary (micRNA)
    but micRNA is not so popular and not adopted widely. “Sense” is a nucleotide sequence
    and also results in a protein (a gene product).

    - K. Signal recognition particle RNA (SRP RNA): SRP is a RNP (ubiquitous complex
    that results in secretory proteins and membrane. These are required for co-translational
    protein targeting. The common family known as Alu

    - L. hnRNA (heterogeneous nuclear RNA): Transcription, as described in an earlier
    chapter, is the process of conception of mRNA from DNA. But this is not actually
    a one-step process. The intermediate step is conception of pre-mRNA or hnRNA.
    In other words, it is the first copy of DNA. All introns from hnRNA are removed
    before completion of the process of transcription. This process is called splicing.
    hnRNA is a short-lived RNA.

    - M. Catalytic RNA or ribozymes: Catalytic RNA catalyzes chemical reactions in
    the absence of protein. Self-splicing introns are also catalytic RNA. Ribozymes
    include peptidyl transferase, hammerhead, spliceosome and hepatitis delta virus
    (HDV).

    - N. Telomerase RNA: Telomerase RNA molecule is the one that facilitates the addition
    of a specific set of nucleotides to the 3’ end of the duplicating strand for maintaining
    the telomere end such that the chromosome doesn’t fuse with other chromosomes.
    RNA telomerase is important for the stability of genomes.

    - O. gRNA (guide RNA): During the process of RNA editing, gRNA is used for insertion
    and deletion of nucleotides in mRNA.


    ## 4.3 FUNCTIONS OF RNA


    Various functions of RNA are discussed below:


    - 1. The central dogma of molecular biology suggests that progression of information
    within a cell is from DNA to proteins.

    - 2. The human body needs proteins for a number of functions. The processes of
    transcription and translation lead to synthesis of proteins. RNA plays a vital
    role in both of these processes.

    - 3. RNA allows the cell to create amino acids that support gene expression.

    - 4. Through RNA, cells are able to access the information stored in DNA.

    - 5. RNA acts as an enzyme. An enzyme is a substance that speeds up reactions
    in our body. As RNA is single stranded, it can fold upon itself to change its
    shape. This is the reason why RNA can act as an enzyme and DNA, with a double
    strand, cannot.

    - 6. Literature reveals that in the early forms of life, RNA was present instead
    of DNA.

    - 7. DNA containing the important genetic information has to stay inside the nucleus
    only. It may be damaged if it moves out, so a copy of part of the DNA is created
    in the form of mRNA.

    - 8. RNA is prone to alkaline hydrolysis. On passing an alkaline solution, RNA
    can be degraded without affecting DNA.

    - 9. It is well known that DNA contains hereditary information, but some viruses
    do not contain DNA. In such cases, RNA holds the genetic information.

    - 10. RNA can function as a catalyst of biochemical reactions, an adapter molecule
    in protein synthesis, and a structural molecule in cellular organelles.

