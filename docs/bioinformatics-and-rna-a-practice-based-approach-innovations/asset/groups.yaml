  mdcn: "\n\n![](img/4cb83489753bba67a16c119dae990237_12_0.png)\n\n图 1.1 生物信息学：一个跨学科领域\n\
    \n## 1.1 生物信息学的重要性\n\n生物信息学无处不在，从疾病检测到疾病预防和治愈，从微生物研究到地球上所有生命的研究，再从序列比对到基因表达。\n\
    \n以下是生物信息学的重要领域和应用：\n\n- 疾病早期检测\n- 通过RNA干扰疗法诊断和治愈疾病\n- 发现生物体系中未被揭示的事实\n- 处理大规模生物学数据的工具\n\
    - 地球上所有生命的系统发育研究\n\n![](img/4cb83489753bba67a16c119dae990237_13_0.png)\n\n图 1.2\
    \ 生物信息学领域\n\n- 分子结构预测\n- 序列比对\n- 基因组功能和结构分析\n- 作物杂交\n- 蛋白质的表达、相互作用和生产\n- 用于医学和法医学的DNA测序\n\
    - 包括制药和微生物工业在内的生物技术的不同方面\n- 通过基因的低表达和过表达控制疾病\n- 通过预防医学研究一个人对各种疾病的易感性\n- 通过药物基因组学研究个体对人体的反应\n\
    - 分离使微生物能够生存的基因\n\n## 1.2 DNA、RNA和蛋白质序列\n\n生物信息学的大厦建立在DNA、RNA和蛋白质的基础之上。这三者是生命的基本构建块。\n\
    \n生物体拥有细胞，细胞相互沟通和相互作用以形成组织、器官和生物体。细胞由膜、蛋白质、碳水化合物、维生素和核酸组成。许多细胞形成组织。大量组织形成器官，器官构成整个生物体。\n\
    \n细胞部分的组装需要包含在脱氧核糖核酸（DNA）中的额外信息。组装完成后，身体的完整功能由蛋白质负责。DNA通过RNA（核糖核酸）作为中间体转化为蛋白质。\n\
    \n### 1.2.1 DNA\n\nDNA存在于细胞核内。它是制造蛋白质的“食谱”。它携带细胞的所有遗传信息。DNA的特点如下：\n\n- 它是一种核酸，编码构建细胞所需的信息。\n\
    - 它包含可从一代传到另一代的遗传信息。例如，孩子眼睛等位基因的颜色与母亲眼睛的颜色相同。\n- 它存储和维护细胞信息，并将其从一代传给下一代。\n- 它是蛋白质合成的“食谱”。\n\
    - DNA是一种稳定的分子。\n- 每个细胞中存在一份DNA副本。\n- DNA在细胞分裂时自我复制。\n- DNA结构\n  - DNA是双螺旋结构，如图1.3所示。\n\
    \  - 它包含四个碱基，即A代表腺嘌呤；G代表鸟嘌呤；C代表胞嘧啶；T代表胸腺嘧啶。\n\n![](img/4cb83489753bba67a16c119dae990237_15_0.png)\n\
    \n图 1.3 (a) DNA结构；(b) RNA结构\n\n### 1.2.2 RNA\n\nDNA在转化为蛋白质之前先转化为RNA。RNA是另一种与DNA在某些方面相似的核酸。\n\
    \nRNA的特点如下：\n\n- RNA协助DNA合成特定蛋白质。\n- RNA位于细胞核、细胞质或核糖体中，即细胞核内部和外部。\n- RNA是一种不稳定的分子。\n\
    - 每个细胞中存在多份RNA副本。\n- RNA有多种类型，即mRNA、tRNA、rRNA、snRNA、siRNA、miRNA、asRNA\n- RNA结构\n\
    \  - RNA是单链结构，如图1.3所示。\n  - 它包含四个碱基，即A代表腺嘌呤；G代表鸟嘌呤；C代表胞嘧啶；U代表尿嘧啶（与DNA中的胸腺嘧啶相反）。\n\
    \  - RNA结构有四个层次——初级结构、二级结构、三级结构和四级结构。\n\n## 1.2.3 蛋白质\n\n蛋白质是生命的基本构建块。蛋白质就是“我们”。我们的身体依赖蛋白质来发挥功能。蛋白质有三种类型：\n\
    \n- 纤维蛋白质——这些蛋白质构成肌肉纤维、结缔组织和骨骼。例如——角蛋白、肌动蛋白、肌球蛋白、胶原蛋白等。\n- 球形蛋白质——这些蛋白质执行运输、催化和调节等功能。例如——血红蛋白、球蛋白、凝血酶等。\n\
    - 膜蛋白质——这些蛋白质具有连接细胞、受体蛋白质和运输分子等多种作用。例如——组蛋白、葡萄糖转运蛋白等。\n\n它们由二十种氨基酸组成，通过称为肽键的键连接在一起。我们体内氨基酸的来源是饮食。少数氨基酸包括丙氨酸、赖氨酸、谷氨酰胺、苏氨酸和天冬氨酸。蛋白质结构有四个层次——初级结构、二级结构、三级结构和四级结构。初级结构或初级序列（图1.4）由成千上万个氨基酸的序列形成。在此序列折叠之前，它被称为\
    \ _初级序列_。当这个氨基酸序列折叠并通过氢键连接氨基酸时，所得结构称为蛋白质的二级结构。\n\n![](img/4cb83489753bba67a16c119dae990237_16_0.png)\n\
    \n图 1.4 蛋白质初级序列\n\n二级结构进一步以两种形式存在——α-螺旋结构和β-折叠片状结构，如图1.5所示。\n\n![](img/4cb83489753bba67a16c119dae990237_16_1.png)\n\
    \n图 1.5 蛋白质二级结构：(a) α-螺旋蛋白质结构；(b) 蛋白质的β-折叠片状结构\n\n此外，二级结构自行折叠以形成三级蛋白质结构，即α-螺旋和β-折叠片状结构之间的键合。这是一种三维结构，如图1.6(a)所示。当两条或多条氨基酸链键合在一起形成结构时，就会形成四级蛋白质结构。氨基酸链也称为多肽链。蛋白质的四级结构如图1.6(b)所示。\n\
    \n蛋白质的功能如下：\n\n- 运输——血红蛋白在体内运输氧气。\n- 结构成分——角蛋白为我们的皮肤和指甲形成结构。\n- 激素——受体蛋白质接收信号并将其传递给其他蛋白质。\n\
    \n![](img/4cb83489753bba67a16c119dae990237_17_0.png)\n\n图 1.6 (a) 蛋白质三级结构；(b)\
    \ 蛋白质四级结构\n\n- 收缩结构——我们肌肉中的这些蛋白质导致身体运动；例如，肌动蛋白和肌球蛋白。\n- 抗体蛋白质保护我们免受致病病毒的侵害。\n\
    - 酶——这些蛋白质催化或加速各种生物化学反应。它们在细胞中随时处于活跃状态。\n\n## 1.3 分子生物学的中心法则\n\n分子生物学是关于RNA、DNA和蛋白质等分子的生物学，这些分子积极参与称为转录和翻译的过程。分子生物学的中心法则是指转录后随之进行翻译的集体过程，通常称为基因表达。基因表达过程是我们体内所有化学反应的基础。\n\
    \n该过程从DNA开始。如图1.7所示，双链DNA自我复制成两条单链DNA。然后这条单链DNA转化为mRNA（信使RNA）。这个过程称为转录。mRNA中的字母或碱基以三个为一组进行分组。这些组称为密码子。每个密码子对应一种特定的氨基酸。tRNA（转运RNA）翻译这些密码子，并将游离氨基酸转移到目标位点。密码子和氨基酸结合的目标位点在核糖体中进行。氨基酸序列形成多肽链，从而形成蛋白质。核糖体随后将蛋白质送入细胞。这些蛋白质是我们身体的基本构建块，并负责我们身体的所有功能。\n\
    \n## 1.4 蛋白质折叠问题\n\n蛋白质折叠问题是指通过分析氨基酸序列来预测蛋白质结构。换句话说，如果任何二十种氨基酸以某种特定方式序列在一起，我们应该能够判断这条多肽链或氨基酸序列将如何折叠，以及最终形成的蛋白质是什么。\n\
    \n此外，多肽链可能会经历两个疏远相关但最终由于大规模折叠而靠近的成对之间的相互作用\n\n"
