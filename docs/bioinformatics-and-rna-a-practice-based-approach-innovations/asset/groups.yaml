    # 6.2 COMPARATIVE SEQUENCE ANALYSIS TECHNIQUE


    Comparative approach-based pseudoknot prediction models are based on the fact
    that structures conserved by evolution are more likely to be the functional form.
    Comparative approach-based pseudoknot prediction models require multiple aligned
    sequences as input. The sequence similarity should be such that they can be initially
    aligned. Also, they should be dissimilar enough so that conserved residues and
    covariant base pairs may be found. If the sequences are too different, comparison
    becomes difficult. So, it is important to understand which homologous sequences
    should be used. They have suggested a method to choose sequences for comparative
    analysis based on GC stability and GU intermediate state constraints. A comparative
    approach-based pseudoknot prediction can be applied to a biseccondary structure
    that is defined as a superposition of two disjoint secondary structures. The model
    Hxmatch [30] is based on alignment of sequences and it assigns score to base pairs
    on the basis of thermodynamic score and covariance score. Using the notation of
    biseccondary structure, it converts the structure to biseccondary structure by
    deleting the conflicting helices. This Maximum Weighted Matching procedure is
    repeated until all such helices are deleted. In order to perform well, this model
    requires accurate alignment with a high sequence covariation. It sometimes produces
    spurious pseudoknots, too. Another model of a probknot was proposed by [31]. Probknot
    is a model similar to a maximum weight matching concept. It uses base pairs of
    highest pair probabilities and the structures having a maximal sum of pairing
    probabilities are termed as maximum expected accuracy structures. These base-pair
    probabilities are predicted using a partition function that uses coaxial stacking.
    From base-pairing probabilities, maximum expected accuracy structures are formed.
    This model predicts many pseudoknots, but its percent of predicted pairs in known
    structures is low. Also, the partition function used does not explicitly handle
    pseudoknots. A comparative sequence analysis with homologous sequences produces
    better prediction accuracy. DotKnot-PW algorithm [58] uses two homologous sequences
    for prediction of an H-type pseudoknot. An H-type pseudoknot candidate is first
    produced using DotKnot [59], which is a single sequence prediction method. In
    order to reduce computational time, a pairwise base similarity score is calculated
    instead of a full structure alignment. Optimal structures have been output using
    a combined free energy and similarity score. Recently, a comparison of Ipknot
    [41], CCJ [52], Iterative HFold [53] and Hotknots [60], is given by [61]. They
    have compared the models on same energy parameters. They have shown that none
    of the models have achieved PPV and sensitivity values are more than 0.9.'
