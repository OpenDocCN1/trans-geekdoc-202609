    ## 5.2 BIOLOGICAL SIGNIFICANCE OF RNA PSEUDOKNOT


    A pseudoknot was first discovered in the turnip yellow mosaic virus in 1982 [10].
    Pseudoknots have many varied functions. One of the significant functions of a
    pseudoknot is frameshifting. It induces ribosomes into an alternative reading
    frame.


    ![](img/4cb83489753bba67a16c119dae990237_91_0.png)


    FIGURE 5.7 Pseudoknot – Mouse Mammary Tumor Virus (MMTV)


    ![](img/4cb83489753bba67a16c119dae990237_91_1.png)


    FIGURE 5.8 Pseudoknot – Hepatitis Delta Virus


    ![](img/4cb83489753bba67a16c119dae990237_92_0.png)


    FIGURE 5.9 Pseudoknot – Influenza A


    ![](img/4cb83489753bba67a16c119dae990237_92_1.png)


    FIGURE 5.10 Pseudoknot – PYVV


    Pseudoknots comprise functional domains within ribozymes, self-splicing introns,
    ribonucleoprotein complexes, viral genomes and many other biological systems.
    It is also required for the activity telomerase that plays an important role in
    aging. A pseudoknot has a fundamental role in re-coding when it is present with
    messenger RNA. It also plays regulatory roles in protein synthesis. Pseudoknots
    have been found in many RNA classes; for example, ribosomal RNA, mRNA, tmRNA,
    catalytic and self-splicing RNA, viral genomic RNA, telomerase, etc. A pseudoknot
    leads to translational control, maintains signals for replication and is also
    involved in catalytic activities. Pseudoknots in a viral RNA role have a crucial
    role in virus gene expression and genome replication.


