    # 6.3 HEURISTICS


    Heuristic pseudoknot prediction models are based on experimentation. These models
    are designed to reduce the computational time of approaches like dynamic programming.
    An earlier attempt in heuristic-based pseudoknot predictions was made by [62].
    This model (Kinefold) predicted pseudoknots by combining simple structural models
    and exact clustered stochastic (ECS) simulation. The ECS simulation uses a clustering
    technique to accelerate RNA folding stochastic simulations.


    Another heuristic model was proposed by [32]. Iterative Loop Matching (ILM) is
    a heuristic algorithm based on the Loop Matching (LM) algorithm. ILM is based
    on the combination of thermodynamic and comparative approach. It works on a single
    sequence. It takes as an input either an individual sequence or a sequence alignment.
    Pseudoknots are considered an interaction between two loop regions, so a number
    of iterations of LM algorithm are performed. The base pairs corresponding to secondary
    structure formed in a particular iteration are removed from the original sequence
    for the next iteration. During the iterations, only base pairs with the highest
    score are considered. A base-pair scoring matrix from sequence or sequence alignment
    is prepared by combining a covariance score and thermodynamic score. For individual
    sequences, the highest score calculation ignores covariance score. This heuristic
    algorithm also does not predict optimal structures. The algorithm is not too complex,
    works well on small sequences but is resource demanding. A number of models existed
    for predicting RNA pseudoknots, but it was soon realized that those models should
    be enhanced to predict occurring H-type pseudoknots. So, another model, HPknotter
    [63], was proposed combining some of the existing models, namely RNAMotif [64],
    pknots [22], Nupack [25] and pknotsRG [26]. The advantage of this combined model
    is its improved efficiency in predicting actual H-type pseudoknots by applying
    various filtering mechanisms from time to time in the prediction process.


    Another researcher proposed the heuristic model hotknots [33], which is an iterative
    procedure based on free energy minimization to predict an RNA secondary structure
    including pseudoknots. Hotknots were computed from an input sequence using a simple
    local alignment algorithm and then modified in order to keep the total length
    of hotknots from growing too large. A hotknot is defined as a stem structure composed
    of stacked pairs, bulge loops containing one unpaired base and interior loops
    with two (opposing) unpaired bases. A tree is made of a selected set of hotknots
    (good hotknots), each node of which having a set of hotknots is expanded into
    a secondary structure. In order to output a pseudoknot free secondary structure
