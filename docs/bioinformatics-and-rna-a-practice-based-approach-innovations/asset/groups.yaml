    generalized pseudoknots is NP hard.


    A model named pknotsRG, proposed by [26], is also based on the model of [22].
    They further restricted the class of pseudoknot structures being used. pknotsRG
    extended the standard folding algorithms by the class of canonical simple recursive
    pseudoknots. They defined a class of structures (sr-pk) that excluded triple-crossing
    helices as well as kissing hairpins in order to reduce the number of candidate
    structures. The class of structures, sr-pk, was further restricted by applying
    three rules of canonization. The resultant class was named csr-pk. These rules
    put a few restrictions on helices of a pseudoknot structure such as length of
    helices, excluding bulges, etc. It computed not only the minimal free energy structure
    for a sequence but also other k best structures, displayed as a dot bracket string.
    Three variants of this model have been introduced: pknotsRG-mfe, pknotsRG-enf
    and pknotsRG-loc. pknotsRG-mfe produced a minimum free energy structure that could
    contain a pseudoknot occasionally. pknotsRG-enf produces an energetically best
    structure having at least one pseudoknot. pknotsRG-loc produced a structure with
    a pseudoknot at a particular location. Unlike other models that implement their
    algorithm in C, C++ or other programming language, pknotsRG implements their algorithm
    in algebraic dynamic programming. The motive of using algebraic dynamic programming
    was to make the implementation reusable. The algorithm executes fast and has low
    memory requirements as compared to [22] but on the expense of limitations applied
    to structures. The earlier dynamic programming models ignored an important concept
    related to folding of RNA from primary sequence to the stable tertiary structure.
    This concept is termed hierarchical folding and states that the primary structure
    forms the secondary structure that in turn forms the tertiary structure. In this
    respect, a pseudoknot free structure is formed first, and then a pseudoknot forming
    base pairs is added to form a pseudoknotted structure. The HFold model [51] used
    this concept to predict pseudoknot structures. Their algorithm could take as an
    input an RNA sequence and output structures that could be divided into two pseudoknot-free
    structures. They could predict the kissing hairpin pseudoknot as an interaction
    between two H-type pseudoknots. In 2014, another model named CCJ [52] was proposed
    to predict kissing hairpins. This model worked on a minimum free energy concept.
    It predicted a few types of pseudoknots in O(n⁵) time. An extension to HFold was
    proposed in 2014 [53]. Iterative HFold works on the minimum free energy concept
