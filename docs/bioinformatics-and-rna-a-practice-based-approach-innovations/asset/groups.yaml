    also uses thermodynamic parameters of Turner [49,82], together with those of [25]
    for pseudoknotted loops to determine energy of structure and to prune a tree of
    partial structures. The heuristic hotknots model performs poorly in predicting
    optimal structures with respect to underlying energy model. Further, the running
    time of this model also needs to be improved. Inspired by the hotknots model,
    another iterative model based on evolutionary information as well as thermodynamics
    was proposed [66]. The performance of this model is better than hotknots in terms
    of sensitivity and specificity. Another heuristic attempt was made by [67]. Their
