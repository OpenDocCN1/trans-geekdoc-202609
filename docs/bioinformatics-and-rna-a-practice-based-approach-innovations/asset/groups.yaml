    # ## 2.3 LOCAL SEQUENCE ALIGNMENT


    Contrary to global sequence alignment, local sequence alignment refers to the
    alignment of a segment of the sequences and not the complete sequences.


    Similarity in sequences is often correlated to homology. Homologous sequences
    are the ones that belong to the same ancestor. Thus, structure or function can
    be inferred from sequence alignments. It may not be necessary to align the complete
    sequences; rather, we may need to align only parts of sequences. In that case,
    local sequences alignment is a better choice.


    The local alignment method was proposed by Smith, T. F. and Waterman, M. S. in
    1981. The algorithm is popularly known as the Smith-Waterman algorithm.


    The difference between the Needleman-Wunsch algorithm and Smith-Waterman algorithm
    lies in the filling matrix. The scoring function as well as rules for filling
    the matrix remain the same. The only difference lies in the values of a matrix.
    Negative numbers are written as zero and positive numbers are written as is. Another
    slight difference is in the trace-back step. Here, we will start with the highest
    number and trace it diagonally until we reach a cell with a zero value, as shown
    in Figure 2.7.


    The resultant alignment is as follows:


    | A | T | C |

    |---|---|---|

    | C | G | C |


    Local sequence alignment is important when:


    +   * We need to align two partially overlapping sequences

    +   * One sequence is a subset of another sequence


