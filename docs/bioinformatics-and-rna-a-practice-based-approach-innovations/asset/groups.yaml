    ## 7.5 PAIR STOCHASTIC TREE ADJOINING GRAMMAR


    As we have seen, context free grammar cannot capture all linguistic phenomena
    and on the other hand the parsing time taken by context sensitive grammar is exponential,
    so the discussion of tree adjoining grammar becomes crucial here. Tree adjoining
    grammar is similar to context free grammars but the elementary unit of rewriting
    is the tree instead of the symbol.


    Tree adjoining grammar uses two types of elementary trees called initial trees
    and auxiliary trees. The rules in a TAG are trees with a special leaf node known
    as the foot node, which is anchored to a word. Auxiliary trees have the root (top)
    node and foot node labeled with the same symbol. A derivation starts with an initial
    tree, combining via either substitution or adjunction. Substitution replaces a
    frontier node with another tree whose top node has the same label. The root/foot
    label of the auxiliary tree must match the label of the node at which it adjoins.
    Adjunction can thus have the effect of inserting an auxiliary tree into the center
    of another tree (Figure 7.4).


    Formally, tree adjoining grammar can be expressed with the following tuples. G
    (N, Σ, S, I, A) where N denotes a finite set of non-terminals, Σ denotes a finite
    set of terminals, S denotes the start symbol that represents the whole sentence
    (S ∈ N). I denotes the finite set of initial trees and A denotes the finite set
    of auxiliary trees. Production rules include substitution and adjunction.


    ### 7.5.1 SUBSTITUTION


    Substitution is only for initial trees. The process of TAG substitution is as
    shown in Figure 7.5.


    ![](img/4cb83489753bba67a16c119dae990237_122_0.png)


    ### FIGURE 7.4 TAG Initial and Auxiliary Tree


    ![](img/4cb83489753bba67a16c119dae990237_122_1.png)


    ### FIGURE 7.5 TAG Substitution


    ![](img/4cb83489753bba67a16c119dae990237_123_0.png)


    ### FIGURE 7.6 TAG Adjunction


    ![](img/4cb83489753bba67a16c119dae990237_123_1.png)


    ### FIGURE 7.7 TAG Adjunction into Initial Tree


    ### 7.5.2 ADJUNCTION


    Adjunction is for auxiliary trees. The process of TAG adjunction is as shown in
    Figure 7.6.


    An example of the adjunction of T into an initial tree is shown in Figure 7.7.


    Tree adjoining grammars are more powerful than context free grammar but less powerful
    than context sensitive grammar.


    A subclass of context sensitive grammars called Pair Stochastic Tree Adjoining
    Grammar (PSTAGs) has been used to predict pseudoknots [34]. They extended the
    Pair Hidden Markov models on tree structures [84] to include pseudoknots. They
    have defined two subclasses of TAG – Simple Linear TAG (SLTAG) and Extended Simple
    Linear TAG (ESLTAG). These subclasses are realized with initial trees and adjunct
    trees. RNA substructures can be represented with the help of these trees by applying
    various operations like adjunction, derivation, etc. PSTAGs work on the structural
    alignment concept. It takes as input a pair of linear sequences and a TAG representation
    of a pseudoknot is produced. Using recurrence relation, a dynamic parser produces
    structural alignment. Based on probability assigned to all alignments of the TAG
    tree, the most probable alignment is computed. The advantage of this method is
    that no training of the model is required. The prediction accuracy of this algorithm
    can be enhanced by using more powerful grammatical methods at the expense of resource
    cost. The time complexity of the algorithm is O(KnN^4 + KmN^5), where m and n
    are the numbers of nodes, K is the number of states in PSTAG and N is the sequence
    length. Tree adjoining grammar has enough computational capacity to model pseudoknots,
    but it takes too much time for parsing. So, researchers have tried to lower the
    time complexity by using other forms of grammar.


    ## 7.6 MULTIPLE CONTEXT FREE GRAMMAR


    Context free grammar alone cannot easily model pseudoknots. So, multiple context
    free grammar (MCFG), an extension to context free grammar, has been applied to
    an RNA pseudoknot prediction [85]. MCFG is an extension to CFG to include functions
    such as bifurcation, base pairing, unpaired bases, etc. Each rule in MCFG is accompanied
    by two types of probabilities, transition probability and emission probability.
    The most probable tree is found by using the CYK algorithm. CYK algorithm is implemented
    using a five-dimensional dynamic programming matrix. MCFG is converted into a
    SMCFG version with the help of an inside-outside algorithm. As their version of
    the CYK algorithm took too much space, so hashing was used to reduce the space
    complexity.


    Another attempt using multiple context free grammar was made by [38]. Their parsing
    algorithm is based on comparative approach. The best part of his algorithm is
    that it does not require training data for parameter setting of a parsing algorithm.
    His results are comparable to Hxmatch [30].


    ## 7.7 PATH CONTROLLED GRAMMAR


    Path controlled grammar (PTCG) is a new class of grammar that generates trees
    restrictively. It was introduced by [86] and further explored by [87] and [88].
    Path controlled grammars generate trees on lines of a specific pre-stated path.
    In other words, the tree generation will be catered by a designated predefined
    path for a given context free grammar GR.


    Path controlled grammar is more powerful than context free grammar but it still
    preserves the basic properties of context free languages (CFLs). For a given CFG
    $\bar{G}$, CFL $\bar{L}$ and sequence x,


    $$

    x \in \bar{G} \ \& \ x \in \bar{L} \text{ iff } \bar{G} \text{ derives } x \text{
    with a derivation tree } T \text{ such that there exists a path for } T \text{
    in } \bar{L}

    $$


    For designing a path controlled grammar, both CFG and CFL are required. The idea
    is to impose a restriction on the paths in the derivation tree.


    Context free grammars have moderate generating power that is not sufficient to
    model complex structures like pseudoknots. A class of grammar with better generative
    power is context sensitive grammar. But the issue with the usage of context sensitive
    grammar to model pseudoknots are a multifold increase in complexity of the algorithm.
    So, the idea is to enhance the generative power of CFG without making it too complicated
    to implement. The solution is PTCG. Without adding context to the grammar, the
    generative capacity is increased only by controlling the path generation of the
    derivation tree.


    Further, the number of output trees is controlled as only those trees have generated
    that match the given CFL corresponding to the pseudoknot structure.


