    \ can be applied only to those homologous RNA sequences that match the training\
    \ sequences used by the algorithm.\n\n### 7.3 PARALLEL COMMUNICATING GRAMMAR SYSTEM\n\
    \nIn 2003, the Parallel Communicating Grammar System (PCGS) was introduced [83].\
    \ It consists of more than one Chomsky grammar, one of which is the master grammar.\n\
