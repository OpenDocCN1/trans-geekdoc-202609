    +   b. In the derivation tree, the label of all nodes except leaf nodes is a variable.

    +   c. In the derivation tree, if the root of a sub-tree is X then it is called
    – tree.

    +   d. None of these.


    Q3. Regular grammar is


    +   a. a CFG.

    +   b. a non-CFG.

    +   c. an English grammar.

    +   d. none of these.


    Q4. The following grammar


    ```

    G = (N, T, P, S)

    N = (S, A, B)

    T = {a, b, c}

    P: S → aSa

    S → aAa

    A → bB

    B → bB

    B → c is

    ```


