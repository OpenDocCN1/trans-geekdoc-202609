    ## 6.2 比较序列分析技术


    基于比较方法的假结预测模型基于这样一个事实：由进化保守的结构更有可能是功能形式。基于比较方法的假结预测模型需要多个比对序列作为输入。序列相似性应使它们能够最初进行比对。此外，它们应足够不相似，以便能够找到保守残基和协变碱基对。如果序列差异过大，比对将变得困难。因此，了解应使用哪些同源序列非常重要。有人提出了一种基于GC稳定性和GU中间状态约束来选择用于比较分析的序列的方法。基于比较方法的假结预测可应用于定义为两个不相交二级结构叠加的二级结构。模型Hxmatch
    [30]基于序列比对，并基于热力学得分和协方差得分为碱基对赋予得分。利用二级结构表示法，它通过删除冲突的螺旋将结构转换为二级结构。这种最大权重匹配程序会重复进行，直到删除所有此类螺旋。为了表现良好，该模型需要具有高序列协变的准确比对。它有时也会产生伪假结。[31]提出了另一种probknot模型。Probknot是一种类似于最大权重匹配概念的模型。它使用成对概率最高的碱基对，将配对概率总和最大的结构称为最大期望准确性结构。这些碱基对概率是使用包含同轴堆积的配分函数预测的。从碱基对概率中，形成最大期望准确性结构。该模型预测了许多假结，但其在已知结构中的预测碱基对百分比较低。此外，所使用的配分函数并未显式处理假结。利用同源序列进行比较序列分析可产生更好的预测准确性。DotKnot-PW算法
    [58]使用两个同源序列来预测H-type假结。首先使用DotKnot [59]（一种单序列预测方法）生成H-type假结候选物。为了减少计算时间，计算成对碱基相似性得分，而不是进行完整的结构比对。使用结合自由能和相似性得分的方法输出了最优结构。最近，[61]给出了对Ipknot
