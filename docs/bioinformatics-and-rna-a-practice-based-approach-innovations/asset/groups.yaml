    ## 论述题


    - Q1. 将 RNA 干扰与人类疾病相关联。

    - Q2. RNA 具有高度保守性。您同意这一说法吗？请给出理由以支持您的答案。

    - Q3. 基因表达在 RNAi 疗法中起什么作用？

    - Q4. 生物恐怖主义如何危害人类人口？

    - Q5. 讨论毒理基因组学作为对人类生命的威胁。


    ## 术语表


    ### 生物信息学

    生物信息学是将生物学概念化为巨分子（在物理化学意义上），然后应用“信息学”技术来理解和组织与这些分子相关的信息，规模宏大。


    ### 茎轴向堆积

    长 RNA 双链彼此堆叠形成长链。


    ### 计算生物学

    计算生物学涉及编写算法和代码，以开发生物信息学家将使用的工具。


    ### 表观遗传学

    对染色质（组蛋白、DNA）中的遗传标记的研究。


    ### 基因表达

    我们体内所有化学反应的基础。


    ### 基因沉默

    在翻译或转录过程中阻止基因表达过程的过程称为基因沉默。


    ### 遗传变异

    对基因组变异的研究。


    ### 基因组学

    对基因组以及功能和调控元件的研究。


    ### 螺旋

    通过堆叠碱基对形成螺旋。


    ### H-type 假结

    最常见的假结类型是 H-type 假结。


    ### 代谢组学

    对细胞、组织和体液中代谢物的研究。


    ### 非编码 RNA（ncRNA）

    这些是不编码蛋白质的功能性 RNA 分子。


    ### 营养遗传学

    营养遗传学可定义为营养与遗传的研究。


    ### 系统进化学

    系统进化学是一门研究在一段时间内从共同祖先演化而来的生物之间生物学关系的科学。


    ### 蛋白质组学

    对蛋白质（包括其结构）的研究。


    ### 假结

    RNA 二级结构中的重要基序。


    ### RNA 干扰

    RNA 干扰（RNAi）的机制涉及使用特定的小干扰 RNA（siRNA）来处理致病基因，该 siRNA 靶向特定的信使 RNA（mRNA）。


    ### 序列比对

    序列比对是将两条或多条序列上下排列，以便定位最大相似性区域的过程。


    ### Snurps

    保守的 RNA-蛋白复合物。


    ### 物种

    物种被定义为一组相似的生物体。


    ### 系统生物学

    对细胞生物化学相互作用网络的整体分析。


    ### 毒理基因组学

    毒理基因组学是处理生物体特定细胞或组织中基因和蛋白质活性及其对有毒物质反应的信息的收集、解释和存储的科学领域。


    ### 转录组学

    对转录本（包括非编码 RNA 和 microRNA）的研究。


