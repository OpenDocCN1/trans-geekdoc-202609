    # APPENDIX


    # Implementing the Needleman-Wunsch global sequence alignment algorithm using
    ASP.net and C#


    Sequence alignment is a way of arranging two or more sequences of characters to
    identify regions of similarity – similarities may be a consequence of functional
    or evolutionary relationships between these sequences.


    It is a procedure for comparing two or more sequences by searching for a series
    of individual characters that are in the same order in those sequences.


    Find optimal global alignment between sequences for a given set of rules.


    There are three steps:


    +   1. Initialization step

    +   2. Matrix fill step

    +   3. Trace-back step


    # Design front end


    +   1. Take five input boxes and one button, first two text boxes for sequences,
    three text boxes for match, mismatch and gap value and button to perform a click
    action.

    +   2. Take two gridviews and labels to visualize the matrix operation and output
    both sequence alignments.'
