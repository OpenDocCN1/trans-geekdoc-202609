    input a pseudoknot free structure and produces a pseudoknotted structure. In iterative
    HFold models, authors have tried to reduce the space complexity while predicting
    the same structures as HFold.


    Another dynamic programming model was proposed by [27]. This model is an extension
    to algorithm of [54] to incorporate arbitrary pseudoknots. The model worked with
    a motive to align arbitrary pseudoknots using the dynamic programming concept
    while producing optimal structures. Optimal alignment was calculated by a minimum
    edit distance using operations such as base deletion, base substitution, arc mismatch,
    arc breaking, arc removing, arc altering etc. The alignment cost was calculated
    recursively by calculating and adding the cost of these subalignments. RNA structure
    was classified into two categories: simple structure and complex structure. Accordingly,
    simple and complex logic was applied respectively on these categories. Because
    of this reason, the running time could be substantially lowered. Also, it created
    room for further optimization. The running time and memory requirements of some
    of the well-known dynamic programming models are also reduced [29]. The method
    used is sparsification to handle gapped fragments. Sparsification in general reduces
    the number of candidate substructures that automatically reduces the time requirements
    as well as memory requirements. It sparsifies the popular algorithms [22–26].
    In [22], sparsification is done for base-pair maximization algorithm by providing
    recursion equations that are close to the actual algorithm''s equations. Also,
    in its free energy minimization algorithm, recursions in matrices are sparsified.
    In the algorithm proposed by [26], sparsification is achieved by restricting its
    scoring scheme. Models proposed by [23–25] were considered a restriction to the
    class of structures of [22]. So their sparsification is done more or less similarly.


    Another modification of dynamic programming models was proposed by [28]. The pseudoknot
    Local Motif Model and Dynamic Partner Sequence Stacking (PLM_DSS) model predicts
    the RNA pseudoknot with high sensitivity. It is a modification of dynamic programming
    for sequence alignment algorithm that calculates lowest stacking energy between
    stem-forming regions. It assumes the neighbouring regions to be interference-free.
    It outputs all pseudoknots compatible to the PLM model. PLM model is formed by
    applying various constraints while selecting H-type pseudoknots from PseudoBase.
    PLMM_DPSS first predicts potential stems from the RNA sequence by applying a pseudoknot
    stem energy restriction. A stem is selected by calculating the lowest Turner''s
    stacking energy. After stem selection, they are assembled to predict pseudoknots.
    This algorithm did output not only pseudoknots of lowest energy but also other
    compatible pseudoknots. Though the algorithm predicted a pseudoknot with high
    sensitivity, but it does not take into account non-crossing stem regions. Also,
    it constructed a PLM model by applying various restrictions on pseudoknots like
    maximum loop size allowed so it can be applied to a very restricted class of structures.
    The major drawback of dynamic programming models is their time and space demands.
    Researchers continued to work in this respect. Researcher Wong proposed a memory
    efficient dynamic programming model [55] based on Maximum Expected Accuracy (MEA).
    This algorithm worked on the same concept as proposed by [56] in their model PAL
    but it could do the same work with lower memory requirements'
