    [66]。该模型在灵敏度和特异性方面的性能优于hotknots。[67]进行了另一种启发式尝试。他们的实现Pkiss结合了动态规划和[26]的规范化规则，以减少搜索空间，从而降低空间和时间复杂度。这种启发式模型专注于接吻发夹假结，并使用代数动态规划实现。该模型后来进一步改进
    [68]。已添加形状分析和概率以提高预测准确性。2007年，提出了另一种启发式假结预测模型 [69]。他们将其命名为vsFold5，可在 http://www.rna.it-chiba.ac.jp/vsfold5
    上获得。vsFold5利用聚合物溶剂相互作用和库恩长度等生物特征来预测假结。库恩长度是刚度的度量。该模型倾向于按照热力学上最可能的折叠路径进行折叠。它适用于长度不超过450个核苷酸的序列。该模型的输入为RNA序列、最小茎长度和连续茎的数量。大多数参数的默认值均已给出，还提供了聚合物模型选项。输出的二级结构基于库恩长度、温度和聚合物溶剂突出度，具有最小自由能，无论是否存在假结。假结结构已被分类为核心假结和扩展假结。扩展假结在二级结构形成后形成，而核心假结在二级结构形成之前形成。


    vsFold5的最坏情况时间复杂度与序列长度对应。在此模型中，库恩长度的自动估计是一个重要因素。此外，他们的未来工作将包括纳入蛋白质相互作用、次优结构等参数。2010年，提出了另一种迭代模型Cyclofold
    [70]。该模型通过基于自由能迭代选择螺旋来折叠RNA序列。它还检查所选螺旋的空间位阻可行性以提高准确性。空间位阻可行性与分子中原子距离产生的能量有关。它可以预测多种类型的假结。2011年，提出了另一种模型NanoFolder
    [71]。该模型专注于具有多条交叉弧的多链RNA二级结构。评分函数使用碱基对堆积能量。为相似链之间的碱基对引入了惩罚得分。两条不同链之间的惩罚得分从训练集中计算得出。该模型收集所有带有碱基对的螺旋并计算它们的得分。NanoFolder以FASTA格式的RNA序列作为输入，仅以点括号表示法输出最可能的结构。可在
    https://matchfold.ncifcrf.gov 上获得。


    ## 6.4 形式文法技术


    基于形式文法的假结预测模型是基于形式文法的数学模型。形式文法正被用于预测RNA序列中是否存在假结 [37]。已使用不同类型的文法（如上下文无关文法、多上下文无关文法（MCFG）和随机上下文无关文法（SCFG））来预测假结。[72]的作者阐述了上下文无关语言、正则语言、树附加语言、多上下文无关语言及更多文法之间的包含关系。这些文法中的大多数将在第7章中详细阐述。


