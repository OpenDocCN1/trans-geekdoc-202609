    RNA 初级序列中的四个碱基是腺嘌呤（A）、鸟嘌呤（G）、胞嘧啶（C）和尿嘧啶（U），它们形成碱基对。换句话说，RNA 初级序列自身折叠形成二级结构。二级结构进而折叠形成三级结构。RNA
