    [5]、SWISS-PROT [6]、OMIM [7]、PDB [8]、KEGG [9] 等数据库。今天，由于生物信息学领域的研究人员数量不断增加、生物数据的爆炸式增长以及为项目提供资助的机构数量增加，生物信息学存在大量项目。在序列分析、基因组学、结构生物信息学和计算进化生物学等各个生物信息学领域，有许多正在进行中的项目。这些领域在图
    1.2 中有所说明。


