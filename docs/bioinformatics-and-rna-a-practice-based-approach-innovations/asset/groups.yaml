    # 2.4 MULTIPLE SEQUENCE ALIGNMENT


    Local sequence alignment as well as global sequence alignment is collectively
    known as pairwise alignment. Sometimes we require alignment of more than two sequences;
    for instance, the number of sequences may be 10, 20 or maybe 60. As the number
    of sequences to be aligned increases, the complexity of the alignment algorithm
    increases.


    An application of multiple sequence alignment may be construction of a phylogenetic
    tree. A phylogenetic tree is the one that shows how closely or distantly organisms
    are related. For constructing such a tree, conserved regions need to be found.
    Conserved regions may be located with the help of the multiple sequence alignment.
    Pairwise alignment may not guarantee an ancestral relationship between sequences
    of two species, but ancestral relationships may be significantly analyzed with
    the multiple sequence alignment.


    Pairwise sequence alignment requires a two-dimensional matrix. Similarly, sequence
    alignment of three sequences will require a three-dimensional matrix. Further,
    a four-dimensional sequence will be used to align four sequences, and so on.


    For example, we take three sequences – AGCT, GGT and CGCT – as shown in Figure
    2.8.


    The vertices to be plotted on a three-dimensionoal matrix are (1,0,0), (1,0,1),
    (2,1,2), (2,2,2), (3,2,3) and (4,3,4).


    Further, the values in cells of a two-dimensional matrix used to come from three
    directions, diagonally, horizontally and vertically. But, in the case of an n-dimensional
    matrix, values will come from various directions into cells of the score matrix,
    as shown in Figure 2.9.


    A multiple sequence alignment can be achieved using alignment tools such as ClustalX,
    ShadyBox, PrettyBox etc. Following are the steps to conduct a multiple sequence
    alignment:


