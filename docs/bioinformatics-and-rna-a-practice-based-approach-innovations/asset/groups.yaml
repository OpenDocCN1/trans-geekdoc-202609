    ## 7.5 成对随机树连接文法


    正如我们所见，上下文无关文法无法捕捉所有语言现象，另一方面，上下文相关文法的分析时间是指数级的，因此讨论树连接文法在此至关重要。树连接文法与上下文无关文法类似，但重写的基本单元是树而不是符号。


    树连接文法使用两种类型的初级树，称为初始树和辅助树。TAG 中的规则是带有一个特殊叶节点的树，称为足节点，它锚定到一个单词。辅助树的根（顶）节点和足节点标记为相同的符号。推导从一个初始树开始，通过替换或连接进行组合。替换用一个顶节点标签相同的另一棵树替换边界节点。辅助树的根/足标签必须与其连接处的节点标签匹配。连接的效果可以将辅助树插入到另一棵树的中心（图
    7.4）。


    正式地，树连接文法可以用以下元组表示。G (N, Σ, S, I, A) 其中 N 表示非终结符的有限集，Σ 表示终结符的有限集，S 表示表示整个句子的开始符号（S
    ∈ N）。I 表示初始树的有限集，A 表示辅助树的有限集。产生式规则包括替换和连接。


    ### 7.5.1 替换


    替换仅适用于初始树。TAG 的替换过程如图 7.5 所示。


    ![](img/4cb83489753bba67a16c119dae990237_122_0.png)


    ### 图 7.4 TAG 初始树和辅助树


    ![](img/4cb83489753bba67a16c119dae990237_122_1.png)


    ### 图 7.5 TAG 替换


    ![](img/4cb83489753bba67a16c119dae990237_123_0.png)


    ### 图 7.6 TAG 连接


    ![](img/4cb83489753bba67a16c119dae990237_123_1.png)


    ### 图 7.7 TAG 连接到初始树中


    ### 7.5.2 连接


    连接适用于辅助树。TAG 的连接过程如图 7.6 所示。


    将 T 连接到初始树的示例如图 7.7 所示。


    树连接文法比上下文无关文法更强大，但不如上下文相关文法强大。


    上下文相关文法的一个子类，称为成对随机树连接文法（PSTAGs），已被用于预测假结 [34]。他们将树结构上的成对隐马尔可夫模型 [84] 扩展到包含假结。他们定义了
    TAG 的两个子类——简单线性 TAG（SLTAG）和扩展简单线性 TAG（ESLTAG）。这些子类通过初始树和连接树实现。RNA 子结构可以通过应用连接、推导等各种操作，借助这些树来表示。PSTAGs
    基于结构排列概念工作。它以一对线性序列作为输入，并生成假结的 TAG 表示。使用递推关系，动态解析器生成结构排列。基于分配给 TAG 树所有排列的概率，计算出最可能的排列。此方法的优点是不需要模型训练。该算法的预测准确性可以通过使用更强大的语法方法来提高，但代价是资源成本。该算法的时间复杂度为
    O(KnN^4 + KmN^5)，其中 m 和 n 是节点数，K 是 PSTAG 中的状态数，N 是序列长度。树连接文法具有足够的计算能力来建模假结，但解析时间过长。因此，研究人员尝试通过使用其他形式的语法来降低时间复杂度。


    ## 7.6 多上下文无关文法


    仅靠上下文无关文法无法轻松建模假结。因此，作为上下文无关文法的扩展，多上下文无关文法（MCFG）已被应用于 RNA 假结预测 [85]。MCFG 是 CFG
    的扩展，用于包含分叉、碱基配对、未配对碱基等功能。MCFG 中的每条规则都附有两种概率：转移概率和发射概率。使用 CYK 算法找到最可能的树。CYK 算法使用五维动态规划矩阵实现。MCFG
    借助内外算法转换为 SMCFG 版本。由于他们的 CYK 算法版本占用空间过大，因此使用哈希来减少空间复杂度。


    [38] 进行了另一次使用多上下文无关文法的尝试。他们的解析算法基于比较方法。他算法的最佳之处在于，它不需要训练数据来设置解析算法的参数。他的结果与 Hxmatch
    [30] 相当。


    ## 7.7 路径控制文法


    路径控制文法（PTCG）是一种受限生成树的新文法类。它由 [86] 引入，并由 [87] 和 [88] 进一步探索。路径控制文法沿特定预定义路径生成树。换句话说，对于给定的上下文无关文法
    GR，树生成将由指定的预定义路径处理。


    路径控制文法比上下文无关文法更强大，但仍保留上下文无关语言（CFL）的基本属性。对于给定的 CFG $\bar{G}$，CFL $\bar{L}$ 和序列
    x，


    $$

    x \in \bar{G} \ \& \ x \in \bar{L} \text{ 当且仅当 } \bar{G} \text{ 通过推导树 } T \text{
    推导出 } x \text{，且在 } \bar{L} \text{ 中存在 } T \text{ 的路径}

    $$


    设计路径控制文法时，需要同时具备 CFG 和 CFL。其思想是对推导树中的路径施加限制。


    上下文无关文法具有中等的生成能力，不足以建模假结等复杂结构。一种具有更好生成能力的文法类是上下文相关文法。但使用上下文相关文法建模假结的问题是算法复杂度大幅增加。因此，其思想是在不使实现过于复杂的情况下增强
    CFG 的生成能力。解决方案是 PTCG。在不向文法添加上下文的情况下，仅通过控制推导树的路径生成来提高生成能力。


    此外，输出树的数量受到控制，因为只有那些与假结结构对应的给定 CFL 匹配的树才会被生成。


