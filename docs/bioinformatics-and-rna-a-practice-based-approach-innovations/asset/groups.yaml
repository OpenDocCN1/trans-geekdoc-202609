    # ## 5.4.10 B-TYPE PSEUDOKNOT


    A B-type pseudoknot is formed by base pairing between a bulge loop and a leftover
    unpaired single-stranded region of a secondary structure. Both of the bases in
    such a base pair are actually unpaired bases left during the formation of a secondary
    structure, as shown in Figure 5.26.'
