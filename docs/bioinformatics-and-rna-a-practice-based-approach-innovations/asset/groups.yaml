    ## 8 New Areas of Bioinformatics


    ## 8.1 DRUG TARGET IDENTIFICATION


    Drug discovery starts with initial steps of target identification and passes to
    the later stages of lead optimization. Multiple sources aid in determining an
    effective disease target, including academic studies, clinical work and the commercial
    sector. The target chosen is then used by the pharmaceutical industry or researchers
    to classify molecules to generate effective drugs. The process involves various
    early steps, as shown in Figure 8.1.


    ### 8.1.1 TARGET IDENTIFICATION AND VALIDATION


    Target identification and characterization is an important step. It begins with
    identifying the function of a possible therapeutic target (gene/protein) and its
    role in the disease. One such related field is RNA therapeutics. RNA therapeutics
    drugs are designed to increase or decrease the production of a protein involved
    in a disease. It is a mechanism to regulate normal gene expression to eradicate
    several disorders like cancer, Hepatitis C, Huntington Disease, HIV, malaria,
    etc. The characterization of the molecular pathways discussed by the target is
    accompanied by recognition of the target. A good target should be efficacious,
    safe, meet clinical and commercial requirements and be “druggable”. The concept
    of RNAi leads to gene silencing, which means switching off the target gene. It
    prevents the expression of a certain gene. One of the applications of the gene
    silencing technique was to cure Huntington disease which is caused by the production
    of protein called Huntington. Various approaches for drug target identification
    are:


    - 1. Data mining using bioinformatics which includes identifying, selecting and
    prioritizing potential disease targets.

    - 2. Genetic association, which deals with genetic polymorphism and connection
    with the disease. For example, cystic fibrosis which is a genetic disease that
    affects the lungs and digestive system. Cystic fibrosis is being treated with
    the help of LUNAR technology.

    - 3. Expression profile relates to changes in mRNA/protein levels. As gene expression
    is the process of formation of proteins, wherein DNA acts as a template for mRNA
    which further gets converted into proteins. So, altering the gene expression process
    may prevent some diseases from occurring. More precisely, it is altering gene
    coding at the mRNA level.


    ![](img/4cb83489753bba67a16c119dae990237_128_0.png)


    FIGURE 8.1 Steps for Drug Target Discovery


    ### 8.1.2 TOOLS FOR TARGET IDENTIFICATION AND VALIDATION


    There are various tools and techniques for target identification and validation.
    They are discussed as follows:


    - 1. Genetics and expression changes: They relate to disease association. Gene
    expression is the process of formation of proteins, intermediate steps making
    the conversion from DNA to mRNA.

    - 2. Gene silencing: The process of prevention of gene expression process during
    translation or transcription process is called gene silencing.

    - 3. LUNAR technology: LUNAR stands for Lipid-enabled and Unlocked Nucleic Acid
    modified

    - 4. RNA delivery technology: In this technique, a lipid particle is fused into
    the cell membrane that leads to the biodegradation process and delivers the required
    RNA.

    - 5. PMO: PMO (phosphorodiamidate morpholino oligomer) is a synthetic RNA that
    retards the gene expression in order to prevent cells from making a targeted protein.
    They are molecular structures that are bound to RNA at a specific position.

    - 6. RNA Interference: The mechanism of RNA Interference (RNAi) involves treating
    the disease-causing gene with specific small interfering RNA (siRNA) that targets
    the specific messenger RNA (mRNA).

    - 7. RNAi therapeutics: Altering gene coding at the mRNA level is called RNAi
    Therapeutics. RNA therapeutics drugs are designed to increase or decrease the
    production of a protein involved in a disease.

    - 8. siRNA: Small interfering RNA is also known as silencing RNA or short interfering
    RNA. siRNA is formed from double-stranded RNA molecular sequence of length 20–25
    base pairs and is used.


    ### 8.1.3 TARGET VALIDATION


    Target validation relates to the molecular target which when treated can lead
    to therapeutic effect. The validation of the target needs to be accompanied by
    a multi-validation approach.


    One of the approaches include genetic manipulation of target genes (in vitro),
    including knocking down the gene (shRNA, siRNA, miRNA), knocking out the gene
    (CRISPR, ZFNs) and knocking in the gene. Another approach could be the use of
    antibodies that interact with the target with high affinity and block further
    interactions.


    Target identification and validation in the current global pandemic COVID-19 caused
    by the SARS-CoV-2 virus are important. There is an immediate need for the identification
    of effective drugs to contain the disastrous virus outbreak. Global efforts are
    already underway at a war footing to identify the best drug combination to address
    the disease [89]. Some countries are doing trials on the vaccine. Recently, India
    has also announced its first vaccine.


    Worldwide, research laboratories and drug development organizations work relentlessly
    to assess compounds that can inhibit the spread of SARS-CoV-2 in humans. To accomplish
    this, it is important to identify drug targets first and then identify and evaluate
    compounds and biologics that can effectively engage these targets and inhibit
    the spread [89].


    It is important to understand the biology, mode of transmission and replication
    cycle of the virus in order to understand the drug targets and appreciate the
    ongoing efforts aimed at identifying therapies against SARS-CoV-2. This is particularly
    important since any successful SARS-CoV-2 therapy should ideally target stages
    in the life cycle of the virus.


    ## 8.2 NUTRIGENOMICS


    Based on the definition of genetics and genomics by the WHO nutrigenetics can
    be defined as nutrition and inheritance studies, while nutrigenomics is the study
    of the mutual interactions between dietary molecules, genes and gene function.
    The key distinction between genomics and genetics is that genetics scrutinizes
    the single gene’s functioning and structure, while genomics addresses all genes
    and their interrelationships in order to understand their collective effect on
    the organism’s growth and development.


    Nutrigenomics refers in this sense to both nutrigenetics and nutrigenomics. In
    order to be considered a valued partner in the genetics and genomics arena and
    to take full advantage of the many new opportunities that have arisen, nutrition
    researchers, especially those in the nutrigenomics field, need to make a whole-hearted
    and concerted effort to incorporate bioinformatics expertise in their toolboxes.


    A group of European departments is now establishing a European Union–supported
    network of excellence, the European Nutrigenomics Organization (NuGO), for the
    integration and development of nutritional genomics. One major idea is that both
    the science and application of human nutrition are optimally positioned to benefit
    from the new genomic approaches to biology, using transcriptomics, proteomics
    and metabolomics. A key objective of the network will be the development, data
    warehousing and exploitation of nutrition and health-related bioinformatics for
    the benefit of European nutrition researchers, and for the community as a whole
    [90].


    ### 8.2.1 PROSPECTS AND APPLICATIONS OF NUTRIGENOMICS


    The word “nutrigenomics” was developed to determine the relationship between genes
    and nutrients. There is a lot of optimism that the new “omics” techniques will
    lead to a more comprehensive understanding of the impact on gene expression and
    cell biology of bioactive compounds in foods, such as components in fruits, vegetables
    and milk. New synergisms can be revealed between different bioactive components.
    The techniques can be used to research the impact of dietary ingredients on gene
    expression in blood leukocytes and other cells in human meal studies or intervention
    studies. This can also contribute to the development of new biomarkers to be used
    for dietary impact assessment. Also, for the assessment of the effectiveness of
    therapeutic diets in patients with particular diseases, certain approaches may
    be relevant in clinical nutrition. Detailed research on selected target genes
    would be required following the hunt for affected genes.


    In practice, the application of nutrigenomics uses several “omics” techniques
    in various disciplines, including genomics, epigenomics, transcriptomics, proteomics
    and metabolomics, to examine animal cellular and molecular responses to different
    dietary nutrients in an independent or integrated way, revealing the global effect
    of nutrients on animal genomes, methylomes/epigenomes, transcriptomes, proteomes
    and metabolomes, respectively [91].


    ## 8.3 TOXICOGENOMICS


    Toxicogenomics is the field of science that deals with the collection, interpretation
    and storage of information about gene and protein activity within a particular
    cell or tissue of an organism and response to toxic substances. Toxicogenomics
    combines toxicology with genomics. It is a subdiscipline of pharmacogenomics.
    Various environmental exposures, age, organics and individual susceptibility are
    the factors related to toxicogenomics that are responsible for human diseases.
    It deals with how a genome responds to environmental stressors and toxicants.


    Toxicogenomics include studies of the cellular products controlled by the genome
