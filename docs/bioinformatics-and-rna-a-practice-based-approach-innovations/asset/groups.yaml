    ## 1 生物信息学简介


    生物信息学一词是“生物”+“信息学”的组合。这里，“Bio”代表生物学，“Informatics”涉及信息技术。生物信息学是指将信息学技术应用于生物学问题以寻求解决方案。生物信息学一词于
    1970 年由一位荷兰作者创造。各位研究者将生物信息学定义为


    ... 研究生物系统中信息的表示与分析，涉及分子层面的信息 [1]。


    生物信息学是将生物学概念化为大分子（在物理化学意义上），然后应用“信息学”技术（源自应用数学、计算机科学和统计学等学科），以大规模理解和组织与这些分子相关的信息
    [2]。


    生物信息学也被描述为计算机科学与分子生物学的结合。生物信息学是一门跨学科研究领域，它将生物学与信息技术、数学、统计学、物理学和化学相结合，如图 1.1 所示。


    当今是大数据时代。目前存在大量的生物信息学项目来处理生物信息学的大数据。第一个生物信息学项目是 1990 年的人类基因组计划。该项目的目标是对人类基因组进行测序和注释。另一个项目，赛莱拉基因组计划，于
    1998 年启动。该项目研究的是酵母基因组。这些项目成功完成后，启动了其他几个项目；具体来说，2001 年，HapMap 项目开始了。


