    ![](img/4cb83489753bba67a16c119dae990237_128_0.png)


    FIGURE 8.1 Steps for Drug Target Discovery


    # 8.1.2 TOOLS FOR TARGET IDENTIFICATION AND VALIDATION


    There are various tools and techniques for target identification and validation.
    They are discussed as follows:


    +   1. Genetics and expression changes: They relate to disease association. Gene
    expression is the process of formation of proteins, intermediate steps making
    the conversion from DNA to mRNA.

    +   2. Gene silencing: The process of prevention of gene expression process during
    translation or transcription process is called gene silencing.

    +   3. LUNAR technology: LUNAR stands for Lipid-enabled and Unlocked Nucleic Acid
    modified

    +   4. RNA delivery technology: In this technique, a lipid particle is fused into
    the cell membrane that leads to the biodegradation process and delivers the required
    RNA.

    +   5. PMO: PMO (phosphorodiamidate morpholino oligomer) is a synthetic RNA that
    retards the gene expression in order to prevent cells from making a targeted protein.
    They are molecular structures that are bound to RNA at a specific position.

    +   6. RNA Interference: The mechanism of RNA Interference (RNAi) involves treating
    the disease-causing gene with specific small interfering RNA (siRNA) that targets
    the specific messenger RNA (mRNA).

    +   7. RNAi therapeutics: Altering gene coding at the mRNA level is called RNAAi
    Therapeutics. RNA therapeutics drugs are designed to increase or decrease the
    production of a protein involved in a disease.

    +   8. siRNA: Small interfering RNA is also known as silencing RNA or short interfering
    RNA. siRNA is formed from double-stranded RNA molecular sequence of length 20–25
    base pairs and is used.'
