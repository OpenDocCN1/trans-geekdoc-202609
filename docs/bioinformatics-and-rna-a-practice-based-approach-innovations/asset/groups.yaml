    ## 6 假结预测技术


    预测 RNA 的二级结构有助于理解其功能。RNA 二级结构已通过各种算法 [13–17] 进行预测。RNA 二级结构预测始于碱基对最大化 [18] 的概念，其中预测基于结构中碱基对的最大数量。预测基于动态规划，即通过分治策略求解给定问题。问题被递归地分为子问题。然后求解最低层级的子问题。利用子问题的解来递归地求解给定问题的解。


    ```

    S(p, r) = max { S(p, r - 1) max (S(p, q - 1) + S(q + 1, r - 1) + 1) p < q < r
    }

    ```


    如上所示的递推关系已被用于求解 RNA 二级结构预测问题。S(p, r) 表示 RNA 二级结构预测问题，其中 p 和 r 分别表示待折叠为二级结构的 RNA
    序列的第一个和最后一个核苷酸或碱基。问题 S(p, r) 被递归地分为子问题 S(p, q – 1) 和 S(q + 1, r)，其中 q 表示 RNA 序列中
    p 和 r 之间的某个碱基。子问题 S(p, r – 1) 表示碱基 r 与 RNA 序列中的任何其他碱基均未配对。如果 r 已配对，则问题被递归地分为多个子问题。通过求解子问题并递归地将它们的解相加来构建总解，从而预测最终的
    RNA 二级结构。碱基对最大化为另一种称为热力学能量模型 [12] 的技术奠定了基础。在这种技术中，将 RNA 二级结构子结构的估计能量参数相加以求得整个二级结构的总能量。热力学能量值最小的二级结构被视为最优二级结构。


    [12] 的能量模型经 [18] 进一步改进。形式语法技术也被用于预测 RNA 二级结构。2003 年曾尝试使用随机上下文无关文法 [19] 预测假结。该模型使用同源
    RNA 序列及其系统发育树作为输入。该模型使用 CYK 算法和内外算法生成输出结构。其 Web 服务器可于 www.daimi.au.dk/~compbio/pfold
    访问。该模型声称能产生高质量的结果。已在二级结构中预测的动机包括发卡环、堆叠对、鼓泡环、内部环和连接点。RNA 中的各种动机在结构上是保守的，即即使两个 RNA
    序列不同，它们可能包含相同的动机。与其他动机一样，假结也是 RNA 二级结构中一个重要的动机。假结执行关键的功能作用，例如通过诱导核糖体移码来改变基因表达、调节翻译和剪接、模拟以及硒半胱氨酸合成。因此，在
    RNA 的结构和功能分析中不能忽略假结。此外，用于二级结构预测的比较序列分析方法已揭示保守的假结，例如在 rRNAs、核糖核酸酶 P RNA 和 tmRNA
    中。关于假结的结构、功能和序列数据已收集在 PseudoBase [20]、RFAM 等数据库中。[21] 基于文献调查，假结预测模型可分为七类。这些类别是动态规划模型、基于比较的方法模型、启发式模型、形式文法模型、反向折叠模型、整数规划模型和软计算模型。


    包括假结在内的 RNA 二级结构预测中最流行的类别模型是动态规划 [22–27]。动态规划模型需要迭代估计对二级结构有贡献的能量项。不幸的是，动态规划模型需要巨大的时间和内存需求。通过自由能量最小化预测带有任意假结的
    RNA 二级结构是 NP-hard 问题。因此，一些模型使用动态规划的修改形式 [28,29]。[28] 提出的模型是针对序列比对算法的动态规划修改形式。[29]
    提出的模型是一种稀疏化算法，引入了动态规划算法中矩阵稀疏化的概念，以减少空间和时间需求。假结预测的第二类模型是比较分析 [30,31]。比较模型使用基于最大权重匹配概念的协变分数。它们是可靠的方法，但其性能取决于同源序列比对的准确性。然而，它们可以很好地处理长序列。假结预测模型的第三类是启发式
    [32,33]。启发式技术以临时方式应用。与动态规划模型相比，这些模型执行速度快，但它们不保证结构的最优性。第四类侧重于基于形式文法的假结预测 [34–38]。将使用语法进行的
    RNA 二级结构预测视为分析问题。第五类是反向折叠模型 [39]。反向折叠模型以目标结构作为输入并输出 RNA 序列。第六类是整数规划模型 [40,41]。这些模型使用预构建的整数规划软件进行密集计算。出于此原因，这些算法可应用于更长的序列。最近，研究人员已尝试使用软计算技术（如支持向量机
    [42]、神经网络 [43]、遗传算法 [44] 和神经网络 [45]）来求解假结预测问题。这些技术通常需要与其他方法（如动态规划）结合以求解预测问题。[46]
    讨论了实现 RNA 二级结构的各种其他软计算技术。


