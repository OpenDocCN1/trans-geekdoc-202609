    启发式假结预测模型基于实验。这些模型旨在减少动态规划等方法的计算时间。[62]对基于启发式的假结预测进行了早期尝试。该模型（Kinefold）通过结合简单结构模型和精确聚类随机（ECS）模拟来预测假结。ECS模拟使用聚类技术来加速RNA折叠随机模拟。


    [32]提出了另一种启发式模型。迭代循环匹配（ILM）是基于循环匹配（LM）算法的一种启发式算法。ILM基于热力学方法和比较方法的结合。它用于单个序列。输入可以是单个序列或序列比对。假结被视为两个环区域之间的相互作用，因此会执行多次LM算法迭代。特定迭代中形成的二级结构对应的碱基对会从原始序列中移除，以备下一次迭代使用。在迭代过程中，仅考虑得分最高的碱基对。通过结合协方差得分和热力学得分，从序列或序列比对中构建碱基对评分矩阵。对于单个序列，最高得分计算忽略协方差得分。这种启发式算法也不对最优结构进行预测。该算法并不太复杂，在小序列上效果良好，但资源需求较高。此前已有多种用于预测RNA假结的模型，但很快意识到应增强这些模型以预测出现的H-type假结。因此，提出了另一种模型HPknotter
