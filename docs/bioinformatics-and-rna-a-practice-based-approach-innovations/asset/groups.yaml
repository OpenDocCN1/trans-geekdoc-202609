    ## 5.2 RNA 假结的生物学意义


    假结于 1982 年首次在转叶黄嵌花病毒中被发现 [10]。假结具有多种多样的功能。假结的一个重要功能是移码。它诱导核糖体进入替代阅读框。


    ![](img/4cb83489753bba67a16c119dae990237_91_0.png)


    图 5.7 假结 – 小鼠乳腺肿瘤病毒 (MMTV)


    ![](img/4cb83489753bba67a16c119dae990237_91_1.png)


    图 5.8 假结 – 肝炎德尔塔病毒


    ![](img/4cb83489753bba67a16c119dae990237_92_0.png)


    图 5.9 假结 – 甲型流感病毒


    ![](img/4cb83489753bba67a16c119dae990237_92_1.png)


    图 5.10 假结 – PYVV


    假结包含核酶、自剪切内含子、核蛋白复合物、病毒基因组以及许多其他生物系统中的功能域。它也是端粒酶活性所必需的，端粒酶在衰老中起重要作用。当假结与信使 RNA
    共存时，它在重编码中起着基本作用。它还在蛋白质合成中发挥调节作用。假结已在多种 RNA 类别中被发现；例如，核糖体 RNA、mRNA、tmRNA、催化性和自剪切
    RNA、病毒基因组 RNA、端粒酶等。假结导致翻译控制，维持复制信号，并还参与催化活性。病毒 RNA 中的假结在病毒基因表达和基因组复制中起着关键作用。


    ## 5.3 假结的表示


    假结可以以多种形式表示。所有表示都必须保留碱基对的交叉，如图 5.11 所示。


    ![](img/4cb83489753bba67a16c119dae990237_93_0.png)


    图 5.11 RNA 碱基对相互交叉


    ![](img/4cb83489753bba67a16c119dae990237_93_1.png)


    图 5.12 假结的平面图表示


    ### 5.3.1 平面图表示


    假结的平面图结构可以看作由顶点和边组成的图，如图 5.12 所示。RNA 的碱基是顶点，碱基对代表边。请注意，假结的平面表示具有交叉边。


    ### 5.3.2 圆形表示


    再次考虑平面结构。如果将平面结构的两端连接形成一个圆圈，拉伸碱基对的长度，得到的表示称为圆形表示，如图 5.13 所示。该表示中边的交叉确保了结构中存在假结。


    ### 5.3.3 点括号表示


    点括号表示法是 RNA 结构的一维表示。RNA 序列的所有碱基均从左到右书写，如图 5.14 所示。非交叉碱基对由圆括号 (( )) 表示。


    ![](img/4cb83489753bba67a16c119dae990237_94_0.png)


    图 5.13 假结的圆形表示


    序列：GAAGUACAAUAUGUAACCG

    结构：. . { . ( ( ( ( . . . . . ) ) ) } ) . .


    图 5.14 假结的点括号表示


    交叉碱基对随后由花括号 ({,}) 表示。更多交叉碱基对可由方括号 [[,] ] 表示。任何开括号及其对应的闭括号都代表一个碱基对。


    ### 5.3.4 弧表示


    假结的弧表示也是一维的，由从左到右书写的碱基组成。碱基对由弧表示。弧的数量等于碱基对的数量。对于假结，至少有两条弧相互交叉，如图 5.15 所示。


    ## 5.4 假结的类型


    假结已根据其碱基配对结构被分类为多种类型。下面将讨论所有类型。


    ![](img/4cb83489753bba67a16c119dae990237_94_1.png)


    图 5.15 假结的弧表示


    ![](img/4cb83489753bba67a16c119dae990237_95_0.png)


    ### 5.4.1 H 型假结


    最常见的假结类型是 H 型假结，如图 5.16 所示。H 型假结是 RNA 发卡结构的延伸。发卡结构与剩余链的未配对碱基形成碱基对，从而形成碱基对的交叉。PseudoBase++
    [11] 是 PseudoBase 的扩展，包含 236 个 H 型假结。


    ### 5.4.2 H-H 型假结


    H-H 型假结包括两个发卡环之间的碱基配对，如图 5.17 所示。PseudoBase 包含一个带有 H-H 型假结的序列。


    ### 5.4.3 H-L 型假结


    当发卡环与鼓泡环、内环或多环的单链部分之间发生碱基配对时，形成 H-L 型假结。H-L 型假结有两种形式：H-Lout 型假结和 H-Lin 型假结。PseudoBase
    有二十四个包含 H-Lout 型假结的序列和十一个包含 H-Lin 型假结的序列。


    #### 5.4.3.1 H-Lout 型假结


    H-Lout 型假结如图 5.18 所示，当发卡环与内环或多个内环之间发生碱基配对时形成。


    #### 5.4.3.2 H-Lin 型假结


    H-Lin 型假结如图 5.19 所示，当发卡环与外环或多个外环之间发生碱基配对时形成。


    ![](img/4cb83489753bba67a16c119dae990237_96_0.png)


    图 5.17 H-H 型假结


    ![](img/4cb83489753bba67a16c119dae990237_96_1.png)


    图 5.18 H-Lout 型假结


    ![](img/4cb83489753bba67a16c119dae990237_97_0.png)


    图 5.19 H-Lin 型假结


    ### 5.4.4 L-L 型假结


    当两个鼓泡环之间发生碱基配对时，形成 L-L 型假结，如图 5.20 所示。PseudoBase 有十三个包含 L-L 型假结的序列。


    ![](img/4cb83489753bba67a16c119dae990237_97_1.png)


    图 5.20 L-L 型假结


    ![](img/4cb83489753bba67a16c119dae990237_98_0.png)


    图 5.21 接吻发卡或 H-H-H 型假结


    ### 5.4.5 接吻发卡假结或 H-H-H 型假结


    多个发卡环之间的碱基配对形成 H-H-H 型假结，如图 5.21 所示。三个发卡环依次一个接一个地形成。之后，这些发卡环在它们的未配对碱基之间形成碱基对。接吻发卡对柯萨奇病毒的复制至关重要。它们还在病毒质粒
    DNA 复制或 RNA 合成中发挥作用。两个环之间的相互作用异常稳定。


