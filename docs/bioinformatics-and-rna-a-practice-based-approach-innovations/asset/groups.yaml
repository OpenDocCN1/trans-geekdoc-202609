    # 6.5 INTEGER PROGRAMMING TECHNIQUE


    Integer programming is a technique based on linear programming, which is defined
    as the optimization of a linear function subject to a set of linear constraints
    over integer variables. The RNA pseudoknotted structure prediction problem was
    formulated as an integer programming problem by [40]. The aim was to minimize
    the value of the objective function that reflects thermodynamic free energy of
    a folding structure of an input RNA sequence. The inner base pair of a pseudoknot
    opens before the helices forming that pseudoknot open. The advantage of using
    integer programming for a pseudoknot prediction is that various integer programming
    software systems like CPLEX software [78], LINDO API 6.0 [79] are available for
    solving the integer programming problem, once the prediction problem is modelled
    by integer programming. This model showed good performance in terms of accuracy
    only for RNA sequences of small lengths. Another integer programming model to
    solve the RNA pseudoknot prediction problem was proposed by [41]. Sato''s model
    Ipknot could work for longer sequences, up to 500 nucleotides. They introduced
    a concept of threshold cut while finding the Maximum Expected Accuracy (MEA) structure
    using integer programming. This threshold cut was introduced in order to run the
    algorithm faster. This algorithm could run for both single sequence and comparative
    sequence analysis. The accuracy of MEA-based methods is significantly higher when
    using a parameter set of [60] than using parameters of [14]. Another attempt to
    predict pseudoknots through integer programming was made by [80]. The structure
    with the highest number of base pairs is the output structure. Their output structure
    has minimum free energy. It works for a partial class of pseudoknots.


    # 6.6 INVERSE FOLDING TECHNIQUE


    Inverse folding of an RNA sequence is a different concept in which the target
    structure is converted into an RNA sequence. It was proposed in [39]. INV is an
    extension of traditional inverse folding models to include a canonical pseudoknot
    structure prediction. These models take as input the target structure and outputs
    RNA sequence. INV is a local stochastic search for prediction of a non-bipolar
    structure, three non-crossing RNA structures with at most, two crossings. It obtains
    an RNA sequence from a given structure by identifying the specific loop decompositions.
    The total energy of a structure is calculated by the sum of energies of its substructures.
    All the sequences that compose a structure can be realized by a neural network.
    Another inverse folding model [81] was proposed recently. This model uses Fatgraph
    for the said conversion. Fatgraph takes the secondary structure as the backbone
    or ribbon and cyclic order on the edge''s incident on a vertex. This model makes
    use of context free grammar and the energy model of Turner for finding the target
    RNA sequence. The complexity of the model is related to the concept of genus as
    with base pairs their complexity is exponential.'
