    [73]提出了一种基于规则的模型。该模型基于MFold [74]，并使用Maude进行假结结构预测。Maude与术语重写相关。RNA结构被视为术语，并发现规则用于结构预测。首先，使用术语重写预测和解析无假结结构，然后使用术语重写进行基于分数的基序-基序相互作用以预测带假结的结构。该算法对平均长度序列表现良好，但只能处理RNA序列中两个未配对区域之间的相互作用。[35]提出了另一种形式文法模型。该模型旨在改进[23]的性能。它使用两种文法来预测包括假结在内的RNA结构，即简单线性树连接文法和扩展简单线性树连接文法。它使用TAG的一个子模型TAGRNA来预测假结。它考虑H型假结，包括两个假结之间的相互作用或发环与假结之间的相互作用。使用的评分函数基于最小自由能概念。


    [75]使用一种专门用于建模RNA二级结构的语言，对假结进行了另一种建模尝试。RNA的各种基序被称为令牌。令牌已在形式文法语言中用于使用CFG识别RNA结构。它们的规范可能仅有助于建模简单结构。此外，它仅适用于长度不超过50的序列。与无上下文文法相反，有上下文文法考虑其所处的上下文。因此，建模各种RNA结构很容易。不幸的是，CSG没有已知的自动解析器。该研究人员尝试使用扩展转换网络来解析所述CSG。他们没有明确解释他们的模型如何处理假结。[76]提出了TAG的一个子模型TAGRNA来建模假结。最初，TAGRNA的时间复杂度为O(n^5)。因此，他们构建了一个随机正规文法（SREG）来筛选候选结构，从而降低时间复杂度。随机参数是使用概率值的对数计算的。为了测试系统的效率，生成了两种文法，一种使用优化的概率参数，另一种使用未优化的概率参数。大多数RNA假结预测模型的开发旨在减少时间和空间复杂度。相比之下，Gfold
    [36]的开发旨在定义一个更适合递归构建的结构类。Gfold也基于MCFG。除了MCFG的优点外，Gfold还结合了RNA结构的拓扑特性，即属。RNA结构的属定义为最小g，使得盘图可以在属为g的曲面上绘制且没有交叉弧。无假结结构的属为零。对于串联结构和嵌套结构，属是两个子结构的属之和。利用这种递归结构形成，Gfold使用动态规划实现。属的概念可以用于对包括复杂假结在内的RNA二级结构进行拓扑分类，并预测RNA序列中二级结构的数量。


    [77]使用SCFG对假结进行了另一种预测尝试。首先使用SCFG预测子结构，然后将其组合以预测假结和其他基序。该算法时间效率高，但只能应用于与算法使用的训练序列匹配的同源RNA序列。


    ## 6.5 整数规划技术


    整数规划是一种基于线性规划的技术，定义为在整数变量上受一组线性约束的线性函数优化。[40]将RNA带假结结构预测问题定式为整数规划问题。目的是最小化反映输入RNA序列折叠结构热力学自由能的目标函数值。假结的内部碱基对在形成该假结的螺旋打开之前打开。使用整数规划进行假结预测的优势在于，一旦预测问题通过整数规划建模，CPLEX软件[78]、LINDO
    API 6.0 [79]等各种整数规划软件系统可用于求解整数规划问题。该模型仅对短长度RNA序列表现出良好的准确性性能。[41]提出了另一种解决RNA假结预测问题的整数规划模型。Sato的模型Ipknot可处理长达500个核苷酸的更长序列。他们在使用整数规划寻找最大期望准确性（MEA）结构时引入了阈值截断概念。引入此阈值截断是为了更快地运行算法。该算法可用于单序列和比较序列分析。使用[60]的参数集时，基于MEA的方法的准确性显著高于使用[14]的参数。[80]通过整数规划对假结进行了另一种预测尝试。碱基对数量最多的结构为输出结构。其输出结构具有最小自由能。它适用于部分假结类。


    ## 6.6 反向折叠技术


    RNA序列的反向折叠是一种不同的概念，即将目标结构转换为RNA序列。它在[39]中提出。INV是传统反向折叠模型的扩展，用于包含规范假结结构预测。这些模型以目标结构作为输入并输出RNA序列。INV是一种局部随机搜索，用于预测非双极结构，即最多有两个交叉的三种非交叉RNA结构。它通过识别特定的环分解来从给定结构获得RNA序列。结构的总能量由其子结构的能量之和计算得出。构成结构的所有序列都可以通过神经网络实现。最近提出了另一种反向折叠模型[81]。该模型使用Fatgraph进行所述转换。Fatgraph将二级结构作为骨架或带状结构，并以顶点关联边的循环顺序。该模型利用无上下文文法和Turner的能量模型来查找目标RNA序列。该模型的复杂度与属的概念相关，因为碱基对时其复杂度是指数级的。


