    # 5.4.7 CLOSED FIVE-CHAIN PSEUDOKNOT


    A closed five-chain pseudoknot is formed by base-pair interactions among five
    H-type loops, as shown in Figure 5.23.


    # 5.4.8 MULTILOOP PSEUDOKNOT


    A multiloop pseudoknot is formed when a stem in a secondary structure encloses
    one or more pseudoknots. A pseudoknot multiloop of tmRNA is shown in Figure 5.24.
    The substructures P1, P2, P3, P4 and P5 are H-type pseudoknots; Stem1 and Stem2
    enclose pseudoknots.


    # 5.4.9 I-TYPE PSEUDOKNOT


    An I-type pseudoknot is the one that involves base pairing between an internal
    loop and a leftover unpaired single-stranded region of a secondary structure.
    An I-type pseudoknot is shown in Figure 5.25.


