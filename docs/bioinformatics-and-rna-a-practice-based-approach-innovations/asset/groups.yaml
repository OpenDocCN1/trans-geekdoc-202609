    vsFold5 make use of biological features like polymer solvent interactions and
    Kuhn length to predict pseudoknots. Kuhn length is a measure of stiffness. The
    said model has the tendency to fold according to the thermodynamically most-probable
    folding pathway. It works for sequence lengths up to 450 nucleotides. The model
    takes as input, RNA sequence, minimum stem length and number of contiguous stems.
    Default values of most of the parameters are given. Polymer model options are
    also given. The output secondary structures are of minimum free energy based on
    Kuhn length, temperature and polymer solvent prominence irrespective of the fact
    that a pseudoknot is present or not. Pseudoknot structures have been categorized
    as core pseudoknots and extended pseudoknots. Extended pseudoknots are formed
    after secondary structures are formed, while core pseudoknots are formed before
    the formation of secondary structure.


    The worst case time complexity of vsFold5 corresponds to the sequence length.
    In this model, automated estimation of Kuhn length is an important factor. Also,
    their future work will be to accommodate parameters such as protein interactions,
    sub-optimal structures, etc. Another iterative model, Cyclofold [70], was proposed
    in 2010. This model folded the RNA sequence by choosing the helices iteratively
    on the basis of free energy. It also checked steric feasibility of these chosen
    helices to improve accuracy. Steric feasibility relates to the energy produced
    by atomic distance in a molecule. It can predict pseudoknots of many types. Another
    model, NanoFolder, was proposed in 2011 [71]. This model focuses on multi-strand
    RNA secondary structures with multiple crossing arcs. Scoring function uses base-pair
    stacking energy. A penalty score is introduced for base pairs amongst similar
    strands. The penalty score amongst two different strands is calculated from the
    training set. The model collects all the helices with base pairs and calculates
    their score. Nanofolder takes input as an RNA sequence in FASTA format and outputs
    the most probable structure, only in Dot-bracket notation. It is available at
    https://matchfold.ncifcrf.gov.


    # 6.4 FORMAL GRAMMAR TECHNIQUE


    Formal grammar based pseudoknot prediction models are mathematical models based
    on formal grammar. Formal grammar is being used to predict the presence of a pseudoknot
    in an RNA sequence [37]. Different types of grammar like context free grammar,
    Multiple Context Free Grammar (MCFG) and Stochastic Context Free Grammar (SCFG)
    have been used to predict pseudoknots. The inclusion relationship between context
    free language, regular language, tree adjoining language, multiple context free
    language and many more grammars have been presented by authors of [72]. Most of
    these grammars are elaborated in Chapter 7.'
