    # 6 Pseudoknot Prediction Techniques


    Predicting the secondary structure of RNA helps to understand its function. RNA
    secondary structure has been predicted by various algorithms [13–17]. RNA secondary
    structure prediction started with the concept of base-pair maximization [18] in
    which prediction is based on the maximum number of base pairs in the structure.
    The prediction is based on dynamic programming wherein the given problem is solved
    by a divide-and-conquer policy. The problem is divided into sub-problems recursively.
    The sub-problem at the lowest level is then solved. The solutions of sub-problems
    are used to find the solution of the given problem recursively.


    ```

    S(p, r) = max { S(p, r - 1) max (S(p, q - 1) + S (q + 1, r - 1) + 1) p < q < r
    }

    ```


    The recurrence relation, as shown above, has been used to solve the RNA secondary
    structure prediction problem. S(p, r) denotes the RNA secondary structure prediction
    problem where p and r denotes the first and last nucleotide or base of the RNA
    sequence to be folded into a secondary structure. The problem S(p, r) is recursively
    divided into sub-problems S(p, q – 1) and S(q + 1, r) where q denotes a base that
    is somewhere between p and r in the RNA sequence. The sub-problem S(p, r – 1)
    denotes that the base r is not paired with any other base in the RNA sequence.
    In case r is paired, the problem is divided recursively into multiple sub-problems.
    The final RNA secondary structure is predicted by solving the sub-problems and
    recursively adding their solutions to build the total solution. Base-pair maximization
    laid the foundation for another technique called a thermodynamic energy model
    [12]. In this technique, the estimated energy parameters of sub-structures of
    RNA secondary structure are added to find the total energy of an entire secondary
    structure. The secondary structure with a minimum value of thermodynamic energy
    is considered the optimal secondary structure.


    The energy model of [12] was further improved by [18]. Formal grammar techniques
    were also used to predict RNA secondary structures. An attempt was made in 2003
    to predict a pseudoknot using stochastic context-free grammar [19]. This model
    uses homologous RNA sequences and their phylogenetic trees as input. The model
    used the CYK algorithm and an inside-outside algorithm to generate the output
    structures. Their web server is available at www.daimi.au.dk/ ~compbio/pfold.
    The model claims to produce high-quality results. The motifs that have been predicted
    in the secondary structure are hairpin loop, stacked pair, bulge loop, internal
    loop and junction. Various motifs in RNA are conserved in'
  - '[PAGE 106]


    structure i.e. even if two RNA sequences are different, they may contain the same
    motif. Like other motifs, a pseudoknot is also a significant motif in an RNA secondary
    structure. Pseudoknots perform crucial functional roles like alteration of gene
    expression by inducing ribosomal frame shifting, regulation of translation and
    splicing, mimicry and selinocystein biosynthesis. So, pseudoknots cannot be ignored
    for structural and functional analysis of RNA. Also, comparative sequence analysis
    approach for secondary structure prediction has revealed conserved pseudoknots
    e.g. in rRNAs, ribonuclease P RNAs and tmRNA. The structural, functional and sequence
    data on pseudoknots have been gathered in databases like PseudoBase [20], RFAM,
    etc. [21] Pseudoknot prediction models can be categorized into seven categories
    on the basis of literature survey. These categories are dynamic programming models,
    comparative approach-based models, heuristic models, formal grammar models, inverse
    folding models, integer programming models and soft computing models.


    The most popular category model for an RNA secondary structure prediction including
    pseudoknots is dynamic programming [22–27]. Dynamic programming models require
    estimation of energy terms contributing to a secondary structure iteratively.
    Unfortunately, dynamic programming models demand huge time and memory requirements.
    It is NP-hard to predict RNA secondary structures with arbitrary pseudoknots by
    free energy minimization. Therefore, some models use a modified form of dynamic
    programming [28,29]. The model proposed by [28] is a modification of dynamic programming
    for sequence alignment algorithm. The model proposed by [29] is a sparsification
    algorithm that introduces the concept of sparsification of matrices used in dynamic
    programming algorithm in order to reduce space and time requirements. The second
    category of models for a pseudoknot prediction is comparative analysis [30,31].
    Comparative models use covariance score based on maximum weighted matching concept.
    They are reliable methods but their performance depends on accuracy of alignment
    of homologous sequences. However, they can work well for long sequences. The third
    category of Pseudoknot prediction models is heuristics [32,33]. Heuristic techniques
    are applied in an ad hoc manner. These models execute fast as compared to dynamic
    programming models but they do not guarantee the optimality of structure. The
    fourth category focuses on a pseudoknot prediction based on formal grammar [34–38].
    RNA secondary structure prediction using grammar is viewed as a parsing problem.
    The fifth category is inverse folding models [39]. An inverse folding model takes
    as input the target structure and outputs the RNA sequence. The sixth category
    is integer programming models [40,41]. These models use pre-built integer programming
    software for carrying dense calculations. For this reason, these algorithms can
    be applied on longer sequences. Recently, researchers have tried to solve the
    pseudoknot prediction problem with soft computing techniques like support vector
    machine [42], neural networks [43], genetic algorithms [44] and neural networks
    [45]. These are the techniques that are generally needed to be combined with some
    other approach like dynamic programming to solve the prediction problem. Various
    other soft computing techniques to realize an RNA secondary structure have been
    discussed in [46].'
