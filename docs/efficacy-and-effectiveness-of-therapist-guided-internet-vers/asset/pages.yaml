    # ## Introduction


    Meta-analyses of available randomised controlled trials (RCTs) indicate that therapist-guided,
    internet-delivered cognitive behavioural therapy (iCBT) is a similarly effective
    treatment compared with the more costly and traditional face-to-face CBT (fCBT)
    for psychiatric disorders.1,2 Much of the cost differential between therapist-guided
    iCBT and fCBT derives from therapists'' differential time investment per patient.


    However, a meta-analysis3 found no association between contact time and treatment
    effect in psychotherapy for depression. When people are directed to digital therapy
    supported by a therapist, their expectations of benefit are comparable to face-to-face
    therapy.4 People with depression might benefit from therapist-guided iCBT and
    fCBT regardless of their symptom severity at intake.5,6 However, some clinicians
    might find it difficult to accept the idea that'
