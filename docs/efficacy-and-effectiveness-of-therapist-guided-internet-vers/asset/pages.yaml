    psychotic or neurological behaviours, personality disorder, or chronic or bipolar
    depression. The suitability for either treatment was assessed by the attending
    physician. All guided iCBTs were delivered with the same online programme that
    aligns with CBT principles (including third-wave techniques such as mindfulness):
    the patient proceeds at their own pace while asynchronously talking with a trained
    therapist (e.g., a psychologist or a nurse), who also provides unprompted guidance
    and an occasional telephone call (ideally one per patient per programme). The
    time spent by a therapist per patient as recommended by the HUS Helsinki University
