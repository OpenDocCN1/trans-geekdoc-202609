    Patients were recommended by the HUS Helsinki University Hospital to complete
    one session per week and they could proceed more slowly or faster, up to one session
    per day. Not progressing in 2 weeks led to a call from the therapist and, ultimately,
    cessation of treatment if progress did not ensue despite encouragement.


