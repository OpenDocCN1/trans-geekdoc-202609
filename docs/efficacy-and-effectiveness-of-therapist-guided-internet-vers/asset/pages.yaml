- pgno: 4
  md: 'decline of at least 1·7 points being subjectively detectable as the patient
    “feeling better”.²² We computed treatment response as the change in PHQ-9 score
    from baseline to the last measurement immediately after treatment, denoted change
    in PHQ-9; we did not focus on the automated follow-ups conducted 3 months after
    iCBT. If a patient discontinued the treatment after providing a single measurement,
    a change in PHQ-9 of 0 was assigned to that patient (proceeding in the iCBT programme
    required symptom reports; fCBT therapists were only advised to encourage patients
    to report). This conservative approach effectively penalises treatments with high
    dropout rates compared with complete-data or imputation analysis.


    # Statistical analysis


    Both the fCBT and the iCBT registries also recorded overall anxiety severity and
    impairment scale scores, allowing us to use this continuous-valued score as a
    baseline predictor of the outcome.²³ Other predicting variables were drawn from
    the multiple linked administrative registries (figure 2B). For privacy and variance
    reduction, we only included categorical covariates that resulted in cell sizes
    ten observations or above when cross-tabulated with treatment allocation.


    We arrived at our sample by taking all eligible patients from the register. Our
    aim was to estimate the ATE between fCBT and guided iCBT. An estimate with a 95%
    CI no wider than 1·7 PHQ-9 points can be considered accurate in the sense of falling
    below a previously estimated detection threshold between “feeling better” versus
    “feeling the same” as before treatment.²²


    For TMLE, we implemented super learners with a broad set of base learners (examples
    6 and 7 in Philips and colleagues’ article⁴), including generalised linear models,
    Bayesian generalised linear models, generalised additive models, lasso, elastic
    net and ridge regressions, polynomial splines, multivariate regression splines,
    extreme gradient boosting, Bayesian additive regression trees, and highly adaptive
    lasso.²⁴⁻²⁷ TMLE requires two super learners, one predicting treatment allocation
    and another predicting treatment outcome.³¹⁴ Our super learners used cross-validation
    to automatically assign weight to the base learners with the non-negative least
    squares regression algorithm, with a guarantee of asymptotically better performance
    compared with the base learners.¹⁵,²⁴ We used the super learners to construct
    an estimate for ATE, using TMLE to optimise the bias-variance trade-off for the
    ATE parameter.¹³,²⁶ Thus, TMLE controlled for confounding by variables and their
    machine-learned, non-linear combinations and interactions. We followed the online
    and published guidance by Philips and colleagues²⁴ and van der Laan and colleagues,²⁶
    using their tlverse R environment, including packages sl3 (version 1.4.4), tmle3
    (version 0.2.0), and cvAUC (version 1.1.4). This method implied nested ten-fold
