    # Choice of primary measure


    As the primary outcome, we used the change in PHQ-9 score, a widely used and translated,
    brief, public-domain measure with good psychometric properties.20,21 PHQ-9 scores
    range from 0 to 27, with higher scores indicating more severe or more frequent
    symptoms, and with a'
