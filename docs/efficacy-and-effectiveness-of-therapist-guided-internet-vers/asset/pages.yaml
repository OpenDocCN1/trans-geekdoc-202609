  md: '(ie, no other versions of the treatments), no interference (ie, a patient’s
    outcome does not depend on the other patients), and positivity (ie, a positive
    probability for ending up in both iCBT and fCBT for all predictor covariate values).
    Finally, one should accurately capture forms of the dependencies indicated by
    the arrows in figure 1. Some methods need accuracy for both A and B dependencies,
    whereas doubly robust methods can achieve consistent estimates with only As or
    B and Az correctly modelled. Even methods not doubly robust might be preferred
    over naive regression analysis approaches, which are biased whenever the non-flexible
    parametric model is mis-specified relative to reality. Even application of mis-specified
    models that miss some covariates tends to provide more accurate estimates than
    naive approaches that estimate ATE with simple regression or mean difference.


    ![](img/c9d570007c2690fe63b1c193790b6bf2_2_0.png)


    A targeted maximum likelihood estimator (TMLE) based on super learners has the
    asymptotic double-robustness property, but it is additionally efficient, well
    defined, and well behaved in finite samples. A TMLE integrates features from modern
    statistics, machine learning, and causal inference. A TMLE can optimise the bias-variance
    trade-off for a target parameter (eg, ATE) instead of the treatment-prediction
    and outcome-prediction models. The primary motivation to use a TMLE is its ability
    to combine multiple desirable properties, perhaps representing the state of the
    art in covariate-based counterfactual causal inference. The availability of such
    procedures enhances the value of administrative, population-based registries,
    which often contain abundant aetiological information.


    people received for depression in the HUS-iCBT registry largely corresponds to
    a form of guided iCBT that we have previously investigated but represents a more
    modern iteration of the online platform with the same therapy form. The HUS-iCBT
    registry recorded patients from Dec 12, 2018, to Dec 22, 2022, and the FPQR from
    Aug 28, 2018, to Sept 28, 2022; however, all the patients in our research sample
    were registered at HUS before Jan 1, 2022. HUS was the only public-sector, nationwide
    iCBT provider, but it provided fCBT mainly for Uusimaa, the southwest region of
    Finland. For maximal comparability across different delivery formats for CBT for
    depression, we sampled patients from these registries according to the flowchart
    in figure 2A.


    Developments in Nordic countries enable the linking of psychotherapy data with
    information in national registries. In this study, we used TMLE on these rich
    information sources to estimate the efficacy difference between therapist-guided
    iCBT and fCBT in a causally informative design that is not an RCT, thus circumventing
    typical challenges of RCTs while providing evidence on the same causal question.
    Our naturalistic data inform about effectiveness, and the counterfactual analysis
    informs about both effectiveness and efficacy if all real patients would receive
    fCBT versus guided iCBT. The new gold standard for evidence will then consist
    of combined inferences from RCT meta-analyses and TMLE applied to naturalistic
    datasets. Our investigation serves as a pragmatic proof of concept for the use
    of TMLE and related methods to address the question of the ATE between fCBT and
    therapist-guided iCBT.


    Each patient from both registries was linked with other national registries using
    their social-security identification number. The national Findata Data Permit
    Authority and the Digital and Population Services Agency linked the patients with
    their relatives (parents and siblings), after which both the patients and their
    relatives were linked with data from other registry owners (figure 2B). The registries
    contain accurate event dates for public-sector diagnoses and pharmaceutical purchases
    (eg, F codes and Anatomical Therapeutic Chemical-nervous system codes), but not
    private-sector diagnoses. Our research permission was granted by Findata according
    to national rules and regulations on secondary use of social and health data (permissions
    THL/4810/14.02.00/2020 and THL/1303/14.06.00/2023 to THR). These permissions relinquish
    the requirement for informed consent. This study was conducted in accordance with
    the Sixth World Medical Association Declaration of Helsinki and evaluated by the
    Ethics Committee of HUS (HUS/1861/2020 and HUS/3150/2020). The study was not pre-registered
    elsewhere.


    # Methods


    # Study design and participants


    The study participants of this counterfactual inference-based cohort study were
    derived from naturalistic hospital treatment registries—the HUS Helsinki University
    Hospital iCBT (HUS-iCBT) registry and the Finnish Psychotherapy Quality Register
    (FPQR). The iCBT that


