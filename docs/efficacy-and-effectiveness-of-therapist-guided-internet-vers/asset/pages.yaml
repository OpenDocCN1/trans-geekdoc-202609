    # Discussion


    We found no mentionable difference between treatment effectiveness in guided iCBT
    versus fCBT for depression. This finding was consistent across raw data from hospital
    registries and multiple causal-effect estimates that retrospectively balanced
    the treatment groups. Our findings encourage wider dissemination of cost-effective
    and cost-efficacious guided iCBTs.


    Our findings need to be interpreted with consideration of some limitations. First,
    the methods used achieve causal inference when relevant confounders are observed.
    Hence, we strived to include much registry-based background information and interpreted
    the results relative to RCTs. Nevertheless, variables missing from our set, such
    as digital affinity, could be of future interest, as could more accurate temporal
    and follow-up analyses. Second, the fCBT and guided iCBT treatments had qualitative
    differences other than delivery method. The fCBTs were an outsourced service from
    public mental health care, produced in private practices by licensed psychotherapists.
    In contrast, the trained iCBT therapists were employees in psychiatric speciality
    care (eg, psychologists and nurses), but not necessarily licensed psychotherapists.
    The fCBT therapists could adjust the treatment specifics during the treatment,
    whereas the online platform largely standardised the iCBT programme. On average,
    people having fCBT had more treatment sessions than those having iCBT. However,
    the number of sessions was found to be uncorrelated with effect sizes in past
    trials.³ Third, the study was not pre-registered. However, sensitivity analyses
    showed a robustness of the results to many alternative analytical choices. Fourth,
    although HUS-iCBT clinical development extensively collaborates with individuals
    with lived experience, these individuals were not involved in this research specifically.
    Including their perspectives in future research might add valuable insights.


    Finally, many more patients who were given guided iCBT dropped out from their
    treatment programme compared with the patients given fCBT. We accounted for these
    patients by using the last measurement taken before dropping out to compute the
    treatment outcome. Thus, iCBT was heavily penalised for the amount of dropout.
    Patients dropping out without a second


    measurement were recorded as having no change in their PHQ-9 score, which is lower
    than the average spontaneous recovery that occurs while on a waiting list.²⁹ Furthermore,
    one does not always attach a special clinical meaning to dropping out from treatment.
    For example, the stepped-care model might improve treatment outcomes by starting
    patients with a low-intensity treatment and by subsequently stepping those who
    do not respond to treatment up to a higher-intensity treatment.³⁰ We found that
    the average symptom change (both ATE and raw data) that included those who discontinued
    was no worse for iCBT than for fCBT, and iCBT had fewer treatment sessions in
    general. Thus, when dropout is not considered a primary indicator of treatment
    failure, iCBT provided similar treatment outcomes to fCBT, but reached these results
    more quickly.


    Our study provides important additional support for guided iCBTs. Research has
    shown guided iCBTs to attain similar effects to fCBT in RCTs and in their meta-analyses
    (ie, efficacy).¹² We complemented this evidence by showing that an iCBT programme
    attained similar effects to fCBT also in naturalistic settings (ie, effectiveness)
    and when the naturalistic patients were statistically balanced across the treatments
    (ie, efficacy and effectiveness triangulated). The analytical frameworks of experiments
    (eg, RCTs) and counterfactual causal inference (eg, TMLEs) build on different
    assumptions but provide consistent evidence. Conceptually, such a situation of
    causal triangulation is considered the best-case scenario in modern causal-inference
    literature,³¹ because guaranteeing the assumptions of any single method, including
    RCTs, is difficult, whereas guaranteeing that multiple methods did not all fail
    in distinct ways to provide the same, yet biased, finding is easier. If accepting
    equal treatment effects, a treatment that takes an average of 77 min of therapist
    time (iCBT) should be more cost-effective than a treatment that takes an average
    of 840 min of therapist time (fCBT); iCBT could therefore be 11-times more cost-effective.


    Given the consistency of the present and past findings across various approaches
    to evaluating the efficacy of iCBT versus fCBT, our study offers reassurance regarding
    the validity of the analytical frameworks used. Similar formal methods for causal
    inference might represent cost-effective means for detecting active treatment
    components and predictors in mental health research in which confounding issues
    are pronounced.


    We conclude that, for depressive disorders, evidence from RCTs, naturalistic studies,
    and quasi-experimental research all show similar treatment efficacy and effectiveness
    between guided iCBT and fCBT. Consequently, an internet delivery of short first-line
    treatments emerges as a cost-effective and scalable default treatment option.
    Nevertheless, maintaining a range of treatment alternatives remains important,
    considering the less-than-optimal efficacy of all available treatments,⁸ special
    needs, and the emerging opportunities in treatment targeting.'
