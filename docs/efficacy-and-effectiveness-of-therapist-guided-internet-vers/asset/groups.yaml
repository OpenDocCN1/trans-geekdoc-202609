    ## Role of the funding source


    The funder of the study had no role in study design, data collection, data analysis,
    data interpretation, or writing of the report.


    ## Results


    A total of 32 343 registry entries were assessed for eligibility, with 8417 coming
    from the FPQR and 23 926 from the HUS-iCBT registry. 8025 entries from the FPQR
    and 18 459 from the HUS-iCBT registry were excluded, resulting in a total of 392
    patients from the FPQR, forming the fCBT group, and 5467 patients from the HUS-iCBT,
    forming the iCBT group, for naturalistic analyses (figure 2A). 25 patients were
    missing baseline data and were removed from counterfactual analyses for the primary
    outcome, resulting in 388 (99 [26%] male and 289 [74%] female) patients in the
    fCBT group and 5446 (1634 [30%] male and 3812 [70%] female) in the iCBT group
    (figure 2A). Four (<0.01%) of 40 263 patients whose data we accessed had objected
    to the use of their registry data by Findata (present inclusion criteria unknown;
    some of the accessed registers were not included in this study but could have
    contained the objecting four patients).

    Four (1%) of 392 patients from the fCBT group and 21 (<1%) of 5467 patients from
    the iCBT group were missing mostly demographic baseline data. Table 1 summarises
    treatment group characteristics at baseline, after removing these 25 patients
    (other missingness pertaining to treatment dropout did not affect table 1). The
    mean age of patients in the final analytic fCBT group was 40 years (SD 16; median
    36 years [IQR 28–51]) and 363 (94%) of 388 spoke Finnish as their native language.
    In the final guided iCBT group, the mean age was 34 years (SD 12; median 31 years
    [IQR 25–42]) with 5092 (93%) of 5446 speaking Finnish as their native language.

    A mean of 9.4 weeks (SD 3.5) passed between baseline and the last follow-up assessment
    in guided iCBT for those who completed the last session and 7.7 weeks (4.4) for
    all patients (including patients whose first and last measurements were the same
    one). We estimated a mean interval of 35 weeks (22.9) between the reported start
    and end dates of the fCBT therapy period; this estimate was based on less accurate
    data reported to the outsourcing registry owner (in contrast, the iCBT programme
    automatically collects and dates data).

    In the analytic iCBT group, there was a mean of 5.5 (SD 2.1; median 7.0 [IQR 4.0–7.0])
    treatment sessions. In the fCBT group, reporting the number of sessions was not
    obligatory due to a coupon system that predefined the number of HUS-paid sessions;
    therefore, these data were only available for 352 (91%) of 388 patients (mean
    12.3 [SD 9.8]; median 14.0 [IQR 2.0–20.0]). Of the 5467 people given iCBT, those
    who finished the treatment by reaching the seventh session (3333 [61%]) reported
