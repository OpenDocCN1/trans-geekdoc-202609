    ## Contributors


    THR 撰写了报告初稿并进行了数据分析。SES、SIS、JT 和 J-HS 对稿件进行了关键修改并接受了最终版本。THR、SES 和 JT 已访问并独立验证了研究数据，数据收集由
    Findata 和 HUS 及 Tietoallinto 的行政人员监督；相应注册登记的所有者已验证了原始注册数据。只有 Findata 机构有权访问完整的个人数据，而
    THR、SES 和 JT 仅访问了去标识化的研究数据，这些数据在咨询国家数据保护专员办公室后由 Findata 机构预处理。THR 和 JT 独立验证并重新计算了所有自然观察的结果。THR
    进行了机器学习，代码在附录 2（第 22–29 页）。THR 和 JT 进行了数据整理和正式分析。THR、SES 和 J-HS 进行了调查。THR 创建了方法学并进行了项目管理。THR、SES
    和 J-HS 筹措了资源。THR 和 JT 确定了软件并编写了脚本。THR 和 SES 监督了项目。THR 进行了项目可视化。所有作者审阅并编辑了稿件并进行了文献检索。所有作者都完全访问了研究中的所有数据，并对提交发表的决定负有最终责任。


    ## Declaration of interests


    我们声明不存在竞争性利益。


    ## Data sharing


    根据芬兰立法，去标识化的研究数据可提供给获得 Findata 社会和健康数据许可机构（https://findata.fi/en/）许可的研究人员，该机构的活动基于《健康和社会数据二次使用法》。作者无权直接与第三方共享数据。分析脚本可在附录
    2（第 22–29 页）中找到。


    ## Acknowledgments


    本研究得到芬兰研究委员会（又称芬兰学术院）的支持，授予 THR 和“机器学习心理治疗因果因素”项目的编号为 334057、335901 和 3558138
    的基金。我们感谢 Ville Ritola 对稿件早期版本的意见。SES 得到芬兰社会保险机构（Kela 140/331/2021）的支持。


