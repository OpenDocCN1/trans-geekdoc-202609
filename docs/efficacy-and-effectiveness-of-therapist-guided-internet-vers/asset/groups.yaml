    两组的平均 PHQ-9 评分均在中度抑郁的评分范围内（表 1）。总体而言，被转诊至 fCBT 的抑郁症患者与被转诊至 iCBT 的患者有所不同（表 1 第三列）。因此，我们计算了
    ATE 估计值，以考察如果所有患者都接受 fCBT 而非 iCBT 时的治疗效果。


    治疗结局和治疗分配的超学习者分别加权了部分不同的基础学习者（即算法），并仅将部分重叠的变量集指定为重要（附录 2，第 13、17 页）。预测治疗分配至 fCBT
    或 iCBT 的模型的交叉验证下曲线面积（AUC）性能指标为 0.77 (95% CI 0.74–0.79)，表明该模型具有信息性（0.5 表示偶然表现，1.0
    表示完美表现）。结局预测模型的交叉验证决定系数（R2）为 0.031（未进行交叉验证时为 -0.06，或 r=0.24）。当我们将结局模型和治疗分配模型定向为
    fCBT 与 iCBT 之间的 ATE 时，结果与自然主义治疗差异接近（表 2）。在所有患者均接受 iCBT 的情景中，PHQ-9 变化结局将与所有患者均接受
    fCBT 时近乎相同，但略好；与 fCBT 组相比，治疗师指导的 iCBT 组 PHQ-9 评分下降多 0.745 分 (95% CI 0.156–1.334)（表
    2）。在将 iCBT 治疗限制在 fCBT 交付区域（即仅限 Uusimaa 居民）以及针对退出的替代性反事实定义时，结果均稳健（表 2）。


    认识到 TMLE 存在特定的黑盒性质（附录 2，第 2–3 页），我们计算了更简单的 ATE 估计值作为敏感性分析。根据超学习者（附录 2，第 17 页）选取了十个最重要的预测因子，并拟合了预测治疗分配的逻辑回归模型和预测
    PHQ-9 变化的线性回归模型（附录 2，第 14–15 页）。分配模型性能明显高于偶然水平（交叉验证 AUC 0.70 [95% CI 0.67 至 0.73]），尽管不如超学习者。结局预测模型的调整
    R2 为 0.03。在移除两个模型中均不显著的预测因子后（附录 2，第 14–15 页），其性能保持相似（交叉验证 AUC 0.70 [0.67 至 0.73]，调整
    R2=0.03）。基于模型的治疗分配逆概率加权改善了 fCBT–iCBT 样本之间的协变平衡（附录 2，第 19 页）。iCBT 和 fCBT 的相似疗效发现对所有方法学选择均稳健：G
    计算 ATE 1.073，AIPTW-ATE 0.735 (95% CI 0.109 至 1.361)，以及简单 TMLE-ATE 0.790 (0.164
    至 1.415)。我们的预测模型未使用基线 PHQ-9，以避免与结局的人工依赖，因为基线 PHQ-9 本身已是结局的一部分。在分配模型中加入基线 PHQ-9
    的敏感性分析对估计值仅有适度影响（G 计算 ATE 1.073，AIPTW-ATE 0.128 [-0.593 至 0.850]，以及简单 TMLE-ATE
    0.114 [-0.569 至 0.797]）。在完整 TMLE 的结局模型和分配模型中均加入基线 PHQ-9 时，估计的 ATE 为 -0.064 (-0.639
    至 0.511)。


    | | 估计值 (PHQ-9 分)* | 估计值的标准误 | 估计值的 95% 置信区间 |

    |---|---|---|---|

    | 所有数据 (n=5834) | | | |

    | 均值的观察差异 (PHQ-9 [fCBT] 变化–PHQ-9 [iCBT] 变化) | 1.120 | 0.312 | 0.509 至 1.731 |

    | 估计的 ATE (PHQ-9 [fCBT] 变化–[PHQ-9 [iCBT] 变化]) | 0.745 | 0.300 | 0.156 至 1.334
    |

    | 仅限 Uusimaa 地区 (n=3461)† | | | |

    | 均值的观察差异 (PHQ-9 [fCBT] 变化–PHQ-9 [iCBT] 变化) | 1.045 | 0.334 | 0.391 至 1.700 |

    | 估计的 ATE (PHQ-9 [fCBT] 变化–PHQ-9 [iCBT] 变化) | 0.636 | 0.326 | -0.002 至 1.276 |

    | 如果所有患者均完成治疗（插补；PHQ-9 [fCBT] 变化–PHQ-9 [iCBT] 变化）的估计 ATE | 1.277 | 0.319 | 0.649
    至 1.905 |

    | 如果所有患者均有第二次测量（插补；PHQ-9 [fCBT] 变化–PHQ-9 [iCBT] 变化）的估计 ATE | 1.070 | 0.333 | 0.414
    至 1.726 |


    表 2：观察到的治疗效果比较与估计的 ATE（因果）差异


    本表呈现的分析未包含基线数据缺失的患者。PHQ-9 评分的负变化表示症状减少。ATE 估计基于带超学习者机器学习的目标最大似然估计器。所有数据和仅 Uusimaa
    地区的结果中，当患者无第二次测量时，PHQ-9 变化设为 0。ATE 估计基于基于缺失 PHQ-9 报告多重插补的反事实；所有数据均用于对所有患者（包括接受
    fCBT 的患者）第 3、5、7 次会话的所有缺失 PHQ-9 数据进行插补。在第一次基于插补的分析中，结局设为从第 1 次到第 7 次的变化。在第二次分析中，结局与完整数据分析相同（即，从首次到最后一次可用测量），但仅将第
    3 次的插补值插入没有任何随访测量的患者中（在完整数据分析中，其变化被视为 0）。ATE=平均治疗效应。CBT=认知行为疗法。fCBT=面对面 CBT。iCBT=互联网交付
    CBT。PHQ-9=患者健康问卷-9。*正向估计表示与 fCBT 相比 iCBT 症状减少更多。†排除其他地区患者，相当于 2373 名接受 iCBT 的患者，因为
    HUS Helsinki University Hospital 芬兰心理治疗质量登记册仅包含在 Uusimaa 提供的 fCBT。


    ## 讨论


    我们在引导式 iCBT 与 fCBT 治疗抑郁症的疗效之间未发现显著差异。该发现与医院登记处的原始数据以及回顾性平衡治疗组的多种因果效应估计一致。我们的发现鼓励更广泛推广成本效益和成本效果佳的引导式
    iCBT。


    我们的发现需要在考虑一些局限性的情况下进行解释。首先，当相关混杂因素被观察到时，所用方法可实现因果推断。因此，我们努力纳入大量基于登记处的背景信息，并将结果与随机对照试验（RCTs）相对照解释。然而，我们变量集中缺失的变量，例如数字亲和力，未来可能值得关注，更精确的时间和随访分析亦然。其次，fCBT
    和引导式 iCBT 除了交付方式外，在定性上也存在差异。fCBT 是公共心理保健的外包服务，由持证心理治疗师在私人诊所提供。相比之下，受过训练的 iCBT
    治疗师是精神病专科护理的员工（例如，心理学家和护士），但不一定是持证心理治疗师。fCBT 治疗师可以在治疗期间调整治疗细节，而在线平台则在很大程度上标准化了
    iCBT 方案。平均而言，接受 fCBT 的人接受的治疗次数多于接受 iCBT 的人。然而，过去的试验发现，治疗次数与效应大小无相关性。³ 第三，本研究未预先注册。然而，敏感性分析表明结果对多种替代分析选择具有稳健性。第四，尽管
    HUS-iCBT 临床开发广泛与有亲身经历的个体合作，但这些个体未专门参与此项研究。在未来研究中纳入其观点可能会提供有价值的见解。


    最后，与接受 fCBT 的患者相比，接受引导式 iCBT 的患者退出治疗方案的人数多得多。我们通过使用退出前最后一次测量来计算治疗结局，从而纳入了这些患者。因此，iCBT
    因退出率较高而受到严厉惩罚。没有第二次测量即退出的患者被记录为 PHQ-9 评分无变化，这低于等待名单上平均发生的自发性恢复。²⁹ 此外，退出治疗并不总是具有特殊的临床意义。例如，阶梯式护理模式可能通过让患者从低强度治疗开始，并随后将对治疗无反应的患者升级到高强度治疗来改善治疗结局。³⁰
    我们发现，包括停药患者的平均症状变化（ATE 和原始数据）对 iCBT 并不比对 fCBT 更差，且 iCBT 通常治疗次数更少。因此，当退出不被视为治疗失败的主要指标时，iCBT
    与 fCBT 提供了相似的治疗结局，但达成这些结果的速度更快。


    我们的研究为引导式 iCBT 提供了重要的额外支持。研究表明，引导式 iCBT 在随机对照试验及其荟萃分析中可与 fCBT 达到相似疗效（即效能）。¹² 我们通过证明
    iCBT 方案在自然主义环境中也可与 fCBT 达到相似疗效（即效果），并且当自然主义患者在治疗之间进行统计平衡时（即效能和效果三角验证）也是如此，来补充这一证据。实验（例如
    RCTs）和反事实因果推断（例如 TMLEs）的分析框架基于不同的假设，但提供了相一致的证据。概念上，这种因果三角验证的情况被视为现代因果推断文献中的最佳情景，³¹
    因为保证任何单一方法（包括 RCTs）的假设都很困难，而保证多种方法未以不同方式同时失效以得出相同但偏倚的发现则更容易。如果接受治疗效果相等，平均耗时 77
    分钟治疗师时间的治疗（iCBT）应比平均耗时 840 分钟治疗师时间的治疗（fCBT）更具成本效益；因此 iCBT 的成本效益可能高出 11 倍。


    鉴于当前和过去的研究结果在评估 iCBT 与 fCBT 效能的各种方法中保持一致，本研究对所用分析框架的有效性提供了保证。类似的因果推断正式方法可能代表在精神健康研究中检测活性治疗成分和预测因子的一种成本效益手段，在该领域混杂问题尤为突出。


    我们得出结论，对于抑郁症，随机对照试验、自然主义研究和准实验研究的证据均显示引导式 iCBT 与 fCBT 之间具有相似的治疗效能和效果。因此，互联网交付的短期一线治疗成为一种成本效益高且可扩展的默认治疗选择。尽管如此，考虑到所有现有治疗的效能均不理想，⁸
    特殊需求以及治疗靶向的新兴机遇，保持一系列治疗替代方案仍然重要。


