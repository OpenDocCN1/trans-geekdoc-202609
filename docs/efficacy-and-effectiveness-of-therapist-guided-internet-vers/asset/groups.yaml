    ## 引言


    现有随机对照试验（RCT）的荟萃分析表明，对于精神障碍，治疗师指导的互联网认知行为疗法（iCBT）作为一种治疗方法，与更昂贵且传统的面对面认知行为疗法（fCBT）同样有效。1,2
    治疗师指导的iCBT与fCBT之间大部分成本差异源于治疗师每名患者投入时间的差异。


    然而，一项荟萃分析3发现，在抑郁症心理治疗中，接触时间与治疗效果无关联。当人们被引向接受治疗师支持的数字疗法时，其获益预期与面对面疗法相当。4 抑郁症患者无论入院时症状严重程度如何，都可能从治疗师指导的iCBT和fCBT中获益。5,6
    然而，一些临床医生可能难以接受以下观点：


    ## 研究背景


    ### 本研究前的证据


    多项荟萃分析表明，认知行为疗法（CBT）在以指导的互联网认知行为疗法（iCBT）形式实施时，与以常规面对面认知行为疗法（fCBT）形式提供时，在治疗抑郁障碍方面同样有效。因为指导的iCBT项目使用自动化视频和练习，在线治疗师每名患者花费的时间远少于面对面治疗师，这可以带来显著的成本节约。然而，荟萃分析依赖于随机对照试验（RCT），且仍存在试验可能无法代表完整常规治疗人群，或无法充分解释fCBT与指导iCBT之间治疗依从性或其他差异的巨大差距的可能性。在过去几十年中，使用互补的因果信息来源在医学领域得到了越来越多的推荐。这种因果三角验证的先进方法之一是使用机器学习的目标最大似然估计。我们在PubMed（MEDLINE）中搜索了从数据库建立之日起至2024年9月16日发表的论文，不限语言，使用的搜索词为：“目标最大似然”
    AND 抑郁症 AND（“互联网” OR “数字”）AND（“认知行为疗法” OR “认知行为疗法”），未获结果。第二次搜索，将“目标最大似然”替换为“因果三角验证”或“因果性”或“准实验”，也未获结果。总体而言，鉴于抑郁障碍及其治疗所伴随的巨大社会和货币成本，这共同意味着需要全面了解看似低成本治疗政策的健康影响，因此对抑郁症治疗中fCBT-iCBT效果差异的因果三角验证非常重要。


    ### 本研究的附加价值


    据我们所知，本研究是首个以非RCT或RCT荟萃分析的形式，定量评估fCBT与指导iCBT之间疗效差异的研究。我们使用了基于目标最大似然机器学习的反事实因果推断，以及来自五个不同登记册所有者的唯一关联登记册，依据芬兰关于健康和社会登记册二次使用的法律法规进行整合。这种目标方法可以整合参数和非参数方法的特点，在数据复杂且可能包含多个混杂因素的情况下，提供精确可靠的因果效应估计。我们观察到，随机对照试验的结果在常规收集的数据和事后平衡（即因果信息性）数据中均成立：在治疗前后（或最后一次可用测量）抑郁症状下降方面，指导的iCBT方案与fCBT一样有效和效果良好。


    ### 所有可用证据的启示


    治疗师指导的iCBT在治疗抑郁症方面与面对面提供方式同样有效，且更具成本效益。互联网提供的短期一线治疗是一种合理的默认治疗选择，也是回应高服务需求的恰当方式。


    部分自动化治疗可能产生与面对面疗法同样有效的治疗结果。风险在于，临床医生可能会无意中将其态度传递给患者，从而可能导致治疗效果降低。4 随机对照试验并不总是代表常规临床实践，这可能会高估效果估计值。7,8
    例如，反对数字治疗的人可能不会参加提供iCBT的随机对照试验。此外，与登记册相比，随机对照试验的样本往往较小。虽然荟萃分析通过合并随机对照试验来获得更大样本，但它们常常缺乏与人们状况的复杂性及其他可能影响代表性的背景因素相匹配的全面数据。因此，治疗师指导的iCBT在现实世界中是否真的与fCBT一样有效仍不明确。核心的反事实问题是：如果我们能够将相同患者的精确副本同时分配给指导iCBT和fCBT并比较其疗效，平均治疗效应（ATE）是否仍会相似？尽管被视为金标准，随机对照试验既不是唯一的也不是避免混杂以平衡干预组构成的完美方法。医学、心理学和统计学领域的研究者认为，可靠的因果推断通常需要多种证据来源，而非仅限于随机对照试验。9–11
