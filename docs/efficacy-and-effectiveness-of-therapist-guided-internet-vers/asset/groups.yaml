    therapist-guided iCBT, with symptoms measured by the Patient Health Questionnaire-9
    (PHQ-9). If only one PHQ-9 report was recorded, no change was recorded, thereby
    penalising dropout. For an optimal and robust (a posteriori-balanced) ATE estimate,
    we applied targeted maximum likelihood machine learning. There was no involvement
    of individuals with lived experience in the research and writing process.


    ### Findings


    The guided iCBT registry recorded patients from Dec 12, 2018, to Dec 22, 2022,
    and the fCBT registry spanned Aug 28, 2018, to Sept 28, 2022. From the total of
    32 343 registered therapies, 392 people were included from the fCBT registry and
    5467 people from the iCBT registry. Four people in the fCBT group and 21 in the
    guided iCBT group had missing baseline data, therefore the main sample for analysis
