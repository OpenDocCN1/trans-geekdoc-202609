    lower costs. However, RCTs are not always representative of routine practice,
    which could inflate effectiveness estimates. We combined rich data with counterfactual
    causal statistical reasoning to provide an fCBT–iCBT comparison complementary
    to RCTs.


    ### Methods


    In this retrospective cohort study, we linked full archived therapist-guided iCBT
    and fCBT cohort registries with multiple Finnish social and health care registries.
    The therapist-guided iCBT programme with third-wave principles and the fCBTs were
    provided by HUS Helsinki University Hospital to people with depression without
