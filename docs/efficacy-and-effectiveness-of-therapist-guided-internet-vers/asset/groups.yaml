    # Research in context


    # Evidence before this study


    Multiple meta-analyses indicate that cognitive behavioural therapy (CBT) is equally
    efficacious in treating depressive disorders when implemented as guided internet-delivered
    CBT (iCBT) compared with when delivered as the usual face-to-face CBT (fCBT).
    Because guided iCBT programmes use automated videos and exercises, online therapists
    can spend much less time per patient compared with face-to-face therapists, which
    can lead to significant costs savings. However, the meta-analyses rely on randomised
    controlled trials (RCTs), and the possibility remains that the trials do not represent
    the full routine-treatment population, or adequately account for the large differences
    in treatment adherence or other differences between fCBT and guided iCBT. Over
    the past few decades, the use of complementary sources of causal information has
    been increasingly recommended for all of medicine. One of the state-of-the-art
    methods for such causal triangulation is the targeted maximum likelihood estimation
    with machine learning. We searched PubMed (MEDLINE), with no language restrictions,
    for papers published from database inception to Sept 16, 2024, using the search
    terms: “targeted maximum likelihood” AND depression AND (“internet” OR “digital”)
    AND (“cognitive behavioural therapy” OR “cognitive behavioural therapy”), yielding
    no results. A second search, replacing terms “targeted maximum likelihood” with
    “causal triangulation” or with “causality”, or with “quasi-experiment”, also gave
    no results. Overall, causal triangulation of the fCBT-iCBT efficacy differential
    in depression treatment is important


    given the substantial societal and monetary costs associated with depressive disorders
    and their treatment, which jointly imply a need to comprehensively understand
    the health effects of seemingly low-cost treatment policies.


    # Added value of this study


    To our knowledge, this study is the first to evaluate quantitatively the efficacy
    differential between fCBT and guided iCBT in a format that is not an RCT or a
    meta-analysis of RCTs. We used counterfactual causal inference using targeted
    maximum likelihood machine learning and a unique linked registry from five distinct
    registry owners, combined using Finnish laws and regulations on secondary use
    of health and social registries. This targeting method can integrate features
    from both parametric and non-parametric methods to provide precise and reliable
    estimates of causal effects in situations in which the data are complex and could
    contain multiple confounding factors. We observed that the results from RCTs held
    true both in routinely collected data and in a posteriori-balanced (ie, causally
    informative) data: the guided iCBT programme was as effective and efficacious
    as fCBT in terms of depression symptom decline from before to after treatment
    (or to the last available measurement).


    # Implications of all the available evidence


    Therapist-guided iCBT is equally effective and more cost-effective in treating
    depression than face-to-face delivery. Internet-delivery of short first-line treatments
    is a sensible default-treatment option and an apt response to the high demand
    for services.


    partly automated treatments could yield treatment outcomes that are as effective
    as face-to-face therapies. The risk is that clinicians might inadvertently impart
    their attitudes to patients, potentially leading to diminished treatment efficacy.4
    RCTs are not always representative of routine practice, which might inflate effectiveness
    estimates.7,8 For example, people who object to digital treatments might not enrol
    in an RCT offering iCBT. Furthermore, samples in RCTs tend to be small relative
    to registries. Although meta-analyses combine RCTs to achieve larger samples,
    they often lack commensurate and comprehensive data on the complexity of people’s
    conditions and other background factors that could affect representativeness.
    Thus, whether therapist-guided iCBT truly is as effective as fCBT in real-world
    settings remains unclear. The central counterfactual question is: would the average
    treatment effect (ATE) still be similar if we could allocate exact replicas of
    the same patients simultaneously to both guided iCBT and fCBT and compare their
    efficacies? Although considered a gold standard, RCTs are neither the only nor
    a perfect method for balancing intervention group composition to avoid confounding.
    Researchers in medicine, psychology, and statistics argue that reliable


    causal inference often requires multiple sources of evidence rather than RCTs
