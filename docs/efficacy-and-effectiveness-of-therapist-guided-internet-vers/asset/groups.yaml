    fCBT 之间的效效性差异，采用一种并非 RCT 的因果信息性设计，从而规避了 RCT 的典型挑战，同时针对同一因果问题提供证据。我们的自然观察性数据提供关于效果性的信息，而反事实分析在所有真实患者均接受
    fCBT 而非有指导的 iCBT 的情况下，提供关于效果性和效效性的信息。随后，证据的新金标准将由 RCT 元分析与应用于自然观察性数据集的 TMLE 的综合推断组成。我们的研究为使用
    TMLE 及相关方法来解决 fCBT 与治疗师指导的 iCBT 之间 ATE 的问题提供了一个务实的概念验证。


    两个登记处中的每位患者均通过其社会安全识别号与其他国家登记处进行了关联。芬兰国家数据许可管理局和数字与人口服务局将患者与其亲属（父母和兄弟姐妹）关联，随后患者及其亲属与其他登记处所有者的数据进行了关联（图
    2B）。这些登记处包含公营部门诊断和药品购买（例如，F 代码和解剖治疗化学-神经系统代码）的准确事件日期，但不包含私营部门诊断。我们的研究许可由 Findata
    根据关于社会和健康数据二次使用的全国规则和规定授予（许可编号 THL/4810/14.02.00/2020 和 THL/1303/14.06.00/2023，颁发给
    THR）。这些许可免除了知情同意的要求。本研究按照世界医学协会第六版《赫尔辛基宣言》开展，并经 HUS 伦理委员会评审（HUS/1861/2020 和 HUS/3150/2020）。本研究未在其他地方预先注册。


