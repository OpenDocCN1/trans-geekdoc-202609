    # ## Intelligent manufacturing system safety strategies: generating Lockout/Tagout
    sheets by Machine Learning – a case study


    *Victor Delpa*, Kevin Chapron**, Jean-Pierre Kenné*, Lucas Hof*

    *École de Technologie Supérieure, Montréal, Canada

    (e-mail: victor.delpa1@etsmtl.ca, lucas.hof@etsmtl.ca)

    ** CONFORMAT, Chicicoomi, Canada

    *(e-mail: kevin.chapron@conformat.com)


    **Abstract:** Lockout/Tagout (LOTO) is a procedure that considerably reduces the
    risk of work-related accidents by isolating and securing the energy sources of
    industrial equipment. In the Industry 4.0 era, safety procedures must also evolve
    towards more intelligent procedures supported by technologies such as machine
    learning or the Internet of Things. The LOTO procedures indicate how to perform
    the security. Sheets, manually generated, can be generated automatically to optimize
    the LOTO procedure. This paper proposes a methodology to achieve an automatic
    generation of sheets. The first step extracts information from the LOTO sheets
    provided by the industrial partner and in a next step develop text mining methods
    and word similarity search. Several options are evaluated, which aims to generate
    sheets from the previously obtained data. Future steps of this research will be
    presented. In practice, an automatic generation of sheets would enable to implement
    the LOTO procedure for an an industrial device, which would reduce the risk of
    accidents.


