    (https://creativecommons.org/licenses/by-nc-nd/4.0)


    **Keywords:** Industry 4.0; Safety and Environment; Text mining; Lockout/Tagout;
    Machine Learning; Apriori algorithm; Random Forest.


    #  1. INTRODUCTION


    Workplace accidents that can have severe human and material consequences. In the
    industrial environment, the frequency of accidents should be minimized with modern
    methods and precautions. Manufacturing environments where accidents can occur
    are very varied. Workers in manufacturing are at the highest risk for injury and
    deaths (Bulazcelli et al., 2008). The National Institute for Occupational Safety
    and Health has published guidelines for energy control management and service.
    The procedures proposed in these guidelines are mandatory since 1988 when the
    Occupational Safety and Health Administration (Occupational Safety and Health
    Administration 1989) promoted the Hazard Energy Control (Lockout/Tagout) Standard.
    The standard requires employers to lock out and disconnecting equipment. Lockout/tagout
    is the locking of the energy isolating device (hydraulic, electrical, pneumatic,
    etc.) in order to


    prevent premature while a technician is still performing his intervention. The
    lockout consists in deactivating the device. More LOTO uses devices that prevent
    the restart of an equipment; this can be circuit breaker locks as shown in Figure
    1. These devices are secured by locks which is the only key holder. In industry,
    the LOTO follows a specific arctic system that is set by lockout sheet. LOTO is
    therefore out in the data


    In the era of Industry 4.0, this research is based on the vision and paradigm
    of “Operator 5.0” – an intelligent, creative, and resourceful operator with human
    innovation achieved through information and technology to create new solutions
    that ensure continuity of operations and workforce welfare (Romero and Stare 2021).
    With the increasing share of actions and decisions, collaboration between human
    and technologies such as augmented reality and Internet of Things will improve
    these processes and ensure the safety of operators. More globally, predictive
    models and artificial intelligence (AI) will enable new strategy to optimize maintenance
    and integrate it into the entire process. Machine learning (ML) techniques offer
    many opportunities in the manufacturing industry (Jamwal et al. 2021a). The safety
    of workers in the industry could also be improved with ML, notably during manufacturing
    operations (Jamwal et al. 2021a).


