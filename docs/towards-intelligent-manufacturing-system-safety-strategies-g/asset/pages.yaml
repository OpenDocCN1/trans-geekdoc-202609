    # 2. STATE OF ART


    First, this paper presents a brief state of the art over perspectives of health,
    safety and environment (HSE) Industry 4.0 technologies, and more specifically
    on the applications of text mining to improve maintenance operations and safety.
    After posting of LOTO sheets to obtain a database is presented. The LOTO prediction
    method is then discussed. A comprehensive review resumes the progress made and
    presents the future work.


