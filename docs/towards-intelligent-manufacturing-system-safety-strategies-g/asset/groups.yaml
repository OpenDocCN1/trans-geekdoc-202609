    打开"off"/ 拔掉

    锁定

    检查值 /


    图 5 设备和指令预测模型


    应用随机森林（RF）算法后，机器可以在不同的数据集上进行处理。RF 是通过随机对观测值子集进行采样创建多个数据集后生成的决策树集合。在这里，在此基础上的 Apriori
    训练为上述两个决策层提供了通用关联规则。RF 算法使用独立模型的单子图预测来减少方差和预测误差（Shehashee and Thailajand 2017）。此类算法通过对独立模型的预测进行平均，以根据不同的置信度选择机器
    LOTO 集合上最重要的规则。使用数据集随机装袋技术获取不同关联规则的过程如图 5 所示。


    # 6. 结论


    本研究处于工业 4.0 背景下，ESH 4.0 可以通过提供由人类编写的安全程序来提高工业安全性。本文介绍了生成 LOTO 集合的工作，即第一个识别出的子图是从需要锁定的机器名称中提取信息，以及正确排序它们的指令。将
    PDF 文本格式的 LOTO 集合转换为可用的数据库，用于基于机器名称的逻辑建模并经过了测试。如果发现从图中提取数据时存在的某些错误对方法影响很大，则可能需要对数据库进行处理。


    在第二个子目标中，研究项目的步骤是结合 Apriori 和随机森林算法的机器学习模型的训练和测试。最后，需要调整关联算法和装袋算法的参数，根据上述行生成 LOTO
    表单。这项工作目前基于文本 pdf 文件，也可以对图像 pdf 进行文本识别。事实上，许多工业者仅有 PDF 图片形式的表单，这些表单是改进预测模型的重要来源。由于主题涉及记录记录，代理将遵循预测结果，且必须确保在编写安全实践时实际使用此类任务。


    《企业信息管理杂志》，预印本。


