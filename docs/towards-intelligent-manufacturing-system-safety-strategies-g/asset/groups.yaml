    mobilization of human personnel who go on site. LOTO sheets are often requested
    by companies before equipment maintenance, the speed of writing the sheets would
    benefit and the absence of human labor on site is an important objective. ML algorithms
    are a key to achieving this goal.


    (Anthony and Kashlia 2023). Nevertheless, at the level of document generation,
    many advances have been made and new methods are used (Qiu et al. 2020). Technical
    language processing in industry is poorly developed and lags other fields such
    as medicine. Efforts in the development of natural language technology must be
    made (Brundage et al. 2021) provide a perspective to fill this gap. With few dealing
    with the study of textual security documents can be mentioned. Aviation incident
    reports from around the world could be extracted using attention. These can be
    classified to provide expertise useful for their analysis (Faming et al. 2016).
    Similarly, in construction industry, accident reports are analyzed by experts.
    This operation requires a lot of time. The identification of risks by text mining
    allows a prevention of possible accidents on future construction sites (Na et
    al. 2021).


    # 2. STATE OF ART


    First, this paper presents a brief state of the art over perspectives of health,
    safety and environment (HSE) Industry 4.0 technologies, and more specifically
    on the applications of text mining to improve maintenance operations and safety.
    After posting of LOTO sheets to obtain a database is presented. The LOTO prediction
    method is then discussed. A comprehensive review resumes the progress made and
    presents the future work.


    Industry 4.0 as Internet-of-Things (IoT), physical systems, cloud computing and
    smart sensors have many applications dedicated to safety management. For example,
    protective procedure (Ruppet and Abony) embedding automation technologies improves
    safety in smart factories (Podorski et al. 2021). Safety-aware robots with the
    ability to identify which workers could improve the work area (Beetz et al. 2015).
    However, these show more than on the technology of Industry 4.0 than really needs
    safety management systems. In the management of Industry 4.0 has a big gap in
    research on ergonomics and human adaptation to operate in these connected environments
    (Siermiench et al. 2020). Liu et al. (2020) note that the considered accuracy
