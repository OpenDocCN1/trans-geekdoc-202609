    **摘要：** 上锁挂牌（LOTO）是一种通过隔离和保护设备能源源来显著减少工作相关事故的程序。在工业 4.0 时代，安全程序必须向由机器学习或物联网等技术支持的更智能程序演进。LOTO
    程序指示了如何进行安全操作。本文提出了一种实现 LOTO 表单自动生成的方法。第一步从现有的 LOTO 表单中提取信息，下一步开发文本挖掘和词相似性方法。评估了多种选项，旨在生成表单。在实践中，自动生成表单将能够实现
    LOTO 程序，从而减少事故风险。


    © 2022 作者。本文根据 CC BY-NC-ND 许可发布（https://creativecommons.org/licenses/by-nc-nd/）。


    **关键词：** 工业 4.0；安全与环境；文本挖掘；上锁挂牌；Apriori 算法；随机森林。


    # 1. 引言


    工作事故可能导致严重的人员和物质后果。工业环境中，事故频率应通过现代方法和预防措施降至最低。发生事故的制造环境面临着受伤和死亡的最高风险（Bulazcelli
    等，2008）。美国职业安全与健康管理局发布了能源控制的指南。自 1988 年以来，这些指南是强制性的（职业安全与健康管理局，1989）。标准要求雇主上锁设备。上锁挂牌是对能源源（液压、电气等）的隔离。LOTO
    包含在技术人员进行干预时防止设备重启。这些设备由断路器锁定。在工业中，LOTO 遵循一个特定的上锁表单系统。


    在工业 4.0 时代，本研究基于“操作者 5.0”的愿景——即通过信息和技术实现的智能、富有创意且资源丰富的操作者，以确保生产的连续性和员工福利（Romero
    和 Stare，2021）。随着行动和决策比例的增加，人类与增强现实等技术的协作将改进这些流程并确保操作人员的安全。全球范围内，预测模型和人工智能（AI）将通过新的策略来优化维护并整合到整个过程中。机器学习（ML）技术为制造业提供了许多机会（Jamwal
    等，2021a）。工业员工的安全也可以通过机器学习得到改进，特别是在生产期间（Jamwal 等，2021a）。


