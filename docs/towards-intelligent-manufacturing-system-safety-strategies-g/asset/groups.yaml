    ## 智能制造系统安全策略：基于机器学习的上锁挂牌表单生成——案例研究


    **Victor Delpa**, *École de Technologie Supérieure, 蒙特利尔，加拿大*

    (邮箱: victor.delpa@etsmtl.ca)

