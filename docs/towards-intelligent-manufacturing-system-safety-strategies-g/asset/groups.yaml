    ## 4.1. PDF 文件转换


    为了实现本研究的目标1，第一步是通过检索名称和标识符来获取 LOTO 表格数据库。本研究的合作伙伴 CONFORMIT 是一家加拿大公司，负责开发、市场化和实施此类健康、安全和环境管理软件（如
    LOTO 表格）。可用的 LOTO 表格为 PDF 格式，如图 3 所示。首先，我们需要将 PDF 文件转换为字符串。使用了 Python 库 "PDF2Text"
    (Kushari and Shivananda 2021) 和 "pdfminer" 在 Python 中将 PDF 转换为文本并进行格式化。"pdfminer"
    允许我们保留 PDF 文件中文本的顺序，但有时单词之间的空格可能会被删除，这使得提取机器名称等重要单词变得非常困难。这些问题通过 "pdfminer" 解决，这也是我们选择使用它的原因。在文件转换为
    txt 格式后，我们就能将 LOTO 导入到 Python 的工作表中。


    ## 4.2. 预处理


    一旦获得数据，目标将编写仅包含设备名称作为条目的日志表格。因此，有必要建立数值预测。


    为了检测信息，我们需要从 LOTO 表格中检索（机器名称、需要锁定的设备、需要遵循的指令），并结合所需的字典，必须对与每个表格相关的字符串进行以下准备。使用
    Python 的 nltk 库执行了以下步骤：


    - 对字符字符串进行分词（Tokenization），以隔离存在的每个单词

    - 删除不携带重要信息的单词

    - 删除过短的单词（<2 个字符）（这可能会在检测单词间的相似性时产生问题）


    LOTO 表格的处理和这些表格的编写需要提取相关信息，这些信息将构成我们自动生成表格的数据。文本挖掘对于完成此任务非常重要（De 2019）。


    ## 4.3. 分析


    下一步是搜索分析表格单词与设备单词之间的相似性。这一步是获取通过相似性进行单词关联的数据框的主要挑战。NLTK 库中的几种算法可用于此目的。J-Winkler
    距离算法是衡量两个单词之间相似性的另一种方法（Yulianto and Nurhasaman 2021）。


    该方法采用 0 到 1 之间的比例：1:1 对应两个相同的单词。相似性的计算稍微复杂，并且单词长度经过了压缩。针对拼写错误的简单改进也经过了权重减少。尽管存在这些缺点，仍然选择了
    Jan-Winkler 距离，因为它对短单词有更好的识别率。


    所有表格通用的指令，需要检索它们


    设备所需的指令


    其他指令


    检索出的单词，且召回率（recall）是已检索的相关实例的比例（Godbole and Sarwari 2004）。在一个包含 200 份 LOTO 表格的数据集中，机器名称检索的准确率为
    87%，召回率为 90%。


    在已知每种类型的大致位置后，扫描它们与字典单词的相似性。一旦找到字典中的单词，就会将其保存并与分析的表格相关联。


