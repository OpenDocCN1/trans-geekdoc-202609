    关联规则的研究是文本挖掘中的关键步骤，因为它试图揭示大型数据集中有意义的值。关联规则被推荐用于聚类分析，但它们被认为是各个领域的通用数据。具体而言，它们被建议用于关联规则分析。最重要且简单的是
    Apriori 算法（Agrawal and Srikant 1994）。Apriori 算法允许对数据库中发现的属性值进行不同的组合。关联规则的探索由置信度阈值控制。这些阈值的设置是为了寻找搜索区域，使得计算过程成为可能（Dhabi
