    Figure 5 Devices and instructions prediction model


    for a machine can be processed on different sets after application of a Random
    Forest (RF) algorithm. RF is a collection of decision trees created after the
    creation of several data sets by randomly sampling subsets of observations, here
    The Apriori training on these bases provides general association rules for the
    two decision levels mentioned. The RF algorithm uses single-subgraph predictions
    of independent models to reduce the variance and the prediction error (Shehashee
    and Thailajand 2017). This type of algorithm averages the predictions of independent
    models to choose the most significant rules on the LOTO sets for a machine with
    different levels of confidence. The process of obtaining the different association
    rules using a bagging of the dataset with random is shown in Figure 5.


    # 6. CONCLUSION


    This research is in the context of industry 4.0 and ESH 4.0 can contribute to
    improving safety in industries by providing safety procedures, usually written
    by humans. This paper presents the work to generate LOTO sets, namely the first
    identified sub-graph is the extraction of information from the names of the machines,
    which need to be locked and the instructions to correctly sequence them. The transformation
    of the LOTO sets in PDF text format results in a usable database, for modeling
    logic based on machine names, which is tested. The work on database may need to
    be performed if some errors detected in the data extraction from graphs prove
    to have high an impact on the methods


    In the second sub-objective, the steps of the research project are the training
    and testing of the machine learning model combining the Apriori and Random Forest
    algorithms. Finally, the parameters of association and bagging algorithms will
    need to be tuned to produce LOTO sheets based on the line above. This work, is
    for the moment, based on text pdf files, a text recognition with image pdf also
    be done. Even, many industrialists HAVE sheets in the form of PDF images only,
    these sheets are an important source to improve the prediction model. As the subject
    deals with currency records, agents will follow the predictions which will also
    have to be done by being sure to use in practice this kind of assignment in writing
    safety practices.


