    # 2 The AI revolution in context


    DOI: [10.4324/9781032665276-2](https://doi.org/10.4324/9781032665276-2)


    ## Introduction


    This chapter provides an overview of the evolution of AI, culminating in the capabilities
    of modern-day AI chatbots.


    ## The many facets of AI


    You’ve likely encountered the letters ‘A’ and ‘I’ in various contexts, but what
    does this pairing truly signify in the context of this book? At its core, AI is
    a field dedicated to enabling machines to perform tasks typically requiring human
    cognition and intelligence, such as learning, problem-solving, and language comprehension.


    The AI landscape encompasses numerous specialised subfields. These include machine
    learning (algorithms that improve through data analysis without explicit programming
    for every scenario), computer vision (interpreting visual inputs), natural language
    processing (understanding and generating human language), robotics (creating autonomous
    machines for human-like tasks), and expert systems (emulating human decision-making
    through specialised knowledge). The field is vast and diverse.


    This book primarily focuses on Generative AI (i.e. a type of AI that can create
    new content like text, images, or music based on patterns it has learned from
    existing data). Generative AI’s sophisticated algorithms represent AI’s cutting
    edge in mastering “natural language” – the messy, context-rich way humans communicate,
    rather than rigid computer syntax. Think: “I’m dying for a coffee” versus “Human.
    Coffee. Need = Urgent”.


    With a strong coffee by my side, I want to take you on a brief tour of AI’s evolution.
    From its modest beginnings to today’s impressive chatbots. We’ll explore how these
    advanced models resulted from decades of innovation, and gained familiarity with
    major milestones and ongoing challenges, offering insights into AI’s current capabilities
    and, importantly, some of its limitations. By understanding this trajectory, you’ll
    be better positioned to assess AI’s present state and its potential future impact
    on academia and beyond.


