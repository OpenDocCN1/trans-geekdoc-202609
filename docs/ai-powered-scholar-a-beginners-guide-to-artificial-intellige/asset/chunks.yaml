    # 4 Designing your AI research assistant

    DOI: [10.4324/9781032665276-4](https://doi.org/10.4324/9781032665276-4)


    ## Introduction

    Imagine having unlimited research funds to hire your dream assistant. They’re
    well-versed in many knowledge domains, enthusiastic, and available 24/7. Sounds
    perfect, right? But there’s a catch – this assistant has no idea how you want
    them to work, which academic norms to follow, or which of their many skills to
    apply to your tasks.


    If your new hire was human, you’d probably have written a position description
    before hiring them, and on their first day of work, you’d provide detailed instructions
    for how they should perform. Unfortunately, when we “hire” a chatbot (i.e. collaboratively
    use AI tools to help us get our tasks done), these same steps can easily get overlooked.
    This is why some people walk away from AI technologies, disillusioned by a chatbot’s
    output. Yet others become lifelong champions of the technology.


    The difference? Learning to craft the AI into your dream assistant and clearly
    communicating what you’d like it to do. In other words, assigning it a persona,
    and learning how to write effective instructional commands to let it know what
    it should do for you while it’s acting in that role. If that all sounds a bit
    strange, don’t worry – and please stick with me – it will hopefully be clearer
    by the end of the chapter!


    Before we get into specifics, let’s consider the scenario of approaching a stranger
    on the street and asking them to perform a task for you. Odd as it may sound,
    this situation can closely resemble your first interaction with an AI chatbot.
    Both start with a blank slate – no context, no shared understanding, just potential
    waiting to be unlocked.


    ## The helpful stranger scenario

    Picture this: you’re strolling down a busy city street when you spot a friendly-looking
    stranger. In a rush, you hand them a page of complex academic text and make an
    unusual request: “Could you please rephrase this text using simpler language?”


    “Sure!” the stranger replies with a smile.


    They quickly scan the dense text, jot down some notes, and hand back a rewritten
    version, patiently awaiting your feedback.


    You review their work with hopeful expectations, but… oh dear. Your heart sinks
    a bit as you read. While the text is indeed simpler now, the revised wording seems
    to miss the original’s nuanced meaning. What’s more, it’s not quite suitable for
    your intended audience.


    This isn’t what you wanted at all!


    Perplexed by your apparent disappointment, the stranger apologises for missing
    the mark.


    “I’m sorry”, they say, looking a bit crestfallen.

