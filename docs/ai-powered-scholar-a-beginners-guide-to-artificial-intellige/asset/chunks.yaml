- raw: "If you’re enthusiastic to explore additional AI applications, you’ll find\
    \ the final chapter of this book to be an invaluable resource. It provides access\
    \ to online materials, including practical use cases, allowing you to continue\
    \ your journey into AI-powered scholarship.\n\n## That’s a wrap!\n\nIt was tempting\
    \ to conclude this book with a playful snippet of AI-generated text. Perhaps by\
    \ using a prompt such as: “Please craft a three-line poem, that expresses to my\
    \ family and friends that, finally, the book has been written, and I’ll soon be\
    \ returning to pre-ChatGPT patterns of social interaction after having a day off\
    \ to celebrate”.\n\nBut just as non-disclosed AI-generated content continues to\
    \ be judged as a misrepresentation of human effort, so too would that poem’s sentiments\
    \ misrepresent any intention of dialling down my enthusiasm for building AI skills\
    \ and sharing them widely. I long jumped down the rabbit hole of AI, and, like\
    \ many other AI enthusiasts who attached themselves to the AI rocket ship, I continue\
    \ to thrive on its energy.\n\nThe pace of advancement, including the almost daily\
    \ updates about new features, apps, business cases, etc. provides more dopamine\
    \ hits than a bottle of Vyvanse.\n\nYet, many across the sector are understandably\
