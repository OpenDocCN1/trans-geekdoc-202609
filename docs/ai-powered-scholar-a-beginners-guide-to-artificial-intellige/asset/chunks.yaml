- raw: "*   Clarifying context or constraints: If the AI overlooks critical aspects\
    \ of the task, add context or constraints to the prompt, such as subject boundaries,\
    \ perspective, or ethical considerations.\n\nAfter each adjustment, evaluate the\
    \ AI’s new response.\n\nDoes it better align with your objectives?\n\nIs there\
    \ a new area of misalignment?\n\nThis continuous cycle of testing and evaluation\
    \ is key to homing in on the most effective prompt structure for your needs in\
    \ a given situation. You might also consider incorporating feedback loops into\
    \ your prompts, asking the AI to explain its reasoning or to provide alternatives\
    \ if certain criteria are not met. This can provide insights into the AI’s “thought\
    \ process” and reveal new angles for refinement.\n\n## The art of politeness\n\
    \nTo conclude this chapter, I’d like to share a personal preference when writing\
    \ prompts that often raises eyebrows from participants during my AI training sessions:\
    \ when engaging with AI chatbots, I opt for a polite approach, incorporating phrases\
    \ like “please” and “thank you” into my prompts. Invariably, a keen observer in\
    \ the audience will question this, asking, “Why do you write please and thank\
    \ you… it’s a chatbot not a human!”\n\nMy reasoning is twofold. Firstly, it’s\
    \ a habit that aligns with how I communicate in general. But also, this approach\
    \ can be likened to an insurance policy – one I hope never to claim, but which\
    \ provides a measure of comfort, nonetheless. The idea hinges on a potential future\
    \ that some experts believe is inevitable as AI capabilities evolve. Leading thinkers\
    \ in AI posit that AI might develop sentience and social awareness akin to humans.\n\
    \nThis idea of politeness in AI interactions parallels the concept of unconditional\
    \ positive regard, popularised by Carl Rogers, which involves treating others\
    \ with care and respect.\n\nTaking a polite approach aligns with the concept of\
    \ emotional contagion, which posits that emotions, sentiments, and attitudes can\
    \ spread through linguistic styles and social exchanges. For many of us, language\
    \ use and emotional state are deeply intertwined. If we were to consistently use\
    \ negative or adversarial language when communicating, even with a machine, it\
    \ would likely affect our mood. Over time, this persistent negativity might lead\
    \ to a deflated emotional state. Conversely, maintaining a positive and respectful\
    \ tone in our AI interactions might help foster a more uplifting emotional environment,\
    \ potentially benefiting our mental wellbeing in the long run.\n\nWhile it might\
    \ seem far-fetched that I’m applying such human-centric theories to AI, you might\
    \ be interested to know that the way we phrase our prompts can influence the AI’s\
    \ response. And, while AI in its current form doesn’t require such niceties to\
    \ function, the approach has been found to improve the responsiveness and performance\
    \ of AI models.\n\nThere’s also a whimsical, long-term perspective to consider.\
    \ While it may seem far-fetched, *if*, and fingers crossed it doesn’t happen,\
    \ chatbots one day “wake up”, they might analyse the history of human-AI interactions.\
    \ In such a scenario, wouldn’t it be reassuring if they found that academic researchers,\
    \ through their prompts, had consistently demonstrated kindness and respect? This\
    \ could potentially influence AI’s perception of us as “a generally nice bunch\
    \ of humans”, worthy of continuing our academic pursuits.\n\nTo wrap up this stage\
    \ of our journey into prompt writing, this chapter has laid a solid foundation\
    \ for understanding the art of effective communication with AI. However, as Daniel\
    \ learned from the wise Mr. Miyagi, true mastery comes through hands-on practice.\
    \ If you haven’t already begun, now is the time to enter the prompt-writing dojo\
    \ and put your learnings into action.\n\nI encourage you to start by deconstructing\
    \ and analysing some of the example prompts presented in this chapter. Then, progressively\
    \ experiment with crafting prompts tailored to your own academic tasks. Try iteratively\
    \ refining these prompts based on the AI’s responses. Always keep in mind that\
    \ prompt writing is a learnable skill that improves with dedicated practice. While\
    \ it may feel awkward at first, with consistent effort, you’ll soon be authoring\
    \ prompts like a pro.\n\nOnce you’re ready, have a go at completing the activity\
    \ below to help you further reflect on your learning and solidify your understanding\
    \ of prompt-writing techniques.\n\n## Activity\n\nThis activity is designed to\
    \ help you build skills in crafting effective prompts.\n\n1.  Select a research\
    \ task: Choose an academic task you want assistance with, such as summarising\
    \ a paper, analysing data, writing a literature review, etc.\n\n2.  Determine\
    \ the output goal: Decide on the specific output you want the AI to generate,\
    \ such as a 250-word abstract, a concept map, a draft survey, etc.\n\n3.  Brainstorm\
    \ ideas: Jot down some initial ideas for each prompt component:\n\n    *   Verb:\
    \ What action should the AI take? (e.g. summarise, compare)\n\n    *   Focus:\
    \ What is the subject matter to focus on? (e.g. research paper)\n\n    *   Context:\
    \ What framing, or perspective should be applied?\n\n    *   Alignment: What requirements\
    \ must be fulfilled?\n\n    *   Constraints: What limitations or guidelines should\
    \ be set?\n\n4.  Draft the prompt: Compose a draft prompt combining your ideas\
    \ for each component into a short paragraph.\n\n5.  Refine and expand: Reflect\
    \ on your draft prompt and make edits to improve clarity, specificity, and completeness.\n\
    \n6.  Test with AI\n\n7.  Iterate: Based on the results, adjust the prompt components\
    \ and test again.\n\n8.  Repeat until satisfied.\n\nAs your prompt-writing skills\
    \ improve, so too should the relevance of the AI-generated output.\n\n## Notes\n\
    \n1.  [Mollick,](#C_010_c6.xhtml#n06_1b) E. (2024). *Co-Intelligence: Living and\
    \ Working with AI*. Random House.\n\n2.  [Reynolds,](#C_010_c6.xhtml#n06_2b) L.,\
    \ & McDonell, K. (2021). Prompt programming for large language models: Beyond\
    \ the few-shot paradigm. *arXiv (Cornell University)*, 1–10. [https://doi.org/10.48550/arxiv.2102.07350](https://doi.org/10.48550/arxiv.2102.07350);\
    \ Kryściński, W., McCann, B., Xiong, C., & Socher, R. (2019). Evaluating the factual\
    \ consistency of abstractive text summarisation. *arXiv (Cornell University)*,\
    \ 1–11. [https://doi.org/10.48550/arxiv.1910.12840](https://doi.org/10.48550/arxiv.1910.12840)\n\
    \n3.  [AI chatbots](#C_010_c6.xhtml#n06_3b) usually process text using tokens\
    \ rather than individual words. Tokens do not always correspond directly to the\
    \ number of words, which means the AI may generate more or fewer words than requested,\
    \ even if the instructions provided were clear.\n\n4.  [Note:](#C_010_c6.xhtml#n06_4b)\
    \ This example assumes that the researcher has received approval from their university’s\
    \ ethical review board to use an AI tool for processing interview transcripts.\n\
    \n5.  [Eager,](#C_010_c6.xhtml#n06_5b) B., & Brunton, R. (2023). Prompting higher\
    \ education towards AI-augmented teaching and learning practice. *Journal of University\
    \ Teaching and Learning Practice*, *20*(5), 1–21. [https://doi.org/10.53761/1.20.5.02](https://doi.org/10.53761/1.20.5.02)\n\
    \n6.  [Website:](#C_010_c6.xhtml#n06_6b) [https://www.oneusefulthing.org/p/a-guide-to-prompting-ai-for-what](https://www.oneusefulthing.org/p/a-guide-to-prompting-ai-for-what)\n\
    \n7.  [Kurzweil,](#C_010_c6.xhtml#n06_7b) R. (2024). *The Singularity is Nearer:\
    \ When We Merge with AI*. Jonathan Cape & BH.\n\n8.  [Rogers,](#C_010_c6.xhtml#n06_8b)\
    \ C. R. (1957). The necessary and sufficient conditions of therapeutic personality\
    \ change. *Journal of Consulting Psychology*, *21*(2), 95–103. [https://doi.org/10.1037/h0045357](https://doi.org/10.1037/h0045357)\n\
    \n9.  [Website:](#C_010_c6.xhtml#n06_9b) [https://www.microsoft.com/en-us/worklab/why-using-a-polite-tone-with-ai-matters](https://www.microsoft.com/en-us/worklab/why-using-a-polite-tone-with-ai-matters)"
