    Hear, and Speak.* [https://openai.com/blog/chatgpt-can-now-see-hear-and-speak](https://openai.com/blog/chatgpt-can-now-see-hear-and-speak)

    2. [Weizenbaum,](#C_009_c5.xhtml#n05_2b) J. (1966). ELIZA—A computer program for
    the study of natural language communication between man and machine. *Communications
