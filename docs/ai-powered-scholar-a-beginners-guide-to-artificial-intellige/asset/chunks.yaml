- raw: 'The year 1950 marked a pivotal moment in this journey. Alan Turing, a brilliant
    mathematician, published a ground-breaking paper that would forever change the
    landscape of computing. In it, he proposed what we now know as the Turing test


    Just five years later, the term “artificial intelligence” is thought to have been
    coined by John McCarthy, a visionary computer scientist, who used this now-famous
    pairing of words in a workshop proposal that would become a catalyst for AI research.
    This gathering of minds is considered a key springboard for modern AI advancement.


    In the wake of these foundational developments, AI pioneers of the 1950s and 1960s
    set their sights on an ambitious goal: replicating human intelligence through
    rule-based programming,


    The modest processing power and hefty price tags of 1950s’ computers posed considerable
    barriers.


    Additionally, common sense proved an elusive quality


    As a result, funding and enthusiasm for AI began to wane, marking the start of
    what’s known as an ‘AI winter’ period, referring to reduced progress in AI research
    caused by setbacks in overcoming technical barriers and losses of confidence in
    the viability of achieving strong AI.


    The 1990s ushered in a renaissance for AI, driven, in part, by exponential leaps
    in computing power. This new era of technological affordances empowered researchers
    to harness advanced statistical techniques and pioneer machine learning algorithms,
    capable of analysing vast, ever-expanding datasets. Machine learning refers to
    AI systems that can learn and improve from experience without being explicitly
    programmed for every scenario, and it marked a paradigm shift. AI systems could
    now learn and improve from experience, shedding the need for explicit programming
    of every possible scenario. As an example, imagine an AI sifting through millions
    of cat and dog photos, gradually discerning the subtle visual cues that distinguish
    whiskers from snouts, and pointed ears from floppy ones. This process of pattern
    recognition allows the system to accurately categorise new, unseen images – a
    task once thought to be the exclusive domain of human perception. Such capabilities
    opened doors to applications light years beyond simple image classification, setting
    the stage for AI to tackle increasingly complex real-world problems.


    In addition to progress occurring in the domain of machine learning, neural networks
    made a comeback in the 1990s. Neural networks are AI systems loosely modelled
    after the neuron connections in the human brain.


    While AI was going through “boom and bust” cycles, steady progress continued.


    In the 2010s, we saw the rise of deep learning, which refers to neural networks
    with multiple layers that can learn highly complex relationships in data


    The landmark AlphaGo win signalled a major leap in AI advancement because AI could
    now surpass humans in highly strategic domains requiring intuition, not just raw
    computing power. Additionally, because Go was seen as a game requiring abstract
    reasoning skills, the win further signalled the potential of deep learning to
    deliver human-like cognition given enough training data. This level of skill was
    once thought unattainable for AI and led to enhanced enthusiasm for further advancing
    AI capabilities. Despite all the progress, AI capabilities remained far from matching
    human-level flexibility across all cognitive domains.


    Looking at the historical trajectory reminds us how far AI capabilities have come.
    But it also highlights that realising the full aspirations of pioneers like Alan
    Turing and John McCarthy remains a quest requiring ongoing breakthroughs.


    For many in academia, AI came onto the radar in late 2022, when OpenAI,


    Even if you haven’t used it, you’re likely familiar with OpenAI’s product, ChatGPT,


    Or so I thought.


    From my vantage point, I witnessed a surprising lag in response. Months passed
    before many academics began discussing AI, and when they did, many dismissed it
    as another passing trend. Given AI’s growing influence,


    Tech enthusiasts and late-stage early adopters were exploring, and profiting from,
    AI’s capabilities. Meanwhile, many in higher education focused their conversations
    on how students could potentially use this technology to bypass the integrity
    of traditional forms of academic assessment.


    Thus began a movement among some academics towards embracing AI technologies across
    multiple touchpoints of their academic work, including using AI chatbots to assist
    in writing academic papers. Those who openly admitted to doing so included several
    scholars who went as far as crediting ChatGPT as a co-author on their publications.


    In my journey with AI, I’ve often found myself amazed at what these tools can
    accomplish with just a few clicks. My colleagues have shared similar experiences
    of awe. Yet, these moments of wonder tended to be tempered with feelings of uncertainty
    about the future of the higher education sector. These moments led me to ask,
    “Will AI continue to advance to the point where it replaces human skills and academic
    roles entirely?”


    Reassuringly (although for how long remains anyone’s guess), advancements in AI
    have not yet achieved the expansive general capabilities that were initially envisioned.


    AI today excels as a specialist, demonstrating superhuman proficiency in narrow
    domains it has trained extensively in. For example, an AI can defeat the world’s
    greatest chess grandmaster, translate languages in milliseconds, and create stunning
    works of digital art. But it cannot yet then shift to displaying the situational
    adaptability, well-rounded common sense, or interpersonal emotional intelligence
    that allows humans to thrive in the messy realities of everyday life. Current
    AI reasoning relies on patterns extracted from datasets, lacking the grounded
    understanding that comes from real-world experiences. This limitation can hinder
    AI’s ability to respond flexibly to novel situations, and the general learning
    capabilities that humans develop during childhood, through interaction with the
    physical and social world, remain challenging to replicate in machines.


    Despite these limitations, AI can be remarkably capable, or “scary smart” as AI
    expert Mo Gawdat describes in his book on AI’s future impact.


    Rather than viewing AI as a threat to human roles, I tend to see it as an opportunity
    to enhance our unique strengths – as an extension of our human capabilities. This
    idea comes from the Extended Mind Thesis, introduced by philosophers Andy Clark
    and David Chalmers, which posits that cognitive functions can extend beyond the
    biological brain to incorporate external tools and resources. Essentially, AI
    could be considered an external object that actively aids our thinking and guides
    our cognition, thus extending our cognitive architecture beyond the traditional
    boundaries of our minds.


    ## AI-enhanced academic roles


    While artificial intelligence has made great strides, it cannot yet replicate
    the full range of scholarly tasks and social nuances involved in the multi-faceted
    nature of academic work.


    Trust me, I’ve tried!


    Within the bounds of its current abilities, AI remains sitting in the passenger
    seat,


    The array of responsibilities spanning teaching, research, collaboration, and
    university service appear secure from wholesale automation. An academic’s role
    extends beyond processing information or generating publications. Our ability
    for original theorising, contextual synthesis of concepts, the ability to design
    rigorous studies aligned to ethical review board requirements, critically evaluating
    evidence, and communicating complex ideas (which is a long, but far from exhaustive
    list of hats we wear) all draw upon accumulated human training in scholarly methods
    and also reflect our disciplinary quirks.'
