    如果你渴望探索更多的人工智能应用，你会发现本书的最后一章是宝贵的资源。它提供了在线材料的访问权限，包括实际用例，让你能够继续踏上人工智能赋能的学术之旅。


    # 完结！


    以一段有趣的 AI 生成文本来结尾本书很诱人。也许可以使用这样的提示：“请创作一首三行诗，向我的家人和朋友表达，终于，书已经写完了，我将在庆祝一天假期后，很快回到
    ChatGPT 之前的社交互动模式”。


    但正如未披露的 AI 生成内容仍被视为对人类努力的误导一样，那首诗的情感也会误导人们认为我有降低对构建 AI 技能并广泛分享的热情的意图。我很久以前就跳进了
    AI 的兔子洞，并且像许多其他依附于 AI 火箭的 AI 爱好者一样，我仍在它的能量中茁壮成长。


    进步的步伐，包括关于新功能、应用、商业案例等的几乎每日更新，带来的多巴胺冲击比一瓶 Vyvanse 还要多。


    然而，业界许多人对 AI 感到合理地恐慌，认为它是学术研究的终结和学术写作的死亡。


    这就是为什么我想请你帮个小忙。


    还记得我们在比喻性地拆开 AI 这份礼物在第一章的时候吗？现在你已经读完这本书，希望你不仅拆开了这份礼物，而且开始感到使用它很自在。这份礼物不是零和游戏。我相信在
    AI 之旅上帮助他人提升，将有助于更广泛地提升学术界，从而帮助我们在面临巨大变革的领域中保持诚信和相关性（以及持续就业的机会！）。我鼓励你在学术社区中成为
    AI 素养大使。与同事和学生分享你新获得的技能和见解。组织研讨会，发起讨论，或只是向那些仍在与空白页上闪烁的光标搏斗的人伸出援手。


    感谢你陪我一起走完这本书的旅程。如果你现在使用 AI 感觉更自在了一些，成为了更知情的用户，或者只是从我时常自作多情的叙事 digressions 中获得了些许乐趣，那么我已经实现了我的目标。如果你觉得这些页面有价值，我将非常感激如果你能在社交媒体上做那个俗语中的“点赞并订阅”来帮助在线推广本书。


    最后，我敦促你注意，学术界的 AI 革命不仅仅关乎技术——它关乎重新构想高等教育的本质。但那是另一本书的主题了！


    ## 注释


    1. Jensen, L. X., Buhl, A., Sharma, A., & Bearman, M. (2024). 生成式 AI 与高等教育：ChatGPT
    最初几个月主张的回顾。 *高等教育*, 1–17. [`doi.org/10.1007/s10734-024-01265-3`](https://doi.org/10.1007/s10734-024-01265-3)


    2. Cameron, J. (2020). *艺术家之路：通往更高创造力的精神路径*. Souvenir Press.


    3. 提供的 响应由 [Claude.ai](http://Claude.ai) 生成，使用 Claude 3.5 Sonnet。


    4. 了解 更多关于 Rowena Murray 教授的信息，请访问 [`www.anchorage-education.co.uk/about-me/`](https://www.anchorage-education.co.uk/about-me/)


    5. 了解 AI 的成本见解，包括环境影响，请参考：Crawford, K. (2021). *AI 图鉴：权力、政治与人工智能的行星成本*. Yale University
    Press.


    6. 处方 用于治疗注意力缺陷多动障碍（ADHD）的药物。


