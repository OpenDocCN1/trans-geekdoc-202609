- raw: ": The development and use of artificial intelligence in ways that adhere to\
    \ moral principles and values. For academics, this might involve considering the\
    \ ethical implications of using AI tools in research, such as potential biases,\
    \ privacy concerns, or the impact on human subjects. \n\n**Explainability**\n\n\
    : The degree to which the internal workings or decision-making processes of an\
    \ AI system can be understood and interpreted by humans. Explainability allows\
    \ researchers to understand how conclusions were reached, validate results, and\
    \ identify potential biases or errors. Explainable AI (XAI) refers to methods\
    \ and techniques that make AI systems more transparent and interpretable, which\
    \ is particularly important in fields where the reasoning behind decisions or\
    \ predictions needs to be clearly articulated. \n\n**Everyday AI**\n\n: AI technologies\
    \ and tools that have become integrated into daily academic workflows. This term\
    \ encompasses the various AI-powered applications that researchers might use regularly,\
    \ such as writing assistants, reference managers, or data analysis tools, which\
    \ can enhance productivity and efficiency in academic work. \n\n**Expert systems**\n\
    \n: A branch of artificial intelligence that emulates the decision-making ability\
    \ of a human expert, designed to solve complex problems by reasoning through bodies\
    \ of knowledge. In academic contexts, expert systems can assist researchers in\
    \ specialised fields by providing guidance or analysis based on established knowledge\
    \ in the discipline. \n\n## F\n\n**Feedback loop**\n\n: The iterative process\
    \ of providing input to an AI system, receiving output, and then refining the\
    \ input based on the output. This cycle can help in improving the relevance and\
    \ accuracy of AI-generated content. \n\n**Few-shot learning**\n\n: An AI capability\
    \ where a model can make accurate predictions based on only a few examples. This\
    \ can be useful when working with limited datasets or when trying to apply AI\
    \ tools to niche research areas. \n\n**Fine-tuning**\n\n: The process of adapting\
    \ a pre-trained AI model to a specific task or domain. For academics, this could\
    \ involve customising a general-purpose AI writing assistant to better understand\
    \ and generate content in their specific field of study. \n\n## G\n\n**Generative\
    \ AI (GenAI)**\n\n: AI systems capable of creating new content, such as text,\
    \ images, or code. Generative AI can assist with tasks like drafting literature\
    \ reviews, generating research questions, or creating visual aids for presentations.\
    \ \n\n**GPT (Generative Pre-trained Transformer)**\n\n: A type of large language\
    \ model that uses deep learning to produce human-like text. GPT models, such as\
    \ those powering ChatGPT, are increasingly used by academics for tasks like writing\
    \ assistance, brainstorming, and summarisation. \n\n**GPT-3 (GPT-4, etc.)**\n\n\
    : Specific iterations of the GPT language model developed by OpenAI. GPT-3 was\
    \ groundbreaking at the time. GPT-4 was its successor. These models power various\
    \ AI tools used in academic workflows, such as writing assistants, language translation,\
    \ and text summarisation. While powerful, academics should be aware of their limitations,\
    \ including potential biases and the need to fact-check outputs. As new versions\
    \ are released, they are likely to offer enhanced capabilities but may also present\
    \ new challenges for academics. \n\n## H\n\n**Hallucinations**\n\n: Instances\
    \ where AI models generate plausible-sounding but factually incorrect or nonsensical\
    \ information. For academics using AI tools, it’s crucial to be aware of this\
    \ limitation and to verify AI-generated content. \n\n**Hybrid intelligence**\n\
    \n: The combination of human and artificial intelligence to solve complex problems.\
    \ In academic workflows, this often involves using AI tools to augment human capabilities,\
    \ such as using AI for initial data analysis before applying human expertise for\
    \ interpretation. \n\n**Human-in-the-loop**\n\n: An approach where human input\
    \ (intervention and oversight) is incorporated into AI systems to improve decision-making\
    \ and outcomes. \n\n## I\n\n**Intelligent machines**\n\n: Systems or devices that\
    \ mimic human intelligence, capable of learning, problem-solving, and adapting\
    \ to new situations. Intelligent machines can range from AI writing assistants\
    \ to complex research tools that analyse data. \n\n**Information retrieval**\n\
    \n: The process of obtaining relevant information from a large collection of data.\
    \ AI-powered information retrieval systems can significantly enhance academic\
    \ research by quickly identifying and extracting information from vast databases\
    \ of scholarly literature. \n\n**Iterative prompting**\n\n: The process of refining\
    \ and adjusting prompts given to AI systems to improve the quality and relevance\
    \ of outputs. \n\n**Interpretability**\n\n: The degree to which an AI system’s\
    \ decision-making process can be understood by humans. For academics using AI\
    \ tools, interpretability is crucial for understanding the reliability and potential\
    \ biases of AI-generated outputs. \n\n**Implicit bias in AI**\n\n: Unintended\
    \ prejudices that can be present in AI systems, often reflecting biases in training\
    \ data or algorithm design. Academics should be aware of potential implicit biases\
    \ when using AI tools for research or analysis to ensure fair and accurate results.\
    \ \n\n## K\n\n**Knowledge base**\n\n: A structured collection of information that\
    \ an AI system uses to generate responses or make decisions. \n\n**Keyword extraction**\n\
    \n: An AI-powered process that automatically identifies and extracts the most\
    \ important or frequently used words or phrases from a text. This functionality\
    \ can be particularly useful for academics when summarising research papers or\
    \ identifying key themes in large bodies of literature. \n\n**Knowledge graph**\n\
    \n: A network representation of relationships between entities (e.g. concepts,\
    \ people, events) in a knowledge domain. AI-powered knowledge graphs can help\
    \ researchers visualise connections within their field of study, potentially revealing\
    \ new research directions or unexplored relationships between concepts. \n\n##\
    \ L\n\n**Large language models (LLMs)**\n\n: Advanced AI systems trained on vast\
    \ amounts of text data, capable of understanding and generating human-like text.\
    \ LLMs, such as GPT-3 and GPT-4, represent the AI technology underpinning many\
    \ AI writing assistants and research tools used in academia. \n\n**Large neural\
    \ network models**\n\n: Complex artificial neural networks with many layers and\
    \ parameters, designed to process and analyse large amounts of data. These models\
    \ underpin various AI tools used for tasks such as natural language processing,\
    \ image recognition, and data analysis. \n\n## M\n\n**Machine learning**\n\n:\
    \ A subset of AI that focuses on the development of algorithms and statistical\
    \ models that enable computer systems to improve their performance on a specific\
    \ task through experience. ML is used in various tools for data analysis, pattern\
    \ recognition, and predictive modelling across disciplines. \n\n**Model(s)**\n\
    \n: In AI, a model refers to the computational representation of a system or process,\
    \ trained on data to make predictions or decisions. \n\n**Multi-modal**\n\n: AI\
    \ systems that can process and integrate information from multiple types of input\
    \ (e.g. text, images, audio). Multi-modal AI tools can be particularly useful\
    \ for researchers working with diverse data types or in interdisciplinary fields.\
    \ \n\n## N\n\n**Narrow AI**\n\n: Also known as “weak AI” or ‘specialised AI’,\
    \ narrow AI refers to artificial intelligence systems designed to perform specific\
    \ tasks within a limited domain. Unlike the sci-fi dream of general AI that can\
    \ match human-level cognition across all areas, narrow AI excels at particular\
    \ functions but lacks broader capabilities. Think of it as a highly skilled specialist\
    \ rather than a jack-of-all-trades. \n\n**Natural language**"
