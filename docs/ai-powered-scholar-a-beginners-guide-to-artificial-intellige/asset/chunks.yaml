    \ suggestions, identify any assumptions or impracticalities, and redirect the\
    \ AI to improve its outputs. Don’t hesitate to challenge the AI or ask for clarification\
    \ – this iterative process often leads to more refined and valuable ideas.\n\n\
    By adhering to these principles, we can create a structured yet flexible framework\
    \ for our AI-assisted ideation sessions. This approach allows us to harness the\
    \ AI’s knowledge base and rapid processing capabilities while maintaining control\
    \ over the direction and quality of the brainstorming process.\n\nWith the above\
    \ principles at the fore of our ideation journey, the following steps provide\
    \ a pathway to navigating towards a desired endpoint, for example, generating\
    \ ideas for research projects and research questions. Here’s how you might go\
    \ about it:\n\n1.  Compose initial prompt: Start with a clear, context-setting\
    \ prompt that introduces your research background and constraints and defines\
    \ the role of the chatbot (e.g. an expert in a specific disciplinary domain and/or\
    \ skill).\n\n2.  Discuss AI suggestions: Critically review the AI’s recommendations,\
    \ identifying any limitations and probing for more refined ideas.\n\n3.  Extract\
    \ viable possibilities: Narrow down the suggestions through iterative exchanges,\
    \ focusing on promising directions that balance visionary aims with practical\
    \ realities.\n\n4.  Develop details: Further refine the selected ideas into detailed\
    \ research proposals, including methods, analysis plans, and anticipated outcomes.\n\
    \nTo illustrate how this might play out in practice, consider the case study below,\
    \ exploring a conversation-style interaction between a researcher and an AI chatbot,\
    \ designed to illustrate how AI might be used to generate research ideas, focusing\
    \ on one of my favourite topics: AI on the higher education sector.\n\n## Case\
    \ study: leveraging AI for research project ideation\n\nDr. X, a qualitative researcher\
    \ at a business school, sought to explore the implications of AI on the higher\
    \ education sector. As an experienced scholar, they recognised the potential of\
    \ AI to transform many aspects of education, from teaching and learning to administration\
    \ and research. However, given the breadth of the topic, they needed assistance\
    \ in narrowing down their research focus and generating specific project ideas.\
    \ To aid in this process, they decided to engage with an AI chatbot.\n\nHere are\
    \ the steps they took to realise the ideation process:\n\n### Step 1: Compose\
    \ initial prompt\n\nDr. X crafted a carefully worded prompt to set the context\
    \ for her interaction and wrote the following prompt:\n\n> I’m a qualitative researcher\
    \ in a business school and I’m interested in exploring the implications of AI\
    \ on the higher education sector. I have a background in entrepreneurship and\
    \ applied AI, and experience conducting interviews and focus groups. I’m looking\
    \ for innovative research project ideas that help me investigate how AI is transforming\
    \ higher education, e.g. teaching and learning to administration and research.\
    \ I want to finish the project within a 12-month timeframe. I have limited research\
    \ funds to carry out the research. With those considerations in mind, please act\
    \ in the role of an experienced scholar, capable of ideating novel research projects\
    \ and providing a range of suggestions for potential research directions. This\
    \ is really important for my career so please do a good job. Thanks!\n\n### Step\
    \ 2: Discuss AI suggestions\n\nThe AI chatbot responded with the following suggestions:\n\
    \n*   AI: Based on your research interests and constraints, here are some potential\
    \ research project ideas: \n\n    1.  Investigating the impact of AI-powered personalised\
    \ learning systems on student engagement and academic performance. This could\
    \ involve conducting focus groups with students and interviews with educators\
    \ to understand their experiences and perceptions.\n\n    2.  Exploring faculty\
    \ perceptions and experiences with integrating AI tools into their teaching practices.\
    \ You could interview faculty members across different disciplines to identify\
    \ challenges, benefits, and best practices.\n\n    3.  Examining the ethical implications\
    \ of using AI for student admissions and recruitment decisions. This could involve\
    \ analysing institutional policies and conducting interviews with admissions officers\
    \ and other stakeholders.\n\n    4.  Analysing the potential of AI to streamline\
    \ administrative processes and improve operational efficiency in higher education\
    \ institutions. You could conduct case studies of institutions that have successfully\
    \ implemented AI solutions and interview key stakeholders to identify lessons\
    \ learned.\n\n*   Dr. X: Thanks. I have some thoughts and questions about your\
    \ suggestions. For the first idea, won’t measuring the impact on academic performance\
    \ require a longer timeframe than 12 months? Also, for the third idea, it’s unlikely\
    \ that I can get access to admissions data. Do you have any recommendations for\
    \ navigating that?\n\n*   AI: You raise valid concerns. Regarding the first idea,\
    \ you could focus on shorter-term indicators of engagement, such as student participation\
    \ in class discussions or completion of assignments. This could provide valuable\
    \ insights within your 12-month timeframe, even if the long-term impact on academic\
    \ performance is not yet measurable. As for the third idea, you’re right that\
    \ accessing admissions data could be challenging. One alternative approach could\
    \ be to focus on the perspectives of admissions officers and other stakeholders\
    \ through interviews, without directly analysing sensitive data. You could explore\
    \ their decision-making processes, ethical considerations, and views on the potential\
    \ risks and benefits of using AI in admissions.\n\n*   Dr. X: Ok, great. Thanks.\
    \ I’m leaning towards the second and fourth ideas, as they seem to strike a balance\
    \ between addressing important issues and being feasible. For the second idea,\
    \ do you think it would be better to focus on faculty in specific disciplines\
    \ or to take a more general approach?\n\n*   AI: Focusing on specific disciplines\
    \ could provide a more in-depth understanding of how AI is being integrated into\
    \ particular subject areas. For example, you could explore how business school\
    \ faculty are using AI tools in their teaching of marketing, finance, or operations\
    \ management. This could yield insights that are especially relevant to your own\
    \ business school context. Alternatively, taking a general approach across disciplines\
    \ could help identify common challenges and best practices that transcend subject\
    \ boundaries. This could be valuable for understanding the broader implications\
    \ of AI for teaching and learning in higher education. Ultimately, the choice\
    \ depends on your specific research goals and interests. If you aim to generate\
    \ insights that are directly applicable to your business school, focusing on specific\
    \ disciplines might be the way to go. If you’re more interested in the general\
    \ landscape of AI in higher education teaching, a cross-disciplinary approach\
    \ could be fruitful.\n\n### Step 3: Extract viable possibilities\n\nThrough further\
    \ discussion with the AI chatbot, Dr. X refined their research ideas:"
