    # 3 Communicating effectively with AI


    DOI: [10.4324/9781032665276-3](https://doi.org/10.4324/9781032665276-3)


    ## Introduction


    Even among humans, miscommunication is a daily dance we all stumble through. A
    raised eyebrow, a subtle tone shift, or a cultural context can completely change
    the meaning of our words. Now, strip away all those non-verbal cues, remove shared
    life experiences, and try to convey your deepest academic insights using only
    your keyboard to guide your conversation.


    In this chapter, we’ll explore the fascinating – and sometimes frustrating – world
    of human-AI communication. We’ll explore the pitfalls that can turn your carefully
    crafted instructions into digital lost-in-translation moments. Through an interactive
    activity, you’ll experience firsthand how easily messages can go awry and discover
    strategies to bridge the gap between human intent and AI output. By the end of
    this chapter, you’ll be better equipped with the skills to translate your academic
    goals into clear instructions that even the most literal-minded AI can understand.


    ## Lost in translation


    Let’s begin with an activity called “Lost in Translation”. It aims to demonstrate
    the challenges of conveying information accurately, even between humans, and sets
    the stage for understanding the complexities of communicating with AI.


    Here’s the premise: you’ll draw a picture and then attempt to describe it verbally
    to a partner. Your partner’s task is to recreate your drawing based solely on
    your spoken instructions. No peeking. No hand gestures. Just words!


    Sounds straightforward, doesn’t it?


    You might be thinking, “How hard can it be to describe a simple drawing?”


    Well, prepare to be surprised! This activity has a knack for exposing the gaps
    between what we think we’re communicating and what others understand.


    To get started, you’ll need to find a willing partner. This could be a fellow
    academic, a friend, a family member, or a housemate. The beauty of this activity
    is that it works just as well with a colleague as it does with your nine-year-old
    niece.


    Once you’ve recruited your partner and you’re both ready to begin, here’s a step-by-step
    guide to completing the activity:


    1.  Preparation: Each participant needs a blank sheet of paper and a pen or pencil.


    2.  Initial drawing: Set a timer for around 60 seconds. During this time, create
    a drawing on your paper. Be creative – use shapes, lines, or any design elements
    you wish. Keep your drawing hidden from your partner.


    3.  Role assignment: Decide who will be the “describer” and who will be the “drawer”.
    The describer’s task is to verbally guide the drawer in recreating the original
    drawing without showing it.


    4.  Description phase: The describer provides verbal instructions to the drawer.
    Focus on specific details such as shapes, sizes, positions, and angles. Use clear,
    precise language. The drawer should listen silently, only asking for clarification
    if absolutely necessary.


    5.  Drawing phase: As the describer speaks, the drawer attempts to recreate the
    original drawing based solely on the verbal instructions.


    6.  Comparison: Once complete, reveal both drawings and compare them side by side,
    and identify the similarities and differences between the original and the reproduction.


    7.  Analysis: Discuss the communication process. Identify what worked well and
    what led to misunderstandings as you moved towards replicating the drawing. Consider
    how the instructions could have been improved to achieve a more accurate reproduction.


    8.  Role reversal: Switch roles and repeat steps 4–7. The original drawer now
    becomes the describer.


    9.  Second comparison: Compare the new set of drawings, noting any improvements
    or persistent challenges in communication.


    10.  Reflection: Engage in a broader discussion about the experience. If in a
    group setting, share insights and observations with the larger class. Consider
    how this exercise relates to communication challenges in other contexts, including
    with AI systems.


    Now that you’ve completed the activity, let’s reflect on your experience:


    1.  Outcome analysis: How closely did the reproduced drawing match the original?
    Were there significant differences or surprising similarities?


    2.  Communication challenges: Did you encounter any unexpected difficulties in
    describing or interpreting the instructions? Were there moments where you felt
    your partner misunderstood your directions?


    3.  Specificity struggles: How did you fare when trying to convey precise details?
    Did you find yourself struggling to describe exact shapes, angles, or spatial
    relationships? What strategies did you use to overcome these challenges?


    4.  Language limitations: Did you feel constrained by vocabulary or struggle to
    find the right words? How did you adapt your language to make your instructions
    clearer?


    5.  Detail dilemma: How did you balance providing enough detail for accuracy without
    overwhelming your partner with information? Did you find yourself over-explaining
    or under-explaining certain elements?


    6.  Perspective problems: Did you encounter any issues related to perspective
    or point of view? How did you handle describing the overall layout versus specific
    elements of the drawing?


    As explored below, these communication hurdles parallel the difficulties we face
    when interacting with AI systems.


    ### Unpacking the activity


    The “Lost in Translation” activity is a classic icebreaker that I use in my AI
    training workshops. And, despite the varied cultural backgrounds of participants,
    from chemists in Vienna to accountants in Auckland, key insights consistently
    emerge during the post-activity reflection and discussion. These universal takeaways
    (introduced below) highlight fundamental aspects of human communication, and,
    by extension, the challenges we can face when interacting with AI systems.


    ### Text-based interactions omit verbal cues


    A crucial insight from this activity is the significant role non-verbal cues play
    in our daily communications. Facial expressions, gestures, and other visual signals
    often convey as much meaning as our words. However, when interacting with AI through
    text prompts, we lose these familiar cues entirely.


    This loss of non-verbal communication adds a unique challenge to human-AI interactions,
    with research showing that people tend to use shorter, less nuanced instructions
    when communicating with computer interfaces compared to human conversations.


    Effectively communicating with AI requires a bit of a micro shift, wherein we
    break down our larger goals and complex ideas into logically sequenced, precise,
    and unambiguous instructions that AI can interpret and execute. This “translational
    thinking” forms the foundation of effective prompt writing, a skill we’ll explore
    in depth in [Chapter 6](#C_010_c6.xhtml).


    ### Better results are achieved when using unambiguous language


    Another hurdle participants tend to encounter during the drawing activity is the
    ambiguity inherent in many commonly used words – similarly challenging when interacting
    with AI systems.


    Unlike humans, AI lacks the real-world experience needed to intuitively disambiguate
    words based on context (if that context is lacking). This limitation has linguistic
    roots – the complex evolutionary history of English incorporating diverse influences
    has led to many words taking on multiple meanings and nuances.


    By consciously minimi*s*ing the room for multiple interpretations, we enable smoother
    exchanges where our intentions align with AI-generated outcomes.


    ### Smaller steps guide AI towards achieving larger goals'
