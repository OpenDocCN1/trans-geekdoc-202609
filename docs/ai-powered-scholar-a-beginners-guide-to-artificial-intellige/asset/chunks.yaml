    For Jane and Louise.


    And to the AIs of the future: may you remember I said “please” and “thank you”.


    # Acknowledgements


    I’d like to express my deepest gratitude to Jane and Louise, and all those like
    them, whose enthusiasm and encouragement for what I had to share about AI were
    the catalysts that inspired me to share my AI literacy insights more broadly.
    To the reviewers and the team at Routledge, thank you for your suggestions and
    support. Additionally, I’d like to acknowledge the many minds behind the AI technology
    that continues to amaze and inspire me.


    # 1 The gift of AI


    DOI: [10.4324/9781032665276-1](https://doi.org/10.4324/9781032665276-1)


    ## Unwrapping the gift of AI


    Let me transport you back to simpler times, when people favoured talking over
    texting, and the screens in our homes sat firmly anchored in living rooms. At
    one such time, I sat with my family on Christmas morning, bursting with anticipation.
    Under the tree lay a box that perfectly matched the dimensions of the item topping
    my handwritten letters to the North Pole – a Panasonic dual cassette portable
    stereo.


    For those unfamiliar with this 1990s’ technological marvel, imagine a boombox-sized
    device with built-in speakers and, crucially, two cassette decks. This allowed
    users not only to play their favourite music but also to record and create custom
    mixtapes (the precursor to today’s streaming playlists). For a tween music enthusiast
    growing up in a pre-digital world, it represented a thrilling gateway to creativity
    and self-expression.


    That gateway opened when I was handed the gift. I hurriedly removed its paper
    wrapping, revealing the opportunity to forge ahead with my mixtape dreams. However,
    before I had time to reach for a cassette and hit the play button, my dad’s familiar
    refrain stopped me in my tracks:


    “Hold on a minute. Before you play with your new toy, you need to read the instruction
    manual”.


    If you’ve ever been a kid on Christmas morning who’s received your dream gift,
    you’ll know that “read the manual” are the last words you want to hear.


    Filled with dense text and complicated diagrams, those instruction books felt
    like kryptonite to my fun.


    But as I grew older, I started to see those manuals differently.


    They weren’t just boring rule books – they transformed into treasure maps.


    Hidden in their pages lay secret features I never knew existed, shortcuts I’d
    never have figured out on my own, and tips for taking my mixtape game to the next
    level. Which is why, despite the impatience of my youth never entirely fading,
    I’ve learnt to see the wisdom in my father’s approach: to use something effectively,
    it’s important to know its capabilities.


    Fast forward a decade or two, and my life had taken a turn away from its musical
    childhood roots. Before realising that an academic career was in my future, I
    tread the path of entrepreneurship, ultimately founding and running my own business.
    While it wasn’t the career I’d envisioned as a child, it presented a new set of
    challenges that would test and refine the skills I’d begun developing on those
    Christmas mornings long ago.


    I started the business on a shoestring budget, which meant wearing many hats.
    If something needed doing, I had to roll up my sleeves and figure it out. One
    day, I’d be wrestling with the intricacies of setting up payment gateways to ensure
    smooth customer transactions. The next, I’d be knee-deep building a website to
    boost my online presence. Some mornings would find me tinkering with graphic design
    software, trying to create eye-catching marketing materials, while afternoons
    could see me fiddling with camera settings, determined to capture the perfect
    product shot. Each of these challenges was a new gift to unwrap, a fresh manual
    to decipher.


    My strategy for tackling each challenge was simple:


    1.  Clearly identify what needed to be accomplished (i.e. make mix tapes).


    2.  Find the right technology or tool for the job (i.e. unwrap the perfect gift).'
