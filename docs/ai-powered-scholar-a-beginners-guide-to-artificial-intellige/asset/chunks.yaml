    \ enthusiasm, only to find that Miyagi wishes Daniel to wash his fleet of vintage\
    \ cars. To complete the chore, Daniel is instructed to use specific hand movements,\
    \ delivered by the famous film quote “Wax on, wax off”. Although frustrated to\
    \ learn that his Karate aspirations are temporarily on hold, Daniel obliges Miyagi\
    \ and engages in the task with the expectation that doing a good job should surely\
    \ lead to the commencement of his official training.\n\nWhen the next day arrives,\
    \ Daniel’s hopes of learning to become a Karate master are put on hold again as\
    \ Miyagi assigns another chore to his pupil. Handing Daniel two sanding discs,\
    \ Miyagi provides clear instructions for how the sanding should be conducted,\
    \ “Right circle, left circle”. To which Daniel replies, “Wouldn’t it be easier\
    \ going back and forth?” demonstrating his lack of awareness of Miyagi’s stealth\
    \ training methods.\n\nSeemingly conned out of another day of Karate training,\
    \ Daniel completes the task, leaves disgruntled, but returns with renewed hope\
    \ that *finally* his training can begin. Yet, despite his hopes, disappointment\
    \ ensues as Miyagi hands Daniel a paintbrush and tin and instructs him to spend\
    \ his next day of training painting fences. When Daniel finally reaches the limits\
    \ of his youthful patience, he erupts in protest, claiming he hasn’t learned a\
    \ thing.\n\nIf you’re familiar with the movie, you’ll also be familiar with Miyagi’s\
    \ formative pedagogical approach to fostering skill development. With each chore,\
    \ unbeknownst to Daniel, Miyagi was helping Daniel build the muscle memory and\
    \ reflexes required to tackle any Karate move thrown his way.\n\nIt’s through\
    \ the lens of the Miyagi Framework that I offer you a series of skill-development\
    \ activities in this book. Each is designed to develop your muscle memory and\
    \ AI reflexes. However, unlike the naive Daniel who laboured through his training\
    \ without knowledge that each task was building towards mastery, you’re invited\
    \ to enter the journey fully aware that you have some car waxing, deck sanding,\
    \ and fence painting to do before getting in the AI ring.\n\nBefore proceeding\
    \ to the next chapter, take a moment to reflect on the concepts we’ve explored.\
    \ The questions offered in the “Reflection and discussion” section below are designed\
    \ to deepen your understanding and encourage critical thinking about the role\
    \ of AI in academia. Consider discussing these with colleagues to gain diverse\
    \ perspectives.\n\n## Activity\n\nIf you’re working through this book with friends\
    \ or in a classroom setting, I encourage you to engage with the activities provided\
    \ at the end of each chapter.\n\n### Activity: AI in academia role-play\n\nObjective:\
    \ To explore the potential uses, benefits, and challenges of integrating AI into\
    \ academic work from various perspectives.\n\nInstructions:\n\n1.  Form small\
    \ groups of 3–4 participants.\n\n2.  Assign roles within each group, for example:\n\
