  trans: "\n3. 最关键的是，投入时间培养充分发挥工具能力的必要技能（就像我学会掌握那台双卡座立体声的所有功能一样）。\n\n这种方法帮助我应对创业的挑战，更不用说学术界的复杂性了。\n\
    \n对于学术研究人员而言，人工智能（AI）代表着一个充满潜力的闪亮新礼物。它是一种有望以我们才刚刚开始理解的方式改变学术研究的工具。\n\n我撰写本书的目标是分享我对\
    \ AI 的所学，帮助他人深思熟虑、负责任地使用 AI 工具，并在学术工作流程中发挥其能力。重要的是，在此过程中通过一些乐趣减轻获取 AI 技能的恐惧和压力。\n\
    \n在深入细节之前，让我们先考虑本书旨在做什么，以及哪些内容不在范围之内。\n\n与我童年时那些说明书一致，它们是操作礼物的直接指南，而非深入探讨产品背后的工程，我将涉及\
    \ AI 的历史、应用和影响，但不会探索每一个细节。为什么？因为比我更聪明的头脑已经在这些主题上发表过文章了。相反，我选择专注于解开 AI 的实际应用和负责任使用。\n\
    \n这就引出了一个重要问题：这本书是为谁写的？\n\n## 认识简和露易丝\n\n想象两位学者：简，一位眼神明亮、刚刚开始研究之旅的博士生；露易丝，一位拥有多年经验的终身教授。尽管职业阶段不同，她们发现自己站在同一个十字路口——学术与\
    \ AI 的交汇处。\n\n她们都听说 AI 工具可以帮助她们简化写作和研究，但从何开始？她们不想被落下。但她们的日程已经排满了研究、教学和行政任务。她们需要一条清晰、直截了当、易于理解的路径，帮助她们了解如何以有利于学术职业的方式使用\
    \ AI。\n\n这本书是为任何能认同简或露易丝的人而写。\n\n现在，你可能会想：“在这个快节奏的 AI 环境中，*书*会不会有点……老派？简和露易丝难道不能直接谷歌最新的\
    \ AI 工具或观看 YouTube 教程吗？”\n\n这是一个公平的问题。但事情是这样的：虽然在线资源很有价值，\n\n本书提供了一种截然不同的价值主张：一个经过策划、有结构的旅程，从零开始建立你的\
    \ AI 素养。其页面呈现了一条构建坚实、实用基础的路径，该基础专门针对学者，同时考虑到与学术工作相关的伦理考量和负责任实践。\n\n## 如何使用本书\n\
    \n本书以初学者为设计对象。它提供了一条精心构建的路径，帮助你建立 AI 素养并利用强大的 AI 工具提升你的学术工作。以下是充分利用它的一些建议：\n\n\
    1. 建立坚实的基础：还记得*三只小猪*的故事吗？像那个用石头建房的明智小猪一样。在你的 AI 之旅中扎实起步，通过按顺序学习章节。这应能确保你在处理更高级应用之前对基础有扎实的理解。\n\
    \n2. 积极参与：不要只读——要做！完成提供的活动并练习示例。虽然跳 ahead 可能很诱人（我在阅读类似风格的书籍时也有过这种冲动），但我鼓励你抵制这种冲动。花时间建立基础技能在长期来看会带来回报。你未来的自己会感谢你这段时间和精力的投入。\n\
    \n3. 拥抱实验：虽然本书提供结构化指导，但它并非僵化的规则手册。示例和建议策略只是起点。随着你越来越熟练，尝试重新表述提供的 AI 指令，测试不同的 AI\
    \ 工具，并大胆“脱离剧本”。这些实验时刻可能带来令人兴奋的发现，并加深你对 AI 潜力的理解。\n\n4. 扩展你的 AI 词汇：虽然我写这本书时假设读者没有任何\
    \ AI 先验知识，但在途中你会遇到一些专业术语。不要让这种行话吓到你。每当你遇到不熟悉的 AI 术语时，翻到术语表部分即可获得清晰简洁的解释。\n\n5.\
    \ 保持更新：AI 领域以令人望而生畏的速度发展，新的工具和应用几乎每天都在涌现。在撰写时，已有数千种 AI 工具可用。\n\n6. 循序渐进：逐步建立你的\
    \ AI 素养技能，专注于学术工作的实际应用。让你的即时任务和目标指导你的学习，而不是被所有新的 AI 进展所淹没——这会令人筋疲力尽，很快导致不知所措的感觉。\n\
    \n7. 培养好奇心：怀着开放和好奇的心态来对待这段旅程。最有回报的发现往往来自我们愿意探索、提问和玩耍的时候。不要害怕问“如果……会怎样？”或“还能怎么运作？”你的好奇心将是你掌握\
    \ AI 的最大资产。\n\n8. 反思和应用：在阅读本书的过程中，花时间反思你所学的内容。这些 AI 工具会如何改变你的研究过程？你的写作方式？你的数据分析？定期思考如何将你的新知识应用到你的特定学术背景中。\n\
    \n9. 连接和分享：学习在协作时往往更有趣、更有效。考虑与同事组成学习小组来讨论本书中的概念。分享你在学术工作中应用 AI 的经验、挑战和成功。\n\n\
    10. 优先考虑负责任的使用：在探索 AI 能力时，始终将负责任和伦理考虑放在首位。我将在全书中讨论这些问题，但持续反思 AI 的影响并以符合你大学政策和程序的方式行事至关重要。\n\
    \n最后，不要忘记在旅程中暂停下来为自己庆祝。\n\n在我撰写本文时，大多数学者尚未有意识地将 AI 嵌入其学术工作流程，并且在 AI 采用方面正被他们的学生超越。\n\
    \n## 本书结构\n\n本书提供了一系列章节，旨在引导你在学术背景下迈向 AI 素养的学习之旅。我们从建立基础技能开始，假设没有任何 AI 先验知识，以帮助你有效地与\
    \ AI 工具沟通。在此过程中，你将深入了解 AI 的历史轨迹，了解我们如何走到当前的技术状态。你将学习如何将 AI 转变为有价值的研究伙伴，并掌握制定文本指令的细微差别，使\
    \ AI 输出与你的研究目标保持一致。重要的是，我们还将探讨 AI 的伦理考虑和负责任使用，使你能够深思熟虑地将这些工具整合到你的学术工作流程中。一旦建立了坚实的基础，后续章节将邀请你将技能付诸实践。除这些用例外，你还受邀通过随附的在线配套资源探索\
    \ AI 的更多应用。\n\n以下是你可以从每一章中期待的内容：\n\n*   *第 1 章: 解开 AI 的礼物*\n\n    你的旅程始于你现在所在的章节。在这里，为成为\
    \ AI 驱动的学者奠定了基础。在到达结尾之前，你还将额外探讨一些与 AI 使用透明度以及披露声明需求相关的问题。然后，就前往第 2 章开始构建你的 AI\
    \ 工具包。\n\n*   *第 2 章: AI 革命的背景*\n"
