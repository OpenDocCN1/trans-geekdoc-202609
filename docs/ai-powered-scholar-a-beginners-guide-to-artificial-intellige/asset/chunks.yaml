- raw: "*   “Please summarise the key themes and theories presented across the 10\
    \ attached nursing research papers on patient safety in hospitals. The summary\
    \ should be written from the perspective of a nurse educator seeking to design\
    \ an effective curriculum for new graduate nurses on safety protocols and error\
    \ avoidance. Please limit the response to 300 words and use casual, conversational\
    \ language suitable for a classroom lesson. Thanks!”\n\n    *   This combines\
    \ the verb “summarise”, the focus of nursing research papers, the context of a\
    \ nurse educator perspective, alignment with curriculum design, and word count/language\
    \ style constraints.\n\n*   “Please critique the methodology and data analysis\
    \ approach used in the attached draft empirical paper on educational technology\
    \ adoption by teachers. Assess strengths and limitations from the viewpoint of\
    \ an academic journal peer reviewer with expertise in mixed methods research.\
    \ Focus the critique on evaluating the suitability of the selected methods for\
    \ answering the study’s research questions, rather than commentary on the area\
    \ of research itself. The response should be approximately 500 words. Thank you!”\n\
    \n    *   This brings together the verb “critique”, focus on a draft paper, context\
    \ of a peer reviewer lens, alignment targeting methods evaluation, and a word\
    \ count constraint.\n\n*   “Please explain the key concepts underpinning the Social\
    \ Ecological Model that I could teach in an introductory public health course\
    \ for university students new to this framework. Clarify the core principles,\
    \ levels, and factors in the model using informal language and relatable examples\
    \ that will make sense to undergraduate students from diverse academic backgrounds.\
    \ Limit the response to 750 words. Thanks”.\n\n    *   This combines the verb\
    \ “explain”, focus on a specific framework, context of an intro undergraduate\
    \ course, alignment to use informal language/examples, and guidance for how many\
    \ words the AI should aim to generate.\n\nAdditional examples you might draw on\
    \ when writing your own prompts include:\n\n*   “Synthesise common themes and\
    \ relationships across these 10 papers related to \\[topic\\] to highlight key\
    \ insights in a 250-word abstract. Adopt an objective point of view, avoiding\
    \ biases where possible”.\n\n*   “Construct a concept map depicting the core theories\
    \ and relationships covered in the attached chapter. Focus specifically on the\
    \ sections related to \\[subtopic\\]”.\n\n*   “Write a script for a 3-minute video\
    \ introduction to the attached research paper on childhood development that highlights\
    \ the key findings in simple terms for a general viewer audience”.\n\n*   “Analyse\
    \ the attached dataset to identify key trends and patterns related to \\[research\
    \ topic\\] and interpret the key takeaways for public policy implications. Present\
    \ findings in a 250-word executive summary”.\n\n*   “Review the attached draft\
    \ survey measuring \\[variables\\] and make recommendations to improve validity\
    \ and reduce bias. Focus feedback on question types, wording, order, rating scales,\
    \ etc. from an expert survey methodology perspective”.\n\n*   “Critique the strengths\
    \ and weaknesses of the methodology used in the attached paper from the perspective\
    \ of a peer reviewer. Focus on evaluating the appropriateness of methods for the\
    \ research aims and suggestions to better establish causality”.\n\n*   “Compare\
    \ the experimental findings described in these two research papers on \\[topic\\\
    ] and synthesise similarities and differences. Avoid discussion of implications\
    \ or opinions on the work itself”.\n\n*   “Please write a blog post summarising\
    \ recent research on \\[topic\\] highlighting key practical implications for educators\
    \ in plain language. Assume a reader audience of school administrators and teachers”.\n\
    \n*   “Draft a 200-word conference presentation abstract summarising the aim,\
    \ methods, key findings and conclusions of the attached research manuscript on\
    \ \\[topic\\]”.\n\nAs these example prompts illustrate, by strategically combining\
    \ elements, you can create nuanced, tailored instructions that guide AI tools\
    \ towards achieving your specific academic objectives. Doing so allows for a nearly\
    \ infinite variety of prompts, each precisely tuned to your unique research needs\
    \ and goals.\n\n## Summary of prompt-writing strategies\n\nBased on hands-on experience,\
    \ combined with best practice approaches,\n\n*   Use natural, conversational language\
    \ instead of terse or technical phrasing.\n\n*   Avoid ambiguity by being specific.\
    \ Define any potentially vague instructions (unless, that is, you’re intentionally\
    \ seeking vague responses from the AI).\n\n*   Provide relevant examples and attachments\
    \ to anchor the context.\n\n*   Impose helpful creative constraints like word\
    \ counts, formats, and inclusion/exclusion criteria.\n\n*   Be transparent about\
    \ limitations – acknowledge if the generated text requires intent, ethics, and\
    \ accuracy vetting.\n\n*   Prime the AI with an assigned role (explored in [Chapter\
    \ 4](#C_008_c4.xhtml)).\n\n*   Express sentiment and conversation style preferences\
    \ to shape the interaction.\n\n*   Refer back to previous responses to build association\
    \ and continuity.\n\n*   Start prompts with a specific action verb like “summarise”,\
    \ “analyse”, “compare”, etc.\n\n*   Specify desired formats, styles, and any other\
    \ expectations.\n\n*   Monitor outputs and refine prompts progressively to align\
    \ AI responses with your goals.\n\nLastly, remember that prompt writing is an\
    \ iterative process – your initial attempts will rarely generate perfect results.\
    \ In my experience, interacting with AI chatbots is a bit like playing a game\
    \ of tennis. Ideas and instructions volley back and forth across a digital net,\
    \ with each exchange refining your approach. And just like any skill, the more\
    \ you practice, the better you’re likely to become. Please don’t be discouraged\
    \ if your first serves don’t quite hit the mark.\n\nWith this iterative nature\
    \ of prompting in mind, let’s explore an approach to help you become more comfortable\
    \ and proficient in this process.\n\n## Iterative prompt refinement\n\nIterative\
    \ prompt refinement refers to progressively adjusting the wording of prompts based\
    \ on the AI’s responses so that you achieve more accurate, relevant, and useful\
    \ outcomes. This iterative cycle not only enhances the quality of AI-generated\
    \ content but can also deepen your understanding of effective prompt design.\n\
    \nBelow, let’s explore a workflow for engaging in an iterative dialogue with AI\
    \ systems, ensuring that each interaction moves closer to your desired AI-generated\
    \ outcome.\n\n1.  Start with a clear objective: Before initiating the refinement\
    \ process, clearly define your objective. What specific information or type of\
    \ response are you seeking from the AI? Having a clear goal in mind helps focus\
    \ the refinement process and evaluate the AI’s responses against your objectives.\n\
    \n2.  Analyse initial responses: Evaluate the AI’s initial responses to understand\
    \ how it interprets your prompts. Identify areas of misalignment, such as inaccuracies,\
    \ irrelevant information, or misunderstandings of the task. This analysis will\
    \ guide your prompt adjustments.\n\n3.  Implement incremental adjustments: Based\
    \ on your analysis, make incremental adjustments to your prompts. This could involve\
    \ clarifying the context, adding to, refining instructions, or specifying constraints.\
    \ Small, focused changes allow you to isolate the effects of each modification,\
    \ understanding how each element of the prompt influences the AI’s response.\n\
    \nStrategies for incremental adjustments can include:\n\n*   Specifying the task:\
    \ If the AI’s response is off target, make the task more explicit.\n\n*   Adjusting\
    \ the level of detail: If the response is too general, adjust the prompt to specify\
    \ the desired level of detail or scope of the response.\n\n*   Providing examples:\
    \ Including examples of the desired output can guide the AI towards the preferred\
    \ style or format."
