    ## A


    ### Alignment

    The consistency of an AI system’s actions and decisions with human values and
    intentions. This involves designing AI models that understand and adhere to ethical
    guidelines, societal norms, and the specific objectives set by their human developers
    or users. Alignment is a critical concern in AI safety and ethics, particularly
    as AI systems become more capable.


    ### Anthropic

    An artificial intelligence research and safety company founded by former employees
    of OpenAI (the company behind ChatGPT). Anthropic focuses on developing large-scale
    AI models while emphasising AI safety and ethical considerations. Their popularly
    used chatbot, Claude, is available at [www.claude.ai](http://www.claude.ai).


    ### API (Application Programming Interface)

    A set of protocols, routines, and tools for building software applications. In
    the context of AI, APIs allow developers to integrate AI capabilities into their
    applications or access AI services provided by companies like OpenAI or Google.


    ### Artificial intelligence

    A branch of computer science focused on creating systems that can perform tasks
    which typically require human intelligence. These tasks include learning, reasoning,
    problem-solving, perception, language understanding, and creativity. AI systems
    range from simple programs that solve specific problems to complex learning systems
    that adapt and operate autonomously.


    ### Attention mechanism

    A key component in many modern AI models, particularly in natural language processing.
    It allows the model to focus on specific parts of the input data when producing
    an output, mimicking human attention and greatly improving the performance of
    tasks like translation and text summarisation.


    ### Augmentation

    The enhancement of human capabilities or experiences through the use of technology,
    particularly artificial intelligence and other digital tools. In academic contexts,
    augmentation can refer to the use of AI to support and enhance research, writing,
    and analytical processes.


    ### Automation/Automated

    The technology-enabled process of making systems or processes function automatically,
    without human intervention. In academia, automation can streamline repetitive
    tasks, allowing researchers to focus on other aspects of their work.


    ### Autonomous systems

    AI systems capable of operating and making decisions without direct human control.
    These systems use ML algorithms to adapt to new situations and improve their performance
    over time.


    ## B


    ### Bias

    Systematic errors or unfairness in data, algorithms, or interpretation of results.
    It can manifest in various forms, including data bias, algorithmic bias, and interpretation
    bias. Addressing bias in AI is critical to ensure fairness, accuracy, and ethical
    use of technology in academic research. This involves careful data selection,
    algorithm design, and ongoing monitoring to identify and mitigate potential biases
    that could skew research outcomes or perpetuate societal inequalities.


    ### Big Data

    Extremely large datasets that may be analysed to reveal patterns, trends, and
    associations, especially relating to human behaviour and interactions. In academia,
    Big Data offers unprecedented opportunities for research but also presents challenges
    in terms of storage, analysis, and ethical considerations.


    ### Black Box AI

    AI systems whose decision-making processes are not transparent or easily interpretable
    by humans. This lack of explainability can be problematic in academic research,
    where understanding the reasoning behind conclusions is crucial.


    ### Bodies of knowledge

    In the context of AI and academic research, this term refers to the vast collections
    of information, theories, and data. It’s essentially the AI’s “textbook” – a comprehensive
    repository of information it can draw upon to generate responses or perform tasks.


    ### Bot

    Short for “robot”, a bot is a software application that runs automated tasks over
    the internet. Bots can be used for tasks like literature searches, data collection,
    or even as research assistants.


    ## C


    ### Chatbot

    A software application designed to simulate conversation with human users, especially
    over the internet. It uses natural language processing (NLP) and artificial intelligence
    to understand user queries and generate responses. Chatbots can range from simple,
    rule-based systems that respond to specific keywords or phrases, to more advanced
    AI-driven bots capable of learning and adapting to user interactions over time.


    ### ChatGPT

    An AI chatbot developed by OpenAI, based on the Generative Pre-trained Transformer
    (GPT) architecture. ChatGPT has gained significant attention in academia for its
    ability to engage in human-like conversations, answer questions, and assist with
    writing tasks.


    ### Clustering

    A ML technique that involves grouping similar data points together. It’s used
    in academic research for tasks, such as data exploration and pattern recognition.


    ### Context window

    The amount of text (information) an AI can “remember” and consider when generating
    a response. Think of it as the AI’s short-term memory or attention span.


    ### Conversation-style chatbot

    A type of chatbot designed to mimic human-like conversational interactions.


    ### Compute

    The amount of computational power and resources required to run AI models or perform
    technological tasks. The availability of compute can significantly impact the
    scale and complexity of AI models that can be developed and deployed.


    ### Computational power

    The capacity of a computer or a system to process and manipulate data. It is typically
    measured by the speed and efficiency with which a system can execute instructions,
    handle complex calculations, or process large amounts of data. Advancements in
    computational power have been a key enabler for the development and deployment
    of sophisticated AI applications in academic research.


    ### Computer program

    A sequence of instructions written to perform a specified task with a computer.
    These instructions provide the guidelines for how the program operates and interacts
    with other software and hardware.


    ### Co-pilot

    A system or tool that assists users in completing tasks. In the context of AI,
    it refers to AI-powered assistants that work alongside humans, augmenting their
    capabilities.


    ## D


    ### Dataset

    A collection of data used in research and analysis. Key characteristics include:
    size (the number of records and features); type (e.g. numerical, categorical,
    textual, or a combination); structure (e.g. organised in a defined schema or unstructured);
    quality (accuracy, completeness, and consistency); and source (origin and collection
    method, which can affect reliability and relevance).


    ### Deep learning

    A subset of ML based on learning data representations, as opposed to task-specific
    algorithms. It involves the use of large neural networks with many layers of nodes
    (hence “deep”), trained on vast amounts of data. These neural networks attempt
    to simulate the behaviour of the human brain – albeit in a limited sense – to
    process data and create patterns for decision making.


    ### Deep learning architecture

    The structure and design of neural networks used in deep learning. These architectures
    are layered constructs of algorithms intended to model high-level abstractions
    in data.


    ### Document analysis

    The use of AI tools to extract, analyse, and summarise information from academic
    papers, reports, or other documents. This can be particularly useful for literature
    reviews or data extraction from multiple sources.


    ### Draft zero

    AI tools can create initial drafts of academic writing. Ideally, these drafts
    should be used for brainstorming and/or getting your initial thoughts on the page,
    and not be submitted for publication as a replacement for human contributions.


    ## E


    ### Ethical AI

