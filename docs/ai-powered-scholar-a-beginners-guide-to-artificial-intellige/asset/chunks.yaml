    # AI Bias in Academic Research


    ## Overview of Bias Types


    * Socioeconomic bias: AI models might favour perspectives or experiences more
    common to certain economic classes.

    * Cultural bias: The AI might produce content that reflects the dominant culture
    of its training data, potentially misrepresenting or ignoring other cultures.


    AI models can reproduce and amplify biases, leading to potentially harmful outcomes,
    with several key sources contributing to this issue, including:


    ## Key Sources of Bias


    * Biased training data: If the text corpus used to train the model reflects gender,
    racial, or other prejudices, the chatbot will likely absorb and amplify those
    biases in its generated content. For example, an AI trained mainly on economics
    papers authored by men might produce content with a male-skewed perspective.

    * Underrepresentation: Lack of diverse representation in training data can cause
    chatbots to perform poorly for underrepresented groups. For example, a model trained
    primarily on academic writing from Western, educated, industrialised, rich, and
    democratic (WEIRD) societies may struggle to appropriately discuss research from
    other contexts.

    * Labelling bias: Human annotators involved in labelling training data can unintentionally
    introduce their own subjective biases. If certain types of academic papers are
    consistently flagged as “low quality” while others are labelled “high impact”
    due to annotator prejudices, the resulting AI model will reflect those judgements.

    * Feedback loops: In some applications, outputs from a biased chatbot can influence
    real-world behaviour in academia that reinforces the initial prejudice. For instance,
    if a biased chatbot is used to recommend papers or researchers to cite and collaborate
    with, over time the “Matthew Effect” of accumulated advantage


    ## Scenarios for Exploration


    To explore how biases in AI models could impact our academic writing and research,
    consider the following two scenarios.


    ### Scenario 1: Gender bias


    Remember Jane, our fledgling PhD student from [Chapter 1](#C_005_c1.xhtml)? Imagine
    that she’s using an AI chatbot to help brainstorm research topics and outline
    her literature review on gender representation in government. As someone passionate
    about gender equality, Jane is interested in exploring factors that enable or
    hinder women’s political participation and leadership. However, the AI chatbot
    Jane is using was trained on a dataset that overrepresented male-authored papers
    in her field.


    When Jane prompts the chatbot to suggest potential research questions, it generates
    ideas for research questions such as: “What institutional reforms can increase
    the competitiveness of male candidates in elections?” and “How does the gender
    of political leaders affect their foreign policy decision-making?”


    While these questions touch on important issues of electoral systems and leadership
    styles, the chatbot’s outputs exhibit a bias towards male-centric framings of
    political science research. It fails to surface questions that directly address
    women’s experiences, such as gendered barriers to political ambition, the role
    of women’s movements in driving policy change, or the impact of intersectional
    identities on women’s political representation.


    If Jane were to uncritically adopt the chatbot’s suggestions, her literature review
    could end up with a limited set of research questions that don’t fully engage
    with the rich scholarship on women in politics.


    To mitigate this bias, Jane would need to critically evaluate the chatbot’s outputs
    and actively seek out research that centres women’s voices and perspectives.


    She might use her prompt-writing skills (see [Chapter 6](#C_010_c6.xhtml)) with
    the chatbot to consider potential research questions from the standpoint of feminist
    political theorists, women’s rights organisations, or scholars studying the political
    empowerment of marginalised women.


    Here are some prompts she could use to help identify and mitigate potential gender
    biases in the AI chatbot’s responses:


    Example prompts for identifying biases in the AI-suggested topics:


    * “What percentage of the research questions you suggested were framed around
    women’s experiences and perspectives?”

    * “Can you provide a gender breakdown of the authors of the papers you used to
    generate these topic ideas?”

    * “How do your topic suggestions differ if I ask for research questions focused
    specifically on women’s political representation?”


    Example prompts for surfacing underrepresented perspectives:


    * “What research questions might a feminist political theorist propose on this
    topic?”

    * “Can you suggest some influential women scholars in this field whose work I
    should explore further?”

    * “What topics related to women in politics might be overlooked in mainstream
    political science research?”


    Example prompts for challenging assumptions and framings:


    * “What assumptions about gender and politics underlie the way you framed that
    research question?”

    * “How might the phrasing of that question be revised to avoid perpetuating gender
    stereotypes?”

    * “Can you provide an alternative perspective on this issue from a feminist standpoint?”


    Example prompts aimed at seeking gender-balanced examples and evidence:


    * “Can you provide examples of both men and women politicians who have dealt with
    this challenge?”

    * “What empirical studies have examined this phenomenon disaggregated by gender?”

    * “Are there any datasets or case studies that could help illustrate this point
    from a woman’s perspective?”


    Example prompts with which to evaluate language for gender bias:


    * “Does the language used in your summary of this topic exhibit any gendered connotations
    or stereotypes?”

    * “How might your word choices be perceived by someone sensitive to sexist undertones
    in academic writing?”

    * “What more gender-neutral terms could be used to discuss these issues?”


    In all the examples above, it’s additionally crucial for Jane to remain vigilant
    about the risk of hallucinations. All claims generated by AI should be thoroughly
    verified before being accepted as fact. This step is essential in maintaining
    the integrity of her research.


    Furthermore, Jane could enhance her approach by combining these targeted prompts
    and AI assistance with human-centric bias mitigation strategies. For instance,
    collaborating with colleagues who have complementary expertise in gender studies
    or feminist research methods could provide valuable insights and additional layers
    of scrutiny. This multi-faceted approach – leveraging both AI capabilities and
    human expertise – can lead to more robust and unbiased research outcomes.


    ### Scenario 2: Silicon-valley perspectives


    Louise, an experienced academic, is using an AI chatbot to help generate ideas
    for a grant proposal on the future of work. Louise is well-versed in the literature
    on how technological change has historically affected different occupations and
    demographics. However, Louise is unaware that the AI chatbot she’s using was trained
    on a dataset that overrepresented tech industry perspectives, which tend to be
    more optimistic about the impact of automation on jobs. When Louise prompts the
    chatbot to suggest potential research questions, it generates ideas like: “How
    can policymakers accelerate the adoption of AI to boost productivity and economic
    growth?” and “What re-skilling programs will most effectively transition displaced
    workers into high-tech roles?”


    While these are valid lines of inquiry, the chatbot’s outputs exhibit a bias towards
    the tech industry’s interests and assumptions. It fails to surface more critical
    perspectives on issues like technological unemployment, worker power, and the
    distributional effects of AI across socioeconomic strata.

    '
