    If you’re enthusiastic to explore additional AI applications, you’ll find the
    final chapter of this book to be an invaluable resource. It provides access to
    online materials, including practical use cases, allowing you to continue your
    journey into AI-powered scholarship.


    # That’s a wrap!


    It was tempting to conclude this book with a playful snippet of AI-generated text.
    Perhaps by using a prompt such as: “Please craft a three-line poem, that expresses
    to my family and friends that, finally, the book has been written, and I’ll soon
    be returning to pre-ChatGPT patterns of social interaction after having a day
    off to celebrate”.


    But just as non-disclosed AI-generated content continues to be judged as a misrepresentation
    of human effort, so too would that poem’s sentiments misrepresent any intention
    of dialling down my enthusiasm for building AI skills and sharing them widely.
    I long jumped down the rabbit hole of AI, and, like many other AI enthusiasts
    who attached themselves to the AI rocket ship, I continue to thrive on its energy.


    The pace of advancement, including the almost daily updates about new features,
    apps, business cases, etc. provides more dopamine hits than a bottle of Vyvanse.


    Yet, many across the sector are understandably panicked by AI, viewing it as the
    end of academic scholarship and the death of academic writing.


    Which is why I’d like to ask you a small favour.


    Remember when we metaphorically unwrapped the gift of AI in [Chapter 1](#C_005_c1.xhtml)?
    Now that you’ve journeyed through this book, you’ve hopefully not only unwrapped
    that gift but have begun to feel comfortable using it. This gift is not a zero-sum
    game. I believe lifting others up on their AI journey will help lift academia
    more broadly, and thus help us to retain integrity and relevance (and the chances
    of ongoing employment!) in a sector that’s facing massive disruption. I encourage
    you to become an AI literacy ambassador in your academic community. Share your
    newfound skills and insights with colleagues and students. Organise workshops,
    initiate discussions, or simply offer a helping hand to those still grappling
    with the blinking cursor on a blank page.


    Thank you for coming along on the journey through this book. If you now feel a
    little more comfortable using AI, are a more informed user, or just got some enjoyment
    from my often-times self-indulgent narrative tangents, I’ve achieved what I set
    out to do. If you found value in these pages, I would be very grateful if you
    could do the proverbial “like and subscribe” on social media to help promote the
    book online.


    Lastly, I urge you to be mindful that the AI revolution in academia isn’t just
    about technology – it’s about reimagining the very essence of higher education.
    But that’s a topic for a whole other book!


    ## Notes


    1. [Jensen,](#C_014_c10.xhtml#n10_1b) L. X., Buhl, A., Sharma, A., & Bearman,
    M. (2024). Generative AI and higher education: a review of claims from the first
    months of ChatGPT. *Higher Education*, 1–17. [https://doi.org/10.1007/s10734-024-01265-3](https://doi.org/10.1007/s10734-024-01265-3)


    2. [Cameron,](#C_014_c10.xhtml#n10_2b) J. (2020). *The Artist’s Way: A Spiritual
    Path to Higher Creativity*. Souvenir Press.


    3. [The provided](#C_014_c10.xhtml#n10_3b) response was generated by [Claude.ai](http://Claude.ai),
    using Claude 3.5 Sonnet.


    4. [To learn](#C_014_c10.xhtml#n10_4b) more about Professor Rowena Murray, visit
    [https://www.anchorage-education.co.uk/about-me/](https://www.anchorage-education.co.uk/about-me/)


    5. [For insights](#C_014_c10.xhtml#n10_5b) into AI’s costs, including environmental
