    In the next chapter, we’ll unpack the principles and techniques of prompt writing,
    equipping you with the skills to craft precise and effective “AI spells”. But
    before we jump into the practicalities of prompts, let’s continue our exploration
    of AI’s history, focusing on the evolution of human-AI interaction methods by
    tracing the development of prompts themselves.


    ## Prompt engineering


    Prompt engineering is the strategic process of designing and refining instructions
    or questions to elicit specific, desired responses from AI models.


    To fully appreciate prompt engineering, it’s helpful to understand how our interaction
    with AI has evolved. As previously mentioned, early AI systems required precise,
    often code-like commands. By contrast, today’s models can interpret and respond
    to natural language, making them more accessible but also more nuanced in their
    requirements for effective communication. Among these advancements, the concepts
    of zero-shot and few-shot learning


    * Zero-shot learning: This refers to an AI model’s ability to understand and perform
    tasks it has never explicitly been trained to do. This capability can be considered
    revolutionary because it enables AI systems to apply learned knowledge from one
    domain to unfamiliar tasks or categories without additional training data. In
    practical terms, zero-shot learning allows researchers to query AI models on niche
    subjects or generate content in styles that were not necessarily part of the model’s
    training data.

    * Few-shot learning: This takes zero-shot learning a step further by enabling
    AI models to learn new tasks or understand new concepts from just a few examples.
    Few-shot learning is particularly useful in academic research and specialised
    fields where data scarcity is common. By providing a few examples within the prompt,
    users can guide the AI to generate content or analyse data in specific, desired
    ways.

    * Continuous learning and adaptation: Beyond zero-shot and few-shot learning,
    another significant trend is the move towards continuous learning models. These
    AI systems are designed to learn and adapt to new data or interactions over time,
    gradually improving their performance and expanding their knowledge base. Continuous
    learning models offer the potential for more personalised and context-aware interactions
    with AI.


    To appreciate the intricacies of prompt engineering, it’s essential to understand
    the underlying natural language processing mechanisms of AI models,


    * Natural Language Understanding: NLU is a subset of NLP that deals with machine
    reading comprehension. It enables AI models to understand and interpret human
    language in a way that captures meaning, sentiment, and intent. When you provide
    a prompt to an AI system, the NLU component breaks down the text into understandable
    segments, analysing syntactic structures (grammar and sentence structure) and
    semantic information (i.e. meaning). The AI model uses this analysis to grasp
    the context, questions, or tasks you’re presenting. It identifies key elements
    such as the subject matter, the desired action (e.g. summarising, analysing),
    and any specific constraints or requirements embedded in the prompt. This understanding
    is crucial for generating a response that aligns with the user’s intentions.

    * Natural Language Generation: Once the AI understands the prompt through NLU,
    it proceeds to NLG, which, in the context of academic writing, could be thought
    of as generating text from data. This process involves selecting appropriate words,
    constructing sentences, and organising coherent paragraphs that address the prompt’s
    requirements. NLG is not merely about stringing words together; it requires the
    model to apply creativity, reasoning, and sometimes even a degree of empathy to
    produce responses that are not only relevant but also engaging and human-like.


    The magic of prompt engineering lies in the seamless interplay between NLU and
    NLG. Effective prompts are designed to leverage this interplay, guiding the AI
    through the NLU phase to ensure it correctly understands the task at hand, and
    then through the NLG phase to produce a tailored, coherent response. For instance,
    a well-crafted prompt that asks the AI to “Summarise the key points of the following
    text in a bullet-point format” clearly directs the NLU component to focus on the
    extraction and condensation of information. The NLG component, meanwhile, is guided
    to format the output as a list of bullet points, adhering to the concise and direct
    nature of the instruction. Understanding the roles of NLU and NLG in processing
    prompts helps us appreciate the importance of clarity, specificity, and context
    in prompt engineering.


    As AI capabilities continue to advance, the importance of skilled prompt engineering
    in academia will undoubtedly grow. This means that the ability to effectively
    communicate with and guide AI systems will become as crucial as any other research
    skill. While it’s never too late to start learning, I strongly advocate beginning
    this journey sooner rather than later. The earlier researchers can integrate these
    skills into their workflow, the better positioned they’ll be to leverage AI’s
    full potential and supercharge their research workflows.


    With this in mind, we’re now ready to move beyond the historical context and theoretical
    foundations explored thus far. In the next chapter, we’ll turn to the practical
    art of prompt writing, exploring concrete techniques, best practices, and real-world
    examples that will hopefully empower you to craft effective prompts and help you
    become an effective AI-powered scholar.


    ## Notes


