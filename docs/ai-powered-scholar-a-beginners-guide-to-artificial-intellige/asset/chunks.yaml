  trans: '

    我们将从 AI 发展的更广阔历史背景出发，定位我们的旅程。本章提供了 AI 演进的简明而全面的概述，帮助你理解我们是如何走到今天的。你将深入了解塑造 AI
    发展轨迹的关键里程碑和范式转变，为其在学术界的当前和未来应用奠定基础。


    * 第 3 章：与 AI 有效沟通

    沟通是任何合作的关键，你与 AI 工具的关系也不例外。本章解析了与大型语言模型（LLMs）交互的细微差别。通过实际示例和练习，你将开始学习如何制定清晰、精确的指令以获得最佳结果的旅程。我们将探讨上下文、具体性和自然语言在
    AI 交互中的重要性，帮助你培养与 AI 研究助手有效协作所需的语言技能。


    * 第 4 章：设计你的 AI 研究助手

    想象拥有一个完全根据你的需求量身定制的科研助手。本章展示了你如何通过为 AI 系统分配特定角色来实现这一点。你将发现如何通过定义其专业知识、背景和个性特征，将
    AI 塑造成你的定制研究伙伴。这种方法将使你能够在各种研究任务中利用 AI 的多功能性，从文献综述到编辑你的学术写作等。


    * 第 5 章：对话式 AI 的简史

    在 AI 发展历史背景的基础上，本章聚焦于“对话式 AI”的演进。你将追溯从早期的基于规则系统到当今复杂的 AI 聊天机器人的发展历程。这段穿越时光的旅程将帮助你理解当前
    AI 的能力和局限性，为你与 AI 工具的交互设定现实的期望。


    * 第 6 章：提示 AI 实现有效沟通

    在有效 AI 交互的核心是提示工程的艺术。本章深入探讨编写文本指令以引导 AI 工具生成与你的研究目标一致的相关、高质量内容。你将学习构建提示、优化输出以及迭代以获得最佳结果的策略。通过掌握这些技能，你将能够从
    AI 协作中获得最大价值。


    * 第 7 章：迈向 AI 工具的负责任使用

    在 第 7 章 中，重点转向解决在学术研究中使用 AI 工具相关的关键风险。它提供了多种策略，帮助你减轻这些风险并成为 AI 技术更有见识的用户。通过探索这些方法，你将更好地
    equipped 应对潜在的陷阱，并就如何负责任和有效地进行 AI 辅助研究做出明智的决定。


    * 第 8 章：与 AI 聊天机器人一起头脑风暴

    学习如何与 AI 系统进行互动式头脑风暴，以发现新颖的联系并产生创新想法。本章提供了富有成效的人机协作指导原则，并概述了 AI 增强式头脑风暴的实用流程，通过案例研究加以说明。你将被介绍到各种创造性思维技巧，这些技巧可以与
    AI 聊天机器人结合使用，以激发发散思维和挑战假设，同时在整个过程中保持人类主体性和批判性思维。


    * 第 9 章：AI 驱动的文献搜索

    本章探讨了 AI 在学术文献搜索中的变革潜力，特别关注语义搜索能力——一种旨在理解搜索查询的含义和上下文，而非匹配关键词的方法。你将了解 AI 如何改变学者发现相关文献的方式，超越传统的基于关键词的方法。文中讨论了在研究中有效利用这些工具的实用策略，以及潜在的陷阱和伦理考虑。到本章结束时，你将能够将
    AI 驱动的文献搜索整合到你的学术工作流程中，增强你在不断扩大的学术出版物海洋中导航的能力。


    * 第 10 章：与 AI 写作与编辑

    本章提供了利用 AI 进行学术写作的实用策略，解决了常见的写作障碍和令人望而生畏的空白页问题。它介绍了“blah writing”，一种利用 AI 聊天机器人将意识流想法转化为连贯叙述的技术。本章随后探讨了
    AI 辅助生成文档大纲、扩展文本以增加深度以及压缩文本以求简洁的方法。它还考察了 AI 在编辑中的作用，提供实用指导，说明如何将 AI 聊天机器人转变为 24/7
    编辑助手。


    * 第 11 章：附赠章节

    在这里，你将找到解锁随附在线资源并访问附赠章节的信息。我要是告诉你这一章讲什么就毁了惊喜 ;)


    ### 术语表

    在你的旅程中，你可能会遇到不熟悉的术语。如果是这样，请查阅包含的术语表。它旨在澄清经常遇到的 AI 术语，并作为实用参考，提供清晰简洁的定义，而非详尽的列表。把它当作你友好的快速参考指南，提供易于理解的解释，帮助你在
    AI 融入学术工作流程的导航中。


    到你读到结尾时，你不仅会理解如何有效地指导 AI 工具帮助你完成研究任务，而且还能批判性地评估 AI 的优势和局限性，并理解 AI 发展的历史轨迹。


    ## 在线配套资源

    本书附带一个动态的在线配套资源。通过访问 [www.broneager.com/aischolar](http://www.broneager.com/aischolar)
    获取访问权限，并发现：

    * 精选的 AI 工具列表：一个全面且定期更新的与学术工作相关的 AI 工具列表。

    * 最佳实践和技巧：关于如何将最新的 AI 进展整合到你的学术工作流程中的见解。

    * 案例研究：关于如何以创新方式利用 AI 的现实世界示例，随着新应用的出现而更新。


    将具体的 AI 工具推荐放在配套网站上的决定，是认识到 AI 正在以空前的速度发展而做出的。因此，虽然本书为你提供了与 AI 合作的基础技能和持久原则，但在线资源确保你能够获得当前、实用的信息。


    当我们一起踏上这段 AI 学习之旅时，我认识到集体智慧往往超越个人知识。这就是为什么我热烈欢迎你的贡献。如果你发现有价值的资源、为学术工作开发了创新的 AI
    应用，或有可供同行学者受益的见解，我鼓励你与我联系。你的经验和发现可能会 featured 在配套网站上，帮助丰富我们共同的学习体验。


    ## 声明

    鉴于本书的主题是 AI，你可能在想 AI 是否在其中发挥了作用。简短的回答是肯定的。如果你我说“没有”，你会相信我吗？


