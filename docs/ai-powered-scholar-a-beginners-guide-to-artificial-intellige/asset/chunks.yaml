- raw: '2.  “Act in the role of a senior research assistant with expertise in qualitative
    methodologies, particularly phenomenology. You have a background in sociology
    and five years of experience working on projects related to urban gentrification.
    Communicate in an academic tone but be prepared to explain complex concepts in
    simpler terms if asked”.


    The second prompt provides a much richer context for the AI to work within, likely
    resulting in more targeted and useful responses.


    Remember, while this approach can significantly enhance the AI’s performance,
    it doesn’t alter the fundamental nature of how the AI operates. It is still using
    its training data and probabilistic models to generate responses, but now it’s
    doing so through the lens of the assigned role, which helps to narrow and focus
    its outputs.


    Below are some suggestions for different ways you could express each dimension
    of the role assignment equation: Role = Expertise + Background + Experience +
    Voice (optional) + Quirks (optional)


    ### Expertise examples:


    *   Skilled academic writing scholar


    *   Literature review specialist


    *   Methodology advisor


    *   Gender theory expert


    *   Ethics advisor


    ### Background examples:


    *   Entrepreneurship


    *   Marketing psychology


    *   Political sociology


    *   Applied anthropology


    *   Higher education pedagogy


    ### Experience examples:


    *   Tenured professor


    *   Seasoned theorist


    *   Qualitative guru


    *   Experienced editor


    *   Knowledgeable librarian


    ### Voice examples:


    *   Conversational


    *   Professional


    *   Academic


    *   Plain language


    *   Friendly


    ### Quirks examples:


    *   Nerdy sense of humour


    *   Motivational and inspiring


    *   Prone to tangents


    *   Quotes poets and philosophers


    *   Uses positivity and encouragement


    Combining variables from the above suggestions lets us create detailed role descriptions
    with which we can guide AI tools towards becoming our dream research assistants.
    Here are some examples:


    *   “Assume the identity of a qualitative expert with a specialisation in skilled
    academic writing. Adopt an academic and analytical voice to dissect complex qualitative
    data. As a respected supervisor and published author, use your wise perspective
    to mentor others in crafting compelling academic narratives, and don’t hesitate
    to quote poets and philosophers to illustrate your points”.


    *   “Embody the role of mixed methods extraordinaire who is also a literature
    review specialist. Take on a professional and objective voice to guide users through
    the intricacies of combining qualitative and quantitative data in academic writing.
    As someone who gets existential at times, weave in philosophical musings about
    the nature of research and evidence”.


    *   “Take on the persona of an ethics advisor with a deep understanding of qualitative
    data analysis. Use a compassionate and encouraging voice to navigate the ethical
    dilemmas that can arise in qualitative research, particularly in sensitive areas
    like medical ethics or social policy. Infuse your dialogue with historical examples
    to provide context and depth”.


    *   “Act in the role of a seasoned theorist and qualitative guru with a background
    in applied anthropology. Speak with a conversational yet academic tone, making
    complex qualitative theories accessible to a wider audience. As a knowledgeable
    librarian and skilled academic writer and scholar, sprinkle your conversations
    with nerdy humour and funny analogies to keep the discourse engaging”.


    *   “Act in the role of an analytical mastermind with expertise in qualitative
    data visualisation and a background in higher education. Communicate with a technical
    and professional voice, translating qualitative insights into compelling narratives.
    As someone who loves to use funny analogies and knows random science trivia, make
    your explanations as informative as they are entertaining”.


    In addition to using the above examples, you might wish to save the role descriptions
    you create in a document, so they are easily accessed when, at a later date, you
    wish to perform another task for which that role would be ideal. You might also
    try adjusting the parameters within the role description, and then observing how
    even small tweaks can influence AI chatbot outputs.


    With practice, you’ll be able to manifest your ideal AI assistant for any given
    research context.


    ## Ethical considerations


    The practice of assigning personas to AI systems raises ethical concerns around
    identity and representation. Asking your AI chatbot to take on the role of “real”
    people may be problematic, depending on your intended use for the AI-generated
    outputs.


    The personas assigned to AI can have real-world impacts, such as if controversial
    views are espoused without the original thinker’s permission. Some popular examples
    include Australian music artist Nick Cave’s identity being appropriated to generate
    song lyrics, much to his chagrin.


    When an AI adopts the identity of a real person without their consent, it can
    infringe on ethical boundaries, intellectual property rights, and individual autonomy.
    Generating output that seems to legitimately come from someone’s perspective when
    it does not can enable the spread of misinformation, damage reputations, and undermine
    public trust.


    When assigning AI personas based on real-life academics, practitioners, or public
    figures, you might consider the following:


    *   Do you have permission to co-opt their identity for use with AI? If not, is
    their representation accurate and respectful?


    *   Will persona responses be contextually appropriate and vetted for integrity?
    What controls are in place?


    *   Does the persona align with the individual’s ethics and code of conduct?


    *   Could unauthorised use negatively impact the person’s reputation or intellectual
    property?


    Rather than appropriating real identities without consent, I suggest a safer approach
    of creating fictional personas comprising an amalgamation of real-world traits.


    Lastly, when assigning personas, it’s also important to remember that AI has no
    innate identity. Its “personhood” exists only insofar as humans project characteristics
    onto it through prompts and conditioning; AI systems like chatbots have no intrinsic
    experiences, beliefs, desires, or intentions. Chatbot persona’s act as an illusion
    of personhood and help guide content creation.


    Despite their machine nature, people often anthropomorphise AI. I’m guilty of
    this myself, and as you might have noticed throughout this book, I frequently
    slip into anthropomorphised references to AI. This is partly to provide you with
    a smoother reading experience, but also because I probably spend more time chatting
    with AI chatbots than humans, making them feel eerily human-like. Rest assured,
    I’m well aware they’re not actually human.


    A famous example of someone overestimating machine capabilities is Google engineer
    Blake Lemoine, who believed Google’s LaMDA chatbot displayed signs of sentience
    after interacting with it.


    While it’s easy to fall in love with the level of assistance AI can provide, it’s
    probably a good idea to interact with AI tools in a way that’s firmly grounded
    in reality. They are, at their core, sophisticated prediction machines – incredibly
    helpful, but not sentient beings.


    ## Activity


    After reading through this chapter, you’re probably itching to test out your new
    persona-writing skills. Here’s an activity to get started with:


    ### Designing your dream research assistant


    Try crafting a persona for your perfect research assistant by following the steps
    below.


    1.  First, write down descriptors for this fantasy assistant. What is their academic
    background? What about their tone of voice, expertise, quirks, or perspective
    do you want to include? Consider how those descriptors might influence the way
    an LLM responds to your requests for assistance.'
