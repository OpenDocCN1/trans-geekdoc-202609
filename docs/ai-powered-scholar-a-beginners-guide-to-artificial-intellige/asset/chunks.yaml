    Reflect on your experience during the drawing activity. You likely guided your
    partner through a step-by-step process, beginning with a key element and gradually
    adding more detailed descriptions. Expecting your partner to accurately recreate
    the entire drawing from a single, all-encompassing instruction is rather unrealistic.


    This insight directly translates to effective communication with AI systems. While
    AI models can be highly capable of handling complex tasks, if we were to provide
    only a single instruction (i.e. a zero-shot prompt), we are unlikely to be able
    to achieve overly complex tasks, or receive suboptimal outputs in response to
    our requests.


    While zero-shot prompts can be effective for simple tasks, they often fall short
    for more complex objectives. Instead of trying to get the AI to do everything
    at once, breaking down your larger goal into smaller, incremental steps/instructions
    can lead to more accurate and useful outputs. This approach, sometimes called
    chain of thought prompting, allows you to guide the AI more precisely through
    each stage of the task.


    To implement this strategy, consider doing the following:


    1. Start by clearly outlining your overarching objective.

    2. Break this goal down into a series of smaller, manageable sub-tasks.

    3. Craft specific instructions for each sub-task, ensuring they build upon each
    other logically.

    4. Provide context or examples where necessary to clarify your expectations.


    This approach not only improves the accuracy of AI-generated outputs but also
    gives you more control over the process, allowing for adjustments and refinements
    at each step.


    ## Providing examples can help align outputs to inputs


    A key observation from the drawing activity is the power of specific examples
    in enhancing understanding and accuracy. This insight is particularly relevant
    when communicating with AI systems.


    Consider the difference between these two instructions:


    1. “Draw a house”.

    2. “Draw a red brick house with a grey shingled roof, white picket fence, and
    smoke curling from the chimney”.


    The first instruction is rather vague and open to wide interpretation. It could
    result in anything from a suburban mansion to a child’s playhouse. The second
    instruction, however, provides more detail that guides the drawer (or AI) towards
    a particular outcome.


    When interacting with AI chatbots, providing examples can assist with, for example:


    1. Establishing clear boundaries: Define the scope and style of the desired output,
    reducing the AI’s tendency to generate irrelevant or off-topic content.

    2. Setting concrete goals: Give the AI a clear target to aim for, improving the
    relevance and quality of its output.

    3. Demonstrating desired formats or structures: Examples show the AI how you want
    information presented or should be organised.

    4. Clarifying abstract concepts: Complex or nuanced ideas become more tangible
    when illustrated with concrete examples.

    5. Reducing ambiguity: Specific examples can lessen the chances of misinterpretation
    or unintended outputs.


    Remember, the quality of your examples can directly influence the quality of the
    AI’s output, so aim to choose examples that closely align with your desired outcome.
    Furthermore, don’t hesitate to refine or provide additional examples if the initial
    results aren’t satisfactory.


    ## Communicating perspective helps shape AI-generated outputs


    The drawing activity also reveals some insight into how we see the world: our
    perspective. When delivering this activity in a classroom, if you request participants
    to draw their journey to work that day, they typically adopt a first-person viewpoint,
    depicting landmarks as they would see them from inside a vehicle. However, when
    describing this scene to their partner, the replicated drawing rarely takes the
    same perspective. The “drawer” interprets the instructions and tries to reproduce
    the image, but from *their* perspective – looking at the scene, rather than from
    within it, or by providing a bird’s-eye view.


    When engaging with an AI tool, you might consider specifying a perspective you
    want it to adopt (explored further in [Chapter 4](#C_008_c4.xhtml)). This applies
    to various aspects of content generation, including:


    1. Narrative voice: Clearly state whether you want content in first-person, second-person,
    or third-person perspective.

    2. Temporal perspective: Specify if you need a historical overview, current analysis,
    or future projection.

    3. Cultural lens: Indicate if you need a particular cultural viewpoint or a multicultural
    approach.

    4. Theoretical framework: Specify the academic or philosophical stance you want
    the AI to adopt (e.g., feminist theory, post-colonial perspective, or behaviourist
    approach).

    5. Stakeholder viewpoint: In policy or business contexts, you might need to specify
    which stakeholder’s perspective should be prioritised.


    By defining the perspective, you guide the AI to generate content that hopefully
    aligns more closely with your intentions and needs.


    However, despite how clear we may be, it’s important to note the issue of bias
    in AI systems.


    AI models are trained on vast datasets of human-generated content, which inevitably
    contain societal biases. When you specify a perspective, you may inadvertently
    trigger or amplify these biases. For example, if you ask an AI to write from a
    “traditional business leadership perspective”, it might generate content that
    reflects gender biases prevalent in traditional business literature.


    To mitigate biases, aim to:


    1. Be aware of potential biases in your chosen perspective.

    2. Explicitly request diverse viewpoints or counterarguments.

    3. Critically evaluate the AI’s output for unintended biases.

    4. Consider using multiple, contrasting perspectives to get a more balanced view.


    ## Using natural language aids human-AI communication


    In the drawing activity, participants instinctively use conversational language
    to guide their partners. This natural, fluid communication style comes effortlessly
    in human-to-human interactions. However, when using AI tools, many people initially
    resort to terse, keyword-based prompts reminiscent of how many of us are used
    to performing a Google search. This shift in communication style can significantly
    limit the effectiveness of AI interactions.


    Modern AI systems, particularly large language models (LLMs), are designed to
    understand and respond to natural, conversational language. These models are trained
    on vast corpora of human-written text, including books, articles, and online discussions,
    which enables them to grasp nuances, context, and intent in natural language.


    The benefits of using natural language with AI systems are numerous:


    1. Improved understanding: AI models can better interpret your intent when you
    provide context and details in a conversational manner.

    2. More nuanced responses: Natural language prompts allow the AI to pick up on
    subtleties and respond with more contextually appropriate information.

    3. Reduced cognitive load: You don’t need to learn a special ‘AI language’ or
    syntax; you can interact as you would with a human colleague.


    It’s worth noting that while AI systems excel at processing natural language,
    they don’t truly “understand’ in the way humans do. They generate responses based
    on patterns in their training data. This means they can sometimes produce fluent,
    plausible-sounding text that is factually incorrect or nonsensical. These are
    known as “hallucinations” and we’ll explore this issue in the chapters ahead.


    ## Providing context enhances the relevancy of generated content


    In my AI workshops, I always begin the drawing activity by explaining its broader
    context and objectives – aiming to create a framework of understanding for what
    we’ll be doing. By providing this information, participants understand the purpose
    of the activity, their roles within it, and what they need to achieve.

