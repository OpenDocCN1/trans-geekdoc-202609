- raw: 'Moreover, we mustn’t underestimate the value of human elements like mentorship,
    debate, and interpersonal rapport which underpins scholarly work. Fingers crossed,
    students will continue to seek out the wisdom of their supervisors and extended
    academic community rather than solely relying on chatbots for advice. Thus, while
    AI promises to enhance certain academic tasks, the essence of scholarly work remains
    profoundly human.


    While AI may not be capable of replicating human academics, it is reasonable to
    expect that academics who fail to keep pace with shifting work practices will
    fall behind.


    Take, for example, two fellowship candidates where one is highly AI literate while
    the other dismisses AI tools as trendy gadgets. Putting aside other entries in
    their resumés, it seems clear which would be better placed to contribute to an
    institution that’s operating in a period where AI is increasingly entering all
    aspects of university operations. Any scholar integrating AI for efficiencies
    like automated admin, data analysis, or writing assistance will likely be at a
    competitive advantage over less tech-savvy peers because AI affords knowledge
    workers the ability to complete tasks at greater speed and efficiency.


    Amidst this environment, I encourage you to judiciously welcome AI as a collaborator
    while safeguarding the aspects of your academic role that are most important to
    you. By cultivating AI skills, academics ensure they write their future rather
    than becoming relics replaced by thinking machines or displaced by AI-augmented
    peers.


    ## Can AI write my thesis or academic paper?


    Before providing some examples of how AI can potentially assist you in your academic
    work, let’s address the elephant in the room: “Can artificial intelligence write
    your PhD thesis or academic paper from start to finish?”


    In short, “Yes it can!”


    AI systems are currently capable of generating long-form text on demand on virtually
    any topic.


    ### Jane’s PhD candidature journey


    As a fledgling PhD candidate, Jane faces immense pressure to produce written work.
    The lengthy thesis can feel like an insurmountable mountain to climb, and Jane
    spends long hours reading literature and taking notes but struggles to synthesise
    concepts and articulate her ideas. She watches as peers effortlessly produce page
    after page while she agonises over each paragraph.


    The temptation arises to let an AI system quickly generate paragraphs or even
    entire chapters that she can then polish up and submit.


    She’s heard that’s possible.


    Why not give it a go?


    Well, aside from a host of ethical quandaries associated with one-click text generation,


    The doctoral process is as much about developing critical research skills as it
    is about producing the final dissertation, noting that the two are very much an
    interwoven process. Bypassing the analytical thinking needed to synthesise concepts,
    identify gaps, and then articulate ideas through the writing process (i.e. outsourcing
    that work to AI) cheats Jane out of an enriching scholarly experience.


    Yes, the thesis document needs to be written, and many of the tasks involved in
    its creation *could* be outsourced to AI to accelerate (or replace) the process.
    However, the skills picked up along the learning journey towards producing the
    thesis are what will sustain and advance Jane’s career long term.


    If she gains an academic role post-PhD, it’s the research and writing skills honed
    during her PhD candidature that will enable her to continue to grow, not the final
    thesis itself. In other words, while submitting the thesis document is her ticket
    to entry into the academy, once inside, nearly everyone holds that ticket. Jane’s
    competitive advantage will be characterised by the skills she’s acquired in the
    process. As such, rather than viewing AI as an automated author, a more strategic
    approach would be for Jane to use AI as a collaborative assistant; a tool with
    which to amplify her abilities.


    ### Louise’s tenured academic journey


    Unlike Jane, Louise has already earned her PhD and achieved tenure as a professor
    at a prestigious university. She has a solid grasp of her field and extensive
    experience conducting original research and publishing academic papers. However,
    Louise feels immense pressure to continuously publish to maintain her position
    and progress in her career. The prospect of letting an AI system generate draft
    papers is enticing. Why should she waste time on the tedious process of writing
    literature reviews, or methods sections, when AI can quickly produce those components
    of her work?


    Louise may be well-justified in rationalising that she already knows how to conduct
    rigorous research, however, she should be wary of fully outsourcing her writing
    to AI for several reasons. Firstly, writing remains a critical part of Louise’s
    thought process and a way to clarify and deepen her ideas. By skipping the writing,
    she loses opportunities for scholarly insights. Secondly, academic writing requires
    making nuanced rhetorical choices to effectively convey complex concepts and arguments
    to readers. Advanced knowledge and critical thinking are needed to organise ideas
    logically, choose words judiciously, and adapt the tone of writing for different
    audiences. As yet, AI is hard-pressed to replicate Louise in her pursuit of those
    tasks. Thirdly, transparency and ethics demand that Louise take responsibility
    for the final published work bearing her name. While scholars may opt to turn
    to AI as a black box for churning out papers, Louise holds the scholarly process
    in high regard. Thus, while AI offers the potential for productivity gains, Louise
    is also mindful that she doesn’t wish to outsource the core of her academic work.


    Rather than using AI to generate fully written papers, a better approach may be
    for Louise to use AI as an assistive tool, used to collaborate on writing tasks,
    leaving her in control over the process, and removing any doubt that she is the
    unquestionable author of the papers she puts into the world.


    In examining the perspectives of both Jane and Louise, we see good reasons to
    pull back from the idea of fully automating academic writing with AI tools. Beyond
    the ethical responsibility needed to produce substantive scholarly work, both
    Jane and Louise would cheat themselves of enriching scholarly experiences by treating
    AI as a shortcut to publication. However, the above examples also illustrate how
    AI could be strategically incorporated as a tool to enhance, not replace, human
    skills and writing. To explore how this might be achieved, let’s leave current-day
    AI for a moment to travel back to 1984, where guidance can be found for how Jane
    and Louise might effectively build their AI skills and become AI-powered scholars.


    ## A framework for developing AI literacy


    One method for acquiring the skills needed to use AI effectively can be found
    in the “Miyagi Framework”, comprising the following tenets:


    *   break down complex skills into fundamental tasks,


    *   develop muscle memory through deliberate practice, and


    *   apply and combine the basics to execute advanced techniques.


    If you haven’t come across the Miyagi Framework before in academic research, that’s
    probably because it’s more commonly known as a popular culture touchstone. Mr
    Miyagi, from whom the framework takes its name, is a protagonist in the 1980s’
    cult classic, *The Karate Kid*, a film about Miyagi and his young pupil, Daniel.


    When Daniel faces challenges in his life, the sage Miyagi takes him under his
    wing to school him in the art of Karate.'
