    \n# 10 Writing & editing with AI\n\nDOI: [10.4324/9781032665276-10](https://doi.org/10.4324/9781032665276-10)\n\
    \n## Introduction\n\nFor many academic writers, me included, there are few tasks\
    \ more daunting than creating a new document on your computer and knowing that\
    \ it needs to be filled with words. That blinking cursor, ostensibly patient,\
    \ waiting for brilliance to flow from fingertips to keyboard, can feel less like\
    \ an invitation and more like an accusation.\n\n“Well?” it seems to taunt, “Aren’t\
    \ you supposed to be writing something brilliant?”\n\nFortunately, there’s a strategy\
    \ to break this stalemate: getting some words – any words – on the page. I know\
    \ that’s precisely the hurdle you’re trying to overcome, but bear with me as I\
    \ share how we can call upon AI chatbots to lend a hand (or more accurately, a\
    \ helping algorithm).\n\nNow, I anticipate some readers thinking, “Isn’t using\
    \ AI for academic writing cheating?” It’s a valid concern, one hotly debated since\
    \ ChatGPT’s public launch.\n\nLet’s begin by introducing a technique I call “blah\
    \ writing”’.\n\n## Getting your thoughts on the page\n\nAs academic writers, we\
    \ can find ourselves trapped in a paradox of perfectionism. Our minds are alive\
    \ with ideas, theories, and half-formed arguments, yet the pressure to articulate\
    \ these thoughts eloquently can leave us paralysed before a blank page. This is\
    \ where the concept of “Blah writing” comes in.\n\nThe term “blah” is often used\
    \ colloquially in English to represent meaningless or nonsensical talk. You might\
    \ hear someone say “blah blah blah” to mimic the sound of ongoing, unimportant\
    \ chatter. Here, I’ve chosen to reclaim the term for productive purposes, adopting\
    \ it to title a strategic approach to getting your thoughts out of your head and\
    \ onto the page.\n\nBlah writing is essentially a digital version of stream of\
    \ consciousness journaling.\n\nThis approach can be particularly helpful for anyone\
    \ who feels intimidated by the pressure to produce “perfect” writing from the\
    \ outset. Blah writing gives you permission to be messy, imperfect, and exploratory.\n\
    \nThe following is an example workflow for achieving blah writing alongside an\
    \ AI chatbot:\n\n1.  Set the stage: Begin by assigning your AI chatbot a role,\
    \ as you learnt about in [Chapter 4](#C_008_c4.xhtml). You might cast it as a\
    \ patient, non-judgemental writing coach or a knowledgeable colleague in your\
    \ field. This helps create a supportive environment for your unfiltered thoughts.\n\
    \n2.  Brain dump: Start typing whatever comes to mind about your topic, stream\
    \ of consciousness style. Don’t worry about grammar, structure, or even coherence\
    \ at this stage. The aim is to get your thoughts out of your head and onto the\
    \ screen. Let your ideas flow freely, no matter how disjointed or rambling they\
    \ may seem.\n\n3.  Seek synthesis: Once you’ve externalised your thoughts, use\
    \ your prompt-writing skills from [Chapter 6](#C_010_c6.xhtml) to ask the AI to\
    \ help synthesise your ideas. Request it to clarify your thoughts and translate\
    \ the mess you’ve dumped into it into a coherent narrative.\n\n4.  Reflect and\
    \ iterate: Review the AI’s suggestions critically. Use them as a catalyst for\
    \ your own critical thinking and further writing. Consider whether the synthesis\
    \ accurately reflects your thoughts, if important points were overlooked, and\
    \ how you might expand on these themes.\n\nAn example of how this might play out\
    \ in practice is as follows:\n\n1.  Set the stage: “Please act as a supportive\
    \ writing coach specialising in educational technology. I need help organising\
    \ my thoughts on AI implementation in higher education”.\n\n2.  Brain dump: “What\
    \ am I doing writing stresses me trying this brain dump of thoughts thesis needs\
    \ to get written so here goes. Want to talk about adaptive learning AI systems\
    \ in universities great potential to personalise the student experience by tracking\
    \ progress and suggesting resources tailored to individual needs but there are\
    \ huge implementation challenges to consider especially around data privacy and\
    \ ethical issues like bias in algorithms that could unintentionally disadvantage\
    \ certain groups we need to think carefully about how lecturers fit into this\
    \ new paradigm as they might become more like facilitators guiding students through\
    \ AI-enhanced learning journeys which sounds interesting but could be threatening\
    \ to some staff members who’ll need training and upskilling in AI literacy and\
    \ effective integration of these systems into the curriculum it’s not just a plug\
    \ and play solution and might require redesigning entire courses which is exciting\
    \ but daunting and time-consuming with significant resource implications to consider\
    \ but the potential benefits are substantial like students getting immediate feedback\
    \ 24/7 which could increase engagement and improve retention rates by helping\
    \ identify struggling students earlier for timely interventions though we need\
    \ to balance this with ethical considerations about how much monitoring is too\
    \ much and ensure accessibility for students with disabilities it’s a complex\
    \ topic with lots to consider but definitely worth exploring further as it could\
    \ revolutionise higher education”.\n\n3.  Seek synthesis: “Can you please rephrase\
    \ this jumbled paragraph into a more coherent narrative? I’m trying to articulate\
    \ my thoughts on adaptive learning AI systems in higher education more clearly”.\n\
    \n    AI-generated response:\n\n    Adaptive learning AI systems offer significant\
    \ potential for personalising the student experience in higher education. These\
    \ systems can track individual progress and suggest tailored resources, potentially\
    \ leading to increased engagement, improved retention rates, and earlier identification\
    \ of struggling students for timely interventions.\n\n    However, the implementation\
    \ of such systems presents considerable challenges. Primary concerns include data\
    \ privacy and ethical issues, particularly the risk of algorithmic bias that could\
    \ inadvertently disadvantage certain student groups."
