    \ C., Winter, C., … Amodei, D. (2020). 语言模型是少样本学习者。 *arXiv (康奈尔大学)*, 1–75. [`doi.org/10.48550/arxiv.2005.14165`](https://doi.org/10.48550/arxiv.2005.14165)\n\
