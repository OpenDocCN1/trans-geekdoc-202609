- raw: ": The consistency of an AI system’s actions and decisions with human values\
    \ and intentions. This involves designing AI models that understand and adhere\
    \ to ethical guidelines, societal norms, and the specific objectives set by their\
    \ human developers or users. Alignment is a critical concern in AI safety and\
    \ ethics, particularly as AI systems become more capable. \n\n**Anthropic**\n\n\
    : An artificial intelligence research and safety company founded by former employees\
    \ of OpenAI (the company behind ChatGPT). Anthropic focuses on developing large-scale\
    \ AI models while emphasising AI safety and ethical considerations. Their popularly\
    \ used chatbot, Claude, is available at [www.claude.ai](http://www.claude.ai).\
    \ \n\n**API (Application Programming Interface)**\n\n: A set of protocols, routines,\
    \ and tools for building software applications. In the context of AI, APIs allow\
    \ developers to integrate AI capabilities into their applications or access AI\
    \ services provided by companies like OpenAI or Google. \n\n**Artificial intelligence**\n\
    \n: A branch of computer science focused on creating systems that can perform\
    \ tasks which typically require human intelligence. These tasks include learning,\
    \ reasoning, problem-solving, perception, language understanding, and creativity.\
    \ AI systems range from simple programs that solve specific problems to complex\
    \ learning systems that adapt and operate autonomously. \n\n**Attention mechanism**\n\
    \n: A key component in many modern AI models, particularly in natural language\
    \ processing. It allows the model to focus on specific parts of the input data\
    \ when producing an output, mimicking human attention and greatly improving the\
    \ performance of tasks like translation and text summarisation. \n\n**Augmentation**\n\
    \n: The enhancement of human capabilities or experiences through the use of technology,\
    \ particularly artificial intelligence and other digital tools. In academic contexts,\
    \ augmentation can refer to the use of AI to support and enhance research, writing,\
    \ and analytical processes. \n\n**Automation/Automated**\n\n: The technology-enabled\
    \ process of making systems or processes function automatically, without human\
    \ intervention. In academia, automation can streamline repetitive tasks, allowing\
    \ researchers to focus on other aspects of their work. \n\n**Autonomous systems**\n\
    \n: AI systems capable of operating and making decisions without direct human\
    \ control. These systems use ML algorithms to adapt to new situations and improve\
    \ their performance over time. \n\n## B\n\n**Bias**\n\n: Systematic errors or\
    \ unfairness in data, algorithms, or interpretation of results. It can manifest\
    \ in various forms, including data bias, algorithmic bias, and interpretation\
    \ bias. Addressing bias in AI is critical to ensure fairness, accuracy, and ethical\
    \ use of technology in academic research. This involves careful data selection,\
    \ algorithm design, and ongoing monitoring to identify and mitigate potential\
    \ biases that could skew research outcomes or perpetuate societal inequalities.\
    \ \n\n**Big Data**\n\n: Extremely large datasets that may be analysed to reveal\
    \ patterns, trends, and associations, especially relating to human behaviour and\
    \ interactions. In academia, Big Data offers unprecedented opportunities for research\
    \ but also presents challenges in terms of storage, analysis, and ethical considerations.\
    \ \n\n**Black Box AI**\n\n: AI systems whose decision-making processes are not\
    \ transparent or easily interpretable by humans. This lack of explainability can\
    \ be problematic in academic research, where understanding the reasoning behind\
    \ conclusions is crucial. \n\n**Bodies of knowledge**\n\n: In the context of AI\
    \ and academic research, this term refers to the vast collections of information,\
    \ theories, and data. It’s essentially the AI’s “textbook” – a comprehensive repository\
    \ of information it can draw upon to generate responses or perform tasks. \n\n\
    **Bot**\n\n: Short for “robot”, a bot is a software application that runs automated\
    \ tasks over the internet. Bots can be used for tasks like literature searches,\
    \ data collection, or even as research assistants. \n\n## C\n\n**Chatbot**\n\n\
    : A software application designed to simulate conversation with human users, especially\
    \ over the internet. It uses natural language processing (NLP) and artificial\
    \ intelligence to understand user queries and generate responses. Chatbots can\
    \ range from simple, rule-based systems that respond to specific keywords or phrases,\
    \ to more advanced AI-driven bots capable of learning and adapting to user interactions\
