- raw: 'Interestingly, despite the dramatic transformation of AI itself (imagine a
    caterpillar metamorphosing into a butterfly, but with more silicon involved),
    the basic prompting approach – the two-way communication between humans and machines
    – remains surprisingly recognisable. At least from a user’s perspective. It’s
    as if we’ve been engaged in the same game of conversational tennis for decades,
    and this continuity in approach persists despite the vast improvements in AI’s
    capabilities and sophistication.


    In the early stages of development, chatbots were about as flexible as a brick
    wall, relying on simple scripted responses. You would input a query, and they
    would promptly generate a pre-programmed reply with mechanical efficiency. Now,
    however, modern natural language processing allows for flexible, contextual conversations
    that can occasionally leave one pondering whether they’re engaging with a machine
    or a particularly eloquent human interlocutor.


    In essence, conversational AI can be thought of like the Swiss Army knife of the
    digital world – it’s a multi-faceted tool designed to engage in meaningful and
    natural dialogues with humans.


    But what makes these conversational AI systems tick? Let’s break it down:


    *   Natural language processing: This is the AI’s ability to “understand” our
    text or spoken words. It’s like giving the AI a universal translator for human
    communication.


    *   Contextual awareness: This allows the AI to follow the flow of a conversation,
    much like how you keep track of what your friend is talking about over coffee
    (assuming you’re not staring at your phone!).


    *   Generative skills: This is the AI’s ability to craft relevant, personalised,
    and coherent responses. It’s not just parroting information but synthesising it
    into something new and appropriate.


    *   Interactive interfaces: These are the digital platforms where you engage with
    the AI, typically through a chat window or text box on a screen. They’re designed
    to mimic the back-and-forth nature of human conversation, allowing you to type
    your messages and receive the AI’s responses in real-time. The goal is to make
    the interaction feel as natural and intuitive as conversing with a friend, despite
    the fact that you’re communicating with a machine.


    Remember how we touched on the idea of AI prediction machines in the last chapter?
    Conversational AI uses this ability to sift through massive amounts of human dialogue
    data, learning patterns, and nuances. It’s like the AI is eavesdropping on millions
    of conversations to learn how we communicate. This statistical learning is what
    allows the AI to handle nuanced language, adapt to context, and even improve its
    conversational skills over time.


    While early conversational AIs were text-only (kind of like having a pen pal),
    we’ve now entered the era of multi-modal AI.


    In this book, though, we’ll be focusing on text-based conversations. Why? Because
    mastering text interactions with AI chatbots is like learning to walk before you
    run – it’s a fundamental skill that will serve you well in your journey to becoming
    an AI-savvy scholar.


    A timeline of AI advancements is offered below. If you’d rather skip the mini
    history lesson and jump straight into learning how to have effective conversations
    with AI through text-based prompts, feel free to skip ahead to the next chapter.


    ## Tracing the evolution of conversational AI


    The development of conversational AI represents a remarkable journey in computer
    science, the efforts of passionate and talented researchers, and a continuous
    pursuit to challenge our understanding of language, intelligence, and human-machine
    interaction. This evolution, spanning many decades, illustrates both the persistent
    vision of researchers and the exponential growth of technological capabilities
    that allowed their visions to be realised. Let’s explore some key developments
    that shaped the journey.


    ### The 1960s: ELIZA and the birth of conversational AI


    In the 1960s, MIT computer scientist Joseph Weizenbaum shared his pioneering work
    on conversational AI with ELIZA,


    ELIZA simulated a psychotherapy session, engaging users with prompts such as “How
    do you feel today?” and “Tell me more about your family”. The program operated
    on a simple pattern-matching algorithm, identifying keywords in the user’s input
    and responding with pre-programmed phrases. While this could be considered simplistic
    by today’s AI standards, ELIZA represents a key milestone in AI development as
    it demonstrated how even constrained conversation could create an illusion of
    understanding and empathy.


    Many users attributed human-like qualities to the program, some even reporting
    emotional connections. This phenomenon, later termed the “ELIZA effect”, highlighted
    humans’ tendency to anthropomorphise technology – that is, to attribute human
    characteristics, behaviours, or emotions to non-human entities or objects. In
    the case of ELIZA, users might ascribe human-like understanding and empathy to
    a computer program that was, in reality, simply following pre-programmed rules
    without any genuine comprehension or emotional capacity. This tendency to anthropomorphise
    reflects our innate inclination to perceive human-like traits in our interactions,
    even when dealing with what are clearly artificial systems.


    Despite its ostensible success, Weizenbaum cautioned against overestimating ELIZA’s
    cognitive abilities. He became increasingly concerned about the ethical implications
    of AI, warning against the potential dehumanisation that could result from over-reliance
    on computer interactions.


    ### The 1970s and 1980s: SHRDLU and the quest for understanding


    The 1970s and 1980s witnessed incremental advancements towards more versatile
    interaction. A significant contribution came from Terry Winograd, who created
    SHRDLU, a program that engaged users in basic discussions about a virtual world
    of blocks, showcasing improved context awareness and the ability to reference
    objects across multiple sentences.


    SHRDLU operated in a limited domain – a simulated block world – but within this
    context, it could understand and execute complex commands. For example, it could
    respond to instructions like “Pick up the red block that is on the blue block”
    by correctly interpreting the relationships between objects. This ability demonstrated
    a level of language comprehension that went beyond simple pattern matching and
    was part of a broader research trend exploring natural language understanding
    through microworlds – limited domains where the complexities of real-world language
    could be controlled and studied.


    While these approaches showed promise within their constrained environments, they
    struggled to scale to more general language-understanding tasks.


    ### The 1980s: the rise of expert systems


    A significant leap occurred with the advent of expert systems in the 1980s. You
    can think of an expert system as a type of artificial intelligence program designed
    to replicate the decision-making ability of a human expert in a specific field.


    One famous expert system was MYCIN, developed at Stanford University in the early
    1970s and refined throughout the 1980s. It was designed to identify bacteria causing
    severe infections, wherein MYCIN could engage clinicians in professional medical
    discussions, asking relevant questions about symptoms and test results before
    providing diagnostic recommendations.'
