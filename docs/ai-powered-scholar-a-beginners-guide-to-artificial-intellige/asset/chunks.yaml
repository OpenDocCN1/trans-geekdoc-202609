    over time.


    In AI interactions, this shared history is paralleled by what’s known as a ‘context
    window’. A context window represents the AI’s capacity to retain and reference
    information from earlier in the conversation. However, unlike human memory, an
    AI’s context window is typically limited, and, depending on the AI tool you’re
    using, may be contained to a single chat session. The exact size of this context
    window will vary depending on the specific AI model you’re interacting with.


    ## Key takeaways

    The key takeaways from the ‘Lost in Translation’ activity can be broadly summarised
    with the following key points:

    * When communicating with AI through text prompts be unambiguous.

    * Use natural language/be conversational.

    * Provide contextual framing.

    * Offer representative examples.

    * Break down larger instructions into single-focused tasks.

    * Specify perspective.

    * Build a shared history.


    With practice, you’ll learn to convey your intents clearly and minimise the chances
    of getting lost in translation.


