    \ [`www.ibm.com/blog/nlp-vs-nlu-vs-nlg-the-differences-between-three-natural-language-processing-concepts/`](https://www.ibm.com/blog/nlp-vs-nlu-vs-nlg-the-differences-between-three-natural-language-processing-concepts/)\n\
    \n# 6 提示 AI 以实现有效沟通\n\nDOI: [10.4324/9781032665276-6](https://doi.org/10.4324/9781032665276-6)\n\
    \n## 引言\n\n基于你在 第 4 章 通过角色分配优化 AI 交互所获得的技能，本章重点关注提示写作的艺术——在你的学术任务中利用 AI 聊天机器人的关键技能。\n\
    \n在本书的语境中，提示写作指的是为 ChatGPT 等 AI 工具创建基于文本的输入。这些输入指导 AI 理解并执行所需任务，提供塑造输出的具体指令和必要的上下文。学习撰写提示很重要，因为该技能充当了你的需求与\
    \ AI 生成内容质量之间的翻译机制。\n\n尽管 AI 理解我们指令的能力迅速提升，但有效地与 AI 沟通很可能仍将是那些寻求最大化其潜力的人的关键差异因素。正如著名\
    \ AI 爱好者 Ethan Mollick 教授所建议的，我们应将当前 AI 工具视为我们将永远使用的能力最弱的版本。\n\n即使 AI 发展到更直观地预见我们的需求，也可以预期，通过基于提示的交互进行清晰沟通的艺术仍将作为关键能力持续存在。撰写精确、富含上下文的提示的能力将仍然是宝贵的资产，尤其是在细微差别至关重要的学术研究环境中。\n\
    \n本章将指导你通过策略引导 AI 系统产生与你的研究目标一致的相关、有帮助的结果。你将深入了解有效提示的组成部分，探索各种技巧，并参与实践练习来磨练你的技能。\n\
    \n让我们从审视有效提示的关键组成部分开始，为掌握 AI 辅助学术工作中的这一基本技能奠定基础。\n\n## 有效提示的组成部分\n\n基于对数千个提示及其对应\
    \ AI 输出的分析，研究人员已确定在高质量、有效的提示中始终存在的几个组成部分。\n\n1. Instructions: 清晰的指令告知 AI 你期望的回应。与其让行动开放式进行，不如使用精确动词如“总结”、“解释”或“分析”来指定任务。\n\
    2. Context: 提供背景上下文有助于聚焦 AI 的回应并减少歧义。通过上下文，你可以建立主题框架、视角或任何细节来锚定 AI 的理解。\n3. Examples:\
    \ 说明性示例为 AI 提供了具体的人工制品作为其回应的模型，从而提高连贯性和一致性。分享代表你期望输出风格和详细程度的示例文本。\n4. Constraints:\
    \ 添加约束和要求可防止 AI 偏离轨道。你可以指定字数，\n5. Humanisation: 对话式语言和友好的语气可以帮助建立共同基础并带来更自然的回应。用通俗的语言表达，而不是使用简短、技术性的提示。\n\
    6. Sentiment: 表明你的情感倾向，如热情或沮丧，可进一步为交互风格和内容提供上下文。\n7. Association: 引用之前的交互可建立关联，提供连续性和伪记忆以提高一致性。\n\
    \n让我们通过一些示例提示进一步探讨每个提示组件，这些提示与学术研究任务相关。\n\n* “总结这篇关于睡眠在记忆巩固中作用的研究论文，写成简洁的 250\
    \ 字摘要”。\n  * 此提示以精确的行动动词开头，明确指定了期望的输出类型和格式。论文提供了必要的上下文。\n* “作为为新博士生提供反馈的写作导师，请审阅附带的文献综述引言草稿，并指出句子结构、流畅度和过渡语言方面的改进之处”。\n\
    \  * 该提示建立了上下文角色、视角和目的，以指导审阅。\n* “生成一份论文研究提案，采用 APA 格式，与提供的关于教育技术和野生动物保护的示例提案相似”。\n\
    \  * 示例提案为 AI 提供了代表性的人工制品作为其输出的模式。\n* “撰写一篇 1,000 字的文献综述引言，主题为 AI 在医疗保健中的使用，重点关注诊断应用，且不包括机器人手术”。\n\
    \  * 字数、 inclusion/exclusion 标准和其他边界施加了有益的创造性约束。\n* “你好，能否请你用简单、通俗易懂的日常语言改写这篇关于人类动机心理学的学术论文？非常感谢！”\n\
    \  * 随意、对话式的语言鼓励自然的回应，其中蕴含着人性化。\n"
