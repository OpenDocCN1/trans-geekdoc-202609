    \ academic writing and research. Each group needs to create a proposal for these\
    \ guidelines.\n\n4.  Role-play discussion (30 minutes):\n\n    *   Each participant\
    \ should advocate from their assigned perspective.\n\n    *   Consider how AI\
    \ might be integrated into different aspects of academic work (e.g. literature\
    \ review, data analysis, writing, peer review).\n\n    *   Discuss potential benefits\
    \ and risks.\n\n    *   Address how academic integrity could be maintained while\
    \ benefiting from AI tools.\n\n5.  Develop guidelines (15 minutes):\n\n    * \
    \  Based on your discussion, create a short list of 5–7 guidelines for AI use\
    \ in academic work.\n\n6.  Share and compare (15 minutes):\n\n    *   Each group\
    \ presents their guidelines to the larger class.\n\n    *   Discuss similarities\
    \ and differences between group proposals.\n\n7.  Reflection (10 minutes):\n\n\
    \    *   Individually, write a brief reflection on how this activity has influenced\
    \ your perspective on AI in academia.\n\n    *   Consider how you might apply\
    \ these insights, or adopt the developed guidelines, in your academic research\
    \ or teaching roles.\n\n## Notes\n\n1.  [A chatbot](#C_006_c2.xhtml#n02_1b) is\
