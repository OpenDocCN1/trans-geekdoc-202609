    \n# 6 Prompting AI for effective communication\n\nDOI: [10.4324/9781032665276-6](https://doi.org/10.4324/9781032665276-6)\n\
    \n## Introduction\n\nBuilding upon the skills you acquired for optimising AI interactions\
    \ through persona assignment in [Chapter 4](#C_008_c4.xhtml), this chapter focuses\
    \ on the art of prompt writing – a critical skill for leveraging AI chatbots in\
    \ your academic tasks.\n\nIn the context of this book, prompt writing refers to\
    \ creating text-based inputs for AI tools like ChatGPT. These inputs guide the\
    \ AI in understanding and executing desired tasks, providing both specific instructions\
    \ and essential context that shapes the output. Learning to craft prompts is important\
    \ because the skill serves as a translation mechanism between your needs and the\
    \ quality of AI-generated content.\n\nDespite rapid advancements in AI’s ability\
    \ to interpret our instructions, effectively communicating with AI will likely\
    \ remain a key differentiator for those seeking to maximise its potential. As\
    \ Professor Ethan Mollick, a prominent AI enthusiast, advises, we should consider\
    \ current AI tools as the least capable versions we’ll ever use.\n\nEven as AI\
    \ evolves to more intuitively anticipate our needs, it could be expected that\
    \ the art of clear communication through prompt-based interactions will persist\
    \ as a critical competency. The ability to craft precise, context-rich prompts\
    \ will remain an invaluable asset, particularly in academic research contexts\
    \ where nuance is paramount.\n\nThis chapter will guide you through strategies\
    \ to direct AI systems towards producing relevant, helpful results aligned with\
    \ your research goals. You’ll gain insights into the components of effective prompts,\
    \ explore various techniques, and engage in practical exercises to hone your skills.\n\
    \nLet’s begin by examining the key components of effective prompts, laying the\
    \ foundation for mastering this essential skill in AI-assisted academic work.\n\
    \n## Components of effective prompts\n\nBased on analysis of thousands of prompts\
    \ and their corresponding AI outputs, researchers have identified several components\
    \ consistently present in high-quality, effective prompts.\n\n1.  Instructions:\
    \ Clear instructions inform the AI what response you are expecting. Rather than\
    \ leaving actions open-ended, use precise verbs like “summarise”, “explain”, or\
    \ “analyse” to specify the task.\n\n2.  Context: Providing background context\
    \ helps focus the AI’s response and reduces ambiguity. Through context, you can\
    \ establish topic framing, perspective, or any details to anchor the AI’s understanding.\n\
    \n3.  Examples: Illustrative examples give the AI concrete artefacts to model\
    \ its response after, improving coherence and alignment. Share sample text representing\
    \ your desired output style and level of detail.\n\n4.  Constraints: Adding constraints\
    \ and requirements prevents the AI from straying off-course. You might specify\
    \ word count,\n\n5.  Humanisation: Conversational language and a friendly tone\
    \ can help establish common ground and lead to more natural responses. Speak plainly\
    \ rather than using terse, technical prompts.\n\n6.  Sentiment: Indicating your\
    \ emotional sentiment, like enthusiasm or frustration, further contextualises\
    \ your expectations for the interaction style and substance.\n\n7.  Association:\
    \ Referencing previous interactions builds association, providing continuity and\
    \ pseudo-memory to improve consistency.\n\nLet’s explore each prompt component\
    \ further with some example prompts, contextualised to academic research tasks.\n\
    \n*   “Summarise this research paper on the role of sleep in memory consolidation\
    \ in a concise 250-word abstract”.\n\n    *   This prompt leads with a precise\
    \ action verb, clearly specifying the expected output type and format. The paper\
    \ provides the necessary context.\n\n*   “As a writing mentor providing feedback\
    \ to a new PhD student, please review the attached draft literature review introduction\
    \ and highlight areas for improvement in sentence structure, flow, and transition\
    \ language”.\n\n    *   The prompt establishes the contextual role, perspective,\
    \ and purpose to guide the review.\n\n*   “Generate a thesis research proposal\
    \ in APA format similar to the provided sample proposals on educational technology\
    \ and wildlife conservation”.\n\n    *   The sample proposals give the AI representative\
    \ artefacts to pattern its output after.\n\n*   “Write a 1,000-word literature\
    \ review introduction on the use of AI in healthcare that focuses on diagnostic\
    \ applications and does not include robotic surgery”.\n\n    *   Word count, inclusion/exclusion\
    \ criteria, and other boundaries impose helpful creative constraints.\n\n*   “Hello,\
    \ could you please paraphrase this academic paper on the psychology of human motivation\
    \ in simple, everyday language that’s easy to understand? Thanks so much!”\n\n\
    \    *   The casual, conversational language encourages natural responses, with\
    \ the undercurrent of humanisation."
