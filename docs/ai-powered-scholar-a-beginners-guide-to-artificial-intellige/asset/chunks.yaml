- raw: 'Context-setting can be equally important when interacting with AI systems.
    Unlike humans, who can draw upon shared cultural knowledge or intuitive understanding,
    AI models heavily rely on the information we provide them to understand what they
    should do for us.


    By providing context, you’re effectively “priming” the AI model. This allows the
    model to filter its vast knowledge base and focus on generating content that’s
    most relevant to your specific needs. It’s akin to giving a human collaborator
    a detailed brief before starting a project.


    Moreover, context-setting can help mitigate some of the inherent limitations of
    AI models:


    *   It reduces the likelihood of the AI generating irrelevant or off-topic content.


    *   It helps maintain consistency across multiple interactions or generated outputs.


    *   It can guide the AI towards using appropriate terminology or jargon for your
    field.


    *   It allows you to indirectly influence the ethical stance or perspective of
    the generated content.


    Remember, the quality of the context you provide directly influences the quality
    of the AI’s output. Be as clear and specific as possible, but also be prepared
    to refine your context-setting approach through trial and error.


    ### Building a shared history enhances long-term communication


    Lastly, when participants switch roles between describer and drawer, communication
    typically improves. This improvement stems from the shared experience and mutual
    understanding developed during the first round, creating a foundation of common
    reference points and expectations.


    This concept of building a shared history is crucial in enhancing long-term communication,
    both in human interactions and when working with AI systems.


    In human communication, this shared history forms naturally through repeated interactions,
    creating a rich context that allows for more nuanced and efficient communication
    over time.


    In AI interactions, this shared history is paralleled by what’s known as a ‘context
    window’. A context window represents the AI’s capacity to retain and reference
    information from earlier in the conversation. However, unlike human memory, an
    AI’s context window is typically limited, and, depending on the AI tool you’re
    using, may be contained to a single chat session. The exact size of this context
    window will vary depending on the specific AI model you’re interacting with.


    ### Key takeaways


    The key takeaways from the ‘Lost in Translation’ activity can be broadly summarised
    with the following key points:


    *   When communicating with AI through text prompts be unambiguous.


    *   Use natural language/be conversational.


    *   Provide contextual framing.


    *   Offer representative examples.


    *   Break down larger instructions into single-focused tasks.


    *   Specify perspective.


    *   Build a shared history.


    With practice, you’ll learn to convey your intents clearly and minimise the chances
    of getting lost in translation.


