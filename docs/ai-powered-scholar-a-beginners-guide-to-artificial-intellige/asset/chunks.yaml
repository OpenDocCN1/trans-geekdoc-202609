    : The language that humans naturally speak or write, as opposed to artificial
    or computer languages. In the context of AI, natural language refers to the ability
    of AI systems to understand and generate human language in a way that feels natural
    and intuitive.


    `Natural language processing (NLP)`: A branch of AI that focuses on the interaction
    between computers and human language. NLP enables AI systems to understand, interpret,
    and generate human language. NLP powers many writing assistance tools, chatbots,
    and research aids.


    `Neural network`: A computing system inspired by the biological neural networks
    in human brains. Neural networks are the foundation of many modern AI systems,
    including those used in academic tools for data analysis, language processing,
    and pattern recognition.


    ## O


    `OpenAI`: A research organisation focused on developing AI, perhaps best known
    for creating ChatGPT – putting the higher education system into a spin, largely
    due to concerns that students would use it in ways that compromised academic integrity.


    `Optical Character Recognition (OCR)`: AI-powered technology that converts different
    types of documents, such as scanned paper documents, PDFs, or images, into editable
    and searchable data.


    ## P


    `Persona`: A set of characteristics and behaviours assigned to an AI system to
    give it a distinct personality or role. Academics might use different AI personas
    for various tasks, such as a “research assistant” persona for literature reviews
    or a “writing coach” persona for manuscript editing.


    `Program`: A set of instructions that tell a computer how to perform a specific
    task.


    `Prompt`: An input or instruction is given to an AI system to elicit a specific
    response or action.


    `Prompt engineering`: The practice of designing and refining inputs to AI systems
    to achieve desired outputs. This skill is increasingly important for academics
    using AI tools, as it can significantly impact the quality and relevance of AI-generated
    content.


    `Plagiarism detection tools`: Tools that compare text against a large database
    of sources to identify potential instances of plagiarism. Please question the
    reliability and validity of their outputs before putting your trust in them!


    ## R


    `Reinforcement learning`: A type of ML where an AI agent learns to make decisions
    by taking actions in an environment to maximise a reward.


    `Robustness`: The ability of an AI system to maintain its performance under various
    conditions or when faced with unexpected inputs. For academics, considering the
    robustness of AI tools is important when relying on them for critical research
    tasks.


    ## S


    `Semantic (search)`: A search method that attempts to understand the intent and
    contextual meaning of search queries, rather than just matching keywords.


    `Sentiment analysis`: AI techniques used to determine the emotional tone behind
    words. This can be useful in analysing large text datasets.


    `Singularity`: A hypothetical future point at which artificial intelligence surpasses
    human intelligence.


    `Strong AI`: Also known as “artificial general intelligence” (AGI), strong AI
    refers to hypothetical AI systems capable of human-like general intelligence,
    having the ability to understand, learn, and apply intelligence across a wide
    range of domains. It’s a concept that remains largely theoretical and is a subject
    of ongoing research and debate.


    `Supervised Learning`: A type of ML where the algorithm is trained on a labelled
    dataset.


    `Systems (AI Systems)`: Integrated sets of AI technologies designed to perform
    complex tasks or solve specific problems.


    ## T


    `Training data`: The dataset used to teach an AI model how to perform its task.
    Understanding the nature of training data can help academics critically evaluate
    the potential biases or limitations of AI tools.


    `Turing Test`: A test of a machine’s ability to exhibit intelligent behaviour
    equivalent to, or indistinguishable from, that of a human.


    ## U


    `Unsupervised Learning`: A type of ML where the algorithm tries to find patterns
    in unlabelled data. This concept is relevant for academics working with exploratory
    data analysis or trying to discover hidden patterns in large datasets.


    ## V


    `Vectorisation`: The process of converting text into numerical vectors that can
    be processed by ML algorithms. This underlies many AI-based text analysis tools
    used in academic research.


    ## W


    `Word embedding`: A technique in NLP where words or phrases are mapped to vectors
    of real numbers. This underlies many advanced text analysis tools used in academic
    research.


    ## X


    `XAI (Explainable AI)`: AI systems designed to be interpretable and understandable
    by humans.


    ## Z


    `Zero-shot learning`: The ability of an AI model to solve tasks it wasn’t explicitly
    trained on.

