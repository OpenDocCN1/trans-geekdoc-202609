    \ of academia and AI.\n\nBoth have heard that AI tools could help them streamline\
    \ their writing and research, but where to start? They don’t want to get left\
    \ behind. But their schedules are already packed with research, teaching, and\
    \ admin tasks. What they need is a clear, no-nonsense, accessible path to help\
    \ them understand how to use AI in a way that benefits their academic careers.\n\
    \nThis book is written for anyone who identifies with Jane or Louise.\n\nNow,\
    \ you might be thinking: “In this fast-paced AI landscape, isn’t a *book* a bit\
    \ … old school? Couldn’t Jane and Louise just Google the latest AI tools or watch\
    \ YouTube tutorials?”\n\nIt’s a fair question. But here’s the thing: while online\
    \ resources are valuable,\n\nThis book offers a very different value proposition:\
    \ a curated, structured journey that builds your AI literacy from the ground up.\
    \ Its pages present a pathway to building strong, practical foundations tailored\
    \ specifically for academics while being mindful of the ethical considerations\
    \ and responsible practices associated with scholarly work.\n\n## How to use this\
    \ book\n\nThis book is designed with beginners in mind. It offers a carefully\
    \ structured pathway to build your AI literacy and leverage powerful AI tools\
    \ to enhance your academic work. Here are some tips to make the most of it:\n\n\
    1.  Build a strong foundation: Remember the tale of the *Three Little Pigs*? Be\
    \ like the wise pig who built his house of stone. Start your AI journey on solid\
    \ ground by working through the chapters sequentially. This should ensure that\
    \ you have a robust understanding of the basics before tackling more advanced\
    \ applications.\n\n2.  Engage actively: Don’t just read – do! Complete the activities\
    \ and work through the examples provided. While it might be tempting to skip ahead\
    \ (which I’m guilty of doing when reading similar-style books), I encourage you\
    \ to resist the urge. Taking the time to build foundational skills will pay dividends\
    \ in the long run. Your future self will thank you for this investment of time\
    \ and effort.\n\n3.  Embrace experimentation: While this book offers structured\
    \ guidance, it’s not meant to be a rigid rulebook. The examples and suggested\
    \ strategies are starting points. As you grow more comfortable, try rephrasing\
    \ the provided AI commands, test different AI tools, and venture “off script”.\
    \ Those moments of experimentation can lead to exciting discoveries and deepen\
    \ your understanding of AI’s potential.\n\n4.  Expand your AI vocabulary: While\
    \ I’ve written this book assuming no prior knowledge of AI, you’ll encounter some\
    \ specialised terms along the way. Don’t let this jargon intimidate you. Whenever\
    \ you come across an unfamiliar AI term, flip to the Glossary section for a clear,\
    \ concise explanation.\n\n5.  Stay up-to-date: The field of AI is evolving at\
    \ an intimidating pace, with new tools and applications emerging almost daily.\
    \ At the time of writing, there were thousands of AI tools available.\n\n6.  Take\
    \ it step by step: Build your AI literacy skills gradually, focusing on practical\
    \ applications for your academic work. Let your immediate tasks and goals guide\
    \ your learning, rather than getting swept up in all the new AI advancement –\
    \ which can be exhausting and quickly lead to a sense of overwhelm.\n\n7.  Cultivate\
    \ curiosity: Approach this journey with an open and curious mind. The most rewarding\
    \ discoveries often come when we’re willing to explore, question, and play. Don’t\
    \ be afraid to ask “What if?” or “How else could this work?” Your curiosity will\
    \ be your greatest asset in mastering AI.\n\n8.  Reflect and apply: As you progress\
    \ through the book, take time to reflect on what you’re learning. How might these\
    \ AI tools change your research process? Your writing approach? Your data analysis?\
    \ Regularly consider how you can apply your new knowledge to your specific academic\
    \ context.\n\n9.  Connect and share: Learning is often more fun and effective\
    \ when it’s collaborative. Consider forming a study group with colleagues to discuss\
    \ the concepts in this book. Share your experiences, challenges, and successes\
    \ in applying AI to your academic work.\n\n10.  Prioritise responsible use: As\
    \ you explore the capabilities of AI, always keep responsible and ethical considerations\
    \ at the forefront of your mind. I’ll discuss these throughout the book, but it’s\
    \ crucial to continually reflect on the implications of AI and in ways that align\
    \ with your university policies and procedures.\n\nLastly, don’t forget to pause\
    \ throughout your journey to congratulate yourself.\n\nAs I write this, the majority\
    \ of academics have not consciously embedded AI in their academic workflows and\
    \ are being outpaced in AI adoption by their students.\n\n## Structure of the\
    \ book\n\nThis book offers a series of chapters designed to guide you on a learning\
    \ journey towards AI literacy in academic contexts. We begin this journey by building\
    \ foundational skills, assuming no prior knowledge of AI, with which to help you\
    \ effectively communicate with AI tools. Along the way, you’ll gain insights into\
    \ the historical trajectory of AI, understanding how we arrived at the current\
    \ state of technology. You’ll learn how to transform AI into a valuable research\
    \ partner and master the nuances of crafting textual commands that align AI outputs\
    \ with your research goals. Importantly, we’ll also explore the ethical considerations\
    \ and responsible use of AI, empowering you to mindfully integrate these tools\
    \ into your academic workflows. Once you’ve established a solid foundation, later\
    \ chapters invite you to put your skills into practice. Beyond these use cases,\
    \ you’re invited to explore additional applications of AI through the accompanying\
    \ online companion resource.\n\nHere’s what you can expect from each chapter:\n\
    \n*   *[Chapter 1](#C_005_c1.xhtml#c1): Unwrapping the gift of AI*\n\n    Your\
    \ journey began in the chapter where you find yourself now. Here, the stage was\
    \ set for becoming an AI-powered scholar. Before you reach the end, you’ll additionally\
    \ explore some ideas relating to transparency of AI use and the need for disclosure\
    \ statements. Then, it’s off to [Chapter 2](#C_006_c2.xhtml) to begin building\
    \ your AI toolkit.\n\n*   *[Chapter 2](#C_006_c2.xhtml): The AI revolution in\
    \ context*"
  fmt: "\n3. Most crucially, invest the time to develop the skills necessary to fully\
