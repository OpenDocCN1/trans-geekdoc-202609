    # 7 Towards responsible use of AI tools


    DOI: [10.4324/9781032665276-7](https://doi.org/10.4324/9781032665276-7)


    ## Introduction


    At their core, today’s AI models are designed to identify patterns and make predictions
    based on vast datasets. However, as we learnt earlier, these models do not truly
    comprehend the information they process or generate. As a result, AI systems can
    sometimes “hallucinate”, which refers to their tendency to produce content that
    appears authoritative and compelling but may contain inaccuracies, fabricated
    sources, logical inconsistencies, or even nonsensical information. In short: AI
    models make stuff up!


    Furthermore, AI models can perpetuate and amplify biases present in their training
    data, leading to unfair prejudice against certain groups or individuals. The use
    of AI tools also poses risks to data privacy and may lead to reputational damage
    if researchers engage with the technology without a clear understanding of its
    limitations.


    In this chapter, we’ll explore key risks of AI, including hallucinations and biases,
    and touch on data privacy concerns, in the context of academic writing and research.
    Practical examples are offered to illustrate these issues and provide guidance
    on how to identify and mitigate them. The goal of this chapter is not to discourage
    your use of AI for research but rather to promote its responsible and critical
    application as a powerful tool that can enhance and accelerate your scholarship
    while upholding the principles of accuracy, fairness, and privacy.


    Let’s begin by examining one of the most well-known limitations of AI models:
    hallucinations.


    ## Hallucinations


    Hallucinations occur when AI models generate plausible sounding but incorrect
    or nonsensical text – an issue that’s particularly troubling in academic contexts,
    where accuracy is crucial.


    As discussed in earlier chapters, AI models function essentially as sophisticated
    prediction machines. They produce text based on patterns learned from vast datasets,
    lacking human-level comprehension of the content they generate. In essence, these
    models predict the next word in a sequence based on statistical likelihood rather
    than factual accuracy or contextual understanding. It’s worth noting that these
    AI systems are not trying to “trick us”. They are simply attempting to be useful
    by providing responses that seem appropriate based on their training data and
    algorithms. Ironically, this very attempt at usefulness is incredibly *not* useful
    to us when we’re using AI to conduct academic work.


    This propensity for hallucination can lead to significant issues for academics
    who are unaware of or underestimate its impact. The following scenarios illustrate
    just a few ways in which a lack of understanding about AI hallucinations can potentially
    land academics in hot water.


    ### Scenario 1: Fabricated citations


    Dr. Smith, an early-career researcher, uses an AI tool to help draft a literature
    review for a paper on climate change. The AI generates several paragraphs discussing
    various studies and includes detailed citations:


    *   Problem: Upon submission, peer reviewers discover that several of the citations
    are fabricated. These references do not exist in the academic databases, and the
    studies mentioned are entirely fictional.


    *   Consequences: Dr. Smith faces accusations of academic dishonesty. The credibility
    of the paper is severely damaged, leading to its rejection. Additionally, Dr.
    Smith’s reputation is tarnished, making future collaborations and publications
    challenging.


    ### Scenario 2: Incorrect historical facts


    Ashley, a PhD student, is writing their thesis on the history of European politics.
    She uses an AI tool to generate a section on the French Revolution. The AI produces
    a well-written narrative with specific dates and events. All the content sounds
    compelling:


    *   Problem: Ashley does not thoroughly fact-check the AI’s output and includes
    it in her thesis. Her advisor points out several glaring historical inaccuracies,
    such as incorrect dates for major events and misattributed quotes.


    *   Consequences: Her thesis requires extensive revision delaying her graduation.
    The incident also raises questions about her attention to detail and commitment
    to academic rigour, thus potentially damaging the faith her supervisor has in
    her and the likelihood she’ll be recommended for future academic positions.


    ### Scenario 3: Misleading information


    Josh is preparing a grant proposal for a new study. To speed up the process, he
    uses an AI tool to draft sections on the current state of research and the proposed
    methodology. The AI includes specific statistics and references to recent studies:


    *   Problem: Josh submits the proposal without verifying the accuracy of the AI-generated
    content. The review committee finds that some of the statistics are incorrect,
    and the referenced studies do not exist.


    *   Consequences: The grant application is rejected, wasting valuable time and
    resources. His credibility with the funding agency is also compromised, which
    may affect his ability to secure future funding.


    While the above scenarios are fictionalised accounts, real-life misuse of AI tools
    for academic tasks has landed more than a few academics in precarious situations.
    A particularly notable example involves a group of Australian academics who failed
    to recognise the limitations of AI tools, specifically their propensity for hallucinations.
    These researchers relied on AI-generated content to produce a Senate inquiry submission
    to the Australian Government. Unfortunately, they submitted this document without
    thorough verification, and it included hallucinated claims of misconduct by major
    accounting firms.


    ### Mitigating hallucination risks


    To avoid the pitfalls of AI hallucinations, researchers are advised to adopt the
    following practices:


    *   Thorough verification: Always fact-check AI-generated content. Verify the
    accuracy of all references, dates, and specific claims by cross-referencing the
    original sources.


    *   Critical review: Treat AI-generated text as a draft rather than a final product.
    Subject it to the same rigorous review process as any other piece of academic
    writing.


    *   Ethical use: Where required (i.e. your university or the journal you wish
    to submit a paper to requires disclosure of the use of AI in the creation of the
    work), be transparent about the use of AI tools. If AI assistance is used, acknowledge
    it in your writing and specify the extent of its contribution.


    *   Continuous learning: Stay informed about the latest developments in AI technology
    and its limitations. Understanding how these tools work can help you better anticipate
    and mitigate potential issues.


    While hallucinations are a significant limitation of AI models, they are not the
    only potential pitfall researchers must be aware of. Another concern is the presence
    of biases in AI-generated content. These biases can subtly influence research
    outcomes and perpetuate existing prejudices if not carefully identified and addressed.
    Let’s explore this important issue in more detail below.


    ## Biases


    Bias, in the context of AI, refers to the unfair prejudice towards or against
    groups or individuals based on their inherent characteristics or identities. This
    issue arises when AI models learn patterns from data that reflect historical inequalities
    and discriminatory practices.


    Biases include, but are not limited to:


    *   Gender bias: For example, an AI system might associate certain professions
    more strongly with one gender.


    *   Racial bias: AI tools might produce results that unfairly disadvantage or
    misrepresent certain racial groups.


    *   Age bias: The system might generate content that reinforces stereotypes about
    different age groups.'
