- raw: '> I thought I understood your request, but I seem to have missed your intent.
    Without knowing the broader context or your specific needs, I just wrote what
    I thought was the most likely option. What perspective or lens should I have applied
    in rephrasing this?


    And you know what? The stranger has a point.


    Without providing clarifying parameters, how could they possibly interpret your
    request correctly? For all they knew, you might have wanted a version suitable
    for children, or for a blog post. The possibilities were endless, and they just
    went with what they considered the most likely path to follow.


    In this scenario, the failure wasn’t necessarily in the stranger’s response, but
    in the lack of detail provided to guide their response.


    It’s a bit like asking someone to cook you a meal without specifying any dietary
    requirements or preferences – you might end up with a perfectly good dish that’s
    completely unsuitable for you.


    When you approached the stranger and asked them to rephrase the text, they likely
    tackled the task based on their lifetime of knowledge and experience. Their approach
    would have been shaped by years of reading, writing, and language exposure, allowing
    them to analyse the content and formulate it in what they believed to be an understandable
    way. In essence, the stranger provided you with what they predicted to be the
    most likely response you desired.


    This example is analogous to how AI tools may operate, should you ask them to
    rephrase text for you. The tools simply provide you with what they predict to
    be the most likely answer to your question or instructional command. Let’s explore
    this further below.


    ### Prediction machines


    While both humans and chatbots generate text based on past exposure to language
    patterns, they differ in that humans possess genuine understanding, consciousness,
    and the ability to reason abstractly, whereas chatbots generate text based on
    statistical patterns without true comprehension.


    The ability of AI to generate text is underpinned by prediction


    By way of illustration, consider this example of how the training process allows
    large language models (LLMs) to identify statistical patterns and relationships
    between words.


    Imagine that an LLM was trained on a simple dataset containing just the following
    two sentences:


    *   The quick brown fox jumped over the lazy dog.


    *   The slow yellow cat sat on the busy street.


    Even from just these two examples, the model can start detecting some basic patterns,
    like:


    *   “The” frequently precedes descriptor words like colours and speeds.


    *   Animated verbs like “jumped” and “sat” often follow the descriptor words.


    *   Prepositions like “over” and “on” transition to locations after the verbs.


    Given the above training data, if the LLM was provided with the string of words
    “The speedy white rabbit”, it might be more likely to follow it with words like
    “hopped through” and “the forest” based on the patterns it recognised, even though
    those exact sentences might not be in its training data.


    This process involves internalising probabilities about which word will follow
    the next, allowing AI models to rate potential next words and phrases for the
    likelihood of sensibly responding to your entered prompts. The process is based
    on mathematics that’s far beyond the scope of this book. All you really need to
    know as a nascent AI user is that as text inputs grow sentence by sentence, models
    combine optimal word guesses iteratively.


    Before long, through cascading probabilistic predictions, coherent prose gets
    generated autonomously. Yet, it’s important to remember that while these outputs
    may sound convincingly conversational (i.e. human generated), the AI holds no
    true grasp of the meaning behind the words.


    This probabilistic approach to language generation is what allows AI models to
    produce coherent and contextually appropriate responses to a wide range of prompts.
    However, it’s crucial to understand that this is fundamentally different from
    human language production, which is grounded in genuine understanding, intent,
    and the ability to reason about the world. While AI can mimic these abilities
    to a remarkable degree, it remains, at its core, a sophisticated pattern recognition
    and prediction system.


    ## Designing your ideal research assistant


    One effective way to guide AI tools, particularly AI chatbots, in providing you
    with useful content is to assign them a specific role. These roles act as filters
    through which the AI calculates the most statistically probable result you’re
    seeking, thus helping it focus its lens and heighten its success in aligning the
    content it subsequently generates to meet your needs. The more specific and detailed
    you are in guiding an AI chatbot to understand the role you want it to assume,
    the less likely you are to experience disappointment due to misalignment or misunderstanding.
    This specificity helps bridge the gap between your expectations and the AI’s output,
    reducing the chances of getting “lost in translation”, as we explored in the previous
    chapter.


    In the context of academic research, crafting detailed role descriptions can transform
    AI chatbots into your ideal research assistants. By assigning a role, you’re essentially
    providing the AI with a framework within which to operate, much like you would
    brief a human research assistant on their responsibilities and expectations when
    they turn up for their first day of work.


    When you assign a role, you are essentially asking the chatbot to “act” a certain
    part, akin to a director assigning a role to an actor. This role-playing approach
    gives the chatbot clear direction on how to align its generated text with your
    expectations.


    There are endless characteristics you could specify when assigning a role, but
    rather than be overwhelmed with options, consider using the following equation
    for initial guidance


    $~\\begin{matrix} {Role} & \\left. = {Expertise}\\operatorname{~+~}{Background}\\operatorname{~+~}{Experience}\\operatorname{~+~}{Voice}\\operatorname{~(}{optional}
    \\right) \\\\ & {+ {Quirks}\\operatorname{~(}{optional)}} \\\\ \\end{matrix}$


    Let’s explore each of these components in more detail:


    1.  Expertise: This defines the specialised knowledge or skills your AI assistant
    should possess. For instance, you might specify “A published author skilled in
    academic writing”, “Qualitative research methods guru”, or “Thematic analysis
    expert”.


    2.  Background: This outlines the disciplinary context your AI assistant should
    be familiar with. Examples include “Economics PhD supervisor”, “Practice-based
    nursing academic”, or “Scholarly editor”.


    3.  Experience: This determines the level of seniority or depth of knowledge your
    AI assistant should have. You might specify “A senior research assistant”, “A
    subject matter expert in accounting”, or “A professor who has dedicated their
    life to the field of developmental psychology”.


    4.  Voice: This optional characteristic defines how your AI assistant should communicate.
    Options might include “Academic tone”, “Plain English”, or “Conversational”.


    5.  Quirks: Another optional characteristic, this allows you to assign specific
    behavioural traits to your AI assistant. For example, you might want it to be
    “Funny”, “Inspirational”, or to “Play devil’s advocate”.


    By carefully combining these role dimensions, you can create a unique persona
    tailored to your specific research needs.


    The key is to be as specific and detailed as possible when defining the characteristics
    you want embodied in the AI’s responses.


    For example, consider the difference between these two role assignments:


    1.  “Act in the role of a research assistant”.'
