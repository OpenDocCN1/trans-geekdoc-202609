    # 10 Writing & editing with AI

    DOI: [10.4324/9781032665276-10](https://doi.org/10.4324/9781032665276-10)


    ## Introduction

    For many academic writers, me included, there are few tasks more daunting than
    creating a new document on your computer and knowing that it needs to be filled
    with words. That blinking cursor, ostensibly patient, waiting for brilliance to
    flow from fingertips to keyboard, can feel less like an invitation and more like
    an accusation.


    “Well?” it seems to taunt, “Aren’t you supposed to be writing something brilliant?”


    Fortunately, there’s a strategy to break this stalemate: getting some words –
    any words – on the page. I know that’s precisely the hurdle you’re trying to overcome,
    but bear with me as I share how we can call upon AI chatbots to lend a hand (or
    more accurately, a helping algorithm).


    Now, I anticipate some readers:


    Adaptive learning AI systems offer significant potential for personalising the
    student experience in higher education. These systems can track individual progress
    and suggest tailored resources, potentially leading to increased engagement, improved
    retention rates, and earlier identification of struggling students for timely
    interventions.


    However, the implementation of such systems presents considerable challenges.
    Primary concerns include data privacy and ethical issues, particularly the risk
    of algorithmic bias that could inadvertently disadvantage certain student groups.

    '
