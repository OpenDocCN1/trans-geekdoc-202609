    fresh as your morning coffee, updated as new tools emerge and others become obsolete.


    Unlock bonus material by visiting: [www.broneager.com/aischolar](http://www.broneager.com/aischolar)


    # Glossary


    As you work through the chapters in this book, you’ll likely encounter some unfamiliar
    terms. This glossary is designed to be your handy companion for navigating common
    AI terminology. It’s not an exhaustive encyclopaedia of AI jargon but rather a
    friendly guidebook. Here, you’ll find clear and concise explanations of key concepts,
    essential for building your AI literacy skills.


    ## A


    **Accuracy (in machine learning)**

    : A metric used to evaluate the performance of a machine learning (ML) model,
    measuring the proportion of correct predictions among the total number of cases
    examined.


    **AGI (Artificial General Intelligence)**

    : A hypothetical form of AI that would have the ability to understand, learn,
    and apply intelligence in a way that matches or surpasses human cognitive abilities
    across a wide range of tasks. Unlike narrow AI, which is designed for specific
    tasks, AGI would be capable of generalising its knowledge and skills to new situations.


    **AI-assisted (AI-augmented)**

    : This term describes the use of artificial intelligence to enhance human capabilities
    in various tasks. The primary goal is to increase efficiency, accuracy, and productivity,
    allowing academics to focus on more innovative and strategic elements of their
    work. AI-assisted tools act as digital collaborators, augmenting rather than replacing
    human expertise.


    **AI-generated (outputs)**

    : Content or outputs predominantly created by artificial intelligence systems.
    Examples include text, images, music, videos, and other data forms. These are
    often crafted using sophisticated AI techniques such as deep learning and natural
    language processing. AI systems analyse vast datasets to produce innovative content
    that showcases human-like creativity or analytical capabilities. The quality and
    complexity of AI-generated content hinge on various factors, including the algorithms
    and training data used.


    **AI literacy**

    : The understanding and skill set required to effectively interact with, manage,
    or leverage artificial intelligence technologies. This encompasses a basic knowledge
    of what AI is, how it works, and its potential applications. AI literacy goes
    beyond technical skills, embracing an awareness of ethical considerations, biases
    in AI, and the impact of AI on various sectors such as employment, privacy, and
    security.


    **AI tools**

    : Software applications or platforms that incorporate artificial intelligence
    to perform or improve tasks. AI tools are increasingly being integrated into academic
    workflows to enhance research and writing processes.


    **AI winter/AI summer**

    : In the history of artificial intelligence research, an “AI winter” refers to
    a period where progress stagnated, leading to reduced interest and funding. Conversely,
    an “AI summer” describes a time of accelerated progress, sparking renewed interest
    and investment in the field.


    **Algorithm**

    : A set of step-by-step instructions or rules designed to perform a specific task
    or solve a particular problem. In computing, algorithms are used to manipulate,
    process, and analyse data, forming the basis of computer programs. The efficiency
    and effectiveness of an algorithm are crucial, as they directly impact the performance
    and capabilities of a software application or system.


    **Alignment**

