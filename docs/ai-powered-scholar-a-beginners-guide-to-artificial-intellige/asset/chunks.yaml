- raw: 'Over the months it took to write – underpinned by years spent on what some
    might call an obsessive learning journey about AI – I always had an AI tool by
    my side. These tools helped to translate my thoughts into draft chapter outlines,
    rephrase my writing into clearer prose, and assisted in locating resources to
    continue building my knowledge base. As such, AI touched every part of this book,
    embedded in the process as a way of extending my human capabilities, in line with
    the Extended Mind Thesis proposed by Clark and Chalmers.


    This approach of integrating AI into my workflow represents more than just using
    a tool; it’s a manifestation of cognitive extension, where AI becomes an integral
    part of my thought process and creative output. By embracing AI in this way, I’ve
    found that it enhances rather than replaces my own cognitive abilities, allowing
    me to explore ideas more deeply and express them more clearly than I might have
    done otherwise. This co-generative relationship with AI has not only shaped this
    book but has also transformed my approach to academic work more broadly.


    AI can be used to write books. However, the quality of AI-authored books remains
    questionable.


    In early 2023, I experimented with using AI to write a book containing 500+ AI
    prompts across various academic use cases.


    The book you’re reading now is a different beast entirely.


    Even if I had wanted to use AI to author this entire book – to a standard that
    I’d be confident attaching my academic reputation to – the technology simply isn’t
    up to the task. Thus, while AI has been an invaluable tool that has sat alongside
    me during the writing process, the core content, ideas, personal insights, and
    long-form narrative structure are the result of my “human” thoughts and experiences.


    The long answer to the question of whether AI was used to write this book requires
    further examination, as does the need for disclosure.


    Throughout history, scholars have consistently adopted new technologies to enhance
    their work, often without explicit acknowledgement in their final products. From
    the chisel and stone tablet to the quill and parchment, from the printing press
    to the typewriter, and from personal computers to the internet, each technological
    advancement has shaped the way academic work is created and disseminated. Yet,
    we don’t tend to see ancient texts crediting the chisel, medieval manuscripts
    acknowledging the quill, or academic journal articles attributing their clarity
    to word processing software and spell-checkers. This book continues in that tradition,
    leveraging current tools and technologies to facilitate research, writing, and
    editing processes.


    Disclosing the use of now-commonplace technologies like computers or online databases
    in academic work today would seem rather ludicrous. Similarly, I believe that
    the explicit acknowledgement of AI usage in tomorrow’s version of academia might
    come to be seen as equally unnecessary. As we navigate this transitional period,
    transparency about AI’s role is largely being insisted upon, even as many of us
    recognise it as simply the latest in a long line of technological aids to scholarship.


    Whether or not you choose to disclose the application of your AI skills, I urge
    you to remember: AI is a powerful tool, but it’s your creativity, critical thinking,
    and domain knowledge that will drive you towards making meaningful academic contributions.


