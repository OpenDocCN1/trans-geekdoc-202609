    2. Jording, M., Hartz, A., Bente, G., Schulte‐Rüther, M., & Vogeley, K. (2018).
    The “social gaze space”: A taxonomy for gaze-based communication in triadic interactions.
    *Frontiers in Psychology*, *9*, 1–8. [`doi.org/10.3389/fpsyg.2018.00226`](https://doi.org/10.3389/fpsyg.2018.00226)

    3. Glassman, E L. (2023, September 5). Designing interfaces for human-computer
    communication: An on-going collection of considerations. *arXiv (Cornell University)*,
    1–5. [`doi.org/10.48550/arxiv.2309.02257`](https://doi.org/10.48550/arxiv.2309.02257)

