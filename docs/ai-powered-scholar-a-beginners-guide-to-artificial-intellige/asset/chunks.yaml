    issue arises when AI models learn patterns from data that reflect historical inequalities
    and discriminatory practices.


    Biases include, but are not limited to:


    * Gender bias: For example, an AI system might associate certain professions more
    strongly with one gender.

    * Racial bias: AI tools might produce results that unfairly disadvantage or misrepresent
    certain racial groups.

    * Age bias: The system might generate content that reinforces stereotypes about
    different age groups.

