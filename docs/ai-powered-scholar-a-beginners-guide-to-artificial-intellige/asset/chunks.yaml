  trans: "\n如果你尝试这种方法，我敦促你将自己视为合作者兼守门人——与 AI 共同生成想法，但要仔细过滤和完善其输出。请记住，目标不仅仅是增加你的字数，还要提升作品的深度、清晰度和整体质量。\n\
    \n## 精简文本\n\n在写作项目的开始，我们的目标往往集中于生成*更多*的文字。然而，很可能会有需要将其删减的时候。例如，当你收到令人 dreaded\
    \ 的“desk reject”，并发现你名单上下一篇论文潜在发表期刊的最大字数限制显著更低时。AI 聊天机器人可以通过建议消除冗余、删减多余细节以及阐明你的核心信息来帮助加快这一过程。\n\
    \n以下是你可以完成任务的一种方式：\n1. 选择要缩短的文本：首先，突出显示你关注的段落或[content]\n如果你尝试这种方法，我敦促你将自己视为合作者兼守门人——与\
    \ AI 共同生成想法，但要仔细过滤和完善其输出。请记住，目标不仅仅是增加你的字数，还要提升作品的深度、清晰度和整体质量。\n\n## 精简文本\n\n在写作项目的开始，我们的目标往往集中于生成*更多*的文字。然而，很可能会有需要将其删减的时候。例如，当你收到令人\
    \ dreaded 的“desk reject”，并发现你名单上下一篇论文潜在发表期刊的最大字数限制显著更低时。AI 聊天机器人可以通过建议消除冗余、删减多余细节以及阐明你的核心信息来帮助加快这一过程。\n\
    \n以下是你可以完成任务的一种方式：\n1. 选择要缩短的文本：首先，突出显示你关注的段落或段落。然后，通过复制将其暂时保存。这样可以让你立即再次使用，而无需重新输入。\n\
    2. 提供明确的提示：为 AI 聊天机器人提供具体的压缩指令，例如“请建议消除不必要的细节并使本段更简洁的方法”，或“找出可从本段中删除的冗余或重复的短语”。\n\
    3. 审阅和完善：阅读 AI 的建议并将最相关、最有用的压缩整合到你的文本中。注意不要删除任何基本信息或细微差别，并确保你的精简版本仍能有效传达你的关键要点。\n\
    \n为了演示该过程在实践中的运作方式，让我们看一个例子。以下输出是使用 Claude 生成的，该 AI 聊天机器人运行其 3.5 Sonnet 模型。Claude\
    \ 在提供以下示例文本和提示后生成了结果（如下所示）：\n> 示例文本：The researchers conducted in-depth, semi-structured\
    \ interviews with 15 university lecturers who had implemented AI-powered adaptive\
    \ learning systems in their courses. The interviews, lasting between 60 and 90\
    \ minutes each, were conducted via video conferencing software due to COVID-19\
    \ restrictions. The interview questions focused on the lecturers’ experiences\
    \ with the AI systems, their perceptions of the impact on student learning, and\
    \ the challenges they faced during implementation. All interviews were audio-recorded\
    \ with participant consent and subsequently transcribed verbatim. The researchers\
    \ then employed a thematic analysis approach, following Braun and Clarke’s six-step\
    \ process, to identify key themes and patterns in the data. This involved multiple\
    \ rounds of coding and theme refinement, with regular team meetings to discuss\
    \ and validate the emerging findings.\n> \n> 提示：“Please suggest ways to make this\
    \ passage more concise by removing unnecessary details and streamlining the description\
    \ of the qualitative research process, while maintaining the essential methodological\
    \ information”。\n> \n> 精简文本：“Semi-structured interviews were conducted with 15\
    \ university lecturers who had implemented AI-powered adaptive learning systems.\
    \ Interviews, conducted virtually, explored lecturers’ experiences, perceived\
    \ impacts on student learning, and implementation challenges. Using Braun and\
    \ Clarke’s thematic analysis approach, researchers identified key themes through\
    \ iterative coding and team validation”。\n\n与 AI 辅助写作的所有方面一样，以批判的眼光审视这些建议并致力于保持你自己的作者声音和意图非常重要。最好将聊天机器人的建议视为完善的起点，确保你始终对包含什么和删减什么做出最终决定。\n\
    \n## 使用 AI 编辑\n\n在教学责任、开展研究、分析数据以及处理大学行政事务之间，要腾出时间对你的作品进行彻底编辑可能是一个挑战。对于那些幸运 enough\
    \ 能够获得专业编辑、愿意的同事、关心的导师或慷慨朋友的人来说，请有经验的人审阅作品的好处不言而喻。不幸的是，获取编辑帮助存在许多障碍。虽然与专业编辑相比，AI\
    \ 工具目前还远不完美，但它们确实提供了一些值得考虑的好处，包括：\n1. 全天候可用性：AI 聊天机器人不遵守办公时间。它们随时准备在你需要时提供帮助。\n\
    2. 即时反馈：使用 AI 聊天机器人，你不必等待数天或数周才能获得对你写作的反馈。建议会实时提供，让你能够根据自己的日程迭代和改进你的作品。\n3. 经济高效的解决方案：人工编辑可能花费数千美元，尤其是当任务是编辑冗长的学术文件时。AI\
    \ 聊天机器人提供了一个相对负担得起的替代方案，至少在你的自付费用方面如此。\n4. “安全空间”：有时我们因担心被评判而不愿与他人分享我们的写作。聊天机器人可以在没有这种恐惧的情况下提供一个讨论的平台。此外，它们通常经过训练以提供支持性建议，除非，当然，你决定提示你的聊天机器人“以在会议上咆哮的学者的风格提供批评，准备在问答环节中\
    \ unleash 尖刻的评论”。\n\n要在编辑过程中使用 AI 聊天机器人，你（显然）需要一些需要编辑的文本。它可以小到一句话，也可以大到论文。当你有一些文字可供使用时，以下是完成该过程的一个示例工作流程：\n\
    1. 选择你的 AI 平台：对于较长的编辑，选择具有文档上传功能的平台。此功能允许你输入更大的文本部分或整个文档进行分析。重要的是——确保你选择的平台符合你所在机构的数据保护和隐私政策。\n\
    2. 准备你的文档：在上传之前，审阅你的文档以确保其中不包含任何敏感或机密信息。\n3. 上传文档：按照平台的说明上传你的文档。这通常涉及从你的计算机（通常通过单击回形针图标）或云存储提供商中选择文件，或将文本复制并粘贴到指定区域。\n\
    4. 提示聊天机器人：这就是你撰写有效提示的技能（如果需要复习，请参阅 第 6 章）发挥作用的地方。明确说明你需要哪种编辑帮助。例如：“Please review\
    \ this text for clarity and coherence. Suggest improvements in sentence structure,\
    \ identify any awkward phrasing, and highlight areas where the argument could\
    \ be strengthened. Pay particular attention to the flow between paragraphs and\
    \ the use of academic language”。\n5. 审阅分析：仔细阅读 AI 的建议。虽然 AI 可以提供有价值的见解，但它并非万无一失。\n\
    \n最后，始终使用你的批判性思维技能来评估每个建议，考虑：\n* 建议的更改是否提高了清晰度或流畅度？\n* 它是否保持了你预期的含义？\n* 它是否与你的声音和风格一致？\n\
    \n随着你对 AI 辅助编辑越来越熟悉，你可能会发现它对以下任务特别有用：\n* 检查术语和风格的一致性\n* 识别过度使用的词语或短语\n* 建议更精确的词汇\n\
    * 突出可能需要引用的地方\n* 改善论证的整体结构和流畅度\n\n认识到本章以及本书更广泛内容所涵盖的只是利用 AI 进行学术任务的冰山一角是很重要的。\n"
