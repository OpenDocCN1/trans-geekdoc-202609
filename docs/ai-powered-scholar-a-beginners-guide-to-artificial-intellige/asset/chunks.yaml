- raw: "*   “I’m feeling overwhelmed in reviewing this massive literature on organisational\
    \ behaviour for my thesis. Can you please help summarise the key theories and\
    \ frameworks in a short and clear overview?”\n\n    *   Expressing sentiment provides\
    \ useful emotional context.\n\n*   “Building on our last discussion of argument\
    \ analysis frameworks, please explain the reasoning structure of the attached\
    \ journal article”.\n\n    *   Referencing prior interactions creates pseudo-continuity.\n\
    \nAs I aim to illustrate with these examples, effective prompts tend to incorporate\
    \ some combination of clear instructions, context, examples, constraints, humanisation,\
    \ sentiment expression, and association. Not every prompt needs all components,\
    \ but most strong prompts include several elements that help steer the AI response.\n\
    \n## Crafting prompts for academic contexts\n\nWhen writing prompts for AI assistance\
    \ with academic work, tailoring prompts to different tasks and contexts is key\
    \ for generating useful outputs. Below are some examples of prompts crafted for\
    \ common academic scenarios:\n\n*   Literature review: “Please act as my research\
    \ assistant and summarise the key contributions of the attached journal article\
    \ on \\[topic\\] to help me write a literature review. For the article, list the\
    \ main claims, evidence, theories referenced, and limitations in 2–3 concise bullet\
    \ points. Keep the summary objective without offering opinions. \\[Attach article\\\
    ]”\n\n*   Thesis introduction: “I need help writing a strong introduction chapter\
    \ for my PhD thesis on \\[topic\\]. Please provide an example 1,500-word introduction\
    \ that gives background context on the research problem and gap, states my project’s\
    \ purpose and significance, provides an overview of the theoretical and conceptual\
    \ framework, and concludes with a chapter outline. Write in a formal academic\
    \ style appropriate for a thesis. Focus the content on explaining the proposed\
    \ approach for my specific research questions: \\[list questions\\]. Thank you”.\n\
    \n*   Ethics application: “Please act as an ethics advisor and draft an ethics\
    \ application using the provided template for my study on \\[topic\\] with \\\
    [description of methods\\]. Ensure the drafted text clearly explains how the study\
    \ procedures adequately address any risks related to \\[types of sensitivity,\
    \ e.g. vulnerable populations, sensitive topics, risks of emotional distress,\
    \ privacy concerns\\]. Maintain an objective, professional tone. Thank you. \\\
    [Attach ethics application template\\]”.\n\n*   Qualitative data analysis: “Please\
    \ act as a research assistant skilled in qualitative data analysis. Thematically\
    \ analyse the attached interview transcripts on \\[topic\\] and identify common\
    \ themes related to \\[main research questions\\]. Synthesise the key themes in\
    \ a structured outline with supporting illustrative quotes indented under each\
    \ theme heading. Be concise yet thorough – aim for 8–12 main themes. Thank you.\
    \ \\[Attach interview transcripts\\]”.\n\n*   Grant proposal: “Please act as an\
    \ experienced grant writer and draft a 1,000-word project description for a \\\
    [discipline\\] research proposal to study \\[problem\\] using \\[methods\\]. The\
    \ project aims to \\[objectives\\]. Explain the theoretical foundations, significance,\
    \ innovation, expected outputs, and projected impact. Use persuasive language\
    \ that highlights the merits and potential of the proposed project to convince\
    \ reviewers to fund this research. Ensure disciplinary accuracy for \\[insert\
    \ field\\]. Thank you”.\n\nThe above examples illustrate how prompts can be tailored\
    \ to common academic tasks by establishing role-playing context, conveying sentiment,\
    \ providing constraints, attaching relevant materials, and giving clear instructions.\n\
    \nLet’s unpack the components of those prompts a bit further using the following\
    \ five dimensions\n\n*   Verb: Lead with an action verb that specifies the type\
    \ of response needed from the AI, such as “summarise”, “analyse”, “compare”, etc.\n\
    \n*   Focus: Define the key output you desire the response to focus on, such as\
    \ a list of ideas, or identifying a research gap.\n\n*   Context: Provide background\
    \ information to establish the framing and perspective for the response, such\
    \ as the research discipline, relevant theories, or the perspective you wish the\
    \ output to reflect.\n\n*   Alignment: Articulate any requirements or objectives\
    \ that the response must fulfil, so that the generated content aligns with your\
    \ goals, like arguing a specific perspective.\n\n*   Constraints: Guide the type\
    \ of output you’re seeking by providing guidelines like word count, formats, or\
    \ inclusion/exclusion criteria.\n\nYou’ll remember from [Chapter 3](#C_007_c3.xhtml),\
    \ when you completed the Lost in Translation drawing activity, the more specific\
    \ you can be when providing instructions, the closer the output is likely to be\
    \ to what you’re seeking from AI-generated outputs. Similarly, incorporating each\
    \ of these elements will help craft prompts that yield optimally useful content\
    \ from your AI assistant.\n\nHaving a framework to guide your prompt writing should\
    \ also take some of the guesswork out of what content you might include. Below,\
    \ you’ll find a list of suggestions (a “cheat sheet” of sorts) to help you get\
    \ started, which you can do by selecting one option across each dimension, or\
    \ others as desired, then weaving those options together in a way that mirrors\
    \ natural language, remembering that the best way to interact with an AI chatbot\
    \ is to talk to it as if it were a human.\n\nThe equation for phrasing your prompt\
    \ could be thought of as:\n\nPrompt  =  Verb  +  Focus  +  Context  +  Alignment  +  Constraints\n\
    \nVerb examples:\n\n*   Summarise\n\n*   Synthesise\n\n*   Analyse\n\n*   Compare\n\
    \n*   Contrast\n\n*   Classify\n\n*   Rephrase\n\n*   Enhance\n\n*   Evaluate\n\
    \n*   Critique\n\n*   Review\n\n*   Assess\n\n*   Recommend\n\n*   Predict\n\n\
    *   Forecast\n\n*   Simulate\n\n*   Model\n\n*   Hypothesise\n\n*   Theorise\n\
    \n*   Conceptualise\n\n*   Propose\n\n*   Ideate\n\nFocus examples:\n\n*   Literature\
    \ review on \\[topic\\]\n\n*   Results\n\n*   Themes\n\n*   Gaps\n\n*   Theoretical\
    \ framework\n\n*   Methodology\n\n*   Proposal\n\n*   Ethical considerations\n\
    \n*   Questionnaire\n\n*   Interview protocol\n\nContext examples:\n\n*   Discipline\
    \ (e.g. public health, business, education, sociology)\n\n*   Theoretical framing\
    \ (e.g. feminist lens, critical race perspective)\n\n*   Ontological assumptions\n\
    \n*   Paradigm (e.g. interpretivist)\n\n*   Framework (e.g. positivist)\n\n* \
    \  Methodological approach\n\n*   Analysis type (e.g. narrative)\n\n*   Audience\
    \ (e.g. student, general population, academic research)\n\n*   Key stakeholders\n\
    \n*   Ethical considerations\n\nAlignment examples:\n\n*   Argue from a \\[e.g.\
    \ feminist/critical\\] perspective\n\n*   Support the position that \\[state position\\\
    ]\n\n*   Challenge the assumption that \\[state assumption\\]\n\n*   Focus specifically\
    \ on \\[theory/topic/concept\\]\n\n*   Adhere to \\[stylistic convention/genre\
    \ format\\]\n\n*   Target a \\[specific audience/readership\\]\n\n*   Make implications\
    \ clear for \\[policy/practice/research\\]\n\n*   Connect to \\[e.g. real-world\
    \ issue\\]\n\n*   Maintain an objective, neutral point of view\n\n*   Use \\[formal/informal/academic\\\
    ] language and style\n\nConstraints examples:\n\n*   Limit the response to \\\
    [word count\\] words\n\n*   Focus only on \\[phenomenon/theory/event\\]\n\n* \
    \  Follow the structure of \\[literature review/empirical paper/report\\]\n\n\
    *   Include \\[section headings/outline format\\]\n\n*   Use \\[technical/plain\\\
    ] language suitable for \\[audience\\]\n\n*   Integrate perspectives from \\[disciplines\\\
    ]\n\n*   Cover \\[time-period/geographic region\\]\n\n*   Provide examples from\
    \ \\[contexts\\]\n\n*   Generate \\[number of\\] unique \\[output type\\]\n\n\
    *   Organise chronologically/alphabetically/by theme\n\nHere are some examples\
    \ of how you might combine suggestions from each dimension into a written prompt\
    \ using natural language:"
  fmt: "\n# Prompt Crafting Overview\n\n* “I’m feeling overwhelmed in reviewing this\
    \ massive literature on organisational behaviour for my thesis. Can you please\
    \ help summarise the key theories and frameworks in a short and clear overview?”\n\
    \  * Expressing sentiment provides useful emotional context.\n* “Building on our\
    \ last discussion of argument analysis frameworks, please explain the reasoning\
    \ structure of the attached journal article”.\n  * Referencing prior interactions\
    \ creates pseudo-continuity.\n\nAs I aim to illustrate with these examples, effective\
    \ prompts tend to incorporate some combination of clear instructions, context,\
    \ examples, constraints, humanisation, sentiment expression, and association.\
    \ Not every prompt needs all components, but most strong prompts include several\
    \ elements that help steer the AI response.\n\n## Crafting prompts for academic\
    \ contexts\n\nWhen writing prompts for AI assistance with academic work, tailoring\
    \ prompts to different tasks and contexts is key for generating useful outputs.\
    \ Below are some examples of prompts crafted for common academic scenarios:\n\n\
    * Literature review: “Please act as my research assistant and summarise the key\
    \ contributions of the attached journal article on \\[topic\\] to help me write\
    \ a literature review. For the article, list the main claims, evidence, theories\
    \ referenced, and limitations in 2–3 concise bullet points. Keep the summary objective\
    \ without offering opinions. \\[Attach article\\]”\n* Thesis introduction: “I\
    \ need help writing a strong introduction chapter for my PhD thesis on \\[topic\\\
    ]. Please provide an example 1,500-word introduction that gives background context\
    \ on the research problem and gap, states my project’s purpose and significance,\
    \ provides an overview of the theoretical and conceptual framework, and concludes\
    \ with a chapter outline. Write in a formal academic style appropriate for a thesis.\
    \ Focus the content on explaining the proposed approach for my specific research\
    \ questions: \\[list questions\\]. Thank you”.\n* Ethics application: “Please\
    \ act as an ethics advisor and draft an ethics application using the provided\
    \ template for my study on \\[topic\\] with \\[description of methods\\]. Ensure\
    \ the drafted text clearly explains how the study procedures adequately address\
    \ any risks related to \\[types of sensitivity, e.g. vulnerable populations, sensitive\
    \ topics, risks of emotional distress, privacy concerns\\]. Maintain an objective,\
    \ professional tone. Thank you. \\[Attach ethics application template\\]”.\n*\
    \ Qualitative data analysis: “Please act as a research assistant skilled in qualitative\
    \ data analysis. Thematically analyse the attached interview transcripts on \\\
    [topic\\] and identify common themes related to \\[main research questions\\].\
    \ Synthesise the key themes in a structured outline with supporting illustrative\
    \ quotes indented under each theme heading. Be concise yet thorough – aim for\
    \ 8–12 main themes. Thank you. \\[Attach interview transcripts\\]”.\n* Grant proposal:\
    \ “Please act as an experienced grant writer and draft a 1,000-word project description\
    \ for a \\[discipline\\] research proposal to study \\[problem\\] using \\[methods\\\
    ]. The project aims to \\[objectives\\]. Explain the theoretical foundations,\
    \ significance, innovation, expected outputs, and projected impact. Use persuasive\
    \ language that highlights the merits and potential of the proposed project to\
    \ convince reviewers to fund this research. Ensure disciplinary accuracy for \\\
    [insert field\\]. Thank you”.\n\nThe above examples illustrate how prompts can\
    \ be tailored to common academic tasks by establishing role-playing context, conveying\
    \ sentiment, providing constraints, attaching relevant materials, and giving clear\
    \ instructions.\n\n## Unpacking Prompt Components\n\nLet’s unpack the components\
    \ of those prompts a bit further using the following five dimensions\n\n* Verb:\
    \ Lead with an action verb that specifies the type of response needed from the\
    \ AI, such as “summarise”, “analyse”, “compare”, etc.\n* Focus: Define the key\
    \ output you desire the response to focus on, such as a list of ideas, or identifying\
    \ a research gap.\n* Context: Provide background information to establish the\
    \ framing and perspective for the response, such as the research discipline, relevant\
    \ theories, or the perspective you wish the output to reflect.\n* Alignment: Articulate\
    \ any requirements or objectives that the response must fulfil, so that the generated\
    \ content aligns with your goals, like arguing a specific perspective.\n* Constraints:\
    \ Guide the type of output you’re seeking by providing guidelines like word count,\
    \ formats, or inclusion/exclusion criteria.\n\nYou’ll remember from [Chapter 3](#C_007_c3.xhtml),\
    \ when you completed the Lost in Translation drawing activity, the more specific\
    \ you can be when providing instructions, the closer the output is likely to be\
    \ to what you’re seeking from AI-generated outputs. Similarly, incorporating each\
    \ of these elements will help craft prompts that yield optimally useful content\
    \ from your AI assistant.\n\nHaving a framework to guide your prompt writing should\
    \ also take some of the guesswork out of what content you might include. Below,\
    \ you’ll find a list of suggestions (a “cheat sheet” of sorts) to help you get\
    \ started, which you can do by selecting one option across each dimension, or\
    \ others as desired, then weaving those options together in a way that mirrors\
    \ natural language, remembering that the best way to interact with an AI chatbot\
    \ is to talk to it as if it were a human.\n\nThe equation for phrasing your prompt\
    \ could be thought of as:\n\n`Prompt = Verb + Focus + Context + Alignment + Constraints`\n\
    \n### Verb examples\n\n* Summarise\n* Synthesise\n* Analyse\n* Compare\n* Contrast\n\
    * Classify\n* Rephrase\n* Enhance\n* Evaluate\n* Critique\n* Review\n* Assess\n\
    * Recommend\n* Predict\n* Forecast\n* Simulate\n* Model\n* Hypothesise\n* Theorise\n\
    * Conceptualise\n* Propose\n* Ideate\n\n### Focus examples\n\n* Literature review\
    \ on \\[topic\\]\n* Results\n* Themes\n* Gaps\n* Theoretical framework\n* Methodology\n\
    * Proposal\n* Ethical considerations\n* Questionnaire\n* Interview protocol\n\n\
    ### Context examples\n\n* Discipline (e.g. public health, business, education,\
    \ sociology)\n* Theoretical framing (e.g. feminist lens, critical race perspective)\n\
    * Ontological assumptions\n* Paradigm (e.g. interpretivist)\n* Framework (e.g.\
    \ positivist)\n* Methodological approach\n* Analysis type (e.g. narrative)\n*\
    \ Audience (e.g. student, general population, academic research)\n* Key stakeholders\n\
    * Ethical considerations\n\n### Alignment examples\n\n* Argue from a \\[e.g. feminist/critical\\\
    ] perspective\n* Support the position that \\[state position\\]\n* Challenge the\
    \ assumption that \\[state assumption\\]\n* Focus specifically on \\[theory/topic/concept\\\
    ]\n* Adhere to \\[stylistic convention/genre format\\]\n* Target a \\[specific\
    \ audience/readership\\]\n* Make implications clear for \\[policy/practice/research\\\
    ]\n* Connect to \\[e.g. real-world issue\\]\n* Maintain an objective, neutral\
    \ point of view\n* Use \\[formal/informal/academic\\] language and style\n\n###\
    \ Constraints examples\n\n* Limit the response to \\[word count\\] words\n* Focus\
    \ only on \\[phenomenon/theory/event\\]\n* Follow the structure of \\[literature\
    \ review/empirical paper/report\\]\n* Include \\[section headings/outline format\\\
    ]\n* Use \\[technical/plain\\] language suitable for \\[audience\\]\n* Integrate\
    \ perspectives from \\[disciplines\\]\n* Cover \\[time-period/geographic region\\\
    ]\n* Provide examples from \\[contexts\\]\n* Generate \\[number of\\] unique \\\
    [output type\\]\n* Organise chronologically/alphabetically/by theme\n\nHere are\
    \ some examples of how you might combine suggestions from each dimension into\
    \ a written prompt using natural language:\n"
  trans: "\n# 提示词构建概览\n\n* “我在审阅论文中关于组织行为学的庞大文献时感到不知所措。能否请你帮我总结关键理论和框架，提供一个简短清晰的概述？”\n\
    \  * 表达情感能提供有用的情感背景。\n* “基于我们上次关于论证分析框架的讨论，请解释所附期刊文章的推理结构”。\n  * 引用之前的互动可创造伪连续性。\n\
    \n正如我用这些例子所说明的那样，有效的提示词往往结合了清晰的指令、背景、示例、约束、人性化、情感表达和关联性。并非每个提示词都需要所有要素，但大多数强有力的提示词包含多个有助于引导\
    \ AI 回应的元素。\n\n## 为学术场景构建提示词\n\n当为学术工作撰写 AI 辅助提示词时，根据不同的任务和情境定制提示词是生成有用输出的关键。下面是针对常见学术场景所设计的提示词示例：\n\
    \n* 文献综述：“请担任我的研究助理，总结所附关于 \\[topic\\] 的期刊文章的关键贡献，以帮助我撰写文献综述。对该文章，列出主要论点、证据、引用的理论和局限性，共\
    \ 2–3 条简洁的要点。保持总结客观，不要发表意见。\\[Attach article\\]”\n* 论文引言：“我需要帮助为我的博士论文关于 \\[topic\\\
    ] 写一篇强有力的引言章节。请提供一篇约 1,500 字的示例引言，介绍研究问题和差距的背景，说明我项目的目的和意义，提供理论和概念框架的概述，并以章节大纲作结。用适合论文的正式学术风格撰写。内容重点解释针对我的具体研究问题：\\\
    [list questions\\] 的拟议方法。谢谢”。\n* 伦理申请：“请担任伦理顾问，使用提供的模板为我关于 \\[topic\\] 的研究起草伦理申请，其中\
    \ \\[description of methods\\]。确保起草的文本清楚地说明研究程序如何充分应对与 \\[types of sensitivity,\
    \ e.g. vulnerable populations, sensitive topics, risks of emotional distress,\
    \ privacy concerns\\] 相关的任何风险。保持客观、专业的语气。谢谢。\\[Attach ethics application template\\\
    ]”。\n* 定性数据分析：“请担任擅长定性数据分析的研究助理。对所附关于 \\[topic\\] 的访谈记录进行主题分析，并识别与 \\[main research\
    \ questions\\] 相关的常见主题。将关键主题综合成结构化大纲，并在每个主题标题下缩进提供支持性的例证性引语。简洁而全面——目标为 8–12 个主要主题。谢谢。\\\
    [Attach interview transcripts\\]”。\n* 基金申请：“请担任经验丰富的资助撰写人，为研究 \\[problem\\] 的\
    \ \\[discipline\\] 研究提案起草一份 1,000 字的项目描述，使用 \\[methods\\]。项目旨在 \\[objectives\\\
    ]。解释理论基础、意义、创新、预期成果和预计影响。使用能突出拟议项目优点和潜力的说服性语言，以说服评审资助该研究。确保对 \\[insert field\\\
    ] 的学科准确性。谢谢”。\n\n上述示例说明了提示词如何通过建立角色扮演情境、传达情感、提供约束、附加相关材料以及给出明确指令来针对常见学术任务进行定制。\n\
    \n## 解析提示词组件\n\n让我们使用以下五个维度进一步解析这些提示词的组件\n\n* 动词：以一个动词开头，指定 AI 所需的回应类型，例如“summarise”、“analyse”、“compare”等。\n\
    * 聚焦：定义你希望回应重点关注的关键输出，例如思想列表，或识别研究空白。\n* 背景：提供背景信息以建立回应的框架和视角，例如研究学科、相关理论，或你希望输出反映的视角。\n\
    * 对齐：阐明回应必须满足的任何要求或目标，以便生成的内容与你的目标保持一致，例如论证特定观点。\n* 约束：通过提供诸如字数、格式或包含/排除标准等指导来引导你所寻求的输出类型。\n\
    \n你会记得在 第三章 中，当你完成《Lost in Translation》绘画活动时，提供指令时越具体，输出就越可能接近你从 AI 生成内容中所寻求的。同样，纳入这些要素中的每一个将有助于构建提示词，使你的\
    \ AI 助手产生最有用的内容。\n\n拥有指导提示词撰写的框架也应减少你在可能包含的内容上的猜测。下面，你会找到一份建议清单（某种“速查表”），以帮助你入门，你可以通过在每个维度中选择一个选项，或根据需要选择其他选项，然后以模仿自然语言的方式将这些选项编织在一起，记住与\
    \ AI 聊天机器人的最佳互动方式是像与人类交谈一样。\n\n提示词的表述可以被认为等同于：\n\n`Prompt = Verb + Focus + Context\
    \ + Alignment + Constraints`\n\n### 动词示例\n\n* 总结\n* 综合\n* 分析\n* 比较\n* 对比\n* 分类\n\
    * 重新表述\n* 增强\n* 评估\n* 批评\n* 审阅\n* 评价\n* 推荐\n* 预测\n* 预报\n* 模拟\n* 建模\n* 假设\n* 理论化\n\
    * 概念化\n* 提出\n* 构思\n\n### 聚焦示例\n\n* 关于 \\[topic\\] 的文献综述\n* 结果\n* 主题\n* 空白\n* 理论框架\n\
    * 方法论\n* 提案\n* 伦理考虑\n* 问卷\n* 访谈方案\n\n### 背景示例\n\n* 学科（例如公共卫生、商业、教育、社会学）\n* 理论框架（例如女性主义视角、批判性种族视角）\n\
    * 本体论假设\n* 范式（例如诠释主义）\n* 框架（例如实证主义）\n* 方法论方法\n* 分析类型（例如叙事）\n* 受众（例如学生、普通人群、学术研究）\n\
    * 关键利益相关者\n* 伦理考虑\n\n### 对齐示例\n\n* 从 \\[例如女性主义/批判性\\] 视角论证\n* 支持 \\[state position\\\
    ] 的立场\n* 挑战 \\[state assumption\\] 的假设\n* 特别聚焦于 \\[theory/topic/concept\\]\n*\
    \ 遵守 \\[stylistic convention/genre format\\]\n* 针对 \\[specific audience/readership\\\
    ]\n* 使对 \\[policy/practice/research\\] 的影响明确\n* 与 \\[例如现实世界问题\\] 相联系\n* 保持客观、中立的观点\n\
    * 使用 \\[formal/informal/academic\\] 语言和风格\n\n### 约束示例\n\n* 将回应限制在 \\[word count\\\
    ] 字\n* 仅聚焦于 \\[phenomenon/theory/event\\]\n* 遵循 \\[literature review/empirical\
    \ paper/report\\] 的结构\n* 包含 \\[section headings/outline format\\]\n* 使用适合 \\[audience\\\
    ] 的 \\[technical/plain\\] 语言\n* 整合来自 \\[disciplines\\] 的视角\n* 涵盖 \\[time-period/geographic\
    \ region\\]\n* 提供来自 \\[contexts\\] 的示例\n* 生成 \\[number of\\] 个独特的 \\[output type\\\
    ]\n* 按时间顺序/字母顺序/按主题组织\n\n这里有一些示例，说明你如何将来自每个维度的建议组合成使用自然语言书写的提示词：\n"
