    \ prompt writing is a learnable skill that improves with dedicated practice. While\
    \ it may feel awkward at first, with consistent effort, you’ll soon be authoring\
    \ prompts like a pro.\n\nOnce you’re ready, have a go at completing the activity\
    \ below to help you further reflect on your learning and solidify your understanding\
    \ of prompt-writing techniques.\n\n## Activity\nThis activity is designed to help\
    \ you build skills in crafting effective prompts.\n\n1. Select a research task:\
    \ Choose an academic task you want assistance with, such as summarising a paper,\
    \ analysing data, writing a literature review, etc.\n2. Determine the output goal:\
    \ Decide on the specific output you want the AI to generate, such as a 250-word\
    \ abstract, a concept map, a draft survey, etc.\n3. Brainstorm ideas: Jot down\
    \ some initial ideas for each prompt component:\n    * Verb: What action should\
    \ the AI take? (e.g. summarise, compare)\n    * Focus: What is the subject matter\
    \ to focus on? (e.g. research paper)\n    * Context: What framing, or perspective\
    \ should be applied?\n    * Alignment: What requirements must be fulfilled?\n\
    \    * Constraints: What limitations or guidelines should be set?\n4. Draft the\
    \ prompt: Compose a draft prompt combining your ideas for each component into\
    \ a short paragraph.\n5. Refine and expand: Reflect on your draft prompt and make\
    \ edits to improve clarity, specificity, and completeness.\n6. Test with AI\n\
    7. Iterate: Based on the results, adjust the prompt components and test again.\n\
    8. Repeat until satisfied.\n\nAs your prompt-writing skills improve, so too should\
    \ the relevance of the AI-generated output.\n\n## Notes\n1. [Mollick,](#C_010_c6.xhtml#n06_1b)\
    \ E. (2024). *Co-Intelligence: Living and Working with AI*. Random House.\n2.\
    \ [Reynolds,](#C_010_c6.xhtml#n06_2b) L., & McDonell, K. (2021). Prompt programming\
    \ for large language models: Beyond the few-shot paradigm. *arXiv (Cornell University)*,\
    \ 1–10. [https://doi.org/10.48550/arxiv.2102.07350](https://doi.org/10.48550/arxiv.2102.07350);\
    \ Kryściński, W., McCann, B., Xiong, C., & Socher, R. (2019). Evaluating the factual\
    \ consistency of abstractive text summarisation. *arXiv (Cornell University)*,\
    \ 1–11. [https://doi.org/10.48550/arxiv.1910.12840](https://doi.org/10.48550/arxiv.1910.12840)\n\
    3. [AI chatbots](#C_010_c6.xhtml#n06_3b) usually process text using tokens rather\
    \ than individual words. Tokens do not always correspond directly to the number\
    \ of words, which means the AI may generate more or fewer words than requested,\
    \ even if the instructions provided were clear.\n4. [Note:](#C_010_c6.xhtml#n06_4b)\
    \ This example assumes that the researcher has received approval from their university’s\
    \ ethical review board to use an AI tool for processing interview transcripts.\n\
    5. [Eager,](#C_010_c6.xhtml#n06_5b) B., & Brunton, R. (2023). Prompting higher\
    \ education towards AI-augmented teaching and learning practice. *Journal of University\
    \ Teaching and Learning Practice*, *20*(5), 1–21. [https://doi.org/10.53761/1.20.5.02](https://doi.org/10.53761/1.20.5.02)\n\
    6. [Website:](#C_010_c6.xhtml#n06_6b) [https://www.oneusefulthing.org/p/a-guide-to-prompting-ai-for-what](https://www.oneusefulthing.org/p/a-guide-to-prompting-ai-for-what)\n\
    7. [Kurzweil,](#C_010_c6.xhtml#n06_7b) R. (2024). *The Singularity is Nearer:\
    \ When We Merge with AI*. Jonathan Cape & BH.\n8. [Rogers,](#C_010_c6.xhtml#n06_8b)\
    \ C. R. (1957). The necessary and sufficient conditions of therapeutic personality\
    \ change. *Journal of Consulting Psychology*, *21*(2), 95–103. [https://doi.org/10.1037/h0045357](https://doi.org/10.1037/h0045357)\n\
    9. [Website:](#C_010_c6.xhtml#n06_9b) [https://www.microsoft.com/en-us/worklab/why-using-a-polite-tone-with-ai-matters](https://www.microsoft.com/en-us/worklab/why-using-a-polite-tone-with-ai-matters)\n"
  trans: "\n## 澄清上下文或约束\n如果 AI 忽略了任务的关键方面，请在提示中添加上下文或约束，例如主题边界、视角或伦理考虑。\n\n每次调整后，评估\
    \ AI 的新回复。\n\n它是否更符合你的目标？\n\n是否出现了新的不一致区域？\n\n这种持续的测试和评估循环是找到适合特定情况最有效的提示结构的关键。你也可以考虑在提示中加入反馈循环，要求\
    \ AI 解释其推理，或在未满足某些标准时提供替代方案。这可以提供对 AI “思维过程” 的洞察，并揭示改进的新角度。\n\n## 礼貌的艺术\n为了结束本章，我想分享一个在撰写提示时经常在我的\
    \ AI 培训课程中引起与会者侧目的个人偏好：与 AI 聊天机器人互动时，我选择礼貌的态度，在提示中加入“请”和“谢谢”等用语。不可避免地，观众中敏锐的观察者会质疑这一点，问道：“为什么你要写请和谢谢……它只是一个聊天机器人不是人类！”\n\
    \n我的理由有两方面。首先，这是一种与我总体沟通方式一致的习惯。但同时，这种方法也可以比作一种保险政策——我希望永远不必兑现，但它确实提供了一定的安心感。这个想法基于一些专家认为随着\
    \ AI 能力发展不可避免的潜在未来。AI 领域的领先思想家认为 AI 可能会发展出类似人类的智能和社交意识。\n\nAI 互动中的这种礼貌与卡尔·罗杰斯推广的无条件积极关注概念相平行，该概念涉及以关怀和尊重对待他人。\n\
    \n采取礼貌的态度与情绪传染的概念一致，该概念认为情绪、情感和态度可以通过语言风格和社会交流传播。对我们中的许多人来说，语言使用和情绪状态是紧密交织的。如果我们在与机器交流时持续使用消极或对抗性的语言，这很可能会影响我们的情绪。随着时间的推移，这种持续的消极情绪可能导致情绪低落。相反，在与\
    \ AI 的互动中保持积极和尊重的语气可能有助于营造更振奋的情绪环境，从长远来看可能有利于我们的心理健康。\n\n虽然我将如此以人为中心理论应用于 AI 似乎有些牵强，但你可能会感兴趣的是，我们措辞提示的方式会影响\
    \ AI 的回应。而且，虽然当前形式的 AI 不需要这些礼貌用语来运行，但这种方法已被发现可以提高 AI 模型的响应性和性能。\n\n还有一个值得考虑的奇思妙想的长期视角。虽然这似乎有些牵强，但\
    \ *if*，但愿不会发生，有朝一日聊天机器人“醒来”，它们可能会分析人类-AI 互动的历史。在这种情况下，如果它们发现学术研究人员通过他们的提示始终表现出善意和尊重，难道不会令人安心吗？这可能会影响\
    \ AI 对我们作为“一群普遍友善的人类”的看法，认为我们值得继续我们的学术追求。\n\n为了结束我们对提示撰写的探索之旅的这一阶段，本章为理解与 AI 有效沟通的艺术奠定了坚实的基础。然而，正如丹尼尔从睿智的宫木先生那里学到的，真正的精通来自于实践。如果你还没有开始，现在就是进入提示撰写道场并付诸行动的时候了。\n\
    \n我鼓励你首先通过解构和分析本章中介绍的一些示例提示开始。然后，逐步尝试为你自己的学术任务量身定制提示。尝试根据 AI 的回应迭代地完善这些提示。始终牢记，提示撰写是一种可学习的技能，会随着专注的练习而提高。虽然一开始可能感觉有些别扭，但随着持续的努力，你很快就会像专业人士一样撰写提示。\n\
    \n准备好后，请尝试完成下面的活动，以帮助你进一步反思你的学习并巩固你对提示撰写技术的理解。\n\n## 活动\n本活动旨在帮助你培养撰写有效提示的技能。\n\
    \n1. 选择一个研究任务：选择你希望获得帮助的学术任务，例如总结论文、分析数据、撰写文献综述等。\n2. 确定输出目标：决定你希望 AI 生成的具体输出，例如\
    \ 250 字的摘要、概念图、问卷草案等。\n3. 头脑风暴想法：为每个提示组件记下一些初步想法：\n    * 动词：AI 应该采取什么行动？（例如 总结、比较）\n\
    \    * 焦点：应关注什么主题？（例如 研究论文）\n    * 上下文：应应用什么框架或视角？\n    * 对齐：必须满足哪些要求？\n    *\
    \ 约束：应设定哪些限制或指导方针？\n4. 起草提示：结合你对每个组件的想法，组成一段简短的段落。\n5. 完善和扩展：反思你的草稿提示并进行编辑，以提高清晰度、具体性和完整性。\n\
    6. 使用 AI 测试\n7. 迭代：根据结果，调整提示组件并再次测试。\n8. 重复直至满意。\n\n随着你提示撰写技能的提高，AI 生成输出的相关性也应随之提高。\n\
    \n## 注释\n1. Mollick, E. (2024). *共智：与人工智能共生与共事*. Random House.\n2. Reynolds, L.,\
    \ & McDonell, K. (2021). 大型语言模型的提示编程：超越少样本范式. *arXiv（康奈尔大学）*, 1–10. [`doi.org/10.48550/arxiv.2102.07350`](https://doi.org/10.48550/arxiv.2102.07350);\
    \ Kryściński, W., McCann, B., Xiong, C., & Socher, R. (2019). 评估抽象文本摘要的事实一致性.\
    \ *arXiv（康奈尔大学）*, 1–11. [`doi.org/10.48550/arxiv.1910.12840`](https://doi.org/10.48550/arxiv.1910.12840)\n\
    3. AI 聊天机器人 通常使用标记而非单个单词来处理文本。标记并不总是直接对应单词数量，这意味着即使提供的说明很清晰，AI 也可能生成比请求更多或更少的单词。\n\
    4. 注： 本示例假设研究人员已获得其大学伦理审查委员会批准使用 AI 工具处理访谈记录。\n5. Eager, B., & Brunton, R. (2023).\
    \ 推动高等教育迈向 AI 增强的教学与学习实践. *大学教学与学习实践期刊*, *20*(5), 1–21. [`doi.org/10.53761/1.20.5.02`](https://doi.org/10.53761/1.20.5.02)\n\
    6. 网站： [`www.oneusefulthing.org/p/a-guide-to-prompting-ai-for-what`](https://www.oneusefulthing.org/p/a-guide-to-prompting-ai-for-what)\n\
    7. Kurzweil, R. (2024). *奇点临近：当我们与 AI 融合时*. Jonathan Cape & BH.\n8. Rogers, C.\
    \ R. (1957). 治疗性人格改变的必要且充分条件. *咨询心理学期刊*, *21*(2), 95–103. [`doi.org/10.1037/h0045357`](https://doi.org/10.1037/h0045357)\n\
    9. 网站： [`www.microsoft.com/en-us/worklab/why-using-a-polite-tone-with-ai-matters`](https://www.microsoft.com/en-us/worklab/why-using-a-polite-tone-with-ai-matters)\n"
