    在下一章中，我们将拆解提示写作的原则和技巧，为你提供打造精确且有效的“AI 咒语”的技能。但在我们深入探讨提示的实践之前，让我们继续探索人工智能的历史，重点关注人类-人工智能交互方法的演变，通过追溯提示本身的发展。


    ## 提示工程


    提示工程是设计和完善指令或问题的战略性过程，以从人工智能模型中引出特定、期望的响应。


    要充分理解提示工程，了解我们与人工智能的交互如何演变是有帮助的。如前所述，早期的 AI 系统需要精确的、通常类似代码的命令。相比之下，今天的模型可以解释和响应自然语言，使其更易于访问，但对有效沟通的要求也更细致。在这些进步中，零样本和少样本学习的概念


    * Zero-shot learning: 这指的是人工智能模型理解和执行其从未明确训练过的任务的能力。这种能力可以被视为革命性的，因为它使人工智能系统能够将从一个领域学到的知识应用于不熟悉的任务或类别，而无需额外的训练数据。从实践角度来看，零样本学习允许研究人员就小众主题查询人工智能模型，或生成模型训练数据中不一定包含的风格内容。

    * Few-shot learning: 这在零样本学习的基础上更进一步，使人工智能模型能够仅从几个示例中学习新任务或理解新概念。少样本学习在学术研究和数据稀缺较为常见的专业领域特别有用。通过在提示中提供几个示例，用户可以引导人工智能以特定、期望的方式生成内容或分析数据。

    * Continuous learning and adaptation: 在零样本和少样本学习之外，另一个重要趋势是向持续学习模型的转变。这些人工智能系统旨在随着时间的推移学习和适应新数据或交互，逐渐提高性能并扩展知识库。持续学习模型为与人工智能进行更个性化、更具上下文感知的交互提供了潜力。


    要理解提示工程的复杂性，理解人工智能模型底层自然语言处理机制至关重要，


    * Natural Language Understanding: NLU 是 NLP 的一个子集，处理机器阅读理解。它使人工智能模型能够以捕捉含义、情感和意图的方式理解和解释人类语言。当你向人工智能系统提供提示时，NLU
    组件会将文本分解为可理解的片段，分析句法结构（语法和句子结构）和语义信息（即含义）。人工智能模型利用这一分析来把握你呈现的上下文、问题或任务。它识别诸如主题、期望的操作（例如总结、分析）以及提示中嵌入的任何特定约束或要求等关键要素。这种理解对于生成与用户意图一致的响应至关重要。

    * Natural Language Generation: 一旦人工智能通过 NLU 理解了提示，它就会进入 NLG，在学术写作的背景下，这可以被视为从数据生成文本。这一过程涉及选择合适的词语、构建句子并组织连贯的段落以满足提示的要求。NLG
    不仅仅是把词语串联起来；它要求模型运用创造力、推理，有时甚至需要一定程度的同理心，以产生不仅相关而且引人入胜、类人化的响应。


    提示工程的魔力在于 NLU 和 NLG 之间无缝的相互作用。有效的提示旨在利用这种相互作用，引导人工智能通过 NLU 阶段以确保其正确理解手头的任务，然后通过
    NLG 阶段产生量身定制、连贯的响应。例如，一个精心设计的提示要求人工智能“总结以下文本的关键点，采用项目符号格式”明确指示 NLU 组件专注于信息的提取和浓缩。与此同时，NLG
    组件被引导将输出格式化为项目符号列表，遵循指令简洁直接的特性。理解 NLU 和 NLG 在处理提示中的作用有助于我们认识到清晰性、具体性和上下文在提示工程中的重要性。


    随着人工智能能力的不断进步，提示工程在学术界的重要性无疑会增长。这意味着有效与人工智能系统沟通和引导的能力将变得与其他任何研究技能一样重要。虽然学习永远不晚，但我强烈主张尽早开始这段旅程。研究人员越早将这些技能整合到工作流程中，就越能充分利用人工智能的全部潜力并加速其研究工作流程。


    考虑到这一点，我们现在准备超越迄今为止探索的历史背景和理论基础。在下一章中，我们将转向提示写作的实践艺术，探索具体的技巧、最佳实践和真实案例，希望能帮助你打造有效的提示，并成为一名高效的人工智能驱动的学者。


    ## 注释


    1. OpenAI. (2023, September 25). *ChatGPT 现在可以看见、听见和说话。* [`openai.com/blog/chatgpt-can-now-see-hear-and-speak`](https://openai.com/blog/chatgpt-can-now-see-hear-and-speak)

    2. Weizenbaum, J. (1966). ELIZA——用于研究人与机器之间自然语言交流的计算机程序。 *Communications of the
    ACM*, *9*(1), 36–45. [`doi.org/10.1145/365153.365168`](https://doi.org/10.1145/365153.365168)

    3. Winograd, T. (1971). *作为理解自然语言的计算机程序中数据的表示的程序*. [`apps.dtic.mil/sti/pdfs/AD0721399.pdf`](https://apps.dtic.mil/sti/pdfs/AD0721399.pdf);
    Winograd, T. (1980). 理解语言意味着什么？ *Cognitive Science, 4*(3), 209–241.

    4. Buchanan, B. G., & Smith, R. G. (1988). 专家系统的基础。 *Annual Review of Computer
    Science*, *3*(1), 23–58. [`doi.org/10.1146/annurev.cs.03.060188.000323`](https://doi.org/10.1146/annurev.cs.03.060188.000323)

    5. Gaschnig, J., Klahr, P., Pople, H., Shortliffe, E., & Terry, A. (1983). 专家系统的评估：问题与案例研究。
    *Building Expert Systems*, *1*, 241–278.

    6. Shortliffe, E. H. (1977, October 5). Mycin：应用于传染病的基于知识的计算机程序。 In *会议论文集* *医疗保健计算机应用年会*
    (pp. 66–69). 美国医学信息学协会。

    7. Aron, J. (2011). 苹果的新语音助手 Siri 有多创新？ *New Scientist*, *212*(2836), 24. [`doi.org/10.1016/s0262–4079(11)62647-x`](https://doi.org/10.1016/s0262–4079\(11\)62647-x)

    8. Ferrucci, D. A. (2012). “这就是沃森”导论。 *IBM Journal of Research and Development*,
    *56*(3.4), 1–1.

    9. O’Leary, D. E. (2019). GOOGLE 的 Duplex：假装成为人类。 *Intelligent Systems in Accounting,
    Finance and Management*, *26*(1), 46–53. [`doi.org/10.1002/isaf.1443`](https://doi.org/10.1002/isaf.1443)


