    ## F


    ### Feedback loop

    The iterative process of providing input to an AI system, receiving output, and
    then refining the input based on the output. This cycle can help in improving
    the relevance and accuracy of AI-generated content.


    ### Few-shot learning

    An AI capability where a model can make accurate predictions based on only a few
    examples. This can be useful when working with limited datasets or when trying
    to apply AI tools to niche research areas.


    ### Fine-tuning

    The process of adapting a pre-trained AI model to a specific task or domain. For
    academics, this could involve customising a general-purpose AI writing assistant
    to better understand and generate content in their specific field of study.


    ## G


    ### Generative AI (GenAI)

    AI systems capable of creating new content, such as text, images, or code. Generative
    AI can assist with tasks like drafting literature reviews, generating research
    questions, or creating visual aids for presentations.


    ### GPT (Generative Pre-trained Transformer)

    A type of large language model that uses deep learning to produce human-like text.
    GPT models, such as those powering ChatGPT, are increasingly used by academics
    for tasks like writing assistance, brainstorming, and summarisation.


    ### GPT-3 (GPT-4, etc.)

    Specific iterations of the GPT language model developed by OpenAI. GPT-3 was groundbreaking
    at the time. GPT-4 was its successor. These models power various AI tools used
    in academic workflows, such as writing assistants, language translation, and text
    summarisation. While powerful, academics should be aware of their limitations,
    including potential biases and the need to fact-check outputs. As new versions
    are released, they are likely to offer enhanced capabilities but may also present
    new challenges for academics.


    ## H


    ### Hallucinations

    Instances where AI models generate plausible-sounding but factually incorrect
    or nonsensical information. For academics using AI tools, it’s crucial to be aware
    of this limitation and to verify AI-generated content.


    ### Hybrid intelligence

    The combination of human and artificial intelligence to solve complex problems.
    In academic workflows, this often involves using AI tools to augment human capabilities,
    such as using AI for initial data analysis before applying human expertise for
    interpretation.


    ### Human-in-the-loop

    An approach where human input (intervention and oversight) is incorporated into
    AI systems to improve decision-making and outcomes.


    ## I


    ### Intelligent machines

    Systems or devices that mimic human intelligence, capable of learning, problem-solving,
    and adapting to new situations. Intelligent machines can range from AI writing
    assistants to complex research tools that analyse data.


    ### Information retrieval

    The process of obtaining relevant information from a large collection of data.
    AI-powered information retrieval systems can significantly enhance academic research
    by quickly identifying and extracting information from vast databases of scholarly
    literature.


    ### Iterative prompting

    The process of refining and adjusting prompts given to AI systems to improve the
    quality and relevance of outputs.


    ### Interpretability

    The degree to which an AI system’s decision-making process can be understood by
    humans. For academics using AI tools, interpretability is crucial for understanding
    the reliability and potential biases of AI-generated outputs.


    ### Implicit bias in AI

    Unintended prejudices that can be present in AI systems, often reflecting biases
    in training data or algorithm design. Academics should be aware of potential implicit
    biases when using AI tools for research or analysis to ensure fair and accurate
    results.


    ## K


    ### Knowledge base

    A structured collection of information that an AI system uses to generate responses
    or make decisions.


    ### Keyword extraction

    An AI-powered process that automatically identifies and extracts the most important
    or frequently used words or phrases from a text. This functionality can be particularly
    useful for academics when summarising research papers or identifying key themes
    in large bodies of literature.


    ### Knowledge graph

    A network representation of relationships between entities (e.g. concepts, people,
    events) in a knowledge domain. AI-powered knowledge graphs can help researchers
    visualise connections within their field of study, potentially revealing new research
    directions or unexplored relationships between concepts.


    ## L


    ### Large language models (LLMs)

    Advanced AI systems trained on vast amounts of text data, capable of understanding
    and generating human-like text. LLMs, such as GPT-3 and GPT-4, represent the AI
    technology underpinning many AI writing assistants and research tools used in
    academia.


    ### Large neural network models

    Complex artificial neural networks with many layers and parameters, designed to
    process and analyse large amounts of data. These models underpin various AI tools
    used for tasks such as natural language processing, image recognition, and data
    analysis.


    ## M


    ### Machine learning

    A subset of AI that focuses on the development of algorithms and statistical models
    that enable computer systems to improve their performance on a specific task through
    experience. ML is used in various tools for data analysis, pattern recognition,
    and predictive modelling across disciplines.


    ### Model(s)

    In AI, a model refers to the computational representation of a system or process,
    trained on data to make predictions or decisions.


    ### Multi-modal

    AI systems that can process and integrate information from multiple types of input
    (e.g. text, images, audio). Multi-modal AI tools can be particularly useful for
    researchers working with diverse data types or in interdisciplinary fields.


    ## N


    ### Narrow AI

    Also known as “weak AI” or ‘specialised AI’, narrow AI refers to artificial intelligence
    systems designed to perform specific tasks within a limited domain. Unlike the
    sci-fi dream of general AI that can match human-level cognition across all areas,
    narrow AI excels at particular functions but lacks broader capabilities. Think
    of it as a highly skilled specialist rather than a jack-of-all-trades.


    ### Natural language

