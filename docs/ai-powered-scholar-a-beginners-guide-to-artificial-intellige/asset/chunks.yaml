    # 8 Ideating with AI chatbots


    DOI: [10.4324/9781032665276-8](https://doi.org/10.4324/9781032665276-8)


    ## Introduction


    The process of generating novel research ideas is a critical yet often challenging
    aspect of academic work. However, as AI-empowered scholars armed with our toolkit
    of prompt writing skills learnt in earlier chapters, we now have powerful AI solutions
    to meet this challenge.


    In this chapter, we’ll explore how to leverage AI systems as collaborative partners
    in the brainstorming process, potentially uncovering innovative concepts and unexpected
    connections. We’ll begin by examining the concept of ideation and its significance
    in the research process. Then, we’ll walk through practical strategies for effectively
    employing AI tools to generate and refine our research ideas. When advancing through
    the chapter, keep in mind that the aim of AI-assisted ideation is not to supplant
    human expertise or creativity, but rather to enhance and expand our ideation capabilities.
    As such, consider AI not as a replacement, but as a catalyst for stimulating new
    thoughts and facilitating exploration in your field.


    ## Ideation for academic research


    At its core, ideation is the process of conceiving, developing, and communicating
    original ideas. It’s the “fuzzy front end” of innovation,


    Let’s consider some of the ways in which AI can be leveraged in the ideation process:


    *   Accelerated ideation cycles: AI systems can rapidly evaluate our ideas against
    various constraints such as feasibility, ethics, and potential impact. This helps
    us maintain creative momentum by quickly filtering out impractical notions, allowing
    us to focus our energy on the most promising directions.


    *   Transdisciplinary perspectives: AI chatbots, trained on vast and diverse datasets,
    offer us access to a broad range of academic and cultural knowledge. This enables
    them to make unique connections and offers fresh perspectives that offer an interdisciplinary
    research lens that our singular human experience may be lacking.


    *   Tireless thought partner: Imagine having a colleague available 24/7 to bounce
    ideas off and refine concepts. AI systems can engage in endless brainstorming
    sessions without fatigue, providing consistent support and extending our capacity
    for creative thinking.


    However, as mentioned before, it’s crucial to remember that AI is not here to
    replace our creativity, but to enhance it.


    Just as previous technologies like the printing press and the computer have expanded
    our cognitive abilities, AI offers a new dimension of collaboration. It augments
    our imaginative capabilities, helping us realise ideas that were once confined
    to the limits of our minds. The true magic happens when we combine AI’s capabilities
    with our own expertise and intuition.


    ## Guiding principles for AI-assisted ideation


    As we begin the process of AI-assisted ideation, it’s crucial to recognise that
    interacting with conversational AI requires a shift from our usual communication
    patterns. We’ve spent our lives developing communication skills for human interaction,
    relying on contextual cues like facial expressions and body language – elements
    absent in our textual exchanges with AI.  Moreover, our tendency for digressive
    tangents and assumptions of shared understanding can hinder our ability to convey
    our intents unambiguously to an AI system.


    To set the stage for productive ideation sessions using AI, let’s consider the
    following guiding principles:


    1.  Establish clear roles: Position yourself as the leader and the AI as a supportive
    assistant. This sets the tone for a productive collaboration where you guide the
    direction of the brainstorming. Remember, you’re the expert in your field – the
    AI is here to support and augment your thinking, not to lead the process!


    2.  Seed discussions with examples: Provide the AI with concrete examples to set
    the scope and guide its suggestions. This helps focus the AI’s output on relevant
    and productive areas. For instance, if you’re brainstorming research methods,
    offer examples of methods you’ve used or considered to give the AI a starting
    point.'
