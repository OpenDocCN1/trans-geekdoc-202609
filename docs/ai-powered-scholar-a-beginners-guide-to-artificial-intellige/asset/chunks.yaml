    \ Science & Business Media.\n11. LeCun, Y., Bengio, Y., & Hinton, G. E. (2015).\
    \ 深度学习. *Nature*, *521*(7553), 436–444. [`doi.org/10.1038/nature14539`](https://doi.org/10.1038/nature14539)\n\
    12. Alzubaidi, L., Zhang, J., Humaidi, A. J., Al-Dujaili, A. Q., Duan, Y., Al-Shamma,\
    \ O., Santamaría, J., Fadhel, M. A., Al-Amidie, M., & Farhan, L. (2021). 深度学习综述：概念、CNN\
    \ 架构、挑战、应用、未来方向. *Journal of Big Data*, *8*(53), 1–74. [`doi.org/10.1186/s40537-021-00444-8`](https://doi.org/10.1186/s40537-021-00444-8)\n\
    13. Silver, D., Schrittwieser, J., Simonyan, K., Antonoglou, I., Huang, A., Guez,\
    \ A., Hubert, T., Baker, L. R., Lai, M., Bolton, A., Chen, Y., Lillicrap, T. P.,\
