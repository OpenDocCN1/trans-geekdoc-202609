- raw: 'Advancing towards more fluid conversational exchanges required better representing
    linguistic knowledge and reasoning capabilities. Statistical approaches sought
    to model language use patterns across corpora (i.e. large and structured sets
    of texts, which serve as a basis for linguistic analysis) but dealt poorly with
    longer-range coherence. Luckily, the rise of machine learning and neural networks
    in the 1990s brought new horizons. Given enough examples of conversational transcripts,
    AI systems began to “understand” complex associations between utterances, their
    meanings, and could thus generate more appropriate responses to user queries.


    ### The 1990s: machine learning and neural networks


    The rise of machine learning and neural networks in the 1990s opened new horizons
    for conversational AI. Machine learning is a branch of AI that allows computers
    to learn from data without being explicitly programmed. Neural networks, inspired
    by the human brain’s structure, are a type of machine learning model consisting
    of interconnected nodes (like neurons) that can recognise patterns in data. These
    approaches allowed AI systems to glean complex associations between utterances,
    their meanings, and appropriate responses from large datasets of conversational
    transcripts.


    This period of AI development marked a shift towards more adaptive and context-aware
    dialogue systems, closer to what we’re familiar with when using today’s AI tools.
    It also provided the capabilities for us researchers to perform tasks like summarising
    academic papers, for which I will be forever grateful!


    These early experiments with neural networks for language tasks showed promise
    and paved the way for future advancements. For example, Hochreiter and Schmidhuber
    introduced Long Short-Term Memory (LSTM) networks, a type of recurrent neural
    network. Recurrent neural networks are designed to work with sequences of data,
    making them particularly suited for language tasks. LSTMs are capable of learning
    long-term dependencies in sequential data, which means they can remember important
    information for long periods as they process text. This innovation would later
    prove crucial for improving the coherence of AI-generated text over longer passages,
    allowing AI to maintain context and produce more natural-sounding language.


    The decade also saw the development of statistical methods for natural language
    processing (NLP), which is the field concerned with how computers understand and
    generate human language. NLP techniques allowed for more robust language modelling,
    involving predicting the likelihood of a sequence of words. While perhaps not
    as flashy as neural networks, it laid important groundwork for future advancements
    in language understanding by providing ways to represent and analyse the structure
    of language mathematically.


    ### The 2010s: practical conversational assistants and deep learning


    The 2010s saw the emergence of practical conversational assistants and significant
    advancements in deep learning techniques. For example, in 2011, Apple introduced
    Siri, demonstrating the ability to handle natural language commands for everyday
    tasks like setting reminders or making phone calls.


    Meanwhile, IBM’s Watson showcased advanced question-answering capabilities by
    defeating human champions on the game show Jeopardy!


    The decade also saw rapid improvements in machine translation and other specialised
    conversational domains. Google’s Neural Machine Translation system, introduced
    in 2016, significantly improved translation quality by considering entire sentences
    rather than translating phrases in isolation. Google Duplex further pushed boundaries
    by conducting lifelike phone conversations to complete tasks like restaurant reservations.


    The development of transformer models, introduced in the now famous 2017 paper
    “Attention Is All You Need”,


    The impact of transformer models on AI language capabilities upped the AI game.
    They paved the way for more advanced language models like Bidirectional Encoder
    Representations from Transformers (BERT) and Generative Pre-trained Transformer
    (GPT), which set new benchmarks in tasks ranging from translation to question-answering
    to text generation. These models form the foundation of many AI language tools
    we use today, including the chatbots that are helping me to rephrase many of the
    sentences in this book to hopefully improve your reading experience.


    Transformer models marked a turning point in AI’s ability to process and generate
    human language, bringing us closer to the long-standing goal of machines that
    can truly understand (in as far as a machine can be considered to “understand”)
    and communicate in natural language.


    ### 2020 and beyond: large language models


    The introduction of ChatGPT in November 2022 marked a pivotal moment in conversational
    AI. Developed by OpenAI, ChatGPT, (you’ll remember that “GPT” stands for “generative
    pre-trained transformer”) exhibited unprecedented natural language capabilities
    and generation across diverse topics and contexts.


    ChatGPT’s impact reverberated across various sectors, particularly in education.
    Its ability to generate coherent essays, solve complex problems, and provide detailed
    explanations prompted urgent reconsideration of established practices and policies
    in academic institutions worldwide.


    As we approach the mid-2020s, projects like Google’s Language Model for Dialogue
    Applications


    Overall, the trajectory from ELIZA to ChatGPT represents more than just technological
    progress; it reflects a deepening exploration of the nature of intelligence, consciousness,
    and communication. As these systems grow more sophisticated, maintaining a critical
    perspective on their capabilities and limitations remains crucial.


    In the words of science fiction writer Arthur C. Clarke,


    As these systems become increasingly integrated into our daily lives, understanding
    their underlying principles, capabilities, and limitations becomes not just an
    academic exercise, but a societal imperative. The future of conversational AI
    promises continued innovation, but also demands ongoing ethical reflection and
    responsible development to ensure that these powerful tools benefit humanity as
    a whole. And, while the capabilities of modern AI might seem magical, it’s important
    to remember that beneath the surface, these systems are fundamentally based on
    statistical inference and pattern recognition, not mystical powers. As we discussed
    in the previous chapter, the quality of our interactions with AI chatbots, at
    least in their current form – where we tend to interact with AI via our keyboards
    rather than having them embedded in our brains – largely depends on the quality
    of our inputs (i.e. prompts).


    Prompts remain the primary interface between humans and AI chatbots, serving as
    the bridge that translates our intentions into actionable instructions. Mastering
    the art of crafting well-structured prompts also remains crucial for maximising
    the potential of AI tools to help us achieve our academic tasks.


    To draw an analogy from the world of Harry Potter, consider the difference between
    Ron Weasley’s often misfiring spells and Hermione Granger’s precisely executed
    incantations. Ron’s haphazard wand-waving, despite having access to magical power,
    frequently leads to unintended results. Hermione, on the other hand, (who, I would
    argue, is actually the star of the show and who deserves the global franchise
    to be retitled after) achieves remarkable feats through her meticulous study and
    careful application of magical techniques.


    In the context of AI, our “wand” is the language we use to communicate with these
    systems, and our “spells” are the prompts we craft. Just as Hermione’s success
    stems from her deep understanding of magical principles, our effectiveness in
    using AI tools depends on our skill in formulating clear, purposeful instructions.'
