    We’ll begin by situating our journey within the broader historical context of
    AI advancement. This chapter provides a concise yet comprehensive overview of
    AI’s evolution, helping you understand how we arrived at where we find ourselves
    today. You’ll gain insights into the key milestones and paradigm shifts that have
    shaped AI’s trajectory, setting the stage for its current and future applications
    in academia.


    * [Chapter 3](#C_007_c3.xhtml): Communicating effectively with AI

    Communication is key in any partnership, and your relationship with AI tools is
    no exception. This chapter unpacks the nuances of interacting with large language
    models (LLMs). Through practical examples and exercises, you’ll begin your journey
    towards learning how to craft clear, precise instructions to achieve optimal results.
    We’ll explore the importance of context, specificity, and natural language in
    AI interactions, helping you develop the linguistic skills necessary for effective
    collaboration with AI research assistants.


    * [Chapter 4](#C_008_c4.xhtml): Designing your AI research assistant

    Imagine having a research assistant tailored precisely to your needs. This chapter
    shows you how to make that a reality by assigning specific roles to AI systems.
    You’ll discover how to shape AI into your custom research partner, by defining
    its expertise, background, and personality traits. This approach will allow you
    to leverage AI’s versatility across various research tasks, from literature reviews
    to editing your academic writing and beyond.


    * [Chapter 5](#C_009_c5.xhtml): A brief history of conversational AI

    Building on the historical context of AI development, this chapter narrows in
    on the evolution of “conversational AI”. You’ll trace the development from early
    rule-based systems to today’s sophisticated AI chatbots. This journey through
    time will help you understand the capabilities and limitations of current-day
    AI, setting realistic expectations for your interactions with AI tools.


    * [Chapter 6](#C_010_c6.xhtml): Prompting AI for effective communication

    At the heart of effective AI interaction lies the art of prompt engineering. This
    crucial chapter provides a deep dive into writing text-based instructions that
    guide AI tools towards generating relevant, high-quality content aligned with
    your research goals. You’ll learn strategies for structuring prompts, refining
    outputs, and iterating for optimal results. By mastering these skills, you’ll
    be able to achieve maximum value from your AI collaborations.


    * [Chapter 7](#C_011_c7.xhtml): Towards responsible use of AI tools

    In [Chapter 7](#C_011_c7.xhtml), attention turns to addressing key risks associated
    with using AI tools in academic research. It offers several strategies to help
    you mitigate these risks and become a more informed user of AI technologies. By
    exploring these approaches, you’ll be better equipped to navigate potential pitfalls
    and make informed decisions about how to conduct AI-assisted research responsibly
    and effectively.


    * [Chapter 8](#C_012_c8.xhtml): Ideating with AI chatbots

    Learn how to engage in interactive brainstorming sessions with AI systems to uncover
    novel connections and generate innovative ideas. This chapter provides guiding
    principles for productive human-AI collaboration and outlines a practical process
    for AI-augmented ideation, illustrated through a case study. You’ll be introduced
    to various creative thinking techniques that can be employed in conjunction with
    AI chatbots to stimulate divergent thinking and challenge assumptions, while maintaining
    human agency and critical thinking throughout the process.


    * [Chapter 9](#C_013_c9.xhtml): AI-powered literature search

    This chapter looks at the transformative potential of AI in academic literature
    search, with a particular focus on semantic search capabilities – a method that
    aims to understand the meaning and context of your search queries, rather than
    matching keywords. You’ll learn how AI is changing the way scholars discover relevant
    literature, moving beyond traditional keyword-based methods. Practical strategies
    for effectively leveraging these tools in your research are discussed, along with
    potential pitfalls and ethical considerations. By the end of this chapter, you’ll
    be equipped to integrate AI-powered literature search into your academic workflows,
    enhancing your ability to navigate the ever-expanding sea of scholarly publications.


    * [Chapter 10](#C_014_c10.xhtml): Writing & editing with AI

    This chapter offers practical strategies for leveraging AI in academic writing,
    addressing the common challenge of writer’s block and the intimidating blank page.
    It introduces “blah writing”, a technique for using AI chatbots to transform stream-of-consciousness
    thoughts into coherent narratives. This chapter then explores AI-assisted methods
    for generating document outlines, expanding text for greater depth, and contracting
    text for concision. It also examines the role of AI in editing, providing practical
    guidance on how to transform AI chatbots into 24/7 editing assistants.


    * [Chapter 11](#C_015_c11.xhtml): Bonus chapter

    Here, you’ll find information for unlocking the accompanying online resource and
    access to a bonus chapter. I’d be spoiling the surprise if I told you what the
    chapter was about ;)


    ### Glossary

    Along your journey, you might encounter unfamiliar terms. If so, consult the included
    glossary. It aims to clarify frequently encountered AI terminology and is intended
    as a practical reference, offering clear and concise definitions, rather than
    being an exhaustive list. Think of it as your friendly quick-reference guide,
    providing accessible explanations to help in navigating the integration of AI
    into academic workflows.


    By the time you reach the end, you’ll not only understand how to effectively guide
    AI tools to help you with your research tasks, but you’ll also be able to critically
    evaluate AI’s strengths and limitations and understand the historical trajectory
    of AI development.


    ## Online companion resource

    This book comes with a dynamic online companion resource. Gain access by visiting
    [www.broneager.com/aischolar](http://www.broneager.com/aischolar) and discover:

    * A curated list of AI tools: a comprehensive, regularly updated list of AI tools
    relevant to academic work.

    * Best practices and tips: insights on how to integrate the latest AI advancements
    into your academic workflow.

    * Case studies: real-world examples of how to leverage AI in innovative ways,
    updated as new applications emerge.


    The decision to house specific AI tool recommendations on a companion website
    was made in recognition that AI is advancing at an unprecedented pace. Thus, while
    this book provides you with foundational skills and enduring principles for working
    with AI, the online resource ensures that you have access to current, practical
    information.


    As we navigate this AI-learning journey together, I recognise that collective
    wisdom often surpasses individual knowledge. That’s why I warmly welcome your
    contributions. If you discover valuable resources, develop innovative AI applications
    for academic work, or have insights that could benefit fellow scholars, I encourage
    you to reach out. Your experiences and discoveries could be featured on the companion
    site, helping to enrich our shared learning experience.


    ## Disclosure

    Given that this book is about AI, you’re probably wondering if AI was used in
    its creation. The short answer is yes. Would you have believed me if I’d said
    ‘no’?

