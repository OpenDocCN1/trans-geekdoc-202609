- raw: "If you try this approach, I urge you to think of yourself as both a collaborator\
    \ and a gatekeeper – working with the AI to generate ideas, but carefully filtering\
    \ and refining its output. Remember, the goal is not just to increase your word\
    \ count, but also to enhance the depth, clarity, and overall quality of your work.\n\
    \n## Contracting text\n\nAt the start of a writing project our goal tends to be\
    \ focused on generating *more* words. However, there will likely come a time when\
    \ you also need to cut them back. For example, when you receive a dreaded “desk\
    \ reject” and find out that the next journal on your list of potential homes for\
    \ your paper has a significantly lower maximum word count. AI chatbots can help\
    \ speed up the process by suggesting ways to eliminate redundancies, trim extraneous\
    \ details, and articulate your core message.\n\nHere’s one way you might get the\
    \ job done:\n\n1.  Select the text you want to shorten: First, highlight the paragraph\
    \ or passage you’re focusing on. Then, save it temporarily by copying it. This\
    \ allows you to use it again right away without having to retype it.\n\n2.  Provide\
    \ a clear prompt: Give the AI chatbot a specific instruction for contraction,\
    \ such as “Please suggest ways to eliminate unnecessary details and make this\
    \ passage more concise”, or “Identify any redundant or repetitive phrases that\
    \ could be removed from this paragraph”.\n\n3.  Review and refine: Read through\
    \ the AI’s suggestions and integrate the most relevant and useful contractions\
    \ into your text. Be mindful not to remove any essential information or nuance\
    \ and ensure that your condensed version still effectively communicates your key\
    \ points.\n\nTo demonstrate how this process works in practice, let’s look at\
    \ an example. The following output was generated using Claude, an AI chatbot running\
    \ its 3.5 Sonnet model. Claude generated a result (reproduced below) after being\
    \ provided with the following sample text and prompt:\n\n> Sample text: The researchers\
    \ conducted in-depth, semi-structured interviews with 15 university lecturers\
    \ who had implemented AI-powered adaptive learning systems in their courses. The\
    \ interviews, lasting between 60 and 90 minutes each, were conducted via video\
    \ conferencing software due to COVID-19 restrictions. The interview questions\
    \ focused on the lecturers’ experiences with the AI systems, their perceptions\
    \ of the impact on student learning, and the challenges they faced during implementation.\
    \ All interviews were audio-recorded with participant consent and subsequently\
    \ transcribed verbatim. The researchers then employed a thematic analysis approach,\
    \ following Braun and Clarke’s six-step process, to identify key themes and patterns\
    \ in the data. This involved multiple rounds of coding and theme refinement, with\
    \ regular team meetings to discuss and validate the emerging findings.\n\n> \n\
    \n> Prompt: “Please suggest ways to make this passage more concise by removing\
    \ unnecessary details and streamlining the description of the qualitative research\
    \ process, while maintaining the essential methodological information”.\n\n> \n\
    \n> Contracted text: “Semi-structured interviews were conducted with 15 university\
    \ lecturers who had implemented AI-powered adaptive learning systems. Interviews,\
    \ conducted virtually, explored lecturers’ experiences, perceived impacts on student\
    \ learning, and implementation challenges. Using Braun and Clarke’s thematic analysis\
    \ approach, researchers identified key themes through iterative coding and team\
    \ validation”.\n\nAs with all aspects of AI-assisted writing, it’s important to\
    \ approach these suggestions with a critical eye and with a commitment to maintaining\
    \ your own authorial voice and intent. It’s best to consider the chatbot’s recommendations\
    \ as a starting point for refinement, ensuring that you always make the final\
    \ decisions about what to include and what to cut.\n\n## Editing with AI\n\nBetween\
    \ teaching responsibilities, conducting research, analysing data, and juggling\
    \ university admin, having the headspace to conduct a thorough edit of your work\
    \ can be a challenge. For those fortunate enough to have access to a professional\
    \ editor, willing colleague, caring supervisor, or generous friend, the benefit\
    \ of having a skilled human look over your work can’t be overstated. Unfortunately,\
    \ there are many barriers to acquiring editorial assistance. And while AI tools\
    \ are currently far from perfect compared to a professional editor, they do offer\
    \ some benefits worth considering, including:\n\n1.  Round-the-clock availability:\
    \ AI chatbots don’t keep office hours. They’re ready to assist you whenever you\
    \ need.\n\n2.  Instant feedback: With an AI chatbot, you don’t have to wait days\
    \ or weeks for feedback on your writing. Suggestions are provided in real time,\
    \ allowing you to iterate and improve your work according to your schedule.\n\n\
    3.  Cost-effective solution: Human editors can cost thousands of dollars, especially\
    \ when tasked with editing lengthy academic documents. AI chatbots offer a relatively\
    \ affordable alternative, at least in terms of your out-of-pocket expenses.\n\n\
    4.  A “safe space”: Sometimes we’re hesitant to share our writing with others\
    \ for fear of judgement. Chatbots can offer a sounding board without that fear\
    \ attached. Additionally, they are typically trained to offer supportive advice,\
    \ unless, of course, you decide to prompt your chatbot to “provide critiques in\
    \ the style of a grumpy academic at a conference, poised to unleash scathing comments\
    \ during the Q&A”.\n\nTo use an AI chatbot in the editing process, you will (obviously)\
    \ need some text that requires editing. It could be as small as a sentence, or\
    \ as large as thesis. When you’ve got some words to work with, here’s an example\
    \ workflow for completing the process:\n\n1.  Choose your AI platform: For longer\
    \ edits, select a platform that has document upload capabilities. This feature\
    \ allows you to input larger portions of text or entire documents for analysis.\
    \ Importantly – ensure that the platform you choose complies with your institution’s\
    \ data protection and privacy policies.\n\n2.  Prepare your document: Before uploading,\
    \ review your document to ensure it doesn’t contain any sensitive or confidential\
    \ information.\n\n3.  Upload the document: Follow the platform’s instructions\
    \ for uploading your document. This usually involves selecting the file from your\
    \ computer (typically by clicking on a paperclip icon), or cloud storage provider,\
    \ or copying and pasting your text into a designated area.\n\n4.  Prompt the chatbot:\
    \ This is where your skills in crafting effective prompts (if you need a refresh,\
    \ see [Chapter 6](#C_010_c6.xhtml)) come into play. Be specific about what kind\
    \ of editing assistance you need. For example: “Please review this text for clarity\
    \ and coherence. Suggest improvements in sentence structure, identify any awkward\
    \ phrasing, and highlight areas where the argument could be strengthened. Pay\
    \ particular attention to the flow between paragraphs and the use of academic\
    \ language”.\n\n5.  Review the analysis: Carefully read through the AI’s suggestions.\
    \ While AI can provide valuable insights, it’s not infallible.\n\nLastly, always\
    \ use your critical thinking skills to evaluate each suggestion, considering:\n\
    \n*   Does the suggested change improve clarity or flow?\n\n*   Does it maintain\
    \ your intended meaning?\n\n*   Is it consistent with your voice and style?\n\n\
    As you become more comfortable with AI-assisted editing, you might find it particularly\
    \ useful for tasks such as:\n\n*   Checking for consistency in terminology and\
    \ style\n\n*   Identifying overused words or phrases\n\n*   Suggesting more precise\
    \ vocabulary\n\n*   Highlighting areas where citations might be needed\n\n*  \
    \ Improving the overall structure and flow of your argument\n\nIt’s important\
    \ to recognise that what’s been covered in this chapter, and the book more broadly,\
    \ is just the tip of the iceberg when it comes to leveraging AI in academic tasks."
