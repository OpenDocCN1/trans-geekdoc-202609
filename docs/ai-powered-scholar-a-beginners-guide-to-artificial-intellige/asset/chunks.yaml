    \ advice to students. Again, case studies of institutions that have successfully\
    \ implemented such solutions could yield valuable insights.\n\n*   Dr. X: Great!\
    \ I like the idea of focusing on AI-powered chatbots for academic advising in\
    \ the business school context.\n\n### Step 4: Develop details\n\nDr. X worked\
    \ with the AI chatbot to flesh out the details of her chosen research project:\n\
    \n*   Dr. X: Let’s focus on “AI-powered chatbots for academic advising in business\
    \ schools”. Please develop a more detailed plan for the study. Maybe a qualitative\
    \ case study approach. What do you think? What are some specific research questions\
    \ and methods?\n\n*   AI: Given your chosen focus, some potential research questions\
    \ could include: \n\n    1.  What motivated business schools to implement AI-powered\
    \ chatbots for academic advising, and what were their goals and expectations?\n\
    \n    2.  How were the chatbots designed and developed, and what challenges were\
    \ encountered during the implementation process?\n\n    3.  How do advisors and\
    \ students perceive and experience the use of chatbots for academic advising,\
    \ and what are the perceived benefits and limitations?\n\n    4.  What lessons\
    \ can be learned from the experiences of business schools that have successfully\
    \ implemented AI-powered chatbots for academic advising?\n\n        In terms of\
    \ methods, a qualitative case study approach involving semi-structured interviews\
    \ with key stakeholders (e.g. administrators, advisors, students) would be well-suited\
    \ to exploring these questions in depth. You could select a sample of business\
    \ schools that have implemented AI-powered chatbots for academic advising and\
    \ conduct interviews with individuals involved in the implementation and use of\
    \ these technologies.\n\n        To analyse the data, you could use a thematic\
    \ analysis approach, identifying common themes and patterns across the interviews.\
    \ This could be complemented by a review of relevant documents (e.g. project plans,\
    \ chatbot design specifications) to provide additional context and triangulate\
    \ findings.\n\n        The ultimate goal would be to generate a rich, nuanced\
    \ understanding of the experiences and lessons learned from the implementation\
    \ of AI-powered chatbots for academic advising in business schools. The findings\
    \ could inform best practices and guidelines for other institutions considering\
    \ similar initiatives.\n\n*   Dr. X: Fantastic, thanks! I’ll think that over and\
    \ get back to you.\n\n### Case conclusion\n\nIf you picked up on the overly polite\
    \ and conversational style of prompting (see [Chapter 7](#C_011_c7.xhtml) for\
    \ an overview of using “please” and “thank you” in prompt writing) and academic\
    \ background alignment, you probably guessed that the above chatbot conversation\
    \ was between me and an AI model.\n\nReflecting on the exchange, it demonstrates\
    \ the potential of AI as a collaborative partner. Namely, the availability of\
    \ an AI chatbot to help generate a range of research ideas, respond to specific\
    \ concerns, and help refine the project focus.\n\nThe process highlights the nature\
    \ of iterative dialogue. Each exchange with the AI built upon the previous one,\
    \ allowing for a gradual refinement of ideas. This approach mirrors the collaborative\
    \ brainstorming sessions I might have with colleagues, but with the added benefit\
    \ of the AI’s vast knowledge base, ability to quickly generate and adapt ideas,\
    \ and 24–7 access – while my colleagues are amazing people, they probably wouldn’t\
    \ appreciate a call to discuss a research project during my vampiric-style work\
    \ hours. While human collaboration remains invaluable, the AI’s tireless availability\
    \ can be a significant asset, especially for those of us prone to late-night bursts\
    \ of inspiration.\n\nIt’s also worth noting that while the AI provided some input\
    \ to help me work through my thinking, the final research design still requires\
    \ my professional judgement. The AI’s suggestions mostly serve as a springboard\
    \ for my thinking, rather than a prescription to be followed blindly. This underscores\
    \ the complementary nature of AI in academic research – it’s a powerful tool to\
    \ augment our capabilities, not replace our expertise.\n\nLastly, this exercise\
    \ demonstrated the practical application of the guiding principles for AI-assisted\
    \ ideation, as discussed earlier in this book. By establishing clear roles, seeding\
    \ discussions with examples, setting constraints, asking targeted questions, and\
    \ continuously evaluating and redirecting, you increase your chances of steering\
    \ the conversation towards a productive outcome.\n\nWhile the above dialogue with\
    \ the AI model was somewhat organic, there are several ways that you could bring\
    \ a more structured approach to the process of brainstorming with AI.\n\nNext,\
    \ let’s explore some more structured techniques for using AI chatbots to generate\
    \ creative ideas for potential research projects.\n\n## Moving beyond “obvious”\
    \ AI outputs\n\nBack-and-forth conversations with AI chatbots can lead to rapid\
    \ idea generation – if there’s one thing chatbots excel at, it’s quickly producing\
    \ ideas. However, I often find these ideas to be somewhat “obvious”. Engaging\
    \ in this process can leave me questioning whether the chatbot truly helped push\
    \ the boundaries of my thinking, or if I was just in need of a good old chat and\
    \ my machine-pals were the only ones available at that late hour to listen to\
    \ my ramblings.\n\nAs discussed in earlier chapters, chatbots can be thought of\
    \ as prediction machines, making suggestions that could be considered the most\
    \ probable response. This is great for generalist-style outputs, but for research\
    \ that might inform a truly innovative study, we’re unlikely to want to state\
    \ the obvious. After all, we’d prefer to avoid a desk rejection accompanied by\
    \ the dreaded editor response: “This paper is not new and states the obvious”.\
    \ Ouch.\n\nUsing long-established creative thinking techniques, such as remote\
    \ association,\n\nWhile far from being an exhaustive list, consider using the\
    \ following techniques to brainstorm your next research project:\n\n*   Remote\
    \ association: This technique involves drawing comparisons between seemingly disparate\
    \ concepts or domains to reveal new insights and possibilities. For example, a\
    \ researcher studying organisational change could ask an AI chatbot to help identify\
    \ analogies from nature, such as the process of metamorphosis in butterflies or\
    \ the adaptive resilience of ecosystems. By exploring these analogies in depth,\
    \ they may gain fresh perspectives on the drivers, stages, and challenges of organisational\
    \ transformation."
