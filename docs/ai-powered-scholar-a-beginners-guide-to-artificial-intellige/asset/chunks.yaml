- raw: "*   Assumption reversal: This approach involves identifying the underlying\
    \ assumptions or beliefs that shape current thinking about a research topic, and\
    \ then deliberately challenging or inverting those assumptions. For instance,\
    \ a researcher investigating the factors that contribute to student success in\
    \ online learning could ask the AI chatbot to help articulate the prevailing assumptions\
    \ (e.g. students with strong self-motivation and time management skills are more\
    \ likely to succeed in online courses). The researcher could then explore the\
    \ implications of reversing those assumptions (e.g. what if students with weaker\
    \ self-motivation and time management skills could be equally or even more successful\
    \ in online learning?). This exercise can open new avenues for research and theory\
    \ development.\n\n*   Divergent thinking: This technique involves generating a\
    \ wide range of ideas or possibilities without judging or evaluating them in the\
    \ moment. The goal is to encourage free-flowing, unconstrained thinking that can\
    \ lead to unexpected connections and insights. Engage in a divergent thinking\
    \ exercise with the AI chatbot by rapidly brainstorming a list of potential research\
    \ questions or hypotheses without stopping to assess their feasibility or relevance.\
    \ Subsequently, review the list and identify the most promising or intriguing\
    \ ideas for further development.\n\n*   Lateral thinking: This approach involves\
    \ intentionally disrupting linear, logical thought processes to explore new directions\
    \ and possibilities. One classic lateral thinking technique is the “random entry\
    \ point” method, where a random word or concept is introduced into the problem-solving\
    \ process to stimulate new associations and ideas. For instance, a researcher\
    \ examining the challenges of remote teamwork could ask the AI chatbot to suggest\
    \ a random object (e.g. “umbrella”) and then explore how the features or characteristics\
    \ of that object might relate to the research topic (e.g. “an umbrella provides\
    \ shelter and protection from the elements; how might remote teams create a sense\
    \ of “shelter” or “protection” for their members in a virtual work environment?”).\n\
    \nLet’s explore some practical examples of how applying creative thinking techniques\
    \ to the process of ideating research projects might play out in practice.\n\n\
    ### Scenario: The ‘5 whys’ approach\n\nThis technique was popularised through\
    \ its use at Toyota and involves repeatedly asking ‘why’ questions.\n\nHere’s\
    \ an example:\n\n*   Researcher: I’m interested in studying the impact of AI on\
    \ job dis- placement.\n\n*   AI: One potential angle could be to explore why certain\
    \ industries or occupations are more vulnerable to AI-driven job displacement.\n\
    \n*   Researcher: Why are some industries more vulnerable than others?\n\n*  \
    \ AI: It could be because some industries involve tasks that are more easily automated\
    \ or replicated by AI algorithms.\n\n*   Researcher: Why are some tasks more easily\
    \ automated?\n\nThe conversation continues…\n\n### Scenario: Random association\n\
    \nAs introduced above, this technique involves introducing random or seemingly\
    \ unrelated concepts into the conversation to spark new connections and ideas.\
    \ The researcher can ask the AI chatbot to make associations between the research\
    \ topic and a randomly chosen word or phrase, leading to unexpected and potentially\
    \ innovative research directions. For example:\n\n*   Researcher: I’m studying\
    \ the role of social media in political polarisation. Let’s try a random association.\
    \ Use the word “underwater”.\n\n*   AI: Interesting! We could explore the concept\
    \ of “echo chambers” on social media as being similar to underwater caves – isolated,\
    \ self-reinforcing environments that amplify certain views and limit exposure\
    \ to diverse perspectives.\n\n*   Researcher: Great. It makes me think about the\
    \ role of algorithms in creating these echo chambers, like currents directing\
    \ the flow of information underwater.\n\n    The conversation continues, with\
    \ the researcher prompting the AI to explore the idea further, in the context\
    \ of the randomly chosen word or phrase.\n\n### Scenario: Combinatorial creativity\n\
    \nThis approach goes all the way back to Einstein.\n\n*   Researcher: I’m interested\
    \ in studying the factors that contribute to successful startup incubators. What\
    \ ideas from other domains might be relevant?\n\n*   AI: One idea from ecology\
    \ could be the concept of “keystone species” – organisms that play a crucial role\
    \ in maintaining the structure and function of an ecosystem. In the context of\
    \ startup incubators, we could explore the role of “keystone mentors” or “keystone\
    \ investors” who are critical to the success of the incubator ecosystem.\n\n*\
    \   Researcher: Thanks. We could also draw on ideas from developmental psychology,\
    \ like the concept of “scaffolding” – how incubators provide structured support\
    \ for startups to grow and develop over time. Please explore this.\n\n    The\
    \ conversation continues…\n\nIncorporating the above ideation techniques into\
    \ your conversations with AI chatbots can provide a more structured approach to\
    \ tapping into new sources of creativity and insight. I encourage you to test\
    \ some of them and see what the chatbot generates.\n\nHowever, never forget who’s\
    \ in charge!\n\nYou should always be “driving the bus”, with AI chatbots employed\
    \ as collaborative sounding boards. And, always maintain an awareness of the limits\
    \ of today’s conversational AI models. While AI chatbots can be skilled sounding\
    \ boards for early-phase concept exploration, relying wholly on AI ideation forfeits\
    \ opportunities to cultivate creativity intrinsic to scholarship.\n\nTo wrap up\
    \ this chapter, it’s worth emphasising that the creative ideation techniques we’ve\
    \ explored can certainly be undertaken *without* AI’s assistance.\n\nWhile prominent\
    \ AI enthusiasts might recommend *always* inviting AI to the party,\n\nWith those\
    \ thoughts in mind, it’s time to put the concepts presented in this chapter into\
    \ practice. To reinforce your understanding and help you develop these skills\
    \ further, consider completing the activities below before proceeding to the next\
    \ chapter.\n\n## Activity\n\nUse this activity to explore how creative thinking\
    \ techniques can be combined with AI-assisted ideation to generate innovative\
    \ research ideas.\n\n### Activity: Applying creative thinking techniques\n\nInstructions:\n\
    \n1.  Select a research challenge or problem you are currently facing.\n\n2. \
    \ Choose one of the creative thinking techniques discussed in this chapter.\n\n\
    3.  Engage in a dialogue with an AI chatbot, applying the chosen technique to\
    \ explore new perspectives and ideas related to your research challenge.\n\n4.\
    \  Analyse the AI’s responses and reflect on how the creative thinking technique\
    \ influenced the ideation process.\n\n    Then, consider the following:\n\n  \
    \  *   How did the creative thinking technique help you approach the research\
    \ challenge in a new way?\n\n    *   What insights or ideas emerged from the AI-assisted\
    \ ideation process that you might not have considered otherwise?\n\n## Notes\n\
