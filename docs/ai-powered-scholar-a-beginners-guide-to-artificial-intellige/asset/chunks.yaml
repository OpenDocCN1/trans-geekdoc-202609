  trans: "\n渴望开始训练的丹尼尔满怀热情地来到第一次课，却发现宫城希望他清洗自己的一系列老爷车。为了完成这项任务，丹尼尔被指示使用特定的手部动作，由著名的电影台词“Wax\
    \ on, wax off”传达。虽然得知自己的空手道抱负暂时搁置而感到沮丧，丹尼尔还是顺从了宫城，并投入任务，期望做得好一定能促使他的正式训练开始。\n\n\
    当第二天到来时，丹尼尔学习成为空手道大师的希望再次被搁置，因为宫城给他的学生安排了另一项杂务。宫城递给丹尼尔两张砂纸盘，并提供了关于如何进行打磨的明确指示，“Right\
    \ circle, left circle”。丹尼尔回应道，“Wouldn’t it be easier going back and forth?” 这显示出他对宫城隐蔽训练方法的缺乏认识。\n\
    \n似乎又被骗掉了一天的空手道训练，丹尼尔完成了任务，悻悻离开，但带着重新燃起的希望回来，认为*终于*可以开始训练了。然而，尽管他满怀希望，失望随之而来，因为宫城递给丹尼尔一把油漆刷和一罐漆，指示他用下一天的训练时间粉刷栅栏。当丹尼尔终于达到青春耐心的极限时，他愤怒地抗议，声称自己什么也没学到。\n\
    \n如果你熟悉这部电影，你也会熟悉宫城培养技能发展的形成性教学方法。每一项杂务在丹尼尔不知情的情况下，宫城都在帮助丹尼尔建立肌肉记忆和应对任何空手道招式的反射能力。\n\
    \n正是通过宫城框架的视角，我在本書中为你提供一系列技能发展活动。每项活动旨在发展你的肌肉记忆和 AI 反射能力。然而，与那个天真的丹尼尔不同，他在不知每项任务都在为精通而构建的情况下艰辛地度过训练，你受邀带着充分的认知进入这段旅程，即在进入\
    \ AI 擂台之前，你需要做一些打蜡汽车、甲板打磨和粉刷栅栏的工作。\n\n在进入下一章之前，请花点时间反思我们所探讨的概念。下面“Reflection and\
    \ discussion”部分提供的问题旨在加深你的理解，并鼓励你对 AI 在学术界的作用进行批判性思考。考虑与同事讨论这些问题以获得多元视角。\n\n##\
    \ Activity\n\n如果你与朋友或在课堂环境中一起阅读本书，我鼓励你在每章末尾参与提供的活动。\n\n### Activity: AI in academia\
    \ role-play\n\nObjective: 探讨从不同角度整合 AI 进入学术工作可能带来的用途、益处和挑战。\n\nInstructions:\n\
    \n1. 组成 3–4 人的小组。\n2. 在每个小组内分配角色，例如：\n    * 博士候选人或早期职业研究者\n    * 终身教授\n    * 大学伦理委员会成员\n\
    \    * 学术期刊编辑\n3. 情景：你的大学正在制定学术写作和研究中使用 AI 的指南。每个小组需要为这些指南制定一份提案。\n4. 角色扮演讨论（30\
    \ 分钟）：\n    * 每位参与者应从其分配的视角进行倡导。\n    * 考虑 AI 如何可能整合到学术工作的不同方面（例如文献综述、数据分析、写作、同行评审）。\n\
    \    * 讨论潜在的益处和风险。\n    * 讨论如何在受益于 AI 工具的同时维护学术诚信。\n5. 制定指南（15 分钟）：\n    * 基于讨论，创建一个关于学术工作中\
    \ AI 使用的 5–7 条简短指南清单。\n6. 分享和比较（15 分钟）：\n    * 每个小组向全班展示其指南。\n    * 讨论各组提案之间的相似性和差异。\n\
    7. 反思（10 分钟）：\n    * 单独写一份简短反思，说明本次活动如何影响你对 AI 在学术界的看法。\n    * 考虑你如何在学术研究或教学角色中应用这些见解，或采用所制定的指南。\n\
    \n## Notes\n\n1. 聊天机器人是一种旨在模拟对话的 AI 程序，主要通过文本，也可能通过语音、图像或其他模态。在本章中，我们关注基于文本的大语言模型。\n\
    2. Riskin, J. (2003). 排泄鸭，或，人工生命的模糊起源. *Critical Inquiry*, *29*(4), 599–633. [`doi.org/10.1086/377722`](https://doi.org/10.1086/377722)\n\
    3. Turing, A. (1950). I.—计算机器与智能. *Mind*, *LIX*(236), 433–460. [`doi.org/10.1093/mind/lix.236.433`](https://doi.org/10.1093/mind/lix.236.433)\n\
    4. McCarthy, J. M., Minsky, M. L., Rochester, N., & Shannon, C. E. (1955). *关于人工智能达特茅斯夏季研究项目的提案*.\
    \ [`www-formal.stanford.edu/jmc/history/dartmouth/dartmouth.html`](https://www-formal.stanford.edu/jmc/history/dartmouth/dartmouth.html)\n\
    5. Copeland, B. J. (2023). 英国早期的 AI：图灵等人. *IEEE Annals of the History of Computing*,\
    \ *45*(3), 19–31. [`doi.org/10.1109/mahc.2023.3300660`](https://doi.org/10.1109/mahc.2023.3300660)\n\
    6. Anyoha, R. (2017, August 28). 人工智能的历史. *Harvard Graduate School of Arts and\
    \ Sciences – Science in the News*. [`sitn.hms.harvard.edu/flash/2017/history-artificial-intelligence/`](https://sitn.hms.harvard.edu/flash/2017/history-artificial-intelligence/)\n\
    7. Crevier, D. (1993). *AI：寻找人工智能的动荡历史*. Basic Books. [`www.researchgate.net/publication/233820788_AI_The_Tumultuous_History_of_the_Search_for_Artificial_Intelligence`](https://www.researchgate.net/publication/233820788_AI_The_Tumultuous_History_of_the_Search_for_Artificial_Intelligence)\n\
    8. Dreyfus, H. L. (1992). *计算机仍无法做到的事：对人工理性的批判*. MIT press.\n9. Mitchell, M. (2021,\
    \ April 26). *为什么 AI 比我们想象的更难*. [arXiv.org](http://arXiv.org). [`arxiv.org/abs/2104.12871`](https://arxiv.org/abs/2104.12871)\n\
