    Moreover, the integration of AI systems may necessitate a fundamental shift in
    teaching roles, with lecturers potentially evolving into facilitators who guide
    students through AI-enhanced learning journeys. This transition is not without
    its hurdles. It requires substantial investment in staff training, focusing on
    AI literacy and the effective integration of these systems into the curriculum.
    The process may involve redesigning entire courses, which, while potentially exciting,
    is also daunting, time-consuming, and resource-intensive.


    Furthermore, ethical considerations must be carefully balanced. While continuous
    monitoring can provide valuable insights, it’s crucial to establish appropriate
    boundaries to protect student privacy.


    Additionally, ensuring accessibility for students with disabilities must be a
    priority in the development and implementation of these AI systems.


    In conclusion, while adaptive learning AI systems present complex challenges,
    their potential to revolutionise higher education makes them a topic worthy of
    further exploration and careful consideration”.


    ### 4. Reflect and iterate

    “This is a great start, thanks…”


    The conversation would continue, with the academic reflecting on the AI’s suggestions,
    asking for further clarification or expansion as needed, and being in a position
    to start adding to the text and getting more words on the page.


    As you can see from the worked example above, “blah writing” can transform a chaotic
    stream of thoughts into a “draft zero”, comprising a structured, coherent narrative.
    It can help you to overcome the initial hurdle of writer’s block but also provide
    you with a foundation for further development of your ideas. Remember that the
    goal is not necessarily the production of a finished product, but to kickstart
    your writing process and generate a base from which to build.


    ## Generating outlines

    Another strategy for overcoming writing roadblocks with AI chatbots is to employ
    their capabilities to create a comprehensive outline for your upcoming publication.
    By generating headings and subheadings, AI can help create a “paint by numbers”
    scenario, eliminating the guesswork about what to write next. This method draws
    on the approach of Professor Rowena Murray,


    These detailed outlines allow you to approach your writing flexibly, enabling
    you to work on any section at any time, simply by filling in the required number
    of words. Essentially, they provide you with a framework for structuring your
    thoughts and can take away some of the stress of the intimidating expanse of white
    space, replaced by a clear action plan which you can dip in and out of as time
    permits.


    ### Creating an outline with AI

    To create an outline with the help of AI, I recommend beginning by assigning your
    AI assistant a role.


    ### Assigning a role

    An example role prompt could look something like this:


    > Please assume the role of a senior research assistant with expertise in \[Insert
    topic, e.g., educational technology and AI implementation in higher education\].
    You have a background in qualitative research and twenty years of experience writing
    academic papers for high-quality journals. Communicate in a professional yet approachable
    tone, and don’t hesitate to ask for clarification if needed.


    ### Using an exemplar outline

    You might also provide an exemplar outline, based on an existing paper. This approach
    is particularly beneficial when you aim to emulate a specific structure or style
    common in your field of study. By doing so, you’re essentially giving the AI a
    template to work from, ensuring that your outline aligns with established conventions
    in your discipline. But, before uploading anything, ensure you have the necessary
    permissions. Most leading AI models are capable of extracting the outline from
    an uploaded document, so there’s no need for you to go through the document and
    type it out.


    For instance, you might prompt:


    > I’ve uploaded a paper titled \[Paper Title\] that follows the structure I’d
    like to emulate. Please analyse this paper’s structure, focusing on its headings
    and subheadings. Then, using this structure as a guide, create an outline for
    a 5,000-word paper on \[Your Topic\]. Adapt the headings and subheadings to fit
    my topic while maintaining a similar overall structure. For each section, please
    suggest an approximate word count.


    ### Creating an outline without an exemplar

    If you don’t have an exemplar outline/paper, you might use a prompt like this:


    > Please create a detailed outline for a 5,000-word academic paper on \[Your topic\].
    The paper should follow a standard research article structure including an introduction,
    literature review, methodology, results, discussion, and conclusion. Please provide
    main headings and subheadings and suggest an approximate word count for each section.
    The outline should be suitable for a qualitative research paper to be submitted
    to a peer-reviewed journal in \[Your field\]. Thanks!


    For example, if your topic was “The Impact of AI on Higher Education Teaching
    Practices”, your prompt might look like this:


    > Please create a detailed outline for a 5,000-word academic paper on ‘The Impact
    of AI on Higher Education Teaching Practices’. The paper should follow a standard
    research article structure including an introduction, literature review, methodology,
    results, discussion, and conclusion. Please provide main headings and subheadings
    and suggest an approximate word count for each section. The outline should be
    suitable for a qualitative research paper to be submitted to a peer-reviewed journal
    in educational technology. Thanks.


    Remember, while AI can provide a valuable starting point, the final structure
    should always be refined based on your unique insights, research findings, and
    the specific requirements of your academic project.


    ## Expanding text

    There are often times when we find ourselves needing to elaborate on our ideas
    or deepen the level of description to justify our arguments. In other words: we
    find ourselves in need of more words so that we can satisfy required wordcounts.
    AI tools can be used for this task by assisting us in rephrasing our already-written
    text, suggesting additional points, and by offering ways we could expand our writing
    to achieve greater depth and clarity.


    If you’re thinking of using AI for this task, it’s important to exhibit some caution.


    As was discussed in [Chapter 7](#C_011_c7.xhtml), AI-generated content contains
    many limitations (e.g. hallucinations) and should always be critically evaluated
    and refined through your own expertise and judgement. Therefore, while, in theory,
    people are presumed innocent until proven guilty in courtrooms, the opposite mindset
    is wise to apply to AI-generated content, especially when that content is contributing
    to the creation of academic publications! I always take a “guilty until proven
    innocent” approach when encountering AI-generated text – every AI suggestion is
    treated with a healthy dose of scepticism, and only “acquitted” after thorough
    verification.


    With this firmly front of mind, let’s explore how you might use AI chatbots to
    expand a sample of your academic writing:


    ### How to use an AI chatbot for expanding text

    To use an AI chatbot for expanding text:

    1. Identify the section to expand: Highlight the specific paragraph or passage
    that you want to develop further.

    2. Provide a clear prompt: Give the AI chatbot a specific instruction for expansion,
    such as “Please provide more detailed explanations of the key concepts in this
    paragraph”, “Suggest ways to elaborate on the evidence presented here to strengthen
    the argument”, or simply use a prompt such as “Please expand this text”.

    3. Review and refine: Read through the AI’s suggestions and integrate the most
    relevant and useful expansions. Be sure to maintain your own voice and style and
    ensure that any added material enhances rather than detracts from your overall
    argument.

    '
  trans: '

    此外，AI 系统的整合可能需要在教学角色上发生根本性转变，讲师可能演变为引导学生进行 AI 增强学习之旅的促进者。这一转变并非没有障碍。它需要大量投资于员工培训，重点关注
    AI 素养以及将这些系统有效整合到课程中。这一过程可能涉及对整个课程的重新设计，这虽然可能令人兴奋，但也令人望而生畏、耗时且资源密集。


    此外，伦理考虑必须仔细平衡。虽然持续监控可以提供有价值的见解，但建立适当的边界以保护学生隐私至关重要。


    此外，确保残障学生能够无障碍使用必须在这些 AI 系统的开发和实施中成为优先事项。


    结论是，虽然自适应学习 AI 系统带来了复杂挑战，但其革新高等教育的潜力使其成为值得进一步探索和仔细考虑的主题”。


    ### 4. 反思与迭代

    “这是一个很好的开始，谢谢…”


    对话将继续进行，学术人员会反思 AI 的建议，根据需要请求进一步澄清或扩展，并处于可以开始添加文本、让页面上出现更多文字的位置。


    正如上文的工作示例所示，“blah writing”可以将混乱的思绪流转变为“draft zero”，包含结构化、连贯的叙述。它可以帮助你克服写作障碍的初始难题，同时为你进一步发展想法提供基础。请记住，目标不一定是生产成品，而是启动你的写作过程并生成一个可以构建的基础。


    ## 生成大纲

    克服 AI 聊天机器人写作障碍的另一个策略是利用其能力为即将发表的出版物创建全面的大纲。通过生成标题和子标题，AI 可以帮助创建“paint by numbers”场景，消除对下一步该写什么的猜测。这种方法借鉴了罗文娜·默里教授
    Rowena Murray 的方法，


    这些详细的大纲让你能够灵活地进行写作，使你能够在任何时候处理任何部分，只需填写所需字数即可。从本质上讲，它们为你提供了一个构建思想的框架，可以消除令人望而生畏的空白页面的压力，取而代之的是一个清晰的行动计划，你可以根据时间安排随时深入其中。


    ### 使用 AI 创建大纲

    要使用 AI 的帮助创建大纲，我建议首先为你的 AI 助手分配一个角色。


    ### 分配角色

    一个示例角色提示可能如下所示：


    > 请假设你是一名高级研究助理，擅长于 \[Insert topic, e.g., educational technology and AI implementation
    in higher education\]。你拥有定性研究背景，并在高质量期刊撰写学术论文方面拥有二十年经验。以专业而亲切的语气交流，如有需要请不要犹豫提出澄清请求。


    ### 使用示例大纲

    你也可以提供基于现有论文的示例大纲。当你旨在模仿特定结构或在你的研究领域常见的风格时，这种方法特别有益。通过这样做，你本质上是为 AI 提供了一个模板，确保你的大纲与你所在学科的既定惯例保持一致。但在上传任何内容之前，请确保你拥有必要的权限。大多数领先的
    AI 模型能够从上传的文档中提取大纲，因此你无需逐字输入文档。


    例如，你可能会提示：


    > 我已上传一篇题为 \[Paper Title\] 的论文，其结构是我希望模仿的结构。请分析该论文的结构，重点关注其标题和子标题。然后，以此结构为指导，为一篇
    5,000 字的 \[Your Topic\] 论文创建大纲。调整标题和子标题以适应我的主题，同时保持相似的整体结构。对于每个部分，请建议一个大致的字数。


    ### 无示例创建大纲

    如果你没有示例大纲/论文，你可能会使用如下提示：


    > 请为一篇关于 \[Your topic\] 的 5,000 字学术论文创建详细大纲。论文应遵循标准的研究文章结构，包括引言、文献综述、方法、结果、讨论和结论。请提供主要标题和子标题，并为每个部分建议大致字数。大纲应适用于提交给
    \[Your field\] 领域同行评审期刊的定性研究论文。谢谢！


    例如，如果你的主题是“The Impact of AI on Higher Education Teaching Practices”，你的提示可能如下所示：


    > 请为一篇关于‘The Impact of AI on Higher Education Teaching Practices’的 5,000 字学术论文创建详细大纲。论文应遵循标准的研究文章结构，包括引言、文献综述、方法、结果、讨论和结论。请提供主要标题和子标题，并为每个部分建议大致字数。大纲应适用于提交给教育技术领域同行评审期刊的定性研究论文。谢谢。


    记住，虽然 AI 可以提供有价值的起点，但最终的结构应始终根据你独特的见解、研究发现以及学术项目的具体要求进行完善。


    ## 扩展文本

    我们经常会发现自己需要对想法进行阐述或加深描述的程度以证明论点。在其他话说：我们需要更多文字来满足所需字数。AI 工具可以通过帮助我们改写已撰写的文本、建议额外观点以及提供我们可以扩展写作以实现更大深度和清晰度的方式来用于此任务。


    如果你考虑将 AI 用于此任务，重要的是要保持一定的谨慎。


    正如在 第 7 章 中所讨论的，AI 生成的内容包含许多局限性（例如幻觉），应始终通过你自己的专业知识和判断进行批判性评估和完善。因此，虽然从理论上讲，在法庭上人们被推定为无罪直到被证明有罪，但相反的心态对于
    AI 生成的内容来说是明智的，特别是当该内容有助于学术出版物的创建时！我总是对遇到 AI 生成的文本采取“有罪直到被证明无罪”的方法——每条 AI 建议都以健康的怀疑态度对待，只有在彻底验证后才“被宣告无罪”。


    牢记这一点，让我们探讨你如何使用 AI 聊天机器人扩展学术写作的示例：


    ### 如何使用 AI 聊天机器人扩展文本

    使用 AI 聊天机器人扩展文本：

    1. 确定要扩展的部分：突出显示你想要进一步发展的特定段落或段落。

    2. 提供明确的提示：给 AI 聊天机器人一个具体的扩展指令，例如“请提供此段落关键概念的更详细解释”、“建议如何阐述此处提出的证据以加强论点”，或简单使用提示“请扩展此文本”。

    3. 查看和完善：阅读 AI 的建议并整合最相关、最有用的扩展。务必保持你自己的声音和风格，并确保任何新增材料增强而非削弱你的整体论点。

