    opened doors to applications light years beyond simple image classification, setting
    the stage for AI to tackle increasingly complex real-world problems.


    In addition to progress occurring in the domain of machine learning, neural networks
    made a comeback in the 1990s. Neural networks are AI systems loosely modelled
    after the neuron connections in the human brain.


    While AI was going through “boom and bust” cycles, steady progress continued.


    ## Deep Learning and the 2010s


    In the 2010s, we saw the rise of deep learning, which refers to neural networks
    with multiple layers that can learn highly complex relationships in data


