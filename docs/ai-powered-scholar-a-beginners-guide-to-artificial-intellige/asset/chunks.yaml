    caused by setbacks in overcoming technical barriers and losses of confidence in
    the viability of achieving strong AI.


    ## Renaissance in the 1990s


    The 1990s ushered in a renaissance for AI, driven, in part, by exponential leaps
    in computing power. This new era of technological affordances empowered researchers
    to harness advanced statistical techniques and pioneer machine learning algorithms,
    capable of analysing vast, ever-expanding datasets. Machine learning refers to
    AI systems that can learn and improve from experience without being explicitly
