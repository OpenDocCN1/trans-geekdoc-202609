    作为输入提供给 ML 模型以计算预测误差。平均绝对误差（MAE）用作主要评估指标。训练使用 55% 的数据，15% 的数据用于验证。其余 30% 的数据用于测试。


    ## 2.3. 预测模型


    ML 在无线场景中进行 QoS 预测方面具有巨大潜力。由于 PDR、THP 以及 EC 等 QoS 参数是连续的，因此回归模型适合预测此类变量。我们采用了在
    JupyterHub 上运行的基于 GPU 的 Tensorflow 和 Keras API 笔记本中的 10 层 DNN。深度学习中可用的多功能构造展现出非常好的预测潜力。


    考虑到 8 个拟议参数和 8 个待预测指标（PDR、THP、CPU、LPM、DLP、LSN、TX 和 Off），数据可以使用以下向量表示：


    ```

    f_{(n,1)}, f_{(n,2)}, f_{(n,3)}, f_{(n,4)}, f_{(n,5)}, f_{(n,6)}, f_{(n,7)}, f_{(n,8)},
    f_{(n,9)}, f_{(n,10)},

    f_{(n,1.1)}, f_{(n,1.2)}, PDR, THP, CPU, LPM, DLPM, LSN, TX, Off

    ```


    其中 f 和 n 分别表示输入特征（参数）和行（记录）编号，而 PDR、THP、CPU、LPM、DLPM、LSN、TX 和 OFF 是使用 ML 预测的指标。此数据作为输入传递给
    DNN。DNN 中的计算包括前向传递和后向传递。前向传递使用以下公式计算：


    ```

    O_{[l]}^i = W_{[l]}^i \cdot X_{[l-1]}^i + c_{[l]}^i,

    X_{[l]}^i = f_{(l)}(O_{[l]}^i),

    ```


    其中 l 表示当前层，O、W、X、C 和 f 分别表示输出、输入权重、回归参数和激活函数。激活函数（例如 ReLU）应用于输出 O 以获得下一层的输入 X。在前向传递之后，后向传递（其中
    d 表示导数）使用以下公式计算：


    ```

    dO_{[l]}^i = dX_{[l]}^i \times df_{(l)}(O_{[l]}^i).

    dW_{[l]}^i = \frac{1}{n}(dO_{[l]}^i \cdot X_{[l]^T}^i),

    dc_{[l]}^i = \frac{1}{n} \sum_{l=1}^n O_{[l]}^i,

    dX_{[l-1]}^i = W_{[l]^T}^i \cdot dX_{[l]}^i,

    ```


    这里 T 表示相关矩阵的转置。为了更新权重和回归参数，使用梯度下降执行：


    ```

    W_{[l]}^i = W_{[l]}^i - \alpha \times dW_{[l]}^i.

    ```


    ```

    b_{[l]}^i = b_{[l]}^i - \alpha \times dc_{[l]}^i.

    ```


    alpha 的值设置为 0.001。alpha 的常规取值为 0.1、0.01 和 0.001。在此情况下，选择 0.001 是基于经验做出的。在应用和评估
    ML 性能之前，计算参数与 QoS 指标之间的统计（Pearson）相关性，旨在了解所考虑的参数与指标之间的关系。使用上述 ML 模型评估测试数据时，我们将
    MAE 用作指标。实验和预测的整个工作流程如图 3 所示。由于所提议系统是数据驱动的，它始于一个数据源。数据可以是预先录制的实例（和/或仿真）形式，用于引导系统。任何此类数据都将具有底层拓扑和参数配置。但是，当系统投入生产运行时，它应该与实际部署交互，并从
    IoT 中 WSN 基础设施的不同安装点收集实时数据。数据需要经过预处理，以实现将通信参数表示为特征、将 QoS 指标表示为标签或目标的结构化格式。此预处理数据以简单的二维表格形式表示，由行和列组成。划分为训练集和测试集的数据经过学习模型处理，以达到足够的精度。此第一阶段的训练在离线状态下进行。考虑精度和效率，可以选择合适的模型进行部署。


