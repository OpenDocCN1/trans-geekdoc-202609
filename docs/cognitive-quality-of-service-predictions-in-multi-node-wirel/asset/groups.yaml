    (Fig. 7(b)).


    ### 3.4.2. Deep Low Power Mode


    The effect of NN and TP on the CPU DLPM period is shown in Fig. 7(c). DLPM period
    increases as NN increases. The behavior of DLPM varies with varying TP levels.
    When NN is 8, DLPM appears to increase with an increase in TP level. However,
    for bigger values of NN, the impact of the TP level is not consistent. The impact
    of NN and PS on the DLPM period is described in Fig. 7(d). In addition to the
    variation in DLPM with relation to NN (Fig. 7(c)), increasing PS causes DLPM to
    drop. Fig. 7(e) reveals the behavior of DLPM in relation to MT and NN. Intuitively,
    and unlike NN, an increase in MT causes a drop in DLPM. We have pictorially depicted
    the relationship among various parameters and QoS metrics in detail. Based on
    the trends observed in the above description, we feel convinced to apply ML to
    identify the prediction potential of various QoS metrics based on variations in
    different parameters.


