    # 2.3. Prediction model


    ML offers huge potential in making QoS predictions in wireless scenarios. Since
    the QoS parameters like PDR, THP, as well as EC, are continuous, therefore regression-based
    models are suited for predicting such variables. We adopted a 10 layers DNN using
    JupyterHub running GPU-enabled notebook with Tensorflow and Keras API. The versatile
    constructs available in deep learning demonstrate very good prediction potential.


    Considering the 8 proposed parameters and 8 metrics (PDR, THP, CPU, LPM, DLP,
    LSN, TX, and Off) to be predicted, the data can be represented using the following
    vector:


    ```

    f_{(n,1)}, f_{(n,2)}, f_{(n,3)}, f_{(n,4)}, f_{(n,5)}, f_{(n,6)}, f_{(n,7)}, f_{(n,8)},
    f_{(n,9)}, f_{(n,10)},

    f_{(n,1.1)}, f_{(n,1.2)}, PDR, THP, CPU, LPM, DLPM, LSN, TX, Off

    ```


    Where f and n represent input features (parameters) and row (record) number, whereas
    PDR, THP, CPU, LPM, DLPM, LSN, TX, and OFF are the metrics to be predicted using
    ML. This data is input to the DNN. The computation in DNN consists of the forward
    and backward passes. A forward pass is calculated using:


    ```

    O_{[l]}^i = W_{[l]}^i \cdot X_{[l-1]}^i + c_{[l]}^i,

    X_{[l]}^i = f_{(l)}(O_{[l]}^i),

    ```


    where l represents the current layer, and O, W, X, C, and f represent output,
    weights of the inputs, a regression parameter, and an activation function, respectively.
    The activation function (e.g., ReLU) is applied to the output O to achieve input
    X for the next layer. Following a forward pass, a backward pass, where d represents
    the derivative, is calculated using:


    ```

    dO_{[l]}^i = dX_{[l]}^i \times df_{(l)}(O_{[l]}^i).

    dW_{[l]}^i = \frac{1}{n}(dO_{[l]}^i \cdot X_{[l]^T}^i),

    dc_{[l]}^i = \frac{1}{n} \sum_{l=1}^n O_{[l]}^i,

    dX_{[l-1]}^i = W_{[l]^T}^i \cdot dX_{[l]}^i,

    ```


    Here T represent the transpose of relevant matrix. In order to update the weights
    and regression parameter, gradient descent is executed using:


    ```

    W_{[l]}^i = W_{[l]}^i - \alpha \times dW_{[l]}^i.

    ```


    ```

    b_{[l]}^i = b_{[l]}^i - \alpha \times dc_{[l]}^i.

    ```


