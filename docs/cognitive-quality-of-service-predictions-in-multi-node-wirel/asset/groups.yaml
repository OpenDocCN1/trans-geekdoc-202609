    ## 4. Results and discussion


    ### 4.1. Correlations among parameters and metrics


    Statistical correlations are described in Fig. 8. It shows the R² scores of the
    relationship among the parameters/features (y-axis) and QoS metrics (x-axis).
    The magnitude of correlation scores of MP, TP, IAT, NN, DT, and PS with THP are
    0.77, 0.77, 0.59, 0.53, 0.35, and 0.35, respectively. In the case of PDR, DT (0.55)
    proves to be most correlated, followed by TP (0.27), and NN (0.26). Other metrics
    that tend to have strong correlations include time in transmission (TiTx), time
    in DLPM (TiDLPM), and time in CPU (TiCPU). TiTx has correlation scores of 0.54,
    0.54, 0.46, 0.30, and 0.27 with MP, TP, IAT, PS, and DT, respectively. DLPM is
    affected by MP, TP, and IAT with scores of 0.38, 0.37, and 0.31, respectively.
    CPU time period is determined by MP, TP, IAT, and NN with scores of 0.92, 0.92,
    0.72, and 0.33, respectively.


    These correlations scores affirm the pictorial relationships shown in Figs. 4,
    5, 6, and 7 and provide a basis for predicting QoS metrics based on the variation
    in the values of the parameters/features under consideration.


