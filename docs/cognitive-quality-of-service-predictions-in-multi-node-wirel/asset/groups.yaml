    ## 5. 结论


    现代通信系统设想为自适应系统。软件定义网络和网络功能虚拟化的出现使得实现自适应设计成为可能。这种自适应设计可以通过机器学习的帮助，利用可配置通信参数的动态微调来实现。本文展示了利用机器学习预测无线传感器网络和物联网中服务质量指标的潜力，基于流量速率、数据包大小、发射功率、最大传输次数、节点数量和距离等参数。服务质量指标的准确预测有助于为物联网设计数据驱动的自适应通信系统。数据通过大量实验收集，并进行统计分析以识别通信参数与服务质量指标（如数据包投递率、吞吐量、能耗（包括
    CPU 和无线电））之间的关系。


    这些相关性鼓励采用机器学习等智能技术。预测结果足够准确，并为基于自适应设计的产品和解决方案开发提供了基础。未来，我们打算开发一个自适应系统的工作原型，该系统将通信网络与云集成，并使用实时性能数据进行预测。


