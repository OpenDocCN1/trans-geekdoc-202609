    THP 与不同通信参数的关系如图 5 所示。图 5(a) 突出了 PS 和 MT 对 THP 的影响。随着 PS 和 MT 值的增加，THP 上升。这很直观，因为更大的数据包减少了控制数据比例并增加了传输尝试次数，从而可以提高可靠性。图
    5(b) 揭示了 NN 和 TP 对 THP 的影响。如所见，随着节点数量增加，THP 降低，而随着 TP 增加，THP 提高。


    可以理解的是，更多节点使得通信难以同时进行。图 5(c) 显示了 PS 和 NN 对 THP 的影响。随着 NN 增加和数据包尺寸变小，THP 降低的趋势非常一致。图
    5(d) 可以看到 NN 和 MT 对 THP 的影响。除了 NN 的 THP 趋势外，还可以观察到 MT 值越高，THP 越高。因此，THP 针对多个参数的行为在这些图中是一致的。


    图 5(e) 显示了 MT 和 TP 对 THP 的影响。随着 MT 和 TP 值的增加，THP 增加。但是，与 MT 相比，TP 似乎更有影响力。同样，图
    5(f) 揭示了 PS 和 TP 对 THP 的影响。随着 PS 和 TP 的增加，THP 增加。图 5(g) 揭示了随着 IAT 和 PS 的变化，THP
    的行为。很明显，随着 PS 增加和 IAT 值减小，THP 增加，这意味着发送更多数据位且以更高速率发送的数据包可以提高吞吐量。图 5(h) 显示了 PS
    对 PDR 和 THP 的影响。已经观察到（图 4(e)），随着 PS 增加，PDR 往往会略有下降。但是，它对 THP 产生不同的影响，因为随着更大的数据包尺寸而上升。因此，PS
    证明是同时优化 PDR 和 THP 的一个冲突指标。


    图 5(i) 强调了 DT 对 PDR 和 THP 的影响。随着 DT 增加，距离对 PDR 和 THP 都有相对一致的影响，两者都会下降。因此，DT 在这些可靠性相关指标中的作用似乎更具决定性。同样，图
    5(j) 揭示了 IAT 对 PDR 和 THP 的影响。似乎以更短的间隔发送数据包会改善 THP。但是，IAT 与 PDR 之间的同样的关系存在差异。以更快的速率发送数据包会导致
    PDR 略有下降。因此，IAT 也以冲突的方式影响 PDR 和 THP，需要仔细微调。


