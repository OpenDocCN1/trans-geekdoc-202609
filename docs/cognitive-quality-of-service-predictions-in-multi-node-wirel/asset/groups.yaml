    0–32 不可用。


    实验的最小运行时间基于参数值组合的数量。通信参数及其值的详细信息见表 1。基于表 1 中的描述，我们按以下方式介绍组合详情：


    ```

    Total combinations = TP x NN x MT x PS x IAT

    = 6 x 3 x 3 x 3 x 4

    ~ 650 (1)

    ```


    这意味着实验针对这些近 650 个参数配置组合进行了运行。我们针对每个参数配置运行实验 600 s（10 分钟），并重复以期达到一致的行为。因此，运行实验所需的最少时间以及由于调度、技术困难、错误运行产生的开销如下：


    ```

    Total time for experiments = Number of parameter configurations

    x Time + Overhead(1/4th of actual time)

    = 650 x 10 min + 1625 min

    ~ 6500 min + 1625 min

    = 8125 min ~ 135 h = 06 days

    (2)

    ```


    ## 2.2. 特征


    数据收集后，进行特征（参数）提取。某些特征（例如 TP、PS、NN 等）直接使用；而其他特征（即 MP 和 PT）则基于其他特征（包括每个数据包信息）计算。同样，QoS
    指标（PDR、THP 和 EC）从数据中计算得出。对参数与 QoS 指标之间的关系进行了彻底的统计分析，以揭示所进行实验的原理。所有这些特征


    **表 1**

    通信参数配置详情。


    | 协议层 | 参数 | 不同值的数量 | 拟议值 | 依据 |

    |---|---|---|---|---|

