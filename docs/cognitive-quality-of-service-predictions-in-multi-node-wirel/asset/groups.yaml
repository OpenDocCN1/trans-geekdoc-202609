    ## 多节点无线传感器网络中认知服务质量预测


    穆罕默德·阿蒂克 ^a, 穆罕默德·哈利勒·阿夫扎尔 ^b, 舍拉兹·安朱姆 ^b, 金炳锡 ^c, *


    * 巴哈瓦尔普尔伊斯兰大学计算机学院，巴基斯坦

    b 科马茨大学伊斯兰巴德瓦校区计算机科学系，巴基斯坦

    c 弘益大学软件与通信工程系，韩国


    ### 文章信息


    关键词：

    - 性能预测

    - 机器学习

    - 物联网

    - 无线传感器网络

    - 服务质量


    ### 摘要


    无线传感器网络为物联网在日常生活中的实现与普及铺平了道路。随着传感器和通信设备将事物与人们连接得更加紧密，服务质量需求变得严格且多样化。优化冲突的服务质量目标是NP难问题。此外，随着规模、应用特定的性能需求和部署场景等因素的发展，通信系统动态适应的需求也在增长。本文旨在预测服务质量，以提升物联网中服务的性能。我们使用真实测试平台进行了实验，并在广泛的通信参数配置下收集了性能数据。统计分析揭示了通信参数与服务质量指标之间存在显著关系。基于这些相关性，我们训练了深度学习模型来评估指标的可预测性。预测结果令人鼓舞。本研究的成果为在无线传感器网络和物联网中构建数据驱动的自适应服务质量设计奠定了基础。


    ## 1. 引言


    无线传感器网络（WSN）的无处不在极大地促进了物联网（IoT）的实现 [1]，而这种不断扩大的规模也使物联网面临更具挑战性的处境。WSN在日常生活的许多领域都有应用，传感器节点被用于在无需人工干预的情况下执行特定任务。一些应用领域包括农业、医疗单位、水下监测系统、智能家居电器、智能工业等
    [2,3]。最近，可穿戴传感器技术导致连接互联网的人数激增 [4]。


    WSN的发展使其应用领域多样化，因此实现性能目标变得具有挑战性。要满足特定应用领域的性能需求，通常需要采用特定的介质访问控制（MAC）和物理（PHY）层解决方案。然而，制定MAC和PHY协议会导致大量的实验、标准化和制造成本。这些成本以金钱和时间形式出现。上述方法的另一个主要局限性是缺乏自适应性。协议通常是硬编码定义的，可配置性最小，无法随着网络和应用场景的发展进行自动调整。我们可以通过识别各种协议参数与服务质量（QoS）指标之间的关系，最大限度地提高各种协议参数的可配置性，并选择合适的MAC协议来解决自适应性问题。值得注意的是，参数的可配置性是指在所使用的协议栈不同层中为不同参数分配适当值（例如，数据包大小、流量速率、传输功率、退避时间等）。其中一些参数（特定于协议）有助于协议的配置。同时，我们还建议根据QoS需求选择特定协议。例如，Contiki操作系统的当前实现允许选择CSMA或TSCH作为MAC层协议。两者具有不同的特性，在不同条件下可能表现出不同的行为。理解通信参数与QoS指标之间的关系对于在不断变化的网络条件和新兴应用需求下满足冲突的QoS目标至关重要
    [5]。


    WSN领域的研究已扩展到多种考量。[6]中提出的工作强调了在农业等关键领域高效组织无线传感器和执行器节点的重要性。所提方案并非基于机器学习等自适应方法。考虑到云计算日益重要的地位以及WSN与云的集成，[7]提出了一种通过在边缘促进处理来减少传输到云的网络负载的方案。所提方案可从可能的自适应网络级配置中受益。[8]提出了一种基于垂直切换操作来解决无线网络QoS问题的方案。[9]提出了一种基于机器学习的使能器，使用支持向量机讨论工业无线传感器和执行器网络中的高效QoS。所提方案侧重于干扰分类，这有助于进一步表征QoS。


