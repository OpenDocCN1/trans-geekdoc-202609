    ## 3.4. Energy consumption: CPU usage


    ### 3.4.1. Low Power Mode


    The effect of NN and TP on the CPU LPM period is shown in Fig. 7(a). The LPM period
    tends to increase with an increase in both NN and MT. However, this increasing
