  md: 'adaptive network-level configurations. A solution based on vertical handover
    operations for tackling the QoS problem in wireless networks is presented in [8].
    A machine learning-based enaderer is presented in [9] that discusses efficient
    QoS in industrial wireless sensor and actuator networks using support vector machine.
    The proposed solution focuses on interference classification that can be helpful
    in further characterizing QoS.


    Machine Learning (ML) models can play a vital role in predicting the optimal configurations
    for communication parameters that can meet the required QoS goals. ML models are
    trained under different stack parameter combinations to predict the performance
    metrics. We propose a solution for Packet Delivery Ratio (PDR), Throughput (THP),
    and energy consumption (radio and CPU) by considering Transmission Power (TP),
    Maximum Transmissions (MT), Distance (DT), Packet Size (PS), Inter Arrival Time
    (IAT) and Number of Nodes (NN). It is pertinent to mention that MT represents
    the maximum transmission attempts allowed until a packet is successfully delivered,
    whereas IAT refers to the gap in milliseconds between successive packet transmissions.
    To train the dataset, we used Deep Neural Network (DNN). This multi- parametric
    approach has been found in literature [5,10]. The purpose is to understand the
    relationship of these parameters to QoS metrics. Results achieved from this experiment
    give sufficient insight into the dynamics of communication parameters and their
    influence on QoS performance metrics.


    ML models are widely used to create prediction models for many WSN application
    scenarios. A link quality prediction technique is presented in [11], based on
    the naive Bayes classifier, logistic regression, and artificial Neural Networks
    (NN). The proposed model uses Packets Received Percentage (PRP) and PHY layer
    information as input parameters and predicts the reception of the next packet
    as output. Logistic regression performs better with a small computational cost.
    The main limitation of this work is that too few parameters are used to capture
    any meaningful variations and relationships among QoS metrics and parameters of
    interest. In [12], a data-driven technique is presented for MAC layer optimization
    by considering real-time communication information. Again, it follows the common
    limitation of using limited parameters as well as adopted receiver side quantities
    to predict sender side parameters which are impractical. Authors in [13] used
    offline mode and traces for performance evaluation. Mathematical programming techniques
    are highly complex for constrained devices like sensor nodes. Neural networks
    based prediction models for predicting network lifetime, TP, and DT between nodes
    are proposed. The proposed approach is purely a simulation and shares the lacking
    discussed for [12]. In [14], an attempt for collaborative QoS prediction is presented.
    This technique is based on a context-sensitive matrix-factorization approach for
    prediction. It considered both implicit and explicit factors in QoS data, thus
    providing better insight for QoS prediction.


    There are two major limitations of the above-mentioned solutions. First, most
    of the solutions use very few parameters that lack capturing any meaningful relationship
    among QoS metrics and parameters. Second, many proposed schemes rely on using
    receiver-side parameters to predict sender-side quantities. In addition, some
    solutions are based on simulated data which makes it hard to achieve representative
    results for real-world situations.


    Authors in [15] also provide ML-based QoS solutions for predicting QoS parameters
    for better user-side experience in both WSN and IoT applications. In [16], authors
    proposed a neural network model for QoS prediction. In [17], a goal-driven service
    model for the QoS prediction model is presented for IoT which is adaptive and
    self-organizing. An overall limitation in the literature summarized above is that
    the number of parameters used to train the ML models is limited. Another shortcoming
    that these studies suffer from is that in many cases receiver-side parameters
    are used as input features at the sender-side for prediction. The common limitation
    in these solutions is that the QoS is predicted at a service level and no attention
    is paid to the network-specific settings that keep the potential of accurate and
    adaptive predictive system abstract.


    In recent endeavors [18–21], we extended the number of parameters for predicting
    QoS metrics as well as avoided the use of receiver- side parameters as features
    for sender-side predictions. In [18], PDR and energy consumption are predicted
    using more than 48 thousand combinations of as many as 7 pre-configured parameters
    (including IAT, PS, TP, DT, MT, MT, etc.). In [19], the delay is predicted using
    the same parameters. PDR with signal-to-noise ratio is predicted in [20]. The
    major limitation of results presented in [18–21] is that the experimental data
    was collected using a single-hop topology. The current work focuses on the experimental
    data collected under multi-node scenarios.


    The rest of this paper is organized into 4 sections. The experiment details including
    topology and parameter configurations as well as the adopted ML method are described
    in Section 2. Section 3 elaborated on the statistical analysis between communication
    parameters and QoS metrics. Prediction results are detailed in Section 4. Section
    5 concludes the paper and highlights the significance of the research work as
    well as future leads.


    The limitations that motivate the present research can be summarized as follows:


    +   - Meeting conflicting QoS goals in prevailing deployments of WSNs and IoT
    requires solving complex optimization problems which are often NP-hard.

    +   - Conventional methods to improve QoS lack in adapting to evolving network
    parameters.

    +   - Configurable parameters provide an opportunity to fine-tune those according
    to the current need of the QoS.


    Based on the limitations and motivations the current research is intended to contribute
    the following:


    +   - Analyze the metrics like packet delivery ratio, throughput, and energy consumption
    as various communication 56parameter settings impact these metrics.

    +   - Use machine learning models to identify how each feature and different subsets
    of features contribute to determining the accuracy in predicting all the metrics
    considered.

    +   - Rank the features that yield the best prediction results in the context.


    The proposed work potentially lays down the foundation to realize an adaptive
    framework to facilitate QoS in the evolving IoT settings.


    # 2. Materials and methods


    The idea of this experiment was to carry out foundation work to build an intelligent
    framework for QoS predictions in WSNs. QoS Predictions in WSNs have gained attention
    recently.


    In our previous efforts [18–20], we have predicted metrics like packet delivery
    ratio, energy consumption, signal-to-noise ratio, and delay using various communication
    parameters as shown in Fig. 1. We adopted various machine learning models and
    used various communication parameter settings to train and test those models.
    The data used was collected using a two-node (1 sender, and 1 receiver) topology
    though. In this paper, we extended the idea to a broader perspective by considering
    a multi-node environment and included metrics like THP, detailed EC in terms of
    radio as well as CPU usage, in addition to PDR. To understand the behavior of
    these QoS metrics, we also included diverse parameters including TP, DT, IAT,
    PS, MT, and NN. In addition to these pre-configured variables, the actual number
    of Packets Transmitted (PT) and Maximum Packets (MP) that can be transmitted in
    a defined interval are also recorded.'
