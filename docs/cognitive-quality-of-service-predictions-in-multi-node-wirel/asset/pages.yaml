    # 3.2. Throughput


    The relationship of THP with different communication parameters is shown in Fig.
    5. Effect of PS and MT on THP is highlighted in Fig. 5(a). THP raises with the
    increase in both PS and MT values. This is intuitive because bigger packets reduce
    the control data proportion and increase the number of transmission attempts,
    and therefore can improve reliability. Fig. 5(b) reveals the effect of NN and
    TP on THP. As witnessed, THP decreases with an increasing number of nodes, whereas
    it increases with an increase in TP.


    Understandably, more nodes make it difficult for communication to take place simultaneously.
    The effect of PS and NN on THP is shown in Fig. 5(c). The trend of decrease in
    THP is very consistent with increasing NN and smaller packet sizes. The effect
    of NN and MT on THP can be witnessed in Fig. 5(d). In addition to the THP trend
    observed for NN, it can be observed that higher values for MT result in higher
    THP. Therefore, the behavior of THP against multiple parameters is consistent
    across these figures.


    The effect of MT and TP on THP is shown in Fig. 5(e). THP increases with an increase
    in both MT and TP values. However, TP appears to be more influential compared
    to MT. Similarly, the impact of PS and TP on THP is revealed in Fig. 5(f). THP
    increases as both PS and TP increase. Fig. 5(g) unveils the behavior of THP as
    IAT and PS are varied. It is apparent that THP increases with increasing PS and
    decreasing IAT values meaning that packets with more data bits sent at higher
    rates improve the throughput. The effect of PS on both PDR and THP is shown in
    Fig. 5(h). It has already been observed (Fig. 4(e)) that PDR tends to drop a bit
    with increasing PS. However, it casts a different


    impact on THP as it rises with bigger packet sizes. Therefore, PS proves to be
    a conflicting metric for optimizing PDR and THP simultaneously.


    Fig. 5(i) highlights the impact of DT on both PDR and THP. Distance casts a relatively
    consistent impact on both PDR and THP as increasing DT cases decline in both PDR
    and THP. Therefore, the role of DT appears to be more defining for these reliability-related
    metrics. Similarly, the impact of IAT on both PDR and THP is revealed in Fig.
    5(j). It appears that sending packets at shorter intervals causes improvement
    in THP. However, the same relationship between IAT and PDR diverges. Sending packets
    at a faster rate causes some decline in PDR. Therefore, IAT also impacts PDR and
    THP in a conflicting manner and requires careful fine-tuning.


    # 3.3. Energy consumption: Radio usage


    # 3.3.1. Listen mode


    The effect of PS and TP on the Listen period is shown in Fig. 6(a). The increase
    in the Listen period is clearly in direct proportion to PS. Although the rise
    in TP also causes Listen period to increase, however, the relationship does not
    appear to be as strong as of PS with the Listen period. The relationship between
    NN and PS with the Listen period is depicted in Fig. 6(b). Affirming the relationship
    of PS (Fig. 6(a)), NN also appears to cause a rise in the Listen period. Particularly,
    as NN increases to 24 (maximum), the Listen period increases too.


    # 3.3.2. Off mode


    The effect of PS and TP on the radio Off period is shown in Fig. 6(c). The radio
    Off period tends to decrease as PS increase, indicating that bigger PS drain more
    energy. However, the impact of TP does not appear to be very significant. However,
    there is a slight trend of decrease in the Off period with increasing TP levels.
    The relationship of the Off period with PS and NN is revealed in Fig. 6(d). Affirming
    the impact of PS (Fig. 6(c)), the impact of NN on the Off period is in inverse
    proportion. More nodes tend to increase the radio Off periods of the nodes.'
