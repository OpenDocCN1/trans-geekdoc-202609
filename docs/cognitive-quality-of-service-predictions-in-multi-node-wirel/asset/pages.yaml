    the number of nodes is set to 8, 16, or 24. The average node to node distance
    is a little over 2 m, whereas the receiver/sink is placed in the center of the
    network. The numbers of sending nodes are varied between 8 (black), 16 (black+green),
    and 24 (black+green+purple). The Fig. 2 is taken from the actual dashboard of
    the testbed and a cross is placed to indicate dysfunctional nodes due to maintenance
    or any other problem. Node 0–32 was not available during the time this experiment
    was conducted.


