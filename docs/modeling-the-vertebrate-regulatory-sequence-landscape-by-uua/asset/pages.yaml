    # SUMMARY


    The regulatory sequences of vertebrate genomes remain largely understood. To address
    this, we developed an ultra-throughput, ultra-sensitive single-nucleus assay for
    transposase-accessible chromatin sequencing (UUATAC-seq) protocol that enables
    the construction of chromatin landscapes for one-day experiment. Using UUATAC-seq,
    we mapped cis-regulatory elements across five representative vertebrate species.
    Our analysis revealed genome size differences across species influence the number
    but not the size of CREs. We introduced NVAce, a deep learning framework, to identify
    regulatory elements and predict dCRE landscapes dynamically from genomes with
    high precision. NVAce demonstrated that regulatory grammar is more complex than
    nucleotide sequences and that sequences govern distinct functional modules. Moreover,
    NVAce predicted the effects of mutations on lineage-specific CRE function, using
    causal trait loci (QTLs) and genome editing results. Our study provides a valuable
    resource for decoding the vertebrate regulatory landscape.


    # INTRODUCTION


    Diverse cells in a multicellular organism share the same genome but exhibit highly
    specialized functions due to gene expression. Regulatory sequences dictate gene
    expression patterns by recruiting sequence-specific transcription factors (TFs)
    in cell-specific manner. Chromatin accessibility is a master regulator of regulatory
    DNA that can be measured by DNase hypersensitivity, assay for accessible chromatin
    sequencing (ATAC-seq). While there have been several large-scale efforts using
    these assays to map genome-wide regulatory sequences in mammals,9-11. However,
    comprehensive cell-resolved maps of regulatory sequences are


    Advances in single-cell technologies have greatly enhanced our ability to study
    genetic regulation in biological systems,12-14. High-throughput single-cell sequencing
    methods, based on dropout,15,16,17 or split-pool,18 enable massively profiling
    of individual cells within


    selected cell populations or regulatory lists. These novel sets provide new standards
    for measurements of genomic transcriptomics,19 and proteomics,20 in biology and
    organism-lineage-specific regulation. While transient ATAC-seq focuses on lineage-specific
    gene expression, single-cell chromatin accessibility can capture the regulatory
    landscape itself


    landscape that governs transcription in each cell.21. Current technologies face
    difficulties in throughput and sensitivity, drop of DNA fragments, or potentially
    affecting data integration.


    The application of deep-learning models for prediction of regulation and expression
    signals from DNA sequences is a landmark in the genomic field,22. Very recently,
    deep learning has been used to predict chromatin accessibility and gene expression
    at the single-level,23. While NVAce achieves atlas-scale prediction of cell-type
    specific expression with single-cell resolution,24, Huutuo has


