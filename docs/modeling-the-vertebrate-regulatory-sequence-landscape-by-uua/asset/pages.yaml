    Application of NaWce

    Since NaWce is an integrated deep-learning model that performs multitask jointly
    to decode the genome to cell type, we extract its high-dimensional representation
    of genome sequences to understand the cause of lineage-specific chromatin. At
    the final layer, NaWce recognizes high-dimensional features in the genome sequence
    which relate directly to our unsupervised clustering (Figure S7). These sequence
    modules correspond to distinguished functions, such as module 1 for neural function,
    module 2 for RNA processing, module 3 for immune function, and module 4 for lipid
    metabolism (Figure S8). Our results show that NaWce identified cell-specific grammar
    in the sequence which might be the cause for lineage-specific chromatin patterns.


    To explore the sequences that are recognized by the NaWce model, we extracted
    deep-learning-based motifs using Transcription Factor Discovery from Information
    Source (TF-Motifs Disco) for each species. We visualized the predicted motifs
    for each species (Table S9). We plotted the cell-specific CRE tree to demonstrate
    the similarity among motifs (Figure S6). Deep-learning-based motifs can be mapped
    to known motifs (Figure S5), but we discovered a large proportion of short motifs
    not reported in existing studies^8,10. When we use the NaWce model to show the
    ~900 and -250 regions, we observed the signals of the 1000 bp window for the ~900
    regions were 5 times stronger than for the -250 regions. These provide new interpretation
    of function of CREs but also supported the idea that promoters and enhancers have
    a shared-chromatin architecture that is primarily defined by local features^5,66.


