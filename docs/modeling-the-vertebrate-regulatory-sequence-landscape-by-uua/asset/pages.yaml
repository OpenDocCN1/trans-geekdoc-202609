    We developed the large-scale scATAC-seq data with a standardized pipeline controlled
    by the size of genome (STAR Methods) and used UMAP for visualization of the data
    (Figures 3A–F). For each species, we identified major cells in the first round
    of clustering and verified different cell-type identities. We are able to identify
    rare subtypes from our mouse to uastac. In human, we identified 42 major clusters
    and 71 subclasses; in mouse, we identified 9 major clusters and 77 subclasses;
    in zebrafish, we identified 30 major clusters and 54 subclasses; in zrafish, we
    identified 32 major clusters and 51 subclasses. We then annotated and assigned
    the cell label for each cluster and subclass based on the accessibility of cell-specific
    features (Table S1).


    Most vertebrate cells share the same cell labels across species, including erythroid,
    immune, hepatic, epithelial, neural, muscular, and endothelial cells (Figures
    3A–F).


    We observed many differences in cell-type diversity between species. For instance,
    some immune-related fibroblasts were only seen in mouse, and gecko. We found many
    unconventional and myotic and zebrafish-specific subtypes directly from the uastac
    genome, whereas zebrafish has the least number of cell-specific types (https://bis.zju.edu/uastac).
    Moreover, we observed different differences in accessibility of sub genomic regions
    between zebrafish and uastac. We found that some open regions were open only in
    mouse, and, and not zebrafish.


    vent the limitations of arbitrary peak extension and offer a more accurate representation
    of native accessibility. We showed that, compared with the conventional peak calling
    method, we defined here a much higher correlation with DNase I hypersensitivity
    levels (Figure 4B). We then merged these regions to identify non-overlapping cREs
    for five species (Table S5). In mouse, 56.2% of cREs were verified by the ENCODE,
    but 43.8% of cREs were previously undetected. These new cREs have higher GC content
    and regulatory elements (Table S3–S4). Further investigation revealed that these
    accessibility elements were originated from rare cells that the ENCODE consortium
    misses, including neurons in birds, reptiles, and amphibians, as well as the adrenal
    gland and somatosensory cells in the primate genome (Figure 5G).


    To validate these cREs using multi-omics data, we performed CUT&TAG experiments
    in mouse adrenal gland and primate cell types using antibodies against H3K4me3,
    H3K4me1, and H3K27ac (H3 Lysine 4 trimethylation, acetylation, and CCCTDC-binding
    factor). We found that 60–70% of new cREs defined using ATAC-seq could be verified
    by CUT&TAG (Figure 5H). These regions were enriched in both primate adrenal gland
    and zebrafish, and nearly all of the zebrafish-specific REs are new. In total,
    we identified 6,182,084 cREs with high resolution (Figure 4D, Table S5).


