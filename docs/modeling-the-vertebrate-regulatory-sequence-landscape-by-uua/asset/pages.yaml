  img_proc: true
- pgno: 34
  md: '# Model performance evaluation


    The prediction of models on different datasets was measured by the area under
    the receiver operating characteristic curve (AUROC). The accessibility prediction
    performance was evaluated on a completely held-out test chromosome, which was
    not used during hyperparameter optimization and had never seen by the training
    model to avoid information leakage.

    We displayed the AUROC for each lineage for species-trained model. Using the binarized
    peak matrix derived from the mouse chromatin profile of 5,034 nuclei, we produced
    the dataset for model benchmark. Notably, our NvCA model outperformed models such
    as Nwawa¹ and scBase²² and classical frameworks such as Transformer and Recurrent
    Neural Network (RNN) evaluated by AUROC. To evaluate the predicted relationships
    in the held-out chromosome for test, we computed correlations between predicted
    and observed chromatin accessibility test profiles at the subcluster level. Adjusted
    mutual information (AMI) was used in quantifying the extent to which the predicted
    cell aligns with the actual cell types, offering a nuanced and informative assessment
    of the model''s performance in capturing the underlying lineages.


    # Cross-species prediction for UA elements


    The unlabeled (UA) elements were defined by converting the coordinates of COREs
    in chicken, zebrafish and zebrafish genome reference (mm10) using UCSC liftOver
    and the available UCSC files. We made sequences uniform unifying the UA elements
    (500bp size with 100bp step size) using the ‘builds makindows -b UIA -w 500 -s
    100’ command. The accessibility of sequences was predicted by the pretrained model
    and accelerate continuous signals. Based on the chromatin accessibility profiles,
    we identified the predicted accessible regions by running “macc3 bdgapeak” command.
    The conservation of sequences was represented by the ratio of UA elements predicted
    accessible to all UA elements. This was repeated for all combinations of fish,
    mouse, mouse, and zebrafish pretrained models with UA elements in other species.


    # De novo prediction of single-cell tracks for human and mice


    First, we firstly normalized accessibility profiles for each query with NvCA by
    running a forward pass on the peak set. We used the input DNA sequence as the
    output of bottleneck layer as a latent embedding for each peak. We then generated
    the accessibility profiles across all cells by the product of bottleneck layer
    with the weighted matrix extracted from the collected layer. The accessibility
    profiles served as the base for further analysis, including dimension reduction
    through uniform manifold projection (UMAP) and Singular Value Decomposition (SVD)
    with a resolution of 0.2 in Signatures³ pipeline. Finally, we utilized t-SNE to
    represent a representative predicted cell profile for human and mice.


    # Predicting genome-wide chromatin accessibility for different species


    We extracted 500bp window with a step size of 100bp to identify the different
    species of elements. By using the ‘buildseqs makindows -w 500 -s 100’, we extracted
    the sequences using the ‘to-getfasta fasta’ command. Applying the NvCA model trained
    on human mouse datasets, we predicted chromatin accessibility profiles within
    these windows. This enabled the generation of genome-wide predictions for each
    individual nucleus, which were aggregated at the subcluster level. To provide
    a comprehensive evaluation, we utilized the Genomics Viewer (IG-2-16),⁴⁵ displaying
    the predicted open regions and the experimental data data.


    # Comparison of predicted and experimental human CREs


    To assess the consensus between predicted and experimentally measured regulatory
    landscapes, we generated genome-wide cell-type specific sc-CREs (endothelial cells,
    macrophages, and smooth muscle) from CATLAS⁴⁶ (https://catlas.org/downloads/human/sigwig).
    The scATAC-seq signal charts were scaled to the [0,1] interval using min-max normalization
    to match the distribution of predicted-accessibility scores. The correlation analysis
    was performed using the ‘bi.wigSummary’ function from deeptools (v3.5.2) with
    the ‘bins’ argument.⁴⁷ We retained the normalized signal with a resolution of
    0.01 in both predicted and experimental scores to ensure robust correlation. We
    identified the predicted signal and interacted with cCREs from NvCA encoder v3
    (https://github.com/jue-lab/NvCA),⁴⁸-overlapping peaks were reported as “ne-CREs”.
    With top peak categories, cell-type-specific distributions and nucleotide-resolution
    profiles were computed and summarized.


    # Motif identification and visualization from NvCA


    To extract motifs from our NvCA, we utilized the TF-Motisif that combines single-nucleotide
    importance scores for generic sequence patterns. By sampling 10,000 cells and
    evaluated the saliency scores for each task, we improved the computational efficiency
    of TF-Motisif. Motif similarity was then queried by the JASPAR2024 database using
    TomTom algorithm⁴⁹ We applied motif⁵⁰ package to visualize the relationship between
    motifs derived from NvCA trained for species.


    e14 Cell 188, 5343–5362.e1–e16, September 18, 2024'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# Cell Resource


    The mouse embryo cREs were categorized into two classes: broad and narrow cREs,
    as described previously. We generated regions by tiling the cREs (500bp with 100bp
    step size) using the "tools makewindows -b IU -s 100" command. For each region,
    we extracted the sequences from the forward strand and input into the mouse model
    to predict accessibility.


    # Cross-species prediction of homologous gene chromatin accessibility


    To validate the generalization ability of the model, we utilized the predicted
    mouse model to predict the chromatin accessibility on homologous genes of HGB1,
    mouse Hb-b and human HGB1. The sequences 500bp upstream of the target gene TSS
    were extracted using "bedseq gefasta" and input as a forward propagation to get
    the predicted accessibility levels. Furthermore, he predicted accessibility compared
    to experimental accessibility and RNA expression profiles. The experimental accessibility
    was characterized by the gene sequences by ACCh on scATAC-seq data. And the RNA
    expression was measured using normalized count of scRNA-seq data.


    # Regulatory sequence motif identification


    We selected 55,397 cREs, with each length of 500bp located within 1000bp upstream
    of the TSS. We performed forward passes and extracted predictions from the NextSeq
    Nvace model to predict regulatory sequence to embedding. Dimensional reduction
    and clustering of the 55,397 ~ 1,024 embeddings were implemented using the "scipy"
    python package (v1.9.3) with default parameters. Regulatory sequences were then
    classified into classes. For each class, GO ontology enrichment and the top five
    terms were visualized in heatmap.


    # Fine-mapped prediction and validation


    We used 361 fine-noncoding risk variants as identified by Zhang et al.¹¹ For each
    variant, we predicted a 500bp sequence centered on the target base, with 9 additional
    sequences containing random mutations. Two forward passes were performed using
    Nvace model for both the mutant and reference sequences. We computed the difference
    in predicted model output for each mutant relation to reference: (mutant)-(reference)
    across all loci.


    # Causal non-coding QTL prediction and validation


    We used non-coding QTLs using human gene discovery, as reported by D. Cooper.
    To ensure precise identification of our variant analysis, we focused exclusively
    on heterozygous humans. Homozygous alleles were excluded due to potential additive
    damage effects. For each QTL located within the promoter region of the target
    gene, the promoter sequences 500bp upstream of the TSS for HGB1, Hb-b and F9 were
    extracted as reference sequences. Metrics were computed using insertion base analysis
    at the location within the 500bp sequence, corresponding variants with a random
    mutation. Two forward passes were then performed performed using Nvace model for
    both the mutant and reference sequences. We computed the difference in predicted
    model output for each mutant relation to reference: (mutant)-(reference) in erythroid
    cell (HGB1, Hb-b) and hematopoietic (F9).


    # Functional prediction of synthetic mutagenesis


    We performed silico analysis and predicted the variant effect using gold standard
    data from adenine-base (ABE) references. We then refined the prediction using
    Biostart, to fine-tune Nvace model trained on female mouse model of hematopoietic
    lineages. With a 500bp sequence centered around each ABE target (chr1:G4526781),
    we included the fixed mutant and reference sequences. We computed the difference
    in predicted model output for each mutant relation to reference. Using Pearson
    correlation coefficient (P) and accuracy (ACC), we confirmed the capacity of Nvace
    model for prediction of synthetic effect at single base-pair. Inefficient RNA
    targets were measured by excluding signals between the 1st and 3rd quantiles of
    observed changes (z-score HGB1 linear functional effect >>2 and <1.2). The result
    showed that the correlation between predicted effect of each ABE sequence from
    Nvace and the experimental phenotype is 0.9, and the prediction accuracy (ACC)
    is 1. The top 10% effective mutations were predicted and shown in Figure 3.


    # Benchmark of Nvace model in predicting effect with MPRA and multi-omic model


    We performed silico analysis benchmark Nvace model with the MPRA model (Malinos
    et al.³) and ENCODE predicted multi-omic model (ChromBPNet⁴) with dataset screening
    from human lineage. Input sequences 200bp for Malinos, 214bp for ChromBPNet The
    mutation is inserted in the first class of the locus of the input sequence for
    each model. Computational pipelines were implemented under each framework''s recommended
    parameters to quantify variant effect in erythroid lineage lines. For ChromBPNet,
    a two step method was used for predicting the additive effect of two base pair
    changes, but only one is allowed for the input at'
