    # Axolotl peripheral blood mononuclear cells


    The axolotl was anesthetized and euthanized after a defined volume of blood was
    collected from the heart using an EDTA-treated hematocrit capillary. The blood
    was transferred into an Eppendorf tube containing an equal volume of 50 mM EDTA-PBS.
    Cells were thawed five times. After centrifugation at 700 g for 5 minutes at 4
    °C, the supernatant was removed, and the pellet was resuspended in 1 ml of distilled
    water and set aside for 3 minutes. Usually, 80 μl of PBS was added and mixed briefly
    by vortexing. The lysis step was repeated until the supernatant became clear.
    The supernatant was removed, and 1 ml of Resowl Park Minimal Medium (RIMP) 1640
    medium was added to suspend the cells. The cell count was determined, and the
    cells were dispersed into a 6-well plate with a 10 mm cover at the top. The plate
    was placed in an incubator (37 °C, 5% CO2) for 2 hours. Non-adherent cells were
    carefully washed away with PBS. The cells were then incubated at 37 °C for 2.5
    ml of RPMI-1640 medium containing 10% FBS per well.


    # Mouse peritoneal/macrophage


    The mouse was anesthetized and sterilized with 70% EtOH. The peritoneal abdomen
    was opened, and 6 ml of 1 x PBS was injected into the peritoneal cavity. The mouse
    abdomen was gently opened, and peritoneal fluid was collected and transferred
    into a tube (20 ml containing of 0.1-1 x PBS). The supernatant was centrifuged
    at 4 °C and 350 g for 5 minutes. After centrifugation, the supernatant was removed.
    The cells were resuspended in RPMI-1640 medium containing 10% FBS and seeded into
    a 6-well plate with a 10 mm cover at the top. Incubated at 37 °C for 2 hours.
    Non-adherent cells were carefully washed away with PBS.


    # Chromatin staining and Super-resolution microscopy


    Cells were incubated for an 1 hour with 5 ml medium containing 1 μM EGF. Fixation
    and permeabilization. EU cells were stained with α488-antibody (through a click
    reaction, chromatin was stained with Dchst-3342 (Baychst)). Super-resolution images
    were obtained using stimulated emission depletion (STED) or CellB STORM. Spherical
    aberration was minimized using optical immersion with diffraction correction.
    Data were collected at 2 nm with 0.5 power and 3-5 nm step size. Spherical aberration
