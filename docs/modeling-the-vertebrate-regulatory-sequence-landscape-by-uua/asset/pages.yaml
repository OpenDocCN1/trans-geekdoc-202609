    each 10M indexed hB, dissolved in 10mM Tris-HCl pH8.0. The 2 indexed lysis buffers
    were allocated into 12-tube strips and distributed 3µL per well across 96-well
    plates using a 12-channel pipette, with each column representing a unique barcode.
    Nuclei were resuspended in (10mM NaCl and MgCl, 10mM Tris-HCl pH7.5) and adjusted
    to a concentration of 50 to 100 nuclei/µL. The nuclear density is three-fold the
    product of the number of Tn5 barcodes and Ligation barcodes. Nucle density reduces
    the rate of dublet communication. Typically, we used a nuclear concentration of
    100 (192*768/96 nuclei/µL). 3µL of suspension (150 to 147 nuclei) was added to
    each of the well plates. Nucleus lysis and adapter switching were performed using
    the following protocol: 55 min at 15°C; 65 min at 5°C; 55 min at 5°C; 5 min at
    -1°C to 0°C; 50 min and 30 min at 0°C; to neutralize, 3µL of gapilling buffer
    (1.5 + 10.0 - Reaction buffer, NEB1) was added to each well, followed by centrifugation
    at 3000 g, 5 min at 4°C to remove the debris. Then, µL of 10mM DNTP was added
    and incubated at 37°C for 30 min. The reaction to modify transposition concentration,
    only 24 B oligonucleotides were used. If additional, their corresponding barcodes
    could be obtained from the Sequencing insert (see Table S1). The scale of the
    experiment, including the number of cells, B reagents, volumes, can be reasonably
    adjusted according to the desired single-nucleus data required for subsequent
    analyses. Based on this setup, one can generate data for 1 million nuclei.


    The temperature-controlled adapter switching represents a key innovation in our
    protocol, preventing thermal regulation to enable robust in vitro adapter switching
    (Figure B). The bridge oligo (Tm 58°C) and Adapter I (A, Tm 56°C) were used; the
    bridge oligo fully dissociates, ensuring high-affinity binding for h-B oligonucleotides
    (at 10+ minutes). During the gradient phase, h-B preferentially binds to the genomic
    DNA 3'' end, the adaptor region and the sequence within h-B, fully anneal to the
    DNA end. The gap-filling phase completes two steps: first, the 9-nucleotide gap
    between the two bases is filled and ligated to the nick to generate a continuous
    DNA strand, which serves as the template for subsequent primer ligation. T4 DNA
    ligase was used for strand ligation, and adapter B2 was incorporated into the
    primer-phase because it operates effectively at higher temperature. The temperature
    gradient allows for gap-ligation to occur at elevated temperatures necessary for
    gap repair, simultaneously optimizing ligation efficiency. This temperature-sensitive
    approach achieves near adapter replacement in the UIAAC-seq protocol. It ensures
    highly specific PCR linker addition and resolves the issue of self-tagging in
    hetero-adapter-ATAC-seq (Figure B).


    # cRE Amplification (First round of indexing)


    Using an 8-channel pipette, the gapfilling fragments from 96-well plates were
    pooled. Specifically, the 12 µL from each well was collected and transferred to
    1.5 µL of Epuffer buffer. This resulted in a total of 9 new volumes to remove.
    5µL of VHAN DNA Polymerase (V3, no. C44011) was added to each tube, and PCR was
    performed for full amplification. Each amplified product was diluted with 2µL
    of 2X HotStart Taq (BiosKystems, no. K2020) and 1µL of 5''-ATAC primers. The products
    were pooled on a 96-well plate. PCR was performed with mix of 2µL of 2X HotStart
    Taq (per well) with the following conditions: 5 min; 2 min at 90°C; 20 min at
    65°C; 2 min at 72°C; 11-14 min at 90°C; 20 min at 65°C; 30 min at 72°C; 3 min
    at 80°C; and stop. To remove residual primers and fragments, the amplified products
    were purified with VHAN DNA Clean Buffer. Briefly, 25µL of Clean Beads were added
    to each well, and the supernatant was transferred to the mixture, and excess primers
    were removed by centrifugation. An additional Clean Bead was added to the mixture
    to capture the assembled strand. The scale of the fragment amplification setup,
    including required reagent volumes and numbers, can be properly adjusted based
    on the amount of nuclei required for a single experiment.


    # Sequencing on Illumina DNSEQ-T


    For NGS sequencing (PE1150.0, no. C940-002809-2), labeled with detection sequencing
    indexes were used in molar ratios to achieve a total of 40 ng per cell, with an
    expected output covering approximately 70,000 nuclei. The pooled libraries were
    sequenced using the VANHT Kit for NGS (Vamine, no. NM2201) to generate single-stranded
    cDNA, which was subsequently used for the sequencing of DNA Nanoblocks (DNA) in
    accordance with the manufacturer'' guidelines. Following this, all sequences were
    sequenced on the DNSEQ-T platform using a custom sequencing + 19 cycles: Read
    1: 24 cycles + 10 cycles + 19 cycles + 90 cycles; Read 2: 10 cycles + 30 cycles
    + 19 cycles + 91 cycles. Each chip runs can be performed simultaneously, with
    a single chip loading approximately 5000 reads, corresponding to data for around
    70,000 nuclei.


