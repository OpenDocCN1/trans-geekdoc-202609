    peaks, and differentially (DA) peaks (Figure 2E) were significantly improved.
    The middle sequencing depth (UM/UF=1.647) maximized cost-effectiveness since most
    fragments were detected at this depth. In the main body, the peaks of majority
    were assigned to introns, indicating that many contain abundant regulatory elements
    (Table S2). Additionally, we used the rate of double-strand cutting events (7%)
    to optimize the overall recovery efficiency (STAR Methods). A ratio of about 25%
    for total molecule recovery should be the limit of coverage of open chromatin
    peaks (Figure 2G).


    We spent 1 day for library generation of more than one million barcoded nuclei
    and 1 day for sequencing half of the library. With moderate sequencing depth,
    284,269 nuclei passed the filter in a single experiment. The quality of this experiment
    was exceptional compared with single-batch data of all other methods (Table S2).
    Cumulative UF enrichment of nuclei recovered by a single UATAC-seq experiment
    was much higher (Figure 2H). Overall, we believe that UATAC-seq offers ultra-high
    throughput and ultra-efficiency for large-scale cell datasets.


    Next, we benchmark UATAC-seq against nine other protocols on mouse brain, tissue
    and tissues (Table S3). UATAC-seq outperformed all other methods because the number
    of nuclei processed and sequenced were standardized pipeline. We found that UATAC-seq
    showed the highest UF (Figure 2F), the highest peak number (Figure 2G), the highest
    FPR (Figure 2H), the highest DA peaks (Figure 2I), and the highest duplicate rate
    (Table S2). In addition, UATAC-seq showed high TSS enrichment (Table S2), the
    highest reads in promoter (Figure 2S), and the highest promoter rate (Figure 2F).
    With comparison to sequencing depth, UATAC-seq showed the best TSS score and accessibility,
    showing a high level of sequencing efficiency, and we found that high FPR has
    a negative correlation with TSS enrichment and UATAC-seq achieved high FPR values
    regardless of sample size number (Figure 2S). UATAC-seq uses nuclei for chromatin
    profiling, de-novo accessibility (Table S2) and better recovery of CRE in inactive
    regions.¹17 Foot profiling analysis from UATAC-seq showed similar patterns with
    the other methods. Finally, of all available mouse snATAC-seq methods, the cell
    types identified were consistent with the published mouse models (16–48). UATAC-seq
    detected all major cell types in the mouse brain (Figure 2J, Table S2).


    The construction of chromatin accessibility layers for vertebrates


    The performance of UATAC-seq prompted us to highlight the relationship between
    genome sizes and regulatory mechanisms, which we covered with diverse genome species,
    including zebrafish, gecko, chicken, and mouse. Due to the ultra-throughput UATAC-seq,
    we were able to construct a chromatin accessibility layer for each organ in a
    single-day and single-batch experiment. For gecko, male and female samples were
    from three individuals; and for zebrafish, samples from three individuals; all
    samples were pooled from each individual.


