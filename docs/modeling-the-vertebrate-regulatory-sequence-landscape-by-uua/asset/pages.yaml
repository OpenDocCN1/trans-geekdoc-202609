    # RESULTS


    Construction of the single-cell sequencing platform suitable for high-resolution
    landscape construction, we built UATAC-seq technology. In UATAC-seq, we used a
    novo transposase to incorporate into the bounds of open genomic regions (Figure
    1A). After end-split, the second round of DNA was handled via ligation and hybridization,
    followed by another round of ligation with a temperature-controlled transposase
    to add to both ends of reads (Figures 1A and 1B). We then used gap-fill and ligation
    to prepare the template and then PCR to incorporate the fourth round of barcodes
    and generate the sequencing library. The sequence quality is detailed in Table
    S1.


    This approach avoids cross-contamination from differing indexes and prevents sample
    loss by reducing reagent changes. UATAC-seq has advantages over all single-nucleus
    ATAC-seq (snATAC-seq) protocols, including s-ATAC, and 10x-ATAC (Figure 1A). UATAC-seq
    uses a unbiased transposase, which overcomes


    To benchmark UATAC-seq on tissue cells, we analyzed 41,672 adult mouse brain cells
    using UATAC-seq. We observed the fixation of quality relative to the pipeline
    (Figure 1) and used manifold alignment and projection (UMAP) for visualization.


    Different DNA genes on library construction and found that the DNA ligation efficiency
    improved by UATAC (Figure 1F).


    To assess the efficiency, we found that the enrichment score of ATAC-seq degrades
    under 55°C over 5 minutes (Table S2). Compared with other methods, UATAC-seq exhibits
    advantages in terms of sensitivity, specificity, and cost (Figure 1).


