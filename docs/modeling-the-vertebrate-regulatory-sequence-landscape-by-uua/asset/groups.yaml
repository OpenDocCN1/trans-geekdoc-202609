    the ‘bins’ argument.⁴⁷ We retained the normalized signal with a resolution of
    0.01 in both predicted and experimental scores to ensure robust correlation. We
    identified the predicted signal and interacted with cCREs from NvCA encoder v3
    (https://github.com/jue-lab/NvCA),⁴⁸-overlapping peaks were reported as “ne-CREs”.
    With top peak categories, cell-type-specific distributions and nucleotide-resolution
    profiles were computed and summarized.


    # Motif identification and visualization from NvCA


    To extract motifs from our NvCA, we utilized the TF-Motisif that combines single-nucleotide
    importance scores for generic sequence patterns. By sampling 10,000 cells and
    evaluated the saliency scores for each task, we improved the computational efficiency
    of TF-Motisif. Motif similarity was then queried by the JASPAR2024 database using
    TomTom algorithm⁴⁹ We applied motif⁵⁰ package to visualize the relationship between
    motifs derived from NvCA trained for species.


