    # 在饱和突变中


    为了计算序列中所有核苷酸的重要性评分，并识别可能显著影响基因表达的关键调控元件，我们对 HBG1 的上游 500 bp 序列进行了饱和突变（ISM）。对于每条序列，我们进行了三次
    NwaCE 操作，每次迭代将参考核苷酸突变为备选核苷酸。对于每次突变，我们计算了参考核苷酸的可及性预测，以计算每个细胞的可及性差异。我们对每个位置四个核苷酸（A/T/C/G）的
    ISM 分进行了归一化，确保得分之和为零。该位置参考核苷酸的归一化 ISM 分作为性评分，反映了其对可及性的贡献。通过可视化 HBG1 上游 500 bp
    序列中每个碱基的重要性评分，并使用 FIMO 扫描序列，我们识别出了几个之前报道过的基序，例如 CCAAT box 和 TAL1 基序。


    # NwaCE 在预测谱系特异性 cRE 中的评估


    我们从 CODA 平台（Malinois7）生成的细胞类型特异性 CRE 中选择了顶级最优序列。具体而言，我们使用了 FastSeqProt 算法生成的序列，它们通过
    MinGap 指标量化出最高的细胞类型特异性。对于 KS6、HepG2 和 SK-N-SH 三种细胞类型，分别选择了 MinGap 值最高的前 10 条序列。我们将这些选定的序列直接输入
    NwaCE 模型，预测了它们在红细胞、肝细胞和神经谱系中的可及性。在 30 个输入序列中有 29 个观察到了预期的谱系特异性（表 S7）。


    # 量化与统计分析


    统计分析使用 R (v. 4.3.1) 和 Python (v. 3.8) 进行。比较使用非配对 Wilcoxon 秩和检验，配对样本比较使用配对 Student
    t 检验。相关性通过 Spearman rho 或 Pearson r 分析计算。所有统计检验均为双尾，p 值 < 0.05 被认为具有统计学意义。显著性水平所示：*p
    < 0.05; **p < 0.01; ***p < 0.001; ****p < 0.0001。对于所有箱线图，中间线和箱体代表 25 百分位数、75 百分位数，须线对应
    1.5 倍四分位距。基因编辑结果的 qPCR 分析，误差棒对应三次重复的标准差。


