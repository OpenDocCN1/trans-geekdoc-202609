    \ 310011\n*2 浙江大学实验室，杭州 311121\n*3 浙江省组织工程与再生医学重点实验室，孙立博士与干细胞再生医学中心，杭州 310008\n\
    *4 浙江大学血液学研究所，杭州 310006\n*5 这些作者贡献相同\n*6 首席内容\n* 联系邮箱：xhan@zju.edu.cn (X.H.),\
    \ ggji@zju.edu.cn (G.G.)\nhttps://doi.org/10.1016/j.cell.2025.06.020\n\n# 摘要\n\
    \n脊椎动物基因组的调控序列在很大程度上仍不为人知。为了解决这个问题，我们开发了一种超高通量、超敏感的单核转座酶开放染色质测序（UUATAC-seq）方案，能够在单日实验中构建染色质图谱。使用\
    \ UUATAC-seq，我们绘制了五种代表性脊椎动物的顺式调控元件（CRE）。我们的分析显示，物种间的基因组大小差异影响了 CRE 的数量而非大小。我们引入了深度学习框架\
    \ NVAce，以高精度识别调控元件并从基因组动态预测 dCRE 图谱。NVAce 表明调控语法比核苷酸序列更复杂，且序列控制不同的功能模块。此外，NVAce\
    \ 利用因果性状位点（QTLs）和基因编辑结果预测了突变对谱系特异性 CRE 功能的影响。我们的研究为解码脊椎动物调控图谱提供了宝贵的资源。\n\n# 多细胞生物中的多种细胞共享相同的基因组，但由于基因表达表现出高度特化的功能。调控序列通过以细胞特异的方式募集序列特异性转录因子（TF）决定基因表达模式。染色质开放性是调控\
    \ DNA 的主调节因子，可以通过 DNase 超敏感性测序、开放染色质测序（ATAC-seq）进行测量。尽管已有若干大规模努力使用这些测序绘制哺乳动物的全基因组调控序列，但详尽的细胞分辨率调控序列图谱仍然匮乏。单细胞技术的进步极大增强了我们研究生物系统中遗传调控的能力。基于脱落（dropout）15,16,17\
    \ 或拆分池（split-pool）18 高通量单细胞测序方法能够对选定细胞群中的细胞进行大规模分析。这些新方法为基因组转录学和蛋白质组学的测量提供了新标准。瞬时\
    \ ATAC-seq 侧于谱系特异性，而单细胞染色质开放性可以捕捉控制每个细胞转录的调控图谱。目前的技术在通量和灵敏度方面面临困难。应用深度学习模型从 DNA\
    \ 序列预测调节和表达信号是基因组领域的里程碑。最近，深度学习已用于预测单水平的染色质开放性和基因表达，NVAce 以单细胞分辨率实现了细胞特异性表达的图谱级预测，Huutuo\
    \ 184, 533-548. 2025. 作者发表。由 Elsevier Inc. 出。这是一篇基于 CC BY（https://creativecommons.org/licenses/by/4.0）的开放获取文章。\n\
    \n# CellPress\nOPEN ACCESS\n\n在几乎所有细胞中在核苷酸水平上解码疾病相关的调控序列。遗憾的是，大多数细胞数据在灵敏度或通量方面存在局限性，限制了高精度模型的生成能力。基因组领域深度学习模型的优化仍面临挑战，而蛋白质结构模型已取得成功。在本研究中，我们使用了同源接头转座酶和温度控制测序，提高了\
    \ ATAC 检测的灵敏度和通量。我们利用超高通量、病毒单核 ATAC-seq（UATAC-seq）转座酶绘制了开放染色质。\n"
