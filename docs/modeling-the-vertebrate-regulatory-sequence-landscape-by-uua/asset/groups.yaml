    Figure S1. Comparison between schematic of UUATAC-seq and four scATAC methods,
    related to Figure 1

    (A) UUATAC-seq uses homo-adaptor transposase and temperature-controlled adaptor
    switching to increase the sensitivity and four rounds of barcoding to the throughput.
