    # METHOD DETAILS


    Indexed Enzyme Preparation for UATAC-seq by Vazyme Biotech Co., Ltd., to a final
    concentration of 100 µL. For Tn5 primers were dissolved in Annealing Buffer, 1
    µL aliquots of Tn5_primerA and 1 µL of Tn5_primerB (see Table S1 for details)
    were incorporated into individual wells of 96-well free plates, generating a total
    of 192 unique barcodes distributed across two plates. The annealing reaction was
    performed as follows: denaturation at 95°C for 3 minutes, followed by a gradual
    temperature reduction at a controlled rate of -0.1°C/s through sequential incubation
    steps at 75°C for 15 minutes, 60°C for 10 minutes, 50°C for 10 minutes, 40°C for
    10 minutes, and 25°C for 30 minutes. The annealed primer complexes were stored
    at 4°C until required for sequencing.


    For Tn5 transposition assembly, 48 µL of Transpose Enzyme (2µg/mL), synthesized
    by Vazyme (cat.S1110-01) was combined with 18 µL of Coupling Buffer, and 12 µL
    of mixture were distributed to each of the annealed adapter plates. The 96-well
    plates were sealed and centrifuged at 300 x g for 5 minutes at 4°C. The plates
    were placed on a rotary mixer at 10 rpm and incubated at temperature (22-25°C)
    for 10 minutes. The reaction was stopped after 60 minutes to complete adapter,
    by adding 5 µL of Stop Buffer Vazyme Biotech Co., Ltd. which was added to each
    well. The resulting product, denoted as Tn5 Transposase Assembly (TEA), was stored
    at -20°C until one year.


    # Sample Collection from Mouse, Chicken, Goose, Axolotl, and Zebrafish


    Organs and tissues were collected from 5 mice, eight-week old female mouse, one-week
    male mouse, two-year-old female chicken, one-year-old female goose, three-year-old
    male mice, and 16-week-old zebrafish (4 females and 4 males).


    For mouse tissue, the animals were first washed and subjected to anesthesia via
    intravenous injection of 1% sodium perobarbital for mobility. The tissues were
    dissected under perfusion with 20-30 µL of PBS-Buffered Saline (PBS). Organs were
    collected in the following sequence: stomach, spleen, pancreas, lymph nodes (nodal,
    abdominal aorta, carotid, and cervical nerves), thyroid, muscle, diaphragm, cerebellum,
    brainencephalon, brainstem, pituitary, tencephalon, thymus, heart, liver, kidney,
    adrenal, ovary and uterus (in females), bladder, prostate, and testis (in males),
    muscle (hind legs), and bone marrow was extracted from the femur and tibia. Residual
    muscle was removed from the bone site. The bone marrow shaft, which was then flushed
    with PBS/2mM EDTA using a 1 mL syringe with a 26 gauge needle. The marrow was
    collected in a tube.


    Center the mixture to obtain cell suspension. The tissues were filtered through
    a 40 µm strainer (Biologic), collected into a 15 mL centrifuge tube, and centrifuged
    at 300 x g for 5 minutes. The organs were then collected: aorta, brain, cerebellum,
    brainstem, cecum, cloaca, endocrine gland, glandular stomach, thymus, and pancreas.
    For zebrafish, fish were anesthetized with an interperitoneal injection of 1%
    sodium perobarbital and subjected to transfection with 20-30 µL of PBS. The tissues
    used were dissected: bladder, brain, cloaca, eye, fat, heart, intestine, kidney,
    liver, muscle, ovary, skin, skin, tail root and tip. Zebrafish were anesthetized
    using 0.1% ethyl 3-amino-methanesulfonate under transfection with 0.8x PBS. The
    collected tissues included: bladder, brain, cloaca, gallbladder, heart, kidney,
    liver, lung, pancreas, stomach, and viscerera.


    For all tissues except bone marrow, samples were frozen with cold (0.8x PBS) dry
    ice-wrapped paper, and manually pulverized using mortar and pestle. For mouse,
    the cell pellet was directly resuspended in 1 mL of NIB and incubated for 2 minutes.
    The Nuclease inhibition formulation and incubation time were optimized for each
    tissue. The nuclear suspension was transferred to a 15 mL centrifuge tube pre-primed
    with 5 mL of cold water buffer (WB, 0.2% BSA and 3 mM MgCl in DPBS), filtered
    through a 40 µm cell strainer, and centrifuged at 600 x g for 5 minutes.*


    # Nuclease Inclusion from Tissues


    For all tissues except bone marrow, samples were frozen with cold (0.8x PBS) dry
    ice-wrapped paper, and manually pulverized using mortar and pestle. The pulverized
    tissues were suspended in 1 mL of NIB and incubated for 1.5 to 3 minutes to allow
    lysis. For mouse, the cell pellet was directly resuspended in 1 mL of NIB and
    incubated for 2 minutes.


    A detailed description of all experiments is provided in Table S2.'
