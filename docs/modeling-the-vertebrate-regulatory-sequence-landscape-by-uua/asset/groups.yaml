    # CUT&Tag


    The assembly of pg-Trn5 was carried out following the manufacturer''s protocol
    (Vazyme, cat no. SG601). Briefly, 20 µL of pg-Trn5 (500 ng/mL) was mixed with
    adapter oligonucleotides to generate an adapter-loaded complex. The assembled
    complex was subsequently diluted to a final volume of 180 µL using coupling buffer.
    The final product, referred to as TT-cte, was stored at -20°C, where it remains
    stable up to one year. And pituitary glands were isolated from three wild-type
    mice, with biological replicates designated as follows: after dissection, CTCF
    was collected in the nuclei of male mouse (WT1), H3K4me1 in a male mouse (WT2),
    and H3K4me3 in a male mouse (WT3). For nuclei, CTCF, H3K4me1, and H3K4me3 were
    assembled in male mouse WT_1, WT_2, and WT_3, respectively. Muscle tissue was
    harvested and homogenized in lysis buffer. The previously pulsed cells were then
    incubated in Nuclease Lysis Buffer B (containing 0.5% BSA, 0.05 mM NaCl, 1 mM
    KCl, 0.1 mM DTT, and 1x Roche Phosphatase Inhibitor in DPI) and incubated for
    0.5 min. For CUT&Tag tagging (Abcam, cat no. ab28837), nuclei were washed with
    1% formaldehyde for 2 minutes at room temperature, and the reaction was followed
    by adding glycine to a concentration of 50 nM. The mixture was then washed with
    Dution Buffer (containing: 0.5% Triton-X100, 0.5 mM NaCl, and 0.2% BSA in PBS)
    to a concentration of 1 microliter per nucleus using Dution Buffer and resuspended
    in 5 µL of NaCl at 10 mM KCl. For CoX-tagging (cat no. ab12502), 5 µL of MnCl2
    were activated activated before using 5 µL of beads per test in Binding Buffer
    (10 mM KCl, 1 mM CaCl2, and 1 mM NaCl in 20 mM HEPES, pH 7.5) as the product material,
    followed by suspension in 5 µL of Binding Buffer. The activated beads were then
    striped on one ice. For each test, 5 µL of aliquot suspension was added to the
    CoX-beads and mixed by gentle incubation for 30 minutes at 4°C. The mixture was
    then washed twice with Dution Buffer (containing 0.5% Triton-X100, 0.5 mM NaCl,
    and 0.2% BSA in PBS) and incubated with the primary antibody overnight at 4°C.
    The beads were then placed on a magnet and the supernatant was discarded. The
    remaining beads were then incubated on a rotator at 4°C for 30 min, after which
    the mixture was finally incubated with the secondary antibody, the antibody-beads
    were washed twice and placed in 50 µL of 2nd Secondary antibody (1:1000, 0.5%
    BSA, and 1x Roche Phosphate Inhibitor in WB-pre mixed with anti-mouse IgG antibody
    (cat no. ab7602)). The mixture was then centrifuged at 1000 x g for 5 min, and
    the supernatant discarded. The beads were then resuspended in 50 µL of 2nd Secondary
    antibody (1:1000, 0.5% BSA, and 1x Roche Phosphate Inhibitor in WB-pre mixed with
    anti-mouse IgG antibody (cat no. ab7602)). The mixture was then incubated on a
    rotator at room temperature for 30 min. The beads were then placed on a magnet
    and the supernatant discarded. The beads were then resuspended in 50 µL of DNA
    elution buffer (10 mM KCl, 1 mM CaCl2, and 1 mM NaCl in 20 mM HEPES, pH 7.5).
