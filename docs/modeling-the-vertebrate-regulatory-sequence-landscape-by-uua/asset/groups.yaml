    \n# SUMMARY\n\nThe regulatory sequences of vertebrate genomes remain largely understood.\
    \ To address this, we developed an ultra-throughput, ultra-sensitive single-nucleus\
    \ assay for transposase-accessible chromatin sequencing (UATAC-seq) protocol that\
    \ enables the construction of chromatin landscapes for one-day experiment. Using\
    \ UATAC-seq, we mapped cis-regulatory elements across five representative vertebrate\
    \ species. Our analysis revealed genome size differences across species influence\
    \ the number but not the size of CREs. We introduced NVAce, a deep learning framework,\
    \ to identify regulatory elements and predict dCRE landscapes dynamically from\
    \ genomes with high precision. NVAce demonstrated that regulatory grammar is more\
    \ complex than nucleotide sequences and that sequences govern distinct functional\
    \ modules. Moreover, NVAce predicted the effects of mutations on lineage-specific\
    \ CRE function, using causal trait loci (QTLs) and genome editing results. Our\
    \ study provides a valuable resource for decoding the vertebrate regulatory landscape.\n\
