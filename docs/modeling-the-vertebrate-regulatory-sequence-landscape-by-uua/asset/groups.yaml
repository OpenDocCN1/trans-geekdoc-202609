    gj@zju.edu.cn (G.G.)\n\n# 简要\n\n利用高分辨率单核 ATAC-seq 绘制了五种脊椎动物的调控序列图谱。这一全面的数据集能够通过深度学习对脊椎动物调控序列语法进行系统的解释。\n\
    \n![](img/ec6056bce29330cd95ccbecfd3a26b35_0_0.png)\n\n# 亮点\n\n- 通过 UATAC-seq\
