    基因组图谱。最后，我们将每个基因向两侧扩展了 2,000 bp 作为窗口，并计算了窗口内的环（loops）数量，对小鼠和美西大螈之间的环进行了比较分析。


    ## 脊椎动物种中的 TE 分析


    TE 注释从自 UCSC 下载：https://download.soe.ucsc.edu/goldenPath/mm10/database/msk_txt.txt
    (小鼠), UCSC: https://download.cse.ucsc.edu/goldenPath/GalGa/6/database/msk_txt.txt
    (鱼); Figshare: https://figshare.com/articles/dataset/Eubaeusmarcelli_genome_MPM_Emac_v1_0206273
    (壁虎), https://axolotlomics.org/assemblies (美西大螈), UCSC: https://download.soe.edu/goldenPath/Dan11/database/msk_txt.txt
    (斑鱼); UCSC: https://download.soe.ucsc.edu/goldenPath/mm39/msk_txt.txt (文件)。使用参考基因组和碱基计数计算了两个基因组中的
    TE 覆盖范围。重叠 TE 的数量使用 ChIPpeak R 包中的 `OverlapsPeaks` 计算，参数为 "minmapover=100"；重叠层数使用
    "bedtools intersect" 计算。


    ## 批量量 CUT&tag 数据分析


    ### nCREs 的识别与验证


    小鼠 ENCREs (mm10, Reg19) 下载自 ENCODE：https://seqenh.org/ncre/。使用 ChIPpeak R 包中的
    `OverlapsPeaks`（参数为 "minmapover=100"）识别了相对于美西大螈的 nCREs。为了使用 ATAC-seq 数据验证 nCREs
    的可靠性，我们将 nCREs 与 H3K4me3 和 CTCF 的峰（peaks）进行了比较。CUT&tag 数据使用 "macs3 calpeak" 在窄模式下计算
    H3K4me3 和 CTCF，并为 H3K9me3 计算模型（model）。对于 ENCODE 中未涵盖的样本（肾上腺和垂体），提取了标记组织中特定细胞类型的
    nCREs。然后，我们将新的 nCREs 与肾上腺和垂体的 CUT&tag 数据进行了比较，计算了重叠区域的比例。


    ### 跨物种的 Motif 富集


    为了研究各种 nCREs 的功能方面，我们对三类区域进行了 motif 富集分析：TSS 处的 nCREs、启动子区域 (<1kb) 的 nCREs 以及远程区域
    (2-3kb) 的 nCREs。通过 ChIPpeakseeker 计算由 Homer 注释的 nCREs，并使用参数 "distanceTSS" 匹配 TSS
    处的 nCREs 和启动子区域 (<1kb) 的 nCREs。然后，使用 motifrichr R 包 (v1.22.0) 中的 `matchMotif`
    匹配 HOMER 集合中的 motif。每个 motif 的富集评分由所有 nCREs 分数的加权平均值表示，对于缺乏相应 motif 的 nCREs 分配
    0 分。


    ## 量化 motif 的跨物种保守性


    为了研究调节模式，我们在谱系水平上进行了分析。使用 HOMER 的 `findMotif.Genome` (v11.1, https://genome.com/avrigiguez/HOMER/)
    以及参数 "scale-300 to 4" 对每个物种谱系的 nCREs 进行 motif 发现。对于每个谱系，使用 R (version 5.3.3) 对两个具有相似
    motif 模式的物种进行处理。权重达到 0.01 阈值的 motif 被认为“匹配”。对于特定物种中的每个 motif，我们统计了具有匹配 motif 的
    nCREs 数量，以识别其保守程度。我们比较了所有物种对。


    ## 实质性元素的识别与富集


    我们使用 UCSC Liftoools 识别了物种特异性（UA）元素，这些元素定义为无法从其他物种转换到参考基因组的元素。对于具有 UCSC Chain 组的物种（如斑鱼和鸡），我们使用
    0.10 的最小匹配率将 nCREs 的坐标比对到小鼠基因组参考 (mm10)。对于壁虎，我们生成了自定义链文件并应用了相应的程序。未能比对小鼠基因组的元素被定义为
    UA 元素。为了研究它们的功能性，通过交叉细胞特异性 cCREs（最小长度为 100 bp）识别了特定细胞类型或组织中的 UA 元素。对于与物种特异性组织（如斑鱼和山
    Salam）相关的元素，我们使用 ChIPpeakseeker 将其链接到最近的基因，并使用 ClusterProfiler（默认参数，值阈值=0.03）生成了用于密集
    Gene Ontology 富集分析的集合。


    e12 Cell, 588, 5343-5362-e11-e16, 2025年9月18日


    # Cell Resource

    # CellPress OPEN ACCESS


    ## 通过跨物种调节元件识别大螈特异性调节程序


    我们从每个物种的 ArchID 对象提取了基因评分矩阵，随后对基细胞类型的平均分进行聚合，并进行基 2 对数转换。同源基因识别采用了物种优化的方法：(1)
    使用 BioMart (Ensemble Release 11) 处理小鼠和斑鱼的同源基因；(2) 使用 OrthoFinder v5.0.1（默认参数，针对鸡和美西大螈使用
    DIAMOND 算法）。该集成流水线在所有物种中识别了 4,970 个保守基因。保留在 1 个基质亚型中表现出高基因评分（> 0.5）的基因用于下游分析。使用分层聚类框架
    (v1.02) 构建了基于细胞类型的矩阵。使用 Profiler 包对显示高染色质开放性的美西大螈特异性基因模块进行了 Gene Ontology (GO)
    富集分析。


    ## 美西大螈再生分析


    为了利用美西大螈肢独特的再生能力识别特定的 CCREs 和潜在的基因调节网络，我们使用了来自 Drovarski 等人 102 的美西大螈肢相关基因列表。我们使用
    limb-related-cCREs 识别了这些基因上下游 500 bp 内的 cCREs。使用 Ranges 包 (v3.6) 确定了肢部再生相关 cCREs
    与所有未覆盖 cCREs 之间的重叠部分。为了研究这些再生相关 cCREs 中 motif 的功能，我们使用了 HOMER 新 motif 发现工具 (v1.22)
    并匹配了 HOMER 集合 (homer.ucsd.edu/human/custom.motifs) 中的 motif。Motif 评分通过所有 cCREs
    的 motif 加权平均值计算，对于缺乏特定 motif 的 cCREs 分配 0 分。


    ## 用于深度学习的 scATAC 预处理


    对于每个物种，我们使用 MACACS2 根据聚类成核选择高质量峰并调用峰值；将峰向两侧扩展 25 bp 以达到 500 bp 的最终宽度。我们的数据集包含约
    50,000 个细胞，原始数据已转换为峰-峰二进制矩阵。包含超过 1% 细胞的峰被归为阳性。负性则认为不可及。对于深度学习，我们将数据分为训练集、验证集和测试集。


    ## 模型架构


    ### 2 层卷积层

    包含 128 个滤波器，大小为 71，随后顺序连接批归一化、线性流单元 (ReLU) 和最大池化层。


    ### ResBlock 模块

    包含 4 层，大小分别为 (3, 4, 6, 9)。每个块由两个卷积层、两个批归一化和两个 ReLU 层组成。


    ### 密集瓶颈层

    整合了 324 个特征用于表示，随后是批归一化和一个丢弃率为 0.2 的丢弃层。


    ### 最终层

    使用与相同数量的单元结束架构。使用 sigmoid 激活函数预测每个细胞的连续开放概率。


