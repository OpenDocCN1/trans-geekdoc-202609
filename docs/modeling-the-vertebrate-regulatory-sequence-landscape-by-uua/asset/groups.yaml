    the annotation file is derived from sequenced FASTA and GTP files (Figure: https://github.com/0df50ba9f64b24af9).
    The processed files were converted to arrow files using ArchR (v1.0.1, https://github.com/GenomicsLab/ArchR),²
    with a TileMatrix and a GeneScoreMatrix added to each allele. For example, the
    TileMatrix with 5 bp bin size was generated for axolotl and 500 bp bin for other
    species. We applied cell barcode selection and doublet inference for each file.
    Given different sequencing and doublet tissues, we calculated the TSS enrichment
    score anding for different tissues to identify barcodes representing cells (Table
    S3), UM unique mapped reads where UF is duplicated. Doublets were identified and
    filtered using ArchR ‘selection’ and ‘FilterDuplicates’.


