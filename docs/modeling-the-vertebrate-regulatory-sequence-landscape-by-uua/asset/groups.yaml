    We used 361 fine-noncoding risk variants as identified by Zhang et al.¹¹ For each
    variant, we predicted a 500bp sequence centered on the target base, with 9 additional
    sequences containing random mutations. Two forward passes were performed using
    Nvace model for both the mutant and reference sequences. We computed the difference
