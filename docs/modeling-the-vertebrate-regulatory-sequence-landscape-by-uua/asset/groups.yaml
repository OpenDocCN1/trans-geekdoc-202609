  mdcn: '


    ## 模型性能评估


    模型在不同数据集上的预测能力通过受试者工作特征曲线下的面积（AUROC）进行衡量。可及性预测性能在一个完全预留的测试染色体上进行评估，该染色体在超参数优化过程中未未使用，且训练模型从未见过，以避免信息泄露。


    我们展示了物种训练模型中每个谱系的 AUROC。利用源自 5,034 个细胞核的小鼠染色质图谱的二值化峰矩阵，我们生成了模型基准测试数据集。值得注意的是，我们的
    NvCA 模型在 AUROC 上的表现优于 Nwawa¹ 和 scBase²² 等模型，以及 Transformer 和循环神经网络（RNN）等经典框架。为了评估测试预留染色体中的预测关系，我们在亚簇（subcluster）水平上计算了预测与观测的染色质可及性测试谱之间的相关性。使用调整后的互信息（AMI）来量化预测细胞与实际细胞类型的对齐程度，从而对模型捕捉底层谱系的性能提供细致且信息丰富的评估。


    ## 针对 UA 元素的跨物种预测


    未标记（UA）元素通过使用 UCSC liftOver 和可用的 UCSC 文件将鸡、斑鱼和斑鱼基因组参考（mm10）中 COREs 的坐标进行转换。我们使用
    `builds makindows -b UIA -w 500 -s 100` 命令，通过统一 UA 元素（大小为 500bp，步长为 100bp）使序列一致。序列的可及性通过预训练模型和加速连续信号进行预测。根据染色质可及性图谱，我们通过运行
    `macc3 bdgapeak` 命令识别了预测的可及区域。序列的保守性通过预测可及的 UA 元素比例与所有 UA 元素的比例来表示。这一过程针对鱼、小鼠、斑鱼的预训练模型与其他物种
    UA 元素的所有组合重复了上述操作。


    ## 人类和小鼠单细胞轨迹的从头预测


    首先，我们通过对峰集进行前向传递，使用 NvCA 对每个查询的可及性图谱进行归一化。我们将输入 DNA 序列作为瓶颈层的输出作为每个峰的潜在嵌入。然后，我们通过瓶颈层与从收集层提取的加权矩阵相乘，生成了所有细胞的可及性图谱。可及性图谱作为进一步分析的基础，包括通过均匀流形投影（UMAP）和在
    Signatures³ 流水线中使用分辨率为 0.2 的奇异值分解（SVD）进行降维。最后，我们利用 t-SNE 来表示人类和小鼠的代表性预测细胞图谱。


    ## 不同物种的全基因组染色质可及性预测


    我们提取了步长为 100bp 的 500bp 窗口以识别不同物种的元素。通过使用 `buildseqs makindows -w 500 -s 100`，我们使用
    `to-getfasta fasta` 命令提取序列。应用在人类和小鼠数据集上训练的 NvCA 模型，我们预测了这些窗口内的染色质可及性图谱。这能够为每个单个细胞核生成全基因组预测，并在亚簇水平上进行聚合。为了提供全面的评估，我们利用
    Genomics Viewer (IG-2-16)，⁴⁵ 显示了预测的开放区域和实验数据。


    ## 预测与实验性人类 CRE 的比较


    为了评估预测与实验测量的调控景观之间的一致性，我们从 CATLAS⁴⁶ (https://catlas.org/downloads/human/sigwig)
    生成了全基因组细胞特异性 sc-CRE（内皮细胞、巨噬细胞和平滑肌细胞）。scATAC-seq 信号图使用最小最大归一化缩放到 [0,1] 区间，以匹配预测可及评分的分布。相关性分析使用
    deeptools (v3.5.2) 中的 `bi.wigSummary` 函数并带有 `bins` 参数进行⁴⁷ 我们保留了分辨率为 0.01 的归一化预测和实验信号，以确保相关性的稳健性。我们识别了预测信号并与
    NvCA 编码器 v3 (https://github.com/jue-lab/NvCA) 的 cCREs 进行了交互⁴⁸ 重叠的峰被报告为“ne-CREs”。根据峰类别，计算并总结了细胞特异性分布和核苷酸分辨率图谱。


    ## 来自 NvCA 的 Motif 识别


    为了从我们的 NvCA 中提取 Motif，我们使用了结合通用单核苷酸重要性评分的 TF-Motisif。通过对 10,000 个细胞进行采样并评估每个任务的评分，我们提高了
    TF-Motisif 的计算效率。随后使用 JASPAR2024 数据库查询 Motif 相似性⁹ 我们应用 motif⁵⁰ 软件包来可视化源自物种训练的
    Motif 之间的关系。


    e14 Cell 188, 5343–5362.e1–e16, September 18, 2024


    ## 细胞资源


    小鼠胚胎 CRE 被分为两类：宽 CRE 和 窄 CRE，如前所述。我们使用 `tools makindows -b IU -s 100` 命令通过覆盖 CRE
    生成了区域（500bp，步长 100bp）。对于每个区域，我们从正链提取序列并输入到小鼠模型以预测可及性。


    ## 同源基因染色质可及性的跨物种预测


    为了验证模型的泛化能力，我们利用预测的小鼠模型预测 HGB1、小鼠 Hb-b 和人类 HGB1 同源基因的染色质可及性。在目标基因 TSS 上游 500bp
    的序列使用 `bedseq gefasta` 提取，并作为前向传播输入预测可及性。


