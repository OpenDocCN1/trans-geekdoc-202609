    ## 细胞 开放获取


    ## 资源


    基于 DNA 序列的模型最近展示了推断跨生物过程调控逻辑的能力 [7](10.1016/cell.abc6789)。目前，深度学习似乎是解释转录产出现最有效的方法。在我们的工作中，我们采用了
    ResNet 架构，该架构更适用于细胞景观图谱数据的大规模、多任务学习。NWVAE 能够从其从未遇到过的基因组中预测组织特异性调控序列，并突显强增强子。


    ### 材料可用性

    本研究未产生新的独特请求。


    ### 数据与可用性

    数据可在 NCBI 基因表达综合数据库 (GEO) 中获取，登录号为 GSE224819。处理后的数据可以通过图表访问：https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE...
    https.bsu.edu.cn。代码和脚本可以通过以下地址访问：https://github.com/guoj/NWUATAC。预训练模型可以从 GitHub
    获取：https://github.com/guoj/NWUATAC。


    使用 NWVAE，我们预测了对 cCRE（染色质调控元件）的合成效应，其精度高于基于 MFPRA 或 ENCODE 多模式数据生成的模型。虽然大型基因组模型（如
    Enformer 和 Evo）仍在努力捕捉细胞类型特异性调控元件，但 NWVAE 不仅捕捉了组织特异性调控语法（表 S7），还涵盖了体内所有的关键元件。通过解释该深度学习模型，我们展示了学习基因组中保守的调控逻辑和架构。我们观察到第一层捕捉了基因组中的
    TF（转录因子）结合 motif，其他层代表 motif 相互作用和基因组相互作用，输出则预测不同谱系的不同特征，最终预测目标基因。


    ## 致谢


    我们感谢 P. Hu、X. Li 和 J. Li 对这项工作的支持。我们感谢 X. Wang（衡阳）、Y.Zhang（衡源）、Debiao Sheng（上海）和
    B. Li（上海）对实验的支持，以及南京紫京提供研究中使用的定制抗体。我们还感谢 M. Chen 和 S. Li 对我们项目的支持。我们感谢北京大学生物信息中心的
    H. Wu 提供必要的资源，以及江辉实验室提供的技术支持。本研究受到浙江省重点计划（2024AS5502）、中国自然科学基金（基金号 32303001）和江苏省自然科学基金（2021Y730014）的支持。本文由中央科学与教育基础基金会（https://www.ccsf.org/publications）资助。


    总结，我们展示了 NWUATAC-seq，它能够高效预测染色质结构和图谱，以及用于脊椎动物染色质景观预测的 NWVAE。我们的研究为进一步调查和设计调控序列提供了宝贵的资源。


    ## 研究局限性


    NWVAE 设计用于预测染色质可及性和基因组序列突变的影响。然而，它缺乏确定单个增强子功能或预测由增强子或抑制因子突变引起的基因表达变化的能力。虽然我们的发现证明语法在常染色质和异染色质状态中起着至关作用，但我们不能排除染色质突变在某些情况下可能影响基因表达的可能性。此外，尽管
    NWVAE 在跨细胞类型中实现了高预测精度，但我们展示的功能验证侧重于人类谱系以作为原理证明。尽管如此，我们相信 NWVAE 在预测所有脊椎动物细胞类型的合成
    cCRE 方面应具有相当的精度。


