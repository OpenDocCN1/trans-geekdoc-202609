    1 条 read 比对到正链或负链。同时性框架和双反向捕获率通过总数形成的双链捕获片段进行计算。为了计算每个位点的双捕获率，我们在个体中为每个位点保留了一个唯一片段。我们将每个细胞中重叠的片段分配给同一个细胞，并计算重叠片段数与总片段数。这种插入是随机的并移除了大部分片段。1%
    的双双细胞捕获率表明具有合理的扩增效率。


