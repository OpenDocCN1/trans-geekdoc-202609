    # # Modeling the vertebrate regulatory landscape by UUATAC-seq and deep learning


    Xiaoping Han,1,6 Hanyu Wang,1,5 Xueyi Wang,1,5 Daiyun Lu,1,8 Yuting Fu,1,6 Lei
