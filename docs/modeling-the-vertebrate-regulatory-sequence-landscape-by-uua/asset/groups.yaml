    # Cell Resource


    # CellPress

    OPEN ACCESS


    decode disease-related regulatory sequences at the single-nucleotide level in
    nearly all cells.²⁹ Unfortunately, most-cell data have limitations in either sensitivity
    or throughput, hindering the generative power of models with high accuracy. Optimization
    of deep-learning models in the genomic realm faces ongoing challenges, whereas
    protein structure models¹¹⁴-¹⁴ have achieved remarkable success.


    In this study, we use homo-adapter transposase and temperature-controlled sequencing,
    which increased the sensitivity and throughput of ATAC assay. We utilized a ultra-throughput,
    viral-single-nucleus ATAC-seq (UATAC-seq) transposase to map open chromatin landscape
    for zebrafish, gecko, chicken, and mice across a wide range of subphyla. The data
    revealed us to identify common patterns for candidate regulatory elements (CREs)
    across different species and lineages. We built a mega-scale deep-learning model,
    Nva cis-regulatory elements that can be annotated with accessibility landscape,
    evolutionary effects, and synthetic mutations from any given genome sequence.


    50% limit of dual-adapter transposase, allowing for the amplification of 100%
    of molecules.³⁰ UATAC-seq incorporates four indexing steps in a streamlined manner,
    resulting in a processing time much higher throughput compared with s-ATAC. UATAC-seq
    is easy to perform and does not require extensive equipment such as fluorescence-activated
    cell sorting (FACS) or making it generally accessible for the 10x more researchers.


    To assess the resolution and characteristics of the fragments, we performed two
    independent experiments with human (2399) and mouse (373) cells. The observed
    collisional ligation rate was 0.31% in the human experiment (Figure 1) and 1.2%
    in the mouse experiment (Figure 2). The fragment size shows a size-number-based
    distribution


    # RESULTS


    Construction of the single-cell sequencing platform suitable for high-resolution
    landscape construction, we built UATAC-seq technology. In UATAC-seq, we used a
    novo transposase to incorporate into the bounds of open genomic regions (Figure
    1A). After end-split, the second round of DNA was handled via ligation and hybridization,
    followed by another round of ligation with a temperature-controlled transposase
    to add to both ends of reads (Figures 1A and 1B). We then used gap-fill and ligation
    to prepare the template and then PCR to incorporate the fourth round of barcodes
    and generate the sequencing library. The sequence quality is detailed in Table
    S1.


    This approach avoids cross-contamination from differing indexes and prevents sample
    loss by reducing reagent changes. UATAC-seq has advantages over all single-nucleus
    ATAC-seq (snATAC-seq) protocols, including s-ATAC, and 10x-ATAC (Figure 1A). UATAC-seq
    uses a unbiased transposase, which overcomes


    To benchmark UATAC-seq on tissue cells, we analyzed 41,672 adult mouse brain cells
    using UATAC-seq. We observed the fixation of quality relative to the pipeline
    (Figure 1) and used manifold alignment and projection (UMAP) for visualization.


    Different DNA genes on library construction and found that the DNA ligation efficiency
    improved by UATAC (Figure 1F).


    To assess the efficiency, we found that the enrichment score of ATAC-seq degrades
    under 55°C over 5 minutes (Table S2). Compared with other methods, UATAC-seq exhibits
    advantages in terms of sensitivity, specificity, and cost (Figure 1).


    FIGURE 1. UATAC-seq construction


    +   (A) Standard of UATAC-seq library construction. The details are in the STAR
    Methods. Note that BC3 is not complementary to its reverse strand.

    (B) Design of unbiased transposase. Construction of libraries with counts of unique
    reads aligned human or mouse chromosomes in the same reference genome. Points
    are colored by species.

    (C) Scatterplots of single-cell images to represent different species. Cells with
    human or mouse proportions less than 0.8 were defined as mixed cells. Less than
    1,000 cells were required.

    (D) Fragment length distribution of 373 and 2967 nucleotides binding.

    (E) UATAC Typical pooling of typical inserts in 4-8kb fragments using Tn5.

    (F) E col enzyme improves detection of UFs compared with T4 enzyme, which has
    less effect on enrichment (left). The enrichment score of UFs using fixed Tn3
    (right).

    (G) Comparison of UATAC-seq with current ATAC-seq methods on sensitivity, specificity,
    and other experimental conditions.


    See also Figure S1.


    Cell 188, 5343–5362, September 18, 2023 5345'
