    ArchR (v1.0.1, https://github.com/GenomicsLab/ArchR)  arrow 文件，并在每个等位基因上添加了 TileMatrix
    和 GeneScoreMatrix。例如，为墨西哥西陆螈生成了箱大小为 5 bp 的 TileMatrix，为其他物种生成了箱大小为 500 bp 的 TileMatrix。我们对每个文件应用了细胞条形码选择和双细胞推断。考虑到不同的测序和双细胞组织，我们计算了不同组织的
    TSS 富集评分和条带性（banding），以识别代表细胞的条形码（表 S3）以及 UF 重复唯一比对读数。双细胞使用 ArchR 的‘selection’和‘FilterDuplicates’进行识别和过滤。


