    the receiver operating characteristic curve (AUROC). The accessibility prediction
    performance was evaluated on a completely held-out test chromosome, which was
    not used during hyperparameter optimization and had never seen by the training
    model to avoid information leakage.

    We displayed the AUROC for each lineage for species-trained model. Using the binarized
    peak matrix derived from the mouse chromatin profile of 5,034 nuclei, we produced
    the dataset for model benchmark. Notably, our NvCA model outperformed models such
    as Nwawa¹ and scBase²² and classical frameworks such as Transformer and Recurrent
    Neural Network (RNN) evaluated by AUROC. To evaluate the predicted relationships
    in the held-out chromosome for test, we computed correlations between predicted
    and observed chromatin accessibility test profiles at the subcluster level. Adjusted
    mutual information (AMI) was used in quantifying the extent to which the predicted
    cell aligns with the actual cell types, offering a nuanced and informative assessment
    of the model''s performance in capturing the underlying lineages.


    # Cross-species prediction for UA elements


    The unlabeled (UA) elements were defined by converting the coordinates of COREs
    in chicken, zebrafish and zebrafish genome reference (mm10) using UCSC liftOver
    and the available UCSC files. We made sequences uniform unifying the UA elements
    (500bp size with 100bp step size) using the ‘builds makindows -b UIA -w 500 -s
    100’ command. The accessibility of sequences was predicted by the pretrained model
    and accelerate continuous signals. Based on the chromatin accessibility profiles,
    we identified the predicted accessible regions by running “macc3 bdgapeak” command.
    The conservation of sequences was represented by the ratio of UA elements predicted
    accessible to all UA elements. This was repeated for all combinations of fish,
    mouse, mouse, and zebrafish pretrained models with UA elements in other species.


    # De novo prediction of single-cell tracks for human and mice


    First, we firstly normalized accessibility profiles for each query with NvCA by
    running a forward pass on the peak set. We used the input DNA sequence as the
    output of bottleneck layer as a latent embedding for each peak. We then generated
    the accessibility profiles across all cells by the product of bottleneck layer
    with the weighted matrix extracted from the collected layer. The accessibility
    profiles served as the base for further analysis, including dimension reduction
    through uniform manifold projection (UMAP) and Singular Value Decomposition (SVD)
    with a resolution of 0.2 in Signatures³ pipeline. Finally, we utilized t-SNE to
    represent a representative predicted cell profile for human and mice.


    # Predicting genome-wide chromatin accessibility for different species


    We extracted 500bp window with a step size of 100bp to identify the different
    species of elements. By using the ‘buildseqs makindows -w 500 -s 100’, we extracted
    the sequences using the ‘to-getfasta fasta’ command. Applying the NvCA model trained
    on human mouse datasets, we predicted chromatin accessibility profiles within
    these windows. This enabled the generation of genome-wide predictions for each
    individual nucleus, which were aggregated at the subcluster level. To provide
    a comprehensive evaluation, we utilized the Genomics Viewer (IG-2-16),⁴⁵ displaying
    the predicted open regions and the experimental data data.


