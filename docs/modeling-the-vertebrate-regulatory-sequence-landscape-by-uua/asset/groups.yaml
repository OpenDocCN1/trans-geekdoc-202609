    预测了这些功能细胞的影响。例如，NCas9 预测 –175–C 和 –202–C–G 将导致红细胞谱系中血红蛋白亚基γ（HBG）的激活，–68–C–A 和
    –90–T–C 将导致下调，而 –20–T–A 和 –6–G 将导致血红蛋白亚基β（HBB）在红细胞谱系中的下调。这一预测通过 Hb 启动子可及性和表达的实际实验测量得到了良好验证（图
    S6 和 S7）。


    尽管这三个物种之间在基因结构和可及性水平存在差异，但我们发现模型预测性能卓越（图 S4）。我们在功能水平评估了调控染色质，识别出了谱系中一种相关的蛋白——血红蛋白（hbb）。NaWce
    预测，在红细胞谱系中，人类或小鼠中不存在 hbb 的 CRE（图 S8）。


    由于 NaWce 是一个执行多任务联合以将基因组解码为细胞类型的集成深度学习模型，我们提取了其基因序列的高维表示，以理解谱异性染色质产生的原因。在最后一层，NaWce
    识别出基因序列中的高维特征，这些特征与我们的无监督聚类直接相关（图 S7）。这些序列模块对应于不同的功能，例如模块 1 代表神经功能，模块 2 代表 RNA
    处理，模块 3 代表免疫功能，模块 4 代表脂质代谢（图 S8）。我们的结果显示，NaWce 在序列中识别出了细胞特性语法，这可能是谱异性染色质模式的原因。


    为了探索被 NaWce 模型识别的序列，我们使用信息源转录因子发现工具（TF-Motifs Disco）为每个物种提取了基于深度学习的 motif。我们视觉化了每个物种预测的
    motif（表 S9）。我们绘制了细胞特异性 CRE 树以证明 motif 之间的相似性（图 S6）。基于深度学习的 motif 可以映射到已知的 motif（图
    S5），但我们发现了大量在现有研究中未报道的短 motif^8,10。当我们使用 NaWce 模型显示 ~900 和 -250 区域时，我们观察到 ~900
    区域的 1000 bp 窗口信号比 -250 区域强 5 倍。这为 CRE 的功能提供了新的解释，同时也支持了启动子和增强子具有共享染色质结构的观点，这种结构主要由局部特征定义^5,66。


