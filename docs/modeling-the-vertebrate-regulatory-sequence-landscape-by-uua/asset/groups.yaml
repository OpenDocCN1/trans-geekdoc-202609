    by vortexing. The lysis step was repeated until the supernatant became clear.
    The supernatant was removed, and 1 ml of Resowl Park Minimal Medium (RIMP) 1640
    medium was added to suspend the cells. The cell count was determined, and the
    cells were dispersed into a 6-well plate with a 10 mm cover at the top. The plate
    was placed in an incubator (37 °C, 5% CO2) for 2 hours. Non-adherent cells were
    carefully washed away with PBS. The cells were then incubated at 37 °C for 2.5
    ml of RPMI-1640 medium containing 10% FBS per well.


    # Mouse peritoneal/macrophage


    The mouse was anesthetized and sterilized with 70% EtOH. The peritoneal abdomen
    was opened, and 6 ml of 1 x PBS was injected into the peritoneal cavity. The mouse
    abdomen was gently opened, and peritoneal fluid was collected and transferred
    into a tube (20 ml containing of 0.1-1 x PBS). The supernatant was centrifuged
    at 4 °C and 350 g for 5 minutes. After centrifugation, the supernatant was removed.
    The cells were resuspended in RPMI-1640 medium containing 10% FBS and seeded into
    a 6-well plate with a 10 mm cover at the top. Incubated at 37 °C for 2 hours.
    Non-adherent cells were carefully washed away with PBS.


    # Chromatin staining and Super-resolution microscopy


    Cells were incubated for an 1 hour with 5 ml medium containing 1 μM EGF. Fixation
    and permeabilization. EU cells were stained with α488-antibody (through a click
    reaction, chromatin was stained with Dchst-3342 (Baychst)). Super-resolution images
    were obtained using stimulated emission depletion (STED) or CellB STORM. Spherical
    aberration was minimized using optical immersion with diffraction correction.
    Data were collected at 2 nm with 0.5 power and 3-5 nm step size. Spherical aberration
    was minimized. Data quality was assessed with SimMack-101 where modulation-contrast-to-noise
    ratio (MNCR), spectral analysis, and, were reconstructed using Fourier plot, and
    chromatin intensity values were verified.


    # Functional validation of vN3-GCA predicted target site


    The Hupe2-HGb-64A-G cell line was established using homologous recombination with
    wild-type Hupe2 cells by DodeBio (Shanghai). Hgb-A sgRNA expression plasmid targeting
    the -68 region and single-strand oligononucleotide repeat Hgb-A mutation was generated
    by CRISPR/Cas9 by DodeBio (Shanghai). Detailed sequences were listed in Table
    S1. RNA, single-strand DNA, was transfected into Hupe2 cells using Electroporation
    (Lonza, V4XP). After 48 hours, a fraction of post-transformed pooled cells were
    collected and then reseeded into a 6-well plate at a density of 1 × 10^5 cells
    per well. The cells were collected and subjected to total RNA extraction. After
    cDNA sequencing, expression levels of Hgb1/2 were measured by qPCR using universal
    qPCR system (Heat, CF-G) and detected by qPCR (YaqGreen, Taq-92AM).


    # Preprocessing of snATAC data


    The FASTQ files generated by snATAC-seq were processed by the pipeline software
    Velvet (v1.6; https://github.com/met-bioinformatics/snatac-seq). Reads were removed
    if the base quality was less than 10 or if they had more than 30 cycles. Each
    cell was tagged with the name of the query. Using Dro-Seq tools each cell read
    contained four pairs of components: P7 index, BCCA barcode, BCD barcode and Tn5
    barcode (128, 7, 8, and 192 indices, respectively). Barcodes were removed if their
    original sequence had an error caused by amplification. In. BAM files with faulty
    barcodes were removed by Tn5 barcodes and merged with tissue information. Fragments
    with duplicate reads were removed. Sometimes, references were realigned using
    Bowtie2 (v2.4.4) for mouse genome (mm39) and Danr111 for zebrafish (v0.7.5; https://github.com/deeptools/Tools4)
