    # Nuclei Isolation from Cultured Cells


    2T3 and 293T cells were cultured in Dulbeco''s Medium (DMEM, ThermoFisher) with
    10% FBS. Cells were harvested by trypsinization, ensuring that no more than 1
    million cells were collected and resuspended in 1 mL of PBS. The cell suspension
    was centrifuged at 300 g for 5 minutes at 4 °C. The resulting pellet of 293T cells
    was reuspended in 1 mL of PBS and incubated for 5 minutes to release nuclei. The
    nuclei suspensions were then transferred into 15 mL centrifuge tubes with 5 mL
    of pre-washed WB, filtered through a 40 µm strainer, and centrifuged at 500 g
    for 5 minutes at 4 °C. The nuclei were washed with 1 mL of WB. After centrifugation,
    the nuclei were resuspended in an appropriate volume of PBS-Mg to achieve a concentration
    of 5 million nuclei per µL. A mixed cell population was prepared to confirm the
    rating of UATAC-seq, equal volumes of 2T3 and 293T nuclei suspensions, both at
    the same concentration, and combined and thoroughly.


    # Tn5 Tagging of Open Chromatin (First round)


    A tagmentation buffer was prepared by combining 5 µL of 2x buffer (10 mM MgCl2
    and 20% dimethylformamide in 10 mM Tris-HCl, pH 7.5), 5 µL of PBS, 0.1 mL of detergent,
    and 0.1 mL of 10% Tween-20. A total of 11 mL of this was added to each well containing
    100,0000 cells. The Tn5 tagging was initiated by adding 2 µL of ligated TTE. The
    wells were sealed and centrifuged at 300 g for 5 minutes at 4 °C to achieve complete
    homogenization of the reaction mixture. Next, 2 µL of nuclei-nucleus suspension
    (containing 10,000 nuclei per µL) was added to each well to initiate Tn5 tagging.
    The reactions were incubated at 55 °C for 30 minutes on a rotary mixer at 10 rpm
    to facilitate extension. To stop the reaction, 15 mL of 40 mM ATAC and PBS (0.5%
    Tween-20 in PBS) were added to each well. The reactions were incubated for 15
    minutes. The supernatant was removed and the pellet was resuspended in 1 mL of
    PBS to remove any residual reagent mix. This washing step was repeated twice to
    ensure complete removal.


    The scale of the tagmentation experiment, ensuring genome volumes and reaction
    numbers (types of TTE), can be proportionally scaled up or down according to the
    quantity and target yield of single-nuclei data required for subsequent analysis.


    # Adapter Isolation (Second round)


    For the second round of indexing, 1 µL of 10 mM Buffer (dissolved in 10 mM Tris-HCl,
    pH 8.0) was dispensed into each well of 96-well plate using a multi-channel pipette.
    Then, 5 µL of 78 HA antibody (with 78 unique barcodes, dissolved in 10 mM Tris-HCl,
    pH 8.0) was added to each sequence. The wells were sealed and centrifuged at 300
    g for 30 seconds to ensure thorough mixing. The wells were incubated using the
    antibody for 90 minutes at 37 °C (75 °C for 1 min; 60 °C for 2 min; 50 °C for
    20 min; 25 °C for 15 min), and a final hold at 4 °C with a cooling rate of -0.1
    ℃/min.


    For the ligation step, the pellet was resuspended in a reaction-ready max buffer
    containing 38 µL of 0.1 U of DNA ligase (NEB), 768 µL of 5% PEG8000 and 498 µL
    of PBS. 3 µL of this mixture was aliquated into each well containing the annealed
    oligos, covering a total of 78 reactions. The eight plates were incubated at 16
    °C for 2 hours using the cycling incubator. The reactions were then incubated
    at room temperature for 5 minutes. Next, 10 µL of cold PFBS was added to each
    well, and each was placed in a 5 mL centrifuge tube. The tube was centrifuged
    at 600 g for 5 min at 4 °C. Finally, the nuclei were washed twice with PFBS as
    described to remove any residual ligation reagents.


    The scale of the ligation experiment, ensuring genome volumes and reaction numbers,
    can be proportionally based on the sample size and the desired single-nuclei data
    yield for downstream analysis.


