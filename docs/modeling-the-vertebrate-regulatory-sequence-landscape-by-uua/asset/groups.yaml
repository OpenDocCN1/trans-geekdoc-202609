    ## 讨论


    尽管在使用 scRNA-seq 构建图谱方面出了巨大努力，但受限于低表达读取深度。在 UATAC-seq 中，我们设计了一种方案，每个序列捕捉 4 份 DNA
    调控元件，增加了四倍，使方案具有高通量限制。


    通过使用 UATAC-seq，我们绘制了变异物种的染色质可及性谱图。我们发现了单个开放区域和 CRE 调控元件。除了序列之外，我们将染色质映射到基因组变异。然而，由于融合细胞的限制，我们发现重复率为我们未能……


    > 图 7. NCas9 预测与验证

    > (A) 点图显示了变异模型（Zhang等）在所有谱系和随机变异中预测的各种变异效应（细胞区域）

    > (B) 点图显示了每个基于 AT 靶点的元件的 NCas9 预测效应和评分 Hb/人类模型系数。实线代表回归拟合，灰色区域表示 95% 置信区间。皮尔逊相关系数
    (r) 和 p 值在左侧。测量的 Hb 表达绝对效应与低分位数进行比较（与 p < 0.05 的 t 检验比较）


    接下来，我们测试了 NCas9 模型预测体变异效应的能力。我们通过人类 CD34+ 造血多能祖细胞（MPPs）的染色质特征微调了 NCas9，通过分析参考序列中每个碱基的方差，我们发现了影响
    CRE 的多种 motif（图 S7）。我们计算了每个变异预测模型的差异……


    总的来说，我们的 NCas9 模型能够从变异基因组预测染色质可及性谱图。我们的研究表明，调控语法在序列方式上是保守的。


