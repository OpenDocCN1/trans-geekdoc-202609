    ## Cell OPEN ACCESS


    ## Resource


    DNA sequence-based models have recently demonstrated the ability to infer regulatory
    logic across biological processes [7](10.1016/cell.abc6789). At present, deep
    learning appears to be the most effective approach for interpreting transcriptional
    emergence. In our work, we adopt the ResNet architecture, which is better suited
    for large-scale, multitask learning on cellular landscape data. NWVAE is capable
    of predicting tissue-specific regulatory sequences from genomes it has never encountered
    before, highlighting strong enhancers.


    ### Materials availability

    This study did not generate new unique requests.


    ### Data and availability

    Data are available in the NCBI Gene Expression Omnibus (GEO) under accession number
    GSE224819. Processed data can be accessed at figure: https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE...
    https.bsu.edu.cn. Code and scripts can also be accessed at: https://github.com/guoj/NWUATAC.
    The pretrained model can be accessed from GitHub: https://github.com/guoj/NWUATAC.


    Using NWVAE, we predicted the synthetic effect on cCRE with an accuracy that is
    higher than the models generated from MFPRAs or ENCODE multi-mode data. While
    large genomic models, such as Enformer and Evo, are still struggling to capture
    cell-type specific regulatory elements, NWVAE not only captures tissue-specific
    regulatory grammar (Table S7) but also covers all key elements in vivo. By interpreting
    the deep-learning model, we presented a conserved regulatory logic and architecture
    in learning genome. We observed that the first layer captures TF binding motifs
    in the genome, the other layers represent motif interactions and genomic interactions,
    and the output predicts different features for different lineages and finally
    predicts the target gene at all.


    ## ACKNOWLEDGMENTS


    We thank P. Hu, X. Li, and J. Li for support on this work. We also thank X. Wang
    (Hengyang), Y. Zhang (Hengai), Debiao Sheng (Shanghai), and B. Li (Shanghai) for
    supporting the experiments and Yanjing Nanjing for providing the customized antibodies
    used in the study. We also thank M. Chen and S. Li for support of our project.
    We also thank H. Wu in the Center of Bioinformatics, Peking University for providing
    the necessary resources and the facilities of Jianghui Laboratory for technical
    support. This study was supported by the Key Program of Zhejiang (2024AS5502);
    the National Natural Science Foundation of China (grants 32303001) and the Natural
    Science Foundation of Jiangsu Province (2021Y730014). This paper is funded by
    the Central Foundation for Creative Science and Education (https://www.ccsf.org/publications).


    In summary, we present NWUATAC-seq, which enables efficient prediction of chromatin
    architecture and landscape, and NWVAE for vertebrae chromatin landscape prediction.
    Our study provides valuable resources for further investigation and designing
    regulatory sequences.


    ## Limitations of the study


    NWVAE is designed to predict chromatin accessibility and effects of mutations
    in genomic sequences. However, it lacks the capacity to determine the function
    of individual enhancers or to predict changes in gene expression caused by mutations
    in enhancers or repressors. While our findings demonstrate that grammar plays
    a critical role in euch and heterochromatin states, we cannot rule out the possibility
    that chromatin mutations may affect gene expression in certain contexts. Moreover,
    although NWVAE achieved high prediction accuracy across cell types, the functional
    validation we presented focuses on the human lineage as a proof of principle.
    Nonetheless, we believe NWVAE should demonstrate comparable accuracy in predicting
    synthetic cCREs across all vertebrate cell types.


