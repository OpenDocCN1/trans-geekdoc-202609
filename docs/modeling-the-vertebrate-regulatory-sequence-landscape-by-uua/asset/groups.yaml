    \n# 资源\n\n# 通过 UATAC-seq 和深度学习构建脊椎动物调控图谱\n\nXiaoping Han,1,6 Hanyu Wang,1,5 Xueyi\
    \ Wang,1,5 Daiyun Lu,1,8 Yuting Fu,1,6 Lei Yang,1,5 Renying Wang,1,8 Peiping Zhang,1,8\
