    # In brief


    Regulatory sequence landscapes from five vertebrate species were mapped using
    high-resolution single-nucleus ATAC-seq. This comprehensive dataset enables a
    systematic interpretation of vertebrate regulatory sequence grammar through deep
    learning.


    ![](img/ec6056bce29330cd95ccbecfd3a26b35_0_0.png)


    # Highlights


    +   - Efficient construction of chromatin accessibility landscapes by UUATAC-seq


    +   - Mapping of cCRE landscapes across five vertebrate species using UUATAC-seq


    +   - NvwACE deep-learning model predicts cCRE landscapes from genomic sequences


    +   - NvwACE accurately predicts the impact of synthetic mutations on cCRE function


    Han, et al., 2025, Cell 188, 5343–5362

    September 18, 2025 © 2025 The Authors. Published by Elsevier Inc.

