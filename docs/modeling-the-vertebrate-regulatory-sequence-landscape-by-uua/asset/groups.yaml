    to build a predictive model with given features in different species. By including
    NWA in the meta-deep learning network and built an NWA pipeline (Figure 5g). We
    optimized the parameters of the model size, sequence length, and TCR quality of
    the training datasets for snATAC-seq prediction. Our NWA model outperformed other
    approaches, including axolotl, chicken and zebrafish, showing better chromatin
    accessibility landscape prediction (Figure 5E). We found that higher quality data
    is better for model performance. Using exactly the same model, the predictions
    from our data landscape showed higher accuracy than the model from previous published-based
    data line in all cells (Figure 5F). The final NWA uses 500 bp DNA sequences, which
    go through connection block 128 hits with a set of 7 filters, with ReLU activation
    function, a bottleneck layer, and a fully connected layer, and predict better
    accessibility in each nucleus in a multitask way (Star Methods).


