    barcodes were converted to the BEDPE file and sorted. Top cells were selected
    for analysis. For the double-strand capture rate evaluation, two fragments share
    the same chromosome, start, and end site, while there were 1 read aligned to positive
    or negative strand. The simultaneous framework and the double-reverse capturing
    rate was calculated as double-strand capture fragments formed by the totals. To
    calculate the double-capture rate for each locus, we retained a unique fragment
    for each locus in individual. We assigned overlapping fragments to the same cell
    in each cell, and the number of overlapping fragments with the number of total
    fragments. This inserts randomly and removes most of the fragments. A 1 percent
    double-doublet capture rate would suggest a reasonable amplification efficiency.


