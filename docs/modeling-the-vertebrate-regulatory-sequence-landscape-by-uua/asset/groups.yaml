    # EXPERIMENTAL METHOD AND STUDY PARTICIPANT DETAILS


    Animals All animals studied followed protocols by the Animal Ethics Committee
    of Zurich University. All experiments conform to the relevant standards of Zurich
    University Laboratory Animal.


    For wild-type mice, one-week-old male and one-week-old female C57BL/ mice were
    obtained from Genepath Co., Ltd and maintained at Animal Center of Zurich in a
    Specific Pathogen Free (SPF) facility with individually caged.


    For wild-zebrafish, 4-week-old male and 16-week-old female zebrafish rerio strain
    ABZ zebrafish were maintained at At Core Facilities, Zurich University School
    of Medicine.


    For wild-type chickens, one-~2-year-old female (Gallus gallus) were obtained by
    whole genome mapping (genome mapping rate: 95.8% to Gallus gallus; 94.6% to Gallus
    gallus; 85.6% to Bambusicolor).


    For wild-type geckos, one-~year-old leopard gecko (Eublepharis macularis) was
    obtained from Citizen Reptile Breeding Base. The strain was verified by whole
    genome mapping analyses (genome mapping rate: 97.33% to Eublepharis macularis;
    63.92% to Coleryny eggs; 60.36% to Gekko japonicus; 61.96% to Paedoera picta;
    58.97% to Hemidactylus; 60.63% to Leptodactylus later; 59.50% to Herpetonia binoi.


    For wild-type axolotls, three-~1-year-old male (d Ambystoma mexicanum) was obtained
    from Jiteng Lab at Guang Provincial People''s Hospital.


    # Cell lines


    3T3 and 293T cell lines were obtained from Stuart H. Orkin at Harvard Medical
    School. Cells were cultured in Dulbecco''s Medium (DMEM, ThermoFisher) with 10%
    Fetal Serum (FBS, ThermoFisher) and 1% Penicillin-streptomycin (ThermoFisher).'
