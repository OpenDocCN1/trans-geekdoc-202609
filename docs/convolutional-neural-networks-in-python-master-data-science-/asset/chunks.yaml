    `T = tf.placeholder(tf.float32, shape=(batch_sz, K), name='T')`\n\n为了加强这个想法，滤波器的顺序将与之前不同。因此，现在图像滤波器的维度排在第一位，然后是颜色通道的数量，然后是特征图的数量。\n\
