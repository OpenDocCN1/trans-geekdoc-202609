- raw: 'So what is the takeaway from all these examples of convolution? Now you know
    that there are SOME filters that help us detect features - so perhaps, it would
    be possible to just do a convolution in the neural network and use gradient descent
    to find the best filter.


    # Chapter 3: The Convolutional Neural Network


    All of the networks we’ve seen so far have one thing in common: all the nodes
    in one layer are connected to all the nodes in the next layer. This is the “standard”
    feedforward neural network. With convolutional neural networks you will see how
    that changes.


    Note that most of this material is inspired by LeCun, 1998 (Gradient-based learning
    applied to document recognition), specifically the LeNet model.


    Why do convolution?


    Remember that you can think of convolution as a “sliding window” or a “sliding
    filter”. So, if we are looking for a feature in an image, let’s say for argument’s
    sake, a dog, then it doesn’t matter if the dog is in the top right corner, or
    in the bottom left corner.


    Our system should still be able to recognize that there is a dog in there somewhere.


    We call this “translational invariance”.


    Question to think about: How can we ensure the neural network has “rotational
    invariance?” What other kinds of invariances can you think of?


    Downsampling


    Another important operation we’ll need before we build the convolutional neural
    network is downsampling. So remember our audio sample where we did an echo - that
    was a 16kHz sample. Why 16kHz? Because this is adequate for representing voices.


    The telephone has a sampling rate of 8kHz - that’s why voices sound muffled over
    the phone.


    For images, we just want to know if after we did the convolution, was a feature
    present in a certain area of the image. We can do that by downsampling the image,
    or in other words, changing its resolution.


    So for example, we would downsample an image by converting it from 32x32 to 16x16,
    and that would mean we downsampled by a factor of 2 in both the horizontal and
    vertical direction.


    There are a couple of ways of doing this: one is called maxpooling, which means
    we take a 2x2 or 3x3 (or any other size) block and just output the maximum value
    in that block.


    Another way is average pooling - this means taking the average value over the
    block. We will just use maxpooling in our code.


    Theano has a function for this: theano.tensor.signal.downsample.max\_pool\_2d


    The simplest CNN


    The simplest convolutional net is just the kind I showed you in the introduction
    to this book. It does not even need to incorporate downsampling.


    Just compute the hidden layer as follows:


    Z = conv(X, W1)


    Y = softmax(Z.dot(W2))


    As stated previously, you could then train this simply by doing gradient descent.


    Exercise: Try this on MNIST. How well does it perform? Better or worse than a
    fully-connected MLP?


    The LeNet architecture


    Now we are finally at the point where I can describe the layout of a typical convolutional
    neural network, specifically the LeNet flavor.


    You will see that it is just a matter of joining up the operations we have already
    discussed.


    So in the first layer, you take the image, and keep all the colors and the original
    shape, meaning you don’t flatten it. (i.e. it remains (3 x W x H))


    Then you perform convolution on it.


    Next you do maxpooling to reduce the size of the features.


    Then you do another convolution and another maxpooling.


    Finally, you flatten these features into a vector and you put it into a regular,
    fully connected neural network like the ones we’ve been talking about.


    Schematically it would look like this:


    ￼![LeNet.png](OEBPS/Images/00005.jpeg)


    The basic pattern is:


    convolution / pool / convolution / pool / fully connected hidden layer / logistic
    regression


    Note that you can have arbitrarily many convolution + pool layers, and more fully
    connected layers.


    Some networks have only convolution. The design is up to you.


    Technicalities


    4-D tensor inputs: The dimension of the inputs is a 4-D tensor, and it’s pretty
    easy to see why. The image already takes up 3 dimensions, since we have height,
    width, and color. The 4th dimension is just the number of samples (i.e. for batch
    training).


    4-D tensor filters / kernels: You might be surprised to learn that the kernels
    are ALSO 4-D tensors. Now why is this? Well in the LeNet model, you have multiple
    kernels per image and a different set of kernels for each color channel. The next
    layer after the convolution is called a feature map. This feature map is the same
    size as the number of kernels. So basically you can think of this as, each kernel
    will extract a different feature, and place it onto the feature map. Example:


    Input image size: (3, 32, 32)


    First kernel size: (3, M1, 5, 5)


    Note that the order in which the dimensions appear is somewhat arbitrary. For
    example, the data from the MATLAB files has N as the last dimension, whereas Theano
    expects it to be in the first dimension.


    We’ll see that in TensorFlow the dimensions of the kernels are going to be different
    from Theano.


    Another thing to note is that the shapes of our filters are usually MUCH smaller
    than the image itself. What this means is that the same tiny filter gets applied
    across the entire image. This is the idea of weight sharing.


    By sharing this weight we’re introducing less parameters into the model, and this
    is going to help us generalize better, since as you know from my previous courses,
    when you have TOO many parameters, you’ll end up overfitting.


    You can think of this as a method of generalization.


    In the schematic above, we assume a pooling size of (2, 2), which is what we will
    also use in the code. This fits our data nicely because both 28 (MNIST) and 32
    (SVHN) can be divided by 2 twice evenly.


    Training a CNN


    Now this is the cool part.


    It’s ridiculous how many people take my courses or read my books and ask things
    like, “But, but, … what about X modern technique?”


    Well, here’s how you train a CNN:


    W <— W - learning\_rate \* dJ/dW


    Look familiar?


    That’s because it’s the same “backpropagation” (gradient descent) equation from
    plain neural networks!


    People think there is some kind of sorcery or well-kept secret behind all of this
    that is going to take years and years of effort for them to figure out.


    People have been using convolution since the 1700s. LeCun himself published his
    paper in 1998.


    Researchers conjure up new ways to hack together neural networks everyday. The
    ones that become popular are the ones that perform well.


    You can imagine, however, with so many researchers researching there is bound
    to be someone who does better than the others.


    You too, can be a deep learning researcher. Just try different things. Be creative.
    Use backprop. Easy, right?


    Remember, in Theano, it’s just:


    param = param - learning\_rate \* T.grad(cost, param)


    #  


    # Chapter 4: Sample Code in Theano


    In this chapter we are going to look at the components of the Theano convolutional
    neural network. This code can also be found at [https://github.com/lazyprogrammer/machine\_learning\_examples/blob/master/cnn\_class/cnn\_theano.py](https://github.com/lazyprogrammer/machine_learning_examples/blob/master/cnn_class/cnn_theano.py)


    So the first thing you might be wondering after learning about convolution and
    downsampling is - does Theano have functions for these? And of course the answer
    is yes.


    In the LeNet we always do the convolution followed by pooling, so we just call
    it convpool.


    def convpool(X, W, b, poolsize=(2, 2)):


    conv\_out = conv2d(input=X, filters=W)


    pooled\_out = downsample.max\_pool\_2d(


    input=conv\_out,


    ds=poolsize,


    ignore\_border=True


    )


    return relu(pooled\_out + b.dimshuffle(''x'', 0, ''x'', ''x''))


    Notice that max pool requires some additional parameters.


    The last step where we call the function dimshuffle() on the bias does a broadcasting
    since b is a 1-D vector and after the conv\_pool operation you get a 4-D tensor.
    You’ll see that TensorFlow has a function that encapsulates this for us.'
