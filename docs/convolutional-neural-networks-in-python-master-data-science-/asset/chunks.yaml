    def init\_filter(shape, poolsz):


    w = np.random.randn(\*shape) / np.sqrt(np.prod(shape\[:-1\]) + shape\[-1\]\*np.prod(shape\[:-2\]
    / np.prod(poolsz)))


    return w.astype(np.float32)


    def rearrange(X):


    \# input is (32, 32, 3, N)


    \# output is (N, 32, 32, 3)


    N = X.shape\[-1\]


    out = np.zeros((N, 32, 32, 3), dtype=np.float32)


    for i in xrange(N):


    for j in xrange(3):


    out\[i, :, :, j\] = X\[:, :, j, i\]


    return out / 255


    def main():


    train = loadmat(''../large\_files/train\_32x32.mat'') # N = 73257


    test = loadmat(''../large\_files/test\_32x32.mat'') # N = 26032


    \# Need to scale! don''t leave as 0..255


    \# Y is a N x 1 matrix with values 1..10 (MATLAB indexes by 1)


    \# So flatten it and make it 0..9


    \# Also need indicator matrix for cost calculation


    Xtrain = rearrange(train\[''X''\])


    Ytrain = train\[''y''\].flatten() - 1


    print len(Ytrain)


    del train


    Xtrain, Ytrain = shuffle(Xtrain, Ytrain)


    Ytrain\_ind = y2indicator(Ytrain)


    Xtest = rearrange(test\[''X''\])


    Ytest = test\[''y''\].flatten() - 1


    del test


    Ytest\_ind = y2indicator(Ytest)


    \# gradient descent params


    max\_iter = 20


    print\_period = 10


    N = Xtrain.shape\[0\]


    batch\_sz = 500


    n\_batches = N / batch\_sz


    \# limit samples since input will always have to be same size


    \# you could also just do N = N / batch\_sz \* batch\_sz


    Xtrain = Xtrain\[:73000,\]


    Ytrain = Ytrain\[:73000\]


    Xtest = Xtest\[:26000,\]


    Ytest = Ytest\[:26000\]


    Ytest\_ind = Ytest\_ind\[:26000,\]


    \# initialize weights


    M = 500


    K = 10


    poolsz = (2, 2)


    W1\_shape = (5, 5, 3, 20) # (filter\_width, filter\_height, num\_color\_channels,
    num\_feature\_maps)


    W1\_init = init\_filter(W1\_shape, poolsz)


    b1\_init = np.zeros(W1\_shape\[-1\], dtype=np.float32) # one bias per output feature
    map


    W2\_shape = (5, 5, 20, 50) # (filter\_width, filter\_height, old\_num\_feature\_maps,
    num\_feature\_maps)


    W2\_init = init\_filter(W2\_shape, poolsz)


    b2\_init = np.zeros(W2\_shape\[-1\], dtype=np.float32)


    \# vanilla ANN weights


    W3\_init = np.random.randn(W2\_shape\[-1\]\*8\*8, M) / np.sqrt(W2\_shape\[-1\]\*8\*8
    + M)


    b3\_init = np.zeros(M, dtype=np.float32)


    W4\_init = np.random.randn(M, K) / np.sqrt(M + K)


    b4\_init = np.zeros(K, dtype=np.float32)


    \# define variables and expressions


    \# using None as the first shape element takes up too much RAM unfortunately


    X = tf.placeholder(tf.float32, shape=(batch\_sz, 32, 32, 3), name=''X'')


    T = tf.placeholder(tf.float32, shape=(batch\_sz, K), name=''T'')


    W1 = tf.Variable(W1\_init.astype(np.float32))


    b1 = tf.Variable(b1\_init.astype(np.float32))


    W2 = tf.Variable(W2\_init.astype(np.float32))


    b2 = tf.Variable(b2\_init.astype(np.float32))


    W3 = tf.Variable(W3\_init.astype(np.float32))


    b3 = tf.Variable(b3\_init.astype(np.float32))


    W4 = tf.Variable(W4\_init.astype(np.float32))


    b4 = tf.Variable(b4\_init.astype(np.float32))


    Z1 = convpool(X, W1, b1)


    Z2 = convpool(Z1, W2, b2)


    Z2\_shape = Z2.get\_shape().as\_list()


    Z2r = tf.reshape(Z2, \[Z2\_shape\[0\], np.prod(Z2\_shape\[1:\])\])


    Z3 = tf.nn.relu( tf.matmul(Z2r, W3) + b3 )


    Yish = tf.matmul(Z3, W4) + b4


    cost = tf.reduce\_sum(tf.nn.softmax\_cross\_entropy\_with\_logits(Yish, T))


    train\_op = tf.train.RMSPropOptimizer(0.0001, decay=0.99, momentum=0.9).minimize(cost)


    \# we''ll use this to calculate the error rate


    predict\_op = tf.argmax(Yish, 1)


    t0 = datetime.now()


    LL = \[\]


    init = tf.initialize\_all\_variables()


    with tf.Session() as session:


    session.run(init)


    for i in xrange(max\_iter):


    for j in xrange(n\_batches):


    Xbatch = Xtrain\[j\*batch\_sz:(j\*batch\_sz + batch\_sz),\]


    Ybatch = Ytrain\_ind\[j\*batch\_sz:(j\*batch\_sz + batch\_sz),\]


    if len(Xbatch) == batch\_sz:


    session.run(train\_op, feed\_dict={X: Xbatch, T: Ybatch})


    if j % print\_period == 0:


    \# due to RAM limitations we need to have a fixed size input


    \# so as a result, we have this ugly total cost and prediction computation


    test\_cost = 0


    prediction = np.zeros(len(Xtest))


    for k in xrange(len(Xtest) / batch\_sz):


    Xtestbatch = Xtest\[k\*batch\_sz:(k\*batch\_sz + batch\_sz),\]


    Ytestbatch = Ytest\_ind\[k\*batch\_sz:(k\*batch\_sz + batch\_sz),\]


    test\_cost += session.run(cost, feed\_dict={X: Xtestbatch, T: Ytestbatch})


    prediction\[k\*batch\_sz:(k\*batch\_sz + batch\_sz)\] = session.run(


    predict\_op, feed\_dict={X: Xtestbatch})


    err = error\_rate(prediction, Ytest)


    print "Cost / err at iteration i=%d, j=%d: %.3f / %.3f" % (i, j, test\_cost, err)


    LL.append(test\_cost)


    print "Elapsed time:", (datetime.now() - t0)


    plt.plot(LL)


    plt.show()


    if \_\_name\_\_ == ''\_\_main\_\_'':


    main()


