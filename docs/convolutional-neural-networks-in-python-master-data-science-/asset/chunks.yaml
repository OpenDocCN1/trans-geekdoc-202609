    \n`# (filter_width, filter_height, old_num_feature_maps, num_feature_maps)`\n\n\
    `W2_shape = (5, 5, 20, 50)`\n\n`W2_init = init_filter(W2_shape, poolsz)`\n\n`b2_init\
