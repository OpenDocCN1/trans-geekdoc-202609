    ### Where to get the data used in this book


    This book will use the MNIST dataset (handwritten digits) and the streetview house
    number (SVHN) dataset.


    The streetview house number dataset is a much harder problem than MNIST since
    the images are in color, the digits can be at an angle and in different styles
