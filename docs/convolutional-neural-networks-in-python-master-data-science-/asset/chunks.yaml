- raw: '


    Convolutional Neural Networks in Python


    Master Data Science and Machine Learning with Modern Deep Learning in Python,
    Theano, and TensorFlow


    By: The LazyProgrammer ([http://lazyprogrammer.me](http://lazyprogrammer.me))


    [Introduction](../Text/part0001.html#UGI1-929b3035e09748a1895098cb3d0bb252)


    [Chapter 1: Review of Feedforward Neural Networks](../Text/part0002.html#1T141-929b3035e09748a1895098cb3d0bb252)


    [Chapter 2: Convolution](../Text/part0003.html#chapter-3)


    [Chapter 3: The Convolutional Neural Network](../Text/part0004.html#chapter-4)


    [Chapter 4: Sample Code in Theano](../Text/part0005.html#chapter-5)


    [Chapter 5: Sample Code in TensorFlow](../Text/part0006.html#chapter-6)


    [Conclusion](../Text/part0007.html#chapter-7)


    # Introduction


    This is the 3rd part in my Data Science and Machine Learning series on Deep Learning
    in Python. At this point, you already know a lot about neural networks and deep
    learning, including not just the basics like backpropagation, but how to improve
    it using modern techniques like momentum and adaptive learning rates. You''ve
    already written deep neural networks in Theano and TensorFlow, and you know how
    to run code using the GPU.


    This book is all about how to use deep learning for computer vision using convolutional
    neural networks. These are the state of the art when it comes to image classification
    and they beat vanilla deep networks at tasks like MNIST.


    In this course we are going to up the ante and look at the StreetView House Number
    (SVHN) dataset - which uses larger color images at various angles - so things
    are going to get tougher both computationally and in terms of the difficulty of
    the classification task. But we will show that convolutional neural networks,
    or CNNs, are capable of handling the challenge!


    Because convolution is such a central part of this type of neural network, we
    are going to go in-depth on this topic. It has more applications than you might
    imagine, such as modeling artificial organs like the pancreas and the heart. I''m
    going to show you how to build convolutional filters that can be applied to audio,
    like the echo effect, and I''m going to show you how to build filters for image
    effects, like the Gaussian blur and edge detection.


    After describing the architecture of a convolutional neural network, we will jump
    straight into code, and I will show you how to extend the deep neural networks
    we built last time with just a few new functions to turn them into CNNs. We will
    then test their performance and show how convolutional neural networks written
    in both Theano and TensorFlow can outperform the accuracy of a plain neural network
    on the StreetView House Number dataset.


    All the materials used in this book are FREE. You can download and install Python,
    Numpy, Scipy, Theano, and TensorFlow with pip or easy\_install.


    Lastly, my goal is to show you that convolutional networks aren’t magical and
    they don’t require expert-level math to figure out.


    It’s just the same thing we had with regular neural networks:


    y = softmax( relu(X.dot(W1).dot(W2) )


    Except we replace the first “dot product” with a convolution:


    y = softmax( relu(conv(X, W1)).dot(W2) )


    The way they are trained is exactly the same as before, so all your skills with
    backpropagation, etc. carry over.


    # Chapter 1: Review of Feedforward Neural Networks


    In this lecture we are going to review some important background material that
    is needed in order to understand the material in this course. I’m not going to
    cover the material in depth here but rather just explain what it is that you need
    to know.


    Train and Predict


    You should know that the basic API that we can use for all supervised learning
    problems is fit(X,Y) or train(X,Y) function, which takes in some data X and labels
    Y, and a predict(X) function which just takes in some data X and makes a prediction
    that we will try to make close to the corresponding Y.


    Predict


    We know that for neural networks the predict function is also called the feedforward
    action, and this is simply the dot product and a nonlinear function on each layer
    of the neural network.


    e.g. z1 = s(w0x), z2 = s(w1z1), z3 = s(w2z2), y = s(w3z3)


    We know that the nonlinearities we usually use in the hidden layers is usually
    a relu, sigmoid, or tanh.


    We know that the output is a sigmoid for binary classification and softmax for
    classification with >= 2 classes.


    Train


    We know that training a neural network simply is the application of gradient descent,
    which is the same thing we use for logistic regression and linear regression when
    we don’t have a closed-form solution. We know that linear regression has a closed
    form solution but we don’t necessarily have to use it, and that gradient descent
    is a more general numerical optimization method.


    W ← W - learning\_rate \* dJ/dW


    We know that libraries like Theano and TensorFlow will calculate the gradient
    for us, which can get very complicated the more layers there are. You’ll be thankful
    for this feature of neural networks when you see that the output function becomes
    even more complex when we incorporate convolution (although the derivation is
    still do-able and I would recommend trying for practice).


    At this point you should be familiar with how the cost function J is derived from
    the likelihood and how we might not calculate J over the entire training data
    set but rather in batches to improve training time.


    If you want to learn more about backpropagation and gradient descent you’ll want
    to check out my first course on deep learning, Deep Learning in Python part 1,
    which you can find at [https://udemy.com/data-science-deep-learning-in-python](https://udemy.com/data-science-deep-learning-in-python)


    Data Preprocessing


    When we work with images you know that an image is really a 2-D array of data,
    and that if we have a color image we have a 3-D array of data where one extra
    dimension is for the red, green, and blue channels.


    In the past, we’ve flattened this array into a vector, which is the usual input
    into a neural network, so for example a 28 x 28 image becomes a 784 vector, and
    a 3 x 32 x 32 image becomes a 3072 dimensional vector.


    In this book, we are going to keep the dimensions of the original image for a
    portion of the processing.


    Where to get the data used in this book


    This book will use the MNIST dataset (handwritten digits) and the streetview house
    number (SVHN) dataset.


    The streetview house number dataset is a much harder problem than MNIST since
    the images are in color, the digits can be at an angle and in different styles
    or fonts, and the dimensionality is much larger.


    To get the code we use in this book you’ll want to go to:


    [https://github.com/lazyprogrammer/machine\_learning\_examples](https://github.com/lazyprogrammer/machine_learning_examples)


    And look in the folder: cnn\_class


    If you’ve already checked out this repo then simply do a “git pull” since this
    code will be on the master branch.


    I would highly recommend NOT just running this code but using it as a backup if
    yours doesn’t work, and try to follow along with the code examples by typing them
    out yourself to build muscle memory.


    Once you have the machine\_learning\_examples repo you’ll want to create a folder
    adjacent to the cnn\_class folder called large\_files if you haven’t already done
    that for a previous class.


    That is where we will expect all the data to reside.


    To get the MNIST data, you’ll want to go to [https://www.kaggle.com/c/digit-recognizer](https://www.kaggle.com/c/digit-recognizer)


    I think it’s pretty straightforward to download at that point. We’re only going
    to use the train.csv file since that’s the one with labels. You are more than
    welcome to attempt the challenge and submit a solution using the techniques you
    learn in this class.


    You can get the streetview house number data from [http://ufldl.stanford.edu/housenumbers/](http://ufldl.stanford.edu/housenumbers/)


    You’ll want to get the files under “format 2”, which are the cropped digits.'
