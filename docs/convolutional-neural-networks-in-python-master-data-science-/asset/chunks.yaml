    # Chapter 4: Sample Code in Theano


    In this chapter we are going to look at the components of the Theano convolutional
    neural network. This code can also be found at [https://github.com/lazyprogrammer/machine_learning_examples/blob/master/cnn_class/cnn_theano.py](https://github.com/lazyprogrammer/machine_learning_examples/blob/master/cnn_class/cnn_theano.py)


