- raw: 'Note that these are MATLAB binary data files, so we’ll need to use the Scipy
    library to load them, which I’m sure you have heard of if you’re familiar with
    the Numpy stack.


    #  


    # Chapter 2: Convolution


    In this chapter I’m going to give you guys a crash course in convolution. If you
    really want to dig deep on this topic you’ll want to take a course on signal processing
    or linear systems.


    So what is convolution?


    Think of your favorite audio effect (suppose that’s the “echo”). An echo is simply
    the same sound bouncing back at you in the future, but with less volume. We’ll
    see how we can do that mathematically later.


    All effects can be thought of as filters, like the one I’ve shown here, and they
    are often drawn in block diagrams. In machine learning and statistics these are
    sometimes called kernels.


    \--------


    x(t)--->| h(t) |--->y(t)


    \--------


    I’m representing our audio signal by this triangle. Remember that we want to do
    2 things, we want to hear this audio signal in the future, which is basically
    a shift in to the right, and this audio signal should be lower in amplitude than
    the original.


    The last operation is to sum them all together.


    ￼![image.png](OEBPS/Images/00001.jpeg)


    Notice that the width of the signal stays the same, because it hasn’t gotten longer
    or shorter, which would change the pitch.


    So how can we do this in math? Well we can represent the amplitude changes by
    weights called w. And for this particular echo filter we just make sure that each
    weight is less than the last.


    e.g. y(t) = x(t) + 0.5x(t - delay) + 0.2x(t - 2\*delay) + 0.1x(t - 3\*delay) +
    …


    For any general filter, there wouldn’t be this restriction on the weights. The
    weights themselves would define the filter.


    And we can write the operation as a summation.


    y(n) = sum\[m=-inf..+inf\]{ h(m)x(n - m) }


    So now here is what we consider the “definition” of convolution. We usually represent
    it by an asterisk (e.g. y(n) = x(n) \* h(n)). We can do it for a continuous independent
    variable (where it would involve an integral instead of a sum) or a discrete independent
    variable.


