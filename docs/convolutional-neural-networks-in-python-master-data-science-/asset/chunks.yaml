    \n我们将做与 Theano 时类似的事情，即在将所有部分整合之前，更深入地检查代码的每个部分。\n\n希望这能帮助大家分离每个部分，并了解它们的工作原理。\n\
    \n这是 TensorFlow 中的 ConvPool。它与我们在 Theano 中所做的几乎相同，只是 `conv2d()` 函数接受一个名为 `strides`\
    \ 的新参数。\n\n```\ndef convpool(X, W, b):\n    # just assume pool size is (2,2) because\
    \ we need to augment it with 1s\n    conv_out = tf.nn.conv2d(X, W, strides=[1,\
    \ 1, 1, 1], padding='SAME')\n    conv_out = tf.nn.bias_add(conv_out, b)\n    pool_out\
    \ = tf.nn.max_pool(conv_out, ksize=[1, 2, 2, 1], strides=[1, 2, 2, 1], padding='SAME')\n\
    \    return pool_out\n```\n\n在过去，我们只是假设必须将滤波器沿信号的每个点拖动，但实际上我们可以以任何想要的步长移动，这就是\
    \ `stride` 的含义。我们还将使用 `padding` 参数来控制输出的大小。\n\n请记住，偏差是一个 1-D 向量，我们在 Theano 中使用了\
    \ `dimshuffle` 函数将其添加到卷积输出中。在这里，我们可以直接使用 TensorFlow 内置的 `bias_add()` 函数。\n\n接下来我们调用\
    \ `max_pool()` 函数。请注意，`ksize` 参数有点像我们在 Theano 中使用的 `poolsize` 参数，但现在它是 4-D 而不是\
    \ 2-D。我们只需在两端添加 1。请注意，此函数也接受 `strides` 参数，这意味着我们可以在每个步骤上执行 `max_pool`，但我们将像以前一样只使用非重叠的子图像。\n\
    \n下一步是重新排列输入。请记住，Theano 中的卷积与 TensorFlow 中的卷积不同。这意味着我们不仅要调整输入维度，还要调整滤波器维度。输入的唯一变化是颜色现在排在最后。\n\
    \n```\ndef rearrange(X):\n    # input is (32, 32, 3, N)\n    # output is (N, 32,\
    \ 32, 3)\n    N = X.shape[-1]\n    out = np.zeros((N, 32, 32, 3), dtype=np.float32)\n\
    \    for i in xrange(N):\n        for j in xrange(3):\n            out[i, :, :,\
    \ j] = X[:, :, j, i]\n    return out / 255\n```\n\n下一步是 TensorFlow 实现所独有的。如果你记得，TensorFlow\
    \ 允许我们不必指定输入中每个维度的大小。\n\n这很棒，并允许很大的灵活性，但在开发过程中我遇到了一个问题，即当我这样做时，我的 RAM 开始交换。如果你还没有注意到，SVHN\
    \ 数据的大小相当大，约 73k 个样本。\n\n因此，一种解决方法是使形状保持不变，你将在后面看到。这意味着我们每次都必须传入 `batch_sz` 个样本，这意味着我们使用的样本总数必须是它的倍数。在代码中我使用了确切的数字，但你也可以使用数据来计算它。\n\
