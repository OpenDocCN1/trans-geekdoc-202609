    you can think of as the number of kernels or filters we are going to create, then
    it has “num\_color\_channels”, which is 3 for a color image, and then the filter
    width and height. I’ve chosen to use 5 since that’s what I usually see in existing
    code, but of course this is a hyperparameter that you can optimize.


    \# (num\_feature\_maps, num\_color\_channels, filter\_width, filter\_height)


    W1\_shape = (20, 3, 5, 5)


