    ```

    def convpool(X, W, b, poolsize=(2, 2)):


    conv_out = conv2d(input=X, filters=W)


    pooled_out = downsample.max_pool_2d(


    input=conv_out,


    ds=poolsize,


    ignore_border=True


    )


    return relu(pooled_out + b.dimshuffle(''x'', 0, ''x'', ''x''))

