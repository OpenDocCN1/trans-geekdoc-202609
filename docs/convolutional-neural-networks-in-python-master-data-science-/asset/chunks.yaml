    # Chapter 2: Convolution


    In this chapter I’m going to give you guys a crash course in convolution. If you
    really want to dig deep on this topic you’ll want to take a course on signal processing
    or linear systems.


    So what is convolution?


    Think of your favorite audio effect (suppose that’s the “echo”). An echo is simply
    the same sound bouncing back at you in the future, but with less volume. We’ll
    see how we can do that mathematically later.


    All effects can be thought of as filters, like the one I’ve shown here, and they
    are often drawn in block diagrams. In machine learning and statistics these are
    sometimes called kernels.


    ```

    x(t)--->| h(t) |--->y(t)

    ```


    I’m representing our audio signal by this triangle. Remember that we want to do
    2 things, we want to hear this audio signal in the future, which is basically
    a shift in to the right, and this audio signal should be lower in amplitude than
    the original.


    The last operation is to sum them all together.


    ![image.png](OEBPS/Images/00001.jpeg)


    Notice that the width of the signal stays the same, because it hasn’t gotten longer
    or shorter, which would change the pitch.


    So how can we do this in math? Well we can represent the amplitude changes by
    weights called `w`. And for this particular echo filter we just make sure that
    each weight is less than the last.


    e.g. `y(t) = x(t) + 0.5x(t - delay) + 0.2x(t - 2*delay) + 0.1x(t - 3*delay) +
    …`


    For any general filter, there wouldn’t be this restriction on the weights. The
    weights themselves would define the filter.


    And we can write the operation as a summation.


    `y(n) = sum[m=-inf..+inf]{ h(m)x(n - m) }`


    So now here is what we consider the “definition” of convolution. We usually represent
    it by an asterisk (e.g. `y(n) = x(n) * h(n)`). We can do it for a continuous independent
    variable (where it would involve an integral instead of a sum) or a discrete independent
    variable.


    You can think of it as we are “sliding” the filter across the signal, by changing
    the value of `m`.


    I want to emphasize that it doesn’t matter if we slide the filter across the signal,
    or if we slide the signal across the filter, since they would give us the same
    result.


    There are some very practical applications of this signal processing technique.


    One of my favorite examples is that we can build artificial organs. Remember that
    the organ’s function is to regulate certain parameters in your body.


    So to replace an organ, we would need to build a machine that could exactly match
    the response of that organ. In other words, for all the input parameters, like
    blood glucose level, we need to output the same parameters that the organ does,
    like how much insulin to produce.


    So for every input `X` we need to output an accurate `Y`.


    In fact, that sounds a lot like machine learning, doesn’t it!


    Since we’ll be working with images, we need to talk about 2-dimensional convolution,
    since images are 2-dimensional signals.


    `y(m,n) = sum[i=-inf..+inf]{ sum[j=-inf..+inf]{ h(i,j)x(m-i,n-j) } }`


    You can see from this formula that this just does both convolutions independently
    in each direction. I’ve got some pseudocode here to demonstrate how you might
    write this in code, but notice there’s a problem. If `i > n` or `j > m`, we’ll
    go out of bounds.


    ```

    def convolve(x, w):


    y = np.zeros(x.shape)


    for n in xrange(x.shape[0]):


    for m in xrange(x.shape[1]):


    for i in xrange(w.shape[0]):


    for j in xrange(w.shape[1]):


    y[n,m] += w[i,j]*x[n-i,m-j]

    ```


    What that tells us is that the shape of `Y` is actually BIGGER than `X`. Sometimes
    we just ignore these extra parts and consider `Y` to be the same size as `X`.
    You’ll see when we do this in Theano and TensorFlow how we can control the method
    in which the size of the output is determined.


    ## Gaussian Blur


    If you’ve ever done image editing with applications like Photoshop or GIMP you
    are probably familiar with the blur filter. Sometimes it’s called a Gaussian blur,
    and you’ll see why in a minute.


    If you just want to see the code that’s already been written, check out the file
    `https://github.com/lazyprogrammer/machine_learning_examples/blob/master/cnn_class/blur.py`
    from Github.


    The idea is the same as we did with the sound echo. We’re going to take a signal
    and spread it out.


