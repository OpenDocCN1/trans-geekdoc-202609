- raw: 'The next component is the rearranging of the input. Remember that MATLAB does
    things a bit weirdly and puts the index to each sample in the LAST dimension,
    but Theano expects it to be in the FIRST dimension. It also happens to expect
    the color dimension to come next. So that is what this code here is doing.


    def rearrange(X):


    \# input is (32, 32, 3, N)


    \# output is (N, 3, 32, 32)


    N = X.shape\[-1\]


    out = np.zeros((N, 3, 32, 32), dtype=np.float32)


