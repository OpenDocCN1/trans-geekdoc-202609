- "# 自适应微学习：利用碎片化时间学习（智能信息系统）\n\n\n\n\n![Images](img/Halftitle.jpg)\n\n\n\n 主编\nDa\
  \ Ruan *(比利时核研究中心 (SCK.CEN) & 比根特大学)*\nJie Lu *(澳大利亚悉尼科技大学)*\n\n\n作者：孙更（澳大利亚伍伦冈大学）、沈军（澳大利亚伍伦冈大学）及\
  \ 琳雅音（澳大利亚伍伦冈大学）\n\n作者：Asif Qumer Gill（澳大利亚科技大学）\n\n作者：Steven Schockaert（比利时根特大学）、Martine\
  \ De Cock（比利时根特大学）及 Etienne Kerre（比利时根特大学）\n\n作者：Jun Xu（澳大利亚南方交叉大学）及 Mohammed Quaddus（澳大利亚科尔廷科技大学）\n\
  \n编辑：Agusti Solanas & Antoni Martínez-Ballesté（西班牙罗维拉维吉利大学）\n\n![Images](img/Title.jpg)\n\
  \n\n\n\n\n\n\n\n\n\n\n# 第 1 章：引言\n## 1.1 背景\n### 1.1.1 背景\n技术的快速发展使得学习模式变得多样，不再局限于教室和纸质教材。换句话之，学习活动可以通过多种设备在远程进行。远程学习通常是通过电子手段来扩大其影响，简化信息传递的方法，并产生新的教学领域。教育提供者对以数字形式在线发布学习资源（包括文本、图像、音频、视频等）表现出越来越兴趣。因此，学习者可以利用电子学习参与学习活动，并根据自己的进度访问学习内容。其中，学习者获得了自主的自由，并能够决定减慢或加快自己的学习速度。\n\
  \n电子学习的显著发展可以从两个角度来看：首先，只要无线网络良好，就可以通过移动设备随时随地获得学习机会。在电子学习的所有类型模式中，移动学习（m-learning）正在迅速兴起，它让学习者能够更加自由，随时随地进行学习活动。\n\
  \n\n\n\n\n移动学习（m-learning）的一个引人注目的现象是碎片化时间可以得到有效利用。此外，随着移动设备的普及，人们利用智能手机和平板电脑参与在线学习，这被称为“微学习”（micro\
  \ learning）。微学习是一种基于小型学习单元活动的短期学习形式。它的假设是，完成一项相关的学习任务只需要很短的时间。它不仅要求学习任务是碎片化的，还要求任务能够被完整完成（而不是半途而废）。在当代电子社会中，微学习涉及通过开放教育资源传递的微小知识点（Kovachev\
  \ et al. 2012）。它是移动环境中主要的学习渠道，并在能够在移动中学习的新一代学习者中越来越流行，因为他们可以轻松访问“云端”或物联网（Bruck et\
  \ al., 2012; Hug & Lindner, 2005）。因此，大多数开放教育资源（OER）提供者已迅速在主流移动设备和操作系统（如 `iOS`、`Android`）上发布了他们的移动应用程序，并将其网页适配到移动设备的屏幕尺寸和操作模式，以便学习者能够更方便的使用。\n\
  \n其次，海量的学习资源已向公众开放。自计算早期以来，学者们就开始分享数字内容（Land & McAndrew, 2010）。通过开放教育资源进行在线学习是教育领域的最新技术之一。它提供了一个基于开放网络模型，让任何年龄段的人实现免费或低成本的学习。它已成为全球教师和学生的重要资源库。2001\
  \ 年，麻省理工学院（MIT）作为试点首次启动了开放课程网上（OCW），目标是将其所有的课件发布在网络上，并提供允许使用、修改和重新分发已发布课件的许可。从以后，许多其他大学也加入了将课件材料开放的行列。开放教育资源的推广使学习者能够直接获取材料并从中学习，并允许教育工作者在自己的教学中直接使用或修改后使用材料（Liyanaguanawardena\
  \ et al., 2013）。通过开放教育资源，任何背景、任何专业水平的任何人都获得了平等的机会参加课程，并获取他们原本无法负担的教育内容和知识。特别是，目前有数百万人正在参与大规模开放在线课程（MOOC）的虚拟课堂。事实上，同一门课程同时注册的学生人数可能多达数万（Souza\
  \ & Amaral, 2014）。随着越来越多的大学和其他教育机构提供其课程的在线访问，开放学习在成人教育中获得了更广泛的普及，特别是在高等教育和职业教育中。\n\
  \n## 1.1.2 研究问题现状\n\n使用移动设备进行开放式课程为学习内容的自适应传递带来了额外挑战。在移动学习环境中，学习者可以使用其移动设备访问互联网上的任何学习内容。他们对学习的时间和地点有完全的控制权；不受课表或教室位置的限制。学习者还能够选择他们想要学习的内容；他们不需要预先老师为那节课准备和安排的内容。尽管移动学习具有许多优势，但直到最近，由于支持技术的质量问题以及可用学习内容的过载，移动学习的实用性一直受到限制。另一方面，人们通过与他人的互动利用周围环境；他们解释当前的语境并对其做出反应。例如，当学生与同伴互动时，他们会自动观察同学的语气并以适当的方式做出回应。手机等设备无法像人类在交互环境中那样解释周围的语境。这类设备无法以透明的方式充分利用可用信息；因此，必须显式地向这些设备提供语境信息，以便设备做出恰当的响应（Sharples\
  \ et al., 2009）。特别是在移动学习应用中，语境和个人特征之间存在着强烈的影响，即个人特征决定了学习者的行为，而行为决定了语境。环境感知（context-aware）的概念由两个元素组成：与学习者相关的个性化，以及与适应过程相关的自动定制。与学习者相关的个性化意味着系统了解学习者，并根据学习者的需求自适应地提供定制内容（Al-Hmouz\
  \ et al. 2012, Xu et al., 2014）。\n\n自动定制意味着系统根据机器学习机制以自动方式为学习者创建一个模型，以适应学习者的情况和需求。尽管个性化学习资源的定制多年来一直被讨论（Zhuhadar\
  \ & Nasraoui, 2008），但开放学习模式还太新，尚未参与这项研究工作。因此，很少有个性化学习交付结合开放学习的特征。个体学习者的特定需求在开放学习中可能会大异，通常不同于传统学习。利用学习者建模和教育计算技术来增强开放学习体验的研究较少。\n\
  \n在多样化学习环境中，开放教育资源向学习者的交付有效性仍然面临挑战。许多这些开放资源用途有限，因为它们是构建为特定教育框架内某些更大教育体验的特定部分（Adames\
  \ et al. 2013）。在移动平台上，学习者的注意力跨度通常限制在 15 分钟，因为他们经常中断学习活动并将注意力转移到其他活动（Stockwell, 2008）。对\
  \ MOOC 的研究显示，在线课程目前面临完成率低的问题。此外，作为主要的 MOOC 提供者之一，`edX`发现时长小于 6 分钟的视频更有吸引力，因为学生的参与度在\
  \ 6 分钟后会剧减（Hylen et al., 2012; Guo et al., 2014）。大多数注册在线课程的学生最终因各种原因退学（Nawrot &\
  \ Doucet, 2014）。由于开放教育资源的研究仍处于婴儿阶段，在如何改进其学习机制方面显然有很多研究空白，例如提供更有效的学习平台和学习支持服务，以便为服务提供者和学习者提供更容易的访问和更好的体验。\n\
  \n\n\n\n此外，针对学习资源适配的研究尚未扩展到微学习场景，而且尚未考虑到学习资源的长度或规模，或是学习者的可用时间跨度。使用移动设备的碎片化学习需要学习者集中注意力并反思。然而，在旅途中充满了不可预知的情况和干扰因素。这导致移动学习者面临着高度分心、高度碎片化的学习体验。此外，研究表明，性格和学习风格对学业成就有显著影响（Daradoumins\
  \ et al., 2013）。学习者在起初选择学习哪些课程时，或者随后在有许多选项需要考虑时，可能会感到无足无措。他们很可能无法获得合适的微开放教育资源（micro\
  \ OER），这即使他们花费了大量时间，也会影响他们获得满意的结果。在当前的开放学习环境中，学习资源通常由教育提供者或课程讲师进行划分和封装。这种方法缺乏适应特定学习者学习风格、进度和可用时间的灵活性。通常，学习者需要挤时间来完成那些学习活动，因为他们是被动地接受内容。我们同事的试点工作开发了一个自适应移动学习系统原型，但它仍然缺乏调整已进行中课程的机制（Al-Hmouz\
  \ et al., 2010），在这些情况下，学生需要自己制定日程并在较长时间的时间内仔细计划时间，而没有个人指导。因此，将微学习引入开放学习环境暴露了待填补的重要研究空白。\n\
  \n在本书的其余部分，“通过 OER 进行微学习”和“微开放学习”这两个术语将通用使用。\n\n## 1.2 研究目标\n\n有效的微内容交付是课程讲师或交付者将先前的教学策略适配到微学习环境时需要克服的主要障碍之一（Sun\
  \ & Shen, 2014）。因此，本书旨在研究更智能的微学习系统如何帮助学习者利用他们在移动设备上花费的碎片时间来获取 OER。\n\n在填补定制化微 OER\
  \ 以及为服务提供者和学习者提供更易访问和更好体验的当前研究空白方面，本书旨在解决自适应微开放学习中的各种问题，这些问题将通过微开放学习框架设计、面向微开放学习的个性化学习者模型构建、教育数据挖掘与学习分析（`EDM`\
  \ 和 `LA`）策略设计、语义学习者和微 OER 描述、以及冷启动问题的敏捷解决方案来考虑。本书介绍了一种提供自适应 OER 的新方法，这些 OER 是为了满足执行微学习需求而定制的碎片化。\n\
  \n## 1.3 本书贡献\n\n根据所提目标的实现，本书的贡献可以总结如下：\n\n- 基于面向服务的架构（`SOA`）开发了一个系统框架。该系统——“微学习即服务（MLaaS）”同时采用离线和在线计算领域协同工作，以提高学习资源适配的性能。\n\
  - 我们提出了一个全面的学习者模型，允许系统考虑个人学习风格、学习者情境、应用能力和教学材料结构，从而根据用户需求对学习信息的类型和交付格式进行定制。\n- 构建了一个知识库，填补了正式\
  \ OER 结构化、描述和推理的空白。针对校园学习数据源和开放学习数据（`大数据`）源，制定了详细的 `EDM` 和 `LA` 策略。\n- 为 `MLaaS`\
  \ 中的在线计算组织提供了解决方案，并提供了一种解决微 OER 推荐冷启动问题的启发式方法。该解决方案经过实证评估，证明了其可行性。\n\n## 1.4 本书大纲\n\
  \n本书由三个部分组成，按顺序排列：\n\n- 研究的理论方面，将在第 2 章、第 3 章、第 4 章和第 5 章中介绍。\n- 研究的实践方面，将在第 6 章和第\
  \ 7 章中介绍。\n- 研究的结论部分和进一步研究的建议将在第九章介绍。\n\n本书其余部分的安排如下：\n\n第 2 章将介绍研究的基本原理，包括术语和文献综述。它将从对距离学习及其发展（即从电子学习到移动学习的转变）文献的全面检查开始。接下来是开放学习和\
  \ OER 带来的影响。将讨论在开放学习中采用微学习的可行性。本章强调了微开放学习的优势，并强调了改进其交付方式的技术，包括学习者建模、`EDM` 和 `LA`以及大数据。\n\
  \n研究的整体设计将在第 3 章中展开。将结合我们的试点研究阐述研究背景。受此启发，将通过示例场景演示研究目的，在理想情况下可以组织自适应微学习活动。在第 3\
  \ 章的最后一部分，将介绍 `MLaaS` 框架，以描述适配微 OER 以满足个人学习者需求和情境的过程。`MLaaS`的功能将由在线和离线计算领域共同赋能。\n\
  \n通常，有很多因素影响学习体验和结果。在第 4 章中，我们从概念上构建一个面向微开放学习的全面学习者模型。将从内部和外部选择可以在微开放学习整个过程中发挥作用的特征。内部因素可以智力或非智力反映学习者的学习行为。此外，从项目的角度，我们将微学习内容（即微\
  \ OER）进行概述。将说明分类和定制微 OER 的机制，随后是衡量标准。\n\n根据第 3 章和第 4 章，将在第 5 章中进行语义知识库的构建，采用自上而下的方法。其顶层的模式层将分别拥有微\
  \ OER 和学习者的增强本体，并由概念图表示。底层的数据源将根据基于 `EDM` 和 `LA` 的策略进行处理，即从校园数据和开放学习数据的角度来理解微学习模式和规则，并支持微\
  \ OER 推荐系统的决策过程。\n\n\n\n\n为了启动本书的实践部分，第 6 章将详细阐述 MLaaS 在线计算的细节。在线计算旨在明确地支持微学习适应与交付的决策过程。首先，本章将提出一种解决著名的冷启动问题的方案作为主要贡献。将在综合学习模型的基础上构建一个轻量级的学习者-微\
  \ OER 配置文件，以应对冷启动条件并实现快速响应。随后，还将探讨如何将新发布的微 OER 插入已建立的学习路径中，以及综合学习模型的实时更新。\n\n第 7\
  \ 章将为所提出的计算方法提供实证评估结果。实验将基于一系列模拟进行，通过选择和优化启发式算法来实现该计算过程。本章还将涉及系统实现。\n\n第 8 章将总结本书，并对未来的研究提供建议。\n\
  \n# 第 2 章：文献综述\n\n作为近年来出现的一种新现象，微开放学习具有重要意义，并吸引了研究人员和开发者的关注。自适应微开放学习的成功与技术和教育角度结合主题的恰当利用密切相关。在本章中，我们将回顾计算机科学、信息技术、数据科学和教育学领域的相关文献。首先，将在第\
  \ 2.1 节回顾移动学习和微学习领域的文献。然后将在第 2.2 节中讨论开放学习和开放教育资源的背景与发展。接下来，将探讨这两种现象级新学习趋势——微（学习和）开放学习（即基于\
  \ OER 的微学习）相结合的优势和研究空白；最后，我们将在第 2.4 节调查学习者建模、教育数据挖掘（EDM）以及学习分析（LA）的研究。\n\n## 2.1\
  \ 移动学习与微学习\n\n### 2.1.1 远程学习与电子学习\n\n远程学习扩大了学习活动必须在特定地点（通常是教室）物理执行的概念。因此，在远程学习的背景下，教师和学生通常在时间和空间上是隔离的；同时，学生与其同学或团队成员在虚拟上是分布式的。这种学习方法赋予了教师安排时间日程的自由，并允许学生在自己倾向的时间学习学习内容。就此而言，它为学生提供了更多教育机会，包括因残障、疾病无法参加传统课堂的学生、希望在全职工作之余深造的人，以及愿意但远离理想教育机构的人员，例如发展中国家的学生（Woods\
  \ et al., 2011）。\n\n远程学习的核心思想是知识的传递，这通常通过某些技术和通信工具辅助来实现。例如，在最早的远程学习形式中，通常采用邮政信函教学。20\
  \ 世纪，一些开放大学或开放课程供应商经常利用电视教育和视频会议。研究人员将这种现象确定为电子学习（e-learning）的起源。\n\n随着互联网技术的快速发展，电子学习（主要通过电子手段分布和促进知识的获取与使用）逐渐在教学中发挥着重要作用（Wentling\
  \ et al., 2000）。Urdan 和 Weggen (2000) 将电子学习定义为“通过所有电子媒体传递内容，包括互联网、内网、外网、卫星广播、音频/视频磁带、交互式电视和光光盘”。\n\
  \n关于电子学习特征的讨论在文献中广泛可见。一些典型的观点总结如下：\n\n- 对于电子学习支持的远程学习，教师和学生不再需要在同一地点，同时通过使用电子设备作为辅助也涉及课堂学习体验。\n\
  - 电子学习可以是自主的或教师引导的。许多教育机构已为学生提供了丰富的学习资源，包括讲座录像带、讲义笔记、幻灯片、参考书等。也就是说，学生可以根据自己的自由和喜自主访问这些资源（Bates\
  \ and Poole, 2003）。学习活动的开始和结束在他们自己手中，他们决定想订阅哪些资源、应该强调哪些方面以及每个学习阶段应该持续多久。相反，教师在电子学习中的角色可以简化，如提供相关学科的指导，指出正确的学习方向，分享经验并在学生感到困惑时回答问题（OCED,\
  \ 2005）。\n- 电子学习活动可以是同步的或异步的。一方面，两个或多个参与者可以在同一时间内交换想法或信息，这通常由聊天室、即时消息软件和视频通信设备支持。另一方面，随着成熟的\
  \ Web 2.0 技术，通过博客、Wiki、讨论论坛等辅助的异步学习活动在近年来变得频繁。因此，参与者不再要求在收到信息后立即响应，也不依赖其他参与者的同时参与。\n\
  \n有许多电子学习系统，也称为学习管理系统（LMS），它们是用于文档、跟踪、报告以及教育课程或培训计划交付与管理的软件应用程序。大多数 LMS 是基于 Web\
  \ 的，可以访问学习内容并扩大使用范围。LMS 中提供的通用学习内容以文本、图像、动画、流视频和音频的形式存在。\n\n### 2.1.2 移动学习\n\n随着无线技术的演变和移动设备的广泛使用，移动学习（m-learning）作为电子学习的新趋势出现（Sharple\
  \ et al., 2002）。\n\n两种远程学习的主要区别在于，电子学习通常在计算机或固定设备前进行，而移动学习可以在任何地点发生（Sharma and Kitchens,\
  \ 2004）。因此，学生可以在任何地方、任何时候进行移动学习。在校园、家里或学校设施外发生的学习活动可以整合到移动教育环境中（Kim et al., 2006）。此外，移动学习的一个趋势是学生使用移动设备且实际上处于移动中，而教师可能使用移动设备以外的多种设备并位于固定场所（Vanska,\
  \ 2004）。\n\nKoole 等人 (2010) 指出，移动学习促进了远程学习的效用。与远程学习相比，移动学习具有几个交付高质量教育体验时应考虑的额外特征：\n\
  \n- 可访问性（Accessibility）：它是移动学习的核心。学习环境处于移动中，所有的学习资源和学习者都是移动的。如果学习空间发生改变，学习活动不会中断（Attewell,\
  \ 2005）。\n\n\n\n\n\n## 移动学习的特征\n\n- **个性化**：在移动学习环境中，每个个体学习者的状况可能极度混合且复杂，例如随时间变化的不同带宽和网络条件。此外，他们的移动设备可能具有各种屏幕尺寸和打字方式。个性化是指根据不同个体的学习需求和学习属性进行调整以适应不同学习者的这种特征（Sharma\
  \ and Kitchens, 2004）。它还应该关注以特定方式交付适当的学习内容。一些研究人员指出，移动学习应该具备环境感知能力，以适应不同条件下的学习者（Economides,\
  \ 2008; Negella and Govindarajulu, 2008; Zervas, Ardila et al., 2011）。\n- **便利性**：由于内存和处理能力的限制，学习者通常使用移动设备通过轻客户端或\
  \ Web 浏览器访问移动学习资源；这些便携设备应该能够很好地支持网络连接、快速设置和设备重复利用。应当考虑内容的可读性、界面的操作便利性以及学习者的满意度（Georigiev,\
  \ Georigiev et al., 2004）。\n- **交互性**：移动学习中存在三种类型的交互：学习者与学习者、学习者与教师以及学习者与内容（Koole,\
  \ Mcquilkin, et al. 2010）。这三种交互中的每种都期望在任何时间和任何地点都能不受障碍地完成。\n\n相比之下，传统的移动学习更侧重于内容交付，但缺乏处理评估并将反馈到\
  \ `LMSs` 的。然而，随着技术的蓬勃，移动学习的语境发生了显著演变，比五年前先进和复杂得多。其中，明显的变化可以归于智能设备的广泛使用和基础设施的升级。\n\
  \n以智能手机和平板电脑为代表，智能设备通过提供全触摸屏和集成计算能力提升了移动学习的用户体验。由于功能日益完善，它们正在取代 `PDA`、功能型（非智能）手机、便携式媒体播放器和电子阅读器的用途。在某种程度上，传统移动设备有限的屏幕和打字方式得到了改进。通过使用这些设备，学习者有更多自由根据自己的个人移动操作系统定制和下载学习材料。同时，教育领域发布了越来越多的应用程序和轻量级应用（apps），电子书也可以在各种移动操作系统上阅读。\n\
  \n手机信号引起的问题在某种程度上通过高速网络（`4G`、`3G`、`GPRS` 和 `Wi-Fi` 等）的优势得到了缓解。`LMS`系统的 Web 内容应适应移动设备的屏幕尺寸，在线音频和视频也可以流畅播放。此外，在基础设施升级的支持下，移动学习环境中的通信方法变得丰富。Ting（2005）总结，2006\
  \ 年以前移动学习中有三种通信方式：语音通信（如电话）、短信息和和互联网通信（如在线聊天和电子邮件），前两种由通信运营公司（如电信公司）提供并按电话费计费。自\
  \ 2006 年以来，开发了更多的在线工具和应用来支持即时通信。语音通信和短信息，即使是群组形式，也是可能的，并且可以通过互联网轻松实现。此外，学习者能够使用基于多媒体的消息相互通信，因此他们只按网络流量计费，而不是按手机使用计费，在\
  \ `Wi-Fi` 网络可用时甚至是免费的。\n\n移动学习的发展既不是为了完全取代传统的远程学习，也不是为了将课程缩小并限制在口袋设备中。然而，它致力于通过无线网络的力量增强远程学习，并增强正式知识的传递（Ting,\
  \ 2005）。因此，认为移动学习引发的一些新趋势将在未来到来，可以总结为：\n\n- 越来越多的移动设备被引入课堂作为补充。这意味着可以增强正式学习（Vaughan,\
  \ 2010）。例如，移动学习可以用于介绍课程的章节，而其余部分面对面进行。\n- 通过 `LMS` 交付的在线课程呈爆炸式增长，为学习者提供了更多通过一站式服务参与和完成作业的选择。\n\
  - 电子书逐渐取代纸质教科书。电子书的内容容易更新。教师和学习者受益于这种便利性（Zawacki-Richte et al., 2009）。\n- 多媒体内容日益融入教学材料，使知识以创意和生动的方式传递。学习体验变得不再枯燥。\n\
  - 学习时间碎片化变得非常普遍。也就是说，学习者可以在排队、在路上或其他活动期间利用更多的碎片化时间进行学习。\n- 移动学习可以同时结合社交网络以连接学习者、发起讨论并传播信息，信息推送技术确保离线或处于无信号地区的学习者不会错过任何信息。\n\
  - 在线协作学习获得了普及，它吸引了许多学习者共同目标。\n\n### 2.1.3 移动云学习\n\n过去十年，没有云计算的移动学习存在一些缺点。例如，由于语境的不确定性（如不可预测的网络带宽）和特殊性（如不同的操作系统），非移动设备的学习资源无法直接适应移动设备。\n\
  \n\n\n\n\n-   对于教育提供者、管理人员和教师而言，支持移动学习功能的 `LMSs` 的新型部署与管理给他们带来了巨大的困难。由于用户需求的多化，移动学习系统中的内容倾向于由用户定义，而如何选择和配置\
  \ `LMSs` 的扩展组件同样不容易，这使得教师和管理人员必须接受培训，否则他们无法适应每个组件所特有的配置变化性。另一方面，传统的 `LMSs` 在大规模部署方面存在缺陷。在移动学习的研究与实施中，从单点站点到提供整体服务的部署通常集中在学校级。然而，这种传统的部署方式无法满足按规模区分的多个层级的粒度需求。从粗粒度角度来看，移动学习的设备性能和安全性将受到源于区域级甚至国家级提供服务的根源性限制和缺陷的影响。相反，从细粒度角度来看，学校、班级和个人教师从个性化的角度需要移动学习的独立实用性。此外，`LMS`\
  \ 的快速部署也是一个问题（Orr, 2010）。从启动到正常运行，完成网络配置、系统软件配置以及移动学习环境和内容的配置需要很长的时间。此外，一些 `LMSs`\
  \ 是开源软件，缺乏指南文档和后续技术支持。例如，著名的 `Moodle`^a 和 `Bodington`^b。在这种情况下，一旦开源移动学习系统出现任何问题，普通教师和管理人员在没有专业技术人员帮助的情况下面临解决问题的困难。最后，成本始终是一个不可避免的问题，涉及硬件、软件、组网、网络租赁和电力的费用。专业技术人员负责移动学习系统的维护和修理，他们的支出也不容忽视。每所学校重复部署移动学习被认为是对资源的巨大浪费（Cobcroft\
  \ et al., 2006）。\n\n-   对于学习者而言，虽然赋予移动设备的最新处理器已更新为高速，但功耗仍然无法满足当前移动学习的需求。在使用移动设备运行复杂的移动学习系统时，其处理效率和反应率可能会受到质疑。移动处理器的高度中心化操作也应得到高功率电池的支持，而这在目前的产品中尚未完全解决。移动设备的散热缺点也可能让学习者不满意。此外，在传统的移动学习模式下，教师根据大纲安排学习内容并设计学习过程，其知识体系和大纲在某种程度上限制了深度和广度。一个明显的结果是，学习者能获得多少知识与教师传授了多少密切相关。此外，学习者集群的形成基本上由教育提供者和教师负责，他们在一定程度上控制着学习者的结构、学习内容的组织、策略的发布以及学习路径。这导致互动和知识共享在很大程度上局限于非常小的范围且有限。\n\
  \n尽管如此，上述所有问题在一种新趋势的到来面前是可以解决的，即拥抱结合云计算的移动学习。因此，通过将当前的 `LMSs` 迁移到云端或直接在云端开发这些解决方案，学习者可以轻松地通过移动设备进行学习（Sultan,\
  \ 2010）。这是一种新型移动学习方式，即基于移动云的学习。\n\n通过利用基于移动云的学习，主要优势是成本更低。对硬件和软件的需求显著减少。特别是，由于所有数据存储和处理都在云端，移动设备有限的处理器能力和内存大小不再是愉快移动学习体验的瓶颈。因此，学习者只需要使用移动设备运行浏览器并连接无线网络，进行数据的输入和输出。\n\
  \n同样，教育提供者和管理人员不再需要自己拥有并设置高性能服务，而无需担心运行的 `LMSs` 的背景。购买和升级硬件的支出可以降低。移动云计算不仅实现了 `LMS`\
  \ 的快速部署，而且云服务提供商已经准备了一些流行的 `LMSs` 供订购。这些 `LMSs` 已经经过良好迁移并完全托管在云基础设施上，并且是大规模化和细粒度的。因此，教育提供者无论处于什么水平或有何不同需求，都能根据需求定制整个或部分云托管\
  \ `LMSs` 的功能。值得注意的是，访问云托管 `LMSs` 的权限是通过租赁使用获得的，这比购买许可证要便宜得多。由于数据迁移技术，重用旧 `LMSs`\
  \ 是可行的，这避免了在不同区域重复部署同类 `LMS` 的浪费（Gao and Zhai, 2010）。\n\n教师和管理人员不需要像技术人员那样接受培训来维护\
  \ `LMS` 的日常运行，也不需要跟踪新兴的学习技术。受益于基于移动云的学习，他们可以将全部精力放在教育内容的组织和交付上，以使学习者更有兴趣并更好地吸收知识（Rao,\
  \ 2010）。这是因为云服务提供者的专业团队负责所有的技术问题。\n\n由于云可以被视为一个巨大的信息池，来自全球的学习资源被整合和共享，以实现知识价值的最大化。通过方便的查询（如术语搜索），学习者能够发现并获取学习资源，然后自由选择哪些是学习所需的。根据学习者的反馈和需求，学习资源的更新、修改和补充持续进行，教师和管理人员的唯一职责就是分类和管理学习资源。\n\
  \n基于移动云的学习促进了多样化的虚拟学习社区和虚拟团队的出现，消除了学习者的地理、国家和文化背景的限制（Liao and Wang, 2011）。在其中，学习者可以自由参与这类学习群体结构，交流讨论观点，分享经验并从他人的长处学习以发现改进自己的短处。因此，具有相似学习目标的学习者之间更容易产生协作学习的环境，因此团队合作成为基于移动云学习中日益频繁的学习活动和重要的学习方法（Chua\
  \ and Tay, 2012）。\n\n\n\n\n\n# Yahoo 进行的研究（Gutierrez, 2014）指出，尽管用户似乎对移动设备上瘾，且不愿放下设备，但这并不意味着他们只是想快速地接收和处理信息。某项研究结果（Chen\
  \ & Lin, 2016）显示，在进行移动学习（m-learning）时，年轻学习者频繁停止学习活动并将注意力转移到其他事情上，其注意力持续时间通常限制在 15\
  \ 分钟以内。\n\nStockwell (2008) 分析了年轻学习者在移动学习中的注意力持续时间，结果显示在进行移动学习时，他们的学习活动经常被其他活动中断，导致其注意力跨度通常限制在\
  \ 15 分钟内。\n\n## 微学习及其益处\n\n微学习对精通学习具有积极影响，并是混合学习的重要组成部分（Milligan et al. 2013; Zhang\
  \ & Ren 2011）。它可以帮助学习者利用每一份碎片化时间，在极短的时间内参与学习活动。与通过一次或多次中断完成一个课程模块相比，这种方式有助于他们获取针对性知识产生积极效果（Bruck\
  \ 2008）。在小型且规划良好的单元或活动的帮助下，通过小步进行学习（不同于传统的通过数小时课程进行学习的方法）成为可能。因此，微学习变得短小、易消化且易于管理（Kovachev\
  \ et al., 2011）。微学习还适应了人类大脑注意力跨度方面的限制。这与研究发现一致，即人们在短而集中的课程中学习，比在导致信息过载的长时课程效果更好（Bruck\
  \ et al., 2012）。\n\n在文献中，“微学习”过程的时间跨度从几秒（例如在移动学习中）到 15 分钟或更多。对微学习的另一种解释是：“微学习指的是在小型学习单元上的短期学习活动。在当代的移动/网络社会中，微学习涉及基于网络资源的碎片化知识”（Kovachev\
  \ et al., 2011）。与传统的数小时在线学习相比，微学习具有高度灵活性，可以以各种形式交付，更重要的是，它受的时间限制较少。换句话说，它可以随时开始，也可以随时结束。\n\
  \n## 移动学习与整合\n\n在移动学习中，学习活动可以在学习者方便的情况下进行，无论地点和时间如何。通过这种方式，学习者可以从各种场景中获取学习资源。通过移动设备，学习者经常在短时间内完成学习任务。根据\
  \ Hug 和 Lindner (2005) 进行的研究，微学习可以作为对完成相关学习任务所需时间的假设，例如回答问题、记忆某项信息或寻找学习材料。因此，微学习随着移动设备的广泛使用而蓬勃发展，并成为移动环境中的主要学习手段。微学习与移动学习具有一些相似的特点，因为它们两者都是相互独立的、自包含的、可重复的且可重新组合的（Sanchez-Alonso\
  \ et al., 2006; Leene, 2006）。\n\n澳大利亚教育者使用不同的多媒体使课程更加全面，这有助于学习者更有效地理解。课程内容可以在不同课程之间重复使用。另一方面，这些广泛使用的课程材料是视觉信息的形式，而教育微内容建议采用类似的形式，可能包括文本、视频、音频、图片、图表或绘图等（Liao\
  \ & Zhu, 2012）。移动学习与微学习相辅相成。人们在工作场所越来越多地使用移动设备进行通信以及搜索问题的答案。它让员工在执行日常活动的同时进行学习，而不是要求他们离开工作环境（Semingson\
  \ et al., 2015）。微学习资源可以按需提供，以便即时学习（Gassler et al., 2004）。这些微小的学习字节不仅有助于快速吸收，还使移动学习成为可能，从而减少对固定时间段的依赖或从工作中抽出大量时间的需求（Gutierrez,\
  \ 2014; Anderson et al., 2014）。\n\n随着微学习的演进，通过一系列微交互进行微内容交付，使用户能够在没有信息过载的情况下学习（Souza\
  \ & Amaral, 2014）。它是确保更好学习结果的关键技术（Kovachev et al., 2011）。\n\n## 2.2 开放学习与开放教育资源\n\
  \n开放学习旨在整合在线学习开放课程，被许多大学大力追求（Hilton, 2016）。这个术语早在 1975 年就被许多研究人员定义，并且一直在演变。开放学习一直处于公共领域，并在免费使用的许可协议下进行组织（Harley,\
  \ 2008）。\n\n开放学习寻求消除所有不必要的学习障碍，同时旨在为学生在一个以其需求为中心的教育和培训系统中提供合理的成功机会（Neil Butcher,\
  \ 2011）。它包含了几个核心原则：\n\n- 学习机会应该是终身的，并应该涵盖教育和培训（Leone, 2018）；\n- 学习过程应该以学习者为中心，建立在他们的经验基础上，并鼓励独立批判性思维（Hannafin\
  \ et al., 2013）；\n- 学习提供应该是灵活的，以便学习者可以不断选择他们在何地、何时、什么以及如何学习，以及学习的速度；\n- 先前的学习、先前的经验和展示的能力应该被认可，以免因缺乏资质而限制教育机会；\n\
  - 学习者应该从不同的学习环境中加载进度或积累学分；\n- 提供者应该为公平的机会创造条件。\n\n开放学习使用的资源从完整课程、课程材料、模块、教材、流视频、测试、软件以及任何支持获取知识的工具、材料或技术（Atkins\
  \ et al., 2007）。形式上，开放教育资源是“免费开放地提供给教师、教育者、学生和独立学习者的数字学习资源，以便在教学、学习和中使用、共享、组合、调整和扩展”（Hilton,\
  \ 2016）。研究人员总结了开放资源的发展符合 `5R`，其中：\n\n- `Retain`（保留）指的是制作并拥有副本；\n- `Reuse`（重复）表示以广泛的方式使用；\n\
  - `Revise`（修订）代表调整、修改和改进的操作；\n- `Remix`（混合）等于组合两个或多个；\n- `share with others`（他人共享）通过\
  \ `Redistribute`（重新发布）得到强调（Theraroungchaisri, 2016）。\n\n以下问题是导致开放学习（或者说开放资源利用）快速发展和广泛接受的主要原因：\n\
  \n- **成本**：成本问题（例如教材）在在线学习甚至传统的校园学习中，始终处于用户/客户方的要位置，这些客户可以是学习者，也可以是教育提供者。这个问题在发展中国家尤为突出（Lesko,\
  \ 2013）。\n\n\n\n\n- **许可证**：教科书、期刊和其他教育对象的版权限制防止了教育工作者以最符合学生需求的方式组合材料。这也降低了从不同机构拆解并重构学习资源的可行性。\n\
  - **本地支持**：尽管 `OER` 是完全国际化的，但仍有本地支持的需求。Chae 和 Jenkins (2015) 根据其参与者的意见总结道，他们非常高兴校园内有一个本地的\
  \ `OER` 服务部门，并有一位精通寻找、利用、设计和定制 `OER` 的随时可用的人员。这些关键人物帮助新入的教学设计人员、教师以及开放学习的其他利益相关者熟悉\
  \ `OERs` 上的类似操作，从而促进学习和教学中 `OER` 的使用。\n\n### 2.2.1 OER 的分类与演变 (OER, OCW 和 MOOC)\n\
  \n### a) 开放课程资源\n\nOCW 联盟组织对开放课程资源 (`OCW`) 的正式定义是“大学级教育材料的免费且开放的数字出版。这些材料以课程的形式组织，通常包括课程规划材料、评估工具以及主题内容”\
  \ (`OCW Consortium.org`)。以麻理工的 `OCW` 程序为例，这一先驱早在 2001 年就开始了。这一趋势已经在欧洲和亚洲得到了广泛扩展。\n\
  \n通常，`OCW` 是 `OER` 的子集 (Friesen, 2009)。`OER` 包括任何根据开放许可共享的教育内容，无论其是否为课程的一部分，而 `OCW`\
  \ 则专注于共享专门为某课程开发的开放内容。\n\n### b) 大规模开放在线课程\n\n大规模开放在线课程 (`MOOC`) 在近十年中显著崛起，向任何年龄段的学生免费提供，并基于开放网络学习模式运行，没有正式的入学要求或参与限制。它很快成为\
  \ `OER` 中最引人注目的趋势，并在整个高等教育领域获得普及 (King et al., 2014)。在线学习资源的爆炸式增长导致了教育学习的变革，2012\
  \ 年被命名为“MOOC 之年”(Pappano, 2012)。\n\n它是一种通过 Web 实现大规模互动式参与和开放访问的在线在线课程，是传统远程教育的重要补充\
  \ (Liyanagunawardena et al., 2013)。它包含了互动、反馈和评估（通过自动测验或同行评审），甚至许多世界著名的大学通过向 `MOOC`\
  \ 提供者提供课程，并逐渐认可从 `MOOC` 课程获得的学分。因此，统计数据显示，数百万人参与了 `MOOC` 的虚拟教室，特别是同时修读单门课程的学生人数可能高达数万\
  \ (Baggaley, 2013)。\n\nFauvel 和 Yu (2016) 规定了平台或课程被称为 `MOOCs` 需满足的条件：\n\n- **大规模\
  \ (Massive)**：它们应该能够容纳成千上万的学生同时修读同一门课程；\n- **开放性 (Open)**：它们应该是免费访问的——任何人都可以无财务障碍地注册，且对学习者没有先决条件；\n\
  - **在线性 (Online)**：可以通过连接互联网的计算设备（例如电脑、智能手机或平板电脑）访问；\n- **课程 (Course)**：它们应该提供结构良好的课程。\n\
  \n\n\n\n研究人员认为，OER 的过度发布可能对资源产生负面影响（Davis et al., 2014），因为 OER 提供者渴望在竞争激烈的市场中占据一席（Cormier\
  \ and Siemens, 2010）。建议良好的教学设计可以确保 OER 的质量（Nunez et al., 2014）。为了启动教学，有五个基本原则支撑着所有模型和理论（Merrill,\
  \ 2002; Merrill, 2013; Collins, 2005）。这些原则被 Margaryan (2008) 扩展以适应现代教育的变化，在以下情况下学习将得到进一步促进：1)\
  \ 学习者在现实问题的背景下获取技能；2) 学习者激活现有知识和技能作为新技能的基础；3) 学习者观察所学技能的演示；4) 学习者运用新获取的技能解决问题；5)\
  \ 学习者反思、讨论并维护新获取的技能。相应的顺序，这些原则可以总结如下：\n\n(1) **以问题为中心**：如果学生解决现实世界的问题并将任务分解为更小的部分，课程的教学效果将增强。\n\
  \n(2) **激活**：如果活动帮助学生将先前的知识和技能连接到新知识，课程的教学效果将会更高。\n\n(3) **演示**：当学习者观察所学技能的演示时，学习将得到促进。如果展示了糟糕和良好的案例，课程的教学效果将会提高。\n\
  \n(4) **应用**：如果学生在实际练习中运用他们的知识，教学效果将会增长。\n\n(5) **整合**：如果学生能够将他们的知识整合到日常生活中并向他人展示它，教学效果将会提高。\n\
  \n(6) **集体知识**：引入论坛和其他工具，让学生就学习主题交换意见、问题和答案，将提高教学效果。\n\n(7) **协作**：学生与其他合作、甚至进行同伴评估的活动将增加教学效果。\n\
  \n(8) **差异化**：具有不同复杂程度的资源有助于为学生学生定制学习，从而增强教学效果。\n\n(9) **真实性**：先前在真实项目中使用的资源，即使是由教授开发的，也被推荐与学生共享，以增加教学效果。\n\
  \n(10) **反馈**：在评估后应向学生提供错误意见和改进机会以提升教学效果。\n\n### 2.2.3 OER 的优势\n\n开放学习具有非正式学习和正式学习的优势。学习者享受在线学习的高灵活性，因为加入和退出没有严格的时间限制。参与开放学习的学习者来自不同的年龄组和各种文化背景，具有广泛的地理分布。开放学习还可以为以前无法获得资源的弱势和被排除群体带来学习机会。\n\
  \nOER 的成本效益是显著的，采用 OER 完全能够降低学习者的成本。它在减少重复、促进机构间合作、共同创作和资源共享方面具有优势，因此节省了内容开发的时间和精力（Windle\
  \ et al., 2010）。机构或 OER 提供者之间的开发共享成为可能。这将 OER 生产中的协作和创造力。\n\nOER 的采用增加了学习资源的效率和质量：教师更容易获取高质量的学习资源；协作和共享具有进一步增强学习资源质量的潜力，并由于接触到大规模的学习者和教育者而促进教学创新。\n\
  \n最近的一项研究发现 OER 对本地和全球社区都有贡献（Godwin-Jones, 2014）。Perryman 等人（2014）和 Wolfenden 等人（2012）指出，OER\
  \ 的适应能力不仅允许根据教师的意愿添加或删除章节，还可以对文本进行修改以更好地适应当地文化和语言。\n\n### 2.2.4 服务 OER（面向服务的 OER\
  \ 交付）\n\n课程教师将先前的教学策略迁移到这种新的混合学习环境仍面临一些障碍。得益于面向服务和移动云端学习的优势以及日益流行的移动应用程序，以面向服务的模式交付\
  \ OER 被 OER 提供者使用的巨大潜力。例如，作为一个试点案例，服务 OER 不仅在 OER 分发方面具有潜力，还简化了服务的部署和交付过程（Corbi\
  \ & Burgos, 2016; Hernandez et al., 2014）。面向服务的 OER 提供通过使用云工具（如虚拟容器）将内容服务、技术服务和客户服务包含在一个站式体验中（Corbi\
  \ & Burgos 2016）。\n\n## 2.3 微开放学习\n\n### 2.3.1 开放学习中的 M 学习\n\n毫无疑问，移动学习正获得学习者的广泛接受，并逐渐成为一种主要的学习手段（Kim\
  \ et al., 2006; Sun & Shen, 2014）。m 学习的好处在许多研究中得到了很好的研究。结果，大多数 MOOC 提供者及时在主流移动操作系统（即\
  \ `iOS`、`Android` 和 `WP8`）上发布了他们的移动应用程序，并调整了网页以适应移动设备的屏幕尺寸和操作模式，以捕捉 m 学习的趋势并为学习者提供更方便的使用。\n\
  \n\n\n作为一个核心关注点，开放教育资源（OER）的典型产品——`MOOC` 目前正面临完成率低的问题。多个来源显示，平均只有 5% 到 15% 的参与者完成了课程，而大多数参加\
  \ `MOOC` 课程的学习者最终选择了放弃（Nawrot & Doucet, 2014）。然而，一些作者认为，流失统计可能不能代表 `MOOC` 学习者的全部。这是因为存在不同的学生行为模式，进一步分析每个参与者的目标，可以对学习者在完成课程之外的时的不同个人目标提供额外的见解。因此，应该有不同的衡量标准来评估\
  \ `MOOCs` 对个体参与者是否有效（Daradoumins et al., 2013）。可以认为的是，这主要是因为学习者未能进行有效的时间管理，导致他们受困于耗时以及与现实生活责任的冲突（Nawrot\
  \ & Doucet, 2014）。\n\n另一个关键因素是，尽管付出了努力，但学习者认为并不容易找到他们所需的合适资源，或者所选资源不符合他们的预期。在 Chae\
  \ 和 Jenkin 的研究（2015）中，参与者声称，在时间范围内发现和修改材料的机会非常不足。这一观点也得到了 Armellini 和 Nie 调查结果（2013）的支持。他们声称，跨多个存储库寻找资源是非常耗时的，而且调整已找到的以满足其个人需求所花费的时间可能比寻找过程还要长得多。Harley\
  \ 等人（2010）发现，这种时间投入是学习者无法享受其开放式学习之旅的关键原因。在这种情况下，他们简单地放弃并寻找替代品，一些人则反复报名尝试新课程，直到最终找到他们偏好的课程（Khalil\
  \ & Ebner 2014）。\n\n第三个原因是参与 `MOOC` 课程的学习者背景更加多样化（DeBoer et al., 2013）。一些 `MOOC`\
  \ 学习者并没有明确的目标来完成整个课程获取学分，因为他们只想获取实际需要的特定知识。这些知识通常包含在小的课程单元中，或者在课程交付的中期阶段。因此，一旦他们对所取得的进展满意，就可能会在留下未完成的作业或测试的情况下退出（Daradoumins\
  \ et al., 2013; Khalil & Ebner, 2014）。\n\n这可以解释为什么 `MOOC` 中的移动学习与其在校园和远程教育中的传统形式和模式有所不同。`MOOC`\
  \ 的教学学习高度依赖于联结主义方法。团队合作、协作、沟通和同伴学习在 `MOOC` 中具有重要的教育价值。然而，尽管移动云端学习和即将推出的移动 App 具有优势，但非移动设备的学习资源无法直接适配到移动设备，因为它们具有环境的不确定性（如不可预测的网络带宽）和特殊性（如不同的操作系统）。当有许多选项需要考虑时，学习者可能在首先或下一次选择学习哪门课程时感到无所措。此外，当\
  \ `MOOC` 学习者作为一个小组实现学习目标时，增强学习者在协作学习中的团队表现起着重要作用。如何增强学习者的团队表现涉及多种教学概念，而且几乎没有任何基于\
  \ Web 的工具支持。因此，一些研究人员非常担心开放在线课程可能无法实现承诺，因为传统课程的许多方面（如小组讨论和与教师的面对面交流）在 `MOOC` 格式中无法实现（Daradoumins\
  \ et al., 2013）。此外，发现在 `MOOC` 课程过程中，学习活动频繁断续，许多学习活动是在碎片化的时间内完成的。换句话说，他们的学习过程变得碎片化或微型化。\n\
  \n### 2.3.2 基于 OER 的微学习\n\n标准的移动学习模型（如教师引导的或基于计算机的）看起来非常像大学课程，学习者被从正常的工作或生活环境中抽离出来，花费许多小时进行“学习”活动，而这些活动他们在日常生活中可能遇到也可能不遇到。然而，标准模型正被那些发生在正常工作环境内部且处于其正中心的学习方法迅速取代。这导致了人们对微学习产生的新兴趣，微学习本质上是指在极短的时间内进行的任何类型的学习。数字学习环境（如\
  \ `MOOCs`）实际上可以为各种微学习活动提供框架。\n\n通过分析 690 万条视频播放记录，领先的 OER 供应商 `edX` 发现，长度小于 6 分钟的视频更有吸引力，而学生的参与度在\
  \ 6 分钟后剧下降（Guo et al., 2014; Anderson et al., 2014）。无论视频的具体长度如何，观看时间的实际中位值为 6 分钟。此外，6-9\
  \ 分钟的视频处于转折点，而较长的视频观看时间中位数较小。\n\n因此，根据现有调查 MOOC 学习者行为轨迹的研究，并不意外的是，MOOC 在某种程度上遵循了微学习原则，甚至\
  \ `MOOC` 通常是围绕微学习原则设计的，这使得学习者能够在短时间内完成“字节级”的学习（Guo et al., 2014; Anderson et al.,\
  \ 2014）。例如，一些课程材料已经按照简单到复杂的顺序进行了分块和排序，以便学生更快处理。理想情况下，单元不超过 15 分钟。例如，连接两个课程单元的一种流行方法是在它们之间添加简单的评估，通常以测验、判断题或多选题的形式（Adamopoulos,\
  \ 2013）。\n\n另一方面，如前面的 2.2 所，OER 学习强调协作和联结主义（Makness et al., 2013; Waard et al.,\
  \ 2012），学习者生成的内容在 OER 交付中同样重要。人们认为微学习是开展问题学习和交换即时反馈的有效方式。OER 也为终身学习提供了必要的依据。微学习的“随用随学”模式让人们能够随时获取他们需要的或感兴趣的特定知识（Kovachev\
  \ et al., 2011）。如果他们没有从 OER 提供者获取学分的需求，通过微学习他们仍然可以完成特定的学习内容，无需完成整个课程。这意味着微学习可以导致学科间更好的整合。\n\
  \n## 2.4 自适应学习：学习者建模与 EDM & LA\n\n### 2.4.1 学习者建模\n\n学习者模型是个性化学习系统的关键要素（Conejo 等人\
  \ 2011）。它通常包含一组描述学习者特征的结构化信息（Al-Hmouz 等., 2012）。为了为每个个体学习者提供个性化的学习体验，必须首先识别表示学习者和课程材料的方法，以便系统推荐更符合学习者兴趣和当前知识水平的课程。\n\
  \n#### a) 学习者模型的定义\n\n\n\n\n学习者模型是计算机系统中对学习者技能和能力的表示，它使学习系统能够适应学习者的特殊需求。学习者模型通常包含学习者的重要信息，例如：领域知识、学习表现、兴趣、偏好、目标、任务、背景、个人特征（例如学习风格和天赋）、环境和其他有用特征。根据\
  \ Kay 等人 (1997) 的观点，学习者模型（也称为学生模型）被定义为“机器对其关于学习者信念的表示”。\n\n学习者模型可以包含两类信息：领域特定信息或领域无关信息\
  \ (Brusilovskiy, 1994)。领域特定信息揭示了学习者在特定知识领域中所掌握的知识和技能的状态或程度。领域特定信息允许自适应电子学习系统组织与学习者相关的的内容模型，剔除学习者已经掌握的内容，并将教学或评估重点放在学习者薄弱的领域。领域无关信息代表了知识之外的信息，例如学习目标、兴趣、学习风格和个人特征。领域无关信息与学习者轮廓数据（例如学习风格或性格）相关，它允许系统提供最优的学习内容序列或呈现格式。\n\
  \n#### b) 学习者知识建模\n\n学习者的领域特定信息被组织为知识模型，其中包含了学习者需要学习的元素（例如概念、主题和学科）。通常，建模学习者知识有不同的形式，即向量模型、叠加模型和故障模型\
  \ (Nguyen & Do 2008)。\n\n*   **向量模型**：向量模型将学习者在某一知识领域内的知识表示为一个向量，其元素可以是概念、主题或学科。尽管向量模型是这三种模型中最简单的，但它非常高效。\n\
  *   **叠加模型**：叠加模型是最受欢迎且最常用的学生模型之一。叠加模型的底层假设是学习者对某些知识领域拥有不完整但正确的知识 (Chrysafiadi &\
  \ Virvou, 2013)。在叠加模型中，学习者的知识是领域知识的子集，而领域知识由该领域的专家知识水平表示。学习者知识与领域知识之间的差异被认为是学习者知识的缺失，学习的目标是尽可能消除这些差异\
  \ (Bontcheva & Wilks, 2005)。与向量模型类似，叠加模型中的每个元素都是一个数字，表示学习者在特定主题或学科上的知识水平。\n*   **故障模型**：向量模型和叠加模型的缺点是它们无法描述学习者对某些知识的误解。故障模型可以表示学习者的错误或误解，以及他们产生这些错误的原因\
  \ (Baschera & Gross, 2010)。通过故障模型，自适应学习系统可以推断应该提供哪些学习材料来帮助学习者学习新知识并消除误解。\n\n用于建模学习者知识的数据通常来自两个不同的来源：评估（例如课程开始前的预测、课程中的测验或考试）或问卷\
  \ (Shute & Towle, 2003)。在 Pardos 等人 (2013) 进行的研究中，学习者的知识是通过领域专家定义的离散知识组件进行估计的。每个被评估的问题都是一个知识组件，然后——\n\
  \n\n\n\n浏览开放教育资源（OER）也存在问题，因为每个孤岛都有其自身的组织结构。某些孤岛无法与特定项目链接，这阻碍了信息的自由流动。开放课程（OCW）孤岛阻碍了知识的互操作性、发现、合成和流动。因此，教师、学生和自学者寻找资源时面临困难，有时他们会根据不完整的信息做出决策。链接数据（Linked\
  \ data）具有在 OCW 数据孤岛之间建立桥梁的潜力（Nelson et al., 2014）。\n\n### 2.4.3 教育大数据\n\n分析这些新记录需要新的技术来处理非结构化文本和图像数据、多源数据以及海量数据（“大数据”）。大数据没有固定的大小；任何用于定义它的数字都会随着计算技术的进步（处理更多数据）而改变。例如，Manyika\
  \ 等人将大数据定义为“大小超过了典型数据库软件工具捕获、存储、管理和分析能力的数据集”（Manyika et al., 2001）。\n\n新兴的“大数据”概念重视系统性和实时数据，而这些数据由于技术限制过去难以追踪和存储。因此，发现潜在模式变得可行，用以预测学生的成果，如辍学、对额外帮助的需求或对更高挑战性作业或课程设置的渴望（Picciano,\
  \ 2012）。通过这种方式，学习资源可以具有预测性和诊断性。换句话说，学习者在学习过程中的表现可以被评估，并进一步采用教学技术来针对个人学习者的特定需求定制学习。\n\
  \n凭借从各种数字系统中汇编的统计信息，随着大数据趋势，开发了许多仪表板软件和数据仓库。得益于此，教育提供者能够对个体学习者以及整个机构的学习、表现和行为问题进行监控。数据可视化技术能够以简单且易于理解的界面汇总关键指标（Williamson,\
  \ 2016）。因此，学习的进展情况以及组织的运营情况会快速、直接地反映在这些仪表板上，来自各种数据流的数据被转化，呈现出清晰且全面的概览。\n\n大数据的利用将教育数据挖掘（EDM）和学习分析（LA）提升到了更有效、更高效的程度，其增长被证实将重塑未来一代学习的方式（Sin\
  \ & Muthu, 2015）。\n\n## 总结\n\n在本章中，我们回顾了与我们的研究相关的文献。在第 2.1 节中讨论了移动学习和微学习的背景以及距离学习的发展。第\
  \ 2.2 节中总结了开放教育资源和开放学习的特征、优势以及教学设计问题。受这两种新学习趋势优势的启发，我们在第 2.3 节中探索了利用微开放学习以提供更好学习环境和体验可行性。自适应学习实施中采用常用方法（例如学习者建模、EDM\
  \ 和 LA）与大数据概念兴起带来的影响一起讨论，这些可以在第 2.4 节中找到。\n\n^(a) [moodle.org](https://moodle.org/)\n\
  \n^(b) elframework.org/projects/tall/bodington/view.html\n\n^(c) [`www.edx.org/course`](https://www.edx.org/course)\n\
  \n# 第 3 章\n\n## 研究设计\n\n在线学习资源的爆炸式增长，尤其是大规模开放在线课程（MOOC），导致了教育和学习的革命（Baggaley, 2013）。教育专业人士一直极其努力地探索将\
  \ OER 格式作为移动学习（m-learning）的常规教学方法（Waard et al., 2011）。然而，由于 OER 的研发仍处于起步阶段，显然有许多机会可以改进\
  \ OER 中的学习机制，例如更有效的学习平台和学习支持服务，以便为提供者和学习者提供更易访问和更好的体验。\n\n在我们的试点研究中，我们调查了 OER 的发展趋势和接受程度，特别是在澳大利亚，并分析了现有的缺点及其潜在改进方向。受此调查结果启发，我们设计了一个面向移动服务的系统，旨在组织一个个性化学习环境（PLE），以支持智能协作和微开放。此外，我们特别关注为\
  \ OER 提供者和学习者提供更好的背景和环境，以智能方式交付小块化的学习者自适应学习资源，这些资源预计在较短的时间内完成，并将这些课程块按顺序连接成一条确定的学习路径。因此，学习者能够充分利用碎片化时间，有效地参与微开放学习。\n\
  \n本章的其余部分将介绍我们研究的设计，结构如下：它从研究背景开始，其中简要演示我们在之前工作中构建的个性化学习环境（PLE）；试点研究将作为研究动机，在第 3.2\
  \ 节中阐述；我们在开始这项研究之前面临的挑战将在第 3.3 节中总结；之后，研究目的和研究设计将在下来的第 3.4 节中展开，其中还将采用微 OER 适配示例场景以便于理解；作为本研究基础的系统框架可以在第\
  \ 3.5 节中查看。\n\n## 3.1 研究背景\n\n开放学习的表现与校园电子/移动学习模式完全不同。OER 是“免费地、开放地向教师、教育工作者、学生和独立学习者提供的数字学习资源，以便在教学、学习和研究中使用、共享、组合、改编和扩展”（Hylen\
  \ et al., 2012）。开放学习是非正式学习和正式学习的结合。学习者在在线开放学习中拥有高度的灵活性，因为加入和退出没有严格的时间限制。参与开放学习的学习者跨越不同的年龄组和文化背景，地理分布广泛。\n\
  \n\n\n\n\n从另一个角度来看，开放学习中的移动学习活动通常由部分组成：在线学习和线下学习（Trifonova & Ronchetti 2006）。由于移动学习者可以自由将材料下载到移动设备中进行线下查看，他们并不经常留在开放学习平台并参加虚拟教室（Attewell,\
  \ 2005）。事实上，在线访问开放教育资源（OER）或任何其他“非开放”（或私有）学习资源只是泛在学习的一部分；更多与泛在学习相关的任务需要离线活动，例如作业的数据收集、数据分析和报告撰写（Wu\
  \ et al. 2010; Lossman & So, 2010）。从逻辑讲，移动开放学习是通过在线系统实现的，这些系统包含了引导和教学材料、交易细节以及交付资源（Ally\
  \ & Samaka, 2013）。因此，虽然学习者能够在线下完成许多开放学习任务，但对于某些必要的程序（例如数据输入和作业提交），他们需要回到在线来执行这些特定任务。\n\
  \n### 3.1.1 自适应微型 OER 的利益者视角\n\n典型的自适应学习项目始终包含研究人员、应用合作伙伴和开发者的目标与策略（Alario-Hoyos\
  \ et al., 2014）。从教育机构的角度来看，尽管面临压力，但他们旨在确保其教育分发的开放性，并扩大其影响力和普及。除了教师/讲师和学生外，自适应 OER\
  \ 交付的开发和应用通常涉及教育机构、教学设计者、技术人员；在很大程度上还包括机构人员、图书馆工作人员和系统管理员（Alario-Hoyos et al., 2014）。他们协作准备和实施\
  \ OER 交付，并致力于开放学习的繁荣（Khalil & Ebner, 2016）。\n\n利用自适应微型开放学习旨在通过在微开放学习中融入更有用的服务并促进\
  \ OER 的全球发展，来满足学习者和教育者的需求。同时，它可以实现跨机构教育资源的更好整合，从而为更广泛的学习者（无论是否正式注册课程）实现教学效益最大化。\n\
  \n为 OER 提供者提供了一种及时且可行的解决方案，通过匹配资源与个性化学习需求以更智能的方式提供服务。项目的另一个成果是成本效益，因为课程提供者可以在不对其现有平台进行任何大规模重新开发的情况下，结合外部资源。新型学习技术将允许教育机构和课程讲师明智地关注并定制其教学策略，以满足大规模学生级的需求。\n\
  \n### 3.1.2 移动 OER 交付的服务型环境\n\n移动学习蓬勃的关键催化剂是面向服务的范式和云计算范式，这些范式利用了大规模分布式系统的经济效益，计算资源在地理边界之间实现了无缝集成。学习者现在有许多选择，可以随时随地为自己决定如何访问大型学习资源做出决定。\n\
  \n在移动环境中，系统不仅需要为学习者提供文本或视觉学习材料，还需要软件和应用程序、直观且以任务为导向的用户界面（UI）、清晰易于操作的逻辑，以及相关课件和学习设置中的引入胜的体验。所有这些预计将以一站式模式封装并交付。分配此类\
  \ OER 的理想方式是将其作为服务交付。这可以使整个 OER 交付过程对用户透明，并尽量减少对移动设备的硬件要求。\n\n### 3.1.3 前期工作\n\n\
  许多教育专业人士仍在评估 OER 的优缺点，以预测它是否可以作为移动学习的常规或仅是补充性的教学方法。特别是，从优点来看，OER 的采用扩大了学习机会，增强了可扩展性，降低了学生的费用，并增加了常规课程内容；从缺点来看，它面临质量问题，并且没有成熟的机制来处理教师和学生之间缺乏人类（特别是面对面）互动。此外，由于这种现象教育趋势的新颖性，由于缺乏个性化服务，其普及受到限制，导致目前的\
  \ OER 交付往往无法满足 OER 提供者和学习者日益多样化的需求。换句话说，预计将在个性化学习环境（PLE）中交付 OER，而不是仅仅是传统的虚拟学习环境（VLE）。此外，建议这些\
  \ OER 以微学习模式消耗，符合移动和泛在计算占据主导地位的现代电子社会的特征。\n\n在研究了改进 MOOC 资源交付和学习体验的可行性以及利用云计算的潜在收益后，我们受到设计一个全面的基于云系统的启发，该系统构建了一个\
  \ PLE，让学习者和教师通过移动设备参与其中。如图 3.1\n\n图 3.1 用于 MOOC 的移动 PLE 框架\n\n结合移动云环境的特征（其中应用程序通常具有互操作性且与平台无关），实现整个团队增强学习过程的一种可行方法是编排学习流，包括各种学习活动的时间序列、逻辑关系、连接模式和发生条件。学习流是指对一组规则的正式描述，以及学习活动发生或改变的过程（Cao\
  \ et al., 2009）。一个完整的学习流将所有活动混合在一起，形成一个适当的过程。\n\n团队增强的学习流通过 PLE 中一个名为“协作即服务”（TaaS）的\
  \ SaaS 实现，以促进协作学习。作为整个 PLE 的一部分，TaaS 已经在典型的云基础设施 `Amazon EC2` 上进行了开发和实现。TaaS 中的五个\
  \ Web 服务可以根据特定的教学需求进行解耦或重新组合，尽管建议作为一个整体使用，以为遗留 LMS 添加一套完整的功能。特别是，由于 TaaS 拥有自己的用户界面并可以即插即用工作，它将维护自己完整且独立的注册和管理机制。\n\
  \nTaaS 的细节已在 (Sun & Shen, 2014) 中介绍，包括用于发现分组策略计算选择的遗传算法（Sun et al. 2013）。在本书中，我们将关注另一个\
  \ SaaS，即微学习即服务（MLaaS），它将在本章的剩余部分介绍。\n\n## 3.2 研究动机\n\n### 3.2.1 试点研究\n\n\n\n\n通过开放教育资源（OER）进行在线学习是教育领域最新的技术之一。OER\
  \ 作为一种新兴的技术支持型产品，正在演变为一种新的教学法，使教师和学生都能获益。它向任何年龄段的学生免费提供，并基于开放网络学习模式运行。它让参与者能够连接到传统学习环境之外，从而提供了自主性和开放性。随着鼓励学生进行连接性学习的趋势日益增长，教师需要参与在线课程。连接性学习表明，学习可以发生在教室之外，通过在线网络和互动进行（Kharbach,\
  \ 2012）。学习可以通过参加网络研讨会、参加工作坊、听播客等以非正式的方式进行。这非常清楚地表明，21 世纪的教育工作者必须保持良好的连接，以便为学生的职业发展做好准备。研究建议，教育者参与开放式学习将帮助他们鼓励学生有效地利用数字素养进行学习。\n\
  \nOER 的兴起为正被接受为学习分析主流实践的领域带来了重大挑战。由于 OER 是一种广泛但非常新的现象，目前还没有关于 OER 学习分析的大量文献支持。对\
  \ OER 中数据的分析仍然有限（Daradoumins et al., 2013）。这项试点研究旨在识别可能影响澳大利亚教育者的 OER 特征，并更好地理解高等教育机构作为\
  \ OER 提供者，如何启发学习者以提高他们的表现。我们进行了一项调查，从澳大利亚领先教育机构的教育者和从业人员那里收集了关于 OER 开发和利用的观点。我们主要关注\
  \ OER 对澳大利亚教育者的益处，以及我们如何鼓励澳大利亚教育者使用 OER。通过使用典型的统计方法分析他们的反馈，主要发现可以总结如下：\n\n*   教育者的意图是继续使用\
  \ OER。\n*   OER 在促进在线学习呈现方面具有高重要性。\n*   OER 在为学习者提供指导方面重要性较低。\n*   OER 在促进学院间教学方面重要性较低。\n\
  *   OER 在材料重用方面具有高重要性。\n*   OER 在结果自动整合方面重要性较低。\n*   OER 在提供免费学习选项方面重要性较低。\n*  \
  \ 在 OER 内部，教育者没有为学生提供足够的支持，这一点非常重要。\n*   对于教育者来说，OER 没有让他们与学生进行面对面的互动，这一点非常重要。\n\
  *   对于教育者来说，在 OER 内部他们无法使用完美的课程设计，这一点并不重要。\n*   OER 在精通学习方面具有高重要性。\n*   OER 在混合式学习方面具有高重要性。\n\
  \n试点研究的细节可以参考（Sun et al. 2015）。在这些发现中，OER 的一个显著未来特征是精通学习。在精通学习中，学生在进入下一节课之前通过反复评估和接触材料来展示对某个概念的理解（Chen\
  \ et al., 2013）。在许多传统课堂中，如果一个学生尝试完成作业但表现不好，他或她仅仅会在作业中得到低分，教学就会转移到下一个主题，为学生学习下一个概念提供了糟糕的基础。反馈通常在概念教授后的几周后才给出，到那时学生几乎不记得这些材料，而且很少回去回顾概念以获得更好的的理解。然而，在\
  \ OER 中，技术使得能够对学生不理解的概念提供即时反馈。在许多情况下，澳大利亚教育者可以提供同一作业的随机版本，以便学生可以重新学习并再次尝试作业。根据 Chen\
  \ 等人（2013）的观点，教师的工具旨在方便具有广泛随机性的题库的使用。这种策略与利用技术支持有效教学方法的总体目标是一的。\n\n教育者的另一个重要因素是混合式学习的能力。混合式学习（面对面和在线学习体验的战略性结合）在高等教育中越来越流行，是一种具有巨大潜力提高学生成果并创造令人兴奋的新角色的新型教育模式。\n\
  \n\n\n\n一些研究人员怀疑开放在线课程和开放教育资源（OER）交付可能无法实现其承诺，因为传统课程的许多方面（例如小组讨论和与教师的面对面互动）在开放在线模式下无法发挥作用（Franzoni\
  \ & Assar, 2009）。OER 让人们能够在任何时间、任何地点、以任何形式获取信息，但关键挑战不仅在于在正确的时间传输正确的内容，还在于以正确的方式来实现它。OER\
  \ 提供者已经意识到，目前的开放学习平台既无法保证学习者享受其学习体验，也无法在开放且连接的环境中获得其学习结果的及时反馈。几个关键领域被认为是未来混合式学习应用的关键：新的移动应用程序、通过翻译和地理伙伴关系分进行更深层次的国际化扩张、支持第三方应用和集成的在线课程平台，以及鼓励学生之间更多协作的新功能（Pinola,\
  \ 2011）。OER 提供者试图确保内容以统一的方式呈现，而环境可以由教师进行配置；课程易于管理；考试是标准。然而，现实情况仍不尽人意，因为在线课程缺乏对这些目标的适当控制、验证或监控（Kukulska-Hulme,\
  \ 2013）。\n\n课程教师在将其先前的教学策略直接迁移到这种新的混合学习环境面临着一些障碍。尽管利用移动云端学习和即将推出的移动应用带来了许多优势，但由于环境的不确定性（例如不可预测的网络带宽）和特殊性（例如不同的操作系统），非移动设备的学习资源无法直接适配到移动设备。\n\
  \n在一些 MOOC 课程中，教师借用微学习（micro learning）的原则来重新设计他们的课件和相关设置。他们的行动包括对课程材料进行分块并重新包装，以便让学习者在短时间内轻松地完成整个学习分块，理想情况下这个时间不应超过\
  \ 15 分钟（Kovachev et al., 2011）。他们更倾向于使用测验或游戏来连接两个分块（Guo et al., 2014）。然而，这些努力仍处于尝试阶段，尚未应用于大规模的\
  \ OER 生产和交付。\n\nMOOC 仅仅是 OER 的子集，这意味着 OER 的规模远比“大规模”还要大。同时，OER 随着大数据时代正蓬勃发展。随着 MOOC\
  \ 用户达到数百万，与 OER 相关的数据快速生成，且在学习者、课程、教育机构、网络和技术细节等方面，用户持续呈几何级增长。面对 OER 中可用学习材料指数级增长带来的海量选择，学习者可能感到非常困惑，无法在早起或晚期选择合适的课程进行学习，特别是当他们只准备一次投入短期努力并必须立即做出决定时。同样，如何在众多可用资源中设定并选择合适的目标和方向，对\
  \ OER 提供者和教师都带来了挑战。微学习可以作为“推送型”应用的一部分，其中教师决定在何时何何地交付哪些学习单元；也可以作为“拉取型”应用，其中学习者决定在何时以及如何访问学习资源（Guo\
  \ et al., 2015）。然而，开放学习大多是远程和在线模式，而学习者具有高度的地理多样性。因此，开放学习教师很难及时提供反馈。教师的指导也无法适应参加同一门课程的所有学习者。\n\
  \n这一问题在移动学习（m-learning）中更加明显，因为设备本身可能会导致干扰，如电话电话、电子邮件提醒和社交网络应用（例如 Facebook、Twitter\
  \ 和 WhatsApp 等）。平均移动用户的注意力跨度也短（Kunznekoff & Titsworth 2012; Chen & Lin, 2016）——大多数人在移动网络上冲浪时只看标题，比起长文章更倾向于碎片化的内容。\n\
  \n使用移动设备进行微学习需要学习者的专注和反思。然而，在移动中学习时，外部环境可能会带来干扰，因为更容易发生意外状况。这给移动学习者带来了高度碎片化的学习体验。为了应对这种分心的学习体验，学习者需要更多的注意和反思。因此，学习内容应该能够与学习者即时互动，即首先给他们感兴趣的内容（Sarrab,\
  \ 2015）。研究人员认为，移动设备的小屏幕尺寸限制了信息的传输，不同类型的学习内容也会对知识吸收产生不利影响（Chen & Lin, 2016）。因此，必须通过消除任何无关或装饰性的材料来避免认知负荷，这些材料只会将学习者的注意力从实际信息上转移。此外，在微\
  \ OER 中，最重要的信息需要首先提到或放在显眼位置。这可以帮助用户吸收关键信息，即使他们无法一次完成一个模块。\n\n在微开放学习中，每个学习活动被预期是短小但完整的，每个\
  \ OER 分块都需要作为一个独立的模块可用（Gassler et al. 2014）。换句话说，每个微 OER 必须自包含并可以独立使用。此外，提出的微 OER\
  \ 能够聚合，它们可以被分组或重新组合成更大的内容集或相似主题的集群（Cakula & Sedleniece, 2013）。\n\n研究人员和从业者对开发基于人工智能的系统以支持自适应学习感兴趣（Adamopoulos,\
  \ 2013）。结合了用户数据分析以响应个人学生表现的在线学习系统将创建自适应学习环境（Daradoumin et al., 2013）。有少数研究（包括我们的试点工作，Al-Hmouz\
  \ et al., 2010）探索了用于学习资源适配的智能系统。这些工作重点关注大学水平的电子/移动学习，没有考虑更广泛的开放学习场景（Wang, 2008）。还发现某些措施对于实现整门课程的自适应学习是有效的，但由于个人学习者在整个课程期间的时间安排不同，这些措施对于碎片化的学习活动是不可行的。\n\
  \nO O 提供者和自适应开放学习系统都必须在实现最大化 OER 优势的目标方面发挥重要作用。对于 OER 提供者/教师，特别是 MOOC 教师和课程设计者，他们需要重新设计教学大纲，将整个课程拆分为较小的单元并预装相关设置。对于自适应开放学习系统，主要问题是如何使\
  \ OER 微型，并引导学习者持续地采取正确的步骤，从而形成带来良好成果的足迹。这也是我们在工作中尝试弥补的主要差距。\n\n\n\n\n此外，研究表明，个性和学习风格在影响学业成就方面起着重要作用（Sun\
  \ and Shen, 2014）。由于学习者通常没有足够的专业知识来为自己定制学习计划，并且可能不熟悉自己的学习风格，因此他们有很大概率无法获取正确的微内容。这可能导致他们尽管花费了大量时间，也无法获得令人满意的学习结果。在目前的情况下，学习资源通常由教育提供者或课程讲师进行划分和封装。这极地缺乏适应每个特定学习者可用时间的灵活性，因此学习者不得不适应课程设置的时间长度，并设法时间来完成这些学习活动。\n\
  \n### 3.3.2 在线计算问题的研究挑战\n\n最新的推荐系统常见于电子商务、电子娱乐和电子旅游领域，倾向于将离线和在线计算相结合，以支持资源推荐的决策过程（Gomez-Uribe\
  \ & Hunt, 2015）。这种创新在在线学习和移动学习（m-learning）平台及系统中较少见，而在线/移动学习的成功案例在与学习者历史行为紧密结合工作时，通常会消耗“大数据”。随着“大数据”趋势的兴起并利用云的力量，教育数据挖掘（EDM）和学习分析（LA）方法已成为良好的在线/移动学习系统广泛采用，用于组织它们的计算过程，这些过程通常是离线的（Romero\
  \ & Ventura, 2010）。EDM 和 LA 在大幅提高计算机科学和教育科学理解学习者、场景和案例的深入程度方面发挥着重要作用，从而从准确性和个性化方面提高它们的推荐质量。然而，这些系统在单一的离线计算中通常以“天”作为最细粒度。由于无法保持用户信息的更新，它们的时间有效性不足，而且学习资源的适应过程可能受到数据稀疏性的影响（Souza\
  \ & Amaral, 2014）。\n\n学习资源推荐系统中在线计算部分的采用率仍然很低，因为与在线购物和娱乐不同，微开放学习的体验和结果高度取决于教育设置、学习者的个人学习风格，特别是变化的环境和碎片化的时间框架（Hug\
  \ & Lindner, 2005）。微开放学习中的活动具有很高的随机性，没有硬性的开始和结束设定。此外，新的开放教育资源（OERs）无论是微模式还是非微模式，每天都在快速发布和更新。需要快速响应机制将进入的微型\
  \ OER 插入推荐候选列表。\n\n此外，在微开放学习中，用户兴趣和需求的积累与衰减可能是周期性的，并以不同的模式变化。\n\n### 3.3.3 冷启动问题的研究挑战\n\
  \n在计算机科学文献中，广泛使用的方法通常依赖于三大类，即基于内存、基于模型和基于内容（Sieg et al., 2010; Liao & Chang, 2016）。尽管它们在\
  \ Amazon 等许多成功案例中被发现，但由于初始数据不足，通常很难提供可靠的推荐。冷启动问题由三个因素触发：新社区、新项目和新用户。\n\n冷启动问题在开放学习中变得更加严重，特别是通过\
  \ OER 进行的微学习（Bruck, 2012）。开放学习和 OER 都是较新的领域，在最近几年中才出现。同时，这一趋势的追随者，无论是新追求者还是从其他在线模式迁移的常规学习者，都加入了这个新兴社区。另一方面，参与开放学习的学习者的需求和期望比大学学生要实际得多。换句话说，他们大多数是自律的，因此他们完全可以根据自己的意愿决定何时加入或退出在线课程，并在课程之间频繁切换。因此，对于\
  \ OER 提供者来说，很难为任何个人建立模型并相应进行更新，因为他们手头没有历史数据。\n\n因此，如果 OER 系统对某个学习者的了解很少，在线计算应该将其视为冷启动问题，并通过用预测数据填补空白来解决它，以帮助\
  \ OER 提供者和教师保证首次交付的质量，这可以进一步加速正在进行的离线计算，从而促进学习者对即将到来的开放学习的参与。\n\n\n\n\n### 3.4.1\
  \ 研究目的\n\n为了解决第 3.3 节中提出的挑战，并调查这种新型移动学习和开放学习模式中潜在的研究机会，本研究旨在促进在线课程学习者的个性化学习体验，并探索如何在微场景中使他们的微学习更有效、更高效。研究的预期成果总结如下：\n\
  \n• 一个智能云端系统框架，旨在为每个独立学习者提供自适应微型开放教育资源（OERs）以及定制的学习路径识别。\n• 一个全面的学习者模型，使系统能够考虑个人的学习风格、学习者背景、应用能力以及教学材料结构，从而根据用户需求定制学习信息的类型和交付格式。\n\
  • 一个知识库，用于填填补正式 OER 在结构化、描述化和推理方面的空白。\n• 一种组织 MLaaS 中在线计算的解决方案，以及一种解决微型 OER 推荐冷启动问题的启发式方法。\n\
  \n### 3.4.2 微 OER 交付场景示例\n\n在我们提出的自适应微学习框架的典型工作场景中，系统会调整每个课程块并使其适应特定的时间尺度。假设学习者正利用碎片碎片化时间进行开放学习。在这种情况下，学习者能够利用每段时间完整地完成一个课程块，既不会出现任何意外的停顿或中断，也不会将任何未完成的部分留到下一次可用时间。\n\
  \n为了更好地理解微 OER 的交付过程，我们总结了章之前章节的内容，并以以下典型场景及其中涉及的活动为例：\n\n• 早上早上 9 点，Jack 正在乘火车上班。他利用\
  \ 20 分钟的通勤时间，通过参加由知名开放学习提供者 edX 提供的“业务管理”在线课程来提升自己。他的手机由 4G 网络支持。他处在一个座无虚员的车厢里，周围是聊天的乘客。MLaaS\
  \ 引导他复习了 5 页讲义笔记，随后根据讲义内容完成了一份包含 20 道题的多选题。\n• 某某亚洲大学就学的本科生 Michael 正在扩展他对“商业智能”的知识，他本学期修了同主题的课程。在等待朋友时，他连接了购物中心提供的免费\
  \ Wi-Fi 并开启了 MLaaS 应用。MLaaS 指导他阅读一份由美国领先大学发布的阅读列表，并向他推荐了一篇包含多个商业智能应用成功案例的文章。\n•\
  \ 在课程间的简短休息期间，Roger 试图在进行演示前完善其演示内容中的几点。这次演示是关于澳大利亚电子商务的未来趋势的，他在最近几天准备演示时，对“供应链管理”主题进行了深入研究。根据他的学习历史和进度，系统向他推荐了一段视频视频片段，视频来自澳大利亚一个开放学习平台的“电子商务”课件，重点是“供应链管理”的定义和概念，时长为\
  \ 9 分钟。\n• 退休的老人 Duncan 想了解更多关于意大利的历史。他在等烤箱计时器滴答时，拿起了他的基础智能手机（例如 iPhone 4）。MLaaS\
  \ 为他推送了一段关于“文艺复兴”的简要音频，以及几张名画和雕塑的照片，以及它们所在地博物馆的语音讲解。\n• 一位日本全职员工为了职业进一步晋升正在在线攻读“电子工程”学位。他正在收集来自\
  \ Coursera 相关大学的学分。MLaaS 为共同推荐了英语和日语双语的课程。当他使用平板电脑登录 MLaaS 时，他被引入了一个“信号处理”的演示实验室实践。\n\
  \n从学习者的角度来看，通过利用 MLaaS，对他们最大的益处是获得了充分的机会来利用碎片化时间来实现学习目标。此外，从 MLaaS 的实用性和易用性来看，他们可以即时、准确地获得偏好的\
  \ OER，且这些资源预计可以在移动设备上运行简单、流畅。一个理想的微 OER 应该是易于完成的，既不会长到产生意外的停顿或中断，也不会太短而将任何未完成的部分留到下一次可用时间。\n\
  \n## 3.5 系统框架\n\n如第 3.1.4 节所述，已经根据自适应微学习需求组织了云端学习环境（PLE），其中 MLaaS 作为主服务来搜索并发现所有可用\
  \ OER 及其相关服务，然后使用在线和离线计算组件共同做出资源交付的决策（Sun et al., 2015; Sun et al., 2017）。它旨在考虑到微学习环境的特殊性和学习者“高移动性”的学习行为，根据学习者的可用时间为其交付自适应微学习资源。MLaaS\
  \ 的框架已根据真正的云标准进行了良好设计，其用户模型通过研究全面的教学法文献和成功的在线学习案例进行了理论上的构建。在线和离线计算的架构所示图 3.2。\n\n\
  ![image](img/ch3-fig2.jpg)\n\n图 3.2. MLaaS 中的在线和离线计算架构\n\n### 3.5.1 离线计算\n\n####\
  \ A. 计算服务\n\n学习者建模服务旨在根据学习者的历史信息和持续学习行为为每个学习者建立特定模型。学习者关于学习风格、偏好和目的的基本信息来自 PLE 中的历史学习者信息收集服务。根据这些数据收集，该服务评估每个学习者的预备水平，并用一组测量变量对这些特征进行标记。它还提供了一个功能，用于跟踪微学习过程的学习者行为，并在检测或生成新数据时确保模型保持更新。\n\
  \n学习资源表示服务存储所有可用微学习资源的表示。它从开发的 OER（例如 MOOC 课程）中提取资源模块。根据其时长，它们被分为微学习资源（小于 15 分钟）和非微学习资源。参考教育数据挖掘（EDM）和学习分析（LA）的结果，这些较长的课程模块被程序化地切割并封装成合理长度的小单元。由于该模块持有元数据存储库，将从语义上建立描述微课程单元的元数据标准（Veeramachaneni\
  \ et al., 2013; Beydoun, 2009）。根据该标准，所有学习资源将根据学科、关键词、时长、教学语言、流行程度等方面进行表示（Veeramachaneni\
  \ et al., 2013）。与高质量且被广泛讨论的学习者生成内容相关的数据可以填充到学习资源库中，以支持 MOOC 中的同伴学习（Beydoun, 2009）。\n\
  \n对于 MLaaS，实时学习者数据检索服务检索学习者的实时数据，包括他们的学习进度和当前可用时间（即他们希望使用的分钟数）。\n\n\n\n\n此外，在学习资源库服务中，选定的课程模块使用文本/数据挖掘技术进行聚类。该服务还衡量分块之间的相关性，或者在可行的情况下，从现有的\
  \ MOOC 课程模块推导出相关性。它有助于设定学习的起点和终点，还能区分建议的学习资源序列并从中识别出学习路径。\n\n通过接收来自上述所有服务的输入，自适应引擎通过为学习者提供定制学习资源来运行，这些资源可以匹配他们当前的微学习场景、个人需求、学习风格和偏好。它是所提系统的核心，嵌入了机器学习技术以实现自适应机制（Al-Hmouz\
  \ 等，2010；Bouyia & Demetriadis，2012）。\n\n`MLaaS` 还将通过标准的面向服务的架构规范在移动端 Web 上开放其功能，并与个性化学习环境（PLE）中的其他\
  \ SaaS 和 Web 服务实现互操作。\n\n#### B. 工作原理\n\n基本上，离线计算在复合事务的基础上运行。当一个学习活动启动时，会生成与其关联的复合事务，因此可以表示为：\n\
  \n`{Learner Profile, Micro OER profile, Association}`\n\n其中涉及学习者画像（learner profile）和一个\
  \ OER 映像，通过一个关联（association）连接，该关联显示了学习者相对于微 OER 的属性。常见的 OER 交付系统采用用户评分、偏好、点击率或流行度作为显式属性。这些系统通常采用\
  \ Top-N 推荐，以便学习者拥有相当多的候选学习资源。遗憾的是，根据推荐系统的一项研究，极少数学习者参与了评分过程（Su 等，2010）。因此，离线计算负责将隐式用户行为转换为显式信息（Sun\
  \ 等，2015）。\n\n知识库充当系统的智库，并运行在自适应引擎之后（Sun 等，2017）。基本上，知识库负责学习者画像和 OER 表征的语义构建与存储（Sun\
  \ 等，2017）。\n\n采用本体论（ontologies）作为学习者画像的基础，对于解决微 OER 交付中的冷启动问题至关重要。它允许将初始学习者行为与本体论中现有且预构建的知识及其关系进行匹配。语义学习者模型将使用基于机器学习的方法来获取、表示、存储、推理和更新每个学习者的画像。它使得\
  \ MLaaS 能够考虑个人学习风格、学习者背景、应用能力和教学材料结构，从而响应用户定制化学习信息的类型和交付格式。同样，还将构建一个增强的微 OER 本体论，其中每个微\
  \ OER 都根据其所属 Web 服务的的功能属性和非功能（QoS）属性进行衡量（Sun 等，2015；Wang and Shen，2016）。\n\n在接下来的第\
  \ 4 章，我们将展示一个用于微开放学习的全面学习模型（Sun 等，2015）。该模型涉及可以影响并限制微学习体验及结果的特征，并封装在本体表示中（Sun 等，2016；Sun\
  \ 等，2017）。通过利用全面的学习者模型，`LearnerProfile` 可以分解为：\n\n`{InternalFactors, ExternalFactors}\
  \ = {IntellectualFactors & NonIntellectualFactors, ExternalFactors}`\n\n其中，内部因素可以分为个人智力因素和非智力因素，根据因素是否与学习者的认知和智能水平有关进行区分。外部因素源于环境和社会经济背景。鉴于\
  \ OER 交付具有“大数据”背景，理想情况下应该有足够的数据集用于数据建模和机器学习，并且必须进行规则挖掘以为在线预测填补未知值。采用关联规则学习来实现发现过程。特别地，利用了多关系关联规则发现（Reza\
  \ 等，2014）、基于上下文的关联规则发现（Shaheen 等，2013）、序列模式挖掘（Mabroukeh & Ezeife，2010）等。详细的规则发现策略将在第\
  \ 5.2 节中介绍。规则可以表示为：\n\n`{LearnerProfile, MicroOERProfile} -> {Association}`\n\n\
  从技术上讲，规则挖掘和学习者聚类操作贯穿整个离线计算过程。因此，可以较容易地解决收集数据中的缺失值问题。\n\n如前所述，MLaaS 的核心即自适应引擎处理来自所有其他服务的结果，并将其输出直接传输到用户界面。\n\
  \n然而，在真实的 MLaaS 应用中出现了一个巨大的挑战。初始的 MLaaS 系统关于学习者的信息不足，因为由于“OER”和“学习者”对于这一新兴教育环境来说都是全新的。这为启动数据处理工作带来了巨大的困难。在微开放学习开始时没有任何关于学习者的信息的情况下，画像构建是不可行的。\n\
  \n#### C. 整合完整的微开放学习体验\n\n在移动服务环境中，利用 EDM（教育数据挖掘）和 LA（学习分析）来识别具有相似性的微学习资源是可行的（Wang，2008；Markellou\
  \ 等，2008）。此外，根据学习者的历史学习记录，可以排序出学习者通过资源块的顺序。在开放学习中，尤其是 MOOC 学习中，不同的提供者或大学可能提供内容和章节划分大不相同的课程。可能从不同的提供者处学习多个可用课程章节，并合成这些片段，为特定的\
  \ MOOC 课程构建一个完整的学习体验。\n\n某些课程章节之间存在严格的顺序，这些由课程提供者预定义（Tam 等，2014）。在其他情况下，序列仅仅是建议性的，如果可以检索，某些学习者可以根据人的建议和经验接受此类序列（Chen，2008）。EDM\
  \ 和 LA 有助于从历史案例中探索潜在的学习路径并将其展示给所有 MOOC 学习者。\n\n还有许多其他方法可以通过 OER 形式化微学习路径（Idris 等，2009）。关键考虑因素是学习活动应该是短促的、按需提供的或与员工的工作任务直接相关的。\n\
  \n学习路径的构建和优化由学习资源库服务承担，需要手动从相关材料中提取概念标题和描述。随后，通过文档分类技术提取关键词，以推断关键词的重要性。可以利用与研究提出的（Matsuo\
  \ & Ishizuka，2004）类似的算法进行我们的基于共现统计信息的关键词提取。假设从所有 n 组课程中共中共提取了 m 个关键词和短语，可以相应构建一个\
  \ m 维欧几得空间。每个微学习资源块可以参数化为关键词向量，代表该 m 维空间中的相应概念，每个维度代表关键词在相关课程中的重要性。然后应用相似性计算（例如皮尔逊相关系数或余弦相似度）来衡量两个资源块之间的相关系数。\n\
  \n![image](img/ch3-fig3.jpg)\n\n\n\n\n## 图 3.3 组装整个微学习体验的工作流\n\n微开放学习中可用的所有课程模块可以使用聚类算法进行聚类，例如广泛使用的\
  \ `K-means` 和 `K-nearest neighbours`，通过其相似性指标将课程模块归类到不同的知识组。每个课程块簇被视为该课程下的一个独立知识领域。通过利用\
  \ `EDM` 和 `LA`，我们可以在每个簇内部或不同簇之间建立规则，用以识别两个课程模块的顺序。\n\n学习路径可以随机生成作为初始解决方案，然后通过人工智能技术或启发式算法（例如\
  \ `genetic algorithm`）根据既定规则并针对多个目标进行优化。学习路径优化的工作流如图 3.3](#Chapter3.xhtml#ch3-fig3）所示。\n\
  \n### 3.5.2 在线计算\n\n在线计算的应用在许多行业领先的推荐系统中流行起来，例如 `Netflix`^b 和 `Amazon Online Store`^c。人们认为，在线计算可以对近期事件和用户交互做出更好的响应，但必须实时响应请求。这可能会限制所采用算法的计算复杂度以及可处理的数据量\
  \ (Amatriain, 2013)。它可以有效处理规模相对较小的数据集。受电子商务和娱乐系统中采用在线计算的启发，我们借用这一思想，通过基于学习活动的“近期性”（即学习行为和\
  \ `OER publishment`）来促进 `MLaaS` 在计算方面的性能。\n\n我们提出的在线计算领域的主要贡献是：它致力于解决由于新系统和新用户条件导致的构建初始学习模型和路径时数据（即学习信息）缺失的问题。它利用轻量级的\
  \ `learner-micro OER model` 机捷地处理普遍的冷启动问题。该轻量级模型根据分类算法、相似性量和预测技术工作，在不需要任何先验概率的情况下解决微\
  \ OER 首次交付的问题。\n\n此外，在线计算在通过最新发布的微 `OERs` 插入既定学习路径以促进新 `OERs` 具有专业知识。它还将学习者的最近行为和最新事件融合到推荐结果中，以满足对高实时性的需求。\n\
  \n## 总结\n\n在本章中，我们展示了研究的“大蓝”，并确定了我们在本书后续章节中将要解决的研究问题。首先，我们回顾了研究背景，在该背景中，提出了一种基于面向服务架构的\
  \ `PLE`。我们的试点研究促使我们促进当前的 `OER` 交付形态，并分别从自适应微学习、在线计算和冷启动问题总结了研究挑战。研究目的根据后续章节的顺序列，并用场景示例进行了解释。在\
  \ Section 3.5 中，我们描述了系统框架，其中涉及在线和离线计算领域，共同做出自适应微 OER 交付的决策。\n\n^(a)[`www.usc.edu.au/explore/structure/divisions/centre-for-support-and-advancement-of-learning-and-teaching`](https://www.usc.edu.au/explore/structure/divisions/centre-for-support-and-advancement-of-learning-and-teaching)\n\
  ^(b)[https://www.netflix.com/]\n^(c)[https://www.amazon.com/]\n\n# 第 4 章 微开放学习的综合学习者模型\n\
  \n遵循上一 Chapter 3 中 `MLaaS` 的系统框架，我们将关注作为本章核心的 `OER` 和 `Adaptive Engine`。通过研究计算机科学与学习科学交叉领域的文献，我们筛选出了对微学习的舒适度和成功具有重要的特征。\n\
  \n如图 4.1](#Chapter4.xhtml#ch4-fig1)所示，学习者模型由两个领域的因素（即内部和外部）组成，而内部因素可分为认知和非认知因素。每个领域由矩形框围，并用特定颜色区分（即外部因素为绿色矩形，内部因素为黑色矩形，其中认知因素为蓝色而非认知因素为红色）。某些组件落在两个领域的交叉处，这意味着这些组件与两个因素相关。此外，一个组件可能与其他重叠，表明它们相互关联并相互影响。\n\
  \n## 4.1 综合学习者模型\n\n虽然跟踪、监控和记录访问 `OERs` 的学习者的整个过程并不，但以可视化统计的方式报告它们以揭示每个学习者的故事更为关键。这对于进行学习推理、判断学习者状态、估计学习者进度以及执行学习策略决策起着重要作用。\n\
  \n构建学习者模型的数据收集可以通过两种实现：静态数据收集（例如来自强制请求）和动态数据跟踪（例如来自自动提取）。我们打算探索的详细学习者特征和学习背景列在后续章节中。\n\
  \n## 4.2 OER 的定制化\n\n在 Section 4.2 中，我们将提供学习内容的概述。随后，将描述 `OERs` 的分类。\n\n\n\n\n\n\
  图 4.1. 微开放学习综合学习者模型\n\n## 4.1.1. 个人非智因素\n\n#### A. 学习者类型\n开放学习者的类型根据其特定的学习目的、工作和生活模式而有明显差异。他们的背景信息并非总是如此，但可以从注册和登录数据中搜索（DeBoer\
  \ et al., 2013; Kay et al., 2013）。一些常见类型包括：\n\n• 大学里的全职学生，他们更倾向于远程和电子化学习，而不是面对面听课。他们愿意享受智能设备和门户设备带来的便利。\n\
  \n• 发展中国家的全职大学生，那里的教育发展水平较低。由于所在大学的学习资源匮乏，开放学习为他们提供了更多机会参与顶尖大学提供的课程，从而能够促进他们的日常学习，并领略先进的知识管理和教学方法。\n\
  \n• 工作在发展中国家大学的教育工作者。他们通过开放教育资源（OERs）从顶尖大学获取经验，并学习如何高效地教学，以改进自己的教学方法和流程。\n\n• 关注\
  \ OER 交付流程（例如 MOOC 课程）的科研人员，旨在探索其中的潜在缺陷，这些缺陷会阻碍学习者获取传递知识。他们的目标是精炼当前的 OER 教学流程，并寻找虚拟化的增强教学方法。在参与开放学习的过程中，他们经常会暂停，并根据研究需求反复检索课程的某些特定章节。\n\
  \n• 受公司或机构要求参加 OER 培训的员工。通常，他们有一个集中的时间段来完成 OER 学习。他们的整体学习计划由培训师驱动，他们有自由连续地完成分配的任务，并为每个特定的课程单元安排自己的时间。\n\
  \n• 希望在下班时间通过学习 OER 来丰富知识或提高技能的员工。他们的终极目标是在职场中更具竞争力，且通常具有自我驱动性。因此，他们会根据较高的自由和自主性，为每个学习阶段设定目标和里程碑。\n\
  \n• 终身学习追求者。他们可能是员工，其开放学习内容（如 MOOC 课程）可能与日常工作并不密切相关；也可能是非工作人员，如家庭主妇、老人或退休人员（Blaschke,\
  \ 2012）。通常这类开放学习学习者是兴趣驱动的（Cochrane et al., 2012）。\n\n#### B. 时间可用性\n学习者的可支配时间差异很大，这对于这些学习者是否以及以及多久采用微学习模式具有高度指示性。因此，最好将他们当前的时间可用性设置为他们开始前必须输入的强制性要求。\n\
  \n#### C. 学习参与度\nAnderson 等人认为，学习者的参与度很大程度上取决于课程中的互动和发布。高参与度的学习者在论坛中表现得更活跃，并积极提出问题和寻求建议；而低参与度的学习者在平台上互动较少，对开放学习的兴趣较低（Alario-Hoyos\
  \ et al., 2014）。学习者的参与度也可以被分为主动学习和被动学习。前者是指学习者主动参加 MOOC 课程以获取资源；后者是指学习者作为平台或社交媒体推送信息的接收者。\n\
  \n#### D. 进度识别\n这基本上通过学习者的切断点和里程碑来识别。在微学习中，学习活动是分散的，课程内容的阶段并不局限于特定的时间点，还考虑了他们学习的近时性（Bruck\
  \ et al., 2012）。\n\n#### E. 学习动机与目的\n基本上开放学习学习者要么是兴趣驱动，要么是任务驱动。他们的目的通过强制性数据来识别，这意味着学习者在开始学习之前输入学习目的。\n\
  \n#### F. 学习偏好\n学习偏好是指学习者对学习内容的客观观感受。可以通过学习者对资源的评论和标签进行分类。\n\n## 4.1.2. 个人智因素\n\n\
  #### A. 学习者预知识评估\n为了给学习者建立画像并为不同背景的学习者定制微学习策略，预采取的一种必要措施是根据若干标准评估每个学习者的背景知识。在微开放学习中，建议根据教育程度、MOOC\
  \ 历史成绩以及课程测验结果来调查并识别他们的预知识水平。\n\n许多电子学习采用的典型措施是预知识评估（Xu et al., 2014），即在学习者开始课程之前考试。虽然这在校园课程中很常见，但并不适合迁移到微开放学习，因为学习者是分散且流动的。\n\
  \n\n\n\n根据 Kolb 和 Kolb (Kolb & Kolb, 2005) 的研究，学习风格可以表示为具体经验（感受）、反性观察（观察）、抽象概念化（思考）和主动实验（行动）。然而，由于移动设备上的操作相对简单，输入输出方法受到限制，很难通过监控学习者的操作直接反映出这四种学习风格。因此，识别学习者的学习风格需要额外的努力。例如，采用某些外部方法是行的，如自评估。此外，如果其他开放学习活动中的学习指定了相关的学习风格，学习者在特定学习活动中的表现就可以反映他们对相应学习风格的重视。\n\
  \n#### C. 记忆能力\n\n记忆能力可以在学习的保留和再现阶段影响学习成果（Bui & Myerson, 2014）。对于文化、文学、艺术、语言和历史等学科的开放教育资源（OER），记忆能力是帮助学习者将在线\
  \ OER 内容转化为自身知识的关键衡量之一。在利用碎片化时间学习这些学科时，这一点尤为重要（Xiong, 2015）。\n\n# 4.1.3. 非智力因素与智力因素的交汇\n\
  \n#### A. 学习习惯\n\n每位学习者都有完全孤立的可用时间和学习时间结构。校内教师主导的学习时间大部分集中在白天。与此不同，移动/微开放学习时间遍布全天\
  \ 24 小时。他们的个人情况影响着学习习惯，在本研究中，这指的是学习者如何利用时间开放学习、以什么方式获取学习资源、暂停和重复的频率、多久后进行复习、是否并行学习来自多个提供者的\
  \ OER、在一天中哪些时间段经常进行开放学习，以及在这些时间段中，何时更倾向于采用微学习手段。\n\n#### B. 学习速度\n\n这一特征是指学习者完成一个课程块并结束相关任务的平均花费。这可以从他们的历史学习记录中进行估计。\n\
  \n#### C. 语言能力与偏好\n\n应当考虑学习者的语言能力和偏好，以选择或排除他们的学习资源。由于大多数 OER 是英文的，因此识别学习者的英语水平至关重要。或者，该服务还调查了他们更倾向于用母语还是英语以外的第二语言进行学习。\n\
  \n#### D. 干扰程度\n\n在内部，它涉及学习者的情绪和情感，与干扰程度高度相关，干扰是外部因素的一个组成部分（Dennen & Hao, 2014;\
  \ Khaddage et al., 2015）。\n\n# 4.1.4. 外部因素\n\n#### A. 学习地点与环境\n\n学习者连接互联网的方式显然揭示了他们的学习地点和周围环境。通常在微学习场景下，他们通过两种方式接入互联网，即\
  \ `Wi-Fi` 或移动蜂窝网络（例如 `4G`、`3G` 和 `GPRS`）。简单来说，通过移动网络连接互联网意味着学习者正在随机进行学习活动，移动信号的强度变化可以反映他们处于移动状态的状态。\n\
  \n#### B. 一般情况\n\n有关学习背景的一情况部分影响着他们的学习体验和成就。为了满足微学习需求，必须明确有关移动设备的信息（Tortorella &\
  \ Graf, 2012）。\n\n#### C. 协作学习的帮助\n\n受开放学习结构性质和 OER 教学理念的影响，学习者可以从社交网络活动中获得有用信息（Ji\
  \ et al., 2016）。\n\n#### D. 干扰程度\n\n干扰程度取决于周围的噪音因素、对 OER 交付设置和布局的舒适度（Christensen,\
  \ 2003）。\n\n## 4.2 微学习内容\n\n# 4.2.1. 微 OER 分类与定制\n\n#### A. 现成的微 OER\n\n开放学习改变了学习者的预期，支持开放学习的技术也可以支持微学习。既然开放学习在规模和格式上已经扩展（即\
  \ OER 已经演变，现在该缩写包含了许多类型的课程），OER 提供者为培训部门或教育提供者及机构提供了多种选择，以便在组织内部实施微学习路径，让学习者建立充满多样性和乐趣的自己的学习计划（Lourdes\
  \ & Albert, 2013）。典型的学习资源涉及短视频和其他视觉学习资源、间隔重复和练习活动、交流与协作环境，以及证书和游戏化。因此，如果微学习资源在短时间内（例如\
  \ 15 分钟）有明确定义，它们通常会立即交付。\n\n#### B. 非微 OER\n\n然而，大多数实现的 MOOC 内容是非微学习资源，需要适当的精炼。这些内容需要进一步的处理和修订以满足微学习需求。\n\
  \n- 视觉百科全书：根据整个课程的知识结构列出学习要点。对于每个要点，设置了无时间限制的视频或文本材料，以清晰地阐述自包含的内容。\n\n- 课件和课程视频的逻辑分：此处每个单元涵盖了一个学习章节的完整信息，包括开始和结束条件，携带连贯的内容，并且可以单独学习。\n\
  \n\n\n\n## 学习方法\n\n- **从完整的课程材料中提取章节**：在这种情况下，首先选择并提取特定的知识部分，同时消除课程中的冗余内容。由于不同的开放教育资源（OER）提供者提供了相同内容或知识范围的资源（例如斯坦福大学和卡内基梅梅隆大学提供的“机器学习”MOOC\
  \ 课程），章节提取使学习者能够并行学习，精确定位特定章节，而无需浏览整个课程。\n\n- **关联社交媒体中的课程相关及教育信息**：这是学习资源的延伸，也具有丰富的教育价值。这些资源不仅可以在\
  \ MOOC 平台嵌入的论坛或博客中找到，还可以在其他流行的社交媒体（如 Facebook、微信、Twitter、Tumblr 等）上找到，学习者、教育者或外部专家会在那里发布课程材料（Mark\
  \ et al., 2010）。此类资源的一个显著特征是其数量随时间不断增加，但某些内容可能包含伪科学或错误信息（Dowling, 2013; Henry, 2014）。\n\
  \n- **订阅式学习**：从教学学角度来看，这也被视为被动学习。正如其名称所示，它为订阅者提供间歇性的学习相关交互。这些学习相关交互可以涉及各种学习相关事件，包括内容展示、诊断、基于场景的问题、工作辅助、反思问题、作业、讨论等。此类交互是短促的，经过特意安排以支持学习，通常利用与间隔效应（spacing\
  \ effect）相关的研究结果。学习者订阅一个或多个学习交互形成多个学习线程（Waard et al., 2012）。\n\n- **双向互动内容或活动设置**，范围涵盖反馈、对其他学习者内容的评估和回顾、同伴学习、协作写作、合作工作以及翻转课堂。\n\
  \n- **学习者生成的内容**：受开放学习实践者和教育者的高度推崇，P2P 学习、数字翻转课堂、相互监督在开放学习中具有越来越高的教育价值（Lee & McLoughlin,\
  \ 2007）。MOOC 的新形态强调联结主义，将学习者生成内容的获取和共享引入常规学习手段（Cochrane et al., 2013; Narayan, 2011）。\n\
  \n## 4.2.3. 微 OER 测量\n\n#### A. 功能属性\n\n出于建模目的，一个学习资源块的测量将根据以下特征（Al-Hmouz et al.,\
  \ 2010; Miranda & Albano, 2015; Bouarab-Dahmani et al., 2015）：\n\n- 长度\n- 移动学习的适用性\n\
  - 教学模型（归纳法、演绎法、实践学习等）\n- 媒介性（例如：纸质媒体、电子媒体、单媒体与多媒体、（中）媒介形式等）\n- 难度（知识水平）\n- 完整性\n\
  - 对注意力的需求\n- 偏好的学习风格\n- 交互类型（说明性的、主动的、单向传递或双向互动）\n- 对输入或实际操作的需求\n- 学习类型：重复型、活动型、反思型、务实型、概念主义、建构主义、联结主义和行为主义；此外还有行动学习、企业学习、学科。\n\
  \n此外，微 OER 具有其基本信息，如主题、语言等。\n\n#### B. 非功能属性 (QoS)\n\n这些属性描述了服务的质量。我们采用面向服务的架构，并列出了一些：\n\
  \n- 性能（响应时间、延迟、吞吐量）\n- 可靠性（可用性、容错性、恢复性）\n- 健壮性和稳定性\n- 可扩展性\n- 兼容性、互操作性、安全性\n\n##\
  \ 总结\n\n在本章中，我们介绍了综合学习模型的结构，重点关注最重要的输入。该模型由两个领域组成（即内部和外部），而内部因素可以分为个人因素和非智力因素。某些组件属于这两个领域。根据我们的设计，学习模型的语义构建将使用基于机器学习的方法来获取、表示、存储和推断每个学习者的画像。详细方法将在第\
  \ 5 章中介绍。\n\n# 第 5 章：语义知识库构建：教育数据挖掘与学习分析策略\n\n由于所有微 OER 适应决策均由 `Adaptive Engine`\
  \ 做出，它是离线计算系统的核心。它消耗来自所有其他服务的结果，并将输出直接传输到用户界面。因此，`MLaaS` 设计用于满足数据密集系统的标准，而知识库作为其智库。\n\
  \n基本上，知识库是使用自上而下的方法，利用语义手段从模式层面到数据层面构建的。换言之，首先绘制几个本体，然后进行 `data processing` 工作。我们尝试将微学习的模式和规则发现过程与教育文献调查相结合，产生可能影响移动环境下学习体验和结果的特征（Sun\
  \ et al. 2015）。详细而言，`data processing` 工作涉及从开始到结束的所有数据操作，例如实体提取、关系提取、消歧解析等。\n\n\n\
  \n\n该研究侧重于微开放教育资源（OER）推荐与交付的知识库。自然，根据可检索的数据量，这个问题可以从两个方面入手。\n\n* 如果学习者被 `MLaaSS`\
  \ 充分了解，将采用教育数据挖掘和学习分析（`EDM` 和 `LA`）方法应用于其历史数据，以理解其学习模式和偏好。从而，可以根据其个性化设置和特定环境做出合理的推荐。这将负责\
  \ `MLaaSS` 的离线计算领域，并在本章中介绍。\n* 如果学习者被 `MLaaSS` 了解程度较低（即该学习者是开放学习环境的新学习者），则这被视为一个冷启动问题，并通过用预测数据填补空白来解决，从而根据人口统计信息进行推荐。冷启动问题将在的第\
  \ 6 章中讨论。\n* 新生成的信息结合冷启动推荐，将填充学习者画像的第一版本。\n\n## 5.1 面微开放学习的基于概念图的本体论构建及拟议的数据处理策略\n\
  \n通常，一个可行的知识库具有两层结构：顶部是模式层，底部是数据层（Cambria et al., 2014）。对于模式层，本体是基于概念图构建的。通过这种方式，本体代表数据处理工作流的正式维度，并可以通过先验知识驱动数据处理，从而缩小搜索空间（Xu\
  \ et al., 2011; Dou et al., 2015）。\n\n通过对教学法、心理学、电子学习和移动学习领域的文献进行全面调查，我们整理了可能在微开放学习体验和成就中起关键作用的特征。这些概念图还代表了这些特征在持续的微开放学习过程中是如何相互影响和关联的。这将在后续章节中分别从\
  \ `OER`（项目）侧和学习者（用户）侧介绍。\n\n### 5.1.1 增强型微 OER 本体论\n\n从项目的角度来看，我们将视野从普通的电子/移动学习深化到微学习环境。因此，`OER`\
  \ 的通用本体论被增强以适应微学习的需求。\n\n在增强型微 OER 本体论中，微 `OER` 的标注是自描述的；通过元数据探索其教育参数，例如类型（视频、音频、文本等）、交互类型（解释性的、主动的、混合的、双向的）、教学模型（例如归纳法、演绎法、中学等）以及非功能属性，如\
  \ `QoS`、语义密度等（Miranda & Albano, 2015）。增强型 OER 本体论中的每个节点都代表一个微 `OER` 块（chunk）。块是微学习设置中的最小单元——通常是来自提供者的经过精细切割的\
  \ `OER` 片段——其时长比原始形状明显短（最好少于 15 分钟）。它可以是一个微概念或知识点，比教师以前交付的更小；也可以是课程视频或讲座笔记的片段；或者是随概念一起交付的课程设置，如评估、任务、阅读材料等（Sun\
  \ et al., 2015）。\n\n没有一个块是完全独立的，它们中的每一个都是关系网络的一部分，而不仅仅是概念对象（Moreno et al. 2013）。该本体论用于在教学法定义的独特主概念集中对\
  \ `OERs` 进行显式分类以推荐，并作为原始材料输入 `MLaaSS` 的推理过程（Sun et al., 2016; Moreno et al. 2013）。\n\
  \n增强型 OER 本体论的概念图如图图 5.1\n\n图 5.1 微 OER 本体论的概念图\n\n### 5.1.2 增强型微学习学习者画像分类法\n\n\
  从用户的角度来看，所有学习者画像的基础主本体被称为基准本体论（Benchmark ontology），其中元素 `Learner` 被置于图的中心（Sun et\
  \ al., 2016）。作为预设领域本体论的实例，面向微学习的特定学习者画像是基准本体论中的节点与增强型微 OER 本体论中的节点匹配而成的节点集合。它包含了大量关于学习行为和背景的标注。基准本体论的概念图如图图\
  \ 5.2\n\n图 5.2 微开放学习学习者画像基准本体论概念图\n\n## 5.2 EDM 和 LA 策略\n\n### 5.2.1 方法论\n\n开放学习系统收集的学生学习数据正在被探索，旨在通过应用分类数据或发现关系的教育数据挖掘方法来开发预测模型。这些模型在构建自适应学习系统方面起着关键作用，基于模型的预测进行适应或干预可以改变学生下一次的体验，甚至可以推荐学术之外的服务来支持他们的学习。\n\
  \n分析这些新的日志事件需要新的技术来处理非结构化文本和图像数据、多源数据以及海量数据（“大数据”）。数据没有固定的大小；任何分配给定义它的数字都会随着计算技术的进步（处理更多数据）而改变。因此，“大数据”是相对于当前或“典型”能力定义的。例如，Manyika\
  \ 等人（2011）将大数据定义为“规模超出典型数据库工具捕获、存储、管理和分析的数据集”。\n\n在这一前沿，教育数据挖掘和学习分析被广泛用于研究和构建影响在线学习系统的模型。正如其名所示，`EDM`\
  \ 是“将数据挖掘技术应用于教育数据的先进技术”（Romero & Ventura, 2010）。它关注许多开发方法，并探索教育环境中的独特数据类型。通过这些方法，可以更好地理解学生及其学习环境（Romero\
  \ & Ventura, 2010）。为了实现 MOOC 的智能自适应微学习，`EDM` 和 `LA` 是我们用于构建学习者基础的关键概念。\n\n### 5.2.2\
  \ EDM 和 LA 利益相关者\n\n`EDM` 和 `LA` 不仅可以帮助学习者个性化他们的微开放学习并向他们推荐活动、资源甚至是具有相似兴趣和目标并加入小组的人，而且对开放学习教师和\
  \ OER 提供者也具有重要意义。\n\n对于开放学习教师，`EDM` 可以帮助获取教学的客观反馈；分析学生的学习和行为；检测需要支持的学生；预测学生表现；将学习者分类社区或小组；发现学习者的规律和异常模式；发现最常见的错误；确定更有效的活动；改进课程的适应和定制等。\n\
  \n对于 OER 提供者和参与开放学习的大学，`EDM` 可以增强决策过程；简化决策流程效率；实现特定目标并增强所有 OER 提供者之间的竞争力；建议对特定学习者群体可能意义某些课程；寻找提高留率和成绩最具成本效益的方法；录取在开放学习中表现良好的学生并吸引更多学习者参与等。\n\
  \n### 5.2.3 EDM 和 LA 策略\n\n\n\n\n通过可视化和统计化的方式报告学习者的数据，以展示他们独特的学习故事以及学习限制（如时间可用性），是非常关重要的。这在评估学习者的学习状态、估计其学习进度以及进行战略决策方面发挥着重要作用。该过程负责为从开放学习平台进行数据提取设定基准。\n\
  \n对于知识库的底层（即数据层），面向微型开放学习的语义学习者画像和知识库构建的技术操作是基于来自两个源的数据填充图：显性数据收集（例如，通过强制性请求）和隐性数据跟踪（例如，自动提取）（Moreno,\
  \ 2013）。\n\n此外，我们没有自己为开放教育资源（OERs）开发领域本体论，而是通过利用现有的本体共同构建了一个通用的课件本体论结构。这些本体提取自主要的\
  \ OER 提供者，例如参与大型开放课程联盟的大学（例如参与 edX 的机构^a），或来自链接开放数据云（Linked Open Data Cloud）社区^b（Capuano\
  \ et al., 2009）。\n\n对“大型”开放学习数据的调查与 OER 相关。在海量的 OER 中，预见了三种主要关系：\n\n*   `ConsistsOf`\
  \ 是一种包含关系。这种关系通常出现在两个 OER 之间或一个 OER 与一个微型 OER 之间。具有这种关系的两个项目位于增强型微型 OER 本体论的不同层级中。\n\
  *   `RequiredSequence` 是两个项目（OER 或微型 OER）之间的强顺序关系，由于课程设置和教育考虑，前一个微型 OER 必须在后一个之前学习。\n\
  *   `RecommendedSequence` 是两个项目（OER 或微型 OER）之间的弱顺序关系，根据教师的指导，建议在学习后一个之前先学习前一个微型\
  \ OER，但并非强制性。\n*   两个项目（OER 或微型 OER）之间完全可能没有任何关系。\n*   两种关于顺序的关系都可以被实体的后代继承，例如，如果存在一个\
  \ `RecommendedSequence`（`R*[1]`, `R*[2]`）表示 OER `R*[1]` 优于 `R*[2]` 学习，那么对于 `MR*[1]`\
  \ ∈ `R*[1]` 和 `MR*[2]`∈ `R*[2]`，则存在一个 `RecommendedSequence`（`MR*[1]`, `MR*[2]`）。\n\
  \n教育数据挖掘（EDM）和学习分析（LA）的目的是修正、丰富和验证上述手动构建及半自动提取的本体论，并验证和衡量所发现关系的重要性。我们对 EDM 和 LA\
  \ 的结合基于两个组件（Markellou et al., 2005）：校内移动学习数据（即结构化数据）和“大型”开放学习数据（即非结构化数据）。特别是，我们通过对澳大利亚某公立大学学生的学习行为真实数据进行实质分析，开展实验\
  \ EDM 和 LA。数据收集自该大学的主学习管理系统（LMS）和数据仓库。该分析旨在识别学生参与混合学习（即校内学习和在线/移动学习）的常规模式；例如，他们是否以及多久地采用微学习模式来完成学习。\n\
  \n\n\n\n| 分析因素 | 非微型 OER | 用于识别资源对微学习的适用性，例如，是否需要进行实践操作，或者 OER 的交付是否必然涉及大量的写作或计算工作（而这些工作在移动设备上不便于完成）。\
  \ |\n| 预测 | 订阅型 OER | 用于确定在最佳时机向学习者推送信息并对其进行提醒。 |\n| 聚类 | 所有微型 OER | 用于确定它们之间的相关性，以更好地实现仓库的功能。\
  \ |\n| 关系挖掘 | 时间可用性 | 用于发现其整体时间可用性与学习者类型之间的相关性。 |\n| 聚类/预测 | 时间可用性 | 将相似的学习者划分到群体中，并为他们的整体学习计划构建一个潜在的时间范围。\
  \ |\n| 潜在知识估计 | 学习习惯（学习时间分布） | 用于发现群体内或跨群体学习者在时间范围内是否存在有规律的时间组织模式。 |\n| 潜在知识估计 |\
  \ 学习者最新的学习内容和活动 | 用于检索并分析学习者的学习近时性。 |\n| 分类 | 学习习惯 | 为每位学习者建立独特的学习习惯总结。 |\n| 关系挖掘\
  \ | 学习者的学习位置数据 | 了解分心程度以及其与外部环境干扰之间的相互关系。 |\n| 关系挖掘 | 学习者的移动 App 使用情况 | 了解分心程度以及其与移动互联网内容干扰之间的相互关系。\
  \ |\n| 社会网络分析 | 关联社交网络中的 OER | 用于区分可能无用、有害并导致学习者浪费时间的信息。 |\n| 社交网络分析 | 关联社交网络中的其他内容\
  \ | 筛选出广认可的信息，以便作为 OER 之外的学习增强推荐给学习者（采用了文本挖掘技术）。 |\n\n在很大程度上，数据层的建立可以涉及整合异构的 OCW（开放课程资源）仓库，将可用的\
  \ OER 精炼并融合到微学习语境中，并将它们的元数据作为链接数据发布。由于近年来一些教育工作者和研究人员在链接数据概念方面为发布和推广 OER 付出了巨大努力，基于这一扩展目标开发的工作流通常分为六阶段：\n\
  \n1. 识别并选择异构数据源，以确定内容范围。\n2. 为 OER 领域构建词表模型。\n3. 数据提取。\n4. 生成标准化的数据描述（例如，`RDF` 数据）。\n\
  5. 发布链接数据。\n6. 消费并显示链接数据。\n\n## 总结\n\n在本章中，我们展示了语义知识库的构建，该知识库支撑了由 `Adaptive Engine`\
  \ 实现的微型 OER 推荐系统的决策过程。知识库是基于概念图自上而下构建的，首先在模式层面构建了两个增强本体。通过此方法，随后在底层开发了数据处理策略。这种\
  \ `EDM` 和 `LA` 策略旨在从校内数据和开放学习数据的双视角理解微学习模式和规则，并支持微型 OER 推荐系统的决策过程。\n\n^(a)[`www.edx.org/schools-partners`](https://www.edx.org/schools-partners)\n\
  \n^(b)[`lod-cloud.net`](http://lod-cloud.net)\n\n# 第 6 章\n\n# MLaaS 的在线计算\n\n在本章中将介绍\
  \ MLaaS 在线计算领域的操作流程。正如第 3.3.3 节中所述，采用在线计算旨在处理能够反映学习行为“近时性”的近线活动，并对微型 OER 推荐做出快速响应。\n\
  \n此外，采用在线计算预计将提高 MLaaS 在以下方面的性能：\n\n1. 鉴于 MLaaS 的完全新颖性以及没有微型开放学习记录的新用户，本章的重点是在学习者处于崭新的微型开放学习日志阶段时进行首次交付。这是通过在线计算中解决冷启动问题的功能实现的。\n\
  2. 对于新发布的微型 OER，其能够在发布后立即在推荐列表中被发现和收集，对于它们的接受度和流行程度至关重要。这一需求将通过启发式机制实现，将新发布的微型 OER\
  \ 插入已建立的学习路径。\n3. 在线计算还负责通过保持全面的学习者模型和学习者-微型 OER 画像的更新，弥补离线计算在实时性和更新方面的局限性。\n\n\
  上述三个方面将在接下来的第 6.2 节、6.3 节和 6.4 节顺序介绍。\n\n# 6.1 用于冷启动推荐的轻量级学习者-微型 OER 画像\n\n## 6.1.1\
  \ 增强微学习学习者画像分类\n\n正如第 4 节所述，基于对教育学、心理学、电子学习和移动学习文献的全面调查，我们分类了可能微型开放学习体验和结果起关键作用的特征。从用户的视角来看，这种全面的学习者模型通过语义方法进行标注。这些本体还代表了特征在持续的微型开放学习过程中是如何相互影响和相互关联的。作为预设领域本体的实例，面向微学习的特定学习者画像是一组根根于主“全面学习者模型”本体的节点，并与增强微型\
  \ OER 本体中的一个节点相对应。它包含了大量关于学习行为和语境的标注。\n\n为了在技术上操作用于微型开放学习的语义学习者画像，数据收集来自两个方面：显式数据收集（例如通过强制性请求）和隐式数据跟踪（例如自动提取）（`Moreno\
  \ et al., 2013`）。\n\n## 6.1.2 轻量级学习者画像表示\n\n尽管从物品视角来看，可以根据微型 OER 画像定义的标准对微型 OER\
  \ 进行衡量；但从用户视角来看，对于没有历史的新学习者，很难获得此类复杂的信息，因此在许多情况下，面向离线计算的学习模型缺乏激活源。\n\n尽管在教育领域应用较低，但基于轻量模型的推荐（例如基于评分的推荐）是离线计算中基于本体推荐所需的密集数据维护方法的良好替代方案（`Nadolski\
  \ et al., 2009`）。\n\n因此，这种冷启动条件促使我们将第 4 节描述的全面学习者画像简化为轻量级版本。它仅处理决策所需的必要信息，以便敏捷地进行初始化（`Luz\
  \ et al., 2013`）。\n\n\n\n\n轻量级学习者剖谱由 `MLaS` 管理，分为两个部分：静态部分和动态部分。静态部分可以用一个向量表示，其中包含了人口统计信息和教育信息。通过匹配针对项目和用户的这两种增强本体论，学习者节点的动态部分表示为一个元对，`L[j]\
  \ = {MR[u], ML[j]}`，`L[j]`$\\in$ `L`。在这里，元素 `MR[u]` 表示第 `u`^(th 个微 OER，它是第 4 节中介绍的微\
  \ OER 本体论的特定版本，而三维元素 `ML[j]` {`P[u,j]`, `TA[j]`, `D[j]*} 是微学习过程中第 `j`^(th) 个学习者特有的。在这里，元素\
  \ `P[u,j]` 表示学习者的偏好，`TA[j]` 表示第 `j`^(th) 个学习者的即时可用时间，而 `D[j]` 表示在给定学习环境和周围环境下的分心程度。\n\
  \n轻量级剖谱中提出的这三个特征每一个都与一个置信度相关，以反映其主观相关性。例如，如果学习者直接提供显式信息并以数字而非范围出现，则其相关的置信度设置为完全。\n\
  \n每当 `MLaS` 从学习者在 OER 的学习过程中收集任何信息时，学习者剖谱将根据 `ML[j]` 进行更新。\n\n## 6.1.3. 即时可用时间\n\
  \n系统能够通过移动设备实时获取关于学习者可以在微 OER 上花费（或愿意花费）多长时间的显式信息。作为强制性请求，要求学习者在每次微学习活动开始时输入其即时可用时间。\n\
  \n根据系统设置，建议的即时可用时间 `TA[j]` 由从 1 到 15 的一个整数表示。然而，如果学习者不确定自己一次能在微 OER 上花费多长时间，他们可以留出一个时间跨度，该可以是相同范围内的连续整数。\n\
  \n## 6.1.4. 偏好传播\n\n![image](img/ch6-fig1.jpg)\n\n图 6.1. 增强微 OER 本体论的部分视图以及学习者对\
  \ OER 偏好的扩散激活\n\n考虑到首次交付微 OER 的冷启动条件，要求学习者快速对特定的微 OER 标记偏好。因此，采用扩散激活方法来维护相对于其父节点的偏好（即\
  \ `R[v]` 是派自 `MR[u]` 的第 `v`^(th 个 OER），并更新学习者剖谱。它根据激活值将学习者的偏好沿微 OER 本体论的层次向上传播。换句话说，偏好已从微\
  \ OER 获取到其祖先，并在其超类级别（即 OER 层）扩散。扩散激活的一个示例见图 6.1。\n\n“信息技术”领域增强微 OER 本体论的部分视图如图 2\
  \ 所示。具体而言，它描述了来自澳大利亚提供商 OpenLearning（[www.openlearning.com](http://www.openlearning.com)）的某个“电子商务”\
  \ OER。在本体论的最底部，用椭圆形描绘的节点通常符合微 OER 标准。在矩形节点中显示的红色整数是学习者相对于目标 OER 的偏好值。提出了 `Algorithm\
  \ 6.1` 来执行偏好传播过程。\n\n![image](img/105.jpg)\n\n归一化因子防止传播的偏好持续升级到超出合理范围的程度，这可能导致后续过程中数据处理的困难。OER\
  \ 传播偏好的置信度记录为 `CD (P[v,j])`。\n\n## 5. 分心预测\n\n#### A. 人口统计分类\n\n在第 4 章](#Chapter4.xhtml)（Sun\
  \ 等，2015 年），我们讨论了可能导致微在线学习分心的关键问题，这些问题通常来自社交和环境两个方面。\n\n此外，`MLaS` 调查现有学习者的分心程度作为参考，并感知每个学习者的分心程度作为参考。（注：此处原文中存在重复内容，已按要求保留）\n\
  \n\n\n\n其中 `d[j,Loa]` 是学习者 `L[j]` 在位置 `Lo[a]` 感受到的自我识别分心程度，通过强制请求获取。这遵循以下预期：具有相似总体情况（即社会因素）和环境（即环境因素）的学习者极高概率具有相似的分心程度，且来自同一位置的干扰水平不会发生显著变化。\n\
  \n预测干扰的置信度表示为 `CD(D[i,Loa])`。\n\n## 6.2 冷启动问题的在线计算过程\n\n### 6.2.1 推荐结果的整合 - 冷启动问题\n\
  \n#### A. 下行传播\n\n在第 5.4 节中，我们已经获得了学习者对“整个”OER（开放教育资源）而非微型 OER 的偏好，现在这些偏好值再次沿本体层次结构向下传播。因此，每个微型\
  \ OER 节点都接收来自其祖先的估计偏好值。该传播过程带有一个衰减因子。对于每个微型 OER，最终偏好值 `P[u,j]` 可以使用公式 (3) 计算。\n\n\
  ![image](img/ch6-Eq3.png)\n\n其中 `R` 是层次结构高于 `MR[u]` 的所有节点集合，`R[v]` 是节点 `MR[u]` 的直接祖先，`Q(u,v)`\
  \ 取决于 `MR[u]` 和 `R[v]` 之间的层数。\n\n![image](img/ch6-Eq4.png)\n\n且后代节点相对于 `P[u,j]`\
  \ 的置信度计算为其祖先中置信度值的平均值，并减去衰减因子 `μ`。\n\n![image](img/ch6-Eq5.png)\n\n当集合 `ML` 中三个属性（即表示偏好、即时时间可用性和分心程度）的所有值都确定后，通过\
  \ MLaaS 就能从最初稀缺的信息中完全构建出一个轻量级学习者画像。\n\n### B. 微型 OER 筛选与规则 \n\n对于每个微型 OER，一旦 MLaaS\
  \ 获取了其最终偏好值和置信度，系统将拒绝不符合置信度最低要求的节点。\n\n在生成推荐的微型 OER 列表时，学习者兴趣较高的将排在顶部。对于两个微型 OER\
  \ `MR[u]` 和 `MR[w]`，它们的顺序根据在第 4 节中讨论的提取三类关系而定义的某些启发式规则来决定。这些规则按顺序执行并具有优先权。\n\n1.\
  \ 如果这两个微型 OER 之间存在 `RequiredSequence`（强制性序列）关系，则将先决条件项放在上方（参见第 4 节）。\n2. 如果这两个 OER\
  \ 的偏好 `P[u,j], P[w,j]` 中前者高于后者，则 `MR[u]` 位于 `MR[w]` 之上。\n3. 如果从绝对角度来看，置信度 `CD(P[u,j])`\
  \ 较高而 `CD(P[w,j])` 较低，则 `MR[u]` 位于 `MR[w]` 之上。\n4. 如果这两个微型 OER 之间存在 `RecommendedSequence`（推荐序列）关系，则建议先访问的一个放在上方（参见第\
  \ 4 节）。\n5. 如果这两个候选微型 OER 之间的学科差异明显，则与学习者教育背景更相关、或属于相关学科或跨学科的微型 OER 优先考虑。\n6. 如果上述规则均不适用，则推荐的微型\
  \ OER 列表随机排序。\n\n在此，第一条规则被视为必须严格遵守的硬规则，其余规则是软规则，可以根据具体情况从教育考虑的角度进行违背。\n\n#### C.\
  \ 推荐结果的优化\n\nMLaaS 消耗值 `P` 和 `D` 并结合其 `TA`，与增强型 OER 本体元数据中注释的属性和要求进行比较。\n\n下一步是整合上述章节中描述的前述算法的结果；一个适应度函数将这些选定的多维数组（即轻量级画像中提出的特征的数值）转换为一个变量。因此，该问题在此被恰当地转换为一个多目标优化问题。\n\
  \n最终微型 OER 推荐的基本思想是：鉴于每个推荐的微型 OER 作为微型开放学习的开始，其之后应该跟随一系列微型 OER 以形成完整的学习路径，我们将其命名为学习路径中的第一个对象。因此，为了启动约束多目标优化，会随机生成候选学习路径解（染色体），其中每个染色体都是包含一系列微型\
  \ OER 的学习路径，而不是单个微型 OER。对于一个染色体，通过检查每个连续的前置/后置微型 OER 对相对于上文 6.1.2 节中列出的前 5 条规则的关系来研究其违规程度并求和。对于染色体中的此类对，其违规程度\
  \ `VD(MR^t, MR^(t+1))` 通过其对规则 2 到规则 5 的违规情况的加权和得出，其中 `MR^t` 是 `k` 中的第 `t` 个微型 OER，`MR^(t+1)`\
  \ 是第 `t+1` 个。违规程度越高，候选学习路径违反规则的情况越严重。学习路径 `k` 的违规程度使用公式 (6) 计算。\n\n```\n![image](img/ch6-Eq6.png)\n\
  ```\n\n随后，令变量 `RA[u]` 表示给定学习资源 `MR[u]` 的关注程度，其对微学习的实时可用性 `RT[u,j]` 通过与学习者 `L[j]`\
  \ 的预测分心程度比较并使用公式 (6) 计算。\n\n```\n![image](img/ch6-Eq7.png)\n```\n\n因此，对于候选学习路径 `k`，`RT[k,j]`\
  \ 表示实时可用性的和。同样，`P[k,j]` 汇总了学习者 `L[j]` 对 OER 的所有偏好。\n\n```\n![image](img/ch6-Eq8.png)\n\
  ```\n\n其中 `α, β, γ` 和 `δ` 作为每个变量的权重，建议 `α>β>γ>δ`，`P¹[k,j]` 表示学习者对路径中第一个 OER 的偏好值。\n\
  \n算法 6.3 展示了推荐的典型步骤。\n\n```\n![image](img/113.jpg)\n```\n\n启发式算法 6.3 为通过 MLaaS 开始的新颖学习体验推理出合适的微型\
  \ OER 列表。随着微学习冷启动问题解决方案的成功启动，学习者的行为将由 MLaaS 持续收集以以馈离线计算的自适应引擎。\n\n## 6.2.2 在既有学习路径中插入新的微型\
  \ OER\n\n#### A. 微型 OER 相似性计算的优化\n\n在某种程度上，在既有学习路径中插入新的微型 OER 可以被视为新项目的冷启动问题。在这里，微型\
  \ OER 之间的相似性计算对于基于项目的协同过滤方法至关重要（Airoldi 等，2012）。使用公式 (9)，该计算不仅基于它们在教育设置中的欧式距离，还增加了一个时间衰减因子（考虑兴趣的积累和衰减）以及一个惩罚项（解决过滤泡问题）。这两个算子显示在公式\
  \ (6.9) 的后乘因子中。\n\n```\n![image](img/ch6-Eq9.png)\n```\n\n\n\n\n如第 6.1 节所示，已建立的学习路径适用于特定的学习者，例如\
  \ `L[j]`，其在矩阵中的偏好值被选中。一种 `K` 最近邻域（KNN）算法能够将与新微 OER `MR[n]` 具有较高相似性的项目进行聚类。它们的邻居形成一个集合\
  \ `G` (Airoldi 等人 2012)。因此，新微 OER 的偏好预测通过以下方程 (6.10) 计算：\n\n![image](img/ch6-Eq10.png)\n\
  \n#### B. 将新微 OER 插入到已建立的学习路径中\n\n在识别出 `MR[n]` 的邻居并预测 `L[j]` 对其偏好程度后，该方法采用了爬山算法来为\
  \ `MR[n]` 定位合适的位置。新项目将根据算法 6.4 插入到已建立的学习路径中：\n\n![image](img/115.jpg)\n\n注意的是，爬山算法在对适应度的比较上执行，能够通过局部搜索有效地放弃适应度较差的学习路径并减少迭代次数。这加速了插入新微\
  \ OER 的学习路径的整体生成速度。\n\n该方法没有检查所有矩阵中的所有元素，因此其计算复杂度和运行时间对于需要快速响应的在线计算是可以接受的。\n\n##\
  \ 6.3 实时互补机制\n\n在线计算处理用户未在历史数据库中排序的短期和实时活动。除了解决“新用户”冷启动问题外，它还从项目视角持有一个“秒”级粒度的实时算法。这涉及到两个考虑因素。第一个是提高新发布微\
  \ OER 的推荐性能，特别是在学习者访问 MLaaS 的同一天。进一步采用第 6.2.2 节中介绍的方法，它可以增加新微 OER 的可发现性，即使它们在系统中没有记录任何流行度或评分数据。此此外，对微\
  \ OER 的最新操作可以更准确地揭示其推荐价值。由于在线计算应在几秒钟内做出响应，冗余的离线算法需要大幅简化，因为时间绝对不允许检查所有学习者与微 OER 的交互。\n\
  \n算法简化可以通过对学习者-微 OER 矩阵进行行扩展、列扩展或两者兼顾来实现。其主要结果是更新画像和全面的学习者模型。更新不应在在线计算侧进行全规模执行，而应具有明确目的，并突出操作的“近期性”。\n\
  \n对于列扩展，在线计算领域查询并检索特定学习者的近期微开放学习行为，即该学习者在极近期访问的微 OER 列表。然后将这些用法中微 OER 的对应名称填充到 `item`\
  \ 列中，以填补此前已进行水平扩展的学习者-微 OER 矩阵中的空白。这可以消除新旧微 OER 之间的差距，并解决微 OER 之间关联宽度无法拆分的问题。它还可以消除由于特定学习者在近期或实时未访问的旧微\
  \ OER 之间的关联而对离线计算结果产生的影响。\n\n对于行扩展，在线计算领域针对特定的微 OER，并调用实时访问它的用户列表。然后将这些访问日志中相应的用户名称填充到\
  \ `user` 行中，以填补此前已进行垂直扩展的学习者-微 OER 矩阵中的空白。然而，与行扩展相关的深度和广度变化的关联是可以被拆分的。换句话说，在线计算和离线计算可以分开进行，不存在任何数据缺口。因此，在技术上，它比列扩展更有意义。\n\
  \n## 总结\n\n当系统和用户都是新的时，MLaaS 缺乏初始信息为微开放学习带来了困难。在本章中，我们介绍了一种处理微 OER 推荐的新方法，主要关注在线计算。我们的主要贡献可以总结为：我们识别了冷启动问题，并创新性地采用区分程度作为推荐的索引。随后，提供了一种详细的方法，通过在框架环境中处理这些冷启动问题。据此构建了学习者和微\
  \ OER 的增强画像。基于第 6.2 节](#Chapter6.xhtml#sec6.2)中介绍的工作，通过算法 6.4 提出了插入微 OER 的解决方案。该算法通过爬山法进行了增强。\n\
  \n最后，第 6.3 节](#Chapter6.xhtml#sec6.3)中介绍的方法旨在保持学习者模型的更新，并实现秒级的响应。\n\n# 第 7 章\n\n\
  ## 实现与实验评估\n\n由于 MLaaS 的设计和计算过程在前面的章节中已有介绍，在第 7 章中，我们将介绍本研究的实现与实验评估。首先，我们将在第 7.1\
  \ 节](#Chapter7.xhtml#sec7.1)介绍 MLaaS 的拓扑和工作原理。之后，我们将在第 7.2 节](#Chapter7.xhtml#sec7.2)评估计算过程的性能。首先执行冷启动算法以确定理想的\
  \ Top N 推荐，选取优化启发式算法作为核心算法。所选算法将与文献中建立推荐器进行比较。\n\n## 7.1 系统实现\n\n### 7.1.1 系统拓扑\n\
  \nMLaaS 的拓扑如图 7.1](#Chapter7.xhtml#ch7-fig1) 所示。作为一个数据丰富的系统，MLaaS 能够利用详细的学习活动数据不仅推荐特定学生的下一个微学习活动，还可以预测该学生在该内容上的表现。\n\
  \n在我们团队的一项试点工作中 (Sun & Shen, 2013)，我们提出了面向服务的背景的资源共享和存储的点对云和点对点模型。与传统的云模型、用户模型或点对服务器模型相比，此类模型具有更高的上传和下载速度，并且对云环境中的节点或服务器故障更具鲁棒性\
  \ (Sun & Shen, 2013; Shen 等人, 2011)。因此，我们采用了这种设计并将其概念作为新系统的拓扑。\n\n![image](img/ch7-fig1.jpg)\n\
  \n图 7.1. MLaaS 架构拓扑\n\n\n\n\n所提系统的 P2P 子网络符合开放式学习的本质，在这种模式下，各种 P2P 学习频繁且随机地发生。该\
  \ P2P 层保证了 P2P 学习可以立即组织，并且原始资源可以立即进行共享和交换，无论是否访问云端。\n\n从顶层视角来看，MLaaS 借用云服务来最大化托管能力。系统的云部分由四个领域组成：数据跟踪、数据收集、数据处理和数据存储。\n\
  \nMLaaS 云端模块的功能已在第 3 章中概述（Sun 等，2015；Sun 等，2015）。我们增加了一个管理服务（Administration Service），用于从学习者和提供者两方面监督\
  \ MLaaS 的日常常规运行。该系统的一个显著特征是有三个文件传输通道：\n\n• 学习者与云存储部分由导师创建的 OER（开放教育资源）池之间的通道（即图\
  \ 7.1 中的 `Channel A`）。\n\n• 学习者与云存储部分由学习者生成的 OER 池之间的通道（即图 7.1 中的 `Channel B`）。\n\
  \n• 所有参与开放式学习的学习者之间的通道（即图 7.1 中的 `Channel C`）。\n\n一旦学习者表示其有进行微学习的意愿并从移动设备发送此类请求，OER\
  \ 将通过这三个通道之一进行传输。\n\nOER 实际上源自云资源池（即从哪些具体的云节点检索和调用 OER）将由主流服务提供者的第三方服务选择和资源分配服务进行定义并提供外部支持。这个问题已经经过了充分的研究；典型的解决方案可以在\
  \ Wang 和 Shen (2016) 报告的工作中找到。\n\nMLaaS 的架构和技术细节可以参考第 3 章和第 6 章。值得注意的是，MLaaS 只产生微\
  \ OER（micro OERs），而不是普通的 OER。也就是说，在线的普通 OER 由 MLaaS 收集并聚类在 OER 池中，如图图 7.1 所示。因此，尽管\
  \ MLaaS 拥有自己的数据收集机制，但它与 OER 来源平台或提供者共享一些人口统计和教育数据。这有助于学习者画像（learner profiling），这在第\
  \ 5 章中介绍，即使 MLaaS 中新学习者的注册是非正式的，且没有足够的人口统计和教育数据（如第 6 章中介绍）。\n\n### 7.1.2 MLaaS 自适应引擎的工作原理与运行环境\n\
  \n位于离线计算领域的自适应引擎的工作原理以序图的形式所示，即图 7.2。\n\n值得注意的是，可能需要合并从在线和离线计算获得的推荐结果。由于我们采用了 `Top-N`\
  \ 推荐，因此来自双方的推荐将按比例显示在推荐列表中。\n\n为了应对第 3.1.3 节中提出的想法，理想情况下为 PLE（个人化学习环境）的运行配置云环境，即\
  \ TaaS 和 MLaaS 的结合。TaaS 已经通过程序化开发并部署在著名的亚马逊 Web 服务（`AWS`）云基础设施上。如第 3.5 节 前述，MLaaS\
  \ 天生是服务化的。值得注意的是，MLaaS 只产生微 OER，而不是普通的 OER。也就是说，在线可用的普通 OER 由 MLaaS 收集并聚类在 OER 池中，如图图\
  \ 7.1 所示。因此，尽管 MLaaS 拥有自己的数据收集机制，但它与 OER 来源平台或提供者共享一些人口统计和教育数据。这有助于学习者画像，这在第 5 章中介绍，即使\
  \ MLaaS 中新学习者的注册是非正式的，且没有足够的人口统计和教育数据（如第 6 章中介绍）。\n\n（注：此处后续段落包含大量占位符或乱码文本，根据指令要求按翻译逻辑处理）\n\
  \n图 7.2 自适应引擎的工作原理\n\n技术上，云托管部分由亚马逊弹性计算 (`EC2`) 接管，其中亚马逊块存储 (`EBS`) 共同工作，以满足 CPU、内存和存储的需求。同时，自动伸缩\
  \ (`Auto Scaling`) 和负载均衡 (`Elastic Load Balancing`) 服务与 `EC2` 工作，以调整流量。\n\nMLaaS\
  \ 处理的信息与实时数据（即来自历史和实时侧）相结合，以应对 OER 生产和学习者行为。`Amazon S3` 将用作数据存储，因为其具有健性和成熟的灾难恢复机制。考虑到微开放学习的内部个性化学习者模型，建议使用亚马逊关系数据库服务以便在数据提取和推理方面的可扩展能力。最后，MLaaS\
  \ 的 P2P 层使用亚马逊 Mobile Hub 服务进行映射，允许学习者创建个性化链接并通过通道 C 发送给同行。\n\n## 7.2 实证评估\n\n首先，我们介绍在本文讨论的方法中使用的数据集。注意，几乎没有使用学习时长作为评分的电子学习，由于领域差异，实验数据无法直接借用现有数据集，例如\
  \ `MovieLens`。结果，从三个主要的 MOOC 提供者处爬了 3055 个课程样本。由于我们是首批将微学习概念引入 MOOC 学习的实践者，这些课程样本通常不是微模式。我们没有在技术上将超过\
  \ 15 分钟的课程样本切分为更小的片段，而是为每个片段标记了和结束时间。例如，来自澳大利亚提供者 OpenLearning 的“电子商务”OER，“供应链管理”课程视频原始长度为\
  \ 38 分钟。我们没有在技术上将其裁剪成三块，而是生成的三个虚拟 OER 在其相应的 `MicroOERProfile` 集中附了三个顺序标签，并分别带有‘1-15\
  \ min’、‘16-25 min’和‘26-38 min’的时间标记。经过逻辑分割后，轨迹微 OER 集的最终大小为 11407。\n\n\n\n\n\n随机生成了\
  \ 1400 个用户配置文件，符合正态分布律。其人口统计数据部分已完全填充。大多数用户关于微型开放资源（micro OER）的行为数据留为空，而少数用户在轻量化配置的动态部分设置了初始值，作为种子数据。\n\
  \n接下来，对于第 6.1.5 节 B 小节中的权重，`W[l]`设置为 0.8，`W[i.j]`设置为 0.2；对于第 6.2.1 节 C 小节中的权重，`α`、`β`、`γ`\
  \ 和 `δ` 分别设置为 0.4、0.3、0.15 和 0.15。\n\n研究人员使用 MovieLens 数据集研究了二分类器 C4.5 决策树和朴素贝斯分类器的性能，其中\
  \ C4.5 生成的结果具有更好的平均绝对误差（MAE）或均方根误差（RMSE）(Lika 等人，2014; Sieg 等人，2010)。因此，我们在算法 2\
  \ 中采用了 C4.5。第 6 章中所示的人口统计分类评估是基于经典的 k 折交叉验证方法进行的。\n\n### 7.2.1 实验研究 1 - 冷启动启发式推荐的评估\n\
  \n在 e/m 学习领域，高 MAE 和 RMSE 值并不等同于高用户满意度。在 Top-N 推荐中，建议使用精确率（Precision）和召回率（Recall）作为评估指标，因为它们更以用户为中心。\n\
  \n为了获得模拟集中相关微 OER 的规模，执行了四次启发式算法\n\n1. 第一次执行精确的 `Algorithm 6.3`；生成 Top N 推荐列表。\n\
  2. 第二次执行精确的 `Algorithm 6.3`；生成 Top N+2 推荐列表。\n3. 第三次从 `Algorithm 6.3` 的适应度函数中移除偏好特征；生成\
  \ Top N+2 推荐列表。\n4. 第四次在算法操作中不考虑干扰特征；生成 Top N+2 推荐列表。\n\n我们将第一次算法操作获得的结果作为精确推荐项目。由于其余算法操作返回的解集比第一次大，因此后三个\
  \ Top N+2 列表的并集被视为相关微 OER 集。\n\n#### 表 7.1 召回率和精确率定义\n\n| | 相关 | 不相关 |\n| --- |\
  \ --- | --- |\n| **已推荐** | 真正性 (TP) | 假正性 (FP) |\n| **未推荐** | 假阴性 (FN) | 真负性 (TN)\
  \ |\n\n**召回率。** 召回率值定义为 MLaaS 推荐的相关微 OER 与所有相关微 OER 的比例，其中：\n\n![image](img/ch7-Eq1.png)\n\
  \n**精确率。** 精确率是推荐的项目中与给定上下文相关的项目比例，其中：\n\n![image](img/ch7-Eq2.png)\n![image](img/ch7-fig3.jpg)\n\
  \n图 7.3. 启发式算法生成的 Top N 推荐召回率值\n\n对于 `Algorithm 6.3` 中提出的启发式算法，选择了四种启发式算法，即遗传算法（GA）、模拟退火（SA）、禁忌搜索（TS）和进化编程（EP）进行计算。在\
  \ Top-N 推荐中，列表中显示的不同推荐数量可能会导致不同的性能。我们还研究了 `N` 的值对推荐性能的影响。我们将 `N` 设置为 1、3、5，此后每隔\
  \ 5 取一个数，直到 50。实验结果如图 7.3 和图 7.4。\n\n如图 7.3 和 7.4 所示，每种启发式算法在冷启动条件下都提供了可接受的召回率和精确率结果。几乎所有算法在\
  \ 250 次迭代后都收敛，这在合理的范围内。值得注意的是，当 `N` 设置大于 15 时，召回率值没有急剧增加。GA 获得了最高的召回率值，而其他都在 35%\
  \ 到 45% 之间，没有产生产生重大差异。\n\n如图 7.4 所示，尽管 EP 在比较开始时表现最好，但当 `N` 设置大于 15 时，它的性能大幅下降。\n\
  \nGA 可以作为一个替代方案，因为它显示出更稳定的性能。将两个指标相结合，GA 整体上具有更好的召回率-精确率值。然而可以认为，如果学习者倾向于简洁的推荐列表，EP\
  \ 值得作为核心算法考虑。回到微学习场景，召回率和精确率值越高越好。简之，较高的召回率值让学习者能够根据给定上下文浏览更广泛的微 OER (Lu 等人，2015)。然而，在微\
  \ OER 推荐中，糟糕的精确率会降低用户满意度，因为如果学习者第一次没有得到想要的资源，他们可能会选择关闭。因此，当这两个指标无法同时满足时，建议精确率具有更高的优先级\
  \ (Sikka，2016)。因此可以得出一个观点：在设置列表时，候选数量建议不要 15。请注意，在图 7.3 和 7.4 中，GA、SA、TS 和 EP 分别是遗传算法、模拟退火、禁忌搜索和进化编程的缩写。\n\
  \n![image](img/ch7-fig4.jpg)\n\n图 7.4. 启发式算法生成的 Top N 精确率值\n\n# 7.2.2 实验研究 2 - 与推荐器的器的\n\
  \n在这一部分，我们将由 EP 和 GA 赋能的 MLaaS 方法与其他广泛使用的推荐器进行性能比较。\n\n基于用户的推荐器通过以下公式预测用户评分（偏好）：\n\
  \n![image](img/ch7-Eq3.png)\n\n其中：\n\n![image](img/ch7-Eq4.png)\n\n基于物品的推荐器也根据以下构建：\n\
  \n![image](img/ch7-Eq5.png)\n\n其中\n\n![image](img/ch7-Eq6.png)\n\n此外，我们还应用了经典的相似性测量模型\
  \ NHSM (Liu 等人，2014) 和 ACOS (Ahn，2008)。\n\n这些推荐器生成了 Top N 推荐。受实验 1 的启发，我们将 `N` 设置为从\
  \ 1 到 20 的连续整数，这略超过了潜在阈值 15。以 `N` 为 x 轴，比较结果如图 7.5 和 7.6。请注意，GA 和 EP 代表遗传算法和进化编程。\n\
  \n![image](img/ch7-fig5.jpg)\n\n图 7.5. 不同推荐器的 Top N 结果精确率值\n\n\n\n\n\n从图 7.5 可以发现，尽管当\
  \ `N` 大于 18 时，ACOS 在精确率值方面产生了更好的推荐，但其初始推荐质量较差。实验表明作者的发现是正确的：采用 NHSM 可以显著提高基于用户和基于物品的推荐器的性能（Liu\
  \ 等人，2014）。然而，无论 `N` 的大小如何，基于 GA 和 EP 的 MLaaS 方法整体上可以产生比 NHSM 精确率更高的结果（N≥20`）。\n\
  \n![image](img/ch7-fig6.jpg)\n\n图 7.6. 不同推荐器的 Top N 结果召回率值\n\n如前，通常在判断微 OER 推荐的质量时，精确率（Precision）值优于召回率（Recall）值。如果我们观察这些所选推荐器产生的召回率值（图\
  \ 7.6），NHSM 在 `N` 小于 5 时产生最佳结果，随后低于基于 GA 和基于 EP 的 MLaaS 方法，且随着 `N` 值的增加，各自的差异都在扩大。此外，尽管\
  \ ACOS 是唯一一个召回率和精确率值均上升的推荐器，但其上升曲线在 `N=20` 之前低于 NHSM。值得注意的是，在潜在阈值（即 `N=15`）处，其他推荐器从所有候选对象中检索相关微\
  \ OER 的性能无法与基于 GA 和基于 EP 的 MLaaS 方法竞争。因此，结合精确率和召回率值，并考虑到实验 1 中的发现，最终的胜者仍然是基于 GA\
  \ 或基于 EP 的方法。具体而言，算法的选择取决于推荐的具体需求。通常，GA 是一个更稳定的选择，而 EP 在准确性方面具有优势。\n\n总之，所提出的 MLaaS\
  \ 在线计算对于处理微 OER 推荐中的新用户冷启动问题是行的，因为它可以通过产生具有可召回率和精确率值的最佳结果。一些广泛使用的推荐器没有考虑学习干扰，导致它们在仅考虑用户评分时，在冷启动时的响应质量较低。在所有使用的启发式算法中，EP\
  \ 和 GA 脱颖而出，推荐列表的建议大小为 15。\n\n## 7.2.3. 学习路径评估\n\n为了证明所提出的针对新项目冷启动问题的有效性，在本节中我们评估了插入新发布微\
  \ OER 后生成的学习路径的质量。我们借鉴了 10 折交叉的概念，将相关领域的微 OER 分为两个部分，比例为 1:9。学习路径是在九十分之一的微 OER 中生成的。对于每条学习路径，从剩余部分中选择一个微\
  \ OER 并在实验中将其视为新发布的微 OER。执行 `Algorithm 6.4` 以为每个新成员在主体中找到一个位置。图 7.7 给出了使用 MLaaS\
  \ 方法生成的插入了新微 OER 的学习路径的违规程度（即 第 6.2.1 节 中定义的 `VD`），并与使用最短路径方法（Alian and Jabri, 2009）和基于能力的方法（Hsu\
  \ and Li, 2015）生成的学习路径进行对比。\n\n总共，信息技术领域选取了 3674 个微 OER，业务领域 4479 个微 OER，社会科学领域\
  \ 3254 个微 OER 作为候选对象；其中分别选取了 366、448 和 325 个作为测试项目。执行 `Algorithm 6.4` 后，信息技术领域输出了\
  \ 2044 条新学习路径，而业务和社会科学领域的数字分别为 3746 和 2329。这是因为为一个或多个微 OER 找到了位置；或者根据 `Algorithm\
  \ 6.4`，当存在 `RecommendedSequence` 关系时，会生成两条新的学习路径。同样执行了最短路径 (SP) 和基于能力 (C-based)\
  \ 方法，将新发布的微 OER 放入已建立学习路径的项目之间或并行位置。实际上，SP 和基于能力的方法的工作原理不是在建立的学习路径内为新发布的微 OER 寻找位置，而是彻底重建一条新的学习路径。\n\
  \n根据图 7.7，按三个学科比较了三种方法分别生成的学习路径的平均违规程度。可以发现，MLaaS 方法整体上优于 SP 和基于能力的方法，因为 MLaaS 生成的学习路径在每个学科中的平均\
  \ `VD` 远小于其他方法。此外，当存在许多松散关联的微 OER（即具有弱序 `RecommendedSequence`）时，SP 方法很难识别出一条合理的学习路径。\n\
  \n![image](img/ch7-fig7.jpg)\n\n图 7.7. 三种方法的性能对比 – 所有生成的学习路径的平均违规程度\n\n随后，我们评估了\
  \ MLaaS、SP 和基于能力方法产生的最佳解决方案。其中，一个测试微 OER 仅允许参与一条学习路径；对于每个测试对象，选择 `VD` 值最低的新学习路径。这样做是为了消除由于先/后微\
  \ OER 对之间松散耦合可能带来的潜在影响。在这种情况下，被指定的学习路径数量恰等于测试微 OER 的数量，分别为 366、448 和 325 个。\n\n\
  图 7.8 中的结果显示了相同的观察：MLaaS 方法超过了其他两种方法，因为它找到了更好的位置来插入新发布的微 OER，同时违反规则的次数（如 第 6.2.1\
  \ 节 B 小节所述）更少。值得注意的是，信息技术学科的平均违规差异明显更大。这可能是因为该领域的学习路径相对较长。换句话说，一个完整信息技术知识领域的个人学习路径包含的微\
  \ OER 比业务和社会科学字段的更多。此外，三种方法在业务领域都产生了违规程度更高的学习路径。这可能归因于业务领域经常发现微 OER 有其他 OER 作为知识先决条件，且一个微\
  \ OER 与其他多个密切相关。\n\n![image](img/ch7-fig8.jpg)\n\n图 7.8. 三种方法的性能对比 – 每个测试 OER 最佳学习路径的平均违规程度\n\
  \n## 总结\n\n在本章介绍了算法的系统实现和实验评估。在第 7.1 节中，我们展示了该系统的拓扑结构，该系统采用了点对云对点的结构以方便文件传输。结合离线计算领域的服务，自适应引擎（Adaptive\
  \ Engine）决定将自适应微 OER 分配给学习者。其工作原理在图 7.2 的流程图中所示。\n\n第 7.2 节展示了我们提出的针对新用户和新项目冷启动问题的方法的实验评估。结果表明，建议采用\
  \ GA 和 EP 作为新学习者冷启动问题计算的核心算法。这两种启发式算法都能提高一些成熟推荐器的性能。此外，证明了 `Algorithm 6.4` 能够在建立的学习路径中为新发布的微\
  \ OER 找到更合适的位置。\n\n\n\n\n\n通过移动设备获取学习资源已逐渐变得普遍。作为一种全新的形式，移动学习（m-learning）的出现提升了远程教育中学习资源交付的传统方式，而移动中学习为学习者和学习资源提供者在这一新学习语境下带来了严峻挑战。值得注意的是，即使是移动学习本身也在逐年演进，而学习行为也随着空间时间的变化而异。在这些变化中，与传统移动学习的一个明显区别是，每个学习活动的平均长度变得碎片化了。换句话说，越来越多的学习活动是在较短的时间内完成，通常少于\
  \ 15 分钟。\n\n在开放学习趋势的基础上，开放教育资源（OER）的交付被认为是一种新颖且有效的方法，引发了传统学习方式的变革。OER 是“在线免费开放地向教师、教育工作者、学生和独立学习者提供的数字学习资源，以便在教学、学习和研究中使用、共享、组合、适配和扩展。”（Hylen\
  \ et al., 2012）。OER 提供者和教师已利用移动设备让学习者能够轻松参与学习活动，不受时间和地点的限制。然而，随着微学习的演进，带有一系列微交互的微内容交付使用户能够不受信息过载的影响而进行学习（Guo\
  \ et al., 2015）。\n\n有效的微内容交付是确保学习者脑中内容认知留存方面获得良好学习结果的关键技术。传统的教学方法和大纲显然需要高水平的适配，以适用于这种完全新的教育环境。\n\
  \n## 8.1.2 移动学习\n\n在书中，我们介绍了一项关于在移动环境中促进微开放学习的研究。这种方法旨在以微学习资源的形式提供自适应 OER，这些资源是经过定制的碎片化片段，旨在满足短时间内移动环境下的学习需求。\n\
  \n这项研究始于全面的文献综述，跨越了信息技术、教育学和社会科学领域。这项工作在第 2 章中介绍。由于已被采用多年，远程教育的特征及其发展在第 2.1 节中进行了讨论。移动设备的广泛使用使得移动学习成为远程教育的一种主要模式，其新形态——即微学习，在近年来迅速流行。它们的特征也在该节中进行了介绍。开放学习及其形态、教学设计和优势在第\
  \ 2.2 节中得到了研究，并触及了在 OER 交付中采用服务的架构的可行性。因此，本书在第 2.3 节中发现了微学习与开放学习结合的影响和优势。为了实现自适应微\
  \ OER 交付，涉及多种学习技术和研究方法，这些在第 2.4 节中展开。书中阐述了学习者建模、教育数据挖掘与分析以及教育大理论背景和现有研究。\n\n受文献综述得出的问题的启发，第\
  \ 3 章重点关注如何设计研究以改进微开放学习语境并为学习者提供更好的学习体验，以获得更好的结果。设计从研究背景的识别和前期工作的介绍开始，这些可以在第 3.1\
  \ 节中找到。我们的试点研究激励我们通过引入自适应微学习概念来促进当前的 OER 交付形式。同时，在微 OER 适配的首次决策过程中，我们有动力组织了一次在线计算，旨在解决著名的冷启动问题。这在第\
  \ 3.2 节中进行了说明。因此，微 OER 交付、在线计算方面的研究挑战在文中进行了总结。在第 3.4 节中阐述了如何应对这些挑战，并介绍了自适应微 OER\
  \ 交付的预期。随后，我们在第 3.5 节中提出了 MLaS 系统框架。\n\n一个全面的学习者模型在第 4 章中进行了概念性构建。它包含来自内部和外部领域的因素。根据与学习者认知水平的相关性，认知因素和非认知因素在内部领域被提取。一个组件可以属于多个领域，不同的组件可以关联，这种情况在图\
  \ 4.1 所示。从学习内容的角度来看，根据开放学习提供者的可用性，有微 OER 和非微 OER。这两类 OER 都经过分类和定制，并建立了一种机制来衡量其功能性和非功能属性。开放学习内容分析的细节可以在第\
  \ 4.2 节中找到。\n\n第 5 章侧重于语义知识库的构建，它是离线计算中自适应引擎执行过程的基础。知识库构建在双层结构上，顶部是模式层，底部是数据层。针对微\
  \ OER 和微学习内容的两个增强本体分别在模式层基于概念图被确定。随后，在数据层设计了数据处理策略，其中提出了一种基于`EDM`和`LA`的方法来理解微学习中的模式和规则。在同一节（即第\
  \ 5.2.3 节）中，还从校园和开放学习的角度演示了数据源。\n\n在第 6 章中，本书构建了一种在线计算，用于应对微开放学习初期的数据稀疏问题以及学习者模型的实时更新。最重要的是，它包含解决由学习者信息短缺和新发布的微\
  \ OER 导致的微 OER 推荐冷启动问题的解决方案。建立了一个轻量级学习者-微 OER 画像，涉及学习者偏好传播、干扰预测和即时可用性识别，而基于启发式算法的方法为新学习者冷启动问题产生了优化的计算建议。此外，还介绍了另一种由`Hill\
  \ Climbing`增强的启发式算法，用于在新发布的微 OER 在现有学习路径中寻找位置。在第 6.3 节中，引入了实时互补机制以保持全面学习者模型的最新，并对第二粒度的学习者做出响应。\n\
  \n\n\n\n\n第 7 章包含了算法系统实现和实证评估。系统的拓扑结构借鉴了“点对云对点”（peer-to-cloud-peer）的思想，在学习者之间组织了一层\
  \ p2p 网络。它的优点是资源传输可以以更简单、快速的方式组织。自适应引擎的工作原理在第 7.1.2 节所示。工作流通过离线计算领域少数服务之间的协作实现。在第\
  \ 7.2 节中进行了实验，以识别性能更优的启发式算法；并将选算法 GA 和 EA 与文献中模拟的成熟推荐系统进行了比较。\n\n# 8.2 未来工作建议\n\n\
  ## 跨学习问题\n对于正在进行的微学习（即学生从各种来源学习碎片化内容），必须认真考虑来自数百个开放教育资源（OER）提供者的本体对齐问题，因为它们之间没有通用的语义标准。经常观察到，学习者会在不同机构提供的\
  \ OER 之间反复切换。这些 OER 可能提供相同的主题，但以不同的方式和不同的教学法进行交付。因此，学习者可以自由选择内容并以不同的方式组合这些内容以实现他们所需的结果。此外，一些\
  \ OER 学习者并没有获取特定知识的具体目标；他们仅仅是为了获得学分而完成整门课程。他们可能需要参与由不同 OER 提供者提供的某些课程单元。因此，一种新机制对于支持跨机构学习至关重要。随后，不同提供者之间出现了\
  \ OER 交换和重用的实践，引发了本体互操作性问题。虽然存在许多电子学习元数据标准和用户定义的元数据，但它们缺乏正式语义。语义网技术为组织提供了本体，可以将学习资源语义化标注为学习对象，以便他人共享和重用。不同的本体可以使用不同的电子学习元数据描述相同或相似的学习对象集。分散在异构学习资源系统中的相关学习对象在其他课程件中仍然难以被发现和重用。\n\
  \n鉴于利用第 6 章中提出的冷启动解决方案成功激活了自适应微开放学习，学习者在学习路径中可能遇到的第二个问题就是跨学习问题。跨机构本体的互操作性必须提高。\n\
  \n预计所有微 OER 块都将通过本体标注为学习对象。这些本体包含在构建语义学习者模型和学习资源画像过程中新建立的本体，以及从 OER 提供者提取的使用不同元数据标准的现有本体。所有本体将放在在一个池中，并将开发一种语义本体映射方法来处理语义和结构异构性。还将提出新技术来检测两种冲突。还将提出一种桥接本体作为生成映射规则的核心，以协调\
  \ OER 本体池中定义的术语与各种 OER 同意的目标本体中定义的术语。\n\n## 系统原型\n我们未来的研究将集中在对澳大利亚大学数据仓库中识别出的数据源执行数据挖掘（EDM）和学习分析（LA）。将选择并评估基于机器学习的方法来训练数据，以生成语义构建的学习者模型，该模型如第\
  \ 4 章所示。该模型将存储在离线领域并结合离线和在线领域进行更新。\n\n我们还将致力于规则发现，并将其结果与学习者模型相结合。这些发现将作为输入提供自适应引擎，以便在离线计算中推断学习者画像。相应的开发可行的人工智能解决方案以实现最终目标，即将学习者的需求与最合适的学习资源相匹配。此外，将采用计算智能方法来优化学习者学习路径的确定。\n\
  \n系统将如第 7 章所示，通过程序化原型部署在 Amazon Web Service 上。\n\n## 案例研究设计\n目前，除了测试或考试外，缺乏有效的方法来评估学习者从开放学习中实际取得了什么和取得了多少，因此需要定量研究来定期调查他们对学习过程和进展的满意度。\n\
  \n即将进行的案例研究的关键问题是评估“学习者是否可以通过微学习方式享受微开放学习”以及“微学习如何影响学习者的知识获取”。为了回答这些问题，我们将通过试点研究测试我们的系统，并按照表\
  \ 8.1 列出以下假设。\n\n### 表 8.1 关于微学习体验和知识获取的假设\n\n| 假设 | 描述 |\n| :--- | :--- |\n| H1\
  \ | 通过访问小型定制化学习资源单元参与开放学习活动，对学习者吸收和内化特定知识有积极影响，同时避免获得干扰信息 |\n| H2 | 视觉信息形式的微 OER\
  \ 更容易让学习者在短时间内记忆或内化。 |\n| H3 | 个性化定制的自适应学习资源有助于学习者进行有效的时间管理，有助于完成整门课程的学习要求。 |\n\
  | H4 | 无意获得课程学分的学习者对微学习体验的满意度比一小时的的学习更高。 |\n| H5 | 具有具体时间限制的微学习内容更有于学习者获取针对性知识。一次未完成一个课程单元会导致信息缺失。\
  \ |\n| H6 | 简单类型的课程评估（如测验、多选题等）建议在微学习单元中完成，这可以为学习者及时提供复习和知识回顾，从而帮助其深记在记忆中。 |\n\n\
  \n\n\n\n- 学习过程应以学习者为中心，以他们的经验为基础，并鼓励独立和批判性思维（Hannafin et al., 2013）；\n- 学习提供应具有灵活性，使学习者能够越来越多地选择他们学习的地点、时间、内容和方式，以及学习的快慢；\n\
  - 应认可先前的学习、先前的经验和已证明的能力，以确保学习者不会因为缺乏适当的资质而被不必要地限制教育机会；\n- 学习者应该能够从不同的学习背景中加载进度或积累学分；\n\
  - 提供者应该为学习者获得公平的机会创造条件。\n\n开放学习中使用的资源从完整课程、课程材料、模块、教科书、流媒体视频、测试、软件以及任何其他支持知识的工具、材料或技术（Atkins\
  \ et al., 2007）。从形式上说，开放教育资源（OERs）是“向教师、教育工作者、学生和独立学习者免费开放提供的数字学习资源，以便在教学、学习和研究中使用的、共享、组合、调整和扩展”（Hilton,\
  \ 2016）。研究人员总结认为，OER 的发展符合“5R”原则，其中，“保留”（Retain）指的是“制作并拥有副本”，“重用”（Reuse）表示“以广泛的方式使用”，“修订”（Revise）代表“调整、修改和改进”的，“重混”（Remix）等于“组合两个或更多”，而“分发”（Redistribute）则强调了“与他人分享”（Thearoungchaisri,\
  \ 2016）。\n\n以下问题是导致开放学习（或者说 OER 的利用）快速发展和广泛接受的主要原因。\n\n- **成本**：在电子/移动学习甚至传统的校园学习中，成本问题（例如教科书费用）始终是用户/客户方的首要考虑，这些客户可能是学习者或教育提供者。这个问题在发展中国家表现得更为显著（Lesko,\
  \ 2013）。\n- **许可**：教科书、期刊和其他教育对象的版权限制阻止了教育工作者以最符合学生需求的方式组合材料。这也降低了不同机构之间分解和重构学习资源的可行性。\n\
  - **本地支持**：尽管 OER 是完全国际化的，但仍有本地支持的需求。Chae 和 Jenkins (2015) 根据参与者的意见总结道，他们对校园内有一个本地\
  \ OER 服务部门，以及拥有一位精通寻找、利用、设计和定制 OER 的随时可用的人感到非常高兴。这些专家可以帮助入职教学设计师、教师和其他开放学习的其他利益相关者熟悉\
  \ OER 的类似操作，从而促进 OER 在学习和教学中的应用。\n\n# 索引\n\n15 分钟时长，19, 49, 59, 76, 121, 133\n\n\
