    # 3.4.1 Research Purpose


    To address the challenges raised in the [Section 3.3](#Chapter3.xhtml#sec3.3),
    as well as to investigate potential research opportunities in this novel variety
    of m-learning and open learning, in this research we target on to promote online
    course learners’ personalized learning experiences, and how to make their micro
    learning more effective and efficient in micro-contexts. The anticipated outcomes
    of our research are concluded as follows:


    • A framework of a smart cloud-based system which aims to provide adaptive micro
    OERs as well as learning path identifications customized for each individual learner.

    • A comprehensive learner model that allows the system to consider individual
    learning styles, learner’s contexts, application capabilities, and teaching materials
    structure, leading to a customization of the type and delivery format of learning
    information in response to the user.

    • A knowledge base that fills the gap of formal OER structuring, description,
    and inference.

    • A solution for organizing online computation in MLaaS and a heuristic approach
    for addressing cold start problem in the recommendation of micro OERs.


    # 3.4.2 Scenario Example of Micro OER Delivery


    In a typical working scenario of our proposed adaptive micro learning framework,
    the system tailors each course chunk and makes it fit a specific time scale. Supposedly,
    while learners are conducting open learning using fragmented pieces of time. In
    this case, learners will be able to use each time piece to go through a chunk
    completely, neither with any unexpected pause or break-down, nor leaving any unfinished
    part to next available time.


    To better understand the micro OER delivery process, we conclude the contents
    from the previous sections in this chapter and take the following typical scenarios
    and the activities involved in each as example:


    • It is 9am at morning and Jack is travelling to work by train. He utilizes the
    20-minute journey to improve himself by taking an online course of ‘business management’
    offered by a well-known open learning provider, edX. His mobile phone is empowered
    by a 4G network. He is in a full carriage, surrounded by passengers who are chatting.
    MLaaS makes him reviewing a 5-page lecture notes followed by a multiple-choices
    with 20 questions in regards to the content in the lecture notes.

    • An undergraduate student Michael, who is enrolled in an Asian university, manages
    to extend his knowledge regarding the ‘business intelligence’ for which he takes
    a subject with the same topic this semester. He links to a free Wi-Fi provided
    by a shopping centre and turns on the MLaaS app while he is waiting for a friend.
    MLaaS direct him to a reading list posted by a leading US university and suggests
    him a specific article which contains several typical successful cases of business
    intelligence application.

    • At a short coffee-break of a session, Roger is trying to make up few points
    in his presentation content before delivering it. This presentation is about the
    future trend of eBusiness in Australia and he did a deep research on the topic
    of ‘supply chain management’ when he was preparing the presentation in the recent
    few days. Based on his learning history and progress, the system recommends him
    a partial section of a lecture video, with a focus on definition and concept of
    ‘supply chain management’ and a time length of 9 minutes, from the ‘eBusiness’
    courseware available from an Australia open learning platform.

    • A retired elder Duncan wants to know more about the Italian history. He picks
    up his basic smart phone, say iPhone 4, while he is waiting for the ticking from
    the oven timer. MLaaS delivers him an audio of a brief introduction of ‘Renaissance’
    and several photos of famous paintings and sculptures along with their audio commentary
    from the museum where they are kept.

    • A Japanese full-time staff is pursuing a degree of ‘electronic engineering’
    online in the purpose of further promotion in his career. He collects credits
    from universities involved in Coursera. MLaaS jointly suggests him courses taught
    in English and Japanese. While he is logging into MLaaS using a tablet, he is
    introduced into a demo laboratory practice of ‘signal processing’.


    From the learners’ perspective, by leveraging MLaaS, the most important benefit
    for them is that they are given sufficient opportunities to make use of fragmented
    pieces of time to achieve learning outcomes. Also, in the view of usefulness and
    ease of use of MLaaS, they can have their preferred OERs delivered instantly and
    accurately, which are expected to operate easily and run smoothly over mobile
    devices. An ideal micro OER delivered is easy to go through, neither too long
    to be with any unexpected pause or break-down, nor too short to leave any unfinished
    part to next available time.


    # 3.5 System Framework


    As stated in the Section 3.1.4, a PLE over a cloud has been organized according
    to the adaptive micro learning requirements, where MLaaS serves as a master service
    to search and find all available OERs and its associated services, and then it
    uses online and offline computation components to jointly make the decision of
    learning resource delivery (Sun et al., 2015; Sun et al., 2017). It aims to deliver
    learners adaptive micro learning resources in terms of their time availabilities
    by taking into account the specialties of the micro learning environment as well
    as the learners’ ‘highly-mobile’ learning behaviours. MLaaS’s framework has been
    well designed in terms of a genuine cloud standard, and its user model has been
    theoretically constructed by investigating comprehensive pedagogical literature
    and successful e-learning cases. The architecture of online and offline computation
    is shown in [Fig. 3.2](#Chapter3.xhtml#ch3-fig2).


    ![image](images/ch3-fig2.jpg)


    Figure 3.2. Architecture of Online and Offline Computation in MLaaS


    # 3.5.1 Offline Computation


    ## A. Computational Services


    The Learner Modelling Service aims to build a specific model for each learner,
    on the basis of his/her historical information and ongoing learning behaviour.
    Learners’ basic information about learning styles, preference and learning purposes
    is gathered from the Historical Learner Information Gathering Web service in the
    PLE. Based on these data collections, this service assesses the pre-knowledge
    level for each learner and marks up these features by a set of measurable variables.
    It is also provided with a function, which tracks learners’ behaviours during
    micro learning process and ensures their models being kept up-to-date once new
    data are detected or generated.


    The Learning Resource Representation Service stores all representations of the
    available micro learning resources. It extracts resource modules from well-developed
    OERs (e.g. MOOC courses). Based on their time lengths, they are categorized into
    micro learning resources (less than 15 minutes) and non-micro learning resources.
    Referring to the results of EDM and LA, these longer course modules are cut off
    programmatically and encapsulated into small units with reasonable time lengths.
    As this module holds a metadata repository, a metadata standard for describing
    micro course units is going to be established semantically (Veeramachaneni et
    al., 2013; Beydoun, 2009). According to this standard, all learning resources
    are represented in terms of discipline, key words, time length, language of instruction,
    popularity, difficulty and so on (Veeramachaneni et al., 2013). Data related to
    good-quality and mostly-followed/discussed learner-generated content, can be refilled
    into Learning Resource Repository in order to support peer-to-peer learning in
    MOOC (Beydoun, 2009).


    For MLaaS, the Real-Time Learner Data Retrieve Service retrieves learners’ real-time
    data, including their learning progress and current time availabilities (how many
    minutes they prefer to use in the moment).

