    Browsing OERs also has a problem as each silo has its own organizational structure.
    Some silos cannot be linked to a particular item, which hinders the free flow
    of information. The presence of OCW silos impedes the interoperability, discovery,
    synthesis, and flow of knowledge. As a result, it is a difficulty for teachers,
    students and self-learners to look for resources, and sometimes they make decisions
    based on incomplete information. Linked data have the potential to create bridges
    between OCW data silos (Nelson et al., 2014).


    ## 2.4.3 Big Data in Education


    Analysing these newly logged events requires new techniques for working with unstructured
    text and image data, data from multiple sources, and vast amounts of data (“big
    data”). Big data does not have a fixed size; any number assigned to define it
    would change as computing technology advances to handle more data. For example,
    Manyika et al. defined big data as “datasets whose size is beyond the ability
    of typical database software tools to capture, store, manage, and analyse.” (Manyika
    et al., 2001).


    The emerging ‘big data’ concept values the systematic and real-time data, which
    was difficult to track and store due to technical limitations. Therefore, underlying
    patterns are feasible to be discovered in order to predict student outcomes, such
    as dropping out, requirements for extra assistance, or desires for higher demanding
    assignments or course settings (Picciano, 2012). By this means, learning resources
    can be predictive and diagnostic. In other words, how learners will perform on
    the learning process can be evaluated and instructional techniques can be further
    employed to tailor learning for individual learner’s particular needs.


    Armed with statistical information compiled from various digital systems, numerous
    dashboards software and data warehouses have been developed with this big data
    trend. Benefitting from this, education providers are allowed to monitor learning,
    performance and behavioural issues, for individual learners as well as for the
    institute as a whole. Data visualization technique enables key metrics to be collated
    in a simple-to- and easy-to-interpret interface (Williamson, 2016). Therefore,
    how the learning is proceeding as well as how the organization is hosting are
    quickly and directly reflected on such dashboards, where data from various streams
    are translated to present clear and comprehensive overviews.


    The leveraging of big data lifts the EDM and LA to a more effective and efficient
    extent, whose growth is certified to reshape the way in which the forthcoming
    generation will learn (Sin & Muthu, 2015).


    ## Summary


    In this chapter we have reviewed the literatures that are relevant to our research.
    In the [Section 2.1](#Chapter2.xhtml#sec2.1), the background of mobile learning
    and micro learning was discussed along with the development of distance learning.
    The features and benefit as well as instructional design issues of OER and open
    learning were summarized in the [Section 2.2](#Chapter2.xhtml#sec2.2). Motivated
    by the advantages of these two new learning trends, we explored the feasibility
    to make use of the micro open learning for the sake of offering better learning
    contexts and experiences in the [Section 2.3](#Chapter2.xhtml#sec2.3). Common
    approaches adopted in the implementation of adaptive learning, for example, learner
    modelling and EDM and LA, were discussed together with the effects brought by
    the rising big data concept, which can be found in the [Section 2.4](#Chapter2.xhtml#sec2.4).


