    # 第 3 章


    ## 研究设计


    在线学习资源的爆炸式增长，尤其是大规模开放在线课程（MOOC），导致了教育和学习的革命（Baggaley, 2013）。教育专业人士一直极其努力地探索将 OER
    格式作为移动学习（m-learning）的常规教学方法（Waard et al., 2011）。然而，由于 OER 的研发仍处于起步阶段，显然有许多机会可以改进
    OER 中的学习机制，例如更有效的学习平台和学习支持服务，以便为提供者和学习者提供更易访问和更好的体验。


    在我们的试点研究中，我们调查了 OER 的发展趋势和接受程度，特别是在澳大利亚，并分析了现有的缺点及其潜在改进方向。受此调查结果启发，我们设计了一个面向移动服务的系统，旨在组织一个个性化学习环境（PLE），以支持智能协作和微开放。此外，我们特别关注为
    OER 提供者和学习者提供更好的背景和环境，以智能方式交付小块化的学习者自适应学习资源，这些资源预计在较短的时间内完成，并将这些课程块按顺序连接成一条确定的学习路径。因此，学习者能够充分利用碎片化时间，有效地参与微开放学习。


    本章的其余部分将介绍我们研究的设计，结构如下：它从研究背景开始，其中简要演示我们在之前工作中构建的个性化学习环境（PLE）；试点研究将作为研究动机，在第 3.2
    节中阐述；我们在开始这项研究之前面临的挑战将在第 3.3 节中总结；之后，研究目的和研究设计将在下来的第 3.4 节中展开，其中还将采用微 OER 适配示例场景以便于理解；作为本研究基础的系统框架可以在第
    3.5 节中查看。


    ## 3.1 研究背景


    开放学习的表现与校园电子/移动学习模式完全不同。OER 是“免费地、开放地向教师、教育工作者、学生和独立学习者提供的数字学习资源，以便在教学、学习和研究中使用、共享、组合、改编和扩展”（Hylen
    et al., 2012）。开放学习是非正式学习和正式学习的结合。学习者在在线开放学习中拥有高度的灵活性，因为加入和退出没有严格的时间限制。参与开放学习的学习者跨越不同的年龄组和文化背景，地理分布广泛。


    '
- fmt: '

    From another aspect, mobile learning activities in open learning normally consist
    of two sections: online learning and offline learning (Trifonova & Ronchetti 2006).
    Since mobile learners can freely download materials into their mobile devices
    for viewing offline, they do not often stay with open learning platforms and attend
    virtual classrooms (Attewell, 2005)). In fact, accessing OERs or any other ‘non-open’
    (or private) learning resource online is only a part of pervasive learning; more
    tasks associated with pervasive learning would require activities offline (Wu
    et al. 2010; Lossman & So, 2010), such as data collection, data analysis, and
    report writing for an assignment. Logically, mobile open learning is through online
    systems that include guided and instructional materials, the transaction details
    and deliverable resources (Ally & Samaka, 2013). Hence, while learners are able
    to accomplish many of their open learning tasks offline, for some necessary procedures,
    such as data entry and work submission, they need to go back online to conduct
    these specific tasks.


    ### 3.1.1 Stakeholder Prospective in Adaptive Micro OER


    Typical adaptive learning projects always contain targets and strategies for researchers,
    application partners and developers (Alario-Hoyos et al., 2014). From the educational
    institutions’ prospective, though being under pressure, they aim to assure openness
    in their education distribution and enlarge the influence and popularity of it.
    Aside from teachers/lecturers and learners, the development and application of
    adaptive OER delivery usually involve educational institute, instructional designers,
    technicians; and, to a greater content, institutional staff, library staff and
    system administrators (Alario-Hoyos et al., 2014). They collaborate in the preparation
    and enactment of the OER delivery and work towards the prosperity of open learning
    (Khalil & Ebner, 2016).


    The leveraging of adaptive micro open learning aims to fulfil learners and educators’
    needs by incorporating more helpful services into micro open learning and fostering
    the world-wide development of OER. Meanwhile, it can lead to a better integration
    of the education resources across institutions to maximize the educational outcomes
    for a broader spectrum of learners, whether formally enrolled in courses or not.


    A timely and feasible solution will be provided for OER providers to offer their
    services in a smarter manner by matching resources to personalized learning demands.
    Another outcome of this project will be cost effectiveness, as course providers
    can combine external resources without any huge re-development of their existing
    platforms. The novel learning technologies will allow educational organizations
    and course-instructors to wisely focus on, and tailor their teaching strategies
    to meet the requirements of, massive learner classes.


    ### 3.1.2 Service-oriented Environment for Mobile OER Delivery


    A key catalyst for m-learning to thrive is the service-oriented and cloud computing
    paradigms, which harness economic benefits of large scale distributed systems,
    where computing resources are seamlessly integrated across geographical boundaries.
    Learners now have numerous options to make decisions for their own to access big
    learning resources, whenever they want, wherever they are.


    In mobile environment, the system needs to provide learners with only the textual
    or visual learning material, but also software and apps, intuitive and task-oriented
    user interfaces (UIs), clear and easy-to-follow operation logics, engaging experiences
    in associated courseware and learning settings. All of these are anticipated to
    be wrapped up and delivered in a one-stop mode. An ideal way to distribute such
    OERs is to deliver them as services. This can make the whole process of OER delivery
    user-transparent, and minimize the hardware requirement for mobile devices.


    ### 3.1.3 Previous Work


    Many educational professionals still evaluate the pros and cons of the OER to
    foresee whether it can act as a regular, or barely complementary, pedagogical
    approach for m-learning. Particularly, from the upside, the adoption of OER expands
    access to learning, enlarges the scalability, lessens the expenses for students,
    and augments regular course content; from the downside, it suffers from quality
    issue and does not hold a mature mechanism to deal with the lack of human, especially
    face to face interactions, between instructors and learners. In addition, because
    of the new ness of the phenomenal education trend, its popularity has been limited
    due to the lack of personalized services so that current OER delivery often fails
    to meet comparatively diverse demands from both OER providers and learners. In
    other words, it is anticipated to have OER delivered in a personalized learning
    environment (PLE) rather than a solely traditional virtual learning environment
    (VLE). Moreover, these OERs are suggested to be consumed in a micro learning mode,
    which conforms to the characteristic of the modern e-society where mobile and
    pervasive computing becomes dominant.


    Having investigated the feasibilities to improve the resources delivery and learning
    experiences of MOOC, and the potential benefits of leveraging cloud computing,
    we are inspired to design a comprehensive cloud-based system, which builds a PLE
    to have both learners and instructors engaged in through mobile devices. As shown
    in [Figure 3.1](#Chapter3.xhtml#ch3-fig1), it consists of a couple of Software
    as a Service (SaaS) and three functional Web services. All services and applications
    in the PLE will work in conjunction and be deployed over a cloud infrastructure
    to borrow the strong computing capability and massive storage space so as to offer
    learners a one-stop interface with transparent, hence easier, operations and lesser
    software and hardware requirements.


    ![image](images/ch3-fig1.jpg)


    Figure 3.1. Framework of Mobile PLE for MOOC


    Combining the features of the mobile cloud environment, where applications are
    normally interoperable and platform independent, a feasible way to realize the
    whole teamwork-enhanced learning process is to orchestrate a learning flow, including
    time sequences, logical relationships, connected patterns and occurring conditions
    of various learning activities. Learning flow refers to the formal description
    of a set of rules and the process during which the learning activities occur or
    change (Cao et al., 2009). A completed learning flow blends all activities together
    to form a suitable process.


    A teamwork-enhanced learning flow is realized by one SaaS, named Teamwork as a
    Service (TaaS) in the PLE, in order to facilitate collaborative learning. As a
    part of the whole PLE, TaaS has been developed and implemented over a typical
    cloud infrastructure, `Amazon EC2`. Five web services in TaaS can be de-coupled
    or re-coupled according to specific teaching demands, although it is recommended
    for them to be utilized as a whole to add a complete set of functions to legacy
    LMSs. Particularly, as TaaS has its own user interfaces and can work as plug-and-play,
    it will maintain its own full and independent registration and administration
    mechanisms.


    The details of TaaS has been presented in (Sun & Shen, 2014), including a genetic
    algorithm enclosed to discover computational choices of grouping strategy (Sun
    et al. 2013). In this book we will focus on the other SaaS, namely Micro Learning
    as a Service (MLaaS) which will be introduced in the rest of the Chapter.


    ## 3.2 Research Motivation


