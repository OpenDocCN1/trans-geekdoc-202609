- fmt: "\nFrom [Figure 7.5](#Chapter7.xhtml#ch7-fig5), it is found that, although\
    \ ACOS produces better recommendations after the `N` is larger than 18 in terms\
    \ of the Precision values, its initial recommendation quality is comparatively\
    \ poor. The experiment shows the authors’ finding was correct that adopting NHSM\
    \ could improve the performance of user-based and also item-based recommenders\
    \ significantly (Liu et al., 2014). However, GA-based and EP-based MLaaS approaches\
    \ can generate results with higher precisions than NHSM overall, regardless the\
    \ size of `N` (`N≥20`). \n\n![image](images/ch7-fig6.jpg)\n\nFigure 7.6. Recall\
    \ Values of Top N Results by Different Recommenders\n\nAs aforementioned, generally\
    \ in judging the qualities of a micro OER recommendation, the Precision value\
    \ comes before the Recall values. If we observe the Recall values produced by\
    \ these selected recommenders as well ([Figure 7.6](#Chapter7.xhtml#ch7-fig6)),\
    \ the NHSM generates best results when `N` is less than 5 and then it falls to\
    \ lower than GA-based and EP-based MLaaS approach, and the respective differences\
    \ are both expanded along with the increasing value of `N`. Aside from this, although\
    \ ACOS is the only one recommender with both ascending Recall and Precise values,\
    \ its upcurve is below the NHSM’s until `N=20`. It is noteworthy that, at the\
    \ potential threshold (i.e., `N=15`), the other recommenders’ performance on retrieving\
    \ relevant micro OERs from all candidates cannot compete with GA-based and EP-based\
    \ MLaaS approaches’. Hence, combining both Precision and Recall values, and considering\
    \ together with the findings in the Experiment 1, the final winner still goes\
    \ to either the GA-based or the EP-based approach. Case by case, the algorithm\
    \ selection depends on the specific requirement of recommendations. Generally,\
    \ GA is a more stable choice, while EP has strength in accuracy.\n\nIn summary,\
    \ the proposed online computation of MLaaS is feasible to deal with new user cold\
    \ start problem in micro OER recommendation, by producing optimal results with\
    \ acceptable Recall and Precision values. Some widely-used recommenders do not\
    \ consider learning distraction, resulting in their lower qualities of responses\
    \ on cold start by only considering user ratings. Among all heuristic algorithms\
    \ used, EP and GA stand out and the suggestive size of the recommendation list\
    \ is 15.\n\n## 7.2.3. Learning Path Evaluation\n\nTo demonstrate the effectiveness\
    \ of the proposed solution for new item cold start problem, in this section we\
    \ evaluate the qualities of generated learning path with newly published micro\
    \ OERs inserted. We borrow the concept of 10-cross validation, by dividing the\
    \ micro OERs in the relevant fields into two portions, in a ratio of 1:9. Learning\
    \ paths were generated among the nine-tenth micro OERs. For each learning path,\
    \ one micro OER from the rest is selected and treated as newly published micro\
    \ OERs in the experiment. The `Algorithm 6.4` is executed to find a place for\
    \ each new member to the majority. The [Figure 7.7](#Chapter7.xhtml#ch7-fig7)\
    \ gives the violation degree (i.e. `VD` as defined in the [Section 6.2.1](#Chapter6.xhtml#sec6.2.1))\
    \ for the learning paths with new micro OERs inserted generated by using MLaaS\
    \ approach against those generated by using the shortest-path approach (Alian\
    \ and Jabri, 2009) and competency-based approach (Hsu and Li, 2015).\n\nIn total,\
    \ 3674 micro OERs in the information technology field, 4479 micro OERs in the\
    \ business field and 3254 in the social science field are picked up as candidates;\
    \ and 366, 448 and 325 of them were selected out as test items, respectively.\
    \ After the execution of the `Algorithm 6.4`, in the information technology field\
    \ 2044 new learning paths come out, while in the business and social science fields\
    \ the numbers are 3746 and 2329. This is because one or more places are found\
    \ for a new micro OERs; or according to the `Algorithm 6.4`, two new learning\
    \ paths are generated when there is a `RecommendedSequence` relation. The shortest-path\
    \ (SP) approach and competency-based (C-based) approach are executed as well to\
    \ put newly published micro OERs into places among or in parallel with items in\
    \ established learning paths. Actually, the working principles of SP and C-based\
    \ are not finding a place for the newly published micro OER within the established\
    \ learning path, but rebuilding a new learning path thoroughly.\n\nAccording to\
    \ the [Figure 7.7](#Chapter7.xhtml#ch7-fig7), the average violation degrees of\
    \ the learning paths generated separately by the three approaches are compared\
    \ in terms of the three disciplines. It can be found that MLaaS approach outperforms\
    \ SP and C-based approach overall, as average `VD`s of MLaaS-generated learning\
    \ paths in each discipline are far less than the others. Also, the SP approach\
    \ is difficult to identify a reasonably learning path provided that there are\
    \ many micro OERs loosely correlated (i.e. with the weak order `RecommendedSequence`).\n\
    \n![image](images/ch7-fig7.jpg)\n\nFigure 7.7. Performance Comparison of 3 Approaches\
    \ – Average Violation Degrees of All Generated Learning Paths\n\nAfterwards, we\
    \ evaluate the best solutions that are produced by MLaaS, SP and C-based. Therein,\
    \ one test micro OER is only allowed to be involved in one learning path; and\
    \ for each test object, the new learning path with lowest `VD` value is selected.\
    \ This is to eliminate the potential influences brought by the loose coupling\
    \ of prior/posterior micro OER pairs. In this case, the amount of the nominated\
    \ learning paths exactly equals to the amount of test micro OERs, namely 366,\
    \ 448 and 325, respectively.\n\nThe results in the [Figure 7.8](#Chapter7.xhtml#ch7-fig8)\
    \ show same observations that the MLaaS approach surpasses the other two approaches,\
    \ by finding better places to insert newly published micro OERs meanwhile breaking\
    \ the rules (as described in the subsection B of [Section 6.2.1](#Chapter6.xhtml#sec6.2.1))\
    \ less times. It is worth noting that the average violation difference is considerably\
    \ larger in the information technology discipline. This is probably because the\
    \ learning paths in this field are relatively longer. In other words, an individual\
    \ learning path that goes through a complete information technology knowledge\
    \ area consists of more micro OERs than those of business and social science.\
    \ In addition, all of the three approaches produce learning paths with higher\
    \ violation degrees in the business discipline. It can be potentially attributed\
    \ to that micro OERs having other OERs as knowledge pre-requirement, and one micro\
    \ OER being closely related to more than one of the others, are more often found\
    \ in the business discipline.\n\n![image](images/ch7-fig8.jpg)\n\nFigure 7.8.\
    \ Performance Comparison of 3 Approaches – Average Violation Degrees of the Best\
    \ Learning Paths for Each Test OER\n\n## Summary\n\nIn this Chapter, the system\
    \ implementation and empirical evaluation of algorithms were presented. In the\
    \ [Section 7.1](#Chapter7.xhtml#sec7.1), we demonstrated the topology of this\
    \ system, for which a peer-to-cloud-peer structure was adopted to facilitate the\
    \ file transmission. In conjunction of services in the offline computation domain,\
    \ the Adaptive Engine makes decision to allocate adaptive micro OERs to learners.\
    \ Its working principle was shown in a process diagram, in the [Figure 7.2](#Chapter7.xhtml#ch7-fig2).\n\
    \nThe [Section 7.2](#Chapter7.xhtml#sec7.2) presented the empirical evaluation\
    \ of our proposed approaches, for both new user and new item cold start problems.\
    \ Results showed that GA and EP were suggested to be adopted as the core algorithm\
    \ in the computation for new learner cold start problem. The both heuristic algorithms\
    \ can improve the performance of some well-developed recommenders. Furthermore,\
    \ the `Algorithm 6.4` is proven to be able to find more appropriate places in\
    \ established learning paths for newly published micro OERs.\n\n# Chapter 8\n\n\
    # Conclusion\n\n# 8.1Summary\n\n## 8.1.1Research Background Review\n"
