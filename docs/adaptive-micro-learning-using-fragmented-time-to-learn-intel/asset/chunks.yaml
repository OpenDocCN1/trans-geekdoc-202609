    \ element `ML[j]` {`P[u,j]`, `TA[j]`, `D[j]*} is exclusive to `j`^(th) learner\
    \ during the micro learning process. Herein, the element `P[u,j]` indicates the\
    \ learner’s preference, `TA[j]` indicates the `j`^(th) learner’s instant time\
    \ availability, and `D[j]` denotes the level of distraction in terms of the given\
    \ learning environment and surroundings.\n\nEach of these three features proposed\
    \ in the lightweight profile is associated with a confidence degree to reflect\
    \ its subjective relevance. For example, if an explicit information is provided\
    \ by the learner directly and appear as a number rather than a range, its associated\
    \ confidence degree is set to full.\n\nWhenever `MLaS` gathers any information\
    \ from the learner’s learning process over OER, the learner profile will be updated\
    \ in regard to `ML[j]`.\n\n## 6.1.3. Instant Time Availability\n\nThe system is\
    \ able to obtain explicit information on how long the learner can (or would like\
    \ to) spend on a micro OER through mobile devices in the real time. As a mandatory\
    \ request, a learner is required to input his or her instant time availability\
    \ at the beginning of every micro learning activity.\n\nAccording to the system\
    \ setting, suggestively the instant time availability, `TA[j]`, is represented\
    \ by an integer from 1 to 15. However, if the learner is not sure how long s/he\
    \ is able to spend on the micro OER at once, s/he is free to leave a time span,\
    \ which can be continuous integers in the same range.\n\n## 6.1.4. Preference\
    \ Propagation\n\n![image](images/ch6-fig1.jpg)\n\nFigure 6.1. Partial View of\
    \ the Augmented Micro OER Ontology and Spreading Activation for a Learner’s Preference\
    \ on OER\n\nGiven the cold start condition for the first micro OER delivery, a\
    \ learner is required to quickly mark down a preference on a specific micro OER.\
    \ Consequently, a spreading activation approach is applied to maintain the preference\
    \ against its parent node (i.e., the `R[v]` is the `v`^(th) OER where the `MR[u]`\
    \ derived from) as well as updating learner profile. It propagates the learners’\
    \ preference upwards the hierarchy of micro OER ontology. In other words, the\
    \ preference has been obtained from a micro OER to its ancestor and spread in\
    \ its superclass (i.e. OER) level. An example of the spreading activation is shown\
    \ in [Figure. 6.1](#Chapter6.xhtml#ch6-fig1).\n\nA partial view of augmented micro\
    \ OER ontology in ‘information technologies’ area is shown in Fig. 2. Particularly,\
    \ it describes an ‘e-business’ OER from an Australian provider, OpenLearning ([www.openlearning.com](http://www.openlearning.com)).\
    \ At the bottom level of the ontology, the nodes depicted with oval shape typically\
    \ conform to the standard of micro OER. The red integers shown in nodes with rectangle\
    \ shape are preference values from a learner versus target OERs. The `Algorithm\
    \ 6.1` is proposed to execute the process of preference propagation.\n\n![image](images/105.jpg)\n\
    \nThe normalization factor acts on preventing the propagated preferences from\
    \ escalating continuously to such an extent that exceeds a reasonable range, which\
    \ could result in difficulty of data processing in the forthcoming process. The\
    \ confidence degree for the propagated preference of OER is recorded as `CD (P[v,j])`.\n\
    \n## 6.1.5. Distraction Prediction\n\n### A. Demographic Classification\n\nIn\
    \ the [Chapter 4](#Chapter4.xhtml) (Sun et al., 2015), we discussed the key issues\
    \ that might cause distraction in micro open learning, which generally came from\
