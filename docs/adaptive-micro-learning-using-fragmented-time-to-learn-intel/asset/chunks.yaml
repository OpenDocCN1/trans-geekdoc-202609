  trans: '


    为了启动本书的实践部分，第 6 章将详细阐述 MLaaS 在线计算的细节。在线计算旨在明确地支持微学习适应与交付的决策过程。首先，本章将提出一种解决著名的冷启动问题的方案作为主要贡献。将在综合学习模型的基础上构建一个轻量级的学习者-微
    OER 配置文件，以应对冷启动条件并实现快速响应。随后，还将探讨如何将新发布的微 OER 插入已建立的学习路径中，以及综合学习模型的实时更新。


    第 7 章将为所提出的计算方法提供实证评估结果。实验将基于一系列模拟进行，通过选择和优化启发式算法来实现该计算过程。本章还将涉及系统实现。


    第 8 章将总结本书，并对未来的研究提供建议。


    # 第 2 章：文献综述


    作为近年来出现的一种新现象，微开放学习具有重要意义，并吸引了研究人员和开发者的关注。自适应微开放学习的成功与技术和教育角度结合主题的恰当利用密切相关。在本章中，我们将回顾计算机科学、信息技术、数据科学和教育学领域的相关文献。首先，将在第
    2.1 节回顾移动学习和微学习领域的文献。然后将在第 2.2 节中讨论开放学习和开放教育资源的背景与发展。接下来，将探讨这两种现象级新学习趋势——微（学习和）开放学习（即基于
    OER 的微学习）相结合的优势和研究空白；最后，我们将在第 2.4 节调查学习者建模、教育数据挖掘（EDM）以及学习分析（LA）的研究。


    ## 2.1 移动学习与微学习


    ### 2.1.1 远程学习与电子学习


    远程学习扩大了学习活动必须在特定地点（通常是教室）物理执行的概念。因此，在远程学习的背景下，教师和学生通常在时间和空间上是隔离的；同时，学生与其同学或团队成员在虚拟上是分布式的。这种学习方法赋予了教师安排时间日程的自由，并允许学生在自己倾向的时间学习学习内容。就此而言，它为学生提供了更多教育机会，包括因残障、疾病无法参加传统课堂的学生、希望在全职工作之余深造的人，以及愿意但远离理想教育机构的人员，例如发展中国家的学生（Woods
    et al., 2011）。


    远程学习的核心思想是知识的传递，这通常通过某些技术和通信工具辅助来实现。例如，在最早的远程学习形式中，通常采用邮政信函教学。20 世纪，一些开放大学或开放课程供应商经常利用电视教育和视频会议。研究人员将这种现象确定为电子学习（e-learning）的起源。


    随着互联网技术的快速发展，电子学习（主要通过电子手段分布和促进知识的获取与使用）逐渐在教学中发挥着重要作用（Wentling et al., 2000）。Urdan
    和 Weggen (2000) 将电子学习定义为“通过所有电子媒体传递内容，包括互联网、内网、外网、卫星广播、音频/视频磁带、交互式电视和光光盘”。


    关于电子学习特征的讨论在文献中广泛可见。一些典型的观点总结如下：


    - 对于电子学习支持的远程学习，教师和学生不再需要在同一地点，同时通过使用电子设备作为辅助也涉及课堂学习体验。

    - 电子学习可以是自主的或教师引导的。许多教育机构已为学生提供了丰富的学习资源，包括讲座录像带、讲义笔记、幻灯片、参考书等。也就是说，学生可以根据自己的自由和喜自主访问这些资源（Bates
    and Poole, 2003）。学习活动的开始和结束在他们自己手中，他们决定想订阅哪些资源、应该强调哪些方面以及每个学习阶段应该持续多久。相反，教师在电子学习中的角色可以简化，如提供相关学科的指导，指出正确的学习方向，分享经验并在学生感到困惑时回答问题（OCED,
    2005）。

    - 电子学习活动可以是同步的或异步的。一方面，两个或多个参与者可以在同一时间内交换想法或信息，这通常由聊天室、即时消息软件和视频通信设备支持。另一方面，随着成熟的
    Web 2.0 技术，通过博客、Wiki、讨论论坛等辅助的异步学习活动在近年来变得频繁。因此，参与者不再要求在收到信息后立即响应，也不依赖其他参与者的同时参与。


    有许多电子学习系统，也称为学习管理系统（LMS），它们是用于文档、跟踪、报告以及教育课程或培训计划交付与管理的软件应用程序。大多数 LMS 是基于 Web
    的，可以访问学习内容并扩大使用范围。LMS 中提供的通用学习内容以文本、图像、动画、流视频和音频的形式存在。


    ### 2.1.2 移动学习


    随着无线技术的演变和移动设备的广泛使用，移动学习（m-learning）作为电子学习的新趋势出现（Sharple et al., 2002）。


    两种远程学习的主要区别在于，电子学习通常在计算机或固定设备前进行，而移动学习可以在任何地点发生（Sharma and Kitchens, 2004）。因此，学生可以在任何地方、任何时候进行移动学习。在校园、家里或学校设施外发生的学习活动可以整合到移动教育环境中（Kim
    et al., 2006）。此外，移动学习的一个趋势是学生使用移动设备且实际上处于移动中，而教师可能使用移动设备以外的多种设备并位于固定场所（Vanska,
    2004）。


    Koole 等人 (2010) 指出，移动学习促进了远程学习的效用。与远程学习相比，移动学习具有几个交付高质量教育体验时应考虑的额外特征：


    - 可访问性（Accessibility）：它是移动学习的核心。学习环境处于移动中，所有的学习资源和学习者都是移动的。如果学习空间发生改变，学习活动不会中断（Attewell,
    2005）。


    '
- fmt: '

    ## Characteristics of M-learning


    - **Personalization**: In the m-learning environment, each individual learner’s
    condition can be extraordinarily hybrid and complex, such as different bandwidths
    and network conditions varying from time to time. Also, their mobile devices may
    have various screen sizes and typing methods. Personalization is the characteristic
    that different individual learning needs and learning properties are adapted to
    different learners (Sharma and Kitchens, 2004). It should also focus on delivering
    the appropriate contents to study in a particular way. Some researchers addressed
    that the m-learning should be context-aware to adapt learners in different conditions
    (Economides, 2008; Negella and Govindarajulu, 2008; Zervas, Ardila et al., 2011).

    - **Convenience**: Due to the limited memory and processing capabilities, commonly
    learners use mobile devices to access m-learning resources via thin client or
    web browser; these portable devices should well enable network connectivity, rapid
    setup and equipment reusing. The readability of content, operability of interface
    and learners’ satisfaction should be be taken into consideration (Georigiev, Georigiev
    et al., 2004).

    - **Interactivity**: There are three types of interactions in the m-learning:
    learner to learner, leaner to teacher and learner to content (Koole, Mcquilkin,
    et al. 2010). Each of these three interactions is expected to be done hassle-free,
    regardless the time and location.


    Relatively, traditional m-learning more focuses on the content delivery, but lacks
    the ability to process assessment and feed back to `LMSs`. However, along with
    the booming of technologies, the context of m-learning evolves significantly which
    is far more advanced and complicated than five years ago. Wherein, obvious changes
    can be concluded to the widespread use of intelligent equipment and the upgrade
    of infrastructure.


    Exemplified by the smart phone and tablet, the intelligent equipment improves
    the user experience of m-learning by offering the full-touch-screen and integrated
    computing capability. Due to their gradually complete functions, they are replacing
    the use of `PDA`, feature (non-smart) phone, portable media player and e-reader.
    To some extent, the limited screen and typing method of traditional mobile device
    are promoted. By using these, learners have more freedom to customize and download
    the learning materials based on their individual mobile operation systems. Meanwhile,
    more and more applications and lightweight applications (apps) are released in
    the education area, as well as the e-book can be read on a broad variety of mobile
    operation systems.


    The problem caused by phone signals is somehow remitted by the advantages high-speed
    network (`4G`, `3G`, `GPRS` and `Wi-Fi` etc). Web contents of `LMS` system should
    fit to the screen size of mobile devices, on which the online audio and video
    can also be played smoothly. In addition, the communication approaches in the
    m-learning environment become abundant with the support of upgraded infrastructure.
    Ting (2005) summarized that there were three types of communication approach in
    m-learning before the year of 2006: voice communication (e.g. phone call), short
    text message and communication on internet (e.g. Online chat and email), and the
    first two are served by communication-operation corporations (e.g. telephone companies)
    and charge in terms of phone bills. Since 2006, much more online tools and apps
    have been developed to support instant communication. The voice communication
    and short text message, even in a group format, are feasible to be realized and
    can be easily achieved through the Internet. In addition, learners are able to
    use multimedia-based message to communicate among each other, so that they are
    only billed by the consumption of the network quota rather than the phone usage,
    or even for free when `Wi-Fi` network is well available.


    The development of m-learning neither intends to completely replace traditional
    distance learning, nor is about to resize and restrain the course into pocket
    devices. However, it dedicates to enhance distance learning with the power of
    wireless network, and augments the formal knowledge delivery (Ting, 2005). Hence,
    it is believed that some new trends raised by m-learning will arrive in the near
    future, which can be concluded as:


    - More and more mobile devices are employed into classroom as supplements of traditional
    learning resources. This means can augment the formal learning so as to reach
    a scene of blended learning (Vaughan, 2010). For example, m-learning may be used
    to introduce some chapters of a course while the rest is conducted in real face-to-face
    education (Mellow, 2005).

    - Online courses delivered through the `LMSs` are dramatically exploding, giving
    learners more choices to participate in on demand delivery. They can use mobile
    devices to browser learning resources, and accomplish, upload and check assignments,
    by one-stop service, which is more practical to arrange the education process.

    - The e-book gradually replaces the traditional paper-printed textbook. The e-book’s
    content is easy to update. Teachers and learners benefit from this convenience
    so as to be not out-dated (Zawacki-Richte et al., 2009).

    - Multimedia-based content is increasingly blended in teaching materials, which
    gets knowledge passed on in creative and vivid ways. The learning experience changes
    to non-baldness.

    - It becomes very common that learning for multiple times with each learning time
    shortened. That is to say, learners are able to utilize more fragmented pieces
    of time to learn, when they are queuing up, on the way or at the time slot of
    other events, and so on.

    - M-learning can be simultaneously combined with social network to link learners,
    raise discussions and spread out information, from which the information-push
    technology guarantees that learners who are offline or in phone-signal-lacked
    areas never miss a message.

    - Online collaborative learning gains its popularity, which engages numbers of
    learners to join for working towards common goals.


    There were various drawbacks of mobile learning in the past decade. For example,
    learning resources for non-mobile devices cannot be directly adapted to mobile
    devices due to their indeterminacies of context (e.g. unpredictable network bandwidth),
    and specificities (e.g. different operation systems). Inspired by these, educational
    experts suggested that a key catalyst for m-learning to thrive is the services
    oriented and cloud computing paradigms, which harness economic benefits of large
    scale distributed systems, and computing resources are seamlessly integrated across
    geographical boundaries (Sarrab et al., 2015). The prosperities of m-learning
    and mobile service are usually discussed together because they have shared a lot
    of common features, such as location-based specificity (Dinh et al., 2011). This
    suggests that m-learning and mobile service can be facilitated mutually. We will
    discuss this new trend of m-learning in the next section.


    ## 2.1.3 Mobile Cloud-based Learning


    The traditional m-learning proceeding without cloud computing suffered from some
    disadvantages, they can be concluded as the following two aspects:

