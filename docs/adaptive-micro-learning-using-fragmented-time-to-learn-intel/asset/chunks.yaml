    \ other stakeholders in open learning to get familiar with the similar operations\
    \ on OERs, so that they promote the use of OER in both learning and teaching.\n\
    \n# 2.2.1.***Classification and Evolution of OER (OER, OCW and MOOC)***\n\n# a)\
    \ Open Course Ware\n\nThe formal definition for the Open Course Ware (OCW) given\
    \ by the OCW Consortium organization is “free and open digital publication of\
    \ university-level educational materials. These materials are organized as courses,\
    \ and often include course planning materials and evaluation tools as well as\
    \ thematic content” (OCW Consortium.org). Taking the MIT’s  OCW program as example,\
    \ this pioneer started as early as in 2001. This trend has been extended widely\
    \ in Europe and Asia.\n\nGenerally OCW is a subset of OER (Friesen, 2009). Unlike\
    \ OER including any educational content that is shared under an open license,\
    \ whether or not it is a part of a course, OCW sorely focuses on sharing open\
    \ content that is developed specifically for a course.\n\n# b) Massive Open Online\
    \ Course\n\nRising remarkably in the recent decade, the Massive Open Online Course\
    \ (MOOC) is offered free to students of any age group and also works on an open\
    \ network learning model, with neither formal entry requirement nor participation\
    \ restrictions. It soon becomes the most eye-catching trend in OER and gains its\
    \ popularity in the whole higher education sector (King et al., 2014). The explosive\
    \ growth of learning resources online leads to a revolution of education and learning,\
    \ and the year of 2012 was named as ‘the year of MOOC’ (Pappano, 2012).\n\nIt\
    \ is an online course targeting on large-scale interactive participation and open\
    \ access via the Web, which is an important supplement to the traditional distance\
    \ education (Liyanagunawardena et al., 2013). It contains interaction, feedback\
    \ and assessment (via automated quizzes or peers) and even many world-famous universities,\
    \ who contribute courses to MOOC providers, are gradually accrediting the credits\
    \ gained from MOOC courses. Therefore, statistics show that millions of people\
    \ are participating in the virtual classroom of MOOC, particularly; the number\
    \ of students who are enrolled in a single course at the same time could be as\
    \ high as tens of thousands (Baggaley, 2013)\n\nFauvel and Yu (2016) stated following\
    \ offerings for platforms or courses to be called MOOCs:\n\n•Massive: they should\
    \ accommodate thousands to tens of thousands of students taking the same course\
    \ simultaneously;\n\n•Open: they should be freely accessible – anyone can register\
    \ with no financial barriers, and there are no preconditions for learners;\n\n\
    •Online: they can be accessed through a computing device (e.g. a computer, smartphone\
    \ or tablet) with an Internet connection;\n\n•Course: they should offer a well-organized\
    \ learning sequence, but not unconnected learning objects or modules. \n\nMOOCs\
    \ are generally divided into two broad categories: cMOOCs, which are based on\
    \ the connectivist pedagogy approach, and xMOOCs, which are similar to traditional\
    \ university courses (Saadatdoost et al. 2015). cMOOCs focus on the creation of\
    \ connections between learners, and the course contents are usually not predefined;\
    \ instead, they move on according to the discussions between learners. xMOOC on\
    \ the other hand, usually have predefined course contents; learning materials\
    \ are prepared before start date by instructor(s), and students go through them\
    \ in the sequence. Today, most of available MOOCs are of the xMOOCs type, whose\
    \ course contents are uploaded before the start of those online courses (Daniels\
    \ et al., 2015).\n\nMOOC courses are offered to learners through online platforms,\
    \ such as Coursera, edX and Udacity. Also, there are hundreds of other available\
    \ platforms, each of which is with its particular focus, characteristics and features.\
    \ These platforms generally include the following three components: course contents,\
    \ community building tools, and platform tools (Fauvel and Yu, 2016). The contents\
    \ of these components are shown in [Figure 2.1](#Chapter2.xhtml#ch2-fig1).\n\n\
    ![image](images/ch2-fig1.jpg)\n\nFigure 2.1: Common Structure of MOOCs Platform\n\
    \n Course contents can be divided into informational assets and interactive assets.\
    \ Informational assets can be videos (with transcripts), which are the main content\
    \ delivery strategy in current MOOCs, or other supporting materials such as e-textbooks,\
    \ lecture slides, lecture notes, topic outline, etc. Interactive assets refer\
    \ to assessment units such as exercises, quizzes and exams for students to complete.\
    \ Usually, interactive assets of a course can only be seen by enrolled students.\n\
    \nCommunity building tools include asynchronous tools, which are not used simultaneously\
    \ by learners and instructors, such as forums; as well as synchronous tools, which\
    \ allow learners to share their space simultaneously, such as chat rooms and real-time\
    \ group discussions. Different platforms are using different tools.\n\nPlatform\
    \ tools usually have searching and recommendation features, as well as user authentication\
    \ features. Most platforms also provide an interface for teachers to organize\
    \ their course contents, and some statistics and data visualization tools to support\
    \ them in teaching.\n\n# c) Open Educational Practice\n\nOpen educational practice\
    \ (OEP) is recognized as an important activity in the open learning. Its importance\
    \ was stated by Armellini and Nie as that “systematic support and training for\
    \ academics, focusing on evidence and added value for students and themselves”\
    \ (2013). It expands the scale of open learning from purely one-way knowledge\
    \ impaction to two-way interactions and hands-on experience. Conole and Ehlers\
    \ (2010) believed that OEP is able to shift the way instructors pass on knowledge\
    \ and students obtain information, as they stated that “the use of open educational\
    \ resources with the aim to improve quality of educational processes and innovate\
    \ educational environments”.\n\n# 2.2.2.***Instructional Design of OER***\n\n\
    Participants in research by Harley (2008), Lane and McAndrew (2010) and Rolfe\
    \ (2012) listed a lack of support in terms of training in how to find and use\
    \ OER as a barrier to the integration of open materials, while Lynch and Rather\
    \ (2015) noticed there was a lack of institutional support  for innovative teaching\
    \ strategies and practices which can keep in pace with the edge-cutting learning\
    \ technology. Finding, adapting, and adopting such resources can be complicated\
    \ by the fact that instructors may lack the knowledge of and/or comfort with using\
    \ the technologies necessary to conduct needed or desired tailoring. This can\
    \ limit OER being utilized to its fullest potential. (Armellini and Nie, 2013;\
    \ Petrides et al., 2011)\n\nThe training for instructors and instructional designer\
    \ in open learning comes up with a new topic to the OER providers. Generally it\
    \ is closely related to the following concerns (Armellini & Nie, 2013):\n\n•How\
    \ to find appropriate locations for OER\n\n•How to conduct research around the\
    \ use of OER;\n\n•How to use the technology needed to find, adapt and adopt OER;\n\
    \n•How copyright works including the types and role of open licences;\n\n•How\
    \ to create OER using appropriate formats and licenses."
