    # Chapter 6


    # Online Computation for MLaaS


    In this chapter the operation procedure of the online computation domain of MLaaS
    will be introduced. As the benefit stated in the [Section 3.3.3](#Chapter3.xhtml#sec3.3.3),
    The adoption of online computation aims to tackle the nearline activities the
    can reflect the ‘recentness’ of the learning behaviours and act on the fast response
    of micro OER recommendation.


    Furthermore, the adoption of online computation is expected to improve the performance
    of MLaaS in the following aspects:


    1. Given the complete newness of the MLaaS as well as the new coming users who
    have no record on the micro open learning, the focus of this chapter is to make
    the first delivery to learners in their fresh micro open learning journal. This
    is realized by the functionality of addressing cold start problem in the online
    computation.

    2. For newly published micro OERs, it is central to their acceptance and popularity
    that it can be discovered and collected in recommendation list as soon as being
    released. This requirement will be fulfilled by a heuristic mechanism that inserts
    the newly published micro OERs into established learning paths.

    3. The online computation is also in charge of making up limitation in timeliness
    and renewal of the offline computation by keeping the comprehensive learner model
    and learner-micro OER profiles up-to-date.


    The above three aspects will be introduced in the upcoming [Section 6.2](#Chapter6.xhtml#sec6.2),
    [6.3](#Chapter6.xhtml#sec6.3), and 6.4 in sequence.


    # 6.1 Lightweight Learner-Micro OER Profile for Cold Start Recommendation


    ## 6.1.1 Augmented Micro Learning Learner Profile Taxonomy


    As discussed in the Section 4, based on a comprehensive survey in the literature
    of pedagogy, psychology, e-learning and mobile learning, we have classified out
    features that might play key roles in the micro open learning experience and outcomes.
    From the user-based view, such a comprehensive learner model is annotated by semantic
    approach. These ontologies also represent how features affected and interrelated
    with each other in the ongoing micro open learning process. As the instances of
    the pre-setting domain ontologies, a specific learner profile oriented to micro
    learning is a set of nodes root from the main ‘comprehensive learner model’ ontology
    versus a node in the augmented micro OER ontology. It contains plenty of annotations
    in terms of their learning behaviours and context.


    To technically operate the semantic learner profile for micro open learning, data
    collection comes from two sides, the explicit data collection (e.g. through mandatory
    requests) and implicit data tracking (e.g. automatic extraction) (`Moreno et al.,
    2013`).


    ## 6.1.2 Representation of Lightweight Learner Profile


    Although from the item view, it is feasible to get micro OERs measured in terms
    of the standard defined in the micro OER profile; from the user view, it is unlikely
    to have such sophisticated information in hand with a null history of a fresh
    learner, so that, in many cases, the learner model oriented to offline computation
    lacks sources to activate.


    Despite low adoption in education area, the lightweight model based recommendation,
    for example rating based recommendation, is a good alternative for intensive data
    maintenance approaches needed by ontology-based recommendations in offline computation
    (`Nadolski et al., 2009`).


    Hence, this cold start condition motivated us to simplify this comprehensive learner
    profile described in the Section 4 to a lightweight version. It merely deals with
    necessary information for decision making in order to act on the initialization
    agilely (`Luz et al., 2013`).

