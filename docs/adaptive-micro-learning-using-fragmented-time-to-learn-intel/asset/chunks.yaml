- fmt: '

    As a key concern, the typical product of OER, namely `MOOC`, is currently suffering
    from low completion rate, with several sources indicating that about 5% to 15%
    of participants finish the courses on average while most learners who enrolled
    in `MOOC` courses ended up dropping out (Nawrot & Doucet, 2014). However, some
    authors suggest that dropout statistics might not be representing the only reality
    of `MOOC` learners. This is because different patterns of student behaviour exist,
    and analysing further each participant’s objectives can provide additional insight
    into the different personal goals when attending a course besides finalizing it.
    Therefore, different measures should be available in order to evaluate whether
    `MOOCs` are effective for individual participants (Daradoumins et al., 2013).
    Arguably, this is mainly because learners fail to conduct effective time management,
    so that they are suffering from time consuming and conflicts with their real-life
    responsibilities (Nawrot & Doucet, 2014).


    Another crucial factor is believed that, although efforts have been put in, learners
    deem it is not easy to find appropriate resources they want, or the chosen resources
    do not match their expectation. In Chae and Jenkin’s study (2015), their participants
    claimed the chance to find and modify materials in a time manner is very insufficient.
    This viewpoint is also supported by Armellini and Nie’s survey finding (2013).
    They claimed that finding resources across multiple repositories is time-consuming,
    and that, adapting the resources they have found to meet their individual demands
    may even take significant longer time than this. Harley, et al. (2010) found that
    this time commitment was a key reason that learner cannot enjoy their open learning
    journey. In this case, they simply give up and look for substitutes, and some
    of them repeatedly enrol to try a new course until they eventually find their
    preferred ones (Khalil & Ebner 2014).


    The third reason is that the backgrounds of learners engaged in `MOOC` courses
    are more diversified (DeBoer et al., 2013). Some `MOOC` learners do not have a
    concrete aim to complete an entire course as to get the credits, because they
    only want to acquire the specific knowledge they actually need. Such knowledge
    is often enclosed in small course units or passed on during phases going by midway
    of the course delivery. Therefore, once they are satisfied with the progress they
    have made, they are possible to quit while leaving assignments or tests unfinished
    (Daradoumins et al., 2013; Khalil & Ebner, 2014).


    This can explain why m-learning in `MOOC` appears distinct from its traditional
    form and mode in on-campus and distance education. `MOOC` teaching and learning
    highly rely on the connectivism approach. Teamwork, collaboration, communication
    and peer-to-peer learning are of attached important educational value in `MOOC`.
    However, despite the advantages of mobile cloud-based learning and forthcoming
    mobile apps, learning resources for non-mobile devices cannot be directly adapted
    to mobile device due to their indeterminacies of context, such as unpredictable
    network bandwidth, and specificities, such as different operation systems. Learners
    may be at their wits end to choose which courses to learn at first or next when
    there are many options to be considered. In addition, enhancing learners’ teamwork
    performance in collaborative learning plays a significant role when `MOOC` learners
    are achieving their learning objectives as a group. How to enhance learners’ teamwork
    performance comes down to a variety of pedagogical concepts and is scarcely supported
    by any Web based tools. Hence, some researchers are very concerned that open online
    courses may not reach its promise because many aspects of traditional classes,
    such as small-group discussions and face-to-face time with instructors, would
    not be realized in the `MOOC` format (Daradoumins et al., 2013). Moreover, it
    is found that learning activities are off and on frequently during the progress
    of `MOOC` course and many learning activities are completed within fragmented
    pieces of time. In other words, their learning processes become fragmented or
    of micro size.


    ## 2.3.2 Micro learning over OERs


    Standard models of m-learning, as instructor-led or computer-based, look very
    much alike college classes, where learners are taken out of their normal work
    or living environments to spend many hours “learning” activities which they may
    or may not encounter in their day-to-day lives. However, standard models are quickly
    being swept out the door by the learning methods that do take place inside the
    normal work environment, but right smack in the middle of it. This has resulted
    in new interests in micro learning, which is essentially any type of learning
    carried out in very short bursts of period. Digital learning environments, like
    `MOOCs`, can actually provide frame-works for a wide variety of micro learning
    activities.


    By analysing 6.9 million records of video playing, the industry-leading OER provider
    `edX` found that the videos with a time length less than 6 minutes are more attractive,
    while students’ engagements drop sharply after 6 minutes (Guo et al., 2014; Anderson
    et al., 2014). Regardless the exact length of the videos, the actual median value
    of viewing time is 6 minutes. In addition, 6-9 minutes videos are in the inflexion,
    while longer videos have less median values of viewing time.


    Hence, according to existing studies to investigate MOOC’s learner behaviour tracks,
    it is not surprising that, to some extent, MOOC follows the principles of micro
    learning and even `MOOC` is typically designed around the principles of micro
    learning, which enables learners to go through bytes of learning in short duration
    (Guo et al., 2014; Anderson et al., 2014). For instance, some course materials
    have have been chunked and sequenced in a simple-to-complex order to enable faster
    processing by students. The units ideally do not exceed 15 minutes. For example,
    one popular way to link two course units is to add a simple assessment, normally
    in the form of quiz, true/false questions or multiple choices, between them (Adamopoulos,
    2013).


    On the other hand, as stated in the previous 2.2, OER learning emphasizes collaboration
    and connectivism (Makness et al., 2013; Waard et al., 2012), where learner-generated
    contents are also of importance in OER delivery. It is believed that micro learning
    is an efficient way to carry out problem-based learning and exchange just-in-time
    feedback. OER also provides essential basis for life-long learning. The learn-as-you-go
    mode of micro learning makes people feel free to acquire any particular knowledge
    they need or are interested in as soon as they want (Kovachev et al., 2011). If
    they do not have a necessary demand to get credits from OER providers, by micro
    learning they can still easily get through specific learning content without finishing
    the entire course. By this means, micro learning can lead to better integration
    across disciplines in OER provision.


    ## 2.4 Adaptive Learning: Learner Modelling and EDM & LA


    ### 2.4.1 Learner Modelling


    Learner model is a key element of personalized learning systems (Conejo et al.
    2011). It usually includes a set of structured information which describes the
    characteristics of learners (Al-Hmouz et al., 2012). In order to provide personalized
    learning experience to each individual learner, a way to represent learners and
    the course materials should be identified first, so that systems can recommend
    courses which can better fit a learner’s interest and current knowledge level.


    #### a) Definition of Learner Model

