    \ the exact length of the videos, the actual median value of viewing time is 6\
    \ minutes. In addition, 6-9 minutes videos are in the inflexion, while longer\
    \ videos have less median values of viewing time.\n\nHence, according to existing\
    \ studies to investigate MOOC’s learner behaviour tracks, it is not surprising\
    \ that, to some extent, MOOC follows the principles of micro learning and even\
    \ MOOC is typically designed around the principles of micro learning, which enables\
