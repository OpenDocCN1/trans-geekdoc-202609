    Reporting learners’ data visually and statistically to demonstrate their unique
    learning story, and also their learning constraints (such as time availability),
    is crucial. This plays a significant role in assessing learners’ study status,
    estimating learners’ study progress, and carrying out strategic decision-making.
    This process is responsible for the benchmark setting for routine data extraction
    from the open learning platform.


    For the bottom level (i.e., the data level) of the knowledge base, the technical
    operation of semantic learner profiles and knowledge base construction for micro
    open learning is based on data that populates the graphs from two sources: explicit
    data collection (e.g., through mandatory requests); and implicit data tracking
    (e.g., automatic extraction) (Moreno, 2013).


    In addition, rather than developing the domain ontology for OERs by ourselves,
    a general structure of courseware ontology is built jointly by making use of existing
    ontologies, which were extracted from major OER providers, such as universities
    involved in major open courseware alliances (e.g., participating institutions
    in edX[^a](#Chapter5.xhtml#fn1), or from the Linked Open Data Cloud community[^b](#Chapter5.xhtml#fn2))
    (Capuano et al., 2009).


    The investigation of ‘big’ open learning data is related to OER. Among the massive
    OERs, three main types of relations are foreseen:


    * `ConsistsOf` is an inclusion relation. This relation can be generally found
    between two OERs or one OER and one micro OER. Two items with this relation are
    located in different hierarchies of the augmented micro OER ontology.

    * `RequiredSequence` is a strong order between two items (OER or micro OER), where
    the former micro OER must necessarily be learnt before the latter one, due to
    course settings and educational consideration.

    * `RecommendedSequence` is a weak order between two items (OER or micro OER),
    where the former micro OER is suggested to be learnt before the latter one, according
    to the instructor’s guidance, but is not mandatory.

    * It is certainly possible for two items (OER or micro OER) to have no relation
    at all.

    * Both relations regarding sequence can be inherited by entities’ descendants,
    for example, if there is a `RecommendedSequence` (`R*[1]`, `R*[2]`) indicating
    an OER `R*[1]` is preferably learnt prior to `R*[2]`, then, for `MR*[1]` ∈ `R*[1]`
    and `MR*[2]`∈ `R*[2]`, there is a `RecommendedSequence` (`MR*[1]`, `MR*[2]`).


    The purpose of the EDM/LA is to amend, enrich and validate the aforementioned
    ontologies built manually and extracted semi-automatically, and verify and weigh
    the importance of discovered relations. Our combination of EDM and LA is realized
    on the basis of two components (Markellou et al., 2005); on-campus mobile learning
    data (i.e., structured data), and ‘big’ open learning data (i.e., unstructured
    data). In particular, we are carrying out the experimental EDM and LA by conducting
    a substantial analysis of the real data of learning behaviours of students from
    a public university in Australia. The data are collected from the main learning
    management system (LMS) and data warehouse of the university. This analysis aims
    to identify the regular patterns of students getting involved in blended learning
    (i.e., on-campus learning and e/m learning); for example, whether and how often
    they adopt micro learning modes to accomplish learning.

