- fmt: '

    Furthermore, in the Learning Resource Repository Service, selected course modules
    are clustered using text/data mining technologies. This service also measures
    correlations among chunks, or, if feasible, derives correlations from existing
    MOOC course modules. It helps to set learning start point and exit point and it
    also distinguishes the suggested sequences of learning resources and identifies
    a learning path among them.


    Taking inputs from all the above services, the Adaptive Engine acts by providing
    learners with customized learning resources, which can match their current micro
    learning context, personal demands, learning styles and preferences. It is the
    core of the proposed system, which embeds machine learning technologies to realize
    the adaptive mechanism (Al-Hmouz et al., 2010; Bouyia & Demetriadis, 2012).


    The `MLaaS` will also expose its functions over the mobile Web with a standard
    service-oriented architecture specification, and it is interoperable with other
    SaaS and Web services in the PLE.


    ## B. Working Principle


    Basically, the offline computation runs on a basis of compound transactions. When
    a learning activity launches, a compound transaction is generated associated with
    it, which can be therefore represented as:


    `{Learner Profile, Micro OER profile, Association}`


    where a learner profile and an OER profile are involved, linked by an association
    showing the learner’s properties against the micro OER. Common OER delivery systems
    apply user ratings, preferences, click-through rates or popularities as explicit
    properties. Those systems usually adopt top-N recommendations so that a learner
    can have quite a few candidate learning resources. Unfortunately, according to
    a study in recommender system, very few learners cooperate in the rating process
    (Su et al., 2010). Thus, the offline computation is responsible to transform implicit
    user behaviours into explicit information (Sun et al., 2015).


    A knowledge base acts as the think tank of the system and works behind the Adaptive
    Engine (Sun et al., 2017). Basically, the knowledge base is in charge of the semantic
    construction and storage of the learner profile and OER representation (Sun et
    al., 2017).


    Adopting ontologies as the basis of the learner profile is crucial in addressing
    the cold start problem in micro OER delivery. It allows the initial learner behaviour
    to be matched with existing and pre-built knowledge in the ontologies and relationships
    among them. The semantic learner model will use a machine learning-based approach
    to acquire, represent, store, reason and update each learner’s profile. It enables
    MLaaS to consider individual learning styles, learner’s context, application capabilities,
    and teaching materials structure, leading to a customization of the type and delivery
    format of learning information in response to the user. Similarly, an augmented
    micro OER ontology will also be built, where every micro OER is measured in regards
    to its functional attributes and non-functional (QoS) attributes of the Web service
    it belongs to (Sun et al., 2015; Wang and Shen, 2016).


    In the next [Chapter 4](#Chapter4.xhtml), we will present a comprehensive learner
    model for micro open learning (Sun et al., 2015). This model involves features
    that can impact and constrain the micro learning experiences and outcomes, and
    is enclosed in an ontological representation (Sun et al., 2016; Sun et al., 2017).
    By taking advantage of the comprehensive learner model, the `LearnerProfile` can
    be broken down to:


    `{InternalFactors, ExternalFactors} = {IntellectualFactors & NonIntellectualFactors,
    ExternalFactors}`


    where the internal factors can be classified into personal intellectual and non-intellectual
    factors, differentiated by whether a factor is related to a learner’s cognitive
    and intelligence level or not. External factors come from the environmental and
    social-economical contexts. Given the OER delivery has a ‘big data’ context, ideally
    there could be sufficient data sets to be used in data modelling and machine learning,
    and rule mining is compulsory to impute unknown values for online-prediction.
    Associate rule learning is adopted to realize the discovery process. In particular,
    multi-relation association rule discovery (Reza et al., 2014), context based association
    rule discovery (Shaheen et al., 2013), sequential pattern mining (Mabroukeh &
    Ezeife, 2010) and so on are employed. The detailed rule discovery strategy will
    be introduced in the [Section 5.2](#Chapter5.xhtml#sec5.2). The rules can be represented
    as:


    `{LearnerProfile, MicroOERProfile} -> {Association}`


    Technically rule mining and learner clustering operation runs throughout all the
    offline computation process. Therefore, the problem of missing values in collected
    data can be overcome without much difficulty.


    As aforementioned, the core of MLaaS, namely the Adaptive Engine, processes the
    results from all other services and transmits its output to the user interfaces
    straightforward.


    However, a big challenge appears in the real MLaaS applications. The initial MLaaS
    system has insufficient information about the learners, because both ‘OER’ and
    ‘learner’ are new to this emerging educational setting. This brings serious difficulties
    to launch the data processing work. The profile construction is not feasible without
    any information about the learner at the commencement of micro open learning.


    ## C. Assembling Complete Micro Open Learning Experience


    In a mobile service environment, it is feasible to utilize EDM and LA to identify
    micro learning resources which have similarities (Wang, 2008; Markellou et al.,
    2008). In addition, based on learners’ historical learning records, the sequence
    by which learners go through resource chunks can be sorted out. In open learning,
    especially MOOC learning, various providers or universities may offer the same
    course with considerably different contents and section divisions. It is possible
    to learn cross several available course sections from different providers and
    synthesize such pieces to assemble a complete learning experience for a specific
    MOOC course.


    There are strict sequences among some courses sections, which can be pre-defined
    by course providers (Tam et al., 2014). In other cases, sequences are just suggestive,
    and some learners can acquiesce in such sequences on the basis of others’ recommendation
    and experiences if these are retrievable (Chen, 2008). EDM and LA can contribute
    to explore latent learning paths from historical cases and expose them to all
    MOOC learners.


    There are many other ways that micro learning paths can be formalized via OER
    (Idris et al., 2009). The key considerations are that the learning activities
    should be short, available on-demand, or immediately relevant to a job task for
    employees.


    Building and optimizing learning path are undertaken by the Learning Resource
    Repository Service, Concept title and description need to be extract from the
    concerned course materials manually. Thereafter, key words are worth to be extracted
    to deduce the importance of keywords through a document classification technique.
    The algorithms similar to the one proposed in the study (Matsuo & Ishizuka, 2004)
    could be utilized in our co-occurrence statistical information based keyword extraction.
    Assume that there are m keywords and key phrases in total being extracted from
    all n sets of course materials, an m-dimensional Euclidean space can be constructed
    accordingly. Each micro learning resource chunk can be parameterized as a keyword
    vector, which represents the corresponding concept in the m-dimensional Euclidean
    space, with each dimension representing the importance of a keyword in the relevant
    course. Similarity calculation (e.g. Pearson correlation coefficient or the cosine
    similarity) will then be applied to measure the correlation coefficient between
    two resource chunks.


    ![image](images/ch3-fig3.jpg)

    '
