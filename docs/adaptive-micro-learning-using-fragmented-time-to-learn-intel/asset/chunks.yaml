    一些研究人员怀疑开放在线课程和开放教育资源（OER）交付可能无法实现其承诺，因为传统课程的许多方面（例如小组讨论和与教师的面对面互动）在开放在线模式下无法发挥作用（Franzoni
    & Assar, 2009）。OER 让人们能够在任何时间、任何地点、以任何形式获取信息，但关键挑战不仅在于在正确的时间传输正确的内容，还在于以正确的方式来实现它。OER
    提供者已经意识到，目前的开放学习平台既无法保证学习者享受其学习体验，也无法在开放且连接的环境中获得其学习结果的及时反馈。几个关键领域被认为是未来混合式学习应用的关键：新的移动应用程序、通过翻译和地理伙伴关系分进行更深层次的国际化扩张、支持第三方应用和集成的在线课程平台，以及鼓励学生之间更多协作的新功能（Pinola,
    2011）。OER 提供者试图确保内容以统一的方式呈现，而环境可以由教师进行配置；课程易于管理；考试是标准。然而，现实情况仍不尽人意，因为在线课程缺乏对这些目标的适当控制、验证或监控（Kukulska-Hulme,
    2013）。


    课程教师在将其先前的教学策略直接迁移到这种新的混合学习环境面临着一些障碍。尽管利用移动云端学习和即将推出的移动应用带来了许多优势，但由于环境的不确定性（例如不可预测的网络带宽）和特殊性（例如不同的操作系统），非移动设备的学习资源无法直接适配到移动设备。


    在一些 MOOC 课程中，教师借用微学习（micro learning）的原则来重新设计他们的课件和相关设置。他们的行动包括对课程材料进行分块并重新包装，以便让学习者在短时间内轻松地完成整个学习分块，理想情况下这个时间不应超过
    15 分钟（Kovachev et al., 2011）。他们更倾向于使用测验或游戏来连接两个分块（Guo et al., 2014）。然而，这些努力仍处于尝试阶段，尚未应用于大规模的
    OER 生产和交付。


    MOOC 仅仅是 OER 的子集，这意味着 OER 的规模远比“大规模”还要大。同时，OER 随着大数据时代正蓬勃发展。随着 MOOC 用户达到数百万，与
    OER 相关的数据快速生成，且在学习者、课程、教育机构、网络和技术细节等方面，用户持续呈几何级增长。面对 OER 中可用学习材料指数级增长带来的海量选择，学习者可能感到非常困惑，无法在早起或晚期选择合适的课程进行学习，特别是当他们只准备一次投入短期努力并必须立即做出决定时。同样，如何在众多可用资源中设定并选择合适的目标和方向，对
    OER 提供者和教师都带来了挑战。微学习可以作为“推送型”应用的一部分，其中教师决定在何时何何地交付哪些学习单元；也可以作为“拉取型”应用，其中学习者决定在何时以及如何访问学习资源（Guo
    et al., 2015）。然而，开放学习大多是远程和在线模式，而学习者具有高度的地理多样性。因此，开放学习教师很难及时提供反馈。教师的指导也无法适应参加同一门课程的所有学习者。


    这一问题在移动学习（m-learning）中更加明显，因为设备本身可能会导致干扰，如电话电话、电子邮件提醒和社交网络应用（例如 Facebook、Twitter
    和 WhatsApp 等）。平均移动用户的注意力跨度也短（Kunznekoff & Titsworth 2012; Chen & Lin, 2016）——大多数人在移动网络上冲浪时只看标题，比起长文章更倾向于碎片化的内容。


    使用移动设备进行微学习需要学习者的专注和反思。然而，在移动中学习时，外部环境可能会带来干扰，因为更容易发生意外状况。这给移动学习者带来了高度碎片化的学习体验。为了应对这种分心的学习体验，学习者需要更多的注意和反思。因此，学习内容应该能够与学习者即时互动，即首先给他们感兴趣的内容（Sarrab,
    2015）。研究人员认为，移动设备的小屏幕尺寸限制了信息的传输，不同类型的学习内容也会对知识吸收产生不利影响（Chen & Lin, 2016）。因此，必须通过消除任何无关或装饰性的材料来避免认知负荷，这些材料只会将学习者的注意力从实际信息上转移。此外，在微
    OER 中，最重要的信息需要首先提到或放在显眼位置。这可以帮助用户吸收关键信息，即使他们无法一次完成一个模块。


    在微开放学习中，每个学习活动被预期是短小但完整的，每个 OER 分块都需要作为一个独立的模块可用（Gassler et al. 2014）。换句话说，每个微
    OER 必须自包含并可以独立使用。此外，提出的微 OER 能够聚合，它们可以被分组或重新组合成更大的内容集或相似主题的集群（Cakula & Sedleniece,
    2013）。


    研究人员和从业者对开发基于人工智能的系统以支持自适应学习感兴趣（Adamopoulos, 2013）。结合了用户数据分析以响应个人学生表现的在线学习系统将创建自适应学习环境（Daradoumin
    et al., 2013）。有少数研究（包括我们的试点工作，Al-Hmouz et al., 2010）探索了用于学习资源适配的智能系统。这些工作重点关注大学水平的电子/移动学习，没有考虑更广泛的开放学习场景（Wang,
    2008）。还发现某些措施对于实现整门课程的自适应学习是有效的，但由于个人学习者在整个课程期间的时间安排不同，这些措施对于碎片化的学习活动是不可行的。


    O O 提供者和自适应开放学习系统都必须在实现最大化 OER 优势的目标方面发挥重要作用。对于 OER 提供者/教师，特别是 MOOC 教师和课程设计者，他们需要重新设计教学大纲，将整个课程拆分为较小的单元并预装相关设置。对于自适应开放学习系统，主要问题是如何使
    OER 微型，并引导学习者持续地采取正确的步骤，从而形成带来良好成果的足迹。这也是我们在工作中尝试弥补的主要差距。


