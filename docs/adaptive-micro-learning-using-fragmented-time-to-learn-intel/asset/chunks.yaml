- fmt: "\nwhere `d[j,Loa]` is the self-identified degree of distraction the learner\
    \ `L[j]` felt in the location `Lo[a]`, acquired by mandatory request. This follows\
    \ the expectation that the learners who have a similar general situation (i.e.\
    \ social factors) and surroundings (i.e. environmental factors) are in high probability\
    \ to have a similar degree of distraction, and the disruption levels come from\
    \ the same location are not do vary considerably.\n\nThe confidence degree for\
    \ the predicted distraction is depicted as `CD(D[i,Loa])`.\n\n# 6.2 Online Computation\
    \ Process for Cold Start Problem\n\n## 6.2.1 Integration of Recommendation Results-Cold\
    \ Start Problem\n\n### A. Downwards Propagation\n\nIn Section 5.4 we have obtained\
    \ the preference of a learner on an ‘entire’ OER rather than on a micro OER, now\
    \ the preference values are again propagated downwards the ontology hierarchy.\
    \ Consequently, each micro OER node receives an estimated preference value from\
    \ its ancestor. This propagation process is executed with a decay factor. For\
    \ each micro OER the final preference value, `P[u,j]`, can be calculated using\
    \ the following equation (3).\n\n![image](images/ch6-Eq3.png)\n\nwhere `R` is\
    \ the set of all the nodes in the higher hierarchy than `MR[u], R[v]` is a direct\
    \ ancestor of node `MR[u]` and `Q(u,v)` depends on the count of level between\
    \ `MR[u]` and `R[v.]`.\n\n![image](images/ch6-Eq4.png)\n\nand the confidence degree\
    \ for the descendant node, in regards to the `P[u,j]`, is calculated as the average\
    \ of the confidence values in its ancestors, decreased by a decay factor, `μ`.\
    \ \n\n![image](images/ch6-Eq5.png)\n\nAs far as all values of the three attributes,\
    \ namely denoting preferences, instant time availability and degree of distraction,\
    \ in the set `ML` are settled, a lightweight learner profile is completely constructed\
    \ from the initially scarce information by the MLaaS.\n\n### A. Micro OER Screening\
    \ and Rules\n\nFor each micro OER, once MLaaS has acquired its final preference\
    \ value and confidence degree, those nodes, which do not meet the minimum requirement\
    \ of confidence degree, is rejected by the system.\n\nWhen generating a list of\
    \ recommended micro OERs, the ones with higher learners’ interests are placed\
    \ at the top. For two micro OERs `MR[u]` and `MR[w]`, their sequence is determined\
    \ according to some heuristic rules which are defined in accordance with the extraction\
    \ of three types of relations discussed in the Section 4. These rules are executed\
    \ sequentially with priority.\n\n1. If there is a `RequiredSequence` relation\
    \ between these two micro OERs, the prerequisite one is placed above (refer to\
    \ the Section 4).\n2. If the preference regarding these two OERs, `P[u,j], P[w,j]`,\
    \ the former one is higher than the latter one, then the `MR[u]` is above `MR[w]`.\n\
    3. If, in the absolute terms, the confidence degree `CD(P[u,j])` is high and the\
    \ `CD(P[w,j])` is low, then the `MR[u]` is above `MR[w]`.\n4. If there is a `RecommendedSequence`\
    \ relation between these two micro OERs, the one which is suggested to be accessed\
    \ first is placed above (refer to the Section 4).\n5. The micro OER, which is\
    \ more related to the learners’ education background, or falls in the relevant\
    \ disciplines or inter-disciplines is placed with priority if the disciplinary\
    \ difference between these two candidate micro OERs is obvious.\n6. Otherwise\
    \ the recommended micro OER list is randomly ordered if none of the above rules\
    \ applies. \n\nHerein, the first rule is deemed as a hard rule which should be\
    \ strictly obeyed, and the rest rules are soft rules which can be violated with\
    \ educational consideration, from case to case.\n\n### C. Optimization of Recommendation\
    \ Results\n\nMLaaS consumes the value `P` and `D` in conjunction with their `TA`\
    \ to compare with the attributes and requirements annotated in the metadata of\
    \ the augmented OER ontology.\n\nThe next step is to integrate the outcomes from\
    \ the previous algorithms described in above Sections; a fitness function will\
    \ convert these selected multidimensional arrays, (i.e. numerical values of features\
    \ proposed in the lightweight profile) into one variable. Hence, this problem\
    \ is hereby properly transformed to a multi-objective optimization problem.\n\n\
    The basic idea of the ultimate micro OER recommendation is that, given each recommended\
    \ micro OER serving as the commencement of micro open learning is supposed to\
    \ be followed by a series of micro OERs to form a complete learning path, we name\
    \ it as the first object in a learning path. For this reason, to initiate the\
