    \ dimensional element *ML[j]* {*P[u,j]*, *TA[j]*, *D[j]*}is exclusive to *j*^(th)\
    \ learner during the micro learning process. Herein, the element *P[u,j]* indicates\
    \ the learner’s preference, *TA[j]* indicates the *j*^(th) learner’s instant time\
    \ availability, and *D[j]* denotes the level of distraction in terms of the given\
    \ learning environment and surroundings.\n\nEach of these three features proposed\
    \ in the lightweight profile is associated with a confidence degree to reflect\
    \ its subjective relevance. For example, if an explicit information is provided\
    \ by the learner directly and appear as a number rather than a range, its associated\
    \ confidence degree is set to full.\n\nWhenever MLaaS gathers any information\
    \ from the learner’s learning process over OER, the learner profile will be updated\
    \ in regard to *ML[j]*.\n\n# 6.1.3.***Instant Time Availability***\n\nThe system\
    \ is able to obtain explicit information on how long the learner can (or would\
    \ like to) spend on a micro OER through mobile devices in the real time. As a\
    \ mandatory request, a learner is required to input his or her instant time availability\
    \ at the beginning of every micro learning activity.\n\nAccording to the system\
    \ setting, suggestively the instant time availability, *TA[j]*, is represented\
    \ by an integer from 1 to 15. However, if the learner is not sure how long s/he\
    \ is able to spend on the micro OER at once, s/he is free to leave a time span,\
    \ which can be continuous integers in the same range. \n\n# 6.1.4.***Preference\
    \ Propagation***\n\n![image](images/ch6-fig1.jpg)\n\nFigure 6.1. Partial View\
    \ of the Augmented Micro OER Ontology and Spreading Activation for a Learner’s\
    \ Preference on OER\n\n Given the cold start condition for the first micro OER\
    \ delivery, a learner is required to quickly mark down a preference on a specific\
    \ micro OER. Consequently, a spreading activation approach is applied to maintain\
    \ the preference against its parent node (i.e., the *R[v]* is the v^(th) OER where\
    \ the *MR[u]* derived from) as well as updating learner profile. It propagates\
    \ the learners’ preference upwards the hierarchy of micro OER ontology based on\
    \ activation values. In other words, the preference has been obtained from a micro\
    \ OER to its ancestor and spread in its superclass (i.e., OER) level. An example\
    \ of the spreading activation is shown in [Figure. 6.1](#Chapter6.xhtml#ch6-fig1).\n\
    \nA partial view of augmented micro OER ontology in ‘information technologies’\
    \ area is shown in Fig. 2. Particularly, it describes an ‘e-business’ OER from\
    \ an Australian provider, OpenLearning ([www.openlearning.com](http://www.openlearning.com)).\
    \ At the bottom level of the ontology, the nodes depicted with oval shape typically\
    \ conform to the standard of micro OER. The red integers shown in nodes with rectangle\
    \ shape are preference values from a learner versus target OERs. The Algorithm\
    \ 6.1 is proposed to execute the process of preference propagation.\n\n![image](images/105.jpg)\n\
    \n The normalization factor acts on preventing the propagated preferences from\
    \ escalating continuously to such an extent that exceeds a reasonable range, which\
    \ could result in difficulty of data processing in the forthcoming process. The\
    \ confidence degree for the propagated preference of OER is recorded as *CD (P[v,j])*.\n\
    \n# 6.1.5.***Distraction Prediction***\n\n# ***A. Demographic Classification***\n\
    \nIn the [Chapter 4](#Chapter4.xhtml) (Sun et al., 2015), we discussed the key\
    \ issues that  might cause distraction in micro open learning, which generally\
    \ came from two sides, the social side and environmental side.\n\nIn addition,\
    \ MLaaS investigates existing learners’ degree of distraction as reference, and\
    \ senses every learner’s location information through built-in functions in mobile\
    \ devices. Based on the given taxonomy and augmented ontology, we carry out a\
    \ demographic classification that aims to cluster learners into cohorts, in order\
    \ to match them with micro-pieces of OERs (Sorour et al., 2016).\n\nThe mechanism\
    \ of classification is designed as, learners who have similar static information,\
    \ involving employment and/or education background, occupation, and similar learning\
    \ environment/location, are more likely to experience a similar level of distraction.\
    \ For the same reason, their overall time availabilities would more likely fall\
    \ in the same range. Herein MLaaS tries to associate a learner into a pre-clustered\
    \ learner group, by applying the stereotyping technique to fulfil the requirement\
    \ of demographic classification.\n\nFor a newly joined learner, *L[j]*, an ensemble\
    \ method of a binary classifier and a one-against-all model is utilized to obtain\
    \ multi-class classification (Milgram et al., 2006; Galar et al., 2011), in order\
    \ to predict its category, *C[j]*. The system is trained with existing set of\
    \ learners, *L*. Typical binary classification techniques, i.e., C4.5 decision\
    \ tree (Kotsiantis, 2007; Polat & Gunes, 2009) or Naive Bayes classifier (Dalton\
    \ & Dougherty, 2013) can be employed to serve as the base algorithm (i.e. training\
    \ algorithm *F* in Algorithm 2 described below) in order to produce a suitable\
    \ classifier, *CF[k]*. A new learner *L[j]* is classified with the label *k*,\
    \ whose *CF[k]* produces the highest value of ŷ. Please note the ŷ refers to the\
    \ value of the objective function of the one-against-all classification.\n\nProvided\
    \ that the *L[j]* is categorized into its corresponding category *C[k]*, the *L[j]*’s\
    \ neighbourhood, *NB[j]*, is then calculated by the Algorithm 2. This aims to\
    \ match a new learner’s category with an existing learner’s category.\n\nThe Algorithm\
    \ 6.2 shows the process of demographic classification. \n\n![image](images/108.jpg)\n\
    \n Hence, the demographic classification is realized according to learners’ static\
    \ and location information. Once new learners join into the open learning scenario,\
    \ MLaaS responds immediately to classify them into clusters.\n\n# ***B. Similarity\
    \ Measure between Two Learners***\n\nMLaaS is responsible to find the similar\
    \ existing learners in the discovered demographic categories, so as to recommend\
    \ them micro OERs that were recognized as suitable to learn in a given time span,\
    \ situation and environment.\n\nLearners’ learning location information is sensed\
    \ from the location service embedded in the mobile devices. Thus, the similarity\
    \ between two learners, *L[i]* and *L[j],* is evaluated using the equation (1).\
    \ Please note the *L[j]* is a new learner and *L[i]* is one of his/her neighbour.\n\
    \n![image](images/ch6-Eq1.png)\n\nwhere *S[l]* is the similarity value of the\
    \ *l*^(th) attribute in the static part of learner profile and the *W[l]* is its\
    \ corresponding weight. *SLo[i,j]* denotes their similarity on location and *W[i.j]*\
    \ denotes the weight for location factor.\n\n# ***C. Distraction Prediction***\n\
    \nThe prediction of distraction starts at once a new learner accesses MLaaS. The\
    \ approach introduced in Section 5.5.1 applies firstly in the new learner clustering.\n\
    \nThen, in terms of the equation (2), the distraction value can be estimated in\
    \ accordance with the action that any member, *L[i]*, in the same cluster with\
    \ *L[j]*, indicates the predicted distraction level.\n\n![image](images/ch6-Eq2.png)"
