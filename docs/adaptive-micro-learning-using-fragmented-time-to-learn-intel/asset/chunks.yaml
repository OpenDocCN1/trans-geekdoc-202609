    As introduced in [Section 6.1](#Chapter6.xhtml#sec6.1), an established learning
    path is exclusive to a specific learner, e.g. `L[j]`, whose preference values
    in the matrix are selected. A `K` nearest neighbour (KNN) algorithm is able to
    cluster items with higher similarities with the new micro OER, `MR[n]`. Its neighbors
    form as a set, `G` (Airoldi et al. 2012). Consequently, the new micro OER preference
    prediction is calculated by the following equation (6.10):


    ![image](images/ch6-Eq10.png)


    ## B. Inserting New Micro OERs into Established Learning Path


    After identifying the neighbors of `MR[n]` and predicting `L[j]`’s preference
    onto it, a hill-climbing algorithm is employed in the approach to locate the appropriate
    place for the `MR[n]`. The new items will be inserted into established learning
    paths according to the Algorithm 6.4:


    ![image](images/115.jpg)


    It is notable that the Hill Climbing algorithm performs on the comparison of fitness
    can effectively abandon the learning paths with poor fitness by searching locally
    and reduces the times of iterations. This accelerates the overall speed of generation
    of learning paths with new micro OERs inserted.


    This approach does not examine throughout all elements in all matrices, hence
    its computing complexities and running time are acceptable for online computation
    which is in demand of fast response.


    ## 6.3 Real-Time Complementary Mechanisms


    The online computation copes with users’ near-term and real-time activities which
    have not been sorted in historical data repository. In addition to the ‘new user’
    cold start problem solving, it also holds a real-time algorithm in a ‘second’
    granularity, from the item view. This comes with two considerations. The first
    is to improve the recommendation performance over the micro OERs newly published,
    especially on the same day of that the learner access the MLaaS. Further to the
    approach introduced in the Section 6.2.2, it can increase the discoverability
    of new micro OERs even though they do not have any popularity or rating data recorded
    in the system. In addition, the most recent operations on a micro OER can reveals
    its recommendation value more correctly. As the online computation should respond
    in seconds, redundant offline algorithms need to be simplified considerably as
    the time is absolutely not allowed to examine through all learner-micro OER interactions.


    The algorithm simplification can be carried out by either row extension or column
    extension, or both, to the learner-micro OER matrix. Its major outcome is to update
    the profiles and the comprehensive learner model. The updating is not supposed
    to be executed at full-scale at the online computation side, while it is with
    clear purpose and highlight the ‘recentness’ of operations.


    For the column extension, the online computation domain inquires and retrieves
    a specific learner’s recent micro open learning behaviours, which is the list
    of the micro OER the learner has accessed in a very recent period. The corresponding
    names of the micro OERs in those usages are then filled into the `item` columns
    to complement the gap in the learner-micro OER matrix which has been horizontally
    expanded beforehand. This can eliminate the gap between new and old micro OERs,
    and solve the problem that the breadth of correlations among micro OERs cannot
    be split. It also acts on eliminating effects to the offline computational results
    caused by the correlations among old micro OERs which haven’t been accessed by
    the specific learner in the near- or real-time.


    For the row extension, the online computation domain targets on a specific micro
    OER and invoke the list of users who are accessing it in the real time. The corresponding
    names of the users in those access logs are then filled into the `user` rows to
    complement the gap in the learner-micro OER matrix which has been vertically expanded
    beforehand. However, the correlations in depth and breadth varying associated
    with the row extension is able to be split. In other words, the online computation
    and offline computation can be conducted separately, and there is not any data
    gap. Hence, technically it makes less sense than column extension.


    ## Summary


    When both the system and users are new, the lack of initial learner information
    in MLaaS brings difficulties to the commencement of adaptive micro open learning
    as well as MLaaS operation.


    In this chapter we introduced a novel approach to deal with the cold start problem
    in the recommendation of micro OERs. We primarily focused on the online computation
    construction against the sparsity of data.


    Our main contributions can be summarized as: we identified the cold start problem
    and innovatively adopted the degree of distraction as a reference index to make
    recommendation, associated with learner preferences. Sequentially, a detailed
    approach was provided to tackle the cold start problem by predicting these selected
    features in a mobile environment with fragmented time frames from the initial
    little-known information. Augmented semantic profiles of OERs and lightweight
    models of learner-micro OER were built accordingly to model the structure and
    features of learners’ and micro OERs’ information. Based on the above works introduced
    in the [Section 6.2](#Chapter6.xhtml#sec6.2), a workable heuristic algorithm based
    approach was also presented in the Section 6.3.1.


    Moreover, we also addressed the ‘new item’ cold start problem by coming up with
    a solution to insert newly published micro OERs into established learning paths,
    which was solved by the Algorithm 6.4. This algorithm was enhanced by a Hill Climbing
    approach to reduce the search scale.


    Lastly, the approach illustrated in the [Section 6.3](#Chapter6.xhtml#sec6.3)
    aimed to keep the comprehensive learner model up-to-date and enable the responses
    to learners being in second granularities.


    # Chapter 7


    ## Implementation and Empirical Evaluation


    Since the design and computation process of MLaaS have been detailed in previous
    chapters, in this Chapter 7 we will present the implementation and empirical evaluation
    for this research. At the beginning, we will roll out the topology and working
    principle of the MLaaS in the [Section 7.1](#Chapter7.xhtml#sec7.1). Following
    that we will evaluate the performance of the computation process in the [Section
    7.2](#Chapter7.xhtml#sec7.2). Algorithms for cold start will be executed first
    to identify the ideal size of top N recommendation, and pick up the optimized
    heuristic to serve as the core algorithm. The chosen algorithms will be consequently
    compared with established recommenders presented in literatures.


    ## 7.1 System Implementation


    ### 7.1.1 System Topology


    The topology of MLaaS is shown in [Figure 7.1](#Chapter7.xhtml#ch7-fig1). As a
    data-rich system, MLaaS will be able to exploit detailed learner activity data
    not only for recommending what the next micro learning activity for a particular
    student should be, but also for predicting how that student will perform on that
    learning content.


    In a pilot work of our team (Sun & Shen, 2013), we proposed peer-to-cloud and
    peer-to-peer models for resource sharing and storage in service-oriented contexts.
    Such models can have higher upload and download speeds than a traditional cloud
    model, user model or peer-to-server-peer model, and can be more robust to the
    failures of peers or servers in the cloud environment (Sun & Shen, 2013; Shen
    et al., 2011). Hence, we adopt this design and apply its concept as the topology
    of the new system.


