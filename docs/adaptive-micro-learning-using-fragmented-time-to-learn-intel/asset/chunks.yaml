- fmt: "\nAccording to the study conducted by Kolb and Kolb (Kolb & Kolb, 2005), learning\
    \ styles can be represented as concrete experience (feeling), reflective observation\
    \ (watching), abstract conceptualization (thinking) and active experimentation\
    \ (doing). However, because operations on mobile devices are relatively simple,\
    \ which are limited in input and output methods, these four learning styles are\
    \ difficult to be reflected straightway through monitoring learners’ operation.\
    \ Thus, identifying learners learning style requires extra efforts. For example,\
    \ some external approaches are feasible to employ, such as self-evaluation. In\
    \ addition, if learning activities in other open learning activities are specified\
    \ in terms of relevant learning styles, learners’ performance in an exact learning\
    \ activity can indicate their values on the corresponding learning styles.\n\n\
    # C. Memory Ability \n\nMemory ability can impact learning outcomes after the\
    \ retention and reproduction stages of learning (Bui & Myerson, 2014). For OERs\
    \ in the disciplines of culture, literature, arts, language and history, etc.,\
    \ memory ability is one of the key measures that can help learners transfer the\
    \ contents of online OERs into their own knowledge. It is particularly important\
    \ when learning these disciplines using fragmented time pieces (Xiong, 2015).\n\
    \n# 4.1.3. Intersection of Non-Intellectual and Intellectual Factors\n\n# A. Learning\
    \ Habits \n\nEach individual learner has a completely isolated structure of available\
    \ time and learning time. Learning times for on-campus instructor-led learning\
    \ mostly falls in day time. Unlike that, the mobile/micro open learning time spread\
    \ over all 24 hours of the day. Their personal situations affect their learning\
    \ habits, which refer to, in this research, how learners utilize their time on\
    \ open learning, in what way they get learning resources passed on, how often\
    \ they make pause and repetition, after how long they take a review, whether they\
    \ learn OERs offered from several providers in parallel, during what time stages\
    \ in a day they are more often to make open learning happen, and among those time\
    \ stages, when they are more often intending to adopt micro learning means.\n\n\
    # B. Learning Speed \n\nThis feature refers to the extent that learners spend\
    \ in going through a course chunk and finishing related tasks on average. It can\
    \ be estimated from their historical learning records.\n\n# C. Language Skill\
    \ and Preference \n\nLearners’ language skills and preference should be taken\
    \ into consideration to opt in/out their learning resources. Because most OERs\
    \ are in English so that identification for learners’ level of English skills\
    \ is essential. Alternatively, this service investigates whether they are preferred\
    \ to learn in their native languages or another second languages other than English.\n\
    \n# D. Degree of Distraction \n\nInternally it concerns a learner’s mood and emotion,\
    \ and it is highly correlated to the degree of disruption, which is a component\
    \ of the external factors (Dennen & Hao, 2014; Khaddage et al., 2015).\n\n# 4.1.4.\
    \ External Factors\n\n# A. Learning Locations and Environments \n\nThe ways how\
    \ learners get connected to Internet apparently reveal their learning locations\
    \ and surrounding environments. Generally in micro learning scenarios, they are\
    \ brought to Internet through wireless networks by two means, namely `Wi-Fi` or\
    \ mobile cellular network (e.g. `4G`, `3G`, and `GPRS`). Simply, connecting to\
    \ internet through mobile network means learners are taking on learning activities\
    \ ad hoc, the strength changes of the mobile signals can reflect their statuses\
    \ of being on-the-go.\n\n# B. General Situation \n\nGeneral situation regarding\
    \ learning context partially affects their learning experiences and achievements.\
    \ Information regarding mobile devices must be specified in order to fulfil micro\
    \ learning demands (Tortorella & Graf, 2012).\n\n# C. Assistance from Collaborative\
    \ Learning \n\nEncouraged by the nature of how open learning is structured and\
    \ OERs’ pedagogical concept, learners can get helpful information from social\
    \ network activities (Ji et al., 2016).\n\n# D. Degree of Disruption \n\nThe degree\
    \ of disruption depends on noise factors from their surroundings, comfortableness\
    \ with the setting and layout of OER delivery (Christensen, 2003).\n\n# 4.2 Micro\
    \ Learning Content\n\n# 4.2.1. Micro OER Categorization and Customization\n\n\
    # A. Ready-made Micro OERs\n\nOpen learning has changed the expectation of learners\
    \ and the technologies that support open learning can also support micro learning.\
    \ Now that open learning has expanded, in both size and format (i.e., OERs have\
    \ evolved and now the acronym encompasses many types of courses), OER providers\
    \ offer several options for training departments or education providers and agencies\
    \ to implement micro learning paths within an organization, and for learners to\
    \ build up their own learning schedule with full of varieties and joys (Lourdes\
    \ & Albert, 2013). Some typical learning resources involve short videos and other\
    \ visual learning resources, spaced repetition and practice activities, communication\
    \ and collaboration environments, and credentials and gamification. Therefore,\
    \ if micro learning resources are well-defined within short time length (i.e.\
    \ 15 minutes), they are normally delivered right away.\n\n# B. Non Micro OERS\n\
    \nHowever, most achievable MOOC contents are non-micro learning resources, which\
    \ need to be refined properly. These contents need further processing and revision\
    \ to fulfil micro learning demands.\n\n- Visual encyclopedia: Learning key points\
    \ are listed out in terms of the knowledge structure of the entire course. For\
    \ each key point, a video or textual material is set up without time limit to\
    \ clearly illustrate the self-contained content.\n\n- Logical segmentation of\
    \ courseware and course videos: Herein each unit covers the complete in-formation\
    \ of a learning section, which includes the conditions of beginning and end, carries\
    \ coherent contents, and can be studied individually.\n"
  raw: "According to the study conducted by Kolb and Kolb (Kolb & Kolb, 2005), learning\
    \ styles can be represented as concrete experience (feeling), reflective observation\
    \ (watching), abstract conceptualization (thinking) and active experimentation\
    \ (doing). However, because operations on mobile devices are relatively simple,\
    \ which are limited in input and output methods, these four learning styles are\
    \ difficult to be reflected straightway through monitoring learners’ operation.\
    \ Thus, identifying learners learning style requires extra efforts. For example,\
    \ some external approaches are feasible to employ, such as self-evaluation. In\
    \ addition, if learning activities in other open learning activities are specified\
    \ in terms of relevant learning styles, learners’ performance in an exact learning\
    \ activity can indicate their values on the corresponding learning styles.\n\n\
    # ***C. Memory Ability***\n\nMemory ability can impact learning outcomes after\
    \ the retention and reproduction stages of learning (Bui & Myerson, 2014). For\
    \ OERs in the disciplines of culture, literature, arts, language and history,\
    \ etc., memory ability is one of the key measures that can help learners transfer\
    \ the contents of online OERs into their own knowledge. It is particularly important\
    \ when learning these disciplines using fragmented time pieces (Xiong, 2015).\
    \ \n\n# 4.1.3.***Intersection of Non-Intellectual and Intellectual Factors***\n\
    \n# ***A. Learning Habits***\n\nEach individual learner has a completely isolated\
    \ structure of available time and learning time. Learning times for on-campus\
    \ instructor-led learning mostly falls in day time. Unlike that, the mobile/micro\
    \ open learning time spread over all 24 hours of the day. Their personal situations\
    \ affect their learning habits, which refer to, in this research, how learners\
    \ utilize their time on open learning, in what way they get learning resources\
    \ passed on, how often they make pause and repetition, after how long they take\
    \ a review, whether they learn OERs offered from several providers in parallel,\
    \ during what time stages in a day they are more often to make open learning happen,\
    \ and among those time stages, when they are more often intending to adopt micro\
    \ learning means.\n\n# ***B. Learning Speed***\n\nThis feature refers to the extent\
    \ that learners spend in going through a course chunk and finishing related tasks\
    \ on average. It can be estimated from their historical learning records.\n\n\
    # ***C. Language Skill and Preference***\n\nLearners’ language skills and preference\
    \ should be taken into consideration to opt in/out their learning resources. Because\
    \ most OERs are in English so that identification for learners’ level of English\
    \ skills is essential. Alternatively, this service investigates whether they are\
    \ preferred to learn in their native languages or another second languages other\
    \ than English.\n\n# ***D. Degree of Distraction***\n\nInternally it concerns\
    \ a learner’s mood and emotion, and it is highly correlated to the degree of disruption,\
    \ which is a component of the external factors (Dennen & Hao, 2014; Khaddage et\
    \ al., 2015). \n\n# 4.1.4.***External Factors***\n\n# ***A. Learning Locations\
    \ and Environments***\n\nThe ways how learners get connected to Internet apparently\
    \ reveal their learning locations and surrounding environments. Generally in micro\
    \ learning scenarios, they are brought to Internet through wireless networks by\
    \ two means, namely Wi-Fi or mobile cellular network (e.g. 4G, 3G, and GPRS).\
    \ Simply, connecting to internet through mobile network means learners are taking\
    \ on learning activities ad hoc, the strength changes of the mobile signals can\
    \ reflect their statuses of being on-the-go. The logon data of Wi-Fi portal may\
    \ also determine learners’ exact indoor learning places. Normally connecting Internet\
    \ via Wi-Fi provided in public places rather than homes indicates learners are\
    \ possible to experience higher frequency of interruptions as their surrounding\
    \ environments can be more noisy and complicated.\n\n# ***B. General Situation***\n\
    \nGeneral situation regarding learning context partially affects their learning\
    \ experiences and achievements. Information regarding the mobile devices and mobile\
    \ OSs the learners utilized to carry out micro open learning must be specified\
    \ in order to determine devices capabilities, features and limitations (Tortorella\
    \ & Graf, 2012).\n\n# ***C. Assistance from Collaborative Learning***\n\nEncouraged\
    \ by the nature of how open learning is structured and OERs’ pedagogical concept,\
    \ learners can get helpful information from P2P learning which can be collaborative\
    \ learning, virtual social activities over social network and assimilating knowledge\
    \ from content generated by other learners (Ji et al., 2016).\n\n# ***D. Degree\
    \ of Disruption***\n\nThe degree of disruption depends on the noise and interference\
    \ factors from their surroundings, conflicts with their daily works, comfortableness\
    \ with the setting and layout of the OER delivery platforms, course design and\
    \ so on (Christensen, 2003). \n\n# 4.2Micro Open Learning Content\n\n# 4.2.1.***Micro\
    \ OER Categorization and Customization***\n\n# ***A. Ready-made Micro OERs***\n\
    \nOpen learning has changed the expectation of learners and the technologies that\
    \ support open learning can also support micro learning. Now that open learning\
    \ has expanded, in both size and format (i.e., OERs have evolved and now the acronym\
    \ encompasses many different types of courses), OER providers offer several options\
    \ for training departments or education providers and agencies to implement micro\
    \ learning paths within an organization, and for learners to build up their own\
    \ learning schedule with full of varieties and joys (Lourdes & Albert, 2013).\
    \ Some typical learning resources involve short videos and other visual learning\
    \ resources, spaced repetition and practice activities, communication and collaboration\
    \ environments, and credentials and gamification. Therefore, if micro learning\
    \ resources are well-defined within short time length (i.e. 15 minutes), they\
    \ are normally delivered right away.\n\nFor these well-designed resources, specific\
    \ EDM schemes can be developed to establish a recommendation model for students\
    \ in similar situations in the future, for grouping web documents using clustering\
    \ methods in order to personalize e-learning based on maximal frequent item sets;\
    \ for providing personalized course material recommendations based on learner\
    \ ability and to recommend to students those resources they have not yet visited\
    \ but would find most helpful (Romero & Ventura, 2010).\n\n# ***B. Non Micro OERsz***\n\
    \nHowever, most achievable MOOC contents are non-micro learning resources, which\
    \ need to be refined properly. These contents need further processing and revision\
    \ to fulfil micro learning demands, which can be instructor-led or computer-based.\n\
    \nThe ultimate shapes of resources after processing are summarized as follows:\
    \ \n\n•Visual encyclopedia: Learning key points are listed out in terms of the\
    \ knowledge structure of the entire course. For each key point, a video or textual\
    \ material is set up without time limit to clearly illustrate the self-contained\
    \ content. Because the content contained solely cover a particular scale, accordingly\
    \ the required learning time is short.\n\n•Logical segmentation of courseware\
    \ and course videos: Herein each unit covers the complete in-formation of a learning\
    \ section, which includes the conditions of beginning and end, carries coherent\
    \ contents, and can be studied individually."
