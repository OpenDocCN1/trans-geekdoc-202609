    \ the environmental and social-economical contexts. Given the OER delivery has\
    \ a ‘big data’ context, ideally there could be sufficient data sets to be used\
    \ in data modelling and machine learning, and rule mining is compulsory to impute\
    \ unknown values for online-prediction. Associate rule learning is adopted to\
    \ realize the discovery process. In particular, multi-relation association rule\
    \ discovery (Reza et al., 2014), context based association rule discovery (Shaheen\
    \ et al., 2013), sequential pattern mining (Mabroukeh & Ezeife, 2010) and so on\
    \ are employed. The detailed rule discovery strategy will be introduced in the\
    \ [Section 5.2](#Chapter5.xhtml#sec5.2). The rules can be represented as:\n\n\
    *{LearnerProfile, MicroOERProfile}*→*{Association}*\n\nTechnically rule mining\
    \ and learner clustering operation runs throughout all the offline computation\
    \ process. Therefore, the problem of missing values in collected data can be overcome\
    \ without much difficulty. \n\nAs aforementioned, the core of MLaaS, namely the\
    \ Adaptive Engine, processes the results from all other services and transmits\
    \ its output to the user interfaces straightforward.\n\nHowever, a big challenge\
    \ appears in the real MLaaS applications. The initial MLaaS system has insufficient\
    \ information about the learners, because both ‘OER’ and ‘learner’ are new to\
    \ this emerging educational setting. This brings serious difficulties to launch\
    \ the data processing work. The profile construction is not feasible without any\
    \ information about the learner at the commencement of micro open learning.\n\n\
    # ***C. Assembling Complete Micro Open Learning Experience***\n\nIn a mobile service\
    \ environment, it is feasible to utilize EDM and LA to identify micro learning\
    \ resources which have similarities (Wang, 2008; Markellou et al., 2008). In addition,\
    \ based on learners’ historical learning records, the sequence by which learners\
    \ go through resource chunks can be sorted out. In open learning, especially MOOC\
    \ learning, various providers or universities may offer the same course with considerably\
    \ different contents and section divisions. It is possible to learn cross several\
    \ available course sections from different providers and synthesize such pieces\
    \ to assemble a complete learning experience for a specific MOOC course.\n\nThere\
    \ are strict sequences among some courses sections, which can be pre-defined by\
    \ course providers (Tam et al., 2014). In other cases, sequences are just suggestive,\
    \ and some learners can acquiesce in such sequences on the basis of others’ recommendation\
    \ and experiences if these are retrievable (Chen, 2008). EDM and LA can contribute\
    \ to explore latent learning paths from historical cases and expose them to all\
    \ MOOC learners.\n\nThere are many other ways that micro learning paths can be\
    \ formalized via OER (Idris et al., 2009). The key considerations are that the\
    \ learning activities should be short, available on-demand, or immediately relevant\
    \ to a job task for employees.\n\nBuilding and optimizing learning path are undertaken\
    \ by the Learning Resource Repository Service, Concept title and description need\
    \ to be extract from the concerned course materials manually. Thereafter, key\
    \ words are worth to be extracted to deduce the importance of keywords  through\
    \ a document classification technique. The algorithms similar to the one proposed\
    \ in the study (Matsuo & Ishizuka, 2004) could be utilized in our co-occurrence\
    \ statistical information based keyword extraction. Assume that there are *m*\
    \ keywords and key phrases in total being extracted from all *n* sets of course\
    \ materials, an *m*\\-dimensional Euclidean space can be constructed accordingly.\
    \ Each micro learning resource chunk can be parameterized as a keyword vector,\
    \ which represents the corresponding concept in the *m*\\-dimensional Euclidean\
    \ space, with each dimension representing the importance of a keyword in  the\
    \ relevant course. Similarity calculation (e.g. Pearson correlation coefficient\
    \ or the cosine similarity) will then be applied to measure the correlation coefficient\
    \ between two resource chunks.\n\n![image](images/ch3-fig3.jpg)"
