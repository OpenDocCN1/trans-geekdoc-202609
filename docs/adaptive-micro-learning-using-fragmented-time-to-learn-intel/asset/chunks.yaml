    作为一个核心关注点，开放教育资源（OER）的典型产品——`MOOC` 目前正面临完成率低的问题。多个来源显示，平均只有 5% 到 15% 的参与者完成了课程，而大多数参加
    `MOOC` 课程的学习者最终选择了放弃（Nawrot & Doucet, 2014）。然而，一些作者认为，流失统计可能不能代表 `MOOC` 学习者的全部。这是因为存在不同的学生行为模式，进一步分析每个参与者的目标，可以对学习者在完成课程之外的时的不同个人目标提供额外的见解。因此，应该有不同的衡量标准来评估
    `MOOCs` 对个体参与者是否有效（Daradoumins et al., 2013）。可以认为的是，这主要是因为学习者未能进行有效的时间管理，导致他们受困于耗时以及与现实生活责任的冲突（Nawrot
    & Doucet, 2014）。


    另一个关键因素是，尽管付出了努力，但学习者认为并不容易找到他们所需的合适资源，或者所选资源不符合他们的预期。在 Chae 和 Jenkin 的研究（2015）中，参与者声称，在时间范围内发现和修改材料的机会非常不足。这一观点也得到了
    Armellini 和 Nie 调查结果（2013）的支持。他们声称，跨多个存储库寻找资源是非常耗时的，而且调整已找到的以满足其个人需求所花费的时间可能比寻找过程还要长得多。Harley
    等人（2010）发现，这种时间投入是学习者无法享受其开放式学习之旅的关键原因。在这种情况下，他们简单地放弃并寻找替代品，一些人则反复报名尝试新课程，直到最终找到他们偏好的课程（Khalil
    & Ebner 2014）。


    第三个原因是参与 `MOOC` 课程的学习者背景更加多样化（DeBoer et al., 2013）。一些 `MOOC` 学习者并没有明确的目标来完成整个课程获取学分，因为他们只想获取实际需要的特定知识。这些知识通常包含在小的课程单元中，或者在课程交付的中期阶段。因此，一旦他们对所取得的进展满意，就可能会在留下未完成的作业或测试的情况下退出（Daradoumins
    et al., 2013; Khalil & Ebner, 2014）。


    这可以解释为什么 `MOOC` 中的移动学习与其在校园和远程教育中的传统形式和模式有所不同。`MOOC` 的教学学习高度依赖于联结主义方法。团队合作、协作、沟通和同伴学习在
    `MOOC` 中具有重要的教育价值。然而，尽管移动云端学习和即将推出的移动 App 具有优势，但非移动设备的学习资源无法直接适配到移动设备，因为它们具有环境的不确定性（如不可预测的网络带宽）和特殊性（如不同的操作系统）。当有许多选项需要考虑时，学习者可能在首先或下一次选择学习哪门课程时感到无所措。此外，当
    `MOOC` 学习者作为一个小组实现学习目标时，增强学习者在协作学习中的团队表现起着重要作用。如何增强学习者的团队表现涉及多种教学概念，而且几乎没有任何基于
    Web 的工具支持。因此，一些研究人员非常担心开放在线课程可能无法实现承诺，因为传统课程的许多方面（如小组讨论和与教师的面对面交流）在 `MOOC` 格式中无法实现（Daradoumins
    et al., 2013）。此外，发现在 `MOOC` 课程过程中，学习活动频繁断续，许多学习活动是在碎片化的时间内完成的。换句话说，他们的学习过程变得碎片化或微型化。


    ## 2.3.2 基于 OER 的微学习


    标准的移动学习模型（如教师引导的或基于计算机的）看起来非常像大学课程，学习者被从正常的工作或生活环境中抽离出来，花费许多小时进行“学习”活动，而这些活动他们在日常生活中可能遇到也可能不遇到。然而，标准模型正被那些发生在正常工作环境内部且处于其正中心的学习方法迅速取代。这导致了人们对微学习产生的新兴趣，微学习本质上是指在极短的时间内进行的任何类型的学习。数字学习环境（如
    `MOOCs`）实际上可以为各种微学习活动提供框架。


    通过分析 690 万条视频播放记录，领先的 OER 供应商 `edX` 发现，长度小于 6 分钟的视频更有吸引力，而学生的参与度在 6 分钟后剧下降（Guo
    et al., 2014; Anderson et al., 2014）。无论视频的具体长度如何，观看时间的实际中位值为 6 分钟。此外，6-9 分钟的视频处于转折点，而较长的视频观看时间中位数较小。


    因此，根据现有调查 MOOC 学习者行为轨迹的研究，并不意外的是，MOOC 在某种程度上遵循了微学习原则，甚至 `MOOC` 通常是围绕微学习原则设计的，这使得学习者能够在短时间内完成“字节级”的学习（Guo
    et al., 2014; Anderson et al., 2014）。例如，一些课程材料已经按照简单到复杂的顺序进行了分块和排序，以便学生更快处理。理想情况下，单元不超过
    15 分钟。例如，连接两个课程单元的一种流行方法是在它们之间添加简单的评估，通常以测验、判断题或多选题的形式（Adamopoulos, 2013）。


    另一方面，如前面的 2.2 所，OER 学习强调协作和联结主义（Makness et al., 2013; Waard et al., 2012），学习者生成的内容在
    OER 交付中同样重要。人们认为微学习是开展问题学习和交换即时反馈的有效方式。OER 也为终身学习提供了必要的依据。微学习的“随用随学”模式让人们能够随时获取他们需要的或感兴趣的特定知识（Kovachev
    et al., 2011）。如果他们没有从 OER 提供者获取学分的需求，通过微学习他们仍然可以完成特定的学习内容，无需完成整个课程。这意味着微学习可以导致学科间更好的整合。


    ## 2.4 自适应学习：学习者建模与 EDM & LA


    ### 2.4.1 学习者建模


    学习者模型是个性化学习系统的关键要素（Conejo 等人 2011）。它通常包含一组描述学习者特征的结构化信息（Al-Hmouz 等., 2012）。为了为每个个体学习者提供个性化的学习体验，必须首先识别表示学习者和课程材料的方法，以便系统推荐更符合学习者兴趣和当前知识水平的课程。


    #### a) 学习者模型的定义


