    A learner model is the representation of learner’s skills and abilities in computer
    systems and it enables learning system to adapt to special needs of the learner.
    A learner model commonly contains a learner’s important information, such as:
    domain knowledge, learning performance, interests, preference, goal, tasks, background,
    personal traits (e.g. learning style and aptitude), environment and other useful
    features. According to Kay et al. (1997), the learner model (also known as student
    model) is defined as “machine’s representation of its beliefs about the learner”.


    A learner model can contain two categories of information, domain specific information
    or domain independent information (Brusilovskiy, 1994). Domain specific information
    reveals the status or degree of knowledge and skills that learner obtained in
    certain knowledge domain. Domain specific information allows adaptive e-learning
    systems to organize a content related learner model, eliminate what learner already
    knows, and focus instruction or assessment on areas that the learner is weak at.
    Domain independent information represents information besides knowledge, such
    as learning goals, interests, learning styles and personal traits. Domain independent
    information is related to the learner profile data (e.g. learning style or personality)
    and it allows the system to serve optimal learning content sequences or presenting
    formats.


    # b) Modelling Learner’s Knowledge


    Domain specific information of a learner is organized as a knowledge model, which
    contains elements that the learner needs to learn (e.g. concepts, topic, and subject).
    Generally there are three different forms to model learners’ knowledge, namely
    vector model, overlay model, and fault model (Nguyen & Do 2008).


    *   **Vector model**: The vector model represents learner’s knowledge in a knowledge
    domain as a vector, whose elements can be concepts, topics or subjects. Although
    vector model is the simplest one of the three models, it is very efficient.

    *   **Overlay model**: The overlay model is one of the most popular and commonly
    used student models. The underlying assumption of the overlay model is that a
    learner can have incomplete but correct knowledge of certain knowledge domain
    (Chrysafiadi & Virvou, 2013). In the overlay model, learners’ knowledge is a subset
    of the domain knowledge, which is represented by an expert’s knowledge level of
    that domain. The differences between learner’s knowledge and domain knowledge
    are assumed to be the learner’s lack of knowledge, and the objective of learning
    is to eliminate these differences as much as possible (Bontcheva & Wilks, 2005).
    Similar to the vector model, each element in the overlay model is a number, which
    presents learner’s knowledge level against a certain topics or subjects.

    *   **Fault model**: The drawback of vector model and overlay model is that it
    cannot describe the misconception of learners over certain knowledge. Fault model
    can represent learner’s errors or misconceptions and the reasons why the learner
    has these errors (Baschera & Gross, 2010). From fault model, an adaptive learning
    system can infer what learning materials should be delivered to help learners
    learn new knowledge as well as eliminate misconceptions.


