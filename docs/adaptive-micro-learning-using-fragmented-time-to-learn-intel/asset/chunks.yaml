    Figure 4.1. Comprehensive Learner Model for Micro Open Learning


    ## 4.1.1. Personal Non-Intellectual Factors


    ### A. Learner Types

    The types of open learning learners vary evidently in accordance with their particular
    learning purposes and work, and life patterns. Their background information, though
    not always, can be searched from their registration and logon data (DeBoer et
    al., 2013; Kay et al., 2013). Some common types are:


    • Full time students in universities who prefer to learn distantly and electronically
    rather than attend lectures in person. They are willing to enjoy the convenience
    brought by the smart and portal devices.


    • Full time university students in developing countries where education is lower-developed.
    Because of scarce learning resources from their own universities, open learning
    gives them greater opportunities to remotely participate in classes provided by
    leading universities so that they can make step forward their daily learning and
    appreciate the advanced knowledge management and teaching approach.


    • Educators who work in universities in developing countries. They take OERs to
    obtain experiences from leading universities as well as learn how to teach in
    an efficient way to improve their own teaching approaches and flows.


    • Researchers who are following up the flow of OER delivery (e.g. MOOC courses)
    to explore potential defects in them, which result in barriers for learners to
    get knowledge passed on. Their goals are to refine the current OER teaching flows
    and to look for enhancing teaching approaches in a virtual manner. During the
    progresses when they are engaged in open learning, pauses are frequently made,
    and several specific sections of courses are retrieved repeatedly in terms of
    research demands.


    • Employees who are required by their corporations or organizations to take OERs
    for training purposes. Commonly they have a concentrate timeframe to complete
    OER learning. Their overall learning schedule is driven by their trainers and
    they have freedom to complete their allocated tasks continuously and arrange their
    time for each specific course units in place.


    • Employees who wish to enrich their knowledge or improve their skills by taking
    OERs in their off-work hours. Their final target is to become more competitive
    in workplace and they are generally self-motivated. Hence, they set targets and
    milestones for each learning period by themselves with relatively more freedom
    and autonomy.


    • Life-long learning pursuers. They can be employees whose open learning contents
    (e.g. MOOC courses) may not be closely related to their daily work, or they may
    be non-working persons such as housewives, elders or retired people (Blaschke,
    2012). Generally these kind of open learning learners are interest-driven (Cochrane
    et al., 2012).


    ### B. Time Availability

    Learners’ disposable time varies to a great extent, which is highly indicative
    for whether and how often these learners would adopt micro learning modes. Thus,
    their current time availability is better to be set as a mandatory request for
    them to input before they start each micro learning activity.


    ### C. Learning Engagement

    Anderson et al. argues that the more engaged learners got higher marks in their
    MOOC courses. Most of their findings depend on analyses of students’ participations
    and publications in the education forums provided with MOOC platforms (Anderson
    et al., 2014). They state that more engaged learners show more frequently in forums
    and are very positive to raise questions and attract other learners’ interests
    to join their discussion regarding the learning contents. It does not mean they
    are lower-performing learners and contribute less in forums to seek useful advices
    and experiences, while the lowest-engaged learners even do not appear in the forums.


    Past studies (e.g. (Milligan et al., 2013; Alario-Hoyos et al., 2014)) used quantitative
    methodologies to identify individual learner’s engagement in open learning and
    categorize them into cohorts in different ways. However, there lacks a unique
    definition for the extent of engagement of a learner. It is mainly measured in
    terms of a learner’s total online time length, frequency of login, submission
    of required assignments, participation in forums, completion of courses or course
    chunks, etc.


    Learners’ engagement can also be categorized into active or passive learning.
    The former refers to that learners are self-motivated to attend virtual classes
    in MOOC platform so that they look for and initiatively access open learning resources,
    which they need when they want; while the latter refers to that learners act as
    recipients of knowledge through information pushed by MOOC platforms or MOOC affiliated
    social medias, for example, they might have subscribed electronic reading materials.


    ### D. Progress Identification

    This is basically identified by breakpoints and milestones made by learners. In
    micro open learning, learning activities become disperse, and the contents in
    two continuous learning phases can be not rigidly restricted in accordance with
    the sequences in the course curriculum. Learners’ learning progress is not only
    confined into particular time points, but also categorized by taking their learning
    recentness into account. (Bruck et al., 2012)


    ### E. Learning Motivation and Purpose

    Basically in open learning learners are either interest-driven or task-driven.
    There learning purposes are identified by mandatory request data which means learner
    are suggested to input their learning purpose prior to the commencement of their
    open learning.


    ### F. Learning Preference

    Learning preference refers to learners’ subjective and affective opinion about
    learning contents. It can be sorted out through learners’ comments and tags made
    on resources they have accessed.


    ## 4.1.2. Personal Intellectual Factors


    ### A. Learner Pre-knowledge Assessment

    To build a profile for each learner and customize micro learning strategy for
    learners with different backgrounds and basis, a measure that is necessary to
    take in prior is to assess each learner’s background knowledge in terms of several
    standards. In micro open learning, it is suggested to investigate and identify
    their pre-knowledge level in terms of the extent of their education, their historical
    courses grades in MOOC, and results of pre-course quizzes which are easy to be
    quantized.


    A typical measure adopted by many e-learning systems is the pre-knowledge assessment
    (Xu et al., 2014) which refers to taking exams before learners commencing their
    courses. Although this is common to organize in on-campus courses, it is not feasible
    to directly migrant this into micro open learning as learners are more distributed
    and on-the-go.


    The outcomes of the pre-knowledge assessment are easy to be quantized. Hence,
    in micro open learning, it is suggested to investigate and identify their pre-knowledge
    level in terms of:


    • The extent of their education. This can give a general image of a learner’s
    academic background and capabilities of acquiring new knowledge.


    • Their historical courses grades in MOOC. This is to find learner’s performance
    in related courses in order to build a reference to predict at what level s/he
    can commence a new course.


    • Results of pre-course quizzes which are often in the form of multiple choices.
    It does not increase the difficulty of operation on mobile devices.


    ### B. Learning Styles

    Individuals differ in how they learn. Learning styles refer to the systematic
    differences in individuals’ natural or habitual pattern of acquiring and processing
    information in learning situations.

