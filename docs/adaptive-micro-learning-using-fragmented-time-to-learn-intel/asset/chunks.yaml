  trans: '


    浏览开放教育资源（OER）也存在问题，因为每个孤岛都有其自身的组织结构。某些孤岛无法与特定项目链接，这阻碍了信息的自由流动。开放课程（OCW）孤岛阻碍了知识的互操作性、发现、合成和流动。因此，教师、学生和自学者寻找资源时面临困难，有时他们会根据不完整的信息做出决策。链接数据（Linked
    data）具有在 OCW 数据孤岛之间建立桥梁的潜力（Nelson et al., 2014）。


    ## 2.4.3 教育大数据


    分析这些新记录需要新的技术来处理非结构化文本和图像数据、多源数据以及海量数据（“大数据”）。大数据没有固定的大小；任何用于定义它的数字都会随着计算技术的进步（处理更多数据）而改变。例如，Manyika
    等人将大数据定义为“大小超过了典型数据库软件工具捕获、存储、管理和分析能力的数据集”（Manyika et al., 2001）。


    新兴的“大数据”概念重视系统性和实时数据，而这些数据由于技术限制过去难以追踪和存储。因此，发现潜在模式变得可行，用以预测学生的成果，如辍学、对额外帮助的需求或对更高挑战性作业或课程设置的渴望（Picciano,
    2012）。通过这种方式，学习资源可以具有预测性和诊断性。换句话说，学习者在学习过程中的表现可以被评估，并进一步采用教学技术来针对个人学习者的特定需求定制学习。


    凭借从各种数字系统中汇编的统计信息，随着大数据趋势，开发了许多仪表板软件和数据仓库。得益于此，教育提供者能够对个体学习者以及整个机构的学习、表现和行为问题进行监控。数据可视化技术能够以简单且易于理解的界面汇总关键指标（Williamson,
    2016）。因此，学习的进展情况以及组织的运营情况会快速、直接地反映在这些仪表板上，来自各种数据流的数据被转化，呈现出清晰且全面的概览。


    大数据的利用将教育数据挖掘（EDM）和学习分析（LA）提升到了更有效、更高效的程度，其增长被证实将重塑未来一代学习的方式（Sin & Muthu, 2015）。


    ## 总结


    在本章中，我们回顾了与我们的研究相关的文献。在第 2.1 节中讨论了移动学习和微学习的背景以及距离学习的发展。第 2.2 节中总结了开放教育资源和开放学习的特征、优势以及教学设计问题。受这两种新学习趋势优势的启发，我们在第
    2.3 节中探索了利用微开放学习以提供更好学习环境和体验可行性。自适应学习实施中采用常用方法（例如学习者建模、EDM 和 LA）与大数据概念兴起带来的影响一起讨论，这些可以在第
    2.4 节中找到。


