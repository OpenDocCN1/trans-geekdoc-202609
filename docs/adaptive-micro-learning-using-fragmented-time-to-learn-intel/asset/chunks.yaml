- fmt: '

    Researchers believed that the over-rapid release of OERs may negatively influent
    the quality of resource (Davis et al., 2014), as participant OER providers are
    eager to occupy or keep a place in the highly competitive market (Cormier and
    Siemens, 2010). It is suggested that solid instructional design can ensure the
    quality of OERS (Nunez et al., 2014). To kick start a good instructional design,
    there are five fundamental principles underpin all contemporary models and theories
    (Merrill, 2002; Merrill, 2013; Collins, 2005; Nunez et al., 2017). They believed
    learning is promoted when: 1) learners acquire skills in the context of real-world
    problems; 2) learners activate existing knowledge and skills as a foundation for
    new skills; 3) learners observe a demonstration of the skill to be learned; 4)
    learners apply their newly acquired skill to solve problems; 5) learners reflect
    on, discuss, and defend their newly acquired skill. These fundamental principles
    have been extended by Margaryan (2008) to conform with the changes in modern education
    so that learning is further promoted when: 6) learners contribute to the collective
    knowledge; 7) learners collaborate with others; 8) different learners are provided
    with different avenues of learning which are according to their needs; 9) learning
    resources are drawn from real-world settings; 10) learners are given expert feedback
    on their performance. Corresponding to the sequences they were listed, these principles
    can be summarized as follows:


    (1) **Problem-centred**: The instructional effectiveness of a course will be enhanced
    if students solve real-world problems and if the task is divided into smaller
    ones of increasing complexity.


    (2) **Activation**: The instructional effectiveness of a course will be higher
    if its activities help students to link previously developed skills to its new
    knowledge. If those previous skills have not been developed, the course should
    begin by helping students acquire them.


    (3) **Demonstration**: When learners observe a demonstration of the skill to be
    learned, learning is promoted. The instructional effectiveness of a course will
    improve if examples of both poor and good practices are shown, and students are
    trained to differentiate between them.


    (4) **Application**: Instructional effectiveness will grow if students apply their
    knowledge in practical exercises, complementing the theoretical exams.


    (5) **Integration**: Instructional effectiveness will improve if students are
    able to integrate their knowledge into their daily lives and can demonstrate it
    to others.


    (6) **Collective Knowledge**: Inclusion of forums and other tools where students
    can exchange opinions, questions, and answers about the learning topic will improve
    instructional effectiveness.


    (7) **Collaboration**: Activities where students can work with others, and even
    perform peer-to-peer assessment, will increase instructional effectiveness.


    (8) **Differentiation**: Varied resources with different levels of complexity
    help customize the learning to individual students and thus enhance instructional
    effectiveness.


    (9) **Authentic**: Resources previously used in real projects, even if developed
    by professors, are highly recommended for sharing with students in order to increase
    instructional effectiveness.


    (10) **Feedback**: Comments on mistakes and opportunities for improvement should
    be offered to students after their assessments to boost instructional effectiveness.


    ## 2.2.3 Benefits of OER


    Open learning has the advantage of both informal learning and formal learning.
    Learners enjoy high flexibilities of online open learning because there is no
    strict time constraint for joining and quitting. Learners engaged in open learning
    are in different age groups and from various culture backgrounds, which are with
    a wide range of geographic distribution. Open learning also can bring learning
    opportunities to disadvantaged and excluded groups of learners for whom the accessibility
    of resources was previously unavailable.


    The cost-efficiency of OER is considerable and the adoption of OER is fully able
    to lower the cost for learners. It also has strengths in reducing duplication
    and promoting inter-institutional cooperation, co-creation and resource sharing,
    therefore saving time and effort for content development (Windle et al., 2010).
    Sharing development costs among institutions or OER providers becomes possible.
    This can also empower collaboration and creativity in OER production.


    The adoption of OER increases efficiency and quality of learning resources: teachers
    have easier access to high-quality learning resources; collaboration and sharing
    has the potential to further enhance the quality of learning resources and to
    foster pedagogical innovation due to exposure to large communities of learners
    and educator.


    A recent study found that OER contributes to the local and global community (Godwin-Jones,
    2014). Perryman et al. (2014) and Wolfenden et al. (2012) noted that the ability
    to adapt OER allows for not only adding or removing chapters based on the wishes
    of the instructor, but to make changes to the text to fit local culture and language
    better.


    ## 2.2.4 OER as a Service (Service-oriented OER Delivery)


    There are still some barriers for course instructors to migrate their previous
    teaching strategies to this new blended learning environment. Owing to the advantages
    of services oriented and mobile cloud-based learning and more and more popular
    mobile apps, delivering OER in a service-oriented mode has substantial potentials
    to be employed by OER providers. For example, as a trial case, OER as a Service,
    is not only believed to have potential in OER distribution, but also eases the
    process of service deployment and delivery (Corbi & Burgos, 2016; Hernandez et
    al., 2014). Service-oriented OER provision encloses the content service, technical
    service and customer service in a one-stop experience, by using cloud based tools,
    such as virtual containers (Corbi & Burgos 2016).


    ## 2.3 Micro Open Learning


    ### 2.3.1 M-learning in Open Learning


    Without a doubt, mobile learning is getting extensive acceptance by learners and
    gradually becoming a major learning means (Kim et al., 2006; Sun & Shen, 2014).
    The benefits of m-learning are well studied in numerous researches. As a result,
    most MOOC providers promptly released their mobile apps on mainstream mobile operation
    system (i.e. `iOS`, `Android` and `WP8`) and adapted their webpages to adapt the
    screen size and operation mode of mobile devices in order to catch the trend of
    m-learning and enable more convenient use for learners.


    OER providers try to popularize their courses and affiliated educational productions
    at full stretch. They are spreading out their available learning resources everywhere
    all around the world and they are leveraging m-learning to enable learners to
    easily participate in learning activities regardless the restriction of time and
    location. In addition, Mobile cloud-based learning allows learners to participate
    in open learning or open courses with mobile devices. Learners now have flexible
    options to access ‘big’ learning resources, whenever they want, wherever they
    are (Wang et al., 2014). However, they are still and often at loss. More specifically,
    although these courses can have a large number of learners enrolled at the very
    beginning, it is found that they gradually quit halfway. Researchers intend to
    look for the reasons why OER cannot fascinate learners throughout the overall
    process of course learning over OER and what elements make the journey feel long
    and tedious.

    '
