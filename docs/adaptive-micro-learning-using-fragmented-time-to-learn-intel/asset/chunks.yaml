    \nDetails of the pilot study can be referred to (Sun et al. 2015). Among these\
    \ findings, a noticeable future of OER is mastery learning. In mastery learning,\
    \ students demonstrate the understanding of a concept through repeated assessment\
    \ and exposure to material before moving on to the next lesson (Chen et al., 2013).\
    \ In many traditional classes, if a student attempts a homework assignment and\
    \ does not do well, he or she simply gets a low score on the assignment and instruction\
    \ moves to the next topic, providing the student a poor basis for learning the\
    \ next concept. The feedback is also often given weeks after the concept was taught,\
    \ by which point students barely remember the material and rarely go back to review\
    \ the concepts for better understanding. However, in the OER, the technology makes\
    \ it easy to provide immediate feedback on concepts students do not under-stand.\
    \ In many cases, Australian educators can provide randomized versions of the same\
    \ assignment, so that a student can restudy and reattempt the homework. According\
    \ to Chen et al. (2013), the instructor’s tools are designed to facilitate the\
    \ use of question banks with extensive randomization. This strategy is aligned\
    \ with general aim to leverage technology to support effective pedagogical approaches.\n\
    \nAnother important factor for educators is the ability of blended learning. Blended\
    \ learning (the strategic combination of face-to-face and online learning experiences)\
    \ is growing in popularity within higher education and is a new educational model\
    \ with great potential to increase student outcomes and create exciting new roles\
    \ for teachers (Poon, 2013). The Centre for the Support and Advancement of Learning\
    \ and Teaching in a reginal university of Australia, University of the Sunshine\
    \  Coast[^a](#Chapter3.xhtml#fn1), helps academic staff implement blended learning\
    \ strategies into their courses and programs to enhance the students ‘experience\
    \ and the quality of learning and teaching’. With this modern technology, teachers\
    \ no longer have to begin from scratch if they have a desire to teach using a\
    \ blended learning model. With the recent explosion of digital educational resources,\
    \ it is feasible to examine free resources, research the use of a learning management\
    \ system and be prepared for potential setbacks in the road on the blended learning\
    \ path (Chen et al., 2013). These ways can help a teacher dive right into blending\
    \ learning.\n\n# 3.2.2.***Research Motivation for Adaptive Micro Learning***\n\
    \nBy investigating current research gaps and challenges, and considering the natural\
    \ of mastery learning and blended learning of open learning, we are motivated\
    \ to pro-pose a study to introduce adaptive micro learning into open learning\
    \ scenarios to tackle the following problems:\n\n•Given learners are using micro\
    \ learning mode in random and self-regulated manner, we aim to provide them a\
    \ smart environment to be smartly engaged into open learning via mobile devices,\
    \ according to their current time availability.\n\n•This study is looking for\
    \ a solution to provide learners appropriate learning resources from the huge\
    \ pool where massive courses and affiliated contents are available. This new approach\
    \ can be used either for learners who wish to complete an entire course to get\
    \ credits, or those who just acquire the specific knowledge they actually need.\n\
    \n•For the former learners, this study structure knowledge points/course units\
    \ in series to assemble as entire learning experiences. Specifically, for low\
    \ completion rate of MOOC, they are able to make the best use of every fragmented\
    \ time pieces so as to conduct effective time management.\n\n•For the latter learners,\
    \ who are often quit half-way once they are satisfied with their learning achievement,\
    \ the proposed approach also  looks through and compares all course units provided\
    \ from different education institutions and further places their demands accurately\
    \ in or across parallel resources. This enables them to gain their task-related\
    \ knowledge or get skilled training in a short time.\n\n# 3.2.3.***Research Motivation\
    \ for Online Computation***\n\nMLaaS is influenced by the shortage of learner\
    \ information in the reality of OER deliveries where learners normally join the\
    \ learning processes in an ad-hoc mode, which hence leads to the difficulty in\
    \ making a computational decision of micro OER adaptations to learners’ real needs.\
    \ This motivated us to develop a novel solution to tackle the famous cold-start\
    \ problem, which will be introduced as one of the main contributions of this book\
    \ (Sun et al., 2017). This solution aims to build an online computation to evidently\
    \ support the first decision-making process of micro learning adaptation (Sun\
    \ et al. 2017).\n\n# 3.3Research Challenges\n\n# 3.3.1.***Research Challenges\
    \ in Micro OER Delivery***"
