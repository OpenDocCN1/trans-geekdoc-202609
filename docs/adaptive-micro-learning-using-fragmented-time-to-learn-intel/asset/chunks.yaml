    \ the learners’ profile.\n\nThe semantic construction of the learner model will\
    \ use a machine learning-based approach to acquire, represent, store, update and\
    \ infer (with the Adaptive Engine) each learner’s profile. It allows the system\
    \ to  consider individual learning styles, learner’s contexts, application capabilities,\
    \ and teaching materials structure, leading to a customization of the type and\
    \ delivery format of learning information in response to the user. The detailed\
    \ approach will be introduced in the next [Chapter 5](#Chapter5.xhtml).\n\n# Chapter\
    \ 5\n\n# Semantic Knowledge Base Construction: Education Data Mining and Learning\
    \ Analytics Strategy\n\nSince all decisions of micro OER adaptation are made by\
    \ the Adaptive Engine, it acts as the core of the offline computation system.\
    \ It consumes the results from all other services and transmits its output straight\
    \ to the user interfaces. For this reason, the MLaaS is conceived to meet the\
    \ standard of a data-rich system, and a knowledge base serves as its think tank.\
    \ Basically, the knowledge base is constructed using a top-down approach, by making\
    \ use of semantics means, from the pattern level to data level. In other words,\
    \ several ontologies are drawn at first, followed by ‘data processing’ work. We\
    \ attempt to combine the pattern and rule discovery processes of micro learning\
    \ with a survey of the education literature to produce features that could affect\
    \ the learning experience and outcomes in a mobile environment (Sun et al. 2015).\
    \ In detail, ‘data processing’ work involves all operations on data, from the\
    \ very beginning to the end, such as entity extractions, relationship extractions,\
    \ resolution disambiguation and so on.\n\nGiven that we have the overall system\
    \ framework in place (refer to the [Chapter 3](#Chapter3.xhtml)), we consequently\
    \ adopt a conceptual graph-based approach for dealing with the ontology construction\
    \ (Starr & de Oliveira, 2013; Xu et al., 2011). These graphs profile the features\
    \ that play a significant role in an ongoing micro learning process, and also\
    \ depict how features were mutually affected by and interrelated with each other.\
    \ According to our  design, the profiling procedure is carried out from two sides,\
    \ the learner side and the OER side.\n\nWhile the profiling proceeds forward,\
    \ some new problems appear which contradict our original design intentions. One\
    \ of the most important problems is that the system, MLaaS, knows little about\
    \ the learners, because either ‘OER’ or ‘learner’ is new to this emerging educational\
    \ setting. This creates serious difficulties for commencing the ‘data processing’\
    \ process. Profile construction is impossible with insufficient information about\
    \ the learner at the commencement of open learning. Therefore, the learner profile\
    \ cannot be fully filled in with valid data."
