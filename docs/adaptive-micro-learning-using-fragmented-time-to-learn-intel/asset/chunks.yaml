    # Chapter 3


    # Research Design


    The explosive growth of learning resources online, especially the massive open
    online course (MOOC) leads to a revolution of education and learning (Baggaley,
    2013). Educational professionals have strived extraordinarily on exploring the
    OER format as a regular pedagogical approach for mobile learning (m-learning)
    (Waard et al., 2011). However, as research and development of OER are still in
    its infancy, there are evidently many opportunities to improve the learning mechanisms
    in OER, such as more effective learning platforms and learning support services,
    to enable easier access and better experience for both service providers and learners.


    In our pilot study, we investigated the development trend and acceptance of OER,
    particularly in Australia, and analysed existing shortcomings as well as its potential
    improvement directions. Motivated by the observations from this investigation,
    we designed a mobile service-oriented system which targets on organizing a personalized
    learning environment (PLE) to support smart collaborative and micro open. In addition,
    we particularly concentrate on providing a better context and environment for
    both OER providers and learners to smartly deliver learners adaptive learning
    resources in small chunks, which are supposed to be learnt in relatively short
    time duration, and sequencing these courses chunks in series as an identified
    learning path. Therefore, learners will be able to make the best use of the fragmented
    pieces of time so as to effectively engage in the micro open learning.


    The rest of this chapter will introduce the design of our research, which will
    be organized as follows: it will start from the research background, where a personalized
    learning environment (PLE) built in  our previous work will be briefly demonstrated;
    the pilot study will be involved in the research motivation as expounded in the
    [Section 3.2](#Chapter3.xhtml#sec3.2); the challenges we were facing before we
    commence this research will be summarized in the [Section 3.3](#Chapter3.xhtml#sec3.3);
    after which the research purpose and research design will be rolled out in the
    following [Section 3.4](#Chapter3.xhtml#sec3.4), where example scenarios of micro
    OERs adaptation will be also taken for easier understanding; the system framework,
    which will serve as a basis of this research, can be inspected in the [Section
    3.5](#Chapter3.xhtml#sec3.5).


    # 3.1Research Background


    Open learning performs quite differently from on-campus e/m-learning mode. OERs
    are “digital learning resources offered online freely and openly to teachers,
    educators, students, and independent learners in order to be used, shared, combined,
    adapted, and expanded in teaching, learning and research.” (Hylen et al., 2012).
    Open learning is the combination of informal learning and formal learning. Learners
    enjoy high flexibilities in online open learning because there is no strict time
    constraint for joining and quitting. Learners engaged in open learning are across
    age groups and culture background with a wide range of geographic distribution.


    Generally OERs can be differentiated from MOOC and open courseware (OCW). Contrary
    to MOOC, OCW only offers course materials rather than entire courses. In other
    words, OER can be either structured (MOOC content) or unstructured (i.e. OCW),
    even both of them. OER providers and instructors have tried to promote their courses
    and affiliated educational products at full stretch. They have leveraged mobile
    learning (m-learning) for learners to easily participate in learning activities
    regardless of restrictions in time and location.'
