    # 3.4.1 研究目的


    为了解决第 3.3 节中提出的挑战，并调查这种新型移动学习和开放学习模式中潜在的研究机会，本研究旨在促进在线课程学习者的个性化学习体验，并探索如何在微场景中使他们的微学习更有效、更高效。研究的预期成果总结如下：


    • 一个智能云端系统框架，旨在为每个独立学习者提供自适应微型开放教育资源（OERs）以及定制的学习路径识别。

    • 一个全面的学习者模型，使系统能够考虑个人的学习风格、学习者背景、应用能力以及教学材料结构，从而根据用户需求定制学习信息的类型和交付格式。

    • 一个知识库，用于填填补正式 OER 在结构化、描述化和推理方面的空白。

    • 一种组织 MLaaS 中在线计算的解决方案，以及一种解决微型 OER 推荐冷启动问题的启发式方法。


    # 3.4.2 微 OER 交付场景示例


    在我们提出的自适应微学习框架的典型工作场景中，系统会调整每个课程块并使其适应特定的时间尺度。假设学习者正利用碎片碎片化时间进行开放学习。在这种情况下，学习者能够利用每段时间完整地完成一个课程块，既不会出现任何意外的停顿或中断，也不会将任何未完成的部分留到下一次可用时间。


    为了更好地理解微 OER 的交付过程，我们总结了章之前章节的内容，并以以下典型场景及其中涉及的活动为例：


    • 早上早上 9 点，Jack 正在乘火车上班。他利用 20 分钟的通勤时间，通过参加由知名开放学习提供者 edX 提供的“业务管理”在线课程来提升自己。他的手机由
    4G 网络支持。他处在一个座无虚员的车厢里，周围是聊天的乘客。MLaaS 引导他复习了 5 页讲义笔记，随后根据讲义内容完成了一份包含 20 道题的多选题。

    • 某某亚洲大学就学的本科生 Michael 正在扩展他对“商业智能”的知识，他本学期修了同主题的课程。在等待朋友时，他连接了购物中心提供的免费 Wi-Fi
    并开启了 MLaaS 应用。MLaaS 指导他阅读一份由美国领先大学发布的阅读列表，并向他推荐了一篇包含多个商业智能应用成功案例的文章。

    • 在课程间的简短休息期间，Roger 试图在进行演示前完善其演示内容中的几点。这次演示是关于澳大利亚电子商务的未来趋势的，他在最近几天准备演示时，对“供应链管理”主题进行了深入研究。根据他的学习历史和进度，系统向他推荐了一段视频视频片段，视频来自澳大利亚一个开放学习平台的“电子商务”课件，重点是“供应链管理”的定义和概念，时长为
    9 分钟。

    • 退休的老人 Duncan 想了解更多关于意大利的历史。他在等烤箱计时器滴答时，拿起了他的基础智能手机（例如 iPhone 4）。MLaaS 为他推送了一段关于“文艺复兴”的简要音频，以及几张名画和雕塑的照片，以及它们所在地博物馆的语音讲解。

    • 一位日本全职员工为了职业进一步晋升正在在线攻读“电子工程”学位。他正在收集来自 Coursera 相关大学的学分。MLaaS 为共同推荐了英语和日语双语的课程。当他使用平板电脑登录
    MLaaS 时，他被引入了一个“信号处理”的演示实验室实践。


    从学习者的角度来看，通过利用 MLaaS，对他们最大的益处是获得了充分的机会来利用碎片化时间来实现学习目标。此外，从 MLaaS 的实用性和易用性来看，他们可以即时、准确地获得偏好的
    OER，且这些资源预计可以在移动设备上运行简单、流畅。一个理想的微 OER 应该是易于完成的，既不会长到产生意外的停顿或中断，也不会太短而将任何未完成的部分留到下一次可用时间。


    # 3.5 系统框架


    如第 3.1.4 节所述，已经根据自适应微学习需求组织了云端学习环境（PLE），其中 MLaaS 作为主服务来搜索并发现所有可用 OER 及其相关服务，然后使用在线和离线计算组件共同做出资源交付的决策（Sun
    et al., 2015; Sun et al., 2017）。它旨在考虑到微学习环境的特殊性和学习者“高移动性”的学习行为，根据学习者的可用时间为其交付自适应微学习资源。MLaaS
    的框架已根据真正的云标准进行了良好设计，其用户模型通过研究全面的教学法文献和成功的在线学习案例进行了理论上的构建。在线和离线计算的架构所示图 3.2。


    ![image](img/ch3-fig2.jpg)


    图 3.2. MLaaS 中的在线和离线计算架构


    # 3.5.1 离线计算


    ## A. 计算服务


    学习者建模服务旨在根据学习者的历史信息和持续学习行为为每个学习者建立特定模型。学习者关于学习风格、偏好和目的的基本信息来自 PLE 中的历史学习者信息收集服务。根据这些数据收集，该服务评估每个学习者的预备水平，并用一组测量变量对这些特征进行标记。它还提供了一个功能，用于跟踪微学习过程的学习者行为，并在检测或生成新数据时确保模型保持更新。


    学习资源表示服务存储所有可用微学习资源的表示。它从开发的 OER（例如 MOOC 课程）中提取资源模块。根据其时长，它们被分为微学习资源（小于 15 分钟）和非微学习资源。参考教育数据挖掘（EDM）和学习分析（LA）的结果，这些较长的课程模块被程序化地切割并封装成合理长度的小单元。由于该模块持有元数据存储库，将从语义上建立描述微课程单元的元数据标准（Veeramachaneni
    et al., 2013; Beydoun, 2009）。根据该标准，所有学习资源将根据学科、关键词、时长、教学语言、流行程度等方面进行表示（Veeramachaneni
    et al., 2013）。与高质量且被广泛讨论的学习者生成内容相关的数据可以填充到学习资源库中，以支持 MOOC 中的同伴学习（Beydoun, 2009）。


    对于 MLaaS，实时学习者数据检索服务检索学习者的实时数据，包括他们的学习进度和当前可用时间（即他们希望使用的分钟数）。


