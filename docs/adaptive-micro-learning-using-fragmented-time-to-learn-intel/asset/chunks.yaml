- fmt: '

    It is gradually common that learning resources can be accessed via mobile devices.
    As a completely new form, the appearance of m-learning has lifted the traditional
    ways of learning resource delivery in distance learning, while learning on-the-move
    brings in remarkable challenges for both learners and learning resource providers
    to settle in this new learning context. It is worth noting that even the m-learning
    itself is evolving year by year, while learning behaviours varies all the way
    according to the change of space and time. Among these changes, an obvious difference
    from the traditional mobile learning is that the average length for each learning
    activity becomes fragmented. In other words, more and more learning activities
    are carried out within a relatively short time span, which is generally less than
    15 minutes.


    Building on the trend of open learning, the delivery of OER is recognized as a
    novel and effective approach that leads to a revolution to the traditional way
    of learning. OERs are ‘digital learning resources offered online freely and openly
    to teachers, educators, students, and independent learners in order to be used,
    shared, combined, adapted, and expanded in teaching, learning, and research.’
    (Hylen et al., 2012). OER providers and instructors have leveraged mobile devices
    for learners to easily participate in learning activities, regardless of restrictions
    in time and location. However, as micro-learning evolves, micro-content delivery
    with a sequence of micro interactions enables users to learn without being inhibited
    by information overload (Guo et al., 2015).


    Effective micro-content delivery is a key technology for ensuring better learning
    results in terms of cognitive retention of content in learners’ minds. Traditional
    pedagogical approaches and syllabi clearly require high levels of adaptation to
    apply to such a completely new educational environment.


    ## 8.1.2 Mobile Learning


    In this book we have introduced a research on facilitating micro open learning
    in mobile environment. This approach is towards providing adaptive OERs in the
    form of micro learning resources, which are fragmented pieces tailored to fulfil
    the requirement of learning in short time spans and in mobile environments.


    This research commenced by a comprehensive literature review, which crossed the
    fields of information technology, pedagogy and social science. This work was presented
    in the [Chapter 2](#Chapter2.xhtml). Having been adopted for years, the features
    of distance learning and its development was discussed in the [Section 2.1](#Chapter2.xhtml#sec2.1).
    The wide use of mobile devices brought mobile learning to a major mode in distance
    learning, and the new shape of it, namely micro learning, gained its popularity
    very quickly in recent years. Their features were introduced in the same section
    as well. Open learning, together with its shapes, instructional design and benefit
    were investigated in the [Section 2.2](#Chapter2.xhtml#sec2.2), and the feasibility
    of embracing service-oriented architecture with the OER delivery was also touched.
    Consequently, this book discovered the impacts and advantages of the combination
    of the micro learning and open learning in the [Section 2.3](#Chapter2.xhtml#sec2.3).
    To realize the adaptive micro OER delivery, there are a variety of learning technologies
    and research approaches involved, which were rolled out in the [Section 2.4](#Chapter2.xhtml#sec2.4).
    this book illustrated the theoretical background and existing studies over the
    learner modelling, educational data mining and analytics, and big data in education.


    Inspired by the issues concluded from the literature review, the [Chapter 3](#Chapter3.xhtml)
    focused on how to design the research to improve the micro open learning context
    and offer learners better learning experience so as to achieve better outcomes.
    The design started from the research background identification and introduction
    of previous work, which can be found in the [Section 3.1](#Chapter3.xhtml#sec3.1).
    Our pilot study motivated us to facilitate the current delivery shape of OER,
    by bringing in the adaptive micro learning concept. Meanwhile, for the first decision-making
    process in micro OER adaptation, we were motivated to organize an online computation,
    which aimed to tackle the famous cold start problem. This is illustrated in the
    [Section 3.2](#Chapter3.xhtml#sec3.2). Consequently, research challenges in terms
    of micro OER delivery, online computation and cold start problem were summarized
    in order. How to address these research challenges were illustrated in the [Section
    3.4](#Chapter3.xhtml#sec3.4), where the anticipated outcomes and example scenarios
    of adaptive micro OER delivery were presented. Following it, we proposed the system
    framework of MLaaS, for both offline and online computation, in the [Section 3.5](#Chapter3.xhtml#sec3.5).


    A comprehensive learner model was conceptually built in the [Chapter 4](#Chapter4.xhtml).
    It consists of factors from the internal and external domains. Differentiated
    by the relevance to the learners’ cognitive and intellectual levels, intellectual
    and non-intellectual factors were pickup in the internal domain. A component can
    belong to more than one domains and different components can be associated, in
    which case they are shown as overlapped in the [Figure 4.1](#Chapter4.xhtml#ch4-fig1).
    From the learning content perspective, according to the availabilities from the
    open learning provider, there are ready-made micro OERs and Non-micro OERs. Both
    types of OERs are subject to categorization and customization, and a mechanism
    was set up to measure their functional and non-functional attributes. The details
    of the micro open learning content profiling can be found in the [Section 4.2](#Chapter4.xhtml#sec4.2).


    The [Chapter 5](#Chapter5.xhtml) focused on the construction of a semantic knowledge
    base, which underpins the decision-making process executed by the `Adaptive Engine`
    in the offline computation domain. The knowledge base was built in a two-tier
    structure, with a pattern level at the top and a data level at the bottom. Two
    augmented ontologies, respectively for micro OER and micro learning content, were
    settled based on conceptual graphs at the pattern level. Subsequently, a data
    processing strategy was designed at the data level, where an `EDM` and `LA` based
    approach was proposed towards understanding patterns and rules in micro learning.
    In the same section (i.e. [Section 5.2.3](#Chapter5.xhtml#sec5.2.3)), the data
    sources were also demonstrated from the on-campus and open learning perspectives.


    In the [Chapter 6](#Chapter6.xhtml), this book constructed an online computation,
    which works against the sparsity of data at the commencement of micro open learning,
    and for real-time learner model updating. Most importantly, it contains a solution
    to solve the cold start problem in the micro OER recommendation caused by the
    shortage and brevity of learner information and the newly published micro OERs.
    A lightweight learner-micro OER profile was established in terms of learner preference
    propagation, distraction prediction and instant time availability identification,
    while a heuristic algorithm based approach produced the optimized computational
    recommendations for the new learner cold start problem. In addition, another heuristic
    algorithm enhanced by `Hill Climbing` was presented to find places in established
    learning paths for newly published micro OERs. In the [Section 6.3](#Chapter6.xhtml#sec6.3),
    real-time complementary mechanisms were introduced to keep the comprehensive learner
    model up-to-date and enable the responses to learners being in second granularities.

