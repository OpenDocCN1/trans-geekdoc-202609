    An eye-catching phenomenon of m-learning is that the fragmented pieces of time
    can be made good use. In addition, with the widespread use of mobile devices,
    people are taking advantage of smart phones and tablets to engage in online learning,
    which is termed as “micro learning”. Micro learning is a type of short-term learning
    involving activities based on small learning units. It is based on the assumption
    that a short time span is needed to complete a relevant learning task. It requires
    not only the learning task to be fragmented, but also that it to be completed
    (rather than being left unfinished halfway). In contemporary e-society, micro
    learning pertains to small pieces of knowledge delivered through open education
    resources (Kovachev et al. 2012). It is a major learning channel in mobile environment
    and is becoming popular with next-generation learners who learn on the move, with
    easy access to the ‘cloud’ or Internet of Things (Bruck et al., 2012; Hug & Lindner,
    2005). As a result, most open education resources (OER) providers have promptly
    released their mobile apps on mainstream mobile devices and operation systems
    (e.g., `iOS`, `Android`) and adapted their Webpages to appropriate screen size
    and operational mode of mobile devices to enable more convenient use for learners.


    Secondly, a massive amount of learning resources has been made open to public.
    Academics have been sharing digital content since the early days of computing
    (Land & McAndrew, 2010). Online learning through OER is one of the latest technologies
    in the field of education. It provides an open network-based model to achieve
    free or low-cost learning for any age group. It has become an important resource
    base for teachers and students around the world. In 2001, MIT, as a pilot, firstly
    launched Open Course Ware (OCW), with the aim of publishing all its courseware
    on the Web, and with licenses which allow the use, modification, and redistribution
    of published courseware. Since then, many other universities have joined the movement
    of making their courseware materials open. The promotion of OER benefits learners
    to access materials directly and learn from them, and allows educators to use
    materials directly or with modifications in their own teaching (Liyanaguanawardena
    et al., 2013). Through OER, anyone from any background with any level of expertise
    is given equal opportunity to attend courses and have access to educational contents
    and knowledge that they otherwise could not afford. In particular, millions of
    people are currently participating in the virtual classroom of the Massive Open
    Online Course (MOOC). Indeed, the number of students enrolled in a single course
    at the same time could be as high as tens of thousands (Souza & Amaral, 2014).
    As more and more universities and other educational institutions offer online
    access to their courses, open learning gains wider popularity in adult education,
    particularly in tertiary and vocational education.


    ## 1.1.2 State of Research Problem


    The use of mobile devices for open online courses poses additional challenges
    for the adaptive delivery of learning contents. In a m-learning environment, learners
    can use their mobile device to access any learning content from the Internet.
    They have full control of the time and location of their learning; they are not
    limited by a class timetable or classroom location. Learners are also able to
    choose the content they want to learn; they do not have to learn what the teacher
    has prepared and scheduled for that class in advance. Despite the numerous advantage
    of m-learning, until recently the practicality of m-learning has been limited
    due to the quality of the supporting technologies and the overloaded learning
    contents available to them. On the other hand, people make use of their surrounding
    environment through interactions with others; they interpret their current context
    and react to it. For example, when students interact with peers, they automatically
    observe their peers’ tones of voice and respond in an appropriate manner. Devices
    such as mobile phones are not able to interpret the surrounding context in the
    same way as human do in an interactive environment. These types of devices cannot
    make a full usage of the available information in a transparent way; therefore,
    the context information must be explicitly supplied to these devices to allow
    the devices to respond appropriately (Sharples et al., 2009). Particularly in
    m-learning applications, contextual and personal characteristics have a strong
    impact on each other, i.e. personal characteristics determine a learner’s behaviour
    and the behaviour determines the context. The concept of being context-aware is
    composed of two elements: personalization related to the learner, and automatic
    customisation related to the adaptation process. Personalisation related to the
    learner means that the system knows about the learner and provides tailored contents
    adaptively towards to the learner’s needs (Al-Hmouz et al., 2012, Xu et al., 2014).


    Automatic customization means that the system creates a model for the learner
    in an automatic way, based on machine learning mechanisms, to suit the learner’s
    situations and needs. Although the personalized learning resources customization
    have been discussed over years (Zhuhadar & Nasraoui, 2008), the open learning
    mode is too new to be involved in this research effort. Thus, few personalized
    learning deliveries have combined characteristics of open learning. An individual
    learner’s specific needs can vary significantly in open learning, which are normally
    different from traditional learning. Few research has been done in the field of
    enhancing open learning experience by taking advantage of learner modelling and
    educational computing techniques.


    The delivery effectiveness of OERs to learners in diverse learning environments
    remains challenging. Plenty of these OER were of limited use, since they were
    built as specific parts of some larger educational experience within specific
    educational framework (Adames et al., 2013). On mobile platforms, learners’ attention
    spans are often limited to 15 minutes, as they frequently interrupt their learning
    activities and switch their attention to other activities (Stockwell, 2008). Studies
    on MOOC have shown that online courses are currently suffering from low completion
    rates. In addition, as one of the major MOOC providers, `edX` found that the videos
    lasting less than 6 minutes are more attractive, as student engagement drops sharply
    after 6 minutes (Hylen et al., 2012; Guo et al., 2014). Most learners who enrol
    in online courses eventually drop out for a variety of reasons (Nawrot & Doucet,
    2014). As the research and development of OERs is still in its infancy, there
    are evidently many research gaps concerning how to improve its learning mechanisms,
    such as providing more effective learning platforms and learning support services,
    so as to enable easier access and better experiences for both service providers
    and learners.

