    从图 7.5 可以发现，尽管当 `N` 大于 18 时，ACOS 在精确率值方面产生了更好的推荐，但其初始推荐质量较差。实验表明作者的发现是正确的：采用 NHSM
    可以显著提高基于用户和基于物品的推荐器的性能（Liu 等人，2014）。然而，无论 `N` 的大小如何，基于 GA 和 EP 的 MLaaS 方法整体上可以产生比
    NHSM 精确率更高的结果（N≥20`）。


    ![image](img/ch7-fig6.jpg)


    图 7.6. 不同推荐器的 Top N 结果召回率值


    如前，通常在判断微 OER 推荐的质量时，精确率（Precision）值优于召回率（Recall）值。如果我们观察这些所选推荐器产生的召回率值（图 7.6），NHSM
    在 `N` 小于 5 时产生最佳结果，随后低于基于 GA 和基于 EP 的 MLaaS 方法，且随着 `N` 值的增加，各自的差异都在扩大。此外，尽管 ACOS
    是唯一一个召回率和精确率值均上升的推荐器，但其上升曲线在 `N=20` 之前低于 NHSM。值得注意的是，在潜在阈值（即 `N=15`）处，其他推荐器从所有候选对象中检索相关微
    OER 的性能无法与基于 GA 和基于 EP 的 MLaaS 方法竞争。因此，结合精确率和召回率值，并考虑到实验 1 中的发现，最终的胜者仍然是基于 GA
    或基于 EP 的方法。具体而言，算法的选择取决于推荐的具体需求。通常，GA 是一个更稳定的选择，而 EP 在准确性方面具有优势。


    总之，所提出的 MLaaS 在线计算对于处理微 OER 推荐中的新用户冷启动问题是行的，因为它可以通过产生具有可召回率和精确率值的最佳结果。一些广泛使用的推荐器没有考虑学习干扰，导致它们在仅考虑用户评分时，在冷启动时的响应质量较低。在所有使用的启发式算法中，EP
    和 GA 脱颖而出，推荐列表的建议大小为 15。


    ## 7.2.3. 学习路径评估


    为了证明所提出的针对新项目冷启动问题的有效性，在本节中我们评估了插入新发布微 OER 后生成的学习路径的质量。我们借鉴了 10 折交叉的概念，将相关领域的微
    OER 分为两个部分，比例为 1:9。学习路径是在九十分之一的微 OER 中生成的。对于每条学习路径，从剩余部分中选择一个微 OER 并在实验中将其视为新发布的微
    OER。执行 `Algorithm 6.4` 以为每个新成员在主体中找到一个位置。图 7.7 给出了使用 MLaaS 方法生成的插入了新微 OER 的学习路径的违规程度（即
    第 6.2.1 节 中定义的 `VD`），并与使用最短路径方法（Alian and Jabri, 2009）和基于能力的方法（Hsu and Li, 2015）生成的学习路径进行对比。


    总共，信息技术领域选取了 3674 个微 OER，业务领域 4479 个微 OER，社会科学领域 3254 个微 OER 作为候选对象；其中分别选取了 366、448
    和 325 个作为测试项目。执行 `Algorithm 6.4` 后，信息技术领域输出了 2044 条新学习路径，而业务和社会科学领域的数字分别为 3746
    和 2329。这是因为为一个或多个微 OER 找到了位置；或者根据 `Algorithm 6.4`，当存在 `RecommendedSequence` 关系时，会生成两条新的学习路径。同样执行了最短路径
    (SP) 和基于能力 (C-based) 方法，将新发布的微 OER 放入已建立学习路径的项目之间或并行位置。实际上，SP 和基于能力的方法的工作原理不是在建立的学习路径内为新发布的微
    OER 寻找位置，而是彻底重建一条新的学习路径。


    根据图 7.7，按三个学科比较了三种方法分别生成的学习路径的平均违规程度。可以发现，MLaaS 方法整体上优于 SP 和基于能力的方法，因为 MLaaS 生成的学习路径在每个学科中的平均
    `VD` 远小于其他方法。此外，当存在许多松散关联的微 OER（即具有弱序 `RecommendedSequence`）时，SP 方法很难识别出一条合理的学习路径。


    ![image](img/ch7-fig7.jpg)


    图 7.7. 三种方法的性能对比 – 所有生成的学习路径的平均违规程度


    随后，我们评估了 MLaaS、SP 和基于能力方法产生的最佳解决方案。其中，一个测试微 OER 仅允许参与一条学习路径；对于每个测试对象，选择 `VD` 值最低的新学习路径。这样做是为了消除由于先/后微
    OER 对之间松散耦合可能带来的潜在影响。在这种情况下，被指定的学习路径数量恰等于测试微 OER 的数量，分别为 366、448 和 325 个。


    图 7.8 中的结果显示了相同的观察：MLaaS 方法超过了其他两种方法，因为它找到了更好的位置来插入新发布的微 OER，同时违反规则的次数（如 第 6.2.1
    节 B 小节所述）更少。值得注意的是，信息技术学科的平均违规差异明显更大。这可能是因为该领域的学习路径相对较长。换句话说，一个完整信息技术知识领域的个人学习路径包含的微
    OER 比业务和社会科学字段的更多。此外，三种方法在业务领域都产生了违规程度更高的学习路径。这可能归因于业务领域经常发现微 OER 有其他 OER 作为知识先决条件，且一个微
    OER 与其他多个密切相关。


    ![image](img/ch7-fig8.jpg)


    图 7.8. 三种方法的性能对比 – 每个测试 OER 最佳学习路径的平均违规程度


    ## 总结


    在本章介绍了算法的系统实现和实验评估。在第 7.1 节中，我们展示了该系统的拓扑结构，该系统采用了点对云对点的结构以方便文件传输。结合离线计算领域的服务，自适应引擎（Adaptive
    Engine）决定将自适应微 OER 分配给学习者。其工作原理在图 7.2 的流程图中所示。


    第 7.2 节展示了我们提出的针对新用户和新项目冷启动问题的方法的实验评估。结果表明，建议采用 GA 和 EP 作为新学习者冷启动问题计算的核心算法。这两种启发式算法都能提高一些成熟推荐器的性能。此外，证明了
    `Algorithm 6.4` 能够在建立的学习路径中为新发布的微 OER 找到更合适的位置。


