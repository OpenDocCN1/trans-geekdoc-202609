    \ [8.2Recommendation for Future Work](#Chapter8.xhtml)\n\n# Chapter 1: Introduction\n\
    ## 1.1 Background\n### 1.1.1 Background\nWith the rapid growth of technology,\
    \ the learning patterns become diverse, and they are no longer solely restricted\
    \ in the classroom and with paper-printed textbooks. In other words, the learning\
    \ activities can take place in distance empowered by multiple types of equipment.\
    \ The distance learning is usually to expand its impact with the assistance of\
    \ electronic means, simplifying the method of information delivery and deriving\
    \ new fields of teaching approach. Education providers are showing increasing\
    \ interests in releasing learning resources online in the digital form, including\
    \ text, image, audio, video, and so on. Therefore, learners can utilize the electronic\
    \ learning (e-learning) extensively to participate in learning activities and\
    \ access learning contents on their own schedule. Therein, learners are given\
    \ freedom to be self-paced and able to make their own decisions to slow down or\
    \ speed up their learning rate of progress.\n\nThe significant development of\
    \ e-learning can be viewed from two perspectives. Firstly, the learning opportunities\
    \ can be gained anytime and anywhere through the use of mobile devices, provided\
    \ that wireless network is well achievable. Among all types of learning modes\
    \ in e-learning, mobile learning (m-learning) is rising remarkably, from which\
    \ learners are given more freedom to have learning activities wherever they are\
    \ and whenever they want.\n"
