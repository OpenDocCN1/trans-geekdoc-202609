  raw: "| Factor Analysis || Non-micro OERs || to identify resources’ suitability\
    \ for micro learning, for example, whether hands-on practice is needed, or whether\
    \ the OER delivery is necessarily associated with lots of writing or computation\
    \ work which is inconvenient to complete on mobile devices |\n\n| Prediction ||\
    \ Subscription OERs || to determine when to push information to learners in the\
    \ best timing and remind them |\n\n| Clustering || All micro OERs || to determine\
    \ their correlations for better repository purpose |\n\n| Relationship Mining\
    \ || Time Availability || to discover the correlation between their overall time\
    \ availability and learners’ types  |\n\n| Clustering/Prediction || Time Availability\
    \ || to involve similar learners into cohorts and build a potential time frame\
    \ for their overall learning schedule |\n\n| Latent Knowledge Estimation || Learning\
    \ habit (learning time distribution) || to discover whether there are regular\
    \ patterns of time organization within time frame among learners in or across\
    \ cohorts |\n\n| Latent Knowledge Estimation || Learners’ latest learning contents\
    \ and activities || to retrieve and profile learners’ learning recentness |\n\n\
    | Categorization || Learning habits || to set up a unique learning habit summary\
    \ for each learner |\n\n| Relationship Mining || Learners’ learning location data\
    \ || to know the degree of distraction and how it interrelates to disruption from\
    \ external environment |\n\n| Relationship Mining || Learners’ mobile app usage\
    \ || to know the degree of distraction and how it interrelates to disruption from\
    \ the content on mobile internet |\n\n| Social Network Analysis || OERs in affiliated\
    \ social networks || to distinguish information that can be useless, harmful and\
    \ may cause time wasted for learners. |\n\n| Social Network Analysis || Other\
    \ content in affiliated social networks || to screen well-recognized information\
    \ in order to recommend to learners as their learning augmentation besides the\
    \ OERs (text mining technique employed) |\n\nTo a considerable extent, the establishment\
    \ of the data level can involve integrating heterogeneous OCW repositories, refining\
    \ and  blending available OERs into the micro learning context and publishing\
    \ their metadata as linked data. Because in recent years some educators and researchers\
    \ have made great efforts to publish and popularize the OER in terms of the linked\
    \ data concept, a workflow developed with this extended aim is generally divided\
    \ into six phases:\n\n1.Identify and select heterogeneous data sources to determine\
    \ the scope of the content.\n\n2.Model vocabularies for OER domains.\n\n3.Data\
    \ extraction.\n\n4.Generate standardized data descriptions (e.g., RDF data).\n\
    \n5.Publish linked data.\n\n6.Consume and display linked data.\n\n# Summary\n\n\
    In this chapter we have presented the construction of a semantic knowledge base\
    \ that underpins the decision-making process of the micro OER recommendation system\
    \ which is realized by the Adaptive Engine. The knowledge base was built using\
    \ a top-down approach based on conceptual graphs, by having two augmented ontologies\
    \ at the pattern level first. Using this, a strategy on processing data was then\
    \ developed at the lower level. This EDM and LA strategy is to understand micro\
    \ learning patterns and rules, from the both on-campus data and open learning\
    \ data perspective, and to support the decision-making process of the micro OER\
    \ recommendation system.\n\n^([a](#Chapter5.xhtml#rfn1))[https://www.edx.org/schools-partners](https://www.edx.org/schools-partners)\n\
    \n^([b](#Chapter5.xhtml#rfn2))[http://lod-cloud.net](http://lod-cloud.net)\n\n\
    # Chapter 6\n\n# Online Computation for MLaaS\n\nIn this chapter the operation\
    \ procedure of the online computation domain of MLaaS will be introduced. As the\
    \ benefit stated in the [Section 3.3.3](#Chapter3.xhtml#sec3.3.3), The adoption\
    \ of online computation aims to tackle the nearline activities the can reflect\
    \ the ‘recentness’ of the learning behaviours and act on the fast response of\
    \ micro OER recommendation.\n\nFurthermore, the adoption of online computation\
    \ is expected to improve the performance of MLaaS in the following aspects:\n\n\
    1.Given the complete newness of the MLaaS as well as the new coming users who\
    \ have no record on the micro open learning, the focus of this chapter is to make\
    \ the first delivery to learners in their fresh micro open learning journal. This\
    \ is realized by the functionality of addressing cold start problem in the online\
    \ computation.\n\n2.For newly published micro OERs, it is central to their acceptance\
    \ and popularity that it can be discovered and collected in recommendation list\
    \ as soon as being released. This requirement will be fulfilled by a heuristic\
    \ mechanism that inserts the newly published micro OERs into established learning\
    \ paths.\n\n3.The online computation is also in charge of making up limitation\
    \ in timeliness and renewal of the offline computation by keeping the comprehensive\
    \ learner model and learner-micro OER profiles up-to-date.\n\nThe above three\
    \ aspects will be introduced in the upcoming [Section 6.2](#Chapter6.xhtml#sec6.2),\
    \ [6.3](#Chapter6.xhtml#sec6.3), and 6.4 in sequence. \n\n# 6.1Lightweight Learner-Micro\
    \ OER Profile for Cold Start Recommendation\n\n# 6.1.1.***Augmented Micro Learning\
    \ Learner Profile Taxonomy***\n\nAs discussed in the Section 4, based on a comprehensive\
    \ survey in the literature of pedagogy, psychology, e-learning and mobile learning,\
    \ we have classified out features that might play key roles in the micro open\
    \ learning experience and outcomes. From the user-based view, such a comprehensive\
    \ learner model is annotated by semantic approach. These ontologies also represent\
    \ how features affected and interrelated with each other in the ongoing micro\
    \ open learning process. As the instances of the pre-setting domain ontologies,\
    \ a specific learner profile oriented to micro learning is a set of nodes root\
    \ from the main ‘comprehensive learner model’ ontology versus a node in the augmented\
    \ micro OER ontology. It contains plenty of annotations in terms of their learning\
    \ behaviours and context.\n\nTo technically operate the semantic learner profile\
    \ for micro open learning, data collection comes from two sides, the explicit\
    \ data collection (e.g. through mandatory requests) and implicit data tracking\
    \ (e.g. automatic extraction) (Moreno et al., 2013).\n\n# 6.1.2.***Representation\
    \ of Lightweight Learner Profile***\n\nAlthough from the item view, it is feasible\
    \ to get micro OERs measured in terms of the standard defined in the micro OER\
    \ profile; from the user view, it is unlikely to have such sophisticated information\
    \ in hand with a null history of a fresh learner, so that, in many cases, the\
    \ learner model oriented to offline computation lacks sources to activate.\n\n\
    Despite low adoption in education area, the lightweight model based recommendation,\
    \ for example rating based recommendation, is a good alternative for intensive\
    \ data maintenance approaches needed by ontology-based recommendations in offline\
    \ computation (Nadolski et al., 2009).\n\nHence, this cold start condition motivated\
    \ us to simplify this comprehensive learner profile described in the Section 4\
    \ to a lightweight  version. It merely deals with necessary information for decision\
    \ making in order to act on the initialization agilely (Luz et al., 2013)."
