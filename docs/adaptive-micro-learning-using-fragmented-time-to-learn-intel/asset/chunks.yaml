    移动学习（m-learning）的一个引人注目的现象是碎片化时间可以得到有效利用。此外，随着移动设备的普及，人们利用智能手机和平板电脑参与在线学习，这被称为“微学习”（micro
    learning）。微学习是一种基于小型学习单元活动的短期学习形式。它的假设是，完成一项相关的学习任务只需要很短的时间。它不仅要求学习任务是碎片化的，还要求任务能够被完整完成（而不是半途而废）。在当代电子社会中，微学习涉及通过开放教育资源传递的微小知识点（Kovachev
    et al. 2012）。它是移动环境中主要的学习渠道，并在能够在移动中学习的新一代学习者中越来越流行，因为他们可以轻松访问“云端”或物联网（Bruck et
    al., 2012; Hug & Lindner, 2005）。因此，大多数开放教育资源（OER）提供者已迅速在主流移动设备和操作系统（如 `iOS`、`Android`）上发布了他们的移动应用程序，并将其网页适配到移动设备的屏幕尺寸和操作模式，以便学习者能够更方便的使用。


    其次，海量的学习资源已向公众开放。自计算早期以来，学者们就开始分享数字内容（Land & McAndrew, 2010）。通过开放教育资源进行在线学习是教育领域的最新技术之一。它提供了一个基于开放网络模型，让任何年龄段的人实现免费或低成本的学习。它已成为全球教师和学生的重要资源库。2001
    年，麻省理工学院（MIT）作为试点首次启动了开放课程网上（OCW），目标是将其所有的课件发布在网络上，并提供允许使用、修改和重新分发已发布课件的许可。从以后，许多其他大学也加入了将课件材料开放的行列。开放教育资源的推广使学习者能够直接获取材料并从中学习，并允许教育工作者在自己的教学中直接使用或修改后使用材料（Liyanaguanawardena
    et al., 2013）。通过开放教育资源，任何背景、任何专业水平的任何人都获得了平等的机会参加课程，并获取他们原本无法负担的教育内容和知识。特别是，目前有数百万人正在参与大规模开放在线课程（MOOC）的虚拟课堂。事实上，同一门课程同时注册的学生人数可能多达数万（Souza
    & Amaral, 2014）。随着越来越多的大学和其他教育机构提供其课程的在线访问，开放学习在成人教育中获得了更广泛的普及，特别是在高等教育和职业教育中。


    ## 1.1.2 研究问题现状


    使用移动设备进行开放式课程为学习内容的自适应传递带来了额外挑战。在移动学习环境中，学习者可以使用其移动设备访问互联网上的任何学习内容。他们对学习的时间和地点有完全的控制权；不受课表或教室位置的限制。学习者还能够选择他们想要学习的内容；他们不需要预先老师为那节课准备和安排的内容。尽管移动学习具有许多优势，但直到最近，由于支持技术的质量问题以及可用学习内容的过载，移动学习的实用性一直受到限制。另一方面，人们通过与他人的互动利用周围环境；他们解释当前的语境并对其做出反应。例如，当学生与同伴互动时，他们会自动观察同学的语气并以适当的方式做出回应。手机等设备无法像人类在交互环境中那样解释周围的语境。这类设备无法以透明的方式充分利用可用信息；因此，必须显式地向这些设备提供语境信息，以便设备做出恰当的响应（Sharples
    et al., 2009）。特别是在移动学习应用中，语境和个人特征之间存在着强烈的影响，即个人特征决定了学习者的行为，而行为决定了语境。环境感知（context-aware）的概念由两个元素组成：与学习者相关的个性化，以及与适应过程相关的自动定制。与学习者相关的个性化意味着系统了解学习者，并根据学习者的需求自适应地提供定制内容（Al-Hmouz
    et al. 2012, Xu et al., 2014）。


    自动定制意味着系统根据机器学习机制以自动方式为学习者创建一个模型，以适应学习者的情况和需求。尽管个性化学习资源的定制多年来一直被讨论（Zhuhadar &
    Nasraoui, 2008），但开放学习模式还太新，尚未参与这项研究工作。因此，很少有个性化学习交付结合开放学习的特征。个体学习者的特定需求在开放学习中可能会大异，通常不同于传统学习。利用学习者建模和教育计算技术来增强开放学习体验的研究较少。


    在多样化学习环境中，开放教育资源向学习者的交付有效性仍然面临挑战。许多这些开放资源用途有限，因为它们是构建为特定教育框架内某些更大教育体验的特定部分（Adames
    et al. 2013）。在移动平台上，学习者的注意力跨度通常限制在 15 分钟，因为他们经常中断学习活动并将注意力转移到其他活动（Stockwell, 2008）。对
    MOOC 的研究显示，在线课程目前面临完成率低的问题。此外，作为主要的 MOOC 提供者之一，`edX`发现时长小于 6 分钟的视频更有吸引力，因为学生的参与度在
    6 分钟后会剧减（Hylen et al., 2012; Guo et al., 2014）。大多数注册在线课程的学生最终因各种原因退学（Nawrot &
    Doucet, 2014）。由于开放教育资源的研究仍处于婴儿阶段，在如何改进其学习机制方面显然有很多研究空白，例如提供更有效的学习平台和学习支持服务，以便为服务提供者和学习者提供更容易的访问和更好的体验。


