    此外，针对学习资源适配的研究尚未扩展到微学习场景，而且尚未考虑到学习资源的长度或规模，或是学习者的可用时间跨度。使用移动设备的碎片化学习需要学习者集中注意力并反思。然而，在旅途中充满了不可预知的情况和干扰因素。这导致移动学习者面临着高度分心、高度碎片化的学习体验。此外，研究表明，性格和学习风格对学业成就有显著影响（Daradoumins
    et al., 2013）。学习者在起初选择学习哪些课程时，或者随后在有许多选项需要考虑时，可能会感到无足无措。他们很可能无法获得合适的微开放教育资源（micro
    OER），这即使他们花费了大量时间，也会影响他们获得满意的结果。在当前的开放学习环境中，学习资源通常由教育提供者或课程讲师进行划分和封装。这种方法缺乏适应特定学习者学习风格、进度和可用时间的灵活性。通常，学习者需要挤时间来完成那些学习活动，因为他们是被动地接受内容。我们同事的试点工作开发了一个自适应移动学习系统原型，但它仍然缺乏调整已进行中课程的机制（Al-Hmouz
    et al., 2010），在这些情况下，学生需要自己制定日程并在较长时间的时间内仔细计划时间，而没有个人指导。因此，将微学习引入开放学习环境暴露了待填补的重要研究空白。


    在本书的其余部分，“通过 OER 进行微学习”和“微开放学习”这两个术语将通用使用。


    ## 1.2 研究目标


    有效的微内容交付是课程讲师或交付者将先前的教学策略适配到微学习环境时需要克服的主要障碍之一（Sun & Shen, 2014）。因此，本书旨在研究更智能的微学习系统如何帮助学习者利用他们在移动设备上花费的碎片时间来获取
    OER。


    在填补定制化微 OER 以及为服务提供者和学习者提供更易访问和更好体验的当前研究空白方面，本书旨在解决自适应微开放学习中的各种问题，这些问题将通过微开放学习框架设计、面向微开放学习的个性化学习者模型构建、教育数据挖掘与学习分析（`EDM`
    和 `LA`）策略设计、语义学习者和微 OER 描述、以及冷启动问题的敏捷解决方案来考虑。本书介绍了一种提供自适应 OER 的新方法，这些 OER 是为了满足执行微学习需求而定制的碎片化。


    ## 1.3 本书贡献


    根据所提目标的实现，本书的贡献可以总结如下：


    - 基于面向服务的架构（`SOA`）开发了一个系统框架。该系统——“微学习即服务（MLaaS）”同时采用离线和在线计算领域协同工作，以提高学习资源适配的性能。

    - 我们提出了一个全面的学习者模型，允许系统考虑个人学习风格、学习者情境、应用能力和教学材料结构，从而根据用户需求对学习信息的类型和交付格式进行定制。

    - 构建了一个知识库，填补了正式 OER 结构化、描述和推理的空白。针对校园学习数据源和开放学习数据（`大数据`）源，制定了详细的 `EDM` 和 `LA`
    策略。

    - 为 `MLaaS` 中的在线计算组织提供了解决方案，并提供了一种解决微 OER 推荐冷启动问题的启发式方法。该解决方案经过实证评估，证明了其可行性。


    ## 1.4 本书大纲


    本书由三个部分组成，按顺序排列：


    - 研究的理论方面，将在第 2 章、第 3 章、第 4 章和第 5 章中介绍。

    - 研究的实践方面，将在第 6 章和第 7 章中介绍。

    - 研究的结论部分和进一步研究的建议将在第九章介绍。


    本书其余部分的安排如下：


    第 2 章将介绍研究的基本原理，包括术语和文献综述。它将从对距离学习及其发展（即从电子学习到移动学习的转变）文献的全面检查开始。接下来是开放学习和 OER
    带来的影响。将讨论在开放学习中采用微学习的可行性。本章强调了微开放学习的优势，并强调了改进其交付方式的技术，包括学习者建模、`EDM` 和 `LA`以及大数据。


    研究的整体设计将在第 3 章中展开。将结合我们的试点研究阐述研究背景。受此启发，将通过示例场景演示研究目的，在理想情况下可以组织自适应微学习活动。在第 3
    章的最后一部分，将介绍 `MLaaS` 框架，以描述适配微 OER 以满足个人学习者需求和情境的过程。`MLaaS`的功能将由在线和离线计算领域共同赋能。


    通常，有很多因素影响学习体验和结果。在第 4 章中，我们从概念上构建一个面向微开放学习的全面学习者模型。将从内部和外部选择可以在微开放学习整个过程中发挥作用的特征。内部因素可以智力或非智力反映学习者的学习行为。此外，从项目的角度，我们将微学习内容（即微
    OER）进行概述。将说明分类和定制微 OER 的机制，随后是衡量标准。


    根据第 3 章和第 4 章，将在第 5 章中进行语义知识库的构建，采用自上而下的方法。其顶层的模式层将分别拥有微 OER 和学习者的增强本体，并由概念图表示。底层的数据源将根据基于
    `EDM` 和 `LA` 的策略进行处理，即从校园数据和开放学习数据的角度来理解微学习模式和规则，并支持微 OER 推荐系统的决策过程。

