    \ computer systems and it enables learning system to adapt to special needs of\
    \ the learner. A learner model commonly contains a learner’s important information,\
    \ such as: domain knowledge, learning performance, interests, preference, goal,\
    \ tasks, background, personal traits (e.g. learning style and aptitude), environment\
    \ and other useful features. According to Kay et al. (1997), the learner model\
    \ (also known as student model) is defined as “machine’s representation of its\
    \ beliefs about the learner”.\n\nA learner model can contain two categories of\
    \ information, domain specific information or domain independent information (Brusilovskiy,\
    \ 1994). Domain specific information reveals the status or degree of knowledge\
    \ and skills that learner obtained in certain knowledge domain. Domain specific\
    \ information allows adaptive e-learning systems to organize a content related\
    \ learner model, eliminate what learner already knows, and focus instruction or\
    \ assessment on areas that the learner is weak at. Domain independent information\
    \ represents information besides knowledge, such as learning goals, interests,\
    \ learning styles and personal traits. Domain independent information is related\
    \ to the learner profile data (e.g. learning style or personality) and it allows\
    \ the system to serve optimal learning content sequences or presenting formats.\
    \ \n\n# b) Modelling Learner’s Knowledge\n\nDomain specific information of a learner\
    \ is organized as a knowledge model, which contains elements that the learner\
    \ needs to learn (e.g. concepts, topic, and subject). Generally there are three\
    \ different forms to model learners’ knowledge, namely, vector model, overlay\
    \ model, and fault model (Nguyen & Do 2008).\n\n•**Vector model:** The vector\
    \ model represents learner’s knowledge in a knowledge domain as a vector, whose\
    \ elements can be concepts, topics or subjects. Although vector model is the simplest\
    \ one of the three models, it is very efficient.\n\n•**Overlay model:** The overlay\
    \ model is one of the most popular and commonly used student models. The underlying\
    \ assumption of the overlay model is that a learner can have incomplete but correct\
    \ knowledge of certain knowledge domain (Chrysafiadi & Virvou, 2013). In the overlay\
    \ model, learners’ knowledge is a subset of the domain knowledge, which is represented\
    \ by an expert’s knowledge level of that domain. The differences between learner’s\
    \ knowledge and domain knowledge are assumed to be the learner’s lack of knowledge,\
    \ and the objective of learning is to eliminate these differences as much as possible\
    \ (Bontcheva & Wilks, 2005). Similar to the vector model, each element in the\
    \ overlay model is a number, which presents learner’s knowledge level against\
    \ a certain topics or subjects.\n\n•**Fault model:** The drawback of vector model\
    \ and overlay model is that it cannot describe the misconception of learners over\
    \ certain knowledge. Fault model can represent learner’s errors or misconceptions\
    \ and the reasons why the learner has these errors (Baschera & Gross, 2010). From\
    \ fault model, an adaptive learning system can infer what learning materials should\
    \ be delivered to help learners learn new knowledge as well as eliminate misconceptions.\n\
    \nThe data used for modelling learner’s knowledge usually comes from two different\
    \ sources, by assessments (e.g., pre-tests before taking a course, quizzes during\
    \ course, or exams) or surveys (Shute & Towle, 2003). In the study conducted by\
    \ Pardos et al. (2013), learner’s knowledge is estimated using discrete knowledge\
    \ components defined by  a domain expert. Each assessed problem was a knowledge\
    \ component, which was then be modelled by a Bayesian Knowledge Tracing based\
    \ method. With this model, researchers can predict whether a learner has successfully\
    \ acquired a certain knowledge component during their course. This approach requires\
    \ expert to input domain specific knowledge components. Yudelson et al. (2014)\
    \ used a variant of Additive Factors Model to automatically extract the domain\
    \ model by exploiting the structure of Java programming language and then model\
    \ student knowledge. Compared to the previous method, this approach is completely\
    \ automated, yet it is only applicable within the programming domain. Also, learners’\
    \ knowledge can be estimated using a specific assessment tool both before and\
    \ after the course (Konstan et al., 2015). To identify factors that can predict\
    \ how much knowledge the learners gained, an Ordinary Least Squares (OLS) regression\
    \ model was built, from which they found that all predictive factors are relevant\
    \ to efforts that the learners have put into the course (as measured by the number\
    \ of activities), prior courses taken, and baseline knowledge.\n\nIn above approaches,\
    \ learner models are usually hidden from learners, where learners do not have\
    \ access to learner models. While in recent years, there is a growing trend to\
    \ make learner models open. The Open Learner Model presented by Bull and Kay (2010)\
    \ is a well-known example of this approach. Open learner models refer to learner\
    \ models that can be browsed or modified in some way by learners themselves or\
    \ by other users (e.g. teachers, peers, parents). Therefore, besides the purpose\
    \ of enabling adaptive learning according to learner’s current needs, the learner\
    \ can also directly use the contents of learner model. Making learner models open\
    \ brings following potential benefits (Bull & Kay, 2007).\n\n•Promoting metacognitive\
    \ activities such as reflection, planning and self-monitoring;\n\n•Allowing the\
    \ learners to take greater control and responsibility over their learning, and\
    \ encouraging their independence;\n\n•Facilitating navigation to materials, exercises,\
    \ problems or tasks;\n\n•Supporting assessment of learner’s knowledge gain;\n\n\
    •Increasing the accuracy of learner model data. \n\nIf having access to the information\
    \ in learner model has the potential to benefit the user, the learner model built\
    \ with any learner modelling technique could be opened to the learner. For instance,\
    \ learner models were opened in simple weighted numerical models (Bull & Gardner,\
    \ 2009), fuzzy models (Mohanarajah et al., 2005), and Bayesian models (Zapata-Rivera\
    \ & Greer, 2004).\n\n# 2.4.2.***EDM and LA***\n\nStudent learning data collected\
    \ by open learning systems are explored to develop predictive models by applying\
    \ educational data mining methods that classify data or identify relationships.\
    \ These models play a key role in building adaptive learning systems, in which\
    \ adaptations or interventions based on the model’s predictions can be used to\
    \ change what students experience next, or even to recommend academic services\
    \ to support their learning.\n\nAt this cutting edge, EDM and LA are widely used\
    \ in research. They are used to build models in several areas that can influence\
    \ online learning systems. As its name implies, EDM is a state of the art method\
    \ that applies data mining techniques to educational data. It is concerned with\
    \ many developing methods, and acts on exploring the unique types of data in educational\
    \ settings. Using these methods, students and educational settings can be better\
    \ understood (Romero et al., 2010). To enable smart and adaptive micro learning\
    \ for MOOC, EDM and LA are key concepts that we employ to build the basis of the\
    \ dynamic learner model construction.\n\nGenerally, OCW data is locked away in\
    \ independent data silos hosted by different OCW/OER providers. This makes it\
    \ much less useful than it could be. It is difficult to develop tools for consuming\
    \ data from multiple silos. Searching OCW/OER across multiple silos means invoking\
    \ the user interface of each one, and receiving the results in separate groups.\
    \ The presence of data silos makes accessing data and interoperability between\
    \ repositories harder in several ways."
