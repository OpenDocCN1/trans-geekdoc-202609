  trans: '

    该研究侧重于微开放教育资源（OER）推荐与交付的知识库。自然，根据可检索的数据量，这个问题可以从两个方面入手。


    * 如果学习者被 `MLaaSS` 充分了解，将采用教育数据挖掘和学习分析（`EDM` 和 `LA`）方法应用于其历史数据，以理解其学习模式和偏好。从而，可以根据其个性化设置和特定环境做出合理的推荐。这将负责
    `MLaaSS` 的离线计算领域，并在本章中介绍。

    * 如果学习者被 `MLaaSS` 了解程度较低（即该学习者是开放学习环境的新学习者），则这被视为一个冷启动问题，并通过用预测数据填补空白来解决，从而根据人口统计信息进行推荐。冷启动问题将在的第
    6 章中讨论。

    * 新生成的信息结合冷启动推荐，将填充学习者画像的第一版本。


    # 5.1 面微开放学习的基于概念图的本体论构建及拟议的数据处理策略


    通常，一个可行的知识库具有两层结构：顶部是模式层，底部是数据层（Cambria et al., 2014）。对于模式层，本体是基于概念图构建的。通过这种方式，本体代表数据处理工作流的正式维度，并可以通过先验知识驱动数据处理，从而缩小搜索空间（Xu
    et al., 2011; Dou et al., 2015）。


    通过对教学法、心理学、电子学习和移动学习领域的文献进行全面调查，我们整理了可能在微开放学习体验和成就中起关键作用的特征。这些概念图还代表了这些特征在持续的微开放学习过程中是如何相互影响和关联的。这将在后续章节中分别从
    `OER`（项目）侧和学习者（用户）侧介绍。


    ## 5.1.1 增强型微 OER 本体论


    从项目的角度来看，我们将视野从普通的电子/移动学习深化到微学习环境。因此，`OER` 的通用本体论被增强以适应微学习的需求。


    在增强型微 OER 本体论中，微 `OER` 的标注是自描述的；通过元数据探索其教育参数，例如类型（视频、音频、文本等）、交互类型（解释性的、主动的、混合的、双向的）、教学模型（例如归纳法、演绎法、中学等）以及非功能属性，如
    `QoS`、语义密度等（Miranda & Albano, 2015）。增强型 OER 本体论中的每个节点都代表一个微 `OER` 块（chunk）。块是微学习设置中的最小单元——通常是来自提供者的经过精细切割的
    `OER` 片段——其时长比原始形状明显短（最好少于 15 分钟）。它可以是一个微概念或知识点，比教师以前交付的更小；也可以是课程视频或讲座笔记的片段；或者是随概念一起交付的课程设置，如评估、任务、阅读材料等（Sun
    et al., 2015）。


    没有一个块是完全独立的，它们中的每一个都是关系网络的一部分，而不仅仅是概念对象（Moreno et al. 2013）。该本体论用于在教学法定义的独特主概念集中对
    `OERs` 进行显式分类以推荐，并作为原始材料输入 `MLaaSS` 的推理过程（Sun et al., 2016; Moreno et al. 2013）。


    增强型 OER 本体论的概念图如图图 5.1


    图 5.1 微 OER 本体论的概念图


    ## 5.1.2 增强型微学习学习者画像分类法


    从用户的角度来看，所有学习者画像的基础主本体被称为基准本体论（Benchmark ontology），其中元素 `Learner` 被置于图的中心（Sun
    et al., 2016）。作为预设领域本体论的实例，面向微学习的特定学习者画像是基准本体论中的节点与增强型微 OER 本体论中的节点匹配而成的节点集合。它包含了大量关于学习行为和背景的标注。基准本体论的概念图如图图
    5.2


    图 5.2 微开放学习学习者画像基准本体论概念图


    # 5.2 EDM 和 LA 策略


    ## 5.2.1 方法论


    开放学习系统收集的学生学习数据正在被探索，旨在通过应用分类数据或发现关系的教育数据挖掘方法来开发预测模型。这些模型在构建自适应学习系统方面起着关键作用，基于模型的预测进行适应或干预可以改变学生下一次的体验，甚至可以推荐学术之外的服务来支持他们的学习。


    分析这些新的日志事件需要新的技术来处理非结构化文本和图像数据、多源数据以及海量数据（“大数据”）。数据没有固定的大小；任何分配给定义它的数字都会随着计算技术的进步（处理更多数据）而改变。因此，“大数据”是相对于当前或“典型”能力定义的。例如，Manyika
    等人（2011）将大数据定义为“规模超出典型数据库工具捕获、存储、管理和分析的数据集”。


    在这一前沿，教育数据挖掘和学习分析被广泛用于研究和构建影响在线学习系统的模型。正如其名所示，`EDM` 是“将数据挖掘技术应用于教育数据的先进技术”（Romero
    & Ventura, 2010）。它关注许多开发方法，并探索教育环境中的独特数据类型。通过这些方法，可以更好地理解学生及其学习环境（Romero & Ventura,
    2010）。为了实现 MOOC 的智能自适应微学习，`EDM` 和 `LA` 是我们用于构建学习者基础的关键概念。


    ## 5.2.2 EDM 和 LA 利益相关者


    `EDM` 和 `LA` 不仅可以帮助学习者个性化他们的微开放学习并向他们推荐活动、资源甚至是具有相似兴趣和目标并加入小组的人，而且对开放学习教师和 OER
    提供者也具有重要意义。


    对于开放学习教师，`EDM` 可以帮助获取教学的客观反馈；分析学生的学习和行为；检测需要支持的学生；预测学生表现；将学习者分类社区或小组；发现学习者的规律和异常模式；发现最常见的错误；确定更有效的活动；改进课程的适应和定制等。


    对于 OER 提供者和参与开放学习的大学，`EDM` 可以增强决策过程；简化决策流程效率；实现特定目标并增强所有 OER 提供者之间的竞争力；建议对特定学习者群体可能意义某些课程；寻找提高留率和成绩最具成本效益的方法；录取在开放学习中表现良好的学生并吸引更多学习者参与等。


