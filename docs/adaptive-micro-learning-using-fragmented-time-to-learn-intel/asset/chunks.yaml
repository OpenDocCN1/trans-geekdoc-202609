    通过可视化和统计化的方式报告学习者的数据，以展示他们独特的学习故事以及学习限制（如时间可用性），是非常关重要的。这在评估学习者的学习状态、估计其学习进度以及进行战略决策方面发挥着重要作用。该过程负责为从开放学习平台进行数据提取设定基准。


    对于知识库的底层（即数据层），面向微型开放学习的语义学习者画像和知识库构建的技术操作是基于来自两个源的数据填充图：显性数据收集（例如，通过强制性请求）和隐性数据跟踪（例如，自动提取）（Moreno,
    2013）。


    此外，我们没有自己为开放教育资源（OERs）开发领域本体论，而是通过利用现有的本体共同构建了一个通用的课件本体论结构。这些本体提取自主要的 OER 提供者，例如参与大型开放课程联盟的大学（例如参与
    edX 的机构^a），或来自链接开放数据云（Linked Open Data Cloud）社区^b（Capuano et al., 2009）。


    对“大型”开放学习数据的调查与 OER 相关。在海量的 OER 中，预见了三种主要关系：


    *   `ConsistsOf` 是一种包含关系。这种关系通常出现在两个 OER 之间或一个 OER 与一个微型 OER 之间。具有这种关系的两个项目位于增强型微型
    OER 本体论的不同层级中。

    *   `RequiredSequence` 是两个项目（OER 或微型 OER）之间的强顺序关系，由于课程设置和教育考虑，前一个微型 OER 必须在后一个之前学习。

    *   `RecommendedSequence` 是两个项目（OER 或微型 OER）之间的弱顺序关系，根据教师的指导，建议在学习后一个之前先学习前一个微型
    OER，但并非强制性。

    *   两个项目（OER 或微型 OER）之间完全可能没有任何关系。

    *   两种关于顺序的关系都可以被实体的后代继承，例如，如果存在一个 `RecommendedSequence`（`R*[1]`, `R*[2]`）表示 OER
    `R*[1]` 优于 `R*[2]` 学习，那么对于 `MR*[1]` ∈ `R*[1]` 和 `MR*[2]`∈ `R*[2]`，则存在一个 `RecommendedSequence`（`MR*[1]`,
    `MR*[2]`）。


    教育数据挖掘（EDM）和学习分析（LA）的目的是修正、丰富和验证上述手动构建及半自动提取的本体论，并验证和衡量所发现关系的重要性。我们对 EDM 和 LA
    的结合基于两个组件（Markellou et al., 2005）：校内移动学习数据（即结构化数据）和“大型”开放学习数据（即非结构化数据）。特别是，我们通过对澳大利亚某公立大学学生的学习行为真实数据进行实质分析，开展实验
    EDM 和 LA。数据收集自该大学的主学习管理系统（LMS）和数据仓库。该分析旨在识别学生参与混合学习（即校内学习和在线/移动学习）的常规模式；例如，他们是否以及多久地采用微学习模式来完成学习。

