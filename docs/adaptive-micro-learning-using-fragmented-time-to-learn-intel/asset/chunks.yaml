    ## 学习方法


    - **从完整的课程材料中提取章节**：在这种情况下，首先选择并提取特定的知识部分，同时消除课程中的冗余内容。由于不同的开放教育资源（OER）提供者提供了相同内容或知识范围的资源（例如斯坦福大学和卡内基梅梅隆大学提供的“机器学习”MOOC
    课程），章节提取使学习者能够并行学习，精确定位特定章节，而无需浏览整个课程。


    - **关联社交媒体中的课程相关及教育信息**：这是学习资源的延伸，也具有丰富的教育价值。这些资源不仅可以在 MOOC 平台嵌入的论坛或博客中找到，还可以在其他流行的社交媒体（如
    Facebook、微信、Twitter、Tumblr 等）上找到，学习者、教育者或外部专家会在那里发布课程材料（Mark et al., 2010）。此类资源的一个显著特征是其数量随时间不断增加，但某些内容可能包含伪科学或错误信息（Dowling,
    2013; Henry, 2014）。


    - **订阅式学习**：从教学学角度来看，这也被视为被动学习。正如其名称所示，它为订阅者提供间歇性的学习相关交互。这些学习相关交互可以涉及各种学习相关事件，包括内容展示、诊断、基于场景的问题、工作辅助、反思问题、作业、讨论等。此类交互是短促的，经过特意安排以支持学习，通常利用与间隔效应（spacing
    effect）相关的研究结果。学习者订阅一个或多个学习交互形成多个学习线程（Waard et al., 2012）。


    - **双向互动内容或活动设置**，范围涵盖反馈、对其他学习者内容的评估和回顾、同伴学习、协作写作、合作工作以及翻转课堂。


    - **学习者生成的内容**：受开放学习实践者和教育者的高度推崇，P2P 学习、数字翻转课堂、相互监督在开放学习中具有越来越高的教育价值（Lee & McLoughlin,
    2007）。MOOC 的新形态强调联结主义，将学习者生成内容的获取和共享引入常规学习手段（Cochrane et al., 2013; Narayan, 2011）。


    ## 4.2.3. 微 OER 测量


    ### A. 功能属性


    出于建模目的，一个学习资源块的测量将根据以下特征（Al-Hmouz et al., 2010; Miranda & Albano, 2015; Bouarab-Dahmani
    et al., 2015）：


    - 长度

    - 移动学习的适用性

    - 教学模型（归纳法、演绎法、实践学习等）

    - 媒介性（例如：纸质媒体、电子媒体、单媒体与多媒体、（中）媒介形式等）

    - 难度（知识水平）

    - 完整性

    - 对注意力的需求

    - 偏好的学习风格

    - 交互类型（说明性的、主动的、单向传递或双向互动）

    - 对输入或实际操作的需求

    - 学习类型：重复型、活动型、反思型、务实型、概念主义、建构主义、联结主义和行为主义；此外还有行动学习、企业学习、学科。


    此外，微 OER 具有其基本信息，如主题、语言等。


    ### B. 非功能属性 (QoS)


    这些属性描述了服务的质量。我们采用面向服务的架构，并列出了一些：


    - 性能（响应时间、延迟、吞吐量）

    - 可靠性（可用性、容错性、恢复性）

    - 健壮性和稳定性

    - 可扩展性

    - 兼容性、互操作性、安全性


    ## 总结


    在本章中，我们介绍了综合学习模型的结构，重点关注最重要的输入。该模型由两个领域组成（即内部和外部），而内部因素可以分为个人因素和非智力因素。某些组件属于这两个领域。根据我们的设计，学习模型的语义构建将使用基于机器学习的方法来获取、表示、存储和推断每个学习者的画像。详细方法将在第
    5 章中介绍。


    ## 第 5 章：语义知识库构建：教育数据挖掘与学习分析策略


    由于所有微 OER 适应决策均由 `Adaptive Engine` 做出，它是离线计算系统的核心。它消耗来自所有其他服务的结果，并将输出直接传输到用户界面。因此，`MLaaS`
    设计用于满足数据密集系统的标准，而知识库作为其智库。


    基本上，知识库是使用自上而下的方法，利用语义手段从模式层面到数据层面构建的。换言之，首先绘制几个本体，然后进行 `data processing` 工作。我们尝试将微学习的模式和规则发现过程与教育文献调查相结合，产生可能影响移动环境下学习体验和结果的特征（Sun
    et al. 2015）。详细而言，`data processing` 工作涉及从开始到结束的所有数据操作，例如实体提取、关系提取、消歧解析等。


