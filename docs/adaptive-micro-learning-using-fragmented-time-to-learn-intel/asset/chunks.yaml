    # Research conducted by Yahoo (Gutierrez, 2014) stated that, although users seem
    to be addicted by mobile devices without willingness to put down their devices,
    it is not opposite to that they just want to receive and process information rapidly
    and quickly. Results of a study (Chen & Lin, 2016) revealed that when proceeding
    m-learning young learners frequently pause their learning activities and transfer
    their attention to another thing, and commonly the time lasting for their attentions
    limited in 15 minutes.


    Stockwell (2008) analysed the time lasting for young learners’ attention in m-learning,
    the results showed that when proceeding m-learning, their learning activities
    are frequently interrupted by other activities, so that their attention spans
    are often limited in 15 minutes.


    ## Micro learning and Benefits


    Micro learning can have positive effects on mastery learning and be an important
    part of blended learning (Milligan et al. 2013; Zhang & Ren 2011). It can help
    learners make use of every fragmented piece of time to participate in learning
    activities in very short terms. Compared to accomplishing a course chunk with
    one or more interruptions, this can lead to positive effects for them to acquire
    targeted knowledge (Bruck 2008). Learning in small steps (contrary to the traditional
    approach of learning through hours-long courses) is made possible with the aid
    of small and well-planned chunks of units or activities. Thus, micro learning
    becomes short-term, digestible, and easily manageable (Kovachev et al., 2011).
    Micro learning also adapts to the constraints of the human brain with respect
    to its attention span. It is consistent with research finding that proves people
    learn better when engaged in short, focused sessions, than hour-long sessions
    that cause information overload (Bruck et al., 2012).


    In literature, "micro learning" processes cover a time span from a few seconds
    (e.g. in mobile learning) to up to 15 minutes or more. Another explanation of
    micro learning is suggested as: ‘micro learning refers to short-term learning
    activities on small learning units. In the contemporary mobile/web society, micro
    learning pertains to small pieces of knowledge based on web resources’ (Kovachev
    et al., 2011). Compared to the traditional hours-long e-learning, micro learning
    features high flexibility, and it can be delivered in various forms, and, more
    importantly, it has less time limitation. In other words, it can be started anytime,
    whereas it may also be terminated at anytime.


    ## Mobile Learning and Integration


    In mobile learning, learning activities can be conducted in learners’ conveniences,
    regardless the location and time. By this means, learners can get access to learning
    resources within various scenarios. With mobile devices, quite often learners
    accomplish learning missions in a short time period. According to the study conducted
    by Hug and Lindner (2005), micro learning can be an assumption about the time
    needed to complete a relevant learning task, for example answering a question,
    memorizing an information item, or finding learning materials. Hence, micro learning
    booms with the wide use of mobile devices, and it becomes a major learning means
    in mobile environment. Micro learning shares some similar specialties with mobile
    learning as both of them are individually referable, self-contained, reusable
    and re-mixable (Sanchez-Alonso et al., 2006; Leene, 2006).


    Australian educators use different kinds of multimedia to make course more comprehensive,
    which helps learners understand more effectively. The contents of courses can
    be reused among different courses. On the other hand, these widely used course
    materials are in the form of visual information, while educational micro content
    is suggested to be in the similar form, which may consist of text, video, audio,
    picture, graph, or drawing, etc. (Liao & Zhu, 2012). Mobile learning and micro
    learning go hand in hand. People are using their mobile devices more and more
    in the workplace, for communication as well as for searching answers to questions.
    It brings learning to employees while they are performing their daily activities,
    rather than requiring them to leave their work environments (Semingson et al.,
    2015). Micro learning resources can be made available on-demand to facilitate
    just-in-time learning (Gassler et al., 2004). These small learning bytes not only
    aid quick assimilation but also make it possible to learn on the go, thus reducing
    the dependency on a fixed time slot or the need to take a large chunk of time
    out of one’s working day (Gutierrez, 2014; Anderson et al., 2014).


    As micro learning evolves, micro-content delivery with a sequence of micro interactions
    enables users to learn without information overload (Souza & Amaral, 2014). It
    is a key technology to ensure better learning outcome (Kovachev et al., 2011).


    ## 2.2 Open Learning and Open Educational Resources


    Open learning, which aims to integrate e-learning and open courses, is vigorously
    pursued by many universities (Hilton, 2016). This term has been defined by many
    researchers as early as in the year 1975, and it keeps evolving. Open learning
    has resided in public domain and been organized under licenses for free use (Harley,
    2008).


    Open learning seeks to remove all unnecessary barriers to learning, while aiming
    to provide students with a reasonable chance of success in an education and training
    system centred on their needs (Neil Butcher, 2011). It incorporates several key
    principles:


    - Learning opportunity should be lifelong and should encompass education and training
    (Leone, 2018);

    - The learning process should be centred on the learners, build on their experience
    and encourage independent and critical thinking (Hannafin et al., 2013);

    - Learning provision should be flexible so that learners can increasingly choose
    where, when, what and how they learn, as well as the pace at which they will learn;

    - Prior learning, prior experience and demonstrated competencies should be recognized
    so that learners are not unnecessarily restricted from educational opportunities
    by lack of qualifications;

    - Learners should be able to load progress or accumulate credits from different
    learning contexts;

    - Providers should create the conditions for a fair chance of success.


    Resources used in open learning are ranging from full courses, course materials,
    modules, textbooks, streaming videos, tests, software, and any other tools, materials,
    or techniques used to support access to knowledge (Atkins et al., 2007). Formally,
    OERs are ‘digital learning resources offered online freely and openly to teachers,
    educators, students, and independent learners in order to be used, shared, combined,
    adapted, and expanded in teaching, learning and research’ (Hilton, 2016). Researchers
    summarized the development of OER conforms with a `5R`, wherein:


    - `Retain` refers to `make and own copies`;

    - `Reuse` indicates `use in wide range of ways`;

    - `Revise` represents the action of `adapt, modify and improve`;

    - `Remix` equals to `combine two or more`;

    - `share with others` is highlighted by `Redistribute` (Theeraroungchaisri, 2016).


    The following issues mainly account for the speedy development and wide acceptance
    of the open learning, or, in other words, the utilization of OER:


    - **Cost**: the problem of cost (e.g. for textbooks) comes always at the first
    place to the user/customer side in the e/m-learning even traditional on-campus
    learning, where these customers can be either the learners or the education providers.
    This problem is exposed more significant in developing counties (Lesko, 2013).

