    \n## 2.2.1 Classification and Evolution of OER (OER, OCW and MOOC)\n\n### a) Open\
    \ Course Ware\n\nThe formal definition for the Open Course Ware (`OCW`) given\
    \ by the OCW Consortium organization is “free and open digital publication of\
    \ university-level educational materials. These materials are organized as-course,\
    \ and often include course planning materials and evaluation tools as well as\
    \ thematic content” (`OCW Consortium.org`). Taking the MIT’s `OCW` program as\
    \ example, this pioneer started as early as in 2001. This trend has been extended\
    \ widely in Europe and Asia.\n\nGenerally `OCW` is a subset of `OER` (Friesen,\
    \ 2009). Unlike `OER` including any educational content that is shared under an\
    \ open license, whether or not it is a part of a course, `OCW` sorely focuses\
    \ on sharing open content that is developed specifically for a course.\n\n###\
    \ b) Massive Open Online Course\n\nRising remarkably in the recent decade, the\
    \ Massive Open Online Course (`MOOC`) is offered free to students of any age group\
    \ and also works on an open network learning model, with neither formal entry\
    \ requirement nor participation restrictions. It soon becomes the most eye-catching\
    \ trend in `OER` and gains its popularity in the whole higher education sector\
    \ (King et al., 2014). The explosive growth of learning resources online leads\
    \ to a revolution of education and learning, and the year of 2012 was named as\
    \ ‘the year of MOOC` (Pappano, 2012).\n\nIt is an online course targeting on large-scale\
    \ interactive participation and open access via the Web, which is an important\
    \ supplement to the traditional distance education (Liyanagunawardena et al.,\
    \ 2013). It contains interaction, feedback and assessment (via automated quizzes\
