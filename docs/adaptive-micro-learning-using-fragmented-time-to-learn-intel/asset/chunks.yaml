    此外，研究表明，个性和学习风格在影响学业成就方面起着重要作用（Sun and Shen, 2014）。由于学习者通常没有足够的专业知识来为自己定制学习计划，并且可能不熟悉自己的学习风格，因此他们有很大概率无法获取正确的微内容。这可能导致他们尽管花费了大量时间，也无法获得令人满意的学习结果。在目前的情况下，学习资源通常由教育提供者或课程讲师进行划分和封装。这极地缺乏适应每个特定学习者可用时间的灵活性，因此学习者不得不适应课程设置的时间长度，并设法时间来完成这些学习活动。


    ## 3.3.2 在线计算问题的研究挑战


    最新的推荐系统常见于电子商务、电子娱乐和电子旅游领域，倾向于将离线和在线计算相结合，以支持资源推荐的决策过程（Gomez-Uribe & Hunt, 2015）。这种创新在在线学习和移动学习（m-learning）平台及系统中较少见，而在线/移动学习的成功案例在与学习者历史行为紧密结合工作时，通常会消耗“大数据”。随着“大数据”趋势的兴起并利用云的力量，教育数据挖掘（EDM）和学习分析（LA）方法已成为良好的在线/移动学习系统广泛采用，用于组织它们的计算过程，这些过程通常是离线的（Romero
    & Ventura, 2010）。EDM 和 LA 在大幅提高计算机科学和教育科学理解学习者、场景和案例的深入程度方面发挥着重要作用，从而从准确性和个性化方面提高它们的推荐质量。然而，这些系统在单一的离线计算中通常以“天”作为最细粒度。由于无法保持用户信息的更新，它们的时间有效性不足，而且学习资源的适应过程可能受到数据稀疏性的影响（Souza
    & Amaral, 2014）。


    学习资源推荐系统中在线计算部分的采用率仍然很低，因为与在线购物和娱乐不同，微开放学习的体验和结果高度取决于教育设置、学习者的个人学习风格，特别是变化的环境和碎片化的时间框架（Hug
    & Lindner, 2005）。微开放学习中的活动具有很高的随机性，没有硬性的开始和结束设定。此外，新的开放教育资源（OERs）无论是微模式还是非微模式，每天都在快速发布和更新。需要快速响应机制将进入的微型
    OER 插入推荐候选列表。


    此外，在微开放学习中，用户兴趣和需求的积累与衰减可能是周期性的，并以不同的模式变化。


    ## 3.3.3 冷启动问题的研究挑战


    在计算机科学文献中，广泛使用的方法通常依赖于三大类，即基于内存、基于模型和基于内容（Sieg et al., 2010; Liao & Chang, 2016）。尽管它们在
    Amazon 等许多成功案例中被发现，但由于初始数据不足，通常很难提供可靠的推荐。冷启动问题由三个因素触发：新社区、新项目和新用户。


    冷启动问题在开放学习中变得更加严重，特别是通过 OER 进行的微学习（Bruck, 2012）。开放学习和 OER 都是较新的领域，在最近几年中才出现。同时，这一趋势的追随者，无论是新追求者还是从其他在线模式迁移的常规学习者，都加入了这个新兴社区。另一方面，参与开放学习的学习者的需求和期望比大学学生要实际得多。换句话说，他们大多数是自律的，因此他们完全可以根据自己的意愿决定何时加入或退出在线课程，并在课程之间频繁切换。因此，对于
    OER 提供者来说，很难为任何个人建立模型并相应进行更新，因为他们手头没有历史数据。


    因此，如果 OER 系统对某个学习者的了解很少，在线计算应该将其视为冷启动问题，并通过用预测数据填补空白来解决它，以帮助 OER 提供者和教师保证首次交付的质量，这可以进一步加速正在进行的离线计算，从而促进学习者对即将到来的开放学习的参与。

