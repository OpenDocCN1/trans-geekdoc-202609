    To kick off the practical aspect of this book, the [Chapter 6](#Chapter6.xhtml)
    will spread out the details of the online computation of the MLaaS. The online
    computation aims to evidently support the first decision-making process of micro
    learning adaption and delivery. First of all, a solution to tackle the famous
    cold start problem will be presented as the main contribution of this chapter.
    A lightweight learner-micro OER profile will be built on top of the comprehensive
    learner model in order to act on the cost start condition and fast response. Subsequently,
    it will also look for the way to insert newly published micro OERs into well-established
    learning paths and the real-time updating of comprehensive learner models.


    The [Chapter 7](#Chapter7.xhtml) will provide the empirical evaluation results
    for the proposed computation approach. The experiments will be operated based
    on a series of simulations in which heuristic algorithms will be selected and
    optimized to realize the computation process. The system implementation will also
    be involved in this chapter.


    The [Chapter 8](#Chapter8.xhtml) will conclude this book and provide suggestions
    for future research.


    # Chapter 2: Literature Review


    As a new phenomenon emerging in recent years, micro open learning has been attached
    great significance and attracted interests from both researchers and developers.
    The success of adaptive micro open learning is closely related to the proper utilization
    of a combination of topics from both technical and educational perspectives. In
    this chapter, we will go through relevant literature in the computer science,
    information technology, data science and pedagogy areas. Firstly, literature in
    the areas of mobile learning and micro learning will be reviewed in the [Section
    2.1](#Chapter2.xhtml#sec2.1). Then the background and development of open learning
    and open educational resources will be discussed in the [Section 2.2](#Chapter2.xhtml#sec2.2).
    Next, the combination of the both phenomenally new learning trends, micro (learning
    and) open learning (i.e. micro learning over OERs) will be examined through its
    benefits and research gaps; lastly, we will also investigate studies over the
    learner modelling, and educational data mining (EDM) and learning analytics (LA)
    in the [Section 2.4](#Chapter2.xhtml#sec2.4).


    ## 2.1 Mobile Learning and Micro Learning


    ### 2.1.1 Distance Learning and Electronic Learning


    Distance learning enlarges the concept that learning activities have to be physically
    performed in a definitive place, often a classroom. Hence, in the context of distance
    learning, teachers and learners are usually isolated by time and location; meanwhile,
    learners and their classmates, or teammates are virtually distributed. This type
    of learning approach gives the teachers freedom to arrange their schedule, and
    allows learners to work on their learning contents in their preferred time. In
    terms of these, more education opportunities are offered to learners whom are
    unable to attend traditional classroom due to disabilities, sickness, whom want
    to engage in advanced study apart from full-time work, and whom are willing to
    but far away from their ideal education institution, such as learners in developing
    countries (Woods et al., 2011).


    The central idea of the distance learning is the delivery of knowledge, which
    is usually realized by the aid of some technologies and communication tools. For
    example, in the earliest form of distance learning, teaching by correspondence
    through post is commonly adopted. Some open universities or open course providers
    often make use of the television education and videoconference in the twentieth
    century. Researchers determined this phenomenon as the rudiment of electronic
    learning (e-learning).


    With the rapid development of Internet technologies, e-learning, which is the
    acquisition and use of knowledge distributed and facilitated primarily by electronic
    means is gradually playing an important role in pedagogy (Wentling et al., 2000).
    Urdan and Weggen (2000) defined e-learning as “the delivery of content via all
    electronic media, including the Internet, intranets, extranets, satellite broadcast,
    audio/video tape, interactive TV, and CDROM.”


    Discussion of the e-learning’s features can be widely found in literature. Some
    typical points of view are summarized as follows:


    - For distance learning supported by e-learning, teachers and learners are no
    longer required at the same location, while in-classroom learning experience is
    also involved by taking electronic equipment as assistance.

    - E-learning can be self-paced or instructor-led. Many education institutions
    have made learning resources readily available to learners, including lecture
    videotapes, lecture notes, lecture slides, reference books, etc. That is to say,
    learners can access those by themselves with their freedom and preference (Bates
    and Poole, 2003). The commencement and termination of learning activities are
    in their own hands, and they decide which resources they want to subscribe, what
    aspects they should emphasize and how long each learning stage should take. To
    the contrary, the teachers’ roles in e-learning can be simplified, as making the
    guidance about related subjects, pointing out the right learning direction, sharing
    experiences and answering questions when learners are confused (OCED, 2005).

    - The activities in e-learning can be either synchronous or asynchronous. On the
    one hand, two or more participants can exchange their ideas or information within
    the same period, which is typically supported by chat room, instant message software
    and video communication equipment. On the other hand, with the mature Web 2.0
    technology, asynchronous learning activities, which are by the aids of blogs,
    Wikis, discussion boards, etc., become frequently used in recent years. Hence,
    participants are no longer required to respond as soon as they receive information,
    without the dependency of other participants’ involvement at the same time.


    There are many e-learning systems, also known as learning management systems (LMSs),
    which are software applications for documentation, tracking, reporting, and the
    delivery and administration of education courses or training programs. Most LMSs
    are Web-based which can facilitate access to learning content and expand the usage
    range. General learning contents provided in LMSs are in the form of text, image,
    animation, streaming video and audio.


    ### 2.1.2 Mobile Learning


    Mobile learning (m-learning) emerged as a brand-new trend of e-learning with the
    evolution of wireless technologies and wide use of mobile devices (Sharple et
    al., 2002).


    The major difference between these two types of distance learning is that, e-learning
    is generally carried out in front of a computer or a fixed device, while m-learning
    can take place at any location (Sharma and Kitchens, 2004). For this reason, learners
    are able to have m-learning wherever they are and whenever they want. Learning
    activities happening on campus, at home or outside school facilities can be integrated
    into mobile education environment (Kim et al., 2006). In addition, a trend in
    m-learning is that the learners are using mobile devices and actually in movements
    while the teachers may use multiple types of equipment other than mobile devices
    and be located in fixed places (Vanska, 2004).


    Koole et al. (2010) stated that the m-learning promotes the utility of distance
    learning. Compared to distance learning, m-learning has several additional features
    that should be considered for the delivery of a high-quality education experience:


    - Accessibility: it is primary for m-learning. The study environment is in movement
    and all study resources and learners are mobile. The learning activity cannot
    be broken off if the learning space-time is changed (Attewell, 2005).

