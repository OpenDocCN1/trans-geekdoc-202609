  raw: "•The learning process should be centred on the learners, build on their experience\
    \ and encourage independent and critical thinking (Hannafin et al., 2013);\n\n\
    •Learning provision should be flexible so that learners can increasingly choose,\
    \ where, when, what and how they learn, as well as the pace at which they will\
    \ learn;\n\n•Prior learning, prior experience and demonstrated competencies should\
    \ be recognized so that learners are not unnecessarily restricted from educational\
    \ opportunities by lack of appropriate qualifications;\n\n•Learners should be\
    \ able to load progress or accumulate credits from different learning contexts;\n\
    \n•Providers should create the conditions for a fair chance of learner success.\n\
    \nResources used in open learning are ranging from full courses, course materials,\
    \ modules, textbooks, streaming videos, tests, software, and any other tools,\
    \ materials, or techniques used to support access to knowledge (Atkins et al.,\
    \ 2007). Formally, OERs are ‘digital learning resources offered online freely\
    \ and openly to teachers, educators, students, and independent learners in order\
    \ to be used, shared, combined, adapted, and expanded in teaching, learning and\
    \ research’ (Hilton, 2016). Researchers summarized the development of OER conforms\
    \ with a ‘5R’, wherein, the ‘Retain’ refers to ‘make and own copies’, the ‘Reuse’\
    \ indicates ‘use in a wide range of ways’, ‘Revise’ represents the action of ‘adapt,\
    \ modify and improve’, ‘Remix’ equals to ‘combine two or more’ and ‘share with\
    \ others’ is highlighted by ‘Redistribute’ (Theeraroungchaisri, 2016). \n\nThe\
    \ following issues mainly account for the speedy development and wide acceptance\
    \ of the open learning, or, in other words, the utilization of OER.\n\n•Cost:\
    \ the problem of cost (e.g. for textbooks) comes always at the first place to\
    \ the user/customer side in the e/m-learning even traditional on-campus learning,\
    \ where these customers can be either the learners or the education providers.\
    \ This problem is exposed more significant in developing counties (Lesko, 2013).\n\
    \n•License: Copyright restrictions on textbooks, journals, and other educational\
    \ objects prevent educators from combining materials in a way that best meets\
    \ the demands of their students. It also reduces the feasibility to break and\
    \ re-construct learning resources from different institutions.\n\n•Local Support:\
    \ Although OER is fully international; there were needs for local support. Chae\
    \ and Jenkins (2015) summarized from their participants’ opinion that they are\
    \ delighted to have a local OER service unit on campus and a readily available\
    \ person who are well versed in finding, utilizing, designing and tailoring of\
    \ OER. These go-to persons help incoming instructional designers, instructors\
    \ and other stakeholders in open learning to get familiar with the similar operations\
    \ on OERs, so that they promote the use of OER in both learning and teaching.\
