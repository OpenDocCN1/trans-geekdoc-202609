  raw: 'From another aspect, mobile learning activities in open learning normally
    consist of two sections: online learning and offline learning (Trifonova & Ronchetti
    2006). Since mobile learners can freely download materials into their mobile devices
    for viewing offline, they do not often stay with open learning platforms and attend
    virtual classrooms (Attewell, 2005)). In fact, accessing OERs or any other ‘non-open’
    (or  private) learning resource online is only a part of pervasive learning; more
    tasks associated with pervasive learning would require activities offline (Wu
    et al. 2010; Lossman & So, 2010), such as data collection, data analysis, and
    report writing for an assignment. Logically, mobile open learning is through online
    systems that include guided and instructional materials, the transaction details
    and deliverable resources (Ally & Samaka, 2013). Hence, while learners are able
    to accomplish many of their open learning tasks offline, for some necessary procedures,
    such as data entry and work submission, they need to go back online to conduct
    these specific tasks.


    # 3.1.1.***Stakeholder Prospective in Adaptive Micro OER***


    Typical adaptive learning projects always contain targets and strategies for researchers,
    application partners and developers (Alario-Hoyos et al., 2014). From the educational
    institutions’ prospective, though being under pressure, they aim to assure openness
    in their education distribution and enlarge the influence and popularity of it.
    Aside from teachers/lecturers and learners, the development and application of
    adaptive OER delivery usually involve educational institute, instructional designers,
    technicians; and, to a greater content, institutional staff, library staff and
    system administrators (Alario-Hoyos et al., 2014). They collaborate in the preparation
    and enactment of the OER delivery and work towards the prosperity of open learning
    (Khalil & Ebner, 2016).


    The leveraging of adaptive micro open learning aims to fulfil learners and educators’
    needs by incorporating more helpful services into micro open learning and fostering
    the world-wide development of OER. Meanwhile, it can lead to a better integration
    of the education resources across institutions to maximize the educational outcomes
    for a broader spectrum of learners, whether formally enrolled in courses or not.


    A timely and feasible solution will be provided for OER providers to offer their
    services in a smarter manner by matching resources to personalized learning demands.
    Another outcome of this project will be cost effectiveness, as course providers
    can combine external resources without any huge re-development of their existing
    platforms. The novel learning technologies will allow educational organizations
    and course-instructors  to wisely focus on, and tailor their teaching strategies
    to meet the requirements of, massive learner classes.


