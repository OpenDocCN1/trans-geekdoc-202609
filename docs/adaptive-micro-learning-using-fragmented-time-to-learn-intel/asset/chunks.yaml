- fmt: '

    The research focuses on the knowledge base for micro OER recommendation and delivery.
    Naturally, based on the volume of retrievable data, this problem can be approached
    from two sides.


    * If a learner is well-known by the `MLaaSS`, an educational data mining and learning
    analytics (`EDM` and `LA`) approach will be applied to his or her historical data
    to understand his or her learning patterns and preferences. Thereby, a well-grounded
    recommendation can be made based on his or her personalized settings and particular
    surroundings. This will be in charge of the offline computation domain of `MLaaSS`,
    and this will be presented in this chapter.

    * If a learner is relatively poorly known by the `MLaaSS`, (i.e., this is a new
    learner to the open learning environment), this will be treated as a cold-start
    problem and tackled by filling in the gaps with predicted data, so that a recommendation
    will be made based on demographic information. The cold start problem will be
    addressed in the next [Chapter 6](#Chapter6.xhtml).

    * Freshly generated information, along with the cold-start recommendation, will
    populate the first version of a learner’s profile.


    # 5.1 Conceptual Graph-Based Ontology Construction for Micro Open Learning and
    Proposed Data Processing Strategy


    Generally, a workable knowledge base has a two-tier structure: a pattern level
    at the top and a data level at the bottom (Cambria et al., 2014). For the pattern
    level, the ontologies are constructed based on conceptual graphs. By this means,
    the ontologies represent the formal dimensions of the data processing workflow,
    and can drive data processing with a priori knowledge, thereby reducing the search
    space (Xu et al., 2011; Dou et al., 2015).


    By accomplishing a comprehensive survey of literature in the fields of pedagogy,
    psychology, e-learning and mobile learning, we sorted out features that might
    play key roles in the micro open learning experience and achievement. These conceptual
    graphs also represent how features were affected by and interrelated with each
    other in the ongoing micro open learning process. This will be introduced in the
    subsequent sections, from the `OER` (item) side and learner (user) side, respectively.


    ## 5.1.1 Augmented Micro OER Ontology


    From the item-based perspective, we deepen the sights from normal e/m-learning
    into the micro learning environment. For this reason, the general ontology of
    `OER` is augmented to adapt the needs of micro learning.


    In an augmented micro OER ontology, an annotation of a micro `OER` is self-describing;
    with metadata exploring its educational parameters, such as typology (video, audio,
    text, etc.), type of interaction (expositive, active, mixed, two-way), didactic
    model (e.g., inductive, deductive, learning by doing, etc.), and non-functional
    attributes, such as `QoS`, semantic density and so on (Miranda & Albano, 2015).
    Each node in an augmented OER ontology indicates a micro `OER` chunk. A chunk
    is the smallest unit in the micro learning settings—normally a finely-cut piece
    of an `OER` from its provider—with an apparently shorter time length (preferably
    less than 15 min) than its original shape. It can be a mini concept or knowledge
    point, tinier than what teachers used to deliver; or it can be a cut of course
    video or lecture notes; or course settings delivered along with a concept, such
    as assessment, task, reading material and so on (Sun et al., 2015).


    No chunk is totally independent, and each of them is part of a relational web
    rather than merely a conceptual object (Moreno et al. 2013). This ontology is
    used to explicitly classify the `OERs` for recommendation among a pedagogically
    defined set of distinctive main concepts, fed as the raw material into the reasoning
    process of `MLaaSS` (Sun et al., 2016; Moreno et al. 2013).


    A conceptual graph of the augmented OER ontology is shown as [Figure 5.1](#Chapter5.xhtml#ch5-fig1).


    ![image](images/ch5-fig1.jpg)


    Figure 5.1. Conceptual Graph of Micro OER Ontology


    ## 5.1.2 Augmented Micro Learning Learner Profile Taxonomy


    From a user-based perspective, the main ontology, on which all learner profiles
    are based, is named the Benchmark ontology, where the element `Learner` is put
    at the centre of the graph (Sun et al., 2016). Acting as an instance of a pre-set
    domain ontology, a specific learner profile oriented to micro learning is a set
    of nodes from the Benchmark ontology matched with a node in the augmented micro
    OER ontology. It contains plenty of annotations in terms of their learning behaviours
    and context. A conceptual graph of the benchmark ontology is shown as [Figure
    5.2](#Chapter5.xhtml#ch5-fig2).


    ![image](images/ch5-fig2.jpg)


    Figure 5.2. Concept Graph of Benchmark Ontology for a Learner Profile in Micro
    Open Learning


    # 5.2 EDM and LA Strategy


    ## 5.2.1 Methodology


    Student learning data collected by open learning systems are being explored to
    develop predictive models by applying educational data mining methods that classify
    data or find relationships. These models play a key role in building adaptive
    learning systems, in which adaptations or interventions based on the model’s predictions
    can be used to change what students experience next or even to recommend outside
    academic services to support their learning.


    Analysing these new logged events requires new techniques to work with unstructured
    text and image data, data from multiple sources, and vast amounts of data (“big
    data”). Big data does not have a fixed size; any number assigned to define it
    would change as computing technology advances to handle more data. So “big data”
    is defined relative to current or “typical” capabilities. For example, Manyika
    et al. (2011) defines big data as “Datasets whose size is beyond the ability of
    typical database tools to capture, store, manage, and analyse.” (Manyika et al.,
    2011)


    At this cutting edge, educational data mining and learning analytics are widely
    used to research and build models in several areas that can influence online learning
    systems. As its name implies, `EDM` is ‘a state-of-art that applies the data mining
    techniques to educational data’ (Romero & Ventura, 2010). It is concerned with
    many developing methods, and acts on exploring the unique types of data in educational
    settings. Using these methods, students and the settings in which they learn can
    be better understood (Romero & Ventura, 2010). To enable smart and adaptive micro
    learning for MOOC, `EDM` and `LA` are key concepts that we employ to build the
    basis of the learner learner construction.


    ## 5.2.2 EDM and LA Stakeholders


    `EDM` and `LA` not only can help learners personalize their micro open learning
    and recommend them activities, resources and even people they may have similar
    interests and targets to join as cohorts, but also can be of great significance
    for open learning instructors and OER providers.


    For open learning instructors, `EDM` can help to get objective feedback about
    instruction; to analyse students’ learning and behaviour; to detect which students
    require support; to predict student performance; to classify learners into communities
    or groups; to find a learner’s regular as well as irregular patterns; to find
    the most frequently made mistakes; to determine more effective activities; to
    improve the adaptation and customization of courses, etc.


    For OER providers and open learning participant universities, `EDM` can help to
    enhance the decision processes; to streamline efficiency in the decision making
    process; to achieve specific objectives and enhance competitiveness among all
    OER providers; to suggest certain courses that might be significant for particular
    groups of learners; to find the most cost-effective way of improving retention
    and grades; to admit learners who will do well in open learning and attract more
    learners to engage in, etc.


    # 5.2.3 EDM and LA Strategy

