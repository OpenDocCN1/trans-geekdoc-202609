  trans: "\n\n其中 `d[j,Loa]` 是学习者 `L[j]` 在位置 `Lo[a]` 感受到的自我识别分心程度，通过强制请求获取。这遵循以下预期：具有相似总体情况（即社会因素）和环境（即环境因素）的学习者极高概率具有相似的分心程度，且来自同一位置的干扰水平不会发生显著变化。\n\
    \n预测干扰的置信度表示为 `CD(D[i,Loa])`。\n\n# 6.2 冷启动问题的在线计算过程\n\n## 6.2.1 推荐结果的整合 - 冷启动问题\n\
    \n### A. 下行传播\n\n在第 5.4 节中，我们已经获得了学习者对“整个”OER（开放教育资源）而非微型 OER 的偏好，现在这些偏好值再次沿本体层次结构向下传播。因此，每个微型\
    \ OER 节点都接收来自其祖先的估计偏好值。该传播过程带有一个衰减因子。对于每个微型 OER，最终偏好值 `P[u,j]` 可以使用公式 (3) 计算。\n\
    \n![image](img/ch6-Eq3.png)\n\n其中 `R` 是层次结构高于 `MR[u]` 的所有节点集合，`R[v]` 是节点 `MR[u]`\
    \ 的直接祖先，`Q(u,v)` 取决于 `MR[u]` 和 `R[v]` 之间的层数。\n\n![image](img/ch6-Eq4.png)\n\n\
    且后代节点相对于 `P[u,j]` 的置信度计算为其祖先中置信度值的平均值，并减去衰减因子 `μ`。\n\n![image](img/ch6-Eq5.png)\n\
    \n当集合 `ML` 中三个属性（即表示偏好、即时时间可用性和分心程度）的所有值都确定后，通过 MLaaS 就能从最初稀缺的信息中完全构建出一个轻量级学习者画像。\n\
    \n### B. 微型 OER 筛选与规则 \n\n对于每个微型 OER，一旦 MLaaS 获取了其最终偏好值和置信度，系统将拒绝不符合置信度最低要求的节点。\n\
    \n在生成推荐的微型 OER 列表时，学习者兴趣较高的将排在顶部。对于两个微型 OER `MR[u]` 和 `MR[w]`，它们的顺序根据在第 4 节中讨论的提取三类关系而定义的某些启发式规则来决定。这些规则按顺序执行并具有优先权。\n\
    \n1. 如果这两个微型 OER 之间存在 `RequiredSequence`（强制性序列）关系，则将先决条件项放在上方（参见第 4 节）。\n2. 如果这两个\
    \ OER 的偏好 `P[u,j], P[w,j]` 中前者高于后者，则 `MR[u]` 位于 `MR[w]` 之上。\n3. 如果从绝对角度来看，置信度\
    \ `CD(P[u,j])` 较高而 `CD(P[w,j])` 较低，则 `MR[u]` 位于 `MR[w]` 之上。\n4. 如果这两个微型 OER 之间存在\
    \ `RecommendedSequence`（推荐序列）关系，则建议先访问的一个放在上方（参见第 4 节）。\n5. 如果这两个候选微型 OER 之间的学科差异明显，则与学习者教育背景更相关、或属于相关学科或跨学科的微型\
    \ OER 优先考虑。\n6. 如果上述规则均不适用，则推荐的微型 OER 列表随机排序。\n\n在此，第一条规则被视为必须严格遵守的硬规则，其余规则是软规则，可以根据具体情况从教育考虑的角度进行违背。\n\
    \n### C. 推荐结果的优化\n\nMLaaS 消耗值 `P` 和 `D` 并结合其 `TA`，与增强型 OER 本体元数据中注释的属性和要求进行比较。\n\
    \n下一步是整合上述章节中描述的前述算法的结果；一个适应度函数将这些选定的多维数组（即轻量级画像中提出的特征的数值）转换为一个变量。因此，该问题在此被恰当地转换为一个多目标优化问题。\n\
    \n最终微型 OER 推荐的基本思想是：鉴于每个推荐的微型 OER 作为微型开放学习的开始，其之后应该跟随一系列微型 OER 以形成完整的学习路径，我们将其命名为学习路径中的第一个对象。因此，为了启动约束多目标优化，会随机生成候选学习路径解（染色体），其中每个染色体都是包含一系列微型\
    \ OER 的学习路径，而不是单个微型 OER。对于一个染色体，通过检查每个连续的前置/后置微型 OER 对相对于上文 6.1.2 节中列出的前 5 条规则的关系来研究其违规程度并求和。对于染色体中的此类对，其违规程度\
    \ `VD(MR^t, MR^(t+1))` 通过其对规则 2 到规则 5 的违规情况的加权和得出，其中 `MR^t` 是 `k` 中的第 `t` 个微型\
    \ OER，`MR^(t+1)` 是第 `t+1` 个。违规程度越高，候选学习路径违反规则的情况越严重。学习路径 `k` 的违规程度使用公式 (6) 计算。\n\
    \n```\n![image](img/ch6-Eq6.png)\n```\n\n随后，令变量 `RA[u]` 表示给定学习资源 `MR[u]` 的关注程度，其对微学习的实时可用性\
    \ `RT[u,j]` 通过与学习者 `L[j]` 的预测分心程度比较并使用公式 (6) 计算。\n\n```\n![image](img/ch6-Eq7.png)\n\
    ```\n\n因此，对于候选学习路径 `k`，`RT[k,j]` 表示实时可用性的和。同样，`P[k,j]` 汇总了学习者 `L[j]` 对 OER 的所有偏好。\n\
    \n```\n![image](img/ch6-Eq8.png)\n```\n\n其中 `α, β, γ` 和 `δ` 作为每个变量的权重，建议 `α>β>γ>δ`，`P¹[k,j]`\
    \ 表示学习者对路径中第一个 OER 的偏好值。\n\n算法 6.3 展示了推荐的典型步骤。\n\n```\n![image](img/113.jpg)\n\
    ```\n\n启发式算法 6.3 为通过 MLaaS 开始的新颖学习体验推理出合适的微型 OER 列表。随着微学习冷启动问题解决方案的成功启动，学习者的行为将由\
    \ MLaaS 持续收集以以馈离线计算的自适应引擎。\n\n## 6.2.2 在既有学习路径中插入新的微型 OER\n\n### A. 微型 OER 相似性计算的优化\n\
    \n在某种程度上，在既有学习路径中插入新的微型 OER 可以被视为新项目的冷启动问题。在这里，微型 OER 之间的相似性计算对于基于项目的协同过滤方法至关重要（Airoldi\
    \ 等，2012）。使用公式 (9)，该计算不仅基于它们在教育设置中的欧式距离，还增加了一个时间衰减因子（考虑兴趣的积累和衰减）以及一个惩罚项（解决过滤泡问题）。这两个算子显示在公式\
    \ (6.9) 的后乘因子中。\n\n```\n![image](img/ch6-Eq9.png)\n```\n\n"
