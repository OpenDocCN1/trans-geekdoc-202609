- fmt: '

    The P2P sub-network of the proposed system is to conform with the nature of open
    learning, where varieties of P2P learning occur frequently and randomly. This
    P2P tier guarantees that P2P learning can be organized instantly, and the first-hand
    resources can be shared and exchanged straight away, regardless of access to the
    cloud.


    From the top-down view, MLaaS borrows the cloud service to maximize the capability
    of hosting. The cloud part of the system consists of four domains: data tracking,
    data collection, data processing and data storage.


    The functions of modules in MLaaS’s cloud-end were outlined in the [Chapter 3](#Chapter3.xhtml)
    (Sun et al., 2015; Sun et al., 2015). An Administration Service is added to oversee
    the daily regular operations over MLaaS, from both learner and provider sides.
    A noticeable feature of the system is that there are three file transmission channels:


    • A channel between learners and an instructor-created OER pool in the cloud storage
    part (i.e., the `Channel A` in the [Figure 7.1](#Chapter7.xhtml#ch7-fig1)).


    • A channel between learners and a learner-generated OER pool in the cloud storage
    part (i.e., the `Channel B` in the [Figure 7.1](#Chapter7.xhtml#ch7-fig1)).


    • A channel among all learners engaged in open learning (i.e., the `Channel C`
    in the [Figure 7.1](#Chapter7.xhtml#ch7-fig1)).


    Once a learner indicates his or her desire to carry out micro learning and sends
    such a request from a mobile device, OERs will be transmitted through one of the
    three channels.


    Where the OERs actually come from the cloud resources pools (i.e., from which
    exact cloud nodes the OERs are retrieved and invoked) will be defined and externally
    supported by third-party service-selection and resource-allocation services from
    mainstream service providers. This problem has been well studied; typical solutions
    can be found in the work reported in the work presented by Wang and Shen (2016).


    Architecture and technical details of MLaaS can be referred to the [Chapter 3](#Chapter3.xhtml)
    and [Chapter 6](#Chapter6.xhtml). It is worth noting that MLaaS only produces
    micro OERs, rather than OERs. That is to say, normal OERs available online are
    collected by MLaaS and clustered in the OER pools, as shown in [Figure 7.1](#Chapter7.xhtml#ch7-fig1).
    For this reason, despite MLaaS owning its data collection mechanism, it shares
    some demographic and educational data with the platforms or providers from which
    the OERs originate. This helps in learner profiling, which was introduced in the
    [Chapter 5](#Chapter5.xhtml), even if a new learner registration in MLaaS is informal,
    and without sufficient demographic and educational data provided, as introduced
    in the [Chapter 6](#Chapter6.xhtml).


    ## 7.1.2 Working Principle of Adaptive Engine and Operation Environment of MLaaS


    The working principle of the Adaptive Engine which is located in the offline computing
    domain is shown as a sequence diagram, i.e., the [Figure 7.2](#Chapter7.xhtml#ch7-fig2).


    It is worth noting that there could be a need to merge the recommendation results
    obtained from both the online and offline computation. Since we adopt the `Top-N`
    recommendation, hence the recommendations provided from both side will appear
    in the recommendation list in a pro rata way.


    To cope with the thoughts raised in the [Section 3.1.3](#Chapter3.xhtml#sec3.1.3),
    ideally a cloud environment is configured for the operation of the PLE, namely
    the combination of TaaS and MLaaS. TaaS has been programmatically developed and
    deployed over the famous Amazon Web Service (`AWS`) cloud infrastructure. As aforementioned
    in the [Section 3.5](#Chapter3.xhtml#sec3.5), MLaaS is naturally service-oriented
    and performing in company with the previously-developed TaaS (Sun & Shen, 2014).
    MLaaS emphasis interactions with OER providers’ platforms and educational institutions’
    learning management systems, and it exposes its functions for those systems as
    well as external services (e.g. service-selection and resource-allocation services)
    to call and then invoke.


    Consequently, to implement the service-oriented framework in a mobile cloud environment,
    and to minimize the cost and time of development, it is worthwhile to employ the
    `AWS` again to fulfil the requirement of hosting, storing, computing and mobile-enabling.
    In this case, series of cloud services provided by `AWS` work in conjunction to
    build the comprehensive peer-to-cloud/peer environment for micro open learning.


    ![image](images/ch7-fig2.jpg)


    Figure 7.2. Working Principle of the Adaptive Engine


    Technically, the cloud hosting part is taken charge by the Amazon elastic cloud
    computing (`EC2`), in which the `EC2` block storage volumes (`EBS`) hold an instance
    for the entire system, comprising the extensible demand of CPU, memory, storage
    and network affiliated. Meanwhile the `Auto Scaling` and `Elastic Load Balancing`
    services work together with the `EC2` Container service in order to adjust its
    volume and control internet traffic.


    The information MLaaS deal with is snowballing with the fast-generated data (i.e.
    from both historical and real-time sides) regarding OER production and learners
    learning behaviours in open learning. `AWS Import/export Snowball` is ideal to
    utilize to addresses common challenges with large-scale data transfers including
    high network costs, long transfer times, and security concerns. `Amazon S3` will
    be employed as the data storage because of its robustness and mature disaster
    recovery mechanisms.


    Considering the interior of personalized learner model for micro open learning,
    it is suggested to be in the Amazon Rational Database service profiting from its
    resizable capacity in terms of real-time demand of data extraction and inference.
    Finally, the P2P tier of MLaaS is mapped out using Mobile Hub service from Amazon,
    which allows learners to create a personalized link and send it to peers for fast
    resource exchanges and transmissions through Channel C.


    ## 7.2 Empirical Evaluation


    Firstly we introduce the data sets we used in the evaluation of our approaches
    discussed in this paper. Note there is almost no e-learning system using learning
    distraction as a user rating, and because of the domain difference, the experimental
    data cannot be directly borrowed from existing data sets, such as the `MovieLens`.
    As a result, 3055 course samples are crawled from three main MOOC providers. Given
    we are among the first practitioners to apply micro learning concept into MOOC
    learning, these course samples are generally not in micro mode. We did not technically
    segment every course sample longer than 15 minutes into smaller pieces, while
    tagging each piece of it with starting time and end time. For example, the ‘Supply
    Chain Management’ course video in an ‘e-business’ OER from an Australian provider,
    OpenLearning, has an original length of 38 minutes. Instead of technically clipping
    it into three chunks, the three virtual OERs derived from it are attached three
    sequential tags in their corresponding `MicroOERProfile` sets and come with time
    tags ‘1-15 min’,’16-25 min’ and ‘26-38 min’, respectively. After logical segmentation,
    the final size of the trail micro OER sets is 11407. The `RA` value of each micro
    OER is derived from the course level settings identified by its provider, basically
    a course is in any of the five Grade Levels: Primary, Secondary, Further Education
    (diploma, college and technical schools), Higher Education (undergraduate) and
    Postgraduate. Moreover, each OER can have a Level of Study, which can be an Introductory
    Unit, an Intermediate Unit or Principal Area of Study, an Advanced Unit or a Specialized
    Advanced Unit, with the order of increasing difficulty. By jointly considering
    both types of levels, and applying a normalization calculation, the `RA` values
    are manually set for all micro OERs, ranging from 1-10.

