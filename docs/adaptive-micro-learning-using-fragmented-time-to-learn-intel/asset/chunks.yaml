  trans: '

    根据 Kolb 和 Kolb (Kolb & Kolb, 2005) 的研究，学习风格可以表示为具体经验（感受）、反性观察（观察）、抽象概念化（思考）和主动实验（行动）。然而，由于移动设备上的操作相对简单，输入输出方法受到限制，很难通过监控学习者的操作直接反映出这四种学习风格。因此，识别学习者的学习风格需要额外的努力。例如，采用某些外部方法是行的，如自评估。此外，如果其他开放学习活动中的学习指定了相关的学习风格，学习者在特定学习活动中的表现就可以反映他们对相应学习风格的重视。


    # C. 记忆能力


    记忆能力可以在学习的保留和再现阶段影响学习成果（Bui & Myerson, 2014）。对于文化、文学、艺术、语言和历史等学科的开放教育资源（OER），记忆能力是帮助学习者将在线
    OER 内容转化为自身知识的关键衡量之一。在利用碎片化时间学习这些学科时，这一点尤为重要（Xiong, 2015）。


    # 4.1.3. 非智力因素与智力因素的交汇


    # A. 学习习惯


    每位学习者都有完全孤立的可用时间和学习时间结构。校内教师主导的学习时间大部分集中在白天。与此不同，移动/微开放学习时间遍布全天 24 小时。他们的个人情况影响着学习习惯，在本研究中，这指的是学习者如何利用时间开放学习、以什么方式获取学习资源、暂停和重复的频率、多久后进行复习、是否并行学习来自多个提供者的
    OER、在一天中哪些时间段经常进行开放学习，以及在这些时间段中，何时更倾向于采用微学习手段。


    # B. 学习速度


    这一特征是指学习者完成一个课程块并结束相关任务的平均花费。这可以从他们的历史学习记录中进行估计。


    # C. 语言能力与偏好


    应当考虑学习者的语言能力和偏好，以选择或排除他们的学习资源。由于大多数 OER 是英文的，因此识别学习者的英语水平至关重要。或者，该服务还调查了他们更倾向于用母语还是英语以外的第二语言进行学习。


    # D. 干扰程度


    在内部，它涉及学习者的情绪和情感，与干扰程度高度相关，干扰是外部因素的一个组成部分（Dennen & Hao, 2014; Khaddage et al.,
    2015）。


    # 4.1.4. 外部因素


    # A. 学习地点与环境


    学习者连接互联网的方式显然揭示了他们的学习地点和周围环境。通常在微学习场景下，他们通过两种方式接入互联网，即 `Wi-Fi` 或移动蜂窝网络（例如 `4G`、`3G`
    和 `GPRS`）。简单来说，通过移动网络连接互联网意味着学习者正在随机进行学习活动，移动信号的强度变化可以反映他们处于移动状态的状态。


    # B. 一般情况


    有关学习背景的一情况部分影响着他们的学习体验和成就。为了满足微学习需求，必须明确有关移动设备的信息（Tortorella & Graf, 2012）。


    # C. 协作学习的帮助


    受开放学习结构性质和 OER 教学理念的影响，学习者可以从社交网络活动中获得有用信息（Ji et al., 2016）。


    # D. 干扰程度


    干扰程度取决于周围的噪音因素、对 OER 交付设置和布局的舒适度（Christensen, 2003）。


    # 4.2 微学习内容


    # 4.2.1. 微 OER 分类与定制


    # A. 现成的微 OER


    开放学习改变了学习者的预期，支持开放学习的技术也可以支持微学习。既然开放学习在规模和格式上已经扩展（即 OER 已经演变，现在该缩写包含了许多类型的课程），OER
    提供者为培训部门或教育提供者及机构提供了多种选择，以便在组织内部实施微学习路径，让学习者建立充满多样性和乐趣的自己的学习计划（Lourdes & Albert,
    2013）。典型的学习资源涉及短视频和其他视觉学习资源、间隔重复和练习活动、交流与协作环境，以及证书和游戏化。因此，如果微学习资源在短时间内（例如 15 分钟）有明确定义，它们通常会立即交付。


    # B. 非微 OER


    然而，大多数实现的 MOOC 内容是非微学习资源，需要适当的精炼。这些内容需要进一步的处理和修订以满足微学习需求。


    - 视觉百科全书：根据整个课程的知识结构列出学习要点。对于每个要点，设置了无时间限制的视频或文本材料，以清晰地阐述自包含的内容。


    - 课件和课程视频的逻辑分：此处每个单元涵盖了一个学习章节的完整信息，包括开始和结束条件，携带连贯的内容，并且可以单独学习。

    '
- fmt: '

    ## Learning Methods


    - **Extraction of sections from a complete course material**: In this case the
    specific knowledge parts are selected and extracted in the first place while the
    redundant contents of the course are eliminated. Given many OERs with the same
    contents or knowledge scopes are offered from different OER providers (e.g. a
    MOOC course ‘machine learning’ offered from Stanford University and Carnegie Mellon
    University) the section extraction enables learners to learn in parallel, precisely
    locate the particular chapters, with no need to go through the whole course.


    - **Course-related and educational information in affiliated social media**: This
    is a ramification of learning resources and also has rich educational values.
    This resource can be found not only in forums or blogs embedded in MOOC platforms,
    but also in other popular social media (e.g. Face-book, WeChat, Twitter, Tumblr,
    etc.), where learners, educators or external experts publish course-related materials
    (Mark et al., 2010). A noticeable feature of this kind of resources is that its
    amount increases from time to time while some of the contents may contain pseudoscience
    or incorrect information (Dowling, 2013; Henry, 2014).


    - **Subscription learning**: from pedagogical view it is also been deemed as passive
    learning. As its name implies, it provides an intermittent stream of learning-related
    interactions to those who are subscribed. These learning-related interactions
    can involve a great variety of learning-related events, including content presentation,
    diagnostics, scenario-based questions, job aids, reflection questions, assignments,
    discussions, etc. Such interactions are short, intentionally scheduled over-time
    to support learning, often utilizing research-based findings related to the spacing
    effect. Learners subscribe one or more series of learning interactions can form
    as multiple learning threads (Waard et al., 2012).


    - **Two-way interactive contents or activity settings**, ranging from feedback,
    assessment, review for contents generated by other learners, peer-to-peer learning,
    cooperative writing, collaborative work, and flipped classroom.


    - **Learner-generated contents**: highly promoted by open learning practitioners
    and educators, P2P learning, digital flip classroom, mutual supervisions are more
    and more of attached educational values in open learning (Lee & McLoughlin, 2007).
    The new shape of MOOC which emphasis connectivist brings the acquisition and sharing
    of learner-generated contents into regular learning means (Cochrane et al., 2013;
    Narayan, 2011).


    ## 4.2.3. Micro OER Measurement


    ### A. Functional Attributes


    For modelling purpose, a learning resource chunk is considered to be measured
    with regards to the following features (Al-Hmouz et al., 2010; Miranda & Albano,
    2015; Bouarab-Dahmani et al., 2015):


    - Time length

    - Suitability for mobile learning

    - Didactic model (inductive, deductive, learning by practice, etc.)

    - Mediality (e.g. print media, electronic media, mono-media vs. multi-media, (inter-)mediated
    forms, etc.)

    - Difficulty (level of knowledge)

    - Completeness

    - Requirement of attention

    - Preferred learning styles

    - Type of interaction (expositive, active, one-way imparted or two-way interactive)

    - Requirement of input or hands-on practice

    - Learning type: repetitive, activist, reflective, pragmatist, conceptionalist,
    constructivist, connectivist, and behaviourist; also: action learning, corporate
    learning, discipline.


    Also, micro OER has its basic information such as topic, language, which will
    be.


    ### B. Non-functional Attributes (QoS)


    These attributes describe the quality of services. We carry on service-oriented
    architecture, and listed some:


    - Performance (response time, latency, throughput)

    - Reliability (availability, fault tolerance, recoverability)

    - Robustness and stability

    - Scalability

    - Compatibility, interoperability, Security


    ## Summary


    In this chapter we have presented the structure of comprehensive learner model
    which focuses on most significant inputs. The model consists of two domains (i.e.,
    internal and external), while the internal factors can be classified into personal
    and non-intellectual factors. Some components fall in both domains. According
    to our design, the semantic construction of the learner model will use a machine
    learning-based approach to acquire, represent, store and infer each learner’s
    profile. The detailed approach will be introduced in the next Chapter 5.


    ## Chapter 5: Semantic Knowledge Base Construction: Education Data Mining and
    Learning Analytics Strategy


    Since all decisions of micro OER adaptation are made by the `Adaptive Engine`,
    it acts as the core of offline computation system. It consumes the results from
    all other services and transmits its output straight to the user interfaces. For
    this reason, the `MLaaS` is conceived to meet the standard of data-rich system,
    and a knowledge base serves as its think tank.


    Basically, the knowledge base is constructed using top-down approach, by making
    use of semantics means, from pattern level to data level. In other words, several
    ontologies are drawn at first, followed by `data processing` work. We attempt
    to combine the pattern and rule discovery processes of micro learning with a survey
    of education literature to produce features that could affect the learning experience
    and outcomes in a mobile environment (Sun et al. 2015). In detail, `data processing`
    work involves all operations on data, from the very beginning to the end, such
    as entity extractions, relationship extractions, resolution disambiguation and
    so on.

