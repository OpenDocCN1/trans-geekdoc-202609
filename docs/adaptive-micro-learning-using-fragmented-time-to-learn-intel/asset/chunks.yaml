    \ Support**: Although `OER` is fully international; there were needs for local\
    \ support. Chae and Jenkins (2015) summarized from their participants’ opinion\
    \ that they are delighted to have a local `OER` service unit on campus and a readily\
    \ available person who are well versed in finding, utilizing, designing and tailoring\
    \ of `OER`. These goto persons help incoming instructional designers, instructors\
    \ and other stakeholders in open learning to get familiar with the similar operations\
