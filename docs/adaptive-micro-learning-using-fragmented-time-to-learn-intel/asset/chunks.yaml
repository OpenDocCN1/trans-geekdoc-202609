    # Yahoo 进行的研究（Gutierrez, 2014）指出，尽管用户似乎对移动设备上瘾，且不愿放下设备，但这并不意味着他们只是想快速地接收和处理信息。某项研究结果（Chen
    & Lin, 2016）显示，在进行移动学习（m-learning）时，年轻学习者频繁停止学习活动并将注意力转移到其他事情上，其注意力持续时间通常限制在 15
    分钟以内。


    Stockwell (2008) 分析了年轻学习者在移动学习中的注意力持续时间，结果显示在进行移动学习时，他们的学习活动经常被其他活动中断，导致其注意力跨度通常限制在
    15 分钟内。


    ## 微学习及其益处


    微学习对精通学习具有积极影响，并是混合学习的重要组成部分（Milligan et al. 2013; Zhang & Ren 2011）。它可以帮助学习者利用每一份碎片化时间，在极短的时间内参与学习活动。与通过一次或多次中断完成一个课程模块相比，这种方式有助于他们获取针对性知识产生积极效果（Bruck
    2008）。在小型且规划良好的单元或活动的帮助下，通过小步进行学习（不同于传统的通过数小时课程进行学习的方法）成为可能。因此，微学习变得短小、易消化且易于管理（Kovachev
    et al., 2011）。微学习还适应了人类大脑注意力跨度方面的限制。这与研究发现一致，即人们在短而集中的课程中学习，比在导致信息过载的长时课程效果更好（Bruck
    et al., 2012）。


    在文献中，“微学习”过程的时间跨度从几秒（例如在移动学习中）到 15 分钟或更多。对微学习的另一种解释是：“微学习指的是在小型学习单元上的短期学习活动。在当代的移动/网络社会中，微学习涉及基于网络资源的碎片化知识”（Kovachev
    et al., 2011）。与传统的数小时在线学习相比，微学习具有高度灵活性，可以以各种形式交付，更重要的是，它受的时间限制较少。换句话说，它可以随时开始，也可以随时结束。


    ## 移动学习与整合


    在移动学习中，学习活动可以在学习者方便的情况下进行，无论地点和时间如何。通过这种方式，学习者可以从各种场景中获取学习资源。通过移动设备，学习者经常在短时间内完成学习任务。根据
    Hug 和 Lindner (2005) 进行的研究，微学习可以作为对完成相关学习任务所需时间的假设，例如回答问题、记忆某项信息或寻找学习材料。因此，微学习随着移动设备的广泛使用而蓬勃发展，并成为移动环境中的主要学习手段。微学习与移动学习具有一些相似的特点，因为它们两者都是相互独立的、自包含的、可重复的且可重新组合的（Sanchez-Alonso
    et al., 2006; Leene, 2006）。


    澳大利亚教育者使用不同的多媒体使课程更加全面，这有助于学习者更有效地理解。课程内容可以在不同课程之间重复使用。另一方面，这些广泛使用的课程材料是视觉信息的形式，而教育微内容建议采用类似的形式，可能包括文本、视频、音频、图片、图表或绘图等（Liao
    & Zhu, 2012）。移动学习与微学习相辅相成。人们在工作场所越来越多地使用移动设备进行通信以及搜索问题的答案。它让员工在执行日常活动的同时进行学习，而不是要求他们离开工作环境（Semingson
    et al., 2015）。微学习资源可以按需提供，以便即时学习（Gassler et al., 2004）。这些微小的学习字节不仅有助于快速吸收，还使移动学习成为可能，从而减少对固定时间段的依赖或从工作中抽出大量时间的需求（Gutierrez,
    2014; Anderson et al., 2014）。


    随着微学习的演进，通过一系列微交互进行微内容交付，使用户能够在没有信息过载的情况下学习（Souza & Amaral, 2014）。它是确保更好学习结果的关键技术（Kovachev
    et al., 2011）。


    ## 2.2 开放学习与开放教育资源


    开放学习旨在整合在线学习开放课程，被许多大学大力追求（Hilton, 2016）。这个术语早在 1975 年就被许多研究人员定义，并且一直在演变。开放学习一直处于公共领域，并在免费使用的许可协议下进行组织（Harley,
    2008）。


    开放学习寻求消除所有不必要的学习障碍，同时旨在为学生在一个以其需求为中心的教育和培训系统中提供合理的成功机会（Neil Butcher, 2011）。它包含了几个核心原则：


    - 学习机会应该是终身的，并应该涵盖教育和培训（Leone, 2018）；

    - 学习过程应该以学习者为中心，建立在他们的经验基础上，并鼓励独立批判性思维（Hannafin et al., 2013）；

    - 学习提供应该是灵活的，以便学习者可以不断选择他们在何地、何时、什么以及如何学习，以及学习的速度；

    - 先前的学习、先前的经验和展示的能力应该被认可，以免因缺乏资质而限制教育机会；

    - 学习者应该从不同的学习环境中加载进度或积累学分；

    - 提供者应该为公平的机会创造条件。


    开放学习使用的资源从完整课程、课程材料、模块、教材、流视频、测试、软件以及任何支持获取知识的工具、材料或技术（Atkins et al., 2007）。形式上，开放教育资源是“免费开放地提供给教师、教育者、学生和独立学习者的数字学习资源，以便在教学、学习和中使用、共享、组合、调整和扩展”（Hilton,
    2016）。研究人员总结了开放资源的发展符合 `5R`，其中：


    - `Retain`（保留）指的是制作并拥有副本；

    - `Reuse`（重复）表示以广泛的方式使用；

    - `Revise`（修订）代表调整、修改和改进的操作；

    - `Remix`（混合）等于组合两个或多个；

    - `share with others`（他人共享）通过 `Redistribute`（重新发布）得到强调（Theraroungchaisri, 2016）。


    以下问题是导致开放学习（或者说开放资源利用）快速发展和广泛接受的主要原因：


    - **成本**：成本问题（例如教材）在在线学习甚至传统的校园学习中，始终处于用户/客户方的要位置，这些客户可以是学习者，也可以是教育提供者。这个问题在发展中国家尤为突出（Lesko,
    2013）。


