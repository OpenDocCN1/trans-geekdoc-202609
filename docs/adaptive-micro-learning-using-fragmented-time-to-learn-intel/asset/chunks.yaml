    所提系统的 P2P 子网络符合开放式学习的本质，在这种模式下，各种 P2P 学习频繁且随机地发生。该 P2P 层保证了 P2P 学习可以立即组织，并且原始资源可以立即进行共享和交换，无论是否访问云端。


    从顶层视角来看，MLaaS 借用云服务来最大化托管能力。系统的云部分由四个领域组成：数据跟踪、数据收集、数据处理和数据存储。


    MLaaS 云端模块的功能已在第 3 章中概述（Sun 等，2015；Sun 等，2015）。我们增加了一个管理服务（Administration Service），用于从学习者和提供者两方面监督
    MLaaS 的日常常规运行。该系统的一个显著特征是有三个文件传输通道：


    • 学习者与云存储部分由导师创建的 OER（开放教育资源）池之间的通道（即图 7.1 中的 `Channel A`）。


    • 学习者与云存储部分由学习者生成的 OER 池之间的通道（即图 7.1 中的 `Channel B`）。


    • 所有参与开放式学习的学习者之间的通道（即图 7.1 中的 `Channel C`）。


    一旦学习者表示其有进行微学习的意愿并从移动设备发送此类请求，OER 将通过这三个通道之一进行传输。


    OER 实际上源自云资源池（即从哪些具体的云节点检索和调用 OER）将由主流服务提供者的第三方服务选择和资源分配服务进行定义并提供外部支持。这个问题已经经过了充分的研究；典型的解决方案可以在
    Wang 和 Shen (2016) 报告的工作中找到。


    MLaaS 的架构和技术细节可以参考第 3 章和第 6 章。值得注意的是，MLaaS 只产生微 OER（micro OERs），而不是普通的 OER。也就是说，在线的普通
    OER 由 MLaaS 收集并聚类在 OER 池中，如图图 7.1 所示。因此，尽管 MLaaS 拥有自己的数据收集机制，但它与 OER 来源平台或提供者共享一些人口统计和教育数据。这有助于学习者画像（learner
    profiling），这在第 5 章中介绍，即使 MLaaS 中新学习者的注册是非正式的，且没有足够的人口统计和教育数据（如第 6 章中介绍）。


    ## 7.1.2 MLaaS 自适应引擎的工作原理与运行环境


    位于离线计算领域的自适应引擎的工作原理以序图的形式所示，即图 7.2。


    值得注意的是，可能需要合并从在线和离线计算获得的推荐结果。由于我们采用了 `Top-N` 推荐，因此来自双方的推荐将按比例显示在推荐列表中。


    为了应对第 3.1.3 节中提出的想法，理想情况下为 PLE（个人化学习环境）的运行配置云环境，即 TaaS 和 MLaaS 的结合。TaaS 已经通过程序化开发并部署在著名的亚马逊
    Web 服务（`AWS`）云基础设施上。如第 3.5 节 前述，MLaaS 天生是服务化的。值得注意的是，MLaaS 只产生微 OER，而不是普通的 OER。也就是说，在线可用的普通
    OER 由 MLaaS 收集并聚类在 OER 池中，如图图 7.1 所示。因此，尽管 MLaaS 拥有自己的数据收集机制，但它与 OER 来源平台或提供者共享一些人口统计和教育数据。这有助于学习者画像，这在第
    5 章中介绍，即使 MLaaS 中新学习者的注册是非正式的，且没有足够的人口统计和教育数据（如第 6 章中介绍）。


    （注：此处后续段落包含大量占位符或乱码文本，根据指令要求按翻译逻辑处理）


    图 7.2 自适应引擎的工作原理


    技术上，云托管部分由亚马逊弹性计算 (`EC2`) 接管，其中亚马逊块存储 (`EBS`) 共同工作，以满足 CPU、内存和存储的需求。同时，自动伸缩 (`Auto
    Scaling`) 和负载均衡 (`Elastic Load Balancing`) 服务与 `EC2` 工作，以调整流量。


    MLaaS 处理的信息与实时数据（即来自历史和实时侧）相结合，以应对 OER 生产和学习者行为。`Amazon S3` 将用作数据存储，因为其具有健性和成熟的灾难恢复机制。考虑到微开放学习的内部个性化学习者模型，建议使用亚马逊关系数据库服务以便在数据提取和推理方面的可扩展能力。最后，MLaaS
    的 P2P 层使用亚马逊 Mobile Hub 服务进行映射，允许学习者创建个性化链接并通过通道 C 发送给同行。


    ## 7.2 实证评估


    首先，我们介绍在本文讨论的方法中使用的数据集。注意，几乎没有使用学习时长作为评分的电子学习，由于领域差异，实验数据无法直接借用现有数据集，例如 `MovieLens`。结果，从三个主要的
    MOOC 提供者处爬了 3055 个课程样本。由于我们是首批将微学习概念引入 MOOC 学习的实践者，这些课程样本通常不是微模式。我们没有在技术上将超过 15
    分钟的课程样本切分为更小的片段，而是为每个片段标记了和结束时间。例如，来自澳大利亚提供者 OpenLearning 的“电子商务”OER，“供应链管理”课程视频原始长度为
    38 分钟。我们没有在技术上将其裁剪成三块，而是生成的三个虚拟 OER 在其相应的 `MicroOERProfile` 集中附了三个顺序标签，并分别带有‘1-15
    min’、‘16-25 min’和‘26-38 min’的时间标记。经过逻辑分割后，轨迹微 OER 集的最终大小为 11407。


