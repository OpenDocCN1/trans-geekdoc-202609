    1400 user profiles are randomly generated conforming to the law of normal distribution.
    Their demographic data component is fully filled. Most users’ data regarding behaviours
    over micro OERs are left as blank, while very few users are set up with initiate
    values in their dynamic parts of lightweight profile, serving as seed data.


    Next, for weights in the Subsection B of [Section 6.1.5](#Chapter6.xhtml#sec6.1.5),
    `W[l]` is set as 0.8 and `W[i.j]` is set as 0.2; for weights in the Subsection
    C of [Section 6.2.1](#Chapter6.xhtml#sec6.2.1), `α`, `β`, `γ` and `δ` are set
    as 0.4, 0.3, 0.15 and 0.15, respectively.


    Researchers investigated the performance of the binary classifier C4.5 decision
    tree and Naïve Bayes classifier, using MovieLens data sets, while C4.5 produced
    results with better Mean Absolute Error (MAE) or Root Mean Square Error (RMSE)
    (Lika et al., 2014; Sieg et al., 2010). Therefore, we adopt the C4.5 in Algorithm
    2. The evaluation of the demographic classification illustrated in [Chapter 6](#Chapter6.xhtml)
    is carried out on the basis of a classic k-fold cross-validation approach.


    # 7.2.1 Empirical Study 1 - Evaluation of Heuristic Recommendation for Cold Start


    In e/m-learning area, high MAE and RMSE values do not equal to high user satisfaction.
    In Top-N recommendation the Precision and Recall are suggested to be utilized
    as evaluation indices because they are more user-centric.


    To obtain the scale of relevant micro OERs in the simulated data set, the heuristic
    algorithm is executed four times.


    1. For the first time, the exact `Algorithm 6.3` is executed; a Top N recommendation
    list is generated.

    2. For the second time, the exact `Algorithm 6.3` is executed, a Top N+2 recommendation
    list is generated.

    3. For the third time, the preference feature is removed from the fitness function
    in `Algorithm 6.3`, a Top N+2 recommendation list is generated.

    4. For the fourth time, the distraction feature is not considered in algorithm
    operation, a Top N+2 recommendation list is generated.


    We take the results obtained from the first time of algorithm operation as the
    exact recommended items. As the rest algorithm operations return larger solution
    sets than the first time, the union set of the latter three Top N+2 lists is treated
    as the relevant micro OER set.


    ## Table 7.1. Recall and Precision Definition


    | | Relevant | Irrelevant |

    | --- | --- | --- |

    | **Recommended** | True Positives (TP) | False Positives (FP) |

    | **Non-recommended** | False Negatives (FN) | True Negatives (TN) |


    **Recall.** The Recall value is defined as the relevant micro OERs recommended
    by MLaaS versus all relevant micro OERs, where:


    ![image](images/ch7-Eq1.png)


    **Precision.** The Precision is the proportion of recommended items that are relevant
    to the given context, where:


    ![image](images/ch7-Eq2.png)

    ![image](images/ch7-fig3.jpg)


    Figure 7.3. Recall Value of Top N Recommendations by Heuristic Algorithms


    For the heuristic algorithms proposed in the `Algorithm 6.3`, four heuristic algorithms,
    namely Genetic Algorithm (GA), Simulated Annealing (SA), Tabu Search (TS) and
    Evolutionary Programming (EP) are selected to conduct the computation. In Top-N
    recommendation, different numbers of recommendations shown in the list might lead
    diverse performance. We also investigate the impact of the value of `N` on the
    performance of recommendation. We set `N` as 1, 3, 5 and thereafter every multiple
    of 5 till 50. The experiment results are shown in the [Figure 7.3](#Chapter7.xhtml#ch7-fig3)
    and [Figure 7.4](#Chapter7.xhtml#ch7-fig4).


    As shown in [Figure 7.3](#Chapter7.xhtml#ch7-fig3) and [7.4](#Chapter7.xhtml#ch7-fig3),
    each heuristic algorithm provides acceptable Recall and Precision results initiated
    from a cold start condition. Almost all of them reach the convergence after 250
    iterations, which is in a reasonable scale. It is notable that when `N` is set
    larger than 15 the Recall values do not increase sharply. GA gains the highest
    Recall value while the rest are all between 35% and 45%, which does not incur
    a major difference.


    As shown in [Figure 7.4](#Chapter7.xhtml#ch7-fig4), although EP performs best
    at the beginning of comparison, its performance drops dramatically when `N` is
    set larger than 15.


    GA could be an alternative as it shows more stable performance. Combining both
    indices together, GA holds a better Recall-Precision values overall. However,
    it can be argued that if the learner prefers a concise list of recommendation,
    EP is worth to be considered as the core algorithm. Turning back to the micro
    open learning scenario, it is ideal to have the higher Recall and Precision values
    the better. Briefly, the higher Recall values give the learners opportunities
    to go through wider range of micro OERs in terms of the given context (Lu et al.,
    2015). However, in micro OER recommendation, poor precision can lower the user
    satisfaction as if learners fail to get their wanted resources at the first time
    they may choose to switch off. Hence, when these two indices cannot be fulfilled
    at the same time, it is suggested Precision has higher priority (Sikka, 2016).
    Therefore, an insight can be derived that when setting up the list, the number
    of candidates is not suggested to exceeding 15. Please note in the [Figure 7.3](#Chapter7.xhtml#ch7-fig3)
    and [7.4](#Chapter7.xhtml#ch7-fig4), GA, SA, TS, and EP are the abbreviation of
    genetic algorithm, simulated annealing, Tabu search and evolutionary programming,
    respectively.


    ![image](images/ch7-fig4.jpg)


    Figure 7.4. Precision Value of Top N Recommendations by Heuristic Algorithms


    # 7.2.2 Empirical Study 2 - Comparison with Different Recommenders


    In this part, we compare the performance of our proposed MLaaS approaches, empowered
    by EP and GA, with other widely used recommenders in cold start.


    A user-based recommender is retrieved by predicting user rating (preference) with:


    ![image](images/ch7-Eq3.png)


    where:


    ![image](images/ch7-Eq4.png)


    An item-based recommender is also built according to:


    ![image](images/ch7-Eq5.png)


    where


    ![image](images/ch7-Eq6.png)


    In addition, we also apply two well-established similarity measure models NHSM
    (Liu et al., 2014) and ACOS (Ahn, 2008).


    Top N recommendations are generated by these recommenders. As inspired from the
    experiment 1, we set `N` as continuous integers from 1 to 20, which is a little
    bit over the potential threshold, 15. Take the `N` as x-axis, the comparison results
    are shown in [Figure 7.5](#Chapter7.xhtml#ch7-fig5) and [7.6](#Chapter7.xhtml#ch7-fig6).
    Please note the GA and EP represent genetic algorithm and evolutionary programming.


    ![image](images/ch7-fig5.jpg)


    Figure 7.5. Precision Values of Top N Results by Different Recommenders

