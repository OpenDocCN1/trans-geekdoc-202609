    如第 6.1 节所示，已建立的学习路径适用于特定的学习者，例如 `L[j]`，其在矩阵中的偏好值被选中。一种 `K` 最近邻域（KNN）算法能够将与新微 OER
    `MR[n]` 具有较高相似性的项目进行聚类。它们的邻居形成一个集合 `G` (Airoldi 等人 2012)。因此，新微 OER 的偏好预测通过以下方程
    (6.10) 计算：


    ![image](img/ch6-Eq10.png)


    ## B. 将新微 OER 插入到已建立的学习路径中


    在识别出 `MR[n]` 的邻居并预测 `L[j]` 对其偏好程度后，该方法采用了爬山算法来为 `MR[n]` 定位合适的位置。新项目将根据算法 6.4 插入到已建立的学习路径中：


    ![image](img/115.jpg)


    注意的是，爬山算法在对适应度的比较上执行，能够通过局部搜索有效地放弃适应度较差的学习路径并减少迭代次数。这加速了插入新微 OER 的学习路径的整体生成速度。


    该方法没有检查所有矩阵中的所有元素，因此其计算复杂度和运行时间对于需要快速响应的在线计算是可以接受的。


    ## 6.3 实时互补机制


    在线计算处理用户未在历史数据库中排序的短期和实时活动。除了解决“新用户”冷启动问题外，它还从项目视角持有一个“秒”级粒度的实时算法。这涉及到两个考虑因素。第一个是提高新发布微
    OER 的推荐性能，特别是在学习者访问 MLaaS 的同一天。进一步采用第 6.2.2 节中介绍的方法，它可以增加新微 OER 的可发现性，即使它们在系统中没有记录任何流行度或评分数据。此此外，对微
    OER 的最新操作可以更准确地揭示其推荐价值。由于在线计算应在几秒钟内做出响应，冗余的离线算法需要大幅简化，因为时间绝对不允许检查所有学习者与微 OER 的交互。


    算法简化可以通过对学习者-微 OER 矩阵进行行扩展、列扩展或两者兼顾来实现。其主要结果是更新画像和全面的学习者模型。更新不应在在线计算侧进行全规模执行，而应具有明确目的，并突出操作的“近期性”。


    对于列扩展，在线计算领域查询并检索特定学习者的近期微开放学习行为，即该学习者在极近期访问的微 OER 列表。然后将这些用法中微 OER 的对应名称填充到 `item`
    列中，以填补此前已进行水平扩展的学习者-微 OER 矩阵中的空白。这可以消除新旧微 OER 之间的差距，并解决微 OER 之间关联宽度无法拆分的问题。它还可以消除由于特定学习者在近期或实时未访问的旧微
    OER 之间的关联而对离线计算结果产生的影响。


    对于行扩展，在线计算领域针对特定的微 OER，并调用实时访问它的用户列表。然后将这些访问日志中相应的用户名称填充到 `user` 行中，以填补此前已进行垂直扩展的学习者-微
    OER 矩阵中的空白。然而，与行扩展相关的深度和广度变化的关联是可以被拆分的。换句话说，在线计算和离线计算可以分开进行，不存在任何数据缺口。因此，在技术上，它比列扩展更有意义。


    ## 总结


    当系统和用户都是新的时，MLaaS 缺乏初始信息为微开放学习带来了困难。在本章中，我们介绍了一种处理微 OER 推荐的新方法，主要关注在线计算。我们的主要贡献可以总结为：我们识别了冷启动问题，并创新性地采用区分程度作为推荐的索引。随后，提供了一种详细的方法，通过在框架环境中处理这些冷启动问题。据此构建了学习者和微
    OER 的增强画像。基于第 6.2 节](#Chapter6.xhtml#sec6.2)中介绍的工作，通过算法 6.4 提出了插入微 OER 的解决方案。该算法通过爬山法进行了增强。


    最后，第 6.3 节](#Chapter6.xhtml#sec6.3)中介绍的方法旨在保持学习者模型的更新，并实现秒级的响应。


    # 第 7 章


    ## 实现与实验评估


    由于 MLaaS 的设计和计算过程在前面的章节中已有介绍，在第 7 章中，我们将介绍本研究的实现与实验评估。首先，我们将在第 7.1 节](#Chapter7.xhtml#sec7.1)介绍
    MLaaS 的拓扑和工作原理。之后，我们将在第 7.2 节](#Chapter7.xhtml#sec7.2)评估计算过程的性能。首先执行冷启动算法以确定理想的
    Top N 推荐，选取优化启发式算法作为核心算法。所选算法将与文献中建立推荐器进行比较。


    ## 7.1 系统实现


    ### 7.1.1 系统拓扑


    MLaaS 的拓扑如图 7.1](#Chapter7.xhtml#ch7-fig1) 所示。作为一个数据丰富的系统，MLaaS 能够利用详细的学习活动数据不仅推荐特定学生的下一个微学习活动，还可以预测该学生在该内容上的表现。


    在我们团队的一项试点工作中 (Sun & Shen, 2013)，我们提出了面向服务的背景的资源共享和存储的点对云和点对点模型。与传统的云模型、用户模型或点对服务器模型相比，此类模型具有更高的上传和下载速度，并且对云环境中的节点或服务器故障更具鲁棒性
    (Sun & Shen, 2013; Shen 等人, 2011)。因此，我们采用了这种设计并将其概念作为新系统的拓扑。


    ![image](img/ch7-fig1.jpg)


    图 7.1. MLaaS 架构拓扑

