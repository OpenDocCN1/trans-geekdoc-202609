- fmt: "\n## Figure 3.3. Workflow of Assembling an Entire Micro Learning Experience\n\
    \nAll course modules available in micro open learning can be clustered by using\
    \ clustering algorithms, such as the widely used `K-means` and `K-nearest neighbours`,\
    \ with their similarity metrics to categorize the course modules into different\
    \ knowledge groups. Each cluster of course chunk is treated as an individual knowledge\
    \ domain under the course. By leveraging `EDM` and `LA`, we can establish rules\
    \ within each cluster or among various clusters to identify the sequence of two\
    \ course modules.\n\nLearning paths can be generated randomly as initial solutions,\
    \ and then they are optimized by artificial intelligence techniques or heuristic\
    \ algorithms (e.g. `genetic algorithm`) in terms of established rules and with\
    \ respect to multiple purposes. The workflow of learning path optimization is\
    \ shown as [Figure 3.3](#Chapter3.xhtml#ch3-fig3).\n\n## 3.5.2 Online Computation\n\
    \nThe adaptation of online computation rises popularly in many industry-leading\
    \ recommender systems, such as `Netflix`[^b](#Chapter3.xhtml#fn2) and `Amazon\
    \ Online Store`[^c](#Chapter3.xhtml#fn3). It is believed that online computation\
    \ can respond better to recent events and user interaction, but has to respond\
    \ to requests in real-time. This can limit the computational complexity of the\
    \ algorithms employed as well as the amount of data that can be processed (Amatriain,\
    \ 2013). It can effectively deal with data sets with comparatively smaller sizes.\
    \ Inspired from the adoption of online computation in e-business and entertainment\
    \ systems, we borrow the idea to facilitate the performance of `MLaaS` on the\
    \ computation based on the ‘recentness’ of learning activities, namely learning\
    \ behaviours and `OER publishment`.\n\nThe major contribution of the online computation\
    \ domain we propose is that, it dedicates to handle the shortage of data (i.e.\
    \ learning information) in building the initial learning model and path, due to\
    \ the both new system and new user conditions. It utilizes a lightweight version\
    \ of `learner-micro OER model` to act on the pervasive cold start problem agilely.\
    \ This lightweight model works in accordance with classification algorithms, similarity\
    \ measures, and prediction techniques to figure out the problem of first delivery\
    \ of micro OER without the requirement of any known priori probability.\n\nMoreover,\
    \ the online computation has expertise in promotion of new `OERs` by inserting\
    \ latest published micro `OERs` into established learning paths. It also fuses\
    \ the learners’ nearest behaviours and most recent events into the recommendation\
    \ results in order to meet the demand of high timeliness.\n\n## Summary\n\nIn\
    \ this chapter we rolled out the ‘big map’ of our research and identified the\
    \ research problems we will tackle in the upcoming chapters of this book. Firstly\
    \ we reviewed the background of our research, where a `PLE` was proposed over\
    \ a service-oriented architecture. Our pilot study motivated us to facilitate\
    \ the current delivery shape of `OER`, and the research challenges were summarized\
    \ in terms of adaptive micro learning, online computation and cold start problem,\
    \ respectively. The research purpose was listed according to the sequence of upcoming\
    \ chapters, and explained by scenario examples. In the [Section 3.5](#Chapter3.xhtml#sec3.5)\
    \ we described the system framework, where an online and an offline computation\
    \ domain are involved to jointly make the decision of adaptive micro OER delivery.\n\
    \n^([a](#Chapter3.xhtml#rfn1))[https://www.usc.edu.au/explore/structure/divisions/centre-for-support-and-advancement-of-learning-and-teaching](https://www.usc.edu.au/explore/structure/divisions/centre-for-support-and-advancement-of-learning-and-teaching)\n\
    ^([b](#Chapter3.xhtml#fn2))[https://www.netflix.com/]\n^([c](#Chapter3.xhtml#fn3))[https://www.amazon.com/]\n\
    \n# Chapter 4 Comprehensive Learner Model for Micro Open Learning\n\nFollowing\
    \ the system framework of `MLaaS` in the previous [Chapter 3](#Chapter3.xhtml),\
    \ we will focus on the `OER` and `Adaptive Engine` which is core of this chapter.\
    \ By investigating literature in the intersection of computer science and learning\
    \ science, we have screened out features that play important role in comfortability\
    \ and success of micro learning. \n\nAs shown in [Figure 4.1](#Chapter4.xhtml#ch4-fig1),\
    \ the learner model consists of two domains of factors (i.e. internal and external),\
    \ while the internal factors can be classified into personal intellectual and\
    \ non-intellectual factors. Each domain is enclosed by a rectangle outline and\
    \ is distinguished by a particular colour (i.e. external factors are in green\
    \ rectangle, and internal factors are in black rectangle, where personal intellectual\
    \ factors are in blue while Non-intellectual factors are in red). Some components\
    \ can fall in the intersection of two domains which means these components are\
    \ multi-correlated to two factors. Also, a component can be overlapped with others,\
    \ which suggests that they are associated and mutually affected.\n\n## 4.1 Comprehensive\
    \ Learner Model\n\nAlthough it is not difficult to track, monitor and record the\
    \ entire process of a learner who accesses `OERs`, reporting them visually and\
    \ statistically in order to reveal each learner’s story is more crucial. This\
    \ plays a significant role in conducting study ratiocination, judging learners’\
    \ status, estimating learners’ progress and carrying out learning strategy decision\
    \ making.\n\nThe data collection for building learner model can be realized in\
    \ two ways: static data collection (e.g. from mandatory requests) and dynamic\
    \ data tracking (e.g. from automatic extractions). The detailed learner features\
    \ and learning context we intend to explore are listed in the following sections.\n\
    \n## 4.2 Customization of OERs\n\nIn the [Section 4.2](#Chapter3.xhtml#sec4.2)\
    \ we will provide an overview of the learning content. Sequentially, the categorization\
    \ of `OERs` will be described.\n"
