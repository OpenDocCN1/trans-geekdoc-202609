    The [Chapter 7](#Chapter7.xhtml) contained the system implementation and empirical
    evaluation of algorithms. The topology setting of the system borrowed the idea
    of peer-to-cloud-peer where a layer of p2p network was organized among leaners.
    It has the advantage that resource transmission can be organized in an easier
    and faster way. The working principle of the Adaptive Engine was shown in the
    [Section 7.1.2](#Chapter7.xhtml#sec7.1.2). The workflow was realized by collaborations
    among a few services in the offline computation domain. In the [Section 7.2](#Chapter7.xhtml#sec7.2)
    experiments were conducted to identify the heuristic algorithms with better performance;
    and the selected algorithms, GA and EA, were compared with well-developed recommenders
    simulated from literature.


    # 8.2 Recommendation for Future Work


    ## Cross Learning Problem

    For in-progress micro-learning where students learn fragmented content from various
    sources, considerations regarding the alignment of ontologies, which come from
    hundreds of OER providers, should be taken seriously because there is not any
    common semantic standard among them. It is often observed that learners repeatedly
    switch among OERs offered by different institutions. These OERs may offer the
    same topics, but they are delivered in different ways with different pedagogies.
    Consequently, learners are free to choose the content and to combine this content
    in different ways to achieve the outcomes they desire. In addition, some OER learners
    do not have a concrete aim to acquire the specific knowledge; rather, they are
    completing an entire course merely to obtain the credits. They may need to engage
    themselves in some small course units offered by different OER providers. Therefore,
    a novel mechanism is crucial to support learning across institutions. Subsequently,
    the practice of the exchange and reuse of OERs among different providers has emerged,
    which brings up the problem of ontology interoperability. While many e-learning
    metadata standards and user-defined metadata exist, they still lack formal semantics.
    The semantic Web technologies provide ontology for organizations to annotate learning
    resources semantically into learning objects to facilitate knowledge sharing and
    re-use by others. Different ontologies can use different e-learning metadata to
    describe the same or similar sets of learning objects. The related learning objects
    dispersed over a heterogeneous learning resource system are still difficult to
    discover and re-use within other courseware.


    Given the adaptive micro open learning has been activated successfully by leveraging
    the solution for cold start as presented in the [Chapter 6](#Chapter6.xhtml),
    the second problem the learner might be facing in the learning path would be the
    cross-learning problem. The interoperability of cross-institute ontologies has
    to be improved.


    It is anticipated that all micro OER chunks will be annotated with ontologies
    into learning objects. These ontologies contain those newly established in the
    construction of semantic learner model and learning resource profiling; and the
    existing ones, which used different metadata standards, which are extracted from
    OER providers. All ontologies will be placed in a pool, and a semantic ontology
    mapping approach will be developed to deal with the semantic and structural heterogeneity.
    New techniques will also be proposed to detect both conflicts. A bridging ontology
    will also be proposed to act as a core to generate mapping rules, which reconciles
    terms defined in the OER ontology pool with terms defined in the target ontology,
    which have been agreed upon by various OERs.


    ## System Prototyping

    Our future research will concentrate on carrying out EDM and LA over identified
    data sources available from data warehouse of Australian universities. The machine
    learning-based approach will be selected and evaluated to train data in order
    to produce the semantically constructed learner model, which was introduced as
    in the [Chapter 4](#Chapter4.xhtml). This model will be stored in the offline
    domain and updated by the offline and online domains in conjunction.


    We will also put in efforts on the rule discovery and combine its results with
    the learner model. These findings will be provided into the Adaptive Engine as
    input to infer learners’ profiles in the offline computation. Feasible artificial
    intelligence-based solutions will be developed accordingly to achieve the ultimate
    goal, which is to match the learners’ needs with the most suitable learning resource.
    Furthermore, computational intelligence methods will be adopted to optimize the
    determination of learning paths for learners.


    The system will be programmatically prototyped and deployed over the Amazon Web
    Service as demonstrated in the [Chapter 7](#Chapter7.xhtml).


    ## Case Study Design

    At present, besides tests or exams, there is a lack of effective approaches to
    assess what and how much learners have actually achieved from open learning, so
    that a quantitative research is needed to investigate their satisfaction towards
    learning process and progress periodically.


    The key questions of the upcoming case study are to evaluate ‘whether learners
    can enjoy micro open learning through micro learning manner’ and ‘how micro learning
    can influence learners’ knowledge acquisition’. To answer these questions, we
    will test our system with a pilot study and formulate the following hypotheses
    as listed in the [Table 8.1](#Chapter8.xhtml#ch8-tab1).


    ### Table 8.1. Hypotheses about Micro Learning Experience and Knowledge Acquisition


    | Hypothesis | Description |

    | :--- | :--- |

    | H1 | Participating in open learning activities by accessing small unit of customized
    learning resource has positive impacts on learners to assimilate and internalize
    specific knowledge while avoiding obtaining interference information |

    | H2 | Micro OERs in the form of visual information are easier for learners to
    memorize or internalize in short durations. |

    | H3 | Adaptive learning resources with personal tailoring help learner to conduct
    effective time management so as to contribute to fulfilling the requirements of
    entire course learning. |

    | H4 | Learners who do not intend to get course credits have higher satisfaction
    on micro learning experience than hour-long learning. |

    | H5 | Micro learning contents with concrete time restrictions are better for
    learners to acquire targeted knowledge. Failing to complete a course unit at a
    time can result in information missing. |

    | H6 | Simple types of course assessment, such as quiz, multiple choice, etc.,
    are suggested to be finished in micro learning units, which can timely provide
    refresher and knowledge review for learners, and then help to fix it in memories
    deeply. |


    Data from behaviours over fragmented learning resources will be collected to test
    the above hypotheses. We will also carry out case studies focusing on finding
    out how our proposed system can facilitate micro learning in MOOC and how it can,
    qualitatively and quantitatively, help learners achieve their learning expectations.
    It is suggested to initiate interviews as well as surveys of engaged learners
    to collect data and analyse the main aspects of feedback. Also, evaluations will
    be carried out to test the usefulness and ease of use of the proposed system.

