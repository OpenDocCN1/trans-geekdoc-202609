    Moreover, there are studies indicating that personality and learning styles play
    significant roles in influencing academic achievement (Sun and Shen, 2014). As
    learners commonly do not have sufficient expertise in customizing learning schedules
    for themselves, and perhaps they are not familiar with their own learning styles,
    there are high probabilities that they cannot access the right sets of micro content.
    This may affect them to achieve satisfactory learning outcomes though a lot of
    time might be spent. In the current situation, learning resources are generally
    divided and wrapped up by education providers or course lecturers. It considerably
    lacks flexibilities to fit every specific learner’s time availability so that
    learner should get accommodated to the time length of course setting and manage
    to squeeze time to accomplish those learning activities.


    ## 3.3.2 Research Challenge for Online Computation Problem


    Latest recommender systems, which are commonly seen in the e-business, e-entertainment
    and e-tourism fields, tend to combine offline and online computation together
    to support the decision-making process of resource recommendation (Gomez-Uribe
    & Hunt, 2015). This innovation has been rarely found in e-learning and mobile
    learning (m-learning) platforms and systems, whereas successful cases in e/m-learning
    generally consume ‘big data’ when working in close association with the learner
    historical behaviours. Booming with the rising ‘big data’ trend and embracing
    the power of cloud, educational data mining (EDM) and learning analytics (LA)
    approaches become popularly adopted by well-developed e/m-learning systems in
    organizing their computing processes, which are commonly offline (Romero & Ventura,
    2010). EDM and LA play important roles in substantially increasing the thoroughness
    of how the computer science and education science can understand the learning
    participants, scenarios and cases, therefore improving their recommendation quality,
    in terms of accuracy and personalization. However, these systems normally take
    ‘day’ as the finest granularity in their sole offline computation. Their time
    effectiveness is deficient by failing to keep user information up-to-date, and
    also the learning re-source adaption process may suffer from the sparsity of data
    (Souza & Amaral, 2014).


    The adoption of online computation part in learning resource recommender systems
    remains low because unlike online shopping and entertainment, the experience and
    outcome of micro open learning highly depend on the educational settings, learners’
    personal learning styles, and, specifically, variable environment and fragmented
    time frame (Hug & Lindner, 2005). Activities in micro open learning have high
    randomness, without hard set-ting of beginning and ending. In addition, new OERs,
    in either micro or non-micro modes, are rapidly released and updated day by day.
    Fast response mechanisms are needed to insert incoming micro OERs into candidate
    lists for recommendation.


    In addition, in micro open learning, the accumulation and attenuation of user
    interests and demands can be periodical and may vary in different patterns.


    ## 3.3.3 Research Challenge for Cold Start Problem


    In computer science literature, widely used methods generally rely on three main
    categories, i.e., memory-based, model-based and content-based (Sieg et al., 2010;
    Liao & Chang, 2016). Although they have been found in many successful cases for
    example Amazon, it is usually difficult to provide reliable recommendations due
    to the insufficiency of initial data. Commonly cold start problem is triggered
    by three factors: new community, new item and new user.


    The cold start problem becomes more severe in open learning, especially micro
    learning through OERs (Bruck, 2012). Both open learning and OER are relatively
    new, which have been emerging in the very recent years. Meanwhile, the followers
    of this trend, no matter new pursuers or regular learners migrated from other
    online modes, join into this emerging community. On the other hand, the learning
    demands and expectations of learners engaged in open learning are much more practical
    than university students. In other words, they are mostly self-regulated so that
    it is totally flexible for them to decide when to join or quit the online course
    at their own willingness, and switch among courses frequently. Consequently, for
    OER providers, it is difficult to establish a model and update it accordingly
    for any individual because they do not have historical data in hand.


    Thus, if a learner is known scarcely by the OER system, the online computation
    should be able to treat it as a cold-start problem and tackle it by filling in
    the gaps with predicted data, in order to assist OER providers and instructors
    to guarantee the quality the first delivery, which can further help to accelerate
    the ongoing offline computation so as to promote the learner engagement in the
    upcoming open learning.

