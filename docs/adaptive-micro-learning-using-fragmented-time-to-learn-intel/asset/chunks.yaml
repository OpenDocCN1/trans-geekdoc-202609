  raw: '•For education providers, administers and teachers, the novel deployment and
    management for LMSs to support m-learning functions pose huge difficulty to them.
    Due to the variety of user requirements, contents in the m-learning systems are
    preferably to be user-defined, while how to choose and configure the extended
    components of LMSs is also not easy so that teachers and administers have to get
    trained otherwise they cannot adapt to the changeability of component configuration
    which is unique to each component. On the other hand, the traditional LMSs are
    defective in large-scale deployment. In research and implementation of m-learning,
    deployment from single site to provide overall services is generally centralized
    in the school level. However, this traditional deployment cannot meet the requirement
    of granularities of several levels distinguished by scales. According to the coarse
    granularity, equipment performance and security of m-learning would suffer from
    constraints and drawbacks root in providing services from the region level or
    even the country level. To the contrary, in terms of the fine granularities, school,
    class and individual teacher require independent utility of m-learning by the
    aspect of personalization. Furthermore, quick deployment of the LMS is also an
    issue (Orr, 2010). From the  commencement to the normal operation, it takes a
    long time to complete network configuration, system software configuration, and
    also configuration for m-learning context and content. Additionally, some LMSs
    are open-source software that lack guide documentations and subsequent technical
    support. For example, the famous Moodle[^a](#Chapter2.xhtml#fn1) and Bodington[^b](#Chapter2.xhtml#fn2).
    In this case, once any problem occurs on the open-source m-learning system, general
    teachers and administers can face difficulty in solving the problem without aid
    from professional technicians. Lastly, the cost is always the unavoidable issue,
    which involves the charges of hardware, software, collocation, network renting
    and electricity. Professional technicians are organized for maintenance and repairing
    of m-learning system, the expenditure for whom cannot be ignored as well. The
    repetition of m-learning deployment in each school is deemed as a large waste
    of resources (Cobcroft et al., 2006).


    •For learners, although latest processors that empower mobile devices have been
    updated to high-speed, the power consumption still fails to meet the requirements
    of current m-learning. It can be oppugned about the process efficiency and reaction
    rate when using mobile devices to run a complicated m-learning system. The highly
    centralized operation by mobile processors should also be enabled by a high-power
    battery, which is not fully settled in current products. The shortcoming on heat
    dissipation of mobile devices may also make leaners unsatisfied. Moreover, in
    the traditional mode of m-learning, teachers arrange the learning content and
    design the learning process according to the syllabuses, whose knowledge hierarchies
    and the syllabuses limit the depth and breadth in some degrees. An obvious result
    is that how much the learners can gain is closely related to how much the teachers
    have imparted. Additionally, the formation of learner clusters is basically in
    charge of the education provider and teacher, who are in control of the structure
    of learners, the organization of learning content, the rollout of strategy and
    path of  learning in certain extents. This causes that the interaction and knowledge
    sharing are somewhat in a very local range and limited.


    Nevertheless, all of the above issues are feasible to be tackled in the coming
    of a new trend, namely embracing mobile learning with mobile cloud computing.
    Consequently, with the solutions that either migrating current LMSs to cloud or
    directly developing them on the cloud, learners can effortlessly learn through
    mobile devices (Sultan, 2010). This is a novel way of m-learning, namely mobile
    cloud-based learning.


    By leveraging the mobile cloud-based learning, the primary advantage is the lower
    cost. The requirement for hardware and software is significantly reduced. In particular,
    since all of the data storage and processing are in the cloud side, the limited
    processor capacity and memory size of mobile devices are no longer bottlenecks
    for a pleasant m-learning experience. Hence, the learners can only use mobile
    devices, which only have to run a browser and connect to the wireless network,
    for input and output of data.


    Similarly, education providers and administers no longer need to own and set-up
    high-performance services by themselves, without caring about the background of
    LMSs running. The expenditure of purchasing and upgrading hardware can be lowered.
    Not only is the fast deployment of LMS well enabled by mobile cloud computing,
    but also the cloud service providers have already made some popular LMSs ready
    to be ordered. These LMSs are well migrated and fully hosted over cloud infrastructure
    and in large-scale and fine-grained. Therefore, the education providers, no matter
    in different levels or with different requirements, are able to customize the
    whole or solely part of cloud-hosting LMSs’ functions on demand, where exhaustive
    remaking and resetting are not needed anymore. It is notable that the authorities
    to access the cloud-hosting LMSs are by renting charged by the usages, which are
    much cheaper than purchasing their licenses. The reusing of legacy LMSs is feasible
    due to the data migration technology, which avoids the waste of repetitive deployments
    for the same kind of LMS in different areas (Gao and Zhai, 2010).


    Teachers and administers need neither to be trained like technicians in order
    to maintain the daily running of LMS, nor to keep abreast of the  emerging m-learning
    technologies. Benefiting from the mobile cloud-based learning, they can pay their
    full attention to the organization and delivery of the educational content to
    make learners more interested and knowledge assimilated better (Rao, 2010). This
    is because the professional teams from the cloud service provider take responsibility
    for all the technical problems.


    Given the cloud can be seen as a huge information pool, the learning resources
    from all over the world are integrated and shared to maximize the value of knowledge.
    Through easily querying, such as the key term searching, learners are able to
    discover and obtain the learning resources then freely choose which are needful
    to learn. Based on learners’ feedbacks and requirements, the update, modification
    and supplement of learning resources proceed, so as the sole duty of the teachers
    and administers is to categorise and manage the learning resources and set corresponding
    access rules.


    The mobile cloud-based learning catalyses the emergence of diversified virtual
    learning communities and virtual teams, which are dismissed the restraint of location,
    national and culture background of learners and expanded the influence scopes
    (Liao and Wang, 2011). Therein, learners are free to participate in those kinds
    of personnel structure of learner cohorts to exchange and discuss their ideas,
    share their experiences and learn from others’ strengths to find and improve their
    weaknesses. Hence, more collaborative learning has a favourable environment to
    be happened among learners who have similar learning purposes, so as teamwork
    is a more and more frequent learning activity and important learning approach
    in the mobile cloud-based learning (Chua and Tay, 2012).


