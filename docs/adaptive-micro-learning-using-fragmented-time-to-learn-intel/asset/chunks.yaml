    To a considerable extent, the establishment of the data level can involve integrating
    heterogeneous OCW repositories, refining and blending available OERs into the
    micro learning context and publishing their metadata as linked data. Because in
    recent years some educators and researchers have made great efforts to publish
    and popularize the OER in terms of the linked data concept, a workflow developed
    with this extended aim is generally divided into six phases:


    1. Identify and select heterogeneous data sources to determine the scope of the
    content.

    2. Model vocabularies for OER domains.

    3. Data extraction.

    4. Generate standardized data descriptions (e.g., `RDF` data).

    5. Publish linked data.

    6. Consume and display linked data.


    # Summary


    In this chapter we have presented the construction of a semantic knowledge base
    that underpins the decision-making process of the micro OER recommendation system
    which is realized by the `Adaptive Engine`. The knowledge base was built using
    a top-down approach based on conceptual graphs, by having two augmented ontologies
    at the pattern level first. Using this, a strategy on processing data was then
    developed at the lower level. This `EDM` and `LA` strategy is to understand micro
    learning patterns and rules, from the both on-campus data and open learning data
    perspective, and to support the decision-making process of the micro OER recommendation
    system.


