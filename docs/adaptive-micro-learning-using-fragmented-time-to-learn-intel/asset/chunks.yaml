    图 4.1. 微开放学习综合学习者模型


    ## 4.1.1. 个人非智因素


    ### A. 学习者类型

    开放学习者的类型根据其特定的学习目的、工作和生活模式而有明显差异。他们的背景信息并非总是如此，但可以从注册和登录数据中搜索（DeBoer et al., 2013;
    Kay et al., 2013）。一些常见类型包括：


    • 大学里的全职学生，他们更倾向于远程和电子化学习，而不是面对面听课。他们愿意享受智能设备和门户设备带来的便利。


    • 发展中国家的全职大学生，那里的教育发展水平较低。由于所在大学的学习资源匮乏，开放学习为他们提供了更多机会参与顶尖大学提供的课程，从而能够促进他们的日常学习，并领略先进的知识管理和教学方法。


    • 工作在发展中国家大学的教育工作者。他们通过开放教育资源（OERs）从顶尖大学获取经验，并学习如何高效地教学，以改进自己的教学方法和流程。


    • 关注 OER 交付流程（例如 MOOC 课程）的科研人员，旨在探索其中的潜在缺陷，这些缺陷会阻碍学习者获取传递知识。他们的目标是精炼当前的 OER 教学流程，并寻找虚拟化的增强教学方法。在参与开放学习的过程中，他们经常会暂停，并根据研究需求反复检索课程的某些特定章节。


    • 受公司或机构要求参加 OER 培训的员工。通常，他们有一个集中的时间段来完成 OER 学习。他们的整体学习计划由培训师驱动，他们有自由连续地完成分配的任务，并为每个特定的课程单元安排自己的时间。


    • 希望在下班时间通过学习 OER 来丰富知识或提高技能的员工。他们的终极目标是在职场中更具竞争力，且通常具有自我驱动性。因此，他们会根据较高的自由和自主性，为每个学习阶段设定目标和里程碑。


    • 终身学习追求者。他们可能是员工，其开放学习内容（如 MOOC 课程）可能与日常工作并不密切相关；也可能是非工作人员，如家庭主妇、老人或退休人员（Blaschke,
    2012）。通常这类开放学习学习者是兴趣驱动的（Cochrane et al., 2012）。


    ### B. 时间可用性

    学习者的可支配时间差异很大，这对于这些学习者是否以及以及多久采用微学习模式具有高度指示性。因此，最好将他们当前的时间可用性设置为他们开始前必须输入的强制性要求。


    ### C. 学习参与度

    Anderson 等人认为，学习者的参与度很大程度上取决于课程中的互动和发布。高参与度的学习者在论坛中表现得更活跃，并积极提出问题和寻求建议；而低参与度的学习者在平台上互动较少，对开放学习的兴趣较低（Alario-Hoyos
    et al., 2014）。学习者的参与度也可以被分为主动学习和被动学习。前者是指学习者主动参加 MOOC 课程以获取资源；后者是指学习者作为平台或社交媒体推送信息的接收者。


    ### D. 进度识别

    这基本上通过学习者的切断点和里程碑来识别。在微学习中，学习活动是分散的，课程内容的阶段并不局限于特定的时间点，还考虑了他们学习的近时性（Bruck et al.,
    2012）。


    ### E. 学习动机与目的

    基本上开放学习学习者要么是兴趣驱动，要么是任务驱动。他们的目的通过强制性数据来识别，这意味着学习者在开始学习之前输入学习目的。


    ### F. 学习偏好

    学习偏好是指学习者对学习内容的客观观感受。可以通过学习者对资源的评论和标签进行分类。


    ## 4.1.2. 个人智因素


    ### A. 学习者预知识评估

    为了给学习者建立画像并为不同背景的学习者定制微学习策略，预采取的一种必要措施是根据若干标准评估每个学习者的背景知识。在微开放学习中，建议根据教育程度、MOOC
    历史成绩以及课程测验结果来调查并识别他们的预知识水平。


    许多电子学习采用的典型措施是预知识评估（Xu et al., 2014），即在学习者开始课程之前考试。虽然这在校园课程中很常见，但并不适合迁移到微开放学习，因为学习者是分散且流动的。


