    通过开放教育资源（OER）进行在线学习是教育领域最新的技术之一。OER 作为一种新兴的技术支持型产品，正在演变为一种新的教学法，使教师和学生都能获益。它向任何年龄段的学生免费提供，并基于开放网络学习模式运行。它让参与者能够连接到传统学习环境之外，从而提供了自主性和开放性。随着鼓励学生进行连接性学习的趋势日益增长，教师需要参与在线课程。连接性学习表明，学习可以发生在教室之外，通过在线网络和互动进行（Kharbach,
    2012）。学习可以通过参加网络研讨会、参加工作坊、听播客等以非正式的方式进行。这非常清楚地表明，21 世纪的教育工作者必须保持良好的连接，以便为学生的职业发展做好准备。研究建议，教育者参与开放式学习将帮助他们鼓励学生有效地利用数字素养进行学习。


    OER 的兴起为正被接受为学习分析主流实践的领域带来了重大挑战。由于 OER 是一种广泛但非常新的现象，目前还没有关于 OER 学习分析的大量文献支持。对
    OER 中数据的分析仍然有限（Daradoumins et al., 2013）。这项试点研究旨在识别可能影响澳大利亚教育者的 OER 特征，并更好地理解高等教育机构作为
    OER 提供者，如何启发学习者以提高他们的表现。我们进行了一项调查，从澳大利亚领先教育机构的教育者和从业人员那里收集了关于 OER 开发和利用的观点。我们主要关注
    OER 对澳大利亚教育者的益处，以及我们如何鼓励澳大利亚教育者使用 OER。通过使用典型的统计方法分析他们的反馈，主要发现可以总结如下：


    *   教育者的意图是继续使用 OER。

    *   OER 在促进在线学习呈现方面具有高重要性。

    *   OER 在为学习者提供指导方面重要性较低。

    *   OER 在促进学院间教学方面重要性较低。

    *   OER 在材料重用方面具有高重要性。

    *   OER 在结果自动整合方面重要性较低。

    *   OER 在提供免费学习选项方面重要性较低。

    *   在 OER 内部，教育者没有为学生提供足够的支持，这一点非常重要。

    *   对于教育者来说，OER 没有让他们与学生进行面对面的互动，这一点非常重要。

    *   对于教育者来说，在 OER 内部他们无法使用完美的课程设计，这一点并不重要。

    *   OER 在精通学习方面具有高重要性。

    *   OER 在混合式学习方面具有高重要性。


    试点研究的细节可以参考（Sun et al. 2015）。在这些发现中，OER 的一个显著未来特征是精通学习。在精通学习中，学生在进入下一节课之前通过反复评估和接触材料来展示对某个概念的理解（Chen
    et al., 2013）。在许多传统课堂中，如果一个学生尝试完成作业但表现不好，他或她仅仅会在作业中得到低分，教学就会转移到下一个主题，为学生学习下一个概念提供了糟糕的基础。反馈通常在概念教授后的几周后才给出，到那时学生几乎不记得这些材料，而且很少回去回顾概念以获得更好的的理解。然而，在
    OER 中，技术使得能够对学生不理解的概念提供即时反馈。在许多情况下，澳大利亚教育者可以提供同一作业的随机版本，以便学生可以重新学习并再次尝试作业。根据 Chen
    等人（2013）的观点，教师的工具旨在方便具有广泛随机性的题库的使用。这种策略与利用技术支持有效教学方法的总体目标是一的。


    教育者的另一个重要因素是混合式学习的能力。混合式学习（面对面和在线学习体验的战略性结合）在高等教育中越来越流行，是一种具有巨大潜力提高学生成果并创造令人兴奋的新角色的新型教育模式。

    '
- fmt: '

    Some researchers doubt that open online courses and OER delivery may not reach
    its promises because many aspects of traditional classes, such as small-group
    discussions and face-to-face interactions with instructors, do not work in the
    open online format (Franzoni & Assar, 2009). OER makes information available to
    people at any time, at any place, and in any form, but the key challenge is to
    not only transmit the right contents at the right time but also actually do it
    in the right way. OER providers have recognized that current open learning platforms
    can neither guarantee learners to enjoy their learning experience, nor receive
    timely feedback of their learning results in an open and connected environment.
    Several key areas have been recognized as critical for future blended learning
    applications: new mobile apps, deeper international expansion through translation
    and geographical partnership distribution, online courses platform to enable third-party
    apps and integrations, and new features to encourage more collaboration among
    students (Pinola, 2011). OER providers try to ensure that the contents are being
    presented in a univocal manner, whereas the environment is configurable by the
    instructors; the courses are easily managed; and the exams are standardized. However,
    the reality remains unsatisfied since online courses lack proper control, verification,
    or monitoring of these targets (Kukulska-Hulme, 2013).


    There are some barriers for course instructors to migrate their previous teaching
    strategies to this new blended learning environment straightway. Although utilizing
    mobile cloud-based learning and forthcoming mobile apps bring multiple advantages,
    learning resources for non-mobile devices cannot be directly adapted to mobile
    devices because of their indeterminacies of context (e.g. unpredictable network
    bandwidth), and specificities (e.g. different operation systems).


    In some MOOC courses, instructors borrow the principles of micro learning to redesign
    their courseware and associated settings. Their actions include chunking the course
    materials and repackaging them in order to make learners easily go through the
    whole bytes of learning chunks within a short duration which ideally does not
    exceed the limit of 15 minutes (Kovachev et al., 2011). They prefer to use quizzes
    or games to link two chunks (Guo et al., 2014). However, these efforts are still
    in the trial format and have not been applied to larger scale OER production and
    delivery.


    The MOOC is sorely a subset of OERs, which means that the size of OER is even
    much larger than ‘massive’. Meanwhile, OER is flourishing with the era of big
    data. With the users of MOOC reaching millions, relevant data associated with
    OERs are fast generated and users are continuously in geometric growth, in regards
    to the learners, courses, educational institutions, networking, and technical
    details and so on. When facing massive options as a result of the exponential
    increase in learning materials available in OERs, learners may be too puzzled
    to choose the right courses to learn early or late, especially when they only
    prepare to make short-term effort at once and have to make a decision immediately.
    Similarly, how to set and select the appropriate objectives and directions, which
    stand out from the numerous available resources, brings a challenge for both OER
    providers and instructors. Micro learning can be used as part of ‘push’ applications,
    in which an instructor determines what learning units to deliver when and where,
    or as ‘pull’ applications, in which a learner decides when and how to access the
    learning resources (Guo et al., 2015). However, open learning is mostly in the
    distance and online manner while learners are in high geographic diversities.
    Hence, it is difficult for open learning instructors to provide feedback in a
    timely manner. Instructors’ guidelines cannot fit all learners enrolled in the
    same course as well.


    The problem is even more pronounced in m-learning, as devices themselves may cause
    distractions such as phone calls, email alerts and social network apps (e.g. Facebook,
    Twitter and WhatsApp etc.). The average mobile user also has a short attention
    span (Kunznekoff & Titsworth 2012; Chen & Lin, 2016)— most people skim headlines
    and prefer bite-size content than long articles when surfing over mobile network.


    Micro learning with mobile devices requires learners’ concentration and reflection.
    However, Disruptions can come from external environment when learning in movement
    where unpredictable conditions are more likely to occur. This leaves the mobile
    learners with a highly fragmented learning experience. To stand this distracted
    learning experience, learners need to pay more attentions and reflections. Therefore,
    learning contents should be able to engage with learners instantly, i.e., to give
    them contents that they are interested in the first place (Sarrab, 2015). Researchers
    believe that the small screen size of mobile devices restrict information transmission,
    and the different type of learning content adversely affect the knowledge assimilation
    performance as well (Chen & Lin, 2016). Hence, avoiding cognitive load is necessary
    by eliminating any unrelated or decorative materials, which only serve to drive
    learners’ attention away from actual information. Moreover, the most important
    information needs to be mentioned first or in an obvious place in micro OERs.
    This can help users absorb the key information even though they are unable to
    finish a module at a time.


    In micro open learning, each learning activity is anticipated to be short but
    complete, and each OER chunk needs to be available as a stand-alone module (Gassler
    et al. 2014). In other words, each micro OER must be self-containing and can be
    used independently. Moreover, proposed micro OERs are able to be aggregated, they
    can be grouped or re-joined into larger collections of content, or clusters with
    similar topics (Cakula & Sedleniece, 2013).


    Researchers and practitioners are interested in developing artificial intelligence
    based systems to support adaptive learning (Adamopoulos, 2013). Online learning
    systems incorporating user data analysis in response to individual student’s performance
    would create adaptive learning environments (Daradoumin et al., 2013). There are
    a few studies, including our pilot work (Al-Hmouz et al., 2010), exploring the
    use of smart systems that implement learning resources adaptation. These efforts
    focus on university level e/m-learning, without looking into the larger open learning
    scene (Wang, 2008). It is also found that some measures can be effective to realize
    adaptive learning for an entire course, but are not workable for the fragmented
    learning activities because of different time schedules of individual learners
    during the whole course.


    Both the providers/instructors and the adaptive open learning systems must play
    an important role in reaching the goal of maximizing the advantages of OERs. For
    OER providers/instructors, especially MOOC teachers and course designers, they
    need to redesign their syllabi, break their entire courses into smaller units
    and pre-pack them with associated settings. For adaptive open learning systems,
    the major problem is how to make OERs micro and guide learners to make accurate
    footsteps sustainably so as to form a footprint that comes with fruitful outcomes.
    This also being the main gap that we attempt to bridge in our work.

    '
