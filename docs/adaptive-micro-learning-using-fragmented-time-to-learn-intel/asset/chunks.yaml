    Moreover, studies on learning resources adaption have not been extended to micro
    learning scenarios, and they have not taken into account the length or scale of
    learning resources or learners’ spans of time availability. Fragmented learning
    with mobile devices requires learners’ concentration and reflection. However,
    being on the move is fraught with unpredictable situations and distractions. This
    leaves mobile learners with a highly distracted, highly fragmented learning experience.
    In addition, studies indicate that personality and learning styles play significant
    roles in influencing academic achievement (Daradoumins et al., 2013). Learners
    may be at their wits end to choose which courses to study initially, or subsequently
    when there are many options to consider. There are high probabilities that they
    cannot access the most appropriate sets of micro OER, which can affect their achievement
    of satisfactory outcomes even when they have expended substantial time. In the
    current open learning environment, learning resources are often divided and packaged
    by education providers or courses lecturers. This approach lacks the flexibility
    needed to fit a specific learner’s learning style, progress, and availability.
    Quite often, learners need to squeeze their time to accomplish those learning
    activities because they are taking the content passively. Our colleagues’ pilot
    work developed an adaptive mobile learning system prototype, but it still lacks
    a mechanism to adjust those courses already in-progress (Al-Hmouz et al., 2010),
    where students need to prepare themselves with a schedule and plan their time
    carefully over a comparatively long period, without personal guidance. Therefore,
    bringing micro learning into open learning environment exposes a significant research
    gap to fill.


    The terms micro learning through OER and micro open learning will be used interchangeably
    in the rest of this book.


    ## 1.2 Research Objectives


    Effective micro content delivery is one of the major barriers to be overcome by
    course instructors or deliverers in adapting their previous teaching strategies
    to micro learning environments (Sun & Shen, 2014). Therefore, this book aims to
    investigate how smarter micro learning systems can help learners to take advantage
    of fragmented time they spend on mobile devices in accessing OER.


    In regards to covering the current research gap in tailoring personalized micro
    OER and enabling easier access and better experience for both service providers
    and learners, this book aims to address a variety of issues in the adaptive micro
    open learning, considered through the micro open learning framework design, personalized
    learner model construction oriented to micro open learning, educational data mining
    and learning analytics (`EDM` and `LA`) strategic design, semantic learner and
    micro OER profiling, agile solution for cold start problem. This book introduces
    a novel approach towards providing adaptive OERs, which are fragmented pieces
    tailored to fulfil the requirement of carrying out micro learning.


    ## 1.3 Contribution of the Book


    As a result of the proposed objectives, the contributions of this book can be
    highlighted as bellows:


    - A system framework is developed in terms of the service-oriented architecture
    (`SOA`). The system, `Micro Learning as a Service (MLaaS)` adopts both offline
    and online computation domain to work in conjunction so as to improve the performance
    on learning resource adaption.

    - We propose a comprehensive learner model that allows the system to consider
    individual learning styles, learner’s contexts, application capabilities, and
    teaching materials structure, leading to a customization of the type and delivery
    format of learning information in response to the user.

    - A knowledge base that fills the gap of formal OER structuring, description,
    and inference is constructed. A detailed `EDM` and `LA` strategy is scheduled
    with regards to on-campus learning data sources and open learning data (`big data`)
    sources.

    - A solution is provided for organizing online computation in `MLaaS` and a heuristic
    approach for addressing cold start problem in the recommendation of micro OERs.
    This solution is empirically evaluated to prove its feasibility.


    ## 1.4 Outline of the Book


    This book consists of three sections, in a sequential order:


    - The theoretical aspects of the research, which will be presented in the [Chapter
    2](#Chapter2.xhtml), [3](#Chapter3.xhtml), [4](#Chapter4.xhtml), and [5](#Chapter5.xhtml).

    - The practical aspects of the research, which will be presented in the [Chapter
    6](#Chapter6.xhtml) and [7](#Chapter7.xhtml).

    - The conclusion part of the research and suggestions for further research, which
    will be presented in the Chapter 9.


    The rest of this book is organized as follows:


    The [Chapter 2](#Chapter2.xhtml) will introduce the basic principle of this research,
    including terminology and a literature review. It will start from a comprehensive
    examination over the literature on distance learning and its development, namely
    the move from e-learning to mobile learning. Next, the impact brought by the open
    learning and OERs. The feasibility of embracing the micro learning with the open
    learning will be discussed. This chapter emphasises the advantage of micro open
    learning and highlight the inspiration to improve its current way of delivery.
    Techniques that will be applied in the research include learner modelling, `EDM`
    and `LA`, and big data.


    The overall design of the research will be roll out in the [Chapter 3](#Chapter3.xhtml).
    The research background will be stated along with our pilot study. Motivated by
    this, the research purpose will be demonstrated with example scenarios, where
    ideally the adaptive micro learning activities can be organized. In the last section
    of the [Chapter 3](#Chapter3.xhtml), a framework of `MLaaS` will be presented
    to depict the process of adapting micro OERs to satisfy individual learner’s needs
    and context. `MLaaS`’s functions will be jointly empowered by the online and offline
    computation domains.


    Typically, there are a number of factors that impact the learning experience and
    outcomes. In [Chapter 4](#Chapter4.xhtml) we will conceptually build a comprehensive
    learner model oriented to the micro open learning. Features that can play roles
    in the entire process of micro open learning will be selected, from both internal
    and external sides. The internal factors can intellectually or non-intellectually
    reflect learners’ learning behaviours. In addition, from the item perspective,
    we will give an overview of the micro learning content (i.e. micro OERs). The
    mechanism to categorize and customize micro OERs will be illustrated, followed
    by the measurement standard.


    Based on [Chapters 3](#Chapter3.xhtml) and [4](#Chapter4.xhtml), the semantic
    knowledge base construction will be conducted in the [Chapter 5](#Chapter5.xhtml),
    using a top-down approach. Its pattern level at the top will have the augmented
    ontologies for micro OERs and learners, respectively, which will be represented
    by conceptual graphs. Data sources at the bottom level will be processed in terms
    of a `EDM` and `LA` based strategy, which is to understand micro learning patterns
    and rules, from the both on-campus data and open learning data perspective, and
    to support the decision-making process of the micro OER recommendation system.

