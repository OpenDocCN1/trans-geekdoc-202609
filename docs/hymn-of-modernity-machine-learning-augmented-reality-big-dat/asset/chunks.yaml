- raw: 'After many decades of CPU improvement, mainly consisting in ever smaller transistors,
    we are now arriving at physical limits of transistor size, hence the future of
    CPUs is being questioned. Intel is however looking into different ways to circumvent
    the limits. 3D shaped chips as well as quantum chips are amongst the most promising
    areas of research.


    GPU and NVIDIA


    A Graphical Processing Unit (GPU) is similar to a CPU but is designed to handle
    tasks which require much higher degree of parallelisation. Such tasks include
    graphics rendering and high-quality image display, heavy on matrix multiplications.
    As you may have noticed, AI training also relies on large matrix multiplications,
    making GPU a far better tool for the training process rather than traditional
    CPUs.


    NVIDIA is the world’s leading GPU designer and supplier. Since the rise of deep
    learning, NVIDIA stocks have skyrocketed, especially since the initial rumours
    of their involvement in embedded hardware for self-driving cars.


    CPU and GPU work in tandem just like our brain has left and right hemispheres.
    One is more sequential and analytical while the other is more parallel and    
    holistic.


    SOFTWARE


    Software is a collection of programmed algorithms that have been packaged together
    in a stable and easy to use information technology (IT) product. Good software
    is made of individual modules which have each been tested for stability, security,
    and ease of use.


    Software is the direct opposite of hardware – hardware refers to the tangible
    components of a computer. Software is created using programming languages.


    The most well-known software company in the world is Microsoft, notably renowned
    for their bestselling Windows operating system and Microsoft Office software suite,
    including Word, Excel, PowerPoint, Outlook, and more.


    “That''s the thing about people who think they hate computers. What they really
    hate is lousy programmers.”


    –Larry Niven, author of Ringworld


    JAVA


    Java is one of the most popular general-purpose programming languages on the planet.
    The basic version of Java is completely free for use. 


    Released by Sun Microsystems in 1995, Java went on to be acquired by Oracle in
    2009 for a massive $7.4 billion, so that Oracle can offer an enterprise version
    of Java, sold for a fee. Java’s motto has remained the same since its inception:
    “Write once, run anywhere,” and thanks to its abstraction layer from underlying
    hardware, Java allows programmers to write a single piece of code that can be
    understood by any computer that has the Java Virtual Machine (JVM) installed.
    Many computer and mobile devices nowadays are sold with a JVM pre-installed. Android
    is fully built on Java. Anyone can write Java code and run it on his phone. For
    example, you can build a game or an application using Java. IPhone on the other
    hand supports Swift language and not Java, but Swift is very similar to Java,
    just like Spanish is similar to Italian, so the concept remains the same. Outside
    the Apple world, almost no devices can understand Swift coding language, but they
    often do understand Java.


    Despite its many functions, Java is rarely used to create Machine Learning applications,
    nor is it used in Data Science. Due to historical events, Python’s community was
    more active in the Machine Learning field and has developed more tools that simplify
    AI engineering tasks. Nevertheless Java is good at handling data pipelining and
    data infrastructure design. Hence Java is more frequently used by Application
    Developers and Data Engineers while Python is preferred by Data Scientists and
    AI Engineers.


    DATABASE and SQL


    A database is software which stores data in a tabular format. Databases are designed
    to be basic in their user interface but strong in their ability to operate at
    high speeds, contrary to personal table management applications such as Excel,
    whose priority is an easy-to-use interface. The original database was invented
    by IBM in their quest to fully digitize the punch card system.


    Databases are crucial to the modern world, and if data is considered the blood
    of our economy, then the database is the crucial skeleton that holds all the data
    together. Every government and major business today heavily relies on databases
    to organize their most important data.


    Common database applications include: airline reservation systems, product inventory
    management, banking transactions, online purchases, and client information data.
    Most databases are kept on a single central server. Whoever needs to access the
    data has to submit a request to the system administrator for a username and password.
    With this information, the user can successfully retrieve the piece of the data
    required through the network without needing to download the entire database.


    On a historical note, although IBM invented the database, it wasn’t long before
    Larry Ellison, a computer scientist at the time, began working on a database project
    for the Central Intelligence Agency. After leaving the CIA, Ellison used his database
    expertise to establish Oracle, the leading database in the world for decades to
    come. By 2010, the Oracle database made Larry Ellison the sixth richest person
    on Earth and the third richest American, just behind tech-giant Bill Gates and
    famed investor Warren Buffet.


    SQL stands for Structured Query Language, a simple and easy to use computer language
    invented by IBM so corporate administration employees could query databases without
    requiring the assistance of expert-level computer scientists. Today SQL is ubiquitous
    in the enterprise world and is the de facto language used to select data in a
    database.


    BLOCKCHAIN and BITCOIN


    Blockchain is a distributed database, which means every user has a complete copy
    of the database stored on their machine. It differs from the classical database
    which is managed by one central administrator and made accessible through the
    network to everyone with the valid credentials.


    The point behind blockchain is that if everyone holds a copy of the entire database,
    then it would be vastly more difficult for any alteration of its content to go
    unnoticed. To successfully do this, one would need to hack every machine in existence
    and alter the data, or do this for at least over 50% of the machines. This makes
    information counterfeiting much harder than it is on classical databases.


    But the problem remains that blockchain is heavy on storage, due to everyone literally
    holding a duplicate. Critics have called this approach unscalable, not to mention
    that it is not the greenest, impact-wise. In the future, blockchain technology
    will be increasingly used to provide authenticity to physical or digital objects
    in order to prevent fraud and counterfeiting.


    A well-known example of blockchain application is a crypto currency such as Bitcoin,
    which is used to conduct anonymous transfers of liquidity. Bitcoin was created
    in an attempt to fight back against the banking fractional reserve system, which
    had been accused of fabricating money and causing inflation. However, Bitcoin
    adoption is slow and still in a speculative phase due to the high volatility of
    its price.


    “Bitcoin is better than currency”


    –Bill Gates, Founder of Microsoft


    FILE SYSTEM


    A file system is the most common way to store digital documents. File types and
    data structures can vary freely and don’t need to be all the same, contrary to
    the data stored in a database system. A file format in a file system can be of
    any format at all, Word, Excel, PDF, TEXT, JPEG, PNG, PYTHON, JAVA, etc.


    No doubt you are familiar with the file system, as you use it every day whether
    you realize it or not. Whether you hop on your computer to search for old documents,
    family photos, or your favourite songs.'
