    \ to higher losses. For example, in 2018 the city of Atlanta refused to pay a\
    \ ransom of $51,000, which ended up costing them more than $9 Million in damages.\n\
    \nLooking for another juicy story on ransomware? Then look no longer than the\
    \ case of Eurofins. Eurofins is a large European provider of pharma, food and\
    \ environmental lab testing services, employing 45,000 people in over 800 laboratories.\
    \ Here is where it gets tricky: Eurofins also offers cybersecurity assistance\
