- raw: 'These pieces of information, of course, are among the most frequently used
    security questions used to recover forgotten passwords by many banks and other
    institutions. 


    DUMPSTER DIVING


    Dumpster diving, or in other words searching for information in the trash bins,
    is commonly used by hackers and spy agencies to dig for information. It is of
    course much more applicable for corporate trash picking.


    “Oracle for example has even hired people to dumpster dive for information about
    its competitor,               Microsoft. It’s not even illegal because trash isn’t
    covered by data secrecy laws.”


    \-Kevin Mitnick, most wanted hacker of the late 90s


    NETWORK TRAFFIC ANALYSIS


    Traffic Analysis is the study of communication patterns. Without having access
    to the content of the messages, traffic analysis can still indicate plenty of
    relevant information.


    Who is talking to whom? How long do the conversations last? What time do the conversations
    take place? Those and all similar questions help to understand the dynamic of
    the exchange.


    Of course the plain “who talks to who” is already a lot of precious information,
    but there is more traffic patterns that are well known to the military. For example,
    regular communication from Alice to Bob and Sam, and then from Bob and Sam to
    dozens of other individuals, most certainly means Alice is communicating a chain
    of orders.


    Rapid and short communication between Alice and Bob – can denote negotiation.


    NETWORK


    A group of computers or mobile devices linked together, most commonly through
    a wire or a WiFi connection. Most local networks are connected to the internet,
    making them vulnerable to attacks from hackers. If one of the devices connected
    to the network is compromised, then it’s safe to say that all the devices connected
    to the network are compromised.  


    Networks are the most frequent channels for cyberattacks, as a hacker doesn’t
    need to risk physically approaching his target but can simply commit his theft
    through the internet from the safety of his couch somewhere on the other side
    of the world. A computer hacker may not be able to walk up to a large professional
    athlete and rob them on the spot, but with just a little bit of personal information
    they are able to inflict even greater damage. 


    We typically distinguish three distinctions of network groups: 


    1.  > Personal home networks, which usually includes all of a family’s computers,
    mobile devices, and private personal information. This is usually thought to be
    the safest place to store information. 


    2.  > Public networks, which are usually accessed free of charge in cafes, airports
    and hotels, which often makes them a totally vulnerable place.


    3.  > Corporate network, which of course you access at the office. Company networks
    are the honeypot for cyberattacks as these networks store sensitive customer data,
    industry secrets and financial portfolios. Such a hack could bring even the strongest
    of companies to the ground, which is why virtually every single business conglomerate
    invests millions of dollars in cyber protection and security auditing every year.


    The internet is one big network made of many small public, private and work networks.
    Contrary to what you might think, the internet is not a benign environment but
    an adversarial one. When you go out of your private network onto the internet’s
    public network such as Cartier.com or SomeLuxuryRestaurantReservation.com, to
    browse for some content or make an online purchase, a bunch of hackers are always
    watching the newcomers and are ready to follow them back to their private network
    in an attempt to spy on them or steal their data.


    P2P NETWORK


    A series of interconnected computer nodes forming a private network to send each
    other usually illegal resources over the internet. P2P architecture was originally
    popularized by Napster, which allowed for pirated music sharing. Today P2P networks
    such as Torrent allow for distribution of illegal copies of movies, music, books,
    software and other forms of media, causing devastating revenue losses to the media
    industry. P2P is the concept of a Sunday street market, where transactions are
    directly undertaken between the seller and the buyer, in contrast to Walmart,
    for example, who takes the position of a middle man between the two parties.


    The idea behind P2P served as the cornerstone for democratization and decentralization
    of digital services. Instead of bbc.co.uk we got Facebook and            Instagram,
    where everyone can publish and share content. Instead of city taxi we got Uber.
    Instead of Hilton hotels we got AirBnb. Instead of national TV we got YouTube.


    While the idea of pure decentralized P2P network moved in most cases to the Dark
    Web, its direct cousin in the form of centralized social sharing platforms became
    a tremendous worldwide success, effectively creating modern internet giants.


    With time however every service finds its own niche, few AirBnb hosts can rival
    Hilton’s quality and few YouTubers qualify for an Oscar. Both types of offers
    now coexist in a healthy competitive ecosystem.


    DARK WEB


    Dark web, the Black Market of the internet, is not visible to search engines like
    Google and requires special software, configurations, and authorization to access.
    It is hidden from the public to avoid undesired attention, due to the fact that
    it conveys mostly illegal services.


    “Being able to see an activity log of where a kid has been going on the Internet
    is a good thing.”


    –Bill Gates


    Services conducted over Dark Web include human and organ trafficking, prostitution,
    exotic animal trade, weapon trafficking, and of course, drug trafficking. The
    dark web also proposes a series of even more immoral services such as online showrooms
    where authorized visitors can assist via web camera acts of torture, violence,
    pornography and what not, for a fee. One usually settles transactions on the dark
    web with anonymous Bitcoins, which boosted Bitcoin popularity and led to the Bitcoin
    bubble of 2018.


    TOR


    Tor is a software which allows users hide their true IP and browse internet anonymously,
    thus making it very hard to be spied on. Tor is very popular amongst hackers and
    criminals as it gives them the desired freedom to conduct criminal activities
    over the internet as well as accessing the Dark Web. 


    HACKER


    “There are few sources of energy so powerful as a procrastinating college student.”


    ― Paul Graham, Hackers & Painters: Big Ideas from the Computer Age


    A hacker is a skilled computer programmer capable of mounting successful cyber-attacks,
    often by finding bugs and weaknesses in a target network. Most hackers are considered
    to be criminals, but there is a small subset of good hackers called White Hat
    Hackers.


    Many hackers start young and by the time they hit adolescence they already have
    a better understanding of computers than most people ever achieve. Ironically,
    this is due to the fact that arguably the best way to learn the limitations of
    a system is by trying to break it.


    If it finds itself in the right hands, such knowledge can then be used for good
    in order to design better systems. One of the best examples of this positive brand
    of hacking is the co-founder of Apple, Steve Wozniak. In college, Wozniak was
    in a “young hacker community” which designed a tool that allowed a person to use
    phone booths to make phone calls for free. Wozniak later leveraged his extensive
    knowledge of computer systems to help Steve Jobs launch their revolution in personal
    computing. 


    A black hat hacker, commonly known as an encryption-cracker, is the brand of hacker
    who uses his advanced skill set for evil. Although in pop culture they are idolized
    as individuals with superhuman powers, witty intellect, and playful character,
    in reality these crackers are criminals with an aim of stealing, destroying and
    damaging. They usually do it on the basis of money, ideology or personal satisfaction.'
