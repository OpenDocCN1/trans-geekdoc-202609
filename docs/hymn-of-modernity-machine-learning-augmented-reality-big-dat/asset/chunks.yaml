    # SpaceX 任务


    SpaceX 是埃隆·马斯克所属的太空机构，计划在 2022 年将前两艘货运飞送到火星。SpaceX 还计划在 2024 年额外发送四艘飞船，其中两艘将载有人类小组。正如埃隆·马斯克的愿景，殖民火星的紧迫性将缓解核战争升级、小行星撞击、人工智能末日或大流行导致人类总灭灭绝的风险。


    埃隆·马斯克在 eBay 以 15 亿美元收购他共同创立的 PayPal 后创立了 Tesla 和 SpaceX。因此，如果我们最终在 2022 年在火星上建立了站点，我们可以向
    eBay 和所有的美国二手买家表示热烈掌声，感谢他们间接赞助了这次旅行。


    > “成为多行星物种远比留在单行星物种好得多。” — 埃隆·马斯克


    ## 第 6 章 - 数字经济时代


    ### 业务流程数字化


    业务流程包括生产流程、财务流程、供应链流程和创新流程，是运行业务的逐步算法。换句话说，为了保持业务运转，需要定期或季节性完成的一组重复性任务。例如，每周一早上采购生产所需的原材料是一项业务流程。每晚上当太阳能电池板离网时立即开启核电站的程序是一项业务流程。乘客登飞机的程序是一项业务流程。编制季度财务报告是一项业务流程。


    一旦建立，业务流程通常多年都不会发生太大变化。许多流程甚至已融入公司的传统中。然而，二十年来，越来越多的业务流程变得数字化或自动化。这是由不断尝试进一步降低成本、提高利润以及寻求更好的客户服务所驱动的。


    这一切都始于丰田提出了一种名为“持续改进”的流程。这基本上是一个改进其他流程的过程。多年后，这一切都归结为减少浪费、工作数字化、工作自动化或将工作外包给成本更廉的国家。


    > “资源是他用来做的工具，流程是他做事的方法，而优先级是他这么做的原因。” — 克莱顿·M·克里斯坦森，《创新者困境》作者


    ### 自动化


    通过让机器完成所有工作，自动化将业务和运营流程减少到最低或零人工辅助。我们首次在第一次和第二次工业革命期间看到全球范围内的自动化；蒸汽机的发明引发了许多重型起重和运输任务的部分自动化。


    在过去的二十年里，我们看到了从纸质流程到完全数字化流程的巨大转变。从纸质到数字的转变为新的自动化革命铺定了基础，即第四次工业革命，它将社会从工业时代的结束推向新的智能机器时代。这种自动化将首次影响白领劳动力，例如企业和银行运营。


    运输业是面临大规模自动化浪潮的下一个候选者，可能导致数百万人的失业。


    然而，从历史角度证明，人类在应对自动化和寻找工作方面具有强大的韧性。自动化是一个老概念。在《物理学》第二书中，亚里士多德引入了现代自动化概念，指的是自然界中的“自发性”，即事件本身触发其发生。


    在另一本关于政治的书中，亚里士多德从社会角度论了自动化：


    > “如果每件工具都能完成自己的工作，服从或预判他人的意愿……同样，如果梭会自动织，拨子会自动拨琴而无需手引导，那么首席技师将不需要仆人，主人也不需要奴隶。”
    — 亚里士多德，公元前 300 年《政治学》


    他以音乐为例，指出将人奴役来制作音乐是糟糕的，这在当时是不受欢迎的且劳动密集型的，但由于社会需要音乐，就必须有人被奴役。对于 2000 年前的社会来说，这些是非常了不起的思想。


    ### 机器人流程自动化


    机器人流程自动化（RPA）是一种能够自动化员工在计算机上工作的软件。RPA 软件有不同的版本，有些比其他的智能。最好的 RPA 软件允许用户记录屏幕上的任务，软件将对其进行编码。当人类完成日常重复任务时（例如打开电子邮件并将邮件中的不同字段复制到某些客户管理软件中），RPA
    会记录人类完成的所有任务。现在 RPA 能够接管计算机控制并独立完成任务——点击、打字、移动、打开、关闭、保存、复制、粘贴、计算以及执行完成给定任务所需的任何其他功能。当银行和其他流程密集型公司意识到他们可以以极低的成本自动化
    50% 的运营工作时，RPA 变得流行起来。


    你的工作是发送提醒吗？下载收据并手动输入公司的官方财务记录？或者根据打印表单填写在线表单？慢慢开始重新定位你自己吧，因为这些工作现在可以轻松地自动化了。


    ### API


    应用程序编程接口（API）这个术语你听熟悉吗？这并不意外，因为这个名字对任何人都没有吸引力，即使对高级开发者也是如此。尽管如此，这项技术是企业运营自动化的下一个大趋势。


    本质上，API 是两个不同机器和软件应用程序之间的通用通信标准。例如，在你通过 Amazon Alexa 订购披萨到披萨送到门口之间，有一长链应用程序通过
    API 相互通信。`Alexa’s API` 将你的命令发送给 `Domino’s customer API`，随后处理该命令并将指令发送到连接的烤箱。一旦披萨烤好，连接的烤箱将向自动送货车发送通知，然后车会将披萨送到你家并向
    `Alexa’s API` 发回通知。Alexa 会贴心地告诉你你的披萨好了。不需要人。大多数情况下，API 通信通过互联网进行，信息通过 HTTPS 请求传递。


    ### 开发者


    开发者也称为编码员或程序员，是编写计算机软件代码的人。有许多类型的开发者——有些专注于非常特定的编程语言，如 `Java` 或 `C#`，另一些则倾向于涉猎一切。开发者还负责应用程序的安全。


    同时编写用户界面（UI）和应用程序服务器逻辑的开发者被称为全栈开发者。


    在过去的二十年里，我们看到财富 500 强公司和大型银行减少运营人员，并越来越多地招聘软件开发者。摩根大通银行和高盛甚至自称为科技公司而非银行公司。例如，摩根大通雇佣了超过
    4 万名开发者，其年度技术预算为 110 亿美元。他们最近还建立了全球最大的数据库。


    >


    > “在拥有数据之前进行理论化是一个致命的错误。人们会不自觉地开始扭曲事实以适应理论，而不是为了适应事实来调整理论。” — 亚瑟·柯南·道尔，《福尔摩斯探》


    '
