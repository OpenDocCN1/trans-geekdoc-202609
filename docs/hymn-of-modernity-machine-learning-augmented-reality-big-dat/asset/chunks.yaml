  trans: '


    自动数据处理的需求最初源于 1890 年的美国政府；当时迫切需要帮助对快速增长的人口普查数据进行计数和总结。这项工作估计需要 10 年才能完成，由于这将与下一次人口普查的开始重叠，并不是一个可行的解决方案。


    最终的解决方案来自美国发明家赫曼·霍立（Herman Hollerith），他获得了一种电动制表机的专利，该机器可以自动处理打片并输出统计数据。打片证明是巨大的成功，将人口普查计数任务缩短到仅需六年。霍立随后创立了我们今天所知的
    `IBM` 公司。


    # BIT


    比特位 `bit` 是所有信息理论中最基本的单位。没有比粒度比单个 `bit` 更细微的信息了。`Bit` 代表二进制数字（binary digit），二进制表示在数字字母表中只有两个可能的值：`0`
    或 `1`。


    > “积少成多”

    > – 智慧名言


    不相信你可以使用 `bits` 传输有意义的信息吗？这里有一个通信单个 `bit` 的拜占式发明，它帮助帝国延续了几个世纪：在整个帝国范围内建立了一系列灯塔，只有一个目标：如果发现敌人就点燃火光。一个
    `bit` 的信息编码了一个简单的信息：火起 = 有敌人，火灭 = 无敌人。一旦敌人来袭，火光会一个接一个地亮起，信息将非常迅速从一个灯塔传输到首都，让国王的将军们有充足的时间准备防御。天才。


    如果你增加 `bits` 的数量，你本质上能够编码宇宙中的任何信息。这一事实在 20 世纪 40 年代初由克劳德·香农（Claude Shannon）观察布尔代数与电话交换电路之间的关系时在理论上得到了证明。贝尔实验室聘请香农设计通过电线传输信息的最有效方法。1948
    年，香农写了《通信的数学理论》，从根本为数字时代奠定了基础。这一成就让香农赢得了“现代信息论之父”的盛誉。


    `bits` 的发明极地简化了通信方法、存储和数据处理，这就是为什么 `bits` 成为经典计算机系统的事实语言。而之所以强调经典计算机系统，是因为量子计算机系统的出现。进入计算机科学的军备竞赛，量子计算机系统的运行方式与经典系统大不同——量子系统使用
    `qubits` 代替 `bits`。但那是另一个故事的话了。


    关于经典 `bit` 的一些数学：8 个 `bits` 数组是一个 `byte`。`1024` 个 `bytes` 是一个千 (`Kb`)，`1024` `Kb`
    是 `1` `Mb`，以此类推。是的，在计算机科学中，`bytes` 是 1024 的倍数，而不是 1000。这是因为一个 `bit` 存储两个潜在状态——`0`
    和 `1`。两个 `bits` 存储四个潜在状态：`00`、`01`、`10`、`11`。三个 `bits` 存储八种状态，以此类推，最后你的内存按以下方式呈指数级增长：`2`、`4`、`8`、`16`、`32`、`64`、`128`、`256`、`512`、`1024`。


    你现在明白为什么这些数字在计算机行业中出现的频率比普通的整数高得多了——因为它们与处理器可以存储或同时处理的信息量有关。


    上世纪的超级计算机通常只有 `1` 到 `100` `kilobytes` 需要处理。今天，我们每天产生高达 `10` `exabytes` 的数据。那是
    `11``258``999``068``426``240` `kilobytes`。


    # ASCII


    `ASCII` 是使用 8 位 `bits` 的计算机系统的国际字符编码标准。换句话说，`ASCII` 是一个表，将你键盘上的每一次按键与使用 8 `bits`
    可能编码的 `256` 个不同数字之一相关。


    例如，数字 `3` 被编码为 `0110011`，字母“a”被编码为 `1000001`，在每台标准计算机上都是如此。每当你输入一个字母时，相应的 `bits`
    序列会一次性发送给处理器告知告知输入的字符。根据字符的不同，计算机将移动光标、输入一个字母或执行一个 `function`。


    这里是用 `ASCII` 编码的托尔斯泰在《战争与和平》中的名言，“对于一个年轻人来说，没有什么比聪明女性的陪伴更必要的了”：


    `ASCII`: “01001110 01101111 01110100 01101000 01101001 01101110 01100111 00100000
    01101001 01110011 00100000 01110011 01101111 00100000 01101110 01100101 01100011
    01100101 01110011 01110011 01100001 01110010 01111001 00100000 01100110 01101111
    01110010 00100000 01100001 00100000 01111001 01101111 01110101 01101110 01100111
    00100000 01101101 01100001 01101110 00100000 01100001 01110011 00100000 01110100
    01101000 01100101 00100000 01100011 01101111 01101101 01110000 01100001 01101110
    01110001 00100000”


    '
