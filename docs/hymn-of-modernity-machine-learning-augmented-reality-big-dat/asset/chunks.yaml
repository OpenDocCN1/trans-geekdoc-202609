- raw: 'Static environment means that nothing around you is moving, or is moving very
    slowly if at all, while dynamic means things are moving and don’t stay still,
    like an ocean.


    Stochastic means that the events have a property of behaving randomly, which means
    impossible to predict with certainty, like a roulette wheel. On the other side
    deterministic means everything works like a clock, you get what you see, and you
    can predict to a high certainty the sequence of events, like in a poorly scripted
    movie with no plot twist.


    Partially observable means you are not capable of seeing the entire environment
    at each point in time. Fully observable means agent have God’s like ability to
    see everything at all times.


    Benign means you don’t need to wonder what other agents inside the environment
    plot, communication is open and transparent. Adversarial environment means you
    have an opponent, enemy, or predator. In this case modelling your enemy’s way
    of thinking becomes important, enemy can attack, lie and trick you! Adversarial
    environments are a great tool to train Artificial Intelligence for self-preservation
    and aggression skills.


    The game of chess is an example of a static, fully observable, deterministic,
    and adversarial environment. It is static because once the move is made, nothing
    changes. You can take a snapshot of your current position and evaluate your options,
    expecting nothing to change in the meantime.


    A highway is a dynamic environment, partially observable, deterministic, and benign.
    It can be considered benign because, hopefully, we don’t exist inside of the video
    game Grand Theft Auto and other cars aren’t on a mission to intentionally run
    us over.


    The stock market is an environment which is dynamic, partially observable, stochastic
    and adversarial – in other words, among the most difficult type of environments
    to navigate.


    EXPLORE VS EXPLOIT DILEMMA


    Explore - Exploit dilemma is a trade-off that RL agent must do at each step. He
    must choose to either use his already acquired knowledge or take an opportunity
    to learn new knowledge by experimenting. 


    When a RL agent begins to learn a new tasks he starts with no assumptions about
    the world. He has no prior knowledge on which actions lead to rewards and which
    lead to punishments, so he starts by taking completely random actions and memorizes
    the results. From an outside perspective it seems like random agitations of an
    indecisive drunk person. However after a given period of time, the agent has collected
    different state-action results and is now faced with a choice: shall it take the
    best-known action from this moment moving forward? Or should it continue to experiment
    and agitate in hopes of discovering some better strategy? This dilemma is called
    the Explore – Exploit Dilemma, and finding the right exploratory ratio is crucial
    for correctly training AI agent, especially if the training time is limited.


    As a rule of thumb, this ratio starts at 50%, which means the agent tries new
    actions half of the time. Then the ratio starts to gradually decrease until stabi-lizing
    at around 10% for most environments. This is the stage where the agent becomes
    greedy; it has seen the world and is now set to collect the most rewards possible
    by using his best-known strategies. Howev-er, as you noticed, the ratio is not
    completely null, and agent keeps trying something new 1 out of every 10 actions.
    This is important as it will ensure that agent stays up to date with potential
    changes in the underlying environment. Environments often evolve and the reward
    structure from a day ago might have changed since, hence the agent must adapt.


    If the environment is known to be static and benign, then the ratio will usually
    descend to 0%, meaning the agent has achieved optimality and will no longer explore.


    DELAYED REWARD MECHANISM


    During a training process, an AI agent may discover that not all rewards are created
    equal and that some sequences of actions may lead to greater benefits. But as
    in real life, one will usually need to invest significant time and effort upfront,
    refusing instant gratifications, with the aim of achieving a much bigger reward
    later. AI agents can discover such strategies as delayed rewards through a diligent
    environment exploration process. 


    The delayed reward mechanism makes an integral part of our daily lives, and those
    who master it well are often more successful than those who don’t.


    Should I spend five years in college or start earning right after school? Should
    I buy this shiny new car or should I invest in stocks that pay dividends instead?
    Should I cheat on my wife or not? Should I punch his face for insulting me or
    should I just walk away?


    As children we learn to make trade-offs, and are supposed to be smarter about
    those as we become adults. AI agent too, learns to evaluate his options and avoid
    falling into the trap of immediate benefit if such will hurt the chance of a higher
    future return.


    OVERTRAINING


    Also referred to as over-fitting, overtraining is one of the most common beginner
    mistakes when training AI. Overtraining results in poor AI performance. Problems
    come from the counter-intuitive belief that spending more hours on training will
    always yield better results. The reality is surprisingly different and is often
    due to the limited size of the training set. When passing a predetermined optimal
    training time over the same training set, AI learns too many details. Although
    this may seem counter-intuitive, it is in fact harmful.


    To suggest that a margin of surprise shall be left inside an AI algorithm is a
    very philosophical idea. Allowing room for open-mindedness correlates with the
    capacity to generalize, which consequently increases intelligence in the long
    term. Achieving the proper balance between historical experience and open mindedness
    about new possibilities is the apex of critical thinking.


    Luckily AI engineers have designed parameters that indicate when AI is entering
    an overtraining phase. For example, it becomes evident that AI is overstrained
    when it performs very well on the training tasks but performs poorly on the testing
    tasks. In general, reducing the time of training will increase the testing score,
    all the way up until the point where we reach the undertraining zone. As a result,
    the smartest plan of action is to continue progressing with training as the testing
    scores increase and stop as soon as performance becomes compromised.


    ADVERSARIAL TRAINING


    “If you know the enemy and know yourself, you need not fear the result of a hundred
    battles.”


    –Sun Tzu


    Adversarial training is a powerful type of training which involves two or more
    AIs competing against each other. This is important, because contrary to popular
    belief, AI is not a mathematician. If you take a look under the hood of the AI
    as it is learning to play chess, you’ll see that it’s actually not calculating
    all of the possible plays and picking the best ones, this is simply impossible
    due to the combinatorial explosion of possibilities. Even the fastest supercomputer
    would take millions of years to complete this task.


    Instead, AI is very much like a human, in that it is a statistical learner and
    takes a snapshot of what is currently happening, calculates a few possible actions,
    and chooses the best one based on past experience. This makes it hard for AI to
    learn an adversarial game without an opponent, the same way it is difficult to
    play chess alone. Bringing in an adversary which battles against you with methods
    and techniques you’re not formerly aware of is an excellent way to expand your
    knowledge and broaden your skills.


    DEEP LEARNING'
