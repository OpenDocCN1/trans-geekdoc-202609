    ## Preface


    The first time modern society was introduced to the idea of Artificial Intelligence
    was something like twenty to thirty years ago, and for a significant number, the
    introduction came about `The Matrix` or `Terminator` movies. The concept of `AI`
    seemed like science fiction – a futuristic idea hundreds of years away. At that
    time, personal computers were just starting to hit homes in the broader population.
    The internet had already become part of our daily lives, but it still took ten
    minutes to load a single image of decent quality. Although computers were taking
    the world by storm, making a connection between those big calculators and an intelligent
    machine was tough. The Hollywood movies about `AI` were considered fiction, not
    documentaries. Now, decades later, matters seem to have rapidly shifted. Significant
    ground-breaking publications, unlimited sponsorship from internet giants, and
    staggering amounts of digital data have opened the gates to an unforeseeable revolution.
    Terms such as `Big Data` and `Machine Learning` are buzzing all over the news,
    while renowned consulting firms warn about massive job cuts. Genius scientists
    like `Steven Hawking` warned of an `AI apocalypse` and today genius-entrepreneurs
    like `Elon Musk` continue to raise serious concerns about the end of the world
    if society doesn’t seriously consider the possibility of `AI Armageddon`. In the
    other camp, `Ray Kurzweil` and `Mark Zuckerberg` advocate that `AI` is not dangerous
    but on the contrary, will enable us to live better and longer lives. Yet, following
    the subprime crisis of 2008 and massive quantitative easing of central banks,
    today our savings accounts earn the lowest interest rates in history. Most savings
    accounts fall under a 1% annual return, which equates to losing money if we consider
    inflation. Being constantly concerned about the fate of their savings, the public
    had little chance to catch a breath and even lesser chance to catch up with the
    technological boom that took place in this decade. Perhaps some managed to buy
    `Bitcoin` and hopefully didn’t get them stolen in a cyber-attack. But `Bitcoin`
    and `blockchain` as a whole are only the tip of the iceberg in the technological
    repertoire of the 21st century. It is no secret that we have stretched capitalism
    to the extent that it serves only the elite. The middle class is slowly fading
    away. Protests from Paris to Lebanon and from Hong Kong to Brazil are a sign that
    the economy is not doing well. Now `coronavirus`, `COVID-19`, is putting an extra
    strain on our wallets, some wallets more than others. As a consequence, it is
    hard to find time for topics such as `computer programming` and `statistics` when
    the global economy is in such trouble. But technology is important. Technology
    is essential. Technology doesn’t wait, it keeps moving forward faster and faster.
    `Machine Learning`, `Cloud`, `Big Data`, `Quantum computing`, `Augmented Reality`
    – all those terms matter – they convey disruption. Terms like `Ransomware`, `Spyware`
    and `Computer Virus` matter too – they convey danger in the new cyber world. Knowing
    more about them is your first step toward a safer life. It took less than 20 years
    to remove millions of horses from the road and replace them with cars; the same
    fate might be awaiting office workers of the 21st century. If you don’t know how
    to use `Python` to enhance your productivity, it’s likely you will be replaced
    by someone who does. In manufacturing, finance, creative design, medicine – you
    name it – all those fields face the potential of being redesigned by `AI`. Even
    in politics, if you are not using analytics such as `Cambridge Analytica` to back
    up your campaign, you have a very slim chance of winning.

