    \ all of the required software was up to date. Because of these pitfalls, it became\
    \ clear that many users were looking for a ready-to-use `Windows` or `Linux` machine.\
    \ Luckily, with pre-installed programming language of choice, `IaaS` slowly led\
    \ to the creation of PaaS which swiftly put companies without a good PaaS option\
    \ out of business. \n\n# AWS, AZURE, GCP and ALIBABA\n\nThe three biggest cloud\
    \ providers are Amazon (`AWS`), Microsoft (`AZURE`) and Google (`GCP`), respectively.\
    \ `AWS`, launched in 2006 was the first Cloud business conglomerate and up until\
    \ 2019 accounted for almost half of the entire market share, followed by Microsoft\
    \ and Google. A new player form China – `Alibaba Cloud` is also slowly climbing\
    \ the Cloud ladder.\n\nAs a funny fact, Amazon’s CEO, Jeff Bezos was an early\
    \ investor in Google and in 1998 provided them with as much as `$250,000` in funds.\
    \ Amazon was already up and running for four years then. Fast-forward to today,\
    \ Google happened to be the fastest growing company in the history of capitalism,\
    \ and is now Amazon’s most feared rival in the Cloud space.\n\nCloud is an extremely\
    \ profitable business. In the case of Amazon, `AWS` cloud is notably its most\
    \ profitable business sector, more than books. However, Amazon should think twice\
    \ before getting too comfortable up on the cloud throne, as there is likely a\
    \ CEO or two doing everything in their power to gain a piece of the market share.\n\
    \nIn early 2020 studies, `AWS` lost some ground and now accounts for a little\
    \ more than a third of the market share, while Microsoft, Google, and Alibaba\
    \ have gained some market share ground.\n\n`IBM` is also planning to come back\
    \ in the picture.\n\n## Chapter 5 - Age of Virtualities\n\n### USER INTERFACE\n\
    \nThe term user interface (`UI`) mainly refers to the design and content of a\
    \ website that appears to the user.\n\n“Digital technology, pervasively, is getting\
    \ embedded in our homes, our work. It’s amazing to think that’s the right metaphor\
    \ for us as we go forward. The Holy Grail of VR is for the experience to be as\
    \ good as a lucid dream...” \n–Satya Nadella, CEO of Microsoft\n\nThe point of\
    \ UI is to facilitate interaction between human and machine. A good interface\
    \ is extremely easy to navigate, while a bad interface just makes you want to\
    \ tear your hair. As the rule of thumb, an interface should contain no more than\
    \ seven elements. This is because human term memory can only hold seven objects\
    \ at average. User interfaces, although historically visual, don’t have to be\
    \ pictorial. In `Google Home` and `Alexa`, the UI is based on voice. As voice-based\
    \ UI matures in quality as well as security, we expect to use it as frequently\
    \ as visual.\n\nThe main advantage to voice UI is speed. In a few seconds you\
    \ can order a pizza by simply saying `Alexa, order one large Chickenbecue Domino’s`\
    \ rather than going to `Domino’s` website where it takes a few minutes to click\
    \ through. And don’t worry, `Alexa` will ask you to specify if you want your pizza\
    \ right away or later, along with any other pertinent information. Addresses and\
    \ payment accounts are usually linked to your `Amazon` account, to which `Alexa`\
    \ has access.\n\n`JavaScript` is the most widespread user interface coding language\
    \ on the planet, and is also known as the language of the web.\n\nWireframing\
    \ is a process of drawing a mockup of an application with all its user interfaces\
    \ and then specifying different interactions that happen when the user triggers\
    \ particular events within the UI. Wireframing is important to do prior to coding\
    \ as it can point to potential flaws in the UI as well as difficulties of use.\
    \ Since it is much quicker to process through than coding, it can save coders\
    \ massive amounts of time and bring clarity to the business vision.\n\nA/B testing\
    \ is essentially an experiment where two or more variations of a product or UI\
    \ are shown to users in order to determine which version is better. In the case\
    \ of e-commerce, better means higher propensity to buy, also known as the conversion\
    \ rate.\n\n“UI wireframing, product prototyping and A/B testing are invaluable\
    \ tools that every aspiring entrepreneur must use to his advantage”\n–Jad Fayad,\
    \ Entrepreneur\n\nVIRTUAL REALITY\n\n“VR is a way to escape the real world into\
    \ something more fantastic. It has the potential to be the most social technology\
    \ of all time.”\n–Palmer Luckey, Founder of Oculus Rift\n\nVirtual Reality (`VR`)\
    \ is specially designed computer hardware and software allowing for a new generation\
    \ of immersive user interfaces, aimed at erasing all differences between a true\
    \ reality and a simulated reality. The Holy Grail of VR is for the experience\
    \ to be as good as a lucid dream, indistinguishable from the natural habitat.\n"
  trans: '


    通过 PaaS，程序员可以立即在云端运行其应用程序，而无需担心 Windows 更新或物理硬件，因为所有细节都由云提供商管理。


    也许最关键的一点是，PaaS 还会监控你应用程序的流量，并在需要时自动增加运行完全相同软件的额外服务器，这样用户就不必排队等待。这是 PaaS 的一个非常理想的特性，因为排队会显著减慢加载速度并破坏用户体验，从而导致企业面临最糟糕的结果：用户感到反感。


    PaaS 确实是云业务的规则改变者。那些成功创建出易用且包含大量 PaaS 服务仪表板的企业，其规模和地位不断增长。而那些苦于提供稳定且用户友好 PaaS
    系统的企业变得落后了，因为它们的用户随时间推移而剧减，例如 `IBM Cloud`、`LoudCloud`、`SAP Cloud` 以及许多其他公司。


    近年来，PaaS 产品的数量迅速增长，导致了子类的出现，其中之一就是 `AI 即服务`（AI as a Service）。这无疑为你提供了所有必要的工具，可以极大地简化机器学习模型的训练，以及将训练好的模型集成到公司的业务运营中。


    # 基础设施即服务


    基础设施即服务（`IaaS`）是对云技术最早且最原始的贡献。用户基本上是租用了他们可以通过网络访问的空服务器。


    尽管 `IaaS` 是规避自行搭建数据中心需求的一种佳解决方案，但 `IaaS` 仍然要求用户在机器运行之前安装操作系统、防病毒软件、编程语言、数据库和其他自定义软件。


    用户也是确保所有所需软件都更新到最新版本的唯一责任方。由于这些陷阱，很明显许多用户正在寻找开箱即用的 `Windows` 或 `Linux` 机器。幸运的是，通过预安装选定的编程语言，`IaaS`
    逐渐促成了 PaaS 的诞生，而这迅速让那些没有良好 PaaS 选项的公司倒闭。


    # AWS, AZURE, GCP 和阿里巴巴


    三大最大的云提供商分别是亚马逊（`AWS`）、微软（`AZURE`）和谷歌（`GCP`）。`AWS` 于 2006 年推出，首个云业务集团，直到 2019
    年它几乎占据了整个市场份额的一半，其次是微软和谷歌。一个来自中国的新玩家——`阿里巴巴云` 也在缓慢攀爬云服务阶梯。


    一个有趣的事实是，亚马逊首席执行官杰夫·贝乔斯是谷歌的早期投资者，并在 1998 年为他们提供了高达 `$250,000` 的资金。那时亚马逊已经运营了四年。回回到今天，谷歌恰好是资本主义历史上增长最快的公司，现在是亚马逊在云领域最令其畏惧的对手。


    云是一项极具利润的业务。对于亚马逊来说，`AWS` 云显然是其最丰利的业务部门，利润超过了书籍业务。然而，亚马逊在云端王座上坐得舒服之前应该考虑一下，因为可能有一或两个首席执行官正在竭尽全力争夺一分市场份额。


    在 2020 年初的研究中，`AWS` 失去了一些份额，现在占据市场份额略高于三分之一，而微软、谷歌和阿里巴巴则获得了一些市场份额。


    `IBM` 也计划回归舞台。


    ## 第 5 章 - 虚拟时代


    ### 用户界面


    用户界面（`UI`）一术语主要指呈现给用户的网站设计和内容。


    “数字技术正无处不在地渗透到我们的家、我们的工作中。想到这在我们不断前进时是一个正确的比喻，真是太奇妙了。VR 的圣杯是让体验像清醒梦一样……”

    –萨提亚·纳德拉，微软首席执行官


    UI 的作用是促进人机交互。一个好的界面极易于导航，而糟糕的界面只会让你抓狂。根据经验法则，界面包含的元素不应超过七个。这是因为人类的短期记忆平均只能容纳七个对象。用户界面在历史上是视觉化的，但并不非要是图像化的。在
    `Google Home` 和 `Alexa` 中，UI 是基于语音的。随着语音 UI 在质量和安全性上的成熟，我们预计像使用视觉界面一样频繁使用它。


    语音 UI 的主要优势是速度。几秒钟内，你只需说 `Alexa, order one large Chickenbecue Domino’s` 就能订购披萨，而不是去
    `Domino’s` 网站花费几分钟点击。别担心，`Alexa` 会询问你是想立即送达还是稍后配送，以及任何其他相关信息。地址和支付账户通常链接到你的 `Amazon`
    账户，`Alexa` 拥有访问权限。


    `JavaScript` 是地球上最广泛的用户界面编码语言，也被 Web 语言。


    线框图（Wireframing）是一个绘制应用程序草图的过程，包含所有用户界面，然后指定当用户在 UI 中触发特定事件时发生的各种交互。在编写代码之前制作线框图是非常重要的，因为它可以指出
    UI 中的潜在缺陷以及使用上的困难。由于其处理速度比编写代码快得多，它可以为程序员节省大量时间，并使业务愿景更加清晰。


    A/B 测试本质上是一种实验，向用户展示产品或 UI 的两个或多个变体，以确定哪个版本更好。在电子商务领域，更好意味着更高的购买意愿，也称为转化率。


    “UI 线框图、产品原型和 A/B 测试是每位有抱负的创业者必须利用的宝贵工具”

    –Jad Fayad，企业家


    虚拟现实


    “VR 是一种逃离现实世界进入更奇幻世界的方式。它通过专门设计的计算机硬件和软件，实现新一代沉浸式用户界面，旨在消除真实现实与模拟现实之间的所有差异。”

    –帕尔·卢克基，Oculus Rift 创始人


