    One of the most promising fields of nanotechnology is quantum computing. For the
    cryptology world, the emergence of quantum computing is a glitch of sorts, one
    where a discovery in physics can scrape decades of research in mathematics into
    the list of hypotheses proven wrong by science.


    The next code breaker is coming from a place where cryptologists least expected
    in the form of a plethora of spinning electrons which crack the uncrackable codes
    in no time at all. Materials of atomic scale have been concealing more super computational
    power than you could ever imagine. Researchers from IBM, Google and NASA have
    finally managed to create quantum computers. It is no longer a matter of if, but
    only of when their powers will truly break the internet. That is, until new anti-quantum
    cryptology puts on its superhero cape and comes flying to the rescue.


    “Nanotechnology is really interesting to me. Stuff to sort of make our world a
    better place, and a cleaner place, through science. And it also explains things
    that are happening. I’ve always been into it.”


    -Jessica Alba, Actress


    ## QUBIT and QUANTUM COMPUTING


    What is a Qubit? You guessed it – it’s a Quantum Bit. A Qubit is a basic unit
    of information on a quantum computer. Just like bits on normal computers, qubits
    are used to store, transmit, and process information, but in much higher quantities.


    In a nutshell, in order for this process to take place you must first lower your
    room temperature, and specifically a few atoms, to `-273°C`, which is near to
    absolute 0, the lowest temperature in the universe where everything freezes, atoms
    stop moving, and only electrons remain free. An interesting particularity of a
    qubit is that during calculations it isn’t limited to taking values of 0 and 1,
    but also all the values in between thanks to its nanoscale which gives it these
    essential quantum properties. This factor significantly helps with calculations,
    thus making quantum computers vastly more efficient than classical computers.


    However, contrary to classical computers which are always exact in their calculations,
    Quantum computers take a probabilistic approach to solving problems. Quantum computers
    simultaneously scan all possible results and output a statistical distribution
    of the possibilities. The most-probable results are then verified by the classical
    computer, which, as mentioned, is always exact in its calculations. This makes
    quantum computers ideal for breaking cryptological keys as well as for training
    Artificial Intelligence. In essence, these computers carry enough concerns to
    create the next technological revolution.


    IBM and Google have already released their first functioning Quantum computers.
    Google even claims that their quantum computer has already achieved quantum supremacy
    on a family of new tasks. Quantum supremacy means getting results faster than
    currently available on the fastest classical supercomputers in existence. Their
    long-term goal is to offer Quantum services via their Cloud Platforms.


    A technological revolution is already on the way and the age-old question remains:
    which companies will adapt and continue to grow, and which ones will refuse to
    implement the newest technology and be left in the metaphysical dust that Quantum
    computing leaves behind?


    > Chapter 3 - Computer Basics for Everyone


    ## PASCALINE – HISTORY


    Pascaline was the first version of a modern automatic calculator, making it the
    oldest direct ancestor to a modern computer. Sometimes referred to as the “Arithmetic
    Machine”, the device was named `Pascaline`, after its creator, Blaise Pascal.
    Pascal was an 18-year-old French mathematical prodigy who created the mechanical
    device to speed up his father’s accounting work.


    Many iterations of this concept would follow, all the way up to the little pocket-sized
    supercomputer you routinely use to swipe through Instagram, compose and read texts,
    and manage phone calls.


    ## ENCRYPTION


    Encryption is method of securing communication by altering an original message
    in such a way that it becomes impossible to read. The only way to read the message
    would be to reverse its encryption with a secret key. Encryption is the cornerstone
    of any modern communication system and is the fundamental building block of the
    internet.


    “War is 90% information”


    -Napoleon


    As pointed out by the French Emperor and great military commander - Napoleon,
    having the right information at hand is fundamental in any warfare, hence diligently
    hiding important information and securing communication is crucial.


    One of the oldest known examples of encryption is Caesar’s cipher. This encryption
    technique consisted of replacing each letter in the message with a different letter
    according to a predefined key, in the absence of which it becomes virtually impossible
    to decrypt the message. This genius mathematical invention was used in ancient
    Rome, and as the name suggests, was implemented to encrypt top-secret messages
    between Caesar and his generals. As time has gone by, skilled cipher crackers
    have become skilled at cracking monoalphabetic-based encryptions, thus creating
    the need for more sophisticated methods.


    In general, mathematicians in the field of cryptology spend years in their labs
    searching for new and ingenious ways to encode communication. Once they believe
    their encryption method to be strong enough, it is then passed on to professional
    encryption-crackers to see if they can break it. Some of the most widespread modern
    encryption solutions which have withstood time include: public key cryptology,
    one way hash functions and digital signature schemes. Everything we do on the
    internet is secure, thanks to those inventions.


    The biggest employer of cryptologists in USA? – `NSA`.


    ## ENIGMA CODING MACHINE HISTORY


    The Enigma is an encryption machine developed in the early 20th century to protect
    commercial, diplomatic, and military communication. It was used extensively by
    Nazi Germany during World War II.


    Enigma was typically operated by two people. The first and primary operator slowly
    types out the text in standard language. Every time a letter is pressed, it triggers
    a specially conceived set of rotors that do their magic by highlighting a different
    letter referred to as a ciphertext letter. The second operator will then record
    the ciphertext.


    Military enigma had `158,962,555,217,826,360,000` different settings, which earned
    it the prestigious reputation of being uncrackable. This reputation persisted
    for a long period of time, that is until English computer science prodigy Alan
    Turing and his team of mathematicians at Bletchley Park designed an algorithm
    that would be operated by a machine specifically designed to intelligently try
    many deciphering combinations until the right one was found. Luckily for Britain
    this process worked.


    ## ALGORITHM


    An algorithm is a set of instructions with an exact approach to deal with a given
    task. Algorithms are much like the music notes you must play in the right order
    to achieve the right tune. By working together, narrow algorithms can construct
    a more complex algorithm, orchestrated by a main algorithmic conductor.

