    \nIMPORTANT: For security reasons you are requested to keep your personal and\
    \ financial information safely and to not communicate it to anyone but Worldlink’s\
    \ agent who will contact you by phone as soon as you send them your contact details.\
    \ This is also a supplementary precaution measure to avoid double claiming and\
    \ unwanted abuse of the lottery program.\n\nTo file your claim, please contact\
    \ Worldlink’s fiduciary agent Mr. Paul Smith at [richard.smith.worldlink@hotmail.com)”\n\
    ```\n\nWhile it may seem silly to think that anyone would fall for a scheme like\
