  trans: '

    VR 准备改变游戏行业、教育、电子商务和通信。尽管 VR 的质量在近年来得到了极大提高，遗憾的是，大多数创新都集中在视觉环境。代表其他人类感官和感知的 VR
    体验仍然滞后。在我们能够拥有视觉和听觉之外的嗅觉和触觉之前，我们还无法真正体验 VR。


    # 增强现实


    增强现实（AR）是一种专门设计的计算机硬件和软件，旨在通过叠加的计算机界面来增强用户的体验。最常见的 AR 示例是“智能眼镜”，它可以识别物体并在位于镜片内部的透明屏幕上显示信息。例如，一个人可以戴着
    AR 眼镜在博物馆里走动，此时艺术品的描述及其情境信息就会显示在镜片上。或者，你可能是战场上的一个士兵，你的 AR 眼镜可以指示向你靠近的敌坦克的规格和弱点。AR
    基本上就是《钢铁侠》头盔的显示技术。


    “它引发了许多问题，例如，谁被允许在什么放置增强现实物体？汉堡王的人可以走进麦当劳并在那里放置一个汉堡王的广告吗？规则是什么？这是一个全新的考量领域。” ——
    Scott Belsky


    与 VR 一样，AR 在现阶段也难以渗透消费市场。但这种情况可能随时发生——就像 iPhone 的出现让诺基亚倒闭得那样快。英特尔和高通预计将在场看似关于
    AR/VR 和 AI 霸权的高风险对决中展开交锋。虽然英特尔将赞助 2024 年奥运会，并向全球用户提供独家 VR 应用，但高通本会被 Broadcom 以
    1170 亿美元收购，但由于安全原因被唐纳德·特朗普阻止了。


    # 全息


    全息图是一种不需要 VR 或 AR 可穿戴设备即可显示 3D 对象的设备。全息体验类似于 3D 电影技术，不同之处在于不需要戴 3D 眼镜。


    得益于衍射物理现象，幻象成为可能，创造了一个三维光场，赋予投影图像深度感。目前已有像微软 Hololens 这样结合了 AR 和全息技术的产品，但其高昂的价格是渗透消费和商业市场的巨大障碍。


    # 洞穴寓言 – 哲学故事


    柏拉图的《洞穴寓言》创作于公元 520 年，是一个具有教育意义且富有哲学深度的小故事，触及了每个生物如何不同的感知现实。简而言之，柏拉图描述了一群被捕并终身关在洞穴里的囚犯。囚犯从未离开过洞穴，甚至不知道洞穴的存在，因为他们的一生都被强迫盯着眼前的洞穴墙。偶尔，墙上会出现影子，并伴随着声音。那些影子是经过洞穴的访客，但从未进入过囚犯的区域。


    一天，一个囚犯设法逃出了洞穴，但他一走出洞穴，就被刺眼的阳光闪了眼。过了一段时间，他的视觉适应了，他能看到颜色，甚至能在水里看到自己的倒影。他震惊得不敢相信自己的所见。囚犯跑回洞内，讲述洞穴外发生的奇异现实的故事。当然，没有人相信他，还说他是个疯子。


    在这部寓言中，柏拉图的作品暗示现实要丰富得多。得益于《矩阵帝国》，我们开始意识到可能存在比我们看到的多多的东西。随着 AI 变得越来越聪明，我们越来越接受现实更加复杂的观点。


    “我们需要武器。不要被你的现实所束缚。” —— Leonardo Vinci


    # 矩阵帝国


    《矩阵帝国》由沃卓斯斯基姐妹编剧并于 1999 年上映，是一部描绘反乌托邦未来的标志性电影。《矩阵》讲述了最后一个人类城市——锡安的故事。


    “我们需要武器。大量的武器。” —— Neo


    电影标题指的是在 AI 运行的中央服务器上模拟的数字世界。“matrix”（矩阵）一词借自数学，矩阵是以表格形式存储和处理数字的最广泛的对象之一。矩阵广泛用于力学、机器人学、计算机图形、仿真和机器学习。事实上，一个机器学习模型只不过是一长系列相互连接的矩阵，它们共同模拟了一个人工大脑。


    # Neuralink


    Neuralink 是由连续科技企业家埃隆·马斯克发创立的一家公司。Neuralink 的目标是在人脑和计算机之间建立无缝接口，就像《矩阵帝国》中一样。Neuralink
    技术旨在极大增强人类思考能力，帮助我们与日益智能的人工智能竞争。

    '
