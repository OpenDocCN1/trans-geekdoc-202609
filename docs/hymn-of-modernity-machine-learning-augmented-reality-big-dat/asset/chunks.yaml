    In simple terms, optimization is a technique of settling “in a happy medium” of
    a difficult situation. As usual, with an optimization problem many various parties
    seek the biggest piece of the pie and have specific reasons to justify their demands.
    As you might imagine, it is challenging to quantify the problem with numbers,
    but that’s the exact function of taking an optimization approach in a preliminary
    step.


    Customers normally want to buy cheap; businesses normally want to sell expensive;
    and unfailingly, both will fight to the death on behalf of their opinion. In the
    end, nature will optimize.


    # Genetic Algorithms

    A genetic algorithm is a machine learning technic used for successfully solving
    optimization tasks. Genetic algorithms are easy to set up and intuitive in their
    processing, as they are heavily inspired by the concept of Darwinian evolution
    and natural selection.


    Genetic algorithms start by initializing a random set of solutions to a given
    problem. According to a predefined criterion, the best set of solutions are chosen
    and become parents. Parent solutions are melted together in various ways and propose
    the next population of possible solutions. In this process, some of the “children”
    solutions will receive random tweaks here and there, slightly altering them from
    their parents, a process which is called mutation. Once a new population of solutions
    is created, they will again be assessed against the defined criterion and the
    superior solutions will be selected as parents for the next generation. And as
    long as each new generation performs better than the previous one, the process
    of optimization continues. At the point where improvement is no longer seen, we
    have arrived at an optimum. Note that it is not necessarily the global optimal
    state, but it is definitely a much better solution compared to the majority of
    other solutions.


    # Python

    Besides being a huge scary snake from Southeast Asia, Python, as you might know,
    is also a programming language. Recently, Python language has been buzzing all
    over the corporate world. Many Excel users are scared they may be replaced by
    a Python expert. With Python you can easily automate tasks, plus Python is the
    default language for designing and training artificial intelligence.


    Python is the C-based programming language developed at the beginning of the 90s
    and is becoming an increasingly popular tool for all data tasks. Even the biggest
    investment banks, such as Goldman Sachs and JP Morgan Chase, are actively hiring
    hundreds of Python programmers to manage their tremendous amounts of data.


    Python’s main advantage is its relatively light syntax; it is definitely one of
    the easiest programming languages to learn. In less than a month you can be fully
    operational, though it takes many years to master.


    # Analytics

    > “Customer data in the hands of marketing analytics experts is the most effective
    weapon of the 21’st century”


    – Matviy Kruglov, Customer Sales Executive at Salesforce


    Analytics is a field dealing with collecting, processing, and interpreting data
    in order to extract and communicate useful insights. Analytical tasks can be completed
    by hand if the material is paper-based. If the data is digitized, it can be completed
    with the aid of analytics tools such as `Excel`, `SQL`, `Python`, `Qlik` and `Tableau`.
    Analytics are embedded in all business aspects and aim at improving business performance
    through conclusions drawn from factual data or customer feedback analysis. Analytics
    teams are often located inside company’s Business Intelligence (`BI`) department.


    ## Chapter 2 - Age of Cyberwars


    ### Privacy

    Privacy is a multi-purpose practice shared between politics and computer science
    designed to ensure that citizens’ private data is both safe and anonymous. This
    is especially important when it comes to highly sensitive personal data, such
    as medical records, internet history or credit card details.


    > “I don’t like to share my personal life… it wouldn’t be personal if I shared
    it.”


    – George Clooney, Actor


    ### GDPR

    The General Data Protection Regulation (`GDPR`) is the new law enforcement directive
    and formal list of rules concerning the protection of customer, employee and citizen
    data. GDPR was issued by the European Union and implemented on May 25th, 2018,
    as the newer version of the first Data Protection act issued in 1995.


    GDPR was taken extremely seriously from its beginning. The diligence was likely
    due to the non-compliance fines being set at the steep price of $14 Million or
    4% of total revenue, depending on which figure is larger.


    Besides giving customers the right to access their own data or ask to be “forgotten”,
    GDPR also regulates automated algorithmic decision-making when it comes to making
    decisions regarding humans, obliging companies to have people supervisors in the
    loop. This is especially important to avoid programmed algorithmic biases when
    it comes to social allocations, job-posting reviews and medical diagnosis. Companies
    are also enforced to encrypt user data and protect it at all cost.

