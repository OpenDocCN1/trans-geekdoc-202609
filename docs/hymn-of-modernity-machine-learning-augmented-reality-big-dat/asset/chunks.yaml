  trans: '


    纳米技术是一项处理单个细菌大小技术的工程分支。纳米技术是一门缓慢新兴的科学，其雄心是创造一系列触及生活几乎各个方面的新产品。今天，纳米技术广泛应用于电子领域，最著名的是纳米级晶体管，它们作为构建计算机的小型开关发挥作用。随着时间的推移和纳米技术的成熟，我们将越来越多地看到它超越目前先进的医疗解决方案、DNA
    测序器、纳米生物武器、自修复材料、超耐性表面涂层、核聚变、分子食品打印以及该行业的许多令人兴奋的领域。


    纳米技术最有前景的领域之一是量子计算。对于密码学界来说，量子计算的出现是某种“故障”，物理学的一项发现可以将数十年的数学研究扫地，归入被科学证明错误的假设列表中。


    下一个代码破解者将来自一个密码学家们最意想不到的地方，它们将以大量旋转电子的形式出现，在短时间内破解那些不可破解的密码。原子级的材料中隐藏着远超你想象的超级计算能力。来自
    IBM、Google 和 NASA 的研究人员终于成功创建了量子计算机。这不再是“是否”的问题，而是它们的力量何时会真正破解互联网的问题。除非新的反量子密码学披上超级英雄斗篷并飞来救援。


    “纳米技术对我来说真的非常有趣。通过科学让我们的世界变得更好、更清洁的东西。它还解释了正在发生的事情。我一直对此很感兴趣。”


    -杰西卡·阿尔巴（Jessica Alba），演员


    ## QUBIT 与量子计算


    什么是量子比特（Qubit）？你猜得没错——它是量子位。量子比特是量子计算机上的基本信息单元。就像普通计算机上的比特（bits）一样，量子比特被用于存储、传输和处理信息，但数量要大得多。


    简而言之，为了让这一过程发生，你必须首先降低室温，特别是将几个原子的温度到 `-273°C`，这接近绝对零度，宇宙中最低的温度，在那里一切都会冻结，原子停止运动，只有电子保持自由。量子比特的一个有趣的特殊之处是，在计算过程中，它不仅限于取
    0 和 1 值，得益于它的纳米尺度赋予了这些基本的量子属性，还可以取中间的所有值。这一因素极大有助于计算，从而使得量子计算机的效率远高于经典计算机。


    然而，与始终进行精确计算的经典计算机相反，量子计算机采用概率方法来解决问题。量子计算机同时扫描所有可能的结果，并输出可能性的统计分布。最可能的结果将由经典计算机进行验证，如所述，经典计算机在计算方面总是精确的。这使得量子计算机成为破解密码密钥以及训练人工智能的理想选择。从本质上说，这些计算机带来的足以引发下一次技术革命的影响。


    IBM 和 Google 已经发布了他们的第一批运行的量子计算机。Google 甚至声称其量子计算机已经在一系列新任务中实现了量子优越性。量子优越性意味着比现有最快的超级计算机更快地获得结果。他们的长期目标是通过其云平台提供量子服务。


    一场技术革命已经在路上，古老的问题依然存在：哪些公司将适应并继续增长，而哪些公司将拒绝实施最新技术而被留在量子计算留下的形而学尘埃中？


    > 第 3 章 - 全员计算机基础


    ## 帕斯卡机 – 历史


    帕斯卡机（Pascaline）是第一代现代自动计算器，它是现代计算机最古老的直接祖先。设备有时被称为“算术机”，以它的发明者布莱斯·帕斯卡（Blaise Pascal）命名为`帕斯卡机`。帕斯卡是一个
    18 岁的岁的法国数学天才，他发明了这种机械设备来加速他父亲的会计工作。


    这种概念之后会有许多次迭代，一直直到你日常用于刷 Instagram、撰写和阅读短信以及管理电话的小型口袋级超级计算机。


    ## 加密


    加密是一种通过更改原始消息使其变得不可读来确保通信安全的方法。读取消息的唯一方法是使用密钥对对其加密进行反向操作。加密是任何现代通信系统的基石，也是互联网的根本构建模块。


    “战争的 90% 是信息”


    -拿破仑（Napoleon）


    正如法国皇帝和伟大军事指挥官拿破仑所指出的，在任何战争中，掌握正确的信息都是基础性的，因此勤奋地隐藏重要信息并确保通信安全至关重要。


    已知的最古老的加密示例之一是凯撒密码。这种加密技术包括根据预定义的密钥将消息中的每个字母替换为不同的字母，在没有密钥的情况下，解密消息几乎是不可能的。这项天才的数学发明被用于古罗马，正如其名所示，它被用于加密凯撒与其将军之间的机密信息。随着时间的推移，熟练的密码破解者变得精于破解单字母替换类加密，因此产生了对更复杂方法的需求。


    总来说，密码学领域的数学家在实验室里花费多年时间寻找新颖且巧妙的方法来编码通信。一旦他们认为自己的加密方法足够强大，就会将其交给专业的加密破解者，看他们是否能破解。一些经受时间考验的最广泛的现代加密解决方案包括：公钥密码学、单向哈希函数和数字签名方案。得益于这些发明，我们在互联网上所做的一切都是安全的。


    美国最大的密码学家雇主？——`NSA`（安全局）。


    ## 恩尼玛密码机历史


    恩尼玛（Enigma）是 20 世纪初开发的一种加密机，用于保护商业、外交和军事通信。它在二战期间被纳粹德国广泛使用。


    恩尼玛通常由两个人操作。第一个也是主要操作员缓慢地用标准语言输入文本。每当按下一个字母，就会触发一组特殊设计的转子，它们通过高亮不同的字母（称为密文字母）来发挥魔力。第二个操作员随后记录密文。


    军用恩尼玛有 `158,962,555,217,826,360,000` 种不同的设置，这使其赢得了不可破解的崇高声誉。这种声誉持续了很长时间，直到英国计算机科学天才艾伦·图灵（Alan
    Turing）和他在布莱切利园的数学家团队设计了一种算法，由一台专门设计的机器运行，智能地尝试许多解密组合，直到找到正确的组合。对英国来说的是，这个过程起作用了。


    ## 算法


    算法是一组处理给定任务的精确方法的指令集。算法非常像你必须按照正确顺序的音符才能获得正确的旋律。通过协作，狭义算法可以构建出更复杂的算法，并由主算法指挥进行协调。


    '
