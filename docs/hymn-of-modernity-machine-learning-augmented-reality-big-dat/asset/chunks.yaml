- raw: 'Facial recognition (FR) involves AI that is capable of providing the identities
    of people present in a photo or video. Facial recognition can be used by a specific
    company as a security measure to prevent unwanted intruders on their premises,
    or by an entire nation as a means to oversee citizen behaviour. For example, in
    China FR is employed to prevent mass gatherings, control demonstrations, and monitor
    crime.


    DECISION TREE


    Before the deep learning revolution, decision trees were among the most successful
    techniques for resolving classification tasks. They remain widely used for their
    transparency and reliability.


    To classify data between a given set, decision trees find particular differences
    in the data which allows for maximal class segregation. Next, decision trees branch
    out, further splitting into two classes with the process continuing until each
    data point has been classified. The endpoints of each branch are called leaves.
    If you have ever seen a tree of life model of biological evolution, you are familiar
    with the most basic branch split between eukaryotes and bacteria, then the split
    between mammals and reptiles, until eventually you come to the human, which is
    considered a leaf. This a basic decision tree structure.


    RANDOM FOREST


    Random forest is an ensemble learning method based on decision trees.


    In a nutshell, as data grew and became more complex, it was no longer enough to
    design a single decision tree to achieve maximum accuracy in a classification
    task. As a result, computer scientists developed methods of producing anywhere
    from dozens to hundreds of decision trees with different settings, hoping that
    each will pick up something special about the data. After that, each decision
    tree provides an opinion on how it would classify the content that was asked of
    it, votes are counted, and at the end the most common opinion is established as
    the correct answer. Random forest is a very simple and democratic form of AI.


    REGRESSION


    Regression undermines a certain property of an environment where one or multiple
    variables can explain evolution and behaviour of another variable of interest.
    Regression learning is possible only in environments that display some degree
    of order and can be statistically studied. 


    For example a simple regression can model the trajectory of a cannon ball. A more
    complex regression can make a price estimator for real estate based on input properties
    like location, size, number of windows, and year of construction. It is a supervised
    learning task so AI first needs example data to train, but that is usually not
    an issue. Machine Learning algorithms are great at building regression models
    even for the most complex environments.


    Science, insurance, and supply chain are among the fields that are heavily relying
    on regression models.


    SENTIMENT ANALYSIS


    Also known as sentiment mining or emotional AI, sentiment analysis (SA) refers
    to the use of AI for quantifying and qualifying the emotional charge of news,
    tweets, financial reports, customer reviews and camera footages. Contrary to the
    common belief that AI doesn’t recognize common human emotions such as rage, fear,
    concern, happiness, or essentially any human emotion – recognizing human emotion
    is actually one of the simplest tasks AI can learn to do.


    Today we count 27 official distinct emotions: Adoration, Aesthetic Appreciation,
    Amusement, Anxiety, Awe, Awkwardness, Boredom, Calmness, Confusion, Craving, Disgust,
    Empathetic pain, Entrancement, Envy, Excitement, Fear, Horror, Interest, Joy,
    Nostalgia, Romance, Sadness, Satisfaction, Sexual desire, Sympathy


    As if preferred by evolution, our facial expressions and language are extremely
    expressive and immediately reveal our emotions, making it an easy job for AI to
    capture. It is actually more challenging to hide emotions from AI rather than
    communicating them. Confirming the theory, an AI capable of analysing facial expressions
    recently defeated world poker champions.


    GENERATIVE ADVERSARIAL       NETWORKS


    Generative adversarial networks (GANs) is a branch of deep learning that focuses
    on generating new media content. Media that GANs can create include paintings,
    music, cartoons, videos, movie scripts, and more. GANs are designed with two different
    networks that compete with each other – one designs content and the other criticizes
    its quality. How does the critical network know what humans will consider good
    or bad? We train it for that exact purpose, but only after giving it the content
    of the generative part.


    DEEP FAKES


    Deep fakes are fake news, fake images, or fake realistic videos created by AI.
    They are called fake because their primary goal is to mislead the audience into
    believing they are real. An AI deep-fake-generated video of Barack Obama giving
    a speech created a massive buzz a few years ago; the video seemed nearly indistinguishable
    from the authentic Obama. We are not talking about Hollywood graphics or cartoons,
    but video and sound of such high quality that it is indistinguishable from the
    real. This opens a breach to extremely misleading news and potential political
    issues.


    Because the web will soon be flooded with deep fakes, it is said that in the future
    all reputable media providers will need to authenticate their content with a blockchain
    token to prove the news is not fake.


    ROBOTICS AND CONTROL


    Robotics is the branch of engineering that deals with designing, programming,
    manufacturing, and operating robots. Robots are designed to assist humans in day
    to day living, therefore industries are leveraging robots to automate human work
    in places where it makes economic sense.


    Historically, the field of robotics heavily relied on human programmers to manually
    code every possible situation in which a robot might find itself. In many real
    world situations, such a task is simply impossible. However, Japanese engineers
    refused to give up and spent almost two decades unsuccessfully sweating over a
    practically unresolvable task. Progress lagged until a team of Canadian researchers
    teamed up with Silicon Valley engineers came up with the Deep Learning technology.
    Deep Learning finally allowed robots’ motor intelligence to be wired inside virtual
    simulators during a training process, with no manual coding needed.


    Today, provided that you have the right hardware and a simulator, teaching a robot
    to walk can be as easy as importing a few Python libraries and writing a few lines
    of code to add specifications. 


    The battle for better robots is actively ongoing in the hardware space. This is
    where good control systems make a world of difference.


    Control theory emerged from a combination of mathematics, mechatronics, and computer
    science in the last century. At its core, control theory studies various ways
    of stabilizing systems and smoothing out their operations.


    In a simple case of a drone, the smarter the embedded control system the more
    stable it is, making it a piece of cake to fly. On the other side, cheap drones
    that don’t integrate advanced control systems are very hard to fly and you oftentimes
    end up bashing them into trees or into the ground – they simply don’t have the
    necessary self-stabilizing layer.


    Recent advancements in robot control are peaking strong, and you have probably
    seen videos of Boston Dynamics’s Atlas making backflips like a pro. Now that we
    have a Deep Learning brain which can intelligently command the robot and an advanced
    control system which allows for a smooth navigation, the only last major piece
    remaining before we get into the era of massive robot deployment is the lack of
    light and durable energy source. Unfortunately robots consume a lot of energy
    and carrying around a heavy battery lasting for an hour tops is not a viable option.


