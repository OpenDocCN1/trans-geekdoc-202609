  trans: '

    在 CPU 经历了数十年的改进后（主要是晶体管变得越来越小），我们正面临晶体管尺寸的物理极限，因此 CPU 的未来面临质疑。然而，英特尔正在研究不同的规避这些限制的方法。3D
    形状芯片以及量子芯片是最具前景的研究领域。


    ## GPU 与 NVIDIA


    图形处理器（GPU）与 CPU 类似，但其设计用于处理需要更高并行度的任务。此类任务包括图形渲染和高质量图像显示，这些任务高度依赖矩阵乘法。正如你可能注意到的，AI
    训练也依赖于大型矩阵乘法，这使得 GPU 起传统的 CPU 成为训练过程的更好工具。


    NVIDIA 是全球领先的 GPU 设计师和供应商。随着深度学习的兴起，NVIDIA 的股价飙升，特别是在最初关于他们参与自动驾驶嵌入式硬件的传闻之后。


    CPU 和 GPU 协同工作，就像我们大脑的左右半球一样。一个更侧重于顺序和分析，而另一个则更侧重于并行和整体。


    ## 软件


    软件是程序算法的集合，这些算法被封装在一个稳定且易用的信息技术（IT）产品中。良好的软件由各个模块组成，每个模块都经过了稳定性、安全易用性的测试。


    软件是硬件的对立面——硬件指的是计算机的实体组件。软件是使用编程语言创建的。


    世界上最著名的软件公司是微软，因其畅销的 Windows 操作系统和 Microsoft Office 软件套（包括 Word、Excel、PowerPoint、Outlook
    等）而闻名于世。


    “那些自认为讨厌电脑的人问题在于，他们真正讨厌的是糟糕的程序员。”

    –拉里·尼文，《环形世界》作者


    ## JAVA


    Java 是地球上最流行的通用编程语言之一。Java 的基础版本完全免费使用。


    Java 由 Sun Microsystems 公司于 1995 年发布，随后在 2009 年被甲骨文以 74 亿美元的巨价收购，以便甲骨文能够提供付费销售的
    Java 企业版。Java 的口号从诞生以来一直保持不变：“一次编写，随运行”。得益于对底层硬件的抽象层，Java 允许程序员编写一段代码，让任何安装了 Java
    虚拟机（JVM）的计算机都能理解。如今许多计算机和移动设备在销售时都预装了 JVM。Android 完全构建在 Java 之上。任何人都可以编写 Java
    代码并在手机上运行。例如，你可以使用 Java 构建游戏或应用程序。另一方面，iPhone 支持 Swift 语言而非 Java，但 Swift 与 Java
    非常相似，就像西班牙语之于意大利语一样，因此其概念是相同的。在苹果世界之外，几乎没有设备能理解 Swift 编码语言，但它们通常都能理解 Java。


    尽管 Java 有许多功能，但它很少用于创建机器学习应用程序，也不用于数据科学。由于历史原因，Python 社区在机器学习领域更加活跃，并开发了更多简化 AI
    工程师任务的工具。尽管如此，Java 仍然擅长处理数据流水和数据基础设施设计。因此，应用程序开发者和数据工程师更频繁地使用 Java，而数据科学家和 AI
    工程师则更偏于 Python。


    ## 数据库与 SQL


    数据库是以表格格式存储数据的软件。数据库的设计在用户界面上保持简单，但在高速运行方面非常强大，这与 Excel 等个人表格管理应用相反，后者的优先考虑因素是易用的界面。原始数据库由
    IBM 发明，其目标是实现打孔卡系统的完全数字化。


    数据库对现代世界至关重要，如果说数据被视为我们经济的血液，那么数据库就是将所有数据结合在一起的关键骨架。如今，每个政府和主要企业都高度依赖数据库来组织他们最重要的数据。


    常见的数据库应用包括：航空公司预订系统、产品库存管理、银行交易、在线购物和客户信息数据。大多数数据库存储在单个中央服务器上。任何需要访问数据的人必须向系统管理员申请用户名和密码。有了这些信息，用户就可以通过网络成功检索所需的数据片段，而无需下载整个数据库。


    从历史角度来说，尽管 IBM 发明了数据库，但没过多久，当时的计算机科学家拉里·埃利森就开始为中央情报局（CIA）开发一个数据库项目。在离开 CIA 后，埃利森利用他的数据库专业知识创立了甲骨文，在随后的几十年里一直是世界上领先的数据库。到
    2010 年，甲骨文数据库让拉里·埃利森成为地球上第六富人和美国第三富豪，仅次于科技巨头比尔·盖茨和著名投资者沃伦·巴菲特。


    SQL 是结构化查询语言（Structured Query Language），是一种由 IBM 发明的简单且易用的计算机语言，使企业行政人员可以在没有专家级计算机科学家帮助的情况下查询数据库。今天，SQL
    在企业界无处不在，是用于从数据库选择数据的标准语言。


    ## 区块链与比特币


    区块链是一个分布式数据库，这意味着每个用户在他们的机器上都有一个完整的数据库副本。它与经典数据库不同，后者由一个中央管理员管理，并通过网络向所有拥有有效凭据的人开放。


    区块链的核心在于，如果每个人都持有一个整个数据库的副本，那么对其内容的任何修改要而不被察觉将变得困难得多。要成功实现这一点，一个人需要破解存在的每台机器并更改数据，或者对至少超过
    50% 的机器进行操作。这使得信息伪造比在经典数据库上困难得多。


    但问题仍然存在，区块链对存储的要求很大，因为每个人字面上都持有一个副本。批评者认为这种方法不可扩展，更不用说它在环保方面并不理想。未来，区块链技术将越来越多地用于物理或数字对象提供真实认证，以防止欺诈和伪造。


    区块链应用的一个著名例子是比特币等加密货币，用于进行流动性的匿名传输。比特币的创建是为了反击银行准备金制度，该制度被指控制造货币和导致通货膨胀。然而，由于价格波动剧烈，比特币的采用仍然缓慢且仍处于投机阶段。


    “比特币比货币更好”

    –比尔·盖茨，微软创始人


    ## 文件系统


    文件系统是存储数字文档的最常见方式。文件类型和数据结构可以自由变化，不需要相同，这与存储在数据库系统中的数据相反。文件系统的格式可以是任何格式，Word、Excel、PDF、TEXT、JPEG、PNG、PYTHON、JAVA
    等。


    你一定对文件系统非常熟悉，无论你是否意识到，你每天都在使用它。无论你是打开电脑上搜索旧文档、家庭照片还是你喜爱的歌曲。

