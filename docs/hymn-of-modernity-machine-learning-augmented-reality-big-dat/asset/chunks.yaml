- raw: '“Much of what we do with machine learning happens beneath the surface. Machine
    learning drives our algorithms for demand forecasting, product search ranking,
    product and deals recommendations, merchandising placements, fraud detection,
    translations, and much more. Though less visible, much of the impact of machine
    learning will be of this type — quietly but meaningfully improving core operations.”


    –Jeff Bezos, Founder and CEO of Amazon


    ARTIFICIAL NEURAL NETWORKS


    Artificial Neural Networks (ANNs or NNs) are computerized simulations of biological
    neurons, similar to those in the human brain. Inspired by discoveries in early
    neuroscience, ANNs were invented in the 1940s, but unfortunately didn’t show any
    signs of meaningful intelligent performance at the time. Fast-forward to today,
    and ANNs are legitimate citizens in nearly every aspect of the digital economy.


    Neural networks are very simple in their basic structure, yet capable of displaying
    astonishing learning capabilities in a wide variety of seemingly unrelated tasks.


    As you may know, humans perceive the world through our sensory system, often with
    our five basic senses. Those perceptions are transformed into tiny electrical
    signals that travel to our brains to deliver a message. Once reaching the brain,
    the signals enter a labyrinth of neurons, and continue travelling until the parts
    that link neurons together, which are called synapses, begin turning off signals
    that are judged unimportant, while amplifying the ones deemed essential. As a
    result, signals travel back to a particular sensing organ, carrying a message
    such as “move faster”, “hold very gently”, or “that colour matches my sweater”!


    Artificial neural networks are commonly referred to as Black Boxes, which is one
    of their biggest disadvantages. This is because due to their nature, NNs have
    little to no transparency in the way they make decisions. On one hand this can
    be seen as a negative, but on the other, NNs’ complex structure gives them the
    ability to capture complex information, hence displaying a critical aspect of
    intelligence. This type of critical thinking is the same reason we are still unable
    to explain how humans make instant decisions. We may see their input and output,
    but we don’t always know their internal process.


    ML TRAINING


    Machine learning training consists of applying a standard set of AI procedures.
    These procedures provide a system for AI to automatically learn from experience
    in order to perform a task correctly. Performance assessment is generally done
    by measuring the deviation between the intended and obtained result. The training
    goal is to reduce deviation to a minimum.


    Just like a university student, ML shall manage to learn the expected knowledge
    through continued trial and correction. Once AI software indicates good results
    in the training set, it will then move to the test set. AI is often tested on
    similar training tasks, but not exactly the same, just like in school. This is
    crucial in both making sure that AI manages to generalize its knowledge and in
    preventing hard wiring. It also allows for some flexibility, which is important
    in being able to deal with potential deviations in tasks from the ones it was
    trained on. If the test performance is deemed successful, AI models will be qualified
    as “working” and can then be used in real world applications.


    For example, in the case of autonomous cars, if the driven mileage without accident
    surpasses the average human score, then the car will be approved to hit the roads.
    Intriguingly, this is already the case in certain areas of California.


    Types of ML training vary widely and range from supervised learning to reinforcement
    learning, but generally all remain centred around the basic concept of statistical
    learning. This means observing multiple series of example data, drawing meaningful
    hypotheses, and then testing their validity in practice.


    There is only one condition for learning, that the experience data or the training
    environment are not completely chaotic. There must be some degree of natural order,
    otherwise learning process is not possible, neither for human nor AI. However,
    AI can sometimes see order where we humans simply don’t have enough imaginative
    power. AI has no physical limits for its IQ; it can be improving to infinity. 
    However, be assured, your brain can also be connected to a computer with large
    neural networks and you could become as smart as AI. It will be like wearing the
    much needed glasses for your blurry vision: Everything will become clear.


    SUPERVISED LEARNING


    Supervised learning (SL) is a type of AI training where a high volume of example
    data must be provided upfront, from which AI is tasked to extract knowledge. This
    process is achieved by AI’s memory wiring, which links inputs and outputs. AI’s
    memory is a bundle of interconnected mathematical matrices, capable of reducing
    complex imagery scenes to a few predefined number of categories, known as classes.
    Examples of classes can include simple groupings such as “good” or “bad” or “cat”
    or “John” or “ex-girlfriend” or “financial crisis” or “green light” or ”ripe apple”
    or “spoiled apple“ or  “bigger house than mine”.


    REINFORCEMENT LEARNING


    Reinforcement learning (RL) is one of the most advanced training techniques in
    machine learning and is said to be the closest viable way of achieving artificial
    general intelligence.


    Contrary to supervised learning, reinforcement learning doesn’t need a teacher,
    previously annotated training data. Instead, RL learns through a simulation program.


    Every reinforcement learning problem consists of three elements: a learning agent
    (the AI), an environment in which the agent learns, and the feedback loop of predefined
    rewards and punishments that are defined by the creator. Just like in Nintendo
    video games, Mario receives points when collecting coins or finishing a level.
    This reward system closely resembles the human dopamine system.


    An AI agent has an internal memory state, and after a long series of trials and
    errors, it should understand that some sequences of action earn a positive reward,
    some don’t impact the agent at all, and other actions penalize the agent with
    negative points called punishments. The goal of an agent is to learn a behaviour
    which will maximize his total score.


    Every training starts as random agitation. Agent moves left and right and keeps
    doing so until it receives a reward or gets punished. Moves that led to the rewards
    get memorized as positive and the others as negative. Frequently incurring positive
    behaviour gets reinforced, hence the name, reinforcement learning.


    The training environment in which the agent learns can be either on real ground
    or in a simulation replicating physical events in a digital format. Most frequently,
    agents are trained in simulators because training on real ground is much slower
    and vastly more expensive, as it becomes necessary to invest in hardware which
    will likely be destroyed numerous times before the agent learns anything. Training
    in a virtual simulator can speed up learning a million times over. Only after
    achieving success in the simulation will the agent need to readjust to a real
    environment. The better the simulator, the smoother the readjustment period.


    Good simulators and powerful computers allow for countless hours of practice in
    an accelerated manner. In other words, reinforcement learning can potentially
    provide enough practice for an AI soldier to master every combat sport on Earth
    in less than a day.


    ENVIRONMENTS


    Environment is the virtual or real space in which AI agent learns to operate.
    Environments differ vastly in complexity, making some tasks much harder to master
    than others. Environments can be


    > \-         Static or dynamic


    > \-         Partially observable or fully observable


    > \-         Stochastic or deterministic


    > \-         Benign or adversarial.'
