  trans: '


    这些信息当然是许多银行和其他机构用于找回遗忘密码时最常用的安全问题之一。


    # 翻垃圾桶 (DUMPSTER DIVING)


    翻垃圾桶，换句话说，是在垃圾箱中寻找信息，通常被黑客和间谍机构用于挖掘信息。当然，这种方法在企业垃圾挑选中更具适用性。


    “例如，甲骨文甚至雇佣人员去翻垃圾桶以获取有关其竞争对手微软的信息。这甚至不是违法行为，因为垃圾不受数据保密法的保护。”


    \-`Kevin Mitnick`，9 90 年代后期最受通缉的黑客。


    # 网络流量分析 (NETWORK TRAFFIC ANALYSIS)


    流量分析是对通信模式的研究。在无法获取消息内容的情况下，流量分析仍然可以指示大量的相关信息。


    是谁在和谁通话？对话持续多久？对话在什么时间进行？这些以及所有类似的问题有助于理解交换的动态。


    当然，单纯的“谁在和谁通话”已经是很多宝贵的信息了，但还有许多军为人知的流量模式。例如，从 `Alice` 到 `Bob` 和 `Sam` 的定期通信，然后从
    `Bob` 和 `Sam` 到几十个其他个人，这意味着 `Alice` 正在传达一链指令。


    `Alice` 和 `Bob` 之间快速且短暂的通信可能代表谈判。


    # 网络 (NETWORK)


    一组连接在一起的计算机或移动设备，最常见通过通过线或 WiFi 连接。大多数本地网络都连接到互联网，使其容易受到黑客的攻击。如果连接到网络的其中一个设备被攻破，那么可以说，连接到网络的所有设备都被攻破了。


    网络是网络攻击最频繁的渠道，因为黑客不需要冒风险物理上接近目标，而可以坐在世界另一端某处的沙发上，简单地通过互联网完成盗窃。计算机黑客可能无法走近一位大型职业运动员并当面抢劫他们，但只需通过一点个人信息，他们就能造成更大的破坏。


    我们通常将网络组分为以下三类：


    1. 个人家庭网络，通常包括全家所有的计算机、移动设备和私人个人信息。这通常被认为是存储信息最安全的地方。

    2. 公共网络，通常在咖啡馆、机场和酒店免费访问，这通常使它们成为一个完全脆弱的地方。

    3. 企业网络，当然你会在办公室访问它。公司网络是网络攻击的蜜罐，因为这些网络存储了敏感的客户数据、行业秘密和财务组合。这样的攻击可能会让最强大的公司也倒闭，这就是为什么几乎每一家业务集团每年都会投入数百万美元用于网络保护和安全审计。


    互联网是由许多小型公共、私有和工作网络组成的一个大网络。与你可能认为的，互联网并不是一个良性的环境，而是一个对抗性的环境。当你离开私有网络进入互联网的公共网络（如
    `Cartier.com` 或 `SomeLuxuryRestaurantReservation.com`）来浏览内容或进行在线购物时，一群黑客总在监视这些新来，并准备好跟随他们回到私人网络，试图监视他们或盗取他们的数据。


    # P2P 网络 (P2P NETWORK)


    一组相互连接的计算机节点形成一个私有网络，通过互联网向彼此发送通常非法的资源。`P2P` 架构最初由 `Napster` 普及，它允许分享盗版音乐。今天，诸如
    `Torrent` 等 `P2P` 网络允许传播电影、音乐、书籍、软件和其他形式媒体的非法拷贝，给媒体行业造成了毁灭性的收入损失。`P2P` 就像周日集市的概念，交易直接在卖方和买方之间进行，相比之下，`Walmart`
    则处于双方中间人的角色。


    `P2P` 背后的思想是数字服务民主化和去中心化的基石。我们没有得到 `bbc.co.uk`，而是得到了 `Facebook` 和 `Instagram`，每个人都可以发布和分享内容。我们没有城市出租而是得到了
    `Uber`。我们没有 `Hilton` 酒店而是得到了 `AirBnb`。我们没有国家电视台而是得到了 `YouTube`。


    虽然纯去中心化 `P2P` 网络在大多数情况下转向了 `Dark Web`，但其以中心化社交共享平台形式存在的直接兄弟取得了巨大的全球成功，有效地创造了现代互联网巨头。


    然而，随着时间的推移，每种服务都会找到自己的领域，很少有 `AirBnb` 房主可以媲美 `Hilton` 的质量，也很少 `YouTubers` 能获得奥斯卡。两种类型现在在一个健康的竞争生态系统中共存。


    # 暗网 (DARK WEB)


    暗网是互联网的黑市，对 `Google` 等搜索引擎不可见，需要特殊的软件、配置和授权才能访问。由于它主要传输非法服务，因此对公众隐藏的，以避免引起不必要的关注。


    “能够看到孩子在互联网上去过的活动日志是一件好事。”


    –`Bill Gates`


    在 `Dark Web` 上进行的服务包括人口和器官交易、卖淫、奇异动物贸易、武器走私，当然还有毒品交易。暗网还提供一系列更不道德的服务，例如在线展厅，授权的访客可以付费通过网络摄像头协助酷刑、暴力、色情等行为。人们通常在暗网上使用匿名的
    `Bitcoins` 交易，这推动了 `Bitcoin` 的流行并导致了 2018 年的 `Bitcoin` 泡沫。


    # TOR


    `Tor` 是一种软件，允许用户隐藏真实的 `IP` 并匿名浏览互联网，从而使其极难被监视。`Tor` 在黑客和罪犯中非常受欢迎，因为它为他们提供了在互联网上进行犯罪活动以及访问
    `Dark Web` 的所需自由。


    # 黑客 (HACKER)


    “没有任何能量源比一个拖延的大学生更强大了。”


    ―`Paul Graham`，《黑客与画家：计算机时代的大思想》


    黑客是熟练的计算机程序员，能够发起成功的网络攻击，通常通过寻找目标网络中的漏洞和缺陷。大多数黑客被认为是犯罪分子，但有一一小部分良好的黑客被称为**白帽黑客
    (White Hat Hackers)**。


    许多黑客从小就开始，到他们进入青少年时期时，对计算机的理解已经超过了大多数人。讽刺的是，这是由于一个可以说，了解系统局限性的最好方法就是尝试打破它。


    如果它落入正确的手中，这种知识就可以被用于善意设计更好的系统。这种正面黑客行为的最佳例子之一是苹果的联合创始人 `Steve Wozniak`。在大学期间，`Wozniak`
    属于一个“年轻黑客社区”，他们设计了一种允许人们使用电话亭免费拨打的工具。`Wozniak` 后来利用他丰富的计算机系统知识帮助 `Steve Jobs`
    启动了个人计算革命。


    **黑帽黑客 (black hat hacker)** 通常被称为**加密破解者 (encryption-cracker)**，是利用其高级技能作恶的黑客类型。虽然在流行文化中，他们被偶像化为拥有超能力、机智智慧和幽默性格的个人，但现实中，这些破解者是以盗窃、破坏和损坏为目的的犯罪分子。


    '
