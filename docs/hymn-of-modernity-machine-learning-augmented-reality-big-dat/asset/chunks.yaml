    \n> Preface\n\nThe first time modern society was introduced to the idea of Artificial\
    \ Intelligence was something like twenty to thirty years ago, and, for a significant\
    \ number, the introduction came about via The Matrix or Terminator movies. The\
    \ concept of AI seemed like science fiction – a futuristic idea hundreds of years\
    \ away. At that time, personal computers were just starting to hit homes in the\
    \ broader population. The internet had already become part of our daily lives,\
    \ but it still took ten minutes to load a single image of decent quality. Although\
    \ computers were taking the world by storm, making a connection between those\
    \ big calculators and an intelligent killing machine was tough. The Hollywood\
    \ movies about AI were considered fiction, not documentaries. Now, decades later,\
    \ matters seem to have rapidly shifted. Significant ground-breaking publications,\
    \ unlimited sponsorship from internet giants, and staggering amounts of digital\
    \ data have opened the gates to an unforeseeable revolution. Terms such as Big\
    \ Data and Machine Learning are buzzing all over the news, while renowned consulting\
    \ firms warn about massive job cuts. Genius scientists like Steven Hawking warned\
    \ of an AI apocalypse and today genius-entrepreneurs like Elon Musk continue to\
    \ raise serious concerns about the end of the world if society doesn’t seriously\
    \ consider the possibility of an AI Armageddon. In the other camp, Ray Kurzweil\
    \ and Mark Zuckerberg advocate that AI is not dangerous but on the contrary, will\
    \ enable us to live better and longer lives. Yet, following the subprime crisis\
    \ of 2008 and massive quantitative easing of central banks, today our savings\
    \ accounts earn the lowest interest rates in history. Most savings accounts fall\
    \ under a 1% annual return, which equates to losing money if we consider inflation.\
    \ Being constantly concerned about the fate of their savings, the public had little\
    \ chance to catch a breath and even lesser chance to catch up with the technological\
    \ boom that took place in this decade. Perhaps some managed to buy Bitcoins and\
    \ hopefully didn’t get them stolen in a cyber-attack. But Bitcoin and blockchain\
    \ as a whole are only the tip of the iceberg in the technological repertoire of\
    \ the 21st century. It is no secret that we have stretched capitalism to the extent\
    \ that it serves only the elite. The middle class is slowly fading away. Protests\
    \ from Paris to Lebanon and from Hong Kong to Brazil are a sign that the economy\
    \ is not doing well. Now coronavirus, COVID-19, is putting an extra strain on\
    \ our wallets, some wallets more than others. As a consequence, it is hard to\
    \ find time for topics such as computer programming and statistics when the global\
    \ economy is in such trouble. But technology is important. Technology is essential.\
    \ Technology doesn’t wait, it keeps moving forward faster and faster. Machine\
    \ Learning, Cloud, Big Data, Quantum computing, Augmented Reality – all those\
    \ terms matter – they convey disruption. Terms like Ransomware, Spyware and Computer\
    \ Virus matter too – they convey danger in the new cyber world. Knowing more about\
    \ them is your first step toward a safer life. It took less than 20 years to remove\
    \ millions of horses from the road and replace them with cars; the same fate might\
    \ be awaiting office workers of the 21st century. If you don’t know how to use\
    \ Python to enhance your productivity, it’s likely you will be replaced by someone\
    \ who does. Or maybe your job will be automated all together. Manufacturing, finance,\
    \ creative design, sales, medicine – you name it – all those fields face the potential\
    \ of being redesigned by data and AI. Even in politics, if you are not using an\
    \ analytics’ champion such as Cambridge Analytica to back up your campaign, you\
    \ have a very slim chance of winning. In the new digital economy, being technologically\
    \ savvy is as crucial as speaking fluent English was twenty years ago. In this\
    \ book, you will be given formal definitions, historical aspects, latest news,\
    \ economic prospects, career advice, and some fruit for philosophical thought\
    \ – all the necessary stuff to start on your journey to the future you belong\
    \ to.\n\n> “Simply by changing your habitual vocabulary, you can instantaneously\
    \ change how you think, how you feel, and how you live.”    \n\n\\-Tony Robbins,\
    \ motivational speaker\n\n> Chapter 1 - Age of Artificial Intelligence\n\nARTIFICIAL\
    \ INTELLIGENCE\n\nArtificial intelligence (AI) is a type of computer software\
    \ that gives computers the ability to simulate intelligent behaviour. Surprisingly,\
    \ simulated “intelli-gence” is not necessarily human-like when it comes to resolving\
    \ tasks; its potential is even greater.\n\nTo illustrate, AI defeated the Chess\
    \ and Go world champions and has since rendered humans hopeless in future competition.\
    \ The world champion of Go, Lee Sedol, was defeated by Google’s Deep Mind in front\
    \ of 200 million spectators in 2015, marking the beginning of AI technology race\
    \ between US and China. Some of the strategic moves played by AI have never been\
    \ seen in the history of these games but proved to be extremely effective and\
    \ are still studied.\n\n\"AI is more profound than … electricity or fire”\n\n\\\
    - Sundar Pichai, CEO of Google\n\nAt its current speed of development, AI will\
    \ soon outpace human performance in a variety of tasks, thus making it economically\
    \ unviable for humans to execute jobs, resulting in significant automation and\
    \ economic shifts. AI spending is expected to increase from today’s $20 Billion\
    \ to $120 Billion by 2025.\n\nMACHINE LEARNING\n\nMachine learning (ML) is the\
    \ most powerful and promising artificial intelligence technique to date. The term\
    \ is most frequently associated with AI based on Artificial Neural Networks technology,\
    \ which closely resembles the workings of the human brain. The recent ML boom\
    \ kicked off in the early 2010s, when ML based algorithms blew every other algorithm\
    \ out of the water during the worldwide visual recognition challenge. Google,\
    \ Facebook, and Amazon quickly hired top talents from ML research. Today they\
    \ infuse ML based algorithms in all of their services and operations, claiming\
    \ they have changed their business models to be AI-first companies."
