    Facial recognition (FR) involves AI that is capable of providing the identities
    of people present in a photo or video. Facial recognition can be used by a specific
    company as a security measure to prevent unwanted intruders on their premises,
    or by an entire nation as a means to oversee citizen behaviour. For example, in
    China FR is employed to prevent mass gatherings, control demonstrations, and monitor
    crime.


    # DECISION TREE


    Before the deep learning revolution, decision trees were among the most successful
    techniques for resolving classification tasks. They remain widely used for their
    transparency and reliability.


    To classify data between a given set, decision trees find particular differences
    in the data which allows for maximal class segregation. Next, decision trees branch
    out, further splitting into two classes with the process continuing until each
    data point has been classified. The endpoints of each branch are called leaves.
    If you have ever seen a tree of life model of biological evolution, you are familiar
    with the most basic branch split between eukaryotes and bacteria, then the split
    between mammals and reptiles, until eventually you come to the human, which is
    considered a leaf. This a basic decision tree structure.


    # RANDOM FOREST


    Random forest is an ensemble learning method based on decision trees.


    In a nutshell, as data grew and became more complex, it was no longer enough to
    design a single decision tree to achieve maximum accuracy in a classification
    task. As a result, computer scientists developed methods of producing anywhere
    from dozens to hundreds of decision trees with different settings, hoping that
    each will pick up something special about the data. After that, each decision
    tree provides an opinion on how it would classify the content that was asked of
    it, votes are counted, and at the end the most common opinion is established as
    the correct answer. Random forest is a very simple and democratic form of AI.


    # REGRESSION


    Regression undermines a certain property of an environment where one or multiple
    variables can explain evolution and behaviour of another variable of interest.
    Regression learning is possible only in environments that display some degree
    of order and can be statistically studied.


    For example a simple regression can model the trajectory of a cannon ball. A more
    complex regression can make a price estimator for real estate based on input properties
    like location, size, number of windows, and year of construction. It is a supervised
    learning task so AI first needs example data to train, but that is usually not
    an issue. Machine Learning algorithms are great at building regression models
    even for the most complex environments.


    Science, insurance, and supply chain are among the fields that are heavily relying
    on regression models.


