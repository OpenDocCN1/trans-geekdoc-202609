    # 现代赞歌


    > 机器学习、增强现实、大数据、量子比特、神经链接以及其他重要词汇，是时候了解它们了。

    > SATOSHI


    Copyright © 2020 版权所有。未经作者书面许可，不得以任何形式或通过机械手段（包括信息存储和检索系统）复制本书的任何部分，但评论性文章中引用的简短片段除外。本书中的信息按“原样”提供，尽管已采取一切预防措施，但作者和出版者对于因书中包含的信息直接或间接造成的任何损失或损害均不承担任何责任。平装本：979-8635


    - 标题页

    - 版权信息

    - 序言

    - 第一章 - 人工智能时代

    - 第二章 - 网络军战时代

    - 第三章 - 每个人的计算机基础

    - 第四章 - 云时代

    - 第五章 - 现实时代

    - 第六章 - 数字经济时代

    - 参考文献


    ## 序言


    现代社会第一次接触到“人工智能”这一概念大约是在二三十年前，对于很大一部分人来说，这一概念是通过《矩阵帝国》或《终结者》等电影引入的。`AI` 的概念当时似乎是科幻小说——一个领先于数百年的未来构想。那时，个人电脑刚刚开始进入普通大众家庭。互联网已经成为我们日常生活的一部分，但加载一张质量尚可的图片仍需要十分钟。尽管计算机正在席卷全球，但要将那些大型计算器与智能机器连接起来仍然是艰巨的。当时关于
    `AI` 的好莱坞电影被认为是虚构，而非纪录片。现在，在几十年后，情况似乎发生了快速变化。具有重大突破性的出版物、互联网巨头的无限赞助以及惊人的数字数据量，为一场无法预测的革命开启了大门。`大数据`和`机器学习`等术汇在新闻中随处可见，而著名的咨询公司则警告称会有大规模裁员。像`史蒂芬·霍金`这样的天才科学家曾警告过`AI
    末日`，而今天，像`埃隆·马斯克`这样的天才企业家继续担心，如果社会不认真考虑`AI 末日`的可能性，世界将会毁灭。在另一阵营，雷·库兹韦尔和马克·扎克伯格认为`AI`并不危险，相反，它将让我们生活得更好、更久。然而，在
    2008 年贷款危机和中央银行的大量量化宽松之后，我们的储蓄账户利率处于历史最低水平。大多数储蓄账户的年收益低于 1%，如果考虑到通货膨胀，这相当于亏损。公众一直担心着自己储蓄的命运，几乎没有机会喘息，更不用说跟上这十年发生的科技热潮了。也许有人成功购买了`比特币`，并希望它们没有在网络攻击中被盗。但`比特币`和整个`区块链`仅仅是
    21 世纪技术储备中的冰山一角。众所周知，我们已经将资本主义推到了仅为精英阶层服务的程度。中产阶级正在缓慢消失。从巴黎到黎巴嫩，从香港到巴西的抗议活动表明经济状况并不良好。现在，新冠肺炎（`COVID-19`）给我们的钱包带来了额外压力，有些钱包的压力更大。因此，当全球经济陷入困境时，很难抽出时间关注`计算机编程`和`统计学`等话题。但技术是重要的。技术至关重要。技术不会等待，它移动得越来越快。`机器学习`、`云`、`大数据`、`量子计算`、`增强现实`——所有这些术语都很——它们传递着变革。`勒索软件`、`间谍软件`和`计算机病毒`等同样很重要——它们传递了新网络世界中的危险。多了解它们是你通向安全生活的第一步。用了不到
    20 年，数百万马从道路上消失并被汽车取代；21 世纪的上班族可能面临同样的命运。如果你不知道如何使用`Python`来提高你的效率，你可能会被会用的人取代。在制造业、金融、创意设计、医学——任何你能说出的领域——所有领域都面临着被`AI`重新设计的可能性。即使在政治领域，如果你不使用诸如`剑桥分析`之类的分析来支持你的竞选，获胜的机会微乎其微。


    '
