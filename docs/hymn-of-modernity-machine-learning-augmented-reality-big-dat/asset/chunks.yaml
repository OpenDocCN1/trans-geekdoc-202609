    common belief that AI doesn’t recognize common human emotions such as rage, fear,
    concern, happiness, or essentially any human emotion – recognizing human emotion
    is actually one of the simplest tasks AI can learn to do.


    Today we count 27 official distinct emotions: Adoration, Aesthetic Appreciation,
    Amusement, Anxiety, Awe, Awkwardness, Boredom, Calmness, Confusion, Craving, Disgust,
    Empathetic pain, Entrancement, Envy, Excitement, Fear, Horror, Interest, Joy,
