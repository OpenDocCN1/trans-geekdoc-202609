- raw: "While it may seem like a bad idea to give into the demands of a blackmailer,\
    \ the reality is that in situations where the ransom is not paid, it usually amounts\
    \ to higher losses. For example, in 2018 the city of Atlanta refused to pay a\
    \ ransom of $51,000, which ended up costing them more than $9 Million in damages. \n\
    \nLooking for another juicy story on ransomware? Then look no longer than the\
    \ case of Eurofins. Eurofins is a large European provider of pharma, food and\
    \ environmental lab testing services, employing 45,000 people in over 800 laboratories.\
    \ Here is where it gets tricky: Eurofins also offers cybersecurity assistance\
    \ and is the UK's biggest provider of forensic services. Eurofins is used in over\
    \ 70,000 investigations each year, which includes cases of cyber forensics. Despite\
    \ being a cybersecurity service provider, their expertise in the field wasn’t\
    \ enough to save Eurofins from being a target of a catastrophic ransomware that\
    \ brought down the majority of its operations. The official ransom amount paid\
    \ to the hackers remains unknown, but it’s safe to assume that Eurofins paid no\
    \ small price to regain control.\n\nPHISHING\n\nAn imposter e-mail, marketing\
    \ campaign, or congratulatory message sent by hackers to trick their victims into\
    \ sharing personal names, credit card numbers, birthdates and other sensitive\
    \ information.\n\nChances are that at least once in your life you have received\
    \ an email congratulating you for winning a million dollars in the national lottery,\
    \ with the email correspondent kindly asking you to enter your bank account information\
    \ so that a transfer can take place. That’s phishing.\n\nMachine Learning is being\
    \ used increasingly by hackers to select the most effective campaigns. Meanwhile,\
    \ anti-spam software increasingly relies on ML to better defend its customers.\
    \ It is a cat and mouse game where the user is the coveted piece of cheese. \n\
    \nHere’s an example of a phishing email: \n\n“NATIONAL LOTTERY \n\nCustomer service\n\
    \nRef: RNXF/34548121548451\n\nCONGRATULATIONS!!!!\n\nWe are proud to announce\
    \ to you the draw of the US NATIONAL LOTTO program held on 15th of April 2020.\
    \ Your email address attached to ticket number 34548121548451 drew the lucky numbers:\
    \ 15-4-22-10-12, which entitles you to the 2nd category of prizes. Congratulations!\
    \ You have therefore been approved to claim a total sum of $760,000 (Seven Hundred\
    \ and Sixty Thousand United States  Dollars) in cash.\n\nAll participants have\
    \ been selected randomly by the courtesy of the US Government from the World Wide\
    \ Web site through a computer draw system extracted from over 100,000 companies\
    \ and small businesses, to support the economy hit by the COVID-19 crisis.\n\n\
    The winning amount would be released to you by our payment provider Worldlink.\
    \ Worldlink agents will immediately commence the process to facilitate the release\
    \ of your funds as soon as you provide them with your contact and payment details.\n\
    \nIMPORTANT: For security reasons you are requested to keep your personal and\
    \ financial information safely and to not communicate it to anyone but Worldlink’s\
    \ agent who will contact you by phone as soon as you send them your contact details.\
    \ This is also a supplementary precaution measure to avoid double claiming and\
    \ unwanted abuse of the lottery program.\n\nTo file your claim, please contact\
    \ Worldlink’s fiduciary agent Mr. Paul Smith at [richard.smith.worldlink@hotmail.com](mailto:richard.smith.worldlink@hotmail.com)”\n\
    \nWhile it may seem silly to think that anyone would fall for a scheme like this,\
    \ in reality thousands of innocent users fall victim to these kinds of phishing\
    \ schemes every year. \n\nFIREWALL\n\nA firewall is one of the most important\
    \ defence mechanisms standing between your private network and the open public\
    \ network. Essentially firewalls contain rules on who is and who isn’t authorized\
    \ to access your network.\n\nOnce the attacker bypasses the firewall, it becomes\
    \ useless and the only hope is that your anti-virus software will detect malicious\
    \ code or activity going on.\n\nThere are three major ways to defeat a firewall:\n\
    \n1.  > Go around it – most companies have large networks with lots and lots of\
    \ connections. Often not all connections get listed in a company’s IT books and\
    \ as consequence its firewall, some devices are forgotten or simply unnoticed,\
    \ such as a connection of the newly arrived printer. If a hacker finds a connection\
    \ which gives access to the network, their job is done.\n\n2.  > Sneak through\
    \ the firewall pretending you are an authorized user. Depending on the firewall\
    \ it is either easy, difficult or next to impossible. Badly configured firewalls\
    \ leave vulnerabilities that can be exploited.\n\n3.  > Take over the firewall.\
    \ Again, it depends on the firewall software; it may be easy, or it may be very\
    \ hard even for a super hacker.\n\nAs a little historical context, the first concept\
    \ of a firewall was used on trains powered by coal. In the early days of coal-powered\
    \ engines, sometimes the fire would break out beyond the engine-room and spread\
    \ to passenger compartments. In order to prevent such disasters from happening,\
    \ engineers literally started building an iron wall in the engine compartment\
    \ to prevent fire spreading to other parts of the train.\n\n“Social engineering\
    \ bypasses all technologies, including firewalls.”\n\n\\- Kevin Mitnick, most\
    \ wanted hacker of the 90s\n\nISO 27000 Series\n\nISO 27K (also known as the ISMS\
    \ Family of Standards) is a series of best practices to help organizations improve\
    \ their security measures. The advantage of every major Cloud provider over your\
    \ own IT infrastructure is that they are all ISO 27k certified. If you’re a business\
    \ that uses IT extensively in day to day operations, obtaining ISO 27K certification\
    \ or moving to the Cloud is an essential step toward ensuring a secure business\
    \ environment.\n\nCRASH PROJECT\n\nCRASH, a new system of computer network defence\
    \ that closely resembles the human immune system, is being developed by the US\
    \ Department of                 Defence. CRASH is a promising attempt to massively\
    \ improve the conventional firewall antivirus defence architecture. Inspired by\
    \ the way the human immune system wards off infections, CRASH will allow computers\
    \ to recover and repair themselves after a virus attack.\n\nAn issue with conventional\
    \ antiviruses is that new malware is very good at mutating or shutting down once\
    \ they detect an incoming virus scan. This behaviour is similar to a “free rider”\
    \ on a train, who will run and hide in the bathroom as soon as the ticket inspector\
    \ enters the compartment. With this new CRASH approach, every passenger on the\
    \ train will be visible simultaneously upon the ticket inspector’s arrival. Hence\
    \ an intruder will not be able to remain unnoticed inside the system for very\
    \ long.\n\nBIOMETRICS\n\nBiometrics is a way to securely authenticate into a computer\
    \ system, but not by using a standard password or a key, which can be copied or\
    \ discovered, instead the user is supposed to use his voice, face, fingerprint\
    \ or any other type of personal biological data to login. Biometrics work because\
    \ our biological properties are unique to us. For example, there are no people\
    \ in the world with identical fingerprints, hence allowing for a unique identification.\
    \ Even twins have different fingerprints. IPhone started to include a fingerprint\
    \ authentication option since IPhone 5S, which is a very handy option in-deed.\n\
    \nNANOTECHNOLOGY"
  fmt: "\nWhile it may seem like a bad idea to give into the demands of a blackmailer,\
