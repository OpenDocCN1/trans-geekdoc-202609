- raw: 'The need for automatic data processing came originally from the US government
    in 1890; assistance in counting and summarizing the census data of its rapidly
    growing population was desperately needed. The job was estimated to take 10 years
    to complete, which was not a viable solution due to the fact that it would overlap
    with the beginning of the next census count.


    The eventual solution came from American inventor Herman Hollerith, who had just
    patented an electric tabulating machine that could automatically process punch
    cards and output statistics. Punch cards turned out to be a huge success and reduced
    the census counting task to a mere six years. Hollerith went on to establish the
    company we know today as IBM.


    BIT


    A computer bit is the most basic unit of information in all of information theory.
    There is no piece of information of a finer granularity than a single bit. Bit
    stands for binary digit, with binary indicating only two possible values in the
    numerical alphabet: 0 or 1.


    “Bit by bit”


    –wisdom quote


    Not convinced that you can pass meaningful information using bits? Here is a Byzantine
    invention for communicating a single bit that helped the Empire last for centuries:
    A series of towers were built throughout the Empire’s territory with only one
    aim, to light up their fire if an enemy is spotted. A single bit of information,
    encoding a simple message, fire on = enemy, fire off = no enemy. In case of an
    enemy coming, fires would light up one after the other, and information would
    very quickly travel from tower to tower all the way to the capital, allowing the
    king''s generals plenty of time to prepare for defence. Genius.


    If you increase the amount of bits, you are essentially able to encode any message
    in the universe. This fact was theoretically proven in the early 1940s by Claude
    Shannon when he observed a relationship between Boolean algebra and telephone
    switching circuits. Bell Labs hired Shannon to devise the most efficient way to
    transfer information over wires. In 1948, Shannon penned A Mathematical Theory
    of Communication, essentially laying the foundation for the digital age. This
    feat earned Shannon the prestigious title, “Father of Modern Information Theory”.


    Invention of bits incredibly simplified communication methods, storage, and data
    manipulation, which is why bits became the de facto language of the classical
    computer system. And the reason classical computer systems are emphasized is due
    to the emergence of quantum computer systems. Entering the computer science arms
    race, quantum computer systems operate vastly differently from the classical systems
    – quantum systems use qubits instead of bits. But that''s a story for another
    day.


    Some maths on a classical bit: An array of 8 bits is a byte. 1024 bytes is a Kilobyte
    (Kb), and 1024 Kb is 1 Mb, and so on. Yes, in computer science bytes are multiples
    of 1024 instead of 1000. This is due to the fact that one bit stores two potential
    states – 0 and 1. Two bits stores four potential states: 00, 01, 10, 11. Three
    bits stores eight states and so forth, so at the end you have an exponential increase
    in memory in the following way: 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024.


    You understand now why all those numbers appear more frequently in the computer
    industry instead of usual round numbers – it’s because they are related to the
    amount of information that can be either stored or simultaneously handled by the
    processor.


    Super computers of the past century generally had 1 to 100 kilobytes to deal with.
    Today, we produce as much as 10 exabytes of data a day. That''s 11, 258, 999,
    068, 426, 240 kilobytes.


    ASCII


    ASCII is the international standard for character encoding in computer systems
    using 8 bits. In other words, ASCII is a table which associates every keystroke
    on your keyboard to one of the 256 different numbers possible to encode using
    8 bits.


    For example, the number 3 is encoded as 0110011 and the letter “a” is encoded
    as 1000001, and this is the case on every standard computer. Every time you type
    a letter, a corresponding sequence of bits is sent to the processor all at once
    to inform it of the inputted character. Depending on the character, the computer
    will either move the cursor or type a letter or execute a function.


    Here, encoded in ASCII, is Tolstoy''s famous quote from War and Peace, “Nothing
    is so necessary for a young man as the company of intelligent women”:


    ASCII: “01001110 01101111 01110100 01101000 01101001 01101110 01100111 00100000
    01101001 01110011 00100000 01110011 01101111 00100000 01101110 01100101 01100011
    01100101 01110011 01110011 01100001 01110010 01111001 00100000 01100110 01101111
    01110010 00100000 01100001 00100000 01111001 01101111 01110101 01101110 01100111
    00100000 01101101 01100001 01101110 00100000 01100001 01110011 00100000 01110100
    01101000 01100101 00100000 01100011 01101111 01101101 01110000 01100001 01101110
    01111001 00100000 01101111 01100110 00100000 01101001 01101110 01110100 01100101
    01101100 01101100 01101001 01100111 01100101 01101110 01110100 00100000 01110111
    01101111 01101101 01100101 01101110 00101110”


    That’s exactly how this quote is saved on your hard drive, exactly seventy-six
    times 8-bit sequences, including the dot at the end of the sequence. When you
    save this or any digital document, a mini laser creates a sequence of long and
    short magnetic bands on the hard drive, with long corresponding to a 1 and short
    to a 0. Then another laser can read it and display back on your screen when you
    browse to that location.


    HARD DRIVE


    A hard drive, sometimes called a hard disk, is an electromechanical device which
    allows massive amounts of digital data to be stored on magnetic discs. Today,
    the average personal computer hard drive stores up to multiple terabytes of data.


    A computer’s hard drive is the only reliably persistent memory storage system
    compared to other memory storages like registers and RAM, which are emptied as
    soon as they are powered off. In recent years, another type of memory has gradually
    started to replace hard drives – flash memory. However, it currently remains the
    more expensive option.


    RAM


    Besides being a major Hindu deity and the seventh avatar of the god Vishnu, RAM
    is also the second most important property of any computer, just after the CPU
    power.


    Random Access Memory (RAM) refers to the short and midterm memory of a computer.
    RAM functions while the computer is working but is fully emptied out as soon as
    the computer is turned off. So why to waste time with a memory system that can
    potentially be lost in any power outage? The answer is speed; RAM is much faster
    than hard drives and is crucial for any computer system.


    As soon as computer turns on its starts by uploading the most important data and
    programs into the RAM, to work from there rather than from the slow hard drives.
    If some of the lesser used data is needed, the computer will fetch it from the
    hard drive and upload to RAM while removing from RAM data it hasn’t been using
    recently. RAM is very expensive hence its total storage is many times smaller
    than the hard drives, which is why we can never upload everything into RAM. In
    2020 an average personal computer RAM is between 8 GB and 16 GB, while an average
    hard drive is between 512 GB and 1 Tb.


    CPU and INTEL


    The Central Processing Unit (CPU) is a powerful semiconductor chip that performs
    the role of the central orchestrator in any computer. Without a CPU there is simply
    no computer.


    A CPU is sequential; it resolves one task at a time at a very fast pace and then
    immediately moves to the next task it has in the queue.


    CPU power is doubling every two years, a phenomena which is called Moore’s Law,
    named after Intel’s co-founder Gordon Moore. Intel is the most prominent designer
    and supplier of CPU chips in the world.'
