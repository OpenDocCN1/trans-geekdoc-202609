    # 备份


    备份在警察力量和特种行动队（SWAT）中被广泛使用，它的字面意思是有人在背后支持你。然而，如今我们更多指的是数字备份——即存储在独立内存存储设备上的文件和数据副本。备份信息是降低主存储设备遭受损坏、丢失或盗窃风险的方法。在企业和机构领域，备份至关重要，因为客户数据的丢失会导致不可弥回的损害和迫在眉睫的破产。


    想象一下，如果美国银行的数据中心遭受了龙风袭击，你的银行账户会发生什么？永远丢失，连同你毕生的积蓄也一起消失？幸运的是，美国银行备份了其所有数据，并将备份存储在在全球至少三个不同的地点。所有地点都受到亚军事级安全防护的保护。


    内存存储的“圣杯”是能够备份我们整个生活的能力，以便在发生致命事故时恢复。无论好结果坏，随着目前的脑机接口研究项目，我们可能会在未来 30 年内看到这项技术的出现。


    # 服务器


    服务器是一种经过特殊软件和硬件升级的计算机，使其能够长时间运行，而不需要像普通个人电脑那样频繁关闭和重启。我们谈论的是数月无间断的工作。


    服务器是构成互联网的关键“构建块”层，使互联网能够不间断地访问。大多数服务器都有备份孪生机，因此当其中一台崩溃时，孪生服务器仍能为互联网用户提供其内容。


    # 数据中心


    数据中心是极其巨大的房间，有时甚至是整个机库，里面满了服务器。数据中心通常需要大型冰箱来保持环境冷却，因为服务器会产生大量的热量。大多数大型企业都有自己的数据中心。小型公司也经常需要数据中心，但在建立数据中心方面面临困难。


    建立数据中心是一项极其复杂的工程挑战。首先，你需要找到一个没有极端天气条件且气候足够凉爽的地区。出于显而易见的原因，该地区还需要政治稳定。一旦选定地点，就需要向数据中心拉入大量的互联网电缆和电力线，供应所有的计算硬件、存储硬件，通常还有制冷设备。然后就是连接所有机器的艰巨任务。


    一旦硬件插好，软件工程师就会介入，在所有这些机器上安装软件，包括操作系统、网络软件、驱动程序、防火墙、防病毒软件等。最后，你需要在物理上加固周边边界，并建立一个可靠的维护结构以防发生万一——而涉及到计算机时，总会出问题。此外，由于你已经知道的备份原因，必须在另一个地区建立一个几乎完全相同的数据中心副本。这还没有提到使用昂贵的本地电池和内部发电机组对电力供应进行备份。


    # 云


    云是一种商业模式，人们可以通过互联网租赁个人计算机、内存存储、数据库或整个数据中心。通过云，访客用户能够登录到租赁的机器上，并通过网络对其进行完全远程操作。


    这对于直接消费者和企业来说都是一个非常实用的工具。例如，你我可能很喜欢将文件储存在 `OneDrive` 或 `iCloud` 中，并能够从任何连接到互联网的设备访问它们。这是可能的，因为我们的数据可以存储在属于
    `Microsoft`（`OneDrive`）或 `Apple`（`iCloud`）的远程数据中心，只要我们有所需的登录凭据，任何移动设备都可以访问。


    然而，得知像你这样的零售消费者实际上只是云业务海洋中的一滴小水，这可能会让人感到自卑。最重要的云客户是各种规模的企业，从非常小的初创公司到大企业，这些公司仅仅是因为不想或没有能力建立自己的数据中心。


    云由 `Amazon` 在 21 世纪初开创，当时它已经成为地球最大的书店。为了服务其所有连接用户，`Amazon` 需要获取惊人的服务器和数据中心。然而，`Amazon`
    注意到客户对 `amazon.com` 的兴趣是季节性的。这意味着虽然有时所有服务器都以全速运行，但在其他时候，大多数服务器都处于睡眠状态。一位名叫 `Jeff
    Bezos`（杰夫·贝佐斯）的活跃商人决定，在 `Amazon` 不使用服务器的期间将其租出去是有利润的。


    由于建立数据中心是一项挑战性任务，而运营和维护更具挑战性，许多公司乐意向 `Amazon` 支付租赁其数据中心，同时由 `Amazon` 确保数据中心顺畅运行。这也让拥有强大想法的初创公司能够在
    `Amazon` 云的帮助下立即扩展。这种简单性超越了商业世界。租赁 1 台或 1,000 台服务器的过程只需几次点击即可完成，让任何拥有一台电脑和信用卡的人都能使用该系统。


    云服务迅速增长，并被分为三大类：`IaaS`、`PaaS` 和 `SaaS`。今天，2020 年，云服务器是一项 3000 亿美元的业务，预计每年增长 30%。出乎意料的是，三个主要的云提供商占据了云流量的大部分：`Amazon`
    的 `AWS`、`Google` 的 `GCP` 以及 `Microsoft` 的 `Azure`。


    “如果有人问我什么是云计算，我试着不陷于定义中。我告诉他们，简单来说，云计算是运行业务的更好方式。”

    –Marc Benioff，`Salesforce` 创始人、首席执行官兼主席


    # 软件即服务


    软件即服务 (`SaaS`) 在技术水平上被认为是最易的开箱即用服务，需要的设置最少，技术知识也最低。我们都熟悉 SaaS 服务，如 `Gmail`、`Facebook`、`Spotify`、`YouTube`、`Netflix`、`Airbnb`、`UBER`
    或 `PayPal`。所有这些都是以网页或移动应用形式销售的服务程序。


    SaaS 使用非常简单，因为不需要设置任何计算机相关的物品，无需租赁机器，无需安装软件，无需上传你的任何软件——你只需注册，在某些情况下支付费用，服务提供商将处理其余部分。大多数应用程序都从顶级云提供商处租赁云资源。以
    `PayPal` 为例，它们托管在 `Google Cloud Platform` 上。


    # 平台即服务


    平台即服务 (`PaaS`) 在技术上比 SaaS 低一级。PaaS 用户通常不是零售客户，而是希望通过云提供商运行 SaaS 的公司，例如初创公司和应用程序开发者。PaaS
    用户租赁一台预装了标准软件以满足用户需求的运行机器。例如，一台拥有 64 GB 内存、10 个并行英特尔 CPU、已安装 Windows 操作系统、防病毒软件和
    Python 语言软件的机器——在两分钟内即可完全运行。


    '
