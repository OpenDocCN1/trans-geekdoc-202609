    \ hacker of the 90s\n\n## ISO 27000 Series\n\nISO `27K` (also known as the ISMS\
    \ Family of Standards) is a series of best practices to help organizations improve\
    \ their security measures. The advantage of every major Cloud provider over your\
    \ own IT infrastructure is that they are all `ISO 27k` certified. If you’re a\
    \ business that uses IT extensively in day to day operations, obtaining `ISO 27K`\
    \ certification or moving to the Cloud is an essential step toward ensuring a\
    \ secure environment.\n\n## Crash Project\n\n`CRASH`, a new system of computer\
    \ network defence that closely resembles the human immune system, is being developed\
