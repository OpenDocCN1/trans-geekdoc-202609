- raw: 'A white hat hacker uses his advanced computer skills for solving problems,
    having good intentions in mind and operating within the law. White hat hackers
    are often hired by companies to audit internal vulnerabilities and assess potential
    security breaches.


    Hackers that specifically invited prior to a software launch for bug and security
    testing are called blue hat hackers. This term is extensively used in Microsoft.


    MALWARE


    Malware stands for malicious software, as it is a type of software written by
    hackers and transmitted to victims in order to steal information, destroy information,
    or spam/spy on other computers. Hackers can spread malware via email attachments,
    websites, USBs and more. There are plenty of different malware categories out
    there, here below are few of the most prominent ones. 


    “A ‘better’ biological virus — like a computer virus — will perhaps just make
    its host sick, but still well enough to keep spreading the virus.”


    ― Peter H. Gregory, Computer Viruses for Dummies


    Virus is one of the most primitive types of computer malware. A virus begins its
    life when an executable file to which it is attached is executed on the victim’s
    laptop. Virus code can spread to other user applications and cause mild to severe
    symptoms like data corruption, malfunctioning or network spamming. Viruses cannot
    infect other computers on their own and require infected applications to be transferred
    by the user as an attachment. Of course, this is all done without the user realizing
    that software is corrupted. Although an antivirus is a great protection against
    viruses, viruses can avoid antivirus software for long periods of time through
    digital mutation.


    The first virus was created in 1983 by a USC student for pure demonstration purposes.
    Today there are more than 100,000 different varieties of viruses, some deadlier
    the others.


    A computer worm, technically a subclass of a virus, has all of the same properties
    and functions as a virus with the exception that worms don’t need the host to
    send out infected files in order to propagate. Worms usually hijack the computer’s
    communication systems in order to inseminate on their own as fast as they can,
    which makes them extremely devastating. For example, they can send themselves
    to all the emails found in your contact list, do the same to each of the victims
    and to their victims and so on.


    The first worm, created in 1988, was able to single handedly crash 10% of the
    early internet.


    The third most common kind of computer ailment after viruses and worms, a Trojan
    horse, is perhaps amongst the most primitive, as it doesn’t replicate or reproduce,
    and strikes only once the infected program is initiated by the user. Trojan horses
    can remain undetected for long periods of time before being identified, hence
    the name.


    In case you are not familiar, this is referring to the mythical wooden statue
    of a horse that Trojan soldiers paraded into their city as a trophy of victory,
    not realizing there was an onslaught of enemies waiting inside the statue. As
    soon as the sun set, enemy soldiers broke out of the horse and forcefully opened
    the city gates, leading to the swift demise of the Troy Empire. 


    In both computer software and ancient mythology, Trojans give attackers a backdoor
    to bypass the security and overtake control. Back Orifice is a popular Trojan
    horse for Windows that does exactly that; it gives the hacker the ability to remotely
    take control of your computer.


    There is also a new breed of malware that leverages Artificial Intelligence in
    its advanced functioning. This move completely changes the cyberwar landscape,
    as the attacks can be much more targeted and pass undetected for an extended period
    of time until the exact target is reached. For example, AI malware can attach
    itself to a modern video-conferencing application and analyse camera images in
    real time. Malware will display no destructive and suspicious behaviour until
    a specific target person appears in front of the camera. AI models trained for
    facial recognition will recognize the target person and activate the malicious
    code. This type of malware can be especially damaging to the reputations of political
    and public officials by unexpectedly revealing something embarrassing about them
    in front of a massive audience.


    DDoS ATTACK


    A Distributed Denial of Service attack is one of the most common and powerful
    cyberattacks. DDoS is achieved by flooding the target''s network with large quantities
    of unwanted traffic and spam. To be successful in a DDoS attack, hackers will
    typically first need to assemble a botnet, which is an army of infected computers
    called bots or zombies, which can be activated by the hacker anytime. Most commonly,
    zombies are infected with dormant Trojan horses that can be activated upon request
    and take over the communication channel. Hackers will collect their army of malware-infected
    zombie bots for months or even years in advance, or if they need a gang of these
    zombies on short notice, they can purchase them via the Dark Web. 


    On the morning of this deadly zombie attack, the zombies will activate in unison
    and start flooding the target''s network with traffic. When done correctly, this
    will overload the target network with unwanted traffic, rendering it unavailable
    for its intended users. As a consequence, the entire network has to be shut down
    in order to fix the issue. 


    This attack most often targets official government websites and massive institutions
    that heavily rely on the stability of their network. Banks are the perfect target
    for such an attack. Compromising a banking system so that it has to shut down
    for even an hour will bring immense financial and reputational damage. For this
    reason, institutions invest millions of dollars every year to continue enhancing
    their cybersecurity to ensure their network activities are closely monitored at
    all times. 


    SPYWARE


    Spyware is a form of malware that allows hackers to spy on target computers and
    sniff out sensitive communication, passwords, credit card information, industrial
    secrets, and any other valuable data the offending party may be interested in
    acquiring.


    A common example of spyware is a keylogger, which registers every key pressed
    on the user’s keyboard upon activation. Naturally, this method is very effective
    in stealing sensitive information.


    RANSOMEWARE


    Ransomware is a type of cyber blackmail. Attackers will steal the victim''s data
    or lock the user’s computer, often leaving a single screen displayed on the computer
    with the attacker''s Payment or Bitcoin account where the victim is blackmailed
    into sending the demanded sum in order to gain back control over his computer
    and data. The malware is often well-designed – such that it is still effective
    if the user restarts their computer as it doesn’t allow the restart to remove
    the ransomware lock screen. At this point in the hostage situation, the malware
    could only be remotely disabled by either the hacker or professional anti-blocking
    software.


    Ransomware is on a steady rise in the institutional world. It is common practice
    for cyber-attackers to deny a company the ability to operate effectively until
    either the requested sum is paid or the company changes its policies. The latter
    is usually requested when attackers don’t seek a monetary reward for their interference
    but are supporting a certain ideological change.


    Ransomwares are also a very popular attack vector on local governments. Let’s
    take a look at a case study on the way U.S. cities respond to these types of cyberattacks. In
    March 2019, Jackson County of Georgia paid a ransom of $400,000 to regain control
    over its systems. Garfield County of Utah was also subject to different cyber
    ransom the month prior. '
