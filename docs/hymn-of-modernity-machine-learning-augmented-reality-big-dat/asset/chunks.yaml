- raw: 'Deep learning (DL) is the most advanced set of machine learning functions,
    consisting of an increasingly large number of interconnected artificial neural
    networks. The additional layers allow for the capturing of more information, resulting
    in a more knowledgeable AI. The higher the number of layers, the “deeper” the
    network and the deeper the expertise.


    “Artificial Intelligence, deep learning, machine learning — whatever you’re doing
    if you don’t understand it — learn it. Because otherwise you’re going to be a
    dinosaur within 3 years.”


    –Mark Cuban, Billionaire


    BIG DATA


    All Google searches, e-mails, Instagram posts, WhatsApp messages, Tweets, OneDrive
    files, iCloud pictures, Netflix movies , population tax data, people’s genome
    data – all of that staggering amount of information being produced every day,
    by every connected device all over the globe, is BIG DATA.


    “Big Data will spell the death of customer segmentation and force the marketer
    to understand each customer as an individual within 18 months or risk being left
    in the dust.”


    –Ginni Rometty, CEO, IBM


    Data has always existed; accountants have always kept records of city financials,
    scientists have kept track of experimental observations, and authors have published
    newspapers and books documenting current events. But big data only became possible
    with the introduction of revolutionary technology that allowed for inexpensive
    storage and processing of substantial amounts of information.


    Most important technological innovation igniting the big data revolution was Google’s
    2004 publication Map Reduce, which aimed at connecting many low-cost computers,
    effectively distributing work between each node. The core business of most of
    today’s internet giants like Google, Amazon, Facebook, Netflix, and others relies
    on successful handling of big data. Consequently, the first two also became major
    cloud providers, essentially renting storage space on their computers equipped
    with this technology to any business worldwide, and for a low price at that.


    To emphasize the importance of big data in the current AI boom, consider this:
    The first idea of AI, called “automata”, was introduced by the Greek philosopher
    Aristotle in 300 B.C. Centuries later, during the Renaissance, Leonardo Da Vinci
    created multiple complex engineering machines capable of operating by themselves.
    In the 1940s, English mathematician Alan Turing built on the works of the Greeks
    and pushed Artificial Intelligence Theory to definitions accepted worldwide. Turing’s
    invention of the universal machine, which was considered the first viable computer,
    would result in an unprecedented inflow of investment into the field.


    At this point, there appeared to be everything required for AI to finally emerge:
    incredible calculating power provided by IBM, powerful algorithms coming from
    neuroscience research, inexpensive electricity, two thousand years of compounded
    mechanical engineering knowledge, astonishing manufacturing facilities, and yet,
    the only Terminator walking the Earth was an Austrian-born bodybuilder. What was
    lacking? To everyone’s surprise – data! Emergence of big data is considered as
    perhaps the final essential ingredient for building AI – from there it is only
    a matter of iterations.


    Today Big Data sits within the Business Intelligence and Analytics department
    of every major corporation. And although Generally Accepted Accounting Practices
    (GAAP) do not yet permit data to be capitalized on the balance sheet, we know
    that data is extremely valuable because five of the world’s seven most valued
    companies are essentially data drive companies.


    RESPONSIBLE AI


    “If you’re not concerned about AI safety, you should be. Vastly more risk than
    North Korea.”


    –Elon Musk


    Responsible AI is a set of ethical guidelines and techniques used to audit artificial
    intelligence algorithms in order to prevent bias, malfunctioning, or evil intentions.
    This applies especially to AI algorithms used in organizations that make decisions
    regarding humans, such as court judgments, bank loan applications, and HR departments.
    Responsible AI is achieved by ensuring that the training data is both well-selected
    and unbiased and AI decisions are audited for transparency and explainability.


    NARROW AI


    Narrow AI is a type of AI that can only resolve a single task, but usually with
    the benefit of high performance. The Holy Grail of AI is Artificial General Intelligence,
    where one single artificial intellect will learn to drive a car, speak Spanish,
    advice on Law, salsa dance, and make killer mojitos. However, creating such an
    AI is extremely difficult and we remain far from it. As long as AI is able to
    perform tasks faster, cheaper, and better than humans, we don’t have to wait for
    AGI in order to begin reaping economic benefits.


    NATURAL LANGUAGE PROCESSING


    Natural language processing (NLP) is a mixed field consisting of linguistics,
    computer science, and increasingly AI, and focuses on working with language related
    tasks. Natural language processing is used by businesses for text sentiment analysis,
    text summarization, chatbot user interface, text translation, text transcribing,
    and even text generation.


    TURING TEST


    The Turing Test is a test aimed at qualifying the level of machine intelligence.
    The test was introduced by Alan Turing in his 1950 paper, Computing Machinery
    and Intelligence. His paper opens with the words: "I propose to consider the question,
    can machines think?" Because "thinking" is difficult to define, Turing chose to
    replace the question and proposed an “imitation game” – if the computer managed
    to successfully convince the interrogator of its aliveness by appearing human,
    then the machine passed the test.


    To conduct the test, a human subject talks to two partners who are either hidden
    behind curtains or set to interact via a chatroom. One subject is a machine pretending
    to be a human and the other is an actual human being. Both the machine and human
    compete in trying to fool the human judge to correctly differentiate man from
    machine. If the machine manages to trick the judge, the test is passed.


    We are very quickly approaching an AI with language abilities powerful enough
    to pass the test, which means we are indeed in very exciting times. Once AI has
    surpassed this point, a customer call centre can become fully automated, and many
    other similar types of jobs will follow suit. 


    COMPUTER VISION


    This branch of computer science is preoccupied with understanding how a computer
    can process visual media content, such as an image or a video. A deep learning-based
    AI, known as Convolutional Neural Network, launched a revolution in the field
    of computer vision in 2017 by beating human-level accuracy in object recognition
    tasks.


    One of the first fields to bet big on computer vision software was the postal
    service. Much of the research was conducted to create optical character recognition
    software for manually written addresses, which would greatly automate and speed-up
    letter and package routing. Today, computer vision applications are numerous,
    with facial recognition entering the “hype zone”, because of Big Brother initiatives
    like China’s social scorecard program.


    CLASSIFICATION


    Classification is a supervised machine learning task aimed at sorting input data
    into predefined categories. Classification is one of the most abundant and frequent
    tasks the human brain accomplishes at all times.


    Today, a deep learning model can learn to classify almost anything as accurately
    as a human. Filtering spam emails is one of the most common classification task
    examples. In fact, Google, Baidu, and Yandex employ very sophisticated AI algorithms
    to sort out spam while preserving legitimate emails.


    Another lucrative domain for AI classification task algorithms is medical imagery
    analysis. AIs are capable of diagnosing a patient based on their medical imaging
    studies better than a professional doctor at a fraction of the price.


    FACIAL RECOGNITION'
