- raw: "A pumpkin pie recipe is a good example of a day-to-day algorithm. You follow\
    \ step-by-step instructions, simply written in plain English, to complete the\
    \ task. However, most algorithms are created for computer systems and are encoded\
    \ using programming languages specifically designed for computers to interpret\
    \ and execute.\n\nAs you might imagine, algorithms are the core tool for automatically\
    \ completing a partial or full set of tasks. They are our most direct way of explaining\
    \ to a machine exactly what we want it to do.\n\nBritish scientist Alan Turing\
    \ pioneered modern computer algorithm theory. In the early part of WWII, Turing\
    \ designed an algorithm that could decrypt the supposedly uncrackable code created\
    \ by the German Enigma machine. The algorithm Turing designed for his Bombe machine\
    \ gave the Britain a key advantage in WWII.\n\nIt is important for a computer\
    \ algorithm language to be transportable, which means it must have the ability\
    \ to be executed not only on a single machine but ideally on every computer. The\
    \ most common words used to compose algorithms are: “Do until...”, “If such and\
    \ such... then do this…otherwise do this...”  Easy as pumpkin pie.\n\nAI is a\
    \ self-programmable machine, meaning it designs its own algorithms to resolve\
    \ tasks by simply observing what somebody else does.\n\nSYSTEM\n\nA system is\
    \ a set of separate entities working together to form a whole. The purpose of\
    \ such representation is to study the whole, both from the inside and the outside.\n\
    \nSystematic thinking is a hot topic in the engineering world. It allows engineers\
    \ to deconstruct complex concepts into smaller parts in order to understand their\
    \ functions. If the system is too complex from the inside, we can further divide\
    \ the parts into subsystems to study each of them individually. Nearly everything\
    \ in the universe can be thought of as a system:\n\n*   > A car is a system made\
    \ up of an engine, steering wheel, gears, and seatbelts\n\n*   > Earth is a system\
    \ of continents, oceans, winds, and living organisms\n\n*   > A human is a system\
    \ of organs, a brain, a central nervous system, bones, and muscles\n\n*   > A\
    \ government is a system of executive, legislative, and judiciary powers \n\n\
    *   > Cities are systems of local commerce, housing, and laws\n\n*   > A computer\
    \ program is a system of various algorithms executed in ordered sequence\n\n*\
    \   > Computers are systems primarily made of CPU, memory storage, and a keyboard  \
    \ (everything else is an accessory)\n\nAnything can be considered a system. We\
    \ are systems who live inside a bigger system. In order to study complex systems,\
    \ especially mechanical or economic systems, engineers and economists traditionally\
    \ draw them out on paper, with almost every system starting as a big empty rectangular\
    \ box. Then they draw inputs that go into the system from the outside world. Inputs\
    \ are followed in their journey through the system until they come out of the\
    \ system, usually in a modified form. The latter are called an output, and of\
    \ course we draw them too. This is where we reach the most interesting part –\
    \ we have now closely followed input from the moment it enters the system all\
    \ the way through its process to the output. This is what allows us to study systems\
    \ from the inside-out.\n\nSystemic thinking is an important tool in innovation\
    \ research. It allows us to mentally dismantle a product or a production process\
    \ into many parts and see which of them can be improved. Sometimes engineers employ\
    \ systemic thinking to fix problems. They may find that the expected output of\
    \ the system is either deformed or didn’t occur at all, meaning there is a block\
    \ inside the system.\n\nSystem analysis allows to understand a system in its entirety\
    \ to then replicate it by encoding into a machine the algorithm by which the system\
    \ works.\n\nCOMPLEXITY\n\nComplexity is a measure of the diverse behaviours that\
    \ a system can potentially display. The more complex the system, the more unpredictable\
    \ it becomes. However, we find a hidden sense of order and harmony in most systems\
    \ after diligently studying their behaviour.\n\nMeasuring and understanding the\
    \ complexity of tasks is crucial in computer science because it provides the primary\
    \ metric for how much computing power is required to resolve a task. As you can\
    \ imagine, depending on the nature of the task, complexity can be exactly measured\
    \ or subjectively qualified. For example, we can exactly quantify the complexity\
    \ of a task required to sort a list of a million words in alphabetical order.\
    \ However, the complexity of tasks such as creating a PowerPoint slide or writing\
    \ a poem is much more subjective. Also, tasks considered easy for humans are not\
    \ necessarily easy for computers and the other way around; some tasks require\
    \ prior experience to be resolved.\n\nWe humans often possess decades of experience\
    \ in task resolution whereas computers are just very fast calculators with no\
    \ experience. AI, however, is shifting that paradigm, emerging as computers with\
    \ experience. The more a task is reliant on experience the harder it is to judge\
    \ its complexity in mathematical terms. We hope that future AI will be as good\
    \ at solving experience-related tasks (from creating better PowerPoint slides\
    \ to more pressing problems such as protein folding control to resolve cancer)\
    \ as computational tasks. Indeed, besides the possibility of Terminator-like scenarios,\
    \ AI can also contribute to a future without disease, poverty, or suffering –\
    \ solving impressively complex problems along the way.\n\nCOMPUTER\n\nA computer\
    \ is a large calculator with attached memory storage. Computers are useful for\
    \ their capacity to run advanced algorithms, the ability to listen for commands\
    \ from various input channels, and their ability to send out commands or communication\
    \ to other computers. World’s computational capacity is doubling every two years\
    \ and is opening possibilities for resolving ever more complex tasks.\n\nFun fact:\
    \ The first electronic computer, ENIAC, weighed more than 25 metric tons and took\
    \ up 167 square meters. Your smartphone is a trillion times faster, many times\
    \ lighter, and definitely much smaller.\n\nBUG\n\nA computer bug refers to a badly\
    \ coded function in computer software. To prevent future disruptions of the services\
    \ or worse, it is essential that bugs are fixed as early as possible in the coding\
    \ process. More bugs can accumulate in a snowball effect, leading to a total system\
    \ crash.\n\nWhy a bug is called a bug? The fact is, our first computers were made\
    \ out of big electrical circuits; the interface that allowed the user to see the\
    \ results of what was happening inside their computer relay systems was a system\
    \ of rows of connected light bulbs. Literally, just a screen made of light bulbs.\
    \ A light bulb that was turned off corresponded to a 0; and if was turned on,\
    \ it corresponded to a 1. And it wasn’t just five or six light bulbs tucked inside\
    \ the computers, but hundreds upon hundreds. I’ll give you a moment to imagine\
    \ that. There was one problem, however. If one of the numerous light bulbs burned\
    \ out or the relay system inside the circuit malfunctioned, then the entire experiment\
    \ was broken and had to be restarted.\n\nIn 1947 an actual bug was caught inside\
    \ a relay system, probably attracted to the light and heat. The bug caused the\
    \ system to crash but has been successfully removed and the system was working\
    \ again. The term bug was coined.\n\nPUNCH CARD – HISTORY\n\nThe punch card was\
    \ the first standard method of storing tabular data for automatic processing.\
    \ It is an actual stiff paper card with 80 columns and 12 rows. To store information,\
    \ holes are punched in specific areas. Think of it as a table containing 12 possible\
    \ answers for 80 questions, such as marital status, age, income range, and so\
    \ on. The idea to utilize punch cards in the computer science industry came from\
    \ the textile industry’s punch cards, which added massive automation to the weaving\
    \ process decades earlier."
