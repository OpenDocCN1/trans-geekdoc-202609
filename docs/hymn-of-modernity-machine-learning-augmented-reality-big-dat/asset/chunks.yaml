- raw: 'By the way, internet browsing works more or less the same way as your local
    browsing system. Essentially every website is a folder on some remote computer.
    What you are actually doing when you visit a website is that you are visiting
    the folder where the website is located. The file called index.html, known as
    the landing page, then gets automatically displayed in your browser.


    At its surface the file system seems the same for Mac and Windows, however they
    differ greatly in the way they are saved in memory. I won’t go into it here, but
    let’s just say Windows is much more prone to viruses and data leaks contrary to
    Mac.


    5G


    The fifth generation mobile communication technology that allows for unprecedented
    bandwidth in the likes of 10 GB/s, which is enough to stream Virtual Reality of
    quality indistinguishable from the real world.


    5G is vastly more capable than its 4G ancestor, as it occupies a larger spectrum
    of frequencies allowing for more simultaneous communication channels. 


    Another peculiarity of 5G is its specially designed antennas which will supposedly
    follow users and focus energy emission towards their exact location rather than
    standard broadcasting equally distributed in the space. To achieve this goal,
    the antenna will first send a scanning array (like a sonar) to identify user location
    and then send targeted communication, making sure to not waste any unnecessary
    energy.  


    If you wonder if “you would possibly lose bandwidth when you move too fast” remember
    – data travels at the speed of light, which is a little less than 300,000 m/s,
    enough velocity to reach the moon in a mere 1.3 seconds. So naturally you will
    be easily tracked by the antenna.


    IoT


    “The internet will disappear. There will be so many IP addresses, so many devices,
    sensors, things that you are wearing, things that you are interacting with, that
    you won’t even sense it. It will be part of your presence all the time. Imagine
    you walk into a room, and the room is dynamic. And with your permission, you are
    interacting with the things going on in the room.”


    –Eric Schmidt, CEO of Google


    Internet of Things is a term which describes every possible device connected to
    the internet, from your pillow to your fridge. Even a lightbulb can now be connected
    to your phone via the internet, which makes for an easy and shock-free switch.
    Not speaking of your heating, which you can now turn on your way home.


    IoTs are making increasingly large strides in our economy as essentially every
    service provider is trying to make their products “smarter”. 


    The sudden increase in the volume of connected devices worldwide is certainly
    raising new risks with security. But fear not my friend with a smart-connected
    bathroom mirror. Companies are tossing out the big bucks to ensure their products
    do not make headlines for some notorious data leak, as their entire business reputation
    and market valuation is at stake.


    > Chapter 4 - Age of Cloud


    INTERNET


    “I mean you can learn how to build a bullet or build a gun or build a bomb on
    the Internet.”


    –Barbara Bush, First Lady


    The internet is the world’s largest single system of interconnected networks,
    computers, and mobile devices – with the single purpose of sharing communication
    and computer processing resources over distances in a secure and reliable manner.


    One hundred and sixty years ago, the first transatlantic telegram traveled from
    Britain to the United States along the first undersea wire. That telegram consisted
    of 21 words – and took seventeen hours to arrive. Although pulling such cable
    from one continent to another was an immense step forward and a true technological
    breakthrough, today, the same trip takes as little as 60 milliseconds while allowing
    for much bigger data bandwidth.


    The modern internet was established, along with the World Wide Web, in 1990. The
    internet was initially invented so U.S. Department of Defense military units and
    a few top tier American research universities could share military and educational
    information. Remember that in those times personal computers didn’t exist yet,
    and only corporations, governments, and the best educational institutions could
    afford to have a computer.


    In the absence of tiny memory sticks, transporting gigantic memory storages to
    each other was a problem, especially when many other universities joined the network
    to share and access content. Literally, a wire connected two or more computers
    together allowing one computer to access the documents stored on the file system
    of another computer. Both computers would have to be simultaneously turned on,
    of course.


    Millions of miles of thick fiber-optic cables are lying in intercontinental oceans.
    Belonging to governments, private companies, and cloud providers, those cables
    pump vast quantities of information across the planet. The McKinsey Global Institute
    reports that 543 terabits of data flew across borders every second in 2017. Interconnectedness
    of information – that is the internet.


    HTTP and HTTPS


    Hypertext Transfer Protocol (HTTP) is the standard communication protocol on the
    internet. HTTP defines the standard rules on how files can be sent in the most
    efficient and secure manner across the internet. You can think of it as a standard
    language that every resource connected to the internet understands.


    HTTPS is a more modern version which also ensures that all data being communicated
    on the internet is encrypted, rendering it more secure.


    BANDWIDTH


    Bandwidth is the maximum amount of data that can be transferred or consumed over
    a given period of time. Previously, internet cables were made of copper and information
    travelled in the form of electricity, enabling up to 100kb/s bandwidth. Most internet
    providers have since switched to optic fibre, which transports information in
    the form of beams of light, enabling 1-10 Mb/s bandwidth on average. This is enough
    to download a high-quality movie or TV show in less ten minutes, a huge advantage
    over past eras when it took on average ten minutes to display a single image of
    Pamela Anderson on your screen, and you could literally see pixels slowly unrolling
    on the screen from up to down. Goodbye pixelated Pamela, hello Westworld. 


    It may feel a little challenging to imagine, but in reality there is nothing mysterious
    about bandwidth. Just like a gas pipeline, data bandwidth is limited to the size
    of the pipe. And just like a gas, data can be compressed; the more you compress
    it the more you can transport.


    WEB


    World Wide Web, or www, is a standard structure of information organization on
    the internet. Here’s how it works: Each resource accessible on the web is given
    a unique www address, also known as an IP address, such as 191.255. 66.102. This
    address actually directs you to the country, then to the region, and finally to
    the actual physical address of the computer or server on which the desired resource
    you are seeking is stored. Original IP addresses are hard to remember, but thanks
    to the DNS system, important ones are translated into easy to remember domain
    names like “google.com.”


    The web system happened to be a delightful way to use the internet and effectively
    launched the e-commerce boom. Today, almost every transaction in the world goes
    through the internet one way or another. From ordering books on Amazon, to watching
    movies on Netflix, to swiping your credit card in Walmart, the internet is the
    consistent middle man.


    “The Internet is the easiest thing to get into. To be an Internet retailer, you
    just get that URL.”


    –Bill Gates


    BACKUP'
