    # 仿真

    仿真在物理环境中可以存在且确实存在。但它通常指的是一种虚拟环境，旨在以实验的方式复制现实生活事件。仿真的意义远超游戏，它是对化学反应、物理事件甚至人类决策过程进行虚拟实验的强有力工具。经济学家使用仿真来预测市场，生物信息学家使用仿真来加速药物发现，而汽车制造商则使用仿真来制造空气动力学汽车。


    > “偶尔，我们在《无谣者》中遇到一些想要测试的故事，这些故事需要使用猪尸体来模拟人类生理学。”


    – 杰米·海尼曼


    仿真越来越多地被用人工智能的训练环境。就像你在现实世界尝试之前可能会在脑海中视觉化新的柔道动作一样，AI 代理在地面测试之前首先会在虚拟环境中进行训练。


    现代数字模拟器在模拟物理方面远优于人类大脑，因此能提供更好的结果。事实上，使用数字软件模拟现实事件变得越来越准确，很快仿真将与现实无二致。这将产生一系列强大且极其博学的
    AI 代理。想象一下，如果你有机会过 1000 生，并且可以将每一生的所有经验积累到下一种人生中。那么你第 1001 个版本的自己将就像兰波之于孩子一样。


    # 优化

    优化是寻找问题最佳解决方案的方法。正如你想象的，解决每个问题都有无限种方法。某些方法可以得出解决方案，而另一些则没有方案。解决方案在性能规模上也有不同，例如是否需要资金来解决问题，或者时间是否是最终资源。通常，最快且最便宜的解决方案被认为是胜者。


    如果一个问题很容易且存在于简单的环境中，我们通常可以找到“显而易见的解决方案”。但考虑一下一个复杂问题的行动计划，例如以最快的速度递送城市里的每一个邮包。这样一个困难的问题确实有数百万种解决方案——准确地说，有数十万亿种可能的解决方案。没有明显的单一解决方案，因此看起来你必须尝试所有它们。


    ## 迭代改进的过程

    但等一下，你没有时间尝试所有的。那么，你该怎么办？你是否尝试看看能否通过一个快速、简单的动作消除一大块潜在解决方案？答案总是“是”。你通常会尝试一种解决方案，然后尝试添加或删除该方案的某小部分，用看起来更好的方案替换它，并继续这种模式，直到你达到一个无法再改进的解决方案。当你达到任何进一步的增加或减少只会让问题变得糟糕的程度时，你就知道你优化了一个问题。


    简单来说，优化是在困难处境中达成“折中方案”的技术。与往常一样，在一个优化问题中，许多方都会寻求蛋糕最大的部分，并有特定的理由来证明他们的需求。正如你所想象的，用数字量化问题具有挑战性，但这正是在初步阶段采取优化方法的功能所在。


    客户通常想买便宜的；企业通常想卖昂贵的；而且无疑，双方都会为了自己的观点战斗到死。最后，自然会优化。


    # 遗传算法

    遗传算法是一种用于成功解决优化任务的机器学习技术。遗传算法易于设置且在处理上很直观，因为它们深受达尔文进化论和自然选择概念概念的启发。


    遗传算法从对给定问题初始化一组随机解决方案开始。根据预定义的标准，选择最佳解决方案集并成为父代。父代解决方案以各种方式融合，产生下一代可能的解决方案。在这个过程中，一些“后代”解决方案将接受此地各处的随机微调，使其略微偏离父代，这一过程被称为突变。一旦创建了新的解决方案群体，它们将再次根据定义的标准进行评估，并将优越的解决方案选为下一代的父代。只要每一代表现都比前一代好，优化过程就会持续。在不再看到改进的点上，我们到达了最优解。注意，这不一定是全局最优状态，但与大多数其他解决方案相比，它绝对是一个好得多的解决方案。


    # Python

    除了是一条来自东南亚的巨大可怕的蛇之外，正如你所知，Python 也是一种编程语言。最近，Python 语言在企业界引起轰动。许多 Excel 用户担心自己可能被
    Python 专家所取代。通过 Python，你可以轻松地自动化任务，而且 Python 是设计和训练人工智能的默认语言。


    Python 是 90 年代初开发的基于 C 语言的编程语言，正成为所有数据任务日益受欢迎的工具。即使是最大的投资银行，如高盛和摩根大通，也正在积极招聘数百名
    Python 程序员来管理他们海量的数据。


    Python 的主要优势是其语法相对轻量；它绝对是最容易学习的编程语言之一。在不到一个月的时间里你就可以完全投入工作，尽管这需要多年才能精通。


    # 分析

    > “在营销分析专家手中的客户数据是 21 世纪最有效的武器”


    – Matviy Kruglov，Salesforce 销售主管


    分析是一个处理收集、处理和解释数据的领域旨在提取并传播有用的见解。如果材料是纸质的，分析任务手动完成。如果数据是数字化的，可以通过 `Excel`、`SQL`、`Python`、`Qlik`
    和 Tableau 等分析工具完成。分析嵌入在业务的所有方面，旨在通过从事实数据或反馈分析中得出结论来提高业务性能。分析团队通常位于公司的商业智能（BI）部门。


    ## 第二 章 - 网战时代


    ### 隐私

    隐私是政治和计算机科学之间共享的多用途实践，旨在确保公民的私人数据安全且匿名。这在涉及高度敏感个人数据（如医疗记录、上网历史或信用卡详情）时尤为重要。


    > “我不喜欢分享我的私生活……如果分享了，它就不是隐私了。”


    – 乔治·克隆尼，演员


    ### GDPR

    通用数据保护条例 GDPR 是一项关于客户、员工和公民数据保护的新执法指令和正式规则列表。GDPR 由欧盟发布，并于 2018 年 5 月 25 日实施，作为
    1995 年发布的第一部数据保护法的新版本。


    GDPR 从开始就被极其严肃地对待。这种严谨性可能是由于违规罚款被设定为 1400 万美元或总收入的 4% 等高昂价格，以金额较高者为准。


    除了赋予客户访问自己的数据或要求被“遗忘”的权利外，GDPR 还监管了涉及人类决策的自动化算法决策，强制公司在循环中加入人员监督。这在涉及社会分配、职位审查和医疗诊断时避免程序化的算法偏见尤为重要。公司还被强制加密用户数据并不惜代价地保护它。


    '
