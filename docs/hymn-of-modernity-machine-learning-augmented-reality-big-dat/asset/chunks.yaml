- raw: 'VR is poised to change the gaming industry, education, e-commerce, and communication.
    Although VR quality has massively improved in recent years, unfortunately most
    innovations were in the visual environment. The VR experience representing other
    human senses and perception is lagging behind. Until we can smell and feel, in
    addition to seeing and hearing, we won’t be able to truly experience VR.


    AUGMENTED REALITY


    Augmented reality (AR) is specially designed computer hardware and software aimed
    at enhancing a user’s experience with a superimposed computer interface. The most
    common AR example is ‘smart glasses’ which can recognize objects and display information
    on the transparent screen located inside the lenses. For example, a person can
    be walking around a museum wearing AR glasses and an artwork’s description, with
    contextual information, can appear on the lenses. Or you could be a soldier on
    the battlefield and your AR glasses could indicate the specs and weakness of the
    enemy tank approaching you. AR is basically Iron Man helmet display stuff.


    “There are a lot of issues that it opens up like for example who is allowed to
    place an augmented reality object where. Can someone from Burger King walk into
    a McDonald’s and place a Burger King ad there? What are the rules? It’s a whole
    new kind of field of consideration.”


    \-Scott Belsky


    Just like VR, AR is having difficulties penetrating the consumer market at this
    stage. But that can change at any time – as quickly as the appearance of the iPhone
    pushed Nokia out of business. Intel and Qualcomm are expected to go toe to toe
    in what appears to be a high-stakes battle over AR/VR and AI supremacy.While Intel
    is set to sponsor the 2024 Olympic Games and will provide exclusive VR apps to
    users worldwide, Qualcomm was going to be acquired by Broadcom for 117$Billions,
    but it was blocked by Donald Trump for security reasons.


    HOLOGRAM


    A hologram is a device capable of displaying 3D objects without the need of a
    VR or AR wearable. The hologram experience resembles 3D cinema technology except
    that you don’t need to wear 3D glasses.


    Illusion is possible thanks to the physical phenomena of diffraction, creating
    a three-dimensional light field that gives the projected image a sense of depth.
    Products like Microsoft Hololens, which combines AR and hologram technology, are
    currently available, but their lofty price is a big stopper for penetrating consumer
    and business markets.


    ALLEGORY OF THE CAVE –   PHILOSOPHICAL STORY


    Plato’s Allegory of the Cave, composed in 520 A.D., is an educational and deeply
    philosophical little story that touches on how reality is perceived differently
    by each creature. In summary, Plato describes a group of prisoners who were captured
    and locked in a cave all their lives. The prisoners have never been outside the
    cave and are not even aware of its existence, since all of their lives they were
    forced to stare into the cave wall in front of them. Occasionally, shadows appeared
    on the wall along with sounds. The shadows were the visitors passing in front
    of the cave but never entering the prisoner''s area. One day one of the prisoners
    managed to break out, but as soon as he stepped out of the cave, he was blinded
    by the shining sun. After some time his view adapted and he could see colors and
    even his own reflection in water. He was so shocked he couldn’t believe what he
    saw. The prisoner ran back inside to tell the story about the weird reality happening
    outside the cave. Of course, no one believed him, called him crazy, and told him
    to go away with his foolish stories.


    In this allegory, Plato pointed to the fact that we all live like those prisoners,
    mistakenly believing that we know life, while the reality is much more complex
    and complicated. Plato’s work was visionary, for centuries later we discovered
    that Earth is not the center of the universe, that there are unobservable creatures
    like bacteria, and that what we see is only the daylight but in reality light
    has a much broader spectrum allowing some animals to even see at night.


    Thanks to the scientific community, hopefully today we are more humble about claiming
    that we know what reality is. After having our minds opened more than once, thanks
    to some new reality opening device such as VR or AR, we are becoming more accepting
    of the possibility that there is much more going on outside our caves than we
    know.


    As AI keeps getting smarter, chances are it will help us to discover new and previously
    unimaginable frontiers of the Universe.


    "All great Acts of Genius began with the same      consideration:


    Do not be constrained by your present reality."


    \-Leonardo Da Vinci


    THE MATRIX                                                  – MEDIA CULTURE


    Scripted by the Wachowskis and released in 1999, The Matrix is an iconic fiction
    film depicting a dystopian future. Deeply philosophical and at the same time filled
    with action scenes, The Matrix tells the tale of the last human survivors of the
    Artificial Intelligence apocalypse and their struggle to save Zion, the last human
    city.


    “We need guns. Lots of guns”


    –Neo, The Matrix


    The survivors are driven by a prophecy that Neo will save them. The problem is
    that Neo is imprisoned in the virtual world known as The Matrix, created by AI
    to sedate human minds while using their bodily resources.


    The Matrix became an iconic film due to its provokingly plausible apocalyptic
    scenario. The movie Terminator is also iconically futuristic, but falls short
    due to employing a time travelling device which is physically impossible. The
    Matrix features nothing that goes against the laws of physics. Moreover, many
    hi-tech entrepreneurs think that the number of revolutionary technologies appearing
    in the movie are reachable within our lifetime. Now The Matrix has jokingly evolved
    from the fictional film genre to ‘documentary’.


    The film’s title refers to the digital world simulated on the central server run
    by AI. The word matrix is borrowed from mathematics, where matrix is one of the
    most widely used objects to store and process numbers in a table-like manner.
    Matrixes are extensively used in mechanics, robotics, computer graphics, simulations,
    and machine learning training. In fact, a machine learning model is nothing more
    than a long series of interconnected matrixes which together simulate an artificial
    brain.


    Thanks to The Matrix and Terminator, the wider public is becoming more aware of
    the potential dangers of AI. AI is spiking an increasing number of critical discussions
    that affect our planet. Some discussions have led to worldwide agreements on the
    abolition of AI in the weapons industry. These continuing discussions are important
    because AI funding will only be accelerating and capitalists see great profit
    potential in AI-based automation.


    NEURALINK


    Neuralink is a company initiated by serial tech entrepreneur Elon Musk. Aim of
    Neuralink is to create a seamless interface between the human brain and a computer,
    just like in The Matrix. Neuralink technology is intended to massively empower
    human thinking abilities, helping us compete with increasingly smart artificial
    intelligence.


    Although we are already using computers to empower our calculating and working
    capacities, Elon Musk has pointed to the issue of the low bandwidth of communication
    between humans and machines. Typing on keyboards and clicking on a mouse are very
    slow processes – you can at best enter a few keystrokes per second.


    In order to overcome the limitation and make the interaction quicker, Neuralink
    technology intends to connect computers through tiny electrical wires directly
    to the neurons inside our brains. In July 2019, Neuralink announced that the brain
    sewing machines and the electrodes are ready. The company now awaits FDA approval
    to allow human trials.


    Such technology shall also allow us to back up our entire memories on computer
    storage, and further open gates toward the immortality agenda.


    MARS 2022'
