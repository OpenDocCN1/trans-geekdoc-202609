- raw: 'For illustration purposes here is an official extract from GDPR on the subject
    of algorithmic decision making:


    REGULATION (EU) 2016/679 OF THE EUROPEAN PARLIAMENT AND OF THE COUNCIL


    of 27 April 2016 on the protection of natural persons with regard to the processing
    of personal data and on the free movement of such data, and repealing Directive 95/46/EC
    (General Data Protection Regulation)


    Extract from Clause (71)


    “The data subject should have the right not to be subject to a decision, which
    may include a measure, evaluating personal aspects relating to him or her which
    is based solely on automated processing and which produces legal effects concerning
    him or her or similarly significantly affects him or her, such as automatic refusal
    of an online credit application or e-recruiting practices without any human intervention.”


    CYBERSECURITY


    “Information is the oxygen of the modern age.


    It seeps through the walls topped by barbed wire,


    It wafts across the electrified borders.”


    \-Ronald Reagan, US president


    Cyber security or computer security, sometimes called network security, is a branch
    of computer science focusing on the privacy and safety of interaction in the cyber
    space. Cyber security research focuses on testing and designing ways to better
    secure systems and devices from unwanted intruders. Cyber security consultants
    focus on advising corporations and governments on the best practices to ensure
    their company’s network is secure and their data is protected. 


    Computer security historically is organized around three aspects: confidentiality,
    integrity and availability. On the other side, the cyber-attacks generally aim
    at infiltrating systems and stealing, altering, or destroying sensitive information.
    Cyber criminals often have even more threatening agendas in mind, such as extorting
    money, committing industrial espionage, or creating large-scale propaganda campaigns.
    And strangely for these online assailants, sometimes it’s just for fun. 


    There has also been an ongoing cyber war on an international scale, with countries
    like China, the U.S., Iran and Russia topping the lists of cyber scandals. Although,
    naturally, each is consistent in denying their own involvement. We have seen no
    shortage of nationwide attacks in recent years, such as the Stuxnet attack, when
    hackers introduced malicious code into Iranian nuclear facilities, effectively
    throwing their nuclear development programs years backwards. Or take for example
    the alleged hacking of the 2016 U.S. presidential election, where Russians were
    accused of utilizing Artificial Intelligence to artificially boost Donald Trump’s
    campaign in an effort to avoid a Hillary Clinton presidency. 


    While some cyber-attacks are being done with malicious intent, you may be surprised
    to learn that many of these online attacks are done by the hands of purely curious
    teenagers experimenting with manipulating the intricacies of computer networks.
    A notable example of this is the 2000 Distributed Denial of Service attacks launched
    by a 15 year old Canadian boy which targeted a number of influential international
    commercial websites including Amazon, eBay, CNN and Yahoo. And surprisingly, the
    DDoS attack worked. The total bill for the damages amounted to no less than $1.2
    billion dollars. The teen was dubbed       “MafiaBoy” for his viral transgression
    and sentenced to eight months in open custody, with his juvenile status helping
    avoid serious jail time. 


    Currently, the hottest ongoing topic on the cyber research front is cyber cryptology,
    which is a purely mathematical problem that can undermine even the most modern
    internet security. Every important line of internet communication is encrypted
    so that an intruder who attempts to spy on network communications between a sender
    and receiver will not manage to read the messages he intercepts unless he has
    access to the user’s password. 


    However, intruders have become crafty with their trickery, often using tactics
    like pretending they are your system administrator and requiring you to change
    your password on the basis of a recent hacking and ask you to click on a certain
    link. As expected, this fake link will direct you to a fraudulent web page that
    allows the hacker to capture your security information. 


    NSA


    The National Security Agency is the largest intelligence agency in the United
    States Department of    Defence. Yes, you heard that right. They heard that right
    too, because of course, they’re probably listening right now. Why? Allegedly to
    protect the innocent taxpayers from the bullies.


    The NSA began as a bureaucratic unit tasked with deciphering enemy communications
    in WWII, which in simpler terms means gathering a bunch of maths enthusiasts and
    throwing them into the world of foreign relations. Truman made this task-force
    official in 1952 as the primary agency responsible for monitoring communication
    of domestic and foreign targets as part of central intelligence.


    Today NSA employs not only mathematicians who create the ciphers but also the
    hackers who test them. NSA also employs hackers to establish surveillance systems
    inside and outside the country. Some of the hackers are graduates from top computer
    science universities like Stanford, others are ex-criminal hackers who have been
    caught but then offered the chance to collaborate, in exchange for a reduced prison
    sentence.


    NSA made big headlines in the late 90s when much of the internet was still considered
    to be a virtual Wild West. As time went on into the 2000s, the NSA fell out of
    the public eye up until 2013, when a former NSA contractor Edward Snowden testified
    in the Supreme Court and revealed entire schemes of spying and secretive surveillance
    that the NSA was using to listen in on both domestic and foreign officials.


    All things down, you and I usually benefit from the NSA more than we care about
    what they do with our data. Without the NSA the internet would become a dangerous
    place and would probably disappear. However not all artificial intelligence researchers
    would agree.


    “I am scared that if you make the technology work better, you help the NSA misuse
    it more. I''d be more worried about that than about autonomous killer robots.”


    \- Geoffrey Hinton, Deep Learning pioneer


    PROJECT ECHELON


    Project ECHELON was originally a secret government surveillance program created
    in the 1960s, an operation used by the United States, UK, Australia, Canada and
    New Zealand to spy on the Soviets.


    By the end of the 20th century, ECHELON had evolved beyond its military and diplomatic
    purposes and grew into a global surveillance tool used by the NSA. Edward Snowden’s
    whistleblowing revealed further details about the massive scale of ECHELON operations.


    Britain''s The Guardian referred to ECHELON as a global network of electronic
    spy stations that can eavesdrop on telephones, faxes and computers. It can even
    track bank accounts. This private information is stored in Echelon computers,
    which has the capacity to hold millions of records on individuals. However, in
    an official capacity, Echelon doesn''t exist.


    SOCIAL ENGINEERING


    Social engineering is a hacking technique which takes advantage of the weakest
    chain in modern cybersecurity systems, which of course will always be the individual
    using it. Social engineering hacking doesn’t look for mathematical weaknesses
    of security algorithms but studies the ebbs and flows in human behaviour and logic.
    Although a company’s firewall might be incredibly secure, all it can take to inject
    a lethal virus is an employee curious enough to stick a USB he found lying around
    into his work laptop.


    Hackers that become masters of social engineering are amazing con artists with
    strong technical skills and excellent emotional intelligence. They can easily
    place a call under the guise of being a new pet food campaign, claiming that all
    you need to do in order to qualify for a free sample is to give your name, address
    and your dog’s name.'
