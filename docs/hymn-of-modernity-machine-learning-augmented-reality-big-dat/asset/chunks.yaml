  trans: '

    深度学习（DL）是一系列最先进的机器学习功能，由数量日益增加的相互连接的人工神经网络组成。额外的层允许捕捉更多信息，从而产生更具智能的 AI。层数越多，网络就越“深”，专业知识也越深厚。


    “人工智能、深度学习、机器学习——无论你在做什么，只要你不理解它们，就去学习它们。否则，你将在 3 年内变成恐龙。”


    – 马克·库比马克（Mark Cuban），亿万富翁


    # 大数据


    所有的 Google 搜索、电子邮件、Instagram 帖子、WhatsApp 消息、推特、OneDrive 文件、iCloud 照片、Netflix 电影、人口税收数据、人类基因组数据——全球每个联网设备每天产生的这些惊人信息，都是**大数据**。


    “大数据将意味着客户细分的终结，并迫使营销人员在 18 个月内将每个客户视为一个个体，否则将面临被淘汰的风险。”


    –吉尼·罗梅惠蒂（Ginni Rometty），IBM 首席执行官


    数据一直存在；会计师一直在记录城市财务状况，科学家一直在跟踪实验观察结果，作家们一直在出版记录时事的报纸和书籍。但只有在引入了革命性技术，允许廉价地存储和处理海量信息，大数据才成为可能。


    引发大数据革命的最重要技术创新是 Google 在 2004 年发表的 `Map Reduce`，它旨在连接许多低成本计算机，有效地在每个节点之间分配工作。今天大多数互联网巨头（如
    Google、Amazon、Facebook、Netflix 等）的核心业务都依赖于对大数据的成功处理。因此，前两家公司也成为了主要的云服务提供商，本质上是将其配备了该技术的计算机的存储空间租给全球任何企业，而且价格非常低廉。


    为了强调大数据在当前 AI 热潮中的重要性，请考虑这一点：AI 的第一个概念被称为“自动机（automata）”，是由希腊哲学家亚里士多德在公元前 300
    年提出的。几个世纪后，在文艺复兴时期，列奥纳德·达·芬奇创造了多台能够独立运行的复杂工程机器。20 世纪 40 代，英国数学家艾兰·图灵（Alan Turing）在希腊人的著作基础上，将人工智能理论推向了全球接受的定义。图灵发明的通用机器被认为是第一台实行的计算机，这导致了该领域前所未有的投资流入。


    此时，AI 似乎具备了最终出现所需的所有条件：IBM 提供的惊人计算能力、来自神经科学研究的强大算法、廉价的电力、两千年的复合机械工程知识、惊人的制造设施。然而，地球上行走的唯一“终结者”却是一个出生于奥地利的健。。缺少了什么？令所有人惊讶的是——数据！大数据的出现被认为是构建
    AI 的最后的关键要素——从那里开始，只是迭代的问题。


    今天，大数据位于每家大企业的商业智能和分析部门。尽管通用接受会计原则（`GAAP`）尚未允许在资产负债表上将数据资本化，但我们知道数据极具价值，因为世界上价值最高的七家公司中有五家本质上是数据驱动型公司。


    # 负责任的 AI


    “如果你不在 AI 安全，你就应该关注。它的风险比朝鲜大得多。”


    –埃隆·马斯克（Elon Musk）


    负责任的 AI 是一种用于审计人工智能的伦理准则和技术。


    # 弱人工智能


    弱人工智能（Narrow AI）是一种只能解决单一任务的 AI 类型。然而，创建这样的 AI 是极其困难的。


    # 自然语言处理


    自然语言处理（`NLP`）是一个由语言学、计算机科学和日益增长的 AI 交叉领域，专注于处理语言工作。


    # 图灵测试


    图灵测试是一种衡量机器智能水平的测试。该测试由艾兰·图灵在他 1950 年的论文 `Computing Machinery and Intelligence`
    中提出。为了进行测试，人类受试者与两个伙伴对话，这两个伙伴要么躲在帘后，要么通过聊天室互动。其中一个是一个假装成人类的机器，另一个是真实的人。如果机器成功骗过了裁判，则通过测试。

    '
