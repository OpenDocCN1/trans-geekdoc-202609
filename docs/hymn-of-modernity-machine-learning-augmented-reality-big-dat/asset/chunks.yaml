- raw: 'Backups are widely used in police forces and SWAT teams, it is literally someone
    who has your back. Nowadays, however, we most often refer to digital backups –
    copies of files and data that are archived on a separate memory storage. Backing-up
    information is a way to mitigate the risk of damages, loss, or theft of the primary
    memory storage. Backups are crucial in the corporate and institutional worlds,
    where the loss of client data can lead to irreparable damage and imminent bankruptcy.


    Just imagine if Bank of America’s data center was hit by a tornado. What would
    happen to your bank account? Lost forever, and along with it your entire life
    savings? Fortunately Bank of America backs up all its data and stores the backups
    in at least three different locations around the globe. All of the locations are
    protected with sub-military grade security.


    The Holy Grail of memory storage would be the ability to back up our entire lives,
    which could be restored in the case of a fatal accident. For better or worse,
    with current computer-brain connection research projects, we could see this technology
    emerge within the next 30 years.


    SERVER


    A server is a computer which is upgraded with special software and hardware that
    gives it the ability to run for long periods of time without the need to be shut
    down and restarted like a normal personal computer. We are talking about months
    of work with no interruption.


    Servers are the crucial ‘building block’ layers that make up the internet and
    allow it to be accessible without interruption. Most servers have backup twins,
    so in case one of them crashes, the twin server should still be able to serve
    its content to internet users.


    DATA CENTER


    Data centers are extremely large rooms, sometimes even entire hangars, filled
    to the brim with servers. Data centers often require big refrigerators to keep
    the place cool as servers produce a lot of heat. Most big corporations have their
    own data centers. Smaller corporations also often need data centers, but struggle
    to set them up.


    Setting up a data center is an extremely complex engineering challenge. First,
    you need to find a region which is free of extreme weather conditions and preferably
    has a sufficiently cool climate. The region should also be politically stable,
    for obvious reasons. Once the place is selected, one needs to pull huge amounts
    of internet and electricity cables to the data center, supply all the computing
    hardware, storage hardware, and usually, refrigeration machines. Then comes the
    daunting task of connecting all the machines.


    Once the hardware is plugged in, software engineers come in to set up software
    on all those machines, including operating systems, network software, drivers,
    firewalls, antivirus, and more. And finally, you need to physically secure the
    perimeter and set up a reliable maintenance structure in case something goes wrong
    – and when it comes to computers – something always goes wrong. In addition, for
    backup reasons that you already know, an almost identical copy of the same data
    center must be set up in a different region. Not speaking of backing up electricity
    supply with expensive local batteries and in-house generators.


    CLOUD


    Cloud is a business model in which one can rent out a personal computer, memory
    storage, database, or an entire data center over the internet. With cloud, a guest
    user has the ability to log into a rented machine and fully operate it remotely
    over the web.


    This is a very useful tool for both direct consumers and businesses. You and I,
    for instance, may enjoy having our files tucked away in OneDrive or iCloud with
    the ability to access them from any device that is connected to the internet.
    This is possible because our data can be stored in a remote data center belonging
    to Microsoft for OneDrive or Apple for iCloud, both of which are accessible by
    any mobile device, assuming we have the required login credentials.


    However, it may be humbling to learn that retail consumers such as yourself are
    in reality, just a tiny drop in the sea of the cloud business. The most important
    cloud clients are businesses of every stature, ranging from very small startups
    to the largest corporations who simply didn’t want or didn’t have the capacity
    to set up their own data centers.


    Cloud was pioneered by Amazon in the early 2000s, when it had already become the
    Earth’s Biggest Bookstore. In order to serve all of its connected users, Amazon
    needed to acquire a staggering number of servers and data centers. However, Amazon
    noticed that customer interest in amazon.com was seasonally-based. This meant
    that while sometimes all servers were running at full speed, there were other
    times when the majority of servers were sleeping. A living business machine, by
    the name of Jeff Bezos, decided that it could be profitable to rent out his servers
    during the periods when Amazon wasn’t using them.


    Because setting up a data center is a challenging task, and even more challenging
    to operate and maintain, many companies were more than happy to pay Amazon a fee
    to rent its data center while Amazon ensured the data center ran smoothly. This
    also allowed startups with strong ideas to scale up instantly with the help of
    Amazon’s cloud. The simplicity transcended the business world. The process of
    renting 1 or 1,000 servers was achieved by a few clicks, making the system accessible
    to anyone with a single computer and credit card.


    Cloud offerings grew quickly and are classified in three major groups: IaaS, PaaS
    and SaaS. Today, in 2020, cloud servers are a 300 billion dollar business and
    are expected to keep growing annually at 30%. Unsurprisingly, three major cloud
    providers account for the majority of cloud traffic: AWS by Amazon, GCP by Google,
    and Azure by Microsoft.


    “If someone asks me what cloud computing is, I try not to get bogged down with
    definitions. I tell them that, simply put, cloud computing is a better way to
    run your business.”


    –Marc Benioff, Founder, CEO, and Chairman of Salesforce


    SOFTWARE as a SERVICE


    Software as a Service (SaaS) is considered the most accessible out-of-the-box
    service, requiring the least setup and least technical knowledge to use. We all
    are familiar with SaaS services such as Gmail, Facebook, Spotify, YouTube, Netflix,
    Airbnb, UBER, or PayPal. All of those are Software as a Service programs, sold
    in the form of web pages or mobile applications.


    SaaS is extremely simple to use, as there is no need to set up anything computer
    related, no renting a machine, no installing software, no need to upload any of
    your own software – you just sign up, and in some cases pay a fee, and the service
    provider will manage the rest. Most of those applications rent cloud resources
    from one of the three top cloud providers. In the case of PayPal, for example,
    they are hosted on Google Cloud Platform.


    Many SaaS providers rely on machine learning in either one or many aspects of
    their operations. Easy examples are Facebook and YouTube. In order to keep running
    according to their content guidelines, they need to ensure that the content is
    appropriate. But as they literally have Terabytes of new incoming data at all
    times, no human workforce could potentially review all of it. This is where AI
    police algorithms are increasingly used to automatically scan and filter sensitive
    content.


    PLATFORM as a SERVICE


    Platform as a Service (PaaS) is one level below SaaS on a technical level. PaaS
    users are usually not final retail customers, but are typically companies wishing
    to run their SaaS via a cloud provider, like startups and application developers.
    The PaaS user rents out a fully operational machine with pre-installed standard
    software designed to satisfy the user''s needs. An example would be a machine
    with 64 GB of RAM, 10 parallel Intel CPUs, an installed Windows OS, an antivirus,
    and a Python programming language software – fully operational in just two minutes.'
  fmt: '

    # Backups


    Backups are widely used in police forces and SWAT teams, it is literally someone
    who has your back. Nowadays, however, we most often refer to digital backups –
    copies of files and data that are archived on a separate memory storage. Backing-up
    information is a way to mitigate the risk of damages, loss, or theft of the primary
    memory storage. Backups are crucial in the corporate and institutional worlds,
    where the loss of client data can lead to irreparable damage and imminent bankruptcy.


    Just imagine if Bank of America’s data center was hit by a tornado. What would
    happen to your bank account? Lost forever, and along with it your entire life
    savings? Fortunately Bank of America backs up all its data and stores the backups
    in at least three different locations around the globe. All of the locations are
    protected with sub-military grade security.


    The Holy Grail of memory storage would be the ability to back up our entire lives,
    which could be restored in the case of a fatal accident. For better or worse,
    with current computer-brain connection research projects, we could see this technology
    emerge within the next 30 years.


    # Server


    A server is a computer which is upgraded with special software and hardware that
    gives it the ability to run for long periods of time without the need to be shut
    down and restarted like a normal personal computer. We are talking about months
    of work with no interruption.


    Servers are the crucial ‘building block’ layers that make up the internet and
    allow it to be accessible without interruption. Most servers have backup twins,
    so in case one of them crashes, the twin server should still be able to serve
    its content to internet users.


    # Data Center


    Data centers are extremely large rooms, sometimes even entire hangars, filled
    to the brim with servers. Data centers often require big refrigerators to keep
    the place cool as servers produce a lot of heat. Most big corporations have their
    own data centers. Smaller corporations also often need data centers, but struggle
    to set them up.


    Setting up a data center is an extremely complex engineering challenge. First,
    you need to find a region which is free of extreme weather conditions and preferably
    has a sufficiently cool climate. The region should also be politically stable,
    for obvious reasons. Once the place is selected, one needs to pull huge amounts
    of internet and electricity cables to the data center, supply all the computing
    hardware, storage hardware, and usually, refrigeration machines. Then comes the
    daunting task of connecting all the machines.


    Once the hardware is plugged in, software engineers come in to set up software
    on all those machines, including operating systems, network software, drivers,
    firewalls, antivirus, and more. And finally, you need to physically secure the
    perimeter and set up a reliable maintenance structure in case something goes wrong
    – and when it comes to computers – something always goes wrong. In addition, for
    backup reasons that you already know, an almost identical copy of the same data
    center must be set up in a different region. Not speaking of backing up electricity
    supply with expensive local batteries and in-house generators.


    # Cloud


    Cloud is a business model in which one can rent out a personal computer, memory
    storage, database, or an entire data center over the internet. With cloud, a guest
    user has the ability to log into a rented machine and fully operate it remotely
    over the web.


    This is a very useful tool for both direct consumers and businesses. You and I,
    for instance, may enjoy having our files tucked away in `OneDrive` or `iCloud`
    with the ability to access them from any device that is connected to the internet.
    This is possible because our data can be stored in a remote data center belonging
    to `Microsoft` for `OneDrive` or `Apple` for `iCloud`, both of which are accessible
    by any mobile device, assuming we have the required login credentials.


    However, it may be humbling to learn that retail consumers such as yourself are
    in reality, just a tiny drop in the sea of the cloud business. The most important
    cloud clients are businesses of every stature, ranging from very small startups
    to the largest corporations who simply didn’t want or didn’t have the capacity
    to set up their own data centers.


    Cloud was pioneered by `Amazon` in the early 2000s, when it had already become
    the Earth’s Biggest Bookstore. In order to serve all of its connected users, `Amazon`
    needed to acquire a staggering number of servers and data centers. However, `Amazon`
    noticed that customer interest in `amazon.com` was seasonally-based. This meant
    that while sometimes all servers were running at full speed, there were other
    times when the majority of servers were sleeping. A living business machine, by
    the name of `Jeff Bezos`, decided that it could be profitable to rent out his
    servers during the periods when `Amazon` wasn’t using them.


    Because setting up a data center is a challenging task, and even more challenging
    to operate and maintain, many companies were more than happy to pay `Amazon` a
    fee to rent its data center while `Amazon` ensured the data center ran smoothly.
    This also allowed startups with strong ideas to scale up instantly with the help
    of `Amazon`’s cloud. The simplicity transcended the business world. The process
    of renting 1 or 1,000 servers was achieved by a few clicks, making the system
    accessible to anyone with a single computer and credit card.


    Cloud offerings grew quickly and are classified in three major groups: `IaaS`,
    `PaaS` and `SaaS`. Today, in 2020, cloud servers are a 300 billion dollar business
    and are expected to keep growing annually at 30%. Unsurprisingly, three major
    cloud providers account for the majority of cloud traffic: `AWS` by `Amazon`,
    `GCP` by `Google`, and `Azure` by `Microsoft`.


    “If someone asks me what cloud computing is, I try not to get bogged down with
    definitions. I tell them that, simply put, cloud computing is a better way to
    run your business.”

    –Marc Benioff, Founder, CEO, and Chairman of `Salesforce`


    # Software as a Service


    Software as a Service (`SaaS`) is considered the most accessible out-of-the-box
    service, requiring the least setup and least technical knowledge to use. We all
    are familiar with SaaS services such as `Gmail`, `Facebook`, `Spotify`, `YouTube`,
    `Netflix`, `Airbnb`, `UBER`, or `PayPal`. All of those are Software as a Service
    programs, sold in the form of web pages or mobile applications.


    SaaS is extremely simple to use, as there is no need to set up anything computer
    related, no renting a machine, no installing software, no need to upload any of
    your software – you just sign up, and in some cases pay a fee, and the service
    provider will manage the rest. Most of those applications rent cloud resources
    from one of the top cloud providers. In the case of `PayPal`, for example, they
    are hosted on `Google Cloud Platform`.


    # Platform as a Service


    Platform as a Service (`PaaS`) is one level below SaaS on a technical level. PaaS
    users are usually not retail customers, but are typically companies wishing to
    run their SaaS via a cloud provider, like startups and application developers.
    The PaaS user rents out a fully operational machine with pre-installed standard
    software designed to satisfy the user''s needs. An example would be a machine
    with 64 GB of RAM, 10 parallel Intel CPUs, an installed Windows OS, an antivirus,
    and a Python programming language software – fully operational in just two minutes.

    '
