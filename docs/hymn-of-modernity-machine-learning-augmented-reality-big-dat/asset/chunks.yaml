- raw: 'SpaceX, space agency belonging to Elon Musk, plans to transport the first
    two cargo ships to the planet Mars in 2022. SpaceX also plans to send an extra
    four ships in 2024, two of which will be carrying a human crew this. The urgency
    to colonize Mars, as Elon Musk envisions, will alleviate some risks of extinguishing
    the total human population in case of an escalated nuclear war, asteroid hit,
    an Artificial Intelligence apocalypse, or being wiped out by a pandemic.


    Elon Musk has started Tesla and SpaceX after eBay has acquired PayPal for $1.5
    Billion, which he cofounded. So if we do end up with a station on Mars by 2022,
    we can give a big round of applause to eBay and all American second hand buyers
    for indirectly sponsoring the trip.


    “Becoming a multi planet species is way better than remaining a single planet
    species.”


    \-Elon Musk


    > Chapter 6 - Age of Digital Economies


    BUSINESS PROCESSES DIGITALISED


    Business processes, including production processes, financial processes, supply
    chain processes and innovation processes are the step by step algorithms for running
    a business. In other words, a repetitive set of tasks that needs to be done on
    a regular or seasonal basis to keep a business working. For example, procuring
    raw materials needed for production on every Monday morning is a business process.
    The procedure of turning on a nuclear power plant every evening as soon as solar
    panels are getting off the grid, is a business process. The procedure for boarding
    passengers onto an airplane is a business process. Elaboration of quarterly financial
    reports is a business process.


    Once established, business processes usually don’t change much for years. Many
    even become embedded in company’s traditions. However, since two decades an increasing
    number of business processes have becomme digitized or automated. This is driven
    by constant attempts for further cost reductions, margin improvements and a search
    for better customer service.


    Everything started with Toyota coming up with a process called “Continuous Improvement”.
    Which is basically a process of improving other processes. After years it all
    came down to either reducing waste, digitizing work, automating work or outsourcing
    work to a cheaper country.


    “Resources are what he uses to do it, processes are how he does it, and priorities
    are why he does it.”


    ― Clayton M. Christensen. Author of the Innovator’s Dilemma


    AUTOMATION


    By making machines do all the work, automation reduces business and operating
    processes to minimal or zero human assistance. We first saw automation on a global
    scale during the first and second industrial revolutions; the invention of the
    steam engine led the way to partial automation of many heavy lifting and transport
    tasks.


    In the past twenty years, we have seen a massive shift from paper-based processes
    to fully digitalized processes. The switch from paper to digital prepared the
    ground for a new automation revolution, called the fourth industrial revolution,
    which will shift society from the end of the industrial age into the new intelligent
    machine age. This type of automation will, for the first time, affect white collar
    labour, such as corporate and banking operations.


    The transportation industry is the next candidate in line for a massive automation
    wave, potentially resulting in millions of job losses.


    However we humans proved historically resilient in dealing well with automation
    and finding jobs. Automation is an old idea. In the second book of Physics, Aristotle
    would introduce the modern concept of automation, referring to ‘spontaneity’ in
    nature, an event itself triggering its occurrence.


    In another book, on Politics, Aristotle reasons on automation from a social angle:


    “If every instrument could accomplish its own work, obeying or anticipating the
    will of others… and if,     in a like manner, the shuttle would weave and the
    plectrum touch the lyre without a hand to guide them,    chief workmen would not
    want servants,


    nor would masters need slaves.”


    \-Aristotle, book on Politics 300 BC


    Using music as an illustration he pointed out that it was terrible to enslave
    people to make music, which in those times was undesirable and labor intensive,
    but as society needs music, someone must be enslaved. Truly remarkable ideas for
    a society living 2,000 years ago.


    ROBOT PROCESS AUTOMATION


    Robot process automation (RPA) is software capable of automating work done by
    an employee on a computer. There are different flavours of RPA software, some
    smarter than others. The best RPA software allows a user to record tasks on a
    screen that the software will encode. While a human completes a daily repetitive
    task, such as opening an e-mail and copying different fields from the email into
    some customer management software, RPA records all the tasks the human has done.
    Now RPA is capable of taking over control of the computer and completing the tasks
    on its own – clicking, typing, moving, opening, closing, saving, copying, pasting,
    calculating, and performing any other function it needs in order to accomplish
    the given task. RPA gained in popularity when banks and other process-heavy companies
    realized they could automate 50% of operational jobs at a fraction of the cost.


    Your job is to send reminders? Download receipts and enter them manually into
    the company''s official financial records? Or complete an online form based on
    a printed copy of a form? Slowly start reorienting yourself because these jobs
    can now be easily automated.


    API


    Does the term Application programming interface (API) speak to you? It’s not surprising,
    as the name doesn’t really speak to anyone, even advanced developers. Nevertheless,
    this technology is the next big thing in corporate operations automation.


    In essence, API is a common standard of communication between two different machines
    and software applications. For instance, between you ordering a pizza through
    your Amazon Alexa and the delivery of your pizza to your doorstep, a long chain
    of applications talk to each other through APIs. Alexa’s API sends your command
    to Domino’s customer API which then processes it and sends the command to a connected
    oven. Once the pizza is cooked, the connected oven will send a notification to
    an automated delivery truck which will then deliver the pizza to your door and
    send a notification back to Alexa’s API. Alexa will kindly tell you your pizza
    is ready. No person is needed. Most often, API communication goes through the
    internet and information is passed via HTTPS requests.


    DEVELOPER


    A developer, also known as coder or programmer is a person who writes computer
    software code. There are many different types of developers – some focus on a
    very specific coding language, like Java or C#, and others prefer to get to know
    a bit of everything. Developers are also responsible for an application’s security.


    Developers who code both, the User Interface and the application server logic
    are called Full Stack developers.


    In the past two decades we see Fortune 500 companies and major Banks reducing
    their operation staff and increasingly hiring software developers. JP Morgan Chase
    bank and Goldman Sachs go as far as referring to themselves as technology companies
    rather than banking companies. JP Morgan Chase for example employs more than 40,000
    developers and has an annual Technology budget of $11 Billion. They have also
    recently built the biggest world repository for Data.


    DATA SCIENTIST


    “It is a capital mistake to theorize before one has data. Insensibly one begins
    to twist facts to suit theories, instead of theories to suit facts.”


    ― Sir Arthur Conan Doyle, Sherlock Holmes'
