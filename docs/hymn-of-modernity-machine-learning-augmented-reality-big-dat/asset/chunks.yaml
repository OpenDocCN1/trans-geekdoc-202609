- raw: 'A data scientist is a modern day corporate detective/journalist armed with
    Python, Excel, SQL, and a big fat salary cheque. Besides being a data-driven journalist,
    a Data Scientist is also a data-driven consultant. This means that in addition
    to reporting his findings in a few visual charts, Data Scientist is also supposed
    to leverage the conclusions of his research to advise businesses on tangible ways
    to make their operations better. Better usually means more productive manufacturing,
    better personalised products, more effective marketing and all of that without
    spending a dollar on new equipment or staff.


    Most data scientists start as data analysts, freshly graduated from a statistics,
    engineering, or computer science school. Data analysts often begin their careers
    as mathematically inclined introverts, but as they continue to progress and improve
    their presentation and language skills, they become eligible for data scientist
    promotion.


    Data Scientists are increasingly using machine learning, letting algorithms crunch
    all the data while they sit back and relax. Data scientists who are more passionate
    about architecting AI rather than browsing thought data become AI engineers and
    evolve toward Chief Technology Officer (CTO) positions, while others become senior
    data executives and evolve toward Chief Data Officer (CDO) positions.


    “Data Scientist: The Sexiest Job of the 21st Century”


    –Harvard Business Review


    DATA ENGINEER


    Data engineers are computer engineers who ensure a reliable computer hardware
    and software infrastructure so that Big Data can be successfully collected, stored
    and processed. Data engineers ensure that data scientists can get easy access
    to all company data, within their permission rights of course. We are often speaking
    about terabytes of data.


    Today, having the right data infrastructure in place is crucial for public and
    private institutions. As data grows, infrastructure has to mature and adapt. Unfortunately,
    not everyone manages. For example, the FBI was very late on its data infrastructure
    upgrade and in 2001 still had the majority of its processes based on paperwork.
    A commission was set to investigate why the 9/11 disaster could happen. But they
    couldn’t simply receive the right information from the FBI – it was extremely
    disorganized. At the conclusion, the commission reported “The FBI lacked the ability
    to know what it knew.” A Senator told the Washington Post: “We had information
    that could have stopped 9/11. It was sitting there and was not acted upon.… I
    haven’t seen them correct the problems.… We might be in the 22nd century before
    we get 21st-century technology.”


    When the Bureau was asked a number of uncomfortable questions, the FBI answered
    with “Nothing to worry about, we have a modernization plan already in the works,”
    referring to the new Virtual Case File (VCF) system they started to design earlier
    in 2001.


    VCF was an attempt to go from a paper-based to an electronic-based management
    system, but it was abandoned in 2005 after costing $170 million of tax payers''
    money. Apparently, the FBI didn’t manage to get the requirements well defined.
    The same year, the FBI hired Lockheed Martin to launch a new program called Sentinel.
    They were convinced it would work this time, putting a mere $451 million price
    tag on it. Lockheed Martin promised that Sentinel would be fully operational by
    2009. On March 3, 2010, the FBI abandoned the project. And it is only after hiring
    the “Agile” IT project management guru Jeff Johnson that the FBI was finally able
    to complete the project.  According to The Wall Street Journal: “FBI Goes Digital,
    After Delays.” In August 2012, the FBI’s Sentinel system was finally ready for
    use, replacing manual processes and older electronic management tools. Since then
    the effect of the Sentinel Information system on the FBI has been dramatic. The
    ability to communicate and share information has fundamentally changed what the
    Bureau is capable of.


    Today new Data modernization plans are taking place all over the corporate world,
    with the majority of architectural work conducted by Data Engineers. Data Engineers
    usually have a lot of experience under their IT belts. Data Engineers arm companies
    with technologies that allow them to store and process Big Data in-house. On one
    side Big Data is becoming available for companies’ Data Scientists to analyse,
    and on the other side Big Data is becoming available for the AI engineers to train
    smarter ML models. All of this thanks to Data Engineers.


    AI ENGINEER


    AI engineer is the most recent addition to the big Data trio, gaining increasing
    popularity over the traditional Data Scientists due to the fact that most companies
    are now entering AI industrialisation phase. Corporate IT infrastructure is becoming
    mature enough to accommodate Machine Learning models in its daily operations.
    This journey of catching up to Google and Facebook that many companies have initiated
    a few years back is finally starting to pay off. 


    AI engineers usually come from the Data Science background but during their career
    focus on expanding their broader computer science skills, contrary to the most
    Data Scientists who remain statisticians with laptops.


    AI engineers focus on two major tasks – developing/finding the most powerful Deep
    Learning model possible and working closely with Data Engineers to implement those
    models into company’s operations.


    CONSULTANT


    A consultant is a professional who provides expert advice to businesses, updating
    them on the latest trends in the areas of automation, client experience, advanced
    technologies, tax optimization, law, cyber security, and marketing. There are
    three main branches of consulting making up for the majority of consulting business:
    Strategy consulting, Technology consulting and Finance consulting.


    Technology consulting has been the fastest growing consulting sector, with top
    firms like Accenture now employing half a million consultants. Other major advisory
    firms, like the ‘Big 4’ auditing and accounting firms, are energetically expanding
    their consulting branches. The most prestigious space for consulting remains strategy
    consulting, with top firms like McKinsey and BCG advising directly on the C-suite
    level. Contrary to investment bankers who advise firms on lucrative merger and
    acquisition strategies, strategy consulting firms focus more on dealing with competition
    the traditional way. They also advise on opportunities for expansion toward new
    untapped markets.


    To hire a consulting firm, most often corporations such as retail banks or public
    services issue a request for a proposal document, in which they describe the problem
    they are trying to solve or their request for advice. Consulting firms reply with
    a proposal, specifying their approach including CVs of consultants who will work
    on the solution, the price, and the estimated time to completion. The selected
    consulting firm will gain the rights to the project and will soon send its tech
    army to the client’s premises to deal with the issue.


    FREELANCER


    A freelancer is a one-person working resource. A freelancer is either a professional
    struggling to become a consultant, or inversely, an expert who prefers to be self-employed
    rather than working for a firm. For example, if Obama came to Harvard to give
    a law class lecture for $100,000, he would probably qualify as a freelancer. Another
    common type of freelancer is a software developer who chooses to relocate to a
    country with cheaper  cost of living and better weather, like the Philippines,
    and remotely works for an American or European firm.


    ENTREPRENEUR'
