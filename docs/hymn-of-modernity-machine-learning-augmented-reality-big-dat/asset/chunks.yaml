- raw: 'Algorithmic trading is an automated trading process which does not require
    human intervention in any step of its operations. Trading algorithms use either
    quantitative equations or machine learning models to make sound trading decisions.
    Data used by trading algorithms often includes quarterly revenues, financial ratios,
    and key indicators of economic states, such as unemployment rates, inflation and
    GDP.


    Increasingly, news crunching and media sentiment analysis are being used in effective
    hype-driven trading strategies.


    Today algorithmic trading dominates over 80% of total daily stock market. Due
    to such large volumes, many restriction mechanisms have been imposed by regulators
    and new ones appear every year, aiming to avoid market disasters such as the flash
    crash of 2010, when algorithms organised a $ 1trillion dollar market selloff in
    less than an hour.


    PRECISION MEDICINE


    Precision medicine refers to a highly personalised medical treatment made possible
    with Artificial Intelligence. AI for precision medicine is unanimously considered
    the field which will have the biggest impact on the Healthcare industry in the
    next five years.


    Numerous studies have proven ML''s ability to match or exceed the diagnostic accuracy
    of human medical professionals, demonstrating its promise to avoid medical errors,
    which is a costly and frequent phenomenon in hospitals worldwide.


    For example diagnosing breast cancer at stage 0, as opposed to stage I/II results
    in $21,000 reduction in medical costs. DNA analysis, already costing less than
    $200 per person will allow to flag patients with higher risk of developing cancer
    at an early stage.


    Medical AI tech will also have a direct impact on hospitals high labor costs:
    AI could automate around 33% of health practitioner tasks and 40% of tasks completed
    by health support occupations by 2030.


    By 2025 AI could save Healthcare industry up to $600 Billion in costs, while providing
    faster and more accurate diagnosis and boosting patient satisfaction.


    EXPONENTIAL GROWTH


    Exponential growth refers to a growth process in which quantities increase in
    an accelerating way, like an explosion, contrary to linear growth which is based
    on a constant increment over time.


    There are plenty of examples of exponential growths in nature and human lives,
    from bomb explosions to the growth of biological organisms. In the latter, growth
    starts with a single cell, which divides in two, then each of the two cells further
    divides in two and so on. As a result you start from a process where a single
    cell is produced in one minute, then a few days later you have thousands of cells
    being produced every minute and few days after that you have billions of cells
    being produced every minute.


    In a linear growth scenario, the growth rate doesn’t accelerate. A manufacturing
    factory is an example of linear production. Same maximal quantity of products
    will be added every day of the week.


    Human population also grows at an exponential rate, and so do viruses during pandemics.


    Another subject growing at an exponential rate is technology. Since the first
    electronic punch card processing machines from 1890’s up until present date, technology
    has been growing at an exponential rate with no breaks. Not a war, recession or
    a natural disaster did slow down the technological growth.


    Co-founder of Intel, Gordon Moore, was the first to notice that computing power
    is doubling every two years, has been doing so for decades and seemingly will
    keep growing at this pace in the future.


    Exponential technology growth is putting us on the straight line to technological
    singularity, projected to occur sometime in the next few decades.


    TECHNOLOGY


    We understand the term technology on an intuitive level but it is a little more
    delicate to put into words. Broadly speaking, technology is a set of tools, skills,
    and methods intended to augment human abilities or facilitate our work through
    partial or full automation of tasks. Technology was always a crucial aspect of
    human civilization, perhaps one without which civilization would not have been
    possible in the first place.


    Weapons helped us fight enemies and establish total control over surrounding territory,
    agricultural technology helped us produce enough food to store and feed a growing
    population, medical technology helped us fight disease, space technology helped
    us fly to the moon, and communication technology helped us effectively store and
    share knowledge, pushing the boundaries of our intelligence like never before.


    Technology is without a doubt one of the most crucial aspects of human development,
    even more than the effective organization is. Ants, for example, are impressively
    well organized, but due to the lack of technological development, their societies
    are stuck in progress. Populations that master technology and organization govern
    the world and those who lack them either fall into chaos or lag behind the development
    curve. It seems technology has formed a strong historical symbiosis with the human
    animal and increasingly infuses itself in every aspect of human life.


    “I am telling you, the world’s first trillionaires are going to come from somebody
    who masters AI and all its derivatives, and applies it in ways we never thought
    of.”


    –Mark Cuban, Billionaire


    SINGULARITY


    Technological singularity is a point in time beyond which history breaks from
    a seemingly linear improvement cycle and enters an uncontrollable and impossible
    to follow intelligence explosion phase, beyond which the future is by definition
    unpredictable. Singularity may be achieved when artificial general intelligence
    will learn to improve itself better than humans can improve it, with each new
    generation being extensively better than the previous.


    Due to the digital nature of AI, its evolution can be speeded up to the point
    where it passes from an average human level of intelligence to a genius level
    of intelligence to millions of times smarter than Einstein level of intelligence
    in a short period of time. What will happen to humans at that point? No one knows.


    The term singularity was popularized by the director of engineering at Google,
    Ray Kurzweil, in his book, Singularity Is Near.


    The road to technological singularity began exactly when we humans began to qualify
    as humans, differentiating ourselves from other apes with a more powerful prefrontal
    cortex that gives us the ability for critical thinking. Most of the deep thinkers
    seem to conclude that technology is the road to survival, domination, and a better
    life. Reviewing the history of the undeniable acceleration of technological development,
    demonstrated by the likes of Moore’s Law, singularity is judged to be a very plausible
    scenario within the next 30 years.


    “One cubic inch of nanotube circuitry, once fully developed, would be up to one
    hundred million times more powerful than the human brain.”


    –Ray Kurzweil, The Singularity is Near: When Humans Transcend Biology


    UNIVERSAL BASIC INCOME


    Universal Basic Income (UBI) is a government’s guarantee that each citizen receives
    a minimum income. Discussion on whether UBI will actually come into force is an
    important ongoing topic, especially as potential job losses and unemployment rates
    spike due to automation.


    The concept behind UBI is to provide a minimum wage to every citizen on a monthly
    basis, no matter the citizen’s employment status, profession, or personal wealth.


    ABUNDANCE


    Abundance is a theoretical situation in the economy where water, food, and goods
    are produced in great abundance with minimal human labour required. As a result,
    the essential items are made available to all at a cheap price, or even freely.


    In essence, abundance is a hypothetical situation where one doesn’t need to work
    to survive, but works only out of a wish for personal expression. Peter Diamandis,
    a multimillionaire entrepreneur, author, and friend of Ray Kurzweil and Elon Musk,
    suggests the concept of abundance is soon achievable.'
