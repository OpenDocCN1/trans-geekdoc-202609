  trans: '


    # 数据科学家


    数据科学家是现代企业中的侦探/记者，配备了 `Python`、`Excel`、`SQL` 和一份丰厚的薪水支票。除了作为数据驱动的记者外，数据科学家也是一名数据驱动的顾问。这意味着，除了通过几张可视化图表报告他们的发现外，数据科学家还应该利用其研究结论，为企业提供具体的建议，以改进其运营。。“更好”通常意味着更高的生产生产率、更具个性化的产品、更有效的营销，而且这一切无需在新的设备或员工上花费一分钱。


    大多数数据科学家从数据分析师起步，他们毕业于统计学、工程或计算机科学专业。数据分析师的职业生涯通常从具有数学天赋的内向者开始，但随着他们不断进步并提高演示和语言能力，他们就获得了晋升为数据科学家的资格。


    数据科学家越来越多地使用机器学习，让算法来处理所有数据，而他们则可以坐下来休息。对构建 AI 架构比浏览数据更感兴趣的数据科学家成为了 AI 工程师，并向首席技术官（`CTO`）职位演进；而另一些人则成为高级数据高管，并向首席数据官（`CDO`）职位演进。


    > “数据科学家：21 世纪最迷人的工作”

    > –哈佛商业评论


    # 数据工程师


    数据工程师是计算机工程师，他们确保可靠的计算机硬件和软件基础设施，以便大数据能够被成功地收集、存储和处理。数据工程师确保数据科学家可以轻松访问所有公司数据（当然，是在他们的权限范围内）。我们通常谈论的是
    TB 级的数据。


    今天，拥有正确的数据基础设施对于公共和私人机构来说至关重要。随着数据的增长，基础设施必须变得成熟并适应。遗憾的是，并非所有人都能做到。例如，联邦调查局（FBI）在数据基础设施升级方面非常缓慢，直到
    2001 年其大部分流程仍基于纸质文件。成立了一个委员会来调查为什么 9/11 灾难会发生。但他们无法直接从 FBI 获取正确的信息——这些信息极其混乱。在最后，委员会报告说：“FBI
    缺乏了解其所知的能力。”一位参议员告诉《华盛顿邮报》：“我们拥有本阻止 9/11 的信息。它们就在那里，但没有采取行动……我还没看到他们纠正这些问题……在我们获得
    21 世纪技术之前，我们可能已经在 22 世纪了。”


    当该局被问及许多不安的问题时，FBI 回答道：“不用担心，我们已经有一项正在进行中的现代化计划”，指的是他们在 2001 年初开始设计的新的 `Virtual
    Case File`（`VCF`）系统。


    `VCF` 是尝试从基于纸质的管理系统转向电子管理系统，但在 2005 年在花费了 1.7 亿美元纳税人的资金后被遗弃了。显然，FBI 没有能很好地定义需求。同年，FBI
    雇用了洛克希德·马丁公司（Lockheed Martin）启动一项名为 `Sentinel` 的新计划。他们坚信这次会成功，并为其定了一个仅为 4.51 亿美元的价格。洛克希德·马丁承诺
    `Sentinel` 将在 2009 年全面投入运行。2010 年 3 月 3 日，FBI 放弃了该项目。在雇佣了“敏捷型”IT 项目管理大师杰夫·约翰逊（Jeff
    Johnson）之后，FBI 终于完成了该项目。根据《华尔街日报》的报道：“FBI 数字化，在延迟之后。”2012 年 8 月，FBI 的 `Sentinel`
    系统终于可以使用了，取代了手动流程和旧的电子管理工具。从那以后，`Sentinel` 信息系统对 FBI 的影响是巨大的。通信和共享信息从根本上改变了该局的能力。


    今天，新的数据现代化计划正在整个企业界进行，大部分的架构工作由数据工程师完成。数据工程师通常在 IT 领域拥有丰富的经验。数据工程师为公司提供了技术，使其能够在内部存储和处理大数据。数据工程师为公司配备技术，允许其内部处理大数据；一方面，数据让数据科学家可以分析；另一方面，数据让
    AI 工程师可以训练智能模型。


    # AI 工程师


    AI 工程师是数据三角中新增的成员，由于许多公司现在进入 AI 工业化阶段，他们比传统的数据科学家日益受欢迎。企业基础设施变得成熟到可以容纳机器学习模型，几年前开始的追赶之旅终于开始见效。


    AI 工程师通常来自数据科学背景，但在职业生涯中专注于扩展计算机科学技能，这与统计学家的数据科学家相反。


    AI 工程师专注于两个主要任务——开发/寻找强大的 `Deep Learning` 模型，并与数据工程师紧密合作将这些模型实施到运营中。


    # 顾问


    顾问是为企业提供专业建议的专家，提供自动化、客户体验、先进技术、税务优化、法律、网络安全和营销领域的最新趋势。咨询有三个主要分支：战略咨询、技术咨询和财务咨询。


    技术咨询是增长最快的咨询领域，像埃森哲这样的顶级公司雇用了数十万顾问。其他主要的咨询公司（如“四大”审计和会计师）正在积极扩张其咨询部门。最有声誉的咨询领域仍然战略咨询，麦肯锡和
    BCG 等顶级公司直接为高层管理人员提供建议。与为公司提供丰厚兼并策略的投资银行家相反，战略咨询公司更关注以传统方式应对竞争。他们还对开发新的未开发市场的机会提供建议。


    为了聘佣顾问公司，零售银行或公共服务等公司通常会发布建议书，在其中描述他们试图解决的问题或对建议的需求。咨询公司会回复建议书，说明他们的方法，包括负责解决方案的顾问简历（CVs）、价格和预计完成时间。选中的顾问公司将获得项目的权利，并很快派遣其技术团队前往客户现场处理问题。


    # 自由职业者


    自由职业者是一个单兵作战的工作资源。自由职业者要么是努力成为顾问的专业人士，反之，是倾向于自雇而非为公司工作的专家。例如，如果 `Obama` 来哈佛大学进行一次法律课讲座并获得
    10 万美元，他可能符合自由职业者的定义。另一种常见的自由职业者是软件开发人员，他们选择搬到一个生活成本较低、气候更好的国家（如菲律宾），并为美国或欧洲公司远程工作。


    '
