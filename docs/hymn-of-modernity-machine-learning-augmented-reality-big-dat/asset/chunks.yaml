    为了说明目的，这里是《通用数据保护条例》（GDPR）关于算法决策的官方摘录：


    # 欧洲议会和理事会 (EU) 2016/679 号条例


    2016 年 4 月 27 日，关于就个人数据处理有关保护自然人的保护以及此类数据的自由流动的条例，并废止第 95/46/EC 号指令（《通用数据保护条例》）


    ## 第 (71) 条摘录


    “数据主体有权不受某些完全基于自动化处理的决策的影响，该决策可能包括对对其或其个人方面进行评估，且该决策对其或其产生法律影响，或对其产生类似的重大影响，例如自动拒绝在线贷款申请或在没有任何人工干预的情况下进行电子招聘活动。”


    ## 网络安全


    “信息是现代社会的氧气。它渗透过布满铁丝网的围墙，它飘过通了了电的边界。”


    罗纳德·里根，美国总统


    网络安全或计算机安全（有时被称为网络安全）是计算机科学的一个分支，专注于网络空间中交互的隐私和安全。网络安全研究侧重于测试和设计方法，以使系统和设备免受不受欢迎的入侵入侵。网络安全顾问专注于为公司和政府提供最佳实践建议，以确保其公司网络安全且数据受到保护。


    计算机安全在历史上围绕三个方面进行组织：机密性、完整性和可用性。另一方面，网络攻击通常旨在渗透系统并盗取、更改或破坏敏感信息。网络犯罪分子往往有更具威胁性的意图，例如勒索资金、实施工业间谍活动或策划大规模的宣传活动。对于这些在线攻击者来说，奇怪的是，有时这仅仅是为了好玩。


    国际上一直存在着持续的网络战争，中国、美国、伊朗和俄罗斯等国家处于网络安全丑闻名单的前列。尽管，自然地，每个国家都一如一地否认参与其中。近年来，我们看到了不乏的全国性攻击，例如“士震网”（Stuxnet）攻击，黑客向伊朗核设施引入了恶意代码，有效地使他们的核开发计划落后了多年。或者以涉嫌入侵
    2016 年美国总统选举的黑客攻击为例，俄罗斯人被指控利用人工智能人为地推助唐纳德·特朗普的竞选，以避免希拉里·克林顿当总统。


    虽然某些网络攻击是出于恶意，但你可能会惊讶地发现，许多在线攻击是出自纯粹好奇的青少年之手，他们正在实验操纵计算机网络的复杂性。一个显著的例子是 2000 年由一名
    15 岁的加拿大男孩发起的分布式拒绝服务（DDoS）攻击，目标包括 Amazon、eBay、CNN 和 Yahoo 在内的多个影响力的国际商业网站。令人惊讶的是，DDoS
    攻击奏效了。损害总金额不少于 12 亿美元。该青少年因其广传的违规行为被称为“黑手党小子”（MafiaBoy），被处以八个月的开放监禁，他的青少年身份帮助他避免了严重的监禁。


    目前，网络研究前沿最热门的话题是网络密码学，这是一个纯粹的数学问题，可以破坏最现代的互联网安全。每一条重要的互联网通信都经过了加密，以便试图监听发送者和接收者之间网络通信的入侵者...


    ## NSA


    国家安全局（NSA）是美国最大的情报机构。NSA 起于二战期间的一个负责破译敌方信息的官僚机构。今天，NSA 不仅雇佣创建密码的数学家，还...


    总而言之，你和我从 NSA 处获得的利益通常比我们关注他们所做的事情要多。没有 NSA，互联网将变成一个危险的地方并可能消失。然而，并非所有的人工智能研究人员都会同意这一观点。


    “我担心如果你让这项技术运行得更好，你就是在帮助 NSA 更多地滥用它。我对它的担心比对自主机器人更大。”


    杰弗里·辛顿（Geoffrey Hinton），深度学习先驱


    ## 哨兵计划 (PROJECT ECHELON)


    哨兵计划（Project ECHELON）最初是 20 世纪 60 年代的一个秘密监控计划，是美国、英国、澳大利亚、加拿大和新西兰用于监视苏联的行动。到 20
    世纪末，哨兵计划的演变已超出了其军事和外交目的，发展成为 NSA 使用的一种全球性监控工具。爱德华·斯诺登（Edward Snowden）的举报揭露了哨兵计划行动巨大规模的更多细节。


    英国《卫报》将哨兵计划称为一个全球电子间谍站网络，它可以监听电话、传真和计算机。它甚至可以跟踪银行账户。这些私人信息存储在哨兵计算机中，这些计算机拥有存储数百万个人记录的能力。然而，在官方层面，哨兵计划并不存在。


    ## 社会工程学


    社会工程是一种黑客技术，利用了现代网络安全系统中最薄弱的环节，这无疑总是使用该系统的个人。社会工程攻击并不寻找安全算法的数学弱点，而是研究人类行为和逻辑的起伏。尽管公司的防火墙可能极其安全，但注入致命病毒只需要一个足够好奇的员工将他随手捡到的
    USB 盘插到他的工作笔记本电脑上。


