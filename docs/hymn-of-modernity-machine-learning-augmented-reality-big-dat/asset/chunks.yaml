- raw: "With PaaS, a programmer can instantly run his applications in the cloud without\
    \ worrying about Windows updates or physical hardware, as all of those details\
    \ are managed by the cloud provider.\n\nPerhaps most crucially, PaaS will also\
    \ monitor the traffic to your application and ramp up additional servers with\
    \ the exact same software automatically, if needed, so that users don’t have to\
    \ wait in a queue. This is a highly desirable feature of PaaS, as a queue will\
    \ significantly slow down the loading speed and corrupt the user experience which\
    \ will result in the worst possible outcome for a business: annoyed users.\n\n\
    PaaS was truly a game changer for cloud business. Those who managed to create\
    \ an easy to use dashboard with plenty of PaaS services grew in size and status.\
    \ Those who struggled to offer stable and user-friendly PaaS systems simply fell\
    \ behind because their user numbers plummeted over time, such as the case with\
    \ IBM Cloud, LoudCloud, SAP Cloud, and many others.\n\nThe number of PaaS offerings\
    \ has grown rapidly in recent years which led to the emergence of subcategories,\
    \ one of which is AI as a Service. This, of course, provides you with all the\
    \ necessary tools to massively simplify the training of your machine learning\
    \ models as well as integration of the trained models into your company's operations.\n\
    \nINFRASTRUCTURE as a SERVICE\n\nInfrastructure as a Service (IaaS) was the first\
    \ and most primitive contribution to cloud technology. Users basically rented\
    \ empty servers that they could access through the web.\n\nAlthough IaaS was a\
    \ much better solution to circumvent the need of setting up your own data center,\
    \ IasS still required users to install operating systems, antiviruses, programming\
    \ languages, databases, and other custom software before the machine could become\
    \ operational.\n\nUsers were also the only responsible party for ensuring that\
    \ all of the required software was up to date. Because of these pitfalls, it became\
    \ clear that many users were looking for a ready-to-use Windows or Linux machine.\
    \ Luckily, with pre-installed programming language of choice, IaaS slowly led\
    \ to the creation of PaaS which swiftly put companies without a good PaaS option\
    \ out of business.  \n\nAWS, AZURE, GCP and ALIBABA \n\nThe three biggest cloud\
    \ providers are Amazon (AWS), Microsoft (AZURE) and Google (GCP), respectively. \
    \ AWS, launched in 2006 was the first Cloud business conglomerate and up until\
    \ 2019 accounted for almost half of the entire market share, followed by Microsoft\
    \ and Google. A new player form China – Alibaba Cloud is also slowly climbing\
    \ the Cloud ladder.\n\nAs a funny fact, Amazon’s CEO, Jeff Bezos was an early\
    \ investor in Google and in 1998 provided them with as much as $250,000 in funds.\
    \ Amazon was already up and running for four years then. Fast-forward to today,\
    \ Google happened to be the fastest growing company in the history of capitalism,\
    \ and is now Amazon’s most feared rival in the Cloud space.\n\nCloud is an extremely\
    \ profitable business. In the case of Amazon, AWS cloud is notably its most profitable\
    \ business sector, more than books. However, Amazon should think twice before\
    \ getting too comfortable up on the cloud throne, as there is likely a CEO or\
    \ two doing everything in their power to gain a piece of the market share.\n\n\
    In early 2020 studies, AWS lost some ground and now accounts for a little more\
    \ than a third of the market share, while Microsoft, Google, and Alibaba have\
    \ gained some market share ground.\n\nIBM is also planning to come back in the\
    \ picture after their recent acquisition of Red Hat and appointment of a new CEO.\
    \ IBM is also betting big on the Quantum computing as a Service that they plan\
    \ to offer via Cloud.\n\n> Chapter 5 - Age of Virtual Realities\n\nUSER INTERFACE\n\
    \nThe term user interface (UI) mainly refers to the design and content of the\
    \ web page that appears in the internet browser, as compared to the server side\
    \ code and databases which are only visible to the website owners and not the\
    \ final users. The user only gets to see what he has access to.\n\n“Digital technology,\
    \ pervasively, is getting embedded in every place, everything, every person, every\
    \ walk of life is being fundamentally shaped by digital technology — it is happening\
    \ in our homes, our work, our places of entertainment. It’s amazing to think of\
    \ a world as a computer. I think that’s the right metaphor for us as we go forward.”\n\
    \n–Satya Nadella, CEO of Microsoft\n\nThe point of a user interface is to facilitate\
    \ interaction between human and a machine. A good interface is extremely easy\
    \ to navigate, while a bad interface just makes you want tear off your hair and\
    \ break everything around you while you are looking for a specific setting which\
    \ you can’t find. As the rule of thumb, an interface should contain no more than\
    \ seven main elements not become overcrowded. This is because human short term\
    \ memory can only hold seven objects at a time on average. Every machine, from\
    \ a washer to a computer, has an interface that a user interacts with to set commands.\n\
    \nUser interfaces, although historically mostly visual, don’t have to be pictorial.\
    \ In Google Home and Amazon Alexa, the UI is based on voice recognition and designed\
    \ for the user to interact via speech. As voice-based UI matures in quality as\
    \ well as security, we expect to use it as frequently as visual UIs.\n\nThe goal\
    \ of the current UI research, of which Voice UI is a big part, is to tap a sleeping\
    \ elderly population market. Few grandparents know how to use a computer to order\
    \ on Amazon or to pay their bills electronically. Voice assistants might soon\
    \ allow just that.\n\nThe main advantage to voice UI is speed. In a few seconds\
    \ you can order a pizza by simply saying “Alexa, order one large Chicken Barbecue\
    \ Domino’s” rather than going to Domino’s website where it takes a few minutes\
    \ to click through your order. And don’t worry, Alexa will ask you to specify\
    \ if you want your pizza right away or later for dinner, along with any other\
    \ pertinent information. Addresses and payment accounts are usually already linked\
    \ to your Amazon account, to which Alexa has access.\n\nJavaScript is the most\
    \ widespread user interface coding language on the planet, and is also known as\
    \ the language of the web.\n\nWireframing is a process of drawing a mockup of\
    \ an application with all its user interfaces and then specifying different interactions\
    \ that happen when the user triggers particular events within the UI, like clicking\
    \ on buttons. Wireframing is important to do prior to coding as it can point to\
    \ potential flaws in the UI as well as difficulties of use. Since it is much quicker\
    \ to process through than coding, it can save coders massive amounts of time and\
    \ bring clarity to the business vision.\n\nA/B testing is essentially an experiment\
    \ where two or more variations of a product or UI are shown to users in order\
    \ to determine which version is better. In the case of e-commerce, better means\
    \ higher propensity to buy, also known as the conversion rate.\n\n“UI wireframing,\
    \ product prototyping and A/B testing are invaluable tools that every aspiring\
    \              entrepreneur must use to his advantage”\n\n\\-Jad Fayad, Entrepreneur\n\
    \nVIRTUAL REALITY\n\n“VR is a way to escape the real world into something more\
    \ fantastic.\n\nIt has the potential to be the most social technology of all time.”\n\
    \n\\- Palmer Luckey, Founder of Oculus Rift\n\nVirtual Reality (VR) is specially\
    \ designed computer hardware and software allowing for a new generation of immersive\
    \ user interfaces, aimed at erasing all differences between a true reality and\
    \ a simulated reality. The Holy Grail of VR is for the experience to be as good\
    \ as a lucid dream, indistinguishable from the natural habitat."
