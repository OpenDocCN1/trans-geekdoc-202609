    # Algorithms


    A pumpkin pie recipe is a good example of a day-to-day algorithm. You follow step-by-step
    instructions, simply written in plain English, to complete the task. However,
    most algorithms are created for computer systems and are encoded using programming
    languages specifically designed for computers to interpret and execute.


    As you might imagine, algorithms are the core tool for automatically completing
    a partial or full set of tasks. They are our most direct way of explaining to
    a machine exactly what we want it to do.


    British scientist Alan Turing pioneered modern computer algorithm theory. In the
    early part of WWII, Turing designed an algorithm that could decrypt the supposedly
    uncrackable code created by the German `Enigma` machine. The algorithm Turing
    designed for his `Bombe` machine gave the Britain a key advantage in WWII.


    It is important for a computer algorithm language to be transportable, which means
    it must have the ability to be executed not only on a single machine but ideally
    on every computer. The most common words used to compose algorithms are: “Do until...”,
    “If such and such... then do this…otherwise do this...” Easy as pumpkin pie.


    AI is a self-programmable machine, meaning it designs its own algorithms to resolve
    tasks by simply observing what somebody else does.


    # SYSTEM


    A system is a set of separate entities working together to form a whole. The purpose
    of such representation is to study the whole, both from the inside and the outside.


    Systematic thinking is a hot topic in the engineering world. It allows engineers
    to deconstruct complex concepts into smaller parts in order to understand their
    functions. If the system is too complex from the inside, we can further divide
    the parts into subsystems to study each of them individually. Nearly everything
    in the universe can be thought of as a system:


    *   A car is a system made up of an engine, steering wheel, gears, and seatbelts

    *   Earth is a system of continents, oceans, winds, and living organisms

    *   A human is a system of organs, a brain, a central nervous system, bones, and
    muscles

    *   A government is a system of executive, legislative, and judiciary powers

    *   Cities are systems of local commerce, housing, and laws

    *   A computer program is a system of various algorithms executed in ordered sequence

    *   Computers are systems primarily made of `CPU`, memory storage, and a keyboard
    (everything else is an accessory)


    Anything can be considered a system. We are systems who live inside a bigger system.
    In order to study complex systems, especially mechanical or economic systems,
    engineers and economists traditionally draw them out on paper, with almost every
    system starting as a big empty rectangular box. Then they draw inputs that go
    into the system from the outside world. Inputs are followed in their journey through
    the system until they come out of the system, usually in a modified form. The
    latter are called an output, and of course we draw them too. This is where we
    reach the most interesting part – we have now closely followed input from the
    moment it enters the system all way through its process to the output. This is
    what allows us to study systems from the inside-out.


    Systemic thinking is an important tool in innovation research. It allows us to
    mentally dismantle a product or a production process into many parts and see which
    of them can be improved. Sometimes engineers employ systemic thinking to fix problems.
    They may find that the expected output of the system is either deformed or didn’t
    occur at all, meaning there is a block inside the system.


    System analysis allows to understand a system in its entirety to then replicate
    it by encoding into a machine the algorithm by which the system works.


    # COMPLEXITY


    Complexity is a measure of the diverse behaviours that a system can potentially
    display. The more complex the system, the more unpredictable it becomes. However,
    we find a hidden sense of order and harmony in most systems after diligently studying
    their behaviour.


    Measuring and understanding the complexity of tasks is crucial in computer science
    because it provides the primary metric for how much computing power is required
    to resolve a task. As you can imagine, depending on the nature of the task, complexity
    can be exactly measured or subjectively qualified. For example, we can exactly
    quantify the complexity of a task required to sort a list of a million words in
    alphabetical order. However, the complexity of tasks such as creating a PowerPoint
    slide or writing a poem is much more subjective. Also, tasks considered easy for
    humans are not necessarily easy for computers and the other way around; some tasks
    require prior experience to be resolved.


    We humans often possess decades of experience in task resolution whereas computers
    are just very fast calculators with no experience. AI, however, is shifting that
    paradigm, emerging as computers with experience. The more a task is reliant on
    experience the harder it is to judge its complexity in mathematical terms. We
    hope that future AI will be as good at solving experience-related tasks (from
    creating better PowerPoint slides to more pressing problems such as protein folding
    control to resolve cancer) as computational tasks. Indeed, besides the possibility
    of Terminator-like scenarios, AI can also contribute to a future without disease,
    poverty, or suffering – solving impressively complex problems along the way.


    # COMPUTER


    A computer is a large calculator with attached memory storage. Computers are useful
    for their capacity to run advanced algorithms, the ability to listen for commands
    from various input channels, and their ability to send out commands or communication
    to other computers. World’s computational capacity is doubling every two years
    and is opening possibilities for resolving ever more complex tasks.


    Fun fact: The first electronic computer, `ENIAC`, weighed more than 25 metric
    tons and took up 167 square meters. Your smartphone is a trillion times faster,
    many times lighter, and definitely much smaller.


    # BUG


    A computer bug refers to a badly coded function in computer software. To prevent
    future disruptions of the services or worse, it is essential that bugs are fixed
    as early as possible in the coding process. More bugs can accumulate in a snowball
    effect, leading to a total system crash.


    Why a bug is called a bug? The fact is, our first computers were made out big
    electrical circuits; the interface that allowed the user to see the results of
    what was happening inside their computer relay systems was a system of rows of
    connected light bulbs. Literally, just a screen made of light bulbs. A light bulb
    that was turned off corresponded to a `0`; and if was on, it corresponded to a
    `1`. And it wasn’t just five or six light bulbs tucked inside the computers, but
    hundreds upon hundreds. I’ll give you a moment to imagine that. There was one
    problem, however. If one of the numerous light bulbs burned out or the relay system
    inside the circuit malfunctioned, then the entire experiment was broken and had
    to be restarted.


    In 1947 an actual bug was caught inside a relay system, probably attracted to
    the light and heat. The bug caused the system to crash but has been successfully
    removed and the system was working again. The term bug was coined.


    # PUNCH CARD – HISTORY


    The punch card was the first standard method of storing tabular data for automatic
    processing. It is an actual stiff paper card with 80 columns and 12 rows. To store
    information, holes are punched in specific areas. Think of it as a table containing
    12 possible answers for 80 questions, such as marital status, age, income range,
    and so on. The idea to utilize punch cards in the computer science industry came
    from the textile industry’s punch cards, which added massive automation to the
    weaving process decades earlier.

    '
  trans: '


    # 算法 (Algorithms)


    一个南瓜派配方是日常算法的一个很好的例子。你遵循用简单英语编写的逐步操作说明来完成任务。然而，大多数算法是为计算机系统创建的，并使用专为计算机解释和执行设计的编程语言进行编码。


    正如你所想象的，算法是自动完成部分或全部任务的核心工具。它们是我们向机器精确解释我们想要让它做什么的最直接的方式。


    英国科学家艾兰·图灵（Alan Turing）是现代计算机算法理论的先驱。在二战大战早期，图灵设计了一种算法，可以破解由德国 `Enigma` 机器创建的据认为不可破解的代码。图灵为他的
    `Bombe` 机器设计的算法为英国在二战中提供了关键优势。


    对于计算机算法语言来说，可移植性至关重要，这意味着它不仅能够运行在单台机器上，理想情况下还能在每台计算机上运行。组成算法常用的词汇有：“执行直到……”、“如果是这样……就执行这个……否则执行那个……”。像做南瓜派一样简单。


    AI 是一种自我编程的机器，意味着它通过简单观察他人的行为来设计自己的算法以解决任务。


    # 系统 (SYSTEM)


    系统是一组共同工作的独立实体，它们形成一个整体。这种表述的目的是从内部和外部研究这个整体。


    系统化思维是工程领域的一个热点。它允许工程师将复杂的概念解构为更小的部分，以便理解其功能。如果系统内部太复杂，我们可以进一步将部分划分为子系统，单独研究每一个部分。宇宙中的几乎一切都可以被视为一个系统：


    *   汽车是由发动机、方向盘、齿轮和安全带组成的系统

    *   地球是由大陆、海洋、风风和生物体组成的系统

    *   人类是由器官、大脑、中枢神经系统、骨骼和肌肉组成的系统

    *   政府是由行政、立法和司法权力组成的系统

    *   城市是当地商业、住房和法律的系统

    *   计算机程序是按顺序执行的各种算法组成的系统

    *   计算机主要是由 `CPU`、内存存储器和键盘组成的系统（其他都是配件）


    任何事物都可以被视为系统。我们是生活在更大系统内部的系统。为了研究复杂的系统，特别是机械或经济系统，工程师和经济学家传统上会将它们画在纸上，几乎每个系统都始于一个大矩形框。然后他们画出从外部世界进入系统的输入。追踪输入在系统中的整个历程，直到它们离开系统（通常是以修改后的形式出现）。后者被称为输出，当然我们也会画出它们。这就是我们到达最有趣部分的地方——我们现在紧密追踪了从进入系统的那一刻直到其输出过程的输入。这使我们能够从内向外地研究系统。


    系统思维是创新研究中的一个重要工具。它允许我们在脑中将一个产品或生产过程拆解为许多部分，并观察哪些部分可以得到改进。有时工程师采用系统思维来解决问题。他们可能会发现系统的预期输出要么变形了，要么没有发生，这意味着系统内部存在阻塞。


    系统分析允许完整理解系统，然后通过将系统工作的算法编码到机器中来实现它。


    # 复杂性 (COMPLEXITY)


    复杂性是系统可能展示的多样行为的衡量标准。系统越复杂，它就越不可预测。然而，在勤奋研究它们的行为后，我们会在大多数系统中发现一种隐藏的秩序和和谐。


    衡量和理解任务的复杂性在计算机科学中至关重要，因为它提供了解决任务所需计算力的首要指标。正如你所想象的，取决于任务的性质，复杂性可以精确测量，也可以进行主观定性。例如，我们可以精确量化对一个百万单词的列表按字母顺序排序的任务所需的所需的复杂性。然而，创建
    PowerPoint 幻灯片或写诗等任务的复杂性则要主观得多。此外，对人类来说容易的任务对计算机来说并不一定容易，反之亦然；某些任务需要先验经验才能解决。


    我们人类在任务解决方面通常拥有几十年的经验，而计算机只是没有经验的快速计算器。然而，AI 正在改变这一范式，作为具有经验的计算机出现。一个任务越依赖于经验，用用数学术语来判断其复杂性就越困难。我们希望未来的
    AI 在解决与经验相关的任务（从创建更好的 PowerPoint 幻灯片到更紧迫的问题，如蛋白质折叠控制以治疗癌症）方面与计算任务一样出色。事实上，除了《终结者》式的场景之外，AI
    还可以为一个没有疾病、贫困或痛苦的未来做出贡献——在此过程中解决极其复杂的问题。


    # 计算机 (COMPUTER)


    计算机是一个带有内存存储器的大型计算器。计算机的用处在于它们运行高级算法的能力、从各种输入通道监听命令的能力以及向其他计算机发送命令或通信的能力。世界的计算能力每两年翻一倍，为解决日益复杂的任务开启可能性。


    冷知识：第一台电子计算机 `ENIAC` 重量超过 25 吨，占用空间 167 平方米。你的手机快一万倍，轻很多倍，而且显然小得多。


    # 错误 (BUG)


    计算机 bug 指的是计算机软件中编写不当的函数。为了防止未来服务的中断或更糟糕的情况，在编码过程中尽早修复 bug 是至关重要的。更多的 bug 可能会像雪球效应一样积累，导致整个系统崩溃。


    为什么错误被称为 bug？的事实是，我们的第一批计算机是由大型电路制成的；用户查看计算机继电器系统内部发生情况的结果界面是由行连接的灯泡组成的系统。字面上说，就是一个由灯泡组成的屏幕。关闭的灯泡对应
    `0`；如果亮着，则对应 `1`。


    在 1947 年，一个真实的 bug 被捕捉在一个继电器系统中，可能是被光和热量吸引的。这个 bug 导致了系统崩溃，但已被成功移除，系统恢复了运行。bug
    这个词由此诞生。


    # 打孔卡 – 历史 (PUNCH CARD – HISTORY)


    打孔卡是用于自动处理的表格数据的第一个标准方法。它是一张具有 80 列 12 行的硬纸卡片。为了存储信息，会在特定区域打孔。将其想象成一个包含 80 个问题的
    12 个可能答案的表格，例如婚姻状况、年龄、收入范围等。在计算机科学行业利用打孔卡的想法源于几十年前纺织业的打孔卡，它为织造工艺增加了巨大的自动化程度。


    '
