- raw: 'Popularized as new age cowboys, entrepreneurs explore industrial frontiers
    armed with their charisma and futuristic vision. In practice, an entrepreneur
    is a person who sets up a new business from scratch, most notably leveraging innovations
    and technologies borrowed from one field and applied in a different field. Entrepreneurs
    rely on venture capitalists for funding and all hope to one day create the next
    unicorn.


    STARTUP


    A startup is a company created by one or several entrepreneurs which is in its
    early stages of operations. Startups usually aim at disrupting old fashioned businesses
    by leveraging new technologies and discoveries, which traditional companies are
    too slow to adopt.


    Startups usually have a “built to scale” vision from day one, and often require
    substantial funding before they can transform their prototype into a viable product
    ready for the market. Every startup wants to either become a Unicorn or be acquired
    by a big company.


    A unicorn is a startup that has reached a value of over $1 billion, such as Uber,
    Epic Games, WhatsApp, Airbnb, SpaceX, and more. The term was coined by venture
    capitalist, Aileen Lee in 2013, in reference to a mythical creature which is virtually
    impossible to find.


    VENTURE CAPITAL


    Venture capital is a type of financing that investors provide to startup companies
    and small businesses with high potential for growth and good projected future
    cash flow. All venture capitalists hope they are investing in the next Unicorn.


    IPO


    “If one percent of Aramco is offered to the market, just one percent,


    it will be the biggest IPO on earth.”


    \- Deputy Crown Prince of Saudi Arabia, Mohammed bin Salman, in 2016


    IPO stands for Initial Public Offering and is basically the process of introducing
    company’s shares onto a stock market, making them available to everyone and not
    only the private investors. IPO is the last stage of growth for any company and
    takes place for many reasons. An IPO allows a company to raise a lot of cash,
    often needed for an expansion and globalization of its operations. It is also
    a great way for the early venture investors to finally cash out and take their
    profits.


    IPOs are conducted by major Investment Banks such as Goldman Sachs and JP Morgan
    and usually get to keep around 3% of the whole deal, which is a lot. Launching
    an IPO is like launching new money. Only exception is that this money is not guaranteed
    by the government, in exchange, the investor is rewarded with dividends and hopefully
    growing capital valuation.


    The biggest sector for IPO business in 2019 was Technology sector, with Uber,
    Lyft and Alibaba leading the way.


    The biggest single IPO in history however is not attributed to a Tech giant but
    to an oil & gas company. Saudi Aramco’s long awaited IPO, which took place in
    late 2019, valued the company at $1.7 Trillion.


    OUTSOURCING


    Outsourcing is the migration of a working unit from local headquarters to a country
    with a cheaper labour force, such as India for software development; China for
    manufacturing; or Poland for administrative tasks.


    One may think of outsourcing in reference to Adam Smith’s theory of economic improvement
    through labour division applied on a global level.


    Outsourcing became an integral part of business strategies throughout the 1990s.
    But as the labour providing countries went through economic booms, prices of workers
    have gradually increased and now for the first time are no longer economically
    viable for some home businesses. This is especially true for software development,
    where we are now witnessing a reverse trend where jobs are being insourced back
    to European and American headquarters. Increasing cost reduction thanks to automation
    and AI is accelerating the insourcing trend.


    THE GIG ECONOMY


    A gig economy is an economy which is increasingly reliant on flexible and temporary
    jobs performed by freelancers and consultants rather than traditional full time
    employees. The gig economy phenomenon is growing worldwide due to the rapid evolution
    of technological and business landscapes to which many internal company employees
    have neither time nor wish to adapt.


    As a consequence, companies prefer to hire temporary workers that they can easily
    get onboard for conducting digital transformation and automation projects, then
    easily dispose of when budgets tighten ,like during the financial crisis of 2008
    or COVID-19 lockdown. Another advantage is that consultants and freelancers usually
    have a broader range of experience and are knowledgeable about the competition,
    which is valuable information that they can bring to the hiring company.


    GAFAM


    GAFAM is an acronym describing the big five giants of the web: Google, Amazon,
    Facebook, Apple, and Microsoft. GAFAM is used to describe a quasi-total dominance
    of the entire internet that these five companies have amassed, legitimately classifying
    them as digital oligopolies. There is an ongoing concern about their world domination
    and influence, especially due to the staggering amounts of data GAFAM collects
    and holds, including tons of personal data.


    Even more concerning is their active involvement in the AI industry, as data is
    the primary and necessary source for training machine learning models. GAFAM is
    well-positioned to maintain a monopoly on the growing AI market, making it almost
    impossible for outsiders to break in. Google, Amazon, and Microsoft are also the
    biggest cloud providers, possessing quasi-unlimited computing resources needed
    to train the biggest AI models on the planet.


    BATX is the Chinese version of GAFAM, composed of Baidu, Alibaba, Tencent, and
    Xiaomi. BATX was developed during the Golden Shield initiative, which was propelled
    by the Chinese government to deny GAFAM access to the Chinese media market. 


    DIGITAL TRANSFORMATION


    Digital transformation describes a wave of business process transformations from
    the old paper and physical-based processes to the new partially or fully-digitized
    processes. Banks, insurers, and public services are the biggest clients of the
    digital transformation consulting industry. After a company has gone through a
    wave of digital transformations, it is then ready to embrace AI and RPA-based
    technologies to further automate or augment the company’s operations.


    Digital transformations vastly modify customer experience, often for the better.
    The Holy Grail is, of course, a real-time service to the customer like Netflix,
    which allows you to create an account and start using the service within minutes.
    Public services are also undergoing digital transformation and adopting the real-time
    service mentality. Soon, if you get flashed while driving too fast, instead of
    waiting a month for a letter from police, you will receive an instant mobile notification
    with an exact settlement fee. Filing taxes will also be much easier.


    SELF-DRIVING CARS


    A self-driving car is a vehicle capable of autonomously navigating from point
    A to point B safely and in compliance with road traffic regulations. These cars
    are usually equipped with cameras, proximity sensors, and an AI computer brain
    infused with millions of miles of driving training, both in physical and simulated
    environments. Just like AI learned to beat the world chess champion in past decades,
    today AI is capable of navigating a car better than most human drivers.


    This field also includes self-driving trucks. For better or worse, this technology
    could put an end to the largest employment sector in the United States – truck
    and taxi driving – effectively rendering tens of millions of employees jobless.
    It is currently up to policymakers to manage the transition, but drivers should
    seriously be considering their exit routes. 


    ALGORITHMIC TRADING'
  fmt: "\nPopularized as new age cowboys, entrepreneurs explore industrial frontiers\
    \ armed with their charisma and futuristic vision. In practice, an entrepreneur\
    \ is a person who sets up a new business from scratch, most notably leveraging\
    \ innovations and technologies borrowed from one field and applied in a different\
    \ field. Entrepreneurs rely on venture capitalists for funding and all hope to\
    \ one day create the next unicorn.\n\n# STARTUP\n\nA startup is a company created\
    \ by one or several entrepreneurs which is in its early stages of operations.\
    \ Startups usually aim at disrupting old fashioned businesses by leveraging new\
    \ technologies and discoveries, which traditional companies are too slow to adopt.\n\
    \nStartups usually have a “built to scale” vision from day one, and often require\
    \ substantial funding before they can transform their prototype into a viable\
    \ product ready for the market. Every startup wants to either become a Unicorn\
    \ or be acquired by a big company.\n\nA unicorn is a startup that has reached\
    \ a value of over $1 billion, such as `Uber`, `Epic Games`, `WhatsApp`, `Airbnb`,\
    \ `SpaceX`, and more. The term was coined by venture capitalist, `Aileen Lee`\
    \ in 2013, in reference to a mythical creature which is virtually impossible to\
    \ find.\n\n# VENTURE CAPITAL\n\nVenture capital is a type of financing that investors\
    \ provide to startup companies and small businesses with high potential for growth\
    \ and good projected future cash flow. All venture capitalists hope they are investing\
    \ in the next Unicorn.\n\n# IPO\n\n“If one percent of `Aramco` is offered to the\
    \ market, just one percent, it will be the biggest IPO on earth.”\n\n\\- Deputy\
    \ Crown Prince of Saudi Arabia, `Mohammed bin Salman`, in 2016\n\n`IPO` stands\
    \ for `Initial Public Offering` and is basically the process of introducing company’s\
    \ shares onto a stock market, making them available to everyone and not only the\
    \ private investors. `IPO` is the last stage of growth for any company and takes\
    \ place for many reasons. An `IPO` allows a company to raise a lot of cash, often\
    \ needed for an expansion and globalization of its operations. It is also a great\
    \ way for the early venture investors to finally cash out and take their profits.\n\
    \n`IPOs` are conducted by major Investment Banks such as `Goldman Sachs` and `JP\
    \ Morgan` and usually get to keep around 3% of the whole deal, which is a lot.\
    \ Launching an `IPO` is like launching new money. Only exception is that this\
    \ money is not guaranteed by the government, in exchange, the investor is rewarded\
    \ with dividends and hopefully growing capital valuation.\n\nThe biggest sector\
    \ for `IPO` business in 2019 was Technology sector, with `Uber`, `Lyft` and `Alibaba`\
    \ leading the way.\n\nThe biggest single `IPO` in history however is not attributed\
    \ to a Tech giant but to an oil & gas company. `Saudi Aramco`’s long awaited `IPO`,\
    \ which took place in late 2019, valued the company at $1.7 Trillion.\n\n# OUTSOURCING\n\
    \nOutsourcing is the migration of a working unit from local headquarters to a\
    \ country with a cheaper labour force, such as `India` for software development;\
    \ `China` for manufacturing; or `Poland` for administrative tasks.\n\nOne may\
    \ think of outsourcing in reference to `Adam Smith`’s theory of economic improvement\
    \ through labour division applied on a global level.\n\nOutsourcing became an\
    \ integral part of business strategies throughout the 1990s. But as the labour\
    \ providing countries went through economic booms, prices of workers have gradually\
    \ increased and now for the first time are no longer economically viable for some\
    \ home businesses. This is especially true for software development, where we\
    \ are now witnessing a reverse trend where jobs are being insourced back to European\
    \ and American headquarters. Increasing cost reduction thanks to automation and\
    \ \n\n# THE GIG ECONOMY\n\nA gig economy is an economy which is increasingly reliant\
    \ on flexible jobs rather than full time.\n\n# GAFAM\n\n`GAFAM` is an acronym\
    \ describing the big five giants of the web: `Google`, `Amazon`, `Facebook`, `Apple`,\
    \ `Microsoft`.\n\n# BATX\n\n`BATX` is the Chinese version of `GAFAM`, composed\
    \ of `Baidu`, `Alibaba`, `Tencent`, and `Xiaomi`.\n\n# DIGITAL TRANSFORMATION\n\
    \nDigital transformation describes a wave of business process transformations\
    \ from the old paper and physical-based processes to the new partially or fully-digitized\
    \ processes. Banks, insurers, and public services are the biggest clients of the\
    \ digital transformation industry.\n"
  trans: '


    创业者被大众称为“新时代的牛仔”，他们凭借自己的魅力和前瞻性的视野探索工业前沿。在实践中，创业者是指从零开始建立新业务的人，最显著的特点是利用从一个领域借鉴的创新和技术将其应用于另一个领域。创业者依赖风险投资人提供资金，并都希望有一天能创造出下一个独角兽。


    # 初创企业


    初创公司是由一位或多位创业者创建的处于运营阶段的公司。初创公司通常旨在利用传统公司无法快速采用的新技术和发现来打破旧业务模式。


    初创公司从第一天起通常就有“为了规模而构建”的愿景，并且在将其原型转换为面向市场的可行产品之前通常需要大量的资金。每家初创公司都希望成为独角兽或被大公司收购。


    独角兽是指价值超过 10 亿美元的初创公司，例如 `Uber`、`Epic Games`、`WhatsApp`、`Airbnb`、`SpaceX` 等。该术语是由风险投资人
    `Aileen Lee` 在 2013 年提出的，指的是一种几乎无法找到的神话生物。


    # 风险投资


    风险投资是投资者为具有高增长潜力和良好预期现金流的初创公司和小企业提供的一种融资类型。所有风险投资人均希望自己投资的是下一个独角兽。


    # IPO（首次公开募股）


    “如果向市场提供 `Aramco` 的 1%，仅是 1%，也将是地球上最大的 IPO。”


    \- 沙特阿拉伯副王储储 `Mohammed bin Salman`，2016 年


    `IPO` 代表 `Initial Public Offering`（首次公开募股），基本上是将公司股票引入股票市场的过程，使所有人都能购买，而不仅仅是私人投资者。`IPO`
    是任何公司增长道路的最后阶段，其发生有许多原因。`IPO` 允许公司募集大量资金，这些资金通常用于业务的扩张和全球化。这也是早期风险投资者最终变现并获取利润的极佳方式。


    `IPOs` 由 `Goldman Sachs` 和 `JP Morgan` 等大型投资银行执行，它们通常可以保留整个交易额约 3%的佣金，这是一笔巨款。启动
    `IPO` 就像是发行新货币。唯一的例外是这笔钱不受政府担保，作为交换，投资者获得了分红回报，并希望资本估值不断增长。


    2019 年 `IPO` 业务最大的领域是技术领域，`Uber`、`Lyft` 和 `Alibaba` 领先。


    然而，历史上最大的单一 `IPO` 并不归属于科技巨头，而是归属于一家油气公司。`Saudi Aramco` 期待已久的 `IPO` 于 2019 年底举行，该公司估值达
    1.7 万亿美元。


    # 外包


    外包是将工作单元从当地总部迁移到劳动力成本更低的国家，例如用于软件开发的 `India`；用于制造的 `China`；或用于行政任务的 `Poland`。


    人们可能会联系 `Adam Smith` 关于在全球范围内应用劳动分工来实现经济改进的理论来考虑外包。


    外包在整个 20 世纪 90 年代成为商业战略中不可或缺的一部分。但随着提供劳动力的国家经历了经济繁荣，工人的价格逐渐上涨，现在对于某些本土企业来说，在经济上首次已不再可行。这在软件开发领域尤为如此，我们现在正在目睹一种反向趋势，即工作正在回流到欧洲和美国的总部。得益于自动化，成本降低不断增加和


    # 零工经济


    零工经济是一种日益依赖灵活工作而非全职工作的经济模式。


    # GAFAM


    `GAFAM` 是描述互联网五大巨头的缩写：`Google`、`Amazon`、`Facebook`、`Apple`、`Microsoft`。


    # BATX


    `BATX` 是 `GAFAM` 的中文版，由 `Baidu`、`Alibaba`、`Tencent` 和 `Xiaomi` 组成。


    # 数字化转型


    数字化转型描述了旧的纸质和物理流程向新的部分或完全数字化流程的转型浪潮。银行、保险和公共服务是数字化转型行业最大的客户。


    '
