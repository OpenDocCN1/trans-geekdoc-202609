  trans: "\n虽然屈从勒索者的要求似乎是个坏主意，但现实情况是，在不支付赎金的情况下通常会导致更大的损失。例如，2018 年，亚特兰大市拒绝支付 51,000\
    \ 美元的赎金，结果导致了超过 900 万美元的损害损失。\n\n想找另一个关于勒索软件的精彩故事吗？那么不用看 Eurofins 的案例了。Eurofins\
    \ 是一家大型欧洲医药、食品和环境实验室检测服务提供商，在 800 多个实验室雇有 45,000 名员工。棘手的地方在于：Eurofins 还提供网络安全援助，是英国最大的取证服务提供商。Eurofins\
    \ 每年参与超过 70,000 起调查，其中包括网络取证案件。尽管作为网络安全服务提供商，但他们在该领域的专业知识不足以让 Eurofins 免于遭受灾难性勒索软件的攻击，该攻击导致其大部分业务陷入瘫。支付给黑客的官方赎金金额尚未知，但可以肯定，Eurofins\
    \ 为了重新获得控制权付出了不小的代价。\n\n## 钓鱼攻击 (Phishing)\n\n黑客发送的伪造电子邮件、营销活动或祝贺信息，旨在诱骗受害者分享姓名、信用卡号、出生日期和其他敏感信息。\n\
    \n很有可能你的人生中至少有一次收到过一封祝贺你在国家彩票中中中百万美元的电子邮件，邮件发件人友善地要求你输入银行账户信息以便进行转账。这就是钓鱼攻击。\n\
    \n黑客越来越多地利用机器学习来选择最有效的活动方案。同时，反垃圾软件也日益依赖机器学习来更好地保护其客户。这是一场猫鼠游戏，而用户就是那个被垂涎的奶酪。\n\
    \n这里有一个钓鱼邮件的示例：\n\n```\n“国家乐票 \n\n客户服务\n\n编号：RNXF/34548121548451\n\n恭喜你！！！！\n\n\
    我们荣幸地向你宣布，你已在 2020 年 4 月 15 日举行的美国国家乐票（US NATIONAL LOTTO）活动中中奖。与票据号码 34548121548451\
    \ 关联的邮箱地址中了幸运数字：15-4-22-10-12，这让你有获得二等奖的资格。恭喜你！你已获批准领取总计 760,000 美元（大陆柒拾陆万整）现金。\n\
    \n所有参与者都是由美国政府感谢，从全球网站通过计算机抽奖系统随机选出的，该系统从 10 万多家公司和小型企业中提取数据，旨在支持受新冠肺炎（COVID-19）危机影响的经济。\n\
    \n中奖金额将由我们的支付提供商 Worldlink 发给你。一旦你向他们提供联系方式和支付详情，Worldlink 代理将立即启动程序以协助发放资金。\n\
    \n重要提示：出于安全考虑，请妥善保管你的个人和财务信息，不要与除 Worldlink 代理以外的任何人交流，该代理将在你发送联系方式后立即通过电话与你联系。这也是一种补充预防措施，以避免重复申领和对彩票计划的违规滥用。\n\
    \n如需申领，请联系 Worldlink 的信托代理 Paul Smith 先生（richard.smith.worldlink@hotmail.com)”\n\
    ```\n\n虽然认为会有人掉入这种骗局似乎很愚蠢，但实际上，每年都有成千上万的无辜用户成为这类钓鱼计划的受害者。\n\n## 防火墙 (Firewall)\n\
    \n防火墙是你的私有网络与开放公共网络之间最重要的防御机制之一。本质上，防火墙包含了谁有权访问你的访问网络的规则。\n\n一旦攻击者绕过防火墙，它就失效了，唯一的希望就是你的防病毒软件能检测到正在运行的恶意代码或活动。\n\
    \n击败防火墙三种主要方法：\n\n1. **绕过它** —— 大多数公司拥有大量连接的大网络。通常并不是所有的连接都记录在公司的 IT 账本上，导致防火墙的某些设备被遗忘或根本未被注意到，例如新到的打印机的连接。如果黑客发现一个可以访问网络的连接，他们的任务就完成了。\n\
    2. **溜入防火墙** —— 伪装成经过授权的用户。这取决于防火墙的类型，可能是简单的、困难的或几乎是不可能的。配置不当的防火墙会留下可以被利用的漏洞。\n\
    3. **接管防火墙** —— 同样取决于防火墙软件；它可能很容易，即使对于超级黑客来说可能非常困难。\n\n作为一点历史背景，防火墙的概念最早被用于煤炭驱动的火车。在煤力引擎的早期，火灾有时会发生在机舱之外并蔓延到客厢。为了防止此类灾难发生，工程师们实际上开始在机舱内建造一道铁墙，以防止火蔓延到火车的其他部分。\n\
    \n“社会工程可以绕过所有技术，包括防火墙。”\n- 凯文·米特尼克（Kevin Mitnick），90 年代最受通缉的黑客\n\n## ISO 27000\
    \ 系列\n\nISO `27K`（也称为 ISMS 标准族）是一系列帮助组织改进安全措施的最佳实践。每个主要的云提供商相对于你自己的 IT 基础设施的优势在于，它们都通过了\
    \ `ISO 27k` 认证。如果你是在日常运营中广泛使用 IT 的企业，获得 `ISO 27K` 认证或迁移到云端是确保安全环境的关键步骤。\n\n##\
    \ Crash 项目 (Crash Project)\n\n`CRASH` 是一种全新的计算机网络防御系统，类似于人类免疫系统，由美国国防部开发。`CRASH`\
    \ 是一项极具前景的尝试，旨在大幅改进传统的防火墙防病毒架构。受人类免疫系统抵御感染方式的启发`CRASH` 将允许计算机在病毒攻击后进行自我恢复和修复。\n\
    \n传统防病毒软件的一个问题是，新的恶意软件在检测到病毒扫描时非常擅长变异或关闭。这种行为类似于火车上的“逃车票”，一旦票务员进入车厢，它就会跑并躲进卫生间里。通过这种新的\
    \ `CRASH` 方法，火车上的所有乘客在票务员到达时将同时处于可见。因此，入侵者无法在系统中长时间不被察觉。\n\n## 纳米技术 (Nanotechnology)\n\
    \n"
