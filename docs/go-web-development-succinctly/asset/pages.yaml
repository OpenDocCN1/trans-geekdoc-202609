    one of the many capabilities of a template—the ability to iterate over a set of
    results, then apply the appropriate formatting to each of them.


    In order to achieve this, we must use the {{range}} {{end}} construct. We''ll
    use the following template to build out our table. Everything between {{range}}
    and {{end}} will be repeated for every member of the object we pass into it.


