    # # Working with sessions


    In order to work with sessions in Go, I''m going to suggest that we revisit the
    Gorilla Toolkit''s sessions module because, in my opinion, it''s a much cleaner
    implementation than the native Go approach.


    Install it from GitHub as follows:


    ```

    go github.com/gorilla/sessions

    ```


    # ## Basics


    The following code demonstrates the basics of using the **gorilla/sessions** package
    to create and authenticate a session, retrieve the session, set some values, then
    the session.'
