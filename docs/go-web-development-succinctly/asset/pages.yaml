- pgno: 15
  md: "# Chapter 2 Serving and Routing\n\nGo's net package facilitates all network\
    \ communications in Go programs, whether it's over HTTP, TCP/IP, WebSockets, or\
    \ any other standard network protocol.\n\nOf course, because this e-book addresses\
    \ web development, we are primarily concerned with HTTP, which means the main\
    \ package we are using is net/http.\n\nIn this chapter, we'll look at the basic\
    \ requirements of any Go web application—serving and routing—and how you can use\
    \ net/http and complementary packages to implement them.\n\n# Go as a simple web\
    \ server\n\nBack in the old days, web servers did little more than serve files\
    \ that resided in a directory that server. If that's all we want, now can do something\
    \ very in Go using the net/http package in just a few lines of code.\n\n> Code\
    \ Listing 1: Go as a Web Server\n\n```\npackage main\n\nimport (\n    \"net/http\"\
    \n)\n\nfunc main() {\n    http.ListenAndServe(\":8999\", http.FileServer(http.Dir(\"\
    /var/www\\)))\n}\n```\n\nIt's very basic, but our program fulfills the core responsibilities\
    \ of any web server—namely, listening to a request and serving a response. What's\
    \ more, because it doesn't have to worry about all the other issues that a more\
    \ traditional web server must, the program is lightning fast.\n\nIn this example,\
    \ we call the http.ListenAndServe() function to serve all requests on port 8999\
    \ to an http.FileServer handler method, which in turn accepts the directory on\
    \ the server that we want to serve files from. Easy!\n\nIf you run the program\
    \ go run <program_name.go> and enter http://localhost:8999/ in your browser's\
    \ address bar, followed by the name of a file that exists in /var/www on your\
    \ server, you'll see that file's contents displayed—as in Figure 4."
  merge: -1
  img_proc: true
- pgno: 16
  md: '![](img/cdabbe899d95a91197e7ec37cc1c8048_16_0.png)


    However, most modern web applications require a bit more than this from the server.
    And keep in mind, you''re not always going to be sending static content. Increasingly,
    you will be called upon to generate content dynamically, perhaps from the contents
    of a database. In this case, a physical file location doesn''t make much sense.


    And suppose you have a more complex site structure in which your application''s
    files are spread around various subdirectories? For example, www.mysite.com/about/aboutus.html
    and www.mysite.com/blog/blog.html? This approach won''t work. So, you''ll need
    better control over the URLs of your application can accept. You can achieve this
    by using the net/http package''s routing capabilities.


    # Simple serving and routing


    Go relies on two main components to process HTTP requests—a multiplexor and handlers.
    A multiplexor (or "mux") is essentially an HTTP request router. In Go''s net/http
    package, the multiplexor functionality is provided by ServeMux and the default
    mux is DefaultServeMux.


    Intuitive, eh?'
  merge: -1
  img_proc: true
- pgno: 17
  md: "ServeMux compares incoming requests against a list of predefined URL paths,\
    \ then calls the appropriate handler (a function that you define) for each path\
    \ when there is a match.\n\nLet's first have a look at the code, then we'll examine\
    \ what's going on.\n\nCode Listing 2: Basic Serving and Using Net/http\n\n```\n\
    package main\n\nimport (\n    \"fmt\"\n    \"html\"\n    \"log\"\n    \"net/http\"\
    \n    \"time\"\n)\n\nfunc main() {\n    http.HandleFunc(\"/\", showInfo)\n   \
    \ http.HandleFunc(\"/site\", serveFile)\n    err := http.ListenAndServe(\":8999\"\
    , nil)\n    if err != nil {\n        log.Fatal(\"ListenAndServe: %v\", err)\n\
    \    }\n}\n\nfunc showInfo(w http.ResponseWriter, r *http.Request) {\n    fmt.Fprintf(w,\
    \ \"Current time: %v\", time.Now())\n    fmt.Fprintf(w, \"URL Path: %s\", html.EscapeString(r.URL.Path))\n\
    }\n\nfunc serveFile(w http.ResponseWriter, r *http.Request) {\n    http.ServeFile(w,\
    \ r, \"index.html\")n}\n\n```\n\nNotice the main() function, which is the entry\
    \ point into the program, sets up some server routes by using the http.HandleFunc(route,\
    \ handler) method to map a URL route to a function that will respond to any requests\
    \ coming in that route.\n\nThe program next calls the http.ListenAndServe() method,\
    \ which starts an HTTP server at a specified address (in this case, the local\
    \ machine on port 8999) and the mux in this instance is nil, which lets Go use\
    \ DefaultServeMux.\n\nThe handler functions do different things depending on whether\
    \ the URL accessed is at the root of the site (\"/\") or at \"/site\". However,\
    \ in both cases their method signatures must implement both http.ResponseWriter\
    \ and http.Request. If a handler does not implement both of these gets called\
    \ via http.HandleFunc(), you'll see that Go will raise a compile-time error."
  merge: -1
  img_proc: true
- pgno: 18
  md: 'If the user visits /site, the http.ServeFile() method handles the request and
    returns the index.html page that resides in the same directory as the application.
    You can use http.ServeFile() to send any static file in the response.


    If the user visits the root location, showInfo() gets called and will display
    the current time and whichever path user entered beyond the root URL. The application
    extracts this information using the URL.Path property of the http.Request object
    that gets passed to the handler. The response is generated by http.ResponseWriter.


    Start the program by issuing go run <program_name.go> from your IDE or simply
    via the command line. Next, visit localhost:8999 in your browser. Try various
    combinations to test its functionality.


    For example, entering http://localhost:8999 results in the dynamically generated
    page in Figure 5.


    ![](img/cdabbe899d95a91197e7ec37cc1c8048_18_0.png)


    Figure 5: Visiting the Root of the Web Application


    Entering any subroutine (for example, localhost:8999/hello/there/from/from/golang)
    displays the time and date and the subroutine entered, as we see in Figure 6.'
  merge: -1
  img_proc: true
- pgno: 19
  md: "![](img/cdabbe899d95a91197e7ec37cc1c8048_19_0.png)\n\nFigure 6: Visting a Subroute\n\
    \nEntering localhost:8999/site displays the index.html page.\n\n![](img/cdabbe899d95a91197e7ec37cc1c8048_19_1.png)\n\
    \nFigure 7: Visiting/Site\n\nLets expand our ability to serve static files in\
    \ this example. Suppose that the URL in the request starts with /static/ and we\
    \ want to strip the /static part of the URL in order to look for the file referenced\
    \ in the remaining path the /var/www directory. We can use the StripPrefix function\
    \ to achieve this, as we see in Code Listing 3.\n\nCode Listing 3: Using StripPrefix\n\
    \n```\npackage main\nimport (\n    \"fmt\"\n    \"html\"\n    \"log\"\n)\n```"
  merge: -1
  img_proc: true
- pgno: 20
  md: "```\n\"net/http\"\n\"time\"\n\nfunc main() {\n\thttp.HandleFunc(\"/\", showInfo)\n\
    \tfiles := http.FileServer(http.Dir(\"/var/www\"))\n\thttp.Handle(\"/site/\",\
    \ http.StripPrefix(\"/site/\", files))\n\terr := http.ListenAndServe(\":8999\"\
    , nil)\n\tif err != nil {\n\t\tlog.Fatal(\"ListenAndServe: \", err)\n\t}\n}\n\
    ```\n\n```\nfunc showInfo(w http.ResponseWriter, r *http.Request) {\n\tfmt.Fprintf(w,\
    \ \"current time: %s\", time.Now())\n\tfmt.Fprintf(w, \"URL Path: %s\", html.EscapeString(r.URLPath))\n\
    }\n```\n\nNote in this example we're not calling HandleFunc, but Handle. That's\
    \ because the FileServer returns its own handler that we can pass to the mux using\
    \ Handle (instead of explicitly creating our own handler function).\n\nSo, you\
    \ can see that it's straightforward to get a site up and running that is self-serving\
    \ (no separate web server required) and lets you respond to some simple requests.\n\
    \n# Middleware\n\nIn development, middleware is code that sits between the web\
    \ request and your route handler. Middleware connects reusable bits of code that\
    \ you can use to perform tasks that must occur before the handler is called or\
    \ afterwards.\n\nFor example, you might want to check the status of a database\
    \ connection or authenticate a user before routing request. You might also want\
    \ to compress the content of a response or limit the amount of times a specific\
    \ handler is called—perhaps as part of some restriction that you place on users\
    \ who access your web service free of charge.\n\nCreating middleware is simply\
    \ a matter of chaining handlers and handler functions, and it's something you\
    \ will see—use a in Go web development.\n\nThe basic idea is that you pass a handler\
    \ function—let's call it f2—into another handler function—let's call this one\
    \ f1—as a parameter. Handler f1 gets called when the route that triggers it is\
    \ visited. f1 does some work, then calls f2."
  merge: -1
  img_proc: true
- pgno: 21
  md: "Of course, you could have f2 directly. However, this is not ideal because we\
    \ typically want to achieve a clear separation of concerns, and therefore your\
    \ handler code should really be limited to processing the request and not doing\
    \ whatever f2 is designed to do.\n\nHere's the basic idea—instead of dealing with\
    \ the response as part of your handler, you simply pass the next handler in the\
    \ chain to it.\n\nFunctions that accept another handler function as a parameter\
    \ and return a new one can perform tasks before or after the handler is called\
    \ (or both before and after) and can even choose not to call the original handler\
    \ at all (if that is your intention).\n\nConsider the example in Code Listing\
    \ 4.\n\n# Code Listing 4: Middleware Example 1\n\n```\npackage main\n\nimport\
    \ (\n    \"fmt\"\n    \"net/http\"\n)\n\nfunc middleware1(next http.Handler) http.Handler\
    \ {\n    return http.HandlerFunc(func(w http.ResponseWriter, r *http.Request)\
    \ {\n        fmt.Fprintln(w, \"Executing middleware1()...\")\n        next.ServeHTTP(w,\
    \ r)\n        fmt.Fprintln(w, \"Executing middleware1() again...\")\n    })\n\
    }\n\nfunc middleware2(next http.Handler) http.Handler {\n    return http.HandlerFunc(func(w\
    \ http.ResponseWriter, r *http.Request) {\n        fmt.Fprintln(w, \"Executing\
    \ middleware2()...\")\n        if r.URL.Path != \"/\" {\n            return\n\
    \        }\n        next.ServeHTTP(w, r)\n        fmt.Fprintln(w, \"Executing\
    \ middleware2() again...\")\n    })\n}\n\nfunc final(w http.ResponseWriter, r\
    \ *http.Request) {\n    fmt.Fprintln(w, \"Executing final()...\")\n    fmt.Fprintln(w,\
    \ \"Done\")\n}\n\nfunc main() {\n    finalHandler := http.HandlerFunc(final)\n\
    ```"
