    # # Windows


    The easiest way to install the Go tools in Windows is to download the MSI installer,
    launch it, then follow the prompts. By default, Go installs everything in C:\Go,
    then adds C:\Go\bin to your PATH variable.


    Alternatively, if you rather have more control over your environment variables,
    you can download the .zip file and extract it to a directory of your choice. In
    this case, you''ll need to configure the environment variables yourself.


    You can set environment variables through the Environment Variables button on
    the Advanced tab of the System control panel. Some versions of Windows provide
    this control panel through the Advanced Settings option opening the System control
    panel.'
