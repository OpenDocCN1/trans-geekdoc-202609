    \ this follows:\n\n```\nfunc (a *AfterMiddleware) ServeHTTP(w http.ResponseWriter,\
    \ r *http.Request) {\n\ta.handler.ServeHTTP(w, r)\n\tw.Write([]byte(\"+++ Hello\
    \ from middleware! +++\"))\n}\n```\n\nNow, the response consists of whatever myHandler\
