- pgno: 45
  md: '# Using conditionals in templates


    You can offload the evaluation of conditional expressions to your template using
    {{if}} {{else}}{{end}}.


    Go supports several functions that support basic types, such as eq (equals), ne
    (not equal to), or gt (greater than) that you can use for building expressions.


    The use of conditional expressions in templates is best demonstrated by an example.


    Let''s say that we''re only interested in populations of less than 5,000,000.
    Everything else we''ll count as huge and not displaying the actual figure.


    Code Listing 16 shows our template.


    > Code Listing 16: Template with Conditional Expression


    ```

    <html>

    <head>

    <title>City Search</title>

    </head>

    <body>

    <h1>Search Results</h1>

    <table border=''1''>

    <tr>

    <th>City</th>

    <th>Country Code</th>

    <th>Population</th>

    </tr>

    {{range}}

    <tr>

    <td>{{.Name}}</td>

    <td>{{.CountryCode}}</td>

    <td>


    <td>

    {{if gt .Population 5000000}} <b>HUGE</b>

    {{else}} {{.Population}}

    {{end}}

    </td></td>

    </tr>

    {{end}}

    </table>

    </body>

    </html>

    ```


    Figure 18 shows the result.'
