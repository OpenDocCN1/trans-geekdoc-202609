- pgno: 27
  md: "```\nrouter.Headers(\"X-Requested-With\", \"XMLHttpRequest\")\n```\n\nQuery\
    \ values:\n\n```\nrouter.Queries(\"key\", \"value\")\n```\n\nCustom matching functions\
    \ that you define:\n\n```\nrouter.MatcherFunc(func(r *http.Request, match *RouteMatch)\
    \ bool {\n  // do something\n}\n```\n\nYou can combine multiple matchers in one\
    \ route by chaining function calls:\n\n```\nrouter.HandleFunc(\"/products\", productHandler)\n\
    Host(\"www.example.com\")\nMethods(\"GET\")\nSchemes(\"https\")\n```\n\nOr, you\
    \ can use subroutes to group multiple routes together. For example, the following\
    \ code looks for a host map of www.example.com, but it will check the subroutes\
    \ only if it gets a match on the host:\n\n```\nrouter := mux.NewRouter()\nsubrouter\
    \ := route.Host(\"www.example.com\").Subrouter\n```\n\n```\n// Register the subroutes\n\
    subrouter.HandleFunc(\"/products\", AllProductsHandler)\nsubrouter.HandleFunc(\"\
    /products/{name}\", ProductHandler)\nsubrouter.HandleFunc(\"/reviews/{category}/{id:[0-9]+}\"\
    ), ReviewsHandler\n```\n\n> The gorilla/mux is a very capable alternative to DefaultServeMux\
    \ and worth investigating. You can find out more at http://www.gorillatool.org/pkg/mux.\n\
    \nWith course, Gorilla being such a vast ecosystem, there are many other choices\
    \ if you don't like Gorilla. I prefer Gorilla because it's easy to get my head\
    \ around, and it's always best to do whatever I ask it to.\n\nOther popular third-party\
    \ routers include:\n\n+   * httrouter: Lightweight fast, but less capable than\
    \ Gorilla. For example, you cannot include regular expressions in your routes.\n\
    * Httpremux: A flexible, tree-based HTTP router, inspired by httrouter.\n* Pat:\
    \ Simple to use and quite popular. If you're a Ruby-ist familiar with Sinatra\
    \ and Rails, you'll find Pat's approach very familiar.\n\n# Returning errors\n\
    \nThings don't always work as we intend. Requests get made for pages that no longer\
    \ exist, things moved from one place to another, and sometimes the connection\
    \ drops."
