    But wait a minute—at what expense does this come to our code? Our nice, neat program
    is now a mess of inline HTML. If it becomes more complex over time, we''d find
    it very difficult to maintain. What''s more, each time we want to make a trivial
    change, we would have to recompile our code.


    We have now committed one of web development’s great cardinal sins—mixing logic
    and presentation in our source code. Frankly, there’s a much better way to format
    the display. We’ll examine that in the next chapter.'
  merge: -1
