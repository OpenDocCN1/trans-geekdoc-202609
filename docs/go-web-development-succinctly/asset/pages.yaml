  md: "# Code Listing 25: Using a Prepared Statement for the INSERT Operation\n\n\
    ```\n// Create a new city based on the information supplied.\nfunc dbCityAdd(city\
    \ City) []byte {\n\n    var addResult DBUpdate\n\n    // Create prepared statement.\n\
    stmt, err := database.Prepare(\"INSERT INTO City(Name, CountryDistrict, Population)\
    \ VALUES(?,?,?,?)\")\n    if err != nil {\n        log.Fatal(err)\n    }\n\n \
    \   // Execute the prepared statement and retrieve the results.\n    res, err\
    \ := stmt.Exec(city.Name, city.CountryCode, city.District, city.Population)\n\
    \    if err != nil {\n        log.Fatal(err)\n    }\n    lastID, err := res.LastInsertId()\n\
    \    if err != nil {\n        log.Fatal(err)\n    }\n    rowCnt, err := res.RowsAffected()\n\
    \    if err != nil {\n        log.Fatal(err)\n    }\n\n    // Populate DBUpdate\
    \ struct with last Id and num rows affected.\n    addResult.Id = lastID\n    addResult.Affected\
    \ = rowCnt\n\n    // Convert to JSON and return.\n    newCity, err := json.Marshal(addResult)\n\
    \    if err != nil {\n        fmt.Printf(\"Error: %s\", err)\n    }\n    return\
    \ newCity\n}\n```\n\nNote also the INSERT operation on the database retrieves\
    \ some useful information—namely the ID of the recently added record and the number\
    \ of records affected. We’re storing this in a struct DBUpdate that we can return\
    \ it to the CityAdd handler and, subsequently, to the client (who may wish to\
    \ act on the information).\n\nThe last of our handlers is CityDelete. Like CityDisplay,\
    \ it requires users to enter the ID of the city with which they want to work."
