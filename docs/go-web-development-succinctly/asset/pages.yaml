  md: '# # Chapter 3 Accessing Data


    In the previous chapter, we saw how Go can accept requests from different URLs
    and route them to an appropriate handler. So far, however, all of our responses
    to these requests have served only static content, which is not enough for today''s
    web applications. In this chapter, we''ll see how we can connect our Go web applications
    to a data source and serve dynamic data instead.


    # ## Getting a driver for your database


    Go allows you to use any database for which a driver is available. A definitive
    list of drivers can be found at https://github.com/golang/go/wiki/SQLDrivers.


    Unless you''re using something quite exotic, you should be able to find a driver
    for your database in the wiki.


    MySQL is a fantastic open-source database and, although it has been around for
    quite a while, it continues to be extremely popular, so we''ll use that for our
    examples in this chapter. However, whichever database you choose, the steps you
    need to take will be similar, if not identical, to those shown here.


    You can download the free community edition of MySQL Server from http://www.mysql.com.
    Follow the installation instructions for your platform. If you want to follow
    along with the examples in this chapter, you should also install the sample "world"
    database. There''s an option in the Windows Installer for this, with Mac and Linux
    you must download and install it manually from https://dev.mysql.com/doc/index-other.html.


    Simply connect to the MySQL server using the command-line client (or MySQL Workbench),
    which can also install if you prefer a GUI environment), then execute the following
    statement:


    ```

    mysql> SOURCE < /path/to/world.sql

    ```


    You can verify that the "world" database is installed by issuing the command in
    Figure 10 at the mysql> prompt.'
