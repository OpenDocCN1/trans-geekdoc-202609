- pgno: 28
  md: "The HTTP protocol defines 61 status codes so that we can determine whether\
    \ or not a request was successful.\n\nHere are a few of the most common ones:\n\
    \n+   * 200 OK: Hooray! All is well.\n* 404 Not Found: Whatever resource you're\
    \ looking for, you won't find it here.\n* 301 Moved Permanently: Used as a redirect\
    \ to another page.\n* 302 Moved Temporarily: Used as a temporary redirect to another\
    \ page.\n* 500 Internal Server Error: Something unexpected has gone. This is a\
    \ \"catch all.\".\n\nThe net/http package provides a function called Error that\
    \ you can use to handle error status codes. Your job as a developer is to pick\
    \ one that makes sense for the type of error you are reporting.\n\nYou can raise\
    \ an error by passing the ResponseWriter, a string message, and the status code.\
    \ For example, this raises a 404 Not Found error:\n\n```\nhttp.HandleFunc(\"/\"\
    , func(w http.ResponseWriter, r *http.Request) {\n  http.Error(w, \"Something\
    \ has gone wrong\", 500)\n})\n```\n\nHowever, it's better practice to use the\
    \ various helper functions net/http provides for this purpose rather than the\
    \ generic http.Error() function.\n\nFor example:\n\n```\n// Return 404 Not Found\n\
    http.NotFound(w, req)\n```\n\n```\n// Return 301 Permanently Moved\nhttp.Redirect(w,\
    \ req, \"http://somewhereelse.com\", 301)\n```\n\n```\n// Return 302 Temporarily\
    \ Moved\nhttp.Redirect(w, req, \"http://temporarylocation\", 302)\n```"
  merge: -1
  img_proc: true
