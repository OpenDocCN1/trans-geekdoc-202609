- pgno: 37
  md: '# Chapter 4 Templates


    In the previous chapter, we connected to a data source, then displayed the results
    of queries to the user in HTML format. This HTML code was embedded directly within
    our source code, which is not desirable (except for very simple scenarios) because
    it makes the application very difficult to maintain.


    Go comes to the rescue with a rather good templating engine. Not only does this
    enable us to separate our program code from the presentation markup, but it also
    provides some logical constructs as loops, variables, and even functions that
    allow us to offload presentation logic to the template.


    # Introducing templates


    First, let''s define functionality.


    Go template functionality is provided by the template package, which includes
    a number of methods, including Parse and ParseFile, for loading a template from
    a string or file, then Execute for merging the specific content from our application
    with the more general content provided by the template itself.


    Note that templates typically exist within their own files, but this is not always
    the case. We can use template functionality directly within our program logic
    by encoding the template as a string, then using the Parse method to read from
    it. This is only a slight improvement on encoding everything as HTML, so in these
    examples we''ll separate template files and ParseFile to read from them.


    First, as you can see, this is simply an HTML file with some special syntax so
    that our program knows what to insert and where to insert it.


    > Code Listing 10: Our HTML File


    ```

    <html>

    <head>

    <title>Hello!</title>

    </head>

    <body>

    <h1>A warm hello to...</h1>

    <p>

    {{.Name}}

    </p>

    </body>

    </html>

    ```'
  merge: -1
  img_proc: true
