  img_proc: true
- pgno: 26
  md: "```\npackage main\n\nimport (\n    \"log\"\n    \"net/http\"\n    \"os\"\n\n\
    \    \"github.com/gorilla/mux\"\n)\n\nfunc pageHandler(w http.ResponseWriter,\
    \ r *http.Request) {\n    vars := mux.Vars(r)\n    productID := vars[\"id\"]\n\
    \    log.Printf(\"Product ID:%v\\n\", productID)\n\n    fileName := productID\
    \ + \".html\"\n\n    if _, err := os.Stat(fileName); os.IsNotExist(err) {\n  \
    \      log.Printf(\"no such product\")\n        fileName = \"invalid.html\"\n\
    \    }\n\n    http.ServeFile(w, r, fileName)\n}\n\nfunc main() {\n    router :=\
    \ mux.NewRouter()\n    router.HandleFunc(\"/product/{id:[0-9]+}\", pageHandler)\n\
    \    http.Handle(\"/\", router)\n    http.ListenAndServe(\":8999\", nil)\n}\n\
    ```\n\nThis only scratches the surface of what gorilla/mux can do. For example,\
    \ you can match\nagainst:\n\nPath prefixes:\n\nrouter.PathPrefix(\"/products/\"\
    )\n\nHTTP methods:\n\nrouter.Methods(\"GET\", \"POST\")\n\nURL schemes:\n\nrouter.Schemes(\"\
    https\")\n\nHeader values (for example, was the request an AJAX request?):"
