    ```\npackage main\n\nimport (\n    \"database/sql\"\n    \"fmt\"\n    \"log\"\n\
    \    \"net/http\"\n    \"github.com/go-sql-driver/mysql\"\n)\n\ntype City struct\
    \ {\n    Name string\n    CountryCode string\n    Population int\n}\n\nvar database\
    \ *sql.DB\n\nfunc main() {\n    db, err := sql.Open(\"mysql\",\n        \"root:password@tcp(127.0.0.1:3306)/world\"\
    )\n    if err != nil {\n        log.Println(\"Could not connect!\")\n    }\n \
    \   database = db\n    log.Println(\"Connected.\")\n\n    http.HandleFunc(\"/%s\"\
