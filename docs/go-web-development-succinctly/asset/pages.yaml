    \ closing of the record set because that's explicitly needed when the query returns\
    \ with either a single record or with no record. We need to chain the call to\
    \ Scan to the call to QueryRow because otherwise the recordset will be closed\
    \ before we have a chance to work with it.\n\nCityAdd is a little more complex\
