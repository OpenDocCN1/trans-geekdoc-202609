    \ and www.mysite.com/blog/blog.html? This approach won't work. So, you'll need\
    \ better control over the URLs of your application can accept. You can achieve\
    \ this by using the net/http package's routing capabilities.\n\n# Simple serving\
    \ and routing\n\nGo relies on two main components to process HTTP requests—a multiplexor\
    \ and handlers. A multiplexor (or \"mux\") is essentially an HTTP request router.\
    \ In Go's net/http package, the multiplexor functionality is provided by ServeMux\
    \ and the default mux is DefaultServeMux.\n\nIntuitive, eh?\n\nServeMux compares\
    \ incoming requests against a list of predefined URL paths, then calls the appropriate\
    \ handler (a function that you define) for each path when there is a match.\n\n\
    Let's first have a look at the code, then we'll examine what's going on.\n\nCode\
    \ Listing 2: Basic Serving and Using Net/http\n\n```\npackage main\n\nimport (\n\
    \    \"fmt\"\n    \"html\"\n    \"log\"\n    \"net/http\"\n    \"time\"\n)\n\n\
    func main() {\n    http.HandleFunc(\"/\", showInfo)\n    http.HandleFunc(\"/site\"\
    , serveFile)\n    err := http.ListenAndServe(\":8999\", nil)\n    if err != nil\
    \ {\n        log.Fatal(\"ListenAndServe: %v\", err)\n    }\n}\n\nfunc showInfo(w\
    \ http.ResponseWriter, r *http.Request) {\n    fmt.Fprintf(w, \"Current time:\
    \ %v\", time.Now())\n    fmt.Fprintf(w, \"URL Path: %s\", html.EscapeString(r.URL.Path))\n\
    }\n\nfunc serveFile(w http.ResponseWriter, r *http.Request) {\n    http.ServeFile(w,\
    \ r, \"index.html\")\n}\n```\n\nNotice the main() function, which is the entry\
    \ point into the program, sets up some server routes by using the http.HandleFunc(route,\
    \ handler) method to map a URL route to a function that will respond to any requests\
    \ coming in that route.\n\nThe program next calls the http.ListenAndServe() method,\
    \ which starts an HTTP server at a specified address (in this case, the local\
    \ machine on port 8999) and the mux in this instance is nil, which lets Go use\
    \ DefaultServeMux.\n\nThe handler functions do different things depending on whether\
    \ the URL accessed is at the root of the site (\"/\") or at \"/site\". However,\
    \ in both cases their method signatures must implement both http.ResponseWriter\
    \ and http.Request. If a handler does not implement both of these gets called\
    \ via http.HandleFunc(), you'll see that Go will raise a compile-time error.\n\
    \nIf the user visits /site, the http.ServeFile() method handles the request and\
    \ returns the index.html page that resides in the same directory as the application.\
    \ You can use http.ServeFile() to send any static file in the response.\n\nIf\
    \ the user visits the root location, showInfo() gets called and will display the\
    \ current time and whichever path entered. The application extracts this information\
    \ using the URL.Path property of the http.Request object that gets passed to the\
    \ handler. Start the program by issuing go run <program_name.go> from your IDE\
    \ or simply via the command line. Next, visit localhost:8999 in your browser.\
    \ Try various combinations to test its functionality.\n\nFor example, entering\
    \ http://localhost:8999 results in the dynamically generated page in Figure 5.\n\
    \n![](img/cdabbe899d95a91197e7ec37cc1c8048_18_0.png)\n\nFigure 5: Visiting the\
    \ Root of the Web Application\n\n![](img/cdabbe899d95a91197e7ec37cc1c8048_19_0.png)\n\
    \nFigure 6: Visiting a Subroute\n\nEntering localhost:8999/site displays the index.html\
    \ page.\n\n![](img/cdabbe899d95a91197e7ec37cc1c8048_19_1.png)\n\nFigure 7: Visiting/Site\n\
    \nLets expand our ability to serve static files in this example. Suppose that\
    \ the URL in the request starts with /static/ and we want to strip the /static\
    \ part of the URL in order to look for the file referenced in the remaining path\
    \ the /var/www directory. We can use the StripPrefix function to achieve this,\
