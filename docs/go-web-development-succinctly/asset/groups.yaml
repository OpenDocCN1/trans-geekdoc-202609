  md: "\n# Options or configure the session store so that all session cookies have\
    \ the same MaxAge value.\n\nWhen we have a session, we can assign values using\
    \ its Values property. The Values property is a Go map, which is Go's implementation\
    \ of a hash table that allows you to set properties using key/value pairs.\n\n\
    Next, we call the session's Save method to save the session in the response.\n\
    \n- Tip: Always save the session values before returning the response. Otherwise,\
    \ the response won't receive the session cookie.\n\nThat's Gorilla's basic implementation\
    \ of sessions. However, gorilla/sessions also gives us extra, useful functionality\
    \ that we will look at next.\n\n# Flash messages\n\nGorilla borrowed the idea\
    \ of flash messages from Ruby. A flash message is simply a session value that\
    \ exists until it is read.\n\nWe use flash messages to temporarily store data\
    \ between requests, such as a success or error message during the submission process,\
    \ in order to avoid it being duplicated in later error.\n\nWe add a flash message\
    \ using the session's AddFlash method and retrieve the flash messages by calling\
    \ session.Flash.\n\nWe won't dwell too on flash messages here—be aware that they\
    \ exist. Code Listing 37 demonstrates how to get and set flash messages.\n\n>\
    \ Code Listing 37: Using Flash Messages in gorilla/sessions\n\n```go\npackage\
