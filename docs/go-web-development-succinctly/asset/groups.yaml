    \ []byte {\n\tvar city City\n\n\terr := database.QueryRow(\"SELECT * FROM city\
    \ WHERE ID?\", id).\n\t\tScan(&city.Id, &city.Name, &city.CountryCode, &city.District,\
    \ &city.Population)\n\tif err != nil {\n\t\tlog.Fatal(err)\n\t}\n\n\tjsonCity,\
    \ err := json.Marshal(city)\n\tif err != nil {\n\t\tfmt.Printf(\"Error: %s\",\
    \ err)\n\t}\n\treturn jsonCity\n}\n```\n\nNote that dbCityDisplay expects to return\
    \ only a single row from the database, so we're using QueryRow instead of Query.\
    \ We don't need to defer the closing of the record set because that's explicitly\
    \ needed when the query returns with either a single record or with no record.\
    \ We need to chain the call to Scan to the call to QueryRow because otherwise\
    \ the recordset will be closed before we have a chance to work with it.\n\nCityAdd\
    \ is a little more complex because we must read the JSON from the body of the\
    \ request, unmarshall it into a Go struct, pass it to dbCityAdd to process it.\n\
    \n```go\nfunc CityAdd(w http.ResponseWriter, r *http.Request) {\n    var city\
    \ City\n\n    // Read the body of the request.\n    body, err := ioutil.ReadAll(io.LimitReader(r.Body,\
    \ 1048576))\n    if err != nil {\n        panic(err)\n    }\n    if err := r.Body.Close();\
    \ err != nil {\n        panic(err)\n    }\n\n    // Convert the JSON in the request\
