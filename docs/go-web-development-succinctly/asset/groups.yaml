  md: "\n# Chapter 6 Cookies and Sessions\n\nAs you are undoubtedly aware, HTTP is\
    \ a stateless protocol. Each request by a client to a web server is completely\
    \ unrelated to any previous exchange between the two, and the communication mechanism\
    \ consists solely of request/response pairs. The server is not required to retain\
    \ any information regarding any previous requests.\n\nThe benefit of this approach\
    \ is that the server doesn't need to assign memory to do so (because it doesn't\
    \ \"remember\" any previous requests from the clients), and if the client connection\
    \ dies, the server doesn't have to do any cleanup.\n\nThe downside of this approach\
    \ is that, well, the server doesn't remember anything. This can make it tricky\
    \ to build a rich, interactive web application all too often we must send extra\
    \ information with each request so that the server knows enough about the state\
    \ of the client to provide a useful response.\n\nThe keys to making all this happen\
    \ are cookies and sessions. Let's define both before we demonstrate how to use\
    \ them in Go web applications.\n\n## Introducing cookies and sessions\n\n### What\
    \ is a cookie?\n\nA cookie is simply a little text file that a browser puts on\
    \ the user's computer. It stores information that helps to maintain the illusion\
    \ of a persistent connection.\n\nCookies are often used for authentication, storing\
    \ site-visitor preferences, maintaining shopping cart items, and identifying server\
    \ sessions.\n\nWhen the browser interacts with the server, it passes the information\
    \ in the cookie as part of the request. Note that cookies are domain-specific.\
    \ If a browser creates a cookie for twitter.com, it cannot suddenly send that\
    \ cookie to google.com.\n\nEssentially, cookies are great for storing information\
    \ about a user's interaction with a webpage as he or she moves from one page to\
    \ the next.\n\n### What is a session?\n\nSessions allow you to store information\
    \ about the client's interaction with a website just as cookies do, but the data\
    \ gets stored on the server instead of the client.\n\nSessions are a better alternative\
    \ to stuffing lots of constantly changing information in cookies. Instead, the\
    \ client stores only a unique identifier (the \"Session ID\") and passes the ID\
    \ to the web server with every request. The server uses the Session ID to look\
    \ up information in its internal database and retrieve variables to the user's\
    \ use of the application.\n\n# What is a session cookie? Or a persistent cookie?\n\
    \nUh-oh. Just to confuse you even further, there are not only cookies and sessions,\
    \ but there is also a session cookie!\n\nWith cookies, your application can set\
    \ an expiry time. You might have seen this when the login page for a website gives\
    \ you the \"Keep logged in?\" option.\n\nIf you set an expiry time, the browser\
    \ saves the cookie to the local file system. This is called a persistent cookie.\n\
    \nIf you don't set an expiry time, the browser usually keeps the cookie hanging\
    \ around in memory, and this is called a session cookie.\n\nSo, session cookies\
    \ and persistent cookies are simply cookies, but with different expiration times.\n\
    \n# Working with cookies\n\n### Setting cookies\n\nIn order to write information\
    \ to a cookie in Go, you use the net/http/package's SetCookie function, whose\
    \ signature looks like this:\n\n```go\nhttp.SetCookie(w ResponseWriter, cookie\
    \ *Cookie)\n```\n\nThe w is the response to the request and cookie is a struct:\n\
    \n```go\ntype Cookie struct {\n\tName        string\n\tValue       string\n\t\
    Path        string\n\tDomain      string\n\tExpires     time.Time\n\tRawExpires\
    \  string\n\tMaxAge      int\n\tSecure      bool\n\tHttpOnly    bool\n\tRaw  \
    \       string\n\tUnparsed    []string\n}\n```\n\nThe cookie can hold a lot of\
    \ information, but the most important fields are:\n\n- Name: A key for the cookie\
    \ for referring to it in your code.\n- Value: The cookie's data.\n- Expires: A\
    \ Time value that denotes when the browser can delete it.\n\nOther fields that\
    \ might be useful for controlling access to the cookie:\n\n- Path\n- Domain\n\
    - HttpOnly\n\nFor now, let's keep it simple.\n\nHere is an example of how you\
    \ can set a cookie:\n\n```go\nexpiration := time.Now().Add(365 * 24 * time.Hour)\n\
    cookie := http.Cookie{Name: \"username\", Value: \"jsmith\", Expires: expiration}\n\
    http.SetCookie(w, &cookie)\n```\n\n> Tip: Go's time functions are sophisticated\
    \ but complex. For more information, see the documentation at https://golang.org/pkg/time/\n\
    \n# Fetching cookies\n\nIn order to retrieve a cookie from a request, you can\
    \ do the following:\n\n```go\ncookie, _ := r.Cookie(\"username\")\nfmt.Fprintf(w,\
    \ cookie.body)\n```\n\nOr, if several cookies are associated with a request, you\
    \ can iterate through them, as follows:\n\n```go\nfor _, cookie := range r.Cookies()\
    \ {\nfmt.Fprintf(w, cookie.Name)\n}\n```\n\n# Using cookies\n\nLet's create a\
    \ simple application that uses a cookie.\n\nThe following code checks to see if\
    \ this is a visitor's first visit to our site. If it is, it displays a welcome\
    \ message. If not, it displays the time of the last visit.\n\n```go\npackage main\n\
    import (\n    \"net/http\"\n    \"strconv\"\n    \"time\"\n)\n\nfunc CheckLastVisit(w\
    \ http.ResponseWriter, r *http.Request) {\n    c, err := r.Cookie(\"lastvisit\"\
    )\n    expiry := time.Now().AddDate(0, 0, 1)\n\n    cookie := &http.Cookie{\n\
    \        Name: \"lastvisit\",\n        Expires: expiry,\n    }\n    http.SetCookie(w,\
    \ cookie)\n\n    if err != nil {\n        w.Write([]byte(\"Welcome!\"))\n    }\
    \ else {\n        lasttime, _ := strconv.ParseInt(c.Value, 10, 64)\n        html\
    \ := \"last visited at: \" + time.Unix(lasttime, 0).Format(\"15:04\")\n      \
    \  w.Write([]byte(html))\n    }\n}\n\nfunc main() {\n    http.HandleFunc(\"/\"\
    , CheckLastVisit)\n    http.ListenAndServe(\":8999\", nil)\n}\n```\n\n# Working\
    \ with sessions\n\nIn order to work with sessions in Go, I'm going to suggest\
    \ that we revisit the Gorilla Toolkit's sessions module because, in my opinion,\
    \ it's a much cleaner implementation than the native Go approach.\n\nInstall it\
    \ from GitHub as:\n\n```\ngo get github.com/gorilla/sessions\n```\n\n## Basics\n\
    \nThe following code demonstrates the basics of using the **gorilla/sessions**\
    \ package to create and authenticate a session, retrieve the session, set some\
    \ values, then the session.\n\nCode Listing 36: Using gorilla/sessions\n\n```go\n\
    package main\n\nimport (\n    \"net/http\"\n\n    \"github.com/gorilla/mux\"\n\
    \    \"github.com/gorilla/sessions\"\n)\n\nvar store = sessions.NewCookieStore(\n\
    \    []byte(\"keep-it-secret-keep-it-safe\")\n)\n\nfunc handler(w http.ResponseWriter,\
    \ r *http.Request) {\n    err := store.Get(r, \"session-name\")\n    if err !=\
    \ nil {\n        http.Error(w, err.Error(),\n            http.StatusInternalServerError)\n\
    \        return\n    }\n\n    // Set session values.\n    session.Values[\"abc\"\
    ] = \"cba\"\n    session.Values[111] = 222\n    // Save the session values\n \
    \   session.Save(r, w)\n}\n\nfunc main() {\n    router := mux.NewRouter()\n  \
    \  router.Handle(\"/\", http.HandlerFunc(handler))\n    http.ListenAndServe(\"\
    :8999\", router)\n}\n```\n"
  mdcn: "\n\n# 第 6 章 Cookies 和 Sessions\n\n正如你所意识到的，HTTP 是一个无状态协议。客户端向 Web 服务器的每个请求都与双方之前的任何交换完全无关，其通信机制完全由请求/响应对组成。服务器不需要保留有关任何之前请求的任何信息。\n\
    \n这种方法的用处是，服务器不需要分配内存来这样做（因为它“不记得”客户端任何之前的请求），而且如果客户端连接断，服务器也不需要进行任何清理工作。\n\n\
    这种方法的缺点是，嗯，服务器什么都不记得。这可能导致构建一个丰富的交互式 Web 应用程序变得棘手，通常情况下，我们必须在每个请求中发送额外信息，以便服务器了解足够的客户端状态，从而提供有用的响应。\n\
    \n实现这一切的关键在于 cookies 和 sessions。在演示如何在 Go Web 应用程序中使用它们之前，让我们先定义一下这两个概念。\n\n##\
    \ 介绍 cookies 和 sessions\n\n### 什么是 cookie？\n\nCookie 仅仅是浏览器放在用户计算机上的一个小文本文件。它存储了有助于维持持久连接幻象的信息。\n\
    \nCookies 通常用于身份验证、存储访访问偏好、维护购物车物品以及识别服务器会话。\n\n当浏览器与服务器交互时，它会将 cookie 中的信息作为请求的一部分传递。请注意，cookies\
    \ 是特定域的。如果浏览器为 twitter.com 创建了一个 cookie，它不能突然将该 cookie 发送到 google.com。\n\n从本质本质，cookies\
    \ 非常适合存储用户从一个页面移动到另一个页面时与网页的交互信息。\n\n### 什么是 session？\n\nSessions 允许你像 cookies\
    \ 一样存储客户端与网站交互的信息，但数据存储在服务器上而不是客户端上。\n\nSessions 是在 cookies 中塞入大量不断变化信息的更好替代方案。相反，客户端仅存储一个唯一标识符（“Session\
    \ ID”），并在每次请求时将该 ID 传递给 Web 服务器。服务器使用 Session ID 在其内部数据库中查找信息，并检索用户应用程序所需的变量。\n\
    \n# 什么是 session cookie？或者说持久 cookie (persistent cookie)？\n\n哎呀。为了让你更加困惑，不仅有 cookies\
    \ 和 sessions，还有 session cookie！\n\n通过 cookies，你的应用程序可以设置一个过期时间。你可能在网站的登录页面看到过这个功能，它会提供“保持登录？”的选项。\n\
    \n如果你设置了过期时间，浏览器会将 cookie 保存到本地文件系统。这被称为持久 cookie（persistent cookie）。\n\n如果你没有设置过期时间，浏览器通常会将\
    \ cookie 留存在内存中，这被称为 session cookie。\n\n所以，session cookie 和持久 cookie 仅仅是 cookies，具有不同的过期时间。\n\
    \n# 操作 cookies\n\n### 设置 cookies\n\n为了在 Go 中向 cookie 写入信息，你使用 `net/http` 包中的 `SetCookie`\
    \ 函数，其签名如下：\n\n```go\nhttp.SetCookie(w ResponseWriter, cookie *Cookie)\n```\n\n\
    w 是请求的响应，cookie 是一个结构体：\n\n```go\ntype Cookie struct {\n\tName        string\n\
    \tValue       string\n\tPath        string\n\tDomain      string\n\tExpires  \
    \   time.Time\n\tRawExpires  string\n\tMaxAge      int\n\tSecure      bool\n\t\
    HttpOnly    bool\n\tRaw         string\n\tUnparsed    []string\n}\n```\n\ncookie\
    \ 可以包含很多信息，但最重要的字段是：\n\n- Name: cookie 的键，用于在你的代码中引用它。\n- Value: cookie 的数据。\n\
    - Expires: 一个 Time 值，表示浏览器何时可以删除它。\n\n其他可能用于控制 cookie 访问的字段包括：\n\n- Path\n- Domain\n\
    - HttpOnly\n\n现在，让我们保持简单。\n\n这里是一个如何设置 cookie 的示例：\n\n```go\nexpiration := time.Now().Add(365\
    \ * 24 * time.Hour)\ncookie := http.Cookie{Name: \"username\", Value: \"jsmith\"\
    , Expires: expiration}\nhttp.SetCookie(w, &cookie)\n```\n\n> 提示：Go 的时间函数非常强大但也很复杂。更多信息请参阅文档\
    \ https://golang.org/pkg/time/\n\n# 获取 cookies\n\n为了从请求中检索 cookie，你可以执行以下操作：\n\
    \n```go\ncookie, _ := r.Cookie(\"username\")\nfmt.Fprintf(w, cookie.body)\n```\n\
    \n或者，如果一个请求与多个 cookie 关联，你可以如下所示遍历它们：\n\n```go\nfor _, cookie := range r.Cookies()\
    \ {\nfmt.Fprintf(w, cookie.Name)\n}\n```\n\n# 使用 cookies\n\n让我们创建一个使用 cookie 的简单应用程序。\n\
    \n以下代码检查这是否是访客第一次访问我们的网站。如果是，它将显示欢迎消息。如果不是，它将显示上次访问的时间。\n\n```go\npackage main\n\
    import (\n    \"net/http\"\n    \"strconv\"\n    \"time\"\n)\n\nfunc CheckLastVisit(w\
    \ http.ResponseWriter, r *http.Request) {\n    c, err := r.Cookie(\"lastvisit\"\
    )\n    expiry := time.Now().AddDate(0, 0, 1)\n\n    cookie := &http.Cookie{\n\
    \        Name: \"lastvisit\",\n        Expires: expiry,\n    }\n    http.SetCookie(w,\
    \ cookie)\n\n    if err != nil {\n        w.Write([]byte(\"Welcome!\"))\n    }\
    \ else {\n        lasttime, _ := strconv.ParseInt(c.Value, 10, 64)\n        html\
    \ := \"last visited at: \" + time.Unix(lasttime, 0).Format(\"15:04\")\n      \
    \  w.Write([]byte(html))\n    }\n}\n\nfunc main() {\n    http.HandleFunc(\"/\"\
    , CheckLastVisit)\n    http.ListenAndServe(\":8999\", nil)\n}\n```\n\n# 操作 sessions\n\
    \n为了在 Go 中使用 sessions，我建议我们重新回顾 Gorilla Toolkit 的 sessions 模块，因为在我看来，它比 Go 的原生方法要简洁得多。\n\
    \n从 GitHub 安装它：\n\n```\ngo get github.com/gorilla/sessions\n```\n\n## 基础\n\n以下代码演示了使用\
    \ **gorilla/sessions** 包创建和身份验证 session、检索 session、设置某些值，然后保存 session 的基础。\n\n\
    代码列表 36：使用 gorilla/sessions\n\n```go\npackage main\n\nimport (\n    \"net/http\"\
    \n\n    \"github.com/gorilla/mux\"\n    \"github.com/gorilla/sessions\"\n)\n\n\
    var store = sessions.NewCookieStore(\n    []byte(\"keep-it-secret-keep-it-safe\"\
    )\n)\n\nfunc handler(w http.ResponseWriter, r *http.Request) {\n    err := store.Get(r,\
    \ \"session-name\")\n    if err != nil {\n        http.Error(w, err.Error(),\n\
    \            http.StatusInternalServerError)\n        return\n    }\n\n    //\
    \ 设置 session 值。\n    session.Values[\"abc\"] = \"cba\"\n    session.Values[111]\
    \ = 222\n    // 保存 session 值\n    session.Save(r, w)\n}\n\nfunc main() {\n   \
    \ router := mux.NewRouter()\n    router.Handle(\"/\", http.HandlerFunc(handler))\n\
    \    http.ListenAndServe(\":8999\", router)\n}\n```\n\n"
