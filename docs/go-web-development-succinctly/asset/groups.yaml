    # More advanced serving and routing with the Gorilla Web Toolkit


    The routing functionality offered by Go''s built-in net/http package only gets
    you so far. If the range of possible URLs is complex and, for example, you want
    to be able to use regular expressions or variables to match URLs, you will probably
    want to consider a third-party solution.


    The Gorilla Web Toolkit is one solution. Gorilla consists of 22 packages, including:


    +   - gorilla/text stores global variables.

    - gorilla/mux is a powerful URL router and dispatcher.

    - gorilla/reverse produces reproducible regular expressions for regexp-based muxes.

    - gorilla/rpc implements RPC over HTTP with codec for JSON-RPC.

    - gorilla/schema converts values to a struct.

    - gorilla/secure encodes authenticated and optionally encrypted cookie values.

    - gorilla/sessions save cookie and filesystem sessions allows custom session back
    ends.

    - gorilla/websocket implements the WebSocket protocol defined in RFC 6455.


    As you can see from the list of packages, there is more to Gorilla than merely
    an alternative for Go routing and serving. In fact, it provides a range of different
    tools to assist you in your web development efforts.


    But here, we''re interested in the mux. The gorilla/mux module implements the
    http.Handler interface so that it is compatible with the standard Golang. http.ServeMux.


    In addition, the gorilla/mux module gives you the ability to:


    +   - Match requests based on URL host, path, path prefix, schemes, header and
    query values. HTTP methods, or custom matchers that you define.

    - Register URLs so you can build or "reverse" them, while maintaining references
    to resources.

    - Use "subrouters"-nested routes that are only tested if their parent routes match.
    This way, you can define "groups" of routes that have everything in common, such
    as a host or a path prefix. This optimizes request matching by undertaking tests
    only if they are appropriate to the group (rather than executing tests against
    all incoming requests).


    # Installing and referencing the gorilla/mux package


    If you are only interested in the more advanced routing capability offered by
    Gorilla, you can install gorilla/mux in your GOPATH by using go get. For example,
    assuming that you have installed:


    ```

    go get github.com/gorilla/mux

    ```


