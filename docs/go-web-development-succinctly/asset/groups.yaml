    Now that we can connect to the "world" database, we can execute queries against
    it and return the results to our users. But first, let''s examine **sql.DB**.


    # sql.DB


    Note from the previous code example that we are using the **database** variable
    that contains **sql.DB** to access the database.


    The **sql.DB** is not the database—that''s stored in dbConn—instead, it''s the
    **database/sql** package''s abstraction of the database. In our example, it refers
    to the MySQL database, but because we can use **database/sql** to interface with
    many different data sources, it could as easily be a local file or some of in-process
    data store such as `memcache`.


    **sql.DB** takes care of a lot of things on your behalf, including the opening,
    closing, and pooling of database connections.


    Don''t keep opening and closing databases unless your application requires it.
    The **sql.DB** object is designed to be long-lived, and all of your interaction
    with the database will come via **sql.DB**. However, you must be certain to close
    connections by using **sql.DB.Close** when you are finished with them so that
    they can be returned to the pool.


    > Tip: If you need to give short-lived function access to *sql.DB*, pass it to
    the function as a parameter instead of creating a new connection within the function.


    We''re getting ahead of ourselves. We haven''t done anything with our database
    yet.


    Let''s rectify that now.'
