    \ use and quite popular. If you're a Ruby-ist familiar with Sinatra and Rails,\
    \ you'll find Pat's approach very familiar.\n\n# Returning errors\n\nThings don't\
    \ always work as we intend. Requests get made for pages that no longer exist,\
    \ things moved from one place to another, and sometimes the connection drops.\n\
    \nThe HTTP protocol defines 61 status codes so that we can determine whether or\
    \ not a request was successful.\n\nHere are a few of the most common ones:\n\n\
    - 200 OK: Hooray! All is well.\n- 404 Not Found: Whatever resource you're looking\
    \ for, you won't find it here.\n- 301 Moved Permanently: Used as a redirect to\
    \ another page.\n- 302 Moved Temporarily: Used as a temporary redirect to another\
    \ page.\n- 500 Internal Server Error: Something unexpected has gone. This is a\
    \ \"catch all.\".\n\nThe net/http package provides a function called Error that\
    \ you can use to handle error status codes. Your job as a developer is to pick\
    \ one that makes sense for the type of error you are reporting.\n\nYou can raise\
    \ an error by passing the ResponseWriter, a string message, and the status code.\
