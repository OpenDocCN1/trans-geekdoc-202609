    \ but our program fulfills the core responsibilities of any web server—namely,\
    \ listening to a request and serving a response. What's more, because it doesn't\
    \ have to worry about all the other issues that a more traditional web server\
    \ must, the program is lightning fast.\n\nIn this example, we call the http.ListenAndServe()\
