    Perhaps this needs your attention\")\n\nError = log.New(errorFile, \"ERROR: \"\
    , log.Date|log.Ltime)\nError.SetOutput(errorFile)\nError.Println(\"You REALLY\
    \ should fix this!\")\n\nNote in the above code listing, 0660 is the file mode\
