    /site/\", http.StripPrefix(\"/site/\", files))\n\terr := http.ListenAndServe(\"\
    :8999\", nil)\n\tif err != nil {\n\t\tlog.Fatal(\"ListenAndServe: \", err)\n\t\
    }\n}\n```\n\n```go\nfunc showInfo(w http.ResponseWriter, r *http.Request) {\n\t\
    fmt.Fprintf(w, \"current time: %s\", time.Now())\n\tfmt.Fprintf(w, \"URL Path:\
    \ %s\", html.EscapeString(r.URL.Path))\n}\n```\n\nNote in this example we're not\
    \ calling HandleFunc, but Handle. That's because the FileServer returns its own\
    \ handler that we can pass to the mux using Handle (instead of explicitly creating\
    \ our own handler function).\n\nSo, you can see that it's straightforward to get\
    \ a site up and running that is self-serving (no separate web server required)\
    \ and lets you respond to some simple requests.\n\n## Middleware\n\nIn development,\
    \ middleware is code that sits between the web request and your route handler.\
    \ Middleware connects reusable bits of code that you can use to perform tasks\
    \ that must occur before the handler is called or afterwards.\n\nFor example,\
    \ you might want to check the status of a database connection or authenticate\
    \ a user before routing request. You might also want to compress the content of\
    \ a response or limit the amount of times a specific handler is called—perhaps\
    \ as part of some restriction that you place on users who access your web service\
    \ free of charge.\n\nCreating middleware is simply a matter of chaining handlers\
    \ and handler functions, and it's something you will see—use a in Go web development.\n\
    \nThe basic idea is that you pass a handler function—let's call it f2—into another\
    \ handler function—let's call this one f1—as a parameter. Handler f1 gets called\
    \ when the route that triggers it is visited. f1 does some work, then calls f2.\n\
    \nOf course, you could have f2 directly. However, this is not ideal because we\
    \ typically want to achieve a clear separation of concerns, and therefore your\
    \ handler code should really be limited to processing the request and not doing\
    \ whatever f2 is designed to do.\n\nHere's the basic idea—instead of dealing with\
    \ the response as part of your handler, you simply pass the next handler in the\
    \ chain to it.\n\nFunctions that accept another handler function as a parameter\
    \ and return a new one can perform tasks before or after the handler is called\
    \ (or both before and after) and can even choose not to call the original handler\
    \ at all (if that is your intention).\n\nConsider the example in Code Listing\
    \ 4.\n\n## Code Listing 4: Middleware Example 1\n\n```go\npackage main\n\nimport\
    \ (\n    \"fmt\"\n    \"net/http\"\n)\n\nfunc middleware1(next http.Handler) http.Handler\
    \ {\n    return http.HandlerFunc(func(w http.ResponseWriter, r *http.Request)\
    \ {\n        fmt.Fprintln(w, \"Executing middleware1()...\")\n        next.ServeHTTP(w,\
    \ r)\n        fmt.Fprintln(w, \"Executing middleware1() again...\")\n    })\n\
    }\n\nfunc middleware2(next http.Handler) http.Handler {\n    return http.HandlerFunc(func(w\
    \ http.ResponseWriter, r *http.Request) {\n        fmt.Fprintln(w, \"Executing\
    \ middleware2()...\")\n        if r.URL.Path != \"/\" {\n            return\n\
    \        }\n        next.ServeHTTP(w, r)\n        fmt.Fprintln(w, \"Executing\
    \ middleware2() again...\")\n    })\n}\n\nfunc final(w http.ResponseWriter, r\
    \ *http.Request) {\n    fmt.Fprintln(w, \"Executing final()...\")\n    fmt.Fprintln(w,\
    \ \"Done\")\n}\n\nfunc main() {\n    finalHandler := http.HandlerFunc(final)\n\
    \nhttp.Handle(\"/\", middleware1(middleware2(finalHandler)))\n    http.ListenAndServe(\"\
    :8999\", nil)\n}\n```\n\nLook at the main() function. Here, we are intercepting\
    \ requests to our root web directory with the middleware1 handler. This handler\
    \ accepts a parameter another handler called middleware2. In that turn the final\
    \ handler serves as a parameter.\n\nWhen someone visits our application, it will\
    \ call middleware1, which displays a message, and when it hits next.serveHTTP,\
    \ executes the code in middleware2. The middleware2 handler in turn calls final(),\
    \ which executes and then returns control to middleware2, which completes its\
    \ tasks and returns control to middleware1.\n\nThe output will look like Figure\
    \ 8.\n\n![](img/cdabbe899d95a91197e7ec37cc1c8048_22_0.png)\n\nFigure 8: The Output\
    \ of the Middleware Example\n\nFigure 8 offers a completely artificial example,\
    \ but it serves to illustrate how much control middleware can give you.\n\nGo\
    \ often uses middleware internally. For example, many functions in the net/http\
    \ package, as is StripPrefix, are textbook examples of what middleware is—they\
    \ wrap your handler and perform additional operations on requests or responses.\n\
    \nThe concept of middleware can be somewhat difficult to understand, so Code Listing\
    \ 5 shows another example.\n\n## Code Listing 5: Middleware Example 2\n\n```go\n\
    package main\n\nimport (\n    \"net/http\"\n)\n\ntype AfterMiddleware struct {\n\
    \    handler http.Handler\n}\n```\n\nIn this bit of code, we want middleware to\
    \ execute when the myHandler function writes the response body—and to append some\
    \ data to it.\n\nFirst, we create a type for the middleware that we call AfterMiddleware.\
    \ This consists of a single field—the http.Handler we want our middleware to respond\
    \ to.\n\nThe http.Handler interface requires only that we implement the ServeHTTP\
    \ interface:\n\n```go\ntype Handler interface {\n    ServeHTTP(ResponseWriter,\
    \ *Request)\n}\n```\n\nWe do this follows:\n\n```go\nfunc (a *AfterMiddleware)\
    \ ServeHTTP(w http.ResponseWriter, r *http.Request) {\n\ta.handler.ServeHTTP(w,\
    \ r)\n\tw.Write([]byte(\"+++ Hello from middleware! +++\"))\n}\n```\n\nNow, the\
    \ response consists of whatever myHandler wrote and is followed by the output\
    \ of our middleware in Figure 9.\n\n> *** Hello from myHandler! *** +++ Hello\
    \ from middleware! +++\n\nFigure 9: The Output of Middleware Example 2\n\nWe cannot\
    \ cover every aspect of middleware here, but it is a very powerful feature that\
    \ is worth investigating. This article and video lecture by Mat Ryer is an excellent\
    \ introduction to the topic.\n\nWe'll revisit the concept of middleware in Chapter\
    \ 7, when we create some eminently more useful logging middleware.\n\n## More\
    \ advanced serving and routing with the Gorilla Web Toolkit\n\nThe routing functionality\
    \ offered by Go's built-in net/http package only gets you so far. If the range\
    \ of possible URLs is complex and, for example, you want to be able to use regular\
    \ expressions or variables to match URLs, you will probably want to consider a\
    \ third-party solution.\n\nThe Gorilla Web Toolkit is one solution. Gorilla consists\
    \ of 22 packages, including:\n\n- gorilla/text stores global variables.\n- gorilla/mux\
    \ is a powerful URL router and dispatcher.\n- gorilla/reverse produces reproducible\
    \ regular expressions for regexp-based muxes.\n- gorilla/rpc implements RPC over\
    \ HTTP with codec for JSON-RPC.\n- gorilla/schema converts values to a struct.\n\
    - gorilla/secure encodes authenticated and optionally encrypted cookie values.\n\
    - gorilla/sessions save cookie and filesystem sessions allows custom session back\
    \ ends.\n- gorilla/websocket implements the WebSocket protocol defined in RFC\
    \ 6455.\n\nAs you can see from the list of packages, there is more to Gorilla\
    \ than merely an alternative for Go routing and serving. In fact, it provides\
    \ a range of different tools to assist you in your web development efforts.\n\n\
    But here, we're interested in the mux. The gorilla/mux module implements the http.Handler\
    \ interface so that it is compatible with the standard Golang. http.ServeMux.\n\
    \nIn addition, the gorilla/mux module gives you the ability to:\n\n- Match requests\
    \ based on URL host, path, path prefix, schemes, header and query values. HTTP\
    \ methods, or custom matchers that you define.\n- Register URLs so you can build\
    \ or \"reverse\" them, while maintaining references to resources.\n- Use \"subrouters\"\
    -nested routes that are only tested if their parent routes match. This way, you\
    \ can define \"groups\" of routes that have everything in common, such as a host\
    \ or a path prefix. This optimizes request matching by undertaking tests only\
    \ if they are appropriate to the group (rather than executing tests against all\
    \ incoming requests).\n\n## Installing and referencing the gorilla/mux package\n\
    \nIf you are only interested in the more advanced routing capability offered by\
    \ Gorilla, you can install gorilla/mux in your GOPATH by using go get. For example,\
    \ assuming that you have installed:\n\n```\ngo get github.com/gorilla/mux\n```\n\
    \nNext, you must import it into your application, like so:\n"
