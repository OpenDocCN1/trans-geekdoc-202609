    # # Chapter 6 Cookies and Sessions


    As you are undoubtedly aware, HTTP is a stateless protocol. Each request by a
    client to a web server is completely unrelated to any previous exchange between
    the two, and the communication mechanism consists solely of request/response pairs.
    The server is not required to retain any information regarding any previous requests.


    The benefit of this approach is that the server doesn''t need to assign memory
    to do so (because it doesn''t "remember" any previous requests from the clients),
    and if the client connection dies, the server doesn''t have to do any cleanup.


    The downside of this approach is that, well, the server doesn''t remember anything.
    This can make it tricky to build a rich, interactive web application all too often
    we must send extra information with each request so that the server knows enough
    about the state of the client to provide a useful response.


    The keys to making all this happen are cookies and sessions. Let''s define both
    before we demonstrate how to use them in Go web applications.


    # ## Introducing cookies and sessions


    # ### What is a cookie?


    A cookie is simply a little text file that a browser puts on the user''s computer.
    It stores information that helps to maintain the illusion of a persistent connection.


    Cookies are often used for authentication, storing site-visitor preferences, maintaining
    shopping cart items, and identifying server sessions.


    When the browser interacts with the server, it passes the information in the cookie
    as part of the request. Note that cookies are domain-specific. If a browser creates
    a cookie for twitter.com, it cannot suddenly send that cookie to google.com.


    Essentially, cookies are great for storing information about a user''s interaction
    with a webpage as he or she moves from one page to the next.


    # ### What is a session?


    Sessions allow you to store information about the client''s interaction with a
    website just as cookies do, but the data gets stored on the server instead of
    the client.'
  - "[PAGE 72]\n\nSessions are a better alternative to stuffing lots of constantly\
    \ changing information in cookies. Instead, the client stores only a unique identifier\
    \ (the \"Session ID\") and passes the ID to the web server with every request.\
    \ The server uses the Session ID to look up information in its internal database\
    \ and retrieve variables to the user's use of the application.\n\n# What is a\
    \ session cookie? Or a persistent cookie?\n\nUh-oh. Just to confuse you even further,\
    \ there are not only cookies and sessions, but there is also a session cookie!\n\
    \nWith cookies, your application can set an expiry time. You might have seen this\
    \ when the login page for a website gives you the \"Keep logged in?\" option.\n\
    \nIf you set an expiry time, the browser saves the cookie to the local file system.\
    \ This is called a persistent cookie.\n\nIf you don't set an expiry time, the\
    \ browser usually keeps the cookie hanging around in memory, and this is called\
    \ a session cookie.\n\nSo, session cookies and persistent cookies are simply cookies,\
    \ but with different expiration times.\n\n# Working with cookies\n\n# Setting\
    \ cookies\n\nIn order to write information to a cookie in Go, you use the net/http/package's\
    \ SetCookie function, whose signature looks like this:\n\n```\nhttp.SetCookie(w\
    \ ResponseWriter, cookie *Cookie)\n```\n\nThe w is the response to the request\
    \ and cookie is a struct:\n\n```\ntype Cookie struct {\n\tName        string\n\
    \tValue       string\n\tPath        string\n\tDomain      string\n\tExpires  \
    \   time.Time\n\tRawExpires  string\n\tMaxAge      int\n\tSecure      bool\n\t\
    HttpOnly    bool\n\tRaw         string\n\tUnparsed    []string\n}\n```"
  - '[PAGE 73]


    The cookie can hold a lot of information, but the most important fields are:


    +   * Name: A key for the cookie for referring to it in your code.

    * Value: The cookie''s data.

    * Expires: A Time value that denotes when the browser can delete it.


    Other fields that might be useful for controlling access to the cookie:


    +   * Path

    * Domain

    * HttpOnly


    For now, let''s keep it simple.


    Here is an example of how you can set a cookie:


    ```

    expiration := time.Now().Add(365 * 24 * time.Hour)

    cookie := http.Cookie(Name: "username", Value: "jsmith", Expires: expiration)

    http.SetCookie(w, &cookie)

    ```


    > Tip: Go''s time functions are sophisticated but complex. For more information,
    see the documentation at https://golang.org/pkg/time/


    # Fetching cookies


    In order to retrieve a cookie from a request, you can do the following:


    ```

    cookie, _ := r.Cookie("username")

    fmt.Fprintf(w, cookie.body.)

    ```


    Or, if several cookies are associated with a request, you can iterate through
    them, as follows:


    ```

    for _, cookie := range r.Cookies() {

    fmt.Fprintf(w, cookie.Name)

    }

    ```


    # Using cookies


    Let''s create a simple application that uses a cookie.


    The following code checks to see if this is a visitor''s first visit to our site.
    If it is, it displays a welcome message. If not, it displays the time of the last
    visit.'
