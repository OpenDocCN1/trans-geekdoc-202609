  mdcn: "\n\n- http://localhost:8999/city: 以 JSON 格式返回 City 表中所有的城市列表。\n- http://localhost:8999/city/1028:\
    \ 以 JSON 格式返回 ID 为 1028 的城市的详情。\n- http://localhost:8999/cityadd/: 允许用户 POST 一个新城市的\
    \ JSON 表示形式，并返回一个 JSON 结果对象。\n- http://localhost:8999/citydel/1028: 允许用户删除 ID\
    \ 为 1028 的城市并返回一个 JSON 结果对象。\n\n为了在保持尽可能模块化的同时实现这些功能，我们将创建以下文件：\n\n- main.go\n\
    - handlers.go\n- router.go\n- routes.go\n- database.go\n- city.go\n- dbupdate.go\n\
    \n这些模块名称应该是自言易懂的。让我们开始吧。\n\n## 服务与路由\n\n首先，我们来定义路由。我们将使用 `gorilla/mux` 而不是 `net/http`\
    \ 的 `DefaultServeMux`，因为 `gorilla/mux` 通常用起来更好用。而且，我们不会简单地逐一个定义，而是会将路由详情存储在一个结构体中，以便在需要时更容易添加新路由。\n\
    \n这里是 `routes.go`，它在一个名为 `Routes` 的 `Route` 类型切片（大致类比于所有编程语言中的数组）中定义了每个路由及其对应的处理器。\n\
    \n 代码 代码列表 17: routes.go\n```go\npackage main\n\nimport \"net/http\"\n\ntype Route\
    \ struct {\n    Name string\n    Method string\n    Pattern string\n    Handler\
    \ http.HandlerFunc\n}\n\nvar routes []Route = []Route{\n    Route{\n        \"\
    HomePage\",\n        \"GET\",\n        \"/\",\n        HomePage,\n    },\n   \
    \ Route{\n        \"CityList\",\n        \"GET\",\n        \"/city\",\n      \
    \  CityList,\n    },\n    Route{\n        \"CityDisplay\",\n        \"GET\",\n\
    \        \"/city/{id}\",\n        CityDisplay,\n    },\n    Route{\n        \"\
    CityAdd\",\n        \"POST\",\n        \"/cityadd\",\n        CityAdd,\n    },\n\
    \    Route{\n        \"CityDelete\",\n        \"GET\",\n        \"/citydelete/{id}\"\
    ,\n        CityDelete,\n    },\n}\n```\n\n这里的代码列表 18 是 `router.go`，它遍历 `Routes`\
    \ 并为它们创建处理器。\n\n 代码列表 18: router.go\n```go\npackage main\n\nimport \"github.com/gorilla/mux\"\
    \n\nfunc NewRouter() *mux.Router {\n  router := mux.NewRouter().StrictSlash(true)\n\
    \  for _, route := range routes {\n    router.\n      Methods(route.Method).\n\
    \      Path(route.Pattern).\n      Name(route.Name).\n      Handler(route.Handler)\n\
    \  }\n  return router\n}\n```\n\n为了让所有这些路由就绪并提供服务，我们只需要在 `main` 函数中创建一个 `NewRouter`\
    \ 实例，但稍后我们会处理这个问题。\n\n让我们先看一眼 `handlers.go` 中的每个处理器。\n\n首先是 `CityList` 处理器，当用户访问\
    \ http://localhost:8999/city 时调用它。\n\n### 代码列表 19: CityList 处理器\n```go\nfunc CityList(w\
    \ http.ResponseWriter, r *http.Request) {\n  // 查询数据库\n  cities := dbCity()\n\
    \  // 格式响应\n  w.Header().Set(\"Content-Type\", \"application/json\")\n  w.WriteHeader(http.StatusOK)\n\
    \  w.Write(cities)\n}\n```\n\n`CityList` 调用我们 `database.go` 中的 `dbCity` 来查询数据库并以\
    \ JSON 格式返回城市列表。在 Go 中处理 JSON，你需要 `encoding/json` 包。然后你就可以调用 `json.Marshal` 将结构体转换为\
    \ JSON。\n\n### 代码列表 20: 将查询响应编码为 JSON\n```go\n// 查找所有城市并作为 JSON 返回。\nfunc dbCity()\
    \ []byte {\n  var cities []City\n  var city City\n\n  cityResults, err := database.Query(\"\
    SELECT * FROM city\")\n  if err != nil {\n    log.Fatal(err)\n  }\n  defer cityResults.Close()\n\
    \n  for cityResults.Next() {\n    cityResults.Scan(&city.Id, &city.Name, &city.CountryCode,\
    \ &city.District, &city.Population)\n    cities = append(cities, city)\n  }\n\n\
    \  jsonCities, err := json.Marshal(cities)\n  if err != nil {\n    fmt.Printf(\"\
    Error: %s\", err)\n    return nil\n  }\n  return jsonCities\n}\n```\n\n在第 3 章中，我们使用\
    \ `Query` 方法将 SQL 传递给数据库，然后对结果集调用 `Next` 以遍历查询返回的每一行，我们还调用了 `Scan` 将列映射到结构体中的字段。\n\
    \n回到我们的处理器中，我们正在响应中写入适当的头部，返回从 `dbCity` 接收到的 JSON，如列表 21 所示。\n\n### 代码列表 21: 返回包含城市列表的\
    \ JSON 响应\n```go\nfunc CityList(w http.ResponseWriter, r *http.Request) {\n  \
    \  // 数据库\n    jsonCities := dbCity()\n\n    // 格式响应。\n    w.Header().Set(\"Content-Type\"\
    , \"application/json\")\n    w.WriteHeader(http.StatusOK)\n    w.Write(jsonCities)\n\
    }\n```\n\n让我们看看另一个处理器 `CityDisplay`。该处理器在用户访问 http://localhost:8999/city/{id}\
    \ 时被调用。\n\n该处理器接收一个 `id` 参数，并返回从 `dbCity` 接收到的 JSON。如果操作正常，它将在 `database.go` 中工作，如列表\
    \ 22。\n\n### 代码列表 22: 为单个城市发送 JSON 响应\n```go\nfunc CityDisplay(w http.ResponseWriter,\
    \ r *http.Request) {\n    // 获取变量\n    vars := mux.Vars(r)\n    id, err := strconv.Atoi(vars[\"\
    id\"])\n    if err != nil {\n        w.WriteHeader(http.StatusBadRequest)\n  \
    \      return\n    }\n\n    // 查询数据库\n    jsonCities := dbCity(id)\n\n    // 格式响应。\n\
    \    w.Header().Set(\"Content-Type\", \"application/json\")\n    w.WriteHeader(http.StatusOK)\n\
    \    w.Write(jsonCities)\n}\n```\n\n在 `dbCity` 中，我们使用 `QueryRow` 来根据 ID 城市。\n\n\
    ### 代码列表 23: 使用 QueryRow 查找单个城市\n```go\n// 根据 ID 查找城市并作为 JSON 返回。\n\n dbCityDisplay(id\
    \ int) []byte {\n\tvar city City\n\n\terr := database.QueryRow(\"SELECT * FROM\
    \ city WHERE id = ?\", id).\n\t\tScan(&city.Id, &city.Name, &city.CountryCode,\
    \ &city.District, &city.Population)\n\tif err != nil {\n\t\tlog.Fatal(err)\n\t\
    }\n\n\tjsonCities, err := json.Marshal(city)\n\tif err != nil {\n\t\tfmt.Printf(\"\
    Error: %s\", err)\n\t}\n\treturn jsonCities\n}\n```\n\n注意 `dbCityDisplay` 期望返回记录。`CityAdd`\
    \ 稍微复杂一些，因为我们需要从请求体中读取数据。提示：始终限制客户端发送的数据量。\n\n```go\nfunc CityAdd(w http.ResponseWriter,\
    \ r *http.Request) {\n    var city City\n\n    // 读取请求体。\n    body, err := ioutil.ReadAll(io.LimitReader(r.Body,\
    \ 1048576))\n    if err != nil {\n        panic(err)\n    }\n    if err := r.Body.Close();\
    \ err != nil {\n        panic(err)\n    }\n\n    // 将请求中的 JSON 解析为结构体。\n    if\
    \ err := json.Unmarshal(body, &city); err != nil {\n        w.Header().Set(\"\
    Content-Type\", \"application/json\")\n        w.WriteHeader(http.StatusBadRequest)\n\
    \        return\n    }\n\n    // 写入数据库。\n    addResult := dbCityAdd(city)\n\n\
    \    // 格式响应。\n    w.Header().Set(\"Content-Type\", \"application/json\")\n  \
    \  w.WriteHeader(http.StatusCreated)\n    w.Write(addResult)\n}\n```\n\n当我们有了\
    \ JSON 结构体后，可以准备 SQL 语句，然后使用新城市执行它。以这种方式（使用 `db.Prepare`）准备语句的好处是，它可以防止恶意用户试图破坏我们的技术（SQL\
    \ 注入）。\n\n### 代码列表 25: 用于 INSERT 操作的预处理语句\n```go\n// 根据提供的信息创建一个新城市。\nfunc dbCityAdd(city\
    \ City) []byte {\n\n    var addResult DBUpdate\n\n    // 创建预处理语句。\n\tstmt, err\
    \ := database.Prepare(\"INSERT INTO City(Name, CountryCode, District, Population)\
    \ VALUES(?,?,?,?)\")\n\tif err != nil {\n\t\tlog.Fatal(err)\n\t}\n\n\t// 执行预处理语句并获取结果。\n\
    \tres, err := stmt.Exec(city.Name, city.CountryCode, city.District, city.Population)\n\
    \tif err != nil {\n\t\tlog.Fatal(err)\n\t}\n\tlastID, err := res.LastInsertId()\n\
    \tif err != nil {\n\t\tlog.Fatal(err)\n\t}\n\trowCnt, err := res.RowsAffected()\n\
    \tif err != nil {\n\t\tlog.Fatal(err)\n\t}\n\n\t// 使用最后的 ID 和影响行数填充 DBUpdate 结构体。\n\
    \taddResult.Id = lastID\n\taddResult.Affected = rowCnt\n\n\t// 转换为 JSON 并返回。\n\
    \tnewCity, err := json.Marshal(addResult)\n\tif err != nil {\n\t\tfmt.Printf(\"\
    Error: %s\", err)\n\t}\n\treturn newCity\n}\n```\n\n"
