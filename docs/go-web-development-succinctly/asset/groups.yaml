    Of course, this is far from perfect, and if you were planning to put it into production,
    you would probably want to do a fair bit of refactoring, implement better error
    handling, and so on.


    However, the point of all this is to emphasize that Go is an excellent language
    for working on this type of application. I have done similar work in other languages,
    including Node.js and Ruby, and I am much happier working in Go. Everything seems
    much tidier and better thought out, in my humble opinion.


    # Challenge step


    If you''re up for a challenge, try to implement update functionality in the application—that
    is, to put the U back into CRUD!


    For starters, allow the client to submit a JSON object that will first delete
    the existing record (if there is a matching ID), then add a new report success
    (or otherwise) in JSON format, too.


    Next, allow the client to submit some partial JSON along with the ID, then update
    an existing record based on the fields that have changed. For example, the client
    might submit the following:


    ```

    {"id":"4088","name":"Whereville","pop":2}

    ```


    This will update the Name and Population fields in the City table.'
