    # Chapter 5 Creating a RESTful JSON API


    We''ve learned a lot already, so let''s see if we can take all that knowledge
    and do something useful with it.


    In chapter 1, we examined how Go is an excellent choice for creating web services
    for many reasons—for example, its ability to scale massively through its lightweight
    threading model, its ease with modular coding, and its ability to integrate with
    common tools such as cryptographic libraries, secure protocols, and, of course,
    HTTP servers.


    In this chapter, I will demonstrate how we can create a RESTful web service that
    can accept JSON requests and return JSON responses in order to facilitate CRUD
    (Create, Read, Update, and Delete) operations on a database.


    (Actually, I''m going a cheat little here. In order to minimize the complexity
    of our application, I''m going to create a CRD application. The Update functionality
    will be left as an exercise for the reader)


    This application will use what we''ve learned far about serving, routing, and
    accessing a database. In building it, I''ll show you how might design and develop
    a typical web service. It won''t be perfect or production-ready, but it should
    give you a good idea of how easy it is to build these sorts of services in Go.


    # RESTful APIs


    If you''re a developer, or if you''ve spent any time with developers, you have
    no doubt heard about REST. Given the amount of hype it has attracted in recent
    years, you would think that it, too, was a recent concept. But it''s not. In fact,
    it''s as old as the web itself.


    REST is simply to handle the hundreds of different protocols that have been developed
    over the years that have aimed to get computers talking to each other networks
    using the same language.


    Some of these protocols have included SOAP (which, because of its reliance on
    XML as a transport mechanism, requires a fair amount of data and computing power
    and began to fall out as mobile devices became ubiquitous), JMS (which is specific
    to Java applications and therefore not really geared for widespread adoption),
    and XML-RPC (which, like SOAP, uses XML without implementing the standards that
    SOAP has).


    As with all these approaches, the aim behind REST was to make sharing data easy
    for computers while at the same time being transparent enough that human observers
    understand what they are doing.


    What REST offers, is the ability to do this while remaining lightweight. Its methods
    are familiar to developers who uses the same, established methods employed by
    the web itself.'
