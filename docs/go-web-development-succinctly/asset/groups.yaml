    \        return\n    }\n\n    // Write to the database.\n    addResult := dbCityAdd(city)\n\
    \n    // Format the response.\n    w.Header().Set(\"Content-Type\", \"application/json\"\
    )\n    w.WriteHeader(http.StatusCreated)\n    w.Write(addResult)\n}\n```\n\nNotice\
    \ how we're setting a limit on the amount of data we'll accept from the client.\
    \ > Tip: Always limit the amount of data you will allow a client to send to your\
    \ application.\n\nWhen we have the JSON in a struct, we can prepare a statement\
    \ in SQL, then execute it with the new city. The benefit of preparing a statement\
    \ in this way, using db.Prepare, is that it protects against SQL injection if\
    \ the same malicious user tries to sabotage us another favorite hacker's technique.\n\
    \n### Code Listing 25: Using a Prepared Statement for the INSERT Operation\n```go\n\
