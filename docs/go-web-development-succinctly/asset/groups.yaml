    \ to the database server, we'll next need to reference both and the generic **database/sql**\
    \ package in our **import** statement. Note that we are preceding the driver import\
    \ with an underscore (_). This tells the Go compiler that the package we are referring\
    \ is complementary to another package—in this instance, the **database/sql** package.\
    \ We're using it only for its initialization capability—what Go calls \"side effects.\"\
    \n\n```\nimport (\n\t\"database/sql\"\n\t\"log\"\n\t_ \"github.com/go-sql-driver/mysql\"\
    \n)\n```\n\nNext, we need to specify the server host, port number, initial database,\
    \ user name, and password that we'll use to build the connection string.\n\n```\n\
    db, err := sql.Open(\"mysql\", \"root:password@tcp(127.0.0.1:3306)/world\")\n\
    ```\n\nThere are three tables in the \"world\" database—Country, City, and CountryCode,\
    \ the last of which links cities to countries. It's a good idea to create types\
    \ for each of the database tables in your application so that it will be easier\
    \ to implement changes in the schema later."
