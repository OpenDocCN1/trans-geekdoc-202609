  mdcn: "\n除了 `{{.Name}}` 条目外，其他一切看起来都很熟悉。对于 Go 模板来说，这是一个变量。它包含在双大括号内，其名称（Name）前面有一个点。\n\
    \n点表示变量的作用域或上下文。在我们的案例中，`Name` 变量指的是 `Person` 结构体的 `Name` 字段，当你看到我们在程序逻辑中使用的定义时，这一点显而易见：\n\
    \n```go\ntype Person struct {\n  Name string\n}\n```\n\n我们可以传递一个 `Person` 结构体来填充模板变量，它将提取\
    \ `Name` 字段并将其替换模板中的变量定义。\n\n注意，你在模板中引用的任何字段必须是导出的（exported）。也就是说，它们必须以大写字母开头。未导出的字段会导致问题，正如我们稍后看到的。。\n\
    \n代码列表 11 显示了完整的程序代码。\n\n# 代码列表 11：使用模板\n\n```go\npackage main\n\nimport (\n \
    \ \"log\"\n  \"net/http\"\n  \"text/template\"\n)\n\ntype Person struct {\n  Name\
    \ string\n}\n\nfunc main() {\n  http.HandleFunc(\"/\", handler)\n  err := http.ListenAndServe(\"\
    :8999\", nil)\n  if err != nil {\n    log.Fatal(\"ListenAndServe: \", err)\n \
    \ }\n}\n```\n\n这里唯一值得注意的代码是在 `handler` 函数中，当用户访问 http://localhost:8999 我们的 Web\
    \ 应用程序根目录时会被调用。\n\n`Handler` 创建了一个 `Person` 类型的变量 `p`并将 \"John Smith\" 赋值给它的 `Name`\
    \ 字段。然后我们使用 `template.ParseFiles`，传入模板文件名并将结果赋值给变量 `t`。\n\n解析模板文件后，接接我们需要执行合并（merge），我们通过调用\
    \ `Execute` 来实现，它将 `http.ResponseWriter` 和我们想要与模板合并的数据项作为参数传递。\n\n当我们在浏览器中启动应用程序时，得到了图\
    \ 15。\n\n![](img/cdabbe899d95a91197e7ec37cc1c8048_39_0.png)\n\n图 15：我们简单模板的输出\n\
    \n# 使用模板重构数据访问应用程序\n\n让我们新学到的 Go 模板知识派上用场。首先，我们需要理解模板的许多功能之一——遍历结果集的能力，然后对其中的每个结果应用适当的格式化。\n\
    \n为了实现这一点，我们必须使用 `{{range}} ... {{end}}` 结构。我们将使用以下模板来构建我们的表格。`{{range}}` 和 `{{end}}`\
    \ 之间的所有内容将为传入的对象的每个成员重复一次。\n\n代码列表 12：“Cities”数据库应用程序的模板\n\n```html\n<html\n<head>\n\
    <title>City Search</title>\n</head>\n<body>\n<h1>Search Results</h1>\n<table border='1'>\n\
    \  <tr>\n    <th>City</th>\n```\n\n```html\n    <tr>\n    <th>Country Code</th>\n\
    \    <th>Population</th>\n  </tr>\n  {{range .}}\n  <tr>\n    <td>{{.Name}}</td>\n\
    \    <td>{{.CountryCode}}</td>\n    <td>{{.Population}}</td>\n  </tr>\n  {{end}}\n\
    </table>\n</body>\n</html>\n```\n\n看到紧跟在 `range` 关键字后面出现的点符号（dot notation）了吗？它意味着“任何对象”。\n\
    \n关于 Go 模板中使用 `range` 的一个重要注意事项是——它们只接受单个对象。“什么？”我听到你这么说，“为什么本应该遍历值切片（slice）的东西只接受一个？”\n\
    \n你是对的。`range` 允许我们放入一个值的数组或切片，然后它会进入该对象提取出其成员。\n\n因此，在我们的数据库应用程序中，我们只需要进行一些重构，以确保每个查询结果都添加到切片中——让我们称其为\
    \ `cities`——然后我们将该切片传递到模板中。\n\n代码列表 13：在我们的“Cities”应用程序中使用模板\n\n```go\npackage\
    \ main\n\nimport (\n\t\"database/sql\"\n\t\"html/template\"\n\t\"log\"\n\t\"net/http\"\
    \n\n\t\"github.com/go-sql-driver/mysql\"\n)\n\ntype City struct {\n\tName    \
    \    string\n\tCountryCode string\n\tPopulation  int\n}\n\nvar database *sql.DB\n\
    \nfunc main() {\n\tdb, err := sql.Open(\"mysql\", \"root:password@tcp(127.0.0.1:3306)/world\"\
    )\n\tif err != nil {\n\t\tlog.Println(\"Could not connect!\")\n\t}\n\tdatabase\
    \ = db\n\tlog.Println(\"Connected.\")\n\n\thttp.HandleFunc(\"/\", showCity)\n\t\
    http.ListenAndServe(\":8999\", nil)\n}\n\nfunc showCity(w http.ResponseWriter,\
    \ r *http.Request) {\n\tvar cities []City\n\tqueryParam := r.URL.Path[1:]\n\t\
    rows, err := database.Query(\"SELECT Name, CountryCode, Population FROM city WHERE\
    \ Name LIKE ?\", queryParam)\n\tif err != nil {\n\t\tlog.Fatal(err)\n\t}\n\tdefer\
    \ rows.Close()\n\n\tfor rows.Next() {\n\t\tvar theCity City\n\t\terr := rows.Scan(&theCity.Name,\
    \ &theCity.CountryCode, &theCity.Population)\n\t\tif err != nil {\n\t\t\tlog.Fatal(err)\n\
    \t\t}\n\t\tcities = append(cities, theCity)\n\t}\n\n\tt, _ := template.ParseFiles(\"\
    results.html\")\n\tt.Execute(w, cities)\n}\n```\n\n# 在模板中使用方法\n\n假设我们想用逗号分隔符格式化\
    \ `Population` 列。Go 并没有提供这种功能，因此我们必须编写自己的方法。\n\n```go\nfunc (c City) FormatPopulation(n\
    \ int, sep rune) string {\n\ts := strconv.Itoa(n)\n\tvar buff bytes.Buffer\n\t\
    startOffset := 0\n\tif n < 0 {\n\t\tstartOffset = 1\n\t\tbuff.WriteByte('-')\n\
    \t}\n\tl := len(s)\n\tcommaIndex := 3 - ((l - startOffset) % 3)\n\tif commaIndex\
    \ == 3 {\n\t\tcommaIndex = 0\n\t}\n\tfor i := startOffset; i < l; i++ {\n\t\t\
    if commaIndex == 3 {\n\t\t\tbuff.WriteRune(sep)\n\t\t\tcommaIndex = 0\n\t\t}\n\
    \t\tcommaIndex++\n\t\tbuff.WriteByte(s[i])\n\t}\n\treturn buff.String()\n}\n```\n\
    \n注意该函数接受一个整数和一个分隔符并返回一个字符串。你可以将 Go 关键字视为 Unicode 字符的别名，这在 Go 术语中被称为“代码点”（code\
    \ point）。\n\n要在模板中调用此函数，我们只需指定它的名称并跟上任何参数（不带括号），如代码列表 15 所示。\n\n# 代码列表 15：从模板调用\
    \ FormatPopulation 函数\n\n```html\n<html>\n<head>\n<title>City Search</title>\n\
    </head>\n<body>\n<h1>Search Results</h1>\n<table border='1'>\n  <tr>\n    <th>City</th>\n\
    \    <th>Country Code</th>\n    <th>Population</th>\n  </tr>\n  {{range }}\n \
    \ <tr>\n    <td>{{.Name}}</td>\n    <td>{{.CountryCode}}</td>\n    <td>{{.FormatPopulation\
    \ .Population ','}}</td>\n  </tr>\n  {{/range}}\n</table>\n</body>\n</html>\n\
    ```\n\n当我们执行应用程序时，我们得到了格式化良好的人口值，如图 17 所示。\n\n![](img/cdabbe899d95a91197e7ec37cc1c8048_44_0.png)\n\
