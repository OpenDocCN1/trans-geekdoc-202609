    # About the Author


    Mark Lewin has been developing, teaching, and writing about software for more
    than 18 years. His main interests are web development in general and web mapping
    in particular. While working for ESRI, the world''s largest GIS company, he acted
    as a consultant, trainer, and course author. He has been a frequent speaker at
    industry events, and he currently works with a wide variety of open-source mapping
    tools and a handful of relevant JavaScript frameworks, including Node.js, Dojo,
    and Query.


    Based in the U.K., Mark currently teaches ArcGIS Server/JavaScript development
    for Geospatial Training LLC and is the author of the Google Maps API: Get Started
    course for Pluralsight. By day, he writes MySQL courseware for Oracle.


    Mark can be reached at mark@marklewin.com or on Twitter at @gisapps.


    This is Mark''s third e-book for Syncfusion. The first, Leaflet is Succinctly,
    Go Succinctly, will be published by the time you read this.


    # Acknowledgements


    I''d like to thank my children for being little rays of sunshine, even on dark
    days. Words cannot express how I feel about you all.


    And to my best friend, the “philosopher” David Peters. Everyone needs a friend
    to help them in the down times and keep them grounded in the good times, and David
    does that for me.'
  - '[PAGE 9]


    # # Chapter 1 Introduction


    # ## Who is this e-book for?


    This book is for any developer who has a basic familiarity with the Go programming
    language and is interested in using Go to write web applications.


    If you can write simple console applications with Go, you shouldn''t have any
    problem understanding the contents of this short e-book.


    If you''re looking for a primer on the language itself, I may humbly recommend
    my book Go Succinctly, which will take you from zero to... well, if not exactly
    mastery, as an appreciation and understanding of the Go programming language.
    It also gives you links to other resources that help you become familiar with
    Go.


    Like all e-books in Syncfusion''s *Succinctly* series, you can download Go Succinctly
    free of charge from the Syncfusion website.


    # ## Why use Go for web development?


    Go is an excellent language for writing applications, specifically for web services.
    In fact, it was designed specifically with the web in mind. After all, any modern
    programming language can hardly gain traction if it ignores the web.


    So, which features of the Go programming language are particularly useful for
    web development? Here are a few:


    # ## Concurrency


    Any decent-sized web server needs to run many thousands of tasks concurrently.
    Concurrency is complex and difficult in many languages because it is usually implemented
    as an afterthought. Concurrency, however, is built into the Go language. Indeed,
    concurrency is one of the main problems the Go was designed to solve.


    In Go, concurrency is achieved by using Goroutines, which are lightweight threads
    that allow developers to perform multiple operations asynchronously. These are
    incredibly useful in web applications. For example, when a user connects to your
    web server, you can simply spawn a Goroutine to handle any interactions with that
    client.merely prefix the function call with the `go` keyword. Better still, Goroutine
    scales incredibly well, and your web applications will pull along quite happily
    while servicing thousands of users.'
  - '[PAGE 10]


    # Modularity


    Web applications, like many other modern applications, usually grow to include
    a lot of code. Keeping this code organized and efficient, so that it''s easy to
    understand and maintain, is a challenge for today''s developers. This is especially
    the case when several developers are working on the same application and each
    developer formats their code differently.


    Go away many of these problems by imposing a specific method of structuring and
    formatting code. Functions, variables, constants, and type declarations are all
    expected to be in predictable places, and Go require all of them to be coded in
    a specific way.


    If Go sound draconian in this regard, consider this—what you lose in freedom of
    expression you gain in predictability; everything is what you expect it to be
    and formatted identically throughout.


    Go makes it easy for you to satisfy your code formatting rules by providing you
    with the fmt package that you can build into your workflow to automatically Goify
    your code.


    # Compilation


    Unlike many recent web server-side languages, the Go programming language is compiled.
    This means that a problem such as a runtime error might be difficult to track
    down is caught in the compilation step. Go''s static typing system also helps
    you discover errors during development that might otherwise escape into production.


    # The net/http package


    Go''s net/http package is excellent and makes starting a web server having full
    control of accepting requests and delivering responses very easy. Routing is handled
    by a multiplexer. You can either adopt the one in the standard library or select
    from several third-party options. In this book, we''ll start by using Go''s DefaultServeMux,
    then we''ll consider a very capable alternative: gorilla/mux.


    # Setting up your development environment


    I won''t delve deeply into setup here because I''m going to assume that you have
    some experience using Go. However


    The steps involved in setting up your environment consists of:


    +   * Installing the Go tools.

    * Creating a workspace and setting the GOPATH environment variable.


    # Installing the Go tools


    The exact steps you will need to follow depend on which platform you are using.
    Go binaries are available for Windows, Mac OS X, and "nix platforms.'
  - '[PAGE 11]


    You can download them here: https://golang.org/dl/, as shown in Figure 1.


    | The Go Programming Language | Documents | Packages | The Project | Help | Blog
    | Search |


