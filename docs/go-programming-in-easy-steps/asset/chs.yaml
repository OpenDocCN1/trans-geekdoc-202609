  \n## Select 通道\n\n当多个 goroutine 在不同时间向通道发送消息时，程序可能会在等待从较慢的通道接收消息时阻塞进度。Go 提供了一种解决方案，通过在\
  \ `select` 语句块中同时监听多个通道的消息来解决这种阻塞操作。它的语法与此处（第 50 页）描述的 switch 语句相似，但 `select` 语句会阻塞直到它的一个\
  \ case 语句找到匹配。一旦找到匹配，该 case 语句关联的语句就会执行。这种组合 goroutine 和通道的能力是 Go 编程语言的一项强大特性。\n\
  \n![image](img/pg166_1.jpg)\n\n为了持续监听通道消息，可以将 `select` 语句封装在无限 for 循环内部。可以通过包含一个带有（可以跳出循环到外部标签的）语句的\
  \ case 语句来退出循环。\n\nGo 标准库 `time` 包提供了一个实用的 `After( ` 函数，可以用于创建一个“超时”来限制监听循环的执行时间。它需要一个持续时间作为参数，并返回一个\
  \ `time.Time` 类型的通道——这将当前时间加上持续时间后的未来时间。使用 `case` 语句测试当前时间何时匹配超时通道可以用于退出监听循环。\n\n\
  ![image](img/1p.jpg)首先导入 Go 标准库 `time` 包，以便等待 goroutine 并创建超时\n\n```go\nimport (\n\
  \    “fmt”\n    “time”\n)\n```\n\n![image](img/commonp.jpg)\n\n`src\\select\\main.go`\n\
  \n![image](img/2p.jpg)接下来，在 main 函数中，创建一个超时通道和两个空通道\n\n```go\nc0 := time.After(\
  \ 7 \\* time.Second )\nc1 := make( chan string )\nc2 := make( chan string )\n```\n\
  \n![image](img/3p.jpg)现在，添加两个各传递通道的 goroutine 调用\n\n```go\ngo fastCount( c1 )\n\
  go slowCount( c2 )\n```\n\n![image](img/4p.jpg)在 main 函数之后，添加两个被调用的函数，它们将以不同的间隔发送通道消息\n\
  \n```go\nfunc fastCount( c1 chan string ) {\n    for {\n        time.Sleep( 1 \\\
  * time.Second )\n        c1 <- time.Now( ).Format( “04:05” )\n    }\n}\n\nfunc slowCount(\
  \ c2 chan string ) {\n    for {\n        time.Sleep( 2 \\* time.Second )\n     \
  \   c2 <- time.Now( ).Format( “04:05” )\n    }\n}\n```\n\n![image](img/5p.jpg)现在，回到\
  \ main 函数，添加一个无限循环来接收来自任何一个通道的消息\n\n![image](img/pg167_2.jpg)\n\n```go\nfor {\n\
  \    select {\n    case done := <-c0:\n        fmt.Println( “Timed Out at ”, done.Format(\
  \ “04:05” ) )\n        break Listener\n    case msg1 := <-c1:\n        fmt.Println(\
  \ “1-Second Message at ”, msg1 )\n    case msg2 := <-c2:\n        fmt.Println( “2-Second\
  \ Message at ”, msg2 )\n    }\n}\n```\n\n## 同步 Goroutine\n\n无缓冲通道的阻塞操作，即发送者等待另一个\
  \ goroutine，事实上，无缓冲通道有时被称为“同步通道”。因此，通道可以用于连接 goroutine，使得发送的项目被另一个项目接收到。默认情况下，通道既可以发送也可以接收，但当你指定了方向时，通道只能发送或接收。只发送通道在参数中通过在\
  \ `chan` 关键字前加上 `<-` 来指定，如下：\n\n```go\nfunc funcName(paramName <-chan dataType)\n\
  ```\n\n相反，只接收通道在参数中通过在 `chan` 关键字后加上 `<-` 来指定，如下：\n\n```go\nfunc funcName(paramName\
  \ chan<- dataType)\n```\n\n如果发送者知道不会向接收通道发送更多值，就可以方便地关闭该通道。\n\n\n\n\n\n![image](img/pg170_1.jpg)\n\
  \n工作池允许你从多个并发调用向 goroutine 发送任务，该 goroutine 会根据 Go 调度器确定的随机顺序完成每个任务。你可以使用 `WaitGroup`\
  \ 等待多个 goroutine 完成，或者简单地将任务结果发送到空——以排空通道并确保所有工作 goroutine 均已完成。\n\n![image](img/pg170_2.jpg)\n\
  \n![image](img/1p.jpg)首先导入 Go 标准库 `time` 包，以便对工作 goroutine 函数进行延迟处理。\n\n```go\n\
  import (\n\t\"fmt\"\n\t\"time\"\n)\n```\n\n![image](img/commonp.jpg)\n\nsrc\\workers\\\
  main.go\n\n接下来，在 `main` 函数中，初始化一个任务总数变量，并创建两个容量为总数的缓冲通道。\n\n```go\nnumJobs := 10\n\
  jobs := make( chan int, numJobs )\nresults := make( chan int, numJobs )\n```\n\n\
  ![image](img/3p.jpg)现在，添加三个工作 goroutine 调用，每个调用传递一个 ID 数字和两个通道。\n\n```go\ngo worker(\
  \ 1, jobs, results )\ngo worker( 2, jobs, results )\ngo worker( 3, jobs, results\
  \ )\n```\n\n![image](img/4p.jpg)为 10 个任务中的每个任务发送一个整数，然后关闭该通道以表示队列中所有任务已完毕。\n\n```go\n\
  for i := 1 ; i <= numJobs ; i++ {\n\tjobs <- i\n}\nclose( jobs )\n```\n\n![image](img/5p.jpg)在\
  \ main 函数之后，添加被用的工作函数，该函数接受工作 ID 数字、一个用于接收任务号的只读通道，以及一个用于发送 10 个结果的只写通道。\n\n```go\n\
  func worker( id int, jobs <-chan int, results chan<- int ) {\n\tfor job := range\
  \ jobs {\n\t\tfmt.Print( “Worker “, id, “ ran Job “, job )\n\t\tfmt.Printf( “ …%v\
  \ x %v = %v \\n”, job, job, job*job )\n\t\ttime.Sleep( 1 * time.Second )\n\t\tresults\
  \ <- job\n\t}\n}\n```\n\n![image](img/6p.jpg)现在，回到 main 函数，添加一个循环来收集结果并确保所有工作已完成。\n\
  \n```go\nfor i := 1 ; i <= numJobs ; i++ {\n\t<- results\n}\nclose( results )\n\
  ```\n\n![image](img/7p.jpg)将程序文件保存在“workers”目录中，然后运行程序查看工作池的运行。\n\n![image](img/pg171_1.jpg)\n\
  \n![image](img/hot.jpg)\n\n此示例中的 1 秒延迟仅仅模拟了执行更耗时任务所需的时间。\n\n![image](img/hot.jpg)\n\
  \n“工作池”也被称为“线程池”。它们不需要为每个任务创建一个新线程，因此可以更好的性能。\n\n## 总结\n\n- 并行是同时执行两个任务。\n- 并发是将程序代码拆分成可以同时执行的独立任务。\n\
  - Goroutine 提供了并发执行代码行的能力。\n- 通过在普通函数调用之前插入 `go` 关键字来创建 goroutine。\n- Go 标准库 `sync`\
  \ 包提供了 `WaitGroup` 类型，可以等待多个 goroutine 完成。\n- `WaitGroup` 具有一个 `Add()` 增方法、一个 `Done()`\
  \ 减方法和一个 `Wait()` 方法。\n- 当将 `WaitGroup` 作为参数传递给函数时，必须作为指针传递。\n- Go 通道像一根管道，程序可以通过它发送和接收消息。\n\
  - 使用 `make()` 函数创建通道。\n- `close()` 函数可以关闭通道。\n- `select` 语句可以处理多个通道操作。\n- `<-` 运算符用于从通道接收消息。\n\
  \n\n\n\n请求处理函数默认情况下始终包含一个用于 `http.ResponseWriter` 对象的参数，用于向请求写入响应，以及一个指向 `http.Request`\
  \ 对象的指针，该对象包含请求的信息——例如，它的 `URL.Path` 包含了指定给 `http.HandleFunc()` 的字符串模式。通常，`http.ResponseWriter`\
  \ 对象被简单命名为 `w`，而 `http.Request` 对象的指针被命名为 `r`。\n\n`http.ResponseWriter` 对象有一个 `Write()`\
  \ 方法，它接受一个字节切片（byte slice）作为参数，用于发送响应中的字符。这些字符可以转换为字符串，如下：\n\n```\nw.Write([]byte(\"\
  response string\"))\n```\n\n然而，使用 Go 标准库 `io`（输入/输出）包中的 `WriteString()` 函数将字符串传递给\
  \ `http.ResponseWriter` 对象会更加方便。这可以通过导入 `io` 包来实现。\n\n`io.WriteString()` 函数需要两个参数：用于指定\
  \ `http.ResponseWriter` 对象以及要在响应请求中发送的字符串。\n\n![image](img/1o.jpg)首先在之前的程序 `import`\
  \ 部分添加导入 Go 标准库 `io` 包的指令\n\n```go\n\"fmt\"\n\"io\"\n\"net/http\"\n)\n```\n\n![image](img/commono.jpg)\n\
  \nsrc\\server\\main.go\n\n![image](img/2o.jpg)接下来，在 `main` 函数的开头插入一条语句来注册路由处理器\n\
  \n```go\nhttp.HandleFunc(\"/hello\", helloHandler)\n```\n\n![image](img/3o.jpg)现在，在\
  \ `main` 函数之后，添加将写入两个字符串作为请求响应的处理器函数\n\n```go\nfunc helloHandler(w http.ResponseWriter,\
  \ r *http.Request) {\n    io.WriteString(w, \"Response from the helloHandler!\\\
  n\")\n    io.WriteString(w, \"URL.Path = \" + r.URL.Path)\n}\n```\n\n![image](img/4o.jpg)将更新后的程序文件保存到“server”目录，然后运行程序启动\
  \ Web 服务器\n\n![image](img/pg177_1.jpg)\n\n![image](img/5o.jpg)如果出现防火墙安全警告，请确认你希望允许\
  \ Web 服务器的访问\n\n![image](img/6o.jpg)启动 Web 浏览器并访问 localhost:8000/hello，查看 Web 服务器对此请求的响应\n\
  \n![image](img/pg177_2.jpg)\n\n## 添加用于提供的文件\n\n既然已经确定服务器程序可以如此处第 177 页的示例所示响应请求，就可以向程序中添加文件，服务器可以在响应请求时交付这些文件。\n\
  \n![image](img/pg178_1.jpg)\n\nWeb 服务器文件通常包含在一个名为 `htdocs`（超文本文档）或类似名称的根目录下。这通常包含\
  \ HTML 文件，可能可能还有一个 `favicon.ico` 图像，用于在浏览器的标题栏中标识网站。根目录通常还包含子目录以对关联文件分组——例如 `img`\
  \ 文件夹中的图像、`css` 文件夹中的样式表等。\n\n在我们的服务器示例中，两个 HTML 文档被添加到根 `htdocs` 目录中，并带有一个 `favicon.ico`\
  \ 图像。单个样式表位于 `htdocs/css` 目录，几张图像包含在 `htdocs/img` 目录中。整个服务器程序树如下所示：\n\n![image](img/pg178_2.jpg)\n\
  \n![image](img/pg178_3.jpg) `favicon.ico` (32px x 32px)\n\n![image](img/pg178_4.jpg)\
  \ `power.png` (100px x 25px)\n\n几张图像（`favicon.ico` (32px x 32px) 和 `power.png` (100px\
  \ x 25px)）位于 `img` 目录。`favicon.ico` 用于标识网站，`power.png` 是用于封面。样式表 `style.css` 包含了用于网页外观的规则，如下：\n\
  \n| | | { |\n| --- | { | | | |\n| --- | --- |\n| img | { float: left; |\n| --- |\
  \ --- |\n| p | { text-align: center; |\n| img | { width: 320px; |\n| --- | --- |\
  \ |\n| p | { font-size: 1.5em; |\n\n![image](img/pg179_1.jpg) `style.css`\n\n名为\
