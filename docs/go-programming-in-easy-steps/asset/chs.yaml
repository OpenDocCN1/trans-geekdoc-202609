  \n![image](img/pg121_1.jpg)\n\n![image](img/forget.jpg)\n\n\n\n\n\n# 合并字符串\n\n![image](img/pg126_1.jpg)\n\
  \n在 Go 语言中，字符串是封装在双引号内的零个或多个字符。因此，这些都是合法的字符串值：\n\n```\ns1 := “My First String”\n\
  s2 := “”\ns3 := “2”\ns4 = “nil”\n```\n\n`s2` 的空引号将变量初始化为空字符串值。赋值给 `s3` 的数值是该数字的字符串表示。Go\
  \ 的 `nil` 零值（通常表示任何值的缺失）当被包含在引号内时，仅仅是一个字符串字面量。\n\n从本质上，字符串是字符的集合；每个字符都包含自己的数据——就像定义数组中的元素一样。因此，将字符串视为字符数组并在处理字符串值时应用数组的特性是逻辑性的。内置的\
  \ `len()` 函数将返回字符串中字符的数量，就像它返回数组中元素数量一样。\n\n`+` 运算符可以用于相加数值，它同时也兼作连接运算符，将多个字符串值连接在一起以创建一个单一的合并字符串。\n\
  \nGo 标准库的 `strings` 包包含了许多用于字符串操作的有用函数。它的 `Join()` 函数将字符串数组的所有元素连接（拼接）起来，创建一个单一的合并字符串。该函数需要两个参数：指定字符串数组的名称以及放置在合并字符串中每个字符串元素之间的分隔符值。通常，你会指定一个空格作为分隔符，以创建一个由空格分隔的合并字符串。\n\
  \n写入标准输出的 `fmt.Printf()` 和 `fmt.Println()` 函数可以在输出中添加空格和换行符，但不会更改实际字符串。然而，它们都返回两个值，即写入的字节数和任何写入错误。如果没有遇到错误，错误值将如往常地为\
  \ `nil`。对于英语语言，写入的字节数通常代表输出的字符数——包括字符串包含的非打印字符。\n\n![image](img/hot.jpg)\n\n非打印字符\
  \ `\\t` 制表符的 ASCII 码为 9，非打印字符 `\\n` 换行符的 ASCII 码为 10。\n\n![image](img/1r.jpg)在程序中导入\
  \ Go 标准库 `strings` 包\n\n```go\nimport (\n    “fmt”\n    “strings”\n)\n```\n\n![image](img/commonr.jpg)\n\
  \nsrc\\join\\main.go\n\n![image](img/2r.jpg)初始化两个变量和一个拼接后的字符串\n\n```go\ns1, s2 :=\
  \ “The Truth is rarely Pure “, “and never Simple.”\nstr := s1 + s2\n```\n\n![image](img/3r.jpg)接下来，输出拼接后的字符串及其长度\n\
  \n```go\nchars, err := fmt.Printf(\"\\n%v \\n\", str)\nif err != nil {\n    fmt.Println(err)\n\
  } else {\n    fmt.Println(“Bytes Written: “, chars)\n    fmt.Println(“String Length:”,\
  \ len(str))\n}\n```\n\n![image](img/4r.jpg)初始化一个字符串数组和一个连接后的字符串\n\n```go\narr :=\
  \ []string { “\\n\\tStrive”, “For”, “Greatness!” }\nast := strings.Join(arr, “ “)\n\
  ```\n\n![image](img/5r.jpg)现在，输出连接后的字符串和前两个字符\n\n```go\nfmt.Println(ast)\nif ast[0]\
  \ == 10 && ast[1] == 9 {\n    fmt.Printf(“1st Char: ASCII %v Newline\\n”, ast[0])\n\
  \    fmt.Printf(“2nd Char: ASCII %v Tab\\n”, ast[1])\n}\n```\n\n![image](img/6r.jpg)将程序文件保存在“join”目录中，然后运行程序查看合并后的字符串\n\
  \n![image](img/pg127_1.jpg)\n\n![image](img/forget.jpg)此处写入的字节数超过字符串长度是因为 `fmt.Printf()`\
  \ 方法添加了换行符和一个空格字符。\n\n# 分割字符串\n\n![image](img/pg128_1.jpg)Go 标准库 `strings` 包提供了多个允许对指定字符串进行搜索以查找特定字符或子字符串（模式）的函数。Go\
