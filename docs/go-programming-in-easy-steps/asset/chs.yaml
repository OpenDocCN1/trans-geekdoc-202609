  # 查找字符\n\n![image](img/pg130_1.jpg)标准库 `strings` 包提供了多个允许对指定字符串进行搜索以查找特定字符或子字符串（模式）的函数。这些函数将字符串视为数组，其中每个元素包含一个字符或空格。\n\
  \n`strings` 包有一个 `Contains()` 函数，它需要两个参数来指定字符串和要查找的模式。该函数将简单返回真或假以指示（区分大小写）搜索的结果。例如，查找“Pro”模式：\n\
  \n\n\n\n\n`strings.Contains( “Go Programming in easy steps”, “Pro” )`\n\n`strings`\
  \ 包还包含一个 `Index()` 函数，它需要两个参数来指定一个字符串和一个要查找的模式。如果搜索成功，该函数将返回一个整数，表示模式在被搜索字符串中首次出现的索引位置；如果搜索失败，则将返回\
  \ -1。\n\n`strings` 包的 `Count()` 函数需要两个参数来指定一个字符串和一个要查找的模式。你可以使用此函数来发现模式在搜索字符串中出现了多少次非重叠的实例。如果模式为空字符串，该函数通常会返回\
  \ 1 加上搜索字符串中的字符数。这允许你通过从返回的整数减去 1 来确定搜索字符串中的字符数量。\n\n`strings` 包的 `HasPrefix()`\
  \ 函数需要两个参数来指定一个字符串和一个要查找的模式。该函数将返回 `true` 或 `false`，表示被搜索字符串是否以指定的模式开头。\n\n同样，`strings`\
  \ 包的 `HasSuffix()` 函数需要两个参数来指定一个字符串和一个要查找的模式，并返回 `true` 或 `false`，表示被搜索字符串是否以指定的模式结尾。\n\
  \n你可以使用 `strings` 包的 `Replace()` 函数通过将指定的模式替换为替换子字符串来修改搜索的字符串。该函数需要四个参数：指定要搜索的字符串、要查找的模式、替换子字符串以及表示要替换实例数量的整数。如果你想替换搜索字符串中所有的模式实例，只需将替换次数指定为\
  \ -1 即可。\n\n![image](img/forget.jpg)\n\n`strings.Index()` 函数在找到搜索字符串中模式的首次实例时停止搜索。\n\
  \n![image](img/1r.jpg)开始在程序中导入 Go 标准库 `strings` 包\n\n```go\nimport (\n    \"fmt\"\
  \n    \"strings\"\n)\n```\n\n![image](img/commonr.jpg)\n\nsrc\\find\\main.go\n\n\
  ![image](img/2r.jpg)通过初始化字符串变量来启动 main 函数\n\n```go\nstr := “I can resist everything\
  \ except temptation”\n```\n\n![image](img/3r.jpg)接下来，测试字符串中是否存在某个子串，然后找到首次实例的索引位置\n\
  \n```go\nfmt.Printf( “\\nFound ‘an’: %v \\n”, strings.Contains( str, “an” ) )\n\
  fmt.Printf( “Found ‘an’ at: %v \\n”, strings.Index( str, “an” ) )\n```\n\n![image](img/4r.jpg)现在，统计特定字母在字符串中出现了多少次\n\
  \n```go\nfmt.Printf( “Count of ‘e’: %v \\n”, strings.Count( str, “e” ) )\n```\n\n\
  ![image](img/5r.jpg)然后，测试字符串是否以特定的子串开头或结尾\n\n```go\nfmt.Printf( “Prefix ‘ion’: %v\
  \ \\n”, strings.HasPrefix( str, “ion” ) )\nfmt.Printf( “Suffix ‘ion’: %v \\n”, strings.HasSuffix(\
  \ str, “ion” ) )\n```\n\n![image](img/6r.jpg)最后，替换字符串中的一个子串\n\n```go\nfmt.Println(\
  \ strings.Replace( str, “temptation”, “chocolate”, 1 ) )\n```\n\n![image](img/7r.jpg)将程序文件保存在“find”目录中，然后运行程序查看搜索结果\n\
  \n![image](img/pg131_1.jpg)\n\n## 转换字符串\n\n![image](img/pg132_1.jpg)\n\nGo 标准库 `strings`\
  \ 包提供了转换字符串字符大小的函数。\n\n`strings` 包有一个 `ToUpper()` 函数，它需要一个字符串参数。该函数将简单返回字符串的副本，将其所有字符都转换为大写字母。\n\
  \n同样，`strings` 包的 `ToLower()` 函数需要一个字符串参数，并将返回字符串的副本，将其所有字符都转换为小写字母。\n\n`strings`\
  \ 包 true 一个 `ToTitle()` 函数，它需要一个字符串参数。该函数将返回字符串的副本，将每个单词的首字母转换为大写字母——但仅当字符串参数全为小写时才有效。如果你想将一个混合大小写的字符串转换为标题格式（title\
  \ case），必须先使用 `strings` 包的 `ToLower()` 函数将其转换为小写。\n\n当程序接收用户输入时，可能包含前或后缀的空格。你可以使用\
  \ `strings` 包的 `Trim()` 函数移除这些空格。要将字符串转换为整数，`strconv` 包提供了 `Atoi()` 函数，它等同于调用 `ParseInt(str,\
  \ 10, 0)`。为了更精细的控制，你可以使用 `strconv.ParseInt()`。\n\n```go\nimport (\n    \"fmt\"\n\
  \    \"strings\"\n    \"strconv\"\n)\n\nfunc main() {\n    str := “I can resist\
  \ everything except temptation”\n    fmt.Println(strings.ToUpper(str))\n    fmt.Println(strings.ToLower(str))\n\
  \    fmt.Println(strings.Title(str))\n\n    str = “ 42 “\n    fmt.Printf( “\\n%v\
  \ Type: %T, Length: %v\\n”, str, str, len(str) )\n\n    str = strings.Trim(str,\
  \ “ “)\n    fmt.Printf( “\\n%v Type: %T, Length: %v\\n”, str, str, len(str) )\n\n\
  \    num, err := strconv.Atoi(str)\n    if err != nil {\n        fmt.Println(err)\n\
  \    } else {\n        fmt.Printf( “%v Type: %T\\n”, num, num )\n    }\n}\n```\n\
  \n\n\n\n\n| 函数 | 说明 |\n| :--- | :--- |\n| `math.SqrtPi` | 常数 ![image](img/pg134_3.jpg)Pi\
  \ 的平方根，近似值为 1.77246 |\n| `math.SqrtPhi` | 常数 ![image](img/pg134_4.jpg)Phi 的平方根，近似值为\
  \ 1.27202 |\n| `math.Ln2` | 2 的自然对数，近似值为 0.69315 |\n| `math.Log2E` | 常数 `e` 的以 2\
  \ 为底的对数，近似值为 1.44269 |\n| `math.Ln10` | 10 的自然对数，近似值为 2.30259 |\n| `math.Log10E`\
  \ | 常数 `e` 的以 10 为底的对数，近似值为 0.43429 |\n\n这些数学常量主要用于具有特定数学目的 Go 程序，但为了完整性，上面列出了所有的\
  \ `math` 包常量。\n\n![image](img/hot.jpg)\n\n黄金比例在几何和艺术中多次出现。它是一个线段被切成两个长度不同的部分时的比例，其中长部分与短部分的长度之比等于整个线段与长部分的长度之比。\n\
  \n![image](img/pg134_2.jpg)\n\n![image](img/1r.jpg)首先在程序中导入 Go 标准库的 math 包\n\n```go\n\
  import (\n    \"fmt\"\n    \"math\"\n)\n```\n\n![image](img/commonr.jpg)\n\n`src\\\
  area\\main.go`\n\n![image](img/2r.jpg)声明三个浮点变量\n\n```go\nvar rad, area, perim float64\n\
  ```\n\n![image](img/3r.jpg)接下来，初始化第一个变量并保留两位小数显示其值\n\n```go\nrad = 4\nfmt.Printf(\"\
  \\nRadius of Circle: %.2f \\n\", rad)\n```\n\n![image](img/4r.jpg)现在，根据给定的半径计算圆的面积，然后保留两位小数显示面积\n\
  \n```go\narea = math.Pi * (rad * rad)\nfmt.Printf(\"\\nArea of Circle: %.2f \\n\"\
  , area)\n```\n\n![image](img/5r.jpg)然后，根据给定的半径计算圆的周长，并保留两位小数显示周长\n\n```go\nperim\
  \ = 2 * (math.Pi * rad)\nfmt.Printf(\"\\nPerimeter of Circle: %.2f \\n\", perim)\n\
  ```\n\n![image](img/6r.jpg)将程序文件保存到“area”目录中，然后运行程序查看计算结果\n\n![image](img/pg135_1.jpg)\n\
  \n![image](img/forget.jpg)\n\n有关在输出中格式化小数的更多信息，请参阅第 24 页。\n\n## 数值评估\n\n![image](img/pg136_1.jpg)\n\
  \nGo 的 `math` 包提供了这些实用的函数，用于评估 `float64` 参数：\n\n| 函数 | 返回 |\n| :--- | :--- |\n|\
  \ `math.Abs()` | 绝对值 |\n| `math.Acos()` | 反余弦值 |\n| `math.Asin()` | 反正弦值 |\n| `math.Atan()`\
  \ | 反正切值 |\n| `math.Atan2()` | 离 X 轴某个点的角度 |\n| `math.Ceil()` | 向上取整的值 |\n| `math.Cos()`\
  \ | 余弦值 |\n| `math.Exp()` | `e` 的幂 |\n| `math.Floor()` | 向下取整的值 |\n| `math.IsNaN()`\
  \ | 是否为非数字（NaN） |\n| `math.Log()` | 自然对数 |\n| `math.Max()` | 两个数中的较大 |\n| `math.Min()`\
  \ | 两个数中的较小 |\n| `math.Pow()` | 幂 |\n| `math.Round()` | 接近的整数 |\n| `math.Sin()`\
  \ | 正弦值 |\n| `math.Sqrt()` | 平方根 |\n| `math.Tan()` | 正切值 |\n\nGo `math` 包提供了这些用于评估\
  \ `float64` 参数的有用函数：`math` 包还包含了更多用于处理小数的函数。首先在程序中导入 Go 标准库 math 包\n\n```go\nimport\
  \ (\n    \"fmt\"\n    \"math\"\n)\n```\n\n`src\\area\\main.go`\n\n声明三个浮点变量\n\n```go\n\
  var rad, area, perim float64\n```\n\n接下来，初始化第一个变量并保留两位小数显示其值\n\n```go\nrad = 4\n\
  fmt.Printf(\"\\nRadius of Circle: %.2f \\n\", rad)\n```\n\n现在，根据给定的半径计算圆的面积，然后保留两位小数显示面积\n\
  \n```go\narea = math.Pi * (rad * rad)\nfmt.Printf(\"\\nArea of Circle: %.2f \\n\"\
  , area)\n```\n\n然后，根据给定的半径计算圆的周长，并保留两位小数显示周长\n\n```go\nperim = 2 * (math.Pi * rad)\n\
  fmt.Printf(\"\\nPerimeter of Circle: %.2f \\n\", perim)\n```\n\n将程序文件保存到“area”目录中，然后运行程序查看计算结果\n\
  \n![image](img/pg135_1.jpg)\n\n![image](img/forget.jpg)\n\n有关在输出中格式化小数的更多信息，请参阅第\
  \ 24 页。\n\n## 数值评估\n\n![image](img/pg136_1.jpg)\n\nGo `math` 包提供了这些实用的函数，用于评估 `float64`\
