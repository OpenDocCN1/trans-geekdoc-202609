  ![image](img/pg180_1.jpg) `form.html`\n\nGo 标准库 `net/http` 包提供了函数，可以使 Web 服务器轻松响应\
  \ HTTP 请求。根目录的路径首先作为 `Dir()` 函数的参数。这返回一个作为 `FileServer()` 函数参数的 `Dir` 类型。最后，使用 `Handle()`\
  \ 函数来注册处理器。它需要一个模式和处理器名称。通常使用 `/` 作为第一个参数——以匹配所有路径。\n\n![image](img/pg180_2.jpg)\n\
  \n在 `main` 函数的开头，插入一条语句来指定要提供的文件根目录\n\n```go\ndir := http.Dir(\"C:/Users/mike_/go/server/htdocs\"\
  )\n```\n\n![image](img/commono.jpg)\n\nsrc\\server\\main.go\n\n![image](img/2o.jpg)接下来，为该文件系统创建一个处理器\n\
  \n```go\nfileServer := http.FileServer(dir)\n```\n\n![image](img/3o.jpg)现在，为所有 HTTP\
  \ 请求注册处理器\n\n```go\nhttp.Handle(\"/\", fileServer)\n```\n\n![image](img/4o.jpg)保存更新后的程序文件，然后启动\
  \ Web 服务器并访问 localhost:8000/index.html（或直接访问 localhost:8000）查看静态索引 页\n\n## 记录接收的数据\n\
  \n成功交付静态索引 页后，程序现在可以提供一个表单页面用于提交数据。\n\n![image](img/pg181_1.jpg)\n\n`http.Request`\
  \ 对象有一个 `ParseForm()` 方法，它可以填充 `http.Request.Form` 对象以包含提交的表单输入值。可以通过指定表单输入名称作为\
  \ `http.Request.FormValue()` 方法的参数来获取提交的值。\n\n还有一个 `http.Request.Method` 对象，包含了赋值给表单\
  \ HTML method 属性的值。`POST` 方法被用于提交表单数据。\n\n如果表单提交无法解析，或者表单使用了错误的提交方法，可以通过 `http.Error()`\
  \ 函数向浏览器发送错误消息。这需要三个参数来指定 `http.ResponseWriter` 名称、错误字符串消息以及 HTTP 状态码——例如 400（错误请求）或\
  \ 405（方法不允许）。\n\n\n\n\n提交的表单值可以使用 Go 标准库 `strings` 包进行格式化，以修剪空格并更改大小写。然后可以将这些值写入使用\
  \ Go `os` 包中的 `OpenFile()` ` 函数创建的日志文件中。Go 标准库 `log` 包提供了一个 `SetOutput()` ` 函数用于指定要写入的日志文件，以及一个\
  \ `Print()` 函数用于指定要写入日志文件的内容。这可以方便地为记录的每个项目添加写入时的日期和时间前缀。\n\n![image](img/1o.jpg)\n\
  \n首先，在之前的程序中添加指令以导入 Go 标准库 `strings`、`os` 和 `log` 包的指令：\n\n```go\nimport (\n   \
  \ \"fmt\"\n    \"io\"\n    \"log\"\n    \"net/http\"\n    \"os\"\n    \"strings\"\
  \n)\n```\n\n![image](img/commono.jpg)\n\nsrc\\server\\main.go\n\n![image](img/2o.jpg)\n\
  \n接下来，在 `main` 函数中，注册一个带有路由参数的表单处理器，该参数将识别分配给表单 HTML `action` 属性的名称\n\n```go\nhttp.HandleFunc(\"\
  /lookup\", formHandler)\n```\n\n![image](img/hot.jpg)\n\nGo 为每个 HTTP 状态码提供了常量，例如带有\
  \ `http.StatusOk` 的 200。请查看 [golang.org/pkg/net/http](http://golang.org/pkg/net/http)\
  \ 档获取完整的代码列表。\n\n![image](img/3o.jpg)\n\n在 `main` 函数之后，从表单处理器开始，进行验证以检查提交方法为\n\n\
  ```go\n{\n    if r.Method != \"POST\" {\n        http.Error(w, \"Method Not Allowed\"\
  , 405)\n        return\n    }\n    // 在此处插入语句。\n}\n```\n\n![image](img/commono.jpg)\n\
  \nsrc\\server\\main.go\n\n![image](img/4o.jpg)\n\n接下来，在表单处理器中，插入语句解析表单数据或向浏览器返回错误消息\n\
  \n```go\nerr := r.ParseForm()\nif err != nil {\n    http.Error(w, \"Bad Request\"\
  , 400)\n    return\n}\n```\n\n![image](img/5o.jpg)\n\n现在，在表单处理器中，插入语句通过删除空格和更改大小写来格式化提交的值\n\
  \n```go\nlang := r.FormValue(\"Language\")\nlang = strings.ToLower(strings.Trim(lang,\
  \ \" \"))\n```\n\n![image](img/6o.jpg)\n\n然后，在表单处理器中，插入语句将格式化后的值写入日志文件\n\n```go\n\
  file, err := os.OpenFile(\"htdocs/data.log\", os.O_CREATE|os.O_APPEND|os.O_WRONLY,\
  \ 0644)\nif err != nil {\n    log.Print(err)\n}\ndefer file.Close()\nlog.SetOutput(file)\n\
  log.Print(lang)\n```\n\n![image](img/7o.jpg)\n\n保存更新后的程序文件，然后启动 Web 服务器并访问 localhost:8000/form.html\
  \ 查看表单出现\n\n![image](img/8o.jpg)\n\n在输入字段中输入编程语言名称，然后点击 Submit 按钮提交表单数据\n\n![image](img/hot.jpg)\n\
  \n最常用的请求方法是 `GET` 和 `POST`。`GET` 方法将数据附加到 URL 字符串。`POST` 方法在请求体中携带数据，因此更安全，并且是从浏览器向服务器传输数据时的首选方法。\n\
  \n![image](img/pg183_1.jpg)\n\n现在，点击浏览器的 `Back` 按钮并重复提交过程以发送多个请求——每个请求对应不同的语言\n\n\
