  \n## 理解优先级\n\n运算符优先级定义了 Go 编译器评估表达式的顺序。在表达式 `6 + 7 * 3` 中，优先级决定了是先完成加法还是先完成乘法。\n\
  \n![image](img/pg44_1.jpg)\n\n下表按递减顺序列出了运算符优先级，高行的运算符优先级高于低行的运算符，因此它们的操作会先完成。同一行的二元运算符具有相同的优先级，但完成顺序由它们从左到右的顺序决定，因此左侧的操作会先完成。\n\
  \n| 优先级级别 | 运算符 |\n| --- | --- |\n| 5 | `* / % << >> &` |\n| 4 | `+ - \\| ^` |\n\
  | 3 | `== != < <= >=` |\n| 2 | `&&` |\n| 1 | `||` |\n\n`++` 增运算符运算符和 `--  减运算符在\
  \ Go 编程中构成语句，而不是出现在表达式中，因此未包含在上面的优先级表中。\n\n你可以通过将表达式部分放在括号内来强制编译器忽略默认优先级级别，强制编译器先评估表达式的最内部分。例如，在表达式\
  \ `6 + 7 * 3` 中，`*` 乘法运算符的默认优先级高于 `+` 加法运算符，因此先执行乘法操作 `7 * 3 = 21`，然后执行加法 `21 +\
  \ 6 = 27`。你可能希望先执行加法操作，因此可以通过给表达式添加括号 `(6 + 7) * 3` 来强制编译器这样做。现在，表达式的评估结果为 `6 +\
  \ 7 = 13`，然后是 `13 * 3 = 39`。\n\n![image](img/1g.jpg)在你的“src”文件夹内创建一个名为“force”的目录\n\
  \n![image](img/commong.jpg)src/force/main.go\n\n以 package 和 import 声明开始 `main.go`\
  \ 程序\n\n```go\npackage main\nimport “fmt”\n```\n\n![image](img/3g.jpg)添加一个 main\
  \ 函数，通过评估表达式来声明并初始化变量并显示其值\n\n```go\nfunc main() {\n    sum := 2 * 3 + 4\n    fmt.Printf(\
  \ “Default Order: %v \\n”, sum )\n    // 在处插入语句。\n}\n```\n\n![image](img/4g.jpg)在\
  \ main 函数中，插入语句显示修改后的表达式评估值\n\n```go\nsum = 2 * (3 + 4) - 5\nfmt.Printf( “Forced\
  \ Order: %v \\n”, sum )\n```\n\n![image](img/5g.jpg)接下来，插入语句显示另一个表达式评估值\n\n```go\n\
  sum = 7 % 3 * 2\nfmt.Printf( “Default Order: %v \\n”, sum )\n```\n\n![image](img/6g.jpg)现在，插入语句显示另一个表达式评估值\n\
  \n```go\nsum = 7 % (3 * 2)\nfmt.Printf( “Forced Order: %v \\n”, sum )\n```\n\n![image](img/7g.jpg)将程序文件保存到“force”目录中，然后运行程序以查看不同的结果\n\
  \n![image](img/pg45_1.jpg)\n\n![image](img/hot.jpg)在表达式中使用括号以避免意想不到的结果。\n\n## 总结\n\
  \n- 算术运算符可以形成包含两个操作数的表达式，用于加法 `+`、减法 `-`、乘法 `*`、除法 `/` 和取模 `%`。\n- 增 `++` 运算符和 减\
  \ `--` 运算符按值 1 修改单个操作数。\n- 赋值运算符 `=` 可以结合算术运算符形成表达式。\n- 比较运算符可以用于比较两个操作数的相等 `==`、不相等\
  \ `!=`、小于 `<`、小于等于 `<=`、大于等于 `>=`。\n- 逻辑与 `&&` 和逻辑或 `||` 运算符用于评估两个布尔值的真或假。\n- 逻辑非\
  \ `!` 运算符返回布尔值的取反。\n- 位按或 `|`、位按与 `&`、位按取反 `~` 和位按异或 `^` 用于操作位域。\n- 左移 `<<` 和右移\
  \ `>>` 运算符移动位值。\n\n## 控制流\n\n本章介绍了语句如何评估表达式来确定 Go 程序的执行方向。\n\n- 测试条件\n- Switch Case\n\
  - 循环多次\n- 真循环\n- 跳出循环\n- 跳转标签\n- 总结\n\n## 测试条件\n\n![image](img/pg48_1.jpg)\n\n`if`\
  \ 关键字用于执行基本的条件测试，评估给定表达式的布尔真假值。位于 `{ }` 大括号内的语句仅在表达式评估为真时执行。`if` 测试语句的语法如下：\n\n\
  ```go\nif test-expression {\n    statements-to-execute-when-the-condition-is-true\n\
  }\n```\n\n当测试为真时，可以有多个语句，但每个语句必须独占一行。有时可能需要评估多个表达式以确定是否执行后续语句。这可以通过逻辑 `&&` 与运算符来实现，语法如下：\n\
  \n```go\nif test-expression && test-expression {\n    statements-to-execute-when-all-conditions-are-true\n\
  }\n```\n\n或者，可以将多个 `if` 语句“嵌套”，在另一个内部来评估多个表达式：\n\n```go\nif test-expression {\n\
  \    if test-expression {\n        statements-to-execute-when-all-conditions-are-true\n\
  \    }\n}\n```\n\n当 `if` 测试语句评估的一个或多个表达式为假时，其后续的大括号内的语句不会执行，程序继续执行后续代码。通常通过向 `if`\
  \ 语句附加 `else` 语句来扩展它，指定在 `if` 语句评估的表达式为假时执行的语句，语法如下：\n\n```go\nif test-expression\
  \ {\n    statements-to-execute-when-the-condition-is-true\n} else {\n    statements-to-execute-when-the-condition-is-false\n\
  }\n```\n\n\n\n\n\n这是一种基础的编程技术，它根据评估结果为程序提供两个执行方向，被称为“条件分支”。\n\n![image](img/snake.jpg)\n\
  \n测试表达式和起始大括号 `{` 必须与 `if` 关键字出现在同一行。\n\n![image](img/snake.jpg)\n\n`else` 关键字和起始大括号\
  \ `{` 必须与上一个语句块的结束大括号 `}` 出现在同一行。\n\n![image](img/1p.jpg)用一个测试两个字符是否匹配的语句开始一个 main\
  \ 函数\n\n```go\nfunc main( ) {\n    if 'A' == 'A' {\n        fmt.Println( \"\\nCharacters\
  \ Match\" )\n    }\n    // 在此处插入语句。\n}\n```\n\n![image](img/commonp.jpg)\n\nsrc\\\
  ifelse\\main.go\n\n![image](img/2p.jpg)接下来，在 main 函数中插入嵌套语句来测试两个数值表达式\n\n```go\n\
  if 5 > 1 {\n    if 7 > 2 {\n        fmt.Println( \"\\nBoth expressions are true\"\
  \ )\n    }\n}\n```\n\n![image](img/3p.jpg)现在，插入语句来测试数值表达式，并测试两个字符是否不匹配\n\n```go\n\
  if 5 < 1 {\n    fmt.Println( \"\\n1st Condition is true\" )\n} else if 'A' != 'A'\
  \ {\n    fmt.Println( \"\\n2nd Condition is true\" )\n} else {\n    fmt.Println(\
  \ \"\\nBoth Conditions are false\" )\n}\n```\n\n![image](img/4p.jpg)将程序文件保存到“ifelse”目录中，然后运行程序以查看条件测试的结果\n\
  \n![image](img/pg49_1.jpg)\n\n![image](img/forget.jpg)\n\n为了避免重复，从现在开始步骤列出的代码假设你已经在每个程序的开头声明了\
  \ `package main` 并导入了 `import \"fmt\"`。\n\n![image](img/hot.jpg)\n\n注意，如果第一个测试为\
  \ `false`，你可以使用 `else if` 来评估第二个表达式。\n\n## Switch Case (Switch Cases)\n\n当测试表达式仅评估单个条件时，通过多个\
  \ if else 语句执行的条件分支通常可以通过 `switch` 语句更高效地完成。\n\n![image](img/pg50_1.jpg)\n\n`switch`\
  \ 语句的工作方式比较特殊。它接受一个给定的值作为参数参数，然后尝试从多个 `case` 语句中匹配该值。找到匹配时要执行的代码包含在每个 `case` 语句中。\n\
  \n重要的是，每个要执行的语句必须单独一行，从 `case` 语句下方的行开始。\n\n可选情况下，`case` 语句列表后面可以跟一个最终的 `default`\
  \ 语句，以指定在任何 `case` 语句中都未找到匹配项时执行的代码。因此，`switch` 语句的语法通常如下：\n\n```go\nswitch test-value\
  \ {\ncase match-value :\n    statements-to-execute-when-matched\ncase match-value\
  \ :\n    statements-to-execute-when-matched\ncase match-value :\n    statements-to-execute-when-matched\n\
  default :\n    statements-to-execute-when-no-match-found\n}\n```\n\n如果多个 `match-values`\
  \ 需要执行相同的语句，则只需要最后一个 `case` 语句包含要执行的语句。例如，为了对匹配值为 0, 1 和 2 输出输出相同的消息：\n\n```go\n\
  switch num {\ncase 0 :\ncase 1 :\ncase 2 :\n    fmt.Println( \"Less than 3\" )\n\
  case 3 :\n    fmt.Println( \"Exactly 3\" )\ndefault :\n    fmt.Println( \"Greater\
  \ Than 3 or Less Than 0\" )\n}\n```\n\n![image](img/forget.jpg)\n\n`default` 语句不需要出现在\
  \ `switch` 块的末尾，但将其放在那里是符合逻辑的。\n\n![image](img/hot.jpg)\n\n当找到匹配项时，`switch` 通常会结束，但你可以在任何\
  \ `case` 块中添加 `fallthrough` 关键字作为最终语句，以继续到下一个 `case` 语句——尽管这很少用。\n\n![image](img/1p.jpg)用一个声明并初始化两个变量的语句开始一个\
  \ main 函数\n\n```go\nfunc main( ) {\n    num := 2\n    char := 'B'\n    // 在此处插入语句。\n\
  }\n```\n\n![image](img/commonp.jpg)\n\nsrc\\switch\\main.go\n\n![image](img/2p.jpg)接下来，在\
  \ main 函数中插入一个尝试匹配数值值的语句\n\n```go\nswitch num {\ncase 1 :\n    fmt.Println( \"\\\
  nNumber is One\" )\ncase 2 :\n    fmt.Println( \"\\nNumber is Two\" )\ncase 3 :\n\
  \    fmt.Println( \"\\nNumber is Three\" )\ndefault :\n    fmt.Println( \"\\nNumber\
  \ is Unrecognized\" )\n}\n```\n\n![image](img/3p.jpg)现在，插入一个尝试匹配字符的语句\n\n```go\n\
  switch char {\ncase 'A' :\n    fmt.Println( \"\\nLetter is A\" )\ncase 'B' :\n \
  \   fmt.Println( \"\\nLetter is B\" )\ndefault :\n    fmt.Println( \"\\nLetter is\
  \ Unrecognized\" )\n}\n```\n\n![image](img/4p.jpg)将程序文件保存到“switch”目录中，然后运行程序以查看条件测试的结果\n\
  \n![image](img/pg49_1.jpg)\n\n## For 循环 (For Loops)\n\n循环是会自动重复的代码。当测试表达式为真时，循环将继续。当测试表达式为假时，循环结束。\n\
  \n![image](img/snake.jpg)\n\n![image](img/1p.jpg)\n\n![image](img/forget.jpg)\n\n\
  ![image](img/hot.jpg)\n\n![image](img/1p.jpg)\n\n在 Go 编程中，有多种构建循环的方法，它们都使用 `for`\
  \ 关键字。最常见的循环类型包含三个部分：初始化器、测试表达式和计数器：\n\n```go\nfor initializer ; test-expression\
  \ ; incrementer {\n    statements-to-execute\n}\n```\n\n初始化器用于设置计数器的初始值。为此目的使用整数变量\
  \ `i`。\n\n在循环的每次迭代中，都会评估测试表达式，只有当该表达式为真时，迭代才会继续。当测试表达式为假时，循环立即结束。\n\n循环可以嵌套，在外部循环的每次迭代中完成内部循环的所有迭代。第二个整数变量用于计数内部循环，通常命名为\
  \ `j`。如果该内部循环也包含一个嵌套循环，其计数器通常命名为 `k`，语法如下：\n\n```go\nfor ... {\n    // statements\n\
  \    for ... {\n        // statements\n        for ... {\n            // statements\n\
  \        }\n    }\n}\n```\n\n嵌套超过三层的循环是不常见的，可能最好避免。\n\n![image](img/1p.jpg)用一个执行五次迭代的循环开始一个\
  \ main 函数\n\n```go\nfunc main( ) {\n    for counter := 1 ; counter <= 5 ; counter++\
  \ {\n        fmt.Println( \"Loop Iteration\", counter )\n    }\n    // 在此处插入语句。\n\
  }\n```\n\n![image](img/commonp.jpg)\n\nsrc\\forloop\\main.go\n\n![image](img/2p.jpg)接下来，插入一个执行三次迭代的循环\n\
  \n```go\nfor i := 1 ; i <= 3 ; i++ {\n    fmt.Println( \"\\nOuter Loop Iteration\"\
  , i )\n    // 在此处插入内部循环。\n}\n```\n\n![image](img/3p.jpg)现在，插入一个执行三次迭代的内部循环\n\n```go\n\
  for j := 1 ; j <= 3 ; j++ {\n    fmt.Println( \"\\tInner Loop Iteration\", j )\n\
  }\n```\n\n\n\n\n\n![image](img/pg53_1.jpg)\n\n![image](img/hot.jpg)\n\n`for` 循环计数器也可以进行递减——通过在每次迭代中使用\
  \ `i--` 代替 `i++` 来减少计数器值。\n\n## While True 循环\n\n![image](img/pg54_1.jpg)\n\n前一个示例中描述的第\
  \ 53 页 for 循环的替代方案在 `for` 关键字之后仅包含一个测试表达式——它在循环语句开头不包含初始化器或递增器。相反，它使用一个已经初始化的计数器变量，并在循环体内增加计数器。这是\
  \ Go 语言与其他编程语言中“while”循环的等物，因为只要测试表达式为真，循环就会继续迭代。递增器必须在某处使测试表达式为假以结束循环，否则将创建一个永远不会结束的死循环。这种类型\
  \ for 循环的语法如下：\n\n```\ninitializer\nfor test-expression {\n    statements-to-be-executed\n\
  \    incrementer\n}\n```\n\nGo 编程中循环结构的另一种变体允许你甚至从起始语句中省略测试表达式，并使用包含在循环体内测试表达式的无限循环。它同样使用一个已经初始化的计数器变量，并在循环体内增加计数器。这是\
  \ Go 语言与其他编程语言中“do-while”循环的等物，因为循环会在测试表达式为真时执行语句并继续迭代。当测试表达式变为假，可以使用 `break` 关键字终止循环，因此这种类型\
  \ for 循环的语法如下：\n\n```\ninitializer\nfor {\n    statements-to-be-executed\n    incrementer\n\
  \    if test-expression {\n        statements-to-be-executed\n        break\n  \
  \  }\n}\n```\n\n注意，如果测试表达式在第一次求值时为假，则“while”循环不会进行任何迭代，而“do-while”循环将至少执行一次迭代，因为它的语句在求值之前就会执行。\n\
  \n![image](img/hot.jpg)\n\n如果程序运行了死循环，在 Windows 或 Linux 系统上按下 `Ctrl` + `C` 键盘键可以停止循环执行。\n\
  \n![image](img/1p.jpg)开始一个带有五次迭代的 main 函数\n\n```go\nfunc main( ) {\n    counter\
  \ := 1\n    for counter <= 5 {\n        fmt.Println( “Loop Iteration”, counter )\n\
  \        counter++\n    }\n    // 在此处插入语句。\n}\n```\n\n![image](img/commonp.jpg)\n\
  \nsrc\\while\\main.go\n\n![image](img/2p.jpg)接下来，插入一个无限循环语句\n\n```go\ni := 10\n\
  for {\n    fmt.Println( \"\\t\\t\\tCountdown\", i )\n    i--\n    // 在此处插入测试表达式。\n\
  }\n```\n\n![image](img/3p.jpg)现在，插入一个测试表达式来结束循环\n\n```go\nif i < 1 {\n    fmt.Println(\
  \ \"\\t\\t\\t\\t\\tLift Off!” )\n    break\n}\n```\n\n![image](img/4p.jpg)将程序文件保存到“while”目录中，然后运行程序查看每次循环迭代的输出\n\
  \n![image](img/pg55_1.jpg)\n\n![image](img/pg55_2.jpg)\n\n![image](img/forget.jpg)\n\
  \n将变量 `i` 的初始值改为 `0`（零）并再次运行程序，查看循环的第一次迭代执行。\n\n## 跳出循环\n\n当满足指定条件时，可以使用 `break`\
  \ 关键字提前终止任何循环。`break` 语句在指定条件满足时终止循环，位于语句块内部，之前是测试表达式。当测试表达式为真时，循环会立即停止并跳转到下迭代。。\n\
  \n\n\n。\n\n/pg/pg51..)\n\n`continue` 关键字可以在满足指定条件时跳过单次迭代。`continue` 语句位于语句块内部，之前是测试表达式。当测试表达式为真时，该迭代结束。\n\
  \n![image](img/1p.jpg)开始一个执行三次迭代的循环的 main 函数\n\n![image](img/commonp.jpg)\n\nsrc\\\
  break\\main.go\n\n![image](img/2p.jpg)插入一个执行三次迭代的无限循环\n\n```go\n// 在此处插入语句。\nfor\
  \ i := 1 ; j <= 3 ; j++ {\n    fmt.Println( “Running== i, “== j )\n}\n```\n\n![image](img/3p.jpg)将程序文件保存到“break”目录中，然后运行程序查看每次循环迭代的输出\n\
  \n![image](img/pg56_1.jpg)\n\n![image](img/hot.jpg)\n\n你也可以跳转到 66 页特定位置来 `break`\
  \ 嵌套代码块——参见此处的示例。跳出内循环。\n\n。\n\n![image](img/pg56_2.jpg)\n\n![image](img/forget.jpg)\n\
  \n在这里，`break` 语句在外层循环尝试第二次运行时停止内层循环的第二次和第三次迭代。\n\n![image](img/4p.jpg)\n\n你也可以跳转到外层循环块结束之后的特定标签，以跳出内循环。\n\
  \n![image](img/4p.jpg)接下来，插入此 break 语句跳出内循环\n\n```go\nif i == 2 && j == 2 {\n  \
  \  fmt.Println( “Breaks i=”, i, “j=”, j )\n    break\n}\n```\n\n![image](img/5p.jpg)现在，在\
  \ break 语句之前插入此 continue 语句跳过内层循环\n\n```go\nif i == 3 && j == 2 {\n    fmt.Println(\
  \ “Continues i=”, i, “j=”, j )\n    continue\n}\n```\n\n![image](img/6p.jpg)保存更新后的文件，然后运行程序一次查看内层循环的第二次迭代\n\
  \n![image](img/pg57_1.jpg)\n\n![image](img/forget.jpg)\n\n## 跳转到标签\n\n`goto` 关键字乍看起来似乎是一个很棒的功能，因为它允许程序流跳转到程序代码中的任何位置，就像网页上的超链接一样。然而，实际上这可能会导致错误，这种用法是不受欢迎的，通常被认为是坏习惯。\n\
  \n![image](img/pg58_1.jpg)\n\n`goto` 关键字跳转是计算机程序中存在数十年的强大功能，但它被许多早期程序员滥用，创建了跳转方式不可理喻的程序。这产生了不可读的代码，因此\
  \ goto 的使用不再流行。\n\n通常，程序可能会执行一组语句，然后 `goto` 语句跳转回语句开头的标签以重复执行。此外，可能会在序列中的某处测试条件，如果测试条件未满足，则另一个\
  \ `goto` 语句可能会跳转到序列之后的某一点以继续程序流。通过这种方式，程序代码很快获得了大量混乱的 goto 语句和标签。\n\n`goto` 关键字的一个可能的合法用法是通过跳转到外层循环块结束之后的某个标签，从而干净地退出内层嵌套循环。这会立即退出两个循环，因此不再执行任何循环的后续迭代。\n\
  \n```go\nfunc main( ) {\n    for i := 1 ; i <= 3 ; i++ {\n        for j := 1 ; j\
  \ <= 3 ; j++ {\n            fmt.Println( “Running i=”, i, “j=”, j )\n          \
  \  if i == 2 && j == 2 {\n                goto end\n            }\n        }\n \
  \   }\n    end:\n    fmt.Println(\"Finished\")\n}\n```\n\n\n\n\n\n![image](img/4p.jpg)在内层循环的第一行插入一个语句，以便在指定的计数器值处跳转到名为“end”的标签。\n\
  \n```go\nif i == 2 && j == 2 {\n    goto end\n}\n```\n\n![image](img/5p.jpg)现在，在外层循环闭合的大括号\
  \ `}` 之后的下一行添加标签。\n\n```go\nend:\n```\n\n![image](img/6p.jpg)保存更新后的文件，然后再次运行程序，以在测试条件变为真时看到循环结束。\n\
  \n![image](img/pg59_1.jpg)\n\n![image](img/snake.jpg)\n\n避免创建一个一个名为 `goto.exe` 的程序可执行文件，因为这可能与\
  \ Windows 系统内部的 `GOTO` 命令冲突。\n\n![image](img/forget.jpg)\n\n注意，标签本身必须以 `:` 冒号结尾。\n\
  \n## 总结\n\n- `if` 关键字执行基础条件测试，以评估给定表达式的布尔值为真（true）或假（false）。\n- `else` 关键字可用于当 `if`\
  \ 语句发现表达式为假时提供备选的可执行语句。\n- 在评估后为程序提供可选的执行方向被称为“条件分支”。\n- 由多个 `if else` 语句执行的条件分支通常可以通过\
  \ `switch` 语句更高效地完成。\n- `switch` 块中的语句必须每个都出现在 `case` 语句下方的单独行中。\n- 可选地，`switch`\
  \ 块可以包含一个 `default` 语句，用于指定在未找到匹配项时执行的语句。\n- `for` 关键字可以指定初始化器、测试表达式和递增器，以控制循环。\n\
  - `for` 关键字可以简单地指定一个测试表达式，以确定循环在真时是否继续。\n- `for` 关键字可以完全省略测试表达式以创建一个无限循环。\n- 在无限循环的体内部可以测试条件，并使用\
  \ `break` 关键字结束循环。\n- `break` 关键字用于终止循环，而 `continue` 关键字可用于跳过单次迭代。\n- 循环可以嵌套，使得内层循环在在外层循环的每次迭代中执行一系列迭代。\n\
  - 通常不建议使用 `goto` 关键字，但它可以合法地用于退出嵌套循环。\n\n# 5 创建函数\n\n*本章演示了如何将语句封装在函数内部，以便在 Go 程序调用该函数时执行执行。*\n\
  \n- 创建基础函数\n- 添加参数\n- 传递引用\n- 返回值\n- 递归调用\n- 匿名封装\n- 传递函数\n- 处理错误\n- 分离文件\n- 总结\n\
  \n## 创建基础函数\n\n书中的之前的示例使用了强制性的 `main()` 函数以及包含在 Go 标准库中的函数，例如“fmt”包中的 `fmt.Println()`\
  \ 函数。然而，大多数 Go 程序都包含许多自定义函数，这些函数可以在程序执行期间根据需要调用。\n\n![image](img/pg62_1.jpg)\n\n\
