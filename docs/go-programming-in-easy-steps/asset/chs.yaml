  \ 反余弦值 |\n| `math.Asin()` | 反正弦值 |\n| `math.Atan()` | 反正切值 |\n| `math.Atan2()` |\
  \ 离 X 轴某个点的角度 |\n| `math.Ceil()` | 向上取整的值 |\n| `math.Cos()` | 余弦值 |\n| `math.Exp()`\
  \ | `e` 的幂 |\n| `math.Floor()` | 向下取整的值 |\n| `math.IsNaN()` | 是否为非数字（NaN） |\n| `math.Log()`\
  \ | 自然对数 |\n| `math.Max()` | 两个数中的较大 |\n| `math.Min()` | 两个数中的较小 |\n| `math.Pow()`\
  \ | 幂 |\n| `math.Round()` | 接近的整数 |\n| `math.Sin()` | 正弦值 |\n| `math.Sqrt()` | 平方根\
  \ |\n| `math.Tan()` | 正切值 |\n\n`math` 包还包含了更多用于处理小数的函数。首先在程序中导入 Go 标准库 math 包\n\n\
  ```go\nimport (\n    \"fmt\"\n    \"math\"\n)\n```\n\n`src\\area\\main.go`\n\n声明三个浮点变量\n\
  \n```go\nvar rad, area, perim float64\n```\n\n接下来，初始化第一个变量并保留两位小数显示其值\n\n```go\n\
  rad = 4\nfmt.Printf(\"\\nRadius of Circle: %.2f \\n\", rad)\n```\n\n现在，根据给定的半径计算圆的面积，然后保留两位小数显示面积\n\
  \n```go\narea = math.Pi * (rad * rad)\nfmt.Printf(\"\\nArea of Circle: %.2f \\n\"\
  , area)\n```\n\n然后，根据给定的半径计算圆的周长，并保留两位小数显示周长\n\n```go\nperim = 2 * (math.Pi * rad)\n\
  fmt.Printf(\"\\nPerimeter of Circle: %.2f \\n\", perim)\n```\n\n将程序文件保存到“area”目录中，然后运行程序查看计算结果\n\
  \n## 处理小数\n\n![image](img/pg137_1.jpg)\n\nGo `math` 包提供了这些将浮点数转换为整数的有用函数：\n\n| 函数\
  \ | 返回 |\n| :--- | :--- |\n| `math.Floor(x)` | 小于 `x` 的最大整数 |\n| `math.Ceil(x)`\
  \ | 大于 `x` 的最小整数 |\n| `math.Round(x)` | 接近 `x` 的整数 |\n| `math.Trunc(x)` | `x` 的整数部分\
  \ |\n\n如果你想将浮点数保留两位小数，首先将浮点数乘以 100，然后使用 `math.Round()` 剩余的小数，最后除以 100。这些乘、舍入、除的操作可以分步完成，也可以在单个表达式中完成。例如，名为\
  \ `num` 的浮点数可以写为：\n\n```go\nnum = num * 100\nnum = math.Round(num)\nnum = num /\
  \ 100\n```\n\n或者改为：\n\n```go\nnum = math.Round(num * 100) / 100\n```\n\nGo 语言具有强类型系统，与其他语言不同，它不支持隐式类型转换（即“强制转换”）。可以使用\
  \ `dataType(value)` 语法在兼容类型之间执行显式类型转换，例如 `float64` 和 `int`。将浮点数转换为整数时，值会被截断。\n\n\
  `math.Round()` 函数会从中间点舍入，所以 `math.Round(7.5)` 返回 `8` 而不是 `7`。\n\n首先在程序中导入 Go 标准库\
  \ math 包\n\n```go\nimport (\n    \"fmt\"\n    \"math\"\n)\n```\n\n`src\\round\\\
  main.go`\n\n初始化一个浮点变量并显示其值\n\n```go\nvar pi float64 = math.Pi\nfmt.Println(\"Pi:\"\
  , pi)\n```\n\n接下来，显示浮点数附近的整数\n\n```go\nfmt.Println(\"\\nFloor:\", math.Floor(pi))\n\
  fmt.Println(\"\\nCeiling:\", math.Ceil(pi))\nfmt.Println(\"\\nRound:\", math.Round(pi))\n\
  fmt.Println(\"\\nTruncated:\", math.Trunc(pi))\n```\n\n现在，将浮点数减少为两位小数\n\n```go\n\
  fmt.Println(\"\\nShort Pi:\", math.Round(pi * 100) / 100)\n```\n\n\n\n\n\n![image](img/6r.jpg)将程序文件保存到“round”目录中，然后运行程序查看四舍五入后的小数\n\
  \n![image](img/pg139_1.jpg)\n\n# 生成随机数\n\nGo 标准库中的 `math` 包包含一个 `rand` 包，该包提供了生成伪随机数的函数。你可以通过导入\
  \ `math/rand` 来在你的程序中使用这些功能。\n\n![image](img/pg140_1.jpg)\n\n`rand.Intn()` 函数返回一个从\
  \ 0 到参数指定数字的随机数。`rand.Perm()` 函数返回一个整数序列，从 0 到参数指定的数字，并以伪随机的顺序排列。\n\n随机化模式基于一个默认的“种子”（seed），该种子在每次程序运行时都会返回相同的伪随机顺序。这可能正是你想要的，但通常情况下，在每次程序运行时生成不同的顺序会更理想。为了实现这一点，你必须将一个自定义种子作为整数参数传递给\
  \ `rand.Seed()` 函数，该种子在每次程序运行时都应该是唯一的。方便的方法是调用 `time.Now()` 函数获取当前系统时间，并使用 `Time`\
  \ 数据类型的 `UnixNano()` 方法提取自 Unix 纪元以来经过的纳秒整数计数。这个值在每次程序运行时都是不同的，因此将此整数作为 `rand.Seed()`\
  \ 函数的参数，可以确保每次程序运行时生成不同的伪随机顺序。\n\n![image](img/1r.jpg)在程序中导入 Go 标准库 `math/rand`\
  \ 包，同时导入 `time` 包以设置随机种子，以及 `strconv` 包以转换随机数\n\n```go\nimport ( “fmt”\n“math/rand”\n\
  “strconv”\n“time”\n)\n```\n\n![image](img/commonr.jpg)\n\nsrc\\\\lotto\\\\main.go\n\
  \n![image](img/2r.jpg)接下来，为随机生成器指定唯一的种子\n\n```go\nrand.Seed( time.Now().UnixNano()\
  \ )\n```\n\n![image](img/3r.jpg)现在，生成一个从 0 到 58 的整数切片\n\n```go\nnums := rand.Perm(\
  \ 59 )\n```\n\n![image](img/4r.jpg)然后将范围扩大到 1-59（包含 59）\n\n```go\nfor i := 0 ; i\
  \ < len( nums ) ; i++ {\n    nums[i]++\n}\n```\n\n![image](img/hot.jpg)\n\n在计算中，Epoch（纪元）是指\
  \ 1970 年 1 月 1 日午夜的时间。\n\n![image](img/5r.jpg)在格式化字符串中，在连字符周围按伪随机顺序分配前六个数字\n\n```go\n\
  str := “\\\\nYour Six Lucky Numbers: “\nfor i := 0 ; i < 6 ; i++ {\n    str += strconv.Itoa(\
  \ nums[i] )\n    if i != 5 {\n        str += “ - “\n    }\n}\n```\n\n![image](img/6r.jpg)最后，显示格式化字符串\n\
  \n```go\nfmt.Println( str )\n```\n\n![image](img/7r.jpg)将程序文件保存到“lotto”目录中，然后反复运行程序查看不同的随机数\n\
  \n![image](img/pg141_1.jpg)\n\n![image](img/pg141_2.jpg)\n\n这里的随机数范围是 1 到 59 ——\
  \ 用于玩英国乐彩游戏或美国纽约乐彩游戏。\n\n![image](img/pg141_3.jpg)\n\n![image](img/forget.jpg)\n\
  \n`int` 类型数字必须转换为 `string` 数据类型才能进行拼接。\n\n## 总结\n\n- 字符串是字符的集合，类似于数组中的元素。\n- 内置函数\
  \ `len()` 返回作为参数的指定字符串中的字符数量。\n- `strings` 包包含用于字符串操作的函数，例如 `Join()` 拼接函数。\n- `Fields()`\
  \ 和 `Split()` 函数分别返回从指定字符串参数提取的子串数组。\n- `Contains()` 和 `Index()` 函数可以用于在字符串参数中查找指定的子串。\n\
  - `Count()` 函数报告子串在指定字符串参数中出现的次数。\n- `HasPrefix()` 和 `HasSuffix()` 函数可以识别字符串参数的开头和结尾。\n\
  - `Replace()` 函数可以替换子串。\n- 使用 `ToUpper()`、`ToLower()` 和 `ToTitle()` 函数可以更改字符的大小。\n\
  - `Trim()` 函数可以移除头部和尾的空格。\n- `strconv` 包包含 `Atoi()` 和 `Itoa()` 函数，它们可以在字符串和 int\
  \ 数据类型之间转换。\n- `math` 包包含数学函数（如 `math.Pow()`）和数学常量（如 `math.Pi`）。\n- 使用 `math.Floor()`\
  \ 可以将小数舍入为最近的整数。\n- `math/rand` 包提供了生成伪随机数的函数。\n- `rand.Perm()` 函数返回从 0 到指定数字的整数序列。\n\
  - `rand.Seed()` 函数可以指定自定义种子。\n- 通过 `time.Now().UnixNano()` 每次程序运行时指定唯一的种子。\n\n#\
  \ 处理输入\n\n*本章演示了如何处理用户输入以及如何读写文本。*\n\nGo 标准库 `fmt` 包提供了 `Scan()`、`Scanln()` 和 `Scanf()`\
  \ 函数来读取标准输入。这些函数都返回两个值：读取的项目数和任何错误。如果没有遇到错误，错误值将为 `nil`。每个函数都需要参数来指定变量的地址。\n\n-\
  \ `Scan()` 将空格分隔的值存储到变量中。\n- `Scanln()` 直到换行符前存储空格分隔的值。\n- `Scanf()` 使用指定的格式存储空格分隔的值。\n\
  \n猜数字游戏可以使用 `Scan()` 将输入赋值给变量，并将其与随机整数进行比较。\n\n![image](img/1g.jpg)在程序中导入 Go 标准库\
  \ `math/rand` 和 `time` 包，以提供自定义种子的随机生成器。\n\n```go\nimport (\n“fmt”\n“math/rand”\n\
  “time”\n)\n```\n\n![image](img/commong.jpg)\n\nsrc\\\\scan\\\\main.go\n\n现在，通过使用当前时间种子随机生成器来开始\
  \ main 函数。\n\n```go\nrand.Seed( time.Now().UnixNano() )\n```\n\n![image](img/2g.jpg)接下来，声明并初始化三个变量\n\
  \n```go\nvar num int = rand.Intn( 20 ) + 1\nvar guess int = 0\nvar flag bool = true\n\
  ```\n\n![image](img/3g.jpg)然后，请求用户输入整数\n\n```go\nfmt.Print( “\\\\nGuess My Number\
  \ 1-20: ” )\n```\n\n![image](img/4g.jpg)最后，添加一个循环反复比较输入与随机数，直到它们匹配\n\n```go\nfor\
  \ flag {\n    _, err := fmt.Scan( &guess )\n    if err != nil {\n        fmt.Println(\
  \ err )\n    } else if guess > num {\n        fmt.Print( “Too High, Try Again: “\
  \ )\n    } else if guess < num {\n        fmt.Print( “Too Low, Try Again: “ )\n\
  \    } else if guess == num {\n        fmt.Println( “Correct - My Number Is”, num\
  \ )\n        flag = false\n    }\n}\n```\n\n\n\n\n\n注意：`_` 空标识符用于忽略扫描到的返回项数量，并记住在将输入值赋值给接口变量时使用\
  \ `&` 地址运算符。\n\n![image](img/6g.jpg)将程序文件保存在“scan”目录中，然后运行程序来猜测随机生成的数字。\n\n![image](img/pg145_1.jpg)\n\
  \n## 缓冲区输入 (Buffer Input)\n\n当你想要在程序中收集较大的数据项时，将数据流存储在内存缓冲区中通常是更优的。Go 标准库中的 `bufio`（带缓冲的输入/输出）程序包提供了一个\
  \ `Scanner` 类型，它是一个带有多个处理数据流的有用方法的内存缓冲区。你可以通过导入 `bufio` 包来在程序中使用它。\n\n![image](img/pg146_1.jpg)\n\
  \n首先，通过向 `bufio` 包的 `NewScanner( ` 函数传递一个用于读取数据的源作为参数，创建一个 `Scanner` 实例。当源是用户输入时，你可以导入\
  \ Go 标准库 `os` 包，并将 `os.Stdin`（标准输入）作为 `NewScanner( )` 的参数。\n\n`Scanner` 实例有一个 `Scan(\
  \ )` 方法，用于读取所有用户输入，以及一个 `Text( )` 方法，它将读取到的输入作为单个字符串值返回。\n\n`Scanner` 实例还有一个 `Err(\
  \ )` 方法，它将返回任何读取错误。如果没有遇到错误，错误值将像往常一样为 `nil`。在调用 `Scan( )` 方法和 `Text( )` 方法后检查错误是有用的。\n\
  \n如果你想将输入拆分为单个字符串项，可以导入 Go 标准库 `strings` 包，并将输入传递给它的 `Fields( )` 函数，将字符串拆分为单词。\n\
  \n![image](img/1g.jpg)首先在程序中导入 Go 标准库 `bufio`、`os` 和 `strings` 包，以处理输入\n\n```go\n\
  import (\n\t\"fmt\"\n\t\"bufio\"\n\t\"os\"\n\t\"strings\"\n)\n```\n\n![image](img/commong.jpg)\n\
  \nsrc\\buffer\\main.go\n\n![image](img/2g.jpg)接下来，请求用户输入\n\n```go\nfmt.Print( \"\
  \\nEnter Text:\" )\n```\n\n![image](img/3g.jpg)现在，创建一个 `Scanner` 实例将用户输入存储在内存缓冲区中，然后读取用户输入\n\
  \n```go\nscanner := bufio.NewScanner( os.Stdin )\nscanner.Scan( )\n```\n\n![image](img/4g.jpg)然后，如果发生错误则输出错误，否则输出存储的数据\n\
  \n```go\nif scanner.Err( ) != nil {\n\tfmt.Println( scanner.Err( ) )\n} else {\n\
  \tfmt.Println( scanner.Text( ) )\n}\n```\n\n![image](img/5g.jpg)接下来，创建一个新的 `Scanner`\
  \ 实例将其他用户输入存储在内存缓冲区中\n\n```go\nfmt.Print( \"\\nEnter Text:\" )\nscanner = bufio.NewScanner(\
  \ os.Stdin )\nscanner.Scan( )\n```\n\n![image](img/6g.jpg)然后，将用户输入的单个项存储在切片的各个元素中\n\
  \n```go\nwords := strings.Fields( scanner.Text( ) )\n```\n\n![image](img/7g.jpg)最后，如果发生错误则输出错误，或者列出用户输入的单个项\n\
  \n```go\nif scanner.Err( ) != nil {\n\tfmt.Println( scanner.Err( ) )\n} else {\n\
  \tfor i, v := range words {\n\t\tfmt.Printf( \"%v: %v \\n\", i, v )\n\t}\n}\n```\n\
  \n![image](img/8g.jpg)将程序文件保存在“buffer”目录中，然后运行程序\n\n![image](img/pg145.jpg)\n\n\
  ![image](img/hot.jpg) `Scan( )` 方法在遇到错误时返回 `true`，在遇到错误时返回 `false`。\n\n## 标志 (Flags)\n\
  \n运行程序的命令可以接受参数。`os` 程序包提供的 `Args` 切片包含了这些参数。注意 `os.Args` 的第一个元素始终是程序的路径。你可以通过 `flag`\
  \ 包来处理这些标志。\n\n`flag` 包提供了定义和解析命令行标志的工具。你可以使用 `flag.String`、`flag.Int` 和 `flag.Bool`\
  \ 等函数来定义标志。定义完成后，调用 `flag.Parse()` 来解析命令行。\n\n```go\npackage main\n\nimport (\n\t\
  \"flag\"\n\t\"fmt\"\n)\n\nfunc main() {\n\ttxt := flag.String(\"txt\", \"C\", \"\
  这是一个字符串\")\n\tnum := flag.Int(\"num\", 8, \"这是一个整数\")\n\tsta := flag.Bool(\"sta\"\
  , false, \"这是一个布尔值\")\n\n\tflag.Parse()\n\n\tfmt.Printf(\"\\nText: %s\\n\", *txt)\n\
  \tfmt.Printf(\"Number: %d\\n\", *num)\n\tfmt.Printf(\"Status: %t\\n\", *sta)\n}\n\
  ```\n\n运行 `go run main.go -txt=Hello -num=10 -sta` 将输出：\n\n```text\nText: Hello\n\
  Number: 10\nStatus: true\n```\n\n你也可以使用等价的形式，例如 `go run main.go -txt Hello -num\
  \ 10 -sta`。\n\n`flag` 包还允许你定义标志的别名。例如，你可以定义 `txt` 和 `t` 指向同一个变量。\n\n```go\npackage\
  \ main\n\nimport (\n\t\"flag\"\n\t\"fmt\"\n)\n\nfunc main() {\n\tvar txt string\n\
  \tflag.StringVar(&txt, \"txt\", \"C\", \"这是一个字符串\")\n\tflag.StringVar(&txt, \"t\"\
  , \"C\", \"这是一个字符串的别名\")\n\n\tflag.Parse()\n\n\tfmt.Printf(\"\\nText: %s\\n\", txt)\n\
  }\n```\n\n运行 `go run main.go -txt=Hello` 或 `go run main.go -t Hello` 都将输出：\n\n```text\n\
  Text: Hello\n```\n\n`flag` 包还允许你定义自定义类型的标志。通过实现 `flag.Value` 接口，你可以支持任何类型。\n\n```go\n\
  package main\n\nimport (\n\t\"flag\"\n\t\"fmt\"\n\t\"strings\"\n)\n\ntype commaStringList\
  \ []string\n\nfunc (c *commaStringList) String() string {\n\treturn strings.Join(*c,\
  \ \",\")\n}\n\nfunc (c *commaStringList) Set(value string) error {\n\tslice := strings.Split(value,\
  \ \",\")\n\t*c = append(*c, slice...)\n\treturn nil\n}\n\nfunc main() {\n\tvar list\
  \ commaStringList\n\tflag.Var(&list, \"list\", \"一个逗号分隔的字符串列表\")\n\tflag.Parse()\n\
  \n\tfmt.Printf(\"List: %v\\n\", list)\n}\n```\n\n运行 `go run main.go -list=a,b,c\
  \ -list=d` 将输出：\n\n```text\nList: [a b c d]\n```\n\n\n\n\n\n`Read()` 方法需要一个字节切片参数，其长度将决定从指定位置读取的字节数（字符数）。该方法返回读取的字节数以及任何读取过程中产生的错误。\n\
  \n`Close()` 方法不需要参数，但在完成对已打开文件的其他操作后必须调用它。为了不忘记这项要求，你可以在打开文件后立即使用 `defer` 关键字调用\
  \ `Close()` 方法。这将在包含该函数的函数结束时自动关闭文件。\n\n![image](img/1g.jpg)首先在程序中导入 Go 标准库的 `ioutil`\
  \ 和 `os` 包，以读取一个文本文件\n\n```go\nimport (\n\t\"fmt\"\n\t\"io/ioutil\"\n\t\"os\"\n\
  )\n```\n\n![image](img/commong.jpg)\n\nsrc\\read\\main.go\n\n![image](img/2g.jpg)接下来，添加一个函数来检查读取错误\n\
  \n```go\nfunc check( err error ) {\n\tif err != nil {\n\t\tfmt.Println( err )\n\t\
  }\n}\n```\n\n![image](img/3g.jpg)现在，在 main 函数中读取整个文本文件，然后检查错误并显示文本内容\n\n```go\n\
  txt, err := ioutil.ReadFile( “C:/Textfiles/Oscar.txt” )\ncheck( err )\nfmt.Println(\
  \ string( txt ) )\n```\n\n![image](img/4g.jpg)接下来，打开同一个文本文件，然后检查错误，并记得在其他操作完成后关闭文件\n\
  \n```go\nfile, err := os.Open( “C:/Textfiles/Oscar.txt” )\ncheck( err )\ndefer file.Close(\
  \ )\n```\n\n![image](img/5g.jpg)然后，指定起始位置并检查错误\n\n```go\npos, err := file.Seek(\
  \ 42, 0 )\ncheck( err )\n```\n\n![image](img/6g.jpg)现在，读取 15 个字符并检查错误\n\n```go\n\
  slice := make( [ ]byte, 15 )\nnb, err := file.Read( slice )\ncheck( err )\n```\n\
  \n![image](img/7g.jpg)最后，显示起始位置、读取的字符数以及已读取的文本\n\n```go\nfmt.Printf( “\\n%v bytes\
  \ @ %v: “, nb, pos )\nfmt.Printf( “%v\\n”, string( slice[ : nb ] ) )\n```\n\n![image](img/8g.jpg)将程序文件保存在“read”目录中，然后运行程序查看从指定文件中读取的文本\n\
  \n![image](img/pg151_1.jpg)\n\n![image](img/hot.jpg)\n\n文本文件 `Oscar.txt` 包含在本书的示例下载包中（参见此处第\
  \ 6 页），但你需要调整这些步骤中的路径以适应它在你系统中的位置。\n\n![image](img/forget.jpg)\n\n你必须使用 `string()`\
  \ 函数将 `byte` 切片的字符代码数字转换为它们相应的字母字符。\n\n## 写文件\n\nGo 标准库 `io` 包包含一个 `ioutil`（输入/输出实用）包，它提供了写入文本文件的函数。你通过导入\
  \ `io/ioutil` 来让你的程序可以使用这些功能。\n\n![image](img/pg152_1.jpg)\n\n`ioutil` 包的 `WriteFile()`\
  \ 函数接受三个参数，用于指定要写入的文件路径、要写入的文本字符字节切片以及该文件的数值权限。如果写入失败，该函数将返回错误消息；如果文件成功写入，则返回 `nil`\
  \ 值。\n\n为了在写入文本文件时进行更精细的控制，你可以使用 `os` 包的 `OpenFile()` 函数。这需要三个参数来指定要写入的文件路径、一个指定操作类型的标志以及该文件的数值权限。指定操作类型的标志是\
  \ `os` 包的常量。例如：`os.O_RDWR` 用于读写，`os.O_APPEND` 用于追加文本，或者 `os.O_CREATE` 用于在文件不存在时创建一个新文件。\n\
  \n`OpenFile()` 函数返回一个 `os.File` 类型和任何读取错误。该文件类型具有 `Write()` 和 `Close()` 方法，允许你处理文本文件的内容。\n\
  \n`Write()` 方法需要一个包含要写入文本的字节切片参数。该方法返回读取的字节数以及任何读取错误。\n\n`Close()` 方法可以在打开文件后立即使用\
  \ `defer` 关键字调用，以便在文件操作完成后在包含它的函数结束时关闭文件。\n\n![image](img/1g.jpg)首先在程序中导入 Go 标准库的\
  \ `ioutil` 和 `os` 包，以写入文本文件\n\n```go\nimport (\n\t\"fmt\"\n\t\"io/ioutil\"\n\t\"\
  os\"\n)\n```\n\n![image](img/commong.jpg)\n\nsrc\\write\\main.go\n\n![image](img/2g.jpg)接下来，添加一个函数来检查写入错误\n\
  \n```go\nfunc check( err error ) {\n\tif err != nil {\n\t\tfmt.Println( err )\n\t\
  }\n}\n```\n\n![image](img/hot.jpg)\n\n有多种操作类型标志，可以为 `OpenFile()` 函数指定多个标志。更多详细信息请参考\
  \ [golang.org/pkg/os/#OpenFile](http://www.golang.org/pkg/os/#OpenFile) 文档。\n\n\
  ![image](img/3g.jpg)现在，在 main 函数中写入整个文本文件，然后检查错误\n\n```go\ntxt := [ ]byte( “\\nA\
  \ thousand suns will stream on thee,\n\\nA thousand moons will quiver.\\n” )\nerr\
  \ := ioutil.WriteFile( “C:/Textfiles/Farewell.txt”, txt, 0644 )\ncheck( err )\n\
  ```\n\n![image](img/4g.jpg)接下来，打开同一个文本文件进行追加操作，然后检查错误并记得关闭文件\n\n```go\nfile, err\
  \ := os.OpenFile( “C:/Textfiles/Farewell.txt”,\n\tos.O_APPEND, 0644 )\ncheck( err\
  \ )\ndefer file.Close( )\n```\n\n![image](img/5g.jpg)现在，向现有文件内容追加文本并检查错误\n\n```go\n\
  slice := [ ]byte( “by Alfred Lord Tennyson.\\n” )\nnb, err := file.Write( slice\
  \ )\ncheck( err )\n```\n\n![image](img/6g.jpg)最后，显示起始位置、读取的字符数以及已读取的文本\n\n```go\n\
  fmt.Printf( “\\nAppended: %v - %v”, nb, string( slice[ : nb ] )\n```\n\n![image](img/7g.jpg)将程序文件保存在“write”目录中，然后运行程序查看文本\n\
  \n![image](img/153_1)\n\n![image](img/hot.jpg)\n\n权限中的最后三位分别代表所有者（Owner）、组（Group）和其他用户（Other）。每个用户都可以具有执行（1\
  \ 分）、写入（2 分）和读取（4 分）的权限。这些分数的总和 `0644` 允许所有者读写，但组和其他用户只能读取文件。这保护了文件不受未经授权的修改。\n\n\
  ![image](img/hot.jpg)\n\n文件类型还有一个 `WriteString()` 方法，它的作用与 `Write()` 方法相同，但接受一个\
  \ `string` 参数而不是 `byte` 切片。\n\n## 使用临时文件\n\n有时在用户系统上创建一个临时文件来存储 Go 程序执行期间的数据是很有用的。Go\
  \ 标准库 `io` 包有一个 `ioutil` 包，其中包含一个为此目的设计的 `TempFile()` 函数。\n\n![image](img/pg154_1.jpg)\n\
  \n`TempFile()` 函数返回一个 `os.File` 类型和一个错误或 `nil`。该函数需要两个参数来指定创建文件的目录和文件名模式。你可以将目录指定为路径，或者如果你愿意在系统的默认临时目录下创建临时文件，可以指定为空字符串\
  \ `“”`。你只需将文件名模式指定为字符串，系统会在其后追加一个生成的随机字符串。如果模式中包含 `*` 通配符，生成的字符串将替换该字符。\n\n当 `TempFile()`\
  \ 函数成功创建一个临时文件时，它会自动打开该文件并准备好读写。返回的文件类型具有 `Name()` 方法，可以用其引用它的路径（包括模式和随机字符串文件名）。你可以利用\
  \ `Write()` 和 `WriteString()` 方法添加文本内容，并在处理完成后使用 `Close()` 方法。\n\n\n\n\n当临时文件不再被需要时，你可以通过指定文件名作为\
  \ `os.Remove()` 函数的参数来删除它。你也可以通过指定文件名作为 `os.Stat()` 函数的参数来检查临时文件（或其他文件）。该函数会返回一个\
  \ `info` 类型，以及一个错误信息或 `nil`。\n\n![image](img/1g.jpg)首先在程序中导入 Go 标准库的 `ioutil` 和\
  \ `os` 包，以处理临时文件\n\n```go\nimport (\n\t\"fmt\"\n\t\"io/ioutil\"\n\t\"os\"\n)\n```\n\
  \n![image](img/commong.jpg)\n\n`src\\temp\\main.go`\n\n![image](img/2g.jpg)接下来，添加一个函数来检查错误\n\
  \n```go\nfunc check(err error) {\n\tif err != nil {\n\t\tfmt.Println(err)\n\t}\n\
  }\n```\n\n![image](img/3g.jpg)现在，在 `main` 函数中，创建一个临时文本文件，然后检查错误并确认文件是否存在\n\n```go\n\
  tmpFile, err := ioutil.TempFile(\"\", \"Data-*\")\ncheck(err)\nfmt.Printf(\"\\nCreated\
  \ File:\\n%v \\n\", tmpFile.Name())\n```\n\n![image](img/4g.jpg)向临时文件写入文本，然后检查错误\n\
  \n```go\nnb, err := tmpFile.WriteString(\"Go Programming Fun!\\n\")\ncheck(err)\n\
  ```\n\n![image](img/5g.jpg)接下来，从临时文件中读取文本并检查错误，然后显示读取的字符数\n\n```go\ntxt, err :=\
  \ ioutil.ReadFile(tmpFile.Name())\ncheck(err)\nfmt.Printf(\"\\nRead: %v bytes -\
  \ %v \\n\", nb, string(txt))\n```\n\n![image](img/6g.jpg)记得在处理完成后关闭文件\n\n```go\n\
  tmpFile.Close()\n```\n\n![image](img/7g.jpg)然后删除临时文件\n\n```go\nos.Remove(tmpFile.Name())\n\
  ```\n\n![image](img/8g.jpg)最后，尝试检查（已删除的）临时文件并检查错误\n\n```go\n_, err = os.Stat(tmpFile.Name())\n\
  check(err)\n```\n\n![image](img/9g.jpg)将程序文件保存到“temp”目录，并运行程序以创建、写入、读取和删除临时文件\n\n\
  ![image](img/pg155_1.jpg)\n\n![image](img/forget.jpg)\n\n`_` 空标识符代表了在该程序中未被使用的 `info`\
  \ 类型。\n\n## 总结\n\n- Go 标准库 `fmt` 包提供了 `Scan()`、`Scanln()` 和 `Scanf()` 函数来从标准输入读取。\n\
  - `Scan()`、`Scanln()` 和 `Scanf()` 函数各返回两个值，分别是扫描到的项目数量和任何读取错误。\n- 如果在从标准输入读取时没有遇到错误，则返回的错误值将是\
  \ `nil`。\n- Go 标准库 `bufio` 包提供了 `Scanner` 类型，它是用于数据流的内存缓冲区。\n- `Scanner` 拥有一个 `Scan()`\
  \ 方法读取输入，一个 `Text()` 方法返回文本，以及一个 `Err()` 方法返回错误。\n- Go 标准库 `strings` 包提供了 `Fields()`\
  \ 函数，可以将字符串拆分为单个单词。\n- Go 标准库 `os` 包提供了 `Args` 切片，它将命令行参数值存储在元素中。\n- Go 标准库 `flag`\
  \ 包拥有 `String()`、`Int()` 和 `Bool()` 函数，每个函数指定一个标志名称、默认值和帮助信息。\n- `flag` 包的 `Parse()`\
  \ 函数将用户的值应用到标志上。\n- Go 标准库 `io` 包包含一个 `ioutil` 包，该包提供一个 `ReadFile()` 函数来读取整个文本文件。\n\
  - Go 标准库 `os` 包拥有 `Open()`、`Read()`、`Seek()` 和 `Close()` 方法来处理文本文件的内容。\n- 可以配合 `defer`\
  \ 关键字调用 `Close()` 方法以便在所有文件操作完成后稍后关闭文件。\n- Go 标准库 `io/ioutil` 包提供了 `TempFile()`\
  \ 函数来创建临时文件。\n- `TempFile()` 函数返回一个 `os.File` 类型，该类型拥有 `Name()`、`Write()`、`WriteString()`\
  \ 和 `Close()` 方法，用于向临时文件添加内容。\n- `os.Remove()` 函数可以删除文件，`os.Stat()` 函数可以检查文件信息。\n\
  \n11\n\n# 使用并发\n\n***本章演示了如何在 Go 程序中使用 goroutine 和通道来实现任务的并发执行。***\n\n- 创建 Goroutine\n\
  - 继续等待\n- 创建通道\n- 缓冲通道\n- 选择通道\n- 同步 Goroutine\n- 使用工作池\n- 总结\n\n## 创建 Goroutine\n\
  \nGo 程序像其他语言一样通常按顺序执行代码，但带有 goroutine 的程序允许函数同时运行。Goroutine 是通过在函数或方法调用前插入 `go`\
  \ 关键字创建的。它们的执行顺序由 Go 调度器内部决定。\n\n- **并行性** 是在多核心上同时执行任务。例如：\n- **并发** 是将程序拆分为独立执行的任务。Goroutine\
  \ 是轻量级线程。\n\n![image](img/1g.jpg)首先在程序中导入 Go 标准库 `time` 包，以允许 goroutine 执行延迟\n\n\
  ```go\nimport (\n\t\"fmt\"\n\t\"time\"\n)\n```\n\n![image](img/commong.jpg)\n\n\
  `src\\goroutine\\main.go`\n\n![image](img/2g.jpg)添加一个包含循环的函数，每秒打印迭代次数和字符串参数\n\n\
  ```go\nfunc count(item string) {\n\tfor i := 1 ; i <= 3 ; i++ {\n\t\tfmt.Printf(\"\
  %v \", i, item)\n\t\ttime.Sleep(1 * time.Second)\n\t}\n\tfmt.Println()\n}\n```\n\
  \n![image](img/3g.jpg)现在，在 `main` 函数中添加普通函数调用以顺序执行\n\n```go\nfmt.Println(\"\\n 顺序执行...\"\
  )\ncount(\"moose\")\ncount(\"sheep\")\n```\n\n![image](img/4g.jpg)然后，在 `main` 函数中添加一个\
  \ goroutine 和一个普通调用以并发执行\n\n```go\nfmt.Println(\"\\n 并发执行...\")\ngo count(\"moose\"\
  )\ncount(\"sheep\")\n```\n\n![image](img/5g.jpg)将程序文件保存到“goroutine”目录，然后运行程序以查看不同的输出\n\
  \n![image](img/pg159_1.jpg)\n\n![image](img/hot.jpg)\n\n默认情况下，当主 goroutine 完成时程序将退出——无论是否有其他\
  \ goroutine 尚未完成。\n\n## 继续等待\n\nGo 程序可能包含多个 goroutine，因此 Go 标准库 `sync` 包提供了一个 `WaitGroup`\
  \ 类型，可用于等待一组 goroutine 完成执行。\n\n![image](img/pg160_1.jpg)\n\n`WaitGroup` 的实例按通常方式创建，作为一个具有如下语的变量：\n\
  \n```go\nvar waitgroupName sync.WaitGroup\n```\n\n\n\n\n- `Add()` – 按参数指定的数值增加 `WaitGroup`\
  \ 计数器。对于程序添加的每个新 goroutine（协程），计数器都应该增加 1。\n- `Done()` – 自动将 `WaitGroup` 计数器减 1，因此不需要参数。当每个\
  \ goroutine 完成时，计数器应该减 1。\n- `Wait()` – 阻塞程序直到 `WaitGroup` 计数器达到 0，因此不需要参数。当最后一个运行的\
  \ goroutine 将计数器减为 0 时，阻塞将自动解除。\n\n当将 `WaitGroup` 作为参数传递给函数时，必须以指针的形式传递。这意味着参数将使用\
  \ `&` 地址操作符指定其内存地址，而函数参数将使用 `*` 前缀操作符将其标记为指针。接收函数随后可以使用该指针参数调用 `WaitGroup` 的 `Done()`\
  \ 方法。\n\n在实际创建 goroutine 的语句之前，应该先调用 `Add()` 方法来增加 `WaitGroup` 计数器。\n\n可选情况下，`Add()`\
  \ 方法的参数可以指定集合中 goroutine 的总数，而不是单独为每个添加的 goroutine 增加 `WaitGroup` 计数器。\n\n你可以复用\
  \ `WaitGroup` 来控制后续一组 goroutine 的执行，但只有在之前集合的 `Wait()` 方法达到 0 后，才能为这些 goroutine\
  \ 调用 `Add()` 方法。\n\n![image](img/forget.jpg)\n\ngoroutine 的执行顺序由 Go 调度器控制，并且每次程序运行时都可能不同。\n\
  \n![image](img/1p.jpg)首先导入 Go 标准库中的 `sync` 和 `time` 包，用于等待 goroutine 并允许延迟。\n\n\
  ```go\nimport (\n    \"fmt\"\n    \"sync\"\n    \"time\"\n)\n```\n\n![image](img/commonp.jpg)\n\
  \nsrc\\waitgroup\\main.go\n\n![image](img/2p.jpg)接下来，在 main 函数中创建一个 WaitGroup 实例\n\
  \n```go\nvar wg sync.WaitGroup\n```\n\n![image](img/3p.jpg)现在，添加一个循环来增加计数器，并将 `WaitGroup`\
  \ 的地址作为函数参数传递：\n\n```go\nfor i := 1 ; i <= 3 ; i++ {\n    wg.Add( 1 )\n    go report\
  \ ( i, &wg )\n}\n```\n\n![image](img/4p.jpg)最后，在 main 函数中，阻塞直到 WaitGroup 计数器达到 0\n\
  \n```go\nwg.Wait()\n```\n\n![image](img/5p.jpg)现在，添加一个函数来确认每个 goroutine 的开始和结束，然后通知\
  \ WaitGroup 停止等待：\n\n```go\nfunc report( i int, wg *sync.WaitGroup) {\n    fmt.Printf(\
  \ \"\\nGoroutine %v Started\", i )\n    time.Sleep( 1 * time.Second )\n    fmt.Printf(\
  \ \"\\n\\t\\t\\tGoroutine %v Ended\", i )\n    wg.Done()\n}\n```\n\n![image](img/6p.jpg)将程序文件保存到“waitgroup”目录中，然后运行程序查看程序如何等待\
  \ goroutine\n\n![image](img/pg161_1.jpg)\n\n![image](img/hot.jpg)\n\n你也可以在函数开始使用\
  \ `defer wg.Done()` 来确保 Waitgroup 收到通知。\n\n## 创建通道 (Make Channels)\n\nGoroutine\
  \ 允许代码以独立的方式并发执行，但你可以通过使用“通道（channels）”让 goroutine 相互通信。\n\n![image](img/pg162_1.jpg)\n\
  \nGo 通道像一根管道，你可以通过它发送消息或接收消息。重要的是意识到发送和接收操作是“阻塞”操作——当发送消息时，通道将等待直到接收者准备好接受消息；当接收消息时，通道将等待直到发送者递送消息。\n\
  \n通道通过在内置函数 `make()` 中指定 `chan` 关键字和数据类型来创建，如下所示：\n\n```go\nchannelName := make(\
  \ chan dataType )\n```\n\n你可以使用 `<-` 箭头操作符向通道发送值：\n\n```go\nchannelName <- value\n\
  ```\n\n相反，你可以使用 `<-` 箭头操作符从通道接收值，语法如下：\n\n```go\nvalue := <-channelName\n```\n\n\
  确保接收者不会等待一个永远不会到达的消息很重要，这会导致死锁（deadlock）错误。为了避免这种情况，你可以使用 `close()` 函数显式地关闭通道：\n\
  \n```go\nclose(channelName)\n```\n\n`range` 关键字可以在循环中接收每个通道项，直到通道关闭：\n\n```go\n\
  for msg := range channelName {\n    // 使用 msg\n}\n```\n\n你也可以使用布尔返回值来检查通道是否仍然开启：\n\
  \n```go\nmsg, open := <-channelName\nif !open {\n    // 通道已关闭\n}\n```\n\n下面是一个使用通道\
  \ goroutine 的示例：\n\n```go\npackage main\n\nimport (\n    \"fmt\"\n    \"time\"\n\
  )\n\nfunc main() {\n    c := make(chan string)\n\n    go func(msg string, c chan\
  \ string) {\n        for i := 0; i < 3; i++ {\n            c <- msg + \" \" + time.Now().Format(\"\
  15:04:05\")\n            time.Sleep(1 * time.Second)\n        }\n        close(c)\n\
  \    )(\"Message\", c)\n\n    for msg := range c {\n        fmt.Println(msg)\n \
  \   }\n}\n```\n\n\n\n\n\n`src\\chanbuf\\main.go`\n\n![image](img/2p.jpg)接下来，向通道发送一条消息\n\
  \n```go\nc <- “Go Programming”\n```\n\n![image](img/3p.jpg)现在，添加一个接收者并输出消息\n\n```go\n\
  msg := <- c\nfmt.Printf( “\\\\n%v \\\\n\\\\n”, msg )\n```\n\n![image](img/4p.jpg)然后，向通道发送几条消息\n\
  \n```go\nc <- “Go Programming”\nc <- “in “\nc <- “easy “\nc <- “steps”\n```\n\n\
