- "# GO 编程快速入门\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n- 总结\n\n\n\n# 如何使用本书\n\
  \n书中的示例演示了 Go 语言 (`golang`) 的特性，截图说明了所列代码示例产生的实际结果。使用了某些颜色约定来解释步骤中的代码……\n\n程序代码为黑色，但\
  \ Go 语言的关键字和内置函数为蓝色，字面量文本和数值为红色，代码注释为绿色，如下：\n\n```go\npackage main\nimport \"fmt\"\
  \nmain( ) {\n// 我的第一个 Go 程序。\nfmt.Println( \"Hello World!\" )\n}\n```\n\n在安装 Go\
  \ 期间，你将在计算机上选择一个 `GOPATH` 位置来创建程序。每个程序都将位于 GOPATH 下名为 `src` 的子目录中唯一命名的文件夹内。为了识别步骤中描述的示例程序的源代码，步骤旁边的边缘会出现一个图标和文件路径：\n\
  \n![image](img/pg6_1.jpg)\n\nsrc/hello/main.go\n\n# 获取源代码\n\n为了方便起见，书中包含的所有示例的源代码文件都在一个\
  \ ZIP 压缩包中。你可以按照以下简单步骤获取该包：\n\n![image](img/1g1.jpg)浏览到 [www.ineasysteps.com](http://www.ineasysteps.com)，然后导航到\
  \ Free Resources 并选择 Downloads 部分\n\n![image](img/2g1.jpg)接下来，在列表中找到 GO Programming\
  \ in easy steps，然后点击标题为 All Code Examples 的超链接下载 ZIP 压缩文件\n\n![image](img/3g1.jpg)现在，将包的内容解压到计算机上的\
  \ `GOPATH/src` 子目录中。\n\n如果你没有获得任何示例中所示的结果，只需将你的代码与下载的原始示例文件中的代码进行对比，即可发现错误所在。\n\n\
  \n\n\nGo 是一种免费的开源编程语言，由 Robert Griesemer、Rob Pike 和 Ken Thompson 在 Google 创建——他们最广知的身份是开发了\
  \ Unix 操作系统。Google 于 2012 年 3 月发布了 Go 语言的 1.0 版本（`golang`），从那时起它获得了广泛的普及。\n\nGo\
  \ 程序以纯文本形式编写，然后由 Go 编译器编译成机器码，从而生成可执行的二进制版本。\n\n![image](img/pg8_2.jpg)\n\nGo 编程语言的目标是具有表达性、快速、高效、可靠且易于编写。某些编程语言（如\
  \ `C` 或 `C++`）快速且可靠，但并不简单。相反，其他编程语言（如 `Java` 或 `Python`）编写简单，但效率并不高。\n\nGo 在许多方面与\
  \ `C` 语言语言相似，有时被称为“类 C 语言”或“21 世纪的 C 语言”。但 Go 不止于此，因为它吸纳了许多其他编程语言的优秀思想，同时避免了会导致复杂性或不可靠性的特性。\n\
  \n也许最重要的一点是，Go 引入了通过 `goroutines` 和 `channels` 利用多核 CPU 处理能力进行并发的能力。这为计算机处理处理几项任务提供了可能。\n\
  \n虽然 Go 语言没有像 `C++` 或 `Java` 这种面向对象编程（OOP）语言那样的类结构，但它的特性提供了一定程度的封装、继承和多态——这是 OOP\
  \ 的三大基石。\n\n![image](img/pg8_1.jpg)\n\nGo gopher —— Go 编程语言的标志性吉祥物。\n\n![image](img/hot.jpg)\n\
  \n你可以在《In Easy Steps》系列中发现更多编程语言书籍——包括 `C`、`C++`、`C#`、`Java` 和 `Python`。访问 [www.ineasysteps.com](http://www.ineasysteps.com)\
  \ 了解更多信息。\n\n有如此多的编程语言可以选择，你可能会奇怪为什么选择学习 Go 编程——以下是 Go 提供的某些优势：\n\n## 简单的语法\n\n\
  Go 语言非常简洁，类似于 `Python`。它编写起来像 `Python` 一样简单，但像 `C++` 一样高效。这让你能够编写出易于阅读和维护的代码。\n\n\
  ## 编译型语言\n\nGo 源代码被编译成计算机可以直接读取的二进制机器码，而不是在每次程序运行时进行解释。这使得你编写的 Go 程序运行比为 `Python`\
  \ 或 `PHP` 等解释型语言的程序更快。\n\n## Go 编译器\n\nGo 编译器非常快，并提供额外的好处，例如代码优化和错误检查——它可以检测代码中未使用的变量、代码所需的缺失导入，以及拼写错误或无效代码。Go\
  \ 编译器还可以为其他操作系统生成可执行二进制文件。这让你能够将源代码编译并在多台机器上运行。\n\n## 并发\n\nGo 语言通过 `goroutines`\
  \ 和 `channels` 为并发提供了原生支持。这让你能够编写可以同时执行多个任务的多线程程序。\n\n## 垃圾回收\n\n自动内存管理是 Go 语言的一个关键特性。它的垃圾回收器与程序并发运行。这让你编写程序代码时无需担心内存泄漏。\n\
  \n## 静态类型\n\nGo 是一种静态类型语言，变量被显式地声明为特定的固定类型。这有助于尽早发现错误。\n\n安装 Go 工具\n\n要开始使用 Go，你必须首先安装环境。Go\
  \ 安装程序提供了一套工具，将帮助你构建、测试和运行程序。\n\nGo gopher —— Go 编程语言的标志性吉祥物。\n\n![image](img/hot.jpg)\n\
  \n\n\n\n![image](img/7b.jpg)右键点击快捷图标并选择 `Properties` 项，打开其“属性”对话框\n\n![image](img/pg13_4.jpg)\n\
  \n![image](img/8b.jpg)选择 `Shortcut` 选项卡，然后输入你的工作区目录路径\n\n![image](img/9b.jpg)点击\
  \ `Apply`、`OK` 关闭对话框，然后双击快捷图标在你的“src”文件夹中打开命令行\n\n![image](img/pg13_5.jpg)\n\n![image](img/hot.jpg)\n\
  \nGo 程序可以使用纯文本编辑器编写，例如 Windows 的记事本应用。拥有一个一个可以在你的“src”目录文件夹中打开文本编辑器的桌面快捷方式是很有用的。重复此页面上的步骤，但在第\
  \ 7 步中输入 `notepad` 作为位置，并将 `Go Editor` 作为名称，以创建另一个实用的桌面快捷方式。\n\n## 编写一个 Go 程序\n\n\
  所有的 Go 程序都以纯文本文件的形式开始，随后被编译成实际的可执行程序。这意味着 Go 程序可以在任何纯文本编辑器中编写，例如 Windows 的记事本应用或\
  \ Linux  Nano 应用。\n\n![image](img/pg14_1.jpg)\n\n按照以下步骤创建一个简单的 Go 程序，该程序将输出传统的第一个程序问候：\n\
  \n![image](img/1b.jpg)在你的“src”文件夹中创建一个名为“hello”的子目录\n\n![image](img/pg14_2.jpg)\n\
  \n![image](img/commons.jpg)\n\nsrc/hello/main.go\n\n![image](img/2b.jpg)打开纯文本编辑器（如记事本），并按照列出的内容完全输入此代码以开始程序\n\
  \n```\npackage main\n```\n\n![image](img/3b.jpg)在下方两行，按照列出的内容插入此代码\n\n```go\nimport\
  \ “fmt”\n```\n\n![image](img/4b.jpg)在再下方两行，精确添加此代码\n\n```gofunc main( ) {\n    fmt.Println(\
  \ “Hello World!” )\n}\n```\n\n![image](img/5b.jpg)将文件保存到“hello”文件夹中，并命名为 `main.go`\
  \ – 现在完整的程序看起来应该完全像这样：\n\n![image](img/pg14_3.jpg)\n\n![image](img/snake.jpg)\n\n\
  `fmt.Println` 中的大写 P 和小写 L。\n\n![image](img/forget.jpg)\n\n文件夹内的文件安排在 Go 中非常重要。每个主文件以及任何相关文件都必须放在一个唯一名的文件夹中以创建一个包\
  \ – 因此这里的包命名为“hello”。\n\n相反页上程序代码的各个部分可以单独检查，以便更清楚地理解每个部分：\n\n## 包声明\n\n```go\n\
  package main\n```\n\n包的类型在 `package` 关键字之后声明。所有的 Go 程序代码都包含在包中。你可以为作为共享库的包声明你自己的类型，但如果你想将代码编译成可执行程序，则必须声明包“main”。\n\
  \n## 导入声明\n\n```go\nimport “fmt”\n```\n\n使用 `import` 关键字将一个或多个包导入到当前包中，以便让这些功能对该程序可用。`fmt`\
  \ 包来自 Go 标准库。\n\n\n\n\n\n![image](img/3b.jpg)接下来，在搜索框中输入 `go` 来查找 Go 语言的 VS Code\
  \ 扩展。\n\n![image](img/4b.jpg)点击 `Install` 将 Go 语言支持添加到 VS Code —— 如果系统要求添加更多 Go\
  \ 支持，选择 `Install All`。\n\n![image](img/5b.jpg)点击 `File`、`Add Folder to Workspace`\
  \ 并添加你的 `go` 工作区文件夹，该文件夹应包含源代码的 `src` 文件夹。\n\n![image](img/pg19_1.jpg)\n\n![image](img/6b.jpg)点击活动边栏上的\
  \ `Explorer` 按钮，然后选择一个文件在 VS Code 主编辑器窗口中打开——例如，点击 `hello` 文件夹中的 `main.go` 文件。\n\
  \n![image](img/pg19_2.jpg)\n\n![image](img/7b.jpg)点击 `View`、`Debug Console` 打开输出面板——通常情况下，这出现在代码编辑器窗口下方，但也可以移动它。\n\
  \n![image](img/pg19_3.jpg)\n\n![image](img/8b.jpg)点击 `Run`、`Run Without Debugging`\
  \ 以查看输出显示在 Debug Console 中。\n\n![image](img/pg19_5.jpg)\n\n![image](img/pg19_4.jpg)\n\
  \n![image](img/hot.jpg)\n\nVS Code 应用是高度可定制的——你可以根据喜好更改组件布局，并从几种浅色或深色主题中进行选择。这里显示的截图是默认的\
  \ Light 主题，代码编辑器窗口中显示的语法高亮与本书后续使用的相同。\n\n## 总结\n\n- Go 程序是纯文本文件，被编译成机器码以生成可执行的二进制版本。\n\
  - Go 工具允许你构建、运行和测试用 Go 编程语言编写的程序。\n- Go 安装包含了有用且受信的代码标准包，你可以将它们导入到程序中。\n- 命令行 `go`\
  \ 命令显示 Go 工具命令列表。\n- `GOROOT` 环境变量存储你系统上 Go 安装所在的位置。\n- `GOPATH` 环境变量存储你系统上 Go 工作区的位置。\n\
  - Go 工作区是一个名为 `go` 的目录，包含名为 `src`、`bin` 和 `pkg` 的子目录。\n- Go 包的名称是包含 Go 源代码文件的目录名称。\n\
  - Go 包声明指定了其类型，并且必须指定为 `package main` 才能编译为可执行文件。\n- `import` 声明引用了任何要供程序使用的包的包名。\n\
  - 函数声明包含 `func` 关键字，其后跟函数名、`( )` 圆括号和 `{ }` 大括号。\n- 所有 Go 程序都必须有一个名为 `main` 的函数作为程序的入口。\n\
  - `go run` 命令编译并运行程序。\n- `go build` 命令编译程序并生成一个可以分发的可执行二进制文件。\n- 应使用 `go fmt` 命令来正确格式化\
  \ Go 包的源代码。\n- VS Code 提供了如语法高亮、自动缩进、括号匹配和代码调试等功能。\n\n# 2 存储值\n\n本章演示了如何在 Go 程序中使用变量容器来存储、检索和操作各种类型的数据。\n\
  \n- 创建程序变量\n- 显示变量值\n- 转换数据类型\n- 固定常量值\n- 指向存储的值\n- 总结\n\n## 创建程序变量\n\n![image](img/pg22_1.jpg)\n\
  \n变量是 Go 程序中的一种容器，可以在计算机内存中存储一个数据值。存储的值可以通过变量名进行引用，并通过赋值新值来更改。程序员可以为变量选择任何名称，只要它符合下列表列出的命名规范规则：\n\
  \n| 命名规则 | 示例 |\n| --- | --- |\n| 不能是 Go 关键字 | `default` |\n| 不能包含算术运算符 | `a+b`\
  \ |\n| 不能包含标点字符 | `%$#!` |\n| 不能包含空格 | `no` |\n| 必须以字母开头 | `msg` |\n| 可以包含数字 | `good1`\
  \ |\n| 可以混合大小写 | `camelCase` |\n\n变量名应该简洁并始终以小字母开头。使用有意义的名称是良好的习惯。创建变量使用 `var` 关键字。\n\
  \n```\nvar msg string\nmsg = \"Hi there!\"\nvar msg string = \"Hi there!\"\n```\n\
  \n此外，可以使用 `:=` 操作声明并初始化变量。在这种情况下，不需要 `var` 关键字或类型，Go 编译器会根据赋值的数据类型推断类型。这只能在函数体内部使用。\n\
  \n```go\nmsg := \"Hi there!\"\n```\n\nGo 的基本类型有：\n\n| 数据类型 | 描述 | 示例 |\n| --- |\
  \ --- | --- |\n| string | 字符串 | `\"Hi there!\"` |\n| int | 整数 | `100` |\n| float64\
  \ | 浮点数 | `0.123456` |\n| byte | 字符 | `'A'` |\n| bool | 布尔值 | `true` |\n\n必须 Go\
  \ 是一种静态类型语言，这意味着变量只能包含其声明中指定类型的数据。\n\n## 显示变量值\n\n![image](img/pg24_1.jpg)\n\n可以使用第一章中显示“Hello\
  \ World!”消息的 `fmt.Println()` 函数来显示变量的值。或者，可以使用合适的“格式占位符”和变量名为 `fmt.Printf()` 函数指定显示变量值的格式：\n\
  \n| 占位符 | 描述 | 示例 |\n| --- | --- | --- |\n| %s | 字符串 | `\"Go Fun!\"` |\n| %d | 整数\
  \ | `100` |\n| %f | 浮点数 | `0.123456` |\n| %c | 字符 | `'A'` |\n| %t | 布尔值 | `true`\
  \ |\n| %p | 机器内存地址 | `0x0022FF34` |\n| %v | 默认格式的值 | 以上任意一项 |\n\n\n\n\n\n| `%T`\
  \ | 变量的数据类型 | `int` |\n\n格式指定符可以通过在 `%` 字符之后指定所需的空格数，来确保输出占据最小数量的空格——例如，使用指定符 `%7d`\
  \ 可以确保整数始终至少占据七个空间。如果希望用零填充空白区域，只需添加一个零使指定符变为 `%07d` 即可。\n\n精度指定符是一个点（.）后跟一个数字，可以与\
  \ `%f` 格式指定符配合使用，以确定显示多少位小数——例如，使用 `%.2f` 显示两位小数。精度指定符可以与最小空间指定符结合，以控制空间数和的小位数——例如，使用\
  \ `%07.2f` 显示七个空间，包括两位小数和用零填充的空白。默认情况下，空白空间位于数字之前，因此它是右对齐的。它们也可以通过在最小空间指定符前加上负号来添加到数字之后，从而使其左对齐。\n\
  \n![image](img/forget.jpg)\n\n`%v` 格式指定符可显示任何值，而 `%T` 格式指定符用于确认任何变量的数据类型。\n\n![image](img/1r.jpg)在你的“src”文件夹内创建一个名为“vars”的目录\n\
  \n![image](img/commonr.jpg)\n\n`src\\vars\\main.go`\n\n![image](img/2r.jpg)带有 package\
  \ 和 import 声明开始一个 main.go 程序\n\n```go\npackage main\n\nimport \"fmt\"\n```\n\n![image](img/3r.jpg)添加一个声明并初始化两个变量的\
  \ main 函数\n\n```go\nfunc main() {\n    num := 100\n    pi := 3.1415926536\n    //\
  \ 在此处插入语句。\n}\n```\n\n![image](img/4r.jpg)在 main 函数中，插入语句以各种格式输出变量值\n\n```go\nfmt.Printf(\"\
  num: %v type:%T \\n\", num, num)\nfmt.Printf(\"pi: %v type:%T \\n\\n\", pi, pi)\n\
  fmt.Printf(\"%%7d displays %7d \\n\", num)\nfmt.Printf(\"%%07d displays %07d \\\
  n\\n\", num)\nfmt.Printf(\"Pi is approximately %1.10f \\n\", pi)\nfmt.Printf(\"\
  Right-aligned %20.3f rounded pi \\n\", pi)\nfmt.Printf(\"Left-aligned %-20.3f rounded\
  \ pi \\n\", pi)\n```\n\n![image](img/5r.jpg)将程序文件保存到“vars”目录，然后运行程序以查看指定格式下的变量值\n\
  \n![image](img/pg25_1.jpg)\n\n![image](img/hot.jpg)\n\n`fmt.Printf()` 函数在输出后不会添加新行。你必须手动包含\
  \ `\\n` 换行转义字符将打印头移动到下一行。要使用 `fmt.Printf()` 函数显示 `%` 字符，如所示，在其前面加上另一个 `%` 字符。\n\n\
  ![image](img/snake.jpg)\n\n注意，当格式指定符分配的小位数少时，浮点值会被四舍五入——而不是简单的截断。\n\n## 转换数据类型\n\
  \n你有时需要将变量中存储的值转换为不同的数据类型。通常，你希望将字符串值转换为数值以执行算术运算。例如，字符串可能包含数字字符“42”，但除非将其转换为 `int`\
  \ 或 `float64` 数据类型，否则你无法对该值进行运算。\n\n![image](img/pg26_1.jpg)\n\nGo 标准库包含一个 `strconv`\
  \ 包，其中包含与字符串数据类型相互转换的函数。通过在 import 声明中添加 `strconv` 包，你可以让程序可以使用这些函数。\n\n`strconv.Atoi()`\
  \ 函数将括号内指定的字符串转换为 `int` 数据类型。它返回字符串等等的 `int` 值，但与你在 Go 中遇到的其他函数一样，它还会返回第二个值，当转换成功时该值为特殊的\
  \ `nil` 零值，如果失败则返回错误信息。这意味着你必须将调用赋值给。\n\n`strconv.ParseFloat()` 函数将括号内指定的字符串转换为\
  \ `float64` 数据类型。它返回字符串等等的 `float64` 值，但与你在 Go 中遇到的其他函数一样，它还会返回第二个值，当转换成功时该值为特殊的\
  \ `nil` 零值，如果失败则返回错误信息。\n\n`strconv.Itoa()` 函数将 `int` 转换为字符串。它等同于 `strconv.FormatInt(int64(i),\
  \ 10)`。\n\n`strconv.FormatFloat()` 函数将浮点数转换为字符串。你可以在转换期间指定精度和格式（如 'g', 'f', 'e'）。\n\
  \n注意，当格式指定符分配的小位数少时，浮点值会被四舍五入——而不是简单的截断。\n\n\n\n\n非常有用的一点是，常量声明可以使用一个名为 `iota` 的“常量生成器”来创建一个相关的常量值序列。常量名应该在\
  \ `const` 关键字后面的括号内每行列出一个，并给第一个赋值为 `iota` 值。这会生成一个从零开始的数值序列，列表中的每一个命名常量，该序列就会递增\
  \ 1。\n\n例如，你可以像这样所示将一个数值序列赋值给代表星期几的常量：\n\n```go\nconst (\n\tsunday = iota\n\tmonday\n\
  \ttuesday\n\twednesday\n\tthursday\n\tfriday\n\tsaturday\n)\n```\n\n在这个例示例中，常量 `sunday`\
  \ 将被赋值为 0 (0)，`monday` 将赋值为 1 (1)，依此类推。\n\n如果你想从不同的数字开始序列，只需在给第一个常量赋值时将 `iota` 加上该数字即可。\n\
  \n![image](img/hot.jpg)\n\n在其他编程语言中，生成的序列通常被称为“枚举”（enumeration）或简单的 `enum`。\n\n\
  ![image](img/1r.jpg)在你的“src”文件夹内创建一个名为“const”的目录\n\n![image](img/commonr.jpg)\n\n\
  `src\\const\\main.go`\n\n![image](img/2r.jpg)带有包声明和导入声明开始一个 main.go 程序\n\n```go\n\
  package main\n\nimport \"fmt\"\n```\n\n![image](img/3r.jpg)添加一个 main 函数，声明并初始化一个常量以及一组从一\
  \ (1) 开始的常量序列\n\n```go\nfunc main() {\n\tconst pi = 3.14159\n\tconst (\n\t\tred\
  \ = iota + 1\n\t\tyellow\n\t\tgreen\n\t\tbrown\n\t\tblue\n\t\tpink\n\t\tblack\n\t\
  )\n\t// 在此处插入语句。\n}\n```\n\n![image](img/4r.jpg)接下来，插入语句来显示几个常量值\n\n```go\nfmt.Printf(\"\
  Pi approximately: %v \\n\\n\", pi)\nfmt.Printf(\"Red: %v point \\n\", red)\nfmt.Printf(\"\
  Blue: %v points \\n\", blue)\nfmt.Printf(\"Black: %v points \\n\", black)\n```\n\
  \n![image](img/5r.jpg)将程序文件保存在“const”目录中，然后运行程序查看常量值\n\n![image](img/pg29_1.jpg)\n\
  \n![image](img/hot.jpg)\n\nGo 中的 `math` 包提供了一个名为 `math.Pi` 的常量，它对 ![image](img/py.jpg)\
  \ 值的近似要精确得多\n\n![image](img/hot.jpg)\n\n这里的序列代表了斯诺克游戏中每个球的分值。\n\n## 指向存储的值\n\n每当你的程序创建一个用于存储数据的容器时，你的计算机都会在内存中分配一个空间来存储这些数据。就像房子一样，内存位置的大小可能不同，但每个位置都有唯一的地址。\n\
  \n![image](img/pg30_1.jpg)\n\n因此，一个初始化的变量实际上由三部分组成——名称、值以及存储数据的内存地址。\n\n![image](img/pg30_2.jpg)\n\
  \nGo 语言支持“指针”的概念。指针变量可以存储另一个变量的地址，并可以访问该地址存储的值。声明指针变量需要在此数据类型前加上 `*`，以表示这是一个指针：\n\
  \n```go\nvar ptr *int // 声明此变量将指向一个 int\n```\n\n可以通过在另一个变量名前加上 `&` 将该变量的地址赋值给指针：\n\
  \n```go\nptr = &num // 给指针变量赋值一个地址。\n```\n\n然后，可以通过在指针名称前加上 `*` 来访问所赋值地址处的值：\n\n\
  ```go\n*ptr // 指向所赋值地址处的值。\n```\n\n![image](img/pg30_3.jpg)指针的概念可能会困难，因为 `*` 运算符承担了两个用途——在声明中作为类型描述符，以及在放在指针名称之前作为解引用符。内存位置地址是由你的计算机分配的十六进制数。它们在你的系统上几乎不同。\n\
  \n![image](img/1r.jpg)在你的“src”文件夹内创建一个名为“point”的目录\n\n![image](img/commonr.jpg)\n\
  \n`src\\point\\main.go`\n\n![image](img/2r.jpg)带有包声明和导入声明开始一个 main.go 程序\n\n```go\n\
  package main\n\nimport \"fmt\"\n```\n\n![image](img/3r.jpg)添加一个 main 函数，声明并初始化一个普通整数变量和一个指针变量\n\
  \n```go\nfunc main() {\n\tvar num int = 20\n\tvar ptr *int = &num\n\t// 在此处插入语句。\n\
  }\n```\n\n![image](img/4r.jpg)接下来，插入语句来显示整数变量的值和内存地址\n\n```go\nfmt.Printf(\"num\
  \ value: %v\\n\", num)\nfmt.Printf(\"ptr address: %v\\n\", ptr)\n```\n\n![image](img/5r.jpg)现在，插入语句通过指针显示整数变量的值和地址\n\
  \n```go\nfmt.Printf(\"num via: %v\\n\", *ptr)\nfmt.Printf(\"ptr: %v\\n\", ptr)\n\
  ```\n\n![image](img/6r.jpg)最后，插入语句更改指针所指向的值\n\n```go\n*ptr = 100\nfmt.Printf(\"\
  new num value: %v\\n\", num)\n```\n\n![image](img/7r.jpg)将程序文件保存在“point”目录中，然后运行程序查看变量的值和地址\n\
  \n![image](img/pg31_1.jpg)\n\n![image](img/hot.jpg)\n\n这里最重要的特性是指针改变的是它所指向的值，而不是该值的副本。这在传递变量时变得非常重要——参见第\
  \ 64-67 页。\n\n## 总结\n\n- 变量通过其给名称存储数据，其值可以被更改。\n- 显式变量声明使用 `var` 关键字并指定变量的数据类型。\n\
  - 隐式变量声明可以在函数体内使用 `:=` 运算符推断类型。\n- Go 是一种静态类型语言，变量只能包含声明的类型。\n- `fmt.Printf()` 函数可以使用格式化标记、变量名和\
  \ `\\n` 换行转义序列来格式化输出。\n- `strconv.Atoi()` 函数返回字符串值的 `int` 类型，以及一个可能为 nil 的错误。\n\
  - `strconv.Itoa()` 函数返回整数值的字符串类型。\n- `strconv.ParseFloat()` 函数返回字符串值的 `float64`\
  \ 类型结果，以及一个可能为 nil 的错误。\n- 当给 `byte` 类型的变量赋值字符时，它存储该字符的 ASCII 字符码。\n- 数值类型之间的强制转换指定所需的类型，并在后跟包含要转换值的括号。\n\
  - 常量声明使用 `const` 关键字，并必须用其包含的固定值进行初始化。\n- 指针变量可以存储另一个变量的内存地址，并访问该地址存储的值。\n- `*`\
  \ 运算符在指针变量声明中放在数据类型前以表示该变量是指针。\n- `&` 运算符放在普通变量名前之前以引用该变量的内存地址。\n- `*` 运算符放在指针变量名前之前以引用其指向地址处的值。\n\
  \n# 3 执行操作\n\n*本章介绍 Go 运算符并演示它们可以执行的操作。*\n\n- 执行算术运算\n- 赋值\n- 进行比较\n- 逻辑评估\n\n\n\
  \n\n## 操纵位\n\n## 理解优先级\n\n## 总结\n\n## 执行算术运算\n\n![image](img/pg34_1.jpg)\n\nGo 程序中常用的算术运算符列在下表中，以及它们执行的操作：\n\
  \n| 运算符 | 操作 |\n| --- | --- |\n| `+` | 加法 |\n| `-` | 减法 |\n| `*` | 乘法 |\n| `/` |\
  \ 除法 |\n| `%` | 取余 |\n| `++` | 增一 |\n| `--` | 递减 |\n\n赋值、加法、减法、乘法和除法运算符正如你预期的那样工作，但在使用多个运算符的表达式中，必须对表达式进行分组——最内层\
  \ `(())` 括号内的操作最执行：\n\n```\na = b * c - d % e / f ; // 这不清晰。\na = ( b * c ) - (\
  \ ( d % e ) / f ) ; // 这更清晰。\n```\n\n`%` 取余运算符将第一个数字除以第二个第二个数字，并返回操作的余数。这对于判断一个数是奇数还是偶数很有用。\n\
  \n`++` 增一运算符和 `--` 递减运算符将给定数字改变一并返回结果。它们最常用于循环中的计数——在每次迭代中使用 `++` 增一运算符计数，或在每次迭代中使用\
  \ `--` 递减运算符递计数。\n\n`++` 增一或 `--` 递减运算符必须紧放在变量名之后以更改其值。例如：\n\n```\nn := 4\nn++ //\
  \ 现在 n = 5.\n```\n\n![image](img/forget.jpg)\n\n`+` 运算符具有双目的——它也用于拼接字符串。\n\n![image](img/hot.jpg)\n\
  \n用于运算符形成表达式的值被称为“操作数”——在表达式 `2 + 3` 中，数值 `2` 和 `3` 就是操作数。\n\n![image](img/1g.jpg)在你的\
  \ “src” 文件夹内创建一个名为 “arith”的目录\n\n![image](img/commong.jpg)\n\n`src\\arith\\main.go`\n\
  \n![image](img/2g.jpg)使用 package 和 import 声明开始一个 main.go 程序\n\n```go\npackage main\n\
  import \"fmt\"\n```\n\n![image](img/3g.jpg)添加一个声明并初始化两个变量的 main 函数\n\n```go\nfunc\
  \ main() {\n    a := 8\n    b := 4\n    // 在此处插入语句\n}\n```\n\n![image](img/4g.jpg)在\
  \ main 函数中，插入语句以输出每次算术运算后的结果总和\n\n```go\nfmt.Println(\"Addition:\\t\", (a + b))\n\
  fmt.Println(\"Subtraction:\\t\", (a - b))\nfmt.Println(\"Multiplication:\\t\", (a\
  \ * b))\nfmt.Println(\"Division:\\t\", (a / b))\nfmt.Println(\"Remainder:\\t\",\
  \ (a % b))\n```\n\n![image](img/5g.jpg)现在，插入语句更改存储的值并显示它们的新值\n\n```go\na++\nfmt.Println(\"\
  Increment:\\t\", a)\nb--\nfmt.Println(\"Decrement\\t\", b)\n```\n\n![image](img/6g.jpg)在\
  \ “arith” 目录中保存程序文件，然后运行程序查看每次操作的结果\n\n![image](img/pg35_2.jpg)\n\n![image](img/forget.jpg)\n\
  \n在这里，使用 `\\t` 转义序列输出制表符以对齐结果。\n\n## 赋值值\n\n![image](img/pg36_1.jpg)\n\nGo 编程中用于赋值的运算符列表所示。除了简单的\
  \ `=` 赋值运算符外，所有运算符都是较长表达式的简写形式，为了清晰起见，每个等价形式都已给出：\n\n| 运算符 | 示例 | 等价 |\n| --- |\
  \ --- | --- |\n| `=` | `a = b` | `a = b` |\n| `+=` | `a += b` | `a = (a + b)` |\n\
  | `-=` | `a -= b` | `a = (a - b)` |\n| `*=` | `a *= b` | `a = (a * b)` |\n| `/=`\
  \ | `a /= b` | `a = (a / b)` |\n| `%%=` | `a %= b` | `a = (a % b)` |\n\n在上面的赋值示例\
  \ `a = b` 中，名为 `a` 的变量被赋值名为 `b` 的变量的值——这样该值就存储在变量 `a` 中。从技术上说，赋值运算符将右侧操作数的值存储在左侧操作数指定的内存位置中，然后返回该值作为结果。\n\
  \n`+=` 组合运算符用于向变量增加一个值。在上面的赋值示例 `a += b` 中，`b` 的值加到 `a` 上——因此结果存储在变量 `a` 中。其他组合运算符工作原理相同，首先执行操作，然后将结果赋值给第一个变量。`+=`\
  \ 运算符具有双目的——它也可以拼接字符串。\n\n将 `=` 视为“赋值”而不是“等于”很重要，见第 38 页。\n\n在你的 “src” 文件夹内创建一个名为\
  \ “arith”的目录\n\n`src\\arith\\main.go`\n\n使用 package 和 import 声明开始一个 main.go 程序\n\
  \n```go\npackage main\nimport \"fmt\"\n```\n\n添加一个声明并初始化两个变量的 main 函数\n\n```go\n\
  func main() {\n    a := 8\n    b := 4\n    // 在此处插入语句\n}\n```\n\n在 main 函数中，插入语句以输出每次算术运算后的结果总和\n\
  \n```go\nfmt.Println(\"Addition:\\t\", (a + b))\nfmt.Println(\"Subtraction:\\t\"\
  , (a - b))\nfmt.Println(\"Multiplication:\\t\", (a * b))\nfmt.Println(\"Division:\\\
  t\", (a / b))\nfmt.Println(\"Remainder:\\t\", (a % b))\n```\n\n现在，插入语句更改存储的值并显示它们的新值\n\
  \n```go\na++\nfmt.Println(\"Increment:\\t\", a)\nb--\nfmt.Println(\"Decrement\\\
  t\", b)\n```\n\n在 “arith” 目录中保存程序文件，然后运行程序查看每次操作的结果。\n\n在这里，使用 `\\t` 转义序列输出制表符以对齐结果。\n\
  \nGo 编程中用于赋值的运算符列表所示。除了简单的 `=` 赋值运算符外，所有运算符都是较长表达式的简写形式，为了清晰起见，每个等价形式都已给出：\n\n在上面的赋值示例\
  \ `a = b` 中，名为 `a` 的变量被赋值名为 `b` 的变量的值——这样该值就存储在变量 `a` 中。从技术上说，赋值运算符将右侧操作数的值存储在左侧操作数指定的内存位置中，然后返回该值作为结果。\n\
  \n`+=` 组合运算符用于向变量增加一个值。在上面的赋值示例 `a += b` 中，`b` 的值加到 `a` 上——因此结果存储在变量 `a` 中。其他组合运算符工作原理相同，首先执行操作，然后将结果赋值给第一个变量。`+=`\
  \ 运算符具有双目的——它也可以拼接字符串。\n\n将 `=` 视为“赋值”而不是“等于”很重要，见第 38 页。\n\n在你的 “src” 文件夹内创建一个名为\
  \ “arith”的目录\n\n`src\\arith\\main.go`\n\n使用 package 和 import 声明开始一个 main.go 程序\n\
  \n```go\npackage main\nimport \"fmt\"\n```\n\n添加一个声明并初始化两个变量的 main 函数\n\n```go\n\
  func main() {\n    a := 8\n    b := 4\n    // 在此处插入语句\n}\n```\n\n在 main 函数中，插入语句以输出每次算术运算后的结果总和\n\
  \n```go\nfmt.Println(\"Addition:\\t\", (a + b))\nfmt.Println(\"Subtraction:\\t\"\
  , (a - b))\nfmt.Println(\"Multiplication:\\t\", (a * b))\nfmt.Println(\"Division:\\\
  t\", (a / b))\nfmt.Println(\"Remainder:\\t\", (a % b))\n```\n\n现在，插入语句更改存储的值并显示它们的新值\n\
  \n```go\na++\nfmt.Println(\"Increment:\\t\", a)\nb--\nfmt.Println(\"Decrement\\\
  t\", b)\n```\n\n在 “arith” 目录中保存程序文件，然后运行程序查看每次操作的结果。\n\n## 比较\n\nGo 编程中常用的用于比较两个数值的运算符列表所示：\n\
  \n| 运算符 | 比较测试 |\n| --- | --- |\n| `==` | 等于 |\n| `!=` | 不等于 |\n| `>` | 大于 |\n|\
  \ `<` | 小于 |\n| `>=` | 大于等于 |\n| `<=` | 小于等于 |\n\n`==` 等于运算符比较两个操作数，如果两者的值相等则将返回\
  \ true，否则 `==` 运算符将返回 false。如果两个都是相同的数字，它们就相等；如果两个都是字符，则对它们的 ASCII 值进行数值比较。\n\n\
  相反，`!=` 不等于运算符当两个操作数不相等时返回 true，使用与 `==` 等于运算符相同的规则，否则它返回 false。\n\n\n\n\n\n`>`\
  \ “大于”运算符比较两个操作数，如果第一个操作数的值大于第二个操作数，则返回 `true`；如果它等于或小于第二个操作数，则返回 `false`。`<` “小于”运算符执行相同的比较，但如果第一个操作数的值小于第二个操作数，则返回\
  \ `true`，否则返回 `false`。通常，`>` “大于”运算符或`<` “小于”运算符用于测试循环结构中迭代计数器的值。\n\n在 `>` “大于”运算符或`<`\
  \ “小于”运算符后添加 `=` 赋值运算符（即 `>=` 和 `<=`），当两个操作数的值完全相等时，它们也会返回 `true`。\n\n![image](img/hot.jpg)\n\
  \n比较运算符也称为“关系操作符”。\n\n![image](img/1g.jpg)在你的“src” 文件夹中创建一个名为“comp”的目录\n\n![image](img/commong.jpg)\n\
  \n`src\\comp\\main.go`\n\n![image](img/2g.jpg)带有 package 和 import 声明开始编写一个 main.go\
  \ 程序\n\n```go\npackage main\nimport \"fmt\"\n```\n\n![image](img/3g.jpg)添加一个声明并初始化五个变量的\
  \ main 函数\n\n```go\nfunc main( ) {\n    var zero, num, max int = 0, 0, 1\n    var\
  \ up, dn byte = 'A', 'a'\n    // 在此处插入语句。\n}\n```\n\n![image](img/4g.jpg)在 main\
  \ 函数中，插入语句以输出几次比较的结果\n\n```go\nresult := ( num == zero )               // 0 == 0.\n\
  fmt.Println(\"Equality:\\tnum == zero\\t\", result )\nresult = ( up == dn )    \
  \               // A == a.\nfmt.Println(\"Equality:\\tup == dn\\t\", result )\n\
  result = ( max != zero )              // 1 != 0.\nfmt.Println(\"Inequality:\\tmax\
  \ != zero\\t\", result )\nresult = ( zero > max )                // 0 > 1.\nfmt.Println(\"\
  Greater:\\tzero > max\\t\", result )\nresult = ( max <= zero )               //\
  \ 1 <= 0.\nfmt.Println(\"Less or Equal:\\tmax <= zero\\t\", result )\n```\n\n![image](img/5g.jpg)将程序文件保存在“comp”目录中，然后运行程序以查看每次比较的结果\n\
  \n![image](img/pg39_1.jpg)\n\n![image](img/forget.jpg)‘A’的 ASCII 值为 65，但小写字母‘a’是\
  \ 97 – 所以它们的比较返回 `false`。\n\n![image](img/snake.jpg)比较数字时，记住不仅要测试相等性，也要测试更高和更低的值。\n\
  \n## 逻辑评估\n\n![image](img/pg40_1.jpg)Go 编程中最常用的逻辑运算符列如下表所示：\n\n| 运算符 | 操作 |\n| ---\
  \ | --- |\n| `&&` | 逻辑与 (AND) |\n| `||` | 逻辑或 (OR) |\n| `!` | 逻辑非 (NOT) |\n\n逻辑运算符用于布尔值为\
  \ `true` 或 `false` 的操作数，或者可以转换为 `true` 或 `false` 的值。`&&` 逻辑与运算符会评估两个操作数，只有当两个操作数都为\
  \ `true` 时才返回 `true`。否则，`&&` 逻辑与运算符将返回 `false`。这用于条件分支，通过测试两个条件来确定程序的方向 – 如果两个条件都满足，程序将向某个方向运行。与需要两个操作数都为\
  \ `true` 的 `&&` 逻辑与运算符不同，`||` 逻辑运算符会评估它的两个操作数，只要其中一个操作数返回 `true`，它就会返回 `true`。如果两个操作数都不返回\
  \ `true`，`||` 逻辑或运算符将返回 `false`。这在 Go 编程中执行特定操作非常有用。\n\n\n\n\n\n![image](img/4g.jpg)在\
  \ main 函数中，插入语句输出所有位标志（bit flag）设置\n\n```go\nfmt.Printf( “Flag #1:%v \\n”, ( flags\
  \ & 1 ) > 0 )\n```\n\n```go\nfmt.Printf( “Flag #2:%v \\n”, ( flags & 2 ) > 0 )\n\
