    \ %08b \\t%v \\n”, flags, flags )\n```\n\n![image](img/6g.jpg)现在，插入语句将“开启”位标志向右移动一位，并输出新模式的十进制值\n\
    \n```go\nflags = flags >> 1\nfmt.Printf( “New Value: %08b \\t%v \\n”, flags, flags\
