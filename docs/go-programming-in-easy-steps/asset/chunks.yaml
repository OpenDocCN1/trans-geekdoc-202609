    \n`fmt.Printf( \"\\nColors: %v \\n\", colors )![image](images/3v.jpg)Now, add\
    \ a key/value pair and display its value\n\n`colors[\"Yellow\"] = “#FFFF00”`\n\
    \n`fmt.Printf( \"\\nYellow Hex Code: %v \\n\", colors[\"Yellow\"] )`![image](images/4v.jpg)Then,\
    \ remove the added key/value pair\n\n`delete( colors, “Yellow”)`![image](images/5v.jpg)Finally,\
    \ add a loop to list all key/value pairs in the map\n\n```\nfor k, v := range\
