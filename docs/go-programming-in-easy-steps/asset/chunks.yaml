    **sum = 2 \* ( ( 3 + 4 ) - 5 )**


    **fmt.Printf( “Forced Order: %v \\n\\n”, sum )**


    ![image](images/5g.jpg)Next, insert a statement to display the value of evaluating
    another expression


    **sum = 7 % 3 \* 2**


    **fmt.Printf( “Default Order: %v \\n”, sum )**


    ![image](images/6g.jpg)Now, insert statements to display the value of evaluating
