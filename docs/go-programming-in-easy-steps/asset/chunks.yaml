    \ in a `select` statement block. This has similar syntax to the switch statement\
    \ described [hereon page 50](#chapter04.xhtml#sec23), but a `select` statement\
    \ blocks until one of its case statements finds a match. When a match is found,\
    \ the statements associated with that case statement get executed. This ability\
    \ to combine goroutines and channels is a powerful feature of the Go programming\
    \ language.\n\n![image](images/pg166_1.jpg)\n\nTo continuously listen for channel\
    \ messages, a `select` statement can be enclosed inside an infinite for loop.\
    \ The loop can be exited by including a case statement with an associated statement\
    \ that will break out of the loop to an outer label.\n\nThe Go standard library\
    \ `time` package provides a useful `After( ` function that can be used to create\
    \ a “timeout” to limit execution time of the listening loop. This requires a duration\
    \ period as its argument, and returns a channel of the `time.Time` type – that\
    \ will be the future time after the duration beyond the current time. Testing\
    \ for when the current time matches the timeout channel with a `case` statement\
    \ can be used to exit a listening loop.\n\n![image](images/1p.jpg)Begin by importing\
    \ the Go standard library `time` package, to wait for goroutines and to create\
    \ a timeout\n\n```go\nimport (\n    “fmt”\n    “time”\n)\n```\n\n![image](images/commonp.jpg)\n\
