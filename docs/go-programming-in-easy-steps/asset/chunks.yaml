  trans: "\n\n注意：`_` 空标识符用于忽略扫描到的返回项数量，并记住在将输入值赋值给接口变量时使用 `&` 地址运算符。\n\n![image](img/6g.jpg)将程序文件保存在“scan”目录中，然后运行程序来猜测随机生成的数字。\n\
    \n![image](img/pg145_1.jpg)\n\n## 缓冲区输入 (Buffer Input)\n\n当你想要在程序中收集较大的数据项时，将数据流存储在内存缓冲区中通常是更优的。Go\
    \ 标准库中的 `bufio`（带缓冲的输入/输出）程序包提供了一个 `Scanner` 类型，它是一个带有多个处理数据流的有用方法的内存缓冲区。你可以通过导入\
    \ `bufio` 包来在程序中使用它。\n\n![image](img/pg146_1.jpg)\n\n首先，通过向 `bufio` 包的 `NewScanner(\
    \ ` 函数传递一个用于读取数据的源作为参数，创建一个 `Scanner` 实例。当源是用户输入时，你可以导入 Go 标准库 `os` 包，并将 `os.Stdin`（标准输入）作为\
    \ `NewScanner( )` 的参数。\n\n`Scanner` 实例有一个 `Scan( )` 方法，用于读取所有用户输入，以及一个 `Text(\
    \ )` 方法，它将读取到的输入作为单个字符串值返回。\n\n`Scanner` 实例还有一个 `Err( )` 方法，它将返回任何读取错误。如果没有遇到错误，错误值将像往常一样为\
    \ `nil`。在调用 `Scan( )` 方法和 `Text( )` 方法后检查错误是有用的。\n\n如果你想将输入拆分为单个字符串项，可以导入 Go 标准库\
    \ `strings` 包，并将输入传递给它的 `Fields( )` 函数，将字符串拆分为单词。\n\n![image](img/1g.jpg)首先在程序中导入\
    \ Go 标准库 `bufio`、`os` 和 `strings` 包，以处理输入\n\n```go\nimport (\n\t\"fmt\"\n\t\"\
    bufio\"\n\t\"os\"\n\t\"strings\"\n)\n```\n\n![image](img/commong.jpg)\n\nsrc\\\
    buffer\\main.go\n\n![image](img/2g.jpg)接下来，请求用户输入\n\n```go\nfmt.Print( \"\\nEnter\
    \ Text:\" )\n```\n\n![image](img/3g.jpg)现在，创建一个 `Scanner` 实例将用户输入存储在内存缓冲区中，然后读取用户输入\n\
    \n```go\nscanner := bufio.NewScanner( os.Stdin )\nscanner.Scan( )\n```\n\n![image](img/4g.jpg)然后，如果发生错误则输出错误，否则输出存储的数据\n\
    \n```go\nif scanner.Err( ) != nil {\n\tfmt.Println( scanner.Err( ) )\n} else {\n\
    \tfmt.Println( scanner.Text( ) )\n}\n```\n\n![image](img/5g.jpg)接下来，创建一个新的 `Scanner`\
    \ 实例将其他用户输入存储在内存缓冲区中\n\n```go\nfmt.Print( \"\\nEnter Text:\" )\nscanner = bufio.NewScanner(\
    \ os.Stdin )\nscanner.Scan( )\n```\n\n![image](img/6g.jpg)然后，将用户输入的单个项存储在切片的各个元素中\n\
    \n```go\nwords := strings.Fields( scanner.Text( ) )\n```\n\n![image](img/7g.jpg)最后，如果发生错误则输出错误，或者列出用户输入的单个项\n\
    \n```go\nif scanner.Err( ) != nil {\n\tfmt.Println( scanner.Err( ) )\n} else {\n\
    \tfor i, v := range words {\n\t\tfmt.Printf( \"%v: %v \\n\", i, v )\n\t}\n}\n\
    ```\n\n![image](img/8g.jpg)将程序文件保存在“buffer”目录中，然后运行程序\n\n![image](img/pg145.jpg)\n\
    \n![image](img/hot.jpg) `Scan( )` 方法在遇到错误时返回 `true`，在遇到错误时返回 `false`。\n\n## 标志\
    \ (Flags)\n\n运行程序的命令可以接受参数。`os` 程序包提供的 `Args` 切片包含了这些参数。注意 `os.Args` 的第一个元素始终是程序的路径。你可以通过\
    \ `flag` 包来处理这些标志。\n\n`flag` 包提供了定义和解析命令行标志的工具。你可以使用 `flag.String`、`flag.Int`\
    \ 和 `flag.Bool` 等函数来定义标志。定义完成后，调用 `flag.Parse()` 来解析命令行。\n\n```go\npackage main\n\
    \nimport (\n\t\"flag\"\n\t\"fmt\"\n)\n\nfunc main() {\n\ttxt := flag.String(\"\
    txt\", \"C\", \"这是一个字符串\")\n\tnum := flag.Int(\"num\", 8, \"这是一个整数\")\n\tsta :=\
    \ flag.Bool(\"sta\", false, \"这是一个布尔值\")\n\n\tflag.Parse()\n\n\tfmt.Printf(\"\\\
    nText: %s\\n\", *txt)\n\tfmt.Printf(\"Number: %d\\n\", *num)\n\tfmt.Printf(\"\
    Status: %t\\n\", *sta)\n}\n```\n\n运行 `go run main.go -txt=Hello -num=10 -sta`\
    \ 将输出：\n\n```text\nText: Hello\nNumber: 10\nStatus: true\n```\n\n你也可以使用等价的形式，例如\
    \ `go run main.go -txt Hello -num 10 -sta`。\n\n`flag` 包还允许你定义标志的别名。例如，你可以定义 `txt`\
    \ 和 `t` 指向同一个变量。\n\n```go\npackage main\n\nimport (\n\t\"flag\"\n\t\"fmt\"\n)\n\
    \nfunc main() {\n\tvar txt string\n\tflag.StringVar(&txt, \"txt\", \"C\", \"这是一个字符串\"\
    )\n\tflag.StringVar(&txt, \"t\", \"C\", \"这是一个字符串的别名\")\n\n\tflag.Parse()\n\n\t\
    fmt.Printf(\"\\nText: %s\\n\", txt)\n}\n```\n\n运行 `go run main.go -txt=Hello`\
    \ 或 `go run main.go -t Hello` 都将输出：\n\n```text\nText: Hello\n```\n\n`flag` 包还允许你定义自定义类型的标志。通过实现\
    \ `flag.Value` 接口，你可以支持任何类型。\n\n```go\npackage main\n\nimport (\n\t\"flag\"\n\t\
    \"fmt\"\n\t\"strings\"\n)\n\ntype commaStringList []string\n\nfunc (c *commaStringList)\
    \ String() string {\n\treturn strings.Join(*c, \",\")\n}\n\nfunc (c *commaStringList)\
    \ Set(value string) error {\n\tslice := strings.Split(value, \",\")\n\t*c = append(*c,\
    \ slice...)\n\treturn nil\n}\n\nfunc main() {\n\tvar list commaStringList\n\t\
    flag.Var(&list, \"list\", \"一个逗号分隔的字符串列表\")\n\tflag.Parse()\n\n\tfmt.Printf(\"\
    List: %v\\n\", list)\n}\n```\n\n运行 `go run main.go -list=a,b,c -list=d` 将输出：\n\
    \n```text\nList: [a b c d]\n```\n\n"
