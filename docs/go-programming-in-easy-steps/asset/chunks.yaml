    \n| **Method** || **Returns** |\n\n| --- | --- |\n\n| **Clock( )** || Hour, minute,\
    \ and second within the day |\n\n| **Unix( )** || The number of seconds elapsed\
    \ since the epoch (January 1, 1970 00:00:00 UTC) |\n\n| **UnixNano( )** || The\
    \ number of nanoseconds elapsed since the epoch (January 1, 1970 00:00:00 UTC)\
    \ |\n\n![image](images/1b.jpg)Begin by importing the Go standard library time\
