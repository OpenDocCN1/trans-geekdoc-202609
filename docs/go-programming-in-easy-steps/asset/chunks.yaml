    \ move the bit values a specified number of bits in their direction.\n- The most\
    \ common use of bitwise operators is to manipulate a compact bit field containing\
    \ a set of flags.\n- Expressions containing multiple operators will perform their\
    \ operations in accordance with the default precedence level unless explicitly\
    \ forced by the addition of parentheses.\n\n## Control Flow\n\nThis chapter demonstrates\
    \ how statements can evaluate expressions to determine the direction in which\
    \ a Go program should proceed.\n\n- [Test a Condition](#chapter04.sec22)\n- [Switch\
    \ Cases](#chapter04.sec23)\n- [Loop Several Times](#chapter04.sec24)\n- [Loop\
    \ While True](#chapter04.sec25)\n- [Break Out of Loops](#chapter04.sec26)\n- [Go\
    \ to Labels](#chapter04.sec27)\n- [Summary](#chapter04.sec28)\n\n### Test a Condition\n\
    \n![image](images/pg48_1.jpg)\n\nThe `if` keyword is used to perform the basic\
    \ conditional test that evaluates a given expression for a boolean value of true\
    \ or false. Statements within `{ }` curly brackets following the evaluation will\
    \ only be executed when the expression’s condition is found to be true. The syntax\
    \ of an `if` test statement looks like this:\n\n```go\nif test-expression {\n\
    \    statements-to-execute-when-the-condition-is-true\n}\n```\n\nThere may be\
    \ multiple statements to be executed when the test is true but each statement\
    \ must be on its own line. Sometimes it may be desirable to evaluate multiple\
    \ expressions to determine whether following statements should be executed. This\
    \ can be achieved using the logical `&&` AND operator with this syntax:\n\n```go\n\
    if test-expression && test-expression {\n    statements-to-execute-when-all-conditions-are-true\n\
    }\n```\n\nAlternatively, multiple `if` statements can be “nested”, one inside\
    \ another, to evaluate multiple expressions, like this:\n\n```go\nif test-expression\
    \ {\n    if test-expression {\n        statements-to-execute-when-all-conditions-are-true\n\
    \    }\n}\n```\n\nWhen one or more expressions evaluated by an `if` test statement\
    \ are found to be false, the statements in its following curly brackets are not\
    \ executed and the program proceeds to subsequent code. It is often preferable\
    \ to extend an `if` statement by appending an `else` statement specifying statements\
    \ within curly brackets to be executed when the expressions evaluated by the `if`\
    \ statement are found to be false, with this syntax:\n\n```go\nif test-expression\
    \ {\n    statements-to-execute-when-the-condition-is-true\n} else {\n    statements-to-execute-when-the-condition-is-false\n\
    }\n```\n"
