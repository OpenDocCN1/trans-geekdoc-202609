- raw: 'It is very important to recognize that in Go programming, arguments are, by
    default, passed “by value” – the function receives a copy of the argument, not
    the original argument. This means that changes made to the parameter variables
    do not, by default, affect the original argument specified by the caller – they
    only affect the copy.


    ![image](images/1o.jpg)Create a function that requires a single integer argument
    and displays its value


    **func square( num int ) {**


    **fmt.Println( “\\t\\tReceived Copy:”, num )**


    **// Statements to be inserted here.**


    **}**


    ![image](images/commono.jpg)


    src\\args\\main.go


    ![image](images/2o.jpg)Next, insert statements to modify the received argument
    and display its new value


    **num = num \* num**


    **fmt.Println( “\\t\\tModified Copy:”, num )**


    ![image](images/3o.jpg)Begin a main function that declares and initializes a single
    variable, then displays its value


    **func main( ) {**


    **num := 5**


    **fmt.Println( “Original:”, num )**


    **// Statements to be inserted here.**


    **}**


    ![image](images/4o.jpg)Now, insert statements in the main function to call the
    other function and once more display its variable value


    **square( num )**


    **fmt.Println( “Original:”, num )**


    ![image](images/5o.jpg)Save the program file in an “args” directory, then run
    the program to see the original value is unchanged


    ![image](images/pg65_1.jpg)


    ![image](images/hot.jpg)


    You can also create “variadic functions” that accept any number of arguments –
    see [herepage 106](#chapter07.xhtml#sec51) for an example.


    **Pass References**


    The example [hereon page 65](#chapter05.xhtml#demonstrates) demonstrates that
    in Go programming arguments are, by default, passed “by value” – the function
    receives a copy of the argument, not the original argument. But quite often you
    may wish a function to modify the original argument. This can be achieved by passing
    an argument to the function that is a reference to the original, rather than a
    copy of its value.


    ![image](images/pg66_1.jpg)


    Remember that pointers are a reference to the memory address on your system where
    a value has been stored. This means that if you pass a pointer argument to a function,
    it will be able to modify the original value residing at the address provided
    by the pointer.


    When declaring a function that can receive pointer arguments, a data type specified
    in its parameter list must be prefixed by an \* asterisk, to indicate that this
    parameter will be a pointer, like this:


    **func *functionName* ( *paramName* \**type* ) {**


    ***statements-to-be-executed***


    **}**


    The parameter will then be able to store a location address.


    The function statements can access and modify a value at the address provided
    by the pointer, by prefixing the parameter name with an \* asterisk as a dereferencer.


    When calling a function that accepts a pointer argument, the argument must be
    prefixed with an & ampersand character to reference the memory address at which
    the value is stored.


    This technique can be used with the int, float64, string, and bool data types,
    and also with the struct type that will be introduced in the next chapter. These
    are all “value types”, so pointers are required to access the original values
    they contain when passing them to functions.


    This technique cannot be used with pointer or function types (yes, functions are
    types in Go) nor with the slice, map, or channel types that are demonstrated later
    in this book. These are all already “reference types”, so pointers are not required
    to access the original values they contain when passing them to functions.


    ![image](images/hot.jpg)


    Refer back [hereto pages 30-31](#chapter02.xhtml#sec13) for a refresher on how
    pointers work.


    ![image](images/1o.jpg)Create a function that requires a single integer pointer
    argument and displays its value


    **func square( num \*int ) {**


    **fmt.Println( “\\t\\tReceived Address:”, num )**


    **// Statements to be inserted here.**


    **}**


    ![image](images/commono.jpg)


    src\\refs\\main.go


    ![image](images/2o.jpg)Next, insert statements to modify the received argument
    and display its new value


    **\*num = \*num \* \*num**


    **fmt.Println( “\\t\\tModified Original:”, \*num )**


    ![image](images/3o.jpg)Begin a main function that declares and initializes a single
    variable, then displays its value


    **func main( ) {**


    **num := 5**


    **fmt.Println( “Original:”, num )**


    **// Statements to be inserted here.**


    **}**


    ![image](images/4o.jpg)Now, insert statements in the main function to call the
    other function and once more display its variable value


    **square( &num )**


    **fmt.Println( “Original:”, num )**


    ![image](images/5o.jpg)Save the program file in a “refs” directory, then run the
    program to see the original value is changed


    ![image](images/pg67_1.jpg)


    ![image](images/forget.jpg)


    Add the **&** ampersand prefix when passing a pointer argument in a function call
    if you need to pass in the memory address at which a value is stored.


    **Return Values**


    The functions described so far in this chapter simply resume the program flow
    at the next statement after the function call, but it is often useful to have
    a function return a value to the caller before continuing to execute subsequent
    statements.


    ![image](images/pg68_1.jpg)


    When declaring a function that will return a value, the function signature must
    define the data type of the return value after its parameter list. The value to
    be returned is specified, typically at the end of a function body, to the Go return
    keyword. The syntax of a function that will return a single value looks like this:


    func ***funcName* ( *paramName type* ) *returnType* {**


    ***statements-to-be-executed***


    **return *returnValue***


    **}**


    Unlike most other programming languages that can only return one value, functions
    in Go programming can return multiple values. When you want to return multiple
    values, the data type of each value must be specified as a comma-separated list
    in parentheses after the parameter list. The values to be returned are specified,
    typically at the end of a function body, to the Go return keyword. The syntax
    of a function that will return two values looks like this:


    func ***funcName* ( *paramName type* ) ( *returnType*, *returnType* ) {**


    ***statements-to-be-executed***


    return ***returnValue*, *returnValue***


    **}**


    The values specified to the return keyword must each be of the same type specified
    in the function signature, and they must be listed in the same order.


    If you call a function that returns multiple values but doesn’t use all the returned
    values in your subsequent program code, the compiler will produce a “declared
    but not used” message, and the program will not run. To avoid this, you can assign
    any unwanted returned values to an \_ underscore character. This is called a “blank
    identifier” in Go programming.


    ![image](images/hot.jpg)


    Many functions within the standard Go library return multiple values, especially
    to return both result and error values.


    ![image](images/1o.jpg)Create a function that requires a single integer argument
    and returns three values to the caller


    **func cube( num int ) ( string, int, int ) {**


    **return “Result”, num, ( num \* num \* num )**


    **}**


    ![image](images/commono.jpg)


    src\\returns\\main.go


    ![image](images/2o.jpg)Add a main function that assigns three returned values
    to three variables, then tries to display just two values


    **func main( ) {**


    **a, b, c := cube( 5 )**


    **fmt.Println( b, “Cubed =”, c )**


    **}**


    ![image](images/3o.jpg)Save the program file in a “returns” directory, then run
    the program to see a compiler error message


    ![image](images/pg69_1.jpg)


    ![image](images/4o.jpg)Modify the assignment in the main function to assign the
    first returned value to a blank identifier


    **func main( ) {**


    **\_, b, c := cube( 5 )**


    **fmt.Println( b, “Cubed =”, c )**


    **}**


    ![image](images/5o.jpg)Save the program file once more, then run the program to
    see two returned values printed in the output'
