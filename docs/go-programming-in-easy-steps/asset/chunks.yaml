    ![image](images/hot.jpg)


    Notice that the function instance **add** is simply described as being of the
    custom function type **main.adder**.


    **Handle Errors**


    It is important to anticipate errors in your Go programs and enable your code
    to handle them efficiently. Other programming languages, such as Java and Ruby,
    throw “exceptions” when an error is encountered, which the program can try to
    catch at runtime, but Go provides a simpler approach.


    ![image](images/pg76_1.jpg)


    Go programming allows you to handle errors that arise in functions by returning
    separate values. This makes it easy to identify which function is returning the
    error, and lets you handle the error using the familiar Go language constructs.


    To handle a possible error, the function signature must include a Go built-in
    error return type. Traditionally, this is the final return value in the list of
    return values.


    **func *funcName* ( *paramName type* ) ( *returnType*, error )**


    In place of the expected return value in the function body, the function can return
    a trivial value, such as \-1, together with the returned error value.


    If an error does not arise, the function can return the expected return value,
    together with a nil zero value. In Go programming, the nil zero value is used
    to represent a zero value for many types. Here, it simply indicates that that
    there was no error. The syntax of a function that handles errors might, therefore,
    look like this:


    **func *funcName* ( *paramName type* ) ( *returnType*, error ) {**


    **if *condition* != true {**


    **return -1 , *errorValue***


    ***}***


    **return *returnValue*, nil**


    **}**


    The “fmt” package that provides the fmt.Println( ) and fmt.Printf( ) functions,
    used in previous examples, also provides a fmt.Errorf( ) function that returns
    an error type. This accepts the same format specifiers as the fmt.Printf( ) function
    and can be used to return a message to identify the location and nature of an
    error.


    ![image](images/hot.jpg)


    The Go standard library also has an **errors** package that can be used to manipulate
    custom errors.


    ![image](images/1o.jpg)Create a function that requires an integer argument and
    will return an integer value and an error


    **func isPosInt( num int ) ( int, error ) {**


    **// Statements to be inserted here.**


    **}**


    ![image](images/commono.jpg)


    src\\err\\main.go


    ![image](images/2o.jpg)Next, insert a conditional test to return an error, or
    the argument value – depending on its value


    **if num < 1 {**


    **err := fmt.Errorf( “%v not a positive integer”, num )**


    **return \-1, err**


    **}**


    **return num, nil**


    ![image](images/3o.jpg)Now, add a main function that contains a decrementing loop
    to print out argument values or error messages


    **func main( ) {**


    **for i := 2 ; i >= \-2 ; i-- {**


    **res, err := isPosInt( i )**


    **if err != nil {**


    **fmt.Println( “Failed:”, err )**


    **} else {**


    **fmt.Println( res, “Passed!” )**


    **}**


    **}**


    **}**


    ![image](images/4o.jpg)Save the program file in an “err” directory, then run the
    program to see the error messages when the test fails


    ![image](images/pg77_1.jpg)


    ![image](images/forget.jpg)


    You will see the test **if err != nil** used in many Go programs as the standard
    way to begin an error handler.


    **Separate Files**


    As your programs increase in size it is often sensible to separate related sections
    of code into individual files. You can simply add a file in the same package directory
    as the main.go file and, providing it begins by declaring itself to belong to
    the same package (package main), any code in the added file will be treated as
    though it is contained in the main.go file.


    ![image](images/pg78_1.jpg)


    When creating utility functions that may be useful to many programs, it is more
    appropriate to store these in a file contained in a separate package that can
    be imported into any program.


    With imported custom packages it is important to recognize that only functions
    and variables whose name begins with a capital letter will be accessible from
    the importing file.


    To use a function in an imported file, the function name must be prefixed by the
    package name, just as with the fmt.Printf( ) function imported from the “fmt”
    package.


    The example [hereon page 77](#chapter05.xhtml#sec36) could, for instance, be separated
    into two packages so the validation function could be exported.


    ![image](images/1o.jpg)First, begin a verify.go utility file with package and
    import declarations


    **package verify**


    **import “fmt”**


    ![image](images/commono.jpg)


    src\\verify\\verify.go


    ![image](images/2o.jpg)Add the validation function – but change its name to begin
    with a capital letter


    **// IsPosInt tests for positive argument.**


    **func IsPosInt( num int ) ( int, error ) {**


    **if num < 1 {**


    **err := fmt.Errorf( “%v not a positive integer”, num )**


    **return \-1, err**


    **}**


    **return num, nil**


    **}**


    ![image](images/3o.jpg)Save the file in a “verify” directory inside your “src”
    folder


    ![image](images/4o.jpg)Enter the command go install verify to create a compiled
    archive file named “verify.a” within your go/pkg folder


    ![image](images/hot.jpg)


    Creating a Go archive package means that the utility file need not be recompiled
    each time an importing file is compiled.


    ![image](images/5o.jpg)Next, begin a main.go program with package and import declarations


    **package main**


    **import (**


    **“fmt”**


    **“verify”**


    **)**


    ![image](images/commono.jpg)


    src\\prog\\main.go


    ![image](images/6o.jpg)Now, add the main function, prefixing the amended imported
    function name by its package name


    **func main( ) {**


    **for i := 2 ; i >= \-2 ; i-- {**


    **res, err := verify.IsPosInt( i )**


    **if err != nil {**


    **fmt.Println( “Failed:”, err )**


    **} else {**


    **fmt.Println( res, “Passed!” )**


    **}**


    **}**


    **}**'
