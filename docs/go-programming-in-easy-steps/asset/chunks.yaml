    check for errors and display the text content


    **txt, err := ioutil.ReadFile( “C:/Textfiles/Oscar.txt” )**


    **check( err )**


    **fmt.Println( string( txt ) )**


    ![image](images/4g.jpg)Next, open the same text file, then check for errors and
    remember to close the file after other operations complete


    **file, err := os.Open( “C:/Textfiles/Oscar.txt” )**


    **check( err )**


