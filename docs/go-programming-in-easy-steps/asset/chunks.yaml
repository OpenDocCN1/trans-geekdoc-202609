- raw: "This is a fundamental programming technique that offers the program two directions\
    \ in which to proceed, depending on the result of the evaluation, and is known\
    \ as “conditional branching”.\n\n![image](images/snake.jpg)\n\nThe test expression\
    \ and opening **{** curly bracket must appear on the same line as the **if** keyword.\n\
    \n![image](images/snake.jpg)\n\nThe **else** keyword and opening **{** curly bracket\
    \ must appear on the same line as the **}** closing curly bracket of the previous\
    \ block of statements.\n\n![image](images/1p.jpg)Begin a main function with a\
    \ statement that tests whether two characters are matching\n\n**func main( ) {**\n\
    \n**if ‘A’ == ‘A’ {**\n\n**fmt.Println( “\\\\nCharacters Match” )**\n\n**}**\n\
    \n**// Statements to be inserted here.**\n\n**}**\n\n![image](images/commonp.jpg)\n\
    \nsrc\\\\ifelse\\\\main.go\n\n![image](images/2p.jpg)Next, in the main function,\
    \ insert nested statements to test two numerical expressions\n\n**if 5 > 1 {**\n\
    \n**if 7 > 2 {**\n\n**fmt.Println( “\\\\nBoth expressions are true” )**\n\n**}**\n\
    \n**}**\n\n![image](images/3p.jpg)Now, insert statements to test a numerical expression\
    \ and to test whether two characters are not matching\n\n**if 5 < 1 {**\n\n**fmt.Println(\
    \ “\\\\n1st Condition is true” )**\n\n**} else if ‘A’ != ‘A’ {**\n\n**fmt.Println(\
    \ “\\\\n2nd Condition is true” )**\n\n**} else {**\n\n**fmt.Println( “\\\\nBoth\
    \ Conditions are false” )**\n\n**}**\n\n![image](images/4p.jpg)Save the program\
    \ file in an “ifelse” directory, then run the program to see the results of the\
    \ conditional tests\n\n![image](images/pg49_1.jpg)\n\n![image](images/forget.jpg)\n\
    \nTo avoid repetition, the code listed in the steps from this point on now assumes\
    \ you have declared **package main** and **import “fmt”** at the start of each\
    \ program.\n\n![image](images/hot.jpg)\n\nNotice that you can use **else if**\
    \ to evaluate a second expression if the first test is **false**.\n\n**Switch\
    \ Cases**\n\nConditional branching performed by multiple if else statements can\
    \ often be performed more efficiently by a switch statement when the test expression\
    \ just evaluates a single condition.\n\n![image](images/pg50_1.jpg)\n\nThe switch\
    \ statement works in an unusual way. It takes a given value as its parameter argument\
    \ then seeks to match that value from a number of case statements. Code to be\
    \ executed when a match is found is included in each case statement.\n\nIt is\
    \ important that each statement to be executed must appear on its own line, starting\
    \ on the line below the case statement.\n\nOptionally, the list of case statements\
    \ can be followed by a single final default statement to specify code to be executed\
    \ in the event that no matches are found within any of the case statements. So\
    \ the syntax of a switch statement typically looks like this:\n\n**switch *test-value*\
    \ {**\n\n**case *match-value* :**\n\n***statements-to-execute-when-matched***\n\
    \n**case *match-value* :**\n\n***statements-to-execute-when-matched***\n\n**case\
    \ *match-value* :**\n\n***statements-to-execute-when-matched***\n\n**default :**\n\
    \n***statements-to-execute-when-no-match-found***\n\n**}**\n\nWhere a number of\
    \ match-values are to each execute the same statements, only the final case statement\
    \ need include the statements to be executed. For example, to output the same\
    \ message for match-values of 0, 1, and 2:\n\n**switch num {**\n\n**case 0 : \
    \ \n\ncase 1 :  \n\ncase 2 :**\n\n**fmt.Println( “Less than 3” )**\n\n**case 3\
    \ :**\n\n**fmt.Println( “Exactly 3” )**\n\n**default :**\n\n**fmt.Println( “Greater\
    \ Than 3 or Less Than 0” )**\n\n**}**\n\n![image](images/forget.jpg)\n\nA **default**\
    \ statement need not appear at the end of the **switch** block but it is logical\
    \ to place it there.\n\n![image](images/hot.jpg)\n\nWhen a match is found, the\
    \ **switch** normally ends, but you can add the **fallthrough** keyword as a final\
    \ statement in any **case** block to continue to the next **case** statement –\
    \ although this is seldom useful.\n\n![image](images/1p.jpg)Begin a main function\
    \ with a statement that declares and initializes two variables\n\n**func main(\
    \ ) {**\n\n**num := 2  \n\nchar := ‘B’**\n\n**// Statements to be inserted here.**\n\
    \n**}**\n\n![image](images/commonp.jpg)\n\nsrc\\\\switch\\\\main.go\n\n![image](images/2p.jpg)Next,\
    \ in the main function, insert a statement that tries to match a numerical value\n\
    \n**switch num {**\n\n**case 1 :**\n\n**fmt.Println( “\\\\nNumber is One” )**\n\
    \n**case 2 :**\n\n**fmt.Println( “\\\\nNumber is Two” )**\n\n**case 3 :**\n\n\
    **fmt.Println( “\\\\nNumber is Three” )**\n\n**default :**\n\n**fmt.Println( “\\\
    \\nNumber is Unrecognized” )**\n\n**}**\n\n![image](images/3p.jpg)Now, insert\
    \ a statement that tries to match a character\n\n**switch char {**\n\n**case ‘A’\
    \ :**\n\n**fmt.Println( “\\\\nLetter is A” )**\n\n**case ‘B’ :**\n\n**fmt.Println(\
    \ “\\\\nLetter is B” )**\n\n**default :**\n\n**fmt.Printf( “\\\\nLetter is Unrecognized”\
    \ )**\n\n**}**\n\n![image](images/4p.jpg)Save the program file in a “switch” directory,\
    \ then run the program to see the results of the conditional tests\n\n![image](images/pg51_1.jpg)\n\
    \n![image](images/hot.jpg)\n\nYou can also omit the test value after the **switch**\
    \ keyword in a “tagless switch”. This is the equivalent of **switch true –** to\
    \ seek a case that evaluates as **true**.\n\n**Loop Several Times**\n\nA loop\
    \ is a piece of code in a program that automatically repeats. One complete execution\
    \ of all statements within a loop is called an “iteration”, or a “pass”. The length\
    \ of a loop is controlled by a conditional test made within the loop. While the\
    \ tested expression is found to be true, the loop will continue – until the tested\
    \ expression is found to be false, at which point the loop ends.\n\n![image](images/pg52_1.jpg)\n\
    \nIn Go programming, there are several ways to construct a loop but they all use\
    \ the for keyword. The most common type of loop statement begins with three components\
    \ – an initializer, a single test expression, and an incrementer, with this syntax:\n\
    \n**for *initializer* ; *test-expression* ; *incrementer* {**\n\n***statements-to-be-executed***\n\
    \n**}**\n\nThe initializer is used to set a starting value for a counter of the\
    \ number of iterations to be made by the loop. An integer variable is used for\
    \ this purpose and is traditionally named “i”.\n\nUpon each iteration of the loop,\
    \ the test-expression is evaluated, and that iteration will only continue while\
    \ this expression is true. When the test-expression becomes false, the loop ends\
    \ immediately without executing the statements again. With every iteration the\
    \ counter is incremented then the statements executed.\n\nLoops can be nested,\
    \ one within another, to allow complete execution of all iterations of an inner\
    \ nested loop on each iteration of the outer loop. A second integer variable is\
    \ used to count the iterations of the inner loop, and is traditionally named “j”.\
    \ Should that inner loop also contain a nested loop, its counter is traditionally\
    \ named “k”, and the syntax looks like this:\n\n**for *initializer* ; *test-expression*\
    \ ; *incrementer* {**\n\n***statements-to-be-executed***\n\n**for *initializer*\
    \ ; *test-expression* ; *incrementer* {**\n\n***statements-to-be-executed***\n\
    \n**for *initializer* ; *test-expression* ; *incrementer* {**\n\n***statements-to-be-executed***\n\
    \n**}**\n\n**}**\n\n**}**\n\n![image](images/hot.jpg)\n\nNesting loops beyond\
    \ three levels is uncommon and is probably best avoided.\n\n![image](images/1p.jpg)Begin\
    \ a main function with a loop that performs five iterations\n\n**func main( )\
    \ {**\n\n**for counter := 1 ; counter <= 5 ; counter++ {**\n\n**fmt.Println( “Loop\
    \ Iteration“, counter )**\n\n**}**\n\n**// Statements to be inserted here.**\n\
    \n**}**\n\n![image](images/commonp.jpg)\n\nsrc\\\\forloop\\\\main.go\n\n![image](images/2p.jpg)Next,\
    \ insert a loop that performs three iterations\n\n**for i := 1 ; i <= 3 ; i++\
    \ {**\n\n**fmt.Println( “\\\\nOuter Loop Iteration“, i )**\n\n**// Inner Loop\
    \ to be inserted here.**\n\n**}**\n\n![image](images/3p.jpg)Now, insert an inner\
    \ loop that performs three iterations\n\n**for j := 1 ; j <= 3 ; j++ {**\n\n**fmt.Println(\
    \ “\\\\tInner Loop Iteration“, j )**\n\n**}**\n\n![image](images/4p.jpg)Save the\
    \ program file in a “forloop” directory, then run the program to see the output\
    \ on each loop iteration"
