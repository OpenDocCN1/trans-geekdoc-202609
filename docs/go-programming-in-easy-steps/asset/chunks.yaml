    \ to a variable name.\n- A function can be attached to a struct by adding a receiver,\
    \ which specifies the struct name to the function.\n- A function attached to a\
    \ struct is referred to as a method.\n- A method can be a value receiver, operating\
    \ on a copy of the struct, or a pointer receiver operating on the original fields.\n\
    - A struct can represent attributes and behaviors of real-world objects by its\
