  fmt: "\nMethod signatures may also specify a parameter list and multiple return\
    \ types.\n\n## Summary\n\n- Multiple related items of data can be grouped together\
    \ in a Go `struct` type.\n- The `{ }` curly brackets of a struct contain a list\
    \ of name and type pairs that are fields defining what the struct will contain.\n\
    - An instance of a struct can be created as a variable declared with the name\
    \ of the struct as its type.\n- An individual field of a struct can be initialized\
    \ by assigning a value to the instance name and dot-suffixed field name.\n- An\
