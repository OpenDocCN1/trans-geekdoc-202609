    \ then run the program to see the original value is changed\n\n![image](images/pg67_1.jpg)\n\
    \n![image](images/forget.jpg)\n\nAdd the `&` ampersand prefix when passing a pointer\
    \ argument in a function call if you need to pass in the memory address at which\
    \ a value is stored.\n\n## Return Values\n\nThe functions described so far in\
    \ this chapter simply return a value, but it is often useful to have a function\
    \ return multiple values.\n\n![image](images/68.jpg)\n\nWhen declaring a function\
    \ that will return a value, the function signature must define the data type of\
    \ the return value. The syntax of a function that will return a single value looks\
    \ like this:\n\n```go\nfunc funcName( paramName type ) returnType {\n    // ...\n\
    \    return\n}\n```\n\nUnlike most other languages that can only return one value,\
    \ functions in Go can return multiple values. When you want to return multiple\
