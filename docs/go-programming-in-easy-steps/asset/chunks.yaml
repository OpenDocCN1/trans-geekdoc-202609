    \ `TZ` time zone abbreviation, such as “EST” (Eastern Standard Time) or “EDT”\
    \ (Eastern Daylight Time), and a numerical value representing the seconds offset\
    \ of that time zone from UTC. It is important to note that time zone abbreviations\
    \ are not unique, so you should not rely solely upon these to recognize particular\
