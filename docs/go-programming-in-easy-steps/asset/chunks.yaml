    \ listening to local port 8000.\n\n```go\nfunc main() {\n\t// Statements to be\
    \ inserted here.\n\tfmt.Println(\"Starting web server on port 8000\")\n\thttp.ListenAndServe(\"\
    :8000\", nil)\n}\n```\n\n![image](images/3o.jpg)Save the program file in a “server”\
    \ directory, then run the program to start the web server.\n\n![image](images/hot.jpg)\n\
    \nLocal system addresses are referenced via the loopback network http interface\
    \ using the hostname `localhost`. This normally resolves to the IP address `127.0.0.1`.\n\
    \n![image](images/pg175_1.jpg)\n\n![image](images/4o.jpg)If a firewall security\
    \ warning appears, confirm that you wish to allow access for the web server.\n\
    \n![image](images/pg175_2.jpg)\n\n![image](images/5o.jpg)Now, launch a web browser\
    \ and visit `localhost:8000` to see the web server reply with a default message.\n\
    \n![image](images/pg175_3.jpg)\n\n![image](images/forget.jpg)\n\nYou can hit `Ctrl`\
    \ + `C` to terminate a running program.\n\n![image](images/hot.jpg)\n\nThe web\
    \ server does not yet know how to respond, but this chapter will develop the program\
    \ to enable responses.\n\n## Handle a Request\n\nIn order for a Go web server\
    \ to handle incoming requests, the program needs to register “route handlers”\
    \ that specify how to respond to particular requests.\n\n![image](images/pg176_1.jpg)\n\
    \nThe `net/http` package provides an `http.HandleFunc()` function that will register\
    \ a route handler. This function requires two arguments to specify a string pattern\
    \ describing the path to listen for, and the name of the function that will be\
    \ called to provide a response when the specified path is recognized. The string\
    \ pattern will begin with a `/` forward slash character – for example, `/hello`.\
    \ This specifies that the web server should listen for incoming requests in our\
    \ example from `localhost:8000/hello`.\n"
  trans: "\n\n![image](img/pg170_1.jpg)\n\n工作池允许你从多个并发调用向 goroutine 发送任务，该 goroutine\
    \ 会根据 Go 调度器确定的随机顺序完成每个任务。你可以使用 `WaitGroup` 等待多个 goroutine 完成，或者简单地将任务结果发送到空——以排空通道并确保所有工作\
    \ goroutine 均已完成。\n\n![image](img/pg170_2.jpg)\n\n![image](img/1p.jpg)首先导入 Go\
    \ 标准库 `time` 包，以便对工作 goroutine 函数进行延迟处理。\n\n```go\nimport (\n\t\"fmt\"\n\t\"time\"\
    \n)\n```\n\n![image](img/commonp.jpg)\n\nsrc\\workers\\main.go\n\n接下来，在 `main`\
    \ 函数中，初始化一个任务总数变量，并创建两个容量为总数的缓冲通道。\n\n```go\nnumJobs := 10\njobs := make( chan\
    \ int, numJobs )\nresults := make( chan int, numJobs )\n```\n\n![image](img/3p.jpg)现在，添加三个工作\
    \ goroutine 调用，每个调用传递一个 ID 数字和两个通道。\n\n```go\ngo worker( 1, jobs, results )\n\
    go worker( 2, jobs, results )\ngo worker( 3, jobs, results )\n```\n\n![image](img/4p.jpg)为\
    \ 10 个任务中的每个任务发送一个整数，然后关闭该通道以表示队列中所有任务已完毕。\n\n```go\nfor i := 1 ; i <= numJobs\
    \ ; i++ {\n\tjobs <- i\n}\nclose( jobs )\n```\n\n![image](img/5p.jpg)在 main 函数之后，添加被用的工作函数，该函数接受工作\
    \ ID 数字、一个用于接收任务号的只读通道，以及一个用于发送 10 个结果的只写通道。\n\n```go\nfunc worker( id int, jobs\
    \ <-chan int, results chan<- int ) {\n\tfor job := range jobs {\n\t\tfmt.Print(\
    \ “Worker “, id, “ ran Job “, job )\n\t\tfmt.Printf( “ …%v x %v = %v \\n”, job,\
    \ job, job*job )\n\t\ttime.Sleep( 1 * time.Second )\n\t\tresults <- job\n\t}\n\
    }\n```\n\n![image](img/6p.jpg)现在，回到 main 函数，添加一个循环来收集结果并确保所有工作已完成。\n\n```go\n\
    for i := 1 ; i <= numJobs ; i++ {\n\t<- results\n}\nclose( results )\n```\n\n\
    ![image](img/7p.jpg)将程序文件保存在“workers”目录中，然后运行程序查看工作池的运行。\n\n![image](img/pg171_1.jpg)\n\
    \n![image](img/hot.jpg)\n\n此示例中的 1 秒延迟仅仅模拟了执行更耗时任务所需的时间。\n\n![image](img/hot.jpg)\n\
    \n“工作池”也被称为“线程池”。它们不需要为每个任务创建一个新线程，因此可以更好的性能。\n\n### 总结\n\n- 并行是同时执行两个任务。\n- 并发是将程序代码拆分成可以同时执行的独立任务。\n\
    - Goroutine 提供了并发执行代码行的能力。\n- 通过在普通函数调用之前插入 `go` 关键字来创建 goroutine。\n- Go 标准库 `sync`\
    \ 包提供了 `WaitGroup` 类型，可以等待多个 goroutine 完成。\n- `WaitGroup` 具有一个 `Add()` 增方法、一个\
    \ `Done()` 减方法和一个 `Wait()` 方法。\n- 当将 `WaitGroup` 作为参数传递给函数时，必须作为指针传递。\n- Go 通道像一根管道，程序可以通过它发送和接收消息。\n\
    - 使用 `make()` 函数创建通道。\n- `close()` 函数可以关闭通道。\n- `select` 语句可以处理多个通道操作。\n- `<-`\
    \ 运算符用于从通道接收消息。\n\n"
