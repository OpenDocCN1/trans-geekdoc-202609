- raw: '![image](images/pg170_1.jpg)


    A worker pool lets you send tasks from multiple concurrent calls to a goroutine
    that completes each task in a random order determined by the Go scheduler. You
    can use a WaitGroup to wait for the multiple goroutines to complete, or simply
    send the task results to nothing – to drain the channel and ensure that all worker
    goroutines have finished.


    ![image](images/pg170_2.jpg)


    ![image](images/1p.jpg)Begin by importing the Go standard library **time** package,
    to delay a worker goroutine function


    **import (**


    **“fmt”**


    **“time”**


    **)**


    ![image](images/commonp.jpg)


    src\\workers\\main.go


    ![image](images/2p.jpg)Next, in the main function, initialize a jobs total number
    variable, and create two buffered channels of the total size


    **numJobs := 10**


    **jobs := make( chan int, numJobs )**


    **results := make( chan int, numJobs )**


    ![image](images/3p.jpg)Now, add three worker goroutine calls that each pass an
    ID number and the two channels


    **go worker( 1, jobs, results )**


    **go worker( 2, jobs, results )**


    **go worker( 3, jobs, results )**


    ![image](images/4p.jpg)Send an integer for each of 10 jobs, then close that channel
    to indicate that is all the jobs in the queue


    **for i := 1 ; i <= numJobs ; i++ {**


    **jobs <- i**


    **}**


    **close( jobs )**


    ![image](images/5p.jpg)After the main function, add the called worker function
    that accepts the worker ID number, has a send-only channel from which to receive
    the job numbers, and a receive-only channel to which it will send 10 results


    **func worker( id int, jobs <-chan int, results chan<- int ) {**


    **for job := range jobs {**


    **fmt.Print( “Worker “, id, “ ran Job “, job )**


    **fmt.Printf( “ …%v x %v = %v \\n”, job, job, job\*job )**


    **time.Sleep( 1 \* time.Second )**


    **results <- job**


    **}**


    **}**


    ![image](images/6p.jpg)Now, back in the main function, add a loop to collect the
    results and ensure that all the workers have completed


    **for i := 1 ; i <= numJobs ; i++ {**


    **<- results**


    **}**


    **close( results )**


    ![image](images/7p.jpg)Save the program file in a “workers” directory, then run
    the program to see the worker pool results


    ![image](images/pg171_1.jpg)


    ![image](images/hot.jpg)


    The 1-second delay in this example merely simulates the time taken to perform
    a more lengthy task.


    ![image](images/hot.jpg)


    “Worker Pools” are also known as “Thread Pools”. They can result in better performance
    as they don’t need to create a new thread for each task.


    **Summary**


    •Parallelism is when two tasks are performed simultaneously.


    •Concurrency is the separation of program code into separate tasks that could
    potentially be performed simultaneously.


    •Goroutines provide the ability for lines of code to be executed concurrently.


    •A goroutine is created by inserting the go keyword before an ordinary function
    call or method call.


    •The Go standard library sync package provides a WaitGroup type that can wait
    for multiple goroutines to finish.


    •A WaitGroup has an Add( ) incrementing method, a Done( ) decrementing method,
    and a Wait( ) blocking method.


    •When passing a WaitGroup as an argument to a function, it must be passed as a
    pointer.


    •A Go channel is like a pipe through which the program can send and receive messages.


    •A channel is created by specifying the chan keyword and a data type as arguments
    to the built-in make( ) function.


    •Deadlock is a fatal error where the program cannot proceed.


    •The built-in close( ) function can explicitly close a channel.


    •Adding a buffer size argument to the make( ) function enables multiple items
    to be sent as a queue to a channel.


    •A select statement block can be used to simultaneously listen for messages from
    multiple channels.


    •Enclosing a select statement block within an infinite for loop allows a program
    to continuously listen for channel messages.


    •Channels can connect goroutines in a pipeline that sends and receives messages
    to synchronize the goroutines.


    •The <- arrow operator can be used in function parameters to specify whether channels
    may only send or only receive.


    •A worker pool can send tasks from multiple concurrent calls to a goroutine for
    completion in a random order set.


    12


    Request Responses


    ***This chapter demonstrates how to create a web server and how to process submitted
    form data using the Go standard library net/http and io packages.***


    [**Listen for Requests**](#chapter12.xhtml#sec85)


    [**Handle a Request**](#chapter12.xhtml#sec86)


    [**Add Files to Serve**](#chapter12.xhtml#sec87)


    [**Deliver a Static Page**](#chapter12.xhtml#sec88)


    [**Log Received Data**](#chapter12.xhtml#sec89)


    [**Deliver a Dynamic Response**](#chapter12.xhtml#sec90)


    [**Summary**](#chapter12.xhtml#sec91)


    Listen for Requests


    The Go standard library net package contains an http package that provides utilities
    that make it easy to create a web server. These utilities can be made available
    to your program by importing the net/http package.


    ![image](images/pg174_1.jpg)


    The http.ListenAndServe( ) function enables the program to start a web server
    running. It requires two arguments to specify a TCP network address string and
    a request handler. The address string specifies a port number to which the web
    server should listen for incoming requests. The port number must be prefixed by
    a : colon character within the string – for example, “:8000” to listen for incoming
    requests on local port 8000. The default handler is typically used by specifying
    a nil second argument.


    The http.ListenAndServe( ) function always returns a non-nil error, and blocks
    forever. This means that lines of code below the call to this function will never
    be executed. The web server will continue to listen for incoming requests until
    the program gets terminated.


    ![image](images/1o.jpg)Begin by importing the Go standard library net/http package
    into a program


    **import (**


    **“fmt”**


    **“net/http”**


    **)**


    ![image](images/commono.jpg)


    src\\server\\main.go


    ![image](images/2o.jpg)Next, add a main function that will output a startup message
    and start a web server listening to local port 8000 on your system


    **func main( ) {**


    **// Statements to be inserted here later.**


    **fmt.Println( “Starting web server on port 8000” )**


    **http.ListenAndServe( “:8000”, nil )**


    **}**


    ![image](images/3o.jpg)Save the program file in a “server” directory, then run
    the program to start the web server


    ![image](images/hot.jpg)


    Local system addresses are referenced via the loopback network http interface
    using the hostname **localhost**. This normally resolves to the IP address **127.0.0.1**.


    ![image](images/pg175_1.jpg)


    ![image](images/4o.jpg)If a firewall security warning appears, confirm that you
    wish to allow access for the web server


    ![image](images/pg175_2.jpg)


    ![image](images/5o.jpg)Now, launch a web browser and visit localhost:8000 to see
    the web server reply with a default message


    ![image](images/pg175_3.jpg)


    ![image](images/forget.jpg)


    You can hit **Ctrl** + **C** to terminate a running program.


    ![image](images/hot.jpg)


    The web server does not yet know how to respond, but this chapter will develop
    the program to enable responses.


    **Handle a Request**


    In order for a Go web server to handle incoming requests, the program needs to
    register “route handlers” that specify how to respond to particular requests.


    ![image](images/pg176_1.jpg)


    The net/http package provides an http.HandleFunc( ) function that will register
    a route handler. This function requires two arguments to specify a string pattern
    describing the path to listen for, and the name of the function that will be called
    to provide a response when the specified path is recognized. The string pattern
    will begin with a / forward slash character – for example, “/hello”. This specifies
    that the web server should listen for incoming requests in our example from localhost:8000/hello.'
