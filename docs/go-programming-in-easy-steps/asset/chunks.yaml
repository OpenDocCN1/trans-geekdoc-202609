    \n| **Second( )** || Second number of the minute (0-59) |\n\n| **Nanosecond( )**\
    \ || Nanosecond of the second (0-999999999) |\n\nUnlike other programming languages,\
    \ the time package in Go does not provide a method to return a millisecond value\
    \ from a Time data type. You can, however, divide the nanosecond value by one\
    \ million to produce its millisecond equivalent.\n\nThere are also these three\
