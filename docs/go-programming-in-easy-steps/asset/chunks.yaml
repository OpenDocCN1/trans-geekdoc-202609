- raw: "You can ascertain the time zone associated with a Time data type by calling\
    \ its Zone( ) method. This method returns two values, which are a three-letter\
    \ TZ time zone abbreviation, such as “EST” (Eastern Standard Time) or “EDT” (Eastern\
    \ Daylight Time), and a numerical value representing the seconds offset of that\
    \ time zone from UTC. It is important to note that time zone abbreviations are\
    \ not unique, so you should not rely solely upon these to recognize particular\
    \ time zones. Some time zones change their time for Daylight Saving, so you might\
    \ evaluate both the TZ abbreviation and offset to correctly recognize the time\
    \ zone.\n\n![image](images/hot.jpg)\n\nA list of IANA location names and TZ abbreviations\
    \ is included with this book’s download files – see [herepage 6](#fm.xhtml#sec101).\n\
    \n![image](images/hot.jpg)\n\nDaylight Saving in the USA reduces the offset from\
    \ UTC by one hour. For example, Eastern Daylight Time (EDT) is UTC - 4 hours,\
    \ Central Daylight Time (CDT) is UTC - 5 hours, etc.\n\n![image](images/1b.jpg)Begin\
    \ by importing the Go standard library time package into a program\n\n**import\
    \ (**\n\n**“fmt”  \n\n“time”**\n\n**)**\n\n![image](images/commons.jpg)\n\nsrc\\\
    \\zone\\\\main.go\n\n![image](images/2b.jpg)Next, create and initialize variables\
    \ with a default string value and a Time data type in a specified location\n\n\
    **zone := “All”**\n\n**loc, \\_ := time.LoadLocation( “America/New\\_York” )**\n\
    \n**dt := time.Now( ).In( loc )**\n\n![image](images/3b.jpg)Ascertain the time\
    \ zone abbreviation and offset seconds, then convert the offset to a positive\
    \ minute number\n\n**abbr, offset := dt.Zone( )**\n\n**if offset < 1 {**\n\n**offset\
    \ = offset \\* \\-1**\n\n**}**\n\n**offset /= 60**\n\n![image](images/4b.jpg)Now,\
    \ evaluate the abbreviation and offset values\n\n**switch {**\n\n**case abbr ==\
    \ “EST” && offset == 300 :**\n\n**zone = “East Coast”**\n\n**case abbr == “EDT”\
    \ && offset == 240 :**\n\n**zone = “East Coast”**\n\n**}**\n\n![image](images/5b.jpg)Display\
    \ the time zone details and an appropriate message\n\n**fmt.Printf( “\\\\nTZ:\
    \ %v Offset Minutes: %v \\\\n”, abbr, offset )  \n\nfmt.Println( “Welcome to”,\
    \ zone, “Visitors!” )**\n\n![image](images/6b.jpg)Save the program file in a “zone”\
    \ directory, then run the program to see the time zone values\n\n![image](images/pg121_1.jpg)\n\
    \n![image](images/forget.jpg)\n\nA \\_ blank identifier is used here to ignore\
    \ the returned error value due to space constraints, but you should ideally include\
    \ an error-handler.\n\n**Delay Time**\n\nThe Go standard library time package\
    \ provides a Sleep( ) function that allows you to delay progress of a program\
    \ by a specified duration period. The duration is supplied as an argument to the\
    \ Sleep( ) function, and can be expressed as a multiplication of a time package\
    \ constant. For example, 5 \\* time.Second expresses a duration of five seconds.\n\
    \n![image](images/pg122_1.jpg)\n\nThe Go standard library time package also provides\
    \ three methods that compare an instance of the Time data type with another time\
    \ specified as their argument. These methods will each return a boolean true or\
    \ false value according to the result of the time comparison:\n\n| **Method**\
    \ || **Returns** |\n\n| --- | --- |\n\n| **Before(** *time* **)** || A boolean\
    \ **true** value if the instance time is earlier than its argument time |\n\n\
    | **After(** *time* **)** || A boolean **true** value if the instance time is\
    \ later than its argument time |\n\n| **Equal(** *time* **)** || A boolean **true**\
    \ value if the instance time and argument time represent the same instant – even\
    \ in different time zones |\n\nIf you would like to see the difference between\
    \ two instances of the Time data type, you can use a Sub( ) method of a time instance\
    \ to specify another time instance as its argument. This method will return the\
    \ elapsed duration between the two instants as an int64 data type value of nanosecond\
    \ precision.\n\nIt is often preferable to present duration periods with less than\
    \ nanosecond precision, so the Go standard library time package includes a Round(\
    \ ) method to specify more concise precision. This method requires one argument\
    \ to determine your preferred rounding behavior. Typically, the argument is supplied\
    \ as one of the time package constants. For example, calling the method with Round(\
    \ time.Millisecond ) will round a nanosecond precision duration to the nearest\
    \ millisecond, Round( time.Second ) will round a nanosecond precision duration\
    \ to the nearest second, and so on.\n\n![image](images/1b.jpg)Begin by importing\
    \ the Go standard library time package into a program\n\n**import (**\n\n**“fmt”\
    \  \n\n“time”**\n\n**)**\n\n![image](images/commons.jpg)\n\nsrc\\\\delay\\\\main.go\n\
    \n![image](images/2b.jpg)Next, create and display components of a Time data type\n\
    \n**start := time.Now( )**\n\n**fmt.Println( “\\\\nStarted At:”, start.Format(\
    \ “03:04:05” ) )**\n\n![image](images/3b.jpg)Now, delay the program’s progress\
    \ for five seconds\n\n**time.Sleep( 5 \\* time.Second )**\n\n![image](images/4b.jpg)Then,\
    \ create and display a second Time data type\n\n**finish := time.Now( )**\n\n\
