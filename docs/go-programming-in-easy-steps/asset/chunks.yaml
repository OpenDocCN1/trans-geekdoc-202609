- raw: 'Unite Strings


    ![image](images/pg126_1.jpg)


    In Go programming, a string is zero or more characters enclosed within double
    quote marks. So, these are all valid string values:


    **s1 := “My First String”**


    **s2 := “”**


    **s3 := “2”**


    **s4 = “nil”**


    The empty quotes of s2 initialize the variable as an empty string value. The numeric
    value assigned to s3 is a string representation of the number. The Go nil zero
    value, which normally represents the absence of any value, is simply a string
    literal when it is enclosed within quotes.


    Essentially, a string is a collection of characters; each character containing
    its own data – just like elements in a defined array. It is, therefore, logical
    to regard a string as an array of characters and apply array characteristics when
    dealing with string values. The built-in len( ) function will return the number
    of characters in a string, much like it returns the number of elements in an array.


    The + operator, which can be used to add numeric values, doubles as a concatenation
    operator for joining string values together to create a single united string.


    The Go standard library strings package contains useful functions for string manipulation.
    Its Join( ) function joins (concatenates) all elements of a string array to create
    a single united string. This function requires two arguments to specify the name
    of a string array and a separator value to be placed between each string element
    in the united string. Typically, you will specify a single space as the separator
    to create a space-separated united string.


    The fmt.Printf( ) and fmt.Println( ) functions that write to standard output can
    add spaces and newline characters to output, but do not change the actual strings.
    They do, however, both return two values, which are the number of bytes written
    and any write error. If no error is encountered, the error value will be nil as
    usual. With the English language, the number of bytes written will normally represent
    the number of characters output – including non-printing characters contained
    within the string.


    ![image](images/hot.jpg)


    The ASCII code number for a non-printing **\\t** tab character is 9, and for a
    non-printing **\\n** newline character is 10.


