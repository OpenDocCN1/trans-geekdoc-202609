    \n![image](images/6b.jpg)Finally, display the length of the delay\n\n**diff :=\
    \ finish.Sub( start )**\n\n**fmt.Println( “\\\\nTime Elapsed:”, diff.Round( time.Second\
    \ ) )**\n\n![image](images/7b.jpg)Save the program file in a “delay” directory,\
    \ then run the program to see the time delay\n\n![image](images/pg123_1.jpg)\n\
    \n![image](images/hot.jpg)\n\nThe ability to delay execution is particularly useful\
    \ in pausing individual “goroutines” – see the example [hereon page 159](#chapter11.xhtml#package)\
    \ for more details.\n\n**Summary**\n\n•The Go standard library time package contains\
    \ functions to create Time data types comprising date, time, and zone fields.\n\
    \n•A Time data type is not a string, but can be converted to a string using its\
    \ String( ) method.\n\n•The time.Now( ) function returns the current date, time,\
    \ and zone from the system time at the current locale.\n\n•Date components can\
    \ be extracted from a Time data type using its Year( ), Month( ), Day( ), and\
    \ Weekday( ) methods.\n\n•The Date( ), ISOWeek( ), and YearDay( ) methods return\
    \ date values that can usefully be assigned to variables.\n\n•Time components\
    \ can be extracted from a Time data type using Hour( ), Minute( ), Second( ),\
    \ and Nanosecond( ) methods.\n\n•The Clock( ), Unix( ), and UnixNano( ) methods\
    \ return time values that can usefully be assigned to variables.\n\n•The Format(\
    \ ) method takes a layout string or predefined constant as its argument to format\
    \ dates and times.\n\n•The Go reference string for date/time layouts is Mon Jan\
    \ 2 15:04:05 2006 MST\n\n•The time.Date( ) function is used to create a Time data\
    \ type and requires arguments to specify year, month, day, hour, minute, second,\
    \ nanosecond, and location.\n\n•The time package contains predefined constants\
    \ for month names, hour, minute, second, millisecond, and location.\n\n•The AddDate(\
    \ ) method can modify date components and the Add( ) method can modify time components.\n\
    \n•The time.LoadLocation( ) function requires an IANA location name argument,\
    \ and the In( ) function applies a location.\n\n•The time.Sleep( ) function delays\
    \ execution of a program by the duration specified as its argument.\n\n•The Sub(\
    \ ) method returns elapsed duration between two times, and the Round( ) method\
    \ can specify its precision.\n\n9\n\nManage Data\n\n***This chapter demonstrates\
