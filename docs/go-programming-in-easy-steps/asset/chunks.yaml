- raw: 'Unlike some other programming languages, Go does not have classes, but can
    represent objects using structs instead.


    ![image](images/1bl.jpg)Start a program by creating a struct type


    **type car struct {**


    **color string**


    **body string**


    **}**


    ![image](images/commonb.jpg)


    src\\method\\main.go


    ![image](images/2bl.jpg)Next, attach a method to the struct type


    **func ( c car ) accelerate( ) string {**


    **return “accelerating-->”**


    **}**


    ![image](images/3bl.jpg)Now, begin the main function by creating two instances
    of the struct type


    **porsche := car{ color: “blue”, body: “coupe” }**


    **bentley := car{ color: “green”, body: “saloon” }**


    ![image](images/4bl.jpg)Add statements to display all values of the first instance


    **fmt.Println( “Porsche paint is”, porsche.color )**


    **fmt.Println( “Porsche style is”, porsche.body )**


    **fmt.Println( “Porsche is”, porsche.accelerate( ) )**


    ![image](images/5bl.jpg)Finally, add statements to display all values of the second
    instance


    **fmt.Println( “Bentley paint is”, bentley.color )**


    **fmt.Println( “Bentley style is”, bentley.body )**


    **fmt.Println( “Bentley is”, bentley.accelerate( ) )**


    ![image](images/6bl.jpg)Save the program file in a “method” directory, then run
    the program to see the struct field values


    ![image](images/pg85_1.jpg)


    ![image](images/hot.jpg)


    When you call a method, Go automatically handles the conversion between values
    and pointers, so the receiver here could be ( c \*car ) if you wanted the method
    to be able to modify the original struct fields.


    **Embed Structs**


    As a struct field is declared simply with a name and type, and a struct is a type,
    Go programming even allows you to embed one struct within another by declaring
    a field to be of a struct type.


    ![image](images/pg86_1.jpg)


    type ***structName* struct{**


    ***fieldName embeddedStructName***


    **}**


    This is useful to build structures that efficiently use structs whose purpose
    can be varied. For example, take a struct that simply stores X and Y coordinates:


    **type coords struct {**


    **x, y int**


    **}**


    This might be used to store a location on a chart, the corner point of a rectangle,
    etc., or perhaps the center point in a circle when embedded in another struct,
    like this:


    **type circle struct {**


    **radius int**


    **center coords**


    **}**


    Now, when an instance of the circle is created, the fields of the embedded struct
    can be addressed by chaining together the struct names and field names, like this:


    ***instanceName*.*embeddedStructName*.*fieldName***


    ***instanceName*.*embeddedStructName*.*fieldName***


    This is acceptable, but not very convenient as it’s quite lengthy. Fortunately,
    Go provides a solution to this problem by supporting “anonymous fields” in structs.
    These are simply fields that specify the name of another struct as a field, without
    stating a field name:


    **type circle struct {**


    **radius int**


    **coords**


    **}**


    The advantage of this is that it allows you to shorten the code required to address
    the fields of an embedded struct:


    ***instanceName*.*fieldName***


    ***instanceName*.*fieldName***


    ![image](images/forget.jpg)


    An anonymous field must be of a named type, or be a pointer to a named type.


    ![image](images/1bl.jpg)Start a program by creating two struct types


    **type coords struct {**


    **x, y int**


    **}**


    **type circle struct {**


    **radius int**


    **coords**


    **}**


    ![image](images/commonb.jpg)


    src\\embed\\main.go


    ![image](images/2bl.jpg)Next, attach a method to the second struct


    **func ( c circle ) getDiameter( ) int {**


    **return c.radius \* 2**


    **}**


    ![image](images/3bl.jpg)Now, begin the main function by creating an instance of
    the struct type


    **var ring circle**


    ![image](images/4bl.jpg)Add statements to assign values to the struct field and
    embedded struct fields


    **ring.radius = 15**


    **ring.x = ring.radius**


    **ring.y = ring.radius**


    ![image](images/5bl.jpg)Finally, add statements to display values


    **fmt.Printf( “Diameter:%v \\n”, ring.getDiameter( ) )**


    **fmt.Printf( “Point X:%v Y:%v \\n”, ring.x, ring.y )**


    ![image](images/6bl.jpg)Save the program file in an “embed” directory, then run
    the program to see the struct field values


    ![image](images/pg87_1.jpg)


    **Encapsulate Features**


    The ability to represent objects in Go programs is the first cornerstone principle
    in Object Oriented Programming (OOP). An object-oriented program uses methods
    to express the properties and operations of the data structure to which it is
    attached, so the program need not access the object directly.


    ![image](images/pg88_1.jpg)


    A variable, function, or method, that is not directly accessible to the program
    is said to be “encapsulated”. Encapsulation, inheritance, and polymorphism are
    the three building-blocks of object-oriented programming.


    Encapsulation in Go programming relies upon data-hiding in packages that are imported
    into a program. Only variable names, function names, and method names that begin
    with a capital letter will be exported to the program. Those that begin with a
    lowercase letter will be inaccessible – i.e. they are encapsulated.


    ![image](images/1bl.jpg)First, begin a cube.go utility file with a package declaration
    and a struct definition


    **package cube**


    **// Dims exportable.**


    **type Dims struct {**


    **width, length, height int**


    **}**


    ![image](images/commonb.jpg)


    src\\cube\\cube.go


    ![image](images/2bl.jpg)Next, add four functions to operate on the struct fields


    **func ( d \*Dims ) area( ) int {**


    **return d.width \* d.length**


    **}**


    **// SetSize exportable.**


    **func ( d \*Dims ) SetSize( w, l, h int ) {**


    **d.width = w**


    **d.length = l**


    **d.height = h**


    **}**


    **// GetVolume exportable.**


    **func ( d \*Dims ) GetVolume( ) int {**


    **return d.width \* d.length \* d.height**


    **}**


    **// GetArea exportable.**


    **func ( d \*Dims ) GetArea( ) int {**


    **return d.area( )**


    **}**


    ![image](images/hot.jpg)


    See that fields of the same data type can be declared as a comma-separated list,
    as with variable declarations.


    ![image](images/3bl.jpg)Save the utility file in a “cube” directory, then begin
    a main file that imports the utility file


    **package main**


    **import (**


    **“cube”**


    **“fmt”**


    **)**


    ![image](images/commonb.jpg)


    src\\encap\\main.go


    ![image](images/4bl.jpg)Next, begin the main function by creating an instance
    of the imported struct type


    **var box cube.Dims**


    ![image](images/5bl.jpg)Now, call an imported method to assign values to the struct
    fields


    **box.SetSize( 2, 4, 6 )**


    ![image](images/6bl.jpg)Then, call the other two imported methods to calculate
    results using the assigned field values


    **fmt.Println( “Footprint:”, box.GetArea( ) )**


    **fmt.Println( “Volume:”, box.GetVolume( ) )**


    ![image](images/7bl.jpg)Save the program file in an “encap” directory, then run
    the program to see the results from encapsulated values


    ![image](images/pg89_1.jpg)


    ![image](images/8bl.jpg)Add these statements to the main function, which attempt
    to reference an unexported field and method


    **fmt.Println( “Width:”, box.width )**


    **fmt.Println( “Area:”, box.getArea( ) )**


    ![image](images/9bl.jpg)Save the program file once more, then run the program
    to see compilation fail with box.width undefined and box.getArea undefined error
    messages


    ![image](images/forget.jpg)


    You must prefix the imported struct with its package name. The instance could
    also be created by assigning an (empty) struct literal as **box := cube.Dims{
    }**.


    **Compose Elements**


    The second cornerstone of object-oriented programming is that of inheritance,
    in which an object derived from another object will inherit the features of the
    base object. This code reuse is made possible in Go programming by “composition”.
    This is simply the technique of embedding one struct inside another to instantly
    provide various elements to the second struct. For example, a “dog” struct might
    embed a base “animal” struct whose fields and attached methods become instantly
    available to the “dog” struct.'
