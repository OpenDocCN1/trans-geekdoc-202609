    \n•The value stored in a map element can be referenced by stating the associated\
    \ key in \\[ \\] square brackets.\n\n8\n\nHarness Time\n\n***This chapter demonstrates\
    \ how to manipulate dates and time using the Go standard library time package.***\n\
