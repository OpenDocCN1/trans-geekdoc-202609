    ## 2 存储值


    本章演示了如何在 Go 程序中使用变量容器来存储、检索和操作各种类型的数据。


    - 创建程序变量

    - 显示变量值

    - 转换数据类型

    - 固定常量值

    - 指向存储的值

    - 总结


    ## 创建程序变量


    ![image](img/pg22_1.jpg)


    变量是 Go 程序中的一种容器，可以在计算机内存中存储一个数据值。存储的值可以通过变量名进行引用，并通过赋值新值来更改。程序员可以为变量选择任何名称，只要它符合下列表列出的命名规范规则：


    | 命名规则 | 示例 |

    | --- | --- |

    | 不能是 Go 关键字 | `default` |

    | 不能包含算术运算符 | `a+b` |

    | 不能包含标点字符 | `%$#!` |

    | 不能包含空格 | `no` |

    | 必须以字母开头 | `msg` |

    | 可以包含数字 | `good1` |

    | 可以混合大小写 | `camelCase` |


    变量名应该简洁并始终以小字母开头。使用有意义的名称是良好的习惯。创建变量使用 `var` 关键字。


    ```

    var msg string

    msg = "Hi there!"

    var msg string = "Hi there!"

    ```


    此外，可以使用 `:=` 操作声明并初始化变量。在这种情况下，不需要 `var` 关键字或类型，Go 编译器会根据赋值的数据类型推断类型。这只能在函数体内部使用。


    ```go

    msg := "Hi there!"

    ```


    Go 的基本类型有：


    | 数据类型 | 描述 | 示例 |

    | --- | --- | --- |

    | string | 字符串 | `"Hi there!"` |

    | int | 整数 | `100` |

    | float64 | 浮点数 | `0.123456` |

    | byte | 字符 | `''A''` |

    | bool | 布尔值 | `true` |


    必须 Go 是一种静态类型语言，这意味着变量只能包含其声明中指定类型的数据。


    ## 显示变量值


    ![image](img/pg24_1.jpg)


    可以使用第一章中显示“Hello World!”消息的 `fmt.Println()` 函数来显示变量的值。或者，可以使用合适的“格式占位符”和变量名为 `fmt.Printf()`
    函数指定显示变量值的格式：


    | 占位符 | 描述 | 示例 |

    | --- | --- | --- |

    | %s | 字符串 | `"Go Fun!"` |

    | %d | 整数 | `100` |

    | %f | 浮点数 | `0.123456` |

    | %c | 字符 | `''A''` |

    | %t | 布尔值 | `true` |

    | %p | 机器内存地址 | `0x0022FF34` |

    | %v | 默认格式的值 | 以上任意一项 |


