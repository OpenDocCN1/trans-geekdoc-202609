    func helloHandler(w http.ResponseWriter, r *http.Request) {\n    io.WriteString(w,\
    \ \"Response from the helloHandler!\\n\")\n    io.WriteString(w, \"URL.Path =\
    \ \" + r.URL.Path)\n}\n```\n\n![image](img/4o.jpg)将更新后的程序文件保存到“server”目录，然后运行程序启动\
    \ Web 服务器\n\n![image](img/pg177_1.jpg)\n\n![image](img/5o.jpg)如果出现防火墙安全警告，请确认你希望允许\
    \ Web 服务器的访问\n\n![image](img/6o.jpg)启动 Web 浏览器并访问 localhost:8000/hello，查看 Web\
    \ 服务器对此请求的响应\n\n![image](img/pg177_2.jpg)\n\n## 添加用于提供的文件\n\n既然已经确定服务器程序可以如此处第\
    \ 177 页的示例所示响应请求，就可以向程序中添加文件，服务器可以在响应请求时交付这些文件。\n\n![image](img/pg178_1.jpg)\n\
    \nWeb 服务器文件通常包含在一个名为 `htdocs`（超文本文档）或类似名称的根目录下。这通常包含 HTML 文件，可能可能还有一个 `favicon.ico`\
    \ 图像，用于在浏览器的标题栏中标识网站。根目录通常还包含子目录以对关联文件分组——例如 `img` 文件夹中的图像、`css` 文件夹中的样式表等。\n\n\
    在我们的服务器示例中，两个 HTML 文档被添加到根 `htdocs` 目录中，并带有一个 `favicon.ico` 图像。单个样式表位于 `htdocs/css`\
    \ 目录，几张图像包含在 `htdocs/img` 目录中。整个服务器程序树如下所示：\n\n![image](img/pg178_2.jpg)\n\n![image](img/pg178_3.jpg)\
    \ `favicon.ico` (32px x 32px)\n\n![image](img/pg178_4.jpg) `power.png` (100px\
    \ x 25px)\n\n几张图像（`favicon.ico` (32px x 32px) 和 `power.png` (100px x 25px)）位于\
    \ `img` 目录。`favicon.ico` 用于标识网站，`power.png` 是用于封面。样式表 `style.css` 包含了用于网页外观的规则，如下：\n\
    \n| | | { |\n| --- | { | | | |\n| --- | --- |\n| img | { float: left; |\n| ---\
    \ | --- |\n| p | { text-align: center; |\n| img | { width: 320px; |\n| --- | ---\
    \ | |\n| p | { font-size: 1.5em; |\n\n![image](img/pg179_1.jpg) `style.css`\n\n\
    名为 `index.html` 的 HTML 文档显示了 Web 服务器：\n\n```html\n<!DOCTYPE html>\n<html lang=\"\
    en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <title>Index</title>\n    <link\
    \ rel=\"icon\" href=\"favicon.ico\">\n</head>\n<body>\n    <h1>Static Page</h1>\n\
    </body>\n```\n\n![image](img/pg179_2.jpg) `index.html`\n\n名为 `form.html` 的 HTML\
    \ 文档允许用户提交数据：\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta\
    \ charset=\"UTF-8\">\n    <title>Form</title>\n    <link rel=\"icon\" href=\"\
    favicon.ico\">\n</head>\n<body>\n    <fieldset>\n        <legend>Lookup</legend>\n\
    \        <form action=\"lookup\" method=\"POST\">\n            <label>Language</label>\n\
    \            <input name=\"Language\" type=\"text\">\n            <input type=\"\
    submit\" value=\"Submit\">\n        </form>\n    </fieldset>\n</body>\n</html>\n\
    ```\n\n![image](img/pg180_1.jpg) `form.html`\n\nGo 标准库 `net/http` 包提供了函数，可以使 Web\
    \ 服务器轻松响应 HTTP 请求。根目录的路径首先作为 `Dir()` 函数的参数。这返回一个作为 `FileServer()` 函数参数的 `Dir`\
    \ 类型。最后，使用 `Handle()` 函数来注册处理器。它需要一个模式和处理器名称。通常使用 `/` 作为第一个参数——以匹配所有路径。\n\n![image](img/pg180_2.jpg)\n\
    \n在 `main` 函数的开头，插入一条语句来指定要提供的文件根目录\n\n```go\ndir := http.Dir(\"C:/Users/mike_/go/server/htdocs\"\
    )\n```\n\n![image](img/commono.jpg)\n\nsrc\\server\\main.go\n\n![image](img/2o.jpg)接下来，为该文件系统创建一个处理器\n\
    \n```go\nfileServer := http.FileServer(dir)\n```\n\n![image](img/3o.jpg)现在，为所有\
    \ HTTP 请求注册处理器\n\n```go\nhttp.Handle(\"/\", fileServer)\n```\n\n![image](img/4o.jpg)保存更新后的程序文件，然后启动\
    \ Web 服务器并访问 localhost:8000/index.html（或直接访问 localhost:8000）查看静态索引 页\n\n## 记录接收的数据\n\
    \n成功交付静态索引 页后，程序现在可以提供一个表单页面用于提交数据。\n\n![image](img/pg181_1.jpg)\n\n`http.Request`\
    \ 对象有一个 `ParseForm()` 方法，它可以填充 `http.Request.Form` 对象以包含提交的表单输入值。可以通过指定表单输入名称作为\
    \ `http.Request.FormValue()` 方法的参数来获取提交的值。\n\n还有一个 `http.Request.Method` 对象，包含了赋值给表单\
    \ HTML method 属性的值。`POST` 方法被用于提交表单数据。\n\n如果表单提交无法解析，或者表单使用了错误的提交方法，可以通过 `http.Error()`\
    \ 函数向浏览器发送错误消息。这需要三个参数来指定 `http.ResponseWriter` 名称、错误字符串消息以及 HTTP 状态码——例如 400（错误请求）或\
    \ 405（方法不允许）。\n\n"
