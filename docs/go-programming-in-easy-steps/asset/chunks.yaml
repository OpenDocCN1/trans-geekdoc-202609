    **arr := \[ \]string { “\\n\\tStrive”, “For”, “Greatness!” }**


    **ast := strings.Join( arr, “ “ )**


    ![image](images/5r.jpg)Now, output the joined string and first two characters


    **fmt.Println( ast )**


    **if ast\[ 0 \] \== 10 && ast\[ 1 \] \== 9 {**


