- raw: '•**Add( )** – Increments the WaitGroup counter by the number specified as
    its argument. For each new goroutine added to the program, the counter should
    be increased by one.


    •**Done( )** – Decrements the WaitGroup counter by one automatically, so no argument
    is required. The counter should by decreased by one when each goroutine completes.


    •**Wait( )** – Blocks the program until the WaitGroup counter reaches zero, so
    no argument is required. When the final running goroutine decrements the counter
    to zero, blocking is automatically removed.


    When passing a WaitGroup as an argument to a function, it must be passed as a
    pointer. This means that the argument will specify its memory address, using the
    & address-of operator, and the function parameter will denote it as a pointer
    using the \* prefix operator. The receiving function can then call the Done( )
    method of the WaitGroup using the pointer argument.


    The Add( ) method should be called to increment the WaitGroup counter before the
    statement that actually creates the goroutine.


    Optionally, the Add( ) method argument can specify the total number of goroutines
    in a collection, rather than incrementing each added goroutine to the WaitGroup
    counter individually.


    You can reuse a WaitGroup to control execution of a subsequent collection of goroutines,
    but you can only call the Add( ) method for these after the Wait( ) method for
    the previous collection has reached zero.


    ![image](images/forget.jpg)


    The order in which goroutines get executed is controlled by the Go scheduler,
    and can vary each time the program runs.


    ![image](images/1p.jpg)Begin by importing the Go standard library sync and time
    packages, to wait for goroutines and to allow a delay


    **import (**


    **“fmt”**


    **“sync”**


    **“time”**


    **)**


    ![image](images/commonp.jpg)


    src\\waitgroup\\main.go


    ![image](images/2p.jpg)Next, in the main function, create a WaitGroup instance


    **var wg sync.WaitGroup**


    ![image](images/3p.jpg)Now, add a loop to increment the counter and pass the address
    of the WaitGroup as a function argument


    **for i := 1 ; i <= 3 ; i++ {**


    **wg.Add( 1 )**


    **go report ( i, &wg )**


    **}**


    ![image](images/4p.jpg)Finally, in the main function, block until the WaitGroup
    counter reaches zero


    **wg.Wait( )**


    ![image](images/5p.jpg)Now, add a function to confirm the start and end of each
    goroutine, then notify the WaitGroup to stop waiting


    **func report( i int, wg \*sync.WaitGroup) {**


    **fmt.Printf( “\\nGoroutine %v Started”, i )**


    **time.Sleep( 1 \* time.Second )**


    **fmt.Printf( “\\n\\t\\t\\tGoroutine %v Ended”, i )**


    **wg.Done( )**


    **}**


