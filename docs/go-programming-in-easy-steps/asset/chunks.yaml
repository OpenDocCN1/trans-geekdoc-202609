  trans: "\n提交的表单值可以使用 Go 标准库 `strings` 包进行格式化，以修剪空格并更改大小写。然后可以将这些值写入使用 Go `os` 包中的\
    \ `OpenFile()` ` 函数创建的日志文件中。Go 标准库 `log` 包提供了一个 `SetOutput()` ` 函数用于指定要写入的日志文件，以及一个\
    \ `Print()` 函数用于指定要写入日志文件的内容。这可以方便地为记录的每个项目添加写入时的日期和时间前缀。\n\n![image](img/1o.jpg)\n\
    \n首先，在之前的程序中添加指令以导入 Go 标准库 `strings`、`os` 和 `log` 包的指令：\n\n```go\nimport (\n \
    \   \"fmt\"\n    \"io\"\n    \"log\"\n    \"net/http\"\n    \"os\"\n    \"strings\"\
    \n)\n```\n\n![image](img/commono.jpg)\n\nsrc\\server\\main.go\n\n![image](img/2o.jpg)\n\
    \n接下来，在 `main` 函数中，注册一个带有路由参数的表单处理器，该参数将识别分配给表单 HTML `action` 属性的名称\n\n```go\n\
    http.HandleFunc(\"/lookup\", formHandler)\n```\n\n![image](img/hot.jpg)\n\nGo\
    \ 为每个 HTTP 状态码提供了常量，例如带有 `http.StatusOk` 的 200。请查看 [golang.org/pkg/net/http](http://golang.org/pkg/net/http)\
    \ 档获取完整的代码列表。\n\n![image](img/3o.jpg)\n\n在 `main` 函数之后，从表单处理器开始，进行验证以检查提交方法为\n\
    \n```go\n{\n    if r.Method != \"POST\" {\n        http.Error(w, \"Method Not\
    \ Allowed\", 405)\n        return\n    }\n    // 在此处插入语句。\n}\n```\n\n![image](img/commono.jpg)\n\
    \nsrc\\server\\main.go\n\n![image](img/4o.jpg)\n\n接下来，在表单处理器中，插入语句解析表单数据或向浏览器返回错误消息\n\
    \n```go\nerr := r.ParseForm()\nif err != nil {\n    http.Error(w, \"Bad Request\"\
    , 400)\n    return\n}\n```\n\n![image](img/5o.jpg)\n\n现在，在表单处理器中，插入语句通过删除空格和更改大小写来格式化提交的值\n\
    \n```go\nlang := r.FormValue(\"Language\")\nlang = strings.ToLower(strings.Trim(lang,\
    \ \" \"))\n```\n\n![image](img/6o.jpg)\n\n然后，在表单处理器中，插入语句将格式化后的值写入日志文件\n\n```go\n\
    file, err := os.OpenFile(\"htdocs/data.log\", os.O_CREATE|os.O_APPEND|os.O_WRONLY,\
    \ 0644)\nif err != nil {\n    log.Print(err)\n}\ndefer file.Close()\nlog.SetOutput(file)\n\
    log.Print(lang)\n```\n\n![image](img/7o.jpg)\n\n保存更新后的程序文件，然后启动 Web 服务器并访问 localhost:8000/form.html\
    \ 查看表单出现\n\n![image](img/8o.jpg)\n\n在输入字段中输入编程语言名称，然后点击 Submit 按钮提交表单数据\n\n![image](img/hot.jpg)\n\
    \n最常用的请求方法是 `GET` 和 `POST`。`GET` 方法将数据附加到 URL 字符串。`POST` 方法在请求体中携带数据，因此更安全，并且是从浏览器向服务器传输数据时的首选方法。\n\
    \n![image](img/pg183_1.jpg)\n\n现在，点击浏览器的 `Back` 按钮并重复提交过程以发送多个请求——每个请求对应不同的语言\n\
    \n![image](img/pg183_2.jpg)\n\n![image](img/pg183_3.jpg)\n\n然后，访问 localhost:8000/data.log\
    \ 在日志文件中查看每个提交的表单值\n\n![image](img/pg183_4.jpg)\n\n![image](img/pg183_5.jpg)\n\
    \ndata.log\n\n![image](img/hot.jpg)\n\n为了简单，此示例仅提交了一个项目，通过请求对象的 `FormValue()`\
    \ 方法和 HTML `name` 属性值进行引用。对于提交多个项目的表单，你可以使用 `range` 关键字遍历它们，以引用每个项目的键（HTML `name`\
    \ 属性）和值（HTML `value` 属性）。\n\n### 动态响应\n\n在接收并记录了请求数据后，根据第 182-3 页，程序现在可以评估请求并向\
    \ 浏览器发送适当的响应。\n\n![image](img/1o.jpg)\n\n在表单处理器的日志语句之后，初始化两个带有默认响应值的变量\n\n```go\n\
    title := \"<a href='http://www.ineasysteps.com'>See titles online</a>\"\nisbn\
    \ := \"...\"\n```\n\n![image](img/commono.jpg)\n\nsrc\\server\\main.go\n\n![image](img/2o.jpg)\n\
    \n接下来，检查请求值\n\n```go\nswitch lang {\ncase \"c\":\n    title = \"C\"\ncase \"go\"\
    :\n    title = \"Go\"\ncase \"java\":\n    title = \"Java\"\ncase \"python\":\n\
    \    title = \"Python\"\ncase \"sql\":\n    title = \"SQL\"\n}\n```\n\n![image](img/3o.jpg)\n\
    \n现在，构建一个包含响应 的 HTML 字符串\n\n```go\nresponse := \"<!DOCTYPE><title>\" + title +\
    \ \"</title>\"\nresponse += \"<link rel='shortcut' href='favicon.ico'>\"\nresponse\
    \ += \"<link rel='stylesheet' href='style.css'>\"\nresponse += \"<p>ISBN:\"\n\
    if isbn != \"logo\" {\n    response += \"<br><img src='\" + lang + \".png' alt='Power'>\"\
    \n}\nresponse += \"</p>\"\n```\n\n![image](img/hot.jpg)\n\n注意在字符串内部使用了单引号，以避免过早结束字符串。\n\
    \n![image](img/4o.jpg)\n\n最后，使用 `写入` 语句发送响应\n\n```go\nio.WriteString(w, response)\n\
    ```\n\n![image](img/pg183_1.jpg)\n\n![image](img/5o.jpg)\n\n再次保存程序文件并启动 Web 服务器，然后访问\
    \ localhost:8000/form.html 发送请求并接收\n\n![image](img/pg183_2.jpg)\n\n![image](img/pg183_3.jpg)\n\
    \n![image](img/pg183_4.jpg)\n\n![image](img/pg183_5.jpg)\n\n![image](img/hot.jpg)\n\
    \n你可以在该系列中发现更多编程语言书籍，包括关于 R 语言的《R for Data Analysis》，访问 [www.ineasysteps.com](http://www.ineasysteps.com)\n\
    \n### 总结\n\n- `net/http` 标准提供了创建 Web 服务器的工具。\n- `http.ListenAndServe()` 函数指定监听的地址以及请求处理器的名称。\n\
    - Web 服务器程序必须注册处理器来响应特定的请求。\n- `http.HandleFunc()` ` 函数指定要监听的路由以及处理该请求的函数名称。\n\
    - 请求处理函数的签名始终包含 `http.ResponseWriter` 对象和 `http.Request` 对象。\n- `http.ResponseWriter`\
    \ 对象有一个 `Write()` 方法，可以接收 `[]byte` 切片以发送响应。\n- `io` 包提供了 `WriteString()` 函数，可以将字符串传递给\
    \ `http.ResponseWriter` 对象用于响应。\n- 文件可以添加到 Web 服务器程序中，响应浏览器的请求进行交付。\n- `http.Dir()`\
    \ 函数指定根文件路径。\n- `http.FileServer()` 函数返回一个针对所指定文件系统的处理器。\n- `http.Handle()` 函数指定路由以及针对所指定文件系统的请求的处理器名称。\n\
    - `http.Request.ParseForm()` 方法用 `http.Request.Form` 对象填充提交的表单数据。\n- `http.Request.Method`\
    \ 对象包含分配给 HTML 表单 `method` 属性的值。\n- `http.Error()` ` 函数可以使用 `http.ResponseWriter`\
    \ 对象向浏览器发送错误消息和状态码。\n- Go 标准库 `log` 包有 `SetOutput()` 和 `Print()` 函数，用于将带时间戳的项目写入日志文件。\n\
    - Web 服务器程序可以构建 HTML 字符串向 Web 浏览器发送动态响应。\n"
