  trans: "\n\n## 处理错误\n\n在你的 Go 程序中，预判错误并使代码能够高效地处理这些错误是非常关重要的。其他编程语言（如 Java 和 Ruby）在遇到错误时会抛出“异常（exceptions）”，程序可以在运行时尝试捕获这些异常，但\
    \ Go 了一种了一种更简单的方法。\n\n![image](img/pg76_1.jpg)\n\nGo 编程允许你通过返回多个值来处理函数中出现的错误。这使得识别哪个函数返回了错误变得简单，并允许你使用熟悉的\
    \ Go 语言结构来处理错误。\n\n为了处理可能的错误，函数签名必须包含一个 Go 内置的 `error` 返回类型。传统上，这是返回值列表中的最后一个返回值。\n\
    \n```go\nfunc *funcName* (*paramName type*) ( *returnType*, error )\n```\n\n在函数体中，除了预期的返回值，函数可以返回一个平凡的值（例如\
    \ -1），连同返回的错误值。\n\n如果没有发生错误，函数可以返回预期的返回值，以及一个 `nil` 零值。在 Go 编程中，`nil` 零值被用于表示许多类型的零值。在这里，它仅表示没有错误。因此，处理错误的函数语法可能如下所示：\n\
    \n```go\nfunc *funcName* (*paramName type*) ( *returnType*, error ) {\n    if\
    \ *condition* != true {\n        return -1 , *errorValue*\n    }\n    return *returnValue*,\
    \ nil\n}\n```\n\n提供之前示例中使用的 `fmt.Println()` 和 `fmt.Printf()` 函数的 `fmt` 包还提供了一个\
    \ `fmt.Errorf()` 函数，它返回一个 `error` 类型。它接受与 `fmt.Printf()` 函数相同的格式化符，并用于返回一条消息以识别错误的发生位置和性质。\n\
    \n![image](img/hot.jpg)\n\nGo 标准库还有一个 `errors` 包，可以用于操作自定义错误。\n\n![image](img/1o.jpg)创建一个需要整数参数并返回整数和错误的函数\n\
    \n```go\nfunc isPosInt( num int ) ( int, error ) {\n    // 在此处插入语句。\n}\n```\n\n\
    ![image](img/commono.jpg)\n\nsrc\\err\\main.go\n\n![image](img/2o.jpg)接下来，插入一个条件语句来返回错误或者返回整数值\n\
    \n```go\nif num < 1 {\n    err := fmt.Errorf( “%v not positive integer”, num )\n\
    \    return -1, err\n}\nreturn num, nil\n```\n\n![image](img/3o.jpg)现在，添加一个 main\
    \ 函数，包含递减循环来打印结果\n\n```go\nfunc main( ) {\n    for i := 2 ; i >= -2 ; i-- {\n\
    \        res, err := isPosInt( i )\n        if err != nil {\n            fmt.Println(\
    \ “Failed:”, err )\n        } else {\n            fmt.Println( res, “Passed!”\
    \ )\n        }\n    }\n}\n```\n\n![image](img/4o.jpg)将程序文件保存在“err”目录中，然后运行程序以查看当测试失败时的错误消息\n\
    \n![image](img/pg75_1.jpg)\n\n![image](img/forget.jpg)\n\n注意，函数签名在声明中只需说明所需的类型，但其定义也需要说明参数名称。\n\
    \n![image](img/hot.jpg)\n\n注意函数实例 `add` 仅被描述为属于自定义函数类型 `main.adder`。\n\n## 分离文件\n\
    \n当你的程序规模增大时，通常最好将相关的代码部分分到单独的文件。\n\n![image](img/1o.jpg)首先，创建一个包含包和导入声明的 verify.go\
    \ 文件\n\n```go\npackage verify\nimport “fmt”\n```\n\n![image](img/commono.jpg)\n\
    \nsrc\\verify\\verify.go\n\n2o.jpg\n\n添加验证函数——但将其名称改为大写字母开头\n\n```go\n// IsPosInt\
    \ 测试正整数。\nfunc IsPosInt( num int ) ( int, error ) {\n    if num < 1 {\n      \
    \  err := fmt.Errorf( “%v not positive integer”, num )\n        return -1, err\n\
    \    }\n    return num, nil\n}\n```\n\n![image](img/3o.jpg)将文件保存在你的“src”文件夹下的“verify”目录中\n\
    \n![image](img/4o.jpg)输入命令 `go install verify` 在你的 `go/pkg` 文件夹中创建一个名为 `verify.a`\
    \ 的编译归档文件\n\n创建一个 Go 存档包意味着每次编译导入的文件时，不需要重新编译工具文件。\n\n![image](img/5o.jpg)接下来，创建一个包含包和导入声明的\
    \ main.go 程序\n\n```go\npackage main\nimport (\n    “fmt”\n    “verify”\n)\n```\n\
    \n![image](img/commono.jpg)\n\nsrc\\prog\\main.go\n\n![image](img/6o.jpg)现在，添加\
    \ main 函数，通过其包名前缀修饰后的导入函数名\n\n```go\nfunc main( ) {\n    for i := 2 ; i >= -2\
