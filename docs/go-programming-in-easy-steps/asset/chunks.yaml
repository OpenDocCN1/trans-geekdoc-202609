    Store Values


    ***This chapter demonstrates how to store, retrieve, and manipulate various types
    of data using variable containers in Go programs.***


    [**Create Program Variables**](#chapter02.xhtml#sec9)


    [**Display Variable Values**](#chapter02.xhtml#sec10)


    [**Convert Data Types**](#chapter02.xhtml#sec11)


