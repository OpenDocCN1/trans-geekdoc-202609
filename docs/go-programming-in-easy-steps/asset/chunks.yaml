    \ ) {\n    num := 2\n    char := 'B'\n    // Statements to be inserted here.\n\
    }\n```\n\n![image](images/commonp.jpg)\n\nsrc\\switch\\main.go\n\n![image](images/2p.jpg)Next,\
    \ in the main function, insert a statement that tries to match a numerical value\n\
    \n```go\nswitch num {\ncase 1 :\n    fmt.Println( \"\\nNumber is One\" )\ncase\
    \ 2 :\n    fmt.Println( \"\\nNumber is Two\" )\ncase 3 :\n    fmt.Println( \"\\\
    nNumber is Three\" )\ndefault :\n    fmt.Println( \"\\nNumber is Unrecognized\"\
    \ )\n}\n```\n\n![image](images/3p.jpg)Now, insert a statement that tries to match\
    \ a character\n\n```go\nswitch char {\ncase 'A' :\n    fmt.Println( \"\\nLetter\
    \ is A\" )\ncase 'B' :\n    fmt.Println( \"\\nLetter is B\" )\ndefault :\n   \
    \ fmt.Println( \"\\nLetter is Unrecognized\" )\n}\n```\n\n![image](images/4p.jpg)Save\
    \ the program file in a “switch” directory, then run the program to see the results\
    \ of the conditional tests\n\n![image](images/pg49_1.jpg)\n\n## For Loops\n\n\
    A loop is a piece of code that automatically repeats. While the tested expression\
    \ is true, the loop will continue. When the tested expression becomes false, the\
    \ loop ends.\n\n![image](images/snake.jpg)\n\n![image](images/1p.jpg)\n\n![image](images/forget.jpg)\n\
    \n![image](images/hot.jpg)\n\n![image](images/1p.jpg)\n\nIn Go programming, there\
    \ are several ways to construct a loop but they all use the `for` keyword. The\
    \ most common type of loop begins with three components: an initializer, a test\
    \ expression, and an incrementer:\n\n```go\nfor initializer ; test-expression\
    \ ; incrementer {\n    statements-to-execute\n}\n```\n\nThe initializer is used\
    \ to set a starting value for a counter. An integer variable is used for this\
    \ purpose and is traditionally named `i`.\n\nUpon each iteration of the loop,\
    \ the test-expression is evaluated, and that iteration will only continue while\
    \ this expression is true. When the test-expression becomes false, the loop ends\
    \ immediately.\n\nLoops can be nested, one within another, to allow complete execution\
    \ of all iterations of an inner loop on each iteration of the outer loop. A second\
    \ integer variable is used to count the iterations of the inner loop, and is traditionally\
    \ named `j`. Should that inner loop also contain a nested loop, its counter is\
    \ traditionally named `k`, and the syntax looks like this:\n\n```go\nfor ... {\n\
    \    // statements\n    for ... {\n        // statements\n        for ... {\n\
    \            // statements\n        }\n    }\n}\n```\n\nNesting loops beyond three\
    \ levels is uncommon and is probably best avoided.\n\n![image](images/1p.jpg)Begin\
    \ a main function with a loop that performs five iteraations\n\n```go\nfunc main(\
    \ ) {\n    for counter := 1 ; counter <= 5 ; counter++ {\n        fmt.Println(\
    \ \"Loop Iteration\", counter )\n    }\n    // Statements to be inserted here.\n\
    }\n```\n\n![image](images/commonp.jpg)\n\nsrc\\forloop\\main.go\n\n![image](images/2p.jpg)Next,\
    \ insert a loop that performs three iterations\n\n```go\nfor i := 1 ; i <= 3 ;\
    \ i++ {\n    fmt.Println( \"\\nOuter Loop Iteration\", i )\n    // Inner Loop\
    \ to be inserted here.\n}\n```\n\n![image](images/3p.jpg)Now, insert an inner\
    \ loop that performs three iterations\n\n```go\nfor j := 1 ; j <= 3 ; j++ {\n\
    \    fmt.Println( \"\\tInner Loop Iteration\", j )\n}\n```\n"
  trans: "\n\n这是一种基础的编程技术，它根据评估结果为程序提供两个执行方向，被称为“条件分支”。\n\n![image](img/snake.jpg)\n\
    \n测试表达式和起始大括号 `{` 必须与 `if` 关键字出现在同一行。\n\n![image](img/snake.jpg)\n\n`else` 关键字和起始大括号\
    \ `{` 必须与上一个语句块的结束大括号 `}` 出现在同一行。\n\n![image](img/1p.jpg)用一个测试两个字符是否匹配的语句开始一个\
    \ main 函数\n\n```go\nfunc main( ) {\n    if 'A' == 'A' {\n        fmt.Println(\
    \ \"\\nCharacters Match\" )\n    }\n    // 在此处插入语句。\n}\n```\n\n![image](img/commonp.jpg)\n\
    \nsrc\\ifelse\\main.go\n\n![image](img/2p.jpg)接下来，在 main 函数中插入嵌套语句来测试两个数值表达式\n\
    \n```go\nif 5 > 1 {\n    if 7 > 2 {\n        fmt.Println( \"\\nBoth expressions\
    \ are true\" )\n    }\n}\n```\n\n![image](img/3p.jpg)现在，插入语句来测试数值表达式，并测试两个字符是否不匹配\n\
    \n```go\nif 5 < 1 {\n    fmt.Println( \"\\n1st Condition is true\" )\n} else if\
    \ 'A' != 'A' {\n    fmt.Println( \"\\n2nd Condition is true\" )\n} else {\n  \
    \  fmt.Println( \"\\nBoth Conditions are false\" )\n}\n```\n\n![image](img/4p.jpg)将程序文件保存到“ifelse”目录中，然后运行程序以查看条件测试的结果\n\
    \n![image](img/pg49_1.jpg)\n\n![image](img/forget.jpg)\n\n为了避免重复，从现在开始步骤列出的代码假设你已经在每个程序的开头声明了\
    \ `package main` 并导入了 `import \"fmt\"`。\n\n![image](img/hot.jpg)\n\n注意，如果第一个测试为\
    \ `false`，你可以使用 `else if` 来评估第二个表达式。\n\n## Switch Case (Switch Cases)\n\n当测试表达式仅评估单个条件时，通过多个\
    \ if else 语句执行的条件分支通常可以通过 `switch` 语句更高效地完成。\n\n![image](img/pg50_1.jpg)\n\n`switch`\
    \ 语句的工作方式比较特殊。它接受一个给定的值作为参数参数，然后尝试从多个 `case` 语句中匹配该值。找到匹配时要执行的代码包含在每个 `case` 语句中。\n\
    \n重要的是，每个要执行的语句必须单独一行，从 `case` 语句下方的行开始。\n\n可选情况下，`case` 语句列表后面可以跟一个最终的 `default`\
    \ 语句，以指定在任何 `case` 语句中都未找到匹配项时执行的代码。因此，`switch` 语句的语法通常如下：\n\n```go\nswitch test-value\
    \ {\ncase match-value :\n    statements-to-execute-when-matched\ncase match-value\
    \ :\n    statements-to-execute-when-matched\ncase match-value :\n    statements-to-execute-when-matched\n\
    default :\n    statements-to-execute-when-no-match-found\n}\n```\n\n如果多个 `match-values`\
    \ 需要执行相同的语句，则只需要最后一个 `case` 语句包含要执行的语句。例如，为了对匹配值为 0, 1 和 2 输出输出相同的消息：\n\n```go\n\
    switch num {\ncase 0 :\ncase 1 :\ncase 2 :\n    fmt.Println( \"Less than 3\" )\n\
    case 3 :\n    fmt.Println( \"Exactly 3\" )\ndefault :\n    fmt.Println( \"Greater\
    \ Than 3 or Less Than 0\" )\n}\n```\n\n![image](img/forget.jpg)\n\n`default` 语句不需要出现在\
    \ `switch` 块的末尾，但将其放在那里是符合逻辑的。\n\n![image](img/hot.jpg)\n\n当找到匹配项时，`switch` 通常会结束，但你可以在任何\
    \ `case` 块中添加 `fallthrough` 关键字作为最终语句，以继续到下一个 `case` 语句——尽管这很少用。\n\n![image](img/1p.jpg)用一个声明并初始化两个变量的语句开始一个\
    \ main 函数\n\n```go\nfunc main( ) {\n    num := 2\n    char := 'B'\n    // 在此处插入语句。\n\
    }\n```\n\n![image](img/commonp.jpg)\n\nsrc\\switch\\main.go\n\n![image](img/2p.jpg)接下来，在\
    \ main 函数中插入一个尝试匹配数值值的语句\n\n```go\nswitch num {\ncase 1 :\n    fmt.Println( \"\
    \\nNumber is One\" )\ncase 2 :\n    fmt.Println( \"\\nNumber is Two\" )\ncase\
    \ 3 :\n    fmt.Println( \"\\nNumber is Three\" )\ndefault :\n    fmt.Println(\
    \ \"\\nNumber is Unrecognized\" )\n}\n```\n\n![image](img/3p.jpg)现在，插入一个尝试匹配字符的语句\n\
    \n```go\nswitch char {\ncase 'A' :\n    fmt.Println( \"\\nLetter is A\" )\ncase\
    \ 'B' :\n    fmt.Println( \"\\nLetter is B\" )\ndefault :\n    fmt.Println( \"\
    \\nLetter is Unrecognized\" )\n}\n```\n\n![image](img/4p.jpg)将程序文件保存到“switch”目录中，然后运行程序以查看条件测试的结果\n\
    \n![image](img/pg49_1.jpg)\n\n## For 循环 (For Loops)\n\n循环是会自动重复的代码。当测试表达式为真时，循环将继续。当测试表达式为假时，循环结束。\n\
    \n![image](img/snake.jpg)\n\n![image](img/1p.jpg)\n\n![image](img/forget.jpg)\n\
    \n![image](img/hot.jpg)\n\n![image](img/1p.jpg)\n\n在 Go 编程中，有多种构建循环的方法，它们都使用 `for`\
    \ 关键字。最常见的循环类型包含三个部分：初始化器、测试表达式和计数器：\n\n```go\nfor initializer ; test-expression\
    \ ; incrementer {\n    statements-to-execute\n}\n```\n\n初始化器用于设置计数器的初始值。为此目的使用整数变量\
    \ `i`。\n\n在循环的每次迭代中，都会评估测试表达式，只有当该表达式为真时，迭代才会继续。当测试表达式为假时，循环立即结束。\n\n循环可以嵌套，在外部循环的每次迭代中完成内部循环的所有迭代。第二个整数变量用于计数内部循环，通常命名为\
    \ `j`。如果该内部循环也包含一个嵌套循环，其计数器通常命名为 `k`，语法如下：\n\n```go\nfor ... {\n    // statements\n\
    \    for ... {\n        // statements\n        for ... {\n            // statements\n\
    \        }\n    }\n}\n```\n\n嵌套超过三层的循环是不常见的，可能最好避免。\n\n![image](img/1p.jpg)用一个执行五次迭代的循环开始一个\
    \ main 函数\n\n```go\nfunc main( ) {\n    for counter := 1 ; counter <= 5 ; counter++\
    \ {\n        fmt.Println( \"Loop Iteration\", counter )\n    }\n    // 在此处插入语句。\n\
    }\n```\n\n![image](img/commonp.jpg)\n\nsrc\\forloop\\main.go\n\n![image](img/2p.jpg)接下来，插入一个执行三次迭代的循环\n\
    \n```go\nfor i := 1 ; i <= 3 ; i++ {\n    fmt.Println( \"\\nOuter Loop Iteration\"\
    , i )\n    // 在此处插入内部循环。\n}\n```\n\n![image](img/3p.jpg)现在，插入一个执行三次迭代的内部循环\n\n\
    ```go\nfor j := 1 ; j <= 3 ; j++ {\n    fmt.Println( \"\\tInner Loop Iteration\"\
    , j )\n}\n```\n\n"
