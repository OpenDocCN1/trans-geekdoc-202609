    Split Strings


    ![image](images/pg128_1.jpg)


    The Go standard library strings package provides several functions that allow
    a specified string to be separated into substrings. These functions treat the
    string like an array in which each element contains a character or a space.


    Frequently, you may want to separate a space-separated sentence into an array
    of substrings that are each individual words. The strings package conveniently
    provides a Fields( ) function that will perform that very task. This function
    requires the string sentence as its sole argument, and will return an array of
    substrings containing each individual word from that string.


    The strings package has a Split( ) function that requires two arguments to specify
    a string and a separator. This function will return an array of substrings that
    exist between occurrences of the specified separator. For example, when the string
    is a space-separated sentence and the separator is a space character, the **Split(
    )** function will return an array of words within that sentence.


    The strings package also has a SplitN( ) function that works just like the Split(
    ) function, but accepts a third argument to specify how many substrings to return.
    Subsequent occurrences of the specified separator will simply be returned in the
    final substring if the specified number of substrings exceeds the number of separators.
    For example, when the string is a space-separated sentence, the separator is a
    space character, and only two substrings are specified, the SplitN( ) function
    will return a substring containing the first word in the sentence and a substring
    containing the entire remainder of that sentence including spaces.


    It is important to recognize that the Fields( ), the Split( ), and the SplitN(
    ) functions discard the specified separator and only include the characters around
    the separator in the returned substrings. There are, however, two further functions
    that allow you to also include the separators in the returned substrings.


    The strings package’s SplitAfter( ) function works like the Split( ) function,
    but includes the separator in the returned substrings. Similarly, the strings
    package’s **SplitAfterN( )** function works like the SplitN( ) function, but includes
    the separator in the returned substrings.


    ![image](images/hot.jpg)


    Data is often stored as Comma-Separated Values in CSV files, which can be usefully
    split into individual values.


    ![image](images/1r.jpg)Begin by importing the Go standard library strings package
    into a program


    **import (**


    **“fmt” “**


    **strings”**


    **)**


    ![image](images/commonr.jpg)


    src\\split\\main.go


    ![image](images/2r.jpg)Start the main function by initializing a string variable


    **str := “I can, and, I will.”**


    ![image](images/3r.jpg)Next, add statements to pass a description and substrings
    of the variable string to a listing function


    **list( “Fields”, strings.Fields( str ) )**


    **list( “Split”, strings.Split( str, “,” ) )**


    **list( “SplitN”, strings.SplitN( str, “,“, 2 ) )**


    **list( “SplitAfter”, strings.SplitAfter( str, “,” ) )**


    **list( “SplitAfterN”, strings.SplitAfterN( str, “,”, 2 ) )**


    ![image](images/4r.jpg)After the main function, add the function to list the description
    and all substrings upon each call


    **func list( desc string, subs \[ \]string ) {**


    **fmt.Print( “\\n”, desc, “: “ )**


    **for \_, v := range subs {**


    **fmt.Print( “\[“, v, “\] “ )**


    **}**


    **fmt.Print( “\\n” )**


    **}**


    ![image](images/5r.jpg)Save the program file in a “split” directory, then run
    the program to see the substrings


    ![image](images/pg129_1.jpg)


    ![image](images/forget.jpg)


    Only split methods that contain the word “After” in their name will retain the
    separators.


    Find Characters


    ![image](images/pg130_1.jpg)


    The Go standard library strings package provides several functions that allow
    a specified string to be searched to find a specified character or substring (pattern).
    These functions treat the string as an array in which each element contains a
    character or a space.


    The strings package has a Contains( ) function that requires two arguments to
    specify a string and a pattern to find. This function will simply return true
    or false to indicate the result of a (case-sensitive) search. For example, to
    search for a “Pro” pattern:'
