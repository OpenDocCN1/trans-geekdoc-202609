- raw: 'Method signatures may also specify a parameter list and multiple return types.


    **Summary**


    •Multiple related items of data can be grouped together in a Go struct type.


    •The { } curly brackets of a struct contain a list of name and type pairs that
    are fields defining what the struct will contain.


    •An instance of a struct can be created as a variable declared with the name of
    the struct as its type.


    •An individual field of a struct can be initialized by assigning a value to the
    instance name and dot-suffixed field name.


    •An instance of a struct can be created and initialized by assigning a struct
    literal to a variable name.


    •A function can be attached to a struct by adding a receiver, which specifies
    the struct name to the function signature.


    •A function attached to a struct is referred to as a method.


    •A method can be a value receiver, operating on a copy of the struct, or a pointer
    receiver operating on the original fields.


    •A struct can represent the attributes and behaviors of real-world objects by
    its field properties and attached methods.


    •A struct can be embedded inside another struct as an anonymous field, so its
    fields can be directly addressed.


    •The three cornerstones of object-oriented programming are encapsulation, inheritance,
    and polymorphism.


    •Encapsulation in Go relies upon data-hiding in packages where only capitalized
    items will be exported.


    •Inheritance in Go relies upon composition where embedded structs provide fields
    and methods to the embedding struct.


    •Polymorphism in Go relies upon its interface type, which only contains a list
    of method signatures.


    •Any struct that has methods that precisely match the interface method signatures
    will implement the interface.


    •An interface can be embedded inside another interface to provide further abstraction
    for additional flexibility.


    7


    Create Arrays


    ***This chapter demonstrates how to store multiple items of data in indexed elements
    within a Go program.***


    [**Create a Basic Array**](#chapter07.xhtml#sec47)


    [**Loop Through Elements**](#chapter07.xhtml#sec48)


    [**Slice Arrays**](#chapter07.xhtml#sec49)


    [**Make Slices**](#chapter07.xhtml#sec50)


    [**Slices Versus Arrays**](#chapter07.xhtml#sec51)


    [**Map Keys and Values**](#chapter07.xhtml#sec52)


    [**Summary**](#chapter07.xhtml#sec53)


    **Create a Basic Array**


    An array is a variable that can store multiple items of data – unlike a regular
    variable, which can only store one piece of data. The pieces of data are stored
    sequentially in array “elements” that are numbered, starting at zero. So, the
    first value is stored in element zero, the second value is stored in element one,
    and so on.


    ![image](images/pg98_1.jpg)


    An empty array can be declared using the var keyword followed by a name of your
    choice, followed by \[ \] square brackets surrounding an integer specifying the
    number of required elements. These must then be followed by the data type the
    elements can contain. The syntax of the declaration looks like this:


    **var *arrayName* \[ *nElements* \] *dataType***


    Values can then be individually assigned to each available element by stating
    the element number in square brackets:


    ***arrayName* \[ *elementNumber* \] = *value***


