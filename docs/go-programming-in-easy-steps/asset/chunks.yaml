- raw: 'A request handler function will, by default, always have parameters for an
    http.ResponseWriter object, to write a response to the request, and a pointer
    to an http.Request object containing information about the request – for example,
    its URL.Path contains the string pattern specified to the http.HandleFunc( ) function.
    Typically, the http.ResponseWriter object is simply given the name w, and the
    http.Request object pointer is given the name r.


    The http.ResponseWriter object has a Write( ) method that accepts a byte slice
    argument of characters to be sent in a response. The characters can be converted
    into a string, like this:


    w.Write( \[ \]byte( “*response string*” ) )


    It is, however, more convenient to pass a string to the ttp.ResponseWriter object
    using a WriteString( ) function contained in the Go standard library io (input/output)
    package. This can be made available by importing the io package.


    The io.WriteString( ) function requires two arguments to specify the http.ResponseWriter
    object, and the string to be sent in response to a request.


    ![image](images/1o.jpg)Begin by adding the instruction to import the Go standard
    library io package into the previous program import (


    **“fmt”**


    **“io”**


    **“net/http”**


    **)**


    ![image](images/commono.jpg)


    src\\server\\main.go


    ![image](images/2o.jpg)Next, at the start of the main function, insert a statement
    to register a route handler


    **http.HandleFunc( “/hello”, helloHandler )**


    ![image](images/3o.jpg)Now, after the main function, add the handler function
    that will write two strings as a request response


    **func helloHandler( w http.ResponseWriter, r \*http.Request ) {**


    **io.WriteString( w, “Response from the helloHandler!\\n” )**


    **io.WriteString( w, “URL.Path = ” + r.URL.Path )**


    **}**


    ![image](images/4o.jpg)Save the updated program file in the “server” directory,
    then run the program to start the web server


    ![image](images/pg177_1.jpg)


    ![image](images/5o.jpg)If a firewall security warning appears, confirm that you
    wish to allow access for the web server


    ![image](images/6o.jpg)Launch a web browser and visit localhost:8000/hello to
    see the web server respond to this request


    ![image](images/pg177_2.jpg)


    **Add Files to Serve**


    Having established that the server program can respond to requests with the example
    [hereon page 177](#chapter12.xhtml#register), files can be added to the program
    that the server can deliver in response to requests.


    ![image](images/pg178_1.jpg)


    Web server files are typically contained within a root directory named htdocs
    (hypertext documents) or a similar name. This will generally contain HTML files
    and perhaps a favicon.ico image to identify the website in the browser’s title
    bar. The root directory will also often contain sub-directories to group associated
    files – such as images in an img folder, style sheets in a css folder, etc.


    In our server example, two HTML documents have been added to a root htdocs directory
    alongside a favicon.ico image. A single style sheet resides within an htdocs/css
    directory, and several images are contained in an htdocs/img directory. The entire
    server program tree now looks like this:


    ![image](images/pg178_2.jpg)


    ![image](images/pg178_3.jpg)


    favicon.ico


    32px x 32px


    ![image](images/pg178_4.jpg)


    power.png 100px x 25px


    Several of the image files are cover shots of various books whose ISBN (International
    Standard Book Number) is used as the respective cover image file name. The img
    directory also contains a company logo image, and a label to identify the web
    server.


    The style sheet contains rules to specify the appearance of a web page response
    that will be written dynamically by the program:


    | **img, p** || **{ float: left }** |


    | --- | --- |


    | **p** || **{ width: 320px ; text-align: center ; font-size: 1.5em }** |


    ![image](images/pg179_1.jpg)


    style.css


    The HTML document named index.html is a simple static web page displaying the
    website icon, a page heading and a label:


    **<!DOCT YPE HTML>**


    **<html lang=”en”\>**


    **<head>**


    **<meta charset=”UTF-8”\>**


    **<title>Index</title>**


    **<link rel=”shortcut icon” href=”favicon.ico”\>**


    **</head>**


    **<body>**


    **<h1>Static Web Page</h1>**


    **<img src=”img/power.png” alt=”Power”\>**


    **</body>**


    **</html>**


    ![image](images/pg179_2.jpg)


    index.html


    The HTML document named form.html allows the user to submit a single text value
    to the web server:


    **<!DOCT YPE HTML>**


    **<html lang=”en”\>**


    **<head>**


    **<meta charset=”UTF-8”\>**


    **<title>Submission Form</title>**


    **<link rel=”shortcut icon” href=”favicon.ico”\>**


    **</head>**


    **<body>**


    **<fieldset>**


    **<legend>Book Lookup</legend>**


    **<form method=”POST” action=”lookup”\>**


    **<label>Programming Language</label>**


    **<input name=”Language” type=”text” value=””\>**


    **<input type=”submit” value=”Submit” \>**


    **</form>**


    **</fieldset>**


    **<img src=”img/power.png” alt=”Power”\>**


    **</body>**


    **</html>**


    ![image](images/pg179_2.jpg)


    form.html


    ![image](images/hot.jpg)


    The **POST** method will be tested by the server; the **lookup** value will identify
    a form handler function; and the **Language** value will identify the submitted
    value.


    **Deliver a Static Page**


    The Go standard library net/http package provides three functions that allow a
    web server to easily respond to all HTTP requests with the contents of a nominated
    file system.


    ![image](images/pg180_1.jpg)


    The path of the root file directory is first specified as the argument to an http.Dir(
    ) function. This returns a Dir type that is then specified as the argument to
    an http.FileServer( ) function. This, in turn, returns a handler to respond to
    all HTTP requests with contents from the nominated root file directory.


    Finally, an http.Handle( ) function is used to register the handler. This requires
    two arguments to specify a route pattern and the handler’s name. Typically, the
    pattern “/” is used as the first argument – to match all request paths.


    The web browser can now request any document by name from within the nominated
    root file directory. If the file name is omitted from the request, the server
    will automatically seek a document named index.html to deliver to the browser.


    ![image](images/1o.jpg)At the start of the main function, insert a statement to
    nominate the root directory of files to serve dir := http.Dir( “C:/Users/mike\_/go/src/server/htdocs”
    )


    ![image](images/commono.jpg)


    src\\server\\main.go


    ![image](images/2o.jpg)Next, create a request handler for that file system


    **fileServer := http.FileServer( dir )**


    ![image](images/3o.jpg)Now, register the handler for all HTTP requests


    **http.Handle( “/”, fileServer )**


    ![image](images/4o.jpg)Save the updated program file, then start the web server
    and visit localhost:8000/index.html (or simply visit localhost:8000) to see a
    static index web page


    ![image](images/pg180_2.jpg)


    ![image](images/forget.jpg)


    You will need to edit the path to the root file directory to its location on your
    own system.


    **Log Received Data**


    Having successfully delivered a static index web page, the program can now supply
    a form page for the submission of data.


    ![image](images/pg181_1.jpg)


    The http.Request object has a ParseForm( ) method that populates an http.Request.Form
    object with submitted form input values. A submitted value can then be retrieved
    by specifying the form input name as an argument to an http.Request.FormValue(
    ) method.


    There is also an http.Request.Method object containing the value assigned to the
    form’s HTML method attribute. The “POST” method is preferred for the submission
    of form data.


    If a form submission cannot be parsed, or if the form is using the wrong submission
    method, an error message can be sent to the browser by the http.Error( ) function.
    This requires three arguments to specify the http.ResponseWriter name, an error
    string message, and an HTTP status code – such as 400 (bad request) or 405 (method
    not allowed).'
