    \ keys and values\n\n`colors := make( map [string]string )`![image](images/1v.jpg)\n\
    \n`src\\map\\main.go`![image](images/commonv.jpg)Initialize the map with three\n\
    \n`colors[\"Red\"] = “#FF0000”`\n\n`colors[\"Green\"] = “#00FF00”`\n\n`colors[\"\
