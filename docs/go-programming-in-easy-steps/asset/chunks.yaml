- raw: 'Go provides a couple of special features that you can use with arrays. Firstly,
    when declaring an array variable with an array literal, you can use the … wildcard
    operator to set the number of elements equal to the number of values in the array
    literal:


    **arr := \[ … \]int { 10, 20, 30 }                 // len( arr ) == 3.**


    You can even specify which element each value should be stored in by stating the
    index number for each value, like this:


    **arr := \[ … \]int { 2: 10, 0: 20, 1: 30 }      // arr == \[ 20, 30, 10 \].**


    Secondly, you can use the range keyword in a loop to iterate over an array and
    return the index number and value of each element.


    ![image](images/1v.jpg)Create an integer array of five elements


    **arr := \[ … \]int { 100, 200, 300, 400, 500 }**


    ![image](images/commonv.jpg)


    src\\range\\main.go


    ![image](images/2v.jpg)Next, add a statement to confirm the array size


    **fmt.Println( “No. of Elements:”, len( arr ) )**


    ![image](images/3v.jpg)Now, add a loop to modify each element’s value


    **for i , v := range arr {**


    **arr\[ i \] =v / 10**


    **}**


    ![image](images/4v.jpg)Then, add a loop to reference each array element value


    **for i , v := range arr {**


    **fmt.Printf( “Index: %v Value: %v \\n”, i, v )**


    **}**


    ![image](images/5v.jpg)Save the program file in a “range” directory, then run
    the program to see the values stored within array elements


    ![image](images/pg101_1.jpg)


    ![image](images/hot.jpg)


    You can replace the variable name **i** with the **\_** blank identifier to avoid
    an error if you don’t need the index number in the loop statements – see [herepage
    68](#chapter05.xhtml#sec32).


    **Slice Arrays**


    Arrays are sequences whose elements each contain data of the same type, but are
    of a fixed length so are not very versatile. Fortunately, Go provides a slice
    type that represents an underlying array and whose length can be changed.


    ![image](images/pg102_1.jpg)


    To understand the slice type it is important to recognize that a slice does not
    contain any elements itself, but is merely a reference to an actual array. The
    slice type contains only three components:


    •**Ptr** – (pointer) a pointer to the first element in the array accessible by
    the slice (not necessarily the first array element).


    •**Len** – (length) the total number of elements in the slice.


    •**Cap** – (capacity) the number of elements between the element referenced by
    the pointer and the last array element.


    For example, a slice of weekdays from an array of day names:


    ![image](images/pg102_2.jpg)


    A slice can be created in Go programming by assigning an array to a variable that
    specifies element index numbers of a desired lower and upper boundary. These are
    specified around a : colon character between \[ \] square brackets. The number
    to the left of the colon specifies the index number of the starting element to
    slice – which the slice pointer will reference. The number to the right of the
    colon specifies the index number of the upper boundary – to slice all elements
    up to, but not including, the upper boundary element. An assignment for the example
    depicted above would look like this:


    **weekdays := days\[ 0 : 5 \]**


    Optionally, you can omit either of the numbers that specify the upper and lower
    boundaries to use the default values. The default value for the lower boundary
    is 0 (zero) and the default value for the upper boundary is the total number of
    elements in the array.


    ![image](images/hot.jpg)


    Slices are important in Go programming and are seen much more frequently than
    the array type, but it’s important to understand that they are references to underlying
    arrays.


    You can reveal the length of a slice using the built-in len( ) function, as with
    arrays, but you can also check the capacity of a slice using a built-in cap( )
    function. Comparing the pointer value of a slice with the memory address of the
    array element to which it points, confirms that the slice is indeed a pointer
    reference.


    ![image](images/1v.jpg)First, create an array of seven elements


    **days := \[ 7 \]string {“Mon”,”Tue”,”Wed”,”Thu”,”Fri”,”Sat”,”Sun”}**


    ![image](images/commonv.jpg)


    src\\slice\\main.go


    ![image](images/2v.jpg)Create a slice that represents the final two array elements


    **weekend := days\[ 5 : \]**


    ![image](images/3v.jpg)Now, add statements to display the slice contents and type


    **fmt.Printf( “Slice weekend: %v \\n”, weekend )**


    **fmt.Printf( “Type weekend : %T \\n”, weekend )**


    ![image](images/4v.jpg)Add statements to display the slice length and capacity


    **fmt.Printf( “Length weekend: %v \\n”, len( weekend ) )**


    **fmt.Printf( “Capacity weekend: %v \\n”, cap( weekend ) )**


    ![image](images/5v.jpg)Finally, add statements to confirm that the slice is a
    reference pointing to an underlying array element


    **fmt.Printf( “Pointer weekend: %p \\n”, weekend )**


    **fmt.Printf( “Address days\[0\]: %p \\n”, &days\[ 5 \] )**


    ![image](images/6v.jpg)Save the program file in a “slice” directory, then run
    the program to see the features of a slice


    ![image](images/pg103_1.jpg)


    ![image](images/hot.jpg)


    See that the type of a slice is described by empty \[ \] square brackets followed
    by the type each element may contain.


    **Make Slices**


    ![image](images/pg104_1.jpg)


    A slice can be created in the same way as an array, except without specifying
