    \ key. In Go programming, this data structure is called a “map”, but other programming\
    \ languages call this an associative array or dictionary.\n\n![image](images/pg108_1.jpg)\n\
    \nAll keys in a map must be unique and be of the same data type. All values in\
    \ a map must be of the same data type, but not necessarily be of the same data\
    \ type as the keys.\n\nA map can be created using the `var` and `map` keywords,\
    \ and by specifying the key and value data types using this syntax:\n\n`var *mapName*\
    \ = map [*keyDataType]* *valueDataType`\n\nIndividual key/value pairs can then\
    \ be assigned to the map, like this:\n\n`*mapName* [“*keyName*”] = *value*`\n\n\
    Unlike arrays and slices, the map is unordered, so you cannot use index numbers.\
    \ You can add key/value pairs to a map at any time, use the built-in `delete()`\
    \ function to remove a key/value pair. Furthermore, you can iterate through all\
    \ elements of a map using the `range` keyword. In this case, the loop will return\
    \ the key and value, rather than an index. The map is not a variable, so you cannot\
