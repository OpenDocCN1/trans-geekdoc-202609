    Control Flow


    ***This chapter demonstrates how statements can evaluate expressions to determine
    the direction in which a Go program should proceed.***


    [**Test a Condition**](#chapter04.xhtml#sec22)


    [**Switch Cases**](#chapter04.xhtml#sec23)


    [**Loop Several Times**](#chapter04.xhtml#sec24)


