    ![image](images/5p.jpg)Now, add the label on the next line after the closing **}**
    brace of the outer loop


    **end:**


    ![image](images/6p.jpg)Save the updated file, then run the program once more to
    see the loop end when the tested condition becomes true


    ![image](images/pg59_1.jpg)


    ![image](images/snake.jpg)


    Avoid creating a program executable named “goto.exe” as this may conflict with
    the internal **GOTO** command on Windows systems.


    ![image](images/forget.jpg)


    Notice that the label itself must end with a : colon character.


    **Summary**


    •The if keyword performs a basic conditional test to evaluate a given expression
    for a boolean value of true or false.


    •The else keyword can be used to provide alternative statements to execute when
    an if statement finds an expression to be false.


    •Offering a program alternative directions in which to proceed following an evaluation
    is known as “conditional branching”.


    •Conditional branching performed by multiple if else statements can often be performed
    more efficiently by a switch statement.


    •The statements within a switch block must each appear on a separate line below
    the case statement.


    •Optionally, a switch block may contain a default statement specifying statements
    to execute when no match is found.


    •The for keyword can specify an initializer, a test-expression, and an incrementer,
    to control a loop.


    •The for keyword can simply specify a test expression to determine whether a loop
    should continue while true.


    •The for keyword can entirely omit the test-expression to create an infinite loop.


    •A condition can be tested within the body of an infinite loop to end the loop
    with the break keyword.


    •The break keyword can be used to terminate a loop, whereas the continue keyword
    can be used to skip a single iteration.


    •Loops may be nested so that inner loops perform a sequence of iterations upon
    each iteration of their outer loop.


    •Use of the goto keyword is generally not recommended, but it can legitimately
    be used to exit from nested loops.


    5


    Produce Functions


    *This chapter demonstrates how statements can be enclosed within a function for
    execution whenever the function is called by the Go program.*


    [**Create a Basic Function**](#chapter05.xhtml#sec29)


    [**Add Parameters**](#chapter05.xhtml#sec30)


    [**Pass References**](#chapter05.xhtml#sec31)


    [**Return Values**](#chapter05.xhtml#sec32)


    [**Call Recursively**](#chapter05.xhtml#sec33)


    [**Enclose Anonymously**](#chapter05.xhtml#sec34)


    [**Pass Functions**](#chapter05.xhtml#sec35)


    [**Handle Errors**](#chapter05.xhtml#sec36)


    [**Separate Files**](#chapter05.xhtml#sec37)


    [**Summary**](#chapter05.xhtml#sec38)


    **Create a Basic Function**


    Previous examples in this book have used the obligatory main( ) function and functions
    contained in the Go standard library, such as the fmt.Println( ) function in the
    “fmt” package. However, most Go programs contain a number of custom functions,
    which can be called as required during the execution of the program.


    ![image](images/pg62_1.jpg)


    A function block simply contains a group of statements that get executed whenever
    that function is called. Once the function statements have been executed, program
    flow resumes at the point directly following the function call. This modularity
    is very useful in Go programming to isolate set sequences of code that can be
    called upon repeatedly as required.


    To add a custom function into a Go program it must be declared using the func
    keyword, followed by a name of your choice – adhering to the same naming conventions
    used for variable names.


    | **Naming Rule** || **Example** |


    | --- | --- |


    | CANNOT be a Go keyword || **default** |


    | CANNOT contain arithmetic operators || **a+b\*c** |


    | CANNOT contain punctuation characters || **%$#@!** |


    | CANNOT contain any spaces || **no spaces** |


    | MUST start with a letter || **msg** |


    | CAN contain numbers elsewhere || **good1** |


    | CAN contain mixed case || **camelCase** |


    When choosing a function name it should describe the purpose of the function but
    be concise. The function name is followed by ( ) parentheses and an { opening
    curly bracket, all on the same line. This line is often referred to as the function
    “signature”. The statements to be executed are contained in the function body,
    and the body ends with a } closing curly bracket – just as with the main function.
    The function can be called within a program by stating its name followed by (
    ) parentheses.


    ![image](images/snake.jpg)


    Function names should begin with a lowercase letter unless the function is to
    be exported – see [herepage 78](#chapter05.xhtml#sec37).


    ![image](images/1o.jpg)Create a function that will simply print a message each
    time it gets called


    **func first( ) {**


    **msg := “Hello from the 1st function!”**


    **fmt.Println( msg )**


    **}**


    ![image](images/commono.jpg)


    src\\funcs\\main.go


    ![image](images/2o.jpg)Create another function that will simply print the result
    of a multiplication each time it gets called


    **func sqFive( ) {**


    **fmt.Printf( “%v \\n”, 5 \* 5 )**


    **}**


    ![image](images/3o.jpg)Next, add a main function that begins with a statement
    that calls the first function to print its message


    **func main( ) {**


    **first( )**


    **// Statements to be inserted here.**


    **}**


    ![image](images/4o.jpg)Now, insert statements to display a multiplication sum
    and print its result


    **fmt.Print( “5 x 5 = “ )**


    **sqFive( )**


    ![image](images/5o.jpg)Save the program file in a “funcs” directory, then run
    the program to see the printed output


    ![image](images/pg63_2.jpg)


    ![image](images/forget.jpg)


    The listed code assumes you have declared **package main** and **import “fmt”**
    at the start of each program.


    ![image](images/hot.jpg)


    Variables declared inside a function or other block are only accessible from within
    that block – they have “local scope”. For example, here the **msg** variable is
    only accessible from within the **first( )** function. Variables declared outside
    a function block are accessible from anywhere in the program – they have “global
    scope”. It is preferable to use only local variables to avoid possible conflicts
    with variables existing in global scope.


    **Add Parameters**


    ![image](images/pg64_1.jpg)


    The ( ) parentheses that follow the function name in a function declaration can,
    optionally, contain a comma-separated list of “parameters”. These are variables
    that can be used by the function but whose initial content is supplied by the
    caller. The variables are created whenever the function gets called, and are destroyed
    when control exits from the function. Each parameter must be given a name of your
    choice, following the usual variable naming conventions, and a type with this
    syntax:


    func ***functionName* ( *paramName type*, *paramName type* ) {**


    ***statements-to-be-executed***


    **}**


    Multiple consecutive parameters of the same type can be declared as a list and
    need only specify the type after the final parameter of the same type, like this:


    func ***functionName* ( *paramName*, *paramName type* ) {**


    ***statements-to-be-executed***


    **}**


    Each function call must specify content for each parameter, of the correct type
    and in the same order as they appear in the function declaration. The contents
    being passed to the function are known as “arguments”. These are specified as
    a comma-separated list within the ( ) parentheses following the function name
    in the call:


    ***functionName* ( *argument*, *argument*, *argument* )**


    Unlike some other programming languages, Go has no way to specify default content
    for function parameters.'
