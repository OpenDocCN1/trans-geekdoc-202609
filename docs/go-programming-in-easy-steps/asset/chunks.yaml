    \n![image](img/forget.jpg)\n\n可以使用具有更多内存的变量创建带有更多位标志的位域——`int` 数据类型在 32 位系统上为\
    \ 32 位宽，在 64 位系统上为 64 位宽。\n\n![image](img/hot.jpg)\n\n这里使用 `%b` 格式指定符来输出每个位中的二进制数值值。\n\
    \n## 理解优先级\n\n运算符优先级定义了 Go 编译器评估表达式的顺序。在表达式 `6 + 7 * 3` 中，优先级决定了是先完成加法还是先完成乘法。\n\
    \n![image](img/pg44_1.jpg)\n\n下表按递减顺序列出了运算符优先级，高行的运算符优先级高于低行的运算符，因此它们的操作会先完成。同一行的二元运算符具有相同的优先级，但完成顺序由它们从左到右的顺序决定，因此左侧的操作会先完成。\n\
    \n| 优先级级别 | 运算符 |\n| --- | --- |\n| 5 | `* / % << >> &` |\n| 4 | `+ - \\| ^` |\n\
    | 3 | `== != < <= >=` |\n| 2 | `&&` |\n| 1 | `||` |\n\n`++` 增运算符运算符和 `--  减运算符在\
    \ Go 编程中构成语句，而不是出现在表达式中，因此未包含在上面的优先级表中。\n\n你可以通过将表达式部分放在括号内来强制编译器忽略默认优先级级别，强制编译器先评估表达式的最内部分。例如，在表达式\
    \ `6 + 7 * 3` 中，`*` 乘法运算符的默认优先级高于 `+` 加法运算符，因此先执行乘法操作 `7 * 3 = 21`，然后执行加法 `21\
    \ + 6 = 27`。你可能希望先执行加法操作，因此可以通过给表达式添加括号 `(6 + 7) * 3` 来强制编译器这样做。现在，表达式的评估结果为 `6\
    \ + 7 = 13`，然后是 `13 * 3 = 39`。\n\n![image](img/1g.jpg)在你的“src”文件夹内创建一个名为“force”的目录\n\
    \n![image](img/commong.jpg)src/force/main.go\n\n以 package 和 import 声明开始 `main.go`\
    \ 程序\n\n```go\npackage main\nimport “fmt”\n```\n\n![image](img/3g.jpg)添加一个 main\
    \ 函数，通过评估表达式来声明并初始化变量并显示其值\n\n```go\nfunc main() {\n    sum := 2 * 3 + 4\n   \
    \ fmt.Printf( “Default Order: %v \\n”, sum )\n    // 在处插入语句。\n}\n```\n\n![image](img/4g.jpg)在\
    \ main 函数中，插入语句显示修改后的表达式评估值\n\n```go\nsum = 2 * (3 + 4) - 5\nfmt.Printf( “Forced\
    \ Order: %v \\n”, sum )\n```\n\n![image](img/5g.jpg)接下来，插入语句显示另一个表达式评估值\n\n```go\n\
    sum = 7 % 3 * 2\nfmt.Printf( “Default Order: %v \\n”, sum )\n```\n\n![image](img/6g.jpg)现在，插入语句显示另一个表达式评估值\n\
    \n```go\nsum = 7 % (3 * 2)\nfmt.Printf( “Forced Order: %v \\n”, sum )\n```\n\n\
    ![image](img/7g.jpg)将程序文件保存到“force”目录中，然后运行程序以查看不同的结果\n\n![image](img/pg45_1.jpg)\n\
    \n![image](img/hot.jpg)在表达式中使用括号以避免意想不到的结果。\n\n### 总结\n\n- 算术运算符可以形成包含两个操作数的表达式，用于加法\
    \ `+`、减法 `-`、乘法 `*`、除法 `/` 和取模 `%`。\n- 增 `++` 运算符和 减 `--` 运算符按值 1 修改单个操作数。\n-\
    \ 赋值运算符 `=` 可以结合算术运算符形成表达式。\n- 比较运算符可以用于比较两个操作数的相等 `==`、不相等 `!=`、小于 `<`、小于等于 `<=`、大于等于\
    \ `>=`。\n- 逻辑与 `&&` 和逻辑或 `||` 运算符用于评估两个布尔值的真或假。\n- 逻辑非 `!` 运算符返回布尔值的取反。\n- 位按或\
    \ `|`、位按与 `&`、位按取反 `~` 和位按异或 `^` 用于操作位域。\n- 左移 `<<` 和右移 `>>` 运算符移动位值。\n\n## 控制流\n\
    \n本章介绍了语句如何评估表达式来确定 Go 程序的执行方向。\n\n- 测试条件\n- Switch Case\n- 循环多次\n- 真循环\n- 跳出循环\n\
    - 跳转标签\n- 总结\n\n### 测试条件\n\n![image](img/pg48_1.jpg)\n\n`if` 关键字用于执行基本的条件测试，评估给定表达式的布尔真假值。位于\
    \ `{ }` 大括号内的语句仅在表达式评估为真时执行。`if` 测试语句的语法如下：\n\n```go\nif test-expression {\n \
    \   statements-to-execute-when-the-condition-is-true\n}\n```\n\n当测试为真时，可以有多个语句，但每个语句必须独占一行。有时可能需要评估多个表达式以确定是否执行后续语句。这可以通过逻辑\
    \ `&&` 与运算符来实现，语法如下：\n\n```go\nif test-expression && test-expression {\n    statements-to-execute-when-all-conditions-are-true\n\
    }\n```\n\n或者，可以将多个 `if` 语句“嵌套”，在另一个内部来评估多个表达式：\n\n```go\nif test-expression {\n\
    \    if test-expression {\n        statements-to-execute-when-all-conditions-are-true\n\
    \    }\n}\n```\n\n当 `if` 测试语句评估的一个或多个表达式为假时，其后续的大括号内的语句不会执行，程序继续执行后续代码。通常通过向 `if`\
    \ 语句附加 `else` 语句来扩展它，指定在 `if` 语句评估的表达式为假时执行的语句，语法如下：\n\n```go\nif test-expression\
    \ {\n    statements-to-execute-when-the-condition-is-true\n} else {\n    statements-to-execute-when-the-condition-is-false\n\
    }\n```\n\n"
