- raw: "Since MST (Mountain Standard Time) is 7 hours behind UTC (Universal Time Coordinated),\
    \ the reference string can alternatively be considered numerically to look like\
    \ this:\n\n**01 02 03:04:05PM ‘06 -0700**\n\nIf you want the Format( ) method\
    \ to return only the day, month, and time in hh:mm format, the layout can be specified\
    \ as:\n\n**“Mon Jan 2 15:04”**\n\nor numerically as:\n\n**“01/02 03:04”**\n\n\
    You can have the day name and month name returned as full names by specifying\
    \ the long name versions in the layout:\n\n**“Monday January 2 15:04”**\n\nThe\
    \ time package includes predefined UnixDate, ANSIC, and RFC3339 constants that\
    \ you can use as date/time layout formats.\n\nA custom layout can specify the\
    \ components in any order to suit different locales – for example, for appropriate\
    \ date formatting.\n\nThe time package also includes a predefined Kitchen constant\
    \ that you can use as a time layout format. This will display the time in a 12-hour\
    \ format and append “AM” or “PM” as appropriate.\n\nAdditionally, the time components\
    \ can be formatted to be displayed in a 24-hour format that will automatically\
    \ prefix single-digit hours with a zero by specifying “15:04”.\n\nBoth 12-hour\
    \ format and 24-hour format will automatically prefix single-digit minutes with\
    \ a zero.\n\n![image](images/hot.jpg)\n\nANSIC refers to the American National\
    \ Standards Institute standard date/time format for the C programming language.\
    \ RFC 3339 refers to the Request For Comment date/time document of the Internet\
    \ Engineering Taskforce (IETF).\n\n![image](images/1b.jpg)Begin by importing the\
    \ Go standard library time package into a program\n\n**import (**\n\n**“fmt” \
    \ \n\n“time”**\n\n**)**\n\n![image](images/commons.jpg)\n\nsrc\\\\format\\\\main.go\n\
    \n![image](images/2b.jpg)Next, create a date/time instance of the Time data type,\
    \ initialized with the current date and time, then display its components in various\
    \ formats\n\n**dt := time.Now( )**\n\n**fmt.Println( “\\\\nDefault Format:”, dt\
    \ )**\n\n**fmt.Println( “Unix Format:”, dt.Format( time.UnixDate ) )  \n\nfmt.Println(\
    \ “ANSIC Format:”, dt.Format( time.ANSIC ) )  \n\nfmt.Println( “RFC3339 Format:”,\
    \ dt.Format( time.RFC3339 ) )  \n\nfmt.Println( “Custom Format:”,**\n\n**dt.Format(\
    \ “January 2, 2006 \\[Monday\\]” ) )**\n\n![image](images/3b.jpg)Now, display\
    \ only date components formatted to be appropriate in two locales\n\n**fmt.Println(\
    \ “\\\\nUS Format:”, dt.Format( “January 2, 2006” ) )**\n\n**fmt.Println( “UK\
    \ Format:”, dt.Format( “2 January, 2006” ) )**\n\n![image](images/4b.jpg)Then,\
    \ display only time components in a 12-hour format and in a 24-hour format\n\n\
    **fmt.Println( “\\\\nTime 12-Hour:”, dt.Format( time.Kitchen ) )**\n\n**fmt.Println(\
    \ “Time 24-Hour:”, dt.Format( “15:04” ) )**\n\n![image](images/5b.jpg)Save the\
    \ program file in a “format” directory, then run the program to see the formatted\
    \ date and time field values\n\n![image](images/pg117_1.jpg)\n\n![image](images/hot.jpg)\n\
    \nThe **time.Kitchen** constant is equivalent to specifying a layout format of\
    \ “15:04PM”.\n\n**Set Date and Time**\n\nYou can create your own Time data types\
    \ using the Date( ) function of the Go standard library time package. This requires\
    \ eight arguments to specify (in this order) a year, a month, a day number, an\
    \ hour, a minute, a second, a nanosecond, and a location.\n\n![image](images/pg116_1.jpg)\n\
    \nAll arguments are specified as integer values except for the month and location.\n\
    \nThe month can be specified using one of the time package predefined full-name\
    \ month constants for January-December, for example, time.January.\n\nThe location\
    \ can be specified using one of the time package predefined location constants\
    \ atime.UTC, for Universal Time Coordinated or time.Local, for your system clock.\n\
    \nThe date fields in any Time data type can be modified using the AddDate( ) method\
    \ of the Go standard library time package to specify three arguments for year,\
    \ month, and day. Positive values will advance the date, and negative values will\
    \ retard the date. For example, time.AddDate( 1, 0, 0 ) will advance the date\
    \ one year.\n\nSimilarly, the time package’s Add( ) method can be used to specify\
    \ a single duration argument by which to modify a date/time. This value can be\
    \ an int64 value representing a number of nanoseconds by which to modify the date/time.\
    \ More conveniently, you can use constants time.Hour, time.Minute, time.Second,\
    \ or time.Millisecond to modify individual time fields of a Time data type. For\
    \ example, time.Add( 10 \\* time.Hour ) will advance the time 10 hours.\n\nYou\
    \ can also create your own Time data types from a string using the Parse( ) function\
    \ of the Go standard library time package. This requires two arguments to specify\
    \ a layout and a date/time string. Usefully, this function returns two values,\
    \ which are a Time data type and an error. If the function returns a Time data\
    \ type, the error value will be nil, otherwise it will be an error message.\n\n\
    The layout should only use values from the Go reference string:\n\n**Mon Jan 2\
    \ 15:04:05 2006 MST**\n\nUnless a time zone offset value is specified in the date/time\
    \ string (e.g. \\-0500), the resulting Time data type will assume UTC time.\n\n\
    ![image](images/forget.jpg)\n\nThe **Time** data types can be formatted using\
    \ the **Format( )** method described [hereon page 116](#chapter08.xhtml#sec56).\n\
    \n![image](images/1b.jpg)Begin by importing the Go standard library time package\
    \ into a program\n\n**import (**\n\n**“fmt”  \n\n“time”**\n\n**)**\n\n![image](images/commons.jpg)\n\
    \nsrc\\\\setdate\\\\main.go\n\n![image](images/2b.jpg)Next, create and display\
    \ a date/time instance of the Time data type, initialized for noon on New Year’s\
    \ day\n\n**dt := time.Date( 2025, time.January, 1, 12, 0, 0, time.Local )**\n\n\
    **fmt.Printf( “\\\\nDateTime: %v \\\\n\\\\n”, dt )**\n\n![image](images/3b.jpg)Advance\
    \ the date two years to U.S. Independence Day, then display the modified date\n\
    \n**dt = dt.AddDate( 2, 6, 3 )**\n\n**fmt.Printf( “DateTime: %v \\\\n\\\\n”, dt\
    \ )**\n\n![image](images/4b.jpg)Now, initialize a layout string and a date/time\
    \ string\n\n**layout := “2006-Jan-02 03:04PM”**\n\n**str := “2030-Dec-25 12:30AM”**\n\
    \n![image](images/5b.jpg)Finally, attempt to create and display the fields of\
    \ a Time data type, or display an error message if the attempt fails\n\n**t, err\
    \ := time.Parse( layout, str )**\n\n**if err != nil {**\n\n**fmt.Println( err\
    \ )**\n\n**} else {**\n\n**fmt.Printf( “Parsed DateTime:” %v \\\\n”, t )**\n\n\
    **}**\n\n![image](images/6b.jpg)Save the program file in a “setdate” directory,\
    \ then run the program to see the date and time field values\n\n![image](images/pg119_1.jpg)\n\
    \n![image](images/snake.jpg)\n\nThe layout string and date/time string must be\
    \ in the same format when parsing a string to a **Time** data type.\n\n![image](images/hot.jpg)\n\
    \nThe modified **Time** fields automatically recognize the change from Eastern\
    \ Standard Time to Eastern Daylight Time.\n\n**Recognize Zones**\n\nAll Time data\
    \ types in Go programming are associated with a time zone. Typically, this will\
    \ be UTC time, or the local time based upon the location of the system running\
    \ the program. You can, however, specify an alternative location as an argument\
    \ to a time.LoadLocation( ) function. The location name must correspond to a file\
    \ in the Internet Assigned Numbers Authority (IANA) time zone database, such as\
    \ “America/New\\_York”, “Asia/Seoul”, or “Europe/London”. The time.LoadLocation(\
    \ ) function returns two values, which are a Location type and an error. If the\
    \ function successfully returns a Location type, the error value will be nil,\
    \ otherwise it will be an error message.\n\n![image](images/pg120_1.jpg)\n\nYou\
    \ can create a Time data type of the current time in another time zone by appending\
    \ a call to an In( ) function after its Now( ) function, in which the location\
    \ is specified as an argument to the In( ) function.\n\n![image](images/pg120_2.jpg)"
  fmt: "\nSince MST (Mountain Standard Time) is 7 hours behind UTC (Universal Time\
    \ Coordinated), the reference string can alternatively be considered numerically\
    \ to look like this:\n\n`01 02 03:04:05PM ‘06 -0700`\n\nIf you want the `Format()`\
    \ method to return only the day, month, and time in hh:mm format, the layout can\
    \ be specified as:\n\n`Mon Jan 2 15:04`\n\nor numerically as:\n\n`01/02 03:04`\n\
    \nYou can have the day name and month name returned as full names by specifying\
    \ the long name versions in the layout:\n\n`Monday January 2 15:04`\n\nThe time\
    \ package package includes predefined `UnixDate`, `ANSIC`, and `RFC3339` constants\
    \ that you can use as date/time layout formats.\n\nA custom layout can specify\
    \ the components in any order to suit different locales – for example, for appropriate\
    \ date formatting.\n\nThe time package also includes a predefined `Kitchen` constant\
    \ that you can use as a time layout format. This will display the time in a 12-hour\
    \ format and append “AM” or “PM” as appropriate.\n\nAdditionally, the time components\
    \ can be formatted to be displayed in a 24-hour format that will automatically\
    \ prefix single-digit hours with a zero by specifying `15:04`.\n\nBoth 12-hour\
    \ format and 24-hour format will automatically prefix single-digit minutes with\
    \ a zero.\n\n![image](images/hot.jpg)\n\n`ANSIC` refers to the American National\
    \ Standards Institute standard date/time format for the C programming language.\
    \ RFC 3339 refers to the Request For Comment date/time document of the Internet\
    \ Engineering Taskforce (IETF).\n\n![image](images/1b.jpg)Begin by importing the\
    \ Go standard library time package into a program\n\n```go\nimport (\n\t\"fmt\"\
    \n\t\"time\"\n)\n```\n\n![image](images/commons.jpg)\n\n`src\\format\\main.go`\n\
    \n![image](images/2b.jpg)Next, create a date/time instance of the Time data type,\
    \ initialized with the current date and time, then display its components in various\
    \ formats\n\n```go\ndt := time.Now()\nfmt.Println(\"\\nDefault Format:\", dt)\n\
    fmt.Println(\"Unix Format:\", dt.Format(time.UnixDate))\nfmt.Println(\"ANSIC Format:\"\
    , dt.Format(time.ANSIC))\nfmt.Println(\"RFC3339 Format:\", dt.Format(time.RFC3339))\n\
    fmt.Println(\"Custom Format:\", dt.Format(\"January 2, 2006 [Monday]\"))\n```\n\
    \n![image](images/3b.jpg)Now, display only date components formatted to be appropriate\
    \ in two locales\n\n```go\nfmt.Println(\"\\nUS Format:\", dt.Format(\"January\
    \ 2, 2006\"))\nfmt.Println(\"UK Format:\", dt.Format(\"2 January, 2006\"))\n```\n\
    \n![image](images/4b.jpg)Then, display only time components in a 12-hour format\
    \ and in a 24-hour format\n\n```go\nfmt.Println(\"\\nTime 12-Hour:\", dt.Format(time.Kitchen))\n\
    fmt.Println(\"Time 24-Hour:\", dt.Format(\"15:04\"))\n```\n\n![image](images/5b.jpg)Save\
    \ the program file in a “format” directory, then run the program to see the formatted\
    \ date and time field values\n\n![image](images/pg117_1.jpg)\n\n![image](images/hot.jpg)\n\
    \nThe `time.Kitchen` constant is equivalent to specifying a layout format of `15:04PM`.\n\
    \n## Set Date and Time\n\nYou can create your own Time data types using the `Date()`\
    \ function of the Go standard library time package. This requires eight arguments\
    \ to specify (in this order) a year, a month, a day number, an hour, a minute,\
    \ a second, a nanosecond, and a location.\n\n![image](images/pg116_1.jpg)\n\n\
    All arguments are specified as integer values except for the month and location.\n\
    \nThe month can be specified using one of the time package predefined full-name\
    \ month constants for January-December, for example, `time.January`.\n\nThe location\
    \ can be specified using one of the time package predefined location constants\
    \ at `time.UTC`, for Universal Time Coordinated or `time.Local`, for your system\
    \ clock.\n\nThe date fields in any Time data type can be modified using the `AddDate()`\
    \ method of the Go standard library time package to specify three arguments for\
    \ year, month, and day. Positive values will advance the date, and negative values\
    \ will retard the date. For example, `time.AddDate(1, 0, 0)` will advance the\
    \ date one year.\n\nSimilarly, the time package’s `Add()` method can be used to\
    \ specify a single duration argument by which to modify a date/time. This value\
    \ can be an `int64` value representing a number of nanoseconds by which to modify\
    \ the date/time. More conveniently, you can use constants `time.Hour`, `time.Minute`,\
    \ `time.Second`, or `time.Millisecond` to modify individual time fields of a Time\
    \ data type. For example, `time.Add(10 * time.Hour)` will advance the time 10\
    \ hours.\n\nYou can also create your own Time data types from a string using the\
    \ `Parse()` function of the Go standard library time package. This requires two\
    \ arguments to specify a layout and a date/time string. Usefully, this function\
    \ returns two values, which are a Time data type and an error. If the function\
    \ returns a Time data type, the error value will be `nil`, otherwise it will be\
    \ an error message.\n\nThe layout should only use values from the Go reference\
    \ string:\n\n`Mon Jan 2 15:04:05 2006 MST`\n\nUnless a time zone offset value\
    \ is specified in the date/time string (e.g. -0500), the resulting Time data type\
    \ will assume UTC time.\n\n![image](images/forget.jpg)\n\nThe `Time` data types\
    \ can be formatted using the `Format()` method described [hereon page 116](#chapter08.xhtml#sec56).\n\
    \n![image](images/1b.jpg)Begin by importing the Go standard library time package\
    \ into a program\n\n```go\nimport (\n\t\"fmt\"\n\t\"time\"\n)\n```\n\n![image](images/commons.jpg)\n\
    \n`src\\setdate\\main.go`\n\n![image](images/2b.jpg)Next, create and display a\
    \ date/time instance of the Time data type, initialized with the current date\
    \ and time, then display its components in various formats\n\n```go\ndt := time.Date(2025,\
    \ time.January, 1, 12, 0, 0, 0, time.Local)\nfmt.Println(\"\\nDateTime:\", dt)\n\
    ```\n\n![image](images/3b.jpg)Advance the date two years to U.S. Independence\
    \ Day, then display the modified date\n\n```go\ndt = dt.AddDate(2, 0, 3)\nfmt.Println(\"\
    DateTime:\", dt)\n```\n\n![image](images/4b.jpg)Now, initialize a layout string\
    \ and a date/time string\n\n```go\nlayout := \"2006-Jan-02 03:04PM\"\nstr := \"\
    2030-Dec-25 12:30AM\"\n```\n\n![image](images/5b.jpg)Finally, attempt to create\
    \ and display the fields of a Time data type, or display an error message if the\
    \ attempt fails\n\n```go\nt, err := time.Parse(layout, str)\nif err != nil {\n\
    \tfmt.Println(err)\n} else {\n\tfmt.Printf(\"Parsed DateTime: %v\\n\", t)\n}\n\
    ```\n\n![image](images/6b.jpg)Save the program file in a “setdate” directory,\
    \ then run the program to see the date and time values\n\n## Recognize Zones\n\
    \nAll Time data types in Go programming are associated with a time zone. Typically,\
    \ this will be UTC time, or the local time based upon the location of the system\
    \ running the program. You can, however, specify an alternative location as an\
    \ argument to a `time.LoadLocation()` function. The location name must correspond\
    \ to a file in the Internet Assigned Numbers Authority (IANA) time zone database,\
    \ such as `America/New_York`, `Asia/Seoul`, or `Europe/London`. The time.LoadLocation()`\
    \ function returns two values, which are a Location type and an error. If the\
    \ function successfully returns a Location type, the error value will be `nil`,\
    \ otherwise it will be an error message.\n\nYou can create a Time data type of\
    \ the current time in another time zone by appending a call to an `In()` function\
    \ after its `Now()` function, in which the location is specified as an argument\
    \ to the `In()` function.\n\n![image](images/pg120_1.jpg)\n\n![image](images/pg120_2.jpg)\n"
  trans: "\n由于 MST（山地标准时间）比 UTC（协调世界时）晚 7 小时，参考字符串也可以从数值角度考虑，如下所示：\n\n`01 02 03:04:05PM\
    \ ‘06 -0700`\n\n如果你想让 `Format()` 方法只返回日、月和 hh:mm 格式的时间，可以将布局指定为：\n\n`Mon Jan 2\
    \ 15:04`\n\n或以数值形式指定为：\n\n`01/02 03:04`\n\n你可以通过在布局中指定长名称版本，让返回返回星期名称和月份全称：\n\n\
    `Monday January 2 15:04`\n\n`time` 包包含了预定义的 `UnixDate`、`ANSIC` 和 `RFC3339` 常量，你可以将它们作为日期/时间布局格式。\n\
    \n自定义布局可以按任何顺序指定组件，以适应不同的地区——例如，用于适当的日期格式。\n\n`time` 包还包含一个预定义的 `Kitchen` 常量，你可以将其作为时间布局格式。它将以\
    \ 12 小时格式显示时间，并根据需要附加“AM”或“PM”。\n\n此外，时间组件可以被格式化为 24 小时格式显示，通过指定 `15:04` 自动在单数字小时前加零。\n\
    \n12 小时格式和 24 小时格式都会自动在单数字分钟前加零。\n\n![image](img/hot.jpg)\n\n`ANSIC` 指的是美国国家标准协会针对\
    \ C 编程语言的标准日期/时间格式。RFC 3339 指的是互联网工程任务组（IETF）的请求意见日期/时间文档。\n\n![image](img/1b.jpg)首先向程序导入\
    \ Go 标准库的 `time` 包\n\n```go\nimport (\n\t\"fmt\"\n\t\"time\"\n)\n```\n\n![image](img/commons.jpg)\n\
    \n`src\\format\\main.go`\n\n![image](img/2b.jpg)接下来，创建一个 Time 数据类型的日期/时间实例，用当前日期时间初始化，然后以各种格式显示其组件\n\
    \n```go\ndt := time.Now()\nfmt.Println(\"\\nDefault Format:\", dt)\nfmt.Println(\"\
    Unix Format:\", dt.Format(time.UnixDate))\nfmt.Println(\"ANSIC Format:\", dt.Format(time.ANSIC))\n\
    fmt.Println(\"RFC3339 Format:\", dt.Format(time.RFC3339))\nfmt.Println(\"Custom\
    \ Format:\", dt.Format(\"January 2, 2006 [Monday]\"))\n```\n\n![image](img/3b.jpg)现在，仅显示格式化为适合两个不同地区的日期组件\n\
    \n```go\nfmt.Println(\"\\nUS Format:\", dt.Format(\"January 2, 2006\"))\nfmt.Println(\"\
    UK Format:\", dt.Format(\"2 January, 2006\"))\n```\n\n![image](img/4b.jpg)然后，仅以\
    \ 12 小时格式和 24 小时格式显示时间组件\n\n```go\nfmt.Println(\"\\nTime 12-Hour:\", dt.Format(time.Kitchen))\n\
    fmt.Println(\"Time 24-Hour:\", dt.Format(\"15:04\"))\n```\n\n![image](img/5b.jpg)将程序文件保存在“format”目录中，然后运行程序以查看格式化后的日期时间和字段值\n\
    \n![image](img/pg117_1.jpg)\n\n![image](img/hot.jpg)\n\n`time.Kitchen` 常量等同于指定布局格式\
    \ `15:04PM`。\n\n## 设置日期和时间\n\n你可以使用 Go 标准库 `time` 包的 `Date()` 函数创建你自己的 Time 数据类型。这需要八个参数来指定（按顺序）年、月、日、时、分、秒、纳秒和位置。\n\
    \n![image](img/pg116_1.jpg)\n\n除了月份和位置外，所有参数都指定为整数值。\n\n月份可以使用 `time` 包预定义的 1\
    \ 月至 12 月的全称月份常量之一指定，例如 `time.January`。\n\n位置可以使用 `time` 包预定义的位置常量之一指定，如 `time.UTC`（协调世界时）或\
    \ `time.Local`（你的系统时钟）。\n\n任何 Time 数据类型中的日期字段都可以使用 Go 标准库 `time` 包的 `AddDate()`\
    \ 方法进行修改，以指定年、月、日的三个参数。正值将推迟日期，负值将推回日期。例如，`time.AddDate(1, 0, 0)` 将日期推后一年。\n\n\
    同样，`time` 包的 `Add()` 方法可以用于指定单个持续时间参数来修改日期/时间。该值可以是一个代表修改日期/时间的纳秒数的 `int64` 值。更方便的是，你可以使用常量\
    \ `time.Hour`、`time.Minute`、`time.Second` 或 `time.Millisecond` 来修改 Time 数据类型的单个时间字段。例如，`time.Add(10\
    \ * time.Hour)` 将时间推后 10 小时。\n\n你还可以使用 Go 标准库 `time` 包的 `Parse()` 函数从字符串创建你自己的\
    \ Time 数据类型。这需要两个参数来指定布局和日期/时间字符串。有用的是，此函数返回两个值：一个 Time 数据类型和一个错误。如果函数返回了 Time\
    \ 类型，则错误值为 `nil`，否则将是一个错误。\n\n布局应仅使用：\n\n`Mon Jan 2 15:04`\n\n除非在日期/时间字符串中指定了时区偏移值（例如\
    \ -0500），否则生成的 Time 类型将假设为 UTC 时间。\n\n![image](img/forget.jpg)\n\n`Time` 数据类型可以使用第\
    \ 16 页的 `Format()` 方法进行格式化。\n\n![image](img/1b.jpg)首先向程序导入 Go 标准库 `time` 包\n\n\
    ```go\nimport (\n\t\"fmt\"\n\t\"time\"\n)\n```\n\n![image](img/commons.jpg)\n\n\
    `src\\setdate\\main.go`\n\n![image](img/2b.jpg)接下来，创建一个 Time 数据类型的日期/时间实例，用当前日期时间初始化，然后以各种格式显示其组件\n\
    \n```go\ndt := time.Date(2025, time.January, 1, 12, 0, 0, 0, time.Local)\nfmt.Println(\"\
    \\nDateTime:\", dt)\n```\n\n![image](img/3b.jpg)将日期推后两年到独立日，然后显示修改后的日期\n\n```go\n\
    dt = dt.AddDate(2, 0, 3)\nfmt.Println(\"DateTime:\", dt)\n```\n\n![image](img/4b.jpg)现在，初始化一个布局字符串和一个日期/时间字符串\n\
    \n```go\nlayout := \"2006-Jan-02 03:04PM\"\nstr := \"2030-Dec-25 12:30AM\"\n```\n\
    \n![image](img/5b.jpg)最后，尝试创建并显示 Time 数据类型的字段，如果失败则显示错误\n\n```go\nt, err := time.Parse(layout,\
    \ str)\nif err != nil {\n\tfmt.Println(err)\n} else {\n\tfmt.Printf(\"Parsed DateTime:\
    \ %v\\n\", t)\n}\n```\n\n![image](img/6b.jpg)将程序文件保存在“setdate”目录中，然后运行程序以查看日期时间和\n\
    \n## 识别区域\n\nGo 编程中的所有 Time 类型都关联到一个时区。通常，这是 UTC 时间，或者是运行程序的系统的本地时间。然而，你可以通过 `time.LoadLocation()`\
    \ 函数指定一个可选的位置。位置名称必须与互联网分配机构（IANA）时区数据库中的文件对应，例如 `America/New_York`、`Asia/Seoul`\
    \ 或 `Europe/London`。`time.LoadLocation()` 函数返回两个值：一个 Location 类型和一个错误。如果函数成功返回了\
    \ Location 类型，则错误值为 `nil`，否则将是一个错误消息。\n\n你可以通过在 `Now()` 函数之后附加调用 `In()` 函数，并将位置作为\
    \ `In()` 函数的参数，来创建另一个时区的当前时间 Time 类型。\n"
