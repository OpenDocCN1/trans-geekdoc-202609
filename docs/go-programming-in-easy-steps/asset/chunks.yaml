    \ )\nresult = ( zero > max )                // 0 > 1.\nfmt.Println(\"Greater:\\\
    tzero > max\\t\", result )\nresult = ( max <= zero )               // 1 <= 0.\n\
    fmt.Println(\"Less or Equal:\\tmax <= zero\\t\", result )\n```\n\n![image](images/5g.jpg)Save\
    \ the program file in the “comp” directory, then run the program to see the results\
    \ of each comparison\n\n![image](images/pg39_1.jpg)\n\n![image](images/forget.jpg)The\
    \ ASCII code value for ‘A’ is 65 but for lowercase ‘a’ it’s 97 – so their comparison\
    \ returns `false`.\n\n![image](images/snake.jpg)When comparing numbers, remember\
    \ to test for equality as well as testing for higher and lower values.\n\n## Assess\
    \ Logic\n\n![image](images/pg40_1.jpg)The logical operators most commonly used\
    \ in Go programming are listed in the table below:\n\n| Operator | Operation |\n\
    | --- | --- |\n| `&&` | Logical-AND |\n| `||` | Logical-OR |\n| `!` | Logical-NOT\
    \ |\n\nThe logical operators are used with operands that have boolean values of\
    \ `true` or `false`, or values that convert to true or false. The `&&` logical-AND\
    \ operator will evaluate two operands and return true only if both operands are\
    \ true. Otherwise, the `&&` logical-AND operator will return false. This is used\
    \ in conditional branching where the direction of a program is determined by testing\
    \ two conditions – if both conditions are satisfied, the program will go in a\
    \ certain direction. Unlike the `&&` logical-AND operator, which needs both operands\
    \ to be true, the `||` logical-OR operator will evaluate its two operands and\
    \ return true if either one of the operands returns true. If however, neither\
    \ operand returns true, the `||` logical-OR operator will return false. This is\
    \ useful in Go programming to perform a certain action if either one of two conditions\
    \ has been met. The `!` logical-NOT operator is a unary operator used before a\
    \ single operand. It returns the inverse value of the given operand, so if the\
    \ variable `a` had a value of `true` then `!a` would have a value of `false`.\
    \ The `!` logical-NOT operator is useful in Go programs to toggle the value of\
    \ a variable in successive iterations with a statement like `a = !a`. This ensures\
    \ that each pass the value is changed, like flicking a light switch on and off.\n\
    \n![image](images/pg40_2.jpg)The term “boolean” refers to a system of logic developed\
    \ by the English mathematician George Boole (1815-1864).\n\n![image](images/1g.jpg)Create\
    \ a directory named “logic” inside your “src” folder\n\n![image](images/commong.jpg)\n\
    \n`src\\logic\\main.go`\n\n![image](images/2g.jpg)Begin a main.go program with\
    \ package and import declarations\n\n```go\npackage main\nimport \"fmt\"\n```\n\
    \n![image](images/3g.jpg)Add a main function that declares and initializes two\
    \ variables\n\n```go\nfunc main( ) {\n    var yes, no bool = true, false\n   \
    \ // Statements to be inserted here.\n}\n```\n\n![image](images/4g.jpg)In the\
    \ main function, insert statements to determine whether both variables contain\
    \ true values\n\n```go\nresult := ( yes && no )\nfmt.Println(\"AND Logic:\\ty\
    \ && no\\t\", result )\n```\n\n![image](images/5g.jpg)Next, insert statements\
    \ to determine whether either of the variables contains a true value\n\n```go\n\
    result = ( yes || no )\nfmt.Println(\"OR Logic:\\ty || no\\t\", result )\n```\n\
    \n![image](images/6g.jpg)Now, insert statements to display the current value of\
    \ a variable and its inverse value\n\n```go\nresult = !yes\nfmt.Println(\"NOT\
    \ Logic:\\tyes =\", yes, \"\\t!yes =\", result )\n```\n\n![image](images/7g.jpg)Save\
    \ the program file in the “logic” directory, then run the program to see the results\
    \ of logical assessments.\n\n![image](images/pg41_1.jpg)\n\n![image](images/forget.jpg)The\
    \ value returned by the `!` logical-NOT operator is the inverse of the stored\
    \ value – the stored value remains unchanged.\n\n![image](images/hot.jpg)Comparing\
    \ `false && false` returns `false`, not `true` – demonstrating the maxim “two\
    \ wrongs don’t make a right”.\n\n## Juggle Bits\n\n![image](images/pg42_1.jpg)In\
    \ computer terms, each byte comprises eight bits that can each contain a 1 or\
    \ a 0 to store a binary number, representing decimal values from 0 to 255. Each\
    \ bit contributes a decimal component only when that bit contains a 1. Components\
    \ are designated right-to-left from the “Least Significant Bit” (LSB) to the “Most\
    \ Significant Bit” (MSB). The binary number in the bit pattern below is 00110010\
    \ and represents the decimal number 50 (2+16+32):\n\n![image](images/pg42_2.jpg)It\
    \ is possible to manipulate individual bit parts of a byte using the Go “bitwise”\
    \ operators listed below:\n\n| Operator | Name | Example Operation |\n| --- |\
    \ --- | --- |\n| `&` | AND | `0011 & 0101 = 0001` |\n| `|` | OR | `0011 | 0101\
    \ = 0111` |\n| `^` | XOR | `0011 ^ 0101 = 0110` |\n| `^` | NOT | `^0101 = 1010`\
    \ |\n| `&^` | AND NOT | `0011 &^ 0101 = 0010` |\n| `<<` | Shift left | `0010 <<\
    \ 2 = 1000` |\n| `>>` | Shift right | `1000 >> 2 = 0010` |\n\nBy far the most\
    \ common use of bitwise operators is to manipulate a compact “bit field” representing\
    \ a set of “flags”. This is a much more efficient use of memory than storing boolean\
