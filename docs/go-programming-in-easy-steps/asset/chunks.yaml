- raw: "![image](images/pg53_1.jpg)\n\n![image](images/hot.jpg)\n\nA **for** loop\
    \ counter can also count down – by decrementing the counter value on each iteration\
    \ using **i--** instead of **i++**.\n\n**Loop While True**\n\n![image](images/pg54_1.jpg)\n\
    \nAn alternative to the for loop described in the previous example [hereon page\
    \ 53](#chapter04.xhtml#iteration) only contains a test expression after the for\
    \ keyword – it does not include an initializer or incrementer at the beginning\
    \ of the loop statement. Instead, it uses a counter variable that has already\
    \ been initialized, and increments the counter within the body of the loop. This\
    \ is the Go equivalent of a “while” loop in other programming languages, as the\
    \ loop will continue iterating while the test expression remains true. The incrementer\
    \ must at some point render the test expression false to end the loop, or an infinite\
    \ loop will have been created that will never end. The syntax of this type of\
    \ for loop looks like this:\n\n***initializer***\n\n**for *test-expression* {**\n\
    \n***statements-to-be-executed  \n\nincrementer***\n\n**}**\n\nA further variation\
    \ of a loop structure in Go programming allows you to even omit the test expression\
    \ from the beginning statement and use an infinite loop with a test expression\
    \ contained in the loop body. It too uses a counter variable that has already\
    \ been initialized, and increments the counter within the body of the loop. This\
    \ is the Go equivalent of a “do-while” loop in other programming languages, as\
    \ the loop will execute its statements and continue iterating while the test expression\
    \ remains true. When the test expression becomes false, the loop can be terminated\
    \ using the break keyword, so the syntax of this type of for loop looks like this:\n\
    \n***initializer***\n\n**for {**\n\n***statements-to-be-executed  \n\nincrementer***\n\
    \n**if *test-expression* {**\n\n***statements-to-be-executed***\n\n**break**\n\
    \n**}**\n\n**}**\n\nNotice that a “while” loop will not make a single iteration\
    \ if the test expression is false on its first evaluation, whereas a “do-while”\
    \ loop will always make at least one iteration because its statements are executed\
    \ before the evaluation is made.\n\n![image](images/hot.jpg)\n\nIn the event that\
    \ a program runs an infinite loop, on Windows or Linux systems press the **Ctrl**\
    \ + **C** keyboard keys to halt the loop execution.\n\n![image](images/1p.jpg)Begin\
    \ a main function with a loop that performs five iterations\n\n**func main( )\
    \ {**\n\n**counter := 1**\n\n**for counter <= 5 {**\n\n**fmt.Println( “Loop Iteration”,\
    \ counter )**\n\n**counter++**\n\n**}**\n\n**// Statements to be inserted here.**\n\
    \n**}**\n\n![image](images/commonp.jpg)\n\nsrc\\\\while\\\\main.go\n\n![image](images/2p.jpg)Next,\
    \ insert an infinite loop statement\n\n**i := 10**\n\n**for {**\n\n**fmt.Println(\
    \ “\\\\t\\\\t\\\\tCountdown”, i )**\n\n**i--**\n\n**// Test expression to be inserted\
    \ here.**\n\n**}**\n\n![image](images/3p.jpg)Now, insert a test expression to\
    \ end the loop\n\n**if i < 1 {**\n\n**fmt.Println( “\\\\t\\\\t\\\\t\\\\t\\\\tLift\
    \ Off!” )**\n\n**break**\n\n**}**\n\n![image](images/4p.jpg)Save the program file\
    \ in a “while” directory, then run the program to see the output on each loop\
    \ iteration\n\n![image](images/pg55_1.jpg)\n\n![image](images/pg55_2.jpg)\n\n\
    ![image](images/forget.jpg)\n\nChange the initial value of the **i** variable\
    \ to **0** (zero) and run the program again to see the first iteration of the\
    \ loop get executed.\n\n**Break Out of Loops**\n\nThe break keyword can be used\
    \ to prematurely terminate any loop when a specified condition is met. The break\
    \ statement is situated inside the loop statement block and is preceded by a test\
    \ expression. When the test returns true, the loop ends immediately and the program\
    \ proceeds on to the next task. For example, in a nested inner loop it proceeds\
    \ to the next iteration of the outer loop.\n\n![image](images/pg56_1.jpg)\n\n\
    The continue keyword can be used to skip a single iteration of a loop when a specified\
    \ condition is met. The continue statement is situated inside the loop statement\
    \ block and is preceded by a test expression. When the test returns true, that\
    \ single iteration ends.\n\n![image](images/1p.jpg)Begin a main function with\
    \ a loop that performs three iterations\n\n**func main( ) {**\n\n**for i := 1\
    \ ; i <= 3 ; i++ {**\n\n**// Inner Loop to be inserted here.**\n\n**}**\n\n**}**\n\
    \n![image](images/commonp.jpg)\n\nsrc\\\\break\\\\main.go\n\n![image](images/2p.jpg)Insert\
    \ an inner loop that performs three iterations\n\n**// Statements to be inserted\
    \ here.  \n\nfor j := 1 ; j <= 3 ; j++ {**\n\n**fmt.Println( “Running i=”, i,\
    \ “j=”, j )**\n\n**}**\n\n![image](images/3p.jpg)Save the program file in a “break”\
    \ directory, then run the program to see the output on each loop iteration\n\n\
    ![image](images/pg56_2.jpg)\n\n![image](images/hot.jpg)\n\nYou can also **break**\
    \ to a label at a specific point outside of nested code blocks – see an example\
    \ of this [hereon page 166](#chapter11.xhtml#sec81).\n\n![image](images/4p.jpg)Next,\
    \ insert this break statement at the very beginning of the inner loop block, to\
    \ break out of the inner loop\n\n**if i == 2 && j == 2 {**\n\n**fmt.Println( “Breaks\
    \ When i=”, i, “and j=”, j )**\n\n**break**\n\n**}**\n\n![image](images/5p.jpg)Save\
    \ the updated file, then run the program again to see the inner loop terminate\
    \ on its second iteration\n\n![image](images/pg57_1.jpg)\n\n![image](images/6p.jpg)Now,\
    \ insert this continue statement before the break statement – to skip the second\
    \ iteration of the inner loop\n\n**if i == 3 && j == 2 {**\n\n**fmt.Println( “Continues\
    \ When i=”, i, “and j=”, j )**\n\n**continue**\n\n**}**\n\n![image](images/7p.jpg)Save\
    \ the updated file, then run the program once more to see only the second iteration\
    \ of the inner loop skipped\n\n![image](images/pg57_1.jpg)\n\n![image](images/forget.jpg)\n\
    \nHere, the **break** statement halts the second and third iterations of the inner\
    \ loop when the outer loop tries to run it for the second time.\n\n![image](images/forget.jpg)\n\
    \nHere, the **continue** statement just skips the second iteration of the inner\
    \ loop when the outer loop tries to run it for the third time.\n\n**Go to Labels**\n\
    \nThe goto keyword at first glance seems like a great feature, as it allows the\
    \ program flow to jump to a label at any position in the program code, much like\
    \ a hyperlink on a web page. However, in reality this can cause errors, its use\
    \ is frowned upon, and it is generally considered bad programming practice.\n\n\
    ![image](images/pg58_1.jpg)\n\nThe goto keyword jump is a powerful feature that\
    \ has existed in computer programs for decades, but its power was abused by many\
    \ early programmers who created programs that jumped around in an unfathomable\
    \ manner. This produced unreadable program code, so the use of goto became hugely\
    \ unpopular.\n\nTypically, the program might execute a sequence of statements,\
    \ then a goto statement would jump back to a label at the beginning of the sequence\
    \ to repeat their execution. Additionally, a condition might be tested at some\
    \ point during the sequence, and a further goto statement might jump to a point\
    \ after the sequence to continue the program flow if the tested condition was\
    \ not met. In this way, the program code quickly gained lots of confusing goto\
    \ statements and labels.\n\nOne possible valid use of the goto keyword is to break\
    \ cleanly from an inner nested loop by jumping to a label just after the end of\
    \ its outer loop block. This immediately exits both loops so no further iterations\
    \ of either loop are executed.\n\n![image](images/1p.jpg)Begin a main function\
    \ with a loop that performs three iterations\n\n**func main( ) {**\n\n**for i\
    \ := 1 ; i <= 3 ; i++ {**\n\n**// Inner Loop to be inserted here.**\n\n**}**\n\
    \n**}**\n\n![image](images/commonp.jpg)\n\nsrc\\\\jump\\\\main.go\n\n![image](images/2p.jpg)Insert\
    \ an inner loop that performs three iterations\n\n**for j := 1 ; j <= 3 ; j++\
    \ {**\n\n**fmt.Println( “Running i=”, i, “j=”, j )**\n\n**}**\n\n![image](images/3p.jpg)Save\
    \ the program file in a “jump” directory, then run the program to see the output\
    \ on each loop iteration\n\n![image](images/pg59_1.jpg)"
