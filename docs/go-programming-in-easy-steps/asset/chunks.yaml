- raw: "Submitted form values can be formatted using the Go standard library strings\
    \ package to trim spaces and change case. These values can then be written into\
    \ a log file created using the OpenFile( ) function in the Go os package. The\
    \ Go standard library log package provides a SetOutput( ) function, to specify\
    \ the log file to write to, and a Print( ) function to specify what should be\
    \ written into the log file. This usefully prefixes each item logged with the\
    \ date and time of writing.\n\n![image](images/1o.jpg)Begin by adding instructions\
    \ to import the Go standard library strings, os, and log packages into the previous\
    \ program\n\n**import (**\n\n**“fmt”**\n\n**“io”**\n\n**“log”**\n\n**“net/http”**\n\
    \n**“os”**\n\n**“strings”**\n\n**)**\n\n![image](images/commono.jpg)\n\nsrc\\\\\
    server\\\\main.go\n\n![image](images/2o.jpg)Next, in the main function, register\
    \ a form handler with a route argument that will recognize the name assigned to\
    \ the form’s HTML action attribute\n\n**http.HandleFunc( “/lookup”, formHandler\
    \ )**\n\n![image](images/hot.jpg)\n\nGo provides constants for each HTTP status\
    \ code, such as 200 with **http.StatusOk**. See the documentation at [golang.org/pkg/net/http](http://www.golang.org/pkg/net/http)\
    \ for the full list of codes.\n\n![image](images/3o.jpg)After the main function,\
    \ begin the form handler with validation that checks the submission method as\n\
    \n**{**\n\n**if r.Method != “POST” {**\n\n**http.Error( w, “Method Not Allowed”,\
    \ 405 )**\n\n**return**\n\n**}**\n\n**// Statements to be inserted here**.\n\n\
    **}**\n\n![image](images/commono.jpg)\n\nsrc\\\\server\\\\main.go\n\n![image](images/4o.jpg)Next,\
    \ in the form handler, insert statements to parse the form data or return an error\
    \ message to the browser\n\n**err := r.ParseForm( )**\n\n**if err != nil {**\n\
    \n**http.Error( w, “Bad Request”, 400 )**  \n\n**return**\n\n**}**\n\n![image](images/5o.jpg)Now,\
    \ in the form handler, insert statements to format a submitted value by removing\
    \ spaces and changing case\n\n**lang := r.FormValue( “Language” )**\n\n**lang\
    \ = strings.ToLower( strings.Trim( lang, “ “ ) )**\n\n![image](images/6o.jpg)Then,\
    \ in the form handler, insert statements to write the formatted value into a log\
    \ file\n\n**file, err := os.OpenFile( “htdocs/data.log”,**\n\n**os.O\\_CREATE|os.O\\\
    _APPEND|os.O\\_WRONLY, 0644 )**\n\n**if err != nil {**\n\n**log.Print( err )**\n\
    \n**}**\n\n**defer file.Close( )**\n\n**log.SetOutput( file )**\n\n**log.Print(\
    \ lang )**\n\n![image](images/7o.jpg)Save the updated program file, then start\
    \ the web server and visit localhost:8000/form.html to see the form appear\n\n\
    ![image](images/8o.jpg)Enter the name of a programming language in the input field,\
    \ then hit the Submit button to submit the form data\n\n![image](images/hot.jpg)\n\
    \nThe most used request methods are **GET** and **POST**. The **GET** method appends\
    \ data to the URL string. The **POST** method carries data in the request body,\
    \ so is more secure and is the preferred method when transferring data from a\
    \ browser to the server.\n\n![image](images/pg183_1.jpg)\n\n![image](images/9o.jpg)Now,\
    \ hit the browser’s **Back** button and repeat the submission process to send\
    \ multiple requests – each for a different programming language\n\n![image](images/pg183_2.jpg)\n\
    \n![image](images/pg183_3.jpg)\n\n![image](images/10o.jpg)Then, visit localhost:8000/data.log\
    \ to see each one of the submitted form values in the log file\n\n![image](images/pg183_4.jpg)\n\
    \n![image](images/pg183_5.jpg)\n\ndata.log\n\n![image](images/hot.jpg)\n\nFor\
    \ simplicity, this example submits only one item, which is referenced using the\
    \ request object’s **FormValue( )** method and HTML **name** attribute value.\
    \ For forms that submit multiple items, you can loop through them using the **range**\
    \ keyword to reference the key (HTML **name** attribute) and value (HTML **value**\
    \ attribute) of each item.\n\n**Deliver a Dynamic Response**\n\nHaving received\
    \ and logged the request data, following the steps [hereon page 182-3](#chapter12.xhtml#handler),\
    \ the program can now evaluate the request and send an appropriate response to\
    \ the web browser.\n\n![image](images/1o.jpg)After the log statements in the form\
    \ handler, initialize two variables with default response string values\n\n**title\
    \ := “<a href=’http://www.ineasysteps.com’>**\n\n**See all titles online</a>”**\n\
    \n**isbn := “logo”**\n\n![image](images/commono.jpg)\n\nsrc\\\\server\\\\main.go\n\
    \n![image](images/2o.jpg)Next, examine the submitted request value and, if matched,\
    \ assign appropriate response values\n\n**switch lang {**\n\n**case “c” :**\n\n\
    **title = “C Programming”**\n\n**isbn = “978-1-84078-840-2”**\n\n**case “go” :**\n\
    \n**title = “Go Programming”**\n\n**isbn = “978-1-84078-919-5”**\n\n**case “java”\
    \ :**\n\n**title = “Java”**\n\n**isbn = “978-1-84078-873-0”**\n\n**case “python”\
    \ :**\n\n**title = “Python”**\n\n**isbn = “978-1-84078-812-9”**\n\n**case “sql”\
    \ :**\n\n**title = “SQL”**\n\n**isbn = “978-1-84078-902-7”**\n\n**}**\n\n![image](images/3o.jpg)Now,\
    \ build an HTML string that incorporates the response values\n\n**response :=**\n\
    \n**“<!DOCTYPE HTML><title>Web Server Response</title>”**\n\n**response +=**\n\
    \n**“<link rel=’shortcut icon’ href=’favicon.ico’>”**\n\n**response +=**\n\n**“<link\
    \ rel=’stylesheet’ href=’css/style.css’>”**\n\n**response += “<p>” + title + “<br>in\
    \ easy steps”**\n\n**if isbn != “logo” {**\n\n**response += “<br>ISBN:” + isbn**\n\
    \n**}**\n\n**response +=**\n\n**“</p><img src=’img/” + isbn + “.png’ alt=’Cover’>”**\n\
    \n**response += “<img src=’img/power.png’ alt=’Power’>”**\n\n![image](images/hot.jpg)\n\
    \nNotice that single quotes are used inside the string to distinguish between\
    \ the outer double quotes, and so avoid prematurely terminating the string.\n\n\
    ![image](images/4o.jpg)Finally, add a statement to send the response\n\n**io.WriteString(\
    \ w, response )**\n\n![image](images/pg185_1.jpg)\n\n![image](images/5o.jpg)Save\
    \ the updated program file once more and start the web server, then visit localhost:8000/form.html\
    \ to send requests and receive responses\n\n![image](images/pg185_2.jpg)\n\n![image](images/pg185_3.jpg)\n\
    \n![image](images/pg185_4.jpg)\n\n![image](images/pg185_5.jpg)\n\n![image](images/hot.jpg)\n\
    \nYou can discover many more programming language books in this series – including\
    \ R for Data Analysis in easy steps that covers the R programming language – at\
    \ [www.ineasysteps.com](http://www.ineasysteps.com)\n\n**Summary**\n\n•The Go\
    \ standard library net/http package provides utilities to create a web server.\n\
    \n•The http.ListenAndServe( ) function specifies an address at which to listen,\
    \ and the name of a request handler.\n\n•A web server program must register route\
    \ handlers that specify how to respond to particular requests.\n\n•The http.HandleFunc(\
    \ ) function specifies a route to listen for, and the name of a function that\
    \ will handle that request.\n\n•A request handler function signature always has\
    \ parameters for an http.ResponseWriter object and an http.Request object.\n\n\
    •An http.ResponseWriter object has a Write( ) method that can accept a \\[ \\\
    ]byte slice to send in a response.\n\n•The io package provides a WriteString(\
    \ ) function that can pass a string to an http.ResponseWriter object for a response.\n\
    \n•Files can be added to a web server program to be delivered to the browser in\
    \ response to its requests.\n\n•The http.Dir( ) function nominates a root file\
    \ system path.\n\n•The http.FileServer( ) function returns a handler for the contents\
    \ of the file system specified as its argument.\n\n•The http.Handle( ) function\
    \ specifies a route and the name of a handler for requests made to the nominated\
    \ file system.\n\n•The http.Request.ParseForm( ) method populates an http.Request.Form\
    \ object with submitted form data.\n\n•The http.Request.Method object contains\
    \ the value assigned to the HTML form’s method attribute.\n\n•The http.Error(\
    \ ) function can use an http.ResponseWriter object to send an error message and\
    \ status to the browser.\n\n•The Go standard library log package has SetOutput(\
    \ ) and Print( ) functions to write time-stamped items to a log file.\n\n•A web\
    \ server program can build an HTML string to send a dynamic response to the web\
    \ browser.\n\n[![image](images/ibc1.jpg)](https://iescourses.com/)"
