  trans: "\n\n你可以通过调用 `Time` 数据类型的 `Zone()` 方法来确定与其关联的时区。该方法返回两个值：一个三字母的 `TZ` 时区缩写（例如“EST”（东部标准时间）或“EDT”（东部夏令时间），以及一个表示该时区相对于\
    \ UTC 偏移秒数的数值值。需要注意的是，时区缩写并不是唯一的，因此你不应仅依赖这些缩写来识别特定的时区。某些时区会在夏令时期间调整其时间，因此你可能需要同时评估\
    \ `TZ` 缩写和偏移量来正确识别时区。\n\n![image](img/hot.jpg)\n\n本书的下载文件中包含一份 IANA 地位置名称和 `TZ`\
    \ 缩写列表——请参见第 6 页。\n\n![image](img/hot.jpg)\n\n美国的夏令时会将 UTC 偏移量减少一小时。例如，东部夏令时间\
    \ (EDT) 为 UTC - 4 小时，中部夏令时间 (CDT) 为 UTC - 5 小时，等等。\n\n![image](img/1b.jpg)首先在程序中导入\
    \ Go 标准库的 time 包\n\n```go\nimport (\n    \"fmt\"\n    \"time\"\n)\n```\n\n![image](img/commons.jpg)\n\
    \n`src\\zone\\main.go`\n\n![image](img/2b.jpg)接下来，在指定位置创建并初始化带有字符串值和 `Time` 数据类型的变量\n\
    \n```go\nzone := \"All\"\nloc, _ := time.LoadLocation(\"America/New_York\")\n\
    dt := time.Now().In(loc)\n```\n\n![image](img/3b.jpg)确定时区缩写和偏移秒数，然后将偏移量转换为正分钟数\n\
    \n```go\nabbr, offset := dt.Zone()\nif offset < 1 {\n    offset = offset * -1\n\
    }\noffset /= 60\n```\n\n![image](img/4b.jpg)现在，评估缩写和偏移量值\n\n```go\nswitch {\n\
    case abbr == \"EST\" && offset == 300:\n    zone = \"East Coast\"\ncase abbr ==\
    \ \"EDT\" && offset == 240:\n    zone = \"East Coast\"\n}\n```\n\n![image](img/5b.jpg)显示时区详情和适当消息\n\
    \n```go\nfmt.Printf(\"\\nTZ: %v Offset Minutes: %v \\n\", abbr, offset)\nfmt.Println(\"\
    Welcome to\", zone, \"Visitors!\")\n```\n\n![image](img/6b.jpg)将程序文件保存到“zone”目录中，然后运行程序以查看时区值\n\
    \n![image](img/pg121_1.jpg)\n\n![image](img/forget.jpg)\n\n由于空间限制，这里使用 `_` 空标识符来忽略返回的错误值，但理想情况下你应该包含错误处理器。\n\
