    \ can then be called by appending the `()` call operator after the variable name\
    \ – and can access the persistent value in the outer function.\n\nIt can be difficult\
    \ to grasp the concept of closures, as it would seem that the variable in the\
    \ outer function should be destroyed when the self-invoking function has completed\
    \ execution.\n\n![image](images/hot.jpg)\n\nDon’t worry if you can’t immediately\
    \ understand how closures work. They can seem mystical at first, but will become\
    \ clearer with experience. You can continue on and come back to this technique\
    \ later.\n\n![image](images/1o.jpg)Begin a main function by assigning an anonymous\
    \ function to a variable\n\n```go\nfunc main( ) {\n    area := func( length, width\
    \ int ) int {\n        return length * width\n    }\n}\n```\n\n![image](images/commono.jpg)\n\
    \nsrc\\anon\\main.go\n\n![image](images/2o.jpg)Next, insert statements to display\
    \ the anonymous function’s type and two returned values\n\n```go\nfmt.Printf(\
    \ \"area Type: %T \\n\", area )\nfmt.Println( \"Area 1:\", area( 10, 4 ) )\nfmt.Println(\
    \ \"Area 2:\", area( 12, 5 ) )\n```\n\n![image](images/3o.jpg)Now, insert statements\
    \ to assign an anonymous self-invoking closure function to a variable\n\n```go\n\
    counter := func( ) func( ) int {\n    num := 0\n    return func( ) int {\n   \
    \     num++\n        return num\n    }\n} ( )\n```\n\n![image](images/4o.jpg)Finally,\
    \ insert statements to display the closure function’s type and three returned\
    \ values\n\n```go\nfmt.Printf( \"counter type: %T \\n\", counter )\nfmt.Println(\
    \ \"Count:\", counter( ) )\nfmt.Println( \"Count:\", counter( ) )\nfmt.Println(\
    \ \"Count:\", counter( ) )\n```\n\n![image](images/5o.jpg)Save the program file\
    \ in an “anon” directory, then run the program to see the function types and returned\
    \ values\n\n![image](images/pg73_1.jpg)\n\n![image](images/forget.jpg)\n\nNotice\
    \ that the outer function must state its return type as `func() int` because it\
    \ will return a function that will in turn return an integer value.\n\n## Pass\
    \ Functions\n\n![image](images/pg74_1.jpg)\n\n### Programmer-defined Function\
    \ Types\n\nThe output from the previous example [hereon page 73](#chapter05.xhtml#assigning)\
    \ describes the function by its signature, for example, `counter type : func()\
    \ int`. You can declare a custom function type using the `type` keyword, followed\
    \ by a type name of your choice, and a function signature. For example, a custom\
    \ function named “adder” that must receive two integer arguments and return one\
    \ integer argument, like this:\n\n`type adder func( int, int ) int`\n\nVariables\
    \ can then be created as “instances” of the custom function type, and be assigned\
    \ a function definition – whose signature must match that in the custom function\
    \ type declaration. The function (instance) can be called in the usual way.\n\n\
    ### Higher-order Functions\n\nRegular functions that receive value or reference\
    \ arguments, and return these types to the caller, are called “first-order” functions.\
    \ But functions can also be passed as arguments to other functions, and functions\
    \ can return functions to the caller. Any function that accepts functions as arguments,\
    \ or any function that returns one or more functions, is regarded as a “higher-order”\
    \ function.\n\nPassing functions to other functions allows actions to be modified\
    \ without repeating existing lines of code.\n"
  trans: "\n\n![image](img/pg69_2.jpg)\n\n![image](img/forget.jpg)\n\n返回的“Result”字符串值在此处未使用。\n\
    \n## 递归调用\n\n自定义函数中的语句可以像调用标准库函数 `fmt.Printf()` 一样自由地调用其他自定义函数。此外，函数可以“递归调用自己”。与循环一样，重要的一点是递归函数调用必须修改表达式以避免连续执行\
    \ – 这样函数会在某处退出。\n\n![image](img/pg70_1.jpg)\n\n递归函数调用可以模拟循环结构，如第 55 页 所示：\n\n\
    ![image](img/1o.jpg)创建一个需要整数参数的函数，并递归调用它直到该值减到零：\n\n```go\nfunc countDn( num int\
    \ ) {\n    if num < 1 {\n        fmt.Println( \"\\t\\t\\tLift Off!\" )\n    }\
    \ else {\n        fmt.Println( \"\\t\\t\\tCountdown\", num )\n        num--\n\
    \        countDn( num )\n    }\n}\n```\n\n![image](img/commono.jpg)\n\nsrc\\recur\\\
    main.go\n\n![image](img/2o.jpg)创建一个包含调用上述函数语句的 main 函数：\n\n```go\nfunc main( )\
    \ {\n    countDn( 10 )\n}\n```\n\n![image](img/3o.jpg)将程序文件保存在“recur”目录中，然后运行程序以查看递归调用如何模拟循环：\n\
    \n![image](img/pg70_2.jpg)\n\n![image](img/pg70_3.jpg)递归函数调用用于解决数学问题，例如给定数字的阶乘。阶乘是从给定数字到\
    \ 1 的所有整数的乘积 – 例如 3 的阶乘是 6 (3 * 2 * 1)。\n\n![image](img/1o.jpg)创建一个需要整数参数的函数，并在每次调用时返回一个整数值：\n\
    \n```go\nfunc facto( num int ) int {\n    // 在此处插入语句\n}\n```\n\n![image](img/commono.jpg)\n\
    \nsrc\\facto\\main.go\n\n![image](img/2o.jpg)接下来，当参数值减到零 (0) 时插入一条语句返回 1 (1)：\n\
    \n```go\nif num == 0 {\n    return 1\n}\n```\n\n![image](img/3o.jpg)然后，插入最后一条语句递归调用该函数，以乘以序列中的所有数字：\n\
    \n```go\nreturn num * facto( num - 1 )\n```\n\n![image](img/4o.jpg)添加一个包含打印阶乘语句的\
    \ main 函数：\n\n```go\nfunc main( ) {\n    for i := 1 ; i <= 7 ; i++ {\n       \
    \ fmt.Println( \"Factorial\", i, \"=\", facto( i ) )\n    }\n}\n```\n\n![image](img/5o.jpg)将程序文件保存在“facto”目录中，然后运行程序查看阶乘序列：\n\
    \n![image](img/pg71_1.jpg)\n\n![image](img/snake.jpg)递归函数很有用但效率不高。此示例调用了 35 次\
    \ `facto()`来生成这 7 个阶乘序列！\n\n## 匿名封装\n\nGo 编程语言支持“一等函数”。这允许函数被赋值给变量、作为参数传递给其他函数以及从函数中返回。\n\
    \n![image](img/pg72_1.jpg)\n\n### 匿名函数\n\n匿名函数简单是不包含名称的函数定义。这对于内联创建函数而无需对其命名非常有用。匿名函数也被称为“函数字面量”。与其他函数一样，这些函数可以包含参数列表、返回类型列表，并返回多个值。你可以通过在函数定义末尾附加\
    \ `()` 运算符来创建一个自执行匿名函数表达式，如下：\n\n```go\nfunc( ) { fmt.Println( \"Function Literal\"\
    \ ) } ( )\n```\n\n此外，可以将匿名函数赋值给变量，然后在变量名后附加 `()` 运算符进行调用，如下：\n\n```go\nfn := func(\
    \ ) { fmt.Println( \"Function Literal\" }\nfn( )\n```\n\n![image](img/hot.jpg)\n\
    \n自执行函数表达式只执行一次。\n\n### 闭包\n\n匿名函数最有用的可能是创建“闭包”。闭包是嵌套在外部函数内部的函数，它保留了对外部函数中声明的变量的访问。外部函数可以返回一个保留对这些变量访问权限的匿名函数，但关重要的是，这些变量在程序代码的其他任何地方都是无法访问的。这是封装的形式，当返回的匿名函数“捕获”它们时，保护了存储在这些变量中的数据。\n\
    \n通过在外部函数定义结束后附加 `()` 运算符，可以将闭包变为自执行并赋值给变量。然后可以通过变量名后附加 `()` 运算符来调用匿名内部函数 – 它可以访问外部函数中的持久值。\n\
    \n理解闭包的概念可能很困难，因为在自执行函数完成执行后，外部函数中的变量应该被销毁。\n\n![image](img/hot.jpg)\n\n如果你无法理解闭包是如何工作的，请不要担心。它们起初看起来很神秘，但随着经验的增加会变得清晰。你可以继续并在稍后回来这种技术。\n\
    \n![image](img/1o.jpg)通过将匿名函数赋值给变量来开始 main 函数：\n\n```go\nfunc main( ) {\n    area\
    \ := func( length, width ) int {\n        return length * width\n    }\n}\n```\n\
    \n![image](img/commono.jpg)\n\nsrc\\anon\\main.go\n\n![image](img/2o.jpg)接下来，插入语句显示匿名函数的类型和返回值：\n\
    \n```go\nfmt.Printf( \"area Type: %T \\n\", area )\nfmt.Println( \"Area 1:\",\
    \ area( 10 ) )\nfmt.Println( \"Area 2:\", area( 12 ) )\n```\n\n![image](img/3o.jpg)现在，插入语句将自执行闭包函数赋值给变量：\n\
    \n```go\ncounter := func( ) func() int {\n    num := 0\n    return func( ) int\
    \ {\n        num++\n        return num\n    }\n}( )\n```\n\n![image](img/4o.jpg)最后，插入语句显示闭包函数的类型和返回值：\n\
    \n```go\nfmt.Printf( \"counter type: %T \\n\", counter )\nfmt.Println( \"Count:\"\
    , counter( ) )\nfmt.Println( \"Count:\", counter( ) )\nfmt.Println( \"Count:\"\
    , counter( ) )\n```\n\n![image](img/5o.jpg)将程序文件保存在“anon”目录中，然后运行程序查看函数类型和返回值：\n\
    \n![image](img/pg73_1.jpg)\n\n![image](img/forget.jpg)\n\n注意，外部函数必须声明其返回类型为 `func()\
    \ int`，因为它返回的是一个返回整数值的函数。\n\n"
