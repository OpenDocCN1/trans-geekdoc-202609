    **Slices Versus Arrays**


    An array contains a sequence of values, whereas a slice contains a reference to
    a sequence of values. This is an important distinction in Go programming that
    applies to many of its types. Most significantly, when passing a type to a function,
    those types that are value-based will receive a copy of the original, whereas
    those types that are references will point to the actual original. In order for
    the function to operate on an original value, you therefore need to use pointers
    when passing value-based types to a function, but no pointers are needed when
    passing references.


    ![image](images/pg106_1.jpg)


    ![image](images/pg106_2.jpg)


    Another distinction between arrays and slices concerns “variadic” functions that
    can be called with any number of arguments. You cannot pass array element values
    to a variadic function unless you first “convert” the array to a slice by copying
    the array element values into slice elements.


    You can create a variadic function simply by prefixing the final parameter’s data
    type with the … wildcard operator in the function signature, using this syntax:


    **func *funcName* ( *paramName* …*dataType* )**


    Variadic functions can be called in the usual way, enclosing a comma-separated
    list of arguments within **( )** parentheses.


    Variadic functions are especially useful when passing the values in slice elements
    to a function, as the length of a slice may change during the execution of a program.
    Regardless of the length of the slice, its element values can be passed to a variadic
    function by specifying the slice name followed by the … wildcard operator, within
    the parentheses of a function call:


    ***funcName* ( *sliceName*… )**


    ![image](images/hot.jpg)


    The **fmt.Printf( )** function is a variadic function – it requires one fixed
    argument at the beginning, then accepts any number of subsequent arguments.


