    \ \\\\n”, perim )**\n\n![image](images/6r.jpg)Save the program file in an “area”\
    \ directory, then run the program to see the calculated values\n\n![image](images/pg135_1.jpg)\n\
    \n![image](images/forget.jpg)\n\nRefer back [hereto page 24](#chapter02.xhtml#sec10)\
    \ for more on formatting decimal places in output.\n\nEvaluate Numbers\n\n![image](images/pg136_1.jpg)\n\
    \nThe Go **math** package provides these useful functions that can be used to\
    \ evaluate **float64** arguments:\n\n| **Function** || **Returns** |\n\n| ---\
    \ | --- |\n\n| **math.Abs( )** || An absolute value |\n\n| **math.Acos( )** ||\
    \ An arc cosine value |\n\n| **math.Asin( )** || An arc sine value |\n\n| **math.Atan(\
