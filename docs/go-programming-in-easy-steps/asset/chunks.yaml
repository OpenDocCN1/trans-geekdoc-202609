    \ )** || The nearest integer value |\n\n| **math.Sin( )** || A sine value |\n\n\
    | **math.Sqrt( )** || A square root value |\n\n| **math.Tan( )** || A tangent\
    \ value |\n\n![image](images/hot.jpg)\n\nThe **math.IsNan( )** function (Is-Not-a-number)\
    \ is useful to discover whether a value cast to the **float64** data type is indeed\
    \ a number.\n\n![image](images/hot.jpg)\n\nThe **math** package contains lots\
    \ more functions but those listed here are useful for many mathematical operations.\
    \ Discover more in the Go documentation at **[golang.org/pkg/math](http://www.golang.org/pkg/math)**\n\
    \n![image](images/1r.jpg)Begin by importing the Go standard library math package\
