- raw: '[**Juggle Bits**](#chapter03.xhtml#sec19)


    [**Understand Precedence**](#chapter03.xhtml#sec20)


    [**Summary**](#chapter03.xhtml#sec21)


    Do Arithmetic


    ![image](images/pg34_1.jpg)


    The arithmetic operators commonly used in Go programs are listed in the table
    below, together with the operation they perform:


    | **Operator** || **Operation** |


    | --- | --- |


    | **+** || Addition |


    | **\-** || Subtraction |


    | **\*** || Multiplication |


    | **/** || Division |


    | **%** || Remainder |


    | **++** || Increment |


    | **\--** || Decrement |


    The operators for assignment, addition, subtraction, multiplication, and division
    act as you would expect, but care must be taken to group expressions where more
    than one operator is used – operations within innermost ( ) parentheses are performed
    first:


    **a = b \* c - d % e / f ;                   // This is unclear.**


    **a = ( b \* c ) - ( ( d % e ) / f ) ;     // This is clearer.**


    The % remainder operator divides the first given number by the second given number
    and returns the remainder of the operation. This is useful to determine if a number
    has an odd or even value.


    The ++ increment operator and \-- decrement operator alter the given number by
    one and return the resulting value. These are most commonly used to count iterations
    in a loop – counting up on each iteration with the ++ increment operator, or counting
    down on each iteration with the \-- decrement operator.


    The ++ increment or \-- decrement operator must be placed immediately after a
    variable name to alter its value. For example:


    **n := 4**


    **n++            // Now n = 5.**


    ![image](images/forget.jpg)


    The **+** operator is dual-purpose – it is also used to concatenate strings.


    ![image](images/hot.jpg)


    Values used with operators to form expressions are called “operands” – in the
    expression **2 + 3** the numerical values **2** and **3** are the operands.


    ![image](images/1g.jpg)Create a directory named “arith” inside your “src” folder


    ![image](images/commong.jpg)


    src\\arith\\main.go


    ![image](images/2g.jpg)Begin a main.go program with package and import declarations


    **package main**


    **import “fmt”**


    ![image](images/3g.jpg)Add a main function that declares and initializes two variables


    **func main( ) {**


    **a := 8**


    **b := 4**


    **// Statements to be inserted here.**


    **}**


    ![image](images/4g.jpg)In the main function, insert statements to output the sum
    resulting value after each arithmetical operation


    **fmt.Println( “Addition:\\t”, ( a + b ) )**


    **fmt.Println( “Subtraction:\\t”, ( a - b ) )**


    **fmt.Println( “Multiplication:\\t”, ( a \* b ) )**


    **fmt.Println( “Division:\\t”, ( a / b ) )**


    **fmt.Println( “Remainder:\\t”, ( a % b ) )**


    ![image](images/5g.jpg)Now, insert statements to change the stored values and
    display their new value


    **a++**


    **fmt.Println( “Increment:\\t”, a )**


    **b--**


    **fmt.Println( “Decrement\\t”, b )**


    ![image](images/6g.jpg)Save the program file in the “arith” directory, then run
    the program to see the results of each operation


    ![image](images/pg35_2.jpg)


    ![image](images/forget.jpg)


    Here, the **\\t** escape sequence is used to output a tab space to align the results.


    **Assign Values**


    ![image](images/pg36_1.jpg)


    The operators that are used in Go programming to assign values are listed in the
    table below. All except the simple **\=** assignment operator are a shorthand
    form of a longer expression, so each equivalent is given for clarity:


    | **Operator** || **Example** || **Equivalent** |


    | --- | --- | --- |


    | **\=** || **a = b** || **a = b** |


    | **+=** || **a += b** || **a = ( a + b )** |


    | **\-=** || **a -= b** || **a = ( a - b )** |


    | **\*=** || **a \*= b** || **a = ( a \* b )** |


    | **/=** || **a /= b** || **a = ( a / b )** |


    | **%=** || **a %= b** || **a = ( a % b )** |


    In the assignment example above, where a = b, the variable named “a” is assigned
    the value that is contained in the variable named “b” – so that is then the value
    stored in the a variable. Technically speaking, the assignment operator stores
    the value of the right-hand operand in the memory location denoted by the left-hand
    operand, then returns the value as a result.


    The += combined operator is useful to add a value onto an existing value that
    is stored in a variable. In the example above, where a += b, the value in variable
    b is added to that in variable a – so the total is then the value stored in the
    a variable. The arithmetic operation is performed first with the grouped operands.
    The result is then stored in the memory location denoted by the first variable
    and returned.


    All the other combined operators work in the same way by performing the arithmetical
    operation between the two values first, then assigning the result of that operation
    to the first variable – to become its new stored value.


    With the %= combined operator, the grouped left-hand operand a is divided by the
    grouped right-hand operand b, then the remainder of that operation is assigned
    to the a first variable.


    ![image](images/forget.jpg)


    The **+=** combined operator is dual-purpose – it can also be used to concatenate
    strings.


    ![image](images/snake.jpg)


    It is important to regard the **\=** operator to mean “assign” rather than “equals”
    to avoid confusion with the **\==** equality operator that is described [hereon
    page 38](#chapter03.xhtml#sec17).


    ![image](images/1g.jpg)Create a directory named “assign” inside your “src” folder


    ![image](images/commong.jpg)


    src\\assign\\main.go


    ![image](images/2g.jpg)Begin a main.go program with package and import declarations


    **package main**


    **import “fmt”**


    ![image](images/3g.jpg)Add a main function that declares two variables


    **func main( ) {**


    **var a, b int**


    **// Statements to be inserted here.**


    **}**


    ![image](images/4g.jpg)In the main function, insert statements to output simply
    assigned values


    **a, b = 8, 4**


    **fmt.Println( “Assigned Values:\\ta =”, a, “\\tb =”, b )**


    ![image](images/5g.jpg)Now, insert statements to change the value stored in the
    first variable and display its new value


    **a += b                // a = 8 + 4.**


    **fmt.Println( “Add and Assign:\\ta =”, a )**


    **a -= b                // a = 12 - 4.**


    **fmt.Println( “Subtract and Assign:\\ta =”, a )**


    **a \*= b                // a = 8 \* 4.**


    **fmt.Println( “Multiply and Assign:\\ta =”, a )**


    **a /= b                // a = 32 / 4.**


    **fmt.Println( “Divide and Assign:\\ta =”, a )**


    **a %= b                // a = 8 % 4.**


    **fmt.Println( “Remainder Assigned:\\ta =”, a )**


    ![image](images/6g.jpg)Save the program file in the “assign” directory, then run
    the program to see the results of each operation


    ![image](images/pg37_1.jpg)


    ![image](images/hot.jpg)


    Notice here how multiple variables are initialized in a single statement.


    ![image](images/snake.jpg)


    The operands must be of the same data type.


    **Make Comparisons**


    ![image](images/pg38_1.jpg)


    The operators that are commonly used in Go programming to compare two numerical
    values are listed in the table below:


    | **Operator** || **Comparative Test** |


    | --- | --- |


    | **\==** || Equality |


    | **!=** || Inequality |


    | **\>** || Greater than |


    | **<** || Less than |


    | **\>=** || Greater than or equal to |


    | **<=** || Less than or equal to |


    The \== equality operator compares two operands and will return true if both are
    equal in value, otherwise the \== operator will return false. If both are the
    same number they are equal, or if both are characters their ASCII code values
    are compared numerically.


    Conversely, the != inequality operator returns true if two operands are not equal,
    using the same rules as the \== equality operator, otherwise it returns false.
    Equality and inequality operators are useful in testing the state of two variables
    to perform conditional branching in a program.'
