  trans: "\n\n与其他某些编程语言不同，Go 没有类，但可以使用结构体（structs）来表示对象。\n\n![image](img/1bl.jpg)\n\
    ### 通过创建一个结构体类型开始程序\n\n```go\ntype car struct {\n    color string\n    body string\n\
    }\n```\n\n![image](img/commonb.jpg)\n\n`src\\method\\main.go`\n\n![image](img/2bl.jpg)\n\
    ### 接下来，为结构体类型附加一个方法\n\n```go\nfunc ( c car ) accelerate( ) string {\n    return\
    \ “accelerating-->”\n}\n```\n\n![image](img/3bl.jpg)\n### 现在，通过创建两个结构体类型的实例开始\
    \ main 函数\n\n```go\nporsche := car{ color: “blue”, body: “coupe” }\nbentley :=\
    \ car{ color: “green”, body: “saloon” }\n```\n\n![image](img/4bl.jpg)\n### 添加语句显示第一个实例的所有值\n\
    \n```go\nfmt.Println( “Porsche paint is”, porsche.color )\nfmt.Println( “Porsche\
    \ style is”, porsche.body )\nfmt.Println( “Porsche is”, porsche.accelerate( )\
    \ )\n```\n\n![image](img/5bl.jpg)\n### 最后，添加语句显示第二个实例的所有值\n\n```go\nfmt.Println(\
    \ “Bentley paint is”, bentley.color )\nfmt.Println( “Bentley style is”, bentley.body\
    \ )\nfmt.Println( “Bentley is”, bentley.accelerate( ) )\n```\n\n![image](img/6bl.jpg)\n\
    ### 将程序文件保存在 “method” 目录中，然后运行程序查看结构体字段的值\n\n![image](img/pg85_1.jpg)\n\n![image](img/hot.jpg)\n\
    \n当你调用方法时，Go 会自动处理值和指针之间的转换，因此，如果你想让方法能够修改原始结构体字段，这里的接收者可以是 `( c *car )`。\n\n\
    ## 嵌入结构体 (Embed Structs)\n\n由于结构体字段只需简单地声明名称和类型，且结构体本身是一种类型，Go 编程甚至允许你通过声明一个结构体类型的字段，将一个结构体嵌入另一个结构体中。\n\
    \n![image](img/pg86_1.jpg)\n\n```go\ntype structName struct {\n    fieldName embeddedStructName\n\
    }\n```\n\n这对于构建高效使用用途多变的结构体的结构非常有用。例如，取一个仅存储 X 和 Y 坐标的结构体：\n\n```go\ntype coords\
    \ struct {\n    x, y int\n}\n```\n\n这可能被用于存储图表上的位置、矩形的顶点等，或者在嵌入另一个结构体时作为圆的中心点，如下所示：\n\
    \n```go\ntype circle struct {\n    radius int\n    center coords\n}\n```\n\n现在，当创建\
    \ circle 的实例时，可以通过链接结构体名称和字段名称来访问嵌入结构体的字段，如下：\n\n`instanceName.embeddedStructName.fieldName`\n\
    \n`instanceName.embeddedStructName.fieldName`\n\n这是可以接受的，但因为非常长，所以并不方便。幸运的是，Go\
    \ 通过支持结构体中的“匿名字段”（anonymous fields）提供了此问题的解决方案。这些字段只是指定另一个结构体的名称作为字段，而没有指定字段名称：\n\
    \n```go\ntype circle struct {\n    radius int\n    coords\n}\n```\n\n这样做的好处是它允许你缩短访问嵌入结构体字段所需的代码：\n\
    \n`instanceName.fieldName`\n\n`instanceName.fieldName`\n\n![image](img/forget.jpg)\n\
    \n匿名字段必须是具名类型，或者是指向具名类型的指针。\n\n![image](img/1bl.jpg)\n### 通过创建两个结构体类型开始程序\n\n\
    ```go\ntype coords struct {\n    x, y int\n}\n\ntype circle struct {\n    radius\
    \ int\n    coords\n}\n```\n\n![image](img/commonb.jpg)\n\n`src\\embed\\main.go`\n\
    \n![image](img/2bl.jpg)\n### 接下来，为第二个结构体附加一个方法\n\n```go\nfunc ( c circle ) getDiameter(\
    \ ) int {\n    return c.radius * 2\n}\n```\n\n![image](img/3bl.jpg)\n### 现在，通过创建一个结构体类型的实例开始\
    \ main 函数\n\n```go\nvar ring circle\n```\n\n![image](img/4bl.jpg)\n### 添加语句为结构体字段和嵌入结构体字段赋值\n\
    \n```go\nring.radius = 15\nring.x = ring.radius\nring.y = ring.radius\n```\n\n\
    ![image](img/5bl.jpg)\n### 最后，添加语句显示值\n\n```go\nfmt.Printf( “Diameter:%v \\n”,\
    \ ring.getDiameter( ) )\nfmt.Printf( “Point X:%v Y:%v \\n”, ring.x, ring.y )\n\
    ```\n\n![image](img/6bl.jpg)\n### 将程序文件保存在 “embed” 目录中，然后运行程序查看结构体字段的值\n\n![image](img/pg7_1)\n\
    \n## 封装特性 (Encapsulate Features)\n\n在 Go 中表示对象的能力是面向对象编程（OOP）基石。封装使用方法来表达附加在结构上的属性和操作，因此程序无需直接访问数据。封装在\
    \ Go 编程中依赖于对包的数据隐藏。变量名、函数名和方法名如果以大字母开头，将导出到程序。以小字母开头的将是不可访问的即它们被封装了。\n\n![image](img/pg88_1)\n\
    \n![image](img/1bl.jpg)\n### 首先，创建一个 cube.go 文件，包含包声明和结构体定义\n\n```go\npackage\
    \ cube\n\n// Dims 导出。\ntype Dims struct {\n    width, length, height int\n}\n\
    ```\n\n![image](img/commonb.jpg)\n\n`src\\cube\\cube.go`\n\n![image](img/2bl.jpg)\n\
    ### 接下来，添加四个操作结构字段的方法\n\n```go\nfunc ( d *Dims ) area( ) int {\n    return d.width\
    \ * d.length\n}\n\n// SetSize 导出。\nfunc ( d *Dims ) SetSize( w, l, h int ) {\n\
    \    d.width = w\n    d.length = l\n    d.height = h\n}\n\n// GetVolume 导出。\n\
    func ( d *Dims ) GetVolume( ) int {\n    return d.width * d.length * d.height\n\
    }\n\n// GetArea 导出。\nfunc ( d *Dims ) GetArea( ) int {\n    return d.area( )\n\
    }\n```\n\n![image](img/hot.jpg)\n### 查看相同类型的字段可以以逗号分隔列表声明，就像变量声明一样。\n\n```go\n\
    package main\n\nimport (\n    “cube”\n    “fmt”\n)\n\nfunc main() {\n    var a,\
    \ b cube.Dims\n}\n```\n\n`src\\encap\\main.go` (隐含路径)\n\n### 接下来，通过创建一个导入的结构体的实例开始\
    \ main 函数\n\n```go\nvar box cube.Dims\n```\n\n![image](img/2bl.jpg)\n### 现在，调用导入的方法为结构体字段赋值\n\
    \n```go\nbox.SetSize( 2, 4, 6 )\n```\n\n![image](img/3bl.jpg)\n### 那么，调用其他导入的方法，使用赋值的字段值计算结果\n\
    \n```go\nfmt.Println( “Footprint:”, box.GetArea( ) )\nfmt.Println( “Volume:”,\
    \ box.GetVolume( ) )\n```\n\n![image](img/4bl.jpg)\n### 在 main 函数中添加这些语句，它们尝试引用未导出的字段和方法\n\
    \n```go\nfmt.Println( “Width:”, box.width )\nfmt.Println( “Area:”, box.getArea(\
    \ ) )\n```\n\n编译将失败，并提示 `box.width undefined` 和 `box.getArea undefined` 错误信息。\n\
    \n"
