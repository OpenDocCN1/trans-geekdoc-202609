    \ a “versus” directory, then run the program to see the parameter values\n\n![image](images/pg107_1.jpg)\n\
    \n![image](images/forget.jpg)\n\nWhen calling a variadic function, you are not\
    \ passing the slice itself – you are merely passing the slice element values.\n\
    \n## Map Keys and Values\n\nMultiple items of data can be stored with associated\
