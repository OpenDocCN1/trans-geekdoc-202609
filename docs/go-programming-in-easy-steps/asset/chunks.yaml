    How to Use This Book


    The examples in this book demonstrate features of the Go programming language
    (“golang”), and the screenshots illustrate the actual results produced by the
    listed code examples. Certain colorization conventions are used to clarify the
    code listed in the steps…


    Program code is colored black but keywords and built-in functions of the Go language
    are colored blue, literal text and numeric values are red, and code comments are
    green, like this:


    **package main**


    **import “fmt”**


    **main( ) {**


    **// My First Go Program.**


    **fmt.Println( “Hello World!” )**


    **}**


    During setup of Go, you will select a “GOPATH” location on your computer in which
    to create programs. Each program will be created within a uniquely named folder
    in a GOPATH sub-directory named “src”. To identify the source code for the example
    programs described in the steps, an icon and file path appears in the margin alongside
    the steps:


    ![image](images/pg6_1.jpg)


    src/hello/main.go


    **Grab the Source Code**


    For convenience, the source code files from all examples featured in this book
    are available in a single ZIP archive. You can obtain this archive by following
    these easy steps:


    ![image](images/1g1.jpg)Browse to **[www.ineasysteps.com](http://www.ineasysteps.com)**
    then navigate to Free Resources and choose the Downloads section


    ![image](images/2g1.jpg)Next, find GO Programming in easy steps in the list, then
    click on the hyperlink entitled All Code Examples to download the ZIP archive
    file


    ![image](images/3g1.jpg)Now, extract the archive contents to the GOPATH/src sub-directory
    on your computer


    If you don’t achieve the result illustrated in any example, simply compare your
    code to that in the original example files you have downloaded to discover where
    you went wrong.


