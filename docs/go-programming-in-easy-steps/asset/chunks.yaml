    \n```\nweekend := days[ 5 : ]\n```\n\n![image](img/3v.jpg)现在，添加语句来显示切片的内容和类型\n\
    \n```\nfmt.Printf( “Slice weekend: %v \\n”, weekend )\nfmt.Printf( “Type weekend\
    \ : %T \\n”, weekend )\n```\n\n![image](img/4v.jpg)添加语句显示切片的长度和容量\n\n```\nfmt.Printf(\
