    **Buffer Input**


    When you want to gather larger items of data into your program it is often preferable
    to store the data stream in a memory buffer. The Go standard library bufio (buffered
    input/output) package provides a Scanner type, which is a memory buffer with several
    useful methods to handle data streams. You can make this available to your program
    by importing the bufio package.


    ![image](images/pg146_1.jpg)


    A Scanner instance is first created by specifying a source from which to read
    data as an argument to the bufio package’s NewScanner( ) function. When the source
    is to be user input, you can import the Go standard library os package and specify
    os.Stdin (standard input) as the argument to NewScanner( ).


    The Scanner instance has a Scan( ) method that reads all the user input and a
    Text( ) method that returns the input that has been read as a single string value.


    The Scanner instance also has an Err( ) method that will return any read error.
    If no error is encountered, the error value will be nil as usual. It is useful
    to check for errors after calling the Scan( ) method and Text( ) method.


    If you want to separate the input into individual string items, you can import
    the Go standard library strings package and specify the input to its Fields( )
    function, to split the string into words.


    ![image](images/1g.jpg)Begin by importing the Go standard library bufio, os, and
    strings packages into a program, to handle input


    **import (**


    **“fmt”**


    **“bufio”**


    **“os”**


    **“strings”**


    **)**


    ![image](images/commong.jpg)


    src\\buffer\\main.go


    ![image](images/2g.jpg)Next, request user input


    **fmt.Print( “\\nEnter Text:” )**


    ![image](images/3g.jpg)Now, create a Scanner instance to store the user input
    in a memory buffer, then read the user input


    **scanner := bufio.NewScanner( os.Stdin )**


    **scanner.Scan( )**


    ![image](images/4g.jpg)Then, output an error if one occurred or the stored data


    **if scanner.Err( ) != nil {**


    **fmt.Println( scanner.Err( ) )**


    **} else {**


    **fmt.Println( scanner.Text( ) )**


    **}**


    ![image](images/5g.jpg)Next, create a new Scanner instance to store other user
    input in a memory buffer


    **fmt.Print( “\\nEnter Text:” )**


    **scanner = bufio.NewScanner( os.Stdin )**


    **scanner.Scan( )**


    ![image](images/6g.jpg)Then, store individual items of the user input in individual
    elements of a slice


    **words := strings.Fields( scanner.Text( ) )**


    ![image](images/7g.jpg)Finally, output an error if one occurred, or list the individual
    items of user input


    **if scanner.Err( ) != nil {**


    **fmt.Println( scanner.Err( ) )**


    **} else {**


    **for i, v := range words {**


    **fmt.Printf( “%v: %v \\n”, i, v )**


    **}**


    **}**


    ![image](images/8g.jpg)Save the program file in a “buffer” directory, then run
    the program to see the user input


    ![image](images/pg147_1.jpg)


    ![image](images/hot.jpg)


    The **if** conditional test is made as the **Scan( )** method returns a boolean
    **true** value while reading input, but returns **false** when it reaches the
    end on input.


    **Command Flags**


    The command to run your program can recognize any number of parameters, so you
    can pass a space-separated list of argument values to the program when you run
    it. The Go standard library os (operating system) package provides an Args slice,
    which stores these argument values in individual elements. You can make this available
    to your program by importing the os package.


    ![image](images/pg148_1.jpg)


    It is important to note that the very first element in os.Args will always contain
    the path to your program – argument values are then stored sequentially in subsequent
