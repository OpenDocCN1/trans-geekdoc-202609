    \nChange the initial value of the `i` variable to `0` (zero) and run the program\
    \ again to see the first iteration of the loop get executed.\n\n## Break Out of\
    \ Loops\n\nThe `break` keyword can be used to prematurely terminate any loop when\
    \ a specified condition is met. The `break` statement is situated inside the loop\
    \ statement block and is preceded by a test expression. When the test returns\
    \ true, the loop ends immediately and the program proceeds on to the next task.\
    \ For example, in a nested inner loop it proceeds to the next iteration of the\
    \ outer loop.\n\n![image](images/pg56_1.jpg)\n\nThe `continue` keyword can be\
    \ used to skip a single iteration of a loop when a specified condition is met.\
    \ The `continue` statement is situated inside the loop statement block and is\
    \ preceded by a test expression. When the test returns true, that single iteration\
    \ ends.\n\n![image](images/1p.jpg)Begin a main function with a loop that performs\
    \ three iterations\n\n```go\nfunc main( ) {\n    for i := 1 ; i <= 3 ; i++ {\n\
    \        // Inner Loop to be inserted here.\n    }\n}\n```\n\n![image](images/commonp.jpg)\n\
    \nsrc\\break\\main.go\n\n![image](images/2p.jpg)Insert an inner loop that performs\
    \ three iterations\n\n```go\n// Statements to be inserted here.  \nfor j := 1\
    \ ; j <= 3 ; j++ {\n    fmt.Println( “Running i=”, i, “j=”, j )\n}\n```\n\n![image](images/3p.jpg)Save\
    \ the program file in a “break” directory, then run the program to see the output\
    \ on each loop iteration\n\n![image](images/pg56_2.jpg)\n\n![image](images/hot.jpg)\n\
    \nYou can also `break` to a label at a specific point outside of nested code blocks\
    \ – see an example of this [hereon page 66](#chapter11.xhtml#sec81).\n\n![image](images/4p.jpg)Next,\
    \ insert this break statement at the beginning of inner loop, to break out of\
    \ inner loop\n\n```go\nif i == 2 && j == 2 {\n    fmt.Println( “Breaks i=”, i,\
    \ “j=”, j )\n    break\n}\n```\n\n![image](images/5p.jpg)Now, insert this continue\
    \ statement before the break statement – to skip second iteration of inner loop\n\
    \n```go\nif i == 3 && j == 2 {\n    fmt.Println( “Continues i=”, i, “j=”, j )\n\
    \    continue\n}\n```\n\n![image](images/6p.jpg)Save the updated file, then run\
    \ the program once to see only the second iteration of inner loop\n\n![image](images/pg57_1.jpg)\n\
    \n![image](images/forget.jpg)\n\nHere, the `break` statement halts the second\
    \ and third iterations of inner loop when the outer loop tries to run for second\
    \ time.\n\n## Go to Labels\n\nThe `goto` keyword at first glance seems like a\
    \ great feature, as it allows the program flow to jump to a label at any position\
    \ in the program code, like a hyperlink on a web page. However, in reality this\
    \ can cause errors, its use is frowned upon, and it is generally considered bad\
    \ practice.\n\n![image](images/pg58_1.jpg)\n\nThe `goto` keyword jump is a powerful\
    \ feature that has existed in computer programs for decades, but its power was\
    \ abused by many early programmers who created programs that jumped around in\
    \ an unfathomable manner. This produced unreadable program code, so the use of\
    \ goto became unpopular.\n\nTypically, the program might execute a sequence of\
    \ statements, then a `goto` statement would jump back to a label at the beginning\
    \ of the sequence to repeat their execution. Additionally, a condition might be\
    \ tested at some point during the sequence, and a further `goto` statement might\
    \ jump to a point after the sequence to continue the program flow if the tested\
    \ condition was not met. In this way, the program code quickly gained lots of\
    \ confusing goto statements and labels.\n\nOne possible valid use of the `goto`\
    \ keyword is to break cleanly from an inner nested loop by jumping to a label\
    \ just after the end of its outer loop block. This immediately exits both loops\
    \ so no further iterations of either loop are executed.\n\n```go\nfunc main( )\
    \ {\n    for i := 1 ; i <= 3 ; i++ {\n        for j := 1 ; j <= 3 ; j++ {\n  \
    \          fmt.Println( “Running i=”, i, “j=”, j )\n            if i == 2 && j\
    \ == 2 {\n                goto end\n            }\n        }\n    }\n    end:\n\
    \    fmt.Println(\"Finished\")\n}\n```\n"
