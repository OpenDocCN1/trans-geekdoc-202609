    \ logarithm of constant *e*, with an approximate value of 0.43429 |\n\nThe math\
    \ constants are mostly used in Go programs that have a particular mathematical\
    \ purpose, but all the math package constants are listed above for completeness.\n\
    \n![image](images/hot.jpg)\n\nThe Golden Ratio appears many times in geometry\
