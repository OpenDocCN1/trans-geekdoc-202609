    ![image](images/pg106_1.jpg)\n\n![image](images/pg106_2.jpg)\n\nAnother distinction\
    \ between arrays and slices concerns “variadic” functions that can be called with\
    \ any number of arguments. You cannot pass array element values to a variadic\
    \ function unless you first “convert” the array to a slice by copying the array\
    \ element values into slice elements.\n\nYou can create a variadic function simply\
    \ by prefixing the final parameter’s data type with the … wildcard operator in\
    \ the function signature, using this syntax:\n\n`func *funcName* (*paramName*\
    \ …*dataType*)`\n\nVariadic functions can be called in the usual way, enclosing\
    \ a comma-separated list of arguments within `()` parentheses. \n\nVariadic functions\
    \ are especially useful when passing the values in slice elements to a function,\
    \ as the length of a slice may change during the execution of a program. Regardless\
    \ of the length of the slice, its element values can be passed to a variadic function\
    \ by specifying the slice name followed by the … wildcard operator, within the\
    \ parentheses of a function call:\n\n`*funcName* (*sliceName…)`\n\n![image](images/hot.jpg)\n\
    \nThe `fmt.Printf()` function is a variadic function – it requires one fixed argument\
    \ at the beginning, then accepts any number of subsequent arguments.\n\n![image](images/1v.jpg)Create\
    \ an array of three strings\n\n`array := [ 3 ]string{ “BMW”, “Ford”, “Opel” }`\n\
    \n![image](images/commonv.jpg)\n\n`src\\versus\\main.go`\n\n![image](images/2v.jpg)Copy\
    \ the array elements into a slice to “convert” it\n\n`slice := array[:]`\n\n![image](images/3v.jpg)Next,\
    \ call a variadic function to pass the values in each slice element for display\n\
    \n`list( slice… )`\n\n![image](images/4v.jpg)Now, append two more values to the\
    \ slice\n\n`slice = append( slice, “Porsche”, “Ferrari” )`\n\n![image](images/5v.jpg)Again,\
    \ call a variadic function to pass the values in each slice element for display\n\
