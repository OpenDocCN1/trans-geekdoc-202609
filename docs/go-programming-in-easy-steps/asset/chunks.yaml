    ![image](images/forget.jpg)


    The returned “Result” **string** value is not used in the output here.


    **Call Recursively**


    Statements within custom functions can freely call other custom functions just
    as readily as they can call standard Go library functions like fmt.Printf( ).
    Additionally, functions can call themselves “recursively”. As with loops, it is
    important that recursive function calls must modify a tested expression to avoid
    continuous execution – so the function will exit at some point.


    ![image](images/pg70_1.jpg)


    Recursive function calls can be used to emulate loop structures, such as the countdown
    example [hereon page 55](#chapter04.xhtml#Begin):


    ![image](images/1o.jpg)Create a function that requires an integer argument and
    makes recursive calls until that value is decremented to zero


    **func countDn( num int ) {**


    **if num < 1 {**


    **fmt.Println( “\\t\\t\\t\\tLift Off!” )**


    **} else {**


    **fmt.Println( “\\t\\t\\tCountdown”, num )**


    **num--**


    **countDn( num )**


    **}**


    **}**


    ![image](images/commono.jpg)


    src\\recur\\main.go


    ![image](images/2o.jpg)Add a main function that contains a statement to call the
    function above


    **func main( ) {**


    **countDn( 10 )**


    **}**


    ![image](images/3o.jpg)Save the program file in a “recur” directory, then run
    the program to see recursive function calls emulate a loop


    ![image](images/pg70_2.jpg)


    ![image](images/pg70_3.jpg)


    Recursive function calls are useful to resolve mathematical problems, such as
    the calculation of the factorial of a given number. The factorial is the multiplication
    of all integers from the given number down to one – e.g. the factorial of 3 is
    6 (3 \* 2 \* 1).


    ![image](images/1o.jpg)Create a function that requires an integer argument and
    will return one integer value upon each call


    **func facto( num int ) int {**


    **// Statements to be inserted here.**


    **}**


    ![image](images/commono.jpg)


    src\\facto\\main.go


    ![image](images/2o.jpg)Next, insert a statement to return a one (1) when the argument
    value is decremented to zero (0)


    **if num == 0 {**


    **return 1**


    **}**


    ![image](images/3o.jpg)Then, insert a final statement to recursively call the
    function, to multiply all numbers in the sequence


    **return num \* facto( num - 1 )**


    ![image](images/4o.jpg)Add a main function that contains a statement to print
    out seven factorials


    **func main( ) {**


    **for i := 1 ; i <= 7 ; i++ {**


    **fmt.Println( “Factorial“, i, “=”, facto( i ) )**


    **}**


    **}**


    ![image](images/5o.jpg)Save the program file in a “facto” directory, then run
    the program to see a factorial sequence


    ![image](images/pg71_1.jpg)


    ![image](images/snake.jpg)


    Recursive functions are useful, but not very efficient. This example calls the
    **facto( )** function 35 times to generate this sequence of just 7 factorials!


    **Enclose Anonymously**


    The Go programming language has support for “first class functions”. This allows
    functions to be assigned to variables, passed as arguments to other functions,
    and returned from functions.


    ![image](images/pg72_1.jpg)


    **Anonymous Functions**


    An anonymous function is simply a function definition that does not contain a
    name. This is useful to create a function inline without having to name it. Anonymous
    functions are also known as “function literals”. Like other functions, these can
    contain a parameter list, return type list, and can return multiple values. You
    can create a self-invoking anonymous function expression by appending the ( )
    call operator at the end of the function definition, like this:


    **func( ) { fmt.Println( “Function Literal” ) } ( )**


    Additionally, an anonymous function can be assigned to a variable, then called
    by appending the ( ) call operator after the variable name, like this:


    **fn** := **func( ) { fmt.Println( “Function Literal” ) }**


    **fn( )**


    ![image](images/hot.jpg)


    Self-invoking function expressions execute their statements one time only.


    **Closures**


    Perhaps the most useful purpose of anonymous functions is for the creation of
    “closures”. A closure is a function nested inside an outer function that retains
    access to variables declared in the outer function. The outer function can return
    an anonymous function that retains access to the variables but, crucially, the
    variables are not accessible from anywhere else in the program code. This is a
    form of encapsulation that protects the data stored in those variables as the
    returned anonymous function “closes over” them.


    The closure can be made self-invoking for assignment to a variable by appending
    the ( ) call operator after the end of the outer function definition. The anonymous
    inner function can then be called by appending the ( ) call operator after the
    variable name – and can access the persistent value in the outer function.


    It can be difficult to grasp the concept of closures, as it would seem that the
    variable in the outer function should be destroyed when the self-invoking function
    has completed execution.


    ![image](images/hot.jpg)


    Don’t worry if you can’t immediately understand how closures work. They can seem
    mystical at first, but will become clearer with experience. You can continue on
    and come back to this technique later.


    ![image](images/1o.jpg)Begin a main function by assigning an anonymous function
    to a variable


    **func main( ) {**


    **area := func( length, width int ) int {**


    **return length \* width**


    **}**


    **}**


    ![image](images/commono.jpg)


    src\\anon\\main.go


    ![image](images/2o.jpg)Next, insert statements to display the anonymous function’s
    type and two returned values


    **fmt.Printf( “area Type: %T \\n”, area )**


    **fmt.Println( “Area 1:”, area( 10, 4 ) )**


    **fmt.Println( “Area 2:”, area( 12, 5 ) )**


    ![image](images/3o.jpg)Now, insert statements to assign an anonymous self-invoking
    closure function to a variable


    **counter := func( ) func( ) int {**


    **num := 0**


    **return func( ) int {**


    **num++**


    **return num**


    **}**


    **} ( )**


    ![image](images/4o.jpg)Finally, insert statements to display the closure function’s
    type and three returned values


    **fmt.Printf( “counter type: %T \\n”, counter )**


    **fmt.Println( “Count:”, counter( ) )**


    **fmt.Println( “Count:”, counter( ) )**


    **fmt.Println( “Count:”, counter( ) )**


    ![image](images/5o.jpg)Save the program file in an “anon” directory, then run
    the program to see the function types and returned values


    ![image](images/pg73_1.jpg)


    ![image](images/forget.jpg)


    Notice that the outer function must state its return type as **func( ) int** because
    it will return a function that will in turn return an integer value.


    **Pass Functions**


    ![image](images/pg74_1.jpg)


    **Programmer-defined Function Types**


    The output from the previous example [hereon page 73](#chapter05.xhtml#assigning)
    describes the function by its signature, for example, counter type : func( ) int.
    You can declare a custom function type using the type keyword, followed by a type
    name of your choice, and a function signature. For example, a custom function
    named “adder” that must receive two integer arguments and return one integer argument,
    like this:


    **type adder func( int, int ) int**


    Variables can then be created as “instances” of the custom function type, and
    be assigned a function definition – whose signature must match that in the custom
    function type declaration. The function (instance) can be called in the usual
    way.


    **Higher-order Functions**


    Regular functions that receive value or reference arguments, and return these
    types to the caller, are called “first-order” functions. But functions can also
    be passed as arguments to other functions, and functions can return functions
    to the caller. Any function that accepts functions as arguments, or any function
    that returns one or more functions, is regarded as a “higher-order” function.


    Passing functions to other functions allows actions to be modified without repeating
    existing lines of code.'
