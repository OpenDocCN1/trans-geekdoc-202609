    \ assigned address can then be accessed by prefixing the pointer name with `*`:\n\
    \n```go\n*ptr // Points to the value at the assigned address.\n```\n\n![image](images/pg30_3.jpg)The\
    \ concept of pointers can be difficult because the `*` operator performs two purposes\
    \ – as a type descriptor in a declaration, and as a dereferencer when placed before\
    \ a pointer name. Memory location addresses are hexadecimal numbers that are allocated\
    \ by your computer. They will almost differ on your system.\n\n![image](images/1r.jpg)Create\
    \ a directory named “point” inside your “src” folder\n\n![image](images/commonr.jpg)\n\
    \n`src\\point\\main.go`\n\n![image](images/2r.jpg)Begin a main.go program with\
    \ package and import declarations\n\n```go\npackage main\n\nimport \"fmt\"\n```\n\
    \n![image](images/3r.jpg)Add a main function that declares and initializes a regular\
    \ integer variable and a pointer variable\n\n```go\nfunc main() {\n\tvar num int\
    \ = 20\n\tvar ptr *int = &num\n\t// Statements to be inserted here.\n}\n```\n\n\
    ![image](images/4r.jpg)Next, insert statements to display the value and memory\
    \ address of the integer variable\n\n```go\nfmt.Printf(\"num value: %v type: %T\\\
    n\", num, num)\nfmt.Printf(\"num address: %v type: %T\\n\", ptr, ptr)\n```\n\n\
    ![image](images/5r.jpg)Now, insert statements to display the dereferenced value\
    \ and memory address of the pointer variable\n\n```go\nfmt.Printf(\"num via pointer:\
    \ %v type: %T\\n\", *ptr, *ptr)\nfmt.Printf(\"ptr address: %v type: %T\\n\", &ptr,\
    \ &ptr)\n```\n\n![image](images/6r.jpg)Finally, insert statements to change the\
    \ value stored in the integer variable – by assignment to the pointer variable\n\
    \n```go\n*ptr = 100\nfmt.Printf(\"new num value: %v type: %T\\n\", num, num)\n\
    ```\n\n![image](images/7r.jpg)Save the program file in the “point” directory,\
    \ then run the program to see the variable values and addresses\n\n![image](images/pg31_1.jpg)\n\
    \n![image](images/hot.jpg)\n\nThe most important feature to recognize here is\
    \ that the pointer changes the original value stored in the variable to it points,\
    \ not a copy of that value. This becomes significant when passing variables to\
    \ functions – see [pages 64-67](#chapter05.xhtml#sec30).\n\n## Summary\n\n- A\
    \ variable stores data that can be referenced via the variable’s given name, and\
    \ its value can be changed.\n- An explicit variable declaration uses the `var`\
    \ keyword and states the type of data that variable can contain.\n- An implicit\
    \ variable declaration can be made inside a function body using the `:=` operator\
    \ to infer the data type.\n- Go is a statically typed language in which a variable\
    \ can only ever contain data of the type specified in its declaration.\n- The\
    \ `fmt.Printf()` function can use format specifiers, variable names and `\\n`\
    \ newline escape sequences to format output.\n- The `strconv.Atoi()` function\
    \ returns the `int` data type equivalent of a string value specified within its\
    \ parentheses, and a second value that will be nil or an error message.\n- The\
    \ `strconv.Itoa()` function returns the string data type equivalent of an `int`\
    \ value specified within its parentheses.\n- The `strconv.ParseFloat()` function\
    \ returns the `float64` data type equivalent of a string value specified within\
    \ its parentheses, and a second value that will be nil or an error message.\n\
    - When a variable of the `byte` data type is assigned a character, it stores the\
    \ ASCII character code number of that character.\n- Casting between numeric data\
    \ types states the required type followed by parentheses containing the value\
    \ to be converted.\n- A constant declaration uses the `const` keyword, and must\
    \ be initialized with the fixed value it will contain.\n- A pointer variable can\
    \ store the memory address of another variable, and can access the value stored\
    \ at that address.\n- The `*` operator prefixes the data type in a pointer variable\
    \ declaration to indicate that variable will be a pointer.\n- The `&` operator\
    \ prefixes the name of a regular variable to reference that variable’s memory\
    \ address.\n- The `*` operator prefixes the name of a pointer variable to reference\
    \ the value stored at the address it points to.\n\n# 3 Perform Operations\n\n\
    *This chapter introduces Go operators and demonstrates the operations they can\
    \ perform.*\n\n- [Do Arithmetic](#chapter03.xhtml#sec15)\n- [Assign Values](#chapter03.xhtml#sec16)\n\
    - [Make Comparisons](#chapter03.xhtml#sec17)\n- [Assess Logic](#chapter03.xhtml#sec18)\n"
  trans: "\n非常有用的一点是，常量声明可以使用一个名为 `iota` 的“常量生成器”来创建一个相关的常量值序列。常量名应该在 `const` 关键字后面的括号内每行列出一个，并给第一个赋值为\
    \ `iota` 值。这会生成一个从零开始的数值序列，列表中的每一个命名常量，该序列就会递增 1。\n\n例如，你可以像这样所示将一个数值序列赋值给代表星期几的常量：\n\
    \n```go\nconst (\n\tsunday = iota\n\tmonday\n\ttuesday\n\twednesday\n\tthursday\n\
    \tfriday\n\tsaturday\n)\n```\n\n在这个例示例中，常量 `sunday` 将被赋值为 0 (0)，`monday` 将赋值为\
    \ 1 (1)，依此类推。\n\n如果你想从不同的数字开始序列，只需在给第一个常量赋值时将 `iota` 加上该数字即可。\n\n![image](img/hot.jpg)\n\
    \n在其他编程语言中，生成的序列通常被称为“枚举”（enumeration）或简单的 `enum`。\n\n![image](img/1r.jpg)在你的“src”文件夹内创建一个名为“const”的目录\n\
    \n![image](img/commonr.jpg)\n\n`src\\const\\main.go`\n\n![image](img/2r.jpg)带有包声明和导入声明开始一个\
    \ main.go 程序\n\n```go\npackage main\n\nimport \"fmt\"\n```\n\n![image](img/3r.jpg)添加一个\
    \ main 函数，声明并初始化一个常量以及一组从一 (1) 开始的常量序列\n\n```go\nfunc main() {\n\tconst pi = 3.14159\n\
    \tconst (\n\t\tred = iota + 1\n\t\tyellow\n\t\tgreen\n\t\tbrown\n\t\tblue\n\t\t\
    pink\n\t\tblack\n\t)\n\t// 在此处插入语句。\n}\n```\n\n![image](img/4r.jpg)接下来，插入语句来显示几个常量值\n\
    \n```go\nfmt.Printf(\"Pi approximately: %v \\n\\n\", pi)\nfmt.Printf(\"Red: %v\
    \ point \\n\", red)\nfmt.Printf(\"Blue: %v points \\n\", blue)\nfmt.Printf(\"\
    Black: %v points \\n\", black)\n```\n\n![image](img/5r.jpg)将程序文件保存在“const”目录中，然后运行程序查看常量值\n\
    \n![image](img/pg29_1.jpg)\n\n![image](img/hot.jpg)\n\nGo 中的 `math` 包提供了一个名为 `math.Pi`\
    \ 的常量，它对 ![image](img/py.jpg) 值的近似要精确得多\n\n![image](img/hot.jpg)\n\n这里的序列代表了斯诺克游戏中每个球的分值。\n\
    \n## 指向存储的值\n\n每当你的程序创建一个用于存储数据的容器时，你的计算机都会在内存中分配一个空间来存储这些数据。就像房子一样，内存位置的大小可能不同，但每个位置都有唯一的地址。\n\
    \n![image](img/pg30_1.jpg)\n\n因此，一个初始化的变量实际上由三部分组成——名称、值以及存储数据的内存地址。\n\n![image](img/pg30_2.jpg)\n\
    \nGo 语言支持“指针”的概念。指针变量可以存储另一个变量的地址，并可以访问该地址存储的值。声明指针变量需要在此数据类型前加上 `*`，以表示这是一个指针：\n\
    \n```go\nvar ptr *int // 声明此变量将指向一个 int\n```\n\n可以通过在另一个变量名前加上 `&` 将该变量的地址赋值给指针：\n\
    \n```go\nptr = &num // 给指针变量赋值一个地址。\n```\n\n然后，可以通过在指针名称前加上 `*` 来访问所赋值地址处的值：\n\
    \n```go\n*ptr // 指向所赋值地址处的值。\n```\n\n![image](img/pg30_3.jpg)指针的概念可能会困难，因为 `*`\
    \ 运算符承担了两个用途——在声明中作为类型描述符，以及在放在指针名称之前作为解引用符。内存位置地址是由你的计算机分配的十六进制数。它们在你的系统上几乎不同。\n\
    \n![image](img/1r.jpg)在你的“src”文件夹内创建一个名为“point”的目录\n\n![image](img/commonr.jpg)\n\
    \n`src\\point\\main.go`\n\n![image](img/2r.jpg)带有包声明和导入声明开始一个 main.go 程序\n\n```go\n\
    package main\n\nimport \"fmt\"\n```\n\n![image](img/3r.jpg)添加一个 main 函数，声明并初始化一个普通整数变量和一个指针变量\n\
    \n```go\nfunc main() {\n\tvar num int = 20\n\tvar ptr *int = &num\n\t// 在此处插入语句。\n\
    }\n```\n\n![image](img/4r.jpg)接下来，插入语句来显示整数变量的值和内存地址\n\n```go\nfmt.Printf(\"num\
    \ value: %v\\n\", num)\nfmt.Printf(\"ptr address: %v\\n\", ptr)\n```\n\n![image](img/5r.jpg)现在，插入语句通过指针显示整数变量的值和地址\n\
    \n```go\nfmt.Printf(\"num via: %v\\n\", *ptr)\nfmt.Printf(\"ptr: %v\\n\", ptr)\n\
    ```\n\n![image](img/6r.jpg)最后，插入语句更改指针所指向的值\n\n```go\n*ptr = 100\nfmt.Printf(\"\
    new num value: %v\\n\", num)\n```\n\n![image](img/7r.jpg)将程序文件保存在“point”目录中，然后运行程序查看变量的值和地址\n\
    \n![image](img/pg31_1.jpg)\n\n![image](img/hot.jpg)\n\n这里最重要的特性是指针改变的是它所指向的值，而不是该值的副本。这在传递变量时变得非常重要——参见第\
    \ 64-67 页。\n\n## 总结\n\n- 变量通过其给名称存储数据，其值可以被更改。\n- 显式变量声明使用 `var` 关键字并指定变量的数据类型。\n\
    - 隐式变量声明可以在函数体内使用 `:=` 运算符推断类型。\n- Go 是一种静态类型语言，变量只能包含声明的类型。\n- `fmt.Printf()`\
    \ 函数可以使用格式化标记、变量名和 `\\n` 换行转义序列来格式化输出。\n- `strconv.Atoi()` 函数返回字符串值的 `int` 类型，以及一个可能为\
    \ nil 的错误。\n- `strconv.Itoa()` 函数返回整数值的字符串类型。\n- `strconv.ParseFloat()` 函数返回字符串值的\
    \ `float64` 类型结果，以及一个可能为 nil 的错误。\n- 当给 `byte` 类型的变量赋值字符时，它存储该字符的 ASCII 字符码。\n\
    - 数值类型之间的强制转换指定所需的类型，并在后跟包含要转换值的括号。\n- 常量声明使用 `const` 关键字，并必须用其包含的固定值进行初始化。\n\
    - 指针变量可以存储另一个变量的内存地址，并访问该地址存储的值。\n- `*` 运算符在指针变量声明中放在数据类型前以表示该变量是指针。\n- `&` 运算符放在普通变量名前之前以引用该变量的内存地址。\n\
    - `*` 运算符放在指针变量名前之前以引用其指向地址处的值。\n\n# 3 执行操作\n\n*本章介绍 Go 运算符并演示它们可以执行的操作。*\n\n\
    - 执行算术运算\n- 赋值\n- 进行比较\n- 逻辑评估\n"
