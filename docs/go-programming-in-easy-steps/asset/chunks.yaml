    \ [hereon page 140](#chapter09.xhtml#sec68).\n\n![image](images/3b.jpg)Add statements\
    \ to output all fields of the date/time instance and to confirm its data type\n\
    \n**fmt.Printf( “DateTime: %v \\\\n”, dt )**\n\n**fmt.Printf( “DateTime Type:\
    \ %T \\\\n\\\\n”, dt )**\n\n![image](images/4b.jpg)Next, add statements to evaluate\
    \ the current hour and display an appropriate greeting\n\n**hr := dt.Hour( )**\n\
    \n**switch {**\n\n**case hr < 12 :**\n\n**fmt.Println( “Good Morning!” )**\n\n\
    **case hr < 18 :**\n\n**fmt.Println( “Good Afternoon!” )**\n\n**default :**\n\n\
    **fmt.Println( “Good Evening!” )**\n\n**}**\n\n![image](images/5b.jpg)Now, add\
    \ statements to display the current time\n\n**h, mn, s := dt.Clock( )**\n\n**fmt.Printf\
    \ ( “Time: %v:%v,:%v \\\\n”, h, mn, s )**\n\n![image](images/6b.jpg)Finally, add\
    \ statements to display the current time field for nanoseconds and its equivalent\
    \ millisecond value\n\n**ns := dt.UnixNano( )**\n\n**ms := ns / 1000000**\n\n\
    **fmt.Println( “Nanoseconds:”, ns )**\n\n**fmt.Println( “Milliseconds:”, ms )**\n\
    \n![image](images/7b.jpg)Save the program file in a “times” directory, then run\
    \ the program to see the time field values\n\n![image](images/pg115_1.jpg)\n\n\
    ![image](images/snake.jpg)\n\nSingle-digit hour, minute, and second values are\
    \ not returned with a leading zero by default.\n\n**Format Date and Time**\n\n\
    ![image](images/pg116_1.jpg)\n\nThe date and time values within individual fields\
    \ of a Time data type can be formatted in a variety of ways using its Format(\
    \ ) method. This takes a single argument that is a “layout” string, which specifies\
    \ how to format a date/time value. The format must only be specified by exactly\
    \ using elements of this reference string:\n\n**Mon Jan 2 15:04:05 2006 MST**"
  fmt: "\n- Upper and lower boundaries of a sequence of elements can be specified\
    \ around a `:` colon character within `[ ]` square brackets.\n- An empty slice\
    \ can be created using the `make()` function, or can be created and initialized\
    \ by assigning a slice literal.\n- Elements can be added to a slice by the `append()`\
    \ function.\n- A slice can be copied into another slice by the `copy()` function.\n\
    - Pointers are not required when passing references to a function.\n- Variadic\
    \ functions can be called with any number of arguments.\n- A map is a variable-length\
    \ structure containing associated key/value pairs.\n- An empty map can be created\
    \ using the `make()` function, or can be created and initialized by assigning\
    \ a map literal.\n- The value stored in a map element can be referenced by stating\
    \ the associated key in `[ ]` square brackets.\n\n# Harness Time\n\nThis chapter\
    \ demonstrates how to manipulate dates and time using the Go standard library\
    \ `time` package.\n\n- [Get Dates](#chapter08.xhtml#sec54)\n- [Get Times](#chapter08.xhtml#sec55)\n\
    - [Format Date and Time](#chapter08.xhtml#sec56)\n- [Set Date and Time](#chapter08.xhtml#sec57)\n\
    - [Recognize Zones](#chapter08.xhtml#sec58)\n- [Delay Time](#chapter08.xhtml#sec59)\n\
    - [Summary](#chapter08.xhtml#sec60)\n\n## Get Dates\n\nThe Go standard library\
    \ `time` package provides functionality to extract specific fields from a `Time`\
    \ data type that describe a particular point in time. These can be made available\
    \ to a program by importing the `time` package.\n\n![image](images/pg112_1.jpg)\n\
    \nA date/time instance of a new `Time` data type can be created with fields describing\
    \ the current date and time using a `time.Now()` function. The fields are initialized\
    \ from the system clock on your device for the current locale.\n\nThe value within\
    \ an individual field can be retrieved using an appropriate method of the `Time`\
    \ data type. For example, the value of the `year` field can be retrieved using\
    \ its `Year()` method. Similarly, there are `Month()`, `Day()`, and `Weekday()`\
    \ methods that retrieve other individual fields of a `Time` data type.\n\n| Method\
    \ | Returns |\n| --- | --- |\n| `Now()` | A `time.Time` data type comprising current\
    \ date, time, and time zone fields |\n| `Year()` | Year with 4 digits (YYYY) |\n\
    | `Month()` | Month name of the year |\n| `Day()` | Day number of the month |\n\
    | `Weekday()` | Day name of the week |\n\nThere are also these three methods whose\
    \ returned `Time` data type values can usefully be assigned to variables:\n\n\
    | Method | Returns |\n| --- | --- |\n| `Date()` | Year with 4 digits (YYYY), month\
    \ name of the year, and day number of the month |\n| `ISOWeek()` | Week number\
    \ of the year (1-53) and year with 4 digits (YYYY) |\n| `YearDay()` | Day number\
    \ of the year (1-365/366) |\n\nIt is important to recognize that a `Time` data\
    \ type contains individual fields and so is not a string. You can, however, convert\
    \ it to a string using its `String()` method:\n\n![image](images/snake.jpg)\n\n\
    The values returned by the `Time` data type methods are not strings.\n\n![image](images/1b.jpg)Begin\
    \ by importing the Go standard library time package into a program\n\n```go\n\
    import (\n\t\"fmt\"\n\t\"time\"\n)\n```\n\n![image](images/commons.jpg)\n\n`src\\\
    date\\main.go`\n\n![image](images/2b.jpg)Next, create a date/time instance of\
    \ the `Time` data type, initialized with the current date and time\n\n```go\n\
    dt := time.Now()\n```\n\n![image](images/3b.jpg)Add statements to output all fields\
    \ of the date/time instance to confirm its data type\n\n```go\nfmt.Printf(\"DateTime:\
    \ %v\\n\", dt)\nfmt.Printf(\"DateTime Type: %T\\n\", dt)\n```\n\n![image](images/4b.jpg)Next,\
    \ add a statement to output today’s day name\n\n```go\nfmt.Printf(\"Today is:\
    \ %v\\n\", dt.Weekday())\n```\n\n![image](images/5b.jpg)Now, add statements to\
    \ display today’s date, current week, and day number of the year\n\n```go\ny,\
    \ m, d := dt.Date()\nfmt.Printf(\"Date: %v %v %v\\n\", m, d, y)\n```\n\n```go\n\
    yr, wk := dt.ISOWeek()\nfmt.Printf(\"Week No.: %v\\n\", wk, yr)\n```\n\n```go\n\
    dy := dt.YearDay()\nfmt.Printf(\"Day No.: %v\\n\", dy)\n```\n\n![image](images/6b.jpg)Save\
    \ the program file in a “date” directory, then run the program to see the date\
    \ values\n\n![image](images/pg13_1.jpg)\n\n![image](images/hot.jpg)The time zone\
    \ values specify the offset from the UTC (Universal Time Clock) and a time zone\
    \ abbreviation – see [here](#chapter08.xhtml#sec58) for more on time zones.\n\n\
    ## Get Times\n\nThe time values within individual fields of a `Time` data type\
    \ can be retrieved using appropriate methods. For example, the value of the hour\
    \ field can be retrieved using its `Hour()` method. Similarly, there are `Minute()`,\
    \ `Second()`, and `Nanosecond()` methods that retrieve other individual fields\
    \ of a `Time` data type.\n\n![image](images/pg14_1.jpg)\n\n| Method | Returns\
    \ |\n| --- | --- |\n| `Hour()` | Hour number of the day (0-23) |\n| `Minute()`\
    \ | Minute number of the hour (0-59) |\n| `Second()` | Second number of the minute\
    \ (0-59) |\n| `Nanosecond()` | Nanosecond of the second (0-999999999) |\n\nUnlike\
    \ other programming languages, the `time` package in Go does not provide a method\
    \ to return a millisecond value from a `Time` data type. You can, however, divide\
    \ the nanosecond value by one million to produce its millisecond equivalent.\n\
    \nThere are also these three methods whose returned `Time` data type values can\
    \ usefully assigned to variables:\n\n| Method | Returns |\n| --- | --- |\n| `Clock()`\
    \ | Hour, minute, and second within the day |\n| `Unix()` | The number of seconds\
    \ since the epoch (January 1, 1970 00:00:00 UTC) |\n| `UnixNano()` | The number\
    \ of nanoseconds elapsed the epoch (January 1, 1970 00:00:00 UTC) |\n\n![image](images/1b.jpg)Begin\
    \ by importing the Go standard library time package into a program\n\n```go\n\
    import (\n\t\"fmt\"\n\t\"time\"\n)\n```\n\n![image](images/commons.jpg)\n\n`src\\\
    times\\main.go`\n\n![image](images/2b.jpg)Next, create a date/time instance of\
    \ the `Time` data type, initialized with the current date and time\n\n```go\n\
    dt := time.Now()\n```\n\n![image](images/hot.jpg)The `UnixNano()` method is useful\
    \ to seed the Go random generator – see the example [here](#chapter09.xhtml#sec68).\n\
    \n![image](images/3b.jpg)Add statements to output all fields of the date/time\
    \ instance and confirm its data type\n\n```go\nfmt.Printf(\"DateTime: %v\\n\"\
    , dt)\nfmt.Printf(\"DateTime Type: %T\\n\\n\", dt)\n```\n\n![image](images/4b.jpg)Next,\
    \ add statements to evaluate the current hour and display an appropriate greeting\n\
    \n```go\nhr := dt.Hour()\nswitch {\ncase hr < 12:\n\tfmt.Println(\"Good Morning!\"\
    )\ncase hr < 18:\n\tfmt.Println(\"Good Afternoon!\")\ndefault:\n\tfmt.Println(\"\
    Good Evening!\")\n}\n```\n\n![image](images/5b.jpg)Now, add statements to display\
    \ the current time\n\n```go\nh, mn, s := dt.Clock()\nfmt.Printf ( \"Time: %v:%v:%v\
    \ \\n\", h, mn, s )\n```\n\n![image](images/6b.jpg)Finally, add statements to\
    \ display the current time field for nanoseconds and its equivalent millisecond\
    \ value\n\n```go\nns := dt.UnixNano()\nms := ns / 1000000\nfmt.Println(\"Nanoseconds:\"\
    , ns)\nfmt.Println(\"Milliseconds:\", ms)\n```\n\n![image](images/7b.jpg)Save\
    \ the program file in a “times” directory, then run the program to see the time\
    \ field values\n\n![image](images/pg115_1.jpg)\n\n![image](images/snake.jpg)\n\
    \nSingle-digit hour, minute, and second values are not returned with a leading\
    \ zero by default.\n\n## Format Date and Time\n\n![image](images/pg116_1.jpg)\n\
    \nThe date and time values within individual fields of a `Time` data type can\
    \ be formatted in a variety of ways using its `Format()` method. This takes a\
    \ single argument that is a “layout” string, which specifies how to format a date/time\
    \ value. The format must only be specified by exactly using elements of this reference\
    \ string:\n\n`Mon Jan 2 15:04:05 2006 MST`\n"
  trans: "\n\n- 元素序列的上下边界可以在 `[ ]` 方括号内的 `:` 冒号字符周围进行指定。\n- 使用 `make()` 函数创建空切片，也可以通过赋值切片字面量来创建并初始化。\n\
    - 使用 `append()` 函数向切片中添加元素。\n- 使用 `copy()` 函数可以将一个切片复制到另一个切片中。\n- 在向函数传递引用时，不需要指针。\n\
    - 变参函数可以使用任意数量的参数调用。\n- 映射（map）是一个包含关联键/值对的变长结构。\n- 使用 `make()` 函数创建空映射，也可以通过赋值映射字面量来创建并初始化。\n\
    - 可以通过在 `[ ]` 方括号中指定关联的键来引用映射元素中存储的值。\n\n# 运用时间\n\n本章演示了如何使用 Go 标准库中的 `time` 包来处理日期和时间。\n\
    \n- 获取日期\n- 获取时间\n- 格式化日期和时间\n- 设置日期和时间\n- 识别时区\n- 延迟时间\n- 总结\n\n## 获取日期\n\nGo\
    \ 标准库 `time` 包提供了从 `Time` 数据类型中提取特定字段的功能，这些字段描述了一个特定的点。通过导入 `time` 包，这些功能可以在程序中使用。\n\
    \n![image](img/pg112_1.jpg)\n\n可以使用 `time.Now()` 函数创建一个带有描述当前日期和时间的字段的新 `Time`\
    \ 数据类型实例。这些字段是根据设备上当前区域的系统时钟初始化的。\n\n可以使用 `Time` 数据类型的适当方法来获取单个字段中的值。例如，可以使用 `Year()`\
    \ 方法获取 `year` 字段的值。同样，还有 `Month()`、`Day()` 和 `Weekday()` 方法来获取 `Time` 类型的其他单个字段。\n\
    \n| 方法 | 返回值 |\n| --- | --- |\n| `Now()` | 一个包含当前日期、时间和时区字段的 `time.Time` 数据类型\
    \ |\n| `Year()` | 4 位数字年份 (YYYY) |\n| `Month()` | 年的月份名称 |\n| `Day()` | 月中的天数\
    \ |\n| `Weekday()` | 星期名称 |\n\n还有这三个方法，其返回的 `Time` 数据类型值可以有效地赋值给变量：\n\n| 方法 |\
    \ 返回值 |\n| --- | --- |\n| `Date()` | 4 位数字年份 (YYYY)、月份名称和月中的天数 |\n| `ISOWeek()`\
    \ | 年中的周数 (1-53) 和 4 位数字年份 (YYYY) |\n| `YearDay()` | 年中的天数 (1-365/366) |\n\n重要的是，`Time`\
    \ 数据类型包含单个字段，因此它不是字符串。不过，你可以使用它的 `String()` 方法将其字符串：\n\n![image](img/snake.jpg)\n\
    \n`Time` 数据类型方法返回的值不是字符串。\n\n![image](img/1b.jpg)开始在程序中导入 Go 标准库 time 包\n\n```go\n\
    import (\n\t\"fmt\"\n\t\"time\"\n)\n```\n\n![image](img/commons.jpg)\n\n`src\\\
    date\\main.go`\n\n![image](img/2b.jpg)接下来，创建一个 `Time` 数据类型的日期/时间实例，用当前日期和时间初始化\n\
    \n```go\ndt := time.Now()\n```\n\n![image](img/3b.jpg)添加语句输出日期/时间实例的所有字段以确认其数据类型\n\
    \n```go\nfmt.Printf(\"DateTime: %v\\n\", dt)\nfmt.Printf(\"DateTime Type: %T\\\
    n\", dt)\n```\n\n![image](img/4b.jpg)接下来，添加语句输出今天的星期\n\n```go\nfmt.Printf(\"Today\
    \ is: %v\\n\", dt.Weekday())\n```\n\n![image](img/5b.jpg)现在，添加语句显示今天的日期、周和年的天数\n\
    \n```go\ny, m, d := dt.Date()\nfmt.Printf(\"Date: %v %v\\n\", m, d)\n```\n\n```go\n\
    yr, wk := dt.ISOWeek()\nfmt.Printf(\"Week No.: %v\\n\", wk)\n```\n\n```go\ndy\
    \ := dt.YearDay()\nfmt.Printf(\"Day No.: %v\\n\", dy)\n```\n\n![image](img/6b.jpg)将文件保存在“date”目录中，然后运行程序查看日期值\n\
    \n![image](img/pg13_1.jpg)\n\n![image](img/hot.jpg)时区值指定了相对于 UTC（协调世界时）的偏移和缩写——更多关于时区的信息请参见此处。\n\
    \n 获取时间\n\n可以使用适当的方法 `Time` 类型单个字段中的时间值。例如，可以使用 `Hour()` 方法获取小时值。同样，还有 `Minute()`、`Second()`\
    \ 和 `Nanosecond()` 方法来获取 `Time` 的其他单个字段。\n\n![image](img/pg14_1.jpg)\n\n| 方法 |\
    \ 返回值 |\n| --- | --- |\n| `Hour()` | 天的小时 (0-23) |\n| `Minute()` | 小时的分钟 (0-59)\
    \ |\n| `Second()` | 分的秒 (0-59) |\n| `Nanosecond()` | 秒的纳秒 (0-999999999) |\n\n\
    与其他语言不同，Go 的 `time` 包没有提供从 `Time` 类型返回毫秒的方法。不过，你可以将纳秒值除以百万以得到等值的毫秒。\n\n还有这三个方法，其返回的\
    \ `Time` 类型值可以有效地赋值给变量：\n\n| 方法 | 返回值 |\n| --- | --- |\n| `Clock()` | 天的时、分、秒\
    \ |\n| `Unix()` | 自纪元（1970 年 1 月 1 日 00:00:00 UTC）开始的秒数 |\n| `UnixNano()` | 自纪元（1970\
    \ 年 1 月 1 日 00:00:00 UTC）开始的纳秒数 |\n\n![image](img/1b.jpg)开始在程序中导入 Go 标准库 time\
    \ 包\n\n```go\nimport (\n\t\"fmt\"\n\t\"time\"\n)\n```\n\n![image](img/commons.jpg)\n\
    \n`src\\times\\main.go`\n\n![image](img/2b.jpg)接下来，创建一个 `Time` 数据类型的日期/时间实例，用当前日期和时间初始化\n\
    \n```go\ndt := time.Now()\n```\n\n![image](img/hot.jpg)`UnixNano()` 方法用于 Go 随机生成器的种子——请参见此处。\n\
    \n![image](img/3b.jpg)添加语句输出日期/时间实例的所有字段并确认其数据类型\n\n```go\nfmt.Printf(\"DateTime:\
    \ %v\\n\", dt)\nfmt.Printf(\"DateTime Type: %T\\n\\n\", dt)\n```\n\n![image](img/4b.jpg)接下来，添加语句评估当前小时并显示适当问候\n\
    \n```go\nhr := dt.Hour()\nswitch {\ncase hr < 12:\n\tfmt.Println(\"Good Morning!\"\
    )\ncase hr < 18:\n\tfmt.Println(\"Good Afternoon!\")\ndefault:\n\tfmt.Println(\"\
    Good Evening!\")\n}\n```\n\n![image](img/5b.jpg)现在，添加语句显示当前时间\n\n```go\nh, mn,\
    \ s := dt.Clock()\nfmt.Printf ( \"Time: %v:%v:%v \\n\", h, mn, s )\n```\n\n![image](img/6b.jpg)最后，添加语句显示当前时间的纳秒字段及其等值的毫秒值\n\
    \n```go\nns := dt.UnixNano()\nms := ns / 1000000\nfmt.Println(\"Nanoseconds:\"\
    , ns)\nfmt.Println(\"Milliseconds:\", ms)\n```\n\n![image](img/7b.jpg)将程序文件保存在“times”目录中，然后运行程序查看时间字段值\n\
    \n![image](img/pg115_1.jpg)\n\n![image](img/snake.jpg)\n\n默认情况下，一位数的小、分、秒值不会带前导零。\n\
    \n## 格式化日期和时间\n\n![image](img/pg116_1.jpg)\n\n可以使用 `Format()` 方法以多种方式格式化 `Time`\
    \ 类型单个字段中的日期和时间值。它接受一个作为“布局”字符串的参数，指定如何格式化日期/时间值。格式必须通过精确使用此引用字符串中的元素来指定：\n\n\
    `Mon Jan 2 15:04:05 2006 MST`\n\n"
