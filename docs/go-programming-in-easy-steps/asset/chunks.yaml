    \ )**\n\n**fmt.Printf( “Date: %v %v, %v \\\\n”, m, d, y )**\n\n**yr, wk := dt.ISOWeek(\
    \ )**\n\n**fmt.Printf( “Week No.: %v in %v \\\\n”, wk, yr )**\n\n**dy := dt.YearDay(\
    \ )**\n\n**fmt.Printf( “Day No.: %v \\\\n”, dy )**\n\n![image](images/6b.jpg)Save\
    \ the program file in a “date” directory, then run the program to see the date\
    \ field values\n\n![image](images/pg113_1.jpg)\n\n![image](images/hot.jpg)\n\n\
    The time zone values specify the offset from the UTC (Universal Time Clock) and\
    \ a time zone abbreviation – see [herepage 120](#chapter08.xhtml#sec58) for more\
    \ on time zones.\n\n**Get Times**\n\nThe time values within individual fields\
    \ of a Time data type can be retrieved using appropriate methods. For example,\
    \ the value of the hour field can be retrieved using its Hour( ) method. Similarly,\
    \ there are Minute( ), Second( ), and Nanosecond( ) methods that retrieve other\
    \ individual fields of a Time data type.\n\n![image](images/pg114_1.jpg)\n\n|\
    \ **Method** || **Returns** |\n\n| --- | --- |\n\n| **Hour( )** || Hour number\
