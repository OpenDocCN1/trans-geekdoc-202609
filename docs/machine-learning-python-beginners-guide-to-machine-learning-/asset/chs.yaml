  ```\n\n上述代码的输出为 −\n\n('Accuracy: \\n', 1.0)\n\n集成方法的目标是结合通过给定学习算法构建的多个基估计器的预测结果，以提高比单个估计器更优的泛化能力/鲁棒性。\n\
  \n`sklearn.ensemble` 模块包含了两种基于随机决策树的平均算法——`RandomForest` 算法和 `Extra-Trees` 方法。这两种算法都是专门为树设计的“扰动并结合”技术\
  \ [B1998]。这意味着通过在分类器的构建中引入随机性，创建一个多样化的分类器集合。集集的预测结果为各个分类器预测的平均值。\n\n森林分类器需要用两个数组进行拟合——一个大小为\
  \ `[n_samples, n_features]` 的稀疏或密集数组 `X`，用于存储训练样本；以及大小为 `[n_samples]` 的数组 `Y`，用于存储训练样本的目标值（类别标签），如下所示所示\
  \ −\n\n```python\nfrom sklearn.ensemble import RandomForestClassifier\n\nX = [[0,\
  \ 0], [1, 1]]\nY = [0, 1]\nclf = RandomForestClassifier(n_estimators = 10)\nclf\
  \ = clf.fit(X, Y)\n```\n\n与决策树一样，森林也可以扩展到多输出问题（如果 `Y` 是大小为 `[n_samples, n_outputs]`\
  \ 的数组）。\n\n与原始文献 [B2001] 不同，scikit-learn 的实现通过平均其分类器的概率预测来组合分类器，而不是让每个分类器对单个类别投票。\n\
  \n`Random Forest` 是决策树集的一个注册术语。在随机森林中，我们有一组决策树，被称为“森林”。根据属性对新对象进行分类，每棵树都会给出一个分类结果，我们称该树为该类别“投票”。森林选择票数最多（在森林中的所有树中）的分类结果。\n\
  \n每棵树按如下方式种植和生长 −\n\n- 如果训练集中的案例数量为 `N`，则随机有放回地抽取 `N` 个样本。该样本将作为生长树的训练集。\n- 如果有\
  \ `M` 个输入变量，则指定一个 `m<<M`，使得在每个节点上，从 `M` 个变量中随机选择 `m` 个变量，并使用这 `m` 个变量的最优拆分来划分节点。`m`\
  \ 的值在森林生长过程中保持不变。\n- 每棵树都尽可能地生长。不进行剪枝。\n\n## 降维算法\n\n降维是另一项常见的无监督学习任务。某些问题可能包含成上万甚至百万个输入或解释变量，处理这些变量并进行计算的成本很高。此外，如果某些输入变量捕捉了噪声或与底层关系无关，程序的泛化能力可能会降低。\n\
  \n降维是寻找对输出或响应变量产生最大变化的输入变量的过程。降维有时也用于数据可视化。回归问题很容易可视化，例如根据房屋大小预测房产价格，其中房产的大小可以沿图表的\
  \ x 轴绘制，房产价格可以沿 y 轴绘制。同样，当添加第二个解释变量时，房产价格回归问题也容易可视化。例如，房屋的房间数可以绘制在 z 轴上。然而，具有数千个输入变量的问题将是不可视的。\n\
  \n降维将大量的输入解释变量集减少为较小的输入变量集，同时保留尽可能多的信息。\n\n`PCA` 是一种可以为数据分析提供帮助的降维算法。最重要的是，在处理成百或上千个不同的输入变量时，它可以显著减少模型涉及的计算量。由于这是一项无监督学习任务，用户仍然需要分析结果并确保他们保留了原始数据集约\
  \ 95% 的的行为。\n\n观察以下代码以更好地理解 −\n\n```python\nfrom sklearn import decomposition\n\n\
  df = pd.read_csv('iris_df.csv')\ndf.columns = ['X1', 'X2', 'X3', 'X4', 'Y']\ndf.head()\n\
  \nfrom sklearn import decomposition\n\npca = decomposition.PCA()\nfa = decomposition.FactorAnalysis()\n\
  X = df.values[:, 0:4]\nY = df.values[:, 4]\n\ntrain, test = train_test_split(X,\
  \ test_size = 0.3)\ntrain_reduced = pca.fit_transform(train)\ntest_reduced = pca.transform(test)\n\
  pca.n_components_\n```\n\n你可以看到上述代码的如下输出 −\n\n4L\n\n在过去的 5 年里，在每一个可能的层面和点，数据捕捉呈指数级增长。政府机构/研究机构/企业不仅推出了新的数据源，而且还在捕捉更多详细的数据。例如，电子商务公司正在获取客户的人口统计、浏览历史、喜好等更多详细信息。可用数据可能具有数千个特征，在保留尽可能多信息的同时减少特征是一个挑战。在这种情况下，降维有很大帮助。\n\
  \n## Boosting 算法\n\nBoosting 一词指的是一组将弱学习器转换为强学习器的算法。让我们通过解决下所示的垃圾邮件识别问题来理解这一定义 −\n\
  \n遵循什么程序可以对邮件分类为垃圾邮件？初始方法中我们通过以下标准识别“垃圾邮件”和“非垃圾邮件”：\n\n- 如果邮件只有一个图像文件（广告图），它是垃圾邮件\n\
  - 如果邮件只有链接，它是垃圾邮件\n- 如果邮件正文包含“你赢了 xxxxxx 的奖金”之类的句子，它是垃圾邮件\n- 来自我们的官方域名“Tutorialspoint.com”，不是垃圾邮件\n\
  - 来自已知来源，不是垃圾邮件\n\n\n\n\n最后，它结合了弱学习器的输出并形成一个强学习器，最终提升了模型的预测能力。Boosting 更加关注那些被分类错误或由于弱规则产生较高误差的样本。\n\
  \n## Boosting 算法类型\n\n有多种用于 Boosting 算法的引擎 - 决策树桩（decision stump）、极大边界分类算法等。这里列出了不同的\
  \ Boosting 算法 −\n\n- AdaBoost (自适应提升)\n- 梯度树提升 (Gradient Tree Boosting)\n- XGBoost\n\
  \n本节重点关注 `AdaBoost` 和梯度提升，随后是各自的 Boosting 算法。\n\n### AdaBoost\n\n观察以下解释 Ada-boost\
  \ 算法的图。\n\n![AdaBoost](img/image00172.jpeg)\n\n下方解释如下 −\n\n- **框 1** — 你可以看到我们为每个数据点分配了相同的权重，并应用决策树桩将它们分类为\
  \ +（正）或 –（负）。决策树桩（`D1`）在左侧创建了一条垂直线来对数据点进行分类。这条垂直线错误地预测了三个 +（正）为 –（负）。因此，我们将为这三个\
  \ +（正）分配更高的权重并应用另一个决策树桩。\n\n![AdaBoost](img/image00173.jpeg)\n\n- **框 2** — 在这里，可以看到与其余数据点相比，三个（预测错误的）+（正）数据点的尺寸更大。在这种情况下，第二个决策树桩（`D2`）将尝试正确预测它们。现在，此框右侧的垂直线（`D2`）将三个分类错误的\
  \ +（正）正确分类。但它再次导致了分类错误，这次是三个 –（负）数据点。我们再次为这三个 –（负）数据点分配更高的权重并应用另一个决策树桩。\n\n![AdaBoost\
  \ D2](img/image00174.jpeg)\n\n- **框 3** — 在这里，三个 –（负）数据点被赋予更高的权重。应用决策树桩（`D3`）来正确预测这些分类错误的观测值。这次生成了一条水平线，根据分类错误观测值的高权重来分类\
  \ +（正）和 –（负）数据点。\n\n![AdaBoost D3](img/image00175.jpeg)\n\n- **框 4** — 在这里，我们将 `D1`、`D2`\
  \ 和 `D3` 结合形成一个与单个弱学习器相比具有复杂规则的强预测。可以看出，与任何单个弱学习器相比，该算法对这些观测值的分类得非常好。\n\n![AdaBoost\
  \ D4](img/image00176.jpeg)\n\n`AdaBoost` 或自适应提升 — 其工作原理与上述类似。它在不同的加权训练数据上拟合一系列弱学习器。从预测原始数据集开始，给每个观测值分配相同的权重。如果使用第一个学习器预测不正确，则对预测错误的观测值赋予更高的权重。由于这是一个迭代过程，它会不断添加学习器，直到模型数量或准确率达到限制。\n\
  \n通常我们会在 `AdaBoost` 中使用决策树桩。但是，如果任何机器学习算法接受训练数据集上的权重，我们就可以将其作为基学习器。我们可以使用 `AdaBoost`\
  \ 算法解决分类和回归问题。\n\n你可以使用以下 Python 代码来实现此目的 −\n\n```python\n#for classification\n\
  from sklearn.ensemble import AdaBoostClassifier\n\n#for regression\nfrom sklearn.ensemble\
  \ import AdaBoostRegressor\nfrom sklearn.tree import DecisionTreeClassifier\n\n\
  dt = DecisionTreeClassifier()\nclf = AdaBoostClassifier(n_estimators=100, base_estimator=dt,learning_rate=1)\n\
  \n#这里我们使用了决策树作为基估计器；如果接受样本权重，任何机器学习学习器都可以作为基估计器\nclf.fit(x_train,y_train)\n```\n\
  \n### 调优参数\n\n可以通过调整参数来优化算法性能，调优的关键参数有 −\n\n- `n_estimators` — 这些控制弱学习器的数量。\n- `learning_rate`\
  \ — 这控制弱学习器在最终组合中的贡献。`learning_rate` 和 `n_estimators` 之间存在权衡。\n- `base_estimators`\
  \ — 这些有助于指定不同的机器学习算法。\n\n基学习器的参数也可以进行调整以优化其性能。\n\n### 梯度提升\n\n在梯度提升中，许多模型是按顺序训练的。每个新模型都使用梯度下降法逐渐最小整个系统的损失函数（`y\
  \ = ax + b + e`，其中 `e` 是误差项）。学习方法连续地拟合新模型，以对响应变量给出更准确的估计。\n\n该算法背后的核心思想构建新的基学习器，这些基学习器可以与整个集合的损失函数的负梯度达到最优相关。\n\
  \n在 Python Sklearn 库中，我们使用 `Gradient Tree Boosting` 或 `GBRT`，它是 Boosting 到任意可微损失函数的泛化。它可以同时用于回归和分类问题。\n\
  \n你可以使用以下代码来实现此目的 −\n\n```python\n#for classification\nfrom sklearn.ensemble import\
  \ GradientBoostingClassifier\n\n#for regression\nfrom sklearn.ensemble import GradientBoostingRegressor\n\
  \nclf = GradientBoostingClassifier(n_estimators = 100, learning_rate = 1.0, max_depth\
  \ = 1)\nclf.fit(X_train, y_train)\n```\n\n上述代码中使用的术如下 −\n\n- `n_estimators` — 这些控制弱学习器的数量。\n\
  - `learning_rate` — 这控制弱学习器在最终组合中的贡献。`learning_rate` 和 `n_estimators` 之间存在权衡。\n\
  - `max_depth` — 这是单个回归估计器的最大深度，限制了树节点数量。该参数通过调优获得最佳性能，最佳值取决于输入变量的交互。\n\n可以对损失函数进行调优以获得更好的性能。\n\
  \n感谢！\n\n"
