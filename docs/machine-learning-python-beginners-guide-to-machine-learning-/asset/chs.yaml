  \ X, Y, test_size=0.3)\nsns.set_context('notebook', font_scale=1.1)\nsns.set_style('ticks')\n\
  sns.lmplot('X1','X2', scatter=True, fit_reg=False, data=df, hue='Y')\nplt.ylabel('X2')\n\
