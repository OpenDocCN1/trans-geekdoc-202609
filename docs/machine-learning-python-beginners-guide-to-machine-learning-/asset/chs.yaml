  \n观察到输出中某些属性对存在对角线分组。这表示存在高度相关性和可预测的关系。\n\n## 训练数据与测试数据\n\n训练数据和测试数据是机器学习中的两个重要概念。本章将详细讨论它们。\n\
  \n### 训练数据\n\n训练集中的观测值构成了算法学习时使用的经验。在监督学习问题中，每个观测值由一个观测输出变量和一个或多个观测输入变量组成。\n\n###\
  \ 测试数据\n\n测试集是用于某些性能指标评估模型性能的观测值集合。重要的是，测试集中不能包含来自训练集的观测值。如果测试集中确实包含训练集的示例，将很难评估算法是学习了从训练集中泛化，还是仅仅简单地记住了它们。\n\
  \n泛化能力良好的程序能够有效地使用新数据执行任务。相比之下，一个通过学习过于复杂的模型来记忆训练数据的程序可以准确地预测训练集的响应变量值，但无法预测新示例的响应变量值。记忆训练集被称为\
  \ `过拟合`（`over-fitting`）。记忆观测值的程序可能无法很好地完成任务，因为它可能记住了噪声或巧合的联系和结构。平衡记忆与泛化，或平衡 `过拟合`（`over-fitting`）与`欠拟合`（`under-fitting`），是许多机器学习算法共同的问题。许多模型可以应用\
  \ `正则化`（`Regularization`）来减少 `过拟合`。\n\n除了训练数据和测试数据之外，有时还需要第三组观测值，称为验证集（`validation\
  \ set`）或留出集（`hold-out set`）。\n\n\n\n\n在开发过程中，特别是当训练数据稀缺时，可以使用名为 `cross-validation`（交叉验证）的方法在同一数据上对算法进行训练和验证。在\
  \ `cross-validation` 中，训练数据被划分开。算法使用除一个分区以外的所有分区进行训练，并在剩余的分区上进行测试。然后对分区进行若干次旋转，以便算法在所有数据上进行训练和评估。\n\
  \n例如，假设原始数据集被分为五个等大的子集，标记为 `A` 到 `E`。最初，模型在 `B` 到 `E` 分区上训练，并在 `A` 分区上测试。在下一次迭代中，模型在\
  \ `A`、`C`、`D` 和 `E` 分区上训练，并在 `B` 分区上测试。不断旋转分区，直到模型在所有分区上都经过训练和测试。与测试单个数据分区相比，`cross-validation`\
  \ 提供的模型性能估计更为准确。\n\n## 性能 性能衡量指标 − 偏差与方差\n\n可以使用许多指标来衡量程序是否正在学习更有效地执行其任务。对于监督学习问题，许多性能指标衡量的是预测错误的数量。\n\
  \n模型产生预测错误有两个根本原因——`bias`（偏差）和 `variance`（方差）。假设你有多许多训练集，它们都是唯一的，但对总体而言具有相同的代表性。高\
  \ `bias` 的模型无论使用哪个训练集进行训练，都会对输入产生相似的错误；该模型对真实关系的假设偏向于它自己的假设，忽略了训练数据中展示的关系。相反，高 `variance`\
  \ 的模型会根据其所训练的训练集的不同，对输入产生不同的错误。高 `bias` 模型缺乏灵活性，而高 `variance` 模型可能过于灵活，以至于模拟了训练集中的噪声。也就是说，高\
  \ `variance` 模型对训练数据导致了过拟合，而高 `bias` 模型对训练数据导致了欠拟合。\n\n理想情况下，模型应同时具有低 `bias` 和低\
  \ `variance`，但减少其中一个的努力往往会增加另一个。这被称为 `bias-variance trade-off`（偏差-方差权衡）。我们可能需要考虑本教程中引入的几个模型的\
  \ `bias-variance tradeoffs`。无监督学习问题没有用于衡量的错误信号；相反，无监督学习问题的性能指标衡量的是数据中发现的结构的某些属性。大多数性能衡量只能针对特定类型的任务进行。\n\
  \n机器学习系统应该使用代表现实世界中犯错成本的性能指标进行评估。虽然这看起来显而易见，但接下来的示例说明了如何使用一个通常适用于任务但不适用于其特定应用场景的性能指标。\n\
  \n## 准确率、精确率和召回率\n\n考虑一个分类任务，其中机器学习系统观察肿瘤并必须预测这些肿瘤是良性还是恶性性。`Accuracy`（准确率），即被正确分类的实例比例，是衡量程序性能的直观指标。虽然\
  \ `accuracy` 确实衡量了程序的性能，但它没有区分被误分类为良性的恶性肿瘤和被误分类为恶性的良性肿瘤。在某些应用中，所有类型错误的成本可能是相同的。然而，在这个问题中，未能识别恶性肿瘤比误将良性肿瘤分类为恶性是严重的错误。\n\
  \n我们可以衡量每个可能的预测结果以创建分类器性能的不同快照。当系统正确地将肿瘤分类为恶性时，该预测被称为 `true positive`（真阳性）。当系统错误地将良性肿瘤分类为恶性时，该预测被称为\
  \ `false positive`（假阳性）。同样，`false negative`（假阴性）是对肿瘤为良性的错误预测，而 `true negative`（真阴性）是对肿瘤为良性的正确预测。这四个结果可以用于若干常见的分类性能衡量，如准确、`precision`（精确率）、`recall`（召回率）等。\n\
  \n`Accuracy` 使用以下公式计算——\n\n```\nACC = (TP + TN)/(TP + TN + FP + FN)\n```\n\n其中，`TP`\
  \ 是真阳性数量\n`TN` 是真阴性数量\n`FP` 是假阳性数量\n`FN` 是假阴性数量。\n\n`Precision`（精确率）是预测为恶性的肿瘤中实际为恶性的比例。`Precision`\
  \ 使用以下公式计算——\n\n```\nPREC = TP/(TP + FP)\n```\n\n`Recall`（召回率）是系统识别出的恶性肿瘤比例。`Recall`\
  \ 使用以下公式计算——\n\n```\nR = TP/(TP + FN)\n```\n\n在这个示例中，`precision` 衡量预测为恶性的肿瘤中实际为恶性的比例。`recall`\
  \ 衡量检测出的真正恶性肿瘤的比例。`precision` 和 `recall` 衡量可能会揭示，一个准确率惊人的分类器实际上未能检测出大多数恶性肿瘤。如果大多数肿瘤是良性的，即使是从不预测恶性的分类器也可能有高准确率。一个准确率较低但\
  \ `recall` 较高的不同分类器可能更适合该任务，因为它能检测出更多的恶性肿瘤。还可以使用许多其他分类性能衡量指标。\n\n## 使用 Python 进行机器学习\
  \ – 技术\n\n本章将详细讨论机器学习中使用的每种技术。\n\n## 分类\n\n`Classification`（分类）是一种机器学习技术，它使用已知数据来确定如何将新数据分类到一组现有的类别中。\n\
  \n考虑以下示例来理解分类技术——\n\n*   一家`credit card company`收到了成上万份新信用卡申请。这些申请包含了关于几个不同特征的信息，如年龄、地点、性别、年薪、信用记录等。此处算法的任务是将卡申请人归类为几类，例如信用记录良好的人、信用记录不佳的人以及信用记录混合的人。\n\
  *   在`hospital`中，急诊室有 15 多个特征（年龄、血压、心脏状况、病情严重程度等）需要分析，以决定是否将某个患者放入重症监护室，因为这是一项昂贵的方案，只有那些能够生存并负担得起的患者才能获得最高优先级。这里的问题是根据可用特征或参数将患者分为高风险患者和低风险患者。\n\
  \n在对给定数据集进行分类时，分类器系统执行以下操作——\n\n*   最初使用任何学习算法准备一个新的数据模型。\n*   然后对准备好的数据模型进行测试。\n\
  *   随后，使用该数据模型检查新数据并确定其类别。\n\n`Classification`，也称为范畴（categorization），是一种机器学习技术，它使用已知数据来确定如何将新数据分类到一组现有的标签/类/类别中。\n\
  \n\n\n\n分类是一种监督学习的形式。Gmail、Yahoo 等其他邮件服务提供商使用这种技术将新邮件分类为垃圾邮件或非垃圾邮件。分类算法通过分析用户将某些邮件标记为垃圾邮件的行为来完成自我训练。基于这些信息，分类器会决定新邮件是应该进入收件箱还是进入垃圾邮件文件夹。\n\
  \n## 分类的应用\n\n- 信用卡欺诈检测 - ` `Classification` 方法被用于预测信用卡欺诈。通过利用以往欺诈的的历史记录，分类器可以预测未来哪些交易可能变成欺诈。\n\
  - 电子邮件垃圾邮件 - 根据之前垃圾邮件的特征，分类器决定新收到的电子邮件是否应该被发送到垃圾邮件文件夹。\n\n## 朴素贝叶斯分类器技术\n\n分类技术包括\
  \ `Naive Bayes Classifier`，这是一种构建分类器的简单技术。它不是用于训练此类分类器的单一算法，而是一组算法。`Bayes` 分类器构建模型对问题实例进行分类。这些分类是使用可用数据进行的。\n\
  \n`naive Bayes classifier` 的一个重要特征是它只需要少量的训练数据就可以估计分类所需的参数。对于某些类型的模型，在监督学习设置中可以非常高效地训练\
  \ `naive Bayes classifiers`。尽管其假设过于简化，但 `naive Bayes classifiers` 在许多复杂的现实情况下都运行良好。它们在垃圾邮件过滤和文档分类中表现出色。\n\
  \n## 回归\n\n在回归中，程序预测连续输出或响应变量的值。回归问题的示例包括预测新产品的销售额，或根据职位描述预测工资。与分类类似，回归问题需要监督学习。在回归任务中，程序从输入或解释变量预测连续输出或响应变量的值。\n\
  \n## 推荐\n\n推荐是一种流行的方法，根据购买历史、点击和评分等用户信息提供密切的推荐。Google 和 Amazon 使用这种方法根据用户过去的活动信息为用户显示推荐项目列表。存在\
  \ `recommender engines` 在后台运行，捕捉用户行为并根据早期的用户行为推荐所选项目。Facebook 也使用推荐方法来识别和推荐人员，并向其用户发送好友建议。\n\
  \n`recommendation engine` 是一个根据用户过去的记录和行为预测其可能感兴趣的内容的模型。当这被应用于电影语境时，它就变成了电影推荐引擎。我们通过预测用户可能对电影如何评分来过滤电影数据库中的项目。这有助于我们将用户与电影数据库中的正确内容连接起来。这种技术在两个方面非常有用：如果我们有一个海量的电影数据库，用户可能会也可能无法找到与其选择相关的内容。此外，通过推荐相关内容，我们可以增加消费并获得更多用户。\n\
  \nNetflix、Amazon Prime 和类似的电影租赁公司依赖推荐引擎来保持用户的参与度。推荐引擎通常使用协同过滤或基于内容的过滤来生成推荐列表。这两种类型的区别在于提取推荐的方式。协同过滤根据当前用户的过去行为以及其他用户的评分来构建模型。然后该模型被用于预测该用户可能感兴趣的内容。另一方面，基于内容的过滤使用项目本身的特征来向用户推荐更多项目。项目之间的相似性是这里的主要动力。协同过滤通常更多用于此类推荐方法。\n\
  \n## 聚类\n\n相关的观测值组被称为聚类。一种常见的无监督学习任务是在训练数据中寻找类。\n\n我们也可以将聚类定义为一种程序，根据某些相似特征将给定集合中的项目分组。例如，在线新闻出版者使用聚类对其新闻文章进行分组。\n\
  \n## 聚类的应用\n\n聚类应用于许多领域，如市场研究、模式识别、数据分析和图像处理。正如此处所述：\n\n- 帮助营销人员在其客户群中发现不同的群体，并根据购买模式对其客户群进行特征描述。\n\
  - 在生物学中，它可以用于推导出植物动物分类，对具有相似功能的基因进行分类，并对种群固产生结构。\n- 帮助识别地球观测数据库中土地用途相似的区域。\n- 帮助对网络上的文档进行分类以发现信息。\n\
  - 用于异常值检测应用，如信用卡欺诈检测。\n- `Cluster Analysis` 作为数据挖掘功能工具，用于深入了解数据分布以观察每个类的特征。\n\n\
  该任务被称为聚类或聚类分析，它将观测值分配到组，使得组内的观测值根据某些相似性度量，彼此之间与其他组的观测值更相似。\n\n聚类通常用于探索数据集。例如，给定一组电影评论，聚类算法可能会发现正面评论和负面评论的集合。系统将无法将这些类标记为“正面”或“负面”；在没有监督的情况下，它只知道分组的观测值在某些标准上是相似的。聚类的一个常见应用是发现产品市场中的客户细分。通过理解特定客户群的共同属性，营销人员可以决定其活动需要强调哪些方面。聚类也用于网络电台服务；例如，给定一组歌曲，聚类算法可以根据流派对歌曲进行分组。使用不同的相似性度量，同一个聚类算法可能会根据歌曲的调性或其包含的乐器进行分组。\n\
  \n无监督学习任务包括聚类，其中观测值根据某些相似特征组织成组。聚类用于根据共同特征形成相似数据的分组或类。\n\n聚类是一种无监督学习的形式。Google、Bing\
  \ 和 Yahoo! 等搜索引擎使用聚类技术将具有相似特征的数据分组。新闻组使用聚类技术根据相关主题对各种文章分组。\n\n聚类引擎完全处理输入数据，并根据数据的特征决定其应该归类到哪个类中。在聚类时可以注意以下几点：\n\
  \n- 需要选择一种合适的聚类算法对类的元素进行分组。\n- 需要一个规则来验证新遇到的元素与组内元素之间的相似性。\n- 需要一个停止条件来定义不再需要聚类的点。\n\
  \n## 聚类的类型\n\n聚类有两种类型——`flat clustering`（平铺聚类）和 `hierarchical clustering`（层次聚类）。\n\
  \n\n\n\n平聚类创建了一个平面的簇集，没有任何可以将簇之间相互关联的清晰结构。层次聚类则创建一个簇的层级结构。层次聚类的输出是一个层级级结构，这种结构比平聚类返回的无结构簇集包含更多信息。层次聚类不需要我们预先指定簇的数量。层次聚类的优势是以效率较低为代价的。\n\
  \n通常情况下，当效率很重要时，我们选择平聚类；而当平聚类的某个潜在问题成为问题时，我们选择层次聚类。此外，许多研究人员认为，层次聚类产生的簇比平聚类更好。\n\
  \n## 聚类算法\n\n你需要聚类算法来对给定数据进行聚类。常用的有两种算法——`Canopy clustering` 和 `K-Means clustering`。\n\
  \nCanopy 聚类算法是一种无监督预聚类算法，通常用作 `K-means` 算法或 `Hierarchical clustering` 算法的预处理步骤。它用于加速大型数据集上的聚类操作，由于数据集巨大，可能无法直接使用另一种算法。\n\
  \nK-means 聚类是一种重要的聚类算法。`k-means` 聚类算法中的 `k` 代表数据要划分的簇数。例如，如果算法中指定的 `k` 值为 3，那么算法将数据划分为\
  \ 3 个簇。\n\n每个对象被表示为空间中的一个向量。最初，算法随机选择 `k` 个点并将其视为中心，距离每个中心最近的对象被归一类。`k-means` 算法需要向量文件作为输入，因此我们需要创建向量文件。创建向量后，我们进行\
  \ `k-means` 算法。\n\n## 使用 Python 进行机器学习 – 算法\n\n机器学习算法大体分为两类——`Supervised`（监督）和 `supervised`（无监督）。本章将详细讨论它们。\n\
  \n## 监督学习\n\n该算法包含一个目标、结果或因变量，该变量根据给定的预测变量或独立变量预测。使用这些变量，我们生成一个将输入变量映射到所需输出变量的函数。训练过程持续，直到模型在训练数据上达到所需的准确率。\n\
  \n监督学习的示例——回归、决策树、随机森林、`KNN`、逻辑回归等。\n\n## 无监督学习\n\n在算法算法中，没有待预测或估计的目标、结果或因变量。它用于将给定数据集聚类到不同的组，广泛用于将客户分为不同的组以进行特定的干预。`Apriori`\
  \ 算法和 `K-means` 是无监督学习的一些示例。\n\n## 强化学习\n\n使用该算法，训练机器以做出特定的决策。在这里，算法通过试错法和反馈方法不断训练自己。这种机器从过去的经验中学习，并试图捕捉尽可能好的知识以做出准确的业务决策。\n\
  \n`Markov Decision Process` 是强化学习的一个示例。\n\n## 常见机器学习算法列表\n\n以下是可以应用于几乎任何数据问题的常用机器学习算法列表——\n\
  \n*   线性回归\n*   逻辑回归\n*   决策树\n*   `SVM`\n*   朴素贝叶斯\n*   `KNN`\n*   `K-Means` *\n\
  *   随机森林\n*   降维算法\n*   梯度提升算法，如 `GBM`、`XGBoost`、`LightGBM` 和 `CatBoost`\n\n本节将详细讨论每一种——\n\
  \n## 线性回归\n\n线性回归用于根据连续变量估计真实世界的值，如房屋价格、通话次数、总销售额等。在这里，我们通过拟合一条最佳线来建立因变量和独立变量之间的关系。这条回归线被称为\
  \ `regression line`，由线性方程 `Y = a * X + b` 表示。\n\n在该方程中——\n\n*   `Y` – 因变量\n*   `a`\
  \ – 斜率\n*   `X` – 独立变量\n*   `b` – 截距\n\n这些系数 `a` 和 `b` 是根据最小化数据点与回归线之间距离平方和得出的。\n\
  \n### 示例\n\n理解线性回归的最佳方法是考虑一个例子。假设我们被要求按体重的增加顺序排列班级的学生。通过观察学生并在视觉上分析他们的身高和体型，我们可以结合这些参数（即身高和体型）按照要求进行排列。这是一个真实世界的线性回归示例。我们发现身高和体型与体重之间存在关系，这种关系类似于上面的方程。\n\
  \n### 线性回归的类型\n\n线性回归主要有两种——`Simple Linear Regression`（简单线性回归）和 `Multiple Linear\
  \ Regression`（多元线性回归）。简单线性回归的特征是一个独立变量，而多元线性回归的特征是多个独立变量。在寻找最佳拟线时，你可以拟合多项式回归或曲线回归。你可以使用以下代码来实现此。\n\
  \n```\nimport matplotlib.pyplot as plt\nplt.scatter(X, Y)\nyfit = [a + b * xi for\
  \ xi in X]\nplt.plot(X, yfit)\n```\n\n### 构建线性回归器\n\n回归是估计输入与连续值输出之间关系的过程。这些数据通常以实数形式存在，我们的目标是估计控制从输入到输出映射的底层函数。\n\
  \n考虑所示的输入输出映射——\n\n*   1 --> 2\n*   3 --> 6\n*   4.3 --> 8.6\n\n你可以通过分析模式轻松地估计输入和输出之间的关系。我们可以观察到在每种情况下输出都是输入值的两倍，因此转换将是\
  \ `f(x) = 2x`。\n\n线性回归是指使用输入变量线性组合来估计相关函数。之前的示例是一个包含一个输入变量和一个输出变量的例子。线性回归的目标是提取关联输入变量与输出变量的线性模型。它旨在最小化实际输出与预测输出之间的差异平方和。这种方法被称为\
  \ `Ordinary Least Squares`（普通最小二法）。你可能假设某条曲线能更好地拟合这些点，但线性回归不允许这样做。线性回归的主要优势是它不复杂。你也可以在非线性回归中找到更准确的模型，但它们速度较慢。在这里模型尝试使用直线来近似数据点。\n\
  \n让我们了解如何在 Python 中构建线性回归模型。\n\n假设提供了一个数据文件，名为 `data_singlevar.txt`。它包含逗号分隔的行，第一个元素是输入值，第二个元素是对应该输入值的输出值。你应该将其作为输入参数。\n\
  \n```python\n### 样本点\nX = [0, 6, 11, 14, 22]\nY = [1, 7, 12, 15, 21]\n\n### 求解 a\
  \ 和 b\ndef best_fit(X, Y):\n    xbar = sum(X)/len(X)\n    ybar = sum(Y)/len(Y)\n\
  \    n = len(X) # 或 len(Y)\n    numer = sum([xi*yi for xi,yi in zip(X, Y)]) - n\
  \ * xbar * ybar\n    denom = sum([xi**2 for xi in X]) - n * xbar**2\n    b = numer\
  \ / denom\n    a = ybar - b * xbar\n    print('最佳拟合线:\\ny = {:.2f} + {:.2f}x'.format(a,\
  \ b))\n    return a, b\n\n### solution\n```\n\n\n\n\n`a, b = best_fit(X, Y)`\n\n\
  ### 拟合线：\n\n`y = 0.80 + 0.92x`\n\n### 绘制点和拟合线\n\n```python\nimport matplotlib.pyplot\
  \ as plt\n\nplt.scatter(X, Y)\n\nyfit = [a + b * xi for xi in X]\n\nplt.plot(X,\
  \ yfit)\n\nplt.show()\n```\n\n拟合线：\n\n`y = 1.48 + 0.92x`\n\n如果你运行上述代码，你可以观察到所示的输出图\
  \ −\n\n![线性回归](img/image00159.jpeg)\n\n注意，此示例仅使用了糖尿病数据集（diabetes dataset）的第一个特征，为了展示这种回归技术的二二维图表。在图中可以看到直线，它展示了线性回归如何尝试绘制一条直线，以最大程度地化数据集中观测响应值与线性近似预测值之间的残差和。\n\
  \n你可以使用下方的程序代码计算系数、残差平方和以及方差得分 −\n\n```python\nimport matplotlib.pyplot as plt\n\
  import numpy as np\nfrom sklearn import datasets, linear_model\nfrom sklearn.metrics\
  \ import mean_squared_error, r2_score\n\n### 加载糖尿病数据集\ndiabetes = datasets.load_diabetes()\n\
  \n### 只使用一个特征\ndiabetes_X = diabetes.data[:, np.newaxis, 2]\n\n### 将数据划分为训练/测试集\n\
  diabetes_X_train = diabetes_X[:-30]\ndiabetes_X_test = diabetes_X[-30:]\n\n### 将目标划分为训练/测试集\n\
  diabetes_y_train = diabetes.target[:-30]\ndiabetes_y_test = diabetes.target[-30:]\n\
  \n### 创建线性回归对象\nregr = linear_model.LinearRegression()\n\n### 使用训练集训练模型\nregr.fit(diabetes_X_train,\
  \ diabetes_y_train)\n\n### 使用测试集进行预测\ndiabetes_y_pred = regr.predict(diabetes_X_test)\n\
  \n### 系数\nprint('Coefficients: \\n', regr.coef_)\n\n### 均方误差\nprint(\"Mean squared\
  \ error: %.2f\" \n      % mean_squared_error(diabetes_y_test, diabetes_y_pred))\n\
  \n### 解释方得分：1 表示完美预测\nprint('Variance score: %.2f' % r2_score(diabetes_y_test, diabetes_y_pred))\n\
  \n### 绘制输出\nplt.scatter(diabetes_X_test, diabetes_y_test, color='black')\nplt.plot(diabetes_X_test,\
  \ diabetes_y_pred, color='blue', linewidth=3)\nplt.xticks(())\nplt.yticks(())\n\
  plt.show()\n```\n\n一旦执行了上述代码，你可以观察到以下输出 −\n\n为 IPython 交互环境自动创建模块\n('Coefficients:\
  \ \\n', array([ 941.43097333\\]))\nMean squared error: 3035.06\nVariance score:\
  \ 0.41\n\n![线性回归 2](img/image00160.jpeg)\n\n## 逻辑回归\n\n逻辑回归是机器学习从统计学中借用的另一种技术。它是二分类问题的首选方法，即具有两个类别值的问题。\n\
  \n它是一个分类算法，而不是如名称所说的回归算法。它用于根据给定的独立变量集来估计离散值或像 `0/1`、`Y/N`、`T/F` 这样的值。它通过将数据拟合到\
  \ logit 函数来预测事件发生的概率。因此，它也被称为 `logit 回归`。由于它预测的是概率，其输出值位于 0 和 1 之间。\n\n### 示例\n\n\
