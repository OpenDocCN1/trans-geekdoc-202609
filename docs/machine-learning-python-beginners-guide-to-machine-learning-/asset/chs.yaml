  \ X（预测变量）和 Y（目标）以及测试数据集的 x_test（预测变量）\n\n### 创建 KNeighbors 分类器对象模型\nKNeighborsClassifier(n_neighbors=6)\
  \ # n_neighbors 的默认值为 5\n\n### 使用训练集训练模型并检查得分\nmodel.fit(X, y)\n\n### 预测输出\npredicted\
  \ = model.predict(x_test)\n```\n\n```python\nfrom sklearn.neighbors import KNeighborsClassifier\n\
