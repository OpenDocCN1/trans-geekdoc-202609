    \ X, Y, test_size=0.3)\nsns.set_context('notebook', font_scale=1.1)\nsns.set_style('ticks')\n\
    sns.lmplot('X1','X2', scatter=True, fit_reg=False, data=df, hue='Y')\nplt.ylabel('X2')\n\
    plt.xlabel('X1')\n```\n\nYou can notice the following output and plot when you\
    \ run the code shown above −\n\nText(0.5,27.256,'X1')\n\n![Support Vector Machines3](Images/image00165.jpeg)\n\
    \n# Naïve Bayes Algorithm\n\nIt is a classification technique based on Bayes’\
    \ theorem with an assumption that predictor variables are independent. In simple\
    \ words, a Naive Bayes classifier assumes that the presence of a particular feature\
    \ in a class is not related to the presence of any other feature.\n\nFor example,\
    \ a fruit may be considered to be an orange if it is orange in color, round, and\
    \ about 3 inches in diameter. Even if these features are dependent on each other\
    \ or upon the existence of the other features, a naive Bayes classifier would\
    \ consider all of these characteristics to independently contribute to the probability\
    \ that this fruit is an orange.\n\nNaive Bayesian model is easy to make and particularly\
    \ useful for very large data sets. Apart from being simple, Naive Bayes is known\
    \ to outperform even highly advanced classification methods.\n\nBayes theorem\
    \ provides a way of calculating posterior probability `P(c|x)` from `P(c)`, `P(x)`\
    \ and `P(x|c)`. Observe the equation provided here: `P(c/x) = P(x/c)P(c)/P(x)`\n\
    \nwhere,\n\n- `P(c|x)` is the posterior probability of class (target) given predictor\
    \ (attribute).\n- `P(c)` is the prior probability of class.\n- `P(x|c)` is the\
    \ likelihood which is the probability of predictor given class.\n- `P(x)` is the\
    \ prior probability of predictor.\n\nConsider the example given below for a better\
    \ understanding −\n\nAssume a training data set of `Weather` and corresponding\
    \ target variable `Play`. Now, we need to classify whether players will play or\
    \ not based on weather condition. For this you will have to take the steps shown\
    \ below −\n\n**Step 1** − Convert the data set to frequency table.\n\n**Step 2**\
    \ − Create Likelihood table by finding the probabilities like Overcast probability\
    \ = 0.29 and probability of playing is 0.64.\n\n![Naive Bayes Algorithm](Images/image00166.jpeg)\n\
    \n**Step 3** − Now, use Naive Bayesian equation to calculate the posterior probability\
    \ for each class. The class with the highest posterior probability is the outcome\
    \ of prediction.\n\n**Problem** — Players will play if weather is sunny, is this\
    \ correct?\n\n**Solution** — We can solve it using the method above, so `P(Yes\
    \ | Sunny) = P(Yes | Sunny) * P(Yes) / P(Sunny)`. Here we have, `P(Yes | Sunny)\
    \ = 3/9 = 0.33`, `P(Sunny) = 5/14 = 0.36`, `P(Yes) = 9/14 = 0.64`. Now, `P(Yes\
    \ | Sunny) = 0.33 * 0.64 / 0.36 = 0.60`, which has a higher probability.\n\nNaive\
    \ Bayes uses a similar method to predict the probability of different classes\
    \ based on various attributes. This algorithm is mostly used in text classification\
    \ and with multiple classes. The following code shows an example of Naive implementation\
    \ —\n\n```python\nimport csv\nimport random\nimport math\n\ndef loadCsv(filename):\n\
    \    lines = csv.reader(open(filename, \"rb\"))\n    dataset = list(lines)\n \
    \   for i in range(len(dataset)):\n        dataset[i] = [float(x) for x in dataset[i]]\n\
    \    return dataset\n\ndef splitDataset(dataset, splitRatio):\n    trainSize =\
    \ int(len(dataset) * splitRatio)\n    trainSet = []\n    copy = list(dataset)\n\
    \    while len(trainSet) < trainSize:\n        index = random.randrange(len(copy))\n\
    \        trainSet.append(copy.pop(index))\n    return trainSet, copy\n\ndef separateByClass(dataset):\n\
    \    separated = {}\n    for i in range(len(dataset)):\n        vector = dataset[i]\n\
    \        if vector[-1] not in separated:\n            separated[vector[-1]] =\
    \ []\n        separated[vector[-1]].append(vector)\n    return separated\n\ndef\
    \ mean(numbers):\n    return sum(numbers)/float(len(numbers))\n\ndef stdev(numbers):\n\
    \    avg = mean(numbers)\n    variance = sum([pow(x-avg,2) for x in numbers])/float(len(numbers)-1)\n\
    \    return math.sqrt(variance)\n\ndef summarize(dataset):\n    summaries = [(mean(attribute),\
    \ stdev(attribute)) for attribute in zip(*dataset)]\n\ndef summarizeByClass(dataset):\n\
    \    separated = separateByClass(dataset)\n    summaries = {}\n    for classValue,\
    \ instances in separated.iteritems():\n        summaries[classValue] = summarize(instances)\n\
    \    return summaries\n\ndef calculateProbability(x, mean, stdev):\n    exponent\
    \ = math.exp(-(math.pow(x-mean,2)/(2*math.pow(stdev,2))))\n    return (1 / (math.sqrt(2*math.pi)\
    \ * stdev)) * exponent\n\ndef calculateClassProbabilities(summaries, inputVector):\n\
    \    probabilities = {}\n    for classValue, classSummaries in summaries.iteritems():\n\
    \        probabilities[classValue] = 1\n        for i in range(len(classSummaries)):\n\
    \            mean, stdev = classSummaries[i]\n            x = inputVector[i]\n\
    \            probabilities[classValue] *= calculateProbability(x, mean, stdev)\n\
    \    return probabilities\n\ndef predict(summaries, inputVector):\n    probabilities\
    \ = calculateClassProbabilities(summaries, inputVector)\n    bestLabel, bestProb\
    \ = None, -1\n    for classValue, probability in probabilities.iteritems():\n\
    \        if bestLabel is None or probability > bestProb:\n            bestProb\
    \ = probability\n            bestLabel = classValue\n    return bestLabel\n\n\
    def getPredictions(summaries, testSet):\n    predictions = []\n    for i in range(len(testSet)):\n\
    \        result = predict(summaries, testSet[i])\n        predictions.append(result)\n\
    \    return predictions\n\ndef getAccuracy(testSet, predictions):\n    correct\
    \ = 0\n    for i in range(len(testSet)):\n        if testSet[i][-1] == predictions[i]:\n\
    \            correct += 1\n    return (correct/float(len(testSet))) * 100.0\n\n\
    def main():\n```\n"
