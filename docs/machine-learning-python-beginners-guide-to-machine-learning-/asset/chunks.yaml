  trans: '

    分类是一种监督学习的形式。Gmail、Yahoo 等其他邮件服务提供商使用这种技术将新邮件分类为垃圾邮件或非垃圾邮件。分类算法通过分析用户将某些邮件标记为垃圾邮件的行为来完成自我训练。基于这些信息，分类器会决定新邮件是应该进入收件箱还是进入垃圾邮件文件夹。


    ## 分类的应用


    - 信用卡欺诈检测 - ` `Classification` 方法被用于预测信用卡欺诈。通过利用以往欺诈的的历史记录，分类器可以预测未来哪些交易可能变成欺诈。

    - 电子邮件垃圾邮件 - 根据之前垃圾邮件的特征，分类器决定新收到的电子邮件是否应该被发送到垃圾邮件文件夹。


    ## 朴素贝叶斯分类器技术


    分类技术包括 `Naive Bayes Classifier`，这是一种构建分类器的简单技术。它不是用于训练此类分类器的单一算法，而是一组算法。`Bayes`
    分类器构建模型对问题实例进行分类。这些分类是使用可用数据进行的。


    `naive Bayes classifier` 的一个重要特征是它只需要少量的训练数据就可以估计分类所需的参数。对于某些类型的模型，在监督学习设置中可以非常高效地训练
    `naive Bayes classifiers`。尽管其假设过于简化，但 `naive Bayes classifiers` 在许多复杂的现实情况下都运行良好。它们在垃圾邮件过滤和文档分类中表现出色。


    ## 回归


    在回归中，程序预测连续输出或响应变量的值。回归问题的示例包括预测新产品的销售额，或根据职位描述预测工资。与分类类似，回归问题需要监督学习。在回归任务中，程序从输入或解释变量预测连续输出或响应变量的值。


    ## 推荐


    推荐是一种流行的方法，根据购买历史、点击和评分等用户信息提供密切的推荐。Google 和 Amazon 使用这种方法根据用户过去的活动信息为用户显示推荐项目列表。存在
    `recommender engines` 在后台运行，捕捉用户行为并根据早期的用户行为推荐所选项目。Facebook 也使用推荐方法来识别和推荐人员，并向其用户发送好友建议。


    `recommendation engine` 是一个根据用户过去的记录和行为预测其可能感兴趣的内容的模型。当这被应用于电影语境时，它就变成了电影推荐引擎。我们通过预测用户可能对电影如何评分来过滤电影数据库中的项目。这有助于我们将用户与电影数据库中的正确内容连接起来。这种技术在两个方面非常有用：如果我们有一个海量的电影数据库，用户可能会也可能无法找到与其选择相关的内容。此外，通过推荐相关内容，我们可以增加消费并获得更多用户。


    Netflix、Amazon Prime 和类似的电影租赁公司依赖推荐引擎来保持用户的参与度。推荐引擎通常使用协同过滤或基于内容的过滤来生成推荐列表。这两种类型的区别在于提取推荐的方式。协同过滤根据当前用户的过去行为以及其他用户的评分来构建模型。然后该模型被用于预测该用户可能感兴趣的内容。另一方面，基于内容的过滤使用项目本身的特征来向用户推荐更多项目。项目之间的相似性是这里的主要动力。协同过滤通常更多用于此类推荐方法。


    ## 聚类


    相关的观测值组被称为聚类。一种常见的无监督学习任务是在训练数据中寻找类。


    我们也可以将聚类定义为一种程序，根据某些相似特征将给定集合中的项目分组。例如，在线新闻出版者使用聚类对其新闻文章进行分组。


    ## 聚类的应用


    聚类应用于许多领域，如市场研究、模式识别、数据分析和图像处理。正如此处所述：


    - 帮助营销人员在其客户群中发现不同的群体，并根据购买模式对其客户群进行特征描述。

    - 在生物学中，它可以用于推导出植物动物分类，对具有相似功能的基因进行分类，并对种群固产生结构。

    - 帮助识别地球观测数据库中土地用途相似的区域。

    - 帮助对网络上的文档进行分类以发现信息。

    - 用于异常值检测应用，如信用卡欺诈检测。

    - `Cluster Analysis` 作为数据挖掘功能工具，用于深入了解数据分布以观察每个类的特征。


    该任务被称为聚类或聚类分析，它将观测值分配到组，使得组内的观测值根据某些相似性度量，彼此之间与其他组的观测值更相似。


    聚类通常用于探索数据集。例如，给定一组电影评论，聚类算法可能会发现正面评论和负面评论的集合。系统将无法将这些类标记为“正面”或“负面”；在没有监督的情况下，它只知道分组的观测值在某些标准上是相似的。聚类的一个常见应用是发现产品市场中的客户细分。通过理解特定客户群的共同属性，营销人员可以决定其活动需要强调哪些方面。聚类也用于网络电台服务；例如，给定一组歌曲，聚类算法可以根据流派对歌曲进行分组。使用不同的相似性度量，同一个聚类算法可能会根据歌曲的调性或其包含的乐器进行分组。


    无监督学习任务包括聚类，其中观测值根据某些相似特征组织成组。聚类用于根据共同特征形成相似数据的分组或类。


    聚类是一种无监督学习的形式。Google、Bing 和 Yahoo! 等搜索引擎使用聚类技术将具有相似特征的数据分组。新闻组使用聚类技术根据相关主题对各种文章分组。


    聚类引擎完全处理输入数据，并根据数据的特征决定其应该归类到哪个类中。在聚类时可以注意以下几点：


    - 需要选择一种合适的聚类算法对类的元素进行分组。

    - 需要一个规则来验证新遇到的元素与组内元素之间的相似性。

    - 需要一个停止条件来定义不再需要聚类的点。


    ## 聚类的类型


    聚类有两种类型——`flat clustering`（平铺聚类）和 `hierarchical clustering`（层次聚类）。


    '
- fmt: "\nFlat clustering creates a flat set of clusters without any clear structure\
    \ that can relate clusters to each other. Hierarchical clustering creates a hierarchy\
    \ of clusters. Hierarchical clustering gives a hierarchy of clusters as output,\
    \ a structure that yields more information than the unstructured set of clusters\
    \ returned by flat clustering. Hierarchical clustering does not require us to\
    \ specify beforehand the number of clusters. The advantages of hierarchical clustering\
    \ come at the cost of lower efficiency.\n\nIn general, we select flat clustering\
    \ when efficiency is important and hierarchical clustering when one of the potential\
    \ problems of flat clustering is an issue. Moreover, it is believed by many researchers\
    \ that hierarchical clustering produces better clusters than flat clustering.\n\
    \n# Clustering Algorithms\n\nYou need clustering algorithms to cluster a given\
    \ data. Two algorithms are frequently used - `Canopy clustering` and `K-Means\
    \ clustering`.\n\nThe canopy clustering algorithm is an unsupervised pre-clustering\
    \ algorithm that is often used as preprocessing step for the `K-means` algorithm\
    \ or the `Hierarchical clustering` algorithm. It is used to speed up clustering\
    \ operations on large data sets, where using another algorithm directly may not\
    \ be possible due to large size of the data sets.\n\nK-means clustering is an\
    \ important clustering algorithm. The `k` in `k-means` clustering algorithm represents\
    \ the number of clusters the data is to be divided into. For example, if the `k`\
    \ value specified in the algorithm is 3, then algorithm will divide the data into\
    \ 3 clusters.\n\nEach object is represented as a vector in space. Initially `k`\
    \ points are chosen by the algorithm randomly and treated as centers, every object\
    \ closest to each center are clustered. The `k-means` algorithm requires vector\
    \ files as input, therefore we need to create vector files. After creating vectors,\
    \ we proceed with `k-means` algorithm.\n\n# Machine Learning with Python – Algorithms\n\
    \nMachine learning algorithms can be broadly classified into two types - `Supervised`\
    \ and `Unsupervised`. This chapter discusses them in detail.\n\n## Supervised\
    \ Learning\n\nThis algorithm consists of a target or outcome or dependent variable\
    \ which is predicted from a given set of predictor or independent variables. Using\
    \ these set of variables, we generate a function that maps input variables to\
    \ desired output variables. The training process continues until the model achieves\
    \ a desired level of accuracy on the training data.\n\nExamples of Supervised\
    \ Learning - Regression, Decision Tree, Random Forest, `KNN`, Logistic Regression\
    \ etc.\n\n## Unsupervised Learning\n\nIn this algorithm, there is no target or\
    \ outcome or dependent variable to predict or estimate. It is used for clustering\
    \ a given data set into different groups, which is widely used for segmenting\
    \ customers into different groups for specific intervention. `Apriori` algorithm\
    \ and `K-means` are some of the examples of Unsupervised Learning.\n\n## Reinforcement\
    \ Learning\n\nUsing this algorithm, the machine is trained to make specific decisions.\
    \ Here, the algorithm trains itself continually by using trial and error methods\
    \ and feedback methods. This machine learns from past experiences and tries to\
    \ capture the best possible knowledge to make accurate business decisions.\n\n\
    `Markov Decision Process` is an example of Reinforcement Learning.\n\n# List of\
    \ Common Machine Learning Algorithms\n\nHere is the list of commonly used machine\
    \ learning algorithms that can be applied to almost any data problem −\n\n*  \
    \ Linear Regression\n*   Logistic Regression\n*   Decision Tree\n*   `SVM`\n*\
    \   Naive Bayes\n*   `KNN`\n*   `K-Means`\n*   Random Forest\n*   Dimensionality\
    \ Reduction Algorithms\n*   Gradient Boosting algorithms like `GBM`, `XGBoost`,\
    \ `LightGBM` and `CatBoost`\n\nThis section discusses each of them in detail –\n\
    \n## Linear Regression\n\nLinear regression is used to estimate real world values\
    \ like cost of houses, number of calls, total sales etc. based on continuous variable(s).\
    \ Here, we establish relationship between dependent and independent variables\
    \ by fitting a best line. This line of best fit is known as `regression line`\
    \ and is represented by the linear equation `Y = a * X + b`.\n\nIn this equation\
    \ −\n\n*   `Y` – Dependent Variable\n*   `a` – Slope\n*   `X` – Independent variable\n\
    *   `b` – Intercept\n\nThese coefficients `a` and `b` are derived based on minimizing\
    \ the sum of squared difference of distance between data points and regression\
    \ line.\n\n### Example\n\nThe best way to understand linear regression is by considering\
    \ an example. Suppose we are asked to arrange students in a class in the increasing\
    \ order of their weights. By looking at the students and visually analyzing their\
    \ heights and builds we can arrange them as required using a combination of these\
    \ parameters, namely height and build. This is real world linear regression example.\
    \ We have figured out that height and build have correlation to the weight by\
    \ a relationship, which looks similar to the equation above.\n\n### Types of Linear\
    \ Regression\n\nLinear Regression is of mainly two types - `Simple Linear Regression`\
    \ and `Multiple Linear Regression`. Simple Linear Regression is characterized\
    \ by one independent variable while Multiple Linear Regression is characterized\
    \ by more than one independent variables. While finding the line of best fit,\
    \ you can fit a polynomial or curvilinear regression. You can use the following\
    \ code for this.\n\n```\nimport matplotlib.pyplot as plt\nplt.scatter(X, Y)\n\
    yfit = [a + b * xi for xi in X]\nplt.plot(X, yfit)\n```\n\n### Building a Linear\
    \ Regressor\n\nRegression is the process of estimating the relationship between\
    \ input and continuous-valued output. This data is usually in form of real numbers,\
    \ and our goal is to estimate the underlying function that governs mapping from\
    \ input to output.\n\nConsider a mapping between input and output as shown −\n\
    \n*   1 --> 2\n*   3 --> 6\n*   4.3 --> 8.6\n\nYou can easily estimate the relationship\
    \ between inputs and outputs by analyzing the pattern. We can observe that output\
    \ is twice the input value in each case, hence the transformation would be `f(x)\
    \ = 2x`.\n\nLinear regression refers to estimating the relevant function using\
    \ a linear combination of input variables. The preceding example was an example\
    \ that consisted of one input variable and one output variable. The goal of linear\
    \ regression is to extract the linear model that relates input variable to output\
    \ variable. This aims to minimize sum of squares of differences between actual\
    \ output and predicted output using a linear function. This method is called `Ordinary\
    \ Least Squares`. You may assume that curvy line out there fits these points better,\
    \ but linear regression does not allow this. The main advantage of linear regression\
    \ is that it is not complex. You may also find more accurate models in non-linear\
    \ regression, but they will be slower. Here the model tries to approximate data\
    \ points using a straight line.\n\nLet us understand how to build a linear regression\
    \ model in Python.\n\nConsider that you have been provided with a data file, called\
    \ `data_singlevar.txt`. This contains comma-separated lines where the first element\
    \ is the input value and the second element is the output value that corresponds\
    \ to this input value. You should use this as the input argument\n\n```python\n\
    # sample points\nX = [0, 6, 11, 14, 22]\nY = [1, 7, 12, 15, 21]\n\n# solve for\
    \ a and b\ndef best_fit(X, Y):\n    xbar = sum(X)/len(X)\n    ybar = sum(Y)/len(Y)\n\
    \    n = len(X) # or len(Y)\n    numer = sum([xi*yi for xi,yi in zip(X, Y)]) -\
    \ n * xbar * ybar\n    denom = sum([xi**2 for xi in X]) - n * xbar**2\n    b =\
    \ numer / denum\n    a = ybar - b * xbar\n    print('best fit line:\\ny = {:.2f}\
    \ + {:.2f}x'.format(a, b))\n    return a, b\n\n# solution\n```\n"
