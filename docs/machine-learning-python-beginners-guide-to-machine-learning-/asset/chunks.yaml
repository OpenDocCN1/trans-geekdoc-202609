    集成方法的目标是结合通过给定学习算法构建的多个基估计器的预测结果，以提高比单个估计器更优的泛化能力/鲁棒性。


    `sklearn.ensemble` 模块包含了两种基于随机决策树的平均算法——`RandomForest` 算法和 `Extra-Trees` 方法。这两种算法都是专门为树设计的“扰动并结合”技术
    [B1998]。这意味着通过在分类器的构建中引入随机性，创建一个多样化的分类器集合。集集的预测结果为各个分类器预测的平均值。


    森林分类器需要用两个数组进行拟合——一个大小为 `[n_samples, n_features]` 的稀疏或密集数组 `X`，用于存储训练样本；以及大小为
    `[n_samples]` 的数组 `Y`，用于存储训练样本的目标值（类别标签），如下所示所示 −


    ```python

    from sklearn.ensemble import RandomForestClassifier


    X = [[0, 0], [1, 1]]

    Y = [0, 1]

    clf = RandomForestClassifier(n_estimators = 10)

    clf = clf.fit(X, Y)

    ```


    与决策树一样，森林也可以扩展到多输出问题（如果 `Y` 是大小为 `[n_samples, n_outputs]` 的数组）。


    与原始文献 [B2001] 不同，scikit-learn 的实现通过平均其分类器的概率预测来组合分类器，而不是让每个分类器对单个类别投票。


    `Random Forest` 是决策树集的一个注册术语。在随机森林中，我们有一组决策树，被称为“森林”。根据属性对新对象进行分类，每棵树都会给出一个分类结果，我们称该树为该类别“投票”。森林选择票数最多（在森林中的所有树中）的分类结果。


    每棵树按如下方式种植和生长 −


    - 如果训练集中的案例数量为 `N`，则随机有放回地抽取 `N` 个样本。该样本将作为生长树的训练集。

    - 如果有 `M` 个输入变量，则指定一个 `m<<M`，使得在每个节点上，从 `M` 个变量中随机选择 `m` 个变量，并使用这 `m` 个变量的最优拆分来划分节点。`m`
    的值在森林生长过程中保持不变。

    - 每棵树都尽可能地生长。不进行剪枝。


    # 降维算法


    降维是另一项常见的无监督学习任务。某些问题可能包含成上万甚至百万个输入或解释变量，处理这些变量并进行计算的成本很高。此外，如果某些输入变量捕捉了噪声或与底层关系无关，程序的泛化能力可能会降低。


    降维是寻找对输出或响应变量产生最大变化的输入变量的过程。降维有时也用于数据可视化。回归问题很容易可视化，例如根据房屋大小预测房产价格，其中房产的大小可以沿图表的
    x 轴绘制，房产价格可以沿 y 轴绘制。同样，当添加第二个解释变量时，房产价格回归问题也容易可视化。例如，房屋的房间数可以绘制在 z 轴上。然而，具有数千个输入变量的问题将是不可视的。


    降维将大量的输入解释变量集减少为较小的输入变量集，同时保留尽可能多的信息。


    `PCA` 是一种可以为数据分析提供帮助的降维算法。最重要的是，在处理成百或上千个不同的输入变量时，它可以显著减少模型涉及的计算量。由于这是一项无监督学习任务，用户仍然需要分析结果并确保他们保留了原始数据集约
    95% 的的行为。


    观察以下代码以更好地理解 −


    ```python

    from sklearn import decomposition


    df = pd.read_csv(''iris_df.csv'')

    df.columns = [''X1'', ''X2'', ''X3'', ''X4'', ''Y'']

    df.head()


    from sklearn import decomposition


    pca = decomposition.PCA()

    fa = decomposition.FactorAnalysis()

    X = df.values[:, 0:4]

    Y = df.values[:, 4]


    train, test = train_test_split(X, test_size = 0.3)

    train_reduced = pca.fit_transform(train)

    test_reduced = pca.transform(test)

    pca.n_components_

    ```


    你可以看到上述代码的如下输出 −


    4L


    在过去的 5 年里，在每一个可能的层面和点，数据捕捉呈指数级增长。政府机构/研究机构/企业不仅推出了新的数据源，而且还在捕捉更多详细的数据。例如，电子商务公司正在获取客户的人口统计、浏览历史、喜好等更多详细信息。可用数据可能具有数千个特征，在保留尽可能多信息的同时减少特征是一个挑战。在这种情况下，降维有很大帮助。


    # Boosting 算法


    Boosting 一词指的是一组将弱学习器转换为强学习器的算法。让我们通过解决下所示的垃圾邮件识别问题来理解这一定义 −


    遵循什么程序可以对邮件分类为垃圾邮件？初始方法中我们通过以下标准识别“垃圾邮件”和“非垃圾邮件”：


    - 如果邮件只有一个图像文件（广告图），它是垃圾邮件

    - 如果邮件只有链接，它是垃圾邮件

    - 如果邮件正文包含“你赢了 xxxxxx 的奖金”之类的句子，它是垃圾邮件

    - 来自我们的官方域名“Tutorialspoint.com”，不是垃圾邮件

    - 来自已知来源，不是垃圾邮件


