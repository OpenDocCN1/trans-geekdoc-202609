    ## KNN (K 近邻算法):


    K 近邻算法，简称 KNN，是一种专门用于分类的监督学习算法。它是一种简单的算法，通过存储所有可用的案例，并根据其 k 个邻居的多数投票对新案例进行分类。被分配到某个类的案例是根据距离函数测量的其
    K 个最近邻居中最常见的类。这些距离函数可以是欧几里得距离、曼哈顿距离、闵可斯基距离汉明距离。前三个函数用于连续函数，第四个（汉明）用于分类变量。如果 K
    = 1，则该案例简单地分配给其最近邻居的类别。在执行 KNN 建模时，选择 K 往往是一项挑战。


    算法查看不同的质心并使用某种函数（通常是欧几里得）比较距离，然后分析这些结果并将每个点分配到组，使其优化为放置在与其所有最近的点在一起。


    你可以将 KNN 用于分类和回归问题。然而，在工业中，它更多地用于分类问题。KNN 可以很容易映射到我们的现实生活。


    在选择 KNN 之前，你需要注意以下几点 −


    - KNN 计算成本很高。

    - 变量应该进行归一化，否则高范围变量会产生偏差。

    - 在进行 KNN 之前，在预处理阶段需要更多工作，如离群值处理、噪声去除


