  trans: "\n平聚类创建了一个平面的簇集，没有任何可以将簇之间相互关联的清晰结构。层次聚类则创建一个簇的层级结构。层次聚类的输出是一个层级级结构，这种结构比平聚类返回的无结构簇集包含更多信息。层次聚类不需要我们预先指定簇的数量。层次聚类的优势是以效率较低为代价的。\n\
    \n通常情况下，当效率很重要时，我们选择平聚类；而当平聚类的某个潜在问题成为问题时，我们选择层次聚类。此外，许多研究人员认为，层次聚类产生的簇比平聚类更好。\n\
    \n# 聚类算法\n\n你需要聚类算法来对给定数据进行聚类。常用的有两种算法——`Canopy clustering` 和 `K-Means clustering`。\n\
    \nCanopy 聚类算法是一种无监督预聚类算法，通常用作 `K-means` 算法或 `Hierarchical clustering` 算法的预处理步骤。它用于加速大型数据集上的聚类操作，由于数据集巨大，可能无法直接使用另一种算法。\n\
    \nK-means 聚类是一种重要的聚类算法。`k-means` 聚类算法中的 `k` 代表数据要划分的簇数。例如，如果算法中指定的 `k` 值为 3，那么算法将数据划分为\
    \ 3 个簇。\n\n每个对象被表示为空间中的一个向量。最初，算法随机选择 `k` 个点并将其视为中心，距离每个中心最近的对象被归一类。`k-means`\
    \ 算法需要向量文件作为输入，因此我们需要创建向量文件。创建向量后，我们进行 `k-means` 算法。\n\n# 使用 Python 进行机器学习 – 算法\n\
    \n机器学习算法大体分为两类——`Supervised`（监督）和 `supervised`（无监督）。本章将详细讨论它们。\n\n## 监督学习\n\n\
    该算法包含一个目标、结果或因变量，该变量根据给定的预测变量或独立变量预测。使用这些变量，我们生成一个将输入变量映射到所需输出变量的函数。训练过程持续，直到模型在训练数据上达到所需的准确率。\n\
    \n监督学习的示例——回归、决策树、随机森林、`KNN`、逻辑回归等。\n\n## 无监督学习\n\n在算法算法中，没有待预测或估计的目标、结果或因变量。它用于将给定数据集聚类到不同的组，广泛用于将客户分为不同的组以进行特定的干预。`Apriori`\
    \ 算法和 `K-means` 是无监督学习的一些示例。\n\n## 强化学习\n\n使用该算法，训练机器以做出特定的决策。在这里，算法通过试错法和反馈方法不断训练自己。这种机器从过去的经验中学习，并试图捕捉尽可能好的知识以做出准确的业务决策。\n\
    \n`Markov Decision Process` 是强化学习的一个示例。\n\n# 常见机器学习算法列表\n\n以下是可以应用于几乎任何数据问题的常用机器学习算法列表——\n\
    \n*   线性回归\n*   逻辑回归\n*   决策树\n*   `SVM`\n*   朴素贝叶斯\n*   `KNN`\n*   `K-Means`\
    \ *\n*   随机森林\n*   降维算法\n*   梯度提升算法，如 `GBM`、`XGBoost`、`LightGBM` 和 `CatBoost`\n\
    \n本节将详细讨论每一种——\n\n## 线性回归\n\n线性回归用于根据连续变量估计真实世界的值，如房屋价格、通话次数、总销售额等。在这里，我们通过拟合一条最佳线来建立因变量和独立变量之间的关系。这条回归线被称为\
    \ `regression line`，由线性方程 `Y = a * X + b` 表示。\n\n在该方程中——\n\n*   `Y` – 因变量\n* \
    \  `a` – 斜率\n*   `X` – 独立变量\n*   `b` – 截距\n\n这些系数 `a` 和 `b` 是根据最小化数据点与回归线之间距离平方和得出的。\n\
    \n### 示例\n\n理解线性回归的最佳方法是考虑一个例子。假设我们被要求按体重的增加顺序排列班级的学生。通过观察学生并在视觉上分析他们的身高和体型，我们可以结合这些参数（即身高和体型）按照要求进行排列。这是一个真实世界的线性回归示例。我们发现身高和体型与体重之间存在关系，这种关系类似于上面的方程。\n\
    \n### 线性回归的类型\n\n线性回归主要有两种——`Simple Linear Regression`（简单线性回归）和 `Multiple Linear\
    \ Regression`（多元线性回归）。简单线性回归的特征是一个独立变量，而多元线性回归的特征是多个独立变量。在寻找最佳拟线时，你可以拟合多项式回归或曲线回归。你可以使用以下代码来实现此。\n\
    \n```\nimport matplotlib.pyplot as plt\nplt.scatter(X, Y)\nyfit = [a + b * xi\
    \ for xi in X]\nplt.plot(X, yfit)\n```\n\n### 构建线性回归器\n\n回归是估计输入与连续值输出之间关系的过程。这些数据通常以实数形式存在，我们的目标是估计控制从输入到输出映射的底层函数。\n\
    \n考虑所示的输入输出映射——\n\n*   1 --> 2\n*   3 --> 6\n*   4.3 --> 8.6\n\n你可以通过分析模式轻松地估计输入和输出之间的关系。我们可以观察到在每种情况下输出都是输入值的两倍，因此转换将是\
    \ `f(x) = 2x`。\n\n线性回归是指使用输入变量线性组合来估计相关函数。之前的示例是一个包含一个输入变量和一个输出变量的例子。线性回归的目标是提取关联输入变量与输出变量的线性模型。它旨在最小化实际输出与预测输出之间的差异平方和。这种方法被称为\
    \ `Ordinary Least Squares`（普通最小二法）。你可能假设某条曲线能更好地拟合这些点，但线性回归不允许这样做。线性回归的主要优势是它不复杂。你也可以在非线性回归中找到更准确的模型，但它们速度较慢。在这里模型尝试使用直线来近似数据点。\n\
    \n让我们了解如何在 Python 中构建线性回归模型。\n\n假设提供了一个数据文件，名为 `data_singlevar.txt`。它包含逗号分隔的行，第一个元素是输入值，第二个元素是对应该输入值的输出值。你应该将其作为输入参数。\n\
    \n```python\n# 样本点\nX = [0, 6, 11, 14, 22]\nY = [1, 7, 12, 15, 21]\n\n# 求解 a 和\
    \ b\ndef best_fit(X, Y):\n    xbar = sum(X)/len(X)\n    ybar = sum(Y)/len(Y)\n\
    \    n = len(X) # 或 len(Y)\n    numer = sum([xi*yi for xi,yi in zip(X, Y)]) -\
    \ n * xbar * ybar\n    denom = sum([xi**2 for xi in X]) - n * xbar**2\n    b =\
    \ numer / denom\n    a = ybar - b * xbar\n    print('最佳拟合线:\\ny = {:.2f} + {:.2f}x'.format(a,\
    \ b))\n    return a, b\n\n# solution\n```\n"
- fmt: "\n`a, b = best_fit(X, Y)`\n\n# best fit line:\n\n`y = 0.80 + 0.92x`\n\n# plot\
    \ points and fit line\n\n```python\nimport matplotlib.pyplot as plt\n\nplt.scatter(X,\
    \ Y)\n\nyfit = [a + b * xi for xi in X]\n\nplt.plot(X, yfit)\n\nplt.show()\n```\n\
    \nbest fit line:\n\n`y = 1.48 + 0.92x`\n\nIf you run the above code, you can observe\
    \ the output graph as shown −\n\n![Linear Regression](Images/image00159.jpeg)\n\
    \nNote that this example uses only the first feature of the diabetes dataset,\
    \ in order to illustrate a two-dimensional plot of this regression technique.\
    \ The straight line can be seen in the plot, showing how linear regression attempts\
    \ to draw a straight line that will best minimize the residual sum of squares\
    \ between the observed responses in the dataset, and the responses predicted by\
    \ the linear approximation.\n\nYou can calculate the coefficients, the residual\
    \ sum of squares and the variance score using the program code shown below −\n\
    \n```python\nimport matplotlib.pyplot as plt\nimport numpy as np\nfrom sklearn\
    \ import datasets, linear_model\nfrom sklearn.metrics import mean_squared_error,\
    \ r2_score\n\n# Load the diabetes dataset\ndiabetes = datasets.load_diabetes()\n\
    \n# Use only one feature\ndiabetes_X = diabetes.data[:, np.newaxis, 2]\n\n# Split\
    \ the data into training/testing sets\ndiabetes_X_train = diabetes_X[:-30]\ndiabetes_X_test\
    \ = diabetes_X[-30:]\n\n# Split the targets into training/testing sets\ndiabetes_y_train\
    \ = diabetes.target[:-30]\ndiabetes_y_test = diabetes.target[-30:]\n\n# Create\
    \ linear regression object\nregr = linear_model.LinearRegression()\n\n# Train\
    \ the model using the training sets\nregr.fit(diabetes_X_train, diabetes_y_train)\n\
    \n# Make predictions using the testing set\ndiabetes_y_pred = regr.predict(diabetes_X_test)\n\
    \n# The coefficients\nprint('Coefficients: \\n', regr.coef_)\n\n# The mean squared\
    \ error\nprint(\"Mean squared error: %.2f\" \n      % mean_squared_error(diabetes_y_test,\
    \ diabetes_y_pred))\n\n# Explained variance score: 1 is perfect prediction\nprint('Variance\
    \ score: %.2f' % r2_score(diabetes_y_test, diabetes_y_pred))\n\n# Plot outputs\n\
    plt.scatter(diabetes_X_test, diabetes_y_test, color='black')\nplt.plot(diabetes_X_test,\
    \ diabetes_y_pred, color='blue', linewidth=3)\nplt.xticks(())\nplt.yticks(())\n\
    plt.show()\n```\n\nYou can observe the following output once you execute the code\
    \ given above −\n\nAutomatically created module for IPython interactive environment\n\
    ('Coefficients: \\n', array([ 941.43097333\\]))\nMean squared error: 3035.06\n\
    Variance score: 0.41\n\n![Linear Regression2](Images/image00160.jpeg)\n\n# Logistic\
    \ Regression\n\nLogistic regression is another technique borrowed by machine learning\
    \ from statistics. It is the preferred method for binary classification problems,\
    \ that is, problems with two class values.\n\nIt is a classification algorithm\
    \ and not a regression algorithm as the name says. It is used to estimate discrete\
    \ values or values like `0/1`, `Y/N`, `T/F` based on the given set of independent\
    \ variable(s). It predicts the probability of occurrence of an event by fitting\
    \ data to a logit function. Hence, it is also called `logit regression`. Since,\
    \ it predicts the probability, its output values lie between 0 and 1.\n\n## Example\n\
    \nLet us understand this algorithm through a simple example.\n\nAssume that there\
    \ is a puzzle to solve that has only 2 outcome scenarios – either there is a solution\
    \ or there is none. Now suppose, we have a wide range of puzzles to test a person\
    \ which subjects he is good at. The outcomes may be something like this – if a\
    \ trigonometry puzzle is given, a person may be 80% likely to solve it. On the\
    \ other hand, if a geography puzzle is given, the person may be only 20% likely\
    \ to solve it. This is where Logistic Regression helps in solving. As per math,\
    \ the log odds of the outcome is expressed as a linear combination of the predictor\
    \ variables.\n\n`odds = p/ (1-p) = probability of event occurrence / probability\
    \ of not event occurrence`\n\n`ln(odds) = ln(p/(1-p)) ; ln` is the logarithm to\
    \ the base ‘e’.\n\n`logit(p) = ln(p/(1-p)) = b0+b1X1+b2X2+b3X3....+bkXk`\n\nNote\
    \ that in the above `p` is the probability of presence of the characteristic of\
    \ interest. It chooses parameters that maximize the likelihood of observing the\
    \ sample values rather than that minimize the sum of squared errors (like in ordinary\
    \ regression).\n\nNote that taking a log is one of the best mathematical way to\
    \ replicate a step function.\n\nThe following points may be note-worthy when working\
    \ on logistic regression −\n\n- It is similar to regression in that the objective\
    \ is to find the values for the coefficients that weigh each input variable.\n\
    - Unlike in linear regression, the prediction for the output is found using a\
    \ non-linear function called the logistic function.\n\n```python\nimport numpy\
    \ as np\nimport matplotlib.pyplot as plt\nfrom sklearn import linear_model\n\n\
    xmin, xmax = -10, 10\nn_samples = 100\nnp.random.seed(0)\nX = np.random.normal(size=n_samples)\n\
    y = (X > 0).astype(float)\nX += .3 * np.random.normal(size=n_samples)\nX = X[:,\
    \ np.newaxis]\n\nclf = linear_model.LogisticRegression(C=1e5)\nclf.fit(X, y)\n\
    \nplt.figure(1, figsize=(4, 3))\nplt.clf()\nplt.scatter(X.ravel(), y, color='black',\
    \ zorder=20)\nX_test = np.linspace(xmin, xmax, 300)\n\ndef model(x):\n    return\
    \ 1 / (1 + np.exp(-x))\n\nloss = model(X_test * clf.coef_ + clf.intercept_).ravel()\n\
    plt.plot(X_test, loss, color='blue', linewidth=3)\n\nols = linear_model.LinearRegression()\n\
    ols.fit(X, y)\nplt.plot(X_test, ols.coef_ * X_test + ols.intercept_, linewidth=1)\n\
    plt.axhline(.5)\nplt.ylabel('y')\nplt.xlabel('X')\nplt.xticks(range(-10, 10))\n\
    plt.yticks([0, 0.5, 1])\nplt.ylim(-.25, 1.25)\nplt.xlim(-4, 10)\nplt.legend(('Logistic\
    \ Regression Model', 'Linear Regression Model'), loc=\"lower right\", fontsize='small')\n\
    plt.show()\n```\n\nThe output plot will look like as shown here −\n\n![Logistic\
    \ Regression](Images/image00161.jpeg)\n\n# Decision Tree Algorithm\n\nDecision\
    \ Tree is a supervised learning algorithm that is mostly used for classification\
    \ problems. It works for both discrete and continuous dependent variables. In\
    \ this algorithm, we split the population into two or more homogeneous sets. This\
    \ is done based on most significant attributes to make as distinct groups as possible.\n\
    \nDecision trees are used widely in machine learning, covering both classification\
    \ and regression. In decision analysis, a decision tree is used to visually and\
    \ explicitly represent decisions and decision making. It uses a tree-like model\
    \ of decisions.\n\nA decision tree is drawn with its root at the top and branches\
    \ at the bottom. In the image, the bold text represents a condition/internal node,\
    \ based on which the tree splits into branches/ edges. The branch end that doesn’t\
    \ split anymore is the decision/leaf.\n"
