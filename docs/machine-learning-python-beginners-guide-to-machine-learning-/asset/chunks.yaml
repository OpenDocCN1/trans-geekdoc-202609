    \ left.append(row)\n\n      else:\n\n         right.append(row)\n\n   return left,\
    \ right\n\n\\# Calculating the Gini index for a split dataset\n\ndef gini\\_index(groups,\
    \ classes):\n\n   # count all samples at split point\n\n   n\\_instances = float(sum(\\\
    [len(group) for group in groups\\]))\n\n   # sum weighted Gini index for each\
    \ group\n\n   gini = 0.0\n\n   for group in groups:\n\n      size = float(len(group))\n\
    \n      # avoid divide by zero\n\n      if size == 0:\n\n         continue\n\n\
          score = 0.0\n\n      # score the group based on the score for each class\n\
    \n      for class\\_val in classes:\n\n         p = \\[row\\[-1\\] for row in\
    \ group\\].count(class\\_val) / size\n\n      score += p \\* p\n\n      # weight\
    \ the group score by its relative size\n\n      gini += (1.0 - score) \\* (size\
    \ / n\\_instances)\n\nreturn gini\n\n\\# Selecting the best split point for a\
    \ dataset\n\ndef get\\_split(dataset):\n\n   class\\_values = list(set(row\\[-1\\\
    ] for row in dataset))\n\n   b\\_index, b\\_value, b\\_score, b\\_groups = 999,\
    \ 999, 999, None\n\n   for index in range(len(dataset\\[0\\])-1):\n\n      for\
    \ row in dataset:\n\n         groups = test\\_split(index, row\\[index\\], dataset)\n\
    \n         gini = gini\\_index(groups, class\\_values)\n\n         if gini < b\\\
    _score:\n\n            b\\_index, b\\_value, b\\_score, b\\_groups = index, \n\
    \nrow\\[index\\], gini, groups\n\n   return {'index':b\\_index, 'value':b\\_value,\
    \ 'groups':b\\_groups}\n\n\\# Creating a terminal node value\n\ndef to\\_terminal(group):\n\
    \noutcomes = \\[row\\[-1\\] for row in group\\]\n\nreturn max(set(outcomes), key=outcomes.count)\n\
    \n\\# Creating child splits for a node or make terminal\n\ndef split(node, max\\\
    _depth, min\\_size, depth):\n\n   left, right = node\\['groups'\\]\n\n   del(node\\\
    ['groups'\\])\n\n   # check for a no split\n\n   if not left or not right:\n\n\
          node\\['left'\\] = node\\['right'\\] = to\\_terminal(left + right)\n\n     \
    \ return\n\n   # check for max depth\n\n   if depth >= max\\_depth:\n\n      node\\\
    ['left'\\], node\\['right'\\] = to\\_terminal(left), to\\_terminal(right)\n\n\
          return\n\n   # process left child\n\n   if len(left) <= min\\_size:\n\n\
          node\\['left'\\] = to\\_terminal(left)\n\n   else:\n\n      node\\['left'\\\
    ] = get\\_split(left)\n\n      split(node\\['left'\\], max\\_depth, min\\_size,\
    \ depth+1)\n\n   # process right child\n\n   if len(right) <= min\\_size:\n\n\
          node\\['right'\\] = to\\_terminal(right)\n\n   else:\n\n      node\\['right'\\\
    ] = get\\_split(right)\n\n      split(node\\['right'\\], max\\_depth, min\\_size,\
    \ depth+1)\n\n\\# Building a decision tree\n\ndef build\\_tree(train, max\\_depth,\
