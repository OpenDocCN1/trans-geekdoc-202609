    The goal of ensemble methods is to combine the predictions of several base estimators
    built with a given learning algorithm in order to improve generalizability / robustness
    over a single estimator.


    The `sklearn.ensemble` module includes two averaging algorithms based on randomized
    decision trees - the `RandomForest` algorithm and the `Extra-Trees` method. Both
    algorithms are perturb-and-combine techniques [B1998] specifically designed for
    trees. This means a diverse set of classifiers is created by introducing randomness
    in the classifier construction. The prediction of the ensemble is given as the
    averaged prediction of the individual classifiers.


    Forest classifiers have to be fitted with two arrays - a sparse or dense array
    `X` of size `[n_samples, n_features]` holding the training samples, and an array
    `Y` of size `[n_samples]` holding the target values (class labels) for the training
    samples, as shown in the code below −


    ```python

    from sklearn.ensemble import RandomForestClassifier


    X = [[0, 0], [1, 1]]

    Y = [0, 1]

    clf = RandomForestClassifier(n_estimators = 10)

    clf = clf.fit(X, Y)

    ```


    Like decision trees, forests of trees also extend to multi-output problems (if
    `Y` is an array of size `[n_samples, n_outputs]`).


    In contrast to the original publication [B2001], the scikit-learn implementation
    combines classifiers by averaging their probabilistic prediction, instead of letting
    each classifier vote for a single class.


    `Random Forest` is a trademark term for an ensemble of decision trees. In Random
    Forest, we have a collection of decision trees, known as “Forest”. To classify
    a new object based on attributes, each tree gives a classification and we say
    the tree “votes” for that class. The forest chooses the classification having
    the most votes (over all the trees in the forest).


    Each tree is planted & grown as follows −


    - If the number of cases in the training set is `N`, then sample of `N` cases
    is taken at random but with replacement. This sample will be the training set
    for growing the tree.

    - If there are `M` input variables, a number `m<<M` is specified such that at
    each node, `m` variables are selected at random out of the `M` and the best split
    on these `m` is used to split the node. The value of `m` is held constant during
    the forest growing.

    - Each tree is grown to the largest extent possible. There is no pruning.


    # Dimensionality Reduction Algorithm


    Dimensionality reduction is yet another common unsupervised learning task. Some
    problems may contain tens of thousands or even millions of input or explanatory
    variables, which can be costly to work with and do computations. Moreover, the
    program''s ability to generalize may be diminished if some of the input variables
    capture noise or are not relevant to the underlying relationship.


    Dimensionality reduction is the process of finding the input variables that are
    responsible for the greatest changes in the output or response variable. Dimensionality
    reduction is sometimes also used to visualize data. It is easy to visualize a
    regression problem such as predicting the price of a property from its size, where
    the size of the property can be plotted along graph''s x axis, and the price of
    the property can be plotted along the y axis. Similarly, it is easy to visualize
    the property price regression problem when a second explanatory variable is added.
    The number of rooms in the property could be plotted on the z axis, for instance.
    A problem with thousands of input variables, however, becomes impossible to visualize.


    Dimensionality reduction reduces a very large set of input of explanatory variables
    to a smaller set of input variables that retain as much information as possible.


    `PCA` is a dimensionality reduction algorithm that can do useful things for data
    analysis. Most importantly, it can dramatically reduce the number of computations
    involved in a model when dealing with hundreds or thousands of different input
    variables. As it is an unsupervised learning task, the user still has to analyze
    the results and make sure they are keeping 95% or so of the original dataset’s
    behavior.


    Observe the following code for a better understanding −


    ```python

    from sklearn import decomposition


    df = pd.read_csv(''iris_df.csv'')

    df.columns = [''X1'', ''X2'', ''X3'', ''X4'', ''Y'']

    df.head()


    from sklearn import decomposition


    pca = decomposition.PCA()

    fa = decomposition.FactorAnalysis()

    X = df.values[:, 0:4]

    Y = df.values[:, 4]


    train, test = train_test_split(X, test_size = 0.3)

    train_reduced = pca.fit_transform(train)

    test_reduced = pca.transform(test)

    pca.n_components_

    ```


