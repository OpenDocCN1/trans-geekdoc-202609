    \ correct?\n\nSolution − We can solve it using the method discussed above, so\
    \ P(Yes | Sunny) = P( Sunny | Yes) \\* P(Yes) / P (Sunny)\n\nHere we have, P (Sunny\
    \ |Yes) = 3/9 = 0.33, P(Sunny) = 5/14 = 0.36, P(Yes) = 9/14 = 0.64\n\nNow, P (Yes\
    \ | Sunny) = 0.33 \\* 0.64 / 0.36 = 0.60, which has a higher probability.\n\n\
    Naive Bayes uses a similar method to predict the probability of different classes\
    \ based on various attributes. This algorithm is mostly used in text classification\
    \ and with problems having multiple classes.\n\nThe following code shows an example\
    \ of Naive Bayes implementation −\n\nimport csv\n\nimport random\n\nimport math\n\
    \ndef loadCsv(filename):\n\n   lines \\= csv.reader(open(filename, \"rb\"))\n\n\
       dataset \\= list(lines)\n\n   for i in range(len(dataset)):\n\n      dataset\\\
    [i\\] \\= \\[float(x) for x in dataset\\[i\\]\\]\n\n   return dataset\n\ndef splitDataset(dataset,\
    \ splitRatio):\n\n   trainSize \\= int(len(dataset) \\* splitRatio)\n\n   trainSet\
    \ \\= \\[\\]\n\n   copy \\= list(dataset)\n\n   while len(trainSet) < trainSize:\n\
    \n      index \\= random.randrange(len(copy))\n\n      trainSet.append(copy.pop(index))\n\
    \n   return \\[trainSet, copy\\]\n\ndef separateByClass(dataset):\n\n   separated\
    \ \\= {}\n\n   for i in range(len(dataset)):\n\n      vector \\= dataset\\[i\\\
    ]\n\n      if (vector\\[-1\\] not in separated):\n\n         separated\\[vector\\\
    [-1\\]\\] \\= \\[\\]\n\n      separated\\[vector\\[-1\\]\\].append(vector)\n\n\
    return separated\n\ndef mean(numbers):\n\nreturn sum(numbers)/float(len(numbers))\n\
    \ndef stdev(numbers):\n\n   avg \\= mean(numbers)\n\n   variance \\= sum(\\[pow(x\\\
    -avg,2) for x in numbers\\])/float(len(numbers)-1)\n\n   return math.sqrt(variance)\n\
    \ndef summarize(dataset):\n\n   summaries \\= \\[(mean(attribute), stdev(attribute))\
    \ for attribute in zip(\\*dataset)\\]\n\ndef summarizeByClass(dataset):\n\n  \
    \ separated \\= separateByClass(dataset)\n\n   summaries \\= {}\n\n   for classValue,\
    \ instances in separated.iteritems():\n\n      summaries\\[classValue\\] \\= summarize(instances)\n\
    \n   return summaries\n\ndef calculateProbability(x, mean, stdev):\n\n   exponent\
    \ \\= math.exp(-(math.pow(x\\-mean,2)/(2\\*math.pow(stdev,2))))\n\n   return (1\
    \ / (math.sqrt(2\\*math.pi) \\* stdev)) \\* exponent\n\ndef calculateClassProbabilities(summaries,\
    \ inputVector):\n\n   probabilities \\= {}\n\n   for classValue, classSummaries\
    \ in summaries.iteritems():\n\n      probabilities\\[classValue\\] \\= 1\n\n     \
    \ for i in range(len(classSummaries)):\n\n      mean, stdev \\= classSummaries\\\
    [i\\]\n\n      x \\= inputVector\\[i\\]\n\n      probabilities\\[classValue\\\
    ] \\*= calculateProbability(x, mean,stdev)\n\n   return probabilities\n\ndef predict(summaries,\
    \ inputVector):\n\n   probabilities \\= calculateClassProbabilities(summaries,\
    \ inputVector)\n\n   bestLabel, bestProb \\= None, \\-1\n\n   for classValue,\
    \ probability in probabilities.iteritems():\n\n      if bestLabel is None or probability\
    \ \\> bestProb:\n\n         bestProb \\= probability\n\n         bestLabel \\\
    = classValue\n\n   return bestLabel\n\ndef getPredictions(summaries, testSet):\n\
    \n   predictions \\= \\[\\]\n\n   for i in range(len(testSet)):\n\n      result\
    \ \\= predict(summaries, testSet\\[i\\])\n\n      predictions.append(result)\n\
    \n   return predictions\n\ndef getAccuracy(testSet, predictions):\n\n   correct\
    \ \\= 0\n\n   for i in range(len(testSet)):\n\n      if testSet\\[i\\]\\[-1\\\
    ] \\== predictions\\[i\\]:\n\n         correct += 1\n\n   return (correct/float(len(testSet)))\
    \ \\* 100.0\n\ndef main():"
