    ```\n\nWhen you execute the code given above, you can observe the output as follows\
    \ −\n\nScores: [95.62043795620438, 97.8102189781022, 97.8102189781022, 94.52554744525547,\
    \ 98.90510948905109]\n\nMean Accuracy: 96.934%\n\n# Support Vector Machines (SVM)\n\
    \nSupport vector machines, also known as `SVM`, are well-known supervised classification\
    \ algorithms that separate different categories of data.\n\nThese vectors are\
    \ classified by optimizing the line so that the closest point in each of the groups\
    \ will be the farthest away from each other.\n\nThis vector is by default linear\
    \ and is also often visualized as being linear. However, the vector can also take\
    \ a nonlinear form as well if the kernel type is changed from the default type\
    \ of ‘gaussian’ or linear.\n\nIt is a classification method, where we plot each\
    \ data item as a point in n-dimensional space (where `n` is number of features)\
    \ with the value of each feature being the value of a particular coordinate.\n\
    \nFor example, if we have only two features like `Height` and `Hair length` of\
    \ an individual, we should first plot these two variables in two dimensional space\
    \ where each point has two co-ordinates known as Support Vectors. Observe the\
    \ following diagram for better understanding −\n\n![Support Vector Machines](Images/image00163.jpeg)\n\
    \nNow, find some line that splits the data between the two differently classified\
    \ groups of data. This will be the line such that the distances from the closest\
    \ point in each of the two groups will be farthest away.\n\n![Support Vector Machines2](Images/image00164.jpeg)\n\
    \nIn the example shown above, the line which splits the data into two differently\
    \ classified groups is the black line, since the two closest points are the farthest\
    \ apart from the line. This line is our classifier. Then, depending on where the\
    \ testing data lands on either side of the line, we can classify the new data.\n\
    \n```python\nfrom sklearn import svm\n\ndf = pd.read_csv('iris_df.csv')\ndf.columns\
    \ = ['X4', 'X3', 'X1', 'X2', 'Y']\ndf = df.drop(['X4', 'X3'], 1)\ndf.head()\n\n\
    from sklearn.cross_validation import train_test_split\nsupport = svm.SVC()\nX\
