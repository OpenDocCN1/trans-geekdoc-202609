    # Machine Learning with Python


    ## Machine Learning for Beginners


    Python is a general-purpose high level programming language that is increasingly
    used in data science and in designing machine learning. This tutorial provides
    a quick introduction to Python and its libraries like `numpy`, `scipy`, `pandas`,
    `matplotlib` and explains how it can be applied to develop machine learning.


    ## Introduction


    Machine learning is a type of artificial intelligence (AI) that provides computers
    with the ability to learn without being explicitly programmed. Machine learning
    focuses on the development of Computer Programs that can change when exposed to
    new data.


    If you are a newcomer, you do not know where to start studying and why you need
    Machine Learning and why it is gaining more and more popularity lately, you got
    into the right place! I’ve gathered all the needed information and useful resources
    to help you gain new knowledge and accomplish your first projects.


    ## Why Starting With Python?


    Python is a popular platform used for research and development of production systems.
    It is a vast language with number of modules, packages and libraries that provides
    multiple ways of achieving a task.

