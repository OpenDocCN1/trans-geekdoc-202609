    Training Data and Test Data


    Training data and test data are two important concepts in machine learning. This
    chapter discusses them in detail.


    Training Data:


    The observations in the training set form the experience that the algorithm uses
    to learn. In supervised learning problems, each observation consists of an observed
    output variable and one or more observed input variables.


    Test Data:


    The test set is a set of observations used to evaluate the performance of the
    model using some performance metric. It is important that no observations from
    the training set are included in the test set. If the test set does contain examples
    from the training set, it will be difficult to assess whether the algorithm has
    learned to generalize from the training set or has simply memorized it.


    A program that generalizes well will be able to effectively perform a task with
    new data. In contrast, a program that memorizes the training data by learning
    an overly complex model could predict the values of the response variable for
    the training set accurately, but will fail to predict the value of the response
    variable for new examples. Memorizing the training set is called over-fitting.
    A program that memorizes its observations may not perform its task well, as it
    could memorize relations and structures that are noise or coincidence. Balancing
    memorization and generalization, or over-fitting and under-fitting, is a problem
    common to many machine learning algorithms. Regularization may be applied to many
    models to reduce over-fitting.


    In addition to the training and test data, a third set of observations, called
    a validation or hold-out set, is sometimes required. The validation set is used
    to tune variables called hyper parameters, which control how the model is learned.
    The program is still evaluated on the test set to provide an estimate of its performance
    in the real world; its performance on the validation set should not be used as
    an estimate of the model''s real-world performance since the program has been
    tuned specifically to the validation data. It is common to partition a single
    set of supervised observations into training, validation, and test sets. There
    are no requirements for the sizes of the partitions, and they may vary according
    to the amount of data available. It is common to allocate 50 percent or more of
    the data to the training set, 25 percent to the test set, and the remainder to
    the validation set.


    Some training sets may contain only a few hundred observations; others may include
    millions. Inexpensive storage, increased network connectivity, the ubiquity of
    sensor-packed smartphones, and shifting attitudes towards privacy have contributed
    to the contemporary state of big data, or training sets with millions or billions
    of examples.


    However, machine learning algorithms also follow the maxim "garbage in, garbage
    out." A student who studies for a test by reading a large, confusing textbook
    that contains many errors will likely not score better than a student who reads
    a short but well-written textbook. Similarly, an algorithm trained on a large
    collection of noisy, irrelevant, or incorrectly labeled data will not perform
    better than an algorithm trained on a smaller set of data that is more representative
    of problems in the real world.


    Many supervised training sets are prepared manually, or by semi-automated processes.
    Creating a large collection of supervised data can be costly in some domains.
    Fortunately, several datasets are bundled with scikit-learn, allowing developers
    to focus on experimenting with models instead.'
