    \ data sets, where using another algorithm directly may not be possible due to\
    \ large size of the data sets.\n\nK-means clustering is an important clustering\
    \ algorithm. The k in k-means clustering algorithm represents the number of clusters\
    \ the data is to be divided into. For example, if the k value specified in the\
    \ algorithm is 3, then algorithm will divide the data into 3 clusters.\n\nEach\
    \ object is represented as a vector in space. Initially k points are chosen by\
    \ the algorithm randomly and treated as centers, every object closest to each\
    \ center are clustered. The k-means algorithm requires vector files as input,\
    \ therefore we need to create vector files. After creating vectors, we proceed\
    \ with k-means algorithm.\n\nMachine Learning with Python \n\n– \n\nAlgorithms\n\
    \nMachine learning algorithms can be broadly classified into two types - Supervised and Unsupervised.\
    \ This chapter discusses them in detail.\n\nSupervised Learning\n\nThis algorithm\
    \ consists of a target or outcome or dependent variable which is predicted from\
    \ a given set of predictor or independent variables. Using these set of variables,\
    \ we generate a function that maps input variables to desired output variables.\
    \ The training process continues until the model achieves a desired level of accuracy\
    \ on the training data.\n\nExamples of Supervised Learning - Regression, Decision\
    \ Tree, Random Forest, KNN, Logistic Regression etc.\n\nUnsupervised Learning\n\
    \nIn this algorithm, there is no target or outcome or dependent variable to predict\
    \ or estimate. It is used for clustering a given data set into different groups,\
    \ which is widely used for segmenting customers into different groups for specific\
    \ intervention. Apriori algorithm and K-means are some of the examples of Unsupervised\
    \ Learning.\n\nReinforcement Learning\n\nUsing this algorithm, the machine is\
    \ trained to make specific decisions. Here, the algorithm trains itself continually\
    \ by using trial and error methods and feedback methods. This machine learns from\
    \ past experiences and tries to capture the best possible knowledge to make accurate\
    \ business decisions.\n\nMarkov Decision Process is an example of Reinforcement\
    \ Learning.\n\nList of Common Machine Learning Algorithms\n\nHere is the list\
    \ of commonly used machine learning algorithms that can be applied to almost any\
    \ data problem −\n\n*   Linear Regression\n\n*   Logistic Regression\n\n*   Decision\
    \ Tree\n\n*   SVM\n\n*   Naive Bayes\n\n*   KNN\n\n*   K-Means\n\n*   Random Forest\n\
    \n*   Dimensionality Reduction Algorithms\n\n*   Gradient Boosting algorithms\
    \ like GBM, XGBoost, LightGBM and CatBoost\n\nThis section discusses each of them\
    \ in detail –\n\nLinear Regression\n\nLinear regression is used to estimate real\
    \ world values like cost of houses, number of calls, total sales etc. based on\
    \ continuous variable(s). Here, we establish relationship between dependent and\
    \ independent variables by fitting a best line. This line of best fit is known\
    \ as regression line and is represented by the linear equation Y= a \\*X + b.\n\
    \nIn this equation −\n\nY – Dependent Variable\n\na – Slope\n\nX – Independent\
    \ variable\n\nb – Intercept\n\nThese coefficients a and b are derived based on\
    \ minimizing the sum of squared difference of distance between data points and\
    \ regression line.\n\nExample\n\nThe best way to understand linear regression\
    \ is by considering an example. Suppose we are asked to arrange students in a\
    \ class in the increasing order of their weights. By looking at the students and\
    \ visually analyzing their heights and builds we can arrange them as required\
    \ using a combination of these parameters, namely height and build. This is real\
    \ world linear regression example. We have figured out that height and build have\
    \ correlation to the weight by a relationship, which looks similar to the equation\
    \ above.\n\nTypes of Linear Regression\n\nLinear Regression is of mainly two types\
    \ - Simple Linear Regression and Multiple Linear Regression. Simple Linear Regression\
    \ is characterized by one independent variable while Multiple Linear Regression\
    \ is characterized by more than one independent variables. While finding the line\
    \ of best fit, you can fit a polynomial or curvilinear regression. You can use\
    \ the following code for this purpose.\n\nimport matplotlib.pyplot as plt\n\n\
    plt.scatter(X, Y)\n\nyfit \\= \\[a + b \\* xi for xi in X\\]\n\nplt.plot(X, yfit)\n\
    \nBuilding a Linear Regressor\n\nRegression is the process of estimating the relationship\
    \ between input data and the continuous-valued output data. This data is usually\
    \ in the form of real numbers, and our goal is to estimate the underlying function\
    \ that governs the mapping from the input to the output.\n\nConsider a mapping\
    \ between input and output as shown −\n\n1 --> 2\n\n3 --> 6\n\n4.3 --> 8.6\n\n\
    7.1 --> 14.2\n\nYou can easily estimate the relationship between the inputs and\
    \ the outputs by analyzing the pattern. We can observe that the output is twice\
    \ the input value in each case, hence the transformation would be − f(x) = 2x\n\
    \nLinear regression refers to estimating the relevant function using a linear\
    \ combination of input variables. The preceding example was an example that consisted\
    \ of one input variable and one output variable.\n\nThe goal of linear regression\
    \ is to extract the relevant linear model that relates the input variable to the\
    \ output variable. This aims to minimize the sum of squares of differences between\
    \ the actual output and the predicted output using a linear function. This method\
    \ is called Ordinary Least Squares. You may assume that a curvy line out there\
    \ that fits these points better, but linear regression does not allow this. The\
    \ main advantage of linear regression is that it is not complex. You may also\
    \ find more accurate models in non-linear regression, but they will be slower.\
    \ Here the model tries to approximate the input data points using a straight line.\n\
    \nLet us understand how to build a linear regression model in Python.\n\nConsider\
    \ that you have been provided with a data file, called data\\_singlevar.txt. This\
    \ contains comma-separated lines where the first element is the input value and\
    \ the second element is the output value that corresponds to this input value.\
    \ You should use this as the input argument −\n\nAssuming line of best fit for\
    \ a set of points is −\n\ny = a + b \\* x\n\nwhere b = ( sum(xi \\* yi) - n \\\
    * xbar \\* ybar ) / sum((xi - xbar)^2)\n\na = ybar - b \\* xbar\n\nUse the following\
    \ code for this purpose −\n\n\\# sample points\n\nX \\= \\[0, 6, 11, 14, 22\\\
    ]\n\nY \\= \\[1, 7, 12, 15, 21\\]\n\n\\# solve for a and b\n\ndef best\\_fit(X,\
    \ Y):\n\n   xbar \\= sum(X)/len(X)\n\n   ybar \\= sum(Y)/len(Y)\n\n   n \\= len(X)\
    \ \\# or len(Y)\n\n   numer \\= sum(\\[xi\\*yi for xi,yi in zip(X, Y)\\]) \\-\
    \ n \\* xbar \\* ybar\n\n   denum \\= sum(\\[xi\\*\\*2 for xi in X\\]) \\- n \\\
    * xbar\\*\\*2\n\n   b \\= numer / denum\n\n   a \\= ybar \\- b \\* xbar\n\n  \
    \ print('best fit line:\\\\ny = {:.2f} + {:.2f}x'.format(a, b))\n\n   return a,\
    \ b\n\n\\# solution"
