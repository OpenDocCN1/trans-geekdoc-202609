    Types of Boosting Algorithms


    There are several types of engine used for boosting algorithms - decision stump,
    margin-maximizing classification algorithm and so on. Different boosting algorithms
    are listed here −


    *   AdaBoost (Adaptive Boosting)


    *   Gradient Tree Boosting


    *   XGBoost


    This section focuses on AdaBoost and Gradient Boosting followed by their respective
    Boosting Algorithms.


    AdaBoost


    Observe the following figure that explains Ada-boost algorithm.


    ![AdaBoost](Images/image00172.jpeg)


    It is explained below −


    Box 1 − You can see that we have assigned equal weights to each data point and
    applied a decision stump to classify them as + (plus) or – (minus). The decision
    stump (D1) has created a vertical line at left side to classify the data points.
    This vertical line has incorrectly predicted three + (plus) as – (minus). So,
    we’ll assign higher weights to these three + (plus) and apply another decision
    stump.


    ![AdaBoost](Images/image00173.jpeg)


    Box 2 − Here, it can see that the size of three (wrongly predicted) + (plus) data
    points is bigger as compared to rest of the data points. In this case, the second
    decision stump (D2) will try to predict them correctly. Now, a vertical line (D2)
    at right side of this box has classified three wrongly classified + (plus) correctly.
    But again, it has made mis-classification errors. This time with three -(minus)
    data points. Again, we will assign higher weights to the three – (minus) data
    points and apply another decision stump.


    ![AdaBoost D2](Images/image00174.jpeg)


    Box 3 − Here, three – (minus) data points are given higher weights. A decision
    stump (D3) is applied to predict these wrongly classified observations correctly.
    This time a horizontal line is generated to classify + (plus) and – (minus) data
    points based on higher weight of wrongly classified observations.


    ![AdaBoost D3](Images/image00175.jpeg)


    Box 4 − Here, we have joined D1, D2 and D3 to form a strong prediction having
    complex rule as compared to individual weak learners. It can be seen that this
    algorithm has classified these observations quite well as compared to any of individual
    weak learner.


    ![AdaBoost D4](Images/image00176.jpeg)


    AdaBoost or Adaptive Boosting − It works on similar method as discussed above.
    It fits a sequence of weak learners on different weighted training data. It starts
    by predicting original data set and gives equal weight to each observation. If
    prediction is incorrect using the first learner, then it gives higher weight to
    observations which have been predicted incorrectly. Being an iterative process,
    it continues to add learner(s) until a limit is reached in the number of models
    or accuracy.


    Mostly, we use decision stamps with AdaBoost. But, we can use any machine learning
    algorithms as base learner if it accepts weight on training data set. We can use
    AdaBoost algorithms for both classification and regression problems.


    You can use the following Python code for this purpose −


    #for classification


    from sklearn.ensemble import AdaBoostClassifier


    #for regression


    from sklearn.ensemble import AdaBoostRegressor


    from sklearn.tree import DecisionTreeClassifier


    dt = DecisionTreeClassifier()


    clf = AdaBoostClassifier(n\_estimators=100, base\_estimator=dt,learning\_rate=1)


    #Here we have used decision tree as a base estimator; Any ML learner can be used
    as base #estimator if it accepts sample weight


    clf.fit(x\_train,y\_train)


    Parameters for Tuning


    The parameters can be tuned to optimize the performance of algorithms, The key
    parameters for tuning are −


    n\_estimators − These control the number of weak learners.


    learning\_rate − This controls the contribution of weak learners in the final
    combination. There is a trade-off between learning\_rate and n\_estimators.


    base\_estimators − These help to specify different ML algorithm.


    The parameters of base learners can also be tuned to optimize its performance.


    Gradient Boosting:


    In gradient boosting, many models are trained sequentially. Each new model gradually
    minimizes the loss function (y = ax + b + e, where ‘e’ is the error term) of the
    whole system using Gradient Descent method. The learning method consecutively
    fits new models to give a more accurate estimate of the response variable.


    The main idea behind this algorithm is to construct new base learners which can
    be optimally correlated with negative gradient of the loss function, relevant
    to the whole ensemble.


    In Python Sklearn library, we use Gradient Tree Boosting or GBRT which is a generalization
    of boosting to arbitrary differentiable loss functions. It can be utilized for
    both regression and classification problems.


    You can use the following code for this purpose −


    #for classification


    from sklearn.ensemble import GradientBoostingClassifier


    #for regression


    from sklearn.ensemble import GradientBoostingRegressor


    clf = GradientBoostingClassifier(n\_estimators = 100, learning\_rate = 1.0, max\_depth
    = 1)


    clf.fit(X\_train, y\_train)


    Here are the terms used in the above code −


    n\_estimators − These control the number of weak learners.


    learning\_rate − This controls the contribution of weak learners in the final
    combination. There is a trade-off between learning\_rate and n\_estimators.


    max\_depth − This is the maximum depth of the individual regression estimators
    which limits the number of nodes in the tree. This parameter is tuned for best
    performance and the best value depends on the interaction of the input variables.


    The loss function can be tuned for better performance.


    Thank You!'
