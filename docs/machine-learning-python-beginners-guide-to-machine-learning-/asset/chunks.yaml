    During development, and particularly when training data is scarce, a practice
    called `cross-validation` can be used to train and validate an algorithm on the
    same data. In `cross-validation`, the training data is partitioned. The algorithm
    is trained using all but one of the partitions, and tested on the remaining partition.
    The partitions are then rotated several times so that the algorithm is trained
    and evaluated on all of the data.


    Consider for example that the original dataset is partitioned into five subsets
    of equal size, labeled `A` through `E`. Initially, the model is trained on partitions
    `B` through `E`, and tested on partition `A`. In the next iteration, the model
    is trained on partitions `A`, `C`, `D`, and `E`, and tested on partition `B`.
    The partitions are rotated until models have been trained and tested on all of
    the partitions. `cross-validation` provides a more accurate estimate of the model''s
    performance than testing a single partition of the data.


    # Performance Measures − Bias and Variance


    Many metrics can be used to measure whether or not a program is learning to perform
    its task more effectively. For supervised learning problems, many performance
    metrics measure the number of prediction errors.


    There are two fundamental causes of prediction error for a model - `bias` and
    `variance`. Assume that you have many training sets that are all unique, but equally
    representative of the population. A model with a high `bias` will produce similar
    errors for an input regardless of the training set it was trained with; the model
    biases its own assumptions about the real relationship over the relationship demonstrated
    in the training data. A model with high `variance`, conversely, will produce different
    errors for an input depending on the training set that it was trained with. A
    model with high `bias` is inflexible, but a model with high `variance` may be
    so flexible that it models the noise in the training set. That is, a model with
    high `variance` over-fits the training data, while a model with high `bias` under-fits
    the training data.


    Ideally, a model will have both low `bias` and `variance`, but efforts to decrease
    one will frequently increase the other. This is known as the `bias-variance trade-off`.
    We may have to consider the `bias-variance tradeoffs` of several models introduced
    in this tutorial. Unsupervised learning problems do not have an error signal to
    measure; instead, performance metrics for unsupervised learning problems measure
    some attributes of the structure discovered in the data. Most performance measures
    can only be worked out for a specific type of task.


    Machine learning systems should be evaluated using performance measures that represent
    the costs of making errors in the real world. While this looks trivial, the following
    example illustrates the use of a performance measure that is right for the task
    in general but not for its specific application.


    ## Accuracy, Precision and Recall


    Consider a classification task in which a machine learning system observes tumors
    and has to predict whether these tumors are benign or malignant. `Accuracy`, or
    the fraction of instances that were classified correctly, is an obvious measure
    of the program''s performance. While `accuracy` does measure the program''s performance,
    it does not make distinction between malignant tumors that were classified as
    being benign, and benign tumors that were classified as being malignant. In some
    applications, the costs incurred on all types of errors may be the same. In this
    problem, however, failing to identify malignant tumors is a more serious error
    than classifying benign tumors as being malignant by mistake.


    We can measure each of the possible prediction outcomes to create different snapshots
    of the classifier''s performance. When the system correctly classifies a tumor
    as being malignant, the prediction is called a `true positive`. When the system
    incorrectly classifies a benign tumor as being malignant, the prediction is called
    a `false positive`. Similarly, a `false negative` is an incorrect prediction that
    the tumor is benign, and a `true negative` is a correct prediction that a tumor
    is benign. These four outcomes can be used to calculate several common measures
    of classification performance, like accuracy, `precision`, `recall` and so on.


    `Accuracy` is calculated with the following formula −


    ```

    ACC = (TP + TN)/(TP + TN + FP + FN)

    ```


    Where, `TP` is the number of true positives

    `TN` is the number of true negatives

    `FP` is the number of false positives

    `FN` is the number of false negatives.


    `Precision` is the fraction of the tumors that were predicted to be malignant
    that are actually malignant. `Precision` is calculated with the following formula
    −


    ```

    PREC = TP/(TP + FP)

    ```


    `Recall` is the fraction of malignant tumors that the system identified. `Recall`
    is calculated with the following formula −


    ```

    R = TP/(TP + FN)

    ```


    In this example, `precision` measures the fraction of tumors that were predicted
    to be malignant that are actually malignant. `recall` measures the fraction of
    truly malignant tumors that were detected. The `precision` and `recall` measures
    could reveal that a classifier with impressive accuracy actually fails to detect
    most of the malignant tumors. If most tumors are benign, even a classifier that
    never predicts malignancy could have high accuracy. A different classifier with
    lower accuracy and higher `recall` might be better suited to the task, since it
    will detect more of the malignant tumors. Many other performance measures for
    classification can also be used.


    # Machine Learning with Python – Techniques


    This chapter discusses each of the techniques used in machine learning in detail.


    ## Classification


    `Classification` is a machine learning technique that uses known data to determine
    how the new data should be classified into a set of existing categories.


    Consider the following examples to understand classification technique −


    *   A `credit card company` receives tens of thousands of applications for new
    credit cards. These applications contain information about several different features
    like age, location, sex, annual salary, credit record etc. The task of the algorithm
    here is to classify the card applicants into categories like those who have good
    credit record, bad credit record and those who have a mixed credit record.

    *   In a `hospital`, the emergency room has more than 15 features (age, blood
    pressure, heart condition, severity of ailment etc.) to analyze before deciding
    whether a given patient has to be put in an intensive care unit as it is a costly
    proposition and only those patients who can survive and afford the cost are given
    top priority. The problem here is to classify the patients into high risk and
    low risk patients based on the available features or parameters.


    While classifying a given set of data, the classifier system performs the following
    actions −


    *   Initially a new data model is prepared using any of the learning algorithms.

    *   Then the prepared data model is tested.

    *   Later, this data model is used to examine the new data and to determine its
    class.


    `Classification`, also called categorization, is a machine learning technique
    that uses known data to determine how the new data should be classified into a
    set of existing labels/classes/categories.

