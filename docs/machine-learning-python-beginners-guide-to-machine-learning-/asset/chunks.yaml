    # Types of Learning:


    Machine Learning (ML) is an automated learning with little or no human intervention.
    It involves programming computers so that they learn from the available inputs.
    The main purpose of machine learning is to explore and construct algorithms that
    can learn from the previous data and make predictions on new input data.


    The `input` to a learning algorithm is training data, representing experience,
    and the `output` is any expertise, which usually takes the form of another algorithm
    that can perform a task. The input data to a machine learning system can be numerical,
    textual, audio, visual, or multimedia. The corresponding output data of the system
    can be a floating-point number, for instance, the velocity of a rocket, an integer
    representing a category or a class, for example a pigeon or a sunflower from image
    recognition.


    In this chapter, we will learn about the training data our programs will access
    and how learning process is automated and how the success and performance of such
    machine learning algorithms is evaluated.


    # Concepts of Learning:


    Learning is the process of converting experience into expertise or knowledge.


    Learning can be broadly classified into three categories, as mentioned below,
    based on the nature of the learning data and interaction between the learner and
    the environment.


    *   Supervised Learning

    *   Unsupervised Learning

    *   Semi-supervised Learning


    Similarly, there are four categories of machine learning algorithms as shown below
    −


    *   Supervised learning algorithm

    *   Unsupervised learning algorithm

    *   Semi-supervised learning algorithm

    *   Reinforcement learning algorithm


    However, the most commonly used ones are `supervised` and `unsupervised learning`.


    # Supervised Learning:


    Supervised learning is commonly used in real world applications, such as face
    and speech recognition, products or movie recommendations, and sales forecasting.
    Supervised learning can be further classified into two types - `Regression` and
    `Classification`.


    `Regression` trains on and predicts a continuous-valued response, for example
    predicting real estate prices.


    `Classification` attempts to find the appropriate class label, such as analyzing
    positive/negative sentiment, male and female persons, benign and malignant tumors,
    secure and unsecure loans etc.


    In supervised learning, learning data comes with description, labels, targets
    or desired outputs and the objective is to find a general rule that maps inputs
    to outputs. This kind of learning data is called `labeled data`. The learned rule
    is then used to label new data with unknown outputs.


    Supervised learning involves building a machine learning model that is based on
    `labeled samples`. For example, if we build a system to estimate the price of
    house we need to collect data on various features, and so on, we need to label
    it.


    Supervised learning deals with learning a function from available data. There
    are many examples of supervised learning such as `Logistic Regression`, `Neural
    networks`, `Support Vector Machines (SVMs)`, and `Naive Bayes classifiers`. Common
    examples include classifying e-mails into spam and not-spam, labeling webpages
    based on content.


    # Unsupervised Learning:


    Unsupervised learning is used to detect anomalies, outliers or group similar behaviors.
    It is the opposite of supervised learning. There is no labeled data here.


    When learning data contains only indications without any description, it is up
    to the algorithm to find the structure. Suppose that we have a number of data
    points, and we want to classify them into several groups. We may not exactly know
    what the criteria would be. Unsupervised learning algorithms include `Kmeans`,
    `Random Forests`, `Hierarchical clustering`.


    # Semi-supervised Learning:


    If some learning samples are labeled, but some other are not, then it is semi-supervised
    learning. It makes use of a large amount of `unlabeled data` for training and
    a small amount of `labeled data` for testing. Semi-supervised learning is applied
    in cases where it is expensive to acquire a fully labeled dataset while more practical
    to label a small subset. For example, it often requires skilled experts to label
    remote sensing images.


    # Reinforcement Learning:


    Here learning data gives feedback so that the system adjusts to dynamic conditions
    in order to achieve a certain objective. The system evaluates its performance
    based on the feedback responses and reacts accordingly. The best known instances
