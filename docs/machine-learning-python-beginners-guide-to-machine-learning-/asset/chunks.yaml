    _train \\= diabetes.target\\[:-30\\]\n\ndiabetes\\_y\\_test \\= diabetes.target\\\
    [-30:\\]\n\n\\# Create linear regression object\n\nregr \\= linear\\_model.LinearRegression()\n\
    \n\\# Train the model using the training sets\n\nregr.fit(diabetes\\_X\\_train,\
    \ diabetes\\_y\\_train)\n\n\\# Make predictions using the testing set\n\ndiabetes\\\
    _y\\_pred \\= regr.predict(diabetes\\_X\\_test)\n\n\\# The coefficients\n\nprint('Coefficients:\
    \ \\\\n', regr.coef\\_)\n\n\\# The mean squared error\n\nprint(\"Mean squared\
    \ error: %.2f\" \n\n      % mean\\_squared\\_error(diabetes\\_y\\_test, diabetes\\\
    _y\\_pred))\n\n\\# Explained variance score: 1 is perfect prediction\n\nprint('Variance\
    \ score: %.2f' % r2\\_score(diabetes\\_y\\_test, diabetes\\_y\\_pred))\n\n\\#\
    \ Plot outputs\n\nplt.scatter(diabetes\\_X\\_test, diabetes\\_y\\_test, color\
    \ \\= 'black')\n\nplt.plot(diabetes\\_X\\_test, diabetes\\_y\\_pred, color \\\
    = 'blue', linewidth \\= 3)\n\nplt.xticks(())\n\nplt.yticks(())\n\nplt.show()\n\
    \nYou can observe the following output once you execute the code given above −\n\
    \nAutomatically created module for IPython interactive environment\n\n('Coefficients:\
    \ \\\\n', array(\\[ 941.43097333\\]))\n\nMean squared error: 3035.06\n\nVariance\
    \ score: 0.41\n\n![Linear Regression2](Images/image00160.jpeg)\n\nLogistic Regression:\n\
    \nLogistic regression is another technique borrowed by machine learning from statistics.\
    \ It is the preferred method for binary classification problems, that is, problems\
    \ with two class values.\n\nIt is a classification algorithm and not a regression\
    \ algorithm as the name says. It is used to estimate discrete values or values\
    \ like 0/1, Y/N, T/F based on the given set of independent variable(s). It predicts\
    \ the probability of occurrence of an event by fitting data to a logit function.\
    \ Hence, it is also called logit regression. Since, it predicts the probability,\
    \ its output values lie between 0 and 1.\n\nExample:\n\nLet us understand this\
    \ algorithm through a simple example.\n\nAssume that there is a puzzle to solve\
    \ that has only 2 outcome scenarios – either there is a solution or there is none.\
    \ Now suppose, we have a wide range of puzzles to test a person which subjects\
    \ he is good at. The outcomes may be something like this – if a trigonometry puzzle\
    \ is given, a person may be 80% likely to solve it. On the other hand, if a geography\
    \ puzzle is given, the person may be only 20% likely to solve it. This is where\
    \ Logistic Regression helps in solving. As per math, the log odds of the outcome\
    \ is expressed as a linear combination of the predictor variables.\n\nodds = p/\
    \ (1-p) = probability of event occurrence / probability of not event occurrence\n\
    \nln(odds) = ln(p/(1-p)) ; ln is the logarithm to the base ‘e’.\n\nlogit(p) =\
    \ ln(p/(1-p)) = b0+b1X1+b2X2+b3X3....+bkXk\n\nNote that in the above p is the\
    \ probability of presence of the characteristic of interest. It chooses parameters\
    \ that maximize the likelihood of observing the sample values rather than that\
    \ minimize the sum of squared errors (like in ordinary regression).\n\nNote that\
    \ taking a log is one of the best mathematical way to replicate a step function.\n\
    \nThe following points may be note-worthy when working on logistic regression\
    \ −\n\n*      It is similar to regression in that the objective is to find the\
    \ values for the coefficients that weigh each input variable.\n\n*      Unlike\
    \ in linear regression, the prediction for the output is found using a non-linear\
    \ function called the logistic function.\n\n*      The logistic function appears\
    \ like a big ‘S’ and will change any value into the range 0 to 1. This is useful\
    \ because we can apply a rule to the output of the logistic function to assign\
    \ values to 0 and 1 and predict a class value.\n\n*      The way the logistic\
    \ regression model is learned, the predictions made by it can also be used as\
    \ the probability of a given data instance belonging to class 0 or class 1. This\
    \ can be useful for problems where you need to give more reasoning for a prediction.\n\
    \n*      Like linear regression, logistic regression works better when unrelated\
    \ attributes of output variable are removed and similar attributes are removed.\n\
    \nThe following code shows how to develop a plot for logistic expression where\
    \ a synthetic dataset is classified into values as either 0 or 1, that is class\
    \ one or two, using the logistic curve.\n\nimport numpy as np\n\nimport matplotlib.pyplot\
    \ as plt\n\nfrom sklearn import linear\\_model\n\n\\# This is the test set, it's\
    \ a straight line with some Gaussian noise\n\nxmin, xmax = -10, 10\n\nn\\_samples\
    \ = 100\n\nnp.random.seed(0)\n\nX = np.random.normal(size = n\\_samples)\n\ny\
    \ = (X > 0).astype(np.float)\n\nX\\[X > 0\\] \\*= 4\n\nX += .3 \\* np.random.normal(size\
    \ = n\\_samples)\n\nX = X\\[:, np.newaxis\\]\n\n\\# run the classifier\n\nclf\
    \ = linear\\_model.LogisticRegression(C=1e5)\n\nclf.fit(X, y)\n\n\\# and plot\
    \ the result\n\nplt.figure(1, figsize = (4, 3))\n\nplt.clf()\n\nplt.scatter(X.ravel(),\
    \ y, color='black', zorder=20)\n\nX\\_test = np.linspace(-10, 10, 300)\n\ndef\
    \ model(x):\n\nreturn 1 / (1 + np.exp(-x))\n\nloss = model(X\\_test \\* clf.coef\\\
    _ + clf.intercept\\_).ravel()\n\nplt.plot(X\\_test, loss, color='blue', linewidth=3)\n\
    \nols = linear\\_model.LinearRegression()\n\nols.fit(X, y)\n\nplt.plot(X\\_test,\
    \ ols.coef\\_ \\* X\\_test + ols.intercept\\_, linewidth=1)\n\nplt.axhline(.5,\
    \ color='.5')\n\nplt.ylabel('y')\n\nplt.xlabel('X')\n\nplt.xticks(range(-10, 10))\n\
    \nplt.yticks(\\[0, 0.5, 1\\])\n\nplt.ylim(-.25, 1.25)\n\nplt.xlim(-4, 10)\n\n\
    plt.legend(('Logistic Regression Model', 'Linear Regression Model'),\n\nloc=\"\
    lower right\", fontsize='small')\n\nplt.show()\n\nThe output plot will look like\
    \ as shown here −\n\n![Logistic Regression](Images/image00161.jpeg)\n\nDecision\
    \ Tree Algorithm:\n\nIt is a supervised learning algorithm that is mostly used\
    \ for classification problems. It works for both discrete and continuous dependent\
    \ variables. In this algorithm, we split the population into two or more homogeneous\
    \ sets. This is done based on most significant attributes to make as distinct\
    \ groups as possible.\n\nDecision trees are used widely in machine learning, covering\
    \ both classification and regression. In decision analysis, a decision tree is\
    \ used to visually and explicitly represent decisions and decision making. It\
    \ uses a tree-like model of decisions.\n\nA decision tree is drawn with its root\
    \ at the top and branches at the bottom. In the image, the bold text represents\
    \ a condition/internal node, based on which the tree splits into branches/ edges.\
    \ The branch end that doesn’t split anymore is the decision/leaf.\n\nExample"
