    \n观察到输出中某些属性对存在对角线分组。这表示存在高度相关性和可预测的关系。\n\n## 训练数据与测试数据\n\n训练数据和测试数据是机器学习中的两个重要概念。本章将详细讨论它们。\n\
    \n### 训练数据\n\n训练集中的观测值构成了算法学习时使用的经验。在监督学习问题中，每个观测值由一个观测输出变量和一个或多个观测输入变量组成。\n\n\
    ### 测试数据\n\n测试集是用于某些性能指标评估模型性能的观测值集合。重要的是，测试集中不能包含来自训练集的观测值。如果测试集中确实包含训练集的示例，将很难评估算法是学习了从训练集中泛化，还是仅仅简单地记住了它们。\n\
    \n泛化能力良好的程序能够有效地使用新数据执行任务。相比之下，一个通过学习过于复杂的模型来记忆训练数据的程序可以准确地预测训练集的响应变量值，但无法预测新示例的响应变量值。记忆训练集被称为\
    \ `过拟合`（`over-fitting`）。记忆观测值的程序可能无法很好地完成任务，因为它可能记住了噪声或巧合的联系和结构。平衡记忆与泛化，或平衡 `过拟合`（`over-fitting`）与`欠拟合`（`under-fitting`），是许多机器学习算法共同的问题。许多模型可以应用\
    \ `正则化`（`Regularization`）来减少 `过拟合`。\n\n除了训练数据和测试数据之外，有时还需要第三组观测值，称为验证集（`validation\
    \ set`）或留出集（`hold-out set`）。\n\n"
