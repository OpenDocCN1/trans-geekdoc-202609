- fmt: '

    Python and its libraries like `NumPy`, `SciPy`, `Scikit-Learn`, `Matplotlib` are
    used in data science and data analysis. They are also extensively used for creating
    scalable machine learning algorithms. Python implements popular machine learning
    techniques such as Classification, Regression, Recommendation, and Clustering.


    Python offers ready-made framework for performing data mining tasks on large volumes
    of data effectively in lesser time. It includes several implementations achieved
    through algorithms such as `linear regression`, `logistic regression`, `Naïve
    Bayes`, `k-means`, `K nearest neighbor`, and `Random Forest`.


    If your aim is growing into a successful coder, you need to know a lot of things.
    But, for Machine Learning & Data Science, it is pretty enough to master at least
    one coding language and use it confidently. So, calm down, you don’t have to be
    a programming genius.


    For successful Machine Learning journey, it’s necessary to choose the appropriate
    coding language right from the beginning, as your choice will determine your future.
    On this step, you must think strategically and arranged correctly the priorities
    and don’t spend time on unnecessary things.


    My opinion — `Python` is a perfect choice for beginner to make your focus on in
    order to jump into the field of machine learning and data science. It is a minimalistic
    and intuitive language with a full-featured library line (also called frameworks)
    which significantly reduces the time required to get your first results.


    You can also, by the way, consider the `R language`, but personally, I am more
    prone to `Python`.


    # Machine Learning with Python – Concepts


    In this chapter, you will learn in detail about the concepts of Python in machine
    learning.


    ## Python in Machine Learning


    Python has libraries that enables developers to use optimized algorithms. It implements
    popular machine learning techniques such as recommendation, classification, and
    clustering. Therefore, it is necessary to have a brief introduction to machine
    learning before we move further.


    ### What is Machine Learning?


    Data science, machine learning and artificial intelligence are some of the top
    trending topics in the tech world today. Data mining and Bayesian analysis are
    trending and this is adding the demand for machine learning. This tutorial is
    your entry into the world of machine learning.


    Machine learning is a discipline that deals with programming the systems so as
    to make them automatically learn and improve with experience. Here, learning implies
    recognizing and understanding the input data and taking informed decisions based
    on the supplied data. It is very difficult to consider all the decisions based
    on all possible inputs. To solve this problem, algorithms are developed that build
    knowledge from a specific data and past experience by applying the principles
    of statistical science, probability, logic, mathematical optimization, reinforcement
    learning, and control theory.


    ### Applications of Machine Learning Algorithms


    The developed machine learning algorithms are used in various applications such
    as −


    * Vision processing

    * Language processing

    * Forecasting things like stock market trends, weather

    * Pattern recognition

    * Games

    * Data mining

    * Expert systems

    * Robotics


    ### Steps Involved in Machine Learning


    A machine learning project involves the following steps −


    * Defining a Problem

    * Preparing Data

    * Evaluating Algorithms

    * Improving Results

    * Presenting Results


    The best way to get started using Python for machine learning is to work through
    a project end-to-end and cover the key steps like loading data, summarizing data,
    evaluating algorithms and making some predictions. This gives you a replicable
    method that can be used dataset after dataset. You can also add further data and
    improve the results.


    ## Environment Setup


    In this chapter, you will learn how to setup the working environment for Python
    machine learning on your local computer.


    ### Libraries and Packages and DataSets


    To understand machine learning, you need to have basic knowledge of Python programming.
    In addition, there are a number of libraries and packages generally used in performing
    various machine learning tasks as listed below −


    * `numpy` — is used for its N-dimensional array objects

    * `pandas` — is a data analysis library that includes dataframes

    * `matplotlib` — is 2D plotting library for creating graphs and plots

    * `scikit-learn` — the algorithms used for data analysis and data mining tasks

    * `seaborn` — a data visualization library based on `matplotlib`


    The datasets used in various examples in this tutorial are available on the internet
    for free download. However, these datasets can also be downloaded from the tutorial
    useful resources center of this.


    ### Installation


    You can install software for machine learning in any of the two methods as discussed
    here −


    #### Method 1


    Download and install Python separately from `python.org` on various operating
    systems as explained below −


    To install Python after downloading, double click the `.exe` (for Windows) or
    `.pkg` (for Mac) file and follow the instructions on the screen.


    For Linux OS, check if Python is already installed by using the following command
    at the prompt −


    ```bash

    $ python --version

    ```


    If Python 2.7 or later is not installed, install Python with the distribution''s
    package manager. Note that the command and package name varies.


    On Debian derivatives such as Ubuntu, you can use `apt` −


    ```bash

    $ sudo apt-get install python3

    ```


    Now, open the command prompt and run the following command to verify that Python
    is installed correctly −


    ```bash

    $ python3 --version

    ```

    Python 3.6.2


    Similarly, we can download and install necessary libraries like `numpy`, `matplotlib`
    etc. individually using installers like `pip`. For this purpose, you can use the
    commands shown here −


    ```bash

    $pip install numpy

    $pip install matplotlib

    $pip install pandas

    $pip install seaborn

    ```


    #### Method 2


    Alternatively, to install Python and other scientific computing and machine learning
    packages simultaneously, we should install `Anaconda` distribution. It is a Python
