    # Boosting Algorithms


    The term ‘Boosting’ refers to a family of algorithms that converts weak learner
    to strong learners. Let us understand this definition by solving a problem of
    spam email identification as shown below −


    What procedure should be followed to classify an email as SPAM or not? In initial
    approach, we would identify ‘spam’ and ‘not spam’ emails using following criteria
    if −


    - Email has only one image file (advertisement image), It’s a SPAM

    - Email has only link(s), It’s a SPAM

    - Email body consist of sentence like “You won a prize money of $ xxxxxx”, It’s
    a SPAM

    - Email from our official domain “Tutorialspoint.com”, Not a SPAM

    - Email from known source, Not a SPAM


    Above, we have defined several rules to classify an email into ‘spam’ or ‘not
    spam’. These rules, however, individually are not strong enough to successfully
    classify an email into ‘spam’ or ‘not spam’. Therefore, these rules are termed
    as `weak learner`.


    To convert weak learner to strong learner, we combine the prediction of each weak
    learner using methods like −


    - Using average/weighted average

    - Considering prediction that has higher vote


    For example, suppose we have defined 7 weak learners. Out of these 7, 5 are voted
    as ‘SPAM’ and 2 are voted as ‘Not a SPAM’. In this case, by default, we’ll consider
    an email as SPAM because we have higher (5) vote for ‘SPAM’.


    # How It Works


    Boosting combines weak learner or base learner to form a strong rule. This section
    will explain you how boosting identifies weak rules.


    To find weak rule, we apply base learning (ML) algorithms with a different distribution.
    Each time base learning algorithm is applied, it generates a new weak prediction
    rule. This uses iteration processes several times. After many iterations, the
    boosting algorithm combines these weak rules into a single strong prediction rule.


    For choosing the right distribution for each round, follow the given steps:


    - Step 1: The base learner takes all the distributions and assigns equal weight
    to each one.

    - Step 2: If there is any prediction error caused by first base learning algorithm,
    then we pay higher weight to observations having prediction error. Then, we apply
    the next base learning algorithm.


    We iterate Step 2 till the limit of base learning algorithm is attained or higher
    accuracy is achieved.

