  trans: "\n\n`a, b = best_fit(X, Y)`\n\n# 拟合线：\n\n`y = 0.80 + 0.92x`\n\n# 绘制点和拟合线\n\
    \n```python\nimport matplotlib.pyplot as plt\n\nplt.scatter(X, Y)\n\nyfit = [a\
    \ + b * xi for xi in X]\n\nplt.plot(X, yfit)\n\nplt.show()\n```\n\n拟合线：\n\n`y\
    \ = 1.48 + 0.92x`\n\n如果你运行上述代码，你可以观察到所示的输出图 −\n\n![线性回归](img/image00159.jpeg)\n\
    \n注意，此示例仅使用了糖尿病数据集（diabetes dataset）的第一个特征，为了展示这种回归技术的二二维图表。在图中可以看到直线，它展示了线性回归如何尝试绘制一条直线，以最大程度地化数据集中观测响应值与线性近似预测值之间的残差和。\n\
    \n你可以使用下方的程序代码计算系数、残差平方和以及方差得分 −\n\n```python\nimport matplotlib.pyplot as plt\n\
    import numpy as np\nfrom sklearn import datasets, linear_model\nfrom sklearn.metrics\
    \ import mean_squared_error, r2_score\n\n# 加载糖尿病数据集\ndiabetes = datasets.load_diabetes()\n\
    \n# 只使用一个特征\ndiabetes_X = diabetes.data[:, np.newaxis, 2]\n\n# 将数据划分为训练/测试集\n\
    diabetes_X_train = diabetes_X[:-30]\ndiabetes_X_test = diabetes_X[-30:]\n\n# 将目标划分为训练/测试集\n\
    diabetes_y_train = diabetes.target[:-30]\ndiabetes_y_test = diabetes.target[-30:]\n\
    \n# 创建线性回归对象\nregr = linear_model.LinearRegression()\n\n# 使用训练集训练模型\nregr.fit(diabetes_X_train,\
    \ diabetes_y_train)\n\n# 使用测试集进行预测\ndiabetes_y_pred = regr.predict(diabetes_X_test)\n\
    \n# 系数\nprint('Coefficients: \\n', regr.coef_)\n\n# 均方误差\nprint(\"Mean squared\
    \ error: %.2f\" \n      % mean_squared_error(diabetes_y_test, diabetes_y_pred))\n\
    \n# 解释方得分：1 表示完美预测\nprint('Variance score: %.2f' % r2_score(diabetes_y_test, diabetes_y_pred))\n\
    \n# 绘制输出\nplt.scatter(diabetes_X_test, diabetes_y_test, color='black')\nplt.plot(diabetes_X_test,\
    \ diabetes_y_pred, color='blue', linewidth=3)\nplt.xticks(())\nplt.yticks(())\n\
    plt.show()\n```\n\n一旦执行了上述代码，你可以观察到以下输出 −\n\n为 IPython 交互环境自动创建模块\n('Coefficients:\
    \ \\n', array([ 941.43097333\\]))\nMean squared error: 3035.06\nVariance score:\
    \ 0.41\n\n![线性回归 2](img/image00160.jpeg)\n\n# 逻辑回归\n\n逻辑回归是机器学习从统计学中借用的另一种技术。它是二分类问题的首选方法，即具有两个类别值的问题。\n\
    \n它是一个分类算法，而不是如名称所说的回归算法。它用于根据给定的独立变量集来估计离散值或像 `0/1`、`Y/N`、`T/F` 这样的值。它通过将数据拟合到\
    \ logit 函数来预测事件发生的概率。因此，它也被称为 `logit 回归`。由于它预测的是概率，其输出值位于 0 和 1 之间。\n\n## 示例\n\
    \n让我们通过一个简单的示例来理解这个算法。\n\n假设有一个谜题需要解决。\n\n"
- fmt: "\nConsider an example of using titanic data set for predicting whether a passenger\
    \ will survive or not. The model below uses 3 features/attributes/columns from\
    \ the data set, namely `sex`, `age` and `sibsp` (no of spouse/children). In this\
    \ case, whether the passenger died or survived, is represented as red and green\
    \ text respectively.\n\n![Decision Tree Algorithm](Images/image00162.jpeg)\n\n\
    In some examples, we see that the population is classified into different groups\
    \ based on multiple attributes to identify ‘if they do something or not’. To split\
    \ the population into different heterogeneous groups, it uses various techniques\
    \ like `Gini`, `Information Gain`, `Chi-square`, `entropy` etc.\n\nThe best way\
    \ to understand how decision tree works, is to play `Jezball` – a classic game\
    \ from Microsoft. Essentially, in this game, you have a room with moving walls\
    \ and you need to create walls such that maximum area gets cleared off without\
    \ the balls.\n\nSo, every time you split the room with a wall, you are trying\
    \ to create 2 different populations with in the same room. Decision trees work\
    \ in very similar fashion by dividing a population in as different groups as possible.\n\
    \nObserve the code and its output given below −\n\n### Starting implementation\n\
    \n```python\nimport pandas as pd\nimport matplotlib.pyplot as plt\nimport numpy\
    \ as np\nimport seaborn as sns\n%matplotlib inline\n\nfrom sklearn import tree\n\
    \ndf = pd.read_csv(\"iris_df.csv\")\ndf.columns = [\"X1\", \"X2\", \"X3\",\"X4\"\
    , \"Y\"]\ndf.head()\n```\n\n### implementation\n\n```python\nfrom sklearn.cross_validation\
    \ import train_test_split\ndecision = tree.DecisionTreeClassifier(criterion=\"\
    gini\")\nX = df.values[:, 0:4]\nY = df.values[:, 4]\ntrainX, testX, trainY, testY\
    \ = train_test_split( X, Y, test_size = 0.3)\ndecision.fit(trainX, trainY)\nprint(\"\
    Accuracy: \\n\", decision.score(testX, testY))\n```\n\n### Visualisation\n\n```python\n\
    from sklearn.externals.six import StringIO\nfrom IPython.display import Image\n\
    import pydotplus as pydot\ndot_data = StringIO()\ntree.export_graphviz(decision,\
    \ out_file=dot_data)\ngraph = pydot.graph_from_dot_data(dot_data.getvalue())\n\
    Image(graph.create_png())\n```\n\n### Output\nAccuracy:\n0.955555555556\n\n###\
    \ Example:\nHere we are using the banknote authentication dataset to know the\
    \ accuracy.\n\n#### Using the Bank Note dataset\n\n```python\nfrom random import\
    \ seed\nfrom random import randrange\nfrom csv import reader\n\n# Loading a CSV\
    \ file\nfilename = 'data_banknote_authentication.csv'\n\ndef load_csv(filename):\n\
    \    file = open(filename, \"rb\")\n    lines = reader(file)\n    dataset = list(lines)\n\
    \    return dataset\n\n# Convert string column to float\ndef str_column_to_float(dataset,\
    \ column):\n    for row in dataset:\n        row[column] = float(row[column].strip())\n\
    \n# Split a dataset into k folds\ndef cross_validation_split(dataset, n_folds):\n\
    \    dataset_split = list()\n    dataset_copy = list(dataset)\n    fold_size =\
    \ int(len(dataset) / n_folds)\n    for i in range(n_folds):\n        fold = list()\n\
    \        while len(fold) < fold_size:\n            index = randrange(len(dataset_copy))\n\
    \            fold.append(dataset_copy.pop(index))\n        dataset_split.append(fold)\n\
    \    return dataset_split\n\n# Calculating accuracy\ndef accuracy_metric(actual,\
    \ predicted):\n    correct = 0\n    for i in range(len(actual)):\n        if actual[i]\
    \ == predicted[i]:\n            correct += 1\n    return correct / float(len(actual))\
    \ * 100\n\n# Evaluating an algorithm using cross validation split\ndef evaluate_algorithm(dataset,\
    \ algorithm, n_folds, *args):\n    folds = cross_validation_split(dataset, n_folds)\n\
    \    scores = list()\n    for fold in folds:\n        train_set = list(folds)\n\
    \        train_set.remove(fold)\n        train_set = sum(train_set)\n        test_set\
    \ = list()\n        for row in fold:\n            row_copy = list(row)\n     \
    \       test_set.append(row_copy)\n            row_copy[-1] = None\n        predicted\
    \ = algorithm(train_set, test_set, *args)\n        actual = [row[-1] for row in\
    \ fold]\n        accuracy = accuracy_metric(actual, predicted)\n        scores.append(accuracy)\n\
    \    return scores\n\n# Splitting a dataset based on an attribute and an attribute\
    \ value\ndef test_split(index, value, dataset):\n    left, right = list(), list()\n\
    \    for row in dataset:\n        if row[index] < value:\n            left.append(row)\n\
    \        else:\n            right.append(row)\n    return left, right\n\n# Calculating\
    \ the Gini index for a split dataset\ndef gini_index(groups, classes):\n    n_instances\
    \ = float(sum([len(group) for group in groups]))\n    gini = 0.0\n    for group\
    \ in groups:\n        size = float(len(group))\n        if size == 0:\n      \
    \      continue\n        score = 0.0\n        for class_val in classes:\n    \
    \        p = [row[-1] for row in group].count(class_val) / size\n            score\
    \ += p * p\n        gini += (1.0 - score) * (size / n_instances)\n    return gini\n\
    \n# Selecting the best split point for a dataset\ndef get_split(dataset):\n  \
    \  class_values = list(set(row[-1] for row in dataset))\n    b_index, b_value,\
    \ b_score, b_groups = 999, 999, 999, None\n    for index in range(len(dataset[0])-1):\n\
    \        for row in dataset:\n            groups = test_split(index, row[index],\
    \ dataset)\n            gini = gini_index(groups, class_values)\n            if\
    \ gini < b_score:\n                b_index, b_value, b_score, b_groups = index,\
    \ row[index], gini\n    return {'index': b_index, 'value': b_value, 'groups':\
    \ b_groups}\n\n# Creating a terminal node\ndef to_terminal(group):\n    outcomes\
    \ = [row[-1] for row in group]\n    return max(set(outcomes))\n\n# Creating splits\
    \ for a node\ndef split(node, max_depth, min_size, depth):\n    # Logic for splitting\
    \ nodes based on criteria\n    pass\n\n# Building a decision tree\ndef build_tree(train,\
    \ max_depth, min_size):\n    root = get_split(train)\n    split(root, max_depth,\
    \ 1)\n    return root\n\n# Making a prediction with a decision tree\ndef predict(node,\
    \ row):\n    if row['index'] < node['value']:\n        if isinstance(node['left'],\
    \ dict):\n            return predict(node['left'], row)\n        else:\n     \
    \       return to_terminal(node['left'])\n    else:\n        if isinstance(node['right'],\
    \ dict):\n            return predict(node['right'], row)\n        else:\n    \
    \        return to_terminal(node['right'])\n\n# Classification and Regression\
    \ Tree Algorithm\ndef decision_tree(train, test, max_depth, min_size):\n    tree\
    \ = build_tree(train, max_depth, min_size)\n    predictions = list()\n    for\
    \ row in test:\n        prediction = predict(tree, row)\n        predictions.append(prediction)\n\
    \    return(predictions)\n\n# Testing the Bank Note dataset\nseed(1)\n# load and\
    \ prepare data\nfilename = 'data_banknote_authentication.csv'\ndataset = load_csv(filename)\n\
    # convert string attributes to integers\nfor i in range(len(dataset[0])):\n  \
    \  str_column_to_float(dataset, i)\n# evaluate algorithm\nn_folds = 5\nmax_depth\
    \ = 5\nmin_size = 10\nscores = evaluate_algorithm(dataset, decision_tree, n_folds,\
    \ max_depth, min_size)\nprint('Scores: %s' % scores)\n```\n"
