    # News & views


    AI in immunology


    # Mapping T helper cell targets with deep learning


    Yuan Liu & Leng Han


    Check for updates


    By integrating multi-dimensional data with deep learning, a new method known as
    ImmunoScope predicts both histocompatibility class II (MHC-II) presentation and
    T helper cell immunogenicity. ImmunoScope shows potential to accelerate de novo
    discovery and vaccine design.


    which peptides often relies on mass spectrometry analysis. In a study in this
    issue of Nature Machine Intelligence, et. present ImmunoScope, which circumvents
    this requirement by using deep learning to predict the peptides that are displayed
    to T helper cells, enabling analysis of which displayed peptides trigger and activate
    immune response. By merging diverse sources of data, ImmunoScope offers rapid
    mapping of antigen-presenting T helper cell targets, with clear implications for
    personalized immunotherapy.


    T cells scan the body for protein fragments known as peptides that appear on cell
    surfaces. A subset known as CD4 T cells recognizes these peptides and releases
    signals to other cells. To understand how T cells recognize peptides, it is important
    to consider the role of antigen-presenting cells. These cells break down proteins
    from tumour mutations, or during normal cell into short peptides. These peptides
    must bind to MHC-II molecules. Once bound, the MHC-II complex on the cell surface
    presents the peptide to T helper cells. If a T helper cell receptor matches the
    presented peptide, the T helper cell activates and initiates a cytokine-driven
    immune response. Identifying a


    Traditionally, in single-variant experiments, cells are engineered to express
    a single MHC-II allele so that every received peptide can be unassignedly, but
    only a few alleles are covered. In contrast, multi-variant experiments, natural
    antigen-presenting cells with several alleles produce data that cannot assign
    each peptide to a specific allele. Assays measure how well affinity is conserved
    over all pairs. This approach has strengths and limitations, most computational
    methods focus on one approach such as binding affinity, multi-variant motifs,
    or T cell activation, and other perform


    ImmunoScope addresses these two connected methods (1). The first, ImmunoScope
    EL, predicts which peptides are displayed and displayed by MHC-II. It runs on
    three datasets:


    ![](img/4d0218b975618b8f6393b76833c5be5a_0_0.png)


    Fig 1 ImmunoScope framework from data integration to cell activation. a. Integration
    of mass spectrometry, biochemical assay, and cells, immunogenicity data to train
    the ImmunoScope deep learning model. b. Multi-task prediction pipeline encompassing
    MHC-II antigen presentation, the


    identification of T helper epitopes, and immunogenicity scoring, c. Predicted
    peptide-MHC II complex displayed by an antigen-presenting cell engaging a CD4+
    T cell to initiate the immune response.


