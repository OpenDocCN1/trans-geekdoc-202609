    # News & views


    (1) 246,000 and 2.4 million peptide-allele pairs from single-variant mass spectrometry
    data across 142 alleles; (2) about 432,000 and 4.4 million examples from multi-variant
    mass spectrometry data covering the same alleles; and (3) roughly 129,000 binding
    affinity measurements spanning 80 classes. ImmunoM uses multiple-instance learning
    to treat each mutant as a candidate of peptide-allele pairs and de novo predictions
    through iterations. A poly-anchor triplet lost clusters confirmed binders and
    non-binders models in the internal representation. This approach enables ImmunoM
    to generalize to unseen peptides and alleles, achieving an area under the recall
    curve (AUC-PR) of 0.856 and an area under the operating characteristic curve (AUC-ROC)
    of 0.825, outperforming tools in nearly 90% of cases.


    in the peptide-MHC-II interface


    ImmunoM, which predicts which peptides will trigger T helper cell activation,
    uses learned embeddings trained on over 75,000 peptide-allele pairs with measured
    release of interferon-γ in T helper cells. New peptides predicted by them show
    no activation. Ambiguous records are resolved and roughly 17,900 examples are
    revised for evaluation. ImmunoM reflects the prediction embeddings using cross-entropy
    loss, a loss to address class imbalance, and a triplet loss to separate epitopes
    from data. ImmunoM achieves an area under the curve (AUC) of 0.909, outperforming
    tools that score over 0.885 and 0.875.


    To demonstrate real-world utility, the authors applied ImmunoScope to the discovery
    of melanoma neantigens and SARS-CoV-2 immune escape. In 42 patients with melanoma,
    ImmunoScope predictions show strong correlation with mass spectrometry data from
    tumor samples. In SARS-CoV-2, ImmunoScope forecasts spike protein fragments from
    the original strain and the variant identified by common mutations, showing a
    68% reduction in T helper cell activation for mutant peptides, matching observed
    reductions in CD4+ T cells. Structural


