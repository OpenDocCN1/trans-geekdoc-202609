    # Dynamic behavior of metal nanoparticles in MOF materials: analysis with electron
    microscopy and deep learning


    Kirill S. Erokhin, Evgeniy O. Pentsak, Vyacheslav R. Sorokin, Yury V. Agaev, Roman
    G. Zaytsev, Vera I. Isaev and Valentine P. Ananikov


    Electron microscopy is a key characterization technique for nanoscale systems,
    and electron microscopy images are typically recorded and analyzed in terms of
    the morphology of the objects under study in static mode. The emerging current
    trend is to analyze the dynamic behavior at the nanoscale observed during electron
    microscopy measurements. In this work, the study of the stability of MOF structures
    with different compositions and topologies under conditions of an electron microscope
    experiment revealed an unusual dynamic behavior of M NPs formed due to the electron-beam-induced
    transformation of specific frameworks. The transition to the liquid phase led
    to spatial movement, rapid sintering, and an increase in the M NPs size within
    seconds. In the case of copper nanoparticles, instantaneous sublimation was observed.
    The dynamic behavior of Co NPs was analyzed with a computational framework combining
    deep learning and classic computer vision techniques. The present study for the
    first time revealed unique information about the stability of a variety of MOFs
    under an electron beam and the dynamic behavior of the formed M NPs. The formation
    of Fe, Ni, Cu, and Co NPs was observed from a molecular framework with a specific
    subsequent behavior – a stable form for Fe, excessive dynamics for Co, and sublimation/condensation
    for Cu. Two important outcomes of the present study should be mentioned: (i) electron
    microscopy investigations of MOF samples should be made with care, as decomposition
    under an electron beam may lead to incorrect results and the appearance of “phantom”
    nanoparticles; and (ii) MOFs represent an excellent model for fundamental studies
    of molecular-to-nano transitions in situ in video mode, including a number of
    dynamic transformations.


    # Introduction


    Metal nanoparticles (M NPs) of a small size are actively used in various fields
    of science and technology.1–5 Importantly, they can be unstable even at room temperature.
    Changes in the shape of M NPs can lead to critical changes in the characteristics
    of nanoscale devices.6,7 Therefore, it is known that the efficiency of heterogeneous
    nanocatalysis depends critically on their shape and size.8–10 The diffusion barrier
    for single metal atoms in nanoparticles on a clean metal surface is extremely
    low (1.0 eV).11 Consequently, even a small thermal activation is sufficient to
    cause the diffusion of atoms. This


    allows clean metal surfaces to flow like a liquid at temperatures far below the
    melting point.12 The melting points of the M NPs are lower than those of the bulk
    metal. Small M NPs are characterized by a quasi-molten phase at temperatures far
    below the melting point. In this phase, the particles continuously oscillate between
    different structures. In addition, particles of different shapes can have different
    phase regions.13 For the first time, melting of nanoparticles under the action
    of an electron beam in a microscope was observed in 1954 for low-melting metals,
    such as Pb, Sn, and Bi.14 A significant decrease in melting temperature occurs
    for particles smaller than 10 nm. A phenomenon of transition to a liquid state
    is also described for larger particles. For example, liquid-like pseudoelasticity
    of sub-10 nm crystalline silver particles was observed under pressure in a microscope
    chamber.6 It was shown that Ag nanoparticles can be deformed like liquid drops.
    Interestingly, at the same time, they remained crystalline inside. Regarding metals
    with high melting points, the liquid-like


