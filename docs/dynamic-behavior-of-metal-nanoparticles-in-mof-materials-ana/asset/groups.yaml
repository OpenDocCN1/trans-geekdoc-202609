    ## MOF材料中金属纳米粒子的动态行为：基于电子显微镜和深度学习的分析


    Kirill S. Erokhin, Evgeniy O. Pentsak, Vyacheslav R. Sorokin, Yury V. Agaev, Roman
    G. Zaytsev, Vera I. Isaev and Valentine P. Ananikov


    电子显微镜是纳米尺度系统的关键表征技术，电子显微镜图像通常以静态模式记录和分析研究对象的形貌。当前新兴的趋势是分析电子显微镜测量过程中观察到的纳米尺度动态行为。在这项工作中，在电子显微镜实验条件下研究不同组成和拓扑的
    MOF 结构的稳定性，揭示了由特定框架的电子束诱导转化形成的 M NPs 的不寻常动态行为。相变到液相导致在秒级内发生空间迁移、快速烧结以及 M NPs 尺寸的增加。在铜纳米粒子的情况下，观察到了瞬时升华。Co
    NPs 的动态行为通过结合深度学习和经典计算机视觉技术的计算框架进行了分析。本研究首次揭示了各种 MOF 在电子束作用下的稳定性以及形成的 M NPs 的动态行为的独特信息。观察到
    Fe、Ni、Cu 和 Co NPs 从分子框架中形成，并表现出特定的后续行为——Fe 为稳定形式，Co 为过度动态行为，Cu 为升华/冷凝。本研究的两个重要结论应予以提及：（i）对
    MOF 样品的电子显微镜研究应谨慎进行，因为电子束作用下的分解可能导致错误结果和“幻象”纳米粒子的出现；（ii）MOF 是原位视频模式下进行分子到纳米转换基础研究的极佳模型，包括多种动态转变。


    ## 引言


    小尺寸金属纳米粒子（M NPs）在科学和技术的各个领域被广泛应用。1–5 重要的是，它们即使在室温下也可能不稳定。M NPs 形状的变化可能导致纳米器件特性的关键变化。6,7
    因此，已知异相纳米催化的效率关键取决于其形状和尺寸。8–10 干净金属表面上纳米粒子中单个金属原子的扩散势垒极低（1.0 eV）。11 因此，即使是微小的热激活也足以引起原子扩散。这使得干净金属表面在远低于熔点的温度下能像液体一样流动。12
    M NPs 的熔点低于块体金属。小尺寸 M NPs 在远低于熔点的温度下表现出准熔相。在此相中，粒子在不同结构之间连续振荡。此外，不同形状的粒子可以具有不同的相区域。13
    1954 年，首次在显微镜中电子束作用下观察到低熔点金属（如 Pb、Sn 和 Bi）纳米粒子的熔化。14 对于小于 10 nm 的粒子，熔点会显著降低。更大粒子的液态转变现象也有描述。例如，在显微镜室内加压条件下观察到了亚
    10 nm 结晶银粒子的类液态伪弹性。6 已证明 Ag 纳米粒子可以像液滴一样变形。有趣的是，同时它们内部仍保持结晶。关于高熔点金属，已描述了 TEM 室内
    CO 流中 Pt 粒子的类液态行为。15


    a 俄罗斯科学院泽利斯基有机化学研究所，俄罗斯莫斯科列宁斯基大街 47 号，119991。电子邮件：val@ioc.ac.ru b 普罗托夫南俄罗斯国立理工大学（NPI），俄罗斯新乔尔卡斯克波夫申斯卡亚街
    132 号，346428。† 电子补充信息（ESI）可用。参见 DOI：https://doi.org/10.1039/d3cp02595k ‡ 作者均等贡献。


    纳米粒子中原子易扩散的后果之一是它们倾向于烧结或聚合。16,17 这一现象在纳米技术、催化以及电子纳米器件开发中也具有重要意义。TEM 室内纳米粒子的烧结可用作冷焊来制造纳米器件。12
    使用原位 TEM，已证明大银纳米粒子（20–50 nm）可在 300 °C 下熔合。18 更有趣的是，Ag NPs 和 Au NPs（约 20 nm）的熔合可以通过电子束在
    200 °C 下启动的扩散在 30–60 分钟内发生。19–24 对于更小的 Ag 和 Au NPs（~3 和 7.5 nm），在 HR-TEM 室内电子束作用下观察到了烧结，并伴随其晶体结构的重排。25


    纳米粒子的低相稳定性不仅会导致熔化和烧结，还会导致升华。电子显微镜中纳米粒子的升华已有报道，涉及金属（主要是银）、26–28 GeSb2Te4、29 Bi2Te3、Bi2Se3、30
    CdSe、31 GeTe、32 和 MgO–Mg。33 在所有情况下，升华均伴随额外加热（> 300 °C）。特别是，银纳米粒子的升华发生在不经过熔化的直接相变过程。34
    直径 9 nm 的 Ag NPs 尺寸减小始于约 575 °C。更大的 Ag NPs（50 nm）的升华需要更高温度（约 675 °C）。28 已有报道描述了在石墨上沉积的
    4 nm 铜粒子在额外加热至 800 °C 时的升华。作者指出，铜纳米粒子的行为取决于支撑物的类型。在 CuO 支撑物的情况下，升华之外，铜纳米粒子在 700
    °C 下发生了熔化。35


    在使用电子显微镜研究纳米粒子时，应考虑电子束对样品可能产生的影响。电子束的作用不仅限于对样品的加热。例如，早已有报道表明电子束可以诱导化学转化并还原某些化合物。21,36–39
    此外，电子束还原已被提议作为生产 M NPs 甚至化学键的方法。40–43


    金属有机框架（MOFs）是由有机分子（连接剂）连接的金属离子组成的一类重要的多孔配位聚合物。44,45 MOFs 是气体储存、46–48 电化学、49–51
    光催化、52,53 催化、54–56 以及传感器57 和纳米反应器58–60 应用的有前途材料。它们还可以作为通过热解合成原子分散催化剂和 MOF 衍生多孔材料的前驱体。61–63
    MOF 结构在电子束照射下的不稳定性是一个已知问题，这使得使用电子显微镜研究这些杂化多孔材料变得困难。64–68 已表明，透射电子显微镜中电子束作用下金属有机框架的稳定性主要由金属而非连接剂类型决定。例如，Cu-
    和 Ru-MOFs 表现出稳定性差。69 在这些条件下，MOF 分解可用作合成 ZnO、In 和 Cu 纳米粒子以及有序银纳米结构的方法。70


    在本研究中，我们报道了 MOF 材料在电子束照射下形成的 M NPs 的动态行为。详细分析了电子显微镜室内各种 MOF 的 M NPs 行为和稳定性。在 Co-MOFs（ZIF-67,
    BIF-66）的情况下，电子束照射导致形成具有异常高迁移率的纳米粒子。在 Cu-MOFs（HKUST-1）的情况下，电子束启动了形成的纳米粒子的瞬时升华（图
    1）。使用机器学习方法研究了含 Co 纳米粒子的行为，以数字化跟踪粒子轨迹和性质。


    ## 结果与讨论


    ### MOF 分解过程中的纳米粒子形成


