    # Experimental part


    # Synthesis of MOFs


    MOFs were synthesized according to published procedures.<sup>76-82</sup> The MIL-101(Fe)
    and NH<sub>2</sub>-MIL-101(Fe) samples were prepared by the MW technique under
    atmospheric pressure according to a modified previously reported procedure.<sup>78</sup>
    For the synthesis of MIL-101(Fe), benzene-1,4-dicarboxylic acid (H<sub>2</sub>BDC)
    (0.230 g, 1.38 mmol) was dissolved in N, N-dimethylformamide (DMF) (60 mL). Then,
    FeCl<sub>3</sub> × 6H<sub>2</sub>O (0.748 g, 2.77 mmol) was added. The resulting
    mixture was stirred, transferred to a glass reactor, and heated in a domestic
    MW oven (145–155 °C, 40 min). The crude product was separated with DMF (2 × 15
    mL), soaked in a fresh DMF portion (15 mL) for 24 h, rinsed with EtOH (3 × 15
    mL), and evacuated (160 °C, 4 h, 10<sup>–3</sup> torr).


    For NH<sub>2</sub>-MIL-101(Fe) synthesis, 2-aminobenzene-1,4-dicarboxylic acid
    (H<sub>2</sub>ABDC) (0.501 g, 2.77 mmol) was dissolved in DMF (60 mL). Then, FeCl<sub>3</sub>
    × 6H<sub>2</sub>O (0.374 g, 1.38 mmol) was added. The resulting mixture was stirred,
    transferred to a glass


    reactor, and heated in a domestic MW oven (145–155 °C, 45 min). The crude product
    was separated by centrifugation, rinsed with DMF (2 × 15 mL), soaked in a fresh
    DMF portion (15 mL) for 24 h, rinsed with EtOH (3 × 15 mL), and evacuated (160
    °C, 4 h, 10<sup>–3</sup> torr).


    # TEM analysis


    A target-oriented approach was utilized for the optimization of the analytic measurements.<sup>83</sup>
    Before measurements, the samples were mounted on a 3 mm copper grid covered with
    carbon film from an isopropanol suspension. Sample morphology was studied using
    a Hitachi HT7700 transmission electron microscope. Images were acquired in bright-field
    TEM mode at an accelerating voltage of 100 kV and an emission current of 8–17
    mA.


    # HR-TEM analysis


    HR-TEM micrographs were obtained with a Themis-Z 3.1 instrument (TFS, USA) equipped
    with an X-FEG monochromator and CS/S double corrector at an accelerating voltage
    of 200 kV. Elemental analysis was performed with a Super-X EDS detector (energy
    resolution of approximately 120 eV) in HAADF-STEM mode. The samples for the TEM
    study were prepared by ultrasonic dispersion in ethanol and consequent deposition
    of the suspension upon a “holey” carbon film supported on a copper grid.


    # Analysis with computational framework combining deep learning and classic computer
    vision techniques


    To study the behavior of nanoparticles in BIF-66, an analysis of the video obtained
    using TEM was performed. The proposed approach is based on machine calculation
    models and consists of the sequential application of video frame stream processing
