    ![](img/277c1f92bfbf14a066f08b0c32f71acd_2_1.png)


    效应，峰值分别在 458 °C 和 492 °C，重量损失为 55.2%（图 S4 和 S5，ESI†）。在 525–650 °C 温度范围内，重量损失为
