    根据颗粒实心度分析数据，实验过程中平均实心度和最大实心度保持不变，即接近凸形（Fig. 6A）。最显著的实心度动态表现在变化值的情况。这表明实心度在0.6–0.7范围内的颗粒形状存在不稳定性和变化趋势。视频分析中的颗粒实心度分布显示，大多数颗粒的实心度在0.920–0.930范围内（Fig.
    6B）。


    对颗粒周长动态的分析表明，最小值和平均值保持相对稳定，分别约为10 nm和65 nm（Fig. 6C）。这表明尺寸为2 nm和10 nm（在圆形形状情况下）的颗粒保持其几何参数的稳定性。同时，最大周长在实验过程中倾向于变化。这表明周长在150–200
    nm范围内（直径24–32 nm）的颗粒最不稳定，倾向于分裂并与其他颗粒合并。颗粒沿周长的分布显示，实验期间绝大多数颗粒的周长在60–70 nm范围内（圆形情况下为10–11
    nm）（Fig. 6D）。


    类似地，在此处。关于“周长”指标，此处也观察到面积趋势。最小值和平均值保持相对稳定，约为15和320 nm<sup>2</sup>（圆形颗粒为2和10 nm）（Fig.
    6E）。最大面积倾向于变化，这表明面积在1250–2250 nm<sup>2</sup>范围内的颗粒不稳定。颗粒面积分布显示，实验期间大多数颗粒的面积在310–370
    nm<sup>2</sup>范围内（10–11 nm）（Fig. 6F）。


    移动颗粒的平均速度在[0, 1.6] nm s<sup>−1</sup>范围内（Fig. 6G）。分析样品中颗粒在观测时间内的移动距离在[0, 295.22]
    nm范围内，平均值为27.75 nm（Fig. 6H）。


    应指出，所观察的纳米颗粒是单个的，并不代表次纳米颗粒的聚集体。在研究条件下，Co NPs作为整体移动且未发生解体。如果是次纳米颗粒的聚集体，情况不会如此（应出现未校正的运动或解体）。NPs的完整性也得到了HR-TEM（Fig.
    S12和S13，ESI†）和SAED（Fig. S14，ESI†）分析的证实。


    ## 结论


    MOFs在电子束作用下的稳定性与分解之间的关系是一个众所周知的问题，这使得通过电子显微镜（即TEM）对这类纳米多孔杂化材料的研究变得复杂。总之，已开展了MOFs对电子束作用的抵抗力的系统研究。研究了各种组成、拓扑和孔隙结构的MOF结构，它们在电子束作用下表现出不同的稳定性，主要取决于框架中金属配位中心的类型。Al-和Zn-MOFs较不太可能转变为M
    NPs，而Fe-、Co-、Ni-和Cu-MOFs降解形成M NPs。


    随后，研究了M NPs在电子束作用下的行为。因此，Fe NPs被证明是稳定的并具有静态图像。相比之下，形成的Co NPs在电子束作用下呈液态并表现出惊人的动态行为。尽管其尺寸可达100
    nm且无额外加热，转变后MOF材料表面上的钴纳米颗粒会改变形状、沿载体表面移动、相互合并并分解成几个颗粒。由HKUST-1形成的铜纳米颗粒在电子束作用下的行为也表现出有趣。Cu
    NPs在几秒钟内升华，并在距离研究颗粒几微米处的碳基底上沉积。


    为了更深入地理解正在进行的过程，利用计算机视觉和深度学习对Co NPs的动态进行了分析。这使得能够以高速分析TEM实验中获得的Co NPs运动视频。研究发现，实心度最低且面积和周长最大的颗粒容易发生变化。因此，最动态的是形状最不凸的大颗粒。形状凸且尺寸较小的颗粒在几何参数方面被证明更稳定。


    所观察到的现象表明，即使在透射电子显微镜研究条件下，大纳米颗粒也容易发生相变。这表明需要控制基于金属纳米颗粒的纳米器件的工作条件。同时，由电子束启动的这种相变可进一步用于开发纳米尺寸器件或催化系统。


    ## 实验部分


    ### MOFs的合成


    MOFs根据公开的程序合成。<sup>76-82</sup> MIL-101(Fe)和NH<sub>2</sub>-MIL-101(Fe)样品按照之前报道的改良程序，在大气压下使用微波（MW）技术制备。<sup>78</sup>
    为合成MIL-101(Fe)，将苯-1,4-二羧酸（H<sub>2</sub>BDC）（0.230 g，1.38 mmol）溶解在N,N-二甲基甲酰胺（DMF）（60
    mL）中。然后，加入FeCl<sub>3</sub> × 6H<sub>2</sub>O（0.748 g，2.77 mmol）。所得混合物被搅拌，转移到玻璃反应器中，并在家用微波炉中加热（145–155
    °C，40 min）。粗产品用DMF（2 × 15 mL）分离，在新鲜DMF部分（15 mL）中浸泡24 h，用EtOH（3 × 15 mL）冲洗，并抽真空（160
    °C，4 h，10<sup>–3</sup> torr）。


    为合成NH<sub>2</sub>-MIL-101(Fe)，将2-氨基苯-1,4-二羧酸（H<sub>2</sub>ABDC）（0.501 g，2.77 mmol）溶解在DMF（60
    mL）中。然后，加入FeCl<sub>3</sub> × 6H<sub>2</sub>O（0.374 g，1.38 mmol）。所得混合物被搅拌，转移到玻璃反应器中，并在家用微波炉中加热（145–155
    °C，45 min）。粗产品通过离心分离，用DMF（2 × 15 mL）冲洗，在新鲜DMF部分（15 mL）中浸泡24 h，用EtOH（3 × 15 mL）冲洗，并抽真空（160
    °C，4 h，10<sup>–3</sup> torr）。


    ### TEM分析


    采用面向目标的方法优化分析测量。<sup>83</sup> 测量前，样品从异丙醇悬浮液中安装在覆有碳膜的3 mm铜网上。样品形貌使用Hitachi HT7700透射电子显微镜进行研究。图像在100
    kV加速电压和8–17 mA发射电流下以亮场TEM模式采集。


    ### HR-TEM分析


    HR-TEM微图使用Themis-Z 3.1仪器（TFS, USA）获得，该仪器配备X-FEG单色化器和CS/S双色差校正器，加速电压为200 kV。元素分析使用Super-X
    EDS探测器（能量分辨率约120 eV）在HAADF-STEM模式下进行。TEM研究的样品通过乙醇中的超声分散及随后将悬浮液沉积在支撑于铜网上的“穿孔”碳膜上制备。


    ### 结合深度学习和经典计算机视觉技术的计算框架分析


    为研究BIF-66中纳米颗粒的行为，对使用TEM获得的视频进行了分析。所提方法基于机器计算模型，由视频帧流处理的顺序应用组成（Fig. 7）。


    Denoising is a preparatory step for cleaning a video image from noise in digital
    data, which is necessary due to the high sensitivity of machine learning methods
    (used in the next step – binarization)


    ![](img/277c1f92bfbf14a066f08b0c32f71acd_5_0.png)


    Fig. 7 将机器学习视频处理应用于TEM视频帧：(A) 初始帧；(B) 去噪；(C) 二值化；(D) 分割。


