    The relationship between the stability and decomposition of MOFs under an electron
    beam is a well-known problem, which complicates investigations of this class of
    nanoporous hybrid materials by electron microscopy, i.e., TEM. In summary, a systematic
    study of the resistance of MOFs to the action of an electron beam was carried
    out. Studied MOF structures with various compositions, topologies and porous structures
    show different stabilities under an electron beam, mainly depending on the type
    of metal coordination centers in the framework. Al- and Zn-MOFs are less likely
    to transform to M NPs, while Fe-, Co-, Ni- and Cu-MOFs degrade to form M NPs.


