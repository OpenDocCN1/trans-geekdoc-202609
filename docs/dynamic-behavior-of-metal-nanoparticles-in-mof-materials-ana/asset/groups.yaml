    used as a methodology for the synthesis of ZnO, In and Cu nanoparticles and ordered
    silver nanostructures.70


    In the present study, we report the dynamic behavior of M NPs formed when MOF
    materials are exposed to an electron beam. The M NPs behavior and stability of
    various MOFs in an electron microscope chamber are analyzed in detail. In the
    case of Co-MOFs (ZIF-67, BIF-66), the exposure of the electron beam resulted in
