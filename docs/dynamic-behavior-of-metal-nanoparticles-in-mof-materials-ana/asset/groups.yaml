    (Cu3(BTC)2，BTC = 1,3,5-苯三羧酸盐)，Ni(BDC)、Ni(BTC) 和 MOF-74(Ni)（Ni2DOBDC，DOBDC = 2,5-二羟基-1,4-苯二羧酸盐）采用透射电子显微镜（TEM）进行了分析。其中一些在受到加速电压为
    100 kV 的电子束照射时，倾向于转变为直径数纳米至数十纳米的颗粒。颗粒的形成主要取决于框架中的金属离子，并观察到含有 Co2+（BIF-66、ZIF-67）、Fe3+（MIL-101(Fe)、NH2-MIL-101(Fe)）、Cu2+（HKUST-1）和
    Ni2+（Ni(BDC)、Ni(BTC)、MOF-74(Ni)）的 MOF 发生了这种情况（表 1 和 图 S1、S2，ESI†）。含有 Al3+（NH2-MIL-101(Al)、MIL-53(Al)、NH2-MIL-53(Al)）和
    Zn2+（ZIF-8）的 MOF 是稳定的（图 S3，ESI†）。一个有趣的观察是，这与金属的标准还原电势 Mn+/M0 一致：稳定 MOF 的金属具有较低的值（Zn2+/Zn0
    为 −1.66 eV，Al3+/Al0 为 −0.76 eV），而易发生转变的 MOF 的金属则较高（Co2+/Co0 为 −0.28 eV，Ni2+/Ni0
    为 −0.25 eV，Fe3+/Fe0 为 −0.04 eV，Cu2+/Cu0 为 0.34 eV）71。此外，颗粒的形成还取决于发射电流。


    在 NPs 形成方面。同一 MOF 的不同颗粒在电子束照射不同时间点观察到 NPs 的出现。有趣的是，正如我们所观察到的，即使经过长时间照射，并非所有框架颗粒都在电子束作用下转化为纳米颗粒。许多
    MOF 结构仅在发射电流增加到 17 μA 时才开始转变。使用高倍率启动了纳米颗粒的形成。将发射电流降低到 8 μA 可以在不发生转变的情况下获得 MOF
    颗粒表面的图像。因此，MOF 的转变和纳米颗粒的形成强烈取决于电流密度。应当指出，仅观察到电子束作用下的部分纳米颗粒形成，而同一 MOF 样品的某些颗粒保持不变。


    我们在 TEM 研究中采用了以下参数：加速电压 100 kV，倍率范围 50–150 K，使用 CCD 摄像头进行检测。屏幕密度约为 10−12 A cm−2。我们的观察表明，框架转变为
    NPs 的速率不仅取决于电子剂量，还取决于 MOF 的性质和颗粒尺寸。对于 BIF-66 和 ZIF-67，转变为 NPs 几乎是瞬时发生的。对于 Ni MOF，则需要几十秒甚至几分钟的时间。


    最有可能的是，MOF 结构的转变是由于二次电子的产生引起的，这可能导致框架中的化学键断裂。72,73 电子束可以还原 MOF 结构中的金属离子，从而形成 M
    NP。样品可能会因与电子束的相互作用而加热。然而，之前的研究表明，用电子束加热样品仅限于几十度或几百度。28,72 因此，由于强烈加热导致的 MOF 材料转变不太可能。


    为分析以钴为基础的 MOF 材料的热稳定性，将 BIF-66 和 ZIF-67 样品加热至 350 °C（2 h）。TEM 研究表明样品形貌无变化。根据 TGA
    数据，BIF-66 在 370 °C 之前具有热稳定性，之后在 370–525 °C 范围内观察到氧化降解，并伴随放热


