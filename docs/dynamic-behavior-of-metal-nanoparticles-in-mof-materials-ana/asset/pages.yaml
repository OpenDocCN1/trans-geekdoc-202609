    # Analysis of Co NPs dynamic behavior with deep learning


    To study the behavior of the resulting Co nanoparticles in the BiF-66 sample,
    we analyzed videos obtained by TEM using deep learning. To analyze the topological
    characteristics of the observed particles, we considered the metric Solidity (completeness),
    which characterizes the ratio of contour area to its convex hull area, the perimeter,
    and the area of the particle. The given graphs and histograms (Fig. 6) illustrate
    the dynamics of change and the law of distribution of the topology of nanoparticles.


    According to the data of the particle solidity analysis, the average and maximum
    particle solidity remain constant during the experiment, i.e. close to a convex
    shape (Fig. 6A). The most expressed solidity dynamics turned out to be in the
    case of the change value. This indicates the instability and tendency to change
    in the shape of particles with a solidity in the range of 0.6–0.7. The solidity
    distribution of the particles showed during the analysis of the video that the
    solidity of most particles is in the range of 0.920–0.930 (Fig. 6B).


    An analysis of the dynamics of the particle perimeter showed that the minimum
    and average values remain relatively stable and are approximately equal to 10
    and 65 nm, respectively (Fig. 6C). This indicates that particles 2 and 10 nm in
    size (in the case of their rounded shape) retain the stability of their geometric
    parameters. At the same time, the maximum perimeter tends to change during the
    experiment. This indicates that particles with a perimeter in the range of 150–200
    nm (diameter 24–32 nm) are the most unstable and tend to divide and merge with
    other particles. The distribution of particles along the perimeter showed that
    the perimeter of the largest number of particles was in the range of 60–70 nm
    (10–11 nm in


    the case of their rounded shape) during the experiment (Fig. 6D).


    By analogy here. The “perimeter” metric, a trend in area is also observed here.
    The minimum and average values remain relatively stable at approximately 15 and
    320 nm2 (2 and 10 nm for round particles) (Fig. 6E). The maximum area tends to
    change, which indicates the instability of particles with an area in the range
    of 1250–2250 nm2. The area distribution of particles showed that the area of most
    particles was in the range of 310–370 nm2 (10–11 nm) during the experiment (Fig.
    6F).


    The average velocity of moving particles is in the range [0, 1.6] nm s−1 (Fig.
    6G). The moving distance of the particles of the analyzed sample during the observation
    time is in the range of [0, 295.22] nm with an average value of 27.75 nm (Fig.
    6H).


    It should be noted that the observed nanoparticles are individual and do not represent
    an aggregate of subnanometer particles. Under the studied conditions, the Co NPs
    moved as a whole and did not disintegrate. In the case of aggregates of subnanometer
    particles, this would not be the case (uncorrected movement or disintegration
    should be the case). The integrity of the NPs was also evidenced by HR-TEM (Fig.
    S12 and S13, ESI†) and SAED (Fig. S14, ESI†) analysis.


    # Conclusions


    The relationship between the stability and decomposition of MOFs under an electron
    beam is a well-known problem, which complicates investigations of this class of
    nanoporous hybrid materials by electron microscopy, i.e., TEM. In summary, a systematic
    study of the resistance of MOFs to the action of an electron beam was carried
    out. Studied MOF structures with'
