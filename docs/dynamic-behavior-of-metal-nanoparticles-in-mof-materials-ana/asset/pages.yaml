    One of the consequences of the easy diffusion of atoms in nanoparticles is their
    tendency to sinter or coalesce.16,17 This phenomenon is also of great importance
    in nanotechnology, catalysis, and the development of electronic nanosized devices.
    The sintering of nanoparticles in a TEM chamber can be used as cold welding to
    create nanoscale devices.12 Using in situ TEM, it was demonstrated that large
    silver nanoparticles (20–50 nm) can be fused at 300 °C.18 Even more interesting
    is that the fusion of Ag NPs and Au NPs (ca. 20 nm) could occur through diffusion
    initiated by an electron beam at 200 °C for 30–60 minutes.19–24 For smaller Ag
    and Au NPs (~3 and 7.5 nm), sintering was observed in the HR-TEM chamber under
    the action of an electron beam, which was accompanied by rearrangement of its
    crystal structure.25


    The low phase stability of nanoparticles can lead not only to melting and sintering
    but also to sublimation. The sublimation of nanoparticles in the electron microscope
    is described for metals (mainly silver),26–28 GeSb2Te4,29 Bi2Te3, Bi2Se3,30 CdSe,31
    GeTe,32 and MgO–Mg.33 In all cases, sublimation occurred with additional heating
    (> 300 °C). In particular, the sublimation of silver nanoparticles occurred by
    a direct transition without melting.34 The decrease in the size of Ag NPs with
    a diameter of 9 nm started at a temperature of approx. 575 °C. Higher temperatures
    (ca. 675 °C) are needed for the sublimation of larger Ag NPs (50 nm).28 The sublimation
    of 4 nm copper particles deposited on graphite upon additional heating up to 800
    °C has been described. The authors note that the behavior of copper nanoparticles
    depended on the type of support. In the case of the CuO support, instead of sublimation,
    melting of copper nanoparticles occurred at 700 °C.35


    When studying nanoparticles by electron microscopy, one should take into account
    the possible effect of an electron beam on a sample. The effect of the electron
    beam is not limited to heating of the sample. For example, it has long been described
    that an electron beam can induce chemical transformations and reduce certain compounds.21,36–39
    Moreover, electron beam reduction has been proposed as a method for producing
    M NPs and even chemical bonds.40–43


    Metal–organic frameworks (MOFs) are an important class of porous coordination
    polymers composed of metal ions connected by organic molecules – linkers.44,45
    MOFs are prospective materials for application in gas storage,46–48 electrochemistry,49–51
    photocatalysis,52,53 catalysis,54–56 as well as sensors57 and nanoreactors.58–60
    They can also be used as precursors for the synthesis of atomically dispersed
    catalysts and MOF-derived porous materials via pyrolysis.61–63 The instability
    of MOF structures under electron beam exposure is a known problem that makes it
    difficult to study these hybrid nanoporous materials using electron microscopy.64–68
    It was shown that the stability of metal–organic frameworks under the action of
    an electron beam in a transmission electron microscope is determined primarily
    by the metal and not by the type of linker. For example, poor stability was shown
    for Cu- and Ru-MOFs.69 MOF decomposition under these conditions can be


