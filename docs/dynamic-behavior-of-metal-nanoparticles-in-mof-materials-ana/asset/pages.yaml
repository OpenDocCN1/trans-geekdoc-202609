    # Dynamic behavior of formed nanoparticles


    Further TEM observation of the formed nanoparticles made it possible to establish
    their different behaviors under the action of an electron beam. The Fe nanoparticles
    were static. In the case of nanoparticles formed during the transformation of
    the MOF-74(Ni) structure, a gradual increase in particle size was observed (Fig.
    4A and B). In addition, a particle “flicker” was observed under the action of
    an electron beam, which is probably due to a change in their orientation under
    the action of local heating and a magnetic field (Fig. 4C–F).74


    Among the studied MOF materials, the dynamic behavior of cobalt nanoparticles
    formed during the transformation of the BIF-66 and ZIF-67 structures under an
    electron beam was the most interesting. In contrast, Fe NPs formed upon transformation
    of the Fe-based MOF (MIL-101) were stable and static (Table 1). The video obtained
    during the TEM study of the Co-MOFs clearly shows that the nanoparticles actively
    moved over the surface of the MOF particle, changed their shape, and, in some
    cases, merged with each other, increasing in size. In some cases, one nanoparticle
    was divided into several separate


    nanoparticles (Fig. 1). This indicates that Co NPs had a liquid-like nature. Notably,
    the size of the observed liquid-like nanoparticles varied from a few nanometers
    to several tens of nanometers.


    ![](img/277c1f92bfbf14a066f08b0c32f71acd_3_1.png)


