    In the present study, we report the dynamic behavior of M NPs formed when MOF
    materials are exposed to an electron beam. The M NPs behavior and stability of
    various MOFs in an electron microscope chamber are analyzed in detail. In the
    case of Co-MOFs (ZIF-67, BIF-66), the exposure of the electron beam resulted in
    the formation of nanoparticles with unusually high mobility. In the case of Cu-MOFs
    (HKUST-1), the electron beam initiated the instantaneous sublimation of the formed
    nanoparticles (Fig. 1). The behavior of Co-containing nanoparticles was studied
    using machine learning methods to digitally track the particle trajectories and
    properties.


