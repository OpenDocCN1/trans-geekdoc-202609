    The melting points of bulk Fe, Co, and Ni are 1812, 1768, and 1726 K, respectively.
    Although the values are close, there is a distinct difference of > 40 K between
    them. In this series, iron is the most refractory among the metals listed above.
    This is probably one of the reasons for the static nature of Fe NPs. In contrast,
    Co and Ni exhibit dynamic behavior. M NPs exhibit lower melting points compared
    to bulk metal. The decrease in melting point can be predicted using the Gibbs–Thomson
    equation. It is significant for particles smaller than 100 nm. For cobalt particles
    with a size of 10 nm, the melting point significantly exceeds 1000 °C. In the
    case of Co NPs with a size of ~ 1 nm, it approximates 500 °C. Thus, the size effect
    of a decrease in the melting temperature should not be strong for the observed
    nanoparticles. The transition to the liquid state requires temperatures well above
    a few hundred degrees.


    Important factors of the thermal stability of bulk and surface atoms are the Tammann
    temperature (0.5Tmelt in K) and the Hüttig temperature (0.3Tmelt in K, respectively).
    At temperatures above the corresponding values, the individual atoms of the particle
    exhibit mobility. For bulk cobalt, the Tammann temperature is 877 °C, and the
    Hüttig temperature is 526 °C. Cobalt nanoparticles with a size of 5–22 nm have
    a Hüttig temperature in the range of 200–240 °C, while the Tammann temperature
    is above 500 °C.73 Thus, heating initiated by an electron beam can cause mobility
    of the surface atoms of cobalt nanoparticles. However, it is unlikely that this
    can lead to the melting of M NPs.


    An even more interesting behavior was observed in the case of a copper-containing
