  \n修改 `select` 查询，使其仅显示 `ID` 大于 5 的用户。\n\n### 使用可变数据插入\n创建一个 `HTML` 表单，请求新用户的 `name`\
  \ 和 `email`。\n在 `PHP` 中处理表单并将数据插入数据库。\n\n### 动态更新\n创建一个表单，允许你根据用户的 `ID` 更新其 `name`。\n\
  \n### 带确认确认的删除\n在运行 `delete` 查询之前添加确认，以防止意外删除。\n\n# 使用 MySQLi 连接数据库\n\n## 安全性与性能\n\
  在本章中，我们将深入学习使用 `mysqli`，这是一种用于从 `PHP` 与 `MySQL` 数据库交互的改进接口。我们将学习如何建立安全连接、执行预处理语句以防止\
  \ SQL 注入，并优化数据库操作的性能。\n\n### 使用 MySQLi 建立连接\n在与数据库交互之前，我们需要建立连接。以下是一个操作示例：\n\n```php\n\
  <?php\n$servername = \"localhost\";\n$username = \"your\\_username\";\n$password\
  \ = \"your\\_password\";\n$database = \"your\\_database\";\n// 创建连接\n$conn = new\
  \ mysqli($servername, $username, $password, $database);\n// 验证连接\nif ($conn->connect\\\
  _error) {\n    die(\"Connection failed: \" . $conn->connect\\_error);\n}\necho \"\
  Connection successful\";\n?>\n```\n\n### 安全的预处理查询\n防止 SQL 注入对于应用程序的安全至关重要。预处理查询是实现这一点的的有效方法。这是一个示例：\n\
  \n```php\n<?php\n$name = \"User\";\n$lastname = \"Example\";\n$email = \"usuario@example.com\"\
  ;\n// 创建预处理查询\n$stmt = $conn->prepare(\"INSERT INTO users (first name, last name,\
  \ email) VALUES (?, ?, ?)\");\n$stmt->bind\\_param(\"sss\", $firstname, $lastname,\
  \ $email);\n// 执行查询\n$stmt->execute();\necho \"Record inserted successfully\";\n\
  $stmt->close();\n?>\n```\n\n### 获取查询结果\n执行查询后，我们可以获取并处理结果。这里是一个基础示例：\n\n```php\n\
  <?php\n$sql = \"SELECT id, name, email FROM users\";\n$result = $conn->query($sql);\n\
  if ($result->num\\_rows > 0) {\n    // 输出每行的数据\n    while ($queue = $resultado->fetch\\\
  _assoc()) {\n        echo \"ID: \" . $row\\[\"id\"\\] . \" - Name: \" . $row\\[\"\
  name\"\\] . \" - Email: \" . $row\\[\"email\"\\] . \"<br>\";\n    }\n} else {\n\
  \    echo \"0 results\";\n}\n$result->close();\n?>\n```\n\n### 关闭连接\n在完成数据库交互后，关闭连接以释放资源至关重要。以下是关闭连接的代码：\n\
  \n```php\n<?php\n$conn->close();\n?>\n```\n\n## 实际练习\n#### 用户注册\n创建一个名为 `users`\
  \ 的表，包含 `id`、`name`、`email` 和 `password` 等字段。\n实现一个注册表单，使用预处理语句向数据库插入新用户。\n\n####\
