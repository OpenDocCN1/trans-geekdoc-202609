  \ `PHP` 应用中有效地实现它。\n\n# 使用 MySQL 和 MySQLi 连接数据库\n\n在本章中，我们将探索如何使用 `PHP` 中标准的 `MySQL`\
  \ 和 `MySQLi` 扩展到 `MySQL` 数据库建立安全高效的连接。与数据库交互的能力对于开发动态且可扩展的 Web 应用至关重要。\n\n## 与 MySQL\
  \ 连接：\n\n`MySQL` 是一个流行且广泛使用的数据库。要让 `PHP` 连接到 `MySQL`，我们需要启用 `MySQL` 扩展。在许多环境中，该扩展已经安装并激活。\n\
  \n### MySQL 连接示例：\n\n```php\n<?php\n\n$servername = \"localhost\";\n\n$username\
  \ = \"your\\_username\";\n$password = \"your\\_password\";\n$database = \"your\\\
  _database\";\n\n// 创建连接\n\n$conn = new mysqli($servername, $username, $password,\
  \ $database);\n\n// 验证连接\n\nif ($conn->connect_error) {\n    die(\"Connection error:\
  \ \" . $conn->connect_error);\n}\n\necho \"Successful connection to MySQL database\"\
  ;\n\n// 在此处执行数据库操作\n\n// 关闭连接\n\n$conn->close();\n\n?>\n```\n\n### 连接到 MySQLi：\n\
  `MySQLi`（MySQL Improved）是一个较新的扩展，相比传统的 `MySQL` 扩展具有优势，例如支持预处理查询和事务。\n\n### MySQLi\
  \ 连接示例：\n\n```php\n<?php\n\n$servername = \"localhost\";\n\n$username = \"your\\\
  _username\";\n$password = \"your\\_password\";\n$database = \"your\\_database\"\
  ;\n\n// 创建连接\n\n$conn = new mysqli($servername, $username, $password, $database);\n\
  \n// 验证连接\n\nif ($conn->connect_error) {\n    die(\"Connection error: \" . $conn->connect_error);\n\
  }\n\necho \"Successful connection to MySQLi database\";\n\n// 在此处执行数据库操作\n\n// 关闭连接\n\
  \n$conn->close();\n\n?>\n```\n\n## 实际练习：\n\n#### 连接与基础查询：\n- 使用提供的代码连接到你的 `MySQL`\
  \ 数据库。\n- 执行一个简单的查询从表中选取某些数据。\n- 在浏览器中打印结果。\n\n#### 使用预处理查询的 MySQLi 连接：\n- 修改代码使用\
  \ `MySQLi` 执行一个预处理查询，以选取具有特定值的记录。\n- 在浏览器中打印结果。\n\n#### 数据插入：\n- 创建一个新脚本，将数据插入到数据库的表中。\n\
  - 验证数据是否已正确插入。\n\n#### 更新和删除数据：\n- 创建更新和删除数据库中数据的操作。\n- 验证操作是否已正确执行。\n\n这些练习将让你熟悉使用\
  \ `PHP` 连接和操作 `MySQL` 数据库的基本操作。\n\n# 数据库连接配置\n\n大多数 Web 应用都需要从数据库存储和检索数据。`PHP` 提供了几个与数据库交互的扩展，其中\
  \ `MySQLi`（MySQL Improved）是一个常用选项。在本章中，我们将学习如何配置数据库连接并执行基本操作。\n\n#### 使用 MySQLi\
  \ 配置连接：\n\n### 安装 MySQLi 扩展：\n确保你的 `PHP` 安装中启用了 `MySQLi` 扩展。你可以通过检查 `php.ini` 文件或在命令行中运行\
  \ `php -m` 来实现。\n\n#### 数据库凭据：\n在连接数据库之前，确保你拥有正确的凭据（用户名、密码、数据库名）。\n\n#### 基础连接：\n\
  \n```php\n<?php\n\n// 数据库凭据\n\n$server = \"localhost\";\n\n$user = \"your\\_user\"\
  ;\n$password = \"your\\_password\";\n$database = \"your\\_database\";\n\n// 创建连接\n\
  \n$conexion = new mysqli($servidor, $usuario, $contrasena, $base_datos);\n\n// 验证连接\n\
  \nif ($conexion->connect_error) {\n    die(\"Connection failed: \" . $connection->connect_error);\n\
  }\n\necho \"Connection successful\";\n\n?>\n```\n将 `\"your\\_user\"`、`\"your\\_password\"\
  ` 和 `\"your\\_database\"` 替换为你自己的凭据。\n\n#### 执行查询：\n\n```php\n<?php\n\n// ... (连接代码)\n\
  \n// SQL 查询\n\n$query = \"SELECT id, name, email FROM users\";\n\n$result = $connection->query($query);\n\
  \n// 检查查询是否成功\n\nif ($result === false) {\n    die(\"Query error: \" . $connection->error);\n\
  }\n\n// 处理结果\n\nwhile ($queue = $resultado->fetch_assoc()) {\n    echo \"ID: \"\
