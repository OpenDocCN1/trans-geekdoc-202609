  \ 请求\n    xhttp.open(\"GET\", \"contenido.txt\", true);\n    xhttp.send();\n}\n\
  ```\n\n**内容文件 (contenido.txt):**\n通过 AJAX 动态加载的内容！\n\n\n\n\n\n在现代 Web 开发中，异步通信在提升用户体验方面起着至关重要的作用。在本章中，我们将探索\
  \ PHP 如何通过 AJAX 与客户端进行异步交互。\n\n# AJAX：引言\n\nAJAX（异步 JavaScript 和 XML）是一种技术，允许 Web\
  \ 应用程序异步地从服务器发送和接收数据，而无需重新加载整个页面。这是通过结合 JavaScript、XML（尽管现在 JSON 更常见）以及 `XMLHttpRequest`\
  \ 的异步能力实现的。\n\n## 实际示例：动态内容加载\n\n让我们想象这样一个场景：我们希望在页面上加载新消息，而不需要在每次有人发送消息时重新加载页面。我们将使用\
  \ AJAX 实现这一目标。\n\n### HTML (index.html):\n\n```html\n<!DOCTYPE html>\n<html lang=\"\
