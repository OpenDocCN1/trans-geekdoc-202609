  \        }\n    };\n    // 将消息作为参数发送请求\n    xhr.send('message=' + encodeURIComponent(message));\n\
  }\n// 页面加载时加载消息\nloadMessages();\n```\n\n### PHP (messages.php):\n\n```php\n<?php\n\
