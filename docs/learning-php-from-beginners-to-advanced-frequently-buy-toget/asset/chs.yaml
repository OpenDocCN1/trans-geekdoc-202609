  \ - 无需刷新的 Web 页面\n\n无需刷新的页面刷新技术（通常被称为 AJAX，异步 JavaScript 和 XML）允许你在后台加载或向服务器发送数据，而无需重新加载整个页面，从而提升用户体验。在本章中，我们将探索如何将\
  \ AJAX 与 PHP 集以实现动态更新。\n\n## AJAX 简介：\n\nAJAX 使用 JavaScript 向服务器发送异步请求，并在不重新加载整个页的情况下处理响应。让我们创建一个简单的示例来理解它的工作原理。\n\
  \n## 实际示例\n\n### 文件结构：\n```\n/project-ajax\n├── index.php\n├── update.php\n└── script.js\n\
