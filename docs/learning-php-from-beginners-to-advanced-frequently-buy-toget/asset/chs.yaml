  \ 的按钮。这将帮助你理解如何使用 AJAX 和 PHP 处理操作。\n\n# PHP 中的面向对象编程\n\n面向对象编程（OOP）是一种围绕对象组织的开发方法，对象是类的实例。PHP\
  \ 完全支持面向对象，在本章中，我们将探索面向对象的基础以及如何实现它。\n\n## 面向对象基础：\n\n面向对象基于四个核心概念：\n- **类 (Classes)**：创建对象的模板。定义了该类型对象共有的属性和方法。\n\
  - **对象 (Objects)**：类的实例。每个对象都有自己的属性并可以执行自己的方法。\n- **属性 (Properties)**：与类或对象相关的变量。\n\
  - **方法 (Methods)**：与类或对象相关的函数。\n\n## 实际示例：\n\n```php\n<?php\n// 定义一个类\nclass Car\
  \ {\n    // 属性\n    public $mark;\n    public $model;\n    public $color;\n\n  \
