  \ $this->mark = $marca;\n        $this->model = $modelo;\n        $this->color =\
  \ $color;\n    }\n\n    // 获取汽车信息的方法\n    public function getInformation() {\n \
  \       return \"Coche: {$this->mark} {$this->model}, 颜色: {$this->color}\";\n  \
  \  }\n}\n\n// 创建对象\n$coche1 = new Car(\"Toyota\", \"Corolla\", \"红色\");\n$coche2\
  \ = new Car(\"Honda\", \"Civic\", \"蓝色\");\n\n// 访问属性\necho $coche1->mark;\n?>\n\
  ```\n\n\n\n\n\n```php\necho $coche1->get information(); // 输出: Car: Toyota Corolla,\
  \ Color: Red\n\n// 属性修改\n\n$coche2->color = \"Green\";\n\necho $coche2->get information();\
  \ // 输出: Car: Honda Civic, Color: Green\n\n?>\n```\n\n## 实际练习：\n\n### 创建 Person\
