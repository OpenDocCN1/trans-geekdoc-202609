  ] . \"<br>\";\n}\n\n// 关闭连接\n\n$conexion->close();\n\n?>\n```\n\n## 实际练习：\n\n####\
  \ 简单连接与查询：\n创建一个 `PHP` 文件，连接到你的数据库并从表中获取简单信息。\n\n#### 数据插入：\n修改上述脚本将新数据插入到 `users`\
  \ 表。\n\n#### 数据更新：\n实现一个函数来更新数据库中特定用户的数据。\n\n#### 数据删除：\n添加删除用户的功能。\n\n#### 错误处理：\n\
  引入错误处理，例如检查连接是否成功。\n\n这些练习将让你熟悉 `PHP` 中的基础 CRUD（增、删、改、删）操作。\n\n# 使用 PHP 执行 SQL 查询\n\
