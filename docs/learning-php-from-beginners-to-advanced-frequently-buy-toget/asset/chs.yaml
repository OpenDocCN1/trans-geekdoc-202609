  \n# PHP 和 AJAX\n通过 AJAX，我们可以更新网页的特定部分，而无需重新刷新整个页面。我们将学习如何向服务器发送请求，使用 `PHP` 处理它们并动态更新页面内容。\n\
  \n### AJAX 基础\nAJAX 基于以下技术：\n* `JavaScript`: 用于发送异步请求。\n* `XMLHttpRequest` (XHR):\
  \ 促进 `JavaScript` 与服务器之间通信的对象。\n* `PHP`: 用于处理服务器端请求并返回响应。\n\n### 实际示例：动态内容加载\n\n\
  **1. HTML 文件 (index.html):**\n```html\n<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n\
  \    <meta charset=\"UTF-8\">\n    <title>PHP y AJAX</title>\n    <script src=\"\
  https://code.jquery.com/jquery-3.6.4.min.js\"></script>\n    <script src=\"script.js\"\
  ></script>\n</head>\n<body>\n    <div id=\"content\">\n        <!-- 内容将动态加载在此处 -->\n\
  \    </div>\n    <button id=\"loadContent\">Carry Content</button>\n</body>\n</html>\n\
  ```\n\n**2. JavaScript 文件 (script.js):**\n```javascript\n$(document).ready(function()\
  \ {\n    $(\"#loadContent\").click(function() {\n        // 向服务器发送 AJAX 请求\n   \
  \     $.ajax({\n            url: \"load\\_content.php\",\n            method: \"\
  GET\",\n            success: function(data) {\n                // 更新页面内容\n     \
  \           $(\"#content\").html(data);\n            },\n            error: function()\
  \ {\n                alert(\"Error loading.\");\n            }\n        });\n  \
  \  });\n});\n```\n\n**3. PHP 文件 (load\\_content.php):**\n```php\n<?php\n// 模拟延迟\n\
  sleep(2);\necho \"<p>Dynamically loaded content!</p>\";\n?>\n```\n\n### 实际练习：实时\n\
  **HTML 文件 (index.html):**\n```html\n<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n\
