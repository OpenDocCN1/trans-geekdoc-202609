  \ 面向对象编程的知识。\n\n---\n\n## 类与对象\n\n面向对象编程 (OOP) 是 PHP 的核心组成部分，它允许你以更结构化、模块化的方式组织代码。在本章中，我们将探索如何在\
  \ PHP 中使用 `classes`（类）和 `objects`（对象）。\n\n### PHP 类\n在 PHP 中，`class` 是创建 `objects`\
  \ 的蓝图或模型。`Objects` 是类的实例，每个 `object` 都可以拥有属性（变量）和方法（函数）。\n\n### 实例示例：\n```php\n\
  <?php\n// 'Person' 类的定义\nclass Persona {\n    // 属性（属性）\n    public $name;\n   \
  \ public $ age ;\n\n    // 构造方法\n    public function __construct($name, $age) {\n\
  \        $this->name = $name;\n        $this->age = $age;\n    }\n    // 获取信息的方法\n\
  \    public function get information() {\n        return \"Name: {$this->name},\
  \ Age: {$this->age} years\";\n    }\n}\n\n// 创建对象\n$person1 = new Person(\"John\"\
  , 25);\n$persona2 = new Person(\"Mary\", 30);\n\n// 属性和方法\necho $persona1->get information();\
  \ // 输出: Name: Juan, Age: 25 years\necho $persona2->get information(); // 输出: Name:\
  \ María, Age: 30 years\n?>\n```\n\n### 继承与多态\n继承允许一个 `class` 继承另一个 `class` 的属性和方法。多态允许不同\
  \ `classes` 的 `objects` 被视为基类 `class` 的 `objects`。\n\n### 实例示例：\n```php\n<?php\n\
  // 基类 'Animal'\nclass Animal {\n    public function makeSound() {\n        return\
  \ \"Generic sound\";\n    }\n}\n// 派类 'Dog'\nclass Perro extends Animal {\n    public\
  \ function makeSound() {\n        return \"Wow wow\";\n    }\n}\n// 派类 'Cat'\nclass\
  \ Gato extends Animal {\n    public function makeSound() {\n        return \"Meow\"\
  ;\n    }\n}\n\n// 创建对象\n$dog = new Dog();\n$gato = new Gato();\n\n// 方法调用\necho\
  \ $dog->makeSound(); // 输出: Wow wow\necho $gato->makeSound(); // 输出: Meow\n?>\n\
  ```\n\n## 实际练习：\n\n### 创建 'Book' 类\n- 定义一个名为 `Book` 的 `class`，包含如 `title`（标题）、`author`（作者）和\
