  \    <meta charset=\"UTF-8\">\n    <title>AJAX 更新</title>\n    <script src=\"https://code.jquery.com/jquery-3.6.4.min.js\"\
  ></script>\n    <script src=\"script.js\"></script>\n</head>\n<body>\n    <h1>计数器：<span\
  \ id=\"counter\">0</span></h1>\n    <button onclick=\"incrementCounter()\">增加</button>\n\
  </body>\n</html>\n```\n\n### script.js:\n\n```javascript\nfunction incrementCounter()\
  \ {\n    // 向服务器发送 AJAX 请求\n    $.ajax({\n        type: \"POST\",\n        url:\
  \ \"update.php\",\n        data: { reset: true },\n        success: function(response)\
  \ {\n            // 更新页面上的计数器\n            $(\"#counter\").text(response);\n   \
  \     }\n    });\n}\n```\n\n### update.php:\n\n```php\n<?php\n// 模拟服务器处理（你可以执行复杂的操作）\n\
  session_start();\nif (isset($_POST['reset'])) {\n    $_SESSION['contador'] = 0;\n\
  }\n$_SESSION['contador']++;\n// 返回新值\necho $_SESSION['contador'];\n```\n\n## 练习：\n\
