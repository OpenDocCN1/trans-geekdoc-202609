    Error and Exception Handling in PHP


    In the development of any application, it is inevitable to encounter errors. In
    this chapter,we will explore the types of errors in PHP and how to manage them
    effectively to improve the robustness and stability of our applications.


    Types of Errors in PHP:


    In PHP, errors are classified into three main types:


    Syntactic Errors: They occur when there is a problem with the structure of the
    code. These errors prevent the script from running correctly and are highlighted
    during code analysis. For example:


    <?php


    // Syntax error: missing semicolon at the end


    echo "Hello, World"


    ?>


    Logical or Execution Errors: These errors do not prevent the script from running,
    but they can lead to unexpected or incorrect behavior of the program. They are
    more subtle and require deeper analysis. For example:


    <?php


    // Logical error: division by zero


    $numerator = 10;


    $denominator = 0;


    $result = $numerator / $denominator;


    echo $result;


    ?>


    Runtime Errors: These errors occur during the execution of the script and can
    vary in severity. These can be warnings, notifications, or fatal errors that stop
    the script from executing. For example:


    <?php


    // Runtime error: attempt to access a non-existent index


    $arr = array(1, 2, 3);


    echo $arr\[4\];


    ?>


    Error Handling in PHP:


    To handle errors, PHP provides the try...catch structure to handle exceptions.
    This allows specific errors to be detected and responded to in a controlled manner.


    <?php


    try {


        // Code that can generate an exception


        $result = 10 / 0;


        echo $result;


    } catch (Exception $e) {


        //Exception handling


        echo "An exception occurred: ". $e->getMessage();


    }


    ?>


    Practical exercises:


    Syntactic Errors:


    Enter a syntax error in your script and observe the error message. Correct the
    error.


    Logical Errors:


    Create a script that contains a logical error. Run the script and see the wrong
    output. Identify and correct the error.


    Runtime Errors:


    Introduce a runtime error into your script. Use try...catch to handle the exception
    and provide a custom message.


    General Error Handling:


    Modify your script to include a try...catch block that catches any general exceptions.
    Prints an informational message in case of error.


    By practicing these exercises, you will gain experience in identifying and handling
    different types of errors in PHP, improving the quality and reliability of your
    applications.


    Catching and Handling Exceptions in PHP


    In application development, it is crucial to anticipate and handle potential errors.
    PHP provides a robust exception handling system that allows you to handle exceptional
    situations in an elegant and controlled manner. In this chapter,we will explore
    how to catch and handle exceptions in PHP.


    Catching Exceptions:


    In PHP, exceptions are represented by the Exception class or classes derived from
    it. You can catch exceptions using try, catch, and optionally finally. Here is
    a basic example:


    try {


        // Code that could throw an exception


        $result = 10 / 0; // Generate a division by zero


    } catch (Exception $e) {


        // Catch the exception and handle the error


        echo "An exception has been produced: " . $e->getMessage();


    } finally {


        // This block is always executed, regardless of whether an exception was thrown
    or not


        echo "Block finally executed!";


    }


    Creating Custom Exceptions:


    You can create your own custom exception classes for specific situations. For
    example:


    class MiExcepcion extends Exception {


        public function \_\_construct($message = "Custom error",$code = 0, Throwable
    $anterior = null) {


            parent::\_\_construct($message,$code, $anterior);


        }


    }


    try {


        // Something that could throw a custom exception


        throw new MyException("This is a custom error.");


    } catch (MiExcepcion $e) {


        echo "Exception caught: " . $e->getMessage();


    }


    Practical exercises:


    Division with Exception Handling:


    Create a function called split that accept two parameters and perform the division.


    Catches the exception if an attempt is made to divide by zero and displays an
    appropriate message.


    Age Validation:


    Write a function that validates the user''s age. If the age is less than 18, throw
    an exception.


    Catches the exception in a try-catch block and displays a custom message.


    File management:


    Write a script that attempts to open a file that does not exist.


    It uses a try-catch block to catch the exception and displays an informational
    message.


    Custom Exception:


    Create a custom exception class called MyCustomException.


    Throw this exception in a context of your choice and captured.


    These exercises will help you understand how to implement and handle exceptions
    in practical situations. Proper exception handling is essential to building robust,
    fault-resistant applications.


    Good Practices for Error Handling in PHP


    Handling errors effectively is essential to ensuring that our applications are
    robust and resistant to failures. In this chapter,we will explore some good practices
    for error handling in PHP.


    1\. Use try, catch, and finally in Exceptions:


    try {


        // Code that could throw an exception


        $result = 10 / 0;


        echo "This message will never be printed.";


    } catch (Exception $e) {


        //Handle the exception


        echo "Error: " . $e->getMessage();


    } finally {


        // This block will always be executed, regardless of whether there is an exception
    or not


        echo "Operation completed.";


    }


    2\. Customize Exceptions for Specific Context:


    class MiExcepcion extends Exception {


        public function \_\_construct($mensaje, $code = 0, Exception $anterior = null)
    {


            parent::\_\_construct($message,$code, $anterior);


        }


        public function \_\_toString() {


            return \_\_CLASS\_\_ . ": \[{$this->code}\]: {$this->message}\\n";


        }


    }


    try {


        throw new MyException("This is a custom message.", 42);


    } catch (MiExcepcion $e) {


        echo $e;


    }


    3\. Log Errors in a Log File:


    // Configuration to log errors to a file


    ini\_set("log\_errors", 1);


    ini\_set("error\_log", "/ruta/al/archivo-de-registro.log");


    // Code that could generate an error


    $result = 10 / 0;


    4\. Show Custom Error Pages in Production:


    // Setting to show errors only in development


    ini\_set("display\_errors", 0);


    ini\_set("display\_startup\_errors", 0);


    // Configuration to log errors to a file


    ini\_set("log\_errors", 1);


    ini\_set("error\_log", "/ruta/al/archivo-de-registro.log");


    // Code that could generate an error


    $result = 10 / 0;


    Practical exercises:


    Exception Handling:


    Write a function that divides two numbers and throws an exception if the divisor
    is zero.


    Call this function and handle the exception correctly.


    Exception Customization:


    Create a new custom exception that is thrown when a user tries to access a resource
    without permissions.'
