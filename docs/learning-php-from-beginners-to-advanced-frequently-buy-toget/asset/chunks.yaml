- raw: 'In modern web development, asynchronous communication plays a crucial role
    in improving user experience. In this chapter,we will explore how PHP can work
    asynchronously with the client using AJAX.


    AJAX: Introduction


    AJAX (Asynchronous JavaScript and XML) is a technique that allows web applications
    to send and receive data from the server asynchronously, without having to reload
    the entire page. This is achieved by combining JavaScript, XML (although JSON
    is more common today), and the asynchronous capabilities of XMLHttpRequest.


    Practical Example: Dynamic Content Loading


    Let''s imagine a scenario where we want to load new messages on a page without
    having to recharge it every time someone sends a message. We will use AJAX to
    achieve this.


    HTML (index.html):


    <!DOCTYPE html>


    <html lang="es">


    <head>


        <meta charset="UTF-8">


        <meta name="viewport" content="width=device-width, initial-scale=1.0">


        <title>Asynchronous Communication</title>


    </head>


    <body>


    <div id="chat">


        <!-- Messages will be displayed here -->


    </div>


    <form id="messageForm">


        <input type="text" id="message" placeholder="Write your message">


        <button type="button" onclick="send Message()">Send</button>


    </form>


    <script src="script.js"></script>


    </body>


    </html>


    JavaScript (script.js):


    function loadMessages() {


        // We create an XMLHttpRequest object


        var xhr = new XMLHttpRequest();


        // We configure the GET request to the messages.php file


        xhr.open(''GET'', ''mensajes.php'', true);


        // We define the function to execute when the request is completed


        xhr.onload = function () {


            if (xhr.status >= 200 && xhr.status < 300) {


                // The request was successful, we update the content of the div


                document.getElementById(''chat'').innerHTML = xhr.responseText;


            }


        };


        // We send the request


        xhr.send();


    }


    function send Message() {


        var message = document.getElementById(''message'').value;


        // We create an XMLHttpRequest object


        var xhr = new XMLHttpRequest();


        // We configure the POST request to the filesend\_message.php


        xhr.open(''POST'', ''send\_message.php'', true);


        xhr.setRequestHeader(''Content-Type'', ''application/x-www-form-urlencoded'');


        // We define the function to execute when the request is completed


        xhr.onload = function () {


            if (xhr.status >= 200 && xhr.status < 300) {


                // The request was successful, we load the new messages


                loadMessages();


            }


        };


        // We send the request with the message as a parameter


        xhr.send(''message='' + encodeURIComponent(message));


    }


    // We load the messages when the page loads


    loadMessages();


    PHP (messages.php):


    <?php


    // We simulate obtaining messages from a database


    $messages = array(


        "Hello how are you?",


        "Everthing is good here!",


        "This is a test message."


    );


    // We return the messages in HTML format


    foreach ($messages like this $message) {


        echo "<p>$message</p>";


    }


    ?>


    PHP (send\_message.php):


    <?php


    // We simulate the reception and storage of the message in a database


    if (isset($\_POST\[''mensaje''\])) {


        $newMessage = $\_POST\[''message''\];


        // We process the new message (save it in a database, for example)


        // ...


        // Return a successful response


        echo "Message sent successfully";


    } else {


        // Return an error message if no message is provided


        echo "Error: Empty message";


    }


    ?>


    Practical exercises:


    Chat Expansion:


    Modify the code so that the chat show the sender and time of each message.


    Implements the message sending function so that the sender also sends.


    External Content Upload:


    Create a new news.php file that return the latest news in HTML format.


    Modify the home page to dynamically load news when you click a button.


    Error Handling:


    Improves error handling when sending messages. Display error messages on the page
    when there is a problem.


    PHP and AJAX - Updating Web Pages without Reloading


    The no-reload web page refresh technique, commonly known as AJAX (Asynchronous
    JavaScript and XML), allows you to improve the user experience by loading or sending
    data to the server in the background without having to reload the entire page.
    In this chapter,we will explore how to integrate AJAX with PHP to achieve dynamic
    updates.


    Introduction to AJAX:


    AJAX uses JavaScript to make asynchronous requests to the server and manipulate
    the response without reloading the entire page. Let''s create a simple example
    to understand how it works.


    Practical example:


    File Structure:


    /project-ajax


    ├── index.php


    ├── update.php


    └── script.js


    index.php:


    <!DOCTYPE html>


    <html lang="es">


    <head>


        <meta charset="UTF-8">


        <title>AJAX Update</title>


        <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>


        <script src="script.js"></script>


    </head>


    <body>


        <h1>Counter: <span id="counter">0</span></h1>


        <button onclick="incrementCounter()">Increment</button>


    </body>


    </html>


    script.js:


    function incrementCounter() {


        // Make an AJAX request to the server


        $.ajax({


            type: "POST",


            url: "update.php",


            success: function(response) {


                // Update the counter on the page


                $("#counter").text(response);


            }


        });


    }


    update.php:


    <?php


    // Simulate a process on the server (you can perform more complex operations here)


    // In this example, we simply increment a counter on the server.


    session\_start();


    if (!isset($\_SESSION\[''contador''\])) {


        $\_SESSION\[''contador''\] = 0;


    }


    $\_SESSION\[''contador''\]++;


    // Return the new counter value


    echo $\_SESSION\[''counter''\];


    Practical exercise:


    Implements additional functionality in update.php to reset the counter to zero
    when a specific request is sent from the client. Modify the functionincrementCounter()
    in script.js to call this new functionality.


    // In update.php


    if (isset($\_POST\[''reset''\])) {


        $\_SESSION\[''contador''\] = 0;


        echo $\_SESSION\[''counter''\];


        exit;


    }


    // And script.js


    function resetCounter() {


        $.ajax({


            type: "POST",


            url: "update.php",


            data: { reset: true },


            success: function(response) {


                $("#counter").text(response);


            }


        });


    }


    Add a new button in index.php that calls the functionresetCounter(). This exercise
    will help you understand how to handle different actions with AJAX and PHP to
    dynamically update the web page without recharge it for complete.


    Object Oriented Programming in PHP


    Object-oriented programming (OOP) is a development methodology that organizes
    code around objects, which are instances of classes. PHP fully supports OOP, and
    in this chapter,we will explore the fundamentals of object-oriented programming
    and how to implement it in PHP.


    Fundamentals of Object Oriented Programming:


    The OOP is based on four fundamental concepts:


    Classes: They are templates for creating objects. They define the properties and
    methods common to all objects of that type.


    Objects: Class instances. Each object has its own properties and can execute its
    own methods.


    Properties: These are variables associated with a class or object.


    Methods: They are functions associated with a class or object.


    Practical example:


    <?php


    // Definition of a class


    class Car {


