  trans: "\n\n在模拟场景中抛出此异常。\n\n## 错误日志\n编写一个故意会产生错误的脚本。\n\n配置应用程序将该错误记录到日志文件中。\n\n\
    ## 显示自定义错误页面\n配置您的应用，在访问不存在的 URL 时显示自定义的 404 错误页面。\n\n记住，适当的错误处理不仅可以提高代码质量，还能在应用程序开发和运行期间更容易识别和解决问题。\n\
    \n## PHP 安全\n安全性是 Web 开发中至关重要的考虑因素。在本章中，我们将重点关注使用 `PHP` 时的基本安全实践。我们将探索如何防止常见攻击，并确保我们的应用程序健壮可靠。\n\
    \n### 防止 SQL 注入\nSQL 注入是一种常见的攻击手段，攻击者在数据库查询中插入恶意的 SQL 代码。为了防止这种情况，请使用预处理查询或参数转义。\n\
    \n### 使用预处理查询的示例 (MySQLi)\n```php\n<?php\n$connection = new mysqli(\"localhost\"\
    , \"user\", \"password\", \"basedededatos\");\n\nif ($conexion->connect_error)\
    \ {\n    die(\"Connection failed: \" . $connection->connect_error);\n}\n$user\
    \ = $_POST['user'];\n$password = $_POST['password'];\n// 使用预处理查询防止 SQL 注入\n$query\
    \ = $connection->prepare(\"SELECT * FROM users WHERE user=? AND password=?\");\n\
    $query->bind_param(\"ss\", $user, $password);\n$query->execute();\n$result = $query->get_result();\n\
    if ($result->num_rows > 0) {\n    // 身份验证通过\n    echo \"Welcome, $user!\";\n}\
    \ else {\n    // 凭据无效\n    echo \"Invalid credentials\";\n}\n$query->close();\n\
    $conexion->close();\n?>\n```\n\n### 用户数据验证与过滤\n确保对用户数据进行验证和过滤，以防止 XSS（跨站脚本攻击）。\n\
    \n### HTML 过滤示例 (htmlspecialchars)\n```php\n<?php\n$username = $_POST['username'];\n\
    // 过滤输入防止 XSS\n$username = htmlspecialchars($username, ENT_QUOTES, 'UTF-8');\n\
    echo \"Hello, $username!\";\n?>\n```\n\n### 防止 CSRF（跨站请求伪造）攻击\n使用 CSRF 令牌来防止攻击，即攻击者诱导用户代表其执行非想要的操作。\n\
    \n### 令牌生成与验证\n```php\n<?php\nsession_start();\nfunction generateToken() {\n \
    \   $token = bin2hex(random_bytes(32));\n    $_SESSION['csrf_token'] = $token;\n\
    \    return $token;\n}\nfunction verificarToken($token) {\n    return isset($_SESSION['csrf_token'])\
    \ && hash_equals($_SESSION['csrf_token'], $token);\n}\n// 在表单中生成令牌\n$token = generateToken();\n\
    ?>\n<form action=\"process_form.php\" method=\"post\">\n    <!-- 其他表单字段 -->\n\
    \    <input type=\"hidden\" name=\"csrf_token\" value=\"<?php echo $token; ?>\"\
    >\n    <button type=\"submit\">Enviar</button>\n</form>\n```\n\n在处理表单的脚本 (`process_form.php`)\
    \ 中，执行敏感操作之前验证令牌。\n```php\n<?php\nsession_start();\n$csrf_token = $_POST['csrf_token'];\n\
    if (verificarToken($csrf_token)) {\n    // 令牌有效，处理表单\n} else {\n    // 令牌无效，处理错误\n\
    }\n?>\n```\n\n### 实际练习\n- **防御 SQL 注入**：修改您应用程序中的现有查询以使用预处理查询。\n- **用户数据过滤**：在接收用户数据的表单上实现\
    \ HTML 过滤。\n- **CSRF 防御**：将 CSRF 令牌的生成和验证集成到应用程序的表单中。\n\n安全必须是重中之重。通过应用这些实践，您将加强\
    \ `PHP` 应用程序的安全性，并保护用户的敏感信息。\n\n## PHP 安全 - 防止常见攻击\n安全性是 Web 开发中至关重要的考虑因素。在本章中，我们将重点关注使用\
    \ `PHP` 时的基本安全实践。常见的攻击包括：SQL 注入、跨站脚本 (XSS) 和跨站请求伪造 (CSRF)。\n\n### SQL 注入\n实际示例：假设你有一个登录表单：\n\
    ```php\n<?php\nif ($_SERVER[\"REQUEST_METHOD\"] == \"POST\") {\n    $username\
    \ = $_POST[\"username\"];\n    $password = $_POST[\"password\"];\n    // 使用预处理\n\
    \    $sql = \"SELECT * FROM users WHERE username=? AND password=?\";\n    $stmt\
    \ = $conn->prepare($sql);\n    $stmt->bind_param(\"ss\", $username, $password);\n\
    \    $stmt->execute();\n    $result = $stmt->get_result();\n    if ($result->num_rows\
    \ > 0) {\n        echo \"Login success\";\n    } else {\n        echo \"Invalid\
    \ credentials\";\n    }\n}\n?>\n```\n\n### 跨站脚本 (XSS)\n实际示例：假设你的应用显示消息：\n```php\n\
    <?php\n$message = $_GET[\"message\"];\necho \"<p>$message</p>\";\n?>\n```\n为了防止此类攻击，使用\
    \ `htmlspecialchars`：\n```php\n<?php\n$message = $_GET[\"message\"];\necho \"\
    <p>\" . htmlspecialchars($message, ENT_QUOTES, \"UTF-8\") . \"</p>\";\n?>\n```\n\
    \n### 跨站请求伪造 (CSRF)\n实际示例：假设你的应用程序执行某操作：\n```php\n<?php\nif ($_GET[\"action\"\
    ] == \"perform\") {\n    // 执行操作\n}\n?>\n```\n为了防止此类攻击，在表单中使用 CSRF 令牌：\n```php\n\
    <?php\nsession_start();\nif (!isset($_SESSION['csrf_token'])) {\n    $_SESSION['csrf_token']\
    \ = bin2hex(random_bytes(32));\n}\n// 在表单中包含令牌\necho \"<form action='process_form.php'\
    \ method='post'>\";\necho \"<input type='hidden' name='csrf_token' value='{$SESSION['csrf_token']}'>\"\
    ;\necho \"<input type='submit' value='Enviar'>\";\necho \"</form>\";\n?>\n```\n\
    \n## PHP 中 Cookie 和 Session 的安全使用\n安全的 Cookie 和 Session 管理对于确保 Web 应用程序的安全至关重要。\n\
    \n### PHP 中的 Cookie\nCookie 是存储在用户浏览器中的小型信息。在 PHP 中，你可以使用 `$_COOKIE` 全局变量来处理 Cookie。\n\
    \n#### 实际示例\n设置 Cookie：\n```php\n<?php\n$name = \"user\";\n$value = \"John Doe\"\
    ;\n$expiry = time() + (86400 * 30); // 30 天\nsetcookie($name, $value, $expiry,\
    \ \"/\");\n?>\n```\n\n读取 Cookie：\n```php\n<?php\nif (isset($_COOKIE['user']))\
    \ {\n    $user = $_COOKIE['user'];\n    echo \"Welcome back, $user!\";\n} else\
    \ {\n    echo \"Welcome for the first time!\";\n}\n?>\n```\n\n### PHP 中的 Session\n\
    Session 允许在服务器上存储与特定用户关联的信息。在 PHP 中，Session 通过 `$_SESSION` 全局变量进行管理。\n\n#### 实际示例\n\
    登录：\n```php\n<?php\nsession_start();\n$_SESSION['user'] = \"John Doe\";\n$_SESSION['rol']\
    \ = \"admin\";\n?>\n```\n"
