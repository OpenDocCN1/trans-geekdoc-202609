    Secure Web Server Configuration


    Security is a top priority when configuring a web server to run PHP applications.
    In this chapter,we will explore Essential practices to strengthen the security
    of your web server and protect your applications against possible vulnerabilities.


    1\. Regular Software Update:


    Keeping your web server and other components up to date is essential to closing
    security gaps. Run the following commands periodically:


    Ubuntu (Linux):


    sudo apt update


    sudo apt upgrade


    2\. Firewall Configuration:


    Use a firewall to limit unauthorized traffic. Example using UFW:


    sudo ufw allow ssh


    sudo ufw allow http


    sudo ufw allow https


    sudo ufw enable


    3\. Disable Unnecessary Services:


    Disable any unused services or modules on your web server to reduce the attack
    surface.


    Apache:


    sudo a2dismod <module\_name>


    sudo systemctl restart apache2


    Nginx:


    sudo nano /etc/nginx/sites-available/default


    Within the server block, comment out or remove unused service lines.


    4\. PHP Configuration:


    Disable PHP Information:


    In the PHP configuration file (php.ini), configure the following:


    expose\_php = Off


    Security Parameter Configuration:


    Adjust important parameters in php.ini to improve security:


    allow\_url\_fopen = Off


    allow\_url\_include = Off


    Practical exercises:


    Software Update:


    Research how to update specific software on your operating system and perform
    an update.


    Firewall Configuration:


    Configure a firewall to allow SSH, HTTP, and HTTPS traffic. Verify that it is
    up and running.


    Disable Unnecessary Services:


    Investigate any additional services running on your server and disable one you
    don''t need. Restart the server and verify that the service is disabled.


    PHP configuration:


    Access your server''s php.ini file and make the necessary changes to disable PHP
    exposure and adjust security settings. Restart the web server.


    Best Practices and Tips


    In PHP application development, following good practices is crucial to keeping
    code readable, secure, and efficient. In this chapter,we will explore some best
    practices and tips that will help you improve the quality of your code.


    1\. Writing Clean and Readable Code:


    Use variable and function names descriptive.


    Apply consistent indentations and spacing.


    Divide the code into logical functions and classes.


    // Example of clean and readable code


    function calcularSuma($a, $b) {


        return $a + $b;


    }


    $result =calcularSuma(10, 5);


    echo "The sum is: " . $result;


    2\. Significant Comments:


    Document your code using meaningful comments.


    Explains the purpose of functions and key code sections.


    // Example of meaningful comments


    /\*\*


    \* Function to calculate the sum of two numbers.


    \*


    \* @param int $a Primer number


    \* @param int $b Second number


    \* @return int Sum of the two numbers


    \*/


    function calcularSuma($a, $b) {


        return $a + $b;


    }


    3\. Data Validation and Sanitization:


    Always Choose and sanitizes input data to prevent attacks.


    Use functions like filter\_var() to validate data.


    // Data validation example


    $mail = $\_POST\[''mail''\];


    if (filter\_var($email, FILTER\_VALIDATE\_EMAIL)) {


        // Process valid mail


    } else {


        //Handle invalid mail error


    }


    4\. Prevention of SQL Injections:


    Use prepared queries or escapes to prevent SQL injections.


    // Example of prepared query


    $name = $\_POST\[''name''\];


    $lastname = $\_POST\[''lastname''\];


    $stmt = $pdo->prepare("INSERT INTO users (first name, last name) VALUES (?, ?)");


    $stmt->execute(\[$firstname, $lastname\]);


    Practical exercises:


    Code Refactoring:


    Take a PHP script you''ve written before and make improvements to it in terms
    of readability and structure.


    Implement meaningful feedback.


    Form Validation:


    Improve the form you created in a previous chapter.


    Adds validation to ensure that the entered name is not empty.


    Security in SQL Queries:


    If you''ve worked with databases, review your SQL queries and make sure they are
    protected from SQL injections.


    Error Handling:


    Implement proper error handling in one of your scripts.


    Use try, catch, and finally to handle exceptions.


    By following these best practices, you will improve the quality and maintainability
    of your PHP code.


