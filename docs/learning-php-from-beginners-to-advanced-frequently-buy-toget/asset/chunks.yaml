    Scope of Variables in PHP


    One of the fundamental concepts in programming is the scope of variables. The
    scope determines where a variable can be accessed and modified. In PHP, there
    are two main types of scope: local scope and global scope. In this chapter,we
    will explore these concepts through practical examples and exercises.


    Local Scope:


    Variables declared within a function have local scope and are only accessible
    within that function.


    function exampleLocal() {


        $variableLocal = "This is a local variable.";


        echo $variableLocal;


    }


    // Function call


    exampleLocal();


    // This will generate an error, since$variableLocal is not defined outside the
    function


    echo $variableLocal;


    Global Scope:


    Variables declared outside any function have global scope and can be accessed
    from anywhere in the script.


    $variableGlobal = "This is a global variable.";


    function exampleGlobal() {


        // I can access the global variable from here


        global $variableGlobal;


        echo $variableGlobal;


    }


    // Function call


    exampleGlobal();


    // I can also access the global variable outside the function


    echo $variableGlobal;


    Practical exercises:


    Scope of Local Variables:


    Create a function called greeting that has a local variable called $message with
    the value "Hello from the function!".


    Print the value from $message inside the function.


    Call the function and see how the local scope affects the variable.


    Scope of Global Variables:


    Declare a global variable called $counter with an initial value of 0.


    Create a function calledincrementCounter which increments the value of $counter
    by 1.


    Call the function multiple times and display the updated value from $counter after
    each call.


    Static Variables:


    Modify the functionincrementCounter so that the variable $counter is static.


    Compare the behavior with the previous version and see how a static variable retains
    its value between function calls.


    Scope of Variables in Blocks:


    Declare a variable$outBlock outside of a conditional (if) block.


    Assign a different value to $outBlock inside and outside the block.


    Print the value of$outBlock after the conditional block and see how the scope
    affects the variable.


    Functions in PHP


    From predefined functions that simplify common tasks to creating custom functions
    to modularize your code, we''ll learn how to make our code more efficient and
    maintainable.


    Predefined Functions:


    PHP provides a wide variety of predefined functions that can be used to perform
    specific tasks. Let''s look at some examples:


    strlen() - Length of a String:


    $string = "Hello, world!";


    $length = strlen($string);


    echo "The length of the string is: $length";


    strtolower() - Convert to Lowercase:


    $text = "Hello, World!";


    $ lowercase = strtolower($text);


    echo "Lowercase:$ lowercase";


    date() - Get the Current Date:


    $current\_date = date("Y-m-d");


    echo "The current date is:$current\_date";


    Creating Custom Functions:


    Now, we will create our own functions to perform specific tasks and promote code
    reuse.


    Function to Add Two Numbers:


    function sumar($num1, $num2) {


        return $num1 + $num2;


    }


    $result = add(5, 3);


    echo "The sum is: $result";


    Function to Check Palindromes:


    function es\_palindrome($string) {


        $string = strtolower(str\_replace('' '', '''', $string));


        return $string == strrev($string);


    }


    $word = "bear";


    if (es\_palindrome($word)) {


        echo "$word is a palindrome";


    } else {


        echo "$word is not a palindrome";


    }


    Function with Optional Parameters:


    function greet($name, $greeting = "Hello") {


        echo "$greeting, $name!";


    }


    greet("John");


    // Exit:Hour, Juan!


    greet("Ana", "Hello");


    // Output: Hello, Ana!


