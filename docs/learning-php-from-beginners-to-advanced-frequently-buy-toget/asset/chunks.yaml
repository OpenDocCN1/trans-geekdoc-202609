    Arrays are essential for organizing and manipulating data efficiently in your
    web applications. Join me as we explore its syntax and functionality.


    Arrays in PHP:


    1\. Numerical Arrays:


    <?php


    // Declaration of a numeric array


    $numbers = array(1, 2, 3, 4, 5);


    // Access array elements


    echo $numbers\[0\]; // Output: 1


    echo $numbers\[2\]; // Output: 3


    // Modify an element of the array


    $numbers\[1\] = 10;


    // Add a new element to the end


    $numbers\[\] = 6;


    // Count elements in the array


    echo count($numbers); // Output: 6


    ?>


    2\. Associative Arrays:


    <?php


    // Declaration of an associative array


    $persona = array(


