    File Management in PHP


    File management is an essential part of any web application. In this chapter,we
    will explore how PHP makes it easy to read, write and manipulate files on the
    server. From creating files to manipulating their content, we will learn how to
    work efficiently with files in PHP.


    File Reading:


    PHP provides simple but powerful functions for reading file content. Let''s look
    at a practical example:


    Example 1: Reading a Text File


    <?php


    // File name


    $filename = ''example.txt'';


    // Reading file content


    $content = file\_get\_contents($filename);


    // Print the content


    echo $content;


    ?>


    Writing to Files:


    Writing to files is equally simple. You can open a file in write mode and add
    or rewrite content.


    Example 2: Writing to a Text File


    <?php


    // File name


    $filename = ''new\_file.txt'';


    // Content to write


    $content = "This is a new file.\\nHello, World!";


    // Opening the file in writing mode


    $file = fopen($filename, ''w'');


    // Write to file


    fwrite($file, $content);


    // File closure


    fclose($file);


    echo "File created and content written successfully.";


    ?>


    File and Directory Manipulation:


    PHP offers functions for manipulating files and directories, such as creation,
    deletion, and existence checking.


    Example 3: Creating a Directory and a File


    <?php


    // Directory name


    $directoryname = ''my\_directory'';


    // Directory creation


    mkdir($directoryname);


    // Name of the file inside the directory


    $filename =$directoryname . ''/archivo.txt'';


    // Content to write to the file


    $content = "Content in the new file.";


    // Opening the file in writing mode


    $file = fopen($filename, ''w'');


    // Write to file


    fwrite($file, $content);


    // File closure


    fclose($file);


    echo "Directory and file created successfully.";


    ?>


    Practical exercises:


    Reading and Viewing:


    Create a text file with several paragraphs.


    Write a PHP script that reads and displays the contents of that file.


    File Concatenation:


    Create two different text files.


    Write a PHP script that reads both files and creates a third file containing the
    contents of both.


    Deleting Files and Directories:


    Use PHP functions to delete the file and directory created in Example 3.


    These exercises will help you understand file handling in PHP and how you can
    apply it to real-world situations in web development.


    Reading and Writing Files in PHP


    An essential part of web development is file manipulation. In this chapter,we
    will explore how PHP makes it easy to read and write data to files, which is crucial
    for tasks like storing settings, logging, and manipulating content.


    Reading Files in PHP:


    The file\_get\_contents function allows you to read the entire contents of a file
    into a string.


    <?php


    // Path to file


    $file\_path = "file.txt";


    // Read the content of the file


    $content = file\_get\_contents($file\_path);


    // Print the content


    echo $content;


    ?>


    Writing Files in PHP:


    To write to a file, you can use the functionfile\_put\_contents or manually open
    and close the file.


    Usando file\_put\_contents:


    <?php


    // Path to file


    $file\_path = "file.txt";


    // Content to write to the file


    $content = "Hello, this is new content.";


    // Write to file


    file\_put\_contents($file\_path, $content);


    ?>


    Using Manual Opening and Closing:


    <?php


    // Path to file


    $file\_path = "file.txt";


    // Content to write to the file


    $content = "Hello, this is new content.";


    // Open the file in writing mode


    $file = fopen($file\_path, "w");


    // Write to file


    fwrite($file, $content);


    // Close the file


    fclose($file);


    ?>


    Practical exercises:


    Access Log:


    Create a file called log.txt.


    It uses the current date and time along with the user''s IP address to log each
    file access.


    Each entry should be on a new line.


    Update Settings:


    Create a config.txt file with some key configurations in key-value format.


    Write a script that reads the file, updates a configuration, and then writes the
    changes back to the file.


    Database Backup (Optional):


    If you have set up a database, write a script that backs up the database and saves
    it to a file.


    Image File Management:


    Allows users to upload images.


    Saves images to a specific directory and logs the details (file name, upload date)
    to a log file.


    These exercises will help you understand how to read and write files in PHP, crucial
    skills for managing data in web applications.


    Directory Manipulation in PHP


    Directory manipulation is an essential part of web development, especially when
    working with file management and resource organization. In this chapter,we will
    explore how PHP allows us to interact with directories, create new ones, read
    their contents and perform useful operations.


    Creation of a Directory:


    <?php


    $directoryname = "new\_directory";


    if (!is\_dir($directoryname)) {


        mkdir($directoryname);


        echo "Directory created successfully.";


    } else {


        echo "The directory already exists.";


    }


    ?>


    This example checks to see if the directory exists before attempting to create
    it. The mkdir() function is used to create a new directory.


    Listing Files in a Directory:


    <?php


    $directory = "./";


    $files = scandir($directory);


    foreach ($files as $file) {


        echo $file . "<br>";


    }


    ?>


    The scandir() function is used to get a list of files and directories in a specific
    directory. Then we iterate over the list and print the file names.


    Deletion of a Directory and its Content:


    <?php


    $directorioARemoval = "directory\_to\_delete";


    if (is\_dir($directorioARemoval)) {


        // Delete files and subdirectories before deleting the parent directory


        array\_map(''unlink'', glob("$directorioAEliminar/\*.\*"));


        is rm($directorioARemoval);


        echo "Directory deleted successfully.";


    } else {


        echo "The directory does not exist.";


    }


    ?>


    This example first deletes all files and subdirectories within the directory to
    be deleted using glob() and unlink(). Then, use rmdir() to remove the parent directory.


    Practical exercises:


    Dynamic Directory Creation:


    Create a script that prompts the user for a name for a new directory.


    Uses user input to create a new directory.


    List of Files with Details:


    Modify the file listing script to include details such as size and modification
    date.


    Copy of a Directory:


    Create a new directory called "directory\_copy".


    Copy all files and subdirectories from the main directory to the new directory.


    Secure Deletion:


    Improve the deletion script to ask for confirmation before deleting a directory.


    Make sure the user confirms the deletion before proceeding.


    File Upload in PHP


    The ability to allow users to upload files is essential in many web applications.
    In this chapter,we will explore how to implement file uploads in PHP, making sure
    to handle it safely and efficiently.


    Basic File Upload:


    Form HTML:


    <!-- form\_file.html -->


    <form action="process\_upload.php" method="post" enctype="multipart/form-data">


        <label for="file">Select a file:</label>


        <input type="file" name="archivo" id="archivo">


        <input type="submit" value="Subir Archivo">


    </form>


    PHP to Process the Upload:


    <!-- process\_upload.php -->


    <?php


    if ($\_SERVER\["REQUEST\_METHOD"\] == "POST") {


        $filename = $\_FILES\["file"\]\["name"\];


        $rutaTemporal = $\_FILES\["archivo"\]\["tmp\_name"\];


        $routeDestination = "files/$filename";


        if (move\_uploaded\_file($rutaTemporal, $routeDestination)) {


            echo "File uploaded successfully!";


        } else {


            echo "Error uploading file.";


        }


    }


