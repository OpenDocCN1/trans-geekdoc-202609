    \ in the form fields in case of validation errors.\n- **Saved to a File**: Modify\
    \ the PHP script to save the data to a text file or database.\n- **CSRF Security**:\
    \ Research and apply basic measures to prevent CSRF attacks on your form.\n\n\
    ## Server-Side Form Validation\n\nForm validation is a critical part of web development\
    \ to ensure that data provided by users is correct and secure. In this chapter,\
    \ we will focus on how to validate forms on the server side.\n\n### Practical\
    \ Example: Registration Form\n\nLet's consider a registration form with fields\
    \ such as username, email, and password. Let's implement server-side validation.\n\
    \n#### Form (registration.html):\n\n```html\n<!DOCTYPE html>\n<html lang=\"es\"\
    >\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"\
    width=device-width, initial-scale=1.0\">\n    <title>Registration Form</title>\n\
    </head>\n<body>\n    <h1>User Registration</h1>\n    <form action=\"process_registration.php\"\
    \ method=\"post\">\n        <label for=\"username\">Username:</label>\n      \
    \  <input type=\"text\" id=\"username\" name=\"username\" required>\n        <label\
    \ for=\"email\">Email:</label>\n        <input type=\"email\" id=\"email\" name=\"\
    email\" required>\n        <label for=\"password\">Contraseña:</label>\n     \
    \   <input type=\"password\" id=\"password\" name=\"password\" required>\n   \
    \     <input type=\"submit\" value=\"Registrar\">\n    </form>\n</body>\n</html>\n\
    ```\n\n#### PHP to Process Registry (process_registration.php):\n\n```php\n<?php\n\
    if ($_SERVER[\"REQUEST_METHOD\"] == \"POST\") {\n    // Retrieve form data\n \
    \   $username = htmlspecialchars($_POST[\"username\"]);\n    $email = htmlspecialchars($_POST[\"\
    email\"]);\n    $password = htmlspecialchars($_POST[\"password\"]);\n    // Validate\
    \ data\n    $errors = array();\n    if (empty($username)) {\n        $errors[]\
    \ = \"The username is required.\";\n    }\n    if (!filter_var($email, FILTER_VALIDATE_EMAIL))\
    \ {\n        $errors[] = \"Please enter a valid email.\";\n    }\n    if (empty($password))\
    \ {\n        $errors[] = \"The password is required.\";\n    }\n    // Show errors\
    \ or process the log\n    if (!empty($errors)) {\n        foreach ($errors as\
    \ $error) {\n            echo \"<p>Error: $error</p>\";\n        }\n    } else\
    \ {\n        // Process the registration in the database or other necessary actions\n\
    \        echo \"<p>Successful registration. Welcome, $username!</p>\";\n    }\n\
    }\n?>\n```\n\n### Practical exercises:\n\n- **Add Additional Validation**: Improve\
    \ validation by adding specific rules, such as minimum and maximum length for\
    \ username and password.\n- **Validate Other Types of Fields**: Add fields to\
    \ the form.\n- **Improve User Experience**: Improve the appearance of the form\
    \ using CSS sheets. Add classes and styles to improve visual presentation.\n-\
    \ **Connect to Database (Optional)**: If you have set up a database, adapt the\
    \ script to store form information in the database.\n\n## PHP Security - Preventing\
    \ CSRF and XSS\n\nSecurity is a fundamental consideration in web development.\
    \ In this chapter, we will focus on two types of attacks: CSRF (Cross-Site Request\
    \ Forgery) and XSS (Cross-Site Scripting). We will learn how to prevent them and\
    \ secure our PHP applications.\n\n### CSRF Attack Prevention\n\n#### What is CSRF?\n\
    CSRF occurs when an attacker tricks the user's browser into performing unwanted\
    \ actions in an application in which the user is authenticated.\n\n#### Prevention\
    \ - Token CSRF:\nGenerate a unique token on each form. When processing the form,\
    \ it verifies that the token is valid.\n\n```php\n<?php\nsession_start();\nfunction\
    \ generarTokenCSRF() {\n    $token = bin2hex(random_bytes(32));\n    $_SESSION['csrf_token']\
    \ = $token;\n    return $token;\n}\n\nfunction validarTokenCSRF($token) {\n  \
    \  return isset($_SESSION['csrf_token']) && hash_equals($_SESSION['csrf_token'],\
    \ $token);\n}\n\n// In the form\n?>\n<?php\n$token = generarTokenCSRF();\n?>\n\
    <form action=\"process_form.php\" method=\"post\">\n    <input type=\"hidden\"\
    \ name=\"csrf_token\" value=\"<?php echo $token; ?>\">\n    <!-- Other form fields\
    \ -->\n    <button type=\"submit\">Enviar</button>\n</form>\n```\n\n#### In process_form.php:\n\
    \n```php\n<?php\nsession_start();\n$token = $_POST['csrf_token'];\nif (validarTokenCSRF($token))\
    \ {\n    // Process form\n} else {\n    // Invalid CSRF token, handle error\n\
    }\n?>\n```\n\n### XSS Attack Prevention\n\n#### What is XSS?\nXSS occurs when\
    \ an attacker inserts malicious scripts into web pages viewed by other users.\n\
    \n#### Prevention - Filtering and Validation:\nFilters and validates all user\
    \ input. Use functions like `htmlspecialchars()` to escape data before displaying\
    \ it.\n\n```php\n<?php\n// Filter user data\n$name = htmlspecialchars($_POST['name']);\n\
    $comment = htmlspecialchars($_POST['comment']);\n//Show data on the page\necho\
    \ \"Name: $name <br>\";\necho \"Comment: $comment\";\n?>\n```\n\n#### Prevention\
    \ - Content Security Policy (CSP):\nSet up a content security policy to restrict\
    \ the origin of resources loaded on your page.\n\n```php\n<?php\n//Set the content\
    \ security policy in the header\nheader(\"Content-Security-Policy: default-src\
    \ 'self'\");\n?>\n```\n\n### Practical exercises:\nImplement CSRF Token:\nThe\
    \ initial code snippet found at the beginning of the original text:\n```php\n\
    if (empty($nombre) || empty($email)) {\n    echo \"All fields are required.\"\
    ;\n} else {\n    // Perform actions with the data (save to the database, send\
    \ mail, etc.)\n    echo \"Hello,$name! Your email is $email.\";\n}\n```\n"
  trans: "\n\n# 用户数据收集\n\n任何 Web 应用的核心部分都是收集用户数据的能力。在本章中，我们将探索如何与 HTML 表单交互，并使用 PHP\
    \ 处理用户输入。\n\n## HTML 表单\n\n### 实例示例：\n\n```html\n<!-- form.html -->\n<!DOCTYPE\
    \ html>\n<html lang=\"es\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"\
