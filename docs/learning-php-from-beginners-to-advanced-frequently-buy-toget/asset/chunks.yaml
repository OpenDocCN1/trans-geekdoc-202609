- raw: 'Set up a connection to the database in Symfony.


    Creates an entity and performs basic CRUD operations.


    Customizing Views in Twig (Symfony):


    Customize views in Symfony using the Twig templating engine.


    Add dynamic content to your views.


    Using Middleware in Laravel:


    Explore the use of middleware in Laravel.


    Create a custom middleware and apply it to a route.


    These exercises will allow you to become familiar with the structure and characteristics
    of PHP frameworks. Explore its documentations to discover more functionality and
    potential.


    Introduction to Popular Frameworks


    (Laravel, Symfony, CodeIgniter)


    In this chapter,we will explore the introduction to some of the most popular PHP
    frameworks: Laravel, Symfony and CodeIgniter. These frameworks provide an organized
    structure, predefined functions and design patterns that facilitate fast and efficient
    development of web applications.


    1\. Laravel:


    What is Laravel?


    Laravel is an elegant and expressive framework that favors clear syntax and rapid
    development. It uses the MVC (Model-View-Controller) architecture pattern to organize
    code efficiently.


    Practical example:


    Laravel installation:


    Use Composer to install Laravel:


    composer create-project --prefer-dist laravel/laravel Project name


    Access the project: cdProject name.


    Run the built-in Laravel server: php artisan serve.


    Creating a Route and View:


    Define a route in the routes/web.php file:


    php


    Copy code


    Route::get(''/saludo'', function () {


        return view(''greeting'', \[''name'' => ''User''\]);


    });


    Create a view in resources/views/saludo.blade.php:


    <h1>Hello, {{ $name }}.</h1>


    Using Eloquent (ORM):


    Define a model using Eloquent to interact with the database:


    php artisan make:model Usuario


    Perform database queries with Eloquent.


    2\. Symfony:


    What is Symfony?


    Symfony is a robust and modular PHP framework that uses reusable components. It
    adopts the component-based development approach and follows the MVC pattern.


    Practical example:


    Symfony installation:


    Use Composer to create a new Symfony project:


    composer create-project symfony/skeleton Project name


    Access the project: cdProject name.


    Start the embedded web server: symfony server:start.


    Creating a Route and Controller:


    Define a route in src/Controller/DefaultController.php:


    /\*\*


    \* @Route("/greeting", name="greeting")


    \*/


    public function saludo(): Response {


        return $this->render(''greeting.html.twig'', \[''name'' => ''User''\]);


    }


    Create a Twig template in templates/greeting.html.twig:


    <h1>Hello, {{ name }}.</h1>


    Doctrine Usage (ORM):


    Define an entity with Doctrine:


    bin/console make:entity Usuario


    Use Doctrine to interact with the database.


    3\. CodeIgniter:


    What is CodeIgniter?


    CodeIgniter is a lightweight, easy-to-use framework that focuses on simplicity
    and performance. It is perfect for small and medium-sized projects where the overhead
    of other frameworks could be excessive.


    Practical example:


    Download and Install CodeIgniter:


    Download CodeIgniter from the official website.


    Unzip the file and configure the database inapplication/config/database.php.


    Creating a Controller and View:


    Create a controller inapplication/controllers/Saludo.php:


    class Saludo extends CI\_Controller {


        public function index() {


            $data\[''name''\] = ''User'';


            $this->load->view(''saludo'', $data);


        }


    }


    Create a view in application/views/saludo.php:


    <h1>Hello, <?php echo $name; ?>.</h1>


    Use ofModel:


    Create a model in application/models/Usuario\_model.php.


    Use the model to interact with the database.


    Practical exercises:


    Creation of a CRUD (Symfony or Laravel):


    Use Symfony or Laravel to create a basic CRUD (Create, Read, Update, Delete) for
    an entity of your choice.


    Development of a Simple Blog (CodeIgniter):


    Use CodeIgniter to develop a simple blog with basic functions such as creating,
    reading, updating and deleting posts.


    These practical examples and exercises will give you a solid introduction to these
    popular frameworks and allow you to start developing web applications more efficiently.


    PHP Benefits and Use Cases


    In this chapter,we will explore the many benefits that PHP offers developers and
    we will review some common use cases where PHP shines.


    PHP Benefits:


    Simplicity and Ease of Learning:


    PHP has an easy-to-understand syntax and is accessible to beginners.


    The learning curve is gentle, allowing developers to start building web applications
    quickly.


    Wide Compatibility:


    PHP is compatible with a variety of operating systems, web servers, and databases,
    giving developers great flexibility in choosing their development environment.


    Integration with HTML:


    PHP''s natural integration with HTML makes it easy to create dynamic web pages
    and combine static and dynamic content.


    Database Support:


    PHP offers extensive compatibility with database management systems, such as MySQL,
    PostgreSQL, and SQLite, making it easy to create applications that require data
    storage.


    Great Community and Resources:


    The PHP community is active and generous in terms of resources. There are numerous
    tutorials, forums, and libraries that make development and troubleshooting easier.


    Powerful Frameworks:


    The existence of frameworks such as Laravel, Symfony and CodeIgniter streamline
    development and promote best practices in creating web applications.


    Common Use Cases:


    Rapid Web Page Development:


    PHP is ideal for quickly creating web pages, especially when you need to interact
    with databases and process forms.


    Content Management Systems (CMS):


    Many popular CMS, such as WordPress and Joomla, are built in PHP. This makes it
    easy to customize and extend websites.


    Electronic Commerce Applications:


    PHP is commonly used in the development of e-commerce platforms due to its ability
    to manage transactions and connect to databases efficiently.


    APIs and Web Services:


    PHP can be used to build APIs and web services, providing an efficient way to
    connect applications and share data.


    Business Applications:


    With the use of frameworks such as Laravel, PHP has become a robust option for
    the development of business applications, offering security and scalability.


    Practical exercises:


    Creation of a Dynamic Web Page:


    Use PHP to create a dynamic web page that displays information from a database.


    Development of a Module for CMS:


    Extend a content management system (such as WordPress) by creating a custom module
    using PHP.


    Implementation of a Simple API:


    Build a simple API in PHP that can be consumed by other applications.


    Development of a Basic E-Commerce Application:


    Create a simple e-commerce app that allows users to view products and make purchases.


    These exercises will allow you to experiment with different use cases and appreciate
    the versatility of PHP in developing a variety of web applications.


    Practical Projects


    Project 1: User Registration System


    Description:


    Creates a user registration system that allows visitors to register, log in and
    view their profile.


    Functionalities:


    Registration form with field validation.


    Login with authentication.


    Profile page for each user.


    Exercises:


    Security Improvements:


    Implement strong passwords through the use of hashes.


    Apply measures against brute force attacks.


    Sending Confirmation by Email:


    Send a confirmation email after registration.


    Enable email verification before allowing login.


    Project 2: Task Management System


    Description:


    Develop a simple task management application that allows users to create, update
    and delete tasks.


    Functionalities:


    Create, read, update and delete tasks.


    Mark tasks as completed.


    Filter tasks by status (pending or completed).


    Exercises:


    Task Priorities:


    Adds the ability to assign priorities to tasks.


    Implement a filter to display tasks based on priority.


    Due date:


    Allows users to set due dates for tasks.


    Implement a feature that highlights upcoming tasks.


    Project 3: Mini Social Network


