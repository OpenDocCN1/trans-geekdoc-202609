    \ method=\"post\">\n        <label for=\"name\">Name:</label>\n        <input\
    \ type=\"text\" id=\"nombre\" name=\"nombre\" required>\n        <label for=\"\
    email\">Email:</label>\n        <input type=\"email\" id=\"email\" name=\"email\"\
    \ required>\n        <input type=\"submit\" value=\"Enviar\">\n    </form>\n</body>\n\
    </html>\n```\n\n### 在 PHP 中处理\n\n### 实例示例：\n\n```php\n<!-- process_form.php -->\n\
    <?php\nif ($_SERVER[\"REQUEST_METHOD\"] == \"POST\") {\n    // Collect 表单数据\n\
    \    $name = $_POST[\"name\"];\n    $email = $_POST[\"email\"];\n    // 验证数据（你可以根据需要添加更多验证逻辑）\n\
    \    // 处理数据（存储到数据库、发送邮件等）\n    $message = \"Hello $name, thank you for sending\
    \ your email: $email\";\n    // 显示成功消息\n    echo $message;\n} else {\n    // 如果有人尝试直接访问此脚本，则重定向\n\
    \    header(\"Location: formulario.html\");\n    exit();\n}\n?>\n```\n\n### 实际练习题：\n\
    \n修改 HTML 表单以包含更多字段，例如“年龄（Age）”和“消息（Message）”。更新 PHP 脚本处理并显示这些新字段。\n- **数据验证**：在\
    \ PHP 脚本中添加验证，以确保邮箱格式有效且年龄为整数。如果验证失败，显示特定的错误信息。\n- **数据持久化**：在提交表单后，让用户输入的数据保留在表单字段中，以防出现验证错误。\n\
    - **保存到文件**：修改 PHP 脚本将数据保存到文本文件或数据库。\n- **CSRF 安全**：研究并应用基础措施来防止你的表单遭受 CSRF 攻击。\n\
    \n## 服务端表单验证\n\n表单验证是 Web 开发中的关键部分，用于确保用户提供的数据正确且安全。在本章中，我们将重点关注如何在服务器端验证表单。\n\
    \n### 实例示例：注册表单\n\n让我们考虑一个包含用户名、邮箱和密码字段的注册表单。让我们实现服务器端验证。\n\n#### 表单 (registration.html)：\n\
    \n```html\n<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n    <meta charset=\"UTF-8\"\
    >\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
    >\n    <title>Registration Form</title>\n</head>\n<body>\n    <h1>User Registration</h1>\n\
    \    <form action=\"process_registration.php\" method=\"post\">\n        <label\
    \ for=\"username\">Username:</label>\n        <input type=\"text\" id=\"username\"\
    \ name=\"username\" required>\n        <label for=\"email\">Email:</label>\n \
    \       <input type=\"email\" id=\"email\" name=\"email\" required>\n        <label\
    \ for=\"password\">Contraseña:</label>\n        <input type=\"password\" id=\"\
    password\" name=\"password\" required>\n        <input type=\"submit\" value=\"\
    Registrar\">\n    </form>\n</body>\n</html>\n```\n\n#### PHP 处理注册 (process_registration.php)：\n\
    \n```php\n<?php\nif ($_SERVER[\"REQUEST_METHOD\"] == \"POST\") {\n    // 获取表单数据\n\
    \    $username = htmlspecialchars($_POST[\"username\"]);\n    $email = htmlspecialchars($_POST[\"\
    email\"]);\n    $password = htmlspecialchars($_POST[\"password\"]);\n    // 验证数据\n\
    \    $errors = array();\n    if (empty($username)) {\n        $errors[] = \"The\
    \ username is required.\";\n    }\n    if (!filter_var($email, FILTER_VALIDATE_EMAIL))\
    \ {\n        $errors[] = \"Please enter a valid email.\";\n    }\n    if (empty($password))\
    \ {\n        $errors[] = \"The password is required.\";\n    }\n    // 显示错误或处理日志\n\
    \    if (!empty($errors)) {\n        foreach ($errors as $error) {\n         \
    \   echo \"<p>Error: $error</p>\";\n        }\n    } else {\n        // 在数据库中处理注册或其他必要的操作\n\
    \        echo \"<p>Successful registration. Welcome, $username!</p>\";\n    }\n\
    }\n?>\n```\n\n### 实际练习题：\n\n- **添加额外验证**：通过添加特定规则改进验证，例如用户名和密码的最小和最大长度。\n- **验证其他类型的字段**：向表单添加字段。\n\
    - **提升用户体验**：使用 CSS 表格改进表单的外观。添加类和样式来改进视觉呈现。\n- **连接数据库（可选）**：如果你已设置数据库，请调整脚本将表单信息存储在数据库中。\n\
    \n## PHP 安全 - 防止 CSRF 和 XSS\n\n安全是 Web 开发中的基础考虑因素。在本章中，我们将关注两种类型的攻击：CSRF（跨站请求伪造）和\
    \ XSS（跨站脚本）。我们将学习如何防止它们并确保我们的 PHP 应用的安全。\n\n### CSRF 攻击防护\n\n#### 什么是 CSRF？\n\
    CSRF 发生在攻击者欺骗用户浏览器在用户已认证的应用程序中执行违愿操作时。\n\n#### 防护 - CSRF 令牌：\n在每个表单上生成一个唯一的令牌。在处理表单时，验证该令牌是否有效。\n\
    \n```php\n<?php\nsession_start();\nfunction generarTokenCSRF() {\n    $token =\
    \ bin2hex(random_bytes(32));\n    $_SESSION['csrf_token'] = $token;\n    return\
    \ $token;\n}\n\nfunction validarTokenCSRF($token) {\n    return isset($_SESSION['csrf_token'])\
    \ && hash_equals($_SESSION['csrf_token'], $token);\n}\n\n// 在表单中\n?>\n<?php\n\
    $token = generarTokenCSRF();\n?>\n<form action=\"process_form.php\" method=\"\
    post\">\n    <input type=\"hidden\" name=\"csrf_token\" value=\"<?php echo $token;\
    \ ?>\">\n    <!-- 其他表单字段 -->\n    <button type=\"submit\">Enviar</button>\n</form>\n\
    ```\n\n#### 在 process_form.php 中：\n\n```php\n<?php\nsession_start();\n$token =\
    \ $_POST['csrf_token'];\nif (validarTokenCSRF($token)) {\n    // 处理表单\n} else\
    \ {\n    // CSRF 令牌无效，处理错误\n}\n?>\n```\n\n### XSS 攻击防护\n\n#### 什么是 XSS？\nXSS 发生在攻击者将恶意脚本注入其他用户查看的网页时。\n\
    \n#### 防护 - 过滤与验证：\n过滤并验证所有用户输入。在显示数据之前使用 `htmlspecialchars()` 等函数进行转义。\n\n```php\n\
    <?php\n// 过滤用户数据\n$name = htmlspecialchars($_POST['name']);\n$comment = htmlspecialchars($_POST['comment']);\n\
    // 在页面上显示数据\necho \"Name: $name <br>\";\necho \"Comment: $comment\";\n?>\n```\n\
    \n#### 防护 - 内容安全策略 (CSP)：\n设置内容安全策略来限制加载资源的来源。\n\n```php\n<?php\n// 在头部中设置内容安全策略\n\
    header(\"Content-Security-Policy: default-src 'self'\");\n?>\n```\n\n### 实际练习：\n\
    实现 CSRF 令牌：\n原文开头的代码片段：\n```php\nif (empty($nombre) || empty($email)) {\n    echo\
    \ \"All fields are required.\";\n} else {\n    // 对数据执行操作（保存到数据库、发送邮件等）\n    echo\
    \ \"Hello,$name! Your email is $email.\";\n}\n```\n\n"
