    Practical exercises:


    Hello PHP World:


    Create a file called hello.php.


    Write the following code:


    <?php


    echo "Hello, World!";


    ?>


    Open your browser and access http://localhost/hola.php. You should see the greeting.


    Variables and Operators:


    Create a new file called operations.php.


    It defines two variables, $num1 and $num2, and performs basic operations such
    as addition, subtraction, multiplication, and division.


    Print the results.


    Simple Form:


    Create an HTML form that asks the user for their name.


    When you submit the form, it processes the data in a PHP script and prints a welcome
    message.


    Connection to the Database (Optional):


    If you have set up a database, create a connection from PHP and run a simple query.


    These exercises will help you become familiar with installing and configuring
    the environment, as well as basic PHP concepts.


    Basic PHP Syntax


    In this chapter, we explore the fundamental syntax of PHP, from declaring variables
    to creating control structures. These concepts form the foundation on which we
    will build more complex applications in later chapters.


    Declaration of variables:


    In PHP, variables are declared with the $ symbol. They are case sensitive.


    <?php


    $name = "John";


    $age = 25;


    ?>


    Type of data:


    PHP is a weakly typed language, meaning that it is not necessary to explicitly
    declare the type of a variable. Types include string (string), integer (int),
    float (float),boolean (bool), and more.


    <?php


    $name = "John"; // string


    $age = 25; // int


    $height = 1.75; // float


    $is\_student = true; // bool


    ?>


    Operators:


    PHP supports a variety of operators to perform arithmetic, comparison, and logical
    operations.


    <?php


    $a = 10;


    $b = 5;


    // Arithmetic operators


    $sum = $a + $b;


    $remain = $a - $b;


    $product = $a \* $b;


    $division = $a / $b;


    // Comparison operators


    $equal = ($a == $b);


    $different = ($a != $b);


    $greater\_than = ($a > $b);


    // Logical operators


    $and = ($a > 0) && ($b > 0);


    $or = ($a > 0) || ($b > 0);


    $not = !($a > 0);


    ?>


    Control Structures:


    Conditionals (if, else, elseif):


    <?php


    $age = 18;


    if ($age < 18) {


        echo "You are a minor.";


    } elseif ($age >= 18 && $age < 65) {


        echo "You are of legal age but not retired.";


    } else {


        echo "You are retired.";


    }


    ?>


    Bucles (for, while, do-while):


    <?php


    // Bucle for


    for ($i = 1; $i <= 5; $i++) {


        echo $i . " ";


    }


    // Bucle while


    $j = 1;


    while ($j <= 5) {


        echo $j . " ";


        $j++;


    }


    // Bucle do-while


    $k = 1;


    do {


        echo $k . " ";


        $k++;


    } while ($k <= 5);


    ?>


    Practical exercises:


    Simple Calculator:


    Creates an HTML form with two numerical input fields and a drop-down menu to select
    an operation (addition, subtraction, multiplication, division).


    When you submit the form, it processes the data in a PHP script and displays the
    result of the operation.


    Verification of Even Numbers:


    Write a PHP script that prints the numbers 1 to 10, indicating whether each number
    is even or odd.


    Multiplication table:


    Use a for loop to generate the multiplication table for 5 (1 to 10).


    Calculation of Body Mass Index (BMI):


    Create a form that requests a person''s height and weight.


    Calculate BMI (weight/height^2) in a PHP script and shows the ranking based on
    the result.


    These exercises will allow you to apply the concepts of basic PHP syntax.


    Variables and Data Types in PHP


    In PHP, variables are containers that store information. Before delving into more
    advanced features, it is essential to understand how to work with variables and
    the various data types that PHP supports. Let''s dive into this essential aspect!


    Variables in PHP:


    Variables in PHP are defined with the $ symbol, followed by the variable name.
    PHP is weakly typed, meaning you don''t need to explicitly declare the data type
    when creating a variable.


    Let''s look at some examples:


    <?php


    // Definition of variables


    $name = "John";


    $age = 25;


    $price = 15.99;


    $is\_student = true;


    // Printing variables


    echo "Name: $name<br>";


    echo "Age: $age<br>";


    echo "Price: $price<br>";


    echo "He is a student? " . ($is\_student ? ''But'') . "<br>";


    ?>


    Data Types in PHP:


    PHP supports several data types, including:


    Integers (int): Whole numbers without a decimal point.


    Decimals (float): Numbers with a decimal point.


    Strings (string): Sequences of characters.


    Boolean (bool): Represents true or false values.


    Practical exercises:


    Operations with Variables:


    Create a script that performs basic math operations with two numeric variables
    and prints the results.


    Example: addition, subtraction, multiplication, division.


    String Concatenation:


    Create three variables containing your first name, last name, and age.


    Concatenate these variables to print a message like "Hello, \[first name\] \[last
    name\], you are \[age\] years old."


    Type Conversion:


    Declare a numeric variable.


    Convert it to string and then to boolean.


    Print the results and verify the changes.


    Handling of Booleans:


    Declares two boolean variables that they represent the state of a lamp and a door.


    Prints messages indicating if the lamp is on and if the door is open.


    These exercises will help you practice using variables and understand how to work
    with different data types in PHP.


    Operators in PHP


    In this chapter,we will explore the world of PHP operators. Operators are essential
    tools for performing operations on variables and values, from simple arithmetic
    operations to comparisons and bit manipulations.


