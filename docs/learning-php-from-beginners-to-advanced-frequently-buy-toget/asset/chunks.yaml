    \ $b);\n$different = ($a != $b);\n$greater_than = ($a > $b);\n\n// 逻辑运算符\n$and\
    \ = ($a > 0) && ($b > 0);\n$or = ($a > 0) || ($b > 0);\n$not = !($a > 0);\n?>\n\
    ```\n\n## 控制结构\n\n### 条件判断 (if, else, elseif)\n```php\n<?php\n$age = 18;\nif ($age\
    \ < 18) {\n    echo \"你还是未成年人\";\n} elseif ($age >= 18 && $age < 65) {\n    echo\
