  trans: "\n\n提示用户输入两个字符串，并使用比较运算符来判断它们是否相等。\n\n这些练习将帮助你理解并应用 PHP 中的运算符。\n\n# 控制结构\
    \ (if, else, switch)\n\n在本章中，我们将深入沉浸在 PHP 的控制结构中，这些结构允许我们能够在程序中做出决策并执行条件动作。我们将学习\
    \ `if`、`else` 和 `switch` 语句，以及如何使用它们来控制代码的执行流。\n\n### if 语句\n\n`if` 语句允许我们在条件为真时执行一段代码块。如果条件为假，则该代码块不会被执行。\n\
    \n```php\n<?php\n$age = 25;\nif ($age >= 18) {\n    echo \"You are of legal age.\"\
    ;\n}\n?>\n```\n\n### else 语句\n\n`else` 语句允许我们在 `if` 语句中的条件为假时执行一段代码块。\n\n```php\n\
    <?php\n$age = 15;\nif ($age >= 18) {\n    echo \"You are of legal age.\";\n} else\
    \ {\n    echo \"You are a minor.\";\n}\n?>\n```\n\n### elseif 语句\n\n`elseif` 语句允许我们顺序评估多个条件。\n\
    \n```php\n<?php\n$use = 85;\nif ($nota >= 90) {\n    echo \"Excellent.\";\n} elseif\
    \ ($note >= 70) {\n    echo \"Good job.\";\n} else {\n    echo \"You need to improve.\"\
    ;\n}\n?>\n```\n\n### switch 语句\n\n`switch` 语句允许我们将一个表达式与多个可能的值进行比较，并根据匹配结果执行代码。\n\
    \n```php\n<?php\n$day = \"Monday\";\nswitch ($dia) {\n    case \"Monday\":\n \
    \       echo \"Beginning of the week.\";\n        break;\n    case \"Friday\"\
    :\n        echo \"Friday, finally!\";\n        break;\n    default:\n        echo\
    \ \"Common day.\";\n}\n?>\n```\n\n## 实际练习\n\n**偶数验证器：**\n- 创建一个程序，接收一个数字作为变量。\n\
    - 使用 `if` 结构判断数字是偶数还是奇数。\n- 打印一条指示结果的消息。\n\n**基础计算器：**\n- 创建一个程序，接收两个数字和一个操作作为变量。\n\
    - 它使用 `switch` 结构执行操作（加、减、乘、除）并显示结果。\n\n**年龄分类：**\n- 创建一个程序，根据年龄将人分为以下类别：儿童、青少年、成年人。\n\
    - 使用 `elseif` 结构管理不同的类别。\n\n**星期几：**\n- 创建一个程序，接收一个星期几作为变量。\n- 它使用 `switch` 结构根据日期打印不同的消息。\n\
    \n这些练习将帮助你理解并应用 PHP 中的控制结构。\n\n# 循环 (for, while, do-while)\n\n循环是任何编程语言的基础部分，对于高效地重复任务至关重要。在\
    \ PHP 中，我们有三种主要的循环：`for`、`while` 和 `do-while`。我们将通过实际示例和一些练习来探索每种循环，以强化这些概念。\n\
    \n### for 循环\n\n当我们确切知道要重复任务的任务时，使用 `for` 循环。\n\n```php\n<?php\n// For 循环示例：打印数字\
    \ 1 到 5\nfor ($i = 1; $i <= 5; $i++) {\n    echo $i . \" \";\n}\n?>\n```\n\n###\
    \ while 循环\n\n`while` 循环只要条件为真就会一直执行。当我们不知道任务将重复多少次时，它非常有用。\n\n```php\n<?php\n\
    // While 循环示例：打印数字 1 到 5\n$i = 1;\nwhile ($i <= 5) {\n    echo $i . \" \";\n \
    \   $i++;\n}\n?>\n```\n\n### do-while 循环\n\n`do-while` 循环类似于 `while` 循环，但它确保代码块至少执行一次。\n\
    \n```php\n<?php\n// Do-while 循环示例：打印数字 1 到 5\n$i = 1;\ndo {\n    echo $i . \"\
    \ \";\n    $i++;\n} while ($i <= 5);\n```\n\n## 实际练习\n\n**乘法表：**\n创建一个接收一个数字作为变量的程序。\n\
    \n**倒计时：**\n创建一个从给定数字开始倒数的程序。\n\n**偶数之和：**\n创建一个计算给定范围内偶数和的程序。\n\n**模式生成器：**\n\
    创建一个打印特定模式的程序。\n\n# PHP 中的函数\n\n在编程中，函数是可复用的代码块。在 PHP 中，定义和调用函数是非常关重要的。在本章中，我们将探索如何创建和使用函数。\n\
    \n### 函数定义\n\n函数通过 `function` 关键字定义。这是一个简单的示例：\n\n```php\n<?php\nfunction greet()\
    \ {\n    echo \"Hello, World!\";\n}\n?>\n```\n\n我们定义了一个调用时打印 \"Hello, World!\"\
    \ 的函数。\n\n### 函数调用\n\n一旦你定义了函数，就可以在代码的任何地方调用它。这里是调用 `greet` 函数的方法：\n\n```php\n\
    <?php\ngreet(); // 输出: Hello, World!\n?>\n```\n\n### 函数参数\n\n函数可以接受参数以变得灵活。让我们修改\
    \ `greet` 函数，使其接受一个名称参数：\n\n```php\n<?php\nfunction greetWithName($name) {\n \
    \   echo \"Hello, $name!\";\n}\n?>\n```\n\n现在，调用此函数时你需要提供一个名称：\n\n```php\n<?php\n\
    greetWithName(\"Juan\"); // 输出: Hello, Juan!\ngreetWithName(\"Maria\"); // 输出:\
    \ Hello, Maria!\n?>\n```\n\n### 返回值\n\n函数还可以返回一个值。让我们修改函数，使其返回问候而不是直接打印：\n\n```php\n\
    <?php\nfunction getGreeting($name) {\n    return \"Hello, $name!\";\n}\n?>\n```\n\
    \n当你调用此函数时，可以获取返回值并使用它：\n\n```php\n<?php\n$greeting = getGreeting(\"Carlos\");\n\
    echo $greeting; // 输出: Hello, Carlos!\n?>\n```\n\n### 变量的作用域\n\n变量具有局部或全局作用域。在函数内部定义的变量是局部的，在外部无法访问。\n\
    \n```php\n<?php\nfunction example() {\n    $x = \"这是一个局部变量\";\n}\n?>\n```\n\n\
    ### 内置函数\n\nPHP 提供了许多方便的内置函数。例如，`strlen` 返回字符串的长度：\n\n```php\n<?php\n$string =\
    \ \"Hello, World!\";\n$length = strlen($string);\necho \"字符串的长度为: $length\";\n\
    ?>\n```\n\n## 实际练习\n\n**简单计算器：**\n创建一个名为 `calculator` 的函数，接收两个数字和一个操作（加、减、乘、除）。该函数必须执行操作并返回结果。\n\
    \n**问候生成器：**\n创建一个名为 `generateGreeting` 的函数，接收一个名称和可选参数。\n\n**单词计数器：**\n创建一个 `countWords`\
    \ 函数，它接收一个字符串并返回其中的单词数。\n\n**密码验证：**\n创建一个名为 `validatePassword` 的函数，它接收密码作为参数，如果它符合某些标准（例如最小长度、大小写使用、数字），则返回\
    \ `true`，否则返回 `false`。\n\n"
