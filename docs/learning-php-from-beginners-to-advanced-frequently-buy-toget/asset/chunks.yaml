  trans: "\n\n确保你已经有一个名为 `\"files\"` 的目录，并且其具有写入权限，以便存储文件。\n\n## 实际练习：\n\n#### 表单扩展：\n\
    修改表单以包含额外的字段，例如用户名和文件描述。\n\n#### 文件验证：\n在 `PHP` 脚本中添加验证逻辑，以确保只上传允许的文件（例如图像和文档）。\n\
    \n#### 重命名文件：\n实现重命名上传文件的逻辑，以避免潜在的名称冲突。\n\n#### 上传日志：\n在数据库中创建记录，存储每个上传文件的信息，例如名称、描述和上传日期。\n\
    \n#### 安全性：\n研究并应用额外的安全措施，例如限制文件大小、防止 `PHP` 文件执行，以及防止恶意文件上传攻击。\n\n文件上传是一项常见的功能，但必须小心处理。这些练习将帮助你更深入地理解如何在你的\
    \ `PHP` 应用中有效地实现它。\n\n# 使用 MySQL 和 MySQLi 连接数据库\n\n在本章中，我们将探索如何使用 `PHP` 中标准的 `MySQL`\
    \ 和 `MySQLi` 扩展到 `MySQL` 数据库建立安全高效的连接。与数据库交互的能力对于开发动态且可扩展的 Web 应用至关重要。\n\n## 与\
    \ MySQL 连接：\n\n`MySQL` 是一个流行且广泛使用的数据库。要让 `PHP` 连接到 `MySQL`，我们需要启用 `MySQL` 扩展。在许多环境中，该扩展已经安装并激活。\n\
    \n### MySQL 连接示例：\n\n```php\n<?php\n\n$servername = \"localhost\";\n\n$username\
    \ = \"your\\_username\";\n$password = \"your\\_password\";\n$database = \"your\\\
    _database\";\n\n// 创建连接\n\n$conn = new mysqli($servername, $username, $password,\
    \ $database);\n\n// 验证连接\n\nif ($conn->connect_error) {\n    die(\"Connection\
    \ error: \" . $conn->connect_error);\n}\n\necho \"Successful connection to MySQL\
    \ database\";\n\n// 在此处执行数据库操作\n\n// 关闭连接\n\n$conn->close();\n\n?>\n```\n\n###\
    \ 连接到 MySQLi：\n`MySQLi`（MySQL Improved）是一个较新的扩展，相比传统的 `MySQL` 扩展具有优势，例如支持预处理查询和事务。\n\
    \n### MySQLi 连接示例：\n\n```php\n<?php\n\n$servername = \"localhost\";\n\n$username\
    \ = \"your\\_username\";\n$password = \"your\\_password\";\n$database = \"your\\\
    _database\";\n\n// 创建连接\n\n$conn = new mysqli($servername, $username, $password,\
    \ $database);\n\n// 验证连接\n\nif ($conn->connect_error) {\n    die(\"Connection\
    \ error: \" . $conn->connect_error);\n}\n\necho \"Successful connection to MySQLi\
    \ database\";\n\n// 在此处执行数据库操作\n\n// 关闭连接\n\n$conn->close();\n\n?>\n```\n\n##\
    \ 实际练习：\n\n#### 连接与基础查询：\n- 使用提供的代码连接到你的 `MySQL` 数据库。\n- 执行一个简单的查询从表中选取某些数据。\n\
    - 在浏览器中打印结果。\n\n#### 使用预处理查询的 MySQLi 连接：\n- 修改代码使用 `MySQLi` 执行一个预处理查询，以选取具有特定值的记录。\n\
    - 在浏览器中打印结果。\n\n#### 数据插入：\n- 创建一个新脚本，将数据插入到数据库的表中。\n- 验证数据是否已正确插入。\n\n#### 更新和删除数据：\n\
    - 创建更新和删除数据库中数据的操作。\n- 验证操作是否已正确执行。\n\n这些练习将让你熟悉使用 `PHP` 连接和操作 `MySQL` 数据库的基本操作。\n\
    \n# 数据库连接配置\n\n大多数 Web 应用都需要从数据库存储和检索数据。`PHP` 提供了几个与数据库交互的扩展，其中 `MySQLi`（MySQL\
    \ Improved）是一个常用选项。在本章中，我们将学习如何配置数据库连接并执行基本操作。\n\n#### 使用 MySQLi 配置连接：\n\n###\
    \ 安装 MySQLi 扩展：\n确保你的 `PHP` 安装中启用了 `MySQLi` 扩展。你可以通过检查 `php.ini` 文件或在命令行中运行 `php\
    \ -m` 来实现。\n\n#### 数据库凭据：\n在连接数据库之前，确保你拥有正确的凭据（用户名、密码、数据库名）。\n\n#### 基础连接：\n\n\
    ```php\n<?php\n\n// 数据库凭据\n\n$server = \"localhost\";\n\n$user = \"your\\_user\"\
    ;\n$password = \"your\\_password\";\n$database = \"your\\_database\";\n\n// 创建连接\n\
    \n$conexion = new mysqli($servidor, $usuario, $contrasena, $base_datos);\n\n//\
    \ 验证连接\n\nif ($conexion->connect_error) {\n    die(\"Connection failed: \" . $connection->connect_error);\n\
    }\n\necho \"Connection successful\";\n\n?>\n```\n将 `\"your\\_user\"`、`\"your\\\
    _password\"` 和 `\"your\\_database\"` 替换为你自己的凭据。\n\n#### 执行查询：\n\n```php\n<?php\n\
    \n// ... (连接代码)\n\n// SQL 查询\n\n$query = \"SELECT id, name, email FROM users\"\
    ;\n\n$result = $connection->query($query);\n\n// 检查查询是否成功\n\nif ($result === false)\
    \ {\n    die(\"Query error: \" . $connection->error);\n}\n\n// 处理结果\n\nwhile ($queue\
    \ = $resultado->fetch_assoc()) {\n    echo \"ID: \" . $row[\"id\"] . \" | Name:\
    \ \" . $row[\"name\"] . \" | Email: \" . $row[\"email\"] . \"<br>\";\n}\n\n//\
    \ 关闭连接\n\n$conexion->close();\n\n?>\n```\n\n## 实际练习：\n\n#### 简单连接与查询：\n创建一个 `PHP`\
    \ 文件，连接到你的数据库并从表中获取简单信息。\n\n#### 数据插入：\n修改上述脚本将新数据插入到 `users` 表。\n\n#### 数据更新：\n\
    实现一个函数来更新数据库中特定用户的数据。\n\n#### 数据删除：\n添加删除用户的功能。\n\n#### 错误处理：\n引入错误处理，例如检查连接是否成功。\n\
    \n这些练习将让你熟悉 `PHP` 中的基础 CRUD（增、删、改、删）操作。\n\n# 使用 PHP 执行 SQL 查询\n\n现在我们已经设置好了环境并准备好与数据库工作，让我们探索一些基础查询。\n\
    \n### 连接数据库：\n假设我们连接到 `MySQL`：\n\n```php\n<?php\n$servername = \"localhost\";\n\
    \n$username = \"your\\_username\";\n$password = \"your\\_password\";\n$database\
    \ = \"your\\_database\";\n\n// 创建连接\n\n$conn = new mysqli($servername, $username,\
    \ $password, $database);\n\n// 验证连接\n\nif ($conn->connect_error) {\n    die(\"\
    Connection error: \" . $conn->connect_error);\n}\n\necho \"Successful connection\
    \ to MySQL database\";\n\n?>\n```\n\n### SQL 查询：\n\n#### 1. 数据选择 (SELECT):\n```php\n\
    <?php\n// 查询所有记录\n\n$sql = \"SELECT * FROM usuarios\";\n\n$result = $conn->query($sql);\n\
    \n// 显示结果\n\nif ($result->num_rows > 0) {\n    while($row = $result->fetch_assoc())\
    \ {\n        echo \"ID: \" . $row[\"id\"] . \" - Name: \" . $row[\"name\"] . \"\
    <br>\";\n    }\n} else {\n    echo \"0 results\";\n}\n\n?>\n```\n\n#### 2. 数据插入\
    \ (INSERT):\n```php\n<?php\n// 插入新用户的查询\n\n$sql = \"INSERT INTO users(name, email)\
    \ VALUES('Juan Perez', 'juan@example.com')\";\n\nif ($conn->query($sql) === TRUE)\
    \ {\n    echo \"New user created successfully\";\n} else {\n    echo \"Error:\
    \ \" . $sql . \"<br>\" . $conn->error;\n}\n\n?>\n```\n\n#### 3. 数据更新 (UPDATE):\n\
    ```php\n<?php\n// 更新用户查询\n\n$sql = \"UPDATE users SET name='Juanito' WHERE id=1\"\
    ;\n\nif ($conn->query($sql) === TRUE) {\n    echo \"Username updated successfully\"\
    ;\n} else {\n    echo \"Error updating: \" . $conn->error;\n}\n\n?>\n```\n\n####\
    \ 4. 数据删除 (DELETE):\n```php\n<?php\n// 删除用户的查询\n\n$sql = \"DELETE FROM usuarios\
    \ WHERE id=1\";\n\nif ($conn->query($sql) === TRUE) {\n    echo \"User successfully\
    \ deleted\";\n} else {\n    echo \"Error deleting: \" . $conn->error;\n}\n\n?>\n\
    ```\n\n"
