    \n```php\n<?php\nfunction greetWithName($name) {\n    echo \"Hello, $name!\";\n\
    }\n?>\n```\nNow, when calling this function, you need to provide a name:\n\n```php\n\
    <?php\ngreetWithName(\"Juan\"); // Output: Hello, Juan!\ngreetWithName(\"Maria\"\
    ); // Output: Hello, Maria!\n?>\n```\n\n### Return Value\n\nFunctions can also\
    \ return a value. Let's modify our function so that it returns a greeting instead\
    \ of printing it directly:\n\n```php\n<?php\nfunction getGreeting($name) {\n \
    \   return \"Hello, $name!\";\n}\n?>\n```\nWhen you call this function, you can\
    \ capture the return value and use it:\n\n```php\n<?php\n$greeting = getGreeting(\"\
    Carlos\");\necho $greeting; // Output: Hello, Carlos!\n?>\n```\n\n### Scope of\
    \ Variables\n\nVariables can have local or global scopes. A variable declared\
    \ inside a function is local and not accessible outside it.\n\n```php\n<?php\n\
    function example() {\n    $x = \"This is a local variable\";\n}\n?>\n```\n\n###\
    \ Predefined Functions\n\nPHP provides many predefined functions that make tasks\
    \ easier. For example, `strlen` returns the length of a string:\n\n```php\n<?php\n\
    $string = \"Hello, World!\";\n$length = strlen($string);\necho \"The length of\
    \ the string is: $length\";\n?>\n```\n\n## Practical exercises\n\n**Simple Calculator:**\n\
    Create a function called `calculator` that accepts two numbers and an operation\
    \ (addition, subtraction, multiplication, division). The function must perform\
    \ the operation and return the result.\n\n**Greetings Generator:**\nCreate a function\
    \ called `generateGreeting` that takes a name and optional parameters.\n\n**Word\
    \ Counter:**\nCreate a function `countWords` which takes a string and returns\
    \ the number of words in it.\n\n**Password Validation:**\nCreate a function called\
