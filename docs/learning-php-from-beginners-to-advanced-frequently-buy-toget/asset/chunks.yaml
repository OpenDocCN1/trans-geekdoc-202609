    \ 更新其 `name`。\n\n### 带确认确认的删除\n在运行 `delete` 查询之前添加确认，以防止意外删除。\n\n# 使用 MySQLi 连接数据库\n\
    \n## 安全性与性能\n在本章中，我们将深入学习使用 `mysqli`，这是一种用于从 `PHP` 与 `MySQL` 数据库交互的改进接口。我们将学习如何建立安全连接、执行预处理语句以防止\
    \ SQL 注入，并优化数据库操作的性能。\n\n### 使用 MySQLi 建立连接\n在与数据库交互之前，我们需要建立连接。以下是一个操作示例：\n\n\
    ```php\n<?php\n$servername = \"localhost\";\n$username = \"your\\_username\";\n\
    $password = \"your\\_password\";\n$database = \"your\\_database\";\n// 创建连接\n\
    $conn = new mysqli($servername, $username, $password, $database);\n// 验证连接\nif\
    \ ($conn->connect\\_error) {\n    die(\"Connection failed: \" . $conn->connect\\\
    _error);\n}\necho \"Connection successful\";\n?>\n```\n\n### 安全的预处理查询\n防止 SQL\
    \ 注入对于应用程序的安全至关重要。预处理查询是实现这一点的的有效方法。这是一个示例：\n\n```php\n<?php\n$name = \"User\"\
    ;\n$lastname = \"Example\";\n$email = \"usuario@example.com\";\n// 创建预处理查询\n$stmt\
    \ = $conn->prepare(\"INSERT INTO users (first name, last name, email) VALUES (?,\
    \ ?, ?)\");\n$stmt->bind\\_param(\"sss\", $firstname, $lastname, $email);\n//\
    \ 执行查询\n$stmt->execute();\necho \"Record inserted successfully\";\n$stmt->close();\n\
    ?>\n```\n\n### 获取查询结果\n执行查询后，我们可以获取并处理结果。这里是一个基础示例：\n\n```php\n<?php\n$sql = \"\
    SELECT id, name, email FROM users\";\n$result = $conn->query($sql);\nif ($result->num\\\
    _rows > 0) {\n    // 输出每行的数据\n    while ($queue = $resultado->fetch\\_assoc())\
    \ {\n        echo \"ID: \" . $row\\[\"id\"\\] . \" - Name: \" . $row\\[\"name\"\
    \\] . \" - Email: \" . $row\\[\"email\"\\] . \"<br>\";\n    }\n} else {\n    echo\
    \ \"0 results\";\n}\n$result->close();\n?>\n```\n\n### 关闭连接\n在完成数据库交互后，关闭连接以释放资源至关重要。以下是关闭连接的代码：\n\
    \n```php\n<?php\n$conn->close();\n?>\n```\n\n## 实际练习\n#### 用户注册\n创建一个名为 `users`\
    \ 的表，包含 `id`、`name`、`email` 和 `password` 等字段。\n实现一个注册表单，使用预处理语句向数据库插入新用户。\n\n\
    #### 登录\n设计一个名为 `sessions` 的表来管理用户会话。\n创建一个登录表单，使用预处理语句验证凭据。\n\n#### 产品列表\n如果你在数据库中有一个\
    \ `products` 表，创建一个显示产品列表的页面。\n这些练习将帮助你在使用 `PHP` 中的 `mysqli` 与数据库交互时应用安全和性能概念。\n\
    \n# PHP 和 AJAX\n通过 AJAX，我们可以更新网页的特定部分，而无需重新刷新整个页面。我们将学习如何向服务器发送请求，使用 `PHP` 处理它们并动态更新页面内容。\n\
    \n### AJAX 基础\nAJAX 基于以下技术：\n* `JavaScript`: 用于发送异步请求。\n* `XMLHttpRequest` (XHR):\
    \ 促进 `JavaScript` 与服务器之间通信的对象。\n* `PHP`: 用于处理服务器端请求并返回响应。\n\n### 实际示例：动态内容加载\n\
    \n**1. HTML 文件 (index.html):**\n```html\n<!DOCTYPE html>\n<html lang=\"es\">\n\
    <head>\n    <meta charset=\"UTF-8\">\n    <title>PHP y AJAX</title>\n    <script\
    \ src=\"https://code.jquery.com/jquery-3.6.4.min.js\"></script>\n    <script src=\"\
    script.js\"></script>\n</head>\n<body>\n    <div id=\"content\">\n        <!--\
    \ 内容将动态加载在此处 -->\n    </div>\n    <button id=\"loadContent\">Carry Content</button>\n\
    </body>\n</html>\n```\n\n**2. JavaScript 文件 (script.js):**\n```javascript\n$(document).ready(function()\
    \ {\n    $(\"#loadContent\").click(function() {\n        // 向服务器发送 AJAX 请求\n \
    \       $.ajax({\n            url: \"load\\_content.php\",\n            method:\
    \ \"GET\",\n            success: function(data) {\n                // 更新页面内容\n\
    \                $(\"#content\").html(data);\n            },\n            error:\
    \ function() {\n                alert(\"Error loading.\");\n            }\n  \
    \      });\n    });\n});\n```\n\n**3. PHP 文件 (load\\_content.php):**\n```php\n\
    <?php\n// 模拟延迟\nsleep(2);\necho \"<p>Dynamically loaded content!</p>\";\n?>\n\
    ```\n\n### 实际练习：实时\n**HTML 文件 (index.html):**\n```html\n<!DOCTYPE html>\n<html\
    \ lang=\"es\">\n<head>\n    <meta charset=\"UTF-8\">\n    <title>AJAX Demo</title>\n\
    \    <script src=\"ajax.js\"></script>\n</head>\n<body>\n    <h2>My Page</h2>\n\
    \    <div id=\"content\">\n        <!-- 内容将加载在此处 -->\n    </div>\n    <button\
    \ onclick=\"loadContent()\">Carry Content</button>\n</body>\n</html>\n```\n\n\
    **JavaScript (ajax.js):**\n```javascript\nfunction loadContent() {\n    // 创建\
    \ XMLHttpRequest 对象\n    var xhttp = new XMLHttpRequest();\n    // 设置响应函数\n  \
    \  xhttp.onreadystatechange = function() {\n        if (this.readyState == 4 &&\
    \ this.status == 200) {\n            // 当请求成功完成时\n            document.getElementById(\"\
    content\").innerHTML = this.responseText;\n        }\n    };\n    // 配置并向服务器发送\
    \ GET 请求\n    xhttp.open(\"GET\", \"contenido.txt\", true);\n    xhttp.send();\n\
    }\n```\n\n**内容文件 (contenido.txt):**\n通过 AJAX 动态加载的内容！\n\n"
