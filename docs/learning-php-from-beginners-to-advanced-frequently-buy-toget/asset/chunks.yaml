    \ $name;\n    public $ age ;\n\n    // Constructor method\n    public function\
    \ __construct($name, $age) {\n        $this->name = $name;\n        $this->age\
    \ = $age;\n    }\n    // Method to obtain information\n    public function get\
    \ information() {\n        return \"Name: {$this->name}, Age: {$this->age} years\"\
    ;\n    }\n}\n\n// Object creation\n$person1 = new Person(\"John\", 25);\n$persona2\
    \ = new Person(\"Mary\", 30);\n\n// Access to properties and methods\necho $persona1->get\
    \ information(); // Print: Name: Juan, Age: 25 years\necho $persona2->get information();\
    \ // Print: Name: María, Age: 30 years\n?>\n```\n\n### Inheritance and Polymorphism\n\
    Inheritance allows one `class` to inherit properties and methods from another\
    \ `class`. Polymorphism allows `objects` of different `classes` to be treated\
    \ as `objects` of a base `class`.\n\n#### Practical example:\n```php\n<?php\n\
    // Base class 'Animal'\nclass Animal {\n    public function makeSound() {\n  \
    \      return \"Generic sound\";\n    }\n}\n// Derived class 'Dog'\nclass Perro\
    \ extends Animal {\n    public function makeSound() {\n        return \"Wow wow\"\
    ;\n    }\n}\n// Derived class 'Cat'\nclass Gato extends Animal {\n    public function\
    \ makeSound() {\n        return \"Meow\";\n    }\n}\n\n// Object creation\n$dog\
    \ = new Dog();\n$gato = new Gato();\n\n// Method calls\necho $dog->makeSound();\
    \ // Print: Wow wow\necho $gato->makeSound(); // Print: Meow\n?>\n```\n\n## Practical\
    \ exercises:\n\n### Create a 'Book' Class\n- Defines a `class` called `Book` with\
    \ properties such as `title`, `author`, and `publication year`.\n- Implement a\
    \ method to obtain the information from the book.\n- Creates instances of the\
    \ `class` and displays the information of some books.\n\n### Inheritance - Create\
    \ 'Rectangle' and 'Square' Classes\n- Create a base `class` called `Rectangle`\
    \ with `width` and `height` properties and a method to calculate the area.\n-\
    \ Derive a `Square` `class` from the `Rectangle` `class` that has a method to\
    \ set the side.\n- Create instances of both `classes` and display their areas.\n\
    \n### Polymorphism - Create a 'Player' Interface\n- Defines an interface called\
    \ `Player` with a method `play()`.\n- Implement the interface in `classes` like\
    \ `ReproductorMP3` and `ReproductorVideo`.\n- Create instances of both `classes`\
    \ and call the `play()` method.\n\nThese exercises will help you understand and\
    \ apply key concepts of object-oriented programming in PHP.\n\n---\n\n## Inheritance\
    \ and Polymorphism\n\nThese features allow for greater code reuse and a more modular\
    \ structure in your applications.\n\n### Inheritance in PHP\nInheritance is a\
    \ mechanism that allows one `class` to inherit properties and methods from another\
    \ `class`. The `class` that it inherits is known as the `derived class` or `subclass`,\
    \ and the `class` from which it inherits is called the `base class` or `superclass`.\n\
    \n#### Practical example:\nSuppose we have a `class Vehicle`:\n```php\nclass Vehicle\
    \ {\n    protected $mark;\n    protected $modelo;\n    public function __construct($marca,\
    \ $modelo) {\n        $this->mark = $marca;\n        $this->modelo = $modelo;\n\
    \    }\n    public function mostrarInfo() {\n        echo \"Brand: {$this->mark},\
    \ Model: {$this->modelo}\";\n    }\n}\n\nclass Automobile extends Vehicle {\n\
    \    private $doors;\n    public function __construct($brand, $model, $doors)\
    \ {\n        parent::__construct($brand, $model);\n        $this->doors = $doors;\n\
    \    }\n    public function mostrarInfo() {\n        echo \"Brand: {$this->mark},\
    \ Model: {$this->modelo}, Doors: {$this->doors}\";\n    }\n}\n\n$car = new Automobile(\"\
    Toyota\", \"Corolla\", 4);\n$car->mostrarInfo();\n```\n\n### Polymorphism in PHP\n\
    Polymorphism allows `objects` of different `classes` to be treated as `objects`\
    \ of a base `class`.\n\n#### example:\n```php\nfunction showDetails($vehicle)\
    \ {\n    $vehicle->mostrarInfo();\n}\n\n$generic = new Vehicle(\"Toyota\", \"\
    Camry\");\n$car = new Automobile(\"Honda\", \"Civic\", 4);\n\nshowDetails($generic);\
    \ // Output: Brand: Toyota, Model: Camry\nshowDetails($car);     // Output: Brand:\
    \ Honda, Model: Civic, Doors: 4\n```\n\n#### Practical exercises:\n- **Inheritance\
    \ and Additional Method**: Extend the `Vehicle` class with a new class `Motorcycle`.\
    \ Add a specific property `displacement`.\n- **Polymorphism**: Create a new `class`\
    \ called `Garage` that has a method to display any vehicle. Fill the `garage`\
    \ with instances of different `classes` (`Vehicle`, `Car`, `Motorcycle`). Use\
    \ the `garage` method to show details of each.\n\n---\n\n## Encapsulation and\
    \ Abstraction in PHP\n\nThese principles are essential for writing modular, maintainable,\
    \ and efficient code.\n\n### Encapsulation\nEncapsulation refers to the idea of\
    \ grouping data and methods that operate on that data into a single unit, known\
    \ as a `class`. This helps hide the internal implementation of the `objects` and\
    \ exposes what is necessary to interact with them.\n\n#### Practical example:\n\
    ```php\n<?php\nclass User {\n    private $name;\n    private $email;\n    private\
    \ $password;\n\n    public function __construct($name, $email, $password) {\n\
    \        $this->name = $name;\n        $this->email = $email;\n        $this->password\
    \ = password_hash($password, PASSWORD_DEFAULT);\n    }\n\n    public function\
    \ getName() {\n        return $this->name;\n    }\n\n    public function changePassword($newPassword)\
    \ {\n        $this->password = password_hash($newPassword, PASSWORD_DEFAULT);\n\
    \    }\n}\n\n// Use of the User class\n$user = new User(\"Juan Perez\", \"juan@email.com\"\
    , \"password123\");\necho \"Name: \" . $user->getName() . \"<br>\";\n\n// Trying\
    \ to directly access the password will result in an error!\n// echo \"Password:\
    \ \" . $user->password; // Error\n?>\n```\n\n### Abstraction\nAbstraction involves\
    \ simplifying and modeling real-world entities into software `objects`. By using\
    \ abstraction, we define the essential characteristics of an object and hide unnecessary\
    \ details.\n\n#### Practical example:\n```php\n<?php\nabstract class Vehiculo\
    \ {\n    protected $modelo;\n    abstract public function arrancar();\n}\n?>\n\
    ```"
