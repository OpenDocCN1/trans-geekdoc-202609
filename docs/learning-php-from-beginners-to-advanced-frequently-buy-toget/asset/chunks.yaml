    $array = array(\n    array(1, 2, 3),\n    array(4, 5, 6),\n    array(7, 8, 9)\n\
    );\n// Access elements\necho $array[0][1]; // Output: 2\necho $array[2][0]; //\
    \ Output: 7\n?>\n```\n\n### Practical exercises:\n\n#### Array Manipulation:\n\
    \nCreate an array with the days of the week.\n\nPrints the third day of the week.\n\
    \nAdd two more days to the end of the array.\n\nPrints the total number of days\
    \ in the array.\n\n#### User Data:\n\nCreate an associative array that represent\
    \ a user's information (name, email, age).\n\nModify the user's email.\n\nAdd\
    \ the city and country information to the array.\n\n#### Product Matrix:\n\nCreate\
    \ a matrix that represents products and their prices.\n\nPrint the price of the\
    \ second product.\n\nModify the price of the third product.\n\nAdd a new product\
    \ to the array.\n\nThese exercises will allow you to become familiar with the\
    \ manipulation of arrays and data structures in PHP, fundamental skills for dynamic\
    \ web development.\n\n Numerical and Associative Arrays\n\nIn PHP, arrays are\
    \ fundamental data structures that allow you to store and manipulate sets of values.\
    \ There are two main types of arrays: numeric and associative. In this chapter,\
    \ we will explore how to work with both types of arrays and how to take advantage\
    \ of their unique characteristics.\n\n### Numerical Arrays:\n\nA numeric array\
    \ uses numeric indexes to access its elements. Let's look at a practical example:\n\
    \n```php\n<?php\n// Declaration of a numeric array\n$numeric = array(10, 20, 30,\
    \ 40, 50);\n// Access elements by index\necho $numeric[2]; // Will print 30\n\
    ?>\n```\n\nExercise 1:\n\nCreate a numeric array that represents the days of the\
    \ week.\n\nPrints the third day of the week using its index.\n\n### Associative\
    \ Arrays:\n\nAssociative arrays use keys instead of numeric indexes to access\
    \ elements. Each element has a unique key associated with a value. Let's look\
    \ at an example:\n\n```php\n<?php\n// Declaration of an associative array\n$persona\
    \ = array(\n    \"name\" => \"Juan\",\n    \"age\" => 25,\n    \"city\" => \"\
    Mexico City\"\n);\n// Access elements\necho $persona[\"name\"]; // Output: Juan\n\
    ?>\n"
  trans: "\n创建一个名为 `boardMultiplicar` 的函数，接收一个数字。\n\n该函数应该打印该数字从 1 到 10 的乘法表。\n\n\
    ### 回文性验证：\n\n创建一个名为 `Palindromo` 的函数，接收一个字符串。\n\n如果字符串是回文，该函数必须返回 `true`，否则返回\
    \ `false`。\n\n### 邮箱验证：\n\n创建一个名为 `validateCorreo` 的函数，接收一个邮箱地址。\n\n如果该地址有效，该函数必须返回\
    \ `true`，否则返回 `false`。\n\n这些练习将允许你练习在 PHP 中定义和调用函数。请记住，函数提供的模块化是编写可维护且高效代码的关键。\n\
    \n## PHP 中的变量作用域\n\n编程中的基本概念之一是变量的作用域。作用域决定了变量何时可以被访问和修改。在 PHP 中，有两种主要的作用域：局部作用域和全局作用域。在本章中，我们将通过实际示例和练习来探索这些概念。\n\
    \n### 局部作用域：\n\n在函数内部定义的变量具有局部作用域，并且只能在该函数内部访问。\n\n```php\nfunction exampleLocal()\
    \ {\n    $variableLocal = \"This is a local variable.\";\n    echo $variableLocal;\n\
    }\n\n// 调用函数\nexampleLocal();\n\n// 这将产生错误，因为 $variableLocal 在函数外部未定义\necho $variableLocal;\n\
    ```\n\n### 全局作用域：\n\n在任何函数外部定义的变量具有全局作用域，可以从脚本的任何地方访问。\n\n```php\n$variableGlobal\
    \ = \"This is a global variable.\";\n\nfunction exampleGlobal() {\n    // 我可以从这里访问全局变量\n\
    \    global $variableGlobal;\n    echo $variableGlobal;\n}\n\n// 调用函数\nexampleGlobal();\n\
    \n// 我也可以在函数外部访问全局变量\necho $variableGlobal;\n```\n\n### 实际练习：\n\n#### 局部变量的作用域：\n\
    \n创建一个名为 `greeting` 的函数，其内部有一个名为 `$message` 的局部变量，值为 \"Hello from the function!\"\
    。\n\n在函数内部打印 `$message` 的值。\n\n调用该函数并观察局部作用域如何影响变量。\n\n#### 全局变量的作用域：\n\n声明一个名为\
    \ `$counter` 的全局变量，初始值为 0。\n\n创建一个名为 `incrementCounter` 的函数，将 `$counter` 的值加 1。\n\
    \n多次调用该函数并在每次调用后显示 `$counter` 的更新值。\n\n#### 静态变量：\n\n修改 `incrementCounter` 函数，使变量\
    \ `$counter` 成为静态变量。\n\n与之前的版本的行为进行比较，并观察静态变量如何在函数调用之间保留其值。\n\n#### 块级中变量的作用域：\n\
    \n在条件块（`if`）之外声明一个变量 `$outBlock`。\n\n在代码块内部和外部为 `$outBlock` 分配不同的值。\n\n在条件块之后打印\
    \ `$outBlock` 的值，并观察作用域如何影响变量。\n\n## PHP 中的函数\n\n从简化常用任务的预定义函数到创建自定义函数来实现代码模块化，我们将学习如何让代码更高效、更易维护。\n\
    \n### 预定义函数：\n\nPHP 提供了许多用于执行特定任务的预定义函数。让我们来看一些：\n\n#### `strlen()` - 字符串长度：\n\
    \n```php\n$string = \"Hello, world!\";\n$length = strlen($string);\necho \"The\
    \ length of the string is: $length\";\n```\n\n#### `strtolower()` - 转换为小写：\n\n\
    ```php\n$text = \"Hello, World!\";\n$lowercase = strtolower($text);\necho \"Lowercase:$\
    \ lowercase\";\n```\n\n#### `date()` - 获取当前日期：\n\n```php\n$current_date = date(\"\
    Y-m-d\");\necho \"The current date is:$current_date\";\n```\n\n### 创建自定义函数：\n\n\
    现在，我们将创建自己的函数来执行特定任务并促进代码复用。\n\n#### 两个数字相加的函数：\n\n```php\nfunction sumar($num1,\
    \ $num2) {\n    return $num1 + $num2;\n}\n$result = sumar(5, 10);\necho \"和是:\
    \ $result\";\n```\n\n#### 检查回文的函数：\n\n```php\nfunction Palindromo($string) {\n\
    \    return $string == strrev($string);\n}\nvar_dump(Palindromo(\"madam\")); //\
    \ 输出 true\nvar_dump(Palindromo(\"hello\")); // 输出 false\n```\n\n#### 验证邮箱的函数：\n\
    \n```php\nfunction validateCorreo($email) {\n    return filter_var($email, FILTER_VALIDATE_EMAIL);\n\
    }\nvar_dump(validateCorreo(\"test@example.com\")); // 输出 true\nvar_dump(validateCorreo(\"\
    invalid-email\")); // 输出 false\n```\n\n#### 静态变量示例：\n\n```php\nfunction incrementCounter()\
    \ {\n    static $counter = 0;\n    $counter++;\n    return $counter;\n}\necho\
    \ incrementCounter(); // 输出 1\necho incrementCounter(); // 输出 2\n```\n"
