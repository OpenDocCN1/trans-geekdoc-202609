    Introduction to AJAX


    AJAX (Asynchronous JavaScript and XML) enables asynchronous communication between
    the browser and the server, significantly improving the user experience by dynamically
    loading and updating content without the need to reload the entire page.


    AJAX Fundamentals:


    AJAX is based on the following technologies:


    JavaScript: Client-side programming language that allows dynamic manipulation
    of the user interface.


    XMLHttpRequest Object: JavaScript object that allows asynchronous HTTP requests
    to be made to the server.


    Practical Example: Dynamic Content Loading


    HTML (index.html):


    <!DOCTYPE html>


    <html lang="es">


    <head>


        <meta charset="UTF-8">


        <title>AJAX Demo</title>


        <script src="ajax.js"></script>


    </head>


    <body>


        <h2>My Page</h2>


        <div id="content">


            <!-- Content will be loaded here dynamically -->


        </div>


        <button onclick="loadContent()">Carry Content</button>


    </body>


    </html>


    JavaScript (ajax.js):


    function loadContent() {


        // Create an XMLHttpRequest object


        wasxhttp = new XMLHttpRequest();


        //Set up the response function


        xhttp.onreadystatechange = function() {


            if (this.readyState == 4 && this.status == 200) {


                //When the request completes successfully


                document.getElementById("contenido").innerHTML = this.responseText;


            }


        };


        // Configure and send the GET request to the server


        xhttp.open("GET", "contenido.txt", true);


        xhttp.send();


    }


