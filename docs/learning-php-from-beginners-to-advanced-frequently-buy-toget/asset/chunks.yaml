    Connecting to Databases with MySQLi


    Security and Performance


    In this chapter, we''ll dive into using MySQLi, an improved interface for interacting
    with MySQL databases from PHP. We will learn how to establish secure connections,
    perform prepared queries to prevent SQL injections, and optimize the performance
    of our database operations.


    Establishing a Connection with MySQLi:


    Before interacting with the database, we need to establish a connection. Here
    is an example of how to do it:


    <?php


    $servername = "localhost";


    $username = "your\_username";


    $password = "your\_password";


    $database = "your\_database";


    // Create connection


    $conn = new mysqli($servername, $username, $password, $database);


    // Verify the connection


    if ($conn->connect\_error) {


        die("Connection failed: " . $conn->connect\_error);


    }


    echo "Connection successful";


    ?>


    Safety Prepared Consultations:


    Preventing SQL injection is crucial for application security. Prepared queries
    are an effective way to achieve this. Here is an example:


    <?php


    $name = "User";


    $lastname = "Example";


    $email = "usuario@example.com";


    // Create a prepared query


    $stmt = $conn->prepare("INSERT INTO users (first name, last name, email) VALUES
    (?, ?, ?)");


    $stmt->bind\_param("sss", $firstname, $lastname, $email);


    // Execute the query


    $stmt->execute();


    echo "Record inserted successfully";


    $stmt->close();


    ?>


    Get Results of a Query:


    After performing a query, we can obtain and process the results. Here is a basic
    example:


    <?php


    $sql = "SELECT id, name, email FROM users";


    $result = $conn->query($sql);


    if ($result->num\_rows > 0) {


        // Output data from each row


        while ($queue = $resultado->fetch\_assoc()) {


            echo "ID: " . $row\["id"\] . " - Name: " . $row\["name"\] . " - Email:
    " . $row\["email"\] . "<br>";


        }


    } else {


        echo "0 results";


    }


    $result->close();


    ?>


    Connection Closure:


    It is crucial to close the connection once we have finished interacting with the
    database to free up resources. Here is the code to close the connection:


    <?php


    $conn->close();


    ?>


