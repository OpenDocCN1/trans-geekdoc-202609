    Operations with Arrays in PHP


    Arrays are versatile and powerful data structures that allow you to store and
    manipulate sets of information. We will learn to create arrays, access their elements,
    and perform common operations.


    Creation and Access to Elements in Arrays:


    Creating an Array:


    <?php


    // Numeric array


    $numbers = array(1, 2, 3, 4, 5);


    // Associative array


    $persona = array(


        "name" => "John",


        "age" => 25,


        "city" => "Mexico City"


    );


    ?>


    Access to Elements:


    <?php


    echo $numbers\[2\]; // Prints the third element of the numeric array (index 2).


    echo $person\["name"\]; // Prints the value associated with the key "name" in
    the associative array.


    ?>


    Common Operations with Arrays:


    1\. Add Elements:


    <?php


    // Add elements to the end of a numeric array


    $numbers\[\] = 6;


    // Add elements to an associative array


    $person\["profession"\] = "Developer";


    ?>


    2\. Delete Elements:


    <?php


    // Delete an element from a numeric array


    unset($numbers\[3\]);


    // Delete an element from an associative array


    unset($person\["city"\]);


    ?>


    3\. Loop through an Array:


    <?php


    // Loop through a numeric array


    foreach ($numbers as $value) {


        echo $value . " ";


    }


    // Loop through an associative array


    foreach ($persona as $clave => $valor) {


        echo $key . ": " . $value . "<br>";


    }


    ?>


