    Collection of User Data


    An essential part of any web application is the ability to collect user data.
    In this chapter,we will explore how to interact with HTML forms and process user
    input using PHP.


    HTML Forms:


    Practical example:


    <!-- form.html -->


    <!DOCTYPE html>


    <html lang="es">


    <head>


        <meta charset="UTF-8">


        <meta name="viewport" content="width=device-width, initial-scale=1.0">


        <title>User Form</title>


    </head>


    <body>


        <h2>Complete the form:</h2>


        <form action="process\_form.php" method="post">


            <label for="name">Name:</label>


            <input type="text" id="nombre" name="nombre" required>


            <label for="email">Email:</label>


            <input type="email" id="email" name="email" required>


            <input type="submit" value="Enviar">


        </form>


    </body>


    </html>


    Processing in PHP:


    Practical example:


    <!-- process\_form.php -->


    <?php


    if ($\_SERVER\["REQUEST\_METHOD"\] == "POST") {


        // Collect form data


        $name = $\_POST\["name"\];


        $email = $\_POST\["email"\];


        // Validate the data (you can add more validations according to your needs)


        // Process the data (store in a database, send by mail, etc.)


        $message = "Hello $name, thank you for sending your email: $email";


        // Show a success message


        echo $message;


    } else {


        // Redirect if someone tries to access this script directly


        header("Location: formulario.html");


        exit();


    }


    ?>


    Practical exercises:


    Add Validation:


    Modify the scriptprocess\_form.php to include additional validations, such as
    name length or a valid email format.


    Save to a File:


    Instead of printing the message, modify the script to save the information to
    a log file. Create a new file for each shipment.


    Connect to a Database (Optional):


    If you have set up a database, adapt the script to store the form information
    in the database instead of a file.


    Add CSS (Optional):


    Improve the appearance of the form using CSS style sheets. Add classes and styles
    to improve visual presentation.


    These exercises will help you understand how to collect user data using HTML forms
    and process it in a PHP script.


    Server-Side Form Validation


    Form validation is a critical part of web development to ensure that data provided
    by users is correct and secure. In this chapter, we will focus on how to validate
    forms on the server side using PHP.


    Practical Example: Registration Form Validation


    Let''s consider a registration form with fields such as username, email, and password.
    Let''s implement server-side validation.


    Form HTML (registration.html):


    <!DOCTYPE html>


    <html lang="es">


    <head>


        <meta charset="UTF-8">


        <meta name="viewport" content="width=device-width, initial-scale=1.0">


        <title>Registration Form</title>


    </head>


    <body>


        <h1>User Registration</h1>


        <form action="process\_registration.php" method="post">


            <label for="username">Username:</label>


            <input type="text" id="username" name="username" required>


            <label for="email">Email:</label>


            <input type="email" id="email" name="email" required>


            <label for="password">Contraseña:</label>


            <input type="password" id="password" name="password" required>


            <input type="submit" value="Registrar">


        </form>


    </body>


    </html>


    PHP to Process Registry (process\_registration.php):


    <?php


    if ($\_SERVER\["REQUEST\_METHOD"\] == "POST") {


        // Retrieve form data


        $username = htmlspecialchars($\_POST\["username"\]);


        $email = htmlspecialchars($\_POST\["email"\]);


        $password = htmlspecialchars($\_POST\["password"\]);


        // Validate data


        $errors = array();


        if (empty($username)) {


            $errors\[\] = "The username is required.";


        }


        if (!filter\_var($email, FILTER\_VALIDATE\_EMAIL)) {


            $errors\[\] = "Please enter a valid email.";


        }


        if (empty($password)) {


            $errors\[\] = "The password is required.";


        }


        // Show errors or process the log


        if (!empty($errors)) {


            foreach ($errors as $error) {


                echo "<p>Error: $error</p>";


            }


        } else {


            // Process the registration in the database or other necessary actions


            echo "<p>Successful registration. Welcome, $username!</p>";


        }


    }


    ?>


    Practical exercises:


    Add Additional Validation:


    Improve validation by adding specific rules, such as minimum and maximum length
    for username and password.


    Validate Other Types of Fields:


    Add fields to the form (for example, date of birth) andchoose on format.


    Improve User Experience:


    Use HTML and CSS to highlight fields with errors and provide clear messages.


    Integrate with Database (Optional):


    If you have set up a database, modify the PHP script to store the user data in
    the database.


    These exercises will help you understand the importance of server-side validation
    and implement it effectively in your web forms.


    PHP Security - Preventing CSRF and XSS Attacks


    Security is a fundamental consideration in web development. In this chapter, we
    will focus on two common types of attacks: CSRF (Cross-Site Request Forgery) and
    XSS (Cross-Site Scripting). We will learn how to prevent them and secure our PHP
    applications.


    CSRF Attack Prevention:


    What is CSRF?


    CSRF occurs when an attacker tricks the user''s browser into performing unwanted
    actions in an application in which the user is authenticated.


    Prevention:


    Token CSRF:


    Generate a unique token on each form.


    When processing the form, it verifies that the token is valid.


    <?php


    session\_start();


    function generarTokenCSRF() {


        $token = bin2hex(random\_bytes(32));


        $\_SESSION\[''csrf\_token''\] = $token;


        return $token;


    }


    function validarTokenCSRF($token) {


        return isset($\_SESSION\[''csrf\_token''\]) && hash\_equals($\_SESSION\[''csrf\_token''\],
    $token);


    }


    // In the form


    $token = generarTokenCSRF();


    ?>


    <form action="process\_form.php" method="post">


        <input type="hidden" name="csrf\_token" value="<?php echo $token; ?>">


        <!-- Other form fields -->


        <button type="submit">Enviar</button>


    </form>


    // Inprocess\_form.php


    session\_start();


    $token = $\_POST\[''csrf\_token''\];


    if (validarTokenCSRF($token)) {


        // Process form


    } else {


        // Invalid CSRF token, handle error


    }


    XSS Attack Prevention:


    What is XSS?


    XSS occurs when an attacker inserts malicious scripts into web pages viewed by
    other users.


    Prevention:


    Filtering and Validation:


    Filters and validates all user input.


    Use functions like htmlspecialchars() to escape data before displaying it.


    <?php


    // Filter user data


    $name = htmlspecialchars($\_POST\[''name''\]);


    $comment = htmlspecialchars($\_POST\[''comment''\]);


    //Show data on the page


    echo "Name: $name <br>";


    echo "Comment: $comment";


    ?>


    Content Security Policy (CSP):


    Set up a content security policy to restrict the origin of resources loaded on
    your page.


    <?php


    //Set the content security policy in the header


    header("Content-Security-Policy: default-src ''self''");


    ?>


