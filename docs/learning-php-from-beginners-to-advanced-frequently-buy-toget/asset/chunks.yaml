    \ a Directory and a File\n```php\n<?php\n// Directory name\n$directoryname = 'my_directory';\n\
    // Directory creation\nmkdir($directoryname);\n// Name of the file inside the\
    \ directory\n$filename = $directoryname . '/archivo.txt';\n// Content to write\
    \ to the file\n$content = \"Content in the new file.\";\n// Opening the file in\
    \ writing mode\n$file = fopen($filename, 'w');\n// Write to file\nfwrite($file,\
    \ $content);\n// File closure\nfclose($file);\necho \"Directory and file created\
    \ successfully.\";\n?>\n```\n\n## Practical exercises\n- **Reading and Viewing**:\n\
    \  - Create a text file with several paragraphs.\n  - Write a `PHP` script that\
    \ reads and displays the contents of that file.\n- **File Concatenation**:\n \
    \ - Create two different text files.\n  - Write a `PHP` script that reads both\
    \ files and creates a third file containing the contents of both.\n- **Deleting\
    \ Files and Directories**:\n  - Use `PHP` functions to delete the file and directory\
    \ created in Example 3.\n\nThese exercises will help you understand file handling\
    \ in PHP and how you can apply it to real-world situations in web development.\n\
    \n# Reading and Writing Files in PHP\nAn essential part of web development is\
    \ file manipulation. In this chapter, we will explore how PHP makes it easy to\
    \ read and write data to files, which is crucial for tasks like storing settings,\
    \ logging, and manipulating content.\n\n## Reading Files in PHP\nThe `file_get_contents`\
    \ function allows you to read the entire contents of a file into a string.\n\n\
    ```php\n<?php\n// Path to file\n$file_path = \"file.txt\";\n// Read the content\
    \ of the file\n$content = file_get_contents($file_path);\n// Print the content\n\
    echo $content;\n?>\n```\n\n## Writing Files in PHP\nTo write to a file, you can\
    \ use the function `file_put_contents` or manually open and close the file.\n\n\
    ### Usando file_put_contents\n```php\n<?php\n// Path to file\n$file_path = \"\
    file.txt\";\n// Content to write to the file\n$content = \"Hello, this is new\
    \ content.\";\n// Write to file\nfile_put_contents($file_path, $content);\n?>\n\
    ```\n\n### Using Manual Opening and Closing\n```php\n<?php\n// Path to file\n\
    $file_path = \"file.txt\";\n// Content to write to the file\n$content = \"Hello,\
    \ this is new content.\";\n// Open the file in writing mode\n$file = fopen($file_path,\
    \ \"w\");\n// Write to file\nfwrite($file, $content);\n// Close the file\nfclose($file);\n\
    ?>\n```\n\n## Practical exercises\n- **Access Log**:\n  - Create a file called\
    \ `log.txt`.\n  - It uses the current date and time along with the user's IP address\
    \ to log each file access.\n  - Each entry should be on a new line.\n- **Update\
    \ Settings**:\n  - Create a `config.txt` file with some key configurations in\
    \ key-value format.\n  - Write a script that reads the file, updates a configuration,\
    \ and then writes the changes back to the file.\n- **Database Backup (Optional)**:\n\
    \  - If you have set up a database, write a script that backs up the database\
    \ and saves it to a file.\n- **Image File Management**:\n  - Allows users to upload\
    \ images.\n  - Saves images to a specific directory and logs the details (file\
    \ name, upload date) to a log file.\n\nThese exercises will help you understand\
    \ how to read and write files in PHP, crucial skills for managing data in web\
    \ applications.\n\n# Directory Manipulation in PHP\nDirectory manipulation is\
    \ an essential part of web development, especially when working with file management\
    \ and resource organization. In this chapter, we will explore how PHP allows us\
    \ to interact with directories, create new ones, read their contents and perform\
    \ useful operations.\n\n## Creation of a Directory\n```php\n<?php\n$directoryname\
    \ = \"new_directory\";\nif (!is_dir($directoryname)) {\n    mkdir($directoryname);\n\
    \    echo \"Directory created successfully.\";\n} else {\n    echo \"The directory\
    \ already exists.\";\n}\n?>\n```\nThis example checks to see if the directory\
    \ exists before attempting to create it. The `mkdir()` function is used to create\
    \ a new directory.\n\n## Listing Files in a Directory\n```php\n<?php\n$directory\
    \ = \"./\";\n$files = scandir($directory);\nforeach ($files as $file) {\n    echo\
    \ $file . \"<br>\";\n}\n?>\n```\nThe `scandir()` function is used to get a list\
    \ of files and directories in a specific directory. Then we iterate over the list\
    \ and print the file names.\n\n## Deletion of a Directory and its Content\n```php\n\
    <?php\n$directorioARemoval = \"directory_to_delete\";\nif (is_dir($directorioARemoval))\
    \ {\n    // Delete files and subdirectories before deleting the parent directory\n\
    \    array_map('unlink', glob(\"$directorioAEliminar/\\*.*\"));\n    rmdir($directorioARemoval);\n\
    \    echo \"Directory deleted successfully.\";\n} else {\n    echo \"The directory\
    \ does not exist.\";\n}\n?>\n```\nThis example first deletes all files and subdirectories\
    \ within the directory to be deleted using `glob()` and `unlink()`. Then use `rmdir()`\
    \ to remove the parent directory.\n\n## Practical exercises\n- **Dynamic Directory\
    \ Creation**:\n  - Create a script that prompts the user for a name for a new\
    \ directory.\n  - Uses user input to create a new directory.\n- **List of Files\
    \ with Details**:\n  - Modify the file listing script to include size and modification\
    \ date.\n- **Copy of a Directory**:\n  - Create a new directory called `directory_copy`.\n\
    \  - Copy all files and subdirectories from the main directory to the new directory.\n\
    - **Secure Deletion**:\n  - Improve the deletion script to ask for confirmation\
    \ before deleting a directory.\n  - Make sure the user confirms the deletion before\
    \ proceeding.\n\n# File Upload in PHP\nThe ability to allow users to upload files\
    \ is essential in many web applications. In this chapter, we will explore how\
    \ to implement file uploads in PHP, making sure to handle it safely and efficiently.\n\
    \n## Basic File Upload\n### Form HTML\n```html\n<!-- form_file.html -->\n<form\
    \ action=\"process_upload.php\" method=\"post\" enctype=\"multipart/form-data\"\
    >\n    <label for=\"file\">Select a file:</label>\n    <input type=\"file\" name=\"\
    archivo\" id=\"archivo\">\n    <input type=\"submit\" value=\"Subir Archivo\"\
    >\n</form>\n```\n\n### PHP to Process the Upload\n```php\n<!-- process_upload.php\
    \ -->\n<?php\nif ($_SERVER[\"REQUEST_METHOD\"] == \"POST\") {\n    $filename =\
    \ $_FILES[\"file\"][\"name\"];\n    $rutaTemporal = $_FILES[\"archivo\"][\"tmp_name\"\
    ];\n    $routeDestination = \"files/$filename\";\n    if (move_uploaded_file($rutaTemporal,\
    \ $routeDestination)) {\n        echo \"File uploaded successfully!\";\n    }\
    \ else {\n        echo \"Error uploading file.\";\n    }\n}\n?>\n```\n"
  trans: "\n\n# 修改你现有的表单以包含 CSRF 令牌。\n\n在表单和处理脚本实现令牌的生成和验证。\n\n### 过滤用户数据\n获取一个接收用户数据的表单，并在页面上显示这些数据之前使用\
    \ `htmlspecialchars()` 对这些数据进行过滤。\n\n### 配置内容安全策略 (CSP)\n在你的 `PHP` 脚本中添加 CSP 头部，以限制资源的来源。\n\
    \n这些练习将帮助你增强 `PHP` 应用程序的安全性并防止常见的攻击。\n\n# PHP 中的文件管理\n文件管理是任何 Web 应用程序的不可或缺的一部分。在本章中，我们将探索\
    \ PHP 如何轻松地在服务器上读取、写入和操作文件。从创建文件到操作其内容，我们将学习如何在 PHP 中高效地处理文件。\n\n## 读取文件\nPHP\
    \ 提供了简单但强大的函数来读取文件内容。让我们来看一个实际的示例：\n\n### 示例 1：读取文本文件\n```php\n<?php\n// 文件名\n\
    $filename = 'example.txt';\n// 读取文件内容\n$content = file_get_contents($filename);\n\
    // 打印内容\necho $content;\n?>\n```\n\n## 写入文件\n向文件写入同样简单。你可以以写入模式打开文件并添加或覆盖内容。\n\
    \n### 示例 2：写入文本文件\n```php\n<?php\n// 文件名\n$filename = 'new_file.txt';\n// 要写入的内容\n\
    $content = \"This is a new file.\\nHello, World!\";\n// 以写入模式打开文件\n$file = fopen($filename,\
    \ 'w');\n// 写入文件\nfwrite($file, $content);\n// 关闭文件\nfclose($file);\necho \"文件已创建且内容写入成功.\"\
    ;\n?>\n```\n\n## 文件和目录操作\nPHP 提供了操作文件和目录的函数，例如创建、删除和检查是否存在。\n\n### 示例 3：创建目录和文件\n\
    ```php\n<?php\n// 目录名\n$directoryname = 'my_directory';\n// 创建目录\nmkdir($directoryname);\n\
    // 目录内的文件名\n$filename = $directoryname . '/archivo.txt';\n// 写入文件的内容\n$content\
    \ = \"Content in the new file.\";\n// 以写入模式打开文件\n$file = fopen($filename, 'w');\n\
    // 写入文件\nfwrite($file, $content);\n// 关闭文件\nfclose($file);\necho \"目录和文件创建成功.\"\
    ;\n?>\n```\n\n## 实际练习\n- **读取和查看**：\n  - 创建一个包含几段内容的文本文件。\n  - 编写一个 `PHP` 脚本读取并显示该文件的内容。\n\
    - **文件合并**：\n  - 创建两个不同的文本文件。\n  - 编写一个 `PHP` 脚本读取两个文件并创建一个包含这两个文件内容的第三个文件。\n\
    - **删除文件和目录**：\n  - 使用 `PHP` 函数删除示例 3 中创建的文件和目录。\n\n这些练习将帮助你理解 PHP 中的文件处理，以及你如何将其应用于\
    \ Web 开发的现实场景中。\n\n# PHP 中的读取和写入文件\nWeb 开发的一个基本部分是文件操作。在本章中，我们将探索 PHP 如何轻松地向文件读写数据，这对于存储设置、日志记录和内容操作等任务至关重要。\n\
    \n## 在 PHP 中读取文件\n`file_get_contents` 函数允许你将整个文件的读取到一个字符串中。\n\n```php\n<?php\n\
    // 文件路径\n$file_path = \"file.txt\";\n// 读取文件内容\n$content = file_get_contents($file_path);\n\
    // 打印内容\necho $content;\n?>\n```\n\n## 在 PHP 中写入文件\n要写入文件，你可以使用 `file_put_contents`\
    \ 函数或手动打开并关闭文件。\n\n### 使用 file_put_contents\n```php\n<?php\n// 文件路径\n$file_path\
    \ = \"file.txt\";\n// 写入文件的内容\n$content = \"Hello, this is new content.\";\n//\
    \ 写入文件\nfile_put_contents($file_path, $content);\n?>\n```\n\n### 使用手动打开和关闭\n```php\n\
    <?php\n// 文件路径\n$file_path = \"file.txt\";\n// 写入文件的内容\n$content = \"Hello, this\
    \ is new content.\";\n// 以写入模式打开文件\n$file = fopen($file_path, \"w\");\n// 写入文件\n\
    fwrite($file, $content);\n// 关闭文件\nfclose($file);\n?>\n```\n\n## 实际练习\n- **访问日志**：\n\
    \  - 创建名为 `log.txt` 的文件。\n  - 使用当前日期和时间以及用户的 IP 地址记录每次文件访问。\n  - 每个条目应单独成行。\n\
    - **更新设置**：\n  - 创建一个 `config.txt` 文件，以键值对格式包含一些关键配置。\n  - 编写一个脚本读取文件，更新配置，然后将更改写回文件。\n\
    - **数据库备份（可选）**：\n  - 如果你设置了数据库，编写一个脚本备份数据库并将其保存到文件中。\n- **图像文件管理**：\n  - 允许用户上传图像。\n\
    \  - 将图像保存到特定目录并将详情（文件名、上传日期）记录到日志文件中。\n\n这些练习将帮助你理解如何在 PHP 中读写文件，这是管理 Web 应用程序数据的关键技能。\n\
    \n# PHP 中的目录操作\n目录操作是 Web 开发的一个不可或缺的一部分，特别是在处理文件管理时。在本章中，我们将探索 PHP 如何允许我们与目录交互、创建新的目录并执行操作。\n\
    \n## 创建目录\n```php\n<?php\n// 目录名\n$directoryname = \"new_directory\";\nif (!is_dir($directoryname))\
    \ {\n    mkdir($directoryname);\n    echo \"目录已创建.\";\n} else {\n    echo \"目录已存在.\"\
    ;\n}\n?>\n```\n此示例检查目录是否存在并尝试创建它。\n\n## 列出目录的文件\n```php\n<?php\n$directory = \"\
    ./\";\n$files = scandir($directory);\nforeach ($files as $file) {\n    echo $file\
    \ . \"<br>\";\n}\n?>\n```\n`scandir()` 函数用于获取目录中的文件列表。\n\n## 删除目录及其内容\n```php\n\
    <?php\n$directorioARoval = \"directory_to_delete\";\nif (is_dir($directorioARoval))\
    \ {\n    // 在删除父目录之前删除文件和子目录\n    array_map('unlink', glob(\"$directorioARoval/*.*\"\
    ));\n    rmdir($directorioARoval);\n    echo \"目录已删除.\";\n} else {\n    echo \"\
    目录不存在.\";\n}\n?>\n```\n此示例首先使用 `glob()` 和 `unlink()` 删除目录内的所有文件和子目录，然后使用 `rmdir()`\
    \ 删除父目录。\n\n## 实际练习\n- **动态创建目录**：\n  - 编写一个提示用户输入新目录的脚本。\n  - 使用用户输入创建目录。\n-\
    \ **带详情的文件列表**：\n  - 修改文件列表脚本以包含大小和修改日期。\n- **复制目录**：\n  - 创建名为 `directory_copy`\
    \ 的新目录。\n  - 将主目录的所有文件和子目录复制到新目录。\n- **安全删除**：\n  - 改进删除脚本，在删除前请求确认。\n  - 确保用户在继续之前确认删除。\n\
    \n"
