    \ with `PHP` and dynamically update the page content.\n\n### AJAX Basics\nAJAX\
    \ is based on the following technologies:\n* `JavaScript`: Used to make asynchronous\
    \ requests.\n* `XMLHttpRequest` (XHR): Object that facilitates communication between\
    \ `JavaScript` and the server.\n* `PHP`: Used to process server-side requests\
    \ and return responses.\n\n### Practical Example: Dynamic Content Loading\n\n\
    **1. Archivo HTML (index.html):**\n```html\n<!DOCTYPE html>\n<html lang=\"es\"\
    >\n<head>\n    <meta charset=\"UTF-8\">\n    <title>PHP y AJAX</title>\n    <script\
    \ src=\"https://code.jquery.com/jquery-3.6.4.min.js\"></script>\n    <script src=\"\
    script.js\"></script>\n</head>\n<body>\n    <div id=\"content\">\n        <!--\
