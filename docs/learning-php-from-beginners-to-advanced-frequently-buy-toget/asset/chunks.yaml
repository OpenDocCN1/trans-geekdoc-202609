    \n```php\n<?php\n$name = \"John\";\n$age = 25;\n?>\n```\n\n### Type of data\n\
    `PHP` is a weakly typed language, meaning that it is not necessary to explicitly\
    \ declare the type of a variable. Types include `string` (string), `integer` (int),\
    \ `float` (float), `boolean` (bool), and more.\n\n```php\n<?php\n$name = \"John\"\
    ; // string\n$age = 25; // int\n$height = 1.75; // float\n$is_student = true;\
    \ // bool\n?>\n```\n\n### Operators\n`PHP` supports a variety of operators to\
    \ perform arithmetic, comparison, and logical operations.\n\n```php\n<?php\n$a\
    \ = 10;\n$b = 5;\n// Arithmetic operators\n$sum = $a + $b;\n$remain = $a - $b;\n\
    $product = $a * $b;\n$division = $a / $b;\n\n// Comparison operators\n$equal =\
    \ ($a == $b);\n$different = ($a != $b);\n$greater_than = ($a > $b);\n\n// Logical\
    \ operators\n$and = ($a > 0) && ($b > 0);\n$or = ($a > 0) || ($b > 0);\n$not =\
