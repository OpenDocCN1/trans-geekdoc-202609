    \ \"<br>\";\n    }\n} else {\n    echo \"0 results\";\n}\n$result->close();\n\
    ?>\n```\n\n### Connection Closure\nIt is crucial to close the connection once\
    \ we have finished interacting with the database to free up resources. Here is\
    \ the code to close the connection:\n\n```php\n<?php\n$conn->close();\n?>\n```\n\
    \n## Practical exercises\n#### User Registration\nCreate a table called `users`\
