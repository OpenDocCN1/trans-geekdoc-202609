    <?php\n$sql = \"SELECT id, name, email FROM users\";\n$result = $conn->query($sql);\n\
    if ($result->num\\_rows > 0) {\n    // Output data from each row\n    while ($queue\
    \ = $resultado->fetch\\_assoc()) {\n        echo \"ID: \" . $row\\[\"id\"\\] .\
