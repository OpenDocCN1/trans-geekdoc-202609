    Security in PHP


    Security is a critical consideration in web development. In this chapter, we will
    focus on essential security practices when working with PHP.We will explore how
    to prevent common attacks and ensure our applications are robust and reliable.


    SQL Injection Prevention:


    SQL injections are common attacks where an attacker inserts malicious SQL code
    into database queries. To prevent this, use prepared queries or parameter escaping.


    Example with Prepared Query (MySQLi):


    <?php


    $connection = new mysqli("localhost", "user", "password", "basedededatos");


    if ($conexion->connect\_error) {


        die("Connection failed: " . $connection->connect\_error);


    }


    $user = $\_POST\[''user''\];


    $password = $\_POST\[''password''\];


    // Prepared query to prevent SQL injections


    $query = $connection->prepare("SELECT \* FROM users WHERE user=? AND password=?");


    $query->bind\_param("ss", $user,$password);


    $query->execute();


    $result = $query->get\_result();


    if ($result->num\_rows > 0) {


        // Authenticated user


        echo "Welcome, $user!";


    } else {


        // Invalid credentials


        echo "Invalid credentials";


    }


    $query->close();


    $conexion->close();


    ?>


    User Data Validation and Filtering:


    Make sure to validate and filter user data to prevent XSS (Cross-Site Scripting)
    attacks.


    Example of HTML Filtering (htmlspecialchars):


    <?php


    $username = $\_POST\[''username''\];


    // Filter input to prevent XSS


    $username = htmlspecialchars($username, ENT\_QUOTES, ''UTF-8'');


    echo "Hello, $username!";


    ?>


    Preventing CSRF (Cross-Site Request Forgery) Attacks:


    It uses CSRF tokens to prevent attacks where an attacker induces a user to perform
    unwanted actions on their behalf.


    Token Generation and Verification:


    <?php


    session\_start();


    function generateToken() {


        $token = bin2hex(random\_bytes(32));


        $\_SESSION\[''csrf\_token''\] = $token;


        return $token;


    }


    function verificarToken($token) {


        return isset($\_SESSION\[''csrf\_token''\]) && hash\_equals($\_SESSION\[''csrf\_token''\],
    $token);


    }


    // Generate a token in the form


    $token = generateToken();


    ?>


    <form action="process\_form.php" method="post">


        <!-- Other form fields -->


        <input type="hidden" name="csrf\_token" value="<?php echo $token; ?>">


        <button type="submit">Enviar</button>


    </form>


    In the script that processes the form (process\_form.php), verify the token before
    performing sensitive actions.


    <?php


    session\_start();


    $csrf\_token = $\_POST\[''csrf\_token''\];


    if (verificarToken($csrf\_token)) {


        // Valid token, process form


    } else {


        // Invalid token, handle error


    }


    ?>


    Practical exercises:


    Protection against SQL Injections:


    Modify an existing query in your application to use prepared queries.


    User Data Filtering:


    Implements HTML filtering on a form that receives user data.


    CSRF Prevention:


    Integrate CSRF token generation and verification into a form in your application.


    Safety must be a constant priority. By applying these practices, you will be strengthening
    the security of your PHP applications and protecting your users'' sensitive information.


    PHP Security - Preventing Common Attacks


    Security is a critical consideration in web development. In this chapter, we will
    cover the prevention of three common attacks: SQL injection, Cross-Site Scripting
    (XSS), and Cross-Site Request Forgery (CSRF). Let''s explore how to mitigate these
    risks in your PHP applications.


    SQL Injection:


    Practical example:


    Let''s say you have a login form:


    <?php


    // Assuming you already have a connection to the database ($conn)


    if ($\_SERVER\["REQUEST\_METHOD"\] == "POST") {


        $username = $\_POST\["username"\];


        $password = $\_POST\["password"\];


        // Vulnerable a SQL Injection


        $sql = "SELECT \* FROM users WHERE username=''$username'' AND password=''$password''";


        $result = mysqli\_query($conn, $sql);


        if (mysqli\_num\_rows($result) > 0) {


            echo "Login successful";


        } else {


            echo "Invalid credentials";


        }


    }


    ?>


    How to Prevent SQL Injection:


    Use prepared statements and parameters to prevent SQL injection.


    <?php


    // Using prepared queries


    if ($\_SERVER\["REQUEST\_METHOD"\] == "POST") {


        $username = $\_POST\["username"\];


        $password = $\_POST\["password"\];


        $sql = "SELECT \* FROM usuarios WHERE username=? AND password=?";


        $stmt = mysqli\_prepare($conn, $sql);


        mysqli\_stmt\_bind\_param($stmt, "ss", $username, $password);


        mysqli\_stmt\_execute($stmt);


        $result = mysqli\_stmt\_get\_result($stmt);


        if (mysqli\_num\_rows($result) > 0) {


            echo "Login successful";


        } else {


            echo "Invalid credentials";


        }


    }


    ?>


    Cross-Site Scripting (XSS):


    Practical example:


    Let''s imagine your app displays a custom message:


    <?php


    // Assuming $message comes from user input


    $message = $\_GET\["message"\];


    echo "<p>$message</p>";


    ?>


    How to Prevent XSS:


    Use the htmlspecialchars function to escape special characters.


    <?php


    $message = $\_GET\["message"\];


    echo "<p>" htmlspecialchars($message, ENT\_QUOTES, "UTF-8") . "</p>";


    ?>


    Cross-Site Request Forgery (CSRF):


    Practical example:


    Imagine that your application performs an action when a specific URL is accessed:


    <?php


    // Assuming an action is performed when accessing this script


    if ($\_GET\["action"\] == "performAction") {


        // Perform the action


    }


    ?>


    How to Prevent CSRF:


    Implement CSRF tokens in your forms and verify token validity on the server.


    <?php


    session\_start();


    // Generate CSRF token and store it in the session


    if (!isset($\_SESSION\["csrf\_token"\])) {


        $\_SESSION\["csrf\_token"\] = bin2hex(random\_bytes(32));


    }


    // Include the token in the form


    echo "<form action=''process\_form.php'' method=''post''>";


    echo "<input type=''hidden'' name=''csrf\_token'' value=''{$\_SESSION\["csrf\_token"\]}''>";


    echo "<input type=''submit'' value=''Enviar''>";


    echo "</form>";


    ?>


    In the processing script (process\_form.php), verify the token before taking important
    actions.


    These examples and practices provide you with a solid foundation to prevent common
    attacks on your PHP applications. Always remember to validate and sanitize user
    input and use best security practices at all times.


    Safe Use of Cookies and Sessions in PHP


    Secure cookie and session management is essential to ensure the security and integrity
    of web applications. In this chapter,we will explore how PHP makes it easier to
    work with cookies and sessions, and we''ll discuss best practices to mitigate
    potential vulnerabilities.


    Cookies and PHP:


    Cookies are small pieces of information that are stored in the user''s browser.
    In PHP, you can work with cookies using the superglobal variable$\_COOKIE.


    Practical example:


    Cookie Settings:


    <?php


    $name = "user";


    $valor = "John Doe";


    $expiry = time() + (86400 \* 30); // 30 days


    setcookie($name, $value,$expiry, "/");


    ?>


    This code sets a cookie called "user" with the value "John Doe" which will expire
    in 30 days.


    Reading Cookies:


    <?php


    if (isset($\_COOKIE\["user"\])) {


        $user = $\_COOKIE\["user"\];


        echo "Welcome back, $user!";


    } else {


        echo "Welcome for the first time!";


    }


    ?>


    Checks if the "user" cookie is present and displays a welcome message.


    Sessions in PHP:


    Sessions allow information to be stored on the server that is associated with
    a specific user. In PHP, sessions are managed through the superglobal variable$\_SESSION.


    Practical example:


    Login:


    <?php


    session\_start();


    $\_SESSION\["user"\] = "John Doe";


    $\_SESSION\["rol"\] = "admin";


