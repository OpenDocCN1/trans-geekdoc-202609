    \ A resource highlighting modern practices.\n\n## Glossary of Terms\n\nIn the\
    \ dynamic world of PHP development, understanding key terms is essential for effective\
    \ communication and collaboration. This glossary provides concise definitions\
    \ for PHP-related terms.\n\n`PHP (Hypertext Preprocessor)`: A server-side scripting\
    \ language designed for web development, commonly used to create dynamic pages.\n\
    \n`Server-side Scripting`: The execution of scripts on a web server rather than\
    \ on the user's browser, allowing dynamic content generation.\n\n`Syntax`: The\
    \ set of rules governing the structure of PHP code, specifying how commands and\
    \ statements should be written.\n\n`Variable`: A container for storing data, identified\
    \ by a unique name. Variables can hold various types of data, such as numbers,\
    \ strings, or arrays.\n\n`Array`: A data structure that stores multiple values\
    \ under a single variable name. Arrays can be indexed numerically or associatively.\n\
    \n`Function`: A reusable block of code that performs a specific task. Functions\
    \ help in organizing code and promoting code reusability.\n\n`HTML (Hypertext\
    \ Markup Language)`: The standard markup language for creating web pages and web\
    \ applications. PHP is often embedded in HTML.\n\n`Database`: A structured collection\
    \ of data stored electronically, typically organized to facilitate the retrieval\
    \ and manipulation of information. MySQL and PostgreSQL are common relational\
    \ database management systems.\n\n`AJAX (Asynchronous JavaScript and XML)`: A\
    \ technique for creating dynamic web pages that update content asynchronously\
    \ by exchanging small amounts of data with the server behind the scenes.\n\n`Object-Oriented\
    \ Programming (OOP)`: A programming paradigm that uses objects (instances of classes)\
    \ to structure and organize code. PHP supports OOP principles.\n\n`Error Handling`:\
    \ The process of identifying, catching, and responding to errors in a program.\
    \ Proper error handling improves code reliability and user experience.\n\n`Security`:\
    \ Measures taken to protect a PHP application from vulnerabilities and unauthorized\
    \ access. Common security practices include input validation, secure password\
    \ storage, and protection against SQL injection and cross-site scripting (XSS).\n\
    \n`Framework`: A pre-built set of tools, libraries, and conventions that facilitates\
    \ the development of web applications. Examples include Laravel, Symfony, and\
    \ CodeIgniter.\n\n`Best Practices`: Coding conventions and methodologies that\
    \ developers follow to produce high-quality, maintainable, and efficient code.\n\
    \n`Deployment`: The process of making a web application available for use. It\
    \ includes activities such as configuring the production environment, optimizing\
    \ performance, and ensuring security.\n\n`CRUD Operations`: Acronym for Create,\
    \ Read, Update, and Delete operations, representing the basic functions for persistent\
    \ storage in a database.\n"
  trans: '

    ## 术语表


    在 PHP 开发动态世界中，理解关键术语对于有效的沟通和协作至关重要。此术语表提供了 PHP 相关术语的简洁定义。


    `PHP (Hypertext Preprocessor)`：一种用于 Web 开发的端脚本语言，用于创建动态页面。


    `Server-side Scripting`：在服务器而非浏览器执行脚本，允许生成动态内容。


    `Syntax`：PHP 代码结构的规则，规定了命令和语句的编写方式。


    `Variable`：用于存储数据的容器，通过唯一名称标识。变量可以存储各种类型的数据，如数字、字符串或数组。


    `Array`：在单个变量下存储多个值的数据结构。数组可以是索引数组或关联数组。


    `Function`：执行特定任务的可重用代码块。函数有助于组织代码并提高重用性。


    `HTML (Hypertext Markup Language)`：创建网页和 Web 应用的标准标记语言。PHP 通常嵌入在 HTML 中。


    `Database`：电子存储结构化数据集合，通常组织得便于检索和操作。MySQL 和 PostgreSQL 是常见的关系型数据库管理系统。


    `AJAX (Asynchronous JavaScript and XML)`：一种创建动态网页的技术，通过在后台与服务器交换少量数据来更新内容。


    `Object-Oriented Programming (OOP)`：一种使用对象（类的实例）来组织代码的编程范式。PHP 支持 OOP 原则。


    `Error Handling`：识别、捕获和响应程序中错误的过程。良好的错误处理提高了代码的可靠性和用户体验。


    `Security`：保护 PHP 应用免受漏洞和未经授权访问的措施。常见的安全实践包括输入验证、安全密码存储以及防止 SQL 注入和跨站脚本 (XSS)。


    `Framework`：一组预构建的工具、库和约定，有助于 Web 应用开发。示例包括 Laravel、Symfony 和 CodeIgniter。


    `Best Practices`：开发者遵循以产生高质量、可维护且高效代码的规范和方法论。


    `Deployment`：使 Web 应用可用的过程。它包括配置生产环境、优化性能和确保安全等活动。


    `CRUD Operations`：创建（Create）、读取（Read）、更新（Update）和删除（Delete）操作的缩写，代表了数据库中持久化存储的基本功能。

    '
