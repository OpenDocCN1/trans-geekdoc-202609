    Connection to Databases with MySQL and MySQLi


    In this chapter,we will explore how to establish secure and efficient connections
    to MySQL databases using the standard MySQL and MySQLi extensions in PHP. The
    ability to interact with databases is essential for developing dynamic and scalable
    web applications.


    Connection with MySQL:


    MySQL is a popular and widely used database. To connect PHP with MySQL, we need
    the MySQL extension enabled. In many environments, this extension is already installed
    and activated.


    MySQL Connection Example:


    <?php


    $servername = "localhost";


    $username = "your\_username";


    $password = "your\_password";


    $database = "your\_database";


    // Create connection


    $conn = new mysqli($servername, $username, $password, $database);


    // Verify connection


    if ($conn->connect\_error) {


        die("Connection error: " . $conn->connect\_error);


    }


    echo "Successful connection to MySQL database";


    // Perform database operations here


    // Close connection


    $conn->close();


    ?>


    Connecting to MySQLi:


    MySQLi (MySQL Improved) is a newer extension and offers advantages over the traditional
    MySQL extension, such as support for prepared queries and transactions.


    MySQLi Connection Example:


    <?php


    $servername = "localhost";


    $username = "your\_username";


    $password = "your\_password";


    $database = "your\_database";


    // Create connection


    $conn = new mysqli($servername, $username, $password, $database);


    // Verify connection


    if ($conn->connect\_error) {


        die("Connection error: " . $conn->connect\_error);


    }


    echo "Successful connection to MySQLi database";


    // Perform database operations here


    // Close connection


    $conn->close();


    ?>


    Practical exercises:


    Connection and Basic Consultation:


    Connect to your MySQL database using the code provided.


    Perform a simple query to select some data from a table.


    Print the results in the browser.


    MySQLi Connection with Prepared Query:


    Modify the code to use MySQLi to perform a prepared query that selects records
    with a certain value.


    Print the results in the browser.


    Data Insertion:


    Create a new script that inserts data into a table in your database.


    Verify that the data has been inserted correctly.


    Updating and Deleting Data:


    Creates operations to update and delete data in the database.


    Verify that the operations have been carried out correctly.


    These exercises will allow you to become familiar with the basic operations of
    connecting and manipulating data in a MySQL database using PHP.


    Database Connection Configuration


    Most web applications require storing and retrieving data from a database. PHP
    provides several extensions for interacting with databases, with MySQLi (MySQL
    Improved) being a common option. In this chapter, we will learn how to configure
    a database connection and perform basic operations.


    Connection Configuration with MySQLi:


    Installing the MySQLi Extension:


    Make sure the MySQLi extension is enabled on your PHP installation. You can do
    this by checking the php.ini file or by running php -m on the command line.


    Database Credentials:


    Before connecting to the database, make sure you have the correct credentials
    (username, password, database name).


    Basic Connection:


    <?php


    // Database credentials


    $server = "localhost";


    $user = "your\_user";


    $password = "your\_password";


    $database = "your\_database";


    // Create a connection


    $conexion = new mysqli($servidor, $usuario, $contrasena, $base\_datos);


    // Verify the connection


    if ($conexion->connect\_error) {


        die("Connection failed: " . $connection->connect\_error);


    }


    echo "Connection successful";


    ?>


    Replace "your\_user", "your\_password", and "your\_database" with your own credentials.


    Run Queries:


    <?php


    // ... (connection code)


    // SQL query


    $query = "SELECT id, name, email FROM users";


    $result = $connection->query($query);


    // Check if the query was successful


    if ($result === false) {


        die("Query error: " . $connection->error);


    }


    // Process results


    while ($queue = $resultado->fetch\_assoc()) {


        echo "ID: " . $row\["id"\] . " | Name: " . $row\["name"\] . " | Email: " .
    $row\["email"\] . "<br>";


    }


    // Close the connection


    $conexion->close();


    ?>


    Practical exercises:


    Simple Connection and Consultation:


    Create a PHP file that connects to your database and retrieves simple information
    from a table.


    Data Insertion:


    Modify the above script to insert new data into the users table.


    Data update:


    Implements a function to update a specific user''s data in the database.


    Data Deletion:


    Adds the ability to delete a user based on their ID.


    Error Handling:


    Introduce error handling into your scripts, such as checking if the connection
    is successful and handling possible query errors.


    These exercises will familiarize you with database connection setup and basic
    CRUD (Create, Read, Update, Delete) operations in PHP.


    Basic SQL Queries with PHP


    Now that we have set up our development environment and are ready to work with
    databases, it''s time to explore basic SQL queries from PHP. SQL queries are essential
    for interacting with databases and retrieving or manipulating data. Let''s dive
    into some fundamental queries.


    Connection to the Database:


    Before performing queries, we must establish a connection with the database. Suppose
    we have set up a MySQL database. Here is an example of how you can connect PHP
    to MySQL:


    <?php


    $servername = "localhost";


    $username = "your\_username";


    $password = "your\_password";


    $database = "your\_database";


    // Create connection


    $conn = new mysqli($servername, $username, $password, $database);


    // Verify connection


    if ($conn->connect\_error) {


        die("Connection failed: " . $conn->connect\_error);


    }


    echo "Connection successful";


    ?>


    Basic SQL Queries:


    1\. Data Selection (SELECT):


    <?php


    // Query to select all records in a table


    $sql = "SELECT \* FROM usuarios";


    $result = $conn->query($sql);


    // Show results


    if ($result->num\_rows > 0) {


        while($row = $result->fetch\_assoc()) {


            echo "ID: " . $row\["id"\]. " - Name: " . $row\["name"\]. "<br>";


        }


    } else {


        echo "0 results";


    }


    ?>


    2\. Data Insertion (INSERT):


    <?php


    // Query to insert a new user


    $sql = "INSERT INTO users(name, email) VALUES(''Juan Perez'', ''juan@example.com'')";


    if ($conn->query($sql) === TRUE) {


        echo "New user created successfully";


    } else {


        echo "Error: " . $sql . "<br>" . $conn->error;


    }


    ?>


    3\. Data Update (UPDATE):


    <?php


    // Query to update a user''s name


    $sql = "UPDATE users SET name=''Juanito'' WHERE id=1";


    if ($conn->query($sql) === TRUE) {


        echo "Username updated successfully";


    } else {


        echo "Error updating: " . $conn->error;


    }


    ?>


    4\. Data Deletion (DELETE):


    <?php


    // Query to delete a user


    $sql = "DELETE FROM usuarios WHERE id=1";


    if ($conn->query($sql) === TRUE) {


        echo "User successfully deleted";


    } else {


        echo "Error deleting: " . $conn->error;


    }


    ?>


