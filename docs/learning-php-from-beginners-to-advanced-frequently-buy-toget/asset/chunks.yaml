    These exercises will help you understand and apply operators in PHP.


    Control Structures (if, else, switch)


    In this chapter, wewe will immerse in the control structures in PHP, which allow
    us to make decisions and perform conditional actions in our programs. We will
    learn about if, else, and switch statements and how to use them to control the
    flow of execution of our code.


    if statement:


    The if statement allows us to execute a block of code if a condition is true.
    If the condition is false, the block will not be executed.


    <?php


    $age = 25;


    if ($age >= 18) {


        echo "You are of legal age.";


    }


    ?>


    else statement:


    Sentence Else allows us to execute a block of code if the condition in the if
    statement is false.


    <?php


    $age = 15;


    if ($age >= 18) {


        echo "You are of legal age.";


    } else {


        echo "You are a minor.";


    }


    ?>


    elseif statement:


    Sentence Elseif allows us to evaluate multiple conditions in order.


    php


    Copy code


    <?php


    $use = 85;


    if ($nota >= 90) {


        echo "Excellent.";


    } elseif ($note >= 70) {


        echo "Good job.";


    } else {


        echo "You need to improve.";


    }


    ?>


    Switch statement:


    The switch statement allows us to compare an expression against several possible
    values ​​and execute code based on the match.


    <?php


    $day = "Monday";


    switch ($dia) {


        case "Monday":


            echo "Beginning of the week.";


            break;


        case "Friday":


            echo "Friday, finally!";


            break;


        default:


            echo "Common day.";


    }


    ?>


    Practical exercises:


    Even Number Verifier:


    Create a program that takes a number as a variable.


    Use an if structure to determine if the number is even or odd.


    Prints a message indicating the result.


    Basic Calculator:


    Create a program that takes two numbers and an operation as variables.


    It uses a switch structure to perform the operation (addition, subtraction, multiplication,
    division) and display the result.


    Age Classification:


    Create a program that classifies a person into the following categories based
    on their age: child, teenager, adult.


    Use a structure elseif to manage the different categories.


    Weekday:


    Create a program that takes a day of the week as a variable.


    It uses a switch structure to print a different message depending on the day.


    These exercises will help you understand and apply control structures in PHP.


    Bucles (for, while, do-while)


    Loops are a fundamental part of any programming language and are essential for
    repeating tasks efficiently. In PHP, we have three main types of loops: for, while,
    and do-while. We are going to explore each of them with practical examples and
    some exercises to reinforce the concepts.


    Bucle for:


    The for loop is used when we know exactly how many times we want to repeat a task.


    <?php


    // For loop example: print numbers 1 to 5


    for ($i = 1; $i <= 5; $i++) {


        echo $i . " ";


    }


    ?>


    Bucle while:


    Loop While It is executed as long as a condition is true. It is useful when we
    do not know how many times the task will be repeated.


    <?php


    // While loop example: print numbers 1 to 5


    $i = 1;


    while ($i <= 5) {


        echo $i . " ";


        $i++;


    }


    ?>


    Bucle do-while:


    The do-while loop is similar to the while loop, but it ensures that the task is
    executed at least once, since the condition is evaluated after the execution of
    the code block.


    <?php


    // Do-while loop example: print numbers 1 to 5


    $i = 1;


    do {


        echo $i . " ";


        $i++;


    } while ($i <= 5);


    ?>


    Practical exercises:


    Multiplication table:


    Using a for loop, print the multiplication table for 5 (5 to 50).


    Countdown Counter:


    Use a while loop to print a countdown from 10 to 1.


    Sum of Even Numbers:


    Use a do-while loop to calculate the sum of the first 10 even numbers.


    Pattern Generator:


    Create a program that prints the following pattern using loops:


    \*


    \* \*


    \* \* \*


    \* \* \* \*


    \* \* \* \* \*


    These exercises will help you practice and better understand the syntax and operation
    of loops in PHP.


    Functions in PHP


    Functions are reusable blocks of code that perform specific tasks. In this chapter,
    we will explain how to define, call and work with functions in PHP. We will also
    discuss the scope of variables and some useful predefined functions.


    Definition and Calling of Functions:


    A function is defined with the function keyword. Here is a basic example:


    <?php


    function greet($name) {


        echo "Hello, $name!";


    }


    // Function call


    greet("John");


    ?>


    In this example, the greet function takes a parameter $name and prints a custom
    greeting. Calling the function with the argument "John" will display "Hello, John!"


    Scope of Variables:


    Variables can have local or global scopes. A variable declared inside a function
    has local scope and is not accessible outside that function. Example:


    <?php


    function example() {


        $variable\_local = "This is a local variable";


        echo $variable\_local;


    }


    // This will generate an error since$variable\_local not defined here


    echo $variable\_local;


    ?>


    Predefined Functions:


    PHP provides many predefined functions that make various tasks easier. For example,
    the strlen function returns the length of a string:


    <?php


    $string = "Hello, World!";


    $length = strlen($string);


    echo "The length of the string is: $length";


    ?>


    Practical exercises:


    Basic Calculator:


    Create a function called calculator that takes two numbers and an operator as
    parameters and performs the corresponding operation (addition, subtraction, multiplication,
    division). Print the result.


    Greetings Generator:


    Create a function calledgenerate\_greeting that takes a name and an optional greeting
    as parameters. If the greeting is not provided, you should use a default greeting.
    Print the greeting.


    Word Counter:


    Create a function calledcount\_words which takes a string as a parameter and returns
    the number of words in that string.


    Password Validation:


    Create a function calledvalidate\_password that takes a password as a parameter
    and returns true if it meets certain criteria (e.g. minimum length, case usage,
    numbers, etc.), and false otherwise.


    Definition and Calling of Functions in PHP


    In programming, functions are reusable blocks of code that perform specific tasks.
    In PHP, defining and calling functions are essential to organize and modularize
    your code. In this chapter,we will explore how to create and use functions in
    PHP.


    Definition of Functions:


    A function in PHP is defined with the function keyword. Here is a simple example:


    <?php


    function greet() {


        echo "Hello, World!";


    }


    ?>


    In this example, we have defined a function called greet that prints "Hello, World!"
    when it is called.


    Function Call:


    Once you''ve defined a function, you can call it from anywhere in your code. Here
    is how to call the greet function:


    <?php


    greet(); // Output: Hello, World!


    ?>


    Function Parameters:


    Functions can accept parameters to be more flexible. Let''s modify the greet function
    so that it accepts a name as a parameter:


    <?php


    function greetWithName($name) {


        echo "Hello, $name!";


    }


    ?>


    Now, when calling this function, you need to provide a name:


    <?php


    greetWithName("Juan"); // Output: Hello, Juan!


    greetWithName("Maria"); // Output: Hello, Maria!


    ?>


    Return Value:


    Functions can also return a value. Let''s modify our function so that it returns
    a greeting instead of printing it directly:


    <?php


    function getGreeting($name) {


        return "Hello, $name!";


    }


    ?>


    When you call this function, you can capture the return value and use it:


    <?php


    $greeting =getGreeting("Carlos");


    echo $greeting; // Output: Hello, Carlos!


    ?>


    Practical exercises:


    Simple Calculator:


    Create a function called calculator that accepts two numbers and an operation
    (addition, subtraction, multiplication, division).


    The function must perform the operation and return the result.


