  trans: "\n\n在现代 Web 开发中，异步通信在提升用户体验方面起着至关重要的作用。在本章中，我们将探索 PHP 如何通过 AJAX 与客户端进行异步交互。\n\
    \n# AJAX：引言\n\nAJAX（异步 JavaScript 和 XML）是一种技术，允许 Web 应用程序异步地从服务器发送和接收数据，而无需重新加载整个页面。这是通过结合\
    \ JavaScript、XML（尽管现在 JSON 更常见）以及 `XMLHttpRequest` 的异步能力实现的。\n\n## 实际示例：动态内容加载\n\
    \n让我们想象这样一个场景：我们希望在页面上加载新消息，而不需要在每次有人发送消息时重新加载页面。我们将使用 AJAX 实现这一目标。\n\n### HTML\
    \ (index.html):\n\n```html\n<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n    <meta\
    \ charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width,\
    \ initial-scale=1.0\">\n    <title>异步通信</title>\n</head>\n<body>\n<div id=\"chat\"\
    >\n    <!-- 消息将在这里显示 -->\n</div>\n<form id=\"messageForm\">\n    <input type=\"\
    text\" id=\"message\" placeholder=\"输入您的消息\">\n    <button type=\"button\" onclick=\"\
    sendMessage()\">发送</button>\n</form>\n<script src=\"script.js\"></script>\n</body>\n\
    </html>\n```\n\n### JavaScript (script.js):\n\n```javascript\nfunction loadMessages()\
    \ {\n    // 我们创建了一个 XMLHttpRequest 对象\n    var xhr = new XMLHttpRequest();\n \
    \   // 配置向 mensajes.php 文件的 GET 请求\n    xhr.open('GET', 'mensajes.php', true);\n\
    \    // 定义请求完成后执行的函数\n    xhr.onload = function () {\n        if (xhr.status >=\
    \ 200 && xhr.status < 300) {\n            // 请求成功，我们更新 div 的内容\n            document.getElementById('chat').innerHTML\
    \ = xhr.responseText;\n        }\n    };\n    // 发送请求\n    xhr.send();\n}\n\n\
    function sendMessage() {\n    var message = document.getElementById('message').value;\n\
    \    // 我们创建了一个 XMLHttpRequest 对象\n    var xhr = new XMLHttpRequest();\n    //\
    \ 配置向 send_message.php 文件的 POST 请求\n    xhr.open('POST', 'send_message.php', true);\n\
    \    xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');\n\
    \    // 定义请求完成后执行的函数\n    xhr.onload = function () {\n        if (xhr.status >=\
    \ 200 && xhr.status < 300) {\n            // 请求成功，我们加载新消息\n            loadMessages();\n\
    \        }\n    };\n    // 将消息作为参数发送请求\n    xhr.send('message=' + encodeURIComponent(message));\n\
    }\n// 页面加载时加载消息\nloadMessages();\n```\n\n### PHP (messages.php):\n\n```php\n<?php\n\
    // 模拟从数据库获取消息\n$messages = array(\n    \"你好，你好吗？\",\n    \"这里一切都好！\",\n    \"\
    这是一条测试消息。\"\n);\n// 以 HTML 格式返回消息\nforeach ($messages as $message) {\n    echo\
    \ \"<p>$message</p>\";\n}\n?>\n```\n\n### PHP (send_message.php):\n\n```php\n\
    <?php\n// 模拟在数据库中接收和存储消息\nif (isset($_POST['mensaje'])) {\n    $newMessage = $_POST['message'];\n\
    \    // 处理新消息（例如保存到数据库中）\n    // ...\n    // 返回成功响应\n    echo \"消息发送成功\";\n} else\
    \ {\n    // 如果未提供消息，则返回错误消息\n    echo \"错误：消息为空\";\n}\n?>\n```\n\n## 实际练习\n\n\
    ### 聊天功能扩展：\n- 修改代码，使聊天显示每条消息的发送者和时间。\n- 实现消息发送功能，使发送者也发送。\n\n### 外部内容上传：\n- 创建一个新的\
    \ `news.php` 文件，其以 HTML 格式返回最新新闻。\n- 修改主页，在点击按钮时动态加载新闻。\n\n### 错误处理：\n- 改进发送消息时的错误处理。出现问题时在页面上显示错误消息。\n\
    \n# PHP 和 AJAX - 无需刷新的 Web 页面\n\n无需刷新的页面刷新技术（通常被称为 AJAX，异步 JavaScript 和 XML）允许你在后台加载或向服务器发送数据，而无需重新加载整个页面，从而提升用户体验。在本章中，我们将探索如何将\
    \ AJAX 与 PHP 集以实现动态更新。\n\n## AJAX 简介：\n\nAJAX 使用 JavaScript 向服务器发送异步请求，并在不重新加载整个页的情况下处理响应。让我们创建一个简单的示例来理解它的工作原理。\n\
    \n## 实际示例\n\n### 文件结构：\n```\n/project-ajax\n├── index.php\n├── update.php\n└──\
    \ script.js\n```\n\n### index.php:\n\n```html\n<!DOCTYPE html>\n<html lang=\"\
    es\">\n<head>\n    <meta charset=\"UTF-8\">\n    <title>AJAX 更新</title>\n    <script\
    \ src=\"https://code.jquery.com/jquery-3.6.4.min.js\"></script>\n    <script src=\"\
    script.js\"></script>\n</head>\n<body>\n    <h1>计数器：<span id=\"counter\">0</span></h1>\n\
    \    <button onclick=\"incrementCounter()\">增加</button>\n</body>\n</html>\n```\n\
    \n### script.js:\n\n```javascript\nfunction incrementCounter() {\n    // 向服务器发送\
    \ AJAX 请求\n    $.ajax({\n        type: \"POST\",\n        url: \"update.php\"\
    ,\n        data: { reset: true },\n        success: function(response) {\n   \
    \         // 更新页面上的计数器\n            $(\"#counter\").text(response);\n        }\n\
    \    });\n}\n```\n\n### update.php:\n\n```php\n<?php\n// 模拟服务器处理（你可以执行复杂的操作）\n\
    session_start();\nif (isset($_POST['reset'])) {\n    $_SESSION['contador'] = 0;\n\
    }\n$_SESSION['contador']++;\n// 返回新值\necho $_SESSION['contador'];\n```\n\n## 练习：\n\
    - 在 `update.php` 中实现功能，当发送特定请求时将计数器重零。在 `index.php` 中添加一个调用 `incrementCounter()`\
    \ 的按钮。这将帮助你理解如何使用 AJAX 和 PHP 处理操作。\n\n# PHP 中的面向对象编程\n\n面向对象编程（OOP）是一种围绕对象组织的开发方法，对象是类的实例。PHP\
    \ 完全支持面向对象，在本章中，我们将探索面向对象的基础以及如何实现它。\n\n## 面向对象基础：\n\n面向对象基于四个核心概念：\n- **类 (Classes)**：创建对象的模板。定义了该类型对象共有的属性和方法。\n\
    - **对象 (Objects)**：类的实例。每个对象都有自己的属性并可以执行自己的方法。\n- **属性 (Properties)**：与类或对象相关的变量。\n\
    - **方法 (Methods)**：与类或对象相关的函数。\n\n## 实际示例：\n\n```php\n<?php\n// 定义一个类\nclass Car\
    \ {\n    // 属性\n    public $mark;\n    public $model;\n    public $color;\n\n\
    \    // 构造函数\n    public function __construct($marca, $modelo, $color) {\n   \
    \     $this->mark = $marca;\n        $this->model = $modelo;\n        $this->color\
    \ = $color;\n    }\n\n    // 获取汽车信息的方法\n    public function getInformation() {\n\
    \        return \"Coche: {$this->mark} {$this->model}, 颜色: {$this->color}\";\n\
    \    }\n}\n\n// 创建对象\n$coche1 = new Car(\"Toyota\", \"Corolla\", \"红色\");\n$coche2\
    \ = new Car(\"Honda\", \"Civic\", \"蓝色\");\n\n// 访问属性\necho $coche1->mark;\n?>\n\
    ```\n\n"
