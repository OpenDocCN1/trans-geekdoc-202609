    \ never be printed.\";\n} catch (Exception $e) {\n    //Handle the exception\n\
    \    echo \"Error: \" . $e->getMessage();\n} finally {\n    echo \"Operation completed.\"\
    ;\n}\n```\n\n### 2. Customize Exceptions for Specific Context:\n```php\nclass\
    \ MiExcepcion extends Exception {\n    public function __construct($message, $code\
    \ = 0, Exception $anterior = null) {\n        parent::__construct($message,$code,\
    \ $anterior);\n    }\n    public function __toString() {\n        return __CLASS__\
    \ . \": [{$this->code}]: {$this->message}\\n\";\n    }\n}\n\ntry {\n    throw\
    \ new MiExcepcion(\"This is a custom message.\", 42);\n} catch (MiExcepcion $e)\
    \ {\n    echo $e;\n}\n```\n\n### 3. Log Errors in a Log File:\n```php\n// Configuration\
    \ to log errors to a file\nini_set(\"log_errors\", 1);\nini_set(\"error_log\"\
    , \"/ruta/al/archivo-de-registro.log\");\n\n// Code that could generate an error\n\
    $result = 10 / 0;\n```\n\n### 4. Show Custom Error Pages in Production:\n```php\n\
    // Setting to show errors only in development\nini_set(\"display_errors\", 0);\n\
    ini_set(\"display_startup_errors\", 0);\n\n// Configuration to log errors to a\
    \ file\nini_set(\"log_errors\", 1);\nini_set(\"error_log\", \"/ruta/al/archivo-de-registro.log\"\
    );\n```\n"
  trans: "\n\n```php\npublic function establishModel($model) {\n    $this->model =\
    \ $model;\n}\n}\n\nclass Car extends Vehicle {\n    public function arrancar()\
    \ {\n        return \"Starting the car\" . $this->model;\n    }\n}\n\nclass Motorcycle\
    \ extends Vehicle {\n    public function arrancar() {\n        return \"Starting\
    \ the motorcycle\" . $this->model;\n    }\n}\n\n// 抽象的使用\n\n$car = new Car();\n\
    $coche->establishModel(\"Toyota\");\n\necho $car->boot();\n\n$moto = new Moto();\n\
    $moto->establishModel(\"Honda\");\n\necho $moto->start();\n\n?>\n```\n\n## 实际练习：\n\
    \n### 封装\n- 创建一个 `Book` 类，并包含 `title`（标题）、`author`（作者）和 `publication year`（出版年份）的私有属性。\n\
    - 实现获取和设置这些属性的公共方法。\n- 创建类的实例并显示书籍信息\n\n### 抽象\n- 定义一个抽象类 `Figure`，包含一个抽象方法 `Calculation()`。\n\
    - 实现具体的类来表示 `square`（正方形）和 `circle`（圆形），它们继承自 `Figure` 类。\n- 计算并显示每个图形的面积。\n\n\
    这些练习将帮助你练习并理解 PHP 中的封装和抽象概念。\n\n## PHP 中的错误与异常处理\n\n在任何应用程序开发中，遇到错误都是不可避免的。在本章中，我们将探索\
    \ PHP 中的错误类型以及如何有效地管理它们，以提高应用程序的健性和稳定性。\n\n### PHP 中的错误类型：\n在 PHP 中，错误分为三大类：\n\
    \n1. **语法错误 (Syntactic Errors)**：当代码结构出现问题时发生。这些错误会阻止脚本正确运行，并在代码分析期间被标记。例如：\n\
    ```php\n<?php\n// 语法错误：末缺少分号\necho \"Hello, World\"\n?>\n```\n\n2. **逻辑或执行错误 (Logical\
    \ or Execution Errors)**：这些错误不会阻止脚本运行，但可能导致程序出现意外或错误的行为。它们更为微妙，需要更深层次的分析。例如：\n\
    ```php\n<?php\n// 逻辑错误：除以零\n$numerator = 10;\n$denominator = 0;\n$result = $numerator\
    \ / $denominator;\necho $result;\n?>\n```\n\n3. **运行时错误 (Runtime Errors)**：这些错误在脚本执行期间发生，严重程度不一。它们可以是警告（warning）、通知（notification）或停止脚本执行的致命错误（fatal\
    \ error）。例如：\n```php\n<?php\n// 运行时错误：尝试访问不存在的索引\n$arr = array(1, 2, 3);\necho\
    \ $arr[4];\n?>\n```\n\n### PHP 中的错误处理：\n为了处理错误，PHP 提供了 `try...catch` 结构来处理异常。这允许以控制的方式检测并响应特定的错误。\n\
    \n```php\n<?php\ntry {\n    // 可能会产生异常的代码\n    $result = 10 / 0;\n    echo $result;\n\
    } catch (Exception $e) {\n    // 异常处理\n    echo \"发生了一个异常：\". $e->getMessage();\n\
    }\n?>\n```\n\n### 实际练习：\n- **语法错误**：在脚本中输入语法错误并观察错误信息。纠正错误。\n- **逻辑错误**：创建一个包含逻辑错误的脚本。运行脚本并查看错误的输出。识别并纠正错误。\n\
    - **运行时错误**：在脚本中引入运行时错误。使用 `try...catch` 处理异常并提供自定义消息。\n- **通用错误处理**：修改你的脚本以包含一个捕获任何通用异常的\
    \ `try...catch` 块。在发生错误时打印信息提示。\n\n通过练习这些练习，你将获得识别和处理 PHP 中不同类型错误的经验，提高应用程序的质量和可靠性。\n\
    \n## PHP 中的异常捕获与处理\n\n在应用开发中，预测错误是至关重要的。PHP 提供了一套异常系统，允许你以优雅的方式处理潜在错误。\n\n###\
    \ 捕获异常：\n在 PHP 中，异常是由 `Exception` 类或其派生类表示的。可以使用 `try`、`catch` 和 `finally` 来捕获。这里是一个基础示例：\n\
    \n```php\ntry {\n    // 可能会抛出异常的代码\n    $result = 10 / 0;\n} catch (Exception\
    \ $e) {\n    // 处理异常\n    echo \"异常已捕获\";\n} // 无论是否抛出异常，此块都会执行\n    echo \"finally\
    \ 已执行!\";\n}\n```\n\n### 创建自定义异常：\n你可以为特定情况创建自己的异常类。例如：\n\n```php\nclass Micepcion\
    \ extends Exception {\n    public function __construct($message = \"\", $code\
    \ = 0, Exception $anterior = null) {\n        parent::__construct($message,$code,\
    \ $anterior);\n    }\n}\n\ntry {\n    throw new Micepcion(\"自定义消息\", 42);\n} catch\
    \ (Micepcion $e) {\n    echo $e;\n}\n```\n\n### 实际练习：\n- **带异常的除法**：创建一个除零时抛出异常的函数。\n\
    - **年龄验证**：编写一个验证年龄的函数。如果年龄小于 18 则抛出异常。\n- **文件管理**：编写一个尝试打开不存在文件的脚本。\n- **自定义异常**：当用户尝试访问无权限资源时创建一个新的自定义异常。\n\
    \n"
