  \ 479–501. Robins, S. (2014b). 快节奏时代的慢行动：种族隔离后媒体奇观的政治。*Journal of Southern African\
  \ Studies*, *40*(1), 91–110. Turok, I., & Watson, V. (2001). 南非城市的分化发展：开普敦面临的战略挑战。*Urban\
  \ Forum*, *12*(2),119–138. Watson, V. (2014). 非洲城市幻想：梦想还是噩梦？*Environment and Urbanization*,\
  \ *26*(1), 215–231.     1. 检索自[`stopthesale.net/occupation/`](https://stopthesale.net/occupation/)\n\
  \n\n\n\n本章探讨了替代性的参与式共同创造方法是否具有部署一种解放性城市主义的，以对抗（数字）资本主义的城市动态。本文通过关注巴塞罗纳案例进行了探讨。巴塞罗纳在\
  \ 2011 年全面拥抱了“智能公民”方法，成为欧洲智能城市战略的标杆。然而，2015 年，随着新市政府的上台，巴塞罗纳通过其“技术主权”战略，将自己定位为挑战“智能城市”并处于替代方案性的前沿。\n\
  \n这一转变旨在通过新的数字和平台技术推进信息情权，并确保开放、透明和参与式的决策制定，从而为公民重塑智能城市议程。本章首先认为，“技术主权”在使（智能）公民身份和技术概念重新政治化方面发挥了作用，部署了旨在重新获得数据公共控制以及让公民参与政策制定的倡议。其次，巴塞罗纳的技术主权战略虽然被框架为本地和自下而上的，但其基础是对全球数字资本主义动态的全球理解和诊断。然而，有时对于数字技术仍然持有一种过于乐观的态度。因此，对于任何新自由主义智能城市的替代方案，都有必要将辩论从技术本身或局部去中心化，并认识到任何解放性战略也意味着承认技术主导的解决方案并不独立于广泛的生产关系以及复杂的政治经济地理。\n\
  \n**关键词**：智能公民；技术主权；城市治理；智能城市权；巴塞罗纳；替代性城市政策\n\n### 引言\n\n\n\n\n随着智慧城市策略在全球范围内传播并巩固，学术界已形成日益共识，即理解智慧城市的核心逻辑根植于新自由主义的城市重构策略：它倾向于大型科技公司和咨询公司的私人经济利益，而非公民；并通过将社会问题简化为可以通过妥善利用技术和市场友好解决方案来解决的技术挑战，从而使城市治理去政治化。简而言之，在对社会和城市治理的技术乐观主义和技术决定论观点的驱动下，智慧城市正在为少数人而非大多数人再生产一个新自由主义的城市（Datta,\
  \ 2015; Greenfield, 2013; Hollands, 2008; March & Ribera-Fumaz, 2016）。\n\n然而，正如\
  \ Cardullo 和 Kitchin (2018) 指出的，最新一代智慧城市策略已将重心转向重新思考和设计以公民或社区为领导的倡议，这些项目希望更具包容性并让公民更多参与。这种新逻辑被\
  \ `MIT` `SENSEable City Lab` 主任 `Carlo Ratti`（见 Almirall et al, 2016, pp. 142–143）总结为：我认为市政当局开始理解这种方法的重要性。大多数城市转型是不同参与者（政府、行业等）共同努力的结果。我们认为，公民特别应该通过“自下而上”的动态发挥关键作用。因此，政府与其过度关注硬件的安装和控制——即固定、静态的“感知系统”——不如让人们对阅读应用程序和自己使用数据感到兴奋更为重要。如果我们能开发出正确的平台，人们就可以成为解决城市问题的人。在这方面，与部署监控基础设施和集中式软件相关的典型昂贵智慧城市项目，正日益被小规模、自下而上的项目所补充。这些方法背离了将城市视为企业社会创新实验室的愿景（其中公民仅是这些实验的组成部分），转变为公民成为创新的共同生产者，将焦点从智慧*城市*转向了智慧*公民*。\n\
  \n可能性的，这种“活态实验室”的愿景通过 `Fablabs` 的公民参与方法得到了最好的体现：即公民可以使用软件和硬件来“制造（几乎）一切”的空间，正如 `Fablab`\
  \ 的口号所称。¹ 因此，城市可以依靠“将生产能力归还给城市的力量——即通过嵌入城市织理并与公民连接的微型工厂[即 Fablabs]——来重新设计” (Diez,\
  \ 2012, p. 465)。在这些空间里，公民可以解决当地挑战，同时又与全球分布的知识相连。这种在智慧城市框架内对公民赋权和自下而上倡议的赞誉做法，不仅得到了世界各地城市的积极倡导，还得到了国际组织的支持，如\
  \ `联合国` (`UN-Habitat`, 2016, 2017)、`世界银行` (Eskelinen, Garcia Robles, Lindy, Marsh,\
  \ & Muente-Kunigami, 2015)，或通过其“智慧城市与社区欧洲创新伙伴计划”的 `欧盟`；智库如 `NESTA` 或 `世界经济论坛`，以及公司和咨询公司（`CISCO`、`IBM`、`PwC`\
  \ 等）。\n\n尽管欢迎这种让公民共同生产智慧城市的积极吸纳，但这些策略并未挑战，而是补充了现有的智慧城市话语。换句话说，它们并没有挑战智慧城市及其所动员的共同创造方法背后的新自由主义方法（Kitchin,\
  \ 2015; Smith, 2012）。相比之下，新的愿景和倡议正在出现，它们并非试图重塑智慧城市，而是将其彻底颠覆。这包括设立概念下的方法和倡议：开源城市主义（Corsin,\
  \ 2014）、共享城市（Agyeman & McLaren, 2015）、去增长主义（March, 2018）、公社（Cardullo, 本卷）、基层创新（Smith,\
  \ Fressoli, Abrol, Arond, & Ely, 2017）或技术主权（Morozov & Bria, 2018）。这一系列方法在新的方式推进技术和数据生产、管理、共享和使用方面，与“智慧公民”的观点不同。在这方面，它们共享一个基于开发更民主的城市技术和治理模型的愿景。\n\
  \n然而，所有这些愿景与后期的智慧公民发展有着共同点，即都是自下而上、参与性且以共同创造为中心的；在许多情况下，这些倡议与“智慧公民”愿景下的倡议非常相似——尽管它们来自不同的政治经济框架。从这个意义上说，越来越多的文献批判性地探索了这些方案可以持续的政治经济条件，并将智慧城市转化为大众而非少数人的城市，或者它们可能会被新自由主义逻辑所收编（例如，Agyeman\
  \ & McLaren, 2015; Arboleda, 2017; Cardullo, 2018）。在此背景下，本章遵循 `Kitchin`、`Cardullo`\
  \ 和 `di Feliciantonio` (2019; 本卷)，质问替代性的参与性共同创造方法是否有潜力部署一种解放性的城市主义，以对抗（数字）资本主义的城市动态。\n\
  \n这是通过关注巴塞罗那案例实现的。`巴塞罗那` 在 2011 年全面采用了“智慧公民”方法，成为智慧城市策略的欧洲标杆。事实上，2014 年，`欧盟` 授予该市首届欧洲创新之奖\
  \ `iCApital`，正是因为其“引入新技术以使城市更贴近公民” (`EC`, 2014; 在线)。然而，自 2015 年以来，随着新市政府的到来，`巴塞罗那`\
  \ 将自己置于挑战智慧城市的前沿，处于替代性的中心，通过其技术主权策略寻求重新构建并利用智慧城市技术来实施激进民主（Gessen, 2018）。\n\n\n\n\
  \n巴塞罗纳智慧城市战略的部署可以追溯到 2000 年代末，当时由社会党（加泰罗尼亚语缩写为 PSC）和加泰罗尼亚-绿色倡议（ICV）组成的左翼联盟地方政府领导。然而，直到\
  \ 2011 年 Trias 市长的右翼民族主义政府上任，巴塞罗纳才完全拥抱了智慧城市的福音。\n\n在这种背景下，智慧城市战略被置于城市首席建筑 Vicente\
  \ Guallart（March & Ribera-Fumaz, 2016）和副市长 Antoni Vives（2017）的愿景下，对互联网拓扑下的流、对象与公民之间的关系和组织安排进行更广泛的话语重构。总之，这个被市政府推广为智慧战略的自给自足项目，旨在将\
  \ ICT 和互联网拓扑整合为城市的关键秩序原则，赋能公民，同时提高效率并开启新的城市经济范式和自下而上的社会创新。\n\n事实上，针对这种对未来城市的理论理解，巴塞罗纳拥有一个确切的路线图：它应该利用数字技术向信息城市演变，首先通过试点项目进行，然后将其应用于整个城市。这种模式旨在引导一个自给自足（能源角度上）的城市，拥有基于本地物质生产和全球无形服务、解决方案及设计交换的经济，这些设计可在其他地区进行重新应用。首席建筑师恳请“一种网络化城市的新模式，在超连接的零排放城市内，拥有以人类速度运行的自给自足且高效社区”（Guallart,\
  \ 2012, p. 31）。或者，用市政府的新口号来说，就是“智慧城市中的许多慢城市”。这一口号的核心是通过技术改进来赋能公民，换句话说，就是将技术解决方案主义作为赋能的手段（Morozov,\
  \ 2014）。因此，启动了一些新的实验性项目，旨在将公民置于智慧城市的中心。旗舰项目包括 Fabcity、数字制造学院事馆（DFA）、Vincles 和 Sentilo（见表\
  \ 13.1）。\n\n#### 表 13.1. 巴塞罗纳智慧公民旗舰项目。\n\n| 项目 | 描述 |\n| :--- | :--- |\n| FabCity\
  \ | 通过循环经济和赋能公民与城市，开发本地生产和全球连接的自给自足城市（涉及全球 12 个城市、一个地区和两个国家）。由 Trias 市于 2014 年启动，由加泰罗尼亚高级建筑学院、MIT\
  \ 比特与原子中心以及 Fab 基金会领导。2016 年，巴塞罗纳放弃了该项目，但资助并支持了 Poblenou Makers 区，FabCity 项目在社区规模上得以开展。来源：[`fab.city`](http://fab.city)\
  \ |\n| Digital Fabrication Athenaeums | 市级创客空间旨在通过参与数字制造来赋能公民。2013 年 7 月和 8 月开放了前三个学院事馆。2013\
  \ 年 8 月，居民占领了 Ciutat Meridiana 的一个学院事馆，并将其转换为社区食品银行。2014 年对 DFAs 进行了重新定义。目前还有两个在计划中。来源：[`ateneusdefabricacio.barcelona.cat`](http://ateneusdefabricacio.barcelona.cat)\
  \ |\n| Vincles | 一款平板电脑应用，让 65 岁以上的独居老人能够取得联系并加强纽带，同时在线和线下建立新联系。2014 年彭博市长挑战赛奖者。2017\
  \ 年 1 月至 5 月在 5 个社区进行试点；自 2017 年 6 月起已应用于城市所有区的所有社区。来源：[`ajuntament.barcelona.cat/vinclesbcn/en`](http://ajuntament.barcelona.cat/vinclesbcn/en)\
  \ |\n| Sentilo | 一个收集城市和公民环境传感器数据的开源平台。由巴塞罗纳于 2012 年创建，现在是一个涉及其他城市的大都市项目。来源：[`www.sentilo.io/xwiki/bin/view/Sentilo.About.Product/Whatis`](http://www.sentilo.io/xwiki/bin/view/Sentilo.About.Product/Whatis)\
  \ |\n\n在话语上，巴塞罗纳将公民置于智慧城市的中心。然而，上述项目要么将公民视为用户（`Vincles`），要么没有开始开发公民参与（`FabCity`），要么公民参与度低（`Sentilo`），要么它们制造了冲突和反对（`DFA`）。总而言之，这是一个在纸面上从智慧城市转向智慧公民的案例，但“以公民为中心”的倡议在实践中仍未充分发展：这些倡议被设计为以公民为中心，但实际上部署时最多是形式主义的、最是消费主义的参与（Cardullo\
  \ & Kitchin, 2018）。此外，这些发展仅成为更广泛的公私合作城市管理操作的一部分。这涉及与`Cisco`、`Schneider`、`Suez`或`Endesa`等技术供应商签订“标准”智慧城市合同。例如，自给自足战略的核心是创建一个控制智慧城市的城市操作系统（`City\
  \ OS`）。2015 年 4 月，开发`City OS`的合同被交给了`Accenture`、`Tradia Telecom`、`Sinovia`（`Suez`）和`Cofely\
  \ España`（`Suez`）的合资企业（El Periódico, 2017）。然而尽管存在这种明显的矛盾，替代性的数字基层社会创新——在市政厅之外，且往往作为对其政策的回应——在\
  \ Trias 政府执政期间在全城蓬勃发展。通常，尽管这些具有替代性质，市政府能够接纳并将其纳入其智慧城市品牌中。这一点的一个典型例子是巴塞罗纳地方政府加入了由欧盟`EU-H2020`资助的项目`D-CENT`。在该项目中，市政府与来自\
  \ 15M-*indignados*的科技政治活动分子共同工作，目标是颠覆智慧城市的话语。该项目开发了`Decidim Barcelona`平台，这后来成为新市政政府激进民主计划的技术基石之一。\n\
  \n### 从智慧公民迈向技术主权\n\n\n\n\n在此背景下，且有些出人意料的是，2015 年 5 月，新的左翼政治平台 `Barcelona en Comú`\
  \ 赢得了地方选举。³ 新的（少数）政府致力于从根本上重新思考巴塞罗娜以及市议会的政策与政治（Charnock & Ribera-Fumaz, 2017）。这一过程意味着，需要对上一届自由派政府继承的智慧城市战略的未来做出决策。\n\
  \n在执政的第一年，关于智慧城市方面存在某种模糊性或缺乏行动，因为大多数注意力被放在了城市模式的其他其他基石上，例如大众旅游的影响或市内的住房危机。除了对自由派智慧城市战略采取非常笼统的批判性立场外，并没有做太多事情。该战略既没有得到进一步推进，也没有被完全拒绝；它大部分处于冻结状态，最终某些智慧倡议由于潜在的社会影响或法律原因（合同已经签署）得以维持，而另一些则被放弃了。\n\
  \n此外，新市政府拆解了 `Trias` 的智慧城市结构，并将负责的不同部门分配给由 `Barcelona and Comú` 不同派系及其政府伙伴领导的不同区域。直到\
  \ 2016 年 6 月，市议会才任命来自英国 `NESTA` 的独立专家 `Francesca Bria` 为首席技术官。告别于此前驱动 `Barcelona\
  \ Smart City` 的那种非冲突性的信息城市愿景，新的市技术团队正在采取另一个视角，即技术主权：“这意味着重新夺回对数字技术产生的数据和信息的控制权，并促进基于开源软件、开放标准和开放格式的公共数字基础设施”（Bria,\
  \ 2017）。\n\n这种观点承认，在 `Dan Schiller (2014)` 所说的“数字资本主义”范围之内，地方政治应该采取更广泛的政治和地缘政治议程，以“抗衡一个自上而下构建且有利于外国公司的私有化智慧城市，反对对知识产权的垄断所有，并扭转租金型数字平台对集体生产价值的私有占有”（Morozov\
  \ & Bria, 2018, p. 27）。从这一观点来看，城市的技术政策应旨在实现“终结技术提供者的寡头政治”、“审查合同框架以确保数据主权”、“在公共部门创造关键的新能力以重新获得对数字服务的控制权”、“由于\
  \ 70%的新软件开发投资将是免费开源且开放许可，从而提高产出和成本的效率”、“加强与城市及公共管理机构网络的本地协作”，以及“加强对政府所持数据的访问，并为公民的基本[数据]权利提供保障”（Bria,\
  \ 2017）。\n\n因此，正如副市 `Gerard Pisarello (2016; 译自 Galdón, 2017)` 所述：在民主城市中，技术应当服务于数字上赋能公民，保护他们的隐私免受公力和私有权的滥用，打击腐败，并向更加公平和可持续的经济发展。这有一个名字：为了公共利益而征服技术和数字主权。\n\
  \n这一愿景导致了 2016 年 10 月启动的一项新战略的制定：“巴塞罗那数字城市：通往技术主权的路线图”。该战略认为，由公民控制城市和公民数据或与企业权力斗争至关重要，但还不够。不仅有必要让他们参与决策，还要改变城市中数字资本主义的实际政治经济。换句话之，虽然保留了智慧公民/智慧城市理念中对公民的关注以及持续（社会）创新的需求（包括智慧词汇和话语制品），但这是在一个非常不同的目标下进行框架和发展的（见表\
  \ 13.2）。\n\n### 表 13.2. 巴塞罗娜技术主权的干预领域\n\n| 领域 | 干预领域 |\n| :--- | :--- |\n| 数字化转型\
  \ | * 用于更好治理的技术<br>* 城市技术<br>* 城市数据公有 |\n| 数字创新 | * 数字经济<br>* “在巴塞罗那制造”<br>* 城市数字实验室\
  \ |\n| 数字赋能 | * 教育与数字能力培养<br>* 数字包容<br>* 民主与数字权利 |\n\n\n\n\n# 在许多自上而下的智慧城市项目中，市议会可能无法拒绝现有合同和承诺（例如\
  \ `City OS`、`T-mobility`）。但是，在这项战略计划下，市议会旨在重新分配由前右翼市政政府发起的公私合作城市管理计划，该计划旨在将城市打造世界领先的智慧城市（见表\
  \ 13.3）。例如，像 `DFA` 或 `Fabcity`（现为创作者区）等项目经过了重新调整，改变了重点以适应这一新哲学。从这个意义上说正如 `DFAs`\
  \ 经理 Jordi Reynés 指出的：“政治不在 [DFA] 之外，而在内部，在制作过程中。”⁴ 此外，市议会一直在利用其在全球性活动组织委员会中的角色（如`智慧城市世界大会`和`移动世界大会`）来提出替代性的辩论。例如，他们促进了关于公地协作经济的辩论，并邀请了大卫·哈维（David\
  \ Harvey）或叶夫盖尼·莫洛索夫（Evgeny Morozov）等批判性声音作为`智慧城市世界大会`的全体会议发言员。\n\n## 表 13.3. 面向技术主权的重塑智慧城市议程。\n\
  \n![Image](img/10.jpeg)\n\n在这种背景下，巴塞罗纳策略的潜在转型力量依赖于技术主权框架内设计的新项目。在这里，我关注了一些示例性项目。\n\
  \n### Decidim.Barcelona\n\n技术主权战略的旗舰项目是 `Decidim.Barcelona`，这是一个城市数字参与平台。矛盾的是，该平台的设计和原型开发是在\
  \ `Comú` 夺权之前开发的。它诞生于一个欧盟项目 `D-CENT`（2013–2015），该项目探索了四个城市（巴塞罗纳、马德里、赫尔辛基和雷雅未未）直接民主的开源工具。该平台基于开源软件——这些软件已上传到\
  \ `GitHub`——任何人都可以对其改进或重用。此外，它还结合了隐私设计，将用户产生的数据留在自己手中，确保透明度和问责制，并防止数据被商业化。它首次被用于社区倡议市政行动计划的参与性制定，有近\
  \ 40,000 人对市议会在每个社区应该做什么提建议、进行讨论并投票。截至 2018 年 3 月 1 日，该平台已拥有 28,000 多个注册参与者、19 个参与性流程，并促进了\
  \ 821 场公共会议。这导致了 12,173 项建议——其中 8,923 项已纳入公共政策（Barandiaran, 2018）。\n\n一个显著结果是参与性地起草了\
  \ 2013–2018 年城市交通计划，该计划通过建设城市超级区块（`superilles`）限制机动车辆的通行和准入，转而优先考虑行人享受开放、共享、绿色和安全公共空间的权利，从而将空气和噪音污染以及城市流量减少了\
  \ 21%。该平台在不断升级，还通过 `Metadecidim Lab` 会话就平台如何帮助改进直接民主民主开展了公开的公众讨论。\n\n重要的是，该平台不仅被构想为市会的参与门户，而且作为一种“授权社会过程作为独立于公共行政部门的大规模社会协调以实现集体行动的平台”（Barandiaran,\
  \ 2018；强调原文）。例如，该平台注定供任何想要以民主方式组织自身及其审议过程的社会运动和公民团体使用。⁶ 在此，`Decidim.Barcelona` 的架构师理解该平台是“一个反性的基础设施，利用基础设施来实现自身的民主”（Barandiaran,\
  \ 2018；另见 Barandiaran & Calleja-López, 2016）。换句话说，存在一种隐含的乐观观点，认为仅使用和升级正确的参与性数字技术就能改善民主。因此，例如在近期区块项目的争议性部署（通过移除城市区域汽车并获取公共空间使街道平静）中使用\
  \ `Decidim.Barcelona`，既不能防止争议和面对面谈判的必要性，也不能强制基于自上而下的设计和对城市社会关系的理解的解决方案。更不用将其与挑战巴塞罗纳当前城市化动态的广泛社会运动和斗争相结合（例如，大交通、绅士化等）（对比\
  \ Smith et al., 2017）。\n\n### La Comunificadora\n\n第二个模仿对象是 `La Comunificadora`。这是一个位于市政经济发展机构\
  \ `Barcelona Activa` 内部的孵化器，由 `Goteo`（第一个社会众包平台）、`Platoniq`（协作经济实验室）和 `Free Knowledge\
  \ Institute` 运营。它遵循经典孵化器的相同结构：旨在推动 ICT 创新，举办“初创公司”，并提供有关如何创建社会经济的培训课程。然而，与其他孵化器不同，这里的“初创公司”是合作社和小项目。\n\
  \n与此同时，为了促进社会创新，市议会创建了基于 H2020 `DSI4EU` 项目的 `DSI4BCN`（DSI 代表数字社会创新）。`DSI4BCN` 是一个支持数字平台，2018\
  \ 年投入了 30 万欧元用于社会创新计划和数字制造空间，具有提升波布洛诺（技术区）当地数字制造的生成潜力。面对此，意识到巴塞罗纳在全球发展中是一个“小”参与者，市议会正在尝试小规模试点，通过替代初创公司和企业技术提供商来产生替代性的技术经济。\n\
  \n### 新公共采购\n\n最后，市议会启动了`新的公共采购流程`。该公共采购流程旨在购买基于开源、隐私设计和循环经济哲学的合作社及协作经济中小企业生产的技术服务。这意味着在此过程中终止了与\
  \ `Microsoft` 的合同。这一新的公共采购流程向该倡议投入了 100 万欧元，意让中小企业和合作社成为技术提供者，减少大型科技公司和咨询公司在市政采购过程中的主导地位。\n\
  \n\n\n\n\n# 技术主权的潜力与局限\n\n巴塞罗纳已成为测试技术与城市主义新方法的实验性实验室，这不仅是因为地方政府的转型，还得益于在这一变化之前就已经蓬勃发展的大量自而上的倡议。⁷\
  \ 深入探讨这些倡议超出了本章的范围。现在要评估技术主权的成果还为过早，因为其主要行动仅启动了几年。\n\n然而，从“智能公民”视角向当前视角的转变，为思考城市在构建技术策略时面临的潜力与局限提供了空间，这些策略能够真正挑战智能城市/公民自上而下的倡议。\n\
  \n首先，有趣的是，巴塞罗纳战略计划的叙述和行动部分程度上使用了与正统智能城市支持者所倡导相同的概念：数字化和（颠覆性）社会创新、第四次工业革命、公民赋权等。此外，许多倡议都得到了\
  \ `H2020` 项目的资助，这些项目恰恰旨在重现智能公民的叙事和生活实验室愿景。\n\n在这方面，巴塞罗纳能够建立联盟并获取资金，旨在扭转智能城市的逻辑。在此过程中，它保留了许多之前的“智能”倡议并对其进行了重新框架。特别是，它将公民从单纯的消费者或生产消费者的角色，转变为创造条件，其目标不仅是参与城市治理，还要控制自己的数据，并产生有助于开发更公平城市化形式的协作经济。\n\
  \n在此过程中，技术的使用并非为了使城市治理去政治化，而是为了与社会运动和社区互动（如 `Decidim.Barcelona` 或 `la Comunificadora`），并使公民身份的概念重新政治化。技术不是解决方案，构建和使用技术才是重新政治化的手段。\n\
  \n然而，许多时候，对于数字技术仍然存在一种过于乐观的立场，这种立场通常基于一种相当技术决定论的政治观。因此，问题不仅关乎重塑一个控制自己数据或参与政策制定的政治化公民，也不关乎获得效率、竞争力或城市规模上的社会再生产问题，亦关乎技术解决方案对于“智能城市权利”能做什么。确实，这些都是需要处理的重要课题。\n\
  \n然而，有必要将辩论中心从技术本身或局部去中心化，并承认技术主权也意味着承认技术主导的解决方案并不独立于更广泛的生产关系。事实上，正如此处审查的倡议所示，巴塞罗纳的技术主权策略基于对数字资本主义全球动态的理解和诊断。在这个框架下，有两个实质性问题：\n\
  (1) 与挑战当前政治经济格局的广泛运动联系起来，建立技术之外的替代方案；\n(2) 创建公民可以被赋权的新经济。\n\n此外，正如该市技术项目的官员和合作者所承认的，许多成功的关键因素超出了城市规模行动者的控制。在\
  \ `Google`、`Facebook` 和其他全球巨公司的时代，市议会如何保持对数据的控制？当地的替代平台真的能成功与 `Airbnb` 和 `Uber`\
  \ 等全球参与者竞争吗？通过“照常智能”的政策框架和工具（如 `EU` 的 `H2020` 资助计划及其原理）开发替代性的社会技术策略，在何种程度上会开启或限制技术主权的解放特征？\n\
  \n回答这些问题对于为大多数而非少数人建立（智能）城市权利至关重要。要做到这一点，需要考虑城市及之外技术主导城市主义的复杂地理格局。\n\n### 参考文献\n\
