  \n\n# 第一部分：公民身份与公共领域\n\n## 第二章：谁拥有智能城市的权利？\n\nKatharine S. Willis\n\n### 摘要\n本章基于列斐伏尔（Lefebvre）的“城市权利”（1996b）来理解智慧城市倡议是如何实施的，以及结果是谁从中获益。虽然智慧城市提供了一种公民身份模式，但“实际存在的”智慧城市实际上以这种方式重构了公民身份模式：即将技术和数据工具化，可能会强化边缘群体的排斥模式。因此，本章旨在理解公民如何参与智慧城市项目，以及这些项目实际上是否会加剧现有的城市历史、物质和社会不平等。本章关注了被智慧城市项目排除在外的一些群体：城市贫困人口、街头摊贩以及居住在非正式定居点的人，并探索了他们进入和参与城市的方式。在全球南方背景下，印度是实施国家级智慧城市计划的关键参与者，研究在钦奈杜市调查了\
  \ `India Smart Cities Mission` 的规划与实施情况，以及对边缘社区的相关影响。本章认为，有必要承认公民在社会和空间嵌入背景下，利用满足其需求的各种日常、小规模技术和数据的价值。通过这种方式，边缘群体可能被赋予列斐伏尔所描述的对城市空间的“作品、参与和占有的权利”（1996,\
  \ p. 173）。*关键词*：智慧城市；参与；包容；边缘化；技术；城市；数据；城市\n\n### 引言\n本章基于列斐伏尔的“城市权利”（1996b）框架，以考虑“智能”城市转型中日常化和以人为中心的能动性作用。Aurigi\
  \ (2012)、Kitchin (2015)、Marvin、Luque-Ayala 和 Mcfarlane (2016)、Rose (2015) 以及 Sassen\
  \ (2012) 等作者对智慧城市修辞中的技术决定论语言进行了批判，重点其倾向于关注自上而下应用的 ICT 解决方案。智慧城市的议程很少涉及既有城市中的社会差异问题（Datta,\
  \ 2018），本章认为，反思 March 和 Ribera-Fumaz (2014, p. 826) 提出的问题至关重要：“谁的智慧？谁的城市？”智慧城市方法倾向于从国家和公司的角度关注解决城市问题的技术方案，而这些技术“需要就设定当地公民和基础设施优先事项的关系……为人们和社区服务并工作”（Sadoway\
  \ & Shekhar, 2014）。虽然智慧城市提议中经常提到公民咨询和参与，但在涉及城市资源和设施（如水、道路、路灯、排水、废物处理服务）分配，以及针对这些问题的拟议智慧解决方案的公共参与方面，明显缺乏有效的公共参与机制和技术。在全球南方背景下，印度是实施国家级智慧城市项目的关键参与者，这被认为可能加剧了现有的城市历史、物质和社会不平等（Datta,\
  \ 2018; Ravindran, 2015; Sadoway & Shekhar, 2014; Vanolo, 2014b）。智慧城市项目的实际影响包括非正式群体从城市空间中流离、通过土地利用规划导致的流离和空间隔离，强化了数字鸿沟、性别差异，以及被排除在发展的经济利益之外。因此，以城市权利为框架，本章试图回答这个问题：“谁拥有智慧城市的权利？”本章关注了被智慧城市项目排除在外的一些群体——城市贫困人口、街头摊贩以及居住在非正式定居点的人。它借鉴了在印度、巴西和英国开展的实证工作，特别关注印度钦奈如何规划和实施智慧城市愿景。在这里，`India\
  \ Smart Cities Mission` (2016) 作为一项全国性的智慧城市计划，显示了驱动不平等的证据，因为它带来了“飞地式”开发，过度有利于全球\
  \ ICT 公司和富裕人口，而非其他群体（Datta, 2015）。我们概述了人们被剥夺智慧城市权利的两种方式：首先，通过拟议的城市服务优化、自动化和私有化来集中并驱逐低薪和非正式劳动力；其次，通过从街道空间清除街头小贩和在非正式城市经济中经营的人。虽然这是一项小规模短期的研究，但其他研究也记录了类似的从智慧城市中参与和获益的排斥模式，例如印度的\
  \ Datta (2018)、费城的 Wiig (2016) 以及位于巴塞罗纳的 March 和 Ribera-Fumaz (2014)。\n\n### 智慧城市的权利？\n\
  \n\n\n\n列斐伏（Lefebvre）描述了“对作品的权利、参与和占有的权利都包含在城市权之中” (1996b, p. 173)。因此，我们无法将“居住权”与“参与权”分开来：“所有城市居民充分享受拥有所有服务和优势的城市生活的权利\\\
  [……\\] – 居住权——以及直接参与城市管理的权利” (Fernandes, 2007, p. 208)。\n\n费尔南德斯（Fernandez, 2007）进一步将其拆解为一组需要充分承认的相互关联的政治权利：信息权；表达权；文化权；在差异与平等中的认同权；自我管理权，即对经济和政治的民主控制；以及公共和非公共服务的权利。\n\
  \n城市权并非某项制度性权利（如选举权），而是更像是通过过日常城市生活的惯例来实现的一种权利。列斐伏的分析进一步提出了一种通用的自我管理形式作为该权利的基础和表现\
  \ (2003, p. 150)。\n\n列斐伏将城市权与中心和边缘的空间概念联系起来。他认为，中心为截然不同的世界和价值体系的并存——包括种族、文化和社会群体、活动和知识——创造了条件。城市是一种社会资源，创造了聚集这些不同元素并使其产生生产力的可能，是社会组织的核心机制\
  \ (Schmid, 2011)。\n\n在列斐伏的框架下，中心因此可以定义为一个允许参与和占有的场所，特别是对于下引文所述的边缘群体 (Lefebvre, 1996a,\
  \ p. 34)：城市权以差异权和信息权为补充\\[……\\]用户（\\[多项服务的用户\\]）在城市区域活动的时间和空间内公开表明其想法的权利；它还应该涵盖对使用中心的权利；一个特权之地，而不是被分散并移动到边缘（对于工人、移民、“边缘群体”甚至对于“特权阶层”而言）。\n\
  \n“中心权”中隐含了被放逐到边缘、流离以及从中心地带被排斥的可能性。因此，排斥不仅是城市化过程产生的结果，更是城市与其公民关系中更为根本的断裂。列斐伏概述了排斥是如何基于隔离的，“这种隔离将所有不参与政治权利的人推向边缘空间。同样，它规定了会议和聚集的权利”\
  \ (Lefebvre, 1996b, p. 30)。\n\n这在城市空间中不仅体现在财产所有权上，还体现在公共空间的居住上：街道、公园和广场。根据弗里德曼（Friedman）的观点，“只有当城市的街道属于人民时，城市才能真正被称为城市”\
  \ (1993, p. 39)。因此，城市规划或更新项目变成了关键过程，权利在这些过程中被嵌入或受到挑战。\n\n事实上，哈维（Harvey, 2012, p.\
  \ 40）概述了城市权是控制城市化过程和建立新城市化模式的权利。\n\n智慧城市对城市权带来了新挑战。根据 Shaw 和 Graham (2017, p. 912)\
  \ 的观点，“数字技术对信息权与城市权概念性分离提出了挑战\\[……\\]；数字信息复杂化了列斐伏作为中心性权利的城市权。”因此，面临着一个如何通过数字参与模式实现列斐伏意义上的公民权的挑战。\n\
  \nShaw 和 Graham (2017, p. 908) 进一步解释道，“传统城市权力参与者——开发商、规划师、房东——的权力现在正受到新兴信息垄断（如 Alphabet\
  \ 公司的 Google）的竞争。” ICT 提供商，如 `IBM`、`CISCO`、`Siemens` 以及最近的 `Alphabet` (`Sidewalk\
  \ Labs`)，一直试图将自己定位为城市规划和更新项目中的新参与者。\n\n## 参与权：城市服务的效率范式\n\n\n\n\n\n智慧城市项目重构了公民与城市治理之间的新关系。许多智慧城市项目的逻辑基于一种修辞，即城市挑战被视为紧迫且不断增长的、需要修复的“问题”。数字技术被视为一种“解决方案”，通过更好的沟通方式以及改进的系统和务，在公民与当局之间、政府内部与普通居民之间提供了一种新的关系。这可以在多个层面上发生。\n\
  \n在最基础的层面上，城市可以被视为一种地方社会信息基础设施，为居民提供关于“真实”城市的信息。在公民参与和互动的模型中，智慧技术和系统被认为能够实现新的公民模式。关于这些新的数字化治理和参与形式是否真的交付了它们所承诺的积极参与水平，还是说它们在方法上与传统治理模式一样局限，目前存在许多争论（Willis\
  \ & Aurigi, 2017）。\n\n智慧城市治理修辞与实际交付现实之间的差距，已由 Kitchin (2015, p. 132) 等作者所强调，他指出“智慧城市的倡导者想象自己正在创造科学、客观、合乎常理且非政治的技术、手段和愿景”。虽然数字技术和平台往往被呈现为实现某些形式参与和治理的“工具”，但事实上，它们远非中立，而且在城市中引入了新的民主参与模式。事实上，许多智慧城市愿景的背后是某种通过城市服务效率范式交付的新型城市管理模型（IBM,\
  \ 2012）。\n\n收集、获取和分析城市数据被推崇为一种过程，这一过程不仅能“解决”城市问题，还能节省金钱、时间和资源，正如 IBM 在围绕智慧城市的早期营销策略中所强调的那样。这些管理系统的前提是，“智慧”能够实现对城市基础设施更高效的管理，反过来又通过更好的服务提供更好的治理。这本应能使智慧城市项目出现一种更具包容性的参与模式。\n\
  \n然而，这种话语也在城市管理的公共部门与私人部门之间引发了新的紧张局势。例如，IBM 以及其他企业 IT 公司的策略旨在将这些公司建立为未来智慧开发的伙伴。在这些公私参与者组成的新联盟中，所提供的参与承诺掩盖了一种经济迫性，即智慧城市的实际受益者往往是企业伙伴而非公民。现实可能完全不同，正如\
  \ Kitchin (2015, p. 132) 所强调的：被遗留的问题包括全景式监控、技术官僚和公司形式的治理、技术锁定、画像刻画和社会分类、预测性治理、控制蔓延、国家提供服务的空心、日益扩大的不平等以及土地和生计的剥夺。\n\
  \n在数字或智慧城市的话语中，生产“智慧城市”不可避免地也共同产生了所谓的“智慧公民”，这意味着人们必须愿意适应并生活在智慧城市。Vanolo (2014a,\
  \ p. 893) 强调了这如何导致排斥模式，因为“对于技术文盲、贫穷人以及通常情况下那些被排除在智慧城市话语之外的人来说几乎没有空间”。因此，智慧城市的议程并不是中立的，它影响了公民本应该表现的方式，并且实际上导致了那些本应是智慧城市倡议受益者的人——城市贫民和边缘群体——缺乏参与。\n\
  \n因此，有必要批判性地探讨人们如何通过直接参与智慧城市项目中的城市管理来参与，因为“尽管目前已转向创造‘智慧公民’，但对于对于不同的智慧城市技术如何想象和参与公民，仍然缺乏批判性的概念审查”（Cardullo\
  \ & Kitchin, 2018, p. 5）。\n\n## 中心性权利：边缘化的智慧城市\n\n智慧城市议程效率范式的背后是一个事实：资源的重新分配和配置往往并非指向那些最能从中受益的人，即最边缘化的公民。技术效率模型实际上催化了一个过程，该过程在实践中进一步排斥了处于边缘的人。这挑战了列斐伏（Lefebvrian）意义上的“参与权”，因为“城市权合法化了拒绝让自己被歧视和隔离性组织从城市现实中移除的”（Lefebvre,\
  \ 1996b, p. 195）。\n\n智慧城市的修辞传播了这样观点：技术可以并为我们所有的多重问题提供解决方案，而不需要从根本上改变我们的生活方式，或挑战执行和维持这些问题的结构。智慧城市模型中所推崇的服务优化导致了城市人口特权阶层的获取和受益。这是因为对智慧城市定义的愿景在很大程度上与特定利益相关者和人口子集的愿望及价值观相匹配（Vanolo,\
  \ 2014b）。如果我们采取费恩伯格（Feenbergian）的观点，那么“与技术的接触使某些利益变得凸显。[……]一旦加入网络，个体就有动力去解决其缺陷，在某些情况下他们还获得了对其发展的潜在权力”（Feenberg,\
  \ 2011, p. 5）。\n\n技术发展本身并不能克服缺乏技术技能、经济机会匮以及现有民主鸿沟等更广泛的挑战（Mossberger, Tolbert, &\
  \ Stansbury, 2003）。它特权了那些符合特定空间的人，排斥了那些不能或不愿顺从的人。在智慧城市中，边缘的人几乎没有空间去挑战、甚至与实际存在的智慧城市互动。这是因为涉及的社区往往缺乏作为个人或集体进行赋权所需的条件、获取途径以及对技术重要性的理解：他们缺乏主体性（Melgaco\
  \ & Willis, 2017）。智慧城市不仅是延续了现有的分歧，还会强化社会不平等，因为非正式或边缘人口对现有技术和城市基础设施的获取有限。\n\n## 案例研究：智慧城市金奈伊\n\
  \n\n\n\n\n在印度，智慧城市任务（`SCM`）¹是一项国家性的多城市计划，提议在从 2016 年起的五年内，对 100 个印度城市开展大规模的城市更新项目。金奈纳是`SCM`首批选定的\
  \ 19 个城市之一，该市选择了`T. Nagar`社区作为其区域化开发对象（见图 2.1）。`T. Nagar`是金奈纳的主要购物区，以其纱丽商店闻名，并围绕一条中心道路轴线布局（图\
  \ 2.2）。其目标是让这一试点区域成为该市其他区域智慧城市发展的模型。\n\n![Image](img/3.jpeg)\n图 2.1. 金奈纳地图，突出显示\
  \ T. Nagar 地区的位置。\n\n![Image](img/4.jpeg)\n图 2.2. 金奈纳 T. Nagar 南乌斯曼路的街道空间。来源：作者。作为我们研究的一部分，我们举办了两次工作坊，旨在探索智慧城市在实践中是如何构和实施的。工作坊有两种调查模式：利益相关者讨论和测绘练习。讨论围绕印度智慧城市任务的公开智慧城市文件和应用展开，特别是与金奈提议（2016\
  \ 年）相关的文档。\n\n利益相关者工作坊有 18 名参与者，包括：公民消费者与行动小组（`CAG`）、总部位于金奈的全国性活动小组、当地非政府组织、学者、社区\
  \ IT 组织、建筑师、经济学家、城市规划师，以及印度国家小贩贩联盟的代表。特别是，两点变得非常清晰：很少机构或个人了解金奈智慧城市计划的实际细节；而且金奈计划似乎是对贾瓦哈拉尔·内赫鲁国家城市更新任务（`JNNURM`）的重新利用，这是一个此前失败的城市更新项目（DASH,\
  \ 2014）。\n\n第二次工作坊由期一天的测绘练习组成，约 15 名利益相关者访问了指定的`T. Nagar`地区，对将作为金奈智慧城市计划一部分实施的区域进行测。参与者包括建筑师、社区活动人士、当地学者和研究网络伙伴。测绘练习旨在促使参与者详细观察街道级基础设施，视觉化金奈智慧城市方案可能对该地区产生的影响，并对街头小贩和当地摊贩进行关于他们对智慧城市的非正式访谈。\n\
  \n## 金奈智慧城市：城市效率范式\n\n`T. Nagar`区域开发计划的方案围绕以下“组件”构建：步行化、开放空间改造、主干道人行道拓宽、自行车共享网络、多层停车场、整合所有公共交通、稳健的\
  \ IT 连接和数字化、智能公交/电动三轮车接驳、固体废物管理、供水管理、污水管理、电子治理以及包括洪水警告和监测系统在内的雨水管理（见表 2.1）。\n\n\
  金奈智慧城市文件概述了实施这些倡议的建议解决方案是通过公用事业（电力、废物和水）、交通和 ICT 基础设施的优化和自动化。金奈智慧城市任务的说明理由非常典型的城市危机路线，重点关注基础设施：金奈的基础设施承受着持续压力。交通瓶颈、市政设施受限和高污染都是这种基础设施压力的特征。（城市发展部，2016）。\n\
  \n表 2.1. 金奈智慧城市方案摘录，总结了项目的关键组件。\n\n| 列出你区域开发方案的关键组件（例如：建筑、景观、现场基础设施、水循环、供水双用管道等）\
  \ |\n| --- |\n| * 确保电力供应：提供 24×7 供电，其中 10%来自可再生能源，通过智能电表进行微电网监测；带有智能计量的电力和 ICT 公用事业走廊\
  \ |\n| * 充足供水：扩建/修复旧网络，可靠水源扩充，24×7 供水，DMA（区域计量分区），100%符合 CPHEEO 标准的优质水，储水和分配网络的修复/更换；基于\
  \ DMA 的分配系统，包括压力和流量监测；特别强调客户互动和成本回收；水损（UFW）减少计划 |\n| * 废水循环：废水将回收并供应给绿地、中带、花园等；符合\
  \ CPHEEO 标准的处理及其重复利用；基于传感器的流量监测，包括`SPS`和`STP`运行的自动化；污水网络和现有泵站的扩建/修复 |\n| * 固体废物管理：将现有垃圾箱转换为传感器箱；在车辆上安装\
  \ GPS 以监控收集，引入 4R 概念（减少、回收、重复利用和响应/拒绝——废物能源化，特别强调源头分类 |\n| * 雨水收集和雨水管理：在家庭和社区层面每隔\
  \ 30 分钟进行一次雨水收集，根据基于传感器的流量监测扩建现有雨水网络 |\n| * IT 连接和数字化：T. Nagar 的 Wi-Fi 连接，数字告示牌和广告牌以整合所有公共交通，所有公用事业的整合，包括\
  \ GIS 转换 |\n\n来源：城市发展部（2016, p. 27）。采用的方法利用这一理由对城市基础设施中这些明显的“危机”点进行技术管理。效率范式采取了这种方法，即目前的以人为的服务不仅效率低下且不可靠，而且不受控制。在下一节中，我将金奈智慧城市方案中的建议倡议（见表\
  \ 2.1）与通过`T. Nagar`地区测绘练习观察到的“实际存在的智慧城市”（Shelton, Zook, & Wiig, 2015）进行对比。\n\n针对水、卫生和电力提出的解决方案侧重于供应端问题，并以使用水表和传感器控制公用事业为前提。它们未能解决这些服务对部分服务的可用性。供水是整个印度的挑战；在金奈，超过\
  \ 15%的家庭没有来自处理源的供水，5%的人没有厕所，3%没有污水连接（来源 CAG，`http://smartcities.gov.in/`）。SCM 解决方案侧重于现有系统的自动化，通过基于传感器的流量监测”（见表\
  \ 2.2）。\n\n表 2.2. 智慧城市方案摘录。\n\n| 水 |\n| --- |\n| * 充足供水：扩建/修复旧网络，可靠水源扩充，24/7 供水\
  \ |\n| * 废水循环：废水将回收并供应给绿地、中带、花园等。基于传感器的流量监测 || 雨水收集和雨水管理：根据基于传感器的流量监测扩充现有雨水网络 |\n\
  | 电力 |\n| * 确保电力供应：提供 24/7 供电，其中 10%来自可再生能源，微电网监测，电力和 ICT 公用事业走廊带有智能计量的 |\n| 废物\
  \ |\n| * 固体废物管理：将现有垃圾箱转换为传感器箱 |\n\n\n\n\n\n*来源*: 城市发展部（2016, p. 27）。钦纳的电力供应同样不可靠，经常出现全市或全州范围内的\
  \ 3–8 小时停电。电力基础设施也提出了类似的解决方案：再次承诺通过基于传感器的监控和智能电表实现 24/7 全天不间断供电（见表 2.2）。\n\n在街道上，印度的电力基础设施具有显著的局部化特征：变压器位于建筑群之外，大量电缆触手可及。虽然这在许多方面存在问题，首先是因为\
  \ `T. Nagar` 地区有许多根本没有电力供应，但电力基础设施是可及的，可以由街道规模的人员进行管理。向中央控制和计量系统的转变消除了与基础设施的本地互动。\n\
  \n这种模式在废物管理提案中也得到了复制（见表 2.2）。固态废物管理提议使用 `RFID` 芯片。这是一项由技术供应商提供的解决方案，需要建立“控制室”设置，通过系统报告满溢的垃圾桶，从而触发垃圾收集。然而，钦纳的垃圾收集是一项以人为本的服务，涉及街区甚至街道规模的正式和非正式劳动力。通过自动化这项服务，可能会通过减少正式部门的劳动成本来提高效率，但正如之前的项目发现的那样，“昂贵的技术产生了反向的制度和系统性关联，挤出非正式部门以收回成本”（CWG;\
  \ GIZ., 2011）。此外，“私有化为废物领域引入了新的大型竞争者，并*事实上*将对废物资源的访问权从公共领域转移到私有领域”（WIEGO – 全球非正式就业女性：全球化与组织，2012）。\n\
  \n钦纳智慧城市提案中的水、电、废物组件，已从通过以人为本系统进行本地管理的公用流，转变为通过自动化且通常是私有化的服务路径进行控制和管理的服务。这样做，非正式经济和街道级的城市基础设施管理实际上被传感器和中央管理结构所取代。此前关注就业成本的财政资源被重新优先分配给通常由私营\
  \ `ICT` 供应商交付和维护的技术；公用服务得到了优化，而利益（价值）流向了私营部门。这一过程通常与对利润客户的“挑肥肥”以及对边缘客户的“社会倾弃”并存（Marvin\
  \ & Graham, 1993, p. 10）。\n\n## 智慧城市钦纳：被排除在中心\n\n映射活动特别关注观察街道空间，以理解目前谁拥有空间权利，以及他们可能如何受到钦纳智慧城市项目实施的影响。观察到的结果（见图\
  \ 2.2）是，街道空间目前是一个混乱且有些无序，但因此也具有包容性的空间：从列斐伏的意义上说，这是一个“差异遭遇、承认并探索彼此，并相互确认或抵消”的地方（Lefebvre,\
  \ 1996b）。街道空间容纳了街头小贩、人力车车司机、购物者以及一系列非正式经济活动。尽管在智慧城市提案中没有明确说明，但通过更详细的阅读可以清楚地看出，它们构成了一种城市“清洗”策略，涉及将街头小贩、非正式出租车和其他非正式经济中的工人排除在公共空间之外。\n\
  \n例如，街头小贩尤其被描述为一个问题，提案包括将小贩大量搬到位于 `T. Nagar` 地区之外的独立建筑中，从字面上将他们从中心驱逐到边缘。作为结果，全国小贩联盟已试图动员全印度约\
  \ 4000 万成员，在“我们要的是面包黄油，而不是智慧城市”的口号下进行活动，以确保他们的权利得到承认（见图 2.3）。\n\n![Image](img/5.jpeg)\n\
  图 2.3. 横幅：全国小贩联盟组织的“我们要的是面包黄油，而不是智慧城市”抗议活动，2016 年 4 月。*来源：*Facebook 页面。\n\n智慧城市钦纳提案将非正式小贩视为城市空间中的“侵入者”，并利用自动化监控机制监控街道，以此证明对非正式公民进行清理和排除的正性。在这种意义上，“侵入者”可以被视为那些没有“中心权”的人，他们应该被排除在边缘。\n\
  \n### 结论\n\n\n\n\n\n城市和市民难道已经“智能”了吗？Sadoway & Shekhar (2014) 认为，针对金奈（Chennai）的智慧城市提案在多个层面强化并重剧了边缘群体在城市空间中遭受的空间和经济排斥。这些提案未能承认或赋予现有的城市非正规性（informality）价值，而“非正规必须被理解为一种城市化的术语，一种产生和管理差异化空间价值的逻辑”（Roy\
  \ & AlSayyad, 2004, p. 233）。这些提议受到技术性权宜之计和技术决定论式规划的驱动和合理化（Graham & Marvin, 2001）。城市非正规性被视为一组条件和资源，等同于系统中的需要优化和合理化的“泄漏”。这可能是导致\
  \ 2016 年概述的许多金奈智慧城市计划未能落诸现实的因素之一。根据一份新闻报道（特约记者，2018）：部长表示，在过去的三年里，金奈仅完成了一个智慧城市任务的项目：“中央政府已经批准了智慧城市任务下的\
  \ 173 个项目，估计金额为 134.25 亿卢比。在中央批准的 173 个项目中，该州已完成 3 个，金额为 3650 万卢比。”金奈智慧城市交付的明显失败在全球范围内引发共鸣。数字技术解决城市挑战的失败与这种策略有关，即技术被用于剥夺权利、未能赋能地方知识，并使设备和技术基础设施黑箱化（Haklay,\
  \ 2013）。从“城市权利”的框架来看，Cardullo 和 Kitchin (2018, p. 20) 指出，“创建真正‘以公民为中心’的智慧城市的规范挑战，将是重新构想公民在规划、发展和治理中应扮演的角色。”\n\
  \n支撑许多智能技术的治理和治理模型实际上为边缘群体充满了潜力——它是易获取的、廉价且本地化的，利用了低成本传感器、廉价连接和共享数据资产。如果它想要承认边缘群体的社会资本，那么它不仅需要工程师、编码员或系统科学家，“还需要构成公民网络空间的公民黑客活动分子、地方协会和长期社区团体”（Sadoway\
  \ & Shekhar, 2014）。如果城市非正规性不被视为一种条件，而是“充满活力和创业精神的城市场所”内的一种“生产模式”（Roy, 2011, p. 226），那么它就有夺回“智能”的潜力。De\
  \ Lange 和 de Waal (2019) 强调了“可客城市”这一术，Sassen 则提到“开源城市主义”（Sassen, 2011），这包括低成本公民感知、众筹平台、开放数据倡议以及重新利用的基于社交的共享平台。为了夺回“智能”，迫切需要一项公众意识计划，让普通大众进入智慧城市故事的幕后，揭示智能技术和基础设施的运作机制，并概述其潜在收益。通过这样做，将承认并庆祝城市和人们已经“智能”但尚未被赋予这一名的许多方式。\n\
  \n城市在智能方面往往失败的地方在于城市规划的角色，这本质上意味着基础设施的运行仅是为了满足预定义的、相当线性的服务或供应。智慧城市在某种程度上是动态运行的；它们的协调基于当时的可用资源和需求。如果智慧城市能够让公民即兴发挥并对其运作进行调整，那么这可能标志着向“实际存在”的智慧城市的转变。我们可以从全球南方学到，许多运行在边缘运行的非正规社区已经开发出极具资源和创新的方式，利用技术来造福自己。与其后殖民地将西方智慧城市模型“运送”全球南方，不如仔细观察、记录并学习城市非正规性如何采纳并与技术协同工作，而这种方式承认了城市和市民本身已经是“智能”的。\n\
