  \ 10 章\n\n## 黑客松与参与的实践与可能\n\nSung-Yueh\n\n### 摘要\n\n智慧城市的发展受到了技术官主义愿景和新自由主义城市发展的影响。然而，已经有人尝试通过组织公民倡议来扩大对未来技术和城市的参与机会，从而夺回城市权。本章借鉴穆菲（Mouffe）的竞争性概念，探讨了黑客松组织的多元化理想、修辞和实践，思考它们如何相互合作或竞争，并为技术和城市建设提供替代方案。本章分析了黑客松的不同组织方式，并讨论了不同背景、知识和技术能力的参与者加入并合作的机会。通过审查扩大参与的冲突性立场、衔接和安排，本章表明更加开放、包容和协作的城市建设活动是可能的。需要进一步研究冲突性的黑客松参与实践以及追求更平等智慧城市的其他公民倡议。*关键词*：黑客松；创新；参与；公民黑客；竞争性；霸权\n\
  \n### 引言\n\n\n\n\n\n智慧城市倡议往往是黑箱项目，排除了那些没有特殊专业知识、技术知识以及既得政治和私人利益的人的参与。其结果是产生了“为了利润而非为了人的城市”（参见\
  \ Brenner, Marcuse, & Mayer, 2009），在其中，参与技术和城市建设的权利被技术官僚式的愿景和城市未来的新自由主义发展理念所取代（Kitchin,\
  \ 2015）。然而，城市和城市日常生活一直是抗争商品化策略以及争夺“城市生活权”的场所（在列斐伏尔的意义上理解，参见 Purcell, 2002, p. 102；Boudreau,\
  \ Boucher, & Liguori, 2009）。\n\n事实上，在智慧城市或数字城市的背景下，数字公社或公民倡议试图通过组织免费、开放和协作的技术制造方式来行使城市权利，探索参与城市空间生产的新可能性（Cardullo,\
  \ 2019（本卷）；Shelton, 2018）。组织者鼓励当地社区或市政当局参与这些倡议，以便创新能够源于城市生活中获得的第一手经验和当地知识。此外，“以公民为中心”的方法成为建立城市生活实验室、公民黑客倡议或创新区的流行选择，以创造社会可持续的城市生活方式（Cardullo\
  \ & Kitchin, 2017；Cowley, Joss, & Dayot, 2018）。\n\n为了进一步解读不断开发和动员以夺回城市生活权的各种策略，本章将黑客松组织作为一个案例。黑客松利用了公民参与和自下而上创新的庆祝性修辞。然而，人们对黑客松的组织方式表示担忧，认为这些方式实际上在利用参与者的利他主义和劳动力（Gregg,\
  \ 2015），构建了松弱且临时形成的“原型公众”（Lodato & DiSalvo, 2016），促进了创业公民身份（Irani, 2015），并通过创业生活维持了新自由主义治理（Perng,\
  \ Kitchin, & Mac Donncha, 2018）。\n\n同时，不同的理想、修辞、理性和实践已经发展出来，以开放创新过程和智慧城市生产的渠道。在这种背景下，黑客松被征用来探索替代性的活动组织实践如何产生参与未来技术和城市建设的新可能性。因此，本章并没有关注导致城市新自由主义化的黑客松的主权效应，而是借鉴了\
  \ Mouffe (2013) 的理论，探索黑客松的替代概念和实践可能如何发展，并询问不同的组织实践是否可以建立挑战主导霸权的竞争性关系，并为推进智慧城市权利提供更多机会。为此，下一节将讨论用于搜索邻近和即时之外黑客松的\
  \ `API` 辅助数据收集，随后探索黑客松组织的多元化方式，以及在意料（或非意料）的方式中显现的参与机会。\n\n### 方法论考量：API 辅助数据收集\n\
  \n黑客松通常使用民族志方法研究（例如 Gregg, 2015；Irani, 2015；Lodato & DiSalvo, 2016；Perng et al.,\
  \ 2018）。虽然民族志提供了深层描述，但本研究利用 `Eventbrite` `API` 来搜索黑客松。选择 `Eventbrite` 是因为它是一个热门的活动平台，也是一个发布活动详情的工具。通过查询\
  \ `Eventbrite` `API`，总共访问了 374 个独特的黑客松，大部分在 2017 年 4 月至 6 月之间组织，并被纳入分析。\n\n虽然样本很大，但该实验并非详尽或全面。相反，该过程引发了一些担忧，包括速率限制（`API`\
  \ 的查询频率）、规定性（提供的数据）、提炼（时间参数）、语言偏见以及意外包含（错误返回）。研究人员已尝试有效处理这些问题。\n\n在汇集完数据集后，对数据进行了手动处理和分析。数据处理涉及寻找有关黑客松组织的信息，例如在数据集的\
  \ `Event Description`（活动描述）或官方黑客松网站中寻找 `Organizers`（组织者）或 `Event Themes`（活动主题）。数据分析从底层识别黑客松组织的组成部分，并探索这些部分是如何组合在一起以组织不同的黑客松的。来自\
  \ `API` 生成的数据随后用于识别黑客松的形式和性质，构建出一种不同类型活动的分类法。这种练习被认为是有用的，因为尽管黑客松被认为是以公民为中心的，但组织程度、以参与者之外的方式纳入公民的程度，以及它们对公民认为重要的问题的关注程度却各不相同。\n\
  \n### 黑客松分类法与参与实践\n\n目前对黑客松差异的理解总结在表 10.1 中。Meyer 和 Ermoshina (2013) 以及 Briscoe\
  \ 和 Mulligan (2014) 建议根据对技术开发、特定主题、人口统计和数据重用的关注点对黑客松进行分类。Van Waart, Mulder 和 De\
  \ Bont (2015) 也注意到黑客松的业务导向，即利益相关者、参与者和当地当局参与开发未来的业务概念和产品。然而，这些分类法并没有探索黑客松的组织，而不同行动者与实践之间的关联可能会影响黑客松的目标、实践和结果，更重要的是参与创新过程的可能性。\n\
  \n表 10.1. 现有黑客松分类法。\n\n| 黑客松主要类型 | 子类型 | 定义与示例 |\n| :--- | :--- | :--- |\n| 技术中心型\
  \ | 单一应用 | 关注特定的应用，例如一个 O/FSS 项目 |\n| 应用类型 | 特定平台 | 例如移动应用程序、游戏 |\n\n\n\n\n\n| 类别\
  \ | 描述 | 示例 |\n| :--- | :--- | :--- |\n| `Technology-specific` | 开发特定的软件语言或框架 |\
  \ |\n| `Focus-centric` | 以社会为导向 | 关注社会问题，例如公共服务 |\n| `Demographic-specific` | 针对特定人群，例如女性或青少年\
  \ | |\n| `Company-internal` | 针对公司内部工程人员，例如 Facebook | |\n| `Data-centric` | | 侧重于使用组织者提供的数据\
  \ |\n| `Business-centric` | | 侧重于开发未来的产品和业务概念 |\n\n\n\n为了解决这些缺陷，对 Eventbrite 数据集的分析侧重于“组织数据”，包括组织者、赞助商、为参与者设计的拟议挑战、预期参与者（以及理想的知识、技能、经验）以及参与奖励。对该数据集的分析还参考了在都柏林（2014–2015\
  \ 年）和波士顿（2016 年 4 月）进行的关于黑客松及其他黑客倡议的民族志案例研究（见 Maalsen & Perng, 2017; Perng & Kitchin,\
  \ 2018; Perng et al., 2018）。对组织数据的分析提供了对“黑客松组成部分”的直观感受，如表 10.2 所示，每个类别中的部分（例如组织者）是根据特定的黑客松逻辑和准备工作组合在一起的。\n\
  \n### 表 10.2. 黑客松组成部分![Image](img/6.jpeg)\n\n在参与组织（无论是私营公司、公民组织还是其他类型的组织）方面，它们以国际或国家规模运营，与不同的行业和领域相关，并针对多样化的社会或技术问题。在企业案例中，它们可以是\
  \ IT 行业的跨国公司（如微软和谷歌），也可以是高度依赖 IT 基础设施的其他行业公司，如银行（例如法国巴黎莱银行）、电信（例如 AT&T）、时尚（例如古驰）或票务业务（例如\
  \ Ticketmaster），以及其他国家或本地公司。\n\n此外，问题有多种被识别和潜在解决的方法，范围从活动组织者设定的宽泛“挑战”到协作组织面临的具体问题不等。在某些活动中，可能没有总性主题，参与者可以提出自己的问题或项目。同样，关注重点和规模不同的公民组织也以组织者或利益相关者的身份参与黑客松。这些组织中的许多强调科技文化和行业的多样性问题。黑客松被用作一种策略，扩大社会弱势群体（最尤其是女性、儿童、青少年和少数族裔）获取技术和教育的机会，而不仅仅是作为发明的纯场所。\n\
  \n还有其他公民或活动人士团体将黑客松重新用作一种策略，以应对新兴的关键问题或追求其长期目标。例如，开放知识和开放数据倡议可以利用这些活动作为其长期战略的一部分，倡导治理透明化；同时，新兴的社会问题，如难民问题或美国的旅行禁令，可能导致公民或活动团体专门针对这些问题组织黑客松。上述分析展示了霸权日益多元化的趋势（Mouffe,\
  \ 2013）。Mouffe 关注构想和建立超越单极霸权的政治世界的可能性。在这样的政治世界中，对抗关系（agonistic relations）是重要的，因为即使对手拥有相似的价值观，冲突关系和对手也是不可避免的。因此，民主机构的一项重要任务是构建更平等的安排以容纳这些不同的政治立场。借鉴\
  \ Mouffe 的理论，本章考虑了黑客松是否存在多元化，这些黑客松对创新的解释和参与参与安排可能并不完全一致，但尽管存在差异，它们集体挑战了以创新和城市建设为核心的霸权方法。\n\
  \n通过观察 Eventbrite 数据集，下文讨论集中在组装黑客松的六种不同方式，取决于它们对行动者（组织和参与者）的配置、理性（动机和成就的框架）以及涉及的实践（对组织和参与者的招募和奖励）。\n\
  \n#### 创业机器\n`Entrepreneurial machines` 由一个“黑客松行业”促进，该行业侧重于帮助公司和组织规划活动，并选择具有吸引种子资金并转化为初创公司潜力的想法和团队（见表\
  \ 10.3）。例如，这些黑客松咨询公司如 `AngelHack`，专注于帮助跨国或本地公司举办黑客松，在许多情况下，这些黑客松是以系列形式组织的，并围绕组织者和赞助公司的商业重点为主题的。除了对活动的整体主题、结构和挑战提供建议外，黑客松咨询公司还为组织者提供可遵循的指南，特别是在获取当地赞助、场地以及与其他建立合作伙伴关系方面。因此，参与这些黑客松有助于个体的创业发展和生活方式提升，并使相关公司受益。\n\
  \n### 表 10.3. 黑客松分类法![Image](img/7.jpeg)\n\n#### 国家经济机器\n`State economic machines`\
  \ 对创业和创新的强调与创业机器相似。然而，国家经济机器通过初创经济和较小规模的创新发布了关于国家或区域经济增长的强有力叙事，反过来又吸引了公共和私立资金的支持。与创业机器不同，国家经济机器有各种政府机构的直接和间接参与。例如，`巴巴多斯外交和对外贸易部`与\
  \ `Microsoft` 合作组织了黑客松，以创建满足国家挑战的原型。这次黑客松是组织的散民会议的一部分，旨在吸引巴巴多斯移民对技术创新的入境投资，作为该国外交政策的一部分。此外，国家和区域经济发展战略及资金可以为利用黑客松作为增长初创经济的手段提供财务支持。例如`Garage48`\
  \ 为爱沙尼亚和巴尔干地区组织黑客松系列，并由 `欧洲区域发展基金` 部分资助，以支持该地区的创新和经济发展。黑客松侧重于向参与者灌输硅谷的创新理念，并向该地区引入创业文化和创业实践：“Garage48\
  \ 在这里是为了展示，这完全取决于积极的‘让我们开始’态度、创意的团队成员和一个具有激励性的截止日期。”然而，在“后殖民”国家参与国家经济机器同样关乎经济和国家建设。对创业和创新能力的强调提供了打破其殖民过去并构建新国家身份的可能性（Datta,\
  \ 2015）。鉴于技术和政治动机，只要能够展示国家的创新能力，对参与者的技术技能和作为项目构思提出的特定问题的控制就相对较少。然而，对于参与能达到何种程度的实现以及这种参与是否仅仅培养了“创业公民”（Irani,\
  \ 2015），仍存在保留。\n\n#### 开放创新工具\n`Open innovation instruments` 是通过利用组织公司或之外的专业知识来产生商业想法和原型的活动。这些黑客松通常涉及不同规模的公司和多个利益相关者，并号召具有技术、设计或业务技能的人参与。开放创新的黑客松可以由大型（跨国）公司组织，这些公司通常不在\
  \ IT 行业，但高度依赖 IT 基础设施运营或依赖 IT 创新来提供新服务。例如，`德国铁路`（`DB`）是数字战略的一部分。它还得到了企业和社会伙伴的支持，包括德国的\
  \ `Open Knowledge Foundation`、一个数据可视化平台（`Tableau`）、一个加速计划（`Data Pitch`）、一个关注女性的设计师组织（`Ladies\
  \ UX`）等。这些合作伙伴关系旨在增加……（注：此处翻译完整）。`Open innovation instruments` 是通过利用组织公司之外的专业知识来产生商业想法和原型的活动。这些黑客松通常涉及不同规模的公司和多个利益相关者，并号召具有技术、设计或业务技能的人参与。开放创新的黑客松可以由大型（跨国）公司组织，这些公司通常不在\
