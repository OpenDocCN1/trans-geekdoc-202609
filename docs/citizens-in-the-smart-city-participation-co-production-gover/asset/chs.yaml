  \ 75–89.\n\n\n\n\n\n# 第 7 章\n\n## 反对智能社区的浪漫主义：以 Milano 4 You 为例\n\nCesare Di Feliciantonio\n\
  \n### 摘要\n在本章中，我解析了与意大利首个“智能区”`Milano 4 You`相关的“智能社区”概念。该项目将位于 `Segrate`，这是米兰大区最富有的市镇之一。通过批判性政治经济学的视角（特别是\
  \ Miranda Joseph 和 David Harvey 的工作），本章关注“智能社区”背后的经济理性，即一个生产与消费的社区。事实上，新居民被构想为自雇企业家，他们愿意重新获取自己的数据并将其变现，同时共享一种“智能”的生活方式。然而，本章避免了还原论和负面的解读，而是强调了抗争的潜力以及替代性理性出现的可能性。关键词：社区；智能区；新自由主义；房地产；米兰；政治经济学。\n\
  \n### 引言\n2017 年年初，意大利国家和地方媒体广泛报道了意大利首个“智能区”`Milano 4 You`建设方案获得批准。该项目位于 `Segrate`，是米兰大区最富有的市镇之一。该项目涉及对一片\
  \ 300,000 平方米棕地的再生，该棕地紧邻的一块土地过去曾是若干个未完成城市开发项目的目标，导致少数已建成建筑的居民陷入了困境，因为那里缺乏基础服务，且存在严重的施工技术问题。批准\
  \ `Milano 4 You` 项目的决定主要是为了解决现有建筑居民面临的持续问题，同时推广一种以技术创新和住房及商业活动可持续性为中心的新型城市模型。拟建新建筑的\
  \ 80%将用于住房，由多种单元类型组成：普通公寓、社会住房、“住宅房”（一种微别墅）和“养老住房”。后者将由为老人提供的居住单元组成，配备智能健康技术，以减少居民去医院检查的需求。该项目是不同私营参与者伙伴关系的成果（正如目前项目网站上列出的，房地产公司\
  \ `RED`、`IBM`、`Samsung` 和米兰理工大学 `Politecnico`；在公开演示中，还列出了几个额外的商业伙伴）。`Segrate` 位于米兰大区的东部，紧邻市边界，紧邻利纳特机场。`Segrate`\
  \ 的人均平均收入位全国第八。² 除了 `Milano 4 You`，`Segrate` 目前正经历着强烈的房地产活力，主要项目是 `Westfield Mall`，预计于\
  \ 2020 年完成，并被誉为“欧洲最大的购物场”。³ 为了更好地将购物场与城市连接起来，一条地铁线延伸正在建设中。“智能区”项目反映了米兰城市政治经济的主要趋势，即大型房地产开发项目是吸引私人投资进入的主要工具（Anselmi,\
  \ 2015; Kaika & Ruggiero, 2016; Savini & Aalbers, 2016）。这种由物业主导的过程目前存在全球所有主要的城市经济中，受到青睐因为它为金融投资者提供了“空间修复”（Fernandez,\
  \ Hofman, & Aalbers, 2016; Harvey, 1982）。随着`smart city`概念的传播，几个数十亿美元的智能房地产项目应运而生，最广为人知的（并被学术界研究，例如\
  \ Shin, Park, & Sonn, 2015）的是韩国的 `Songdo`。`Songdo` 起于 2003 年，得益于设立特经济区（SEZ）以吸引投资，已拥有超过\
  \ 10,000 名新居民和若干商业活动。根据 Kim (2011) 的观点，自启动以来，`Songdo` 被框架化为“U-生活空间”和“世界最大的无处不在城市，高科技基础设施数字化连接了家庭、街道和商业”（第\
  \ 16 页）。其他类似的知名房地产主导的智能城市开发项目包括纽约的 `Hudson Yards`、阿拉伯联合联酋的 `Masdar` 和多伦多的 `Quayside`（例如\
  \ Carr, 2018; Cugurullo, 2013）。谁预计将搬入 `Milano 4 You`？正如本章所示，项目开发者反复提到居民“智能社区”的形成。通过批判性政治经济学的视角，本章批判性地解析了项目部署的社区概念，它激发了哪些利益和积累策略（如对社区的召唤），以及它揭示了哪些政治可能的新颖元素。在分析\
  \ `Milano 4 You` 发展的社区理念时，我还考虑了项目的领土嵌入性，证明了“智能社区”的原则如何呼应了 `Milano Due` 项目的代表性和物质性——该项目是\
  \ 20 世纪 70 年代在意大利创建的首个封闭式社区，同样位于 `Segrate`。在方法论上，本章基于 2017 年在米兰进行的实地调查，利用了一系列研究方法（对项目利益相关者的半结构化访谈、关于地租在城市经济中作用的二次数据分析，以及对开发项目和当地媒体文章的内容分析）。本章结构如下：下一节，我回顾了关于社区理念的政治经济学辩论。第三部分，我简要描述了\
  \ `Milano 4 You` 对于米兰智能城市政策的五个主要目标。第四部分，我分析了项目中构想的社区理念，强调了它如何呼应 `Milano Due` 封闭社区背后的思想。最后，在结论中，我基于\
  \ Miranda Joseph 的辩证视角，避免对项目进行负面和封闭的解读。\n\n### 社区、资本主义与消费\n\n\n\n\n为了从批判性政治经济视角对\
  \ Milano 4 You 案例中的社区唤起进行框架化，我基于了米兰达·约瑟夫（Miranda Joseph）的工作，特别是她的著作《反对社区浪漫主义》（*Against\
  \ the Romance of Community*, 2002）。这一视角提供了一种思考资本与社区之间紧密且矛盾的联系的可能性，后者是学者、政治精英和基层运动所使用的争议性最大的概念之一。尽管不同的参与者出于不同的目的使用这一概念，他们仍然倾向于暗示在一个边界清晰、明确的领土内或围绕共同价值观存在一个真实的、原始的“社区”，而资本通常被描绘成全球性的，仅由经济价值驱动并异化了人类互动。针对这种广泛的表述，约瑟夫的书阐释了社区（如我们所知的那样）的存在和运作如何与资本主义的历史和运作联系起来，尽管这种唤起被用来支持或挑战资本主义的力量和理性。通过将“社区”的使用和表述框架化为物化社会阶级的资本主义理性工具，约瑟夫瓦解了连接社区成员的共同身份的观点；事实上，“社区主体性不是通过身份构成的，而是通过生产和消费的实践构成的”（p.\
  \ viii）。换句话之，“社会形成（包括社区）是通过生产的表演构成的”，而且“资本主义是社区得以演出的媒介”（p. xii）。然而，约瑟夫避免了对这种关系进行单体化和还原论的解读，在这种关系中：社区和资本在内部是不连贯的，在外部是连接的。社区和资本似乎是相互依赖的结构，同样，社区被揭示为相互依赖。但同时，一种补充性的阅读维持了社区与资本之间的不连续性。（pp.\
  \ 2–3）这种视角如何与像 Milano 4 You 这样围绕房地产和数字技术的社区联系起来？遵循约瑟夫，我们可以采用大卫·哈维（David Harvey,\
  \ 1978）的工作作为对比，特别是他关于资本主义下建筑环境作为“生产初级循环”（即最传统意义上的工业生产）过度积累的盈利替代方案的具体作用的研究。哈维的作品似乎尤为相关，因为他在他的著作《城市体验》（*The\
  \ Urban Experience*, 1985）中公开参与了社区这一概念。在他看来，“社区是一个高度模糊的概念，尽管在劳动力再生产、收益流通和资本积累地理学方面发挥着根本性作用”（p.\
  \ 231）。事实上，“我们称之为城市、城镇甚至邻社区的特定类型的社区，相反，是由某种特定的社会经济和政治过程构建而成的确定场所。从金钱和资本的‘社区’的角度来看，这些地方仅仅是根据盈利指令有待建立、拆除或遗弃的相对空间。但从居住在那里的人们的角度来看，这些地方可能是特定忠诚的焦点”（p.\
  \ 233）。然而，这种资本利益与居住在“社区”的人们利益之间的对立仍然是基于矛盾的；事实上，一个人可以反对为了资本利益而拆解自己的社区，但仍然可以从基于投机的特定金融工具或投资中获（例如养老基金）。因此，资本与社区之间的辩证关系需要通过承认唤起和构建社区所涉及的能动性和赋能潜力，同时也承认其局限性和矛盾来通过批判性的审视。这意味着要考虑到社区形成与生产消费动态之间的紧密联系。这种辩论可以转化为*智能城市*文献，在其中，这种紧张关系和矛盾与对“智能公民”日益增加的关注产生了共鸣。遵循那些强调*智能城市*议程如何强化城市政策的新自由主义化（例如\
  \ Hollands, 2015; Kitchin, 2015; Townsend, 2013）同时增加控制和监控（例如 Kitchin, 2014）的批判性声音，越来越多的学者开始质疑智能倡议背后的社会和基层维量（例如\
  \ Cardullo & Kitchin, 2018; Joss, Cook, & Dayot, 2017; Sadoway & Shekhar, 2014）。与本章范畴特别相关的是\
  \ Vanolo（2016）最近的工作，她探索了公民在*智能城市*倡议核心主要想象中的作用和地位。在 Vanolo 识别并追踪的四类“智能公民”想象中，两类对于框架化智能住房项目案例中资本与社区之间的矛盾关系似乎很有用。第一个是\
  \ #3 想象（pp. 33–34）“活跃的公民和作为传感器的居民”，这与智能城市的理念相关，即从公民的智能手机接收反馈并通过嵌入环境的传感器收集数据，以使城市更高效、更可持续，因为它能够实时提供服务。因此，城市公民参与计算感知和监控；为了这样做，他们需要是非常同的：“他/她受过数字教育，他/她拥有智能手机和电脑，他/她不断关于其/她日常生活中的一切产生数据和反馈”（p.\
  \ 34；另见 Gabrys, 2014）。第二个是 #4 想象（p. 34）“未来城市中的未来公民”，基于一种模糊的时间政治，这种政治将“实际存在的”公民视为“注定要不断在现在的福利（快乐）与未来的政治之间进行权衡衡”（Gabrys,\
  \ 2014）。这种想象基于对“过去公民”是有罪的且不负责任的愿景，而“未来公民是未定义的主体，声称在体面世界中生活拥有不可逃避的（甚至是后政治的）权利”（Vanolo,\
  \ 2016; 另见 Datta, 2018; Kitchin, 2019）。\n\n\n\n\n塞格拉特（Segrate）实现的“智能区”理念并非凭空产生；事实上，正如\
  \ Vanolo（2015）所出的，自 2011 年以来，意大利政府在`smart cities`投入了大量资金，将其作为推动停滞和富裕大都市经济增长的工具。在这方面，米兰市一直是开发`smart`项目最活跃的城市之一，经常与私营部门合作以竞标欧盟资金支持。\n\
  \n2013 年，米兰市会和商会组织了一场听证会，旨在将米兰建设为智能城市，并签署了“智能米兰”（Milano Smart City）协议。随后，市会发布了《智能米兰指南》，涵盖了不同领域，如公共交通、能源政策、社会包容与多样性、居民福祉，以及更加透明高效的城市治理。\n\
  \n这些指南涵盖了围绕`smart city`理念的所有主要特征和批评（例如：Hollands, 2008; Kitchin, 2014; Vanolo, 2014），整个策略围绕新自由主义城市主义的核心理念和理想构建，例如将城市推广作为一个生活实验室、优先考虑公共基础设施和服务的私营投资、唱响可持续发展的口号，并将公民仅视为消费者和用户（例如：Kaika,\
  \ 2017; Künkel & Mayer, 2012; Swyngedouw, 2016）。\n\n根据这些理念，Milano 4 You 的宣传材料列出了五个主要目标：\n\
  \n1. 第一个目标是“零成本城市”，即得益于先进的建筑技术大幅降低能源和维护成本，包括具有高隔热性能的建筑围护，以及专为此设计的、通过双向区域能源基础设施互联的公共电力、热和制冷微发电系统。此外，该项目旨在密集利用“本地”可再生能源（占总能源需求的\
  \ 75–80%）。\n2. 第二个目标是“更安全的生活”，数字技术允许持续和远距离监控，从而物化了数字技术和智能城市相关的主要叙事之一（Kitchin, 2014）。\n\
  3. 第三个目标通过在年龄和社会阶层方面多样化的居民社区来实现“包容与参与”，因为该项目包含了社会住房。这与意大利整个住房行业以及近年来在米兰实现的城市发展项目都构成了反向趋势。事实上，自法西斯政权（1922–1943）以来，社会住房在意大利历史上一直非常边缘化，传统上被视为通向购房的临时步骤；这一趋势保持不变，几乎没有住房支出（2009\
  \ 年仅占国家 GDP 的 0.1%；参见 Di Feliciantonio & Aalbers, 2018）。关于米兰近期的城市发展，大多数房地产项目都是规模宏大的，涉及大型银行、开发商和“建筑巨星”，正如最近的\
  \ City Life 案例（Mosciaro, 2018）。这种反向趋势的形成得益于投资资金和之前项目相关参与者破产所导致的廉价地价。\n4. 第四个目标是创建不同的服务以提高居民的生活质量，并通过用于护理工作和交通的`sharing`平台降低生活成本。\n\
  5. 最后一个目标涉及一种新的工作模式，通过创建基础设施实现远程办公、联合办公和其他形式的数字工作。\n\n### 一个由居民组成的智能社区？\n\n\n\n\n\
  遵循上一节介绍的项目目标，我现在的重点是将搬入 Milano 4 You 的预期居民社区，并展示该项目“新颖性”背后的叙事在塞格拉特（Segrate）案例并非先例，因为它呼应了\
  \ 20 世纪 70 年米二（Milano Due）实现的叙事。\n\n在回顾该项目的广告材料时，不断提到 Milano 4 You 的“社会”维度，主要通过假设将在那里搬入并在那里形成的“智能社区”。在于维也纳城市创新中心进行的一次演讲中，Milano\
  \ 4 You 的一位发言人提到了项目的“社会与福祉支柱”，该支柱由五个元素组成：\n(1) 社会杠杆，作为社区的整合，并由服务、援助、健康生活方式、团结和共享所驱动；\n\
  (2) 通过便捷高效地获取服务和信息来优化时间和成本；\n(3) 对涉及环境可持续性、交通出行、社会经济共享、社会凝聚力和包容性的良好社会实践给予奖励；\n(4)\
  \ 通过创建一个与公共管理交互的数字平台，增强电子政府和电子民主解决方案；以及\n(5) 一个参与不同活动的文化中心。\n\n这些具有社会参与性的社群原则的使用证实了新自由主义如何吸收并商品化了历史上与反抗社会运动和乌托邦相关的某些原则（例如：Boltanski\
  \ & Chiapello, 1999; Schwanhäusser, 2014）。在 2017 年 7 月与该项目同一位发言人的深度个人访谈中，他更深入地阐述了项目预想的“智能社区”理念，强调一个关键特征将是居民产生的数字数据的重新利用。\n\
  \n用他的话说，这将是“一个社区使用自己的数据将其卖给医疗部门、商业、零售、保险和银行”。尽管这个集体的法律形式尚未确定，但其核心思想是住在 Milano 4\
  \ You 的人将通过一个社区共享他们所有的数据；该平台将随后向市场“组织、解释、清洗并出售数据”。所获得的利润将重新投资以支付建筑和其他公共服务的维护成本，从而支持项目的第一个目标——“零成本城市”。\n\
  \n这种“智能社区”似乎体现了传统上与新自由主义公民身份和主体化相关的一些基本特征：市场理性进入并塑造了日常生活，包括居住和社区决策，主体有意识地决定为了利益进行自我监控和自我控制（例如：Dardot\
  \ & Laval, 2014; Di Feliciantonio, 2016; Scharff, 2016）。住房的新自由主义化因此达到了顶峰，即与住房选择和生活本身相关的金融投资（例如：Cooper,\
  \ 2008; Rolnik, 2013）。\n\n在思考塑造 Milano 4 You 项目的“新颖性”和“安全性”理念时，显然它与意大利第一个封闭式社区（gated\
  \ community）米二项目之间存在非常紧密的关联。事实上，在与上述发言人的访谈中，他也对比米二和 Milano 4 You 之间进行了对比。多项研究调查了封闭式社区理念如何在不同地点参与了新自由主义计划（例如：Atkinson\
  \ & Blandy, 2006; Grant & Rosen, 2009）；米二案例尽管在时间上早于新自由主义的兴起，但符合这一趋势。\n\n事实上，正如 Lidia\
  \ Monza (2017) 所示，米二项目对（私有化）城市空间的建设预见了新自由主义下工作的一些主要趋势，特别是：\n(1) 以拥有远离“风险”和“危险”的“安全”空间为名的社会隔离；以及\n\
  (2) 消费作为阶级的主要标记。\n\n用 Monza 的话来说：米二代表了一个精英化的项目，提供了一种逃离米兰不可持续城市环境的方法。尽管米二现在已经四十多年历史，但该社区是城市空间私有化过程的现状表达。此外，米二鼓励了对城市生活的“重新定义”，并建立了一个新的社会秩序。(p.\
  \ 239)\n\n然而，正如 Monza 的引言所揭的，与当前的城市空间新自由主义化过程相比可以发现重要的差异，主要的区别在于是驱动项目实现和推广的反城市叙事。同样，在\
  \ 20 世纪 60 年代末，大多数意大利城市的米兰特点是有激烈的社会冲突，这被精英阶层用来将城市描绘成危险和不安全的空间（对于中产阶级而言）。米二的建立正是基于这种构想，即需要一个远离城市冲突和犯罪，同时也远离作为主要城市区域的污染和交通拥堵的“安全”空间。\n\
  \n这种一个（并不）远离乌托邦式城市空间的隔离想象，与当前关于米兰（以及普通城市）的霸权叙事发生了碰撞。事实上，米兰目前被描绘为一个供年轻“创意”阶级居住的“酷”地方，正如几个社区的泛滥绅士化以及对大型改造项目的巨大投资所示（Manzo,\
  \ 2016）。为了应对这种趋势，Milano 4 You 的开发者并不旨在强调与城市市中心的`distance`（距离），而是`connection`（连接）。这里的`connection`\
  \ 在多个层面运作，从汽车共享到允许居家办公的极速互联网。在将 Milano 4 You 的历史嵌入地点历史，并利用此前对“社区”理念的使用创建一个基于社会阶级和生活方式的私人空间的同时，这段简短描述也揭示了该项目中运作的相反趋势，例如混合社会阶级和负担得起的价格。\n\
  \n\n\n在本章中，我分析了意大利首个“智能区”这一正在进行的项目。该项目将位于塞格拉特（Segrate），这是意大利最富有的市之一，紧邻米兰市中心，且房地产行业充满活力。在承认该项目具有“卓越”特质的同时，我展示了它是如何体现新自由主义城市的一些主要趋势的：空间私有化，以及为了抵御“风险”和“危险”而确保“安全”与“控制”是其核心叙事的核心。为了最好地推广该项目（并销售单元），广告材料围绕着一个迁入此地的“智能社区”理念展开，即那些意识到数据对于资本积累和社会再生具有主要重要意义的人们。这些新居民乐于重新获取他们产生的数据，并有意识地进行自我监控，以便将数据出售给私人公司。\n\
  \n通过对社区的政治经济批判视角（包括哈维维的工作），我们可以清楚地看到，在 `Milano 4 You` 的案例中，“智能社区”被动员以实现地租收益的最大化，并通过结合生产与消费来推动资本的积累和再生。事实上，预想居民所共享的主要价值体现在拥有“智能”生活方式的首要性上，即消费“智能”，尽管这意味着自我控制和监控的动态。遵循\
  \ Joseph（2002）的观点，这一过程不仅涉及消费，还涉及生产。事实上，居民将通过出售有关其日常生活的数据成为自我企业家，这体现了最纯粹的新自由主义主体化。\n\
  \n然而，顺应 Joseph（2002）的辩证观点，我不想以一种悲观的基调结束，即断言人们对数字资本主义是不可逃避的完全服从，从而忽视了改变和断裂的可能性。我们确实可以推测，由于地理位置良好且价格合理，`Milano\
  \ 4 You` 可能会吸引不稳定的、中低收入劳动者，他们将能够通过聚集和共享日常生活空间，发展出新形式的互助、团结和自力性。此外，他们将有意识地重新获取并控制数据，从而打破目前的逻辑——这种逻辑使得我们的数据往往被处于垄断状态的数字公司免费占用（Shaw\
  \ & Graham, 2017）。\n\n这种重新获取行为的预期范围是产生利润。当然，我们可以很容易将这种姿态框定为新自由主义理性的另一种再生形式；或者，我们可以遵循\
  \ Gibson-Graham（例如 2005）的观点，思考产生替代性剩余形式所开启的可能性：如果这些钱被引导到社区计划中呢？或者用于新的公共服务呢？剩余和利润需要以不同的方式来思考，否则对替代性生活形式和社会组织方式的思考将是不可能的。正如本合集引言中所提到的，为了超越新自由主义的智能城市构想而重新构想“城市权利”，需要这样一种批判性的理论和政治立场。`Milano\
  \ 4 You` 会成为一个更公正、更具包容性的城市现实吗？居民的需求会代表项目的核心吗？剩余是否会重新投资于社会再生？由于 `Milano 4 You` 是一个正在进行的项目，这些问题目前还没有最终答案；然而，重要的是要记录居民（大多数智能城市文献所说的“公民”）如何有空间进行“主动”干预，以决定他们将要居住的“智能区”将成什么样。\n\
  \n### 致谢\n\n本章的研究资金由 ERC 高级研究员奖金资助，“可编程城市”（`ERC-2012-AdG 323636-SOFTCITY`）。\n\n\
