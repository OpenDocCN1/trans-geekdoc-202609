  \n\n\n\n\n# 第 6 章\n\n## 智能公有还是公有地的“智能方法”？\n\nPaolo Cardullo\n\n### 摘要\n本章对智能城市中的公有地和共有化（commoning）进行了批判性反思。文章指出，所谓的智能公有——即数据和数字基础设施的所有权形式，这些形式在关于智能技术征用和共同生产的话语中日益核心——倾向于更关注结果（开放数据或自由软件），而不是维护和再生此类公有的过程。因此，本章为公有地的“智能方法”提出了立场论，主张公众作为利益相关者，在推进、培养和维护智能城市公有地方面发挥核心作用。通过三个简短的案例研究说明了这一观点，这些案例反映了与公共互联网实施相关的公有和共有化实例。*关键词*：智能城市；公共互联网；智能公有；共有化。\n\
  \n### 引言\n目前已有大量关于智能城市的跨学科文献，其中很大一部分植根于批判性社会科学。Kitchin (2014, p. 5) 认为，智能城市“越来越多由无处不在且无处不在的计算构成并受到其监控”，这些计算利用“实时分析来管理城市运作和监管的各个方面”。在这里，通过控制中心、App\
  \ 和仪表板实施的技术官僚治理形式日益中介了日常生活，但也被用于预测引人入胜的城市未来（Kitchin, in press）。对于 Hollands (2008,\
  \ p. 305) 来说，这种智能城市代表了城市新自由主义化和绅士化过程中技术驱动的阶段：一种“城市创业主义的高科技变体”，旨在吸引创意阶层并规避社会正义的概念。Shelton、Zook\
  \ 和 Wiig (2015) 展示了智能城市理念（理想）在特定地点实施方式的复杂性和多样性：“智能城市的干预始终是城市治理和建成环境现有社会和空间构型的结果”（p.\
  \ 14）。他们注意到，智能城市政策在不同地区之间的迁移并不顺畅，最终扩大了智能城市理念（理想）与“这些政策正在构建和实施的实际存在的城市、领土和关系性”之间的差距（p.\
  \ 22）。这些批判性学者以及许多其他人（例如，Cardullo & Kitchin, in press; Kitchin, 2015; Rossi, 2017;\
  \ Vanolo 2014）破解了新自由主义与智能城市之间的关系，认为这种新城市战略背后的治理推动旨在增强解决城市问题的技术解决方案以及城市服务提供的私有化。然而，通过暴露智能城市的意识形态前提和实际运作，并将“智能性”与自上而下的技术解决方案和企业主导的效率脱钩，他们也为想象替代城市未来提供了空间。最近的批判性干预开始勾勒出城市中思考技术的替代方式，即共同共享和拥有数据（例如，Balestrini\
  \ et al., 2017; Bria, 2017; Corsin Jimenez, 2014）。他们主张智能技术生产和使用方式的激进转型，认为城市应该是一个拥有共享资源的共享环境，换句话说，是一个公有。但是，“智能公有”能否通过包容性的数字和社交政策保障公民的城市权利，同时促进公民的有意义参与呢？“智能公有”计划似乎往往更关注从资本循环中夺回资源，而不是维护和再生此类公有的过程（见\
  \ Angelis, 2017; Huron, 2015）。\n\n本章探讨了公共互联网提供作为一种公有的可能性。在集体想象和大多数人的日常使用中，接入无限制、超快速且可能免费的互联网已成为构建智能城市过程中具有符号意义的关键。本章为公有地的“智能方法”提出了立场论，主张公众作为利益相关者，在推进和维护智能城市公有地方面发挥核心作用。本章简要阐述了三个案例研究，反映了与公共互联网基础设施实施相关的公有和共有化实例。第一个案例评估了私人数字平台（Google\
  \ 拥有的 App `Waze`）的数据提取实践，以及其收集“群体智慧”的声称。第二个案例涉及田纳西州查塔加斯市市政超大宽带的提供，并探讨了基础设施公有化带来的机会，尽管对其治理过程持有批判态度。第三个案例重新审视了一项关于共享社区资产的民族志描述，即伦敦市中心一个名为\
  \ `Open Wireless Network`（缩写为 `OWN`）的无线网络，并反思了共有化及其与非正式性的联系（Cardullo, 2017）。它们共同强调了将互联网作为关键基础设施提供的轨迹，反映了关于公有的智能城市、非正式性和民主治理。\n\
  \n### 公有地与共有化\n在接下来的章节中，将结合批判性城市学术和“城市权”，讨论城市公有地与共有化之间的区别。\n\n\n\n\n\n在关于公地的海量文献中，有一种非常有用的思路认为，这与其说关乎公共与私人城市空间之间的冲突，不如说它是争取公地斗争的一个重要方面（例如\
  \ De Angelis, 2001; Stavrides, 2016）。相反，从历史角度看，公地表现为人们进行社会再生产的场所。这种困惑恰恰在于对公地理念的偏离，这种理念是在在中世纪的英国作为反对土地圈地运动的斗争产生的。根据\
  \ Illich (1982) 的观点，人们并不将这一公共空间视为“非私人空间”，而是将其视为保障日常生活生存的空间。使用公地是一种临时占有的行为，是一种为了社会再生产的日常实践：因此，公地的决定与其说取决于其所有权制度，不如说取决于其周围的使用和实践。\n\
  \n换句话说，一种公共利益本身并没有本体论上的实体。它`因为与一个或多个主体之间的质性关系而成为公地`；正是一个场所或物体的使用价值使其与公地产生了相关性：“你并不拥有一个公共利益，你是在共同分享公共利益”（Mattei\
  \ 被 Iaione 引用，2012, p. 112）。对于 McLaren 和 Agyeman (2015, p. 24) 来说，“共享与合作是普遍的价值观和行为”，因此，“共享是一个释放[受竞争市场和官僚国家限制的人们的协作]能力的机会”。所以，如果城市是拥有共享公共服务、街道、大众交通和共享空间的共同产物，那么“真正的智能城市也必须是共享的城市”（McLaren\
  \ & Agyeman, 2015）。\n\n因此，批判性学者倾向于强调“公地化”（commoning），这是一系列实践，它们“积极寻求将国家和资本的资源整合进公地循环中”（Birkinbine,\
  \ 2018），并通过在新兴的团结网络中共享此类资源来再生产公地。这使我们的关注转向对公地的长期维护，根据 Huron (2015, p. 973) 的说法，这是“公地的真正挑战”。De\
  \ Angelis (2017) 认为，这一挑战取决于相关利益共同体的日常实践，以及附带的权利束及其执行情况，这些权利应当保护公地并确保其再生产。因此，“公地化”凸显了城市公地的争议性、开放性和政治特征（De\
  \ Angelis & Stavrides, 2010），它现在是“一项围绕不同价值观和伦理准则构建新共识形式的草根项目”（Susser, 2017, p. 1）。\n\
  \n### 数字公地与城市物质\n但当现在大多数人的生计（尤其是全球北方）可能依赖于信息、通信和编码的访问时（Lash, 2002），这在今天意味着什么？如果这些是非易耗尽的公地——它们的使用不会耗尽数字资源——那么在维持所有人访问权和利益的同时，为这些贡献提供奖励是否是一个治理挑战（McLaren\
  \ & Agyeman, 2015, p. 130）？虽然 Hardt 和 Negri (2009) 认为数字公地是“非物质的”，但重要的是，通过生产，这本身就呈现出了一套新的社会关系和空间组织：生活在（智能）城市的人们不仅是城市居民、邻居或市民，更是城市公地（包括数据）的生产者和产品。\n\
  \n因此，对数字公地（信息、知识、数据、软件等）的唯物主义批判在于对“城市权”的激进解读：它将城市公地、公地化和共享实践视为居住和社会再生产的日常物质性。\n\n\
  ### 城市权与激进民主\nHenry Lefebvre ([1967] 1996) 提出的这一具有影响力的概念，其理念是城市空间是使用者的“艺术品”，被居住在那里的人们的日常实践所占有。根据\
  \ Purcell (2008) 的观点，Lefebvre 通过“占有权”所提出的不仅仅是物理上存在于城市空间的权利，而是根据居民的需求来塑造该空间的可能性。在这种装扮下，城市权是“一种通过更符合我们心意地改变城市来改变我们自己的权利”（Harvey,\
  \ 2003, p. 1）。\n\n显然，在这种表述中，激进民主问题无法与公平和平等的诉求分离，以至于涉及到“对城市化进程的某种塑造权力”（Harvey, 2003,\
  \ p. 2），这让我们回到了霍 Holland (2008) 对新自由主义智能城市的“社会正义批判”。对于我们的论点而言，对 Lefebvre 的这种解读有两个重要的结果。首先，城市权将参考尺度转向了城市，在城市中生活本身就是斗争的对象：“城市是定义政治共同体的霸权尺度”，因此，“在定义政治共同体时，城市居住必须放在首位”（Purcell,\
  \ 2008, pp. 99, 108）。由此得出，居住作为一种生存模式，接管了其他的政治共同体权利（例如，属于某个民族国家）。\n\n此外，向城市的重新缩放（re-scaling）意味着城市政策和决策的有了种不同的安排。这是一个准备好接纳公民政治诉求的空间：根据\
  \ Marcuse 对 Lefebvre 的解读 (2009)，这是他提出的最激进的想法，因为它将城市开放给了那些剥夺了物质生存和法律权利（*诉求*）以及替代未来（*需求*）的人们。进一步来说，其次，这种对\
  \ Lefebvre 的解读所提出的民主化项目开启了对城市空间新自由化的批判。这是因为暗示了从交换价值向使用价值的激进转变，为优于市场主导的城市空间组织提供了有力的论据（Purcell,\
  \ 2008）。\n\n城市权并非仅仅写在法律框架中，也不与国挂钩，而是为了未来城市的政治斗争，是对激进民主本身的斗争。结果是，城市权似乎涉及一系列主张和成法权利（这些是人们“诉求与需求”的前期表达），根据各种语境、历史节点和政治斗争而延伸或收缩。然而，Lefebvre\
  \ 所指的“权利”保持模糊，以至于“权利本身仍然是一个黑箱”（Attoh, 2011, p. 669）。由此得出，一方面，对公民、社会、符号和新出现的数字权利的重新关注是欢迎的，以至于“[响应式的]社区主义可以与更自由的权利概念相结合”（McLaren\
  \ & Agyeman, 2015, p. 203）。另一方面，共享盈余的社区主义价值观对于正处于资源匮乏、诉求竞争且往往面临紧缩政策的城市来说可能是至关重要的（McLaren\
  \ & Agyeman, 2015）。\n\n总而言之，重新框架公地的“问题”似乎更为合适，从经典的私有/公共/公地三元论，转向新兴的资本主义/城市/公地构型（见\
  \ De Angelis, 2017）。在这里，参考尺度位于城市和亚城市层面，而斗争则在两个创造和循环财富与福祉的之间往回移动：资本循环和公地循环。\n\n\n\
  \n\n\n本节通过简要介绍三个关于互联网提供的用途、所有权制度及其对公有化（commoning）影响的案例，讨论了智能城市中城市公共体的维护。这些研究基于此前对伦敦市中心社区主义无线网络的初级研究、近期对欧洲智慧城市项目的访谈以及许多次级资料。尽管智慧城市不仅关乎宽带连接，但接入无限、超快速且可能免费的互联网对于智慧城市的建设具有符号意义上的至关重要：互联网骨干网被认为是智慧城市的骨干。该领域的先驱工作警告说，在信息化的压力下，城市领土可能会碎片化和极化，产生排他的高科技（现为“智能”）飞地和高速公路（Graham\
  \ & Marvin, 2001）。因此，以下三个示例是对互联网作为关键基础设施的初步调查，即将其作为市民及其参与智慧城市的基本需求。\n\n## Google-Waze：集体智能问题\n\
  \n第一个案例与对高级资本主义下数据生产和使用的各种批评相吻合：技术批评家叶夫格尼·莫罗佐索夫（Evgeny Morozov）将其称为“数据提取主义”（2015），其他人则称为“数据殖民主义”（Thatcher,\
  \ O’Sullivan, & Mahmoudi, 2016）或“平台资本主义”（例如，Shaw & Graham, 2017）。他们都指出，通过消费和休闲产生的数据惊人地集中在少数硅谷初创公司手中。尽管这个例子并没有涵盖所有的智慧城市倡议，因为它呈现了一个具有用户半自动反馈的二阶控制实例（Kitchin,\
  \ Coletta, & McArdle, 2017），但通过交通制图实现的移动性已成为“智慧城市”包含内容中最受欢迎且最易识别的特征之一（Picon, 2015）。拥堵回避应用\
  \ `Waze` 被认为已变成了一种集体知识努力，其中，“像鸟群一样，连接物联网的汽车和司机现在惯常表现出高程度的集体智能”（Eggers, Guszcza,\
  \ & Greene, 2017）。支持者提出的论是，通过所有人使用 `Waze`，产生了一种社会努力，使得城市更具导航性，且效率高于任何个人能力。最终——毫无疑问地——我们让城市变得更好。事实上，“群体”已成为一个强大的比喻，象征着“从大量个体汇聚以解决一系列任务所能产生的力量”（Dodge\
  \ & Kitchin, 2013, p. 19）。由 Google（自 2013 年起）拥有的 `Waze` 为城市提供免费拥堵数据用于交通规划。或者更有可能，`Google-Waze`\
  \ 试图与地方当局“积极地建立伙伴关系”，通过交换数据来换取“公共利益”。¹ Google 与 `Airbnb` 和 `Uber` 等其他“零工经济”巨头一样，被认为通过构建深度学习\
  \ AI 和在其他公共或私有机构上建立竞争优势，将通过共同努力收集的大量数据变现（例如，Morozov, 2017; Thatcher et al., 2016;\
  \ Zuboff, 2015）。这个例子展示了数字公共体现在是如何通过生活本身，通过城市居住、社交交往和社会再生产的平凡且具体的实践被创造出来的。这种公共体延伸到整个城市：它是社会工厂\
  \ 4.0，已经离开了工作场所的物理和社会限制，进入了日常生活空间。这也是社会积累价值私有化（一种城市公有化的形式）的例子，它利用了“群体智慧”（一种城市公共体）：即资本从公共体循环中占有资源。值得注意的是，智能倡议可能会影响其他公共体——尽管这由于其假设的效率和“后政治”赋能经常被忽视（见\
  \ Swyngedouw, 2011）。虽然 `Waze` 可能让个人行程受益，但它也将交通带到了以前较不拥堵的侧街和社区（Weise, 2017）。此外，这种想象中的用户群体无法控制\
  \ `Waze` 的任何方面：换句话说，“智能群体”仅作为私有应用的数据产品、客户和用户参与。数据资本主义的有害方面促使许多活动人士和学者主张建立“智能公共体”，在其中数据的所有权和控制对民主至关重要（例如，Bria,\
  \ 2017; de Waal & Dignum, 2017; De Lange，本卷）。在部分承认这一点的同时，我认为数据和软件的民主化形式*本质上*并免免陷入“技术决定主义的后政治陷阱”（McLaren\
  \ & Agyeman, 2015, p. 20）：存在这样一种风险，这些倡议有时将“公共体”视为目标本身，而不是通向这一目标的“公有化”过程。\n\n## Chattanooga，“零工城市”\n\
  \n\n\n\n\n### 引言\n\n尽管快速连接对于数据资本主义的发展至关重要，但上面的例子也表明，互联网骨干网络通常被认为是理所当然的。正如马泽卡托一直以来暗示的那样（例如\
  \ Lazonick & Mazzucato, 2013），私营部门和主导的新自由主义话语大大淡化了公共部门通过核心基础设施、技能和素养投资，以及更广泛地通过承担失败的政治经济风险来推动创新和增长方面的作用。同样，胡\
  \ (2015, p. XVII) 认为，“支撑云物理起源的那些几乎被遗忘的基础设施往往源于国家的军事机构”，而“云”是互联网的一个引人入胜的比喻：“一种文化幻想，永远比其当下的技术表现更有意义”（p.\
  \ 97）。\n\n这在田纳西州查塔图加（Chattanooga）身上体现得尤为真实。该市在 2010 年成为美国首个提供 1 Gbit/s 高速互联网的城市（当时比全国平均水平快\
  \ 200 多倍），从而将一个污染且衰败的城市形象转变为繁荣的“千兆城市”（Kitheka, Baldwin, White, & Harding, 2016）。更值得注意的是，这种超高速互联网是通过市政和非营利的电力委员会（EPB）提供的，这使其成为美国在该领域最大的公共投资。这座中等规模的田纳西州城市（人口\
  \ 17 万万）在 2015 年再次登上新闻头条，因为他们实施了世界上首个全社区范围的 10 Gbit/s 互联网服务，`EPB` 服务区内的所有家庭和企业均可使用。这在美国的背景下尤为相关，互联网活动人士长期以来一直在抱怨私营承包商（所谓的“大电缆”：如\
  \ `Comcast` 和 `AT&T` 等私营巨头提供商）的撤资导致了数字鸿沟的扩大，这使得小型城镇和贫困社区陷入了落后（例如 Gonzalez, 2018）。\n\
  \n## 查塔图加案例研究\n\n查塔图加案例研究为关于智能城市中公共基础设施、治理和共有（commoning）的辩论提供了有趣的观点。\n\n### 第一，它拆解了一些迷话\n\
  即公众总是处于技术曲线之后，因此需要私营咨询、干预和技能（Kitchin, Coletta, Evans, Heaphy, & MacDonncha, 2017）；以及公众在交付方面缓慢、不可靠且效率低下——事实上\
  \ `EPB` 利用一笔用于实施其智能电网电缆铺的联邦贷款，比计划提前几年完成了其雄心勃勃的项目（Davidson & Santorelli, 2015）。\n\
  \n### 第二，它强调了城市规模的相关性\n与县、州和联邦规模相比，后者的立法阻碍而非促进了此类努力（例如，对 `EPB` 的定价政策和地理扩张设定限制）。换句话说，该市在一个特别敌对的环境中反转了私有化和市场主导解决方案的循环：大电缆公司和保守派向查塔图加市发起了无数法律诉讼，以限制公共部门的“垄断”并保证“自由市场”，这包括警告公共投资危险的电视广告（Rushe,\
  \ 2014）。\n\n此外，`EPB` 的光纤网络强有力地冲击了关于“网络中立”的辩论——即某些类型的数据应该被限速、计量或按不同的费率收费，这些是目前美国的热点（Gonzalez,\
  \ 2018）。\n\n### 最后，公民游说与智能策略\n即公民游说中等城市管理者的成功率可能比他们作为个人客户应对大电缆公司资助的海外呼叫中心时更高成功。毫无疑问，查塔图加这位受过斯坦福教育的民主党市长有一个典型的“智能城市”战略：通过数字枢纽吸引创意阶层，这增强了现在的几个技术孵化器并吸引了新企业，包括风险资本基金（Rushe,\
  \ 2014）。\n\n如果这个“互联网繁荣镇”（Koebler, 2016）的物质和符号效应在当地经济上是稳固的——聚合指标显示失业率较低且平均薪资翻倍——但这些通常也被\
  \ `假设` 会“滴漏”给穷人。还需要更多的研究来评估“千兆”对整体人口的影响，据称该人口的三之一面临贫困和社会排斥的风险。对于超高速互联网会自动为普通人带来更多利益的观点也存在怀疑：如果在查塔图加“仅需\
  \ 33 秒就能下载一部两小时的高清电影”（Koebler, 2016），那么我们可能想问，一个普通家庭一天可能使用多少部电影或类似的内容？\n\n作为间接证据，`EPB`\
  \ 现在拥有近 10 万互联网客户（超过查塔图加的一半民用和商业居民），但在其贫困社区，这一比例下降到约 20%（Koebler, 2016）：尽管 `EPB`\
  \ 为参加学校午餐计划的学生家庭提供半价补贴互联网，但似乎贫困居民更倾向于在 `Comcast` 签约，尽管其服务更便宜，但速度慢得多且有上限。换句话说，这种倡议的使用价值何？\n\
  \n## OWN: 非正式性与共有\n\n\n\n\n\n对于 Stavrides (2016) 来说，城市公地运作的一个基本特征是控制并最终撤销任命领导者的可能性。他认为，任何公地都与其用户处于辩证关系中，因为“公共空间不断产生产出它的人们”。因此，研究城市生活的排他性实践是理解`公共化`（commoning）的核心，即“创造和再生产公地的社会过程”（De\
  \ Angelis & Stavrides, 2010）。Harvey (2003) 同样倾向于使用动词“公共化”，以关注人们在与其居住的社会和物理环境交织时，人与人之间积极且具有主体性的社会关系。从对象到行动的转变在这里至关重要，因为现在的重点是实践和能动性，从交换价值转向使用价值，从眼期回报转向长期的“软性”成果。\n\
  \nOWN 起于 2008 年，始位于伦敦市中心德特福（Deptford）一个标志性黑客空间的屋顶。³ 它是一个由独立无线电台组成的网格（“节点”），为邻近社区或无线信号覆盖范围内的路人提供宽带接入。建立后不久，OWN\
  \ 曾一度达到近 100 个节点和 400 多名用户，但在过去几年里，该项目进入了下降时期。由于智能手机数据网络接入已成为标准，且图书馆和咖啡馆提供了更的公共服务，“对独立\
  \ Wi-Fi 基础设施建设的热情已经消失了一些”（Cardullo, 2017, p. 5）。非正式性和公共化是 OWN 初期获得欢迎的关键。这是因为 OWN\
  \ 具有巨大的使用价值，响应了当地人口的真实需求：这是一个工人阶级且多元化的社区，数字鸿沟和士绅化导致的流离压力巨大。这种节点网格特别适合流动人口、移民、学生和临时工，同时也服务了那些无能力加入任何正式服务（由于缺乏居住证明或资金）的财较不富裕的当地居民。\n\
  \n我对这一无线网络发展（2013–2015）的研究还表明，维护硬件网格、修补软件以及培训人员使用它，只有在拥有强大技术技能的受信任社区倡导者提供大量管理的情况下才是可能的（Cardullo,\
  \ 2017）。我们可以称他们为“伦理黑客”，这是反复出现的“公民黑客”与更晦涩的“黑客行动主义者”形象的结合。凭借某种程度的社会和技术技能、大量的志愿者工作以及偶尔的资金，他们建立并维护了一个免费的培训空间（“无线周三”）。这是因为让社区变得`运作`（operative）是一项根于信任的努力，这是一种长期关系，涉及至少两个方面：人们实际居住地易于识别的场所，以及具有参与性的项目，因为这些项目被认为是“有用的”，也就是说，它们被认为为用户做了“某事”。\n\
  \n还有另一个影响 OWN 提供的问题，正如许多其他公共热点一样。一位网格主主之一回忆道，“由于速度限制，OWN 不适合看视频，但适合普通浏览”（Cardullo,\
  \ 2017; 访谈摘录）。这让人想起查塔图加（Chattanooga）案例：骨干网提供可能是许多 DIY 项目成功的关键；速度和带宽有时很重要。尽管治理机制需要根据案例进行评估，但人们倾向于认为，关键基础设施的公共投资与社区主义精神的结合，或许可以在公共公地伙伴关系和平台合作主义中找到一些共同点（见\
  \ De Angelis, 2017; McLaren & Agyeman, 2015; Scholz, 2016）。这些重新提议了公共作为竞争性利益相关者的角色（Mazzucato\
  \ 关于“公共价值”的论，2018），同时保留了基层组织固有的精神、自主性和程度上的非正式性。\n\n### 结语\n\n关于数据和数字公地的论述中存在某种决定论，这些论述更多地关注对象（作为公共利益提供的特定数据集或软件），而不是导致和维持它的过程（公共化）。互联网和数据的可用性并不会自动转化为更公平的社区，或是更绿色、更宜居的城市。这是因为城市是混乱且复杂的场所，而且基础设施是社会技术装配，其运行取决于相关人员在其营造的环境周围的实践、使用以及相应的技能。在算法驱动的技术下，这种假设被涵盖在获取数据、选择最佳配置和响应以及实现反馈的过程中。因此，关于智慧城市解决方案与公共化的关系，仍有空间提出结论性的警告。\n\
  \n需要注意的是，互联网的提供需要中等水平的管理；然而，涉及社区参与时，管理变得至关重要，因为外行的参与程度越高，将他们纳入技术开发和采用的难度就越大。智慧技术要求进行文化和社会资本的部署，因为它们与社会交换相关，其实现取决于利益共同体和当地地区复杂的语境安排。此外，目前智慧城市使用的某些技术已经超出了人们与其计算过程的主体交互范畴，使得黑箱化、自主和自动响应成为可能（例如\
  \ Ascensão, 2016）：也就是说，平台和传感器在让社区“运作”方面没有任何自动性和决定性。最后，智慧城市创新面临产生排他性结果的风险，因为城市空间本身——公地的社会生产和生产空间——正日益被“租金”所分割，这驱逐了社区黑客行动主义者和当地居民。\n\
  \n总结论述的观点，与其英雄式地沉浸在控制论的小巷中，本章建议对智慧城市中的公地采取更务实的方法。这种方法会考虑到，例如，无数公民科学和众包项目构成了智慧城市的“自下而上的方法”，但如果没有显著的管理和坚实的基础提供（如互联网骨干网），它们将无法运作。此外，城市在制定支持（或阻碍）社区包容、向公民下放（或从公民处夺取）权力、以及实施（或重新集中）开放民主治理的形式方面，发挥着不确定但至关重要的作用。正如\
  \ McLaren 和 Agyeman 所建议的 (2015, p. 1)，“良好的治理和集体城市结构”才是智慧城市真正需要的。在这里，当然，关键词是“良好”和“集体”，这需要比本章所提供的更清晰的回应。这些是伦理和政治问题：这些模式以何种形式结合很难预测，应该根据案例进行评估。\n\
