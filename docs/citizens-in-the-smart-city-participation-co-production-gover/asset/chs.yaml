  - Mouffe, C. (2013). *对抗性：政治性地思考世界*。伦敦：Verso。\n- Perng, S.-Y., & Kitchin, R. (2018).\
  \ 公民黑客中的解决方案与摩擦：协作设计和构建等待时间预测。\n\n\n\n\n公民参与城市治理已成为一种范式，在城市冲突日益剧的背景下，它承诺提供更大的民主性、赋权以及更具成本效益的公共服务交付。然而，在智能城市和城市创新的背景下，对“公民”甚至“智能公民”的关注是一个相对较新的现象。越来越多的倡议试图将智能城市改造为“以人为本”的智能城市。其中，设计思维和以人为中心的设计已成为描述“以人为本”方法的热门词汇，这些方法承诺开发出为公民量身定制的解决方案。此前在信息和通信技术（ICT）产品和服务的开发背景下被称为“以用户为中心的设计”，现在正通过创新实验室或公民黑客马拉松在城市中蔓延。但在智能城市的语境下使用设计思维意味着什么？更重要的是，如何在城市学术研究中解构以人为中心的设计和设计思维？本章将城市中的设计思维现象置于语境之中，并使隐性的设计思维过程更加显性化。根据\
  \ 2014 年以来在曼彻和阿姆斯特丹进行的持续研究，我的进展工作表明，通过设计思维进行治理导致的是对社会的*设计*（of），而非*为*社会设计（for）。如果“智能城市权利”不想变成新自由主义策略的另一种变体，那么这种趋势就需要具有历史背景的政治分析和替代性的治理方法。\n\
  \n**关键词**：设计思维；智能城市；城市创新；公民参与；治理；城市共同设计\n\n### 这都关乎人，不是吗？\n\n全球范围内涌出了各种倡议，承诺通过所谓的“设计思维”方法赋能民众。近期在信息和通信技术（ICT）开发和商业创新的背景下部署的流程，现在正大量出现在公共领域。特别是城市生活实验室或创新实验室，为与公民共同进行城市设计和城市建设提供了协作平台（Schliwa\
  \ & McCormick, 2016; Voytenko, McCormick, Evans & Schliwa, 2016）。在这些协作治理空间旁边及内部，充满活力的工作坊型活动开始将设计思维和以人为中心的设计作为流行的参与式方法。它们的主题多样且心心勃勃，涵盖应对气候变化（`Climathon`）、减少骑障碍（`CycleHack\
  \ Global Movement`）、改善公共服务（`Global GovJam`）、拯救英国国家医疗服务体系（`NHS Transformathon`）或让孩子“准备好未来”（`Designathon`）。贴有如\
  \ `#empoweringpeople` 或 `#humancentereddesign` 等标签的彩色便利贴图像充斥着社交媒体，这给我们留了一种公民正在协作解决我们这个时代问题的印象。面对由公众和行业主导的参与式倡议的热烈传播，本章旨在提高人们对“智能”城市语境下，设计思维作为一种治理模式的蔓延的批判性意识。设计思维日益被塑造成一种塑造\
  \ 21 世纪机构运作方式的工具，但设计学者认为设计正处于一个关键点，特别是当参与式创新倡议驱动的实践需求超过了学术研究的能力时（Armstrong, Bailey,\
  \ Julier, & Kimbell, 2014; Manzini, 2015）。城市学术界对隐性的设计思维过程仍然缺乏批判性的参与。关于设计和设计师角色变化的现有研究和辩论主要由提供设计思维咨询的私营机构主导。尽管在追求可持续性需要区分参与者作为“用户”与“公民”的身份（Schliwa\
  \ & McCormick, 2016），并且需要开展规范性工作（Cardullo & Kitchin, 2017），但参与者身份的界限在话语和实践中不断变得模糊。尽管越来越多的学术努力继续定义、重新定义和评估城市实验室式的倡议（Evans\
  \ & Karvonen, 2014; Voytenko, McCormick, Evans, & Schliwa, 2016），但本章主要关注这些倡议中出现的交叉元素，即一种设计引导的治理模式。那么，设计过程中心的“人”究竟是谁？当我们用设计过程处理人类和城市复杂性时会发生什么？我们如何更好地理解和分析城市中的设计思维？本章使设计思维的空间和过程更加显性化，以开始解析这些问题。我通过三个步骤来实现：首先，我提供了设计思维在城市中出现的背景。其次，我明确了构成智能城市中通过设计思维进行治理的环境和技术。最后，我对设计思维作为智能城市语境下公民参与工具提供了一些反思。\n\
  \n### 为公民参与的设计思维提供语境化\n\n\n\n\n根据设计评论家艾莉·罗斯霍（2013）的观点，应用设计思维的早期案例之一可以归功于公元前 221\
  \ 年中国统一的始皇帝秦政。他面临的问题之一是，每个弓箭手制作自己的箭，这意味着箭支无法在不同的弓之间通用。解决方案是统一全军箭支的设计（Rawsthorn 见于\
  \ Gary Hustwit 的纪录片 `Objectified` (2009)）。虽然我们可以从这段中国历史中读出很多东西，但在城市治理的背景下，有一个方面尤为重要：工业设计在标准化物体大规模生产中的作用。那么，设计作为一种过程和思维模式是如何实现大规模生产并提供给数百万人的呢？我们可以将设计思维的大规模生产归功于设计机构\
  \ `IDEO` 及其 CEO 提姆·布朗（Tim Brown）的倡导。`IDEO` 以及越来越多的设计机构和管理学院共同推广了一种观点：你需要学习像设计师一样思考，同时将设计引导和创意问题解决作为一种新的服务商品。自\
  \ 2009 年以来，我们看到大型企业正在建立设计能力，任命设计师担任高管。`IBM` 被认为是将设计作为其核心活动最激进的公司。它将其内部设计团队扩大到 1000\
  \ 人，并品牌化了自己名为 `The Loop` 的 `IBM Design Thinking` 流程。这使得智能城市技术的领导者之一同时也成为了全球最大的设计公司（Fabricant,\
  \ 2014）。世界银行以及“慈善资本主义者”（Wilson, 2014），如`比尔和梅琳达·盖茨基金会`或`洛克菲勒基金会`，将设计列为议程程。关于“为什么民主资本主义需要设计思维”的辩论说明了类似的逻辑运作（von\
  \ Busch & Palmås, 2016），并支持将设计思维视为“资本主义的新精神”的理解（Seitz, 2017）。\n\n与物体设计和城市设计不同，今天的设计思维和以人为的设计理念源于\
  \ ICT（信息通信技术）的发展和业务管理，它们在行业中作为服务创新和创意问题解决的方法（Boehnert, 2014; Cowley, Barnett, Katzschner,\
  \ Tkacz, & Boeck, 2018; Johansson-Sköldberg, Woodilla, & Çetinkaya, 2013）。¹ Buchanan\
  \ 是 20 世纪 90 年代首批赋予“设计思维”术语含义的人之一。他对设计思维的早期理解将其描述为“一种技术文化的新自由艺术”，它不仅改变了我们文化的外部表现，还改变了其内在特征（Buchanan,\
  \ 1992）。随着这一发展，设计本身被越来越多地理解为一种认知文化（Mareis, 2011）。今天对设计思维的定义仍然模糊，学者们认为，需要从该现象产生的背景下来对其进行理解（Johansson-Sköldberg\
  \ et al., 2013; Kimbell, 2011）。\n\n### 从智能城市到人类智能城市\n这使我们回到了当代城市。在可持续城市承诺通过行为改变和绿色技术解决城市问题之后，目前的学术辩论仍主要关注智能城市（de\
  \ Jong, Joss, Schraven, Zhan, & Weijnen, 2015）。Vanolo (2014, p. 883) 将智能城市描述为一种学科律策略，它提供了一种话语，因此这可能是“生产顺从主体和政治合法化机制的有力工具”。虽然普通大众很大程度上仍未意识到智能城市，但新一代城市规划者和技术专家开始转而呼吁“智能公民”（Hemment\
  \ & Townsend, 2013）。这产生了一种新形式的城市策略，将智能城市重塑为“人类智能城市”（Concilio & Rizzo, 2016）或“可黑客城市”（Ampatzidou,\
  \ Bouw, van de Klunder, de Lange, & de Waal, 2016），其中智能公民“早期原型化”（Kresin, 2013）并成为城市建设的积极参与者。\n\
  \n从以技术为中心的批判转向以人为中心的承诺，我们遇到了新的专业术语，如“原型制作”、“在制造中学习”或“共情”。我们不仅见证了向过程导向词汇的转变，还见证了话语的变化，这种变化让那些备受评判的智能城市消失，并在设计与城市的旗帜下重生，并伴随着改变的动机和意义。\n\
  \n### 针对治理创的设计\n超越围绕可持续或智能城市策略的修辞，全球城市已开始接受治理创新的设计。这表明设计在当今社会中的运作方式正在经历许多转型，其中两个在公共政策背景下尤为重要（Bason,\
  \ 2014），而且对广义的城市也具有特殊相关性。\n\n首先，认为设计正转向“共同”（co-）概念：协作、共同生产、共同创造和共同设计作为核心特征，强调了用户、合作伙伴、供应商和其他利益相关者在设计过程中的明确参与，抛弃了英雄式单一设计师的形象（Bason,\
  \ 2014）。\n\n其次，设计正日益以社会设计话语和实践的形式拥抱“社会”属性（Armstrong et al., 2014）。设计经济学中的这种转变部分地通过向社会创业和社会创新的运动来体现（Julier,\
  \ 2017）。这导致了设计文化更广泛的变，这种变化可以说自 20 世纪 60 年代的设计科学运动以来就已经在进行（Margolin, 2010），以及`加利福尼亚意识`作为一种解放性和乐观的技术决定论形式的泛滥（Barbrook\
  \ & Cameron, 2015）。\n\n然而，不仅仅是加利福尼亚的帕罗奥托或设计行业本身带来了从层级政府向更网络化的“超越国家的治理”（Swyngouw,\
  \ 2005）创新的转变。政府组织和国家发挥着至关重要的作用，因为社区和公民参与日益成为获得公共资金的要求。例如，`Horizon2020`是迄今最大的欧盟研究创新计划，在\
  \ 2014 年至 2020 年期间提供约 80 亿资金，并支持公民参与（例如在其`智能城市与社区`号召中）。虽然超越国家的创新在某些方面具有民主化和赋权的作用，但它们从根本上是双面性的，通常作为制度性的补救。服务不足的城市和社区更加脆弱，更容易受到痛苦冲击的影响，这反过来损害了国家的进一步合法性，并要求替代性的治理模式（Swyngouw,\
  \ 2005）。\n\n为了应对替代性的治理模式，本章承认不同的设计概念、社会设计和设计行业，同时重点关注后者。基于对“通过代码治理”（Gabrys, 2014;\
  \ Klauser, Paasche, & Söderström, 2014）和“通过城市操作系统治理”（Marvin & Luque-Ayala, 2017）的讨论，将进一步为理解智能技术如何在城市中实施提供一个框架。虽然通过代码治理代表了一种更被动的治理模式（Gabrys,\
  \ 2014），但围绕设计思维的话辞暗示了积极的参与，这种参与运作在公民与智能城市项目之间的界面上。这种界面功能与“城市交互设计师”（Brynskov, 2014）的理念共鸣，并将设计师的角色是一个“引人入胜的问题”（Hill,\
  \ 2016）。拒绝将英雄式设计师置于中心位置，转而关注情境意识，我建议将“通过设计思维治理”作为一个框架，来理解在城市背景下寻求解决共同问题的网络化、去层级化的治理模式。\n\
  \n\n\n\n公民对智能城市项目的参与越来越多地由设计师和私营部门参与者推动，而非公共机构。这一趋势对城市空间产生了重大影响。它通过实验性的治理方式开发基础设施（Hodson,\
  \ Evans, & Schliwa, 2018; Schliwa & McCormick, 2016），而且涉及到人们在政治上的思考和行动方式。正如城市基础设施往往只有在失效时才会变得显眼并干扰城市（Graham,\
  \ 2009），良好的设计是隐形的，并可能像“特洛伊木”一样发挥战略作用（Hill, 2014）。将此讨论回到设计思维以及我们关于中国统一始皇帝的例子，我们需要问自己：今天是谁在制造并执持着弓箭？以下章节为解决这个问题提供了起点。\n\
  \n## 设计思维空间：创新工作坊\n\n虽然围绕创新倡议和实验室的辞藻看起来新颖且令人兴奋，但大多数此类方案的共同点是将工作坊作为治理场所。字典通常将工作坊定义为针对特定主题的一段时间讨论或实际工作，在此期间，人们分享他们的知识或经验。表\
  \ 11.1 中的工作坊提供了通过实地调查遇到的不同类型创新工作坊的示例。尽管它们涵盖了广泛的问题（例如：城市基础设施、空气质量、物联网技术），但我参加大多数活动的目的是为了改善城市的自行车出行。表\
  \ 11.1. 挑选的设计驱动型创新工作坊及遇到的示例。![Image](img/6.jpeg)\n\n工作坊受到时间和地点的限制，通常持续两小时到两天不等，通常容纳\
  \ 5 到 50 名参与者，取决于格式和引导方式。遇到的大多数创新工作坊举办在城市的创意区，例如，伦敦位于 Old Street 和 Shoreditch 之间的“硅谷环线”（Silicon\
  \ Roundabout）、曼彻斯特北部区（Northern Quarter）Stevenson Square 周围的技术和设计社区，或者阿姆斯特丹“Pakhus\
  \ de Zwijger”及其周边地区。这些空间通常与联合办公空间相连，并通过赞助其设施来支持当地“社区”。它们的共同点是使用设计思维方法来吸引参与者，并作为“公民”与城市或智能城市项目之间的接口。这些工作坊之间的区别主要在于它们所处的背景、设定的特定目标以及主办的利益相关者。特定的格式、背景和过程定义了此类创新工作坊的特定名称。公民黑客松（civic\
  \ hackathon）通常描述一个针对解决特定挑战的 24 或或 48 小时活动。虽然这种格式是在编码背景下出现的，但此后已被调整用于各种问题，作为一种高效纳公民参与的方式。例如，“气候马拉松”（Climathon）是一项旨在通过\
  \ 24 小时内开发解决方案来应对气候变化的倡议（Climate-KIC, 2018）。另一方面，作为会议或艺术节一部分的节日实验室（Festival Lab）可以采取更具实验性的形式，并挑战参与方法（Abel\
  \ et al., 2015）。\n\n许多组织和机构参与了创新工作坊的引导。表 11.1 显示了在设计和设计思维领域工作的不同主办方和引导者。在英国背景（曼彻斯特）发现的许多示例被直接或间接地由\
  \ `Innovate UK` 赞助，它是英国的创新机构，直到 2014 年 8 月前被称为技术战略委员会。`Innovate UK` 在 2016–2017\
  \ 年拥有 5.61 亿英镑的预算，并向英国商业、能源和工业战略部报告。相关组织包括位于英国的 `Catapult` 中心和创新基金会 `Nesta`。下一节提供了提供设计思维教育和引导的组织见解。\n\
  \n## 设计思维引导：从军事到工业再到每个人？\n\n“引导”（facilitate）的广义定义是使行动或过程变得容易或更容易。工作坊期间的引导者承担着核心但隐形的任务，即促进对话，并确保在当天结束前实现工作坊的目标。这通常没有被工作坊参与者注意到，因为流程运行良好摩擦很少，引导者尽管具有专业身份，通常看起来像“普通”参与者，代表了一个不以领导身份出现的领导。在曼彻斯特案例中，遇到的大多数工作坊引导者是在\
  \ `Hyper Island` 管理学院曼彻斯特分校接受过教育的设计师（The Heureka, 2013）。在全球范围内，我们发现了更多设计学院的示例，它们训练学生和员工成为设计思维者和引导者，通常与行业和企业紧密合作（见表\
  \ 11.2）。表 11.2. 设计思维学校和组织示例。\n\n| 组织 | 描述 |\n| --- | --- |\n| Hyper Island, Manchester\
  \ (UK) | 与典型的教育或服务提供者不同，我们遵循经过验证的方法论和广泛的真实行业专家网络。通过我们的全球学校和业务服务网络，*我们把人置于创新*、领导力和变革的核心——为了今天和未来的成功。来源：[`www.hyperisland.com/about`](https://www.hyperisland.com/about)\
  \ |\n| The RSA, London (UK) | [...] 我们推崇一种新的 RSA 方法论：““*像系统一样思考，像企业家一样行动*”。来源：[`www.thersa.org/discover/publications-and-articles/reports/from-design-thinking-to-system-change`](http://www.thersa.org/discover/publications-and-articles/reports/from-design-thinking-to-system-change)\
  \ |\n| Waag Society, Amsterdam (NL) | 我们的工作关注作为社会变革工具的新兴技术，并受公平、开放和包容价值观的指导。Waag\
  \ 一个由 60 名思考者和制作者组成的专门团队使人们*通过技术成为活跃公民*。来源：[`waag.org/en/about-us`](https://waag.org/en/about-us)\
  \ |\n| Contact Theatre, Manchester (UK) | 通过 Creative Experts **将你的业务与重要的人联系起来*。通过由\
  \ Creative Experts 和 Contact 开发并交付的创意参与计划，弥合你与你所服务的社区之间的差距。来源：[`contactmcr.com/hire-us/creative-experts/`](https://contactmcr.com/hire-us/creative-experts/)\
  \ |\n| IDEO U, Online | 通过 IDEO U 学习 IDEO 的设计、思维和创意领导方法——IDEO U 是一所在线学校，*为个人提供必要的工具和思维方式*，激发创意自信并应对复杂的挑战。来源：[`www.ideou.com`](https://www.ideou.com)\
  \ |\n\n\n\n\n\n*来源*：作者基于组织网站（最后访问于 2018 年 10 月 8 日）。某些设计思维学校及其动员的技术在历史上（或正逐渐）与军事组织相关，这体现在其内部部署的“非传统”方法上。在\
  \ `Hyper Island` 的情况下，其总部位于瑞典卡尔斯克罗纳（Karlskrona）岛上的一处旧军事监狱，并教授一系列多样化的课程，包括所谓的“理解小组与领导者”（`UGL`）培训。这种密集的\
  \ `UGL` 课程开发于瑞典武装部队，并成为商业领域最受欢迎的领导力教育之一，承诺为小组如何随时间演变提供见解，以及哪些行为或行动会促进或抑制建设性的发展（Hyper\
  \ Island, 2018）。虽然这在商业环境中可能是理想的，但在城市语境下，这种动员引发了一个关键的政治问题，即谁有权定义什么是“建设性”发展。考虑到对军事技术的历史演变和重新利用（Light,\
  \ 2002），如果谈论公共领域的军事化或`新军事城市主义`的下一阶段（Graham, 2008）将是过于简化的。相反，这些概念需要在其特定的语境下被更好地理解。创新实验室在各种参与者和利益相关者的交汇处工作，以动员集体智慧和知识。表\
  \ 11.2 所示，创意过程和设计思维的促进已成为一种过程商品，由设计和创意产业在日益城市化而非私营部门背景下进行教学和提供。正如描述所强调的，设计思维课程旨在“以人为创新的核心”（见表\
  \ 11.2 中的 Hyper Island），并承诺“将你的业务与重要的人联系起来”（见表 11.2 中的 Contact Theatre）。这意味着工作坊的引导者根据委托工作代表组织或企业采取行动。\n\
  \n## 设计思维工具：在“臭鱼”与“双菱形”之间\n\n专业培训的工作讨会引导者使用设计思维工具和设计方法，这些工具在工作讨会的不同阶段具有不同的功能。管理学院\
  \ `Hyper Island` 提供了一个公开的设计思维 `Toolbox²`，它提供了多种旨在建立信任、减少冲突和提取创意想法的方法。图 11.1 展示了一组可以在整个创新工作讨会期间部署的不同工具和方法。`UGL`\
  \ 是前述在 `Hyper Island` 教的密集课程，引导者可能接受过该课程培训，以引导工作讨会并管理人类行为（Hyper Island, 2018）。`Stinky\
  \ Fish`（臭鱼）是在工作讨会开始建立信任的工具。鼓励参与者写下围绕当前主题的恐惧和焦虑，并在工作讨会开始与小组分享。“签到”（Checking in）和“签退”（checking\
  \ out）是其他设计技术，鼓励人们在课程开始或结束时简要分享自己的感受，以检查初始基准并总结教训。工作讨会从开始到结束的过程通常遵循英国设计委员会的`双菱形`（Double\
  \ Diamond）框架。英国设计委员会于 1944 年 12 月作为工业设计委员会成立，其使命是促进英国工业的设计（UK Design Council, 2018a）。`双菱形`被英国设计委员会大力推广，是设计导向型问题解决最受欢迎的过程之一。它可以在两天内完成部署，第一天用于发现和定义问题，第二天用于开发和交付解决方案（见图\
  \ 11.1 中间部分）。这一过程也被描述为发散和收敛的迭代。发散扩大了思考和行动的范围（例如通过与问题相关的想法头脑风暴），而收敛意味着聚焦于一个特定问题以开发解决方案（UK\
  \ Design Council, 2018b）。\n\n![Image](img/9.jpeg)\n图 11.1 城市创新工作讨会上遇到的设计思维工具。*来源*：作者基于英国设计委员会（2018b）和\
  \ Hyper Island（2018）。设计思维语言可以根据构建为“我们如何可能[……]”（How might we）的问题来识别，这鼓励了一种将问题转化为（经济）机会的心态。这通常被缩写为\
  \ `HMW`，有时伴随着默认句式结构，如“我们如何可能通过[工具]改进/解决[问题]？”在骑行的的情况下，这可以翻译为“我们如何可能激励下一个 10 亿人将自行车作为他们的主要交通工具？”设计思维的术语参与者可能无法立即理解，这就是为什么一些引导者尝试避免使用它，转而使用“在做中学习”代替原型制作，以使用更通用的语言。设计理论家克劳迪娅·马雷斯（Claudia\
  \ Mareis, 2017）强调了设计思维的概念意味着其与创造力和创意思维之间的强相关性，头脑风暴被用作动员“你耳朵之间的金矿”的技术。虽然头脑风暴曾被推崇为刺激商业想法的方法，但它此前在二世界大战期间及之后被军事和政府努力作为产生想法的方法（Bruder\
  \ & Mareis, 2015）。某些设计方法也反映了工业心理学的方法和见解。在 20 世纪 20 年代到 40 年代，小小组被作为整个社会的微缩模型进行研究。这种协作性创意技术实践的目的是从“民主社会工程”的角度来优化它们的经济和社会表现（Graebner,\
  \ 1986；见 Mareis, 2017）。考虑到这些信息，我们可能开始以不同的方式理解社会设计，强调对社会*本身*的设计，而不是*为*社会的设计。\n\n\
  ## 这都关乎执行，不是吗？\n\n\n\n\n\n设计技术治理主义的智慧城市话语与实践。设计机构和设计师开始将“以人为中心的设计”作为一种过程性商品，并促进公民围绕智慧城市项目中共同关注的问题进行参与。\n\
  \n正如本章所示，设计思维在创新工作坊中，通过受过专业培训的引导者和设计思维工具在城市背景下被动员。本章提出的“通过设计思维进行治理”旨在补充“通过代码进行治理”（Gabrys,\
  \ 2014; Klauser et al., 2014; Marvin & Luque-Ayala, 2017），其作用是在实施“智能”城市策略和技术的过程中，充当智慧城市项目与“公民”之间的接口。\n\
  \n结合起来，它们可以被理解为在面对摩擦（例如在技术实施期间）或冲突（涉及一般的社会政治气候）时促进协作与创造力。有必要将学术分析扩展到更广泛的地方和全球背景以及历史背景，以便理解其政治影响。工业设计思维与其他设计方法的区别，可以基于从军工复合体涌现的创造力和问题解决技术的历史渊源来解释。更确定的是，我们看到设计思维方法被（重新）引入军事运筹学（Zweibelson,\
  \ 2017）。这表明，在我们当前的社会政治气候下，公民社会与军事之间的创新活动和治理模式变得模糊并融合。这一概念需要批判性城市学术的关注，因为这些治理模式具有深刻改变我们思考方式、行动方式以及我们政治组织方式的潜力。\n\
  \n早期发现表明，目前在城市背景下设计思维工具的动员可能导致在实施智慧城市愿景和项目的过程中是对社会*进行*设计，而不是*为*社会设计。这项进行中的工作是一个起点，旨在通过分析目前用于公民参与的设计过程使设计思维更加显性。我鼓励批判性城市学术参与到城市背景下的设计和设计思维中。特别是需要理解政治影响，以及设计思维可能导致更民主或更专权治理模式的方式。当我们谈论“智慧城市的权利”时，我们不仅应该要求参与的权利，还要仔细考虑这种参与从长远来看是赋权还是剥夺权力——不仅对参与个人而言，而且对整个社会而言。\n\
