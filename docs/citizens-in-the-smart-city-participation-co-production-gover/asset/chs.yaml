  \nVanolo, A. (2016). 《谁在里面？未来智慧城市的场所与角色》。未来，《82），26–36。\n\n\n\n\n## 第 8 章\n\n##\
  \ 传感器与公民事务：迈向以社区为中心的智能城市\n\nCatherine D’Ignazio, Eric Gordon 和 Elizabeth Christoforetti\n\
  \n### 摘要\n\n收集、存储和赋予海量传感器数据意义正成为城市在技术和财务上的现实。许多此类倡议是通过供应商、开发商和城市之间达成的交易得以实现的。这些倡议以基础设施的形式实现在环境中——对于公民和社区而言，它们是不可见的。我们认为，为了拥有以社区为中心的智能城市，我们需要将传感器数据的收集和使用从“不可见的基础设施”转化为“可见且易读的界面”。在本章中，我们比较了两种不同的城市感知倡议，并研究了传感器与人之间进行反馈使用的方法。我们质疑了在城市感知项目中，价值是如何产生并传递给公民的，以及需要什么样的监督和伦理考量。最后，我们主张在社区、传感器和城市之间建立“有缝隙的”（seamful）界面，以揭示其内部运作机制，从而实现公民教育和对话。\n\
  \n**关键词**：智能城市；传感器；公民科技；城市发展；公民参与；界面\n\n### 成为数据\n\n\n\n\n虽然“智能城市”的研发已经进行了一段时间，但直到最近，收集、存储并赋予大量\
  \ `sensor data` 意义对于城市而言才成为一种技术和财务上的现实。城市传感器数据可以定义为通过位于城市内或针对城市的物理设备收集的信息。这包括来自固定传感器的数据，这些传感器监测其周围物理环境的特征，如空气质量、分贝水平和公共空间使用情况。它还包括由卫星等遥感平台产生的数据、安装在车辆上的移动传感器，以及通过个人口袋里的手机收集的信息¹。事实上，手机中充满了可以在城市背景下被利用的传感器，包括\
  \ `Wi-Fi`、麦克风、摄像头、`GPS` 芯片、加速度计、陀螺仪、接近传感器和环境光传感器。新版本可能还会包含心率监测器、温度传感器和指纹扫描仪。当个人收集数据并将其贡献公共领域时，它被称为“参与式感知”（Christin,\
  \ Reinhardt, Kanhere, & Hollick, 2011）、“公民感知”（Gabrys, 2014）或“大众感知”（D’Ignazio & Zuckerman,\
  \ 2017）。从班加罗尔到巴塞罗那，许多城市正在开展利用城市传感器监测街道使用情况、空气质量和回收率等事项的项目。\n\n当代智能城市的一个核心原则是通过网络化的城市传感器对城市进行仪器化。事实上，技术供应商和市政政府对城市传感器的热情日益高涨。围绕新定义的基础设施需求市场正在涌现，推动智能城市从一种遥远的奇闻变成一种主流的必然要求。智能城市的话语捕捉了大众的想象，被视为焦虑与承诺的交汇点，不再关注遥远的未来，而是关注眼当下。传感器技术可用且正在激增。城市传感器产生来自环境的数据（包括来自个人居住者），因此代表了私人空间与公共空间的融合，聚合的个人数据具有公共基础设施的特征。马丁·海德格对现代技术的概念为这种效应提供了一些见解。他认为，当我们利用技术或在技术中间做某事时，经验的对象和活动被转化为他所谓的“备用”（standing\
  \ reserve）（Krell, 1993, p. 320）。\n\n安装在路灯上的传感器收集穿过路口的人数数据。这些数据可能被实时使用，但同时它们被置于“备用”中以供以后使用。事实上，向大数据范式转变的一个主要特性是收集现在能获得的一切，并在以后再考虑如何处理它们。正如美国国家安全局（`NSA`）前局基思·亚历山大在\
  \ 2013 年所说：“你需要草堆来找针”（Gellman & Soltani, 2013）。智能城市的逻辑是将“备用”转化为公共基础设施。而基础设施的逻辑是它保持不可见。结果是，智能城市增长的偏差是不可见性——将数据捕获为备用，并重新重申这些数据是无缝且高效的功能。\n\
  \n当即时性转化为备用时，排序的权力并不是均匀分布的。有色人种或贫困人与其他人一样变成了数据，但获得排序的机会明显更少，且被他人排序的敏感性显著更高。例如，在贫困社区使用逮捕数据来证明增加警察存在的合理，可以延续种族主义并奴役居民（Goel,\
  \ Rao, & Shroff, 2016）。或者，正如世纪中叶城市更新努力那样，同样的数据为大规模清除贫民窟提供了合理性（Caro, 1974）。建立在看似中性的不可见数据基础设施中的不平等，有潜力通过将边缘社区置于受他人排序的待命状态来摧毁它们（Eubanks,\
  \ 2018）。\n\n智能城市在维护其城市功能的技术官主义愿景时，面临的挑战是让人类主体、其数据与产生的城市基础设施之间的相互作用变得可见。在本章中，我们询问如何产生和维持关键接口，以便让那些在历史上选择权较少的人在排序选择方面能有更多样化的选择？我们希望将智能城市的话语*从基础设施（不可见性）转向接口（可见性）*，让排序过程为了承认差异和不公而暴露无形。我们挑战物联网的主导范式，该范式采纳了马克·维泽的观点，即“最深远的技术是那些消失了的技术”（Weiser,\
  \ 1999, p. 3）。智能城市技术在很大程度上是由这种对不可见性的追求驱动的。\n\n然而，正如我们所讨论的那样，这种无缝性的代价可能是巨大的。因此，公共部门有空间通过为智能城市培养“有缝的”（seamful）接口，或包含调适和占有特征的可读交互来进行创新（Chalmers\
  \ & Galani, 2004）。一个有缝的智能城市接口不仅仅是可视化。它要求每个阶段都有公众互动，而不仅仅是在开始时举行公众听证会。在智能城市中，在公众参与之前，需要一个使之可见的过程。这并不是简单的清晰接口与复杂接口的二分法，而是遵循\
  \ Galloway（2012）的观点，接口是政治的和历史的。清晰度和易用性作为设计价值通常支持无缝性，而漏洞、故障和错误则可以显露“缝隙”——“操作区域与非操作区域之间的边界，稳定区域与差异区域”（Dourish\
  \ & Bell, 2011, p. 120）。\n\n我们通过跨三个重叠维度思考智能城市接口，开始这一批判性过程：\n1. **部署前（Pre-deployment）**：谁决定测量什么？基于什么（谁的）价值主张和标准，公民和社区在决定城市感知什么方面着什么角色？\n\
  2. **现场（In situ）**：一旦部署，城市传感器的设计是为了可读性和参与，还是为了后台监控和控制？这意味着——它们被构想为接口（从而提供参与和对话的机会），还是基础设施（从而为提供不可见的服务而设计）？在我们在这些设计选择中看到了体现了哪些价值观？\n\
  3. **部署后（Post-deployment）**：鉴于数据是在城市环境的特定时间和地点收集的，并在之后用于告知流程和决策，城市、传感器、数据与公民之间的接口在何时何地？\n\
  \n这些问题对应于管理城市传感器的人员与公民及社区对接的机会。在下一节中，我们调查了文献、次级资料以及两个智能城市倡议案例——纽约的哈德逊广场（Hudson Yards）和布里斯托的潮湿破坏者（Dampbusters）的报告，并尝试理解在每个维度上是如何产生（或未产生）关键接口的。这些案例并非全部，但它们可以帮助说明实现智能城市有缝接口的实际困难。\n\
  \n### 量化社区？\n\n\n\n\n\n# 哈德逊哈德：智能街区分析\n\n哈德逊哈德位于曼哈顿最西侧 30 街与 34 街之间，是一个面积 28 英利的私人开发项目。它是美国历史上最大的私人房地产开发——预计耗资\
  \ 200 亿美元，并在 2024 年完工前建成 16 栋摩天大楼。总体规划包含了商业办公空间、零售空间、住宅空间、文化空间、一所学校、现场发电厂以及多个公共空间，预计每天支持\
  \ 65,000 名游客。谷歌母公司 Alphabet 拥有的 Sidewalk Labs 将首批租户之一。\n\n## 场地限制与规划\n\n该场地最有趣的限制之一是，它将继续作为火车场运营。纽约大都会交通局投资了\
  \ 4 亿亿美元以覆盖现有的轨道和隧道。因此，该场地只有 38% 的区域可用于建设，这使得高密度规划成为实现投资回报的必要手段（Mattern, 2016）。\
  \ \n\n哈德逊哈德从一开始就被构想为一个“智能街区”或“量化社区”。后者是 Constantine Kontokosta 的术语，他在纽约大学城市科学与进步中心（CUSP）的实验室是该项目的学术伙伴。城市环境的许多方面将通过传感器进行监测，包括空气质量、热岛效应、噪音水平和公共空间的使用情况。\n\
  \n## 智能基础设施与监测\n\n绿地利用“智能土壤”来帮助促进最佳生长，尽管地下有火车导致根系无法深层触达。在建筑层面，传感器将监测能源和水资源的消耗、人流出、室内空气质量以及固体废物管理（顺便说，这将通过滑道和真空管进行，而不是通过市政部门的垃圾收集）。\
  \ \n\n最后，场地的居民、工人和游客被鼓励下载 `Hudson Yards app`，并自愿向开发项目提供有关他们健康、营养和移动性的信息。作为选择加入的回报，这些公民在理论上会获得优化的服务。哈德逊哈德的第一栋建筑于\
  \ 2016 年向公众开放，但大部分开发工作仍在该市一个没有居民的区域进行中。因此，我们讨论这一开发项目既是现实的，也是投机性的，并将其视为一种待分析的话语，也是待观察的现象。\n\
  \n## 理论假设与利益相关者参与\n\n我们从引导开发的理论假设开始。根据 Kontokosta (2016, p. 16)，量化社区（QCs）以利益相关者的参与为中心：“QC\
  \ 团队已与当地利益相关者合作，确定优先事项和目标，并部署信息基础设施，以开发出更完整的需求清单和更强大的评估替代方案的能力。”\n\n有趣的是，由于哈德逊哈德的利益相关者并不包括居民（因为还没有可以咨询的居民），这种参与源于对该场地有财务利益的资助者和开发商，而不是邻开发项目的小企业和居民、潜在未来居民和工人、无家者或维护人员。因此，在城市传感器设计和部署之前，几乎没有公民参与的机会。\
  \ \n\nMattern (2016, p. 6) 问：在创建定义哈德逊哈德的智能技术时，是否有机会让公民进行有意义的参与？游客呢？良心违抗者呢？那些缺乏参与工具——“智能”设备或技术“智慧”——的居民呢？他们因此受到城市的监测，却无法反向监测。她向\
  \ CUSP 和开发商提出了这些问题，得到的回答是 QC 概念仍在“开发中”。因此，如果量化社区以利益相关者的参与为中心，那么是谁在说服强大的利益相关者（那些控制生产资料的人）事实如此呢？从历史上看，公众参与一直是一个需要克服的麻烦，是一个缺陷（bug）而非特性（feature）。如果这确实是这些新开发的中心，它从一开始就需要考虑进去。\n\
  \n## 治理与设计决策\n\n在公共空间部署传感器之前，由谁决定测量什么？在这种情况下，由私人资助者驱动，经城市授权，在大学设计，并由私人公司实施，最终为公司的客户服务（这些客户并不等同于城市的公民）。同样，哈德逊哈德在它的宣传材料中对现场传感器和智能系统的外观做出了非常具体的设计决策。例如，垃圾通过气动管从安装在每栋建筑视线之外的地方被吸走，运往\
  \ `12th Ave` 的一个分发点（Clarke, 2014)。 \n\n任何公共公园或建筑的渲染图都没有包含传感器设备。Mattern (2016) 指出，这在公民教育方面是一个错失的机会，而且在滑道中隐藏垃圾促进了一种“眼不见为净”的公众意识。开发商引用了美学原因作为理由。副总裁\
  \ Michael Samuelian 被引用说：“即使在市中心最奢华的建筑里，你也能在垃圾日建筑前看到垃圾袋。在哈德逊哈德你看不见这些”（Clarke, 2014)。\
  \ \n\n这些也转化为了财务原因。哈德逊哈德网站的主页推广了决定搬入的“标志性品牌”以及喜欢“在公寓里享受文化”的“富买家”。监测交通和人流、空气质量和噪音、垃圾和土壤并没有被强调为公共活动或提供给居民和游客（作为教育、公关或辩论），而是被设计成像下水道系统一样，无形地层叠在基础设施中。这种隐藏在垃圾滑道中和埋在地下的隐形基础设施，符合现代主义对效率的梦想，绕过了城市功能中任何有缝隙的界面。\n\
  \n## “以公民为中心”项目的悖论\n\n然而，重要的是，智能城市项目的设计者继续将其工作描述为“以公民为中心”。正如 Dietmar Offenhuber\
  \ 和 Carlo Ratti (2017) 所描述的，当基础设施被构想为数据时，它是极易控制的。因此需要问不同的问题。谁访问数据，以及在什么背景下？用海德格尔的话说，谁在排序，谁被排序？宣传材料称：“运营经理将监测并响应交通模式、空气质量、电力需求、温度和人流，以创建一个最易导航和最适应的社区。”运营经理的目标是高效调整资源以节省资金，在危机中更有韧性，并提供更多“个性化”的体验。\n\
  \nKontokosta 表示，这样对社区进行仪表将为学术研究开启巨大的可能性，允许在城市规划与设计、城市系统工程与管理以及社会科学领域进行前所未有的研究（2016,\
  \ p. 3）。因此，运营经理和学术研究拥有数据的专属访问权。但公民（不仅仅是哈德逊哈德的付费客户）何时以及如何访问并参与这些数据呢？“在这个宇宙中，公民通过消费和管理其系统，并作为可测量行为数据的来源，与他们的城市建立联系”（Mattern,\
  \ 2016, p. 4）。公民参与传感器数据的主要机制似乎是一个选择加入的移动应用程序，人们自愿提供健康和营养信息以换服务。Kontokosta 和其他研究人员正在探索说服人们自愿提供更多个人信息的方法（Kontokosta,\
  \ 2015）。除了应用程序之外，尚不清楚居民和游客是否可以访问有关被监测和收集信息的仪表板或显示屏。\n\n\n\n\n\n# 以社区为中心的智慧城市？\n\n\
  \n\n在英国布斯托，“Dampbusters”项目代表了一种完全不同的方法。它是由布斯托市会、`Ideas for Change`、`Knowle West\
  \ Media Centre`（简称 `KWMC`）以及学术研究人员建立的伙伴关系，其目的是实施一项“以人为本”的智能城市倡议。值得注意的是，该项目并非由社区发起的，而是对这四个组织的咨询做出的回应，随后对社区组织进行了咨询。\n\
  \n在与布斯托的社区小组进行这些初步会议后，团队确定测量潮湿是其试点中最有用、最具主动性且最现实的问题。从潮湿测量倡议的启动到在市中心许多居民家中实施，该团队识别了以公民为中心的城市感知所面临的各种挑战与机遇（`Hassan`\
  \ & `Balestrini`, 2015）。\n\n在这种模式下，公民是共同设计者和合作伙伴，共同完成一项针对性的工作，从构思到实施一项单项感知试点。Dampbusters\
  \ 利用清晰的能力建设过程，针对潮湿这一明确且紧迫的问题及其危害（包括对人类健康的影响），识别、澄清并推动基于结果的变革。\n\n他们所谓的“布斯托方法”是一种自我意识模型，用于构建社会基础设施的接口，并对以下内容进行批判：\n\
  1. 智能城市项目，这些项目对关键利益相关者往往难以触及；\n2. 目前的公共流程，在项目开发和结果方面往往缺乏有效的自下而上开发和包容性（`Hassan` &\
  \ `Balestrini`, 2015）。\n\n布斯托方法旨在平衡自下而和自上而下的规划，利用公共艺术和面对面接触等参与策略作为文化中介和公众访问点，并让多元化的公民用户群体在识别问题和寻找智能城市解决方案方面发挥领导作用。\n\
  \n“城市公地”（city commons）是布斯托方法的框架，用于指导 `Dampbusters` 以及其他未来公民领导的城市感知项目。公地的概念旨在捕捉参与式过程的精神。他们声称这“涵盖了我们创造的资源、共享资源的方式，以及关于我们如何利用资源造公共利益的集体协议”（`Hassan`\
  \ & `Balestrini`, 2015, p. 8）。重要的是，它的目的是建立一个无缝的接口，让多样化的用户群体能够根据当地社区的特定需求塑造、开发和利用城市感知工具。\n\
  \n公地的作用是明确项目开发与治理、共享资产的生成、所有权和使用，以及城市环境中产品开发和数据收集相关的技能部署。`City Commons` 可以被描述为类似于城市数据收集的维基百科，信息由所有人生成、维护和利用（`Hassan`\
  \ & `Balestrini`, 2015）。\n\n在 `Dampbusters` 项目中，受潮湿问题直接影响的居民担任定量和定性数据收集的管家，他们通过在家里部署传感器并分享潮湿对其日常生活产生的影响经验。在数据收集期间和之后，`Dampbusters`\
  \ 项目依靠 `Commons` 来系统地收集、维护和利用传感器收集的数据。\n\n必要的部署前评估包括社区内对问题的相关性和兴趣、传感器技术和开放数据对寻找解决方案的适用性，以及对潜在影响和可行性的确定（`Hassan`\
  \ & `Balestrini`, 2015）。由 `KWMC` 和 `Ideas for Change` 领导的参与机制包括识别并与影响地区已活跃的社区小组合作，以在现有的社会效能基础上进行发展，并与嵌入这些社区的艺术家合作。\n\
  \n让社区能够共同设计项目和数据收集工具是 `Dampbusters` 项目和布斯托方法的一个显著方面。公民在专家和其他具有相关技术经验的人员指导下，合作构建了名为\
  \ `Frogboxes` 的湿度和温度传感器，并将其部署在受影响的房屋中。这种趣味性的传感器构建方法发挥了正如 `Gordon` 和 `Walter` 所说的“有意义的低效性”（2016），即为了实现一个目标而选择效率较低的方法而非更高效的方法。这些箱子制成青蛙的形状是为了给用户带来一种愉悦感，并在视觉上将设备与潮湿的概念联系起来。\n\
  \n布斯托方法团队聘请了开放数据、能源和建筑改造等问题的专家，以识别“公地工具”，包括数据收集基础设施和现有的市政数据集。值得注意的是，此类共同设计工作需要大量的协调、技能和专业知识。虽然想法是由较大的网络共享的，但只有一小组人参与了物理设计和制造。技术人员与没有技术经验的公民配对。参与者和设计师在\
  \ `creative commons` 的指导下，对开源许可和归属达成了共识。\n\n所有的参与和框架设定都由发起项目的负责人领导。现场流程包括用于数据收集和共享的工具。`Frogbox`\
  \ 的部署发生在 2016 年，持续两个月。团队负责人与当地能源供应商、慈善机构和其他当地组织建立了伙伴关系，支持在五个家庭中部署传感器。通过主动招募的参与者接受了传感器技术的培训，并愿意参与\
  \ `City Commons` 建立的数据协议。此外，还培训了一个“社区 Dampbusters”团队来利用该技术并向社区分享他们的技能。\n\n社会效能的复杂平衡——引导参与者并培训认可\
  \ `City Commons` 协议的社区支持团队——与可靠技术——具有清晰用户界面、能够跨位置可靠收集和传输数据并获得当地机构支持的传感器——需要自下而上的参与以及外部团队领导自上而下的协调和激励（`Balestrini`\
  \ *et al.*, 2017）。\n\n部署后的流程包括与专业人士接触以评估收集和共享的数据，以及通向自助的行动路径，包括报告生成和与社区防潮小组接触。\n\
  \n（注：所提供的文本剩余部分遵循类似的格式逻辑，但为了演示回答的简洁，我重点关注了上述核心内容。）\n\n虽然感知技术通常比房地产开发项目明显的物理影响侵入性更低，但此类技术的无形影响是巨大的，需要政策来引导其整合到当地社区（`Offenhuber`\
  \ & `Ratti`, 2017）。因此，`Dampbusters` 和布斯托方法的案例可能为公民提供一条路径，塑造并参与更大规模感知基础设施的开发和部署。\n\
  \n\n\n\n### 结论\n\n这里介绍的两个智慧城市项目——哈德逊广场（Hudson Yards）和 Dampbusters 项目，在几乎每一个方面（规模、风格和方法）都各不相同。我们呈现它们并非作为对立面，而是整体的两个部分。对\
  \ `QC` 的追求在每个项目中都有体现。量化带来了一种将人类互动转化为供他人支配的“现存”的奇异能力。尽管在“布里斯托尔方法”（Bristol Approach）中在话语上受到了抵制，但所有的智慧城市界面都是建立在数据上的。同样，布里斯托尔代表的是一种以人为导向的参与式方法，这种方法在\
  \ Dampbusters 中似乎得到了真实的执行。哈德逊广场也采取了同样的“利益相关者参与”修辞，但听起来并不真实，因为利益相关者主要由开发者和资助者组成。智慧城市是一个强大的理念，作为一个持久的承诺根植于集体意识之中。但就像所有好得令人な的承诺一样，它需要承诺的接收者进行审查并采取行动。我们论证了智慧城市批判性接口的必要性，并为智慧城市项目提出了一种更具“缝隙感”（seamful）的方法。那些被作为基础设施销售、作为追求效率最大化且最好保持隐形的项目，实际上是界面，并且需要建立互动、对话和反馈的基础上。在智慧城市中获取和收集的数据具有私人性质，即使它们被聚合、匿名化并作为公共基础设施出售。当作为城市居民、具身化并蕴含社会差异的他们被抽象为数据时，智慧城市的设计者需要构建能够使这一过程可见的结构。正如我们在本章中所证明的，智慧城市需要一种\
  \ `seamful` 设计，在这种设计中，变成数据的影响变得清晰可见，其功能性（affordances）变得可用，以服务所有人，而不仅仅是智慧城市产品的客户。\n\
  \n### 致谢\n\n本章的部分内容将以《以社区为中心的智慧城市的缝隙接口》为题，发表在《列奥纳多电子年鉴》（Leonardo Electronic Almanac）即将出版的“城市界面”特刊上。\n\
