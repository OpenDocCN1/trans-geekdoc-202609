  \n\n\n\n\n批判性智慧城市学者提出的关键规范性问题之一是：在新自由主义智慧城市中，公民这种具有政治意义的主动性是否可能，以及如何可能？列斐伏尔的“城市权利”（1996）概念在这一努力中证明是特别富有成效的，因为它允许想象出某些方式和可能性，使公民能够维护城市的价值高于交换价值，从而肯定社会性的“城市”而非经济意义上的“城市”。本章旨在为对新自由主义智慧城市中具有政治意义的主动性的追求和想象做出贡献。首先，本章认为，智慧城市研究通常认为对新自由主义智慧城市具有政治意义的干预，往往是那些深受个人和城市获取特定且分布不均的资源（如技术或政治素养以及经济（基础设施）结构）影响的计划。因此，其次，本章建议我们在其他地方寻找“普通公民”对新自由主义智慧城市的批判性干预，即在城市居民对新自由主义智慧城市的推广性和表演性叙事的日常解读中寻找。\n\
  \n**关键词**：智慧城市；新自由主义；推广文化；话语；政治主动性；意义构建\n\n### 引言\n\n虽然许多（如果不是大多数）关于智慧城市治理和技术的学术研究承认，“智慧城市”并没有一个单一、权威的定义，但存在处理这种缺失的两种截然不同的学术方法。一种学术将这种缺失视为需要从学术上解决的问题，致力于寻求一个“特定”智慧城市的单一定义（Albino,\
  \ Berardi, & Dangelico, 2015; Meijer & Rodríguez Bolívar, 2016; Tranos & Gertner,\
  \ 2012）。另一种则是本章所关注并认为自己是其的“批判性智慧城市研究”，它将智慧城市描述的多样性本身作为学术探究的对象（Hollands, 2008; Vanolo,\
  \ 2016）。对于批判性智慧城市学者来说，定义上的开放性强调了智慧城市的描述并非中立的，事实上，它们承载了各种行动者和机构的`新自由主义`政治和经济利益。例如，大型科技咨询公司、中小企业（SMEs）和初创公司通常将智慧城市呈现为技术赋能的进步，得由于这些企业的专业知识和投入，这种进步可以被带入城市（Söderström,\
  \ Paasche, & Klauser, 2014; Wiig, 2015）。同样，城市管理部门将智慧城市视为对城市创造力的庆祝，这同时也方便地实现了场所品牌化（Vanolo,\
  \ 2017）以及对危机后市政预算的应对（Tonkiss, 2013）。此外，国家和跨国家行动者（特别是欧盟委员会）将智慧城市描述为社会创新的先锋实验室，并在公私合作项目中使用城市空间和居民，其产出为了竞争优势而被“规模化”（Cardullo\
  \ & Kitchin, 2018a; Engelbert, Van Zoonen, & Hirzalla, 2018）。正因为批判性智慧城市研究已如此紧密地将“智能”城市发展的兴起与新自由主义联系在一起，因此对于`跨`智慧城市项目中持续出现的“以公民为中心”和“以公民为导向”的修辞和方法在学术上持怀疑态度。这些公理暗示智慧城市发展和公民参与是硬币的两面。当然，这一前提与对新自由主义公共治理和参与的批判性分析告诉我们的观点是相矛盾的（Guarneros-Meza\
  \ & Geddes, 2010; Walker, McQuarrie, & Lee, 2015）。事实上，对支撑这些修辞的逻辑进行批判性智慧城市分析强调了它们的“修辞空虚”（Wiig,\
  \ 2016）。那些作为民主参与机会被推销的内容，实际上是使“城市”越来越多地被没有任何民主授权的人所居住和治理的策略，无论他们是技术和咨询企业、创业型城市建设者和城市\
  \ CEO（例如首席技术官或数据官），还是研发顾问（Cardullo & Kitchin, 2018b; Hollands, 2015; Kitchin, Coletta,\
  \ Evans, Heaphy, & MacDonncha, 2017; Vanolo, 2016）。\n\n\n\n\n\n尽管批判性智慧城市学者刻意避免限制智慧城市的定义，但他们对什么构成了“典型的”智慧城市确实有特定的观点。他们认为这是几十年新自由主义政治和多年危机后紧缩政策的结晶——甚至是“私生之子”，这些政策改变了地方公共政府，使城市公共空间私有化，并导致了当今许多城市公民和社会生活的去政治化（参见\
  \ Aalbers, 2013; Lombardi & Vanolo, 2015; Peck, Theodore, & Brenner, 2009; Vanolo,\
  \ 2015）。事实上，大多数学术研究将“智慧城市”置于城市治理的一部分，这种治理日益采用市场的方法和心态，以为了外部品牌和内部治理的目的维护城市形象的价值。从这个意义上说，今天对`smart`一词的主导性使用，可以分析为具有与`creative`或`entrepreneurial`标签曾具有并持续具有的相同意识形态功能（Hollands,\
  \ 2008, 2015; Peck, 2005; Vanolo, 2014, 2015）。因此，批判性智慧城市学者聚焦于新自由主义智慧城市中代理性的“可能的一瞥”（Hollands,\
  \ 2015, p. 70）至关重要。\n\n然而，批判性智慧城市学者在对新自由主义智慧城市内部（或尽管如此）的代理性进行概念化时，使用的是非常具体的、且我认为是有问题的术语。例如，Hollands\
  \ (2015) 赞扬了城市规划平台，如`Brickstarter`（一个城市服务的众筹/外包平台）和`Face Your World`（一个旨在让当地居民参与城市规划和重建的阿姆斯特丹项目，参见\
  \ De Lange & De Waal, 2012），认为这些平台激发了居民“利用人类主动性*以及*技术为了社会目的来塑造城市”（Hollands, 2015,\
  \ p. 72，原文强调）。Cardullo 和 Kitchin (2018b) 赞扬了巴塞罗纳新的政治左翼市政府，认为其有“重新使智慧城市政治化并[……]将其创造和控制从私人利益和国家转向基层、公民运动和社会创新”的能力。此外，Engelbert\
  \ 等人 (2018) 提出了草根智慧公民倡议（特别是那些不能或不想被“规模化”的倡议）如何被策略性地写入欧洲委员会的研究征集和项目中。\n\n这类示例的第一个问题是，对“人民力量驱动的智慧倡议”（Hollands,\
  \ 2015, p. 62）的赞誉往往受到 Kitchin (2015) 所术语——并对其提出问题的——“经典案例”的启发。这些是在巴塞罗纳或阿姆斯特丹等城市中，一组规模较小但经常被引用的成功的公民/艺术家领导的智慧技术倡议。利用这些稀有的案例可能会错误地暗示，由社区主导或以公民为中心的倡议（例如“黑客松”、生活实验室和公民科学的机会）可以自然地产生*任何地方*社区的好主意和创造力。这种暗示忽略了事实：许多此类倡议是由国家或研究机构运行的项目“强迫”诞生的，而这些项目获得资助的条件是它们必须“让”公民参与。此外，它忽略了大多数智慧社区倡议在（基础设施）结构上之所以成为可能——或不可能——是因为城市现有的经济繁荣、其在国际竞争或排名中的地位，以及对早期智慧城市项目的参与。\n\
  \n第二个问题是（这些）对智慧公民代理性的赞誉强调了城市居民在*他们*认为社会或政治上合适的时间和地点，通过使用智慧技术“获得所有权”的案例。因此，这些实例被解释为公民在反对新自由主义对所有权（即财产）的概念化，并因此是公民在主张他们对城市的权利（De\
  \ Lange & De Waal, 2012; Hollands, 2015）。然而，我认为，此类实例也可以被读为智慧城市话语生产顺从的新自由主义公民努力的延伸，因此是对其霸权式的接受（Vanolo,\
  \ 2014）。毕竟，那些获得所有权的公民是那些“站出来”并对社区福祉负责的人，他们从自己的创造力和技能中寻求解决方案，而且关键的是，他们接受了这些行动或此类干预是不应从国家机构或公共服务中预期的。因此，公民主导倡议的许多“激进”前提实际上使在新自由主义下参与和处于其下的条件变得常态化了。\n\
  \n尽管这一切可能意味着在新自由主义智慧城市中思考具有政治意义的代理可能是徒劳的，但事实并非如此，也不是我的本意。事实上，本章的剩余部分在新自由主义智慧城市中这种“可能的一瞥”（Hollands,\
  \ 2015, p. 70）以更日常或“微观”的术语进行概念化，即普通公民在和关于新自由主义智慧城市这一文本所产生的解读和意义。具体来说，本章认为，即使在城市居民被定位为新自由主义明显具有表演性和推广性的智慧城市叙事的观众的情况下，城市及其人民的替代性想象也可能被激发和产生。\n\
  \n### 新自由主义智慧城市的话语再化\n\n\n\n\n\n承认智能城市与新自由主义之间的紧密联系，也意味着承认“智能性”的表演性以及因此话语实践的重要性。当然，智能城市至关重要是由具有高度物质维度和现实影响的实践与过程构成的。然而，正如批判性城市研究所所示，话语和思想对于城市发展、规划和治理至关重要（Lees,\
  \ 2004; Peck & Theodore, 2010）。此外，在新自由主义智能城市的案例中，不可见性与可见性之间的矛盾关系要求人们（甚至）更加关注话语。\n\
  \n毕竟，一方面，新自由主义智能城市的很大成功依赖于智能技术的不可见性以及城市居民对二阶控制的无缝服从（Krivý, 2018）。另一方面，至少有等量的成功取决于城市智能性的可见化表演和公开推广。因此，话语实践至关重要，或者用批判性话语分析学家诺曼·费尔克鲁（Norman\
  \ Fairclough）的话来说，在通过修辞构建和从意识形态上治理城市及公民的社会实践中具有特别的“显著性”（2000a, p. 156）。\n\n此外，费尔克鲁（2000b）认为，这种话语具有如此关键作用的当代社会实践是“新自由主义秩序”的典型表现。他解释说，这是一种“独特的实践网络，其独特之处在于符号化[或：话语]作为其物质过程的要素以及这些过程的反思性构建的体现”（Fairclough,\
  \ 2000b, p. 47）。当代智能城市建设中推广性话语实践的普及和声誉——例如，考虑全年排满的（全球）智能城市活动、博览会、挑战、竞赛和颁奖典式的日历——支持了将智能城市视为一种典型的社会变革新自由主义项目的诊断。\n\
  \n从这中，我们可以就新自由主义智能城市的认识论，或者城市居民体验现有——或想象可能的智能城市的方式得出两个重要结论：\n\n1. 第一，“构建”一个智能城市既关乎智能城市叙事的推广性生产和传播，也关乎采购智能技术、推动立法和实现基础设施。\n\
  2. 第二，虽然智能城市可能是这些推广实践背后或脱离这些实践的机构或实体，但它实际上是这些实践的“一种隐性构建……被物化——正如 `res publica`，即公共物化，不如此——”，这在粗略程度上借用了菲利·阿布拉姆斯（Philip\
  \ Abrams, 1988, p. 59）对国家的分析。\n\n这意味着，新自由主义智能城市的存在在很大程度上取决于关于城市及其人民可以或应该成为什么的特定叙事。智能城市作为一种“文本”或叙事的观点也影响了批判性智能城市研究，这些研究探索了新自由主义智能城市叙事被（再）生产的场所和机制。这种学术指出“认知社区”（Kitchin\
  \ et al., 2017）的意识形态意义、大众文化和媒体中智能城市想象（Vanolo, 2016）、正式政府话语（Joss, Cook, & Dayot,\
  \ 2017; Vanolo, 2014）、智能城市景观和建筑（如“智造实验室”，March & Ribera-Fumaz, 2016）以及由欧盟委员会要求并资助的智能城市研究项目中所使用的“参与式”方法——最显著的是“城市生活实验室”（Cardullo\
  \ & Kitchin, 2018a; Engelbert et al., 2018）。\n\n在很大程度上，新自由主义智能城市通过日常话语实践被公共物化，这些实践既代表又构建了新自由主义智能城市的叙事。这些话语实践之所以是“日常的”，是因为许多城市居民在日常城市生活的一部分中经历、见证并参与其中。例如，考虑对“智能电表”的读取，它是商业能源供应商免费提供并安装在人们家中的。当然，设备本身的未来主义设计在意识形态上很有趣，因为其显著地呈现并干预了人们的室内风格。然而，检查电表的行为本身具有特殊意义，因为它可以将城市居民定位为其政治控制和公民责任仅监控自身消费的行动者（见\
  \ Strengers，“Resource,”2013, p. 9）。\n\n更直接关系城市治理的例子是居民在公共空间通过智能设备检查自己和他人的速度或污染，或者参与一项智能实验，市政会在其中产生、存储并链接关于他们在指定区域移动或行动的数据。新自由主义智能城市叙事的更平俗的解读如下：\n\
  \n- 穿过一个被符号标记或“命名化”（Berg, 2011）为“智能”的高级地区；\n- 在咖啡馆设置并获取 `Wi-Fi` 代码；\n- 通过手机投票让你的城市成为世界上最智能的城市。\n\
  \n同样，对新自由主义智能城市文本的日常解读包含了与市政未来智能目标的遭遇，无论是通过文件、旗帜、海报和指定的网站，还是通过新建立的准公共基金和网络组织（参见\
  \ Vanolo, 2014），这些组织的名称通常遵循 `[城市] Smart City` 的通用公式。\n\n### 话语实践与符号秩序的关联\n\n相反，新自由主义智能城市叙事的话语实践与新自由主义符号秩序的其他话语实践相连（参见\
  \ Fairclough, 2000b）。它们与其他日常话语实践发生——或者说，共同发生——这些实践同样（再）生产了城市作为一种商品、居民责任、创造力和韧性的舞台、一个“关于速度和效率的技术官僚问题”（Wiig\
  \ & Wyly, 2016, p. 487），以及通常作为一种（后）政治共识或“中立化”冲突的场所（Béal, 2011; Rosol, Béal, & Mössner,\
  \ 2017; Swyngedouw, 2016）。\n\n例如，考虑新自由主义智能城市话语实践如何与城市营销实践共同发生——例如高端房地产开发的符号划分、“枢纽”以及城市作为国际会议举办地——或者它们如何与“大社会”话语结合，例如“弹出式”社区中心和社区更新竞赛。同样，由于这些其他话语实践本身是由新自由主义城市陈调（Hall\
  \ & O’Shea, 2013; Massey, 2013）的常识性地位构成并维持的，它们现在也为“智能城市”的新型新自由主义配置提供了意识形态水泥。\n\n\
  \n\n\n\n# 日常意义构建的激进潜力\n\n这种矛盾在于：一方面为新自由主义智慧城市的话语编码赋予了至关重要的意识形态角色；另一方面却忽视了那些“在技术或政治上并不敏锐”的受众对该“文本”进行解码实践的批判潜力。这引发了三个重要问题。\n\
  \n首先，城市居民是否仅仅是旁观者，他们未能识别、更不用说质疑新自由主义智慧城市叙事背后的逻辑？他们对新自由主义智慧城市叙事的参与或解读，是如何作为普通居民的“日常城市生活”的一部分而呈现的（Cardullo,\
  \ 2017）？在什么情况下，普通城市居民对新自由主义智慧城市文本的解读可以被认为具有政治意义？\n\n这些问题在智慧城市研究中（往往）没有被考虑，至少在那些拥有“技术代理权”的（Melgaço\
  \ & Willis, 2016）或能够颠覆性地构建、挪用或破解数字技术和信息通信技术的公民（Cardullo, 2017; Datta, 2015）之外。一个显著的例外是\
  \ Taylor、Richter、Jameson 和 Perez del Pulgar (2016) 的研究报告，该报告对包容性智慧城市的发展提出了建议。该报告部分参考了焦点小组访谈，对象是“当前智慧城市发展讨论和实践缺失或被边缘化的参与者，以及那些生活可能受城市数据化影响最大的人”（Taylor\
  \ et al., 2016, p. i）。\n\n虽然报告发现这些非专家受访者并没有感到自己非常参与或与城市（阿姆斯特丹）的智慧城市项目联系，但大多数问题和发现都是关于受访者对数据安全、隐私和数据基础设施的感知和理解。当然，了解普通公民对智慧城市的“技术”维度了解多少，对于动动稳定作为一种新自由主义治理模式的智慧城市非常重要（Vanolo,\
  \ 2014）。然而，正如我们之前看到的，智慧城市不仅依赖于不可见的技术和无缝的顺服，而且通过智慧城市的推广性和表演性新自由主义叙事在公共领域被具象化。\n\n\
  我们对普通城市居民如何作为其日常城市生活的一部分来解读这一叙事知之甚少，这一事实是一个空白，绝不是因为阅读实践和立场可能为重新政治化新自由主义智慧城市提供一个关键的起点。我们可以借鉴文化研究关于日常意义构建政治的理论，来进一步想象这种可能性。四十年的文化研究——特别是文化理论家\
  \ Stuart Hall 和社会学家 David Morley 的遗产——已经展示了文本是如何“开放的”，尽管其多义性在意识形态上是有限制的。因此，文本的生产和消费是霸权斗争的主要场所。\n\
  \n在生产和消费新自由主义智慧城市叙事方面，这意味着经过策略性编码的叙事具有常识的影响——以及其与新自由主义秩序中其他符号形式的联系——并以此使其运作。然而，受众可能会针对这些叙事产生不同的阅读立场，而他们确认、协商或事实上挑战和反对“首选解读”的关键方面和前提的能力，取决于受众对“话语资源”的获取（Morley,\
  \ 1980）。\n\n对这些资源的获取反过来受到受众社会位置的塑造。然而，产生协商性或对抗性解读的能力不仅基于受众的社会和文化资本（例如通过财富、教育、教养、技术技能或政治素养获得的资本）。这些话语资源还中介了文本与受众的经历以及他们对自己在世界上反思——例如他们的性别、阶级、族裔和种族。\n\
  \n例如，女性主义文化研究学者（Ang, 1985; McRobbie, 1990; Press, 1991; Radway, 1984）专注于流行文化文本——肥皂剧、流行读物黄金时段电视，批评人士声称这些文本强化了主流的父权意识形态，从而将女性定位为（有意或无意地）顺从自己的奴役。然而，这些重构了`真实`女性`真实`阅读实践的研究发现，这些文本实际上被女性积极地阅读和享受。这是因为例如，看肥皂剧或读浪漫小说让女性能够对自己在父权制中的地位进行`批判性反思`，并且关键的是能够`想象`其他可能性和未来。换句话说，即使在高度家庭化或私化的环境中，对那些首选解读是非批判且去政治化的文本进行的“阅读行为”（Radway,\
  \ 1984），实际上实际上被意料之外的受众和公众`赋予`了政治性。\n\n这些见解并没有削弱这样一个事实：关于城市的公共辩论日益被私化的城市体验所取代（Iveson,\
  \ 2007）。然而，当我们将这些见解应用于考虑新自由主义智慧城市叙事是如何通过一系列被主流（“城市作为交换价值”）意识形态烙印的文本在公共领域具象化的时，一个关于新自由主义智慧城市政治代理权的有趣视角出现了。\n\
  \n首先，这意味着对新自由主义智慧城市文本的协商和对抗性解读是在日常的、而非特权的或明确划分的话语相遇中产生的。其次，这些批判性解读可以由那些通常被概念化为被新自由主义智慧城市“安于本”的城市居民本身产生。第三，产生批判性解读的能力不仅受到社会分层的话语`素养`（如学术技能、技术知识或政治技巧）获取的塑造，还受到同样分层的对新自由主义智慧城市的亲身`经历`以及在其中的`地位`的影响。接下来的结论部分将反思这种理论可能性对批判性智慧城市研究的影响和义务。\n\
  \n\n\n\n本章论证了，新自由主义推广性和表演性的智慧城市叙事可能为产生替代性的、再政治化的（智慧）城市想象提供了一个不寻的空间，且这种空间可能至少适用于两类“普通”城市居民：拥有`privileged\
  \ discursive literacies`的人以及具有弱势社会经验的`underprivileged social experiences`的人。\n\n\
  当然，这两类居民提醒我们关注列斐伏尔（Lefebrian）式的区分，即那些对城市生活感到“不满”的人与那些被“排除”或“剥削”的人之间的区别；同样地，也存在对他们而言城市权利是一种“诉求”的人与那些对他们而言这是一种“呐喊”的人（引自\
  \ `Marcuse`, 2014）。同样，我们可以将“不满者”识别为在政治和技术上都很敏锐的城市行动者，他们的政治行动和对批判性智慧城市研究的想象被视为对新自由主义智慧城市有意义的干预。\n\
  \n但是，“被排除者”部分由于其在新自由主义智慧城市中的不对称社会地位，通过对新自由主义智慧城市文本产生日常的`political readings`来维护他们的城市权利，这凸显了新自由主义智慧城市的文化政治。因此，批判性智慧城市研究应继续调查新自由主义智慧城市的`technologies`如何通过不可性和无缝性的模式殖民和治理场所（参见\
  \ `Vanolo`, 2014）。但它也应该研究新自由主义智慧城市的`narratives`如何占据公共空间，它们如何构建对该空间的行为预期，以及它们随如何（再）产生社会性排除。\n\
  \n同样，批判性智慧城市研究需要考虑新自由主义不可避免的裂痕和代理可能性（`Ferguson`, 2010），并调查普通公民是否、何时以及如何产生这些叙事的替代意义。受\
  \ `Creswell` 关于地方意识形态（1996）思考的启发，我认为批判性智慧城市研究应该极关关注普通公民何时以及如何（能够被赋予）“去自然化”新自由主义智慧城市的叙事？我们可能会看到城市居民的日常抵抗（`Creswell`,\
  \ 1996; `McCann`, 2002）——或者 `Kaika` (2017) 所术的“异议实践”——出现在或或协调且可见的意义构建实践中，例如“文化干扰”（`Carducci`,\
  \ 2016）、“偷猎”或地方政治抗议。然而，我们也可能（或特别地）预计新自由主义智慧城市叙事的替代意义会在“私下”被产生（参见 `Iveson`, 2007），当城市居民通过与智慧城市叙事的日常接触产生不满或被排除的“微观”体验时。思考如何挖掘这些私下解读，不仅为批判性智慧城市研究带来了重要的方法论挑战，还为我们的研究具有政治相关性（`Latour`,\
  \ 2000）提供了关键机会，并促进了（智慧）城市再政治化想象的传播和——使用典型的新自由主义智慧城市术语——“扩大规模”（scaling up）。\n\n##\
