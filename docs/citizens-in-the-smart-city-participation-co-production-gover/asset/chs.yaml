  \ IT 行业的跨国公司（如微软和谷歌），也可以是高度依赖 IT 基础设施的其他行业公司，如银行（例如法国巴黎莱银行）、电信（例如 AT&T）、时尚（例如古驰）或票务业务（例如\
  \ Ticketmaster），以及其他国家或本地公司。\n\n此外，问题有多种被识别和潜在解决的方法，范围从活动组织者设定的宽泛“挑战”到协作组织面临的具体问题不等。在某些活动中，可能没有总性主题，参与者可以提出自己的问题或项目。同样，关注重点和规模不同的公民组织也以组织者或利益相关者的身份参与黑客松。这些组织中的许多强调科技文化和行业的多样性问题。黑客松被用作一种策略，扩大社会弱势群体（最尤其是女性、儿童、青少年和少数族裔）获取技术和教育的机会，而不仅仅是作为发明的纯场所。\n\
  \n#### 创业机器\n`Entrepreneurial machines` 由一个“黑客松行业”促进，该行业侧重于帮助公司和组织规划活动，并选择具有吸引种子资金并转化为初创公司潜力的想法和团队（见表\
  \ 10.3）。例如，黑客松咨询公司如 `AngelHack`，专注于帮助跨国或本地公司举办黑客松，在许多情况下，这些黑客松是以系列形式组织的，并围绕组织者和赞助公司的商业重点为主题的。除了对活动的整体主题、结构和挑战提供建议外，黑客松咨询公司还为组织者提供可遵循的指南，特别是在获取当地赞助、场地以及与其他建立合作伙伴关系方面。因此，参与这些黑客松有助于个体的创业发展和生活方式提升，并使相关公司受益。\n\
  \n### 表 10.3. 黑客松分类法![Image](img/7.jpeg)\n\n#### 国家经济机器\n`State economic machines`\
  \ 对创业和创新的强调与创业机器相似。然而，国家经济机器通过初创经济和较小规模的创新发布了关于国家或区域经济增长的强有力叙事，反过来又吸引了公共和私立资金的支持。与创业机器不同，国家经济机器有各种政府机构的直接和间接参与。例如，`巴巴多斯外交和对外贸易部`与\
  \ `Microsoft` 合作组织了黑客松，以创建满足国家挑战的原型。这次黑客松是组织的散民会议的一部分，旨在吸引巴巴多斯移民对技术创新的入境投资，作为该国外交政策的一部分。此外，国家和区域经济发展战略及资金可以为利用黑客松作为增长初创经济的手段提供财务支持。例如，`Garage48`\
  \ 为爱沙尼亚和巴尔干地区组织黑客松系列，并由 `欧洲区域发展基金` 部分资助，以支持该地区的创新和经济发展。黑客松侧重于向参与者灌输硅谷的创新理念，并向该地区引入创业文化和创业实践：“Garage48\
  \ 在这里是为了展示，这完全取决于积极的‘让我们开始’态度、创意的团队成员和一个具有激励性的截止日期。”然而，在“后殖民”国家参与国家经济机器同样关乎经济和国家建设。对创业和创新能力的强调提供了打破其殖民过去并构建新国家身份的可能性（Datta,\
  \ 2015）。鉴于技术和政治动机，只要能够展示国家的创新能力，对参与者的技术技能和作为项目构思提出的特定问题的控制就相对较少。然而，对于参与能达到何种程度的实现以及这种参与是否仅仅培养了“创业公民”（Irani,\
  \ 2015），仍存在保留。\n\n#### 开放创新工具\n`Open innovation instruments` 是通过利用组织公司之外的专业知识来产生商业想法和原型的活动。这些黑客松通常涉及不同规模的公司和多个利益相关者，并号召具有技术、设计或业务技能的人参与。开放创新的黑客松可以由大型（跨国）公司组织，这些公司通常不在\
  \ IT 行业，但高度依赖 IT 基础设施运营或依赖 IT 创新来提供新服务。例如，`德国铁路`（`DB`）是数字战略的一部分。它还得到了企业和社会伙伴的支持，包括德国的\
  \ `Open Knowledge Foundation`、一个数据可视化平台（`Tableau`）、一个加速计划（`Data Pitch`）、一个关注女性的设计师组织（`Ladies\
  \ UX`）等。这些合作伙伴关系旨在增加……（此处原文逻辑存在断层）。\n\n#### 专家深耕\n`Specialist dives` 侧重于解决特定问题，通常由技术专家或特定团体组织。\n\
  \n#### 研究与创新应用\n`Research and innovation appropriations` 通过黑客松展示学术研究的成果，侧重于研究社区的参与。\n\
  \n#### 社会应用\n`Societal appropriations` 是通过重新利用黑客松来应对社会和政治问题的活动。\n\n\n\n\n### 讨论\n\
  \n在本章讨论的示例中，本地和跨国公司的大量存在，以及对创业和经济的强调，无疑支持了这一观点：黑客松正在延伸以企业为导向的、创业性的城市发展和主体霸权。它们与研究机构及公民组织的伙伴关系也引发了对公民社会和科学社区被收用的担忧。然而，讨论也揭示了参与创新过程是如何以相互并不完全和谐的方式展开的。\n\
  \n“社会化挪用”黑客松（societal appropriation hackathons）协商并对抗盛行的、将参与符号化和剥削的新自由主义理性与实践，同时通过挪用黑客松的实践、资源和活动结构来动员反对社会和政治逆境的行动。国家经济机器借鉴了创业机器的经验，但重新利用黑客松来打破殖民历史和认同。在组织黑客松的过程中，`project\
  \ proposition`可以成为促进缺乏技术培训和背景的人参与的关键要素，这同时也挑战了`corporate hackathons`的逻辑和实践。\n\n\
  为了从活动参与者身上获得有用的观察或新见解，`corporate hackathon organizers`以自上而下的方式规划`project propositions`（正如创业机器或开放创新工具所示），以“挑战”的形式呈现。然而，`project\
  \ proposition`也可以是自下而上的，这在“社会化挪用”黑客松或黑客活动中很常见，在这些活动中，参与者通常不具备技术能力，带着自己的问题让技术开发人员和设计师创建原型。另一种，一个广泛且成熟的关注点（如气候变化）可以作为一个主题，活动组织者随后与从政府机构到\
  \ NGO 等其他组织合作，识别特定的社会或技术问题，以吸引参与者工作。\n\n在此过程中，黑客松变成了参与的手段而非目的。它们可以被组织用来激发问题并扩大参与渠道，但还需要后续的安排和计划来进一步与受影响的社区、政府以及资者/赞助商建立关系。此外，在黑客松内部可以发现多种理性，它们既合作又抵抗或重新利用那些为了利用“群众智慧”而开发的黑客松组织实践。根据我对我黑客松进行的民族志研究，`open\
  \ innovation hackathons`的参与者对创新的价值和受益者持有冲突性的观点（Maalsen & Perng, 2017; Perng et al.,\
  \ 2018）。他们就项目开发的目的和方向进行辩论。这种辩论没有达成共识，实际上干扰了企业对参与者想法和劳动的收用。\n\nMouffe 的斗争关系（agonistic\
  \ relations）概念对于进一步思考参与和黑客松很有帮助。上述讨论的不同黑客松类型试图实现霸权的多元化，其中它们之间的冲突关系使得参与的新可能成为可能替代黑客松安排不符合既有的黑客松理想和实践，重新考虑了黑客松作为创新工具的有效性，并重新利用活动结构用于社会和政治行动。对主流黑客松安排的适应、挪用和抵抗，探索了扩大参与和塑造社会期望创新的关键问题，这些问题包括：如何为那些被排斥的人创造机会、创新过程如何是协作性而非竞争性的、项目问题如何被提出，以及活动结果如何能更好地与公民利益以及社会和政治行动主义相一致。\n\
  \n此外，上述提到的在黑客松参与期间并存但对抗的理性，可能为进一步推进黑客松霸权的多元化提供机会。事实上，对创新的新自由主义逻辑的某些拒绝可以被视为 Mouffe\
  \ 术语中的“对抗”。然而，正是通过区分对参与的立场，才能阐述并实施更具包容性和协作性的创新模型的替代愿景和实践。\n\n### 结论\n\n本章考察了不同类型的黑客松，以理解在争夺智慧城市参与权过程中产生的斗争关系和持续协商。本文探讨了在组织黑客松时发生的合作与对抗，以证明个人、机构、`project\
  \ propositions`和社会奖励（除现金或创业之外的激励措施）如何共同努力，重新利用具有霸权的黑客松及其新自由主义理想、修辞和实践。\n\n替代性的黑客松组织实践试图建立一个包容来自不同背景、观点和专业知识的人的创新环境，并设定在创新过程中以强调伦理和社会价值为重点的计划。在此过程中，这些实践标记、记录并行使了对延续既有技术和城市建设政治经济体系的拒绝，尽管企业实体的存在无处不在。\n\
  \n基于这些观察，未来的工作可以考察黑客松中相互竞争的各种理性和实践，以考虑它们如何可能扩大技术制造中的参与。此外，还可以探索其他公民倡议中的斗争关系，以考虑它们如何能够鼓励对新自由主义城市发展的持续拒绝，以及对开放、包容和协作制造未来城市的愿景和安排进行充满冲突但充满活力的探索。\n\
