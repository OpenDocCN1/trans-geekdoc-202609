  \ MIT 之外开设了第一个 Fablab（Bosqué, 2017）。今天，Fablab 网络在全球范围内由超过 1300 个实验室。\n\n2. 此前，Guallart\
  \ 曾担任加泰罗尼亚建筑学院（IAAC）的院长，该研究中心拥有世界上最活跃的 Fablab 之一，也是其最著名的项目之一：`智能公民包`([`smartcitizen.me`](https://smartcitizen.me))。Antoni\
  \ Vives 也是 IAAC 的创始人和赞助人。\n\n3. “巴塞罗纳共同体”（Barcelona en Comú）的候选名单在 41 个议会席位中获得了\
  \ 11 个。2016 年至 2017 年间，他们与社会党（PSC）联合执政。\n\n4. Jordi Reynes 在“可持续数字制造研讨会”上演讲，地点位于巴塞罗纳\
  \ Fabrica del Sol，2016 年 3 月 7 日。\n\n\n\n\n\n# 第 14 章\n\n## 迈向真正人性化的智慧城市主义\n\nRob\
  \ Kitchin\n\n### 摘要\n本章探讨了如何遵循大卫·哈维（David Harvey, 1973）的观点，产生一种真正人性化的智慧城市主义。本文通过利用面向未来的视角，勾勒出重新想象、重构和重造智慧城市所需的工作。。我认为，一方面，需要产生一种替代性的“未来当下”（future\
  \ present），将智慧城市的预期逻辑转变为解决持续性的不平等、偏见和歧视，并植根于公平、公正、伦理和民主的理念。另一方面，有必要打破新自由主义智慧城市主义的“当下未来”（present\
  \ future），超越极简政治，实施持续的、战略性的、以公共为主导的干预，旨在创建更具包容性的智慧城市倡议。这两种策略都需要为智慧城市构建一种深层次的规范性愿景，这种愿景植根于公民身份、社会正义、公共利益以及城市权利，并需要与公民共同开发。\n\
  \n**关键词**：智慧城市；公民身份；社会正义；城市权利；未来；伦理\n\n### 引言\n\n\n\n\n本书各章节提出的分析认为，智能城市目前的基础是工具性的、常识性的、务实的、新自由主义的公民身份和社会正义概念，而这些概念是以后政治术语来构建的。即使在所谓的以公民为中心的智能城市愿景中，公民也在很大程度上被定位为数据点、消费者、用户、玩家、测试者，或需要被聚集、助推、规训和控制的人（Cardullo\
  \ & Kitchin, 2018a）。他们偶尔会作为提供反馈和建议的参与者出现，但很少担任决策者、共同创造者或领导者的角色。智能城市的政策和计划大多是在管理和公民家长主义的框架内构想的，由“专家”制定并代表公民或为了其最大利益进行实施；或者是由寻求新积累模式的资本利益驱动的（Shelton\
  \ & Lodato, in press）。在后一种情况下，城市不再是市场运作的地方，城市本身及其基础设施和这些——这些曾由国家为了公共利益运营的设施——变成了社会和技术实验的市场和实验室。在这里，任何对智能城市的权利都是成为作为消费者的权利，前提是个人拥有足够的资本（财务、社会和文化）来这样做。这种权利在新自由主义治理逻辑和数据驱动剥夺的积累逻辑下，获得智能技术收益的权利（Hollands,\
  \ 2008; Shelton, Zook, & Wiig, 2015）。\n\n本书的核心问题是：是否可能存在另一种智能城市？我们是否能设想并实现一个认真对待列斐伏（1996）的“城市权”概念的智能城市？我们是否能利用智能技术的力量创造一个解放和赋权的城市，或者正如哈维（1973,\
  \ p. 314）所说的“一种真正人性化的城市主义”？我们是否能重新构建、重新想象并重建智能城市，使其真正“以公民为中心”，而不是主要由利润和国家需求驱动？\n\
  \n书中的章节开始探索这些问题，尽管它们也明确了实现此类面临的挑战。尽管如此，规划通往未来智能城市的路径至关重要。正如 Marcuse (2012) 所指出的，列斐伏明确坚持，“要求的不是对现有城市的权利，而是对未来城市的权利”；一个形成中的城市；一个在社会空间关系上发生转型的城市。正如我在其他地方论证过的（Kitchin,\
  \ 2018），未来是智能城市话语体制和运作中的关键要素（另见 Datta & Shaban, 2016; Söderström, Paasche, & Klauser,\
  \ 2014; White, 2016）。Adams 和 Groves (2007) 注意，未来通过两种时间模态被唤起：“当下未来”（present future）和“未来现在”（future\
  \ present）。\n\n### 当下未来：推断现在\n“当下未来”是从现在的角度看的未来。它是将要创造的未来，从过去和现在的趋势中展开，是既定和嵌入结构以及路径依赖的结果，尽管这些结构是可以被重新引导的（Poli,\
  \ 2015）。“当下未来”将未来定位为我们“去塑造和创造”的，从现状向后推断（Adams, 2008）。因此，人们做出预测，制定策略和计划，并采取直接行动以试图实现特定的未来。智能城市技术在创造可能且理想的图景、倾向和结果方面具有未来导向性。它们寻求产生“偶然性未来”，即为预料中的惊喜做好准备；或者产生“优化未来”，将过去的模式和趋势强加于未来以确保连续性（Miller,\
  \ 2007）。\n\n在产生此类未来方面，实验城市主义的实践尤为重要。在这里，创新者能够在现实环境中对新技术进行原型设计试验，以测试、学习并推广可能且理想的城市未来（Evans,\
  \ Karvonen, & Raven, 2016）。因此，智能城市测试场和生活实验室致力于试图产生 Adam 和 Groves (2007) 所说的“潜性未来”——正在形成中的、“在路途中”的未来。Halpern\
  \ 和 Günel (2017, p. 2) 认为，智能城市原型制作这一持续且不完整的过程产生了“先发性希望”；一种感觉认为不确定的社会、经济和环境未来正在被积极应对，但这种应对是通过创造一条通往特定新自由主义城市愿景的转型路径来实现（Marvin\
  \ & Silver, 2016）。因此，智能化变成了我们想象和应对未来的常识性手段。\n\n### 未来现在：规划替代轨迹\n当“当下未来”将现在延伸到未来时，“未来现在”则利用可能的未来来考虑和规划替代轨迹（Adam\
  \ & Groves, 2007）。例如，“回溯法”（backcasting）的实践想象了一个规范性未来——即我们可能希望实现的某种状态——然后回溯到现在，试图定义使这种未来成为现实所需的步骤或路径（这可能需要与“当下未来”策略进行彻底的断裂）。因此，“未来现在”承认我们现在的行动可能影响后代，我们可以从道德和伦理上采取行动来创造一个不同的世界（Adam,\
  \ 2008）。在这个意义上，Anderson (2010) 认为，唤起规范性未来是为了预先、准备或防止威胁的实现，并将当下未来的路径重新引导到一条新的轨迹上。\n\
  \n正如 White (2016) 所详述的，智能城市支持者已经开发了一种话语理性，试图殖民未来，并广泛利用潜在的情景来既使当下的技术干预合理化，又预先并规划新的城市轨迹。特别是三种危机构成了想象替代未来的动力：人口模式的广泛变化（特别是从农村向城市的迁移）以及随之而来的资源压力；全球气候变化以及对更具韧性的城市的需求；财政紧缩以及创建更精简政府和吸引流动资本的愿望（White,\
  \ 2016）。通过唤起替代性的未来想象并将其与未能采取智能城市投资路径的“当下未来”进行对比，支持者试图为智能城市主义铺平道路，并预设未来城市。然而，正如第一章及其他章节所论证的，智能城市的预期逻辑主要在新自由主义术语下构建的。因此，创建一个更具人性化的智能城市需要的不仅仅是揭露、提议和政治化（Marcuse,\
  \ 2012）智能城市的现状、过程和不公正：尽管这项工作对于为生产性干预和替代路径提供基础和合理性至关重要。它需要转变“当下未来”的思维和实践，并重新配置“未来现在”的叙事以重新构建和重建智能城市。这两种策略都需要产生一种深层的规范性智能城市愿景，这种愿景植根于公民身份、社会正义、公共利益和城市权的概念。\n\
  \n\n\n如果我们我们要将智能城市的未来转变为一个以创造“真正人性化的智能城市主义”这一使命为核心的形态，那么从想象一种替代性的“未来现在”开始是有成效的，因为它为重构智能城市的未来现在提供了背景和框架。当然，在想象这些替代性未来时，人们需要审视当前的智能城市修辞、实施及其相关的未来愿景存在哪些问题。特别是第一章以及其他章节已经记录了智能城市的危险和陷阱，因此这里没有必要再次详细重演这些内容。\n\
  \n简而言之，之前的章节明确了：新新自由主义的智能城市推进了一种以技术为导向的企业型城市主义。这种主义是以市场为导向的，在解决城市问题时采取工具主义方法，提供“贴补式”解决方案而非解决根源问题，并且复制了劣势而非改善劣势。虽然智能城市的预判逻辑——人口变化、气候变化和财政紧缩——确实值得采取行动的问题，但它们需要整体性和结构性的解决方案，而非简单的技术修复，而且这些方案需要配合解决系统性社会和空间分化、创造更加公平、平等和符合伦理的社会的逻辑。这只能通过以下方式实现：\n\
  \n1.  通过跨社会重新分配资源来应对并限制资本主义的最极扩张，创造关键资源的公平准入水平并建立慷慨的福利国家；以及\n2.  反转转向新自由主义政府性和和治理的趋势，拥抱公共利益和共享公共资产等更具社会民主色彩的理想，并确保制度过程公平、透明且负责。\n\
  \n换句话之，我们需要想象另一种类型的智能城市，一种由非自由主义形式的公民身份和社会公正支撑的城市，一种确保了列斐伏（Lefebvrian）意义上“城市权利”的城市。\n\
  \n### 智能城市的特征\n\n在基础层面，这种智能城市将具有许多源自“城市权利”理想的特征（Cardullo & Kitchin, 2018b）：\n\n\
  *   **第一**，智能城市将转向反映和服务于公民的利益，而不是让这些利益继续隶属于国家和市场之利益。\n*   **第二**，智能城市中的公民参与将拥有更具包容性和审慎性的框架，超越消费主义和象征性的公民参与，包括更广泛的公共咨询、协作与共同生产，并让公民承担创造者、成员和领导者等角色。\n\
  *   **第三**，将从主要基于市场原则的公民身份，转回一个由一系列公民、社会、政治、符号和数字权利及权利支撑的框架。\n*   **第四**，这将伴随着一种替代性的政府性，这种性尊重权利和自决，公平透明地对待人们，并对算法治理的形式和实践（如社会分类、预判性助推、纪律与惩罚）进行制衡。\n\
  *   **第五**，关键的公共资产（如核心城市基础设施和公共服务）将形成受保护并为公共利益而利用的公有地，包括对已私有化的部分进行收归公有。\n*   **第六**，平台资本的过度将受到抑制，劳动将获得公平报酬且不稳定性降低，资源将得到更公平的重新分配。\n\
  \n此外，未来的智能城市不会产生诸如智能公民、智能公民身份、智能正义或智能公社等新的政治概念（这些概念不可避免地与技术以及通过技术产生中介），而是将转向公民、公民身份、正义以及广义的公社。\n\
  \n### 乌托邦作为一种方法\n\n我理解，这一愿景在这些抱负在实践中的具体表现，以及创造此类愿景所需的策略方面，显然非常空泛。这是出于两个原因。\n\n首先，虽然已经有一些旨在沿着这些思路重新构想智能城市的思考（见\
  \ Coletta, Evans, Heaphy, & Kitchin, 2019; McLaren & Agyeman, 2015; Morozov & Bria,\
  \ 2018），但显而易见，勾勒出智能城市的替代性未来现在的特殊特性需要大量工作、需要深层反思，并且所需的空间远比本章提供的要。\n\n其次，这项工作不能仅仅由学者、城市管理者、政策制定者以及企业顾问和研发人员来完成，而是需要涉及能够表达他们对未来城市生活希望和渴望的普通人。\n\
  \n在这里，采用乌托邦作为一种方法（Büscher, 2017; Levitas, 2013）具有某些意义。这种方法寻求创造社会的想象性重构，一种关于什么是向往且可能的推测性社会学：在这种情况下，即一个理想的未来城市。Levitas\
  \ (2013) 认为，这种方法提供了思考“经济、社会和政治过程、我们的生活方式以及人类繁荣所需的要素之间的联系”的手段，而这种繁荣关乎每个人，而不仅仅是少数特权阶。\n\
  \n在 Levitas 的表述中，作为方法的乌托邦包含三个方面：\n*   一种考古学模式（挖掘并组装构成乌托邦社会的元素），\n*   一种本体论模式（定义此类社会中被召唤的主体、代理人和角色），\n\
  *   一种建筑模式（该社会的设计与界定）。\n\n一旦构想了乌托邦，就可以进行“反向溯源”（backcasting）过程，以思考整个愿景或其部分如何实现，以及实施中的挑战。这种乌托邦式的思考并非一种注定失败的徒劳之举，而是开启了想象其他未来的可能性，创造了替代性的预判逻辑。\n\
  \n### 身份政治与多样性\n\n我认为，这一过程内在包含了对身份政治的彻底考虑，而到目前为止，智能城市的文献中很少被涉及（尽管见 Bousquet, 2018;\
  \ Cockrayne & Richardson, 2017; Datta, 2015; Elwood & Leszczynski, 2015; Jefferson,\
  \ 2018; Rose, 2017; Shwayri, 2018; Trencher & Karvonen, 2018）。在这里，人们意识到要有一个真正人性化的智能城市，它必须以包容的方式涵盖多样性和差异。\n\
  \n通过性别、后殖民、酷儿、种族、阶级和残障理论来解读智能城市是一种清醒的体验。虽然智能技术可以提供一些解放效应，例如为了女性安全或帮助残障人士寻路的应用程序，但通常大多数技术要么忽略或固有加剧了社会分化，特别是那些涉及画像分析、分类、助推和其他社会控制的形式（Elwood\
  \ & Leszczynski, 2018; Jefferson, 2018a）。\n\n这提出了一个关键问题：一个为女性、LGBT 群体、有色人种、少数民族、贫困人、残障人和老年人设计的包容且非歧视的智能城市会是什么样的？不仅是在技术、基础设施和服务的配置与运作方面，而且是在智能城市的政策、实践和愿景方面？回答这些问题需要对目前构想的智能城市在话语和物质上的表现进行持续质询，并对如何以解放的方式进行转型进行深层次的规范思考。这种推测性的未来创造需要足于本土背景：不存在一种一刀切的乌托邦式未来城市，全球范围内对智能城市的研究已经明确了这一点（Coletta\
  \ et al., 2019; Datta & Shaban, 2016; Karvonen, Cugurullo, & Caprotti, 2018）。事实上，智能城市对于撒哈拉以南非洲（Watson,\
  \ 2014）、哥伦比亚（Talvard, 2019）和印度（Datta, 2015, 2018; Janu, 2017; Rangaswamy & Nair,\
  \ 2012）的国家以及低收入贫民窟居民意味着什么，以及未来的智能城市在南方国家应该、能够以及如何发展，无疑与北方国家截然不同。\n\n\n\n\n# 智慧城市的当下与未来\n\
  \n在缺乏清晰规划的智慧城市“未来当下”的情况下，许多利益相关者和市政府正试图改变当前智慧城市制定和实施的“未来当下”，将其转向更具包容性且更少市场导向的模式。这涉及制定一套战术，旨在实施更自下而上、以公民为中心的智慧城市版本。这些方案通常以非常务实、符合常识的方式制定，由公民社会组织产生，并促进社区主导的公民科技及共享倡议（参见\
  \ McLaren & Agyeman, 2015；Schrock, 2018，本卷；D’Ignazio 等人，本卷）。\n\n这些倡议在理念和实践上可能非常多样；例如，McLaren\
  \ 和 Agyeman (2015) 指出了四种类型的共享倡议，其中三种与商业化、货币化的平台（如 `Uber` 和 `Airbnb`）采取不同：非营利、点对点和社区平台（例如\
  \ `Streetbank` 和 `Freecycle`）；商业性、社会文化（而非排他的平台中介）交换（例如 `Enspiral` 和 `Bitcoin`）；以及社区、社会文化交换，如家庭和社区内部的共享。同样，Perng（本卷）识别了黑客松的多种不同形式和理念。\n\
  \n这些反霸权的倡议往往缺乏宏观的战略愿景或更广泛的意识形态框架，并实施的是“小写 p 的政治”（politics with a small p）。它们可能对转变特定智慧城市发展的局部方法产生深远影响（例如，在当地构思和部署系统时，采纳游戏、黑客行为和社区规划的思想；参见\
  \ de Waal, de Lange, & Bouw, 2018），但它们通常被收编进新自由主义计划，或者局限于重塑城市智慧城市计划的某些方面，而没有对底层的治理术和政治经济产生真正的改变。\n\
  \n尽管如此，它们具有重要性，意义在于它们实施了 Macgilchrist 和 Bohmig (2012, p. 97) 所说的“最小政治”，在原本看似是智慧城市的霸权话语体系和物质政治中创造了“微小的裂缝”。这种对微小裂痕的不断重复意味着智慧城市的愿景被疏离了，并“确保了民主——理解为冲突和分歧的实践——在每天得以实施”（Macgilchrist\
  \ & Bohmig, 2012, p. 97）。换句话说，虽然单个行动可能不会在智慧城市的制定上引发地震般的转变，但通过与其它反霸权倡议相结合，反抗和抵抗性行为开启了微小的裂缝，变革可以通过这些得以实现。正是这种最小政治导致智慧城市被重塑为“以公民为中心”，尽管这种品牌重塑并未改变其实际的制定和实践（Cardullo\
  \ & Kitchin, 2018a, 2018b；Kitchin, 2015）。\n\n## 战略与意识形态愿景\n\n其他倡议具有更具战略性和意识形态的愿景，寻求在国家层面从根本上重构智慧城市的愿景。以哥伦比亚的麦德林（Medellin）为例，该市寻求实施所谓的“社会城市主义”（`urbanismo\
  \ social`），在共享公共领域促进社会包容理念（McLaren & Agyeman, 2015）。从 20 世纪 90 年代中期开始，麦德林市政府一直专注于赋能公民，从最贫困的社区开始，通过一系列与信息技术（ICT）、教育、文化活动、基础设施和经济发展相关的倡议，以及使用参与式预算和社区规划，创建一个涵盖公共服务和空间的城市公地（McLaren\
  \ & Agyeman, 2015）。\n\n近年来，这已扩展到其智慧城市倡议，寻求吸引公共和私营参与者，就城市应如何在政治和经济上进行组织达成共识（Talvard,\
  \ 2019）。虽然该市设立了智慧区 `Medellinnovation` 作为城市实验场所并寻求吸引跨国投资，但该地区并不控制住在那里的人，而是明确目标是服务现有当地居民并防止会导致他们流离的士绅化。然而，尽管麦德林寻求成为市政府所说的“包容且有竞争力的智慧城市”，Talvard\
  \ (2019) 详细说明它仍然交付了一种“相当带有家长色彩和市场导向的智慧观念”，并遵循一条有利于商业行为者利益的发展路径。他因此得出结论，尽管强调了社会包容，但似乎存在“伪装成当地发展的对公共利益的企业劫持”。尽管如此，资本利益受到了限制，且在包容和公地化方面的强调比其他智慧城市强。\n\
  \n## 巴塞罗纳的技术主权\n\n巴塞罗纳的案例在第 1 章和第 13 章中已有记录，但值得扩展“技术主权”的概念，因为它也许是试图重新思考智慧城市政治和原则的最清晰例子，并挑战了其底层的政治经济（March\
  \ & Ribera-Fumaz, 2018）。Morozov 和 Bria (2018) 提出了一种技术主权的愿景以及九项政治行动，旨在帮助城市控制其数字政策和公共资产，扭转新自由主义造成的损害，并产生一个首先服务的城市：\n\
  \n- 促进替代的数据所有制，包括创建开放数据公用于限制激进的数据采集；\n- 将信息服务转向开源、开放标准并采用敏捷交付；\n- 转型采购，使其具有伦理、可持续性和创新性；\n\
  - 控制数字平台，包括对共享经济的监管；\n- 构建并增长基于开放去中心化技术且保护网络中性的替代数字基础设施；\n- 开发协作模式的服务模式；\n- 通过公共价值实现创新最大化，包括基层社会创业；\n\
  - 在地方层面重新思考福利计划和互补货币系统；以及\n- 通过数字参与工具和新权利促进数字民主和数字主权。\n\n对于他们以及巴塞罗纳市政府来说，这些行动确保城市能够实施独立的、有效的政治并决定自己的命运，让公民对周围的技术基础设施如何运作以及为什么服务拥有发言权并参与（p.\
  \ 22）。他们认为，如果没有技术主权，“对城市权的斗争将失去很大力量”（p. 23），因为城市的管理与私人资本和权力利益紧密结合。他们还指出，一场不同类型智慧城市的战斗如果没有与持续的城市社会运动建立强有联系，如果没有拒绝所有形式企业家城市主义的新一代政治家（p.\
  \ 25），将无法成功。\n\n\n\n\n\n*   实施侧重于消除贫困和社会排斥的普惠基本收入；以及\n*   构建城市数据公社：规定在公共服务背景下产生的人口网络化数据不能由服务运营商所有。(Morozov\
  \ & Bria, 2018, pp. 29–30, 总结自 Mason, 2016)。\n\n显然，鉴于目前的嵌入式结构和路径依赖，创建一个非新自由主义的、后资本主义的智能城市绝非易事，但巴塞罗纳在技术主权方面的实验为追求智能城市权利提供了希望，以及相关的策略和战术，这些策略可以被用于扩展其他地方正在实施的“极简政治”。\n\
  \n### 结论\n\n通过深度思考、愿景规划和实施，智能城市的权利远非一项简单的任务。它是一项充满了意识形态和规范性问题、困境，并涉及政治、社会和文化工作与实践的任务。本章试图勾勒出所需的未来导向型工作，以重新构想、重构和重塑智能城市，产生一种真正使人性化的智能城市主义。\n\
  \n一方面，我论证了这需要产生一种替代性的“未来当下”（future present），将智能城市的预期逻辑转变为解决持续的不平等、偏见和歧视，并植根于公平、公正、伦理和民主的概念。另一方面，我主张，打破新自由主义智能城市主义的“当下未来”并实施替代性的更具包容性的智能城市倡议的工作需要加速、多元化进行，并从实施“极简政治”转向更持续的战略性、意识形态性的、公共主导的愿景，以寻求从根本上重新配置智能城市。\n\
  \n在我看来，这种“未来当下”和“当下未来”的工作需要深度交织，以便为建设中的智能城市产生一套连贯的愿景以及政策和倡议。本书试图为继续这项工作提供思想、分析和案例材料，反映公民身份、社会正义、公社化和公共利益等问题。读者面临的挑战是参与并思考贡献者提出的观点，并响应马库塞（Marcuse）的号召，揭露、提出并将智能城市的政治和实践政治化，同时用规范性的、未来导向的工作作为补充，从而重塑智能城市的可能性。要实施智能城市的权利，我们必须清楚这种权利是什么，以及要产生什么样的城市。\n\
