  \ Geography), *37*(4), 485–493.\n\n\n\n\n# 第 4 章\n\n## 可玩的城市公民身份：社会正义与公民生活的游戏化\n\
  \nAlberto Vanolo\n\n### 摘要\n过去几年里，技术的发展为促进公民参与和投入提供了新的可能，各种智慧城市的实验也证明了这一点。在这一框架下，游戏元素被广泛动员，旨在培养负责任且活跃的公民，以解决城市问题。游戏化在引导公民和促进各种形式的参与方面可能是有效的，但必须解决根本性的伦理和政治问题。本章通过结合大卫·哈维（David\
  \ Harvey）提出的社会正义经典概念化来解读游戏化，并提出这一论点：认为通过游戏化进行的参与可能意味着不公正的批判性因素。\n**关键词**：游戏化；公民游戏；严肃游戏；智慧城市；参与；公民参与度\n\
  \n### 引言\n`Traffic Agent` 是一款由奥斯陆市、挪威研究委员会以及 IT 巨头道创集团（Capgemini）大规模资助开发的移动应用程序。基本上，它是一个基于地理信息系统（GIS）的程序，允许儿童报告他们在上下学途中遇到的安全隐。该程序的设计目的是众包数据，以改进道路维护和基础设施规划；它能够直接从儿童那里获取廉价且最新的信息，而儿童通常是很难纳入规划的对象。然而，正如一般的众包项目一样（Dodge\
  \ & Kitchin, 2013），人们担心如何激励儿童参与并保持他们的兴趣。核心想法是将该程序开发成一种适用于手机和平板电脑的间谍游戏。据介绍，孩子们对扮演秘密探员帮助维护城市安全感到兴奋。正如项目经理所：“Traffic\
  \ Agent 吸引了年儿童，并让他们看到自己在社区中拥有一席之地。这种对公民责任的早期接触非常重要。”¹ 这是一个游戏化的例子，游戏化被广泛意用于动员和实施游戏元素来管理“严肃”问题。在城市管理领域，这意味着通过引入竞争、排名、分数、勋章、等级、奖励和虚拟货币等游戏机制，软件设计人员和政策制定者旨在刺激公众参与和良性社会行为（Deterding,\
  \ Dixon, Khalad, & Nacke, 2011）。通过将公民重构为玩家，从而将城市问题转化为游戏，人们可能会被引导以公民、可持续且适当的方式行动和行为；例如，垃圾垃圾、按时交税、节约能源等（Morozov,\
  \ 2013; Vanolo, 2018）。当然，游戏化不仅限于儿童，正如 `Traffic Agent` 的案例那样。例如，许多应用程序开发的目的是将游客体验游戏化，将游客变成城市寻宝猎人，这种方式与在\
  \ `Pokemon Go!` 中收集角色没有太大区别。公民生活的游戏化在大多数城市可能仍受到限制，但实验和论（包括科学辩论）正在蓬勃发展。尽管文献中很大一部分对公民游戏的潜力非常积极，甚至是赞加之，但批判性学术也强调了风险和局限性。例如，可以将游戏化视为一种治理技术：通过参与游戏，公民的主体性在特定理性的视角下被重构和道德化，最终实现“引导主体的行为”（conducting\
  \ the conduct）——使用一个非常流行的福柯式术语（Rose, 1999）。本章旨在通过动员大卫·哈维（1973, 1992, 1996）提出的社会正义概念，对游戏化、参与和公民身份进行批判性反思。本章发展的主要观点是，通过游戏化进行的参与可能会引发不公正的形式，城市规划者和政策制定者必须谨慎对待。为了展开这一论点，下一节将讨论社会正义的概念，随后将对游戏和游戏化进行讨论。我提出了一个假设，并制定了关于城市生活游戏化对城市正义构成的不同威胁的初步地图。\n\
  \n### 社会正义与（数字）城市\n\n\n\n\n\n自 20 世纪 60 年代后期以来，社会公正一直是城市研究的核心关注点。这场辩论的主要贡献者之一是大卫·哈维（David\
  \ Harvey），他通过其核心著作*社会正义与城市*（1973 年）探讨了权力分配与资本积累动态之间的关系。他将社会（不）公正的概念与资本主义生产方式的内在矛盾及其在城市空间生产中的关键作用联系起来。\n\
  \n这一论点在他 1996 年的著作《正义、自然与差异地理学》（*Justice, Nature and the Geography of Difference*）中得到了进一步发展，书中，他将马克思主义视角（辩证唯物主义）与后结构主义女性主义相结合，以探讨与异质性、差异、立场性和情境等问题相关的正义概念。哈维在\
  \ 1992 年的文章《社会正义、后现代主义与城市》中就已经动员了这一理论建构。\n\n通过讨论两个截然不同的城市案例（纽约汤普金斯广场公园对无家可归者的驱逐，以及巴尔的摩的一项公路基础设施项目建议），哈维发展出了一种不同于分配正义（Rawls,\
  \ 1971）的社会公正理解。他拒绝了大多数后现代文化分析中特征性的相对主义，这种分析仅包含解构练习，而不采取任何有意义的立场，也不引发行动或变革。\n\n在谈到从公园驱逐无家可归者时，他问道：政策制定者和规划者应该做什么[...]……？放弃规划，加入那些新兴的文化研究计划，沉溺于汤普金斯广场广场式的混乱场景，同时又对就这些问题采取行动投入任何承诺？运用解构和符号学的全部批判力量，对写着“死吧，雅青狗渣”的涂鸦寻求新颖引人入胜的解释？我们是否应该加入革命和无政府主义组织[……]（Harvey,\
  \ 1992, p. 591）\n\n在文中，哈维从艾莉丝·马里恩·杨（Iris Marion Young）的著作《正义与差异政治》（*Justice and\
  \ the Politics of Difference*，1990 年）中汲灵感，以强调立场问题在思考城市空间生产时的核心地位。文章提出了六个核心论点（命题），这些论点可能有助于概念化更公正的规划形式（Harvey,\
  \ 1992）：\n\n1.  公正的规划和政策实践必须支持社会政治组织形式以及生产消费体系，以最大限度地减少工作场所和生活场所对劳动力的剥削。\n2.  它们必须以非家长式的模式应对边缘化现象，并在边缘政治中寻找组织和斗争的方法，以解放被囚禁的群体。\n\
  3.  它们必须赋能受压迫者而非剥夺其获得政治权力的机会，并必须鼓励他们进行自我表达的能力。\n4.  它们必须对文化帝国主义问题敏感，并通过各种手段寻求在城市项目设计和大众咨询模式中消除帝国主义态度。\n\
  5.  它们必须寻求非排斥性和非军事化的社会控制，以遏制个人和制度化的暴力，同时不破坏赋权和自我表达的能力。\n6.  公正的规划和政策实践应当认识到所有社会项目产生的必要生态后果对后代以及遥远的人有着影响，并采取措施减轻负面影响。\n\
  \n为了反思游戏化过程在正义方面的影响，本章结合这六个命题对这一现象进行了解释。其目标是为关于智慧城市项目的社会、文化和政治影响的持续辩论，`computer\
  \ code`塑造城市空间的多且且平衡的方式，以及在城市空间进步数字化的背景下列斐伏尔“城市权利”概念的意义的讨论做出贡献（例如，Kitchin & Dodge,\
  \ 2011; Shaw & Graham, 2017; Vanolo, 2014; 以及本书中的各种贡献）。\n\n### 游戏化与公民参与\n\n\n\n\n\
  关于游戏化的文献非常广泛且具有异质性，且尚未完全成体系，很大程度上由会议论文、研究论文和其他灰色文献组成。事实上，关于游戏化定义的主要来源是 Deterding\
  \ 等人（2011）发表的被广泛引用的会议论文。该论文将游戏化描述为“在非游戏场景中使用游戏设计元素”（Deterding et al., 2011, p. 1）。\n\
  \n根据作者的观点，游戏化最初源于商业领域，远早于大众数字技术的普及。例如，美国航空在 20 世纪 70 年代引入的常客计划可能可以被视为一种游戏，其目标是培养客户的忠诚度：通过飞行、消费和使用信用卡，可以获得“积分”，达到更高的“等级”并享受独家体验，如进入机场休息室（Reiners\
  \ & Wood, 2015）。但也可以考虑“公民”和“非商业”的案例：童子军运动以寓乐的方式动员勋章、奖章、制服和头衔（如普通童军员、鹰式童军员等），旨在教育年轻人（Zichermann\
  \ & Cunningham, 2011）。\n\n当代游戏化的形式与数字技术的认可以及社交媒体紧密相关。数字和移动技术为生活的游戏化提供了许多可能性。为了界定这一现象，明确“游戏”和“玩”等概念至关重要，这些概念是游戏研究的核心。《游戏人》（*Homo\
  \ ludens*）一作者 Leyden J. Huizinga 将游戏定义为一种完全有意识地处于“普通”生活之外的自由活动；它是“非严肃的”，但同时能让玩家强烈且完全地沉浸其中。这是一项与物质利益无关的活动，从中无法获得利润。它在自己固有的时空范围内，按照固定的规则以有序的方式进行（1938\
  \ [1950], p. 13）。\n\n这种对游戏的理解进一步被 Roger Caillois（1958）所发展。在《游戏与人》（*Les jeux et les\
  \ homines*）中，他区分了游戏（play）和竞赛（games），将后者描述为形式上是自由的、在时间和空间上分离的、不确定的（过程无法确定）、无产出的活动，并受不同于普通生活的规则和逻辑支配（cf\
  \ Bateson, 1972）。很容易发现，Huizinga 和 Callois 对游戏和游戏的经典概念化在解释许多当代游戏形式方面力不从心。例如，许多“严肃游戏”意味着具有产出的活动；有些游戏和电子游戏并不受严格意义上的规则支配（cf\
  \ Rodriguez, 2006）；而“玩游戏没有利润”的观点是有争议的，因为正如后后将进一步讨论的那样，人们可能会为了钱、社会资本、奖品和其他各种奖励而玩游戏。\n\
  \n与其试图定义游戏和玩，游戏研究领域较近的贡献更倾向于将它们视为文化形成形式，例如游戏文化（cf Ash & Gallacher, 2011; Mäyrä,\
  \ 2008; Shaw, 2010; Steinkuehler, 2006）。通过这种方式，游戏化可能被视为游戏文化在日常生活中的逐步渗透。正如 Palmer\
  \ 和 Petroski（2016）所强调的，游戏化并不一定意味着去玩游戏；相反，它涉及到将游戏思维或游戏机制嵌入购物、消费、健身、学习或工作等日常活动中，以使这些实践更具吸引力和/或更有效率，特别是通过助推（nudging）用户。\n\
  \n“助推”的概念源于行为经济学，并由 Thaler 和 Sunstein（2008）推普及。根据他们的观点，人们的行为可能由开发“选择架构”所驱动，这意味着塑造人们做出决策的背景。选择架构是不可避免的，因为选择总是以局部和情境的形式呈现和构建的；因此，助推意味着改变这些架构，以便“以可预测的方式改变行为，而不禁止任何选项或显著地改变其经济激励”（Thaler\
  \ & Sunstein, 2008, p. 6）。其目标是鼓励对社会和个人都有有益的行为和决策，例如以可持续和健康的方式行事或参与公民生活。\n\n选择架构可以通过塑造信息的呈现方式、修改城市设计、定义默认选择或通过各种非物质奖励激励人们来被操纵。后一种情况与游戏化特别相关，因为适当的行为可能会获得外在奖励（与游戏设计相关：勋章、奖杯、奖项、等级、得分、积分、任务、测验、排行榜和其他“代币”）、内在奖励（隐含在玩的过程中，如通过打破记录获得自我价值和精通游戏）以及社会奖励（如通过社交媒体自恋式展示结果和表现）。\n\
  \n正如预期的，游戏化元素（和游戏）已应用于公民生活和规划领域，特别是为了助推协作、参与和审议（Lastowka & Steinkuehler, 2014）。Lerner（2014）认为，当民主以一种寓乐的方式设计时，民主参与最有可能发生。事实上，游戏可能有利于参与、合作、决策和妥协。例如，通过将政治决策转化为游戏，可以纳入那些对政治和城市问题没有特定技术知识的人。当然，重点不是将一切都变成游戏，而是在规划系统中加入寓乐的元素，以助推有效的参与和兴趣，许多城市实验室进行的实验和倡议证明了这一点，例如墨西哥城的\
  \ *Laboratorio Para La Ciudad*、爱尔林的 *The Studio*、波士顿和费城的 *Offices of New Urban Mechanics*、哥本哈根的\
  \ *MindLab*、旧金山的 *Office of Civic Innovation* 以及新加坡的 *Human Experience Lab*。这些包括参与式预算的游戏化、公共空间的集体设计以及其他许多规划领域（Ampatzidou,\
  \ Bouw, van de Klundert, de Lange, & de Waal, 2015; Gordon, Haas, & Michelson, 2017;\
  \ Schouten, Ferri, de Lange, & Millenaar, 2017）。\n\n此外，几个城市机构正在推动旨在创建“趣味城市”（*playful\
  \ cities*）的倡议，旨在产生或允许游戏和玩精神的空间（Alfrink, 2014）。数字技术可能为城市趣味性的异质实验提供新的可能性；例子包括基于增强现实技术的各种形式的“泛在游戏”、动员游戏的商业应用程序如\
  \ *Foursquare*，以及旨在建立人与城市空间之间新联系的艺术和技术实验（Nijholt, 2017）。\n\n### 成为什么游戏的一部分？\n\n\n\
  \n\n\n正如章节开头所预期的那样，游戏化可以作为一种治理技术被部署，而“说服系统”这一表达在软件设计语言中十分流行并非巧合（参见 Bogost, 2014）。通过提供奖励、积分和图表，游戏定义了“恰当”和“不当”的行为，从而将“好”的和“坏”的公民/用户主体化了。测量、图表、积分、虚拟奖杯和排行榜的计算技术为每个用户分配了一个位置，将其转化为可评估和可计数的单位。新自由主义理性引导了通过游戏化构建触发的绩效和竞争机制，在用户群体内部构建了一个分级的社会结构，并让用户/玩家承担起责任以实现结果和表现（Berry,\
  \ 2012; Rey, 2014）。\n\n事实上，游戏化通过设定定义良好的规则，并利用源自电子游戏文化的状态条、进度条和其他表征工具对用户表现进行持续量化，简化了现实和日常生活的复杂性。因此，我们被微妙地要求衡量自己的生产力、健康和福祉，并被隐含地要求在医疗保健、教育、可持续发展等方面进行自我表现和管理。作为提供个人数据和量化表现的交换，用户获得了一种参与感作为奖励。\n\
  \n同时，游戏实现社会目标并引发社会变革和进步性力量的潜力不容低估。情境主义运动（1957–1972）的例子具有代表性，它旨在通过融合游戏、自发性和批判性思维来动摇和批评高级资本主义及其相关文化，最终赞扬了游戏的革命性潜力，允许对预设常规之外的公共空间进行重新占有、重新利用和重新配置（Andreotti,\
  \ 2000; De Certeau, 1980; Lefebvre, 1968）。在近期，学者们分析了与智能技术和公民黑客相关的各种游戏化实践（Ampatzidou\
  \ et al., 2015; Corsín Jiménez, 2014; de Lange, 2015）。从这个意义上说，与其批评游戏化本身，尝试描绘通过公民生活游戏化可能实施的不正义形式可能会很有趣。以此此为目标，哈维（Harvey）提出的六个命题可能提供一些坐标。\n\
  \n### 第一条命题：劳动剥削\n第一条命题涉及最小化对劳动动力的剥削的需求。在这个领域，游戏化似乎是危险且微妙的，它是剥削数字劳动力的一项强大技术。将工作变成游戏是一种有效的策略，全球公司的人力资源部门已完全承认了这一点（Bogost,\
  \ 2014 讽刺地将游戏化称为“剥削软件”/exploitationware）。通过用没有意义价值且无需实质性投入的虚构奖励取代工人和客户的“真实”激励，游戏化允许了对廉价劳动力的新形式剥削，这种剥削被称为“游戏工蜂”（playbour）。\n\
  \n这可能是通过游戏提供数据工作的情况。² 但还有更多：通过模糊工作与娱乐的边界，游戏化不仅将工作变成了一种游戏性活动，还把游戏变成了生产性工作（Rey, 2014）。例如，社交媒体通过在用户个人资料中引入进度条、“点赞”和“分享”按钮以及用于衡量用户帖子和互动的相关系统，连接各种外部游戏化应用（如\
  \ `Nike+`），以及专门设计用于在社交媒体内运行的社交游戏的出现，可以说已经被游戏化了。\n\n### 第二条命题：边缘化与包容\n其次，规划本身必须面对边缘化。游戏化可能允许对“边缘”主体产生有趣的包容形式，正如本开头提到的儿童示例。同时，它也可能产生其他形式的边缘化。正如\
  \ Isin 和 Ruppert (2015) 所强调的，公民应对数字技术有多种方法，而“拥有”技术和“不拥有”技术者之间的旧二元对分法对与数字公民相关的复杂立场格局提供了一个部分视角。数字技术在生产游戏化公民的过程中，可能会决定新的排斥形式。例如，某些主体可能没有能力或意愿被重构为数字公民和数字玩家。许多人由于不同原因没有\
  \ Facebook 或 Google 账号。很可能阶级、财富、性别和种族的问题强烈影响了参与数字公民项目和参与公民游戏的态度。因此，很难想象公民生活的游戏化将是一项普遍包容的活动。\n\
  \n### 第三条命题：赋能与自我表达\n关于社会公正的第三条命题涉及赋能和参与自我表达的能力。目前大多数游戏化实验在这一方面并没有特别帮助，因为参与通常是以一种非常编码化和预包装的方式（即，可能只能以软件设计者设定和编码的方式表达观点和立场），因此似乎几乎没有自我表达的空间。\n\
  \n此外，公民与游戏化环境（以及泛指数字技术）之间不断演变的关系正在赋能和社会立场之间产生巨大的鸿沟：一方面，少数具有技术技能的公民似乎有能力修改软件代码、操纵游戏并以创造性和游戏化的方式使用游戏化环境；另一方面，许多人——可以说是是大多数人——仅仅以准被动和预包装的方式体验游戏化参与，转变为\
  \ Gabrys (2014) 所说的 `模糊个体`（ambividuals），例如，作为计算机化环境的表达的易受体主体。这增加了另一条思考线，即质疑是否可以将游戏化身份化视为文化帝国主义的问题。\n\
  \n### 第四条命题：文化帝国主义\n游戏化确实是一种由公司和机构实施的治理技术，它通过数字身份的扩张化来引导用户并提取其数字劳动力，但这只是故事的一部分。需要考虑的是，游戏可能允许替代性的方式，并在这一意义上，进步性的游戏化具有解放性的作用。Ahwaa\
  \ 提供了一个例子，它是一个开放平台，利用游戏化机制（例如自定义头像、评分系统和解锁功能）来保护并参与社区。⁴ Ahwaa 的游戏化空间代表了异性恋规范社会中的一种“围墙社区”，这种社会倾向于边缘化、污名化甚至压制非霸权性的性倾向。\n\
  \n### 第五条命题：社会控制\n第五，哈维认为规划本身必须寻求非排斥性和非军事化的社会控制。游戏化（不像电子游戏，参见 Ash & Gallacher, 2010）显然与军事力量联系有限，但它与社会控制有很大关系。一方面，数字游戏由算法组成，利用数据来源开发有效的互动（O’Donnell,\
  \ 2014）；另一方面，游戏化与监控之间的关系并不那么简单，因为可以提到反监视的例子。例如，在 `CCTV Treasure Hunt` 中，参与者必须在城市中搜寻并拍照；用户产生的数据随后被映射以使摄像头可视化。⁵\
  \ 在柏林，一种名为 `Camover` 的更激进的游戏要求破坏摄像头⁶\n\n### 结论\n游戏化可能因此变得具有颠性和反霸权。最后，根据哈维的观点，政策实践必须考虑社会项目的生态后果。当然，游戏化可以以可持续的方式引导行为，而且有无数绿色游戏化的例子。例如，TerraCycle\
  \ 是一个门户计划，为个人、企业和组织提供通过收集和发送垃圾来获得 TerraCycle 积分的机会，这些积分可以兑换为向慈善或非营利组织的捐。⁷回收获得积分，并通过品牌赞助的比赛获得额外积分。TerraCycle\
  \ 出于 2001 年，是一家初创企业，现在已成为在网络上被誉为生态资本主义和伦理商业典范的公司，目前运营于 20 个国家。2011 年，它与游戏开发公司 Guerillapps\
  \ 合作推出了一个名为 `Trash Tycoon` 的 Facebook 游戏。该游戏通过商业和非商业组织的广告以及使用虚拟货币产生利润；10% 的利润将捐赠给\
  \ Carbonfund.org。像 TerraCycle 这样的绿色游戏化可能有趣且有用，但值得注意的是，它支持对可持续性非常狭隘的理解，这种理解以一种适应并驯化该概念的方式不仅没有威胁资本主义，甚至在鼓励它。\n\
  \n\n\n\n\n\n目前，在中国至少有八套社会信用体系在运行，这些系统根据行为进行评分（Liang, Das, Kostyuk, & Hussain, 2018）。其中主要的两个由两家巨型公司运营。\n\
  \n一个是`Sesame Credit`（麻白信），由阿里巴巴集团的关联公司开发的私有信用评分系统：它使用来自`Alibaba`的数据，客户会获得与其社交媒体互动和购买行为相关的评分。另一个由`Tencent`（腾讯）运营：它通过结合与社交关系、消费行为、财富等各种子类别的子分，给出从\
  \ 300 到 950 不等的评分。\n\n这种奖励机制产生了实际效果：例如，某些中国公司不再要求高分个人在租赁自行车、汽车和公寓时缴纳押金。以类似的方式，申请签证的办证也会变得更容易，因为高信用分的人被认为“财务上是可靠的”。⁸\
  \ 在一些中国在线约会网站上，分数也会显示出来。\n\n中国政府目前允许私营公司开展试点计划，旨在将成功的系统整合进一个统一的“社会信任”系统，以对公民进行评分并使分数公开。在正义和社会控制方面的潜在后果可能是巨大的，而且很容易想象这将进一步改变公民的自我治理。事实上，分数较低的人将因“公民身份糟糕”而“有害”——例如，因为驾驶不当、在禁区吸烟或在网上发布虚假新闻——因此他们可能被排除在公共场所、好工作、豪华酒店、高级餐厅之外。\n\
  \n这些中国示例的意义并不是为了预测一个乌托邦式的未来。相反，其目标是指出，在日常生活中存在无数游戏化的例子，而新技术仅仅是在扩大游戏与生活之间的联系。虽然传统上生活领域与游戏领域的划分很难追溯，但随着游戏机制（ludic\
  \ mechanisms）在日常生活（包括公民生活）日益扩散，这种划分现在变得更加困难。\n\n通过动员哈维（Harvey）关于社会正义的观点，本章建议从几个理由要审慎对待游戏化，因为在游戏化旨在引导积极和包容行为的同时，它可能会产生新形式的不公正。如果游戏化将代表空间和关系生产与体验中的一种新力量，那么城市研究无疑需要对游戏化的政治进行批判性分析和严肃反思。\n\
