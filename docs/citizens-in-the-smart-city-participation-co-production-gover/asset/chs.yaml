  \ by design)。O'Reilly Media.\n\n\n\n\n\n# 第 5 章\n\n## 数据化城市的权利：城市数据公地的界面化\n\nMichiel\
  \ de Lange \n\n### 摘要\n\n当前城市的数据化引发了对于列斐伏尔（Lefebvre）及其许多追随者所说的“城市权利”的思考。在本文中，我研究了将数据用于公民事务如何可能加强“数据化城市的权利”，即不同人群参与和塑造城市生活与文化的程度，以及对所有权的体验。**公地**（the\
  \ commons）的概念作为一个棱镜，用以观察数据如何服务于围绕集体性问题培养这种参与式的“智能公民身份”。本文批判性地探讨了近期将城市理论化为公地的尝试。该研究并非将城市作为一个整体视为公地，而是提出了一种更精细的——“作为接口的公地”（commons-as-interface）视角。认为，“作为接口的公地”通过翻译和集体化的过程，有效地将城市数据与“城市权利”所蕴含的人类政治主体性联系起来。该术语被应用于三个短篇案例研究，以分析这些过程如何产生“数据化城市的权利”。文章最后探讨了关于数据在智能城市中作用的两种看似对立的话语之间的联系——控制论视角与人文主义视角。建议“作为接口的公地”允许对数据、人类参与者与城市问题之间的中介过程进行更详细的研究。*关键词*：智能城市；数据化城市；城市公地；界面化；所有权；城市权利；作为接口的公地；翻译；集体化\
  \ \n\n### 引言：数据化城市的权利？\n\n（大）数据的扩散正推动着一项旨在改进智能城市管理的科研与设计议程（Kitchin & Perng, 2016）。其关键挑战之一是，确保这些数据在实践中不仅是促进少数人的利益，而是促进全体人民充分参与城市生活与文化的集体利益（Shaw\
  \ & Graham, 2017）。换句话说，城市的数据化引发了对“所有权”（作为一种非法律化的管理方式）的重新思考，或者正如列斐伏尔及其许多追随者所说的“城市权利”（Brenner,\
  \ Marcuse, & Mayer, 2012; Harvey, 2008, 2012; Lefebvre, 1996; Mayer, 2009; Mitchell,\
  \ 2003; Pugalis & Giddings, 2011; Soja, 1989）。¹对数字媒体在城市领域兴起的理论化导致了人们对列斐伏尔整体著作特别是“城市权利”的重新关注，一些作者将城市本身视为公地（例如，Huron,\
  \ 2017; McCullough, 2013; McQuire, 2016; Ramos, 2016; Stavrides, 2016; Teli, Bordin,\
  \ Menéndez Blanco, Orabona, & De Angeli, 2015）。例如，Foster 和 Iaione (2016, p. 288)\
  \ 指出：城市是一个公地，意义在于它是一个属于所有居民的共享资源。因此，公地的主张与“城市权利”背后的理念高度契合——参与城市创造的权利、参与塑造居民生活的决策过程的权利，以及居民对我们共同拥有利益的集体资源做出决策的权力。同样，Stavrides\
  \ (2016, pp. 1–2) 在关于城市公地的著作中询问，“当代城市居民是否在当前的城市秩序形式中、往往是反对这些形式发现了占有自己城市的机会，去创造甚至重新发明基于合作的共享空间和居住实践？”在本文中，我研究了数据如何可能加强“数据化城市的权利”。公地的概念允许我探索数据如何服务于围绕集体性问题培养更具参与性的“智能公民身份”，这一层次迥区别于公共和私有领域。Foster\
  \ 和 Iaione (2016, p. 335) 为“城市协作治理”辩论，其意思是允许人们像管理公地一样管理他们的城市。在这种场景下，他们认为政府将成为一个促进者，而不是固守于“命令与控制”的治理体系。这凸显了数据化智能城市中的张力。一方面，城市正在成为新的政治权力中心，拥有强大的领导力和各种新技术，支持通过数据和仪表板实现集化远程控制的高效管理目标（Bettencourt,\
  \ 2014; Kitchin, Lauriault, & McArdle, 2015; Mattern, 2015; Medina, 2006; Perez\
  \ & Rushing, 2007）。另一方面，一个新兴的群体和组织领域正在产生并开放数据以推进集体目标并赋能公民。这是“公民媒体”或“公民技术”领域更广泛发展趋势的一部分，这些术语已获得一定关注，用指媒体技术培养参与的潜力（Gordon\
  \ & Mihailidis, 2016; Schrock, 2016）。这一议程试图反驳或补充数据驱动的智能城市愿景中迄主导地位的效率修辞。关于城市数据的现状和设计项目正从关注个人或单一方使用（例如企业、政府）转向更具集体性的利用数据潜力的方式（Teli\
  \ et al., 2015, pp. 17–18）。公民数据的承诺在于它有助于解决城市面临的一些复杂问题（Ciuccarelli, Lupi, & Simeone,\
  \ 2014; Flowers, 2013; Goldsmith & Crawford, 2014; Goldstein & Dyson, 2013; Kitchin,\
  \ 2014; Townsend, 2013）。公地的概念经常被提及或暗示，作为通过城市数据化来实现规范化控制的主导叙事的对立面。诸如“数据公地”（Cuff,\
  \ Hansen, & Kang, 2008）、“知识公地”（Hess & Ostrom, 2007）、“网络化公地”（Paul, 2006）、“基于公地的同类生产”（Benkler\
  \ & Nissenbaum, 2006）、“数字公地”（Teli et al., 2015）、“信息公地”（Boyle, 2008）、“环境公地”（McCullough,\
  \ 2013）等术语表明，数据是为集体问题（包括我们城市的未来）做出决策的潜在价值的新资源。理想情况下，这涉及到拥有所有权感并利用数字媒体进行自我组织的社区，这被被称为“平台合作主义”（Scholz\
  \ & Schneider, 2016）。在简要讨论并进一步落实与数据化城市相关的公地概念后，我提出了“作为接口的公地”这一术语，以将城市数据与“城市权利”所蕴含的人类政治主体性联系起来。随后，该术语被应用于三个短案例研究，以分析“数据化城市的权利”，随后进行讨论。\n\
  \n城市公地，数据公地\n\n\n\n\n公地（commons）被理论化为`goods`（货物），即集体管理的资源；为`systems`（系统），即用于集体自我组织和治理的制度化规则与条件集合；以及为`practices`（实践），即“共有化”（commoning），即（再）产生资源管理的实际社会互动。²传统上，“公地”一词指的是有限且具有竞争性的资源，例如牧场，这种资源很难免受所谓的“搭便车者”侵害，因此如果没有妥善管理，就会面临枯竭的风险（Hardin,\
  \ 1968）。针对哈丁关于为了避免“悲剧”公地必须由国家控制或进行私有化的断言，奥斯特罗姆（Ostrom）证明了“公共池资源”（CPOs）是可以由集体机构进行可持续治理的系统（1990）。对于\
  \ Harvey (2012, p. 73) 而言，公地不是一个实体，而是“一个特定的自定义社会群体与其其实存在或尚未创建的社会和/或物理环境中那些被认为对其生命和生计至关重要的方面之间一种不稳定且可塑的社会关系”。公地通常位于公共（国家）与私有（市场或个人）之间，处于自我组织集体的层面（参见\
  \ Harvey, 2012, pp. 72–74）。在城市研究背景下，公地与空间圈地和社会孤岛倾向相对对立，从国家垄断到城市空间和基础设施的商品化（例如，Foster\
  \ & Iaione, 2016; Stavrides, 2016）。关注公地如何帮助概念化和分析“数据化城市的权利”？虽然将城市概念化为公地是一个很有吸引的想法，但我们必须根据当前城市生活的数据化对其进行批判性审查。Foster\
  \ 和 Iaione 关于城市是居民资源的建议引发了一些棘手。首先，这种权利*对谁*有效，谁被排除在外了？这种“所有权”仅适用于定居居民吗？流动人口呢：游客、移民、旅行者、外籍人士、访客、外国企业家，甚至在世界遗产城市的情况下是指全球人类？从时间角度来看，老居民是否比新来者更多权利？永久所有权是否优于临时使用？我们看到城市公地似乎倾向于所有权的“定居形而上学”（Cresswell,\
  \ 2006, pp. 26–27）。还存在将城市生活视为封闭居住生态系统的容器观的风险。由于今天许多城市已成为全球化的媒体城市，由“全球本土化”的数据流和混合的时空移动性定义，关于城市公地规模和边界的问题以及围绕所有权的摩擦变得特别具有挑战性。其次，城市资源化暗示了一种功能性的城市生活观。正如哈丁经典的牧场比喻，城市应该被负责任地使用而非过度使用。显然，城市不是草地。城市也是非功利文化“剩余”的场所：创新与浪费、愉悦与情感、偏离与越界、（集体的）审美体验以及遭遇差异。有趣的是，大的）城市数据也被通过其“剩余”来理解，其巨大性和不可读性超过了人类的认知能力（Tenney\
  \ & Sieber, 2016, p. 106）。作为货物以及在话语中，城市数据是过剩的。大数据带来了巨大的希望。³ 然而，似乎缺乏有意义的接口，让人们通过公正治理的系统和公平共有化的实践与数据化的城市互动。第三，将整个城市概念化为公地是一种全能性的过度简化，忽略了更细粒度、差异或嵌套的公地形式。随着围绕城市数据化产生的新货物、系统和实践，这变得尤为紧迫。例如，犯罪数据在作为货物的价值、制度化治理以及它所需和产生的社会实践方面，与清洁空气完全不同。沿着这条线，Shaw\
  \ 和 Graham (2017, p. 920) 建议，如果技术和资源的自我管理针对“更小、更具体的生存空间和人类关系的点的密度”，而不是追求涵盖一切的“新维基百科”，基于\
  \ ICT 的共有策略可能更有效且可行。同样，Kitchin 和 Perng (2016, p. 3) 警告说，如果不对代码和数据视为更广泛的社会技术组合的一部分，可能会发生“恋物化”。市政开放数据平台已经启动，为解决数据的公民使用提供涵盖性框架。这通常与黑客松相结合，结果不尽如意（Maalsen\
  \ & Perng, 2016）。在我看来，这表明了一方面大数据仓库的一一切切模型与应用程序竞赛的零和博弈，与另一方面集体性、摩擦性且混乱的“生活化”城市问题之间的概念性错配。总之，我提出的数据化城市公地视角强调了智慧城市中数据所有权的张力。它不仅关注数据化城市的单一货币使用价值，还关注了文化和体验。此外，它特别敏锐于强调具有争议的集体问题。这种对公地的理解扩大了我们对数据作为比喻的\
  \ 21 世纪“石油”的经济方面的狭隘关注，转向了数据作为不同人们参与公共和集体问题权利之间“润滑剂”的多样方式。⁴\n\n### 作为接口的公地\n\n\n\n\
  \n那么，我们如何才能将城市数据与“城市权”所蕴含的人类层面政治主体性联系起来？我们又如何将城市数据与人类经验领域以及集体政治行动的能力连接起来？在我看来，这些都是与数据进行有意义的“接口”（翻译，translation）以及与共同城市问题进行“集体化”（collectivization）的问题。人与数据之间的接口关乎于找到一种用于翻译的共同语言和交换区域。与问题之间的接口则是关于寻找某种方法让这些问题向人们发声，并创造集体意识和行动。\n\
  \n我建议，“作为接口的公共体”（commons-as-interface）这一概念允许我们处理数据、问题与人如何恰当地相互对话。“接口”一词在*抽象上*（in\
  \ abstracto）一直被概念化为通过传输、通信或力量等过程同时连接两个或多个元素，并阐述它们独特的身份，同时在此过程中往往让自己变得隐形（Drucker,\
  \ 2011; Galloway, 2012; Hadler, 2018; Hookway, 2014）。这与 Stravrides (2016, pp. 4–5)\
  \ 将公共体概念化为“阈值”有着惊人的相似之处，这些阈值连接并分离并创造了进入和离开的条件。在对“信息化的城市权”的讨论中，Shaw 和 Graham (2017,\
  \ p. 908) 使用了类似的词汇来描述城市生活的现状，认为“城市社会现在在物质上是作为网络化信息循环的函数而产生的——这一点由入口和出口定义。”\n\n因此，我主张，“作为接口的公共体”运作于此类阈值之上，即信息与物质之间、数据与城市问题之间、国家、市场与个人利益之间，以及飞地社区与大众之间的入口和出口点。`Translation`（翻译）涉及将一个领域的逻辑转化为另一个领域可理解的内容。`Collectivization`（集体化）是围绕争议性的“关注事项”形成群体的过程，这种过程发生在一个事物变得社会化，或者社会化变成一个事物时（Latour,\
  \ 2005, pp. 114–120）。在下面的案例中，我们将更详细地看到这种情况是如何发生的，例如当数据的“过剩”与具体的日常目标相关联时，当定量的变为质性的时，或者当抽象的变为具体的，反之亦然时。\n\
  \n尽管“接口”一词带有某种技术性的——甚至可能是“管理性”的色彩，但我认为权力关系和政治是“作为接口的公共体”这一理念的核心。数据化城市权面临的一个主要挑战是为边缘化群体发声。正如\
  \ Chandler (2015, pp. 841–842) 指出的，大数据只能帮助更好地管理已经存在的东西。因此，大数据可能无法赋予那些最需要实际社会变革的人权力（参见\
  \ Tenney & Sieber, 2016, p. 106）。在主导的技术和政策叙事中，城市数据表现为一种通过数字进行的理性管理形式，科技公司为市政府提供数据和决策的计算工具（Goldsmith\
  \ & Crawford, 2014）。\n\n相比之下，对城市数据的更批判性的视角倾向于关注纪律工程和横向控制机制，或者关注公司逻辑——在这些逻辑中，信息排名产生了新的不平等和不公，而过滤和优先处理则破坏或削弱了政治遭遇和异议的潜力（Shaw\
  \ & Graham, 2017, p. 913）。在我看来，对公共体的关注允许对“数据化城市权”产生一种更肯定的观点，而不是纯粹的对立性视角（后者的视角将数据行动主义视为政治异议或反公司主义，讽刺的是，这种观点仅仅重新确认了现状）。⁵“作为接口的公共体”不仅反击了现有的国家或企业叙事，还产生了新的替代方案。它在翻译和集体化的过程中推进了对城市问题非排他性“所有权”的程序化理念，这些过程在连接的同时的同时也阐述并尊重差异。公共体还连接了一方面的将平台、代码和数据视为霸权技术的政治经济学视角，以及另一方面的关于参与式媒体、共享经济、开源和公民技术的\
  \ DIY 用户实践的、有时过度乐观且去政治化的描述（参见 Kitchin & Perng, 2016, p. 11）。\n\n### 接入数据化城市\n\n\n\
  \n\n\n为了证实“作为接口的公体”（commons-as-interface）为利用数据促进“城市权利”提供了一个富有成效视角，我讨论了来自荷兰三个案例。每个案例分别支撑了公体的一个维度（物品、系统、实践）。\n\
  \n### 数据作为公共物品：Verbeterdebuurt\n\n在社区平台 `Verbeterdebuurt` 的案例中，将数据理解为公共物品意味着数据是能够被集体“所有”并增加价值以支持或维持所关注事项的资源。如前提到的，数据是更大型社会技术装体的一部分，涉及代码、算法、平台、协议、治理结构等。\n\
  \n`Verbeterdebuurt`（`www.verbeterdebuurt.nl`，“改善社区”）是一个平台，允许用户报告城市公共空间的问题并贡献构想，同时将其与当地市会联系起来。该平台的灵感源于英国的\
  \ `FixMyStreet` 项目，但它希望让人们也能贡献想法，而不仅仅是投诉。该界面使用专有的 `Google Maps` 后端作为地理空间画布，通过浏览器或移动应用程序投放标标记问题和想法。该平台还可以嵌入到地方当局的网页或其他社区网站中。\n\
  \n不同的数据输入以地图上相当直观的图标形式出现：红色大头表示已报告的问题，黄色灯泡表示一个想法，绿色旗帜表示已解决的问题。在我进行的一次采访中，该平台的一位创始人讲述了两个来自霍霍恩（Hoorn）小城的男孩的故事，他们希望在社区里建一个滑板公园。他们最初向地方当局提出的直接请求未得到响应。随后，他们在平台上发起了一场活动并收集了\
  \ 200 份支持签名，结果市政府确实在他们的社区内建造了一个滑板坡。\n\n在这一贡献的背景下，我认为这个故事是关于公共物品的生产的。男孩们成功地产生了一种社会“货币”，即一个量化且可见的支持者人数，为社区提供了价值。问题的数据化使得群体的愿望能够被*翻译*为一种量化的社会选民群体，从而施加政治力量，这种方式类似于拉图尔（Latour,\
  \ 1990）对酒店钥匙上的重量进行的早期行动者网络分析，后者翻译了经理希望将钥匙归还到前台的愿望。\n\n数据化也有助于*集体化*（collectivization）：围绕争议产生一种亚文化，即个人共同拥有的某种爱好缺乏共享空间。通过自生成的数据条目（对想法的支持），这种相当松散且空间分布的亚文化在平台上以一个群体的形式变得可见。这导致了地方当局与公民之间关系的重新调整。这个轶事案例的一个启示是，数据起到了微小但具有决定性的作用。决定性，是因为数据允许了\
  \ Teli 等人（2015, p. 20）所说的“递归性参与”（recursive engagement），即“公众维护允许其作为公众存在的基础设施的能力”。如果没有这些数据，就不会有一个可以用来建立公众的“物”。这个公共*物品*由一个数字/物质的混合体组成：集体愿望、平台上一个被钉住的灯泡、量化的支持展示、一份签名列表、一项正式决定、一个滑板坡以及一个滑板手社区。\n\
  \n另一个尝试性的见解是，公体可以嵌套在封闭式平台内部。我并没有简单地将封闭和开放式平台视为不可通约的，而是认为在在这种情况下，当公体成为私人、社区和公共利益之间的接口时，它会发生溢出。\n\
  \n### 数据作为公体系统：Geluidsnet\n\n`Geluidsnet`（`www.sensornet.nl/english`，“噪声网”）于 2003\
  \ 年启动，是一项公民驱动的倡议，旨在测量史基霍尔机场周围的噪声污染。当时媒体对于密集（城市）地区的噪声污染存在很大争议，关于是计算好还是测量好，由哪一方进行计算或测量，以及可行性和负担能力。\n\
  \n史基霍尔机场的 `NOMOS` 系统将测量与计算模型相结合，每年发布四次数据。`Geluidsnet` 的启动初衷是根据他们的话，为这些讨论提供一个更具“事实性”的基础。他们在私人公民和愿意贡献/赞助的市政当局屋顶设立了\
  \ 25 个测量点。这个分布式噪声测量网络使用了相当廉价的认证麦克风、运行开源操作系统 `Free BSD` 的服务器、一个中央服务器，以及在格罗宁根大学开发的专有音频分析软件，最终成本比史基霍尔的\
  \ `NOMOS` 系统便宜得多。\n\n这套设置通过地图界面在他们的网站上收集并显示 `dB(A)` 单位的飞机产生的实时噪声，根据其中显示的 `dB(A)`\
  \ 测量值周期性地闪烁绿色、黄色、橙色或红色点。`Geluidsnet`成功将噪声污染这类抽象问题翻译出来，并通过数据可视化使其具体化。硬件、空间节点、数据与软件、维护、机构支持、议程设置和公共传播策略的建立了一个公体*系统*，在噪声污染问题、量化数据可视化、当地居民的真实体验及其相关情感与公共政策之间提供了持续的翻译。该项目成功让公民和市政当局作为一个整体参与了一个他们之前感到无助的问题（关于希思罗机场的类似案例参见\
  \ Nold, 2016）。该倡议产生了公共影响，影响了国家任命的“飞机噪声”委员会的议程和建议。该委员会的职责延伸到了涵盖噪声建议。\n\n### 数据作为公体实践：Datudio\
  \ Eindhoven\n\n`Datudio Eindhoven` 的案例说明了产生社区建设并将问题扩大到更大或新选民群体的数据公体实践。将这些装体理解为公体系统（传感器网络案例），强调了新机构的形成，利益相关者进入了新的相互关系。\n\
  \n`Datudio Eindhoven`（`www.datudio-eindhoven.nl/en`）是埃因霍文市政府和建筑设计与电子文化学院 `Het Nieuwe\
  \ Instituut` 的一项倡议，围绕“智能城市”的数据化对于那些不属于技术尖端的人意味着什么而展开。在探索阶段，项目发起者在 Woensel 住宅区的一个公园里扎了营。通过这些采访和随后的讨论，项目聚焦于他们所谓的“数据荒漠”：难以用数据捕捉的城市问题。挑战变成了开放那些未数据化且相当隐形、但具有巨大社会影响的问题（如孤独），并让它们变得公开讨论。\n\
  \n在下一阶段，由 Dan Hill（Arup Digital Studio）领导的工作坊开发了设计概念，将社会数据与城市规划联系起来。一个拟定的结果是 `Roomsel\
  \ Noord` 项目，这是一个社区领导的平台，将拥有房屋的孤独老人与寻找灵活空间的年轻自由职业者联系。尽管这仍然是一个假设性的、可能是方案导向的建议，但我对整个项目感兴趣的在于，它基于一种信念：真正顽固的社会问题通常不会配有完美包装的数据。在我看来，这个项目试图将“公体化”一种大部分在门后发生的现象，这种现象往往被公共专业人员（社会工作者、住房公司、市政府、医疗保健）所垄断。公体实践涉及将一个无形的私人问题*翻译*为一系列公共社交互动和讨论。这需要对人员、地点和问题的长期参与，从街头采访到设计干预工作坊再到展览。它通过*集体化*，将该问题与当前的发展联系起来，即把越来越多的社会福利任务交给地方市政府，而另一方面又寄希望于看着公民自救。问题的公体化为公民提供了一个接口，让他们开始讨论此类问题、他们与其他利益相关者的关系，并主张他们对数据化城市的权利。\n\
  \n\n\n\n\n# 讨论：从“数据驱动”到“数据赋能”的城市权利\n\n有人认为，智能技术倾向于促进技术官治统治和“新管理主义”（Kitchin et al.,\
  \ 2015, p. 14），而不是真正的城市政治。我们不断被告知，数据渗透到我们生活的方方面面，并引导我们解决各种问题。得益于我们对世界的大型数据驱动的认知，地图确实可以成为领土。\n\
  \n本研究尝试探索另一种关于数据和集体城市问题的叙事，这种叙事不是 `data-driven`（数据驱动的），而是 `data-enabled`（数据赋能的）。我们关注的不是对“功利性”基础设施的集体管理（例如水水、废物、能源管理；围绕食品生产、住房或保险的合作项目），而是与“城市权利”相关的摩擦性社会文化问题：拥有一个用于共同爱好和生活方式的空间、生活质量和环境正义，或将孤独等问题公共化。\n\
  \n我认为，在这些案例中，问题、数据与参与者情感体验之间的鸿沟通过“公用社”（the commons）连接起来，公用社被理解为一种良、一个系统和一种实践。在这些情况下，数据既不是巨大的，也不是主导性的，也不非常壮观或性感。相反，它们是大型“装配”中那些不起眼的辅助“行动者”，这些装配涉及人员、问题和数据的网络，通过这些网络来协商他们的城市权利（Latour,\
  \ 1990, 2005）。\n\n这一探索留下了许多问题，例如：数据公用社的治理/治理；城市数据中的偏见、社会分类和“碎片的公众”；多样性以及为弱势群体发声；以及公用社框架的局限性，以及社区目标与公共价值观之间可能的冲突。\n\
  \n我在这里将限制在一个具有启发性的观点上。通过数据与智能城市的接触经常被描绘为一系列对立术语：自上而下与自下而上、被动与主动参与、企业与公民、封闭与开放可访问，以及专家生产者与业余用户（见\
  \ Tenney & Sieber, 2016）。在这样的框架下，我观察到，关于数据在智能城市中作用的话语存在着一种更根本的分裂：控制论视角与人文主义视角。\n\
  \n一方面，数据被认为是控制论智能城市自动化和管理的构建区块。在这种观点下，数据服务于后人文主义的论点，例如算法民主作为一种更公平、更公正的治理类型（例如 Hughes,\
  \ 2018）。另一方面，数据被视为人文主义理想的 de，这种理想是位于审议和理性主体中的、信息充分的公民。在第二种观点中，“真正的参与”涉及个人不受限制地访问数据、积极且自愿地为公民事务贡献数据，并利用数据进行民主决策和行动。\n\
  \n讽刺的是，将这些观点联系在一起的是对数据的共同认识论式美化——将数据视为透明信息（无论是系统还是人）的前身，以及关于“全知的完美完成时”这一旧理想的最新化身。在这两类数据驱动的话语中，中介界面消失了。然而，在我们上述的案例中，我们看到数据不仅是信息对象，而且是同等的表演性对象，具有实现新现实的权力（另见\
  \ Kitchin & Perng, 2016; Verhoeff & Wilmott, 2016）。\n\n我建议未来的研究可以对“数据赋能的公民参与”发展观点，这些观点对于机器与人类能动性或自上而下与自下而上的区别应该更加中立，而是研究数据、人类行动者和城市问题如何在网络中汇合，这些网络连接并构成了在对齐共同利益和/或阐明争议的意义上的“政治性”。公用社可以作为此类连接过程的启发式工具。因此，数据化城市的权利与其说关于丰富和透明度，不如说关于强度：即数据影响人们产生对城市共同所有权的感觉并据此行动的程度。\n\
