  \ 1991–2006. doi:10.1080/0042098050018.\n\n\n\n\n\n# 第 12 章\n\n## 挪用“大数据”：探索南非开普敦公民组织数据策略的解放潜能\n\
  \nNancy Odendaal\n\n### 摘要\n南非市政府的智慧城市策略根植于发展主义，寻求利用技术力量改善治理。德尔班和开普敦等城市已接受了以基础设施为导的方法，试图通过国家调控的宽带“骨干”建设，实现边缘社区的最后一公里信息通信（ICT）接入。随着大数据的到来，ICT\
  \ 与地方政府领域的参与者范围扩大，涵盖了与跨国 IT 公司和管理顾问建立伙伴关系，以简化市政官僚程序、实现数据处理并提高效率。一个重要的驱动因素是，加速基本服务交付的需求日益迫切，同时也通过提高效能来鼓励投资和发展（例如在处理开发申请方面）。一种“仪表城市主义”（dashboard\
  \ urbanism）正变得显现，这与嵌入管理型南非地方政府体系的指标和绩效监控系统高度契合。过度依赖这些定量层面的危险在于，它可能会加剧这个世界上最不平等城市之一的鸿沟。基于探索性研究，本章探讨了公民组织如何使用策略来挑战“仪表城市主义”的假设，并对大数据做出更全面的挪用以及更深层次且具语境的城市体验。`关键词`：智慧城市主义；技术挪用；数据行动主义；全球南方；开普敦\n\
  \n### 引言\n21 世纪 20 年代初南非最初的数字城市浪潮，恰好契合了地方政府的重组。该国后种族隔离时代的景观充斥着重建话语，对国家能够实现更具包容性和代表性的城市充满信心。考虑到国家动荡的历史，对社会正义的关注是恰当且可以的。20\
  \ 世纪 80 年代后期，城市成为反对种族隔离国家（往往是暴力的）斗争的战场，重点主要集中在倾斜的基础设施所代表的物质不平等上。因此，在 21 世纪 20 年代初，新成立的市政府不仅将精力集中在服务交付上，而且数字革命被视为通过负责任且透明的更高效地实现这一目标的手段（Odendaal,\
  \ 2003）。智慧城市的话语充满了发展主义的热情。目前在东南亚、印度和非洲作为智慧城市被推销的去语境化新城视觉叙事（Datta, 2015; Watson,\
  \ 2014）并未在南非落地。大数据的到来和算法处理能力的凸显，使许多文献焦点转向了数据。在南非背景下，有两个维度具有意义（我认为这在全球范围内也有共鸣）。一个是基于证据的政策制定这一持续趋势与开放数据可用性，以及愿意通过收费为市政府包装处理能力的企业部门之间的混淆。数据驱动的城市主义趋势源于全球对服务交付和政治问责的需求（Kitchin,\
  \ Lauriault, & McArdle, 2015）。第二个动态与在经济和空间上被边缘化的社会群体持续的不满有关，社交媒体成为组织和动员的手段。与通常的线下活动机制相结合，用于信息传播和宣传的数字媒体军库已很好地服务于南非城市的社会正义（Mitchell\
  \ & Odendaal, 2015; Odendaal, 2015）。在其他地方，我曾探讨过这两种动态，它们代表了后种族隔离国家向往的数字共识与边缘混乱民主运作之间的紧张关系（Odendaal,\
  \ 2015）。在本章中，我将深入探讨我所认为的治理话语知识领域的转变。通过探索开普敦数字信息驱动的社会行动主义图景，我旨在揭示数据挪用的表演性及其对包容性治理的影响。\n\
  \n### 数据对比知识，向更具社会正义的智慧城市迈进\n\n\n\n\n大数据时代为基于证据的规划和政策制定提供了更详尽的技术基础。利用基准比较（benchmarking）来监控进展并实现知情决策是新自由主义治理的逻辑延伸。管理主义和新公共管理（NPM）在数字时代治理（DEG）时代被认为是过时的，但许多业务规划和监测实践仍嵌入在组织中，以实现对持续问责的追求（Dunleavy,\
  \ 2005; McLaughlin, Osborne, & Ferlie, 2002）。城市们利用仪表板、指标和基准比较来报告性能、提供健康状况快照（Kitchin\
  \ et al., 2015），这与问责制、透明度和效率的概念高度契合。\n\n虽然人们倾向于对大数据时代似乎影响着数字时代治理（DEG）的技术决定论感到感叹，但\
  \ McLaughlin 等人（2002）通过多个国家案例表明，嵌入式的政府实践与实现更开放、更不复杂的制度结构的数字化愿望并存。鉴于审议民主的复杂工作以及对符合情境的解决方案解决的需求，技术上的“修复”是不够的（Kitchin\
  \ & McArdle, 2016）。在治理空间对问责和预测性的持续追求中，数据呈现在其选择呈现作为某地“知识”的信息中具有特殊的货币价值。\n\n向更敏捷、更具响应性的服务交付持续演进是数字时代治理的愿景，但无法否认指标和数据驱动呈现的政治“作用”。尽管仪表板旨在反映某一时刻的“我们所处”，但其呈现仍然具有选择性，且往往经过了主题化的包装（Kitchin\
  \ et al., 2015）。主题的选择和指标的划分取决于数据应该为谁服务。通过指标了解复杂的城市并将其复杂性汇总成一个“快照”，是科学理性化和客观化的极致（Kitchin\
  \ & McArdle, 2016）。\n\n数字不是中立的，产生仪表板的计算过程同样如此。算法是生产性的，通过抽象和预测的过程，通过建模和计算将更主观的目标馈入其中（Leszczynski,\
  \ 2016）。将碎片编码并包装成“金句式”格式的行为具有表演性。最终，数据与可识别的主体/客分离，被剥离了语境，使算法治理能够产生主体和空间（Leszczynski,\
  \ 2016）。指标是人类和非人类能动性的“汇集”，而非客观的“真理”（Kitchin et al., 2015）。\n\n将复杂的关系简化和过度简化为可管理的变量使城市去语境化，并假设不同地区之间具有可复制性。城市（及国家）之间的基准比较与管理治理以及城市持续的“世界化”具有可比性（McCann,\
  \ Roy, & Ward, 2013）。然而，它面临复制不考虑地点独特性的预设城市“解决方案”的风险。渗透政策流动性的“剪贴”城市主义得到了大数据的支持。结合纵向分析，它假设模式和趋势可以通过重点干预进行引导，未能识别需要关注的长期系统性城市过程。\n\
  \n国际发展机构利用数据基准比较和数字治理来追踪全球南方的进展，这在被视为“边缘化”的背景下具有特殊意义。在基多通过 Habitat 3 通过的《新城市议程》（NUA）是寄予数字希望的晶化案例。其重点是城市作为机会和连接之地，在关系上相互连接，因此在相互学习的追求是可以比较的。可持续发展目标（SDGs）及相关指标假设了一个普遍且可量化的规范基础，而关于南方城市主义的日益增长的文献强烈表明，比较性努力与北方关于“良好城市”的规范性建构紧密相关（Barnett\
  \ & Parnell, 2016）。\n\n实现包容性和公正性城市的全球及国家系统性限制与历史和地点紧密相连，正如 Maria Kaika（2017, p.\
  \ 6）所说：过去的失败使我们变得更加精明、更有学识。它们也应该让我们变得足够聪明，不再声称全球社会环境平等、社会福利或价值创造可以被简化为指标。\n\n就本文而言，核心问题是数字在透明治理的名义下所起的“掩盖”作用。指标和相关的基准信号了对“什么重要、什么不重要”的共识——即可以被视为进展的指标。而“异议”信号可能更擅长通过对冲突的洞察来捕捉“哪里不起作用”（Kaika,\
  \ 2017）。通过关注缺失的内容，聚光灯可以照射在城市系统的失灵上，让裂痕显现。\n\n例如，阿拉伯之春说明了信息通信技术（ICT）的表演维度。在埃及和突尼斯的，社交媒体在起义前影响关键辩论发挥了重要作用，并在演示期间及之后协助将民主信息传播到国之外（Howard\
  \ & Hussain, 2011）。ICT 是更广泛异质网络的一部分，包括电视和广播，并建立在现有的社会和亲缘资本之上（Allagui & Kuebler,\
  \ 2011）。媒体的力量不再仅仅掌握在国家手中，使得分布式声音和视觉内容可能挑战官方叙述。凝聚对立力量的危机时刻也可以激活南非人类学家 Steve Robins\
  \ 所称的“慢速行动主义”（2014b）。在挑战开普敦市亲贫困服务主张的社会运动中，他探索了新媒体与可追溯到种族隔离斗争的社交网络连接的结合使用，以实施持续的反对声音，并将关键社会正义问题保留在公众想象中。\n\
  \n### 数据征用的表演性与解放性工作\n\n\n\n\n\n通过计数和量化对城市生活进行客体化，在制定政策目标和集中规划精力方面发挥着重要作用。社会组织越来越多地利用数据来挑战政策话语（Odendaal,\
  \ 2015），通过记录实践让“不可见”的（非正式的、边缘化的）群体变得“可见”（Hagen, 2010），利用人口普查实践进行自我认同和可见的赋权（Baptist\
  \ & Bolnick, 2012），并激励跨尺度的社会行动（Kellogg, 2016）。\n\n社交媒体实现了连接与传播，通常支撑着这些“异议实践”，而这些实践是城市边缘生活的“活态指标”（Kaika,\
  \ 2017）；也是蕴含在这些异议实践中的真正的解决方案和真正的社会创新。它们是表演性的指标，反映的是缺失了什么，而非现存什么。将数字反过来运用是引发关于城市生活核心问题辩论的策略之一。\n\
  \n上述工作具有重要的解放特质；数字的力量具有双向作用——既可以支持国家也可以反对国家。然而，问题仍然在于这是否能被视为知识生产。要从数据向知识生成的转变，不仅仅是关于谁“让数字跳舞”，而是话语和公众想象的转变。媒体的联网化和连结能力为跨地方的行动主义和知识交换提供了机会；这可以被称为“知识密集型”城市主义，以区别于技术驱动的、企业的智慧城市倡议（McFarlane\
  \ & Söderström, 2017）。\n\n在这里，数据采样、收集、处理和表征的行为与其所运用的手段同样重要：它们是征用行为。在跨组织和地理边界使用和交换这些信息以构建交换网络，例如在国际贫民/窟民地组织（SDI）全球范围内非正式定居点居民权利的全球行动中具有尤为重要的意义（Baptist\
  \ & Bolnick, 2012）。\n\n权力在于数据的生成和交换。然而，要创造一种针对数据媒介的政策视角和官方叙事的替代性话语，需要持续的社会行动来转变叙事，将注意力集中在系统性问题上。异议提供了一个观察系统性不等的窗口（Kaika,\
  \ 2017）。理解这种异议的支架，即其传播和表征的手段，可以为知识生产策略提供洞察，使我们对城市生活的表征更加准确。它需要对技术的征用，但也意味着政策话语的一种愿景式转变。\n\
  \n此外，我认为，它还涉及在共享中传递一种经验维度，以唤起情感共鸣。与“冷酷、硬的事实”不同，使用奇观或对“日常”苦难的戏剧性描写等策略可以触及公众想象。Robins（2014b）记录了开普敦广为人知的“粪便抗议”，在现场（除其他公共行动外），活动人士将人类废物倾倒在开普敦国际机场的候机厅，以引起人们对城市边缘非正式定居点恶劣卫生条件的关注。\n\
  \n在这里，信息通过视觉媒体传输，通过 `hash-tagging` 来实时链接事件并吸引主流媒体的注意力。奇观的力量在于将问题提升到政策话语的高度。“在‘厕桶战争’之前，非正式定居点令人震惊的卫生状况很少进入主流媒体或国家政治话语”（Robins,\
  \ 2014b, p. 480）。\n\n还有一种必要的“慢火”：连接人与技术的“拼贴”，以此向国家施加改变压力。重要的是，使知识网络得以的工作维持了一种与国家所代表的完全不同的持续性替代方案。那种工作，即\
  \ Robins（2014a）所说的“慢速行动主义”，建立在跨越时间和地理边界以及政治经济的联盟基础之上。在南非，在反种族隔离行动主义期间建立的关系现在以新的形式表现出来。这在很大程度上是通过自由新闻和允许社会组织行动主义的背景实现的。在在不产生后果的情况下无法进行此类组织的地方，数字媒体实现跨地理网络关系的能力是有意义的。\n\
  \nKellogg 对古巴博客 `Voces Cubanas` 的研究反映了叙事技术在“赋能形成关系和建立联盟的节点……方面的作用……在网络内部，叙事技术允许与其它行动者建立新的关系”（2016,\
  \ p. 44）。技术发挥的作用与人类能动性共同作用，构成了联盟建设和网络构建的一部分。不仅在 Kellogg 探讨的古巴案例中，以及在 Robins 对南非的研究中，它挑战了国家对知识的控制，还产生了“替代性的话语空间和颠覆性叙事”（Kellogg,\
  \ 2016, p. 23）。它是表演性的也是经验性的。\n\n奇观的力量在于它能唤起一种留存在公众想象中并具有政治价值的情感共鸣。持续联网和动员的“慢火”的影响在于，它不断构建着替代性叙事。Kellogg\
  \ 从社会技术的视角审视他在古巴的工作，写到了贡献网络的异质行动者，他们使网络成为“赛博格实体，异质技术-社会元素的稳态装配，具有多孔的边界和激进的政治动机”（2016,\
  \ p. 33）。在这里，以博客形式产生的书面叙事是一个具有活性和流动性的行动者，可能塑造政治话语。\n\n“赛博格”主题作为一种整合并超越由生物学塑造的身体生理边界的实体，为理解数据媒介的行动主义提供了一个有框架。`algorithm`、人类与城市空间之间的亲密交换意味着个体的重新组装包含了人类与机器、自然与技术的元素（Asenbaum,\
  \ 2018）。在思考技术媒介行动主义的要素时，通常的“二元对立”——自然与技术、身份与匿名、公共与私人——被重新配置了。“随着私人领域渗透公共空间，一方面的理性、客观性和冷静的政治，与另一方面的情感、激情和情感之间的分离被重新配置了”（Asenbaum,\
  \ 2018, p. 5）。\n\n### 案例研究与结论\n问题在于，这些聚集仅仅是关注特定情境的转瞬即逝，还是代表了一种认识论的转变，即城市数据的经验和情感维度可以改变公众话语，或者说从本质上改变什么是知识和真理？以下来自开普敦的案例将探讨这种赛博格行动主义的功能。\n\
  \n\n\n\n\n# “夺回城市”：赛博格行动与内城政治\n\n\n\n\n\n“开普敦是世界上隔离最严重的城市，”这是在考虑该市在极端城市贫困背景下作为国际旅游目的地的地位时经常听到的一个论调。这句话是“收回城市”（`RtC`）运动经常使用的口号，该运动于\
  \ 2016 年 2 月成立，其明确目的是反对开普敦市政府（`CoCT`）那些固化空间种族隔离的政策（[www.reclaimthecity.org.za](http://www.reclaimthecity.org.za)）。\n\
  \n该运动源于 2015 年底对一处公有土地的拟议出售，该土地位于大西洋海岸`Sea Point` 区的一处名为`Tafelberg` 的旧学校所在地（这是一个位于海滨的高密度、中高收入、混合用途社区；距离中心商务区约\
  \ 3 公里）。这一公开广告引发了`Sea Point` 国内务工和低收入者的动员并抗议，他们认为市应该履行其既定的政策意图，在市中心优越公有土地上提供社会住房。当地民权非政府组织（NGO）`Ndifuna\
  \ Ukwazi`（`NU`）在物流和组织上支持了这一运动（[www.nu.org.za](http://www.nu.org.za)）。\n\n`RtC` 运动随后演变为包含两个活动。第一个是继续向市政府施压，要求在\
  \ Sea Point 以外的市中心州土地提供负担住房。第二个是针对`Woodstock` 绅士化社区（同样靠近市商务区）租户家庭被驱逐后的后续行动，要求`CoCT`在该地区提供临时住宿（[www.reclaimthecity.org.za](http://www.reclaimthecity.org.za)）。\n\
  \n这两项活动在规范上具有重要意义，并反映了国际城市趋势。开普敦在其空间发展框架中包含战略愿景强烈支持市中心加密化（南非城市以蔓延扩张闻名）和种族融合，但同时也受到房地产市场趋势的影响。其在种族隔离后对空间整合的关注在很大程度上受到机构重组和复杂的国家住房政策的阻碍，这些政策限制了优位置社会住房的交付（Turok\
  \ & Watson, 2001）。最近，该市对国际房地产资本的吸引力增加了中心位置土地的市场价值，并导致了市商务区边缘原低收入社区的绅士化。由于空间计划未能充分考虑市场趋势和房地产动态，市政策的既定意图与实际交付之间的差距不断扩大（Odendaal\
  \ & McCann, 2016）。\n\n该运动在持续的记录与法律工作，以及数字增强的公共活动与干预之间摆动。利用“奇观”（spectacle）通过个人分享来建立情感连接，是该运动公众形象中的一个重要元素，并从本质上定义了它的起源。该运动的口号“土地属于人民而非利润”在\
  \ 2016 年 3 月 1 日首次抗议游行后，很快成为`Sea Point`公共空间中熟悉的特征。在`Tafelberg` 场地的持续抗议通过社交媒体得到了加强。其一个显著特点是对比涉及出售交易的关键人物进行个人化处理：省级省长`Helen\
  \ Zille`；第一位审理`NU`挑战该场地出售案案件的法官；`RtC` 运动的领导人；国家人类定居点部长`Lindiwe Sisulu`，以及开普敦市政府（`CoCT`）城市发展的市委员会成员`Brett\
  \ Heron`。与社交媒体一样，话语有时会变得令人不安的个人化，但成功创造了传达家庭反绅士化斗争以及房地产资本愚行所需的叙事线索。\n\n*地方*的重要性是`RtC`活动的核心，这不仅是因为该运动本身的空间关注，还因为那些与家和身份密切相关的故事。媒体和社交在线平台使用图片散文和个人故事来关注家庭斗争，而社交媒体的联网能力则被用于将分散的叙述在主题上连接成一个整体叙事，以挑战房地产投机的市场逻辑。新媒体的联网能力也被用于创建一个标签门户——这是一个在线“地方”，各种声音可以在此围绕该运动中的特定时刻/事件汇集一堂。\n\
  \n由于`RtC` 推动的公众压力，`Tafelberg` 场地的出售被暂停。随后，对建筑提案的呼吁深化了该场地建设社会住房在技术上的可行性，最终提案目前正在谈判中。然而，最初导致该运动产生的系统性问题仍需解决，而最初对这一处场地出售的抗议已变成了一场持续的运动，要求将中心位置的公地重新分配用于社会住房。在这里，`RtC`\
  \ 活动家通过随后对市内两栋空置公共建筑的“象征性占领”，进一步推进了运动的体验维度¹\n\n这些物业的位置具有重要意义。一个位于维多利亚和阿尔弗雷德水岸（`Victoria\
  \ and Alfred Waterfront`）边缘，这是一个混合用途购物区，结合了高端住宅开发和酒店。该区最新的最受关注项目是由位于伦敦的`Heatherwick\
  \ Studio`对谷仓进行的改造，其中包括一家豪华酒店和 2017 年开放的`非洲当代艺术博物馆`（`MOCAA`）的所在地。第二个场地占领位于`Woodstock`，是一座靠近定义该社区绅士化的画廊、餐厅和设计街的的空置医院。\n\
  \n对场地的选择具有战略性，但也表明了将焦点放在已定义开普敦的空间悖论上的价值。这在社交媒体上分享的图表和地图选择中、对城市繁华与边缘人物苦境形成对比的视觉描绘以及个人故事中显而易见。最近，焦点已转向`AirBnB`\
  \ 在市的扩张以及短期租赁的分布。\n\n\n\n\n\n### 结论\n\n利用数据来支持市场层面的“合乎逻辑”，以及数字如何以经济表现之名反映“进步”，这在城市发展中并非新鲜事。在南非的城市中，在为了实现空间整合而进行的市场干预与吸引投资之间一直存在着紧张关系。数字所发挥的规范性和政治作用、对市场“真相”的去语境化呈现以及通常随之而来的对比分析，都是技术创新与治理框架汇点的征象。在南非，仪表盘城市主义（dashboard\
  \ urbanism）与管理型地方政府体系相契合，方便地利用指标语言支持市场主导的城市主义，尽管政策话语声称并非如此。RtC（Right to City）案例的意义在于，它说明了数字增强行动主义的混合性，及其在应对城市趋势时的内在灵活性。城市贫困的经验维度与为该运动主张提供进一步合法性所需的定量工作被描绘在一起。这些赛博格混合体（cyborg\
  \ hybrids）的灵活性反映了当代城市主义的浮现性和具身化特征。将城市生活的经验维度纳入知识领域，不仅为数据驱动的仪表盘城市主义提供了一种替代方案，更扩展并深化了城市政策的话语版域。在某些方面，它与城市本身并没有太大区别：略显混乱，有时会误导，但真实的，且可能比数字所声称的更接近真相。\n\
  \n### 致谢\n\n本章的初稿受邀于 2017 年 9 月在梅诺斯斯（Maynooth）举行的“智能城市权利：公民身份、公民参与、城市公地与共创”研讨会上提交。对实现这种互动以及本章后续完善提供的资金支持和编辑协助表示深表感谢。\n\
