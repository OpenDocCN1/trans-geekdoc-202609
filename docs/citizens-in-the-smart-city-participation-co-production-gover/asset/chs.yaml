  \ S. Willis` 是英国普利茅大学艺术、设计与建筑学院助理教授。她的研究兴趣包括智能城市、数字技术以及空间/场所的作用。她与 Alex Aurigi 合著了《数字与智能城市》（*Digital\
  \ and Smart Cities*，Routledge 2017）。\n\n# 第一章\n\n## 公民身份、正义与智能城市的权利\n\nRob Kitchin,\
  \ Paolo Cardullo Cesare Di Feliciantonio\n\n### 摘要\n本章介绍了智能城市，并从批判性社会科学的角度对其理念和理想进行了探讨。在简述了智能城市的出现和当前关键辩论后，我们注意到与公民身份、社会正义和公益相关的若干需要审查的实践、政治和规范问题。本章其余部分将为探讨这些问题提供初步框架。\n\
  \n\n\n\n自 20 世纪 50 年代数字计算诞生以来，城市与数字化之间变得日益紧密。起初，计算机用于存储和处理城市管理事务，被录入 `Supervisory\
  \ Control and Data Acquisition (SCADA)` 系统以监控和控制公用事业及其他基础设施，并在学术界和政策领域用于土地利用和交通场景的建模。到\
  \ 20 世纪 60 年代后期，控制论网络 |\n| 领域 | 内容 |\n| :--- | :--- |\n| 交通 | 智能交通系统、一体票务、智能旅行卡、共享单车、实时乘客信息、智能停车、物流管理、交通应用、动态道路标志、移动出行应用、共享拼车服务\
  \ |\n| 能源 | 智能电网、智能电表、能源使用应用、智能照明 |\n| 垃圾 | 压缩垃圾箱和动态路由/收集 |\n| 环境 | 物联网传感器网络（例如：污染、噪声、天气、地壳、防洪管理）、动态响应干预（例如：自动防洪设施）\
  \ |\n| 建筑 | 建筑管理系统、传感器网络 |\n| 住宅 | 智能电表、App 控制的智能电器、数字个人助理 |\n\n*来源*：Kitchin (2016)。\n\
  \n## 批判与重构\n\n从诞生之初，智能城市的概念就一直受到持续批判，主要涉及其以下方面：\n- 将城市框定为系统而非场所；\n- 采取技术解决方案主义的方法；\n\
  - 实施技术官僚化的治理形式并重塑了治理术；\n- 促进了城市服务的公司化和私有化；\n- 优先考虑利益相关者的价值观和投资；\n- 加剧了不平等；\n- 产生许多与监控、预测性画像、社会分层和行为助推相关的伦理问题；\n\
  - 可能在关键基础设施中制造安全漏洞（见 Datta, 2015; Greenfield, 2013; Hollands, 2008; Kitchin, 2014;\
  \ Mattern, 2013; Townsend, 2013; Vanolo, 2014）。\n\n在本书中，我们特别关注与公民身份、社会公正和“城市权利”问题相关的批判，以及创建智能城市的驱动如何影响普通公民的生活。我们的关注点并非提出一个简单的“反对智能城市”的论点；毕竟，数字技术已经广泛地交织在城市的运作和日常生活中，并产生了许多积极和令人享受的效果。事实上，用\
  \ Althusser (1971) 的话来说，这些技术是“诱惑性的”，承诺了自由与选择、便利、生产力、优化和控制（Kitchin & Dodge, 2011）。然而，诱惑可能是一个面纱，掩盖了新自由主义化和剥夺性积累更广泛的议程和过程，从长期来看可能会使公民处于不利（Leszczynski\
  \ & Kitchin, 在押）。\n\n相反，我们寻求“重构、重新想象和重造智能城市”（Kitchin, 2019, p. 219），将其作为一个解放性的和赋能的项目，一个造福于所有公民而不仅仅是特定选择群的项目。这种重新构想包括进一步强调智能城市的政治和伦理，并超越其知识社区和倡导联盟所再生产的主导性后政治框架；以彻底政治化的方式重新构想“智能”公民身份，以及智能城市努力的宗旨和意识形态。这意味着不仅仅是在常识性、理所当然、务实和实践层面指出需要以公民为中心或公正的智能城市，而是要具体地概念化这些概念包含的内容，以及如何通过操作它们来转型智能城市。这涉及到开始处理一系列相关问题，例如：\n\
  \n* 公民在智能城市中是如何被框定和概念化的？\n* 公民预期如何在智能城市中行动和参与？\n* 公共空间和城市公共资源在智能城市中是如何框定和监管的？\n\
  * 可以形成什么样的公众？他们可以采取哪些行动？\n* 智能城市方法和系统的伦理影响是什么？\n* 不公正现象在多大程度上嵌入了城市系统、基础设施、服务以及它们的计算实践中？\n\
  * 智能城市主义内部（再）生产了哪些不平等的系统和结构？\n\n\n\n- 阶级、种族主义、父男主义、异性恋规范主义、残障歧视、年龄歧视、殖民主义的形式在多大程度上上得到了再生产？\n\
  - 智能城市中实施了哪些公民模式？\n- 智能城市中运行着什么形式的正义？其影响如何？\n- 这些公民和正义模式是由谁在什么条款下被构想和执行的？\n- 我们想要什么样的智能城市主义？我们想要创造并生活在什么样的智能城市中？\n\
  - 我们如何才能超越新自由主义的智能城市？\n\n在本章的剩余部分中，我们将结合新兴的文献，并与后续章节建立联系，为开始思考并回答上述一些问题提供一个框架。我们将讨论分为了五个部分。\n\
  \n在下一节中，我们将详细阐述智能城市的主导性新自由主义框架和实施，以及这种运作如何促进资本和国家权力的利益并重塑治理术。随后，我们将详细说明一些与智能城市技术和倡议相关的、更令人困扰的伦理问题。在第三部分中，我们将考察目前为止公民和公民身份在智能城市中是如何被构想和执行的，并接着对社会正义与智能城市进行讨论。在最后一部分中，我们提出了“智能城市权”的概念，并论证这应该是智能城市建设的基本原则。\n\
  \n### 资本、权力与智能城市\n\n\n\n\n大量研究从理论和实证角度挖掘了资本与权力如何驱动城市化进程，并再生产城市的社会空间结构与关系。这些工作关注资本积累的循环、新自由主义、帝国主义、殖民主义和民族主义的运作，以及身份政治在塑造全球城市状况中的发挥作用（例如：Castells,\
  \ 1977; Harvey, 1973; Massey, 2007; Robinson, 2005）。\n\n批判城市理论认为，城市“被雕塑并不断重组，以增强资本的获利能力”，因为它们是“商品生产、流通和消费的主要基地”，同时其本身也被高度商品化了（Brenner,\
  \ Marcuse, & Mayer, 2012, p. 3）。这种形状和重点的持续演变通过既得利益集团、社会力量和政治意识形态的冲突而发生，并受到不稳定性、多次挫折和危机的制影响（例如：过度积累、贬值），但在城市发展策略中，无情地优先考虑交换价值（以利润为导向）而非使用价值（对基本需求的满足）（Brenner\
  \ et al., 2012; Lefebvre, 1996）。换句话说，资本主义下的城市是为了一小少数拥有并控制生产手段的精英阶层的利益而运作，并再生产不平等以及社会和空间划分（Harvey,\
  \ 1973; Sassen, 1991）。\n\n### 作为积累策略的智能城市\n\n从这个视角来看，智能城市是利用和重新配置城市作为一种积累策略的最新尝试，形成了一种技术驱动的创业城市主义版本（Hollands,\
  \ 2008; Shelton, Zook, & Wiig, 2015），私人利益通过这种方式寻求：\n* 深化新自由主义政治经济，通过为城市问题提供技术解决方案来捕获公共资产和服务；\n\
  * 利用金融化来获取并榨取，或破坏并替换私人基础设施和业务；\n* 促进当地经济发展并吸引外商直接投资；\n* 推动房地产投资；\n* 建立新自由主义政府性与治理的架构。\n\
  \n通过这些策略，智能城市实施了新一波“通过剥夺进行积累”（Harvey, 2008）和“资本主义圈地”（De Angelis, 2007），这对公民的生活产生了重大影响。在捕获公共资产方面，城市管理部门面临压力，要求利用行业内的专业能力来制定“智能”城市政策，并通过公私合作伙伴关系、租赁、去监管化、市场竞争以及私有化来交付技术驱动的城市服务（Shelton\
  \ et al., 2015）。\n\n人们认为，在管理城市的尖端理念和系统方面，城市落后于技术曲线。它们缺乏核心技能、知识、资源和能力来解决紧迫的城市问题并维护关键服务和基础设施，而这些正从社交和技术层面上变得日益复杂，需要多层次的专家干预（Kitchin\
  \ et al., 2017a）。\n\n在这种心态下，公共部门的角色是充当经纪人而非服务提供者，智能城市部门负责获取初始专业知识并建立伙伴关系。同时，公司寻求：\n\
  * 捕获私人基础设施和服务并榨这些资产的价值，试图通过减少维护和长期投资，并根据用户的支付能力收取最高可承受的价格来提取价值（Morozov & Bria, 2018）；\n\
  * 或者通过提供新的技术赋能平台来破坏现有的公共和私人服务及其监管与劳动关系——例如，`Uber` 和 `Airbnb` 挑战传统的出租车和短期住宿市场。\n\n\
  在在这两种情况下，智能城市的努力都是更大项目的一部分，即城市资产（如物业、基础设施、公事业、服务）通过金融化被捕获和利用（Christophers, 2011;\
  \ Moreno, 2014）。\n\n### 全球倡议与园区\n\n除了让城市本身成为一个市场之外，新自由主义智能城市是一个明确的经济项目，旨在吸引外商直接投资，培养创新的本土初创部门或数字枢纽，并吸引移动的创意精英。世界各城市创建了“智能区”，将城市的一个区域指定为公司试点新技术的测试场（Evans,\
  \ Karvonen, & Raven, 2016; Halpern, LeCavalier, Calvillo, & Pietsch, 2014）。\n\n\
  在英国，商业、创新和技能部资助了智能城市计划，旨在将英国定位为智能城市咨询和技术的领先出口国（Taylor-Buck & While, 2017）。在欧洲范围内，欧洲城市与社区创新伙伴关系（`EIP-SCC`）资助了智能城市项目，其影响的一个关键衡量标准是在公共服务交付中吸引大量的私人投资，并减少“技术和财务风险，以增强投资者投资进行大规模复制的信心”（欧洲委员会，\
  \ 2016, p. 111），以便最终“私人资本可以在较低的技术和财务风险接手进一步投资”（欧洲委员会， 2016, p. 108）。换句话说，创造新产品的风险被社会化了，以换取服务的私有化以及最终的利润。\n\
  \n### 房产驱动的发展与案例\n\n除了以城市为中心的经济发展外，智能城市已成为房地产驱动的发展的关键组成部分。在这里，智能城市技术是新房地产项目的核心特征，作为投资者和未来居民的吸引力，并为这些技术提供展示窗口。\n\
  \n最广为人知的此类可能是韩国的松岛（Songdo）。作为首尔大区的边缘仁川自由经济区（`IFEZ`）的一部分，松岛是 `2003` 年启动的大型开发。`IFEZ`\
  \ 是一项旨在推动增长和巩固韩国地位的经济发展计划（Carvalho, 2012; Shin, Park, & Sonn, 2015; Shwayri, 2013）。其他例子包括：\n\
  * 印度的智能城市开发（见 Datta, 2015）；\n* 阿联酋的马斯达尔（Masdar）（Cugullo, 2013）；\n* 纽约的哈德逊广场（Hudson\
  \ Yards）（Mattern, 2017; see Karvonen, Cugullo, & Caprotti, 2018）。\n\n在用于智能城市实践的区域（例如\
  \ `Living Labs`），它们作为创意阶层流入和留以及士绅化的门户（Cardullo, Kitchin, & Di Felicion, 2018）。\n\
  \n### 政府性的转向\n\n通过此类新的智能城市开发以及在现有城市中部署智能城市技术，政府性和治理模式正在发生转变，进一步深化了新自由主义项目。对于福柯（1991）来说，政府性是使社会可治理并使政府和其他机构实施治理的逻辑、理性和技术。对于许多分析师来说，通用计算、大数据和机器学习的数字时代正在改变管理和控制社会的方式。\n\
  \n观点认为，治理在本质上正变得更加技术官、算法化、自动化和预测化（Amoore, 2013; Kitchin & Dodge, 2011），使政府性从纪律性的管理形式（旨在聚集和惩罚违规者，并培养特定的习惯、倾向、期望和自律）转向社会控制，在后者的行为被显式或隐式地引导或推入。政府性不再主要是关于主体化（塑造主体和限制行动），而且关于控制（调节情感、欲望和观点，并在预设的行为规范内引发行动）（Braun,\
  \ 2014）。Vanolo（2014）将其命名为“智能政府性”（smartmentality），通过控制室和仪表板、智能电网和电表、交通控制室以及旨在调节行为并产生新自由主义主体的手机应用程序来实施（Kitchin,\
  \ Coletta, & McArdle, 2017b）。例如，正如 Davies (2015) 在提到 `哈德逊广场` 时指出的，作为一个充满传感器和嵌入计算的开发项目，居民和工人将被一系列互联系统在整个复合体内受到持续的监控和调节。结果将是一个具有众多重叠计算机制的量化社区，旨在产生某种社会和道德安排，而不是让人们规规服从。\n\
  \n\n\n\n\n# 伦理与智慧城市\n\n表 1.1 中详述的技术旨在管理和控制城市基础设施及服务。如上所述，几乎无例外，这些技术要么代表国家运行，要么为了产生利润而运行，并直接影响对社会的管理和监管。它们运行的一个关键方面是，它们产生、处理和提取价值，并对高度粒化且具有索引性（直接与人、家庭、物体、领土和交易相关）的大规模数据流进行采取行动（Kitchin,\
  \ 2014）。\n\n因此，智慧城市技术引发了许多涉及隐私、数据化、数据监控、地理监控、画像分析、社会分层、预测性治理和助推等方面的伦理问题，这些问题对公民的构想和对待方式产生了重大影响（例如，将其视为数据点、需要被积极管理和警察监管的对象或消费者），并可能导致不平等的产生和强化（Kitchin,\
  \ 2016; Taylor, Richter, Jameson, & Perez del Pulgar, 2016）。\n\n例如，一系列智能技术改变了地理位置追踪，侵蚀了移动隐私（Kitchin,\
  \ 2016; Leszczynski, 2017）。许多城市都布满了远程控制的数字 CCTV 摄像头，这些摄像头可以在人脸和步态识别软件的日益辅助下，追踪个人行人。大部分路网受到感应圈、交通摄像头和能够识别车辆的自动车牌识别摄像头的监控。在许多城市，传感器网络已部署在垃圾桶和路灯等街道基础设施中，用以捕捉和追踪如\
  \ `MAC` 地址之类的手机标识符。同样的技术也被用于商场和商店以追踪购物者，有时会与 CCTV 联动以获取年龄和性别等基本人口统计信息。同样，一些城市安装了公共\
  \ wifi 网格，它可以捕捉和追踪访问网络的设备 ID。许多建筑和公共交通系统都会监控用于进入这些的智能卡。\n\n智能手机不断向电信供应商提供其位置，要么通过它们连接的手机基站，要么通过发送\
  \ `GPS` 坐标，或者通过它们与 `wifi` 热点的连接。这种数据收集对隐私产生了深远影响，许多人认为隐私是一项基本人权。此外，智慧城市技术通过数据轨迹的共享和分析可能会产生许多其他隐私危害（Kitchin,\
  \ 2016）。\n\n数据经纪人的主要产品是对个人进行预测画像，关于他们可能的喜好以及可能购买的商品和服务、他们对企业的可能价值或重要性，以及他们的信用风险，以及他们支付特定价格或能够满足还款情况的概率。此类画像可能会产生“预测性隐私危害”（Baracos\
  \ & Nissenbaum, 2014; Crawford & Schultz, 2014），用于对人口进行社会分层和划线，筛选出某些类别以获得优先地位，同时边缘化和排除其他人。此外，此类画像还可用于对场所进行社会分层，以接受某些政策干预或营销，正如地理人口统计行业实践实践（Graham,\
  \ 2005）。\n\n通过位置追踪可以产生特定的预测性隐私危害。例如，显示某人经常出入同性恋酒吧的追踪数据可能会推导出该人可能是同性恋，如果这种信息被共享（例如，通过发送到家中的广告或通过社交媒体），可能会造成个人伤害。同样，与其他人的共同靠近和共同移动可能被用于推断政治、社会和/或宗教归属，可能揭示对特定组织的成员身份（Leszczynski,\
  \ 2017）。\n\n此类推断可能会产生不准确的描述，然后这些描述会贴在并先于个人。这导致了人们担心一种“数据决定论”正在兴起，其中个人不再仅仅是根据他们所做的事被画像、判断和对待，而是基于对他们可能做的事的预测（Ramirez,\
  \ 2013）。数据决定论在预测性治理的形式中表现得最明显，例如预测性执法，其中预测分析被用于评估可能的未来行为或事件，并指导采取行动（Goodman, 2015;\
  \ Harcourt, 2006）。许多美国警方部门现在正使用预测分析来预测未来的犯罪地点，并指导警察增加在该区域的巡逻。例如，芝加哥警方局使用逮捕记录、电话记录、社交媒体和其他数据来产生用于识别热点和引导巡逻的区域画像，以及识别这些热点内个人的特定画像（Jefferson,\
  \ 2018）。\n\n在这种情况下，一个人的数据影子不仅是跟踪他们，还先于他们。此外，许多警方部门已大量投资于新的“智能”指挥控制中心，这些中心采用增强且广泛的多设备监控（例如高清\
  \ CCTV、无人机摄像头、传感器、社区报告）来指导地面执法（Wiig, 2017）。此外，警方监控已知活动人士的通信，以试图预测和控制社会动荡（Paasche,\
  \ 2013）。换句话说，智能技术可以被用于压制异见并复制特定的政体。智慧城市技术、它们产生的数据以及应用于这些数据的分析因此对人们的日常生活产生重大的负面直接和间接影响（Kitchin,\
  \ 2016）。\n\n\n\n\n\n迄为止关于权力、资本、治理术和伦理的讨论揭示了智能城市中公民被界定的主要方式：作为数据点、目标受众消费者、用户、投资者、被分类的个体，以及受监视、受控制和受警示的主体。\n\
  \n在之前的一篇论文中，我们重新解读了 `Arnstein’s (1969)` 著名的“公民参与阶梯”，以考察在智能城市倡议中扮演的各种公民角色（参见 `Cardullo\
  \ & Kitchin, 2018a`）。我们发现，公民往往占据非参与性的、消费者型的或象征性的地位，并被框定在管理、技术官治、家长主义和市场的政治话语中，而不是作为活跃、投入的参与者——而智能城市的倡议本从权利、公民身份、公共利益和城市公地的角度来构想。公民应当被引导、助推和控制；他们可以浏览、消费和行动。如果有公民参与，它也是以参与者、测试者或玩家的形式存在，提供反馈或建议，而不是作为提议者、共同创造者、决策者或领导。\n\
  \n同样，`Cowley, Joss, and Dayot (2018)` 识别了四种“公共性”模式，指明了公民在智能城市中的定位：\n* “服务用户”：公民被界定为服务的消费者；\n\
  * “创业型”：公民被积极纳入共同创造和创新；\n* “政治型”：公民在决策和审议中发挥积极作用；\n* “公民型”：公民参与不直接面向市场活动的基层社区活动。\n\
  \n他们指出，不同倡议和城市之间的公共性存在显著差异，且大多数情况下偏向于“服务用户”。相比之下，`Shelton and Lodato’s (in press)`\
  \ 对亚特兰大智能城市计划的研究指出，虽然市政府和参加其活动的公司经常谈论建立一个以公民为中心的智能城市，但在实践中，公民被包含为两个“空空符号”——而公民本身被排除在政策制定领域之外（另见\
  \ `Datta, 2018`）。\n\n第一种是作为“普通公民”，这是一种看似同质的服务接收者或消费者的全能型社区。在这里，智能城市运行在管理框架（代表公民交付服务）和公民家长主义（为公民决定什么最好）之内，而不是让公民有意义地参与智能城市的愿景和发展。第二种是“缺席的公民”，指的是所有与“普通公民”具有不同身份、价值观、关注和经验的多元社区（普通公民很大程度上被界定为白人、男性、异性恋、身体健全和中产阶级），以及公民在智能城市策略和计划制定与实施过程中的缺失。\n\
  \n此外还可以增加第三种经常出现在其他智能城市文件和计划中的人物形象——“活跃公民”，这是一种通过黑客松和其他活动为社区发展构建公民科技的创业公民（`Joss,\
  \ Cook, & Dayot, 2017; Townsend, 2013`），但在任何城市中，这通常由少数人组成，他们在技术部门工作，并解决由赞助公司和政府提出的问题（`Perng,\
  \ Kitchin, & MacDonncha, 2018`）。\n\n然而，大多数智能城市倡议都声称“以公民为中心”或“以公民为核心”。这种话语意图与现实之间的脱节是由两个因素造成的。\n\
  \n1. 首先，那些被批评为自上而下、技术官僚特性的倡议，试图通过沉默反对者或将其纳入范围，同时通过将他们的努力重新品牌为“以公民为中心”来保持资本积累和技术官僚治理的核心使命不变（`Kitchin,\
  \ 2015`）。在这种情况下，“以公民为中心”很大程度上作为一个空空符号运作，通常呼吁公民参与或寻找“缺失的公民”，但保留了底层的新自由主义哲学和治理模式（`Hill,\
  \ 2013; Sartori, 2015; Shelton & Lodato, in press`）。\n2. 第二，旨在鼓励市政府建设智能城市的资助计划，例如欧盟委员会的\
  \ `EIP-SCC`，在结构上排斥了将公民纳入项目制定的严肃意图（`Cardullo & Kitchin, 2018b`）。汇集一份数百万欧元的投标书是一项耗时、复杂且很大程度上没有资金支持的任务，将“非专家”公民加入这一过程会产生巨大的额外开销。\n\
  \n这意味着，在大多数情况下，在考虑任何问题和事实解决方案之前，重点、目标和解决方案已经设定好了。\n\n\n\n\n\n### 社会正义与智能城市\n\n与公民身份以及公民的职责、权利和权利范围相关的是社会正义的概念，以及人们被预期和接受的对待方式以及他们生活的条件。社会正义涉及在特定情况下对人们的公平对待，以及人们应当如何行动（Smith,\
  \ 1994）。从广义层面上说，社会正义涉及道德和人权，其中权利是“嵌入在某种社会或制度背景中的义务，这种背景下的预期具有`道德`力量”（Smith, 1994,\
  \ p. 36）。换句话说，道德权利是我们作为社会成员身份所预的事物，例如言论自由、获得住房的权利、参加选举投票、获得完全法律救济、接受教育和医疗服务的权利等。然而，这些权利并非天生且不可剥夺的，而是往往受到社会成员的激烈争议、谈判或强加。正如\
  \ Barry (1989) 所指出的，社会正义理论是关于可以辩护的社会安排类型的理论。事实上，存在许多社会正义理论，每种理论都诉诸于不同形式的权威、逻辑以及生活中最重要的事物，并以此证明或挑战那些歧视、边缘化和排除社会某些成员的社会空间过程（Harvey,\
  \ 1996）。通常，社会正义理论分为四大类：分配性（公平份额）、程序性（公平对待）、报应性（对错误的公平惩罚）和修复性（纠正错误）（见 Sabbagh & Schmitt,\
  \ 2016）。在这里，我们想要结合智能城市来考虑前两种，尽管对这些方面的影响很大程度上取决于对错误行为的惩罚的管理方式：换句话说，如果智能城市倡议中对社会分类和红线政策（redlining）没有有效的制裁，那么关于分配和程序不公的道德论证将变得缺乏说服力。重要的是，一个人信奉哪种社会正义理论从根本上改变了其对公平和权利的理解，以及其可能认为什么是公正的智能城市。表\
  \ 1.2 概述了七种理论的主要原则，以及它们如何应用到数据监控、社会/空间分类、预见性治理和动态定价等差异化影响智能城市内不同公民群体的伦理问题中（关于城市和城市地理学的社会正义理论的更充分讨论，请参见\
  \ Harvey, 1973, 1996; Heynen, Aiello, Keegan, & Luke, 2018; Laws, 1994; Mitchell,\
  \ 2003; Smith, 1994）。表 1.2. 社会正义与数据驱动的伤害。\n\n| 社会正义理论 | 对数据驱动伤害的应用 |\n| :--- | ---\
  \ |\n| `平等主义（`Egalitarianism`）主张社会所有成员无论能力和继承如何，财富和权力分配应当平等 | 平等主义者会将数据驱动的伤害和差异对待视为对其平等原则的侵犯，并要求消除这些或在所有公民中使其效果相等\
  \ |\n| `功利主义（`Utilitarianism`）追求最大人的最大利益 | 功利主义者会将此问题视为为了更大的利益而必须解决的社会滋扰，因为它复制并加深了不平等及其长期影响；或者如果收益大于伤害，则为了更大的利益而予以容忍\
  \ |\n| `自由主义（`Libertarianism`）将个人自主置于国家和社会之上，并认为自由市场本质上是公正的 | 自由主义者会优先考虑数据提取者和画像分析者的权利，认为相关方之间发生的情况是私事，公民获得他们应得或负担得起的对待\
  \ |\n| `契约论（`Contractarianism`）试图寻找一种所有参与者都认为公正（而非平等）的资源分配安排 | 契约论者会从各个方面考虑问题，认为如果一个群体不愿意容忍此类数据驱动的伤害，那么应该都不应该如此，系统应当被拆解\
  \ |\n| `马克思主义（`Marxism`）主张社会必须从目前的资本主义基础重构，变为一个个人贡献的全价值得到回报的社会 | 马克思主义者会认为，导致监控资本主义的系统需要变为社会民主，使人们不再受到歧视、剥削和异化\
  \ |\n| `社群主义（`Communitarianism`）拒绝个人自决和国家特许的安排，提倡社区和共享实践与价值观的思想 | 社群主义者会建议，在一个基于共享经验和共性的社区系统内部，这种系统不会产生，需要采纳此类原则\
  \ |\n| `女性主义（`Feminism`）主张重新分配权力，使不同群体之间的权力关系更加公正 | 女性主义会主张结束歧视行为并重新分配权力关系，使公民对此类系统的运作拥有更强的话语权并获得公平对待\
  \ |\n\n*来源*：根据 Harvey (1996) 关于租赁住房中铅漆中毒对这些理论的论述修订。表 1.2 强调的是，揭清当今智能城市如何被想象和生产为“公正”或“不公正”城市的逻辑和原则是重要的。正如\
  \ Don Mitchell (2003) 所指出的，如果没有这种规范性批判，智能城市支持者在声称对城市问题采取常识、实用且非意识形态的方法时，其论点将不受挑战。Vanolo（本书）提供了此类工作的示例，利用\
  \ Harvey 的社会正义理论来审视智能城市系统中的游戏化和助推（nudge）。同样，表 1.2 清楚地表明，仅仅说兴趣创建一个“公正的智能城市”是不够的，仿佛这种陈述的意义是显而自见的一样。事实上，对于自由主义者来说，一种优先考虑自由市场和个人自主、支持优胜劣汰而非福利国家的新自由主义方法会认为，新自由主义智能城市及其随之的分歧和不平等本质上是公正的，因为人们得到的是应得或负担得起的。这种观点被平等主义者、功利主义者、马克思主义者和女性主义认为是是非常公正的。换句话说，对于寻求为替代智能城市愿景创建规范性论证的人来说，必须开始阐述公正城市的原则——也许围绕共融、共有化、平等、公民审议、资源共享和社会生产来组织——以及这些原则在实践中如何运作。这并不意味着在缺乏此类阐述原则的情况下，就应该停止寻求关注感知到的不公，并以务实、工具和实践的层面进行工作（通过行动和倡议）。相反，这意味着理想情况下应该补充一种细致的、政治的规范性论证，以破坏支持有害和不公正结果的话语体系和实践，并以进步的方式转变辩论领域。此类工作的一种方式是通过“城市权利”的政治论证推进的，这一理论源于列斐伏尔受马克思主义启发的正义思想。\n\
  \n\n\n\n亨利·列斐伏尔（Henry Lefebvre, 1996 [1967]）围绕这一理念构建了他影响巨大的概念：“城市权”，公民不仅拥有占据和使用空间的权利，而且空间应该根据居民的需求来塑造（Purcell,\
  \ 2002）。\n\n对于 Isin (2000, p, 14) 来说，城市权是“从特权的新主人人手中夺回城市的使用权并使其空间民主化”：它是被排除者、贫困者和异化者要求并获得生活所需的物质（例如生活工资、住房）和非物质性（例如认可、尊重、尊严）必需品的权利（Marcuse,\
  \ 2012）。\n\n这种要求意味着私有产权和利润率不应凌驾于所有其他权利之上；这种“目前构成的城市权[……]，在大多数情况下被限制在能够根据自身愿望日益塑造城市的少数政治和经济精英手中”的权利应当得到根本性的重构（Harvey,\
  \ 2008, p. 38）。因此，“城市权”“包含所有城市居民充分享受城市生活及其所有服务和优势的权利——居住权，以及直接参与城市管理的权利——参与权”（Fernandes,\
  \ 2007, p. 208）。\n\n这包括公民拥有一系列相关权利，例如“知情权、表达权、文化权、在差异与平等中的身份认同、自我管理权[……]公共及非公共服务的权利”（Fernandes,\
  \ 2007, p. 208），以及自由移动权、占据公共空间并保护公地免受私人所有权侵害的权利、集会和聚集权，以及政治代表权和投票权。\n\n它是居民充分参与城市空间生产的权利——“控制城市化过程并建立新城市化模式的权利”（Harvey,\
  \ 2008, p. 40）——而不仅仅是城市行政部门和市场所实施的管理和公民家长主义实践的接受者（Mitchell, 2003）。换句话之，城市权是“基于基本正义原则的道德诉求”（Marcuse,\
  \ 2012），它是对城市资本主义和新自由主义的不平等和不公正的直接挑战。\n\n该理念更近期的扩展在智慧城市及其对数字网络化技术的依赖、以及大数据的生产与分析背景下尤为重要，包括“数字城市权”（de\
  \ Lange & de Waal, 2013）、“城市数字权利”（Shaw & Graham, 2017a）以及“城市信息权”（Shaw & Graham,\
  \ 2017b）。\n\nde Lange 和 de Waal (2013) 关注智慧城市中的占有权，并寻求推进一种替代的所有权形式，这种所有权不是基于合同和所有权，而是基于一种“对集体场所的归属感[……]以及愿意与集体共享私人资源，以便允许其他公民采取行动，而不侵犯他所有权”。在这里，关键基础设施和资源（如市政数据）被收拢在公地之中，公民有权使用智能技术，通过围绕共同关注事项聚集的“网络化公众”来帮助解决共同问题。\n\
  \nShaw 和 Graham (2017b) 认为，在大数据和数据驱动的城市主义时代，公民有权了解关于他们和地方产生了哪些数据，且该框架应保证这些数据如何汇成信息以及其用途的透明度，从而能够挑战并重构这些用途。\n\
  \n更广泛地说，Isin 和 Ruppert (2015) 认为，鉴于数字技术在生活中无处不在的特性，数字公民需要拥有一系列数字权利。确实正如 Attoh (2011)\
  \ 指出的，城市权“构成的不是单一权利，而是一系列权利”。\n\n同时，Marcuse (2012, p. 34) 明确指出，“城市权是一个统一的权利，一个单一的权利，一个植入了所有[……]分离的个人权利[……]的城市。它是城市的‘权’，而不是对城市的‘多项权利’。它是一种社会正义权，包含了但远超个人正义权。”从这个意义上说，它是一项共同权利而非个人权利，并且超越了个人自由（Harvey,\
  \ 2008）。\n\nMarcuse (2012) 注意到，“一个类似的概念可能是公民身份[……]，它作为公民身份这一单一地位的权利提供了所有权利。”事实上，这一概念强调了城市的解放性组织与运作与更具赋权的公民身份和社会正义形式之间的关键联系。\n\
  \nMarcuse (2012) 详细述道，实现这种耦合需要社会关系性质发生重大转变，因为“[为那些没有权利的人获得权利将涉及消除那些拥有权利者的某些权利：剥夺他人、剥削、支配、压制、操纵他人行为的权利。”事实上，正如\
  \ Mayer (2012, p. 35) 所言，在列斐伏尔的术语中，城市权“不是集体的权利”。\n\n\n\n\n# 本书\n\n批判性城市研究在落实“智慧城市权利”方面的作用在于“揭露、提议和政治化”（Marcuse,\
  \ 2007）。正如 Marcuse (2012, p. 37) 所详述的：“`揭露`意味着分析问题的根源，并将这种分析清晰地传达给那些需要并可以使用它的人。`提议`意味着与受影响的人共同努力，制定出实际的建议、计划、目标和策略，以实现预期结果。`政治化`意味着阐明所揭露和提议的内容在政治行动上的意义及其背后的逻辑，并通过提供行动信息来支持围绕提议开展组织工作。”这就是本书的雄心：揭露、提议并政治化智慧城市，构想一个建立在“城市权利”原则之上的替代性智慧城市。每一章都试图阐述此类努力的特定方面，并是\
  \ 2017 年 9 月在梅努斯大学举办的研讨会的成果，该会议由欧洲研究委员会（`ERC-2012-AdG 323636-SOFTCITY`）资助。\n\n本书分为两个部分。\n\
  \n## 第一部分\n\n第一部分探讨了公民身份、社会公正和公地等问题，倾向于更具概念性的讨论，尽管所有章节都包含了实证案例。在第 2 章中，Katharine\
  \ Willis 考察了谁被纳入或排除在智慧城市愿景之外，关注印度钦奈的城市贫民、街头小贩以及居住在非正式定居点的人。她认为，智慧城市主义并没有创造城市权利，反而进一步强化并再生产了边缘群体在空间和经济上的排斥。Jiska\
  \ Engelbert 随后考察了智慧城市倡议核心对新自由主义的批判，以及其对公民参与的假设，并思考了在新自由主义智慧城市中，普通公民是否可能具有政治意义的代理性。在第\
  \ 4 章中，Alberto Vanolo 从治理术和社会公正的视角出发，考察了智慧城市技术中游戏化的伦理和政治影响，认为通过游戏化过程进行的公民参与引发了许多需要纠正的令人困扰的影响。Michiel\
  \ de Lange 随后探索了数据公地的生产和利用，以培养参与性的智慧公民身份并实现“数据化城市权利”。同样，Paolo Cardullo 考察了有关公共互联网基础设施提供的公地概念和公地化实践，主张公众作为关键利益相关者，在创建和维护城市公地方面发挥核心作用。在部分部分的最后，Cesare\
  \ di Feliciantonio 从批判性政治经济学的视角考察了在米兰 4 You（意大利第一个智慧区）开发的“智慧社区”的本质，并注意到居民被构想为自我企业家，愿意重新占有他们的生活方式和数据以过上智慧的生活；同时也探讨了出现替代理性的可能性。\n\
  \n## 第二部分\n\n本书的第二部分考虑了更具实践意义和政治意义的干预，以及公民参与、参与和智慧城市权利的问题。Catherine D’Ignazio、Eric\
  \ Gordon 和 Elizabeth Christoforetti 开启了本节，认为只有让现有的隐形基础设施（如传感器网络）对公民变得可见且易读，才能实现以社区为中心的智慧城市，他们考察了两个试图创建此类“接缝感”（seamful）接口的项目。Andrew\
  \ Schrock 随后通过考察公民技术的人性潜力，探讨如何通过桥接社区与政府在城市语境下实现可持续的技术设计，从而解决智慧城市中的包容性问题。在第 10 章中，Sung-Yueh\
  \ Perng 考虑了不同类型的黑客松在多程度上为实现城市建设中的公民参与和维护智慧城市权利提供了手段。Gabriele Schwila 随后考察了政府日益使用的“设计思维”来解决城市问题并增强公民参与城市建设，主要通过共同设计策略。随后是\
  \ Nancy Odendaal 描述的南非开普敦社会组织所使用的策略，以挑战她所谓的“仪表盘城市主义”（这种主义利用大数据和数据分析来管理城市，寻求以更细致和更具解放性的方式重新占有并使用这些数据）。Ramon\
  \ Ribera-Fumaz 然后详述了巴塞罗那尝试重构智慧城市精神，将其转向一种以技术主权为基础的精神，这种精神挑战了新自由主义城市主义，转而促进服务于公共利益的公共基础设施、服务和开放平台。\n\
  \n这些章节共同论证了一种智慧城市的规范性愿景，这种愿景植根于公民身份、社会公正、公共利益和城市权利的理念与理想。我们向读者的挑战是：帮助实现这样的智慧城市。\n\
