  \ Environment (truncated)\n\n# 第 9 章\n\n## 什么是公民科技？定义技术多元主义的实践\n\nAndrew R. Schrock\n\
  \n### 摘要\n\n在过去的十年里，工程师、设计师、社区组织者和政府员工都围绕着“公民科技”（civic tech）聚集。这个术语对于城市技术专家和“智慧城市”究竟意味着什么？在制定定义时，在描述了该术语与城市的关系后，我考察了从业者是如何定义公民科技的。他们通常使用基于广泛价值观的伞用定义和基于技术的分类定义来界定公民科技。尽管这些定义很有帮助，但它们往往模糊了公民科技实践和组织技术的政治本质。对此此，我建议公民科技是“技术多元主义”的形式——即有组织的行动者之间在主要实现行政改革的目标下，进行的迭代式技术设计和实施。由于从业者受到重新设计治理体系和重新分配权力的启发，公民科技最重要的挑衅是组织和政治上的，而非纯粹技术上的。公民科技作为一种技术多元主义的形式，为连接社区与政府提供了一条路径，以在城市语境下追求更公平的方法来实现可持续的技术设计。*关键词*：技术；公民参与；政治；设计；参与；城市主义\n\
  \n### 引言\n\n\n\n\n\n公民科技（civic tech）的兴起与作为城市系统和社会想象的“城市”有若干契合之处。公民科技更具自下而上、参与性和包容性的方法有助于“智慧城市”范式人性化，同时扩展了其务实改革的承诺（Kitchin,\
  \ 2015）。公民科技在美国大城市也找到了增长的土壤，在这些地方，地方行政部门很大程度上控制着技术的选择和开发。这导致公民科技从业者将城市视为改善公民生活的实验“实验室”。例如，城市规划师安东尼·汤森（Anthony\
  \ Townsend, 2013）将城市视为一个共享项目，就像简·雅各布斯（Jane Jacobs）对待波士顿北端那样。在他的愿景中，公民科技专家有机地合作进行城市改进，减少了对自上而下控制的需求，作为为技术友好型城市主义寻找中间地带的一种。然而在其他方面，公民科技向基础设施改进和官僚改革的迁移并不需要特定的城市愿景。在更高层次的政府——美国的州级和联邦级——较少认为城市是一个成熟待干预的社会系统。如果你是为了外包政府服务而在“黑入”一个故障的官僚系统，那么在城市的生态系统愿景下运作并非必要。如果公民科技本质上与城市想象相关，它能为智慧城市提供什么，反之又是如何？作为一名解释性传播学者，我最关注的是人们如何使用术语在他们的政治生活中赋予意义并围绕此进行组织。因此，在本章中，我首先转向从业者如何定义公民科技以及识别其缺陷。接下来，我根据参与公民科技组织五年的经验，思考这些定义——主要（并非完全）由基金会和组织推动的——是如何塑造基层参与者的政治实践和社会想象的。最后，我通过将公民科技初步定义为一种“技术多元主义”结束：在政治边界地区组织，以迭代改进社区与政府的关系。\n\
  \n## 桶式与伞式定义\n\n从业者推广了两种常见的公民科技定义：桶式定义（bucket definitions）和伞式定义（umbrella definitions）。桶式定义依赖于技术或成果的列表。例如，骑士特基金会（Knight\
  \ Foundation, 2013, p. 6）将公民科技描述为包括政府数据和众筹平台在内的技术的汇聚。桶式定义也可以关注成果，例如奥米迪亚尔网络（Omidyar\
  \ Network）的定义：“用于赋能公民或帮助政府更易获取、高效且有效的技术”（Donohue, 2016, p. 3）。相比之下，伞式定义强调广泛的共同价值观。克里斯·惠塔克（Chris\
  \ Whitaker, 2015）作为芝加哥领域的核心人物和美国代码军遣队（Code for America Brigade）经理，将公民科技定义为“任何交叉`公共生活`（public\
  \ life）的技术”。由 Accela 赞助的 IDC 2014 年报告同样将公民科技定义为简单的“[合并]技术创新与`公民目的`（civic purpose）”（Clarke,\
  \ 2014, p. 1）。有些人会同时使用桶式和伞式定义。公民厅（Civic Hall）的《公民科技领域指南》`Google sheet` 列出了许多类别的技术，并附有声明：“公民科技是利用技术实现`公共利益`（public\
  \ good）”。公共生活和公共利益是广泛的概念，保留了某种对在共同价值观统一以实现广泛改革的自由主义关注。桶式和伞式定义都合理地假设目标是更明智地使用技术。然而，这些定义很少描述技术人员实际上在做什么或是什么驱动了他们。通过“技术人员（techie）”，我指的是那些合作从事涉及技术实践应用项目的极客、政府员工、设计师和活动家，这些实践包括（但不绝对限于）软件工程和设计。伞式定义利用对广泛公共利益的利益主张来吸引参与。然而，正如自由主义改革的广泛主张中一个常见问题一样，“公共利益”中究竟包含什么总是可以引起争议的。例如，许多美国居民并不认为全民医疗或对低收入居民的援助是“公共利益”，尽管技术人员是这样认为的。相比之下，桶式定义倾向于反映现有的学科和组织目标。基金会希望有一个术语能让他们将资金投入到为其现有投资组合增加价值的项目，而政府官员则被能够平衡数据驱动与对居民需求响应的能力所吸引。这同样没有怎么说明一线技术人员如何看待他们的工作。结果，技术人员发现自己陷入了永久的定义困境中。例如，艾米莉·肖（Emily\
  \ Shaw, 2014）正确地质疑公民科技是否涉及围绕问题进行组织、接触特定的公众或使用特定的方法。为了解决这些担忧，公民科技主导定义的主要缺陷是，它们将从以前时代延续来的政治实践和文化逻辑埋没在技术中性的面纱下。我在研究中发现了完全相反的：技术人员意识到其活动的政治性质。他们驱动于使技术人性化并将其整合到治理系统中以改善社会状况，而不是延续国家暴力。也就是说，他们在行动上是“政治性”的，并且意识到技术的非中立性。在这方面，公民科技专家与之前的几波技术组织者有文化上的亲缘，他们曾寻求将社区和政府开发和实施技术的方式人性化。虽然我在本章中的目标不是历史性地追溯这些思想，但考虑了\
  \ 70 年代的“适宜技术”运动（Schumacher, 1973）、肯尼斯·劳登（Kenneth Laudon, 1977）的“公民技术”，以及 90 年代的“重塑政府”（Osborne\
  \ & Gaebler, 1992）。公民科技很难是第一波建议用户导向的设计、流程改进、文化变革和开放交流的结合可能通过技术改进民主制度的——它至少是第四波。每一波浪潮都产生于社会动荡时期，将各种政治参与者汇聚在现在公民科技中可见的某些原则周围。\n\
  \n### 在社会运动与政府改革者之间\n\n\n\n\n当我们承认公民科技（civic tech）具有部分而非全部的社会运动特征时，其定义变得更加难以捉摸。它拥有网站、活动和出版物，在这些平台上推演人文主义价值观并建立了社区感。它还拥有庞大的数量，至少从历史上组织以技术人性化的小型运动的标准来看如此。参与者或“技术人员”的确切数字很难确定，因为公民科技与现有职业重叠，并从此前的几波对技术的热潮中演变而来，特别是欧洲（Baack,\
  \ 2015）和美国（Schrock, 2016）。超过 100,000 名参与者使用 [meetup.com](http://meetup.com) 注册了\
  \ Code for America 分队，有 10,000 人参加了 2014 年的国家公民黑客日。Code for America 在报税申报方面的官方参与人数为\
  \ 40,000 人。如 `g0v`（台湾的一个去中心化组织）、`MySociety`、`Civic Hall` 和 `Code for America` 等组织通过帮助扩大能力以及与机构伙伴建立桥梁，为技术人员及其工作提供支持。除了前引的基础报告外，世界各地较小的半自治小组也产了大量出版物，从\
  \ `Civic Quarterly` 杂志到 `Smart Chicago Collaborative` 出版的丛书。这些每项都是参与的切入点，使得技术人员（尤其是全球范围内）的确切数字难以确认。可以确定的是，这种活动、组织和出版物的结合为技术人员提供了一种政治身份认同以及合作共享项目的机会（Schrock,\
  \ 2018）。\n\n虽然许多技术人员是软件工程师，但并非所有人都是技术专家。尽管话语体系中充斥着对编码的强调，我遇到的许多技术人员并不会编码，而是设计师、政治专家和社区组织者。他们的动机不仅仅是寻找一种行使技术能力的方法。相反，他们作为社会运动的参与者，出于熟悉的原因被公民科技所吸引：在个人成就感的工作与回馈社区的需求之间取得平衡。然而，从其他标准来看，公民科技对市场动态和行政改革的勉强接纳，使其难以被视为一种草根社会运动。它为企业资金敞开了大门——这通常是社会运动的终结（Tilly\
  \ & Wood, 2012）。虽然数万技术人员听起来很多，但公民科技很难获得触及并动员数百人的社会正义运动那种规模和媒体关注。此外，公民科技往往将行政改革*视作*参与，这种做法不会被那些将参与视为自愿主义的公民参与学者所接受（Skocpol\
  \ & Fiorina, 1999）。\n\n广泛参与的另一个挑战是，公民科技将两类通常被认为无聊且不带政治色彩的事物汇聚在了一起：行政改革和技术工作。Dunbar-Hester\
  \ (2013) 指出，面向平等的技术运动面临着双重困境：他们试图扩大对技术问题的参与，尽管这些技术可能会否认真正多元的公众参与。由于这些原因，公民科技可能永远无法成为一种围绕社会正义的广泛活动运动，而是在已经受过教育的人群中试图与技术和政治兴趣较少的人建立桥梁的、相对精英化的组织实践。这并不意味着我们应该忽略公民技术专家，而是要承认他们正在进行一种特定的政治工作。\n\
  \n批判性学者还提醒我们，公民科技可能只是高科技公司影响政治的另一个便利工具。例如，Schulte (2018) 最近批评了美国数字服务局 (USDS) 机构在成立时依赖“初创公司”的概念。她认为，通过模仿硅谷，USDS\
  \ 为科技公司提供了一条影响联邦政治的新途径。Irani (2015) 在观察印度的公民黑客松时，看到了精英政治与以技术为中心的社会变革模式之间存在一种不稳定的联盟，她将其称为“创业公民”。她正确地指出，参与可能是强制性的，而且单凭力量很难改变政府的运作方式。对于许多地方政府来说，公民科技仅仅提供了一种方法，让他们在按照已经计划好的道路前进之前，可以说自己正在接触公众。市长和政府官员通常非常接受这种想法，即一个公民黑客团队可能会免费创造出以前需要一年时间和巨额费用才能完成的内容。因此，公民科技的定义应当考虑到治理中的权力动态。\n\
  \n## 公民科技作为技术多元主义\n\n\n\n\n\n描述公民科技（civic tech）领域个体的一种方式是：他们为了通过改革治理体系来修复历史上技术与平等之间扭曲的关系而汇聚在一起。这段阅读将技术人员视为自由主义者（Hall,\
  \ 1986），他们是受自由驱动的黑客（Coleman, 2012）的镜像。。“技术多元主义”是我对他们社会和政治变革方式的术语。`Technical`指的是广泛的科学和行政技术。他们与天真工程师的刻板印象完全不同，我发现他们理论上的“全杂食者”，总是对权力问题感兴趣，并不断测试社会变革理论。他们汲取的词汇涵盖了设计、城市研究、政治学、社会学和技术哲学者的领域。与卡尔·波普尔（Karl\
  \ Popper, 1945）的“渐进式社会工程师”一样，他们递归地尝试利用手中的工具来减少社会苦难。在一个辞藻激烈、政治分裂的时代，对改进治理新方法感兴趣的新政治参与者的兴起并不令人意外。人们总是通过意义构建来评估自己对政治的参与情况。也就是说，他们利用媒体和政治氛围中的文化词汇来理解公民行动的意义，并在自己的生活中采用这些实践。我们投票，除非我们认为自己的票无关紧要。我们做志愿者，但如果我们投入时间的非营利组织开始失去对我们关注的社会问题产生影响，我们就不做了。针对“公民精神危机”的辩论，Zuckerman（2014）写道，“并不是人们对公民参与不感兴趣，”他在反驳常见观点时写道，“他们只是对感到无力或无助不感兴趣”（p.\
  \ 155）。就像任何参与政治的行动者一样，技术人员也试图改进他们的社区并解决民主机制的缺陷——他们只是的方法不同。技术人员不断地在一个务实的循环中测试社会变革理论，这种循环将观察和实施作为一种学习方式（Dewey,\
  \ 1915）。Chris Kelty（2008）将“递归公众”（recursive public）定义为通过话语和技术实践构成的集体。他那些基于互联网的自由开源软件（F/OSS）极客是“由于对自身关联的技术和法律可能性条件有着共同且深刻的关注而构成的”（Kelty,\
  \ 2005, p. 185）。也就是说，通过实践，他们始终在测试改进组织方式的想法。Coleman 同样指出，在透明度活动分子中，“对公民自由的关注与对[……]技术的参与并不是分离的或补充的：它是`经验的构成性部分`”（2017,\
  \ p. S98）。与技术人员的区别在于，他们并不是为了一个单一目标甚至不是某种单一技术而团结在一起，而是为了一个通过改革治理来实现社会变革的“大帐篷”式信息。因此，技术人员是特定哲学传统中的务实主义者（Ansell,\
  \ 2011）。结果是在在试图解决系统性问题时，他们很容易陷入循环。这种“递归公民精神”也解释了为什么在公民科技的混乱空间里，公民参与的规范准则会被违背：技术人员不断地推销和原型化改进社会状况的想法，这些想法范围从基础到激进不等。在递归解决公共问题的过程中，他们正在超越“地方政府”或“国家”的边界组织并获得技术设计和实施的能力。在这里，我转向了多元主义理论，以及考虑政治权力表达（Dahl,\
  \ 1961, 1963）和社会多样性的政治哲学文献（Bagharmian & Ingram, 2000）。多元主义者认为权力并非由“国家”或政党持有，而是通过跨越组织和机构边界的影响分布的。然而，多元主义也有局限性。多元主义者往往很少关注机构边界和政党动态——因此产生了技术人员对“开放政府”和整体开放性的渴望。正如\
  \ Daniel Kreiss（2015）所指出的，导致他们在特定问题上凝聚跨投票区块广泛支持的能力有限。由于他们通常先用技术干预解决社会问题，以后才解决政策流程问题，他们的实践可以被批评为“滴漏式技术官治理”，领导者缺乏动力去制定更稳健的提案。对于任何不仅感兴趣“公民科技”，而且关注整个公共部门技术设计的人来说，这些都是核心挑战。\n\
  \n### 结论\n\n目前对“公民科技”的定义反映了一种信念：技术在被明智使用时，可以改善公共生活。桶式和伞式定义也把技术定位为工具性和意识形态上的中立。我认为，这些定义掩盖了事实，即公民科技的持久贡献主要是组织和政治上的，而非仅仅是技术上的。一种导向实践的视角关注了技术人员如何通过迭代解决问题来递归解决公共问题。也就是说，技术人员利用递归公民精神，通过黑客基础设施、筛选数据和创建原型来重新排列权力动态。通过这些实践，技术人员试图在政府和社区之间开辟空间，改变整个政治体系。权力的运作不仅发生在公民身份的形成和技术的塑造上，也发生在政府边界的扩张和重新配置中。在“公民科技”这一术语的热度背后，隐藏着持久的政治问题：我们如何通过技术改革来提高政治中的认可度和资源再分配？政府能将权力移交给社区和非营利组织吗？这些合作如何在城市环境中产生或维持社区基础设施？一旦我们理解了技术人员正在通过交流和实践共同构建“公共利益”这一概念本身，那些强调“公共利益”的伞式定义就更有意义。正如\
  \ David Nye（2006, p.3）所说，“讲述一个故事或制作一个工具就是采取一个即时感官体验之外的想象位置”。通过共同工作和交流赋予技术工作道德意义，技术被`赋予了意义`（Maher,\
  \ 2015）。公民科技绝非政策制定者和慈善机构经常声称的那样是非政治或价值中立的。“公共利益”也没有免除从业者采取特定的政治立场。Lasswell (1951)\
  \ 和 Dahl (1961) 将政治权力定义为政府内外的实体如何影响共享资源的分配。从技术多元主义的角度来看，公民科技是一种深度的政治尝试，旨在黑入并重新配置决定城市环境中资源分配的制度安排。一波接一的技术改革者诱使我们认为以前的范式已经过去，而出路通常更具协同性。换之，公民科技对分配正义、组织和人文技术设计的兴趣，应当激励运行在“智能城市”中的资深从业者，他们可以将自己的经验和理论带入讨论，提出更稳健的城市变革框架。\n\
