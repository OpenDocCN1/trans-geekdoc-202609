    \ * Binary Command Line\n* Disable on-host firewall\n* Reverse shells\n* Suspicious\
    \ IP address communication\n* Crypto coin miner\n\nBesides the built-in alerts,\
    \ you can also create custom alerts based on your knowledge of expected device\
    \ behavior.\n\n# Threat intelligence in Security Center\n\nThreat Intelligence\
    \ (TI) today is one of the cornerstones of every successful security setup. A\
