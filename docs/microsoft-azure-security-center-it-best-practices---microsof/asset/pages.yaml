    **The Identity Posture** section of the **Identity & Access** dashboard conveys
    various analytics representing the last 24 hours of data, which can help you better
    understand your users'' authentication patterns. These analytics include the following:


    +   - **Logons:** This graph shows the number of failed and successful logons.

    - **Accounts Logged On:** This counter shows the number of user accounts that
    are currently logged on.

    - **Accounts Failed To Log On:** This counter shows the total number of accounts
