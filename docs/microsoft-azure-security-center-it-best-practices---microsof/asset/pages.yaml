- pgno: 14
  md: '# About the Authors


    Yuri Diogenes, MSc


    Yuri Diogenes has a Master of Science in cybersecurity intelligence and forensics
    investigation (UTICA College) and is a senior program manager for the Microsoft
    CxE Security team, where he primarily helps customers onboard and deploy Azure
    Security Center as part of their security operations/incident response. Yuri has
    been working for Microsoft since 2006 in different positions; he spent five years
    as a senior support escalation engineer for the CSS Forefront Edge team. From
    2011 to 2017, he worked for the content development team where he also helped
    create the Azure Security Center content since its launch in 2016. Yuri has published
    a total of 21 books, mostly covering information security and Microsoft technologies.
    Yuri also holds CISP, ECNND, EJCE, EJCSA, EJCHF, CompTIA Security+, CySA+, Cloud
    Essentials Certified, Mobility+, Network+, CyberSec First Responder, MCSE, and
    MCTS. You can find Yuri on Twitter at @yuridiogenes or read his articles at his
    personal blog: http://aka.ms/yuridio


    # Tom Shinder


    Tom Shinder is a cloud security program manager in Azure Security Engineering.
    He is responsible for Azure security technical content and education, Azure security
    basining, and public cloud security competitive analysis. He has presented at
    many of the largest security industry conferences on topics related to both on-premises
    and public cloud security and architecture. Tom earned a bachelor''s degree in
    neuropsychology from the University of California, Berkeley, and an M.D. from
    the University of Illinois, Chicago. He was a practicing neurologist prior to
    changing careers in the 1990s. He has written more than 30 books on OS, network,
    and cloud security, including Microsoft Azure Security Infrastructure. Tom can
    be found hugging his Azure console when he is not busy with his keys and secrets
    in Azure Key Vault.'
  merge: -1
  img_proc: true
