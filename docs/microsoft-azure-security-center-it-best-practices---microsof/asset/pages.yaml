    # Using Security Center recommendations to drive a better security posture


    Misconfigurations, lack of security expertise, and lack of visibility are the
    most common reasons for attack vulnerabilities. Azure Security Center recommendations
    are based on security policies by which you choose to have your environment assessed.
    You can choose which security policies by which you want Azure Security Center
    to assess your environment and tell you where your environment is vulnerable.
    Security Center assesses your environment 24/7 and provides recommendations with
    a Security Score Impact. This allows you to prioritize the work that your organization
    needs to do in order to reduce attack surface and harden your security posture.


    ASC continuously assesses your environment—in Azure or a hybrid configuration
    including on-premises or other clouds—based on the security policies you choose
    to enable. In addition to providing security recommendations, ASC also maps assessments
    to several regulatory compliance standards. For each assessment under regulatory
    compliance, ASC shows how many resources are not passing compliance, and it provides
    remediation steps. Because of the nature of regulatory compliance assessments,
    ASC cannot assess all controls. Controls not assessed are shown on the list as
    unavailable (dimmed).'
