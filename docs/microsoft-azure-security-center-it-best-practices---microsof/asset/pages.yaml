- pgno: 98
  md: '# Identity and access


    Today, security monitoring goes beyond actively watching the security state of
    your workloads. Now, you must take a broader approach that also includes identity
    and access. When an adversary can compromise one user''s credential, the attacker
    might leverage this legitimate account for a much larger attack campaign. Regardless
    of where your workload is located—in the cloud or on-premises—it becomes imperative
    to monitor your user'' behaviors, access, and how their credentials are being
    used.


    You can take advantage of Security Center to understand these patterns and monitor
    your identity posture. To access the identity dashboard, click Identity & Access
    under Resource Security Hygiene, in the left navigation pane. The Identity & Access
    blade appears, as shown in Figure 4-32.


    ![](img/4b11e95292819ab1a383a41ef73aedb4_98_0.png)


    **FIGURE 4-32** Identity & Access overview page


    The View Classic Identity & Access button allows you to switch to the legacy view
    when only pure identity statistics are shown (Figure 4-33). This button will be
    retired on July 31, 2019, but because many customers like this visualization,
    you can reproduce the data visualized in this dashboard using a query that the
    Azure Security Center team made available on GitHub. See http://aka.ms/ASLCegidentity.'
  merge: -1
  img_proc: true
