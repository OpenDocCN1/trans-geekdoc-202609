    > **IMPORTANT** For details about Azure AD Identity Protection, visit http://aka.ms/AzureADIdentityProtection.


    # # Logging


    Throughout the years, it has become more and more important to always have logs
    available to investigate security-related issues. Azure provides different types
    of logs; understanding their distinctions can help during an investigation. Data
    plane logs will reflect events raised as part of using an Azure resource; an example
    of this type of log would be writing a file in'
  merge: -1
