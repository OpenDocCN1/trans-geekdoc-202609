    in Figure 3-3).


    ![](img/4b11e95292819ab1a383a41ef73aedb4_68_0.png)


    FIGURE 3-3 Initiative compliance dashboard


    Security policy in Security Center can only be assigned at the subscription or
    management group levels. This is an important observation if you look at the Azure
    Policy itself, it can be assigned to a resource group; however, this capability
    is not available for Security Center. That''s why when you access this initiative
