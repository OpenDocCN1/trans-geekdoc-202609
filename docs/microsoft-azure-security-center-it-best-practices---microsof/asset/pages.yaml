- pgno: 211
  md: 'When a collection of Azure Policy definitions is grouped, it is called an initiative.

    Both a definition and an initiative can be assigned to a scope, such as a Subscription
    or a management group, and it then becomes an Azure Policy assignment.


    Azure management groups are the third cornerstone for supporting management at
    scale, and they provide a level of scope above subscriptions. When you organize
    Subscriptions into a management group, you can apply governance conditions in
    a single place. ... You can also build a hierarchy of management groups, with
    a root management group at the top of each directory. Conditions applied to the
    root management group—or to a management group—flow down to lower management groups
    and subscriptions. An example of a management group hierarchy is shown in Figure
    A-3.


    ![](img/4b11e95292819ab1a383a41ef73aedb4_211_0.png)


    FIGURE A-3 Example of a management group hierarchy


    # Security Center and Azure Policy, better together


    When a new Azure subscription is created and the subscription is registered with
    the Microsoft Security Resource Provider (RP), the default behavior is that a
    Security Center policy initiative is provisioned and assigned at the subscription
    level. The exception is that if the subscription resides in a Management Group
    that already has the Security Center initiative assigned, the Security Center
    initiative will not be'
  merge: -1
  img_proc: true
- pgno: 212
  md: 'assigned to any of the subscriptions within that management group. This approach
    has a couple of advantages:


    +   - You define the governance conditions in a single place, either at the Root
    Management Group or at the lower management groups.

    - You can assign deny policies at a high-level that cannot be overridden at a
    lower level.

    - There is a clear view of your compliance state across your management groups
    and subscriptions.


    # Scoping your deployment of ARM templates and Azure Policy


    Every ARM template deployment and Azure Policy assignment is targeted at a scope,
    such as management groups, subscriptions, or resource groups. Because Security
    Center is a subscription-level resource, ARM templates and Azure Policy deployments
    and assignments must be targeted at the subscription level. This is a common misunderstanding
    when configuring and managing Security Center at scale. The example in Figure
    A-4 shows a subscription-level deployment.


    ![](img/4b11e95292819ab1a383a41ef73aedb4_212_0.png)


    Figure A-4 shows the use of the PowerShell command New-AzDeployment, which targets
    a subscription-level deployment. Because Azure Policy definitions and assignments
    can be deployed through ARM templates as well, the same concept applies.'
  merge: -1
  img_proc: true
- pgno: 213
  md: '> NOTE Support for deploying and assigning an Azure Policy at the (Root) management
    group was announced in May 2019.


    # Best practices for managing Security Center at scale


    Research and define compliance conditions that apply to your organization, group
    them in an Azure Policy initiative, and assign them at the highest level in your
    management group hierarchy. Inheritance ensures that these conditions apply to
    lower-level management groups and subscriptions. Also, you should follow the general
    best practices below:


    +   * Tailor the Security Center default initiative to your needs.

    * Create custom Azure Policy definitions according to your compliance needs.

    * Target exceptions at your lower management groups, such as dev and test environments.

    * Deploy and maintain Azure Policy definitions and initiatives using ARM Templates
    as Infrastructure as Code (IaC).

    * Don''t be tempted to “manually” configure ASC. Instead, you should leverage
    Azure Policy and/or ARM Templates where possible.

    * Ask yourself if you can provision a new tenant or subscription with automation
    only.

    * First, test with auditifNotExists Azure Policies before using deny policies.'
  merge: -1
  img_proc: true
