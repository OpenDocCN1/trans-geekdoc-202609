  md: 'When you click Run History, the log you see pertains only to the execution
    of the playbook against the alert you selected. Let''s call it Alert A. If you
    run the same playbook on a different alert—Alert B—you won''t see an entry for
    that operation in the history for Alert A. Instead, it will appear in a separate
    history, for Alert B.


    # Auditing playbook execution


    As noted, you can check whether a playbook was executed against a particular alert
    by viewing history. However, this won''t show you whether the playbook was executed
    against all relevant alerts. For that, you should audit the playbook''s execution.
    That way, you see its full execution log. Follow these steps to perform this operation:


    +   1. In the left pane of the Security Center, under Automation & Orchestration,
    click Playbooks.


    +   2. Click the playbook you want to audit. The playbook''s properties cite the
    details of all executions, including the date, start time, and duration. You can
    also filter by date and time (see Figure 6-24).


    ![](img/4b11e95292819ab1a383a41ef73aedb4_152_0.png)


    Figure 6-24 Complete history of executions for this playbook


    +   3. For more details on a particular execution, click the execution line. The
    Run history blade opens with the Logic app dashboard displayed (see Figure 6-25).


