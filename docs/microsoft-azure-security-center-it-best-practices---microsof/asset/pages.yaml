- pgno: 125
  md: 'One of the biggest problems facing organizations that seek to improve their
    prevention solutions is a lack of manpower and time for sifting through the huge
    amounts of data produced and enforcing ongoing policies. To mitigate this, Azure
    Security Center uses machine-learning algorithms on data collected by its agents
    (for example, security events and network traffic logs) to recommend tailored
    security policies (for example, application control rules) to its customers. These
    algorithms not only use data generated by a specific customer but also enrich
    it with insights gleaned from similar environments. The unique policies produced
    and enforced by Azure Security Center enable customers to rapidly apply preventive
    mechanisms lowers the exposure of their environments to various risks and helps
    the customer focus on the most important issues in his or her environment.


    Ben Kliger, Senior Program Manager, Azure Security Center Team


    # Application whitelisting (adaptive application controls)


    Application whitelisting has always been a goal of on-premises security. The idea
    behind whitelisting is that if you can define and control a predefined list of
    applications that should, and run, on a particular operating system, then any
    other process that runs on the machine represents a potential threat.


    This capability existed for many years with Windows Server. While there were some
    strong advocates of the application whitelisting solution in Windows Server, the
    basic problem of complexity for configuration and maintenance prevented it from
    being the success it could have been.


    One of the implicit goals of the cloud is to make infrastructure transparent to
    the end user. The cloud would provide resources desired by the user, and the user
    could consume these resources without making large investments to understand how
    and where the resources are run and maintained. Also, users would not need to
    understand complex constructs that could take hundreds of hours to gain highly
    specific professional expertise.


    These are still the goals of the cloud, but in most cases, we are still quite
    a way from from vision because many IT Pros tell us that the cloud is often more
    complex than on-premises computing. I tell them IT Pros to be patient. Over time,
    the cloud will fulfill the true vision of the cloud, and getting stuff done in
    the cloud will be much easier to do than it ever on-premises.


    We can see this with Security Center Application Whitelisting (Adaptive Application
    Controls). In the Azure console, application whitelisting is called Adaptive Application
    Controls, So'
  merge: -1
  img_proc: true
- pgno: 126
  md: 'remember term. However, when it comes to understanding Adaptive Application
    Controls and what it does, remember that it is application whitelisting. The internals
    are somewhat complex, the fact is you won''t have to worry about them. Security
    Center uses machine learning to learn about the processes running in the virtual
    machines and their behavior. This learning process usually takes two weeks, and
    after that period, Security Center suggests that apps should be whitelisted.


    At this point, you can review this list and choose some or all the recommendations.
    There will be a lot of recommendations, which are comprised of a list of file
    names that you want to allow to run on the virtual machines.


    Finally, you decide if you want to monitor for whitelisting violations and actively
    block them. In most cases, users will monitor for a period of time. After they
    become confident in the whitelisted collection and disabling processes outside
    of the whitelisted group will not interfere with normal function of applications,
    they stop monitoring them. In Figure 5-19, you can see there are three tabs:


    If you expand these subscriptions, you see the Group names and the mode of operation
    for application whitelisting, which can be set to Audit or Enforcement. If you
    choose Audit, it will only trigger an alert when an app that was not in the whitelist
    was executed. However, if you choose Enforcement, it will alert and block the
    apps that are not whitelisted. These groups will contain the VMs/Computers that
    have similar application patterns and should have the same set of whitelisted
    apps.


    ![](img/4b11e95292819ab1a383a41ef73aedb4_126_0.png)'
