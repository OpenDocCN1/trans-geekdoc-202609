    # # Detection scenarios


    There are many scenarios in which Security Center will rapidly warn you about
    suspicious activity. The following sections cover some important scenarios to
    give you an idea of how powerful Security Center detections are and the advantage
    of using multiple data sources to enhance the confidence level of an alert.


    # # Detecting spam activity


    In this scenario, the attacker compromises an Azure VM and uses the compromised
    VM to send spam emails. Using machine learning, Security Center can detect a spike
    in SMTP traffic. It then queries other data sources to make sure this spike is
    because of malicious behavior. Finally, it correlates this traffic with the Office
    365 spam database to determine whether it is legitimate traffic. If the result
    of this correlation is that the traffic is suspicious, Security Center triggers
    the alert shown using built-in analytics, machine learning, and threat intelligence
    from Office 365. Performing these three steps provides not only more precise detection
    but also a higher level of confidence in the alert.


    ![](img/4b11e95292819ab1a383a41ef73aedb4_135_0.png)


    **Figure 6-6** Spam alert in Security Center'
  merge: -1
  img_proc: true
- pgno: 136
  md: 'In this scenario, Security Used built-in analytics, machine learning, and threat
    intelligence from Office 365. These are three major capabilities working together
    to give you not only a more precise detection, but also a higher level of confidence
    in this alert.


    # Crash dump analysis


    In this scenario, the attacker compromises an Azure VM and installs malware that
    goes undetected by the malware installed on the VM. This malware causes a crash
    in a legitimate program. When a crash occurs in a Windows system, Windows Error
    Reporting (WER) generates a user-mode memory dump file (.dmp), which by default
    is located under %LOCALAPPDATA%CrashDumps. Security Center collects an ephemeral
    copy of the crash dump file and scans it for evidence of exploits and compromises.


    If Security Center finds such evidence, it generates an alert like the one shown
    in Figure 6-7. This alert indicates that the crash dump analysis has detected
    executable code behavior that is commonly performed by malicious payloads. Although
    non-malicious software may perform this behavior, it is not a typical development
    practice. Follow the remediation steps to investigate this issue further.


    ![](img/4b11e95292819ab1a383a41ef73aedb4_136_0.png)


    FIGURE 6-7 Crash dump analysis alert'
  merge: -1
  img_proc: true
- pgno: 137
  md: 'While this is a powerful feature, it has one limitation: the process must crash
    or the dump cannot added. For reason, Security Center added a new detection called
    Fileless Attack Detection. Fileless Attack Detection can detect exploitation of
    shellcode by reading (disassembling) machine code located in dynamically allocated
    segments of commonly targeted processes. Once this is done, it uses static analysis
    and targeted emulation techniques to identify more complex payloads, Fileless
    attack detection scans dynamically allocated code segments for a number of signals,
    including


    +   - Injected modules

    - Obfuscated modules

    - References to sensitive operating system functions

    - Indicators of known fileless attack toolkits and many others


    # Windows detections


    VMBA detection in Windows looks at many events, and once it finds something suspicious,
    it triggers an alert. For example, if you execute the following command in a VM
    monitored by Azure Security Center, a suspicious activity:


    ```

    powershell -nop -exec bypass -EncodedCommand

    `CBVAHCAgAzByAHHMAA1AG1WAAQAGQOT2BAHIAQGBQBHAG4A2ZAAgACTAjAgSIAHBpAHcCAgAgAgdAB0AHAHAAcAG6C8ALwKGA8BDwAgUwaGBALBAHIAQGB2BAHKAcwB4GAAD1BAH1IAHTBGAwAcwAwAMBwB8C2AZQ8BpGAwZQZBAC6C8U5MAHB0BwAGQ4GA4GB6CAAGACOATWB1AHIA0QARgBpGAw2ZQAgAGMA0BcAHQZBZQHAXABZYAYWBoC8AwC0CA4Z4QAGUAIAZBACIA`

    ```


    PowerShell is a very powerful tool, and you can see at the Mitra attack''s techniques
    (https://attack.mitre.org/techniques/T1059/) that PowerShell has been used in
    many attack campaigns. When Security Center detects the PowerShell execution with
    the encoding command, it raises an alert for the user is trying to hide. In this
    case, the command above is trying to download the file sysmon.zip from the Sysinternals
    website and saving it in the C:\temp folder with the svhost.exe:


    ```

    powershell -command "& { iwr https://download.sysinternals.com/Files/Sysmon.zip
    -OutFile c:\temp\svhost.exe"

    ```


    PowerShell encoding to download malware from command and control is a common pattern,
    and for this reason, Security Center will raise an alert, which in this case,
    looks similar to Figure 6-8. (Note that the Subscription and Attached Response
    have been intently hidden in the page.'
  merge: -1
  img_proc: true
- pgno: 138
  md: '![](img/4b11e95292819ab1a383a41ef73aedb4_138_0.png)


    FIGURE 6-8 In the alert, Security Center shows the PowerShell encoded and decoded.


    > TIP You can test threat detections in Windows machines monitored by Security
    Center by using the Playbook at http://aka.ms/ASCWindowsDetection.


    # Linux detections


    When Linux detections were first released, there was a dependency in the AuditD
    to be installed in the Linux operating system. While AuditD provides a great amount
    of information that can be used to detect threats, not all Linux distributions
    will have AuditD installed by default. For this reason, the latest change in behavior
    for Linux detections in Security Center was to bake the necessary elements that
    will be collecting relevant data in the agent (MOM Agent) itself.


    > TIP You can test Linux Detections in Security Center by using the Playbook at
    http://aka.ms/ASCLinuxDetections.'
  merge: -1
  img_proc: true
