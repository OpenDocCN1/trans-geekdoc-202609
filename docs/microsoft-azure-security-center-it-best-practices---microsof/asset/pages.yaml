    # Fine-tuning security policies


    It is important to have full visibility of your workloads in Azure and ensure
    that you are using the security best practices available for all resources that
    you are monitoring. Security policies in Security Center reflect the security
    assessment that can be done for all monitored resources, as shown in Figure 3-4.'
