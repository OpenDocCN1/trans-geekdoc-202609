- pgno: 112
  md: '# Advanced cloud defense


    Now that you know how to address recommendations in order to enhance the security
    posture of your cloud workloads, you need to ensure that you also apply security
    controls to reduce the attack surface. In this chapter, you will learn how Azure
    Security Center can help you harden your resources. You will learn how to use
    just-in-time virtual machine (VM) access to harden the access to Azure VMs and
    to ensure that your VMs are not always exposed to the Internet. You will learn
    how to track changes to your files and registry file integrity monitoring, and
    you will also learn how Security Center uses machine learning to create application
    whitelisting.


    # Just-in-time virtual machine access


    To provide remote access to VMs, the public cloud infrastructure provider must
    allow all remote management traffic to those VMs. To do this, you use RDP, SSH,
    and remote Power-Shell. Using these tools is easy—and nothing beats easy. Unfortunately,
    easy is often the enemy of security, so it''s a difficult balancing act.


    > NOTE There are alternative methods for providing remote management access to
    VMs. Such methods include point-to-site VPN, site-to-site VPN, and vari-eties
    of dedicated WAN link solutions.


    The most common attack against VMs in Azure (and other public cloud service providers)
    is an RDP or SSH brute-force attack. VMs are continuously hit by attempts to log
    on. If you have a strong password policy, it''s unlikely your VMs will be compromised.
    However, if you''re a security professional, you already know that most password
    policies are not strong and that users often use easy-to-guess passwords.


    You can take various steps to reduce the chance of compromise because of a brute-force
    attack, but you probably don''t want to hand over these tasks to your public cloud
    service provider. However, you might want to consider letting your public cloud
    service provider help you with network access to management ports to your VMs.
    That''s Azure Security Center just-in-time (JIT) VM access. It allows you to control
    who can gain access to predefined management ports on a VM, when, and for how
    long.'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'This control—which is enabled through Azure network capabilities rather than
    through any feature or on the VM itself—is exerted over incoming connections from
    the Internet. The Azure Security Center JIT VM access feature is fairly simple.
    Here are the key points:


    +   - The primary goal of Azure Security Center JIT is to protect VM management
    ports, such as RDP, SSH, and remote PowerShell ports.


    +   - JIT limits the amount of time a port is open. The port will be open only
    for as long as is needed to get the work done. (You define the duration).


    +   - Network security group (NSG) rules control access to the management ports
    defined in the JIT policy.


    +   - Only ARM VMs support Azure Security Center JIT VM access.


    +   - We recommend that you use JIT on all VMs that support it. Indeed, the times
    we do not recommend using JIT when there is no NSG associated with the VM or when
    the VM is a classic VM.


    +   - Sometimes, when a VM might be a candidate for JIT VM access, Azure Security
    Center doesn''t issue a recommendation to that effect. This occurs when the JIT
    solution is disabled by a security policy set at the subscription or resource-group
    level, when the VM doesn''t have a public IP address, and when the VM is not associated
    with an NSG.


    +   - JIT VM access provides a collection of default management ports that you
    can use to enable access. You can also create new ports and remove existing ports.


    +   - An administrator sets the JIT policy, which defines which ports can be used.
    When a user requests access to JIT, he or she can use only those ports defined
    in the policy. To increase security, the user can remove all ports except the
    one required to gain remote administrative access.


    +   - You can use PowerShell to configure JIT policy as well as to request access.


    +   - When users request JIT access, Azure Security Center checks their RBAC permissions.
    If the user has right access to the VM, JIT access will be granted. At that point,
    Azure Security Center will dynamically create NSG rules to allow inbound management
    traffic. When JIT access expires, the NSG rules will be removed. Note that connections
    are not actively reset, so a user who is connected will remain until the connection
    is dropped by the user or for some other reason.


    To explore this feature, select **Azure Security Center** in the left pane of
    the Azure Portal. Then select **Just-In-Time Access**. The main screen for JIT
    VM access explains what the feature is and how it works. It also contains main
    tabs under a Virtual Machines heading, as shown in Figure 5-1.


    If a JIT access request is approved for a VM behind an Azure Firewall, then Security
    Center automatically changes both the NSG and firewall rules.'
  merge: -1
  img_proc: true
- pgno: 114
  md: '# What is just in time VM access?


    Just in time VM access enables you to lock down VMs in the network level by blocking
    inbound traffic to specific ports. It enables you to control the access and reduce
    the attack surface on the VMs, by allowing access only upon a specific need.


    # How does it work?


    Upon a user request, on Azure RBAC, Security Center will decide whether to grant
    access. If a request is approved, Security Center automatically configures the
    NSGs to allow inbound traffic to these ports, for the requested amount of time,
    after which it restores the NSGs to their previous states.


    For more information go to the documentation >


    # Virtual machines


    | Configured | Recommended | No recommendation |

