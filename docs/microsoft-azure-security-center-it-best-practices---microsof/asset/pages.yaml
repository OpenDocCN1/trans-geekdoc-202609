- pgno: 194
  md: 'Also, these alerts leverage additional data that already exists in the MCAS
    detection engine to help speed up the investigation process and contain ongoing
    threats. To enable this integration, follow these steps:


    +   1. Open the Security Center dashboard.

    2. In the left pane under **Policy & Compliance**, click **Security Policy**.

    3. Click **Edit settings** for the subscription on which you want to enable this
    integration.

    4. Under **Settings**, click **Threat Detection**: the **Enable Integrations**
    blade appears.

    5. Select the **Allow Microsoft Cloud App Security To Access My Data option**
    and click **Save**.


    This integration will enable the following alerts to be surfaced in the Security
    Alerts dashboard in Security Center:


    +   * Impossible Travel

    * Activity From Infrequent Country

    * Activity From Anonymous IP Address


    Figure 9-4 shows example of the alert flow in the first scenario (Impossible Travel)
    and how this is surfaced in Security Center.


    ![](img/4b11e95292819ab1a383a41ef73aedb4_194_0.png)


    **FIGURE 9-4** Alert flow between MCAS and Security Center


    In the example shown in Figure 9-4, MCAS identified two user activities (in a
    single or multiple sessions) originated from geographically distant locations
    (Brazil and the United States). These activities occurred within a time period
    shorter than the time it would have taken the'
  merge: -1
  img_proc: true
- pgno: 195
  md: 'user to travel from the first location to the second. This indicates that a
    different user is using the same credentials, which is interpreted as the credentials
    being compromised. This detection leverages a machine-learning algorithm that
    ignores obvious false positives, such as VPNs and locations used by other users
    in the organization.


    You can also search directly in the workspace for alerts that were generated by
    MCAS. Use the Kusto query sample shown in Figure 9-3 to perform this task, but
    change the provider name from WATP to MCAS.


    # # Integration SQL ATP


    Security Center integration with SQL Advanced Threat Protection (ATP) provides
    a new layer of security to help customers to detect and respond to potential threats,
    such as suspicious database activities, potential vulnerabilities, and SQL injection
    attacks, as well as anomalous database access and queries patterns.


    This integration makes it simple to address potential threats to the database
    without needing to be an expert or manage advanced security monitoring systems.
    When SQL ATP is enabled, the following alerts will be available:


    +   - **Vulnerability To SQL Injection**: This alert may indicate a possible vulnerability
    to SQL injection attacks.

    - **Potential SQL Injection**: This alert is triggered when an active exploit
    happens against an identified vulnerability to SQL injection.

    - **Access From Unusual Location**: This alert is triggered when there is a change
    in the access pattern to SQL server; for example, this alert would be triggered
    when someone has logged on to the SQL server from an unusual geographical location.

    - **Access From Unusual Azure Data Center**: This is another alert that is triggered
    based on changes in access pattern to SQL server. However, in this case, it occurs
    when someone has logged on to the SQL server from an unusual Azure data center
    that was not seen during the recent period.

    - **Access From Unfamiliar Principal**: This is another alert that is triggered
    based on changes in access patterns to the SQL server, but this scenario applies
    to a situation in someone has logged on to the SQL server using an unusual principal
    (SQL user).

    - **Access A Potentially Harmful Application**: This alert is triggered when a
    potentially harmful application is used to access the database.

    - **Brute Force SQL Credentials**: This alert is triggered when there is an abnormally
    high number of failed logins with different credentials.


    Figure 9-5 shows an example of this type of alert; in this case, a potential SQL
    injection detection is shown.'
