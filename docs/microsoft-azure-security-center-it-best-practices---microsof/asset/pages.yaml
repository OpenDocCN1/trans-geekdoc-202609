- pgno: 190
  md: '# Integration with other Microsoft solutions


    One of the advantages of using Azure Security Center as your cloud protection
    platform is the capability to natively integrate with other Microsoft security
    solutions. The intent is to broaden the threat detection capability to cover other
    scenarios while leveraging the threat intelligence provided by Microsoft''s other
    solutions. By integrating instead of reinventing, Security Center can keep focusing
    on providing a great threat-detection experience with shared signals that can
    be streamed to other platforms, such as a SIEM. In this chapter, you will learn
    how to integrate Security Center with Windows Server Defender ATP, Microsoft Cloud
    App Security, SQL Advanced Threat Protection (ATP), and Advanced Threat Protection
    (ATP) for Storage Accounts.


    # Increasing threat detection scope


    In Chapter 2, "Azure Security Center," you learned about Cloud Security Posture
    Management (CSPM) and Cloud Workload Protection Platform (CWPP). You also learned
    about Security Center''s native integration with some Azure workloads, as AppServices,
    Containers, and others. The integration with Windows Server Defender ATP complements
    Security Center coverage for the CWPP scenario. For native Azure workloads, Security
    Center can also leverage the Advanced Threat Protection solution for SQL and Storage
    Accounts.


    Security Center integrates with Microsoft Cloud App Security—Microsoft''s Cloud
    Access Security Broker (CASB) solution—to bring alerts based on user and entity
    behavioral analytics for your Azure resources and users. The diagram in Figure
    9-1 shows this integration.


    The threat detection generated by these solutions will be streamed to Security
    Center and appear in the Security Alert dashboard. As you learned in Chapter 8,
    "SIEM Integration," the security alerts in Security Center are stored in the workspace
    and can be streamed to supported SIEM solutions, including Azure Sentinel.'
  merge: -1
  img_proc: true
- pgno: 191
  md: '![](img/4b11e95292819ab1a383a41ef73aedb4_191_0.png)


    # # Integration with Microsoft Defender ATP


    Security Center extends its Cloud Workload Protection Platforms (CWPP) offering
    integration with Windows Defender Advanced Threat Protection (ATP) and bringing
    comprehensive Endpoint Detection and Response (EDR) capabilities. The Microsoft
    Defender ATP sensor is automatically enabled for supported Windows Servers that
    are onboarded to Security Center. With this integration, Security customers can
    access the Microsoft Defender ATP console to perform a detailed investigation
    to uncover the scope of a breach.


    > **IMPORTANT** This feature supports detection on Windows Server 2012 R2, Windows
    Server 2016, and only servers with Standard Tier subscriptions. By the time we
    were writing this chapter, the support for Windows Server Defender ATP in Windows
    Server 2019 was not available yet.


    The onboarding process is seamless from the user''s perspective. If the machine
    is in Azure and Auto Provision is configured to On, the Microsoft Monitoring Agent
    (MMA) will be deployed. After the MMA is deployed, it will check whether the operating
    system is supported to receive Windows Server Defender ATP. If it is enabled,
    the Microsoft Defender ATP sensor is deployed to the VM. This whole onboarding
    process can take up to 24 hours.'
  merge: -1
  img_proc: true
- pgno: 192
  md: 'For machines located on-premises or in different cloud providers, the onboarding
    process is basically the same; the only difference is that you will need to manually
    install the MMA on the target machine. To enable this integration, follow the
    steps below:


    +   1. Open the Security Center


    +   2. In the left pane under Policy & Compliance, click Security Policy.


    +   3. Click Edit Settings for the subscription that you want to enable this integration.


    +   4. Under Settings, click Threat Detection, the Enable Integrations blade appears.


    +   5. Select the Allow Windows Defender ATP to Access My Data option and click
    Save. Once the integration is enabled and the servers are fully onboarded, the
    Windows Defender ATP sensing on the server will report telemetry to the Microsoft
    Defender ATP cloud service. Once an indicator of attack is triggered by Microsoft
    Defender ATP, an alert is published in Security Center and in the workspace (see
    Figure 9-2).


    ![](img/4b11e95292819ab1a383a41ef73aedb4_192_0.png)


    FIGURE 9-2 Alert surfaced in Security Center and generated by Microsoft Defender
    ATP


    You can also search directly in the workspace for alerts that were generated by
    Microsoft Defender ATP. Use the Kusto query sample shown in Figure 9-3 to perform
    this task.'
  merge: -1
  img_proc: true
- pgno: 193
  md: '![](img/4b11e95292819ab1a383a41ef73aedb4_193_0.png)


    # # Unified Endpoint Detection and Response (EDR)


    Microsoft Defender Advanced Threat Protection (Microsoft Defender ATP) is a unified
    security platform that provides endpoint protection platform (EPP) and endpoint
    detection and response (EDR) capabilities for Windows clients, Windows Server,
    and third-party systems like Mac OS. In Windows, Server Microsoft Defender ATP
    is deeply integrated with Azure Security Center, which ensures that organizations
    maximize the usage of their existing Microsoft security investments. With this
    deep integration, customers benefit from an automated onboarding experience of
    supported Windows Servers to Microsoft Defender ATP.


    This allows security analysts to see their entire environment and they do not
    need to switch between portals during an active investigation. Therefore, the
    Microsoft Defender ATP and Azure Security Center integration helps organizations
    spot abnormalities. Also, organizations can detect and respond to advanced attacks
    on server endpoints monitored by Azure Security Center.


    Milad Aslan, Senior Security Program Manager, Microsoft Defender ATP R&D


    # # Integration with Microsoft Cloud App Security


    The integration with Microsoft Cloud App Security (MCAS) enables Security Center
    to receive alerts that are based on anomalies in user behavior, on user and entity
    behavioral analytics, and machine learning (ML). With this integration, you have
    immediate detections, which targets numerous anomalies across the users and resources
    associated with your subscription.'
