- pgno: 40
  md: '# Introduction to Azure Security Center


    Given the threat landscape presented in Chapter 1, clearly there is a need for
    a system that can unify security management and provide advanced threat protection
    for workloads running in Azure, on-premises, and on other cloud providers.


    Azure Security Center gives organizations complete visibility and control over
    the security of hybrid cloud workloads, including compute, network, storage, and
    application workloads. By actively monitoring these workloads, Security Center
    enhances the overall security posture of the cloud deployment and reduces the
    exposure of resources to threats. Security Center also uses intelligent threat
    detection to assist you in protecting your environment from rapidly evolving cyberattacks.


    Security Center does more than detect threats. It also assesses the security of
    your hybrid cloud workload and provides recommendations to mitigate threats. And
    it provides centralized policy management to ensure compliance with company or
    regulatory requirements.


    In this chapter, you will learn how you can use Security Center in your security
    operations, key considerations for adoption, and how to onboard resources.


    # Deployment scenarios


    As enterprises start their journeys to the cloud, they will face many challenges
    trying to adapt their on-premises tools to a cloud-based model. In a cloud environment
    in which there are different tools to manage, it becomes imperative to ensure
    verification and corrective actions to ensure the security posture of those workloads
    are always at the highest quality possible.


    Security Center has a variety of capabilities that can be used in two cloud-solution
    categories:


    +   - Cloud Security Posture Management (CSPM): CSPM enables organizations to
    assess your cloud infrastructures to ensure compliance with industry regulations,
    and it helps identify security vulnerabilities in their cloud workloads.'
  merge: -1
  img_proc: true
- pgno: 41
  md: '+   - Cloud Workload Protection Platform (CWPP): CWPP enables organizations
    to assess their cloud workload risks and detect threats against their Infrastructure
    as a Service (IaaS), containers, Platform as a Service (PaaS) databases, and storage.
    It also allows organizations to identity faulty configurations and remediate those
    with secure best-practice configurations.


    # # Understanding Azure Security Center


    Because Azure Security Center is an Azure service, you must have an Azure subscription
    to use it—even if it''s just a trial subscription.


    Having an Azure subscription automatically enables the free tier of Security Center.
    This free tier monitors compute, network, storage, identity, IoT and application
    resources in Azure. It also provides security policy, security assessment, and
    security recommendations, and it enables you to connect with other security partner
    solutions. Even organizations that are starting with IaaS in Azure can benefit
    from this free service because it will improve their security posture.


    In addition to the free tier, Security Center offers a fee-based standard tier.
    This tier offers a complete set of security capabilities for organizations that
    need more control. Specifically, migrating your Security Center subscription from
    the free tier to the standard tier enables the following features:


    +   - Security event collection

    - Network Map

    - Just-in-time VM Access

    - Adaptive application controls (application whitelisting)

    - Regulatory compliance reports

    - File integrity monitoring

    - Network Security Group (NSG) Hardening

    - Security alerts

    - Threat intelligence

    - Playbooks


    Another advantage of the standard tier is that it enables you to monitor on-premises
    servers and VMs hosted by other cloud providers. You achieve this by manually
    installing the Security Agent on the target machine. (This is covered in more
    detail later in this chapter).


    When you upgrade to the standard tier, you can use it free for 30 days. It is
    a good opportunity to evaluate these features, see how your current environment
    will benefit from them, and decide whether they''re worth the investment. For
    the latest information about Azure Security Center pricing, visit http://aka.ms/aspricing.
    During this 30 days we recommend you validate all scenarios that you need via
    a Proof of Concept (PoC). Read the article How to Effectively Perform an Azure
    Security Center PoC for more information http://aka.ms/ascpoc.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# Security Center architecture


    When you use Security Center to monitor resources in Azure—either on-premises
    or hosted by other cloud providers (such as Amazon AWS)—the architecture looks
    similar to Figure 2-1.


    ![](img/4b11e95292819ab1a383a41ef73aedb4_42_0.png)


    Figure 2-1 Connectivity between Security Center agents and the Security Center
    service


    Security Center uses the Microsoft Monitoring Agent, which is the same agent used
    by Operations Management Suite and the Log Analytics service. In Windows systems,
    Security Center installs the Microsoft Monitoring Agent (HealthService.exe). In
    Linux systems, Security Center creates the omsagent daemon, which runs under the
    account. This account is automatically created during agent installation.


    In Linux systems, Security Center collects audit records from Linux machines by
    leveraging the audit framework. The audit framework consists of two major components,
    the first is a set of user-space utilities offering a wide collection of operations
    allowing administrators to better adjust rules, analyze audit logs, or troubleshoot
    if things are misconfigured. The second is a kernel-level subsystem that is responsible
    for monitoring system calls, filtering them by netlink socket, and writing match
    messages to a buffer. Audit records are collected, aggregated into events, and
    enriched with the latest version of the Microsoft Monitoring Agent for Linux.
    A subset of the audit events are stored in your workspace and managed by Security
    Center. When threats are detected, Security Center triggers an alert. Starting
    in June 2019, the Linux Agent no longer requires the audit daemon (although it
    still uses the audit framework) to be running on the machine. If the target machine
    already has the audit daemon running, the agent will respect that, and it will
    interact with the audit daemon to collect the data.


    Understanding Azure Security Center


    23'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'In Windows systems, Microsoft Monitoring Agent scans for various security-related
    configurations and events in Event Tracing for Windows (ETW) traces. In addition,
    this agent collects the following:


    +   * Operating system logs, such as Windows events

    * Operating system type and version

    * Running processes

    * Computer name

    * IP addresses

    * Logged-in user (username)

    * Tenant ID

    * User-mode crash dump created by Windows Error Reporting (WER)


    > NOTE Later in this chapter, you will learn how to change the level of granularity
    of the data collection for Windows systems.


    This information is sent to your workspace, which is an Azure resource used as
    a container to store your data. A workspace provides a geographic location for
    data storage, granularity for billing, and data isolation, and it helps you to
    better scope the configuration.


    If you are using Azure Monitor, chances you already have a Log Analytics workspace.
    This workspace can be used by Security Center to store data coming from the agent.
    If you are not using a Log Analytics workspace, a new workspace will be automatically
    created when you start using Security Center. The location of the workspace created
    by Security Center is based on the location of the VM, as follows:


    +   * For VMs in the United States, Brazil, and Canada, the workspace location
    is the United States.

    * For VMs in Europe and the United Kingdom, the workspace location is Europe.

    * For VMs in the Asia-Pacific region, Japan, and India, the workspace location
    is Asia Pacific.

    * For VMs in Australia, the workspace location is Australia.


    If you are part of a global company and you need to store data in specific regions
    for data sovereignty or compliance reasons, you might consider creating multiple
    workspaces. Another scenario that might call for multiple workspaces is if you
    want to isolate various users. For example, you might want each customer, department,
    or business group to see its data but not data from the other groups.


    > TIP You need to use Log Analytics to create multiple workspaces. If you need
    to perform this operation, read this article: https://aka.ms/ascworkspaces.'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'Figure 2-2 shows the Security Center architecture and how these pieces come
    together and communicate. In this example, non-Azure machines and Azure VMs send
    data collected by the agent to the workspace. Security Center uses this data for
    advanced threat detection analysis and generates recommendations that fit within
    the prevention module or issues alerts that are part of the detection module.
    Security Center employs advanced security analytics—a method that is far more
    powerful than the traditional signature-based approach.


    ![](img/4b11e95292819ab1a383a41ef73aedb4_44_0.png)


    Figure 2-2 Security Center architecture


    One scenario in which multiple workspaces are needed is when you need to isolate
    data, such as creating separate workspaces for each branch office, as shown in
    Figure 2-3.


    ![](img/4b11e95292819ab1a383a41ef73aedb4_44_1.png)


    FIGURE 2-3 New workspace created.'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'Once the data is in the workspace, Security Center uses machine-learning technologies
    to evaluate all relevant events across the cloud fabric. By this approach, Security
    Center can detect threats that would be impossible to identify using manual approaches.
    Security Center uses the following type of analytics:


    +   - **Integrated threat intelligence:** This leverages global threat intelligence
    from Microsoft for known bad actors. (You will learn more about this in Chapter
    9, "Integration with other Microsoft Solutions."

    - **Behavioral analytics:** This looks for known patterns and malicious behaviors,
    such as a process executed in a suspicious manner, hidden malware, an exploitation
    attempt, or the execution of a malicious PowerShell script.

    - **Anomaly detection:** This uses statistical profiling to build a historical
    baseline and triggers an alert based on deviations from this baseline. An example
    of this would be a VM that normally receives remote desktop connections five times
    a day but suddenly receives 100 connection attempts. This deviation would trigger
    an alert.


    > > TIP To read more about Security Center detection capabilities and other relevant
    scenarios, see https://aka.ms/ascdetections.


    # Security Center dashboard


    To access the Security Center dashboard, sign in to Azure Portal (https://portal.azure.com)
    and click **Security Center** in the left pane. What happens the first time you
    open the Security Center dashboard may vary based on the resources you have. For
    the purposes of this example, the dashboard is fully populated with resources,
    recommendations, and alerts, as shown in Figure 2-4.


    ![](img/4b11e95292819ab1a383a41ef73aedb4_45_0.png)


    **FIGURE 2-4** Security Center dashboard'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'As you can see in Figure 2-4, the Security Center Overview dashboard has three
    major areas: Policy & Compliance, Resource Security & Hygiene, and Threat Protection.
    The data shown here is pulled from your own workspace.


    In the left navigation pane, you have the following areas:


    +   - **General**: In this area, you will find options that can be used in your
    daily activities; also, the options for onboarding non-Azure machines and searching
    for alerts or events are available here.


    +   - **Policy & Compliance**: The options available here are used to manage your
    security policy, show your secure score, and visualize regulatory compliance reports.


    +   - **Resource Security Hygiene**: The options shown here will be used to enhance
    your security posture. Here, you will be able to view the security assessment
    of your resources, connect with security solutions, and monitor your identity
    access activities.


    +   - **Advanced Cloud Defense**: The options available here are to further protect
    your VMs, whitelist your applications, and track changes to your VMs.


    +   - **Threat Protection**: The options available in this area will be used for
    incident response and further investigation on security issues that are relevant
    to your environment.


    +   - **Automation & Orchestration**: Here, you will be able to leverage Azure
    Logic Apps to create workflows that you run against Security Alerts.


    Throughout this book, all of these options will be covered. For now, you should
    just browse each of these options to familiarize yourself with the interface.


    # Planning adoption


    Although Security Center is a cloud service—which means you don''t really need
    to deploy any server on-premises—there are still some aspects around the adoption
    that you should take in consideration. One of the critical areas is to determine
    who should have access to Security Center. Depending on the size and structure
    of your organization, multiple individuals and teams may use Security Center to
    perform different security-related tasks.


    # Roles and permissions


    Security Center uses Role-Based Access Control (RBAC) based in Azure. By default,
    there are two roles in Security Center: Security Reader and Security Admin. The
    Security Reader role should be assigned to all users who need read access to the
    dashboard. For example, the security Reader role should be assigned to security
    operations personnel who need to monitor and respond to security alerts. It is
    important to mention that the assignment of this role is done at the Azure level,
    under the resource group Security Center is monitoring and using the **Access
    Control (IAM)** as shown in Figure 2-5. (IAM stands for Identity and Access Management.)'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# Centralized management


    Workload owners usually need to manage a particular cloud workload, and its related
    resources. Also, the workload owner is responsible for implementing and maintaining
    protections in accordance with company security policy. Because of those requirements,
    it would be appropriate to assign the Security Admin role to those who own a workload.


    **IMPORTANT** Only subscription owners, contributors, and Security Admins can
    edit a security policy. Only subscription owners, resource group owners, and resource
    group contributors can apply security recommendations for resource. To learn more
    about Role-Based Access Control (RBAC) in Azure, see http://aka.ms/azurerbac.


    Large organizations that have different business units and are adopting Azure
    in a non-cohesive way may find challenges when trying to adopt Security Center
    because they cannot see all subscriptions that are part of their tenants. For
    this reason, even before enabling Security Center, you need to work with your
    IT Team to identify all subscriptions that belong to the tenant and verify whether
    you have the rights to manage Security Center. In some scenarios, the same company
    may have multiple tenants, with different subscriptions on each tenant.


    When multiple subscriptions are part of the same tenant and you need to centralize
    policy across subscriptions, you can use Azure Management Groups. By aggregating
    multiple subscriptions under the management group, you can create one role-based
    access control (RBAC) assignment on the management group, which will inherit that
    access to all the subscriptions. This saves time in management because you can
    enable users to have access to everything they need instead of scripting RBAC
    across different subscriptions. Security Center also supports assigning security
    policies to a management group.


    When planning your Security Center adoption, make sure to determine what needs
    to be monitored. You must determine whether the default policy provided by Security
    Center is enough for your organization, or if you need to create new definitions.
    You will learn more about Security Policies in Chapter 3, “Policy Management.\**


    FIGURE 2-5 Access control in Azure


    ![](img/4b11e95292819ab1a383a41ef73aedb4_47_0.png)'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'As explained previously, the agent will collect information and send it to
    the workspace. If you are using the Standard tier, you have up to 500 MB per day
    across nodes. If the uploaded data exceeds 500MB per day, additional charges will
    apply.


    When planning Security Center adoption, consider the fact that workspaces that
    were created by Security Center have the data retained for 30 days. For existing
    workspaces, retention is based on the workspace pricing tier.


    # Recommendations


    Security Center will identify resources (compute, network, storage, identity,
    IoT and applications) that need security recommendations, and it will automatically
    suggest changes. You can see all recommendations in a single place, which is available
    under Resource Security Hygiene / Recommendations, as shown in Figure 2-6, or
    you can see them individually, by category. When planning your Security Center
    adoption, make sure to include a full revision of all recommendations before exploring
    more capabilities in Security Center. You should use Security Center’s Security
    score to prioritize which recommendations should be addressed. You will learn
    more about Secure Score in Chapter 4, "Strengthen your security posture."


    ![](img/4b11e95292819ab1a383a41ef73aedb4_48_0.png)


    FIGURE 2-6 Aggregation of all recommendations from Security Center


    # Automation


    Security Center deployment and configuration can be automated using Azure Resource
    Manager (ARM) templates, and PowerShell. In Appendix A, "Managing Security Center
    at Scale," you will learn more about the use of ARM templates for large deployments
    of Security Center. Later in this chapter, you will learn how to use PowerShell
    for task automation.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# Incorporating Security Center into your security operations


    It''s critical that your IT security and IT operations departments constantly
    collaborate to provide better protection, detection, and response. Security Operations
    (SecOps) describes this support function. Many organizations already have a SecOps
    team dedicated to maintaining the security operations of company assets.


    Before using Security Center to monitor resources, you must review your organization''s
    SecOps process and identify how you can incorporate Security Center into your
    routine. Figure 2-7 shows the tasks performed by a typical security operations
    center (SOC) and which Security Center features can be used to assist with these.


    ![](img/4b11e95292819ab1a383a41ef73aedb4_49_0.png)


    FIGURE 2-7 Mapping security operations in Security Center


    Here are a few key points for incorporating Security Center into your security
    operations:


    +   - Security Center will continuously evaluate compute, network, storage, identity,
    IoT and application resources for compliance. The team responsible for ongoing
    security assessment should track and apply recommendations issued by Security
    Center on an ongoing basis.

    - The security roles available in Security Center—along with Azure''s RBAC capability—can
    help SOC management control who has access to what.

    - The incident response (IR) team can use security alerts and incident features
    during the detection and triage phases of an attack to conduct early assessments
    of the incident. If more in-depth research on an attack is needed, the team can
    use Security Center''s investigation and search features. Finally, when the team
    is ready to respond, it can use the Security Playbook feature to customize a response
    to a certain alert.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# **IMPORTANT** The security assessment done on the VMs will also look for
    the presence of security configuration. This security configuration is based on
    CCE (Common Configuration) rules. These rules are available for download at https://aka.ms/asccerules.


    Another important consideration when incorporating Security Center as part of
    SecOps is to establish how the data will be consumed by the team responsible for
    reviewing those alerts. Some organizations may already have a Security Information
    and Event Management (SIEM) system as part of their security operations, and they
    may not want to introduce another dashboard to their teams to query alerts. In
    this case, it is very common to export Security Center alerts to their SIEMs.
    You will learn how to perform this operation in Chapter 8, "Exporting Logs to
    a SIEM Solution."


    # # Onboarding resources


    To fully utilize all features available in Security Center, you first need to
    upgrade the subscription from Free to Standard Tier. You can see the current state
    of your subscription by looking at the Subscription coverage tile in the **Overview**
    dashboard, as shown in Figure 2-8.


    Subscription coverage


    ![](img/4b11e95292819ab1a383a41ef73aedb4_50_0.png)


    **FIGURE 2-8** Subscription Coverage shows the three possible states of your Azure
    subscription in Security Center


    If you click this tile, the **Security Center – Coverage blade** will open and
    a message reading, "You have subscriptions that are not fully protected. Upgrade
    to the Standard tier for more recommendations" appears. Click the the **Upgrade
    Now** button, and the Getting Started blade appears, as shown in Figure 2-9.'
  merge: -1
  img_proc: true
