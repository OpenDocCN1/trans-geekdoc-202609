  md: '# # Automating response with playbooks


    Now that you know how to use Security Center to detect an alert and to investigate
    a security issue, you can move to the next phase: responding to a security alert.
    To aid you in this, Security Center supports a feature called security playbook.
    Security playbooks enable you to create a collection of procedures that can be
    executed from Security Center when a certain security alert is triggered. Azure
    Logic Apps is the automation mechanism behind security playbooks.


    Before creating a playbook, you should have in mind what you want to automate.
    Implementing this feature, answer the following questions:


    +   - For which security alert should I automate a response?

    - What steps should be automated if the conditions for this alert are true?

    - What steps should be automated if the conditions for this alert are false?


    > > NOTE This is only a sampling of questions to get you started. As you start
    creating security playbooks, other questions may be raised.


    # # Creating a playbook


    In this example, the goal is to create a security playbook that sends an email
    anytime a high alert is triggered. Follow these steps:


    +   1. In the left pane of the **Security Center** window, under **Automation
    & Orchestration**, click **Playbooks**. The **Playbook** dashboard opens. Assuming
    this is the first time you''ve created a playbook, the dashboard will be empty,
    as shown in Figure 6-14.


    ![](img/4b11e95292819ab1a383a41ef73aedb4_146_0.png)


    FIGURE 6-14 Creating a new security playbook'
  merge: -1
  img_proc: true
- pgno: 147
  md: '2. Click the **Create logic app** button. The **Create logic app** blade appears,
    as shown in Figure 6-15.


    ![](img/4b11e95292819ab1a383a41ef73aedb4_147_0.png)


