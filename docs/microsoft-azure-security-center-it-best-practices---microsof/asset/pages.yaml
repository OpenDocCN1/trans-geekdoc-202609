- pgno: 20
  md: '# The threat landscape


    On May 12, 2017, the mainstream media began covering a massive ransomware attack
    called WannaCry, which caught the world by surprise. In a single day, 230,000
    computers in more than 150 countries were infected. The attack was carried out
    by exploiting computers on which the MS17-010 patch—released in March 2017 to
    fix a Microsoft SMB vulnerability—had not been applied. In addition to affecting
    home users, this attack hit organizations such as the United Kingdom''s National
    Health Service (NHS). Computers that were patched were not affected. (This, of
    course, highlights the need to have a solid update-management process in place!)


    Ransomware like WannaCry—or like Petya, which allows for lateral movement, meaning
    it takes only a single infected machine to potentially down the entire network—is
    just one threat in the current landscape. There are many others. Before we dive
    into Azure Security Center, you need a good understanding of current threats and
    the motivations of the people behind them. Current threats range from old but
    effective techniques, such as phishing emails, to state-sponsored attacks, and
    everything in between. For example, one common threat is drive-by download sites.
    Another is Trojans. Then there is the weaponization of cloud resources to attack
    on-premises assets. This chapter explores several of these threats to prepare
    you to use Azure Security Center. First, it discusses cybercrime and the cyber
    kill chain, establishing your security posture, and the assume-approach.


    # Understanding cybersecurity


    The days of hacking for status are behind us. Nowadays, a main motivator behind
    cyberattacks is some sort of financial gain.


    The Internet Crime Complaint Center (IC3) is part of the Cyber Division of the
    US Federal Bureau of Investigation. According to its 2017 Internet Crime Report
    (https://pdf.gov/2017/ic3report.pdf), the IC3 received 1,783 complaints regarding
    ransomware, resulting in losses of more than $2.3 million. Tech-support fraud
    also left a mark, with a total of $15 million in losses in 2017. Finally, the
    total financial loss in the United States exceeded $1.42 million in 2017.


    You''re probably wondering how cybercriminals monetize the data they steal. That
    is a great question. Many of these cybercriminals work in organized crime, and
    they have a'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'globally distributed criminal infrastructure, which is used to launch attacks.
    Before they launch an attack, they start a new campaign. To build such campaign,
    they work with technically sophisticated organized crime groups, which they find
    on the cybercriminal marketplace online.


    These technical cybercriminals have different online offerings, they might offer
    counter-antivirus (AV) services, which scan antivirus engines to make sure new
    malware can be successfully deployed without being detected. Another offering
    could be bulletproof hosting services for online criminal activity. (They’re called
    “bulletproof” because the owners of these servers do not cooperate with local
    law enforcement in case of an investigation). There are even escrow services that
    act as a third party in online transactions between technical criminals and their
    criminal clients.


    > TIP see how Microsoft Cloud and advanced analytics are assisting the fight against
    cybercrime at https://aka.ms/stoppingcrime


    Throughout 2017 and 2018, cybercriminals realized the opportunity to make money
    with cryptocurrencies by customizing coin miners for malicious intents. This is
    done by running a malware campaign that deploys and runs the Trojan miners in
    victims’ computers. In order for cryptocurrency miners to work properly and be
    more profitable, attackers must keep persistence in the system target. The longer
    cryptocurrency stay undetected and resident in memory, the longer they can steal
    resources.


    To accomplish this goal, cybercriminals used advanced methods of code injection,
    such as file-less techniques. This attack usually leverages tools that are already
    in the system target, such as PowerShell. By leveraging a tool that is already
    on the computer, they don’t need to write to the hard drive; instead, they only
    need to take over the target process, run a piece of code in its memory space,
    and then use that code to call the tool that will be used to perform the attack.
    The question here is: Do you have detections for that? Azure Security Center!


    # Understanding the cyber kill chain


    One of the most challenging aspects of defending your systems against cybercriminals
    is recognizing when those systems are being used for some sort of criminal activity
    in the first place—especially when they are part of a botnet. A botnet is a network
    of compromised devices that are controlled by attacker without the knowledge of
    their owners. Botnets are new. As a matter of fact, a 2012 Microsoft study found
    that cybercriminals infiltrated secure supply chains using the Nitol botnet, which
    introduced counterfeit software embedded with malware to secretly infect computers
    before they were purchased. (For more information, see https://aka.ms/nitol.)


    The best way to prevent this type of attack, or any other, is to identify attack
    vectors—that is, how an attacker will attack your environment. To help with this,
    Lockheed Martin developed a cyber kill chain. Each step in this chain represents
    a particular attack phase. (See Figure 1-1.)'
  merge: -1
  img_proc: true
- pgno: 22
  md: '![](img/4b11e95292819ab1a383a41ef73aedb4_22_0.png)


    FIGURE 1-1 Example of the cyber kill chain steps


    The steps in this chain are as follows:


    +   1. **External recon** During this step, attackers typically search publicly
    available data to identify as much information as possible about their targets.
    The goal of this step is to obtain intelligence, or *intel*, to better perform
    the attack and increase the likelihood of success.

    2. **Compromised machine** During this step, attackers leverage different techniques,
    such as social engineering, to entice users to do something. For example, the
    attacker might send a phishing email to lure the user into clicking a link that
    will compromise the machine. The goal is to establish a foothold on the victim''s
    network.

    3. **Internal recon and lateral movement** During this step, the attacker performs
    host discovery and identifies and maps internal networks and systems. The attacker
    may also start moving laterally between hosts, looking for a privileged user''s
    account to compromise.

    4. **The low-privileges lateral movement** During this cycle, the attacker continues
    to search for accounts with administrative privileges so that he or she can perform
    a *local privilege escalation* attack. This cycle typically continues until the
    attacker finds a administrative user account that can be compromised.

    5. **Domain admin cred** At this point, the attacker needs *domain dominance*.
    To achieve this, the attacker will pivot through the network, looking for valuable
    data or installing ransomware or any other malware that can be used for future
    extortion attempts.


    > **IMPORTANT** It is important to understand these steps throughout the book,
    you will learn how Azure Security Center can be used to disrupt the kill chain
    by detecting attacks in different phases.'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# Common threats


    As mentioned, one type of attack is the use of drive-by download sites. These
    are websites that host one or more exploits that target vulnerabilities in web
    browsers and browser add-ons. According to the Microsoft Security Intelligence
    Report, Volume 22, Bing detected 0.17 drive-by download pages for every 1,000
    pages in the index in March 2017.


    According to the same report, in the first quarter of 2017, trojans were the most
    commonly encountered type of malicious software (followed by worms and droppers).
    Trojans always pose as a useful application. For example, take the Win32/Zadupi
    Trojan, also called WinZipper(%ProgramFiles%\WinZipper) or QkSee(...). In addition
    to creating a shortcut to itself in the Start menu (see Figure 1-2) that enables
    users to zip and unzip files, this Trojan also creates a service (qkseeService)
    that connects to command and control (C2 servers) and periodically checks for
    instructions using HTTP requests. Often, these instructions silently download
    new files, which could contain malware that will be executed on the local computer.
    This is just one example of how threats spread.


    ![](img/4b11e95292819ab1a383a41ef73aedb4_23_0.png)


    Figure 1-2 Typical installation location for QkSee


    These days, the user is almost always the target because he or she is the weakest
    link. With the proliferation of mobile devices, bring-your-own-device (BYOD) models,
    and cloud-based apps, users are installing more and more apps. All too often,
    these are merely masquerading as valid apps. Many do something similar to (or
    even worse than) what QkSee'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'For this reason it is important to have good endpoint protection as well as
    a detection system that can look across different sources to intelligently identify
    unknown threats by leveraging cutting-edge technologies, such as analytics and
    machine learning.


    # # Building a security posture


    At one time, cybersecurity experts recommend that organizations simply invest
    more in protecting their assets. Today, however, simply investing in protecting
    your assets is not enough. Instead, organizations should invest in building a
    solid security posture. As shown in Figure 1-3, a security posture is composed
    of three major pillars.


    ![](img/4b11e95292819ab1a383a41ef73aedb4_24_0.png)


    FIGURE 1-3 The three pillars of your security posture


    According to the InfoSec Institute, attackers lurk on networks for an average
    of 200 days without being detected. (See http://resources.infosecinstitute.com/the-seven-steps-of-a-successful-cyber-attack
    for more.) No doubt, this is a huge amount of time to have an attacker inside
    your network. However, the key word here is detected. Without a good detection
    mechanism, you have no way to disrupt an attack. Hence, it is imperative to invest
    in a holistic solution to monitor cloud-based resources as well as on-premises
    assets. You must be able to quickly detect an attack and to use actionable data
    to improve your response. All that being said, collecting data without analyzing
    it only delays the response process. That''s why it is so important to use tools
    that leverage technologies such as behavior analytics, threat intelligence, and
    machine learning for data correlation. Azure Security Center will do that for
    you, and it will reduce false positives and show what''s relevant for you to proceed
    with your investigation.'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# Assume breach mentality


    Microsoft recognizes the fact that preventing a breach is not enough. Microsoft
    haven''t "given up" or "thrown the white flag" and continue to use all the traditional
    prevent-breach processes and technologies. However, in addition to those, we realize
    that we must do more. That "more" is encompassed by a philosophy of "assume breach."
    An assume-breach mentality that while we hope that we will never be breached,
    we know that hope is a poor strategy. Therefore, we assume that our cloud network
    is about to be breached—or has already been breached—and then come up with people,
    processes, and technology that will help us out when the breach occurred as early
    as possible, discover when breach occurred, and then eject the attacker with the
    goal being to limit expansion of the breach as much as possible.


    We use the breach approach to help us understand how attackers gain access to
    the system and then develop methods that enable us to catch the attacker as soon
    as possible after the breach takes place. Because attackers typically enter a
    system via a low-value target, if we can detect quickly when the target has been
    compromised, we can block the attacker from expanding outward from the low-value
    asset to higher-value assets. These high-value assets are the attacker''s ultimate
    target.


    How do we do this? One effective method is us to use red teaming or red/blue team
    simulations. In these exercises, the red team takes on the role of the attacker,
    and the blue team takes on the role of defender. We define the parameters of the
    exercise. Then, for the agreed-upon duration of the exercise, the red team tries
    to attack the Azure infrastructure and the Blue Team try to discover what the
    Red Team has done and attempts to block the red team from compromising addition
    systems. (Of course, the blue team''s goal is to thwart the red team''s attempts
    to compromise the blue team''s systems).


    At the end of the exercise, the red and blue teams discuss what happened. Specific
    topics to discuss include


    +   - The red team might have gotten in;

    - How the blue team discovered and ejected the red team;

    - New technologies and operational procedures that make discovering comprised
    systems faster and easier.


    # Cloud threats and security


    As explained at the beginning of this chapter, cloud weaponization is happening,
    and current data exposed in the Microsoft Security Intelligent Report Volume 22
    shows the global outreach of these attacks. According to these reports, more than
    two-thirds of incoming attacks on Azure services in the first quarter of 2017
    from IP addresses in China (35.1%), the United States (32.5%), and Korea (3.1%).
    The remaining attacks were distributed in 116 other countries and regions. Sometimes,
    threat actors will weaponize the cloud to send an attack to a target system, as
    shown in Figure 1–4. Other times, attackers will simply hijack resources of the
    target system.'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'Cryptomining is a rising threat, and when you combine this with the elasticity
    of cloud computing, you have the perfect storm. Let''s say a cloud admin misconfigured
    a Kubernetes, or a Docker registry, this misconfiguration exposed the system to
    allow free public access to it. Attackers could deploy containers that will mine
    my crypto.


    The weaponization of the cloud resources to attack a different target system is
    shown in Figure 1-4. This diagram represents an attacker gaining access to VMs
    located in the cloud and leveraging compute resources from this VMs to attack
    on-premises assets. This is a typical cloud weaponization scenario.


    ![](img/4b11e95292819ab1a383a41ef73aedb4_26_0.png)


    FIGURE 1-4 Cloud weaponization targeting on-premises resources


    Another potential threat in the cloud happens because of flaws in configuration
    and DevOps. One common scenario is the public key secret shared in a public cloud.
    An event like that happened in 2015 when bots were scanning GitHub to steal Amazon
    EC2 keys. The diagram shown in Figure 1-5 illustrates a similar scenario.


    ![](img/4b11e95292819ab1a383a41ef73aedb4_26_1.png)


    FIGURE 1-5 Public secret attack scenario'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'MORE INFO You can find more information about the Github bot at https://www.the
    register.co.uk/2015/01/06/dev_blunder_shows_github_crawling_with_keyslurping_bots.


    Attackers are also shifting efforts to evade detections by Cloud workload-Protection
    Platforms. In January 2019, a report from Palo Alto Networks showed how a malware
    used by the Rocke group developed a capability to uninstall the CWPP agent before
    the malware began signs of malicious behavior. Cloud Providers must act quickly
    to remediate scenarios like this, and when you are selecting your CWPP, you need
    to be aware of how those CWPPs respond to new threats alike.


    MORE INFO For more information about the Palo Alto Networks report, see https://unit42.paloaltonnetworks.com/malware-used-by-rocke-group-evolves-to-evade-detection-by-cloud-security-products/


    For this reason, it is imperative that before adopting cloud computing, organizations
    must first understand the security considerations that are inherited by the cloud
    computing model. These considerations must be revised before adopting—ideally
    during the planning process. Without a full understanding of cloud security considerations,
    the overall successful adoption of cloud computing may be compromised.


    Consider the following areas for cloud security:


    +   * Compliance

    * Risk management

    * Identity and access management

    * Operational security

    * Endpoint protection

    * Data protection


    Each of these areas must be considered; some areas can be explored in more depth
    others, depending on the type of business that you are dealing with. The sections
    that follow low describe each of these scenarios in more detail.


    # Compliance


    During the migration to the cloud, organizations need to retain their own compliance
    obligations. These obligations could be dictated by internal or external regulations,
    such as industry standards that they need to be compliant in order to support
    their business models. Cloud providers must be able to assist customers to meet
    their compliance requirements via cloud adoption.


    In many cases, cloud solution providers (CSP) will become part of the customer''s
    chain of compliance. Consider working closely with your cloud provider to identify
    your organization''s compliance needs and verify how the provider can fulfill
    your requirements. It is also'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'important to verify whether CSP has a proven record of delivering secure and
    reliable cloud services while keeping customers'' data private and secure.


    > **MORE INFO** For more information on Microsoft''s approach to compliance, see
    https://www.microsoft.com/en-us/trustcenter/default.aspx.


    Ideally, your Cloud Security Posture Management (CSPM) platform will enable you
    to map the security controls that are applied to your cloud workloads to major
    regulatory compliance standards.


    # Risk management


    Cloud customers must be able to trust the CSP with their data. CSPs should have
    policies and programs in place to manage online security risks. These policies
    and programs vary depending on how dynamic the environment is. Customers should
    work closely with CSPs and demand full transparency to understand risk decisions,
    how these risks vary depending on data sensitivity, and the level of protection
    required.


    > **NOTE** Microsoft uses mature risk-management processes that are based on long-term
    experience delivering services on the web.


    # Identity and access management


    Organizations planning to adopt cloud computing must be aware of the identity-
    and access-management methods available and of how these methods will integrate
    with their current on-premises infrastructures.


    These days, with users working on different devices from any location and accessing
    apps across different cloud services, it is critical to keep the user''s identity
    security. Indeed, with cloud adoption, identity becomes the new perimeter—the
    control panel for your entire infrastructure, regardless of the location, be on-premises
    or in the cloud. You should use the user''s identity to control access to any
    services from any device and to obtain visibility and insights into how your data
    is being used.


    As access management, organizations should consider auditing and logging capabilities
    that can help administrators monitor user activity. Administrators must be able
    to leverage the cloud platform to evaluate log-on activity and to take preventive
    actions directly from the identity-management portal.


    # Operational security


    Organizations migrating to the cloud should evolve their internal processes—security
    monitoring, auditing, incident response, and forensics—accordingly. The cloud
    platform must enable IT administrators to monitor services in real time to observe
    the health conditions of these ser'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'vices and provide capabilities to quickly restore services that were interrupted.
    You should also ensure that deployed services are operated, maintained, and supported
    in accordance with the service-level agreement (SLA) established with the CSP.


    # Endpoint protection


    Cloud security is not only about the security of the CSP infrastructure; it is
    a shared responsibility. Endpoint protection is one aspect of security for which
    organizations are responsible. Organizations that adopt cloud computing should
    consider increasing endpoint security because these endpoints will be exposed
    to more external connections and access apps that may be housed by different cloud
    providers.


    Users are the main target of attacks, and an endpoint might be a user''s workstation,
    a user''s smartphone, or any other device that may be employed to access cloud
    resources. Attackers know that the user is the weakest link in the security chain,
    and attackers will continue to use in social-engineering techniques, such as phishing
    emails, to entice users to perform actions that can compromise an endpoint.


    > IMPORTANT Securing privileged access is a critical step to establishing security
    assurances for business. Make sure to read more about Privileged Access Workstations
    at://://.ms/cyberpaw and know more about Microsoft''s methodology for protecting
    high-value assets.


    One approach to enable the end-to-end visibility of your endpoint protection and
    your cloud workloads is the integration of your Cloud Workload Protection Platform
    (CWPP) with your Endpoint Detection and Response (EDR) solution.


    # Data protection


    Regarding cloud security, the goal when migrating to the cloud is to ensure that
    data is secure no matter where it is located. Data might exist in any of the following
    states and locations:


    +   - Data at rest on the user''s device: In this case, the data is located at
    the endpoint, which can be any device. You should always enforce data encryption
    at rest for company-owned devices and in BYOD scenarios.

    - Data in transit from the user''s device to the cloud: When data leaves the user''s
    device, you should ensure that the data is protected. There are many technologies
    that can encrypt data regardless of its location—for example, Azure Rights Management.
    It is also imperative to ensure that the transport channel is encrypted. Therefore,
    you should enforce the use of Transport Layer Security (TLS) to transfer data.

    - Data at rest in the cloud provider''s datacenter: When data arrives at the cloud
    provider''s servers, the CSP''s storage infrastructure should ensure redundancy
    and protection. Make sure you understand how your CSP performs data encryption
    at rest, who is responsible for managing the keys, and how data redundancy is
    performed.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '■ Data transit from the cloud to on-premises In this case, the same recommendations
    specified in the "Data in transit from the user''s device to the cloud" bullet
    policy. You should enforce data encryption on the file itself and encrypt the
    transport layer.


    ■ Data at rest on-premises Customers are responsible for keeping their data secure
    on-premises. Encrypting at-rest data at your datacenter is a critical step to
    accomplish this. Ensure that you have the correct infrastructure to enable encryption,
    data redundancy, and key management.


    # Azure Security


    There are two aspects of Azure Security—that is, how Microsoft keeps its Azure
    platform security against attackers. The other is the Azure Security capabilities
    that Microsoft offers to customers who use Azure.


    The Azure infrastructure uses a defense-in-depth approach by implementing security
    controls in different layers. This ranges from physical security, to data security,
    to identity and access management, and to application security, as shown in Figure
    1-6.


    FIGURE 1-6 Multiple layers of defense


    > IMPORTANT This book does not cover the Azure Security infrastructure in depth.
    For more information about this, read Microsoft Azure Security Infrastructure,
    by Tom Shinder, Debra Shinder, and Yuri Diogenes, from Microsoft Press.


    From the Azure subscription-owner perspective, it is important to control the
    user''s identity and roles. The subscription owner or account administrator is
    the person signed up for the Azure subscription. This person is authorized to
    access the Account Center and to perform all management tasks. With a new subscription,
    the account administrator is also the service administrator and inherits rights
    to manage the Azure Portal. Customers should be very cautious about who has access
    to this account. Azure administrators should use Azure''s role-based access control
    (RBAC) to grant appropriate permission to users.'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'Once a user is authenticated according to his or her level of authorization,
    person will be able to manage his or her resources using the Azure Portal. This
    is a unified hub that simplifies building, deploying, and managing your cloud
    resources. The Azure Portal also calculates the existing charges and forecasts
    the customer''s monthly charges, regardless of the amount of resources across
    apps.


    A subscription can include zero or more hosted services and zero or more storage
    accounts. From the Azure Portal, you can provision new hosted services, such as
    a new VM. These VMs will use resources allocated from compute and storage components
    in Azure. They can work in silos within the Azure infrastructure, or be publicly
    available from the Internet. You can securely publish resources that are available
    in your VM, such as a web server, and have access to these resources using access
    control lists (ACLs). You can also isolate VMs in the cloud by creating different
    virtual networks (VNets) and controlling traffic between VNets using security
    groups (NSGs).


    # VM Protection


    When you think about protecting VMs in Azure, you must think holistically. That
    is, not only you must think about leveraging built-in Azure resources to protect
    the VM, you must also think about protecting the operating system itself. For
    example, you should implement security best practices and update management to
    keep the VMs up to date. You should also monitor access to these VMs.


    Some VM operations include the following:


    +   * Configuring the monitoring and export events for analysis

    * Configuring Microsoft antimalware or an AV/AM solution from a partner

    * Applying a corporate firewall using site-to-site VPN and configuring endpoints

    * Defining access controls between tiers and providing additional protection via
    the OS firewall

    * Monitoring and reporting to alerts


    > **IMPORTANT** For more details about Compute security, visit https://docs.microsoft.com/en-us/azure/security/security-virtual-machines-overview.


    # Network protection


    Azure virtual networks are very similar to the virtual networks you use on-premises
    with your own virtualization platform solutions, such as Hyper-V or VMware. Azure
    uses Hyper-V, so you can take advantage of the Hyper-V virtual switch for networking.
    You can think of the Hyper-Virtual switch as representing a virtual network interface
    to a VM''s virtual network interface connects. Figure 1-7 illustrates how Azure
    virtual networks are distributed in a multitenant environment.'
  merge: -1
  img_proc: true
