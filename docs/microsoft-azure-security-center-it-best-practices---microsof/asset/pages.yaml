  md: '# Threat detection


    Up to now you''ve learned how to reduce the attack surface by addressing security
    recommendations using Azure Security Center, which is part of the overall enhancement
    of your security posture. However, protection is just one of the pillars of your
    security posture. You also need to enhance your detection and response.


    On the detection front, Security Center constantly monitors your assets. When
    it identifies suspicious activities, it raises an alert. Importantly, it also
    reduces false positives, which is very important for your security operations.


    In this chapter, you will learn how to use Security Center to detect threats against
    your environment, and how to investigate security issues as part of your incident-response
    process.


    # Methods of threat detection


    The information gathered by Security Center in conjunction with network data and
    feeds from connected partners is used to detect threats and suspicious activities.
    Security Center analyzes this information by correlating the data from these sources
    to identify threats. Security alerts are prioritized in Security Center along
    with recommendations on how to remediate the threat.


    > IMPORTANT Security alerts are not available in the free-tier version of Security
    Center; the standard tier is required.


    Security Center uses advanced security analytics and machine-learning technologies
    to evaluate events across the entire cloud fabric. The security analytics includes
    data from multiple sources, including Microsoft products and services, the Microsoft
    Digital Crimes Unit (DCU), the Microsoft Security Response Center (MSRC), and
    external feeds. Security Center also applies known patterns to discover malicious
    behavior, which is called behavioral analysis. Security Center uses statistical
    profiling to build a historical baseline, which'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'is called anomaly detection. This triggers alerts when it detects deviations
    from established baselines that conform to a potential attack vector.


    Regardless of which capability Security Center uses to identify a threat, the
    result will be externalized in the dashboard as a security alert. A security alert
    contains valuable information about what triggered the alert, the resources targeted,
    the source of the attack, and suggestions to remediate the threat. Security alerts
    are divided into categories:


    +   **Virtual Machine Behavioral Analysis (VMBA):** This type of alert uses behavioral
    analytics to identify compromised resources based on an analysis of the virtual
    machine (VM) event logs, such as process-creation events, in memory only (fileless
    attack), and login events.


    +   **Network analysis:** This type of alert collects security information from
    your Azure Internet Protocol Flow Information (IPFIX) traffic and analyzes it
    to identify threats. An example of an alert that belongs to this category is the
    Suspicious Incoming RDP Network Activity From Multiple Sources.


    +   **Resource analysis:** This analyzes your Platform as a Service (PaaS) services,
    such as Azure SQL, and triggers alerts based on this analysis. An example of an
    alert that be-long to this category is the *Potential SQL Injection* alert.


    +   **Contextual information:** This provides extra context to reach a verdict
    about the nature of the threat and how to mitigate it.


    > **IMPORTANT** Because the list of alerts is constantly evolving, we recommend
    that you visit https://aka.ms/ASCAlerts to obtain the latest list of security
    alerts.


    # # Understanding alerts


    Before Security Center triggers an alert, it needs to have a certain level of
    certainty that the alert is a *true* positive. The intent is to reduce false positive
    results and provide a high-quality alert level. To accomplish that, Security Center
    performs the following actions shown in Figure 6-1 during the alert normalization.'
  merge: -1
  img_proc: true
- pgno: 132
  md: '![](img/4b11e95292819ab1a383a41ef73aedb4_132_0.png)


    FIGURE 6-1 Evaluation priority to trigger an alert


    When an alert is finally triggered, you will be able to answer five questions
    that are important for your investigation. The questions are shown in the Alert
    blade, as shown in Figure 6-2.


    ![](img/4b11e95292819ab1a383a41ef73aedb4_132_1.png)


    FIGURE 6-2 The alert blade has the answers for the major investigation''s questions'
  merge: -1
  img_proc: true
- pgno: 133
  md: 'It is important to emphasize that not all alerts will have the same level of
    information; it really depends on the type of threat and the analytics for that
    threat. Also, alerts will take differing amounts of time to trigger. Security
    Center has three major detection engines that will dictate the time for an alert
    to be triggered.


    +   - Event-based detection engine: The event-based detection engine will trigger
    alerts near time.

    - Query-based detection engine: The query-based detection engine works on different
    events from different sources before triggering an alert, which by nature, will
    take more time.

    - Batch process detection engine: The batch process detection engine will run
    parallel analytics on large-scale datasets, which can take even longer.


    # Accessing security alerts


    The number of security alerts you see in the Security Center dashboard may vary
    depending on the amount of resources that you are monitoring with Security Center
    and the business itself. Some organizations receive more alerts than others, and
    as a result, they have more security alerts.


    If you dont have any security alerts in your environment, simulate one by following
    the procedures in the article at https://aka.ms/ASCalertValidation. Once you have
    an alert, follow these steps to access it:


    +   1. Open the Azure Portal and sign in as a user who has Security Admin privileges.

    2. In the left pane, click Security Center.

    3. In the left pane of the Security Center window, under Threat Protection, click
    Security Alerts. The Security Alerts dashboard appears (see Figure 6-3).


    ![](img/4b11e95292819ab1a383a41ef73aedb4_133_0.png)


    FIGURE 6-3 Security Alerts dashboard'
  merge: -1
  img_proc: true
