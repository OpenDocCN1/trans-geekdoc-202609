- pgno: 90
  md: '# Leveraging machine learning for hardening network traffic


    The biggest attack surfaces for workloads running in the public cloud is connections
    to and from the public. Our customers find it hard to know which network security
    group (NSG) rules should be in place to make sure that Azure workloads are only
    available to required source ranges.


    With the Adaptive Network Hardening feature, Azure Security Center learns the
    network connectivity and patterns of your Azure workloads and provides NSG rule
    recommendations for your internet-facing virtual machines. This helps you better
    configure your network access policies and limit your exposure to attacks, even
    when there are already filtering rules in place, as the filtering rules may be
    too permissive or the actual traffic flowing through the NSG is a subset of the
    NSG rules defined. In this case, you can further improve the security posture
    by hardening the NSG rules, based on the actual traffic patterns.


    For example, let''s say the existing NSG rule is to allow traffic from 140.20.30/14
    on port 22. Based on the analysis, the adaptive network hardening''s recommendation
    would be to narrow the range and allow traffic from 140.23.30/29 – which is a
    narrower IP range, and deny all traffic to that port.


    Azure Security Center uses machine learning to fully automate this process, including
    an automated enforcement mechanism, enabling customers to protect their internet-facing
    virtual machines with only a few clicks. These recommendations also use Microsoft''s
    extensive threat intelligence reports to make sure that known bad actors are blocked.


    Additionally, Azure Security Center will alert users when traffic is identified
    from IPs that aren''t recommended by the algorithm.


    Oren Parag, Senior Program Manager, Azure Security Center Team


    # Enable Network Security Groups on subnets


    A Network Security Group (NSG) contains a list of security rules that allow or
    deny network traffic to resources connected to Azure Virtual Networks (VNet).
    NSGs can be associated with VMs, NICs, and subnets. Security Center will verify
    if your subnet needs to have an NSG to be more secure, and if it does, Security
    Center will create a network recommendation for it.'
  merge: -1
  img_proc: true
