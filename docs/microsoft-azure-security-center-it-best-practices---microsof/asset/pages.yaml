- pgno: 18
  md: '# Introduction


    Welcome to Microsoft Azure Security Center, a book that was developed together
    with the Azure Security Center product group to provide in-depth information about
    Azure Security Center and to demonstrate best practices based on real-life experience
    with the product in different environments.


    The purpose of this book is to introduce the wide array of security features and
    capabilities available in Azure Security Center. After being introduced to all
    these security options, you will dig in to see how they can be used in a number
    of operational security scenarios so that you can get the most out of the protect,
    detect, and respond skills provided only by Azure Security Center.


    # Who is this book for?


    Microsoft Azure Security Center is for anyone interested in Azure security: security
    administrators, support professionals, developers, and engineers.


    Microsoft Azure Security Center is designed to be useful for the entire spectrum
    of Azure users. You can have no security experience, some experience, or be a
    security expert and get value from Azure Security Center. This book provides introductory,
    intermediate, and advanced coverage on a large swath of security issues that are
    addressed by Azure Security Center.


    The approach is a unique mix of didactic, narrative, and experiential instruction.
    Didactic covers the core introductions to the services. The narrative leverages
    what you already understand, and we bridge your current understanding with new
    concepts introduced in the book.


    Finally, the experience component is presented in two ways—we share our experiences
    with Azure Security Center and how to get the most out of it by showing in a stepwise,
    guided fashion how to configure Azure Security Center to gain all the benefits
    it has to offer.


    In this book, you will learn:


    +   - How to secure your Azure assets no matter what your level of security experience


    +   - How to save hours, days, and weeks of time by removing the trial and error


    +   - How to protect, detect, and respond to security threats better than ever
    by knowing how to get the most out of Azure Security Center'
  merge: -1
  img_proc: true
