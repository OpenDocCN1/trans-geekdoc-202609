    # # Onboard resources using PowerShell


    In large deployments, you may consider using Security Center PowerShell modules
    to help you quickly perform onboarding operations. To prepare the environment
    you must first install the Az.Security module using the commands below:


    ```

    Set-ExecutionPolicy -Policy AllSigned

    Install-Module -Name Az.Security -Force

    ```


    When you finish, use the Connect-AzAccount PowerShell command to log in to your
    Azure account. Next step is to register your subscriptions to the Security Resource
    Provider.'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'Run the commands below, and make sure to replace the <subscription ID> field
    with your subscription number, which can be obtained using the command Get-AzSubscription.


    ```

    Set-AzContext -Subscription "subscription ID"

    Register-AzResourceProvider -ProviderNamespace ''Microsoft.Security''

    ```


    At this point you can start performing operations that you need to onboard Security
    Center in your subscription. Usually the first one is to upgrade from Free to
    Standard tier. You will set the context for the subscription that you want to
    upgrade, and then you perform the upgrade using the following commands:


    ```

    Set-AzContext -Subscription "subscription ID"

    Set-AzSecurityPricing -Name "default" -PricingTier "Standard"

    ```


    You can use Get-AzSecurityPricing to verify if your subscription was correctly
    upgraded to standard. If you already have a workspace and want to connect Security
    Center to this workspace, use Set-AzSecurityWorkspaceSetting command. You will
    need the Workspace ID to perform this operation, and you can retrieve this ID
    using Get-AzSecurityWorkspaceSetting. Another common operation to perform at this
    stage is to enable auto provisioning, for that use the following command:


    ```

    Set-AzAutoProvisioningSetting -Name "default" -EnableAutoProvisioning

    Set-AzSecurityContact -Name "YourName" -Email "youremailaddress" -Phone "yourphone"

    -AlertAdmin -NotifyOnChange

    ```


    To verify if the auto provisioning was correctly enabled, use the Get-AzAutoProvisioningSetting
    command. Last operation that is recommended to do is to configure the security
    contact information for email notifications. To configure this option, use the
    command below:


    You can use Get-AzSecurityContact to verify if your settings were configured properly.
    There are many ways to monitor your Azure tenant for the inclusion of new subscriptions
    and automatically onboard these subscriptions using PowerShell. For a sample of
    how to automate this scenario, visit http://aka.ms/upgradeazstandard.


    # Why Azure Security Center?


    A common trope in the cybersecurity industry goes something like: "There are only
    two types of companies: those that have been hacked, and those that will be."
    A different, and my preferred, version of that meme is: "There are only two types
    of companies: those that know they''ve been hacked, and those that don''t."'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'Now this isn''t meant to doom-and-gloom, nor a sky-falling admonishment not
    to use the Cloud. Cloud Computing in all its forms—LaaS, SaaS, microservices,
    and more—can provide significant advantages to any organization. Specific to the
    security of an organization, I will even say that Cloud Computing has the potential
    to make you more secure than you ever had a chance to be in your on-premises environment.
    Skeptical? Read on.


    Industry analysts (of course cloud vendors) have long lauded the advantages of
    scale-up and scale-out for your company''s servers, services, and applications.
    But what about taking scale-up and scale-out capability, and pointing it towards
    the problem of cybersecurity? And what if we could use scale-up and scale-out,
    not just to secure your infrastructure, but to increase the security of every
    Azure customer at large? Enter the Microsoft Intelligent Security Graph (See https://www.microsoft.com/en-us/security/intelligence).


    By applying the massive compute, storage, and machine-learning capabilities of
    Azure to solve the problem of “How can we better secure our customers?” Microsoft
    has developed a Security Intelligence service based on security signals that we
    receive from myriad sources—Office 365, Microsoft Account (formerly Windows Live
    ID), the Digital Crimes Unit, and the Azure cloud platform itself. By analyzing
    the traffic from these sources—450 authentication events per month and 400 billion
    emails—Microsoft can identify and respond to both existing and emerging threats
    originating from all over the Internet and protect our customers in an rapid fashion.


    Azure Security Center is not the only Microsoft service that relies on the Security
    Graph, but the advantages that ASC receives from the Graph are numerous—we have
    accurate data concerning new and emerging botnets, Command & Control networks,
    and new forms of malware that attackers are using to target our customers. And
    what the Graph learns from one customer, it will feed into ASC so that we can
    use this learning to protect all our customers.


    Imagine having an army of security analysts working day and night to research
    emerging cybersecurity threats and identify actual instances of malicious behaviors
    targeting your Azure resources so that you can respond and protect your critical
    assets in a rapid manner. With ASC you''re not imagining it—you have that capability
    built right into the service with no additional work needed on your part.


    Laura E. Hunter, Principal Program Manager, Identity Security CxE'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# Policy management


    Security policy in Azure Security Center reflects directly on the security recommendations
    that will be triggered according to your Azure workloads. Because each organization
    has its own set of requirements, it is important to evaluate which policies should
    be enabled on your subscriptions and which policies are not applicable for your
    scenario.


    In this chapter, you will learn how security policy in Security Center integrates
    with Azure Policy and how this integration can be used to better monitor workloads
    in Azure.


    # Integration with Azure Policy


    It''s well-known in all areas of IT (enterprise, small business, and even start
    up) that policy-based management streamlines and increases the effectiveness of
    IT operations. This is especially true with security, where the combination of
    technologies and processes become a potent weapon. In fact many know that if the
    right policies are in place—and those policies are carried out assiduously—then
    even less optimal technology can effectively protect the organization.


    With this in mind, Azure Policy was introduced. Azure Policy allows you to create,
    assign, and manage a variety of policy definitions. Security Center Policies are
    driven by overarching Azure Policies, which improves the overall reach and management
    of your Security Center Policies policies. Policy definitions can be compared
    with your current configuration, and any resources that do not meet the requirements
    of your policy are determined to be out of compliance. You can then focus on the
    out-of-compliance assets and bring them into compliance.


    A policy assignment is a policy definition that has been assigned to take place
    within a specific scope. A scope might range from an Azure management group to
    a resource group. A management group enables you to manage access, policy, costs,
    and compliance across subscriptions. The term “scope” refers to all the resource
    groups, subscriptions, and management groups to which the policy definition is
    assigned. Policy assignments are inherited by all child resources.'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'An initiative definition is a collection of policy definitions that is tailored
    toward achieving a singular overarching goal. Initiative definitions simplify
    the management and assignment of policy definitions. They simplify policy assignments
    by grouping a set of policies into a single item—an initiative definition. Figure
    3-1 shows components.


    # Initiative


    # Policy Definition


    # Policy parameters in JSON format


    ![](img/4b11e95292819ab1a383a41ef73aedb4_67_0.png)


    FIGURE 3-1 Azure Policy components


    While having this understanding of Azure Policy is important, you don''t need
    to create any initiative or policy when using Security center center policy integration
    with Azure Policy because Security Center will automatically create it for you.
    The default initiative is ASC Default (subscription:your_subscription_id), and
    it contains all security policies. The number of policies will keep changing as
    the Security Center Engineering team continues adding new services to monitor
    and creating new recommendations, which will be reflected as new policies. To
    access Azure Policy and see the Security Center initiative and policies, follow
    these steps:


    +   1. Open the Azure Portal and sign in with a user who has Security Admin privileges.


    +   2. In the left navigation pane, click All Services and type Policy; the Policy
    blade appears, as shown in Figure 3-2.


    ![](img/4b11e95292819ab1a383a41ef73aedb4_67_1.png)


    FIGURE 3-2 Azure policy dashboard'
