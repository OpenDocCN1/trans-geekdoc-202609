    # Leveraging machine learning and the power of the cloud to prevent threats


    Historically, host security solutions have focused more on preventing threats
    and less sophisticated ways to detect them as quickly as possible. This assume-breach
    mindset remains important. However, if attacks continue to increase in sophistication
    and complexity, then attempting to reduce the attack surface also becomes necessary.'
