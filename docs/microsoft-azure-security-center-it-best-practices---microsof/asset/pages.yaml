- pgno: 140
  md: '# Azure App Services detections


    Azure App Service is a service for hosting web applications, REST APIs, and mobile
    back ends. It enables you to develop in many languages, such as .NET, .NET Core,
    Java, Ruby, Node.js, PHP, or Python. Applications run and scale on Windows and
    Linux. Security Center leverages the scale of the cloud to identify attacks on
    App Service applications while focusing on emerging attacks while attackers are
    in the reconnaissance phase, scanning to identify vulnerabilities across multiple
    websites hosted on Azure.


    Security Center''s App Service detection includes analytics and machine-learning
    models that cover all interfaces allowing customers to interact with their applications,
    whether it''s over HTTP or through one of the management methods.


    # App Services detections in Azure Security Center


    Azure recently announced that it leverages the scale of the cloud to identify
    attacks targeting customers'' applications. With web applications being practically
    in any modern network, attackers probe to find and exploit weaknesses.


    Before being routed to specific environments, requests to applications running
    go through several gateways when they are inspected and logged. This data is then
    used to identify exploits and attackers and to learn new patterns that will be
    used later. By leveraging Azure''s visibility as a cloud provider, Security Center
    analyzes App Service internal logs to identify attack methodology on multiple
    targets, as widespread scanning and distributed attacks.


    These types of attacks typically come from a small subset of IPs, and they exhibit
    patterns of crawling to similar endpoints on multiple hosts and searching for
    a particular vulnerable page or plugin. This can easily be detected using cloud
    capabilities but cannot be identified from a single host. Security Center also
    has access to the underlying sandboxes and VMs. Together with memory forensics,
    the infrastructure can tell the story, from a new attack circulating in the wild
    to compromises in customer machines. Thus, Security Center can detect attacks
    against web applications long after being exploited.


    Ram Pliskin, Senior Program Manager, Azure Security Center Team'
  merge: -1
  img_proc: true
- pgno: 141
  md: '# Azure Resource detections


    Security Center also has security alerts to detect unusual or potentially harmful
    operations using the Azure Resource Manager (ARM) service layer. This threat protection
    logic allows the detection of known common cloud-environment reconnaissance toolkits
    that are used to map Azure resources, identify insecure configurations, or secure
    persistence for an attacker. Below, you have the most recent attacks that can
    be detected by Security Center:


    +   * MicroBurst toolkit run: This is detection for the cloud-environment reconnaissance
    toolkit called MicroBurst. (See https://github.com/NetSPI/MicroBurst.)

    * Azure toolkit run: This is detection for the cloud-environment reconnaissance
    toolkit called Azure. (See https://github.com/mwrlabs/Azure.)

    * Suspicious management session using an inactive account: This detects suspicious
    behavior based on the subscription''s activity logs.

    * Suspicious management session using PowerShell: This detects suspicious Power-Shell
    activity based on the subscription''s activity logs.


    # The cyber kill chain and fusion alerts


    The cyber kill chain is a threat model described in 2011 by analysts from Lockheed
    Martin. The model was designed to help security teams and researchers organize
    their thinking detecting and responding to threats. The model is now generally
    accepted and is part of the general lexicon of all security professionals.


    The original cyber kill chain was divided into seven phases:


    +   1. **Reconnaissance** During this phase, the attacker identifies the best
    targets.

    2. **Weaponization** Here, files are altered to weaponize them against a target
    system and are used to install malicious code.

    3. **Delivery** At this point, weaponized files are placed on the target.

    4. **Exploitation** During this phase, weaponized files are detonated—that is,
    they run on the victim system.

    5. **Installation** At this point, a back door is installed on the compromised
    system, giving the attacker persistent access.

    6. **Command and control (C&C)** Here, malware on the compromised system communicates
    with a C&C system that gives the attacker access to the resources required to
    carry out his or her objective.

    7. **Actions on objectives** At this point, the attacker carries out his or her
    objectives, which may be predefined or have evolved based on discovery.'
  merge: -1
  img_proc: true
- pgno: 142
  md: 'The cyber kill chain was defined when on-premises computing was the norm. Now
    that cloud computing is considered to be a better option, the cyber kill chain
    must be re-evaluated and updated. A reconfiguration of the cyber kill chain might
    include the following phases:


    +   1. **Active recon** In this phase, the attacker uses numerous footprinting
    methods to identify the operating system or services being used, which will be
    the focus of the attack.


    +   2. **Delivery** Most public cloud assets like a logged-on user, attackers
    will need to hack the system—typically by finding unpatched exploits that can
    be leveraged against the system or service.


    +   3. **Exploitation** This phase focuses on problems on the server side instead
    of the client side.


    +   4. **Persistence** Unlike client-side systems, which are rebooted often, server-
    and service-specific systems are rarely rebooted. To remain persistent in the
    system, the exploit code will need to remain in memory. That is the focus of this
    stage.


    +   5. **Internal recon** Attacks against cloud-based systems are server-based.
    Therefore, rather than installing new tools, the attacker can simply use the server''s
    built-in tools to conduct the attack. This helps the attacker remain undiscovered,
    since installing new tools could trigger an alert.


    Now that you have a basic understanding of the cyber kill chain and its intent,
    let''s consider how you can use it to create high-fidelity alerts with Security
    Center. Security Center has a type of alert called a security incident, which
    is raised in the console whenever the system identifies multiple alerts, when
    correlated with each other, indicate that those alerts belong to the same attack.
    A security incident uses the fusion capability, which correlates the alerts that
    appear to relate to each other.


    Figure 6-10 shows an example of what such an attack campaign might look like and
    what alerts might be raised at the various stages of a cyber kill chain. The figure
    shows a highly simplified version of the cyber kill chain, which was outlined
    earlier, to make it easier to understand how fusion alerts work.


    ![](img/4b11e95292819ab1a383a41ef73aedb4_142_0.png)


    **FIGURE 6-10** Security Center detections across the cyber kill chain'
  merge: -1
  img_proc: true
- pgno: 143
  md: 'The sequence in Figure 6-10 goes


    +   1. **Target and attack** In this phase, Azure Security Center detects what
    appears to be a brute-force attack against the Remote Desktop Protocol (RDP) server
    on a VM. This determination is made by comparing a baseline of RDP connections
    to the VM and the current rate of RDP logon, along with other factors related
    to RDP logs.


    +   2. **Install and exploit** Azure Security Center detects the execution of
    a suspicious process on the VM. This suspicious process could be predefined (known-bad
    malware), or it could be a process that wasn''t executed on the machine during
    previous baselines and is therefore unrecognized. (For example, maybe the process
    is launched by software recently installed by the admin. You''ll have to correlate
    this with other events to find out.


    +   3. **Post breach** At this point, Azure Security Center has detected what
    appears to be a communication channel established between the VM and a malicious
    IP address (possibly flagged by a threat-intelligence feed). There''s a very good
    chance that this is bad, but there is still a chance that it isn''t. For example,
    maybe a security researcher or a red-team member working for the customer connected
    to the address on. Yes, a connection to a known-bad IP address is serious, but
    it doesn''t guarantee that the VM has been compromised.


    Each phase of the cyber kill chain by itself indicates that something bad may
    be happening—but it cannot offer complete certainty. However, when you correlate
    these findings, you can be almost 100 percent that the VM has been compromised
    by a brute-force RDP attack, that the attacker has installed and run new malware
    on the machine, and that the malware is communicating with a C&C server (likely
    identified by a threat-intelligence feed).


    In Security Center, you can see the security incidents using the **Security Alerts**
    dashboard. Follow these steps to access this type of alert:


    +   1. In the left pane of the **Security Center** window, under **Threat Protection**,
    click **Security Alerts**. If Security Center has identified a security incident
    in your environment, it will create an alert marked by a different icon. (See
    the first two alerts in Figure 6-11)


    | DESCRIPTION | COUNT | DETECTED BY | ENVIRONMENT... |

    |---|---|---|--|

    | Security incident detected | 1 | Microsoft | Azure |

    | Security incident detected | 1 | Microsoft | Azure |

    | Suspicious SVCHOST process executed | 21 | Microsoft | Azure |

    | Suspicious command execution | 21 | Microsoft | Azure |


    **FIGURE 6-11** Security incidents will appear in the Security Alert dashboard
    with a different icon'
  merge: -1
  img_proc: true
