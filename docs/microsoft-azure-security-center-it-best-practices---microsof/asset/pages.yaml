    The recommendation Secure Score is a calculation based on the ratio between your
    healthy resources and your total resources. If the number of healthy resources
    is equal to the total number of resources, you get the Maximum Secure Score of
    50. To get your Secure Score close to the max score, fix the unhealthy resources
    by following the recommendations. Notice that each recommendation has its Secure
    Score Impact; this allows you to see how much your Secure Score will be impacted
    you address this recommendation. For example, if your Secure Score is 50 and the
    recommendation impact is +5, performing the steps outlined in the recommendation
    will improve your score to 55.


