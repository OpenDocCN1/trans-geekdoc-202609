    IP protocols for management purposes-except possibly for GRE, which uses IP protocol
    47.

    - Allowed IPs: You have two options for this setting: Per request or CIDR block.
    If you choose Per request, whatever IP address is currently assigned to the client
    system will be allowed access to the VM. If you choose CIDR block, you can define
    a collection of IP addresses that client systems must have before they can connect
    to the resource.

    - Max request time: This is the maximum amount of time the user can request access
    to the resource. The default value is 3 hours, but you can allow the user to ask
