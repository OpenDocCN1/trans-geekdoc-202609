- pgno: 210
  md: "+   ■ Line 20 shows that you can specify allowed values, which limits the user\
    \ input.\n■ Line 37 specifies the API version for each Resource Provider.\n■ Line\
    \ 38 and 39 show how a parameter is used.\n■ Line 40 specifies the Resource Provider\
    \ type.\n\nAzure Policy provides you with governance controls for your Azure environment.\
    \ It can stop (deny) from creating non-compliant resources, and it can audit compliance\
    \ (audit and auditIfNotExists). It can even remediate (deployIfNotExists) non-compliant\
    \ resources, either upon creation or for existing resources. The Azure Policy\
    \ definition example shown in Figure A-2 stops the creation of websites in Azure\
    \ that are not HTTPS enabled.\n\n```\n```json\n{\n  \"mode\": \"All\",\n  \"policyRule\"\
    : {\n    \"if\": {\n      \"allOf\": [\n        {\n          \"field\": \"type\"\
    ,\n          \"equals\": \"Microsoft.Web/sites\"\n        },\n        {\n    \
    \      \"not\": {\n            \"field\": \"Microsoft.Web/sites/httpsOnly\",\n\
    \            \"equals\": \"true\"\n          }\n        }\n      ]\n    },\n \
    \   \"then\": {\n      \"effect\": \"deny\",\n      \"details\": {\n        \"\
    type\": \"Microsoft.Web/sites\",\n        \"existenceCondition\": {\n        \
    \  \"field\": \"Microsoft.Web/sites/httpsOnly\",\n          \"equals\": \"true\"\
    \n        }\n      }\n    }\n  },\n  \"parameters\": {}\n}\n```\n```\n\nFIGURE\
    \ A-2 Example of a policy definition where the effect is deny"
