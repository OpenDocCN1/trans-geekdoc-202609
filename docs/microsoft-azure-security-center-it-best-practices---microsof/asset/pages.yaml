- pgno: 34
  md: 'IMPORTANT For more details about Azure DDoS Protection, visit http://aka.ms/ddosprotectiondocs.


    # Leveraging machine learning and cloud scale to protect against DDoS attacks


    Sophistication and frequency of DDoS attacks continue to increase, hitting nearly
    two in five businesses. DDoS attacks are the prevalent cause of service outages
    and deues to be an ever-growing problem. More importantly, DDoS attacks are often
    used as a "smokescreen", masking more malicious and harmful infiltration of resources.
    The technology to create DDoS attacks continues to increase in sophistication
    while the cost and ability to instigate these attacks gets more and more accessible.
    Therefore, the ease and frequency at which criminals can wreak havoc on businesses
    and is driven up.


    Azure DDoS Protection leverages machine learning to automatically build adaptive
    and customized protection policies for each protected application. As the traffic
    flows through the network, Azure''s proprietary machine-learning algorithm picks
    up anomalies in the protected applications are being accessed and initiates DDoS
    mitigation instantaneously. This is made possible by creating unique DDoS protection
    policies for each protected application and protocol (TCP, TCPSYN, and UDP) combination,
    based on the ML algorithms. The service accomplishes this customization using
    two insights:


    +   - Automatic learning of per-customer (per-IP) traffic patterns for Layer 3
    and 4.

    - Minimizing false positives, considering that the scale of Azure allows it to
    absorb a significant amount of traffic.


    When an anomaly is detected in the network pattern (with high enough confidence),
    we send the traffic to our mitigation pipeline for further inspection; there,
    we drop malicious flow and pass only good traffic to the backend application,
    maintaining its availability and performance. We also enrich our algorithms with
    insights gained from other environments in Azure, including our first-party services,
    such as Xbox and Office 365.


    Anupam Vij, Principal Program Manager, Azure Networking


    # Storage protection


    Azure Disk Encryption is a technology that enables you to encrypt the VM disk
    files for your Azure VMs. Azure uses Windows Hyper-V as its virtualization platform,
    so the VMs run on Azure the VHD file format. With Azure Disk Encryption, you can
    encrypt both the operating VHD'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'and any data disk VHD files that you have attached to your VMs. Figure 1-10
    shows the encryption options for the various Azure services that use storage.


    ![](img/4b11e95292819ab1a383a41ef73aedb4_35_0.png)


    **Figure 1-10** Azure network provides isolation even within the same tenant virtual
    network


    Keep in mind that if an attacker somehow manages to access and copy your VM disk
    files, he or she would not be able to mount them. This is because the disks are
    encrypted, and the attacker likely does not have the key required to decrypt them.
    Microsoft recommends that you use this powerful security technology on any VM
    you run on Azure. You should use similar technology on any VMs you run on on-premises
    as well.


    Another option is to use Azure Storage Service Encryption (SSE) for data at rest.
    This service protects your data. When you use this feature, Azure Storage automatically
    encrypts the data prior to persisting to storage and decrypts it prior to retrieval.
    The encryption, decryption, and key-management processes are totally transparent
    to users.


    > **IMPORTANT** For more details about Azure Storage security visit, https://docs.microsoft.com/en-us/azure/security/security-storage-overview.


