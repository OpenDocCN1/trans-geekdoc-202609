- pgno: 54
  md: '# Store additional raw data


    You can store events, logs, and additional security data in your Log Analytics
    workspace. This data allows you to perform auditing, investigation, and analysis
    of your threats.


    # Windows security events


    Select the Windows security events to be collected and stored. When you change
    your selection from here, you start to pay for the stored events


    For additional details:


    +   - All Events

    All Windows security and AppLocker events.


    +   - Continuous

    A standard set of events for auditing purposes.


    +   - Minimal

    A small set of events that might indicate potential threats. By enabling this
    option, you won''t be able to have a full audit trail.


    +   - None

    No security or AppLocker events.


    FIGURE 2-14 Options to control the type of events that will be collected by the
    agent


    Each setting will determine the type of events that will be collected. If you
    are using Group Policy Object (GPO) to configure your servers on which the agent
    will be installed, it is recommended that you enable audit policies by using Creation
    Event 4688 and the CommandLine field inside Audit Process Creation determines
    whether the operating system generates audit events when a process is created
    (starts). Enabling these policies is critical for Security Center to understand
    how a computer is being used. Information includes the name of the program or
    the user that created the process. Below, the events collected by each option
    are summarized:


    +   - All Events: If you select this option, Security Center will collect all
    events. In other words, if you choose this option, there will be no filtering
    of events.


    +   - Common: When you select this option, Security Center surfaces a subset of
    events. Microsoft considers these events—including login and logout events—to
    provide sufficient detail to represent a reasonable audit trail. Other events,
    such as Kerberos operations, security group changes, and more, are included based
    on industry consensus as to what constitutes a full audit trail.


    +   - Minimal: Choosing this setting results in the surfacing of fewer events
    than the Common setting, although we aren''t sure how many or what types of events
    are omitted. Microsoft worked with customers to ensure that this configuration
    surfaces events that successful breaches are detected and that important low-volume
    events are recorded; however, logout events aren''t recorded, so it doesn''t support
    a full user audit trail.


    +   - None: It includes no security alerts and no information from the operating
    system logs or App Locker logs, and it disables security event storage.'
  merge: -1
