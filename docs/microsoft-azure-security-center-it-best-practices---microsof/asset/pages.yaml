- pgno: 198
  md: '# Accessing security alerts from API


    Although Azure Security Center has its own dashboard where you can visualize all
    security alerts, there are some specific scenarios in which you may want to consume
    the alert via API. This is a common scenario among organizations that want to
    build their own dashboards and programmatically manipulate all alerts.


    In this chapter, you will learn how to leverage the built-in Security Center Representational
    State Transfer (REST) API and the Microsoft Graph Security API to retrieve alerts
    using HTTP requests.


    # Understanding REST API


    Representational State Transfer (REST) APIs are service endpoints that support
    sets of HTTP operations (methods), which provide create, retrieve, update, or
    delete access capabilities to the service''s resources. A REST API request/response
    pair can be separated into five components—three for request and two for response—as
    shown in Figure 10-1.


    ![](img/4b11e95292819ab1a383a41ef73aedb4_198_0.png)'
  merge: -1
  img_proc: true
- pgno: 199
  md: "The first part of the request is the request URI, which is the main address.\
    \ This address has\nthe following parts:\n\nStructure: (URI-scheme)://{URI-host}/{resource-path}?{query-string}\n\
    Example: https://management.azure.com/subscriptions/XXX/providers/Microsoft.Security\n\
    alerts/api-version=2019-01-01\n\nThe second part is the HTTP request header, which\
    \ is composed of request HTTP\nmethod, such as GET, HEAD, PUT, POST. Also, you\
    \ may have other optional headers, such as\nauthentication. The third part is\
    \ optional, and it can contain supplementary information that\nvary according\
    \ to the method that was used. For example, a POST method can contain MIME-\n\
    encoded objects, which means you need to specify the Content-type request header\
    \ as well.\n\nThe first part of the response is the HTTP status code, which can\
    \ also vary according to how\nthe backend is responding to this request. If everything\
    \ is working properly and this is a suc-\ncessful request, you should receive\
    \ an HTTP 200 status code. Also, the second field is optional,\\mand it is there\
    \ to support the main response, just as in the previous MIME-encoded example.\n\
    \n# Accessing Alerts using Security Center REST API\n\nSecurity Center has its\
    \ own set of REST API that are divided in operation groups. The available\ngroups\
    \ are described below:\n\n+   - Alerts: These are security alerts on the subscription\
    \ level.\n- Auto Provisioning Settings: These enable you to specify provisioning\
    \ configuration\n the subscription.\n- Compliances: This retrieves regulatory\
    \ compliance information for the subscription.\n- Discovered Security Solutions:\
    \ This retrieves the details about discovered security\nsolutions.\n- External\
    \ Security Solutions: This retrieves the details about partner solutions that\
    \ are\ncurrently integrated with Security Center.\n- JIT Network Access Policies:\
    \ This retrieves policies for protecting resources using Just-\nin-Time (JIT)\
    \ VM access.\n- Locations: This retrieves details of specific locations.\n- Operations:\
    \ This retrieves all available operations.\n- Pricings: This retrieves the pricing\
    \ tier that is in use by Security Center.\n- Security Contacts: This enables you\
    \ to configure the security contact information for\nthe subscription.\n- Tasks:\
    \ This enables you to visualize Security Center recommendations for the scrip-\n\
    t.\n- Workspace Settings: This enables you to configure workspace-related settings.\n\
    \nAs you can see, there are lots of operations that can be performed via API;\
    \ this chapter is\nonly focused on alerts. The Alert call via RESP API has many\
    \ operations that can be performed,"
