    recommendations using Azure Security Center, which is part of the overall enhancement
    of your security posture. However, protection is just one of the pillars of your
    security posture. You also need to enhance your detection and response.


    On the detection front, Security Center constantly monitors your assets. When
    it identifies suspicious activities, it raises an alert. Importantly, it also
    reduces false positives, which is very important for your security operations.


    In this chapter, you will learn how to use Security Center to detect threats against
    your environment, and how to investigate security issues as part of your incident-response
    process.


