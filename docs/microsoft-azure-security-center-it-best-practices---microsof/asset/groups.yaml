    Security Center）对其代理程序收集的数据（例如，安全事件和网络流量日志）使用机器学习算法，为其客户推荐定制的安全的安全策略（例如，应用程序控制规则）。这些算法不仅使用特定客户生成的数据，还通过从相似环境中获取的洞察来丰富这些数据。由
    Azure 安全中心生成并执行的独特策略使用户能够快速应用防护机制，降低其环境对各种风险的暴露率，并帮助客户关注其环境中最重要的问题。


