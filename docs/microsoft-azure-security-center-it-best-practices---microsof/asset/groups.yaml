    \n4. 由 Security Center for IoT IoT 解决方案生成的安全警报将出现在相同的安全警报仪表板中，以可视化其他类型的警报。图 7-8\
    \ 显示了该解决方案生成的警报类型。\n\n5. 在完成输入后，点击 **Run**（运行）。虽然结果会有所不同，图 7-10 显示了它是如何工作的。\n\n\
    > **提示** 有关 Security Center 的更多提示，请访问 http://aka.ms/ASCI\n\n## SIEM 集成\n\n安全信息事件管理（SIEM）被许多组织广泛利用作为数据的单一事实来源。在\
    \ 2019 年，微软发布了名为 Azure Sentinel 的 SIEM 解决方案，它能够处理 Security Center 数据，并集成到其现有的\
    \ SIEM 解决方案。\n\n## 将日志流到 SIEM 解决方案\n\nAzure 安全警报发布到 Azure Monitor，它可以利用事件中心数据。通用过程分为三个主要阶段：\n\
    \n- 创建一个作为数据目的地的事件中心。\n- 将 Azure Monitor 日志流到事件中心。\n- 安装 SIEM 解决方案连接器，从事件中心传输数据。\n\
    \n在本节中，我们将学习如何将 Security Center 与 Azure Sentinel 集成。\n\n## 查询日志\n\n在 Azure Monitor\
    \ 出现之前，每个 Azure 服务都有自己的监控数据方法。收集来自 Azure 服务的数据涉及查询 REST API、读取 Storage 账户，甚至连接服务器。不久后，Azure\
    \ Monitor 被引入了，它是一个平台服务，为所有 Azure 服务提供了一种统一的方法。\n\nAzure Monitor 以企业级规模运行，并通过单一模式和访问点将所有\
    \ Azure 服务的数据路由到 SIEM。这极大简化了与 Security Center 的集成。未来，Azure Monitor 是 Azure 的中央日志，并提供了与\
    \ Splunk 等工具的内置集成。\n\nJohn Kemnetz，计划经理\n\n## Azure Sentinel\n\nMicrosoft Azure\
    \ Sentinel 是一种云原生 SIEM + SOAR 解决方案。它跨企业提供智能安全分析和威胁情报，为警报检测、威胁可见性、主动狩猎和威胁响应提供单一解决方案。\n\
    \nAzure Sentinel 能够跨本地和多个云收集设备、应用程序和基础设施中的数据。Azure Sentinel 利用 Log Analytics 工作区进行数据存储，如图\
    \ 8-1 所示。\n\n![](img/4b11e95292819ab1a383a41ef73aedb4_166_0.png)\n\n 8-1 Azure\
    \ Sentinel 数据接入和存储\n\n## 利用云、机器学习和微软专家的力量来防御你的环境\n\nMicrosoft Azure Sentinel 是第一个由主流云提供构建的云原生\
    \ SIEM + SOAR 解决方案。它支持来自微软产品和 Azure，以及来自本地、合作伙伴和其他云提供的数据源。\n\n对于防御者来说，Azure Sentinel\
    \ 让威胁检测、调查和响应变得更加智能和快速。通过在单一位置拥有所有相关数据，你可以快速关联环境中的信号、获取洞察并启动修复——这一切都在 Azure Sentinel\
    \ 内完成。我们拥有机器学习（ML）模型可以识别跨阶段的攻击（例如，可疑日志后设置了邮件转发规则）。我们还将相关的警报合并并调整其严重程度，这不仅有助于减少警报量，还帮助防御人员关注并优先处理警报。此外，我们支持自带自己的机器学习模型。\n"
