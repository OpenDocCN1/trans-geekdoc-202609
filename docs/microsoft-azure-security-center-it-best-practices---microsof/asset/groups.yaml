  mdcn: "\n\n在微软，我们有事件响应和威胁分析团队，他们工作的一部分就是处理来自不同产品的海量数据。Azure Sentinel 引入了微软的知识和能力，涵盖从特定检测和查询到云端自动化的各个方面。其中一些功能包括：\n\
    \n- 调查可视化。虽然能够以可查询的形式访问所有数据很棒，但有时对攻击以及不同实体和事件之间的关系进行视觉化表示更为有效。Azure Sentinel 提供图表可视化，以便一目了然见、时间线和关系。现在，防御人员也可以做到了。\n\
    \n- 主动狩猎。虽然告报和 ML 模型是识别和调查潜在入侵的强大方式，但我们知道，有时你需要通过数据来查找可疑活动。我们与微软进行主动狩猎的团队密切合作，提供了一系列查询和\
    \ Azure Notebooks，作为这些狩猎行动的起点。\n\n- 自动化修复。通过与 Azure Logic Apps 集成，你可以自动化修复操作。Azure\
    \ Logic Apps 已经提供了许多可用连接器，因此你有许多操作可以执行。例如，你可以执行以下任何操作：\n\n    - 你可以在你的案件管理系统中创建或更新工单。\n\
    \    - 你可以向团队的 Slack 或 Teams 频道发送通知。\n    - 你可以从防火墙中阻止某个 IP。\n    - 你可以为用户请求多因素身份验证。你还可以组合所有操作。\n\
    \n- GitHub 社区。Azure Sentinel 有一个 GitHub 社区，我们将继续提供检测、狩猎查询、Azure Notebooks、解析器和仪表板。你也可以。\n\
    \nAzure Sentinel 缩短了理解环境中发生情况的时间，优先考虑需要采取行动的地方，并确定正确的修复方案。我们刚刚开始这段旅程，期待您的反馈和建议。\n\
    \nLaura Machado de Wright，企业保护与检测团队首席项目经理\n\n启用 Azure Sentinel 需要一个 Azure 订阅、一个\
    \ Log Analytics 工作区、对 Azure Sentinel 所在的订阅拥有贡献者（contributor）权限，以及对工作区所属的资源组拥有贡献者或查看者（viewer）权限。\n\
    \n如果你使用的是 Security Center 创建的默认工作区，那么在尝试启用 Azure Sentinel 时，该工作区不会出现在列表中。背后的原因是，默认工作区是由创建它的服务（在此例中为\
    \ Security Center）管理的。微软希望客户对其区拥有完全控制权，包括管理其 Azure Sentinel 安装的保留期和位置。\n\n> 注意：在本章节编写时，Azure\
    \ Sentinel 仍处于公共预览阶段（Public Preview）。请确保访问 http://aka.ms/azuresentinel 获取最新信息。\n\
    \n## 与 Azure Sentinel 集成\n\n当你配置 Security Center 与 Azure Sentinel 的集成时，Security\
    \ Center 生成的所有安全告警将流向到 Azure Sentinel。要配置此集成，必须在目标订阅中启用标准级（Standard tier）Security\
    \ Center。此外，你需要使用对要连接的每个订阅具有全局管理员或安全管理员权限的用户登录。按照以下步骤配置此集成：\n\n1. 使用 Azure Portal，点击左侧导航窗上的“所有服务”（All\
    \ Services）并输入 Azure Sentinel。\n2. 显示 Azure Sentinel 工作区窗格，你可以选择现有工作区或创建一个新的。由于假设\
    \ Azure Sentinel 已经配置过，请选择与 Security Center 的集成，然后选择你当前正在使用的工作区。\n3. 显示 Azure\
    \ Sentinel 概述页面；在左侧面板的配置（Configuration）部分下，点击“数据连接器”（Data connectors），如图 8-2 所示。\n\
    \n![](img/4b11e95292819ab1a383a41ef73aedb4_168_0.png)\n\nFIGURE 8-2 Azure Sentinel\
    \ 中的配置部分\n\n4. 显示 Azure Sentinel – 数据连接器窗格。在连接器列表中，点击 Azure Security Center，并点击“打开连接器页面”，如图\
    \ 8-3 所示显示 Azure Security Center 连接器窗格：\n\n![](img/4b11e95292819ab1a383a41ef73aedb4_169_0.png)\n\
    \nFIGURE 8-3 Azure Security Center 连接器窗格\n\n5. 在配置（Configuration）部分，点击要启用的订阅旁的“连接”（Connect）。\n\
    6. 关闭窗格，当返回 Azure Sentinel – 数据连接器时，点击刷新（Refresh）按钮。你会发现 Azure Security Center\
    \ 连接器状态显示为“已连接”（Connected），如图 8-4 所示：\n\n![](img/4b11e95292819ab1a383a41ef73aedb4_169_1.png)\n\
    \nFIGURE 8-4 选择带有 Security Center 的订阅\n\n7. 关闭所有窗格并返回 Azure Sentinel 主页。\n\n此时，在\
    \ Security Center 中触发的安全告警将出现在 Azure Sentinel 中。\n\n## 在 Azure Sentinel 中访问告警\n\
    \nSecurity Center 生成的告警可能会作为“案件”（case）的一部分出现在 Azure Sentinel 中，案件是特定调查的所有相关证据的聚合，并可以包含来自不同数据源的多个告警，如图\
    \ 8-5 所示。\n\n![](img/4b11e95292819ab1a383a41ef73aedb4_170_0.png)\n\nFIGURE 8-5\
    \ Azure Sentinel 使用来自多个数据源的告警执行数据聚合\n\n在图 8-5 所示图中，“可疑 PowerShell 活动”（Suspicious\
    \ PowerShell Activity Detected）是由 Security Center 提出的，如你在“产品名称”（Product Name）字段所示。由于此告警位于工作区中，你可以利用\
    \ Azure Sentinel 的搜索功能获取更多信息。进入 Azure Sentinel 主页，点击导航面板中的“日志”（Logs），你将看到日志页面，如图\
    \ 8-6 所示。\n\n![](img/4b11e95292819ab1a383a41ef73aedb4_170_1.png)\n\nFIGURE 8-6\
    \ Sentinel 日志页面\n\n此搜索页面使用 Kusto 查询语言 (KQL) 进行查询。Kusto 查询是处理数据并返回结果的只读请求。请求以纯文本形式表述，使用旨在使语法易读的数据流模型。查询架构实体按照类似于\
    \ SQL 数据库、表和列的层级结构组织。图 8-6 显示了此工作区的可用架构。这些信息位于“活动”（Active）部分，包括 DnsAnalytics、Security、WindowsFirewall\
    \ 等。\n\n## 使用威胁狩猎发现未被检测的攻击\n\n> 在不断变化的威胁格局下，某些攻击漏掉防线是不可避免的。成熟的安全组织使用威胁狩猎来识别并响应此类攻击。在进行威胁狩猎时，安全分析师必须筛选海量的日志数据。微软在\
    \ Azure Sentinel 中内置了工具，以简化这一过程，并帮助分析师利用微软的经验。\n\nAzure Sentinel 构建在 Log Analytics\
    \ 之上，提供了丰富的 KQL 来过滤、汇总和连接数据集以识别可疑行为。微软威胁情报中心提供了基于多年经验的内置狩猎查询。这些查询可以运行以获得即时结果，且时间投入极少。或者，可以自定义这些查询以针对特定威胁，并适应你环境的具体需求。\n\
    \n一旦分析师发现感兴趣的结果，他们就可以创建“狩猎书签”（Hunting Bookmarks），与同事保存并共享查询及查询结果。分析师还可以通过添加备注和标签来记录上下文观察。所有书签数据都可以使用\
    \ Azure Sentinel 调查体验进行调查，这允许分析师在图形界面中探索 IP 地址、主机和账户等实体之间的关系。该界面也非常适合向那些没有深度参与数据分析的人员视觉化传传递发现。\n\
    \nAzure Sentinel 支持 Jupyter notebooks，这使得分析师能够利用数据科学家和安全分析师社区，使用 ML 和自定义视觉效果来识别威胁。Azure\
    \ Sentinel 预装了专门为目的构建的 Jupyter notebooks，这些笔记本包含自成一体的狩猎工作流。每个笔记本都包含了可视化内容，以便更快速的数据探索。\n\
    \n"
