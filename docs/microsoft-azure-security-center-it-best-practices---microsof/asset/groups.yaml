    # # Detection scenarios


    There are many scenarios in which Security Center will rapidly warn you about
    suspicious activity. The following sections cover some important scenarios to
    give you an idea of how powerful Security Center detections are and the advantage
    of using multiple data sources to enhance the confidence level of an alert.


    # # Detecting spam activity


    In this scenario, the attacker compromises an Azure VM and uses the compromised
    VM to send spam emails. Using machine learning, Security Center can detect a spike
    in SMTP traffic. It then queries other data sources to make sure this spike is
    because of malicious behavior. Finally, it correlates this traffic with the Office
    365 spam database to determine whether it is legitimate traffic. If the result
    of this correlation is that the traffic is suspicious, Security Center triggers
    the alert shown using built-in analytics, machine learning, and threat intelligence
    from Office 365. Performing these three steps provides not only more precise detection
    but also a higher level of confidence in the alert.


    ![](img/4b11e95292819ab1a383a41ef73aedb4_135_0.png)


    **Figure 6-6** Spam alert in Security Center'
