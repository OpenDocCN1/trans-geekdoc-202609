    要配置此选项，请遵循以下步骤：


    - 1. 在左侧导航区域，点击“安全中心”（Security Center）。

    - 2. 在安全中心的左侧导航中，在“策略与合规”（Policy & Compliance）下，点击“安全策略”（Security Policy），点击您想要配置的订阅旁“编辑设置”（Edit
    Settings）。

    - 3. 点击“电子邮件通知”（Email notifications），将出现“电子邮件通知”面板，如图 2-24 所示：


    ![](img/4b11e95292819ab1a383a41ef73aedb4_63_0.png)


    **图 2-24** 电子邮件通知设置


    - 4. 在“电子邮件地址”中，输入您想要接收通知的电子邮件。

    - 5. 在“电话号码”字段中，使用国际格式输入您的电话号码（仅一个）。例如：+1-415-555-5555。再次，此号码将用于 Azure 安全服务，以便他们在您的资源可能遭到攻破时与您联系。请务必定期审核此号码；将其放入您的策略和程序文档中以便进行审查，因为很容易忘记在这里填写的是什么号码，而且该号码随时可能会更改。

    - 6. 在“电子邮件通知设置”下，确保同时勾选这两个选项。

    - 7. 点击“保存”。


    ## 使用 PowerShell 置入资源


    在大规模部署中，您可以考虑使用 Security Center PowerShell 模块来帮助您快速执行置入操作。要准备环境，您必须先使用以下命令安装 Az.Security
    模块：


    ```

    Set-ExecutionPolicy -Policy AllSigned

    Install-Module -Name Az.Security -Force

    ```


    完成后，使用 `Connect-AzAccount` PowerShell 命令登录您的 Azure 账户。下一步是将您的订阅注册到安全资源提供程序（Security
    Resource Provider）。


    运行以下命令，并将 `<subscription ID>` 字段替换为您的订阅号，您可以通过 `Get-AzSubscription` 命令获取。


    ```

    Set-AzContext -Subscription "subscription ID"

    Register-AzResourceProvider -ProviderNamespace ''Microsoft.Security''

    ```


    此时，您可以开始在您的订阅中执行置入安全中心所需的操作。通常第一步是从免费版（Free）升级到标准版（Standard）。您将为想要升级的订阅设置上下文，然后使用以下命令进行升级：


    ```

    Set-AzContext -Subscription "subscription ID"

    Set-AzSecurityPricing -Name "default" -PricingTier "Standard"

    ```


    您可以使用 `Get-AzSecurityPricing` 来验证您的订阅是否已正确升级到标准版。如果您已经有一个工作区并想将安全中心连接到该工作区，请使用
    `Set-AzSecurityWorkspaceSetting` 命令。您需要工作区 ID 来执行此操作，您可以使用 `Get-AzSecurityWorkspaceSetting`
    获取此 ID。在此阶段执行的另一个常见操作是启用自动置入，使用以下命令：


    ```

    Set-AzAutoProvisioningSetting -Name "default" -EnableAutoProvisioning

    Set-AzSecurityContact -Name "YourName" -Email "youremailaddress" -Phone "yourphone"
    -AlertAdmin -NotifyOnChange

    ```


    要验证自动置入是否已启用，请使用 `Get-AzAutoProvisioningSetting` 命令。最后建议的操作是为电子邮件通知配置安全联系人信息。要配置此选项，请使用以下命令：


    您可以使用 `Get-AzSecurityContact` 验证您的设置是否配置正确。有许多方法可以监控您的 Azure 租户是否包含新订阅，并使用 PowerShell
    自动置入这些订阅。有关如何自动化此场景的示例，请访问 http://aka.ms/upgradeazstandard。


    ## 为什么选择 Azure Security Center？


    网络安全行业中有一个常见的调调是：“公司只有两类：已经被黑客攻击过的，以及将来会被黑客攻击的。”这个梗有一个不同的版本，也是我更喜欢的，即：“公司只有两类：知道自己已经被黑客攻击过的，以及不知道自己已经过黑客攻击的。”


    这并不是为了制造恐慌的情绪，也不是对不要使用云服务的严厉警告。所有形式的云计算——IaaS、SaaS、微服务等——都能为任何组织提供显著优势。专门针对组织的安全，我甚至会说，云计算有潜力让您获得比在本地环境中从未可能拥有的更高的安全水平。怀疑吗？请继续下看。


    行业分析师（当然包括云供应商）长期以来一直赞美公司服务器、服务和应用程序纵扩展（scale-up）和水平扩展（scale-out）的优势。但如果将纵扩展和水平扩展的能力指向网络安全问题会怎样？如果我们不仅利用纵扩展和水平扩展来保护您的基础设施，而且还能增加所有
    Azure 客户的安全性呢？这就是微软智能安全图（访问 https://www.microsoft.com/en-us/security/intelligence）。


    通过应用 Azure 强大的计算、存储和机器学习能力来解决“我们如何更好地保护客户”的问题，微软开发了基于从海量来源接收的安全信号的安全智能服务，这些来源包括：Office
    365、微软帐户（原 Windows Live ID）、数字犯罪调查部门以及 Azure 云平台本身。通过分析来自这些源的流量（每月 450 次身份验证事件和
    4000 亿封电子邮件），微软可以识别并响应来自全球互联网的现有和新兴威胁，并迅速保护我们的客户。


    Azure Security Center 不是唯一依赖安全图的微软服务，但 ASC 从图中获得的优势是数多多的——我们拥有关于新和新兴僵尸网络、命令与控制网络（C&C）以及攻击者使用的新型恶意软件的准确数据。从一个客户那里学到的知识将馈给
    ASC，以便我们保护所有的客户。


    想象有一群安全分析师日日夜地研究网络威胁，并识别针对您资源的实际攻击行为，以便我们能够做出响应并保护关键资产。有了 ASC，这种能力内置在服务中，无需您额外工作。


    Laura E. Hunter，身份安全部门首席项目经理


    ## 策略管理


    安全中心中的安全策略直接反映了根据您的工作负载触发的安全建议。由于每个组织都有自己的需求，因此评估哪些策略应该启用、哪些策略不适用于您的场景至关重要。


    在本章中，您将学习安全中心策略如何与 Azure Policy 集成，以及如何利用这种集成来更好地监控工作负载。


    '
