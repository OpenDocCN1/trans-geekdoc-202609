    # Protect your IoT solution with Azure Security Center


    According to a study conducted by Ericsson, the number of IoT devices with cellular
    connections in 2016 was 400 million, and this number will be 1.5 billion by 2022.
    This represents a huge opportunity for many organizations to leverage IoT to enable
    their business to do more. However, it also represents a more challenging threat
    landscape that needs to be addressed from the ground up. Most of the companies
    are far under their current IoT security posture. According to a study led by
    Gemalto, 48 percent of businesses can detect if their IoT devices suffered a breach.
    It comes down again to visibility and control, and that''s where Azure Security
    Center for IoT can assist organizations in their journey to embrace IoT in a secure
    manner.


    In this chapter, you will learn how to use Security Center to monitor your IoT
    solution, detect threats, and investigate suspicious activities on IoT devices.


    > NOTE To read more about the Ericsson study, see https://www.ericsson.com/en/mobility-report/internet-of-things-forecast.
    To read about the Gemalto study, see https://www.gemalto.com/press/pages/almost-half-of-companies-still-can-t-detect-iot-device-breaches-reveals-gemalto-study.aspx.


    # Understanding Security Center for IoT solution


    Security Center for IoT leverages IoT Hub (requires IoT Hub Standard Tier) to
    perform security assessment for IoT devices. Azure IoT is a managed service that
    acts as a central message hub for bidirectional communication between IoT application
    and the device it manages. IoT Hub enables communications from the device to the
    cloud and from the cloud to the device. To accomplish that, IoT Hub supports multiple
    patterns, such as device-to-cloud telemetry, file upload from devices, and request-reply
    methods to control your devices from the cloud.


    The intent of Security Center for IoT is to enable you to see the security state
    of the Azure IoT Solution, with end-to-end analysis and management of security
    posture.'
  - '[PAGE 155]


    Center for IoT provides actionable recommendations to reduce attack surface, and
    it provides real-time threat detection. The diagram shown in Figure 7-1 shows
    this core architecture.


    ![](img/4b11e95292819ab1a383a41ef73aedb4_155_0.png)


    **Figure 7-1** Security Center for IoT core components


    Security Center for IoT requires an agent to be deployed on the device. This agent
    was developed as an open-source project and is available from GitHub. The diagram
    shown in Figure 7-1 assumes that the agent is already installed, and that the
    communication workflow occurs in the following phases:


    +   1. This agent collects raw security events from the underlying operating system
    (Linux or Windows), aggregates raw security events into messages, and sends the
    messages to Security Center (via IoT Hub).

    2. IoT Hub picks up this information from multiple devices, processes it, and
    forwards it to Security Center for IoT service for analysis. This data includes
    device-cloud operation logs, device identities, and IoT Hub configuration. This
    information is necessary for the ASC for IoT analytics pipeline.

    3. Using the analytics pipeline, Security Center for IoT combines all streams
    of information to generate actionable recommendations and alerts.


    > Visit https://github.com/Azure/Azure-IoT-Security-Agent-C for the agent in C,
    and sees https://github.com/Azure/Azure-IoT-Security-Agent-CS for the agent in
    C.


    Security Center for IoT will aggregate and analyze security data from your operating
    system and container system available in Azure IoT Edge. (At the time of writing,
    only Linux is supported.) This information will be converted into actionable security
    recommendations and alerts. The Security Center IoT security module for IoT Edge
    runs in a privileged mode under IoT Edge. This is required to allow the module
    to monitor the operating system and other IoT Edge modules.'
