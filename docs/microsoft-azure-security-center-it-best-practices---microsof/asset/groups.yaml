    intelligence from Office 365. These are three major capabilities working together
    to give you not only a more precise detection, but also a higher level of confidence
    in this alert.


    # Crash dump analysis


    In this scenario, the attacker compromises an Azure VM and installs malware that
    goes undetected by the malware installed on the VM. This malware causes a crash
    in a legitimate program. When a crash occurs in a Windows system, Windows Error
    Reporting (WER) generates a user-mode memory dump file (.dmp), which by default
    is located under %LOCALAPPDATA%CrashDumps. Security Center collects an ephemeral
    copy of the crash dump file and scans it for evidence of exploits and compromises.


    If Security Center finds such evidence, it generates an alert like the one shown
    in Figure 6-7. This alert indicates that the crash dump analysis has detected
    executable code behavior that is commonly performed by malicious payloads. Although
    non-malicious software may perform this behavior, it is not a typical development
    practice. Follow the remediation steps to investigate this issue further.


    ![](img/4b11e95292819ab1a383a41ef73aedb4_136_0.png)


    FIGURE 6-7 Crash dump analysis alert'
