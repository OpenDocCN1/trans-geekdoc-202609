    data from multiple sources, including Microsoft products and services, the Microsoft
    Digital Crimes Unit (DCU), the Microsoft Security Response Center (MSRC), and
    external feeds. Security Center also applies known patterns to discover malicious
    behavior, which is called behavioral analysis. Security Center uses statistical
    profiling to build a historical baseline, which'
