    The cyber kill chain was defined when on-premises computing was the norm. Now
    that cloud computing is considered to be a better option, the cyber kill chain
    must be re-evaluated and updated. A reconfiguration of the cyber kill chain might
    include the following phases:


    +   1. **Active recon** In this phase, the attacker uses numerous footprinting
    methods to identify the operating system or services being used, which will be
    the focus of the attack.


    +   2. **Delivery** Most public cloud assets like a logged-on user, attackers
    will need to hack the system—typically by finding unpatched exploits that can
    be leveraged against the system or service.


    +   3. **Exploitation** This phase focuses on problems on the server side instead
    of the client side.


    +   4. **Persistence** Unlike client-side systems, which are rebooted often, server-
    and service-specific systems are rarely rebooted. To remain persistent in the
    system, the exploit code will need to remain in memory. That is the focus of this
    stage.


    +   5. **Internal recon** Attacks against cloud-based systems are server-based.
    Therefore, rather than installing new tools, the attacker can simply use the server''s
    built-in tools to conduct the attack. This helps the attacker remain undiscovered,
    since installing new tools could trigger an alert.


