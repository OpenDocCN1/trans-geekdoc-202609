    Office 365 垃圾邮件数据库关联，以确定其是否为合法流量。如果关联结果显示流量可疑，Security Center 将使用内置分析、机器学习和来自
    Office 365 的威胁情报触发所示警报。执行这三个步骤不仅提供了更精确的检测，还提高了警报的置信度水平。


