    # Network map


    The **Network Map** appears in the first tile of this page. This option allows
    you view the topology of your Azure network and the traffic pattern, as shown
    in Figure 4-16.


    ![](img/4b11e95292819ab1a383a41ef73aedb4_86_0.png)


    FIGURE 4-16 Network Map showing the Azure network topology for the selected subscription


    > **TIP** If there are too many resources being displayed in the map, Security
    Center will cluster the resources by highlighting the ones in the most critical
    state.


    This map is organized from inside-out, with the subscription in the middle, then
    it goes to the Azure VNet, followed by the subnet and the Virtual Machine (VM)
    connected to that subnet. The default visualization includes some filters that
    can be adjusted by:


