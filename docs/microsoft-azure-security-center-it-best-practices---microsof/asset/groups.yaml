    ## 威胁格局


    2017 年 5 月 12 日，主流媒体开始报道了一场名为 WannaCry 的大规模勒索软件攻击，这让全世界感到震惊。在一天之内，全球 150 多个国家的
    23 万计算机被感染。该攻击是通过利用未应用 MS17-010 补丁的计算机实现的（该补丁于 2017 年 3 月发布，用于修复微软 SMB 漏洞）。除了影响家庭用户，这次攻击还打击了英国国家医疗服务体系（NHS）等机构。打过补丁的计算机不受影响。（当然，这强调了建立完善的更新管理程序的必要性！）


    像 WannaCry 这样的勒索软件——或者 Petya（允许横向移动，意味着只需要一台受感染机器就可能导致整个网络崩溃），只是当前格局中的威胁之一。还有许多其他威胁。在我们深入
    Azure Security Center 之前，你需要充分了解当前的威胁以及背后人员的动机。当前的威胁范围从老旧但有效的技术（如钓鱼邮件）到国家赞助的攻击，以及两者之间的一切。例如，一个常见的威胁是侧载式下载网站。另一个是木马。此外还有将云资源武器化以攻击本地资产。本章探讨了这些威胁中的几种，为你使用
    Azure Security Center 做好准备。首先，它讨论了网络犯罪和网络杀伤链、建立安全态势以及“假设方法”（assume-approach）。


    ## 理解网络安全


    为了名声而黑客的时代已经过去了。如今，网络攻击背后的主要动力是某种财务收益。


    网络犯罪投诉中心（IC3）是美国联邦调查局（FBI）网络部门的一部分。根据其 2017 年网络犯罪报告（https://pdf.gov/2017/ic3report），IC3
    收了 1783 起关于勒索软件的投诉，导致损失超过 23 万美元。技术支持诈骗也留下了 1500 万美元的损失。最后，2017 年美国的总损失超过了 142
    万美元。


    你可能好奇黑客如何通过他们窃取的数据获利。这是一个很好的问题。黑客通过组织犯罪集团进行工作，并利用全球分布的基础设施来发动攻击。在发起攻击之前，他们会在网络犯罪市场上寻找。


    这些技术网络犯罪分子有不同的在线方案，他们可能会提供反病毒（AV）服务，通过扫描反病毒引擎来确保新的恶意软件可以成功部署。另一种方案是用于在线活动的防弹托管。（之所以被称为“防弹”，是因为这些服务器的所有者在发生调查时不会配合执法部门）。甚至还有托管服务在技术犯罪与其客户之间的在线交易中充当第三方。


    >  了解微软云和高级分析如何助力打击犯罪 https://aka.ms/stoppingcrime


    在 2017 年和 2018 年期间，网络犯罪分子意识到通过定制用于恶意意图的货币矿可以从加密货币中获利。这是通过运行一种旨在运行加密货币矿的恶意软件攻击活动来实现的，该活动在受害者计算机中部署并运行木马矿。为了让加密货币矿能够正常工作并获得更高利润，攻击者必须在目标系统中保持持久。加密货币矿在内存中未被发现并存在的时间越长，它们窃取的资源就越多。


    为了实现这一目标，网络犯罪分子使用了先进的代码注入方法，例如无文件技术。这种攻击通常利用目标系统中已有的工具，例如 PowerShell。通过利用计算机上已有的工具，它们不需要写入硬盘；相反，它们只需要接管目标进程，在其内存空间运行一段代码，然后使用该代码调用将执行攻击的工具。这里的问题是：你有针对性的检测吗？有
    Azure Security Center！


    ## 理解网络杀伤链


    在防御系统免受网络犯罪分子侵害的最具挑战性的方面之一是识别这些系统何时被用于某种犯罪活动——特别是当它们成为僵尸网络的一部分时。僵尸网络是一个受攻击者控制且所有者不知设备网络。僵尸网络并非新事物。事实上，微软
    2012 年的一项研究发现，网络犯罪分子利用 Nitol 僵尸网络渗透了安全的供应链，引入嵌入恶意软件的伪造软件，在计算机购买之前对其进行感染。（欲了解更多信息，请参见
    https://aka.ms/nitol。）


    防止此类攻击（或任何攻击）的最佳方法是识别攻击向量——即攻击者将如何攻击你的环境。为了对此，洛克希德公司（Lockheed Martin）开发了网络杀伤链。链中的每个步骤都代表一个特定的攻击阶段。（见图
    1-1。）


