    monitor, you can still customize and add your own preferences. Follow the steps
    below to perform this customization:


    - 1. In Security Center dashboard, under Advanced Cloud Defense, click File Integrity
    Monitoring. The File Integrity Monitoring blade appears; the workspace in which
    you want to make the changes.


    - 2. In the File Integrity Monitoring blade, click the Settings button, as shown
    in Figure-5-11, and the Workspace Configuration blade appears as shown in Figure
    5-11.


    ![](img/4b11e95292819ab1a383a41ef73aedb4_120_0.png)


    ![](img/4b11e95292819ab1a383a41ef73aedb4_120_1.png)


    - 3. The first tab that you see is the Windows Registry tab, which contains all
    registry keys that are available to monitor. Notice that some are set to False
    (in the Enabled column), which means they are not being monitored, and others
    are True, which means it is currently monitoring that key. To add a new registry
    key, click Add and the Add Windows Registry for Change Tracking dialog box appears,
    as shown in Figure 5-12.


    ![](img/4b11e95292819ab1a383a41ef73aedb4_120_2.png)


    - 4. In the Item Name field, type a friendly name for this registry key.


    - 5. In the **Windows Registry Key** field, type the registry path (for example:
    HKEY_LOCAL_MACHINE\Software\Windows\CurrentVersion\Run).


    - 6. Click the **Save** button to commit your changes.


    While the addition of a new registry key to monitor is very straightforward, there
    are more options to configure for Windows files. To see the options available,
    click the **Windows Files** tab and click the **Add** button. The **Add Windows
    File for Change Tracking** page appears, as shown in Figure 5-13.


    ![](img/4b11e95292819ab1a383a41ef73aedb4_121_0.png)


    **Figure 5-13** Adding new files to track changes


    In addition to the **Item Name** and **Enter Path** boxes, you also have the **Recursion**
    option that can be set to On or Off. Recursion allows you to specify wildcards
    to simplify tracking across directories and environment variables to allow you
    to track files across environments with multiple or dynamic drive names. If you
    use wildcards, keep in mind that you may only use them in the last segment of
    a path (For example, wildcards could be used like this: `c:\folder\*file` or `/etc/*.conf`).
    The second option is **Upload File Content**, which can be set to either of the
    following settings:


    - **True**. Choosing this option tracks when files are uploaded to this folder.


    - **False**. Choosing this option means files uploaded to this folder will not
    monitored.


    For Linux files, click **Linux Files** > **Add**. The **Add Linux File for Change
    Tracking** page appears, as shown in Figure 5-14.


    ![](img/4b11e95292819ab1a383a41ef73aedb4_122_0.png)


    In the **Path Type** field, you can select whether you want to monitor a file
    or a directory. The **Use Sudo** option can be set to On, which means Sudo will
    be used when checking the item, or it can be set to Off. The Link field determines
    how symbolic links are dealt with:


    - **Ignore**: This option ignores symbolic links, and it will not include directories.


    - **Follow**: This option follows symbolic links during recursion.


    - **Manage**: This option follows symbolic links and allows altering content.


    The Content tab (shown in Figure 5-15) has the relevant settings to enable this
    capability, which requires a storage account.


    ![](img/4b11e95292819ab1a383a41ef73aedb4_123_0.png)


    **FIGURE 5-15** Configuring File Content settings


    To connect an existing storage account to this feature, click the Link button.


    ## visualizing changes


    Now that you have FIM enabled, you can start tracking the changes that occurred
    from the time FIM was enabled. Keep in mind that FIM will not show the changes
    immediately; the data collection frequency may vary according to the type:


    - Windows registry: 50 minutes.

    - Windows files: 30 minutes.

    - Linux files: 15 minutes.


    To visualize the changes to the registry, follow these steps:


    - 1. In Security Center dashboard, under **Advanced Cloud Defense**, click **File
    Integrity Monitoring**. The **File Integrity Monitoring** blade appears. Click
    the workspace to which you want to make the changes.

    - 2. In the **File Integrity Monitoring** blade, you will see a snapshot of the
    changes as shown in Figure 5-16.


    ![](img/4b11e95292819ab1a383a41ef73aedb4_123_1.png)


    **FIGURE 5-16** File Integrity Monitoring blade after Security Center starts changes


    - 3. Click the Changes tab to see a list of the last 100 changes that have occurred,
    as shown in Figure 5-17.


    ![](img/4b11e95292819ab1a383a41ef73aedb4_124_0.png)


    **FIGURE 5-17** List of the last 100 changes


    - 4. To see more details about what changed, click in any entity, and you will
    see the original value of the registry key and the changes that were made in the
    Change Details page, as shown in Figure 5-18.


    ![](img/4b11e95292819ab1a383a41ef73aedb4_124_1.png)


    **FIGURE 5-18** Changes made in the registry


    # Leveraging machine learning and the power of the cloud to prevent threats


    Historically, host security solutions have focused more on preventing threats
    and less sophisticated ways to detect them as quickly as possible. This assume-breach
    mindset remains important. However, if attacks continue to increase in sophistication
    and complexity, then attempting to reduce the attack surface also becomes necessary.

