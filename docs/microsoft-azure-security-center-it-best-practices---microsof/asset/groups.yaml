    \ ATP | Office 365 ATP | Azure ATP | Azure Identity Protection | Cloud App Security\
    \ | Azure Security Center | Azure Information Protection | Azure Sentinel |\n\
    |---|---|---|---|---|---|---|---|---|\n\n**图 10-2** Graph Security API 架构图\n\n\
    从该图顶部看，你可以看到顶部的应用基本上是在消费数据。你可以创建自己的应用来消费位于第三层（安全提供商）的 Microsoft 安全产品数据。中间接口（Microsoft\
    \ Graph）是 Security Graph API 所在的位置。注意在这一层中，Security Graph API 除了检索告警和设置告警操作外，还有许多其他功能。这些选项超出了本书的范围，但如果你想了解更多关于\
    \ Security Graph API 的用法，请访问 https://aka.ms/securitydocs。\n\n在查看此图后，你还可以看到 Security\
    \ Graph API 是一个中间服务（代理），提供单一的编程接口来连接多个安全提供商（Microsoft 及其合作伙伴）。在计划构建自己的应用来使用 Graph\
