    must design their applications to be ready for a massive amount of traffic. Some
    key capabilities for applications include high availability, scale out, resiliency,
    fault tolerance, and attack surface area. Azure DDoS protection is part of the
    defense in depth for Azure Networks approach, as shown in Figure 1-8.


    ![](img/4b11e95292819ab1a383a41ef73aedb4_33_0.png)


    By default, Azure provides continuous protection against DDoS attacks as part
    of the DDoS Protection Basic, which is not charged. However, if you want extra
    metrics, alerts, mitigation reports, mitigation flow logs, policy customization,
    and support, you need to go to Azure Protection Standard. You can provision Azure
    DDoS on a Virtual Network using the Azure Portal or PowerShell. If you don''t
    have Azure DDoS Standard enabled on your subscription, Azure Security Center will
