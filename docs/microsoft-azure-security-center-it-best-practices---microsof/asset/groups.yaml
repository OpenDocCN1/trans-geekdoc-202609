    # Strengthen your security posture


    Ransomware outbreaks, such as WannaCry and Petya, reinforced the importance of
    having a vulnerability-management system. However, these outbreaks also reinforced
    the fact that many computers are not fully updated and do not use the most secure
    configuration.


    To enhance your overall security posture, you need to increase your protection.
    A security assessment is critical to identifying the current security state of
    your assets—and what you need to do to improve it. Azure Security Center can perform
    a security assessment for all major workloads: compute, network, storage, and
    applications. The result of this security assessment is a set of recommendations
    that will help you enhance the security posture of your workloads.


    In this chapter, you will learn how to use Security Center to perform a security
    assessment for major workloads and how to use the result of this assessment to
    improve your defense system.


    # Secure Score


    When working in a cloud environment, monitoring the security state of multiple
    workloads can be challenging. How do you know if your security posture across
    all workloads is at the highest-possible level? Are there any security recommendations
    that you are not meeting? Are there hard questions to answer when you don''t have
    the right visibility and tools to manage the security aspects of your cloud infrastructure.


    Security Center reviews your security recommendations across all workloads, applies
    advanced algorithms to determine how critical each recommendation is, and calculates
    your Secure Score based on them. Secure Score helps you to assess your security
    posture from a single dashboard. You can view the overall Secure Score in the
    Overview page in Security Center dashboard, as shown in Figure 4-1.'
