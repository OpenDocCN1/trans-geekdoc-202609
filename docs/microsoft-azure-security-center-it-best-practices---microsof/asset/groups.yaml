    `c:\*` 或 `/etc/*`。对于 Linux 文件，点击**Linux 文件 (Linux Files)** 并添加 (Add)。出现“添加 Linux
    文件”页面，如图 5-14 所示。


    ![](img/4b11e95292819ab1a383a41ef73aedb4_122_0.png)


    在路径类型 (Path Type) 字段中，您可以选择监控文件还是目录。使用 Sudo (Use Sudo) 选项可以设置为 On，这意味着将使用 sudo，或者可以设置为
    Off。内容 (Content) 字段决定了如何处理符号链接：


    - 忽略 (Ignore)：此选项忽略符号链接。

    - 跟踪 (Follow)：此选项跟踪符号链接。

    - 管理 (Manage)：此选项允许跟踪符号链接。


    内容选项卡（如图 5-15 所示）需要存储账户。


    ![](img/4b11e95292819ab1a383a41ef73aedb4_123_0.png)


    **图 5-15** 配置内容设置


    要将现有的存储账户连接到此功能，点击链接 (Link)。


    ## 可视化更改


    一旦启用了 FIM，您就可以开始跟踪从启用以来发生的更改。请记住，FIM 不立即显示更改；数据收集频率根据类型而异：


    - Windows 注册表：50 分钟。

    - Windows 文件：30 分钟。

    - Linux 文件：15 分钟。


    要可视化注册表，请按照以下步骤操作：


    - 1. 在 Security Center 仪表板中，在高级云防护 (Advanced Cloud Defense) 下，点击文件完整性监控 (File
    Integrity Monitoring)。点击您想要查看的工作区。

    - 2. 在文件完整性监控窗格中，您将看到如图 5-16 所示的更改快照。


    ![](img/4b11e95292819ab1a383a41ef73aedb4_123_1.png)


    **图 5-16** Security Center 后的文件完整性监控窗格


    - 3. 点击更改 (Changes) 选项卡，查看最近的 100 次更改列表，如图 5-17 所示。


    ![](img/4b11e95292819ab1a383a41ef73aedb4_124_0.png)


    **图 5-17** 最近 100 次更改列表


    - 4. 要查看更改的详细信息，点击任何实体，您将在更改详细 (Change Details) 页面看到注册表项的原始值以及所做的的更改，如图 5-18 所示。


    ![](img/4b11e95292819ab1a383a41ef73aedb4_124_1.png)


    **图 5-18** 注册表中的更改


    # 利用机器学习和云的力量预防威胁


    长期以来，主机安全解决方案更侧重于预防威胁，而尽可能检测它们的方法较不成熟。这种假设被攻的思维方式仍然重要。然而，如果攻击继续变得日益复杂和精密，那么尝试缩小攻击面也是必要的。

