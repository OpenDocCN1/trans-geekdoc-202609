    # Security Center architecture


    When you use Security Center to monitor resources in Azure—either on-premises
    or hosted by other cloud providers (such as Amazon AWS)—the architecture looks
    similar to Figure 2-1.


    ![](img/4b11e95292819ab1a383a41ef73aedb4_42_0.png)


    Figure 2-1 Connectivity between Security Center agents and the Security Center
    service


    Security Center uses the Microsoft Monitoring Agent, which is the same agent used
    by Operations Management Suite and the Log Analytics service. In Windows systems,
    Security Center installs the Microsoft Monitoring Agent (HealthService.exe). In
    Linux systems, Security Center creates the omsagent daemon, which runs under the
    account. This account is automatically created during agent installation.


    In Linux systems, Security Center collects audit records from Linux machines by
    leveraging the audit framework. The audit framework consists of two major components,
    the first is a set of user-space utilities offering a wide collection of operations
    allowing administrators to better adjust rules, analyze audit logs, or troubleshoot
    if things are misconfigured. The second is a kernel-level subsystem that is responsible
    for monitoring system calls, filtering them by netlink socket, and writing match
    messages to a buffer. Audit records are collected, aggregated into events, and
    enriched with the latest version of the Microsoft Monitoring Agent for Linux.
    A subset of the audit events are stored in your workspace and managed by Security
    Center. When threats are detected, Security Center triggers an alert. Starting
    in June 2019, the Linux Agent no longer requires the audit daemon (although it
    still uses the audit framework) to be running on the machine. If the target machine
    already has the audit daemon running, the agent will respect that, and it will
    interact with the audit daemon to collect the data.


    Understanding Azure Security Center


