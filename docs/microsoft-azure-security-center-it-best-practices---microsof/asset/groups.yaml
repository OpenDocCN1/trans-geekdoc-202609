    \ visit https://aka.ms/securitydocs.\n\nAfter reviewing this diagram, you can\
    \ also see that the Security Graph API is an intermediary service (broker) that\
    \ provides a single programmatic interface to connect multiple security providers\
    \ (Microsoft and Partners). When planning to build your own app to use the Graph\
    \ Security API, make sure to cover the following points:\n\n- Register your app\
    \ with Microsoft Graph: Log in to portal.azure.com to add the app to your Azure\
    \ AD tenant.\n- Specify permissions and secrets: You can use Delegated if your\
    \ app accesses the API as signed-in user, or you can use Application if your app\
    \ has its own Role Base Access Control (RBAC).\n- Write your code: You can start\
    \ by leveraging the sample codes at http://aka.ms/graphsecurityapicode\n- Get\
    \ consent from the organization using your app: In this step, the Azure AD Admin\
    \ needs to grant consent for the organization (tenant) to use the app.\n\n# Using\
    \ the Security Graph API\n\nThe Security Graph API is accessible through the Microsoft\
    \ Graph; in other words, it uses the single point of connection (https://graph.microsoft.com)\
    \ with the same syntax REST API and response in JSON format. Security data accessible\
    \ via the Security Graph API is protected using permissions and Azure AD (AAD)\
    \ roles. To retrieve alerts from Security Center using the Security Graph API,\
    \ you need to use the HTTP GET request similar to the example below:\n\nhttps://graph.microsoft.com/v1.0/security/alerts\n\
    \nOne important aspect of this GET request is that it will retrieve all alerts\
    \ from the service providers that you may have in your tenant, which includes\
    \ Azure Security Center, Azure Active Directory Identity Protection, Microsoft\
    \ Cloud App Security, Windows Defender Advanced Threat Protection, Azure Advanced\
    \ Threat Protection, Office 365, Cloud App Security, Azure Information Protection\
    \ (preview), Azure Sentinel, and other partner providers to which you may have\
    \ access, such as Palo Alto Networks.\n\nDepending on the amount of service providers\
    \ that you have, the amount of data that returns with a simple GET request for\
    \ all alerts can be substantial. It is a good idea to use filters to target the\
    \ information that you really want to see. For example, if you want to see only\
    \ the top 10 high severity alerts, you can use the GET request below:\n\nhttps://graph.microsoft.com/v1.0/security/alerts?$filter=severity\
    \ eq 'High'&$top=10\n\nThe part of the URL in bold represents the filter that\
    \ was created to retrieve only the information that you needed. If you want to\
    \ validate your GET request before start writing your app, you can use the Microsoft\
    \ Graph Explorer (https://developer.microsoft.com/en-us/graph-explorer) to test\
    \ the URL. For this example, you would get a result that lists the top 10 high-severity\
    \ alerts. While this filter helps, it will still show the 10 high-severity alerts\
    \ for all security providers to which you have access. If you want to see alerts\
    \ generated by Security Center, you can filter by the vendor provider using the\
    \ vendorInformation property, as shown in the example:\n\n```\nhttps://graph.microsoft.com/v1.0/security/alerts?$filter=vendorInformation/provider\
    \ eq='ASC'\n```\n\nIf you use Microsoft Graph Explorer to run this GET Request\
    \ while logged in to a subscription that has Security Center on it, this request\
    \ will retrieve only alerts where the security provider is Security Center (see\
    \ Figure 10-3).\n\n![](img/4b11e95292819ab1a383a41ef73aedb4_206_0.png)\n\nFIGURE\
    \ 10-3 Graph Explorer\n\nYou can also use logical operators to expand your query.\
    \ For example, if you want to see only high-severity alerts generated by Security\
    \ Center, you can use the following GET request. (Notice the addition of the bold\
    \ strings).\n\n```\nhttps://graph.microsoft.com/v1.0/security/alerts?$filter=vendorInformation/provider\
    \ eq='ASC' and Severity eq 'High'\n```\n"
