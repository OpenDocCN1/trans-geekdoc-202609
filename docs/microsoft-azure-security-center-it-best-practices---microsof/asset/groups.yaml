    This control—which is enabled through Azure network capabilities rather than through
    any feature or on the VM itself—is exerted over incoming connections from the
    Internet. The Azure Security Center JIT VM access feature is fairly simple. Here
    are the key points:


    +   - The primary goal of Azure Security Center JIT is to protect VM management
    ports, such as RDP, SSH, and remote PowerShell ports.


    +   - JIT limits the amount of time a port is open. The port will be open only
    for as long as is needed to get the work done. (You define the duration).


    +   - Network security group (NSG) rules control access to the management ports
    defined in the JIT policy.


    +   - Only ARM VMs support Azure Security Center JIT VM access.


    +   - We recommend that you use JIT on all VMs that support it. Indeed, the times
    we do not recommend using JIT when there is no NSG associated with the VM or when
    the VM is a classic VM.


    +   - Sometimes, when a VM might be a candidate for JIT VM access, Azure Security
    Center doesn''t issue a recommendation to that effect. This occurs when the JIT
    solution is disabled by a security policy set at the subscription or resource-group
    level, when the VM doesn''t have a public IP address, and when the VM is not associated
    with an NSG.


    +   - JIT VM access provides a collection of default management ports that you
    can use to enable access. You can also create new ports and remove existing ports.


    +   - An administrator sets the JIT policy, which defines which ports can be used.
    When a user requests access to JIT, he or she can use only those ports defined
    in the policy. To increase security, the user can remove all ports except the
    one required to gain remote administrative access.


    +   - You can use PowerShell to configure JIT policy as well as to request access.


    +   - When users request JIT access, Azure Security Center checks their RBAC permissions.
    If the user has right access to the VM, JIT access will be granted. At that point,
    Azure Security Center will dynamically create NSG rules to allow inbound management
    traffic. When JIT access expires, the NSG rules will be removed. Note that connections
    are not actively reset, so a user who is connected will remain until the connection
    is dropped by the user or for some other reason.


    To explore this feature, select **Azure Security Center** in the left pane of
    the Azure Portal. Then select **Just-In-Time Access**. The main screen for JIT
    VM access explains what the feature is and how it works. It also contains main
    tabs under a Virtual Machines heading, as shown in Figure 5-1.


    If a JIT access request is approved for a VM behind an Azure Firewall, then Security
    Center automatically changes both the NSG and firewall rules.'
