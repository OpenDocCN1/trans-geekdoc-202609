  - '[PAGE 156]


    TIP For more information about Azure IoT Edge, read https://docs.microsoft.com/en-us/azure/iot-edge/about-iot-edge.


    # IoT security


    IoT solutions can be divided into four, security-relevant zones—Device, Field
    Gateway, Cloud gateways, and Applications. Managing and monitoring of the IoT
    solution requires addressing the security of all four zones.


    Azure Security Center for IoT unifies security posture and threat detection across
    an entire IoT solution, from low resource leaf devices, field gateways, and all
    the way to the service device of cloud gateways. It does this by delivering unified
    visibility and control, adaptive threat prevention, and intelligent threat detection
    and response across IoT workloads that run on Edge, on-premises, and on Azure
    and other clouds.


    Because of its immense density and scale, IoT introduces unique security challenges
    as well as opportunities. IoT devices are deployed and managed at scale behavior.
    This combined with AI allows deep modeling of device routine behavior. Azure Security
    Center for IoT uses seamless integration with Azure resources to trace and model
    IoT devices and identify any deviation from routine behavior. It enables real-time
    impact on customer business logic by allowing automatic workflows to take security
    into account. For example, it prevents a rogue sensor from causing the entire
    system to malfunction by flagging it as potentially malicious or malfunctioning.


    For devices that play a critical role in the IoT solution, Azure Security Center
    for IoT offers a set of open source security agents. Security agents are designed
    to work in a constrained IoT environment, and they are highly customizable in
    terms of value they provide when compared to the resources they consume. They
    allow enhanced security capabilities, such as monitoring remote connections, active
    applications, login events, and OS best practices.


    Michael Burgary, Senior Architect, Microsoft IoT Security Team'
