    ![](img/4b11e95292819ab1a383a41ef73aedb4_22_0.png)


    FIGURE 1-1 Example of the cyber kill chain steps


    The steps in this chain are as follows:


    +   1. **External recon** During this step, attackers typically search publicly
    available data to identify as much information as possible about their targets.
    The goal of this step is to obtain intelligence, or *intel*, to better perform
    the attack and increase the likelihood of success.

    2. **Compromised machine** During this step, attackers leverage different techniques,
    such as social engineering, to entice users to do something. For example, the
    attacker might send a phishing email to lure the user into clicking a link that
    will compromise the machine. The goal is to establish a foothold on the victim''s
    network.

    3. **Internal recon and lateral movement** During this step, the attacker performs
    host discovery and identifies and maps internal networks and systems. The attacker
    may also start moving laterally between hosts, looking for a privileged user''s
    account to compromise.

    4. **The low-privileges lateral movement** During this cycle, the attacker continues
    to search for accounts with administrative privileges so that he or she can perform
    a *local privilege escalation* attack. This cycle typically continues until the
    attacker finds a administrative user account that can be compromised.

    5. **Domain admin cred** At this point, the attacker needs *domain dominance*.
    To achieve this, the attacker will pivot through the network, looking for valuable
    data or installing ransomware or any other malware that can be used for future
    extortion attempts.


    > **IMPORTANT** It is important to understand these steps throughout the book,
    you will learn how Azure Security Center can be used to disrupt the kill chain
    by detecting attacks in different phases.'
