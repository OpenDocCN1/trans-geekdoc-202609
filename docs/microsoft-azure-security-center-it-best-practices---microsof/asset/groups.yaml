    ## 网络建议


    Azure 虚拟网络是专门为您的订阅提供的 Azure 云逻辑隔离。Security Center 会识别您订阅中可用的 Azure 虚拟网络，并提供改进整体安全性的建议。在
    Security Center 仪表板中，在“资源安全状况”（Resource Security Hygiene）下，点击“网络”（Networking），就会出现
    Security Center - 网络仪表板，如图 4-15 所示。


    ![](img/4b11e95292819ab1a383a41ef73aedb4_85_0.png)


    图 4-14 验证反病毒扩展程序已安装


    ![](img/4b11e95292819ab1a383a41ef73aedb4_85_1.png)


    图 4-15 网络建议面板


    ## 网络地图


    **网络地图**（Network Map）出现在页面的第一个磁格中。此选项允许您查看 Azure 拓扑结构和流量模式，如图 4-16 所示。


    ![](img/4b11e95292819ab1a383a41ef73aedb4_86_0.png)


    图 4-16 显示所选订阅 Azure 网络拓扑的网络地图


    > **提示** 如果地图中显示的资源过多，Security Center 将通过高亮处于最关键状态的资源对资源进行聚类。


    此地图从内向外组织，订阅位于中间，然后是 Azure VNet，随后是子网以及连接到该子网的虚拟机 (VM)。默认可视化了一些过滤器，可以通过以下方式调整：


    - **安全健康状况**（Security Health）：这基于您的 Azure 资源的严重性级别（高、中、低）。

    - **建议**（Recommendations）：这些基于针对这些资源的活动建议。

    - **网络区域**（Network Zones）：这基于内部或面向 Internet 的资源（两者都有）。


    如果您将鼠标悬停在每个图标上，将看到有关该对象的更多信息；若您点击其中一个 VM，将看到有关 VM 本身的更多详细信息，如图 4-17 所示。


    ## 自适应网络加固


    在此面板中，您拥有所选 VM 的重要属性，页面底部会显示相关建议列表。在右侧，您可以切换到“允许的流量”（Allowed Traffic）。在此标签页中，有两个表格列出了出站流量开放的
    TCP 和 UDP 端口；第三个标签页显示入站流量的 TCP 和 UDP 端口。这提供了资源之间当前可能流量 Better视图，可以通过点击左侧 Topology
    按钮旁“允许的流量”按钮切换到流量地图。通过切换到此视图，您将看到相同的地图，但现在显示的是您配置的资源，定义了哪些资源可以与其他资源通信。检查此面板后，关闭它并返回
    Security Center - 网络面板。


    此功能的目的是让您能够使用网络安全组 (NSG) 规则轻松加固您的网络流量。Security Center 将使用机器学习收集网络流量信息，在学习流量模式后，它将建议规则列表以加固已知流量。点击“自适应网络加固”磁格，您将


    图 4-17 网络地图中的 VM 属性


    ![](img/4b11e95292819ab1a383a41ef73aedb4_87_0.png)


    看到面向 Internet 的虚拟机加固网络安全组规则面板，如图 4-18 所示。


    ![](img/4b11e95292819ab1a383a41ef73aedb4_88_0.png)


    不健康资源（Unhealthy resources）显示应应用网络加固建议的 VM 数量。您可以点击 VM 查看当前规则和告警，如图 4-19 所示。


    图 4-18 显示已配置 VM 的 NSG 加固仪表板


    ![](img/4b11e95292819ab1a383a41ef73aedb4_88_1.png)


    图 4-19 告警和规则的加固策略可见性


    在“规则”（Rules）标签页下，规则根据自适应网络加固能力的学习自动创建。您可以点击“添加规则”（Add Rule）按钮创建新规则，也可以选择建议的规则并点击“强制”（Enforcement）按钮。查看告警，可以点击“告警”（Alerts）标签页并选择告警本身。告警的示例如图
    4-20 所示。


    ![](img/4b11e95292819ab1a383a41ef73aedb4_89_0.png)


    **图 4-20** 入站流量告警


    在某些情况下，自适应网络加固算法将无法运行，会出现“未扫描的资源”（Unscanned Resources）标签。以下是自适应网络加固算法无法运行的情况：


    - VM 是经典 VM：仅支持 Azure Resource Manager VM。

    - 可数据不足：为了产生准确的流量加固建议，Security Center 需要至少 30 天的流量数据。

    - VM 未受 ASC 标准保护：此功能仅在标准层级（Standard tier）可用。


    下一节包含可以通过 Security Center 直接修复的建议示例。


    ## 利用机器学习处理网络流量


    云中最大的攻击面是连接。通过自适应网络加固功能，Security Center 可以识别网络模式并为面向 Internet 的机器提供 NSG 建议。这允许客户只需点击即可保护其环境。例如，假设现有
    NSG 过于宽松，建议将限制访问。此外，Security Center 使用广泛的威胁情报来阻止恶意攻击者。


    Oren Parag，Security Center 高级经理


    ## 在子网上启用安全组


    网络安全组 (NSG) 包含一组允许或拒绝资源网络流量的安全规则。NSG 可以与 VM、NIC 和子网关联。Security Center 会验证子网是否需要
    NSG，如果需要，Security Center 将为其创建建议。


    在主网络面板中，您将看到建议列表。按照以下步骤操作：


    - 1. 点击“在子网上启用安全组”（Enable Security Groups on subnets），您将看到所有可以启用 NSG 的虚拟网络的面板，如图
    4-21 所示。


    ![](img/4b11e95292819ab1a383a41ef73aedb4_91_0.png)


    - 2. 点击您想要启用 NSG 的子网，如果您已经有了 NSG，将在“选择网络安全组”（Choose network security group）面板中看到它。如果没有
    NSG，点击“新建”（Create new）（见图 4-22）并按照向导创建新的网络安全组。


    ![](img/4b11e95292819ab1a383a41ef73aedb4_91_1.png)


    ## 通过面向 Internet 的终端限制访问


    处理云资源时，安全管理和控制至关重要。当在您的 IaaS 环境中配置新 VM 时，您需要确保这些 VM 不完全暴露在 Internet 上。在大型环境中执行此任务可能困难，但通过
    Security Center，您可以在一个位置完整查看面向 Internet 的终端情况。


    在主网络面板中，您将看到建议列表。按照以下步骤操作：


    - 1. 1 点击“对于具有面向 Internet VM 的宽松网络安全组，应限制访问”（Access should be restricted for permissive
    Network Security Groups with Internet-facing VMs），您将看到包含所有面向 Internet 机器的新面板。


    '
