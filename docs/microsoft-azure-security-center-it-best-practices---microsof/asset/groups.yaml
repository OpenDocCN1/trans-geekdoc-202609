    # File integrity monitoring


    File Integrity Monitoring (FIM), helps to protect the integrity of your system
    and applications as Security Center will be continuously monitoring the behavior
    of your registry and configuration files. If some abnormal change to the files
    or a malicious behavior is detected, Security Center will track this change, allowing
    you to stay in control of your files. FIM leverages Azure Change Tracking solution
    to track and identify changes in your VMs. When File Integrity Monitoring is enabled,
    you have a Change Tracking resource of type Solution. If you remove the Change
    Tracking resource, the File Integrity Monitoring feature in Security Center will
    be automatically disabled.


    To enable FIM in your workflow, follow the steps below:


    +   1. In Security Center dashboard, under Advanced Cloud Defense, click File
    Integrity Monitoring. The File Integrity Monitoring blade appears with the list
    of workspaces that you can select to monitor. If this is the first time you are
    using this feature, you will see the Enable beside the workspace as shown in Figure
    5-9.


    ![](img/4b11e95292819ab1a383a41ef73aedb4_119_0.png)


    +   2. Click the Enable button, and in the Enable File Integrity Monitoring blade,
    confirm that you have Windows Files, Registry, and Linux Files selected. Click
    the Enable File Integrity Monitoring button to commit the changes.


    It may take some time for FIM to identify the total amount of computers that are
    in the workspace, make sure to use the Refresh button to see if all computers
    are already there. In the example above, there are only three computers in this
    workspace. When you enable FIM before onboarding computers, the Total Computers
    column will appear as zero, as in Figure 5-9.


    # Customizing your settings


    Although Security Center will suggest which files and registry keys you should
    monitor, you can still customize and add your own preferences. Follow the steps
    below to perform this customization:


