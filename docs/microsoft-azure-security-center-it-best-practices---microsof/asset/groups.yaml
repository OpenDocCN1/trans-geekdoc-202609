    \ REST API。\n\n当你调用 Graph Security API 时，这些调用将联邦到所有支持的 Microsoft 安全产品、服务合作伙伴。结果被聚合在通用模式中，这使得关联来自多个数据源的告警变得更容易。其理念是，当你连接并丰富告警时，将能够轻松理解攻击的范围和影响。\n\
    \n# 简化 Microsoft Graph Security API 的集成\n\n今天，大多数组织依赖一组安全工具来管理和响应网络威胁。这包括工单、调查和自动化系统等。通过将\
    \ Azure Security Center 与这些工具和工作流集成，你可以简化安全操作并提高威胁响应。\n\nMicrosoft Graph API 为集成\
    \ Microsoft 及其合作伙伴的安全解决方案提供了统一接口和标准模式。通过一个身份验证密钥连接到一个端点，组织可以极大简化告警管理。调用一次 Microsoft\
    \ Graph Security API 即可返回来自 Azure Security Center、AD Identity Protection、Azure\
    \ Information Protection、Microsoft Cloud App Security 以及 Office365、Windows 和 Azure\
    \ Advanced Threat Protection 的告警。组织还可以使用 Microsoft Graph Security API 更新告警状态。例如，当你在集成应用程序中关闭\
    \ Azure Security Center 警时，它将在 Azure Security Center 中显示为已忽略（dismissed）。\n\n组织可以通过\
    \ API 或使用 PowerShell 脚本直接连接到 Microsoft Graph Security API。来自 Azure Logic Apps、Microsoft\
    \ Flow、PowerApps 和 Power BI 的连接器为自动化和报告提供了无代码选项。Azure Notebooks 示例提供了在 Jupyter\
    \ notebooks 中分析告警数据的简单方法。此外，还支持通过 Azure Monitor 进行 SIEM 集成。\n\n访问 aka.ms/graphsecurityapi\
    \ 了解更多关于利用 Microsoft Graph Security API 将 Azure Security Center 告警集成到你的安全工具和工作流的信息。\n\
    \nSarah Feder，Graph Security API 团队首席小组经理\n\n图 10-2 显示了可用于 Graph Security API\
    \ 的不同组件的表示。\n\n| 应用 | Web 应用程序 | 设备和原生应用 | 机器人 | 后台进程 | 分析仪表板和工具 | 自动化工作流 |\n\
    |---|---|---|---|---|---|---|\n\n| 通用库、身份验证和授权 | | | | | | |\n| Microsoft Graph\
    \ | 告警 | 安全存储 (Secure Store) | 指示器 (Indicators) | 操作 (Actions) | 其他 Graph 服务 (Azure\
    \ AD, O365, SharePoint, Intune...) | |\n|---|---|---|---|---|---|---|\n\n| Graph\
