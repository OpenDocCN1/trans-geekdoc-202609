    # 限制面向互联网的虚拟机的宽松网络安全组


    Azure Security Center 已识别出您的某些网络安全组入站规则过于宽松。入站规则不应允许来自“任意（Any)”或“Internet”范围的访问。这可能导致攻击者能够轻易针对您的资源。


    | | |

    |---|-|

    | 建议分得分 | 14/20 |

    | 建议影响 | +6 |

    | 用户影响 | 高 |

    | 实现成本 | 低 |


    - *恶意内部人员*

    - 数据人员

    - 数据渗透


    我们建议您编辑某些虚拟机的入站规则，以限制对特定源范围的访问。要限制对您的虚拟机的访问：

    1. 选择一个要限制访问的虚拟机。


    图 4-23 面向互联网的端点列表。


    2. 滚动到页面底部，您将看到不健康虚拟机列表，这些是您应该处理建议的虚拟机，如图 4-24 所示：


    | 不健康资源 | 健康资源 |

    |---|-|

    | 80 | 177 |

    | 不健康资源 (80) | 健康资源 (177) | 未扫描资源 (10) |

    | 搜索虚拟机 | |

    | 名称 | |

    | standalone-vm | |

    | UbuntuDVWA | |


    图 4-24 需要通过此建议处理的虚拟机列表


    3. 点击您想要处理此建议的虚拟机，将出现该虚拟机的网络页面。点击“添加入站安全规则”，将出现“添加入站安全规则”页面，如图 4-25 所示：


    ![](img/4b11e95292819ab1a383a41ef73aed4_93_0.png)


    图 4-25 当前入站安全规则列表


    4. 根据您的环境需求配置入站规则，并点击“添加”按钮完成。


    # 数据与存储


    > 提示 SecurityCenterJITRule_<suffix> 是由 Security Center 的即用（just-in-time）虚拟机功能自动创建并管理的，不应手动修改。


    攻击者的最终目标之一是获取目标数据的访问。因此，处理存储（数据所在地）和数据本身的所有安全建议至关重要。


    Security Center 通过为 SQL 数据库、Azure Storage、Redis、Data Lake Analytics 和 Data Lake
    Store 提供安全建议来满足这些需求。存储和数据建议因环境而异。当您首次打开数据和存储建议时，将看到一个“概述”选项卡，其中包含所有建议的摘要，如图 4-26
    所示。


    # 启用 SQL Server 审计


    Security Center 可以执行安全评估以验证您是否利用 Azure SQL 审计和威胁检测安全功能。审计和威胁检测为您提供以下支持：


    - 维护法规合规性

    - 理解数据库活动

    - 洞察差异和异常

    - 识别安全违规行为


    由于与 Azure SQL 的集成，此建议允许您直接从 Security Center 修复。按照以下步骤处理此建议：


    1. 在“数据与存储”窗格中，点击“概述”选项卡，并选择“启用 SQL Server 审计”。

    2. 在“启用 SQL Server 审计”窗格中，您将看到有关此建议的详细说明、它将如何影响您的安全评分、如果您不处理此建议将面临的威胁，以及修复步骤。

    参见图 4-27。


    # 启用 SQL Server 审计


    描述

    在您的 SQL Server 上启用审计，以跟踪服务器上所有数据库的数据库活动并将其保存到审计日志中。


    常规信息


    | 建议分得分 | 8/15 |

    |---|---|

    | 建议影响 | +7 |

    | 用户影响 | 低 |

    | 实现成本 | 低 |


    威胁


    - 数据外泄

    - 数据泄露

    - 恶意内部人员

    - 威胁抗性


    修复步骤


    - 要启用 SQL Server 审计：

    - 选择 SQL 服务器。

    - 在“审计”下，选择“启用”。

    - 选择“详细信息”并为审计日志配置存储帐户。

    - 点击“保存”。


    ![](img/4b11e95292819ab1a383a41ef73aed4_95_0.png)


    > 图 4-27 关于启用 SQL Server 审计优势的详细信息


    3. 点击页面底部的“不健康资源”选项卡，查看受此建议影响的 SQL 服务器。

    4. 点击您想要修复此建议的 SQL 服务器，将打开“审计”窗格，如图 4-28 所示。


    ![](img/4b11e95292819ab1a383a41ef73aed4_95_1.png)


    > 图 4-28 通过启用审计修复建议


    增强您的安全态


    5. 在“审计”下，点击“启用”并点击“保存”按钮。

    6. 保存完成后，关闭此窗格。


    # 禁用对存储帐户的无限制网络访问


    Security Center 还提供加固存储帐户网络访问的建议。此建议强调您目前对存储帐户具有无限制的网络访问。建议是配置网络规则，仅允许允许网络的应用程序访问存储帐户。要允许来自特定
    Internet 或本地客户端的连接，可以授予来自 Azure 虚拟网络或公共 Internet IP 地址范围的流量访问。处理此建议，请按照以下步骤操作：


    1. 在“数据与存储”窗格的“概述”选项卡中，点击“禁用存储帐户的无限制网络访问”。

    2. 在“禁用存储帐户的无限制网络访问”窗格中，您将看到有关此建议的详细说明、它将如何影响您的安全评分、如果您不处理此建议将面临的威胁，以及修复步骤，如图
    4-29 所示。


    ![](img/4b11e95292819ab1a383a41ef73aed4_96_0.png)


    图 4-29 存储帐户建议的详细信息


    3. 点击页面底部的“不健康资源”选项卡，查看受此建议影响的存储帐户。

    4. 点击您想要修复此建议的存储帐户，将打开“防火墙和虚拟网络”窗格，如图 4-30 所示。


    ![](img/4b11e95292819ab1a383a41ef73aed4_97_0.png)


    图 30 加固存储帐户


    5. 点击“所选网络”选项并配置网络设置，如图 4-31 所示。


    ![](img/4b11e95292819ab1a383a41ef73aed4_97_1.png)


    图 31 存储帐户的网络设置


    6. 完成配置后，点击“保存”。


    # 身份与访问


    今天，安全监控已不仅是观察安全状态。现在，您必须采取更广泛的方法。当攻击者入侵一个用户的凭据时，他们可能会利用此进行更大的活动。无论您的负载位于云端还是本地，这都至关重要。


    要访问身份仪表板，点击“安全”下的“身份与访问”。将打开身份仪表板，如图 4-32 所示。


    ![](img/4b11e95292819ab1a383a41ef73aed4_98_0.png)


    图 32 身份与访问概述页


    “查看经典身份与访问”按钮允许您在显示身份统计数据时切换到旧视图（图 33）。该按钮将于 2019 年 7 月 31 日，，由于许多客户喜欢这种可视化，可以使用
    Azure Security Center 团队提供的查询重现这些数据。参见 http://aka.ms/ASLCegidentity。


    # 身份与访问


    ![](img/4b11e95292819ab1a383a41ef73aed4_99_0.png)


    图 33 身份与访问的旧视图


    此仪表板显示 Security Center 监控的所有身份相关活动的摘要。安全运营人员应每天多次访问此仪表板，以快速评估当前状态。此仪表板包含三个主要部分：


    - 身份态

    - 失败登录

    - 登录趋势


    身份访问仪表板的身份态部分传达了过去 24 小时数据的各种分析，可以帮助您更好地理解用户的身份模式。这些分析包括：


    - **登录**：此图表显示失败和成功登录的数量。

    - **已登录帐户**：此计数器显示当前登录的用户帐户数量。

    - **登录失败帐户**：此计数器显示登录失败的帐户总数，并带有向上或向下的箭头。在图 8-2 中，箭头向下表示自上次更新以来失败次数减少了 1.6 万。

    - **锁定帐户**：此计数器传达当前锁定的帐户数量。

    - **已更改或重置密码的帐户**：此计数器显示已更改或重置密码的帐户总数。


