    # Virtual machine scale sets


    Azure Virtual Machine Scale Sets (VMSS) let you create and manage a group of identical,
    load-balanced VMs. One advantage of using this technology is that the number of
    VM instances can automatically increase or decrease in response to a business
    demand, or the number of VMs can also be defined by a schedule.


    Security Center automatically discovers whether you have scale sets and recommends
    that you install the monitoring agent on these scale sets. Once the agent is installed,
    Security Center will perform an assessment to provide recommendations, such as
    enabling diagnostics logs in Virtual Machine Scale Sets, remediating vulnerabilities
    in security configuration on your virtual machine scale sets, installing system
    updates on virtual machine scale sets, and others.'
