    对于某些建议，你可以直接从安全中心（Security Center）仪表板应用修复；其他建议则需要你通过外部过程。例如，“在你的机器上安装系统更新”（Install
    System Updates On Your Machines）建议将仅为你列出缺少系统更新的计算机列表。然而，你无法从安全中心应用更新；你需要使用外部解决方案，例如
    Windows Update 服务（WSUS）。其他某些建议将提供修复步骤，如图 4-6 所示。


    ![](img/4b11e95292819ab1a383a41ef73aedb4_79_0.png)


    图 4-6 解决此建议需要遵循的修复步骤


    许多客户会将 Web 应用程序托管在运行 Azure 的虚拟机上，这意味着他们需要确保这些虚拟机的安全状态配置恰当。这不仅应该从操作系统层面（已在“计算”建议中完成），还应该从
    Web 应用程序层面。


    应用建议将为运行在 Azure 虚拟机上的 Internet 信息服务 (IIS) 应用程序提供安全建议。应用建议将根据环境而异。下一节将提供可以通过安全中心仪表板直接修复的建议示例。


    ## 添加 Web 应用程序防火墙


    Web 应用程序日益受到网络攻击的针对，例如 SQL 注入、跨站脚本 (XSS) 以及 OWASP 前 10 项中记录的许多其他攻击。许多攻击可以通过安全的代码来防止，但在应用程序代码本身中防止某些攻击是困难的，因为可能需要严谨的维护、补丁和多层监控。Web
    应用程序防火墙可以在不修改应用程序代码的情况下，增强 Web 应用程序受网络漏洞和攻击的保护。按照以下步骤解决此建议：


    - 1. 打开 Azure 门户并使用具有安全管理员（Security Admin）权限的用户登录。

    - 2. 在左侧导航窗中，点击“安全中心”。

    - 3. 在安全中心的左侧导航窗中，在“资源安全状况”（Resource Security Hygiene）下，点击“计算与应用”（Compute & Apps）。

    - 4. 在“概述”（Overview）选项卡中，在搜索字段中输入“Firewall”（防火墙）并点击“添加 Web 应用程序防火墙”，如图 4-7 所示。


    ![](img/4b11e95292819ab1a383a41ef73aedb4_80_0.png)


    图 4-7 应用页面


    - 5. 点击“添加 Web 应用程序防火墙”，并选择你想通过安装 Web 应用程序防火墙来修复的系统。出现“添加 Web 应用程序防火墙”面板，如图 4-8
    所示。


    > 注意：有关 OWASP 前 10 强项目的更多信息，请访问 https://www.owasp.org/index.php/Category:OWASP_Top_Ten_Project。


    ![](img/4b11e95292819ab1a383a41ef73aedb4_80_1.png)


    图 4-8 添加新的 Web 应用程序防火墙


    - 6. 点击**新建**（Create New），将出现**创建新的 Web 应用程序防火墙解决方案**页面，如图 4-9 所示。


    ![](img/4b11e95292819ab1a383a41ef73aedb4_81_0.png)


    **图 4-9** 添加新的 Web 应用程序防火墙


    从现在起，步骤可能会根据你选择的解决方案而变化。你应该考虑合作伙伴的解决方案文档供进一步参考。


    ## 终端保护


    安全中心可以检测你的虚拟机或计算机是否安装了终端保护，以及该终端保护是否为最新版本。然而，此功能只能检测某些支持的终端保护合作伙伴。在编写时，支持的合作伙伴如下：


    - Windows Defender (Microsoft Antimalware)

    - System Center Endpoint Protection (Microsoft Antimalware)

    - Trend Micro（趋势科技，所有版本）

    - Symantec v12.1.1100+

    - McAfee v10+


    > **提示** 合作伙伴列表不断修订，并可能在不另通知的情况下包含新合作伙伴。要查看最新的支持终端保护列表，请访问 https://aka.ms/ASCPartners。


    如果建议要求在非 Azure 虚拟机和计算机上安装终端保护，你需要按照你选择的反病毒软件提供的提供的进行手动操作。对于 Azure 中的虚拟机，System
    Center 将引导你完成安装过程，你可以根据 Azure 内部市场中提供的可用选项选择终端保护。按照以下步骤在 Azure 虚拟机中部署 Windows
    Defender (Microsoft Antimalware) 以修复计算建议：


    - 1. 打开**Azure 门户**并使用具有**安全管理员**（Security Admin）权限的用户登录。

    - 2. 在左侧导航窗中，点击**安全中心**（Security Center）。

    - 3. 在安全中心的左侧导航窗中，在**资源安全状况**（Resource Security Hygiene）下，点击**计算与应用**（Compute
    & Apps）。

    - 4. 在**概述**（Overview）选项卡中，点击**在虚拟机上安装终端保护解决方案**（Install Endpoint Protection Solution
    on Virtual Machines）建议。

    - 5. 在**Azure 虚拟机未安装终端保护**面板中选择你想安装的虚拟机，如图 4-10 所示。如果你有多个工作区，可能会看到先选择工作区的选项。


    ![](img/4b11e95292819ab1a383a41ef73aedb4_82_0.png)


    **图 4-10** 在目标系统中安装终端保护


    - 6. 点击**新建**（Create New），将出现**创建新的 Web 应用程序防火墙解决方案**页面，如图 4-9 所示。

