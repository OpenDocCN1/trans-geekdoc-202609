    The sequence in Figure 6-10 goes


    - 1. **Target and attack** In this phase, Azure Security Center detects what appears
    to be a brute-force attack against the Remote Desktop Protocol (RDP) server on
    a VM. This determination is made by comparing a baseline of RDP connections to
    the VM and the current rate of RDP logon, along with other factors related to
    RDP logs.


    - 2. **Install and exploit** Azure Security Center detects the execution of a
    suspicious process on the VM. This suspicious process could be predefined (known-bad
    malware), or it could be a process that wasn''t executed on the machine during
    previous baselines and is therefore unrecognized. (For example, maybe the process
    is launched by software recently installed by the admin. You''ll have to correlate
    this with other events to find out.)


    - 3. **Post breach** At this point, Azure Security Center has detected what appears
    to be a communication channel established between the VM and a malicious IP address
    (possibly flagged by a threat-intelligence feed). There''s a very good chance
    that this is bad, but there is still a chance that it isn''t. For example, maybe
    a security researcher or a red-team member working for the customer connected
    to the address on. Yes, a connection to a known-bad IP address is serious, but
    it doesn''t guarantee that the VM has been compromised.


    Each phase of the cyber kill chain by itself indicates that something bad may
    be happening—but it cannot offer complete certainty. However, when you correlate
    these findings, you can be almost 100 percent that the VM has been compromised
    by a brute-force RDP attack, that the attacker has installed and run new malware
    on the machine, and that the malware is communicating with a C&C server (likely
    identified by a threat-intelligence feed).


    In Security Center, you can see the security incidents using the **Security Alerts**
    dashboard. Follow these steps to access this type of alert:


    - 1. In the left pane of the **Security Center** window, under **Threat Protection**,
    click **Security Alerts**. If Security Center has identified a security incident
    in your environment, it will create an alert marked by a different icon. (See
    the first two alerts in Figure 6-11)


    | DESCRIPTION | COUNT | DETECTED BY | ENVIRONMENT... |

    |---|---|---|---|

    | Security incident detected | 1 | Microsoft | Azure |

    | Security incident detected | 1 | Microsoft | Azure |

    | Suspicious SVCHOST process executed | 21 | Microsoft | Azure |

    | Suspicious command execution | 21 | Microsoft | Azure |


    **FIGURE 6-11** Security incidents will appear in the Security Alert dashboard
    with a different icon


    - 2. Click a security incident. A new blade opens with more details about the
    incident. In the blade shown in 6-12, the incident contains two alerts and notable
    events. These notable events are contextual information that can help you during
    an investigation. (Note that the Subscription ID and Attacked Resource have been
    intentionally hidden in the figure.)


    ![](img/4b11e95292819ab1a383a41ef73aedb4_144_0.png)


    FIGURE 6-12 Details about a security incident


    NOTE The advantage of using the Security Incident blade is that it tells you which
    alerts are related. This can help you to track down the perpetrator and identify
    compromised systems.


    - 3. You can click an alert to see details about it. The details will be like
    those shown earlier in 6-13.


    - 4. Click a notable event. This opens a page containing contextual data about
    the event (Figure 6-13). This page shows the suspicious process name and the command
    line that was executed and emphasizes other information that is relevant to your
    investigation.


    ![](img/4b11e95292819ab1a383a41ef73aedb4_145_0.png)


    FIGURE 6-13 Contextual information with more details about an event


    - 5. Return to the main Security Center dashboard.


