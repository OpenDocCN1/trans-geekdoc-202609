    One thing in Azure that might be different from what you use on-premises is how
    it isolates one customer''s network from another''s. On-premises, you might use
    different virtual switches to separate different networks from each other. That''s
    perfectly reasonable. You can do that because you control the entire network stack
    and the IP addressing scheme on your network, as well as the entire routing infrastructure.
    Azure can''t give each customer that level of control because it needs to reuse
    the same IP address space among all the different customers, and it can''t tell
    each customer what segment of the private IP address space to use for their VMs.
    It can, however, apply isolation between tenants to better manage the IP space.


    Network access control is as important on Azure virtual networks as it is on-premises.
    The principle of least privilege applies both on-premises and in the cloud. One
    way to enforce network access controls in Azure is by taking advantage of NSGs.
    An NSG is equivalent to a simple stateful packet-filtering firewall or router,
    which is similar to the type of firewalling done in the 1990s (I say this not
    to be negative about NSGs, but to make it clear that some techniques for network
    access control have survived the test of time).


    > **IMPORTANT** For more details about Azure Network security, visit https://docs.microsoft.com/en-us/azure/security/network-overview.


    # ## Azure DDoS protection


    Azure can provide scale and expertise to protect against large and sophisticated
    DDoS attacks. However, following the responsibility model that we have in cloud
    computing, customers'
