    Center 将跟踪这些更改，让您能够控制自己的文件。FIM 利用 Azure 更改解决方案来跟踪和识别 VM 中的更改。启用文件完整性监控后，您将拥有类型为
    Solution 的 Change Tracking 资源。如果删除 Change Tracking 资源，Security Center 中的文件完整性监控功能将被自动禁用。


    要在工作流中启用 FIM，请按照以下步骤操作：


    - 1. 在 Security Center 仪表板中，在高级云防护 (Advanced Cloud Defense) 下，点击文件完整性监控 (File
    Integrity Monitoring)。将出现文件完整性监控窗格，显示您可以选择进行监控的工作区列表。如果是您第一次使用此功能，您将看到如图 5-9 所示，工作区旁有“启用
    (Enable)”。


    ![](img/4b11e95292819ab1a383a41ef73aed4_119_0.png)


    - 2. 点击启用按钮，在“启用文件完整性监控”窗格中，确认您已选择了 Windows 文件、注册表和 Linux 文件。点击“启用文件完整性监控”按钮以提交更改。


    FIM 可能需要一些时间来识别工作区中的计算机总量，请确保使用刷新按钮查看所有计算机是否已到位。在上面的示例中，此工作区只有三台计算机。当在接入计算机之前启用
    FIM 时，“总计算机 (Total Computers)”列将显示为零，如图 5-9 所示。


    ## 自定义您的设置


    虽然 Security Center 会建议应该监控哪些文件和注册表项，但您仍然可以自定义并添加自己的偏好。按照以下步骤执行此自定义：


    - 1. 在 Security Center 仪表板中，在高级云防护 (Advanced Cloud Defense) 下，点击文件完整性监控 (File
    Integrity Monitoring)。出现文件完整性监控窗格；选择您想要进行更改的工作区。


    - 2. 在文件完整性监控窗格中，点击设置 (Settings) 按钮，如图 5-11 所示，出现如图 5-11 所示的工作区配置 (Workspace Configuration)
    窗格。


    ![](img/4b11e95292819ab1a383a41ef73aedb4_120_0.png)


    ![](img/4b11e95292819ab1a383a41ef73aedb4_120_1.png)


    - 3. 您看到的第一个选项卡是 Windows 注册表，包含了所有可以监控的注册表项。注意，某些项被设置为 False（在“启用”列中），这意味着它们未被监控，而其他项为
    True，意味着当前正在监控该项。要添加新的注册表项，点击添加 (Add)，将出现“为更改跟踪添加 Windows 注册表”对话框，如图 5-12 所示。


    ![](img/4b11e95292819ab1a383a41ef73aedb4_120_2.png)


    - 4. 在项目名称 (Item Name) 字段中，为此注册表项输入友好名称。


    - 5. 在**Windows 注册表项 (Windows Registry Key)** 字段中，输入注册表路径（例如：HKEY_LOCAL_MACHINE\Software\Windows\CurrentVersion\Run）。


    - 6. 点击保存 (Save) 按钮提交更改。


    虽然添加新的监控注册表项非常简单，但 Windows 文件有更多配置选项。要查看可用选项，点击**Windows 文件 (Windows Files)**
    选项卡并点击添加 (Add)。出现“添加 Windows 文件”页面，如图 5-13 所示。


    ![](img/4b11e95292819ab1a383a41ef73aedb4_121_0.png)


    **图 5-13** 添加文件


