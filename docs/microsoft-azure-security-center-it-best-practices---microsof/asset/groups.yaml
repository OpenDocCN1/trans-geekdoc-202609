  - '[PAGE 164]


    # SIEM integration


    Security Information and Event Management (SIEM) is highly utilized by many organizations
    as the main source of truth when the subject is data security. The data ingested
    in this platform is highly utilized by the Security Operations (SOC) team. For
    large organizations that already have a SIEM solution in place, it is almost a
    requirement to integrate Security Center with their current SIEM solutions. These
    SIEM solutions will help the SOC team rationalize all the data that is ingested
    from platforms and perform data correlation across this data. In 2019, Microsoft
    launched its own SIEM solution, called Azure Sentinel, which can also be integrated
    with Security Center.


    In this chapter, you will learn how to integrate Security Center with Azure Sentinel,
    and Splunk.


    # Streaming logs to a SIEM solution


    Azure Security alerts are published to the Azure Monitor, which enables you to
    use Event Hub to route Security Center alerts to an on-premises or cloud-based
    SIEM solution. The general process occurs in three major phases:


    +   - Create an event hub that will be the destination for your Security Center
    data.

    - Stream Azure Monitor logs into the event hub.

    - Install and configure the SIEM solution vendor''s connector to stream the data
    from the Event Hub to your SIEM solution.


    While this is the general process for most of the third-party SIEM solutions,
    the for Azure Sentinel is much simpler, and it will be covered in the next section.'
  - '[PAGE 165]


    # Streaming logs


    Prior to Azure Monitor, each Azure service provided its own method to access monitoring
    data. Collecting log and metric data from Azure services involved a variety of
    methods, including querying REST APIs, reading from Azure Storage accounts, or
    even connecting to FTP servers. To help navigate this complexity, the Azure Security
    team created the Azure Log Integrator tool, which standardized and formatted the
    data, and passed it to SIEMs. Soon after that, Azure Monitor was introduced, which
    was a platform-monitoring service that offered a common way for all Azure services
    to expose their monitoring data.


    Azure Monitor operates at enterprise cloud scale and simplifies the routing of
    log data into SIEMs using a single schema and access point across all Azure services.
    This dramatically simplifies Azure log integration with SIEM tools and includes
    the alerts available from Azure Security Center. Going forward, Azure Monitor
    is Azure’s central logging pipeline and provides several out-of-the-box integrations
    with popular SIEM tools, such as Splunk and IBM QRadar.


    John Kemnetz, Program Manager


    # Azure Sentinel


    Microsoft Azure Sentinel is a cloud-native Security Information Event Management
    (SIEM) and Security Orchestration Automated Response (SOAR) solution. Azure Sentinel
    delivers intelligent security analytics and threat intelligence across the enterprise,
    providing a single solution for alert detection, threat visibility, proactive
    hunting, and threat response.


    Azure Sentinel enables you to collect data across devices, applications, and infrastructure,
    both on-premises and in multiple clouds. Azure Sentinel leverages Log Analytics’
    workspace for data storage, as shown in Figure 8-1.'
  - '[PAGE 166]


    ![](img/4b11e95292819ab1a383a41ef73aedb4_166_0.png)


    FIGURE 8-1 Azure Sentinel data ingestion and storage


    # Leveraging the power of the cloud, Machine Learning, and Microsoft’s experts
    to defend your environment


    Microsoft Azure Sentinel is the first cloud-native SIEM + SOAR solution built
    into a major cloud provider. It supports data sources from Microsoft offerings
    and Azure, as well as from on-premises, partners, and other cloud providers.


    For the defender, Azure Sentinel makes threat detection, investigation, and response
    smarter and faster. By having all the relevant data in a single place, you can
    quickly correlate signals from your environment, gain insights, and initiate remediation—all
    within Azure Sentinel. We have Machine Learning (ML) models that identify attacks
    through multiple stages (for example, a suspicious log followed by setting a mail
    forwarding rule). We also fuse related alerts together and adjust their severity,
    which not only helps reduce the volume of alerts but also helps defenders focus
    and prioritize the alerts. And we support bringing your own ML models.'
