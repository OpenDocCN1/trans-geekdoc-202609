    这种控制是通过 Azure 网络功能启用的，而不是通过虚拟机本身的任何功能，它适用于来自 Internet 的入站连接。Azure Security Center
    的 JIT VM 访问（即时访问）功能非常简单。以下是关键点：


    - Azure Security Center JIT 的主要目标是保护虚拟机管理端口，例如 RDP、SSH 和远程 PowerShell 端口。

    - JIT 限制了端口开放持续长度。端口仅在完成工作所需的时间内开放（由你定义时长）。

    - 网络安全组 (NSG) 规则控制对 JIT 策略中定义的管理端口的访问。

    - 仅 ARM VM 支持 Azure Security Center JIT VM 访问。

    - 我们建议在所有支持该功能的虚拟机上使用 JIT。事实上，只有在虚拟机没有关联 NSG 或该虚拟机是经典版虚拟机（classic VM）时，我们才建议使用
    JIT。

    - 有时，当虚拟机可能符合 JIT VM 访问的条件时，Azure Security Center 不会发布此类建议。这发生在：订阅或资源组层级设置的安全策略禁用了
    JIT 解决方案时，虚拟机没有公网 IP 地址，以及虚拟机未关联 NSG 时。

    - JIT VM 访问提供一组默认管理端口，你可以使用它们来启用访问。你也可以创建新端口并删除现有端口。

    - 管理员设置 JIT 策略，该策略定义了可以使用哪些端口。当用户请求 JIT 访问时，他或她可以使用策略中定义的端口。为了提高安全性，用户可以删除除远程管理访问所需的端口之外的所有端口。

    - 你可以使用 PowerShell 配置 JIT 策略并请求访问。

    - 当用户请求 JIT 访问时，Azure Security Center 会检查他们的 RBAC 权限。如果用户拥有虚拟机的相应权限，将授予 JIT 访问。此时，Azure
    Security Center 将动态创建 NSG 规则以允许入站管理流量。当 JIT 访问过期后，NSG 规则将被删除。注意，连接不会被主动重置，因此已连接的用户将保持连接，直到用户由于或其他原因断开连接。


    要探索此功能，请在 Azure Portal 的左侧窗中选择 **Azure Security Center**。然后选择 **Just-In-Time Access**。JIT
    VM 访问的主界面解释了该功能是什么及其工作原理。它还包含 Virtual Machines（虚拟机）标题下的主要标签页，如图 5-1 所示。


    如果 Azure Firewall 后面的虚拟机 JIT 访问请求获得批准，Security Center 将自动更改 NSG 和防火墙规则。


    ## 什么是即时虚拟机访问（just in time VM access）？


    即时虚拟机访问允许你通过阻塞指向特定端口的入站流量在网络级别锁定虚拟机。它允许你仅在特定需要时允许访问，从而控制访问并减少虚拟机上的攻击面。


    ## 它是如何工作的？


    根据用户在 Azure RBAC 上的请求，Security Center 将决定是否授予访问。如果请求获得批准，Security Center 将自动配置
    NSG 以在请求的时间内允许这些端口的入站流量，之后会将 NSG 恢复到之前的状态。


    更多信息请参阅文档 >


    ## Virtual machines


    | 已配置 | 建议 | 无建议 |

    |---|---|---|

    | 已经实施即时虚拟机访问控制的虚拟机。显示的数据为上周。 | | |


    图 5-1 JIT VM 访问主页


    **Configured**（已配置）标签显示了配置为支持 Azure Security Center JIT 的虚拟机列表。它还指示了用户登录虚拟机的次数。**Recommended**（建议）标签包含当前尚未配置使用
    Azure Security Center JIT 的虚拟机列表——但可能应该配置，如图 5-2 所示。


    | 已配置 | 建议 | 无建议 |

    |---|---|---|

    | 我们建议应用即时虚拟机访问控制的虚拟机。 | | |


    ## 5 VMs


    搜索以筛选项目...


    | VIRTUAL MACHINE（虚拟机） | STATE（状态） | SEVERITY（严重程度） |

    |---|---|---|

    | DevTeam | Open | High |

    | KLVM3 | Open | High |


    图 5-2 未配置 JIT 但可能应该配置的虚拟机列表


    **No recommendation**（无建议）标签包含不应配置使用 JIT 的虚拟机列表。在这里，你可能会看到经典虚拟机或未关联 NSG 的虚拟机。要查看经典虚拟机列表，请展开
    **Classic Virtual Machine**（经典虚拟机）类别。查看未关联 NSG 的虚拟机，展开 **Missing Network Security
    Group**（缺少网络安全组）类别。注意，还有一个名为 **Other**（其他）的类别，如图 5-3 所示。


    ## 配置 JIT


    你可以使用 Security Center 仪表板或 PowerShell 配置 JIT。但在开始配置之前，请确保你拥有配置 JIT 策略的相应权限，如表
    5-1 所示。


    表 5-1 JIT 策略权限


    | Scope（作用范围） | path（路径） | Permission（权限） |

    |---|---|---|

    | 虚拟机所在的订阅或资源组 | Microsoft.Security/locations/jitNetworkAccessPolicies | Write
    |

    | 订阅、资源组或虚拟机 | Microsoft.Compute/virtualMachines | Write |


    一旦获得相应级别的权限，请按照以下步骤使用 Security Center 仪表板配置 JIT VM：


    1. 在 **Recommended**（建议）标签中，选择你想要配置 JIT 访问的虚拟机。

    2. 点击 **Enable JIT**（启用 JIT）按钮。打开 JIT 配置页面，如图 5-4 所示。


    3. JIT 访问配置指定了 JIT 应用的端口和协议。默认端口为：

    - 22 (SSH)

    - 3389 (RDP)

    - 5985 (PowerShell)

    - 5986 (Remote PowerShell)


    4. 执行以下操作之一：

    - 如果这些都是你为 JIT 需要的端口，点击 Save（保存）。

    - 如果你想从列表中省略任何端口，点击该条目并点击 Delete（删除）。

    - 如果你想添加端口，点击 Add（添加）。


    5. 点击 Add 将打开端口配置页面（见图 5-5）。在此处配置以下设置：

    - Port（端口）：该协议使用的端口。

    - Protocol（协议）：通常你会选择 TCP 或 UDP，但也可以选择 Any。

    - Allowed IPs（允许的 IP）：此设置有两个选项：Per request（按请求）或 CIDR block。如果你选择 Per request，当前分配给客户端的
    IP 地址将会被允许。如果你选择 CIDR block，你可以定义客户端系统在连接到资源之前必须拥有的 IP 地址集合。

    - Max request time（最大请求时间）：用户可以请求的最长时间。默认值为 3 小时，但允许用户请求更多或更少的时间。


    6. 点击 OK 并点击 Save 提交更改。此虚拟机现在将出现在 Recommended 标签中，如图 5-6 所示。


