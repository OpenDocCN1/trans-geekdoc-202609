    \ You can also build a hierarchy of management groups, with a root management\
    \ group at the top of each directory. Conditions applied to the root management\
    \ group—or to a management group—flow down to lower management groups and subscriptions.\
    \ An example of a management group hierarchy is shown in Figure A-3.\n\n![](img/4b11e95292819ab1a383a41ef73aedb4_211_0.png)\n\
    \nFIGURE A-3 Example of a management group hierarchy\n\n## Security Center and\
    \ Azure Policy, better together\n\nWhen a new Azure subscription is created and\
    \ the subscription is registered with the Microsoft Security Resource Provider\
    \ (RP), the default behavior is that a Security Center policy initiative is provisioned\
    \ and assigned at the subscription level. The exception is that if the subscription\
    \ resides in a Management Group that already has the Security Center initiative\
    \ assigned, the Security Center initiative will not be assigned to any of the\
    \ subscriptions within that management group. This approach has a couple of advantages:\n\
    \n- You define the governance conditions in a single place, either at the Root\
    \ Management Group or at the lower management groups.\n- You can assign deny policies\
    \ at a high-level that cannot be overridden at a lower level.\n- There is a clear\
    \ view of your compliance state across your management groups and subscriptions.\n\
    \n## Scoping your deployment of ARM templates and Azure Policy\n\nEvery ARM template\
    \ deployment and Azure Policy assignment is targeted at a scope, such as management\
    \ groups, subscriptions, or resource groups. Because Security Center is a subscription-level\
    \ resource, ARM templates and Azure Policy deployments and assignments must be\
    \ targeted at the subscription level. This is a common misunderstanding when configuring\
    \ and managing Security Center at scale. The example in Figure A-4 shows a subscription-level\
    \ deployment.\n\n![](img/4b11e95292819ab1a383a41ef73aedb4_212_0.png)\n\nFigure\
    \ A-4 shows the use of the PowerShell command New-AzDeployment, which targets\
    \ a subscription-level deployment. Because Azure Policy definitions and assignments\
    \ can be deployed through ARM templates as well, the same concept applies.\n\n\
    > NOTE Support for deploying and assigning an Azure Policy at the (Root) management\
    \ group was announced in May 2019.\n\n## Best practices for managing Security\
    \ Center at scale\n\nResearch and define compliance conditions that apply to your\
    \ organization, group them in Azure initiative, Inheritance ensures that these\
    \ apply to lower management groups and subscriptions. Also, you should follow\
    \ the general best practices:\n\n- Tailor the Security Center initiative to your\
    \ needs.\n- Create custom Policy definitions according to your needs.\n- Target\
    \ exceptions at lower management groups, such as dev and test environments.\n\
    - Deploy and maintain Azure Policies and initiatives using Infrastructure as Code\
    \ (IaC).\n- Don't be tempted to “manually” configure ASC. Instead, you should\
    \ leverage Azure Policy and ARM Templates where possible.\n- Ask yourself if you\
    \ can provision a new tenant or subscription with automation.\n- First, test with\
    \ auditIfNotExists Azure Policies using deny policies.\n"
  mdcn: "\n\n# 附录 A\n\n## 大规模管理安全中心\n\n作者：TIANDER TURPLIN，CXE SECURITY 高级计划经理\n\n\
    在威胁同样飞速发展的快速世界中，任何安全解决方案都必须支持具有大规模管理愿景的持续集成/持续部署（CI/CD）流水线。Microsoft Azure 有三个重要的支柱来支持这一点：Azure\
    \ 资源管理器 (ARM) 模板、Azure Policy 和 Azure 管理组。本附录涵盖了在大规模管理安全中心的主要考虑因素。\n\n## 大规模管理的重要性\n\
    \n无限的云端速度和规模允许你自己在 Azure 中创建任意数量的订阅。然而，这带来了管理和合规性挑战。你如何以高效且自动的方式，跨多个租户（可能横跨数百个订阅）实施并实现合规性？实现这一点的关键概念是管理组、ARM\
    \ 模板和 Azure Policy。\n\n## 三种模板\n\n通过 ARM 模板，你以 JSON 文件的形式声明部署，该文件包含你需要的对象。它包含了资源的类型、名称和属性。JSON\
    \ 文件可以提交到源码控制解决方案中，支持版本控制，并允许你部署 Azure“基础设施即代码”。两种部署类型——增量和完整——允许你仅部署模板中声明的内容（完整），或添加/更新额外的资源（增量）。完整部署会删除所有模板中未指定的资源。因此，增量是默认部署类型。ARM\
    \ 模板是幂等性的，这意味着如果资源不存在则将创建它，否则将更新现有资源。幂等性允许你重复部署相同的模板而不破坏任何内容。在部署 ARM 模板时，JSON\
    \ 文件会被 Azure 资源管理器 API 消费，该 API 与其资源提供程序有约定。资源提供程序 (RP) 是一个受信任的 HTTPS RESTful\
    \ API 端点，可以代表用户配置、删除和管理服务。下面，你可以找到用于部署或更新 Log Analytics 工作区的 ARM 模板示例。\n\n图 A-1\
    \ 显示了主要部分的 JSON 文件示例\n\n图 A-1 所示模板中高亮的章节解释如下：\n\n- 第 3 行包含此模板的版本号，允许用于 CI/CD 流水线的源码控制集成。\n\
    - 第 4 行包含参数，像变量一样，可以在整个模板中使用。\n- 第 20 行显示你可以指定允许的值，从而限制用户输入。\n- 第 37 行指定了每个资源提供程序的\
    \ API 版本。\n- 第 38 行和 39 行显示了如何使用参数。\n- 第 40 行指定了资源提供程序的类型。\n\nAzure Policy 为你的\
    \ Azure 环境提供治理控制。它可以阻止（拒绝）创建不合规资源，并可以审计合规性（audit 和 auditIfNotExists）。它甚至可以修复（deployIfNotExists）不合规资源，无论是创建时还是针对现有资源。图\
    \ A-2 所示的 Azure Policy 定义示例阻止了在 Azure 中创建未启用 HTTPS 的网站。\n\n```json\n{\n  \"mode\"\
    : \"All\",\n  \"policyRule\": {\n    \"if\": {\n      \"allOf\": [\n        {\n\
    \          \"field\": \"type\",\n          \"equals\": \"Microsoft.Web/sites\"\
    \n        },\n        {\n          \"not\": {\n            \"field\": \"Microsoft.Web/sites/httpsOnly\"\
    ,\n            \"equals\": \"true\"\n          }\n        }\n      ]\n    },\n\
    \    \"then\": {\n      \"effect\": \"deny\",\n      \"details\": {\n        \"\
    type\": \"Microsoft.Web/sites\",\n        \"existenceCondition\": {\n        \
    \  \"field\": \"Microsoft.Web/sites/httpsOnly\",\n          \"equals\": \"true\"\
    \n        }\n      }\n    }\n  },\n  \"parameters\": {}\n}\n```\n\n图 A-2 效果为拒绝（deny）的策略定义示例\n\
    \n当一组 Azure Policy 定义组合在一起时，它被称为策略集（initiative）。定义和策略集都可以分配到某个范围，例如管理组或订阅。Azure\
    \ 管理组是支持大规模管理的第三个支柱，它们提供了订阅之上的范围。当你将订阅组织到管理组时，可以在此处定义治理条件。你还可以构建管理组层级，根管理组位于顶部。应用于根管理组的条件会向下传递到下级管理组和订阅。图\
    \ A-3 显示了管理组层级的示例。\n\n![](img/4b11e95292819ab1a383a41ef7)\n\n图 A-3 管理组层级示例\n\n\
    ## 安全中心与 Azure Policy，结合使用更佳\n\n当创建新的 Azure 订阅并注册 Microsoft 安全资源提供程序 (RP) 时，默认行为是在订阅级别分配安全中心策略集。例外情况是，如果订阅位于已分配了安全中心策略集的管理组中，则该策略集不会再次分配给该组内的任何订阅。这种方法有两个优势：\n\
    \n- 你可以在一处（根管理组或管理组）定义治理条件。\n- 你可以在高层分配拒绝策略，且在底层无法覆盖。\n- 跨管理组和订阅的合视图清晰。\n\n##\
    \ ARM 模板和 Azure Policy 的部署范围\n\n每个 ARM 模板部署和 Azure Policy 分配都针对特定的范围，例如管理组、订阅或资源组。由于安全中心是订阅级资源，ARM\
    \ 模板和 Azure Policy 的部署及分配必须针对订阅级别。这是在大规模配置安全中心时的常见误区。图 A-4 显示了订阅级部署。\n\n![](img/4b11e95292819ab1a383a41ef)\n\
    \n图 A-4 显示了 PowerShell 命令 New-AzDeployment 的用法，该命令目标是订阅级部署。由于 Azure Policy 定义和分配也可以通过\
    \ ARM 模板部署，相同的原理同样适用。\n\n> 注意：2019 年 5 月宣布支持在（根）管理组上部署和分配 Azure Policy。\n\n##\
    \ 大规模管理安全中心的最佳实践\n\n研究并定义适用于组织的合规条件，将其分组在 Azure 策略集中，继承机制确保了这些条件适用于下级管理组和订阅。此外，你还应该遵循以下通用最佳实践：\n\
    \n- 根据需求定制安全中心策略集。\n- 根据需求创建自定义策略定义。\n- 将异常指向下级管理组（例如开发和测试环境）。\n- 使用基础设施即代码 (IaC)\
    \ 部署和维护 Azure Policy 和策略集。\n- 不要试图“手动”配置 ASC。相反，尽可能利用 Azure Policy 和 ARM 模板。\n\
    - 问自己是否可以通过自动化配置新租户或订阅。\n\n"
