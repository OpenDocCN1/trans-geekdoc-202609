    上运行的虚拟机上使用这种强大的安全技术。你任何在本地运行的虚拟机上也应该使用类似的技术。


    另一个选项是使用 Azure 存储服务加密 (SSE) 来保护静态数据。该服务保护你的数据。当你使用此功能时，Azure Storage 会在持久化到存储之前自动加密数据，并在检索之前解密。加密、解密和密钥管理过程对用户是完全透明的。


    > **重要** 有关 Azure 存储安全的更多详细信息，请访问 https://docs.microsoft.com/en-us/azure/security/security-storage-overview。


    ## Azure Storage 高级威胁保护


    当你为 Azure Storage 启用高级威胁保护 (ATP) 时，发生异常访问和数据外泄活动时，你可以通过警报收到通知。这些警报包括此类检测，例如：


    - 从异常位置访问

    - 异常数据提取

    - 异常的匿名访问

    - 意外删除

    - 访问权限更改

    - 上传 Azure 云服务包


    你只需在想要保护的存储账户上将其“开启 (ON)”，即可启用此功能，如图 1-11 所示。Azure 警报的高级威胁保护 (ATP) 将流到 Azure 安全中心，允许你在一个位置保留所有与安全相关的警报。


    ![](img/4b11e95292819ab1a383a41ef73aedb4_36_0.png)


    图 1-11 在 Azure 中为存储账户启用 ATP


    > **重要** 有关 Azure Storage 高级威胁保护的详情，请访问 http://aka.ms/storageatp。


    ## 身份


    Azure 身份保护是 Azure Active Directory (AD) 的一部分，因为它能够检测潜在的身份相关漏洞以及与用户身份相关的可疑操作而被广泛使用；它也因其调查事件的能力而被广泛使用。Azure
    AD 身份保护警报也将流到 Azure 安全中心。


    > **重要** 有关 Azure AD 身份保护的详情，请访问 http://aka.ms/AzureADIdentityProtection。


    ## 日志


    多年来，始终保留可用日志以调查安全相关问题已变得越来越重要。Azure 提供了不同类型的日志；理解它们的区别可以在调查期间提供帮助。数据平面日志将反映作为使用
    Azure 资源而触发的事件；此类日志的示例是在存储中写入文件。控制平面日志反映由 Azure 资源管理器 (ARM) 触发的事件；此类日志的示例是创建存储账户。


    这些日志可以从 Azure 的不同服务中提取。图 1-12 显示了不同的日志分层。


    | 应用程序 |

    | --- |

    | 用户遥数据 |

    | 应用程序日志 |

    | 访客操作系统 |

    | Linux syslog |

    | Windows 事件 |

    | Azure 资源 |

    | 虚拟机 |

    | 存储账户 |

    | 网络安全组 |

    | 资源管理器 |

    | 服务健康 |

    | 安全中心 |

    | Azure Active Directory |


    **图 1-12** Azure 中不同的日志分层


