    -   获取使用你应用的组织的许可：在此步骤中，Azure AD 管理员需要授权组织（租户）使用该应用。\n\n# 使用 Security Graph API\n\
    \nSecurity Graph API可以通过 Microsoft Graph 访问；换句话说，它使用单一连接点 (https://graph.microsoft.com)，具有相同的语法\
    \ REST API 和 JSON 格式的响应。通过 Security Graph API 访问的安全数据受权限和 Azure AD (AAD) 角色的保护。要使用\
    \ Security Graph API 从 Security Center 获取告警，你需要使用类似示例的 HTTP GET 请求：\n\nhttps://graph.microsoft.com/v1.0/security/alerts\n\
    \n此 GET 请求的一个重要方面是，它将检索租户中可能存在的所有提供商的告警，包括 Azure Security Center、Azure Active\
    \ Directory Identity Protection、Microsoft Cloud App Security、Windows Defender\
    \ Advanced Threat Protection、Azure Advanced Threat Protection、Office 365、Cloud\
    \ App Security、Azure Information Protection（预览）、Azure Sentinel 以及你可能访问的其他合作伙伴提供商（如\
    \ Palo Alto Networks）。\n\n取决于你拥有的服务提供商数量，通过简单的 GET 请求获取所有告警返回的数据量可能是巨大的。使用过滤器来针对你真正想要看到的信息是一个好主意。例如，如果你只想查看前\
    \ 10 个高严重告警，可以使用下面的 GET 请求：\n\nhttps://graph.microsoft.com/v1.0/security/alerts?$filter=severity\
    \ eq 'High'&$top=10\n\nURL 中加粗的部分代表了为仅检索所需信息而创建的过滤器。如果你想在开始编写应用之前验证你的 GET 请求，可以使用\
    \ Microsoft Graph Explorer (https://developer.microsoft.com/en-us/graph-explorer)\
    \ 测试 URL。对于此示例，你将获得一个列出前 10 个高严重告警的结果。虽然此过滤器有所帮助，但它仍会显示你访问的所有安全提供商的 10 个高严重告警。如果你想查看由\
    \ Security Center 生成的告警，可以使用 `vendorInformation` 属性按供应商进行过滤，如示例所示：\n\n```\nhttps://graph.microsoft.com/v1.0/security/alerts?$filter=vendorInformation/provider\
    \ eq='ASC'\n```\n\n如果你登录到带有 Security Center 的订阅并使用 Microsoft Graph Explorer 此\
    \ GET 请求，该请求将仅检索安全提供商为 Security Center 的告警（见图 10-3）。\n\n![](img/4b11e95292819ab1a383a41ef73aedb4_206_0.png)\n\
    \n图 10-3 Graph Explorer\n\n你还可以使用逻辑运算符来扩展查询。例如，如果你只想查看 Security Center 生成的高严重告警，可以使用以下\
    \ GET 请求。（注意加粗字符串的添加）。\n\n```\nhttps://graph.microsoft.com/v1.0/security/alerts?$filter=vendorInformation/provider\
    \ eq='ASC' and Severity eq 'High'\n```\n\n"
