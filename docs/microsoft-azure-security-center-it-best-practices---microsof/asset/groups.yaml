    # 安装和配置 Splunk 的 Azure Monitor 插件


    要安装并配置 Splunk 的 Azure Monitor 插件，请遵循 Splunk 在 http://aka.ms/ascsplunkaddon 维护的说明。如果你想查看日志在
    Splunk 中外观的示例，请参阅 http://aka.ms/ascsplunk。


    # 与其他微软解决方案集成


    使用 Azure Security Center 作为你的云保护平台的优势之一是能够与其他微软安全解决方案进行原生集成。其意图是扩大威胁检测能力以涵盖其他场景，同时利用微软其他解决方案提供的威胁情报。通过集成而非重新发明，Security
    Center 可以继续专注于提供出色的威胁检测体验，并提供可以流向其他平台（如 SIEM）的共享信号。在本章中，你将学习如何将 Security Center
    与 Windows Server Defender ATP、Microsoft Cloud App Security、SQL 高级防护 (ATP) 以及针对存储账户的高级防护
    (ATP) 集成。


    # 扩大威胁检测范围


    在第 2 章“Azure Security Center”中，你学习了云安全配置管理 (CSPM) 和云工作负载保护平台 (CWPP)。你还学习了 Security
    Center 与某些 Azure 工作负载（如 AppServices、容器等）的原生集成。与 Windows Server Defender ATP 的集成补充了
    Security Center 在 CWPP 场景下的覆盖。对于原生 Azure 工作负载，Security Center 还可以利用存储账户的高级防护解决方案。


    # 与 Microsoft Defender ATP 集


    Security Center 扩展其云工作负载保护平台 (CWPP) 的集成，引入 Windows 高级防护 (ATP) 并带来端点检测与响应 (EDR)
    能力。对于已加入 Security Center 的支持的 Windows 服务器，会自动启用 Microsoft Defender ATP 传感器。


    > 重要：此功能支持 Windows Server 2012 R2、Windows Server 2016，且仅支持具有标准级（Standard Tier）订阅的服务器。在我们编写本章时，Windows
    Server 2019 尚未支持 Windows Defender ATP。


    从用户的角度来看，入组过程是无缝的。如果机器位于 Azure 中且 Auto Provision（自动配置）配置为 On，则将部署微软监控代理 (MMA)。MMA
    部署后，它将检查操作系统是否支持接收 Windows Defender ATP。如果已启用，则会将 Microsoft Defender 传感器部署到虚拟机。整个入组过程可能需要
    24 小时。


    对于位于本地或不同云提供商的机器，入组过程基本上相同；唯一的区别是你需要在目标机器上手动安装 MMA。要启用此集成，请按照以下步骤操作：


    - 1. 打开 Security Center

    - 2. 在左侧栏的 Policy & Compliance（策略与合规）下，点击 Security Policy（安全策略）。

    - 3. 对想要启用此集成的订阅点击 Edit Settings（编辑设置）。

    - 4. 在 Settings（设置）下，点击 Threat Detection（威胁检测），出现 Enable Integrations（启用集成）窗格。

    - 5. 选择 Allow Windows Defender ATP to Access My Data（允许 Windows Defender ATP 访问我的数据）选项并点击
    Save。一旦集成启用且服务器完全入组，服务器上的 Windows Defender ATP 传感器将向 Microsoft Defender ATP 云服务报告遥测数据。一旦
    Microsoft Defender ATP 触发攻击指标，将在 Center 和工作区中发布警报（见图 9-2）。


