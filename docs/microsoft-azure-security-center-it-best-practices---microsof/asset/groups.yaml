    # Linux 检测


    当 Linux 检测功能首次发布时，依赖于在 Linux 操作系统中安装 AuditD。虽然 AuditD 提供了大量可用于检测威胁的信息，但并非所有的 Linux
    发行版都会默认安装 AuditD。因此，安全中心中 Linux 检测的检测行为的最新变化是，将收集相关数据的必要元素直接内置在代理（MOM 代理）中。


    > 提示：您可以使用位于 http://aka.ms/ASCLinuxDetections 的剧本（Playbook）在安全中心中测试 Linux 检测。


    # 容器检测


    在我们编写本章时（2019 年 3 月），安全中心的容器检测主要集中在三个主要领域：


    -   特权容器执行

    -   暴露的 Docker 守护进程

    -   容器内运行 SSH 服务器


    虽然这些是针对容器场景的，但需要提到，通常情况下，即使进程在容器内部运行，它们对于主机上的 MOM 代理仍然是可见的。因此，Linux 检测也将是有效的。


    # Azure SQL 检测


    安全中心的资源分析聚焦于平台即服务（PaaS）服务，例如与 Azure SQL 数据库和 Azure SQL 数据仓库的威胁检测集成。SQL 威胁检测可以检测出异常活动，表明存在访问或利用数据库的寻常且具有潜在危害的尝试，并触发后续警报。图
    6-9 所示的示例就是由此引起的潜在 SQL 注入。（注意，图中刻意隐藏了订阅 ID 和受攻击的资源。）


    ![](img/4b11e95292819ab1a383a41ef73aedb4_139_0.png)


    图 6-9 识别出潜在 SQL 注入的 SQL 检测


    # Azure App Services 检测


    Azure App Service 是一种用于托管 Web 应用程序、REST API 和移动后端的服务。它允许您使用许多语言进行开发，如 .NET、.NET
    Core、Java、Ruby、Node.js、PHP 或 Python。应用程序在 Windows 和 Linux 上运行并扩展。安全中心利用云的规模来识别针对
    App Service 应用程序的攻击，同时在攻击者处于侦察阶段（通过扫描来识别托管在 Azure 上的多个网站的漏洞）时，关注新兴攻击。


    安全中心的 App Service 检测包括分析和机器学习模型，涵盖了所有允许客户与其应用程序交互的接口，无论是通过 HTTP 还是通过管理方法之一。


    # Azure Security Center 中的 App Services 检测


    Azure 最近宣布，其利用云的规模来识别针对客户应用程序的攻击。由于 Web 应用程序几乎存在于任何现代网络中，攻击者会探测以寻找并利用漏洞。


    在路由到特定环境之前，运行的应用程序请求在经过检查和记录时会通过多个网关。这些数据随后用于识别利用行为和攻击者，并学习稍后使用的新模式。通过利用 Azure
    作为云提供商的可视性，安全中心分析 App Service 内部日志，以识别针对多个目标的攻击方法，例如广泛扫描和分布式攻击。


    这类攻击通常来自一小部分 IP 地址，并表现出对多个主机上的类似端点进行爬取并搜索特定漏洞页面或插件的模式。这可以使用云能力轻松检测到，但无法从单个主机进行识别。安全中心还可以访问底层的沙箱和虚拟机。结合内存取证，基础设施可以讲述故事，从一种在野外传播的新攻击到客户机器被攻破。因此，安全中心可以在应用程序被利用很之后仍检测到针对
    Web 应用程序的攻击。


    Ram Pliskin，Azure Security Center 团队高级计划经理


    # Azure 资源检测


    安全中心还有安全警报来检测异常活动。资源安全检测聚焦于使用资源管理器（ARM）服务的异常或潜在危害操作。安全检测可以识别不安全的配置，常见的资源检测工具包括：


