  - '[PAGE 167]


    At Microsoft, we have Incident Response and Threat Analysis teams that go through
    these large amounts of data from different offerings as part of their jobs. Azure
    Sentinel brings Microsoft''s knowledge and capabilities, both from specific detections
    and queries to the cloud-scale automation. Some of these include the following:


    +   - Investigation visualization. While it''s great to have access to all the
    data in a form that can be queried, it''s sometimes more effective to have a visual
    representation of the attack and the relationship between different entities and
    events. Azure Sentinel provides graph visualizations to show insights, timelines,
    and relationships at a glance. Now, so can defenders.


    +   - Proactive hunting. While alerts and ML models are powerful ways of identifying
    and investigating potential compromises, we know that sometimes you need to look
    through the data for suspicious activity. We''ve worked closely with the teams
    that do proactive hunting at Microsoft to provide a set of queries and Azure Notebooks
    that are the starting point of those hunts.


    +   - Automated Remediation. By integrating with Azure Logic Apps, you can automate
    the remediation actions. Azure Logic Apps has many connectors already available,
    so there are many actions available to you. For example, you can do any of the
    following:


    +   - You can create or update a ticket in your Case Management system.

    - You can send a notification to your team''s Slack or Teams channel.

    - You can block an IP from your firewall.


    +   - You can request a multi-factor authentication for a user. You can also combine
    all these actions.


    +   - GitHub community. Azure Sentinel has a GitHub community where we will continue
    to provide detections, hunting queries, Azure Notebooks, parsers, and dashboards.
    And so can you.


    Azure Sentinel reduces the time it takes to understand what''s happening in your
    environment, prioritize where you need to act first, and determine the right remediation.
    We have just started this journey, and we look forward to your feedback and input.


    Laura Machado de Wright, Principal PM Manager, Enterprise Protection and Detection
    team'
  - '[PAGE 168]


    To enable Azure Sentinel, you need a Azure Subscription, a Log Analytics Workspace,
    contributor permissions on the subscription which the Azure Sentinel resides,
    and either contributor or viewer permissions on the resource group that the workspace
    belongs to.


    If you are using the default workspace created by Security Center, this workspace
    will not appear in the list when you try to enable Azure Sentinel. The rationale
    behind this is that default workspaces are managed by the service that created
    it (in this case, Security Center). Microsoft wants customers to have full control
    on their workspaces, including managing their retention periods and locations
    for their Azure Sentinel installation.


    > NOTE At the time this chapter was written, Azure Sentinel was still in Public
    Preview. Make sure to visit http://aka.ms/azuresentinel for the latest information.


    # Integration with Azure Sentinel


    When you configure Security Center integration with Azure Sentinel, all security
    alerts generated in Security Center are streamed to Azure Sentinel. To configure
    this integration, Security Center must be enabled with the Standard tier in the
    target subscription. Also, you need to be logged in with a user who has global
    administrator or security administrator permissions on each subscription that
    you want to connect. Follow the steps below to configure this integration:


    +   1. Using Azure Portal, click All Services on the left navigation pane and
    type Azure Sentinel.

    2. The Azure Sentinel Workspaces blade appears for you to either select an existing
    workspace or create a new one. Because there is an assumption that Azure Sentinel
    has been already configured, so select the integration with Security Center, there
    select the workspace that you are currently using.

    3. The Azure Sentinel Overview page appears; in the left pane, under the Configuration
    section, click Data connectors, as shown in Figure 8-2.


    ![](img/4b11e95292819ab1a383a41ef73aedb4_168_0.png)


    FIGURE 8-2 Configuration section in Azure Sentinel'
  - '[PAGE 169]


    4. The Azure Sentinel – Data connectors blades appear. In the list of connectors,
    click Azure Security Center, and click Open connector page, and the Azure Security
    Center connector blades appear as shown in Figure 8-3:


    ![](img/4b11e95292819ab1a383a41ef73aedb4_169_0.png)


    FIGURE 8-3 Azure Security Center connector blade


    5. Under Configuration section, click Connect besides the subscription that you
    want to enable.


    6. Close the blade and when return to Azure Sentinel – Data Connectors, click
    Refresh button. You will see that the Azure Security Center connector status appears
    as Connected, as shown in Figure 8-4:


    ![](img/4b11e95292819ab1a383a41ef73aedb4_169_1.png)


    FIGURE 8-4 Selecting the subscription that has Security Center


    7. Close all blades and return to Azure Sentinel main page.


    At this point the security alerts that are triggered in Security Center will appear
    in Azure Sentinel.'
  - '[PAGE 170]


    # Accessing alerts in Azure Sentinel


    The alerts generated by Security Center could appear in Azure Sentinel as part
    of a case, which is an aggregation of all the relevant evidence for a specific
    investigation and can include multiple alerts coming from different data sources,
    as shown in Figure 8-5.


    ![](img/4b11e95292819ab1a383a41ef73aedb4_170_0.png)


    FIGURE 8-5 Azure Sentinel performs data aggregation using alerts from multiple
    data sources


    In the diagram shown in Figure 8-5, the Suspicious PowerShell Activity Detected
    was raised by Security Center, as you can see in the Product Name field. Because
    this alert is in the workspace used by Azure Sentinel, you can leverage the searching
    capabilities in Azure Sentinel to obtain more information about this. Go to the
    Azure Sentinel main page, click Logs in the left navigation pane, and you will
    see the Logs page, as shown in Figure 8-6.


    ![](img/4b11e95292819ab1a383a41ef73aedb4_170_1.png)


    FIGURE 8-6 The Azure Sentinel Logs page'
  - '[PAGE 171]


    This search page uses Kusto Query Language (KQL) for queries. A Kusto query is
    a read-only request to process data and return results. The request is stated
    in plain text, using a data-flow model designed to make the syntax easy to read.
    The query schema entities that are organized in a hierarchy similar to SQL''s
    databases, tables, and columns. Figure 8-6 shows the schema that is available
    for this workspace. This information is located under the Active section, which
    includes DnsAnalytics, Security, WindowsFirewall, and others.


    # Using threat hunting to find undetected attacks


    > an evolving threat landscape, it is inevitable that some attacks will slip through
    the cracks. Mature security organizations use threat hunting to identify and respond
    to such attacks. When threat hunting, security analysts must sort through mountains
    of log data. Microsoft has built tools into Azure Sentinel to streamline this
    process and help analysts take advantage of Microsoft experience.


    Azure Sentinel is built on Log Analytics, which provides a rich KQL experience
    for filtering, summarizing, and joining data sets to zero in suspicious behaviors.
    The Microsoft Threat Intelligence Center provides baked in hunting queries based
    on years of experience. These queries can be run as for immediate results with
    minimal time investment. Alternatively, these queries can be customized to target
    specific threats and adapt to the specific needs of your environment.


    Once an analyst has found an interesting result, analysts can create Hunting Bookmarks
    to preserve and share queries and query results with teammates. Analysts can also
    record contextual observations by adding notes and tags. All bookmarked data can
    be investigated using the Azure Sentinel investigation experience, which lets
    analysts explore the relationships between entities, as IP addresses, hosts, and
    accounts, in a graphical user interface. This interface is also great for visually
    communicating findings to those not intimately involved in data analysis.


    Azure Sentinel supports Jupyter notebooks, which enables analysts to tap into
    the community of data scientists and security analysts using ML and customized
    visuals to identify threats. Azure Sentinel comes preloaded with purpose-built
    Jupyter notebooks with self-contained hunting workflows. Visualizations are included
    in each notebook for faster data exploration.'
