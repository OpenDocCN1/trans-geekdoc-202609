    **图 6-20** 邮件参数


    - 13. 在“收件者”（To）字段中输入目标地址。这是接收警报的邮箱。如果您想向多个邮箱发送警报，请用分号分隔每个地址。


    - 14. 在“主题”（Subject）字段中，输入反映邮件意图的短消息——例如：检测到高严重警报。


    - 15. 在“正文”（Body）字段中输入通用消息，并与“发送警报”（Send an alert）框旁下拉菜单中出现的变量拼接（见图 6-21）。


    ![](img/4b11e95292819ab1a383a41ef73aedb4_150_1.png)


    **图 6-21** 使用固定文本和变量的描述


    - 16. 如果您想为非高优先级警报触发操作，请在 **If** 为假（false）部分重复步骤 10–15。


    - 17. 点击 **Logic Apps 设计器**仪表板左上角的**保存**（Save）。


    - 18. 在 **Logic Apps 设计器**仪表板和剧本属性中点击**关闭**（Close）。


    # 执行剧本


    现在剧本包含了一个工作流，您可以执行该剧本。您可以从两个位置进行操作：**安全警报**（Security Alerts）仪表板或**调查**（Investigation）仪表板。以下步骤演示了从**安全警报**仪表板执行的操作。


    注意：编写本文时，剧本功能处于预览阶段，是一个手动过程。


    - 1. 在安全中心窗口的左侧窗格中，在“威胁防护”（Threat protection）下，点击“安全警报”。


    - 2. 您创建的副本适用于高严重性警报。要满足此条件，请点击高优先级警报。


    - 3. 点击与高优先级警报对应的受攻击资源。将打开受攻击资源的窗格。


    - 4. 点击“运行剧本”（Run Playbooks）按钮。将出现剧本窗格，如图 6-22 所示。


    ![](img/4b11e95292819ab1a383a41ef73aedb4_151_0.png)


    图 6-22 带有之前创建的剧本的剧本窗格


    - 5. 点击运行（Run）。安全剧本开始运行。


    - 6. 要确认剧本运行正常，点击“运行历史”（Run history）标签页，点击刷新（Refresh）按钮并检查结果（见图 6-23）。


    ![](img/4b11e95292819ab1a383a41ef73aedb4_151_1.png)


    图 6-23 运行历史标签页显示了剧本每次执行的历史


    - 7. 检查您设置为剧本生成的邮件目标的邮箱。您应该已经收到一封来自安全中心的邮件，内容基于您在创建工作流时设置的参数。


    当您点击“运行历史”时，您看到的日志仅与针对所选警报的剧本执行有关。我们称之为“警报 A”。如果您在另一个警报（警报 B）上运行相同的剧本，您将不会警报 A
    的历史中看到该操作记录。相反，它将出现在警报 B 的独立历史中。


    # 审计剧本执行


    如所述，您可以通过查看历史记录来检查剧本是否针对特定警报执行过。然而，这不会显示剧本是否针对所有相关警报执行过。对于这一点，您应该审计剧本的执行情况。这样您就可以看到完整的执行日志。按照以下步骤执行此操作：


    - 1. 在安全中心的左侧窗格中，在“自动化与编排”（Automation & Orchestration）下，点击“剧本”（Playbooks）。


    - 2. 点击您想要审计的剧本。剧本属性引用了所有执行的详细信息，包括日期、开始时间和持续时间。您还可以按日期和时间进行过滤（见图 6-24）。


    ![](img/4b11e95292819ab1a383a41ef73aedb4_152_0.png)


    图 6-24 此剧本的完整执行历史


    - 3. 有关特定执行的更多信息，请点击执行行。运行历史窗格将打开并显示 Logic App 仪表板（见图 6-25）。


    ![](img/4b11e95292819ab1a383a41ef73aedb4_152_1.png)


    图 6-25 关于某个特定执行的详细信息


    - 4. 注意，在工作流中，每个框的右上角都会出现一个绿色小勾。这表示该特定步骤执行成功。


    - 5. 如果您没有看到绿色勾，请点击该步骤查看原始数据并进行故障排除。例如，如果您点击**触发 Azure Security Center 警报响应**When
    a response to an Azure Security Center alert is triggered）选项，您将看到 Logic App 接收的原始输入和输出（见图
    6-26）。


    ![](img/4b11e95292819ab1a383a41ef73aedb4_153_0.png)


    图 6-26 原始输入和输出


    - 6. 在 Logic App 和剧本属性中点击**关闭**（Close）。


    > 提示 您可以将剧本与解决方案集成。例如，当发生事件时，将其与 Slack 集成。


    # 使用安全中心保护您的解决方案


    根据 Ericsson 的研究，2016 年连接蜂窝 IoT 设备数量为 4 亿，到 2022 年将达到 15 亿。这为许多安全提供了巨大的机会。然而，根据
    Gemalto 的研究，48% 的公司仍然无法检测设备是否受到入侵。这就是 Security Center 可以提供帮助的地方。


    在本章中，您将学习如何使用安全中心监控 IoT、检测威胁并进行调查。


    注意：有关 Ericsson 研究的更多信息，请访问 https://www.ericsson.com/en/mobility/internet-of-things。有关
    Gemalto 的研究，请访问 https://www.gemalto.com/pages/almost-half-of-companies-still-cannot-detect。


    # 理解 IoT 安全 Center


    Security Center for IoT 是一项托管服务，作为 IoT 应用与云之间通信的枢纽。IoT Hub 支持多种模式，例如设备到云的遥测、文件上传以及从云控制设备的方法。要实现这些，IoT
    Hub 需要标准版（Standard Tier）。


    Security Center for IoT 的意图是让您可以查看 Azure IoT 的安全状态，并提供可操作的建议和实时威胁检测。图 7-1 显示了该架构。


    ![](img/4b11e95292819ab1a383a41ef73aedb4_155_0.png)


    图 7-1 核心组件


    Security Center for IoT 需要在设备上部署代理。该代理作为开源项目开发，并从 GitHub 获取。图 7-1 所示假设代理已安装，且通信工作流遵循以下阶段：


    - 1. 该代理从底层操作系统（Linux 或 Windows）收集原始安全事件，将原始安全事件聚合为消息，并将消息发送到 Security Center（通过
    IoT Hub）。


    - 2. IoT Hub 从多个设备获取这些信息，进行处理并转发到 Security Center 进行分析。这些数据包括设备与云的操作日志、设备标识和 IoT
    Hub 配置。这些信息对于 ASC for IoT 分析流水线是必要的。


    - 3. 使用分析流水线，Security Center for IoT 结合所有信息流生成可操作的建议和警报。


    > 访问 https://github.com/Azure/Azure-IoT-Security-Agent-C 获取 C 语言代理，并访问 https://github.com/Azure/Azure-IoT-Security-Agent-CS
    获取 C# 语言代理。


    '
