    # Configuring JIT


    You can use the Security Center dashboard or PowerShell to configure JIT. However,
    before you start configuring, make sure that you have the proper level of permission
    to configure JIT policy, as shown in Table 5-1.


    TABLE 5-1 JIT policy permissions


    | Scope | path | Permission |

    |---|---|--|

    | Subscription or Resource Group where the VM is located | Microsoft.Security/locations/jitNetworkAccessPolicies
    | Write |

    | Subscription, Resource Group, or VM | Microsoft.Compute/virtualMachines | Write
    |


    Once you get the proper level of permission, follow the steps below to configure
    JIT VM using Security Center dashboard:


    +   1. In the **Recommended** tab, select the VMs you want to configure for JIT
    access.

    2. Click the **Enable JIT On X VMs** button. The **JIT VM access configuration**
    page opens, as shown in Figure 5-4.


    ![](img/4b11e95292819ab1a383a41ef73aedb4_115_0.png)


    FIGURE 5-4 Initial configuration of JIT VM access'
  - '[PAGE 116]


    3. The JIT VM access configuration enables you to specify the ports and protocols
    to which JIT VM access will apply. The default ports and protocols are as follows:


    +   - Port 22 (SSH)

    - Port 3389 (RDP)

    - Port 5985 (Remote PowerShell)

    - Port 5986 (Remote PowerShell)


    4. Do one of the following:


    +   - If these are all the ports you want available for JIT VM access, click the
    Save button to save this configuration as is.

    - If you want to omit any ports and protocols from the list, click the entry you
    want to omit and click Dis.

    - If you want to add a port and protocol, click Add. The following steps assume
    you chose this option.


    5. Clicking Add opens the Add port configuration page (see Figure 5-5.) Here,
    you configure the following settings:


    +   - Port: This is the TCP or UDP port used by the protocol.

    - Protocol: Typically, you''ll choose TCP or UDP, but you can also click Any to
    configure non-UDP/TCP IP protocols. However, it would be unusual to use these
    IP protocols for management purposes-except possibly for GRE, which uses IP protocol
    47.

    - Allowed IPs: You have two options for this setting: Per request or CIDR block.
    If you choose Per request, whatever IP address is currently assigned to the client
    system will be allowed access to the VM. If you choose CIDR block, you can define
    a collection of IP addresses that client systems must have before they can connect
    to the resource.

    - Max request time: This is the maximum amount of time the user can request access
    to the resource. The default value is 3 hours, but you can allow the user to ask
    for more (or less) time.


    ![](img/4b11e95292819ab1a383a41ef73aedb4_116_0.png)


    FIGURE 5-5 Add port configuration'
  - '[PAGE 117]


    6. Click OK and click Save to commit your changes. This VM will now appear in
    the Con- figured tab, as shown in Figure 5-6.


    ![](img/4b11e95292819ab1a383a41ef73aedb4_117_0.png)


    FIGURE 5-6 Application recommendations page


    > NOTE You can also configure JIT VM access policy using PowerShell or Security
    Cen- ter API. To access a sample PowerShell script, visit http://aka.ms/JITVMSample.
    To learn more about the API for JIT, visit http://aka.ms/JITVMAPI.


    When JIT is configured, the deny rule created by JIT will have a priority greater
    or equal to 1,000. The allow rule created by JIT will have a priority greater
    or equal to 100, and less equal to 999. During JIT configuration, rules created
    by the user will change such that the JIT rules will always apply. For example,
    if a rule with priority of 1,000 already exists on an NSG, and JIT is configured
    for a single port, the existing rule’s priority will change to 1,001 and the new
    JIT rule is created with priority 1,000.


    # # Requesting access


    Having configured the JIT VM access policy, it''s time to request access, and
    to request access, you must have the appropriate level of permissions. Use Table
    5-2 to assign minimum permission.


    TABLE 5-2 JIT VM access policy minimum permissions

    | Scope | path | Permission |

    |---|---|--|

    | Subscription or Resource Group where the VM is located | Microsoft.Security/locations/(VMLocation)/
    jitNetworkAccessPolicies/ | Initiate |

    | Subscription, Resource Group, or VM | Microsoft.Compute/virtualMachines | Read
    |'
