    ![](img/4b11e95292819ab1a383a41ef73aedb4_22_0.png)


    图 1-1 网络杀伤链步骤示例


    该链条中的步骤如下：


    - 1. **外部侦察**：在此步骤中，攻击者通常搜索公开数据，以获取尽可能多关于目标的信息。此步骤的目标是获取情报，或称*情报 (intel)*，以便更好地执行攻击并增加成功概率。

    - 2. **受攻陷机器**：在此步骤中，攻击者利用不同技术（如社会工程学）诱导用户执行某些操作。例如，攻击者可能会发送网络钓鱼邮件，诱导用户点击导致机器受损的链接。其目标是在受害者网络中建立立足点。

    - 3. **内部侦察与横向移动**：在此步骤中，攻击者执行主机发现，识别并映射内部网络和系统。攻击者可能开始在主机之间进行横向移动，寻找可以攻破的特权账户。

    - 4. **低权限横向移动**：在此周期中，攻击者继续寻找具有管理权限的账户，以便执行*本地权限提升*攻击。该周期通常会持续，直到攻击者找到一个可以攻破的管理员用户账户。

    - 5. **域管理员凭据**：此时，攻击者需要获得*域主权限*。为了实现这一点，攻击者将在网络中进行枢纽跳转，寻找价值数据，或安装勒索软件或其他任何可用于未来勒索尝试的恶意软件。


    > **重要**：在本书中，理解这些步骤至关重要，你将学习如何使用 Azure Security Center，通过检测不同阶段的攻击来中断杀伤链。


    # 常见威胁


    如所述，攻击类型之一是使用路过式下载网站。这些网站托管了一个或多个针对网络浏览器及浏览器插件漏洞的利用程序。根据《微软安全智能形势报告》第 22 卷，Bing
    在 2017 年 3 月检测到索引中每 1,000 个页面即有 0.17 个路过式下载页面。


    根据同一报告，在 2017 年第一季度，木马是最常见的恶意软件类型（其次是蠕病毒和释放器）。木马总是伪装成实用的应用程序。例如，Win32/Zadupi 木马，也称为
    WinZipper(%ProgramFiles%\WinZipper) 或 QkSee(...)。除了在开始菜单中创建自己的快捷方式（见图 1-2）允许用户压缩和解压缩文件外，该木马还会创建一个服务
    (qkseeService)，连接到命令与控制 (C2 服务器) 并定期使用 HTTP 请求检查指令。通常，这些指令会静默下载新文件，这些文件可能包含将在本地计算机上执行的恶意软件。这只是威胁传播方式的一个例子。


    ![](img/4b11e95292819ab1a383a41ef73aedb4_23_0.png)


    图 1-2 QkSee 的典型安装位置


    如今，用户几乎总是目标，因为他们是最薄弱的一环。随着移动设备、自备设备 (BYOD) 模式和云端应用的普及，用户正在安装越来越多的应用程序。很多时候，这些仅仅是伪装成合法应用的。由于由于原因，许多程序的行为与
    QkSee 类似，因此，拥有良好的端点保护以及一个能够跨不同源、利用分析和机器学习等尖端技术智能识别未知威胁的检测系统至关重要。


    # 构建安全态势


    曾有网络安全专家建议组织只需投入更多资金保护其资产。然而，今天仅仅投资保护资产是不够的。相反，组织应该投资于构建稳固的安全态势。如图 1-3 所示，安全态势由三个支柱组成。


    ![](img/4b11e95292819ab1a383a41ef73aedb4_24_0.png)


    图 1-3 安全态势的三大支柱


    根据 InfoSec Institute 的数据，攻击者在网络中潜伏平均为 200 天而不被发现。（更多信息请参见 http://resources.infosecinstitute.com/the-seven-steps-of-a-successful-cyber-attack）。毫无疑问，让攻击者在你的网络内部停留这么久是非常长的时间。然而，这里的关键词是“检测”。没有良好的检测机制，你就无法中断攻击。因此，投资于全方位解决方案来监控云资源以及本地资产是势在必行的。你必须能够快速检测攻击，并使用可操作的数据来改进你的响应。话虽如此，收集数据而不进行分析只会延迟响应过程。这就是为什么使用利用行为分析、威胁情报和机器学习等技术进行数据关联的工具是如此重要。Azure
    Security Center 可以做到这一点。


    # 假设已攻破


    微软意识到，仅仅防御入侵是不够的。除了传统的防御流程和技术，我们意识到必须做得更多。这种“更多”包含在“假设已攻破”的哲学中。虽然我们希望不会被攻破，但我们知道希望是一种糟糕的策略。因此，我们假设网络即将被攻破——或已经被攻破——然后开发出人员、流程和技术，帮助我们在入侵发生后尽可能早地发现，并驱出攻击者，目标是限制入侵范围。由于攻击者通常通过低价值目标进入系统，如果我们能快速检测到目标受损，就能阻止攻击者从低价值资产向高价值资产扩展。这些高价值资产是攻击者的最终目标。


    我们如何做到这一点？一种有效的方法是使用红队对抗或红蓝对抗。在这些演练中，红队扮演攻击者角色，蓝队扮演防御者角色。我们定义演练的参数。然后，在约定的持续时间内，红队尝试攻击
    Azure 基础设施，蓝队尝试发现红队所做的操作并尝试阻止红队破坏其他系统。


    演练结束后，红蓝双方将讨论发生的情况。具体主题包括：


    - 红队可能进入的方式；

    - 蓝队是如何发现并驱逐红队的；

    - 使发现受损系统更快、更容易的新技术和操作流程。


    # 云威胁与安全


    正如本章开头所示，云武器化正在发生，目前《安全智能形势报告》第 22 卷中的数据显示了这些攻击的全球范围。根据这些报告，2017 年第一季度来自中国 (35.1%)、美国
    (32.5%) 和韩国 (3.1%) IP 地址对 Azure 服务的攻击超过二之二。其余攻击分布在其他 116 个国家和地区。有时，威胁者会将云武器化并向目标系统发送攻击，如图
    1-4 所示。


    '
