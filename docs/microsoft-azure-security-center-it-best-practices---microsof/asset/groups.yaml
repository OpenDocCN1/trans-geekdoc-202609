    # Appendix A


    # Managing Security Center at scale


    BY TIANDER TURPLIN, SENIOR PROGRAM MANAGER, CxE SECURITY


    In this fast-evolving world where threats are equally fast evolving, any security
    solution must be able to support a Continuous Integration/Continuous Deployment
    (CI/CD) pipeline with a management-at-scale vision. Microsoft Azure has three
    important cornerstones to support this: Azure Resource Manager (ARM) templates,
    Azure Policy, and Azure management groups. This appendix covers the main considerations
    regarding managing Security Center in scale.


    # The importance of management at scale


    Limiteless cloud speed and scale allows you to create as many subscriptions in
    Azure as you like. However, this introduces manageability and compliance challenges.
    How can you enforce and achieve compliance across your tenants—and potentially,
    across hundreds of subscriptions—in an efficient and automated way? Key concepts
    to achieve that are management groups, ARM Templates, and Azure Policy.


    # The three templates


    With ARM templates, you declare your deployment in the form of a JSON file, which
    contains the objects you want. It contains the type of resources, names, and properties.
    The JSON file can be checked into a source control solution, supports versioning,
    and enables you to deploy Azure “infrastructure as code.\ The two deployment types,
    incremental and complete, enable you to only deploy what is declared in the template
    (complete) or to add/update additional resources (incremental). The complete deployment
    deletes all the resources that are not specified in the template. Therefore, incremental
    is the default deployment type. An ARM template is idempotent, meaning that either
    a resource will be created if it does not exist, or an existing resource will
    be updated. Idempotency allows you to repeatedly deploy the same template without
    breaking something. Upon deployment of an ARM template, the JSON file is consumed
    by the Azure Resource Manager API that has'
  - '[PAGE 209]


    a contract with its Resource Providers. A Resource Provider (RP) is a trusted
    HTTPS RESTful API endpoint that can provision, delete, and manage services on
    a user''s behalf. Below, you can find an ARM template example for deploying or
    updating a Log Analytics workspace.


    FIGURE A-1 Example of a JSON file with the main sections shown


    The sections highlighted in the template shown in Figure A-1 are explained below:


    +   * Line 3 contains the version of this template to allow source control integration
    for a CI/CD pipeline.

    * Line 4 contains parameters that, like variables, can be used throughout the
    template.'
  - "[PAGE 210]\n\n+   ■ Line 20 shows that you can specify allowed values, which\
    \ limits the user input.\n■ Line 37 specifies the API version for each Resource\
    \ Provider.\n■ Line 38 and 39 show how a parameter is used.\n■ Line 40 specifies\
    \ the Resource Provider type.\n\nAzure Policy provides you with governance controls\
    \ for your Azure environment. It can stop (deny) from creating non-compliant resources,\
    \ and it can audit compliance (audit and auditIfNotExists). It can even remediate\
    \ (deployIfNotExists) non-compliant resources, either upon creation or for existing\
    \ resources. The Azure Policy definition example shown in Figure A-2 stops the\
    \ creation of websites in Azure that are not HTTPS enabled.\n\n```\n```json\n\
    {\n  \"mode\": \"All\",\n  \"policyRule\": {\n    \"if\": {\n      \"allOf\":\
    \ [\n        {\n          \"field\": \"type\",\n          \"equals\": \"Microsoft.Web/sites\"\
    \n        },\n        {\n          \"not\": {\n            \"field\": \"Microsoft.Web/sites/httpsOnly\"\
    ,\n            \"equals\": \"true\"\n          }\n        }\n      ]\n    },\n\
    \    \"then\": {\n      \"effect\": \"deny\",\n      \"details\": {\n        \"\
    type\": \"Microsoft.Web/sites\",\n        \"existenceCondition\": {\n        \
    \  \"field\": \"Microsoft.Web/sites/httpsOnly\",\n          \"equals\": \"true\"\
    \n        }\n      }\n    }\n  },\n  \"parameters\": {}\n}\n```\n```\n\nFIGURE\
    \ A-2 Example of a policy definition where the effect is deny"
  - '[PAGE 211]


    When a collection of Azure Policy definitions is grouped, it is called an initiative.

    Both a definition and an initiative can be assigned to a scope, such as a Subscription
    or a management group, and it then becomes an Azure Policy assignment.


    Azure management groups are the third cornerstone for supporting management at
    scale, and they provide a level of scope above subscriptions. When you organize
    Subscriptions into a management group, you can apply governance conditions in
    a single place. ... You can also build a hierarchy of management groups, with
    a root management group at the top of each directory. Conditions applied to the
    root management group—or to a management group—flow down to lower management groups
    and subscriptions. An example of a management group hierarchy is shown in Figure
    A-3.


    ![](img/4b11e95292819ab1a383a41ef73aedb4_211_0.png)


    FIGURE A-3 Example of a management group hierarchy


    # Security Center and Azure Policy, better together


    When a new Azure subscription is created and the subscription is registered with
    the Microsoft Security Resource Provider (RP), the default behavior is that a
    Security Center policy initiative is provisioned and assigned at the subscription
    level. The exception is that if the subscription resides in a Management Group
    that already has the Security Center initiative assigned, the Security Center
    initiative will not be'
  - '[PAGE 212]


    assigned to any of the subscriptions within that management group. This approach
    has a couple of advantages:


    +   - You define the governance conditions in a single place, either at the Root
    Management Group or at the lower management groups.

    - You can assign deny policies at a high-level that cannot be overridden at a
    lower level.

    - There is a clear view of your compliance state across your management groups
    and subscriptions.


    # Scoping your deployment of ARM templates and Azure Policy


    Every ARM template deployment and Azure Policy assignment is targeted at a scope,
    such as management groups, subscriptions, or resource groups. Because Security
    Center is a subscription-level resource, ARM templates and Azure Policy deployments
    and assignments must be targeted at the subscription level. This is a common misunderstanding
    when configuring and managing Security Center at scale. The example in Figure
    A-4 shows a subscription-level deployment.


    ![](img/4b11e95292819ab1a383a41ef73aedb4_212_0.png)


    Figure A-4 shows the use of the PowerShell command New-AzDeployment, which targets
    a subscription-level deployment. Because Azure Policy definitions and assignments
    can be deployed through ARM templates as well, the same concept applies.'
  - '[PAGE 213]


    > NOTE Support for deploying and assigning an Azure Policy at the (Root) management
    group was announced in May 2019.


    # Best practices for managing Security Center at scale


    Research and define compliance conditions that apply to your organization, group
    them in an Azure Policy initiative, and assign them at the highest level in your
    management group hierarchy. Inheritance ensures that these conditions apply to
    lower-level management groups and subscriptions. Also, you should follow the general
    best practices below:


    +   * Tailor the Security Center default initiative to your needs.

    * Create custom Azure Policy definitions according to your compliance needs.

    * Target exceptions at your lower management groups, such as dev and test environments.

    * Deploy and maintain Azure Policy definitions and initiatives using ARM Templates
    as Infrastructure as Code (IaC).

    * Don''t be tempted to “manually” configure ASC. Instead, you should leverage
    Azure Policy and/or ARM Templates where possible.

    * Ask yourself if you can provision a new tenant or subscription with automation
    only.

    * First, test with auditifNotExists Azure Policies before using deny policies.'
