    Many customers will host their web applications in VMs running on Azure, which
    means they need to ensure the security states of these VMs are well configured.
    This should be not only from the operating system side (which was done under the
    Compute recommendation), but also from the web application level.


    The application recommendations will suggest security recommendations for Internet
    Information Services (IIS) web applications running on Azure VMs. Applications
    recommendations will vary according to the environment. The next section provides
    examples of recommendations that can be remediated directly through the Security
    Center dashboard.


    # Add a web application firewall


    Web applications are increasingly targeted by cyberattacks, such as SQL injection,
    cross-site scripting (XSS), and many other attacks are documented at the OWASP
    Top 10. Many of these attacks are preventable via well-secure code, it is hard
    to prevent some of these attacks in the application code itself because it may
    require rigorous maintenance, patching,'
  - '[PAGE 80]


    and monitoring multiple layers. A web application firewall can enhance the protection
    of your web application from web vulnerabilities and attacks without modifying
    the application code. Follow these steps to address this recommendation:


    +   1. Open Azure Portal and sign in with a user who has Security Admin privileges.


    +   2. In the left navigation pane, click Security Center.


    +   3. In the Security Center left navigation pane, under Resource Security Hygiene,
    click Compute & Apps.


    +   4. In the Overview tab, type Firewall in the search field and click Add a
    web application firewall, as shown in Figure 4-7.


    ![](img/4b11e95292819ab1a383a41ef73aedb4_80_0.png)


