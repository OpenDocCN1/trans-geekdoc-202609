  md: '# # Report Generation Application Using Ref Cursors


    An alternative way to create a report generator is to use PL/SQL ‘Ref Cursors’.
    A Ref Cursor is a special PL/SQL data type that creates a cursor variable at runtime.
    One advantage is the ability of ‘Ref Cursor’ to pass result sets. A second advantage
    is speed because PL/SQL is precompiled and is faster than interpreting an SQL
    statement. A third advantage is security because ‘Ref Cursors’ are protected by
    the Oracle system.


    The first step is to create a PL/SQL ‘Ref Cursor’. Open an ‘Oracle SQL Developer’
    connection. create an ‘SQL Worksheet’, create the ‘Ref Cursor’ procedure tbl_ref
    with the following PL/SQL. Run the script. ‘ Output’ should indicate that the
    procedure was compiled.


    ```

    1 CREATE OR REPLACE PROCEDURE tbl_ref

    2 (p_refcur OUT SYS_REFCURSOR)

    3 IS

    4 BEGIN

    5 OPEN p_refcur FOR SELECT * FROM customers;

    6 END;

    ```


    The parameter ‘p_refcur’ is defined as ‘OUT’ (line 2), which means that its value
    is returned to the calling environment. The type definition is ‘SYS_REFCURSOR’
    (line 2), which means that it will hold a cursor (data set). An ‘OPEN’ is issued
    (line 5), which places the results of the SELECT statement into ‘p_refcur’.


    The second step is to modify the ‘dbGeneral’ class by adding a ‘bind_refcursor()’
    method. Don’t forget to add your information in the ‘setParms()’ method.


    ```

