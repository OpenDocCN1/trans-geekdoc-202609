  md: '# SQL Injection Protection


    SQL injection is a technique often used to attack databases through a website.
    Specifically, it involves creating or altering existing SQL commands to expose
    hidden data, override valuable data or even execute dangerous system-level commands
    on the database host. Your website can actually enable SQL injection by allowing
    spurious user input and unknowingly combining it with static parameters to build
    an unauthorized SQL query. For instance, a culprit can send spurious SQL to your
    website and use his or her knowledge of PHP (in this case your PHP code) to inject.


    SQL injection can be dealt with. First, never trust any kind of input coming into
    your website, especially that which comes from the client (user) side. Use input
    that comes from a ''select'' box, hidden field, or cookie is suspect. Second,
    never connect to the database as a super user, database administrator (DBA), or
    database owner. Third, allow only customized commands with users with limited
    privileges (i.e., the ''web_site'' table I built in this chapter holds only the
    users authorized to access the website). Fourth, check whether the input has the
    expected data type. Fifth, always use bind variables (covered in the next section)
    with SQL statements for security and performance reasons. Sixth, do not print
    out any database-specific information, especially information about your schema.
    A schema is synonymous with an Oracle user account. Seventh, use stored procedures
    and previously defined cursors (discussed later in the chapter) to abstract data
    access so that users do not directly access tables or views.


    # Bind Variables


    Oracle uses the value of a bind variable exclusively and does not interpret the
    contents of the variable in any way, which drastically mitigates SQL injection
    problems. A bind variable is a placeholder variable in an SQL statement that must
    be replaced with a valid value before the statement can successfully execute.


    Binding allows the database to reuse statement content and caches from previous
    executions of the statement, even if another user or process originally executed
    it. Binding also reduces SQL injection concerns because data associated with a
    bind variable is never treated as part of the SQL statement. Bound PHP variables
    can be changed and the SQL statement re-executed without needing to re-parse or
    re-bind the SQL statement.


    To implement SQL injection protection, prepare the SQL statement with the ''OCI_BIND_BY_NAME''
    API. The API serves two purposes. First, it enhances performance because you can
    use the SQL statement with different bind values without changing the database
    (query)'
