    # AJAX


    *Asynchronous JavaScript and XML* (AJAX) allows web pages to be updated asynchronously
    by exchanging small amounts of data with the server without reloading the whole
    page. *Asynchronous* describes communications in data that can be transmitted
    intermittently rather than in a steady stream. For instance, a telephone conversation
    is asynchronous because both parties can talk whenever they like. If it were synchronous,
    each party would have to wait for a specified interval before speaking. AJAX therefore
    allows content on web pages to update immediately when a user performs an action.
    In contrast, with a synchronous HTTP request (i.e., HTML form submission) the
    user must wait for a whole new page to load.


    AJAX uses a combination of ‘XMLHttpRequest’, JavaScript, the document object model
    (DOM), CSS (optional), and XML (optional). The ‘XMLHttpRequest’ object enables
    asynchronous data exchange with a server. The ‘JavaScript/DOM’ allows display
    and interaction of information on a web page. ‘CSS’ allows styling of the page
    for refined web design. This book focuses on'
