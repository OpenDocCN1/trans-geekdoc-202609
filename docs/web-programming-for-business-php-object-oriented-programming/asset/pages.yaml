  md: '# 7 XML Database Transformation and AJAX


    # Overview


    Both XML and relational databases store data, and both have established techniques
    for extracting the data they contain. Relational databases have mature management
    systems that can efficiently and reliably maintain large quantities of structured
    data, so they are better for handling large volumes of data within a multiuser
    system. XML databases have no equivalent XML management system, but they contain
    both the data and the informative relationship structuring of that data that both
    machines and people can read. Relational databases should therefore be considered
    for managing large data stores in a multiuser environment, while XML should be
    considered for data delivered to client programs and between components of a distributed
    system. Creating XML documents from relational database queries and vice versa
    is a natural way to combine the benefits of both technologies.


    # Learning Objectives


    After completing this chapter, you will gain skills in creating XML from a database
    and vice versa, and creating AJAX-driven applications that generate reports from
    XML documents. The following objectives summarize the chapter will help you develop:


    +   - Learn how to create XML from a database table

    - Learn how to create a database table from XML.

    - Learn how to create a sophisticated XML generation application.

    - Learn about AJAX and how it works.

    - Learn how to create an AJAX ‘DOM’ application for XML reports.

    - Learn how to create an AJAX ‘SimpleXML’ application for XML reports.

    - Learn how to create an application to display XML trees.

    - Learn how to incorporate ‘iframes’ into the XML tree application.


    # Extracting XML from a Database Table'
