- pgno: 310
  md: '# Really Simple Syndication and PHP Data Objects


    # Overview


    Two topics are covered in this chapter – Really Simple Syndication (RSS) and PHP
    Data Object (PDO). The topics are grouped together because, although very different,
    they offer advanced capabilities for working with the Oracle database.


    RSS provides an easy way to share and view content on the Internet and is written
    in XML. We are designed to show select data. RSS is often called a news feed or
    RSS feed. People can check at any time to see updates because an RSS feed is linked
    to a database.


    The PDO extension defines a lightweight, consistent interface for accessing databases
    in PHP PDO provides a data-access abstraction layer, which means that the same
    functions are used to issue queries and fetch data regardless of the database
    software.


    # Learning Objectives


    After completing the chapter, you will gain skills in two areas. First, you will
    create an RSS feed Second, you will use the PDO extension to communicate with
    the Oracle database. Skills are enhanced through explanation and code examples.
    The following objectives summarize the skills the chapter will help you develop:


    +   1. Learn the definition and characteristics of RSS.

    2. Learn how to create an RSS feed application.

    3. Learn the definition and characteristics of PDO.

    4. Learn how to display data using PDO.

    5. Learn two ways to prepare a SELECT statement using PDO.

    6. Learn two ways to prepare an INSERT statement using PDO.

    7. Learn two ways to prepare an UPDATE statement using PDO.

    8. Learn two ways to prepare a DELETE statement using PDO.

    9. Learn how to use PDO methods with transactions.'
