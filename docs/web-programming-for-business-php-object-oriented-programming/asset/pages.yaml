  md: 'A transaction comprises a unit of work performed within a database management
    system (DBMS) against a database. First, they provide reliable units of work that
    allow correct recovery from failures and keep a database consistent even in cases
    of system failure. Second, they provide isolation between programs accessing a
    database concurrently.


    A database transaction is one that either completes all of its database operations
    or none of them. A **consistent transaction** is one where results are predictable.
    An **isolated transaction** is one where any changes made are independent and
    visible from other concurrent operations. A ** durable transaction** is one that,
    once committed (saved to the database), will survive permanently.


    # ACID Test


    Databases use two mechanisms to ensure that transactions pass the ACID test –
    rollback and commit **Rollback** is an operation that returns the database to
    a previous state and ends the transaction. **Commit** is an operation that ends
    the transaction and makes all changes visible to other users.


    By using rollback and commit with transactions, the integrity of a database can
    be ensured. If a transaction fails to complete, rollback can be used to restore
    the database to a previous, clean state. If a transaction completes successfully,
    commit can be used to save changes to the database.


    PHP file ‘transaction1.php’ shows how transactions work in PDO. Fill in your specific
    database information before running the code.


    ```

    <?php

    // File transaction1.php

    $user = '''';

    $pass = '''';

    $host = ''localhost'';


    $db = new PDO("oci:dbname=$host",$user,$pass);

    $sql1 = "INSERT INTO web_site VALUES (''006'',''Mark D.'',''Spot'',''2'');";

    $sql2 = "INSERT INTO web_site VALUES (''006'',''Eileen'',''Down'',''2'');";

    $sql3 = "UPDATE web_site SET pswd = ''Dowene'' WHERE vid = ''006'';";

    $db->beginTransaction();

    $Result = $db->exec($sql1);

    $db->rollback();

    $db->beginTransaction();

    $Result = $db->exec($sql2);

    $Result = $db->exec($sql3);

    $db->commit();

    $db = null;

    ?>

    ```'
