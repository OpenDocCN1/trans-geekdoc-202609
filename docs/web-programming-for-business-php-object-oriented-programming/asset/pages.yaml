    # XPath


    XML path language (XPath) is a W3C standard for identifying elements and attributes
    in an XML document. XPath uses relative paths dependent on the current context,
    so if the path is already inside a node you can refer to its child node without
    starting from the root element. XPath can be implemented in PHP on ‘SimpleXML’
    objects to run XPath queries on XML data.


    # XPath Basic Symbols


    A leading forward slash ''/'' indicates the root element and subsequent forward
    slashes indicate the path from parent to child. A single period ‘.’ represents
