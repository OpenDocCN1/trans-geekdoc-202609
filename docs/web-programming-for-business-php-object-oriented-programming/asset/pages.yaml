    # # Type Hinting


    PHP hinting allows you to explicitly type cast a value as objects of a class or
    an array. Type hinting automatically generates an error message if the data type
    of the actual parameter does not match the data type of the formal parameter.
    An actual parameter is the actual value that is passed into a method by the calling
    program (calling environment). A formal parameter is the identifier used in a
    method to stand for the value that is passed into the method by the calling program
    (calling environment). While an actual parameter is the value itself, a formal
    parameter acts like a placeholder. When a method is called, the formal parameter
    is temporarily ''bound'' to the actual parameter.


    With type hinting, methods can force parameters to be objects or arrays. This
    is accomplished by preceding the method''s parameter with the type of data. For
    an object type hint, use the name of the class. For an array type hint, use the
    keyword ''array''.


    The next set of examples illustrates how type hinting is implemented, using PHP
    files ‘type_hint.php’ and ‘call_type_hint.php’. PHP file ‘type_hint.php’ contains
    two classes—‘mine’ and ‘yours’. Class ‘mine’ (lines 3–13) contains two methods.
    The first method ‘test()’ (lines 5–8) includes a type hint for object ‘yours’
    that directly precedes parameter ‘yours’. The second method ‘count_array()’ (lines
    9–12) includes a type hint for an array that directly precedes parameter ‘Input_array’.
    Class ‘yours’ contains a single public property (lines 14–17).


    ```

