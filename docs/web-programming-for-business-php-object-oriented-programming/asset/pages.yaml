- pgno: 12
  md: '# Preface


    # Audience


    I wrote this book for people who want to be web programmers. Web programming is
    not trivial, but it is definitely not astrophysics or neuroscience. In over two
    decades of teaching technologies of various sorts and 18 years of teaching PHP
    (with Oracle), I believe that almost anyone can learn how do it.


    I teach between 10 and 20 students in my PHP class. My students tend to be graduate
    management information systems (MIS) majors, but I always let a few undergraduate
    students attend. Some semesters, I even have a few computer science students in
    my class. My students tend to have some programming experience, but have little
    to none. Nevertheless, students who work hard tend to come out of my class with
    marketable PHP programming skills.


    Admitted, students with at least one or two programming classes under their belt
    (preferably of the object-oriented variety) tend to learn faster. But, I know
    of many students with no programming experience who have thrived in my class.
    The profile of successful students is that they possess a great attitude for learning.
    They want to be in the class and they want to gain a skill that will help them
    succeed.


    # Coverage


    Topics for the book were chosen based on many years teaching web programming,
    consultation with industry experts in the field, reading numerous white papers
    and programming books, and talking to students about course content. Some of my
    former students have working experience, which adds even more credence to their
    suggestions. I invite alumni, programmers, consultants, and managers to speak
    in my class whenever possible. My experience, student comments, and industry comments
    help ensure the timeliness, relevance, and quality of course content.


    # Teachers’ Guide


    The book is intended as a source of simple to advanced tested and working code
    pieces to help students learn PHP web programming in a modular and systematic
    fashion with Oracle 12c'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'database. The emphasis is on precision using practice-feedback loops to enrich
    knowledge and understanding. With practice-feedback loops, an example is presented,
    students load the code in a browser, the expected result is shown, and then feedback
    and explanation of what the code accomplishes is provided.


    The companion website provides all code from the book, accompanying assignments
    for each chapter, and PowerPoint slides for each chapter. The PowerPoint slides
    are what I use to teach the MIS 6650 Advanced Web Development (graduate) class,
    which is in its 18th year of being offered. Students have commented me every semester
    that the slides are an excellent supplement that helps them complete the assignments,
    fare well in exams, and they get ready for the job market. The book offers much
    deeper explanations (the slides) of what the code accomplishes (feedback) as well
    as definitions of terms and symbols.


    Although I recommend that students have attended at least one course related to
    object-oriented programming, I believe that students with a ‘positive’ attitude
    toward learning can gain the programming skills I teach in the book. Acquiring
    programming skills is not magic. It requires a lot of hours sitting in front of
    a computer beyond taking a class or reading a book. I don’t think that there is
    any other way to learn programming skills!


    The book expresses the knowledge I have acquired in 20 years of working with Oracle,
    PHP PL/SQL, AJAX, and SQL. I purposely include as many code modules as possible
    this is how I teach PHP (with Oracle) and many of my students have gone on to
    have successful careers I emphasize practice, practice, and more practice because
    this is how I learned and how my students have learned. Over the years, I have
    received many positive endorsements from students who took this course. They inform
    me that my instruction on PHP web development was instrumental in their careers;
    from getting their first job to advising their MIS careers.


    I reserve the first week of class for creating and testing Linux and Oracle student
    accounts. I have each student login to their Linux and Oracle accounts, and run
    simple PHP scripts. I have an information technology (IT) expert who installs
    and maintains a Linux server and an Oracle 12c instance. My IT expert creates
    all student accounts and maintains the software. Prior to class, I tell students
    to read the chapter we will cover, attempt to run the code, and – when and when
    problems occur – to prepare questions to bring to class. I recommend teaching
    the chapters sequentially from beginning to end.


    # Students’ Guide


    The course is intended for students with some working knowledge of relational
    databases and programming. Once students have working Linux and Oracle accounts,
    they are ready to begin coding. Each chapter in the book provides ‘tested’ PHP
    modules that can load into a web browser (via its URL) to see results. All code
    is available on the companion website so the code need not be'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'However. I suggest that, once the code is working, students should make changes
    to better understand how the language works.


    The best way to transfer PHP code to a Linux account is to use ‘WinSCP’, which
    is free transfer software. I discuss how to install this software in Chapter 1.
    ‘WinSCP’ transfers files be used exactly as typed. If students try to do this
    by copying and pasting, they may encounter serious spacing problems.


    The companion website includes PowerPoint slides, assignments, and PHP code for
    each chapter When I teach, I assume that my students have read all chapters prior
    to lectures and attempted to get all examples to work. When problems are encountered,
    I encourage students to bring questions to the next lecture.


    The first week of class is reserved for creating and testing Linux and Oracle
    accounts. As I said previously, students should login into their Linux and Oracle
    accounts, and test simple PHP scripts to ensure. Once Linux and Oracle accounts
    are working properly, students are set to run up any code provided in the book.


    In my classes, I have a dedicated IT expert who maintains and maintains a Linux
    server instance and an Oracle 12c instance. The IT expert also creates all students
    and maintains the software. If technical problems arise, I try to solve them.
    If I cannot, I have students contact the IT expert.


    I recommend that students follow the chapters sequentially from beginning to end.
    I recommend that students spend a substantial amount of time getting familiar
    with the code. From more than 20 years’ experience of teaching programming classes,
    I can emphasize that programming skill is only obtained through rigorous practice
    (which takes many hours of hard work and many times is not really a lot of fun).
    As one of my colleagues always says, “You have to spend a lot of time in front
    of a computer screen to learn how to program,”


    If students embrace hard work, practice, and dedication to the craft of programming,
    they will likely be a successful programmer. I know sound a bit preachy, but this
    is how I became a proficient programmer. I just don’t know of any other way to
    achieve excellence.


    # Companion Website


    The book has a companion website that includes assignments, code, and PowerPoint
    slides for each chapter. The assignments include definition questions and coding
    questions. The code is included so that students don’t have to retype each code
    snippet to test. The PowerPoint slides provide information and code illustrations,
    but do not delve deeply into explanation. The book provides explanation and feedback.


    # Pedagogy'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'it students on the first day of class to carefully read and digest every word,
    paragraph, and page of the book. My next advice is to tell them to work through
    each code example. That is, load the URI that points to the code in a web browser,
    look at the results, and go back to the code to make sure that each line makes
    sense. Finally, I tell them to make some changes to the code and see if they can
    get it to work with their own customizations.


    The best advice I give a student is to practice, practice, and practice some more.
    The only way, in my opinion, that a student can become a good programmer is to
    sit in front of a computer screen and spend hours coding.


    To enrich learning, I use practice-feedback loops. Practice-feedback loops follow
    a three-step process. First, a concept is introduced. Second, an example is provided.
    Third, feedback is given. Use this pedagogy because this is how I have learned
    many languages and technologies, and this is how many of my students have learned
    how to program and secure excellent jobs.


    # Information Technology


    Going on my 21st year of teaching various technologies and programming languages,
    I have always had an IT expert install and maintain software as well as create
    student accounts. The platform I use includes Oracle 12c database, Linux (Fedora),
    server and PHP 5.3.14. This platform allows students to login to a central server
    to complete their work.


    I keep in touch with several former students and friends, who inform my platform
    decisions. These people currently work in the technology industry. They tell me
    that the platform I use for my class gives students a realistic environment to
    work with PHP. They use the word ''somewhat'' because so many configurations are
    used in industry that makes it difficult to set a single representative IT configuration.
    However, my industry contacts agree that using a centralized Linux server with
    Oracle and PHP (the one I use for my classes) is a minimum for preparing students
    for interviews and the job market.


    # Prerequisites


    Students should possess basic programming knowledge. Some object-oriented programming
    knowledge or experience is even better. Basic knowledge of HTML and SQL is also
    recommended However, the book covers all that a student needs to know. From my
    experience of teaching programming, I notice that people with basic programming
    skills tend to learn faster and be more comfortable with learning technical content.
    However, I have had numerous students in my class with no programming experience
    who have done extremely well!'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# Acknowledgments


    Although I have been teaching PHP with Oracle for many years, a few years ago
    I found a book by David Powers entitled PHP Object-Oriented Solutions This book
    was an inspiration because it helped me become inculcated into the world of object-oriented
    programming. Before acquiring this book and poring over it for many months, I
    had no background in object-oriented programming. Of course, I consulted the Internet
    for a lot of help, but this book helped me adhere to a structure for converting
    my class from procedural to object-oriented programming and acted as a guide to
    build real-world Oracle examples related to the ones Powers built with MySQL.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# Linux, HTML, PHP, and JavaScript Basics


    # Overview


    The 2014 Fall semester marks my 18th year PHP web scripting (programming) with
    Oracle as the back-end database. Over the years, many of my students have commented
    on programming skills developed, ability to secure a good job and discipline to
    help advance careers acquired by successfully completing the course. This book
    is based on what I have learned, how I have learned continuous interactions with
