  md: 'Document-wide tags are those that apply to the whole HTML document. Let''s
    discuss three of them.

    All tags are elements of the `<html>` tag. The first and last tags in a document
    should `always` be the HTML tags. The `<head>` tag conveys header information
    for a document. The `<body>` tag contains document content to be displayed in
    a browser.


    A web page should include `<html>`, `<head>`, and `<body>` tags as a minimum.
    The `<div>` tag defines a division or section within an HTML document. Its purpose
    is to group HTML element together. One use of `<div>` is to format a block of
    HTML elements. Another use is to lay out a web page with CSS. **CSS** is used
    to control the style and layout of multiple web pages all at once. The **comment
    tag** is used to insert comments into the source code. Comments are not displayed
    in the browser.


    # Load File in a Web Browser


    To display content on the Internet, web browsers need to access the file by its
    URL. The appropriate URL consists of the name of the server (host server), followed
    by your Linux user name preceded by the `~` (tilde) symbol, and ending with the
    path to the file preceded by the `/` (forward slash) symbol. The path is pretty
    simple. It is the path to the file inside the `public_html` directory. *Do not*
    include `public_html` in the path.


    | servername/~username/test.php |


    As a *hypothetical* path, the following URL displays `one.htm` located in `book`
    directory (inside `_public_html` directory) within user `paper` on server http://dnet.brigham.usu.edu.


    ```

    <URL>

    http://dnet.brigham.usu.edu/~paper/book/one.htm

    ```


    The following HTML document includes document-wide tags, the `<div>` tag, and
    a comment tag Save the contents in the file and load the URL in a web browser.


    ```

    1 <html>

    2 <head><title>Minimal</title></head>

    3 <body>

    4 <div style="text-align:center;">

    5 <!-- The remaining part is the body. --

    6 Nothing!

    7 </div>

    8 </body>

    ```'
