  md: '# Figure 4.2 Display of Matching Various Strings with Regex


    Figure 4.2 illustrates that each regex (lines 6–8) matched its corresponding string
    (lines 3–5).

    ''Regex1'' (line 6) matches a string that starts with exactly two letters that
    can be upper- or lowercase, continues with exactly one space, followed by exactly
    five lowercase letters, then exactly one space, followed by exactly two lowercase
    letters, a single colon (that the colon was escaped with a backslash), and ends
    with exactly one space. ''Regex2'' (line 7) matches a string that starts with
    a single left parenthesis, continues with exactly three digits between zero and
    nine, by a single right parenthesis, then exactly three digits from zero to nine,
    followed by a dash, and ends with exactly four digits between zero and nine. ''Regex3''
    (line 8) combines regexes from ''Regex1'' and ''Regex2''.

    In pcre2.php, you learned how to validate a US phone number with area code. If
    you want to validate a phone number with an optional area code, the regex must
    be modified.

    pcre3.php validates a phone number with or without an area code. I leave out validation
    of text to concentrate on number validation with optional area code.


    ```

    <?php

    // File pcre3.php

    $string1 = ''(801)787-1234'';

