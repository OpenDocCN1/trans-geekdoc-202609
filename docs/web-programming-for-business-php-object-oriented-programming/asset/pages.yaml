- pgno: 1
  md: '# Web Programming for Business


    Web Programming for Business: PHP Object-Oriented Programming with Oracle focuses
    on fundamental PHP coding, giving students practical, enduring skills to solve
    data and technical problems in business.

    Using Oracle as the back-end database, the book is version-neutral, teaching students
    code that will work even with changes to PHP and Oracle. The code is clean, clearly
    explained, and solution-oriented, allowing students to understand how technologies
    such as XML, RSS, and AJAX can be leveraged in business applications. The book
    is fully illustrated with examples, and includes chapters on:


    +   - database functionality;

    - security programming;

    - transformation programming to move data.


    PowerPoint slides, applied exam questions, and the raw code for all examples are
    available on a companion website. This book offers an innovative approach that
    allows anyone with basic SQL and HTML skills to learn PHP object-oriented programming.


    David Paper is a professor of management information systems at Jon M. Huntsman
    School of Business, Utah State University, USA. With experience at major companies
    including Texas: Instruments and IBM, David teaches both undergraduate and graduate
    students of computer science and business.


    A range of further resources for this book are available on the Companion Website
    at www.routledge.com/cw/paper


    ![](img/9532a68e5a5ba9dbe45a4909787d2f1d_1_0.png)'
