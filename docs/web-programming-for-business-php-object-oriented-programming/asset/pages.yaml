  md: '# Modify an XML Document


    ‘SimpleXML’ objects can be modified in three ways. First, values of text and attributes
    can be changed. Second, attribute or element nodes can be removed. Third, new
    nodes and attributes can be added.


    PHP ‘change.php’ reduces the price of each stereo system by 10 percent and displays
    results to the browser. Nothing saved.


    ```

    1 <?php

    2 // File change.php

    3 $xml = simplexml_load_file(''xml_docs/stereo.xml'');

    4 foreach ($xml as $stereo) {

    5 {

    6 $reduced = substr($stereo->price, 1);

    7 $reduced = str_replace(",",","","",$reduced);

    8 $reduced = $reduced * .9;

    9 $stereo->price = ''$'' . number_format($reduced,2);

    10 }

    11 header(''Content-Type: text/xml'');

    12 echo $xml->asXML();

    13 ?>

    ```


    Since ‘price’ is a string, it must first be converted to a number. So, I remove
    the dollar sign from each ‘price’ element value with ‘substr()’ (line 6). Next,
    I remove the comma with ‘str_replace()’ (line 7). I reduce ‘price’ by ‘10%’ (line
    8). I convert ‘price’ back into a string (line 9) by concatenating a dollar sign
    to the properly formatted number (decimals and a comma between grouped thousands)
    via the ‘number_format()’ function. Finally, I display results to a browser (lines
    11 and 12). Nothing is saved.


    The XML document is not actually changed because it is not saved. Figure 5.23
    shows a partial display of the results (price of ‘Joyous Sound’ is reduced to
    $18,000).'
