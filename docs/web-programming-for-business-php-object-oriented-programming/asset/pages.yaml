  md: 'PHP automatically handles garbage collection, which is removal of variables
    and objects that are no longer needed the PHP. However, you can manually delete
    a resource using magic method `__destruct()`. Like other magic methods, PHP automatically
    runs `__destruct()`. Unlike others, `__destruct()` is automatically run immediately
    before the PHP engine removes a defined object from memory. After the destructor
    is run, the object is released from memory.

    An example illustrates how a destructor works. The example uses PHP files ''destruct.php''
    and ''call_destruct.php''.


    ```

    1 <?php

