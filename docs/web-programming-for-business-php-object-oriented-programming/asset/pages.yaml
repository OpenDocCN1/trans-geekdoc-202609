    issues in this case are minor, as more data is added, readability becomes more
    problematic. Although ‘stereo_dom.xml’ is readable, it is not well-formed because
    it does not have a root element that contains the XML data (review the ‘XML Rules’
    section earlier in the chapter for details).


    # Well-Formed XML


    PHP file ‘well_formed.php’ creates a new XML document with a root element container
    populated with stereo systems two and four from ‘stereo.xml’. Since I added a
    root element container, the document is now well-formed! Load ‘well_formed.php’
    in a browser [Figure 5.20] shows the results.


