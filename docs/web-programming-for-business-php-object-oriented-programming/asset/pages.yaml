  md: "# Encryption\n\nEncryption is the conversion of data into a form that cannot\
    \ be easily understood (deciphered) by unauthorized users. To encrypt passwords,\
    \ I use ‘SHA1’, which is a cryptographic hash algorithm developed by the National\
    \ Security Agency (NSA). This algorithm is the successor to the earlier MD5 algorithm.\
    \ I add a double-salt algorithm for enhanced security. A salt is a random string\
    \ of data used to modify a password hash. A hash is the digital footprint of a\
    \ piece of data. The next example illustrates how to encrypt passwords.\n\nThe\
    \ example uses two PHP files – ‘salt.php’ and ‘encrypt.php’. PHP file ‘salt.php’\
    \ contains a ‘salt’ class (lines 3–16) that uses two salts to modify the password\
    \ hash. The password hash is created with the ‘SHA1’ algorithm.\n\n```\n1 <?php\n\
    2 // File salt.php\n3 class salt\n4 {\n5 function doubleSalt($ToHash,$Spassword)\n\
    6 {\n7 if(strlen($Password) < 40)\n8 {\n9 $arr_pass = str_split($ToHash,\n10 (strlen($ToHash)/2)+1);\n\
    11 $hash = hash('sha1', $password.$arr_pass[0]);\n12 'centerSalt'.$arr_pass[1]);\n\
    13 return $hash;\n14 }\n15 \n16 }\n17 ?>\n```\n\nClass ‘salt’ includes the ‘doubleSalt()’\
    \ method (lines 5–15), which takes a salt string and password hash as parameters\
    \ (line 5). The double salt is accomplished by rearranging the salt and feeding\
    \ the ‘SHA1’ algorithm the password hash and different pieces of the revised salt\
    \ as a single concated string.\n\nSpecifically, using ‘str_split()’ (lines 9 and\
    \ 10) converts the salt into an array ‘arr_pass’ with the number of elements determined\
    \ by the length of salt divided by two, plus one (the first salt). For instance,\
    \ a salt of six characters is converted to an array of index 4 ((6/2)+1). Remember,\
    \ PHP arrays start at index zero, so an array with index four contains five elements.\
    \ Function ‘hash’ (lines 11 and 12) uses ‘SHA1’ to encrypt a string composed of\
    \ the password hash, the first element of ‘arr_pass’, the string ‘centerSalt’,\
    \ and the second element of ‘arr_pass’ concatenated together (the salt)."
