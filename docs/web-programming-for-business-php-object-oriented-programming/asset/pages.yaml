  md: 'attributes converted into single attributes of the ‘SimpleXMLElement’ object
    (or ‘SimpleXML’). When there is more than one element on one level, they are placed
    inside an array. Attributes are accessed using associative arrays, where an index
    corresponds to the attribute name. Text data from elements are converted into
    strings. If an element has more than one text node, they are arranged in the order
    they are found.


    The ‘SimpleXML’ extension is fast and easy when performing basic tasks, such as
    reading XML, extracting data from XML strings, and editing text nodes or attributes.
    However, when dealing with advanced XML, like namespaces, it is better to use
    XML DOM (a standard way of accessing and manipulating XML documents).


    # Create an Instance of the ‘SimpleXMLElement’ Class


    The easiest way to create an instance of the ‘SimpleXMLElement’ class is to load
    the XML document from a file with ‘simplexml_load_file()’. If you need to work
    with an advanced object, use ‘simplexml_import_dom()’ to return an instance of
    ‘SimpleXML’ from a DOM object.


    ```

    <?php

    // File load_simplexml.php

    $file=''cars.xml'';

    $xml = simplexml_load_file($file);

    foreach($xml->identity as $id) {

    echo $id[''sno''].''.&nbsp; $id->make.$id->model;

    echo ''<br/>'';

    } ?>

    ```


    The ‘simplexml_load_file()’ construct creates an instance of the ‘SimpleXMLElement’
    class based on ‘cars.xml’ and places it in the ‘$xml’ variable (line 4). The ‘foreach()''
    construct (lines 5–10) iterates over the newly created object. Also, the ‘sno’
    attribute (which uniquely identifies each car), make, and model are displayed
    for each ‘<identity>’ element (lines 7–9).


    Load PHP file ‘load_simplexml.php’ in a web browser. Figure 5.1 displays the results.


