  md: '# JavaScript Statements


    In HTML, JavaScript statements are ‘commands’ to the web browser. That is, they
    tell the browser to do. The following example takes a number as user input and
    returns the number squared from the browser.


    The ‘square.js’ file contains two functions. The ''square()'' function assigns
    the value of the input field with id="in" in the HTML document to ''x'' (line
    5). It then squares the value of ''x'' (line 6) and places the result in the HTML
    document paragraph tag <p> with id="out" (line 7). The ‘clr()'' function clears
    an empty string in the HTML document where id="out" (the paragraph tag), which
    clears the result from the browser (lines 11 and 12).


    ```

    1 // square.js

    2 function square()

    3 {

    4 var x;

    5 x = document.getElementById("in").value;

    6 x = x * x;

    7 document.getElementById("out").innerHTML = x;

    8 }

    9 function clr()

