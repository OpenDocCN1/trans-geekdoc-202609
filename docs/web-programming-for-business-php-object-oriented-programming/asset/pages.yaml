    # The Iterator Interface with a Database


    Using the iterator with a database is more complicated because a database connection
    (to Oracle in our case) has to be established before there can be any processing.
    Once a connection is established, SQL and connection information can be sent to
    the Iterator interface.


    I use two classes to demonstrate the Iterator interface with Oracle – ‘dbAggregation’
    and ‘dbIterator’. I use the ‘dbAggregation’ class to connect to the Oracle database
    and send connection information and the SQL statement to ‘dbIterator’. I use the
    ‘dbIterator’ class to implement the Iterator interface. This class parses and
    executes the SQL statement, and includes the Iterator interface methods (customized
    to work with Oracle) that enable iteration with a ‘foreach’ loop.'
