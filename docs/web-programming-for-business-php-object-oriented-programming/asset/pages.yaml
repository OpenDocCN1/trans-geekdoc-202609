    # XML Tree Application


    The previous two applications extracted data from XML documents using the ‘DOMDocument’
    and ‘SimpleMLElement’ classes, respectively. The intention of the application
    I am about to build is to display the schema (tree) of an XML document. **XML
    tree** is the structure of an XML document. XML documents form a tree structure
    that starts at the root and extends through branches to the leaves. The XML documents
    I use are ‘customer.xml’ and ‘catalog.xml’. Both documents are available in the
    companion website.


    # Application Scripts for XML Tree


