    [Figure 3.28](# Graphical Representation of the AJAX Process (http://www.w3schools.com/ajax/ajax_intro.asp)


    AJAX works with a JavaScript file that creates an ‘XMLHttpRequest’ object and
    sends it to the server. The user can load this file through a JavaScript event
    handler (i.e., by clicking a button). Once the file is loaded, the web browser
    sends the request to the server. The server processes the ‘XMLHttpRequest’, creates
    a response, and sends data back to the browser. The browser processes the returned
    data using JavaScript(in the JavaScript file), and updates web page content.


    To implement JavaScript event handler ‘onclick()'' in ‘onward.php’, a JavaScript
    file that implements AJAX is required. I created JavaScript file ‘destroy.js’
    for this purpose. Be careful to use file extension ‘js’ to inform the PHP engine
