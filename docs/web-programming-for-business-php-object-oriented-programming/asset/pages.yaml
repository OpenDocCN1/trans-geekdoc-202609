    \ changed file permissions earlier in the chapter to ensure that files can be\
    \ saved. It doesn’t hurt, however, to check file permissions again. If the file\
    \ permissions will not allow you to save, use the `chmod` Linux command as follows:\n\
    \n```\nchmod 777 xml_docs\n```\n\nPHP file ‘save_xml.php’ saves a copy of the\
    \ XML document into file ‘stereo_copy.xml’. Figure 5.15 shows the results. Just\
    \ to be sure, check the contents of ‘stereo_copy.xml’ in the ‘xml_docs’ directory.\n\
    \n```\n<?php\n// File save_xml.php\n$Xml = simplexml_load_file('xml_docs/stereo.xml');\n\
