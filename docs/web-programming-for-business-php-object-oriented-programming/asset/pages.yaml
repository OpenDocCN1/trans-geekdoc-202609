- pgno: 31
  md: '# HTML Basics


    This section introduces the HyperText Markup Language (HTML) used in this book.
    More comprehensive introduction can be found at https://www.w3schools.com, which
    also includes tutorials for CSS, SQL, XML and other languages that might prove
    useful for students with little or no experience of web programming. Since this
    book teaches programming, not design, HTML5 and CSS3 are covered. To program with
    PHP at a very high level, only basic HTML and CSS are required HTML5 and CSS3
    are essential for those with interest in web design.


    # Markup


    Markup is additional text inserted into an HTML document. Inserted text has three
    characteristics First, it is not usually visible to the reader. Second, it is
    not part of the document’s content. Third, it enhances the document in some manner.

    An HTML document is a file containing small markup tags. The file extension for
    an HTML document must be ‘htm’ or ‘html’, unless the markup is contained within
    a scripting language such as PHP. Markup text inserted into an HTML document has
    meaning to the HTML interpreter.


    # HTML Tags


    HTML tags mark up the structure of a document and embed basic information that
    the web browser how to display content. HTML tags are always enclosed in angle
    brackets and are not case sensitive. (Linux commands are case sensitive.) HTML
    tags divide a web page into its basic sections as header and body. HTML tags generally
    have a beginning and matching end tag. This matching strategy contains all document
    content within a set of tag pairs. As such, content within a container follows
    the rules of container. The advantage is that containerization forces tags to
    be balanced and clearly delineates the rules applied to any given content within
    the HTML document.\Nesting tags is legal, but containers should always be nested
    within each other appropriately. White space in the document does not matter to
    the HTML interpreter. I do, however, recommend you use whitespace to make the
    document look as clean as possible to the naked eye. Not every tag in HTML is
    paired (containerized). Some tags don’t require a closing tag. The break tag <br
    /> is not such example.'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'HTML uses two types of markup – tags and character entities. A character entity
    is a reference to a particular kind of character that has been predefined or explicitly
    declared in a document type definition. A document type definition (DTD) is a
    set of markup declarations that define a document type for HTML. The purpose of
    a character entity is to provide a way to refer to a universal character in a
    limited character encoding (e.g., ASCII). Character entities include international
    characters as well as characters usually included in tags as markup. A character
    entity begins with an ampersand, followed by the entity name, and ends with a
    semicolon. The character entity for &amp follows:


    ```

    &amp;

    ```


    A useful character entity is the one for a nonbreaking space.


    ```

    &nbsp;

    ```


    Three character entity references that deserve special attention are ‘<’ (less
    than), ‘>’ (greater than), and “” (double quote). To replace, ‘<’ with &lt;, ‘>’
    with &gt;, and “” with &quot; when necessary. The availability of these three
    references is important because HTML uses ‘<’ and ‘>’ to enclose HTML tags, and
    “” to enclose strings. PHP also uses “” to enclose strings. You can therefore
    use a character entity reference instead of the actual character to mitigate confusion
