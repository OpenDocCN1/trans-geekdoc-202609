  md: '# Object-Oriented Concepts and Fundamentals


    # Overview


    Object-oriented programming (OOP) is a design philosophy that uses objects methods
    rather than linear concepts of procedures and tasks (procedural programming) to
    accomplish programmatic goals. An object is a self-sustainable construct that
    enables reusability of code. A method specifies one operation without providing
    any details to describe how the operation should be carried out. This chapter
    covers OOP fundamentals, including classes, properties, methods, and objects.
    In addition, encapsulation, polymorphism, inheritance, abstract classes, interfaces,
    aggregation, and supplemental OOP concepts are covered.


    # Learning Objectives


    After you complete this chapter, you will gain a fundamental understanding of
    OOP concepts through explanation and code examples. The following objectives summarize
    the skills the chapter will help you develop:


    +   - Learn the main advantages of OOP.

    - Learn the building blocks of OOP.

    - Learn how to create and instantiate a class.

    - Learn OOP fundamentals.

    - Learn about getters and setters.

    - Learn about the constructor, destructor, and ‘toString’ methods.

    - Learn about constants and static methods and properties.

    - Learn about type hinting.

    - Learn about exception handling.

    - Learn about debugging.


    # Advantages of OOP'
