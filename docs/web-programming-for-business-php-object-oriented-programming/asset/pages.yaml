    \ I will talk about constructors later in the chapter.\n\n# This\n\nThe *this*\
    \ pseudo-variable is built into all objects and points to the current object.\
    \ It allows access to properties and methods within the object instance. PHP automatically\
    \ sets *this* to point to the object you are currently working on. Let's look\
    \ at an example to help you understand how *this* works. PHP file *use_this.php*\
    \ contains class *use_this* (lines 3–15) that encapsulates private property *$_array*\
    \ (line 5), public method *sum()* (lines 6–10), and public method **avg()* (lines\
    \ 11–14). The purpose of *$_array* is to hold the array passed into the class.\
    \ It is convention (and recommended) to use *$this->* before the variable name\
    \ using ‘protected’ or ‘private’ properties. The purpose of method *sum()* is\
    \ to return the sum of array elements (passed to the class). The purpose of method\
    \ **avg()* is to return the average of array elements.\n\n```\n<php\n// File use_this.php\n\
    class use_this {\n    private $_array;\n    public function sum($array) {\n  \
    \      $this->array = $array;\n        return array_sum($array);\n    }\n\n  \
    \  public function avg() {\n        return $this->sum($this->_array)/count($this->_array);\n\
    \    }\n}\n?>\n```\n\nFrom top to bottom, method ‘sum()' assigns the array passed\
    \ into the class to the ‘$this->_array’ property (line 8) and returns the sum\
    \ of array elements. Once assigned, ‘$this->_array’ can be used"
