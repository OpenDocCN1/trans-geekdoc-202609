    # # OOP Concepts Revisited


    In this chapter, OOP advantages, fundamentals, and supplements with applicable
    code examples were introduced to reinforce and deepen knowledge. To further deepen
    understanding of OOP, a discussion of three important concepts – encapsulation,
    visibility, and extensibility – ends the chapter.


    The idea of encapsulation is to create self-contained classes. As such, encapsulation
    facilitates modularity, reusability, information-hiding, and debugging. Independent
    classes promote modularity. Modular classes are easy to access from the outside
    world and to use in different contexts; this promotes reusage. Self-contained
    classes allow you to easily hide the details of the class from the outside world,
    thus promoting information-hiding. Finally, modular classes promote debugging
    because the code is simple and changing the code does not impact other classes.


    If you create methods encapsulated in a class that are mutually exclusive as possible,
    this further enhances modularity, reusability, information-hiding, and debugging
    ease. For instance, if you add a new method that is mutually exclusive from the
    existing methods, existing methods will work as before. So, even if the new method
    does not work properly, the other methods still work. Therefore, encapsulation
    not only facilitates modularity, reusability, information-hiding, and debugging
    ease, but also stabilizes a class by allowing addition or modification of methods
    without impacting the usability of the class.


    Since methods often serve as the interface to the functionality of a class, they
    usually need to be ‘public’. Properties, however, should always be hidden away
    as ‘protected’ or ‘private’, to prevent them from being accidentally changed.
    If you ever intend to extend a class, you should use ‘protected’ visibility. Use
    ‘private’ visibility only if you do not want a method or property to be accessed
    outside the class. When you need to expose or change the value of a property,
    the normal way to do so is through a getter (expose) or setter (change) method.


    **Extensibility** refers to the ability to extend a class through inheritance.
    To use inheritance, note that we always use the keyword ‘extends’. Extensibility
    is therefore the ability to implement'
