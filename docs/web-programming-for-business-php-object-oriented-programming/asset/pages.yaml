    elements (line 3). I then place the array into an iterator object with ‘ArrayIterator’
    and assign it to ‘$iterator’ (line 4). I wrap ‘$iterator’ in a ‘LimitIterator’
    object and assign it to ‘$limiter’ (line 5), which holds the first two elements
    of the original array. I use ‘foreach’ (lines 6 and 7) to iterate the object in
    ‘$limiter’ and display the elements in a browser, as shown in Figure 6.1.'
