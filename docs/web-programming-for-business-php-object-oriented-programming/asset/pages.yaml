- pgno: 25
  md: '# Octal (Base Eight) Permissions


    Linux permissions are based on octal numbering (or base eight). When you changed
    permissions to ‘705’, each number was base eight. The reason Linux uses base eight
    is because it easily into binary, but represents more bits in less space than
    binary. Base eight number ‘7’ translates into binary ‘111’. A binary ‘1’ means
    on. A binary ‘0’ means off. Since all binary numbers are ‘1’, read, write, and
    execute are. The leftmost ‘1’ corresponds to ‘r’, the next bit ‘1’ corresponds
    to ‘w’, and the rightmost ‘1’ corresponds to ‘x’. Base eight number ‘0’ translates
    into binary ‘000’, which means all permissions are off. Finally, base eight ‘5’
    translates into binary ‘101’. Since the leftmost represents ‘read’ and is on,
    the Internet can read. The rightmost represents ‘execute’ and is on, which means
    the Internet can execute. The middle bit represents ‘write’ and is, which means
    the Internet cannot write. Notice that ‘r’, ‘w’, and ‘x’ are positional, which
    makes Linux permissions relatively easy to understand. Table 1.1 is provided to
    facilitate easy conversion from base eight to binary (and vice versa). Conversion
    is necessary because chmod accepts base eight numbers, while Linux permissions
    are represented by numbers.


    Two caveats are in order. Be sure that all content (files and directories) that
    you wish to be displayed in a browser are located within the ‘public_html’ directory.
    Second, do not allow the Internet ‘write’ permissions. In most cases, you do not
    want the world to be able to ‘write’ to your directory or file. To close a remote
    connection to Linux, enter the ‘exit’ command (type ‘exit’ on the command line
    and press ‘Enter’).


    # Display Content


    With a bit of Linux knowledge, you can create a PHP script that can display content
    on the Internet Open a web browser of your choice. I use ‘Google Chrome’, so the
    examples will be from this browser. Use ‘PuTTY’ to open an SSH session and change
    to the ‘public_html’ directory Next, use ‘vi’ to open a new file. Be sure to enter
    each command on a separate command line.


    ```

    cd public_html

    vi test.php

    ```


    To enter command mode, press the escape key ‘Esc’. To enter commands, press the
    colon ‘:''. You should see a colon '':'' bottom left of the screen. Command mode
    is the command environment'
