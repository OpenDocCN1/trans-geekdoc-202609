  img_proc: true
- pgno: 63
  md: 'Object-oriented programming OOP has four main advantages over procedural programming
    - modularity, code reuseability, information-hiding, and debugging ease. Modularity
    is when a piece of code is independent of other pieces of code. Reusability is
    when code can be used, without modification, to perform a specific service regardless
    of what application uses it. OOP facilitates code reuseability by making it easy
    to break down complex tasks into generic modules (classes) and separate files
    that contain classes from the main PHP script. Information-hiding is when the
    details of the internal implementation of a module (class) remain hidden from
    the outside world. Debugging ease means when a problem occurs, it is much easier
    to fix the module (class) is independent from other pieces of code. Independent
    modules (classes) facilitate easier maintenance because the code is modular by
    nature. So, modifying one piece of code doesn''t impact other pieces of code in
    the application. Reliability is also enhanced because the natural modularity of
    OOP helps ensure consistency of the code. Once a module (class) has been tested,
    it can be thought of as a ‘black box’ and relied upon to produce consistent results.
    Such consistency means that you only have to fix a coding problem in one place.


    # Class


    The fundamental building block of OOP is a class. A class is a collection of related
    properties and methods wrapped in a pair of curly braces and labeled with its
    name. A property is what we normally think of procedural programming as a variable.
    A method is what we normally think of as a function in procedural programming.
    Properties and methods, however, are much more flexible than their procedural
    counterparts.


    # Object


    An object is a data structure consisting of data fields and methods together with
    their interactions. To use the properties and methods of a class, an object (an
    instance of a class) must be created. Creation of an object from a class is generally
    referred to as instantiation (or creating an instance) of a class.


    # Encapsulation


    Encapsulation is an OOP fundamental that ensures that each part (class) of an
    application is self-contained and doesn''t interfere with any others, except in
    a clearly defined manner. This means that encapsulation prevents the values of
    important properties from being changed except by following the rules laid out
    by the class.'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'Encapsulation allows you to prevent unauthorized access to a class by hiding
    its properties and methods. To implement, a property or method can be defined
    as public, private, or protected.


    Public allows access from both inside and outside the class. Protected can only
    be accessed from within an object''s method. Private is even more restrictive,
    like protected, it can only be accessed from a derived object''s method. That
    is, private properties or methods cannot be used with inheritance. We will talk
    about inheritance shortly, so don''t worry about this distinction because it will
    be explained with examples later in the chapter.


    # Inheritance


    Inheritance is a way to reuse the code of existing objects. So, that is, an object
    is able to inherit characteristics from another object. So, once a class has been
    developed, you don''t have to reinvent the wheel. You can create a new (child)
    class that inherits either or all of the characteristics of the parent class without
    having to rewrite the code already tested in the parent. Inheritance is therefore
    most useful when the parent''s properties and methods can be reused in different
    contexts.


    # Polymorphism


    Polymorphism is the ability to create a property or method of an object that has
    more than one form. While inheritance allows you to pass the characteristics of
    a parent class to a child class, polymorphism allows you to override existing
    properties and methods. That is, you can use the same property or method names,
    but modify them to suit your needs.


    # OOP vs. Procedural Programming


    When properly applied, polymorphism, encapsulation, and inheritance combine to
    produce a programming environment that supports the development of far more robust
    and scalable programs than procedural programming. I have already mentioned that
    OOP better facilitates modularity, code reusability, information-hiding, and debugging
    ease. Before we can start OOP, you need to understand the ''new'' keyword and
    ''this'' identifier.'
