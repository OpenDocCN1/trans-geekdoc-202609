    # HTML Forms


    **HTML forms** are used to select different kinds of user input. A form requests
    input from a user. The input contains normal content and controls. Controls allow
    users to interact with forms. The input tag `<input>` specifies simple input inside
    a form. The `<form>` tag specifies a fill-out form. You can use attributes of
    both tags (`<form>` and `<input>`) to customize the displayed form.


    Multiple forms can exist within a single document, but cannot be nested. Forms
    use two attributes ‘action’ and ‘method’. ‘Action’ specifies the URL to which
    the form’s contents will be submitted. If this attribute is absent, the web browser
    will use the current URL. ‘Method’ is the means by which form data are sent between
    web pages.


    Two types of methods can be used – ‘get’ and ‘post’ – to pass data between web
    pages. Both methods are discussed next.


    # Get and Post


    The default is ‘get’. The ‘get’ method causes the fill-out form contents to be
    appended to the URL as they were a normal query. This makes the ‘get’ less secure
    because users can see the data appended to the URL. The ‘post’ method causes the
    fill-out form contents to be sent to the server in a body rather than as part
    of the URL, which makes it more secure than ‘get’'
