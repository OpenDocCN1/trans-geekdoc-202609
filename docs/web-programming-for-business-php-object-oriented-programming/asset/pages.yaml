    \ I create an instance of DOM and place it in ‘$dom’ (line 4). Second, I load\
    \ ‘cars.xml’ into the DOM object (line 5). Third, I create a ‘SimpleXML’ object\
    \ from the DOM object (line 6). The ‘foreach()’ construct (lines 7–12) iterates\
    \ through the XML document and displays the results.\nLoad PHP file ‘load_dom.php’\
    \ in a browser. Figure 5.2 displays the results.\n\n![](img/9532a68e5a5ba9dbe45a4909787d2f1d_204_0.png)\n\
    \n# Foreach\n\nThe ‘foreach()’ construct provides an easy way to iterate over\
    \ arrays and objects. For objects, the syntax is ‘foreach (list as object in list)’.\
    \ When working with XML, the *list* holds the contents of the XML document, and\
    \ the *object in list* is the current element in the XML document.\nWhen ‘foreach()’\
    \ commences, the internal object pointer automatically resets to the first object\
    \ in the list. With each loop, the value of the current object from ‘list’ is\
    \ assigned to ‘object in list’ and the internal object pointer is advanced by\
    \ one. Be careful to use ‘object in list’ within the loop rather than ‘list’.\
    \ Using ‘list’ inside the loop causes a *fatal* error."
