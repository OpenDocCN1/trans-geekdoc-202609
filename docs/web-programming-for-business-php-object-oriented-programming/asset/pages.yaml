    # Aggregation


    Aggregation is a technique that allows one object to act as a container for one
    or more other objects. Aggregation can be thought of as a relationship between
    two classes that is best described as a ''has-a'' and ''whole-part'' relationship.
    The container class is the ''has-a'' part, while the contained class is the ''whole-part''
    relationship of the relationship.


    Aggregation can be used as an alternative to inheritance. An advantage of inheritance
    is that it is easier to create cleanly separated classes that are responsible
    for one task and nothing else. With inheritance, classes are more dependent on
    one another, giving the natural ''parent-child'' relationship that is always created.
    With aggregation, the container class does not pass on its characteristics to
    the contained class. A disadvantage of aggregation is that you must add large
    numbers of methods to the interface of the contained class or otherwise expose
    its instance to the word (which adds complexity to coding). This is because, unlike
    inheritance, the contained class cannot use properties or methods from the container
    class. Disadvantages of inheritance include possible bloated class trees that
    are difficult to change and maintain over time and tight coupling between parent
    and child, which increases dependencies.'
