  md: 'Extensible markup language (XML) is a standard for describing how information
    is structured. Specifically, XML is a text-based markup language that is the standard
    for data interchange on the web. It provides a foundation for creating documents
    that can be used on a wide variety of platforms and for storing data in a simple,
    common format in plain text.


    The ubiquitous capacity and common format of XML allow computers to share information
    even if they have completely different system components, configurations, and
    operating systems. XML allows people to create their own customized markup applications
    for exchanging information.


    # XML Tags


    XML uses tags in the same way as HTML. Unlike HTML, XML does not have a fixed
    range of tags and attributes. Within certain rules, you can name tags and attributes
    whatever you want unless you are working on a large collaborative project that
    needs to use a standardized vocabulary. The big difference is that an HTML tag
    tells you how a page is organized, while an XML document contains no information
    about the layout or structure of a page.


    XML tags cannot include any whitespace or punctuation other than the hyphen ''-'',
    ''_'' or period ''.''. Tags cannot begin with ''xml'' in any combination of uppercase
    or lowercase letters.


    # XML Data


    XML stores data in a hierarchical (tree) structure according to meaning and without
    any reference to web page presentation. That is, XML provides an elegant way to
    separate data from format. An XML document may not even represent a page or even
    exist as a physical file on the server.


    An XML document can be generated dynamically by a database in response to an incoming
    request. The server analyzes the request, queries the database to get the most
    current information, and sends the result to the recipient formatted as XML.


    # Five Basic Reasons to Use XML


    XML is almost ubiquitous in terms of information sharing between computer systems.
    The five basic reasons for this ubiquity include simplicity, organization, accessibility,
    standardization, and reusability.


    **Simplicity** is provided by XML because it is easy to create and understand.
    Such simplicity allows you freedom based on your needs.


    **Organization** is provided by XML because it allows you to build your website
    by segmenting the'
