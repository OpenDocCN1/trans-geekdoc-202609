    \ {\n  echo \"Match<br/>\";\n} else {\n  echo \"No Match<br/>\";\n}\nif(preg_match($regex4,$string))\
    \ {\n  echo \"Match<br/>\";\n} else {\n  echo \"No Match<br/>\";\n}\nif(preg_match($regex5,$string))\
    \ {\n  echo \"Match\";\n}\n?>\n```\n\n![](img/9532a68e5a5ba9dbe45a4909787d2f1d_152_0.png)\n\
    \nFigure 4.1 illustrates that each regex matched string ‘hello world’. ‘$regex1’\
    \ (line 4) matches a string that starts with ‘hello’. ‘$regex2’ (line 5) matches\
    \ a string that ends with ‘world’. ‘$regex3’ (line 6) matches a string that begins\
    \ with ‘he’, followed by exactly two ‘l’s, and ends with ‘o’. ‘$regex4’ (line\
    \ 7) matches either ‘hello’ or ‘world’. ‘$regex5’ (line 8) matches a string that\
    \ begins with ‘hello’ and ends with ‘world’.\n\nTo include special symbols as\
    \ part of a regex, escape them with a backslash \\. So, to take literally, special\
    \ characters ‘!@#$%%&*()+-;?’ must be escaped because they have special meaning.\
    \ You must escape the backslash character itself if you need to use it as part\
    \ of a regex.\n\nLet’s look at another example that uses two additional special\
    \ symbols – [] and “\\”. Brackets [] contain characters allowed in a single position\
    \ of the string. The “\\” indicates a space. PHP file ‘pcre2.php’ illustrates\
    \ how these symbols can be used as part of a regex.\n\n```\n<?php\n// File pcre2.php\n\
    $String1='My phone is: ;';\n$String2='(290)444-3333';\n$String3='My phone is:\
    \ (290)444-3333';\n```"
