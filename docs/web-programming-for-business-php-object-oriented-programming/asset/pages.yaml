  md: '# # Input Validation and Report Generation


    # ## Overview


    Any form of data entering a website is potentially harmful. Input validation is
    therefore very important. Two techniques for input validation are presented. First,
    Perl Compatible Regular Expressions (PCRE) are introduced, and implemented as
    a means to verify input form data. PCRE resembles Perl in terms of pattern-matching
    functionality. Second, PHP have a set of built-in-filter functions for input validation.
    The chapter concludes by introducing two small applications for safe report generation.


    # ## Learning Objectives


    After completing this chapter, you will gain a fundamental understanding of input
    validation to mitigate potentially harmful form data from entering your website.
    You will also learn how to create safe report generation using drop-down menus.
    Understanding is enhanced through explanation and code examples. The following
    objectives summarize the skills the chapter will help you develop:


    +   - Learn the definition of a regular expression.

    - Learn the definition of PCRE.

    - Learn how to use PCRE to validate form data.

    - Learn how to build a PCRE form data validation application.

    - Learn how to use PHP built-in validation functions.

    - Learn how to build an application with PCRE and built-in functions.

    - Learn how the advantages and disadvantages of PCRE and built-in functions.

    - Learn how to build a simple report generation application.

    - Learn how to build a sophisticated report generation application.

    - Learn how to build a report generation application with PL/SQL cursors.


    # ## Regular Expressions'
  merge: -1
  img_proc: true
- pgno: 151
  md: 'A regular expression is a pattern describing a certain amount of text, abbreviated
    as ‘regex’. The idea is to test for a match between the regex and the form input.
    A match is the piece of text that the pattern was found to correspond to the regex
    processing software.


    # PCRE


    Perl Compatible Regular Expressions (PCRE) is a set of PHP functions that implement
    expression pattern-matching using the same syntax and semantics as Perl 5. PCRE
    uses special symbols to facilitate pattern-matching. PCRE allows many special
    symbols, but I cover the ones that use most often to enable form input validation.


    To make it easier, I start by introducing a small set of special characters and
    provide a corresponding example to facilitate learning. Continue by introducing
    another set of special characters and a corresponding example, and so on. After
    the symbols are introduced, I provide examples of regex that I use for form input
    validation. I end the ‘regex’ sections with an application that validates form
    data.


    # Special Symbols


    The ‘^’ indicates the start of the string. The ‘$’ indicates the end of a string.
    The ‘?’ indicates that the previous token is optional. A token is a tangible way
    to represent a piece of a regex. The ‘|’ is a Boolean OR. Braces ‘{}’ are used
    to match the number of occurrences. Parentheses ‘()’ are used to quantify a sequence
    of characters. Delimiters are used to mark the beginning and end of a pattern.
    A delimiter can be any nonalphanumeric, nonbackslash, nonwhitespace character.


    I use the ‘#’ symbol as a delimiter because it then easier for me to discern the
    regex. Often-used delimiters are ‘/’, ‘’, and ‘~’. PCRE can quickly become complex,
    so let’s look at an example. PHP file p1.php includes five regexes (lines 4–8)
    that match against ‘hello world’ (line 3). The (preg_match()) function (lines
    9, 12, 15, and 21) is used to perform a regex match. Each regex is compared to
    ‘string’. The results are displayed as ‘Match’ or ‘No Match’


    ```

    1 <?php\2 // File p1.php3 $string=''hello world'';4 $regex1=''#^hello#'';5 $regex2=''#world$#'';6
    $regex3=''#^he(l{2})o#'';7 $regex4=''#(hello)(world)#'';8 $regex5=''#^hello world$'';9
    if (preg_match($regex1,$string))10 { echo "Match<br />"; } *

    ```'
