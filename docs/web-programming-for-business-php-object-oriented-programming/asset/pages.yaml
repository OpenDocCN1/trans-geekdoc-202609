  md: '# # XML in Action


    # ## Overview


    XML is structured in a simple and common format (in plain text) and provides a
    platform-neutral, efficient way of sharing and storing data. As such, an XML document
    can be shared by computers with completely different components, interfaces, configurations,
    and operating systems.


    Two techniques for working with XML are presented. First, the ‘SimpleMLElement’
    class i: introduced, explained, and implemented as a means to convert XML into
    an object that can be processed with normal property selectors and array iterators.
    Second, XPath is introduced, explained, and implemented as a means of finding
    information in an XML document.


    # ## Learning Objectives


    After completing this chapter, you will gain a fundamental understanding of the
    topic by creating, modifying, traversing, and saving XML content. The following
    objectives summarize the skills the chapter will help you develop:


    +   1. Learn the definition of XML and its characteristics.

    2. Learn the five basic reasons why you should use XML.

    3. Learn the structure of an XML document.

    4. Learn the rules that ensure that an XML document is well-formed.

    5. Learn about the ‘SimpleXML’ extension and ‘SimpleMLElement’ class.

