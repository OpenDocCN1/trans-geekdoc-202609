- pgno: 242
  md: '# 6 Standard PHP Library and the Iterator Interface


    Overview

    Two topics are covered in this chapter – the Standard PHP Library and the Iterator
    interface. Standard PHP Library (SPL) is a collection of interfaces and classes
    that provides efficient data access through sophisticated types of looping for
    aggregate structures such as arrays, database result sets, XML trees, and directory
    listings. SPL is based on the Iterator interface, which is an effective mechanism
    for traversing the elements of an aggregate structure.


    Learning Objectives

    After completing this chapter, you will gain skills in two areas. First, I will
    show you how to use selected SPL classes to efficiently iterate over an aggregate
    structure. Second, I will show you how to use the Iterator interface to better
    understand the looping process and gain more control over aggregate structure
    iteration. Skills are enhanced through explanation and code examples. The following
    objectives summarize the skills the chapter will help you develop:


    +   1. Learn the definition and characteristics of SPL.

    2. Learn the definition and characteristics of the Iterator interface.

    3. Learn the five methods that the Iterator interface is based upon.

    4. Learn how to use selected SPL classes to iterate aggregate structures.

    5. Learn how to use the Iterator interface with an array.

    6. Learn how to use the Iterator interface with XML.

    7. Learn how to use the Iterator interface with a database.

    8. Learn the definition and characteristics of the ‘IteratorAggregate’ interface.

    9. Learn how to use the ‘IteratorAggregate’ interface.


    # Definition and Characteristics of SPL'
  merge: -1
  img_proc: true
- pgno: 243
  md: 'Standard PHP Library(SPL) is a collection of interfaces and classes that provide
    efficient data access through sophisticated types of looping for aggregate structures.
    An aggregate structure is anything you want to loop over. Arrays, database result
    sets, XML trees, and directory listings are examples of aggregate structures because
    they hold elements that can be iterated.


    SPL implements the iterator design pattern. The iterator design pattern is an
    OOP design used to iterate over an aggregate structure and access its elements
    sequentially without exposing their underlying presentation.


    The idea is to take the responsibility for access and traversal out of the aggregate
    structure and place it into an iterator object that defines standard traversal
    protocol. A traversal protocol is a set of rules that explains the procedures
    for iterating an aggregate structure. So, I can place an aggregate structure into
    an iterator object, and let the iterator object care of access and traversal of
    elements in a standard manner. This way, the internal structure is invisible to
    the outside world. For instance, if I place a database result set into an iterator
    object, I can manipulate the elements easily without even knowing the internal
    structure of the database result set! All of the traversal logic is handled by
    the iterator object.


    # Definition and Characteristics of the Iterator Interface


    The iterator interface is logically and functionally based on the iterator design
    pattern. The Iterator interface is a built-in interface that provides the necessary
    methods to efficiently interact with an iterator. An iterator is an object that
    provides a means to traverse an aggregate structure. All iterators (including
    SPL) implement the Iterator interface.


    PHP provides two interfaces that allow a programmer to define how objects behave
    in a ‘foreach’ loop – ‘Iterator’ and ‘IteratorAggregate’. The Iterator interface
    is discussed in this section. The IteratorAggregate interface is discussed at
    the end of the chapter.


    PHP natively allows a programmer to iterate over objects with a ‘foreach’ loop.
    However, this process only works with public properties of an object. As such,
    public properties of the object are the only values that can be accessed through
    ‘foreach’ loop iteration.


    Since encapsulation advocates using private or protected properties with getters
    and setters, the properties of the object cannot normally be accessed. The Iterator
    interface (and ‘IteratorAggregate’) provide a solution because they allow the
    programmer to define the logic that governs the values when an object is iterated.


    Before SPL interfaces and classes can be used with a ‘foreach’ loop, the aggregate
    structure must be placed into an iterator object. Once it is placed into an iterator
    object, not only can it be easily traversed with a ‘foreach’ loop; it also has
    the flexibility of any OOP object, such as inheritance, aggregation, encapsulation,
    polymorphism, and reflection. This type of flexibility is what OOP is about!'
  merge: -1
  img_proc: true
- pgno: 244
  md: '# Five Iterator Interface Methods


    The Iterator interface requires the programmer to implement five methods – current,
    key, next, rewind, and valid. The ‘current()'' method returns the current value
    in the iteration. The ‘key()'' method returns the key value for the current value.
    The ‘next()'' method advances the iterator forward one step. The ‘rewind()'' method
    resets the pointer that is being used for the iteration. The ‘valid()'' method
    returns a Boolean value that indicates if value exists in the current position
    of the iteration.


    # Selected SPL Classes


    Although SPL functionality is based on the Iterator interface, the complexities
    involved are transparent to the programmer. This is because Iterator interface
    logic is internal to SPL classes and interfaces. As such, SPL is easy to program
    because the five Iterator interface methods do not have to be programmatically
    implemented.


    The first SPL class I demonstrate is ‘LimitIterator’, which determines where to
    start iteration how many times the loop should run. The first parameter of ‘LimitIterator’
    is an object. The second parameter is the starting position (the first element
    starts at position zero). The third parameter indicates how many elements to include.


    PHP file ‘limit.php’ implements ‘LimitIterator’. The program begins by placing
    an array into ‘ArrayIterator’ object that is itself wrapped in a ‘LimitIterator’
    object limited to two values. The values of the limited object are then displayed.


    ```

    <?php

    // File limit.php

    $numbers = array(5,10,8,35,50);

    $iterator = new ArrayIterator($numbers);

    $limiter = new LimitIterator($iterator,0,2);

    foreach($limiter as $number) {

