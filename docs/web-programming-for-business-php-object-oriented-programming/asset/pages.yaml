  md: '# Advantages and Disadvantages of PCRE and Built-In Functions


    The main advantage of PCRE is its flexibility. PCRE enables you to build a regex
    to validate a pattern. The main disadvantage of PCRE is that it requires a sharp
    learning curve to master. PCRE i embraced because it is based on Perl. Perl is
    widely used in industry, so Perl-related knowledge can only increase your marketability
    in the world of technology. Another advantage is that someone with PCRE or Perl
    skills can look at your regex and readily see its value.


    The main advantage of built-in validation functions is their ease of use. To them,
    no PCRE knowledge is required. The main disadvantage is that built-in functions
    are inflexible. You can only validate data that fits with the available functions.


    # Report Generation Application


    It is possible to obtain directives from users without having to validate. An
    example is report generation with drop-down menus. With such menus, users can
    safely generate a variety of reports.


    To build a report generation application, start by creating sequences and tables,
    continue by populating the tables, and ‘commit’ the work. An Oracle sequence is
    a database object that allows a user to generate unique integers. A typical application
    uses a sequence to automatically generate primary keys values. The ‘COMMIT’ statement
    makes permanent changes made to the database during the current transaction.


