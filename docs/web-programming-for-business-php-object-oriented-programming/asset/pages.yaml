    # # Definition and Characteristics of the ‘IteratorAggregate’ Interface


    The Iterator interface implements an internal iterator. **Internal iterators**
    hide the implementation details of the aggregate structure upon which they work.
    That is, the Iterator interface automatically handles iteration of the aggregate
    structure through its internal methods – ‘rewind()’, ‘valid()’, ‘current()’, ‘key()’,
    and ‘next()’. Details of iterator implementation are hidden.


    The ‘IteratorAggregate’ interface creates an external iterator. **External iterators**
    are local to the calling environment. That, all manipulations of external iterators
    are controlled manually. For instance, ‘next’ won’t be called until you call it!
    With an internal iterator, ‘next’ (as well as the other methods) is called automatically.


    The interface employs the ‘getIterator()'' method to retrieve an external iterator.
    Method ‘getIterator()'' must have public visibility so the calling environment
    has access. Upon instantiation of a new object that implements ‘IteratorAggregate’,
    the ‘getIterator’ method is automatically invoked. As such, an external iterator
    is automatically returned to the calling environment.


    # # The ‘IteratorAggregate’ Interface


    A simple example demonstrates how the ‘IteratorAggregate’ interface works. PHP
    file ‘array_aggregate.php’ contains the class that implements the interface and
    PHP file ‘invoke_array_aggregate.php’ contains the code that invokes the class.
    Notice that the class implements an ‘IteratorAggregate’ rather than an ‘Iterator’
    (iterator interface).'
