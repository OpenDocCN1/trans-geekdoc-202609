  img_proc: true
- pgno: 201
  md: 'design. Data is on one page, formatting rules are on another. Once you have
    a general idea of what information you need to produce, you can write the data
    page first and then work on the design. XML allows you to produce your website
    in stages and stay organized in the process.


    **Accessibility** is provided by XML by enabling you to compartmentalize your
    work. Separating data (from format) makes it accessible when changes are needed
    without impacting format. If you write both segments (data and format) in HTML,
    you create sections that incorporate the formatting instructions with the information
    you need to display on the page. When changes are needed, you must wade through
    all the code to find a few lines because data and format are not separated. In
    addition, you causing unforeseen errors because any change can potentially impact
    the format since both segments are in the same place. Separating data from format
    makes changes easy, less error prone, and less time consuming.


    **Standardization** is provided by XML because it is an international standard.
    As anyone, in the world has the ability to view and understand your document.


    **Reusability** is provided by XML because you can make one data page and use
    it over and over again. That is, you can create as many display pages as you want
    for that data. XML allows you to generate different styles and formats based on
    one page of information.


    # XML Structure


    The contents of an XML document is a good way to understand its basic structure.
    The following XML document `cars.xml` contains three car elements.


    ```

    1 <?xml version="1.0" encoding="ISO-8859-1"?>n2 <cars>

    3 <identity sno="fm12345">

    4 <make>Ford</make>

    5 <model>Mustang</model>

    6 </identity>

    7 <identity sno="ha98764">

    8 <make>Honda</make>

    9 <model>Accord</model>

    10 </identity>

    11 <identity sno="mm11111">

    12 <make>Mazda</make>

    13 <model>Miata</model>

    14 </identity>

    15 </cars>

    ```


