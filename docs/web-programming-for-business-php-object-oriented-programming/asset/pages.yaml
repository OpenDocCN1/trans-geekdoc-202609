    # # Abstract Class


    An abstract class defines the basic structure of a class, but cannot be instantiated
    on its own. It must be ‘extended’ by another class to work. It contains properties
    and methods, but some methods are incomplete and waiting for some other class
    to extend them (through inheritance). If a method is defined as ‘abstract’, it
    cannot be declared private because inheritance must be used. Remember that only
    ‘public’ or ‘protected’ methods can be extended through inheritance. The advantage
    is that ‘abstract’ forces all child classes to define the details of a method
    so that multiple classes can be created to different things.


    PHP file ‘abstract_employee.php’ contains abstract class ‘abstract_employee’ (lines
    3–15) with three ‘protected’ properties (lines 5–7), a ‘public’ method `setData()`
    (lines 8–13), and an abstract method `outputData()` (line 14). Keyword ‘abstract’
    (line 3) preceding keyword ‘class’ defines class ‘abstract_employee’ as abstract.


