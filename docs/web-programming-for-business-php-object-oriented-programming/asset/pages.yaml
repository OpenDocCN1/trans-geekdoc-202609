    Let’s begin by creating a directory to display content. This directory is where
    all files you wish to be displayed on the Internet must reside. Type the following
    on the command line and press ‘Enter'':


    ```

    mkdir public_html

    ```


    Command ‘mkdir’ tells Linux to create a new directory. In this case, the directory
    is called ‘public_html’. Typically, ‘public_html’ is where Linux looks for information
    to display on the Internet. Now, set permissions for the directory (type the following
    on the command line and press ‘Enter''):


    ```

    chmod 705 public_html

    ```


    Command ‘chmod’ tells Linux to change permissions to ‘705’ for the directory listed.
    I will explain what ‘705’ means in a moment. To see what happened, type the following
    command:


    ```

    ls-la

    ```


    Command ‘ls’ lists the contents of a directory. In this case, you are at the highest
    level of your directory structure. With ‘ls’, two options are included – ‘l’ and
    ‘a’. Options are preceded by a hyphen ‘l’ tells the list command to use a long
    list format. Option ‘a’ tells it not to hide anything. To the left of directory
    ‘public_html’ to see its permissions.


    ```

    drwx---r-x

    ```


    Let ‘d’ tells you that ‘public_html’ is a directory. The next three letters ‘rwx’
    are permissions for the owner (you) of the directory. The following three ‘---’
    are permissions for the group. Don’t worry about group permissions in this book,
    because we won’t discuss them. The final three ‘r-x’ are permissions for the world
    (Internet). Before explaining permissions more deeply, let’s look inside the ‘public_html’
    directory. To do this, enter the following on the command line:


    ```

    cd public_html

    ```'
