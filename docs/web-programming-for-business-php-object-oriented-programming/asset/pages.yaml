    Figure 6.8 Output Using a Custom Iterator Interface Class for Arrays


    Let’s review. Whether implementing ‘sit’ explicitly (‘while’ loop) or implicitly
    (‘foreach’ loop), the text ‘rewinding data ...’ is displayed first because ‘rewind()’
    is the first method invoked (lines 6 and 13). The ‘valid()’ method is then invoked
    to check if the current element exists (lines 7 and 13). Since the current element
    exists, the key and element are then displayed by the ‘echo’ statements in the
    ‘while’ (lines 9 and 10) and ‘foreach’ loops (line 15), respectively. The ‘next()’
    method is then invoked to move to the next element (dog) (lines 10 and 13). The
    ‘valid()’ method is again invoked to check if the current element exists (lines
    7 and 13). Since it does, the key and element are again displayed (lines 9 and
    10 and line 15). The ‘next()’ method is then invoked to move to the next element
    (cat) (lines 10 and 13). The ‘valid()’ method is again invoked to check if the
    current element exists (lines 7 and 15). Since it does, the key and element are
    again displayed (lines 9 and 10 and line 15). The ‘next()’ method is then invoked
    to move to the next element (lines 10 and 13). Since it does not exist, ‘next’
    is FALSE. When the ‘valid()’ method is invoked (lines 7 and 13), the current element
    does not exist and the loops terminate.


    Line 13 is referenced over and because ‘foreach’ loops imply all of the Iterator
    interface methods. So, explicit implementation offers flexibility, but is much
    more complex. In contrast, implicit implementation is very simple but allows no
    flexibility to the programmer. Most of the time, implicit implementation is fine
    but it doesn’t hurt to know how to explicitly use the Iterator interface.


