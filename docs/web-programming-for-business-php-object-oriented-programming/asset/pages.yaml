    # Strong Passwords


    I intentionally created simple (weak) passwords to ease testing. However, you
    should create stronger passwords for added security. First, make your passwords
    at least eight characters long. Second, mix together uppercase letters, lowercase
    letters, and numbers. Although including special characters creates a stronger
    password, it is not recommended. The reason is that special characters have meaning
    in PHP, HTML, Oracle, Linux, JavaScript, and web browsers. For instance, two tags
    have meaning in multiple contexts. Symbol ‘’ is part of a PHP tag, part of an
    HTML tag, and signal output redirection in Linux. Symbol ‘?’ is used to append
    content to a URL in a web browser, is part of a PHP tag, and can be used as a
