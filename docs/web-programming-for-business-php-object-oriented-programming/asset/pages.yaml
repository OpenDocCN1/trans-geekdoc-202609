- pgno: 24
  md: 'Command ‘cd’ changes directories to your choice. In this case, you are changing
    to ‘public_html’. Now, list contents with no options:


    ```

    ls

    ```


    You see nothing because you have yet to create content in ‘public_html’. Command
    ‘cd’ followed by a directory moves you down your directory tree. To move up your
    directory tree, type the following on the command line:


    ```

    cd ..

    ```


    You should now be back at the top of your directory tree. Type the following:


    ```

    ls

    ```


    You should see only the ‘public_html’ directory that you created. Earlier in this
    section, you typed ‘ls-la’ to see permissions of ‘public_html’. Permissions for
    your display directory are ‘drwx--r-x’. The first bit ‘d’ means directory. The
    next three bits ‘rwx’ mean that the owner (you) has read, write, and execute privileges.
    So, you can read from this directory, write to this directory, and execute from
    this directory. The next three bits ‘---’ are for group privileges. The hyphen
    ‘-’ means no permissions are provided. The group has no privileges on this directory.
    The final three bits ‘r-x’ mean that anyone on the Internet can read from the
    directory and execute from it, but cannot write to it. If you wish to secure a
    directory or file from the world, *never* provide ‘write’ privileges, otherwise
    *anyone* with access to the Internet can potentially write to your file or directory!


    Table 1.1 Octal to Binary Conversion


    | Octal | Binary |

    |---|---|

    | 0 | 000 |

    | 1 | 001 |

    | 2 | 010 |

    | 3 | 011 |

    | 4 | 100 |

    | 5 | 101 |'
