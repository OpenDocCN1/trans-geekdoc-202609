    Since ‘toString()’ automatically builds and returns the final string, less code
    is needed, which is an advantage of using magic methods. You can also use ‘toString()’
    to help debug since it automatically displays values of your choice.


    Two caveats are in order at this point. First, be sure to precede methods with
    two consecutive underscores. Second, be sure that the ‘toString()’ method returns
    a character string. If it returns anything else, an error will occur.


    I recommend explicitly converting any ‘toString() return values that you are unsure
    about. Two options are available to accomplish conversion – type casting or the
    ‘strval()’ function. Type casting variable ‘$varname’ to a string is accomplished
    by placing ‘(string)’ before the variable and assigning it to another variable.


    ```

