    # CAPTCHA


    A completely automated public Turing test to tell computers and humans apart (CAPTCHA)
    is a type of challenge-response test used to ensure that a response is not generated
    by a computer. The challenge-response is typically a distorted image of letters
    and numbers that (hopefully) only a human being can decipher. The process usually
    involves one computer (server) asking a user to complete a simple test that the
    computer is able to generate and grade. For websites, CAPTCHA is used to verify
    a form or other login. To implement CAPTCHA, I use ''Securimage''.


