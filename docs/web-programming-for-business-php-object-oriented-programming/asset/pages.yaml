    Summing array elements is done by invoking method ''sum()'' with ''$this->sum''
    and using the array as parameter with ''$this->array''. Using ''this'' with method
    ''sum()'' allows you to invoke method anywhere within the class. Counting array
    elements is done by using the built-in PHP function ''count()'' with the array
    as parameter. The array is referred to as ''$this->array''.


