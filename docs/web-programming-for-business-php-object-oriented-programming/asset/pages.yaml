  md: '# # Definition of Really Simple Syndication


    **Really Simple Syndication (RSS)** is a dialect of XML and provides a format
    for web content syndication. I use RSS 2.0 format because it is newer and eliminates
    the need for namespaces.


    # ## Characteristics of Really Simple Syndication


    RSS feed must be a valid XML document. The root element must be ‘<rss>’ and contain
    the attribute ‘version=2.0’. The root element must have a single child element
    called ‘<channel>’. The ‘<channel>’ element has three required elements that contain
    information about the feed – ‘<title>’, ‘<link>’, and ‘<description>’. Element
    ‘<title>’ is the name of the channel (feed). Element ‘<link>’ is the URL of the
    website corresponding to the channel. Element ‘<description>’ describes the channel.
    Sixteen elements are available if desired.


    A channel may contain any number of `<item>` elements. These elements represent
    the data pulled from an Oracle database. The ‘<item>’ element must contain either
    a ‘<title>’ or ‘<description>’ element, but can also contain seven optional elements.


    For Chrome users, use the extension to auto-detect RSS feeds available (at the
    time or writing) at the following URL:


    ```

    https://chrome.google.com/webstore/detail/nlbjncdgieocebbhnmkbbbdekmmcebfjd

    ```


    # ## Really Simple Syndication Feed Application


    I begin by building an RSS application with three classes – ‘dbAggregation’, ‘dbIterator’,
    and ‘rss_feed’. The ‘dbAggregation’ and ‘dbIterator’ classes were introduced and
    explained in [Chapter 6](https://example.com). The application creates an RSS
    feed using information from Oracle database to publish the `<item>` elements.


    The ‘dbAggregation’ class sets the username, password, and host server. It also
    connects to Oracle, gets SQL from the calling environment, instantiates a ‘dbIterator’
    instance, and returns the result set based on the SQL.


    The ‘dbIterator’ class implements an Iterator interface, accepts the connection
    to Oracle from ‘dbAggregation’, parses, and executes the SQL. The class also contains
    the Iterator logic. The ‘rss_feed’ class builds an RSS feed. The class sets the
    result set, choice to either display or save the feed, and file name if the feed
    is to be saved. In addition, the class contains six methods. Four methods are
    simple getters for channel information. The ‘write()’ method contains logic for
    It relies on the ‘XMLWriter’ extension to generate XML for the RSS feed.'
