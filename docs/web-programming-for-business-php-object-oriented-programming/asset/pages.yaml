  md: 'declaration (sometimes referred to as the XML prolog) in line 1 tells browsers
    and processors that the document is XML. If used, the declaration must be the
    first entry in the document. There cannot be anything before it, not even blank
    lines or comments. The root element `<cares>` (lines 2 and 15) contains everything
    inside the document. An element describes data that it contains, and can also
    contain other elements and attributes. An attribute provides additional information
    about elements, but cannot contain other elements.


    At the next level are three `<identity>` elements (lines 3–6, 7–10, and 11–14),
    each which has a ‘sno’ attribute (lines 3, 7, and 11). Within each `<identity>`
    element are two elements named ‘make’ and ‘model’, which each contain text. The
    text inside an element is referred to as a text element (or text node).


    # XML Nodes


    XML can define seven nodes – root, element, attribute, text, comment, processing
    instructions, and namespace. The root node contains everything in the XML document,
    including the root element. An element node can contain other element nodes, a
    text node, or be empty. An attribute node is a name–value pair in an element’s
    opening tag. A text node is the literal text between opening and closing tags.
    A comment node contains comments. A processing instruction node passes instructions
    to the application processing an XML document. A namespace node provides a way
    to prevent clashes between elements from different sources.


    # XML Rules


    An XML document must be well-formed to be considered viable. A well-formed XML
    document must conform to the seven rules of XML syntax. It can have only one root
    element. Every start tag must have a matching closing tag. Third, empty elements
    can omit the closing tag, but if they include one must have a forward slash before
    the closing bracket `/>`. Fourth, elements must be properly nested. Fifth, attribute
    values must be in quotes. Sixth, in the content of an element or attribute value
    `<` and `&` must be replaced by HTML entities `&lt;` and `&amp;`, respectively.
    Seventh, an XML declaration is allowed only at the start of the document.


    # SimpleXML


