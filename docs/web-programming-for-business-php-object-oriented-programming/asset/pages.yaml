  md: '# AJAX


    **Asynchronous JavaScript and XML (AJAX)** is a method of sending and receiving
    data asynchronously from a server-side application using JavaScript. With asynchronous
    data transmission, the web browser (and server) can continue doing other things
    while the AJAX data request is fulfilled by the server.


    AJAX is possible because web browsers offer objects that can make independent
    HTTP request with the help of JavaScript. Sixth, the AJAX application includes
    an HTML page that uses user interface elements that interact with JavaScript functions.
    JavaScript functions enable HTTP request by communicating with the web browser.
    The web browser sends the HTTP request to the server and waits for a response.
    The server processes the request and can respond in XML markup, plain text images
    or data from a database.


    Figure 7.3 depicts how AJAX works.


    ![](img/9532a68e5a5ba9dbe45a4909787d2f1d_286_0.png)


    Figure 7.3 Graphical Representation of the AJAX Process (http://www.w3schools.com/ajax/ajax_intro.asp)


    The AJAX process has six steps. First, the HTTP object is created. Second, the
    web browser sends the HTTP request to the server. Third, the server processes
    the HTTP request. Fourth, the server creates a response and sends it back to the
    web browser. Fifth, the web browser processes the response. Sixth, the web browser
    updates page content.


    JavaScript file ''demo.js'' demonstrates AJAX. You don''t need to save this file
    because I use it for explanation purposes only.


    ```

    1 // File demo.js

    ```'
