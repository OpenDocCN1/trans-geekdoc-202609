    # [Transfer learning](#toc.xhtml#s84a)


    Transfer learning is a mechanism by which you take a pre-trained model which was
    trained for certain classes of images and then retrain for a different set of
    classes. For example, we can take VGG16, which is trained to classify 1000 different
    classes of day-to-day objects and retrain it classifies very specific types of
    objects, maybe motor parts or computer hardware, and so on. The main advantage
    of this mechanism is that it works when the training data is very less. The reason
    is, we do not train all the layers of the model since that would take very long.
    Only the last layer of the last few layers dense layers is trained. The convolution
    layers are not trained, but the trained values of their parameters are reused.
    That is the reason this is called transfer learning.


