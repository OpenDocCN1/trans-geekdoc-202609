    2. 好了！你准备好开始编码了。

    3. 只输入：`print("Hello world")` 并按下 `Shift` + `Enter`。这会在下一行打印 `Hello world`。


    #### 在 Python 中设置本地环境


    在本地设置 Python 环境的最佳方法是使用 Anaconda。它是一个带有易用界面的 Python 分发版。按照这里提供的步骤设置环境。


    #### 前提条件


    笔记本电脑内存至少 4 GB，Intel i5 或同等处理器，配备 Windows 7 或更高版本。也可以使用 MacOS、Ubuntu 等操作系统，但为了简单，我们在这里只提供
    Windows 的说明。互联网连接——至少 2 MBPS。因此，执行以下步骤：


    1. 从 Anaconda 网站安装 Anaconda：https://www.anaconda.com/distribution/


    ![](img/Figure-2.4)


    **图 2.4:** 选择 Python 3.7


    2. 选择 Python 3.7 版本。这将开始下载安装文件。下载，双击此文件开始安装。这可能需要一段时间时间，取决于你的互联网连接。


    3. 安装完成后，你可以在 Windows 开始菜单中看到 Anaconda Navigator。打开 `Anaconda Navigator` 并选择 `Environments`。默认情况下，会创建一个包含
    Python 的基础环境：


    ![](img/Figure-2.5)


    **图 2.5:** Anaconda Navigator 首页


    4. 为你的学习或项目创建一个新环境是一个好主意。


    5. 使用左下角的 `create` 按钮创建一个新环境。选择 `Python 3.7` 版本并给出一个有意义的名字如 `TensorFlow`。这可能需要一段时间，取决于你的互联网连接。


    ![](img/Figure-2.6)


    **图 2.6:** 创建新环境


    6. 完成后，选择此环境，如图 2.7 所示。使用右侧的按钮安装额外的库如 `NumPy`、`pandas`、`scikit-learn` 和 `Matplotlib`，如下所示：


    ![](img/Figure-2.7)


    **图 2.7:** 选择新环境


    7. 安装额外的库如 `NumPy`：


    ![](img/Figure-2.8)


    **图 2.8:** 安装 NumPy


    8. 现在再安装一个库如 `pandas`：


    ![](img/Figure-2.9)


    **图 2.9:** 安装 pandas


    9. 接下来安装 `scikit-learn`：


    ![](img/Figure-2.10)


    **图 2.10:** 安装 scikit


    10. 使用相同的过程安装 `Matplotlib`。


    11. 通过选择左侧导航栏上的 `Home` 进入主页。点击 `Install` 安装 Jupyter Notebook（参考图 2.11）。


    ![](img/Figure-2.11)


    **图 2.11:** 安装 Jupyter notebook


    12. 这完成了安装过程。TensorFlow 的安装步骤将在相应的章节中提供。


