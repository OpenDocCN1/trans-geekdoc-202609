- raw: 'However, very often, data does not come so neatly organized. Usually, all
    the images are dumped into one single folder. And an `xl` or `csv` file is provided
    with the labels. In such a case, we do not have to separate the images into different
    folders. Fortunately, Keras has a provision for handling this. There is a method
    called `flow_from_dataframe` in the `ImageDataGenerator` class that we use instead
    of the `flow_from_directory` method. In this section, we will see a couple of
    examples: one with binary classification and the other with multiclass classification.
    And to make it easy to understand, we will use the same examples of `Cat/Dog`
    for binary and `Airplane/Car/Motorbike` for multiclass.


    Before we begin with the code, let us take a look at how the data is organized.
    There are three folders with data:


    ![](images/Figure-6.79.jpg)


    **Figure 6.79:** Folder structure


    And there are two `.csv` files, one each for training data and test data:


    ![](images/Figure-6.80.jpg)


    **Figure 6.80:** Two .csv files


    Let us take a look at the `train` subfolder:


    ![](images/Figure-6.81.jpg)


    **Figure 6.81:** Images in train folder


    There is a mix of images of both cats and dogs. And the same with the test subfolder
    as well. The labels of these images are provided in the CSV files. Let us take
