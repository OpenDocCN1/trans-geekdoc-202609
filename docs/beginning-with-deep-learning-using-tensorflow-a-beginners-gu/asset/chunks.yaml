    \n![](img/Figure-6.39.jpg)\n\n**图 6.39:** TF1.x 代码\n\n代码其余部分保持不变。接下来，我们构建 CNN\
    \ 模型，就像 MNIST 的情况一样。代码几乎完全相同，有两个地方不同：\n\n*   `input_shape`：在这种情况下，输入图像的大小是 64×64\
    \ 的彩色图像；因此，输入形状为 64×64×3。\n*   最后一层用的是 Sigmoid 而不是 Softmax。这在上一章中解释过。由于这是一个二分类器，我们需要一个带有\
    \ Sigmoid 激活函数的神经元。在 MNIST 的案例中，它是一个 10 分类分类器，因此使用了带有 10 个神经元的 Softmax。\n\n![](img/Figure-6.40.jpg)\n\
    \n**图 6.40:** 创建模型\n\n在编译中，我们添加了 `adam` 优化器并使用损失函数 `binary_crossentropy`：\n\n\
    ![](img/Figure-6.41.jpg)\n\n**图 6.41:** 编译\n\n这是 CNN 模型的配置。\n\n![](img/Figure-6.42.jpg)\n\
    \n**图 6.42:** 模型摘要\n\n这包含 370,817 个可训练参数。现在模型已经就绪，让我们导入数据并准备将其输入模型进行训练。\n\nKeras\
    \ 让这一切变得非常简单。我们导入并创建两个 `ImageDataGenerator` 实例，分别用于训练数据测试数据：\n\n![](img/Figure-6.43.jpg)\n\
    \n**图 6.43:** DataGenerator \n\n在创建这些实例时，我们为参数 `rescale` 提供了一个归一化值。使用 `flow_from_directory`\
    \ 函数来指定存储数据的路径：\n\n![](img/Figure-6.44.jpg)\n\n**图 6.44:** 训练数据路径\n\n回想一下上面提到的数据集目录结构。第一个参数是目录路径。它可以是相对路径，也可以是绝对路径。具体的语法取决于你运行的是\
    \ Windows 还是 Mac/Linux。上面的语法适用于 Windows。此外，我们必须指定 `target_size`。这应该与为模型指定的 `input_size`\
    \ 相同。注意，这不需要等于图像的实际大小。虽然当实际大小与 `input_size` 和 `target_size` 相同时性能最佳，但这适用于任何大小的图像。然而在加载图像时，它们会被调整为\
    \ `target_size`。如果 `target_size` 与 `input_size` 不同，在训练模型将会报错。\n\n下一个参数 `class_mode`\
    \ 指定了分类类型。在这种情况下，由于我们正在构建一个二分类器，值设置为 `binary`。\n\n当执行此单元格时，它会检查目录路径的有效性，并检查图像数量和类别数量：\n\
    \n![](img/Figure-6.45.jpg)\n\n**图 6.45:** 训练数据\n\n在这种情况下，两个类别共有 98 张图像。有趣的是，类别的数量是由指定目录中的子文件夹决定的。在我们的案例中，只有两个子文件夹\
    \ `cats` 和 `dogs`，因此它知道有两个类别。然而，如果你添加了额外的子文件夹，它计算出的类别数量等于子文件夹的数量：\n\n![](img/Figure-6.46.jpg)\n\
    \n**图 6.46:** 类别索引\n\n类别标签及其对应的数值存储在 `class_indices` 属性中。如前所示，类别标签是文件夹名称，数值按字母顺序从\
    \ 0 开始分配。测试集则使用 `testagen` 遵循了相似的过程。\n\n![](img/Figure-6.47.jpg)\n\n**图 6.47:**\
    \ 测试数据\n\n\n"
