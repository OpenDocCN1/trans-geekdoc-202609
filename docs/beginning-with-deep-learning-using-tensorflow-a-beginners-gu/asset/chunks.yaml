    \n    **Figure 5.7:** Clicking \"Apply\"\n\n8.  `Install Packages` window will\
    \ be opened; it displays the packages that will be installed: \n\n    ![](images/Figure-5.8.jpg)\n\
    \n    **Figure 5.8:** Install packages window\n\n9.  The next step is to install\
    \ Jupyter notebook. Click on `Home` on the left navigation bar. It will show Jupyter\
    \ Notebook. Click on `Install`: \n\n    ![](images/Figure-5.9.jpg)\n\n    **Figure\
    \ 5.9:** Selecting Jupyter notebook\n\n10.  Launch Jupyter notebook from anaconda\
    \ prompt as follows: \n\n     ![](images/Figure-5.10.jpg)\n\n     **Figure 5.10:**\
    \ Launching Jupyter notebook\n\n11.  `Jupyter notebook` command will run as shown\
    \ in the following screenshot: \n\n     ![](images/Figure-5.11.jpg)\n\n     **Figure\
    \ 5.11:** Jupyter notebook command is working\n\n12.  Check for the successful\
    \ installation of TensorFlow2: \n\n     ![](images/Figure-5.12.jpg)\n\n     **Figure\
    \ 5.12:** Test for successful installation of TensorFlow2\n\nCongratulations!\
    \ TensorFlow2 is installed.\n\nPlease note if you have installed TensorFlow successfully\
    \ by the above method, then there is no need to install again using the steps\
    \ given below. You can skip to the next section *What is new is TensorFlow 2*.\n\
    \n# [From Anaconda command prompt](#toc.xhtml#s65a)\n\nFor installing TensorFlow\
    \ 2 from the Anaconda command prompt, perform the following steps:\n\n1.  Open\
    \ Anaconda command prompt: \n\n    ![](images/Figure-5.13.jpg)\n\n    **Figure\
    \ 5.13:** Anaconda command prompt\n\n2.  Create a new environment named `BPBDemo2`\
    \ using the command: \n\n    `Conda create –name BPBDemo2 python=3.6`\n\n    You\
    \ can use a newer version of Python, for example, 3.8:\n\n    ![](images/Figure-5.14.jpg)\n\
    \n    **Figure 5.14:** Creating an environment named BPBDemo2\n\n3.  Now, the\
    \ following result will be displayed: \n\n    ![](images/Figure-5.15.jpg)\n\n\
    \    **Figure 5.15:** Steps to show (a) Conda create (b) Installed packages\n\n\
    4.  `y` should be entered to proceed. To activate/deactivate the environment,\
    \ steps are shown in the following figure: \n\n    ![](images/Figure-5.16.jpg)\n\
    \n    **Figure 5.16:** Activating/deactivating the new environment\n\n5.  To install\
    \ TensorFlow, use the command `pip install tensorFlow`: \n\n    ![](images/Figure-5.17.jpg)\n\
    \n    **Figure 5.17:** Installing TensorFlow: (a) pip install TensorFlow and (b)\
    \ downloading TensorFlow\n\n6.  Install Jupyter notebook using the command: \n\
    \n    `pip install notebook`\n\n    ![](images/Figure-5.18.jpg)\n\n    **Figure\
    \ 5.18:** Installing Jupyter notebook\n\n7.  Launch Notebook and check for successful\
    \ installation: \n\n    ![](images/Figure-5.19.jpg)\n\n    **Figure 5.19:** Successful\
    \ installation of TensorFlow\n\n# [Google Colab](#toc.xhtml#s66a)\n\nIn case you\
    \ have trouble installing TensorFlow2 locally, you can always use the Google Colab\
    \ as shown here:\n\n![](images/Figure-5.20.jpg)\n\n**Figure 5.20:** Google Colab\n\
    \nBy default, TensorFlow 2.x is imported.\n\n# [What is new in TensorFlow 2?](#toc.xhtml#s67a)\n\
    \nGoogle made major changes in the new release; a lot of it is behind the scenes,\
    \ like improving the performance and cleaning up the API's. In addition, there\
    \ are a few changes that impact the way we write code, and these are listed below\
    \ and will be demonstrated with code examples.\n\n**Eager execution**: TensorFlow\
    \ 1.x worked in lazy execution mode by default. In the later versions, it was\
    \ possible to explicitly turn the eager execution on, but in earlier versions,\
    \ even that was not possible. This made learning TensorFlow not very intuitive.\
    \ It was a two-step process; you create the computation graph and executed the\
    \ graph in a session. The code does not look like a regular Python code.\n\nTensorFlow2\
    \ works in Eager execution mode. This makes learning TensorFlow much easier. The\
    \ code looks like a regular Python code. Let us check how to write the `Hello\
    \ World` program.\n\n*[Figure 5.21](#c05.xhtml#fig5_21)* represents the code for\
    \ printing `Hello World` in TensorFlow2:\n\n![](images/Figure-5.21.jpg)\n\n**Figure\
    \ 5.21:** Code to print \"Hello World\" in TensorFlow2\n\nRecall the Hello World\
    \ program that we wrote in TensorFlow 1.x. It was much more complicated due to\
    \ the creation of the session and execution of the graph in the session:\n\n`@tf.function\
    \ decorator`\n\nThere was a reason why computational graphs were introduced in\
    \ the first place in TensorFlow1. It was to improve distributed computing, and\
    \ thereby performance.\n\nSo now, with eager execution, does it mean we can make\
    \ use of the graph technique? No, we can still make use of the graph technique\
    \ when there is computationally intensive code like training a multilayer neural\
    \ network. However, there are no more sessions. In TensorFlow2, we use Functions\
    \ instead of sessions.\n\nHere is a comparison:\n\n`# TensorFlow 1.X`\n\n`outputs\
    \ = session.run(f(placeholder), feed_dict={placeholder: input})`\n\n`# TensorFlow\
    \ 2.0`\n\n`outputs = f(input)`\n\nThere are two by-products as a result of this:\n\
    \n1.  There are no placeholders anymore\n\n2.  You do not have to initialize the\
    \ variables\n\nThe second point is a big relief to many of us because while learning\
    \ TensorFlow1, this was a very common mistake we used to make—not initializing\
    \ the variables and then get errors while executing the graph in the session.\n\
    \nThe good news is, we can still get the performance of graph execution by using\
    \ the `tf.function()` decorator.\n\nHere is a code example for the usage of this\
    \ decorator:\n\n![](images/Figure-5.22.jpg)\n\n**Figure 5.22:** Using the tf.function()\
    \ decorator\n\nIn general, however, we will not be using a lot of this syntax\
    \ because for all the multilayer Neural Network training, it is advisable to use\
    \ Keras, which is even more tightly integrated with TensorFlow2, and Keras takes\
    \ care of this behind the scenes.\n\n# [Kera API](#toc.xhtml#s68a)\n\nKeras is\
    \ a higher-level API that helps in developing neural network models much faster\
    \ and thereby reducing the development time in projects. Keras is available with\
    \ TensorFlow1 as well, but it has been much more tightly integrated and built\
    \ into TensorFlow2.\n\nOne of the most common and popular functions of Keras is\
    \ the sequential model. Using sequential model, it is very easy to create complicated\
    \ multilayer neural networks, including some advanced types like **Convolutional\
    \ Neural Networks (CNN)**, which we will see in the upcoming chapter.\n\nLet us\
    \ start with the very simple MNIST example and create a classifier with a single\
    \ hidden layer as we did in the previous chapter, but this time using Keras. As\
    \ always, the first step is to import the TensorFlow library. MNIST is available\
    \ as a part of Keras package; we load the MNIST data set:\n\n![](images/Figure-5.23.jpg)\n\
    \n**Figure 5.23:** Loading MNIST data set\n\nNext, we separate the training and\
    \ test data sets using the inbuild function `load_data()`. This function returns\
    \ two tuples, one each for training and test data:\n\n![](images/Figure-5.24.jpg)\n\
    \n**Figure 5.24:** Use of load\\_data()"
