    我们将从导入 TensorFlow 以及其他必要的库和包开始。你可能已经熟悉其中的一些内容，这些我们在之前的章节中用过。有些包是新的，例如 `Conv2D`
    和 `Maxpooling2D`，它们被用于创建卷积层和最大池化层：


    ![](img/Figure-6.15.jpg)


    **图 6.15:** 导入所需的库


    之后，我们导入并准备数据。这部分没有新内容，因为我们在上一个章节已经做过这些：


    ![](img/Figure-6.16.jpg)


    **图 6.16:** 加载 MNIST 数据


    ### 使用 Keras 创建模型

    下一步是创建我们的卷积神经网络（CNN）。这包含两个部分：一部分是卷积基，由一系列卷积层和池化层组成；后面是几个全连接层（dense layers）。最后，我们以
    Softmax 层结束：


    ![](img/Figure-6.17.jpg)


    **图 6.17:** 模型创建


    Keras 提供了一种简单方便的方法，使用 `Sequential` 类以及其他关联类（如 `Conv2D` 和 `MaxPooling2D`）来创建 CNN
    模型。让我们逐行查看这些代码：


    ![](img/Figure-6.18.jpg)


    **图 6.18:** 创建 sequential 实例


    我们创建了 `Sequential` 类的实例并命名为 "`model`”。正如类名 `Sequential` 所暗示的，我们可以通过调用 `add` 方法（`model.add`）按顺序将层添加到到模型中。第一层是卷积层：


    ![](img/Figure-6.19.jpg)


    **图 6.19:** 添加卷积层


    让我们尝试理解 `Conv2D` 类的各种参数。数字 32 表示过滤器（filters）或卷积核（kernels）的数量——回想之前描述的卷积层。虽然发现对于
    MNIST 数据集，32 个滤波器的效果非常好，但你可以尝试调整这个数字，看看准确率会发生变化。


    下一个参数 `(3,3)` 是滤波器的尺寸。下一个参数 `input_shape` 只需要为第一个隐藏层提供。该参数的值是图像的形状。对于由 28 × 28
    像素图像组成的 MNIST 数据集，我们只取灰度图，因此我们只需要一个通道。这导致了输入形状为 `(28, 28, 1)`。


    此信息只需要作为参数提供给神经网络的第一层。随后的每一层都将接收上一层的输出，因此我们不需要提供任何输入形状。


    最后一个参数是激活函数，它始终是 `ReLU`：


    ![](img/Figure-6.20.jpg)


    **图 6.20:** 添加最大池化层


    继续看下一行代码，在这里我们添加下一层，它是一个池化层。在这种情况下，我们使用 `MaxPooling`，滤波器的尺寸为 2 × 2，并作为参数提供。又添加了两个此类卷积层和最大池化层。


    接下来，我们添加全连接层和 Softmax 层：


    ![](img/Figure-6.21.jpg)


    **图 6.21:** 添加全连接层


    请注意，卷积层可以接受多维输入，但全连接层需要单维输入。然而，卷积层和最大池化层的输出是矩阵形式（二维）的。`Flatten()` 函数将上一个最大池化层的输出重塑为一维数组：


    ![](img/Figure-6.22.jpg)


    **图 6.22:** 添加 flatten


    这行代码看起来像添加了新层神经元，但实际上，这只是在重塑张量。这就是 Keras 的强大和方便之处。随着我们的进行，我们将看到更多类似的例子。下一行代码是添加一个具有
    64 个神经元的 `Dense` 层或全连接层，每个神经元都有 `ReLU` 激活函数：


    ![](img/Figure-6.23.jpg)


    **图 6.23:** 第一层全连接层


    最后，我们添加分类层或 Softmax 层。由于 MNIST 数据有 10 个类，我们需要 10 个神经元，并将它们全部连接到单个 Softmax 激活函数：


    ![](img/Figure-6.24.jpg)


    **图 6.24:** Softmax 层


    多层 CNN 模型的创建完成完成。在训练模型之前，我们必须编译它：


    ![](img/Figure-6.25.jpg)


    **图 6.25:** 编译


    我们使用 `adam` 优化器和损失函数 `sparse_categorical_crossentropy`。`metrics` 参数一如既往被设置为 `accuracy`。需要注意的是，当我们直接在
    TensorFlow 中不使用 Keras 创建模型时，使用的损失函数是 `categorical_crossentropy`。这是因为 TensorFlow
    和 Keras 中存储 MNIST 数据标签的方式存在差异。


    在 Keras 中，MNIST 标签以独独热编码（one-hot encoded）格式存储，如下所示：


    ![](img/Figure-6.26.jpg)


    **图 6.26:** 标签


    现在我们的模型已经准备就绪，我们可以借助 `summary` 函数查看它的各种参数。该函数显示模型的摘要，展示了每层中可训练参数和不可训练参数的数量：


    ![](img/Figure-6.27.jpg)


    **图 6.27:** 神经网络摘要


