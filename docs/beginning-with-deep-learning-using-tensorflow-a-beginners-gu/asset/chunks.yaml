    # What is new in TensorFlow 2?


    Keras is a higher-level API that helps in developing neural network models much
    faster and thereby reducing the development time in projects. Keras is available
    with TensorFlow1 as well, but it has been much more tightly integrated and built
    into TensorFlow2.


    One of the most common and popular functions of Keras is the sequential model.
    Using sequential model, it is very easy to create complicated multilayer neural
    networks, including some advanced types like **Convolutional Neural Networks (CNN)**,
    which we will see in the upcoming chapter.


    Let us start with the very simple MNIST example and create a classifier with a
    single hidden layer as we did in the previous chapter, but this time using Keras.
    As always, the first step is to import the TensorFlow library. MNIST is available
    as a part of Keras package; we load the MNIST data set:

