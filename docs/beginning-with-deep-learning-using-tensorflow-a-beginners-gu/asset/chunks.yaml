    # [CHAPTER 1](#toc.xhtml#c01)


    # [Introduction to Artificial Intelligence](#toc.xhtml#c01)


    In this first chapter, we will introduce artificial intelligence, deep learning,
    and TensorFlow. Although, it is expected that the people buying this book already
    have this knowledge and experience, it is a good way to lay the ground for a smooth
    transition in the upcoming chapters. This also helps in making sure the reader
    and the author are on the same page, especially with respect to terminology and
    method of coding and so on.


    # [Structure](#toc.xhtml#s1a)


    This chapter will cover the following topics:


    *   Brief history of AI


    *   Why now?


    *   Applications of AI


    *   Industry examples of AI applications


    # [Objective](#toc.xhtml#s2a)


    At the end of this chapter, you will be able to learn about artificial intelligence
    and its applications in various industries. You will get an understanding of the
    evolution of AI and the relation between **artificial intelligence** (**AI**),
    **machine learning** (**ML**), and **deep learning** (**DL**).


    # [Brief history of artificial intelligence](#toc.xhtml#s3a)


    Today, we are on the verge of a huge technological revolution. Before we talk
    about AI, let us take a look at the multitude of emerging technologies (*[Figure
    1.1](#c01.xhtml#fig1_1)*). The convergence of these technologies along with AI
    will completely change the world in the next few decades.


    ![](images/Figure-1.1.jpg)


    **Figure 1.1:** Emerging technologies


    According to leading analysts, the following technologies will mature over the
    next 5–10 years:


    *   5G


    *   BlockChain


    *   3D printing


    *   IoT


    These technologies, along with AI, are bound to have an immense impact on humankind.
    The way we work, live, and fight! Yes, Warfare will also be completely different
    and unimaginable. AI will, of course, play the biggest role in all of it.


    So, what is AI, and how is it going to change our life. AI is the intelligence
    demonstrated by machines. A formal definition of AI as per Wikipedia:


    *In computer science, AI, sometimes called machine intelligence, is intelligence
    demonstrated by machines, in contrast to the natural intelligence displayed by
    humans.*


    Like it or not, AI is already here, although at a very basic level. We are all
    using AI, knowingly or unknowingly. Here are some examples as follows:


    *   Chatbots


    *   Robots


    *   Smart speakers (Alexa)


    *   Virtual assistants


    *   Recommendation engines


    *   Drones


    *   Self-driving cars or autonomous vehicles.


    ![](images/Figure-1.2.jpg)


    **Figure 1.2:** AI is here (**Source:** Google)


    For all the buzz around AI over the past few years, this is not a new concept.
    The term Artificial Intelligence was first coined by *Prof. John McCarthy* at
    a conference at Dartmouth College in 1956.


    And even before that, there was a semblance of a humanoid robot in Greek Mythology.
    *Talos* was a giant automaton made of bronze to protect the mythological character
    Europa – after whom Europe was named. Talos circled the island''s shores thrice
    daily to protect Europa from pirates and invaders.


    And then, there was the *Turing* test developed by *Alan Turing* in 1950.


    According to Wikipedia, “*Turing Test is a test of a machine''s ability to exhibit
    intelligent behavior equivalent to, or indistinguishable from, that of a human*.”


    This is a test of model Natural Language Processing as this considers just conversations
    and in text-only mode.


    In 1966, *Joseph Weizenbaum*, a professor at MIT, created a program called ELIZA,
    which can be considered to be the first Chatbot. ELIZA appeared to pass the Turing
    test. The program worked by identifying keywords. If a keyword is found, a rule
    that transforms the user''s comments is applied, and the resulting sentence is
    returned.


    A few years later in 1972, another program named *Parry* was created by *Kenneth
    Colby* – a pioneer in cognitive functions. It was like an enhanced version of
    ELIZA. It could simulate a paranoid schizophrenic.


    Back to the Dartmouth conference, there was a lot of excitement after the conference,
    and the USA government even granted funds to conduct research on AI, but it could
    not take off. After a couple of years of research, the project was put on the
    back burner – this is referred to as the winter of AI.


    One of the reasons was the lack of computing power. Subsequently, the interest
    in AI was renewed in the 90s. With the advent of cloud computing and cheap hardware,
    the availability of computing power tremendously increased. In addition to that,
    the availability of a large amount of data and the ability to handle large amounts
    of data with technologies like Hadoop has further strengthened AI research. It
    is like all the pieces of the puzzle falling in place.


    One of the highly publicized events of the resurrection of AI was IBM Watson.
    In 2011, IBM Watson was pitted against the reigning human champions of the game
    show called Jeopardy, and it won. However, the term AI has not yet regained the
    popularity as it has today, and hence, Watson was just called a supercomputer.
    But the Natural Language Processing technique that was used is a significant component
    of Artificial Intelligence. And today, Watson is, of course, called AI.


    It has to be noted that it was not the first time that such an event has occurred
    where a machine beat a human being. Way back in 1997, a supercomputer named Deep
    Blue defeated the reigning world champion of Chess – Gary Kasparov. And Deep Blue
    was also developed by IBM.'
