    如你所见，这就是为什么权重的数量与输入的数量相等。这就是我们将使用矩阵乘法的地方。我们在进入代码演示时会看到。


    由于所有变量都是数字，`Net Input Function` 的结果仅仅是一个数字，一个实数。


    # 激活函数 (G)


    网络输入函数的输出将作为激活函数的输入。而激活函数的输出是神经元的最终输出。激活函数提供了非线性。目前有多种激活函数可用，但我们将从最古老的函数开始，即所谓的
    `Sigmoid 激活函数`，它提供二进制输出，从而使得感知机的行为类似于具有二值化状态（开启或关闭）的生物神经元。


    sigmoid 函数的数学方程为：


    ![](img/Figure-4.4.jpg)


    **图 4.4:** Sigmoid 曲线


    如 `[图 4.4]` 所示，无论输入是什么，sigmoid 函数的输出始终在 0 和 1 之间。如果我们设置一个阈值（例如，`0.5`），我们就可以将其转换为二进制输出。任何大于或等于
    `0.5` 的输出被视为 1，任何小于 `0.5` 的值被视为 0。


    因此，使用 sigmoid 激活函数时，感知机的最终输出是 0 或 1，就像生物神经元一样。这只是感知机的结构。在我们继续理解感知机训练如何工作之前，让我们在代码中实现它。


    在编写代码之前，我们需要冻结设计参数。我们将使用以下设计参数在 TensorFlow 中实现我们的第一个神经网络：


    - 层数 = 1

    - 神经元数（单元） = 1

    - 特征数（输入） = 2 (`X[1]`, `X[2]`)

    - 激活函数 = sigmoid

    - 标签 = `Y`


    代码如下：


    ![](img/Figure-4.5.jpg)


    **图 4.5:** 特征占位符


    我们首先为特征创建一个占位符。占位符声明中的 `tf.float32` 函数表示占位符的数据类型为 `float32`。让我们仔细查看参数值 `[None,2]`，因为到目前为止我们从未遇到过这种格式。


    通常，在创建/声明占位符时，我们可以结合数据类型指定占位符的形状。在这种情况下，参数值 `[None,2]` 表示占位符是一个具有两列的二维数组（或矩阵），但行数是未知的。`None`
    表示我们不知道占位符中有多少行，这将在运行时决定。


    这是占位符的一个非常强大的功能，我们将在感知机训练部分看到它是如何使用的。我们定义了 2 列是因为根据我们的设计，有 2 个特征 (`X[1]`, `X[2]`)。如果数据有
    10 个特征，那么占位符就需要 10 列，形状将被给出 `[None,10]`；或者如果有 100 个特征，则形状需要为 `[None,100]`。


    需要注意的是，在开始之前，我们需要冻结设计参数。我们将使用以下设计参数在 TensorFlow 中实现我们的第一个神经网络：


    - 层数 = 1

    - 神经元数（单元） = 1

    - 特征数（输入） = 2 (`X[1]`, `X[2]`)

    - 激活函数 = sigmoid

    - 标签 = `Y`


    代码如下：


    ```

    ![](img/Figure-4.5.jpg)

    ```

