    an error if you do not close the session, it can cause problems if you run several
    Jupyter notebooks in parallel. Every time a session is created, certain resources
    are assigned to it. And when you close the session, these resources are released.


    One way of avoiding this is to create and use the session in a `with` block. This
    is a more professional way of writing the code. Here is the `Hello World` code
    using a `with` block:


    ![](images/Figure-3.40.jpg)


    **Figure 3.40:** Code to Print “Hello world” using “with”


    The session is created in the with block and is valid within the with block. The
    moment we exit the with block, the session gets automatically closes. So, we do
    not have to perform an explicit session close.


    Hopefully, by now, you get a good hang of how the TensorFlow program is written
    and executed. Before we move forward, let us take another real-world example.
    In this example, we will implement the equation of motion:


    *s=u\*t+(1/2)\*a\*t\*\*2*


    We will do this for *u=50* m/s, *a=40* m/s\*\*2, and *t* needs to be requested
    from the end-user at runtime.


    This is how we create the computational graph and prepare the data:


    ![](images/Figure-3.41.jpg)


    **Figure 3.41:** Creating computational graph and preparing data


    And then execute the graph in a session in the “`with`” block:


    ![](images/Figure-3.42.jpg)


    **Figure 3.42:** Executing the graph


    Note that *u* and *a* are created as constants and not variables or placeholders
    as their values do not change in this case.


    Let us now see how we use TensorFlow to perform some Linear Algebra in the next
    section.


    # [Linear algebra with TensorFlow](#toc.xhtml#s38a)


    The most important linear algebra function that will be used in Neural Networks
    is matrix multiplication. In this section, we will first explain how matrix multiplication
    works and then use TensorFlow''s built-in functions to solve some matrix multiplication
    examples. This is essential in preparation for Neural Networks in the upcoming
    chapter.


    How does matrix multiplication work? You might have studied this as a part of
    your high school but let us do a quick recap.


    Let us take a simple example. If we have to perform a matrix multiplication between
    two matrices A and B where,


    ![](images/p93.jpg)


    The first step is to check whether this is possible. There is a pre-requisite
    for matrix multiplication. Remember this as C=R; that is, the number of columns
    (C) in the first matrix should be equal to the number of rows (R) in the second
    matrix.


    And remember, the sequence matters here. A×B is not equal to B×A.


    In this particular example, C =3 and R=3. So, multiplication is possible.


    The resultant matrix would have the number of rows equal to that in A and the
    number of columns equal to that in B.


    So, in this case, the resultant matrix would be 2×2. You take the elements of
    the first row of A and the elements of the first column of B:


    ![](images/p93a.jpg)


    Get the sum of the element-wise products, i.e., (1×7)+(2×9)+(3×11) = 58.


    This will be the first element in the 2×2 resultant matrix:


    ![](images/p94.jpg)


    Repeat this with the first row of A and second column of B:


    AR[1] = \[1 2 3\]


    BC[2] =


    ![](images/p94a.jpg)


    Get the sum of the products of the corresponding elements, that is, (1×8)+(2×10)+(3×12)
    = 64


    This will be the second element in the resultant matrix:


    ![](images/p94b.jpg)


    Repeat the same with the second row to get the final result:


    ![](images/p94c.jpg)


    TensorFlow offers a method named `matmul` to perform matrix multiplication. Let
    us write the code to execute the preceding example in TensorFlow:


    ![](images/Figure-3.43.jpg)


    **Figure 3.43:** Initializing matrices as values


    Note how the matrices are created as variables. To make sure they are created
    correctly, we will execute each of the nodes `X` and `Y` in a session so that
    they can be printed and visualized:


    ![](images/Figure-3.44.jpg)


    **Figure 3.44:** To print matrices


    We see that the matrices are created correctly. We perform matrix multiplication
    by calling the method `matmul()` and passing `A` and `B` as parameters:


    ![](images/Figure-3.45.jpg)


    **Figure 3.45:** A×B matrix using matmul ()


    We can perform B×A and see that the results are different:


    ![](images/Figure-3.46.jpg)


    **Figure 3.46:** Matrix B×A using matmul ()


    While we are at it, let us try out a few other tensor-related functionalities
    offered by TensorFlow, like shape and reshape. In order to find the shape of a
    tensor, we call the shape attribute of the tensor like this:


    ![](images/Figure-3.47.jpg)


    **Figure 3.47:** Shape of matrices


    TensorFlow offers a way to change the shape of a tensor, which will rearrange
    the elements of a given tensor into a different configuration. This is known as
    **reshape**. And it is frequently used in Neural Networks, so it is a good idea
    to understand it right now. Let''s take an example and create a few tensors and
    try to reshape them:


    ![](images/Figure-3.48.jpg)


    **Figure 3.48:** Creating tensors


    Observer that `x` has a shape of `[8]` and is a one-dimensional array. Although
    *y* is a 2×3 matrix. We can reshape `x` to either a 2×4 matrix or a 4×2 matrix
    as follows:


    ![](images/Figure-3.49.jpg)


    **Figure 3.49:** Presenting matrix using reshape()


    Note the following:


    *   The number of elements cannot be changed. So, the new configuration should
    be compatible. For example, we cannot reshape *x* to 3×4 or 3×5 since the total
    elements in these cases would be 12 and 15, respectively.


    *   The sequence of the elements remains unchanged.


    *   The elements are rearranged in the new configuration.


    Let us reshape `y`:


    ![](images/Figure-3.50.jpg)


    **Figure 3.50:** To reshape y


    The other two possibilities are 1×6 and 6×1:


    ![](images/Figure-3.51.jpg)


    **Figure 3.51:** reshape


    These were matrices. You can also reshape it to a single dimension array like
    this:


    ![](images/Figure-3.52.jpg)


    **Figure 3.52:** Reshaping a single-dimension array


    It should be noted that the original shape of *x* and *y* are not modified in
    these cases:


    ![](images/Figure-3.53.jpg)


    **Figure 3.53:** No change in the original shape of x and y


    In case you want to save the new shape, you have to reassign the new values:


    ![](images/Figure-3.54.jpg)


    **Figure 3.54:** Reassigning the values


    Before we move on, one more important function that will be used in Neural Networks
    is the `argmax()`. This method gives the index value of the maximum value in a
    tensor. Let us see how this works with an example:


    ![](images/Figure-3.55.jpg)


    **Figure 3.55:** To get index value using argmax()


    The `argmax` takes the tensor as the first parameter and the second parameter
    is the axis value which is defaulted to 0 if not provided.


    And the index value that it returns starts from 0. So, in the preceding example,
    `argmax` of `x` resulted in a value of 1 since the second position has the highest
    value, which is 50.


    It is re-emphasized that argmax returns the index/position of the maximum value
    and not the maximum value itself (which is 50 in this case), and the index starts
    from 0.


    Let us take one more example:


    ![](images/Figure-3.56.jpg)


    **Figure 3.56:** argmax


    In this case, argmax returns two values, one for each column. And it must be noted
    that if there are multiple positions where the maximum value is present, it returns
    the position of the first occurrence.


    If you need row-wise values, you need to pass `axis=1`:


    ![](images/Figure-3.57.jpg)


    **Figure 3.57:** To display row-wise values


    In this case, it returns three values, one for each row. And this can be extended
    to multidimensional arrays.


    In the next section, we will introduce the concept of an optimizer which is very
    important in implementing and training Neural Networks.


