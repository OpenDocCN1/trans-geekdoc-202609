    # [CHAPTER 6](#toc.xhtml#c06)


    # [Image Recognition](#toc.xhtml#c06)


    # [Introduction](#toc.xhtml#s72a)


    Image recognition and speech recognition are the two main sub-domains within artificial
    intelligence and deep learning today. In this chapter, we will see how image recognition
    works and what are some of its applications. Image recognition is also considered
    as a part of the broader domain of computer vision which is the technique used
    by my machines to simulate human vision. For example, robots use computer vision
    with the help of cameras to detect obstacles in their path or identify objects.
    Similarly, self-driving cars use computer vision and image recognition to detect
    obstacles in their path, identify lane markings and check for traffic lights.
    Computer vision has existed for a very long time. What is new is the application
    of neural networks. In this chapter, we will explore how a particular type of
    neural network called **Convolutional Neural Networks** (**CNN**) is used for
    image recognition.


    # [Structure](#toc.xhtml#s73a)


    In this chapter, the following topics will be covered:


    *   Introduction to CNN


    *   CNN architecture


    *   Pre-trained CNN models


    *   Building CNN models with Keras and TensorFlow


    *   Image classification with CNN


    *   Code demos and examples


    # [Objective](#toc.xhtml#s74a)


    After reading this chapter, you will be able to understand what Convolutional
    Neural Networks (CNN) is and how they work. You will be able to use CNN''s for
    image classification. In addition, you will learn about the concept of transfer
    learning and object detection.


    # [Introducing Convolutional Neural Networks (CNN)](#toc.xhtml#s75a)


    We have already seen how neural networks are modeled around the human brain. Dense
    Neural Networks, which are the most common form of neural networks, consist of
    an input layer, one or more hidden layers, and an output layer:


    ![](images/Figure-6.1.jpg)


    **Figure 6.1:** Dense Neural Network


    Although dense Neural Networks are extremely useful, they are still not the most
    preferred method for solving problems related to image recognition. This is where
    the concept of Convolutional Neural Networks comes in. In Convolutional Neural
    Networks, all the outputs of all the nodes are not interconnected. Only a portion
    of the outputs is connected to some of the inputs of the succeeding layer. This
    is how Convolutional Neural Networks differ from a normal fully connected or dense
    Neural Network.


    Convolutional Neural Networks are predominantly used for image recognition. The
    common architecture of these neural networks consists of a few convolutional layers
    and a few pooling layers. Typically, a pooling layer follows a convolutional layer,
    and there are multiple such pairs, and toward the end, there is one or more than
    one dense layer, followed by what is known as a classification layer.


    There are quite a few pre-trained CNN models that are readily available for us
    to use in developing applications. These models include:


    *   LeNet


    *   AlexNet


    *   ZFNet


    *   GoogleNet


    *   VGGNet


    *   ResNet


    All of these models are open-sourced, which means that anybody can use them to
    develop various applications. Training a Convolutional Neural Network requires
    a lot of computational power, and thus, if we want to develop an image recognition
    application, we will need to use some of these pre-trained networks and develop
    our applications. However, if we have to train our models for something very specific,
    then we would need to create our own Convolutional Neural Network and train it.
    We will see how to do this with the help of some examples.


    First, we need to know how a CNN works. As mentioned earlier, a CNN has multiple
    layers. So, when it takes an image, each layer of the network identifies some
    features in that image. It starts with very low-level features such as edges,
    curves, vertical lines, horizontal lines, slanting lines, and so on. After this,
    the subsequent layers start identifying higher-level features.


    Let us consider a simple example. Suppose we are working with the image of a dog;
    the convolutional neural network will first identify higher-level features like
    the eyes, ears, mouth, paws, and so on, along with the relative positions of these
    features. After this, the last few layers will identify the complete object. In
    this way, the Convolutional Neural Network recognizes the image of the dog.


    There are multiple variations of the CNN architecture, but by and large, they
    all follow a certain pattern. There are two sections; there is a convolution block
    followed by the fully connected block:


    ![](images/Figure-6.2.jpg)


    **Figure 6.2:** CNN structure


    Let us have a look at the structure of the LeNet model, which was used for the
    MNIST data set. This Convolutional Neural Network consists of two convolutional
    layers, followed by two pooling layers, which together form the feature extraction
    section. Toward the end, it consists of one fully connected layer, followed by
    a classification layer (or Softmax layer), which together form the classification
    section. The Softmax layer has 10 neurons as this is a 10-class classification
    problem:


    ![](images/Figure-6.3.jpg)


    **Figure 6.3:** LeNet architecture


    Let us understand in detail the convolution and pooling layers with a small specific
    example.


