- raw: "There is no hard and fast rule about the number of neurons in each of the\
    \ layers. This is usually determined by trial and error as a part of a process\
    \ known as Hyper-Parameter tuning. However, there are some restrictions on the\
    \ number of neurons in the last layer. The configuration of the last layer is\
    \ determined as follows:\n\n| **Binary classification** || **Multiclass classification**\
    \ |\n\n| --- | --- |\n\n| No. of Neurons = 1Activation function—Sigmoid || No.\
    \ of Neurons = number of classesActivation function—Softmax |\n\n**Table 4.3:**\
    \ Last layer configuration\n\nNow let us get into the code. First, we will build\
    \ a binary classifier with the same data we used to build our single perceptron.\
    \ Then we will use the MNIST data set to extend the single layer 10 neuron network\
    \ to a multilayer network.\n\n# [Multilayer binary classifier](#toc.xhtml#s55a)\n\
    \nWe will build a Binary classifier with a deep neural network of the following\
    \ configuration:\n\n![](images/Figure-4.79.jpg)\n\n**Figure 4.79:** Multilayer\
    \ neural network\n\nThe code is as follows:\n\n![](images/Figure-4.80.jpg)\n\n\
    **Figure 4.80:** Load data\n\nThis part of the code for loading and preparing\
    \ the data remains the same:\n\n![](images/Figure-4.81.jpg)\n\n**Figure 4.81:**\
    \ Placeholders\n\nThe creation of placeholders also remains the same:\n\n![](images/Figure-4.82.jpg)\n\
    \n**Figure 4.82:** First layer of neurons\n\nWe start by creating the first hidden\
    \ layer. The weight variable has the shape \\[2,50\\] since there are 2 inputs\
    \ and 50 neurons. And the bias variable has shape \\[50\\] since this layer has\
    \ 50 neurons. The output of this layer is the output of the activation function.\
    \ Observe that the activation function used here is `relu` and not sigmoid. We\
    \ will discuss about this new kind of activation function a little later:\n\n\
    ![](images/Figure-4.83.jpg)\n\n**Figure 4.83:** Second layer\n\nThen we add the\
    \ second layer. We define a new set of variables for weights and bias. The shape\
    \ of the weight variable (weight1) is \\[50,20\\] since this layer receives 50\
    \ inputs from each of the 50 neurons in the previous layer, and this layer has\
    \ 20 neurons. The bias variable has shape \\[20\\] since there are 20 neurons.\
    \ Let us take a closer look at the net-input function for this layer.\n\n`netinput2=tf.add(tf.matmul(output1,weight2),bias2)`\n\
    \nThe input here is the output from the previous layer (`output1`) and not `x`.\n\
    \nYou will see this pattern in the next layer as well. The input for the next\
    \ layer will be `output2`:\n\n![](images/Figure-4.84.jpg)\n\n**Figure 4.84:**\
    \ The third layer\n\nThe third layer is the last layer. Since it is a binary classifier,\
    \ it has only one neuron. It receives 20 inputs coming from each of the 20 neurons\
    \ in the previous layer. The net-input function takes the output of layer 2 (`output2`)\
    \ as its input.\n\nHere we use the sigmoid activation function since we are expecting\
    \ a binary output. Refer to *table 5.13*. The construction of the network is done.\
    \ We just need to add the rest of the code for loss function and session:\n\n\
    ![](images/Figure-4.85.jpg)\n\n**Figure 4.85:** Code for loss function and session\n\
    \nWe run the training for 100 iterations:\n\n![](images/Figure-4.86.jpg)\n\n**Figure\
    \ 4.86:** Training model for 100 iterations\n\nOur model achieves 100% accuracy.\
    \ The complete code is available on the GitHub link. You can play around by adding\
    \ more layers and more neurons in each layer and see how the accuracy changes.\n\
    \n# [ReLu activation function](#toc.xhtml#s56a)\n\nBefore we go to the next demo\
    \ with MNIST, let us see what this activation function ReLu is all about. ReLu\
    \ is shortened form for rectified linear unit. The output of the ReLu function\
    \ is always a non-negative value, that is, greater than or equal to 0:\n\n![](images/Figure-4.87.jpg)\n\
    \n**Figure 4.87:** ReLu activation function\n\nMathematical expression for ReLu\
    \ is:\n\nThis converges much faster than the sigmoid activation function, and\
    \ therefore, it is by far the most widely used activation function. ReLu is used\
    \ in almost every deep neural network. It is used in all the layers except only\
    \ in the last layer, where either a Sigmoid or Softmax is used.\n\n# [Multilayer\
    \ multiclass neural network](#toc.xhtml#s57a)\n\nLet us now build a multilayer\
    \ neural network to solve the MNIST problem, which is a multiclass classification\
    \ problem with 10 classes. We can re-use and mix and match the code from the previous\
    \ example and the first MNIST example. This is the structure of the network that\
    \ we will build:\n\n![](images/Figure-4.88.jpg)\n\n**Figure 4.88:** Multilayer\
    \ multiclass\n\nHence, the code is given as follows:\n\n![](images/Figure-4.89.jpg)\n\
    \n**Figure 4.89:** Code for multilayer multiclass\n\nAll the five layers are created\
    \ like before. The last layer has a Softmax activation function. The main structure\
    \ is ready. Now we add the loss function and the session to run the training.\n\
    \n![](images/Figure-4.90.jpg)\n\n**Figure 4.90:** Adding loss function and session\
    \ to run the training\n\nAs you can see, this model offers an accuracy of almost\
    \ 97%:\n\nThis code is available on the GitHub link. Play around by increasing\
    \ the number of layers and the number of neurons in each layer. It will be interesting\
    \ for you to check what happens if you use the Sigmoid instead of ReLu activation\
    \ function.\n\n# [Conclusion](#toc.xhtml#s58a)\n\nIn this chapter, you learned\
    \ how neural networks work, starting from the basic element, which is a perceptron,\
    \ to multilayer deep neural networks. You have learned how to design and train\
    \ neural networks using TensorFlow and Keras.\n\nIn the upcoming chapter, you\
    \ will learn about TensorFlow 2, followed by an advanced type of neural network\
    \ called **Convolutional Neural Network (CNN)** and how it is used for image recognition\
    \ in the chapter.\n\n# [Questions](#toc.xhtml#s59a)\n\n1.  How is an artificial\
    \ neural network similar to the human brain?\n\n2.  What are the components of\
    \ an artificial neuron?\n\n3.  What is the difference between a shallow neural\
    \ network and deep neural network?\n\n4.  Name three activation functions.\n\n\
    5.  Which activation function is used in the last layer of a binary classifier?\n\
    \n# [CHAPTER 5](#toc.xhtml#c05)\n\n# [TensorFlow 2](#toc.xhtml#c05)\n\n# [Introduction](#toc.xhtml#s60a)\n\
    \nGoogle announced the major new release of TensorFlow 2 in early 2019 and made\
    \ the final release in October 2019. Although TensorFlow 1.x was very powerful\
    \ and became very popular, it had a very steep learning curve. Even experienced\
    \ Python programmers were finding it hard to learn and understand the programming\
    \ construct. The two-step process of creating the graph and then executing it\
    \ in a session was a bit confusing and difficult to understand. With TensorFlow\
    \ 2, the whole programming construct has been simplified, making it very easy\
    \ to learn.\n\nHowever, there is still a lot of code out there already written\
    \ in TF1.x, and hence, there is a demand for TF1.X developers. Therefore, in this\
    \ book, we started with TF1.x. In this chapter, we will introduce TF2.0. Since\
    \ by now you have a good understanding of how TF1.x works, learning TF2.0 will\
    \ be much easier.\n\n# [Structure](#toc.xhtml#s61a)\n\nIn this chapter, the following\
    \ topics will be covered:\n\n*   How to install TensorFlow 2?\n\n*   What is new\
    \ in TensorFlow 2?\n\n*   Eager execution\n\n*   @tf.function—decorator\n\n* \
    \  Keras API\n\n# [Objective](#toc.xhtml#s62a)\n\nAfter reading this chapter,\
    \ you will be able to install TensorFlow 2 and will understand the new features\
    \ of the newer version. This is important because the code in the subsequent chapters\
    \ is based on TensorFlow 2.\n\n# [Installing TensorFlow 2](#toc.xhtml#s63a)\n\n\
    There are two ways you can locally install TensorFlow 2:\n\n*   Using the Anaconda\
    \ Navigator\n\n*   The Anaconda command prompt\n\n# [Using Anaconda Navigator](#toc.xhtml#s64a)\n\
    \nWe can install TensorFlow2 using the following steps:\n\n1.  Open Anaconda Navigator:\
    \ \n\n    ![](images/Figure-5.1.jpg)\n\n    **Figure 5.1:** Environment's page\n\
    \n2.  Click on `Create` as shown in *[figure 5.2](#c05.xhtml#fig5_2)*: \n\n  \
    \  ![](images/Figure-5.2.jpg)"
  fmt: "\nThere is no hard and fast rule about the number of neurons in each of the\
    \ layers. This is usually determined by trial and error as a part of a process\
    \ known as Hyper-Parameter tuning. However, there are some restrictions on the\
    \ number of neurons in the last layer. The configuration of the last layer is\
    \ determined as follows:\n\n| Binary classification | Multiclass classification\
    \ |\n| --- | --- |\n| No. of Neurons = 1, Activation function—Sigmoid | No. of\
    \ Neurons = number of classes, Activation function—Softmax |\n\n**Table 4.3:**\
    \ Last layer configuration\n\nNow let us get into the code. First, we will build\
    \ a binary classifier with the same data we used to build our single perceptron.\
    \ Then we will use the MNIST data set to extend the single layer 10 neuron network\
    \ to a multilayer network.\n\n# Multilayer binary classifier\n\nWe will build\
    \ a Binary classifier with a deep neural network of the following configuration:\n\
    \n![](images/Figure-4.79.jpg)\n\n**Figure 4.79:** Multilayer neural network\n\n\
    The code is as follows:\n\n![](images/Figure-4.80.jpg)\n\n**Figure 4.80:** Load\
    \ data\n\nThis part of the code for loading and preparing the data remains the\
    \ same:\n\n![](images/Figure-4.81.jpg)\n\n**Figure 4.81:** Placeholders\n\nThe\
    \ creation of placeholders also remains the same:\n\n![](images/Figure-4.82.jpg)\n\
    \n**Figure 4.82:** First layer of neurons\n\nWe start by creating the first hidden\
    \ layer. The weight variable has the shape `[2,50]` since there are 2 inputs and\
    \ 50 neurons. And the bias variable has shape `[50]` since this layer has 50 neurons.\
    \ The output of this layer is the output of the activation function. Observe that\
    \ the activation function used here is `relu` and not sigmoid. We will discuss\
    \ about this new kind of activation function a little later:\n\n![](images/Figure-4.83.jpg)\n\
    \n**Figure 4.83:** Second layer\n\nThen we add the second layer. We define a new\
    \ set of variables for weights and bias. The shape of the weight variable (`weight1`)\
    \ is `[50,20]` since this layer receives 50 inputs from each of the 50 neurons\
    \ in the previous layer, and this layer has 20 neurons. The bias variable has\
    \ shape `[20]` since there are 20 neurons. Let us take a closer look at the net-input\
    \ function for this layer.\n\n```\nnetinput2=tf.add(tf.matmul(output1,weight2),bias2)\n\
    ```\n\nThe input here is the output from the previous layer (`output1`) and not\
    \ `x`.\n\nYou will see this pattern in the next layer as well. The input for the\
    \ next layer will be `output2`:\n\n![](images/Figure-4.84.jpg)\n\n**Figure 4.84:**\
    \ The third layer\n\nThe third layer is the last layer. Since it is a binary classifier,\
    \ it has only one neuron. It receives 20 inputs coming from each of the 20 neurons\
    \ in the previous layer. The net-input function takes the output of layer 2 (`output2`)\
    \ as its input.\n\nHere we use the sigmoid activation function since we are expecting\
    \ a binary output. Refer to table 5.13. The construction of the network is done.\
    \ We just need to add the rest of the code for loss function and session:\n\n\
    ![](images/Figure-4.85.jpg)\n\n**Figure 4.85:** Code for loss function and session\n\
    \nWe run the training for 100 iterations:\n\n![](images/Figure-4.86.jpg)\n\n**Figure\
    \ 4.86:** Training model for 100 iterations\n\nOur model achieves 100% accuracy.\
    \ The complete code is available on the GitHub link. You can play around by adding\
    \ more layers and more neurons in each layer and see how the accuracy changes.\n\
    \n# ReLu activation function\n\nBefore we go to the next demo with MNIST, let\
    \ us see what this activation function ReLu is all about. ReLu is shortened form\
    \ for rectified linear unit. The output of the ReLu function is always a non-negative\
    \ value, that is, greater than or equal to 0:\n\n![](images/Figure-4.87.jpg)\n\
    \n**Figure 4.87:** ReLu activation function\n\nMathematical expression for ReLu\
    \ is:\n\nThis converges much faster than the sigmoid activation function, and\
    \ therefore, it is by far the most widely used activation function. ReLu is used\
    \ in almost every deep neural network. It is used in all the layers except only\
    \ in the last layer, where either a Sigmoid or Softmax is used.\n\n# Multilayer\
    \ multiclass neural network\n\nLet us now build a multilayer neural network to\
    \ solve the MNIST problem, which is a multiclass classification problem with 10\
    \ classes. We can re-use and mix and match the code from the previous example\
    \ and the first MNIST example. This is the structure of the network that we will\
    \ build:\n\n![](images/Figure-4.88.jpg)\n\n**Figure 4.88:** Multilayer multiclass\n\
    \nHence, the code is given as follows:\n\n![](images/Figure-4.89.jpg)\n\n**Figure\
    \ 4.89:** Code for multilayer multiclass\n\nAll the five layers are created like\
    \ before. The last layer has a Softmax activation function. The main structure\
    \ is ready. Now we add the loss function and the session to run the training.\n\
    \n![](images/Figure-4.90.jpg)\n\n**Figure 4.90:** Adding loss function and session\
    \ to run the training\n\nAs you can see, this model offers an accuracy of 97%:\n\
    \nThis code is available on the GitHub. Play around by increasing the number of\
    \ layers and the number of neurons in each layer.\n\n# CHAPTER 5: TensorFlow 2\n\
    \n## Introduction\n\nGoogle announced the major new release of TensorFlow 2 in\
    \ early 2019 and made the final release in October 2019. Although TensorFlow 1.x\
    \ was very powerful and became very popular, it had a very steep learning curve.\
    \ Even experienced Python programmers were finding it hard to learn and understand\
    \ the programming construct. The two-step process of creating the graph and then\
    \ executing it in a session was a bit confusing and difficult to understand. With\
    \ TensorFlow 2, the whole programming construct has been simplified, making it\
    \ very easy to learn.\n\nHowever, there is still a lot of code out there already\
    \ written in TF1.x, and hence, there is a demand for TF1X developers. Therefore,\
    \ in this book, we started with TF1.x. In this chapter, we will introduce TF2.0.\
    \ Since by now you have a good understanding of how TF1.x works, learning TF2.0\
    \ will be much easier.\n\n## Structure\n\nIn this chapter, the following topics\
    \ will be covered:\n\n*   How to install TensorFlow 2?\n*   What is new in TensorFlow\
    \ 2?\n\n*   Eager execution\n*   @tf.function—decorator\n*   Keras API\n\n## Objective\n\
    \nAfter reading this chapter, you will be able to install TensorFlow 2 and will\
    \ understand the new features of the newer version. This is important because\
    \ the code in the subsequent chapters is based on TensorFlow 2.\n\n## Installing\
    \ TensorFlow 2\n\nThere are two ways you can locally install TensorFlow 2:\n\n\
    *   Using the Anaconda Navigator\n*   The Anaconda command prompt\n\n## Using\
    \ Anaconda Navigator\n\nWe can install TensorFlow2 using the following steps:\n\
    \n1.  Open Anaconda Navigator:\n\n    ![](images/Figure-5.1.jpg)\n\n    **Figure\
    \ 5.1:** Environment's page\n\n2.  Click on `Create` as shown in figure 5.2:\n\
    \n    ![](images/Figure-5.2.jpg)\n"
