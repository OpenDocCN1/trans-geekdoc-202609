    Let us take a look at the labels:


    ![](images/Figure-5.25.jpg)


    **Figure 5.25:** Labels


    As you can see, the labels are integers between 0 and 9. We then normalize the
    data and keep it ready to be fed into the model:


    ![](images/Figure-5.26.jpg)


    **Figure 5.26:** Normalizing the data


    Building the model with Keras is very easy. We us the sequential model, which
    is extremely easy to understand and use. We start by creating an instance of the
    model and adding layers one-by-one using the `add` method:


    ![](images/Figure-5.27.jpg)


    **Figure 5.27:** Creating model using add()


    The second line of the previous code is not really a layer of neurons. The `Flatten`
    function reshapes the input into a one-dimensional tensor. This is needed because
    the hidden layer which will be added next can take only one-dimensional input.
    The out is an array of 784 elements (28\*28=784). This will go as input to the
    single hidden layer of 10 neurons:


    ![](images/Figure-5.28.jpg)


    **Figure 5.28:** Input to a hidden layer of 10 neurons


    In the preceding syntax, a layer of fully connected or dense neurons is added.
    The number of neurons in the layer is 10, and the activation function is Softmax.


    Next, we have to provide the details for training the network. For this Keras,
    provides a function call compile, where inputs like the type of optimizer, the
    loss function, and so on. are provided:


    ![](images/Figure-5.29.jpg)


    **Figure 5.29:** Use of compile function


    We selected the type of optimizer as `adam`, which is the most used optimizer
    in Keras. The loss function used here is `sparse_categorical_crossentropy`. The
    other loss function that can be used is `categorical_crossentropy`.


    It is important to note the difference between these two variants. Which one to
    use depends on the label information. If the labels are in a one-hot encoded format,
    then we use `categorical_crossentropy`. But if the labels are in regular numbers
    like in this case, we have to use `sparse_categorical_crossentropy`.


    The last parameter metrics are almost always set to the value `[''accuracy'']`.
    This tells how the results of the training should be displayed.


    There is very detailed documentation for each and every parameter available on
    the keras website **keras.io** – you can go through it if you are interested.
    Now that the model is ready before we start training, we can check the configuration
    of the model using the summary function:


    ![](images/Figure-5.30.jpg)


    **Figure 5.30:** Use of summary()


    As seen in *[figure 5.30](#c05.xhtml#fig5_30)*, the summary displays the configuration
    of the model and provides details of each layer, especially about what type of
    layer and how neurons in the layer and the number of trainable parameters—which
    is the sum of weights and biases. Since this is a very simple configuration, you
    can cross-check the number of parameters. There are 784 inputs for each neuron—which
    means there are 784 weights per neuron. Since there are 10 neurons, the total
    number of weights is 784\*10 = 7840.


    And each neuron has a single bias—so there are total 10 biases. That makes the
    total number of parameters = 7840+10= 7850. In more complex networks like CNN,
    which we will say later, there will be some parameters that are not trainable,
    and that is what is referred to as non-trainable parameters.


    Now, it is time to train our model. Unlike in the regular TensorFlow program,
    training a model in Keras is just a function call. The fit method trains the model
    with the training data. We need to provide some parameters like a number of epochs,
    and so on:


    ![](images/Figure-5.31.jpg)


    **Figure 5.31:** Use of fit()


    The `fit` function takes three parameters—training images, training labels, and
    the number of epochs. In this case, `x_train` has the training images, and `y_train`
    has the training labels. We set the number of epochs to 5. Results of each epoch
    are displayed in the output. Loss and accuracy are the important parameters here.
    As can be seen from the previous image, loss keeps decreasing with each epoch,
    and accuracy keep increasing. At the end of the fifth epoch, the training accuracy
    is 0.9256% or 92.56%.


    Let us now test the model with the test data. For this, Keras offers the function
    `evaluate`. This works very similarly to `fit`, but there are no epochs. Why?—I
    am sure you know the answer by now:


    ![](images/Figure-5.32.jpg)


    **Figure 5.32:** Use of evaluate()


    The "`evaluate`" takes two parameters—the test images and the corresponding labels.
    The test loss and accuracy are 0.1973% and 92.71%, respectively. As you can see,
    with just about 10 lines of code, we were able to build, train and test a model
    using Keras.


    Let us take a couple of more examples. What if we want to increase the accuracy
    further and hence want a multilayer neural network? With Keras, it is very easy
    to do this. Remember this configuration from the previous chapter.


    ![](images/Figure-5.33.jpg)


    **Figure 5.33:** Multilayer neural network


    Let us build this model and train and test it with Keras:


    ![](images/Figure-5.34.jpg)


    **Figure 5.34:** The first part of the code to build the model


    This is how the first part of the code looks. As you can see, just one line of
    code is required for adding each layer. We can check the summary of the model:


    ![](images/Figure-5.35.jpg)


    **Figure 5.35:** Summary of the model


    There are many more parameters in this model, and it may be an interesting exercise
    for you to calculate the number of parameters in each layer and compare them with
    the above. Now let us train and test this model:


    ![](images/Figure-5.36.jpg)


    **Figure 5.36:** Testing the model


    With three epochs, we get a training accuracy of 97.7% which is higher than the
    92.56% we got with the single layer.


    Time to test the model with the test data:


    ![](images/Figure-5.37.jpg)


    **Figure 5.37:** Testing the model with the test data


    Here again, the test accuracy is 97.61%, which is higher than the test accuracy
    of 92.71% we got with the single layer.


