    对于每一层中神经元的数量，并没有硬性的规定。这通常通过试错法来确定，作为“超参数调优（Hyper-Parameter tuning）”过程的一部分来实现。然而，对最后一层的神经元数量有一些限制。最后一层的配置确定如下：


    | 二分类 | 多类分类 |

    | --- | --- |

    | 神经元数量 = 1, 激活函数—Sigmoid | 神经元数量 = 类别数量，激活函数—Softmax |


    **表 4.3：** 最后一层配置


    现在让我们进入代码。首先，我们将使用与构建单层感知器相同的数据来构建一个二分类分类器。然后，我们将使用 MNIST 数据集将单层 10 神经元网络扩展为多层网络。


    # 多层二分类分类器


    我们将构建一个具有以下配置的深度神经网络二分类分类器：


    ![](img/Figure-4.79.jpg)


    **图 4.79：** 多层神经网络


    代码如下：


    ![](img/Figure-4.80.jpg)


    **图 4.80：** 加载数据


    这部分加载和准备数据的代码保持不变：


    ![](img/Figure-4.81.jpg)


    **图 4.81：** 占位符（Placeholders）


    占位符的创建也保持不变：


    ![](img/Figure-4.82.jpg)


    **图 4.82：** 第一层神经元


    我们首先创建第一个隐藏层。权重变量的形状为 `[2,50]`，因为有 2 个输入和 50 个神经元。偏置变量的形状为 `[50]`，因为该层有 50 个神经元。该层的输出是激活函数的输出。注意，这里使用的激活函数是
    `relu` 而不是 `sigmoid`。我们稍后会讨论这种新的激活函数：


    ![](img/Figure-4.83.jpg)


    **图 4.83：** 第二层


    然后我们添加第二层。我们为权重和偏置定义了一组新变量。权重变量（`weight1`）的形状为 `[50,20]`，因为该层接收来自上一层 50 个神经元中每一个神经元的
    50 个输入，且该层有 20 个神经元。偏置变量的形状为 `[20]`，因为有 20 个神经元。让我们仔细观察这一层的网络输入函数。


    ```

    netinput2=tf.add(tf.matmul(output1,weight2),bias2)

    ```


    这里的输入是来自上一层的输出（`output1`），而不是 `x`。


    你将在下一层也看到这种模式。下一层的输入将是 `output2`：


    ![](img/Figure-4.84.jpg)


    **图 4.84：** 第三层


    第三层是最后一层。由于它是二分类分类器，它只有一个神经元。它接收来自上一层 20 个神经元中每一个神经元的 20 个输入。网络输入函数将第 2 层的输出（`output2`）作为其输入。


    在这里使用 sigmoid 激活函数，因为我们期望一个二进制输出。参考表 5.13。网络的构建完成。我们只需要添加损失函数和会话（session）的剩余代码：


    ![](img/Figure-4.85.jpg)


    **图 4.85：** 损失函数和会话代码


    我们运行 100 次迭代：


    ![](img/Figure-4.86.jpg)


    **图 4.86：** 训练模型 100 次迭代


    我们的模型实现了 100% 的准确率。完整代码可以在 GitHub 链接上找到。你可以通过添加更多层和每层中更多的神经元来尝试，并观察准确率的变化。


    # ReLu 激活函数


    在进入下一层之前，让我们看看 ReLu 是什么。ReLu 是整流线性单元（rectified linear unit），它的输出始终是非负值。它比 sigmoid
    激活函数收敛快得多，：


    ![](img/Figure-4.87.jpg)


    **图 4.87：** ReLu 激活函数


    # 多层多分类神经网络


    我们现在构建一个多层神经网络来解决 MNIST 问题，这是一个 10 类分类问题。我们可以复用之前示例中的代码。这是我们要构建的网络结构：


    ![](img/Figure-4.88.jpg)


    **图 4.88：** 多类分类


    因此，代码如下所示：


    ![](img/Figure-4.89.jpg)


    **图 4.89：** 多类分类代码


    所有的层都像之前一样创建。最后一层使用了 Softmax 激活函数。主体结构已就绪。现在我们添加损失函数和会话进行训练。


    ![](img/Figure-4.90.jpg)


    **图 4.90：** 添加损失函数和会话进行训练


    如你所见，该模型实现了 97% 的准确率。此代码可以在 GitHub 上找到。你可以通过增加层数和每层中的神经元数量来尝试。

