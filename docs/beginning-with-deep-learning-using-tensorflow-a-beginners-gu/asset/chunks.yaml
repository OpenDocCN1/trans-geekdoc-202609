    \ to\n\n***Shanthi**  \n\nmy wife and my best friend.*\n\n***Vinita** and **Nikita**\
    \  \n\nOur lovely daughters*\n\n# About the Author\n\n**Mohan Kumar Silaparasetty**\
    \ is a recognized thought leader in AI and emerging technologies. He is a graduate\
    \ from IIT Kharagpur with more than 30 years of experience in the IT industry\
    \ in a variety of roles. He is an author, keynote speaker, trainer and entrepreneur.\n\
    \nHe worked for global MNC’s like SAP and IBM in a variety of leadership roles.\
    \ He has also gained international exposure during this stint with SAP America\
    \ in the USA.\n\n# About the Reviewer\n\n**Dr Vinita Jindal** is an Associate\
    \ Professor in the Department of Computer Science, Keshav Mahavidyalaya, the University\
    \ of Delhi having more than 20 years of experience. She did her Doctorate in Computer\
    \ Science from the University of Delhi. She is mainly working in the area of Artificial\
    \ Intelligence and Networks. Her areas of interest include Network Protocols,\
    \ Cybersecurity, Intrusion Detection Systems, Dark Web, Deep Learning, Recommender\
    \ Systems and Vehicular Adhoc Networks to name a few.\n\n# Acknowledgement\n\n\
    There are a few people I want to thank for the continued and ongoing support they\
    \ have given me during the writing of this book. First and foremost, I would like\
    \ to thank my wife and my daughters, Vinita and Nikita for their encouragement\
    \ and support throughout the process.\n\nI would like to thank BPB Publications\
    \ for giving me this opportunity to write my first book for them.\n\n# Preface\n\
    \nWith VDI deployments, IT teams would need to build and manage several gold images\
    \ such that they can be used as templates for these virtual desktop machines so\
    \ that the right applications can be delivered to the correct end users. It also\
    \ meant that they would potentially need to rebuild a gold image just so that\
    \ they could update a single application. This would mean spending a large proportion\
    \ of their time building and configuring desktop images, taking time, and even\
    \ worse, introducing end user downtime should anything go wrong.\n\nTo address\
    \ this issue of having several different gold builds to manage applications and\
    \ operating systems as one, admins needed a solution whereby they could manage\
    \ the applications independently. A way that is very familiar today in how virtualization\
    \ works is by abstracting the operating systems from the hardware. However, this\
    \ time you are one level up, with abstracting the applications from the operating\
    \ system. This approach would allow admins to deliver apps independently.\n\n\
    One of the ways how applications can be abstracted from the underlying operating\
    \ system, and be able to deliver them back independently, is via application layering.\
    \ With application layering, admins can create that layer of abstraction, separate\
    \ the applications from the underlying OS and deliver them back to the end users\
    \ on demand. Equally, they can also be removed. As the applications are now independent\
    \ of the operating system, they can be easily patched and updated without having\
    \ to touch the operating system image.\n\nVMware added an application layering\
    \ solution to its end user computing portfolio in August 2014, when they acquired\
    \ a start-up company called CloudVolumes. CloudVolumes provided a virtualized,\
    \ real-time application-delivery engine for virtual desktop infrastructures as\
    \ well as physical desktops.\n\nIn December 2014, CloudVolumes was rebranded and\
    \ renamed as App Volumes.\n\nWhat does App Volumes deliver? At a high level, App\
    \ Volumes provides a real-time application-delivery and application life cycle\
    \ management solution, which can be used as a delivery system for your virtual\
    \ desktop machine and remote app session servers.\n\nThe primary goal of this\
    \ book is to provide information and skills that are necessary to deploy VMware\
    \ App Volumes in your own environment. This book contains real-life examples that\
    \ will show you how to install, configure, and manage VMware App Volumes, as well\
    \ as how to integrate it into other VMware and third-party solutions.\n\n*Over\
    \ the 7 chapters in this book, you will learn the following:*\n\n**[Chapter 1](#c01.xhtml)**\
    \ Introduces the high level concepts of Artificial Intelligence, Machine Learning\
    \ and Deep Learning.\n\n**[Chapter 2](#c02.xhtml)** Basic Machine Learning concepts\
    \ required for Deep Learning. Steps to set up the Python environment to develop\
    \ ML models.\n\n**[Chapter 3](#c03.xhtml)** Programming with TensorFlow 1.x. This\
    \ chapter covers the concepts of computational graphs and sessions of TensorFlow\
    \ 1.x. Provides a lot of code examples.\n\n**[Chapter 4](#c04.xhtml)** The concepts\
    \ of Neural networks are covered in a systematic step by step manner using TensorFlow\
    \ 1.x. Starting a an implementation of single neuron (Perceptron), all the way\
    \ to a deep multilayer neural network. The MNIST case study is used as an example.\n\
    \n**[Chapter 5](#c05.xhtml)** this chapter introduces TensorFlow 2.x and Keras.\
    \ It covers how to develop and train deep neural networks with several code examples.\n\
    \n**[Chapter 6](#c06.xhtml)** Convolution Neural Networks are introduced in this\
    \ chapter with practical examples of how to build binary and multiclass image\
    \ classifiers with TensorFlow and Keras. This chapter also covers how to build\
    \ object detection applications using pretrained models.\n\n**[Chapter 7](#c07.xhtml)**\
    \ The last chapter covers Speech Recognition and Natural language processing (NLP).\
    \ It covers the traditional Recurrent Neural Networks (RNN) and the latest Transformers.\
    \ Provides code examples to develop NLP tasks like sentiment analysis and Question\
    \ and Answer systems with pretrained language models. Readily usable code examples\
    \ are provided to get you up and running quickly.\n\n# Code Bundle and Coloured\
    \ Images\n\nPlease follow the link to download the  \n\n***Code Bundle*** and\
    \ the ***Coloured Images*** of the book:\n\n# [https://rebrand.ly/lkqr41a](https://rebrand.ly/lkqr41a)\n\
    \nThe code bundle for the book is also hosted on GitHub at **[https://github.com/bpbpublications/Beginning-with-Deep-Learning-Using-TensorFlow](https://github.com/bpbpublications/Beginning-with-Deep-Learning-Using-TensorFlow)**.\
    \ In case there's an update to the code, it will be updated on the existing GitHub\
    \ repository.\n\nWe have code bundles from our rich catalogue of books and videos\
    \ available at **[https://github.com/bpbpublications](https://github.com/bpbpublications)**.\
    \ Check them out!\n\n# Errata"
