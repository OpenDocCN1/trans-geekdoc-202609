    ## 设置环境


    在进入算法细节之前，先设置环境是一个好主意，因为算法将通过实操示例进行解释。你可以通过两种方式开始编码部分——设置自己的本地环境或使用像 Google Colab
    这样的云环境。建议设置自己的环境，这样你就可以持续工作而不受互联网限制。我们在这里提到了这两种方法。


    ### 使用 Google Colab


    确保你有一个 Google 账号（如 Gmail），并确保在开始之前登录账号。使用以下 URL 或直接搜索 Google Colab 来访问 Google
    Colab：https://colab.google.com/。可能会看到如下屏幕；你可以点击 `Cancel`：


