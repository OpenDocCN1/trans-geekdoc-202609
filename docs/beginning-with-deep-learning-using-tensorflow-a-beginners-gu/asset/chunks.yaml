    This is an example of label data with a continuous value. Hence, we cannot apply
    classification for this, but we can apply regression to build a predictive model
    to predict the price of the property:


    | Rooms | Bedrooms | Population | Households | Income | Price/target |

    | --- | --- | --- | --- | --- | --- |

    | 880 | 129 | 322 | 126 | 8.3252 | 452,600 |

    | 7099 | 1106 | 2401 | 1138 | 8.3014 | 358,500 |

    | 1467 | 190 | 496 | 177 | 7.2574 | 352,100 |

    | 1274 | 235 | 558 | 219 | 5.6431 | 341,300 |

    | 1627 | 280 | 565 | 259 | 3.8462 | 342,200 |

    | 919 | 213 | 413 | 193 | 4.0368 | 269,700 |

    | 2535 | 489 | 1094 | 514 | 3.6591 | 299,200 |

    | 3104 | 687 | 1157 | 647 | 3.12 | 241,400 |

    | 2555 | 665 | 1206 | 595 | 2.0804 | 226,700 |

    | 3549 | 707 | 1551 | 714 | 3.6912 | 261,100 |

    | 2202 | 434 | 910 | 402 | 3.2031 | 281,500 |


    **Table 2.3:** Labels with continuous values


    And if the target is discrete, for example, yes/no, spam, not spam or cats, dogs,
    and so on, then classification is used, like in the following example:


    | Glucose | Diastolic | Insulin | BMI | Age (years) | Diabetes/target |

    | --- | --- | --- | --- | --- | --- |

    | 148 | 72 | 0 | 33.6 | 50 | Yes |

    | 85 | 66 | 0 | 26.6 | 31 | No |

    | 183 | 64 | 0 | 23.3 | 32 | Yes |

    | 89 | 66 | 94 | 28.1 | 21 | No |

    | 137 | 40 | 168 | 43.1 | 33 | Yes |

    | 116 | 74 | 0 | 25.6 | 30 | No |

    | 78 | 50 | 88 | 31 | 26 | Yes |

    | 115 | 0 | 0 | 35.3 | 29 | No |

    | 197 | 70 | 543 | 30.5 | 53 | Yes |

    | 125 | 96 | 0 | 0 | 54 | Yes |

    | 110 | 92 | 0 | 37.6 | 30 | No |

    | 168 | 74 | 0 | 38 | 34 | Yes |

    | 139 | 80 | 0 | 27.1 | 57 | No |


    **Table 2.4:** Labels with discrete values


    In the case of unsupervised learning, the technique used is known as clustering,
    which we will see later. All this is summarized in the following figure:


    ![](images/Figure-2.1)


    **Figure 2.1:** Types of learning


    ## Setting up the environment


    Before getting into the details of the algorithms, it is a good idea to set up
    the environment, as the algorithms will be explained with hands-on examples. You
    can get started with the coding part in two ways – set up your own local environment
    or use a cloud environment like Google Colab. It is advisable to set up your own
    environment so that you can continue to work without being tethered to the internet.
    We mention both methods here.


    ### Using Google Colab


    Make sure you have a Google account (like Gmail), and make sure you login to the
    account before you start. Access Google Colab using the following URL or simply
    searching for Google Colab: https://colab.google.com/. You might get a screen
    as follows; you can click `Cancel`:


    ![](images/Figure-2.2)


    **Figure 2.2:** To start Google Colab


    You can see the welcome screen:


    ![](images/Figure-2.3)


    **Figure 2.3:** Welcome screen


    Now, perform the following steps:


    1. From the menu, select `File` | `New Python 3 notebook`.

    2. That’s it! You are ready to start coding.

    3. Just type in: `print("Hello world")` and press `Shift` + `Enter`. This should
    print `Hello world` in the next line.


    ### Setting up local environment in Python


    The best way to set up the Python environment locally is to use Anaconda. It is
    a Python distribution with an easy-to-use interface. Follow the steps given here
    to set up the environment.


    #### Prerequisite


    Laptop with min 4 GB RAM, Intel i5 or equivalent with Windows 7 or above. Other
    operating systems like MacOS, Ubuntu can also be used, but for simplicity we just
    give the instructions here for Windows. Internet connection – min 2 MBPS. Thus,
    the following steps are performed:


    1. Install Anaconda from the Anaconda website: https://www.anaconda.com/distribution/


    ![](images/Figure-2.4)


    **Figure 2.4:** Select Python 3.7


    2. Select the Python 3.7 version. This will start the download of the install
    file. Once it is downloaded, double click on this file to start the installation.
    This may take a while, depending on your internet connection.


    3. Once the installation is done, you will be able to see Anaconda Navigator from
    the windows start. Open `Anaconda Navigator` and select `Environments`. By default,
    a base environment will be created that contains Python:


    ![](images/Figure-2.5)


    **Figure 2.5:** Anaconda Navigator home page


    4. It is a good idea to create a new environment for your learning or projects.


    5. Create a new environment using the create button on the bottom left. Choose
    `Python 3.7` version and give a meaningful name like `TensorFlow`. This will take
    a while, depending on your internet connection.


    ![](images/Figure-2.6)


    **Figure 2.6:** Creating New Environment


    6. Once it is done, select this environment, as shown in figure 2.7. Install additional
    libraries like `NumPy`, `pandas`, `scikit-learn`, and `Matplotlib` using the button
    on the right as shown in the following diagrams:


    ![](images/Figure-2.7)


    **Figure 2.7:** Select the new environment


    7. Install additional library like `NumPy`:


    ![](images/Figure-2.8)


    **Figure 2.8:** Installing NumPy


    8. Now one more library to install like `pandas`:


    ![](images/Figure-2.9)


    **Figure 2.9:** Installing pandas


    9. Next to install `scikit-learn`:


    ![](images/Figure-2.10)


    **Figure 2.10:** Installing scikit


    10. Use the same process to install `Matplotlib`.


    11. Go to the home page by selecting `Home` on the navigation bar on the left.
    Install Jupyter Notebook by clicking on `Install` (refer to figure 2.11).


    ![](images/Figure-2.11)


    **Figure 2.11:** Installing Jupyter notebook


    12. This completes the installation process. TensorFlow installation steps will
    be provided in the corresponding chapter.

