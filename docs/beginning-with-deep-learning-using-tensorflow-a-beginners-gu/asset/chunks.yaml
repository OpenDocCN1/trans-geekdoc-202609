  trans: "\n现在你已经对 TensorFlow 编程的工作原理有了良好的了解，通常，让我们看看如何在机器学习中应用它，特别是在训练模型方面。为此，我们将采用最基础的机器学习算法——简单线性回归，它最简单的形式表示为如下所示的直线方程：\n\
    \n`Y = w*X+b`\n\n对于给定的数据集，训练该模型意味着——找到 `w` 和 `b` 的正确值。\n\n实现此点的方法一种是使用暴力法，尝试 `w`\
    \ 和 `b` 的所有可能值。这些也被称为可训练参数。让我们编写这部分代码：\n\n![](img/Figure-3.58.jpg)\n\n**图 3.58:**\
    \ 可训练参数的代码\n\n我们首先初始化变量 `w` 和 `b` 为某些随机值（0.2 和 –.2）：\n\n![](img/Figure-3.59.jpg)\n\
    \n**图 3.59:** x 和 y 的占位符\n\n我们为训练数据创建占位符 `x` 和 `y`。`X` 是特征，`y` 是标签/目标：\n\n![](img/Figure-3.60.jpg)\n\
    \n**图 3.60:** 定义线性模型\n\n然后我们定义模型。请记住，我们首先是在创建计算图，然后在会话中执行它：\n\n![](img/Figure-3.61.jpg)\n\
    \n**图 3.61:** 损失函数\n\n接下来，我们创建误差或损失函数。第 5 单元格需要额外的解释。\n\n`Linear_model` 是预测值。也就是说，在训练过程中，我们传递\
    \ `x` 的值，并由模型预测输出。注意，标签不是 `y`。这是预测值。因此，预测值（`linear_model`）与 `y`（标签）之间的差异就产生了误差。\n\
    \n根据预测值是否大于标签值或反之，该误差可以是正值或负值。`tf.square()` 对误差进行平方，使所有值都变为正数。\n\n下一行仅仅是所有这些平方值的和。不要被方法名\
    \ `reduce_sum` 误导。`tf.reduced_sum`（平方后）提供了数据集误差的平方和：\n\n![](img/Figure-3.62.jpg)\n\
    \n**图 3.62:** 会话 (Session)\n\n在创建图之后，我们创建会话并在会话执行图之前初始化变量：\n\n![](img/Figure-3.63.jpg)\n\
    \n**图 3.63:** 初始化变量\n\n这一行是图的实际执行。让我们花点时间理解它。\n\n我们执行的节点是 `loss`，它是节点平方的函数，而该节点反过来又是\
    \ `linear_model` 和 `y` 的函数。`linear_model` 又依赖于 `x`。因此，loss 依赖于 `x` 和 `y`，它们都是占位符。因此，我们使用\
    \ `feed_dict` 馈入 `x` 和 `y`。传递的值如下：\n\n`X=[1,2,3,4]`\n\n以及\n\n`Y=[0, –1, –2, –3]`\n\
    \n这是训练数据。计算出的损失为 20.16。我们必须通过改变可训练参数 `W` 和 `b` 的值来使该值最小。现在，让我们尝试手动更改 `W` 和 `b`\
    \ 的值，将它们重新初始化为不同的值并运行会话。\n\n![](img/Figure-3.64.jpg)\n\n**图 3.64:** 重新运行会话\n\n\
    `W` 和 `b` 分别重新初始化为 .3 和 –3：\n\n![](img/Figure-3.65.jpg)\n\n**图 3.65:** 打印损失值\n\
    \n现在我们得到的损失值为 23.66，比之前的值要高。让我们为 `W` 和 `b` 尝试另一组值：\n\n![](img/Figure-3.66.jpg)\n\
    \n**图 3.66:** 初始化\n\n`W` 和 `b` 分别重新初始化为 –1.0 和 1.0。\n\n![](img/Figure-3.67.jpg)\n\
    \n**图 3.67:** 损失值 = 0\n\n最后损失最终减少到了 0。\n\n这就是训练过程中在后台发生的情况。参数 `W` 和 `b` 的值正在不断更新，以减少损失。如果我们需要自动化这个过程，可以使用\
    \ TensorFlow 提供的优化器（optimizer）。为了实现这一点，我们按所示更新代码：\n\n![](img/Figure-3.68.jpg)\n\
    \n**图 3.68:** 应用优化器\n\n创建了一个优化器实例并命名为 `optimizer`。它接受一个名为学习率的参数——在这种情况下是 .01。我们稍后讨论学习率。\n\
    \n然后我们使用优化器的 `minimize` 方法来最小化损失。节点 `train` 在会话中以递归方式执行时，会自动改变可训练参数 `W` 和 `b`：\n\
    \n![](img/Figure-3.69.jpg)\n\n**图 3.69:** 使用 train()\n\n节点 `train` 在会话中循环执行 1000\
    \ 次迭代。当我们打印 `W` 和 `b` 时，我们发现它找到了正确的 `W (1.0)` 和 `b(1.0)` 的值，正如我们之前看到的，这些值产生了 0\
    \ 损失。这可以通过在会话中执行 `loss` 节点来验证：\n\n![](img/Figure-3.70.jpg)\n\n**图 3.70:** 计算损失值\n\
    \n它返回了 0。尽管我们在这个例中使用了 `GradientDescentOptimizer`，但 TensorFlow 提供了多种优化器。`GradientDescentOptimizer`\
    \ 的功能将在神经网络章节中解释。这里的重点是编写代码，因此不再对其工作原理进行详细解释。\n\n# 应用优化器解决数学问题\n\n为了帮助更好地理解优化器的用法，让我们通过\
    \ `GradientDescent` 优化器取一个非常简单的数学示例。在演示中，我们将求解以下二次方程（即代码中的 x²-10x+25）：\n\n代码如下：\n\
    \n![](img/Figure-3.71.jpg)\n\n**图 3.71:** 求解二次方程\n\n我们首先构建计算图。初始化 `x` 为 0 以及任何随机值。创建一个名为\
    \ `cost` 的节点来定义二次方程的左侧，它需要被最小化到 0：\n\n![](img/Figure-3.72.jpg)\n\n**图 3.72:**\
    \ 实例化优化器\n\n接下来，我们创建一个优化器实例和 `train` 节点来最小化损失函数：\n\n![](img/Figure-3.73.jpg)\n\
