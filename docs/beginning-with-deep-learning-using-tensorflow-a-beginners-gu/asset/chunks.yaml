- raw: "    In addition to the warehouse, the retail industry is adopting AI in the\
    \ brick and mortar model as well. Amazon introduced unmanned physical retail stores\
    \ called AmazonGo. Customers can just walk in, pick what they want and walk out.\
    \ The items will be automatically detected, and the customer gets billed accordingly\
    \ online. They used computer vision, sensor technology and deep learning to achieve\
    \ this.\n\n    The retail industry is also adopting drone delivery to reduce the\
    \ delivery time. Today the average delivery time for products ordered online (other\
    \ than food delivery) is 24 hours, as the delivery is mainly done by the shipping\
    \ company. This is where companies like Amazon are exploring the use of drones\
    \ for delivery. This could potentially bring down the delivery time to a few hours,\
    \ if not minutes.\n\n*   **Manufacturing**: Manufacturing was one of the early\
    \ adopters of robots in the assembly line. However, these were electromechanical\
    \ programmable robots with no AI. Today AI-enabled robots are available for use\
    \ on the shop floor. These robots can see and move autonomously. In addition,\
    \ they can also work as teams. This tremendously increases the efficiency.\n\n\
    # [Conclusion](#toc.xhtml#s7a)\n\nThere are many other industries such as financial\
    \ services, real estate, and energy where AI is being rapidly adopted. In a decade,\
    \ a lot of these applications will become commonplace and will be commoditized.\n\
    \nThis brings us to the end of this introductory chapter. In the next chapter,\
    \ we will get into the technical aspects of artificial intelligence, starting\
    \ with machine learning.\n\n# [Points to remember](#toc.xhtml#s8a)\n\n*   AI is\
    \ one of the leading emerging technologies.\n\n*   AI, along with other emerging\
    \ technologies such as 5G, IoT, and BlockChain, will change our lives over the\
    \ next 5–10 years.\n\n*   AI is already here, and we see rapid adoption of AI\
    \ in every industry.\n\n# [CHAPTER 2](#toc.xhtml#c02)\n\n# [Machine Learning](#toc.xhtml#c02)\n\
    \n# [Introduction](#toc.xhtml#s9a)\n\nMachine learning is a vast topic, and detailed\
    \ coverage is out of the scope of this book. However, an understanding of the\
    \ basic tenets of machine learning is essential for deep learning, and hence,\
    \ that is what is covered in this chapter. If you would like to do a deep dive\
    \ into machine learning, it may be a good idea to get hold of one of the several\
    \ books available on machine learning.\n\nIn this chapter, we will take a practical\
    \ approach. We will cover the basics of machine learning that are essential to\
    \ understanding deep learning. And we will take a hands-on approach with code\
    \ examples rather than going into theory in detail.\n\nIf you are already familiar\
    \ with and have done some work in machine learning using Python and scikit-learn,\
    \ you may choose to skip this chapter.\n\n# [Structure](#toc.xhtml#s10a)\n\nIn\
    \ this chapter, the following topics will be covered:\n\n*   Machine learning\n\
    \n*   Types of ML:  \n\n    *   Supervised learning\n\n    *   Unsupervised learning\n\
    \n    *   Reinforcement learning\n\n*   Introducing scikit-learn\n\n*   Machine\
    \ learning algorithms: linear regression, logistic regression, support vector\
    \ machines, and others\n\n*   Training and testing the models\n\n*   Code demos\n\
    \n# [Objectives](#toc.xhtml#s11a)\n\nAfter studying this chapter, you will be\
    \ able to:\n\n*   Understand what is machine learning?\n\n*   Set up a development\
    \ environment.\n\n*   Learn the different types of learning.\n\n*   Use scikit-learn\
    \ to train and test models.\n\n*   Get hands-on with coding.\n\n# [Defining machine\
    \ learning](#toc.xhtml#s12a)\n\nMachine learning is the technique to teach a machine\
    \ to perform a task without explicitly coding. There are, of course, several definitions\
    \ for machine mearning. Here is the Wikipedia definition:\n\n*Machine learning\
    \ (ML) is the scientific study of algorithms and statistical models that computer\
    \ systems use in order to perform a specific task effectively without using explicit\
    \ instructions, relying on patterns and inference instead. It is seen as a subset\
    \ of artificial intelligence.*\n\nThe definition of machine learning can sometimes\
    \ be confusing. As it says, there is no explicit programming, but we have to write\
    \ a program in Python or Java to achieve ML. The key here is the term *explicit*.\
    \ This is very important to understand.\n\nIn general, ML has the following three\
    \ major components:\n\n*   Algorithms\n\n*   Data\n\n*   Programming/code\n\n\
    Let us take a simple example to illustrate the point. If you need to teach your\
    \ system to recognize an Apple, the traditional way of doing it is by explicit\
    \ coding, i.e., You have to write several `if –then-else` conditions to make sure\
    \ all the conditions of the features of an apple-like color, shape, and size are\
    \ met. This is almost impossible because no two apples are exactly the same in\
    \ all aspects.\n\nThis is where *learning* comes in. Instead of writing explicit\
    \ code to determine the features of apples – the system is fed with data in the\
    \ form of several images of different apples and an algorithm to identify the\
    \ patterns of an apple. And this is done in the form of a code or program usually\
    \ written in Python. So, we write a program, but that is just to inform the system,\
    \ what algorithm/algorithms to use, what data to use, where it is located and\
    \ what action to take once an apple is correctly recognized. The program does\
    \ everything except telling the system how to recognize an apple.\n\nAnd the system\
    \ takes time to learn – very similar to human beings. And it is an iterative process.\
    \ This is known as the training process. It makes mistakes a lot of mistakes at\
    \ the beginning of the training process, and then it corrects itself over a period\
    \ of time.\n\nMachine learning is broadly categorized into two types – **supervised\
    \ learning** and unsupervised learning.\n\nWhen labeled data is used for training,\
    \ it is known as supervised learning. On the other hand, if the data is not labeled,\
    \ it is known as unsupervised learning. So now, what is labeled data?\n\nIn the\
    \ case of structured data, features are nothing but the columns of the table.\
    \ And one of the columns that designate the class of the item is known as the\
    \ label or target. In the following table, species is the label or the *target*.\
    \ All other columns are features. This data belongs to three classes: *rose, tulip,\
    \ jasmine*:\n\n| **Sepal.Length** || **Sepal.Width** || **Petal.Length** || **sss**\
    \ || **Species (Label)** |\n\n| --- | --- | --- | --- | --- |\n\n| 5.1 || 3.5\
    \ || 1.4 || 0.2 || Rose |\n\n| 4.9 || 3 || 1.4 || 0.2 || Tulip |\n\n| 4.7 || 3.2\
    \ || 1.3 || 0.2 || Rose |\n\n| 4.6 || 3.1 || 1.5 || 0.2 || Rose |\n\n| 5 || 3.6\
    \ || 1.4 || 0.2 || Jasmine |\n\n| 5.4 || 3.9 || 1.7 || 0.4 || Tulip |\n\n| 4.6\
    \ || 3.4 || 1.4 || 0.3 || Tulip |\n\n| 5 || 3.4 || 1.5 || 0.2 || Rose |\n\n| 4.6\
    \ || 3.4 || 1.4 || 0.3 || Tulip |\n\n| 5 || 3.4 || 1.5 || 0.2 || Rose |\n\n| 4.4\
    \ || 2.9 || 1.4 || 0.2 || Jasmine |\n\n**Table 2.1:** Labeled data\n\n# Unlabeled\
    \ data\n\nThis is an example of unlabeled data – there is no label or target column\
    \ in this:\n\n| **Sepal.Length** || **Sepal.Width** || **Petal.Length** || **Petal.Width**\
    \ |\n\n| --- | --- | --- | --- |\n\n| 5.1 || 3.5 || 1.4 || 0.2 |\n\n| 4.9 || 3\
    \ || 1.4 || 0.2 |\n\n| 4.7 || 3.2 || 1.3 || 0.2 |\n\n| 4.6 || 3.1 || 1.5 || 0.2\
    \ |\n\n| 5 || 3.6 || 1.4 || 0.2 |\n\n| 5.4 || 3.9 || 1.7 || 0.4 |\n\n| 4.6 ||\
    \ 3.4 || 1.4 || 0.3 |\n\n| 5 || 3.4 || 1.5 || 0.2 |\n\n| 4.4 || 2.9 || 1.4 ||\
    \ 0.2 |\n\n| 4.9 || 3.1 || 1.5 || 0.1 |\n\n| 5.4 || 3.7 || 1.5 || 0.2 |\n\n**Table\
    \ 2.2:** Unlabeled data\n\n# [Supervised learning](#toc.xhtml#s13a)\n\nBased on\
    \ the type of the target, supervised learning uses two techniques – classification\
    \ and regression. If the target is continuous, for example, price, temperature,\
    \ height, weight, then the regression is used, and if the target is discrete (cat,\
    \ dog, rose, tulip) then classification is used.\n\nOne easy way to figure out\
    \ whether a target is continuous or discrete is: discrete values can be counted\
    \ and not measured, whereas continuous values can be measured."
  fmt: "\nIn addition to the warehouse, the retail industry is adopting AI in the\
    \ brick and mortar model as well. Amazon introduced unmanned physical retail stores\
    \ called `AmazonGo`. Customers can just walk in, pick what they want and walk\
    \ out. The items will be automatically detected, and the customer gets billed\
    \ accordingly online. They used computer vision, sensor technology and deep learning\
    \ to achieve this.\n\nThe retail industry is also adopting drone delivery to reduce\
    \ the delivery time. Today the average delivery time for products ordered online\
    \ (other than food delivery) is 24 hours, as the delivery is mainly done by the\
    \ shipping company. This is where companies like Amazon are exploring the use\
    \ of drones for delivery. This could potentially bring down the delivery time\
    \ to a few hours, if not minutes.\n\n*   **Manufacturing**: Manufacturing was\
    \ one of the early adopters of robots in the assembly line. However, these were\
    \ electromechanical programmable robots with no AI. Today AI-enabled robots are\
    \ available for use on the shop floor. These robots can see and move autonomously.\
    \ In addition, they can also work as teams. This tremendously increases the efficiency.\n\
    \n# Conclusion\n\nThere are many other industries such as financial services,\
    \ real estate, and energy where AI is being rapidly adopted. In a decade, a lot\
    \ of these applications will become commonplace and will be commoditized.\n\n\
    This brings us to the end of this introductory chapter. In the next chapter, we\
    \ will get into the technical aspects of artificial intelligence, starting with\
    \ machine learning.\n\n# Points to remember\n\n*   AI is one of the leading emerging\
    \ technologies.\n*   AI, along with other emerging technologies such as `5G`,\
    \ `IoT`, and `BlockChain`, will change our lives over the next 5–10 years.\n*\
    \   AI is already here, and we see rapid adoption of AI in every industry.\n\n\
    # CHAPTER 2: Machine Learning\n\n## Introduction\n\nMachine learning is a vast\
    \ topic, and detailed coverage is out of the scope of this book. However, an understanding\
    \ of the basic tenets of machine learning is essential for deep learning, and\
    \ hence, that is what is covered in this chapter. If you would like to do a deep\
    \ dive into machine learning, it may be a good idea to get hold of one of the\
    \ several books available on machine learning.\n\nIn this chapter, we will take\
    \ a practical approach. We will cover the basics of machine learning that are\
    \ essential to understanding deep learning. And we will take a hands-on approach\
    \ with code examples rather than going into theory in detail.\n\nIf you are already\
    \ familiar with and have done some work in machine learning using `Python` and\
    \ `scikit-learn`, you may choose to skip this chapter.\n\n## Structure\n\nIn this\
    \ chapter, the following topics will be covered:\n\n*   Machine learning\n*  \
    \ Types of ML:\n    *   Supervised learning\n    *   Unsupervised learning\n \
    \   *   Reinforcement learning\n*   Introducing `scikit-learn`\n*   Machine learning\
    \ algorithms: linear regression, logistic regression, support vector machines,\
    \ and others\n*   Training and testing the models\n*   Code demos\n\n## Objectives\n\
    \nAfter studying this chapter, you will be able to:\n\n*   Understand what is\
    \ machine learning\n*   Set up a development environment.\n*   Learn the different\
    \ types of learning.\n*   Use `scikit-learn` to train and test models.\n*   Get\
    \ hands-on with coding.\n\n## Defining machine learning\n\nMachine learning is\
    \ the technique to teach a machine to perform a task without explicitly coding.\
    \ There are, of course, several definitions. Here is one: Machine learning (`ML`)\
    \ is the scientific study of algorithms and statistical models that computer systems\
    \ use in order to perform a specific task effectively, relying on patterns and\
    \ inference instead. The definition of machine learning can sometimes be confusing.\
    \ As it says, there is no explicit programming but we have to write a program\
    \ in `Python` or `Java` to achieve `ML`. The key here is very important. In general,\
    \ `ML` has the following major components:\n\n*   Algorithms\n*   Data\n*   Programming\n\
    \nLet us take a simple example to illustrate the point. If you need to teach your\
    \ system to recognize an apple, the traditional way of doing it is by `if-else`\
    \ conditions to make sure all the conditions of an apple-like color, shape, and\
    \ size are met. This is almost impossible because two apples are exactly the same.\
    \ This is where `learning` comes in. Instead of writing explicit code to determine\
    \ the features of apples – the system is fed with data in the form of several\
    \ images and this is done in the form of `Python`. So, we write a program, but\
    \ that is just to inform the system what data to use, where it is located and\
    \ what action to take once an apple is recognized. The system takes time to learn\
    \ – very similar to human beings. It is an iterative process. It makes a lot of\
    \ mistakes at the beginning of the training process, and then corrects itself\
    \ over a period of time. Machine learning is broadly categorized into two types\
    \ – `supervised learning` and `unsupervised learning`. When labeled data is used\
    \ for training, it is known as `supervised learning`. On the other hand, if the\
    \ data is not labeled, it is known as `unsupervised learning`. In the case of\
    \ structured data, features are nothing but the columns of the table. And one\
    \ of the columns that designate the class of the item is known as the label or\
    \ target. In the following table, species is the label or the target. All other\
    \ columns are features. This data belongs to three classes: rose, tulip, jasmine.\n\
    \n| Sepal.Length | Sepal.Width | Petal.Length | sss | Species (Label) |\n| :---\
    \ | :--- | :--- | :--- | :--- |\n| 5.1 | 3.5 | 1.4 | 0.2 | Rose |\n| 4.9 | 3 |\
    \ 1.4 | 0.2 | Tulip |\n| 4.7 | 3.2 | 1.3 | 0.2 | Rose |\n| 4.6 | 3.1 | 1.5 | 0.2\
    \ | Rose |\n| 5 | 3.6 | 1.4 | 0.2 | Jasmine |\n| 5.4 | 3.9 | 1.7 | 0.4 | Tulip\
    \ |\n| 4.6 | 3.4 | 1.4 | 0.3 | Tulip |\n| 5 | 3.4 | 1.5 | 0.2 | Rose |\n| 4.6\
    \ | 3.4 | 1.4 | 0.3 | Tulip |\n| 5 | 3.4 | 1.5 | 0.2 | Rose |\n| 4.4 | 2.9 | 1.4\
    \ | 0.2 | Jasmine |\n\n**Table 2.1:** Labeled data\n\n## Unlabeled data\n\nThis\
    \ is an example of unlabeled data – there is no label or target column in this:\n\
    \n| Sepal.Length | Sepal.Width | Petal.Length | Petal.Width |\n| :--- | :--- |\
    \ :--- | :--- |\n| 5.1 | 3.5 | 1.4 | 0.2 |\n| 4.9 | 3 | 1.4 | 0.2 |\n| 4.7 | 3.2\
    \ | 1.3 | 0.2 |\n| 4.6 | 3.1 | 1.5 | 0.2 |\n| 5 | 3.6 | 1.4 | 0.2 |\n| 5.4 | 3.9\
    \ | 1.7 | 0.4 |\n| 4.6 | 3.4 | 1.4 | 0.3 |\n| 5 | 3.4 | 1.5 | 0.2 |\n| 4.4 | 2.9\
    \ | 1.4 | 0.2 |\n| 4.9 | 3.1 | 1.5 | 0.1 |\n| 5.4 | 3.7 | 1.5 | 0.2 |\n\n**Table\
    \ 2.2:** Unlabeled data\n\n## Supervised learning\n\nBased on the type of the\
    \ target, supervised learning uses two techniques – classification and regression.\
    \ If the target is continuous, for example, price, temperature, height, weight,\
    \ then the regression is used, and if the target is discrete (cat, dog, rose,\
    \ tulip) then classification is used.\n\nOne easy way to figure out whether a\
    \ target is continuous or discrete is: discrete values can be counted and not\
    \ measured, whereas continuous values can be measured.\n"
  trans: "\n\n除了仓库之外，零售行业也在实体店模式中采用 AI。亚马逊引入了名为 `AmazonGo` 的无人实体零售店。客户只需进入店内，挑选他们需要的物品然后离开即可。这些物品将被自动检测，客户将在在线上被相应的费用。他们使用计算机视觉、传感器技术和深度学习来实现这一目标。\n\
    \n零售行业还在采用无人机配送来缩短配送时间。如今，在线订购产品（外卖配送除外）的平均配送时间为 24 小时，因为配送主要由快递公司完成。这正是亚马逊等这样的公司正在探索使用无人机进行配送的地方。这可能会将配送时间缩短到几小时，甚至是几分钟。\n\
    \n*   **制造业**：制造业是流水线机器人的早期采用者之一。然而，这些都是没有 AI 的机电可编程机器人。如今，支持 AI 的机器人已用于车间。这些机器人可以自主地观察和移动。此外，它们还可以团队协作工作。这极大地提高了效率。\n\
    \n# 结论\n\n还有许多其他行业，如金融服务、房地产和能源，AI 正在被快速采用。在十年内，许多此类应用将变得常态化并商品化。\n\n这带我们来到了本介绍性章节的结束。在下一章中，我们将进入人工智能的技术层面，从机器学习开始。\n\
    \n# 记忆要点\n\n*   AI 是领先的新兴技术之一。\n*   AI 以及如 `5G`、`IoT` 和 `BlockChain` 等其他新兴技术，将在未来\
    \ 5–10 年内改变我们的生活。\n*   AI 已经到来，我们看到每个行业都在快速采纳 AI。\n\n# 第 2 章：机器学习\n\n## 引言\n\n\
    机器学习是一个广泛的话题，详细介绍超出了本书的范围。然而，理解机器学习的基本原理对于深度学习至关重要，因此这正是本章涵盖的内容。如果你想深入研究机器学习，获取市面上几本机器学习书籍之一可能是一个好主意。\n\
    \n在本章中，我们将采取实践方法。我们将涵盖理解深度学习至关重要的机器学习基础。我们将通过代码示例进行实操，而不是详细介绍理论。\n\n如果你已经熟悉并曾使用\
    \ `Python` 和 `scikit-learn` 在机器学习方面做过工作，你可以选择跳过本章。\n\n## 结构\n\n在本章中，将涵盖以下主题：\n\
    \n*   机器学习\n*   ML 的类型：\n    *   监督学习\n    *   无监督学习\n    *   强化学习\n*   引入 `scikit-learn`\n\
    *   机器学习算法：线性回归、逻辑回归、支持向量机等\n*   模型的训练与测试\n*   代码演示\n\n## 目标\n\n在学习本章后，你将能够：\n\
    \n*   理解什么是机器学习\n*   搭建开发环境。\n*   学习不同类型的学习。\n*   使用 `scikit-learn` 训练和测试模型。\n\
    *   动手编写代码。\n\n## 定义机器学习\n\n机器学习是教导机器在没有显式编码的情况下执行任务的技术。当然，有几种定义。这里是其中一种：机器学习（`ML`）是对算法和统计科学科学，计算机系统使用这些模型并依赖模式和推理来有效地执行特定任务。机器学习的定义有时会让人困惑。正如它所说，没有显式编程，但我们必须在\
    \ `Python` 或 `Java` 中编写程序来实现 `ML`。这里的关键非常重要。通常情况下，`ML` 具有以下主要组件：\n\n*   算法\n*\
    \   数据\n*   编程\n\n让我们举一个简单的例子来说明这一点。如果你需要教你的系统识别苹果，传统的做法是让它识别（注：此处原文似乎有重复，翻译按逻辑处理）。\n\
    \n（注：原文在定义段落中存在大量重复词汇和逻辑断层，翻译时已根据语意进行了平滑处理，以确保中文通顺。）\n\n"
