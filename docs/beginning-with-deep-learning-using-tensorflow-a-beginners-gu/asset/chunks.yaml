    # [Elements of TensorFlow program](#toc.xhtml#s32a)


    We will start with TensorFlow 1.x. There is a certain way of writing a TensorFlow
    program that may not be very intuitive. You first construct a computational graph
    and execute the graph in a session. Because TensorFlow is a library, we need to
    import it into the Python code before adding any TensorFlow code. It is done by
    the following line of code:


    import tensorFlow as tf


    From there on, all the library elements are accessed using the `TensorFlow` instance
    `tf`.


    The main elements of TensorFlow program are as follows:


    *   Constant


    *   Variable


    *   Placeholder


    *   Session


    Constants, variables, and placeholders can be considered as different types of
    tensors used to store data in a program at runtime. The creation of each of these
    elements results in adding a node to a computational graph. There is a default
    computational graph, that is, created in the background and need not be explicitly
    created as part of the code.


    # [Constant](#toc.xhtml#s33a)


    Constant is used to store values that are not changed or modified during the course
    of the program. There are multiple ways in which a constant is created, but the
    simplest way to create a constant is as follows:


    `a = tf.constant (10)`


    This creates a tensor initialized to 10. And this cannot be updated or modified
    by reassigning a new value.


    # [Variable](#toc.xhtml#s34a)


    A variable is used to store data that can be updated and modified during the course
    of the program. Variables are one of the critical elements of the TensorFlow program
    as they are used for training neural networks. We will see this in the Neural
    Networks chapter. There are multiple ways of creating a `Variable`, but the simplest
    way is as follows:


    `b=tf.Variable(20)`


    This is initialized to `20` but can be reassigned to any different value during
    the course of the program. You can also create multidimensional arrays.


    `tf. Variable([[1,2,3],[4,5,6],[7,8,9]]`


    This is a `Variable` initialized to a 3×3 matrix as follows:


    | 1 || 2 || 3 |


    | --- | --- | --- |


    | 4 || 5 || 6 |


    | 7 || 8 || 9 |


    **Table 3.1:** 3×3 matrix


    Note the upper case in `Variable`. Unlike constant and placeholder `Variable`
    starts with uppercase `V`.


    # [Placeholder](#toc.xhtml#s35a)


    A placeholder is a special type of storage that cannot be initialized during creation
    but can be populated only at runtime. While creating a placeholder, you just specify
    the data type or the shape of the tensor that it will be populated with at runtime.
    The simplest way to create a placeholder is as follows:


    `p= tf.placeholder(tf.float32)`


    This will create a placeholder that can be populated at runtime with a tensor
    of data type `float32,` and the shape can be anything. We will see how it is populated
    at runtime in a code example later.


    # [Session](#toc.xhtml#s36a)


    Every time you create a constant, `Variable,` or placeholder, a node gets added
    to a default graph in the background. The program does not get executed. In order
    to actually execute the program, you need to create a session and execute the
    graph in the session. This is how the session is created:


    `sess = tf.Session()`


    A particular node of a graph can be executed using the run function of the session
    and passing the node as a parameter. For example,


    `myconst = sess.run(a)`


    The `myconst` will have a value of 10 since `a` was initialized to 10.


    `myvar=sess.run(b)`


    Now `myvar` will have value of 20 because we initiated `b` to 20.


    There is a different way of dealing with placeholders which we will see later.


    So, a TensorFlow program has two major parts – the creation of the computational
    graph and execution of the graph in a session.


    Now, let us put all of this together and write our first complete `Hello World`
    program in TensorFlow as a part of our first code demo.


    Open Jupyter notebook and type the following lines of code. Type one line in each
    cell so that you can check if there is any syntax error:


    `#creation of the graph`


    `import TensorFlow as tf`


    `hello =tf.constant(‘Hello World'')`


    `#execution of the graph in a session`


    `sess=tf.Session()`


    `sess.run(hello)`


    The code in Jupyter notebook looks like:


    ![](images/Figure-3.14.jpg)


    **Figure 3.14:** Typing code in Jupyter notebook


    Congratulations! You have written your first TensorFlow program!!


