    \ 只是记录的唯一标识符，对价格没有影响。作为数据科学家，你需要决定哪些特征应该用于构建模型。这被称为**特征选择**。通常这是根据经验和领域知识完成的。在这个特定的示例中，我们考虑以下列作为特征：Bedrooms,\
    \ bathrooms, sqft_living, sqft_above, grade\n\n我们将数据框拆分为两个部分，特征（`x`）和目标（`y`）：\n\
    ![](img/Figure-2.31.jpg)\n**图 3.1:** 数据框\n\n在训练模型之前，需要将数据分为两部分：训练集和测试。训练集用于训练模型，测试集用于测试准确性。scikit-learn\
    \ 提供了一个非常有用的函数 `train_test_split` 来按指定的比例拆分数据。通常，训练测试划分比例为 60:40 或 70:30，并以小数形式提供给函数。例如，在这种情况下，我们通过设置参数\
    \ `test_size = 0.4` 将数据按 60:40 的比例拆分：\n![](img/Figure-2.32.jpg)\n**图 3.2:** 数据拆分\n\
