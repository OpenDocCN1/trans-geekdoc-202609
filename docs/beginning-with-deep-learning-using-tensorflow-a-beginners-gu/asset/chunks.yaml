    \ a browser: \n\n     ![](images/Figure-2.16.jpg)\n\n     **Figure 2.16:** Jupyter\
    \ notebook in the browser\n\n19.  Open a Jupyter notebook file by clicking on\
    \ the `New` button: \n\n     ![](images/Figure-2.17.jpg)\n\n     **Figure 2.17:**\
    \ Click \"New\" to open Jupyter\n\n20.  Type in the following commands in each\
    \ cell and execute to check if there are any errors: \n\n     `from platform import\
    \ python_version`\n\n     `python_version()`\n\n     `import pandas as pd`\n\n\
    \     `import numpy as np`\n\n     `import matplotlib.pyplot as plt`\n\n     Jupyter\
    \ notebook look like:\n\n     ![](images/Figure-2.18.jpg)\n\n     **Figure 2.18:**\
    \ Jupyter notebook window\n\nIf there are no errors, that means your installation\
    \ of Python and the required libraries is successful, and you are ready to get\
    \ started with machine learning using scikit-learn."
