    # Natural Language Processing (NLP)


    The core of speech recognition is Natural Language Processing or NLP. The speech
    to text converts the spoken words to text, but the system does not understand
    what it means. NLP is the process that makes sense of what is said and then initiates
    the corresponding response. Hence, NLP is further broken down into two parts—Natural
    Language Understanding (NLU) and Natural Language Generation (NLG).


    Before we begin, let us quickly go over some of the commonly used NLP terminologies:


    * **Text corpus**: A large text document or several text documents that are used
    for training the NLP model.

    * **Document**: A set of words or tokens. This could be a single sentence, a tweet,
    or a text file.

    * **Tokens**: Individual words in a sentence or a document.

    * **Embedding**: Mechanism of converting text to numbers.


    For a better understanding of NLP, we will consider the various NLP tasks listed
    below and run a code demo for each of them:


    * Sentiment analysis or text classification

    * Question and answer—like in chatbot

    * Text summarization

    * Language translation


    One of the first steps in an NLP process is Word Embedding.


    # Word Embedding


    Machines do not understand the text. So, the first step is to convert the text
    to numbers. There are several traditional ways in which this was done, such as
    Bag of words, Term Document Frequency (TDF), and so on. But in deep learning,
    we use a mechanism called Word Embeddings.


    The simplest way of converting text to numbers is by assigning a number to every
    unique token in our text corpus. However, just the individual words are not of
    much use in a language. They are used along with each other to communicate meaning.
    In addition, a lot of the words are related to each other in some form. For example,
    Man and King are similar in the sense they have the same gender. And Man and woman
    are related as they are antonyms and so on. With word embedding, each word is
    converted into a multi-dimensional vector in such a way that this similarity or
    relationship is maintained. Word2vec is one such technique. GloVe (short for Global
    Vectors) is another.


    In order to understand the concept of word embedding, let us go through a demo.
    In this demo, we will use pre-trained Word2vec model.


    ```bash

    pip install gensim

    ```


    ![](images/Figure-7.13.jpg)


    **Figure 7.13:** Installing gensim


    The pre-trained word2vec model we will be using is `GoogleNews-vectors-negative300.bin`.
    A link to the location is provided:


    `https://code.google.com/archive/p/word2vec/`


    The next step is to load this model.


    ```python

    from gensim.models import KeyedVec

    model = KeyedVec.load_word2vec_format(''GoogleNews-vectors-negative300.bin'',
    binary=True)

    ```


    ![](images/Figure-7.14.jpg)


    **Figure 7.14:** Loading model


    This pre-trained model has been trained on a very large corpus, and hence, it
    includes almost the English vocabulary. So let us see the vectors created for
    some of the words:


    ```python

    model.get_vector(''rich'')

    ```


    ![](images/Figure-7.15.jpg)


    **Figure 7.15:** Get vector of the word


    We use the method `get_vector` to fetch the vector for a given word. As you can
    see, this is a 300-dimension vector. We can check the values:


    ```python

    print(model.get_vector(''rich'')[:10])

    ```


    ![](images/Figure-7.16.jpg)


    **Figure 7.16:** Vector representation of "rich"


    Let us take a look at one more word, poor:


    ```python

    model.get_vector(''poor'')[:10]

    ```


    ![](images/Figure-7.17.jpg)


    **Figure 7.17:** Vector representation of "poor"


    One of the major advantages of word2vec is its ability to understand the relation
    between the words. And this is done by calculating the cosine distance between
    them. And we can check for similar words using the similarity functions. Let us
    take a look at some examples.


    ```python

    model.most_similar(''poor'', n=3)

    ```


    ![](images/Figure-7.18.jpg)


    **Figure 7.18:** Check for words similar to "poor"


    In the result, the number on the right-hand side is the measure of similarity.
    The higher the value, the more similar the words are. We can take one more example
    for the word `fast`:


    ```python

    model.most_similar(''fast'', n=3)

    ```


    ![](images/Figure-7.19.jpg)


    **Figure 7.19:** Check for words similar to "fast"


    We can also measure the similarity between two words by calling the method similarity
    and passing the two words:


    ```python

    model.similarity(''rich'', ''richer'')

    ```

