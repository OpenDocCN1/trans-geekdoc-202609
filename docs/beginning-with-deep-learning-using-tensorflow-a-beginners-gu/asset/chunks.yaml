    # [Pre-trained models](#toc.xhtml#s83a)


    Training a CNN model, in general, is a tedious and time-consuming activity. In
    the preceding examples, the data was relatively small, and even the number of
    classes was small. In real life, the models need to be trained for hundreds of
    classes with thousands of images, if not millions of them. This needs a lot of
    computing power which is very expensive. The good news is that we do not have
    to train a new model to solve each and every problem. There are several pre-trained
    models available for free which can be used to build applications to solve some
    of the common problems.


    These pre-trained models are trained on millions of images by some of the large
    organizations that can afford the huge computation power. This is also done as
    a part of an annual competition by ImageNet, which hosts millions of labeled images.


    Some of the pre-trained models are VGGNet, ResNet, ZFNet, GoogLeNet, and so on.
    These models are tightly integrated with Keras API. Let us see how to use them.


    Start by importing the required libraries and packages:


    ![](images/Figure-6.113.jpg)


    **Figure 6.113:** Import libraries


    VGG16 and ResNet are tightly integrated into Keras. Let us start with VGG16 by
    creating an instance of the model:


