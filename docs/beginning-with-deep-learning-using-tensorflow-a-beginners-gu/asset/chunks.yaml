    ## 第 1 章


    ## 人工智能引言


    在本章中，我们将介绍人工智能、深度学习和 TensorFlow。虽然预计购买这本书的人已经具备了这些知识和经验，但这仍然是为后续章节平稳过渡奠基础的好方法。这有助于确保读者和作者处于同一频道上，特别是在术语、编码方法等等方面。


    ## 结构


    本章将涵盖以下主题：


    *   AI 简史

    *   为什么是现在？

    *   AI 的应用

    *   AI 应用行业案例


    ## 目标


    在本章结束时，您将能够学习人工智能及其在各行业的应用。您将理解 AI 的演变，以及`人工智能` (`AI`)、`机器学习` (`ML`) 和`深度学习` (`DL`)
    之间的关系。


    ## 人工智能简史


    今天，我们处于巨大技术革命的边缘。在讨论 AI 之前，让我们来看看许多新兴技术（图 1.1`）。这些技术的融合结合 AI 将在未来几十年内彻底改变世界。


    ![](img/Figure-1.1.jpg)


    **图 1.1：** 新兴技术


    根据领先分析师的说法，以下技术将在未来 5-10 年内成熟：


    *   5G

    *   区块链

    *   3D 打印

    *   物联网


    这些技术结合 AI，将对人类产生巨大影响。根据维基百科的定义：“在计算机科学中，AI 有称为机器智能，是指机器表现出与人类等同或无法区分的行为测试。”以下是一些例子：


    *   聊天机器人

    *   机器人

    *   智能音箱 (Alexa)

    *   虚拟助手

    *   推荐引擎

    *   无人机

    *   自动驾驶汽车

    *   自动车辆


    ![](img/Figure-1.2.jpg)


    **图 1.2：** AI（来源：Google）


    回到达特茅会议，会议后引起了巨大的兴奋，美国政府甚至拨付了资金进行 AI 研究，但它并没有取得突破。在经历了几年的研究后，该项目被搁置——这被称为 AI 寒冬。


    原因之一是计算能力的缺乏。随后，对 AI 的兴趣在 90 年代重新复兴。随着云计算和廉价硬件的出现，计算能力的可用性大大增加。此外，大量数据以及通过 Hadoop
    等技术处理海量数据的能力进一步推动了 AI 研究。这就像是拼图的碎片各就位一样。


    AI 复兴的一个广为人知的事件是 IBM Watson。2011 年，IBM Watson 与游戏节目《危险一答》(Jeopardy!) 的现任人类冠军对决并获胜了。然而，当时
    AI 这个术语还没有像现在这样流行，因此 Watson 仅被称为一台超级计算机。但所使用的自然语言处理技术是人工智能的一个重要组成部分。而今天，Watson
    自然被称为 AI。


    必须指出，这并不是第一次出现机器击败人类的事件。早在 1997 年，一台名为“深蓝”的超级计算机击败了现任象棋世界冠军加里·卡斯帕罗夫（Gary Kasparov）。深蓝也是由
    IBM 开发的。


