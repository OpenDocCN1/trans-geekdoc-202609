    那么神经元的输入是列 `x[1]`，`x[2]`，`x[3]`，`x[4]` 和 `x[5]`，它们对应于一行。在此时，这可能很难理解，但目前请接受数据是以迭代的方式一次一行地喂入，这是整个感知机训练过程的一部分。


    # 权重


    每个神经元都有权重。权重的数量与输入的数量相同。因此在上面的示例中，因为有 5 个输入 `x[1]`， …, `x[5]`，所以会有 5 个权重。如果你使用另一组数据，假设有
    20 个输入 `X[1]`， …, `X[20]`，那么会有 20 个权重，表示为 `w[1]`，`w[2]`， …, `w[20]`。


    所以，通常情况下如果有 `m` 个输入 `X[1]`，`X[2]`， …, `X[m]`，那么会有 `m` 个权重 `W[1]`，`W[2]`， …, `W[m]`。权重无非实数；可以是正的也可以是负的。这里是一些样本值：


    `w[1] = 0.712`

    `w[2] = -0.3548`

    `w[3] = 0.2681`

    `w[4] = 0.112`

    `w[5] = -0.8548`


    **表 4.2:** 权重样本值


    这些值不是预定的，而是在训练过程中分配的。我们将在下一节查看感知机是如何工作的，这将会变得清晰。


    注意 `w[0]` 不是权重，尽管它用 `w` 表示。


    # 偏置


    每个神经元都有一个偏置。在早期的表示中，它用 `b` 表示，但在新的表示中，它用 `w[0]` 表示。无论输入数量有多少，每个神经元只有一个偏置。但和权重一样，它也是一个实数。


    # 净输入函数 (*F*)


    净输入函数，也称为输入函数，可以描述为输入与其对应权重乘积之和加上偏置。数学表达式如下：


