    **图 4.54：** 训练、测试和验证集的图像数量。


    当 MNIST 团队启动这个项目时，还没有像 `CNN` 这样可以处理二维图像的复杂神经网络。因此，28×28 的像素值矩阵被 `flattened`（展平）为一个包含
