    \ -> output will be 1\n\nSo, the final output of this perceptron for these 5 rows\
    \ would be as follows:\n\n![](images/c04eq-2.jpg)\n\nPutting all of this together,\
    \ this is the complete code for the implementation of a perceptron:\n\n![](images/Figure-4.10.jpg)\n\
    \n**Figure 4.10:** Code for perceptron\n\nAnd this is just the creation of the\
