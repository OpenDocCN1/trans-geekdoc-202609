    ![](images/Figure-4.54.jpg)


    **Figure 4.54:** The number of images in training, test, and validation.


    When the MNIST team started this project, there were no sophisticated neural networks
    like CNN, which could accept the 2-dimensional images. So, the 28×28 matrix of
    pixel values was "*flattened*" to a one-dimensional array of 784 (28\*28=784)
    pixel values:


    ![](images/Figure-4.55.jpg)


    **Figure 4.55:** Normalized pixel values range from 0 to 1


    The pixel values are normalized, and hence, they go from a maximum of 1 to a minimum
    of 0. Using matplotlib, we can view the images:


    ![](images/Figure-4.56.jpg)


    **Figure 4.56:** To display training data=6


    The image in index location 1000 in the training data set is 6. Note that before
    displaying, we reshape the array to 28×28; therefore, we can view it like a regular
    image. We can try it with a different location by changing the index:


    ![](images/Figure-4.57.jpg)


    **Figure 4.57:** To display training data=8


    Location 2000 has Number 8. In addition to data, MNIST also provides some easy-to-use
    functions. For example, `next_batch` takes a number as a parameter and fetches
    that many images.


    This piece of code will fetch randomly selected 100 images from the training data
    set. It returns the pixel values in `batch_x` and the labels in `batch_y`:


    ![](images/Figure-4.58.jpg)


    **Figure 4.58:** In built function—next\_batch()


    The shape of `batch_x` is \[100, 784\], which means there are 100 images in the
    flattened format of one-dimensional arrays of size 784. The shape of `batch_y`
    is \[100,10\], which means there are 100 one-hot encoded labels in the form of
    one-dimensional arrays of size 10 with exactly one cell set to 1 and others set
    to 0.


    Let us examine some of the 10 images that are fetched:


    ![](images/Figure-4.59.jpg)


    **Figure 4.59:** Image in 50th location


    The image in the 50th location in this `batch_x` contains 3. Let us examine if
    the label corresponds to this.


    ![](images/Figure-4.60.jpg)


    **Figure 4.60:** One hot encoded label


    This is the corresponding one-hot encoded label. And as you can see, the location
    with Index 3 is set to 1, and all others are 0:


    ![](images/Figure-4.61.jpg)


    **Figure 4.61:** Digit in the image


    We can use argmax to get the index location that also corresponds to the label
    value. Let us take one more example to illustrate this:


