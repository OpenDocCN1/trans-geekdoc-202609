    # BERT


    BERT stands for bidirectional encoder representations from transformers. It is
    pre-trained on a large corpus of unlabeled text that includes the entire Wikipedia
    and Book Corpus (800 million words). The pre-trained BERT model just needs one
    additional layer for fine-tuning to perform a variety of NLP tasks.


    BERT''s architecture consists of only encoders of the transformer. There are two
    variants of BERT models—BERT base and BERT large. BERT base has 12 layers of encoders,
    and BERT large has 24 layers:


    ![](images/Figure-7.52.jpg)


    **Figure 7.52:** BERT layers


    Both variants can take 512 words as input. One of the NLP tasks that BERT is used
    for is sentence classification. The flow is shown as follows:


    ![](images/Figure-7.53.jpg)


    **Figure 7.53:** BERT for sentence classification


    Let us take a look at a code demo of text classification with `BERT`. In this
    example, we will build a spam classifier for e-mails. The e-mails are exported
    and available in CSV format, and based on the text; they are labeled. A 1 in label
    indicates the e-mail is spam, and 0 means it is not. Use the Jupyter notebook,
    `BERT_email_classification.ipynb` for this demo:


    ![](images/Figure-7.54.jpg)


    **Figure 7.54:** pip install


    We will use `TensorFlow-text` and `TensorFlow-hub`. Perform a `pip install` of
    these libraries the first time:


    ![](images/Figure-7.55.jpg)


    **Figure 7.55:** importing TensorFlow libraries


    Import all the necessary libraries:


    ![](images/Figure-7.56.jpg)


    **Figure 7.56:** Read data from CSV file


    Then load the data from CSV file and inspect. As seen here, the CSV file has just
    two columns, `Message`, and `Category`. The `Message` column contains the body
    of the e-mail, and the category is the label, where 1 indicates this e-mail is
    spam and 0 means it is not.


    The CSV file has over 5500 e-mails which we split into train and test data and
    also separate the labels:


    ![](images/Figure-7.58.jpg)


    **Figure 7.58:** Load preprocessor and encoder

    '
  trans: '

    这也显示了 83% 的准确率。我们可以使用一些测试数据的样本进行推理并检查：


    ![](img/Figure-7.39.jpg)


    **图 7.39:** 对输出进行四舍五入


    我们尝试位置 40 处的审查。预测结果为 1。让我们检查对应的标签：


    ![](img/Figure-7.40.jpg)


    **图 7.40:** 检查标签


    标签也是 1，这表示预测是正确的。你可以多尝试几个样本。


    在此演示中使用的 RNN 被称为原生 RNN（vanilla RNNs）。RNN 存在一些问题，如梯度消失和梯度爆炸，这限制了它们的使用。这些原生 RNN
    有一些变体，如 `LSTM`（长短期记忆网络）和 `GRU`（门控循环单元），它们有助于克服其中的一些问题。


    尽管有这些变体，RNN 非常难训练。它们非常耗时。而这正是 `BERT` 这样基于 Transformer 的预训练模型极其有用的地方。


    # Transformers


    Transformer 首次在 2017 年通过题名为《注意力就是一切》（Attention is all you need）的论文被引入，从那以后，Transformer
    变得风靡，并加速了自然语言处理（NLP）和语音识别领域的进展。我们已经看到，对于 NLP，顺序很重要，因此使用了 RNN 及其变体（如 `LSTM` 和 `GRU`）。然而，由于处理是顺序进行的，它们速度非常慢。


    在 Transformer 中，处理是并行进行的。让我们来看一下 Transformer 的架构：


    ![](img/Figure-7.41.jpg)


    **图 7.41:** Transformer 架构


    它包含两个部分：编码器（encoder）和解码器（decoder）。编码器又包含以下内容：


    *   输入嵌入（Input embedding）

    *   位置编码（Positional encoding）

    *   编码层（Encoding layers）


    Transformer 的原始设计有六个编码层。


    解码器又包含以下内容：


    *   输出嵌入（Output embedding）

    *   位置编码（Positional encoding）

    *   解码层（Decoding layers）


    原始设计有六个解码层：


    ![](img/Figure-7.42.jpg)


    **图 7.42:** 编码器-解码器


    每个编码层又由两个部分组成：


    *   自注意力机制（Self-attention）

    *   前馈神经网络（Feedforward neural network）


    ![](img/Figure-7.43.jpg)


    **图 7.43:** 编码器


    每个解码器又由三个部分组成：


    *   自注意力机制（Self-attention）

    *   编码器-解码器注意力（Encoder decoder attention）

    *   前馈神经网络（Feed forward neural network）


    ![](img/Figure-7.44.jpg)


    **图 7.44:** 解码器


    与 RNN 或其变体（如 `LSTM` 和 `GRU`）相比，将 Transformer 用于 NLP 任务的主要优势在于训练时的并行化。


    现在你对 Transformer 有了基本的了解，让我们来看看它们如何用于 NLP 任务。在在上一个代码演示中，我们看到了如何使用 RNN 进行文本分类。让我们用
    `BERT` 做类似的练习，`BERT` 是一种基于 Transformer 的语言模型。


    # 预训练 Transformer 模型


    有多个免费提供的预训练模型可以执行各种 NLP 任务。Hugging face 提供了此类模型，我们将使用它们并演示使用它们执行各种 NLP 任务有多简单。你可以通过访问他们的网站获取更多详情：


    **[`huggingface.co/`](https://huggingface.co/)**


    然而，这需要 `pytorch` 环境，由于我们正在使用 TensorFlow 本地环境，我们将使用 Google Colab 进行这些演示。如果你有兴趣设置本地的
    PyTorch 环境，可以查看此链接：


    **[`huggingface.co/course/chapter0`](https://huggingface.co/course/chapter0)**


    我们只需要写几行代码就可以使用这些预训练模型，如下所示。在 `Transformer.ipynb` Jupyter 笔记本中，我们首先安装 `transformers`：


    ![](img/Figure-7.45.jpg)


    **图 7.45:** Transformer 安装


    接下来导入：


    ![](img/Figure-7.46.jpg)


    **图 7.46:** 导入


    pipeline 是一个强大的概念，它极大地简化了工作。如工作流程所示，在数据输入模型之前，需要进行分词（tokenization）和嵌入（embedding）等若干处理步骤。使用
    pipeline 来处理这些：


    ![](img/Figure-7.47.jpg)


    **图 7.47:** 使用 pipeline


    使用分类器来执行各种 NLP 任务。在 `Classification.ipynb` 笔记本中，我们可以看到如下代码：


    ![](img/Figure-7.48.jpg)


    **图 7.48:** 分类器


    执行此代码下载 `distilbert-base-uncased-finetuned-sst-2` 模型，它返回 `POSITIVE` 或 `NEGATIVE`
    标签，以及相应的分数。


    ![](img/Figure-7.49.jpg)


    **图 7.49:**  句子


    标签为 1 表示正面：


    ![](img/Figure-7.50.jpg)


    **图 7.50:** 分类句子


    现在我们可以通过循环处理结果：


    ![](img/Figure-7.51.jpg)


    **图 7.51:** 整体情感

