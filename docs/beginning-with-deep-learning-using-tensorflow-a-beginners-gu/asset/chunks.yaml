- raw: "Hadoop was developed in the early 2000s and has matured over the years enabling\
    \ us to handle large amounts of data at a terabyte-scale with ease, including\
    \ unstructured data. In the meanwhile, data started growing at an exponential\
    \ rate. And the availability of large amounts of data helped in the revival of\
    \ machine learning, deep learning, and AI.\n\nThis is like the falling of all\
    \ the pieces of the AI puzzle. Availability of cheap hardware – including GPU's,\
    \ huge computing capacity on-demand on cloud and large amounts of data.\n\n![](images/Figure-1.14.jpg)\n\
    \n**Figure 1.14:** Hardware (**Source:** [www.fastcompany.com/3065843/artificial-intelligence-chips-race-nvidia-intel](http://www.fastcompany.com/3065843/artificial-intelligence-chips-race-nvidia-intel))\n\
    \nThis led to the revival and rapid growth of AI over the past few years.\n\n\
    # [AI adoption by industries](#toc.xhtml#s6a)\n\nNow we will see which are the\
    \ industries that are rapidly adopting AI as follows:\n\n*   **Health care**:\
    \ Health care is one of the most visible industries where AI is being adopted.\
    \ Within health care, there are three major areas where AI is being used:  \n\n\
    \    *   **Diagnostics**: Health care diagnostics involves analyzing images such\
    \ as x-ray, MRI, CT scans, and identifying, for example, the presence of cancer.\
    \ For example, IBM Watson was trained to detect and predict lung cancer. In these\
    \ scenarios, deep learning models are trained to classify images into cancerous\
    \ and non-cancerous. Once trained, these models can then predict the presence\
    \ of cancer in new images. There is still a lot of research is going on in this\
    \ space to improve the accuracy of the prediction. Doctors are using these as\
    \ productivity tools to prioritize and speed up the diagnostic process. As of\
    \ date, these cannot replace doctors. \n\n        ![](images/Figure-1.15.jpg)\n\
    \n        **Figure 1.15:** AI for healthcare (**Source:** Google)\n\n        Blindness\
    \ is another major problem facing the world. Accordingly to **World Health Organization**\
    \ (**WHO**) – 1.3 billion people have some form of vision impairment, out of which\
    \ 36 million are blind. While some forms of blindness are congenital and cannot\
    \ be prevented, many forms of blindness are avoidable if detected in time. For\
    \ example: Diabetic Retinopathy. And this is where companies like Microsoft and\
    \ Google are conducting a lot of research.\n\n        ![](images/Figure-1.16.jpg)\n\
    \n        **Figure 1.16:** Diabetic retinopathy (**Source:** [www.clinicaladvisor.com/home/topics/diabetes-information-center/fda-approves-ai-device-to-detect-diabetic-retinopathy/](http://www.clinicaladvisor.com/home/topics/diabetes-information-center/fda-approves-ai-device-to-detect-diabetic-retinopathy/))\n\
    \n    *   **Treatment**: The adoption of AI for health care treatment is not very\
    \ well known. Cancer treatment is a long and painful process. The course of treatment\
    \ needs to be planned, and it depends on several factors like the health history\
    \ of the patient and the patient's immediate family. And in countries where a\
    \ majority of the population is not covered by medical insurance – cost also can\
    \ be a factor. This is where AI can be used for recommendations. Manipal Hospital\
    \ in Bangalore, India, for example, implemented IBM Watson for cancer treatment.\
    \ \n\n        ![](images/Figure-1.17.jpg)\n\n        **Figure 1.17:** IBM Watson\
    \ (**Source:** [www.giannibarbacetto.it/wp-content/uploads/2017/03/ibmwatson\\\
    _logo-1](http://www.giannibarbacetto.it/wp-content/uploads/2017/03/ibmwatson_logo-1))\n\
    \n*   **Robotic surgery:** Robotic surgery or AI-assisted robotic surgery involves\
    \ performing surgeries using robotic arms. There are several advantages of Robotic\
    \ surgery. They are minimally invasive, due to which the patient recover faster\
    \ and the hospital time is minimal. There is less blood loss and minimum risk\
    \ of infection. \n\n    The robotic arms can be operated remotely, which means\
    \ the surgeon need not be physically present and can conduct the surgery remotely\
    \ that, in turn, means an expert surgeon can perform surgeries at multiple locations,\
    \ sitting in one place.\n\n    ![](images/Figure-1.18.jpg)\n\n    **Figure 1.18:**\
    \ Robotic surgery (**Source:** [https://www.fontanaheraldnews.com/news/inland\\\
    _empire\\_news/local-boys-suffering-ends-thanks-to-robotic-assisted-surgery-at-loma-linda-university-childrens-hospital](https://www.fontanaheraldnews.com/news/inland_empire_news/local-boys-suffering-ends-thanks-to-robotic-assisted-surgery-at-loma-linda-university-childrens-hospital))\n\
    \n*   **Automotive**: Autonomous vehicles or driverless cars have now been tested\
    \ successfully for millions of miles by several companies, including Google and\
    \ Tesla. They are still not commercially deployed on a large scale but are being\
    \ made available on an experimental basis in many locations. Let us take a look\
    \ at the functioning of an autonomous vehicle. \n\n    ![](images/Figure-1.19.jpg)\n\
    \n    **Figure 1.19:** Wymo autonomous car (**Source:** [http://globalstudieshonorstopics.blogspot.com/2017/10/self-driving-cars\\\
    _27.html](http://globalstudieshonorstopics.blogspot.com/2017/10/self-driving-cars_27.html))\n\
    \n    Autonomous vehicles have a whole set of paraphernalia attached to them.\
    \ There is a Lidar that is mounted on the top, which provides a 360 degree perspective\
    \ of obstacles around the car. A Lidar functions similar to Radar, but it uses\
    \ a laser instead of radio waves.\n\n    ![](images/Figure-1.20.jpg)\n\n    **Figure\
    \ 1.20:** Lidar (**Source:** [www.powerelectronicsnews.com/digital-power-combined-with-gan-heads-towards-99-efficiency/](http://www.powerelectronicsnews.com/digital-power-combined-with-gan-heads-towards-99-efficiency/))\n\
    \n    In addition, there are other regular radars in the front and back to detect\
    \ any immediate obstacles. There are multiple cameras providing streaming video,\
    \ which is analyzed in real-time by the onboard AI system.\n\n    It has a GPS\
    \ system to provide location information and also maps to determine the route.\
    \ The onboard AI that is a trained Neural Network model takes all the inputs from\
    \ various sensors to process and take decisions such as applying the brakes, accelerating,\
    \ or turning left or right.\n\n    For example, from the video feed from the front\
    \ cameras, the onboard AI would be able to detect if the traffic signal is Red\
    \ or Green and according stop or move forward.\n\n    Or if it detects an obstacle\
    \ in the path, it applies brakes, and so on.\n\n*   **Retail**: Retail has been\
    \ one of the early adopters of AI ad ML. The retail industry was the first to\
    \ adopt recommendation engines – on their e-commerce sites and apps. Today there\
    \ are several areas across the retail process where AI is adopted – starting from\
    \ the warehouse all the way to delivery using drones. \n\n    Warehouse management\
    \ with robots.\n\n    ![](images/Figure-1.21.jpg)\n\n    **Figure 1.21:** Warehouse\
    \ robots (**Source:** [www.istockphoto.com/photos/warehouse-robot](http://www.istockphoto.com/photos/warehouse-robot))\n\
    \n    Retail organizations have to maintain huge warehouses for quick and efficient\
    \ fulfilment. And managing these warehouses is a highly complicated task. In the\
    \ past, there was Warehouse management software developed by companies like SAP,\
    \ but even implementing such software is extremely cumbersome.\n\n    Today AI\
    \ is being adopted in the form of robots in these warehouses, especially for fulfilling\
    \ orders. This drastically reduces the time for packaging. Earlier the warehouse\
    \ employees had to manually move from bin to bin in order to put together the\
    \ items of the order and package them. Now with these robots, the employee stays\
    \ in one place and summons the bins that contain the items of the order. The robots\
    \ carry the bins. They are autonomous and move around in the warehouse without\
    \ colliding with each other or other obstacles in their way."
  fmt: "\nHadoop was developed in the early 2000s and has matured over the years enabling\
    \ us to handle large amounts of data at a terabyte-scale with ease, including\
    \ unstructured data. In the meanwhile, data started growing at an exponential\
    \ rate. And the availability of large amounts of data helped in the revival of\
    \ machine learning, deep learning, and AI.\n\nThis is like the falling of all\
