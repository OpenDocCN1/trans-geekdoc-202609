  trans: "\n接下来，我们下载并加载 BERT 模型。\n\n在将数据输入模型之前，需要对文本进行处理。我们在 RNN 的案例中也见过这种情况。上述 BERT\
    \ 预训练模型可以用于此。它们共同完成了预处理和嵌入：\n\n![](img/Figure-7.59.jpg)\n\n**图 7.59：** 下载并加载 BERT\
    \ 模型\n\n模型包含两个部分。第一部分由 BERT 层组成，其余的是普通的神经网络层。该部分的输出是与文本对应的词嵌入：\n\n![](img/Figure-7.60.jpg)\n\
    \n**图 7.60：** 构建模型\n\n此输出被输入到一个带有 `Sigmoid` 激活函数的单元神经中，以执行二分类。为了克服过拟合，添加了一个丢弃层（dropout）：\n\
    \n![](img/Figure-7.61.jpg)\n\n**图 7.61：** 模型摘要\n\n从模型摘要中可以看出，参数超过了 1 亿个：\n\n![](img/Figure-7.62.jpg)\n\
    \n**图 7.62：** 模式编译 (mode compile)\n\n在 `compile` 中，提供了优化器和损失函数 `adam` 和 `binary_crossentropy`。通过此，模型已准备好训练：\n\
    \n![](img/Figure-7.63.jpg)\n\n**图 7.63：** 训练\n\n我们对模型进行了 5 个 epoch 的训练。在普通机器上训练确实需要一些时间，5\
    \ 个 epoch 结束后，模型达到了 93% 的准确率：\n\n![](img/Figure-7.64.jpg)\n\n**图 7.64：** 训练 5\
    \ 个 epoch\n\n然后用测试数据对模型进行评估：\n\n![](img/Figure-7.65.jpg)\n\n**图 7.65：** 测试数据\n\
    \n最后一步是使用 `predict` 方法使用完全新的数据对模型进行推理。\n\n# 机器语言翻译\n\n语言翻译是另一个重要的 NLP 任务，再次，Transformers\
    \ 让翻译变得简单许多。有多个可用的预训练模型可以用于翻译。事实上，Transformers 最初是设计为机器翻译设计的。\n\n让我们再次使用 hugging\
    \ face 的 pipeline 进行翻译，看看它是如何工作的。第一步，安装 `transformers`：\n\n![](img/Figure-7.66.jpg)\n\
    \n**图 7.66：** transformer 安装\n\n对于此演示，我们还需要一个 sentence piece。接下来，导入 `pipeline`：\n\
    \n![](img/Figure-7.67.jpg)\n\n**图 7.67：** 导入 pipeline\n\n我们可以使用 `pipeline` 的实例进行翻译。我们无需指定任何模型，只需提及源语言和目标语言即可。它会自动确定模块并下载和加载它。\n\
    \n例如，我们可以提到翻译是从英语到德语：\n\n![](img/Figure-7.68.jpg)\n\n**图 7.68：** 模型已加载\n\n如所示，它自动选择了\
    \ `t5-base` 预训练模型。这是 Google 的多语言预训练 transformer 模型：\n\n![](img/Figure-7.69.jpg)\n\
    \n**图 7.69：** 从英语到德语的翻译\n\n为了交叉验证这是否正确，我们可以使用 Google translate：\n\n![](img/Figure-7.70.jpg)\n\
    \n**图 7.70：** 在 Google translate 中验证\n\n或者，我们可以创建一个从德语到英语的 pipeline 并测试它：\n\n\
    ![](img/Figure-7.71.jpg)\n\n**图 7.71：** 德语到英语的 pipeline\n\n我们也可以尝试英语到印地语：\n\n\
    ![](img/Figure-7.72.jpg)\n\n**图 7.72：** 翻译英语到印地语的 pipeline\n\n以及印地语到英语：\n\n![](img/Figure-7.73.jpg)\n\
    \n**图 7.73：** 翻译印地语到英语的 pipeline\n\n# Q&A—SQUAD\n\nQ&A 是另一个常见的 NLP 任务，在这个代码演示中，我们将看到使用训练过的\
    \ BERT 模型构建一个问答系统有多简单。`SQUAD` 名称源于训练该模型的斯坦福问答数据集（Stanford Question and Answering）。我们将使用一些额外的文本对其进行微调，模型将能够回答与此新文本相关的问题。这需要\
    \ PyTorch，为了避免安装 PyTorch 的复杂性；我们将在 Google Colab 上运行此代码。\n\n文件名为 `Bert-squad-demo.ipynb`。上传笔记本后，确保也上传了用于演示的文本文件。首先，提供了一个名为\
    \ `mohan.txt` 的文本文件，但你可以创建自己的文本文件。在执行代码所示的 [图 7.73] 之前，将此文本文件上传到 Google Colab：\n\
    \n![](img/Figure-7.74.jpg)\n\n**图 7.74：** 在 Google Colab 中上传 mohan.txt\n\n第一步通过运行\
    \ `pip install` 安装 `transformers`：\n\n![](img/Figure-7.75.jpg)\n\n**图 7.75：**\
    \ 通过 pip 安装 transformers\n\n导入所需的库：\n\n![](img/Figure-7.76.jpg)\n\n**图 7.76：**\
    \ 导入库\n\n有几个不同的预训练模型，但我们将使用：\n\n`Bert-large-uncased-whole-word-masking-finetuned-squad`\n\
    \n![](img/Figure-7.77.jpg)\n\n**图 7.77：** \"Bert-large-uncased-whole-word-masking-finetuned-squad\"\
    \ 预训练模型\n\n下载并加载模型和分词器（tokenizer）：\n\n![](img/Figure-7.78.jpg)\n\n**图 7.78：**\
    \ 下载模型和分词器\n\n准备 pipeline：\n\n![](img/Figure-7.79.jpg)\n\n**图 7.79：** 准备 pipeline\n\
    \n创建一个名为 `Q&A` 的函数，它接收上下文和问题并返回答案：\n\n![](img/Figure-7.80.jpg)\n\n**图 7.80：**\
    \ 创建 Q&A\n\n准备上下文。在这种情况下，它是从名为 `mohan.txt` 的文本文件中读取的，这是一个个人的个人简介。让我们显示上下文：\n\n\
    ![](img/Figure-7.81.jpg)\n\n**图 7.81：** 显示上下文\n\n现在让我们根据此上下文构建相关问题，并调用函数检查结果：\n\
    \n![](img/Figure-7.82.jpg)\n\n**图 7.82：** 构建 1\n\n又一个：\n\n![](img/Figure-7.83.jpg)\n\
    \n**图 7.83：** 构建 2\n\n以及最后一个：\n\n![](img/Figure-7.84.jpg)\n\n**图 7.84：** 构建最后一个问题\n\
    \n# 结论\n\n到此，我们到达了本章的结束。语音识别和 NLP 在未来几年将看到巨大的增长，这将导致人工智能的整体发展。语音将成为主要的交互模式，而不是鼠标和键盘。\n\
    \n# 延伸阅读\n\n- Transformers 论文。Attention is all you need。https://proceedings.neurips.cc/2017/file/3f5ee243547dee91f053c1c48aa.pdf\n\
    - Jay Alammar 的博客。https://jalammar.github.io/illustrated-transformer/\n\n# 索引\n\
    \nA\n\nAlphaGo\n\nAnaconda command prompt 用于安装 TensorFlow 2\n\nAnaconda Navigator\
    \ 用于安装 TensorFlow 2\n\n通用人工智能 (AGI)\n\n人工智能 (AI)\n\n关于\n\n分类\n\n人工智能 (AI) 行业\n\
    \n汽车\n\n医疗保健\n\n制造业\n\n零售\n\n机器人手术\n\n弱人工智能 (ANI)\n\n人工神经网络 (ANN)\n\n 人工神经元\n\n\
    关于\n\n对比生物神经元\n\n超级人工智能 (ASI)\n\nB\n\n双向编码器表示 (BERT)\n\n大数据\n\n二分类图像分类\n"
