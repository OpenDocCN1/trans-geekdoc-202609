    ![](img/Figure-3.44.jpg)


    **图 3.44:** 打印矩阵


    我们看到矩阵被正确创建。我们通过调用 `matmul()` 方法并传递参数 `A` 和 `B` 来执行矩阵乘法：


    ![](img/Figure-3.45.jpg)


    **图 3.45:** 使用 matmul 执行 A×B


    我们可以执行 `B×A` 并看到结果是不同的：


    ![](img/Figure-3.46.jpg)


