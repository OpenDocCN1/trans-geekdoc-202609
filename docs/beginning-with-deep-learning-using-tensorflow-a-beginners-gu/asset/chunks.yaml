    # [Unsupervised learning](#toc.xhtml#s24a)


    Clustering is the technique used for unsupervised learning. There are two common
    types of clustering:


    *   K-means clustering


    *   Hierarchical clustering


    In this demo, we will use k-means clustering to understand how it works. As mentioned
    in the earlier section, unsupervised learning is used when the data is not labelled.
    In this demo, we have data on the height and weight of several individuals, but
    there are no predefined classes and hence no labels.


    Using K-means clustering, we can group the individuals into K clusters. The K
    in K-means clustering stands for the number of clusters, and this has to be defined
    by us. Technically, K can have a value as low as 1 and as high as the number of
    observations. But to get some meaningful insights, the number of clusters is usually
    small, say 3 or 5. Once the number is defined, the algorithm finds similarities
    between each data point using all its features and creates clusters of similar
    data together.


    Now let us do the code walkthrough of the demo. As always, load the data from
    the file into a data frame. Unlike in supervised learning, there is no need to
    separate the features and the labels because there are no labels here. And there
    is also no need to split the data into test and train. The only data preparation
    step needed would be to scale the data using `StandardScaler`. This will ensure
    all the features have a uniform range:


    ![](images/Figure-2.46.jpg)


    **Figure 2.46:** Importing data set


    Let us import the data set and look at the top few records on the data set:


    ![](images/Figure-2.47.jpg)


    **Figure 2.47:** load data


    ![](images/Figure-2.48.jpg)


    **Figure 2.48:** Data set values


    We run the K-means algorithm by calling the function `KMeans` and passing the
    value for K, which is the number of clusters:


    ![](images/Figure-2.49.jpg)


    **Figure 2.49:** KMeans function


    The `fit_predict` performs the actual clustering of the data. This method returns
    a list of cluster numbers (in this case – 0, 1, 2, 3) for each record depending
    on which cluster the record belongs to. This is stored in the variable cluster:


    ![](images/Figure-2.50.jpg)


    **Figure 2.50:** cluster number


    It may be noted that in the case of unsupervised learning, there is no need to
    split the data into training and test, as there are no labels available for training
    and testing. Hence, there is no concept of the accuracy of the model. There are,
    of course, other ways of measuring the goodness of the model.'
