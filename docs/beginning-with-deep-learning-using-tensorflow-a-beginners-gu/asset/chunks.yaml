- raw: 'Here is an example. After the model is trained, if the features of an object
    of Class 2 are fed to this model, the output would be something like this:


    ![](images/Figure-4.32.jpg)


    **Figure 4.32:** Sample output


    P2 has the highest value, which means the prediction is correct. An associated
    concept is one hot encoding. To make the results quick and easy to interpret,
    the output is further processed to a one-hot encoded format. In this case, the
    output which has the maximum value is set to 1, and all others are set to 0. The
    one-hot encoded output of the previous example would be as follows:


    ![](images/Figure-4.33.jpg)


    **Figure 4.33:** One hot encoded output


    The labels of the training data also need to be one-hot encoded. And if they have
    a different format, it needs to convert to one-hot encoded before training the
    model, like in the following code example.


    Let us see a code demo of this model. We will take the iris data set, which has
    3 classes for this demo:


    ![](images/Figure-4.34.jpg)


    **Figure 4.34:** Import libraries and packages


    We import the required libraries and then load the data:


    ![](images/Figure-4.35.jpg)


    **Figure 4.35:** To load data


    A quick display of the top 5 rows shows the data is properly loaded. As always,
    we separate the features and the target:


    ![](images/Figure-4.36.jpg)


    **Figure 4.36:** To separate features and target


    Let us display the labels:


    ![](images/Figure-4.37.jpg)


    **Figure 4.37:** Displaying labels


    The labels have values 0, 1, and 2, respectively, for Classes 1, 2, and 3. As
    mentioned earlier, this needs to be converted to a one-hot encoded format. There
    is a readily available function called `get_dummies` to do this conversion:


    ![](images/Figure-4.38.jpg)


    **Figure 4.38:** One hot encoding of labels


    Now the data is ready. We create the model with three neurons:


    ![](images/Figure-4.39.jpg)


    **Figure 4.39:** Placeholders


    We start by defining the placeholders `x` and `y` for the features and labels.
    There are features, and hence, the shape of `x` is \[None,4\]. The one-hot encoded
    format of the labels has 3 columns, and hence, the share of `y` is \[None,3\].


    ![](images/Figure-4.40.jpg)


    **Figure 4.40:** Weights and bias


    Next, we define the weights and bias. Since there are 4 features and 3 neurons,
    the shape of the weight variable is \[4,3\]. And there are 3 bias values since
    there are three neurons. If you have noticed, this time, weight and bias are not
    initialized to zeros like before, but random values.


    The function `tf.truncated_normal` will generate a set of random numbers with
    a normal distribution and truncated at a standard deviation of 0.1, which is indicated
    by the parameter `stddev=0.1`.


    ![](images/Figure-4.41.jpg)


    **Figure 4.41:** Input function and activation function


    Then we create the net input function, which is fed to the Softmax activation
    function using `tf.nn.softmax` function. This is an example of a single-layer
    multi-neuron neural network. Now that the network is configured, lets us add the
    code loss function and training:


    ![](images/Figure-4.42.jpg)


    **Figure 4.42:** Loss function and optimizer


    The loss function is different from what we used earlier. Instead of `tf.nn.sigmoid_cross_entropy_with_logits`,
    we use `tf.nn.softmax_cross_entropy_with_logits_v2` which is used along with the
    Softmax activation function. The next step is to train this model:


    ![](images/Figure-4.43.jpg)


    **Figure 4.43:** Training for 100 iterations


    We do not know how many iterations will be required to properly train the model,
    so we randomly start with 100 iterations:


    ![](images/Figure-4.44.jpg)


    **Figure 4.44:** Predicted values


    When we run the test, we get an output like shown above. However, in order to
    use the `accuracy` function, we need to convert it into a one-dimension array.
    We can do this using the `argmax` functionality, remember we learned in the previous
    chapter:


    ![](images/Figure-4.45.jpg)


    **Figure 4.45:** Class label


    After running argmax on predict, the output is a one-dimensional array similar
    to the labels in `Y_label`. Now, these two values can be passed as parameter values
    to the accuracy function to calculate the accuracy:


    ![](images/Figure-4.46.jpg)


    **Figure 4.46:** Calculating accuracy


    We observe that our model has achieved 66.66% accuracy. In order to improve the
    accuracy let us train the model for 10,000 iterations and then check the results:


    ![](images/Figure-4.47.jpg)


    **Figure 4.47:** Retrain for 10000 iterations


    Now, we get 98% accuracy which is pretty good. We can also check the confusion
    matrix by calling the function `confusion_matrix` and passing the same parameter
    values:


    ![](images/Figure-4.48.jpg)


    **Figure 4.48:** To run confusion\_matrix()


    We observe that 3 of the items are getting miss-classified. If this model needs
    to be extended for multiclass classification problems with more classes, all that
    is needed to be done is add as many neurons as there are classes, and the rest
    of the code remains the same. For example, if the problem has 10 classes, then
    we will need 10 neurons. Therefore, the code needs to be modified to change the
    shape of the weight and bias to correspond to 10 neurons:


    ![](images/Figure-4.49.jpg)


    **Figure 4.49:** Classifier for 10 classes


    The rest of the code remains the same. A good example of such a problem is the
    MNIST problem.


    # [MNIST](#toc.xhtml#s52a)


    MNIST is one of the most popular neural networks case studies. Before we work
    on it, let us get a little bit of background about this project. MNIST stands
    for Modified National Institute of Standards and Technology. Modified stands for
    the modified data set that the team led by *Yann LeCun* worked with at NIST. This
    project was aimed at handwritten digit recognition using neural networks.


    We need to understand the data set before we get into writing the code. MNIST
    data set is integrated into the TensorFlow library. It consists of 70,000 handwritten
    images of digits 0 to 9:


    ![](images/Figure-4.50.jpg)


    **Figure 4.50:** MNIST data


    When we say images, you might think these are jpeg files, but they are not. They
    are actually stored in the form of pixel values. As far as the computer is concerned,
    an image is a bunch of numbers. These numbers are pixel values ranging from 0
    to 255.


    ![](images/Figure-4.51.jpg)


    **Figure 4.51:** Matrix representation of number 1


    Each of these images was of 28×28 dimension. The image is stored in the form of
    a 28×28 matrix, each cell containing a normalized pixel value ranging from 0 to
    1. Real values range from 0 to 255, but these are normalized to 0 to 1. These
    are greyscale images (commonly known as black and white), 0 indicates white, and
    1 indicates completely black, and a value in between indicates a certain shade
    of Gray. For example, in *[figure 4.51](#c04.xhtml#fig4_51)*, the number 1 is
    represented in the form of a matrix.


    The MNIST data set is split into 55,000 training images 10,000 test and 5000 validation
    images. And each image has a one-hot encoded label:


    ![](images/Figure-4.52.jpg)


    **Figure 4.52:** Label information


    Each label has an array of 10 elements (shown along the vertical axis in *[figure
    4.52](#c04.xhtml#fig4_52)*), with exactly one of them set to 1 and the rest set
    to 0. The index value of the element set to 1 specifies the digit.


    For example, in *[figure 4.52](#c04.xhtml#fig4_52),* the first image has the bit
    4 set to 1, which means the label is 4. The second image has 9 sets to 1, which
    means the label is 9, and so on. Let us work on a demo to understand this data
    better before we start building the model for classifying this data:


    ![](images/Figure-4.53.jpg)


    **Figure 4.53:** Load MNIST data


    This piece of code will download the MNIST data set to your local system. The
    parameter `one_hot=True` will make sure the labels are one-hot encoded. It takes
    a little while the first time you run this code. Subsequently, if the data is
    already available in your local system, it will not download again.'
