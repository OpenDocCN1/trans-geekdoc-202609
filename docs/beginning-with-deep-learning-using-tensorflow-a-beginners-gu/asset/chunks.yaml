  trans: '


    ![](img/Figure-1.3.jpg)


    **图 1.3：** IBM 深蓝（**来源：** [www.stream-live-tvchannel.top/ProductDetail.aspx?iid=88929267&pr=40.88](http://www.stream-live-tvchannel.top/ProductDetail.aspx?iid=88929267&pr=40.88))


    然而，不同之处，深蓝实际上只是一台每秒能评估 2 亿个位置的超级计算机。因此，它是暴力破解，而不是任何形式的学习。所以，它不是人工智能。


    随后在 2016 年 3 月，由初创公司 Deep Mind 开发的 AI —— AlphaGo 以 4 比 1 的比击败了现任围棋冠军 `李世石`。这是
    AI 领域一个真正的分水岭，即使是 AI 专家也感到震惊。并不是因为他们不相信 AI 能实现这一成就，而是因为它完成得太快了。


    Deep Mind 成立于 2013 年，其理念是开发一种能下围棋的 AI，专家们认为实现这一成就至少需要十年，甚至更久。当 AI 在不到四年的时间内实现了这一目标时，他们震惊了。随后，Google
    自然地收购了 Deep Mind：


    ![](img/Figure-1.4.jpg)


    **图 1.4：** DeepMind 的 AlphaGo（**来源：** [`247newsupdate.com/2016/03/12/computer-program-beats-human-master-in-go-game/`](https://247newsupdate.com/2016/03/12/computer-program-beats-human-master-in-go-game/))


    这是在多个层面的重大成就。首先，围棋与象棋不同，它是一个直觉的游戏，而非规则的游戏。正如 `图 1.5` 所示，它有如此多的合法位置：


    ![](img/Figure-1.5.jpg)


    **图 1.5：** 围棋中的合法位置数量


    为了方便理解背景，这超过了整个宇宙中的原子数量——是的，是整个宇宙，而不只是地球。


    所以，没有任何人能为此编写一个程序。那么，Deep Mind 是如何做到的？他们使用了一种名为 `强化学习` 的技术，这是深度学习的一种。在这种技术中，系统通过反复玩游戏来学习，可能玩了数百万次，每次都从自己的错误中学习并改进自己。


    这可能是机器在某种意义上第一次表现出直觉迹象！


    AI 世界的另一个重大事件发生在 2017 年 11 月 4 日。沙特阿拉伯授予了一个名为 `Sophia` 的类人形机器人公民身份，该机器人是由 `Hansen
    Robotics` 开发的。专家们对 `Sophia` 的能力意见不一——有人甚至认为它是假的；这恰恰说明了人们对 AI 领域的关注程度。


    ![](img/Figure-1.6.jpg)


    **图 1.6：** Sophia ([`simple.wikipedia.org/wiki/Sophia\_(robot)`](https://simple.wikipedia.org/wiki/Sophia_\(robot\)))


    # AI 的分类


    AI 分为三类，如 `图 1.7` 所示。


    ![](img/Figure-1.7.jpg)


    **图 1.7：** AI 的类型


    **弱人工智能**（**ANI**），也被称为专家系统，是一个可以执行单项任务但表现远好于人类的系统。如今的 AI，如 AlphaGo 和自动驾驶汽车就属于这一类。


    另一方面**超级人工智能**（**ASI**）也被称为奇点，是一个能够超越人类水平的系统。


    **通用人工智能**（**AGI**）是一个能够完成任何人类可以完成的任务的系统。我们目前还处于这一阶段的早期。


    以下图展示了 AI 的形式：


    ![](img/Figure-1.8.jpg)


    **图 1.8：** 奇点


    这在 AI 领域是一个巨大的里程碑。神经网络是 AI 的核心，我们将在后文中详细讨论。


    以下图展示了 AI、ML 和 DL 的关系：


    ![](img/Figure-1.9.jpg)


    **图 1.9：** AI、ML 和 DL


    深度学习是机器学习的一个子集。我们将在下一章讨论机器学习。


    # 我们是如何到达这里的？


    今天，AI 是数据科学这一领域的一部分。


    ![](img/Figure-1.10.jpg)


    **图 1.10：** 数据科学


    一切始于 90 年代开始的信息技术革命，当时我们开始创建和存储数据。最初，软件用于办公自动化——如文字处理、电子表格等，数据以文件形式存储。随后进入了企业自动化时代，出现了用于捕捉订单、管理生产和销售的应用。这是产生大量数据的开始。期间，RDBMS
    的概念诞生了。这些系统被称为**在线事务处理**（**OLTP**）。它们非常擅长捕捉数据。然而，当数据增长时，系统性能会变差，大多数 OLTP 系统都是如此。为了维持这些系统的高性能，旧数据从实时数据库中备份并存储在带子上以后检索。这使得对所有数据进行分析变得困难。这产生了数据仓库，被称为**在线分析处理系统**（**OLAP**）。


    这些系统能够存储来自不同系统的大量数据，并且查询速度快得多。数据定期从 OLTP 系统传输到 OLAP 系统——通常在每天结束时。这让 OLTP 系统保持轻量化，同时允许你在
    OLAP 系统上对历史数据进行分析。这就是*业务分析*的开始。


    '
