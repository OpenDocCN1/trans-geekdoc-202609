- raw: 'This cell contains the additional code required to train a perceptron. As
    we have seen earlier, to train a model, we have to define the loss function and
    then try to minimize this loss by changing the trainable parameters. In this case,
    the weights and bias are the trainable parameters. Recall the simple linear regression
    example we implemented in the previous chapter using the gradient descent optimizer
    since the code is very similar. Let us go line-by-line:


    ![](images/Figure-4.12.jpg)


    **Figure 4.12:** Loss function


    This line of code calculates the error. TensorFlow offers a readily available
    method `tf.nn.sigmoid_cross_entropy_with_logits` to calculate this error.


    Do not get intimidated by these weird-sounding function names. What it is doing
    is simple. It takes two parameters: labels and logits. Recall we declared `y`
    as a placeholder to capture the labels. It may be noted that `y` has not been
    used so far in our code. It is only used for comparing the error here. The other
    parameter logits take the output of the perceptron. And it calculates the error


    Y—output


    For each of the observations,


    ![](images/Figure-4.13.jpg)


    **Figure 4.13:** Calculation of average loss for the batch


    This line calculates the mean. Once again, the term `reduce_mean` may be confusing,
    but it is just the mean error value. And it takes the output of the previous line
    (`individual_loss`) as the parameter:


    ![](images/Figure-4.14.jpg)


    **Figure 4.14:** Optimizer with learning rate


    In these two lines, we instantiate a gradient descent optimizer and create a node
    to minimize the loss calculated in the previous line. Now the entire computational
    graph is ready to be executed in a session. However, we cannot execute it without
    data. We need some data to train this perceptron.


    A single perceptron may not be of much practical value, but we will use it with
    some dummy data just to understand how the perceptron training process works.
    There is a CSV file named `data.csv` which has 3 columns (label, *x*[1], *x*[2])
    and 21 rows; *x*[1] and *x*[2] are the features, and label is the target. And
    the data belong to two classes. The labels for these classes are 0 and 1, which
    are stored in the column label. We will train our perceptron to classify this
    data.


    Let us read and prepare the data first. For this, we will make use of some of
    the libraries like scikit learn, NumPy, and pandas. Let us import these libraries:


    ![](images/Figure-4.15.jpg)


    **Figure 4.15:** Importing libraries


    Then read the CSV file:


    ![](images/Figure-4.16.jpg)


    **Figure 4.16:** To read data


    The `data.head()` function displays the data. This is to check whether the CSV
    file can read properly. It will display the top 5 rows like:


    ![](images/Figure-4.17.jpg)


    **Figure 4.17:** Output using data.head()


    Next, separate the features and the labels:


    ![](images/Figure-4.18.jpg)


    **Figure 4.18:** Code to display features and labels


    This is how the features would look:


    ![](images/Figure-4.19.jpg)


    **Figure 4.19:** List of features


    And this how the labels are:


    ![](images/Figure-4.20.jpg)


    **Figure 4.20:** To display labels


    A scatter plot of the data looks as shown in *[figure 4.21](#c04.xhtml#fig4_21),*
    and it can be seen that the data can be easily separated into two distinct classes:


    ![](images/Figure-4.21.jpg)


    **Figure 4.21:** Scatter plot of the data


    Now that we have data in the required format and the entire computations graph
    is ready, we will create the session and execute the computational graph for training
    the perceptron. Let us create a session and initialize the variables:


    ![](images/Figure-4.22.jpg)


    **Figure 4.22:** Session


    As mentioned earlier, training a perceptron is nothing but finding the right values
    of the weights and bias.


    Before we train the perceptron, let us check what are the values of the weights
    and bias:


    ![](images/Figure-4.23.jpg)


    **Figure 4.23:** Weights and bias


    Weights are initialized to 0, and bias is initialized to 0 as they should be.
    Now we train the perceptron for 100 iterations to start with:


    ![](images/Figure-4.24.jpg)


    **Figure 4.24:** Training perceptron for 100 iterations


    By now, you should be able to figure out what is happening. We are executing the
    node train, which in turn takes the placeholders `x` and `y` as parameters. And
    since these are placeholders, we use the `feed_dict` and feed the data through
    `X_input` and `Y_label`, which are the features and labels, respectively.


    If there was any learning by our perceptron, its weights and bias would have changed
    their values. Let us check it out:


    ![](images/Figure-4.25.jpg)


    **Figure 4.25:** Updated weights and bias


    As we can see here, weights and bias have new values now.


    This means our perceptron got trained, and it learned. But we do not know if it
    is trained enough to classify the data. To check that, we have to test our trained
    perceptron and measure the accuracy.


    One simple way of doing it is to feed the features and see if it predicts the
    output correctly:


    ![](images/Figure-4.26.jpg)


    **Figure 4.26:** Predicted values


    This is done by executing the preceding piece of code. We first execute the node
    output but feed the features `X_input`, and this is saved to results. The result
    has the exact value calculated by the sigmoid function. In order to get the corresponding
    binary values, we use the `round()` function to round off the values to 0 or 1.


    ![](images/Figure-4.27.jpg)


    **Figure 4.27:** Rounded off predicted values


    This shows that our perceptron has predicted all of them as 0’s, which is incorrect.
    It means that our perceptron needs further training. We ran the training for only
    100 iterations. Let us re-run the training for 500 iterations:


    ![](images/Figure-4.28.jpg)


    **Figure 4.28:** Training perceptron for 500 iterations


    Now, if the run the test once again, we notice that some of the predictions and
    0 and some are 1. It looks like our perceptron has learned to classify the data.
    We would like to now measure the accuracy. Scikit-learn library offers a function
    `accuracy_score` to calculate the accuracy but passing the labels and the predicted
    values as parameters:


    ![](images/Figure-4.29.jpg)


    **Figure 4.29:** Accuracy


    Wow! It shows that our perceptron got perfectly trained. It predicted all the
    data correctly, which is 100% accuracy. We can also use the confusion matrix.
    Once again, there is a readily available function from scikit-learn, which we
    can call and pass the same two parameters:


    ![](images/Figure-4.30.jpg)


    **Figure 4.30:** confusion matrix


    Once again, this shows that the predictions are 100% correct. This is how you
    train a basic perceptron.


    How do we extend this to perform multiclass classification? This is where we introduce
    a new kind of activation function called the Softmax activation function.


    The Softmax activation function is a special type of activation function which
    is used in combination with 3 or more neurons. Keep in mind that this is not used
    with individual neurons. It is used for multiclass classification. If we want
    to build a multiclass classifier with 3 classes, we will need 3 neurons connected
    to a Softmax activation function:


    ![](images/Figure-4.31.jpg)


    **Figure 4.31:** Softmax activation function


    As seen in *[figure 4.31](#c04.xhtml#fig4_31)*, the net input function of each
    of the 3 neurons is fed to the common Softmax activation function instead of individual
    sigmoid functions.


    The Softmax activation functions give 3 outputs *P1*, *P2*, and *P3*, which are
    the probabilities of the 3 classes.


    Hence,


    *   P1, P2, P3 are each less than 1.


    *   P1 + P2 + P3 = 1


    This network is trained in such a way that P1 has a maximum value when an object
    of class 1 is fed, and P2 has the maximum value when an object of class 2 is fed,
    and similarly, P3 will have the maximum value when an object of class 3 is fed.'
  fmt: '

    This cell contains the additional code required to train a perceptron. As we have
    seen earlier, to train a model, we have to define the loss function and then try
    to minimize this loss by changing the trainable parameters. In this case, the
    weights and bias are the trainable parameters. Recall the simple linear regression
    example we implemented in the previous chapter using the gradient descent optimizer
    since the code is very similar. Let us go line-by-line:


    ![](images/Figure-4.12.jpg)


    **Figure 4.12:** Loss function


    This line of code calculates the error. TensorFlow offers a readily available
    method `tf.nn.sigmoid_cross_entropy_with_logits` to calculate this error.


    Do not get intimidated by these weird-sounding function names. What it is doing
    is simple. It takes two parameters: labels and logits. Recall we declared `y`
    as a placeholder to capture the labels. It may be noted that `y` has not been
    used so far in our code. It is only used for comparing the error here. The other
    parameter `logits` take the output of the perceptron. And it calculates the error.


    Y—output


    For each of the observations,


    ![](images/Figure-4.13.jpg)


    **Figure 4.13:** Calculation of average loss for the batch


    This line calculates the mean. Once again, the term `reduce_mean` may be confusing,
    but it is just the mean error value. And it takes the output of the previous line
    (`individual_loss`) as the parameter:


    ![](images/Figure-4.14.jpg)


    **Figure 4.14:** Optimizer with learning rate


    In these two lines, we instantiate a gradient descent optimizer and create a node
    to minimize the loss calculated in the previous line. Now the entire computational
    graph is ready to be executed in a session. However, we cannot execute it without
    data. We need some data to train this perceptron.


    A single perceptron may not be of much practical value, but we will use it with
    some dummy data just to understand how the perceptron training process works.
    There is a CSV file named `data.csv` which has 3 columns (label, `x[1]`, `x[2]`)
    and 21 rows; `x[1]` and `x[2]` are the features, and label is the target. And
    the data belong to two classes. The labels for these classes are 0 and 1, which
    are stored in the column label. We will train our perceptron to classify this
    data.


    Let us read and prepare the data first. For this, we will make use of some of
    the libraries like scikit learn, NumPy, and pandas. Let us import these libraries:


    ![](images/Figure-4.15.jpg)


    **Figure 4.15:** Importing libraries


    Then read the CSV file:


    ![](images/Figure-4.16.jpg)


    **Figure 4.16:** To read data


    The `data.head()` function displays the data. This is to check whether the CSV
    file can read properly. It will display the top 5 rows like:


    ![](images/Figure-4.17.jpg)


    **Figure 4.17:** Output using data.head()


    Next, separate the features and the labels:


    ![](images/Figure-4.18.jpg)


    **Figure 4.18:** Code to display features and labels


    This is how the features would look:


    ![](images/Figure-4.19.jpg)


    **Figure 4.19:** List of features


    And this how the labels are:


    ![](images/Figure-4.20.jpg)


    **Figure 4.20:** To display labels


    A scatter plot of the data looks as shown in [figure 4.21](#c04.xhtml#fig4_21),
    and it can be seen that the data can be easily separated into two classes:


    ![](images/Figure-4.21.jpg)


    **Figure 4.21:** Scatter plot of the data


    Now that we have data in the required format and the entire computations is ready,
    we will create a session and execute the computational graph for training the
    perceptron. Let us create a session and initialize the variables:


    ![](images/Figure-4.22.jpg)


    **Figure 4.22:** Session


    As mentioned earlier, training a perceptron is nothing but finding the right values
    of weights and bias. Before we train the perceptron, let us check what are the
    values of weights and bias:


    ![](images/Figure-4.23.jpg)


    **Figure 4.23:** Weights and bias


    Weights are initialized to 0, and bias is initialized to 0 as they should be.
    Now we train the perceptron for 100 iterations to start with:


    ![](images/Figure-4.24.jpg)


    **Figure 4.24:** Training perceptron for 100 iterations


    By now, you should be able to figure out what is happening. We are executing the
    node train, which in turn takes the placeholders `x` and `y` as parameters. And
    since these are placeholders, we use the `feed_dict` and feed the data through
    `X_input` and `Y_label`, which are the features and labels, respectively. If there
    was any learning by our perceptron, its weights and bias would have changed their
    values. Let us check it out:


    ![](images/Figure-4.25.jpg)


    **Figure 4.25:** Updated weights and bias


    As we can see here, weights and bias have new now. This means our perceptron got
    trained, and it learned. But we do not know if it is trained enough to classify
    the data. To check that, we have to test our trained perceptron and measure the
    accuracy. One simple way of doing it is to feed the features and see if it predicts
    the output correctly:


    ![](images/Figure-4.26.jpg)


    **Figure 4.26:** Predicted values


    This is done by executing the preceding piece of code. We first execute the node
    output but feed the features `X_input`, and this is saved to results. The result
    has the exact value calculated by the sigmoid function. In order to get the corresponding
    binary values, we use the `round()` function to round off the values to 0 or 1.


    ![](images/Figure-4.27.jpg)


    **Figure 4.27:** Rounded off predicted values


    This shows that our perceptron has predicted all of them as 0, which is incorrect.
    It means that our perceptron needs further training. We ran the training for only
    100 iterations. Let us re-run the training for 500 iterations:


    ![](images/Figure-4.28.jpg)


    **Figure 4.28:** Training perceptron for 500 iterations


    Now, if the run the test once again, we notice that some of the predictions are
    0 and some are 1. It looks like our perceptron has learned to classify the data.
    We would like to now measure the accuracy. Scikit-learn library offers a function
    `accuracy_score` to calculate the accuracy but passing the labels and the predicted
    values as parameters:


    ![](images/Figure-4.29.jpg)


    **Figure 4.29:** Accuracy


    Wow! It shows that our perceptron got perfectly trained. It predicted all the
    data correctly, which is 100% accuracy. We can also use the confusion matrix.
    Once again, there is a readily available function from scikit-learn, which we
    can call and pass the same two parameters:


    ![](images/Figure-4.30.jpg)


    **Figure 4.30:** confusion matrix


    Once again, this shows that the predictions are 100% correct. This is how you
    train a basic perceptron.


    ### Multiclass Classification


    How do we extend this to perform multiclass classification? This is where we introduce
    a new kind of activation function called the Softmax activation function.


    The Softmax activation function is a special type of activation function which
    is used in combination with 3 or more neurons. Keep in mind that this is not used
    with individual neurons. It is used for multiclass classification. If we want
    to build a multiclass classifier with 3 classes, we will need 3 neurons connected
    to a Softmax activation function:


    ![](images/Figure-4.31.jpg)


    **Figure 4.31:** Softmax activation function


    As seen in [figure 4.31](#c04.xhtml#fig4_31), the net input function of each of
    the 3 neurons is fed to the common Softmax activation function instead of individual
    sigmoid functions.


    The Softmax activation functions give 3 outputs `P1`, `P2`, and `P3`, which are
    the probabilities of the 3 classes. Hence,


    *   `P1`, `P2`, `P3` are each less than 1.

    *   `P1 + P2 + P3 = 1`


    This network is trained in such a way that `P1` has a maximum value when an object
    of class 1 is fed, and `P2` has the maximum value when an object of class 2 is
    fed, and similarly, `P3` will have the maximum value when an object of class 3
    is fed.

