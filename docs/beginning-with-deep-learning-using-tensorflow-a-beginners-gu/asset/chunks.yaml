    在本节中，我们将学习如何构建一个多分类分类器。与之前的示例不同，之前的图像仅属于两个类别——`cats`（猫）和`dogs`（狗）。在这个多分类场景中，我们将从构建一个三分类分类器开始，它可以扩展到任意数量的类别。由于我们使用的是
    Keras，大部分过程与之前相同。例如，数据存储在与之前结构相同的文件夹中，其中我们有一个主子文件夹，在该子目录下有训练数据集，然后是测试数据集，在训练文件夹内，每个类别都有一个文件夹。在这种情况下，我们将三个类别：其中一类是四轮车的图像，然后是自行车和飞机，这就是我们可用的三个类别，相应的，图像也保存在相同的文件夹结构中。本示例与上一个示例的主要区别在于神经网络模型。当我们在构建神经网络模型时会发现，区别在于：在之前的示例中，最后一层由
    `Softmax` 层组成，由于我们有三个类别，该层有三个神经元；而在上一个示例中，它是一个二分类器，因此最后一层只有一个神经元。


    在开始编写代码之前，让我们先来看看文件夹的结构：


    ![](img/Figure-6.56.jpg)

    **图 6.56:** 根目录


    `data` 下的子文件夹如下：


    ![](img/Figure-6.57.jpg)

    **图 6.57:** 子文件夹


    在 `train` 文件夹下，


    ![](img/Figure-6.58.jpg)

    **图 6.58:** 展开的"train"文件夹


    图像文件存储在对应的文件夹中。例如，这是子文件夹 `airplane`（飞机）中的图像示例：


    ![](img/Figure-6.59.jpg)

    **图 6.59:** "airplane"文件夹中的图像


    测试数据也存在类似的结构。现在让我们进入代码。一如既往，我们从加载所有需要的库开始：


    ![](img/Figure-6.60.jpg)

    **图 6.60:** 导入库和包


    接下来，我们将构建神经网络模型。第一部分是卷积层：


    ![](img/Figure-6.61.jpg)

    **图 6.61:** 特征提取块


    在此处，有三对卷积层和最大池化层（Maxpooling layers）。随后是一个具有 64 个神经元的全连接层（dense layer）：


    ![](img/Figure-6.62.jpg)

    **图 6.62:** 全连接层


    然后最后一层是由三个神经元组成的 `Softmax` 层：


    ![](img/Figure-6.63.jpg)

    **图 6.63:** Softmax 层


    这是该模型与之前示例中使用的二分类器模型之间的主要区别。注意，在之前的示例中，对于二分类器，最后一层有一个带有 Sigmoid `activation`（激活）函数的神经元。而在本示例中，最后一层有三个带有
    Softmax `activation` 激活函数的神经元。稍后如果你需要为 100 个类别构建模型，你只需要将神经元的数量增加到 100；或者对于 1000
    类的分类器，这最后一层将有 1000 个带有 Softmax `activation` 激活函数的神经元。


    下一步是调用 `compile` 方法来指定损失函数和优化器：


    ![](img/Figure-6.64.jpg)

    **图 6.64:** 编译（Compile）


    让我们使用 `summary` 方法检查模型的配置：


    ![](img/Figure-6.65.jpg)

    **图 6.65:** 模型摘要


    我们的模型有略 100 万个可训练参数。现在模型已经准备就绪，让我们准备数据。创建两个 `ImageDataGenerator` 实例，分别用于 `Train`（训练）和
    `Test`（测试）：


    ![](img/Figure-6.66.jpg)

    **图 6.66:** ImageDataGenerator 实例


    使用这些实例加载训练和测试数据：


    ![](img/Figure-6.67.jpg)

    **图 6.67:** 训练和测试数据


    现在模型和数据都准备就绪，是时候训练模型了。我们将训练五个 epoch（轮次）：


    ![](img/Figure-6.68.jpg)

    **图 6.68:** 模型训练


    模型达到了超过 70% 的准确率，这已经足够运行一些推理并查看其预测是否正确。如果你需要更高的准确率，可以运行更多的 epoch。用于推理的图像存储在名为
    `inference` 的文件夹中，这些图像在 `ie` 之前模型从未见过。这些图像既不在 `train` 文件夹中也不在 `test` 文件夹中。


    让我们从一张汽车的图像开始：


    ![](img/Figure-6.69.jpg)

    **图 6.69:** 加载测试图像


    如之前解释，在我们使用 `predict` 方法运行推理之前，图像必须转换为 NumPy 数组并进行重塑（reshape）：


    ![](img/Figure-6.70.jpg)

    **图 6.70:** 数据准备


    现在，我们通过调用 `predict` 方法运行推理：


    ![](img/Figure-6.71.jpg)

    **图 6.71:** 推理


    观察发现输出是 Softmax 分类器的热编码（one-hot encoded）输出。这是一个带有三个值的数组，第二个位置设置为 1。这意味着模型预测该图像属于第二个类别。


    Keras 根据类别名称按字母顺序分配类别数字，这反过来与文件夹名称相同。例如，在这种情况下，测试和训练文件夹中的文件夹名称分别为 `airplane`（飞机）、`car`（汽车）和
    `motorbike`（摩托车），如所示：


    ![](img/Figure-6.72.jpg)

    **图 6.72:** 文件夹名称


    因此，类别 `airplane` 被分配为数字 0，`car` 为 1，`motorbike` 为 2。这些信息由 Keras 存储在 `class_indices`
    属性中，我们可以通过运行以下命令来检查这一点：


    ![](img/Figure-6.73.jpg)

    **图 6.73:** 类别索引


    Softmax 输出将与此对应。如果结果为 `[1,0,0]`，意味着模型预测图像为 `airplane`。如果结果为 `[0,1,0]`，意味着模型预测图像为
    `car`；如果结果为 `[0,0,1]`，则意味着它预测图像为 `motorbike`。

