    \ of learning\n\nBefore getting into the details of the algorithms, it is a good\
    \ idea to set up the environment, as the algorithms will be explained with hands-on\
    \ examples.\n\n# [Setting up the environment](#toc.xhtml#s14a)\n\nYou can get\
