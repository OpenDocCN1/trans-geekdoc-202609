    Now the question is how to determine the value of `k` (that is, the number of
    clusters). This should not be confused with classification. In the case of classification,
    the number of classes is known because we have the labels for the classes. But
    in the case of clustering, we do not know what should be the right number of clusters.
    Technically, the data can be split into any number of clusters (that is, `K` can
    have any value). But practically, that will not make sense.


    There is a technique called the elbow technique that is used for determining the
    optimum value of `k`. The name comes from the shape of the plot of the `wcss`
    and the number of clusters.


    One of the ways of measuring the performance of the model is `wcss` – short form
    for a within-cluster sum of squares. This is the sum of the square of the distance
    of each point in a cluster from its centroid. The smaller the value of this number,
    the better. A smaller value means the items in a cluster are very similar. The
    value of `wcss` varies with the value of `k`. when these values are plotted; the
    graph takes the shape of a bent elbow:


    ![](images/Figure-2.51.jpg)


    **Figure 2.51:** Elbow method


    For a certain value of `k`, the `wcss` value tapers off. This is the optimum value
    of `k`. In order to achieve this, we create a `for` loop for `k` starting from
    1 to 10 or 15 and calculate the value of `wcss` and plot it:


    ![](images/Figure-2.52.jpg)


    **Figure 2.52:** wcss plot


    From the plot, the optimum value of `k =4`:


    ![](images/Figure-2.53.jpg)


    **Figure 2.53:** Cluster plot, k=4


    The code for this is available on GitHub.


    For now, this is all you need to know about machine learning and scikit-learn.
    Many of these concepts will be reused when we talk about deep learning. We will
    also reuse some of the code, especially the methods `accuracy_score`, `train_test_split`,
    and `confusion_matrix`.


