- raw: 'So far, we have performed image classification with MNIST, which is an internal
    data set. This is a great way to start to understand how CNN works without worrying
    much about loading and preparing external data. In this section, we are going
    to import external data. Keras provides very powerful functionality to easily
    perform image classification. We start with binary classification using the legendary
    cat/dog data. This is like the "`Hello world`" of image classification. The data
    is in the form of JPEG files. They are split into training and test data sets.
    And each data set has several images of cats and dogs. Labeling of this data is
    very simple. All the images of dogs are stored in a folder named `dogs,` and all
    the images of cats are stored in a folder named `cats`. Keep in mind that there
    are several ways in which data can be labeled. This is one of the ways.


    This is the folder structure of the data:


    ![](images/Figure-6.37.jpg)


    **Figure 6.37:** Folder structure of data


    Now that we got an understanding of the data set let us jump into the code. The
    main difference between this example and the previous example is in the way the
    data is loaded and prepared. The CNN model building process remains the same.


    So, as always, we import all the required libraries, and we can see that we are
    on TensorFlow 2:


    ![](images/Figure-6.38.jpg)


    **Figure 6.38:** Load the libraries


    Note that if we try `from tf.keras.models import Sequential` it will give an error—we
    have to use `tensoflow.keras.models`. Also, important to note that this is the
    only difference between TF1.x code and TF2.x code.


    In TF1.x, the import looked like this:


    ![](images/Figure-6.39.jpg)


    **Figure 6.39:** TF1.x code


    Rest of the code remains the same. Next, we build the CNN model, like in the case
    of MNIST. The code is pretty much the same except in two places:


    *   `input_shape`: In this case, the size of the input images is 64×64 color images;
    hence, the input shape is 64×64×3.


    *   The last layer has Sigmoid instead of Softmax. This was explained in the previous
    chapter. Since this is a binary classifier, we need one neuron with Sigmoid activation
    function. In the case of MNIST, it was a 10-class classifier, and hence, Softmax
    with 10 neurons was used.


    ![](images/Figure-6.40.jpg)


    **Figure 6.40:** Create the model


    In compile, we add `adam` optimizer and use the loss function `binary_crossentropy`:


    ![](images/Figure-6.41.jpg)


    **Figure 6.41:** Compile


    This is the configuration of the CNN model.


    ![](images/Figure-6.42.jpg)


    **Figure 6.42:** Model summary


    This has 370,817 trainable parameters. Now that the model is ready let us import
    the data and prepare it to feed to the model for training.


    Keras makes it really easy to do this. We import and create two instances of `ImageDataGenerator`,
    one each of training data and test data:


    ![](images/Figure-6.43.jpg)


    **Figure 6.43:** DataGenerator instances


    Although creating these instances, we provide a normalization value to the parameter
    `rescale`. The function `flow_from_directory` is used to specify the path where
    the data is stored:


    ![](images/Figure-6.44.jpg)


    **Figure 6.44:** Training data path


    Recall the directory structure of the dataset mentioned above. The first parameter
    is the directory path. This can be either a relative path or an absolute path.
    The exact syntax can vary depending on whether you are running Windows or Mac/Linux.
    The above syntax is for Windows. In addition, we have to specify the `target_size`.
    This should be the same as the `input_size` specified for the model. Note that
    this need not be equal to the actual size of the images. Although you get the
    best performance when the actual size is equal to the `input_size` and `target_size`,
    this will work with images of any size. However, while loading the images, they
    are resized to `target_size`. If the `target_size` is different from the `input_size`,
    you will get an error while training the model.


    The next parameter `class_mode` specifies what type of classification it is. In
    this case, since we are building a binary classifier, the value is set to `binary`.


    When this cell is executed, it checks for the validity of the directory path and
    checks the number of images and the number of classes:


    ![](images/Figure-6.45.jpg)


    **Figure 6.45:** Training data


    In this case, there are 98 images combined in two classes. It is interesting to
    note that the number of classes is determined by the number of sub-folders in
    the specified directory. In our case, there are only two subfolders, `cats` and
    `dogs`, and hence, it knows there are two classes. However, if you add additional
    subfolders, it will calculate the number of classes equal to the number of subfolders:


    ![](images/Figure-6.46.jpg)


    **Figure 6.46:** Class indices


    The class labels and the corresponding numeric values are stored in the attribute
    `class_indices`. As shown in the preceding class label is the name of the folder,
    and the numeric value is assigned in alphabetical order starting from 0. A similar
    process is followed for the test data set using the `test_datagen,` and the path
    for the test data set is provided. In this case, `dataset\test_set`.


    ![](images/Figure-6.47.jpg)


    **Figure 6.47:** Test data


    The test data set has 38 images. Now that the data is prepared, the next step
    is to train the model:


    ![](images/Figure-6.48.jpg)


    **Figure 6.48:** Model training


    On executing this cell, the training process gets triggered. In this case we train
    the model for five epochs. At the end of the training process, it is seen that
    the model offers an accuracy of 63%.


    Now that the model is trained let us run the inference with a test image of a
    dog. We start by loading the image from the path `\data\inference`:


    ![](images/Figure-6.49.jpg)


    **Figure 6.49:** Load test image


    By using the parameter target size, the image is resized to 64×64 to match with
    the input size provided while creating the model. Recall the parameter `input_shape`
    in the first layer of our CNN model. It was set to 64×64.


    This will ensure we do not get an error in case the actual size of the image is
    different. Note that ideally, `input_shape` value should be equal to the actual
    size of the images of the train and test data set. However, in real life, it is
    not always possible to ensure this. Hence, this is a good way of overcoming the
    error.


    Next, we check whether the image is loaded properly or not by displaying the image:


    ![](images/Figure-6.50.jpg)


    **Figure 6.50:** Display test image


    We observe that the image of the dog is loaded properly. It is then converted
    to a NumPy array before feeding to the model:


    ![](images/Figure-6.51.jpg)


    **Figure 6.51:** Data preparation


    The model expects an array of images since that is how it has been trained. Since
    we have only one image, it needs to be converted into an array of one image. This
    is done by simply reshaping the image as follows:


    ![](images/Figure-6.52.jpg)


    **Figure 6.52:** Reshape


    This completes the data preparation process. Now the image is ready to be fed
    to the model for inference. We run inference by calling the method `predict`:


    ![](images/Figure-6.53.jpg)


    **Figure 6.53:** Inference


    This returns a Number 0 or 1 since this is a binary classifier. Where 0 indicates
    cat and 1 indicates dog. To make it easy for the user to understand, we write
    a small function to convert these numbers to the corresponding text as follows:


    ![](images/Figure-6.54.jpg)


    **Figure 6.54:** Result


    The label is then printed. And in this case, it is seen that the model predicted
    the image correctly as a dog. Now, we can try with a different image of a cat
    to see if it is predicted correctly:


    ![](images/Figure-6.55.jpg)


    **Figure 6.55:** Second inference


    The same steps are followed once again, and it is seen the model predicts this
    image of a cat correctly.


    # [Multiclass image classification](#toc.xhtml#s79a)'
