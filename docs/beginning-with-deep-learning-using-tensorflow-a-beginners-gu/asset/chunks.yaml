    # [Conclusion](#toc.xhtml#s87a)


    This brings us to the end of this chapter. Image recognition is an important component
    of artificial intelligence and deep learning, and in this chapter, we discussed
    how Image recognition works using **Convolution Neural Networks (CNN)**, and we
    went through a variety of code demos and examples.


    In the upcoming chapter, we will discuss another important component of AI, that
    is, speech recognition.


    # [Points to remember](#toc.xhtml#s88a)


    *   Convolutional Neural Networks are used for image recognition.


    *   Pre-trained models like VGG16 and ResNet are available for free for image
    classification.


    *   Transfer learning can be used to create classification models when training
    data is small.


    *   Object detection has many practical applications as it identifies multiple
    objects in an image.


    # [CHAPTER 7](#toc.xhtml#c07)


    # [Speech Recognition](#toc.xhtml#c07)


    # [Introduction](#toc.xhtml#s89a)


    Image recognition and speech recognition are the two main sub-domains within artificial
    intelligence and deep learning today. In the previous chapter, we have seen how
    image recognition works. In this chapter, we will see how speech recognition works
    and what are some of its applications. For many years there was very slow progress
    in the area of speech recognition. But over the past few years, there have been
    a lot of significant developments, particularly with the advent of transformers.
    Part of the reason for the slow progress is the complexity of speech recognition.
    Before we begin, let us clarify the terminology. "*Speech recognition*" was originally
    coined to mean interpretation of speech, which is just one part of the entire
    process, but today speech recognition refers to the entire end to end process
    of recognizing human speech, converting it to text for **Natural Language Processing**
    (**NLP**) and converting back the result to speech (*synthesis*). In this chapter,
    we will discuss the entire end-to-end process.


    # [Structure](#toc.xhtml#s90a)


    In this chapter, the following topics will be covered:


    *   What is speech recognition?—Historical perspective


    *   How speech recognition works?


    *   Natural language processing (NLP)


    *   Language models


    *   Word Embedding—Word2Vec


    *   Recurrent Neural Networks (RNN)


    *   Text classification with RNN


    *   Transformers


    *   Text classification with BERT


    *   Q&A with BERT—SQUAD


    # [Objective](#toc.xhtml#s91a)


    After reading this chapter, you will be able to understand the concepts of speech
    recognition and NLP using deep learning. Some of the latest techniques, like transformers,
    are covered here with hands-on code demos to help you try them out and grasp the
    concepts faster.


    # [What is speech recognition?—Historical perspective](#toc.xhtml#s92a)


    We human beings have been fascinated by the concept of talking to machines or
    computers, and this is well depicted in several science fiction movies like Star
    Wars.


    The first non-voice recognition device was developed by the scientists at bell
    laboratories in 1952; this was known as Audrey or audio digit recognition; this
    is similar to the handwriting recognition that we saw in the image recognition
    chapter; this device could recognize the spoken numbers or digits from zero to
    nine and was considered to be a breakthrough innovation. This was only able to
    recognize the discrete spoken numbers. In the early sixties, IBM developed Shoebox,
    which was able to take simple mathematical operation commands. It was able to
    recognize 16 spoken words, including the numbers 0–9 (refer to *[figure 7.1](#c07.xhtml#fig7_1)*):


    ![](images/Figure-7.1.jpg)


    **Figure 7.1:** Early trends of speech recognition


    Speech recognition has come a long way since then. Today''s speech recognition
    systems can work with a vocabulary of thousands of words with a high level of
    accuracy.


    # [Application of speech recognition](#toc.xhtml#s93a)


    Speech recognition is very prevalent today; almost everyone uses speech recognition
    on day-to-day basis applications, such as Siri, okay Google, and speech-enabled
    chatbots are good examples of speech recognition applications. Speech recognition
    makes it very easy to interact with machines, and therefore, there is a lot of
    interest in this space.


    Speech recognition, unlike image recognition, is a much more complicated process
    as it involves multiple steps. In image recognition, the input is an image, and
    the neural network classifier test result there is no conversion of an image into
    skills about technicians for completed because the neural network cannot process
    the raw audio. Therefore, the raw audio needs to be converted to text which can
    be processed by the neural network using natural language processing or anything;
    this further results in text, and this text is further converted voice, much known
    as synthesis process much more complicated as compared with image recognition.


    Today''s speech recognition systems work as shown in the following figure:


    ![](images/Figure-7.2.jpg)


    **Figure 7.2:** Speech recognition process


    It is a multistep process. The voice signal is converted to text, which is then
    processed using NLP, and the resulting text response is converted back to a speech
    by the process known as synthesis. In this process, NLP plays a key role, and
    it, in turn, has multiple components. Deep learning had a major impact on the
    recent developments in the NLP space, and this will be our focus in this chapter.
    There is already a lot of literature around speech to text and text to speech
    as they have existed for a long time. Hence, we will focus on NLP in this chapter.


    NLP has the following components:


    *   Word embedding


    *   Language models


    *   Sequence to sequence models—RNN, LSTM, and GRU


    *   Transformers


    Before we begin, let us first take a quick look at a very simple demo of speech
    to text and text to speech.


    The Jupyter notebook, `speechrecog.ipynb` is available in the GitHub link which
    is provided in the Appendix. This has two parts. One is speech to text, in which
