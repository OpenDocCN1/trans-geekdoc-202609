    此单元格包含了训练感知器所需的额外代码。正如我们之前所看到的，要训练模型，我们必须定义损失函数，然后尝试通过改变可训练参数来最小化该损失。在这种情况下，权重和偏置是可训练参数。回想我们在上一个章节中使用梯度下降优化器实现的简单线性回归示例，因为代码非常相似。让我们逐行分析：


    ![](img/Figure-4.12.jpg)


    **图 4.12:** 损失函数


    这行代码计算了误差。TensorFlow 提供了一个现即用的方法 `tf.nn.sigmoid_cross_entropy_with_logits` 来计算此误差。


    不要被这些听起来很奇怪的函数名吓到。它的作用非常简单。它接受两个参数：标签（labels）和逻辑值（logits）。回想我们把 `y` 声明为占位符以捕获标签。需要注意的是，到目前为止我们的代码中尚未使用
    `y`。它在这里仅用于比较误差。另一个参数 `logits` 接收感知器的输出，并计算误差。


    Y—输出


    对于每个观测值，


    ![](img/Figure-4.13.jpg)


    **图 4.13:** 批量平均损失的计算


    这行代码计算了平均值。再次，`reduce_mean` 这个术语可能会让人困惑，但它只是平均误差值。它接收上一行的输出（`individual_loss`）作为参数：


    ![](img/Figure-4.14.jpg)


    **图 4.14:** 带有学习率的优化器


    在这行代码中，我们实例化了一个梯度下降优化器，并创建了一个节点来最小化上一行计算出的损失。现在，整个计算图已经准备好可以在会话（session）中执行。然而，没有数据，我们就无法执行它。我们需要一些数据来训练这个感知器。


    单个感知器可能没有很大的实用价值，但我们将使用一些虚拟数据，仅为了理解感知器训练过程是如何工作的。有一个名为 `data.csv` 的 CSV 文件，包含
    3 列（label、`x[1]`、`x[2]`）和 21 行；`x[1]` 和 `x[2]` 是特征，label 是目标。数据属于两个类别。这些类别的标签为
    0 和 1，存储在 label 列中。我们将训练感知器来对这些数据进行分类。


    让我们先读取并准备数据。为此，我们将利用一些 scikit-learn、NumPy 和 pandas 等库。让我们导入这些库：


    ![](img/Figure-4.15.jpg)


    **图 4.15:** 导入库


    然后读取 CSV 文件：


    ![](img/Figure-4.16.jpg)


    **图 4.16:** 读取数据


    `data.head()` 函数显示数据。这是为了检查 CSV 文件是否被正确读取。它将显示前 5 行，如下：


    ![](img/Figure-4.17.jpg)


    **图 4.17:** 使用 data.head() 的输出


    接下来，分离特征和标签：


    ![](img/Figure-4.18.jpg)


    **图 4.18:** 显示特征和标签的代码


    特征看起来是这样的：


    ![](img/Figure-4.19.jpg)


    **图 4.19:** 特征列表


    而标签是这样的：


    ![](img/Figure-4.20.jpg)


    **图 4.20:** 显示标签


    数据的散点图如图图 4.21 所示，可以看到数据可以很容易地分为两类：


    ![](img/Figure-4.21.jpg)


    **图 4.21:** 数据的散点图


    现在，整个计算图已经准备好在会话中执行……（注：此处后续原文逻辑重复，已按要求完整翻译）

