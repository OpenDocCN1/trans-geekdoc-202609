- raw: "Now that you have a good idea of how TensorFlow programming works, in general,\
    \ let us see how we apply this in machine learning and specifically for training\
    \ a model. For this, we will take the very basic ML algorithm – simple linear\
    \ regression, which is represented in the simplest form as an equation of a straight\
    \ line as follows:\n\n*Y = w\\*X+b*\n\nFor a given data set, training of this\
    \ model means – finding the right values of `w` and `b`.\n\nOne way of doing this\
    \ is using brute force and try all possible values for `w` and `b`. These are\
    \ also referred to as trainable parameters. Let us write the code for this:\n\n\
    ![](images/Figure-3.58.jpg)\n\n**Figure 3.58:** Code for trainable parameters\n\
    \nWe start by initializing variables for `w` and `b` to some random values (.2\
    \ and –.2):\n\n![](images/Figure-3.59.jpg)\n\n**Figure 3.59:** Placeholders for\
    \ x and y\n\nWe create placeholders `x` and `y` for training data. `X` is the\
    \ feature, and `y` are the label/target:\n\n![](images/Figure-3.60.jpg)\n\n**Figure\
    \ 3.60:** Defining the linear model\n\nThen we define our model. Keep in mind\
    \ that we are first creating the computational graph, and then we will execute\
    \ it in the session:\n\n![](images/Figure-3.61.jpg)\n\n**Figure 3.61:** loss function\n\
    \nNext, we create the error or loss function. Cell 5 needs some additional explanation.\n\
    \n`Linear_model` is the predicted value. That is, during the training process,\
    \ we pass the value of `x,` and the output is predicted by the model. Note that\
    \ it is not *y* which is the label. This is the predicted value. Therefore, the\
    \ difference between the predicted value (`linear_model`) and `y` (label) gives\
    \ the error.\n\nThis error can be +ve or –ve based on whether the predicted value\
    \ is larger than the label value or vice versa. `tf.square()` squares the error\
    \ so that all the values are positive.\n\nThe next line is simply the sum of all\
    \ these squares. Do not get confused by the name of the method `reduce_sum`. `tf.reduced_sum`\
    \ (squared) provides the sum of squares of the errors of the data set:\n\n![](images/Figure-3.62.jpg)\n\
    \n**Figure 3.62:** Session\n\nAfter the creation of the graph, we create the session\
    \ and initialize the variables before executing the graph in the session:\n\n\
    ![](images/Figure-3.63.jpg)\n\n**Figure 3.63:** Initializing variables\n\nThis\
    \ line is the actual execution of the graph. Let us spend some time to understand\
    \ this.\n\nThe node we are executing is loss which is a function of the node squared,\
    \ which in turn is a function of `linear_model` and `y`. `linear_model` is in\
    \ turn dependent on `x`. Therefore, the loss is dependent on `x` and `y`, which\
    \ are placeholders. Therefore, we feed `x` and `y` using the `feed_dict`. And\
    \ the values being fed are as follows:\n\n*X*\\=\\[1,2,3,4\\]\n\nAnd\n\n*Y*\\\
    =\\[0, –1, –2, –3\\]\n\nThis is the training data. And the loss calculated is\
    \ 20.16. We have to minimize this value by changing the values of the trainable\
    \ parameters *W* and *b*.\n\nNow, let us try to manually change the values of\
    \ `W` and `b` by reinitializing them to different values and running the session\
    \ again.\n\n![](images/Figure-3.64.jpg)\n\n**Figure 3.64:** Re-run the session\n\
    \n*W* and *b* are reinitialized to .3 and –.3, respectively:\n\n![](images/Figure-3.65.jpg)\n\
    \n**Figure 3.65:** To print loss value\n\nNow we get the loss value of 23.66 which\
    \ is higher than the previous value. Let us try one more set of values for `W`\
    \ and `b`:\n\n![](images/Figure-3.66.jpg)\n\n**Figure 3.66:** initializing\n\n\
    *W* and *b* are reinitialized to –1.0 and 1.0, respectively.\n\n![](images/Figure-3.67.jpg)\n\
    \n**Figure 3.67:** Loss value = 0\n\nAnd the loss is finally reduced to 0.\n\n\
    This is what happens behind the scenes during the training process. The values\
    \ of the parameters *W* and *b* are being updated continuously in order to reduce\
    \ the loss. If we have to automate this process, we can use an optimizer provided\
    \ by TensorFlow. In order to do that, we update the code as shown here:\n\n![](images/Figure-3.68.jpg)\n\
    \n**Figure 3.68:** Applying Optimizer\n\nAn instance of the optimizer is created\
    \ and named optimizer. It takes a parameter called learning rate—in this case,\
    \ it is .01. We will discuss about learning rate later on.\n\nThen we use the\
    \ minimize method of the optimizer to minimize the loss. The node `train`, when\
    \ executed in a recursive manner in a session, will automatically change the trainable\
    \ parameters `W` and `b` in order to reduce the loss:\n\n![](images/Figure-3.69.jpg)\n\
    \n**Figure 3.69:** To use train()\n\nThe node `train` is executed in a session\
    \ in a loop for 1000 iterations. When we print **W** and `b`, we find that it\
    \ found the correct values of `W (—1.0)` and `b(1.0)`, which we have seen earlier\
    \ gave a loss value of 0.\n\nThis can be verified by executing the node `loss`\
    \ in the session:\n\n![](images/Figure-3.70.jpg)\n\n**Figure 3.70:** To calculate\
    \ loss value\n\nIt returns 0. Although we have used the `GradientDescentOptimizer`\
    \ in this case, TensorFlow offers a variety of optimizers. The functioning of\
    \ `GradientDescentOptimizer` will be explained in the Neural Networks chapter.\
    \ Here, the focus is on writing the code, and hence, the detailed explanation\
    \ of the functioning of the `GradientDescentOptimizer` is deferred to the next\
    \ chapter.\n\n# [Applying optimizer to solve simple mathematical problems](#toc.xhtml#s40a)\n\
    \nIn order to help us get a better understanding of the use of the optimizer,\
    \ let us take a very simple mathematical example of solving a quadratic equation\
    \ using the `GradientDescent` optimizer.\n\nIn this demo, we will solve the following\
    \ quadratic equation:\n\n*(i.e., in code, x\\*\\*2-10\\*x + 25)*\n\nAnd the code\
    \ is here:\n\n![](images/Figure-3.71.jpg)\n\n**Figure 3.71:** Solving quadratic\
    \ equation\n\nWe first start building the computational graph. Initialize `x`\
    \ to 0 and any other random value. And create a node called **cost** that defines\
    \ the left side of the quadratic equation, which needs to be minimized (to 0):\n\
    \n![](images/Figure-3.72.jpg)\n\n**Figure 3.72:** instantiate optimizer\n\nNext,\
    \ we create an instance of the optimizer and the `train` node to minimize the\
    \ cost function:\n\n![](images/Figure-3.73.jpg)\n\n**Figure 3.73:** result after\
    \ 500 iterations\n\nIf we execute this for 500 iterations in a session, it determines\
    \ the value of *x*, which is 5 (4.9999886)—the solution to this quadratic equation.\n\
    \nYou can try this out with another example:\n\n# [Conclusion](#toc.xhtml#s41a)\n\
    \nThis brings us to the end of this chapter. TensorFlow programming can be tricky\
    \ even for experienced programmers, but once you get the hang of it, it is really\
    \ very powerful for developing and training Neural Networks. In case you feel\
    \ some parts are still fuzzy, it may be a good idea to read through this chapter\
    \ once again and also run the demo code examples in your development environment.\
    \ It is very important to get a good understanding of these concepts of TensorFlow\
    \ before you move forward.\n\nIn the upcoming chapter, you will learn about Neural\
    \ Networks. In *[Chapter 5: TensorFlow 2](#c05.xhtml)*, we will introduce TensorFlow\
    \ 2.\n\n# [Questions](#toc.xhtml#s42a)\n\n1.  What is TensorFlow?\n\n2.  What\
    \ is the difference between – constant, variable, and placeholder?\n\n3.  Can\
    \ you initialize a placeholder to a value of 100.0?\n\n4.  Explain what is meant\
    \ by Lazy execution?\n\n5.  Write a code snippet to perform the following: \n\n\
    \    Create a variable named *x* and initialize it to 100. Create a placeholder\
    \ named *y*. Add a node named *z* and perform *z= x\\*y*. Execute the node *z*\
    \ in a session and find the result for *y= 48.197*.\n\n# [CHAPTER 4](#toc.xhtml#c04)\n\
    \n# [Neural Networks](#toc.xhtml#c04)\n\n# [Introduction](#toc.xhtml#s43a)"
