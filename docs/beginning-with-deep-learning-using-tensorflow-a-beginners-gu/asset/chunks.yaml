    # 什么是语音识别？——历史视角


    人类一直对与机器或计算机对话的概念着迷，这在《星球大战》等几部科幻电影中得到了很好的描绘。


    第一个非语音识别设备是由贝尔实验室的科学家于 1952 年开发的；它被称为 `Audrey` 或音频数字识别；这与我们在图像识别章节中看到的手写识别类似；该设备可以识别从零到九的口头数字或字符，被认为是一项突破性的创新。它只能识别离散的口头数字。在
    20 世纪 60 年代初，IBM 开发了 `Shoebox`，它可以执行简单的数学运算命令。它能够识别 16 个口头单词，包括数字 0–9（参见 `figure
    7.1`）：


    ![](img/Figure-7.1.jpg)


    **图 7.1:** 语音识别的早期趋势


    从那时以后，语音识别已经取得了长远发展。如今的语音识别系统可以处理数千个词的词汇且具有高准确率。


    # 语音识别的应用


    语音识别今天非常普遍；几乎每个人每天都会使用语音识别，例如 `Siri`、`小同学` 以及支持语音的机器人都是语音识别应用的示例。语音识别让与机器交互变得非常容易，因此该领域引起了大量的关注。


    与图像识别相比，语音识别是一个复杂得多的过程，因为它涉及许多步骤。在图像识别中，输入是图像，神经网络分类器的结果不需要转换，因为神经网络无法处理原始音频。因此，需要将原始音频转换为文本，以便神经网络进行处理。


    如今的语音识别系统工作所示：


    ![](img/Figure-7.2.jpg)


    **图 7.2:** 语音识别过程


    这是一个多步骤的过程。语音信号转换为文本，然后使用 NLP 进行处理，生成的文本再通过被称为合成的过程转换回语音。在这个过程中，NLP 发挥了关键作用，而它反过来又有多个组件。深度学习对
    NLP 领域的最新发展产生了巨大影响，这将是我们本章的重点。关于语音转文本和文本转语音的文献已经有很多了，因此我们在本章中重点关注 NLP。


