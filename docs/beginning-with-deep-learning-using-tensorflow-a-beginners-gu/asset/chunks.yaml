    # CHAPTER 3


    # TensorFlow Programming


    # Introduction


    TensorFlow is today the most popular deep learning library. Although it is very
    powerful and provides a lot of flexibility for developing deep learning models,
    it is not very easy to learn. In this chapter, we will take you through a simple
    step-by-step process to get a good understanding of how to write programs. We
    take very simple mathematical examples, which have nothing to do with machine
    learning, to help you understand the concepts of TensorFlow programming. There
    will be a lot of simple code examples to make the whole learning process easy.
    We start with TensorFlow 1.X, which is the mature and stable version and widely
    used in the industry, and then move to TensorFlow 2.x, which is a newer version
    recently released.


    # Structure


    In this chapter, the following topics will be covered:

    * TensorFlow development environment

    * Introduction to TensorFlow 1.X

    * TensorFlow programming structure and its elements

    * Linear algebra with TensorFlow

    * Concept of optimizer

    * Applying optimizer to solve mathematical problems


    # Objective


    At the end of this chapter, you will learn how to install and set up the TensorFlow
    1.x environment, and you will also understand the intricacies of writing Python
    code using TensorFlow library, which works in lazy execution.


    # TensorFlow development environment


    As a first step, let us set up the development environment for TensorFlow. There
    are two ways of having the TensorFlow environment: one is online, and the other
    is offline on your local system. Starting the online environment using Google
    Colab. Here, we will describe the steps to install TensorFlow on your local system
    using Anaconda. TensorFlow needs Python as a prerequisite. You must follow the
    steps mentioned in Chapter 2: Machine Learning for setting up the local development
    environment using Anaconda if you have not done so. Here are the additional steps
    required to install TensorFlow. Assuming you have already installed Python, and
    created the virtual environment by name TensorFlow when you open navigator, you
    should see a screen like figure 3.1 when you click on `Environments`. TensorFlow
    is listed here:


    ![](images/Figure-3.1.jpg)


    **Figure 3.1:** TensorFlow environment


    If you do not see TensorFlow, please make sure to carefully follow all the steps
    shown in Chapter 2: Machine Learning before you proceed to the next steps. If
    you see `tensorflow`, it means the python installation is successful. Following
    are the steps to install TensorFlow:


    1. From the list of environments, select `tensorflow`, and you will see all the
    installed packages on the right-hand side:

    ![](images/Figure-3.2.jpg)

    **Figure 3.2:** Installed packages in environments

    2. From the dropdown (where it shows `All`) select `not installed` and enter `TensorFlow`
    in the search box:

    ![](images/Figure-3.3.jpg)

    **Figure 3.3:** Changing “all” to “not installed”

    3. Then `TensorFlow` will be highlighted:

    ![](images/Figure-3.4.jpg)

    **Figure 3.4:** Searching TensorFlow

    4. Then click on `Apply`:

    ![](images/Figure-3.5.jpg)

    **Figure 3.5:** Clicking “Apply”

    5. Note that installing TensorFlow 2.x is much simpler, and we will see that later.

    6. In order to test the installation is complete and working fine, open Jupyter
    notebook from the command prompt using these steps:

    ![](images/Figure-3.6.jpg)

    **Figure 3.6:** Jupyter notebook from the command prompt

    7. To create a notebook, click on `New`:

    ![](images/Figure-3.7.jpg)

    **Figure 3.7:** Creating a new notebook

    It opens a new tab as follows:

    ![](images/Figure-3.8.jpg)

    **Figure 3.8:** New notebook tab

    8. Type `import TensorFlow as tf` and execute.

    ![](images/Figure-3.9.jpg)

    **Figure 3.9:** Executing TensorFlow

    If it runs successfully without any error; then, the TensorFlow installation is
    successful.

    9. To check the TensorFlow version, type in `tf.__version__` and execute. It will
    print the version of the TensorFlow installed:

    ![](images/Figure-3.10.jpg)

    **Figure 3.10:** Checking TensorFlow version


    In this case, its version is 1.10.0, but in your case, it would show the version
    you have installed.


    That is it! Now you are ready to code.


    # Introducing TensorFlow


    TensorFlow is not a programming language. It is a deep learning library. As of
    writing this book, TensorFlow is by far the most popular deep learning library,
    as seen in figure 3.11. This was originally developed by a team within Google
    called Google Brain for their internal use and was subsequently open-sourced.
    Google Brain team is responsible for the development of some of the cool Google
    apps such as Google Photos and Google Cloud Speech. TensorFlow 1.0 was released
    in 2017, and within a short period of time, it became the most popular deep learning
