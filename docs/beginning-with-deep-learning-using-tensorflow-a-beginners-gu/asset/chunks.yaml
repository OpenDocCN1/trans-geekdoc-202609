    这是深度学习章节的开始。在本章中，你将学习到神经网络，它是深度学习的核心组件。我们不仅仅仅讨论理论，而是将采用实践的方法来帮助你快速理解并应用这些概念。这也是为什么这本书的结构安排为在开始本章之前先处理
    `TensorFlow` 编程。


    在本章中，你将学习神经网络的工作原理。我们将从神经网络最小的组件开始，即人工神经元，也称为感知机。然后，我们将移动到包含多个神经元的层，接着是多层神经网络。


    这种结合代码示例的循序渐进的方法将帮助你轻松地掌握这个复杂的话题。


    提醒一下，神经网络是一个复杂的话题，如果你不能一次性理解所有内容，请不要灰馁。这是非常正常的，因为在使用 `TensorFlow` 的时候，你可能需要反复阅读这一章几次。


    关于我们是否已经完全理解了神经网络的工作原理，目前仍存在巨大的争论。很多时候，它们能够运行并给出所需的结果，但很难解释为什么会这些结果。我们仅仅将神经网络视为一个黑盒。因此，请以开放的心态对待它，保持好奇心并不断提问“为什么？”，并做好准备，对于所有问题，目前还没有答案。


    现在，让我们开始吧。


    # 结构


    在本章中将涵盖以下主题：


    * 什么是神经网络？

    * 感知机的结构

    * 使用 `TensorFlow` 创建并训练感知机

    * 使用 `TensorFlow` 开发多层深度神经网络的逐步过程

    * 代码演示演示和示例


    # 目标


    学习本章后，你将能够处理神经网络，学习被称为 `perceptron`（感知机）的最基本单元，实现具有多层工作的深度神经网络，并使用 `TensorFlow`
    和 `Keras` 构建多层神经网络。


    # 关于神经网络


    神经网络的通用意义是指相互连接的神经元网络。神经元可以是生物的（存在于人类大脑中），也可以是人工的。在当前的语境下，我们指的是`人工神经网络` (`ANN`)，它是模仿人类大脑（即生物神经网络）进行建模的。人工智能一词源于这样一个事实：自然智能存在于人类大脑中（或者任何的大脑中！），而我们人类正试图通过人工方式模拟这种自然智能。


    需要注意的是，`ANN` 最初是基于人类大脑和生物神经元的，但今天它已经极大地演变，某些神经网络的形式，如 `CNN` 和 `RNN`，无法直接映射到人类大脑和生物神经元的功能。即使人工神经元的输出也可以被程序设置为不同的值，而生物神经元只有两种可能的状态——开启和关闭。


    然而，为了便于理解并根据传统，我们将从生物神经元和人工神经元之间的类比开始。


    人类大脑由数十亿个相互连接的生物神经元组成，它们通过开启或关闭发送微小的电二进制信号来不断相互通信。人们认为，尽管科学取得了巨大进步，我们对人类大脑的工作原理仍然没有良好的理解。根据一些早期研究，生物大脑的简化版本如图
    `figure4.1` 所示：


    ```

    /images/Figure-4.1.jpg

    ```

    **图 4.1:** 生物神经元


    这是一个高度简化的表示。它包含以下主要组件：


    * 接收输入信号的树突

    * 以某种形式处理信号的细胞体

    * 像尾巴一样的轴突，信号通过它向外传输到下一个神经元。


    人工神经元也以类似的方式表示，尽管它不是物理实体，而是一个数学模型。`Figure4.2` 是人工神经元的高级表示：


    ```

    /images/Figure-4.2.jpg

    ```

    **图 4.2:** 人工神经元的表示


    更详细的人工神经元或感知机的表示在 `figure4.3` 中：


    ```

    /images/Figure-4.3.jpg

    ```

