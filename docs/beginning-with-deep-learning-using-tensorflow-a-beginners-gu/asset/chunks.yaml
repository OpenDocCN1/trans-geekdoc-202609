    # [Language model](#toc.xhtml#s96a)


    The language model is a system that predicts the next word of a sentence based
    on the previous words. This is implemented using a sequence-to-sequence model.
    In the past few years, there has been tremendous development in this space. In
    the past language, models were implemented using **Recurrent Neural Networks**
    (**RNN**). The regular DNN or CNN could not be used as they are not time-dependent.
    However, there are drawbacks in regular RNN, like vanishing gradient and exploding
    gradient. The improved versions of RNN are LSTM and GRU. LSTMs are very popular
    with language models, but they are slow and take a lot of time to train. Now we
    have transformer-based models like BERT, which are much more accurate and faster.
    The progress is depicted in the following diagram:


    ![](images/Figure-7.26.jpg)


    **Figure 7.26:** Progress in the language model


    # [Recurrent Neural Networks (RNN)](#toc.xhtml#s97a)


    An RNN unit (*[figure 7.27](#c07.xhtml#fig7_27)*) looks like a regular neuron,
    except that the output is fed back along with the other inputs; thus, making it
    time-dependent:


    ![](images/Figure-7.27.jpg)


    **Figure 7.27:** RNN unit


    ![](images/Figure-7.28.jpg)


    **Figure 7.28:** Unrolled RNN


    The unrolled RNN (*[figure 7.28](#c07.xhtml#fig7_28)*) is a single unit of RNN
    taking multiple inputs over certain time steps. For example, at time step *t*,
    the input is *Xt* + *V* which is the output from the previous time step *t–*1\.
    At time step *t*+1, the input is *Xt*+1 + *V* which is the output of time step
    *t*, and so on.


    Hence, this is better suited for time-dependent data than a regular DNN or CNN.
    The RNN-based language model can be represented in the following diagram:


    What would be the next possible word in the following sequence:


    What is your ………..


    There are, of course, several possibilities like … "plan", "question", "designation",
    and so on. However, the probability of the next word is "name" is the highest.


    And this prediction can be done with greater accuracy if we had more context or
    knowledge of some more previous words:


    ![](images/Figure-7.29.jpg)


    **Figure 7.29:** RNN-based language model


