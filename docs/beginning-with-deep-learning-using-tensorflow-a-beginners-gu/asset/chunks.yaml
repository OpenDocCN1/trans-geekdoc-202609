    \ `x` 和 `y`：\n   ![](img/Figure-2.24.jpg)\n   **图 2.4:** 准备数据\n\n5. 从 `sklearn`\
    \ 实例化线性回归模型。使用 `fit` 方法通过 `x` 训练模型：\n   ![](img/Figure-2.25.jpg)\n   **图 2.5:**\
    \ fit 方法\n\n现在我们已经有了训练好的模型，可以计算最佳拟合线的系数 `m` 和 `c`：\n   ![](img/Figure-2.26.jpg)\n\
    \   **图 2.6:** 打印系数\n\n7. 使用我们训练模型的 `predict` 函数来预测新值 `newdata`：\n   ![](img/Figure-2.27.jpg)\n\
    \   **图 2.7:** 预测方法\n\n沿着最佳拟合线绘制新值：\n   ![](img/Figure-2.28.jpg)\n   **图 2.8:**\
    \ 绘图\n\n# 多元线性回归](#toc.xhtml#s20a)\n\n多元线性回归在某种程度上是简单线性回归的扩展。在简单线性回归中只有一个特征。当有多个特征时，我们使用多元线性回归。\n\
