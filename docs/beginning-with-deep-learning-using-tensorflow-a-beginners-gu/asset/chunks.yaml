    Neural Network model is created and trained.


    # [MNIST—single layer multi-neuron model](#toc.xhtml#s53a)


    Now that you understand the MNIST data set and also understand how to create a
    single layer multiclass Neural Network, we will create and train a multiclass
    neural network and train it to classify the MNIST data set:


    ![](images/Figure-4.63.jpg)


    **Figure 4.63:** A 10-Neuron Handwritten digit classifier


    *[Figure 4.64](#c04.xhtml#fig4_64)* is the pictorial representation of this neural
    network. Let us start with the code:


    ![](images/Figure-4.64.jpg)


    **Figure 4.64:** To create a placeholder


    As a first step, create a placeholder to read the images and feed them to the
    network at runtime. The shape of this placeholder is \[None,784\] since the images
    are stored in the form of a flattened one-dimensional array of size 784. Each
    of these 784-pixel values is in the features/inputs for our neurons. And every
    input is fed to every neuron, as seen in *[figure 4.63](#c04.xhtml#fig4_63)*.
    Hence, we need 784 weights per neuron:


    ![](images/Figure-4.65.jpg)


    **Figure 4.65:** weights


    The weight variable shape is \[784,10\] since there are 10 neurons, and each neuron
    needs 784 weights corresponding to the 784 inputs:


    ![](images/Figure-4.66.jpg)


    **Figure 4.66:** Bias


    Bias variable has just 10 elements, one for each neuron:


    ![](images/Figure-4.67.jpg)


    **Figure 4.67:** Net Input function


    This is our net input function—nothing special:


    ![](images/Figure-4.68.jpg)


    **Figure 4.68:** Placeholder for labels


    We create the placeholder to read in the labels and feed at runtime during the
    training process. The construction of the neural network is done. Then we add
    the code for loss function and optimizer:


    ![](images/Figure-4.69.jpg)


    **Figure 4.69:** Code for loss function and optimizer


    With this, the graph is ready. We have to execute this in a session to train the
    model:


    ![](images/Figure-4.70.jpg)


    **Figure 4.70:** To train model with 1000 iterations


    We run the training for 1000 iterations, and in each iteration, we fetch 100 images
    using the `next_batch` function. Now that training is done, we have to check the
    accuracy of the model using the test data:


    ![](images/Figure-4.71.jpg)


    **Figure 4.71:** Predicted output


    For testing, we use the entire test data `mnist.test.images` (10,000 images) and
    run the node `Output` to get the predictions from the model. The output `predict`
    will be 1000 rows of one hot encoded array of size 10.


    In order to calculate the accuracy, it would be easier to convert this into a
    simpler format. We once again make use of the `argmax` functionality:


    ![](images/Figure-4.72.jpg)


    **Figure 4.72:** Output in regular digit format


    Now `result` has all the predictions in the form of single-digit numbers:


    ![](images/Figure-4.73.jpg)


    **Figure 4.73:** Labels in digit format


    We convert the labels also into this format using argmax. Now, these two arrays
    can be used for calculating the accuracy:


    ![](images/Figure-4.74.jpg)


    **Figure 4.74:** To calculate accuracy


    We observe that the model has achieved 90.67% accuracy. Let us train it for a
    few more iterations to see if the accuracy improves:


    ![](images/Figure-4.75.jpg)


    **Figure 4.75:** Retrain with 10000 iterations


    Training the model for 10,000 iterations results in about 92.74% accuracy, as
    shown here:


    ![](images/Figure-4.76.jpg)


    **Figure 4.76:** New accuracy


    This is pretty good, considering it is a very simple single-layer neural network
    with just 10 neurons. This entire code is available on GitHub link provided. Run
    this code and play around by changing the number of iterations and the batch size
    to see how the accuracy gets affected.


    # [Multilayer Neural Network](#toc.xhtml#s54a)


    In the previous example, we developed a single-layer Neural Network, often referred
    to as a shallow neural network. A pictorial representation is shown below:


    ![](images/Figure-4.77.jpg)


    **Figure 4.77:** Shallow Neural Network


    One layer of neurons is not sufficient to solve most of the deep learning problems.
    You need to stack up multiple layers. This is often referred to as **Deep Neural
    Network**. A pictorial representation is shown as follows:


    ![](images/Figure-4.78.jpg)


    **Figure 4.78:** Deep Neural Network


    Before we jump into the code, let us try to understand how this works. The hidden
    layers are where the neurons are there. The input layer is the input data and
    does not contain any neurons, even though it is common to represent this layer
    also with nodes. Similarly, the output does not actually have any neurons.


    Input data is fed to the neurons in the first layer. It must be noted that every
    input is fed to every neuron in the first layer. And every neuron has one output.
    The output from each neuron in the first layer is fed to every neuron in the second
    layer. And the output of each neuron in the second layer is fed to every neuron
    in the third layer, and so on.


    That is why this kind of network is also referred to as a Dense Neural Network
    or fully connected Neural Network. There are other types of neural networks like
    Convolutional Neural Network, where this is not true, but that will be discussed
    later.'
