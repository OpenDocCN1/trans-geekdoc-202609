    你可能已经在 Jupyter notebook 文件中见过这种情况。虽然关闭会话（session）可能不会报错，但如果你并行运行多个 Jupyter notebooks，可能会导致问题。每次创建一个会话，都会为其分配某些资源。当你关闭会话时，这些资源会被释放。


    避免这种情况的一种方法是在 `with` 块中创建并使用会话。这是一种更专业的代码写法。以下是使用 `with` 块的 `Hello World` 代码：


    ![](img/Figure-3.40.jpg)


    **图 3.40:** 使用“with”打印“Hello world”的代码


    会话在 `with` 块中创建，并在 `with` 块内有效。一旦我们退出 `with` 块，会话就会自动关闭。因此，我们不需要执行显式的会话关闭。


    希望到这里，你已经很好地掌握了 TensorFlow 程序的编写和执行。在继续之前，让我们来看另一个真实世界的例子。在这个例子中，我们将实现运动方程：


    ```

    s=u*t+(1/2)*a*t**2

    ```


    我们将针对 `u=50` m/s、`a=40` m/s**2 进行计算，`t` 需要在运行时从用户端请求。


    这就是我们创建计算图并准备数据的方式：


    ![](img/Figure-3.41.jpg)


    **图 3.41:** 创建计算图并准备数据


    然后在“with” 块中的会话中执行图：


    ![](img/Figure-3.42.jpg)


    **图 3.42:** 执行图


    注意 `u` 和 `a` 被创建为常量，而不是变量或占位符，因为在在这种情况下它们的值不会改变。


    让我们在下一节中看看如何使用 TensorFlow 执行一些线性代数运算。


    # 使用 TensorFlow 进行线性代数


    在神经网络中，最重要的线性代数函数是矩阵乘法。在本节中，我们将首先解释矩阵乘法的工作原理，然后使用 TensorFlow 的内置函数解决一些矩阵乘法示例。这对于准备下一章节的神经网络内容至关重要。


    矩阵乘法是如何工作的？你可能在高中阶段学习过这些内容，但让我们来快速回顾一下。


    让我们来看一个简单的例子。如果我们要在两个矩阵 `A` 和 `B` 之间进行矩阵乘法，其中，


    ![](img/p93.jpg)


    第一步是检查这是否可行。矩阵乘法有一个先决条件。记住 `C=R`；即第一个矩阵的列数（`C`）应该等于第二个矩阵的行数（`R`）。


    记住，这里的顺序很重要。`A×B` 不等于 `B×A`。


    在这个特定的例子中，`C=3` 且 `R=3`。因此，乘法是可能的。


    结果矩阵的行数等于 `A` 的行数，列数等于 `B` 的列数。


    因此，在这种情况下，结果矩阵将是 2×2。你取 `A` 第一行的元素和 `B` 第一列的元素：


    ![](img/p93a.jpg)


    得到元素级乘积的和，即 `(1×7)+(2×9)+(3×11) = 58`。


    这将是 2×2 结果矩阵的第一个元素：


    ![](img/p94.jpg)


    对 `A` 的第一行和 `B` 的第二列重复此操作：


    `AR[1] = [1 2 3]`


    `BC[2] =`


    ![](img/p94a.jpg)


    得到对应元素乘积的和，即 `(1×8)+(2×10)+(3×12) = 64`


    这将是结果矩阵的第二个元素：


    ![](img/p94b.jpg)


    对第二行重复相同的操作以得到最终结果：


    ![](img/p94c.jpg)


    TensorFlow 提供了一个名为 `matmul` 的方法来执行矩阵乘法。让我们在 TensorFlow 中执行前面的示例：


