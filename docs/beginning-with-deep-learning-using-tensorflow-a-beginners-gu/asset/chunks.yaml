    常量 `const` 被初始化为 10。当你尝试显示该值时，它只会显示数据类型为 `int32`，而不是实际值。这就是延迟执行（lazy execution）的概念。当你在
    Jupyter notebook 中运行这行代码时，它并没有实际执行代码，而是进行语法检查。实际执行发生在会话（session）中；我们稍后就会。


    变量也是如此。变量 `var1` 初始化为 100，但当我们尝试显示该值时，它只显示数据类型为 `int32`，而不是值 100。


    为了显示这些值，我们在会话中执行了这些节点，我们稍后就会。


    到目前为止，我们做的是构建计算图。让我们通过添加更多计算来继续构建它：


    ![](img/Figure-3.16.jpg)


    **图 3.16:** 构建计算图


    在单元 6 中，我们创建了一个名为 `sum` 的节点，它使用 TensorFlow 提供的 `add` 方法对 `const` 和 `var1` 求和。在单元
    7 中，我们创建了另一个节点，将 `sum` 中的值赋值给 `var1`。


    在单元 8 中，当我们尝试将 `sum` 赋值给 `const` 时，它会报错。为什么？因为你不能修改常量（请参考 *图 3.17*）：


    ![](img/Figure-3.17.jpg)


    **图 3.17:** 常量的错误


    现在计算图已经准备就绪，让我们在会话中执行这些节点。在在此之前，我们必须再创建一个节点，用于初始化变量：


    ![](img/Figure-3.18.jpg)


    **图 3.18:** 变量初始化


    每当我们在代码中使用变量时，我们必须创建此节点/操作，并在执行任何其他节点之前在会话中执行它。这在我们在使用变量时才需要。如果我们只使用常量或占位符（placeholder），则不需要进行此初始化。


    现在，让我们创建会话：


    ![](img/Figure-3.19.jpg)


    **图 3.19:** 创建会话


    第一步，我们运行初始化操作：


    ![](img/Figure-3.20.jpg)


    **图 3.20:** 初始化


    然后运行其他节点：


    ![](img/Figure-3.21.jpg)


    **图 3.21:** 运行节点 const


    在会话中执行节点 `const` 实际上是将值 10 赋值给 `const`，然后显示该值。我们也可以显式地使用 `print` 函数来打印 `var1`
    和 `sum` 的值，如下：


    ![](img/Figure-3.22.jpg)


    **图 3.22:** print 函数


    这是一个处理常量和变量的很好的例子。接下来，让我们看看占位符是如何运作的。


    让我们创建一个占位符 `a`：


    ![](img/Figure-3.23.jpg)


    **图 3.23:** 创建占位符


    尽管 `a` 中没有值，但你也可以像普通变量一样对待它并对其进行计算。例如，你可以创建一个结果为 `a*2` 的节点 `b`。


    然而，当你尝试在会话中执行此节点时，你会得到一个错误：


    ![](img/Figure-3.24.jpg)


    **图 3.24:** 占位符节点


    这是因为你需要在会话中运行它运行时填充占位符。在会话中执行占位符有特定的方法。我们必须在运行时使用名为 `feed_dict`（feed 字典的缩写）的参数向占位符“喂入”值。执行占位符的语法如下：


    ![](img/Figure-3.25.jpg)


    **图 3.25:** 为占位符喂入值


    你以字典的形式传递占位符的值。在这种情况下，我们为占位符 `a` 喂入了 3.0。注意，当我们想要执行包含 `a` 的 `b` 时，我们必须再次喂入 `a`。


    所以，每当你执行包含占位符的节点时，你都必须喂入占位符。如果一个节点中有多个占位符，你必须在执行时提供所有的占位符。


    这是另一个例子：


    ![](img/Figure-3.26.jpg)


    **图 3.26:** 执行所有占位符


    注意，这些值并没有被存储。它们被用于计算然后被丢弃。因此，如果你尝试直接打印 `pl1` 或 `pl2` 的值，它会再次报错：


    ![](img/Figure-3.27.jpg)


    **图 3.27:** 执行占位符时的错误


    你必须在会话运行时喂入占位符，并且每次都需要运行它。然而，喂入占位符有不同的方法。让我们来看看这些变体。首先，我们传递的值不需要是普通的数字（标量）；它们可以是数组或多维数组。这里是一些例子：


    ![](img/Figure-3.28.jpg)


    **图 3.28:** feed 字典


    你也可以提前准备字典并像示例所示在会话中使用它：


    ![](img/Figure-3.29.jpg)


    **图 3.29:** 字典准备

    '
