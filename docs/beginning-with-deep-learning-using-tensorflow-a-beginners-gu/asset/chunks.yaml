    \ own local environment so that you can continue to work and learn without being\
    \ tethered to the internet. We mention both the methods here.\n\n# [Using Google\
    \ Colab](#toc.xhtml#s15a)\n\nMake sure you have a Google account (like Gmail),\
    \ and make sure you login to the account before you start.\n\nAccess Google Colab\
    \ using the following URL or simply by searching for Google Colab:\n\n**https://colab.research.google.com/**\n\
    \nYou might get a screen as follows; you can click `Cancel`:\n\n![](images/Figure-2.2.jpg)\n\
    \n**Figure 2.2:** To start Google Colab\n\nYou can see the welcome screen:\n\n\
    ![](images/Figure-2.3.jpg)\n\n**Figure 2.3:** Welcome screen\n\nNow, perform the\
    \ following steps:\n\n1.  From the menu, select: `File` | `New Python 3 notebook`.\n\
    \n2.  That’s it! You are ready to start coding.\n\n3.  Just type in: \n\n    `print(\"\
    Hello world\")`\n\n    And press *Shift* + *Enter*.\n\n    This should print `Hello\
    \ world` in the next line.\n\n# [Setting up local environment in Python](#toc.xhtml#s16a)\n\
    \nThe best way to set up the Python ML environment locally is to use Anaconda.\
    \ It is a Python distribution with an easy-to-use user interface. Follow the steps\
    \ given here to set up the environment.\n\n# [Prerequisite](#toc.xhtml#s17a)\n\
    \nLaptop with min 4 GB RAM, Intel i5 or equivalent with Windows 7 or above. Other\
