    # 第 7 章：语音识别


    # 引言


    图像识别和语音识别是当今人工智能和深度学习中的两个主要子领域。在上一章中，我们已经看到了图像识别是如何工作的。在本章中，我们将看到语音识别是如何工作的，以及它的一些应用。多年来，语音识别领域的进展非常缓慢。但在过去的几年里，取得了许多重大进展，特别是随着
    transformers 的出现。进展缓慢的部分原因在于语音识别的复杂性。在开始之前，让我们先澄清术语。`Speech recognition`（语音识别）最初被发明为对语音的解释，这只是整个过程的一部分，但今天，语音识别指的是识别人类语音的整个端到端过程，将其转换为文本以供
