    first one is filter or kernel —this is nothing but a square matrix. Each cell
    in the matrix has some number which is known as the **weight**. That is also the
    reason sometimes it is referred to as the weighted matrix:


    Here is an example.


    | 0 || 1 || 1 |


    | --- | --- | --- |


    | 1 || 0 || 0 |


    | 1 || 0 || 1 |


    This is a 3×3 filter or kernel. For the sake of keeping the example simple and
    easy to understand, the weights have been kept as 0''s and 1''s, but otherwise,
    these values are some real numbers, including negative values.


    And each convolution layer can have many filters, and the combination of these
    weights in each filter is unique. This means not two filters in a given convolution
    layer will have exactly the same weights. For the sake of illustration, let us
    assume there is an image of 6×6. Machines see images as a bunch of pixel values.
    So, this image is a 6×6 matrix with some pixel values as shown here:


    ![](images/Figure-6.4.jpg)


    **Figure 6.4:** Sample image pixel values


    The process of convolution is like a scan. The filter scans the image from left
    to right and top to bottom and produces an output known as **feature map**. The
    feature map is, in turn, another matrix of numbers. The numbers in the new matrix
    are the outcome of certain calculations, as shown in the following example. Note
    that this is not matrix multiplication:


    ![](images/Figure-6.5.jpg)


    **Figure 6.5:** First step of convolution


    The first number is calculated as follows:


    (81×0 + 2×1 + 209×1) + (24×1 + 56×0 + 108×0) + (91×1 + 0×0+189×1) = 515


    The filter moves by one pixel to the right and performs the same calculations
    once again, which gives the value of the second cell in the feature map:


    ![](images/Figure-6.6.jpg)


    **Figure 6.6:** Next step


    The second number is derived as follows:


    (2×0 + 209×1+ 44×1)+(56×1 + 108×0+98×0)+(0×1 + 189×0 + 65×1) = 374


    The feature map is created as follows:


    ![](images/Figure-6.7.jpg)


    **Figure 6.7:** Feature map


    This way, a complete feature map is created. And then, the next filter with another
    set of weights is used, the process is repeated, and a new feature map is created.
    Therefore, in a particular convolution layer, if there are five filters, the output
    of this convolution layer will have five feature maps.


    The size of the feature map is either same as the size of the image or smaller
    than the image, depending on the stride. Stride is the number of pixels by which
    the pixel moves. By default, it is 1. And in this case, the size of the feature
    map is equal to the size of the image. But the stride can be increased to 2 or
    3, in which case the size of the feature maps is smaller than the size of the
    image.


    So, if in the preceding example if the stride is set to 2, then the second position
    of the filter will be as shown in the following figure:


    ![](images/Figure-6.8.jpg)


    **Figure 6.8:** Convolution with stride = 2


    Now there is another problem. In this case, we observe that the last column has
    been left out. And the last row will also be left out because there are not enough
    pixels for the filter to move:


    ![](images/Figure-6.9.jpg)


    **Figure 6.9:** Problem with stride =2


    This is where the concept of padding is used. When padding is used, a layer of
    dummy pixels is added to the image so that the filter can scan all the pixels
    of the image. This is how the image would look with padding. And the filter will
    work with stride 2 as well, and none of the information from the image is lost:


    ![](images/Figure-6.10.jpg)


    **Figure 6.10:** Image with padding


    It is observed from above that for the convolution layer, there are some configurable
    parameters that are summarized as follows, and this will be handy and make it
    easy to understand when we are writing the code to build the model in Keras.


    Summary of parameters:


    *   Kernel size—3×3 (min) and usually an odd number square matrix


    *   Number of kernels/filters = number of output feature maps


    *   Stride—1 by default can be increased.


    *   Padding—can be used optionally


    The next layer is the pooling layer. This is relatively easy to understand. The
    output of the convolution layer, which is a bunch of feature maps, is fed as input
    to the pooling layer. The pooling layer is also known as the down sampling layer
    as that is what is exactly done here.


    There different types of pooling, but *Maxpooling* is the most common type. We
    will use that for our example. There is an only filter like matrix used here,
    which does not have any weights. Only the size needs to be defined. Usually, it
    is one size smaller than the convolution filters. For example, if the filter size
    in convolution is 3, the size in pooling is 2, and if the filter size in convolution
    is 5, the pooling filter size is 4, and so on. Let us take the filter size of
    2 and see how it works.


    ![](images/Figure-6.11.jpg)


    **Figure 6.11:** 2×2 max pooling


    The filter scans the feature just like in the convolution layer, but there are
    no weights and no calculations. It picks the maximum value out of the four cells:
    in this case, the first number is 515. The output is once again a matrix-like
    in the case of the convolution layer, and in this case, the size of the output
    is always smaller than this feature map:


    ![](images/Figure-6.12.jpg)


    **Figure 6.12:** Step 2—max pooling


    The next number is 450, and the third number is again 450, and so on. The final
    output would like this:


    ![](images/Figure-6.13.jpg)


    **Figure 6.13:** Maxpooling output


    And there will be as many such outputs as the number of filters in the convolution
    layer. And you notice that the size of this output is 5×5 than the feature size
    6×6. In addition to Maxpooling, there are other types of pooling, like Minpooling
    and Averagepooling, and as their number suggests, in these cases, the minimum
    number and the average of the number are taken, respectively, whereas scanning
    the feature map.


    Let us now relate this to the LeNet architecture:


    ![](images/Figure-6.14.jpg)


    **Figure 6.14:** LeNet architecture


    Going from the left, the input is an image of size 32×32. The image is fed to
    the first convolution layer, C1, which has six filters each of size 5×5. With
    stride=1, this will result in a feature map size of 28×28. Try this out manually
    if you are not convinced with the numbers!


    The six feature maps are represented by the six squares. This is fed to the Maxpooling
    or subsampling layer with filter size 2. The output is 14×14, which is half the
    size of the feature maps (28×28).


    This output is then fed to the next convolution layer, C2, which has 16 filters
    resulting in 16 feature maps of size 10×10 represented by the 16 boxes. This,
    in turn, is fed to subsampling layer S2, resulting in an output of size 5×5.


    That is the end of the feature extraction section. This output is fed to the fully
    connected layer n1 followed by the classification layer n2 consisting of a Softmax
    layer of 10 neurons.


    **A couple of additional resources to understand convnets: [http://setosa.io/ev/image-kernels](http://setosa.io/ev/image-kernels)**


    **[https://ujjwalkarn.me/2016/08/11/intuitive-explanation-convnets/](https://ujjwalkarn.me/2016/08/11/intuitive-explanation-convnets/)**


    Now that we got an understanding of how the convolution and pooling layers work
    let us look at how this is implemented in the code. We will start with some basic
    examples like MNIST and slowly move to more advanced examples.


    # [MNIST with CNN](#toc.xhtml#s77a)


    In this section, we will learn how to develop and train a CNN model for handwriting
    recognition. We will take the MNIST example, which we have already seen before.
    The advantage of using the MNIST data set is that it is tightly integrated into
    TensorFlow and Keras. Thus, we can easily use the Keras API with TensorFlow 2
    to implement a basic multi-layer Convolutional Neural Network for handwriting
    recognition. Let us get started!'
