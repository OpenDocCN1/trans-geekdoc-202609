- raw: "Steps to install TensorFlow 2.x will be given in *[Chapter 5: TensorFlow2.x](#c05.xhtml)*.\n\
    \n# [Regression algorithms](#toc.xhtml#s18a)\n\nRegression is performed when the\
    \ target is a continuous variable such as height, weight, volume, pressure, and\
    \ so on. Let us start with the very basic machine learning algorithm: simple linear\
    \ regression.\n\nSimple linear regression is the simplest machine learning algorithm.\
    \ As the name suggests, it is a linear function – the model is the equation of\
    \ a straight line:\n\n*Y = mx +c*\n\nwhere *m* and *c* are the parameters of the\
    \ model. *Y* is known as the dependent variable, and *X* is known as the **independent\
    \ variable**. In simple linear regression, there is only one independent variable\
    \ or feature. If there is more than one feature or independent variable, it is\
    \ known as multilinear regression.\n\nAfter training, this model is used for predicting\
    \ the value of *Y* for a given value of *x*. Let us take an example. Given below\
    \ is training data for total cost and number of items. Let us assume that a seller\
    \ offers a random discount on the items being sold, and in general, the discount\
    \ is higher if the number of items is higher – but the amount of the discount\
    \ is not fixed or consistent. The problem on hand is to develop a linear regression\
    \ model so that, given the number of items (*x*), it should predict the total\
    \ cost:\n\n| **No. of items (*x*)** || **Total cost (*Y*)** |\n\n| --- | --- |\n\
    \n| 40 || 300 |\n\n| 20 || 170 |\n\n| 10 || 90 |\n\n| 50 || 450 |\n\n| 100 ||\
    \ 800 |\n\n| 35 || 320 |\n\n| 24 || 210 |\n\n| 20 || 190 |\n\n| 20 || 180 |\n\n\
    | 30 || 270 |\n\n| 40 || 360 |\n\n| 50 || 400 |\n\n| 30 || 100 |\n\n| 45 || 400\
    \ |\n\n| 30 || 270 |\n\n| 10 || 95 |\n\n| 20 || 180 |\n\n| 30 || 280 |\n\n| 25\
    \ || 230 |\n\n| 49 || 460 |\n\n| 57 || 470 |\n\n| 67 || 570 |\n\n**Table 2.5:**\
    \ Data\n\nIf a basic scatter plot is drawn, it will look like *[figure 2.19](#c02.xhtml#fig2_19)*.\
    \ It can be visually seen that there is a linear correlation between the number\
    \ of items and the total cost, but at the same time, the data is not collinear,\
    \ that is, on the same straight line. Hence, there can be multiple straight lines\
    \ possible. And that is the challenge of simple linear regression to find the\
    \ line that gives minimum error while predicting:\n\n![](images/Figure-2.19.jpg)\n\
    \n**Figure 2.19:** Simple linear regression\n\nThe training process of simple\
    \ linear regression can be depicted by the following diagram:\n\n![](images/Figure-2.20.jpg)\n\
    \n**Figure 2.20:** Training process\n\nDuring the model training process, the\
    \ parameters of the model – *m* and *c* are initialized to some random values.\
    \ With the given values of *x* the output (*y1*)is calculated (*predicted)*. The\
    \ output is then compared with the known values/labels (*y*), and the error is\
    \ calculated. The parameter values are updated, and the process is repeated. This\
    \ is performed iteratively to reduce the error. In other words, the training process\
    \ tries to fit a straight line in each iteration and calculates the error. Although\
    \ the aim is to minimize the error to zero, it is not always possible to achieve\
    \ this. Hence, an exit condition is defined in terms of the number of iterations\
    \ or percentage accuracy or the amount of error.\n\nAt the end of the training\
    \ process, the *best fit line* is determined, and the values of *m* and *c* at\
    \ this point are known as the **model parameters**.\n\n# [Code demo](#toc.xhtml#s19a)\n\
    \nIn this demo, we will see how to train a simple linear regression model on a\
    \ data set using Python and scikit-learn. The code is available on GitHub link.\n\
    \nMachine learning code, by and large, has the following three sections:\n\n1.\
    \  Load and prepare the data.\n\n2.  Train the model with training data set.\n\
    \n3.  Evaluate the model.\n\nA quick walkthrough of the following code:\n\n1.\
    \  To import the libraries: \n\n    ![](images/Figure-2.21.jpg)\n\n    **Figure\
    \ 2.21:** Importing libraries\n\n2.  Load the data which is in the CSV file using\
    \ pandas. The data is loaded into the data frame named data. \n\n    ![](images/Figure-2.22.jpg)\n\
    \n    **Figure 2.22:** load data\n\n3.  Visualize the data using a scatter plot.\
    \ As seen from the following plot, there is a linear correlation between `x` and\
    \ `y` values: \n\n    ![](images/Figure-2.23.jpg)\n\n    **Figure 2.23:** Scatter\
    \ plot\n\n4.  Prepare the data for feeding to the model for training. This is\
    \ done by splitting the data frame into `x`, the independent variable and `y`,\
    \ the dependent variable as shown here: \n\n    ![](images/Figure-2.24.jpg)\n\n\
    \    **Figure 2.24:** Feeding to the model\n\n5.  Instantiate a linear regression\
    \ model from sklearn. The `fit` method is used to train the model by passing the\
    \ feature (`x`) and the label (`y`): \n\n    ![](images/Figure-2.25.jpg)\n\n \
    \   **Figure 2.25:** Fit method\n\n    Now the model is trained, and the coefficients\
    \ `m` and `c` for the best fit line are computed, which can be viewed by printing\
    \ them.\n\n    ![](images/Figure-2.26.jpg)\n\n    **Figure 2.26:** Print coefficient\n\
    \n    Now that we have the trained model, we can use this to predict the output\
    \ when the new set of independent variables are provided.\n\n6.  Read the new\
    \ data that has only `X` values into a dataframe newdata.\n\n7.  The `predict`\
    \ function of our trained model `regr` is used to predict the new values: \n\n\
    \    ![](images/Figure-2.27.jpg)\n\n    **Figure 2.27:** Predict method\n\n  \
    \  The new values can be plotted along with the best fit line:\n\n    ![](images/Figure-2.28.jpg)\n\
    \n    **Figure 2.28:** To plot the line.\n\n# [Multilinear regression](#toc.xhtml#s20a)\n\
    \nMultilinear regression is, in a way, an extension of simple linear regression.\
    \ In simple linear regression, there is only one feature. When there are more\
    \ than one feature, we use multilinear regression.\n\nIn this example, we take\
    \ real estate data to build a predictive model. We build a multilinear regression\
    \ model and find its accuracy:\n\n![](images/Figure-2.29.jpg)\n\n**Figure 2.29:**\
    \ multilinear regression model\n\nImport the required libraries – NumPy, pandas,\
    \ and seaborn. Load the data using pandas:\n\n![](images/Figure-2.30.jpg)\n\n\
    **Figure 2.30:** Loading data using panda\n\nThis has eight columns consisting\
    \ of 7 features and 1 target. Price is the target. This will be used for training\
    \ our model to predict the price of the property based on the given features.\
    \ Obviously, not all the columns can be considered as features. For example, `id`\
    \ is just a unique identifier of the records and will not have any impact on the\
    \ price of the property. As a data scientist, you decide which of the features\
    \ should be considered to build your model. This is known as **feature selection**.\
    \ Very often, this is done out of experience and domain knowledge. In this particular\
    \ example, we consider the following columns as features:\n\nBedrooms, bathrooms,\
    \ sqft\\_living, sqft\\_above, grade\n\nWe split the dataframe into two parts,\
    \ the features (`x`) and the target (`y`):\n\n![](images/Figure-2.31.jpg)\n\n\
    **Figure 2.31:** Dataframe\n\nBefore training the model, the data needs to be\
    \ split into two parts: train and test. Training data is used for training the\
    \ model, and this data is very often passed through the model multiple times iteratively\
    \ to let the model learn.\n\nThen, the model tested for accuracy using the test\
    \ data, which the model had never seen before. The scikit-learn offers a very\
    \ useful function called `train_test_split` to split the data in a specified ratio.\
    \ Usually, the train test split is in the ratio of 60:40 or 70:30, and this is\
    \ provided as a parameter to the function in decimal form. For example, in this\
    \ case, we are splitting the data in 60:40 ratio by setting the parameter `test_size\
    \ = 0.4`:\n\n![](images/Figure-2.32.jpg)\n\n**Figure 2.32:** Data split\n\nNow\
    \ the data preparation is done, and we are ready to create and train the model.\
    \ The scikit-learn offers an implementation of the linear regression algorithm\
    \ in the package `LinearRegression`. We use this package and create an instance\
    \ of a linear regressor by the name `reg`:\n\n![](images/Figure-2.33.jpg)\n\n\
    **Figure 2.33:** fit function"
