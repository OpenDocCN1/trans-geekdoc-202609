- raw: "    **Figure 5.2:** Step to click on \"Create\"\n\n3.  Create a new environment\
    \ with a name like `BPBDemo` as follows. Leave the default python version; in\
    \ this case, it is 3.6, but you may get a newer version like 3.8: \n\n    ![](images/Figure-5.3.jpg)\n\
    \n    **Figure 5.3:** Environment name is given as BPBDemo\n\n4.  After clicking\
    \ on `Create`, the status is shown as follows: \n\n    ![](images/Figure-5.4.jpg)\n\
    \n    **Figure 5.4:** Status while creating new environment\n\n    Once the environment\
    \ is created, you will get a success message. In the next, you will install TensorFlow\
    \ in this newly created environment.\n\n5.  **Install TensorFlow**: In the dropdown,\
    \ change `Installed` to `All`. This will list all the packages, including TensorFlow:\
    \ \n\n    ![](images/Figure-5.5.jpg)\n\n    **Figure 5.5:** (a) \"Installed\"\
    \ changed to (b) \"All\"\n\n6.  Now select `TensorFlow`: \n\n    ![](images/Figure-5.6.jpg)\n\
