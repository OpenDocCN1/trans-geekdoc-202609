    # 迁移学习


    迁移学习是一种机制，你取一个针对某些类别图像进行训练的预训练模型，然后针对一组不同的类别进行重新训练。例如，我们可以取 VGG16（它被训练用于分类 1000
    种不同的日常物体），并将其重新训练用于非常特定的物体类型，可能是电机零件或计算机硬件等。这种机制的主要优势是，它在训练数据非常少时仍然有效。原因是，我们没有训练模型的所有层，因为那样会花费很长时间。只训练最后几个连接层（dense
    layers）的最后层。卷积层没有训练，但它们参数的训练值被重用。这就是被称为迁移学习的原因。


