    # [Transformers](#toc.xhtml#s99a)


    Transformers were first introduced through a paper titled "*Attention is all you
    need*" in 2017, and since then, transformers have become a rage and have accelerated
    major developments in the area of NLP and speech recognition. We have seen that
    for NLP, sequence matters, and hence, RNN''s and their variations like LSTM and
    GRU were used. However, since the processing happens sequentially, they are very
    slow.


    In transformers, the processing happens in parallel. Let us take a look at the
    transformer architecture:


    ![](images/Figure-7.41.jpg)


    **Figure 7.41:** Transformer architecture


    It has two parts: encoder and decoder. The encoder, in turn, consists of the following:


    *   Input embedding


    *   Positional encoding


    *   Encoding layers


    The original design of the transformer had six encoding layers.


    And the decoder, in turn, consists of the following:


    *   Output embedding


    *   Positional encoding


    *   Decoding layers


    And the original design had six decoding layers:


    ![](images/Figure-7.42.jpg)


    **Figure 7.42:** Encoder–Decoder


    Each encoding layer, in turn, consists of two parts:


    *   Self-attention


    *   Feedforward neural network


    ![](images/Figure-7.43.jpg)


    **Figure 7.43:** Encoder


    And each decoder, in turn, consists of three parts:


    *   Self-attention


    *   Encoder decoder attention


    *   Feed forward neural network


    ![](images/Figure-7.44.jpg)


    **Figure 7.44:** Decoder


    The major advantage of using Transformers for NLP tasks compared to RNN''s or
    their variations like LSTM and GRU is the parallelization while training.


    Now that you got a basic understanding of Transformers, let us look at how they
