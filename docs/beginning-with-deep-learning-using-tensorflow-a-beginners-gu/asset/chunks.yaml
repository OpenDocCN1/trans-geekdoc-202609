    \ in the previous chapters. Some of the packages are new, like `Conv2D` and `Maxpooling2D`,\
    \ which are used for creating the convolution and Maxpooling layers:\n\n![](images/Figure-6.15.jpg)\n\
    \n**Figure 6.15:** Import the required libraries\n\nAfter this, we import and\
    \ prepare our data. There is nothing new here as we have done this in the previous\
    \ chapter:\n\n![](images/Figure-6.16.jpg)\n\n**Figure 6.16:** Load MNIST data\n\
    \n### Model creation with Keras\nThe next step is to create our Convolutional\
    \ Neural Network. This has two parts. One is the convolutional base, which consists\
    \ of a sequence of convolutional layers and pooling layers. This is followed by\
    \ a few dense layers. Finally, we end with a Softmax layer:\n\n![](images/Figure-6.17.jpg)\n\
    \n**Figure 6.17:** Model creation\n\nKeras offers an easy and convenient way to\
    \ create CNN models using `Sequential` class and other associate classes like\
    \ `Conv2D` and `MaxPooling2D`. Let us go over these lines of code one-by-one:\n\
    \n![](images/Figure-6.18.jpg)\n\n**Figure 6.18:** Create an instance of sequential\n\
    \nAn instance of the class `Sequential` is created and named as \"`model`\". As\
    \ the name of the class, `Sequential` suggests, we can add the layers to the model\
    \ in a sequential manner by calling the add method (`model.add`). The first layer\
    \ is a convolution layer:\n\n![](images/Figure-6.19.jpg)\n\n**Figure 6.19:** Add\
    \ a convolution layer\n\nLet us try to understand the various parameters of the\
    \ `Conv2D` class. Number 32 indicates the number of filters or kernels—recall\
    \ the convolution layer described previously. Although it is found that for the\
    \ MNIST dataset 32 filters work very well, you can play around with this number\
    \ and see how the accuracy changes.\n\nThe next parameter `(3,3)` is the size\
    \ of the filter. The next parameter `input_shape` needs to be provided only for\
    \ the first hidden layer. The value of this parameter is the shape of the images.\
    \ For the MNIST data set, which consists of images of size 28 × 28 pixels, we\
    \ take only grayscale, and thus, we require only one channel. This results in\
    \ an input shape of `(28, 28, 1)`.\n\nThis information needs to be provided to\
    \ the Neural Network as a parameter for the first layer only. Each subsequent\
    \ layer will take the output of the previous layer, and therefore, we need not\
    \ provide any input shape.\n\nThe last parameter is the activation function which\
    \ invariably is `ReLU`:\n\n![](images/Figure-6.20.jpg)\n\n**Figure 6.20:** Add\
    \ a Maxpooling layer\n\nMoving on to the next line of code, here we add the next\
    \ layer, which will be a pooling layer. In this case, we use `MaxPooling`, and\
    \ the size of the filter is 2 × 2, which is provided as a parameter. Two more\
    \ such pairs of convolutions and Maxpooling layers are added.\n\nNext, we add\
    \ the dense layer and the Softmax layers:\n\n![](images/Figure-6.21.jpg)\n\n**Figure\
    \ 6.21:** Add dense layers\n\nPlease note that convolution layers can accept multi-dimensional\
    \ inputs, but dense layer requires a single dimensional input. However, the output\
    \ from the convolution layer and Maxpooling layers are in the form of matrices\
    \ (two dimensions). The `Flatten()` function reshapes the output of the previous\
    \ Maxpooling layer into a one-dimensional array:\n\n![](images/Figure-6.22.jpg)\n\
    \n**Figure 6.22:** Add flatten\n\nThis line of code may appear like a new layer\
    \ of neurons is added, but in fact, this is just reshaping the tensor. This is\
    \ the power and convenience of Keras. There will be a few more such examples we\
    \ will see as we move forward. The next line of code is adding a `Dense` layer\
    \ or a fully connected layer of 64 neurons, each with `ReLU` `activation` function:\n\
    \n![](images/Figure-6.23.jpg)\n\n**Figure 6.23:** First dense layer\n\nFinally,\
    \ we add the classification layer or the Softmax layer. Since the MNIST data has\
    \ 10 classes, we need 10 neurons and all of them linked to a single Softmax activate\
    \ function:\n\n![](images/Figure-6.24.jpg)\n\n**Figure 6.24:** Softmax layer\n\
    \nThat completes the creation of the multi-layer CNN model. Before we train the\
    \ model, we have to compile it:\n\n![](images/Figure-6.25.jpg)\n\n**Figure 6.25:**\
    \ Compile\n\nWe use `adam` optimizer and the loss function `sparse_categorical_crossentropy`.\
    \ The metrics parameter, as always, is set to `accuracy`. It may be noted that\
    \ when we created the model directly in TensorFlow without Keras, the loss function\
    \ used was `categorical_crossentropy`. This is because of the difference in the\
    \ way the labels for the MNIST data are stored in TensorFlow and Keras. \n\nIn\
    \ Keras, the MNIST labels are stored in one hot encoded format as shown below:\n\
    \n![](images/Figure-6.26.jpg)\n\n**Figure 6.26:** Labels\n\nNow that our model\
    \ is ready, we can have a look at its various parameters with the help of the\
    \ `summary` function. This function displays a summary of the model, which shows\
    \ the number of trainable and non-trainable parameters in each layer:\n\n![](images/Figure-6.27.jpg)\n\
    \n**Figure 6.27:** Summary of the Neural Network\n"
