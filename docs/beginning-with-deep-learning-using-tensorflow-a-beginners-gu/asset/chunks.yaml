    # [Inference with Webcam images](#toc.xhtml#s85a)


    So far, we have been using images already saved on the local drive for running
    the inference. It is also possible to run inference on a live image captured through
    a Webcam. This will help you understand the working of OpenCV. This example will
    also help when we learn about object detection in video. In this example, we will
    use a pre-trained model, VGG16. In an earlier example, we have seen how to use
    a pre-trained model for inference. However, in this case, instead of loading an
    image from the local folder, we will capture the image from the Webcam. We capture
    a single frame from the Webcam, which is one image.


