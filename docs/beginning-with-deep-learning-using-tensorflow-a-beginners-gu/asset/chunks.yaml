- raw: '![](images/Figure-1.3.jpg)


    **Figure 1.3:** IBM Deep Blue (**Source:** [www.stream-live-tvchannel.top/ProductDetail.aspx?iid=88929267&pr=40.88](http://www.stream-live-tvchannel.top/ProductDetail.aspx?iid=88929267&pr=40.88))


    However, the difference is that Deep Blue was actually just a supercomputer with
    the ability to evaluate 200 million positions per second. So, it was brute force
    rather than any learning. Hence, it was not AI.


    Then, in March 2016, AlphaGo an AI developed by a startup Deep Mind defeated the
    reigning world champion of Go named *Lee Sedol* 4 games to 1. This was truly a
    watershed moment in AI, and even the AI experts were shocked. Not because they
    did not believe AI could achieve this feat but because it has done it so fast.


    Deep Mind was set up in 2013 with the idea of developing an AI to play the game
    of Go, and the experts believed it would take a good decade, if not more, to achieve
    this feat. And they were shocked when the AI achieved this in less than four years.
    Subsequently, of course, Google acquired Deep Mind:


    ![](images/Figure-1.4.jpg)


    **Figure 1.4:** DeepMind''s AlphaGo (**Source:** [https://247newsupdate.com/2016/03/12/computer-program-beats-human-master-in-go-game/](https://247newsupdate.com/2016/03/12/computer-program-beats-human-master-in-go-game/))


    This was a significant achievement at multiple levels. For one, Go, unlike Chess,
    is a game of intuition rather than rules. And there are these many legal positions
    as shown in *[Figure 1.5](#c01.xhtml#fig1_5)*:


    ![](images/Figure-1.5.jpg)


    **Figure 1.5:** Number of legal positions in Go


    And to put this in context, this is more than the number of atoms in the whole
    of the universe – yes, the universe, not just earth.


    So, there is no way anyone can write a program for this. Then, how did Deep Mind
    achieve it? They used a technique called *reinforcement learning* which is a form
    of deep learning. In this technique, the system learns by playing the game over
    and over, perhaps several tens of million times and each time learning from its
    mistakes and improving itself.


    This was probably the first time a machine has, in a way, shown signs of intuition!


    Another significant incident in the world of AI took place on November 4, 2017.
    Saudi Arabia conferred citizenship on a humanoid robot called *Sophia*, which
    was developed by *Hansen Robotics*. Experts are divided over the capabilities
    of Sophia – some even calling it fake; this just shows the amount of interest
    in the field of AI.


    ![](images/Figure-1.6.jpg)


    **Figure 1.6:** Sophia ([https://simple.wikipedia.org/wiki/Sophia\_(robot)](https://simple.wikipedia.org/wiki/Sophia_\(robot\)))


    # [Classification of AI](#toc.xhtml#s4a)


    AI is classified into three categories, as shown in *[Figure 1.7](#c01.xhtml#fig1_7)*.


    ![](images/Figure-1.7.jpg)


    **Figure 1.7:** Types of AI


    **Artificial Narrow Intelligence** (**ANI**), also referred to as an expert system,
    is a system that can perform one task but can perform much better than human beings.
    Today''s AI like AlphaGo and autonomous vehicles fall in this category.


    **Artificial Super Intelligence** (**ASI**), also referred to as singularity,
    on the other hand, is a system that can perform multiple tasks and all of them
    significantly better than human beings. This is like the holy grail of AI and
    would take at least 30–40 years from now, if not more.


    **Artificial General Intelligence** (**AGI**) is an intermediate stage where the
    AI will perform multiple tasks, and in one or two of them, it will be better than
    humans. In spite of all the buzz today around AI, we are still at the ANI stage.
    We barely scratched the surface.


    However, the move toward ASI or singularity will be relatively faster. Even if
    it takes 50 years from now, that is too fast when viewed within the context of
    the time frame of human civilization. This is often depicted in the form of the
    following diagram:


    ![](images/Figure-1.8.jpg)


    **Figure 1.8:** Singularity


    This concept is explained brilliantly by *Tim Urban* in his blog post titled:


    *The AI Revolution: The Road to Superintelligence.*


    This is available on the following link:


    **[https://waitbutwhy.com/2015/01/artificial-intelligence-revolution-1.html](https://waitbutwhy.com/2015/01/artificial-intelligence-revolution-1.html)**


    Let us take a closer look at AI. AI is aimed at developing intelligence in machines
    along with the lines of the human brain. Human intelligence, in a simplified manner,
    can be explained as decisions taken based on the inputs received from our five
    senses – sight, hearing, touch, smell, and taste.


    The actions taken are in the form of speech or movement. Today''s AI is capable
    of sight, hearing, and speech. The two main branches of AI today are Image recognition
    that corresponds to sight, and speech recognition that corresponds to speech and
    hearing.


    These will be discussed in great detail in the upcoming chapters. AI is a broad
    concept and the underlying techniques used are known as *machine learning* and
    *deep learning*. That is the reason very often these terms are used interchangeably
    or together like AI-ML or AI-DL.


    The following figure depicts the relation between AI, ML, and DL:


    ![](images/Figure-1.9.jpg)


    **Figure 1.9:** AI, ML and DL


    The secret sauce to AI is neural networks which are used in deep learning. And
    deep learning is a subset of machine learning.


    We will take a look at machine learning in the next chapter.


    # [How did we reach here?](#toc.xhtml#s5a)


    Today, AI is a part of the field called data science. Data science involves the
    process of data capture all the way to taking action based on the data.


    ![](images/Figure-1.10.jpg)


    **Figure 1.10:** Data Science


    It all began with the information technology revolution with started in the 1990s
    when we started creating and storing data. Initially, software was used for office
    automation – such as word processing, spreadsheets, and so on where the data was
    stored in the form of files. Then, came the enterprise automation era, where ERP
    applications were developed to capture orders, manage production, sales, and distribution,
    and so on. This was the beginning of generating larger amount of data. Around
    this time, the concept of RDBMS was born. These are transactional systems known
    as **online transaction processing** (**OLTP**). They are very good for capturing
    the data. However, when the data grows, the system performance deteriorates, and
    that is what was happening with most OLTP systems after a few years. In order
    to maintain the high level of performance of these systems, older data was backed
    up from the live databases and stored on tapes for later retrieval. And this made
    it difficult to run an analysis on the entire data. This gave birth to data warehouses,
    which are also known as **online analytical processing systems** (**OLAP**).


    ![](images/Figure-1.11.jpg)


    **Figure 1.11:** Business Intelligence (BI)


    These systems had the ability to store large amounts of data from different systems,
    and they are much faster for querying. Data is transferred from the OLTP systems
    to the OLAP systems periodically – typically at the end of the day. This kept
    the OLTP systems lean while allowing you to repot and analyze the historical data
    on the OLAP system. This was the beginning of *business analytics*.


    Data kept growing tremendously over the next few years. This was primarily structured
    data. With the advent of social media in the late 90s, including search engines
    like Yahoo and Google, there was an explosion in unstructured data – text, video,
    and audio.


    ![](images/Figure-1.12.jpg)


    **Figure 1.12:** Internet minute


    This was the advent of Big Data. Traditional databases and warehouses were unable
    to handle Big Data. That led to the Big Data technology – Hadoop.


    ![](images/Figure-1.13.jpg)


    **Figure 1.13:** Hadoop ecosystem (**Source:** Internet)'
