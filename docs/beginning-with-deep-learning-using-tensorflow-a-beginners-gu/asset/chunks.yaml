    \n**Figure 1.14:** Hardware (**Source:** [www.fastcompany.com/3065843/artificial-intelligence-chips-race-nvidia-intel](http://www.fastcompany.com/3065843/artificial-intelligence-chips-race-nvidia-intel))\n\
    \nThis led to the revival and rapid growth of AI over the past few years.\n\n\
    # AI adoption by industries\n\nNow we will see which are the industries that are\
    \ rapidly adopting AI as follows:\n\n*   **Health care**: Health care is one of\
    \ the most visible industries where AI is being adopted. Within health care, there\
    \ are three major areas where AI is being used:\n\n    *   **Diagnostics**: Health\
    \ care diagnostics involves analyzing images such as x-ray, MRI, CT scans, and\
    \ identifying, for example, the presence of cancer. For example, `IBM Watson`\
    \ was trained to detect and predict lung cancer. In these scenarios, deep learning\
    \ models are trained to classify images into cancerous and non-cancerous. Once\
    \ trained, these models can then predict the presence of cancer in new images.\
    \ There is still a lot of research is going on in this space to improve the accuracy\
    \ of the prediction. Doctors are using these as productivity tools to prioritize\
    \ and speed up the diagnostic process. As of date, these cannot replace doctors.\n\
    \n        ![](images/Figure-1.15.jpg)\n\n        **Figure 1.15:** AI for healthcare\
    \ (**Source:** Google)\n\n        Blindness is another major problem facing the\
    \ world. Accordingly to `World Health Organization` (`WHO`) – 1.3 billion people\
    \ have some form of vision impairment, out of which 36 million are blind. While\
    \ some forms of blindness are congenital and cannot be prevented, many forms of\
    \ blindness are avoidable if detected in time. For example: Diabetic Retinopathy.\
    \ And this is where companies like Microsoft and Google are conducting a lot of\
    \ research.\n\n        ![](images/Figure-1.16.jpg)\n\n        **Figure 1.16:**\
    \ Diabetic retinopathy (**Source:** [www.clinicaladvisor.com/home/topics/diabetes-information-center/fda-approves-ai-device-to-detect-diabetic-retinopathy/](http://www.clinicaladvisor.com/home/topics/diabetes-information-center/fda-approves-ai-device-to-detect-diabetic-retinopathy/))\n\
    \n    *   **Treatment**: The adoption of AI for health care treatment is not very\
    \ well known. Cancer treatment is a long and painful process. The course of treatment\
    \ needs to be planned, and it depends on several factors like the health history\
    \ of the patient and the patient's immediate family. And in countries where a\
    \ majority of the population is not covered by medical insurance – cost also can\
    \ be a factor. This is where AI can be used for recommendations. Manipal Hospital\
    \ in Bangalore, India, for example, implemented `IBM Watson` for cancer treatment.\n\
    \n        ![](images/Figure-1.17.jpg)\n\n        **Figure 1.17:** IBM Watson (**Source:**\
    \ [www.giannibarbacetto.it/wp-content/uploads/2017/03/ibmwatson\\_logo-1](http://www.giannibarbacetto.it/wp-content/uploads/2017/03/ibmwatson_logo-1))\n\
    \n*   **Robotic surgery**: Robotic surgery or AI-assisted robotic surgery involves\
    \ performing surgeries using robotic arms. There are several advantages of Robotic\
    \ surgery. They are minimally invasive, due to which the patient recover faster\
    \ and the hospital time is minimal. There is less blood loss and minimum risk\
    \ of infection.\n\n        The robotic arms can be operated remotely, which means\
    \ the surgeon need not be physically present and can conduct the surgery remotely\
    \ that, in turn, means an expert surgeon can perform surgeries at multiple locations,\
    \ sitting in one place.\n\n        ![](images/Figure-1.18.jpg)\n\n        **Figure\
    \ 1.18:** Robotic surgery (**Source:** [https://www.clinicaladvisor.com/home/topics/diabetes-information-center/fda-approves-ai-device-to-detect-diabetic-retinopathy/](http://www.clinicaladvisor.com/home/topics/diabetes-information-center/fda-approves-ai-device-to-detect-diabetic-retinopathy/))\n\
    \n*   **Automotive**: Autonomous vehicles or driverless cars have now been tested\
    \ successfully for millions of miles by several companies, including `Google`\
    \ and `Tesla`. They are still not commercially deployed but are made available\
    \ on experimental basis. Let us take a look at the functioning of autonomous vehicle.\n\
    \n        ![](images/Figure-1.19.jpg)\n\n        **Figure 1.19:** Wymo autonomous\
    \ car (**Source:** [http://globalstopics.blogspot.com/2017/10/self-driving-cars](http://globalstopics.blogspot.com/2017/10/self-driving-cars))\n\
    \n        Autonomous vehicles have a whole set of paraphernalia attached to them.\
    \ There is `Lidar` that is mounted on the top, which provides 360 degree perspective\
    \ of obstacles around the car. `Lidar` functions similarly to `Radar`, but it\
    \ uses a laser instead of radio waves.\n\n        ![](images/Figure-1.20.jpg)\n\
    \n        **Figure 1.20:** Lidar (**Source:** [www.powerelectronics.com/digital-power-combined-with-gan-heads-towards-99-efficiency/](http://www.powerelectronics.com/digital-power-combined-with-gan-heads-towards-99-efficiency/))\n\
    \n        In addition, there are other `radars` in the front and back to detect\
    \ any immediate obstacles. There are multiple cameras providing streaming video,\
    \ which is analyzed in real-time by the onboard AI system. It has a `GPS` system\
    \ to provide location information and also maps to determine the route. The onboard\
    \ AI that is trained `Neural Network` model takes all the inputs from various\
    \ sensors to process and take decisions such as applying the brakes, accelerating,\
    \ or turning left or right.\n\n        For example, from the video feed from the\
    \ front cameras, the onboard AI would be able to detect if the traffic signal\
    \ is Red or Green and according stop or move forward. Or if it detects an obstacle\
    \ in the path, it applies brakes, and so on.\n\n*   **Retail**: Retail has been\
    \ one of the early adopters of AI and `ML`. The retail industry was the first\
    \ to adopt recommendation engines on their e-commerce sites and apps. Today there\
    \ are several areas across the retail process where AI is adopted – starting from\
    \ the warehouse all the way to delivery using drones.\n\n        Warehouse management\
    \ with robots.\n\n        ![](images/Figure-1.21.jpg)\n\n        **Figure 1.21:**\
    \ Warehouse robots (**Source:** [www.istockphoto.com/photos/warehouse-robot](http://www.istockphoto.com/photos/warehouse-robot))\n\
    \n        Retail organizations have to maintain huge warehouses for quick and\
    \ efficient fulfilment. And managing these warehouses is a highly complicated\
    \ task. In the past, there was Warehouse management software developed by companies\
    \ like `SAP`, but even implementing such software is extremely cumbersome.\n\n\
    \        Today AI is being adopted in the form of robots in these warehouses,\
    \ especially for fulfilling orders. This drastically reduces the time for packaging.\
    \ Earlier the warehouse employees had to manually move from bin to bin in order\
    \ to put together the items of the order and package them. Now with these robots,\
    \ the employee stays in one place and summons the bins that contain the items\
    \ of the order. The robots carry the bins. They are autonomous and move around\
    \ in the warehouse without colliding with each other or other obstacles in their\
    \ way.\n"
  trans: "\n\nHadoop 开发于 21 世纪初，经过多年的发展，已趋于成熟，使我们能够轻松处理 TB 级的大量数据，包括非结构化数据。与此同时，数据开始以指数级增长。海量数据的可用性促进了机器学习、深度学习和人工智能的复兴。\n\
    \n这就像是 AI 拼图的所有碎片都到位了。廉价硬件可用——包括 GPU、云端按需的海量计算能力以及大量数据。\n\n![](img/Figure-1.14.jpg)\n\
    \n**图 1.14:** 硬件（**来源:** [www.fastcompany.com/3065843/artificial-intelligence-chips-race-nvidia-intel](http://www.fastcompany.com/3065843/artificial-intelligence-chips-race-nvidia-intel)）\n\
    \n这导致了过去几年人工智能的复兴和快速增长。\n\n# 各对 AI 的采用\n\n现在我们来看看哪些行业正在快速采用 AI：\n\n*   **医疗保健**：医疗保健是采用\
    \ AI 最显著的行业之一。在医疗保健领域，AI 被用于三个主要领域：\n\n    *   **诊断**：医疗诊断涉及分析 X 射线、MRI、CT 扫描等图像，并识别（例如癌症的存在）。例如，`IBM\
    \ Watson` 已被训练用于检测和预测肺癌。在这些场景中，深度学习模型被训练用于将图像分类为癌性和非癌性。一旦训练完成，这些模型就可以预测新图像中是否存在癌症。该领域仍有许多研究正在进行，以提高预测的准确性。医生正在将这些作为生产力工具，来优先排序并加速诊断过程。截至目前，这些还没有取代医生。\n\
    \n        ![](img/Figure-1.15.jpg)\n\n        **图 1.15:** 用于医疗的 AI（**来源:** Google）\n\
    \n        失明是世界上面临的另一个大问题。根据`世界卫生组织`（`WHO`）的数据——13 亿的人有某种形式的视力障碍，其中 360 万人失明。虽然某些形式的失明是先天的且无法预防，但许多形式的失明如果及时发现是可以避免的。例如：糖尿病视网膜病。这就是微软和\
    \ Google 等公司正在大量研究的地方。\n\n        ![](img/Figure-1.16.jpg)\n\n        **图 1.16:**\
    \ 糖尿病视网膜病（**来源:** [www.clinicaladvisor.com/home/topics/diabetes-information-center/fda-approves-ai-device-to-detect-diabetic-retinopathy/](http://www.clinicaladvisor.com/home/topics/diabetes-information-center/fda-approves-ai-device-to-detect-diabetic-retinopathy/)））\n\
    \n    *   **治疗**：将 AI 用于医疗治疗并不广为人知。癌症治疗是一个漫长而痛苦的过程。治疗方案需要经过计划，并且取决于患者的健康史和患者直属家人等因素。在大多数人口没有医疗保险覆盖的国家，成本也是一个因素。这就是\
    \ AI 可以用于推荐的地方。例如，印度班加罗尔的曼尼帕医院（Manipal Hospital）采用了 `IBM Watson` 进行癌症治疗。\n\n \
    \       ![](img/Figure-1.17.jpg)\n\n        **图 1.17:** IBM Watson（**来源:** [www.giannibarbacetto.it/wp-content/uploads/2017/03/ibmwatson\\\
    _logo-1](http://www.giannibarbacetto.it/wp-content/uploads/2017/03/ibmwatson_logo-1)）\n\
    \n*   **机器人手术**：机器人手术或 AI 辅助机器人手术涉及使用机械臂进行手术。机器人手术有几个优点。它们是微创的，因此患者康复更快，住院时间最短。出血量较少，感染风险最低。\n\
    \n        机械臂可以进行远程操作，这意味着外科医生不需要亲临现场，就可以远程进行手术，反过来意味着专家医生可以坐在一个地方在多个地点进行手术。\n\
    \n        ![](img/Figure-1.18.jpg)\n\n        **图 1.18:** 机器人手术（**来源:** [`www.clinicaladvisor.com/home/topics/diabetes-information-center/fda-approves-ai-device-to-detect-diabetic-retinopathy/`](http://www.clinicaladvisor.com/home/topics/diabetes-information-center/fda-approves-ai-device-to-detect-diabetic-retinopathy/)）\n\
    \n*   **汽车**：自动驾驶车辆或无驾驶汽车已由 `Google` 和 `Tesla` 等几家公司成功测试了数百万英里。它们尚未投入商业部署，但在实验的基础上提供。让我们来看看自动驾驶车辆的功能。\n\
    \n        ![](img/Figure-1.19.jpg)\n\n        **图 1.19:** Wymo 自动驾驶汽车（**来源:**\
    \ [`globalstopics.blogspot.com/2017/10/self-driving-cars`](http://globalstopics.blogspot.com/2017/10/self-driving-cars)）\n\
    \n        自动驾驶车辆配备了一整套设备。顶部安装了 `Lidar`（激光雷达），它可以提供车辆周围障碍物的 360 度视角。`Lidar` 的功能与\
    \ `Radar`（雷达）类似，但它使用激光而不是无线波。\n\n        ![](img/Figure-1.20.jpg)\n\n        **图\
    \ 1.20:** 激光雷达（**来源:** [www.powerelectronics.com/digital-power-combined-with-gan-heads-towards-99-efficiency/](http://www.powerelectronics.com/digital-power-combined-with-gan-heads-towards-99-efficiency/)）\n\
    \n        此外，前后的后方还有其他 `radars` 来检测即时障碍。多个摄像头提供视频流，由车载 AI 系统实时分析。它拥有 `GPS` 系统来提供位置信息，并有地图来确定路线。经过训练的车载\
    \ `Neural Network` 模型处理来自各种传感器的输入，并做出诸如刹车、加速或左转等决策。\n\n        例如，通过前方摄像头的视频流，车载\
    \ AI 能够检测交通灯的红绿，并决定停止还是前进。或者如果它检测到路径上有障碍，它会刹车等等。\n\n*   **零售**：零售业是 AI 和 `ML`\
    \ 的早期采用者。零售行业是最早在其电子商务网站和 App 上采用推荐引擎的行业。如今流程中的多个领域都采用了 AI——从仓库到使用无人机送货。\n\n \
    \       机器人进行仓库管理。\n\n        ![](img/Figure-1.21.jpg)\n\n        **图 1.21:**\
    \ 仓库机器人（**来源:** [www.istockphoto.com/photos/warehouse-robot](http://www.istockphoto.com/photos/warehouse-robot)）\n\
    \n        零售机构需要维护大型仓库以实现快速高效的履约。管理这些仓库是一项极其复杂的任务。过去，有由 `SAP` 等公司开发的仓库管理软件，但实施此类软件也极其困难。\n\
    \n        如今，AI 以机器人的形式应用于这些仓库，特别是在订单履行方面。这大大缩短了包装时间。以前仓库员工必须手动在货架之间移动，以组合订单物品并进行包装。现在有了这些机器人，员工只需留在原地，召唤包含订单物品的货架。机器人搬运货架。它们是自主的，在仓库中移动时不会与其他机器人或路径上的其他障碍物碰撞。\n\
    \n"
