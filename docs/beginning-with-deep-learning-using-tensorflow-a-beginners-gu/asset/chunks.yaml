    # [Logistic regression](#toc.xhtml#s21a)


    Logistic regression is primarily a binary classification algorithm, i.e., it is
    used for classifying data into two classes. Of course, with a slight tweak, it
    can be used for multiclass classification as well.


    In this example, we will look at building a classifier that can predict whether
    a student will get admission into a college or not. This is based on training
    data that has the features – GRE score, TOEFL score, university rating, and so
    on. Admit is the Target that has a binary value – 0 or 1.


    1 means the student got admission and 0 means he did not. Logistic regression
    has a sigmoid function to perform the classification. The mathematical expression
    of the sigmoid function is as follows:


    ![](images/c02eq-1.jpg)


    *a1*, *a2*, …, and *b* are the trainable coefficients that the model will continue
    to readjust during the training process. Let us walk through the code:


    ![](images/Figure-2.36.jpg)


    **Figure 2.36:** Import data


    Read the data into a data frame using pandas:


    ![](images/Figure-2.37.jpg)


    **Figure 2.37:** Data preparation


    Split the data frame into features (`x`) and target (`y`). Split the data into
    the train (75%) and test (25%):


    ![](images/Figure-2.38.jpg)


    **Figure 2.38:** Splitting data


    Like in the case of linear regression, there is an implementation of the logistic
    regression available in scikit-learn. An instance of the logistic regression is
    created, and the model is trained using the fit method by passing the training
    data:


    ![](images/Figure-2.39.jpg)


    **Figure 2.39:** Logistic Regression


    Once trained, the model is tested using the predict method with the test data.


    In the case of classification, the confusion matrix is a good visual tool to understand
    the accuracy of the model. The scikit-learn provides a readily available function
    to create and confusion matrix. It takes the labels (`y_test`) of the test data
    and the predicted values (`y_pred`).


    The sum of all the numbers in the confusion matrix is equal to the number of observations
    in the test data. For example, in our case, there are a total of 125 observations.


    The sum of the diagonal values is the correctly predicted values. In this case,
    it is 119, which means 6 (5+1) observations are misclassified. So, the accuracy
    is 119/125 = 0.952 or 95.2%:


    ![](images/Figure-2.40.jpg)


    **Figure 2.40:** Model performance


    A detailed discussion on the confusion matrix is out of scope, but it suffices
    to say that it is a powerful visual tool in classification, and we will be using
    it when we perform classification later with neural networks as well.


    Accuracy can also be calculated using the method `metrics.accuracy_score` and
    passing the test labels and the predicted values as the parameters. And the output
    is the same as earlier: 95.2%.


    This will also be used with neural networks.


    # [Decision tree](#toc.xhtml#s22a)


    The decision tree is a very popular ML algorithm that can be used for both classification
    and regression, but it is mainly used for classification. It is popular because
    it is easy to understand and it has powerful visualization capabilities.


    Let us take an example and walk through the code. In this demo, we will use a
    decision tree algorithm to build and train a model to classify the leads:


    ![](images/Figure-2.41.jpg)


    **Figure 2.41:** Decision Tree algorithm


    After importing the required libraries, we load the data (`LEAD.csv`) into a pandas
    data frame. A quick visual inspection shows the various columns in the data frame.
    We will do a feature selection by identifying the columns that we feel are applicable
    and create a new data frame (`x`) with just these features.


    The column `PURCHASE` is the target, and hence, we separate that into a new data
    frame (`y`):


    ![](images/Figure-2.42.jpg)


    **Figure 2.42:** To train model


    Then the next step is to split the data into train and test sets:


    ![](images/Figure-2.43.jpg)


    **Figure 2.43:** Splitting the data into train and test sets


    An implementation of the decision tree algorithm is available in scikit-learn.
    We create an instance by calling `DecisionTreeClassifier` by passing the parameter
    `criterion="entropy"`.


    The other option for the parameter is `gini` which is also the default value.
    These are the two possible ways of measuring the impurity during training:


    ![](images/Figure-2.44.jpg)


    **Figure 2.44:** How to use DecisionTreeClassifier


    Then we call the `fit` method to train the model using the training data. Accuracy
    of the model is measured using `DecisionTree.Score` and pass the test data:


    ![](images/Figure-2.45.jpg)


    **Figure 2.45:** Model evaluation


    In this case, the accuracy is 91.99%.


    # [Support vector machine (SVM)](#toc.xhtml#s23a)


    **Support vector machine** (**SVM**) can be used for classification and regression.
