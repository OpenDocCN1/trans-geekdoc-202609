    \ of `x` the output (`y1`) is calculated (`predicted`). The output is then compared\
    \ with the known values/labels (`y`), and the error is calculated. The parameter\
    \ values are updated, and the process is repeated. This is performed iteratively\
    \ to reduce the error. In other words, the training process tries to fit a straight\
    \ line in each iteration and calculates the error. Although the aim is to minimize\
    \ the error to zero, it is not always possible to achieve this. Hence, an exit\
    \ condition is defined in terms of the number of iterations or percentage accuracy\
    \ or the amount of error.\n\nAt the end of the training process, the *best fit\
    \ line* is determined, and the values of `m` and `c` at this point are known as\
    \ the **model parameters**.\n\n# Code demo](#toc.xhtml#s19a)\n\nIn this demo,\
    \ we will see how to train a simple linear regression model on a data set using\
    \ Python and scikit-learn. The code is available on GitHub link.\n\nMachine learning\
    \ code, by and large, has the following three sections:\n\n1. Load and prepare\
    \ the data.\n2. Train the model with training data set.\n3. Evaluate the model.\n\
    \nA quick walkthrough of the following code:\n\n1. To import the libraries: \n\
    \   ![](images/Figure-2.21.jpg)\n   **Figure 2.21:** Importing libraries\n\n2.\
    \ Load the data which is in the CSV file using `pandas`. The data is loaded into\
    \ the data frame named `data`. \n   ![](images/Figure-2.22.jpg)\n   **Figure 2.22:**\
    \ load data\n\n3. Visualize the data using a scatter plot. As seen from the following\
    \ plot, there is a linear correlation between `x` and `y` values: \n   ![](images/Figure-2.23.jpg)\n\
    \   **Figure 2.23:** Scatter plot\n\n4. Prepare the data for feeding to the model\
    \ for training. This is done by splitting the data frame into `x`, the independent\
    \ variable and `y`, the dependent variable as shown here: \n   ![](images/Figure-2.24.jpg)\n\
    \   **Figure 2.24:** Feeding to the model\n\n5. Instantiate a linear regression\
    \ model from `sklearn`. The `fit` method is used to train the model by passing\
    \ the feature (`x`) and the label (`y`): \n   ![](images/Figure-2.25.jpg)\n  \
    \ **Figure 2.25:** Fit method\n\n   Now the model is trained, and the coefficients\
    \ `m` and `c` for the best fit line are computed, which can be viewed by printing\
    \ them.\n   ![](images/Figure-2.26.jpg)\n   **Figure 2.26:** Print coefficient\n\
    \n   Now that we have the trained model, we can use this to predict the output\
    \ when the new set of independent variables are provided.\n\n6. Read the new data\
    \ that has only `X` values into a dataframe `newdata`.\n7. The `predict` function\
    \ of our trained model `regr` is used to predict the new values: \n   ![](images/Figure-2.27.jpg)\n\
    \   **Figure 2.27:** Predict method\n\n   The new values can be plotted along\
    \ the best fit line:\n   ![](images/Figure-2.28.jpg)\n   **Figure 2.28:** To plot\
    \ the\n\n\n\n Multilinear regression](#toc.xhtml#s20a)\n\nMultilinear regression\
    \ is, in a way, an extension of simple linear regression. In simple linear regression,\
    \ there is only one feature. When there are more than one feature, we use multilinear\
    \ regression.\n\nIn this example, we take real estate data to build a predictive\
    \ model. We build a mult regression model and find its accuracy:\n![](images/Figure-2.29.jpg)\n\
    **Figure 2.29:** multilinear model\n\nImport the required libraries – `numpy`,\
    \ `pandas`, and `seaborn`. Load the data using `pandas`:\n![](images/Figure-2.30.jpg)\n\
    **Figure 2.30:** Loading data\n\nThis has eight columns consisting of 7 features\
    \ and 1 target. `Price` is the target. This will be used for training our model\
    \ to predict the price of the property based on the given features. Obviously,\
    \ not all the columns can be considered as features. For example, `id` is just\
    \ a unique identifier of the records and will not have any impact on the price.\
    \ As a data scientist, you decide which of the features should be considered to\
    \ build your model. This is known as **feature selection**. Very often, this is\
    \ done out of experience and domain knowledge. In this particular example, we\
    \ consider the following columns as features: Bedrooms, bathrooms, sqft_living,\
    \ sqft_above, grade\n\nWe split the dataframe into two parts, the features (`x`)\
    \ and the target (`y`):\n![](images/Figure-2.31.jpg)\n**Figure 2.31:** Dataframe\n\
    \nBefore training the model, the data needs to be split into two parts: train\
    \ and test. Training data is used for training the model, and test data is used\
    \ for testing accuracy. The scikit-learn offers a very useful function called\
    \ `train_test_split` to split the data in a specified ratio. Usually, the train\
    \ test split is in the ratio of 60:40 or 70:30, and this is provided as a parameter\
    \ to the function in decimal form. For example, in this case, we are splitting\
    \ the data in 60:40 ratio by setting the parameter `test_size = 0.4`:\n![](images/Figure-2.32.jpg)\n\
    **Figure 2.32:** Data split\n\nNow the data preparation is done, and we are ready\
    \ to create and train the model. The scikit-learn offers an implementation of\
    \ the linear regression algorithm in the package `LinearRegression`. We use this\
    \ package and create an instance of a linear regressor by the name `reg`:\n![](images/Figure-2.33.jpg)\n\
    **Figure 2.33:** fit function\n"
  trans: "\n\n安装 TensorFlow 2.x 的步骤将在第 5 章：TensorFlow2.x 中给出。\n\n# 回归算法](#toc.xhtml#s18a)\n\
    \n当目标是身高、重量、体积、压力等连续变量时，就会进行回归。让我们从最基础的机器学习算法开始：简单线性回归。\n\n简单线性回归是最简单的机器学习算法。正如其名称所示，它是一个线性函数——模型是直线的方程：\n\
    \n`Y = mx +c`\n\n其中 `m` 和 `c` 是模型的参数。`Y` 被称为因变量，而 `X` 被称为**自变量**。在简单线性回归中，只有一个自变量或特征。如果有多个特征或自变量，则被称为多元线性回归（多元回归）。\n\
    \n训练完成后，该模型用于根据给定的 `x` 值预测 `Y` 的值。让我们来看一个例子。下面给出了总成本和物品数量的训练数据。假设销售者对所售的物品提供随机折扣，通常情况下，物品数量越多，折扣越高——但折扣金额并不是固定或一致的。目前面临的问题是开发一个线性回归模型，以便根据物品数量（`x`）预测出总成本：\n\
    \n| **物品数量 (*x*)** | **总成本 (*Y*)** |\n| --- | --- |\n| 40 || 300 |\n| 20 || 170\
    \ |\n| 10 || 90 |\n| 50 || 450 |\n| 100 || 800 |\n| 35 || 320 |\n| 24 || 210 |\n\
    | 20 || 190 |\n| 20 || 180 |\n| 30 || 270 |\n| 40 || 360 |\n| 50 || 400 |\n| 30\
    \ || 100 |\n| 45 || 400 |\n| 30 || 270 |\n| 10 || 95 |\n| 20 || 180 |\n| 30 ||\
    \ 280 |\n| 25 || 230 |\n| 49 || 460 |\n| 57 || 470 |\n| 67 || 570 |\n\n**表 2.5:**\
    \ 数据\n\n如果绘制一个基础散点图，它看起来像图 2.19。从视觉上可以看出，物品数量与总成本之间存在线性相关关系，但同时，数据并不是共线的，也就是说，不在同一条直线上。因此，可能存在多条直线。这就是简单线性回归的挑战，即找到一条在预测时产生误差最小的直线：\n\
    \n![](img/Figure-2.19.jpg)\n\n**图 2.19:** 简单线性回归\n\n简单线性回归的训练可以通过可以通过图表示：\n\n\
    ![](img/Figure-2.20.jpg)\n\n**图 2.20:** 训练过程\n\n在模型训练过程中，模型的参数——`m` 和 `c` 初始化为某些随机值。根据给定的\
    \ `x` 值计算输出（`y1`）（即 `predicted`）。然后将输出与已知值/标签（`y`）进行比较，并计算误差。更新参数值并重复该过程。通过迭代执行此操作以减少误差。换句话说，训练过程在每次迭代中尝试拟合一条直线并计算误差。虽然目标是使误差降为零，但并非总是可能的。因此，误差最小化是可以尽可能实现的。在训练过程结束，确定了*最佳拟合线*以及参数\
    \ `m` 和 `c`。\n\n# 代码演示](#toc.xhtml#s19a)\n\n在这个演示中，我们将使用 Python 和 scikit-learn\
    \ 在数据集上训练一个线性回归模型。代码大致分为以下三个部分：\n\n1. 导入库。\n2. 加载数据。\n3. 训练模型。\n\n以下是代码：\n\n1.\
    \ 导入库：\n   ![](img/Figure-2.21.jpg)\n   **图 2.1:** 导入库\n\n2. 使用 `pandas` 加载数据。数据命名为\
    \ `data`：\n   ![](img/Figure-2.22.jpg)\n   **图 2.2:** 加载数据\n\n3. 使用散点图可视化数据。从图中所示，`x`\
