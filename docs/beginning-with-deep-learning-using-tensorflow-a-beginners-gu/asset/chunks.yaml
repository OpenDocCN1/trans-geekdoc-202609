- raw: 'We will start with importing TensorFlow and the other necessary libraries
    and packages. You must be already familiar with some of these, which we used in
    the previous chapters. Some of the packages are new, like Conv2D and Maxpooling2D,
    which are used for creating the convolution and Maxpooling layers:


    ![](images/Figure-6.15.jpg)


    **Figure 6.15:** Import the required libraries


    After this, we import and prepare our data. There is nothing new here as we have
    done this in the previous chapter:


    ![](images/Figure-6.16.jpg)


    **Figure 6.16:** Load MNIST data


    Model creation with Keras. The next step is to create our Convolutional Neural
    Network. This has two parts. One is the convolutional base, which consists of
    a sequence of convolutional layers and pooling layers. This is followed by a few
    dense layers. Finally, we end with a Softmax layer:


    ![](images/Figure-6.17.jpg)


    **Figure 6.17:** Model creation


    Keras offers an easy and convenient way to create CNN models using `Sequential`
    class and other associate classes like `Conv2D` and `MaxPooling2D`. Let us go
    over these lines of code one-by-one:


    ![](images/Figure-6.18.jpg)


    **Figure 6.18:** Create an instance of sequential


    An instance of the class `Sequential` is created and named as "`model`". As the
    name of the class, `Sequential` suggests, we can add the layers to the model in
    a sequential manner by calling the add method (`model.add`). The first layer is
    a convolution layer:


    ![](images/Figure-6.19.jpg)


    **Figure 6.19:** Add a convolution layer


    Let us try to understand the various parameters of the Conv2D class. Number 32
    indicates the number of filters or kernels—recall the convolution layer described
    previously. Although it is found that for the MNIST dataset 32 filters work very
    well, you can play around with this number and see how the accuracy changes.


    The next parameter (3,3) is the size of the filter. The next parameter `input_shape`
    needs to be provided only for the first hidden layer. The value of this parameter
    is the shape of the images. For the MNIST data set, which consists of images of
    size 28 × 28 pixels, we take only grayscale, and thus, we require only one channel.
    This results in an input shape of (28, 28, 1).


    This information needs to be provided to the Neural Network as a parameter for
    the first layer only. Each subsequent layer will take the output of the previous
    layer, and therefore, we need not provide any input shape.


    The last parameter is the activation function which invariably is ReLU:


    ![](images/Figure-6.20.jpg)


    **Figure 6.20:** Add a Maxpooling layer


    Moving on to the next line of code, here we add the next layer, which will be
    a pooling layer. In this case, we use `MaxPooling`, and the size of the filter
    is 2 × 2, which is provided as a parameter. Two more such pairs of convolutions
    and Maxpooling layers are added.


    Next, we add the dense layer and the Softmax layers:


    ![](images/Figure-6.21.jpg)


    **Figure 6.21:** Add dense layers


    Please note that convolution layers can accept multi-dimensional inputs, but dense
    layer requires a single dimensional input. However, the output from the convolution
    layer and Maxpooling layers are in the form of matrices (two dimensions). The
    `Flatten()` function reshapes the output of the previous Maxpooling layer into
    a one-dimensional array:


    ![](images/Figure-6.22.jpg)


    **Figure 6.22:** Add flatten


    This line of code may appear like a new layer of neurons is added, but in fact,
    this is just reshaping the tensor. This is the power and convenience of Keras.
    There will be a few more such examples we will see as we move forward. The next
    line of code is adding a Dense layer or a fully connected layer of 64 neurons,
    each with ReLU `activation` function:


    ![](images/Figure-6.23.jpg)


    **Figure 6.23:** First dense layer


    Finally, we add the classification layer or the Softmax layer. Since the MNIST
    data has 10 classes, we need 10 neurons and all of them linked to a single Softmax
    activate function:


    ![](images/Figure-6.24.jpg)


    **Figure 6.24:** Softmax layer


    That completes the creation of the multi-layer CNN model. Before we train the
    model, we have to compile it:


    ![](images/Figure-6.25.jpg)


    **Figure 6.25:** Compile


    We use `adam` optimizer and the loss function `sparse_categorical_crossentropy`.
    The metrics parameter, as always, is set to `accuracy`. It may be noted that when
    we created the model directly in TensorFlow without Keras, the loss function used
    was `categorical_crossentropy`. This is because of the difference in the way the
    labels for the MNIST data are stored in TensorFlow and Keras.


    In Keras, the MNIST labels are stored in one hot encoded format as shown below:


    ![](images/Figure-6.26.jpg)


    **Figure 6.26:** Labels


    Now that our model is ready, we can have a look at its various parameters with
    the help of the `summary` function. This function displays a summary of the model,
    which shows the number of trainable and non-trainable parameters in each layer:


    ![](images/Figure-6.27.jpg)


    **Figure 6.27:** Summary of the Neural Network


    This relatively small Convolutional Neural Network that we have just built contains
    almost 33,000 parameters, and all of them are trainable. Typically, there are
    trainable parameters only in the convolution layer. The Maxpooling layer does
    not have any trainable parameters because it is just filtering out some of the
    values.


    Before we feed the images to the model, we have to reshape it. The shape of the
    images is as follows:


    ![](images/Figure-6.28.jpg)


    **Figure 6.28:** Shape of the data


    But convolution layer expects one more dimension— recall the input shape provided
    as (`28,28,1`). Hence, we need to reshape before feeding the data to the model
    for training:


    ![](images/Figure-6.29.jpg)


    **Figure 6.29:** Reshape


    Next, we train our model by calling the fit method with three epochs:


    ![](images/Figure-6.30.jpg)


    **Figure 6.30:** Model training


    The training accuracy is 98.12%. Then, we test the model to check the test accuracy:


    ![](images/Figure-6.31.jpg)


    **Figure 6.31:** Model test


    The test accuracy is 97%. Let us run some inferences with this model using some
    test images. We can pick any image at random. In this case, if we take the image
    in index location 200:


    ![](images/Figure-6.32.jpg)


    **Figure 6.32:** Display the image


    We see that Number 3 is stored here. Let us check if the model predicts correctly.


    Before feeding the image to the model for prediction, it needs some pre-processing.
    First, the image needs to be converted to an array using `img_to_array` and then
    add one extra dimension using reshape since the model expects 4-dimensional input:


    ![](images/Figure-6.33.jpg)


    **Figure 6.33:** Prepare test image


    We use this pre-processed image to run the `predict`:


    ![](images/Figure-6.34.jpg)


    **Figure 6.34:** Inference result


    The result of the prediction is Softmax output of 10 numbers. The numbers are
    between 0 and 1. If we round off, we will get the one-hot encoded value and running
    argmax in that gives the predicted number:


    ![](images/Figure-6.35.jpg)


    **Figure 6.35:** Final result


    The model predicted it correctly. Let us try one more image in location 700.


    Number 1 is stored here. Can our model predict correctly?


    ![](images/Figure-6.36.jpg)


    **Figure 6.36:** One more inference


    Yes!


    # [Binary image classification with Keras](#toc.xhtml#s78a)'
