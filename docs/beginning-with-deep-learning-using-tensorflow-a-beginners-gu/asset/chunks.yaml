- raw: 'In this section, we will see how to build a multiclass classifier. Unlike
    the previous example where the images belonged only to two classes—`cats` and
    `dogs`. In this multiclass scenario, we will start with building a three-class
    classifier which can then be extended to any number of classes. Since we are using
    Keras, most of the process remains the same as the preceding. For example, the
    data is stored in the same folder like the preceding structure where we have the
    main subfolder, and under that, we have training data set and then the test data
    set, and within training, we have one folder for each class so in this case, we
    will take three classes one of the classes is images of um measures of four-wheelers
    then we have bikes and airplanes so these are the three classes the images are
    available for and accordingly the images are saved in the same folder structure.
    The primary difference between this example and the previous one is in the neural
    network model. We will see when we are building the neural network model that
    the difference is in the earlier example the last layer consists of the Softmax
    layer, which has three neurons since we are having three classes, whereas, in
    the previous example, it was a binary classifier therefore in the last layer there
    was just one neuron.


    Before we start going into the code, let us take a look at how the folders are
    structured:


    ![](images/Figure-6.56.jpg)


    **Figure 6.56:** Root-level


    The subfolders under data are as follows:


    ![](images/Figure-6.57.jpg)


    **Figure 6.57:** Subfolders


    And under the `train` folder,


    ![](images/Figure-6.58.jpg)


    **Figure 6.58:** "train" folder expanded


    The image files are stored in the corresponding folders. For example, this is
    a sample of the images in the subfolder `airplane`:


    ![](images/Figure-6.59.jpg)


    **Figure 6.59:** Images in "airplane" folder


    A similar structure exists for test data as well. Now let us get into the code.
    As always, we start by loading all the required libraries:


    ![](images/Figure-6.60.jpg)


    **Figure 6.60:** Import libraries and packages


    Next, we will build the neural network model. The first section has the convolution
    layers:


    ![](images/Figure-6.61.jpg)


    **Figure 6.61:** Feature extraction block


    As seen here, there are three pairs of convolutions and Maxpooling layers. This
    is followed by a single dense layer of 64 neurons:


    ![](images/Figure-6.62.jpg)


    **Figure 6.62:** Dense layers


    Then the last layer is a Softmax layer consisting of three neurons:


    ![](images/Figure-6.63.jpg)


    **Figure 6.63:** Softmax layer


    This is the main difference between this model and the model used in the previous
    example of a binary classifier. Note that, in the previous example, for the binary
    classifier, the last layer had one neuron with Sigmoid `activation` function.
    And in this example, the last layer has three neurons with Softmax `activation`
    function. Later if you need to build a model for 100 classes, you have to just
    increase the number of neurons to 100- or if for a 1000-class classifier, this
    last layer will have 1000 neurons with the Softmax `activation` function.


    The next step is to call compile method in order to specify the loss function
    and the optimizer:


    ![](images/Figure-6.64.jpg)


    **Figure 6.64:** Compile


    Let us check the configuration of the model using the `summary` method:


    ![](images/Figure-6.65.jpg)


    **Figure 6.65:** Model summary


    Our model has a little over 1 million trainable parameters. Now that the model
    is ready let us prepare the data. Create two instances of `ImageDataGenerator`,
    one each for `Train` and `Test`:


    ![](images/Figure-6.66.jpg)


    **Figure 6.66:** ImageDataGenerator instances


    Load the train and test data using these instances:


    ![](images/Figure-6.67.jpg)


    **Figure 6.67:** Train and test data


    Now that the model is ready and the data is ready, it is time to train the model.
    We will train it for five epochs:


    ![](images/Figure-6.68.jpg)


    **Figure 6.68:** Model training


    The model achieved more than 70% accuracy, which is good enough to run some inferences
    and see whether it is predicting correctly or not. You run the training for more
    epochs if you need more accuracy. The images for inference are available in the
    folder called inference, and these are not seen by the model before `ie`. These
    images are not available either in the `train` folder or the `test` folder.


    Let us start with the image of a car:


    ![](images/Figure-6.69.jpg)


    **Figure 6.69:** Load test image


    As explained earlier, before we run inference using the `predict` method, the
    image has to be converted into a NumPy array and reshaped:


    ![](images/Figure-6.70.jpg)


    **Figure 6.70:** Data preparation


    Now, we run the inference by calling the `predict` method:


    ![](images/Figure-6.71.jpg)


    **Figure 6.71:** Inference


    Observe that the output is the one-hot encoded output of the Softmax classifier.
    It is an array with three values with the second position set to 1. This means
    the model predicted that the image belongs to the second class.


    Keras allocates the class numbers in alphabetical order based on the names of
    the classes, which in turn is the same as the names of the folders. For example,
    in this case, the folder names in the test and train folders are `airplane`, `car`,
    and `motorbike`, as shown here:


    ![](images/Figure-6.72.jpg)


    **Figure 6.72:** folder names


    Therefore, the class `airplane` is assigned Number 0, `car` is 1, and `motorbike`
    is 2. And this information is stored by Keras in the property `class_indices,`
    and we can check this by running the following command:


    ![](images/Figure-6.73.jpg)


    **Figure 6.73:** class indices


    The Softmax output will correspond to this. If the result is \[1,0,0\] it means
    the model has predicted the image as `airplane`. If the result is \[0,1,0\], it
    means the model has predicted the image as a car and if the result is \[0,0,1\]
    means it has predicted the image as `motorbike`.


    With car image as input, the model returned \[0,1,0\] as we see earlier, which
    is for a car. That means our model predicted correctly. Let us try with a couple
    of more images.


    First with the image of a bike:


    ![](images/Figure-6.74.jpg)


    **Figure 6.74:** Test image


    Now, let us see the code here:


    ![](images/Figure-6.75.jpg)


    **Figure 6.75:** Inference result


    The result of \[0,0,1\] indicates the model has correctly predicted it to be a
    motorbike. Now the last image:


    ![](images/Figure-6.76.jpg)


    **Figure 6.76:** Test image of Aeroplan


    Now the code is as follows:


    ![](images/Figure-6.77.jpg)


    **Figure 6.77:** Second inference result


    The result of \[1,0,0\] indicates the model has correctly predicted this image
    as an airplane. It is usually a good idea to write a small code to convert these
    numeric results into the human-readable text, as we did in the binary classification
    example above. There are many ways of doing it, and one of the simplest ways is
    given as follows:


    ![](images/Figure-6.78.jpg)


    **Figure 6.78:** text label


    Recall the function of argmax that was explained in *[Chapter 3: TensorFlow](#c03.xhtml).*
    It returns the index of the maximum value in an array, and in this case, which
    happens to be 1. In other words, running argmax on the result directly gives us
    the class index. In this example, it is 0 for airplane.


    We use this new result value to map it to the text of the class label in the `if-else`
    condition block as shown in the preceding code.


    It''s that simple!


    # [Load from data frame—binary](#toc.xhtml#s80a)


    In the preceding example, the data was neatly arranged in subfolders. All the
    cat images were made available in the `cats` subfolder and all the dog images
    in the `dogs` subfolder. And Keras has the ability to recognize the subfolders
    as labels. Therefore, there was no need for additional labeling of the data.'
