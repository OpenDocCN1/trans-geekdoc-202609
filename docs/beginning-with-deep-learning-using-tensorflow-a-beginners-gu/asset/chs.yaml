  \ 预训练模型\n\n代码的其他部分保持不变。\n\n## 迁移学习\n\n迁移学习是一种机制，你取一个针对某些类别图像进行训练的预训练模型，然后针对一组不同的类别进行重新训练。例如，我们可以取\
  \ VGG16（它被训练用于分类 1000 种不同的日常物体），并将其重新训练用于非常特定的物体类型，可能是电机零件或计算机硬件等。这种机制的主要优势是，它在训练数据非常少时仍然有效。原因是，我们没有训练模型的所有层，因为那样会花费很长时间。只训练最后几个连接层（dense\
  \ layers）的最后层。卷积层没有训练，但它们参数的训练值被重用。这就是被称为迁移学习的原因。\n\n参考以下图：\n\n![](img/Figure-6.122.jpg)\n\
  **图 6.122:** 预训练模型\n\n在迁移学习期间，我们加载整个预训练模型，然后移除全连接层：\n\n![](img/Figure-6.123.jpg)\n\
  **图 6.123:** 特征提取层\n\n这些层保留了它们可训练参数的值。然后我们添加我们的密集层/层：\n\n![](img/Figure-6.124.jpg)\n\
  **图 6.124:** 特征提取层 + Softmax 层\n\n只有这个新层使用新数据集进行训练。因此，训练模型所需的时间非常少，所需的数据量也较少。让我们通过以下示例来看。我们将使用迁移学习和\
  \ VGG16 预训练模型创建一个三分类分类器。该练习的数据所示。这些是训练文件夹中的子文件夹：\n\n![](img/Figure-6.125.jpg)\n\
