  模型正确地预测了 `airplane`。你可以尝试 `inference` 文件夹中的其他图片。\n\n## 保存和恢复模型\n\n训练模型的目的是为了以后使用它进行推理。通常，模型的训练是开发过程的一部分，训练好的模型会被部署到生产系统中进行实时应用。Keras\
  \ 提供了一种了一种简单的方法来保存训练好的模型，以便以后进行推理。在本节中，我们将看到如何在训练后保存模型，然后恢复该模型以运行推理。正如我们在之前的神经网络章节中所看到的，训练过程涉及更改神经网络不同层中神经元的权重和偏置。因此，保存模型意味着保存这些权重和偏置以及配置（层数、激活函数和每层神经元的数量等）。所有这些都保存到一个模型文件中，然后可以重新加载用于推理。为了保存模型，我们使用相同的方法。假设在上面的示例中你对模型的性能满意，并想保存它以便以后进行推理。你只需要添加下面的一行代码：\n\
  \n![](img/Figure-6-105.jpg)\n\n**图 6.105:** 模型保存\n\n这会将模型保存到本地驱动器：\n\n![](img/Figure-6-106.jpg)\n\
  \n**图 6.106:** 本地驱动器上的文件\n\n\n\n\n此文件包含训练模型中所有可训练参数的值。此文件可以传输到任选位置，供运行推理的应用程序使用。在这种情况下，让我们假设它保留在相同位置，并且想使用它来对几张测试图像进行推理。我们可以创建一个新的\
  \ Jupyter notebook。导入一些库和一些基础包：\n\n![](img/Figure-6.107.jpg)\n**图 6.107:** 导入库\n\
  \n使用 `load_model` 方法加载训练好的模型，并将保存模式的文件作为参数传递：\n\n![](img/Figure-6.108.jpg)\n**图\
  \ 6.108:** 加载模型\n\n我们可以运行 `summary` 方法来检查模型的配置：\n\n![](img/Figure-6.109.jpg)\n**图\
  \ 6.109:** 模型摘要\n\n由于这是一个训练好的模型，你可以直接对其运行推理。我们从加载图像开始：\n\n![](img/Figure-6.110.jpg)\n\
  **图 6.110:** 测试图像\n\n对图像进行预处理：\n\n![](img/Figure-6.111.jpg)\n**图 6.111:** 数据准备\n\
  \n然后进行预测：\n\n![](img/Figure-6.112.jpg)\n**图 6.112:** 推理\n\n这张图像被正确预测了。保存和恢复模型的另一个用途是你可以使用额外的训练数据重新训练模型。例如，在开发模型时，假设只有\
  \ 5000 张图像可供训练。模型被训练到了 80% 的准确率。随着时间的推移，也许一年后，你有了更多的训练数据，可能有 5000 张。你可以恢复此模型并从上次停止的地方重新训练，准确率将从\
  \ 80% 增加到 90% 或更高。\n\n## 预训练模型\n\n通常情况下，训练 CNN 模型是一项枯燥且耗时的活动。在之前的示例中，数据量相对较小，即使类别数量也很小。在现实生活中，模型需要针对数百个类别、成千上万甚至数百万张图像进行训练。这需要大量的计算能力，而计算是非常昂贵的。好消息是，我们不需要为每一个问题都训练一个新模型。有几个免费的预训练模型，可以用于构建应用程序来解决一些常见问题。\n\
  \n这些预训练模型是由一些负担得起巨额计算能力的大机构在数百万张图像上训练的。这这也是 ImageNet 年度竞赛的一部分，ImageNet 托管了数百万张带标记的图像。\n\
  \n一些预训练模型包括 VGGNet、ResNet、ZFNet、GoogLeNet 等。这些模型与 Keras API 紧密集成。让我们看看如何使用它们。\n\n\
