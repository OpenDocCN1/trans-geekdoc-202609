  \ `fit` 方法训练模型。使用 `DecisionTree.Score` 并传递测试数据衡量模型的准确率：\n\n![](img/Figure-2.44.jpg)\n\
  \n**图 2.44:** 模型评估\n\n在这种情况下，准确率为 99%。\n\n## 支持向量机 (SVM)\n\n支持向量机可用于分类和回归。在这个演示中，我们将使用它进行分类。数据集包含个人的高度和体重，但没有标签。\n\
  \n## 无监督学习\n\n聚类是在数据没有标签时使用的技术。常见的聚类类型有两种：\n\n\n在这个演示中，我们将使用 k-means 聚类来理解它的工作原理。K-means\
  \ 中的 `K` 代表簇的数量，这必须由我们定义。从技术上讲，`K` 的值可以从 1 一直到观测数量。但为了获得有意义的见解，簇的数量通常很小，例如 3 或 5。一旦定义了数量，算法就会寻找数据点之间的相似性并创建相似的数据簇。\n\
  \n现在让我们查看演示代码。与监督学习不同，这里不需要分离特征和标签，因为没有标签。唯一的数据准备是使用 `StandardScaler` 对数据进行标准化。这将确保所有特征具有统一的范围：\n\
  \n![](img/Figure-2.46.jpg)\n\n**图 2.46:** 导入数据集\n\n让我们导入数据集并查看数据集的前几条记录：\n\n![](img/Figure-2.47.jpg)\n\
  \n**图 2.47:** 加载数据\n\n![](img/Figure-2.48.jpg)\n\n**图 2.48:** 数据值\n\n我们通过调用 `KMeans`\
  \ 函数并传递 `K` 的值（即簇的数量）来运行 K-means 算法：\n\n\n\n现在问题是如何确定 `k` 的值（即聚类数量）。这不应该与分类混淆。在分类中，类别的数量是已知的，因为我们有类别的标签。但在聚类中，我们并不知道正确的簇数量应该是多少。从技术上讲，数据可以分成任意数量的簇（即\
  \ `K` 可以取任何值）。但在实践中，这将是没有意义的。\n\n有一种被称为“肘部法”（elbow technique）的技术，用于确定 `k` 的最优值。这个名字源于\
  \ `wcss` 与簇数量之间绘图所示的形状。\n\n衡量模型性能的方法之一是 `wcss` —— 簇内平方和（within-cluster sum of squares）的缩写。它是簇中每个点到其质心距离的平方和。这个数值越小越好。数值越小，意味着簇中的项目越相似。`wcss`\
  \ 的值随着 `k` 的值而变化。当这些值被绘制成图时，图表呈现出弯曲手肘的形状：\n\n![](img/Figure-2.51.jpg)\n\n**图 2.51:**\
  \ 肘部法\n\n对于某个特定的 `k` 值，`wcss` 值趋于平缓。这就是 `k` 的最优值。为了实现这一点，我们为 `k` 创建了一个从 1 到 10 或\
  \ 15 的 `for` 循环，计算 `wcss` 的值并将其绘制：\n\n![](img/Figure-2.52.jpg)\n\n**图 2.52:** wcss\
  \ 图表\n\n从图中可以看出，最优值 `k =4`：\n\n![](img/Figure-2.53.jpg)\n\n**图 2.53:** 聚类图，k=4\n\
  \n此功能的代码可以在 GitHub 上找到。\n\n到目前为止，这就是你对机器学习和 scikit-learn 所需要了解全部全部了。当我们谈论深度学习时，这些概念中的许多将被重复使用。我们还会复用一些代码，特别是\
  \ `accuracy_score`、`train_test_split` 和 `confusion_matrix` 方法。\n\n## 结论\n\n这标志着我们关于机器学习章节的结束。掌握了这些机器学习的基础知识，你将在接下来的章节中理解深度学习的概念。对于深度学习，我们将使用\
