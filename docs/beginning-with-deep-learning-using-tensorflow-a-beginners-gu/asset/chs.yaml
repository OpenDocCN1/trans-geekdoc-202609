  \n## 结论\n\n这标志着本章的结束。图像识别是人工智能和深度学习的重要组成部分，在本章中，我们讨论了如何使用 `Convolution Neural Networks\
  \ (CNN)` 进行图像识别，并学习了各种代码演示和示例。\n\n在接下来的章节中，我们将讨论 AI 的另一个重要组件，即语音识别。\n\n## 记忆要点\n\
  \n*   卷积神经网络用于图像识别。\n*   `VGG16` 和 `ResNet` 等预训练模型可以免费用于图像分类。\n*   当训练数据较少时，可以使用迁移学习来创建分类模型。\n\
  *   目标检测有许多实际应用，因为它能识别图像中的多个物体。\n\n# 第 7 章：语音识别\n\n## 引言\n\n图像识别和语音识别是当今人工智能和深度学习中的两个主要子领域。在上一章中，我们已经看到了图像识别是如何工作的。在本章中，我们将看到语音识别是如何工作的，以及它的一些应用。多年来，语音识别领域的进展非常缓慢。但在过去的几年里，取得了许多重大进展，特别是随着\
  \ transformers 的出现。进展缓慢的部分原因在于语音识别的复杂性。在开始之前，让我们先澄清术语。`Speech recognition`（语音识别）最初被发明为对语音的解释，这只是整个过程的一部分，但今天，语音识别指的是识别人类语音的整个端到端过程，将其转换为文本以供\
  \ `Natural Language Processing` (`NLP` 自然语言处理）使用，并将结果转换回语音（合成）。在本章中，我们将讨论整个端到端的过程。\n\
  \n## 结构\n\n本章将涵盖以下主题：\n\n*   什么是语音识别？——历史视角\n*   语音识别是如何工作的？\n*   自然语言处理 (NLP)\n\
  *   语言模型\n*   词嵌入——Word2Vec\n*   循环神经网络 (RNN)\n*   使用 RNN 进行文本分类\n*   Transformers\n\
  *   使用 BERT 进行文本分类\n*   使用 BERT 进行问答——SQUAD\n\n## 目标\n\n读完本章后，你将能够使用深度学习理解语音识别和\
  \ NLP 的概念。这里涵盖了一些最新的技术（如 transformers），并配有实操代码演示，帮助你尝试并更快地掌握概念。\n\n## 什么是语音识别？——历史视角\n\
  \n人类一直对与机器或计算机对话的概念着迷，这在《星球大战》等几部科幻电影中得到了很好的描绘。\n\n第一个非语音识别设备是由贝尔实验室的科学家于 1952 年开发的；它被称为\
  \ `Audrey` 或音频数字识别；这与我们在图像识别章节中看到的手写识别类似；该设备可以识别从零到九的口头数字或字符，被认为是一项突破性的创新。它只能识别离散的口头数字。在\
  \ 20 世纪 60 年代初，IBM 开发了 `Shoebox`，它可以执行简单的数学运算命令。它能够识别 16 个口头单词，包括数字 0–9（参见 `figure\
  \ 7.1`）：\n\n![](img/Figure-7.1.jpg)\n\n**图 7.1:** 语音识别的早期趋势\n\n从那时以后，语音识别已经取得了长远发展。如今的语音识别系统可以处理数千个词的词汇且具有高准确率。\n\
  \n## 语音识别的应用\n\n语音识别今天非常普遍；几乎每个人每天都会使用语音识别，例如 `Siri`、`小同学` 以及支持语音的机器人都是语音识别应用的示例。语音识别让与机器交互变得非常容易，因此该领域引起了大量的关注。\n\
  \n与图像识别相比，语音识别是一个复杂得多的过程，因为它涉及许多步骤。在图像识别中，输入是图像，神经网络分类器的结果不需要转换，因为神经网络无法处理原始音频。因此，需要将原始音频转换为文本，以便神经网络进行处理。\n\
  \n如今的语音识别系统工作所示：\n\n![](img/Figure-7.2.jpg)\n\n**图 7.2:** 语音识别过程\n\n这是一个多步骤的过程。语音信号转换为文本，然后使用\
  \ NLP 进行处理，生成的文本再通过被称为合成的过程转换回语音。在这个过程中，NLP 发挥了关键作用，而它反过来又有多个组件。深度学习对 NLP 领域的最新发展产生了巨大影响，这将是我们本章的重点。关于语音转文本和文本转语音的文献已经有很多了，因此我们在本章中重点关注\
  \ NLP。\n\nNLP 具有以下组件：\n\n*   词嵌入\n*   语言模型\n*   序列序列模型——RNN、LSTM 和 GRU\n*   Transformers\n\
  \n在开始之前，让我们先快速看一个语音转文本和文本转语音的简单演示。\n\nJupyter 笔记本 `speechrecog.ipynb` 位于提供的 GitHub\
