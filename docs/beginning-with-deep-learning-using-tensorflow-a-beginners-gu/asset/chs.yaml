  \ 2.x 的步骤将在第 5 章：TensorFlow2.x 中给出。\n\n# 回归算法](#toc.xhtml#s18a)\n\n当目标是身高、重量、体积、压力等连续变量时，就会进行回归。让我们从最基础的机器学习算法开始：简单线性回归。\n\
  \n简单线性回归是最简单的机器学习算法。正如其名称所示，它是一个线性函数——模型是直线的方程：\n\n`Y = mx +c`\n\n其中 `m` 和 `c` 是模型的参数。`Y`\
  \ 被称为因变量，而 `X` 被称为**自变量**。在简单线性回归中，只有一个自变量或特征。如果有多个特征或自变量，则被称为多元线性回归（多元回归）。\n\n\
  训练完成后，该模型用于根据给定的 `x` 值预测 `Y` 的值。让我们来看一个例子。下面给出了总成本和物品数量的训练数据。假设销售者对所售的物品提供随机折扣，通常情况下，物品数量越多，折扣越高——但折扣金额并不是固定或一致的。目前面临的问题是开发一个线性回归模型，以便根据物品数量（`x`）预测出总成本：\n\
  \n| **物品数量 (*x*)** | **总成本 (*Y*)** |\n| --- | --- |\n| 40 || 300 |\n| 20 || 170\
  \ |\n| 10 || 90 |\n| 50 || 450 |\n| 100 || 800 |\n| 35 || 320 |\n| 24 || 210 |\n\
  | 20 || 190 |\n| 20 || 180 |\n| 30 || 270 |\n| 40 || 360 |\n| 50 || 400 |\n| 30\
  \ || 100 |\n| 45 || 400 |\n| 30 || 270 |\n| 10 || 95 |\n| 20 || 180 |\n| 30 || 280\
  \ |\n| 25 || 230 |\n| 49 || 460 |\n| 57 || 470 |\n| 67 || 570 |\n\n**表 2.5:** 数据\n\
  \n如果绘制一个基础散点图，它看起来像图 2.19。从视觉上可以看出，物品数量与总成本之间存在线性相关关系，但同时，数据并不是共线的，也就是说，不在同一条直线上。因此，可能存在多条直线。这就是简单线性回归的挑战，即找到一条在预测时产生误差最小的直线：\n\
  \n![](img/Figure-2.19.jpg)\n\n**图 2.19:** 简单线性回归\n\n简单线性回归的训练可以通过可以通过图表示：\n\n![](img/Figure-2.20.jpg)\n\
  \n**图 2.20:** 训练过程\n\n在模型训练过程中，模型的参数——`m` 和 `c` 初始化为某些随机值。根据给定的 `x` 值计算输出（`y1`）（即\
  \ `predicted`）。然后将输出与已知值/标签（`y`）进行比较，并计算误差。更新参数值并重复该过程。通过迭代执行此操作以减少误差。换句话说，训练过程在每次迭代中尝试拟合一条直线并计算误差。虽然目标是使误差降为零，但并非总是可能的。因此，误差最小化是可以尽可能实现的。在训练过程结束，确定了*最佳拟合线*以及参数\
  \ `m` 和 `c`。\n\n# 代码演示](#toc.xhtml#s19a)\n\n在这个演示中，我们将使用 Python 和 scikit-learn 在数据集上训练一个线性回归模型。代码大致分为以下三个部分：\n\
