  \ 模型评估\n\n可以通过调用 `score` 方法来衡量准确率，该方法接受测试数据作为参数。在下一节中，我们将以分类为例例，并尝试应用各种分类算法。\n\n\
  ## 逻辑回归\n\n逻辑回归主要是一种二分类算法，即它被用于将数据分为两类。当然，通过稍作调整，它也可以用于多分类分类。\n\n在这个示例中，我们将学习构建一个分类器，用于预测学生是否能获得大学录取。这是基于训练数据的，这些数据包含特征：GRE\
  \ 分数、托福分数、大学排名等。`Admit` 是一个具有二值（0 或 1）的 `Target`（目标）。\n\n1 表示学生被录取，0 表示没有。逻辑回归使用\
  \ sigmoid 函数来执行分类。sigmoid 函数的数学表达式如下：\n\n![](img/c02eq-1.jpg)\n\n`a1`、`a2`……以及 `b`\
  \ 是可训练的系数，模型将在训练过程中不断调整这些系数。让我们来看代码：\n\n![](img/Figure-2.36.jpg)\n\n**图 2.36:**\
  \ 导入数据\n\n使用 `pandas` 将数据读入数据框（data frame）：\n\n![](img/Figure-2.37.jpg)\n\n**图 2.37:**\
  \ 数据准备\n\n将数据框拆分为特征 (`x`) 和目标 (`y`)。将数据拆分为训练集（75%）和测试集（25%）：\n\n![](img/Figure-2.38.jpg)\n\
  \n**图 2.38:** 分割数据\n\n与线性回归一样，`scikit-learn` 中也提供了逻辑回归的实现。创建一个逻辑回归实例，并通过传递训练数据使用\
  \ `fit` 方法训练模型：\n\n![](img/Figure-2.39.jpg)\n\n**图 2.39:** 逻辑回归\n\n一旦训练完成，将使用 `predict`\
  \ 方法配合测试数据对模型进行测试。\n\n在分类情况下，混淆矩阵是理解模型准确性的一个很好的可视化工具。`scikit-learn` 提供了一个可用函数来创建混淆矩阵。它接受测试数据的标签\
  \ (`y_test`) 和预测值 (`y_pred`)。\n\n混淆矩阵中所有数字的和等于测试数据中的观测数量。例如，在我们的案例中，总共有 125 个观测。\n\
  \n对角线值之和是预测正确的值。在这种情况下，该数值为 119，这意味着有 6 (5+1) 个观测被分类错误。因此，准确率为 119/125 = 0.952 或\
  \ 95.2%：\n\n![](img/Figure-2.40.jpg)\n\n**图 2.40:** 模型性能\n\n对混淆矩阵的详细讨论超出了本文范围，但足以说它是分类中一种强大的视觉工具，我们稍后使用神经网络进行分类时也会使用它。\n\
  \n准确率也可以通过 `metrics.accuracy_score` 方法并传递测试标签和预测值作为参数来计算。输出结果与之前相同：95.2%。\n\n这将适用于神经网络。\n\
  \n## 决策树\n\n决策树是一种非常流行的机器学习算法，可同时用于分类和回归，但主要用于分类。它之所以流行是因为易于理解且具有强大的可视化能力。\n\n让我们举一个例子来看代码。在这个演示中，我们将使用决策树算法来构建并训练一个对潜在客户进行分类的模型：\n\
