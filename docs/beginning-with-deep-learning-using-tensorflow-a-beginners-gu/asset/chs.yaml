  \ Colab：\n\n![](img/Figure-5.20.jpg)\n\n**图 5.20：** Google Colab\n\n## TensorFlow\
  \ 2 有哪些新特性？\n\nKeras 是一个高层 API，有助于更快地开发神经网络模型，从而缩短项目中的开发时间。Keras 同样适用于 TensorFlow\
  \ 1，但它在 TensorFlow 2 中集成得更加紧密并内置其中。\n\nKeras 最常见且流行的功能之一是序列模型（sequential model）。使用序列模型可以很容易地创建复杂的多层神经网络，包括一些高级类型，如**卷积神经网络\
  \ (CNN)**，我们将在下一章节中看到。\n\n让我们从非常简单的 MNIST 示例开始，像上一章一样创建一个带有单隐藏层的分类器，但这次使用 Keras。如既往一样，第一步是导入\
  \ TensorFlow 库。MNIST 是 Keras 包的一部分；我们加载 MNIST 数据集：\n\n\n\n\n`x_train` 包含训练图像，`y_train`\
  \ 包含训练标签。同样，`x_test` 包含测试图像，`y_test` 包含测试标签。\n\n需要注意的是，标签并不是独热编码（one-hot encoded）格式，这与我们在上一章中使用\
  \ TensorFlow 的 MNIST 数据集时看到的情况不同。\n\n让我们来看标签：\n\n![](img/Figure-5.25.jpg)\n\n**图\
  \ 5.25:** 标签\n\n如你所见，标签是 0 到 9 之间的整数。然后我们对数据进行归一化，并准备好输入模型：\n\n![](img/Figure-5.26.jpg)\n\
  \n**图 5.26:** 数据归一化\n\n使用 Keras 构建模型非常简单。我们使用 `sequential` 模型，它非常易理解和使用。我们首先创建一个模型实例，并使用\
  \ `add` 方法逐个添加层：\n\n![](img/Figure-5.27.jpg)\n\n**图 5.27:** 使用 `add()` 创建模型\n\n\
  上一段代码的第二行并不是真正的神经元层。`Flatten` 函数将输入重塑为一维张量。这是必要的，因为接下来将添加的隐藏层只能接受一维输入。输出是一个包含 784\
  \ 个元素的数组（`28*28=784`）。这将作为具有 10 个神经元的单层隐藏层的输入：\n\n![](img/Figure-5.28.jpg)\n\n**图\
  \ 5.28:** 输入到具有 10 个神经元的隐藏层\n\n在前面的语法中，添加了一层全连接（或密集）神经元层。该层中的神经元数量为 10，激活函数为 `Softmax`。\n\
  \n接下来，我们需要提供训练网络的细节。对于 Keras，它提供了一个函数调用 `compile`，其中提供了如优化器类型、损失函数等输入：\n\n![](img/Figure-5.29.jpg)\n\
  \n**图 5.29:** `compile` 函数的使用\n\n我们选择的优化器类型为 `adam`，它是 Keras 中最常用的优化器。这里使用的损失函数是\
  \ `sparse_categorical_crossentropy`。另一个可用的损失函数是 `categorical_crossentropy`。\n\n\
  注意这两个变体之间的区别很重要。使用哪一个取决于标签信息。如果标签是独热编码格式，我们就使用 `categorical_crossentropy`。但如果标签是像本例这样的普通数字，我们必须使用\
  \ `sparse_categorical_crossentropy`。\n\n最后一个参数 `metrics` 几乎总是被设置为值 `['accuracy']`。这告诉我们训练结果应该如何显示。\n\
  \nKeras 网站 `keras.io` 上提供了每个参数的详细文档——如果你感兴趣，可以查阅。现在模型已经准备好了，在开始训练之前，我们可以使用 `summary`\
  \ 函数检查模型的配置：\n\n![](img/Figure-5.30.jpg)\n\n**图 5.30:** `summary()` 的使用\n\n如 *图\
  \ 5.30* 所示，摘要显示了模型的配置并提供了每一层的细节。输出是一个包含 784 个元素的数组（`28*28=784`）。这将作为具有 10 个神经元的单层隐藏层的输入。每个神经元有\
  \ 784 个权重。由于有 10 个神经元，权重总数为 `784*10 = 7840`。每个神经元都有一个偏置——因此总参数数量为 `7840+10=7850`。在更复杂的网络（如我们稍后提到的\
  \ `CNN`）中，会有一些参数是不可训练的，这被称为非训练参数。\n\n现在是时候训练我们的模型了。与普通程序不同，在 Keras 中训练模型仅仅是一个函数调用。`fit`\
  \ 方法使用训练数据训练模型。\n\n![](img/Figure-5.31.jpg)\n\n**图 5.31:** `fit()` 的使用\n\n`fit`\
  \ 函数接受三个参数——训练图像、训练标签和轮次数（epochs）。在本例中，`x_train` 拥有训练图像，`y_train` 拥有训练标签。我们将 epoch\
  \ 数量设置为 5。每个 epoch 的结果都会显示在输出中。损失随每个 epoch 减少，准确率随之增加。在第五个 epoch 结束时，训练准确率达到 92.56%。\n\
  \n现在让我们用测试数据测试模型。为此，Keras 提供了 `evaluate` 函数。它的工作原理与 `fit` 类似，但没有 epoch。\n\n![](img/Figure-5.32.jpg)\n\
  \n**图 5.32:** `evaluate()` 的使用\n\n`evaluate` 接受两个参数——测试图像和相应的标签。测试损失和准确率分别为 0.1973%\
  \ 和 92.71%。如你所见，只需大约 10 行代码，我们就能使用 Keras 构建、训练并测试一个模型。\n\n让我们再看几个例子。如果我们想进一步提高准确率并想要一个多层神经网络呢？使用\
