  \ `fit` 方法并设置 100 个轮次（epochs）来运行训练：\n\n![](img/Figure-5.46.jpg)\n\n**图 5.46：** 使用\
  \ fit 方法运行训练\n\n我们看到训练率接近 89%。这标志着本章的结束。代码可以通过 GitHub 链接获取。\n\n# 结论 (#toc.xhtml#s70a)\n\
