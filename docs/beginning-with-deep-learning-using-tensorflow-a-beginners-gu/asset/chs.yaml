  \ 编写的 Keras 代码可以在 TensorFlow2 中无需任何重大更改运行。\n\n# 第 6 章 (#toc.xhtml#c06)\n\n# 图像识别\
  \ (#toc.xhtml#c06)\n\n# 引言 (#toc.xhtml#s72a)\n\n图像识别和语音识别是今天人工智能和深度学习中的两个主要子领域。在本章中，我们将了解图像识别的工作原理以及它的应用。图像识别也被认为是更广泛的计算机视觉领域的一部分，这是我的机器模拟人类视觉的技术。例如，机器人利用摄像头通过计算机视觉来检测路径上的障碍。\n\
  \n# 结构 (#toc.xhtml#s72a)\n\n在本章中，我们将了解图像识别的工作原理以及它的应用。图像识别也被认为是更广泛的计算机视觉领域的一部分，这是我的机器模拟人类视觉的技术。例如，机器人利用摄像头通过计算机视觉来检测路径上的障碍。\n\
  \n# 结构 (#toc.xhtml#s73a)\n\n在本章中，我们将了解图像识别的工作原理以及它的应用。图像识别也被认为是更广泛的计算机视觉领域的一部分，这是我的机器模拟人类视觉的技术。例如，机器人利用摄像头通过计算机视觉来检测路径上的障碍。\n\
  \n# 目标 (#toc.xhtml#s74a)\n\n在本章中，我们将了解图像识别的工作原理以及它的应用。图像识别也被认为是更广泛的计算机视觉领域的一部分，这是我的机器模拟人类视觉的技术。例如，机器人利用摄像头通过计算机视觉来检测路径上的障碍。\n\
  \n# 介绍卷积神经网络 (CNN) (#toc.xhtml#s75a)\n\n在本章中，我们将了解图像识别的工作原理以及它的应用。图像识别也被认为是更广泛的计算机视觉领域的一部分，这是我的机器模拟人类视觉的技术。例如，机器人利用摄像头通过计算机视觉来检测路径上的障碍。\n\
  \n# 卷积层 (#toc.xhtml#s76a)\n\n\n\n\n\n在我们开始之前，你需要先理解用到的一些术语。第一个是过滤器（filter）或卷积核（kernel）——这无非是一个方矩阵。矩阵中的每个单元格都有一个数字，被称为\
  \ `weight`（权重）。这也是为什么有时它被称为加权矩阵的原因：\n\n这里有一个示例。\n\n| 0 || 1 || 1 |\n| --- | ---\
  \ | --- |\n| 1 || 0 || 0 |\n| 1 || 0 || 1 |\n\n这是一个 3×3 的过滤器或卷积核。为了保持示例简单易于理解，权重被保持为\
  \ 0 和 1，但在其他情况下，这些值是某些实数，包括负值。\n\n每个卷积层可以有多个过滤器，而每个过滤器中这些权重的组合是唯一的。这意味着给定的卷积层中，没有两个过滤器的权重完全相同。为了说明，让我们假设有一张\
  \ 6×6 的图像。机器将图像看作一组像素值的集合。因此，这张图像是一个 6×6 的矩阵，其像素值如图所示：\n\n![](img/Figure-6.4.jpg)\n\
  \n**图 6.4:** 示例图像像素值\n\n卷积的过程就像扫描。过滤器从左到右、从上到下扫描图像，产生一个被称为 `feature map`（特征图）的输出。特征图反而是另一个数字矩阵。新矩阵中的数字是某些计算的结果，如下例所示。注意，这不是矩阵乘法：\n\
  \n![](img/Figure-6.5.jpg)\n\n**图 6.5:** 卷积的第一步\n\n第一个数字的计算如下：\n\n(81×0 + 2×1 + 209×1)\
  \ + (24×1 + 56×0 + 108×0) + (91×1 + 0×0+189×1) = 515\n\n过滤器向右移动一个像素并再次执行相同的计算，从而得到特征图中第二个单元格的值：\n\
  \n![](img/Figure-6.6.jpg)\n\n**图 6.6:** 下一步\n\n第二个数字的推导如下：\n\n(2×0 + 209×1+ 44×1)+(56×1\
  \ + 108×0+98×0)+(0×1 + 189×0 + 65×1) = 374\n\n特征图的创建如下：\n\n![](img/Figure-6.7.jpg)\n\
  \n**图 6.7:** 特征图\n\n通过这种方式，创建了一个完整的特征图。然后，使用带有另一组权重的下一个过滤器，重复该过程并创建一个新的特征图。因此，在特定的卷积层中，如果有五个过滤器，该卷积层的输出将会有五个特征图。\n\
  \n特征图的大小要么与图像的大小相同，要么小于图像，这取决于 `stride`（步长）。`Stride` 是像素移动的像素数。默认情况下，它为 1。在这种情况下，特征图的大小等于图像的大小。但\
  \ `stride` 可以增加到 2 或 3，在这种情况下，特征图的大小将比图像小。\n\n所以，如果在上述的示例中将 `stride` 设置为 2，那么过滤器的第二个位置将如图所示：\n\
  \n![](img/Figure-6.8.jpg)\n\n**图 6.8:** 步长 = 2 的卷积\n\n现在有了另一个问题。在这种情况下，我们观察到最后一列被遗漏了。最后一行也会遗漏，因为没有足够的像素让过滤器移动：\n\
  \n![](img/Figure-6.9.jpg)\n\n**图 6.9:** 步长为 2 的卷积\n\n在这种情况下，我们观察到最后一列被遗漏了。最后一行也会遗漏，因为没有足够的像素让过滤器移动。这就是使用填充（padding）来解决这个问题的原因。通过填充，图像的大小可以保持不变，如图\
  \ 6.10 所示：\n\n![](img/Figure-6.10.jpg)\n\n**图 6.10:** 填充填充\n\n\n\n\n\n我们将从导入 TensorFlow\
  \ 以及其他必要的库和包开始。你可能已经熟悉其中的一些内容，这些我们在之前的章节中用过。有些包是新的，例如 `Conv2D` 和 `Maxpooling2D`，它们被用于创建卷积层和最大池化层：\n\
  \n![](img/Figure-6.15.jpg)\n\n**图 6.15:** 导入所需的库\n\n之后，我们导入并准备数据。这部分没有新内容，因为我们在上一个章节已经做过这些：\n\
  \n![](img/Figure-6.16.jpg)\n\n**图 6.16:** 加载 MNIST 数据\n\n### 使用 Keras 创建模型\n下一步是创建我们的卷积神经网络（CNN）。这包含两个部分：一部分是卷积基，由一系列卷积层和池化层组成；后面是几个全连接层（dense\
  \ layers）。最后，我们以 Softmax 层结束：\n\n![](img/Figure-6.17.jpg)\n\n**图 6.17:** 模型创建\n\n\
  Keras 提供了一种简单方便的方法，使用 `Sequential` 类以及其他关联类（如 `Conv2D` 和 `MaxPooling2D`）来创建 CNN\
  \ 模型。让我们逐行查看这些代码：\n\n![](img/Figure-6.18.jpg)\n\n**图 6.18:** 创建 sequential 实例\n\n\
  我们创建了 `Sequential` 类的实例并命名为 \"`model`”。正如类名 `Sequential` 所暗示的，我们可以通过调用 `add` 方法（`model.add`）按顺序将层添加到到模型中。第一层是卷积层：\n\
  \n![](img/Figure-6.19.jpg)\n\n**图 6.19:** 添加卷积层\n\n让我们尝试理解 `Conv2D` 类的各种参数。数字 32\
  \ 表示过滤器（filters）或卷积核（kernels）的数量——回想之前描述的卷积层。虽然发现对于 MNIST 数据集，32 个滤波器的效果非常好，但你可以尝试调整这个数字，看看准确率会发生变化。\n\
  \n下一个参数 `(3,3)` 是滤波器的尺寸。下一个参数 `input_shape` 只需要为第一个隐藏层提供。该参数的值是图像的形状。对于由 28 × 28\
  \ 像素图像组成的 MNIST 数据集，我们只取灰度图，因此我们只需要一个通道。这导致了输入形状为 `(28, 28, 1)`。\n\n此信息只需要作为参数提供给神经网络的第一层。随后的每一层都将接收上一层的输出，因此我们不需要提供任何输入形状。\n\
  \n最后一个参数是激活函数，它始终是 `ReLU`：\n\n![](img/Figure-6.20.jpg)\n\n**图 6.20:** 添加最大池化层\n\n\
  继续看下一行代码，在这里我们添加下一层，它是一个池化层。在这种情况下，我们使用 `MaxPooling`，滤波器的尺寸为 2 × 2，并作为参数提供。又添加了两个此类卷积层和最大池化层。\n\
  \n接下来，我们添加全连接层和 Softmax 层：\n\n![](img/Figure-6.21.jpg)\n\n**图 6.21:** 添加全连接层\n\n\
  请注意，卷积层可以接受多维输入，但全连接层需要单维输入。然而，卷积层和最大池化层的输出是矩阵形式（二维）的。`Flatten()` 函数将上一个最大池化层的输出重塑为一维数组：\n\
  \n![](img/Figure-6.22.jpg)\n\n**图 6.22:** 添加 flatten\n\n这行代码看起来像添加了新层神经元，但实际上，这只是在重塑张量。这就是\
  \ Keras 的强大和方便之处。随着我们的进行，我们将看到更多类似的例子。下一行代码是添加一个具有 64 个神经元的 `Dense` 层或全连接层，每个神经元都有\
  \ `ReLU` 激活函数：\n\n![](img/Figure-6.23.jpg)\n\n**图 6.23:** 第一层全连接层\n\n最后，我们添加分类层或\
  \ Softmax 层。由于 MNIST 数据有 10 个类，我们需要 10 个神经元，并将它们全部连接到单个 Softmax 激活函数：\n\n![](img/Figure-6.24.jpg)\n\
  \n**图 6.24:** Softmax 层\n\n多层 CNN 模型的创建完成完成。在训练模型之前，我们必须编译它：\n\n![](img/Figure-6.25.jpg)\n\
  \n**图 6.25:** 编译\n\n我们使用 `adam` 优化器和损失函数 `sparse_categorical_crossentropy`。`metrics`\
  \ 参数一如既往被设置为 `accuracy`。需要注意的是，当我们直接在 TensorFlow 中不使用 Keras 创建模型时，使用的损失函数是 `categorical_crossentropy`。这是因为\
  \ TensorFlow 和 Keras 中存储 MNIST 数据标签的方式存在差异。\n\n在 Keras 中，MNIST 标签以独独热编码（one-hot\
  \ encoded）格式存储，如下所示：\n\n![](img/Figure-6.26.jpg)\n\n**图 6.26:** 标签\n\n现在我们的模型已经准备就绪，我们可以借助\
  \ `summary` 函数查看它的各种参数。该函数显示模型的摘要，展示了每层中可训练参数和不可训练参数的数量：\n\n![](img/Figure-6.27.jpg)\n\
  \n**图 6.27:** 神经网络摘要\n\n\n\n\n到目前为止，我们已经使用 MNIST 执行了图像分类，这是一个内部数据集。这是理解 CNN 如何工作的一个很好的开始，而无需过多担心加载和准备外部数据。在本节中，我们将导入外部数据。Keras\
  \ 提供了非常强大的功能，可以轻松地进行图像分类。我们从使用著名的猫狗数据进行二分类开始。这就像是图像分类领域的 `Hello world`。数据以 JPEG\
  \ 文件的形式存在。它们被分为训练集和测试集。每个数据集都包含若干猫和狗的图像。这些数据的标注非常简单。所有的狗的照片都存储在一个名为 `dogs` 的文件夹中，所有的猫的照片都存储在一个名为\
  \ `cats` 的文件夹中。请记住，数据有多种标注方式，这是其中一种。\n\n这是该数据的文件夹结构：\n\n![](img/Figure-6.37.jpg)\n\
  \n**图 6.37:** 数据的文件夹结构\n\n现在我们已经对数据集有了了解，让我们进入代码。这个示例与上一个示例的主要区别在于数据加载和准备的方式。CNN\
  \ 模型的构建过程保持不变。\n\n所以，像既往一样，我们导入所有需要的库，可以看到我们正在使用 TensorFlow 2：\n\n![](img/Figure-6.38.jpg)\n\
  \n**图 6.38:** 加载库\n\n注意，如果尝试 `from tf.keras.models import Sequential`，将会报错——我们必须使用\
