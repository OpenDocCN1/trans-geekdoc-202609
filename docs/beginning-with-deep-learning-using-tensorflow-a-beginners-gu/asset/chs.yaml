  \n一个经典的例子是单词 `bank`。这个词有两个不同的含义：一个是我们存放钱的银行，另一个可能是河岸。我们根据语境来理解含义：\n\n`Rajesh is\
  \ going to the bank to withdraw cash.`\n\n在句子句子中，很清楚这个词的意思是我们存放钱的地方。我们还有另一个句子：\n\
  \n`Ramesh is sitting on the bank and enjoying the breeze.`\n\n在这种情况下，这个词的意思是河岸。`ELMO`\
  \ 是早期基于上下文的嵌入模型之一。它使用了 `Bidirectional LSTM`。`LSTM` 是 `RNN` 的变体。然而，嵌入领域的最新进展是基于 transformer\
  \ 的语言模型，如 `BERT`。我们将在下一节关于语言模型中理解它们。\n\n## 语言模型\n\n语言模型是一个根据之前的词预测句子中下一个词的系统。它是使用序列到序列（sequence-to-sequence）模型实现的。在过去的几年里，这个领域取得了巨大的发展。在过去的语言模型中，模型是通过\
  \ `Recurrent Neural Networks`（`RNN`）实现的。普通的 `DNN` 或 `CNN` 无法使用，因为它们不依赖时间。然而，普通的\
  \ `RNN` 也有缺点，如梯度消失和梯度爆炸。`RNN` 的改进版本是 `LSTM` 和 `GRU`。`LSTMs` 在语言模型中非常流行。然而，嵌入领域的最新进展是基于\
