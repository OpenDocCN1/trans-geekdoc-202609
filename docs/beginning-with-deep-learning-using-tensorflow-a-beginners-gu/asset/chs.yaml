  \n我们尝试位置 40 处的审查。预测结果为 1。让我们检查对应的标签：\n\n![](img/Figure-7.40.jpg)\n\n**图 7.40:**\
  \ 检查标签\n\n标签也是 1，这表示预测是正确的。你可以多尝试几个样本。\n\n在此演示中使用的 RNN 被称为原生 RNN（vanilla RNNs）。RNN\
  \ 存在一些问题，如梯度消失和梯度爆炸，这限制了它们的使用。这些原生 RNN 有一些变体，如 `LSTM`（长短期记忆网络）和 `GRU`（门控循环单元），它们有助于克服其中的一些问题。\n\
  \n尽管有这些变体，RNN 非常难训练。它们非常耗时。而这正是 `BERT` 这样基于 Transformer 的预训练模型极其有用的地方。\n\n## Transformers\n\
  \nTransformer 首次在 2017 年通过题名为《注意力就是一切》（Attention is all you need）的论文被引入，从那以后，Transformer\
  \ 变得风靡，并加速了自然语言处理（NLP）和语音识别领域的进展。我们已经看到，对于 NLP，顺序很重要，因此使用了 RNN 及其变体（如 `LSTM` 和 `GRU`）。然而，由于处理是顺序进行的，它们速度非常慢。\n\
  \n在 Transformer 中，处理是并行进行的。让我们来看一下 Transformer 的架构：\n\n![](img/Figure-7.41.jpg)\n\
  \n**图 7.41:** Transformer 架构\n\n它包含两个部分：编码器（encoder）和解码器（decoder）。编码器又包含以下内容：\n\n\
  *   输入嵌入（Input embedding）\n*   位置编码（Positional encoding）\n*   编码层（Encoding layers）\n\
  \nTransformer 的原始设计有六个编码层。\n\n解码器又包含以下内容：\n\n*   输出嵌入（Output embedding）\n*   位置编码（Positional\
  \ encoding）\n*   解码层（Decoding layers）\n\n原始设计有六个解码层：\n\n![](img/Figure-7.42.jpg)\n\
  \n**图 7.42:** 编码器-解码器\n\n每个编码层又由两个部分组成：\n\n*   自注意力机制（Self-attention）\n*   前馈神经网络（Feedforward\
  \ neural network）\n\n![](img/Figure-7.43.jpg)\n\n**图 7.43:** 编码器\n\n每个解码器又由三个部分组成：\n\
  \n*   自注意力机制（Self-attention）\n*   编码器-解码器注意力（Encoder decoder attention）\n*   前馈神经网络（Feed\
  \ forward neural network）\n\n![](img/Figure-7.44.jpg)\n\n**图 7.44:** 解码器\n\n与 RNN\
  \ 或其变体（如 `LSTM` 和 `GRU`）相比，将 Transformer 用于 NLP 任务的主要优势在于训练时的并行化。\n\n现在你对 Transformer\
  \ 有了基本的了解，让我们来看看它们如何用于 NLP 任务。在在上一个代码演示中，我们看到了如何使用 RNN 进行文本分类。让我们用 `BERT` 做类似的练习，`BERT`\
  \ 是一种基于 Transformer 的语言模型。\n\n## 预训练 Transformer 模型\n\n有多个免费提供的预训练模型可以执行各种 NLP 任务。Hugging\
  \ face 提供了此类模型，我们将使用它们并演示使用它们执行各种 NLP 任务有多简单。你可以通过访问他们的网站获取更多详情：\n\n**[`huggingface.co/`](https://huggingface.co/)**\n\
  \n然而，这需要 `pytorch` 环境，由于我们正在使用 TensorFlow 本地环境，我们将使用 Google Colab 进行这些演示。如果你有兴趣设置本地的\
  \ PyTorch 环境，可以查看此链接：\n\n**[`huggingface.co/course/chapter0`](https://huggingface.co/course/chapter0)**\n\
  \n我们只需要写几行代码就可以使用这些预训练模型，如下所示。在 `Transformer.ipynb` Jupyter 笔记本中，我们首先安装 `transformers`：\n\
  \n![](img/Figure-7.45.jpg)\n\n**图 7.45:** Transformer 安装\n\n接下来导入：\n\n![](img/Figure-7.46.jpg)\n\
  \n**图 7.46:** 导入\n\npipeline 是一个强大的概念，它极大地简化了工作。如工作流程所示，在数据输入模型之前，需要进行分词（tokenization）和嵌入（embedding）等若干处理步骤。使用\
  \ pipeline 来处理这些：\n\n![](img/Figure-7.47.jpg)\n\n**图 7.47:** 使用 pipeline\n\n使用分类器来执行各种\
  \ NLP 任务。在 `Classification.ipynb` 笔记本中，我们可以看到如下代码：\n\n![](img/Figure-7.48.jpg)\n\
  \n**图 7.48:** 分类器\n\n执行此代码下载 `distilbert-base-uncased-finetuned-sst-2` 模型，它返回 `POSITIVE`\
  \ 或 `NEGATIVE` 标签，以及相应的分数。\n\n![](img/Figure-7.49.jpg)\n\n**图 7.49:**  句子\n\n标签为\
  \ 1 表示正面：\n\n![](img/Figure-7.50.jpg)\n\n**图 7.50:** 分类句子\n\n现在我们可以通过循环处理结果：\n\n\
  ![](img/Figure-7.51.jpg)\n\n**图 7.51:** 整体情感\n\n\n\n接下来，我们下载并加载 BERT 模型。\n\n在将数据输入模型之前，需要对文本进行处理。我们在\
  \ RNN 的案例中也见过这种情况。上述 BERT 预训练模型可以用于此。它们共同完成了预处理和嵌入：\n\n![](img/Figure-7.59.jpg)\n\
  \n**图 7.59：** 下载并加载 BERT 模型\n\n模型包含两个部分。第一部分由 BERT 层组成，其余的是普通的神经网络层。该部分的输出是与文本对应的词嵌入：\n\
  \n![](img/Figure-7.60.jpg)\n\n**图 7.60：** 构建模型\n\n此输出被输入到一个带有 `Sigmoid` 激活函数的单元神经中，以执行二分类。为了克服过拟合，添加了一个丢弃层（dropout）：\n\
  \n![](img/Figure-7.61.jpg)\n\n**图 7.61：** 模型摘要\n\n从模型摘要中可以看出，参数超过了 1 亿个：\n\n![](img/Figure-7.62.jpg)\n\
  \n**图 7.62：** 模式编译 (mode compile)\n\n在 `compile` 中，提供了优化器和损失函数 `adam` 和 `binary_crossentropy`。通过此，模型已准备好训练：\n\
  \n![](img/Figure-7.63.jpg)\n\n**图 7.63：** 训练\n\n我们对模型进行了 5 个 epoch 的训练。在普通机器上训练确实需要一些时间，5\
  \ 个 epoch 结束后，模型达到了 93% 的准确率：\n\n![](img/Figure-7.64.jpg)\n\n**图 7.64：** 训练 5 个\
  \ epoch\n\n然后用测试数据对模型进行评估：\n\n![](img/Figure-7.65.jpg)\n\n**图 7.65：** 测试数据\n\n最后一步是使用\
  \ `predict` 方法使用完全新的数据对模型进行推理。\n\n## 机器语言翻译\n\n语言翻译是另一个重要的 NLP 任务，再次，Transformers\
  \ 让翻译变得简单许多。有多个可用的预训练模型可以用于翻译。事实上，Transformers 最初是设计为机器翻译设计的。\n\n让我们再次使用 hugging\
  \ face 的 pipeline 进行翻译，看看它是如何工作的。第一步，安装 `transformers`：\n\n![](img/Figure-7.66.jpg)\n\
  \n**图 7.66：** transformer 安装\n\n对于此演示，我们还需要一个 sentence piece。接下来，导入 `pipeline`：\n\
  \n![](img/Figure-7.67.jpg)\n\n**图 7.67：** 导入 pipeline\n\n我们可以使用 `pipeline` 的实例进行翻译。我们无需指定任何模型，只需提及源语言和目标语言即可。它会自动确定模块并下载和加载它。\n\
  \n例如，我们可以提到翻译是从英语到德语：\n\n![](img/Figure-7.68.jpg)\n\n**图 7.68：** 模型已加载\n\n如所示，它自动选择了\
  \ `t5-base` 预训练模型。这是 Google 的多语言预训练 transformer 模型：\n\n![](img/Figure-7.69.jpg)\n\
  \n**图 7.69：** 从英语到德语的翻译\n\n为了交叉验证这是否正确，我们可以使用 Google translate：\n\n![](img/Figure-7.70.jpg)\n\
  \n**图 7.70：** 在 Google translate 中验证\n\n或者，我们可以创建一个从德语到英语的 pipeline 并测试它：\n\n![](img/Figure-7.71.jpg)\n\
  \n**图 7.71：** 德语到英语的 pipeline\n\n我们也可以尝试英语到印地语：\n\n![](img/Figure-7.72.jpg)\n\n\
  **图 7.72：** 翻译英语到印地语的 pipeline\n\n以及印地语到英语：\n\n![](img/Figure-7.73.jpg)\n\n**图 7.73：**\
  \ 翻译印地语到英语的 pipeline\n\n## Q&A—SQUAD\n\nQ&A 是另一个常见的 NLP 任务，在这个代码演示中，我们将看到使用训练过的\
  \ BERT 模型构建一个问答系统有多简单。`SQUAD` 名称源于训练该模型的斯坦福问答数据集（Stanford Question and Answering）。我们将使用一些额外的文本对其进行微调，模型将能够回答与此新文本相关的问题。这需要\
  \ PyTorch，为了避免安装 PyTorch 的复杂性；我们将在 Google Colab 上运行此代码。\n\n文件名为 `Bert-squad-demo.ipynb`。上传笔记本后，确保也上传了用于演示的文本文件。首先，提供了一个名为\
  \ `mohan.txt` 的文本文件，但你可以创建自己的文本文件。在执行代码所示的 [图 7.73] 之前，将此文本文件上传到 Google Colab：\n\
