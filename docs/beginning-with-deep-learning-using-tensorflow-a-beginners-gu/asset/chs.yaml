  \n\n## 人工智能引言\n\n在本章中，我们将介绍人工智能、深度学习和 TensorFlow。虽然预计购买这本书的人已经具备了这些知识和经验，但这仍然是为后续章节平稳过渡奠基础的好方法。这有助于确保读者和作者处于同一频道上，特别是在术语、编码方法等等方面。\n\
  \n## 结构\n\n本章将涵盖以下主题：\n\n\n## 目标\n\n在本章结束时，您将能够学习人工智能及其在各行业的应用。您将理解 AI 的演变，以及`人工智能`\
  \ (`AI`)、`机器学习` (`ML`) 和`深度学习` (`DL`) 之间的关系。\n\n## 人工智能简史\n\n今天，我们处于巨大技术革命的边缘。在讨论\
  \ AI 之前，让我们来看看许多新兴技术（图 1.1`）。这些技术的融合结合 AI 将在未来几十年内彻底改变世界。\n\n![](img/Figure-1.1.jpg)\n\
  \n**图 1.1：** 新兴技术\n\n根据领先分析师的说法，以下技术将在未来 5-10 年内成熟：\n\n*   3D 打印\n\n这些技术结合 AI，将对人类产生巨大影响。根据维基百科的定义：“在计算机科学中，AI\
  \ 有称为机器智能，是指机器表现出与人类等同或无法区分的行为测试。”以下是一些例子：\n\n*   智能音箱 (Alexa)\n*   自动驾驶汽车\n*  \
  \ 自动车辆\n\n![](img/Figure-1.2.jpg)\n\n**图 1.2：** AI（来源：Google）\n\n回到达特茅会议，会议后引起了巨大的兴奋，美国政府甚至拨付了资金进行\
  \ AI 研究，但它并没有取得突破。在经历了几年的研究后，该项目被搁置——这被称为 AI 寒冬。\n\n原因之一是计算能力的缺乏。随后，对 AI 的兴趣在 90\
  \ 年代重新复兴。随着云计算和廉价硬件的出现，计算能力的可用性大大增加。此外，大量数据以及通过 Hadoop 等技术处理海量数据的能力进一步推动了 AI 研究。这就像是拼图的碎片各就位一样。\n\
  \nAI 复兴的一个广为人知的事件是 IBM Watson。2011 年，IBM Watson 与游戏节目《危险一答》(Jeopardy!) 的现任人类冠军对决并获胜了。然而，当时\
  \ AI 这个术语还没有像现在这样流行，因此 Watson 仅被称为一台超级计算机。但所使用的自然语言处理技术是人工智能的一个重要组成部分。而今天，Watson\
  \ 自然被称为 AI。\n\n必须指出，这并不是第一次出现机器击败人类的事件。早在 1997 年，一台名为“深蓝”的超级计算机击败了现任象棋世界冠军加里·卡斯帕罗夫（Gary\
  \ Kasparov）。深蓝也是由 IBM 开发的。\n\n\n\n\n\n![](img/Figure-1.3.jpg)\n\n**图 1.3：** IBM\
  \ 深蓝（**来源：** [www.stream-live-tvchannel.top/ProductDetail.aspx?iid=88929267&pr=40.88](http://www.stream-live-tvchannel.top/ProductDetail.aspx?iid=88929267&pr=40.88))\n\
  \n然而，不同之处，深蓝实际上只是一台每秒能评估 2 亿个位置的超级计算机。因此，它是暴力破解，而不是任何形式的学习。所以，它不是人工智能。\n\n随后在 2016\
  \ 年 3 月，由初创公司 Deep Mind 开发的 AI —— AlphaGo 以 4 比 1 的比击败了现任围棋冠军 `李世石`。这是 AI 领域一个真正的分水岭，即使是\
  \ AI 专家也感到震惊。并不是因为他们不相信 AI 能实现这一成就，而是因为它完成得太快了。\n\nDeep Mind 成立于 2013 年，其理念是开发一种能下围棋的\
  \ AI，专家们认为实现这一成就至少需要十年，甚至更久。当 AI 在不到四年的时间内实现了这一目标时，他们震惊了。随后，Google 自然地收购了 Deep Mind：\n\
  \n![](img/Figure-1.4.jpg)\n\n**图 1.4：** DeepMind 的 AlphaGo（**来源：** [`247newsupdate.com/2016/03/12/computer-program-beats-human-master-in-go-game/`](https://247newsupdate.com/2016/03/12/computer-program-beats-human-master-in-go-game/))\n\
  \n这是在多个层面的重大成就。首先，围棋与象棋不同，它是一个直觉的游戏，而非规则的游戏。正如 `图 1.5` 所示，它有如此多的合法位置：\n\n![](img/Figure-1.5.jpg)\n\
  \n**图 1.5：** 围棋中的合法位置数量\n\n为了方便理解背景，这超过了整个宇宙中的原子数量——是的，是整个宇宙，而不只是地球。\n\n所以，没有任何人能为此编写一个程序。那么，Deep\
  \ Mind 是如何做到的？他们使用了一种名为 `强化学习` 的技术，这是深度学习的一种。在这种技术中，系统通过反复玩游戏来学习，可能玩了数百万次，每次都从自己的错误中学习并改进自己。\n\
  \n这可能是机器在某种意义上第一次表现出直觉迹象！\n\nAI 世界的另一个重大事件发生在 2017 年 11 月 4 日。沙特阿拉伯授予了一个名为 `Sophia`\
  \ 的类人形机器人公民身份，该机器人是由 `Hansen Robotics` 开发的。专家们对 `Sophia` 的能力意见不一——有人甚至认为它是假的；这恰恰说明了人们对\
  \ AI 领域的关注程度。\n\n![](img/Figure-1.6.jpg)\n\n**图 1.6：** Sophia ([`simple.wikipedia.org/wiki/Sophia\\\
  _(robot)`](https://simple.wikipedia.org/wiki/Sophia_\\(robot\\)))\n\n# AI 的分类\n\n\
  AI 分为三类，如 `图 1.7` 所示。\n\n![](img/Figure-1.7.jpg)\n\n**图 1.7：** AI 的类型\n\n**弱人工智能**（**ANI**），也被称为专家系统，是一个可以执行单项任务但表现远好于人类的系统。如今的\
  \ AI，如 AlphaGo 和自动驾驶汽车就属于这一类。\n\n另一方面**超级人工智能**（**ASI**）也被称为奇点，是一个能够超越人类水平的系统。\n\
  \n**通用人工智能**（**AGI**）是一个能够完成任何人类可以完成的任务的系统。我们目前还处于这一阶段的早期。\n\n以下图展示了 AI 的形式：\n\n\
  ![](img/Figure-1.8.jpg)\n\n**图 1.8：** 奇点\n\n这在 AI 领域是一个巨大的里程碑。神经网络是 AI 的核心，我们将在后文中详细讨论。\n\
  \n以下图展示了 AI、ML 和 DL 的关系：\n\n![](img/Figure-1.9.jpg)\n\n**图 1.9：** AI、ML 和 DL\n\n\
  深度学习是机器学习的一个子集。我们将在下一章讨论机器学习。\n\n# 我们是如何到达这里的？\n\n今天，AI 是数据科学这一领域的一部分。\n\n![](img/Figure-1.10.jpg)\n\
  \n**图 1.10：** 数据科学\n\n一切始于 90 年代开始的信息技术革命，当时我们开始创建和存储数据。最初，软件用于办公自动化——如文字处理、电子表格等，数据以文件形式存储。随后进入了企业自动化时代，出现了用于捕捉订单、管理生产和销售的应用。这是产生大量数据的开始。期间，RDBMS\
  \ 的概念诞生了。这些系统被称为**在线事务处理**（**OLTP**）。它们非常擅长捕捉数据。然而，当数据增长时，系统性能会变差，大多数 OLTP 系统都是如此。为了维持这些系统的高性能，旧数据从实时数据库中备份并存储在带子上以后检索。这使得对所有数据进行分析变得困难。这产生了数据仓库，被称为**在线分析处理系统**（**OLAP**）。\n\
  \n这些系统能够存储来自不同系统的大量数据，并且查询速度快得多。数据定期从 OLTP 系统传输到 OLAP 系统——通常在每天结束时。这让 OLTP 系统保持轻量化，同时允许你在\
  \ OLAP 系统上对历史数据进行分析。这就是*业务分析*的开始。\n\n\n\n\n\nHadoop 开发于 21 世纪初，经过多年的发展，已趋于成熟，使我们能够轻松处理\
  \ TB 级的大量数据，包括非结构化数据。与此同时，数据开始以指数级增长。海量数据的可用性促进了机器学习、深度学习和人工智能的复兴。\n\n这就像是 AI 拼图的所有碎片都到位了。廉价硬件可用——包括\
  \ GPU、云端按需的海量计算能力以及大量数据。\n\n![](img/Figure-1.14.jpg)\n\n**图 1.14:** 硬件（**来源:** [www.fastcompany.com/3065843/artificial-intelligence-chips-race-nvidia-intel](http://www.fastcompany.com/3065843/artificial-intelligence-chips-race-nvidia-intel)）\n\
  \n这导致了过去几年人工智能的复兴和快速增长。\n\n# 各对 AI 的采用\n\n现在我们来看看哪些行业正在快速采用 AI：\n\n*   **医疗保健**：医疗保健是采用\
  \ AI 最显著的行业之一。在医疗保健领域，AI 被用于三个主要领域：\n\n    *   **诊断**：医疗诊断涉及分析 X 射线、MRI、CT 扫描等图像，并识别（例如癌症的存在）。例如，`IBM\
  \ Watson` 已被训练用于检测和预测肺癌。在这些场景中，深度学习模型被训练用于将图像分类为癌性和非癌性。一旦训练完成，这些模型就可以预测新图像中是否存在癌症。该领域仍有许多研究正在进行，以提高预测的准确性。医生正在将这些作为生产力工具，来优先排序并加速诊断过程。截至目前，这些还没有取代医生。\n\
  \n        ![](img/Figure-1.15.jpg)\n\n        **图 1.15:** 用于医疗的 AI（**来源:** Google）\n\
  \n        失明是世界上面临的另一个大问题。根据`世界卫生组织`（`WHO`）的数据——13 亿的人有某种形式的视力障碍，其中 360 万人失明。虽然某些形式的失明是先天的且无法预防，但许多形式的失明如果及时发现是可以避免的。例如：糖尿病视网膜病。这就是微软和\
  \ Google 等公司正在大量研究的地方。\n\n        ![](img/Figure-1.16.jpg)\n\n        **图 1.16:**\
  \ 糖尿病视网膜病（**来源:** [www.clinicaladvisor.com/home/topics/diabetes-information-center/fda-approves-ai-device-to-detect-diabetic-retinopathy/](http://www.clinicaladvisor.com/home/topics/diabetes-information-center/fda-approves-ai-device-to-detect-diabetic-retinopathy/)））\n\
  \n    *   **治疗**：将 AI 用于医疗治疗并不广为人知。癌症治疗是一个漫长而痛苦的过程。治疗方案需要经过计划，并且取决于患者的健康史和患者直属家人等因素。在大多数人口没有医疗保险覆盖的国家，成本也是一个因素。这就是\
  \ AI 可以用于推荐的地方。例如，印度班加罗尔的曼尼帕医院（Manipal Hospital）采用了 `IBM Watson` 进行癌症治疗。\n\n   \
  \     ![](img/Figure-1.17.jpg)\n\n        **图 1.17:** IBM Watson（**来源:** [www.giannibarbacetto.it/wp-content/uploads/2017/03/ibmwatson\\\
  _logo-1](http://www.giannibarbacetto.it/wp-content/uploads/2017/03/ibmwatson_logo-1)）\n\
  \n*   **机器人手术**：机器人手术或 AI 辅助机器人手术涉及使用机械臂进行手术。机器人手术有几个优点。它们是微创的，因此患者康复更快，住院时间最短。出血量较少，感染风险最低。\n\
  \n        机械臂可以进行远程操作，这意味着外科医生不需要亲临现场，就可以远程进行手术，反过来意味着专家医生可以坐在一个地方在多个地点进行手术。\n\n\
  \        ![](img/Figure-1.18.jpg)\n\n        **图 1.18:** 机器人手术（**来源:** [`www.clinicaladvisor.com/home/topics/diabetes-information-center/fda-approves-ai-device-to-detect-diabetic-retinopathy/`](http://www.clinicaladvisor.com/home/topics/diabetes-information-center/fda-approves-ai-device-to-detect-diabetic-retinopathy/)）\n\
  \n*   **汽车**：自动驾驶车辆或无驾驶汽车已由 `Google` 和 `Tesla` 等几家公司成功测试了数百万英里。它们尚未投入商业部署，但在实验的基础上提供。让我们来看看自动驾驶车辆的功能。\n\
  \n        ![](img/Figure-1.19.jpg)\n\n        **图 1.19:** Wymo 自动驾驶汽车（**来源:** [`globalstopics.blogspot.com/2017/10/self-driving-cars`](http://globalstopics.blogspot.com/2017/10/self-driving-cars)）\n\
  \n        自动驾驶车辆配备了一整套设备。顶部安装了 `Lidar`（激光雷达），它可以提供车辆周围障碍物的 360 度视角。`Lidar` 的功能与\
  \ `Radar`（雷达）类似，但它使用激光而不是无线波。\n\n        ![](img/Figure-1.20.jpg)\n\n        **图\
  \ 1.20:** 激光雷达（**来源:** [www.powerelectronics.com/digital-power-combined-with-gan-heads-towards-99-efficiency/](http://www.powerelectronics.com/digital-power-combined-with-gan-heads-towards-99-efficiency/)）\n\
  \n        此外，前后的后方还有其他 `radars` 来检测即时障碍。多个摄像头提供视频流，由车载 AI 系统实时分析。它拥有 `GPS` 系统来提供位置信息，并有地图来确定路线。经过训练的车载\
  \ `Neural Network` 模型处理来自各种传感器的输入，并做出诸如刹车、加速或左转等决策。\n\n        例如，通过前方摄像头的视频流，车载\
  \ AI 能够检测交通灯的红绿，并决定停止还是前进。或者如果它检测到路径上有障碍，它会刹车等等。\n\n*   **零售**：零售业是 AI 和 `ML` 的早期采用者。零售行业是最早在其电子商务网站和\
  \ App 上采用推荐引擎的行业。如今流程中的多个领域都采用了 AI——从仓库到使用无人机送货。\n\n        机器人进行仓库管理。\n\n     \
  \   ![](img/Figure-1.21.jpg)\n\n        **图 1.21:** 仓库机器人（**来源:** [www.istockphoto.com/photos/warehouse-robot](http://www.istockphoto.com/photos/warehouse-robot)）\n\
  \n        零售机构需要维护大型仓库以实现快速高效的履约。管理这些仓库是一项极其复杂的任务。过去，有由 `SAP` 等公司开发的仓库管理软件，但实施此类软件也极其困难。\n\
  \n        如今，AI 以机器人的形式应用于这些仓库，特别是在订单履行方面。这大大缩短了包装时间。以前仓库员工必须手动在货架之间移动，以组合订单物品并进行包装。现在有了这些机器人，员工只需留在原地，召唤包含订单物品的货架。机器人搬运货架。它们是自主的，在仓库中移动时不会与其他机器人或路径上的其他障碍物碰撞。\n\
  \n\n\n\n\n除了仓库之外，零售行业也在实体店模式中采用 AI。亚马逊引入了名为 `AmazonGo` 的无人实体零售店。客户只需进入店内，挑选他们需要的物品然后离开即可。这些物品将被自动检测，客户将在在线上被相应的费用。他们使用计算机视觉、传感器技术和深度学习来实现这一目标。\n\
  \n零售行业还在采用无人机配送来缩短配送时间。如今，在线订购产品（外卖配送除外）的平均配送时间为 24 小时，因为配送主要由快递公司完成。这正是亚马逊等这样的公司正在探索使用无人机进行配送的地方。这可能会将配送时间缩短到几小时，甚至是几分钟。\n\
  \n*   **制造业**：制造业是流水线机器人的早期采用者之一。然而，这些都是没有 AI 的机电可编程机器人。如今，支持 AI 的机器人已用于车间。这些机器人可以自主地观察和移动。此外，它们还可以团队协作工作。这极大地提高了效率。\n\
  \n## 结论\n\n还有许多其他行业，如金融服务、房地产和能源，AI 正在被快速采用。在十年内，许多此类应用将变得常态化并商品化。\n\n这带我们来到了本介绍性章节的结束。在下一章中，我们将进入人工智能的技术层面，从机器学习开始。\n\
  \n## 记忆要点\n\n*   AI 是领先的新兴技术之一。\n*   AI 以及如 `5G`、`IoT` 和 `BlockChain` 等其他新兴技术，将在未来\
  \ 5–10 年内改变我们的生活。\n*   AI 已经到来，我们看到每个行业都在快速采纳 AI。\n\n# 第 2 章：机器学习\n\n## 引言\n\n机器学习是一个广泛的话题，详细介绍超出了本书的范围。然而，理解机器学习的基本原理对于深度学习至关重要，因此这正是本章涵盖的内容。如果你想深入研究机器学习，获取市面上几本机器学习书籍之一可能是一个好主意。\n\
