  **图 4.49:** 分类器\n\n`argmax` 的输出是最大值的索引，对应相应的类别。\n\n## MNIST 数据集\n\nMNIST 数据集（美国国家标准技术研究院）是一个包含\
  \ 70,000 个手写数字图像的型型数据库。它被广泛用于训练计算机视觉和机器学习算法的基准。\n\n## 数据集概述\n\nMNIST 数据集由 60,000\
  \ 张训练图像和 10,000 张测试图像组成。每个图像都是 28x28 像素的灰度图像。像素值被归一化到 0 到 1 之间，0 表示白色，1 表示黑色。\n\n\
  ## 数据预处理\n\n在训练神经网络之前，必须对数据进行预处理。\n\n1. **归一化**：原始 0-255 的像素值通过除以 255 放到 0-1。\n\
  2. **独热编码**：对于分类任务，标签通常转换为独热编码向量。这把每个数字表示为长度为 10 的向量，数字索引处的元素为 1，所有其他元素为 0。\n\n\
  ## 使用 TensorFlow 实现\n\n下面的部分演示了如何使用 TensorFlow 构建并训练简单的神经网络。\n\n### 导入库和加载数据\n\n\
  首先，我们导入必要的库并加载数据集。\n\n```python\nimport tensorflow as tf\nimport numpy as np\n\n\
  ## 加载 MNIST 数据集\n(x_train, y_train), (x_test, y_test) = tf.keras.datasets.mnist.load_data()\n\
  \n## 归一化像素值\nx_train, x_test = x_train / 255.0, x_test / 255.0\n\n## 将标签转换为独热编码\n\
  y_train = tf.keras.utils.to_categorical(y_train, 10)\ny_test = tf.keras.utils.to_categorical(y_test,\
  \ 10)\n```\n\n### 构建模型\n\n我们定义了一个包含输入层、隐藏层和输出层的简单模型。\n\n```python\n### 定义模型\nmodel\
  \ = tf.keras.Sequential([\n    tf.keras.layers.Flatten(input_shape=(28, 28)), #\
  \ 输入层\n    tf.keras.layers.Dense(128, activation='relu'), # 隐藏层\n    tf.keras.layers.Dropout(0.2),\
  \                  # 防止过拟合的 Dropout\n    tf.keras.layers.Dense(10, activation='softmax')\
  \ # 输出层\n])\n```\n\n### 编译和训练\n\n我们使用优化器和损失函数编译模型，然后使用训练数据进行训练。\n\n```python\n##\
  \ 编译模型\nmodel.compile(optimizer='adam',\n              loss='categorical_crossentropy',\n\
  \              metrics=['accuracy'])\n\n## 训练模型\nmodel.fit(x_train, y_train, epochs=5)\n\
  ```\n\n## 评估模型\n\n最后，我们在测试集上评估模型的性能。\n\n```python\n## 评估模型\nloss, accuracy = model.evaluate(x_test,\
  \ y_test, verbose=2)\nprint(f\"Test accuracy: {accuracy:.4f}\")\n```\n\n\n\n\n让我们来分析数据以获得以下输出：\n\
  \n![](img/Figure-4.54.jpg)\n\n**图 4.54：** 训练、测试和验证集的图像数量。\n\n当 MNIST 团队启动这个项目时，还没有像\
  \ `CNN` 这样可以处理二维图像的复杂神经网络。因此，28×28 的像素值矩阵被 `flattened`（展平）为一个包含 784 个（`28*28=784`）像素值的一维数组：\n\
  \n![](img/Figure-4.55.jpg)\n\n**图 4.55：** 归一化像素值范围从 0 到 1\n\n像素值经过了归一化，因此它们的范围从最大值\
