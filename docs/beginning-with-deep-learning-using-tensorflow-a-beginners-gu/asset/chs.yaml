  \ 1.10.0，但在你的情况下，它将显示你安装的版本。\n\n好了！现在你可以编写代码了。\n\n## TensorFlow TensorFlow\n\nTensorFlow\
  \ 并不是一种编程语言。它是一个深度学习库。在编写本书时，如图 3.11 所示，是最流行的深度学习库。它最初由 Google 内部一个名为 Google Brain\
  \ 的团队为内部使用开发，随后被开源。Google Brain 团队负责开发一些酷炫的 Google 应用，如 Google Photos 和 Google Cloud\
  \ Speech。TensorFlow 1.0 于 2017 年发布，在短时间内它成为了最流行的深度学习库，领先于 Caffe、Theano 和 PyTorch\
  \ 等其他现有库。它被认为是行业标准，几乎每个在 AI 和深度学习领域开展组织都采用了它。以下是 TensorFlow 的一些关键特性包括：\n\n\n\n\n\
  \n*   它可以与所有常见的编程语言配合使用，如 Python、Java 和 R。\n*   它可以部署在多个平台上，包括 Android 和树莓派。\n*\
  \   它可以在高度分布模式下运行，因此具有高度的可扩展性。\n\n![](img/Figure-3.11.jpg)\n\n**图 3.11:** 顶级深度学习库（**来源:**\
  \ [`www.kdnuggets.com/2018/04/top-16-open-source-deep-learning-libraries.html`](https://www.kdnuggets.com/2018/04/top-16-open-source-deep-learning-libraries.html)）\n\
  \n然而，`TensorFlow` 也面临一些挑战。它并不容易，因为它的执行模型（`TF 1.x`）使用了惰性执行模式、图（graphs）和会（sessions）。你可以使用任何常见的编程语言（如\
  \ Java、Python 或 R）编写程序，尽管 Python 和 `TensorFlow` 的组合被认为是最强大且最受欢迎的。即使你非常擅长 Python\
  \ 编程，编写 `TensorFlow` 代码可能完全是另一回事。在本章中，我们将逐步向你介绍这种新的编程范式，并帮助你获得编写 `TensorFlow` 程序的专业知识。在编写本书时，`TensorFlow\
  \ 2` 刚刚发布，但我们将从 `TF1.x` 开始，这是一个稳定、成熟并在工业界广泛使用的版本，然后转向 `TF2.0`。\n\n需要注意的是，刚开始一切都会很模糊且有些难以理解，这是非常自然的，而且每个人都会遇到这种情况。不要气馁。许多章节是相互依赖的。因此，即使你已经完全理解了，过一遍所有章节也是一个好主意，然后再读一遍。最后，概念与代码示例的结合将帮助你掌握\
  \ `TensorFlow` 编程。\n\n让我们让我们开始吧。\n\n`TensorFlow` 包含以下两个主要组件：\n*   张量（Tensors）\n\
  *   计算图（Flow）\n\n这就是它得名为 `TensorFlow` 的原因。\n\n张量是在运行时存储数据的多维数组：\n\n![](img/Figure-3.12.jpg)\n\
  \n**图 3.12:** 张量（**来源:** [www.shutterstock.com](http://www.shutterstock.com)）\n\n\
  在 `TensorFlow` 程序内部，每个数据元素都被称为 `Tensor`。张量具有秩（rank）和形状（shape）。张量的秩是一个数字，表示张量具有多少个维度。例如，4\
  \ 维张量的秩为 4。\n\n张量的形状由数组表示，它指示每个维度上的元素数量。例如，如果一个张量的形状为 `[2,3,5]`，则意味着张量有 3 个维度，第一维的元素数量为\
  \ 2 个，第二个维度为 3 个，第三个维度为 5 个。我们也可以从形状中获得秩。在这个例子中，张量的秩是 3，因为有 3 个维度。接下来的图进一步说明了这一点：\n\
  \n![](img/Figure-3.13.jpg)\n\n**图 3.13:** 张量秩和形状的示例\n\n## TensorFlow 程序的元素\n\n我们将从\
  \ `TensorFlow 1.x` 开始。编写 TensorFlow 程序的一种特定方法可能并不直观。你首先构建一个计算图并在会（session）中执行该图。由于\
  \ `TensorFlow` 是一个库，我们需要在添加任何 TensorFlow 代码之前将其导入 Python 代码中。通过以下代码行实现：\n\n```python\n\
  import tensorFlow as tf\n```\n\n从那时起，所有的库元素都通过 `TensorFlow` 实例 `tf` 访问。\n\n`TensorFlow`\
  \ 程序的主要元素如下：\n\n常量、变量和占位符可以被视为不同类型的张量，用于在程序运行时存储数据。这些元素中的每一个创建都会向计算图中添加一个节点。有一个默认的计算图，即在后台创建的，不需要作为代码的一部分显式创建。\n\
  \n## 常量 (Constant)\n\n常量用于存储在程序过程中不会更改或修改的值。创建常量有多种方法，但简单的方法是：\n\n```python\na =\
  \ tf.constant(10)\n```\n\n## 变量 (Variable)\n\n变量用于存储在程序过程中可以修改的值。创建变量有多种方法，但简单的方法是：\n\
  \n```python\nb = tf.Variable(20)\n```\n\n## 占位符 (Placeholder)\n\n占位符是一种特殊的存储类型，它在创建时不能初始化，只能在运行时填充。在创建占位符时，只需指定数据类型：\n\
  \n```python\np = tf.placeholder(float32)\n```\n\n## 会 (Session)\n\n每当你创建一个常量、`Variable`\
  \ 或占位符时，图中就会添加一个节点。程序不会执行。为了实际执行程序，你需要创建一个会并在其中执行图。会的创建方式如下：\n\n```python\nsess\
  \ = tf.Session()\n```\n\n可以使用会的 `run` 函数执行图的特定节点，并将该节点作为参数传递。例如：\n\n```python\n\
  myconst = sess.run(a)\n```\n\n由于 `a` 被初始化为 10，因此 `myconst` 将具有值 10。\n\n```python\n\
  myvar = sess.run(b)\n```\n\n现在 `myvar` 将具有值 20，因为我们将 `b` 初始化为 20 了。\n\n## 常量、变量和占位符\n\
  \n在这一节中，我们将看到如何在 `TensorFlow` 中操作常量、变量和占位符。我们将使用一个代码演示来展示这三种存储类型之间的区别。\n\n这些代码演示的笔记本可以在\
  \ GitHub 上找到，链接：\n\n让我们先创建一个常量和一个变量：\n\n![](img/Figure-3.15.jpg)\n\n**图 3.15:**\
  \ 代码演示\n\n\n\n\n常量 `const` 被初始化为 10。当你尝试显示该值时，它只会显示数据类型为 `int32`，而不是实际值。这就是延迟执行（lazy\
  \ execution）的概念。当你在 Jupyter notebook 中运行这行代码时，它并没有实际执行代码，而是进行语法检查。实际执行发生在会话（session）中；我们稍后就会。\n\
  \n变量也是如此。变量 `var1` 初始化为 100，但当我们尝试显示该值时，它只显示数据类型为 `int32`，而不是值 100。\n\n为了显示这些值，我们在会话中执行了这些节点，我们稍后就会。\n\
  \n到目前为止，我们做的是构建计算图。让我们通过添加更多计算来继续构建它：\n\n![](img/Figure-3.16.jpg)\n\n**图 3.16:**\
  \ 构建计算图\n\n在单元 6 中，我们创建了一个名为 `sum` 的节点，它使用 TensorFlow 提供的 `add` 方法对 `const` 和 `var1`\
  \ 求和。在单元 7 中，我们创建了另一个节点，将 `sum` 中的值赋值给 `var1`。\n\n在单元 8 中，当我们尝试将 `sum` 赋值给 `const`\
  \ 时，它会报错。为什么？因为你不能修改常量（请参考 *图 3.17*）：\n\n![](img/Figure-3.17.jpg)\n\n**图 3.17:**\
  \ 常量的错误\n\n现在计算图已经准备就绪，让我们在会话中执行这些节点。在在此之前，我们必须再创建一个节点，用于初始化变量：\n\n![](img/Figure-3.18.jpg)\n\
  \n**图 3.18:** 变量初始化\n\n每当我们在代码中使用变量时，我们必须创建此节点/操作，并在执行任何其他节点之前在会话中执行它。这在我们在使用变量时才需要。如果我们只使用常量或占位符（placeholder），则不需要进行此初始化。\n\
  \n现在，让我们创建会话：\n\n![](img/Figure-3.19.jpg)\n\n**图 3.19:** 创建会话\n\n第一步，我们运行初始化操作：\n\
  \n![](img/Figure-3.20.jpg)\n\n**图 3.20:** 初始化\n\n然后运行其他节点：\n\n![](img/Figure-3.21.jpg)\n\
  \n**图 3.21:** 运行节点 const\n\n在会话中执行节点 `const` 实际上是将值 10 赋值给 `const`，然后显示该值。我们也可以显式地使用\
  \ `print` 函数来打印 `var1` 和 `sum` 的值，如下：\n\n![](img/Figure-3.22.jpg)\n\n**图 3.22:**\
  \ print 函数\n\n这是一个处理常量和变量的很好的例子。接下来，让我们看看占位符是如何运作的。\n\n让我们创建一个占位符 `a`：\n\n![](img/Figure-3.23.jpg)\n\
  \n**图 3.23:** 创建占位符\n\n尽管 `a` 中没有值，但你也可以像普通变量一样对待它并对其进行计算。例如，你可以创建一个结果为 `a*2` 的节点\
  \ `b`。\n\n然而，当你尝试在会话中执行此节点时，你会得到一个错误：\n\n![](img/Figure-3.24.jpg)\n\n**图 3.24:**\
  \ 占位符节点\n\n这是因为你需要在会话中运行它运行时填充占位符。在会话中执行占位符有特定的方法。我们必须在运行时使用名为 `feed_dict`（feed\
  \ 字典的缩写）的参数向占位符“喂入”值。执行占位符的语法如下：\n\n![](img/Figure-3.25.jpg)\n\n**图 3.25:** 为占位符喂入值\n\
  \n你以字典的形式传递占位符的值。在这种情况下，我们为占位符 `a` 喂入了 3.0。注意，当我们想要执行包含 `a` 的 `b` 时，我们必须再次喂入 `a`。\n\
  \n所以，每当你执行包含占位符的节点时，你都必须喂入占位符。如果一个节点中有多个占位符，你必须在执行时提供所有的占位符。\n\n这是另一个例子：\n\n![](img/Figure-3.26.jpg)\n\
  \n**图 3.26:** 执行所有占位符\n\n注意，这些值并没有被存储。它们被用于计算然后被丢弃。因此，如果你尝试直接打印 `pl1` 或 `pl2` 的值，它会再次报错：\n\
  \n![](img/Figure-3.27.jpg)\n\n**图 3.27:** 执行占位符时的错误\n\n你必须在会话运行时喂入占位符，并且每次都需要运行它。然而，喂入占位符有不同的方法。让我们来看看这些变体。首先，我们传递的值不需要是普通的数字（标量）；它们可以是数组或多维数组。这里是一些例子：\n\
  \n![](img/Figure-3.28.jpg)\n\n**图 3.28:** feed 字典\n\n你也可以提前准备字典并像示例所示在会话中使用它：\n\n\
  ![](img/Figure-3.29.jpg)\n\n**图 3.29:** 字典准备\n\n\n\n你可能已经在 Jupyter notebook 文件中见过这种情况。虽然关闭会话（session）可能不会报错，但如果你并行运行多个\
  \ Jupyter notebooks，可能会导致问题。每次创建一个会话，都会为其分配某些资源。当你关闭会话时，这些资源会被释放。\n\n避免这种情况的一种方法是在\
  \ `with` 块中创建并使用会话。这是一种更专业的代码写法。以下是使用 `with` 块的 `Hello World` 代码：\n\n![](img/Figure-3.40.jpg)\n\
