  \ `pip install` 安装 `transformers`：\n\n![](img/Figure-7.75.jpg)\n\n**图 7.75：** 通过\
  \ pip 安装 transformers\n\n导入所需的库：\n\n![](img/Figure-7.76.jpg)\n\n**图 7.76：** 导入库\n\
  \n有几个不同的预训练模型，但我们将使用：\n\n`Bert-large-uncased-whole-word-masking-finetuned-squad`\n\
  \n![](img/Figure-7.77.jpg)\n\n**图 7.77：** \"Bert-large-uncased-whole-word-masking-finetuned-squad\"\
  \ 预训练模型\n\n下载并加载模型和分词器（tokenizer）：\n\n![](img/Figure-7.78.jpg)\n\n**图 7.78：** 下载模型和分词器\n\
  \n准备 pipeline：\n\n![](img/Figure-7.79.jpg)\n\n**图 7.79：** 准备 pipeline\n\n创建一个名为\
  \ `Q&A` 的函数，它接收上下文和问题并返回答案：\n\n![](img/Figure-7.80.jpg)\n\n**图 7.80：** 创建 Q&A\n\n\
  准备上下文。在这种情况下，它是从名为 `mohan.txt` 的文本文件中读取的，这是一个个人的个人简介。让我们显示上下文：\n\n![](img/Figure-7.81.jpg)\n\
