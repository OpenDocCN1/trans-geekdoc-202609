  \n语音转文本和文本转语音的过程已经存在很长时间了，并且已经商品化了。因此，在本章中，我们不会深入探讨这些领域。然而，在整个过程中，机器不需要理解声音或文本的含义。它盲目地将音频转换为文本，将文本转换为音频。但要构建像\
  \ Alexa 这样的智能系统，机器还需要理解文本的含义，这就是自然语言处理或 NLP 的用。NLP 领域取得了许多进展，在本章中，我们将看到 NLP 的最新进展，例如\
  \ Transformers 及其在 NLP 中的应用。\n\n## 自然语言处理 (NLP)\n\n语音识别的核心是自然语言处理或 NLP。语音转文本将说的话转换为文本，但系统并不理解其含义。NLP\
  \ 是理解说话内容并启动相应响应的过程。因此，NLP 被进一步分为两个部分——自然语言理解 (NLU) 和自然语言生成 (NLG)。\n\n在开始之前，让我们快速回顾一些常用的\
  \ NLP 术语：\n\n*   **文本语料库 (Text corpus)**：用于训练 NLP 模型的大型文本文档或多个文本文档。\n*   **文档 (Document)**：一组单词或标记（tokens）。这可以是一个句子、一条推文或一个文本文件。\n\
  *   **标记 (Tokens)**：句子或文档中的单个单词。\n*   **嵌入 (Embedding)**：将文本转换为数字的机制。\n\n为了更好地理解\
  \ NLP，我们将考虑下面列出的各种 NLP 任务，并为每个任务运行一个代码演示：\n\n*   情感分析或文本分类\n*   问答——如聊天机器人中\n* \
  \  文本摘要\n*   语言翻译\n\nNLP 过程的第一步之一是词嵌入 (Word Embedding)。\n\n## 词嵌入 (Word Embedding)\n\
  \n机器不懂文本。因此，第一步是将文本转换为数字。有几种传统方法可以实现这一点，例如词袋模型 (Bag of words)、词文档频率 (TDF) 等。但在深度学习中，我们使用一种称为词嵌入\
  \ (Word Embeddings) 的机制。\n\n将文本转换为数字最简单的方法是为文本语料库中的每个唯一标记分配一个数字。然而，单个单词在语言中并没有太大作用。它们与其他单词一起使用来传达含义。此外，许多单词以某种形式相互相关。例如，Man（男人）和\
  \ King（国王）在性别上是相似的。Man 和 woman（女人）由于它们是反义词而是相关的，以此此类推。通过词嵌入，每个单词被转换为多维向量，这种相似性或关系。通过词嵌入，每个单词被转换为多维向量，使得这种相似性或关系被维护了。Word2vec\
  \ 是其中一种技术。GloVe（Global Vectors）是另一种。\n\n为了理解词嵌入的概念，我们将通过以下方式进行演示：\n\n```bash\npip\
  \ install gensim\n```\n\n![](img/Figure-7.13.jpg)\n\n**图 7.13：** 安装 gensim\n\n我们将使用的预训练\
  \ word2vec 模型是 `GoogleNews-vectors-negative300.bin`。位置如下：https://code.google.com/archive/p/word2vec/\n\
  \n下一步是加载此模型。\n\n```python\nfrom gensim.models import KeyedVec\nmodel = KeyedVec.load_word2vec_format('GoogleNews-vectors-negative300.bin',\
  \ binary=True)\n```\n\n![](img/Figure-7.14.jpg)\n\n**图 7.14：** 加载模型\n\n该预训练模型在大规模语料库上训练过，因此包含了几乎所有的英语词汇。让我们看看为某些单词创建的向量。我们可以检查这些值：\n\
  \n```python\nprint(model.get_vector('rich')[:10])\n```\n\n![](img/Figure-7.15.jpg)\n\
  \n**图 7.15：** 获取单词的向量\n\n让我们看看另一个词，poor：\n\n```python\nprint(model.get_vector('poor')[:10])\n\
  ```\n\n![](img/Figure-7.16.jpg)\n\n**图 7.16：** \"rich\" 的向量表示\n\nword2vec 的优点之一是它理解单词之间关系的能力。这是通过计算它们之间的余弦距离实现的。我们可以使用相似性函数检查相似单词。让我们看看例子：\n\
  \n```python\nmodel.most_similar('poor', n=3)\n```\n\n![](img/Figure-7.17.jpg)\n\n\
  **图 7.17：** 与 \"poor\" 相似的\n\n在结果中，右侧的数字是相似性量。值越高，单词越相似。我们可以为单词 `fast` 再举一个例子：\n\
  \n```python\nmodel.most_similar('fast', n=3)\n```\n\n![](img/Figure-7.18.jpg)\n\n\
  **图 7.18：** 与 \"fast\" 相似的\n\n我们也可以通过调用 similarity 方法并传入两个单词来衡量它们之间的相似性：\n\n```python\n\
  model.similarity('rich', 'richer')\n```\n\n\n\n\n这看起来像是一个非常微不足道的例子，但请记住，虽然人类很容易识别出\
  \ rich（富裕）和 richer（更富有）几乎是同一个词，但对机器来说，它们是完全不同的词。然而，通过 `word2vec`，它理解到了它们之间存在大量的相似性。\n\
  \n我们可以看另一个例子：\n\n![](img/Figure-7.21.jpg)\n\n**图 7.21：** “good”（好）和“fantastic”（极好的）之间的相似指数\n\
  \n它识别出 `good` 和 `fantastic` 密切相关。\n\n最后，让我们取两个反义词检查一下\n\n![](img/Figure-7.22.jpg)\n\
  \n**图 7.22：** “rich”（富）和“poor”（穷）之间的相似指数\n\n观察发现，在这种情况下，值很低，这意味着这些词是不相似的。`word2vec`\
  \ 的另一个非常有趣的方面是进行数学运算的能力。著名的例子就是这个：\n\n`King – man + woman = queen`\n\n`这被称为词类比。其他例子如下：`\n\
