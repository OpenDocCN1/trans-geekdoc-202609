    # Pattern Recognition 144 (2023) 109862


    ScienceDirect 提供内容列表


    ![](img/964e8d165afb066da1747bee786dd1ec_0_0.png)


    # Pattern Recognition


    期刊主页：www.elsevier.com/locate/pr


    ![](img/964e8d165afb066da1747bee786dd1ec_0_1.png)


    # 针对车间物体RGB-D语义分割的跨模态 Transformer


    ![](img/964e8d165afb066da1747bee786dd1ec_0_2.png)


    Ru Qingjun, Chen Guangchen, Zuo Tingyu, Liao Xiaojiao


    成都理工大学计算机与网络安全学院


    # 文章信息


    # 摘要


    * **关键词:**

    * 生产车间物体

    * RGB-D

    * 语义分割

    * Transformer


    生产车间的场景理解是提高其智能化水平的一项技术，生产对象的语义分割是实现场景理解的有效方法。考虑到车间环境的变化，充分利用互补的RGB图像和深度信息可以提高生产对象的语义精度。针对车间物体的多尺度和实时处理，我们提出了跨模态
    Transformer（Cross-Modal Transformer），一种基于 Transformer 的语义分割方法。其关键特征提取和融合部分由多尺度自注意力修正（MS-CAC）模块和特征聚合（FFA）模块组成。通过实现
    RGB 图像与深度之间的多头交互，我们构建了长距离交互并在 CM-MSHA 模块之上设计了 MS-CAC 模块和 FFA 模块，以实现空间和通道维度上的跨模态信息融合。其中，MS-CAC
    模块利用 RGB 和深度特征提取每个通道的多尺度特征，同时在空间维度和全局局部特征上进行融合。在 NIV 深度数据集上的实验中，CMformer 达到了 68.00%
    的 mPixel Accuracy 和 57.69% 的 mIoU（平均交并比）。在生产车间数据集（SOF）上，CMformer 达到了 96.74% 的
    mPA、92.58% 的 mIoU 以及 43 FPS（每秒帧数），具有高精度和实时性能。代码可用：https://github.com/FaultAI/CMformer


    # 1. 引言


    随着工业互联网技术的发展，制造业正向制造自动化发展。作为制造业的一部分，对车间物体的准确理解是实现智能制造的核心。场景理解技术可以感知车间运行情况、提高效率，并提升生产和制造质量。


    机器人导航任务要求对车间场景物体进行语义视觉识别和识别，即根据识别结果识别类型、形状和位置以进行决策。大多数语义分割方法基于单模态 RGB 图像 [1, 2]，无法适应高复杂和光照不均匀的环境，难以实现对生产对象的准确理解。在深度信息的帮助下，深度信息已被辅助语义分割
    [3]。将深度信息整合到 RGB 图像中更有区分图像中的混淆区域。对于实现生产车间场景的 RGB-D 语义分割方法具有重要意义。然而，寻找 RGB 特征与深度特征的融合模式是一个挑战性问题。FCN
    仅将图像作为 RGB 图像的第四部分，并将其作为卷积神经网络（CNN）的输入进行拼接。其他方法 [5] 使用两个 CNN 作为编码器从 RGB 图像和深度图中提取特征，并了多阶段特征并最终进行了融合。

