    ##4.4. NYU Depth v2 实验结果

    为了验证我们所提方法的泛化能力，我们在 NYU Depth v2 数据集上对其进行了测试，并与当前的先进模型进行了比较，结果见表7。如上，我们的方法达到了
    66.36% 和 54.12% 的 mIoU，超过了所有基于 CNN 方法。此外，随着模型规模的扩大，CMFormer-L 达到了 68.00% 的 mIoU
    和 55.75% 的 mIoU。我们排除了 UFormer [16] 是由于其参数不确定性。我们使用 FPN [42] 作为解码器，使用 CNN [14]
    作为编码器。具体的超参数见表5。


    ##4.3. SOP 实验结果

    在 SOP 数据集上将 CMFormer 系列与其他模型进行了对比，结果见表4。遵循全局注意力机制，CMFormer 与 ESNet [43] 相比，mIoU
    提升了 2.1% 和 4.8%。如表5 所示，对于“人”这一类，相比 CMFormer-S，其 mIoU 提升了 5.2%。由于多尺度特征的保留，从 CMFormer-S
    到 CMFormer-L，性能显著提升（达到了 89%）。我们评估了每个每个类别，结果见表7。相反，CMFormer-S 仅关注局部特征。


