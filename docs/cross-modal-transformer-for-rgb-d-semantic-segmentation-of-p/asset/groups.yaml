    # # Cross-Modal Transformer for RGB-D semantic segmentation of workshop objects


    ![](img/964e8d165afb066da1747bee786dd1ec_0_2.png)


    Qingjun Ru, Guangchen Chen , Tingyu Zuo, Xiaojiao Liao


    College of Computer and Cyber Security, Chengdu University of Technology, Chengdu,
    China


    # ARTICLE INFO


    # ABSTRACT


    +   * Keywords:

    * Production workshop object

    * RGB-D

    * Semantic segmentation

    * Transformer


    Scene understanding in a production workshop is an important technology to improve
    its intelligence level, semantic segmentation of production objects is an effective
    method for realizing scene understanding. With the variations of production workshop,
    making full use of the complementary RGB image and depth can improve the semantic
    accuracy of production objects. By aiming at multi-scale and real-time processing
    ofing workshop objects, we propose Cross-Modal Transformer, a Transformer-based
    semantic segmentation method. Its key feature extraction and fusion parts are
    composed of the Multi-Scale Self-Attention Correction (MS-CAC) module and the
    Feature Aggregation (FFA) module. By implementing MultiHead interaction between
    RGB image and depth, we build long-range interaction and design the MS-CAC module
    and the FFA module on top of the CM-MSHA module to achieve cross-modal information
    fusion in the spatial and channel dimensions. Among them, the MS-CAC module extracts
    the multi-scale features of each channel with RGB and depth feature to perform
    fusion in the spatial dimensions and global and local features at the same time.
    In the experiments on the NIV depth dataset, CMformer achieved 68.00% mPixel Accuracy
    and 57.69% mIoU (Mean over Union). On on the production workshop dataset (SOF),
    the CMformer achieves 96.74% mPA, 92.58% mIoU and 43 FPS (Frames Per Second),
    which has high precision and real-time performance. Code available at: https://github.com/FaultAI/CMformer


    #  1. Introduction


    With the development of industrial internet technology, the manufacturing industry
    is developing towards manufacturing automation. As part of the manufacturing industry,
    accurate understanding of the workshop object is most part of realizing intelligent
    manufacturing. The scene understanding technology can perceive the workshop operation
    situation, speed efficiency, and improve the production and manufacturing quality.


    robot navigation tasks. The tasks require semantic vision recognition and recognition
    of workshop scene objects, that is identifying the type, shape and position for
    inference decisions based on the recognition results. Most semantic segmentation
    methods are based on single-modal of RGB image [1, 2], which cannot adapt to environments
    with high complexity and uneven illumination, and achieve accurate understanding
    of the production objects. With the help of depth information, depth information
    has been used to assist semantic segmentation [3]. Integrating the depth information
    into the RGB image as a sample is more conducive to distinguish the confused areas
    in an image. It is great to realize RGB-D semantic segmentation methods in production
    workshop scene.


    However, to find the fusion modes of RGB feature and depth feature is a challenging
    problem. FCN simply took the


