    the image to too many features, especially multi-scale features; the SAM calculates
    the spatial attention vector through convolution, but the global receptive field
    could not be obtained by saving features. To obtain the global receptive field
    information, the Transformer-based RGB-D segmentation methods, CMix and UCTNet
    (16) use the original attention in CNN to extract feature and fusion without it.
    TR-Fusion [13] only proposed to fuse the features of different stages at the final
    stage, without using multi-level method. Therefore, the calculation methods of
    attention mechanism have limitations.


    +   A new RGB-D segmentation method based on Transformer(CMformer) is proposed.
    Its key construction and fusion parts are composed of the MS-CNN and the GFA method.
    The MS-CNN processes multi-scale information and extracts relevant features. The
    GFA method realizes spatial and local features, which makes the CMformer achieve
    better attention cross-modal information interaction by capturing long-range dependencies.


    The effectiveness of the CMformer is evaluated with experiments on the OPT dataset
    [19] and NYU depth dataset [22]. The results show that the CMformer achieves the
    state-of-the-art results on both datasets. It can achieve 97.4% MA and 92.8 mIoU.
    Meanwhile the real-time performance of CMformer can reach 43 FPS (Frames Per Second),
    which means real-time performance meets the requirements of high recognition.


    # 2. Related work


    # 2.1. Vision Transformer


    # 2.1.1. Backbones


    Vision Transformer(ViT) [21] proposed a Transformer structure for image recognition
    for the first time. The image is divided into patches of size 16x16, and flattened
    into sequences. The performance of ViT is equal to or better than that of CNN.
    Specifically, ViT splits the image into patches and adds position embedding. Deit
    [25] proposed an efficient training and teacher-student strategy to make ViT work
    well.


    In production, there are large scale differences between different objects, so
    how to make full use of multi-scale features to recognize the objects in the production
    workflow is a key problem.


    In the production work, various environment needs equipment to process the surrounding
    environment, so how RGB-D segmentation meets real-time performance under complex
    conditions?


    In order to overcome the challenges and limitations of the existing attention
    mechanism, we propose an RGB-D segmentation method based on Transformer, which
    is Cross-Transformer(CMformer). The CMformer follows the standard encoder-decoder
    structure, which includes two feature extraction modules. We use Multi-Head Self-Attention(MHSA)
    in the architecture, achieving long-range interaction between RGB and depth image.
    On the CM-MHSA module, we design the Cross-Channel Attention (Con-MS-CAC) and
    the Global Feature Aggregation(GFA) module on the base to achieve cross-modal
    information interaction in the channel and space dimensions. Meanwhile, the MS-CAC
    module is a new channel module which is


