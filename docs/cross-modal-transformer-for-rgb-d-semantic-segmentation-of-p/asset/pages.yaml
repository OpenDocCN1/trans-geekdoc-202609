    Nevertheless, the attention-based RGB-D segmentation methods focus more on the
    local features of image without considering the long-range dependency information.
    At present time, the attention mechanism was implemented by the Channel Attention
    Mechanism (CMAM) and Spatial Attention Mechanism (SAM) proposed in SEnet [7] and
