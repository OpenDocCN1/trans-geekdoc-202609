    # ## 2.2. RGB-D semantic segmentation


    With the advent of depth sensors, we can easily obtain depth information of scene.
    An effective method of RGB and depth feature can improve the accuracy of semantic
    segmentation. Some early works have manually designed segmentation methods to
    improve the performance of RGB-D semantic segmentation [56]. With the advent of
    computer vision, CNN [54] naturally occupied a dominant position in RGB-semantic
    segmentation. FCN concatenated the depth channel as the four-channel input of
    CNN. However, due to the limited information in the depth channel, it does not
    bring significant features to semantic segmentation. Gupta et al. [38] proposed
    HHA(Horizontal depth, height, Angle of the surface) to improve the depth segmentation
    method by decomposing the depth into three channels, and RGB HHA image were merged
    into CNN for feature extraction, and fused in the final stage of the network.
    FSEN [39] used a two-stage CNN encoder to extract RGB and depth features and then
    fuse different levels of features from the RGB features to achieve RGB-D semantic
    segmentation. [56] proposed the concept of layer learning to effectively extract
    RGB features and complementary depth features, and fuse them through a multi-level
    fusion scheme, so as to obtain better segmentation prediction results.


    ACNet [9] use toiter important features in RGB image and depth image, and fuses
    them between different models through three parallel branches. Both SA-Gate [10]
    and CMX [14] use the method of combining CAM and SAM to achieve feature connection
    between different models. That is SA-Gate


    # ## 3. Cross-modal Fusion


    # ### 3.1. Overall architecture


    In order to refine the interaction between RGB and depth feature, and improved
    by ACNet [19], the overall architecture of the CMformer is a standard encoder-decoder
    architecture.


    We use parallel encoders to extract the latent features of the RGB image and depth
    image, and decodes the features and outputs the final segmentation result. The
    overall structure of the model is shown in Fig. 1. The depth image contains some
    noise, and due to the limited range of data, the depth values are inaccurate.
    In the RGB image, the boundaries of some similar colors and textures cannot be
    distinguished well. We use attention mechanism to obtain more accurate boundaries.
    During the coding phase, an efficient cross-modal interaction method can utilize
    the information of two modalities and identify their strengths from each modal.
    Therefore, this paper proposes the CMformer model. The MS-CAC module corrects
    the features of the two models in each down-sampling stage, supplements the features
    of the other modal, and inputs the output results to the next


    In this section, we first introduce the cross-modal interaction module of CMformer
    in Section 3.2. Then the MS-CAC module and the GFA module for cross-modal feature
    fusion and aggregation are introduced in Section 3.3 and 3.4, respectively. Finally,
    a series of CMformer with different sizes, CMformer-Medium and the CMformer-Large,
    are introduced in Section 3.5.'
