  \ 摘要\n\n工作场所中的 AI 是一把双刃剑。它对进步很有力，但也伴随着风险。管理良好且持积极态度的“影子 AI”（Shadow AI）可以释放生产力、知识的新水平，而与所有严格\
  \ IT 规则之外的所有 AI 相关的竞争风险都是影子 AI。影子 AI 通常始于那些用意良好的员工，他们只想在 AI 技术的帮助下解决问题并更好地工作。他们并不是试图打破规则，只是在寻找解决方案。本文通过广泛的文献回顾，讨论了组织中使用影子\
  \ AI 的潜在收益和风险及其数据隐私，以及用于安全使用生成式 AI (GenAI) 的数据分类，并提出了建议。影子 AI 是在组织内部未经授权使用 AI 工具的行为，既带来了机遇也带来了挑战。本研究提出了一个概念框架，帮助组织应对这一复杂的局面。该框架强调了影子\
  \ AI 对于安全使用 GenAI 的性、制定 AI 可接受使用政策以及实施有关负责任 AI 实践的员工培训计划。此外，它还强调了需要强有的安全措施来监控和控制\
  \ AI 的使用。通过采用这一框架，组织可以降低与影子 AI 相关的风险（如数据泄露、法律问题和资源浪费），同时释放增强决策、提高生产力和促进创新的等潜在收益。该框架为未来\
  \ AI 的采用符合伦理原则、透明度和更大的公共利益做出了贡献。\n\n*关键词*：生成式 AI (GenAI)；影子 AI 实践；LLM 能力；批判性思维与创造力；人连接；真实性\n\
  \n## 1. 引言\n\n人工智能 (AI) 的加速发展为全球企业带来了改变游戏规则的前景。但这种技术进步也带来了新的威胁：影子 AI。组织面临着这种现象带来的严重风险，这涉及在未经官方批准的情况下使用\
  \ AI 工具和系统。这些风险包括数据管理不当、安全漏洞和不符合法规规定。本文探讨了提高透明度和以负责任的方式鼓励创新的重要性。AI 彻底改变了我们工作和生活的方式，其应用的发展速度是前所未有的。根据\
  \ Salesforce 最近的一项研究，55% 的员工在没有获得正式许可的情况下在工作中使用 AI，而约 70% 的员工缺乏关于如何安全且符合伦理地使用 AI\
  \ 的适当培训。在有关 AI 治理和伦理的讨论中（特别是在工作场所），一种被称为“影子 AI”的新观点浮出了水。它通常指的是在企业内部创建的、未经 IT 部门明确同意或监督的\
  \ AI 倡议或系统 (Catherine et al., 2024)。这些可能仅仅是某个小组使用未经批准的机器学习工具分析公司数据，也可能是为了开发并实施以实现任务自动化的\
  \ AI 模型。影子 AI 为组织带来了机遇，也带来了挑战，因此，他们制定政策来妥善管理 AI 使用至关重要。AI 的创建、应用以及隐藏 AI（影子 AI）中的伦理和透明度问题。积极的进展开始出现。得益于可解释\
  \ AI (XAI)，AI 系统正变得不再像不透明的黑箱，而是更易理解。\n\n越来越多的组织正在优先考虑伦理 AI 实践。通过强调公平、对 AI 的行为承担责任并保持透明度，企业可以培养信任并避免由隐藏\
  \ AI 产生的问题。确保无缝的人机协作是一个至关重要的组成。我们可以通过让人参与监督、提供输入并在必要时干预，来针对隐藏 AI 可能产生的潜在风险增加措施 (Silic\
  \ & Back, 2014)。专业人员大量使用影子 IT 软件，这提高了生产力并促进了更快、更有效的团队合作与沟通。此外，员工认为他们的行为只是简单的无知的结果，他们并没有做错什么。尽管在影子\
  \ IT 的背景下 IT 风险显著增加，但企业通过实施控制和应对措施仍然可以降低这些风险并更好地保护其公司资产。如果公司希望跟上技术的不断进步，它们将重新考虑其影子\
  \ IT 策略，并对如何处理其使用获得改进的理解。限制是一种有效的预防措施，但对于为整个组织生态系统带来机遇的影子 IT 问题并非万能药。以下是任何组织使用的网络应用程序：影子网络是终端用户在互联网上安装的、绕过安全措施以访问网络的应用程序。用于内容创建和查看的应用程序（PDF/外网应用）被称为内容应用。除了外网应用——即可以从外部以受控方式访问的外部计算机网络之外，它们主要是\
  \ PDF 应用。实用工具是指员工使用的各种工具（例如视频转换器、编解码器以及 PC 优化和清理工具）。\n\n## 2. 文献综述\n\n#### 2.1 与影子\
  \ AI 相关的风险\n\n\n\n\n影子 AI（Shadow AI）的鲁莽行为带来了重大风险，但通过适当的记录和审批流程，也可以简化其决策过程。未经授权使用\
  \ AI 工具会导致数据隐私面临巨大风险。在处理敏感数据时，必须始终遵守安全协议。不受监管 AI 解决方案的激增可能会导致不可预测的劳动力需求和技能要求。通过正规渠道，企业可以重新获得对系统的治理。为了减少与影子\
  \ AI 相关的风险，组织需要制定一个符合其价值观和政策的道德 AI 使用框架。这可以通过制定伦理规则和法规来实现。这确保了任何 AI 都遵循保护公司及其客户免受不伦理\
  \ AI 行为侵害的规则。任何 AI 系统都应对其工作原理透明，并为非专业人士提供其选择的依据 (Zhan et al., 2023)。通过揭秘 AI 并让所有利益相关者都能理解，可以增强对\
  \ AI 应用的信心。为了有效管理和缓解与影子 AI 相关的风险，必须采取这一步骤，以确保所有 AI 计划都有清晰的监督路线。通过实施这些策略，与影子 AI 相关的危险将会降低，并建立一个促进创新和实验的安全且受监管的环境。意识到\
  \ AI 潜力并并通过结构化路径引导其发展的组织，可以在保持控制和问责的同时，利用其力量来推动创新。\n\n### 2.1.1 影子 AI 的潜在收益\n\n\
  组织通过拥抱 AI 潜力并将影子 AI 项目转化为增长引擎，可以变得更具创新性、高效且具有竞争力 (Zhan et al., 2023)。\n\n### 2.1.2\
  \ 加速决策过程\n\n通过为不同的业务部门提供 AI 工具，企业可以利用各种观点和专业领域做出更好的决策 (Pierce, 2008, pp. 79–99)。通过这种去中心化方法做的决策更有效，因为它结合了组织不同部分的视角。\n\
  \n### 2.1.3 提高生产力和效率\n\n影子 AI 项目通常始于简化工作流的尝试，这可能会导致行业认可的最佳实践 (Orton-Johnson & Prior,\
  \ 2013)。当员工使用 AI 更快、更智能地完成任务时，整个组织就可以实施这些创新，提高生产力。\n\n### 2.1.4 鼓励创意与创新\n\n让员工 (Milmo,\
  \ 2023) 尝试 AI 有助于营造更具创新性的工作氛围，并为日常问题发现新的解决方案。这种创新可能不是源自上而下的指令。许多业务用户正在尝试使用 `ChatGPT`\
  \ 和 `Google Bard` 等生成式 AI (GenAI) 应用来 (Cui et al., 2023) 与运营部门对接以提高生产力。这种动机是合理的，但影子\
  \ AI 带来了独特的网络安全和商业风险，就像任何经过批准的大语言模型 (LLM) AI 项目一样。\n\n### 3. 研究方法\n\n影子 AI 通常始于善意良好的员工，他们只是想在\
  \ AI 技术的帮助解决问题并更好地工作。他们并不是试图违反规则，而是在寻找解决方案。影子 AI 使用的潜在收益和风险，以及组织在使用影子 AI 时带来的数据隐私问题，已在\
  \ 1995 年至 2024 年的文献研究中进行了讨论，通过分析 IT 与业务之间的差异、关键变量和关系，以及 AI 所面临的实际挑战与机遇。\n\n####\
  \ 3.1 功能威胁\n\n功能性威胁由欧盟网络安全局 (ENISA) 定义。当 AI 工具未能按预期执行时，就会产生功能性威胁，导致潜在风险和后果。功能性风险是指\
  \ AI 模型偏离了其旨在处理的问题范围，使其变得不可用并具有误导性。运营风险危害了公司的业务运营。存在多种运营风险。例如，如果影子 AI 工具没有经过良好训练，可能会对公司产生不利。来自\
  \ GenAI 的负面建议可能导致更高的机会成本，例如公司在应该投资的地方未能投资，或者在粗放增长时浪费投资。使用 LLM，特别是任何在企业数据管理策略之外训练和开发的未经许可的模型，可能会使机客户和业务信息面临风险。当聊天机器人接收用户提示词时，它可以利用这些信息作为训练数据并与平台运营商和其他用户共享。一旦\
  \ AI 平台遭受网络攻击，数据可能会落入犯罪分子手中。当医疗提供者使用 GenAI 聊天机器人总结患者预约时，他们违反了规定并泄露了私人健康信息。高管使用 AI\
  \ 创建内部演示要点时，泄露了商业秘密。当律师使用聊天机器人整理案件笔记时，确保律师与客户之间通信机密的法律保护被泄露了。业务分析师通过上传包含客户卡号的大型多字段电子表格，使用\
  \ GenAI 应用创建新报告 (Shevlane & Christiano, 2023)。AI 安全和治理的优先事项应该是对模型进行极端风险评估。通过 LLM\
  \ 访问此类隐私信息可能会危害公司的业务计划和知识产权，使竞争对手占据优势并削弱竞争优势。涉及个人身份信息时，可能会发生重大的数据隐私和合规违反，损害客户信任并产生声誉后果。法律风险是指影子\
  \ AI 使业务面临法律诉讼或罚款的风险，法律风险将在运营风险和功能风险之后出现。然而，如果信息是错误的，公司在错误行动时将浪费巨额资金。投资者可能会提起诉讼。\n\
  \n#### 3.2 监管罚款与刑事处罚\n\n\n\n\n\n随着规范 AI 发展的法律不断变化，这种情况可能会变得更加令人担忧。在某些情况下，影子 AI（Shadow\
  \ AI）用户可能会因为没有利用相似且已批准技术的特价而浪费资金。考虑考虑与因违反公司政策或最佳实践而最终失败的秘密项目相关的机会成本。在这些项目上花费的时间和金本可以用于其他事业（Ward\
  \ et al., 2023）。如果企业希望跟上技术的不断进步，它们需要重新考虑其影子 IT 策略，并更好地了解如何处理其使用（Silic & Back, 2014）。限制是一种有效的预防措施，但它并不是解决为整个业务关注的生态系统提供机会的影子\
  \ IT 问题的万灵药。此外，当影子项目正式加入投资组合并不再是影子项目时，要准备好支付转型成本。使用影子工具的员工和工作人员需要重新培训，以便他们能够在更新后的背景和新限制下理解工具集。组织还必须支付迁移成本，将其他用户转移到授权工具（Turpin\
  \ et al., 2023）。影子 IT 是隐私和合规性关注的现象，而且这个领域似乎刚刚开始（Silic, 2013）。此外，许多早期的研究已经针对这种“内部威胁”及其缓解措施（Warkentin,\
  \ 1995）。这个问题是一个员工意识问题，建议的补救措施是培训员工成员遵守信息系统安全策略。\n\n### 3.2.1 研究问题：然而，根本问题仍然是：为什么\
  \ IT 与业务之间存在这种如此巨大的错配？\n\n研究人员已经确定了导致这种不一致的原因，包括业务与 IT 之间通信的严重匮乏以及响应能力的下降（Teo &\
  \ Ang, 1999）。影子 IT 通常被解释为一种用户不合规行为，因为它被认为主要是一个信息系统安全问题（Györy et al., 2012）。影子 AI\
  \ 频繁出现在企业中，是因为员工自行部署 AI 解决方案、IT 流程缓慢或缺乏 AI 工具（[Widder et al. (2023)）来满足部门需求）。它也可能源于人们认为获得新技术的批准很困难。不符合组织\
  \ IT 治理的应用程序（例如未经批准的机器学习模型、AI 驱动的分析工具或任何其他 AI 软件）被称为“影子 AI”。员工经常使用影子 AI 来绕过官方渠道、克服官僚主义的延迟，用更专业的解决方案满足未满足的需求，或进行创新和简化工作流程。\n\
  \n增强 IT 敏捷性、创建透明的 AI 治理框架、为测试提供安全空间、鼓励 IT 与其他部门之间的开放通信以及培训员工成员相关风险和适当程序，都是防止影子 AI\
  \ 的必要措施。除了可能的优势外，影子 AI——组织内部未经授权或未报告的 AI 工具使用——可能会带来新的风险。影子 AI 模型可能缺乏与授权系统相同的安全预防措施。这增加了机密信息泄露的风险，无论是故意的（模型操作者通过窃取数据）还是无意的（共享秘密）。如果影子\
  \ AI 工具涉及对客户数据的人工审查（例如为了训练或改进），可能会发生对敏感公司数据的未经授权访问。组织面临有关网络安全和数据隐私的法律要求。在授权渠道之外使用影子\
  \ AI 模型可能会违反这些规则。AI 模型可能会产生错误的结果或强化现有的偏见，特别是当它们的训练数据较少时（Wiltshire & Ronkainen, 2021）。正如作者指出的，“幻觉”本质上是\
  \ AI 作为事实呈现的虚假信息，它们可能会产生危险的后果。向员工教授与“影子”AI 可能相关的风险并促进这些技术的适当使用也是需要的。还需要为组织批准 AI\
  \ 使用定义精确的政策和程序。安全措施，如确保所有 AI 工具（无论是否授权）都符合数据安全标准并遵守法规。定期监控和审计 AI 的使用情况，以识别并解决任何未经授权或高风险的做法。通过采取积极措施，组织可以利用\
  \ AI 的力量，同时尽可能地减少影子 AI 的潜在陷阱。\n\n### 3.3 用于安全使用 GenAI 的数据分类\n\n数据分类对于安全使用 GenAI\
  \ 至关重要。它是数据安全和负责任信息管理的基础，类似于其在通用数据安全实践中的作用。它在所有方面都有帮助，例如通过根据敏感性对数据分类来进行基于风险的访问控制，组织可以确定\
  \ GenAI 工具的适当访问级别。敏感数据可能被限制在安全的本地 AI 部署或专门设计用于符合内部数据安全策略的企业级应用程序中（Bai et al., 2023）。[Bakhtin\
  \ et al., 2022）通过数据分类来缓解影子 AI 风险，有助于识别哪些信息不应与未经授权或未记录的 AI 工具一起使用。减少减少数据泄露、未经授权的访问和违规。知情决策允许组织对\
  \ GenAI 使用做出明智决策。例如，公开信息可以使用消费级聊天机器人，而敏感数据需要更安全的环境。此策略适用于所有员工、承包商以及任何使用组织提供的工具和资源的人。它包括\
  \ GenAI 模型（文本生成、代码生成等）、AI 驱动的应用（聊天机器人、数据分析工具等）以及内部 AI 开发平台。AI 可接受使用政策可以清楚地表明不当使用\
  \ AI 是否会对公司造成伤害以及如何协调（Matsuo et al., 2022）。结合其他风险最小措施，如数据安全措施。在出现影子 AI 时，决策者通过将工具的使用与政策进行比较，可以迅速确定风险范围和适当的行动方案（Castelfanchi,\
  \ 2002）教学和员工负责任地使用 AI。为了降低与影子 AI 相关的风险并充分利用这项技术，必须为员工提供负责任使用所需的信息和能力。以下是一些成功的教育和培训方法：为了适应不同的学习风格，使用多种格式，如交互式模块、在线课程、视频教程以及贯穿课程的真实案例模拟，并提供行业内负责任和不负责任使用\
  \ AI 的案例以及实际影子 AI 发生的研究，以识别可能的危险和后果。避免过度的（Castelfanchi, 2000）技术术语，专注于传达有用的信息（参见图\
  \ 4.1）。\n\n![image](img/f04-01.jpg)\n\n\n\n\n图 4.1. 概念框架。*来源：*作者构思。\n\n\nZhu (2023)\
  \ 提供了 `AI` 背后的基础理念，包括其各种形式、局限性以及可能存在的偏见。\n\n#### 数据安全与隐私\n在使用 `AI` 工具时，应对全体员工进行数据安全最佳实践的培训，例如数据分类和访问控制。\n\
  \n#### 需要考虑的道德方面\n员工应接受培训，学习如何识别和处理在使用 `AI` 时遇到的伦理问题，例如问责制、透明性和公平性。\n\n#### 识别影子\
  \ AI\n为员工提供所需的工具，以他们识别未经批准或未记录的 `AI` 工具，并理解其中涉及危险。\n\n#### 利用各种培训技术\n*   **在线学习模块：**\
  \ 提供易于获取的网络化课程，用于入门理解和定期复习。\n*   **工作坊和研讨会：** 为了深入研究特定的 `AI` 应用或应对新挑战，请安排互动式工作坊或研讨会。\n\
  *   **休闲聚会：** 安排非正式聚会，让专业人士可以讨论 `AI` 相关话题并回答员工的问题，使他们能够在不担心报复的情况下表达使用 `AI` 的担忧和疑问。\n\
  *   **内部平台：** 需要一个用于知识交流的内部平台，提供一个让员工交换 `AI` 相关资源、最佳实践和经验的论坛。\n*   **持续反馈系统：** 获取员工反馈，以了解他们对培训的理解程度以及需要改进的地方。\n\
  \n#### 领导力与持续支持\n确保 `AI` 培训计划拥有强大的领导层支持，并强调其对公司成功的重要性。持续支持包括将 `AI` 最佳实践纳入绩效考核和日常工作流程中\
  \ (Cui et al., 2023)）。认可并表扬负责任使用 `AI` 的员工。如果员工不知道或不理解 `AI` 政策，那么他们的贡献是无效的 (Rice\
  \ et al., 2020, pp. 1–35)。\n\n鉴于此，应仔细考虑培训员工安全使用 `GenAI`，无论是作为一个独立项目还是作为常规网络安全培训的扩展\
  \ (Milmo, 2023)。培训中也应讨论使用 `AI` 的危险，重点关注数据安全和法律义务。\n\n#### 深度学习与 LLM\n深度学习算法被用于开发大型（在互联网海量文本数据集上训练）、语言（基于人类语言运行）和模型（用于进行预测）(Orton-Johnson\
  \ & Prior, 2013 。用户与 `ChatGPT` (`GPT`) 等 `LLMs` 交互以执行客户服务对话和内容创作等任务。这种多维度任务展示了 `LLMs`\
  \ 在文本和图像生成、摘要、比较和分析方面的能力 (Matsuo et al., 2022)。\n\n#### AI 的挑战与风险\n多维度任务展示了 `LLMs`\
  \ 在文本和图像生成、摘要、比较和分析方面的能力 (Matsuo et al., 2022)。\n\n\n\n\n\n\nK. Shanthi 与 Suganya\
  \ V.\n管理学院，SRM 科学技术大学，金奈，泰米尔纳德，印度\n\n### 摘要\n本研究基于功利主义伦理理论，通过分析人工智能（AI）驱动的优化、订单准时完成与零工人员福祉之间的复杂关系，探讨零工经济的伦理影响。研究目标是评估影响零工人员对\
  \ AI 信任及其心理健康的伦理 AI 实践。采用定性研究方法，通过开放式问卷和基于所提框架的演绎主题分析，考察零工工作中 AI 的伦理使用。总体而言，通过解决伦理考虑问题，人工智能驱动的外卖服务可以对零工人员的心理健康产生积极影响。\n\
  \n\n\n\n人工智能（AI）是一项模拟人类智能的技术，它彻底改变了人机技术的交互方式。它是第四次工业革命的核心，能够显著改变劳动力结构、组织设计、决策流程和知识管理。对人工智能的信任至关重要，尤其是在组织内部。科学家们正在以各种形式和水平探索人工智能（Glikson\
  \ & Woolley, 2020）。零工经济以临时合同和独立工作为特征，正受到由区块链、智能合约和人工智能等技术驱动的平台经济的变革。要在这种不断变化中取得成功，个人需要具备高水平的数字素养，以及与位于不同地区的虚拟团队进行高效工作的能力（Malik\
  \ et al., 2021）。零工经济平台为零工者创建了国际市场，让他们展示并变现自己的技能。这些数字工作场所将信息通信技术（ICTs）整合到全球信息基础设施中，包括\
  \ Facebook 小组、公共论坛、WhatsApp、PayPal、Amazon Pay 和导航应用。移动互联网和数字设备是参与其中的必不可要素，而算法和机器学习工具优化了零工工作的分配（Dedema\
  \ & Rosenbaum, 2024）。人工智能正被用于零工经济，以提高生产力、简化流程并改善用户体验。它协助任务分配、定价、路线优化、客户服务、欺诈检测、性能监控、维护预测和调度。人工智能驱动的聊天机器人管理客户查询、验证身份并提供个性化建议。然而，为了在零工经济中符合伦理地使用人工智能，还需要解决算法偏见、透明度和数据隐私等挑战（Lippert\
  \ et al., 2023）。美国商务部对零工经济企业提出了一种新的分类——“数字匹配服务”，这些服务能够实现直接交易、用户反馈评分系统、时长确定和工具供应。这些平台促进了个人与服务提供者之间的连接（Tran\
  \ & Sokas, 2017）。接下来的部分将介绍关于零工工作的文献综述。随后是方法论，采用了定性演绎主题分析。接下来是概念模型，然后是讨论部分，最后是研究的结论和理论意义。\n\
  \n## 2. 文献综述\n\n零工时长几分钟到几年不等，技术的作用和工作关系也会发生变化。某些学者将零工工作限制为通过数字平台进行的微任务（Caza et al.,\
  \ 2022）；在我们的研究中，我们选择了在 Swiggy 和 Zomato 担任送餐伙伴的外卖零工者，这些公司通过灵活的班次和休息时间提供了自主权。然而，算法控制可能导致过度工作、睡眠不足和疲劳。基于平台的评分和排名系统提高了劳动力过程监控和监督的效率。在线劳动平台促进了客户与大规模且不受监管的全球工人池之间的连接（Wood\
  \ et al., 2019）。关于远程零工经济的文献在工作质量结果方面缺乏清晰度。信息通信技术影响组织结构，议价能力影响工作安排和工人权力。社会和环境因素（如健康、教育、性别规范和人际关系）也会影响工作质量。零工经济使用算法管理（AM），将客户视为代理人以确保满意度和合规（Wood\
  \ et al., 2019）。在线外卖行业经历了受欢迎程度的显著增加。然而，它面临着各种挑战，包括工作条件不佳、缺乏适当监管和工作不稳定，所有这些对零工者的福祉和安全都产生了不利影响。在线配送模式在可持续性方面的可行性尚不确定，因为它可能不符合可持续发展目标，该目标优先考虑公平就业和健康成果（Quy\
  \ Nguyen-Phuoc et al., 2023）。目前缺乏关于使用人工智能管理零工工作的伦理后果的研究，需要一个概念模型来分析这些因素如何影响福祉。为了填补文献中的这一空白，本研究的研究问题如下：\n\
  \n*符合伦理的人工智能实践如何影响零工者对人工智能的信任，并影响他们的福祉？*\n\n在零工经济中伦理化实施人工智能的综合框架包含了多种组件，例如生态韧性、伦理考量、数据隐私、算法公平性和就业实践。在外卖工作中实施人工智能的伦理考量背景下，在考虑平台生态系统时，必须对组织和社区韧性采取全面的视角视角（Floetgen\
  \ et al., 2021）。因此，我们评估了利益相关者并实施了整体方法。它涵盖了问责制、透明度、公平性和有效解决投诉等原则。为了保护数据隐私，必须获得明确同意、实施严格的安全协议并限制数据收集的范围。为了实现算法公平，有必要实施减少偏见的策略，并遵守公平和包容的原则。就业实践涵盖了多种元素，如工作稳定性、公平薪酬、员工福利和职业发展倡议（Tan\
  \ et al., 2021），由数字工作场所的职业咨询。生态韧性的概念被共同定义为促进可持续实践、优化资源利用以及支持抵消排放和促进可再生能源使用的倡议。\n\
  \n\n\n\n\n定性研究通过多利益相关者方法（Smets et al., 2022）来收集研究人员、公众、客户和零工工者的反馈。研究通过目的性抽样向 32\
  \ 名参与者分发了一份开放式问卷。调查的开放式格式允许受访者选择对他们具有意义的话题（Geer, 1991）。为了保持保密性，研究未询问参与者有关其身份或其他其他人口统计信息的问题，并向他们保证收集的数据仅用于研究目的。作者提出的构念和概念框架是问题的基础，这些问题是根据现有文献制定的。研究采用了演绎法主题分析（Blum\
  \ et al., 2020）来根据框架对参与者的回答进行分析。研究拟提框架中的构念与参与者的回答相匹配。一旦数据达到饱和，便停止数据收集（Boddy, 2016）。针对框架的每个构念，提供了与主题一致的回答并以引用的的形式给出。本研究利用这些回答和文献提出了七项论点。\n\
  \n## 4. 零工经济中人工智能伦理应用的概念模型\n\n通过解决数据隐私、算法公平性、最佳就业实践和生态韧性等因素，作者开发了这一概念框架（参见图 5.1），用以增强零工工者的心理健康状况。\n\
  \n\n图 5.1. 概念框架。*来源：* 作者概念化构建。\n\n\n在本节中，我们根据现有的文献提出了七项命题，并通过来自各种利益相关者的反馈得到了进一步证实。参与者提供的回答（包括外卖行业中的各种利益相关者，如零工工者、客户、公众和研究人员）以引号的形式列出，并针对每个构念进行了分类。\n\
  \n\n零工工作平台的数字化性质往往导致零工经济中对隐私的忽视。工人用于监控目的的个人设备可能会导致个人领域与工作领域之间的模糊性，从而增加了不当监控和潜在侵犯个人边界的概率（Sannon\
  \ et al., 2022）。一位 Zomato 送餐合提到提到，她并不熟悉数据隐私的概念，但表达了对使用该技术的恐惧。一位从未用过该外卖服务但对该概念非常了解且观察敏锐的受访者表达了公众的意见：“零工经济公司应该实施稳健的数据安全措施来保护用户和工人的敏感信息。他们还应该确保用户收到清晰的隐私政策。”零工经济中的工人面临着来自平台公司和客户的隐私风险。平台进行全面的监控并存储有关工人的数据，实现了算法管理（AM）。员工经常在获取数据或抵制绩效监控方面面临挑战，这导致了对数据保护权和对公司监控行为监督的需求。此外，平台便利了客户对工人的监控，导致了信息不平衡。一位在线外卖服务的客户解释了他对数据隐私的看法，如下：\n\
  \n> 大多数零工经济公司已经有效地解决了影响各种利益相关者的安全忧虑。对于像 Swiggy 和 Zomato 这样的零工平台，我记得的一个问题是曾经对餐厅/送餐伙伴/客户可见的联系信息。零工平台通过对拨电号码进行掩蔽和路由解决了这个问题。此外，我们应该利用关于客户、送餐伙伴和餐厅的特定数据进行有效的针对性营销，从而促进有效的工作实践。以“数据安全”为名挂起所有数据会导致流程中的所有利益相关者陷入“全军没”的局面，使体验变得不顺畅。我完全支持为了便利而放弃隐私和安全，因为仅仅在线这一行为就会让我们暴露在隐私威胁之下。\n\
  \n在零工经济中，客户处于管理地位，他们的评分可能会影响工人获得就业的能力。先进技术（包括地理围栏、人脸识别和远程测控）可以用于将客户监控与平台监控相结合（Sannon\
  \ et al., 2022）。一位研究人员分享了他对零工经济数据隐私的观点：\n\n> 零工经济公司应该实施稳健的数据加密、严格的访问控制和定期的安全审计来保护用户和工人的数据。他们还应该采用透明的数据隐私政策，并对数据用途进行清晰沟通。此外，个人信息的保护需要因素认证和持续更新。\n\
  \n在客户进行监控的情况下，如果实施了数据隐私措施，工人可能会对人工智能增加信任。因此，提出如下：\n\n*命题 1。零工平台采用强大的数据隐私措施将对零工工人人工智能的信任产生积极影响。*\n\
  \n### 5.2 外卖服务中的算法公平性\n\n通过平台评分和声誉系统实施的“AM”概念被确定为零工经济中极具影响力的数字控制方法（Wood et al.,\
  \ 2019）。AM 是一种新兴且研究不足的管理策略，它在人工智能解决方案中整合了算法控制和算法匹配。算法控制确保工人行为符合组织目标，而算法匹配促进了供需双方的互动。组织利用自学习算法机制来高效实现其目标。算法系统中\
  \ ICT 的具有四个基本特征：算法全面性、算法即时性、交互性和不透明性。算法控制机制监控人的行为和位置，并评估或激励其生产力。任务或客户根据这些结果分配给工人。即使面对算法控制，零工工人也应对对工作的感知自主，以培养对人工智能的信任。\n\
  \n*命题 2。确保零工平台的算法公平性将提高工人对人工智能的信任水平。*\n\n一位在 Zomato 工作的送餐伙伴分享了对算法控制的经历：“有时长时间没有订单，而且如果奖励很高，订单收入会大幅减少。”一位客户分享了他的观点：\n\
  \n算法是用户行为的镜子——就像你的 YouTube 算法会根据你的口味为你推送内容一样，算法是为个人量身定制的。这不应被误解为缺乏“公平性”，因为这些动态最终是为了迎合用户。\n\
  \n\n\n\n然而，大量的外卖平台零工工作者教育背景有限，这阻碍了他们的理解能力，并导致他们将问题完全归咎于算法。这些工人必须接受有关算法公平性的适当培训以解决他们的问题。一位研究人员分享了对零工经济中算法管理偏差的怀疑：\n\
  \n零工经济公司使用的算法可能会表现出偏差，特别是当它们在有偏的数据集上进行训练时。例如，它们可能会在无意中偏向某些群体而非其他群体，导致工作机会分配不均或薪资差异。偏差可能源于地理位置、用户评分甚至分配的任务类型等因素，可能会加剧现有的社会不平等。\n\
  \n感知控制是个体认为他们可以影响其内部状态、行为和外部环境的信念 (Pagnini et al., 2016)。根据 Infurna et al. (2011)，拥有控制感可以减少经历负面健康影响的机会。相信自己有更多控制权的人更有可能通过采取预防措施和体育活动来照顾健康。感知控制是一种心理建构，反映了个体对自己施加影响和调节自身生活能力的信念。它包括许多元素，如拥有内部控制点（相信自己的行动决定结果）、自我效能（对自己能力的自信）、胜任感（感到胜任且熟练）以及个人自主性（拥有选择和决策的自由）。强烈的控制感意味着个体坚信自己有能力对特定情况的结果施加影响。这些个体积极利用应对策略来有效管理压力情境，从而保护自己免受压力并增加获得积极结果的机会\
  \ (Jung et al., 2023)。增强员工控制权将对他们的感知控制产生积极影响，反过来将正向影响工作满意度等结果，并减少身体和情感痛苦以及角色压力 (Spector,\
  \ 1996)。如果个人想要去度假，他们可以随时通知其他人并留在所在地。这完全没有问题。他们能够自主工作，无需任何人类主管中断他们的工作。零工工作中的感知控制是指个体对劳务平台控制的信息的理解和解释。个体的投入、行动和工作认可可能会受到其个人价值判断的影响，而这种判断反过来又受到这种解释的影响\
  \ (Lang et al., 2023)。\n\n算法管理（AM）对于监督各种工人至关重要，例如 UPS 递送人员、酒店客洁员、零售店人员、记者和医生。远程办公的兴起使白领和管理层员工容易受到自动化监控的威胁。以\
  \ Uber 为例，它雇佣了 26,900 名员工，并监管着全球 390 万名司机的网络。非零工工作环境中的算法管理面临不同程度的认可，但其在增强协作和优化工作流程方面的通常得到认可。算法和管理缺乏透明度、对行为的持续监控以及缺乏支持等因素可能导致零工工作者感到沮丧、精疲和高流失率\
  \ (Zhang et al., 2022)。这些挑战可以通过实施有效的算法管理，并与主要的利益相关者公开分享有关实施的知识来缓解。\n\n\n外卖服务行业的就业实践与传统工作角色有显著不同。零工工作者拥有自主性、灵活性和财务激励。然而，赋予零工工作者的自主性和个人选择产生了复杂的工作身份，因为他们经常从事涉及混合角色的各种工作。市场对这些选择的反应对工人的自我、身份和财务具有影响。零工工作者面临着平衡不同工作身份以及应对缺乏明确工作身份的挑战。这可能是特别困难，因为零工工作者往往必须同时管理多份工作\
  \ (Ashford et al., 2018)。\n\n零工工作对工人自主性和适应性的影响并非固有的，而是由社会经济状况和技术平台塑造的政治建构。虽然某些员工欣赏这些优势，但其他人由于其立场而面临严酷的工作条件\
  \ (Anwar & Graham, 2021)。工作相关的压力因素，如角色冲突、不确定性和过量工作，会在很大程度上导致工作与家庭冲突（WFC）的发生。这些压力源可能会延伸到个体的家庭生活中，给从工作相关担忧中抽离带来挑战。研究表明，角色过载、冲突和模糊程度的升高与\
  \ WFC 的增加有关。当员工背负工作相关责任的负担时，他们可能需要帮助才能充分投入与家人的互动、参与家庭活动或履行照顾职责。职场中的角色冲突会极大影响员工的\
  \ WFC。WFC 与员工心理痛苦之间的相关性在不同行业部门已得到充分检查。长期接触 WFC 可能会导致职业倦怠、情感疲劳、认知疲劳、人格化和个人成就感下降。由于兼顾工作和家庭义务而经历的慢性压力会导致不知所措、焦虑和紧张感，这可能导致心理痛苦\
  \ (Abdou et al., 2024)。\n\n零工工作者坚信他们拥有高程度的工作灵活性。工作灵活性包括时间灵活性，以及员工选择其工作地点和方法的自由程度。这些选择可以显著影响各种工作和生活相关的因素，如工作与家庭平衡和情感耗竭\
  \ (Ma, 2018)。因此，多个角色身份的存在和过量的工作要求可能会导致 WFC，最终导致心理痛苦。然而，值得注意的是，工作灵活性在这方面可以提供某种程度。实施旨在增强个人福祉的额外就业策略可能会对算法的信任。\n\
  \n*P3. 零工平台实施优化就业策略将支持零工工作者对算法的信任。*\n\n然而，零工工作者对目前的就业福利并不满意，正如他们的回答所示：“他们提供医疗保险；但是，对于如何使用或理赔缺乏透明度。”此外，在降水期间，他们提供价格低廉的雨衣。此外，她表示：“女性每月享有两天带薪休息日。但是，必须满足特定的工作条件才能获得。”一位是客户的受访者认为：\n\
  \n\n\n\n\n零工者的工作条件并不符合体面工作（DW）的标准。作为独立承包工工作的人并不需要为那些能够支持其工作条件的公司工作。几个针对零工的工会已经提出了公平工作条件的问题。然而，我不认为这会对零工者有所帮助。专注于零工经济的公司仍然非常新颖，因此我认为我们应该将其视为企业社会责任（CSR）和体面工作（DW）的问题来处理，而不是使用“大棒”来惩罚这些新的经济来源。\n\
  \n其中一位身份为研究人员的受访者表达了他的观点：\n\n零工经常遇到艰苦的劳动条件，例如收入不可预测、工作安全感不足以及劳动保护不足。零工经常被要求延长工作时间，却无法获得传统员工享有的福利和保护，这可能导致财务不稳定和压力。零工应该有权享受带薪假和医疗保险等福利。鉴于零工工作的不稳定性，这些福利对于他们的健康至关重要，并可以作为促进其财务稳定和健康的安全网。零工通常经历的低工作安全感和稳定性会对他们的长期财务规划和整体生活质量产生负面影响。零工工作的按需性质经常导致就业机会不一致，这增加了劳动者建立稳定收入的难度。\n\
  \n然而，感知到的工作灵活性对个人、家庭和业务结果有积极影响。理想的工作周让员工能够有效管理他们的工作与生活平衡，从而对他们的福祉和家庭动态产生有利。此外，能够调整工作时间和地点的员工可以长时间工作而不会面临困难，这凸显了灵活性在实现工作与家庭责任之间取得平衡的重要意义（Hill\
  \ et al., 2001）。低技能劳动工人正受到就业格局变化的影响，因为他们在获得足够收入和工作稳定性方面面临着挑战。零工经济灵活性增加导致权力失衡加剧，从而加高了易受剥削的脆弱性。那些倾向于全职工作但被迫从事多份兼职工作的经济弱势群体，正逐渐变得越来越脆弱。零工经济进一步加剧了歧视和经济不平等，由于替代方案有限，劳动工人频繁诉诸于不稳定的工作安排（Spreitzer\
  \ et al., 2017）。劳动力市场在不断演变，员工的角色至关重要。工作的灵活性提供了职业生活与个人生活的和谐融合，从而带来了工作满意度和最佳表现。数字技术的兴起和非常规职位的出现导致非标准化就业形式的增加，这可能会影响就业质量（Davidescu\
  \ et al., 2020）。这种情况应被政策制定者视为紧急情况，因为它会影响他们的福祉。\n\n## 5.4 外送服务中的生态韧性\n\n传统的业务模式优先考虑股东价值，而可持续管理则关注环境和社会影响。可持续性主义主义通过识别机会、减轻风险、建立信任来产生长期价值。线性经济模式正在被循环或零工经济模式取代，采用工业\
  \ 4.0 和 10R 原则。可持续管理的目标是利用更少的资源实现更大的功能、开启新市场并执行社会公益规定。人工智能可以通过优化资源利用、减少浪费和促进整个生命周期的可持续实践来增强生态韧性。它可以识别效率问题、改进回收流程、设计可持续产品并促进向循环经济的转型。人工智能还可以监测环境状况并做出决策（Lavinia,\
  \ 2023）。\n\nP4. 通过实施可持续实践展现生态韧性的平台将对工人对人工智能的信任产生积极影响。\n\n然而，公众对于零工工作的环境可持续性存在非常分歧观点。“公司应该追求在不损害零工工作核心价值主张的情况下促进可持续性的创新解决方案。”此外，一位身份为客户的受访者赞同他无法承担额外成本：\n\
  \n我完全致力于可持续实践；但我不可能以更长的等待时间和增加成本为代价来支持所谓的“可持续实践”。我在线下单是为了节省时间，否则这些时间本该用于：(a) 往餐厅；b)\
  \ 在结账台排队（观察坐在那里的人）；(c) 等待订单准备好并交付，直到酒店员工拿走并给我提供食物。当我无法分配需要的时间完成所有这些任务时，我通常会在线下单。如果在线下单会导致耗时的过程，那么它就是徒劳的。我可能在费用增加方面放弃一些金钱，只要声称要实施的可持续实践是真实的，而不是一种“洗绿”。换句话说，如果零工平台无法为产生实际影响的可持续实践提供详细理由，我不接受涨价的想法。\n\
  \n然而，另一位身份为研究人员的受访者准备支持环保实践。\n\n我会支持整合了可持续实践的零工经济平台，无论这是否增加费用或延长等待时间。地球的长期健康取决于可持续性，支持环保实践是一项负责任的决定。它也可以作为其他机构实施类似政策的激励，从而促进更全面的环境影响。\n\
  \n\n\n\n\nAI 通过优化运营、减少浪费和推广可持续实践，具有极大增强外卖行业生态韧性的潜力。AI 可以实时分析交通模式、天气状况和配送位置，以优化路线、减少燃料消耗和排放，并确保更短的配送时间。此外，它可以通过分析历史数据、季节性模式和时发事件预测需求，从而最大限度地减少过度生产和食物浪费。AI\
  \ 可以通过准确预测所需的食材理想数量来增强库存管理，从而最大限度地减少腐烂和浪费。该系统可以通过分析客户偏好和供应链数据，建议环保包装选择。AI 可以通过有效控制供暖、冷却和照明系统来提高运营效率。此外，它还可以通过向配送员分配配送任务、提供环保配送选择、采用灵活定价策略、分析客户反馈以改进服务，以及对可持续性措施进行实时监控和报告，减少闲置时间。实施过程包括几个关键步骤，如数据收集与整合、AI\
  \ 模型的开发与训练、AI 解决方案的、性能监控与调整以及利益相关者的教育。\n\n## 5.5 对 AI 的信任\n\n在利用技术时，信任是一个本质且基础的概念，特别是在\
  \ AI 领域。脆弱性是指愿意让自己暴露在另一方的行为面前，无论个人是否有观察或监管该方的能力。由于 AI 行为具有复杂性和不可预测的本质，与其相关的感知风险使得信任在人机交互关系中起着至关重要的作用。AI\
  \ 被广泛认为正在逐渐取代各种人类职业，并从根本上重塑组织架构。与知识工作者和高层管理人员相比，低技能和低成本员工对 AI 驱动的取代的敏感性尚不确定。尽管 AI\
  \ 能够执行某些人类任务，但目前尚没有哪项职业的**每一项任务都能完全被 AI 取代**。信任是一个流动的概念，会受到被信任的个人或实体行为的影响（Glikson\
  \ & Woolley, 2020）。机器学习模型的复杂性使得信任成为用户与 AI 交互中的关键要素。对可解释 AI（XAI）日益增长的兴趣源于维护用户信心的必要性。当开发\
  \ AI 的目标是获得用户信任时，它可以安全地整合到社会中（Glikson & Woolley, 2020）。技术接受模型（TAM）是一个阐明不同人群技术采纳行为的概念框架。该研究最初提出，感知有用性和易用性是决定个人未来使用某产品或服务的意愿的因素。随后的研究整合了外部变量，例如信任，信任在新兴技术的采用中起着至关重要的作用。信任是通过特征、意图和行为的结合形成的，促进了个人或群体之间的相互依赖和相互联系。TAM\
  \ 扩展了 Choung et al. (2022) 所讨论的关于组织信任和技术信任的现有研究。我们研究的目标是考察信任在 AI 中作为中介的作用，以及 AI\
  \ 在外卖平台零工经济者（gig workers）心理健康方面的伦理应用。这是因为对 AI 的信任可能会导致零工工作更积极的 AI 伦理实施。\n\nP5. 对\
  \ AI 信任的增强将使零工经济者对 AI 的伦理实施产生更积极的看法。\n\n## 5.6 外卖服务中的伦理方法\n\n开展业务的伦理框架基于权利、公正、公共利益、美德和功利主义等原则。权利的核心在于将个人视为自主个体的原则，而公正则涉及对所有人的公平对待。公共利益的概念围绕社会福利展开，特别是对于那些自我照顾能力较弱的个人。美德优先考虑诚实和道德正直等普遍原则。功利主义是一种道德理论，它优先考虑结果的最大化收益和最小化负面影响。在企业环境中，它为评估伦理选择提供了一种方便的方法，但可能会减少其他利益相关者的关注并忽视无形成本（Arogyaswamy,\
  \ 2020）。数字技术（如 AI）由于其独立决策的能力而被经常认为难以理解。反对者认为，对结果负责已不可行，而自动化决策会产生更公平、公正的结果。然而，这些技术的驱动力主要并非关注设计，而是关注企业的影响。研究人员设计了评估和记录伦理考量的技术，表明引入\
  \ AI 是一种深意决策（D'Cruz et al., 2022）。\n\nP6. AI 在零工平台中的伦理实施将积极影响零工经济者的心理健康。\n\n## 5.7\
  \ 零工经济者的心理健康\n职场福祉已扩展到管理科学和组织行为，关注员工福祉。它包括工作满意度、倦怠和情感耗竭等心理和生理状态。然而，有些人认为它没有考虑到工作的情感方面。尽管面临零工经济和移动互联网使用的挑战，维持职场福祉对于个人和职业成长至关重要。根据\
  \ Wu and Zhou (2023)，通过承认个人价值和增加工作自主性可以改善福祉。\n\n\n\n\n\n\n*P7. 对 AI 的信任以及 AI 的伦理使用、数据隐私、算法公平、最佳就业实践和生态韧性将改善零工经济者的心理福祉。*\n\
  \n\n## 6. 结论\n\n在零工经济中伦理地使用 AI 是复杂的。这项任务包括数据隐私、算法公平、最佳就业实践和生态韧性。数据隐私有助于零工经济者感到安全和受尊重，鼓励他们使用\
  \ AI 驱动的平台。无论背景或人口统计特征如何，算法公平都能消除偏见并平等对待所有工人。零工者的权利和福利取决于公平的报、可管理的工作安排以及资源和福利。生态韧性对零工经济至关重要。通过\
  \ AI 推广绿色实践，零工平台可以为社会目标做出贡献。这种方法建立了员工的信任和目标感。AI 的伦理使用和信任将预测变量与结果变量连接起来。透明、公平且负责的工人权利和福利实践建立了对\
  \ AI 的信任。该框架旨在提高零工经济者的心理福祉。通过优先考虑伦理 AI 实践并通过透明、公平和尊重建立信任，零工者可以提高工作满意度并克服压力。这种整体方法改善了个人和集体的零工经济成果。\n\
  \n## 7. 理论意义\n\n我们研究的概念框架解释了伦理 AI 实践如何影响零工经济者的心理福祉。数据隐私、算法公平、最佳就业实践和生态韧性是预测变量。该框架强调对\
  \ AI 的信任及其伦理使用作为中介变量，强调透明且负责任的 AI 实践。生态韧性也被纳入伦理 AI 话语，以考虑 AI 驱动平台的环境影响。心理福祉是框架中的关键结果变量，将焦点从经济或运营指标转向\
  \ AI 在零工经济中以人为本的影响。该框架帮助政策制定者和行业领袖实施伦理 AI 策略。关注 AI 中介推进了技术采用中的信任理论。该框架允许对伦理 AI 实践对零工者的影响进行实证验证和研究设计。这些贡献帮助我们理解零工外卖以及其他低技能按需实体服务中\
  \ AI 与人类因素之间复杂的相互作用。\n\n### 参考文献\n\nAbdou, A. H., El-Amin, M. A. M. M., Mohammed,\
