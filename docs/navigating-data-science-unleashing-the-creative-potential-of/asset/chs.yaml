  \ | 提供实时交通更新、调整交通灯定时并建议路线以优化流量。 |\n\n### 3.3 边缘计算\n\n边缘计算与 AI 的融合是解决传统以云为中心的方法问题的强大组合，现在被称为边缘\
  \ AI（Edge AI）。边缘计算对于以更低的成本提供卓越性能来促进 AI 应用至关重要。边缘计算解决了 AI 驱动的应用程序由于其信息和计算密集型本质所面临的技术挑战。这导致了优化、更快的响应时间以及增强的运行效率。\n\
  \n边缘 AI 的大数据需求在 Table 8.3 中规定。边缘 AI 的另一个应用是预测性维护，其中可以通过数据处理来预测任何重大故障或风险。边缘计算通过利用本地处理能力、数据分析能力和接近终端用户的设备，实现了高性能的业务服务。工业自动化流程、城市规划、个性化医疗保健和自动驾驶车辆只是可以从\
