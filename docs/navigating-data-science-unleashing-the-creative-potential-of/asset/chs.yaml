  \ 1 章\n\n## 数据科学与人工智能：探索医疗保健领域的协作潜力\n\nKumar Shalender^a, Babita Singla^a 和 Nripendra\
  \ Singh^b\n\n^a 印度旁遮普邦，奇特卡拉大学，奇特卡拉商学院\n\n^b 美国，宾夕法尼亚州大学\n\n### 摘要\n\n本章探索了数据科学和人工智能（AI）在医疗保健领域改变游戏规则的潜力，专门研究了用例，旨在为行业在更高水平上实施该技术制定实践指南。通过分析医疗保健行业中数据科学和人工智能的用例，本章识别了这些技术的结合使用为利益相关者带来卓越效益的关键领域。这些案例随后成为开发实践指南的基础，医疗保健行业可以采用这些指南来采纳、整合并加强在业务性能相关领域对技术的使用。本章最后指出，要在医疗保健领域长期采用数据科学和人工智能，需要采取整体方法。该研究还强调了行业与决策者之间的紧密合作，以确保技术的持续应用。\n\
  \n**关键词**：人工智能（AI）；协作；数据科学；医疗保健部门；决策者\n\n## 1. 引言\n\n数据科学和人工智能（AI）的变革性潜力刚刚刚刚在学术界和企业领域开始被提及。技术正在使企业对其产品进行根本性改变，并帮助他们向目标市场交付卓越价值。从汽车行业到快消品（FMCG）行业、消费耐用品行业到出口行业，数据科学和人工智能的使用为增长开辟了新途径。在此背景下，本章探索了数据科学和人工智能对医疗保健行业的变革性潜力。医疗保健部门不仅在对经济的贡献方面非常重要，在确保大众能以负担得起的价格获得高质量服务方面同样重要。技术在保证提供高质量医疗服务方面的作用是不言而喻的。数据科学和人工智能具有人工智能具有巨大潜力，通过将技术整合到职能部门和运营机制中，该部门可以利用技术实现增长和盈利的新高度。医疗保健领域生成式智能的应用范围之大，使得各垂直行业的企业现在正投资数据科学和人工智能，以开发专门与医疗管理相关的产品（Aggarwal\
  \ et al., 2020）。本章由以下章节组成：讨论了与医疗保健部门相关的数据科学和人工智能的用例，随后开发了可以帮助行业持有者在医疗实践中使用该技术的概念框架。在框架开发之后是结论与讨论，同时作者们还详细阐述了与医疗保健行业中使用数据科学和人工智能相关的重要启示。该研究对医疗生态系统中的所有利益相关者具有重要意义，通过关注与行业价值链相关的特定收益，本章将为未来的研究奠定基调（Bisam,\
  \ 2024）。\n\n## 2. 医疗保健中的数据科学与人工智能：用例\n\n### 2.1 患者筛选\n\n\n\n\n\n数据科学与人工智能越来越多地应用于医院的患者筛查。这项技术已被证明非常成功，并在减轻从业人员负担方面发挥了重要作用，使他们能够策略地投入时间到患者护理中。在生成式人工智能的帮助下，可以快速分析与患者记录相关的各种图像，并相应地将数据转发给医生进行进一步的分析和治疗程序（Bughin\
  \ et al., 2017）。初步流程的快速完成至关重要，因为它可以帮助医生和医疗机构在不产生任何不延迟的情况下提供患者护理服务。同样重要的是，技术的引入也使过程变得更具成本效益，这意味着为所有人提供负担得起的医疗服务的愿景可以快速且高效地实现。\n\
  \n在患者筛查中使用项技术的另一个显著益处是处理速度快，因为与人类不同，技术不需要任何形式的休息或中断。这意味着患者可以接受技术的持续筛查，并相应地为医生提供分析以采取补救措施。有许多可以集成数据科学与人工智能的设备，可以在诊断方面取得满意的结果。在数据科学和人工智能的情况下，发生错误的概率也相当低，通过确保向机器输入正确的数据，可以从技术中获得最佳结果（Dhiman\
  \ et al., 2018）。越来越多的医院现在正投资数据科学和人工智能，以开发出正确的诊断技术和机制，见证技术成为患者诊断和治疗程序相关运营手段只是时间问题。通过同时提高诊断程序的效率和有效性，数据科学与人工智能的使用在推进全球负担得起的医疗概念方面也起着关键作用。特别是对于发展中和欠发达的经济体，技术在提供良好医疗服务方面的作用至关重要。这些国家需要对医疗基础设施进行适当投资，通过使用技术，还可以有效解决与医疗管理实践、医疗服务及相关问题的成本效益问题。政策制定者在鼓励医疗行业使用技术方面的作用也变得非常重要。通过促进该领域的新投资并鼓励生态系统中的技术开发人员、创业者和相关参与者，医疗行业可以取得新的进展（Dorn,\
  \ 2024）。\n\n## 2.2 疫苗发现\n\n在疫苗正式进入市场之前，需要大量的迭代。这些试验非常昂贵，通过利用生成式人工智能，制药公司和研究人员可以节省大量的资金和资源。这项技术为他们提供了以一种成本效益且高效的方式进行这些迭代的机会。数据科学和人工智能提供的有见解信息对试验也有帮助，通过关联不同类型疫苗试验的结果，该技术可以帮助进一步降低成本因素。该行业已经开始在疫苗发现过程中使用数据科学和人工智能，在不同类型的程序中使用技术时，与药物发现相关的总时间和成本将比以前更短（Floreano\
  \ & Wood, 2015）。\n\n数据科学与人工智能的机器学习方面在疫苗发现阶段非常有帮助，训练机器识别疫苗试验的理想候选者，并随后关联试验如何带来积极变化的结果，对于疫苗发现过程来说非常重要且具有意义。这项技术在管理新疫苗的影响、数据以及分析其影响方面也非常有用，数据科学和人工智能也可以广泛用于未来与重要疫苗发现相关的数据管理。与数据清洗以及生成有关新疫苗对健康可能影响的各种查询的过程也可以在生成式人工智能的帮助下得到保留。特别是当涉及各种生物医学过程的解码过程时，数据科学和人工智能的可用性至关重要。事实上，数据科学和人工智能在发现新药和疫苗方面的效用是全面且涵盖性的。从识别与目标疾病相关的分子到找到试验下给药的正确候选人，再到跟踪结果以实现未来多年保存信息的目的，所有这些都可以在生成式人工智能的帮助下高效地完成。在药物和疫苗发现中使用技术的主要益处是降低了成本，因为许多研究报告预测，当时数据科学和人工智能的使用可以将成本降低到研发新疫苗所需总投资额的十分分之一（Fox,\
  \ 2024）。\n\n## 2.3 自动化管理流程\n\n\n\n\n\n与其他行业相比，医疗保健领域数据科学和人工智能实现的自动化对于改善患者的整体交付体验至关重要。处理将患者转诊给医生的需求速度可能变得非常关键，甚至决定整个治疗过程的命运。这也有道理，因为医疗保健管理服务的重点必须放在提供卓越的患者护理，而不是专注于完成文件、管理账单以及与医疗保健行业相关的其他方面。通过提高行政流程的效率，数据科学和人工智能在增强患者整体诊断和治疗流程方面发挥着至关重要的作用\
  \ (Ghosh, 2024)）。自动化流程还涉及收集患者的数据和信息，通过将其与对其当前状况的分析相结合，可以为特定患者建立一份完整的记录以供参考。医疗保健生态系统中参与的利益相关者之间共享报告，将导致一个动态且充满活力的医疗保健部门的诞生。满足流程和治疗程序的需求也为了将关键的人力资源转移到医疗系统的其他重要参数上\
  \ (Hurley & Adebayo, 2017)。医院的人力利用必须以谨慎的方式进行，通过最少的人工干预实现医疗功能和系统的自动化，可以显著提高系统的效率。数据收集、分析和处理的自动化是生成式人工智能的另一大显著优势。特别是该技术外推数据以预测未来业务场景的能力非常值得赞赞。如今世界医疗生态系统所经历的人力短缺非常严峻。根据医疗生态系统领域领先权威的估计，大约需要\
  \ 3000 万人来担任医院、诊所和医务室的管理职位，以便为目标人群提供满意的医疗服务。随着人口预计将增长并到 2050 年底达到 90 亿，这一数字在未来几年将增加。为了向全球范围内的这些人提供高质量且负担得起的医疗服务，技术采用是医疗保健生态系统中所有参与者关注的首要条件和主要标准\
  \ (Kopalle et al., 2020)。数据科学和人工智能的使用还可用于监管机构和客户所需的各种声明，并填写与患者医疗状况相关的患者记录。除了数据科学和人工智能在记录数字化方面具有巨大的效用外，这些记录还可被行业从业者和监管机构用于许多用途。\n\
  \n## 2.4 远程操作\n\n得益于其为患者提供远程协助的能力，数据科学和人工智能的使用日益受到利益相关者的青睐。这种用途对于那些发现难以前往医院向医疗专业人员处就诊的老年人来说具有特别意义。此外，那些遭受急性疾病、导致他们几乎处于静止状态的人，也可以利用该技术从医生和医师那里获得远程协助。在数据科学、人工智能和\
  \ `IoT` 的帮助下，获得高质量医疗服务的梦想正在迅速成为现实 (Olsen, 2024)。这种远程获得协助 get 也被证明对发展中和欠发达经济体是有益的。这些国家的小镇和村庄没有高质量的医疗服务，通过使用远程医疗应用等先进技术，患者有机会接受世界上顶尖医生的治疗。这也为从业人员节省了时间，让他们能够在无需亲自上门的情况下为大量人员提供治疗服务。通过将人工智能的生成性方面与自然语言处理\
  \ (`NLP`) 模型相结合，可以在为目标患者提供高质量医疗服务方面取得理想的进展。这些远程医疗应用的主要优势是全天候的可用性，这对患者来说是一个巨大的优势\
  \ (Pal & Shalender, 2021)。远程协助最好的点在于，不仅是医生或医师提供医疗服务，医学界相关的人员也能向患者提供这些服务。护士、初级医生和护工可以使用远程医疗服务为全球患者提供协助。虚拟护士的概念在全球范围内迅速流行，这也是生成式人工智能的自然延伸。数据科学家在使流程更高效、有效方面的关键作用在全球范围内得到了认可。数据科学已被证明是带来医疗保健领域\
  \ AI 革命的性工具，通过提供相关数据的收集、分析和评估，医疗保健部门在以成本效益且负担得起的方式治疗患者方面变得越来越有效。这里的意义在于将数据科学与数据科学和人工智能相结合，因为这种组合具有改变全球医疗保健部门面貌的变革能力\
  \ (Pelley, 2024)。在数据科学和人工智能技术的帮助下，旅行和亲自带患者进行治疗过程相关的费用也可以显著减少。另一个需要注意的重要点是，所有这些革命都是高速互联网的可用催化的，通过确保全球连接可用，政策制定者可以确保医疗保健部门继续从数据科学和人工智能的结合能力中受益。\n\
  \n## 3. 整体框架的发展\n\n### 3.1 制定愿景\n\n\n\n\n\n为了引导组织通过数据科学和人工智能的采用过程，医疗保健生态系统必须对他们的发展的方向有一个共同愿景（参考图\
  \ 1.1）。这一愿景是使技术采用过程成功的首要要求之一。将技术采用与公司的长期盈利能力相结合也至关重要，这样每个人都能意识到在不断变化的业务环境中成为一名“协作者”（coriander）的重要性。组织通常会忽视特定的技术愿景，但考虑到新时代创新为组织提供可持续性和竞争优势的重要性，这种发展是必不可行的（Shalender\
  \ & Yadav, 2018, 2019）。高层在这一发展过程中必须听业务和职能部门人员的意见；这些人将直接负责公司数据科学和人工智能策略的实施。如果整个医疗保健生态系统都能对技术采用制定一个共同愿景，并通过分担进行这种数字化转型所需的资源，医疗保健领域的组织可以在过程中节省大量资金。因此，医疗保健公司必须关注技术愿景的发展，并将其与组织的整体目标、目的和价值观对齐。\n\
  \n## 3.2 从小做起\n\n第一个建议是以渐进的方式采用这些技术，而不是改变整个系统并用技术部分替换，最好以实施的方式开始使用数据科学和人工智能（Shalender\
  \ & Sharma, 2022）。这不仅可以节省与技术采用相关的成本，还将帮助组织应对因大规模采用技术而可能产生的阻力。特别是对于医疗保健机构中运行很长时间遗留系统，将所有这些系统替换为数据驱动的决策可能对采用过程产生不利。高层必须让每位员工对数据科学的采用前景充满信心，以便尽可能地减少与此采用过程相关的阻力。\n\
  \n\n图 1.1. 实践指南。*来源：* 作者概念化。\n\n这种方法将有助于赢得那些可能不喜欢一次性全面变革过程股东的信任（Shalender, 2018）。由于转型和技术采用所需的资源必须经过组织股东的批准，股东的积极态度是决定过程成功的先决条件。如果高层能够传达他们关于采用数据科学及其回报的想法，并将备忘录发给所有员工，这样他们就能对组织的数字化战略有一个清晰的认识（Shalender\
  \ et al., 2024）。这种清晰度将有助于数据科学和人工智能的采用以满意的方式完成。\n\n## 3.3 培训员工\n\n这是最被忽视的问题之一，在医疗保健部门采用数据科学和人工智能方面，必须优先解决这个问题。通过对员工进行培训和发展，组织可以让他们准备好高效地使用技术（Singla\
  \ & Shalender, 2024）。这也是减少对技术采用反对的一种可靠方法，因为经过告知和培训的员工比其他人更有可能在没有任何任何抑制的情况下接受该技术。当然，投资于培训和发展取决于资源，而且如果医疗保健部门决定就新时代创新对员工进行培训，这将需要花费资金。对技术的培训和发展的批准通常来自组织的高层，而公司级人员转而向股东申请以获得批准。如果公司的技术采用与组织的长期盈利能力相关联，整个过程就可以变得更加高效和顺畅（Singla\
  \ et al., 2024）。技术团队有责任证明与技术采用相关的利益，通过提供可以在高层和股东面前展示的切实利益，可以使采用和实施技术的道路变得顺畅。投资员工的培训和发展一直是一个好主意，因为它能在员工之间培养归属感和熟悉感。这也有助于减少角色压力和工作投入不足，从而在增长、市场份额、客户留存等关键参数上获得更好的表现。\n\
  \n## 3.4 关联结果\n\n公司在实施过程中经常遗漏的一个重要步骤是，将技术采用的结果与市场参数相关联。作为一个组织，你必须证明由于技术采用的实施，与性能相关的关键参数受到了积极影响。将数据科学和人工智能的使用与提高患者满意度、为患者提供卓越价值以及提供负担得起的医疗服务相关联，是你必须完成的过程的一部分，以增强组织内技术的实施。通过向高层展示卓越成果，医疗保健公司可以确保获得更多资源，以便将公司技术的使用水平提升到更高水平。用积极的框架沟通结果不仅与医疗保健公司目前的技术采用有关，而且为了将其推向另一个水平；驱动公司下一阶段数字化转型可能需要更多资源（Wedel\
  \ & Kannan, 2016）。结果的沟通对股东来说很重要，因为他们始终关注对视频职能部门和运营机制的投资。\n\n## 4 结论与讨论\n\n\n\n\n\
  数据科学和人工智能具有改变游戏规则的潜力，这一点毫无疑义。这两项技术已被证明在将医疗行业效率推向新水平方面发挥着关键作用。为了确保这些技术继续为医疗行业带来显著效益，在实施这些技术时，必须重点考虑整个生态系统的整体方法。每一个参与医疗行业的利益相关者都必须对技术整合有清晰愿景，并相应地在组织内部对其进行处理，以便从采用数据科学和人工智能中获得最大的利益。行业参与者需要在技术采用中发挥核心作用，以便让供应商、制药公司、供应链运营商和客户等其他利益相关者也受到同样的鼓励。虽然与技术采用相关的大量工作必须由企业部门完成，但政策制定者的关键作用在这里如何强调都不为过。监管者、管理员和政策制定者需要制定开放且建设性的政策，以便医疗行业以预期的速度实现技术采用。新型创业企业（特别是在技术领域）的作用也至关重要，因为它们可以通过使新技术在采用过程中变得负担得且具有成本效益，从而做出贡献。资源需求一直处于较高水平，通过提高数据科学（尤其是人工智能）在采用过程中的成本效益，可以极大促进医疗行业技术的整体采用。这也指向了风险资本人和金融机构在资助医疗行业技术领域的重要作用，因为这将带来能够以成本效益方式提供患者的创新。鉴于医疗行业在公共福利整体生态系统中的重要性，企业部门与政策制定者的汇合是必须的。只有当这两个利益相关者合力合作时，医疗行业的整个生态系统才能从技术角度得到发展。医疗行业的技术革命刚刚开始，技术开始接管医疗参数的所有重要方面只是时间问题。总而言之，当务之急是采用一种整体方法，旨在为所有利益相关者提供卓越收益。\n\
