  \ 加加尔工程学院，莫哈利，旁遮普\n^c 共生国际大学，印度\n\n### 摘要\n\n基于证据的政策制定增长导致了国际范围内深远的路线图规划和政策制定。重要的是，现行的研发政策制定需要细致的分析和问责。尽管多种方法可以从投资的定性评估中得出结论，但考虑数据在多元格局中的直接和间接影响至关重要。特别是科学、技术和创新（STI）指标被广泛用于理解研发活动的演变。定量科技（S&T）分析为有效的政策制定提供了宝贵的战略见解，而这通常是一个复杂的事务。本文讨论了利用“科学计量学”方法结合深度数据分析来分析与国家目标愿景一致的印度指标。我们根据权威国际/联邦机构的数据对印度科技指标进行了详细分析。后部分旨在找出印度\
  \ GDP 和科技指标的模式，并推断出源自主导指标的可量信息，以突出政府计划的有效性。由于定性指标无法捕捉过程和灰色地，我们总结了印度背景下稳健规划和评估经济进步值得关注的重点。我们关注的是为更全球社会经济背景下的必要研发基础做出贡献。\n\
  \n*关键词*：科学计量分析；科技指标；印度创新；Jugaad；印度研究；科学与技术\n\n## 1. 引言\n\n当今经济体系是快速全球化、通信技术和信息技术驱动进步的产物。全球社会经济格局由先进的技术飞跃塑造，确保了生活质量。自\
  \ 20 世纪 90 年代以来的技术进步影响了全球经济、增长和国家地位。科学技术创新（STI）处于该概念的核心。因此，知识的产生、利用和传播被认为是工业革命时期国家经济增长和发展的决决。传播驱动的数字化技术的出现提高了生成、构建和提炼信息以培养知识的便利性。它弥补了知识创造、培养、积累和分配的空白，促进了科技的发展。除了为科技领域的发明、传播和商业化提供合适的环境外，全球领导者和利益相关者强调从这些知识中创造价值(Lundvall\
  \ & Borrás, 2006)）。许多国家以科技为核心设计了国家建设路线图。金融机构、财政部、教育及科技部门的新兴关注预示了通过这些创新以生产力和利润的形式创造价值，并最终引导增长、生产力和竞争力(Gertler\
  \ & Vinodrai, 2005)。\n\n基于证据的政策制定增长导致了国际范围内深远的路线图和政策制定。各国讨论了从各种指标中收集数据，以促进对现状更深入、更透明的理解。科学工程统计国家中心（NCSES）定义了“指标”一词。指标被定义为“评估状况的一个或多个指标的统计代理”(Martin,\
  \ 2012)。指标有助于评估任何项目、计划或活动的现状，并在无法直接衡量活动的情况下衡量进展。由于指标扩展了近端分析测量，它们有助于清晰地勾勒活动前和活动后评估之间的差异，因此预见性通常是指标提供的最佳体现。\n\
  \n\n\n\n\n\n图 3.1 国际组织用于政策制定的具有影响力的指标。\n\n科学技术（S&T）指标的出现使管理部门意识到，通过确保无缝的补充统计、分析推断和有效的政策设计规划，来实现国家路线图。科技指标取代了传统的政府统计，因为它们展示了低维度的简单定量数字。正式的形象化报告指的是数据本身，而非对数据处理方法进行概述（Gault,\
  \ 2018）。科技指标通过模式扩展信息，而有意义的信息有助于制定计划，从而指导知情决策和政策制定。由于对关键绩效指标（KPI）的评估可以揭示所执行管理活动的成功和效率，因此必须拥有最新的定性和定量数据（由机构提供）来平衡计分。因此，及时的调查、报告编制以及利益相关者向管理机构输送相关信息也同样重要。\n\
  \n发达国家在 20 世纪 40 年代和 50 年代通过汇聚科技指标制定了政策、构思了程序并统一了国家目标。美国科学基金会（NSF）构思了这一类比，随后在 30\
  \ 年代和 40 年代进行了初步实验。经济合作组织（OECD）在一份关于研发统计的方法手册中复制了 NSF 的概念，并制定了《弗拉斯卡蒂手册》（1963）（de\
  \ la Mothe, 1992; Ker & Galindo-Rueda, 2017）。《科学指标》（SI）于 1973 年出版。SI 和科技指数被用作系统模型，分析企业的能力和性能及其优劣势，有助于实现国家目标。后来，OECD\
  \ 引入了一系列科技指标（Freeman, 2013).虽然《欧洲科技指标报告》自 1994 年以来协助识别了欧洲大陆的增长（Delanghe et al.,\
  \ 2011），但少数欧洲国家遵循了其科技指标方法（Autant-Bernard, 2001）。拉丁美洲的不同分析方法围绕“科学与技术指标”（Principales\
  \ Indicatores de Cienciay Tecnologia）演变（Godin, 2002）。OECD、WHO、UNESCO、IDB、EUROSTAT、CEPAL、RICYT\
  \ 和 OCTS-OEI 是具有国际和国家目标的科技创新（STI）指标的领军者。ICONO（西班牙）、CTIE、GO-SPIN、OCyT、OCTI 以及印度科学技术部（DST）的\
  \ STI 政策专注于在其各自国家观测站的支持下的国家目标。一份构思良好的 STI 手册管理着每个管理机构。标准程序确保了统计数据的有效性，以便进行国际比较。\n\
  \n发展中国家正处于这一周期的萌芽阶段。印度自 50 年代以来一直将科技指数视为经济增长和社会转型的关键。印度政策旨在加速创新速度以提供科学领先的解决方案。这将有助于快速实现可持续的卓越科学研究。对于印度而言，《1983\
  \ 年技术政策声明》（Bhanu & Singh, 2014）强调了自力更生的技术能力的重要性，这被一个更精细的愿景——即《科学技术政策》（STP, 2015）所取代，将科技与研发投资中的关键因素结合起来。STP\
  \ 为应对国家挑战和培养创新系统提供了详细大纲。STI 政策旨在产生知识、生成解决方案、创造财富和获取知识产权（IPRs）。印度科学技术部（DST）的国家科学技术管理信息（NSTMIS）发布关于印度研发指标的见解，这些见解用于制定基于证据的政策。它有助于高等教育和研发的规划活动。本章关注印度的方法，主要分析计划、结果和挑战。本章结合了“科学计量学”方法的定量分析。\n\
  \n*   从全球经济格局中提取主要推论，并展示印度与领先国家相比的地位。\n*   通过结合印度语境，提出全面且详尽的科技投入产出评估。\n*   我们强调了有关各种社会经济因素（包括科技投入和产出指标）之间对增长影响的相关性的全方位统计暗示。\n\
  *   在美国、日本、中国和欧洲国家国际战略的背景下，与领先国家进行量化比较。\n*   最后，我们指出了值得关注的重要问题和相应的建议，制定印度政策以提高印度次大陆的科技表现。\n\
  \n上述针对特定国家的分析需要与经济背景建立关联。由于这些国家的排名差异巨大，本章利用数据科学从全球视角展示了印度经济的现状，并阐述了未来几十年的潜力。\n\n\
  ### 2. 数据集\n\n\n\n\n国际货币基金组织（IMF）在促进国际金融稳定、扩大货币合作以及在促进国际贸易、促进就业和支持可持续经济增长方面发挥着重要作用。IMF\
  \ 促进了多边支付体系的建立，为成员国提供了可用资源。通过其名为“监督”的正式体系，IMF 监测成员国家的金融发展状况。国家和全球经济及金融发展研究有助于防止国际货币体系中任何危机的发生。IMF\
  \ 对全球前景进行定期评估。《世界经济展望》（WEO）数据整合了《全球金融稳定报告》，并在其《外部部门报告》中包含了主要经济体的外部状况。尽管 IMF 在多个领域发布关键数据，但我们关注的是《世界经济展望》（WEO）数据库，该数据库发布了关于选定宏观经济数据的各种报告。2020\
  \ 年 9 月发布的 IMF 数据强调了新冠肺炎爆发对低收入家庭造成的负面影响，阻碍了全球减贫进程，预计 2020 年底收缩概率为 -3%（IMF, 2008）。基本假设是疫情将在\
  \ 2020 年底消退，但持续时间超过了预期。由于全球经济分析可以从疫情的完全消失中得出，因此研究客观、无偏且非偏差的数据至关重要。因此，我们考虑了 2020\
  \ 年 4 月发布的 WEO 数据，该数据涵盖了从 1980 年到 2020 年的时间跨数据，并对选定指标进行了中期预测。为了了解印度背景的洞察，我们关注了近期数据，即印度联邦机构发布的研发统计数据（Research\
  \ DST, 2019）。该报告总结了收集自来自不同部门/利益相关者（即政府、州政府、公共部门和私营部门行业）的 6,800 多家科技机构的数字。调查报告通过报告各种投入-产出科技指标数据，以及印度政府企业和私营部门所投入的领域特定研发支出投资，涵盖了国家研发版图。我们利用该报告对印度背景进行了深度分析，得出了推论，并与全球统计数据进行了比较。\n\
  \n在保持印度背景为焦点的同时获取全球视角，我们探索了经济发展的全球性性数据、分析和预测。进行了整合了《全球金融稳定报告》和《外部部门报告》的 WEO 数据库分析。利用发达国家（具有深厚的科技实践和成果）的统计数据进行比较分析。图\
  \ 3.2 展示了印度背景的 GDP 统计图（从 1980 年到 2018–2019 年）。数据由国家统计局按财政年度（4 月至翌 3 月）发布。数据包含了 1998\
  \ 年至 2011 年间计算的实际 GDP 增长率，发布在 2008 年国民核算体系中。自 1995 年以来，该国的名义 GDP 增长了超过 700%，在过去\
  \ 25 年中出现了惊人的激增，印度在 2010 年位列第九，落后巴西和意大利等国；2019 年位列第五。由于金融部门观察到挑战，增长速度从 8.3% 放缓至\
  \ 4.0%（2017 财年至 2020 财年之间）。新冠肺炎影响了全球经济，也导致印度经济在 21 财年收缩了 7.3%。\n\n## 4. 科学计量学分析\n\
  （注：此处保留了原文的标题翻译结构）\n印度的发展规划方法已通过将大量资源投入科技、教育、培训和研究。科技基础设施（如国家实验室、研究设施和学术机构）取得了显著成果。印度通过机智的政策和路线图推动了合理的总支出（主要通过政府部门）。分析得了经济（GDP）、研发支出、科技人力资源、研发领域人力投入以及知识产权注册之间的联系。科研论文、出版物、商标和专利是路线图的最终反映。十年来，印度政府通过其科技机构扩展了额外的研发支持，这些措施具有重要支持作用。影响科技范式的重要因素将在后续章节分析。\n\
  \n\n图 3.2 印度 GDP 统计数据（1980 年至 2018–2019 年）及 GDP 增长率。\n\n### 4.1 研发投资\n\n全球对科技（STI）的关注得到了大量投资的支持（2009\
  \ 年高达 1.2 万亿美元），而印度的研发投资数字难以达到相应档次（低于全球投资的 2.5%）。2009 年印度的研发投资仅占 GDP 的 1%。然而，印度愿景是将其研发总支出（GERD）增加到\
  \ GDP 的 2%，并作为国家议程。由于工业研发投资在 2005 年到 2010 年间增长了 250%，销售额增加了 200%，印度计划与私营部门合作来实现计划。私营投资可以将研发成果转化为商业结论。通过协同日益增长的研发投资和私营部门的力量，印度政府采取了建设性措施以增加其总预算支持。良好生态系统支持的及时行动已显示出其影响，印度在科学出版方面位全球第九，在获得专利方面位列全球第十二。负责编织国家层面“投资”织物的线条强度已进行了分析，并与全球领先者进行了比较。\n\
  \n### 4.1.1 GERD：比较分析\n\n\n\n\n国内研究开发支出（GERD）是指一个国家内利益相关者（即居民企业、研究机构、大学和政府实验室机构）的当前支出和资本支出的总和。总支出包括来自外国来源的研发资金，但不包括在我国经济范围之外实施的国内资金分配。这些指标值是根据基准年和购买力平价（PPPs）以美元价格价格得出的。它们以各国\
  \ GDP 百分比的形式呈现（Godin, 2003）。报告显示，印度总研发支出在 2004 年至 2018 年间增长了五倍。GERD 在这十年内持续增长，从\
  \ 2004–2005 年度的 24,117.24 亿卢比增长到 2017–2018 年度的 113,825.03 亿卢比，并达到 2018–2019 年度的\
  \ 123,847.71 亿卢比。图 3.3 显示了政府、商业企业、私营部门和公共部门投资的年度总 GERD 图表。图表突显了 GERD 增长了五倍，其中私营部门、公共部门和政府资金占据了很大份额。印度研发支出的数字与其发展水平和预期相符。然而，据报道，世界领先国家的商业部门\
  \ GERD 远高于其发展水平的预期，特别是美国、中国、日本和德国。2020 年，印度位列全球 50 强创新国之列，在《全球创新指数》（GII）131 个国家中排名第\
  \ 48 位。与领先国家相比，印度政府对 GERD 的贡献占 56%，而这一比例小于前 10 大经济体中的 20%。在推动创新和增加商业部门对 GERD 的贡献方面仍存在巨大空间。由于\
  \ 2004 年之前政府资金涵盖了研发支出的最大份额，印度政府采取了纠正措施，使其成为全方位的发展平台。印度政府成功地吸引了商业企业和私营部门对研发的投入。商业企业的投资从\
  \ 2004–2005 年度的 7,296.84 亿卢比增长到 2018–2019 年度的 51,115.35 亿卢比，在研发投资中的占比为 41.3%。\n\n\
  该图表展示了国家层面所有利益相关者的健康份额。尽管私营部门的支出有所增加，但 GERD 份额略有萎缩（从 2014–2015 年度的 37.20%下降到 2018–2019\
  \ 年度的 36.79%）。研发支出的一个相关垂直领域是高等教育部门，这在以前的印度框架中是不存在的。图 3.4 显示了印度分部门的研发支出，以及从 2004–2005\
  \ 年到 2018 年的总 GERD 贡献明细图表。高等教育的贡献增长了七倍，即从 2004–2005 年度的 1,254.01 亿卢比增长到 2018–2019\
  \ 年度的估计 8,797.08 亿卢比。虽然 OECD 国家、日本和中国的高等教育部门分别占 GERD 的约 20%、15%和 12%，但印度仅占总 GERD\
  \ 的 7%左右，似乎距离理想标准还很远。由于高等教育和学术界是技能人力资源的重要来源和研究人员的摇篮，未来的政策制定需要关注。\n![image](img/f03-03.jpg)\n\
  \n\n\n图 3.4. 图表显示了从 2004–2005 年至 2018 年利益相关者的分部门平均研发支出和投资。\n\n### 4.1.2 投资与措施：教育体系\n\
  \n尽管印度的人均研发支出已从 2007–2008 年度的 PPP 29.2 美元增加到 2017–2018 年度的 PPP 47.2 美元，但研发支出在预算分配方面仍需重新审视，因为与其他国相比，印度的数字仍在努力达到相应水平。与金砖国\
  \ GDP 研发支出的比例相比（即巴西 1.3%、俄罗斯联邦 1.1%、中国 2.1%和南非 0.8%），印度在 2017–2018 年的研发支出占其 GDP\
  \ 的 0.7%。考虑到印度的直接竞争对手中国，其研发支出在过去几十年中翻了一番。中国将研发支出从 2008 年的 1.46%增加到 2013 年的 2.01%。最近，韩国的研发投资吸引了每百万人中更多的研究人员，即从\
  \ 2008 年的 4,867 人到 2013 年的 6,457 人。图 3.5 提供了印度支出的对比图表，显示为 (a) 教育体系和 (b) 印度研发支出，并与其他国对比。图\
  \ 3.6 显示了印度人均研发支出（%）的全球对比。促进研发需求的整体方法需要加强教育体系、行业支持和政策提升，以吸引外商直接投资。这一时期可以被视为一个积极信号。\n\
  \n\n图 3.5. 教育部门和研发部门支出的对比分析。平均支出对比图表见 (a) 和 (b)。\n\n## 4.2 人力资源：研发\n\n人力资源在科学技术的发展中起着关重要的作用。因此，这一指标也反映了分析的见解。印度高技能人才大量流向。印度训练良好、精通\
  \ IT 且经验丰富的人因职业原因流向国外。识别科学技术人力资源（HRST）并建立其与记录增长的相关性至关重要。涉及专业教育（即技术、医学科学、工程、农业和兽医科学）、教育、法律和其他领域）并分类为公共、私营、工业和机构部门的人力资源数据已被分析。图\
  \ 3.7 显示了主要行业组中公共和私营部门的特定贡献份额。\n\n\n图 3.6. 人均研发支出（%）的全球对比图性分析。\n\n\n\n\n从 1981 年起的\
  \ 20 年内，印度人口大幅增长，从 6.83 亿增加到 10 亿。我们考虑了关于`HRST`职业和`HRST`教育的数据。尽管在同一时期内，劳动力人口从 3.06\
  \ 亿增加到 4.44 亿，但核心`HRST`在 1981 年和 1991 年分别记录为 260 万和 440 万。专业性大学/认可机构的大幅增加（20 世纪\
  \ 90 年代从 886 所增加到 2,223 所）使`HRSTE`数据在短短十年内从 1,560 万增长到 2,520 万（Khadria, 2004）。为了吸收`HRST`，我们分析了涉及机构和工业部门的人力资源数据。到\
  \ 2018 年，参与`R&D`活动、辅助和行政活动的人力资源总数分别记录为约 341,818、98,824 和 112,327 人。印度在全球博士学位产量上位列中国和美国之后，拥有\
  \ 16,339 个博士学位。然而，全球`HRST`分析强调，与其他国家相比，印度在`S&T`领域的综合人才储备较低。图 3.9 显示了印度在全球范围内技术人员和研究人员参与度比较中的地位。\n\
  \n\n图 3.7. 主要行业组公共与私营部门的特定部门贡献份额。\n\n\n图 3.8. 比较分析：部委/部门的`R&D`支出（单位：卢比）。\n\n\n图\
  \ 3.9. 比较分析：参与`R&D`的人力资源（技术人员和研究人员）。\n\n\n`IPRs`为创新性，特别是技术创新提供了保护。促进技术转让和商业化有助于提高进步水平，并刺激创新（Ilie,\
  \ 2014；Mrad, 2017）。`IPRs`还通过各种激励促进创新者，为国家`S&T`发展和经济增长做出贡献（Hossain & Lasker, 2010）。研究表明，有充分论点，在工业化初期，强有`IPR`保护可能会阻碍技术转移和本土学习活动（Kumar,\
  \ 2003）。一旦国家积累了足够的与其`S&T`基础设施相适应的创造性模仿能力，`IPR`已被证明是一个积极因素。同样，印度的发展表明了弱化`IPR`保护在建立本土能力方面重要性。针对印度背景的研究结果显示了弱化`IPR`保护的重要性，这具有积极贡献。另一方面，更强的`IPR`保护对就业和产出有负面影响。然而，关于`IPRs`对印度的影响的实证结果表明，过去十年具有积极意义（Ezdine\
  \ & Hammami, 2018；Mallik & Chowdhury, 2001），因此，可以通过量化的`R&D`成果来分析印度的地位。\n\n\n在任何领域获取创新和新工作的`IPR`被认为是国家`R&D`路线图的重要指标。`S&T`指标关注塑造未来规划的专利趋势。\n\
  \n### 5.1 R&D 趋势\n\n大学总入学人数在 1976–1977 年记录为 2,431,563 人，2000–2001 年为 8,399,443 人，2018–2019\
  \ 年为 37,399,388 人，增长显著。由于职业高等教育的入学比例记录为 36.8%。博士学位从 2010–2011 年的 16,093 个增长到 2017–2018\
  \ 年的 40,813 个。印度在 2014 年和 2015 年的科学与工程（`S&E`）全球第三，仅次于美国（2016 年的 39,710 个）和中国（2015\
  \ 年的 34,440 个）。\n\n### 5.2 学术出版\n\n`NSF`数据显示印度在学术出版方面排名第三，其中在`NSF`、`SCOPUS`和`SCI`数据库中分别排名第三、第五和第九。印度的`SCOPUS`和`SCI`出版在\
  \ 2011 年至 2016 年间显著增加，分别为 8.4%和 6.4%，而世界平均水平分别为 1.9%和 3.7%。印度学术出版在 2016 年因占比 5.4%而降至第六。随着美国和中国\
  \ 2016 年后出版数量的增加，印度的数据表明需要解决的问题。尽管印度在人力资源方面拥有巨大实力，但与领先国家的年度出版差距很大，需要补充。图 3.10 (a)\
  \ 显示了与领先国家相比，印度从 2001 年起的科学期刊出版增长率。虽然印度在 2011–2016 年贡献了全球所有领域的 6.8%（683,570 篇），但其在科学（22\
  \ 个主要学科）领域的贡献仅为 4.1%，复合增长率（CAGR）为 6.4%，在 2011–2016 年期间为 336,620 篇。\n\n\n图 3.10.印度与中国、美国的增长率对比：(a)2001\
  \ 年起的科学技术期刊出版和(b)1980 年起的专利申请。\n\n### 5.3 专利\n\n专利也引起了关注，它是衡量创新`IPR`的尺度，衡量了国家的`R&D`能力。专利数据源于居民和非居民印度人。此外，外国利益者也在印度申请获取`IPR`。专利申请数量从\
  \ 2000–2001 年的 8,503 件增加了六倍，达到 2017–2018 年的 47,854 件（图 3.10(b)）。尽管印度在居民专利申请中排名第九，但考虑到全球格局，这些数字并不令人鼓舞。`WIPO`报告印度专利局位居全球第七位。在\
  \ 47,854 项专利申请中，只有 15,550 项（32%）是由印度居民提交的，外国居民提交了剩余的 32,304 项（68%）。图 3.11](#978-1-83608-298-920251003.xhtml#fig11)(a)显示了申请、待审申请和最终审查申请的数量图表。从\
  \ 1976 年至 2018 年，每年平均专利申请数量为 16,518 件；在此期间仅有 155,566 专利获得授权，平均每年 3,795 件。图 3.11(b)显示了印度居民从\
  \ 2000–2001 年至 2017–2018 年专利申请的积极增长率，并与非居民的贡献进行了对比。在 1976 年至 2018 年间的 155,566 项授权专利中，仅\
  \ 21.75%属于印度居民。图 3.12 显示了专利申请数与授权专利的统计数据，以及印度居民和非居民自 1976 年以来的份额。图中显示的相关模式凸显了与领先国家相比的数字对比，后者的占比更高，例如中国（90%）、日本（81%）和韩国（77%）。\n\
  \n\n\n\n\n图表强调了外国企业在印度申请专利的份额日益增加。在外国居民申请的专利总量中，很大一部分由美国、日本和德国贡献，分别为 18,179 件（56%）、4,487\
  \ 件（14%）和 2,773 件（8%）。在考虑企业实体时，图 3.13](#978-1-83608-298-920251003.xhtml#fig13) 显示了印度统计数据，强调了\
  \ 1981 年以来印度居民和非居民的贡献。图 3.14 显示了从事研究、辅助和管理活动的人力资源分布。\n\n图 3.12. 按国家比较评估：居民和非居民平均专利申请贡献。\n\
  \n图 3.13. 印度统计数据，强调 1981 年以来印度居民和非居民的贡献。\n\n图 3.14. 从事研究、辅助和管理活动的人力资源分布。\n\n## 6.\
  \ 规范性分析\n\n由调查机构发布的国际报告通过全球广泛认可的概念、指南和调查，有助于衡量该国科学技术（S&T）政策的有效性。尽管印度的科学技术改革的有效性可以通过研发、专利和出版成果进行分析，但这些传统的指标矩阵仅记录了正式部门的创新。在确定的第一或二级机构和机构进行的印度调查未能涵盖非正式部门的创新和进步（Charmes\
  \ et al., 2016）。大量的隐性指标没有出水面，因为大部分印度劳动力仍从事非正式经济（Kraemer-Mbula & Wunsch-Vincent,\
  \ 2016）。由于缺乏对这类创新的识别、标准连接的措施以及培养这些技能的官方媒介，使得捕捉工人的内部知识、非正式网络以及根据需求适应或模仿正式网络知识的能力变得具有性（Basole,\
  \ 2014）。尽管国家创新基金会（NIF）识别了超过 300,000 项创新，但许多此类最佳实践仍待发掘。另一方面，接触这些程序的机构展示了许多专利、出版物和创新，但其实用价值比例很低。几个实例表明，印度的科学技术政策优先考虑研发以开发创新解决方案。然而，农村地区和非组织部门的创新被忽视了，从而忽视了现有的创新和继承的知识。\n\
  \n一方面，印度政府促进基层创新，即被称为“Jugaad”的节约型创新，通常属于非正式部门（Sharma & Kumar, 2019; Sheikh, 2014），并且缺乏将这些创新正式化以注册的手段（Bhaduri\
  \ & Kumar, 2011; Jain & Verloop, 2012）。由于这些创新受限于特定问题并利用当地资源实现，它们缺乏具有时复杂实用性的专利新颖性。此类创新的微小激励结构和回报未能产生进一步创新的动力。因此，传统的科学技术指标没有记录这些创新。将节约型创新整合到正式科学技术指标中面临着巨大的障碍。由于非正式部门缺乏专利程序，在验证这些节约型创新的适用性和真实性方面存在困难。在大规模范围内确定其应用方面存在挑战。印度知识产权机构和传统的注册方法尚未到达非正式部门，因此错失了所有此类创新的计数，未能承认它们。总而言之，传统的创新指标忽略了创新的真实数量（Shekar\
  \ & Paily, 2019）。印度特定行业的投资数据没有转化为科学技术指标中的相应产出。尽管政府重点仍放在国防、矿业、燃料和工程等部门，但私营部门投资相对较低。私营部门强调优先考虑制药、快消品、生物技术、农业等部门，这些部门的政府份额微乎其微，而知识产权统计未能得出任何有力的结论。尽管公私合作帮助了非正式创新纳入体系，但印度的“Jugaad”——即基层——创新尚未进入正式部门。强烈建议在农村地区建立“创新中心”以促进和简化知识产权流程。对现有的政府政策进行修订将有助于倡导、治理并使非正式部门与正式创新部门接轨。\n\
  \n\n\n\n\nSTI 指标很大程度上限于研发支持，即政府和私营部门的研发投入，以及专利、商标和研究出版物的定量衡量。创新必须考虑企业层激励措施，这无疑会影响收入和市场份额。ST\
  \ 评估显示了需要挖掘的潜力。印度政府开展的计划，例如“自强印度”（At Nirbhar Bharat），正在提高创新能力。这些计划在创新者、中小企业和机构中吸引了大量关注。\n\
  \n因此，需要识别可以衡量创新政策的指标，以直接衡量投资、新制定政策的有效性以及经济回报。此外，必须增加一个维度来涵盖非量化方面，以反映创新的真实状况。由于 STI\
  \ 活动往往聚集在既定的参与者和地理位置，传统方法在分析 STI 方面并不有效。印度需要制定一种指标来追踪次南大陆的创新集群。整个系统的革新需要全新的视角来促进创新。\n\
  \n教育体系的基础必须促进对青少年进行全面的重新定位。高等教育体系、学院和学术机构必须建立一个生态系统，促进学生向研究人员平稳过渡，并提供对接 `NIF` 以获取创新知识的平台。迫切需要提供良好的基础设施、适当的激励措施，并在国内留住人才。对学生和学者的衡量需要重新审视，这可以使潜力倍增。需要通过学术界、私营部门和政府机构的融合来探索创新，使其达到科学、技术和领域的新高度。中央层生态系统可以协调目标、统一利益相关者的努力，并缩小差距以加速增长。高等教育领域专注且计划良好的研发支出，将产生更好的成果。\n\
