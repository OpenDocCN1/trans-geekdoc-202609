  ### 3.1.1 在数据科学中实现云计算的开放挑战\n\n**分布式与并行计算：** AI 和数据科学任务需要分布式计算，例如训练复杂的神经网络或处理海量数据集。持续解决在不同云实例之间有效分配这些负载、最小化通信开销并提供容错能力的持久挑战，将证明非常有帮助。\n\
  \n**可扩展性与弹性：** 鉴于 AI 算法和数据集不断增加规模和复杂度，优先考虑云资源的扩展能力和灵活性至关重要。在多个云区域网络或供应商之间有效管理和协调存储及计算资源的分配是一项持续困难的任务。\n\
  \n**安全性与隐私：** 在云端托管敏感数据和 AI 算法时，优先考虑数据隐私和法律合规至关重要。研究重点在于为数据科学和 AI 应用实现访问控制机制和强加密方法。\n\
  \n## 3.2 雾计算\n\n\n\n\n\n雾计算被引入作为云计算服务的替代方案，以满足物联网（IoT）日益增长的应用以及管理和存储海量生成数据的需求 (Singh\
  \ et al., 2021)。雾计算可以提供必要的网络服务，协助对响应时间有较高要求的物联网应用 (Gubbi et al., 2013)。由于雾节点分布分散、多样化且资源有限，在雾节点之间分配物联网应用活动以满足服务质量（QoS）和体验质量（QoE）限制是一项挑战（(Mahmud\
  \ et al., 2019)）。\n\n雾计算被应用于车联网（V2X）、患者监测和工业自动化，因为它提供了靠近用户的用户的计算能力。这确保了应用程序能够满足预期的反应时间。因此，物联网设备的广泛利用导致这些应用产生了海量数据。由于远距离数据传输延迟和网络拥塞，云计算无法满足延迟需求\
  \ (Singh et al., 2021)。雾计算凭借其带宽带宽、高效的能量管理和数据交付的低延迟需求扩展了云计算 (Gill et al., 2020)。因此，这些物联网设备产生的数据对各种应用变得变得有用。\n\
  \n研究人员现在更频繁地使用 AI、深度学习和机器学习来处理这些海量数据，用于数据分析和决策支持 (Iftikhar et al., 2023)。AI 驱动了数百万独立于数据中心运行在网络边缘的传感器和设备。具体而言，边缘计算和雾计算是数据处理、数据分析和决策领域的主要技术。雾节点上的\
  \ AI 模型可以用于执行实时数据分析，从而对数据提供更好的洞察，进一步优化操作。传感器数据与 AI 的无缝融合产生了一些新兴框架。诸如“智能家居”等新兴概念正被用于描述增强日常活动各方面管理（包括家庭能源消耗）的易用性和便利性的创新技术。例如，我们可以存储传感器数据并据此采取行动，使用\
  \ AI 简化操作，并对以前需要人工干预的情况做出做出响应。部署在雾计算上的 AI 模型可以识别异常、预测潜在的故障并建议必要的行动。Table 8.2 展示了某些雾计算的应用场景。\n\
  \n### 3.2.1 用数据科学实施雾计算面临的挑战\n\n#### 边缘智能与联邦学习\n边缘设备在许多雾计算环境中生成并分析数据。这是当前研究的关键领域之一；具体而言，它旨在部署有效的边缘计算方法，例如联邦学习。这种技术允许在基于边缘的分布式数据上进行\
  \ AI 模型训练，而无需在中央位置收集数据。因此，管理不同层级的任务分配、共享数据和保持一致性都是挑战性任务。\n\n#### 最小化模型划分与适配的延迟\n\
  在分散环境中，要确保实时 AI 应用在同步和分析方面快速且响应迅速是非常的。为了提高 AI 模型的性能，可以将模型拆分成更小的部分，这可能涉及将模型分布在不同能力的设备上。这是快速跟踪数据流的重点领域，并且增强\
  \ AI 模型以运行在雾节点的硬件和软件配置上可能有问题。\n\n表 8.2. 使用雾计算和 AI 的现实世界应用。\n\n| 序号. | 公司名称 | 应用领域\
