  \n\n\n\n\n编辑和审稿人能够利用自动化同行评审平台，该系统能够高效地评估大量投稿，从而节省时间（Rousi et al., 2024）。基于 AI 的技术提供了显著优势，能够有效缩短学术写作所需的时间，同时抄重检测技术也有助于识别复制的文本。然而，通过利用自然语言处理技术，作者可能会优先考虑写作的内容而非技术层面（Sathe\
  \ et al., 2023）。同样，AI 算法可以提高全面文献检索的效率，并缩短语言翻译和文本摘要等活动的处理时间。自然语言处理系统可以为各种书面文档生成定制大纲，例如电子邮件、报告、研究方案、资助提案、知情同意书、医疗必要性保险信等（Jayakumar\
  \ et al., 2023）。此外，值得注意的是，语言处理具有提供精确建议的能力，从而提升论文质量。此外，AI 工具可能会根据先前的研究提供最佳研究样本量的建议，并就执行最合适的统计测试提供建议（Abbasian\
  \ et al., 2024）。将 AI 整合到学术研究中增强了写作过程的效率，还促进了产出并提升了输出质量。研究过程可以分解为两个关键部分：提出假设和开展研究（Pigg,\
  \ 2024）。对于刚进入研究领域的人员来说，AI 可以在这两个领域提供帮助。在检测现有文献库中的缺陷时，机器比人类通常更擅长发现模式和联系，特别是当人类仅仅是新手时（Budhwar\
  \ et al., 2023）。一旦形成假设，AI 还可以协助下一步：实际上，即开展研究。\n\n学术研究在数据处理方面从 AI 中受益匪浅（Alberth,\
  \ 2023）。这是因为 AI 可以以更快的速度检测模式并发现新事物，也就是说它能快速发现重要内容。当我们说“重要内容”时，我们指的是推进研究的关键元素，这些元素往往会带来新的发现或对先有理论的修正（Mahapatra,\
  \ 2024）。快速整洁的数据组织和可视化是 AI 系统最实用的任务之一，表格和图表构成了它们的核心（Feher, 2024）。这是因为“可比性”是我们希望数据并排呈现的方式，这种方式能让我们同时看到它们的相似和不同之处。这正是\
  \ AI 可以提供帮助的地方：它可以发现并突出我们数据中的模式，而我们在以人类速度工作时很容易忽略这些模式（Gouveia et al., 2023）。AI 的影响正在不断增长，并触及各个方面（Cheng\
  \ & Lee, 2024）。AI 的出现显著改变了我们访问和处理海量数据的方式，正如[图 7.2]所示的框架](#978-1-83608-298-920251007.xhtml#fig2)。\n\
  \n![image](img/07-02.jpg)\n\n图 7.2 生成式 AI 的框架。*来源：* 作者构思。\n\n正如任何技术进步一样，由于对潜在缺点或风险的担忧，对其采用存在抵触情绪。确实，依赖\
  \ AI 生成的结果可能会损害人类的创造力和分析思维。生成式 AI 的出现为各个领域带来了巨大变化。这些改进源于简化语言构建、定制学习体验、改进内容创作以及更新学术研究的能力（Alberth,\
  \ 2023）。此外，被称为 AI 的生成式 AI 彻底改变了写作方法。它增强了学者和学生有效管理时间并提高阅读技能的能力（Gouveia et al., 2023）。创意\
  \ AI 在教育领域营造了定制化的学习环境，考虑了学生的独特学习偏好和风格。此外，它通过提高语言能力和纠正语法错误，提升了认知沟通的质量和实用性（Wach et\
  \ al., 2023）。研究项目的分配已经转型，导致了学术研究性质的根本转变。\n\n“技术收益”指的是使用特定技术所获得的收益（Dencik et al.,\
  \ 2023）。AI 的收益围绕着学生在学术活动中使用技术所获得的益处。然而，“实际技术使用”指的是个人在日常生活中采用技术的多种方法。\n\n表 7.1 可用于学术领域的人工智能工具。\n\
  \n| **文献检索** | **写作工具** | **文献检索与写作结合** |\n| :--- | :--- | :--- |\n| Semantic Scholar\
  \ | Writefull | Cohere |\n| Connected Papers | CoSchedule | |\n| Penelope.ai | Quillbot\
  \ | |\n| Elicit | Wordtune | |\n| Scite | ChatGPT | |\n| Google Bard | Google Bard\
  \ | |\n| **绘图** | | |\n| DALL-E 2 | | |\n\n*来源：* 作者根据网络资源自行整理。\n\n\n\n\n\nAlberth\
  \ (2023) 将“AI 的使用”描述为生成式 AI 的特定应用，如表 7.1 所示，这些应用被学术人员用于作业、学期论文、研究论文和其他学术职责。在使用某项技术之前，用户应根据研究结果评估其益处或效能（Pechenkina,\
  \ 2023）。根据 Dencik 等人 (2023)”，当客户发现某项技术有益并能够提高其生产力和简化操作时，他们更有可能采纳和使用该技术。Gallent-Torres\
  \ 等人 (2023)认为，如果学术人员认为新技术是增强其工作效率或质量的手段，他们更有可能接受新技术。学者在教育人工智能（AIED）中使用人工智能的动机将受到他们对\
  \ AI 对其学术追求优势评估的影响（Khan, 2024）。AI 技术提供了广泛的功能，极大帮助了学术写作，涵盖了研究和出版的不同阶段。当代设备正在促进学术研究领域的若干种变革。检查句子并思考各种写作哲学导致了精确和精炼语言的使用。为了彻底理解一个句子，有必要检查其句法、语义和结构元素（Mahapatra,\
  \ 2024）。大规模文本处理是指对大量文本材料进行高效管理。它具有处理大量数据和执行复杂计算的能力，从而产生有价值的见解（Pigg, 2024）。预测建模利用输入来预测词汇的生成并产生连贯且符合语境的语言。进一步生成式\
  \ AI 将预测与研究的事实相结合，创建符合语法规则、保持连贯性并符合意图含义的引人文字，例如：\n\n#### 研究论文的写作与编辑\nAI 驱动的写作工具有助于将想法组织成连贯且合理的论点。AI\
  \ 开发的语法、语调和风格确保了最高的准确性。\n\n#### 研究组织与总结\nAI 技术可以高效地搜索大型数据库以管理你的文献综述。通过综合多项研究的重要发现，它提供了一个全面的综述，而无需对每个单独源进行详细测试。\n\
  \n#### 研究过程建议\n通过分析已出版文献集的样本，生成式 AI 可以提供对你的项目极有益的研究技术。生成式 AI 系统专于对数据进行广泛分析和解释；因此，处理大型数据集变得更加方便。\n\
  \n#### PDF 文档管理\n学术人员经常查看大量的 PDF 文件。AI 帮助识别、注释和分类论文，从而简化研究管理。\n\n研究人员和作者可以从多种生成式\
  \ AI 应用中获益，包括：\n\n* 自动化重复任务提高了时间效率。\n* 提高数据分析的精确性。\n* 提高写作水平并伴有及时反馈。\n* 简化公司内部流程。\n\
  * 通过对数据的全面分析获取知识。\n\n通过将这些生成式 AI 工具集成到工作流中，研究人员可以将注意力集中工作的关键领域，例如制定假设、协调实验以及围绕他们的发现构建引人入胜的叙述。\n\
  \n### 3. 生成式人工智能挑战\n\n与技术使用相关的挑战是指防止人们利用技术的限制、障碍或瓶颈（Nguyen et al., 2024）。本研究中的“AI\
  \ 问题”是指阻止学生利用 AI 技术的各种障碍。技术采纳已被认为是一个重大挑战，特别是对于新兴或发展中国家（Kong et al., 2024）。当潜在客户因为可用性、支持、技能要求、可访问性和其他类似因素的担忧而认为给定技术难以使用时，就会发生技术抵触。根据\
  \ Rojas (2024)，发现技术具有挑战性的个人倾向于少用或完全避免使用它。如果学者认为在教育背景下使用 AI 是一项艰巨的任务，他们将克制使用 AI。如果个人更倾向于这样做，他们就会将\
  \ AI 用于教育目的。\n\n### 4. 学术研究中生成式人工智能的观点\n\n大众非常喜欢生成式 AI 模型，因为它们能够提供更接近人类理解的信息。OpenAI\
  \ 在 2022 年引入了 `ChatGPT` 和 `DALL-E`，它们广受好评。根据 Lim 等人 (2023)，基于 `GPT` 的变体受到了广泛认可和喜爱。根据\
  \ Stephens 等人 (2023)，`ChatGPT` 在编写结构化文章和内容、开发聊天回复、辅助翻译、解决查询以及提供代码协助方面具有卓越的知识。研究人员对改进特定任务的大语言模型\
  \ (`LLMs`) 以及探索跨领域学习的可能性产生了浓厚兴趣（Zuber & Gogoll, 2024）。`ChatGPT` 助力教师和学生实现若干教育目标。`ChatGPT`\
  \ 帮助学生获取各领域的知识，提高他们的成就，解决复杂挑战并及时回答教育问题。`ChatGPT` 的编程活动增强了学生的技能。Alberth (2023) 和\
  \ Stahl and Eke (2024) 描述了 `ChatGPT` 的认知益处。2023 年将与 Alberth 相关而 2024 年将与 Stahl 和\
  \ Eke 相关。益处包括增强学习者参与研究的内在动力、增强他们对学科的理解以及培养他们。专业化的自动化对于提高教师/评审者的生产力并促进研究发展至关重要。此外，出版商正在采用更有效的诊断技术来增强评估/评审系统。\n\
  \n![image](img/f07-03.jpg)\n\n图 7.3 学术研究中生成式人工智能的观点。*来源：* 作者自拟。\n\n这种评估方法的改变重视通过指标和结论形成的知识。这说明了批判性思维与生成式\
  \ AI 思维之间的关系，如图 7.3 所示。\n\n### 5. 对学术研究中使用 ChatGPT 的担忧\n\n\n\n\n\n尽管 `ChatGPT` 提供了许多优势，但在教育环境中使用\
  \ `ChatGPT` 也伴随着一些故障和缺点。人们日益担心，对 `AI` 系统的研究和教育将导致针对特定群体的偏见和歧的建立与促进。除了目前的损害外，变化或影响可能导致对\
  \ `AI` 系统的偏见或不准确估计（Alexander et al., 2023)。Kong et al. (2024) 探索了 `ChatGPT` 在教育等各个领域的潜在应用，并研究了专家在实施前三个月内提出的问题。根据结果，`ChatGPT`\
  \ 在不同话题上表现出不同水平的性能。`ChatGPT` 致力于提供指导、回答问题、协助创建教学材料、进行在线辅导以及通过激励支持研究人员。然而，它的应用也存在局限性，例如伪造或操纵数据的能力，以及规避抄重检测程序的能力。\n\
  \n## 6. 生成式人工智能的伦理问题\n\nKumar et al. (2024) 认为 `ChatGPT` 可以提高学习成果，因为它有助于批判性思维，擅于提供定制化帮助，并在结构化信息方面有效。在使用适当的情况下，像\
  \ `ChatGPT` 这样的生成式 `AI` 可以帮助学生完成写作、研究和解决问题，这些任务是许多不同课程的核心。有人认为，能够以这种可靠的方式依赖生成式 `AI`\
  \ 鼓励学生在写作时表达更多的个性，因为他们不再受到所谓“良好”语法的限制，也不再需要一直构思完全原创的想法（Peng & Zhao, 2024）。调查涉嫌偏见、知识产权盗窃、缺乏真实性和网络安全威胁的案例至关重要。我们还面对那些在专业和学术背景下为了个人利益而操纵数据以及传播虚假信息的人（Baldassarre\
  \ & Padovan, 2024）。以 `ChatGPT` 为例，Li et al. (2024) 认为，如果使用不当，生成式 `AI` 可能会引发教育中的基础伦理问题。例如，使用\
  \ `AI` 写论文可能会导致 Li 所说的“经典作弊引擎的实例化”。尽管 `ChatGPT` 的开发者表示他们的目前无法编写具有说服力的文本（即声称某个观点，然后提供进一步证明），但他们也无法确定将来不会这样做。\n\
  \n## 7. 生成式 AI 伦理考虑的概述\n\n个性与真实性之间的联系贯穿人类历史。自从 `AI` 生成内容出现以来，区分真实内容与计算机生成内容变得非常有挑战。`AI`\
  \ 模仿真实智能的能力威胁了许多指标（Johri et al., 2023）。这一发展使所有输出的可靠性受到怀疑（Gagne et al., 2023）。当使用大规模数据集训练\
  \ `AI` 系统时，它们有时像是在重复（McMillan, 2023）。随着生成式 `AI` 使用的扩展，对识别内容的新方法日益增加（Rosário, 2024）。生成式\
  \ `AI` 可能会增加社会偏见并导致不公正的结果，这源于模型的特定设计（Gouveia et al., 2024）。设计不良的模型可能会操纵数据并产生虚假结果（Zhu\
  \ et al., 2024）。确保对 `AI` 系统的公平对待可以保证性能（Calis, 2023）。`AI` 输出的潜在影响是推动透明度和开放性的动力（McCormack,\
  \ 2024）。如果生成式 `AI` 系统产生不准确或构成威胁的信息，将采取措施确保相关人员承担责任并对其负责（Spemann et al., 2024）。接受对创新\
  \ `AI` 系统结果的部分责任等同于承认责任（Raman et al., 2024）。确定生成式 `AI` 系统是否受损或伤害了人类以要求其承担责任至关重要。责任与道德和法律影响有关。确保\
  \ `AI` 正常运行与问责直接相关。合理的模型可以通过逻辑推理来证明其结论是正确的。\n\n知识产权涉及生产者在创作内容期间的权利，以及 `AI` 生成材料的所有权（Johri\
  \ et al., 2023）。人们担心，如果机器生产艺术、音乐或文学，从人类创作中获得的根本价值和快乐可能会受到损害。无意抄袭的风险（即复制已出版的受保护材料）引发了关于无意侵犯知识产权的伦理考虑。\n\
  \n\n\n\n\n虽然生成式人工智能能够创造新的工作，特别是在技术领域，但它也带来了取代现有职业的风险，特别是那些涉及重复性任务或信息生成的职业 (Ray,\
  \ 2023)。生成式人工智能具有增强数据处理、设计和内容生产等任务的潜力，从而提高产出并增加创造力 (Sidaoui et al., 2024)。这些产品和服务可能导致全新业务模式的两个例子如下：个性化内容平台和\
  \ AI 驱动的设计服务。其社会影响可能会影响教育，因为它降低了课堂内人际沟通的重要性，并赋能 AI 导师或内容创作者使其能够进行定制化教学 (Kumar et\
  \ al., 2024)。利用生成式人工智能创建深度伪造和虚假新闻文章，为信息的传播和信任的建立带来了巨大障碍 (Voorneveld, 2024)。\n\n\
  安全和隐私是保护个体的措施，特别是当 AI 生成的内容可能扭曲或剥削个人时 (Li et al., 2024)。随着这些模型应用数量的增加，AI 伦理的重要性愈发凸显。为了确保生成式人工智能维护人权并为用户提供安全的体验，必须解决这些问题。安全问题涉及数据的操纵、依赖和篡改，而隐私忧虑则围绕数据的泄露、监控、画像分析和定制\
  \ (Zlateva et al., 2024)。在没有明确授权的情况下，无法使用数据，特别是在训练生成式人工智能模型的背景下。\n\n人类能力的侵蚀与实践机会的减少有关，因为生成式人工智能能够自主开发内容、设计或其他通常需要人类劳动的输出\
  \ (Elbanna & Armstrong, 2024)。缺乏定期实践的机会会导致技能随时间的推移而下降。当一个人过度依赖生成式人工智能时，过度依赖自动化会带来风险。生成式人工智能在决策中的潜在主导地位可能会掩盖人类直觉或积累知识的下降，而这两者在历史上对许多职业起过至关重要的作用\
  \ (Andrieux et al., 2024)。生成式人工智能的出现可能会取代人类情感、个人经验和生成式 AI 领域，从而危及创造的本质 (Obrenovic\
  \ et al., 2024)。生成式人工智能产生的决策可能会导致体验式学习的下降以及传统能力的潜在贬值，因为某些手动或传统技能可能会过时 (Budhwar et\
  \ al., 2023)。尽管某些技能具有历史或文化重要性，但被低估的现象也正在发生。\n\n### 8. 生成式人工智能与研究\n\n毫无疑问，生成式人工智能将持续地改变研究及其方法论。本研究将面临各种后果，其中一些将产生积极结果，而另一些将引发关注\
  \ (Mahapatra, 2024)。为了说明生成式人工智能对研究（特别是学术期刊出版领域）的令人担忧的影响，该研究强调了低质量和/或无关论文投稿数量的增加\
  \ (Li et al., 2024)。在 `ChatGPT` 之前，期刊编辑必须花费大量时间来评估贡献不足或无关的稿件。通常，这些投稿以两种格式之一提交给期刊。某些稿件从一开始就很很薄弱。除其他因素外，这可能涉及逻辑错误的研究、无力的论证、观点表达模糊或缺乏新意\
  \ (Alberth, 2023)。显而易见，当作者忽略详尽阐述其内容时，他们的目标是追求浅显的成就来增强简历。第二类更为常见，由似乎超出了期刊范围的稿件组成\
  \ (Mahapatra, 2024)。在在提交工作之前，作者似乎没有审阅期刊的具体范围。据观察，大量稿件被拒绝了。大多数期刊编辑在被问及为何拒绝投稿时，会以此作为他们的主要理由\
  \ (Lopez et al., 2023; Nguyen et al., 2024)。期刊收到的不标准投稿不断增加，是学术界日益增长的压力压力。低质量且缺乏科学或社会意义的研究范围可能更令人担忧\
  \ (Bakla, 2023; Caliskan, 2023; Misra et al., 2023; Montezuma & Chong, 2024)。随着\
  \ `ChatGPT` 和其他类似的 AI 系统的出现，预计提交给学术出版物的文章将激增，因为个人现在可以使用计算机工具生成他们工作的大部分。生成式人工智能在研究和出版中的优势在于它促进了学术写作的公平性。然而，AI\
  \ 对其输出不受负责，不能担任作者。它的作用限于帮助作者以可能不是母语的语言更有效地表达他们的观点 (Krajka & Olszak, 2024; Lin, 2024)。预计利用生成式人工智能将导致合作团队之间工作分配更加公平。AI\
  \ 具有通过分析文本提取词汇和意义来彻底改变数据收集的。它还可以通过生成 AI 建议的提示来增强问卷，以实现更全面的数据获取 (Bakla, 2023)。\n\n\
  \n\n\n\n在学术界，充分理解与“厌恶市场”（repugnant markets）相关的挑战，这些市场是指被认为违反了某些社会标准但尽管产生了整体利益的交易，正如\
  \ Berg (2023) 所述。断言在研究技术中使用生成式 AI 本质上是厌恶的为时还过早。\n\n## 9.1 作者身份归属\n\n作者身份归属指的是权利的正式分配，在学术界有多个关键应用。它首先确定了文本的主要作者。作者是提倡并代表书面作品的个人\
  \ (Bozkurt, 2024)）。被分配的作者负责保护文本免受批评，并在必要时可能采取法律行动。在作者身份归属下，隐藏作者身份是不可接受的。虽然由于安全考虑，几个学术学科直到最近才为人所知。直到最近，对记者的贡献主要是匿名完成的\
  \ (Raman, 2023)。现在，无论新闻报道多么短小简洁，很少遇到不包含清晰可见署名的新闻故事。\n\n此外，主张作者身份使个人有权获得与作品发表相关的财务收益。根据\
  \ Alexander et al. (2023)]，在涉及大型研究团队的情况下，分配作者信誉是允许的，只要安排和信誉是经过协商的。这种妥协的存在凸显了归属的基本重要性。然而，`LLM`\
  \ 缺乏监管出版收益或对其内容承担责任的能力 (Srivastava, 2023)。虽然作者信誉可能限于特定的个人或群体，但它并不是某种受限或无法获得的东西。其目的是让作者获得对其工作的认可，并防止未经授权的个人认领荣誉\
  \ (Bakla, 2023)。需要注意的是，这并不是对那些未获得荣誉的人的批评。最终，随着 `LLMs` 在文字处理软件中的整合日益增加（微软已宣布将其 `ChatGPT`\
  \ 整合到其整个办公套件中，包括 `Microsoft Word`），作者在辨别手动编写的内容与 AI 辅助生成的内容将面临更大的挑战。作家们已经从同义词表、拼写检查、语法检查（包括如\
  \ `Grammarly` 等高级 AI 语法检查器）等工具，以及目前集成到文字处理程序中的预测性文本中获了优势 (Li et al., 2024)。虽然一个试图区分技术辅助内容与人类创作内容的新标准可能是有益的，但可能获得广泛接受。研究人员不应对他们自己没有亲手输入或撰写的作品声称荣誉。这进一步加强了反对利用\
  \ `LLMs` 进行写作的论点。最重要的是，学术界不再遵循这一理想。作者身份归属是团队和实验室中的惯常做法，不需要正式沟通。一个更有说服力的论点是主张在这种情况下，受侵犯的是生成式\
  \ AI 产生构思的过程，而不是生成式 AI 的写作行为。一个 `LLM` 程序响应用户交互。它无法独立地探索其潜空间。结果的价值将取决于研究人员的专家评估，而研究人员也负责设计搜索。`LLMs`\
  \ 实际上并不是“想法”，而是调查者主观研究问题的结果。只有当它们发表在期刊上或通过同行评审时，它们才被视为学术贡献。因此，可以推断出使用 `Google Bard`\
  \ 或 `ChatGPT` 的学术写作符合学术作者身份的标准 (Sison et al., 2023)。\n\n然而，通常情况下是为最终文档的做出贡献的人没有得到应有的。。常见的做法是根据审稿人的建议聘请“专业校对员”；然而，出版作品中很少见到他们的致谢\
  \ (Gill & Kaur, 2023)。通常，对同行评审者的正式致谢并不常见。然而，他们贡献了更大的价值。尽管双盲评审方法避免了这种问题，但对于作者来说，对同行评审者的贡献进行致谢是是必要的\
  \ (Bakla, 2023)。\n\n对于 `LLM` 生成内容的准确性似乎是可疑的 (Arighi et al., 2024) Kenthapadi et\
  \ al., 2023) King et al., 2023)。生成式 AI 的有趣用途在于它是编辑和增强内容的工具。在这种背景下，研究人员向 `ChatGPT`\
  \ 提供段落，甚至是整篇文章以供评审。在脚注或作者日期格式中单独引用是不切行的 (Duncan & McCulloh, 2023))。\n\n## 9.2 反抄袭规范\n\
  \n将抄袭作为反对使用 `LLMs` 的理由足以让更传统的学者反对其采用 ([Sysoyev, 2024)。最小化指控会对研究人员产生同样的负面影响。但了解反抄袭标准的经济根源有助于我们理解这种行为的复杂性\
  \ (Vinchon et al., 2023)。形式上定义抄袭可能相当困难。抄袭是一个源自“绑架”的拉丁词。某些字面主义者认为这个短语指的是想法的想法。根据\
  \ Dhammi and Ul Haq (2016)，抄袭可以被视为一种偷窃症。这种习惯在日常描述中被遵循。O'Connor (2023) 强调抄袭本质上是一种欺骗行为，假装是他人作品的作者\
  \ (O'Connor, 2014)。这强调个人是抄袭的主要受害者，而不是仅仅是人类知识库搜索的结果。Heckler et al. (2013)) 认为，对抄袭的负面影响进行更准确的评估是至关重要的。抄袭主要具有语境影响并受传统影响。抄袭的定义在不同的职业和文明之间存在。Tran\
  \ et al. (2018) 认为，将学术界的抄袭规定应用到不同的行业或文化中是不可能的。\n\n\n\n\n\n反抄袭标准是一种保护知识产权的法外技术（Singh\
  \ & Ganapathy, 2018）。抄袭既不违法，也不是法律诉讼的依据。版权仅保护文本；思想不受保护。尽管抄袭受限于职业团体实施的制裁，但法院曾批评律师的抄袭行为，称为“令人指责的”和“完全不可接受的”（Masic,\
  \ 2014; Roig, 2010）。在学术和其他领域，这一惯例已演变为保护作者经济免受机会主义行为的影响，因为这些行为会剥夺所有者获得其作品完整价值的权利。`LLM`\
  \ 的想法确实是它们自己的，且无论 `LLM` 是否遇到过其产权的侵犯，AI 创建的语言无法匹配（不存在的）正式或非正式抄袭标准，而且在学术界中使用 `LLMs`\
  \ 并没有违反反抄袭规则试图保护的产权框架（Berg, 2023; Bevolo, 2022）。反对抄袭的一个主要论点是，抄袭者破坏了智力层的层级。接受他人思想的读者无法从一开始就监控此类思想的演变。现代神经网络\
  \ AI 架构以作为不透明的“黑箱”运行而闻名，尽管它能够理解问题和训练数据输入（Kandeel & Eldakak, 2024）。\n\n学者有责任以一种既解释又阐明其理论和论点在智力传统和文献库中位置的方式来进行开发。考虑到神经网络架构中不透明性的重要性时，学者的角色和任务显而易见（Gunjan\
  \ & Zurada, 2021; Kashyap et al., 2024; Wu et al., 2021）。他们既可以将 `LLM` 作为调查特定知识领域的工具，也可以将\
  \ `LLM` 作为指南，帮助研究人员掌握该特定知识领域。研究论文作为最终成果，必须关注特定领域和相应的学术群体。这讨论了研究学术人员对其学术群体所承担的伦理责任。\n\
  \n## 10. 生成式 AI 在学术写作和伦理中的未来范围\n\n创造性 AI 在学术研究框架领域的应用潜力是巨大的，从想法生成到在出版中应用伦理实践。随着生成式\
  \ AI 的进步和在多个领域的普及，预计其改进伦理考虑和转型学术写作的能力将不断增长。从结构化数据中生成表格和数据、建议语法和风格、以及将非结构化思想组织成连贯论点的现代\
  \ AI 算法可以改进研究和认知写作工作流。这种策略能够收集重要结果，并有助于快速识别海量数据库，从而减少了对耗时文献综述的需求。研究人员可以使用这些工具增强他们时间管理能力。这些材料有助于非英语母语者提高写作、阅读和口语能力。通过定制学习体验，创造性\
  \ AI 有能力提高学生的学术表现并促进语言学习。实现这一目标的若干策略包括翻译文学文本、提高语言熟练度和实施语法修改。采用 AI 算法可以帮助学生提高论文写作水平，培养批判性思维能力并获取论文范文。尽管存在伦理担忧，但创造性\
  \ AI 有能力实现写作过程的大部分自动化，特别是在教学写作领域。这可能会阻碍创造性和批判性思维能力。当 AI 过度依赖错误数据或方法论时，可能会表现出偏差或错误。伦理思想对于课堂使用至关重要。教育是社会公平的最强大工具之一；它也是批判性思维发展的主权空间。因此，立法应当赋予\
  \ AI 伦理美德，并让这些美德对学生和教师可见。例如，我们可以让 AI 方法与人类决策并应用，以纠正给予群体的任何错误机会或待遇。如果苏格拉底式 AI 研究要保持人类智力产出的价值，人类学者与\
  \ AI 系统之间的持续互动是至关重要的。这种研究允许个人加深对复杂主题的理解，评估不同的观点，甚至修正自己的想法。AI 的进步无疑也会导致针对教育机构的新研究，其中数据分析和预测建模将处于领先地位。对于任何人来说，要准确理解复杂的模式识别行为、重大数据分析或复杂的认知过程，他们必须在这些领域拥有超越我们自身的智能，而这目前的\
  \ AI 系统显然并非如此。\n\n## 11. 结论\n\n\n\n\n\n学术界的迅速增长为生成式 AI 带来了危险与机遇。然而，总而言之，这个新的学术世界提供了一个绝佳的机会，让我们能够以正确（足够严谨且智力诚实）的方式利用当前的技术可能，特别是考虑到其中许多技术现在已经如此易用，以至于普通公民也能上手它们。\n\
  \n在学术界进行的研究从伦理角度来看必须始终保持纯洁；因此，以不符合伦理的方式使用技术无疑不是机会，而是危险。同样，正确地使用技术——我指的是以尽可能符合伦理的方式“正确地”使用——这为依赖学术界产生知识提供了另一个充分的理由。\n\
  \n在协作和同行评审过程中维护学术诚信至关重要。严谨的同行评审对于妥善认可学术成果是必要的，而当使用生成式 AI 执行通常由人类完成的任务时，这一点尤为重要。对于想要在工作中有效使用\
  \ AI 的学术人员来说，愿意接受反馈和批评是必须的。\n\nAI 研究因对社会的影响引发了伦理关注。如果你想象一下计算机根据其获得的数据类型以及其“学习”的性质可以构建出什么样的“社会”，就能理解当我提到学术研究的更广泛影响时在表达什么。最后，采取全面的策略来降低风险，可以确保\
  \ AI 仍然是学术人员的有用工具，并确保我们能够伦理地利用其能力来造福社会。\n\n### 参考文献\n\n- Abbasian, M., Khatibi,\
