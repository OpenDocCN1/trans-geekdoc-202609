  \ UGC-NET 认证。她在教学、研究和管理方面拥有超过 14 年的经验。她的专业领域是营销、电子商务、全渠道和零售。在职业生涯中，她参与了重要的学术和研究任务，例如担任知名期刊的*客座*、*组织并举办国际和国家级会议、教职工发展计划*，并在教学期间担任研究项目的导师。她整体的研究导向型思维、丰富的知识以及对职责的奉献使她赢得了声声的*教学卓越奖*和*卓越成就奖*。她在著名的国际和国家期刊上发表了\
