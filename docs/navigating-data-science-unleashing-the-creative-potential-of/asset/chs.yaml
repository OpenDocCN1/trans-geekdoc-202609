  \n# 第 6 章\n\n## 使用大数据解码基于人工智能决策的伦理关切\n\n### 摘要\n\n\n\n\n\n### 摘要\n\n本研究旨在探讨当人工智能（AI）被用于驱动各行业决策过程时产生的伦理困境，特别关注了利用大数据进行决策的伦理影响，并识别和分析了在决策中使用人工智能和大数据导致各行业在算法开发过程各个阶段所出现的伦理问题。对数据收集阶段的分析导致了在使用有偏差的数据集开发机器学习算法时出现了伦理灰色地带。研究过程中采用了包括医疗保健、金融、营销和教育在内的多个行业的跨学科研究和案例研究。研究涉及的一些主要主题包括隐私侵犯、决策算法中的公正性和内在偏见、人工智能系统的开放性与可解释性、自动化决策中的问责制，以及数据所有权和控制的伦理影响及其对数据主体的影响。本研究通过结合许多企业的见解，增进了对大数据和人工智能应用周围伦理环境的深入理解。它强调了在设计、实施和治理\
  \ AI 驱动的技术时，主动考虑伦理因素至关重要，以确保其在各行业中实现负责任、有利且最关键的基于共识的整合。研究最后讨论了直接和间接将人类生命托付给人工智能的后果和影响，以及关于治理人类的算法未来的终极问题。\n\
  \n**关键词**：大数据；自动化决策；伦理关切；基于人工智能的技术；偏见性\n\n## 1. 引言\n\n在过去的年中，机器学习算法以惊人的速度发展，组织已经利用海量的可用数据进行了训练。人工智能（AI）已经接管了世界，现在的场景已转向这些算法利用大数据所做出的结果和预测。大数据不仅是指使用大量收集的数据，更是指各种数据集之间的交互。它包含了处理数据的技术、分析数据以做出主张的方法，以及关于大数据可以提供极准确洞察的迷言。随着大数据的相关性和普及程度不断提高，有必要分析它是否是一个具有助力快速、高效进步潜力的现象，还是其蕴含的看似反乌托邦的未来会超过其益处。最受期待的讨论之一是伦理在大数据中的作用。曾出现过\
  \ Facebook 所谓的匿名数据被发布并去匿名化的案例，这引发了人们对未经许可的情况下使用公共数据的质疑。企业可以使用大数据做出决策，但这些决策并未考虑其个人数据被利用的个体的隐私(Herschel\
  \ & Miori, 2017)。机构审查委员会（IRB）等组织的建立作为回应，促使研究人员批判性地考虑他们的研究对所有利益相关者的伦理影响。关于知情同意和数据使用问责的问题也随之产生。在人工智能成为热词的当下，组织纷纷效仿，但以伦理方式使用数据的概率有多大？本研究提出了引人注目的问题，这些问题在讨论组织对大数据的使用时并不一定会被考虑。普通公众最关心的可能可能是隐私问题、对其数据被使用的同意问题以及数据泄露方面的安全问题。因此，本研究涵盖了数据隐私、使用同意和人工智能系统中的偏见这三个强制性方面。\n\
  \n## 2. 文献综述\n\n### 2.1 人工智能与大数据\n\n人工智能技术领域研究计算机如何通过对信息的感知、合成和推理表现出智能，这与人类和非人类动物表现出的智能有所不同(Ram\
  \ & Verma, 2023)。它涉及使用人类智能启发的算法来模拟人类解决问题的方法，最终创造出具有栩栩特征和动作的仿生机器人(Alkurd et al.,\
  \ 2020)。谈到大数据，它是用于描述收集、保存和检查的海量数据，旨在获取有见地的信息并在各行业中做出据有依据的决策(Rawat & Yadav, 2021)。数据的指数级扩张改变了决策过程，允许企业利用多种数据源进行运营和战略规划(Arena\
  \ & Pau, 2020)。研究显示大数据文献显著增加，强调了该领域的跨学科性质，以及从技术挑战向方法论问题的转变趋势(Tagay et al., 2023)。大数据和人工智能在当今的技术创新中交织，具有变革多个领域的潜力。得益于大数据分析与机器学习、进化算法等人工智能方法的结合，大型数据集可以得到准确高效的分析(Gomathi\
  \ Meena & Dharani, 2023)。这种整合从复杂数据结构中提取有见地知识和价值见解的能力激发了创新并改进了决策过程(Gandomi et al.,\
  \ 2023)。此外，人工智能和大数据在产品设计方法中的应用通过融合实时数据与消费者偏好及市场需求，转型了传统方法，提供了定制化智能化的设计(Quan et al.,\
  \ 2023; Rikap & Lundvall, 2021)。人工智能与大数据的融合不仅提升了生产力，还解决了智能系统和技术动态领域中的安全、治理和合规等问题(Quan\
  \ et al., 2023)。\n\n### 2.2 人工智能中的伦理考量\n\n\n\n\n\n希腊语单词“ethos”意为“性格”，是伦理（ethics）一词首次出现的地方。伦理学是哲学的一个分支，研究人在社会情境下的行为，为道德结论提供逻辑辩护，识别什么是在道德上是可接受或不可接受的，并区分道德上的公正与不公\
  \ (Pan, 2024)。为了 AI 技术的负责任开发和应用，对合理的论证、道德上的优劣以及公正与不公进行的研究，被称为 AI 伦理 (Gao et al.,\
  \ 2024)。AI 对大数据的利用引发了许多跨越多个领域的复杂伦理问题 (Schultz & Seele, 2023; Siau & Wang, 2020)。大数据驱动的\
  \ AI 应用引发了对数据隐私、操纵和滥用的担忧，这使人类和社会陷入了危险之中 (Agbese et al., 2023; Christoforaki & Beyan,\
  \ 2022)。AI 与大数据在社会科学研究中的融合带来了风险管理、受试者保护、方法论偏差和社会危害的问题 (Hermansyah et al., 2023;\
  \ Mensah, n.d.; Zohny et al., 2023)。AI 在社会系统（如社会计算）中的伦理影响也强调了在设计时考虑到社会利益、弱势群体以及负责任的数据收集和处理的必要性\
  \ (Bleher & Braun, 2023; Choung et al., 2023; Díaz-Rodríguez et al., 2023)。这些讨论强调了考虑伦理问题是多么重要的。\n\
  \n### 3. 研究方法\n\nAI 与大数据在社会科学研究中的融合带来了风险管理、受试者保护、方法论偏差和社会危害的问题 (Hermansyah et al.,\
  \ 2023; Mensah, n.d.; Zohny et al., 2023)。AI 在社会系统（如社会计算）中的伦理影响也强调了在设计时考虑到社会利益、弱势群体以及负责任的数据收集和处理的必要性\
  \ (Bleher & Braun, 2023; Choung et al., 2023; Díaz-Rodríguez et al., 2023)。这些讨论强调了考虑伦理问题是多么重要的。\n\
  \n### 4. 理论基础\n\n#### 4.1 信息与计算机伦理 (ICE)\n\nAI 算法中存在的偏差是一个严重关注的问题，因为 AI 算法在全球范围内越来越多地用于决策。尽管\
  \ AI 在辅助过程方面可能非常高效，但该过程的透明度存在争议。AI 算法可能是一个黑箱，并不清楚它是如何自我学习的。这一点可以从目前最流行的 AI 聊天机器人（如\
  \ `ChatGPT` 和 `Gemini`）是闭源且正在使用的事实得到进一步证明。任何人都可以在无人干预的情况下，使用数据集对它们进行训练。\n\n为了 AI\
  \ 技术的负责任开发和应用，对合理的论证、道德上的优劣以及公正与不公进行的研究，被称为 AI 伦理 (Gao et al., 2024)。AI 对大数据的利用引发了许多跨多个领域的复杂伦理问题。\n\
  \n#### 4.2 用于决策的 AI\n\n这些讨论为进一步的讨论提供了基础。这些讨论为进一步讨论提供了基础。使用 AI 制定政策涉及多个阶段。\n\n#####\
  \ 4.2.1 设定优先级\n\n在第一阶段，它通过分析通过各种方式收集的数据集，帮助决策者识别最紧迫的任务。它可以检测出可以指导决策的模式。例如，维多利亚政府使用\
  \ AI 对匿名数据进行高级文本分析以制定健康政策。同样，AI 也被用于法国的医疗领域 (Wirjo & Calizo, 2024)。\n\n##### 4.2.2\
  \ 制定决策政策\n\n在第二阶段，AI 可以直接导致决策。AI 快速评估大量数据并预测未来结果的能力可以帮助各个领域。例如，在经济领域，由 Salesforce\
  \ 创建的 AI 框架 `AI Economist` 已证明可以通过预测可能政策的成本和收益并正确识别目标群体来制定经济政策。联合国贸易和发展会议 (UNCTAD)\
  \ 也创建了一个 AI 来预测贸易政策对全球贸易的影响。\n\n##### 4.2.3 简化决策\n\n在第三阶段，AI 可以提高决策过程的效率。它可以模拟、测试和预测政策的可能影响。这将有助于加速决策过程。为了借助\
  \ AI 的帮助做出明智决策，了解大数据的来源以及这些数据是如何被提取用于分析的至关重要，因为这些是导致内在偏差并构成伦理问题基础的关键变量。\n\n### 5.\
  \ 为算法采集大数据\n\n\n\n\n明智的决策基于从广大受众中收集的实际数据。来自 Instagram、Twitter 和交易服务应用程序的定量数据以点赞、评论、推文和其他交易的形式被收集。定性数据则以问卷调查、在线论坛、博客等形式存在。它通过各种定性分析方法，产生可量化的结果。随后，提取适当的数据并将其组织成所需的结构。现在，可以训练机器学习算法来处理这些数据并识别所有可能的模式。这些模式一旦开发出来，就可以被用于预测“目标属性”。在投放市场之前，算法在目标预测中的有效性和正确性会经过详尽的分析和测试。在整个过程中，每一步都会产生多个关于数据主体知情和隐私的问题。通常情况下，对于个人可能希望保持隐私的个人信息的合规使用，并没有主动信息。这些海量数据拥有巨大的市场。\n\
  \n#### 5.1 大数据的固有偏见\n大数据使得能够根据海量的私有或公开数据得出结论。它通过引发如数据驱动决策等方法，改变了人们学习和获取知识的方式。目前，各种\
  \ AI 框架正将其作为资源，并应用于特定的决策问题中（Zhuang et al., 2017）。不准确性和误读是大数据应用所首要关注的问题之一。大样本量并非具有足够的代表性，足以做出影响人类生活的重大决策。大数据的巨大规模也导致分析师将其与“总体”的统计理想模型混淆，而实际上它是一个有偏的样本（McFarland\
  \ & McFarland, 2015）。大数据的公平性是伦理决策的首要考虑问题。\n\n#### 5.2 大数据并不等同于更好的数据，因为方法论问题仍然存在\n\
  以 Twitter 为例，说明了大数据如何在样本代表性和问责制方面提出挑战。它还提倡承认“小数据”的价值。小数据是一种取得了显著成功的策略，使各个学科能够取得飞跃式进展（Kitchin\
  \ & Lauriault, 2015）。那么，为什么我们必须完全转向大数据？下一个重点是使用大数据时语境的重要性。为了分析社交媒体平台上的信息和账户之间的联系，仅使用来自公开账户的数据是一项调查性工作。相比之下，用于通过问卷调查、访谈等工具收集人际关系数据的历史方法，强调了理解个人网络的价值。\n\
  \n#### 5.3 对大数据的访问受限\n至关重要的是要理解大数据的访问造成了数字鸿沟。对私有数据集的访问受到限制，大型公司是决定其数据如何被访问唯一权威。处理大数据所需的技能仅限于那些具有计算背景的人员。大数据的使用引发了对未来研究以及基于此构建的技术的影响的批判性反思。\n\
  \n#### 5.4 基于大数据的决策与 AI 偏见\n近年来，利用用户数据通过驱动机器学习/AI 算法做出决策的机构已成为备受关注的问题。AI 可以协助并直接引导各个领域的决策，包括但不限于经济、教育、医疗健康、税收和社会领域。在这些领域中，它可以为优化、福利、反欺诈检测、个性化等创建决策。各国为了各种目的收集用户数据是常见做法，以做出影响用户生活的预测和决策。数据收集的方法多样，从传统的人口普查调查到使用先进监控技术，如监控在线活动、追踪手机位置以及使用人脸识别。算法被应用于多个领域，包括医疗健康、执法和社交服务，然而，使用用户数据驱动\
  \ AI 算法引发了对偏见被放大和延续的担忧。算法依赖于训练数据，如果这些数据存在偏见或不完整，算法产生的结果可能存在偏见。AI 算法被发现存在与性别、种族、民族和犯罪记录等因素相关的偏见。这些偏见对可能受算法决策公平影响的用户产生深远影响。种族和民族偏见的一个例子是执法中的\
  \ AI 算法，这些算法因不成比例地针对少数社区而受到审查。预测执法算法在人脸识别技术的情况下被考虑到。在一项评估此类差异的研究中显示，浅色皮肤男性的最高错误率为\
  \ 0.8%；然而，深色皮肤女性的错误率高达 34.7%（Buolamwini & Gebru, 2018）。而且数据集主要由浅色皮肤受试者组成。这表明脸识别算法在识别深色皮肤个体时错误率更高，导致有色人种中出现不成比例的错误识别和误报。这对外执法和监控实践具有重大影响。\n\
  \n\n\n\n虽然 AI 并不直接编写立法，但它越来越多地被用于分析数据和建议策略，从而塑造对公民产生重大现实世界影响的政策。它可以实现任务自动化，从而更快速地处理申请、减少官僚主义，并可能改进服务。使用\
  \ AI 进行政策制定过程分析引发了一些显而易见的问题：在全球范围内，有哪些采用 AI 算法的政策/结构？这些政策又是如何转变并影响公民生活的？让我们探索 AI\
  \ 正在发挥主要作用三个当前及未来政策领域，并审查其影响和公众反响。\n\n## 刑事司法系统\n在刑事司法系统中，AI 算法被用于预测再犯率等任务，以确定保释金额和假释资格。支持者认为这提高了效率并降低了监禁成本。然而，批评者指出用于训练这些算法的数据存在固有的偏见。例如，如果根据过去的逮捕数据来构建模型，它可能会延续种族定型，导致少数族受到更严厉的刑罚。这引发了愤怒，诸如“黑人的命也是”等运动要求不受\
  \ AI 偏见污染的更公平的司法系统 (Lageson, 2023)。\n\n## 智慧城市与社会福利\nAI 驱动的“智慧城市”计划利用摄像头和传感器来管理交通流、优化资源分配甚至监控公共安全。支持者对效率和安全的提高表示赞赏，但隐私侵入担忧也随之产生。公民可能会感到被不断监控，一举一都被追踪和分析。关于安全与个人自由之间适当平衡的辩论异常激烈\
  \ (Galič, 2022)。\n\n社会福利计划日益将 AI 用于福利分配和欺诈检测。虽然 AI 可以简化流程并识别欺诈索赔，但也可能导致对公民的冷漠和不公正对待。算法可能会错误地拒绝那些符合条件的人获得福利，造成困难和挫败感。此外，一些人担心此类系统可能会创建一个信用体系，政府服务将与\
  \ AI 决定的公民“价值”挂钩 (Ramond, 2024)。\n\n## 公关、医疗与金融科技\n大数据和 AI 通过实现受众参与、结果衡量和价值创造的新方法，也正在彻底改变公关（PR）领域。美国、日本和英国等发达经济体已将其用于公关活动，这引发了伦理和法律问题。为了目标活动收集和分析大量个人数据引发了关于同意和隐私的伦理问题\
  \ (James, 2024)。\n\nAI 在医疗和医学教育中的应用同样在扩大，使得伦理应用担忧比以往任何时候都更加关键。AI 增强了医疗程序，包括成像、预后、诊断支持和治疗建议。围绕医疗领域\
  \ AI 的伦理和社会担忧与个人数据使用、功能自动化、对辅助医疗设备的依赖以及“远程医疗”的担忧 (Leimanis & Palkova, 2021)。美国医疗提供者正利用\
  \ AI 算法来帮助他们对患者护理做出判断，包括哪些患者需要特殊关注或获得医疗权限。加州伯克分的研究的研究人员算法中发现了种族偏见的迹象 (Obermeyer\
  \ et al., 2019)。\n\n大数据分析和 AI 已被金融科技公司用于评估多个来源的海量数据，并生成独立的建议或评估 (Li et al., 2022)。通过结合\
  \ AI 和大数据，金融科技公司可以提供更个性化的金融服务，提高运营效率并降低成本 (Ashta & Herrmann, 2021)。但 AI 与数据的结合也面临隐私和伦理挑战，包括与所有权、控制、公正、透明度、偏见和歧视相关的问题\
  \ (Hermansyah et al., 2023)。AI 驱动的信用评分或贷款审批程序缺乏透明度，可能会不公平地损害某些人，影响他们的机会和财务稳定 (Laksamana\
  \ et al., 2023)。\n\n## 招聘\n企业对 AI 和大数据的使用完全改变了招聘流程。AI 系统可以提供熟练的自动化招聘系统，企业可以利用该系统根据申请人的资质选择最合适的人选。在视频面试中，许多公司正转向根据若干属性对候选人进行评分的算法\
  \ (Li et al., 2021)。然而，最近的几个应用存在违反平等法的伦理问题；显然招聘过程是不公正且具有歧视性的。在招聘方面，无意识的种族主义、年龄歧视和性别歧视是主要因素。承认并减少这些偏见至关重要\
  \ (Gonzalez et al., 2022)。\n\n## 7. 发现：为基于 AI 的政策利用伦理生态系统\n\nAI 对政策制定的影响不可否认。虽然它提供了提高效率等潜在利益，但它对公民生活的影响可能是深远的。解决对偏见、透明度和隐私的担忧至关重要。开放对话、公众监督和健全的对于确保\
  \ AI 保持作为良工具而非社会分裂和控制的力量至关重要。通过负责任地利用 AI 的力量，我们可以构建一个技术赋能公民并促进更加公正公平社会的未来。由于这些原因，必须在各个层面执行某些措施，以确保在宪法范围内负责任地使用\
  \ AI。有必要调查限制用于政策制定目的 AI 算法使用的结构、其当前领域，以及这些机构是否成功实现了安全且负责任的 AI 使用目标。在大多数打算部署 AI 算法的政府组织中，监管政策制定的\
  \ AI 框架仍处于开发阶段。\n\n### 7.1 组织层面\n\n\n\n\n\nIBM 等大型公司已任命了由各种 IBM 利益相关者组成的“AI 伦理委员会”，用于审查并对各种政策和产品做出决策（IBM,\
  \ n.d.）。尽管有关 AI 伦理委员会的信息已经公开，但关于这些委员会成员如何被任命以及以何种方式获得决策权的信息非常少。在光谱的另一端，非常值得注意的是，微软最近解散了负责确保其\
  \ AI 服务和工具做出负责任决策的“伦理与社会团队”（Newton, 2023），转而选择保留一个“负责任 AI 办公室”。报告声称，伦理团队为了保护消费者利益而提出的建议被微软否弃了。这些表述使我们相信，此类公司中的伦理委员会对\
  \ AI 产品的决策没有最终决定权。因此，在确保 AI 负责任且符合伦理的实施方面，这些委员会并没有那么重要；因此，可以推测机构设立被动的伦理委员会只是作为替罪羊，用以分散\
  \ AI 产品开发中的问责和责任问题。仅仅是知道此类伦理委员会的存在，也能给消费者带来某种慰藉和满足感，因为普通客户不会深入研究这些委员会所拥有的实际权力。\n\
  \n## 7.2 国家层面\n\n从宏观角度来看，一份旨在监管美国 AI 产品和服务的公开文件《第 13960 号行政命令》指出，在法律、秩序和公民安全的范围内鼓励发展\
  \ AI。其政策还涉及了在利用 AI 算法的政府政策部署时，必须维护的责任问题（Federal Office of the President, 2020）。然而，这些规则并未明确说明机构需要以何种具体方式提交监控记录以确保流程的透明度。不遵守这些政策的后果也未明确。在文档末尾还明确指出该命令不适用于国防部使用的\
  \ AI，且未对此提供进一步解释。即使像美国这样的大国正在确保 AI 在某些限制内部署，这些法规也未能确保作为算法主体的公民（而非仅仅是政府）获得透明度。处理欧盟居民个人数据的\
  \ AI 系统受到《通用数据保护条例》（GDPR）的影响，该条例确立了欧盟数据隐私的标准。特别是，这些法规对许可（知情）、数据最小化和解释权的强调，与 AI 的透明度和问责制密切相关（Patel,\
  \ 2024）。\n\n## 7.3 全球层面\n\n在国际上，拥有 30 多个成员国的跨国组织经济合作发展组织（OECD）建立了 `OECD.AI`。`OECD.AI`\
  \ 被描述为塑造信赖 AI 的论坛（Aaronson, 2022）。它还制定了成员国必须遵守的 AI 原则。遗憾的是，没有办法确保它涵盖大量准备好遵守这些原则的成员国，因为加入\
  \ OECD 的决定也受到多种社会政治因素和成员国间国际关系的影响。可以说，还没有一套适用于地图上所有国家的详尽规则，既能保护公民免受 AI 滥用，又能确保机构问责并保持流程透明。联合国是一个大型国际组织，除了在其系统中制定了确保\
  \ AI 限制的原则外，尚未针对这一问题提出策略。\n\n## 8. 结论\n\n\n\n\n\n# AI 算法在治理中的影响\n\n现在，我们可以关注无节使用基于\
  \ AI 的算法带来的直接影响和后果，并通过详细的示例和 AI 为生活引入的迷人特性，探讨 AI 在治理中的未来可能包含的内容。数字时代是一个算法群岛，这是一个算法塑造体验（无论喜欢与否）的广阔景观。个性化是为个人用户提供与其相关的信息和服务的一种方式。虽然这种做法是理想的，但\
  \ AI 算法也引发了人们对其对生活产生巨大控制力的担忧。\n\n算法根据过去的行为筛选信息，创建了我们所谓的“过滤泡泡”，这强化了现有的信念（Samuels,\
  \ 2012）。许多社交媒体平台如 Facebook 和 Instagram，通过推荐往往证实用户偏见的内容来提高参与度（Leonidas et al., 2017）。这可能导致社会出现不希望看到的两极分化。例如，在\
  \ 2016 年美国大选中，过滤泡泡可能导致虚假信息的传播，从而影响了选民（West & Bergstrom, 2021）。\n\n它们还可能因为训练数据而继承并放大社会偏见。例如，众某些面部识别软件对浅色肤色更准确，这可能导致歧视性的执法行为。现在，这是否是因为模型训练数据中有更多浅色皮肤的人完全是另一回事，但归而言，这是我们将面临的众多挑战之一。如今，甚至简历筛选也是使用这些算法完成的，如果我们不够仔细，算法可能会根据与工作完全无关的事过滤掉候选人。这引发了人们对机会均等的担忧，甚至可能引发基于算法偏见的法律诉讼。\n\
  \n随着算法变得越来越复杂，它们甚至可能开始左右我们做出的选择，即使它们的设计并非如此。所谓的“推荐系统”可能会引导我们走向特定的产品和服务，在我们在不知情的情况下限制我们的选择。随着社会对算法的依赖程度日益增加，对透明度的需求也日益增长。了解这些算法如何工作以及它们训练所使用的数据对于它们的问责制至关重要。目前有许多努力致力于制定法规，以促进算法决策的透明度和公平。例如，欧盟的《通用数据保护条例》（GDPR）赋予了个人访问和控制其在算法中使用的个人数据的权利。\n\
  \n我们关注的另一个挑战是这个数字时代虚假信息和“假新闻”的传播。那些被编程（或未编程）为促进参与度而非真实的算法可能会放大此类事物的影响，从而创造出虚假的叙事。此外，某些算法（如\
  \ ML 模型或 DL 模型）的不透明性为追踪它们推荐了哪些内容带来了困难（Esteves, 2022，第 39–59 页）。\n\n总之，在这一数字时代，算法群岛既带来了挑战也带来了机遇。虽然个性化和便利性不可否认的优点，但潜在的负面影响不能被忽视。为了实现这一景观的可持续增长，我们必须留意赋予这些算法的权力。提高透明度、制定法律框架以解决可能产生的偏见，以及促进批判性和伦理性思维，对于确保算法服务而非奴役我们的人性至关重要。从研究角度来看，可以得出结论：在部署完全基于十年大数据收集的\
  \ AI 系统决策能力时，围绕大数据的担忧可能表现为可访问性、脆弱性、代表性等形式。\n\n## 9. 未来的困境\n\n人们需要深思，究竟谁应该对大数据使用的局限性和后果负责——是收集数据的大型公司，还是使用数据的研究人员？而且即使通过某种方式规定了责任制，负责的人员或系统究竟将如何去消除现有的大量使用大数据的机制？对这些系统了解甚少的普通公众如何才能确保他们的数据被正确使用？这些是那些拥有必要资源和知识（因此拥有权力）的个人和组织仍不回答的问题。\n\
