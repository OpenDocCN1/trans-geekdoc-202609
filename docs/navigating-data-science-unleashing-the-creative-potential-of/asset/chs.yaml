  \ 工程学院\n\n^c\n\n### 摘要\n\n在当前的市场趋势中，生成对抗网络（GANs）和生成式预训练变换器（GPTs）正深刻地改变着内容营销。数据分析师和营销人员预测趋势、清理活动以及提供定制化客户体验的能力提升了业务发展。生成式人工智能（AI）对营销人员来说是一个重大挑战，因为它引发了数据隐私、伦理困境、内容创作中的偏差以及误导性信息等伦理关注。确保数据使用需要为\
  \ AI 生成的数据建立监管框架。营销人员和数据分析师在采用平衡 AI 应用的最佳实践时应保持警惕。本研究通过回顾 Scopus 数据库中 2002 年至 2023\
  \ 年的文章，探索了营销与 AI 的交叉领域。该研究旨在为当前竞争研究中基于 AI 的分析提供全面概述。它采用系统方法，利用 Scopus 数据库和结构化研究问题审查现有文献。重点是评估研究格局，识别关键的\
  \ AI 情感分析方法，并理解与该技术相关的挑战与机遇。虽然情感研究目前是一项价值工具，但它的价值不在于其收集的数据，而在于如何利用这些数据来驱动有意义的行动。营销中潜在的\
  \ AI 集成需要适当的监管条款和清晰的道德实践。AI 的潜力在于其增强我们对客户理解并引导我们走向更有效策略的能力。\n\n**关键词**：生成式 AI；伦理考量；数据隐私；监管框架；消费者行为\n\
  \n## 1. 引言\n\n人工智能（AI）在营销中的应用可以追溯到 20 世纪 50 代，当时计算理论的进展为基于规则的系统和机器学习（ML）算法奠定了基础。专家系统和执行信息系统在\
  \ 20 世纪 80 年代后出现，使营销人员能够使用 AI 进行客户画像、推荐和业务运营决策。20 世纪 90 年代的大数据标志着该领域向数据挖掘和预测分析的转变，允许营销人员从海量数据集中获取特定受众的洞察。自动化和机器学习在\
  \ 21 世纪初变得流行起来，彻底改变了内容营销个性化和电子邮件营销等流程。21 世纪 10 年经历了自然语言处理（NLP）的巨大进展以及聊天机器人的广泛使用，这彻底了对话营销。今天，生成式\
  \ AI 技术使营销人员能够创建超个性化的内容，并交付与个人消费者产生共鸣的定制体验，凸显了 AI 在营销中不断演进的变革影响。\n\nAI 正在创造一个新时代并变革营销的新格局，提供创新的工具和技术来增强客户参与、个性化体验并优化营销策略。通过利用\
  \ AI，企业可以更深入地了解消费者行为，预测市场趋势，并开展更具针对性且有效的营销活动。\n\n生成式 AI 指能够让计算机从现有数据创建新的、原创内容的机器学习算法。这项技术通过提高客户满意度、效率、个性化和创造力，具有变革各行业的潜力。生成式\
  \ AI 模型基于学习到的模式和示例进行训练，以产生独特的内容，如文本、图像和音乐。这些算法在不需要人类直接干预的情况下生成真实的输出。\n\n生成式 AI 是营销领域的游戏规则改变者，彻底了品牌与受众互动以及创建内容的方式。它的力量在于大规模生成高度个性化、相关且吸引人的内容，利用数据和算法推动营销策略向前发展。\n\
  \n品牌与受众互动并生产内容的方式正被生成式 AI 完全改变，它是营销领域的游戏规则改变者。它大规模生产高度定制、相关且迷人内容的能力——利用数据和算法推动营销策略——正是赋予其力量的来源。\n\
  \n### 2. 研究目标\n\n\n研究的重点是评估研究格局，识别关键的基于 AI 的分析方法，并理解竞争研究中该技术相关的挑战与机遇。\n\n### 3.\
  \ 影响营销因素的 AI 工具\n\n\n图 2.1 营销 AI 工具的新时代。*来源：* 作者关于营销中当前 AI 数据科学工具的框架。\n\n#### 3.1.\
  \ 个性化营销\n\n通过进行消费者分析，在营销活动中被优先考虑。行为模式也可以通过个性化产品推荐、电子邮件信息、产品推荐和针对目标广告的内容创作来理解。\n\n\
  这些数据为创建针对每个个人客户定制的个性化信息、推荐和营销活动提供了基础。AI 允许投放满足每个客户独特需求和偏好的广告 (Lee et al., 2022)。传统的个性化营销策略通常涉及细分和基于规则的技术。相比之下，AI\
  \ 方法使用先进的机器学习算法来评估客户信息并做出预测。AI 在个性化营销中的优势在其效率和准确性的提高显而易见。然而，它也引发了关注，特别是关于隐私和高成本。\n\
  \n##### 3.1.1 AI 驱动的聊天机器人\n\n在当今的市场活动中，AI 驱动的聊天机器人和虚拟助手被用于客户服务、客户线生成和销售支持。这些 AI\
  \ 驱动的服务将为您的营销活动提供即时结果。这将改善客户体验。\n\n人机交互与营销中聊天机器人的使用密切相关。Kaczorowska (2019) 认为，聊天人在社交媒体活动中很有用，因为它们提供了理解和评估现实的预定义信息。聊天机器人被应用于营销技术。设计良好的聊天机器人可以通过协助处理不同的交易阶段帮助客户节省时间和精力。聊天机器人也是所有企业的差异化因素，使其在竞争中脱颖而出。与市场上有的程序相比，聊天机器人更友好、更真实、更具人性，特别是在建立联系、进行讨论和尝试建立关系方面。\n\
  \n\n\n聊天机器在客户服务中扮演着重要角色，大多数客户服务通过聊天机器人完成，因为它们在许多数字平台上通过解决查询为客户提供快速支持。AI 驱动的聊天机器人使用自然语言处理（NLP）和机器学习（ML）来理解消费者查询、提供相关信息并实现便捷交易。由于其全天候可用且响应迅速，聊天机器人是提高客户满意度和参与度的有效工具之一。此外，通过以用户偏好和之前的互动为基础，聊天机器人可以为客户提供定制化的建议和解决方案，以获得更好的体验。聊天机器人为客户提供了更好的平台，通过持续学习和发展更好地预测并满足客户需求，这有助于提供更高效、多产的客户体验。\n\
  \n### 3.1.2 AI 预测性分析\n\n预测性分析用于理解市场预测。在当前的 AI 生成市场中，消费者行为已通过大数据集进行分析，预测营销未来变得非常容易。这有助于做出基于数据的决策，并为业务优化合适的营销策略。\n\
  \n有一项研究基于以下假设进行：管理意识在 AI 预测性分析与营销策略之间起到中介作用，也就是说管理意识在预测营销策略方面发挥着主要作用，这一点通过分析得到了证明。结果发现，管理意识能够在\
  \ AI 与营销策略之间建立关键的链接。营销工作通常涉及大量数据，AI 可以根据需求对数据进行分类和改进 (Alshaketheep et al., 2024)。因此，AI\
  \ 在营销中的作用很可能是混合的，即 AI 应用和分析提供与营销策略相关的洞察和信息，但经理必须根据自己的需求对数据进行修改。\n\n### 3.1.3 语音搜索优化\n\
  \n这是所有营销人员都用于吸引客户对产品获得良好体验的工具之一。随着 Siri 和 Alexa 等语音助手的兴起，营销人员正在针对语音搜索查询优化其内容。这涉及使用自然语言关键词并创建语音友好的内容。\n\
  \n技术营销工具的使用意味着数据传输协议的发展，以确保许多数字技术的整合将产生协同效应。`APIs`（或应用程序接口）的设计是为了与不同的软件接口协同。因此，网站和\
  \ DMP 平台与 `CRM` 通信。接下来，当客户在网站上填写购买表单时，他也提供了 `CRM` 数据，而 DMP 平台决定了客户的来源、将其带到网站的成本、他在那里做了什么以及如何最好利用与他的联系。\n\
  \n虚拟现实（VR）和增强现实（AR）都是虚拟和增强的。通过使用特殊眼镜，人们可以体验到被称为 `VR` 的人工构建现实。通过使用专业软件，`AR` 通过在虚拟环境中展示物品并提供以特定方式与之交互的能力，强调了现实世界中物品的包含。因此，他们在进行房地产营销时，采用了公寓的虚拟表示，潜在买家可以对这些进行数字化的装饰和翻新。`AR`\
  \ 技术允许在完成交易的同时最大限度地降低风险，节省时间、金钱和精力，并增强购买的情感吸引力。这在不需要脱离现实世界和使用自动语音代理的情况下实现。\n\n###\
  \ 3.1.4 内容生成\n\n使用 AI 和 AI 工具可以非常容易地生成产品广告，AI 工具正被用于生成内容、产品描述以及社交媒体帖子。\n\n\n AI\
  \ 有能力为客户提供个性化的品牌体验，从而提高用户参与度和客户忠诚度。客户不必独立购买，相反可以依靠 AI 聊天机器人进行购买。AI 服务于从之前的错误中进行更好的基于语言的学习，并让客户随着时间的推移获得更好的结果，它帮助营销人员理解客户兴趣。通过观察、数据收集和分析，AI\
  \ 促进了内容个性化。这项技术对于电子邮件营销特别有利，帮助营销人员优化他们的工作。电子邮件营销是一种确保有效转化策略并触达目标观众的数字营销服务（Haleem\
  \ et al., 2022）。AI 在营销中的显著优势是其数据分析能力，允许营销人员从海量数据中获取可操作的洞察。\n\n### 3.1.5 AI 自动化工具\n\
  \n它为营销人员减少了构建邮件的时间，促使营销人员在这个竞争激烈的世界中更容易通过更好的营销策略来销售产品。营销人员面临的另一个重要工具问题是数据隐私和对 AI\
  \ 算法理解理解。营销人员具有足够的意识，对伦理 AI 实践的关注提供了透明度和公平，并让每个营销人员对客户数据负责。\n\n营销自动化涵盖了营销决策的多个方面。进一步的\
  \ AI 自动化“提供了更高的生产力、更优的决策、更高的营销回报以及更高的客户满意度和忠诚度” (Heimbach et al., 2015)；营销决策支持的自动化定制是营销自动化的要素。如今，业务环境会自动产生大量数据\
  \ (Bucklin et al., 2002; Hoffman et al., 2022)，允许营销人员使用营销自动化软件识别偏好、创建有效的建议，并对客户、竞争对手和影响者的行为做出适应性反应。根据某些软件和算法建立的标准，数据的丰富使得自动化营销决策变得更容易。使用社交媒体或搜索引擎分析来激活定向广告是这些算法利用数据输入分析来开发预测和行为的一个例子。\n\
  \n\n\n\n使用过计算机营销系统的营销人员被迫重新诠释启发式原则的应用，同时还在扩大他们的触达范围。营销人员认为技术变革是重大的，但与自主营销系统产生的新环境相比，学习和适应的能力显得尤为明显。在为新系统提供输入、监管其运行以及评估其结果方面，这些新系统的利用改变了决策任务的量，更重要的是改变了决策任务的**质量**。换句话说，自动化似乎改变了启发式决策模型的应用领域（范围），而非取代它们。\n\
  \n### 3.1.6 情感分析\n\n有效的战略竞争研究需要了解消费者对竞争对手的感知以及影响这些感知的因素。这将有助于确定不同公司组成部分的实际优缺点。通过市场研究为业务目的收集的信息就包含在。实现这一目标的最佳方法之一是文本分析和情感分析。为了根据消费者感知生成报告，情感分析将品牌的产品和服务与其竞争对手进行对比。这些具有洞察力的数字可以帮助品牌从对手中脱颖而出。企业开始将\
  \ AI 驱动的情感分析视为一种关键工具（Taherdoost & Mitra, 2023）。它更容易理解客户在想什么。它对于理解员工的想法和情感也有帮助。它通常用于理解客户评论、社交媒体提及、服务问题的严重性等。可以认为，情感分析在未来将被用于更详细地探索人们的情绪。它将增强计算机理解评论、信息和反馈中所述情感的能力。结果是公司将能够做出更具体的反应。此类研究的内容是回顾关于基于\
  \ AI 的情感分析的文献，以便为未来的研究人员提供对领域进展更好的理解，并帮助他们跟上当前的发展。\n\n情感分析使营销人员能够通过定量方法对服务或产品消费者的态度和观点获得深刻且可靠的洞察。一个应用领域是营销，这使得能够识别社交媒体网络上关于产品、服务、公司和旅游目的偏好、态度和观点。在词云中，高频词排列在中心位置，并显示的字体大小与该词在文中出现的频率相对应。这正是分析的独特价值所在。本研究提供了对以\
  \ `Mostar` 为旅游目的地进行情感分析所需的所有 `R` 编程语言特征和情感分析程序。由于其实时转换大量文本数据的能力，它是营销分析的一个非常有用的工具。\n\
  \n在营销 AI 工具应用中，研究人员引入了 `GPT-3`，这是一个最强大的生成式 AI 模型，最能够生成类人文本 Radford et al. (2019)。论文还讨论了营销中的应用，包括针对社交媒体帖的个性化通信和内容生成等。\n\
  AI 在识别营销模式方面比人类更有效，并能更快地响应新信息，在业务决策方面，AI 正在取代人类提供准确的服务解决方案（Gkikas & Theodoridis,\
  \ 2020）。一种 AI 的方法帮助公司节省时间和金钱。此类研究的内容是回顾关于基于 AI 的情感分析的文献，以便为未来的研究人员提供对领域进展更好的理解，并帮助他们跟上当前的发展。\n\
  \n\nAI 已经整合到数字营销中并提高了有效性 [Aslam (2022)]。流行的社交网络如 `Facebook`、`LinkedIn` 等采用 `ML`\
  \ 模型来推荐用户关注、识别图像等。根据 Gartner 2019 年的数据，有 37% 的企业利用 `AI` 进行内容管理和策展。`ML` 和 `NLP` 模型可以通过分析品牌的历史表现来获取社交洞察。我们每天使用的社交网络，如\
  \ `Facebook` 和 `Twitter`，严重依赖于 `AI`。Facebook 识别标记照片中的面部，显示广告，发送与用户已互动过的类似的弹出窗口。Facebook\
  \ 还拥有 `Instagram`，这是一个使用 `AI` 识别和删除欺诈内容的社交媒体平台。Snapchat 跟踪用户的面部，并使用 `computer vision`（一种\
  \ AI 技术）添加随面部实时移动的特效。\n\nLinkedIn 使用 `AI` 帮助广告主定位目标观众、衡量转化率、在动态中显示特定信息、推荐他们可能想要联系的职位，以及自动竞价\
  \ ([Kaplan & Haenlein, 2020]; [Kessinger, 2022]）。\n\n\nAI 工具在营销活动中的应用已经出现且不可替代（[Jarek\
  \ & Mazurek, 2019])。作者在本文中讨论了针对客户的个性化以提高客户体验和客户参与度，这将提高客户转化率。尽管处于早期阶段 [Khoa (2021)]，但\
  \ AI 已经通过网站聊天机器人、手机虚拟助手和用于解释语音命令的 `NLP` 集成到日常活动中。\n\n\n发现 AI 驱动工具在营销中发挥着主要作用，我们正处于\
  \ AI 驱动的市场 [Tuzhilin (2020)]。论文强调了营销的未来趋势以及对营销人员和消费者的潜在利益。AI 工具帮助他们制定营销策略。\n\n\n\
  \n\n\n根据不同的品牌因素，AI 通常被用于衡量品牌评估 Nufer and Muth (2022)。AI 也可以通过追踪客户旅程的整个生命周期来增强客户旅程，从提高品牌意识到培养忠诚度和品牌资产（Rana\
  \ et al., 2022)。企业可以通过使用聊天机器人、推荐系统、AI 驱动助手和交互式语音识别 (`IVR`) 等基于 AI 的解决方案来提高知名度、`CRM`\
  \ 和整体客户忠诚度。近期，AI 通过增强各个阶段的客户体验，对营销产生了深远影响。值得注意的是，中小型企业现在可以获得以前只有大公司才拥有的资源 (Kupec\
  \ & Pisar, 2021; Oosthuizen et al., 2021)。神经网络为营销人员提供了动态工具，以更好地理解消费者行为、开发复杂的买家细分、自动化营销任务、创建内容并预测销售。这些工具能够处理大型数据集以生成更具意义的洞察。通过利用以往活动中的模式，营销人员可以使用预测性分析来预测活动结果。虽然神经网络已经存在了一段时间，但对处理大数据日益增长的需求使得这些系统变得更加动态和智能\
  \ (Hassan & De Filippi, 2021; Mgiba & Nyamande, 2020)。\n\n## 8. AI 自动化\n\n在 2018,\
  \ Davenport and Ronanki 中。这篇文章讨论了 AI 在多个业务部门的实际应用，包括营销领域，该领域通过个性化解释了客户参与度。它还强调了如何通过\
  \ AI 工具实现运营营销活动的自动化，从而将营销人员解放出来，让他们专注于创性的营销策略。\n\nTaddy (2018) 探讨了 AI 技术的潜在进展以及营销领域可能受到的影响。他密切关注营销中应用\
  \ AI 所引发的道德困境，特别关注了偏见和数据隐私问题。Taddy 强调，营销人员正面对这些问题至关重要，以确保 AI 技术的伦理和负责任应用。\n\nChaffey\
  \ and Ellis-Chadwick (2019) 提供了数字营销策略的全面概述（注：此处原文结构不完整），他们强调了 AI 和数据高级分析重要性。他们的研究为如何利用这些技术实现组织目标并提高营销效能提供了有益的见解。Van\
  \ Esch and Black (2021) 这篇文章解释了 AI 如何改进数字营销，并探索了其重大进展及其未来的实际影响。它还讨论了 AI 与数字营销中各种活动的潜在转型。Brei\
  \ (2020)。从这篇文章中，探讨了 AI 和 `ML` 如何影响营销工作流。在当前情况下，AI 和 `ML` 在日常运营活动中是不可分割的。Ljepava\
  \ (2022) 研究描述了 AI 工具在营销中的全面使用，以及它对营销决策的帮助。它还发现了 AI 对营销过程和企业策略制备的影响。Waller and Fawcett\
  \ (2013) 探索了供应链管理中的 AI 工具应用，以及预测分析和大数据的进阶技术，并讨论了预测性分析和大数据对供应链管理的影响，并将这些进展与其对营销和战略决策的影响进行类比。\n\
  \n\nBenkert (2019) 关于营销中 AI 的伦理问题得出结论认为，AI 在营销中的应用存在八个突出的伦理问题，如数据隐私、客户数据偏见、使用 AI\
  \ 的营销人员的责任、数据透明度，以及营销人员无法理解伦理价值及其对社会影响的影响，它以许多方式影响社会活动。在营销中使用 AI 引引起了对其对消费者行为影响的担忧。许多学术研究已经探索了预测营销系统及其影响消费者选择的能力，尽管是在不同的背景下进行的\
  \ (de Marcellis-Warin et al., 2022)。目前，组织经常在征得许可之前采取行动，并在以后需要时提交歉意声明。这种策略是不可接受且不可持续的。大量的私人信息在人们不知情或未经同意的情况下被收集；更少的人意识到这些数据的可能用途。这些伦理问题需要政府以及致力于坚持不伤害原则并真正服务公共利益的研究人员给予最大的关注。\n\
  \n\n数据科学在 AI 中发挥着最重要的角色。AI 处理广泛数据格式的能力是另一种所需的数据格式要求。除了解释数值数据外，AI 还可以理解文本、图像和语音输入，为后续评估提供背景和意义\
  \ (Dhar, 2016)。无监督学习仍然具有挑战性。该领域预计将看到更多的活动，特别是关于非结构化数据，这类数据远超结构化数据并持续增长。虽然许多此类数据是聊天内容，一旦设计人员或机器本身学会解释它们，未来机器可以使用这些价值内容。然而，机器在处理许多人类轻松完成的简单无监督任务方面仍然面临困难。实现达到人类能力的\
  \ AI 仍然是一个远的目标。\n\n\n如今的营销正在研究去年出现的生成式 AI。目前最大的问题是对生成式 AI 的了解，许多营销人员正在努力学习，它确实从根本上改变了营销世界。在营销中，AI\
  \ 工具帮助营销人员理解客户细分、寻找有购买倾向的新客户、产品推荐、销售、客户支持活动、广告信息创作、社交网络响应生成、行为研究、预测购买行为的算法等。\n\n\
  \n### 12.1 超个性化\n\n通过 AI 分析海量数据，我们可以利用情感分析发现客户的偏好和行为，从而提高客户参与度、转化率和忠诚度。\n\n### 12.2\
  \ 客户洞察与分析\n\n与传统技术相比，AI 驱动的分析工具可以更快地处理和解释探索数据集。AI 提供了有关消费者行为、消费者体验、行业未来趋势以及广告活动有效性的信息，协助营销人员做出数据决策。\n\
  \n### 12.3 预测性分析\n\nAI 能够根据历史数据预测并理解客户和消费者行为的未来趋势。这使得营销人员能够更有效地针对活动、优化库存并主动响应客户需求——从而改善结果并节省成本。\n\
  \n\n\n\n\n## 12.4 自动化内容创建\n\nAI 驱动的工具可以快速、大规模地生成内容，如产品描述、社交媒体帖子甚至文章。这有助于保持一致的内容输出，并将人力资源释放出来用于更具战略性的任务。\n\
  \n## 12.5 聊天机器人与客服\n\nAI 驱动的聊天机器人和虚拟助手通过管理例行问题和任务提供即时客户帮助。通过及时回答，这提高了客户满意度，并释放人工坐席处理更复杂的问题。\n\
  \n## 12.6 广告投放与程序化广告\n\n通过评估用户数据，AI 通过向适当的众展示更相关的广告来改进广告投放。AI 驱动的程序化广告通过自动化实时广告购买优化广告支出并提高投资回报率。\n\
  \n## 12.7 SEO 与内容优化\n\n企业网站的优化对所有企业都非常重要，AI 技术分析趋势、关键词和竞争策略，以帮助优化搜索引擎网站内容。这带来了更好的搜索引擎排名和更多的自然流量（图\
  \ 2.1）。\n\n\n本文研究了营销领域中生成式 AI 日益的研究领域。通过审视生成式 AI 的出现，标志着数据科学领域进入了一个变革性时代。这些创新理念为营销决策中的创造力和解决问题的能力提升了新水平。它提升了营销人员理解消费者行为的分析能力。AI\
  \ 数据科学和预测分析的发展将使为营销活动创建有效的生成式 AI 模型成为可能。使用生成式 AI 的主要问题以及在缺乏数据的情况下的应用速度。生成式 AI 为解决营销中的许多问题提供了新的业务模式、机会和可能性。它预见了市场上的新产品、营销人员的新策略以及面向客户的新服务，从而在现实世界中发展业务（Fornazaric,\
  \ 2023）。\n\n\nAlshaketheep, K., Mansour, A. M., Al-Ma’aitah, M., Dabaghia, M., &\
