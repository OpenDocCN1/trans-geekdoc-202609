  trans: '


    为了引导组织通过数据科学和人工智能的采用过程，医疗保健生态系统必须对他们的发展的方向有一个共同愿景（参考图 1.1）。这一愿景是使技术采用过程成功的首要要求之一。将技术采用与公司的长期盈利能力相结合也至关重要，这样每个人都能意识到在不断变化的业务环境中成为一名“协作者”（coriander）的重要性。组织通常会忽视特定的技术愿景，但考虑到新时代创新为组织提供可持续性和竞争优势的重要性，这种发展是必不可行的（Shalender
    & Yadav, 2018, 2019）。高层在这一发展过程中必须听业务和职能部门人员的意见；这些人将直接负责公司数据科学和人工智能策略的实施。如果整个医疗保健生态系统都能对技术采用制定一个共同愿景，并通过分担进行这种数字化转型所需的资源，医疗保健领域的组织可以在过程中节省大量资金。因此，医疗保健公司必须关注技术愿景的发展，并将其与组织的整体目标、目的和价值观对齐。


    ## 3.2 从小做起


    第一个建议是以渐进的方式采用这些技术，而不是改变整个系统并用技术部分替换，最好以实施的方式开始使用数据科学和人工智能（Shalender & Sharma,
    2022）。这不仅可以节省与技术采用相关的成本，还将帮助组织应对因大规模采用技术而可能产生的阻力。特别是对于医疗保健机构中运行很长时间遗留系统，将所有这些系统替换为数据驱动的决策可能对采用过程产生不利。高层必须让每位员工对数据科学的采用前景充满信心，以便尽可能地减少与此采用过程相关的阻力。


    ![image](img/f01-01.jpg)


    图 1.1. 实践指南。*来源：* 作者概念化。


    这种方法将有助于赢得那些可能不喜欢一次性全面变革过程股东的信任（Shalender, 2018）。由于转型和技术采用所需的资源必须经过组织股东的批准，股东的积极态度是决定过程成功的先决条件。如果高层能够传达他们关于采用数据科学及其回报的想法，并将备忘录发给所有员工，这样他们就能对组织的数字化战略有一个清晰的认识（Shalender
    et al., 2024）。这种清晰度将有助于数据科学和人工智能的采用以满意的方式完成。


    ## 3.3 培训员工


    这是最被忽视的问题之一，在医疗保健部门采用数据科学和人工智能方面，必须优先解决这个问题。通过对员工进行培训和发展，组织可以让他们准备好高效地使用技术（Singla
    & Shalender, 2024）。这也是减少对技术采用反对的一种可靠方法，因为经过告知和培训的员工比其他人更有可能在没有任何任何抑制的情况下接受该技术。当然，投资于培训和发展取决于资源，而且如果医疗保健部门决定就新时代创新对员工进行培训，这将需要花费资金。对技术的培训和发展的批准通常来自组织的高层，而公司级人员转而向股东申请以获得批准。如果公司的技术采用与组织的长期盈利能力相关联，整个过程就可以变得更加高效和顺畅（Singla
    et al., 2024）。技术团队有责任证明与技术采用相关的利益，通过提供可以在高层和股东面前展示的切实利益，可以使采用和实施技术的道路变得顺畅。投资员工的培训和发展一直是一个好主意，因为它能在员工之间培养归属感和熟悉感。这也有助于减少角色压力和工作投入不足，从而在增长、市场份额、客户留存等关键参数上获得更好的表现。


    ## 3.4 关联结果


    公司在实施过程中经常遗漏的一个重要步骤是，将技术采用的结果与市场参数相关联。作为一个组织，你必须证明由于技术采用的实施，与性能相关的关键参数受到了积极影响。将数据科学和人工智能的使用与提高患者满意度、为患者提供卓越价值以及提供负担得起的医疗服务相关联，是你必须完成的过程的一部分，以增强组织内技术的实施。通过向高层展示卓越成果，医疗保健公司可以确保获得更多资源，以便将公司技术的使用水平提升到更高水平。用积极的框架沟通结果不仅与医疗保健公司目前的技术采用有关，而且为了将其推向另一个水平；驱动公司下一阶段数字化转型可能需要更多资源（Wedel
    & Kannan, 2016）。结果的沟通对股东来说很重要，因为他们始终关注对视频职能部门和运营机制的投资。


    ## 4 结论与讨论


