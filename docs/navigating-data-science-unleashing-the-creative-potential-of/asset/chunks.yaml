    编辑和审稿人能够利用自动化同行评审平台，该系统能够高效地评估大量投稿，从而节省时间（Rousi et al., 2024）。基于 AI 的技术提供了显著优势，能够有效缩短学术写作所需的时间，同时抄重检测技术也有助于识别复制的文本。然而，通过利用自然语言处理技术，作者可能会优先考虑写作的内容而非技术层面（Sathe
    et al., 2023）。同样，AI 算法可以提高全面文献检索的效率，并缩短语言翻译和文本摘要等活动的处理时间。自然语言处理系统可以为各种书面文档生成定制大纲，例如电子邮件、报告、研究方案、资助提案、知情同意书、医疗必要性保险信等（Jayakumar
    et al., 2023）。此外，值得注意的是，语言处理具有提供精确建议的能力，从而提升论文质量。此外，AI 工具可能会根据先前的研究提供最佳研究样本量的建议，并就执行最合适的统计测试提供建议（Abbasian
    et al., 2024）。将 AI 整合到学术研究中增强了写作过程的效率，还促进了产出并提升了输出质量。研究过程可以分解为两个关键部分：提出假设和开展研究（Pigg,
    2024）。对于刚进入研究领域的人员来说，AI 可以在这两个领域提供帮助。在检测现有文献库中的缺陷时，机器比人类通常更擅长发现模式和联系，特别是当人类仅仅是新手时（Budhwar
    et al., 2023）。一旦形成假设，AI 还可以协助下一步：实际上，即开展研究。


    学术研究在数据处理方面从 AI 中受益匪浅（Alberth, 2023）。这是因为 AI 可以以更快的速度检测模式并发现新事物，也就是说它能快速发现重要内容。当我们说“重要内容”时，我们指的是推进研究的关键元素，这些元素往往会带来新的发现或对先有理论的修正（Mahapatra,
    2024）。快速整洁的数据组织和可视化是 AI 系统最实用的任务之一，表格和图表构成了它们的核心（Feher, 2024）。这是因为“可比性”是我们希望数据并排呈现的方式，这种方式能让我们同时看到它们的相似和不同之处。这正是
    AI 可以提供帮助的地方：它可以发现并突出我们数据中的模式，而我们在以人类速度工作时很容易忽略这些模式（Gouveia et al., 2023）。AI 的影响正在不断增长，并触及各个方面（Cheng
    & Lee, 2024）。AI 的出现显著改变了我们访问和处理海量数据的方式，正如[图 7.2]所示的框架](#978-1-83608-298-920251007.xhtml#fig2)。


    ![image](img/07-02.jpg)


    图 7.2 生成式 AI 的框架。*来源：* 作者构思。


    正如任何技术进步一样，由于对潜在缺点或风险的担忧，对其采用存在抵触情绪。确实，依赖 AI 生成的结果可能会损害人类的创造力和分析思维。生成式 AI 的出现为各个领域带来了巨大变化。这些改进源于简化语言构建、定制学习体验、改进内容创作以及更新学术研究的能力（Alberth,
    2023）。此外，被称为 AI 的生成式 AI 彻底改变了写作方法。它增强了学者和学生有效管理时间并提高阅读技能的能力（Gouveia et al., 2023）。创意
    AI 在教育领域营造了定制化的学习环境，考虑了学生的独特学习偏好和风格。此外，它通过提高语言能力和纠正语法错误，提升了认知沟通的质量和实用性（Wach et
    al., 2023）。研究项目的分配已经转型，导致了学术研究性质的根本转变。


    “技术收益”指的是使用特定技术所获得的收益（Dencik et al., 2023）。AI 的收益围绕着学生在学术活动中使用技术所获得的益处。然而，“实际技术使用”指的是个人在日常生活中采用技术的多种方法。


    表 7.1 可用于学术领域的人工智能工具。


    | **文献检索** | **写作工具** | **文献检索与写作结合** |

    | :--- | :--- | :--- |

    | Semantic Scholar | Writefull | Cohere |

    | Connected Papers | CoSchedule | |

    | Penelope.ai | Quillbot | |

    | Elicit | Wordtune | |

    | Scite | ChatGPT | |

    | Google Bard | Google Bard | |

    | **绘图** | | |

    | DALL-E 2 | | |


