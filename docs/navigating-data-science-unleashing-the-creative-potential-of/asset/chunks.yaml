    反抄袭标准是一种保护知识产权的法外技术（Singh & Ganapathy, 2018）。抄袭既不违法，也不是法律诉讼的依据。版权仅保护文本；思想不受保护。尽管抄袭受限于职业团体实施的制裁，但法院曾批评律师的抄袭行为，称为“令人指责的”和“完全不可接受的”（Masic,
    2014; Roig, 2010）。在学术和其他领域，这一惯例已演变为保护作者经济免受机会主义行为的影响，因为这些行为会剥夺所有者获得其作品完整价值的权利。`LLM`
    的想法确实是它们自己的，且无论 `LLM` 是否遇到过其产权的侵犯，AI 创建的语言无法匹配（不存在的）正式或非正式抄袭标准，而且在学术界中使用 `LLMs`
    并没有违反反抄袭规则试图保护的产权框架（Berg, 2023; Bevolo, 2022）。反对抄袭的一个主要论点是，抄袭者破坏了智力层的层级。接受他人思想的读者无法从一开始就监控此类思想的演变。现代神经网络
    AI 架构以作为不透明的“黑箱”运行而闻名，尽管它能够理解问题和训练数据输入（Kandeel & Eldakak, 2024）。


    学者有责任以一种既解释又阐明其理论和论点在智力传统和文献库中位置的方式来进行开发。考虑到神经网络架构中不透明性的重要性时，学者的角色和任务显而易见（Gunjan
    & Zurada, 2021; Kashyap et al., 2024; Wu et al., 2021）。他们既可以将 `LLM` 作为调查特定知识领域的工具，也可以将
    `LLM` 作为指南，帮助研究人员掌握该特定知识领域。研究论文作为最终成果，必须关注特定领域和相应的学术群体。这讨论了研究学术人员对其学术群体所承担的伦理责任。


    ## 10. 生成式 AI 在学术写作和伦理中的未来范围


    创造性 AI 在学术研究框架领域的应用潜力是巨大的，从想法生成到在出版中应用伦理实践。随着生成式 AI 的进步和在多个领域的普及，预计其改进伦理考虑和转型学术写作的能力将不断增长。从结构化数据中生成表格和数据、建议语法和风格、以及将非结构化思想组织成连贯论点的现代
    AI 算法可以改进研究和认知写作工作流。这种策略能够收集重要结果，并有助于快速识别海量数据库，从而减少了对耗时文献综述的需求。研究人员可以使用这些工具增强他们时间管理能力。这些材料有助于非英语母语者提高写作、阅读和口语能力。通过定制学习体验，创造性
    AI 有能力提高学生的学术表现并促进语言学习。实现这一目标的若干策略包括翻译文学文本、提高语言熟练度和实施语法修改。采用 AI 算法可以帮助学生提高论文写作水平，培养批判性思维能力并获取论文范文。尽管存在伦理担忧，但创造性
    AI 有能力实现写作过程的大部分自动化，特别是在教学写作领域。这可能会阻碍创造性和批判性思维能力。当 AI 过度依赖错误数据或方法论时，可能会表现出偏差或错误。伦理思想对于课堂使用至关重要。教育是社会公平的最强大工具之一；它也是批判性思维发展的主权空间。因此，立法应当赋予
    AI 伦理美德，并让这些美德对学生和教师可见。例如，我们可以让 AI 方法与人类决策并应用，以纠正给予群体的任何错误机会或待遇。如果苏格拉底式 AI 研究要保持人类智力产出的价值，人类学者与
    AI 系统之间的持续互动是至关重要的。这种研究允许个人加深对复杂主题的理解，评估不同的观点，甚至修正自己的想法。AI 的进步无疑也会导致针对教育机构的新研究，其中数据分析和预测建模将处于领先地位。对于任何人来说，要准确理解复杂的模式识别行为、重大数据分析或复杂的认知过程，他们必须在这些领域拥有超越我们自身的智能，而这目前的
    AI 系统显然并非如此。


    ## 11. 结论


