  trans: '


    深度学习是基于多层神经网络概念的人工智能（AI）分支。与其他 AI 模型相比，训练良好的神经网络模型运行非常快。深度学习可以在大型数据集和各个部门的现实世界
    AI 应用中执行复杂任务，包括能源优化、汽车、医疗保健、制造等（Fan et al., 2023）。研究人员已使用各种深度学习方法，如人工神经网络（ANN）、卷积神经网络（CNN）、长短期记忆（LSTM）和自动编码器来解决复杂的现实世界问题。ANN
    是受生物神经网络启发的计算网络。一种 `ANN` 算法具有从非线性数据集和波动数据值中学习的能力（Mellit & Kalogirou, 2008）。`ANN`
    由三层组成：输入层、隐藏层和输出层。在最近的研究中，`ANN` 算法已用于预测分析、字符识别、异常检测等。`CNN` 已广泛应用于图像分类、处理卫星图像和解决字符识别问题。它由多个卷积层和采样层组成，通过处理经过层的数据来对输入特征进行分类。监督学习方法多层感知器（MLP）属于
    `ANN` 类，它将一组输入值转换为输出值。`MLP` 包含三层：输入层、隐藏层和输出层。可以有一个或多个非线性隐藏层（Mellit & Kalogirou,
    2008）。感知器使用有向图连接了多个层。`LSTMs` 是一种特殊的循环神经网络（RNN），它们可以从长期依赖中学习（Kaur et al., 2024）。它的序列网络使其适用于时间序列数据预测、文本处理和语音数据处理。`LSTM`
    包含各种单元，每个单元由输入门、输出门和遗忘门组成，控制进入和离开单元的信息流。它还有一个记忆单元，可以保存之前时间步的信息，从而有助于当前单元的输出。`Autoencoder`
    是一种广泛用于数据处理任务、去噪、特征提取和降维的自监督学习模型。`Autoencoders` 用于将数据映射到低维空间并转换回原始数据。


    ## 2. AI 的新兴应用


    AI 在过去几年中在许多领域和应用取得了惊人的进展，从根本上改变了日常生活，是学术界和商界的一个重要研究领域。然而，AI 在研究、理论、方法论和应用方面仍处于早期阶段。


    ![image](img/f08-03.jpg)


    图 8.3. 创新的 AI 应用。


    然而，在 1956 年 AI 发明后，它赢得了广泛的关注和声誉，AI 的理念不断演变并仍在不断阐述（Shao et al., 2022）。在过去的几十年里，计算机科学、医疗保健、数学、心理学、工业、语言学等许多领域已被包含在
    AI 之中。如图 8.3 所示，下面讨论了 AI 正在获得快速关注的一些主要创新应用。


    ### 2.1 医疗保健和远程医疗中的 AI


    循证医学的核心是利用历史数据指导临床决策（Rana & Shuford, 2024）。传统上，统计技术通过使用数学方程来刻画数据中的模式来处理这项任务。通过
    `ML`，AI 提供了定位难以数学求解的复杂关系的方法（Buch et al., 2018）。例如，神经网络像人脑一样通过大量相互连接的神经元来表示数据。这使得
    `ML` 系统能够像临床医生一样，通过仔细分析数据得出推理充分的结论来应对复杂的问题解决。然而，与单个医生不同，这些系统可以快速且并发地观察几乎无限量。随着无线和机器人技术的出现，远程手术也成为可能。远程或机器人手术通过将居住在不同远程地点的医生和患者联系在一起，从虚拟上改变了手术实践（Sharma
    et al., 2021）。使用 `6G` 和 `AI` 技术，这种新策略使用了机器人技术和尖端电信。远程手术团队丰富的医生和关注的患者体验到的极快数据传输速度和完美连接，使得即使在低边界地区，也能克服对物理治疗的需求以及顶级医生可用性的问题。在
    `AI` 辅助算法的支持下，远程手术机器人可以适应并敏捷地增强手术结果（Buch et al., 2018）。此外，`AI` 的实时数据分析和处理能力提高了医疗程序的成功率和患者安全，因为它们赋予了远程医生做出明智决策的能力。进入医疗行业的技术必须与现有程序相结合，遵循必要的授权，并激励患者和医疗专业人员采用新的思维方式（Chata
    et al., 2024）。这些挑战导致了 AI 使用领域的几项新发展。AI、ML 和 6G 的协作提供了更准确、预测性和个性化的医疗服务，并有望促进患者护理。


    ### 2.2 AI 与 6G 智能电网


    由于 `AI` 和 `6G` 的整合，智能电网的创建和运行正在经历巨变（Zuo et al., 2023）。预计 `6G` 网络和 `AI` 将提供极高的数据传输速率、极延迟和广泛的设备连接，显著增强智能电网的通信基础设施。这将允许有效的能源分配、管理和消费，并通过实现实时监控、控制和节能快速响应波动。当与
    `6G` 网络结合时，`AI` 技术通过促进自主决策、预测建模和高级分析扩展了智能电网的潜力（Chut et al., 2024）。


    ### 2.3 脑机接口 (BCI) 中的 AI


