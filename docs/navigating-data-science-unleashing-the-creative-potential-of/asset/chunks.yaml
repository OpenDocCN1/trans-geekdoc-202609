    ## Chapter 3


    ## Analyzing Indian Science and Technology Indicators Using Data Science: A Global
    Perspective


    Anant Bhatt^a, Rubani Singla^b, Shilpa Gite^c, Shruti Patil^c and Ketan Kotecha^c


    ^aFaculty of Technology and Engineering, Parul University, Waghodia, Gujarat,
    India


    ^bComputer Science and Engineering Department, Chandigarh Engineering College,
    Chandigarh Group of Colleges Jhanjeri, Mohali, Punjab, India


    ^cSymbiosis International University, India


    ### Abstract


    An upsurge in evidence-based policy formulation has led to profound roadmap formulation
    and effective policy formulation internationally. Significantly, the prevalent
    national practices in the R&D policy formulation demands painstaking analysis
    and accountability in investments. Although diverse methodology trends extend
    feasibility to derive inferences from the figurative assessments of the investments,
    overall economy and salient growth reports, it is crucial to contemplate the direct
    and indirect influence of numbers in an eclectic landscape. Mainly, the science,
    technology, and innovation (STI) indicators are extensively being used to comprehend
    the evolution of R&D activities. Quantitative science and technology (S&T) data
    analysis provides valuable and strategic insights for effective policy formulation
    with effective assimilation of S&T activities, which otherwise is a complex and
    dreary affair. This paper deliberates on a “Scientometric” approach with deep
    data science analytics to analyze Indian indicators in consonance with national
    objectives and vision. We present a detailed analysis of the Indian S&T indicators
    derived from the published data by credible International/federal agencies compared
    to the global R&D statistics. The latter part is aimed to curl out the Indian
    GDP and S&T indicators'' pattern and infer the non-quantifiable insights (derived
    from the dominant indicators) to highlight the effectiveness of the government
    plans. Since figurative indicators fail to capture process and grey zones, we
    summarize the salient points that merit attention for robust planning and evaluating
    socio-economic progress in the Indian context. We focus on contributing towards
    the indispensable R&D policy foundation, considering a broader, global socio-economic
    canvas.


    *Keywords*: Scientometric analysis; S&T indicators; Indian innovation; Jugaad;
    Indian research; science and technology


    ### 1\. Introduction


    The present-day economic system is the merchandise of fast-paced globalization,
    communication technologies, and advances led by information technologies. The
    global socio-economic landscape is wrought by advanced technological leaps, ensuring
    the best quality of life. The fleet technological progression since the 1990s
    impacted the global economy, growth, and standing of the nations. Science, technology,
    and innovation (STI) positioned themselves at the center of the concept. Hence,
    generation, exploitation, and diffusion of knowledge are considered a prerequisite
    to the nation''s economic growth and development in the industrial revolutions.
    The advent of diffusion-driven, digitized information technology improved the
    ease of generating, constructing, and distilling information to cultivate knowledge.
    It bridged the voids for creation, nurturing, accumulating, and distributing knowledge,
    facilitating the developments in Science and Technology (S&T). In addition to
    providing the befitting environment for invention, diffusion, and commercialization
    in the S&T domain, the global leaders and stakeholders emphasized creating the
    valuation from this knowledge ([Lundvall & Borrás, 2006](#978-1-83608-298-920251003.xhtml#bib28)).
    Many nations designed their nation-building roadmap keeping S&T at the center.
    The emergent attentiveness from financial institutions, Ministries of Finance,
    Ministries of Education and S&T envisioned generating value from these innovations
    in the form of productivity, profits, and ultimately, leading the growth, productivity,
    and competitiveness ([Gertler & Vinodrai, 2005](#978-1-83608-298-920251003.xhtml#bib16)).


    An upsurge in evidence-based policy formulation led to the profound roadmap and
    policy formulation internationally. The governments deliberated on collecting
    data from various indicators to contribute to an enhanced, transparent understanding
    of prevailing situations. The National Center for Science and Engineering Statistics
    (NCSES) defined the term “indicator.” The indicator is denied as “A statistical
    proxy of one or more metrics that allow for an assessment of a condition” ([Martin,
    2012](#978-1-83608-298-920251003.xhtml#bib30)). Indicators facilitate assessing
    the prevailing status of any project, program, or activity and enable measuring
    the progress in scenarios where it is not feasible to conduct direct measurements
    of the activities. As the indicators extend proximate analytical measurements,
    they help to outline the differences between pre-activity and post-activity evaluations
    distinctively, so foresight is often the best presented by the indicators. STI
    indicators are the most powerful tools for measuring, analyzing, and comparing
    progress on international standards. They quantify the nation''s growth by measuring
    its knowledge creation, invention, innovation, technological diffusion, and science
    and engineering talent in a quantifiable manner, which helps comprehend and evolve
    R&D activities and innovation systems. Since different indicators cover diverse
    insights, it becomes essential to pick an appropriate one while addressing project-specific
    requirements. Well-known indicators have been analyzed in consultation with the
    international methodological manuals, guidelines, and data published periodically
    by authentic international organizations. Salient indicators having a considerable
    impact are shown in [Fig. 3.1](#978-1-83608-298-920251003.xhtml#fig1).'
