    personal networks.


    #### 5.3 Limited Access to Big Data

    It is crucial to understand that access regarding Big data creates a digital divide.
    Access to proprietary datasets is restricted, with large corporations being the
    sole authority dictating how their data can be accessed. The skill sets are required
    to work with Big data, restricted to those with a computational background. The
    use of Big data induces critical reflection on the implications for future research
    and technology built on it.


    #### 5.4 Big Data–Based Decisions and AI Biases

    Organizations utilizing the user''s data to make decisions by powering machine
    learning/AI algorithms has become a significant concern in recent years. The AI
    can assist in and directly lead to decision-making in various spheres including,
    but not limited to, the economic, educational, healthcare, tax and social spheres.
    Within these spheres, it can create decisions for optimization, welfare, fraud
    detection, personalization, etc. It is common practices of various countries to
    harvest user data for various purposes, to make predictions and decisions which
    impact users'' lives. The methods used for data collection vary from traditional
    census surveys to the use of advanced surveillance technologies such as monitoring
    online activities, tracking mobile phone locations and even using facial recognition
    as large datasets. The algorithms are employed in various domains, including healthcare,
    law enforcement and social services, However, using user data to power AI algorithms
    raises concerns about the potential for biases to be amplified and perpetuated.
    The algorithms rely on the data they are trained on, and if these data are biased
    or incomplete, the outcomes produced by the algorithms may also be biased. AI
    algorithms have been found to exhibit biases related to gender, race, ethnicity
    and criminal record, among other factors. These biases can have far-reaching implications
    for users, whom algorithmic decisions may unfairly impact. One example of racial
    and ethnic biases is AI algorithms used in law enforcement, which have come under
    scrutiny for disproportionately targeting minority communities. The use of predictive
    policing algorithms is considered in the case of facial recognition technology.
    In a study assessing such disparities, it was shown that the maximum error rate
    for lighter-skinned males is 0.8%; however, the error rate for dark-skinned females
    can go up to 34.7% ([Buolamwini & Gebru, 2018](#978-1-83608-298-920251006.xhtml#bib9)).
    And the datasets are overwhelmingly composed of lighter-skinned subjects. This
    shows that facial recognition algorithms exhibit higher error rates when identifying
    individuals with darker skin tones, leading to disproportionate misidentifications
    and false positives among people of colour. This has significant implications
    for law enforcement and surveillance practices as misidentifications can result
    in wrongful arrests and infringements on civil liberties. Another significant
    example of racial and ethnic biases in AI algorithms pertains to immigration policies
    and border control. Governments employ AI-driven systems to analyze vast amounts
    of data to determine immigration eligibility. However, these systems have been
    found to exhibit biases against individuals from specific racial or ethnic backgrounds,
    leading to discriminatory treatment in visa approvals, border screenings and immigration
    enforcement. Minority communities, particularly people of colour, often face heightened
    scrutiny and profiling based on algorithms that prioritize specific demographic
    characteristics or perceived risk factors.

