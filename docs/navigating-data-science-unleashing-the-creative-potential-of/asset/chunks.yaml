    in the world. Especially when it comes to the developing and under-developed economies,
    the role of technology in providing good healthcare services is very crucial.
    These countries require a proper investment in the healthcare infrastructure,
    and by using the technology, the cost efficiency related to the healthcare management
    practices, healthcare services and allied issues can also be tackled effectively.
    The role of policymakers becomes also very important in encouraging the use of
    technology in the healthcare industry. By promoting new investment in the sector
