  trans: '


    学术界的迅速增长为生成式 AI 带来了危险与机遇。然而，总而言之，这个新的学术世界提供了一个绝佳的机会，让我们能够以正确（足够严谨且智力诚实）的方式利用当前的技术可能，特别是考虑到其中许多技术现在已经如此易用，以至于普通公民也能上手它们。


    在学术界进行的研究从伦理角度来看必须始终保持纯洁；因此，以不符合伦理的方式使用技术无疑不是机会，而是危险。同样，正确地使用技术——我指的是以尽可能符合伦理的方式“正确地”使用——这为依赖学术界产生知识提供了另一个充分的理由。


    在协作和同行评审过程中维护学术诚信至关重要。严谨的同行评审对于妥善认可学术成果是必要的，而当使用生成式 AI 执行通常由人类完成的任务时，这一点尤为重要。对于想要在工作中有效使用
    AI 的学术人员来说，愿意接受反馈和批评是必须的。


    AI 研究因对社会的影响引发了伦理关注。如果你想象一下计算机根据其获得的数据类型以及其“学习”的性质可以构建出什么样的“社会”，就能理解当我提到学术研究的更广泛影响时在表达什么。最后，采取全面的策略来降低风险，可以确保
    AI 仍然是学术人员的有用工具，并确保我们能够伦理地利用其能力来造福社会。


