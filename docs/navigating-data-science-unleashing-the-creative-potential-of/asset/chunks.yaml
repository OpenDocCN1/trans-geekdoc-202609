  trans: '


    零工者的工作条件并不符合体面工作（DW）的标准。作为独立承包工工作的人并不需要为那些能够支持其工作条件的公司工作。几个针对零工的工会已经提出了公平工作条件的问题。然而，我不认为这会对零工者有所帮助。专注于零工经济的公司仍然非常新颖，因此我认为我们应该将其视为企业社会责任（CSR）和体面工作（DW）的问题来处理，而不是使用“大棒”来惩罚这些新的经济来源。


    其中一位身份为研究人员的受访者表达了他的观点：


    零工经常遇到艰苦的劳动条件，例如收入不可预测、工作安全感不足以及劳动保护不足。零工经常被要求延长工作时间，却无法获得传统员工享有的福利和保护，这可能导致财务不稳定和压力。零工应该有权享受带薪假和医疗保险等福利。鉴于零工工作的不稳定性，这些福利对于他们的健康至关重要，并可以作为促进其财务稳定和健康的安全网。零工通常经历的低工作安全感和稳定性会对他们的长期财务规划和整体生活质量产生负面影响。零工工作的按需性质经常导致就业机会不一致，这增加了劳动者建立稳定收入的难度。


    然而，感知到的工作灵活性对个人、家庭和业务结果有积极影响。理想的工作周让员工能够有效管理他们的工作与生活平衡，从而对他们的福祉和家庭动态产生有利。此外，能够调整工作时间和地点的员工可以长时间工作而不会面临困难，这凸显了灵活性在实现工作与家庭责任之间取得平衡的重要意义（Hill
    et al., 2001）。低技能劳动工人正受到就业格局变化的影响，因为他们在获得足够收入和工作稳定性方面面临着挑战。零工经济灵活性增加导致权力失衡加剧，从而加高了易受剥削的脆弱性。那些倾向于全职工作但被迫从事多份兼职工作的经济弱势群体，正逐渐变得越来越脆弱。零工经济进一步加剧了歧视和经济不平等，由于替代方案有限，劳动工人频繁诉诸于不稳定的工作安排（Spreitzer
    et al., 2017）。劳动力市场在不断演变，员工的角色至关重要。工作的灵活性提供了职业生活与个人生活的和谐融合，从而带来了工作满意度和最佳表现。数字技术的兴起和非常规职位的出现导致非标准化就业形式的增加，这可能会影响就业质量（Davidescu
    et al., 2020）。这种情况应被政策制定者视为紧急情况，因为它会影响他们的福祉。


    ## 5.4 外送服务中的生态韧性


    传统的业务模式优先考虑股东价值，而可持续管理则关注环境和社会影响。可持续性主义主义通过识别机会、减轻风险、建立信任来产生长期价值。线性经济模式正在被循环或零工经济模式取代，采用工业
    4.0 和 10R 原则。可持续管理的目标是利用更少的资源实现更大的功能、开启新市场并执行社会公益规定。人工智能可以通过优化资源利用、减少浪费和促进整个生命周期的可持续实践来增强生态韧性。它可以识别效率问题、改进回收流程、设计可持续产品并促进向循环经济的转型。人工智能还可以监测环境状况并做出决策（Lavinia,
    2023）。


    P4. 通过实施可持续实践展现生态韧性的平台将对工人对人工智能的信任产生积极影响。


    然而，公众对于零工工作的环境可持续性存在非常分歧观点。“公司应该追求在不损害零工工作核心价值主张的情况下促进可持续性的创新解决方案。”此外，一位身份为客户的受访者赞同他无法承担额外成本：


    我完全致力于可持续实践；但我不可能以更长的等待时间和增加成本为代价来支持所谓的“可持续实践”。我在线下单是为了节省时间，否则这些时间本该用于：(a) 往餐厅；b)
    在结账台排队（观察坐在那里的人）；(c) 等待订单准备好并交付，直到酒店员工拿走并给我提供食物。当我无法分配需要的时间完成所有这些任务时，我通常会在线下单。如果在线下单会导致耗时的过程，那么它就是徒劳的。我可能在费用增加方面放弃一些金钱，只要声称要实施的可持续实践是真实的，而不是一种“洗绿”。换句话说，如果零工平台无法为产生实际影响的可持续实践提供详细理由，我不接受涨价的想法。


    然而，另一位身份为研究人员的受访者准备支持环保实践。


    我会支持整合了可持续实践的零工经济平台，无论这是否增加费用或延长等待时间。地球的长期健康取决于可持续性，支持环保实践是一项负责任的决定。它也可以作为其他机构实施类似政策的激励，从而促进更全面的环境影响。


