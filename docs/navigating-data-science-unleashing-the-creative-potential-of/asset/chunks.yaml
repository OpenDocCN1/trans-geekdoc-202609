    identity, relational, emotional, and career-path uncertainty ([Caza et al., 2022](#978-1-83608-298-920251005.xhtml#bib7)).
    Research in human resources management emphasizes the significance of security
    in the well-being of gig workers although there is a lack of consistency in the
    effects. Advocates contend that greater autonomy in gig work can result in enhanced
    well-being as conventional employment provides stability but also entails substantial
    compromises in terms of flexibility and remuneration. Gig workers, such as Uber
    drivers, value the ability to have a flexible work schedule and the ability to
    control fluctuations in their income. Reducing barriers to entry and implementing
    lower tax rates for gig-work platforms can have a positive impact on overall well-being,
    as suggested by [Felix et al. (2023)](#978-1-83608-298-920251005.xhtml#bib12).
    An individual''s quality of life, including work performance and productivity,
    is greatly influenced by their psychological well-being. It is shaped by emotional
    experiences, cognitive function, and job evaluation. Psychological well-being
    is associated with positive emotions, life and work satisfaction, and the absence
    of negative feelings. Satisfaction and happiness contribute to the enhancement
    of psychological well-being, which is indicative of an individual''s interaction
    with social structures and conditions ([Kim et al., 2023](#978-1-83608-298-920251005.xhtml#bib18)).
    The psychological well-being of gig workers is the main objective of our research
    study. Workers'' mental health may be significantly affected by the introduction
    of AI as they may experience fear and a lack of knowledge when using smartphones
    and this technology. Consequently, we aim to incorporate all ethical best practices
    for the use of AI in gig work.


    *P7. Trust in AI and ethical AI use, data privacy, algorithmic fairness, best
    employment practices, and ecological resilience will improve gig workers'' psychological
    well-being.*


    Every single stakeholder involved in this food delivery service ought to be aware
    of the significance of trusting AI and the role that it plays in the psychological
    well-being of online food delivery gig workers.


    ## 6. Conclusion


    The ethical use of AI in the gig economy is complex. The task includes data privacy,
    algorithmic fairness, optimal employment practices, and ecological resilience.
    Data privacy helps gig workers feel safe and respected, encouraging them to use
    AI-powered platforms. No matter their background or demographics, algorithmic
    fairness eliminates biases and treats all workers equally. Gig workers'' rights
    and welfare depend on fair compensation, manageable work schedules, and resources
    and perks. Ecological resilience is essential to the gig economy. By promoting
    green practices with AI, gig platforms can contribute to societal goals. This
    approach builds trust and purpose in employees. AI''s ethical use and trust connect
    predictors to outcome variables. Transparent, equitable, and accountable gig worker
    rights and welfare practices build trust in AI. This framework aims to improve
    gig workers'' psychological well-being. Gig workers can improve job satisfaction,
    and overcome stress, by prioritizing ethical AI practices and building trust through
    transparency, fairness, and respect. This holistic approach improves individual
    and collective gig economy results.


    ## 7. Theoretical Implications


    Our study''s conceptual framework explains how ethical AI practices affect gig
    workers'' psychological well-being. Data privacy, algorithmic fairness, best employment
    practices, and ecological resilience are predictors. The framework emphasizes
    trust in AI and its ethical use as mediators, emphasizing transparent and responsible
    AI practices. Ecological resilience is also included in ethical AI discourse to
    consider AI-driven platforms'' environmental impacts. Psychological well-being
    is a key outcome variable in the framework, shifting the focus from economic or
    operational metrics to AI''s human-centered effects in the gig economy. The framework
    helps policymakers and industry leaders implement ethical AI strategies. Focusing
    on AI as a mediator advances trust theory in technology adoption. The framework
    allows empirical validation and study design of ethical AI practices'' effects
    on gig workers. These contributions help us understand the complex interactions
    between AI and human factors in gig worker food delivery online and other low-skilled
    on-demand physical services.


