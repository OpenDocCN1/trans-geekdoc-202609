- raw: '**Neha Mishra** has earned a doctoral degree in Business Management and currently
    serves as an Assistant Professor at Chitkara Business School within Chitkara University,
    situated in India. In her role, she likely contributes to the academic community
    through teaching, research and possibly administrative duties, within the realm
    of business education.


    **Shruti Patil** is an enthusiastic academician and an avid researcher in the
    flied of AI technology. She is a gold medalist in computer science. She has been
    an industry professional in the past, currently associated with Symbiosis Institute
    of Technology as a Head of the department, AI&ML department, and also as a Research
    Associate with SCAAI. She has expertise in applying innovative technology solutions
    to real-world problems. Her research areas include applied artificial intelligence,
    natural language processing, acoustic AI, adversarial machine learning, data privacy,
    digital twin applications, GANS and multimodal data analysis. She is currently
    working in the application domains of healthcare, sentiment analysis, emotion
    detection and machine simulation via which she is also guiding several UG, PG
    and PhD students as a domain expert. She has published 100+ research articles
    in reputed international conferences and Scopus/Web of Science indexed journals
    and books.


    **K. Shanthi** is an exceptional scholar with over two decades of experience in
    both academia and industry. Her groundbreaking qualitative research focuses on
    understanding and empowering marginalised communities. With a strong background
    in management and industrial psychology, Shanthi expertly employs thematic analysis
    and grounded theory methodologies to gain deeper insights into the lives of those
    at the bottom of the socio-economic pyramid. Through her tireless work, Shanthi
    seeks to challenge stereotypes, fight for social justice and make a real difference
    in the lives of underserved populations. She is committed to bridging the gap
    between academia and activism and is unwavering in her dedication to this cause.


    **Aashima Sharma** holds a Master''s degree in Computer Applications from Thapar
    Institute of Engineering and Technology, as well as a doctoral degree with specialisation
    in blockchain and IoMT in healthcare from Thapar Institute of Engineering and
    Technology. She is working as an Assistant Professor in the Department of Computer
    Science and Engineering at Chitkara University Institute of Engineering and Technology.
    Her areas of interest include blockchain technology, IoMT and network security
    and has many related publications in esteemed SCI journals and national and international
    conferences.


    **Jaswinder Pal Singh** is a researcher at Department of Library and Information
    Science, Punjabi University, Patiala, India, and is currently working as a University
    Librarian at Chitkara University, Punjab, India. He possesses a comprehensive
    18-year tenure within the library field, accumulating extensive expertise and
    proficiency in various aspects of library management, including cataloguing, information
    retrieval, collection development and patron services. Throughout this substantial
    duration, he has demonstrated a deep commitment to fostering an enriching environment
    for patrons, leveraging his wealth of experience to enhance library operations
    and meet the diverse needs of users. His areas of research include media and information
    literacy, knowledge sharing, information retrieval, knowledge management in libraries
    and collections development.


    **Shrishti Singh** is a research scholar, working in the field of marketing from
    Amity College of Commerce and Finance, Amity University Uttar Pradesh. Her areas
    of interest include augmented reality, artificial intelligence, social media marketing
    and consumer behaviour.


    **Rubani Singla** is a dedicated professional with a strong research, teaching
    and academic administration background. With over 4 years of experience, Rubani
    has held positions as an Assistant Professor at CGC Jhanjeri Mohali and GZS Campus
    College of Engineering and Technology Bathinda. With a solid educational foundation
    in Information Technology and Computer Science, including an MTech degree, Rubani
    has contributed to the field through research papers on topics like skew detection
    in text documents and the socio-economic impacts of e-commerce. In addition to
    academic achievements, Rubani has gained significant industrial training in various
    technologies and is proficient in website designing and multiple programming languages.


    **N.V. Suresh** is the Vice Principal and a Professor at ASET College of Science
    and Technology, Chennai, Tamil Nadu. He has published 30 research papers, presented
    15 conference papers, authored two textbooks and developed over 10 e-content modules.
    Dr Suresh has supervised six funded projects and numerous student projects. He
    is an editor and reviewer for international journals and has held various academic
    leadership positions. He has received several awards, including the Best Faculty
    Award from Lions International in 2023, and has participated in international
    faculty exchange programmes.


    **Suganya V.** is an Assistant Professor (selection grade) in Faculty of Management
    at SRM Institute of Science and Technology, Chennai, India, handling subjects
    varying from human resources and marketing management. She''s known for her extensive
    contributions to academia and has a depth in knowledge when it comes to research
    and its methodologies. With a focus on research, she has presented numerous papers
    at both international and national conferences, showcasing her expertise in her
    field. As an educator, she brings a wealth of knowledge and experience to her
    role, inspiring students and colleagues alike. Her dedication to scholarly pursuits
    has earned her recognition as a leading figure in her field, with her work making
    valuable contributions to the academic community.


