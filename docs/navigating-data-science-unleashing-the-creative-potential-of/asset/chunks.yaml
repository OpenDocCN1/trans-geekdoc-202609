  trans: '


    与传统组织中的员工相比，零工经济者始终面临着独特的挑战。零工经济者遇到六大挑战：生存性、组织、认同、关系、情感以及职业路径的不确定性 (Caza et al.,
    2022)）。人力资源管理的研究强调了安全感对零工经济者福祉的重要性，尽管这种影响的效果缺乏一致性。主护者认为，零工工作中更大的自主性可以提高福祉，因为传统就业虽然提供了稳定性，但在灵活性和薪酬方面也做出了巨大的妥协。Uber
    司机等零工经济者非常看重灵活工作安排的能力以及控制收入波动的能力。正如 Felix et al. (2023) 所示，降低准入门槛和为零工平台实施更低税率对整体福祉有积极影响。个人的生活质量（包括工作表现和生产力）深受其心理福祉的影响。它由情感体验、认知功能和工作评价所塑造。心理福祉与积极情绪、生活和工作满意度以及负面情绪的缺失有关。满意度和幸福感有助于增强心理福祉，这表明个人与社会结构及状况的互动
    (Kim et al., 2023)。零工经济者的心理福祉是我们研究的主要目标。AI 的引入可能会显著影响工者的心理健康，因为他们在使用智能手机和这项技术时可能会感到恐惧和缺乏知识。因此，我们的目标是将用于零工工作中
    AI 的所有伦理最佳实践纳入其中。


    *P7. 对 AI 的信任以及 AI 的伦理使用、数据隐私、算法公平、最佳就业实践和生态韧性将改善零工经济者的心理福祉。*


    参与此项外卖服务的每一个利益相关者都应该意识到信任 AI 的意义，以及它在在线外外卖零工经济者心理福祉中所扮演的角色。


    ## 6. 结论


    在零工经济中伦理地使用 AI 是复杂的。这项任务包括数据隐私、算法公平、最佳就业实践和生态韧性。数据隐私有助于零工经济者感到安全和受尊重，鼓励他们使用 AI
    驱动的平台。无论背景或人口统计特征如何，算法公平都能消除偏见并平等对待所有工人。零工者的权利和福利取决于公平的报、可管理的工作安排以及资源和福利。生态韧性对零工经济至关重要。通过
    AI 推广绿色实践，零工平台可以为社会目标做出贡献。这种方法建立了员工的信任和目标感。AI 的伦理使用和信任将预测变量与结果变量连接起来。透明、公平且负责的工人权利和福利实践建立了对
    AI 的信任。该框架旨在提高零工经济者的心理福祉。通过优先考虑伦理 AI 实践并通过透明、公平和尊重建立信任，零工者可以提高工作满意度并克服压力。这种整体方法改善了个人和集体的零工经济成果。


    ## 7. 理论意义


    我们研究的概念框架解释了伦理 AI 实践如何影响零工经济者的心理福祉。数据隐私、算法公平、最佳就业实践和生态韧性是预测变量。该框架强调对 AI 的信任及其伦理使用作为中介变量，强调透明且负责任的
    AI 实践。生态韧性也被纳入伦理 AI 话语，以考虑 AI 驱动平台的环境影响。心理福祉是框架中的关键结果变量，将焦点从经济或运营指标转向 AI 在零工经济中以人为本的影响。该框架帮助政策制定者和行业领袖实施伦理
    AI 策略。关注 AI 中介推进了技术采用中的信任理论。该框架允许对伦理 AI 实践对零工者的影响进行实证验证和研究设计。这些贡献帮助我们理解零工外卖以及其他低技能按需实体服务中
    AI 与人类因素之间复杂的相互作用。


