  trans: '


    IBM 等大型公司已任命了由各种 IBM 利益相关者组成的“AI 伦理委员会”，用于审查并对各种政策和产品做出决策（IBM, n.d.）。尽管有关 AI 伦理委员会的信息已经公开，但关于这些委员会成员如何被任命以及以何种方式获得决策权的信息非常少。在光谱的另一端，非常值得注意的是，微软最近解散了负责确保其
    AI 服务和工具做出负责任决策的“伦理与社会团队”（Newton, 2023），转而选择保留一个“负责任 AI 办公室”。报告声称，伦理团队为了保护消费者利益而提出的建议被微软否弃了。这些表述使我们相信，此类公司中的伦理委员会对
    AI 产品的决策没有最终决定权。因此，在确保 AI 负责任且符合伦理的实施方面，这些委员会并没有那么重要；因此，可以推测机构设立被动的伦理委员会只是作为替罪羊，用以分散
    AI 产品开发中的问责和责任问题。仅仅是知道此类伦理委员会的存在，也能给消费者带来某种慰藉和满足感，因为普通客户不会深入研究这些委员会所拥有的实际权力。


    ## 7.2 国家层面


    从宏观角度来看，一份旨在监管美国 AI 产品和服务的公开文件《第 13960 号行政命令》指出，在法律、秩序和公民安全的范围内鼓励发展 AI。其政策还涉及了在利用
    AI 算法的政府政策部署时，必须维护的责任问题（Federal Office of the President, 2020）。然而，这些规则并未明确说明机构需要以何种具体方式提交监控记录以确保流程的透明度。不遵守这些政策的后果也未明确。在文档末尾还明确指出该命令不适用于国防部使用的
    AI，且未对此提供进一步解释。即使像美国这样的大国正在确保 AI 在某些限制内部署，这些法规也未能确保作为算法主体的公民（而非仅仅是政府）获得透明度。处理欧盟居民个人数据的
    AI 系统受到《通用数据保护条例》（GDPR）的影响，该条例确立了欧盟数据隐私的标准。特别是，这些法规对许可（知情）、数据最小化和解释权的强调，与 AI 的透明度和问责制密切相关（Patel,
    2024）。


    ## 7.3 全球层面


    在国际上，拥有 30 多个成员国的跨国组织经济合作发展组织（OECD）建立了 `OECD.AI`。`OECD.AI` 被描述为塑造信赖 AI 的论坛（Aaronson,
    2022）。它还制定了成员国必须遵守的 AI 原则。遗憾的是，没有办法确保它涵盖大量准备好遵守这些原则的成员国，因为加入 OECD 的决定也受到多种社会政治因素和成员国间国际关系的影响。可以说，还没有一套适用于地图上所有国家的详尽规则，既能保护公民免受
    AI 滥用，又能确保机构问责并保持流程透明。联合国是一个大型国际组织，除了在其系统中制定了确保 AI 限制的原则外，尚未针对这一问题提出策略。


    ## 8. 结论


