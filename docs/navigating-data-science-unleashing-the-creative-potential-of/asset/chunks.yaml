- raw: 'The Greek word ‘ethos’, which means ‘character’, is where the word ethics
    first appeared. Ethics is the branch of philosophy that studies how people behave
    in social situations, offering logical defences of moral conclusions, identifying
    what is morally acceptable or unacceptable and differentiating between what is
    morally just and what is morally unjust ([Pan, 2024](#978-1-83608-298-920251006.xhtml#bib37)).
    The study of reasonable arguments, ethically good or bad, and just or unjust,
    for the responsible development and application of AI technology is known as AI
    ethics ([Gao et al., 2024](#978-1-83608-298-920251006.xhtml#bib18)). The utilization
    of Big data by AI raises a number of complex ethical questions that cut across
    several fields ([Schultz & Seele, 2023](#978-1-83608-298-920251006.xhtml#bib45);
    [Siau & Wang, 2020](#978-1-83608-298-920251006.xhtml#bib46)). Concerns about data
    privacy, manipulation and misuse are brought up by Big data-driven AI applications,
    which put people and society at danger ([Agbese et al., 2023](#978-1-83608-298-920251006.xhtml#bib1);
    [Christoforaki & Beyan, 2022](#978-1-83608-298-920251006.xhtml#bib11)). The convergence
    of AI and Big data in social science research brings up issues with risk management,
    subject protection, methodological biases and social harms ([Hermansyah et al.,
    2023](#978-1-83608-298-920251006.xhtml#bib21); [Mensah, n.d.](#978-1-83608-298-920251006.xhtml#bib33);
    [Zohny et al., 2023](#978-1-83608-298-920251006.xhtml#bib52)). The ethical implications
    of AI in social systems, like social computing, also highlight the necessity of
    designing with society''s interests, vulnerable populations and responsible data
    collecting and processing in mind ([Bleher & Braun, 2023](#978-1-83608-298-920251006.xhtml#bib7);
    [Choung et al., 2023](#978-1-83608-298-920251006.xhtml#bib10); [Díaz-Rodríguez
    et al., 2023](#978-1-83608-298-920251006.xhtml#bib12)). These discussions highlight
    how crucial it is to take ethical issues into account when developing and implementing
    AI systems that use Big data in order to guarantee their benefits for both people
    and society at large.


    ### 3\. Research Methodology


    The research methodology used for the purpose is case methodology to comprehend
    why and how companies extract Big data and use it in decision-making with the
    help of AI in an ethical way. The ethical questions regarding bias, transparency
    and accountability of the decision-making processes used to harvest data and make
    predictions using models were interrogated. It also delved to assess how this
    can operate in sync with rest of the organizational strategies. For the purpose,
    mixed methodology was used by considering personal interviews of the top managers,
    surveying the clients of the company and assessing the impact of AI for decision
    making and the ethical dilemmas surrounding it. Case studies from different industries
    like healthcare, finance, marketing and education were referred. A thorough analysis
    of steps taken by various organizations, industries and governments to address
    these ethical issues for public purview was conducted through blogs and research
    articles available. The issues like invasions of privacy, impartiality and inherent
    bias in decision-making algorithms, the openness and explainability of AI systems,
    accountability in automated decision-making, the ethical implications of data
    ownership etc. are analyzed. The information about companies taken as case in
    point is also synthesized to harness the pertinent ethical issues related to the
    topic of use of AI in decision-making.


    ### 4\. Theoretical Underpinning


    #### 4.1 Information and Computer Ethics (ICE)


    The farfetched concept of information and computing ethics (ICE) was appended
    by [Floridi (2006)](#978-1-83608-298-920251006.xhtml#bib15) with the details of
    philosophy of information (PI) and correlative information ethics (IE). Digital
    landscape demands for interrogation of interactions between human and devices
    with innovative methods. The PI implied the comprehension of digital ecosystem,
    with ethical contexts, information required and the involved organization for
    deciphering changed civic interactions and behaviour, whereas the IE denoted the
    ethical perspective while creating, using or sharing information in the digital
    ecosystem. IE is crucial for ethical behaviour, data privacy and ethical usage
    of information in all the decision-making processes ([Estelle, 2019](#978-1-83608-298-920251006.xhtml#bib13)).This
    framework reports the role of AI in defining ethical considerations within information
    societies, propagating consideration of global ethical issues rather than specific
    applications in the infosphere ([Bruneault & Laflamme, 2021](#978-1-83608-298-920251006.xhtml#bib8)).
    This framework make basis for most of the studies pertaining the ethical concerns
    while using AI-based decision-making in a variety of context as discussed in the
    next section.


    #### 4.2 AI for Decision-Making


    The presence of biases in AI algorithms is a matter of serious concern because
    AI algorithms are increasingly being used worldwide for decision-making purposes.
    Even though AI may be efficient in aiding the process of decision-making, the
    transparency of the process is debatable. The AI''s algorithm can be a black box,
    and it is not clear how it self-learns, hence lacking in transparency. It can
    be further proved by the fact that the most popular AI chatbots like ChatGPT and
    Gemini are closed-sourced and being used in various fields. One person alone can
    train them on a dataset without the intervention of anyone else. The understanding
    of process will lay foundation for further discussions. There are multiple stages
    involved in making policies using AI.


    ##### 4.2.1 Setting Priorities


    In the first stage, it can help the decision-makers identify the most urgent tasks
    by analyzing large datasets and data collected through various means. It can detect
    patterns that can guide the decisions. For example, the Victorian government uses
    AI for advanced text analysis of anonymized data to form health-related policies.
    Similarly, AI is also being used in France to aid the health sector (Wirjo & Calizo,
    2024).


    ##### 4.2.2 Making Policies for Decisions


    In the second stage, AI can directly lead to decision-making. AI''s ability to
    quickly assess large amounts of data and predict future outcomes can help in various
    spheres. For example, in the economic sphere, the AI framework ‘AI Economist’,
    created by Salesforce, has been shown to formulate economic policies by predicting
    the costs and benefits of the possible policies and properly recognizing the target
    audience. The United Nations Conference on Trade and Development (UNCTAD) has
    also created an AI to predict the implications of trade policies on global trade
    (Wirjo & Calizo, 2024).


    ##### 4.2.3 Streamlining Decisions


    In the third stage, AI can improve the efficiency of the decision-making process.
    It can simulate, test and forecast the possible effects of policies. This will
    help in speeding up the decision-making process. For making informed decisions
    with the help of AI, it is crucial to understand the sources of Big data and how
    these data are extracted for analysis purpose as these are the responsible variables
    which induce the inherent biases and makes the foundation of ethical issues.


    ### 5\. Harvesting Big Data for Algorithms'
