- raw: 'Fig. 4.1. Conceptual Framework. *Source:* Authors'' conceptualisation.


    #### 3.4 AI Fundamentals


    [Zhu (2023)](#978-1-83608-298-920251004.xhtml#bib31) offers the fundamental ideas
    behind AI, including its various forms, its constraints and its possible biases.
    Data Security and Privacy: When utilising AI tools, train staff members on data
    security best practices, such as data classification and access controls. Moral
    Aspects to Take into Account: Employees should receive training on how to identify
    and handle ethical issues with AI use, such as accountability, transparency and
    fairness. Recognising Shadow AI provide workers with the tools they need to recognise
    unapproved or unrecorded AI tools and comprehend the dangers involved. To Make
    Use of Various Training Techniques like E-learning Modules: Provide readily available
    web-based courses for introductory understanding and regular review. Workshops
    and Seminars: To go deeper into particular AI applications or tackle new challenges,
    arrange interactive workshops or seminars. Arrange casual get-togethers where
    professionals can talk about AI-related subjects and field questions from workers,
    able to voice concerns and queries regarding the use of AI without fear of retaliation.
    An internal platform for exchanging knowledge to provide a forum where staff members
    can exchange AI-related resources, best practices and experiences is needed. Consistent
    feedback systems to get employee feedback to find out how well they understood
    the training and what needs to be improved. Ensure that the AI training programme
    has strong leadership support and highlight how important it is to the success
    of the company. Continuous support to include AI best practices in performance
    reviews and day-to-day work procedures ([Cui et al., 2023](#978-1-83608-298-920251004.xhtml#bib10)).
    Acknowledge and commend staff members who use AI responsibly. If employees are
    unaware of or do not comprehend AI policies, then their contributions are unproductive
    ([Rice et al., 2020](#978-1-83608-298-920251004.xhtml#bib18), pp. 1–35). In light
    of this, give careful consideration to training employees on the safe and secure
    use of GenAI, either as a stand-alone project or as an extension of regular cybersecurity
    awareness training ([Milmo, 2023](#978-1-83608-298-920251004.xhtml#bib14)). The
    dangers of using AI should be discussed in training as well, with a focus on data
    security and legal obligations. Deep learning algorithms are used to develop large
    (trained on massive text datasets from the internet), languages (operated based
    on human language) and models (used to make predictions) ([Orton-Johnson & Prior,
    2013](#978-1-83608-298-920251004.xhtml#bib15)). Users engage with LLMs like ChatGPT
    (GPT) to perform tasks like customer service conversations and content creation.
    The multidimensional task showcases the abilities of LLMs in text and image generation,
    summarisation, comparison and analysis ([Matsuo et al., 2022](#978-1-83608-298-920251004.xhtml#bib12)).
    LLM biases are a reflection of societal biases that are embedded in human language
    and culture. The development, instruction and use of AI systems all contribute
    to the perpetuation of these biases. The overrepresentation of socioeconomically
    advantaged groups in interactions with AI tools, such as internet users and English
    native speakers, combined with a lack of diversity among developers results in
    representational biases; preexisting stereotypes and societal discriminations
    are present in the datasets presented as historical biases (Collett & Dillon,
    2019; [Cui et al., 2023](#978-1-83608-298-920251004.xhtml#bib10)). According to
    [Ntoutsi et al. (2020)](#978-1-83608-298-920251004.xhtml#bib105), these biases
    not only continue but also intensify discriminatory behaviours that are difficult
    to measure or quantify in daily life. Layers of interpretation entwined with data
    represent structural disparities associated with the intersectionality of gender,
    race, age and class, among other factors ([Joyce et al., 2021](#978-1-83608-298-920251004.xhtml#bib103);
    [Singh, 2020](#978-1-83608-298-920251004.xhtml#bib23), pp. 51–59). Compliance
    directly addresses each of the risk functions (Aziz & Dowling, 2019) of credit,
    market, and operational risk, it is perhaps most closely associated with enterprise
    risk management. The use of labour in conjunction with exposure to upsetting material
    without sufficient assistance serves as an example of how LLMs function as technology
    about relationships and systems, manifesting as real, covert exploitation of human
    endeavours ([Yin, 2009](#978-1-83608-298-920251004.xhtml#bib29)). Despite the
    recent attention given to generative text and image tools, businesses have been
    sluggish in establishing regulations for AI. Nearly half of senior leaders worry
    that large language AI models, like those used for writing, could create false
    information within the company. AI generating flawed legal documents and similar
    mistakes could happen with internal reports or client emails. Using AI to write
    code can be helpful, but it also carries risks. If an IT team relies on AI-generated
    code, it might contain hidden flaws that hackers could exploit. Additionally,
    some free AI tools record the prompts users provide, which could expose sensitive
    company data if it''s included in a prompt. As governments establish AI regulations,
    companies need to be aware of them. Without someone monitoring these regulations,
    employees might unknowingly expose the company to legal trouble in the future.


    ### 4\. Conclusion


    The realm of Shadow AI presents a complex and evolving landscape, demanding careful
    consideration of ethical, technological and organisational implications. As AI
    technologies continue to advance, it is imperative to strike a balance between
    innovation and responsible deployment. The risks associated with Shadow AI, such
    as unintended consequences, privacy breaches, and ethical dilemmas, cannot be
    ignored. Security and risk leaders must recognise the enduring nature of shadow
    AI. The proliferation of SaaS tools, on-premises development options and next-generation
    LLMs will likely fuel the growth of shadow AI projects. Understanding the motivations
    behind shadow AI adoption, such as the limitations of approved technologies, can
    help organisations develop effective mitigation strategies will be very important.
    *To navigate this landscape successfully, organisations should:*


    *Embrace Transparency and Accountability:* Promote open communication and transparency
    within the organisation to foster trust and reduce the need for shadow AI.


    *Foster a Culture of Ethical AI Development:* Establish clear ethical guidelines
    and provide training to employees to ensure responsible AI practices.


    *Implement Robust Governance and Oversight:* Implement effective governance frameworks
    to monitor and manage AI development, including shadow AI initiatives.


    *Invest in AI Education and Awareness:* Educate employees about the potential
    risks and benefits of AI to foster informed decision-making.


    *Continuously Monitor and Assess Risks:* Regularly assess the risks associated
    with shadow AI and adjust mitigation strategies accordingly.


    *Encourage Ethical Collaboration:* Collaborate with external stakeholders, such
    as researchers, policymakers and civil society organisations, to address the broader
    societal implications of AI.


    By proactively addressing these issues, organisations can harness the potential
    benefits of AI while minimising the risks associated with shadow AI. The future
    of AI depends on our ability to navigate this complex terrain with ethical responsibility
    and foresight.


    ### References


    Aziz, S., & Dowling, M. (2019). Machine learning and AI for risk management. In
    T. Lynn, G. Mooney, P. Rosati, & M. Cummins (Eds.), *Disrupting finance: FinTech
    and strategy in the 21st century* (pp. 33–50). Palgrave Macmillan.'
