    3(1), 99–111. [https://doi.org/10.1007/s43681-022-00150-y]

    - Siau, K., & Wang, W. (2020). 人工智能 (AI) 伦理：AI 伦理与伦理 AI。*Journal of Database Management*,
    31(2), 74–87. IGI Global. [https://doi.org/10.4018/JDM.2020040105]

    - Tagay, A. A., Syzdykova, K. S., & Halmurzaeva, K. R. (2023). 数字经济转型中的“大数据”技术。*Qainar
    Journal of Social Science*, 2(2), 76–94. [https://doi.org/10.58732/2958-7212-2023-2-75]

    - West, J. D., & Bergstrom, C. T. (2021). 科学及关于科学的误导信息。*Proceedings of the National
    Academy of Sciences*, 118(15), e191244117. [https://doi.org/10.1073/pnas.191244117]

    - Wirjo, A., & Calizo Jr., S. C. (2024). 不仅仅是扩张：为什么第三次信息技术协议 (ITA3) 需要大胆？APEC
    秘书处，亚太政策支持部门。

    - Zhuang, Y., Wu, F., Chen, C., & Pan, Y. (2017). 挑战与机遇：从大数据到 AI 2.0 知识。*Frontiers
    of Information Technology & Electronic Engineering*, 18(1), 3–14. [https://doi.org/10.1631/FITEE.1601883]

