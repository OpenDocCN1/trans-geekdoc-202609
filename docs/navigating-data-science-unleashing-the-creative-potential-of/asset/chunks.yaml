    | :--- | :--- | :--- | :--- |

    | 1. | Google 和 Boehringer Ingelheim | 制药与药物发现 | Google Quantum AI 团队与 Boehringer
    Ingelheim 合作研究分子动力学的计算方法。 |

    | 2. | JPMorgan Chase 和 IBM | 金融服务 | JPMorgan Chase 与 IBM 合作开发用于定价和欺诈检测等复杂金融问题的量子计算解决方案。
    |

    | 3. | Google Quantum AI | ML | Google 正在开发量子机器学习以改进 AI 模型的训练和性能，可能带来更准确的 AI 系统。
