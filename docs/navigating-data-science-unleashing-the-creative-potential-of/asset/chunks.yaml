    # 专家系统


    专家系统是人工智能的一个子集，展示了人工智能系统中的决策能力。这些系统利用基于知识的推理规则来解决需要人类专业知识和思维能力的问题 (Omita & Niu,
    2021)。专家系统的关键要素是知识库、推理引擎、用户界面以及由专家提供的领域知识。图 8.2 展示了专家系统的工作原理，其中专家知识是首要组成部分。知识库由使用
    `if-then-else` 语句的规则定义。获取的知识和规则集被应用于得出给定问题的结论。专家系统的有效性取决于专家提供并存储在知识库中的数据 (Sarker,
    2022)。通过存储和收集大量的知识，专家系统的性能和决策能力得到了提高。以下是专家系统的重要应用：


    *   专家系统已用于制造和设计汽车和 `VLSI` 系统等物理设备。

    *   开发如血液诊断、特定疾病推理和检测内部故障等系统。

    *   使用专家系统开发不同领域的预测系统，例如降雨预报、天气预报和能量预测。

    *   它可以用于任务的规划和调度。

    *   监控系统也是专家系统的应用，用于将观察到的系统行为与指定数据进行比较，以检测油管道中的某些故障和泄漏。

    *   诊断计算机和车辆制造过程中的故障。


    ![image](img/f08-02.jpg)


    图 8.2. 专家系统的工作原理。


    ## 1.1.2 机器学习技术


    机器学习（ML）是人工智能的一个分支，通过从数据集中学习来提高专家系统的学习能力 (Górriz et al., 2020)。基于机器学习的人工智能技术更具适应性和动态性，不需要为每个新任务显式地开发和编程
    (Chen et al., 2008)。基于机器学习的系统可以利用特定领域的数据思考并学习给任务 (Mellit & Kalogirou, 2008)。机器学习技术分为监督学习、无监督学习和强化学习，讨论如下：


    ### 监督学习技术


    监督学习使用标记的输入数据来执行分类和预测任务。标记数据集包含标记的输入和输出参数，学习算法将输入数据点映射到输出数据，以获得准确的结果。监督学习技术有两种类型，即分类和回归。分类算法被称为
    `classifier`（分类器），用于使用训练数据集对标记输入进行分类，并产生 `yes/no`、`spam/not spam` 和 `0/1` 作为输出类。例如，垃圾邮件检测、疾病预测、图像分类、欺诈检测等都是分类问题。分类器有两种：`binary`（二分类器）和
    `multi-class classifier`（多分类器）。如果问题有两个结果（如 `yes/no`、`true/false` 和 `0/1`），则它被称为
    `binary classifier`。`Multi-class classifier` 包含两个以上的类，例如作物类型、音乐分类。`SVM` 是一种基于统计学习理论的著名监督分类器。它已被用于解决分类以及回归问题。`SVM`
    算法通过一条最佳直线或决策边界将 n 维空间划分为不同的类。`SVM` 在能量预测和预报领域有大量的应用。分类器提供了高准确性，并使用显著较少的内存在高维空间中良好工作。监督学习算法
    `random forest`（随机森林）通常用于分类和回归分析 (Kaur et al., 2022)。它是一种集成学习算法，通过结合多个分类器来解决复杂问题并提高模型性能。`random
    forest` 的重点是处理大量数值。


    *   `Decision trees`（决策树）用于分类和预测问题。它是一种类似于流程图的树结构，从数据集中学习。`Decision tree` 是以树形式存在的分类器，由叶节点和决策节点组成。叶节点是目标属性或测试结果，决策节点对属性执行某些测试。`K-Nearest
    Neighbors` (`K-NN`，k 最近邻算法）是一种最初用于模式识别和统计分析的非参数分类算法。输入由 `K` 个最近的数据值组成，形成一个聚类或组。当出现未分类的值时，它被分配给具有邻近邻居的组。


