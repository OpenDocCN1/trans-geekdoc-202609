    ## 第 1 章


    ## 数据科学与人工智能：探索医疗保健领域的协作潜力


    Kumar Shalender^a, Babita Singla^a 和 Nripendra Singh^b


    ^a 印度旁遮普邦，奇特卡拉大学，奇特卡拉商学院


    ^b 美国，宾夕法尼亚州大学


    ### 摘要


    本章探索了数据科学和人工智能（AI）在医疗保健领域改变游戏规则的潜力，专门研究了用例，旨在为行业在更高水平上实施该技术制定实践指南。通过分析医疗保健行业中数据科学和人工智能的用例，本章识别了这些技术的结合使用为利益相关者带来卓越效益的关键领域。这些案例随后成为开发实践指南的基础，医疗保健行业可以采用这些指南来采纳、整合并加强在业务性能相关领域对技术的使用。本章最后指出，要在医疗保健领域长期采用数据科学和人工智能，需要采取整体方法。该研究还强调了行业与决策者之间的紧密合作，以确保技术的持续应用。


    **关键词**：人工智能（AI）；协作；数据科学；医疗保健部门；决策者


    ### 1. 引言


    数据科学和人工智能（AI）的变革性潜力刚刚刚刚在学术界和企业领域开始被提及。技术正在使企业对其产品进行根本性改变，并帮助他们向目标市场交付卓越价值。从汽车行业到快消品（FMCG）行业、消费耐用品行业到出口行业，数据科学和人工智能的使用为增长开辟了新途径。在此背景下，本章探索了数据科学和人工智能对医疗保健行业的变革性潜力。医疗保健部门不仅在对经济的贡献方面非常重要，在确保大众能以负担得起的价格获得高质量服务方面同样重要。技术在保证提供高质量医疗服务方面的作用是不言而喻的。数据科学和人工智能具有人工智能具有巨大潜力，通过将技术整合到职能部门和运营机制中，该部门可以利用技术实现增长和盈利的新高度。医疗保健领域生成式智能的应用范围之大，使得各垂直行业的企业现在正投资数据科学和人工智能，以开发专门与医疗管理相关的产品（Aggarwal
    et al., 2020）。本章由以下章节组成：讨论了与医疗保健部门相关的数据科学和人工智能的用例，随后开发了可以帮助行业持有者在医疗实践中使用该技术的概念框架。在框架开发之后是结论与讨论，同时作者们还详细阐述了与医疗保健行业中使用数据科学和人工智能相关的重要启示。该研究对医疗生态系统中的所有利益相关者具有重要意义，通过关注与行业价值链相关的特定收益，本章将为未来的研究奠定基调（Bisam,
    2024）。


