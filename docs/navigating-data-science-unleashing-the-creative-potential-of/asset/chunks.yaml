- raw: 'Now attention can be focused on the direct implications and consequences of
    the unbridled usage of AI-based algorithms and what the future of AI in governance
    can entail through detailed examples and attractive features that AI has introduced
    in lives. The digital age is an algorithmic archipelago, a vast landscape where
    algorithms shape the experiences whether liked or not. Personalization is a way
    to provide individual users with the information and services that is relevant
    to them. While it is desirable, AI algorithms raise concerns about giving them
    so much control over our lives. Algorithms curate information based on past behaviour,
    creating what we call ‘filter bubbles’ that reinforce existing beliefs ([Samuels,
    2012](#978-1-83608-298-920251006.xhtml#bib44)). Many social media platforms, like
    Facebook and Instagram, promote engagement by recommending content which more
    often than not confirms the users'' bias ([Leonidas et al., 2017](#978-1-83608-298-920251006.xhtml#bib29)).
    This can lead to dichotomy in the society which is undesired. For instance, in
    the 2016 US elections, filter bubbles may have contributed to the spread of misinformation
    as a result influencing the voters ([West & Bergstrom, 2021](#978-1-83608-298-920251006.xhtml#bib50)).
    They can also inherit and amplify social biases because of the data that they
    were trained on. For example, facial recognition software has been known to be
    more accurate for fair skin tones, potentially leading to discriminatory policing
    practices. Now whether that was because the data which the model was trained on
    had more fair skin toned people is a completely different thing, but in the end,
    this is one of the many challenges we would be facing. Nowadays even resume screening
    is done using these algorithms, and if we aren''t careful enough the algorithm
    might just be filtering out candidates on the basis of something totally unrelated
    to the job. This raises concerns about equal opportunity and even potential lawsuits
    based on algorithmic bias. As the algorithms become more sophisticated, they may
    even start dictating the choices we make even if they weren''t designed to do
    so. The so-called ‘Recommendation Systems’ can nudge us towards specific products
    and services, restricting our options without us knowing. As societies become
    increasingly dependent on algorithms, there''s a growing need for transparency.
    Understanding how these algorithms work and the data they are trained on is crucial
    for their accountability. There are many ongoing efforts to develop regulations
    that promote transparency and fairness in algorithmic decision-making. For example,
    the European Union''s GDPR grants individuals the right to access and control
    their personal data used in algorithms. Another one of the challenges which we
    dwell upon are, the spread of misinformation and ‘fake news’ in this digital age.
    Algorithms which are programmed/not programmed to promote engagement over truth
    can amplify the impact of such things thereby creating a false narrative. Additionally,
    the opacity of some algorithms such as ML models or DL models creates difficulties
    in tracking which content they recommend ([Esteves, 2022](#978-1-83608-298-920251006.xhtml#bib14),
    pp. 39–59). In conclusion, in this digital age the algorithmic archipelago presents
    both challenges and opportunities. While things like personalization and convenience
    are undeniable upsides, the potential downsides can''t just be ignored. To have
    a sustainable growth of this landscape as well, we will have to be mindful of
    the power we give to these algorithms. Promoting transparency, developing legal
    frameworks to address the bias generated if any and promoting critical and ethical
    thinking are crucial to make sure that algorithms serve, rather than subjugate,
    our humanity. From a research perspective, it can be concluded that apprehensions
    surrounding Big data can take the form of accessibility, vulnerability, representativeness,
    etc. while deploying the decision-making capabilities of AI systems that are wholly
    based on decades of data collection using Big data.


    ### 9\. Future Dilemmas


    It is to ponder who exactly can be held responsible for limitations and consequences
    of Big data usage – the large corporations that collect data or researchers that
    use it? And even if somehow accountability is specified, how exactly will the
    people or systems responsible undo the existing apparatus that employs Big data
    heavily? How can the general public with little knowledge of these systems be
    reassured of correct usage of their data? These are the questions that individuals
    and organizations with the necessary resources and knowledge (and hence power)
    are still unwilling to answer.


