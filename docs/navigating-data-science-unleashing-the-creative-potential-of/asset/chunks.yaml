- raw: '**Kumar Shalender** (Post Doctorate, PhD) holds expertise in the fields of
    strategic marketing, leadership change, and technology management. He is an Associate
    Professor at Chitkara Business School, Chitkara University, Punjab, and has been
    involved in devising corporate strategy, business models and sustainability ecosystems.
    He has more than 80 publications to his credit, including 49 papers in highly
    reputed Scopus-indexed journals, international and national conferences, seminars
    and symposiums. Dr Kumar also holds authority on solving intricacies of design
    thinking, innovation culture, collaborative practices and team dynamics. He is
    associated with leading publications in the sustainability space and is having
    regular interactions with professionals on developing sustainable ecosystems across
    industries in the country.


    **Dr Nripendra Singh** is a tenured Full Professor of Marketing in the Department
    of Business, Economics and Communication, College of Science, Technology and Business
    at the Pennsylvania Western University. He is a recipient of Fulbright scholarship,
    a flagship programme of the United States Department of State, Bureau of Educational
    and Cultural Affairs. He completed Fulbright research at the Pennsylvania State
    University. As a visiting research scholar, Dr Singh visited renowned institutions
    such as University of California at Berkley, CA, and Technology University, NJ.
    He is a Post-Doc Fellow of the Global Institute of Flexible Systems and Technology
    and ‘Campus-2-Capitol Fellow’ of Bard College, NY. He earned two doctorate degrees
    and two MBA degrees. As a certified professional, he completed the Preparing Future
    Faculty programme at the Iowa State University. Dr Singh is an avid researcher
    and is on the editorial board and reviewers committee of several reputed journals.
    He has published and presented more than 100 research articles in reputed journals
    and conferences. He is the President and Director of ‘International Association
    of Technology and Management’, a nonprofit to promote research, and ‘Clarion Consulting
    Center’ to provide consulting services to businesses and help students get real-world
    projects. He mentors and advises young faculty members, research scholars and
    undergrad students globally.


    About the Contributors


    **Shveta Bansal** is working as an Assistant Professor in the Department of Computer
    Science and Engineering at Chitkara University, Punjab, India. She received her
    PhD in Computer Engineering from Thapar University, Patiala, India. Her research
    interests are cloud computing and IoT, and she has many related publications in
    esteemed SCI journals and national and international conferences.


    **Anant Bhatt** is an alumnus of the Indian Institute of Technology, Kharagpur,
    and did research at the University of Maryland, USA. Colonel is an AI Researcher
    and possesses profound knowledge and experience in Army operational communications,
    cybersecurity, and satellite communication. He is an Electronic Warfare Expert.
    He has significant proficiency in satellite analysis and robotics. He is a qualified
    Psychologist. The colonel has strived hard to keep up his zeal for learning and
    completed Master’s in Intellectual Property Law. Colonel Anant Bhatt is a proud
    recipient of the coveted Prime Minister Certificate of Merit and Award twice,
    a Certificate of Recognition from the Defense Minister award, Certification of
    Innovation from the Chief of Defense Staff, a Commendation Card from the Chief
    of Army Staff and Commendation Card from General Officer in Command Southern Command
