    backgrounds, which hinders their comprehension and leads them to attribute their
    problems solely to the algorithm. These workers must receive proper training in
    algorithm fairness to address their issues. A researcher shared her doubt about
    bias in algorithm management in gig work:


    Algorithms used by gig economy companies can exhibit bias, particularly if they
    are trained on biased datasets. For instance, they might inadvertently favor certain
    demographics over others, leading to unequal distribution of job opportunities
    or pay disparities. Bias can arise from factors like geographic location, user
    ratings, or even the type of tasks assigned, potentially reinforcing existing
    social inequalities.


    Perceived control is the belief held by an individual that they can influence
    their internal states, behaviors, and external environment ([Pagnini et al., 2016](#978-1-83608-298-920251005.xhtml#bib24)).
    According to [Infurna et al. (2011)](#978-1-83608-298-920251005.xhtml#bib16),
    having a sense of control can reduce the chances of experiencing negative health
    effects. People who believe they have more control are more likely to take care
    of their health by engaging in preventive measures and physical activity. Perceived
    control is a psychological construct that reflects an individual''s conviction
    in their capacity to exert influence and regulate their own life. It includes
    elements like possessing an internal locus of control (believing that one''s actions
    determine outcomes), self-efficacy (confidence in one''s abilities), mastery (feeling
    competent and skilled), and personal autonomy (having the freedom to make choices
    and decisions). A robust sense of control implies a firm conviction that an individual
    possesses the capacity to exert influence over the result of a specific circumstance.
    These individuals actively utilize coping strategies to effectively manage stressful
    situations, thereby protecting themselves from stress and increasing their chances
    of achieving positive outcomes ([Jung et al., 2023](#978-1-83608-298-920251005.xhtml#bib17)).
    Enhancing employee control will have a beneficial effect on their perceived control,
    which in turn will positively influence outcomes such as job satisfaction and
    reduce physical and emotional distress as well as role stress ([Spector, 1996](#978-1-83608-298-920251005.xhtml#bib28)).
    If individuals wish to go on a vacation, they can readily notify others and remain
    at their current location. There is no issue whatsoever. They are capable of functioning
    autonomously without any human supervisor to interrupt their work. Perceived control
    in gig work refers to an individual''s understanding and interpretation of the
    information that is controlled by the labor platform. The individual''s commitment,
    actions, and work recognition can be influenced by their personal value judgments,
    which are in turn impacted by this interpretation ([Lang et al., 2023](#978-1-83608-298-920251005.xhtml#bib19)).
    AM is crucial for overseeing diverse workers, such as UPS delivery personnel,
    hotel housekeepers, retail staff, journalists, and physicians. The surge in remote
    work has rendered white-collar and managerial employees vulnerable to automated
    surveillance. Uber, as an illustration, employs a workforce of 26,900 individuals
    and oversees a network of 3.9 million drivers across the globe. AM in non-gig
    work settings is met with varying levels of approval but is generally acknowledged
    for its ability to enhance collaboration and optimize work procedures. Factors
    such as lack of transparency in algorithms and management, continuous monitoring
    of behavior, and lack of support can result in feelings of frustration, exhaustion,
    and a high rate of turnover among gig workers ([Zhang et al., 2022](#978-1-83608-298-920251005.xhtml#bib34)).
    These challenges can be mitigated through the implementation of effective algorithm
    management and the open sharing of knowledge regarding its implementation with
    the gig workers, who constitute the primary stakeholders.


    #### 5.3 Employment Practices in Food Delivery Service


    The employment practices in the food delivery service industry diverge significantly
    from traditional job roles. Gig workers experience autonomy, flexibility, and
    financial incentives. However, the autonomy and personal choices granted to gig
    workers give rise to an intricate work identity as they frequently engage in diverse
    jobs that involve hybrid roles. The market''s response to these choices has implications
    for the worker''s ego, identity, and finances. Gig workers face the challenge
    of balancing different work identities and dealing with the absence of a distinct
    work identity. This can be particularly difficult as gig workers often have to
    manage multiple jobs simultaneously ([Ashford et al., 2018](#978-1-83608-298-920251005.xhtml#bib4)).
    The impact of gig work on worker autonomy and adaptability is not inherent, but
    rather a political construct shaped by socio-economic circumstances and technological
    platforms. While certain employees appreciate these advantages, others encounter
    severe working conditions as a result of their positionalities ([Anwar & Graham,
    2021](#978-1-83608-298-920251005.xhtml#bib2)). Work-related stress factors, such
    as conflicting roles, uncertainty, and excessive workload, can greatly contribute
    to the occurrence of work–family conflict (WFC). These stressors have the potential
    to extend into an individual''s family life, creating challenges in separating
    oneself from work-related worries. Research has demonstrated that elevated levels
    of role overload, conflict, and ambiguity are linked to a rise in WFC. When employees
    are burdened by work-related responsibilities, they may require assistance in
    fully engaging with their family members, participating in family activities,
    or fulfilling their caregiving duties. Role conflict in the workplace can greatly
    affect employees'' WFCs. The correlation between WFC and employees'' psychological
    distress has been thoroughly examined in diverse industry sectors. Extended exposure
    to WFC can result in burnout, emotional fatigue, cognitive fatigue, depersonalization,
    and diminished personal achievement. Experiencing chronic stress due to the demands
    of juggling work and family obligations can result in feelings of being overwhelmed,
    anxious, and tense, which can contribute to psychological distress ([Abdou et
    al., 2024](#978-1-83608-298-920251005.xhtml#bib1)). Gig workers firmly believe
    that they possess a high degree of work flexibility. Work flexibility encompasses
    both temporal flexibility and the extent to which employees have the freedom to
    select their work location and methods. These choices can significantly influence
    various work and life-related factors, such as work-family balance and emotional
    exhaustion ([Ma, 2018](#978-1-83608-298-920251005.xhtml#bib22)). Therefore, the
    presence of multiple role identities and excessive work demands can give rise
    to WFC, ultimately resulting in psychological distress. However, it is worth noting
    that work flexibility can provide some degree of assistance in this regard. The
    implementation of additional employment strategies aimed at enhancing individuals''
    well-being may foster trust in AI.


    *P3. Implementing optimal employment strategies by gig platforms will support
    gig workers'' trust in AI.*


    However, gig workers are currently dissatisfied with their employment benefits,
    as evidenced by their response: “They offer medical insurance; however, there
    is a lack of clarity regarding how to utilize or claim it.” Additionally, they
    offer raincoats at a significantly reduced cost during periods of precipitation.
    Also, she stated, “Women are granted two paid rest days per month. However, there
    are specific working conditions that must be met to access them.” One of the respondents
    who is a customer thought:'
