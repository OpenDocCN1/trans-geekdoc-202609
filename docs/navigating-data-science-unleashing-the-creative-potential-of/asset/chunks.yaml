- raw: 'Brain–computer interfaces can create a bridge between the brain and computer
    in order to control the devices with the thoughts of the human. Compared with
    traditional input devices such as a mouse or keyboard, a BC interface transforms
    the brain signals into computer-based control commands. These interfaces focus
    on enabling well-equipped facilities such as smart wheelchairs or prosthetic limbs.
    AI networks will provide high-speed data transmission with minimum latency to
    enable and process real-time brain catalysts. Some emerging technologies like
    edge, fog, and terahertz communication will use AI programs in the future to develop
    portable and sophisticated BCIs, enhanced performance, high computing, and processor
    capabilities ([Chataut et al., 2024](#978-1-83608-298-920251008.xhtml#bib3)).
    Additionally, with the day-to-day advancement of AI programs, more and more research
    possibilities will arise for creating and deploying customized BCI applications.


    #### 2.4 Blockchain With AI and 6G


    A decentralized technology that makes it easy to record transparent and safe digital
    transactions is known as blockchain. Integrating blockchain with AI provides numerous
    benefits and potential uses to the users. 6G, along with AI, with its anticipated
    increased network capacity, decreased latency, and improved data transfer rates,
    could enable the processing of complicated transactions and applications in real
    time ([Shao et al., 2022](#978-1-83608-298-920251008.xhtml#bib23)). Blockchain
    technology, an innovation, or a business intelligence program can be used to trace
    device history. Block bodies and headers are related strings that make up a blockchain.
    All of the block''s transactions make up the block body. However, the hash value
    is used to build the block header, a Merkle root of the transactions in the preceding
    block and its timestamp. As a result, each block is generated and connected to
    the others using the hash value of the preceding block. Any block interfered with
    will alter its hash value, impacting all other blocks. This indicates that blockchain
    technology will be available to safeguard data integrity. Aside from cryptocurrencies
    like Bitcoin, blockchain technology has been utilized to improve and optimize
    already-existing systems like cloud storage, authentication, healthcare, and more
    ([Gill et al., 2022](#978-1-83608-298-920251008.xhtml#bib8)). The device''s credibility
    will rise due to the integration of blockchain, which enables a transparent audit
    trail of the data and models used to validate the machine''s decision process.
    In terms of machine-to-machine communication, the latter is crucial. Furthermore,
    by reducing the action space, applying AI code over Decentralized Autonomous Organizations
    (DAOs) with smart contracts connected reduces catastrophic risk situations.


    Enhancing communication and transaction security and privacy is one possible application
    of blockchain technology in 6G and AI. The high throughput and speed provided
    by AI and 6G improve data security and defend against hacks and data breaches
    in blockchain-based systems ([Qiao et al., 2021](#978-1-83608-298-920251008.xhtml#bib20)).
    It can also analyze and store vast amounts of sensitive information more securely,
    such as records of financial transactions or medical reports and prescriptions.
    Although the blockchain with AI is still in its early stages of development, it
    has a wide range of potential uses for the stakeholders.


    #### 2.5 Space Exploration With AI


    The development of AI technology could make real-time communication easier, which
    directly impacts space missions. AI facilitates quick decision-making and simplifies
    missions between spacecraft and ground control. This also will produce more precise
    and thorough information for finding new scientific possibilities, guaranteeing
    reliable and continuous connection. Also, AIs with high-resolution virtual and
    augmented reality will provide increased network capacity and reduced latency,
    providing more captivating opportunities for space exploration researchers ([Qiao
    et al., 2021](#978-1-83608-298-920251008.xhtml#bib20)).


    #### 2.6 AI in Augmented Reality (AR)


    The seamless integration of the virtual and physical worlds is made possible by
    AI technology to provide real-time capabilities in mixed and augmented reality
    (MAR). In AR applications, the enhancement of visual and sensory aids can be achieved
    by transmitting high-resolution virtual and augmented reality data ([Dwivedi et
    al., 2021](#978-1-83608-298-920251008.xhtml#bib5)). Integrating 6G and AI creates
    new opportunities for product visualization, entertainment, and education.


    Furthermore, AI can create virtual links with people who are remotely located
    for social interaction, gaming, and remote connections. The main purpose of using
    AI with MAR is to protect private and confidential data with end-to-end security
    features ([Chataut et al., 2024](#978-1-83608-298-920251008.xhtml#bib3)).


    #### 2.7 Internet of Things (IoT) and AI


    IoT provides significant opportunities and transformation to industries when combined
    with AI, i.e., the Industrial Internet of Things (IIoT) ([Verma & Bala, 2021](#978-1-83608-298-920251008.xhtml#bib29)).
    This integration results in effective and flexible real-time industry communication
    ([Gill et al., 2022](#978-1-83608-298-920251008.xhtml#bib8)). With AI''s high
    processing speed and power capabilities, IoT applications can improve decision-making
    accuracy and provide more insight analysis of large amounts of data collected
    from sensors and other devices. Moreover, industrial environments can provide
    stronger protection against cyber threats and data loss while using the sophisticated
    security features in AI-based IoT applications. The latest emerging IoT-based
    solutions, such as remote industrial system, control and prediction system, may
    become possible by integrating AI and IIoT ([Chataut et al., 2024](#978-1-83608-298-920251008.xhtml#bib3)).
    AI can potentially reduce costs by accelerating the development of automated and
    intelligent industrial systems.


    #### 2.8 AI in Robotics


    The application of AI in robotics is anticipated to be substantial and impactful
    because of the enhanced capabilities and better connectivity of 6G networks. The
    real-time control and communication between autonomous robots and drones through
    AI algorithms will improve their speed and accuracy. New applications such as
    intelligent homes, smart industries, and autonomous vehicles will be enabled with
    advanced AI-powered systems that will only work in sophistication ([Shao et al.,
    2022](#978-1-83608-298-920251008.xhtml#bib23)). Moreover, better natural language
    processing capabilities will open many doors for virtual assistants. In industrial
    settings, AI will be utilized for prediction maintenance and monitoring. Also,
    AI integration with 6G networks will enable the prediction, management and monitoring
    of robotic equipment remotely in unexpected, dangerous conditions ([Chataut et
    al., 2024](#978-1-83608-298-920251008.xhtml#bib3)).


    #### 2.9 AI-Enabled Autonomous Vehicles and Intelligent Transportation Systems'
