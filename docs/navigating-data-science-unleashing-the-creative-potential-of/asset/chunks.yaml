    数据强调了新冠肺炎爆发对低收入家庭造成的负面影响，阻碍了全球减贫进程，预计 2020 年底收缩概率为 -3%（IMF, 2008）。基本假设是疫情将在 2020
    年底消退，但持续时间超过了预期。由于全球经济分析可以从疫情的完全消失中得出，因此研究客观、无偏且非偏差的数据至关重要。因此，我们考虑了 2020 年 4 月发布的
    WEO 数据，该数据涵盖了从 1980 年到 2020 年的时间跨数据，并对选定指标进行了中期预测。为了了解印度背景的洞察，我们关注了近期数据，即印度联邦机构发布的研发统计数据（Research
    DST, 2019）。该报告总结了收集自来自不同部门/利益相关者（即政府、州政府、公共部门和私营部门行业）的 6,800 多家科技机构的数字。调查报告通过报告各种投入-产出科技指标数据，以及印度政府企业和私营部门所投入的领域特定研发支出投资，涵盖了国家研发版图。我们利用该报告对印度背景进行了深度分析，得出了推论，并与全球统计数据进行了比较。


    ## 3. 印度地位：全球经济格局


    在保持印度背景为焦点的同时获取全球视角，我们探索了经济发展的全球性性数据、分析和预测。进行了整合了《全球金融稳定报告》和《外部部门报告》的 WEO 数据库分析。利用发达国家（具有深厚的科技实践和成果）的统计数据进行比较分析。图
    3.2 展示了印度背景的 GDP 统计图（从 1980 年到 2018–2019 年）。数据由国家统计局按财政年度（4 月至翌 3 月）发布。数据包含了 1998
    年至 2011 年间计算的实际 GDP 增长率，发布在 2008 年国民核算体系中。自 1995 年以来，该国的名义 GDP 增长了超过 700%，在过去
    25 年中出现了惊人的激增，印度在 2010 年位列第九，落后巴西和意大利等国；2019 年位列第五。由于金融部门观察到挑战，增长速度从 8.3% 放缓至
    4.0%（2017 财年至 2020 财年之间）。新冠肺炎影响了全球经济，也导致印度经济在 21 财年收缩了 7.3%。


    ## 4. 科学计量学分析


    （注：此处保留了原文的标题翻译结构）

    印度的发展规划方法已通过将大量资源投入科技、教育、培训和研究。科技基础设施（如国家实验室、研究设施和学术机构）取得了显著成果。印度通过机智的政策和路线图推动了合理的总支出（主要通过政府部门）。分析得了经济（GDP）、研发支出、科技人力资源、研发领域人力投入以及知识产权注册之间的联系。科研论文、出版物、商标和专利是路线图的最终反映。十年来，印度政府通过其科技机构扩展了额外的研发支持，这些措施具有重要支持作用。影响科技范式的重要因素将在后续章节分析。


    ![image](img/f03-02.jpg)


    图 3.2 印度 GDP 统计数据（1980 年至 2018–2019 年）及 GDP 增长率。


    ### 4.1 研发投资


    全球对科技（STI）的关注得到了大量投资的支持（2009 年高达 1.2 万亿美元），而印度的研发投资数字难以达到相应档次（低于全球投资的 2.5%）。2009
    年印度的研发投资仅占 GDP 的 1%。然而，印度愿景是将其研发总支出（GERD）增加到 GDP 的 2%，并作为国家议程。由于工业研发投资在 2005 年到
    2010 年间增长了 250%，销售额增加了 200%，印度计划与私营部门合作来实现计划。私营投资可以将研发成果转化为商业结论。通过协同日益增长的研发投资和私营部门的力量，印度政府采取了建设性措施以增加其总预算支持。良好生态系统支持的及时行动已显示出其影响，印度在科学出版方面位全球第九，在获得专利方面位列全球第十二。负责编织国家层面“投资”织物的线条强度已进行了分析，并与全球领先者进行了比较。


