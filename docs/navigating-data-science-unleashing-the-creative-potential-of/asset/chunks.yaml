    ## Chapter 5


    ## Influence of Ethical AI Practices on Gig Workers'' Trust and Psychological
    Well-being


    K. Shanthi and Suganya V.


    Faculty of Management, SRM Institute of Science and Technology, Chennai, Tamil
    Nadu, India


    ### Abstract


    This study investigates the ethical ramifications of the gig economy by analyzing
    the complex relationship between artificial intelligence (AI)-driven optimization,
    timely order completion, and gig workers'' well-being, drawing on the utilitarian
    theory of ethics. The study''s goal is to assess the ethical AI practices that
    affect gig workers'' trust in AI and their psychological well-being. Qualitative
    research using an open-ended questionnaire and deductive thematic analysis guided
    by the proposed framework is used to examine the ethical use of AI in gig work.
    Overall, by addressing ethical considerations, AI-powered food delivery services
    can positively impact the psychological well-being of gig workers. Food delivery
    online services may provide advantages like convenience and accessibility, but
    they also give rise to significant ethical concerns that necessitate meticulous
    attention via transparent design, responsible execution, and regulatory supervision.
    The findings obtained from this study make a valuable contribution to formulating
    guidelines and policies to promote an ethically powered business. The research
    covers often-overlooked topics such as data privacy, algorithmic fairness, employment
    practices, and environmental sustainability. It also stresses the importance of
    proactive measures and stakeholder collaboration to ensure these services are
    ethical and benefit society.


    *Keywords*: Gig workers; ethical AI practices; AI-driven optimization; utilitarian
    theory of ethics; trust in AI; deductive thematic analysis


