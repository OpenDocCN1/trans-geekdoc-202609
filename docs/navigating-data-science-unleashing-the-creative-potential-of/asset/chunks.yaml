  trans: '


    使用过计算机营销系统的营销人员被迫重新诠释启发式原则的应用，同时还在扩大他们的触达范围。营销人员认为技术变革是重大的，但与自主营销系统产生的新环境相比，学习和适应的能力显得尤为明显。在为新系统提供输入、监管其运行以及评估其结果方面，这些新系统的利用改变了决策任务的量，更重要的是改变了决策任务的**质量**。换句话说，自动化似乎改变了启发式决策模型的应用领域（范围），而非取代它们。


    ### 3.1.6 情感分析


    有效的战略竞争研究需要了解消费者对竞争对手的感知以及影响这些感知的因素。这将有助于确定不同公司组成部分的实际优缺点。通过市场研究为业务目的收集的信息就包含在。实现这一目标的最佳方法之一是文本分析和情感分析。为了根据消费者感知生成报告，情感分析将品牌的产品和服务与其竞争对手进行对比。这些具有洞察力的数字可以帮助品牌从对手中脱颖而出。企业开始将
    AI 驱动的情感分析视为一种关键工具（Taherdoost & Mitra, 2023）。它更容易理解客户在想什么。它对于理解员工的想法和情感也有帮助。它通常用于理解客户评论、社交媒体提及、服务问题的严重性等。可以认为，情感分析在未来将被用于更详细地探索人们的情绪。它将增强计算机理解评论、信息和反馈中所述情感的能力。结果是公司将能够做出更具体的反应。此类研究的内容是回顾关于基于
    AI 的情感分析的文献，以便为未来的研究人员提供对领域进展更好的理解，并帮助他们跟上当前的发展。


    情感分析使营销人员能够通过定量方法对服务或产品消费者的态度和观点获得深刻且可靠的洞察。一个应用领域是营销，这使得能够识别社交媒体网络上关于产品、服务、公司和旅游目的偏好、态度和观点。在词云中，高频词排列在中心位置，并显示的字体大小与该词在文中出现的频率相对应。这正是分析的独特价值所在。本研究提供了对以
    `Mostar` 为旅游目的地进行情感分析所需的所有 `R` 编程语言特征和情感分析程序。由于其实时转换大量文本数据的能力，它是营销分析的一个非常有用的工具。


    ### 4. AI 在营销中的应用


    在营销 AI 工具应用中，研究人员引入了 `GPT-3`，这是一个最强大的生成式 AI 模型，最能够生成类人文本 Radford et al. (2019)。论文还讨论了营销中的应用，包括针对社交媒体帖的个性化通信和内容生成等。


    AI 在识别营销模式方面比人类更有效，并能更快地响应新信息，在业务决策方面，AI 正在取代人类提供准确的服务解决方案（Gkikas & Theodoridis,
    2020）。一种 AI 的方法帮助公司节省时间和金钱。此类研究的内容是回顾关于基于 AI 的情感分析的文献，以便为未来的研究人员提供对领域进展更好的理解，并帮助他们跟上当前的发展。


    ### 5. 数字营销与 AI


    AI 已经整合到数字营销中并提高了有效性 [Aslam (2022)]。流行的社交网络如 `Facebook`、`LinkedIn` 等采用 `ML` 模型来推荐用户关注、识别图像等。根据
    Gartner 2019 年的数据，有 37% 的企业利用 `AI` 进行内容管理和策展。`ML` 和 `NLP` 模型可以通过分析品牌的历史表现来获取社交洞察。我们每天使用的社交网络，如
    `Facebook` 和 `Twitter`，严重依赖于 `AI`。Facebook 识别标记照片中的面部，显示广告，发送与用户已互动过的类似的弹出窗口。Facebook
    还拥有 `Instagram`，这是一个使用 `AI` 识别和删除欺诈内容的社交媒体平台。Snapchat 跟踪用户的面部，并使用 `computer vision`（一种
    AI 技术）添加随面部实时移动的特效。


    LinkedIn 使用 `AI` 帮助广告主定位目标观众、衡量转化率、在动态中显示特定信息、推荐他们可能想要联系的职位，以及自动竞价 ([Kaplan &
    Haenlein, 2020]; [Kessinger, 2022]）。


    ### 6. AI 工具在营销中的应用


    AI 工具在营销活动中的应用已经出现且不可替代（[Jarek & Mazurek, 2019])。作者在本文中讨论了针对客户的个性化以提高客户体验和客户参与度，这将提高客户转化率。尽管处于早期阶段
    [Khoa (2021)]，但 AI 已经通过网站聊天机器人、手机虚拟助手和用于解释语音命令的 `NLP` 集成到日常活动中。


    ### 7. 客户参与中的 AI 驱动工具


    发现 AI 驱动工具在营销中发挥着主要作用，我们正处于 AI 驱动的市场 [Tuzhilin (2020)]。论文强调了营销的未来趋势以及对营销人员和消费者的潜在利益。AI
    工具帮助他们制定营销策略。


    '
