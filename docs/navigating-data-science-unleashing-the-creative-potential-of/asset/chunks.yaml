    ### 6\. Imperative Analysis


    International reports published by the survey conducting agencies help measure
    the nation''s effectiveness of the S&T policy by widely accepted concepts, guidelines,
    and surveys globally. Though the Indian STI reforms'' effectiveness can be analyzed
    by the R&D, patents, and publications output, these conventional indicator matrices
    record innovations from the formalized sectors only. The Indian survey conducted
    at the identified first or second-tiered institutions and agencies fails to cover
    the innovations and advancements in the informal sectors ([Charmes et al., 2016](#978-1-83608-298-920251003.xhtml#bib7)).
    Sizeable hidden indicators do not make it to the surface as most of the Indian
    workforce is still engaged in the informal economy ([Kraemer-Mbula & Wunsch-Vincent,
    2016](#978-1-83608-298-920251003.xhtml#bib26)), contributing to a significant
    chunk of the nation''s GDP. In addition, many non-quantifiable aspects do not
    get addressed and absorbed in these conventional measurements. Knowledge and sector-specific
    best practices at an operational level are aspects of innovation that are not
    noticed in any survey and traditional matrices ([Bonnet et al., 2019](#978-1-83608-298-920251003.xhtml#bib6)).
    Lack of identifying such innovations, measures for standard connect, and official
    medium to nurture these skills make it challenging to capture the workers'' in-house
    knowledge, informal networks, and ability to adapt or imitate formal network knowledge
    as per their requirements ([Basole, 2014](#978-1-83608-298-920251003.xhtml#bib2)).
    Though the National Innovation Foundation (NIF) identified more than 300,000 innovations,
    many such best practices are yet to be unearthed. On the other side, the institutions
    exposed to the procedures showed many patents, publications, and innovations with
    very little quotients of practical utility. Several instances brought out that
    the Indian S&T policy prioritized R&D for developing innovative solutions. However,
    the innovations from rural areas and unorganized sectors were ignored, thus ignoring
    the prevailing innovations and inherited knowledge.


    On the one side, the Indian Government promotes grassroots innovations, frugal
    innovations called Jugaad, generally belonging to the informal sector ([Sharma
    & Kumar, 2019](#978-1-83608-298-920251003.xhtml#bib35); [Sheikh, 2014](#978-1-83608-298-920251003.xhtml#bib36)),
    and the lack of where-with-all to formalize these innovations for registration
    ([Bhaduri & Kumar, 2011](#978-1-83608-298-920251003.xhtml#bib4); [Jain & Verloop,
    2012](#978-1-83608-298-920251003.xhtml#bib23)). Since these innovations are constrained
    to specific problems and realized with local resources, they lack patenting novelty
    with immediate sophisticated utility. The meager incentive structure and payoff
    of such innovations do not extend motivation to innovate further. Hence, conventional
    S&T indicators do not record these innovations. Integrating frugal innovations
    into formal S&T indicators encounters a significant hurdle. As the patenting procedure
    is absent in the informal sector, difficulties are being observed in verifying
    the frugal innovations for their applicability and authenticity. There exists
    a challenge to ascertain their application on a larger scale. Indian IPR agencies
    and conventional registration methods have not reached the informal sectors and
    thus have missed the count of all such innovations, failing to acknowledge them.
    Cohesively, the traditional innovation metrics leave out the genuine count of
    the innovations ([Shekar & Paily, 2019](#978-1-83608-298-920251003.xhtml#bib37)).
    The Indian industry-specific investment figures do not translate to the befitting
    outputs in S&T indicators. Though the government focus remains in the sectors,
    i.e. defence, mining, fuels and engineering, the private sector investments are
    relatively low. The private players emphasized prioritizing pharmaceutical, FMCG,
    biotechnology, agriculture, etc. sectors where government share is negligible,
    and the IPR statistics fail to cover any strong inferences. Although the public
    and private partnerships have helped informal innovations to be on board, “Indian
    Jugaad” – ground level – innovations are not reaching into formal sectors. It
    is highly recommended to build “Innovation Hubs” in rural areas to promote and
    streamline the IPR processes. Making amendments to existing government policies
    would definitely help advocate, govern and align the informal sectors with the
    formal sectors of innovations.


    ### 7\. Conclusion'
