    # 第 3 章


    ## 使用数据科学分析印度科技指标


    Anant Bhatt^a, Rubani Singla^b, Shilpa Gite^c, Shruti Patil^c and Ketan Kotecha^c


    ^a 帕鲁大学技术与工程学院，古吉拉特邦沃霍迪亚，印度

    ^b 加加尔工程学院，莫哈利，旁遮普

    ^c 共生国际大学，印度


    ### 摘要


    基于证据的政策制定增长导致了国际范围内深远的路线图规划和政策制定。重要的是，现行的研发政策制定需要细致的分析和问责。尽管多种方法可以从投资的定性评估中得出结论，但考虑数据在多元格局中的直接和间接影响至关重要。特别是科学、技术和创新（STI）指标被广泛用于理解研发活动的演变。定量科技（S&T）分析为有效的政策制定提供了宝贵的战略见解，而这通常是一个复杂的事务。本文讨论了利用“科学计量学”方法结合深度数据分析来分析与国家目标愿景一致的印度指标。我们根据权威国际/联邦机构的数据对印度科技指标进行了详细分析。后部分旨在找出印度
    GDP 和科技指标的模式，并推断出源自主导指标的可量信息，以突出政府计划的有效性。由于定性指标无法捕捉过程和灰色地，我们总结了印度背景下稳健规划和评估经济进步值得关注的重点。我们关注的是为更全球社会经济背景下的必要研发基础做出贡献。


    *关键词*：科学计量分析；科技指标；印度创新；Jugaad；印度研究；科学与技术


    ### 1. 引言


    当今经济体系是快速全球化、通信技术和信息技术驱动进步的产物。全球社会经济格局由先进的技术飞跃塑造，确保了生活质量。自 20 世纪 90 年代以来的技术进步影响了全球经济、增长和国家地位。科学技术创新（STI）处于该概念的核心。因此，知识的产生、利用和传播被认为是工业革命时期国家经济增长和发展的决决。传播驱动的数字化技术的出现提高了生成、构建和提炼信息以培养知识的便利性。它弥补了知识创造、培养、积累和分配的空白，促进了科技的发展。除了为科技领域的发明、传播和商业化提供合适的环境外，全球领导者和利益相关者强调从这些知识中创造价值(Lundvall
    & Borrás, 2006)）。许多国家以科技为核心设计了国家建设路线图。金融机构、财政部、教育及科技部门的新兴关注预示了通过这些创新以生产力和利润的形式创造价值，并最终引导增长、生产力和竞争力(Gertler
    & Vinodrai, 2005)。


    基于证据的政策制定增长导致了国际范围内深远的路线图和政策制定。各国讨论了从各种指标中收集数据，以促进对现状更深入、更透明的理解。科学工程统计国家中心（NCSES）定义了“指标”一词。指标被定义为“评估状况的一个或多个指标的统计代理”(Martin,
    2012)。指标有助于评估任何项目、计划或活动的现状，并在无法直接衡量活动的情况下衡量进展。由于指标扩展了近端分析测量，它们有助于清晰地勾勒活动前和活动后评估之间的差异，因此预见性通常是指标提供的最佳体现。


