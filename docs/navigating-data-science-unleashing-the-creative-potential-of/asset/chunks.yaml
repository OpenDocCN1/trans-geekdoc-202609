    to distinguish between genuine and those generated by computer. `AI`''s ability
    to mimic real intelligence threatens many indicators ([Johri et al., 2023](#978-1-83608-298-920251007.xhtml#bib32)).
    This development calls into question the reliability of all outputs ([Gagne et
    al., 2023](#978-1-83608-298-920251007.xhtml#bib17)). When `AI` systems are trained
    using massive datasets, they can sometimes sound like they''re parroting entirely
    before ([McMillan, 2023](#978-1-83608-298-920251007.xhtml#bib49)). As the use
    of generative `AI` extends, the demand is increasing for new ways to spot what
    has been written ([Rosário, 2024](#978-1-83608-298-920251007.xhtml#bib64)). Generative
    `AI` can exacerbate societal biases and lead to unjust outcomes. This arises from
    the specific design of the model ([Gouveia et al., 2024](#978-1-83608-298-920251007.xhtml#bib26)).
    The poorly designed model can manipulate data and produce false results ([Zhu
    et al., 2024](#978-1-83608-298-920251007.xhtml#bib83)). Ensuring equal treatment
    of `AI` systems guarantees equal performance ([Calis, 2023](#978-1-83608-298-920251007.xhtml#bib15)).
    The potential influence of `AI` output is the driving force behind the need for
    clarity and openness ([McCormack, 2024](#978-1-83608-298-920251007.xhtml#bib48)).
    If a generative `AI` system generates information that is inaccurate or poses
    a threat, steps are taken to ensure those responsible are held accountable and
    take responsibility for their actions ([Spemann et al., 2024](#978-1-83608-298-920251007.xhtml#bib71)).
    Accepting responsibility for a portion of the results of an innovative `AI` system
    is tantamount to recognizing accountability ([Raman et al., 2024](#978-1-83608-298-920251007.xhtml#bib60)).
    It is crucial to determine if a generative `AI` system is impaired or harms humans
    to hold that person accountable. Duty and accountability are related to moral
    and legal implications. The need to guarantee the proper functioning of `AI` is
    directly linked to accountability. A plausible model can justify its conclusions
    through logical reasoning.


    Intellectual property addresses the rights of producers during the process of
    creating content, as well as the ownership of material generated by `AI` ([Johri
    et al., 2023](#978-1-83608-298-920251007.xhtml#bib32)). There are concerns that
    the fundamental worth and pleasure derived from human production may be compromised
    if machines produce art, music, or literature. The potential for inadvertent plagiarism,
    which involves reproducing copyrighted materials that have already been published,
    gives rise to ethical considerations regarding unintentional violations of intellectual
    property rights.

