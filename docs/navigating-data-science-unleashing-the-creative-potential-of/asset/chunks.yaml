    ## Chapter 4


    ## Unveiling the Enigma of Shadow: Ethical Difficulties in the Field of AI


    S. Catherine^a, N.V. Suresh^b, T. Mangaiyarkarasi^c and Leena Jenefa^d


    ^aSaveetha Engineering College, India


    ^bASET College of Science and Technology, India


    ^cSRM Institute of Science and Technology, India


    ^dHindustan Institute of Technology and Science, India


    ### Abstract


    AI in the workplace is a double-edged sword. It''s powerful for progress but also
    risky. Well-managed Shadow AI, with a positive outlook, can unlock new levels
    of productivity, knowledge and a competitive risk associated with all AI outside
    strict IT rules is Shadow AI. Shadow AI often starts with well-meaning employees
    who just want to solve problems and work better with the help of AI technology.
    They''re not trying to break the rules, just find solutions. The potential benefits
    and risks of Shadow AI usage in organisations and their data privacy along with
    the data classification for secure Generative AI (GenAI) use were discussed with
    extensive review of literature and suggestions given. Shadow AI, the unauthorised
    use of AI tools within organisations, presents both opportunities and challenges.
    This work proposes a conceptual framework to help organisations navigate this
    complex landscape. The framework emphasises the importance of shadow AI for secure
    GenAI use, the development of an AI acceptable use policy and the implementation
    of employee training programs on responsible AI practices. Additionally, it highlights
    the need for robust security measures to monitor and control AI usage. By adopting
    this framework, organisations can mitigate the risks associated with Shadow AI,
    such as data breaches, legal issues and wasted resources while unlocking its potential
    benefits like enhanced decision-making, increased productivity and fostered innovation.
    The framework contributes to a future where AI adoption aligns with ethical principles,
    transparency and the greater good.


    *Keywords*: Generative AI (GenAI); shadow AI practices; LLM capabilities; critical
    thinking and creativity; human connection; authenticity


    ### 1\. Introduction


    The accelerated advancement of artificial intelligence (AI) has presented businesses
    worldwide with game-changing prospects. But this technological progress also brings
    with it a new threat: Shadow AI. Organisations face serious risks from this phenomenon,
    which involves using AI tools and systems without official approval. These risks
    include data mismanagement, security vulnerabilities and non-compliance with regulations.
    This article explores the significance of improving transparency and encouraging
    innovation in a responsible manner. The way we work and live has been completely
    changed by AI, and its applications are developing at a rate that has never been
    seen before. According to a recent Salesforce study, 55% of workers use AI in
    their jobs without receiving formal permission, and about 70% of workers lack
    proper training on how to use AI safely and ethically. Amidst discussions concerning
    AI governance and ethics, particularly in the workplace, a novel idea known as
    ‘Shadow AI’ has surfaced. It frequently refers to AI initiatives or systems created
    inside of businesses without the express consent or supervision of IT departments
    ([Catherine et al., 2024](#978-1-83608-298-920251004.xhtml#bib7)). These can be
    as simple as a group analysing corporate data with an unapproved machine learning
    tool or as complex as an AI model developed and implemented to automate a task.
    Shadow AI can present opportunities as well as challenges for organisations, so
    it''s critical that they have policies in place to properly manage AI use. The
    issues of ethics and transparency in the creation, application of AI and hidden
    AI (Shadow AI). Positive developments are starting to emerge. AI systems are becoming
    less like opaque black boxes and more intelligible, thanks to explainable AI (XAI).


    A growing number of organisations are prioritising ethical AI practices. By emphasising
    equity, accepting accountability for AI''s actions and maintaining transparency,
    businesses can foster trust and avert issues that may arise from AI that is hidden.
    Ensuring seamless human–AI collaboration is a crucial component. We can add safeguards
    against potential risks that might arise with hidden AI by having people involved
    in oversight, providing input and being able to intervene when necessary ([Silic
    & Back, 2014](#978-1-83608-298-920251004.xhtml#bib22)). Professionals make extensive
    use of Shadow IT software, which increases productivity and facilitates quicker,
    more effective teamwork and communication. Furthermore, workers think their actions
    are just the result of simple ignorance and that they are not doing anything wrong.
    Although there is a significant increase in IT risks in the context of Shadow
    IT, companies can still reduce these risks and better safeguard their corporate
    assets by implementing controls and countermeasures. If companies wish to keep
    up with the constant advancements in technology, they will need to reconsider
    their Shadow IT strategies and gain an improved comprehension of how to handle
    its usage. Limitation is an effective preventative measure, but it is not a cure-all
    for Shadow IT issues that present opportunities for the whole ecosystem of the
    organisation. These are the network applications used in any organisations: Greynet
    is an application installed on the internet by end users that get around security
    measures to access the network. Content apps (PDF/Extranet) used as an app for
    content creation and viewing are called content apps. In addition to extranet
    apps – which are external computer networks that are capable of being accessed
    from the outside in a controlled manner – they are primarily PDF apps. Utility
    tools are like a various tool that employees use (e.g. video converters, codecs
    and PC optimisation and cleaning utilities).


