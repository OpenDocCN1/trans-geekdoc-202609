- raw: 'The large corporations such as IBM have appointed an ‘AI Ethics Council’ consisting
    of various IBM stakeholders to review and make decisions regarding various policies
    and products ([IBM, n.d.](#978-1-83608-298-920251006.xhtml#bib23)). Although information
    regarding the AI Ethics Board has been made publicly available, there is scarce
    information regarding the process and capacity in which these board members are
    appointed the decision-making authority. On the other end of the spectrum, it
    is highly interesting to note that Microsoft has recently dissolved their ‘ethics
    and society team’ that ensured responsible decisions revolving around their AI
    services and tools ([Newton, 2023](#978-1-83608-298-920251006.xhtml#bib35)), opting
    to instead retain an ‘Office of Responsible AI’. The report claims that the changes
    suggested by the ethics team to protect the interest of consumers were discarded
    by Microsoft. These statements lead us to believe that ethical boards in such
    corporations do not have a final authority on decisions regarding AI products.
    Consequently, these boards do not hold much importance when it comes to ensuring
    responsible and ethical implementation of AI; hence, it can be speculated that
    organizations have passive ethical boards as a scapegoat to disperse questions
    of accountability and responsibility in the development of AI products. It also
    provides a certain sense of relief and satisfaction to the consumer in simply
    knowing about the existence of such ethical boards, as the average customer would
    not perform a deep delve into the actual power that is possessed by these boards.


    #### 7.2 National Level


    Moving towards a bigger picture, a publicly available document, ‘Executive Order
    13960’, designed for the regulation of AI products and services in the United
    States states that AI is encouraged within the limits of law, order and safety
    of the citizens. Its policies also address questions of responsibility that are
    to be upheld when government policies using AI algorithms are deployed ([Federal
    Office of the President, 2020](#978-1-83608-298-920251006.xhtml#bib39)). However,
    these rules do not make explicit in what manner exactly are agencies required
    to present monitoring records, ensuring transparency in their process. The consequences
    for not complying with these policies are also not made explicit. Towards the
    end of the document, it is also stated clearly that this order does not apply
    to AI being used in the defence department, providing no further explanation for
    the same. Even if large governments like the United States are ensuring AI is
    getting deployed within certain limits, these regulations fail to ensure transparency
    to the citizens (instead of just the government) who are the subjects of the algorithms.
    AI systems that process the personal data of EU residents are impacted by the
    General Data Protection Regulation (GDPR), which establishes a standard for data
    privacy in the EU. In particular, these regulations'' emphasis on permission,
    data minimization and the right to explanation are pertinent to the transparency
    and accountability of AI ([Patel, 2024](#978-1-83608-298-920251006.xhtml#bib38)).


    #### 7.3 Global Level


    At an international level, the Organisation for Economic Co-operation and Development
    (OECD), which is a transnational body with more than 30 member countries, has
    set up OECD.AI. OECD.AI has been described as a forum to shape trustworthy AI
    (Aaronson, 2022). It has also set up AI principles that require the member countries
    to adhere to. Unfortunately, there is no way to ensure that it can encompass a
    large number of member nations ready to comply with these principles as the decision
    to join OECD is also influenced by multiple sociopolitical factors and international
    relations amongst the member nations. It can be said that there is no exhaustive
    set of rules applying to all countries on the map that protects citizens from
    the misuse of AI and holds bodies accountable while ensuring a transparent process.
    The United Nations is a large international organization which has yet to come
    up with a strategy for this problem, apart from principles ensuring limits on
    AI within its systems.


    ### 8\. Conclusion'
