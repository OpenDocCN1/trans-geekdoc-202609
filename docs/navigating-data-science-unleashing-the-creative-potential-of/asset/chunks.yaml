  trans: '


    希腊语单词“ethos”意为“性格”，是伦理（ethics）一词首次出现的地方。伦理学是哲学的一个分支，研究人在社会情境下的行为，为道德结论提供逻辑辩护，识别什么是在道德上是可接受或不可接受的，并区分道德上的公正与不公
    (Pan, 2024)。为了 AI 技术的负责任开发和应用，对合理的论证、道德上的优劣以及公正与不公进行的研究，被称为 AI 伦理 (Gao et al.,
    2024)。AI 对大数据的利用引发了许多跨越多个领域的复杂伦理问题 (Schultz & Seele, 2023; Siau & Wang, 2020)。大数据驱动的
    AI 应用引发了对数据隐私、操纵和滥用的担忧，这使人类和社会陷入了危险之中 (Agbese et al., 2023; Christoforaki & Beyan,
    2022)。AI 与大数据在社会科学研究中的融合带来了风险管理、受试者保护、方法论偏差和社会危害的问题 (Hermansyah et al., 2023;
    Mensah, n.d.; Zohny et al., 2023)。AI 在社会系统（如社会计算）中的伦理影响也强调了在设计时考虑到社会利益、弱势群体以及负责任的数据收集和处理的必要性
    (Bleher & Braun, 2023; Choung et al., 2023; Díaz-Rodríguez et al., 2023)。这些讨论强调了考虑伦理问题是多么重要的。


    ### 3. 研究方法


    AI 与大数据在社会科学研究中的融合带来了风险管理、受试者保护、方法论偏差和社会危害的问题 (Hermansyah et al., 2023; Mensah,
    n.d.; Zohny et al., 2023)。AI 在社会系统（如社会计算）中的伦理影响也强调了在设计时考虑到社会利益、弱势群体以及负责任的数据收集和处理的必要性
    (Bleher & Braun, 2023; Choung et al., 2023; Díaz-Rodríguez et al., 2023)。这些讨论强调了考虑伦理问题是多么重要的。


    ### 4. 理论基础


    #### 4.1 信息与计算机伦理 (ICE)


    AI 算法中存在的偏差是一个严重关注的问题，因为 AI 算法在全球范围内越来越多地用于决策。尽管 AI 在辅助过程方面可能非常高效，但该过程的透明度存在争议。AI
    算法可能是一个黑箱，并不清楚它是如何自我学习的。这一点可以从目前最流行的 AI 聊天机器人（如 `ChatGPT` 和 `Gemini`）是闭源且正在使用的事实得到进一步证明。任何人都可以在无人干预的情况下，使用数据集对它们进行训练。


    为了 AI 技术的负责任开发和应用，对合理的论证、道德上的优劣以及公正与不公进行的研究，被称为 AI 伦理 (Gao et al., 2024)。AI 对大数据的利用引发了许多跨多个领域的复杂伦理问题。


    #### 4.2 用于决策的 AI


    这些讨论为进一步的讨论提供了基础。这些讨论为进一步讨论提供了基础。使用 AI 制定政策涉及多个阶段。


    ##### 4.2.1 设定优先级


    在第一阶段，它通过分析通过各种方式收集的数据集，帮助决策者识别最紧迫的任务。它可以检测出可以指导决策的模式。例如，维多利亚政府使用 AI 对匿名数据进行高级文本分析以制定健康政策。同样，AI
    也被用于法国的医疗领域 (Wirjo & Calizo, 2024)。


    ##### 4.2.2 制定决策政策


    在第二阶段，AI 可以直接导致决策。AI 快速评估大量数据并预测未来结果的能力可以帮助各个领域。例如，在经济领域，由 Salesforce 创建的 AI 框架
    `AI Economist` 已证明可以通过预测可能政策的成本和收益并正确识别目标群体来制定经济政策。联合国贸易和发展会议 (UNCTAD) 也创建了一个
    AI 来预测贸易政策对全球贸易的影响。


    ##### 4.2.3 简化决策


    在第三阶段，AI 可以提高决策过程的效率。它可以模拟、测试和预测政策的可能影响。这将有助于加速决策过程。为了借助 AI 的帮助做出明智决策，了解大数据的来源以及这些数据是如何被提取用于分析的至关重要，因为这些是导致内在偏差并构成伦理问题基础的关键变量。


    ### 5. 为算法采集大数据


