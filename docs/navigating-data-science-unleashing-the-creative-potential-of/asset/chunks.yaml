- raw: 'The aim of this study is to examine the ethical conundrums that arise when
    artificial intelligence (AI) is used to drive decision-making processes in various
    industries, with a particular emphasis on the ethical implications of employing
    Big data for decision-making, and also to identify and analyze the ethical issues
    that arise in various industries at various steps of the algorithm development
    process due to the usage of AI and Big data in decision-making. Analysis at the
    data collection stage led to ethical grey areas in the development of machine
    learning algorithms using biased datasets. Multidisciplinary research and case
    studies from a range of industries, including healthcare, finance, marketing,
    and education, were employed in the study process. Some of the main subjects addressed
    were invasions of privacy, impartiality and inherent bias in decision-making algorithms,
    the openness and explainability of AI systems, accountability in automated decision-making
    and the ethical implications of data ownership and control and their effect on
    data subjects. This research adds to a better understanding of the ethical environment
    surrounding Big data and AI applications by combining insights from many businesses.
    It emphasizes how crucial it is to take proactive ethical considerations into
    account when designing, implementing and governing AI-driven technologies in order
    to guarantee their responsible, advantageous and most crucially, consensual integration
    across industries. The study concludes with the consequences and implications
    of entrusting AI with human lives directly and indirectly and the ultimate question
    regarding the future of algorithms which govern humans.


    *Keywords*: Big data; automated decision-making; ethical concerns; AI-based technologies;
    biasedness


    ### 1\. Introduction


    In this decade, machine learning algorithms have advanced at a breakneck speed,
    and organizations have been trained using vast amounts of available data. Artificial
    intelligence (AI) has taken over the world, and now the scenario has shifted towards
    outcomes and predictions that these algorithms are making using Big data. Big
    data is not only the use of large amounts of gathered data but rather the interactions
    between various datasets. It comprises technology to handle the data, analyzing
    data to make claims and the myth that Big data can provide insights with exceptional
    accuracy. With the increasing relevance and popularity of Big data, it is necessary
    to analyze whether it is a phenomenon that has the potential to aid rapid, efficient
    advancements or if the seemingly dystopian future it entails will outweigh its
    benefits. One of the most anticipated discussions is the role of ethics in Big
    data. A case where supposedly anonymous data from Facebook were released and de-anonymized,
    raised questions about the use of public data without consent. Big data can be
    used by corporations to make decisions that do not take into account the privacy
    of the individuals whose personal data is being exploited ([Herschel & Miori,
    2017](#978-1-83608-298-920251006.xhtml#bib22)). Organizations such as Institutional
    Review Boards are set up as a response, prompting researchers to think critically
    about the ethical implications of their studies on stakeholders across the board.
    Questions about informed consent and accountability of data usage are raised.
    With AI being the buzzword around, organizations are joining the bandwagon but
    what are the odds of using the data ethically? This study raises striking questions
    that are not necessarily considered when having discourse regarding Big data usage
    by organizations. Perhaps the most important concern for the general public is
    the question of privacy, consent for their data being used and safety in terms
    of data breaches. So, the three mandatory aspects of data privacy, consent for
    usage and biases in AI systems are been addressed in this study.


    ### 2\. Literature Review


    #### 2.1 AI and Big Data


    The technical field of AI studies how computers exhibit intelligence through perception,
    synthesis and inference of information, which is different from the intelligence
    exhibited by people and non-human animals ([Ram & Verma, 2023](#978-1-83608-298-920251006.xhtml#bib41)).
    It entails using algorithms inspired by human intelligence to simulate human-like
    methods to problem-solving, culminating in the creation of biomimetic robots with
    lifelike features and actions ([Alkurd et al., 2020](#978-1-83608-298-920251006.xhtml#bib3)).
    Talking about Big data, it is the term used to describe the enormous volume of
    data that is gathered, saved and examined in order to derive insightful information
    and make defensible decisions in a variety of industries ([Rawat & Yadav, 2021](#978-1-83608-298-920251006.xhtml#bib42)).
    Big data''s exponential expansion has transformed decision-making processes and
    allowed businesses to use a variety of data sources for operational and strategic
    planning ([Arena & Pau, 2020](#978-1-83608-298-920251006.xhtml#bib4)). Studies
    reveal a notable surge in Big data publications, emphasizing the multidisciplinary
    nature of the field and the changing trends from technological challenges to methodological
    problems and the advancement of AI ([Tagay et al., 2023](#978-1-83608-298-920251006.xhtml#bib49)).
    Big data and AI are entwined in today''s technological innovations, with the potential
    to revolutionize a multitude of fields. Large datasets may be accurately and efficiently
    analyzed thanks to the combination of Big data analytics with AI approaches like
    machine learning and evolutionary algorithms ([Gomathi Meena & Dharani, 2023](#978-1-83608-298-920251006.xhtml#bib19)).
    Innovation is sparked and decision-making processes are improved by this integration''s
    ability to extract insightful knowledge and valuable insights from intricate data
    structures ([Gandomi et al., 2023](#978-1-83608-298-920251006.xhtml#bib17)). In
    addition, the application of AI and Big data to product design methodology transforms
    conventional methods by fusing real-time data with consumer preferences and market
    demands to provide customized and intelligent designs ([Quan et al., 2023](#978-1-83608-298-920251006.xhtml#bib40);
    [Rikap & Lundvall, 2021](#978-1-83608-298-920251006.xhtml#bib43)). The convergence
    of AI and Big data not only boosts productivity but also tackles issues like security,
    governance and regulatory compliance in the dynamic field of intelligent systems
    and technologies ([Quan et al., 2023](#978-1-83608-298-920251006.xhtml#bib40)).


    #### 2.2 Ethical Considerations in AI'
