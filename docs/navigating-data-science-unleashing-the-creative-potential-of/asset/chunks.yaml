    World Economic Outlook (WEO) database, which publishes various reports on selected
    macroeconomic data series. IMF data published post-September 2020 highlights the
    adverse effects caused due to the COVID-19 outbreak on low-income households,
    impeding the progress in reducing poverty globally with a probability of contraction
    by −3% at the end of 2020 ([IMF, 2008](#978-1-83608-298-920251003.xhtml#bib101)).
    The base assumption was to see the fading of the pandemic by the end of 2020,
    which lasted longer than the anticipated period. Since the global economic analysis
    can be derived from the complete fading away of the pandemic, it is essential
    to research objective, unbiased, and non-skewed data. Hence, we considered WEO
    data published in April 2020 that covers the data across the timelines from 1980
    to 2020 with medium-term projections for selected indicators. To understand the
    insights of the Indian context, we focused on the recent data, i.e. Research &
    Development Statistics published by the Indian Federal agencies ([Research DST,
    2019](#978-1-83608-298-920251003.xhtml#bib10)). The report summarizes figures
    collected from more than 6,800 S&T Institutions from various agencies/stakeholders,
    i.e. government, state governments, public sector, and private sector industry.
    The survey report covers the national R&D canvas by reporting various input–output
    S&T Indicators data and sector domain-specific R&D expenditure investments made
    by the Indian Government enterprises and private sectors. We used the report for
    deep analysis in the Indian context, derived inferences, and compared it with
    global statistics.


    ## 3. Indian Standing: Global Economic Landscape


    To derive a global perspective while keeping the Indian context as a focal point,
    global figurative data, analysis, and projections of economic developments were
    explored. WEO database analysis, which incorporates the “Global Financial Stability
    Report” and “External Sector Report” was carried out. Statistics of the developed
    nations (with profound S&T practices and outcomes) were used for comparative analysis.
    [Fig. 3.2](#978-1-83608-298-920251003.xhtml#fig2) illustrates the graph of GDP
    statistics (from 1980 to 2018–2019) for the Indian context. The data are published
    by the National Statistics Office in fiscal years (April to March). The data incorporate
    the actual GDP growth rates calculated from 1998 to 2011, published in the [System
    of National Accounts 2008](#978-1-83608-298-920251003.xhtml#bib103). The nation''s
    nominal GDP has shown a significant rise of more than 700% since 1995, with a
    surprising surge over the past 25 years, where India stood in ninth place in 2010,
    trailing countries such as Brazil and Italy and fifth in 2019. Growth slowed from
    8.3% to 4.0% (between FY17 and FY20) as there were challenges observed in the
    financial sector and also due to a decline in private consumption growth. The
    COVID-19 pandemic impacted the global economy. It also affected the Indian economy
    by a reduction of 7.3% in FY21.


    ## 4. Scientometric Analysis


    India''s approach to development planning has proceeded by routing sizeable resources
    to S&T, education, training, and research. Substantial results in S&T infrastructure,
    i.e. national laboratories, research facilities, and academic institutions, have
    been noticed. India''s thoughtful policies and roadmap pumped a reasonable gross
    expenditure (mainly by the government sector). An analysis derives the R&D association
    with the economy (GDP), R&D expenditure, S&T human resources involvements, human
    resource engagements in R&D, and intellectual property registrations. The research
    papers, publications, trademarks, and patents are the ultimate reflection of the
    national roadmap. Over the decade, the Indian Government extended additional R&D
    support through its S&T agencies, and the measures have been supportive significantly.
    Important factors impacting the S&T paradigm are analyzed in subsequent paragraphs.


    ![image](images/f03-02.jpg)


    Fig. 3.2. Indian GDP Statistics (From 1980 to 2018–2019) With GDP Growth Rates.


    ### 4.1 Investments in Research and Development


    While the global focus on STI is supported by substantial investments (a whopping
    $1.2 trillion as of 2009), India''s R&D investment figures struggled to make it
    to a notch (with less than 2.5% of the global investments). Indian R&D investments
    stayed merely at 1% of the GDP in 2009. However, India envisaged increasing its
    Gross Expenditure in Research and Development (GERD) to 2% of its GDP and national
    agenda. Since the industrial R&D investment saw 250% growth with a 200% increase
    in sales from 2005 to 2010, India envisioned her plans by partying with the private
    sector. Private investments can transform R&D outcomes into commercial conclusions.
    By synergizing the rising growth in R&D investments and the part of the private
    sector, the Indian Government initiated constructive measures to increase its
    gross budgetary support. The timely actions supported by a sound ecosystem have
    shown its impact, where India is ranked ninth in scientific publications and 12th
    in obtaining patents globally. The strength of threads responsible for weaving
    the “Investment” fabric at the national level is analyzed and compared with global
    leaders.


    ### 4.1.1 GERD: Comparative Analysis

