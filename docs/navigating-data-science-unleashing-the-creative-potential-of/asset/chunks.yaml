- raw: 'GERD is the total of the current and capital expenditure by the stakeholders,
    i.e. resident companies, research institutes, universities, and government laboratories
    agencies in a country. The gross expenditure includes funding from foreign sources
    for R&D but excludes domestic fund allocation performed outside the purview of
    the domestic economy. These indicator values are derived concerning the USD constant
    prices using base years and Purchasing Power Parities (PPPs). They are presented
    as a percentage of the GDP of the respective countries ([Godin, 2003](#978-1-83608-298-920251003.xhtml#bib18)).
    The report shows that the Indian gross R&D expenditure has risen to quintuple
    between 2004 and 2018. The GERD shows a consistent rise over the decade from Rs.
    24,117.24 crore in 2004–2005 to Rs. 113,825.03 crore in 2017–2018 and Rs 123,847.71
    in 2018–2019. [Fig. 3.3](#978-1-83608-298-920251003.xhtml#fig3) shows the graphs
    of the total annual GERD with investments by the government, business enterprises,
    private sectors and public sectors. The graphs highlight the rise of GERD by a
    quintuple amount, with a sizeable share from private and public sectors and government
    funding. The numbers of the Indian GERD on R&D were as expected with the expectancy
    for its level of development and objectives. However, the business sector''s GERD
    in world-leading countries is reported to be considerably higher than expected
    for their developments, especially for the USA, China, Japan and Germany. In 2020,
    India stood in the list of top 50 innovative countries, ranking 48th among 131
    countries in the Global Innovation Index (GII). Compared to the leading countries,
    the Indian Government''s contribution is 56% to the GERD, and this proportion
    is less than 20% percent of the top 10 economies. Significant scope exists to
    push towards innovation and increase the business sector''s contribution to GERD.
    Since the government funding covered the maximum share of the R&D expenditure
    before 2004, the Indian Government took corrective measures to make it an all-around
    development ground. Indian Government successfully drew the interest of the business
    enterprises and private sectors into R&D investment. The business enterprises''
    investments rose seven times from Rs. 7,296.84 crore in 2004–2005 to Rs. 51,115.35
    crore in 2018–2019, with a 41.3% share in R&D investments.


    The figure demonstrates the healthy share by all stakeholders at the national
    level. Though the private sector showed a rise in expenditure, the GERD share
    was depleted marginally (from 37.20% in 2014–2015 to 36.79% in 2018–2019). A pertinent
    vertical of the R&D expenditure is from the higher education sector, which did
    not exist in the erstwhile Indian framework. [Fig. 3.4](#978-1-83608-298-920251003.xhtml#fig4)
    shows India''s sector-wise R&D expenditure with graphs of the national GERD with
    contribution breakdown from 2004–2005 to 2018. The contribution by higher education
    has increased seven times, i.e. from Rs 1,254.01 crore in 2004–2005 to an estimated
    Rs 8,797.08 crore in 2018–2019. While the higher education sectors in OECD countries,
    Japan, and China account for approximately 20%, 15%, and 12% of the GERD, India
    seems to be far from the desired standards with mere a seven percent contribution
    to overall GERD. As higher education and academia act as a significant source
    of skilled human resources and as a breeding ground for researchers, future policy-making
    requires attention.


    ![image](images/f03-03.jpg)


    Fig. 3.3. The Figure Shows the Change in the Total Annual GERD, Highlighting the
    Share From Private and Public Sectors and the Government Funding in India.


    ![image](images/f03-04.jpg)


    Fig. 3.4. Graph Shows the Sector-wise Average R&D Expenditure and Investments
    by the Stakeholders From 2004–2005 to 2018.


    ##### 4.1.2 Investments and Measures: Education System


    Although the Indian per capita R&D expenditure had increased to PPP $47.2 in 2017–2018
    from PPP$ 29.2 in 2007–2008, the R&D expenditure still needs some relook to a
    budget allotment as Indian figures struggle to make to the notch while comparing
    to other countries. In comparison to the figures of the GDP spending on R&D among
    the BRICS countries, i.e. Brazil 1.3%, Russian Federation 1.1%, China 2.1% and
    South Africa 0.8%, India spent 0.7% of its GDP on R&D in 2017–2018. While considering
    India''s close competitor – China, the R&D spending has doubled in the last two
    decades. China increased R&D expenditure from 1.46% in 2008 to 2.01 in 2013, resulting
    in rising numbers of researchers per million. In recent years, South Korea''s
    increased investments in R&D lured a higher number of researchers per million
    people, i.e. 4,867 in 2008–6,457 researchers in 2013. [Fig. 3.5](#978-1-83608-298-920251003.xhtml#fig5)
    presents comparative charts of the average Indian expenditure, which is shown
    as (a) in the education system and (b) Indian R&D spending, compared to the other
    countries. [Fig. 3.6](#978-1-83608-298-920251003.xhtml#fig6) shows Indian per
    capita R&D expenditure (%) in comparison globally. The holistic approach of promoting
    the R&D demands powering up the education system, industry support and policy
    raising researchers for a significant connect formulation to invite Foreign Direct.
    The period can be considered an affirmative signal.


    ![image](images/f03-05.jpg)


    Fig. 3.5. Comparative Analysis of the Indian Expenditure in the Education Sector
    and R&D Sector. Comparative Charts of the Average Indian Expenditure Are Shown
    in (a) the Education System and (b) Indian R&D Spending, Compared to the Other
    Countries.


    #### 4.2 Human Resource: R&D


    Human resources play a vital role in the growth of S&T. Hence, this indicator
    also reflects insights for the analysis. There have been numerous relocations
    of the highly skilled human resources of India. India’s well-trained, IT savvy,
    experienced people have been relocating abroad for professional reasons. It is
    essential to identify the human resources in science and technology (HRST) and
    establish the co-relation concerning the recorded growth. Data on the human resources
    involved in professional education, i.e. technology, medicine science, engineering,
    agriculture and veterinary science, education, law and other fields classified
    under public, private, industrial and institutional sectors were analyzed. [Fig.
    3.7](#978-1-83608-298-920251003.xhtml#fig7) shows the sector-specific contribution
    share of public and private sectors in major industry groups. [Fig. 3.8](#978-1-83608-298-920251003.xhtml#fig8)
    shows the comparative analysis: R&D expenditure (in INR) incurred by ministries/departments.


    ![image](images/f03-06.jpg)


    Fig. 3.6. Per Capita R&D Expenditure (%) With Comparative Figurative Analysis.'
