    明智的决策基于从广大受众中收集的实际数据。来自 Instagram、Twitter 和交易服务应用程序的定量数据以点赞、评论、推文和其他交易的形式被收集。定性数据则以问卷调查、在线论坛、博客等形式存在。它通过各种定性分析方法，产生可量化的结果。随后，提取适当的数据并将其组织成所需的结构。现在，可以训练机器学习算法来处理这些数据并识别所有可能的模式。这些模式一旦开发出来，就可以被用于预测“目标属性”。在投放市场之前，算法在目标预测中的有效性和正确性会经过详尽的分析和测试。在整个过程中，每一步都会产生多个关于数据主体知情和隐私的问题。通常情况下，对于个人可能希望保持隐私的个人信息的合规使用，并没有主动信息。这些海量数据拥有巨大的市场。


    #### 5.1 大数据的固有偏见

    大数据使得能够根据海量的私有或公开数据得出结论。它通过引发如数据驱动决策等方法，改变了人们学习和获取知识的方式。目前，各种 AI 框架正将其作为资源，并应用于特定的决策问题中（Zhuang
    et al., 2017）。不准确性和误读是大数据应用所首要关注的问题之一。大样本量并非具有足够的代表性，足以做出影响人类生活的重大决策。大数据的巨大规模也导致分析师将其与“总体”的统计理想模型混淆，而实际上它是一个有偏的样本（McFarland
    & McFarland, 2015）。大数据的公平性是伦理决策的首要考虑问题。


    #### 5.2 大数据并不等同于更好的数据，因为方法论问题仍然存在

    以 Twitter 为例，说明了大数据如何在样本代表性和问责制方面提出挑战。它还提倡承认“小数据”的价值。小数据是一种取得了显著成功的策略，使各个学科能够取得飞跃式进展（Kitchin
    & Lauriault, 2015）。那么，为什么我们必须完全转向大数据？下一个重点是使用大数据时语境的重要性。为了分析社交媒体平台上的信息和账户之间的联系，仅使用来自公开账户的数据是一项调查性工作。相比之下，用于通过问卷调查、访谈等工具收集人际关系数据的历史方法，强调了理解个人网络的价值。


    #### 5.3 对大数据的访问受限

    至关重要的是要理解大数据的访问造成了数字鸿沟。对私有数据集的访问受到限制，大型公司是决定其数据如何被访问唯一权威。处理大数据所需的技能仅限于那些具有计算背景的人员。大数据的使用引发了对未来研究以及基于此构建的技术的影响的批判性反思。


    #### 5.4 基于大数据的决策与 AI 偏见

    近年来，利用用户数据通过驱动机器学习/AI 算法做出决策的机构已成为备受关注的问题。AI 可以协助并直接引导各个领域的决策，包括但不限于经济、教育、医疗健康、税收和社会领域。在这些领域中，它可以为优化、福利、反欺诈检测、个性化等创建决策。各国为了各种目的收集用户数据是常见做法，以做出影响用户生活的预测和决策。数据收集的方法多样，从传统的人口普查调查到使用先进监控技术，如监控在线活动、追踪手机位置以及使用人脸识别。算法被应用于多个领域，包括医疗健康、执法和社交服务，然而，使用用户数据驱动
    AI 算法引发了对偏见被放大和延续的担忧。算法依赖于训练数据，如果这些数据存在偏见或不完整，算法产生的结果可能存在偏见。AI 算法被发现存在与性别、种族、民族和犯罪记录等因素相关的偏见。这些偏见对可能受算法决策公平影响的用户产生深远影响。种族和民族偏见的一个例子是执法中的
    AI 算法，这些算法因不成比例地针对少数社区而受到审查。预测执法算法在人脸识别技术的情况下被考虑到。在一项评估此类差异的研究中显示，浅色皮肤男性的最高错误率为
    0.8%；然而，深色皮肤女性的错误率高达 34.7%（Buolamwini & Gebru, 2018）。而且数据集主要由浅色皮肤受试者组成。这表明脸识别算法在识别深色皮肤个体时错误率更高，导致有色人种中出现不成比例的错误识别和误报。这对外执法和监控实践具有重大影响。

