    Another significant benefit of using technology in screening patients is the fast
    processing as unlike human beings that technology do not require any kind of a
    break or rest period. This means patients can be continuously screened by the
    technology, and accordingly, analysis is offered to the doctors for taking the
    remedial actions. There are many machines to which the integration of data science
