    # 第 4 章


    ## 揭示影子之谜：AI 领域的伦理困境


    S. Catherine^a, N.V. Suresh^b, T. Mangaiyarkarasi^c 和 Leena Jenefa^d


    ^aSaveetha 工程学院，印度


    ^bASET 科学技术学院，印度


    ^cSRM 科学技术学院，印度


    ^dHindustan 工理工与学院，印度


    ### 摘要


    工作场所中的 AI 是一把双刃剑。它对进步很有力，但也伴随着风险。管理良好且持积极态度的“影子 AI”（Shadow AI）可以释放生产力、知识的新水平，而与所有严格
    IT 规则之外的所有 AI 相关的竞争风险都是影子 AI。影子 AI 通常始于那些用意良好的员工，他们只想在 AI 技术的帮助下解决问题并更好地工作。他们并不是试图打破规则，只是在寻找解决方案。本文通过广泛的文献回顾，讨论了组织中使用影子
    AI 的潜在收益和风险及其数据隐私，以及用于安全使用生成式 AI (GenAI) 的数据分类，并提出了建议。影子 AI 是在组织内部未经授权使用 AI 工具的行为，既带来了机遇也带来了挑战。本研究提出了一个概念框架，帮助组织应对这一复杂的局面。该框架强调了影子
    AI 对于安全使用 GenAI 的性、制定 AI 可接受使用政策以及实施有关负责任 AI 实践的员工培训计划。此外，它还强调了需要强有的安全措施来监控和控制
    AI 的使用。通过采用这一框架，组织可以降低与影子 AI 相关的风险（如数据泄露、法律问题和资源浪费），同时释放增强决策、提高生产力和促进创新的等潜在收益。该框架为未来
    AI 的采用符合伦理原则、透明度和更大的公共利益做出了贡献。


    *关键词*：生成式 AI (GenAI)；影子 AI 实践；LLM 能力；批判性思维与创造力；人连接；真实性


    ### 1. 引言


    人工智能 (AI) 的加速发展为全球企业带来了改变游戏规则的前景。但这种技术进步也带来了新的威胁：影子 AI。组织面临着这种现象带来的严重风险，这涉及在未经官方批准的情况下使用
    AI 工具和系统。这些风险包括数据管理不当、安全漏洞和不符合法规规定。本文探讨了提高透明度和以负责任的方式鼓励创新的重要性。AI 彻底改变了我们工作和生活的方式，其应用的发展速度是前所未有的。根据
    Salesforce 最近的一项研究，55% 的员工在没有获得正式许可的情况下在工作中使用 AI，而约 70% 的员工缺乏关于如何安全且符合伦理地使用 AI
    的适当培训。在有关 AI 治理和伦理的讨论中（特别是在工作场所），一种被称为“影子 AI”的新观点浮出了水。它通常指的是在企业内部创建的、未经 IT 部门明确同意或监督的
    AI 倡议或系统 (Catherine et al., 2024)。这些可能仅仅是某个小组使用未经批准的机器学习工具分析公司数据，也可能是为了开发并实施以实现任务自动化的
    AI 模型。影子 AI 为组织带来了机遇，也带来了挑战，因此，他们制定政策来妥善管理 AI 使用至关重要。AI 的创建、应用以及隐藏 AI（影子 AI）中的伦理和透明度问题。积极的进展开始出现。得益于可解释
    AI (XAI)，AI 系统正变得不再像不透明的黑箱，而是更易理解。


    越来越多的组织正在优先考虑伦理 AI 实践。通过强调公平、对 AI 的行为承担责任并保持透明度，企业可以培养信任并避免由隐藏 AI 产生的问题。确保无缝的人机协作是一个至关重要的组成。我们可以通过让人参与监督、提供输入并在必要时干预，来针对隐藏
    AI 可能产生的潜在风险增加措施 (Silic & Back, 2014)。专业人员大量使用影子 IT 软件，这提高了生产力并促进了更快、更有效的团队合作与沟通。此外，员工认为他们的行为只是简单的无知的结果，他们并没有做错什么。尽管在影子
    IT 的背景下 IT 风险显著增加，但企业通过实施控制和应对措施仍然可以降低这些风险并更好地保护其公司资产。如果公司希望跟上技术的不断进步，它们将重新考虑其影子
    IT 策略，并对如何处理其使用获得改进的理解。限制是一种有效的预防措施，但对于为整个组织生态系统带来机遇的影子 IT 问题并非万能药。以下是任何组织使用的网络应用程序：影子网络是终端用户在互联网上安装的、绕过安全措施以访问网络的应用程序。用于内容创建和查看的应用程序（PDF/外网应用）被称为内容应用。除了外网应用——即可以从外部以受控方式访问的外部计算机网络之外，它们主要是
    PDF 应用。实用工具是指员工使用的各种工具（例如视频转换器、编解码器以及 PC 优化和清理工具）。


