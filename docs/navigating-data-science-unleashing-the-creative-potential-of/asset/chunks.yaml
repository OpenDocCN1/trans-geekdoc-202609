    雾计算被引入作为云计算服务的替代方案，以满足物联网（IoT）日益增长的应用以及管理和存储海量生成数据的需求 (Singh et al., 2021)。雾计算可以提供必要的网络服务，协助对响应时间有较高要求的物联网应用
    (Gubbi et al., 2013)。由于雾节点分布分散、多样化且资源有限，在雾节点之间分配物联网应用活动以满足服务质量（QoS）和体验质量（QoE）限制是一项挑战（(Mahmud
    et al., 2019)）。


    雾计算被应用于车联网（V2X）、患者监测和工业自动化，因为它提供了靠近用户的用户的计算能力。这确保了应用程序能够满足预期的反应时间。因此，物联网设备的广泛利用导致这些应用产生了海量数据。由于远距离数据传输延迟和网络拥塞，云计算无法满足延迟需求
    (Singh et al., 2021)。雾计算凭借其带宽带宽、高效的能量管理和数据交付的低延迟需求扩展了云计算 (Gill et al., 2020)。因此，这些物联网设备产生的数据对各种应用变得变得有用。


    研究人员现在更频繁地使用 AI、深度学习和机器学习来处理这些海量数据，用于数据分析和决策支持 (Iftikhar et al., 2023)。AI 驱动了数百万独立于数据中心运行在网络边缘的传感器和设备。具体而言，边缘计算和雾计算是数据处理、数据分析和决策领域的主要技术。雾节点上的
    AI 模型可以用于执行实时数据分析，从而对数据提供更好的洞察，进一步优化操作。传感器数据与 AI 的无缝融合产生了一些新兴框架。诸如“智能家居”等新兴概念正被用于描述增强日常活动各方面管理（包括家庭能源消耗）的易用性和便利性的创新技术。例如，我们可以存储传感器数据并据此采取行动，使用
    AI 简化操作，并对以前需要人工干预的情况做出做出响应。部署在雾计算上的 AI 模型可以识别异常、预测潜在的故障并建议必要的行动。Table 8.2 展示了某些雾计算的应用场景。


    ### 3.2.1 用数据科学实施雾计算面临的挑战


    #### 边缘智能与联邦学习

    边缘设备在许多雾计算环境中生成并分析数据。这是当前研究的关键领域之一；具体而言，它旨在部署有效的边缘计算方法，例如联邦学习。这种技术允许在基于边缘的分布式数据上进行
    AI 模型训练，而无需在中央位置收集数据。因此，管理不同层级的任务分配、共享数据和保持一致性都是挑战性任务。


    #### 最小化模型划分与适配的延迟

    在分散环境中，要确保实时 AI 应用在同步和分析方面快速且响应迅速是非常的。为了提高 AI 模型的性能，可以将模型拆分成更小的部分，这可能涉及将模型分布在不同能力的设备上。这是快速跟踪数据流的重点领域，并且增强
    AI 模型以运行在雾节点的硬件和软件配置上可能有问题。


    表 8.2. 使用雾计算和 AI 的现实世界应用。


    | 序号. | 公司名称 | 应用领域 | 如何使用？ | 用途 |

    | :--- | :--- | :--- | :--- | :--- |

    | 1. | GE 医疗 (Edison 平台) | 个性化医疗 | AI 模型预测潜在的健康状况、检测异常并提供个性化的生活方式改变。 | 实时监控。 |

    | 2. | Avigilon | 智能视频分析 | AI 模型在现实执行行为分析和人脸识别等任务。 | 交通监控、零售分析、安全监控。 |

    | 3. | Prospera | 精准农业 | AI 模型应针对灌溉优化、疾病检测和产量保护进行对齐。 | 提高作物产量、资源使用优化。 |

    | 4. | FogHorn Systems | 工业物联网中的预测性维护 | AI 模型检测潜在故障、预测异常并建议维护。 | 减少停机并提高运行效率。
    |

    | 5. | Cisco Kinetic | 智能交通管理系统 | AI 模型用于交通预测、路线优化和交通拥堵区域检测。 | 提供实时交通更新、调整交通灯定时并建议路线以优化流量。
    |


    ### 3.3 边缘计算


    边缘计算与 AI 的融合是解决传统以云为中心的方法问题的强大组合，现在被称为边缘 AI（Edge AI）。边缘计算对于以更低的成本提供卓越性能来促进 AI
    应用至关重要。边缘计算解决了 AI 驱动的应用程序由于其信息和计算密集型本质所面临的技术挑战。这导致了优化、更快的响应时间以及增强的运行效率。


    边缘 AI 的大数据需求在 Table 8.3 中规定。边缘 AI 的另一个应用是预测性维护，其中可以通过数据处理来预测任何重大故障或风险。边缘计算通过利用本地处理能力、数据分析能力和接近终端用户的设备，实现了高性能的业务服务。工业自动化流程、城市规划、个性化医疗保健和自动驾驶车辆只是可以从
    AI 解决方案的增强性能、实时响应、成本效益部署和降低延迟中受益的少数领域。Table 8.4 展示了边缘计算结合 AI 的现实世界应用领域。


    表 8.3. 边缘 AI 的大数据需求。


    | 边缘 AI 的大数据需求 | 需求 | 子需求 |

    | :--- | :--- | :--- |

    | 可扩展性 | | 集中、去中心化、卸载 |

