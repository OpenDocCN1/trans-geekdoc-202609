    ### 3\. Research Methodology


    Shadow AI often starts with well-meaning employees who just want to solve problems
    and work better with the help of AI technology. They''re not trying to break the
    rules, just find solutions. The potential benefits and risks of Shadow AI usage
    in organisations and their data privacy along with the data classification for
    secure GenAI use were discussed with an extensive review of literature with the
    articles from 1995 to 2024 authors and report from the different internet sources
    and suggestions given. To find out the mismatch between IT and business by analysing
    by existing studies to identify key variables and relationships to conceptual
    model by considering the practical challenges and opportunities faced by organisations.


    #### 3.1 Functionality Threats


    Functionality threats were defined by the European Union Agency for Cybersecurity
    (ENISA). Functionality threats are created when an AI tool fails to perform as
    expected, leading to potential risks and consequences. Functional risk is modelling
    drift. It occurs when the AI model deviates from the problem space it was trained
    to handle, rendering it unusable and potentially misleading. Model drift may result
    from out-of-date training data or modifications to the technical environment.
    Operational risks which jeopardise the business operations of the company. There
    are various types of operational risks. For instance, a Shadow AI tool would help
    the company poorly if it is not properly trained. Negative advice from GenAI can
    lead to higher opportunity costs, such as when the company fails to invest where
    it should or to wasted investments, such as when the company grows carelessly.
    Using an LLM, especially any unlicensed one that was trained and developed outside
    of the enterprise''s data management policy framework, it can also put confidential
    client and business information at risk. When a chatbot receives a user''s prompt,
    it can utilise the information as training data and share it with platform operators
    and other users. In the event of a cyberattack against the AI platform, the data
    might also end up in the hands of criminals. When a healthcare provider summarises
    a patient''s appointment using a GenAI chatbot, they are breaching HIPAA regulations
    and disclosing private health information. Talking points for an internal presentation
    are created by an executive using AI, disclosing trade secrets. When a lawyer
    organises case notes with a chatbot, information covered by legal protection that
    ensures the confidentiality of communications between an attorney and their client
    is revealed. A business analyst uses a GenAI app to create a new report by uploading
    a sizeable, multifield spreadsheet that contains customer credit card numbers
    ([Shevlane & Christiano, 2023](#978-1-83608-298-920251004.xhtml#bib20)). Priorities
    for AI safety and governance should be the evaluation of models for extreme risks.
    With an LLM access to this kind of private information could jeopardise the company''s
    business plans and intellectual property, giving rivals the upper hand and undermining
    competitive advantages. When personally identifiable information is involved,
    there may be major data privacy and compliance violations, harm to customer confidence
    and reputational consequences. Legal risks causes if the shadow AI puts the business
    at risk of legal action or fines, legal risks will come after operational and
    functional risks. However, the information is false, and the business wastes a
    significant sum of money by acting incorrectly. Investors may file a lawsuit.
    Suits may also arise if the model uses copyright-protected data for self-training
    or if the shadow tool gives users incorrect advice resulting from model drift
    or tainted training data and breaking data privacy laws can have serious legal
    repercussions.


    #### 3.2 Regulatory Fines and Criminal Penalties'
