- raw: 'A substantial rise in the Indian population was recorded from 683 million
    to 1,000 million within 20 years from 1981. We considered the data on the HRST
    occupation and HRST education. Although the labor force rose from 306 million
    to 444 million in the same duration, the core HRST was recorded at 2.6 million
    and 4. million in 1981 and 1991, respectively. The considerable increase in professional
    universities/recognized institutions (from 886 to 2,223 in the 1990s) improved
    the HRSTE figures from 15.6 million to 25.2 million in a single decade ([Khadria,
    2004](#978-1-83608-298-920251003.xhtml#bib25)). To assimilate the HRST, we analyzed
    the data of human resources involved in institutional and industrial sectors.
    A total of human resources employed in R&D activities, auxiliary and administrative
    activities was recorded at approximately 341,818, 98,824, and 112,327, respectively,
    by 2018. India stands third after China and the USA in producing doctorate degrees
    globally, with 16,339 doctorates. However, the global HRST analysis highlights
    that a comprehensive workforce in India in S&T is low compared to other nations.
    [Fig. 3.9](#978-1-83608-298-920251003.xhtml#fig9) shows Indian standing while
    comparing the technician''s and researchers'' involvement globally.


    ![image](images/f03-07.jpg)


    Fig. 3.7. Sector-specific Contribution Share of Public and Private Sectors in
    Major Industry Groups.


    ![image](images/f03-08.jpg)


    Fig. 3.8. Comparative Analysis: R&D Expenditure (in INR) Incurred by Ministries/Departments.


    ![image](images/f03-09.jpg)


    Fig. 3.9. Comparative Analysis: Human Resources (Technicians and Researchers)
    Involved in R&D.


    #### 4.3 IPR Regime in India


    IPRs give protection to innovativeness and especially to technological innovation.
    Promotion of the transfer and commercialization of technology aids in improved
    advancements and stimulates innovations ([Ilie, 2014](#978-1-83608-298-920251003.xhtml#bib20);
    [Mrad, 2017](#978-1-83608-298-920251003.xhtml#bib31)). IPRs also promote innovators
    with assorted incentives, contributing to national S&T developments and economic
    growth ([Hossain & Lasker, 2010](#978-1-83608-298-920251003.xhtml#bib19)). The
    study showed substantial arguments that strong IPR protection might hinder technology
    transfer and indigenous learning activities during the initial phases of industrialization
    ([Kumar, 2003](#978-1-83608-298-920251003.xhtml#bib27)). The IPR has proven to
    be an affirmative factor once the nation has accumulated sufficient indigenous
    capabilities befitting S&T infrastructure capable of undertaking creative imitation.
    Similarly, the development experience of India indicates the importance of weak
    IPR protection in building up local capabilities. Research findings on the Indian
    context showed the importance of weak IPR protection, which contributes affirmatively.
    On the other hand, the stronger IPR protection negatively impacts prices, employment
    and output. However, empirical findings on identifying the IPRs'' impact on the
    Indian subcontinent showed positive, significant implications for the last two
    decades ([Ezzeddine & Hammami, 2018](#978-1-83608-298-920251003.xhtml#bib12);
    [Mallik & Chowdhury, 2001](#978-1-83608-298-920251003.xhtml#bib29)). Hence, the
    quantifiable R&D outcomes can be analyzed to identify the Indian standing in the
    said context.


    ### 5\. Analysis: R&D Outcomes


    Acquisition of IPR for innovations and novel work in any domain is considered
    a prominent indicator of the country''s R&D roadmap. S&T indicators take the cognizance
    of the patent, publication trends for shaping future roadmaps.


    #### 5.1 Trends in R&D


    Total enrollments in the universities were recorded at 2,431,563 in 1976–1977,
    8,399,443 in 2000–2001, and 37,399,388 in 2018–2019, making a significant rise.
    Significantly, the share of enrollments in professional higher education is recorded
    at 36.8%. The number of doctorate degrees awarded grew from 16,093 in 2010–2011
    to 40,813 in 2017–2018 (a growth rate of 250%). India stood third in producing
    PhD in Science and Engineering (S&E) globally standing in 2014 and 2015 after
    the USA (39,710 in 2016) and China (34,440 in 2015).


    #### 5.2 Scientific Publications


    NSF statistics showed India standing at third place in scientific publications
    globally, wherein India was ranked at third, fifth and ninth positions for the
    NSF, SCOPUS and SCI databases, respectively, for the scientific publications.
    India''s SCOPUS and SCI publications growth increased significantly between 2011
    and 2016, with 8.4% and 6.4%, against the world average of 1.9% and 3.7%, respectively.
    Indian scientific publication position slipped to sixth rank in 2016 by recording
    her share at 5.4%. As the number of publications increased for the USA and China
    post-2016, the Indian statistics indicate a few grey areas to be addressed. Though
    India holds a significant strength in human resources, the gap in yearly publication
    with the top-ranking nations is considerably broader and needs to be filled in.
    [Fig. 3.10](#978-1-83608-298-920251003.xhtml#fig10) (a) shows the Indian growth
    rate for scientific and technical journal publications from 2001 onwards, compared
    to the leading countries. While India contributed at 6.8% (with 683,570 publications)
    to the world''s total publications across all fields during 2011–2016, its contribution
    in science (22 major science disciplines) stays at only 4.1% and CAGR of 6.4%,
    with 336,620 publications during 2011–2016.


    ![image](images/f03-10.jpg)


    Fig. 3.10. Indian Growth Rate in Comparison to China and USA in (a) the Scientific
    and Technical Journal''s Publication From 2001 Onwards and (b) Patent Applications
    From 1980 Onwards.


    #### 5.3 Patents


    Patenting is also drawing attention as it is a measure of novel IPR that measures
    a country''s R&D capability. The patenting figures are derived from residents
    and non-resident Indians. In addition, the foreign stakeholders also file for
    obtaining the IPR in India. The number of patent applications has risen sextuple
    from 8,503 in 2000–2001 to 47,854 patent applications in the year 2017–2018 ([Fig.
    3.10](#978-1-83608-298-920251003.xhtml#fig10)(b)). Although India is ranked ninth
    position (in resident patent filing), the numbers are not motivating considering
    the global landscape. WIPO reported India''s Patent Office standing in seventh
    position in the world. Out of these 47,854 patent applications, only 15,550 (32%)
    were filed by Indian residents, and foreign residents filed a balance of 32,304(68%).
    [Fig. 3.11](#978-1-83608-298-920251003.xhtml#fig11)(a) shows the graphs for the
    number of applications made, applications to be examined and applications finally
    examined. The average number of patent applications filed annually was 16,518
    from 1976 to 2018; only 155,566 patents have been sealed in this duration, amounting
    to 3,795 patents annually. [Fig. 3.11](#978-1-83608-298-920251003.xhtml#fig11)(b)
    shows the positive growth rate of patent applications by the resident Indians
    from 2000–2001 to 2017–2018 compared to the non-residents'' contributions. Out
    of the 155,566 sealed patents (from 1976 to 2018), only 21.75% of patents belong
    to resident Indians. [Fig. 3.12](#978-1-83608-298-920251003.xhtml#fig12) shows
    the statistics of the patent application made vis-a-vis the sealed patents with
    the share of the Indian residents and non-residents since 1976. A pertinent pattern
    merged out of the figure highlights a numerical contrast in comparison to the
    leading countries where the share by the residents is higher, i.e. China (90%),
    Japan (81%), and South Korea (77%).


    ![image](images/f03-11p1.jpg)![image](images/f03-11p2.jpg)


    Fig. 3.11. The Figure Shows Statistics in the Patent Acquisition (a) Quantitative
    Analysis of the Applications Made, Applications to Be Examined, and Applications
    Finally Examined Since 1977 and (b) the Share of the Indian Residents and Non-residents
    Since 2000.'
