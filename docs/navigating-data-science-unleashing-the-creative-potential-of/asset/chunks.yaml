- raw: 'In academics, a thorough understanding of the challenges associated with repugnant
    markets, which refer to exchanges that are seen to violate certain societal standards
    but nonetheless result in overall benefits, as discussed by [Berg (2023)](#978-1-83608-298-920251007.xhtml#bib10).
    It is premature to assert that employing generative AI in research techniques
    is inherently repugnant.


    #### 9.1 Authorial Attribution


    The attribution of authorship refers to the official assignment of rights and
    has multiple key applications in academia. It initially identifies the main author
    of the text. The author is the individual who advocates for and represents written
    work ([Bozkurt, 2024](#978-1-83608-298-920251007.xhtml#bib12)). The assigned author(s)
    is responsible for protecting the text from criticism and may take legal action
    if necessary. Under the attribution of authorship, hiding an author''s identity
    is unacceptable. While several academic disciplines have only lately been known,
    due to security considerations. Until recently, contributions to journalists were
    predominantly made anonymously ([Raman, 2023](#978-1-83608-298-920251007.xhtml#bib59)).
    Presently, it is rare to come across a news story, regardless of its brevity or
    conciseness that does not include a clearly apparent byline.


    Furthermore, asserting authorship entitles an individual to the financial benefits
    linked to the publication of a piece. According to [Alexander et al. (2023)](#978-1-83608-298-920251007.xhtml#bib4),
    it is permissible to assign authorship credit in cases involving extensive research
    teams, as long as the arrangement and credit are negotiated. The presence of such
    a compromise highlights the fundamental importance of attribution. However, LLM
    lacks the ability to regulate the benefits of publishing or assume liability for
    its content ([Srivastava, 2023](#978-1-83608-298-920251007.xhtml#bib72)). While
    authorial credit may be limited to a specific individual or group, it is not something
    that is restricted or inaccessible. The purpose of is to enable authors to receive
    recognition for their work and to prevent unauthorized individuals from claiming
    credit ([Bakla, 2023](#978-1-83608-298-920251007.xhtml#bib8)). It is important
    to note that this is not meant to be a critique of those who are not credited.
    Ultimately, with the growing integration of LLMs into word processing software
    (Microsoft has already announced its plans to incorporate ChatGPT into its entire
    office suite, including Microsoft Word), authors will face greater challenges
    in discerning between manually written content and content generated with the
    assistance of AI. Writers have derived advantages from tools such as thesauruses,
    spell checks, grammar checkers (including advanced AI grammar checkers like Grammarly),
    and currently, predictive text that is incorporated into word processors ([Li
    et al., 2024](#978-1-83608-298-920251007.xhtml#bib42)). Although a new standard
    attempting to differentiate between technologically assisted and humanly produced
    content may be beneficial, it is unlikely to gain widespread acceptance. Researchers
    should not claim credit for work they have not physically and personally typed
    or written themselves. This further strengthens the argument against utilizing
    LLMs for writing. Above all, the academy no longer adheres to this ideal. Authorship
    attribution is a customary practice in teams and laboratories, and it does not
    require formal communication. A more compelling argument would be to assert that
    in this instance, the generative AI process of generating ideas is being infringed
    upon, rather than the generative AI act of writing. An LLM program responds to
    user interaction. It fails to independently explore its latent space. The value
    of the results will rely on the researcher''s expert evaluation, which is also
    responsible for designing the search. LLMs are not actually “ideas” but rather
    the results of an investigator''s subjective research question. They are considered
    academic contributions only when they are published in a journal or pass peer
    review. Consequently, it can be inferred that an academic writer who use Google
    Bard or ChatGPT fulfills the criteria for academic authorship ([Sison et al.,
    2023](#978-1-83608-298-920251007.xhtml#bib70)).


    However, it is often the case that individuals who contributed to the creation
    of the final document are not given due credit. One common practice is to engage
    the services of “professional proof-readers” based on recommendations from reviewers;
    however, their acknowledgment in published works is rarely observed ([Gill & Kaur,
    2023](#978-1-83608-298-920251007.xhtml#bib25)). Typically, formal acknowledgment
    of peer reviewers is not very common. However, they contribute greater value to
    a book compared to workshop participants or the mentors of the writers. Although
    the double-blind peer review approach avoids the purposeful long-term contracting
    between authors and reviewers, it would be necessary for a mutually advantageous
    credit exchange ([Bakla, 2023](#978-1-83608-298-920251007.xhtml#bib8)).


    The accuracy of crediting items produced by LLM in the past appears questionable
    ([Arighi et al., 2024](#978-1-83608-298-920251007.xhtml#bib6); [Kenthapadi et
    al., 2023](#978-1-83608-298-920251007.xhtml#bib35); [King et al., 2023](#978-1-83608-298-920251007.xhtml#bib37)).
    An intriguing use of generative AI is its utility as a tool for editing and augmenting
    written content. In this context, the researcher supplies ChatGPT with paragraphs,
    and perhaps entire texts, to be reviewed for the purpose of enhancing their readability.
    It is not practicable to individually cite each AI-assisted alteration in a footnote
    or author-date format, and it is not clear to readers what utility there would
    be in doing so ([Duncan & McCulloh, 2023](#978-1-83608-298-920251007.xhtml#bib21)).


    #### 9.2 The Norm Against Plagiarism


    Mentioning plagiarism as a potential objection to the utilization of LLMs in research
    will suffice to dissuade its adoption among more traditional scholars ([Sysoyev,
    2024](#978-1-83608-298-920251007.xhtml#bib76)). Minimizing charges can have a
    similarly detrimental impact on a researcher as committing plagiarism. But knowing
    the economic roots of the criterion against plagiarism helps we traverse the intricacies
    of LLM contributions to scholarship ([Vinchon et al., 2023](#978-1-83608-298-920251007.xhtml#bib78)).
    It can be relatively difficult to define plagiarism formally. Plagiarism is a
    Latin term derived from the word “kidnapping.” Some literalists argue that this
    phrase refers to the act of kidnapping ideas. According to [Dhammi and Ul Haq
    (2016)](#978-1-83608-298-920251007.xhtml#bib19), plagiarism can be considered
    a form of kleptomania. This convention is followed in the casual, daily descriptions.
    O''Connor (2023) highlights that plagiarism is essentially an act of deceit, where
    one pretends to be the author of someone else''s work ([O''Connor, 2014](#978-1-83608-298-920251007.xhtml#bib55)).
    This emphasizes that individuals are the primary victims of plagiarism rather
    than being mere results of a search query in the vast collection of human knowledge.
    [Heckler et al. (2013)](#978-1-83608-298-920251007.xhtml#bib29) argue that it
    is imperative to provide a more accurate assessment of the detrimental effects
    of plagiarism. Plagiarism primarily has contextual impacts and is influenced by
    traditions. The definition of plagiarism varies among different professions and
    civilizations. [Tran et al. (2018)](#978-1-83608-298-920251007.xhtml#bib77) argues
    that it is implausible to apply the regulations about plagiarism in academia to
    different businesses or cultures.'
