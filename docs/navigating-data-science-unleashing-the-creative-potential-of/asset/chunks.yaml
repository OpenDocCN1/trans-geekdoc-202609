    影子 AI（Shadow AI）的鲁莽行为带来了重大风险，但通过适当的记录和审批流程，也可以简化其决策过程。未经授权使用 AI 工具会导致数据隐私面临巨大风险。在处理敏感数据时，必须始终遵守安全协议。不受监管
    AI 解决方案的激增可能会导致不可预测的劳动力需求和技能要求。通过正规渠道，企业可以重新获得对系统的治理。为了减少与影子 AI 相关的风险，组织需要制定一个符合其价值观和政策的道德
    AI 使用框架。这可以通过制定伦理规则和法规来实现。这确保了任何 AI 都遵循保护公司及其客户免受不伦理 AI 行为侵害的规则。任何 AI 系统都应对其工作原理透明，并为非专业人士提供其选择的依据
    (Zhan et al., 2023)。通过揭秘 AI 并让所有利益相关者都能理解，可以增强对 AI 应用的信心。为了有效管理和缓解与影子 AI 相关的风险，必须采取这一步骤，以确保所有
    AI 计划都有清晰的监督路线。通过实施这些策略，与影子 AI 相关的危险将会降低，并建立一个促进创新和实验的安全且受监管的环境。意识到 AI 潜力并并通过结构化路径引导其发展的组织，可以在保持控制和问责的同时，利用其力量来推动创新。


    ### 2.1.1 影子 AI 的潜在收益


    组织通过拥抱 AI 潜力并将影子 AI 项目转化为增长引擎，可以变得更具创新性、高效且具有竞争力 (Zhan et al., 2023)。


    ### 2.1.2 加速决策过程


    通过为不同的业务部门提供 AI 工具，企业可以利用各种观点和专业领域做出更好的决策 (Pierce, 2008, pp. 79–99)。通过这种去中心化方法做的决策更有效，因为它结合了组织不同部分的视角。


    ### 2.1.3 提高生产力和效率


    影子 AI 项目通常始于简化工作流的尝试，这可能会导致行业认可的最佳实践 (Orton-Johnson & Prior, 2013)。当员工使用 AI 更快、更智能地完成任务时，整个组织就可以实施这些创新，提高生产力。


    ### 2.1.4 鼓励创意与创新


    让员工 (Milmo, 2023) 尝试 AI 有助于营造更具创新性的工作氛围，并为日常问题发现新的解决方案。这种创新可能不是源自上而下的指令。许多业务用户正在尝试使用
    `ChatGPT` 和 `Google Bard` 等生成式 AI (GenAI) 应用来 (Cui et al., 2023) 与运营部门对接以提高生产力。这种动机是合理的，但影子
    AI 带来了独特的网络安全和商业风险，就像任何经过批准的大语言模型 (LLM) AI 项目一样。


    ### 3. 研究方法


    影子 AI 通常始于善意良好的员工，他们只是想在 AI 技术的帮助解决问题并更好地工作。他们并不是试图违反规则，而是在寻找解决方案。影子 AI 使用的潜在收益和风险，以及组织在使用影子
    AI 时带来的数据隐私问题，已在 1995 年至 2024 年的文献研究中进行了讨论，通过分析 IT 与业务之间的差异、关键变量和关系，以及 AI 所面临的实际挑战与机遇。


    #### 3.1 功能威胁


    功能性威胁由欧盟网络安全局 (ENISA) 定义。当 AI 工具未能按预期执行时，就会产生功能性威胁，导致潜在风险和后果。功能性风险是指 AI 模型偏离了其旨在处理的问题范围，使其变得不可用并具有误导性。运营风险危害了公司的业务运营。存在多种运营风险。例如，如果影子
    AI 工具没有经过良好训练，可能会对公司产生不利。来自 GenAI 的负面建议可能导致更高的机会成本，例如公司在应该投资的地方未能投资，或者在粗放增长时浪费投资。使用
    LLM，特别是任何在企业数据管理策略之外训练和开发的未经许可的模型，可能会使机客户和业务信息面临风险。当聊天机器人接收用户提示词时，它可以利用这些信息作为训练数据并与平台运营商和其他用户共享。一旦
    AI 平台遭受网络攻击，数据可能会落入犯罪分子手中。当医疗提供者使用 GenAI 聊天机器人总结患者预约时，他们违反了规定并泄露了私人健康信息。高管使用 AI
    创建内部演示要点时，泄露了商业秘密。当律师使用聊天机器人整理案件笔记时，确保律师与客户之间通信机密的法律保护被泄露了。业务分析师通过上传包含客户卡号的大型多字段电子表格，使用
    GenAI 应用创建新报告 (Shevlane & Christiano, 2023)。AI 安全和治理的优先事项应该是对模型进行极端风险评估。通过 LLM
    访问此类隐私信息可能会危害公司的业务计划和知识产权，使竞争对手占据优势并削弱竞争优势。涉及个人身份信息时，可能会发生重大的数据隐私和合规违反，损害客户信任并产生声誉后果。法律风险是指影子
    AI 使业务面临法律诉讼或罚款的风险，法律风险将在运营风险和功能风险之后出现。然而，如果信息是错误的，公司在错误行动时将浪费巨额资金。投资者可能会提起诉讼。


    #### 3.2 监管罚款与刑事处罚


