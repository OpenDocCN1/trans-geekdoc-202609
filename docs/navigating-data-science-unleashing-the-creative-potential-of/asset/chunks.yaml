- raw: 'Expert systems are a subset of AI that exhibits the power of decision-making
    in AI systems. These systems utilize knowledge-based and set inference rules to
    solve problems that require human expertise and thinking abilities ([Omitaomu
    & Niu, 2021](#978-1-83608-298-920251008.xhtml#bib18)). The key elements of expert
    systems are the knowledge base, inference engine, user interface, and domain knowledge
    given by an expert. [Fig. 8.2](#978-1-83608-298-920251008.xhtml#fig2) represents
    the working of an expert system where the specialist knowledge database is a primary
    component. The knowledge base is defined by rules using logical operations and
    if-then-else statements. The acquired knowledge and the collection of rules have
    been applied to conclude the given problem. The effectiveness of expert system
    relies upon the data provided by field experts and stored in the knowledge base
    ([Sarker, 2022](#978-1-83608-298-920251008.xhtml#bib22)). The performance and
    decision-making capabilities of the expert system improve by storing and collecting
    a large amount of knowledge base. The following are significant applications of
    the expert system.


    *   Expert systems have been utilized to manufacture and design physical devices
    such as automobiles and VLSI systems.


    *   To develop systems such as blood diagnosis, the reasoning of specific diseases,
    and detecting inner malfunctioning.


    *   Forecasting systems in different domains, such as rain forecasting, weather
    forecasting, and energy forecasting, are also developed using expert systems.


    *   It can be used for planning and scheduling tasks.


    *   Monitoring systems are also expert systems applications that are used to compare
    the observed behavior of the system against the specified data to detect certain
    malfunctions and leakage in the oil pipelines.


    *   To diagnose faults in the manufacturing of computers and vehicles.


    ![image](images/f08-02.jpg)


    Fig. 8.2. Working of Expert System.


    ##### 1.1.2 Machine Learning Techniques


    ML is a sub-field of AI that learns from the dataset to improve the learning capabilities
    of expert systems ([Górriz et al., 2020](#978-1-83608-298-920251008.xhtml#bib9)).
    ML-based AI techniques are more adaptive and dynamic need not to be developed
    and programmed explicitly for every new task ([Chen et al., 2008](#978-1-83608-298-920251008.xhtml#bib4)).
    ML based systems can think and learn the given task using the data related specific
    domain ([Mellit & Kalogirou, 2008](#978-1-83608-298-920251008.xhtml#bib17)). ML
    techniques are classified into supervised, unsupervised learning and reinforcement
    learning which are discussed as follows.


    *   Supervised learning techniques


    *   The supervised learning uses the labeled input data to perform classification
    and prediction tasks. The labeled dataset consists of labeled input and output
    parameters and the learning algorithm map the input datapoints with output data
    to get accurate results. There are two types of supervised learning techniques,
    namely classification and regression. The classification algorithms are known
    as classifier which is used to classify the category of labeled input using the
    training dataset and produces yes/no, spam/not spam and 0/1 as output classes.
    For example, spam detection, disease prediction, image classification, fraud detection,
    etc. are classification problems. There are two types of classifiers; binary and
    multi-class classifier. If the problem has two outcomes like yes/no, true/false,
    and 0/1, then it is known as binary classifier. Multi-class classifier consists
    of more than two classes for example types of crops, music classification. SVM
    is a well-known supervised classifier based on statistical learning theory. It
    has been applied to solve classification as well as regression problems. The SVM
    algorithm makes a best line or decision boundary to separate n-dimensional space
    into different classes. SVM has a significant number of applications in the field
    of energy prediction and forecasting. The classifiers provide high accuracy and
    work well with high dimensional space using significantly less memory. A supervised
    learning algorithm, random forest, is commonly used for classification and regression
    analysis ([Kaur et al., 2022](#978-1-83608-298-920251008.xhtml#bib12)). It is
    an ensemble learning algorithm that combines multiple classifiers to solve a complex
    problem and improve the model''s performance. The primary focus of random forest
    is to deal with a large number of values.


    *   Decision trees are used for classification and prediction problems. It is
    flowchart like tree structure that learn from dataset. Decision tree is a classifier
    in the form of tree which consists of a leaf node and decision node. The leaf
    node is the target attribute or the outcome of the test and decision node perform
    some test on the attribute value. K-Nearest Neighbors (K-NN) is a classification
    algorithm initially used for pattern recognition and statistical analysis as a
    non-parametric technique. The input consists of K-closest data values which forms
    a cluster or group. When an unclassified value occurs, it is assigned to a group
    with close nearest neighbor.


    *   Unsupervised learning techniques


    *   Unsupervised learning techniques are useful to extract hidden patterns and
    deduce significant information from the unlabeled data. The commonly utilized
    unsupervised learning techniques are clustering and dimensionality reduction.
    The most widely used clustering techniques are K-means, hierarchical clustering,
    and DBSCAN (Density-Based Spatial Clustering of Applications with Noise), which
    are used for forecasting and classification tasks. K-means is a distance based
    or centroid based statistical clustering algorithm in which *k* number of centroids
    are identified, and each data point is allocated to the nearest cluster. Hierarchical
    clustering approach creates the clusters by calculating the dissimilarities among
    data points. It constructs a tree in a top-down (divisive) and bottom-up (agglomerative)
    manner. DBSCAN is a density-based clustering algorithm used to identify noise
    in the data by highlighting the denser regions. Dimensionality reduction is an
    unsupervised learning approach has been used to transform the high dimensional
    space data to a lower dimension and eliminate redundant features. It has been
    applied to process large datasets efficiently. Principal component analysis (PCA)
    and linear discriminant analysis (LDA) are the most popular dimensionality reduction
    algorithms. PCA applies linear transformation and creates a new dimension to reduce
    the dimensionality of data. It is used as a preprocessing method while training
    ML models. LDA preserve the crucial information while reducing the dimensionality
    of data. LDA can be used to solve multi-class classification problems and design
    face detection algorithms and disease classification problems.


    ##### 1.1.3 Deep Learning Techniques'
