    # AI 算法在治理中的影响


    现在，我们可以关注无节使用基于 AI 的算法带来的直接影响和后果，并通过详细的示例和 AI 为生活引入的迷人特性，探讨 AI 在治理中的未来可能包含的内容。数字时代是一个算法群岛，这是一个算法塑造体验（无论喜欢与否）的广阔景观。个性化是为个人用户提供与其相关的信息和服务的一种方式。虽然这种做法是理想的，但
    AI 算法也引发了人们对其对生活产生巨大控制力的担忧。


    算法根据过去的行为筛选信息，创建了我们所谓的“过滤泡泡”，这强化了现有的信念（Samuels, 2012）。许多社交媒体平台如 Facebook 和 Instagram，通过推荐往往证实用户偏见的内容来提高参与度（Leonidas
    et al., 2017）。这可能导致社会出现不希望看到的两极分化。例如，在 2016 年美国大选中，过滤泡泡可能导致虚假信息的传播，从而影响了选民（West
    & Bergstrom, 2021）。


    它们还可能因为训练数据而继承并放大社会偏见。例如，众某些面部识别软件对浅色肤色更准确，这可能导致歧视性的执法行为。现在，这是否是因为模型训练数据中有更多浅色皮肤的人完全是另一回事，但归而言，这是我们将面临的众多挑战之一。如今，甚至简历筛选也是使用这些算法完成的，如果我们不够仔细，算法可能会根据与工作完全无关的事过滤掉候选人。这引发了人们对机会均等的担忧，甚至可能引发基于算法偏见的法律诉讼。


    随着算法变得越来越复杂，它们甚至可能开始左右我们做出的选择，即使它们的设计并非如此。所谓的“推荐系统”可能会引导我们走向特定的产品和服务，在我们在不知情的情况下限制我们的选择。随着社会对算法的依赖程度日益增加，对透明度的需求也日益增长。了解这些算法如何工作以及它们训练所使用的数据对于它们的问责制至关重要。目前有许多努力致力于制定法规，以促进算法决策的透明度和公平。例如，欧盟的《通用数据保护条例》（GDPR）赋予了个人访问和控制其在算法中使用的个人数据的权利。


    我们关注的另一个挑战是这个数字时代虚假信息和“假新闻”的传播。那些被编程（或未编程）为促进参与度而非真实的算法可能会放大此类事物的影响，从而创造出虚假的叙事。此外，某些算法（如
    ML 模型或 DL 模型）的不透明性为追踪它们推荐了哪些内容带来了困难（Esteves, 2022，第 39–59 页）。


    总之，在这一数字时代，算法群岛既带来了挑战也带来了机遇。虽然个性化和便利性不可否认的优点，但潜在的负面影响不能被忽视。为了实现这一景观的可持续增长，我们必须留意赋予这些算法的权力。提高透明度、制定法律框架以解决可能产生的偏见，以及促进批判性和伦理性思维，对于确保算法服务而非奴役我们的人性至关重要。从研究角度来看，可以得出结论：在部署完全基于十年大数据收集的
    AI 系统决策能力时，围绕大数据的担忧可能表现为可访问性、脆弱性、代表性等形式。


    ## 9. 未来的困境


    人们需要深思，究竟谁应该对大数据使用的局限性和后果负责——是收集数据的大型公司，还是使用数据的研究人员？而且即使通过某种方式规定了责任制，负责的人员或系统究竟将如何去消除现有的大量使用大数据的机制？对这些系统了解甚少的普通公众如何才能确保他们的数据被正确使用？这些是那些拥有必要资源和知识（因此拥有权力）的个人和组织仍不回答的问题。


