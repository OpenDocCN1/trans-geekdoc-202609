  trans: '


    尽管 `ChatGPT` 提供了许多优势，但在教育环境中使用 `ChatGPT` 也伴随着一些故障和缺点。人们日益担心，对 `AI` 系统的研究和教育将导致针对特定群体的偏见和歧的建立与促进。除了目前的损害外，变化或影响可能导致对
    `AI` 系统的偏见或不准确估计（Alexander et al., 2023)。Kong et al. (2024) 探索了 `ChatGPT` 在教育等各个领域的潜在应用，并研究了专家在实施前三个月内提出的问题。根据结果，`ChatGPT`
    在不同话题上表现出不同水平的性能。`ChatGPT` 致力于提供指导、回答问题、协助创建教学材料、进行在线辅导以及通过激励支持研究人员。然而，它的应用也存在局限性，例如伪造或操纵数据的能力，以及规避抄重检测程序的能力。


    ## 6. 生成式人工智能的伦理问题


    Kumar et al. (2024) 认为 `ChatGPT` 可以提高学习成果，因为它有助于批判性思维，擅于提供定制化帮助，并在结构化信息方面有效。在使用适当的情况下，像
    `ChatGPT` 这样的生成式 `AI` 可以帮助学生完成写作、研究和解决问题，这些任务是许多不同课程的核心。有人认为，能够以这种可靠的方式依赖生成式 `AI`
    鼓励学生在写作时表达更多的个性，因为他们不再受到所谓“良好”语法的限制，也不再需要一直构思完全原创的想法（Peng & Zhao, 2024）。调查涉嫌偏见、知识产权盗窃、缺乏真实性和网络安全威胁的案例至关重要。我们还面对那些在专业和学术背景下为了个人利益而操纵数据以及传播虚假信息的人（Baldassarre
    & Padovan, 2024）。以 `ChatGPT` 为例，Li et al. (2024) 认为，如果使用不当，生成式 `AI` 可能会引发教育中的基础伦理问题。例如，使用
    `AI` 写论文可能会导致 Li 所说的“经典作弊引擎的实例化”。尽管 `ChatGPT` 的开发者表示他们的目前无法编写具有说服力的文本（即声称某个观点，然后提供进一步证明），但他们也无法确定将来不会这样做。


    ## 7. 生成式 AI 伦理考虑的概述


    个性与真实性之间的联系贯穿人类历史。自从 `AI` 生成内容出现以来，区分真实内容与计算机生成内容变得非常有挑战。`AI` 模仿真实智能的能力威胁了许多指标（Johri
    et al., 2023）。这一发展使所有输出的可靠性受到怀疑（Gagne et al., 2023）。当使用大规模数据集训练 `AI` 系统时，它们有时像是在重复（McMillan,
    2023）。随着生成式 `AI` 使用的扩展，对识别内容的新方法日益增加（Rosário, 2024）。生成式 `AI` 可能会增加社会偏见并导致不公正的结果，这源于模型的特定设计（Gouveia
    et al., 2024）。设计不良的模型可能会操纵数据并产生虚假结果（Zhu et al., 2024）。确保对 `AI` 系统的公平对待可以保证性能（Calis,
    2023）。`AI` 输出的潜在影响是推动透明度和开放性的动力（McCormack, 2024）。如果生成式 `AI` 系统产生不准确或构成威胁的信息，将采取措施确保相关人员承担责任并对其负责（Spemann
    et al., 2024）。接受对创新 `AI` 系统结果的部分责任等同于承认责任（Raman et al., 2024）。确定生成式 `AI` 系统是否受损或伤害了人类以要求其承担责任至关重要。责任与道德和法律影响有关。确保
    `AI` 正常运行与问责直接相关。合理的模型可以通过逻辑推理来证明其结论是正确的。


    知识产权涉及生产者在创作内容期间的权利，以及 `AI` 生成材料的所有权（Johri et al., 2023）。人们担心，如果机器生产艺术、音乐或文学，从人类创作中获得的根本价值和快乐可能会受到损害。无意抄袭的风险（即复制已出版的受保护材料）引发了关于无意侵犯知识产权的伦理考虑。


    '
