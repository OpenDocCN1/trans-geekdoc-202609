    图 4.1. 概念框架。*来源：*作者构思。


    ### 3.4 AI 基础


    Zhu (2023) 提供了 `AI` 背后的基础理念，包括其各种形式、局限性以及可能存在的偏见。


    #### 数据安全与隐私

    在使用 `AI` 工具时，应对全体员工进行数据安全最佳实践的培训，例如数据分类和访问控制。


    #### 需要考虑的道德方面

    员工应接受培训，学习如何识别和处理在使用 `AI` 时遇到的伦理问题，例如问责制、透明性和公平性。


    #### 识别影子 AI

    为员工提供所需的工具，以他们识别未经批准或未记录的 `AI` 工具，并理解其中涉及危险。


    #### 利用各种培训技术

    *   **在线学习模块：** 提供易于获取的网络化课程，用于入门理解和定期复习。

    *   **工作坊和研讨会：** 为了深入研究特定的 `AI` 应用或应对新挑战，请安排互动式工作坊或研讨会。

    *   **休闲聚会：** 安排非正式聚会，让专业人士可以讨论 `AI` 相关话题并回答员工的问题，使他们能够在不担心报复的情况下表达使用 `AI` 的担忧和疑问。

    *   **内部平台：** 需要一个用于知识交流的内部平台，提供一个让员工交换 `AI` 相关资源、最佳实践和经验的论坛。

    *   **持续反馈系统：** 获取员工反馈，以了解他们对培训的理解程度以及需要改进的地方。


    #### 领导力与持续支持

    确保 `AI` 培训计划拥有强大的领导层支持，并强调其对公司成功的重要性。持续支持包括将 `AI` 最佳实践纳入绩效考核和日常工作流程中 (Cui et al.,
    2023)）。认可并表扬负责任使用 `AI` 的员工。如果员工不知道或不理解 `AI` 政策，那么他们的贡献是无效的 (Rice et al., 2020,
    pp. 1–35)。


    鉴于此，应仔细考虑培训员工安全使用 `GenAI`，无论是作为一个独立项目还是作为常规网络安全培训的扩展 (Milmo, 2023)。培训中也应讨论使用 `AI`
    的危险，重点关注数据安全和法律义务。


    #### 深度学习与 LLM

    深度学习算法被用于开发大型（在互联网海量文本数据集上训练）、语言（基于人类语言运行）和模型（用于进行预测）(Orton-Johnson & Prior, 2013
    。用户与 `ChatGPT` (`GPT`) 等 `LLMs` 交互以执行客户服务对话和内容创作等任务。这种多维度任务展示了 `LLMs` 在文本和图像生成、摘要、比较和分析方面的能力
    (Matsuo et al., 2022)。


    #### AI 的挑战与风险

    多维度任务展示了 `LLMs` 在文本和图像生成、摘要、比较和分析方面的能力 (Matsuo et al., 2022)。

