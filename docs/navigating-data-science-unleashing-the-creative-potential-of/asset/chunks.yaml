- raw: 'Qualitative research is done by using a multistakeholder approach ([Smets
    et al., 2022](#978-1-83608-298-920251005.xhtml#bib27)) to gather responses from
    researchers, the general public, customers, and gig workers. An open-ended questionnaire
    was distributed to the 32 participants through purposive sampling. The open-ended
    format of surveys allows respondents to select the topics that are significant
    to them ([Geer, 1991](#978-1-83608-298-920251005.xhtml#bib13)). Participants were
    not asked questions about their identity or any other demographic information
    to maintain confidentiality, and they were assured that the data collected will
    be used only for research purposes. The constructs and conceptual framework proposed
    by the authors were the foundation for the questions, which were formulated using
    existing literature. Deductive thematic analysis ([Blum et al., 2020](#978-1-83608-298-920251005.xhtml#bib5))
    was employed to analyze the responses of the participants following the framework.
    The constructs in the proposed framework of the study are matched with the responses
    from the participants. Data collection was stopped once the data reached saturation
    ([Boddy, 2016](#978-1-83608-298-920251005.xhtml#bib6)). The responses that are
    consistent with the themes are provided in quotes concerning each construct of
    the framework. The responses and the literature are used to propose seven arguments
    in this study.


    ### 4\. Conceptual Model for Ethical Application of AI in the Gig Economy


    By addressing factors such as data privacy, algorithmic fairness, best employment
    practices, and ecological resilience, the conceptual framework (refer to [Fig.
    5.1](#978-1-83608-298-920251005.xhtml#fig1)) has been developed by authors to
    enhance the psychological well-being of gig workers.


    ![image](images/f05-01.jpg)


    Fig. 5.1. Conceptual Framework. *Source:* Authors Conceptualisations.


    ### 5\. Discussion


    In this section, we have presented seven propositions that are based on the existing
    body of literature and are further substantiated by responses that were received
    from a variety of stakeholders. The responses provided by the participants, which
    include various stakeholders in the food delivery industry, including gig workers,
    customers, the general public, and researchers, are presented in quotation marks
    and categorized for each construct.


    #### 5.1 Data Privacy in Food Delivery Services


    The digital nature of gig work platforms often leads to the neglect of privacy
    in the gig economy. Personal devices used by workers for monitoring purposes can
    create ambiguity between personal and work domains, thereby heightening the likelihood
    of inappropriate monitoring and potential violation of personal boundaries ([Sannon
    et al., 2022](#978-1-83608-298-920251005.xhtml#bib26)). A Zomato delivery partner
    mentioned that she is not familiar with the concepts of data privacy but expressed
    her fear of using the technology. A respondent, who has never used this food delivery
    service but is well-versed in the concept and a keen observer, expressed a general
    public opinion: “Gig economy companies should implement robust data security measures
    to protect users'' and workers'' sensitive information. They should also ensure
    that users receive clear privacy policies.” Workers in the gig economy face privacy
    risks that originate from both platform companies and customers. Platforms engage
    in comprehensive surveillance and store data on workers, enabling AM. Employees
    frequently face challenges in obtaining their data or resisting performance monitoring,
    which leads to demands for data protection rights and oversight of companies''
    surveillance practices. Additionally, platforms facilitate the monitoring of workers
    by customers, which leads to information imbalances. A customer of an online food
    delivery service explained his idea about data privacy, stating:


    Most of the Gig Economy companies have effectively addressed the security concerns
    impacting various stakeholders. In the case of gig platforms like Swiggy and Zomato,
    one issue I can recall was contact info that used to be visible to the restaurant/delivery
    partner/customer. The gig platform resolves this issue by masking and routing
    the caller number. Furthermore, we should use certain data about customers, delivery
    partners and restaurants for effective targeted marketing, thereby promoting effective
    working practices. Putting a hold on all data under the guise of “data security”
    results in a “lose all” situation for all the stakeholders involved in the process,
    making the experience less smooth. I am all for giving up privacy and security
    for convenience, as the mere act of being online exposes us to a privacy threat.


    In the gig economy, customers are in a managerial position, and their ratings
    have the potential to impact the ability of workers to secure employment. Advanced
    technologies, including geofencing, facial recognition, and telematics, can be
    employed to integrate customer surveillance with platform surveillance ([Sannon
    et al., 2022](#978-1-83608-298-920251005.xhtml#bib26)). A researcher shared his
    perspective on data privacy in the gig economy:


    Gig economy companies should implement robust data encryption, strict access controls,
    and regular security audits to protect users'' and workers'' data. They should
    also adopt transparent data privacy policies and provide clear communication about
    data usage and protection measures. Furthermore, the protection of personal information
    necessitates multi-factor authentication and consistent updates to security protocols.


    In place of customers engaging in surveillance with the implementation of data
    privacy measures, workers are likely to exhibit increased trust in AI. Hence,
    it is proposed as follows:


    *P1. The adoption of strong data privacy measures by gig platforms will have a
    beneficial impact on gig workers'' trust in AI.*


    #### 5.2 Algorithmic Fairness in Food Delivery Service


    The concept of “AM” implemented through platform-based rating and reputation systems
    has been identified as a highly influential method of digital control in the gig
    economy ([Wood et al., 2019](#978-1-83608-298-920251005.xhtml#bib32)). AM is an
    emerging and insufficiently researched management strategy that integrates algorithmic
    control and algorithmic matching in AI solutions. Algorithmic control ensures
    that worker behaviors are in line with the objectives of the organization while
    algorithmic matching facilitates the coordination of interactions between demand
    and supply. Organizations utilize self-learning algorithmic mechanisms to efficiently
    accomplish their goals. The utilization of ICT in algorithmic systems is characterized
    by four fundamental attributes: Algorithmic comprehensiveness, algorithmic instantaneity,
    interactivity, and opacity. Algorithmic control mechanisms oversee the actions
    and whereabouts of workers and evaluate or incentivize their productivity. Tasks
    or customers are allocated to workers based on these results. Gig workers should
    possess a sense of perceived autonomy over their work, even in the face of algorithmic
    control, to foster trust in AI.


