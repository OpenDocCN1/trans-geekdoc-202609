    cost associated with travelling and bringing the patients in person for the treatment
    process can also be significantly decreased with the help of data science and
    AI technologies. Another important point to note is that all these revolutions
    are catalysed by the availability of high-speed internet, and by ensuring that
    the connectivity remains available across the globe, policymakers can ensure that
    the healthcare sector will continue to benefit from the combined capabilities
    of data science and AI.


    ## 3. Development of Holistic Framework


    ### 3.1 Develop Vision

