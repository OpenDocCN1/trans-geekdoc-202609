  trans: '


    数据科学与人工智能越来越多地应用于医院的患者筛查。这项技术已被证明非常成功，并在减轻从业人员负担方面发挥了重要作用，使他们能够策略地投入时间到患者护理中。在生成式人工智能的帮助下，可以快速分析与患者记录相关的各种图像，并相应地将数据转发给医生进行进一步的分析和治疗程序（Bughin
    et al., 2017）。初步流程的快速完成至关重要，因为它可以帮助医生和医疗机构在不产生任何不延迟的情况下提供患者护理服务。同样重要的是，技术的引入也使过程变得更具成本效益，这意味着为所有人提供负担得起的医疗服务的愿景可以快速且高效地实现。


    在患者筛查中使用项技术的另一个显著益处是处理速度快，因为与人类不同，技术不需要任何形式的休息或中断。这意味着患者可以接受技术的持续筛查，并相应地为医生提供分析以采取补救措施。有许多可以集成数据科学与人工智能的设备，可以在诊断方面取得满意的结果。在数据科学和人工智能的情况下，发生错误的概率也相当低，通过确保向机器输入正确的数据，可以从技术中获得最佳结果（Dhiman
    et al., 2018）。越来越多的医院现在正投资数据科学和人工智能，以开发出正确的诊断技术和机制，见证技术成为患者诊断和治疗程序相关运营手段只是时间问题。通过同时提高诊断程序的效率和有效性，数据科学与人工智能的使用在推进全球负担得起的医疗概念方面也起着关键作用。特别是对于发展中和欠发达的经济体，技术在提供良好医疗服务方面的作用至关重要。这些国家需要对医疗基础设施进行适当投资，通过使用技术，还可以有效解决与医疗管理实践、医疗服务及相关问题的成本效益问题。政策制定者在鼓励医疗行业使用技术方面的作用也变得非常重要。通过促进该领域的新投资并鼓励生态系统中的技术开发人员、创业者和相关参与者，医疗行业可以取得新的进展（Dorn,
    2024）。


    ## 2.2 疫苗发现


    在疫苗正式进入市场之前，需要大量的迭代。这些试验非常昂贵，通过利用生成式人工智能，制药公司和研究人员可以节省大量的资金和资源。这项技术为他们提供了以一种成本效益且高效的方式进行这些迭代的机会。数据科学和人工智能提供的有见解信息对试验也有帮助，通过关联不同类型疫苗试验的结果，该技术可以帮助进一步降低成本因素。该行业已经开始在疫苗发现过程中使用数据科学和人工智能，在不同类型的程序中使用技术时，与药物发现相关的总时间和成本将比以前更短（Floreano
    & Wood, 2015）。


    数据科学与人工智能的机器学习方面在疫苗发现阶段非常有帮助，训练机器识别疫苗试验的理想候选者，并随后关联试验如何带来积极变化的结果，对于疫苗发现过程来说非常重要且具有意义。这项技术在管理新疫苗的影响、数据以及分析其影响方面也非常有用，数据科学和人工智能也可以广泛用于未来与重要疫苗发现相关的数据管理。与数据清洗以及生成有关新疫苗对健康可能影响的各种查询的过程也可以在生成式人工智能的帮助下得到保留。特别是当涉及各种生物医学过程的解码过程时，数据科学和人工智能的可用性至关重要。事实上，数据科学和人工智能在发现新药和疫苗方面的效用是全面且涵盖性的。从识别与目标疾病相关的分子到找到试验下给药的正确候选人，再到跟踪结果以实现未来多年保存信息的目的，所有这些都可以在生成式人工智能的帮助下高效地完成。在药物和疫苗发现中使用技术的主要益处是降低了成本，因为许多研究报告预测，当时数据科学和人工智能的使用可以将成本降低到研发新疫苗所需总投资额的十分分之一（Fox,
    2024）。


