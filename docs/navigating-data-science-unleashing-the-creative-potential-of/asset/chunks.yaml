    data-driven choices.


    #### 12.3 Predictive Analytics


    AI is able to predict and comprehend future trends in customer and consumer behaviour
    based on historical data. This makes it possible for marketers to more effectively
    target campaigns, optimise inventory, and react proactively to customer requests
    – all of which improve outcomes and save expenses.'
