- raw: 'Artificial intelligence (AI) is a technology that mimics human intelligence,
    revolutionizing human–technology interactions. It''s central to the fourth industrial
    revolution and can significantly alter workforce structure, organization design,
    decision-making processes, and knowledge management. Trust in AI is crucial, especially
    within organizations. Scientists explore AI in various forms and levels ([Glikson
    & Woolley, 2020](#978-1-83608-298-920251005.xhtml#bib14)). The gig economy, which
    is defined by temporary contracts and independent work, is being revolutionized
    by platform economies, which are powered by technologies such as blockchain, smart
    contracts, and AI. To succeed in this changing environment, individuals need to
    have a high level of digital literacy and the capacity to work effectively with
    virtual teams that are located in different regions ([Malik et al., 2021](#978-1-83608-298-920251005.xhtml#bib23)).
    Gig economy platforms create international marketplaces for gig workers to showcase
    and monetize their skills. These digital workplaces integrate ICTs into a global
    information infrastructure, including Facebook groups, public forums, WhatsApp,
    PayPal, Amazon Pay, and navigation apps. Mobile internet and digital devices are
    essential for participation, with algorithms and machine learning tools optimizing
    gig work allocation ([Dedema & Rosenbaum, 2024](#978-1-83608-298-920251005.xhtml#bib11)).
    AI is being used in the gig economy to enhance productivity, streamline processes,
    and improve user experience. It aids in task allocation, pricing, route optimization,
    customer service, fraud detection, performance monitoring, maintenance prediction,
    and scheduling. AI-driven chatbots manage customer inquiries, authenticate identities,
    and provide personalized recommendations. However, challenges like algorithmic
    bias, transparency, and data privacy need to be addressed for ethical AI use in
    the gig economy ([Lippert et al., 2023](#978-1-83608-298-920251005.xhtml#bib21)).
    The US Department of Commerce has proposed a new classification for gig economy
    businesses, “digital matching services,” which enable direct transactions, user
    feedback rating systems, hour determination and tool supply. These platforms facilitate
    connections between individuals and service providers ([Tran & Sokas, 2017](#978-1-83608-298-920251005.xhtml#bib31)).
    In the following section, a review of the literature on gig work is presented.
    Following that is the methodology, which is a qualitative deductive thematic analysis.
    Next comes the conceptual model, then the discussion section, and finally, the
    conclusion and theoretical implications of the study are presented.


    ### 2\. Review of Literature


    Gig work durations vary from minutes to years, and the technology role and work
    relationships are subject to change. Certain scholars limit gig work to microtasks
    that are conducted through digital platforms ([Caza et al., 2022](#978-1-83608-298-920251005.xhtml#bib7));
    in our study, we have taken food delivery gig workers who work as delivery partners
    for Swiggy and Zomato, which offer autonomy through flexible shift timings and
    time off. However, algorithmic control can lead to excessive work, lack of sleep,
    and fatigue. Platform-based rating and ranking systems improve efficiency in labor
    process monitoring and supervision. Online labor platforms facilitate the connection
    between clients and a large and unregulated global pool of workers ([Wood et al.,
    2019](#978-1-83608-298-920251005.xhtml#bib32)). The literature on the remote gig
    economy lacks clarity on job quality outcomes. ICTs influence organizational structures,
    with bargaining power affecting work arrangements and worker power. Social and
    environmental factors, such as health, education, gender norms, and interpersonal
    relationships, also influence job quality. The gig economy uses algorithmic management
    (AM), positioning customers as agents to ensure satisfaction and compliance ([Wood
    et al., 2019](#978-1-83608-298-920251005.xhtml#bib32)). The online food delivery
    industry has witnessed a significant increase in its popularity. However, it is
    confronted with various challenges including substandard working conditions, absence
    of proper regulation, and job instability, all of which have adverse effects on
    the well-being and safety of gig workers. The viability of the online food delivery
    model in terms of sustainability is uncertain, as it may not be in line with the
    UN''s Sustainable Development Goals, which prioritize equitable employment and
    positive health outcomes. The private sector should adopt a more comprehensive
    perspective on sustainability, taking into account improved working conditions
    and health outcomes for employees ([Quy Nguyen-Phuoc et al., 2023](#978-1-83608-298-920251005.xhtml#bib25)).
    There is a lack of research on the ethical consequences of using AI in managing
    gig work, and there is a need for a conceptual model to analyze how these factors
    impact the well-being of gig workers. To address this gap in the literature, our
    research question for this study is as follows:


    *How do ethical AI practices affect the trust that gig workers have in AI and
    impact their psychological well-being?*


    A comprehensive framework for the ethical implementation of AI in the gig economy
    includes a variety of components, such as ecological resilience, ethical considerations,
    data privacy, algorithmic fairness, and employment practices. In the context of
    ethical considerations of AI implementation in food delivery gig work, it is imperative
    to adopt a comprehensive and multi-level perspective on organizational and community
    resilience when considering platform ecosystems (Floetgen et al., 2021). Consequently,
    we assessed all stakeholders and implemented a holistic approach. It encompasses
    principles such as accountability, transparency, fairness, and the effective resolution
    of complaints. To protect data privacy, it is essential to obtain explicit consent,
    implement stringent security protocols, and restrict the scope of data collection.
    To achieve algorithmic fairness, it is necessary to implement strategies that
    are designed to reduce bias, as well as to adhere to principles of equity and
    inclusivity. Employment practices encompass a variety of elements, such as job
    stability, fair remuneration, employee benefits, and career development initiatives
    ([Tan et al., 2021](#978-1-83608-298-920251005.xhtml#bib30)) by career counseling
    in digital workspace. The concept of ecological resilience is collectively defined
    by the promotion of sustainable practices, the optimization of resource utilization,
    and the support of initiatives that are designed to offset carbon emissions and
    promote the use of renewable energy. Gig platforms have the potential to enhance
    the psychological well-being of their employees by emphasizing these factors,
    which in turn establish a conducive and equitable environment. The psychological
    well-being of gig workers is significantly influenced by the ethical implementation
    of AI and the establishment of trust in AI. Gig platforms have the potential to
    enhance the overall welfare of their workforce by establishing a conducive and
    equitable environment through the implementation of robust data privacy measures,
    equitable algorithms, optimal employment practices, and ecological resilience.


