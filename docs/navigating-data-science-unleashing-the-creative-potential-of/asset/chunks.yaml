    of relevant information by stakeholders to the controlling agencies are also essential.


    Developed countries fabricated their policies, conceived the procedures, and aligned
    the national objectives by converging on the S&T indicators in the early ʹ40s
    and ʹ50s. The National Science Foundation (NSF), United States, conceived the
    analogy, followed by preliminary experiments in the ʹ30s and ʹ40s. Organization
    for Economic and Cooperation Development (OECD) reproduced NSF''s concepts in
    a methodological manual on R&D statistics and formulated the Frascati Manual (1963)
    ([de la Mothe, 1992](#978-1-83608-298-920251003.xhtml#bib8); [Ker & Galindo-Rueda,
    2017](#978-1-83608-298-920251003.xhtml#bib24)). Publication of the Science Indicators
    (SI) was done in 1973. The SI and S&T indices were used as a systematic model
    to analyze the enterprise''s capacity and performance with strengths and weaknesses,
    contributing to achieving the national objectives. Later on, the OECD introduced
    a series entitled S&T indicators ([Freeman, 2013](#978-1-83608-298-920251003.xhtml#bib13)).
    While the European Report on S&T indicators assisted in identifying growth in
    the European sub-continent since 1994 ([Delanghe et al., 2011](#978-1-83608-298-920251003.xhtml#bib9)),
    few European nations followed their S&T Indication methods ([Autant-Bernard, 2001](#978-1-83608-298-920251003.xhtml#bib1)).
    Different analytical methods evolved around “Principales Indicatores de Cienciay
    Tecnologia” in Latin America ([Godin, 2002](#978-1-83608-298-920251003.xhtml#bib17)).
    OECD, WHO, UNESCO, IDB, EUROSTAT, CEPAL, RICYT, and OCTS-OEI are torch-bearers
    for producing STI indicators with international and national objectives. ICONO(Spain),
    CTIE, GO- SPIN, OCyT, OCTI, and Department of Science and Technology (DST) STI
    policy of India focus on national objectives backed by their respective national
    observatories. A well-conceived STI manual administers each controlling authority.
    A standardized procedure assures the validity of statistical data to enable international
    comparison.


    The developing countries are at the nascent stage of this cycle. India has considered
    the S&T indices for economic growth and social transformation since the ʹ50s.
    Indian policies aspire to accelerate the speed of innovation to deliver science-led
    solutions. It will help attain sustainable scientific research excellence speedily.
    For India, the Technology Policy Statement (1883) ([Bhanu & Singh, 2014](#978-1-83608-298-920251003.xhtml#bib5))
    emphasized the importance of technology competence with self-reliance, which got
    superimposed by a refined vision, i.e. Science and Technology Policy ([STP, 2015](#978-1-83608-298-920251003.xhtml#bib102)),
    to bring S&T together with a critical factor in R&D investments. STP gives a detailed
    outline to address national challenges and foster an innovation system. The STI
    Policy is objected to producing knowledge, generating solutions, building wealth,
    and acquiring Intellectual Property Rights (IPRs). The National Science and Technology
    Management Information (NSTMIS), Department of Science and Technology (DST), India,
    publishes insights on India''s R&D indicators which are used in framing evidence-based
    policies. It helps planning activities in higher education and R&D. The chapter
    focuses on the Indian approach, mainly analyzing the plans, results, and challenges.
    It covers the analysis of the Indian policies, their expected implications, and
    present outcomes. The chapter incorporates a quantitative analysis with a “Scientometric”
    approach to assess the S&T indicators. The chapter brings forward analysis in
    the undermentioned structure.


    *   To curl out the salient inferences from the global economic landscape and
    present India''s position compared to the leading countries.


    *   To put forward the comprehensive and detailed S&T inputs output indicator
    assessment by converging into the Indian context.


    *   We highlight the all-encompassing statistical insinuations of co-relation
    among various socio-economic factors (including both S&T input and output indicators)
    concerning the impact on growth.


    *   To conduct a quantifiable comparison with the leading countries in the context
    of the international strategies of the United States, Japan, China, and European
    countries.


    *   Lastly, we bring out salient issues and befitting recommendations meriting
    attention, formulating Indian policies for improved S&T performance in the Indian
    subcontinent.


    The aforementioned country-specific analysis demands co-relation with the economic
    backgrounds. Due to the wide variety in the ranking of these countries, the chapter
    brings out the present standing of the Indian economy and brings out the potential
    in forthcoming decades from a global perspective using data science.


