- raw: 'AI has the potential to greatly enhance the ecological resilience of the food
    delivery industry through the optimization of operations, waste reduction, and
    the promotion of sustainable practices. AI can examine traffic patterns, weather
    conditions, and delivery locations in real-time to enhance routes, diminish fuel
    usage and emissions, and guarantee quicker delivery durations. Additionally, it
    can forecast demand by analyzing past data, seasonal patterns, and current events,
    thereby minimizing excessive production and food wastage. AI can enhance inventory
    management by accurately forecasting the ideal quantity of ingredients required,
    thereby minimizing spoilage and minimizing waste. The system can suggest environmentally-friendly
    packaging choices by analyzing customer preferences and supply chain data. AI
    can enhance energy efficiency in operations by effectively controlling heating,
    cooling, and lighting systems. In addition, it can reduce periods of inactivity
    by assigning delivery tasks to drivers, providing environmentally friendly delivery
    choices, employing flexible pricing tactics, analyzing customer input to enhance
    services, and offering real-time monitoring and reporting on sustainability measures.
    The implementation process consists of several key steps, including data collection
    and integration, the development and training of AI models, the deployment of
    AI solutions, the monitoring and adjustment of performance, and the education
    of stakeholders.


    #### 5.5 Trust in AI


    Trust is an essential and fundamental concept when it comes to the utilization
    of technology, especially in the realm of AI. Vulnerability is the state of being
    willing to expose oneself to the actions of another party, regardless of one''s
    ability to observe or regulate that party. Trust plays a crucial role in human–AI
    relationships because of the perceived risk associated with them, stemming from
    the intricate and unpredictable nature of AI behaviors. AI is widely regarded
    as gradually replacing various human occupations and fundamentally reshaping organizational
    frameworks. The susceptibility of low-skilled and low-cost employees to AI-driven
    replacement is uncertain in comparison to knowledge workers and top-level managers.
    Although AI is capable of performing certain human tasks, there is currently no
    occupation where every single task can be completely replaced by AI. Trust is
    a fluid concept that can be influenced by the actions of the individual or entity
    being trusted ([Glikson & Woolley, 2020](#978-1-83608-298-920251005.xhtml#bib14)).
    The complexity of machine learning models makes trust a vital element in user-AI
    interactions. The growing interest in explainable AI (XAI) arises from the necessity
    to uphold user confidence. When AI is developed to gain user trust, it can be
    securely integrated into society ([Glikson & Woolley, 2020](#978-1-83608-298-920251005.xhtml#bib14)).
    The technology acceptance model (TAM) is a conceptual framework that elucidates
    the behavior of technology adoption among diverse populations. The study initially
    proposed that perceived usefulness and ease of use are factors that determine
    one''s intention to use a product or service in the future. Subsequent studies
    have integrated external variables, such as trust, which plays a vital role in
    the adoption of emerging technologies. Trust is formed through the combination
    of characteristics, intentions, and behaviors, which fosters mutual reliance and
    interconnection between individuals or groups. The TAM expands upon existing research
    on organizational trust and trust in technology as discussed by [Choung et al.
    (2022)](#978-1-83608-298-920251005.xhtml#bib8). The objective of our research
    is to examine the role of trust in AI as a mediator and the ethical application
    of AI concerning the psychological well-being of gig workers in food delivery
    platforms. This is because trust in AI may lead to a more positive ethical implementation
    of AI for gig work.


    *P5. Enhanced trust in AI will result in a more positive view of the ethical implementation
    of AI among gig workers.*


    #### 5.6 Ethical Approaches in Food Delivery Services


    The ethical frameworks for conducting business are based upon principles such
    as rights, justice, the common good, virtue, and utilitarianism. Rights are centered
    around the principle of treating individuals as autonomous beings whereas justice
    pertains to the equitable treatment of all individuals. The concept of the common
    good centers around the welfare of society, particularly for individuals who are
    less capable of taking care of themselves. Virtue prioritizes universal principles
    such as truthfulness and moral uprightness. Utilitarianism is a moral theory that
    prioritizes the maximization of positive outcomes and the minimization of negative
    consequences. Within corporate environments, it provides a convenient method for
    assessing ethical choices, but it may diminish the importance of other stakeholders''
    concerns and overlook intangible expenses ([Arogyaswamy, 2020](#978-1-83608-298-920251005.xhtml#bib3)).
    Digital technologies, such as AI, are frequently advertised as being difficult
    to understand because of their ability to make decisions independently. Detractors
    contend that holding individuals accountable for the outcomes is no longer feasible,
    while automated decision-making yields fairer and just results. Nevertheless,
    the driving force behind these technologies is not primarily focused on design
    but rather on the influence of corporations. Researchers have devised techniques
    to evaluate and record ethical considerations, indicating that incorporating AI
    is a deliberate decision ([D''Cruz et al., 2022](#978-1-83608-298-920251005.xhtml#bib10)).


    *P6. The ethical implementation of AI in gig platforms will positively influence
    the psychological well-being of gig workers.*


    #### 5.7 Psychological Well-being of Gig Workers


    Well-being in the workplace has expanded to management science and organizational
    behavior, focusing on employee well-being. It includes psychological and physical
    conditions like job satisfaction, burnout, and emotional exhaustion. However,
    some argue it doesn''t consider the emotional aspect of work. Maintaining workplace
    well-being is crucial for personal and professional growth despite challenges
    like the gig economy and mobile internet usage. According to [Wu and Zhou (2023)](#978-1-83608-298-920251005.xhtml#bib33),
    improving well-being can be achieved by acknowledging the worth of each individual
    and increasing job autonomy. However, progress in this regard can be impeded by
    factors such as economic insecurity, uncertainty about the future, and a lack
    of stable interpersonal support.'
