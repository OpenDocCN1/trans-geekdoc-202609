    \ |\n\n| --- |\n\nContents\n\n[About the Editors](#About_the_Editors.xhtml)\n\n\
    [About the Contributors](#About_the_Contributors.xhtml)\n\n[Preface](#Preface.xhtml)\n\
    \n[Chapter 1 Data Science and Artificial Intelligence: Exploring Collaborative\
    \ Potential for Healthcare Sector](#978-1-83608-298-920251001.xhtml)\n\nKumar\
    \ Shalender, Babita Singla and Nripendra Singh\n\n[Chapter 2 The Next Wave in\
    \ Marketing: Data Science in the Age of Generative AI](#978-1-83608-298-920251002.xhtml)\n\
    \nM. Kalaivani, Suganya V., N.V. Suresh and S. Catherine\n\n[Chapter 3 Analyzing\
    \ Indian Science and Technology Indicators Using Data Science: A Global Perspective](#978-1-83608-298-920251003.xhtml)\n\
    \nAnant Bhatt, Rubani Singla, Shilpa Gite, Shruti Patil and Ketan Kotecha\n\n\
    [Chapter 4 Unveiling the Enigma of Shadow: Ethical Difficulties in the Field of\
    \ AI](#978-1-83608-298-920251004.xhtml)\n\nS. Catherine, N.V. Suresh, T. Mangaiyarkarasi\
    \ and Leena Jenefa\n\n[Chapter 5 Influence of Ethical AI Practices on Gig Workers’\
    \ Trust and Psychological Well-being](#978-1-83608-298-920251005.xhtml)\n\nK.\
    \ Shanthi and Suganya V.\n\n[Chapter 6 Decoding the Ethical Concerns in AI-Based\
    \ Decisions Using Big Data](#978-1-83608-298-920251006.xhtml)\n\nAnvesha Jain,\
    \ Shrishti Singh and Ruchi Jain\n\n[Chapter 7 From Ideation to Publication: Ethical\
    \ Practices for Using Generative AI in Academic Research](#978-1-83608-298-920251007.xhtml)\n\
    \nJaswinder Pal Singh, Neha Mishra and Babita Singla\n\n[Chapter 8 Future Trends\
    \ and Emerging Possibilities in AI](#978-1-83608-298-920251008.xhtml)\n\nSimarjit\
    \ Kaur, Shveta Bansal and Aashima Sharma\n\nAbout the Editors\n\n**Dr Babita Singla**\
    \ is a Professor at Chitkara Business School, Chitkara University, Punjab, India.\
    \ She has a PhD in Management and is UGC-NET qualified. She has over 14 years\
    \ of experience in teaching, research and administration. Her areas of expertise\
    \ are marketing, e-commerce, omnichannel and retail. In her career, she has been\
    \ involved in important academic and research assignments such as *Guest Editor\
    \ of a reputed Journal*, *organising and conducting International and National\
    \ Level Conferences, Faculty Development Programs*, and a guide for the research\
    \ projects along her Teaching. Her overall research-oriented mindset, rich knowledge\
    \ and dedication towards her responsibilities have awarded her with the most prestigious\
    \ *Teaching Excellence Award* and *Outstanding Achievement Award*. She has more\
    \ than 70 research publications in reputable international and national journals,\
    \ including 42 indexed in *Scopus, Web of Science and SCI*, and has presented\
    \ research papers at various national and international conferences. In the short\
    \ span of her career in Academia and Administration, she has authored and edited\
    \ several books on retail, supply chain, branding, customer relationship management\
    \ and product management; covering the course content of various universities\
    \ *nationwide with reputed publication houses including Taylor & Francis, Springer,\
    \ Emerald and IGI Global among others*. She is a lifetime member of various organisations\
    \ of national and international repute. She has successfully delivered guest sessions\
    \ at international and national universities. Other notable achievements are the\
    \ registered *Copyrights and Patents* in her name."
