    requirements, accessibility, and other similar factors. According to [Rojas (2024)](#978-1-83608-298-920251007.xhtml#bib63),
    individuals who find technology challenging tends to use it less or avoid using
    it altogether. Scholars will refrain from utilizing AI in the educational context
    if they perceive it as a formidable task. Individuals will employ AI for educational
    purposes if they are more inclined to do so.


