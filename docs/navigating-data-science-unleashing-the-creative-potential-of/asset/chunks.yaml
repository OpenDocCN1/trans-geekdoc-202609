- raw: 'According to the different brand factors, AI used to measure brand evaluation
    [Nufer and Muth (2022)](#978-1-83608-298-920251002.xhtml#bib19). AI can also be
    used to reinforce the customer journey by tracking the entire lifecycle of the
    customer journey, from raising brand awareness to fostering loyalty and brand
    equity ([Rana et al., 2022)](#978-1-83608-298-920251002.xhtml#bib22). Businesses
    may increase awareness, CRM, and overall customer loyalty through using AI-based
    solutions like chatbots, recommenders, AI-powered assistants, and interactive
    voice recognition (IVR). Recently, AI has significantly impacted marketing by
    enhancing the customer experience across various stages. Notably, medium- and
    small-sized enterprises now have access to resources that were previously available
    only to large corporations (Kupec & Pisar, 2021; Oosthuizen et al., 2021). Neural
    networks are providing marketers with dynamic tools to better understand consumer
    behaviour, develop sophisticated buyer segments, automate marketing tasks, create
    content, and forecast sales. These tools enable the processing of large data sets
    to generate more significant insights. By leveraging patterns from previous campaigns,
    marketers can utilise predictive analytics to anticipate campaign outcomes. Although
    neural networks have been around for some time, the increasing need to process
    Big Data has made these systems much more dynamic and intelligent (Hassan & De
    Filippi, 2021; Mgiba & Nyamande, 2020).


    ### 8\. AI Automation


    In [2018, Davenport and Ronanki](#978-1-83608-298-920251002.xhtml#bib7). This
    article discusses the real-world uses of AI in a business of sectors, including
    marketing it explained customer engagement through personalisation. It also emphasises
    how operational marketing activities can be automated by AI tools, freeing up
    the marketers to concentrate and creative marketing strategies.


    [Taddy (2018)](#978-1-83608-298-920251002.xhtml#bib27) looks into potential advancements
    in AI technology and how the marketing field might be influenced. He draws close
    attention to the moral conundrums raised by the application of AI in marketing,
    concentrating in particular on issues with bias and data privacy. Taddy emphasises
    how critical it is for marketers to confront these problems head-on in order to
    guarantee the ethical and responsible application of AI technologies.


    A thorough overview on digital marketing strategies is presented by [Chaffey and
    Ellis-Chadwick (2019)](#978-1-83608-298-920251002.xhtml#bib6), who emphasise the
    significance of AI and advanced analytics of data. Their research offers helpful
    insight on how to use these technologies to meet organisational goals and improve
    marketing efficacy. [Van Esch and Black (2021)](#978-1-83608-298-920251002.xhtml#bib30)
    this paper explains that how AI improves the digital marketing and explores the
    prominent advancements and their practical implications in the future. It also
    discusses potential transformation about AI and various activities in digital
    marketing. [Brei (2020)](#978-1-83608-298-920251002.xhtml#bib4). From this article,
    it is explored how AI and ML are influencing the workflow in marketing. In this
    current scenario, AI and ML cannot be separated in the normal day today operational
    activities. [Ljepava (2022)](#978-1-83608-298-920251002.xhtml#bib16) study describes
    the comprehensive usage of AI tools in marketing and how it is helpful in taking
    decision in marketing. It also found that AI implications in marketing process
    and preparation of strategy for business. [Waller and Fawcett (2013)](#978-1-83608-298-920251002.xhtml#bib31)
    explore the AI tools application in supply chain management and the advancement
    technologies of predictive analysis and big data and discusses the impact of predictive
    analytics and big data on supply chain management, parallelling these advancements
    with their implications for marketing and strategic decision-making.


    ### 9\. Ethical Issues in Applications of AI in Marketing


    Benkert (2019) ethical issues of AI in marketing has concluded that there are
    eight prominent ethical issues of the applications of AI in marketing such as
    data privacy, customer data bias accountability of the marketer using AI, transparency
    in data and the marketers are inability to understand the ethical values and the
    impacts on social influence and it affects in many ways of social activities.
    The use of AI in marketing raises concerns about its influence on consumer behaviour.
    Many scholarly studies have explored predictive marketing systems and their ability
    to affect consumer choices, albeit in different contexts (de Marcellis-Warin et
    al., 2022). Currently, organisations frequently put action ahead of requesting
    consent and will later, if needed, submit a statement of regret. This strategy
    is unacceptable and unsustainable. There are large amounts of private information
    are being collected about people without their knowledge or consent; even fewer
    are aware of possible uses for this data. These ethical concerns need to be given
    the greatest attention by the government and researchers who have dedicated themselves
    to doing no harm and genuinely serving the public interest.


    ### 10\. Data Science and AI


    Data science is laying the biggest role in AI. The capacity of AI to handle a
    broad range of data formats is another data format required. In addition to interpreting
    numerical data, AI can also comprehend text, images, and voice sound inputs, delivering
    context and meaning for subsequent evaluation of the data (Dhar, 2016). Unsupervised
    learning remains highly challenging. This field is expected to see increased activity,
    particularly regarding unstructured data, which vastly outnumbers structured data
    and continues to grow exponentially. Although much of this data consists of chatter,
    there is also valuable human content that could be utilised by machines in the
    future, once designers or the machines themselves learn to interpret it. However,
    machines currently struggle with many simple unsupervised learning tasks that
    humans easily complete or tasks requiring common sense. Achieving AI that matches
    human capabilities is still a distant goal.


    ### 11\. Impact of AI in Marketing


    In marketing today, we are working on new generative AI it came in to existence
    last year. The biggest question now is the know how technology about the generative
    AI and many of the people in marketing are working hard to learn, and it has certainly
    been fundamentally changing the marketing world for some time. In marketing, AI
    tools help the marketer to understand customer segmentation, in finding new customers
    who show propensity to buy, in product recommendations, in sales, in customer
    support activities, in the production of advertising creating content messages,
