    Alberth (2023) 将“AI 的使用”描述为生成式 AI 的特定应用，如表 7.1 所示，这些应用被学术人员用于作业、学期论文、研究论文和其他学术职责。在使用某项技术之前，用户应根据研究结果评估其益处或效能（Pechenkina,
    2023）。根据 Dencik 等人 (2023)”，当客户发现某项技术有益并能够提高其生产力和简化操作时，他们更有可能采纳和使用该技术。Gallent-Torres
    等人 (2023)认为，如果学术人员认为新技术是增强其工作效率或质量的手段，他们更有可能接受新技术。学者在教育人工智能（AIED）中使用人工智能的动机将受到他们对
    AI 对其学术追求优势评估的影响（Khan, 2024）。AI 技术提供了广泛的功能，极大帮助了学术写作，涵盖了研究和出版的不同阶段。当代设备正在促进学术研究领域的若干种变革。检查句子并思考各种写作哲学导致了精确和精炼语言的使用。为了彻底理解一个句子，有必要检查其句法、语义和结构元素（Mahapatra,
    2024）。大规模文本处理是指对大量文本材料进行高效管理。它具有处理大量数据和执行复杂计算的能力，从而产生有价值的见解（Pigg, 2024）。预测建模利用输入来预测词汇的生成并产生连贯且符合语境的语言。进一步生成式
    AI 将预测与研究的事实相结合，创建符合语法规则、保持连贯性并符合意图含义的引人文字，例如：


    #### 研究论文的写作与编辑

    AI 驱动的写作工具有助于将想法组织成连贯且合理的论点。AI 开发的语法、语调和风格确保了最高的准确性。


    #### 研究组织与总结

    AI 技术可以高效地搜索大型数据库以管理你的文献综述。通过综合多项研究的重要发现，它提供了一个全面的综述，而无需对每个单独源进行详细测试。


    #### 研究过程建议

    通过分析已出版文献集的样本，生成式 AI 可以提供对你的项目极有益的研究技术。生成式 AI 系统专于对数据进行广泛分析和解释；因此，处理大型数据集变得更加方便。


    #### PDF 文档管理

    学术人员经常查看大量的 PDF 文件。AI 帮助识别、注释和分类论文，从而简化研究管理。


    研究人员和作者可以从多种生成式 AI 应用中获益，包括：


    * 自动化重复任务提高了时间效率。

    * 提高数据分析的精确性。

    * 提高写作水平并伴有及时反馈。

    * 简化公司内部流程。

    * 通过对数据的全面分析获取知识。


    通过将这些生成式 AI 工具集成到工作流中，研究人员可以将注意力集中工作的关键领域，例如制定假设、协调实验以及围绕他们的发现构建引人入胜的叙述。


    ### 3. 生成式人工智能挑战


    与技术使用相关的挑战是指防止人们利用技术的限制、障碍或瓶颈（Nguyen et al., 2024）。本研究中的“AI 问题”是指阻止学生利用 AI 技术的各种障碍。技术采纳已被认为是一个重大挑战，特别是对于新兴或发展中国家（Kong
    et al., 2024）。当潜在客户因为可用性、支持、技能要求、可访问性和其他类似因素的担忧而认为给定技术难以使用时，就会发生技术抵触。根据 Rojas
    (2024)，发现技术具有挑战性的个人倾向于少用或完全避免使用它。如果学者认为在教育背景下使用 AI 是一项艰巨的任务，他们将克制使用 AI。如果个人更倾向于这样做，他们就会将
    AI 用于教育目的。


    ### 4. 学术研究中生成式人工智能的观点


    大众非常喜欢生成式 AI 模型，因为它们能够提供更接近人类理解的信息。OpenAI 在 2022 年引入了 `ChatGPT` 和 `DALL-E`，它们广受好评。根据
    Lim 等人 (2023)，基于 `GPT` 的变体受到了广泛认可和喜爱。根据 Stephens 等人 (2023)，`ChatGPT` 在编写结构化文章和内容、开发聊天回复、辅助翻译、解决查询以及提供代码协助方面具有卓越的知识。研究人员对改进特定任务的大语言模型
    (`LLMs`) 以及探索跨领域学习的可能性产生了浓厚兴趣（Zuber & Gogoll, 2024）。`ChatGPT` 助力教师和学生实现若干教育目标。`ChatGPT`
    帮助学生获取各领域的知识，提高他们的成就，解决复杂挑战并及时回答教育问题。`ChatGPT` 的编程活动增强了学生的技能。Alberth (2023) 和
    Stahl and Eke (2024) 描述了 `ChatGPT` 的认知益处。2023 年将与 Alberth 相关而 2024 年将与 Stahl 和
    Eke 相关。益处包括增强学习者参与研究的内在动力、增强他们对学科的理解以及培养他们。专业化的自动化对于提高教师/评审者的生产力并促进研究发展至关重要。此外，出版商正在采用更有效的诊断技术来增强评估/评审系统。


    ![image](img/f07-03.jpg)


    图 7.3 学术研究中生成式人工智能的观点。*来源：* 作者自拟。


    这种评估方法的改变重视通过指标和结论形成的知识。这说明了批判性思维与生成式 AI 思维之间的关系，如图 7.3 所示。


