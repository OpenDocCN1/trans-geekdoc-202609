- raw: 'Gig workers'' working conditions don''t meet the standards for decent work
    (DW). People who work as independent contractors don''t have to work for companies
    that support their working conditions. Several trade unions for gig workers have
    brought up the issue of fair working conditions. However, I don''t think this
    will help gig workers. Companies that focus on the gig economy are still pretty
    new, so I think we should deal with it as a matter of CSR and Decent Work (DW),
    rather than using a ‘stick’ to punish these new economic sources.


    One of the respondents, who is a researcher, expressed his opinion that


    gig workers frequently encounter difficult labor conditions, such as unpredictable
    income, inadequate job security, and inadequate labor protections. Gig workers
    are frequently required to work extended hours without the benefits and protections
    that traditional employees receive, which can result in financial instability
    and stress. Gig workers should be entitled to benefits such as paid time off and
    health insurance. Given the precarious nature of gig work, these benefits are
    essential for their well-being and can serve as a safety net that promotes their
    financial stability and health. The long-term financial planning and overall quality
    of life of gig workers can be negatively impacted by the low job security and
    stability they typically experience. Gig work''s on-demand nature frequently leads
    to inconsistent employment opportunities, which complicates the ability of workers
    to establish a consistent income.


    However, perceived job flexibility has a positive effect on personal, family,
    and business outcomes. An optimal workweek enables employees to effectively manage
    their work–life balance, resulting in advantages for both their well-being and
    their family dynamics. Furthermore, employees who can adjust their work schedule
    and location can work for extended periods without facing difficulties, highlighting
    the significance of flexibility in attaining a balance between work and family
    responsibilities ([Hill et al., 2001](#978-1-83608-298-920251005.xhtml#bib15)).
    Low-skilled workers are being impacted by the changing landscape of employment,
    as they face challenges in attaining a sufficient income and job stability. The
    enhanced power imbalance resulting from the increased flexibility in the gig economy
    heightens the vulnerability to exploitation. The economically disadvantaged individuals,
    who have a preference for full-time employment but are compelled to work multiple
    part-time jobs, are becoming progressively more susceptible to vulnerability.
    The gig economy further exacerbates discrimination and economic inequality as
    workers frequently resort to precarious work arrangements due to limited alternatives
    ([Spreitzer et al., 2017](#978-1-83608-298-920251005.xhtml#bib29)). The labor
    market is perpetually evolving, and the role of employees is pivotal. Work flexibility
    provides a harmonious integration of professional and personal lives, resulting
    in job contentment and optimal performance. The rise of digital technology and
    unconventional job positions has led to an increase in non-standardized forms
    of employment, which may affect employee job satisfaction levels ([Davidescu et
    al., 2020](#978-1-83608-298-920251005.xhtml#bib9)). This situation should be regarded
    as an emergency by policymakers as it will subsequently impact their well-being
    and job performance.


    #### 5.4 Ecological Resilience in Food Delivery Services


    Traditional business models prioritize shareholder value while sustainable management
    focuses on environmental and social impacts. Sustainable capitalism generates
    long-term value by recognizing opportunities, mitigating risks, building trust,
    and ensuring fair work conditions. Linear economy models are being replaced by
    circular or gig economy models, adopting Industry 4.0 and applying 10R principles.
    Sustainable management aims for greater functionality with fewer resources, opening
    new markets, and enforcing social good regulations. AI can enhance ecological
    resilience by optimizing resource use, reducing waste, and promoting sustainable
    practices throughout the product lifecycle. It can identify inefficiencies, improve
    recycling processes, design sustainable products, and facilitate the transition
    from linear to circular economy models. AI can also monitor environmental conditions
    and make informed decisions to protect and enhance ecological resilience ([Lavinia,
    2023](#978-1-83608-298-920251005.xhtml#bib20)).


    *P4. Gig platforms that exhibit ecological resilience by implementing sustainable
    practices will have a beneficial impact on gig workers'' trust in AI.*


    However, there are very divergent viewpoints among the general public regarding
    the environmental sustainability of gig work. “Innovative solutions that promote
    sustainability without compromising the core value proposition of gig work should
    be pursued by companies to balance economic considerations with their environmental
    impact.” Also, the respondent, who is a customer, concurred that he is unable
    to absorb additional costs:


    I am fully committed to sustainable practices; however, I am unable to support
    the so-called ‘sustainable practices’ at the expense of longer wait times and
    increased expenses. I order online to save time that would otherwise be spent:
    (a) traveling to the restaurant, (b) waiting in a queue at the bill desk (observing
    a human seated there), and (c) waiting in a queue to have my order prepared and
    handed over until the hotel employee takes it and provides me with a meal. I typically
    place an order online when I am unable to allocate the necessary time to complete
    all of these tasks. It is futile to place an order online if it incurs a time-consuming
    process. I may be willing to forgo a few bucks in terms of increased expenses,
    provided that the sustainable practices that are purported to be implemented are
    legitimate and not a form of ‘greenwashing’. In other words, I am not comfortable
    with the idea of raising the price if the gig platform is unable to provide a
    detailed justification for sustainable practices that have a genuine impact.


    However, another respondent, who is a researcher, was prepared to endorse environmentally
    friendly practices.


    I would support gig economy platforms that integrate sustainable practices, regardless
    of the potential for increased expenses or extended waiting times. The long-term
    health of our planet is contingent upon sustainability, and it is a responsible
    decision to endorse eco-friendly practices. It may also serve as an incentive
    for other organizations to implement comparable policies, thereby fostering a
    more comprehensive environmental impact.'
