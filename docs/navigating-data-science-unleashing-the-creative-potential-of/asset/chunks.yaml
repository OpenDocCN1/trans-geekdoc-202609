- raw: 'Marketers that have used computerised marketing systems are forced to reinterpret
    the application of heuristic principles while also expanding their reach. Technological
    change is seen as significant by marketers, but in contrast to the new environment
    that autonomous marketing systems arise in, the ability to learn and adapt is
    even more apparent. When it comes to providing inputs to the new systems, regulating
    their operation, and assessing their outcomes, the utilisation of these new systems
    alters both the volume and, more importantly, the quality of decision-making duties.
    Put another way, automation appears to alter the field of application (scope)
    of heuristic decision-making models rather than substitute them.


    ##### 3.1.6 Sentiment Analysis


    Effective strategic competitive research necessitates knowing consumer perceptions
    of competitors and the factors influencing them. This will help ascertain the
    actual merits and shortcomings of the different company components. Information
    gathered for business purposes through market research is included in this. One
    of the best ways to accomplish this is with text analytics and sentiment analysis.
    In order to produce a report based on consumer perceptions, sentiment analysis
    contrasts a brand''s products and services with those of its competitors. These
    insightful figures can assist brands in differentiating themselves from rivals.
    Businesses are beginning to see sentiment analysis driven by AI as a critical
    tool ([Taherdoost & Mitra, 2023](#978-1-83608-298-920251002.xhtml#bib28)). It
    makes it easier to understand what customers are thinking. It is also helpful
    for understanding the thoughts and emotions of employees. It is typically used
    to understand customer reviews, social media references, the seriousness of a
    service issue, etc. One could argue that sentiment analysis will be used in the
    near future to explore people''s emotions in greater detail. It will enhance computers''
    ability to understand the feelings expressed in comments, messages, and feedback.
    Companies will be able to react more specifically as a result. The kind of study
    was to review the literature on AI-based sentiment analysis in order to provide
    future researchers with a better understanding of the field''s advancements and
    to help them stay current with current developments.


    Sentiment analysis enables marketers to comprehend quantitative methodologies
    with profound and reliable insights into the attitudes and opinions of service
    or product consumers. One application area is marketing, which makes it possible
    to identify preferences, attitudes, and opinions on social media networks about
    products, services, companies, and travel destinations. In word clouds, high frequency
    words are arranged more centrally and are shown in a font size that corresponds
    to how often the word appears in the text. This is where the analysis''s distinctive
    value lies. This study provides all the essential R programming language features
    and sentiment analysis procedures needed to perform sentiment analysis with Mostar
    as the travel destination. It is an extremely useful tool for marketing analysis
    because of its ability to convert large amounts of textual data in real-time.


    ### 4\. AI Applications in Marketing


    AI tools in marketing applications the researcher Introduces GPT-3, a most powerful
    generative AI model most capable of producing human-like text [Radford et al.
    (2019)](#978-1-83608-298-920251002.xhtml#bib21). The paper also discussed about
    the applications in marketing including the personalised communication and content
    generation for social media posts etc.


    AI is more effective than humans at identifying patterns in marketing and can
    respond to new information faster, AI is gradually replacing humans and service
    accurate solutions in the business decision in this capacity (Gkikas & Theodoridis,
    2019). AI can predict with accuracy how and when your ideal consumers will make
    purchases if given the correct data. Algorithms in AI may be used in marketing
    automation in the wide range of activities (Reimers et al., 2016).


    One method AI digital marketing helps companies and marketers save time and money
    is through automated digital marketing services (Nair & Gupta, 2021). AI helps
    create high-performing content and makes decision-making easier. Businesses that
    employ AI-powered digital marketing techniques may be able to more successfully
    target the right clients with enticing offers ([Van Esch & Black, 2021](#978-1-83608-298-920251002.xhtml#bib30)).


    ### 5\. Digital Marketing and AI


    AI has integrated in digital marketing and improve the effectiveness of the advertisements
    [Aslam (2022)](#978-1-83608-298-920251002.xhtml#bib3) in the real market. Many
    of the digital marketers are believing today the AI tools for the content creation
    in social media post.


    Popular social networks such as Facebook, LinkedIn, Instagram, and others employ
    ML models to recommend users or accounts to follow, jobs to apply for, identify
    images, monitor ongoing conversations, and more ([Kaplan & Haenlein, 2020](#978-1-83608-298-920251002.xhtml#bib12)).
    According to the Gartner data from 2019, 37% of businesses utilise AI for content
    management and curation. ML and NLP models may get social insights by analysing
    a brand''s historical performance, which can then be utilised to provide consumer
    recommendations ([Anandvardhan, 2021](#978-1-83608-298-920251002.xhtml#bib2)).


    The daily social networks we use, such as Facebook and Twitter, rely heavily on
    AI. Facebook recognises faces in tagged photos, displays advertisements, sends
    pop-ups, and shows posts that are similar to those with which a user has already
    interacted ([Anandvardhan, 2021](#978-1-83608-298-920251002.xhtml#bib2)). Facebook
    also employs powerful ML applications of AI for these purposes. Facebook owns
    Instagram, a social media platform that use AI to identify and remove fraudulent
    content. Snapchat tracks users'' faces and adds effects that move in real-time
    with their faces using computer vision, an AI technology.


    LinkedIn uses AI to assist advertisers target audiences, measure conversions,
    display specialised information in feeds, recommend jobs, advise users they might
    want to connect with, and automate bidding ([Kaplan & Haenlein, 2020](#978-1-83608-298-920251002.xhtml#bib12);
    [Kessinger, 2022](#978-1-83608-298-920251002.xhtml#bib13)).


    ### 6\. AI Tool Applications in Marketing


    AI tools applications in marketing activities has emerged and irreplaceable ([Jarek
    & Mazurek, 2019](#978-1-83608-298-920251002.xhtml#bib10)) the authors discussed
    in this paper about the personalisation to the customer to improve the customer
    experience and customer engagement, this will leads to customer conversion rates.
    The applications of AI have been widely explored across various business sectors.
    It is expected that AI will profoundly influence business operations and everyday
    life. Despite being in its early stages [Khoa (2021)](#978-1-83608-298-920251002.xhtml#bib14),
    AI is already integrated into daily activities through website chatbots, smartphone
    virtual assistants, and NLP for interpreting voice commands.


    ### 7\. AI-Powered Tools in Customer Engagement


    It is found that the AI-powered tools are playing major role in marketing and
    we are in AI driven market [Tuzhilin (2020)](#978-1-83608-298-920251002.xhtml#bib29).
    The paper highlights the future trend in marketing and the potential benefit to
    the marketer and the consumer explained. AI tools helping them to frame marketing
    strategies.'
