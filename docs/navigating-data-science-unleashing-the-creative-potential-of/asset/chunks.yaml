    定性研究通过多利益相关者方法（Smets et al., 2022）来收集研究人员、公众、客户和零工工者的反馈。研究通过目的性抽样向 32 名参与者分发了一份开放式问卷。调查的开放式格式允许受访者选择对他们具有意义的话题（Geer,
    1991）。为了保持保密性，研究未询问参与者有关其身份或其他其他人口统计信息的问题，并向他们保证收集的数据仅用于研究目的。作者提出的构念和概念框架是问题的基础，这些问题是根据现有文献制定的。研究采用了演绎法主题分析（Blum
    et al., 2020）来根据框架对参与者的回答进行分析。研究拟提框架中的构念与参与者的回答相匹配。一旦数据达到饱和，便停止数据收集（Boddy, 2016）。针对框架的每个构念，提供了与主题一致的回答并以引用的的形式给出。本研究利用这些回答和文献提出了七项论点。


    ## 4. 零工经济中人工智能伦理应用的概念模型


    通过解决数据隐私、算法公平性、最佳就业实践和生态韧性等因素，作者开发了这一概念框架（参见图 5.1），用以增强零工工者的心理健康状况。


    ![image](img/f05-01.jpg)


    图 5.1. 概念框架。*来源：* 作者概念化构建。


    ## 5. 讨论


    在本节中，我们根据现有的文献提出了七项命题，并通过来自各种利益相关者的反馈得到了进一步证实。参与者提供的回答（包括外卖行业中的各种利益相关者，如零工工者、客户、公众和研究人员）以引号的形式列出，并针对每个构念进行了分类。


    ### 5.1 外卖服务中的数据隐私


    零工工作平台的数字化性质往往导致零工经济中对隐私的忽视。工人用于监控目的的个人设备可能会导致个人领域与工作领域之间的模糊性，从而增加了不当监控和潜在侵犯个人边界的概率（Sannon
    et al., 2022）。一位 Zomato 送餐合提到提到，她并不熟悉数据隐私的概念，但表达了对使用该技术的恐惧。一位从未用过该外卖服务但对该概念非常了解且观察敏锐的受访者表达了公众的意见：“零工经济公司应该实施稳健的数据安全措施来保护用户和工人的敏感信息。他们还应该确保用户收到清晰的隐私政策。”零工经济中的工人面临着来自平台公司和客户的隐私风险。平台进行全面的监控并存储有关工人的数据，实现了算法管理（AM）。员工经常在获取数据或抵制绩效监控方面面临挑战，这导致了对数据保护权和对公司监控行为监督的需求。此外，平台便利了客户对工人的监控，导致了信息不平衡。一位在线外卖服务的客户解释了他对数据隐私的看法，如下：


    > 大多数零工经济公司已经有效地解决了影响各种利益相关者的安全忧虑。对于像 Swiggy 和 Zomato 这样的零工平台，我记得的一个问题是曾经对餐厅/送餐伙伴/客户可见的联系信息。零工平台通过对拨电号码进行掩蔽和路由解决了这个问题。此外，我们应该利用关于客户、送餐伙伴和餐厅的特定数据进行有效的针对性营销，从而促进有效的工作实践。以“数据安全”为名挂起所有数据会导致流程中的所有利益相关者陷入“全军没”的局面，使体验变得不顺畅。我完全支持为了便利而放弃隐私和安全，因为仅仅在线这一行为就会让我们暴露在隐私威胁之下。


    在零工经济中，客户处于管理地位，他们的评分可能会影响工人获得就业的能力。先进技术（包括地理围栏、人脸识别和远程测控）可以用于将客户监控与平台监控相结合（Sannon
    et al., 2022）。一位研究人员分享了他对零工经济数据隐私的观点：


    > 零工经济公司应该实施稳健的数据加密、严格的访问控制和定期的安全审计来保护用户和工人的数据。他们还应该采用透明的数据隐私政策，并对数据用途进行清晰沟通。此外，个人信息的保护需要因素认证和持续更新。


    在客户进行监控的情况下，如果实施了数据隐私措施，工人可能会对人工智能增加信任。因此，提出如下：


    *命题 1。零工平台采用强大的数据隐私措施将对零工工人人工智能的信任产生积极影响。*


    ### 5.2 外卖服务中的算法公平性


    通过平台评分和声誉系统实施的“AM”概念被确定为零工经济中极具影响力的数字控制方法（Wood et al., 2019）。AM 是一种新兴且研究不足的管理策略，它在人工智能解决方案中整合了算法控制和算法匹配。算法控制确保工人行为符合组织目标，而算法匹配促进了供需双方的互动。组织利用自学习算法机制来高效实现其目标。算法系统中
    ICT 的具有四个基本特征：算法全面性、算法即时性、交互性和不透明性。算法控制机制监控人的行为和位置，并评估或激励其生产力。任务或客户根据这些结果分配给工人。即使面对算法控制，零工工人也应对对工作的感知自主，以培养对人工智能的信任。


    *命题 2。确保零工平台的算法公平性将提高工人对人工智能的信任水平。*


    一位在 Zomato 工作的送餐伙伴分享了对算法控制的经历：“有时长时间没有订单，而且如果奖励很高，订单收入会大幅减少。”一位客户分享了他的观点：


    算法是用户行为的镜子——就像你的 YouTube 算法会根据你的口味为你推送内容一样，算法是为个人量身定制的。这不应被误解为缺乏“公平性”，因为这些动态最终是为了迎合用户。


    '
