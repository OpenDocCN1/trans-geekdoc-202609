  trans: '


    在学术界，充分理解与“厌恶市场”（repugnant markets）相关的挑战，这些市场是指被认为违反了某些社会标准但尽管产生了整体利益的交易，正如 Berg
    (2023) 所述。断言在研究技术中使用生成式 AI 本质上是厌恶的为时还过早。


    ## 9.1 作者身份归属


    作者身份归属指的是权利的正式分配，在学术界有多个关键应用。它首先确定了文本的主要作者。作者是提倡并代表书面作品的个人 (Bozkurt, 2024)）。被分配的作者负责保护文本免受批评，并在必要时可能采取法律行动。在作者身份归属下，隐藏作者身份是不可接受的。虽然由于安全考虑，几个学术学科直到最近才为人所知。直到最近，对记者的贡献主要是匿名完成的
    (Raman, 2023)。现在，无论新闻报道多么短小简洁，很少遇到不包含清晰可见署名的新闻故事。


    此外，主张作者身份使个人有权获得与作品发表相关的财务收益。根据 Alexander et al. (2023)]，在涉及大型研究团队的情况下，分配作者信誉是允许的，只要安排和信誉是经过协商的。这种妥协的存在凸显了归属的基本重要性。然而，`LLM`
    缺乏监管出版收益或对其内容承担责任的能力 (Srivastava, 2023)。虽然作者信誉可能限于特定的个人或群体，但它并不是某种受限或无法获得的东西。其目的是让作者获得对其工作的认可，并防止未经授权的个人认领荣誉
    (Bakla, 2023)。需要注意的是，这并不是对那些未获得荣誉的人的批评。最终，随着 `LLMs` 在文字处理软件中的整合日益增加（微软已宣布将其 `ChatGPT`
    整合到其整个办公套件中，包括 `Microsoft Word`），作者在辨别手动编写的内容与 AI 辅助生成的内容将面临更大的挑战。作家们已经从同义词表、拼写检查、语法检查（包括如
    `Grammarly` 等高级 AI 语法检查器）等工具，以及目前集成到文字处理程序中的预测性文本中获了优势 (Li et al., 2024)。虽然一个试图区分技术辅助内容与人类创作内容的新标准可能是有益的，但可能获得广泛接受。研究人员不应对他们自己没有亲手输入或撰写的作品声称荣誉。这进一步加强了反对利用
    `LLMs` 进行写作的论点。最重要的是，学术界不再遵循这一理想。作者身份归属是团队和实验室中的惯常做法，不需要正式沟通。一个更有说服力的论点是主张在这种情况下，受侵犯的是生成式
    AI 产生构思的过程，而不是生成式 AI 的写作行为。一个 `LLM` 程序响应用户交互。它无法独立地探索其潜空间。结果的价值将取决于研究人员的专家评估，而研究人员也负责设计搜索。`LLMs`
    实际上并不是“想法”，而是调查者主观研究问题的结果。只有当它们发表在期刊上或通过同行评审时，它们才被视为学术贡献。因此，可以推断出使用 `Google Bard`
    或 `ChatGPT` 的学术写作符合学术作者身份的标准 (Sison et al., 2023)。


    然而，通常情况下是为最终文档的做出贡献的人没有得到应有的。。常见的做法是根据审稿人的建议聘请“专业校对员”；然而，出版作品中很少见到他们的致谢 (Gill
    & Kaur, 2023)。通常，对同行评审者的正式致谢并不常见。然而，他们贡献了更大的价值。尽管双盲评审方法避免了这种问题，但对于作者来说，对同行评审者的贡献进行致谢是是必要的
    (Bakla, 2023)。


    对于 `LLM` 生成内容的准确性似乎是可疑的 (Arighi et al., 2024) Kenthapadi et al., 2023) King et
    al., 2023)。生成式 AI 的有趣用途在于它是编辑和增强内容的工具。在这种背景下，研究人员向 `ChatGPT` 提供段落，甚至是整篇文章以供评审。在脚注或作者日期格式中单独引用是不切行的
    (Duncan & McCulloh, 2023))。


    ## 9.2 反抄袭规范


    将抄袭作为反对使用 `LLMs` 的理由足以让更传统的学者反对其采用 ([Sysoyev, 2024)。最小化指控会对研究人员产生同样的负面影响。但了解反抄袭标准的经济根源有助于我们理解这种行为的复杂性
    (Vinchon et al., 2023)。形式上定义抄袭可能相当困难。抄袭是一个源自“绑架”的拉丁词。某些字面主义者认为这个短语指的是想法的想法。根据
    Dhammi and Ul Haq (2016)，抄袭可以被视为一种偷窃症。这种习惯在日常描述中被遵循。O''Connor (2023) 强调抄袭本质上是一种欺骗行为，假装是他人作品的作者
    (O''Connor, 2014)。这强调个人是抄袭的主要受害者，而不是仅仅是人类知识库搜索的结果。Heckler et al. (2013)) 认为，对抄袭的负面影响进行更准确的评估是至关重要的。抄袭主要具有语境影响并受传统影响。抄袭的定义在不同的职业和文明之间存在。Tran
    et al. (2018) 认为，将学术界的抄袭规定应用到不同的行业或文化中是不可能的。


    '
