  trans: '


    虽然 AI 并不直接编写立法，但它越来越多地被用于分析数据和建议策略，从而塑造对公民产生重大现实世界影响的政策。它可以实现任务自动化，从而更快速地处理申请、减少官僚主义，并可能改进服务。使用
    AI 进行政策制定过程分析引发了一些显而易见的问题：在全球范围内，有哪些采用 AI 算法的政策/结构？这些政策又是如何转变并影响公民生活的？让我们探索 AI
    正在发挥主要作用三个当前及未来政策领域，并审查其影响和公众反响。


    ## 刑事司法系统

    在刑事司法系统中，AI 算法被用于预测再犯率等任务，以确定保释金额和假释资格。支持者认为这提高了效率并降低了监禁成本。然而，批评者指出用于训练这些算法的数据存在固有的偏见。例如，如果根据过去的逮捕数据来构建模型，它可能会延续种族定型，导致少数族受到更严厉的刑罚。这引发了愤怒，诸如“黑人的命也是”等运动要求不受
    AI 偏见污染的更公平的司法系统 (Lageson, 2023)。


    ## 智慧城市与社会福利

    AI 驱动的“智慧城市”计划利用摄像头和传感器来管理交通流、优化资源分配甚至监控公共安全。支持者对效率和安全的提高表示赞赏，但隐私侵入担忧也随之产生。公民可能会感到被不断监控，一举一都被追踪和分析。关于安全与个人自由之间适当平衡的辩论异常激烈
    (Galič, 2022)。


    社会福利计划日益将 AI 用于福利分配和欺诈检测。虽然 AI 可以简化流程并识别欺诈索赔，但也可能导致对公民的冷漠和不公正对待。算法可能会错误地拒绝那些符合条件的人获得福利，造成困难和挫败感。此外，一些人担心此类系统可能会创建一个信用体系，政府服务将与
    AI 决定的公民“价值”挂钩 (Ramond, 2024)。


    ## 公关、医疗与金融科技

    大数据和 AI 通过实现受众参与、结果衡量和价值创造的新方法，也正在彻底改变公关（PR）领域。美国、日本和英国等发达经济体已将其用于公关活动，这引发了伦理和法律问题。为了目标活动收集和分析大量个人数据引发了关于同意和隐私的伦理问题
    (James, 2024)。


    AI 在医疗和医学教育中的应用同样在扩大，使得伦理应用担忧比以往任何时候都更加关键。AI 增强了医疗程序，包括成像、预后、诊断支持和治疗建议。围绕医疗领域
    AI 的伦理和社会担忧与个人数据使用、功能自动化、对辅助医疗设备的依赖以及“远程医疗”的担忧 (Leimanis & Palkova, 2021)。美国医疗提供者正利用
    AI 算法来帮助他们对患者护理做出判断，包括哪些患者需要特殊关注或获得医疗权限。加州伯克分的研究的研究人员算法中发现了种族偏见的迹象 (Obermeyer
    et al., 2019)。


    大数据分析和 AI 已被金融科技公司用于评估多个来源的海量数据，并生成独立的建议或评估 (Li et al., 2022)。通过结合 AI 和大数据，金融科技公司可以提供更个性化的金融服务，提高运营效率并降低成本
    (Ashta & Herrmann, 2021)。但 AI 与数据的结合也面临隐私和伦理挑战，包括与所有权、控制、公正、透明度、偏见和歧视相关的问题 (Hermansyah
    et al., 2023)。AI 驱动的信用评分或贷款审批程序缺乏透明度，可能会不公平地损害某些人，影响他们的机会和财务稳定 (Laksamana et al.,
    2023)。


    ## 招聘

    企业对 AI 和大数据的使用完全改变了招聘流程。AI 系统可以提供熟练的自动化招聘系统，企业可以利用该系统根据申请人的资质选择最合适的人选。在视频面试中，许多公司正转向根据若干属性对候选人进行评分的算法
    (Li et al., 2021)。然而，最近的几个应用存在违反平等法的伦理问题；显然招聘过程是不公正且具有歧视性的。在招聘方面，无意识的种族主义、年龄歧视和性别歧视是主要因素。承认并减少这些偏见至关重要
    (Gonzalez et al., 2022)。


    ## 7. 发现：为基于 AI 的政策利用伦理生态系统


    AI 对政策制定的影响不可否认。虽然它提供了提高效率等潜在利益，但它对公民生活的影响可能是深远的。解决对偏见、透明度和隐私的担忧至关重要。开放对话、公众监督和健全的对于确保
    AI 保持作为良工具而非社会分裂和控制的力量至关重要。通过负责任地利用 AI 的力量，我们可以构建一个技术赋能公民并促进更加公正公平社会的未来。由于这些原因，必须在各个层面执行某些措施，以确保在宪法范围内负责任地使用
    AI。有必要调查限制用于政策制定目的 AI 算法使用的结构、其当前领域，以及这些机构是否成功实现了安全且负责任的 AI 使用目标。在大多数打算部署 AI 算法的政府组织中，监管政策制定的
    AI 框架仍处于开发阶段。


    ### 7.1 组织层面


