- raw: 'This may become more concerning as the laws governing AI development continue
    to change. In some cases, Shadow AI users could waste money by not taking advantage
    of special prices for similar, approved technology. Consider the opportunity cost
    associated with covert projects that eventually fail because they violate company
    policies or best practices. The time and money spent on these projects could have
    been used for other endeavours ([Ward et al., 2023](#978-1-83608-298-920251004.xhtml#bib26)).
    If businesses intend to keep up with the constant advancements in technology,
    they will need to reconsider their Shadow IT strategies and gain a better understanding
    of how to handle its usage ([Silic & Back, 2014](#978-1-83608-298-920251004.xhtml#bib22)).
    Limitations is an effective precautionary measure, but it is not a cure-all for
    Shadow IT issues that present opportunities for the whole ecosystem of the business
    concern. Moreover, be prepared to pay transition costs when shadow projects are
    formally added to the portfolio and cease to be shadow projects. Retraining will
    be required for the staff and employees who used the Shadow tool, so they can
    understand the tool set in its updated context and with new limitations. The organisation
    will also have to pay migration costs in order to move other users to the authorised
    tool ([Turpin et al., 2023](#978-1-83608-298-920251004.xhtml#bib25)). Shadow IT
    is a phenomenon that privacy and conformance addresses, and it appears that this
    field is just getting started (Silic, 2013). Additionally, a number of earlier
    studies have already addressed this ‘insider-threat’ and its mitigation ([Warkentin,
    1995](#978-1-83608-298-920251004.xhtml#bib27)). The issue is one of employee awareness,
    and the suggested remedy is to train staff members to adhere to information systems
    security policies.


    ##### 3.2.1 Research Question: However, the Fundamental Query Remains: Why Is
    There Such a Stark Mismatch Between IT and Business?


    Researchers have identified a number of reasons for this misalignment, including
    a severe lack of business-IT communication and a decline in responsiveness ([Teo
    & Ang, 1999](#978-1-83608-298-920251004.xhtml#bib24)). Shadow IT is typically
    interpreted as a type of user non-compliance because it has been determined to
    be primarily an information systems security issue ([Györy et al., 2012](#978-1-83608-298-920251004.xhtml#bib102)).
    Shadow AI frequently appears in businesses as a result of employees deploying
    AI solutions on their own, slow IT processes or a lack of AI tools [Widder et
    al. (2023)](#978-1-83608-298-920251004.xhtml#bib28) address departmental needs.
    It can also arise from the perception that getting approval for new technologies
    is difficult. Applications that are not in compliance with the organisation''s
    IT governance, such as unapproved machine learning models, AI-driven analytics
    tools or any other AI software, are referred to as ‘Shadow AI’. Workers frequently
    use Shadow AI to get around official channels, overcome bureaucratic delays, meet
    unmet needs with more specialised solutions or innovate and streamline work processes.


    Enhancing IT agility, creating transparent AI governance frameworks, offering
    safe spaces for testing, encouraging open communication between IT and other departments
    and training staff members on risks and appropriate procedures are all necessary
    to prevent Shadow AI. In addition to the possible advantages, Shadow AI – unauthorised
    or unreported use of AI tools within organisations – can bring new risks. It''s
    possible that Shadow AI models lack the same security precautions as systems that
    are authorised. This increases the risk of confidential information leaks, whether
    intentional (data theft by the model operator) or unintentional (sharing secrets).
    Unauthorised access to sensitive company data may occur if the Shadow AI tool
    involves a human review of customer data (for training or improvement, for example).
    Organisations are subject to legal requirements regarding cybersecurity and data
    privacy. Using shadow AI models outside of authorised channels may result in breaking
    these rules. AI models can produce erroneous results or reinforce preexisting
    biases, particularly when they have little training data (Wiltshire & Ronkainen,
    2021). As the author pointed out, ‘hallucinations’ are essentially false information
    that the AI presents as fact, and they can have dangerous repercussions. Teaching
    staff members about the possible risks associated with ‘shadow’ AI and promoting
    appropriate use of these technologies. Defining precise policies and procedures
    for organisational approval of AI use is also needed. Security measures like ensuring
    all AI tools, authorised or otherwise, meet data security standards and comply
    with regulations. Regularly monitoring and auditing AI usage to identify and address
    any unauthorised or risky practices. By taking proactive steps, organisations
    can harness the power of AI while minimising the potential pitfalls of Shadow
    AI.


    #### 3.3 Data Classification for Secure GenAI Use


    Data classification is essential for secure GenAI use. It acts as a foundation
    for data security and responsible information management, similar to its role
    in general data security practices. It helps in all these ways like risk-based
    access control done by classifying data based on sensitivity, organisations can
    determine the appropriate level of access for GenAI tools. Sensitive data might
    be restricted to secure, on-premise AI deployments or enterprise-grade applications
    specifically designed to comply with internal data security policies ([Bai et
    al., 2023](#978-1-83608-298-920251004.xhtml#bib2); [Bakhtin et al., 2022](#978-1-83608-298-920251004.xhtml#bib3)).
    Mitigating Shadow AI risks by classifying data which helps to identify information
    that should not be used with unauthorised or undocumented AI tools (Shadow AI).
    This reduces the risk of data breaches, unauthorised access and non-compliance
    with regulations. Informed decision-making allows organisations to make informed
    decisions about GenAI use cases. For instance, publicly available information
    could be used with consumer-grade chatbots while sensitive data would require
    a more secure and controlled environment. This policy applies to all employees,
    contractors and anyone authorised to use AI tools and resources provided by the
    organisation. It includes GenAI models (text generation, code generation, etc.),
    AI-powered applications (chatbots, data analysis tools, etc.) and Internal AI
    development platforms. An acceptable use policy for AI can make it very apparent
    whether using AI inappropriately can harm the company and how to coordinate (Matsuo
    et al., 2022). AI use with other risk-minimising measures like data security measures.
    Decision-makers can then swiftly determine risk exposure and the appropriate course
    of action by comparing the tools'' use against the policy in the event that shadow
    AI emerges ([Castelfranchi, 2002](#978-1-83608-298-920251004.xhtml#bib5)) teaching
    and Practicing Responsible AI Use for employees. To minimise the risks associated
    with Shadow AI and to get the most out of this technology, must provide the employee
    with the information and abilities they need to use AI responsibly.


    *The following are some successful methods for education and training:*


    To accommodate various learning styles, use a variety of formats, such as interactive
    modules, online courses, video tutorials and even simulations with real-life example
    throughout the course, and provide instances from your industry''s responsible
    and irresponsible use of AI and case studies of actual Shadow AI occurrences to
    identify possible dangers and repercussions. Steer clear of excessively ([Castelfranchi,
    2000](#978-1-83608-298-920251004.xhtml#bib4)) technical jargon and concentrate
    on imparting useful information (refer [Fig. 4.1](#978-1-83608-298-920251004.xhtml#fig1)).


    ![image](images/f04-01.jpg)'
