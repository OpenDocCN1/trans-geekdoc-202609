    potential health conditions, detect anomalies, and provide personalized lifestyle
    changes. | Real-time monitoring. |

    | 2. | Avigilon | Intelligent Video Analytics | AI models perform tasks like behavioral
    analysis and facial detection in real life. | Traffic monitoring, retail analytics,
    security surveillance. |

    | 3. | Prospera | Precision Agriculture | AI models should be aligned for irrigation
    optimization, disease detection, and yield protection. | Crop yield improvement,
    resource usage optimization. |

    | 4. | FogHorn Systems | Predictive Maintenance in Industrial IoT | AI models
    detect potential failures, predict anomalies, and recommend maintenance. | Reduce
    downtime and improve operational efficiency. |

    | 5. | Cisco Kinetic | Smart Traffic Management Systems | AI models are used for
    traffic prediction, route optimization, and detection of traffic areas. | Provide
    real-time traffic updates, adjust traffic light timings, and suggest routes for
    optimizing traffic flow. |


    ### 3.3 Edge Computing


    The amalgamation of edge computing and AI is a powerful combination to address
    the problems associated with traditional cloud-centric approaches now known as
    Edge AI. Edge computing is crucial in facilitating AI by providing superior performance
    at a reduced expense. Edge computing addresses the technological challenges faced
    by applications powered by AI due to their information and computation-intensive
    nature. This leads to optimization, faster response times, and enhanced operational
    efficiency.


    The big data requirements for Edge AI are specified in [Table 8.3](#978-1-83608-298-920251008.xhtml#tbl3).
    Another application of Edge AI is predictive maintenance, where data processing
    can be done to anticipate any significant failures or risks. Edge computing enables
    high-performance business services by leveraging local processing power, data
    analytics capabilities, and devices close to the end users. Industrial automated
    processes, urban planning, personalized medical care, and autonomous vehicles
    are just a few areas that can benefit from the enhanced performance, real-time
    responsiveness, cost-effective deployment, and decreased latency of AI solutions.
    [Table 8.4](#978-1-83608-298-920251008.xhtml#tbl4) presents the real-life application
