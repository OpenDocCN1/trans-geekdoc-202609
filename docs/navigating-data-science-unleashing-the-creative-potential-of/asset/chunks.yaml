  trans: '

    然而，大量的外卖平台零工工作者教育背景有限，这阻碍了他们的理解能力，并导致他们将问题完全归咎于算法。这些工人必须接受有关算法公平性的适当培训以解决他们的问题。一位研究人员分享了对零工经济中算法管理偏差的怀疑：


    零工经济公司使用的算法可能会表现出偏差，特别是当它们在有偏的数据集上进行训练时。例如，它们可能会在无意中偏向某些群体而非其他群体，导致工作机会分配不均或薪资差异。偏差可能源于地理位置、用户评分甚至分配的任务类型等因素，可能会加剧现有的社会不平等。


    感知控制是个体认为他们可以影响其内部状态、行为和外部环境的信念 (Pagnini et al., 2016)。根据 Infurna et al. (2011)，拥有控制感可以减少经历负面健康影响的机会。相信自己有更多控制权的人更有可能通过采取预防措施和体育活动来照顾健康。感知控制是一种心理建构，反映了个体对自己施加影响和调节自身生活能力的信念。它包括许多元素，如拥有内部控制点（相信自己的行动决定结果）、自我效能（对自己能力的自信）、胜任感（感到胜任且熟练）以及个人自主性（拥有选择和决策的自由）。强烈的控制感意味着个体坚信自己有能力对特定情况的结果施加影响。这些个体积极利用应对策略来有效管理压力情境，从而保护自己免受压力并增加获得积极结果的机会
    (Jung et al., 2023)。增强员工控制权将对他们的感知控制产生积极影响，反过来将正向影响工作满意度等结果，并减少身体和情感痛苦以及角色压力 (Spector,
    1996)。如果个人想要去度假，他们可以随时通知其他人并留在所在地。这完全没有问题。他们能够自主工作，无需任何人类主管中断他们的工作。零工工作中的感知控制是指个体对劳务平台控制的信息的理解和解释。个体的投入、行动和工作认可可能会受到其个人价值判断的影响，而这种判断反过来又受到这种解释的影响
    (Lang et al., 2023)。


    算法管理（AM）对于监督各种工人至关重要，例如 UPS 递送人员、酒店客洁员、零售店人员、记者和医生。远程办公的兴起使白领和管理层员工容易受到自动化监控的威胁。以
    Uber 为例，它雇佣了 26,900 名员工，并监管着全球 390 万名司机的网络。非零工工作环境中的算法管理面临不同程度的认可，但其在增强协作和优化工作流程方面的通常得到认可。算法和管理缺乏透明度、对行为的持续监控以及缺乏支持等因素可能导致零工工作者感到沮丧、精疲和高流失率
    (Zhang et al., 2022)。这些挑战可以通过实施有效的算法管理，并与主要的利益相关者公开分享有关实施的知识来缓解。


    ## 5.3 外卖服务中的就业实践


    外卖服务行业的就业实践与传统工作角色有显著不同。零工工作者拥有自主性、灵活性和财务激励。然而，赋予零工工作者的自主性和个人选择产生了复杂的工作身份，因为他们经常从事涉及混合角色的各种工作。市场对这些选择的反应对工人的自我、身份和财务具有影响。零工工作者面临着平衡不同工作身份以及应对缺乏明确工作身份的挑战。这可能是特别困难，因为零工工作者往往必须同时管理多份工作
    (Ashford et al., 2018)。


    零工工作对工人自主性和适应性的影响并非固有的，而是由社会经济状况和技术平台塑造的政治建构。虽然某些员工欣赏这些优势，但其他人由于其立场而面临严酷的工作条件
    (Anwar & Graham, 2021)。工作相关的压力因素，如角色冲突、不确定性和过量工作，会在很大程度上导致工作与家庭冲突（WFC）的发生。这些压力源可能会延伸到个体的家庭生活中，给从工作相关担忧中抽离带来挑战。研究表明，角色过载、冲突和模糊程度的升高与
    WFC 的增加有关。当员工背负工作相关责任的负担时，他们可能需要帮助才能充分投入与家人的互动、参与家庭活动或履行照顾职责。职场中的角色冲突会极大影响员工的
    WFC。WFC 与员工心理痛苦之间的相关性在不同行业部门已得到充分检查。长期接触 WFC 可能会导致职业倦怠、情感疲劳、认知疲劳、人格化和个人成就感下降。由于兼顾工作和家庭义务而经历的慢性压力会导致不知所措、焦虑和紧张感，这可能导致心理痛苦
    (Abdou et al., 2024)。


    零工工作者坚信他们拥有高程度的工作灵活性。工作灵活性包括时间灵活性，以及员工选择其工作地点和方法的自由程度。这些选择可以显著影响各种工作和生活相关的因素，如工作与家庭平衡和情感耗竭
    (Ma, 2018)。因此，多个角色身份的存在和过量的工作要求可能会导致 WFC，最终导致心理痛苦。然而，值得注意的是，工作灵活性在这方面可以提供某种程度。实施旨在增强个人福祉的额外就业策略可能会对算法的信任。


    *P3. 零工平台实施优化就业策略将支持零工工作者对算法的信任。*


    然而，零工工作者对目前的就业福利并不满意，正如他们的回答所示：“他们提供医疗保险；但是，对于如何使用或理赔缺乏透明度。”此外，在降水期间，他们提供价格低廉的雨衣。此外，她表示：“女性每月享有两天带薪休息日。但是，必须满足特定的工作条件才能获得。”一位是客户的受访者认为：


