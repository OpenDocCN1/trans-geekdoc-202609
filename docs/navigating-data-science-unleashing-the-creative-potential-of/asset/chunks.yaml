  trans: '


    国内研究开发支出（GERD）是指一个国家内利益相关者（即居民企业、研究机构、大学和政府实验室机构）的当前支出和资本支出的总和。总支出包括来自外国来源的研发资金，但不包括在我国经济范围之外实施的国内资金分配。这些指标值是根据基准年和购买力平价（PPPs）以美元价格价格得出的。它们以各国
    GDP 百分比的形式呈现（Godin, 2003）。报告显示，印度总研发支出在 2004 年至 2018 年间增长了五倍。GERD 在这十年内持续增长，从
    2004–2005 年度的 24,117.24 亿卢比增长到 2017–2018 年度的 113,825.03 亿卢比，并达到 2018–2019 年度的
    123,847.71 亿卢比。图 3.3 显示了政府、商业企业、私营部门和公共部门投资的年度总 GERD 图表。图表突显了 GERD 增长了五倍，其中私营部门、公共部门和政府资金占据了很大份额。印度研发支出的数字与其发展水平和预期相符。然而，据报道，世界领先国家的商业部门
    GERD 远高于其发展水平的预期，特别是美国、中国、日本和德国。2020 年，印度位列全球 50 强创新国之列，在《全球创新指数》（GII）131 个国家中排名第
    48 位。与领先国家相比，印度政府对 GERD 的贡献占 56%，而这一比例小于前 10 大经济体中的 20%。在推动创新和增加商业部门对 GERD 的贡献方面仍存在巨大空间。由于
    2004 年之前政府资金涵盖了研发支出的最大份额，印度政府采取了纠正措施，使其成为全方位的发展平台。印度政府成功地吸引了商业企业和私营部门对研发的投入。商业企业的投资从
    2004–2005 年度的 7,296.84 亿卢比增长到 2018–2019 年度的 51,115.35 亿卢比，在研发投资中的占比为 41.3%。


    该图表展示了国家层面所有利益相关者的健康份额。尽管私营部门的支出有所增加，但 GERD 份额略有萎缩（从 2014–2015 年度的 37.20%下降到 2018–2019
    年度的 36.79%）。研发支出的一个相关垂直领域是高等教育部门，这在以前的印度框架中是不存在的。图 3.4 显示了印度分部门的研发支出，以及从 2004–2005
    年到 2018 年的总 GERD 贡献明细图表。高等教育的贡献增长了七倍，即从 2004–2005 年度的 1,254.01 亿卢比增长到 2018–2019
    年度的估计 8,797.08 亿卢比。虽然 OECD 国家、日本和中国的高等教育部门分别占 GERD 的约 20%、15%和 12%，但印度仅占总 GERD
    的 7%左右，似乎距离理想标准还很远。由于高等教育和学术界是技能人力资源的重要来源和研究人员的摇篮，未来的政策制定需要关注。


    ![image](img/f03-03.jpg)


    图 3.3. 该图显示了印度年度总 GERD 的变化，突显了私营部门、公共部门和政府资金的占份额。


    ![image](img/f03-04.jpg)


    图 3.4. 图表显示了从 2004–2005 年至 2018 年利益相关者的分部门平均研发支出和投资。


    ### 4.1.2 投资与措施：教育体系


    尽管印度的人均研发支出已从 2007–2008 年度的 PPP 29.2 美元增加到 2017–2018 年度的 PPP 47.2 美元，但研发支出在预算分配方面仍需重新审视，因为与其他国相比，印度的数字仍在努力达到相应水平。与金砖国
    GDP 研发支出的比例相比（即巴西 1.3%、俄罗斯联邦 1.1%、中国 2.1%和南非 0.8%），印度在 2017–2018 年的研发支出占其 GDP
    的 0.7%。考虑到印度的直接竞争对手中国，其研发支出在过去几十年中翻了一番。中国将研发支出从 2008 年的 1.46%增加到 2013 年的 2.01%。最近，韩国的研发投资吸引了每百万人中更多的研究人员，即从
    2008 年的 4,867 人到 2013 年的 6,457 人。图 3.5 提供了印度支出的对比图表，显示为 (a) 教育体系和 (b) 印度研发支出，并与其他国对比。图
    3.6 显示了印度人均研发支出（%）的全球对比。促进研发需求的整体方法需要加强教育体系、行业支持和政策提升，以吸引外商直接投资。这一时期可以被视为一个积极信号。


    ![image](img/f03-05.jpg)


    图 3.5. 教育部门和研发部门支出的对比分析。平均支出对比图表见 (a) 和 (b)。


    ### 4.2 人力资源：研发


    人力资源在科学技术的发展中起着关重要的作用。因此，这一指标也反映了分析的见解。印度高技能人才大量流向。印度训练良好、精通 IT 且经验丰富的人因职业原因流向国外。识别科学技术人力资源（HRST）并建立其与记录增长的相关性至关重要。涉及专业教育（即技术、医学科学、工程、农业和兽医科学）、教育、法律和其他领域）并分类为公共、私营、工业和机构部门的人力资源数据已被分析。图
    3.7 显示了主要行业组中公共和私营部门的特定贡献份额。


    ![image](img/f03-06.jpg)


    图 3.6. 人均研发支出（%）的全球对比图性分析。


