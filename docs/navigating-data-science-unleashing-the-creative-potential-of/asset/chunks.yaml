  trans: '


    AI 通过优化运营、减少浪费和推广可持续实践，具有极大增强外卖行业生态韧性的潜力。AI 可以实时分析交通模式、天气状况和配送位置，以优化路线、减少燃料消耗和排放，并确保更短的配送时间。此外，它可以通过分析历史数据、季节性模式和时发事件预测需求，从而最大限度地减少过度生产和食物浪费。AI
    可以通过准确预测所需的食材理想数量来增强库存管理，从而最大限度地减少腐烂和浪费。该系统可以通过分析客户偏好和供应链数据，建议环保包装选择。AI 可以通过有效控制供暖、冷却和照明系统来提高运营效率。此外，它还可以通过向配送员分配配送任务、提供环保配送选择、采用灵活定价策略、分析客户反馈以改进服务，以及对可持续性措施进行实时监控和报告，减少闲置时间。实施过程包括几个关键步骤，如数据收集与整合、AI
    模型的开发与训练、AI 解决方案的、性能监控与调整以及利益相关者的教育。


    ## 5.5 对 AI 的信任


    在利用技术时，信任是一个本质且基础的概念，特别是在 AI 领域。脆弱性是指愿意让自己暴露在另一方的行为面前，无论个人是否有观察或监管该方的能力。由于 AI
    行为具有复杂性和不可预测的本质，与其相关的感知风险使得信任在人机交互关系中起着至关重要的作用。AI 被广泛认为正在逐渐取代各种人类职业，并从根本上重塑组织架构。与知识工作者和高层管理人员相比，低技能和低成本员工对
    AI 驱动的取代的敏感性尚不确定。尽管 AI 能够执行某些人类任务，但目前尚没有哪项职业的**每一项任务都能完全被 AI 取代**。信任是一个流动的概念，会受到被信任的个人或实体行为的影响（Glikson
    & Woolley, 2020）。机器学习模型的复杂性使得信任成为用户与 AI 交互中的关键要素。对可解释 AI（XAI）日益增长的兴趣源于维护用户信心的必要性。当开发
    AI 的目标是获得用户信任时，它可以安全地整合到社会中（Glikson & Woolley, 2020）。技术接受模型（TAM）是一个阐明不同人群技术采纳行为的概念框架。该研究最初提出，感知有用性和易用性是决定个人未来使用某产品或服务的意愿的因素。随后的研究整合了外部变量，例如信任，信任在新兴技术的采用中起着至关重要的作用。信任是通过特征、意图和行为的结合形成的，促进了个人或群体之间的相互依赖和相互联系。TAM
    扩展了 Choung et al. (2022) 所讨论的关于组织信任和技术信任的现有研究。我们研究的目标是考察信任在 AI 中作为中介的作用，以及 AI
    在外卖平台零工经济者（gig workers）心理健康方面的伦理应用。这是因为对 AI 的信任可能会导致零工工作更积极的 AI 伦理实施。


    P5. 对 AI 信任的增强将使零工经济者对 AI 的伦理实施产生更积极的看法。


    ## 5.6 外卖服务中的伦理方法


    开展业务的伦理框架基于权利、公正、公共利益、美德和功利主义等原则。权利的核心在于将个人视为自主个体的原则，而公正则涉及对所有人的公平对待。公共利益的概念围绕社会福利展开，特别是对于那些自我照顾能力较弱的个人。美德优先考虑诚实和道德正直等普遍原则。功利主义是一种道德理论，它优先考虑结果的最大化收益和最小化负面影响。在企业环境中，它为评估伦理选择提供了一种方便的方法，但可能会减少其他利益相关者的关注并忽视无形成本（Arogyaswamy,
    2020）。数字技术（如 AI）由于其独立决策的能力而被经常认为难以理解。反对者认为，对结果负责已不可行，而自动化决策会产生更公平、公正的结果。然而，这些技术的驱动力主要并非关注设计，而是关注企业的影响。研究人员设计了评估和记录伦理考量的技术，表明引入
    AI 是一种深意决策（D''Cruz et al., 2022）。


    P6. AI 在零工平台中的伦理实施将积极影响零工经济者的心理健康。


    ## 5.7 零工经济者的心理健康


    职场福祉已扩展到管理科学和组织行为，关注员工福祉。它包括工作满意度、倦怠和情感耗竭等心理和生理状态。然而，有些人认为它没有考虑到工作的情感方面。尽管面临零工经济和移动互联网使用的挑战，维持职场福祉对于个人和职业成长至关重要。根据
    Wu and Zhou (2023)，通过承认个人价值和增加工作自主性可以改善福祉。


