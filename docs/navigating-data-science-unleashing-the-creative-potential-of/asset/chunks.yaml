- raw: 'The sudden growth of academia offers both dangers and opportunities for generative
    AI. Yet, overall, this new academic world presents a wonderful chance to establish
    the correct (sufficiently rigorous and intellectually honest) use of current technological
    possibilities especially since many of these technologies are now so user-friendly
    that even ordinary citizens can work with them. The research that happens in the
    academy must always be pristine from an ethical standpoint; accordingly, using
    technology in an unethical way is certainly not an opportunity but a danger. And
    so, by the same token, using technology correctly and I mean “correctly” in an
    as-ethical-as-possible way offers another good reason for relying on the academy
    for the generation of knowledge. Maintaining academic integrity in the collaborative
    and peer evaluation process is crucial. Rigorous peer evaluation is necessary
    for proper acknowledgment of scholarly endeavors, and this is even more important
    when using generative AI to perform tasks that are usually done by humans. A willingness
    to receive feedback and criticism is a must for academics who want to effectively
    use AI in their work. Research in AI raises ethical concerns because of its impact
    on society. If you imagine what kind of “society” a computer can construct based
    on the kind of data it''s given, and on the nature of its “learning” you get some
    idea of what I''m talking about when I refer to the broader consequences of academic
    research. Finally, adopting a thorough strategy to reduce risks ensures that AI
    remains a valuable tool for academics and also ensures that we can ethically harness
    its capabilities for the betterment of society.


