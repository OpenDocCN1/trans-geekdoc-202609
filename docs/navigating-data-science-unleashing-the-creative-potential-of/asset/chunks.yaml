    ## 6. 规范性分析


    由调查机构发布的国际报告通过全球广泛认可的概念、指南和调查，有助于衡量该国科学技术（S&T）政策的有效性。尽管印度的科学技术改革的有效性可以通过研发、专利和出版成果进行分析，但这些传统的指标矩阵仅记录了正式部门的创新。在确定的第一或二级机构和机构进行的印度调查未能涵盖非正式部门的创新和进步（Charmes
    et al., 2016）。大量的隐性指标没有出水面，因为大部分印度劳动力仍从事非正式经济（Kraemer-Mbula & Wunsch-Vincent,
    2016）。由于缺乏对这类创新的识别、标准连接的措施以及培养这些技能的官方媒介，使得捕捉工人的内部知识、非正式网络以及根据需求适应或模仿正式网络知识的能力变得具有性（Basole,
    2014）。尽管国家创新基金会（NIF）识别了超过 300,000 项创新，但许多此类最佳实践仍待发掘。另一方面，接触这些程序的机构展示了许多专利、出版物和创新，但其实用价值比例很低。几个实例表明，印度的科学技术政策优先考虑研发以开发创新解决方案。然而，农村地区和非组织部门的创新被忽视了，从而忽视了现有的创新和继承的知识。


    一方面，印度政府促进基层创新，即被称为“Jugaad”的节约型创新，通常属于非正式部门（Sharma & Kumar, 2019; Sheikh, 2014），并且缺乏将这些创新正式化以注册的手段（Bhaduri
    & Kumar, 2011; Jain & Verloop, 2012）。由于这些创新受限于特定问题并利用当地资源实现，它们缺乏具有时复杂实用性的专利新颖性。此类创新的微小激励结构和回报未能产生进一步创新的动力。因此，传统的科学技术指标没有记录这些创新。将节约型创新整合到正式科学技术指标中面临着巨大的障碍。由于非正式部门缺乏专利程序，在验证这些节约型创新的适用性和真实性方面存在困难。在大规模范围内确定其应用方面存在挑战。印度知识产权机构和传统的注册方法尚未到达非正式部门，因此错失了所有此类创新的计数，未能承认它们。总而言之，传统的创新指标忽略了创新的真实数量（Shekar
    & Paily, 2019）。印度特定行业的投资数据没有转化为科学技术指标中的相应产出。尽管政府重点仍放在国防、矿业、燃料和工程等部门，但私营部门投资相对较低。私营部门强调优先考虑制药、快消品、生物技术、农业等部门，这些部门的政府份额微乎其微，而知识产权统计未能得出任何有力的结论。尽管公私合作帮助了非正式创新纳入体系，但印度的“Jugaad”——即基层——创新尚未进入正式部门。强烈建议在农村地区建立“创新中心”以促进和简化知识产权流程。对现有的政府政策进行修订将有助于倡导、治理并使非正式部门与正式创新部门接轨。


    ## 7. 结论


    '
