- raw: 'The STIP indicators are largely limited to R&D support, i.e. government and
    private player investments in R&D and measuring the quantifiable outcomes in patents,
    trademarks and research publications. Innovation must be considered beyond the
    enterprise-level incentives. It certainly impacts the increased revenues and market
    share. The entire issue of the S&T assessment highlights a potential that needs
    to be unearthed. The latest programs run by the Indian Government, i.e., “Make
    in India” Atma Nirbhar Bharat, are improving the innovative capacity. These programs
    have attracted sizeable traction among innovators, SMEs, private players and institutions.
    Hence, there is a need to identify indicators that can map the latest innovation
    policy, which can directly measure policy investment, newly formulated policies,
    their effectiveness, resulting impacts and economic returns. In addition, it is
    essential to add a facet to the conventional metrics that can cover the non-quantifiable,
    unexplored aspects to reflect a correct picture of innovativeness. Since the S&T
    activities tend to cluster around established or leading actors and geographical
    locations, conventional methods are not effective in analyzing the changing landscape
    in STI. India needs to devise an indicator to map and track innovative clusters
    in the subcontinent. The comprehensive revamp of the entire system demands de-novo
    look to promote innovativeness. The very basis of the education system must promote
    research with complete re-orientation of the youth. The higher education system,
    colleges and academic institutions must form an ecosystem that facilitates a smooth
    transition from students to researchers and provides platforms to reach out to
    the NIF to obtain IPR for innovations. There is a strong need to provide conducive
    environments with good infrastructure, extend appropriate incentives, and nurture
    and keep the talent within the country. Measures to groom students and scholars
    require a relook, which can increase potential national multifold. There is a
    requirement to explore innovativeness and make it reach the utility sector by
    fusing academia, private sectors, and government agencies'' potential to explore
    new heights in science, technology, and innovations. An ecosystem at the central
    level can synchronize the objectives, harmonize the efforts of the stakeholders,
    and bridge the gaps for speedier growth. A focused and well-planned expenditure
    in the higher education sector, linked with thoughtful planning in R&D, will accrue
    better outcomes.


