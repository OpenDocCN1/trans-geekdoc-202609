    \ most useful tasks, with tables and figures forming the core of its talents ([Feher,\
    \ 2024](#978-1-83608-298-920251007.xhtml#bib23)). That's because “comparable”\
    \ is how we want our data to be side-by-side, in a way that allows us to see both\
    \ their similarities and differences. And that's precisely how AI can help: It\
    \ can find and highlight the patterns in our data that are easy to miss when we're\
    \ working at human speed ([Gouveia et al., 2023](#978-1-83608-298-920251007.xhtml#bib26)).\
    \ The influence of AI is growing steadily and touching every aspect of daily existence\
    \ ([Cheng & Lee, 2024](#978-1-83608-298-920251007.xhtml#bib16)). There are numerous\
    \ comparisons drawn between the rapid growth of the internet in the 1990s and\
    \ the current advancements in AI-based technology. The internet has significantly\
    \ transformed our capacity to rapidly and effectively access and handle vast quantities\
    \ of data however there is an important framework to follow while using generative\
    \ AI in research writing as shown in [Fig. 7.2](#978-1-83608-298-920251007.xhtml#fig2).\n\
    \n![image](images/f07-02.jpg)\n\nFig. 7.2. Framework for a Responsible Use of\
    \ Generative AI. *Source:* Authors' own conceptualization.\n\nAs with any technical\
    \ advancement, there is initial reluctance to adopt it due to worries over possible\
    \ drawbacks or risks. Indeed, the extensive use of AI-driven technologies gives\
