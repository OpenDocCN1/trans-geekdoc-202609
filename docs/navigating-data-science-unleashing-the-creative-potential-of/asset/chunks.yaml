  trans: '

    从 1981 年起的 20 年内，印度人口大幅增长，从 6.83 亿增加到 10 亿。我们考虑了关于`HRST`职业和`HRST`教育的数据。尽管在同一时期内，劳动力人口从
    3.06 亿增加到 4.44 亿，但核心`HRST`在 1981 年和 1991 年分别记录为 260 万和 440 万。专业性大学/认可机构的大幅增加（20
    世纪 90 年代从 886 所增加到 2,223 所）使`HRSTE`数据在短短十年内从 1,560 万增长到 2,520 万（Khadria, 2004）。为了吸收`HRST`，我们分析了涉及机构和工业部门的人力资源数据。到
    2018 年，参与`R&D`活动、辅助和行政活动的人力资源总数分别记录为约 341,818、98,824 和 112,327 人。印度在全球博士学位产量上位列中国和美国之后，拥有
    16,339 个博士学位。然而，全球`HRST`分析强调，与其他国家相比，印度在`S&T`领域的综合人才储备较低。图 3.9 显示了印度在全球范围内技术人员和研究人员参与度比较中的地位。


    ![image](img/f03-07.jpg)


    图 3.7. 主要行业组公共与私营部门的特定部门贡献份额。


    ![image](img/f03-08.jpg)


    图 3.8. 比较分析：部委/部门的`R&D`支出（单位：卢比）。


    ![image](img/f03-09.jpg)


    图 3.9. 比较分析：参与`R&D`的人力资源（技术人员和研究人员）。


    ## 4.3 印度的知识产权制度


    `IPRs`为创新性，特别是技术创新提供了保护。促进技术转让和商业化有助于提高进步水平，并刺激创新（Ilie, 2014；Mrad, 2017）。`IPRs`还通过各种激励促进创新者，为国家`S&T`发展和经济增长做出贡献（Hossain
    & Lasker, 2010）。研究表明，有充分论点，在工业化初期，强有`IPR`保护可能会阻碍技术转移和本土学习活动（Kumar, 2003）。一旦国家积累了足够的与其`S&T`基础设施相适应的创造性模仿能力，`IPR`已被证明是一个积极因素。同样，印度的发展表明了弱化`IPR`保护在建立本土能力方面重要性。针对印度背景的研究结果显示了弱化`IPR`保护的重要性，这具有积极贡献。另一方面，更强的`IPR`保护对就业和产出有负面影响。然而，关于`IPRs`对印度的影响的实证结果表明，过去十年具有积极意义（Ezdine
    & Hammami, 2018；Mallik & Chowdhury, 2001），因此，可以通过量化的`R&D`成果来分析印度的地位。


    ## 5 R&D 成果分析


    在任何领域获取创新和新工作的`IPR`被认为是国家`R&D`路线图的重要指标。`S&T`指标关注塑造未来规划的专利趋势。


    ### 5.1 R&D 趋势


    大学总入学人数在 1976–1977 年记录为 2,431,563 人，2000–2001 年为 8,399,443 人，2018–2019 年为 37,399,388
    人，增长显著。由于职业高等教育的入学比例记录为 36.8%。博士学位从 2010–2011 年的 16,093 个增长到 2017–2018 年的 40,813
    个。印度在 2014 年和 2015 年的科学与工程（`S&E`）全球第三，仅次于美国（2016 年的 39,710 个）和中国（2015 年的 34,440
    个）。


    ### 5.2 学术出版


    `NSF`数据显示印度在学术出版方面排名第三，其中在`NSF`、`SCOPUS`和`SCI`数据库中分别排名第三、第五和第九。印度的`SCOPUS`和`SCI`出版在
    2011 年至 2016 年间显著增加，分别为 8.4%和 6.4%，而世界平均水平分别为 1.9%和 3.7%。印度学术出版在 2016 年因占比 5.4%而降至第六。随着美国和中国
    2016 年后出版数量的增加，印度的数据表明需要解决的问题。尽管印度在人力资源方面拥有巨大实力，但与领先国家的年度出版差距很大，需要补充。图 3.10 (a)
    显示了与领先国家相比，印度从 2001 年起的科学期刊出版增长率。虽然印度在 2011–2016 年贡献了全球所有领域的 6.8%（683,570 篇），但其在科学（22
    个主要学科）领域的贡献仅为 4.1%，复合增长率（CAGR）为 6.4%，在 2011–2016 年期间为 336,620 篇。


    ![image](img/f03-10.jpg)


    图 3.10.印度与中国、美国的增长率对比：(a)2001 年起的科学技术期刊出版和(b)1980 年起的专利申请。


    ### 5.3 专利


    专利也引起了关注，它是衡量创新`IPR`的尺度，衡量了国家的`R&D`能力。专利数据源于居民和非居民印度人。此外，外国利益者也在印度申请获取`IPR`。专利申请数量从
    2000–2001 年的 8,503 件增加了六倍，达到 2017–2018 年的 47,854 件（图 3.10(b)）。尽管印度在居民专利申请中排名第九，但考虑到全球格局，这些数字并不令人鼓舞。`WIPO`报告印度专利局位居全球第七位。在
    47,854 项专利申请中，只有 15,550 项（32%）是由印度居民提交的，外国居民提交了剩余的 32,304 项（68%）。图 3.11](#978-1-83608-298-920251003.xhtml#fig11)(a)显示了申请、待审申请和最终审查申请的数量图表。从
    1976 年至 2018 年，每年平均专利申请数量为 16,518 件；在此期间仅有 155,566 专利获得授权，平均每年 3,795 件。图 3.11(b)显示了印度居民从
    2000–2001 年至 2017–2018 年专利申请的积极增长率，并与非居民的贡献进行了对比。在 1976 年至 2018 年间的 155,566 项授权专利中，仅
    21.75%属于印度居民。图 3.12 显示了专利申请数与授权专利的统计数据，以及印度居民和非居民自 1976 年以来的份额。图中显示的相关模式凸显了与领先国家相比的数字对比，后者的占比更高，例如中国（90%）、日本（81%）和韩国（77%）。


