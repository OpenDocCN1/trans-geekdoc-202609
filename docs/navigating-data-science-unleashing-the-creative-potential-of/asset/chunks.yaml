- raw: 'Despite the numerous advantages it offers, the use of ChatGPT in an educational
    environment is accompanied by some glitches and disadvantages. There is growing
    concern that research and education on AI systems will contribute to the establishment
    and promotion of bias and discrimination against specific groups. In addition
    to current damage, changes or effects can lead to biased or inaccurate estimation
    of AI systems ([Alexander et al., 2023](#978-1-83608-298-920251007.xhtml#bib4)).
    [Kong et al. (2024)](#978-1-83608-298-920251007.xhtml#bib38) explore the potential
    applications of ChatGPT in various domains such as education and to examine the
    issues raised by experts during the first three months of its implementation.
    Based on the results, ChatGPT exhibited different levels of performance on different
    topics. ChatGPT is dedicated to providing guidance, answering questions, assisting
    in the creation of instructional materials, conducting online tutorials, and supporting
    researchers through motivation. However, there were limitations to its implementation,
    such as the ability to falsify or manipulate data, as well as the ability to avoid
    detection by plagiarism detection programs.


    ### 6\. Ethical Issues in Generative Artificial Intelligence


    [Kumar et al. (2024)](#978-1-83608-298-920251007.xhtml#bib41) argues that ChatGPT
    can improve learning outcomes because it helps with critical thinking, is good
    at providing tailored assistance, and is effective at structuring information.
    When used appropriately, generative AI like ChatGPT can help pupils with writing,
    research, and problem-solving tasks that are central to many different kinds of
    classes. And there are people who believe that being able to depend on a generative
    AI in this trustworthy way can also encourage students to express more individuality
    when they write because they''re no longer constrained by what''s considered “good”
    grammar or by the need to come up with entirely original ideas all the time ([Peng
    & Zhao, 2024](#978-1-83608-298-920251007.xhtml#bib57)). It is vitally important
    to look into alleged cases of bias, intellectual theft, lack of authenticity,
    and cyber security threats. We must also confront the individuals who manipulate
    data for personal gain and the dissemination of false information in both professional
    and academic contexts ([Baldassarre & Padovan, 2024](#978-1-83608-298-920251007.xhtml#bib9)).
    Using ChatGPT as an example, [Li et al. (2024)](#978-1-83608-298-920251007.xhtml#bib42)
    makes the argument that generative AI could raise fundamental ethical issues in
    education if used improperly. For instance, using AI to write essays could lead
    to what Li calls “the instantiation of a classic cheating engine.” Though ChatGPT''s
    developers say their system can''t currently write persuasive texts (i.e. claim
    something, then provide further justification), they also can''t say with certainty
    that it won''t be able to do so in the future.


    ### 7\. Brief Overview of Ethical Considerations of Generative AI


    The link connecting individuality and authenticity has existed throughout human
    history. Since the dawn of AI-generated content, it has become much more challenging
    to distinguish between genuine creations and those generated by a computer. AI''s
    ability to mimic real human intelligence threatens many traditional indicators
    of credibility because it can now produce very convincing lies ([Johri et al.,
    2023](#978-1-83608-298-920251007.xhtml#bib32)). This development calls into question
    the reliability of all kinds of creative outputs, with serious repercussions for
    labor (especially political and journalistic labor) that relies on trust as a
    core component of its credibility ([De Gagne et al., 2023](#978-1-83608-298-920251007.xhtml#bib17)).
    It''s more difficult to check the work produced by generative AI. When these algorithms
    are trained using massive datasets, they can sometimes sound like they''re writing
    entirely original text when in reality; they''re just good at parroting what''s
    been written before ([McMillan, 2023](#978-1-83608-298-920251007.xhtml#bib49)).
    And because these systems are getting better all the time, the demand is increasing
    for new ways to spot when texts have been generated rather than written by humans.
    As AI systems become more widespread, concerns over fairness and bias in ethical
    considerations for generative AI are growing as well. Biased algorithms can exacerbate
    societal biases and lead to unjust outcomes. They have the ability to create deceit
    and misconceptions. Generative AI bias arises from the model''s specific design
    and type of data used ([Rosário, 2024](#978-1-83608-298-920251007.xhtml#bib64)).
    The poorly designed model can manipulate data and produce false or biased results
    even in the absence of any intentional bias ([Gouveia et al., 2023](#978-1-83608-298-920251007.xhtml#bib26)).
    Ensuring equal treatment guarantees equal performance of AI systems for all user
    groups. The decision-making process is illustrated through the use of clarity
    and openness, especially in situations where generative AI has the potential to
    significantly impact the physical world ([Caliskan, 2023](#978-1-83608-298-920251007.xhtml#bib15);
    [McCormack, 2023](#978-1-83608-298-920251007.xhtml#bib48)). As the use of AI models
    extends to different scenarios, it becomes necessary for creative AI to have transparency
    and comprehension. Due to the ability of generative AI to produce several complex
    and diverse results, it is important for users to understand the underlying concepts
    and rationalities behind each resulting result. Transparency refers to the ability
    of the public to access and understand the creation, training set, and operation
    of the model of generative AI. A plausible model can justify its conclusions through
    logical reasoning.


    If a generative AI generates information that is inaccurate or poses a threat,
    steps are taken to ensure those responsible are held accountable and take responsibility
    for their actions ([Spennemann et al., 2024](#978-1-83608-298-920251007.xhtml#bib71)).
    The potential influence of AI output is the driving force behind the need to create
    accurate rules and procedures. Accepting responsibility for a portion of the results
    of an innovative AI system is tantamount to recognizing accountability ([Raman
    et al., 2024](#978-1-83608-298-920251007.xhtml#bib60)). It is crucial to determine
    if a generative AI system is impaired or harms humans to hold that person accountable.
    Duty and accountability are related to moral and legal implications. The need
    to guarantee the proper functioning of AI is directly linked to accountability
    ([Zhu et al., 2024](#978-1-83608-298-920251007.xhtml#bib83)). This role includes
    the design, execution, monitoring and establishment of AI systems.


    Intellectual property addresses the rights of producers during the process of
    creating content, as well as the ownership of material generated by AI ([Johri
    et al., 2023](#978-1-83608-298-920251007.xhtml#bib32)). There are concerns that
    the fundamental worth and pleasure derived from human production may be compromised
    if machines produce art, music, or literature. The financial beneficiaries of
    the development of economically efficient AI should be clearly discernible. The
    potential for inadvertent plagiarism, which involves reproducing copyrighted materials
    that have already been published, gives rise to ethical considerations regarding
    unintentional violations of intellectual property rights.


    #### 7.1 The Economic Impact of Generative AI Is Twofold: Job Creation and Displacement'
