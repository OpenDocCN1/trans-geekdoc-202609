    the stack: $lc_1(lc_1(s_i)), rc_1(rc_1(s_i)), i = 1, 2$. In total $S_{word}$ contains
    $n_w = 18$ elements.

    - 2. $S_{tag}$: The corresponding POS tags for $S_{tag}$ ($n_t = 18$).

    - 3. $S_{label}$: The corresponding arc labels of words, excluding those 6 words
