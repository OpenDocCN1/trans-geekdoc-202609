    - 1. $S_{word}$: The top 3 words on the stack and buffer: $s_1, s_2, s_3, b_1,
    b_2, b_3$. The first and second leftmost / rightmost children of the top two words
    on the stack: $lc_1(s_i), rc_1(s_i), lc_2(s_i), rc_2(s_i), i = 1, 2$. The two
