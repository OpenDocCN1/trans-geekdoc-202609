    isn’t much value coming from the network while you wait for everyone to show up.
    While you may have big goals after the network matures, you should balance that
    against early quick wins to encourage adoption by more participants in the long
    term. And as the momentum builds up with more players adopting the network, you
    can also build up functionality toward a more feature-rich solution.'
