  raw: 'The good thing with the blockchain environment is that in a data-sharing consortium,
    we have distributed consensus. Using nodes as validators, all companies have their
    own up-to-date copies of the ledgers. This setup can help reduce the risk of hold-up.
    The goal should be to think about how we can alleviate some of the risks that
    are typically involved with relationship-specific investments. For instance, a
    big problem when you are entering a data-sharing consortium is that you are worried
    you won’t have access to your data anymore if you want to leave the consortium.
    It might be stored in a proprietary format or just be inaccessible. You may need
    the consortium software to read it. If you ever want to leave, you are stuck with
    a data format that you then have to pay someone to convert into a usable form
    for you. 


    As we have come to understand, blockchain technology’s value comes from the robustness
    of the business network in the consortium. In service of the network, a consortium
    steward can help by alleviating the concerns of newer consortia members. To start
    with, blockchain is a technology that can help manufacture digital trust that
    enables smart contracts. Smart contracts, with their automated execution, can
    provide added commitment from all parties to execute on the terms of the agreement
    and reduce holdup risk.[62](#juu2ljsj.html#mvas0d8ryy3)


    Since value gets derived from the network’s vibrancy, expanding the network should
    be an active topic for consortia governance structure. Consortia stewards should
    focus on trying to reduce those kinds of frictions. One way to enable other companies
    to get involved is to make their entry into the network easier with less friction.


    In the case of State Farm, as Dustin Helland explains, “One of the ways that we’ve
    enabled other insurers to get involved easily and with low entry investment is
    through a beta test. So this involves us providing the other insurance company
    with access to a node where they can exercise the application and run through
    some test scenarios with us. We also provide them with a full copy of the code,
    if they’d like to, where they can stand up their own node on their own and work
    through those same test scenarios.”[63](#juu2ljsj.html#mvas0d8ryy4)


    These actions make the newer members of the consortium feel welcome and start
    them on the right footing.


    #### **Choice of Right Partners to Start With**


    There is a need to find other industry players that would be willing to participate
    in an experiment. Choosing the right partners to start with can be pivotal in
    the initial success of the effort. Bringing together the right partners is an
    essential start in the journey of a consortium. Early on in the life cycle of
    blockchain technology, when there are not many players involved in the blockchain
    ecosystem, it can be even more challenging.


    Siam Central Bank appreciated this factor as they started on their journey with
    blockchain. As Orapong explained, “We started this in late 2017. At that point,
    there were not that many players. So, we have to assess because we’re about to
    do something that is quite new and not stable yet—who could be the best partner?
    And who would be able to support us?”[64](#juu2ljsj.html#mvas0d8ryy5)


    SCB understood that what they were attempting to do was very new and shaky with
    instabilities as the technology itself was evolving. They started working with
    Siam Cement Group (SCG), which is a manufacturing conglomerate. It is one of the
    largest companies in Thailand ($15 billion USD). It is also recognized as one
    of the most efficient and innovative companies in Thailand, winning several quality
    awards. 


    “If you are going to prove that new technology works, you better start from the
    top. If you can make the best company the most efficient company by improving
    their productivity, then you know what you have works,” confirms Orapong.[65](#juu2ljsj.html#mvas0d8ryy6)


    #### **Participatory Decision-Making**


    Blockchain technology brings to the fold a distributed nature to the data. It
    also allows the consortia members to have shared control of the data without any
    specific entity having complete control. Translating that further into the governance
    model of the consortia helps further solidify the confidence of network participants.
    The governance should be structured such that the participants can decide together.


    ![](mvas0d8ryz1.jpeg)


    As Silvia Attanasio (whom we will meet in more detail in the next chapter) from
    ABI explains, “Our mission is to put the banks together and let them decide together. . . .
    We have a metaphor that guided the project from the very beginning, which is this
    group of soldiers who are very organized, who step together, who go on together,
    who protect each other. So we needed to work at the same time, to work always
    in a synchronized way. And this was really important.”[66](#juu2ljsj.html#mvas0d8ryy7) That
    should be the guiding principle for the consortium. With that spirit, the consortium
    steward is more of a facilitator. Things like the companies’ size or being a founding
    member should not matter as they are equal participants.


    This approach can slow down things regarding decision-making. And that’s a delicate
    balance that the consortium has to tread—the speed of decision versus building
    confidence in participants for continued participation. As Deloitte’s 2020 blockchain
    survey found, many consortia that begin with good intentions often fail because
    of infighting and perceived inequities over different issues. [67](#juu2ljsj.html#mvas0d8ryy8)


    #### **Timing of Monetization**


    Very early on in the life of consortium, you are getting the network members to
    come together. At that time, you have to be thoughtful about who is getting value
    at each of the different maturity stages. The monetization decisions of the consortia
    should take into account the network member’s willingness to pay. In the case
    of the Synaptic Health Alliance (Chapter 2), should you charge the doctors and
    insurance companies to participate in the business network? The answer to that
    depends on who is getting the value from the network. 


    The value proposition for the insurance company is apparent because insurers are
    legally required to maintain physician data. On their part, they are trying to
    figure out ways to collaborate to make their provider data accurate and do that
    with a lower cost of maintenance. However, the doctors have the associated load
    of completing the paperwork for the insurance companies. Their pain of administrative
    burden in dealing with multiple insurers will surely go down. However, will it
    be enough that they will be willing to pay to join the network? That is not such
    a strong proposition.


    As Stephanie Hurder suggests, “I think you really need to understand, what are
    the costs and benefits that the different types of stakeholders are getting? And
    what is their outside option for not participating?”[68](#juu2ljsj.html#mvas0d8ryy9)


    To further mature the Synaptic Health solution, it would be beneficial to the
    whole ecosystem if the providers can self-serve and contribute to the data. The
    goal here would be to get more and more physicians onboard the system. And suppose
    the initial monetization strategy charges them to come on board to provide data
    for this use case. In that case, you are creating more friction for the network
    adoption as a whole. Instead, the network might be served better by looking to
    monetize with the doctors on a subsequent use case, which has a more compelling
    value addition for the doctors. When you develop your early monetization strategy,
    you focus more on the insurance companies because the value they are getting is
    clear and obvious. 


    This chapter looked at a few things that consortium members can do to make for
    a stronger partnership. Next, let us look at steps on the project level that others
    have taken to make their blockchain journey a success.


    * * *'
