    正如 Jon Kuiper 所解释的：“我们正在为这些电子 CMR（国际货物运单）文档提供基础设施。当然，这是区块链，它是不可篡改的，是一份法律文件，我们可以将其提供给行业相关者，因为标准已经从政府和监管角度进行了定义，并将在未来几年在欧洲所有国家实施。……我们认为它非常强大，因为回到欺诈讨论，对于发货人员来说，电子
    CMR 具有法律效力，而且不是基于纸质的而是电子文档，这非常重要。”84


    当我与 Jesús Pizarro 讨论标准问题时，他评论道：“我喜欢与 IBM Food Trust 合作的原因是 IBM 正在使用国际标准。”Jesús
    是国际援草组织（Heifer International）的金融创新副总裁。他正领导 Heifer Lab 针对农业发展和金融包容的区块链产品战略。国际援草组织是一个国际国际非政府组织，其使命是在消除世界饥饿和贫困的同时保护地球。


    国际援草组织正在利用区块链来加速其使命，即在照顾地球的同时结束饥饿和贫困。在他们开始使用区块链时，他们规定了自己的愿景：在农业领域建立一个区块链网络，让农民能够获得运营资金、技术支持和公平市场。他们的方法是与政府、大学和其他组织合作。


    国际援草组织与其他伙伴合作利用区块链快速推进他们的使命。他们参与了供应链中的三个不同项目：家禽、可可和咖啡。在家禽领域，他们正在以太坊上工作。对于咖啡和可可，他们正与
    IBM Food Trust 和国际开发银行（IDB）合作开展其他项目。


    国际援草组织希望利用区块链来提高市场透明度。在农业领域，小农户是隐形的，而消费者是盲目的。消费者不知道食物从哪里来，也不知道它是如何准备的。而我们作为消费者，当然对小农户一无所知。小农户在了解产品消费情况的可见性方面也面临同样的情况。对于国际援草组织来说，区块链提供了透明的可能性，这最终将改善市场。


    在国际援草组织处理各种区块链项目的过程中，除其他外，他们学到的重要教训之一就是标准化过程。正如 Jesús 向我解释的：“问题之一在于，我们还需要对标准进行标准化。即使你使用
    `GS1`，你会发现 `GS1` 也是非常灵活。实施标准有不同的方法。为了让区块链项目成功，我们需要使用相同的标准。我会说这是学到的最重要的教训。”


    当然，让区块链之旅成功的因素还有很多。由于区块链的本质以及由于它正处于发展的非常早期阶段，有几点是区块链所独有的。本章帮助我们查看了其中的某些特殊之处。


