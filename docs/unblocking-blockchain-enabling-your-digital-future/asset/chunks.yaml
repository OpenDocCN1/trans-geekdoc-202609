    # 解锁区块链

    *赋能你的数字未来*


    ISBN 978-1-63676-828-1 *平装本*

    ISBN 978-1-63730-214-9 *Kindle 电子书*

    ISBN 978-1-63730-272-9 *电子书*


    *献给 Anubha，她让这一切成为可能*


    ## 目录


    ## 引言


    想象一下，你想卖假药。你会如何做呢？你可以从制造看起来像品牌药的药片开始，使其具有相同的颜色、形状和标记。由于这是一场造假活动，不需要在实际药品成分上花费大量金钱。你只需要说服买家你的药片没有问题。当然，如果药物没有出现在适当的包装中，买家会认为出了问题。但这个问题很容易解决。只需将你的“品牌”药片包装在与原装匹配的盒子里即可。


    现在你已经创建了产品，你需要在不被抓获的情况下将其卖掉。为什么不在世界的某个偏远角落开一家在线药店呢？那里没有有效的药物监管，远离监管机构的触及。随着世界应对一场在全球范围内导致数千死亡的流行病，一个成熟且全新的机会出现了。随着疫苗和其他疗法的开始推出，人们寻找所有可能的途径获取它们是合逻辑的。


    现在，假设你的工作是阻止造假者。找到他们将是一项艰巨的任务。你会如何做呢？你可以从从各种市场购买药品样本，对其进行测试以确保它们含有正确的成分，并对不符合要求的药品进行标记。考虑到假药在
    1.2 万亿美元的市场中占据了 2,000 亿美元，你可能没有时间或资金来抓住大多数坏人。发现有害药物只是解决该问题的一步。你该如何找到它们的源头，以便从根上解决问题呢？


    你面前将面临一项艰巨的任务。但也许有更智能的方法。如果你不需要监管所有的在线药店呢？如果你能赋能买家让他们知道自己何时成为欺诈受害者呢？如果你能给他们一个工具来监管自己的购买，并知道何时有人试图向他们卖假药呢？区块链可能为你提供答案，它让你能够确定地验证药片是谁制造的。


    FarmaTrust 正在尝试这样做。为了应对医药供应链中的某些挑战，FarmaTrust 引入了基于区块链的解决方案。该解决方案的一个方面关注于药品追踪和数据服务。该解决方案为产品从制造商到消费者的过程提供了急需的可见性。它有助于确保数据不被篡改。


    ## 为什么要使用区块链？


    开始使用区块链而非现有技术的关键在于：由于数据未被损坏而能够对系统感到放心、多个控制器有助于检测更改数据的尝试、安全的数据存储以及使用信任数据进行自动化。结合所有这些方面使得更高效的运营、降低成本并产生新价值成为可能。


    确实存在额外的复杂性，因为从中心化世界转向去中心化世界涉及到转变。我们太习惯于办事的中心化本质，任何不同的事情似乎都是增加了复杂性。区块链格局不断演变因为它因为它项新兴技术。关于它的速度、可扩展性、缺乏标准、不同区块链之间的互操作性以及监管不确定性都存在开放的问题。用户将需要逐渐适应这种去中心化范式的陌生感。转向信任数据的转变不会是一个轻松的过渡。


    一旦所有参与者都感到适应，机会将会爆发。一旦他们理解没有人可以更改数据，并且数据可以以这种方式保持安全，区块链的真正潜力就会释放出来。


    正如 FarmaTrust 的 Najib Rehman 所说：“我们可以与你合作，并向你展示差异。我们想做的是与你现有的技术并行工作。然后，当你看到区块链分布式特性的真实价值时，这意味着你可以信任不可篡改的数据。届时你就会明白为什么在某个时刻你可能想要关闭旧的东西并完全迁移过来。”


    《解锁区块链》是对这一转折点的探究。


