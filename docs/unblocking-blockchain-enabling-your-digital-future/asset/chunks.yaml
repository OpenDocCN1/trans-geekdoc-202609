    ## 内部创新与社区


    除了公司外部的社区建设，在公司内部投资探索区块链各种用例的创新团队也将产生深远影响。将他们组织成实践社区或卓越中心。正如我们在第 4 章中中学到的，为了应对行业挑战，苏格兰皇家银行（RBS）很早就发现了区块链的机遇。而且他们准备好在初期投入一些预算来尝试和测试区块链，这在当时是一个新兴的新事物。


    在非常早阶段，他们就让工程团队研究这项技术并逐渐熟悉。随后情况发展到一个程度，即已经有足够的用例来证明建立一个以区块链为核心、拥有卓越中心的实践社区。


    “对于任何处于旅程早期或开始将区块链项目商业化的组织，这将是我能给他们的首要建议。你会看到不同的技术阵营坐那里并说：‘我喜欢 iPhone；我喜欢三星。’你对区块链技术也会有同样的观点，”安德鲁·斯皮尔说道道。


    ## 航行旅程


    在区块链之旅之初，贵公司对新技术的商业化理解非常有限。让一个专注于区块链技术的集中职能部门来运营，有助于更稳健地评估用例。这还将帮助你们在开始区块链之旅时识别出应该追求的正确用例。州州（State
    Farm）从 2016 年开始关注区块链。正如达斯汀·海兰（我们在第 4 章中介绍过他）所解释的：“我们很快就能发现，比特币底层的区块链技术应用范围比比加密货币广泛得多，我们在创新领域建立了一个小组，来优先考虑并探索潜在的机会。”


    由于你正在与竞争对手合作，因此你对区块链项目需要一种新的组织思维方式。一种以教育和协作为引领的方法会有帮助，而社区可以协助整个过程。对于州州来说，最初，团队专注于跨多个业务线的工作——例如，理赔部门、核保、金融服务等部门的领域专家——向他们介绍该技术的能力。他们还致力于识别和评估州州认为可能具有价值的任何潜在用例。


    随后，重点转向了学习，通过将一些已识别业务机会与某些开发团队对齐，并创建了早期原型。最终，他们进入了一个基于技术进行产品交付和业务价值价值的阶段。这些努力中产出的旗舰项目是与
    USAA 合作构建的自动理赔代位（Auto Claims Subrogation）。


    ## 变革者的角色


    除了社区，还需要一个变革者，他可以是公司内最早一批宣扬新兴技术的人之一。如果他们能在组织内赢得信任并具备专业知识，将非常有帮助。他们需要是理解这项技术以及它能实现什么的的领域专家。区块链技术深入到组织的架构底层。花时间传播区块链的福音至关重要。


    正如 PCCW 的沙哈·斯蒂夫（Shahar Steiff）向我指出的那样，让高层对项目提供支持将会有帮助。清晰愿景的沟通将产生巨大影响，这需要耐心和坚持来完成。


    “对于大多数参与者来说，这不仅仅是技术的演变；它是公司内部的某种革命。今天的电信运营商和云提供商意识到，他们不再是在提供服务；而是在提供一种环境和体验。他们正在变成技术公司。要把一家传统的电信公司转变为技术公司并不容易。这需要完全的心态转变。这需要由管理层驱动，”沙哈解释道。


    ## 案例研究：PCCW 与 CBAN


    Shahar Steiff 一直领导 PCCW Global 开发基于区块链的平台，以支持自动化服务生命周期。PCCW Global 是领先的通信服务提供商，参与了通信业务自动化网络（`CBAN`）。`CBAN`
    是由电信行业领导者组成的网络，围绕新兴技术进行协作，以造全球运营商生态系统。正在进行的计划之一是区块链辅助的自动结算。


    消费者通常将电信行业视为一个单一实体。尽管为了提供跨国服务，有多个运营商需要在幕后共同努力。数据流量在到达消费者的设备之前，必须从一个运营商的基础设施流到另一个。当你我作为用户拨打电话时，我们向电信公司支付所提供服务的费用。反之，我们的电信公司向电信供应链上的各种信息和通信技术（ICT）提供商付费。这条电信供应链最终建立了从一个国家的电话到另一个国家电话的端到端连接。ICT
    提供商完成了所有这些交易的结算。我们作为消费者，看不到幕后发生的情况。


    ## 传统结算流程


    为了激活服务我们（消费者）的业务关系，两家 ICT 公司通常会签署一份主服务协议（`MSA`）。这些协议通常仍通过手动完成。`MSA` 定义了他们关系的条款和条件。根据这些协议，为客户提供服务时会配置报价。在了解客户需求、设计解决方案、提交报价并确保订单后，将设置服务交付。这种交付时间可能从几秒钟到几个月不等。只有在服务交付设置完成后，数据才能开始流动以服务客户。


    当客户开始使用服务时，所有数据使用情况会被记录，电信提供商生成发票。当运营商验证提交给他们的发票费用时，通常会发现收费错误。差异可能是由于各种原因，如时间服务计算错误或使用了错误的率。在识别出这些争议后，他们进入争议解决流程以结算金额。实际时间差异很大，但大约需要三个月才能运行。从他们提供服务到发票结算后收到付款，大约需要八周。这些延迟的时间主要是由于涉及的手工过程；它们降低了公司的利润能力并造成了负面的客户体验。


    ## 区块链驱动结算


    通过区块链辅助的自动结算，由于记录不匹配导致的争议被消除了。使用情况通过区块链实时测量和比较，极大地减少了差异的可能性。总之，他们可以将报价流程的时间从几天缩短到几秒钟。服务交付周期从几个月缩短到分钟。流量测量和对账从几天缩短到几秒钟。结算本身也从几周缩短到几秒钟。总体而言，他们实现了成本降低、流程加速，并能够从他们无法提供的服务中建立新的收入来源。


    '
