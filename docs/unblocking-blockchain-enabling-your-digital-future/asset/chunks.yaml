    # 引言


    如果你观察那些发布的新闻稿，很难判断其中有多少是营销炒作，又有有多少是现实。所有成功的试点项目都能顺利迁移到生产环境并规模化运行吗？所有这些成功的概念验证——它们背后是否有有效的商业案例支持？还是说，它们只是为了勾选“区块链热词”这一复选框，并以此安抚投资者和股东？这种叙述中包含了许多冲突点。


    当我作为一名年轻的商业顾问开始职业生涯时，我也面临着类似的问题。那时，企业资源计划（ERP）技术正准备通过其在不同公司部门间实现共享现实视图的承诺，来彻底改变公司。而现在，我们又在这里了，区块链也出现了，它承诺在多家通常相互竞争的公司之间实现共享的现实视图。所以，一个“ERP
    之 ERP”？也许吧。


    我写这本书是为了向那些提出同样问题的业务和技术领导者分享我的见解。我希望帮助他们为自己的组织指辟这些未知的区域。


    ## 在书中，你将了解到你的公司采用 `blockchain` 的历程可能是什么样子的。你开始尝试这项技术并花一些时间了解它，决定要追求的用例，并运行概念验证。在这个过程中，你会意识到
    `blockchain` 是一项团队运动，要取得成功，你需要与他人共同努力。让更多的人加入构建网络并让他们围坐在桌旁，这让工作变得非常困难。我们还讨论了如何应对典型的挑战。然后，我们查看了供应链领域在使用
    `blockchain` 进行的一些高级工作，以及它与其他新兴技术的结合。


    成本书制定了一个框架，指导你的公司如何经历其 `blockchain` 采用历程。由于借鉴了早期采用者的真实经验，这本书揭示了帮助公司领导者处于 `blockchain`
    演变中心的实践。这些教训将帮助你通过使用 `blockchain` 创建价值来设计业务战略，并为你的业务模式可能发生的任何中断做好准备。


    如果你发现自己正处于这种听过 `blockchain` 但好奇它到底是什么，以及是否应该投入时间和精力的去进一步了解它的阶段，那么我邀请你与我一起开启这段旅程。我希望你能学到一些新东西——也许不是你预想中的那些，但无论如何都是新的。


    当你阅读这本书时，你将发现 `blockchain` 作为业务新型操作系统的潜力，它提供了一个基础设施层并帮助我们安全地交换价值。通过这本书，我希望分享我对这种名为
    `blockchain` 的社会技术现象的热情和兴奋。最终，我希望这本书帮助你在 `blockchain` 重塑你的竞争格局时，保持在创新的前沿。


    我希望这本书让你对 `blockchain` 所提供的一切感到兴奋，并让你最终决定投入其中大展身手，而不仅仅是伸脚试水测试。


    这是一本写给想要利用 `blockchain` 技术驱动业务价值的领导者读的书。《解锁区块链》（*Unblocking Blockchain*）将帮助公司领导者理解
    `blockchain` 能为他们的业务做什么，并让他们准备好与技术同仁进行有意义的对话。这本书也将帮助技术领导者理解 `blockchain` 的可能性，同时努力为公司的技术基础提供面向未来的保障。


    我邀请你加入我开启这段*解锁区块链*的旅程——这是一段发现当下可能以及未来可能性的旅程。


