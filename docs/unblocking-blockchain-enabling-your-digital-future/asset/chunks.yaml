    # 开放 vs 封闭

    这定义基于谁可以从区块链中读取数据。开放式区块链允许公众消费数据。封闭式区块链则通过权限控制访问。


    # 许可型 vs 无许可

    这一方面由基于角色的访问定义。许可型区块链具有原生能力，可以追踪和管理访问区块链的实体身份。


    根据普华道（aPricewaterhouseCoopers）关于企业如何管理区块链的调查，公司正在采用两种方法；40% 的公司使用许可型区块链，34% 的使用无许可链，26%
    的采用混合方法。78


    ## 用例考量

    通过对用例进行考虑，公司将决定采取何种路径。


    Coadjute 最初通过参与英国土地注册局（UK Land Registry）的采购流程开始工作。他们意识到“对于政府用例，由加密货币支持的公共平台实际上不可行的。数据需要位于英国。”79


    对于 `SCB` 而言，他们需要探索的一个重大决策是：你们是要使用私有区块链网络还是公共区块链网络？决定因素是交易双方的可见性。正如 Orapong 所解释的，“在采购到付款的应用中，你通常处理的是一个闭环——有限数量的供应商和有限的买家。你甚至无法识别出是谁执行了交易。但在交易中看到信息本身就是一个风险。如果你看到了价格，即使你不知道是谁买了那个产品，但如果你看到了不同的价格并看到了一笔买入，就会产生交易问题。这就是为什么我们首先评估：我们要用公共区块链吗？我们要用私有区块链吗？最后我们决定用私有区块链。”80


    对于 `Optum` 来说，管理技术政治和对代币化的支持是决定采用公共区块链网络的驱动因素。“小凳子有三条腿：政治、经济和技术。如果你决定建立自己的网络，你就必须同时处理这三个问题。如果你决定搭乘公共
    `Ethereum` 的便车，并且你可以有一个可以在上面运行的用例，那么你实际上消除了许多关于网络实际执行的政治问题。而且已经存在网络效应。因此，将每个私有许可区块链尽可能快地转向公共许可区块链具有巨大的优势。”这就是
    Tony Little 向我解释的方式。


    在选择技术时，将资金和时间的投入作为标准是有意义的。不同参与者对协议的资金投入，以及开发者在构建协议上的时间投入，意味着了一个稳健的生态系统。这可以帮助你将你的技术栈连接到经过验证的技术上。如果协议支持代币化，它将帮助你将数据视为资产，并可以作为驱动你们联盟的微交易的基础。否则，你将不得不使用第三方，并为联盟的经济增加交易成本。“我认为今天外面正在进行大量工作，但最终都化为乌有，因为他们没有考虑到这种多维性，”Tony
    解释道。


    State Farm 同样考虑了多种区块链协议。正如 Dustin Helland 所解释的，“早初我们确实查看了公共区块链的一些功能，但像大多数大型企业一样，我们很快锁定了对隐私和保护的需求。”81


    State Farm 正在使用 `Quorum`，它允许创建一个基于 `Ethereum` 的私有许可企业区块链。这是一项最初由摩根大通发布并治理的开源技术。`Quorum`
    允许在 `Ethereum` 网络内进行许可网络和私有交易，因此他们在解决方案中未使用公共 `Ethereum` 网络。在决定特定的区块链网络时，他们考虑了几个关键因素。


    首先，他们需要许可型区块链，因为交易隐私对他们至关重要。其次，他们考虑了评估时不同平台的成熟度。让他们对 `Ethereum` 放心的一点是它已经在公共网络中采用了相当长时间。第三，他们还听取了开发者的意见以理解开发者的观点。开发者更倾向于在什么平台上工作？开发者会考虑不同的因素，如可用文档以及个人、公司之间的贡献等。


    一个值得注意的方面是三个领先平台的可用架构如何影响了他们的决策。对于 `Corda` 和 `Hyperledger`，架构允许存在主节点，主节点可能拥有权力和权威。而在
    `Quorum` 中，每个节点具有相同的权限。当 State Farm 开始该项目时，选择 `Quorum` 提供的架构是关重要的。


    ## 创意性资金策略

    对于没有明确 `ROI` 的新兴技术，资金始终是一个问题。你可能需要采取创意来让项目启动起来。都柏林市的 Doug McCollough 充分清楚公共领域资金的匮乏。创新项目并没有多少资金。公共部门的项目环境也非常规避风险。


    公共部门并不是使用初创公司原则和敏捷开发、迭代过程等现代 IT 实践，其方法是拥有完全构型且符合预算的想法。这种方法有助于获得预算分配。之后，重点是项目的成功，而不是实验创新技术。正如
    Doug 解释道，“我们没有很多资金。这些创新的项目没有资金。所以你得与人合作，建立公私合作伙伴关系，并探索一种非常低预算的实验。这就是为什么我们以一种非常有限的方式做了概念验证。”82


    在 `Coadjute` 的案例中，这完全是一次共同的努力，所有参与者都做了贡献。同时，`Coadjute` 利用自己的资源构建了核心平台。正如 John
    Reynolds 所解释的，“这确实是一种协作努力。如果任何一个组织尝试独立完成，这将是一个非常昂贵的项目。但当你把项目成本分摊到大约 40 家公司时，它是负担得起的。”83
    这形成了一种非常去中心化的资金模式，非常符合区块链的去中心化精神。


    ## 数据标准

    数据标准将对项目如何迈向成功起到重要作用。如果存在现有的行业标准，最好采用它们而不是重新发明轮子。对于 `FVL` 领域的 Jon Kuiper 和 `Vinturas`
    来说，该行业有着散落在各处的多个昂贵 `EDI` 连接的历史，这导致了交易过程中缺乏标准。


    他们关注的是交货单（`CMR`），这是用于移交车辆的文档（例如从运输公司移交给经销商），它通常是纸质且手写的。他们依赖于经大多数欧洲国家批准并由监管机构创建的电子
    `CMR` 协议。从防欺的角度来看，在区块链上提供此文档变得至关重要。


