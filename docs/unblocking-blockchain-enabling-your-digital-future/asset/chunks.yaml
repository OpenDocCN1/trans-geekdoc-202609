- fmt: "\nIoT collects all the data, and AI consumes it to get insights and make intelligent\
    \ decisions about how to act upon that data. Today, much of AI is like a black\
    \ box. With a blockchain backbone, AI will be getting clean data that has not\
    \ been tampered with. Inherent attributes of blockchain can help AI produce a\
    \ report card showing how data was used. An audit trail can be created from the\
    \ time data is ingested to train the AI models. It can also include the provenance\
    \ of data on how AI came with the predictions. This increased visibility will\
    \ help users get assurances that AI is operating within design parameters and\
    \ increase trust in the AI models.\n\n“Data is just like crude. It’s valuable,\
    \ but if unrefined, it cannot really be used. It has to be changed into gas, plastic,\
    \ chemicals, etc. to create a valuable entity that drives profitable activity;\
    \ so must data be broken down, analyzed for it to have value.”[87](#uauddjkp.html#mvas0d8ryvf)\
    \ Taking that line of thought one step further—if data is the new oil, then that\
    \ data on a blockchain is cleaner and will require less processing. That makes\
    \ the overall system more efficient. \n\nIntegrated solutions with a convergence\
    \ approach using blockchain technology in conjunction with other emerging technologies\
    \ like the internet of things (IoT) and artificial intelligence (AI) has the potential\
    \ to open new doors for value creation. Some attempts are being made toward the\
    \ convergence of these emerging technologies and the emergence of machine economy.\
    \ Let’s take a look at one of them.\n\n## Bosch Global and the Economy of Things\n\
    \nBlockchain can provide the trust layer to help IoT devices move away from collecting\
    \ and communicating the data to devices that can participate in transactions as\
    \ independent entities in the economy and as economic citizens. “An economy with\
    \ an Internet of Things”—that’s the push that Bosch industries are banking their\
    \ efforts on.$[88](#uauddjkp.html#mvas0d8ryvg) The economy of things is an evolution\
    \ of the internet of things that enables devices to participate in an economic\
    \ transaction by their own choice.\n\nRaghavendra Kulkarni has been working at\
    \ Bosch on incubating businesses using emerging technologies like blockchain to\
    \ develop new revenue streams. As he puts it, ”Internet of things is all about\
    \ the connecting of the physical and the digital world.”[89](#uauddjkp.html#mvas0d8ryvh)\n\
    \nThe situation of connected devices has commoditized the role of hardware in\
    \ the ecosystem. Devices have been relegated to the collection and transfer of\
    \ data. And that’s it. With the economy of things, the devices can provide added\
    \ value as economic participants in the network. Devices become an integral part\
    \ of the value chain instead of the collector and communicator of information,\
    \ and blockchain is the very technology enabling that development.\n\nThat participation\
    \ starts with providing these devices with autonomy. Bosch, as a company, has\
    \ done a lot with the use of sensors. They derive services from sensors and put\
    \ the sensor information into the software. For now, IoT devices with these sensors\
    \ help automate the physical world around us. But suppose we have to give these\
    \ devices autonomy, i.e., enable them to make decisions on their own. In that\
    \ case, components of blockchain have the role of a catalyst in achieving that.\
    \ Blockchain will help us move from smart connected devices to economic devices.\n\
    \nThis will help enable the economy of things, i.e., an autonomous device with\
    \ a business model around them. And that gives “things” a choice in deciding whether\
    \ it makes sense for them to participate in an economic transaction. As Raghavendra\
    \ put it, “Internet of things is not just about the technology, it is about the\
    \ data and the value created.”[90](#uauddjkp.html#mvas0d8ryvi)\n\n## The Case\
    \ of Data Marketplaces\n\nAll the IoT devices create numerous possibilities for\
    \ the machine economy. Blockchain can enable individuals to have an immutable\
    \ record of their data. Envision people having a digital vault that contains their\
    \ identity along with their patterns: activity patterns by fitness trackers, media\
    \ consumption patterns by content providers, driving behavior by cars, medical\
    \ records with interaction with the health system, etc.\n\nWe can be custodians\
    \ of the data in a secure manner. We can then access this hyper-granular data\
    \ as we choose. Now, if Rahul wants to go to a bar, the only needed data is: Is\
    \ Rahul over twenty-one? Yes or No. There is no need to produce the driver’s license\
    \ revealing the date of birth, address, and organ status. All that information\
    \ is not relevant to the transaction and does not need to be divulged. Not only\
    \ people but objects, like IoT devices, can also have their vaults. \n\nBosch\
    \ has implemented a data marketplace for the provenance of milk with TrueFood+.\
    \ One aspect of the solution tackles milk production and the farmer ecosystem.\
    \ The concept is dubbed “Crypto-cow.” With `Crypto-cow`, a farmer can record and\
    \ advertise different data points for a cow’s entire life cycle in a blockchain-based\
    \ data marketplace, e.g., amount of milk produced, milk production forecasting,\
    \ etc.\n\nAll the farmer ecosystem participants who sell to the farmer, like veterinary\
    \ doctors, insurance companies, cooperative societies, equipment manufacturers,\
    \ seed manufacturers, etc., are the consumers of this data. Based on the information\
    \ shared in the data marketplace, these participants can offer services to the\
    \ farmer. For instance, the veterinarian can look at milk forecasting and advise\
    \ on possible medical interventions or changes in feed needed for the herd to\
    \ influence the forecast. The financial ecosystem can look at various data points\
    \ like the herd’s health, milk forecast, etc. Based on this data, they can offer\
    \ alternative financial products. The farmer provides the data and, in turn, receives\
    \ proactive input from advisors.\n"
  raw: 'IoT collects all the data, and AI consumes it to get insights and make intelligent
    decisions about how to act upon that data. Today, much of AI is like a black box.
    With a blockchain backbone, AI will be getting clean data that has not been tampered
    with. Inherent attributes of blockchain can help AI produce a report card showing
    how data was used. An audit trail can be created from the time data is ingested
    to train the AI models. It can also include the provenance of data on how AI came
    with the predictions. This increased visibility will help users get assurances
    that AI is operating within design parameters and increase trust in the AI models.


    “Data is just like crude. It’s valuable, but if unrefined, it cannot really be
    used. It has to be changed into gas, plastic, chemicals, etc. to create a valuable
    entity that drives profitable activity; so must data be broken down, analyzed
    for it to have value.”[87](#uauddjkp.html#mvas0d8ryvf) Taking that line of thought
    one step further—if data is the new oil, then that data on a blockchain is cleaner
    and will require less processing. That makes the overall system more efficient. 


    Integrated solutions with a convergence approach using blockchain technology in
    conjunction with other emerging technologies like the internet of things (IoT)
    and artificial intelligence (AI) has the potential to open new doors for value
    creation. Some attempts are being made toward the convergence of these emerging
    technologies and the emergence of machine economy. Let’s take a look at one of
    them.


    #### **Bosch Global and the Economy of Things**


    Blockchain can provide the trust layer to help IoT devices move away from collecting
    and communicating the data to devices that can participate in transactions as
    independent entities in the economy and as economic citizens. “An economy with
    an Internet of Things”—that’s the push that Bosch industries are banking their
    efforts on.[88](#uauddjkp.html#mvas0d8ryvg) The economy of things is an evolution
    of the internet of things that enables devices to participate in an economic transaction
    by their own choice.


    Raghavendra Kulkarni has been working at Bosch on incubating businesses using
    emerging technologies like blockchain to develop new revenue streams. As he puts
    it, ”Internet of things is all about the connecting of the physical and the digital
    world.”[89](#uauddjkp.html#mvas0d8ryvh)


    The situation of connected devices has commoditized the role of hardware in the
    ecosystem. Devices have been relegated to the collection and transfer of data.
    And that’s it. With the economy of things, the devices can provide added value
    as economic participants in the network. Devices become an integral part of the
    value chain instead of the collector and communicator of information, and blockchain
    is the very technology enabling that development.


    That participation starts with providing these devices with autonomy. Bosch, as
    a company, has done a lot with the use of sensors. They derive services from sensors
    and put the sensor information into the software. For now, IoT devices with these
    sensors help automate the physical world around us. But suppose we have to give
    these devices autonomy, i.e., enable them to make decisions on their own. In that
    case, components of blockchain have the role of a catalyst in achieving that.
    Blockchain will help us move from smart connected devices to economic devices.


    This will help enable the economy of things, i.e., an autonomous device with a
    business model around them. And that gives “things” a choice in deciding whether
    it makes sense for them to participate in an economic transaction or not. The
    device can make decisions based on its resources and its availability by broadcasting
    whether it is open for business or not.


    As Raghavendra put it, “Economy of things is not just about the technology of
    connected \[devices\] or the technology of blockchain. But once you make them
    participate in the transaction, participate in the business models, participate
    in settling of the business models is where the economic things would come into
    picture.”[90](#uauddjkp.html#mvas0d8ryvi)


    #### **The Case of Data Marketplaces**


    All this data produced by IoT devices creates numerous possibilities beyond simply
    enabling the machine economy. We should keep in mind a few things for the data
    produced by all the IoT devices. The sheer quantity of data produced is a mix
    of structured and unstructured data. Due to this, a lot of that data ends up being
    noise. Data is also temporal in nature and has a short shelf life. Its usefulness
    slowly degrades if it is not promptly analyzed.


    We need to have a clear data strategy to make good use of all that data. That
    means knowing what data you need and how much of it you need. The collected data
    needs to be stored privately with the proper access controls in place. With appropriate
    access controls, the rightful owners of the data can monetize it. Today, people
    are given charge of their data to some extent. Still, it is also being copied
    and used by the companies with which they interact. There is no genuine appreciation
    of that data’s value and how other actors are using it.


    The creation of cleaner and more organized data using blockchain will allow for
    the emergence of new data marketplaces. Blockchain can enable individual entities
    to be custodians of their data because it is an immutable record that no one has
    to regulate. Envision people having a digital vault that contains their digital
    identity along with their behavior patterns: activity patterns collected by fitness
    trackers, media consumption patterns collected by content providers, driving behavior
    collected by cars, medical records collected with interaction with the health
    care system, etc.


    We can be custodians of the data in a secure manner. We can then access this hyper-granular
    data and provide access as we choose. Now, if Rahul wants to go to a bar, the
    only needed data is this: Is Rahul over twenty-one? Yes or No. There is no need
    to produce the driver’s license revealing the date of birth, address, and organ
    donor status. All that information is not relevant to the transaction and does
    not need to be divulged. Not only people but objects, like IoT devices, can also
    have their vaults. With these vaults, data becomes an inherent part of every actor
    in the economy.


    Bosch has implemented a data marketplace for the provenance of milk with TrueFood+.
    One aspect of the solution tackles milk production and the farmer ecosystem. The
    concept is dubbed “Crypto-cow.” With Crypto-cow, a farmer can record and advertise
    different data points for a cow’s entire life cycle in a blockchain-based data
    marketplace, e.g., amount of milk produced, milk production forecasting, etc.


    All the farmer ecosystem participants who sell to the farmer, like veterinary
    doctors, insurance companies, cooperative societies, equipment manufacturers,
    seed manufacturers, etc., are the consumers of this data. Based on the information
    shared in the data marketplace, these participants can offer services to the farmer.
    For instance, the veterinarian can look at milk forecasting and advise on possible
    medical interventions or changes in feed needed for the herd to influence the
    forecast. The financial ecosystem can look at various data points like the herd’s
    health, milk forecast, etc. Based on this data, they can offer alternative financial
    products. The farmer provides the data and, in turn, receives proactive input
    from advisors.


    Besides being a data marketplace, TrueFood+ also helps the farmer showcase their
    sustainability practices by providing an immutable record of that data. This industry
    has a high focus on sustainable practices, e.g., water consumption, kinds of feed
    used, well-being of the herd, etc. The use of blockchain as a component of the
    overall solution helps the farmer provide legitimate records of livestock maintenance
    practices.'
