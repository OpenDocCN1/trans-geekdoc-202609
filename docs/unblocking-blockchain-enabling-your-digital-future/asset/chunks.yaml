    \ Your Peril.”\n\n88 87 85 91 86 89 \n\n# Chapter 9   \n\nBlockchain in Supply\
    \ Chain\n\nAs per the research done by MarketsandMarkets, the blockchain supply\
    \ chain market will be worth $3.2 billion by 2026 and grow at a compound annual\
    \ growth rate (CAGR) of 53.2 percent during the forecast period.[92](#r5xklr8a.html#mvas0d8ryuh)\
    \ With its use in several global supply chain initiatives, blockchain technology\
    \ is showing promise to solve some issues with managing global supply chains.\
    \ However, the success with the use of the technology has been varied. Let’s look\
    \ at a few supply chain scenarios and what experience has shown to use blockchain\
    \ solutions in these situations.\n\n#### **Increased Consumer Pressure for Transparency\
    \ in Products**\n\n“Consumers are increasingly demanding transparency in products.\
    \ They want to know that if a product says organic, it’s really organic. Or they\
    \ want to know that if a product says that it’s a sustainable product, then the\
    \ farm that it comes from is truly a sustainable farm. Or they want to know that\
    \ the clothing they buy wasn’t made by child labor. Consumers are demanding more\
    \ transparency. This is a key factor for consumers in modern economies. Blockchain\
    \ comes here because this is where blockchain has a unique value proposition for\
    \ supply chain,” David Ritter tells me in the context of Blockchain Rice, which\
    \ we will discuss in greater depth.\n\nA 2017 transparency study done by Response\
    \ Media also supports David’s observation. Their report confirms, “Consumers are\
    \ willing to spend more on a transparent product versus nontransparent product,\
    \ with Millennial Moms and Gen X Dads willing to pay the highest price for these\
    \ products.”[93](#r5xklr8a.html#mvas0d8ryui) Their data also shows that 80 percent\
    \ or more of consumers are willing to pay more in all product categories. Fresh\
    \ foods top the list, with 92 percent of respondents willing to pay more for better\
    \ visibility in the supply chain from farm to table. They want to know all about\
    \ the source of ingredients, manufacturing, and shipping and handling of the product,\
    \ along with the sustainability, charitable, and labor policies of brands. \n\n\
    David is the CEO of Penta Solutions. Penta’s mission is to become a “universal\
    \ blockchain connector.” The goal here is to make blockchain available to a broader\
    \ audience—mass adoption. They intend to connect not only different blockchain\
    \ technologies but blockchains to existing networks like online systems, and also\
    \ blockchain technology to the off-chain, brick-and-mortar world.\n\nIn 2017,\
    \ Penta did their first at-scale deployment of a supply chain solution. It is\
    \ a traceability platform for rice in China. They worked with a state-owned enterprise\
    \ and a public company to track about thirteen million acres of rice farmland\
    \ in China’s northeast. The traceability was done up to consumers’ point of purchase.\
    \ The consumer purchases were made through [JD.com](http://JD.com), the second-largest\
    \ online retailer in China.\n\nIt was marketed as part of the product offering\
    \ for rice and called Blockchain Rice. When somebody would buy a bag of rice on\
    \ [JD.com](http://JD.com), they could scan it and see the provenance through the\
    \ whole supply chain. One of Penta’s key takeaways from this project is that people\
    \ are willing to pay about three times as much for Blockchain Rice as they would\
    \ otherwise pay for the same bag of rice.\n\nIn the Chinese consumer context,\
    \ there’s a massive problem with the adulteration of rice products. People are\
    \ concerned about the safety of buying rice at supermarkets. As David told me,\
    \ “There’s been news reports and studies have come out saying that if you buy\
    \ a bag of rice at a Chinese supermarket, it might have up to 30 percent contamination.”\n\
    \n In some cases, it might be natural additives like stones. Still, in other cases,\
    \ there’s also chemical contamination like glass particulates. We don’t know where\
    \ this comes into the supply chain. Rice is a staple of nutrition there in the\
    \ diet. So, if one of your staple products has that level of contamination, it’s\
    \ a severe issue. Interacting with the data, consumers can pay more to see there\
    \ is nothing mixed into their rice.\n\n#### **Waste in Food Supply Chains: The\
    \ Economic Impact**\n\nBesides consumer confidence, like in Blockchain Rice, contamination\
    \ also has other impacts. Food waste due to contamination has a substantial economic\
    \ impact on the apple supply chain.\n\nAs far as supply chain scenarios go, besides\
    \ the consumer-facing side of things, there are also business reasons for companies\
    \ to adopt blockchain. One is that there’s a tremendous amount of waste that happens\
    \ in the supply chain. Food waste is a huge issue. Recalls are another issue.\
    \ In the US context, in particular, there are many recalls, e.g., those related\
    \ to E. coli outbreaks in produce or meat.\n\nPenta did a project with the largest\
    \ apple packing house out of Michigan that delivers apples to many retailers.\
    \ They were the first apple packing houses in the United States to have a recall\
    \ of apples. The purpose of the initiative was to test different sensor devices\
    \ in the supply chain. In the apple produce ecosystem, all sales are on consignment.\
    \ Nobody upstream in the supply chain gets any revenue in a recall event for that\
    \ specific supply chain. If those apples don’t sell at the retail store, then\
    \ the packing house doesn’t get paid, and the farmers don’t get paid. There is\
    \ an outsized economic impact when these recalls occur."
