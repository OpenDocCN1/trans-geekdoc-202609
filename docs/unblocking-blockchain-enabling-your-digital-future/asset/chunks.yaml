    With a blockchain-based solution, there is no need for multiple documents in the
    P2P process. It all becomes one ledger. If there is a problem, you don’t have
    to worry whether that record can be audited and has integrity. It comes built-in
    as part of the technology stack.


    “That’s why we believe that blockchain will change the world. It will enable different
    business models. If you can conduct trades as easily as you send a text message
    or send an email today, imagine how many changes will occur in the business world
    if you can conduct the trade as easy as that.”[24](#iapjtig6.html#mvas0d8ryts)
    SCB is using blockchain because they could not use the existing technology stack
    in an economically feasible manner.


    SCB started the project in 2017, and March 2018 saw the launch of the first version
    of a proof of concept (`POC`). The `POC` proved that the solution worked. They
    started scaling it up from there and launched production with real trades in August
    2018. From there, it took them a year to scale up to one hundred suppliers.


    Initially, the progress was slower because, as happens with many IT projects,
    real-world implementation in production served up its own set of complications.
    All kinds of edge cases and exceptions showed up, e.g., someone was shipping partial
    quantities. Some goods were getting rejected due to quality. Sometimes parts were
    getting substituted, and so forth. It took them a year to identify and fix the
    exceptions. Now, they can scale at about one hundred suppliers per week. They
    have more large corporations showing interest in joining the network. When you
    see that kind of response, you know that the participants see some real value.


    ## What is that value for participants in the case of the SCB project?


    “It’s productivity,” says Orapong. He goes on to add, “If you look at the world
    today, you have multiple players. You have one big buyer, multiple suppliers,
    the buyer’s payment bank, and the suppliers’ financing banks.”[25](#iapjtig6.html#mvas0d8rytt)
    With so many players involved, with no integrations, the process becomes cumbersome.
    After the supplier submits an invoice, it might take two to three weeks to complete
    the approval. This amount of time is needed to complete a three-way match, i.e.,
    matching the invoice with the purchase order, goods receipt, and shipping document.
    After an invoice submission, there is a need for continuous follow-ups to clarify
    its receipt, handling, and processing by the buyer’s accounts payable department.
    “From the buyer’s point of view, the accounts payable department needs to spend
    a lot of time processing these documents and answering questions along the way.
    This platform solves all of this. We are able to approve an invoice within the
    same day it is submitted.”[26](#iapjtig6.html#mvas0d8rytu)


    Banks also see many benefits. As Orapong confirms, “In the past, if a supplier
    needs to finance the cash flow, they have to wait three weeks for the invoice
    to be approved, which means that for those three weeks, the bank cannot provide
    lending. Right now, we shorten this time to one day, which means a bank has three
    more weeks to provide invoice financing to the supplier.”[27](#iapjtig6.html#mvas0d8rytv)


    Because of the transparency in the solution, banks can see the trade from the
    very beginning, from the point of issuance of the `PO` to the end with the invoice
    submission. Having this increased visibility significantly reduces the collection
    risk for them, enabling them to price the financing at a lower rate because they
    don’t have to compensate for the risk. Also, they can do away with invoice financing
    processing fees because they can see the trade themselves. “With that, rather
    than providing financing at 18 percent, now you are providing it at less than
    5 percent—because of no cost and no risk.”[28](#iapjtig6.html#mvas0d8rytw) To
    drive the point home, early adopters like Siam Cement Group have reduced procure-to-pay
    process time by 50 percent and costs by 70 percent.[29](#iapjtig6.html#mvas0d8rytx)


    ## On Creating Business Value


    Another frame of reference for companies looking at emerging technology is increasing
    their profits. Profit increase comes from either increasing revenue or reducing
    costs: “What is it that we can do with this technology to benefit our business?
    And generally, technology does one of three things, in my mind. It lowers cost.
    Or it increases the speed of doing something. Or the convenience of doing something,”
    explains Tony Little. Tony is senior director of integration strategy at Optum
    (part of UnitedHealth Group) and a key contributor to the early blockchain strategy
    at Optum. For correctly using your project’s use case, he goes on to explain,
    “What problems exist, amongst a common, competitive set of companies in health
    care? In which, no company, if they solved it themselves, would have a significant
    advantage over the other? And no one company can completely solve it themselves.
    Basically, you’re looking at problems that you need to crowdsource, and everybody
    wins.” In short, you are looking for common pain or common gain among multiple
    players.


    In 2016, Optum decided to evaluate blockchain technology. The team’s first order
    of business was to understand blockchain basics and do an evaluation to clearly
    understand the beast—what it is and what it is not. With that understanding, the
    next question to be answered was: How might it impact their business? A company-wide
    call for use cases went out to collect a set for evaluation. This methodical approach
    helped the team make some objective conclusions on the real risks and the real
    benefits. A two-day working session brought together business and technical leaders.


    The outcome of the mind-meld resulted in the creation of an outline of the health
    care industry from a data perspective. Whiteboards with every type of data and
    broad use-case got filled. Things like medical records, claims, charges, and capitalization
    models were considered. These use cases covered the entire health care continuum
    that United Healthcare is involved in, i.e., basically all of health care. Next
    was comparing this map to blockchain technology keeping in mind the maturity of
    the technology and its possibilities and limitations. It was then time to cross
    off things that blockchain couldn’t help solve at the time. All crossed-off items
    were mapped to why it wasn’t a good fit for a blockchain use case.


    Finally, the team settled on the use case of “improving provider data accuracy.”
    Provider data is a semi-public list of the doctors with their demographic information,
    e.g., a doctor’s first and last name, their clinic’s phone number, their address,
    information on whether they are accepting new patients or not, etc. This data
    is kept current for every in-network provider of the insurance company (i.e.,
    the payer). Insurance companies reach out to the providers a couple of times a
    year to validate the information and ask, “Hey, did anything change?” For all
    the doctors in the insurance companies’ network, they have to reach out and confirm
    the data. This information also goes stale fast. Data has to be continually updated
    and creates a verification burden that happens multiple times for all of the insurance
    companies.


    Insurers across the health-care system collectively spend more than 2.1 billion
    USD every year managing the process of keeping their records accurate on provider
    data.[30](#iapjtig6.html#mvas0d8ryty)

