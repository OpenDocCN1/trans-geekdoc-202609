    \ 2019 Global Blockchain Survey\n\nIbid.\n\n53 \n\nReynolds, “Real Estate on the\
    \ Blockchain.”\n\n50 54 51 \n\n# Chapter 6   \n\nCreating Collaboration Infrastructure\n\
    \n“Collaborating with your competitor is not always easy; it requires a different\
    \ mindset than the one you’ve had for maybe twenty, thirty, or forty years,” explained\
    \ Jon Kuiper.[56](#juu2ljsj.html#mvas0d8ryyx) Blockchain provides the infrastructure\
    \ for safe collaboration where competitors can collectively derive value. Bringing\
    \ together competitors to be part of a successful ecosystem requires a multipronged\
    \ approach, as I discovered listening to Lisa Butters talk about GoDirect Trade.\n\
    \nGoDirect is an Amazon-style marketplace for used aerospace parts that brings\
    \ buyers and sellers together and simplifies their experience. It is part of Honeywell,\
    \ a Fortune 100 company. Within aerospace, Honeywell wears many hats. They are\
    \ an original equipment manufacturer (OEM), manufacturing everything from components\
    \ up to engines. They are a repair facility. And they are also into trading used\
    \ aerospace parts. \n\n“In a call this morning, we were talking about used aerospace\
    \ parts and why people are so hesitant to do their transactions online. And we\
    \ talked a lot about how there are a lot of parallels to the used car industry.\
    \ So, buying used automobiles—and I think that some of the perceptions are that\
    \ in order to buy a used car, people feel so compelled to negotiate on price.\
    \ It’s just what they do. They feel like they’re not getting the best price unless\
    \ they negotiate it. And I think that really is a good parallel to used aerospace\
    \ parts. People feel almost like they’re not being responsible if they’re not\
    \ negotiating the best price on these parts,” explains Lisa Butters, general manager\
    \ for GoDirect Trade. [57](#juu2ljsj.html#mvas0d8ryyy)\n\nNever mind used cars—I\
    \ think we all go into new car purchases with the same mentality—all geared up\
    \ to negotiate.\n\nAccording to ICF, the used aircraft parts market was valued\
    \ at $5.4 billion last year, 60 percent of which was engine-related and 36 percent,\
    \ component-related. The expectation is that the market-size will grow to $7.7\
    \ billion by 2026.[58](#juu2ljsj.html#mvas0d8ryyz) The industry sees most transactions\
    \ offline via traditional routes of picking up the phone and calling somebody\
    \ you know or sending them an email. You work only with someone you know and trust.\
    \ Because of this, a transaction takes a long time to complete. \n\nAs a *Wall\
    \ Street Journal* article reports, “Before blockchain, a transaction took, on\
    \ average, two phone calls and four emails to arrange, and two days to close.\
    \ The sale of larger parts such as engines could take weeks of sending quotes\
    \ and exchanging documentation.”[59](#juu2ljsj.html#mvas0d8ryy0)\n\nThe buying\
    \ process is manual and works offline mainly because of two reasons:\n\n•First,\
    \ these are typically high-value transactions due to the nature of the parts that\
    \ the marketplace deals with. There are small items like nuts and bolts, but then\
    \ we also have multimillion-dollar engines for sale and everything in between.\
    \ The average transaction size is about  \n\n$10,000. \n\n•The other reason is\
    \ that there is a high safety bar in the aerospace industry. These parts need\
    \ to be safe enough to reinstall back in an aircraft so you can fly passengers\
    \ safely.\n\nOther players who have tried to shorten the buying cycle have run\
    \ into a few problems. To reinforce buyer trust through the process, these players\
    \ are trying to get quality documentation from sellers; although, they are falling\
    \ short on their will to enforce it. Not being able to give buyers consistent\
    \ transparency into the quality of purchased parts makes these marketplaces prone\
    \ to failing. Seller adoption of the platform also runs into headwinds. They are\
    \ not accustomed to having an online storefront to conduct business. After all,\
    \ they have been selling over email and phone for years.\n\nAs the platform went\
    \ live, the GoDirect Trade team knew that online transactions were not just going\
    \ to happen overnight. They started an inquiry into what it would take to encourage\
    \ buyers and sellers to move onto the platform and away from old behaviors. They\
    \ started calling and emailing people to get a pulse on the market. They realized\
    \ that for people to participate in e-commerce, a good customer experience, and\
    \ the three Ps—price, pictures, and paperwork—are just table stakes. It will take\
    \ more than that to help the whole industry move away from archaic paper and offline\
    \ transactions. There is a reluctance to trust due to the high dollar amounts\
    \ associated with the transactions. The aerospace industry’s high-quality standards\
    \ throw in more friction in the trust process from a quality perspective. \n\n\
    As Lisa explains it, “We believe that it really all boils down to trust. There\
    \ isn’t enough trust in that e-commerce transaction because the average orders\
    \ are high-dollar, and there has to be a lot of inherent trust from a quality\
    \ perspective. And so we need to look at other technologies such as blockchain\
    \ to try to chip away at that boulder of mistrust. Because it’s not going to just\
    \ be about a good customer experience, but about providing transparency to the\
    \ consumer that’s going to move this channel into the digital era.”[60](#juu2ljsj.html#mvas0d8ryy1)\n\
    \nFor the aerospace industry, where the adoption of blockchain technology is yet\
    \ to catch on, Honeywell is focusing on collaborating with other industry players.\
    \ As Lisa explains, “For Honeywell, I wouldn’t say that we’re going at it alone.\
    \ If anything, I can’t think of a company with aerospace that’s a bigger cheerleader\
    \ for trying to collaborate and work with others—whether it’s a mom and pop or\
    \ big business—to try to collaborate on blockchain trials. And the reason why\
    \ is because blockchain is truly a team sport. If you go at it alone, you get\
    \ really nothing out of it. You get just your own data, and you have no other\
    \ benefits, right? You might as well just have a database.”[61](#juu2ljsj.html#mvas0d8ryy2)\n\
    \nDifferent industries are in various stages of adopting blockchain technology.\
    \ Industries will mature around their understanding of blockchain technology as\
    \ various consortia come together. Let us look at a few steps to take that help\
    \ strengthen this collaboration infrastructure and set us up for higher chances\
    \ of success.\n\n#### **Lowering Relationship-Specific Investments**\n\nOne of\
    \ the challenges in contracts and agreements is the holdup. Suppose that you and\
    \ I consider entering into a business contract. To keep my side of the deal, I\
    \ have to make several investments that I would not have otherwise made. For example,\
    \ I may have to buy some new software, implement it, and adjust my business process\
    \ to make it work. I have to adopt the new software, and it will be helpful only\
    \ if I do business with you. But, if I leave the partnership, it is entirely useless.\
    \ These are called relationship-specific investments. The hold-up problem occurs\
    \ when I have made relationship-specific investments. You may then refuse to honor\
    \ your side of the agreement unless we renegotiate the contract in your favor.\
    \ If things go wrong, I will have wasted my resources on a relationship-specific\
    \ investment. I may not want to enter into a potentially profitable business partnership\
    \ with you because of this risk. Relationship-specific investments are generally\
    \ an impediment to a fruitful business partnership forming up. These kinds of\
    \ situations are a source of friction to get started on business partnerships—to\
    \ the extent that an agreement may not even materialize if there is enough mistrust. "
