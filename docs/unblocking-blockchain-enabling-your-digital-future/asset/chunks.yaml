    ## 挑战


    假设你的工作是打击伪造者。找到他们将是一项艰巨的任务。你会如何做？你可以开始从各种市场购买药物样本，测试它们是否含有正确的成分，并对不符合要求的药物进行标记。考虑到假冒药品在
    1.2 万亿美元的市场中占了 2000 亿，你可能没有足够的时间和资金抓住大多数坏人。3 发现有害药物只是解决问题的步骤之一。你如何寻找它们的源头，以便从源头上解决问题？


