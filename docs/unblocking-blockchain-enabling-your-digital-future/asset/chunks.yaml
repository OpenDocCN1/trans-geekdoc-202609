    \ very like a tree!”\n\nThe *Fifth*, who chanced to touch the ear, said, “E’en\
    \ the blindest man,\n\nCan tell what this resembles most; deny the fact who can, \n\
    \nThis marvel of an Elephant, is very like a fan!”\n\nThe *Sixth* no sooner had\
    \ begun, about the beast to grope, \n\nThen, seizing on the swinging tail, that\
    \ fell within his scope,\n\n“I see,” quoth he, “the Elephant, is very like a rope!”\n\
    \nAnd so these men of Indostan, disputed loud and long,\n\nEach in his own opinion,\
    \ exceeding stiff and strong,\n\nThough each was partly in the right, and all\
    \ were in the wrong!\n\n# Chapter 1   \n\nWhat Is Blockchain?\n\n“I keep hearing\
    \ about blockchain, and you keep reading so much about it. Help me understand.\
    \ What is it?” my wife asked me one fine day.\n\n“Blockchain? It’s an immutable\
    \ distributed ledger in which data is cryptographically stored on different nodes\
    \ using a consensus protocol. Each transaction is stored in a block, and the blocks\
    \ are chained together,” I replied.\n\nCrickets.\n\nThis was the first time I\
    \ encountered the challenge of trying to explain—what *is* blockchain? This chapter\
    \ was, unequivocally, the hardest one to write because of this reason. With other\
    \ emerging technologies, it is relatively more straightforward for people. \n\n\
    With 5G, a user gets higher speeds, which you can experience for yourself. With\
    \ the “internet of things” (IoT), we have visions of “the minority report” with\
    \ people walking into stores and getting served up snazzy advertisements based\
    \ on all the scanning technology around them.[12](#2wm108p0.html#mvas0d8ryu7)\
    \ With AI, we have OpenAI writing human-like articles.[13](#2wm108p0.html#mvas0d8ryu8)\
    \ It’s all instantly relatable. However, unlike these aforementioned technologies,\
    \ blockchain works behind the scenes and is much more of an abstract concept.\
    \ In large part, people would not even know that blockchain has anything to do\
    \ with some of the things they will take for granted in the coming years. \n\n\
    Therefore, it is difficult to explain what blockchain is without helping others\
    \ relate it to something they do in their daily lives. A translation is needed—a\
    \ second-level explanation. I can define blockchain, and your first response would\
    \ be, “So, what?” And rightly so. The answer to the question “What is blockchain?”\
    \ is neither simple nor easy. \n\nAfter attempting to explain blockchain to my\
    \ wife, I have encountered this situation multiple times. I have realized that\
    \ it is better to start with a business-focused description of blockchain technology\
    \ instead of a tech-centered answer. \n\nLet us get started.\n\n#### **Business\
    \ Definition**\n\n##### **Business Elevator Pitch:**\n\nBlockchain is a *record-keeping*\
    \ system *shared* across *multiple computers*. These records are *practically\
    \ undeletable*, stored *securely*, and *collectively*  *maintained*.\n\nLet me\
    \ break it down for you.\n\nBlockchain, as a record-keeping system, stores data\
    \ in the form of a ledger. It is an ever-growing list where new transactions are\
    \ constantly added. You sell stock to another person: That’s a transaction. Your\
    \ warehouse receives the goods from the shipping company: That’s a transaction.\
    \ Blockchain can store all such transactions between entities.\n\nWhoever has\
    \ an interest in the data can get access to this ever-growing list of transactions.\
    \ The sharing gives all of us one common version of the truth. Having a shared\
    \ reality means that there is no need to maintain *my* version of truth versus *your*\
    \ version of the truth. There is an underlying promise that what I see is what\
    \ you see. \n\nMultiple computers, over a peer-to-peer network, have access to\
    \ this shared data. Copies of the data are sitting on different computers that\
    \ are part of the blockchain network.\n\nOnce recorded on the ledger, it is practically\
    \ impossible to change any of the transactions. It is theoretically possible in\
    \ very few cases, but given the state of technological advancement today, there\
    \ is not enough computing power to make changes to the data without being detected.\
    \ Thus, the data is resistant to manipulation by bad actors.\n\nThis data is also\
    \ stored securely using cryptographic encryption technologies. This method of\
    \ storing information is similar to a common approach to storing passwords today.\
    \ Suppose you lose your password to an online account. In that case, the administrators\
    \ generally ask you to reset your password instead of just telling you what your\
    \ password is. That’s because they don’t know your password. \n\nWhen you try\
    \ to log in and submit your password, the plain-text password gets scrambled,\
    \ and this scrambled version is compared to the scrambled text that was generated\
    \ when you first created the password. If the two strings match, you get access.\
    \ Nobody can reverse engineer and find the actual password even if they know it’s\
    \ scrambled form. \n\nIn the same way, cryptographic encryption secures the transaction\
    \ data stored on the blockchain. The use of cryptographic encryption also makes\
    \ it possible to limit access to data only to parties that have permission to\
    \ do so.\n\nThis data is also common-property in that it is maintained collectively\
    \ by multiple participants interested in the data. They all care about the data\
    \ and want to transact with each other, even though they may not necessarily trust\
    \ each other. The data is stored on the ledger only after the majority agree that\
    \ it is indeed the correct data to be stored."
