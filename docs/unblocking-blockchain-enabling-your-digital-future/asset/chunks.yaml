  trans: '


    当我对他们的结果感到惊叹，并询问 Shahar 关于他在这段经历中汲取了哪些教训时，他解释道：“参与该项目的公司很大程度上是由 CxO 级高管推动其得以实现的。他们驱动着产品团队和开发团队。行业通常采用三个维度：第一维度是我们现有的服务；第二维度是我们今天正在构建的，即明天的服务；第三维度则是从现在起三到年后会发生的事情。第三个维度真的需要正确的心态来管理，即需要一种推动那些几年后才能实现并产生收入的事的心态。可能等到相关高管转型时，他们甚至已经不在公司工作了。”


    ## 尝试并选择低风险流程作为第一个用例


    “我们选择了一个非常小的流程。Spunta 是一个内部流程，它不涉及外部客户，也不特别为人所知。所以这是一个很好的、某种意义上的天然的沙盒，”Silvia
    Attanasio 解释道。74Silvia 是 ABI（意大利银行协会）的创新负责人，负责支持意大利银行协会内部银行的创新。ABI lab 是由 150
    家银行拥有的财团。他们为银行工作并为银行服务。


    通过选择低影响的流程作为开始，有助于降低任何新事物的风险，这样即使出现问题，也不会引起任何反弹。2017 年 12 月，ABI labs 开始开展一个利用区块链技术解决银行间对账流程（也称为
    `Spunta`）的项目。为了了解区块链技术是否有所帮助，该团队访问了意大利不同城市的 14 个不同的后台部门。他们根据这些部门的决策制定方式和组织结构对传统流程进行了分析。他们还关注了银行之间的互动以及由此产生的活动流。


    Spunta 是一个极其复杂的意大利银行间对账流程，被选为区块链项目的主题。该流程已存在了几十年，基于 1978 年开始的银行间协议。在意大利，这些是两家银行共同拥有的账户。账户的所有权每三年会在一家银行切换到另一家银行。当账户为
    `Nostro`（本行）且银行拥有账户所有权时，他们可以看到余额、转账等所有账户详情。但当所有权切换到 `Vostro`（他行存款）且另一家银行拥有所有权时，A
    银行无法看到任何关于账户的详情。


    假设 A 银行需要 `vostro` 账户中的任何信息。在这种情况下，他们需要使用传统的通信机制与另一银行联系并索信息。银行的后台运行该流程，以消除复式记账中的不匹配，并确保交易两端的银行对交易的所有方面都达成一致。这变得复杂，因为它是一个单一账户，试图在同一份账本上协调交易方的观点。而且，如果发生不匹配会怎样呢？解决这些不匹配需要大量的时间精力。


    对于 ABI 来说，Spunta 流程似乎是区块链的完美用例。Spunta 流程中的人员一直在寻求改进。他们愿意花时间使 Spunta 及其相关协议现代化。让正确组织的正确的人参与进来至关重要。发生这种情况的条件已经成熟了。另一方面，创新团队希望通过低风险流程来探索这项新兴技术的潜力。选择一个不影响客户的相对小的内部流程至关重要。选择一个团队有权做出决策的流程也非常重要。没有理由在进行任何更改时将其他监管机构或政府包含进来。


    在选择特定的用例用区块链实施时，会有各种考虑。需要观察的因素包括通过妥善使用区块链技术带给你的潜在业务价值机会。你还需要行业内其他伙伴的兴趣，毕竟你正在与
    Web3 技术工作。一个需要关注的点是推动解决方案走向完成所需要跨越的障碍。这影响了你推进项目进展的速度。如果我们使用低风险流程，我们对项目的进度就有较好的控制。


    正如 Dustin Helland 解释道：“所以，我们构建的净代位求偿赔付（net subrogation）包含了组织主要已经在共享的数据，它也不包含高度敏感的客户信息。虽然我们并不一定在规避这些挑战，我们只是想有针对地选择我们要承担哪些。”75


    ## 早期关注教育


    区块链项目需要一种新的组织思维，因为你现在将专注于与你的竞争对手协作。以教育和协作为领先的方法有所帮助。投资建设社区对整个过程也有帮助。对于 ABI 而言，业务端并不了解区块链技术。同时，公司的技术端并不了解
    Spunta 流程。


    因此，首要任务是让他们聚在一起。意图是帮助业务部门理解技术的不同能力，让技术人员理解业务流程的方式。为了进一步巩固这种交叉融合，并帮助增强对技术的信心避免参与者之间的任何抵触，他们决定进行一次
    `POC`。


    正如 Silvia 解释道：“项目的主要目标之一是充分理解这项技术、潜力以及这项技术如何改变传统银行业。因此，我们在项目中也加入了一些学习阶段。我们与专家进行了学习会议……面对来自
    14 家不同银行的后台、创新部门和 IT 部门的五十或六十名观众。”76 这种对学习的投资有助于增加财团成员的参与。


    区块链项目需要非常不同的思维，首先是因为你最终会与竞争对手直接合作。但在内部，许多其他小组也需要参与。除了技术和业务团队，为了管理所有与财团相关的方面，法律、安全、风险、合规、公共事务等团队也需要参与。正如
    Dustin Helland 为 State Farm Explain 道，“我们获得支持和认可的方式是通过教育、协作、并肩工作以及持续的透明化。”77


    ## 审慎思考以决定公有与私有区块链的使用


    我们在区块链之旅中的一个关键决策将是关于公有链与私有链的选择——更重要的是，选择进行开放的公有网络还是封闭的私有网络。或者——混合型？专注于决定你将使用私有还是公有区块链网络是必要的，因为工具至关重要。对于企业来说，隐私和安全是必须考虑的重要方面。


    这里有一些术语帮助我们更好地构建对话。理解这些术语很好，因为它们在讨论中并没有被准确使用。


    公有 vs. 私有：这的定义基于谁可以向区块链写入数据。如果任何人都可以向区块链写入数据，那么它就是公有区块链。`Bitcoin` 和 `Ethereum`
    是公有区块链的良好示例。相反，如果写入权限受到控制，它就是私有区块链。


