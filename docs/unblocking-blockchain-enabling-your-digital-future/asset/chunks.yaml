    # Introduction


    If you look at the press releases coming out, it is difficult to gauge how much
    of that is marketing hype and how much of that is reality. Will all the successful
    pilots survive a move to production and work at scale? All of these successful
    proofs-of-concept—do they have a valid business case behind them? Or are they
    getting started to check the box of “blockchain buzzword” and pacify investors
    and shareholders? This narrative entails much conflict.


    When I was just starting my career as a young business consultant, I was facing
    a similar question. At that time, enterprise resource planning (ERP) technology
    was all set to revolutionize companies with its promise of a commonly shared view
    of reality across various company departments. And now, here we are, with blockchain
    and its promise of a commonly shared view of reality across multiple companies
    that are typically competing with each other. So, an ERP of ERPs? Maybe.


    I wrote this book to share my insights with business and technology leaders who
    are asking the same questions. I hope to help them navigate these uncharted territories
    for their own organizations.


    ## In this book, you’ll learn what the adoption journey with `blockchain` could
    look like for your company. You start experimenting with the technology and take
    some time to learn about it, decide use-case to pursue, and run a proof of concept.
    In the process, you realize that `blockchain` is a team sport and to succeed,
    you need to play with others. Including more people to build the network and get
    them around the table makes this work hard. We also discuss how to be prepared
    for typical challenges. We then look at some advanced work being done with `blockchain`
    in supply chain and also in combination with other emerging technologies.


    The book lays out a framework on how to take your company through its `blockchain`
    adoption journey. As it draws on early adopters’ real-world experiences, the book
    reveals practices that have helped company leaders stay at the center of `blockchain`
    evolution. These lessons will help you design a business strategy by creating
    value using `blockchain` and be prepared for any possible disruptions to your
    business model.


    If you find yourself in this place where you have heard of `blockchain` and wondered
    what it is, and whether or not you should invest your time and energy into knowing
    more about it, then I invite you to join me on this journey. I hope that you will
    learn something new—maybe not what you thought you would, but something new nonetheless.


    As you read this book, you will discover the promise of `blockchain` as a new
    operating system of business, providing an infrastructure layer and helping us
    safely exchange value. Through this book, I hope to share my passion and excitement
    for the socio-technological phenomenon called `blockchain`. Ultimately, I want
    this book to help you stay at the edge of innovation as `blockchain` reshapes
    your competitive landscape.


    I hope the book makes you excited about all that `blockchain` has to offer and
    that you finally decide to take the plunge and go for a swim instead of just dipping
    your toes in to test the waters.


    It is a book that speaks to leaders who want to leverage `blockchain` technology
    to drive business value. *Unblocking Blockchain* will help company leaders understand
    what `blockchain` can do for their business and prepare them to have meaningful
    dialogue with their technology counterparts. The book will also help technology
    leaders understand `blockchain`’s possibilities while striving to future-proof
    their companies’ technology foundations.


    I invite you to join me on this journey of *Unblocking Blockchain*—a journey in
    the discovery of what’s possible now and what is yet to come.


    ***


    ## References


    [1] Behner et al., “Fighting Counterfeit Pharmaceuticals”; Bulletin of the World
    Health Organization, “Growing Threat from Counterfeit Medicines.”


    [2] Sun, “Be Equally Daunting.”


    [3] Behner et al., “Fighting Counterfeit Pharmaceuticals”; Aitken et al., “The
    Global Use of Medicine.”


    [4] Rehman et al., “Blockchain & AI.”

    [5] Casman, “Top 5 Blockchain.”

    [6] CB Insights, “The Blockchain Report 2020.”

    [7] Ibid.

    [8] Gartner, “Hype Cycle.”

    [9] CB Insights, “The Blockchain Report 2020.”


    [10] Hines, “Why Mastercard’s Blockchain”; Dimitrov, “How Walmart and Others”;
    PYMNTS, “Lending Firm Figure.”

    [11] Kapilkov, “Starbucks to Let Customers”; Erazo, “Blockchain-Powered 5G Phone.”


    ## The Opportunity


    Now that you have created the product, you’ll need to sell it without getting
    caught. Why not open an online drugstore based out of some remote corner of the
    world, with no effective drug regulation, away from the reach of regulators?1
    A ripe, new opportunity has shown up as the world deals with a global pandemic
    that has killed thousands of people worldwide. As vaccines and other cures start
    rolling out, it is only logical that people will look for all possible options
    to get their hands on them.2


    If you were to follow the money, it would indicate that `blockchain` technology’s
    interest does not have enough tailwinds. Data by CB Insights seems to confirm
    that hypothesis. Looking at venture capital (VC) funding trends in `blockchain`,
    the report shows that in 2019, funding dollars fell over 30 percent, compared
    to the year before.9


    Communications coming out of enterprise mirror that conversation. As we can see
    below, corporate mentions of the word “blockchain” dropped.7


    10


    ## Challenges


    Now suppose that it was your job to stop the counterfeiters. Finding them would
    be a tough task. How would you do it? You could start by buying samples of drugs
    from various markets, testing them to make they contain the right ingredients,
    and flagging those that do not. Considering that counterfeit pharmaceuticals make
    up $200 billion out of $1.2 trillion market, you probably won’t have the time
    or money to catch most of the bad guys.3 Finding the harmful drugs is only one
    step in solving the issue. How do you go about finding where they are coming from
    in order to tackle the problem at the source?


    As I was trying to learn more about blockchain, I attended as many meetups and
    conferences as possible. However, much of the conversation was about cryptocurrencies
    and fintech. There was not much talk of the use of this technology in the enterprise
    space. This was perhaps because there has been more money flowing into cryptocurrency
    companies.6 The conversation follows activity, which follows the money.


    Gartner has its Hype Cycles framework to help business and technology leaders
    frame emerging technologies and interpret the hype that comes with them.8 In our
    case, `blockchain` is currently supposed to be in the “trough of disillusionment.”

