    # 第 5 章 全解联盟


    ## 关于联盟


    韦伯词词典（Merriam-Webster）在线版对联盟（consortium）有如下定义：“一项协议、组合或群体（如公司群体），为了承担一项超越任何单一成员资源范围的业务而形成。”我们在这里关注的一个方面是“公司群体”。[49]
    很多时候，这些公司群体将包含同一市场中的竞争参与者。我们关注的第二个方面是“超越任何单一成员的资源”。


    由于目前的商业世界主要并非如此运营，这种竞合（coopetition）状态可能很难建立。然而，它是值得追求的，因为公司可以获得独立时无法实现的回。在追求过程中，寻求使用区块链技术的公司以某种形式的联盟聚集，共同构建解决方案。正如德勤（Deloitte）2019
    年全球区块链调查发现的，公司考虑加入联盟有多种原因。[50]


    当公司开始研究并尝试区块链时，他们会进入试图如何以有组织的方式与其他参与者最好合作的阶段。正如我们在第 2 章所看到的，Optum 技术从学习区块链技术开始。他们评估了区块链对其业务的影响，决定了要追求的用例，并开始寻求与其他感兴趣合作的保险公司建立关系。其想法是寻找几家愿意参与实验并从尝试区块链解决用例中受益的国家保险公司。


    本章将探讨区块链联盟。


    参加各种区块链医疗会议让 Optum 团队与 `Humana`、`Multiplan`、`Aetna` 等其他保险公司建立了这些关系。这些努力为联盟对话铺平了道路。在高级别，联盟的创始人签署了一份谅解备录，开始使用该用例来提高提供者数据的准确性。每个实体都必须向上领导链进行谈判，`Synaptic
    Health Alliance` 作为一个联盟诞生了。


    ## 联盟的类型


    这是 `Synaptic Health Alliance` 采取的路线。然而，随着公司尝试如何与竞争对手最好合作，不同形式的联盟应运而生。观察区块链领域发展联盟趋势的一个框架是看可用于整合生态系统的领导力。联盟管理员（consortium
    steward）在定义业务伙伴的工作关系方面提供领导，帮助推动区块链解决方案从概念到开发再到行业采用。构建这些联盟有两种新兴模式。第一是创始人领导的联盟，其中联盟管理员是行业生态系统中的公司之一。第二种是由独立实体作为联盟管理员提供领导力。


    ### 创始人领导的联盟


    创始人领导的联盟通常涉及一个行业领导者在采用区块链技术方面提供早期领导。通常，创始人充当业务网络的管理员，负责提供技术和组织领导力，并带领其业务伙伴共同完成一个用例。有时，主导行业参与者会担任这一角色。其他时候，一群公司聚集在一起约定并解决共同的业务问题。尽管如此，小组中的某一个成员最终将作为网络管理员担任领导。然而，他们其中一人确实在构建联盟方面为小组提供领导力。


