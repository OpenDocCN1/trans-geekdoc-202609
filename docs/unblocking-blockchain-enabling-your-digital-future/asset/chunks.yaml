    \ through the supply chain up to the retailers. “Initial estimates of the FLI\
    \ tell us that around 14 percent of the world’s food is lost from post-harvest\
    \ up to but excluding the retail level.”[95](#r5xklr8a.html#mvas0d8ryuk)\n\nAt\
    \ the same time, FAO also finds that “a total of 842 million are estimated to\
    \ be suffering from chronic hunger, regularly not getting enough food to conduct\
    \ an active life.”[96](#r5xklr8a.html#mvas0d8ryul) Those numbers are unfortunately\
    \ only going to go up because of mass migration and various other problems. We\
    \ have this dual problem where we have a third of all produce going to waste.\
    \ Meanwhile, you have many people on the planet, approaching a billion, who are\
    \ either undernourished or malnourished. \n\nAs supply chains become increasingly\
    \ data-driven, you should use data to address inefficiency, waste, and contamination\
    \ in terms of isolating where contamination occurs. If a bag of rice is contaminated\
    \ with glass particulates, or an apple is contaminated with listeria, we don’t\
    \ have to say to the retailer, “Okay, you need to destroy every apple on every\
    \ shelf on every store.” You can, instead, pinpoint the farm or the packing house\
    \ or the point in the supply chain when contamination occurred. That reduces the\
    \ liability and the financial harm to everybody.\n\nAs Frank Yiannas goes on to\
    \ tell us, “And once we finished the proof of concept, we go to the blockchain\
    \ solution and just log on. And by inputting a lot number or . . . \\[scanning\\\
    ] a QR code, how long do you think it took us to trace back? 2.2 seconds! We’ve\
    \ gone from seven days to 2.2 seconds in the ability to track food back to the\
    \ farm. And not only that, not only do we track it back to the farm, but now because\
    \ we’re capturing that information on the blockchain, we have additional information\
    \ and insights at each point in the chain.”[97](#r5xklr8a.html#mvas0d8ryum)\n\n\
    #### **Unique Value Proposition of Blockchain  \n\nfor Supply Chain**\n\nBlockchain\
    \ has a unique value proposition in helping fight food waste due to contamination\
    \ in the apple supply chain. When Penta did the apple supply chain project out\
    \ of Michigan, they tracked apples all over the country to different brand-name\
    \ supermarkets. They discovered a few things. \n\nOne, there is existing technology\
    \ in place where people use logistics and fulfillment software to help automate\
    \ the ordering process. This automation helps determine which trucking company\
    \ comes to pick up which order to deliver to which supermarket. \n\nIn the case\
    \ of apples, sometimes they are regular logistics companies that work with the\
    \ apple packing house, and sometimes they are independent contractors. The packing\
    \ house company’s system includes both. They go through an ordering process that\
    \ determines who picks up the apples, at what time, and delivers to what place.\
    \ Different supermarkets may have systems that require compliance. For example,\
    \ they may require that shipments include a temperature trail. Temperature trail\
    \ is a small sensor device that works as a data logger. It’s not wireless and\
    \ it just collects the data, so somebody has to pick it up, gather the data, scrape\
    \ the data off the device, and put it into their system. Retail chains generally\
    \ require this for apples. \n\nBut what Penta learned from interviews with the\
    \ truckers and the people at the packing house in Michigan is that the retailer\
    \ personnel may never get the data from the temperature trail. The truck comes\
    \ up to the docking bay at the retailer’s loading site, and that’s it. The trucker\
    \ has nothing to do with the apples at that point. The retailer’s people come\
    \ to collect the apples, and they throw away the temp trail, or they just leave\
    \ it in the truck. \n\nThere is a system in place, but people aren’t using it.\
    \ Without that information, you can’t pinpoint where contamination might have\
    \ occurred. Suppose there was a temperature event, where, for example, the air\
    \ conditioning unit broke in a truck. In that case, there is a high risk of possible\
    \ bacterial growth or contamination. All that data gets lost in the supply chain.\
    \ If the retail company then has a problem, they can’t go back to their existing\
    \ system and find the data.\n\nSo ultimately, the problem is trust. You have a\
    \ complex value chain with multiple stakeholders, and this is why blockchain has\
    \ a unique value proposition. In the apple supply chain, the retailer owns the\
    \ data that comes off the temperature trail. But as the apple packing house taught\
    \ Penta, each member of the supply chain can only see one step forward and one\
    \ step back. That’s the extent of their visibility. The problems that we are dealing\
    \ with, like contamination or environmental conditions against regulations for\
    \ a specific product, can occur at any point in the supply chain. \n\nWe need\
    \ a robust system for data collection that collects data from all the stakeholders.\
    \ That is what existing technology does not do. Each stakeholder owns their systems.\
    \ And thus, the information is siloed. They don’t necessarily share it with each\
    \ other. Maybe they share it with the large retailers because it is a requirement\
    \ set for them. But the trucking companies don’t necessarily share the data with\
    \ packing houses because they have possibly differing interests when it comes\
    \ to sorting out a liability issue with their insurance.\n\nAs David goes on to\
    \ explain, “What blockchain does is, it creates a multi-stakeholder data infrastructure\
    \ that can collect data from different stakeholders in the ecosystem without compromising\
    \ their proprietary information. This allows the system to have efficiency gains,\
    \ visibility gains, transparency gains, etc. All those things are important when\
    \ it comes to dealing with a product that has a contamination event or a consumer-facing\
    \ problem in a complex value chain. So that’s why we see blockchain having a unique\
    \ value proposition.”\n\n#### **Origin Authentication**"
