    \ much longer, and maintaining records of these transactions can be time-consuming\
    \ and error-prone. It also adds to the cost of doing business.\n\nFor example,\
    \ you press the “sell” button, and you sell the stock in your online brokerage\
    \ account. If you want immediate access to funds, that will not happen because\
    \ the settlement process takes a few days. This settlement will involve various\
    \ parties who have their versions of the ledger for the same transaction. Each\
    \ of those entities cannot see each other’s ledger and spend time and effort reconciling\
    \ the records. These transactions are also inherently conflictual. They provide\
    \ value to both participants, which is why the participants agree to the transaction.\
    \ But the transaction happens at an equilibrium. Tilting that balance in their\
    \ favor would be of interest to all parties. That leads to the issue of whether\
    \ you can trust the other party’s record or not. \n\nSocieties need trust for\
    \ these transactions to continue. They try to maintain that trust through various\
    \ methods. At a social level, we have a notion of ethics and morals that encourage\
    \ trustworthy behavior to maintain one’s reputation. At a more formal, institutional\
    \ level, societies try to discourage untrustworthy behavior by implementing rules\
    \ and laws that govern the boundaries and conditions under which transactions\
    \ can occur. We don’t trust that each of the parties will act in accordance with\
    \ moral norms and the law; therefore, we implement all kinds of checks and balances.\
    \ These measures take the form of auditors, third-party trusted organizations,\
    \ legal structures, etc.\n\nAll of this taken together allows for the creation\
    \ of *trust*. Let’s take the example of financial transactions. I can buy groceries\
    \ in a store without handing over any money just by swiping a card. I can make\
    \ purchases like this because both me and the merchant trust a third party—the\
    \ financial system. I am willing to put my money in the banks, knowing very well\
    \ that I may wake up tomorrow, log into my account, and find a zero balance. I\
    \ trust the bank would not wrong me as they want to protect their reputation and\
    \ continue to be in business. Even if a bank were to go rogue, government bodies\
    \ have created laws to protect me.\n\nBlockchain shifts the need to place trust\
    \ in people and institutions by directing that trust toward technology instead.\
    \ With that, it provides the potential to eliminate the costs associated with\
    \ the infrastructure built solely to provide trust all around us. On the blockchain,\
    \ transactions are transparent to all. There is no need for intermediaries to\
    \ certify, which helps reduce costs.\n\nToday, when two companies do business\
    \ together, they will typically keep separate records of their work. There will\
    \ be discrepancies in those records from time to time, which cause disagreements\
    \ that are frustrating and time-consuming to resolve. Blockchain gives an elegant\
    \ approach to the shared set of records. Both (or many) companies agree that data\
    \ is correct before recording it on the shared ledger. \n\nOnce you have that\
    \ trusted and shared set of records, you can now explore automated business processes\
    \ on top of it. This trusted data enables a smoother inter-organizational workflow.\
    \ Blockchain allows for the creation of this underlying infrastructure, which\
    \ promotes collaboration among competitors.\n\n#### **The Paradox of Cooperation\
    \ and Competition**\n\nOver the years, as management theory has evolved, companies\
    \ have shifted their strategy to include collaboration to increase their profits.\
    \ Increasing their profits through competition used to be the primary strategy\
    \ for companies. In trying to get a competitive advantage, that strategy has expanded\
    \ to include collaboration with various partners. This cooperation with competitors\
    \ has manifested itself in the form of strategic alliances.\n\nVarying degrees\
    \ of competitive and cooperative behavior among rivals can exist at the same time.\
    \ Competitive behavior amongst rivals can vary from open warfare to subtle friction.\
    \ Cooperative behavior amongst organizations can range from full-on integration\
    \ to sporadic collaboration. This collaborative advantage can get companies more\
    \ access to skills and resources than they would have on their own.\n\nOrganizations\
    \ commonly exhibit the existence of these “simultaneous opposites” with contradictory\
    \ elements. “The key characteristic in paradox is the simultaneous presence of\
    \ contradictory, even mutually exclusive elements.”[14](#2wm108p0.html#mvas0d8ryu9)\
    \ This paradox of cooperation and competition in strategic alliances is called\
    \ “coopetition.” The primary precondition needed for coopetition to happen is\
    \ an overlap of interest between competing companies. Then, they can be motivated\
    \ to work together in their quest to create more value than what could have been\
    \ created by them working by themselves. Blockchain will supercharge coopetition.\
    \ It will enhance the realm of possibilities for cooperation between companies.\n\
    \nLook at blockchain as more than just new technology; it introduces a new way\
    \ of looking at the world. Instead of being a pure technology play, blockchain\
    \ is a techno-sociological innovation. It helps change the behavior of groups\
    \ of people in a manner that we did not see earlier. It is more of a techno-sociological\
    \ construct that will help achieve a win-win for all parties. It shifts the mindset\
    \ to try and grow the pie together instead of slicing it up as corporations compete\
    \ in the marketplace. That is a paradigm shift in doing business that creates\
    \ more value for the customer by opening up the silos called companies.\n\n**So,\
    \ what is blockchain? **Is it a database? A ledger? a trust layer? Immutable?\
    \ Secure? Trustless? Tamper-proof? Dis-intermediating? Blockchain can be all of\
    \ these or any of these. That is up to you to choose. Like the blind men of Indostan,\
    \ blockchain’s reality is different depending on whom you ask. \n\nThis chapter\
    \ should have given you a good overview of what blockchain is. Now we are ready\
    \ to explore. How do you get started on a successful blockchain adoption journey?\n\
    \n* * *\n\n[12](#2wm108p0.html#mvas0d8ryva) Spielberg, “Minority Report”\n\n[13](#2wm108p0.html#mvas0d8ryvb)\
    \ GPT-3, “A Robot Wrote This”\n\n[14](#2wm108p0.html#mvas0d8ryvc) Clarke‐Hill,\
    \ “The Paradox of Co‐operation.”\n\n14 \n\nClarke‐Hill, “The Paradox of Co‐operation.”\n\
    \nGPT-3, “A Robot Wrote This”\n\nSpielberg, “Minority Report”\n\n12 13 \n\n# Chapter\
    \ 2   \n\nDo You Know Why You Are Using Blockchain? \n\n#### **The Dichotomy**"
