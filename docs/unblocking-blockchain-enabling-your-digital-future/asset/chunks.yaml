    Contents


    ## Introduction


    Imagine that you wanted to sell counterfeit pharmaceuticals. How would you do
    it? You could start by manufacturing pills that look like brand-name pills, with
    the same coloration, shape, and markings. Because it is a counterfeiting operation,
    there is no need to spend much money on the actual ingredients to manufacture
    the medicine. You need to convince a buyer that nothing is amiss with your pills.
    Of course, if the drugs do not show up in the proper packaging, a buyer will think
    there’s a problem. But that problem is easily solved. Just package your “brand-name”
    pills in matching boxes that look like the originals. 


    Now that you have created the product, you’ll need to sell it without getting
    caught. Why not open an online drugstore based out of some remote corner of the
    world, with no effective drug regulation, away from the reach of regulators?[1](#wm5bet85.html#mvas0d8ryyb)
    A ripe, new opportunity has shown up as the world deals with a global pandemic
    that has killed thousands of people worldwide. As vaccines and other cures start
    rolling out, it is only logical that people will look for all possible options
    to get their hands on them.[2](#wm5bet85.html#mvas0d8ryyc)


    Now suppose that it was your job to stop the counterfeiters. Finding them would
    be a tough task. How would you do it? You could start by buying samples of drugs
    from various markets, testing them to make sure they contain the right ingredients,
    and flagging those that do not. Considering that counterfeit pharmaceuticals make
    up $200 billion out of a $1.2 trillion market, you probably won’t have the time
    or money to catch most of the bad guys.[3](#wm5bet85.html#mvas0d8ryyd) Finding
    the harmful drugs is only one step in solving the issue. How do you go about finding
    where they are coming from in order to tackle the problem at the source?


    You would have a tough job ahead of you. But maybe there is a smarter way to do
    it. What if you did not have to police all the online drug stores? What if you
    could empower buyers to know when they are victims of fraud? What if you could
    give them a tool to police their purchases and know when someone is trying to
    sell them fake pills? Blockchain may have an answer for you by making it possible
    to verify—with certainty—who made the pills.


    FarmaTrust is attempting to do just that. To address some of these challenges
    in the pharmaceutical supply chain, FarmaTrust has introduced a blockchain-based
    solution. One aspect of the solution focuses on pharmaceutical tracking and data
    services. This solution provides much-needed visibility into the journey of a
    product from the point of manufacture to the consumer. It helps with tracing the
    origins of the drugs and helps make sure that they are not counterfeit. Having
    a better understanding of inventory flow through the supply chain also helps the
    companies manage their stock accurately and reduce waste. In fact, FarmaTrust
    has attracted enough attention from the regulators in the US and Europe that trials
    are underway.


    Another part of FarmaTrust’s solution centers on Clinical Trial Services. The
    nature of clinical trials has progressively become global. Also, the trend of
    outsourcing trial services has increased recently. Because of these trends, we
    have a need for assurances that clinical trials are using the correct process.
    As more clinical trials are run worldwide, regulators need to focus on making
    sure that the quality of trials and the methods used to conduct them meet the
    standard.


    #### **But, Why Use Blockchain? **


    One of the most exciting qualities of blockchain, the data technology that we
    are exploring, is the immutability of stored data on the blockchain. We can trust
    the data because it cannot be tampered with due to this quality. Once you can
    ensure you have good data, it further facilitates data analytics and artificial
    intelligence applications. The immutability of data also helps regulators be comfortable
    with the information. They know that what they see has not been changed before
    it reached them. 


    The other aspect of blockchain useful for FarmaTrust is automating processes based
    on reliable data under certain business conditions. Some of the modules in FarmaTrust
    allow for automating functions like automatic purchase, automated ordering, automated
    regulatory reporting, automated payments, etc. 


    Blockchain also decentralizes control over the data. Centralizing your data under
    a single controlling authority leaves you vulnerable to the risk of being manipulated
    even if you have a distributed database. The data can be tampered with and changed
    to suit a particular purpose. A distributed data technology, like blockchain,
    has multiple controllers, making it difficult for any participant to indulge in
    nefarious activities for fear of identification.


    The use of cryptography by blockchain is also crucial for the security aspects
    of the solution. We hear about all these high-profile hacks, not just on health
    records but also on financial documents. The use of blockchain helps protect against
    such attacks.


    FarmaTrust’s solution helps companies get more visibility in their supply chain.
    That, in turn, helps improve efficiency. End customers have increased trust in
    the medicines they are consuming. Companies also will tend to pass some of the
    cost savings to consumers in the form of reduced prices.


    Online pharmacies help reduce the cost of operations and, in turn, reduce prices
    for customers. However, they are tainted by high rates of counterfeit drugs. A
    blockchain-based solution like FarmaTrust can help mitigate and prevent this problem.
    It allows companies to make data-driven decisions—with reliable data—and helps
    make the world a cheaper and safer place with the help of blockchain.


    The key reasons to start using a blockchain instead of other existing technologies
    are the ability to feel comfortable with the system because data is not corrupt,
    multiple controllers that help detect any attempts to change the data, secure
    data storage, and automation using trusted data. Combining all these aspects makes
    it possible to operate more efficiently, reduce costs, and enable new value generation.


    Yes, there are additional complexities because there is a transition involved
    in moving away from a centralized world to a decentralized world. We are so used
    to the centralized nature of doing things that anything different will seem like
    an added complication. The blockchain landscape is ever-evolving because it is
    an emerging technology. There are open questions about its speed, scalability,
    lack of standards, interoperability amongst different blockchains, and regulatory
    uncertainty. Users will need to gradually come to terms with the unfamiliarity
    of this decentralized paradigm. The shift to trusting the data will not be an
    easy transition.


    Opportunities will explode once all the actors involved are comfortable. Once
    they understand that no one can change the data and that the data can be kept
    secure in this manner, blockchain’s true potential will open up.


    As Najib Rehman from FarmaTrust put it, “We can work with you, and we can show
    you what the difference is. What we want to do is work in parallel with your incumbent
    technologies. And then, as you see the real value of the distributed nature of
    the blockchain, that means that you can trust the data immutably. You can see
    why, then, you might want at some point, to turn off the old stuff and move over
    wholly. . . . There is now going to be a tipping point, I believe.”[4](#wm5bet85.html#mvas0d8ryye)


    *Unblocking Blockchain*  is an inquiry into that tipping point**.**'
