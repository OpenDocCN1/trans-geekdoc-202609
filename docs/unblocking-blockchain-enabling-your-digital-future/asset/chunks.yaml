    Blockchain can provide a working model to offer participants an economic incentive
    to be good network citizens and pull their weight. In the case of Synaptic Health
    Alliance, the idea of a data marketplace was floated. That helped pave the way
    to figure out the model for network economics. Anyone who wants to use the data
    and amend their provider directory, updated by another payer, would need to buy
    it from the entity that submitted it. The buyer’s willingness to pay will depend
    on the history of how accurate the data is from that insurer. The network rewards
    the participants for contributing accurate data. This will also provide a way
    to shoehorn a lot more companies in and allow them to onboard and use the network
    in a way that they’re not freeloading on everyone else’s data. Otherwise, there
    is no incentive to participate as a model citizen of the network. “If I could
    do it over again, I would push much harder to help them understand the need for
    an economic model,” explains Tony Little.


    ## On the Need for Focus on Network Economics


    In general, there is a tendency to overlook the “economics” part of the equation
    because typically, people who come forward and take the initiative to drive technology
    projects are, well, technologists. They approach the solution from the perspective
    of creating a technology solution. Buy-in from business teams at the outset of
    the project will increase the chance of success. HFS Research reports that “Seventy-five
    percent of respondents look at blockchain as a strategic priority today, but the
    budget for more than 90 percent of blockchain initiatives is emanating from IT
    budgets. Only 7 percent of business unit heads are allocating budget for blockchain
    initiatives, which leads us to question their overall commitment.”[33](#ylwl2am7.html#mvas0d8ryuu)
    This observation is also echoed by Tony in his work with Synaptic Health Alliance:
    “What would have been great is if we would have had economists or the business
    people come in and say, ‘Okay, we’re creating a marketplace.’ And the requirements
    for the technology should have been driven off the marketplace idea.” This would
    drive the conversation about the economics of the blockchain solution.


    Suppose the focus of a blockchain project is more on the technical aspects and
    not on economic incentives. In that case, there is a risk of missing the big picture.
    “Much of the power of blockchain-supported decentralized networks derives from
    the fact that they have the potential to draw in participants by leveraging economic
    incentives.”[34](#ylwl2am7.html#mvas0d8ryuv) In all parts of a business network’s
    value chain, the participants can derive economic value from a blockchain project.
    However, all improvements that a blockchain network brings to the table may not
    be apparent to participants up the stream in the value chain. It is essential
    to focus on value for all participants and bring it in focus to have appropriate
    visibility.


    In a supply chain consortium like Vinturas, a consortium of logistic service providers
    (LSPs) in the finished vehicle logistics (FVL) industry, the participants expect
    to derive increased benefits as more companies throughout the supply chain join
    the network and represent all types of stakeholders.


    “So, blockchain technology enables collaboration and enables value creation for
    all stakeholders in the ecosystem . . . in a world where we are all more and more
    afraid of bigger organizations, giants, middlemen taking away your data and making
    money themselves. Our position at Vinturas is that we all benefit if we collaborate
    together in a blockchain-based network.”[35](#ylwl2am7.html#mvas0d8ryuw) We all
    benefit; this is how Jon Kuiper, CEO of Vinturas, explains it. That is what blockchain
    is all about. But for everybody to benefit, you have to be clear about how everybody
    will benefit and be set up for everybody to benefit.


    ### The FVL Industry


    The FVL industry encompasses all the activities of shipping a new consumer vehicle
    from the factory to the dealer. Since we are talking vehicles, the shipping requires
    more specialized activities than what we might be aware of with the standard everyday
    consumer packages. There is a need for specialized transportation, skilled drivers
    who can handle these deliveries, specialized storage, pre-delivery inspections,
    etc. Due to the nature of transportation and handling of vehicles, there is also
    a high risk of damage. In the FVL industry, due to today’s supply chains being
    global in nature, there is added complexity. The complex and dynamic nature of
    the industry presents unique challenges.


    In FVL, LSPs are a significant player and are outsourcing entities that manage
    the storage, distribution, and transportation of vehicles. For a vehicle to reach
    the dealer from the production facility, multiple hand-offs happen between original
    equipment manufacturers (OEMs), i.e., the companies producing the vehicles, and
    various LSPs. These LSPs and OEMs do not use any standardized data exchange among
    themselves. In addition to that, all the processes supporting the handovers are
    paper-based. This situation leads to an opaque supply chain. The result is that
    the OEMs do not have end-to-end visibility in their supply chain, leading to poor
    inventory management.


    The dealer knows when the vehicle has been produced in the factory but has no
    idea when it will arrive at the dealership for the customer to take possession.
    This lack of visibility leads to poor planning of the last mile processes for
    hand-off to the customers. Consumers accustomed to better experiences with online
    retailers for their other delivery needs are left underwhelmed in comparison.


    In a situation rife with such inefficiencies, the only way LSPs can lower their
    service pricing is by cutting down on profit margins. With profit margins under
    pressure and all the focus on cutting costs, the companies cannot invest in upgrading
    their processes and tools. Supply chain control towers are one of the industry’s
    initiatives; here, the more prominent players try to optimize the economics by
    consolidating smaller players’ contracts. This approach only ends up introducing
    more structural inefficiencies into the process. The supply chain control towers
    end up operating as middlemen, thus adding cost to the overall infrastructure.
    This introduction of intermediaries in the value chain also creates a threat of
    marginalization for the logistics service providers.


    With his extensive experience working with supply chains, Jon appreciates the
    value that blockchain technology can bring to address the FVL industry’s challenges.
    As he explains, “Like in many industries, collaboration is a new theme in the
    world, in general terms, and certainly in relation to blockchain technology. Blockchain
    technology is a fantastic technology to collaborate, and collaborating creates
    additional value. At the same time, it’s fair to say that the companies that are
    working together in Vinturas are, on the floor and operational levels, competitors.
    So this requires a mindset of identifying the value that we will collectively
    have, if we collectively digitize our world, in a safe and fair way.”[36](#ylwl2am7.html#mvas0d8ryux)
    In comparison to a cost-cutting focus, collaboration makes it possible to create
    more value.


    Vinturas believed that the right technology could help fix the finished vehicle
    supply chain’s inefficiencies. They created a blockchain-based digital collaboration
    infrastructure to benefit the whole ecosystem. “We—and by ‘we,’ I mean a number
    of logistic service providers in Europe—said . . . ‘Well, we need to take the
    initiative to create this digital infrastructure, this collaboration infrastructure,
    where we will all benefit and not only as logistic service providers . . . but
    also other stakeholders in the ecosystem,’” explains Jon.[37](#ylwl2am7.html#mvas0d8ryuy)

