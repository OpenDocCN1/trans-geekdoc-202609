    在这种场景下，由于没有一家公司主导工作，其他合作伙伴对于在某个“大哥”的施压下工作的恐惧较少。这使得招募新成员来扩大网络变得更加容易。因为这是一个中立的环境，竞争对手开始合作也相对更加直接。这种中立环境有助于减少采用过程中的任何阻力。


    正如我们在其他业务情况下看到的，当决策桌上有许多在决策事务上拥有平等发言权的决策者时，进展可能会很缓慢。不同的意见和观点需要调和以达成共识。这可能是具有挑战性且耗费时间的。在这种情况下，这种模型可以帮助事情进展得更快。


    正如 Coadjute 首席官 Dan Salmons 向我解释的那样，“在我们看来，答案是创建一个能够提供解决方案的公司，而不是等待方案达成一致。”Coadjute
    的使命是通过整合行业内各种不同的参与者，数字化地连接英国的房产市场：房地产中介、过户律师、测量师、贷款经纪人、贷款银行等。最终目标是改善客户的购房体验。


    “我在这里遇到了一个不知道解决方案的问题，”Dan 解释道，“我当时正在寻找；在一个非常碎片化的房地产市场中，到底如何给客户提供全面的端到端体验？”购房过程非常复杂，因为买家需要与多家企业打交道。想想你买房时需要采取的所有步骤。首先，你找到一个房地产中介并开始看房。


    同时，你还需要弄清楚自己买得起什么样的房子。银行给你多大的贷款？你与银行合作进行审批。然后，在某个时间，你需要一名房屋检查师帮助你理解你面对的情况。你与抵押贷款经纪人合作寻找适合你的贷款。在贷款关闭前，评估师会来提供帮助。你可能并不清楚在这个漫长的过程中，每一个为你提供服务的实体具体在做什么，但会产生相关的费用。


    你在买房过程中与之交互的每个实体都是某个垂直子行业的一部分，即房地产中介、银行、房屋检查师、抵押贷款经纪人、评估师等。“这些垂直领域中的每一个——国家机构已经在一些很棒的平台上数字化……过户业务已经数字化，如果你想做的话，法律部分在一些很棒的平台上也有数字化。经纪已经数字化。抵押贷款正在数字化。测量也正在数字化。但整体而言，当你经历这个过程时，你必须将这一切缝织在一起，”Coadjute
    创始人 John Reynolds 解释道。


    单个环节运作良好，但端到端的价值链是碎片化的。消费者来说，完成整个过程非常困难。买家在跨越不同垂直领域的这一过程中，必须将所有环节缝合在一起。这种情况导致了更长的购房时间，可能长达四五个月，成本增加到房产价值的
    4%。John 继续解释道：“如果我想买你的房子，而你的名字在土地登记簿上拥有这间房子，实际上我们所要做的只是把名字改成我的，并向你的账户里转一笔钱。但要做到这一点，我们需要经过像这六家公司和所有这些事情。”买房是人生中的一个转折点。但购房过程往往会带来压力和挫败感。


    对于 Coadjute 来说，这一切始于一个研究项目。观察不同的英国政府机构，你不能期望他们关闭系统并迁移到一个单一的政府平台。他们能创建一个分布式账本来保持他们的数据库同步吗？当英国土地注册部门发布招标时，他们接受了它。他们建立了一个
    POC（概念验证）来测试整个购房过程的共享账本概念——从有人开始挂牌出售直到有人搬入住。他们为价值链中的每个不同参与者创建了节点。当他们邀请公司进行测试时，收到了压倒性的响应。


    在二十二个国家建立了五十个节点，创建了虚拟房屋并围绕它们完成了交易。POC 证明了这种解决方案在减少整个购房过程中的重复、成本和摩擦方面将发挥巨大作用。


    但从 POC 到生产环境的跨是非常巨大的，因为这涉及到采用问题。POC 显示该解决方案在技术上是行得通的，但行业参与者愿意采用它吗？所以，下一个问题是如何成功进入生产阶段。团队意识到，行业参与者已经有了他们使用的系统，他们来说很难离开这些系统并迁移到新平台。围绕这一挑战的研究诞生了
    Coadjute 将成为这个平台网络的想法。因此，他们去与不同垂直领域的领先平台供应商交流，与他们紧密合作。


    通过该小组，他们进入了非生产的 MVP（最小可行性产品）。他们将 Coadjute 平台连接到这些其他行业领先平台的测试环境，并将其作为移动解决方案提供。在该平台的帮助下，买家可以追踪他们的购房之旅，并在一次简单的在线行程中获得贷款并搬家。通过汇集价值链每个阶段的领先参与者，他们现在可以为消费者创造这种端到端的体验。


    在某种程度上，治理对 Coadjute 来说并不复杂。他们的目标不是去中间化或颠覆行业，也没有威胁现有的参与者。他们是在帮助为现有参与者促进端到端的流程。房产市场中的一些参与者非常渴望看到
    Coadjute 的建成。其他一些则感兴趣但又有一点矛盾。承诺的程度不相同。所涉及的公司类型也有很大差异。你既有小型软件公司，也有大公司。这种许多小型参与者的碎片化市场导致人们担心大玩家会试图接管。考虑到所有这些差异，遵循第三方模型似乎非常合适。


    正如 Dan 解释道，“我们被市场上所有的参与者视为一个受信任的、独立的、客观第三方。Coadjute 的意思是合作，你会听到我们说我们并不颠覆市场。我们想要支持它。我们竭力成为所有参与公司的好朋友和支持者。”

