  raw: "As Jon Kuiper explains, “We are providing our infrastructure for these electronic\
    \ CMR documents. And of course, it’s blockchain, it is immutable, it’s a legal\
    \ document, and we can provide it to the industry stakeholders because the standard\
    \ has been defined from a governmental and regulatory perspective and will be\
    \ implemented in the coming years in all countries of Europe. . . . We think it’s\
    \ very powerful, because an electronic CMR, coming back to the fraud discussion\
    \ again, for people who are shipping, it’s very important that it is legal and\
    \ yet not a paper-based, but electronic document.”[84](#nzx7zm4a.html#mvas0d8ryw4)\n\
    \nAs I was talking to Jesús Pizarro about standards, he commented, “The reason\
    \ I like working with IBM Food Trust is that IBM is using international standards.”\
    \ Jesús is the VP of financial innovation at Heifer International. He is leading\
    \ strategy at Heifer Lab’s blockchain offerings for agricultural development and\
    \ financial inclusion. Heifer International is an international NGO with a mission\
    \ to end world hunger and poverty while taking care of the earth.\n\nHeifer is\
    \ using blockchain to accelerate its mission, which is ending hunger and poverty\
    \ while they take care of the earth. As they started working with blockchain,\
    \ they stipulated their vision to create a blockchain network in the agricultural\
    \ sector where a farmer can access working capital, technical assistance, and\
    \ fair markets. Their approach is one of partnership with government, universities,\
    \ and other organizations.\n\nHeifer partners with others to use blockchain to\
    \ fast-track their mission. They are involved with three different projects in\
    \ the supply chain: poultry, cocoa, and coffee. In poultry, they are working on\
    \ the Ethereum blockchain. For coffee and cocoa, they are partnering with IBM\
    \ Food Trust and the International Development Bank (IDB) on various other projects.\n\
    \nHeifer wants to use blockchain to improve market transparency. In agriculture,\
    \ the small farmer is invisible, and the consumer is blind. The consumer doesn’t\
    \ know where their food came from, nor do they know how it was prepared. And we,\
    \ as consumers, of course, do not know anything about the small farmer. It is\
    \ the same situation with the small farmer as far as their visibility into their\
    \ product’s consumption is concerned. For Heifer, blockchain gives the possibility\
    \ of transparency, which, in the end, will improve the markets.\n\nAs Heifer worked\
    \ through the various blockchain projects, amongst other things, one of the important\
    \ lessons they learned has been about the standardization process. As Jesús explained\
    \ to me, “One of the problems is that we also need to do the standardization of\
    \ standards. Even if you use GS1, you will find that GS1 is also very flexible.\
    \ There are different ways to do the implementation of the standard. For blockchain\
    \ projects to be successful, we need to be using the same standards. I would say\
    \ this is the top lesson learned.”\n\nOf course, much more goes into making a\
    \ blockchain journey successful. A few things are unique to blockchain due to\
    \ its nature and because it is in the very early stages of its development. This\
    \ chapter helped us take a look at some of those peculiarities.\n\n* * *\n\n[69](#nzx7zm4a.html#mvas0d8ryw5)\
    \ Department of Justice, “US Attorney Announces Arrest.”\n\n[70](#nzx7zm4a.html#mvas0d8ryw6)\
    \ McCollough, “Dublin Digital Identity.”\n\n[71](#nzx7zm4a.html#mvas0d8ryw7) Ibid.\n\
    \n[72](#nzx7zm4a.html#mvas0d8ryw8) Speers, “User Experience on the Blockchain.”\n\
    \n[73](#nzx7zm4a.html#mvas0d8ryw9) Helland, “State Farm’s Blockchain.”\n\n[74](#nzx7zm4a.html#mvas0d8ryxa)\
    \ Attanasio, “Blockchain for Italian.”\n\n[75](#nzx7zm4a.html#mvas0d8ryxb) Helland,\
    \ “State Farm’s Blockchain.”\n\n[76](#nzx7zm4a.html#mvas0d8ryxc) Attanasio, “Blockchain\
    \ for Italian.”\n\n[77](#nzx7zm4a.html#mvas0d8ryxd) Helland, “State Farm’s Blockchain.”\n\
    \n[78](#nzx7zm4a.html#mvas0d8ryxe) PricewaterhouseCoopers, “Design Deliberately”\n\
    \n[79](#nzx7zm4a.html#mvas0d8ryxf) Reynolds, “Real Estate on the Blockchain.”\n\
    \n[80](#nzx7zm4a.html#mvas0d8ryxg) Thien-Ngern et al., “from Siam Commercial Bank.”\n\
    \n[81](#nzx7zm4a.html#mvas0d8ryxh) Helland, “State Farm’s Blockchain.”\n\n[82](#nzx7zm4a.html#mvas0d8ryxi)\
    \ McCollough, “Dublin Digital Identity.”\n\n[83](#nzx7zm4a.html#mvas0d8ryxj) Reynolds,\
    \ “Real Estate on the Blockchain.”\n\n[84](#nzx7zm4a.html#mvas0d8ryxk) Kuiper.,\
    \ “Supply Chain on the Blockchain.”\n\n78 76 70 81 71 74 83 \n\nSpeers, “User\
    \ Experience on the Blockchain.”\n\n73 \n\nIbid.\n\nMcCollough, “Dublin Digital\
    \ Identity.”\n\nDepartment of Justice, “US Attorney Announces Arrest.”\n\nAttanasio,\
    \ “Blockchain for Italian.”\n\nHelland, “State Farm’s Blockchain.”\n\nPricewaterhouseCoopers,\
    \ “Design Deliberately”\n\nHelland, “State Farm’s Blockchain.”\n\nAttanasio, “Blockchain\
    \ for Italian.”\n\nHelland, “State Farm’s Blockchain.”\n\nMcCollough, “Dublin\
    \ Digital Identity.”\n\nHelland, “State Farm’s Blockchain.”\n\nThien-Ngern et\
    \ al., “from Siam Commercial Bank.”\n\nReynolds, “Real Estate on the Blockchain.”\n\
    \nKuiper., “Supply Chain on the Blockchain.”\n\nReynolds, “Real Estate on the\
    \ Blockchain.”\n\n80 77 79 72 84 82 69 75 \n\n# Chapter 8   \n\nThe New Machine\
    \ Economy\n\n“More than 90 percent of blockchain projects are weaving in other\
    \ emerging technologies, especially the IoT and machine learning,”[85](#uauddjkp.html#mvas0d8ryvd)\
    \ the HFS research report tells us. We are beginning to see some attempts to harness\
    \ the potential of other emerging technologies like IoT (internet of things) and\
    \ AI (artificial intelligence) together with blockchain. A combinatorial approach\
    \ to these technologies ends up generating a whole that’s greater than the sum\
    \ of its parts.\n\nInternet of things (IoT) refers to the multitude of physical\
    \ devices—”things”— that connect to the internet. All these smart devices—smart\
    \ lightbulbs, connected thermostats, fitness trackers, sensors, etc.— are meant\
    \ to collect data about their environment and communicate with the network without\
    \ the need for any human intervention. IoT devices are rapidly proliferating our\
    \ environment. Gartner, Inc., forecasts that the enterprise and automotive internet\
    \ of things market will grow to 5.8 billion endpoints in 2020, a 21 percent increase\
    \ from 2019. By the end of 2019, 4.8 billion endpoints are expected to be in use,\
    \ up 21.5 percent from 2018.[86](#uauddjkp.html#mvas0d8ryve)\n\nSince these IoT\
    \ devices’ job is to collect data and feed it to the network for other devices\
    \ and systems, an immense amount of data is going to be collected. One of the\
    \ primary concerns with IoT devices is their susceptibility to security vulnerabilities.\
    \ This lack of security is concerning with the widespread use of IoT devices in\
    \ smart homes and smart cars. Blockchain as a data-sharing mechanism for IoT devices\
    \ can provide another level of security with available encryption and the tamper-evident\
    \ nature of the technology. With its use in conjunction with IoT devices, blockchain\
    \ can facilitate data distribution in a secure and trustworthy manner.\n\nAnother\
    \ challenge with this expansion in IoT devices is the load that it puts on the\
    \ infrastructure. The sheer growth in the number of IoT devices anticipated to\
    \ be in operation will generate large quantities of machine data that will be\
    \ uploaded and need to be processed. That will heavily stress the current cloud\
    \ infrastructure. Instead, it would help to build infrastructure at the edge to\
    \ handle all these devices sharing data among themselves without needing to go\
    \ back to the cloud. This edge infrastructure would help reduce latency and power\
    \ the machine economy.\n\nApplications of AI are also getting ubiquitous. As you\
    \ look to purchase something on your favorite website, you’ll find them acutely\
    \ predicting what you are interested in buying. It then nudges you to look at\
    \ a few more suggestions. That’s AI behind the scenes. When your voice assistant\
    \ offers to recognize you by your voice, that is AI in action. When the social\
    \ networking site automatically suggests names to be tagged in a photo, AI is\
    \ at work. "
