    # 章节 新型机器经济


    “HFS 研究报告告诉我们，超过 90% 的区块链项目正在织入其他技术，特别是 `IoT` 和机器学习，”我们正在开始利用 `IoT`（物联网）和 `AI`（人工智能）等技术的潜力，产生一个大于部分之和的整体。


    物联网（`IoT`）指的是连接到互联网的物理设备——“事物”。所有智能设备——智能灯、连接恒温器、健身记录等——旨在收集数据并与网络通信，而无需人工干预。Gartner
    公司预计，2020 年企业和汽车物联网市场将增长到 58 亿终端，比 2019 年增长 21%。到 2019 年底，预计将有 48 亿终端在使用，比 2018
    年增长了 21.5%。


    由于这些 IoT 设备的工作是收集数据并将其馈给网络设备和其他系统，会有大量数据被收集。IoT 设备的主要担忧之一是它们容易受到安全漏洞的影响。在智能家居和智能汽车中广泛使用
    IoT 设备，这种缺乏安全性令人担忧。区块链作为 IoT 设备的数据共享机制，可以利用可用加密和技术的防篡改特性提供另一层安全性。通过与 IoT 设备结合，区块链可以以安全且可靠的方式促进数据传输。


    IoT 设备扩展的另一个挑战是它对基础设施带来的负载。预计运行的 IoT 设备数量的巨大增长将产生大量的机器数据，这些数据将需要上传并处理。这将给目前的云基础设施带来巨大压力。相反，在边缘建立基础设施将有助于处理所有这些设备之间的相互数据共享，而无需返回云端。这种边缘基础设施有助于降低延迟并推动机器经济。


    `AI` 的应用也变得无处不在。当你最喜欢的网站上购买东西时，你会发现它们正敏锐地预测你感兴趣的物品。然后它们会引导你查看更多建议。这就是背后的 `AI`。当你的语音助手提议通过你的声音识别你时，那是
    `AI` 在发挥作用。当社交网站自动建议在照片中标记的名字时，`AI` 正在工作。

