- fmt: '

    ## Internal Innovation and Community


    Besides community building outside the company, investing in innovation teams
    internally looking at various use cases for blockchain will go a long way. Organize
    them into a community of practice or center of excellence. As we learned in Chapter
    4, to respond to industry challenges, the Royal Bank of Scotland (RBS) identified
    an opportunity in blockchain quite early. And they were prepared to spend some
    budget at the beginning to play with and test blockchain, which was something
    new that was coming up.


    Very early on, they had engineering teams look at the technology and get used
    to it. It then got to a point where it was clear there were enough use cases to
    justify investing in a community of practice with its center of excellence around
    blockchain.


    “And that would be my number one piece of advice to any organization early on
    in their journey or starting to commercialize projects on the blockchain. You’ll
    have different technological camps sitting there and saying, ‘I like iPhone; I
    like Samsung.’ You are going to have the same viewpoints to blockchain technology,”
    says Andrew Speers.


    ## Navigating the Journey


    At the beginning of your blockchain journey, your company will have a limited
    understanding of commercializing new technology. Having it run through a centralized
    function focusing on blockchain technology helps evaluate the use case more robustly.
    This will also help identify the proper use cases to pursue as you start your
    blockchain journey. On their part, State Farm began to look at blockchain in 2016.
    As Dustin Helland (who we were introduced to in Chapter 4) explains, “We were
    able to pretty quickly identify that the blockchain technology underlying Bitcoin
    could have applications much broader than just cryptocurrency and we established
    a group in innovation area to prioritize and explore potential opportunities.”


    Because you are working with competitors, you have a need for a new way of organizational
    thinking for blockchain projects. An approach leading with education and collaboration
    will help, and the community can help with the whole process. For State Farm,
    initially, the teams focused on working across multiple business lines—for example,
    subject matter experts in the claims department, underwriting, financial services,
    etc.—to educate them on the capabilities of the technology. They also worked to
    identify and evaluate any potential use cases that State Farm thought might be
    of value.


    The focus then shifted into learning by aligning a few of the identified business
    opportunities with some development teams and created early prototypes. Eventually,
    they moved to a stage where the focus was on product delivery and business value
    realization based on the technology. The flagship project out of those efforts
    is Auto Claims Subrogation, built collaboratively with USAA.


    ## The Role of Change Agents


    In addition to community, it takes a change agent who can be one of the early
    people in a company that is evangelizing the emerging technology forward. It helps
    if they are trusted and knowledgeable within the organization. They need to be
    subject matter experts who understand this technology and what it makes possible.
    Blockchain technology reaches into the depths of an organization’s plumbing. It’s
    essential to take the time to spread the gospel of blockchain.


    As Shahar Steiff from PCCW pointed out to me, it helps to have the person at the
    top, with the executive behind the project. Communication of a clear vision goes
    a long way, and that needs to be done with patience and persistence.


    “For most participants, this is not just technical evolution; it is also some
    sort of internal revolution within the company. Telcos and cloud providers today
    understand they are no longer delivering a service; they’re delivering an environment
    and an experience. They are becoming a technology company. And it is not easy
    to take a legacy telco and turn it into a technology company. It needs to be a
    complete mindset shift. It needs to be driven by management,” explained Shahar.


    ## Case Study: PCCW and CBAN


    Shahar Steiff has been leading PCCW Global’s development of blockchain-based platforms
    to support automated-service life cycle. PCCW Global is a leading communications
    service provider participating in the Communications Business Automation Network
    (`CBAN`). `CBAN` is a network of telecom industry leaders collaborating around
    emerging technologies to benefit the global carrier ecosystem. And one of the
    initiatives underway is blockchain-assisted automated settlement.


    Consumers generally identify the telecom industry as a single entity. Even though,
    to deliver services across countries, multiple operators need to come together
    behind the scenes. The data traffic has to flow through one carrier’s infrastructure
    to another before reaching the consumers’ devices. When you and I, as users, make
    a telephone call, we pay our telecom company for the services rendered. In turn,
    our telecom company pays the various information and communication technologies
    (ICT) providers along the telecom supply chain. This telecom supply chain eventually
    establishes an end-to-end connection from a phone in one country to a phone in
    another country. ICT providers complete the settlement for all these transactions.
    We, as consumers, have no visibility into what’s happening behind the scenes.


    ## Traditional Settlement Process


    To activate a business relationship that serves us, the consumers and two ICT
    companies will typically sign a master services agreement (`MSA`). The agreements
    are still commonly done manually. The `MSA` defines the terms and conditions of
    their relationship. Based on these agreements, to deliver a service to the customer,
    a price quote is configured. Service delivery gets set up after understanding
    the customer requirements, designing the solution, submitting the quote, and securing
    an order. And this delivery can take anywhere from a few seconds to a few months.
    Data can start flowing to service the customer only after the service delivery
    setup is complete.


    As the customer starts using the service, all the data usage is recorded, and
    the telecom providers generate invoices. As the operators verify the invoice charges
    submitted to them, they typically find incorrect charges. The discrepancy could
    be because of various reasons, like miscalculation of time service or use of the
    wrong rate. After identifying these disputes, they go into the dispute resolution
    process to settle the amounts. The actual time varies a lot, but it takes about
    three months to get the service up and running. From the time they provide the
    service to the time they get paid after the invoices’ settlement, it takes about
    eight weeks. These extended times are primarily caused by the manual processes
    involved; they reduce the company’s profitability and create a negative customer
    experience.


    ## Blockchain-Enabled Settlement


    With the blockchain-assisted automated settlement, disputes due to record mismatch
    were eliminated. The usage is measured and compared through blockchain in real-time,
    drastically reducing the chances of discrepancies. All in all, they can reduce
    the time for the price quotation process from days to seconds. Service delivery
    timelines are reduced from months to minutes. Traffic measurement and reconciliation
    have been reduced from days to seconds. And the settlement itself has been reduced
    from weeks to seconds. Overall, they have achieved cost reduction, acceleration
    of processes, and the ability to build new revenue streams from services that
    they were not able to deliver earlier.

