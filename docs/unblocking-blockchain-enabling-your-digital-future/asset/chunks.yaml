    综上所述，正如我们在本书的探索中所看到的，各行业在采用区块链方面确实有足够的动力。区块链已经从概念验证（POC）迈向了商业化。正如安德鲁·斯皮尔斯（Andrew
    Speers）所说：“区块链 POC 的时代已经结束了。我们已经做了两三年的这类工作。我们知道它是可行的。我们知道它的作用。现在我们没有奢侈去为了智力追求而构建东西了。它已经从一种新兴技术变成了‘技术’本身。我们正着于商业化、测试以及供客户使用。”109


    ### 开启我们的数字未来


    我的朋友 Venky 一直问我：“基于区块链构建的杀手级应用是什么？”我老实说，目前这个问题没有答案。我们处于这项技术的非常早期阶段，许多技术限制仍待解决。然而，真正的变革性解决方案尚未到来。随着技术的演进，区块链开始与
    `IoT`、`AI`、`5G`、机器人等其他新兴技术良好协作，真正的杀手级应用也将随之而来。


    对于终端用户来说，区块链具有渗透我们的生活并让生活变得更好的潜力。它可以像互联网一样：在生活中无处不在，在幕后运行。我们不需要理解它是如何工作的，但仍然会不经思考地一直使用它，视其理所当然。如果我在网上买了东西，我不需要知道为了完成购买在后台发生了什么。我只需要知道我的安全没有受到威胁，并且可以轻松做到我想做的事。


    对于公司来说，它将开启迄今未经验的领域。它将成为连接数字经济的骨干，并帮助其他新兴技术扩展它们的潜力。区块链为业务生态系统所做的，就像 `ERP` 为单一企业所做的一。正如
    IBM 的布里吉德·麦德米特（Brigid McDermott）所说：“区块链具有变革交易的潜力，就像互联网变革通信一样。”110


    区块链尚未到位，但迹象表明它很快就会实现。当我们到达那里时，它将改变我们的社会和经济范式。


    区块链将是我们不知道自己需要的眼镜。我们可能第一次看到信任的叶片。


