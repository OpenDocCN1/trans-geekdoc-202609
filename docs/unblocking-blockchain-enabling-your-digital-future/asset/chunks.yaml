    # Chapter 7: Set Yourself Up for Success


    Companies typically start their blockchain journey by learning with the community
    and running proof of concepts (POCs). As they get to know more about blockchain,
    they realize that it is a team sport, so they go about strengthening relationships
    in the industry and focus on building a business network, perhaps in the form
    of a consortium. Next, they get to a point where they can run a pilot and commercialize.


    ## Managing Perceptions


    As I learned more about blockchain, I reached a point where I was looking to define
    a financial engine to power my blockchain business. I wanted to join a mastermind
    group that could act as an advisory system and a support group to stay on track.
    After a few web searches, I decided to approach a company that would bring together
    a group of people in cohorts to start mastermind groups.


    To their credit, they were very meticulous in their approach to forming a group.
    The first part of their process included filling out a questionnaire, followed
    by an interview. One question was to link a web page describing my company’s services.
    I gave my blog as the link. As the interview started, the first thing the woman
    tentatively asked me was, “So you do something with Bitcoin?”


    At the time, I found it funny because, on my blog, there is not one single mention
    of the word “Bitcoin.” Instead, it is all plastered with the term blockchain.
    The title of the blog was *The Blockchain Stream of Consciousness*. And yet, she
    had registered Bitcoin in her mind.


    As I am talking to more and more people, it is clear that projects centered around
    blockchain technology face headwinds of perception.


    Blockchain and Bitcoin are tightly intertwined in general perception. And by extension,
    blockchain has to fight Bitcoin’s tainted connections with nefarious activities
    like money laundering, funding of terrorist activities, the dark web, Silk Road,
    etc.


    As the early enthusiasts of blockchain start conversations with folks in their
    companies, it is necessary to manage this association and perception about a blockchain
    project. Be prepared to answer the question: “Isn’t blockchain the same as Bitcoin?”


    “One barrier is perception. When you use the term blockchain, people hear cryptocurrency.
    They hear Bitcoin, and they don’t hear blockchain. We just started calling it
    ‘Digital Identity’ and not so much blockchain because it distracts people,” says
    Doug McCollough.


    Doug is the CIO of Dublin, Ohio, and is currently leading the charge for the city
    to integrate emerging technologies into its daily operations. Dublin is a small
    community of around fifty thousand people in the northwest corner of Ohio. It
    is a technocentric city that has embraced using technology to advance its economic
    development interests. And from there, they have embraced the idea of being a
    leader and innovator in smart cities.


    Doug is very aware of the possibilities of digital disruption to the government.
    He tries to keep his city ahead of the curve by embracing emerging technologies
    in city operations. But nobody sees disruption coming. Most of the time, the prevalent
    narrative is the status quo.


    One example of government disruption is how people now trust mapping services.
    If mapping service says a road is open, you think it is open. However, somebody
    might have removed a sign that city put up. If mapping services advise people
    to undertake actions—that is a disruption.


    Cities are moving onward in their journey to become smart cities and rely on data-driven
    decisions. Software companies, not the government, pioneer all the technology
    that is going into connected vehicles. The government is no longer the primary
    safety partner in lives.


    “We tend to look at cities and say, ‘Stay in your lane, plow the snow, mow the
    grass, fix the potholes, cut my taxes, and I’ll be happy.’ We don’t think about
    all the various services a city does and has been doing. If cities do not innovate,
    then we are going to be disrupted just like any business. We are candidates for
    innovation just like anybody else. I do believe that there’s going to be a new
    distributed data environment. Just as the web changed everything, blockchain and
    distributed data environment are going to change everything,” explains Doug. For
    Dublin, that has been a driver for pursuing the blockchain-based digital identity
    project—to prepare for possible disruption by the technology.


    Besides the challenge of association with Bitcoin, using the word blockchain starts
    distracting people on other fronts too. They start associating the project with
    the flavor of the day and associating it with following the hype. The conversation
    strays away from looking at the merits of the project deliverables. That also
    starts coming in the way of the funding available for these innovative projects.


    ## Invest in Creating a Community


    It helps to create a community of enthusiasts that would help define the use cases.
    On his part, Doug McCollough started the Dublin blockchain group. He wanted to
    bring together tech companies and individuals in the Dublin area interested in
    blockchain, who were probably experimenting behind the scenes. With that effort,
    a few companies started emerging as the ones who were passionate about blockchain.


    The group’s activities helped start the conception of the idea about what would
    be a great use case for how the government could be using blockchain to create
    value for its citizens. And now, the Dublin blockchain group helps create a sense
    of community and accelerates learning among people who are curious about blockchain
    technology and are experimenting in the background.

