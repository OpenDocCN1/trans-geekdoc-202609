    Gartner 的新业务价值预测方法量化了技术创新的价值。它考虑了客户体验、新收入和成本降低等因素。根据该方法，在区块链背景下，“区块链的业务增值到 2025
    年将增长到略高于 1760 亿美元，并预计到 2030 年将超过 3.1 万亿美元。”15 我们讨论的是巨大的数字。由于对这项技术的预期，每个人都想参与其中。他们想确保自己不被抛队。尽管如此，关键问题是，你参与区块链是否出于正确的理由？


    Stephanie Hurder 是 Prysm Group 的创始人经济学家，这是一家专注于实施新兴技术的经济咨询公司，也是世界经济论坛的学术贡献者。她一直是企业区块链倡议的活跃参与者。通过与各种项目合作，她能看到一些熟悉的趋势不断出现。她解释道：“你会看到某个联盟宣布他们有了概念验证，或者他们将针对某个特定的用例进行试点。一年后，当你再回来时，发现：‘哦，我想知道那个试点怎么样了，好像再再也没有消息了，’我们只是看到这种模式不断反复出现。”16
    这些项目并没有带来结果。


    这种观察也可以得到数据支持。根据普华永道的一项调查，在报告区块链项目处于试点阶段的受访者中，54%的人表示努力有时或往往并不符合结果。”17


    “我的投资者正在询问我们的区块链策略，我需要关于这个主题的一些指导，”我的朋友 Sandeep 说道。当然，他得到了他需要的帮助，但这让我产生了思考。他研究区块链技术的原因并不是他试图解决的业务问题（且区块链被确定为该问题的解决方案）。相反，他出于外部原因需要研究这项技术。


    ![](img/mvas0d8ryzo.jpeg)


    © PwC。未经 PwC 事先书面许可，不得进一步分发。PwC 指美国成员机构或其子公司或关联公司，有时也指 PwC 网络。每家成员机构都是独立的法律实体。详情请参阅
    [www.pwc.com/structure](http://www.pwc.com/structure)。


    一方面，存在这样的潜力，但另一方面，这种潜力似乎正在萎缩。区块链可以为公司增加巨大的价值，但它们需要清楚价值驱动因素是什么以及谁获得了这些价值。许多项目对于在特定用例背景下为何使用区块链技术而非现有技术的理由并不清楚。如果项目只是追逐热点，而不将他们的努力与价值挂钩，他们就会增加再次无人问津的概率。


    根据 Gartner 2019 年的预测，“90%的现有企业区块链平台实施将在 2021 年之前更换。”18 关键原因之一是没有将用例与区块链的业务收益联系起来。


    ## 关于保持竞争力


    公司看待新技术的一个视角是：这项技术会对我的业务造成什么损害？从这个视角来看完全关乎竞争优势。如果竞争对手利用这项技术来打破竞争格局，我们将处于劣势。那么问题实际上是：我们如何才能领先一步？


    “企业战略集团 2019 年的一项研究显示，大多数领先组织已经看到了新兴技术的本质属性。82%的组织同意或强烈同意，如果没有新兴技术，他们将无法实现转型。如果他们不转型，竞争对手就会颠覆他们的业务。”19


    保持竞争力促使泰国商业银行（SCB）关注区块链。


    正如 Orapong Thien-Ngern 解释道：“我们意识到，银行持续增长或恢复低股资产收益率的方法之一是从传统业务中扩展出来。我们仍然主要是一家金融机构，但我们开始以不同的方式审视金融世界。我们可以采用新技术吗？我们可以开始创造脱离传统方式的新产品和服务吗？这就是为什么我们对这种分布式账本和区块链如此感兴趣。”20
    Orapong 是 Digital Ventures 的首席执行官，它是 SCB 的子公司。


    SCB 是泰国最古老的银行，成立于 1904 年，一直是市场表现最好的银行之一。”21 它也是泰国按资产和利润计算最大的银行之一。为了保持竞争力，SCB 不断寻求其提供服务的创新。而新兴技术是创新的方向之一。


    传统银行市场的动态是这样的，每个参与者都在试图保护自己的市场份额。“例如，两年前，我们创建了我们认为领先的移动银行应用程序，以获得市场份额。我们宣布了零费用，所有手机银行交易全部免费。在半小时内，每家银行都匹配了这一报价，”Orapong
    说。22


    在这样竞争激环境中，获得额外的收入或利润是挑战性的，尽管你可能投入了大量资金。这种情况迫使银行从传统业务中扩展。他们寻求采用新技术以获得竞争优势的方法。他们可以在流程中创造不同于传统方式的新产品和服务吗？


