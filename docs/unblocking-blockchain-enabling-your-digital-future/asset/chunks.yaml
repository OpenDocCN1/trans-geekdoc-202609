    \ want to leave, you are stuck with a data format that you then have to pay someone\
    \ to convert into a usable form for you. \n\nAs we have come to understand, blockchain\
    \ technology’s value comes from the robustness of the business network in the\
    \ consortium. In service of the network, a consortium steward can help by alleviating\
    \ the concerns of newer consortia members. To start with, blockchain is a technology\
