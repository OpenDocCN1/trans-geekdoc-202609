- fmt: "\nEmerging technologies come with opportunity and risk. Therefore, they need\
    \ to be managed appropriately. On the one hand, there is an immense potential\
    \ to generate new value by participating in the innovation. And on the other hand,\
    \ the newness comes with its own set of risks. There is always an accompanying\
    \ drumbeat that can hype up the emerging technology as the next big thing. The\
    \ decision to, or not to, evaluate, invest, and implement these technologies quickly\
    \ can have far-reaching impacts for companies.\n\nFor this reason, companies need\
    \ to be tech-forward and figure out the right amount of time and energy to invest\
    \ in emerging technology—just enough so that they know what is going on without\
    \ missing the boat if it turns into something big.\n\nThe question then becomes,\
    \ how do we go about evaluating blockchain as an emerging technology? Do we want\
    \ to take advantage of new developments without exposing our companies to undue\
    \ risk with new technologies?\n\n## Enterprise Blockchain Adoption Framework\n\
    \nAs I followed the breadcrumbs and looked closely at several early adopters’\
    \ blockchain journeys, a framework has evolved. Digital leaders can use this as\
    \ a template to guide their blockchain strategy.\n\nThis picture gives a depiction\
    \ of the framework.\n\n![](mvas0d8ryzu.jpeg)\n\n### Learn\n\nAs an emerging technology\
    \ shows promise, it is crucial to learn about it before jumping in with investments.\
    \ To start your journey with blockchain, you first take some time to dip your\
    \ toes in the water. Learning about the technology should inform future investments\
    \ by a company.\n\nThat learning is accelerated if you focus on bringing together\
    \ various minds who are interested in the technologies. Internally this is best\
    \ done by building a center of excellence (`CoE`). A `CoE` helps centralize the\
    \ company’s blockchain skills and experience and build a repository for best practices.\
    \ A `CoE` can also take the lead in executing the proof of concept and pilots.\
    \ It can also provide training as part of the adoption process further down the\
    \ line. \n\nAs Lisa Butters realized with Honeywell, a central team can also help\
    \ illuminate new use cases. They can help the business side understand how blockchain\
    \ technology could help. As she explains, “I don’t really recall, a hundred percent,\
    \ how I got linked to our advanced tech team at Honeywell. But we had a small\
    \ group of people who were dabbling, I would say, in blockchain technology. But\
    \ they didn’t really have a good use case. I was able to meet with that team,\
    \ introduce them to the marketplace, some of the barriers that we were faced with,\
    \ how the industry operates today, etc. And that’s really how it all started.”[[100](#kvn36vkj.html#mvas0d8ryxn)\n\
    \nExternally, engaging with the community in the ecosystem is the way to go. It\
    \ helps you build relationships within the ecosystem. These relationships help\
    \ down the line as efforts go into nurturing the business network for consortium\
    \ conversations. It is best to embed into the community to learn more and help\
    \ others. Engage with others interested in the technology by attending blockchain-specific\
    \ events and connecting with people who are pursuing an understanding of the technology.\
    \ Besides trying to understand what others are building or what problems they\
    \ are solving, contribute to the community by providing your input. \n\nDoug McCollough\
    \ did it well with the city of Dublin, Ohio. He explains: “We actually created\
    \ a group, before we thought about developing a solution here, called the Dublin\
    \ blockchain group. That was my attempt to plant a flag a few years ago, where\
    \ we said, ‘We want all of the tech companies in the area to come out and sit\
    \ down.’ Hackers, you know, people in the back rooms of their companies who are\
    \ really experimenting and sort of keeping this skunkworks in secret, ‘Come out,\
    \ and amongst friends, we’re just going to discuss them.’ We’ve had a few meetings\
    \ of that, and a few companies emerged as really just being passionate about this.”[[101](#kvn36vkj.html#mvas0d8ryxo)\n\
    \nAs you learn about the technology, it helps complete a proof of concept (`POC`)\
    \ to get your hands dirty. The `POC` will help see the benefits that blockchain\
    \ technology might bring and the limitations that come along with it. A `POC`\
    \ also helps get a view into what use cases might be ripe to be tackled first.\
    \ Building `POCs` also provide input as you present critical findings to the leadership\
    \ team and discuss the business case.\n\nThis learning phase is the starting point\
    \ to build upon further action.\n\n### Collaboration Infrastructure\n\nIn the\
    \ learning process, you realize that blockchain is a team sport. It is best to\
    \ play well with others. Those others might be your competitors, making it harder\
    \ and different from other emerging technologies that companies would be evaluating.\
    \ So evaluating market maturity becomes essential. \n\nIs the industry ready to\
    \ use the technology? Are there other players in the industry that are showing\
    \ an interest in possibly collaborating? Blockchain technology cannot help achieve\
    \ much if others are not ready to participate. What is the state of consortium\
    \ development in your industry? Is some competitor taking the lead? Or is an independent\
    \ software vendor coming up with a solution in which it makes sense to engage\
    \ with them? Would data standards pose a barrier given the industry landscape?\
    \ \n\nAll in all, you have to figure out and contribute to creating the collaboration\
    \ infrastructure for the minimum viable ecosystem, which is the basis of successful\
    \ blockchain adoption.\n\nAs you learn about the technology, you should continually\
    \ evaluate the technology opportunity in front of you. One factor to keep an eye\
    \ on is the maturity of the technology itself. What are its current limitations?\
    \ What is gaining traction with others? How much momentum is behind solving the\
    \ gaps? Which platform providers are gaining momentum and getting more market\
    \ share? How is the regulatory landscape?\n\n### Commercialize\n\nAs the ecosystem\
    \ matures and the collaboration infrastructure comes together, you are ready to\
    \ move forward. Start with a pilot to build the solution before focusing on adoption\
    \ and commercialization to reap the benefits.\n\nA pilot helps build confidence\
    \ in the technology across the organization. Running a pilot proves to yourself\
    \ the technical feasibility of the solution. It also builds confidence across\
    \ the organization, especially with the leadership, to pursue the technology further.\n\
    \nAs you get to the point when it makes sense to invest, it’s time to act. If\
    \ you want to have a higher level of influence on the solution’s direction, go\
    \ for a founder-led consortium. Suppose there are multiple equal players in the\
    \ market. In that case, it might be better to partner with a consortium to come\
    \ up with a solution. And if the industry progression is such that there is already\
    \ an `ISV` coming up with a solution, look to see if it makes sense to join up\
    \ in their solution.\n\n#### Blockchain as GPT?\n\nGeneral purpose technology\
    \ (`GPT`) is a technology that is a core driver of economic growth. These are\
    \ few key technologies that drive economic growth and further technical progress\
    \ over extended periods. `GPTs` permeate multiple sectors of the economy, and\
    \ the downstream sectors use `GPTs` as input. Innovation in `GPT` fuels growth\
    \ in the downstream sectors. Because of this, as `GPTs` mature, their adoption\
    \ also becomes more entrenched throughout the economy. In their paper looking\
    \ at technical progress and economic growth, Bresnahan and Trajtenberg looked\
    \ at a few examples of `GPTs` like the steam engine, electric motor, computers,\
    \ internet, etc. [[102](#kvn36vkj.html#mvas0d8ryxp)\n"
  raw: 'Emerging technologies come with opportunity and risk. Therefore, they need
    to be managed appropriately. On the one hand, there is an immense potential to
    generate new value by participating in the innovation. And on the other hand,
    the newness comes with its own set of risks. There is always an accompanying drumbeat
    that can hype up the emerging technology as the next big thing. The decision to,
    or not to, evaluate, invest, and implement these technologies quickly can have
    far-reaching impacts for companies.


    For this reason, companies need to be tech-forward and figure out the right amount
    of time and energy to invest in emerging technology—just enough so that they know
    what is going on without missing the boat if it turns into something big.


    The question then becomes, how do we go about evaluating blockchain as an emerging
    technology? Do we want to take advantage of new developments without exposing
    our companies to undue risk with new technologies?


    #### **Enterprise Blockchain Adoption Framework**


    As I followed the breadcrumbs and looked closely at several early adopters’ blockchain
    journeys, a framework has evolved. Digital leaders can use this as a template
    to guide their blockchain strategy.


    This picture gives a depiction of the framework.


    ![](mvas0d8ryzu.jpeg)


    ##### **Learn**


    As an emerging technology shows promise, it is crucial to learn about it before
    jumping in with investments. To start your journey with blockchain, you first
    take some time to dip your toes in the water. Learning about the technology should
    inform future investments by a company.


    That learning is accelerated if you focus on bringing together various minds who
    are interested in the technologies. Internally this is best done by building a
    center of excellence (CoE). A CoE helps centralize the company’s blockchain skills
    and experience and build a repository for best practices. A CoE can also take
    the lead in executing the proof of concept and pilots. It can also provide training
    as part of the adoption process further down the line. 


    As Lisa Butters realized with Honeywell, a central team can also help illuminate
    new use cases. They can help the business side understand how blockchain technology
    could help. As she explains, “I don’t really recall, a hundred percent, how I
    got linked to our advanced tech team at Honeywell. But we had a small group of
    people who were dabbling, I would say, in blockchain technology. But they didn’t
    really have a good use case. I was able to meet with that team, introduce them
    to the marketplace, some of the barriers that we were faced with, how the industry
    operates today, etc. And that’s really how it all started.”[100](#kvn36vkj.html#mvas0d8ryxn)


    Externally, engaging with the community in the ecosystem is the way to go. It
    helps you build relationships within the ecosystem. These relationships help down
    the line as efforts go into nurturing the business network for consortium conversations.
    It is best to embed into the community to learn more and help others. Engage with
    others interested in the technology by attending blockchain-specific events and
    connecting with people who are pursuing an understanding of the technology. Besides
    trying to understand what others are building or what problems they are solving,
    contribute to the community by providing your input. 


    Doug McCollough did it well with the city of Dublin, Ohio. He explains: “We actually
    created a group, before we thought about developing a solution here, called the
    Dublin blockchain group. That was my attempt to plant a flag a few years ago,
    where we said, ‘We want all of the tech companies in the area to come out and
    sit down.’ Hackers, you know, people in the back rooms of their companies who
    are really experimenting and sort of keeping this skunkworks in secret, ‘Come
    out, and amongst friends, we’re just going to discuss them.’ We’ve had a few meetings
    of that, and a few companies emerged as really just being passionate about this.”[101](#kvn36vkj.html#mvas0d8ryxo)


    As you learn about the technology, it helps complete a proof of concept (POC)
    to get your hands dirty. The POC will help see the benefits that blockchain technology
    might bring and the limitations that come along with it. A POC also helps get
    a view into what use cases might be ripe to be tackled first. Building POCs also
    provide input as you present critical findings to the leadership team and discuss
    the business case.


    This learning phase is the starting point to build upon further action.


    ##### **Collaboration Infrastructure**


    In the learning process, you realize that blockchain is a team sport. It is best
    to play well with others. Those others might be your competitors, making it harder
    and different from other emerging technologies that companies would be evaluating.
    So evaluating market maturity becomes essential. 


    Is the industry ready to use the technology? Are there other players in the industry
    that are showing an interest in possibly collaborating? Blockchain technology
    cannot help achieve much if others are not ready to participate. What is the state
    of consortium development in your industry? Is some competitor taking the lead?
    Or is an independent software vendor coming up with a solution in which it makes
    sense to engage with them? Would data standards pose a barrier given the industry
    landscape? 


    All in all, you have to figure out and contribute to creating the collaboration
    infrastructure for the minimum viable ecosystem, which is the basis of successful
    blockchain adoption.


    As you learn about the technology, you should continually evaluate the technology
    opportunity in front of you. One factor to keep an eye on is the maturity of the
    technology itself. What are its current limitations? What is gaining traction
    with others? How much momentum is behind solving the gaps? Which platform providers
    are gaining momentum and getting more market share? How is the regulatory landscape?


    ##### **Commercialize**


    As the ecosystem matures and the collaboration infrastructure comes together,
    you are ready to move forward. Start with a pilot to build the solution before
    focusing on adoption and commercialization to reap the benefits.


    A pilot helps build confidence in the technology across the organization. Running
    a pilot proves to yourself the technical feasibility of the solution. It also
    builds confidence across the organization, especially with the leadership, to
    pursue the technology further.


    As you get to the point when it makes sense to invest, it’s time to act. If you
    want to have a higher level of influence on the solution’s direction, go for a
    founder-led consortium. Suppose there are multiple equal players in the market.
    In that case, it might be better to partner with a consortium to come up with
    a solution. And if the industry progression is such that there is already an ISV
    coming up with a solution, look to see if it makes sense to join up in their solution.


    #### **Blockchain as GPT?**


    General purpose technology (GPT) is a technology that is a core driver of economic
    growth. These are few key technologies that drive economic growth and further
    technical progress over extended periods. GPTs permeate multiple sectors of the
    economy, and the downstream sectors use GPTs as input. Innovation in GPT fuels
    growth in the downstream sectors. Because of this, as GPTs mature, their adoption
    also becomes more entrenched throughout the economy. In their paper looking at
    technical progress and economic growth, Bresnahan and Trajtenberg looked at a
    few examples of GPTs like the steam engine, electric motor, computers, internet,
    etc. [102](#kvn36vkj.html#mvas0d8ryxp)'
