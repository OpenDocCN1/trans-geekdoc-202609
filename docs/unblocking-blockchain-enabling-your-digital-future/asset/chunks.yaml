    新兴技术既带来了机遇也伴随着风险。因此，需要对其进行妥善管理。一方面，参与创新具有产生新价值的巨大潜力；另一方面，新颖性也伴随着自身的风险。总有一种伴随其来的鼓声，将新兴技术推崇为“下一个大热门”。决定是否对这些技术进行快速评估、投资和实施，将会对公司产生深远的影响。


    正因如此，公司需要具备技术前瞻性，并确定在新兴技术上投入合适的时间和精力——恰好能让他们了解正在发生什么，同时又在它演变成重大产物时错失良机。


    那么问题变成了，我们该如何将区块链作为一种新兴技术进行评估？我们是否想在利用新发展优势的同时，不让公司暴露在新技术带来的过度风险之中？


    ## 企业级区块链采用框架


    当我顺着线索仔细观察了几位早期采用者的区块链之旅时，一个框架应运而生。数字领导者可以借此作为模板来指导他们的区块链战略。


    这张图展示了该框架的描绘。


    ![](img/mvas0d8ryzu.jpeg)


    ### 学习


    当一项新兴技术展现出前景时，在投入资金之前对其进行学习至关重要。要开启区块链之旅，你首先需要花一些时间浅尝浅禁。对技术的学习应该为公司未来的投资提供参考。


    如果你专注于汇聚对这些技术感兴趣的各方人才，这种学习将会加速。在公司内部，最佳做法是建立一个卓越中心（`CoE`）。`CoE` 有助于将公司的区块链技能和经验集中起来，并建立一个最佳实践库。`CoE`
    还可以领先执行概念验证和试点项目。在随后的阶段，它还可以作为采用流程的一部分提供培训。


    正如 Lisa Butters 在霍尼韦公司意识到的那样，一个中心团队也可以帮助揭示新的用例。他们可以帮助业务部门理解区块链技术如何提供帮助。正如她所解释的：“我不禁百分之百地记得我是如何与霍尼韦先进技术团队联系起来的。但我们有一小组人正在——我可以说——在尝试区块链技术。但他们并没有什么好的用例。我能够与那个小组会面，向他们介绍市场、我们面临的一些障碍、行业目前的运作方式等。这真的就是这样开始的。”[100


    在外部，与生态系统中的社区互动是必经之路。这有助于你在生态系统内部建立关系。当投入精力培养用于联盟对话的业务网络时，这些关系将产生帮助。最好的做法是植根于社区，以学习更多知识并帮助他人。通过参加区块链特定的活动并与对技术感兴趣的人建立联系，与他们进行互动。除了尝试理解他人正在构建什么或解决什么问题之外，还要通过提供你的见解为社区做出贡献。


    Doug McCollough 在俄亥俄州都柏林市做得很好。他解释道：“在我们考虑在这里开发解决方案之前，我们实际上创建了一个小组，称之为‘都柏林区块链小组’。这是我几年前尝试插旗的努力，当时我们说：‘我们希望地区所有的科技公司都出来坐坐。’黑客，你们知道的，那些在公司后室里真正进行实验并以某种方式保持这种秘密工作站状态的人，‘出来吧，在朋友之间，我们只是要讨论它们。’我们开了几次这样的会议，几家公司脱颖而出，对这充满了热情。”[101


    在你学习技术的同时，完成一个概念验证（`POC`）有助于帮助你亲手实践。`POC` 将帮助看到区块链技术可能带来的收益以及随之而来的局限性。`POC` 还有助于观察哪些用例已经成熟并可以优先处理。构建
    `POCs` 还能向你向领导团队展示关键发现并讨论业务案例时提供输入支持。


    这一学习阶段是开展进一步行动的起点。


    ### 协作基础设施


    在学习过程中，你会意识到区块链是一项团队运动。与他人良好相处是最佳选择。那些他人可能是你的竞争对手，这使得比公司正在评估的其他新兴技术更加困难且与不同。因此，评估市场成熟度变得至关重要。


    行业准备好使用这项技术了吗？行业中是否有其他玩家表现出可能合作的兴趣？如果其他人没有准备好，区块链技术就无法取得太大成就。你们行业的联盟开发状态如何？是否有某个竞争对手正在领先？还是某个独立的软件供应商正在提供一种解决方案，使得与他们合作是合理的？考虑到行业格局，数据标准是否会构成障碍？


    总而言之，你必须弄清并贡献于创建最小可行生态系统的协作基础设施，这是成功采用区块链的基础。


    在你学习技术的同时，你应该不断评估眼前的技术机会。一个需要关注的因素是技术本身的成熟度。它目前的局限性是什么？什么正在获得关注？解决差距有多大的动力？哪些平台正在获得动力并赢得更多市场份额？监管格局如何？


    ### 商业化


    随着生态系统的成熟和协作基础设施的到位，你就准备好向前了。在专注于采用和商业化之前，先通过试点来构建解决方案。


    试点有助于建立公司内部对技术的信心。运行试点可以向自己证明解决方案的技术可行性。它还能增强整个公司（特别是领导层）进一步追求该技术的信心。


    当你达到投资是合理的时点时，是时候采取行动了。如果你想对解决方案的方向产生更高的影响力，请选择发起者领导的联盟。假设市场上存在多个平等的参与者。在这种情况下，与联盟合作制定出一个解决方案可能更好。

