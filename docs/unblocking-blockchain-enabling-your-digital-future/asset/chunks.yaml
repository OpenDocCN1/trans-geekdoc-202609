  raw: 'This consortia structure typically starts with a smaller number of participants,
    which helps better manage the politics of competitors needing to adjust to the
    new paradigm of working together toward a common goal. A steward of the blockchain
    network has to tackle technology, economics, and politics as different facets
    of the consortium. Having a smaller number of starting members helps not to complicate
    the politics. If the speed of decision-making is an important factor for the consortium’s
    success, having a consortium steward helps move things forward at a relatively
    faster clip. If other consortium partners have a similar idea of the solution,
    it helps with quicker decision-making.


    Although a smaller number of consortium members helps with faster decision-making,
    there is still a need to have large enough numbers to form a minimum viable ecosystem.
    After all, network effects influence the consortium’s chances of success. You
    can’t start a really good blockchain use case that provides value with smaller
    industry players. It is unlikely to have enough weight. It’s a delicate balance—keeping
    the numbers small to keep it manageable but large enough to have the outcome be
    material and attract other industry participants.


    On the flip side, though, this structure might cause friction for newer members
    of the consortium. They might fear that initial members will benefit more and
    rules are skewed against them. This can give newcomers a reason to hesitate and
    thus provide friction for adoption and get in the way of growing the consortium.


    An example of this consortium is in the retail industry centered around food safety.
    Walmart has been heavily involved in this initiative. Walmart is one of the world’s
    largest retailers and one of the first to pilot blockchain technology. Frank Yiannas,
    the vice president of food safety at Walmart, has come to appreciate the transformative
    possibilities of blockchain technology. As he explains, “I happen to be a big
    believer that blockchain is a new and emerging technology that has extreme relevance
    for food. But I have to tell you, when I first started at this, I was a major
    blockchain skeptic. But after working with it, and more importantly, piloting
    it, I’ve become a blockchain believer for sure.”[51](#txjwwcji.html#mvas0d8ryvt)


    The Centers for Disease Control and Prevention (CDC) and the US Department of
    Agriculture (USDA) data have documented the impact of contamination in food supply
    chains. The CDC estimates that one in six Americans get sick from contaminated
    foods or beverages each year, and three thousand die as a result. The USDA estimates
    that foodborne illnesses cost more than $15.6 billion each year.[52](#txjwwcji.html#mvas0d8ryvu)


    With technological advances, the food supply chain has grown a lot. Still, it
    comes with the challenge of keeping food safe throughout the system. Food contamination
    episodes have a widespread impact on companies in the ecosystem, starting from
    the producer to the retailers. It also negatively impacts consumer confidence.
    Consumers may eventually stop buying certain food products for fear of health
    hazards. Even if one lot has problems, retailers have to remove entire shipments
    from the shelves because it takes a long time to trace and identify the problem’s
    origin. They want to err on the side of safety. 


    Origin tracing is difficult and time-consuming because of various reasons. No
    one has complete visibility into data on the movement of goods across the entire
    supply chain. Typically each player in the supply chain only has knowledge of
    their transaction up the chain with their supplier and down the chain with their
    customer. A complete picture needs to be put together, one piece at a time. Stitching
    it together isn’t easy either because much of the record maintenance is not standardized.
    There is also widespread use of paper documents, which means that tracing has
    to be done manually and takes much longer than it would if digital records were
    being used. Because the records have been maintained manually—on paper—there is
    also a higher chance of data mistakes due to user error. The errors need to be
    reconciled to get an accurate picture. Many foods see commingling from multiple
    sources coming in from different countries, and traceability is further complicated.


    With the early adoption of blockchain, Walmart has seen some early gains. Walmart
    is focused on food safety, using blockchain technology to help them better manage
    their supply chains. They decided to tackle two use cases to run pilots—pork in
    China and mangoes in the US. These pilots have helped Walmart reduce the time
    it takes to track the origin of items and allows the retailed to have better availability
    of associated data through the supply chain to improve food safety and reduce
    waste. In their blockchain pilot on the pork supply chain in China, they could
    reduce the time needed to track down the meat source from twenty-six hours down
    to a few seconds. For the pilot on mangoes, as confirmed by Frank Yiannas, “We
    tried to trace mangoes, sliced mangoes back to the source. The current process
    took us about seven days, you know, pretty much the industry benchmark. Maybe
    a little bit faster than at times that happens in some of these health investigations.
    After blockchain, we could do it in 2.2 seconds.”[53](#txjwwcji.html#mvas0d8ryvv)


    Food safety is an area ripe for the use of blockchain technology. Players in the
    food safety ecosystem have an incentive to work together to solve the problem
    using blockchain technology. By its very nature, the ecosystem lends itself well
    to what blockchain can bring to the table. Because food safety is not a competitive
    issue, participants in the whole ecosystem have an incentive to cooperate. When
    a food safety issue happens—nobody wins. Suppose there is an E. coli outbreak
    with consumption of fresh spinach in the interest of consumer safety. In that
    case, all the spinach that is difficult to trace gets pulled from the shelves.
    This inability to quickly trace the source also hurts those whose supply chain
    did not carry the tainted products. This motivates the industry participants to
    work together and make the solution work. Over and above that, the overall system
    is too big for any single player to solve it by themselves, making sense to co-operate
    with the competitors.


    To provide traceability throughout the complete supply chain, this kind of effort
    needs leadership from a key player. That company coordinates other stakeholders
    and shows them what blockchain technology can offer to solve their collective
    challenges. The consortium has grown to include Dole, Driscoll’s, Kroger, Tyson
    Foods, and more. As we learned in Chapter 3, the consortium steward has to define
    the value for all participants in the ecosystem for its efforts to be successful.
    Otherwise, wider adoption by breeders, processing plants, cold storage facilities,
    distribution centers, and retail stores will be difficult to pull off.


    ##### **Neutral Third-Party-Led Consortium**


    A startup company or an independent software vendor (ISV) develops a blockchain-based
    solution to solve a shared problem within the industry in a neutral third-party-led
    consortium. This independent company brokers the consortium’s workings and manages
    the operational and governance structure to attract participants in the ecosystem
    to join the network. This neutral third party provides the lead in building the
    solution, starting from the product’s initial conception, and working toward development,
    and finally, implementation and support.'
