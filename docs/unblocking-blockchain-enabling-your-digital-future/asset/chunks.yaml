    # Chapter The New Machine Economy


    “More than 90 percent of blockchain projects are weaving in other technologies,
    especially the `IoT` and machine learning,” HFS research report tells us. We are
    beginning to harness the potential of other technologies like `IoT` (internet
    of things) and `AI` (artificial intelligence) together generating a whole that’s
    greater than the sum of its parts.


    Internet of things (`IoT`) refers to the multitude of physical devices—”things”—that
    connect to the internet. All these smart devices—smart lightbs, connected thermostats,
    fitness trackers, etc.—are meant to collect data about their environment and communicate
    with the network without the need for any human intervention. Gartner, Inc., forecasts
    that the enterprise and automotive internet of things market will grow to 5.8
    billion endpoints in 2020, a 21 percent increase from 2019. By the end of 2019,
    4.8 billion endpoints are expected to be in use, up 21.5 percent from 2018.


    Since these IoT devices’ job is to collect data and feed it to the network for
    other devices and systems, an immense amount of data is going to be collected.
    One of the primary concerns with IoT devices is their susceptibility to security
    vulnerabilities. This lack of security is concerning with the widespread use of
    IoT devices in smart homes and smart cars. Blockchain as a data-sharing mechanism
    for IoT devices can provide another level of security with available encryption
    and the tamper-evident nature of the technology. With its use in conjunction with
    IoT devices, blockchain can facilitate data distribution in a secure and trustworthy
    manner.


    Another challenge with this expansion in IoT devices is the load that it puts
    on the infrastructure. The sheer growth in the number of IoT devices anticipated
    to be in operation will generate large quantities of machine data that will be
    uploaded and need to be processed. That will heavily stress the current cloud
    infrastructure. Instead, it would help to build infrastructure at the edge to
    handle all these devices sharing data among themselves without needing to go back
    to the cloud. This edge infrastructure would help reduce latency and power the
    machine economy.


    Applications of `AI` are also getting ubiquitous. As you look to purchase something
    on your favorite website, you’ll find them acutely predicting what you are interested
    in buying. It then nudges you to look at a few more suggestions. That’s `AI` behind
    the scenes. When your voice assistant offers to recognize you by your voice, that
    is `AI` in action. When the social networking site automatically suggests names
    to be tagged in a photo, `AI` is at work.

