    # 第 3 章


    ## 核心在于经济学


    ### 关于加密经济学的作用


    种子网站曾使用去中心化的点对点系统共享文件，但效果并不理想。“在种子系统中，任何人都可以与去中心化网络共享文件。其理念是人们会下载文件并保持种子（即为他人下载共享文件）状态。问题在于这是基于信誉制度。如果你在下载文件，人们预计你也应该进行种子。问题是，人类并不是最诚实的生物，在没有经济激励的情况下，人们没有理由继续种子一个占用电脑不必要空间的文件。”32
    但在区块链网络中，加密经济学可以提供帮助。它将密码学和经济学结合在一起。它为参与者提供了激励，让他们以自维持的方式推动网络运行。


    假设你正在严谨地为公司创建一个基于区块链的解决方案。在这种情况下，你这样做是因为你认为它会为所有参与者创造经济价值。其意图是为参与者节省资金和时间，或者创造增加收入的新机会。在
    Synaptic 健康联盟的案例（第 2 章讨论）中，通过将各个网络参与者提供的多个数据源放入同一个数据库，他们希望获得能够节省成本的协同。作为这种经济逻辑的一部分，你必须考虑不同的利益相关者以及他们作为联盟良好经济公民加入并贡献该系统的激励。参与者可能看到他们从解决方案中获得的价值，但你如何激励他们参与并为联盟的健康做出贡献呢？


