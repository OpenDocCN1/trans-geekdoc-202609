    # Chapter 3


    ## It’s All about the Economics, Stupid


    ### On the Role of Crypto-Economics


    Torrent sites have used a decentralized peer-to-peer system to share files without
    much success. “In a torrent system, anyone can share their file with a decentralized
    network. The idea was that people would download them and keep seeding, aka sharing
    the file with the network for others to download. The problem was that this worked
    on an honor system. If you were downloading a file, then you were expected to
    seed as well. The problem is that humans are not really the most honorable of
    creatures, and without any economic incentives, it made no sense for people to
    keep seeding a file which took up unnecessary space in their computers.”[32](#ylwl2am7.html#mvas0d8ry)
    In a blockchain network, though, crypto-economics can help. It brings together
    aspects of cryptography and economics. It provides incentives for the participants
    to get the work done to keep the network going in a self-sustaining manner.


    Suppose you are going through the rigor of creating a blockchain-based solution
    for companies. In that case, you are doing it because you think it will create
    economic value for all the participants. The intention is to save money and time
    for the participants or create new opportunities to increase revenue. In the case
    of Synaptic Health Alliance (discussed in Chapter 2), by putting multiple data
    sources contributed by various network participants into the same database, they
    hoped to get synergies that would allow for cost savings. As part of this economic
    rationale, you have to think about different stakeholders and their incentive
    to join and contribute to the system as good economic citizens of the consortium.
    Participants may have a line of sight into the value they derive from the solution,
    but how can you incentivize them to participate and contribute to the alliance’s
    health?

