  trans: "\n\n# 第 9 章：供应链中的区块链\n\n牛奶溯源涉及的第二个维度围绕牛奶分销展开：从收集点到进入零售店的过程。在这里，牛奶的状况监测是关注重点。博世（Bosch）从奶牛舍到整个分销渠道都部署了传感器，测量各种牛奶特性。博世获取传感器收集的数据并将其置于区块链账本上。将这些传感器产生的所有数据存储在区块链上，为提供了温度、湿度等各种参数的可追溯性。这些数据可以收集牛奶从奶场到送往加工的整个过程。TrueFood+\
    \ 还可以通过动态二维码，在不同的存储点对某批牛奶进行监控，直到其到达零售点。91\n\n区块链、人工智能与物联网的无缝结合将实现下一代解决方案，并为价值创造开启新大门。当我们致力于在大范围内加速这些技术时，区块链可以帮助为这些新兴技术所使用的数据提供信任——从数据到信息再到智能，这些内容由物联网生成、由区块链驱动并由人工智能分析。\n\
    \n***\n\n* 85 Gupta 等，“忽视区块链将自食其灭。”\n* 86 Gartner，“将在 2020 年投入使用。”\n* 87 Palmer，“数据是新石油。”\n\
    * 88 博世全球，“万物经济。”\n* 89 Kulkarni，“博世的万物经济。”\n* 90 Kulkarni，“博世的万物经济。”\n* 91 博世工程与业务解决方案，“通过传感器转型。”\n\
    \n90 \n\nPalmer，“数据是新石油。”\nGartner，“将在 2020 年投入使用。”\nKulkarni，“博世的万物经济。”\n博世全球，“万物经济。”\n\
    博世工程与业务解决方案，“通过传感器转型。”\nKulkarni，“博世的万物经济。”\nGupta 等，“忽视区块链将自食其灭。”\n\n88 87 85\
    \ 91 86 89 \n\n根据 MarketsandMarkets 的研究，区块链供应链市场到 2026 年价值将达到 32 亿美元，在预测期间实现 53.2%的复合年增长率（CAGR）。92\
    \ 随着在多个全球供应链倡议中的应用，区块链技术显示出解决全球供应链管理某些问题的潜力。然而，该技术的应用成功程度参不齐。让我们来看看几个供应链场景，以及经验表明在这些情况下使用区块链解决方案。\n\
    \n## 消费者对产品透明度的需求日益增加\n\n消费者对产品的透明度要求越高。他们想知道产品是否是有机的、产自哪里以及是如何处理的。对于千禧一代和 X 世代消费者来说尤其如此，他们关注所购买食品的健康和安全。\n\
    \n“我们想知道产品是否是有机的、产自哪里以及是如何处理的，”David 说道，“对于千禧一代和 X 世代消费者来说尤其如此，他们关注所购买食品的健康和安全。”\n\
    \n区块链的使用可以提供满足这些需求所需的透明度。通过追踪从农场到餐桌的产品，公司可以验证其商品的真实性和质量。这可以建立消费者的信任并增加品牌忠诚度。93\n\
    \n## 食品供应链中的浪费：经济影响\n\n除了消费者信心外，污染还产生其他影响。污染导致的食品浪费对供应链产生了重大的经济影响。\n\n就供应链场景而言，除了面向消费者的一，公司采用区块链也有商业原因。之一是供应链发生了大量的浪费。食品浪费是一个大问题。召回是另一个问题。特别在美国，有很多召回，例如与农产品或肉类大肠杆菌爆发相关的召回。\n\
    \nPenta 与一家向许多零售商最大的苹果苹果包装厂合作了一个项目。该计划的目的是测试供应链中不同的传感器设备。在苹果产品生态系统中，所有销售都是寄售。在召回事件中，供应链上游任何环节都不会获得收入。如果这些苹果在零售店没有卖出去，那么包装厂就收不到钱，农民也收不到钱。\n\
    \n"
