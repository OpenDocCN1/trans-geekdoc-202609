- fmt: '

    # Open vs. Closed

    This is defined based on who can read data from the blockchain. Open blockchains
    allow the general public to consume data. Closed blockchains control access through
    permissions.


    # Permissioned vs. Permissionless

    Role-based access defines this aspect. Permissioned blockchains have the native
    ability to track and manage the identity of entities accessing the blockchain.


    As per aPricewaterhouseCoopers survey on how businesses are managing blockchains,
    companies are adopting both approaches; while 40 percent are using permissioned
    blockchains, 34 percent are working with permissionless chains, and 26 percent
    are taking a hybrid approach.[78](#nzx7zm4a.html#mvas0d8rywy)


    ## Use Case Considerations

    Looking to use case considerations, companies will decide what path to take.


    Coadjute first started working on their project by participating in the UK Land
    Registry’s procurement process. They realized that “for a government use case,
    a public platform enabled by cryptocurrency practically wasn’t feasible. The data
    would need to be in the UK.”[79](#nzx7zm4a.html#mvas0d8rywz)


    For `SCB`, one major decision they needed to explore was this: Are you going to
    use a private blockchain network or a public blockchain network? The deciding
    factor was the visibility of transacting parties. As Orapong explained, “With
    the procure-to-pay application, you normally deal with a closed loop—a limited
    number of suppliers and a limited number of buyers. You cannot even identify who’s
    the one who executed the trade. But the fact that you see information in the trade
    is a risk. If you see the price, even if you don’t know who buys that product,
    but you see a different price, and you see a buy, that creates trade issues. That’s
    why first we assess: Are we going public blockchain? Are we going private blockchain?
    And we decided private blockchain.”[80](#nzx7zm4a.html#mvas0d8ryw0)


    For `Optum`, managing the politics of technology and support for tokenization
    were driving factors in deciding to go with a public blockchain network. “There
    are three legs to the stool. It’s politics, economics, and technology. If you
    decide to make your own network, you have to tackle all three simultaneously.
    If you decide to piggyback on public `Ethereum`, and you can have a use case that
    runs on that, then you’ve essentially removed a lot of the politics around the
    actual execution of the network. And there are already network effects. So there’s
    a huge advantage to moving every private permissioned blockchain to a public permissioned
    blockchain, as quickly as possible.” That’s how Tony Little explained it to me.


    It makes sense to follow the general investment of dollars and time as criteria
    in choosing the technology. Investment of dollars by different players in a protocol
    and investment of time by developers in building the protocol means a robust ecosystem.
    That will help you connect your stack to proven technology. If the protocol supports
    tokenization, it helps you view data as an asset that can be the basis of microtransactions
    powering your consortium. Otherwise, you’ll end up using a third party and adding
    transaction cost to the consortium’s economy. “I think there’s a whole lot of
    work that’s being done out there today that just ends up falling flat because
    they don’t think about this multidimensionality,” explains Tony.


    State Farm also looked at multiple blockchain protocols. As Dustin Helland explains,
    “Early on we did take a look at some of the capabilities of the public blockchains,
    but then like most large enterprises, quickly latched on to the need for privacy
    and protection.”[81](#nzx7zm4a.html#mvas0d8ryw1)


    State Farm is using `Quorum`, which allows for an `Ethereum`-based private permissioned
    enterprise blockchain. It is an open-source technology that was initially released
    and governed by JP Morgan. `Quorum` enables permissioned network and private transactions
    within the `Ethereum` network, so they are not using the public `Ethereum` network
    in their solution. There were a few key factors that they took into account when
    they were deciding on a specific blockchain network.


    First, they needed a permissioned blockchain as transaction privacy was essential
    for them. Second, they looked at the maturity of different platforms at the time
    of evaluation. One thing that made them comfortable about `Ethereum` was that
    it had gone through public network adoption for quite some time. Third, they also
    took input from their developers to understand the developer’s point of view.
    What were the developers more comfortable working on? Developers look at different
    things like available documentation and contributions made between various individuals,
    companies, etc.


    One notable thing to look at is how the three leading platforms’ available architecture
    influenced their decision. For both `Corda` and `Hyperledger`, the architecture
    allowed for a master node, potentially having more power and authority. Whereas
    in `Quorum`, every node has the same privileges. As State Farm started on the
    project, choosing the architecture provided by `Quorum` was essential.


    ## Creative Funding Strategies

    For emerging technologies with no clear `ROI`, funding can always be an issue.
    You may have to get creative in getting the projects off the ground. Doug McCollough,
    with the city of Dublin, was well aware of scarce funding in public space. There
    is not much funding for innovative projects. The public sector project environment
    is also very risk-averse.


    Instead of using startup principles and modern IT practices like agile development
    and iterative processes, the approach in public sector is to have fully baked
    ideas that fit into a budget. That approach helps secure budget allocations. After
    that, the focus is on the project’s success rather than experimenting with innovative
    technologies. As Doug explains, “We don’t have a lot of funding. There’s no funding
    for these kind innovations. So you kind of have to partner and do public-private
    partnerships and explore a really low-budget kind of experiment. And that’s why
    we’ve done a proof of concept in a very limited way.”[82](#nzx7zm4a.html#mvas0d8ryw2)


    In the case of `Coadjute`, it was quite a joint effort where all the participants
    contributed. At the same time, `Coadjute` used its resources to build the core
    platform. As John Reynolds explained, “It genuinely was kind of collaborative
    effort. If any one organization had tried to do it, it would have been a really
    expensive project. But when you spread the cost of the project across forty businesses
    or so, it was affordable.”[83](#nzx7zm4a.html#mvas0d8ryw3) It ended up being quite
    the decentralized funding model very much in line with the blockchain’s decentralized
    ethos.


    ## Data Standards

    Data standards will play a significant role in how the project will move forward
    toward success. If there are existing industry standards, it’s better to adopt
    those instead of reinventing the wheel. For Jon Kuiper and `Vinturas` in the `FVL`
    space, the industry has a history of multiple costly `EDI` connections spread
    around, which leads to a lack of standards in transactional processes.


    They focused on the proof of delivery document (`CMR`), which is the document
    used to hand over the vehicle, e.g., from a transport company to the dealer, and
    is ordinarily paper-based and handwritten. They relied on the electronic `CMR`
    protocol approved by most European countries and created by regulatory bodies.
    Providing this document on the blockchain becomes essential from a fraud perspective.

