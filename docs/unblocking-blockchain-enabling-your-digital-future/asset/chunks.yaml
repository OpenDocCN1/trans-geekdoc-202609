  trans: '

    这是一个可能有助于进一步澄清该过程的可视化图。将区块链想象成共享表格中不断增长的交易列表。曾几何么时，人们需要在电子表格上进行协作；你会创建一个表格，完成工作，保存，然后将其发送给另一个团队成员，以便他们进行更新。在当今共享电子表格的世界里，你们可以同时处理同一份表格。区块链的工作原理与之相似。不同在于，在区块链上，数据是由多台计算机存储的。如果所有参与者都同意该数据是正确的，数据就会被存储。它还经过了加密，并且实际上无法删除的。


    现在让我们来看看技术定义，为我们对区块链的理解增添色彩。


    ## 技术定义


    ### 技术电梯演讲：


    区块链是一种`分布式数据库技术`，它在`通过 P2P 网络跨多个节点`上存储数据。该数据库是`只追加的`、`经过加密保护的`，并承诺使用`共识机制`。


    从核心上说，区块链是一种分布式账本技术。账本是交易按时间顺序的记录。账本的分布式特性是因为有多台计算机通过点对点网络存储它。节点是网络中可以保存数据的计算机之一。所有节点都拥有数据的完全副本，为我们提供了一个具有相同真相版本的共享现实。


    主流的数据库技术允许对存储的数据应用创建、读取、更新和删除（CRUD）功能。然而，区块链是一种只追加的数据技术。你只被允许创建或读取记录。不允许删除或更新。这一特性赋予了区块链不可篡改和易于检测破坏的特性。假设你需要对之前的条目进行更改。在这种情况下，你需要在添加新信息之前创建新条目，使之前的交易失效。


    在被添加到账本之前，会使用各种共识机制来确认交易的有效性。


    随着交易被确认并添加到账本，它们被分组在一个区块中。随着新区块的不断添加，它们使用密码学加密链接到上一个区块。这种交易区块的链接创建了一个连续的链——这就是“区块链”名称的由来。


    下面的图片将这一切整合在一起了：


    ![](img/mvas0d8ryzr.jpeg)


    ## 区块链优势框架


    区块链根据其各种特性带来的收益，具有独特的价值主张，可以帮助我们在现实世界中使用。让我们来看看这个收益框架。


    ### 共享真相：


    由于区块链数据是共享的，每个人都可以访问相同的数据。没有必要维护两个代表该数据的不同副本。假设双方想根据这些数据与彼此进行交易。在这种情况下，它消除了核实、对账或审计信息的负担。这些活动相关的任何成本也随之消失。因此，这还消除了维护保证数据真实性的中间人服务的额外成本。每个人都查看相同的数据现实使得这成为可能。


    ### 点对点网络上的多台计算机：


    拥有数据的各种分布式副本使得系统具有韧性。因为没有单点故障，所以它可以防止拒绝服务（`DoS`）攻击。假设其中一个对等由于由于原因无法访问。在这种情况下，你仍然可以访问存储在其他计算机上的数据，增加了整体的稳健性。


    ### 不可篡改性：


    由于实际上没有人可以删除数据，我们对共同的数据流现实具有透明度。这增加了对数据的信任，因为任何变化都可对其对其进行追溯和审计。可追溯性使我们能够在没有经过验证的第三方或中央机构帮助的情况下信任数据。


    ### 密码学加密：


    在区块链中使用密码学导致了数据安全性的提高。数字签名法允许两个互不信任的实体参与安全的交换。


    ### 共识：


    共识是区块链上所有对等者的认可机制，使他们对添加到区块链上的交易达成共同协议。它确保了交易是真实且可接受的。共识的使用使得不需要中央机构来验证和确认交易，并去除了中间人及相关成本。


    总的来说，这关乎信任。我知道对等节点已经验证了这些数据。我知道没有人篡改过它。我还可以看到它的演变。我看到数据是安全的。所有这些方面都构建了对区块链上数据的信任。


    ## 智能合约


    除了记录交易外，满足某些数据条件还可以自动执行实现业务规则的代码。例如，当你的仓库记录了一笔收货交易时，供应商的货款可以自动释放。这种代码被称为智能合约，它使得业务工作流的自动执行成为可能。


    通常，当两个人想要进行交易但并不相互信任时，合同可以提供帮助。在当前的范式中，他们信任独立的第三方来强制执行合约执行。这些第三方通常是大型机构，如政府机构、银行、律师和会计师。相反，智能合约将这些合约的自动执行逻辑构建在区块链上。我们通过确定性的输入获得了一致且可预测的输出。


    ## 区块链 vs DLT


    我们应该记住，分布式账本技术（`DLT`）是一个术语，而区块链是 `DLT` 的一种类型。也许因为它更口口，“区块链”一词在行业中受到了更多关注。在此本书的整个对话中，我将使用“区块链”作为普通名词来指代所有类型的
    `DLT`。最终，所有的 `DLTs` 都具有相似的特性，并旨在实现相似的结果。它们的方法可能不同，但结果是相同的。其中的一些例子包括 `IOTA Tangle`、`Ripple`
    和 `Hedera Hashgraph`。


    ## 区块链 vs 比特币


    我们还应该记住，区块链不是比特币，比特币不是区块链。我经常注意到人们经常将区块链误认为是比特币。当我把这本书的前两章给我的朋友 Glenn 以征求反馈时，他在读了摘录后说：“噢，我不知道比特币可以做所有这些？”
    尽管我在那些章节中没有一次没有提到过“比特币”这个词。


