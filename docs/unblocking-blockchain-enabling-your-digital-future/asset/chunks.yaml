    With all of that said, as we have seen in our inquiry through this book, there
    certainly is enough momentum in various industries with blockchain adoption. Blockchain
    has moved on from POC to commercialization. As Andrew Speers put it, “I think
    that the days of blockchain POCs are gone. We did two to three years of that.
    We know it works. We know what it does. Now we don’t have any luxury of building
    things for the sake of intellectual pursuit. It’s gone from emerging tech to ‘Tech.’
    And we are just getting on with commercialization, and testing, and using with
    customers.”[109](#kvn36vkj.html#mvas0d8ryxw)


    ### Enabling Our Digital Future


    My friend Venky keeps asking me, “What is the killer app built using blockchain?”
    And I honestly believe there is no answer to that question right now. We are in
    very early stages of the technology, with many technical limitations yet to be
    solved. The real transformative solutions are, however, yet to come. As the technology
    evolves and blockchain starts playing nicely with other emerging technologies
    like `IoT`, `AI`, `5G`, robotics, etc., the real killer apps will also come.


    For the end-users, blockchain has the potential to permeate our lives and make
    them better. It can go the way of the internet. Omnipresent in our lives. Working
    behind the scenes. We don’t need to understand how it works, but we still use
    it all the time without thinking about it. Taking it for granted. If I buy something
    online, I don’t need to know what happened behind the scenes to make the purchase
    happen. I just need to know that my security is not compromised, and I can easily
    do what I want to do.


    For companies, it will open up hitherto uncharted territories. It will be the
    backbone of a connected digital economy and help other emerging technologies extend
    their potential. Blockchain will do for business ecosystems what `ERP` did for
    the single enterprise. As Brigid McDermott from IBM put it, “Blockchain has the
    potential to transform transactions, the way that the internet transformed communications.”[110](#kvn36vkj.html#mvas0d8ryxx)


    Blockchain is not there yet, but signs suggest that it will get there soon. When
    we get there, it will transform our social and economic paradigms.


    Blockchain will be the glasses that we didn’t know we needed. We just might see
    the leaves of trust for the first time.


