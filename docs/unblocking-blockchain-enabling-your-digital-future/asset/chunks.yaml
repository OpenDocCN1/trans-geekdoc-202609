    # 第 7 章：为成功做好准备


    公司通常通过与社区学习以及运行概念验证（POC）来开启它们的区块链之旅。随着他们对区块链的进一步了解，他们意识到这是一项团队运动，因此他们开始加强行业内的关系，并专注于构建业务网络，可能是以财联盟的形式）。接下来，他们将达到一个可以运行试点并实现商业化的阶段。


    ## 管理认知


    随着我对区块链的越发深入，我到了一个阶段，即希望定义一个金融引擎来驱动我的区块链业务。我比比加入一个智库小组（mastermind group），使其能够作为一个咨询系统和支持小组，以保持正轨。在进行几次网络搜索后，我决定联系一家将人们按批次聚集在一起并启动智库小组的公司。


    值得赞的是，他们在组建小组方面非常严谨。他们流程的第一部分包括填写问卷，随后是面试。其中一个问题是提供一个描述我公司服务的网页链接。我提供了我的博客链接。面试开始时，那个女人试探性地问我的第一个问题是：“所以，你是做关于比特币的业务吗？”


    当时，我觉得这很有趣，因为在我的博客上，没有一次提到过“比特币”这个词。相反，到处贴的“区块链”这个术语。博客的标题是*区块链的意识流*（The Blockchain
    Stream of Consciousness）。然而，她在脑海中已经自动“注册”了比特币。


    随着我与越来越多的人交流，显而易见，围绕区块链技术的项目面临着认知上的阻力。


    在普遍认知中，区块链和比特币是紧密交织的。以此类推，区块链必须面对比特币与洗钱、资助恐怖活动、暗网、丝绸之路等非法活动之间产生的负面联系。


    当区块链的早期爱好者开始与公司内部的人交流时，管理这种对区块链项目的关联感和认知是必要的。请准备好回答这个问题：“区块链不和比特币是一样的吗？”


    “一个障碍是认知。当你使用‘区块链’这个词时，人们听到的是加密货币。他们听到比特币，但听不到区块链。我们只是开始称它为‘数字身份’而不是区块链，因为后者会分散人们的注意力，”道格·麦科洛（Doug
    McCollough）说道。


    道格是俄亥俄州都柏林的首席信息官（CIO），目前正领导着该市将新兴技术整合到日常运营中。都柏林是俄亥俄州西北角一个人口约五万的小型社区。这是一个以技术为中心的城市，拥抱了利用技术来促进其经济发展利益。从那里，他们拥抱了成为智能城市领导者和创新者的理念。


    道格对数字化变革给政府带来的影响非常清楚。他试图通过在城市运营中采用新兴技术来让城市保持领先。但没有人预料到颠覆的到来。大多数时候，主流叙事都是现状。


    政府颠覆的一个例子是人们现在如何信任地图服务。如果地图服务说某条路是开放的，你就认为它是开放的。然而，可能有人移除了市里设置的指示牌。如果地图服务建议人们采取行动——那就是一种颠覆。


    城市在成为智能城市的历程中不断前进，并依赖数据驱动的决策。是软件公司而非政府，引领了所有进入联网汽车的技术。政府不再是人们生活中首要的安全伙伴。


    “我们倾向于看着城市并说：‘待在你们的道路上，除雪，修剪草坪，修补路洼，减我的税，我就满意了。’我们没有考虑到城市正在和一直提供的各种服务。如果城市不创新，那么我们就会像任何业务一样被颠覆。我们和其他人一样都是创新的候选者。我相信将会有一个全新的分布式数据环境。就像互联网改变了一切，区块链和分布式数据环境也将改变一切，”道格解释道。对于都柏林来说，这就是追求基于区块链的数字身份项目的动力——为技术可能带来的颠覆做好准备。


    除了与比特币关联的挑战外，使用“区块链”一词也会在其他方面分散人们注意力。他们开始将项目与当下的热点联系起来，将其与追逐热潮联系在一起。对话偏离了对项目交付物价值的考量。这也开始影响这些创新项目的可用资金情况。


    ## 投资创建社区


    创建一个爱好者社区有助于定义用例。在这一方面，道格·麦科洛创立了都柏林区块链小组（Dublin blockchain group）。他希望将都柏林地区对区块链感兴趣的技术公司和个人聚集在一起，这些人可能一直在后台进行实验。通过这种努力，一些公司开始成为对区块链充满热情的群体。


    小组的活动有助于开始构思这样一个想法：即政府如何利用区块链为公民创造价值的绝佳用例。现在，都柏林区块链小组帮助那些对区块链技术好奇并在后台进行实验的人建立社区感，并加速学习。


