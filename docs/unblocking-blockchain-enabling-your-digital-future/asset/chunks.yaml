    The aspect of time is vital in the case of blockchain projects when making early
    decisions. Various factors come into play that can contribute to more time being
    needed for a blockchain project to show returns. Blockchain projects come with
    change. People naturally resist change. It is, therefore, necessary to have a
    long-term perspective and lots of patience to allow time for people to adjust
    to the new normal. With multiple stakeholders’ involvement, getting numerous organizations
    aligned and moving forward in a new way of working as a cooperative is difficult
    for blockchain projects. The need to have a consensus as the way to move forward
    also requires an investment in time.


    A core part of the value from blockchain is due to network economics. Businesses
    built to harness network effects generally take years to become profitable. “If
    I had to give one piece of advice, it would be to really understand what is the
    value that blockchain and a blockchain network are bringing to your project, and
    be really precise about that. And then be patient. The network businesses, the
    social networks that we look at now took years to build, right? Their value really
    came from getting, you know, two-thirds of the world’s population on Facebook
    or whatever else you want to talk about. And so the value from blockchain-based
    networks are going to be similar,” says Stephanie Hurder, who we met in Chapter
    2.[40](#305yc3s4.html#mvas0d8ryv6)


    We have various examples of network businesses that took years before becoming
    profitable around us. Facebook is one example, as is Twitter.[41](#305yc3s4.html#mvas0d8ryv7)
    For any product or service that relies on network effects, the making of big money
    for the founding members will be several years into the future. Looking at an
    ROI number in the short term would be an incorrect metric to make decisions about
    pursuing a blockchain project. Can a senior leader in a technology company adopt
    such a long-term perspective in the face of investor scrutiny?


    #### **Investment as a Factor: The Need for More Investment**


    “Something like blockchain and distributed ledgers—they require a critical mass
    to achieve the benefits. And getting enough people educated, getting enough people
    through that POC journey, getting enough people through their investment committees
    and to the end of it, with extra money to spend on commercialization, has taken
    a lot longer because you need that network effect for it to be successful,” says
    Andrew Speers.[42](#305yc3s4.html#mvas0d8ryv8) Andrew has worked as director of
    products and innovation at Royal Bank of Scotland (RBS). RBS is an international
    banking and financial services company. They are involved with various blockchain
    initiatives in partnership with other industry players: first, Coadjute, working
    on streamlining the UK property market; second, Marco Polo, a finance network
    of banks, technology partners, and corporations working on transparency in trade
    finance; and third, Contour (formerly Voltron) working in the trade finance industry,
    starting with the Letter of Credit. With his involvement in blockchain projects
    at RBS, Andrew has developed a good insight into the efforts needed to move blockchain
    projects forward.


    Working with multiple blockchain projects, RBS realized that many factors increase
    the costs in ROI calculations. Besides giving time for network effects to play
    out, you also have to make early investments in learning about the technology.
    With large banks like RBS, if any bank’s business customers have a multi-product
    need, their experience is typically very fragmented. And why wouldn’t it be? A
    user’s journey does not necessarily influence product design. In banks, typically,
    product creation revolves around the silos of specific expertise within the bank.
    While getting service for a complicated need, a corporate customer will have to
    go through silos like originations function, the credit assessment, forex, trade
    finance, insurance, risk, etc. Going through all these silos ends up creating
    a very disconnected experience for the customer.


    One cause of the disconnected user experience is how larger financial organizations
    acquire other smaller companies with their own systems and processes. At times,
    the acquiring company’s response could be to keep the acquired company as separate
    organizations, continuing to use their own systems, which will need to be integrated.
    This approach further adds to the internal fragmentation contributing to poor
    user experience.


    To respond to these and other industry challenges affecting user experience, RBS
    identified an opportunity in blockchain quite early. As Andrew says, “Technology—distributed
    ledger technology is coming to a maturity point now, where it’s helping people
    knit some of this together. The technology is catching up. We can create client-centric
    user experiences by having a distributed architecture with identifiable data that
    we can seamlessly stitch together into bespoke propositions. So, you can have
    a little bit of FX attached to a little bit of credit assessment, attached to
    a little bit of trade finance, etc. Once your data goes into the distributed machine,
    smart contracts can then send the data to where it needs to go and transact on
    it automatically, or more automatically than it is at the moment, to improve the
    user experience.”[43](#305yc3s4.html#mvas0d8ryv9)


    With blockchain, very early on, RBS had engineering teams with some brilliant
    people take a look at the technology. Engineers tested and played with and got
    used to the technology. Once it got to a point where it was clear that there were
    enough use cases, they created a community of practice with its center of excellence
    around blockchain.


    When companies are at the beginning of their blockchain journey, the organization’s
    understanding of commercializing an emerging technology will be limited. Having
    it run through a centralized function focused on blockchain technology helps evaluate
    the extensive list of use cases. An investment in building a COE is an upfront
    cost contributing to the denominator in an ROI calculation. As Andrew confirms
    on the choice made by RBS, “Any organization needs to be prepared to burn a little
    bit of money as something new is coming up, to test it, and play with it. And
    we did that very early on in the picture.”[44](#305yc3s4.html#mvas0d8rywa)'
