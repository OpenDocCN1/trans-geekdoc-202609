- fmt: "\n# Chapter 9: Blockchain in Supply Chain\n\nThe second dimension addressed\
    \ in the provenance of milk revolves around milk distribution: the point from\
    \ which it is collected to being available in the retail store. Here, condition\
    \ monitoring of the milk is the main focus. Bosch has sensors starting from the\
    \ milk barn and throughout the distribution channel, measuring various milk characteristics.\
    \ Bosch has taken the data collected by the sensors and put it on a blockchain\
    \ ledger. Storage of all the data generated by these sensors on the blockchain\
    \ provides provenance of various parameters like temperature, humidity, etc. This\
    \ data can be collected for the milk from the barn until it gets dropped off for\
    \ processing. TrueFood+ can also help monitor a batch of milk using dynamic QR\
    \ codes through different storage points until it is available at retail points.[91](#uauddjkp.html#mvas0d8ryvj)\n\
    \nA seamless combination of blockchain, AI, and the internet of things will enable\
    \ the next generation of solutions and open new doors for value creation. As we\
    \ look to accelerate the adoption of these technologies at scale, blockchain can\
    \ help provide trust in the data used with these emerging technologies—from data\
    \ to information to intelligence, generated by IoT, powered by blockchain and\
    \ analyzed by AI.\n\n***\n\n* [85](#uauddjkp.html#mvas0d8ryvk) Gupta et al., “Ignore\
    \ Blockchain at Your Peril.”\n* [86](#uauddjkp.html#mvas0d8ryvl) Gartner, “Will\
    \ Be in Use in 2020.”\n* [87](#uauddjkp.html#mvas0d8ryvm) Palmer, “Data Is the\
    \ New Oil.”\n* [88](#uauddjkp.html#mvas0d8ryvn) Bosch Global, “Economy of Things.”\n\
    * [89](#uauddjkp.html#mvas0d8ryvo) Kulkarni, “Bosch’s Economy of Things.”\n* [90](#uauddjkp.html#mvas0d8ryvp)\
    \ Kulkarni, “Bosch’s Economy of Things.”\n* [91](#uauddjkp.html#mvas0d8ryvq) Robert\
    \ Bosch Engineering and Business Solutions, “Transformation through Sensors.”\n\
    \n90 \n\nPalmer, “Data Is the New Oil.”\nGartner, “Will Be in Use in 2020.”\n\
    Kulkarni, “Bosch’s Economy of Things.”\nBosch Global, “Economy of Things.”\nRobert\
    \ Bosch Engineering and Business Solutions, “Transformation through Sensors.”\n\
    Kulkarni, “Bosch’s Economy of Things.”\nGupta et al., “Ignore Blockchain at Your\
    \ Peril.”\n\n88 87 85 91 86 89 \n\nAs per the research done by MarketsandMarkets,\
    \ the blockchain supply chain market will be worth $3.2 billion by 2026 and grow\
    \ at a compound annual growth rate (CAGR) of 53.2 percent during the forecast\
    \ period.[92](#r5xklr8a.html#mvas0d8ryuh) With its use in several global supply\
    \ chain initiatives, blockchain technology is showing promise to solve some issues\
    \ with managing global supply chains. However, the success with the use of the\
    \ technology has been varied. Let’s look at a few supply chain scenarios and what\
    \ experience has shown to use blockchain solutions in these situations.\n\n##\
    \ Increased Consumer Pressure for Transparency in Products\n\nConsumers are increasingly\
    \ demanding transparency in products. They want to know if a product is organic,\
    \ where it was from, and how it was handled. This is especially true for millennial\
    \ and Gen X consumers, who are concerned about the health and safety of the food\
    \ they buy.\n\n“We want to know if the product is organic, where it was from,\
    \ and how it was handled,” says David. “This is especially true for millennial\
    \ and Gen X consumers, who are concerned about the health and safety of the food\
    \ they buy.”\n\nThe use of blockchain can provide the transparency needed to meet\
    \ these demands. By tracking a product from the farm to the table, companies can\
    \ verify the authenticity and quality of their goods. This can build trust with\
    \ consumers and increase brand loyalty.[93](#r5xklr8a.html#mvas0d8ryuh)\n\n##\
    \ Waste in Food Supply Chains: The Economic Impact\n\nBesides consumer confidence,\
    \ contamination also has other impacts. Food waste due to contamination has a\
    \ substantial economic impact on the supply chain.\n\nAs far as supply chain scenarios\
    \ go, besides the consumer-facing side of things, there are also business reasons\
    \ for companies to adopt blockchain. One is that there’s a tremendous amount of\
    \ waste that happens in the supply chain. Food waste is a huge issue. Recalls\
    \ are another issue. In the US context, in particular, there are many recalls,\
    \ e.g., those related to E. coli outbreaks in produce or meat.\n\nPenta did a\
    \ project with the largest apple packing house out of Michigan that delivers apples\
    \ to many retailers. They were the first apple packing houses in the United States\
    \ to have a recall of apples. The purpose of the initiative was to test different\
    \ sensor devices in the supply chain. In the apple produce ecosystem, all sales\
    \ are on consignment. Nobody upstream in the supply chain gets any revenue in\
    \ a recall event. If those apples don’t sell at the retail store, then the packing\
    \ house doesn’t get paid, and the farmers don’t get paid.\n"
