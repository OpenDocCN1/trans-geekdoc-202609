    # 第 6 章：构建协作基础设施


    “与你的竞争对手合作并不总是易的；它需要一种与你可能过去二十、三十或四十年所拥有的截然不同的心态，”Jon Kuiper 解释道。56 区块链为安全协作提供了基础设施，让竞争对手可以共同创造价值。将竞争对手汇聚成为成功生态系统的一部分需要一种多管齐下的方法，正如我在
    Lisa Butters 讨论 `GoDirect Trade` 时发现的那样。


    GoDirect 是一个针对二手航空领域零部件的亚马逊式市场，它将买家和卖家联系在一起并简化了他们的体验。它是财富富 100 强公司霍尼尔（Honeywell）的一部分。在航空领域领域，霍尼尔扮演着多种角色。他们是原始设备制造商
    (OEM)，制造从组件到发动机的一切产品。他们还是一家维修设施。他们还参与二手航空零部件的交易。


    “在今天早上的电话中，我们谈到了二手航空零部件，以及为什么人们对在线进行此类交易如此迟疑。我们很多讨论了这与二手汽车行业有很多相似之处。所以，购买二手汽车——我认为其中某些观念是，为了买二手车，人们觉得迫切需要对价格进行谈判。这是他们的习惯。他们觉得如果不讨还价，就得不到最优价格。我认为这与二手航空零部件是一个非常好的类比。人们觉得，如果不在这些部件上谈出最优价格，他们就是不负责任的，”`GoDirect
    Trade` 经理 Lisa Butters 解释道。57


    别提二手车了——我认为我们所有人在买新车时的心态都是一样的——都做好了谈判的准备。


    根据 ICF 的数据，去年二手飞机零部件市场价值为 54 亿美元，其中 60% 与发动机相关，36% 与组件相关。预计市场规模到 2026 年将增长到 77
    亿美元。58 该行业大多数交易仍在线下进行，通过传统的途径：打电话给你认识的人或给他们发邮件。你只和你认识并信任的人合作。因此，一笔交易需要很长时间才能完成。


    正如《华尔街日报》的一篇文章报道的，“在区块链之前，一笔交易平均需要两次电话和四封邮件来安排，并花两天时间完成。发动机等大型部件的销售可能需要数周时间来发送报价和交换文件.”59


    购买过程是手动操作且主要在线下进行的，主要出于两个原因：


    *   首先，由于市场所交易的部件性质，这些通常是高价值交易。虽然有像螺母和螺栓这样的小物品，但也有价值数百万的发动机以及其之间的任何产品。平均交易额约为
    10,000 美元。

    *   另一个原因是航空行业有极高的安全门槛。这些部件必须足够安全，才能重新安装在飞机上，从而安全地运载乘客。


    其他尝试缩短购买周期的参与者也遇到了一些问题。为了在过程中加强买家信任，这些参与者试图从卖家那里获得质量证明；尽管如此，他们在执行这些规定方面的意愿还不足。无法为买家提供有关购买部件质量的持续透明度，使得这些市场很容易失败。卖家对平台的采用也面临阻力。他们不习惯拥有在线商店来开展业务。毕竟，他们多年来一直通过电子邮件和电话销售。


    当平台上线时，`GoDirect Trade` 团队知道在线交易不会一夜之间就发生。他们开始调查需要什么才能鼓励买家和卖家搬到平台并摒弃旧习惯。他们开始通过打电话和发邮件来了解市场动态。他们意识到，要让人们参与电子商务，良好的客户体验以及“三个
    P”（价格、图片和纸质）仅仅是入场券。要帮助整个行业摆脱过时的纸质和离线交易，需要的远不止于此。由于交易金额巨大，人们对信任存在抵触情绪。航空行业的高标准也从质量角度为信任过程增了更多摩擦。


    正如 Lisa 所解释的那样，“我们认为这底归结为信任。这种电子商务交易缺乏足够的信任，因为平均订单金额很高，而且从质量角度来看必须有很多内在的信任。因此，我们需要考虑其他技术，例如区块链，试图凿掉那块不信任的大石。因为这不仅关乎良好的客户体验，还要通过向消费者提供透明度将这一通道引入数字时代.”60


    对于区块链技术尚未普及的航空行业，霍尼尔正专注于与其他参与者合作。正如 Lisa 解释道：“对于霍尼尔来说，我不会说我们正在单打独斗。如果非要说的话，我找不到哪家航空公司比热衷于与其合作——无论是小店还是大企业——来尝试区块链试点。之所以这样做是因为区块链真正是一项团队运动。如果你单打独斗，你什么也得不到。你只能得到自己的数据，没有其他益处，对吧？你还不如拥有一个数据库.”61


    ### 降低关系特定投资


    挑战之一是“事持问题”（Holdup）。假设你和我考虑签订一份商务合同。为了履行我承诺的一方，我必须进行一些我本不会做的投资。例如，我可能需要购买一些新软件、实施它，并调整我的业务流程使其运行。这些被称为关系特定投资。当我已经完成了关系特定投资后，事持问题就会出现。除非我们有利于你的的方式重新谈判合同，否则你可能会拒绝履行你承诺的一方。如果情况不妙，我就在关系特定投资上浪费了资源。


