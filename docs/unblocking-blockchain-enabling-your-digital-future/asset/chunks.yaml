  trans: '


    与 Vinturas 一样，首先你应该决定为了正确的理由使用区块链技术，即创造价值。之后，你还必须定义如何为各种参与者产生价值。重点应该放在为整个价值链中的所有参与者提供的价值上。价值可以表现为为参与者节省的成本，也可能来自开启此前无法实现的新收入生成方式。记住，不同的利益相关者将以不同的可能方式获得价值。Vinturas
    通过考虑所有参与者（包括价值链上游的参与者，如 OEM）所需的激励，为自己的成功奠定了基础。因此，网络的业务架构从项目初期就需要被强调。


    Vinturas 从欧洲的三家公司开始，随着时间的推移，又增加了三位想要合作的股东。Vinturas 现在代表了欧洲新车移动市场约 25% 的份额。对于 Vinturas
    而言，重点在于为 FVL 公司以及价值链中的所有其他参与者（包括 `OEMs` 和理赔处理人员）提供关键效率。集体使用一套标准化的数据集可以显示端到端供应链的状态。通过这一点，生态系统可以摆脱共同的敌人，即流程中充斥的所有文书工作。远离纸质流程将对优化成本结构产生巨大帮助。


    ## 区块链网络成熟度模型


    **![](img/mvas0d8ryzq.jpeg)**


    通常，一个新的区块链计划将从小的一组初始创始伙伴开始。希望该联盟最终会不断扩大，并为所有参与者提供不断增长的价值。随着业务区块链网络经历其生命周期并成熟，关注不同的价值创造杠杆将有所帮助。我们可以使用区块链网络成熟度模型来帮助在网络增长期间观察这些杠杆。识别在网络生命周期的不同阶段哪种杠杆将提供更多价值是至关重要的。


    ### 双边交易：两个合作伙伴贡献数据集的价值创造


    当你开始时，可以先分阶段地构建网络经济，以处理双边用例。首先处理双边用例将使参与者尽早获得价值。这些用例并不一定依赖于大量参与者的采用才能提供价值；例如，使用
    `smart contracts`（智能合约）来实现对仓库收到的货物进行自动支付付款的用例。在非区块链世界中，各种环境中存在的摩擦之一就是监控和执行合同有多大的挑战性。仅仅因为你与另一方有合同，并保证对方或实体会履行他们说过的要做的事情。区块链中
    `smart contracts` 的承诺之一是，只要满足合同条件，合同就会自动执行。拥有 `smart contract` 通过增加双方对业务关系承诺的信誉度来增加价值。它消除了交易对手风险。


    ### 多边网络效应：多个合作伙伴贡献数据集的价值创造


    这一层价值创造指的是网络效应。当你汇集各种参与者时，网络效应就会发挥作用。由于其他人现在参与了进来，他们的价值增加了。然后，你可以扩展网络正在处理的用例。现在，随着小组的成熟和增长，你可以包含将从多边交易中获益的用例。在
    `Synaptic Health Alliance` 的案例中，多个保险支付方聚集在一起共享数据集。在这里，如果有更多参与者加入数据池，网络的价值就会更高。随着小组成熟，参与者数量的增长更有可能发生。


    ### 改进的服务：通过使用现有数据通过更好的解决方案创造价值


    改进的服务是通过获取他人贡献的数据、对其进行分析并提出解决方案解决方案而。在 `Siam Central Bank` 的案例中，银行可以因为风险降低而降低贷款成本。正如
    `Orapong` 为 `SCB` 解释的那样，过去，由于发票审批需要三周，银行在提供融资之前必须等待很长时间。现在银行多出三周时间为供应商提供发票融资，因为发票审批时间已缩短到一天。在发展中国家，银行还面临额外风险，因为供应商可能使用同一张发票向多家银行申请发票融资。银行需要对资金进行定价以补偿这种风险。但有了这个平台，`SCB`
    是支付银行也是融资银行。银行从 `PO` 发出到货物发货并开具发票的时刻可以看到这笔交易。因此他们知道发票是真实的，没有任何催收风险：“这样，你不是以 18%
    的利率提供融资，而是以低于 5% 的利率提供。”[38 这种这种情况使他们能够基于区块链的解决方案，利用相同的数据提供改进的服务。


    ### 新用例：利用现有数据开启的新用例价值创造


    接下来，看看你可以如何利用已经为某个用例启动的联盟来启动另一个用例。在考虑构建新用例时，你应该首先查看已经贡献的数据。基于此，决定下一个启动的用例。不建议从一个需要全新的数据集和新加入参与者的用例开始。尝试在上一个用例的成功基础上构建它。


    区块链网络成熟度模型并不是说价值创造将总是线性的。取决于团队的雄心程度，你可以选择任何杠杆来处理价值创造。然而，理解你正在使用哪种杠杆并将其与网络的成熟度相匹配将增加成功的机会。


    总而言之，区块链可以为试图用它解决共同挑战的群体带来巨大的经济价值。


