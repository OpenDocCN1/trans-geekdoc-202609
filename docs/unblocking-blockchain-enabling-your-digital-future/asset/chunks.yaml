- fmt: "\nGartner’s new business value forecast methodology quantifies the value of\
    \ a technology’s innovation. It looks at factors of customer experience, new revenue,\
    \ and cost reduction. According to this methodology, in the context of blockchain,\
    \ “The business value-add of blockchain will grow to slightly more than $176 billion\
    \ by 2025, and then it will exceed $3.1 trillion by 2030.”[15](#iapjtig6.html#mvas0d8rytj)\
    \ We are talking big numbers here. With such expectations from the technology,\
    \ everyone wants to get involved. They want to make sure they are not getting\
    \ left behind. Although, the critical question is, are you getting involved in\
    \ blockchain for the right reasons?\n\nStephanie Hurder is a founding economist\
    \ at Prysm Group, an economic advisory firm focused on implementing emerging technologies,\
    \ and an academic contributor to the World Economic Forum. She has been an active\
    \ participant in enterprise blockchain initiatives. Working with various projects,\
    \ she can see some familiar trends showing up. She explains, “You’ll have a consortium\
    \ announced that they have a proof of concept or that they’re going to do a pilot\
    \ for a specific use case. And then a year later, you come back, and you say,\
    \ ‘Oh, I wonder what happened to that pilot, sort of never heard from again,’\
    \ and we just see this pattern over and over again.”[16](#iapjtig6.html#mvas0d8rytk)\
    \ The projects just didn’t bring in the results.\n\nThis observation can also\
    \ be backed by data. According to a PricewaterhouseCoopers survey, of the respondents\
    \ who report a blockchain project in the pilot stage, 54 percent say the effort\
    \ sometimes or often didn’t justify the result.[17](#iapjtig6.html#mvas0d8rytl)\n\
    \n“My investors are asking about our blockchain strategy, and I need some tutoring\
    \ on the topic,” my friend Sandeep said. Of course, he got the help he needed,\
    \ but it left me wondering. His reason to look into blockchain technology was\
    \ not a business problem that he was trying to solve, for which blockchain was\
    \ identified as the solution. Instead, he needed to look into the technology for\
    \ external reasons. \n\n![](mvas0d8ryzo.jpeg)\n\n© PwC. Not for further distribution\
    \ without the prior written permission of PwC. PwC refers to the US member firm\
    \ or one of its subsidiaries or affiliates, and may sometimes refer to the PwC\
    \ network. Each member firm is a separate legal entity. Please see [www.pwc.com/structure](http://www.pwc.com/structure)\
    \ for further details.\n\nOn one side, there is such potential, but on the other\
    \ hand, the potential seems to be faltering. Blockchain can add significant value\
    \ to companies, but they need to be clear on what the value drivers are and who\
    \ is getting the value. Many projects are unclear on their reasons for using blockchain\
    \ technology instead of existing technologies in the context of a particular use\
    \ case. If projects just follow the hype and do not link their efforts to value,\
    \ they increase their chances of not being heard from again.\n\nAs per a 2019\
    \ Gartner prediction, “Ninety percent of current enterprise blockchain platform\
    \ implementations will require replacement by 2021.”[18](#iapjtig6.html#mvas0d8rytm)\
    \ A key reason for that is not linking use cases with the business benefits of\
    \ blockchain.\n\n## On Staying Competitive\n\nOne lens through which companies\
    \ can look at new technology is this: What can this technology do to hurt my business?\
    \ Looking through this lens is all about competitive advantage. If competitors\
    \ use this technology to disrupt the competitive landscape, we will be at a disadvantage.\
    \ The question then really is: How do we get ahead of the curve? \n\n“A 2019 study\
    \ by the Enterprise Strategy Group showed that most leading organizations already\
    \ see the essential nature of emerging technologies. Eighty-two percent of organizations\
    \ agree or strongly agree that without emerging technology, they will not be able\
    \ to transform. And if they don’t transform, a competitor will disrupt their business.”[19](#iapjtig6.html#mvas0d8rytn)\n\
    \nStaying competitive is what prompted Siam Commercial Bank (SCB) to look at blockchain.\n\
    \nAs Orapong Thien-Ngern explains, “We realized that one of the ways for the bank\
    \ to continue growing or recover the low return on equity is to branch out from\
    \ the traditional business. We are still mainly a financial institution, but we\
    \ start looking at the financial world in a different way. Can we adopt new technologies?\
    \ Can we start creating new products and services that are off the traditional\
    \ way? And that’s why we’re so interested in this distributed ledger and blockchain.”[20](#iapjtig6.html#mvas0d8ryto)\
    \ Orapong is the CEO of Digital Ventures, which is a subsidiary of SCB. \n\nSCB,\
    \ the oldest bank in Thailand, was established in 1904, and has been one of the\
    \ market’s top performers.[21](#iapjtig6.html#mvas0d8rytp) It is also one of the\
    \ largest banks in Thailand in terms of assets and profits. To stay competitive,\
    \ SCB is continually looking at innovation in services offered. And emerging technologies\
    \ are one way of looking at innovation.\n\nTraditional banking market dynamics\
    \ are such that every player is trying to protect their market share. “For example,\
    \ two years ago, we created what we believe to be the leading mobile application\
    \ for banking, for us to gain market share. We announced zero fees, all free transactions\
    \ on mobile banking. Within half an hour, every bank matched the offer,” says\
    \ Orapong. [22](#iapjtig6.html#mvas0d8rytq)\n\nIt is challenging to gain additional\
    \ revenues or profits in such a competitive environment, even though you may allocate\
    \ heavy investments. The situation forces banks to branch out of traditional business.\
    \ They look to see into ways to adopt new technologies to get a competitive advantage.\
    \ Can they start creating products and services in the current processes that\
    \ are different from the traditional way of doing things? \n\nUsing blockchain,\
    \ SCB looked to tackle procurement management—specifically the procure-to-pay\
    \ (P2P) process—and seek new possibilities. P2P kicks in when a company works\
    \ with its suppliers to purchase raw materials or services needed to conduct business.\
    \ In the case of procuring goods, a buyer typically issues a purchase order (`PO`).\
    \ \n\nAfter approval, the `PO` goes to the supplier, who then ships the product\
    \ with a shipping document. The goods come to the buyer’s warehouse. After inspection,\
    \ the warehouse issues a goods receipt (`GR`) acknowledging the receipt of goods.\
    \ The `GR` goes back to the supplier, who then issues an invoice back to the buyer’s\
    \ accounts payable department. The accounts payable department then takes all\
    \ of these documents and verifies them. Typically a three-way match is performed\
    \ between the purchase order, the vendor invoice, and the goods receipt.\n\nDifferent\
    \ departments in a company manage various functions like sourcing, procurement,\
    \ and account payable functions. The organization of these departments optimizes\
    \ the tools and processes for their functioning. This siloed functioning creates\
    \ processes that are unintegrated, manual, and error-prone. Additionally, a large\
    \ company can have thousands of suppliers who are using their systems. These systems\
    \ do not talk to each other. Their data is not integrated, leading to manual and\
    \ document-heavy processes. \n\nWith existing technology, this integration between\
    \ buyers and suppliers is challenging because of the large number of entities\
    \ involved. Getting all the data integrated across organizations gets expensive\
    \ very quickly with point-to-point integration. \n\nAs Orapong explains on the\
    \ use of `APIs`, “Technically you could. But economically, it might not be feasible.\
    \ One buyer could easily have ten thousand suppliers. Even if you have `APIs`,\
    \ how many integration points would you be able to manage? How much testing do\
    \ you need to make sure that everything is correct? Once data starts being exchanged,\
    \ how can you make sure that everything is secure, traceable, and auditable?”[23](#iapjtig6.html#mvas0d8rytr)\n"
  raw: 'Gartner’s new business value forecast methodology quantifies the value of
    a technology’s innovation. It looks at factors of customer experience, new revenue,
    and cost reduction. According to this methodology, in the context of blockchain,
    “The business value-add of blockchain will grow to slightly more than $176 billion
    by 2025, and then it will exceed $3.1 trillion by 2030.”[15](#iapjtig6.html#mvas0d8rytj)
    We are talking big numbers here. With such expectations from the technology, everyone
    wants to get involved. They want to make sure they are not getting left behind.
    Although, the critical question is, are you getting involved in blockchain for
    the right reasons?


    Stephanie Hurder is a founding economist at Prysm Group, an economic advisory
    firm focused on implementing emerging technologies, and an academic contributor
    to the World Economic Forum. She has been an active participant in enterprise
    blockchain initiatives. Working with various projects, she can see some familiar
    trends showing up. She explains, “You’ll have a consortium announced that they
    have a proof of concept or that they’re going to do a pilot for a specific use
    case. And then a year later, you come back, and you say, ‘Oh, I wonder what happened
    to that pilot, sort of never heard from again,’ and we just see this pattern over
    and over again.”[16](#iapjtig6.html#mvas0d8rytk) The projects just didn’t bring
    in the results.


    This observation can also be backed by data. According to a PricewaterhouseCoopers
    survey, of the respondents who report a blockchain project in the pilot stage,
    54 percent say the effort sometimes or often didn’t justify the result.[17](#iapjtig6.html#mvas0d8rytl)


    “My investors are asking about our blockchain strategy, and I need some tutoring
    on the topic,” my friend Sandeep said. Of course, he got the help he needed, but
    it left me wondering. His reason to look into blockchain technology was not a
    business problem that he was trying to solve, for which blockchain was identified
    as the solution. Instead, he needed to look into the technology for external reasons. 


    ![](mvas0d8ryzo.jpeg)


    © PwC. Not for further distribution without the prior written permission of PwC.
    PwC refers to the US member firm or one of its subsidiaries or affiliates, and
    may sometimes refer to the PwC network. Each member firm is a separate legal entity.
    Please see [www.pwc.com/structure](http://www.pwc.com/structure) for further details.


    On one side, there is such potential, but on the other hand, the potential seems
    to be faltering. Blockchain can add significant value to companies, but they need
    to be clear on what the value drivers are and who is getting the value. Many projects
    are unclear on their reasons for using blockchain technology instead of existing
    technologies in the context of a particular use case. If projects just follow
    the hype and do not link their efforts to value, they increase their chances of
    not being heard from again.


    As per a 2019 Gartner prediction, “Ninety percent of current enterprise blockchain
    platform implementations will require replacement by 2021.”[18](#iapjtig6.html#mvas0d8rytm)
    A key reason for that is not linking use cases with the business benefits of blockchain.


    #### **On Staying Competitive**


    One lens through which companies can look at new technology is this: What can
    this technology do to hurt my business? Looking through this lens is all about
    competitive advantage. If competitors use this technology to disrupt the competitive
    landscape, we will be at a disadvantage. The question then really is: How do we
    get ahead of the curve? 


    “A 2019 study by the Enterprise Strategy Group showed that most leading organizations
    already see the essential nature of emerging technologies. Eighty-two percent
    of organizations agree or strongly agree that without emerging technology, they
    will not be able to transform. And if they don’t transform, a competitor will
    disrupt their business.”[19](#iapjtig6.html#mvas0d8rytn)


    Staying competitive is what prompted Siam Commercial Bank (SCB) to look at blockchain.


    As Orapong Thien-Ngern explains, “We realized that one of the ways for the bank
    to continue growing or recover the low return on equity is to branch out from
    the traditional business. We are still mainly a financial institution, but we
    start looking at the financial world in a different way. Can we adopt new technologies?
    Can we start creating new products and services that are off the traditional way?
    And that’s why we’re so interested in this distributed ledger and blockchain.”[20](#iapjtig6.html#mvas0d8ryto)
    Orapong is the CEO of Digital Ventures, which is a subsidiary of SCB. 


    SCB, the oldest bank in Thailand, was established in 1904, and has been one of
    the market’s top performers.[21](#iapjtig6.html#mvas0d8rytp) It is also one of
    the largest banks in Thailand in terms of assets and profits. To stay competitive,
    SCB is continually looking at innovation in services offered. And emerging technologies
    are one way of looking at innovation.


    Traditional banking market dynamics are such that every player is trying to protect
    their market share. “For example, two years ago, we created what we believe to
    be the leading mobile application for banking, for us to gain market share. We
    announced zero fees, all free transactions on mobile banking. Within half an hour,
    every bank matched the offer,” says Orapong. [22](#iapjtig6.html#mvas0d8rytq)


    It is challenging to gain additional revenues or profits in such a competitive
    environment, even though you may allocate heavy investments. The situation forces
    banks to branch out of traditional business. They look to see into ways to adopt
    new technologies to get a competitive advantage. Can they start creating products
    and services in the current processes that are different from the traditional
    way of doing things? 


    Using blockchain, SCB looked to tackle procurement management—specifically the
    procure-to-pay (P2P) process—and seek new possibilities. P2P kicks in when a company
    works with its suppliers to purchase raw materials or services needed to conduct
    business. In the case of procuring goods, a buyer typically issues a purchase
    order (PO). 


    After approval, the PO goes to the supplier, who then ships the product with a
    shipping document. The goods come to the buyer’s warehouse. After inspection,
    the warehouse issues a goods receipt (GR) acknowledging the receipt of goods.
    The goods receipt goes back to the supplier, who then issues an invoice back to
    the buyer’s accounts payable department. The accounts payable department then
    takes all of these documents and verifies them. Typically a three-way match is
    performed between the purchase order, the vendor invoice, and the goods receipt.


    Different departments in a company manage various functions like sourcing, procurement,
    and account payable functions. The organization of these departments optimizes
    the tools and processes for their functioning. This siloed functioning creates
    processes that are unintegrated, manual, and error-prone. Additionally, a large
    company can have thousands of suppliers who are using their systems. These systems
    do not talk to each other. Their data is not integrated, leading to manual and
    document-heavy processes. 


    With existing technology, this integration between buyers and suppliers is challenging
    because of the large number of entities involved. Getting all the data integrated
    across organizations gets expensive very quickly with point-to-point integration. 


    As Orapong explains on the use of APIs, “Technically you could. But economically,
    it might not be feasible. One buyer could easily have ten thousand suppliers.
    Even if you have APIs, how many integration points would you be able to manage?
    How much testing do you need to make sure that everything is correct? Once data
    starts being exchanged, how can you make sure that everything is secure, traceable,
    and auditable?”[23](#iapjtig6.html#mvas0d8rytr)'
