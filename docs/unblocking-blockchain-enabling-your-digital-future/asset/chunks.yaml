  trans: '


    如今已经存在可以尝试解决这一问题的技术。但这些技术的使用具有挑战性。因为这些技术无法提供以去中心化方式应对挑战的可能性，所有的保险公司都必须收集自己版本的“真理”。作为所有保险公司的总和，这变得异常沉重。整理他们的数据源不仅在技术上是负担，在组织上也是一个问题。此外，提供者也面临着负担，因为他们必须管理来自多家保险公司索要相同信息的持续请求流。


    Optum 技术公司在开启其区块链之旅时，目标是寻找几家愿意参与实验的国家级保险公司。该实验的目标是看看如果他们利用区块链来解决某些用例，将获得哪些收益。我们谈论的不仅仅是技术上的收益。当大家共同努力时，可能会产生经济、政治和运营方面的收益。通过参加各种区块链医疗会议，Optum
    团队能够与 MultiCare 和 Humana 等其他保险公司建立关系，并开始就建立联盟进行对话。自此，Synaptic 神经健康联盟（Synaptic
    Health Alliance）应运而生。


    通过使用区块链，Synaptic 健康联盟的成员可以显著降低验证成本。如果操作得当，可以将其降至接近零。保险公司查看共享的数据现实版本，看到其他受信任的保险公司已对该数据进行了证实。这基本上等同于给他们打电话询问：“嘿，这个人把名字从
    Jones 博士改成了 Smith 博士吗？”相反，这直接就在数据库中：保险公司只需运行查询并获取这些信息即可，而无需反复承担验证相同提供者数据的负担。


    在 SCB（泰国商业银行）和 Synaptic 健康联盟的案例中，我们可以看到参与者如何利用根于区块链技术的解决方案来获取价值。但正如 HFS 研究发现的，“在报告的
    940 个区块链项目中，只有大约一半的项目具有业务意义并为受访者创造了真实价值。”31 我们必须记住，正如热炒让你信信的那样，区块链并非万问题的万灵药。确实，在这些噪音中存在相关的用例。尽管如此，也必须仔细选择。在启动计划之前，要审视战略愿景以确定你想要实现的目标。在确认区块链技术是否合适之前，应该使用关键参数对旨在解决的痛点进行评估。也许其他技术更适合帮助你实现所追求的目标。总而言之，你正在寻找共同的痛点或共同的收益，以便其他利益相关者愿意资助并有效治理一项区块链倡议。


    正如 Tony Little 所解释的，关键问题在于：“你如何创建一个网络？第一，它是自启动的；第二，它奖励那些为特定用例提供高质量数据的参与者；第三，它让他们有大量的激励来继续以这种方式参与。”为所选用例回答这个问题，正是在使用区块链技术时获得竞争优势的关键。由于加密经济学（crypto-economics）的使用，这在比特币等公共区块链网络中运行良好。在企业区块链的情况下，我们必须非常仔细地从经济角度评估区块链网络的自维持性。正如
    Tony 继续确认的那样：“如果我用高质量数据参与，并将获得网络的经济奖励；那意味着它是自给自足的你也可以让小玩家也参与进来。现在，突然之间，你就有了网络效应。”我们必须观察这些细微之处，并评估为什么公司以这种方式参与商业网络会更便宜、更好。


    经济学正是区块链真正变得有趣的地方。


