    GPTs are compelling technologies with global impact. The effects of GPTs can bring
    change to existing economic and social structures. Over time, the efficiency of
    GPTs increases, and this continues to improve the downstream sector where the
    GPT is embedded. As GPT becomes more efficient, downstream sectors’ costs go down,
    helping reduce prices and better products. Notably, more and more sectors find
    it helpful to use the GPT as input.


    I could see a parallel to GPTs and how Tony Little described the way he looks
    at blockchain: “It’s like just plugging into the electrical grid. I use the analogy
    of blockchain as a utility. It’s not a light bulb, but it’s the electrical grid
    you plug your light bulb into. A good blockchain use case should feel like an
    electrical grid. You are creating something that everyone can tie into.”


    Downstream sectors utilize some generic functions that GPTs perform. The generic
    function performed by blockchain is to enable transactions in an environment where
    no trust exists.


    At a superficial level, blockchain looks like nothing more than a shared worksheet
    to which multiple parties can read and write transactions. They do it in a continuously
    flowing ledger format. However, blockchain is more than a shared worksheet because
    it puts this socio-economic wrapper around the technology.


    As Dan Fritz from Novartis highlighted, “Blockchain is a socio-technical construct.
    . . . This basically means it’s something designed for joint optimization. This
    is another way to say it should be a win-win. It should benefit all of the participants
    that are engaged in it. . . . And that requires basically a different mindset,
    a different way of thinking where we’re going to grow the pie, instead of just
    slicing it up.”[103](#kvn36vkj.html#mvas0d8ryxq)


    What transforms that shared worksheet into a blockchain is that many people can
    agree to the recorded transactions, even though they don’t know or trust each
    other. For that matter, they may even have a conflict of interest and still be
    able to transact. On top of that, there is no one overseeing or refereeing this
    interaction. Blockchain makes it possible for a peer-to-peer market to exist without
    the need for a central authority. And these peers can also be enterprises, or
    IoT devices.


    Blockchain can help us get to a point that we will just take digital trust for
    granted because it will be the least common denominator to the way we work. Just
    imagine all the things that ubiquitous digital trust will unlock. As Orapong wondered,
    “If you can conduct trades as easily as you send a text message, or send an email
    today—imagine how many changes will occur in the business world if you can conduct
    the trade as easily as that.”[104](#kvn36vkj.html#mvas0d8ryxr)


    Blockchain will be an infrastructure layer of business functions. We will not
    be talking about blockchain but just take it for granted. We are already starting
    to see it permeate through various industries in the economy. It will become the
    underlying plumbing of enterprise workings.


    Like GPT, it can spread through the economy and help everyone do more. Blockchain
    can help you come together with your competitors and partners in a way that a
    rising tide raises all boats, including yours.


    ## Path Forward for Blockchain


    Before blockchain can get to be a GPT, its journey from here needs to stand the
    test of time.


    Of all the emerging technologies, blockchain is one technology that brings value
    primarily when deployed across organizations. There are many headwinds for adopting
    the technology, like lack of education about blockchain, fast-evolving technology
    landscape because of the newness of the technology, immaturity of standards, and
    lack of much-needed love from the regulators in the US. But, coopetition being
    a necessary condition for success is perhaps its most significant hurdle. As a
    collective, the business world needs to get to a point where this idea takes root
    and becomes ingrained in the business ethos. Businesses need to appreciate the
    value coming from a shared and connected economy to realize blockchain’s full
    potential.


    Adding to that, as Alison McCauley put it, “One thing that’s really important
    to keep in mind is there’s this hangover from a really crazy hype cycle that we
    are going through, and so people come into it with a lot of preconceptions and
    a lot of emotions. A lot of emotions. And that’s really difficult to navigate.”
    [105](#kvn36vkj.html#mvas0d8ryxs)


    For all emerging technologies, you need to be patient with the ROI. You can’t
    expect that things will just start happening right away. First of all, few people
    know what to do and how to use it best to derive quick value. There is also a
    lack of best practices that are not available to lean on. In the case of blockchain,
    we must take additional factors into account. Because blockchain projects are
    a team sport, you have to bring everyone along to be successful. That takes time.
    All have to walk together. If all have to move forward together, you have to allow
    for time needed for coming to agreements. If there are shared goals, it will also
    need to be shared decisions. That takes time.


    You also have to spend more time on non-technical things. As William Mougayar
    so aptly put it, “When you sum it up, the blockchain is about 80 percent business
    process changes and 20 percent technology implementation.”[106](#kvn36vkj.html#mvas0d8ryxt)


    Because technical teams champion many blockchain projects, they end up taking
    a technology-first approach. The primary focus ends up being the implementation
    of technical details instead of the economics of the endeavor.


    As HFS research reports, “While most respondents are focusing on technical solutions,
    less than 45 percent of respondents are investing in blockchain talent, consortia,
    research, and intellectual property. A blockchain narrative purely centered on
    technology is a recipe for failure—people (stakeholder buy-in, change management,
    skills development) and processes (business case, governance, scaling, and service
    support) are equally essential to drive success.”[107](#kvn36vkj.html#mvas0d8ryxu)


    Because of these reasons, change management takes on an extra dimension because
    people have to learn fundamentally new ways of doing things. Newly learned behavior
    will take some time to manifest. I may intellectually understand something because
    the change management efforts have taken me through the training. I also appreciate
    the paradigm shift that is involved here. Before we see a behavior change, there
    is a process of internalization that I have to go through.


    Until then, I may know it, but I might still exhibit old behavior patterns.


    Just as Lisa Butters found out in her work with GoDirect Trade, “I think transparency
    is really hard. For sellers that are used to antiquated ways of selling, and they’re
    scanning documents, maybe saving it to their computer and emailing it back and
    forth, they’re not used to having an e-commerce presence. They don’t know how
    to manage an online storefront. That’s what you saw with Amazon in 1995 to early
    2000 era. You had a lot of brick-and-mortar stores that really were not used to
    e-commerce activities. They felt like they didn’t have to participate in it until
    2010 started rolling in, and they just got left behind.”[108](#kvn36vkj.html#mvas0d8ryxv)


    In their current situation, people have relied on diligently cultivating relationships
    for success in their jobs. You cannot expect them to change and start trusting
    blockchain technology. You have to allow them to adjust and be patient as they
    go through that process. You can use organizational strategies to accelerate the
    process. However, you still have to allow for the organizational patience to manifest.


    Ironically, blockchain—the “Trust” technology—has to earn our trust before it
    can achieve mainstream acceptance.

