    # 我的区块链之旅


    我的区块链之旅始于 2019 年的第一季度。随着新一年的到来，我们看到了许多关于各种主题的文章，回顾过去一年的事件。这些文章也表达了作者对来年预期进展的看法。在一个清闲的早晨，一篇文章出现在我的信息流中：“2019
    年区块链五大预测”。55


    当我读完这篇文章时，我的脑海中反复浮现出一个念头，这个念头让我挥之不去。文章强调了非技术问题对区块链项目成功的重要性。业务参与的相关性对于所有技术项目都有效，但在区块链的语境下，为什么要特别提到这一点呢？我一直从业务角度在技术领域工作，而这种对非技术问题的关注引起了我的注意。


    ## 发现


    我漫无目的地地、没有明确目标地开始探索区块链。然后，在一个晴朗的一天，我收到了一条私信。是 Jonathan Blanco 邀请我参加 `TF4`。事实证明，`TF4`
    是西雅图顶级的区块链会议之一。Jonathan 不需要为我提供 100 美元的折扣来让我参加；会议那个周末就在西雅图举行。有什么损失的呢？


    于是，我站在 `Columbia Towers` 的 36 层，俯瞰着普吉特海的美丽景色，被一百多人环绕，听着演讲者谈论区块链和加密货币。那次活动是我首次接触区块链。会议的定位是针对已经在区块链领域工作的人的。


    对于我这个完全的初学者来说，这就像是在用高水管灌输关于区块链的一切知识。课程围绕该技术的应用展开，并没有很强的技术性。我在这里第一次接触到新的区块链语言——挖矿、代币化、哈希率和私有许可网络等。我因此迷上了。


    ## 区块链的潜力


    这项技术拥有的潜力令人着迷。代币的使用可以商业房地产、基础设施项目等的投资民主化。区块链的这种应用可以让小投资者参与这些大型投资。在投票中使用区块链的可能性——这可以使投票计票变得实时、准确且防篡改——将太酷了。追踪和追溯的能力——它具有如此巨大的潜力。


    如果我能追踪我的捐款流向何处，我更有可能向需要的人捐款。每当自然灾害发生时，Facebook 和网站上都会出现这些选项，请求捐款。但谁知道那些钱去了哪里呢？据我所知，当我按下支付按钮的那一刻，钱就进去躺在某人的银行账户里了。似乎区块链可以提供一种解决方案。


    许多不同的可能性正在出现。至少，这是它的承诺。它暗示了某种可能性的迹象。


    ## 企业 vs 加密货币


    当我试图学习更多区块链的知识时，我尽可能参加各种聚会和会议。然而，大部分对话都是关于加密货币和金融科技的。很少谈论这项技术在企业领域的应用。这可能是因为有更多的资金流入加密货币公司。6
    对话遵循活动，而活动又遵循资金。


    企业客户传出的信息反映了这种对话。正如我们在下方所示，企业对“区块链”一词的提及率下降了。


    ## 热周期


    企业客户传出的信息反映了这种对话。正如我们在下方所示，企业对“区块链”一词的提及率下降了。7


    ![mvas0dryzx]

    ![mvas0dryzy]


    直到现在，这很有趣，但我无法理解如何做到。对话遵循活动，而活动又遵循资金。


    Gartner 有其热周期（Hype Cycles）框架，帮助业务和技术领导者构建新兴技术并解释随而来的炒作。这仅仅是炒作吗？8 在我们这里，区块链似乎处于“幻灭期”。


    根据 Gartner 对幻灭期的描述，“随着实验和实施的失败，兴趣减退。技术生产者被洗牌或失败。只有当供应商供应商改进其产品以满足早期采用者的时，投资才会继续。”


    对区块链的兴趣正在消退吗？


    ![mvas0dryyh]

    ![mvas0dryzx]

    ![mvas0dryzz]


    如果你追踪资金，它表明区块链技术没有足够的顺风。CB Insights 的数据似乎证实了这一假设。观察区块链风险投资（VC）的趋势，报告显示 2019 年的融资资金与上年相比下降了
    30% 以上。9


    ![mvas0dryry]

    ![mvas0dryzy]


    另一方面，头条新闻出现在我的信息流中：“为什么万事卡的区块链关注实际应用”、“沃尔玛及其他企业如何着区块链浪潮走向供应链天堂”或“Figure Technologies
    融资 103 亿美元以继续基于区块链的贷款”。10 还有大型家户品牌正致力于区块链项目，例如星巴克、三星等。11 IT 服务公司正在投入资金和资源支持咨询服务，为其客户提供全球区块链服务：埃森哲、IBM、信森等。


