  raw: 'Open vs. Closed: This is defined based on who can read data from the blockchain.
    Open blockchains allow the general public to consume data. Closed blockchains
    control access through permissions.


    Permissioned vs. Permissionless: Role-based access defines this aspect. Permissioned
    blockchains have the native ability to track and manage the identity of entities
    accessing the blockchain.


    As per a PricewaterhouseCoopers survey on how businesses are managing blockchains,
    companies are adopting both approaches; while 40 percent are using permissioned
    blockchains, 34 percent are working with permissionless chains, and 26 percent
    are taking a hybrid approach.[78](#nzx7zm4a.html#mvas0d8rywy)


    Looking to use case considerations, companies will decide what path to take.


    Coadjute first started working on their project by participating in the UK Land
    Registry’s procurement process. They realized that “for a government use case,
    a public platform enabled by cryptocurrency practically wasn’t feasible. The data
    would need to be in the UK.”[79](#nzx7zm4a.html#mvas0d8rywz)


    For SCB, one major decision they needed to explore was this: Are you going to
    use a private blockchain network or a public blockchain network? The deciding
    factor was the visibility of transacting parties. As Orapong explained, “With
    the procure-to-pay application, you normally deal with a closed loop—a limited
    number of suppliers and a limited number of buyers. You cannot even identify who’s
    the one who executed the trade. But the fact that you see information in the trade
    is a risk. If you see the price, even if you don’t know who buys that product,
    but you see a different price, and you see a buy, that creates trade issues. That’s
    why first we assess: Are we going public blockchain? Are we going private blockchain?
    And we decided private blockchain.”[80](#nzx7zm4a.html#mvas0d8ryw0)


    For Optum, managing the politics of technology and support for tokenization were
    driving factors in deciding to go with a public blockchain network. “There are
    three legs to the stool. It’s politics, economics, and technology. If you decide
    to make your own network, you have to tackle all three simultaneously. If you
    decide to piggyback on public Ethereum, and you can have a use case that runs
    on that, then you’ve essentially removed a lot of the politics around the actual
    execution of the network. And there are already network effects. So there’s a
    huge advantage to moving every private permissioned blockchain to a public permissioned
    blockchain, as quickly as possible.” That’s how Tony Little explained it to me.


