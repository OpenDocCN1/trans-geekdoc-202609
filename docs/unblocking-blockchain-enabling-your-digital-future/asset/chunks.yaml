    # Chapter 5 All about Consortia


    ## About Consortia


    Merriam-Webster online gives this definition of a consortium: “An agreement, combination,
    or group (as of companies) formed to undertake an enterprise beyond the resources
    of any one member.” One part that we are looking at here is “group of companies.”[49]
    Many times, these groups of companies will comprise participants that are competitors
    in the same market. And the second aspect that we are looking at is “beyond the
    resources of any one member.”


    Because the current business world primarily doesn’t operate like this today,
    this state of coopetition can be challenging to establish. However, it is worth
    pursuing because companies can look to get returns that would not be possible
    independently. In that pursuit, companies looking to use blockchain technology
    come together in some form of a consortium to build the solution together. As
    Deloitte’s 2019 Global Blockchain Survey found, there are various reasons why
    companies might look to join a consortium.[50]


    As companies start looking into and experimenting with blockchain, they get to
    the point of trying to figure out how to best work with other players in an organized
    fashion. As we saw in Chapter 2, Optum technologies started by learning about
    blockchain technology. They evaluated blockchain’s impact on their business, decided
    the use case to pursue, and started looking to build relationships with other
    insurers interested in working together. The idea was to find a few national insurers
    who want to participate in the experiment and benefit by trying to solve the use
    case with blockchain.


    This chapter explores blockchain consortia.


    Participating in various blockchain health care conferences allowed the Optum
    team to build these relationships with other insurers like `Humana`, `Multiplan`,
    `Aetna`, etc. These were the efforts that paved the way for consortium conversations.
    At a high level, the consortium’s founding partners signed a memorandum of understanding
    to start using the use case to improve provider data accuracy. Each entity had
    to negotiate up the leadership chain, and the `Synaptic Health Alliance` was born
    as a consortium.


    ## Types of Consortia


    That’s the route `Synaptic Health Alliance` took. However, different forms of
    consortia take shape as companies try to figure out how to best cooperate with
    competitors. One framework to view the developing consortia trends in the blockchain
    space is to look at the leadership available to bring the ecosystem together.
    A consortium steward provides the lead in defining the working relationship of
    business partners to help drive the blockchain solution from concept through development
    and industry adoption. There are two emerging patterns to structure these consortia.
    First is a founder-led consortium where the consortium steward is one of the companies
    in the industry ecosystem. The second is where an independent entity provides
    leadership as the consortium steward.


    ### Founder-led Consortium


    A founder-led consortium typically involves an industry leader providing an early
    lead in the adoption of blockchain technology. Often the founder acts as the steward
    of the business network and is responsible for providing technological and organizational
    leadership and bringing its business partners along in a a use case. Sometimes
    a dominant industry player fills this role. At other times, a group of companies
    comes together to agree and solve a shared business problem. Still, one of the
    group’s peers would end up taking the lead as the steward of the network. One
    of them, however, does provide leadership to the group in structuring the alliance.


