    ## 机会


    现在你创造了产品，需要在不被发现的情况下销售它。为什么不在一个偏远的角落、没有药物监管、远离监管机构开一家在线药店呢？1 当世界应对一场导致数千人死亡在全球疫情时，出现了一个成熟的新机遇。随着疫苗和其他疗法的开始推出，逻辑上人们会寻找一切可能的方法获取它们。2


    如果你追踪资金流向，将表明 `blockchain` 技术兴趣缺乏足够的顺风。CB Insights 的数据似乎证实了这一假设。观察 `blockchain`
    的风险投资（VC）资金趋势，报告显示 2019 年资金较去年下降了 30% 以上。9


    企业的沟通反映了这种对话。正如我们在下方所示，企业对“区块链”一词的使用减少了。7


