    区块链可以提供一种运行模型，为参与者提供经济激励，使其成为良好的网络公民并尽其责任。在 Synaptic Health Alliance 的案例中，人们提出了数据市场学的构想。这为确定网络经济模型铺平了道路。任何想要使用数据并修改由另一支付方更新的供应商目录录的人，都需要从提交该数据的实体处购买数据。买方的支付意愿取决于该保险公司提供数据的历史准确性。网络奖励贡献准确数据的参与者。这为吸纳更多公司提供了一种方法，让他们能够以一种方式加入并使用该网络，而不是在其他人的数据上“搭便车”。否则，就没有激励去作为网络的模范公民参与其中。“如果我能重来一次，我会更强力地推动他们，帮助他们理解建立经济模型的必要性，”Tony
    Little 解释道。


    ## 关于关注网络经济的必要性


    通常情况下，人们倾向于忽视方程式中的“经济”部分，因为通常，那些站出来并主动推动技术项目的人，怎么说呢，都是技术人员。他们从创建技术解决方案的角度来考虑解决办法。在项目之初获得业务团队的支持将增加成功的机会。HFS
    Research 的报告指出：“百分之七十五的受访者今天将区块链视为战略优先事项，但超过 90% 的区块链计划预算源自 IT 预算。只有 7% 的业务部门主管为区块链计划分配了预算，这让我们对他们的整体投入产生了怀疑。”33
    Tony 在与 Synaptic Health Alliance 的工作中也呼应了这一观察：“如果当时有经济学家或业务人员加入并说：‘好的，我们正在创建一个市场。’那就太棒了。技术需求应该是基于市场化构想来驱动的。”这将推动关于区块链解决方案经济性的讨论。


    假设一个区块链项目的重点更多在技术方面，而非经济激励。在这种情况下，存在错失大局的风险。“区块链支持的去中心化网络的很大力量源于，它们具有利用经济激励来吸引参与者的潜力。”34
    在业务网络价值链的每一个部分，参与者都可以从区块链项目中获得经济价值。然而，区块链网络带来的带来的所有改进，对于价值链上游的参与者来说可能并不显而易见。关注所有参与者的价值并将其重点化以获得适当的可见性是至关重要的。


    在像 Vinturas 这样的供应链联盟中（这是一个整车物流（FVL）行业物流服务供应商（LSP）的联盟），参与者期望随着整个供应链更多公司加入网络并代表所有类型的利益相关者，获得更多的收益。


    “因此，区块链技术实现了协作，并为生态系统中的所有利益相关者创造了价值……在这个世界上，我们越来越担心大型组织、巨头、中间人夺走你的数据并从中盈利。我们在
    Vinturas 的立场是，如果我们在一个基于区块链的网络中共同协作，我们都将受益。”35 我们都将受益；Vinturas 的首席执行官 Jon Kuiper
    是这样解释的。这正是区块链的意义。但要让每个人都受益，你必须清楚每个人将如何受益，并建立好让大家受益的机制。


    ### FVL 行业


    FVL 行业涵盖了从工厂将新消费级车辆运到经销商处的所有活动。由于我们谈论的是车辆，其运输比比我们可能熟悉的日常消费包裹需要更专业的活动。需要专门的运输、能够处理这些交付的熟练司机、专门的存储、交付前检查等。由于运输和处理的性质，存在极高的损坏风险。在
    FVL 行业中，由于当今供应链的全球性质，增加了复杂性。


    在 FVL 中，LSP 是重要的参与者，是管理车辆存储、分销和运输的实体。为了让车辆从生产设施到达经销商，设备制造商（OEM）即生产车辆的公司与各种 LSP
    之间发生了多次交接。这些 LSP 和 OEM 之间没有使用标准化的数据交换。此外，所有支持交接的过程都是基于纸质的。这种情况导致了供应链的不透明。


    经销商知道车辆何时生产，但不知道它何时到达经销商处供客户使用。这种可见性的缺失导致了交付给客户的最后一公里流程规划糟糕。习惯了在其他在线零售商那里获得更好体验的消费者，相比之下感到大失所望。


    在这样一个充满此类低效率的情况下，LSP 降低服务价格唯一的方法就是压缩利润率。在利润率面临压力且重点都在削减成本的情况下，公司无法投资升级流程和工具。供应链控制塔是该行业的倡议之一；在这里，更显眼的玩家试图通过整合较小玩家的合同来优化经济。这种方法最终会导致过程中引入更多的结构性低效率。供应链控制塔最终作为中间人运营，为整个基础设施增加了成本。价值链中引入中间人也对物流服务供应商产生了边缘化的威胁。


    凭借在供应链方面的丰富经验，Jon 感谢区块链技术为解决 FVL 行业挑战可能带来的价值。正如他所解释的，“许多行业一样，协作是世界上的一个新主题，特别是与区块链技术相关的。区块链是一种极好的协作技术，协作创造了额外价值。同时，公平地说，在
    Vinturas 共同工作的公司在地面和操作层面是竞争对手。因此，这需要一种心态，即如果我们共同以安全公平的方式使世界数字化，我们将共同拥有的价值。”36
    与专注于削成本相比，协作使创造价值成为可能。


    Vinturas 相信正确的技术可以帮助解决汽车供应链的低效率问题。他们建立了基于区块链的数字协作基础设施，以造整个生态系统。“我们——我所说的‘我们’指的是欧洲的一些物流服务供应商——说：‘好吧，我们需要主动创建这种数字基础设施，这种协作基础设施，让我们所有人都受益，不仅是作为物流服务供应商……还包括生态系统中的其他利益相关者，’，Jon
    解释道。”37

