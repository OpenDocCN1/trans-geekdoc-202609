- fmt: "\nDifferent supply chains require different solutions because they have other\
    \ pain points. So it’s tough to have a one-size-fits-all type of solution in the\
    \ supply chain. In the case of coffee, blockchain’s value proposition is different\
    \ from fresh produce. Fresh produce is concerned with waste and contamination.\
    \ Coffee as a processed product is roasted coffee beans. That is what we see in\
    \ stores. The value proposition to coffee brand names is for single-origin coffee,\
    \ which people pay more money for. It’s origin authentication, supplier authentication,\
    \ and sustainable farming.\n\nThe answer to having end-to-end traceability is\
    \ wireless IoT devices. That’s the answer if you want trusted data at the beginning\
    \ endpoint of production. The conversation around the beginning endpoint could\
    \ go on and on. Does it start at the soil to make sure that the soil is organic\
    \ and hasn’t been contaminated? Does it start at the harvest when the product\
    \ is fully grown and you’re pulling the bananas off the tree? Generally speaking,\
    \ there’s always going to be a concern when humans provide data. Bad actors might\
    \ give false data, or human error might cause inaccurate data. For that, devices\
    \ are the answer. \n\nPenta spent a lot of time testing devices in commercial\
    \ environments. They concluded that the IoT devices and sensors for supply chains\
    \ are not ready for primetime. Penta did a coffee project and used two different\
    \ preferred device manufacturers. They put their devices in the coffee chains\
    \ to track the coffee. They got different data from the same coffee chain.\n\n\
    That just suggests that there’s a lack of standardization on these devices. They\
    \ are not quite ready yet for use at scale. We are also not living in a 5G world\
    \ yet. Suppose you want wireless IoT that transmits data through cell towers to\
    \ your blockchain, which ultimately is how you want to get trusted data. In that\
    \ case, you need the infrastructure to be in place. And it’s not there yet. Even\
    \ if you are using NFC chips or RFID, you have to collect that `RFID` device and\
    \ collect that `NFC` device and scan it with your phone. There’s always going\
    \ to be a human element in there that people can question. If you want real trust\
    \ and end-to-end visibility, you need to have wireless sensors in there, but we’re\
    \ not ready for the sensors yet.\n\nTherefore, the next question is, for each\
    \ specific supply chain, what are the key pain points you’re trying to address?\
    \ If it’s coffee, the key questions might be origin authentication and sustainable\
    \ farming. There are other ways to do it without wireless IoT. Penta has a commercial\
    \ deployment with the Ministry of Agriculture in Uganda. Here, you can register\
    \ a farm on a blockchain and do what is called a trusted supplier authentication.\
    \ Suppose you wanted to trace coffee back to its source and verify a single origin.\
    \ In that case, you could do that just with a trusted supplier authentication.\
    \ \n\nHowever, it gets complicated because Ugandan-grown coffee gets intermingled\
    \ with coffee from other parts of East Africa. This commingling happens while\
    \ being aggregated in Kenya and gets sold as Kenyan coffee, but it is also a problem\
    \ for the Ugandan ministry. They want to drive more value to their production\
    \ in Uganda since exports are a significant part of their industry. So there are\
    \ ways to approach this without IoT devices. Trusted supplier authentication is\
    \ one of them.\n\nOne of the challenges that we continually come back to is that\
    \ people in the blockchain world think they have the next disruptive technology,\
    \ which can change the paradigm. But, there’s an educational hurdle for businesses\
    \ that don’t understand blockchain.\n\n# Chapter 10: Unblocking Blockchain\n\n\
    ## The Dilemma of Emerging Technologies\n\nOne of the challenges that we continually\
    \ come back to is that people in the blockchain world think they have the next\
    \ disruptive technology, which can change the paradigm. But, there’s an educational\
    \ hurdle for businesses that don’t understand blockchain.\n\n“After two decades\
    \ online, I’m perplexed. It’s not that I haven’t had a gas of a good time on the\
    \ Internet. Visionaries see a future of interactive interactive libraries and\
    \ multimedia classrooms. They speak of electronic town meetings and virtual communities.\
    \ Commerce and business will shift from offices and malls to networks and modems.\
    \ And the freedom of digital networks will make the government more democratic.\n\
    \n“Baloney. Do our computer pundits lack all common sense? The truth is no online\
    \ database will replace your daily newspaper, no CD-ROM can take the place of\
    \ a competent teacher and no computer network will change the way government works.”\n\
    \nClifford Stoll, Astronomer and Author\n\n“We overestimate the impact of technology\
    \ in the short term, and underestimate it in the long term.”\n"
