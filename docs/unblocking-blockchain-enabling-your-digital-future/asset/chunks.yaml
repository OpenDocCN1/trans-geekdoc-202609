- fmt: '

    In this scenario, because there is no one company leading the effort, there is
    less fear amongst other partners about working in the shadow of a big brother
    imposing on them. That makes for easier recruitment of newer members to grow the
    network. Because it is a neutral environment, it is also relatively more straightforward
    for competitors to start working together. This neutral environment helps reduce
    any drag on adoption.


    As we see in other business situations, when you have many decision-makers at
    the table who have an equal say in matters of decision making, the going can be
    slow. Different opinions and points of view need to be reconciled to achieve consensus.
    That can be challenging and time-consuming. In such a situation, this model can
    help move things along faster.


    As Dan Salmons, CEO of Coadjute, explained to me, “It seemed to us that the answer
    was to create a company that could present a solution rather than wait for one
    to be agreed on.” Coadjute is on a mission to digitally connect the UK’s property
    market by bringing together various disparate players in the industry: estate
    agents, conveyancers, surveyors, brokers, lending banks, etc. The end goal is
    to improve the customer’s home buying experience.


    “I had a problem here that I didn’t know the solution to. I was out hunting; how
    on Earth would you give a comprehensive end-to-end experience to customers in
    a very fragmented property market?” explained Dan. The home buying process is
    pretty complex because a buyer needs to engage with multiple businesses. Just
    think of all the steps you have to take when you buy a home. First, you find a
    real estate agent and start looking for a home.


    Meanwhile, you also need to figure out how big a home you can afford. How large
    of a loan will the bank give you? You work with a bank for the preapproval. And
    then, at some point in time, you need a home inspector to help you understand
    what you are walking into. You work with a mortgage broker to find the right loan
    for you. An appraiser will come in to help before the loan is closed. You probably
    don’t know what exactly every entity providing a service to you does throughout
    this long process, but there are associated fees.


    Each of the entities you interact with during the buying process is part of a
    vertical sub-industry, i.e., real estate agents, banks, home inspectors, mortgage
    brokers, assessors, etc. “Each one of these verticals—state agency has been digitized
    in some great platforms. . . . Conveyancing has been digitized, the legal piece
    with some great platforms if you want to do that. Brokering has been digitized.
    Mortgage lending is being digitized. Surveying is being digitized. But collectively,
    when you go on this process, you have to knit all that together,” explains John
    Reynolds, founder of Coadjute.


    The individual pieces work well, but the end-to-end value chain is fragmented.
    It’s tough for a consumer to get through it all. A buyer has to stitch it all
    together as they go through this process across different verticals. This situation
    leads to a longer buying time, which can go up to four or five months, with increased
    cost going up to 4 percent of the property values. John goes on to explain, “If
    I want to buy your house, and your name is on the land register as owning the
    house, really all we’re trying to do is change that to my name and put some money
    in your account. But to do that, we’ve got like these six companies and all these
    things we will navigate through.” Buying a home is a watershed moment in people’s
    lives. But the home buying process often brings along stress and frustration.


    For Coadjute, it all started as a research project. Looking at different UK government
    agencies, you can’t expect them to close down their systems and move to a single
    government platform. Could they create a distributed ledger that would keep their
    databases in sync? When the UK Land Registry department floated a bid, they went
    for it. A POC was built to test the shared ledger concept for the complete home
    buying process—from someone starting to list their house until someone moves in.
    They created nodes for each of the different players in the value chain. When
    they put out an invitation for companies to test it out, they received an overwhelming
    response.


    Fifty nodes were set up across twenty-two countries to create dummy properties
    and complete transactions around them. The POC proved that such a solution would
    go a long way in reducing the repetition, cost, and friction involved in the whole
    home buying process.


    But the move from POC to production is enormous because it is about adoption.
    The POC showed that the solution will work technologically, but will industry
    participants be willing to adopt it? So, the next question was how to move into
    production successfully. The team realized that the industry participants already
    have systems they use, and it would be difficult for them to move off those systems
    and onto a new platform. The research around this challenge gave birth to the
    idea that Coadjute will be this network of platforms. So, they went and talked
    to leading platform providers in different verticals to work closely with them.


    With that group, they moved into a non-production MVP. They connected the Coadjute
    platform to test environments of these other industry-leading platforms and make
    them available as a mobile solution. With this platform’s help, a buyer can track
    their home buying journey and get a mortgage and move home in one simple online
    journey. By bringing together leading actors at each stage of the value chain,
    they can now create this end-to-end experience for the consumer.


    To some extent, governance is not tricky for Coadjute. They are not targeting
    disintermediation or disrupting the industry, nor are they threatening the existing
    players. They are helping facilitate the end-to-end process for the current players.
    Some players in the property market have been very keen to see the Coadjute built.
    Others are interested but a little bit ambivalent. There is a varying degree of
    commitment. There is also considerable variation in the types of companies involved.
    You have small software companies and also very large. This fragmented market
    with many small players leads to distrust that a big player might try and take
    it over. With all of this variability, following the third-party model seems to
    be a good fit.


    As Dan explained, “We are seen as a trusted, independent, sort of objective third
    party by all the players in the market. Coadjute means collaborate, and you’ll
    hear us say we don’t intend to disrupt the market. We want to support it. We’ve
    gone out of our way to try and be a good friend and supporter of all the companies
    involved.”


    Consortia are turning out to be the vehicle for collaboration utilized to tackle
    use cases that are beyond the means of one single company. Many ecosystems are
    adopting this approach to come together and learn about blockchain technology
    and build industry-wide solutions. Consortia enable the participants to take advantage
    of blockchain technology and solve common problems while maintaining the needed
    boundaries as competitors.


    Next, let’s take a look at some aspects that have helped others come together
    and play to win.

