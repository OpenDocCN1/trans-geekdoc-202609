    \ for the Ugandan ministry. They want to drive more value to their production\
    \ in Uganda since exports are a significant part of their industry. So there are\
    \ ways to approach this without IoT devices. Trusted supplier authentication is\
    \ one of them.\n\nOne of the challenges that we continually come back to is that\
    \ people in the blockchain world think they have the next disruptive technology,\
    \ which can change the paradigm. But, there’s an educational hurdle for businesses\
    \ that don’t understand blockchain’s value proposition in their specific business\
    \ contexts. As an industry, we have to identify those unique value propositions—not\
    \ just value propositions, but unique value propositions.\n\nWe try to find industries\
    \ and problem-solution fits for which blockchain has a unique value proposition.\
    \ It has a value proposition that existing technologies can’t offer. Complex value\
    \ systems are where people share data between different companies with different\
    \ interests in the value chain. In that situation, blockchain is the only data\
    \ solution that allows for comprehensive data infrastructure. This infrastructure\
    \ enables collecting the data assets used to verify the authenticity, legality,\
    \ and regulatory compliance. Because of this unique value proposition, blockchain\
    \ technology will have a substantial role in strengthening the global supply chains.\n\
    \nOn to the next chapter to wrap it all up.\n\n* * *\n\n[92](#r5xklr8a.html#mvas0d8ryun)\
    \ MarketsandMarketsTM, “Blockchain Supply Chain.”\n\n[93](#r5xklr8a.html#mvas0d8ryuo)\
    \ Pages, “2017 Transparency Study.”\n\n[94](#r5xklr8a.html#mvas0d8ryup) McDermott\
    \ et al., “Breaking down Blockchain.”\n\n[95](#r5xklr8a.html#mvas0d8ryuq) Food\
    \ and Agriculture Organization of the United Nations, “Food Loss and Food Waste.”\n\
    \n[96](#r5xklr8a.html#mvas0d8ryur) Food and Agriculture Organization of the United\
    \ Nations, “Hunger-Facts.”\n\n[97](#r5xklr8a.html#mvas0d8ryus) McDermott et al.,\
    \ “Breaking down Blockchain.”\n\n94 92 97 95 93 \n\nFood and Agriculture Organization\
    \ of the United Nations, “Food Loss and Food Waste.”\n\nFood and Agriculture Organization\
    \ of the United Nations, “Hunger-Facts.”\n\nMcDermott et al., “Breaking down Blockchain.”\n\
    \nMarketsandMarketsTM, “Blockchain Supply Chain.”\n\nPages, “2017 Transparency\
    \ Study.”\n\nMcDermott et al., “Breaking down Blockchain.”\n\n96 \n\n“When I was\
    \ a kid, I would get these headaches. And I went to the doctor, and they said\
    \ that I needed glasses. I didn’t understand that. It didn’t make sense to me\
    \ because I could see fine. And then I get the glasses, and I put them on, and\
    \ I’m in the car on the way home—and, suddenly, I yell! Because the big green\
    \ blobs that I had been staring at my whole life, they weren’t big green blobs.\
    \ They were leaves. On trees. I could see the leaves. And I didn’t even know I\
    \ was missing the leaves. I didn’t even know that leaves existed, and then . .\
    \ . Leaves!”\n\nGrey’s Anatomy, S5E6, “Life During Wartime.”\n\n# Chapter 10 \
    \  \n\nUnblocking Blockchain\n\n#### **The Dilemma of Emerging Technologies**\n\
    \n“After two decades online, I’m perplexed. It’s not that I haven’t had a gas\
    \ of a good time on the Internet. I’ve met great people and even caught a hacker\
    \ or two. But today, I’m uneasy about this most trendy and oversold community.\
    \ Visionaries see a future of telecommuting workers, interactive libraries, and\
    \ multimedia classrooms. They speak of electronic town meetings and virtual communities.\
    \ Commerce and business will shift from offices and malls to networks and modems.\
    \ And the freedom of digital networks will make the government more democratic.\n\
    \n“Baloney. Do our computer pundits lack all common sense? The truth is no online\
    \ database will replace your daily newspaper, no CD-ROM can take the place of\
    \ a competent teacher and no computer network will change the way government works.”[98](#kvn36vkj.html#mvas0d8ryxl)\n\
    \nClifford Stoll, Astronomer and Author\n\nA technologically savvy Clifford Stoll\
    \ wrote these comments in 1995. Fast forward twenty-five years, and we can have\
    \ a chuckle as we read through the words. But Mr. Stoll’s flub highlights the\
    \ duality of emerging technology and its accompanying challenges.\n\n“We overestimate\
    \ the impact of technology in the short term, and underestimate it in the long\
    \ term.”[99](#kvn36vkj.html#mvas0d8ryxm) As I mulled over those lines, it made\
    \ me ponder that irrespective of who gets credit for the thought, it is easy to\
    \ fall into this trap with new technologies."
