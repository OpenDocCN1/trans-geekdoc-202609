    # 系统并行运行带来的额外成本


    由于区块链仍处于非常早期阶段，因此需要证明新技术的益处。与现有技术进行比较和对比也有助于决策。分阶段迁移生产系统可以有助于实现这一目标。当新的区块链解决方案与现有解决方案并行运行时，它会增加成本。这种双重性从长远来看是有益的，因为它在管理风险的同时也建立了了对技术的信心。由于你实际上在并行运行两个系统，这在短期内确实会产生更高的成本。这为我们对投资回报率（ROI）保持长期展望提供了更多理由。一旦我们在新旧方案之间选出胜者，我们就可以开始看到通过区块链实现预期目标的收益。


    Dustin Helland 证实了这一过程“需要新解决方案与任何遗留解决方案进行对比，并证明自己的价值。为了做到这一点，最初确实需要一些额外的投资和支出。”[45]
    Dustin Helland 自 2016 年以来一直是 State Farm（州州保险）推动区块链战略的领导团队成员。


    State Farm 创立于 1922 年。它是美国主要的保险公司之一，承保的汽车和房屋数量超过该国任何其他保险公司。他们还为客户提供其他产品，如人寿和其他金融服务。对于他们的区块链用例，他们选择在区块链上进行保险公司之间汽车理赔代位付款的结算作为追求的项目之一。USAA
    保险是他们代位产品的共同创始人。他们拥有共同的愿景，并通过共同的思维和方法看到了相似的机会。


    代位（Subrogation）在日常语言中并不是一个常用词，我不得不稍微深入研究才能理解它的含义。假设你的车被追尾了，对方司机有错。你会开始申请保险理赔。这时，代位流程就开始介入了。在收到保险理赔的背景下，“代位”是指你的保险公司从过错方或其保险公司收回资金的过程。


    美国汽车保险行业每天处理大量的理赔代位付款。代位是一个高度人工化的过程，依赖于邮寄和纸质支票。通过区块链，他们建立了一个可以电子化维护每笔交易账目的系统。然后，它根据所有这些交易计算出一个净清单。将该净清单传递给组织现有的电子支付系统以实现电子支付。这种向基于区块链解决方案的迁移缩短了处理时间并提高了效率，帮助
    State Farm 将收益传递给其保单持。


    State Farm 明白，区块链解决方案需要与现有解决方案并行运行，以对比新旧方案。同时，这意味着成本的增加，因为你实际上在运行两个系统。


    # 关于量化区块链 ROI 的困难性


    正如我们在本章早期讨论的那样，企业中的区块链是一种依赖网络经济的技术。你无法单靠区块链获得成功。除了需要给网络时间成熟外，公司在旅程之初并不知道网络将增长多大。希望是行业中的每个利益相关者都能加入。这最终可能会发生。但在开始，你并不知道达到那个最终状态需要多久。网络的成功取决于许多未知变量。鉴于这种情况，你必须根据对网络规模的假设进行预测。这些假设为
    ROI 预测带来了不确定性。


    ROI 的量化具有挑战性，因为区块链仍然相对较。你不能依靠许多现有的案例作为指导。你无法依靠任何真实的先例。区块链在 2009 年通过中本聪明的关于比特币的白皮书引入世界。那只是十多年前的事了。他们作为“区块链”的包装是近期的，尽管构成区块链的各种概念已经存在了几年。更重要的是，利用区块链解决公司面临的问题甚至更加近期。`Hyperledger`
    和 `Ethereum` 在 2015 年引入，并增加了智能合约层。这一增加使得区块链对公司来说更具可行性。对于如此年轻的技术，你没有太多可以借鉴的灵感。关于如何有效地使用它没有指导。也缺乏对所证明价值的量化。


    另一方面，由于技术的新颖以及背后没有大量的工作支撑，区块链知识是稀缺的。随着这个新兴领域的新发展，它演变得非常快。区块链技术瞬息万变的格局寻找寻找相关区块链知识的人变得困难且昂贵。技术将随着时间的推移而成熟，目前的限制最终会被解决。与此同时，你应该考虑这项技术的演变，并为更高的成本做好准备。


    解决相同问题的其他可比较方案包括建立手动流程。使用现有技术可以帮助快速且粗略地完成这些任务。这些选项的存在使得领导层很难在短期内证明新兴技术业务案例的合理性。请记住，使用现有技术可以更快达到目标，但你放弃了播种种子以将区块链建立为你公司的赋能技术并获得其优势。在更长的生命周期内，如果你将通过采用区块链技术实现的自动化纳入考虑，你的成本将会降低。


    # 增量价值有助于解决 ROI 困境


    与竞争对手合作对企业来说是全新的未开发领域。你可能从聚集所有人围绕一个用例开始旅程。但正如我们在第 3 章看到的，根据区块链网络成熟模型，随着网络增长，新的用例将根据小组的成熟程度不断演变。事实上，联盟可以利用多个用例。所有用例并不一定从一开始就是可见的。当你考虑
    ROI 时，如果你能证明一个用例的回报显示出很好的成本效益，你就应该考虑继续进行。最终，在启动用例之外出现的新用例将增加 ROI 的收益部分，尽管你现在无法对其进行量化。


    寻找早期进展有助于 ROI 局面。关注早期用户如何从他们的参与和投资中获得价值是有帮助的。你应该更多地考虑增量收益。最终，随着网络增长，预计会有更高的回报出现。


    在设计系统时，你查看用例并确定，当许多行业利益相关者参与多边交易时，提供丰富的功能集是合理的。然而，假设实际价值在许多玩家加入后才产生。在这种情况下，你将会有很长一段时间，在等待所有人加入期间，网络不会产生多少价值。虽然在网络成熟后你有宏大的目标，但你应该将其与早期的快速胜利取得平衡，以鼓励更多参与者在长期内采用。


