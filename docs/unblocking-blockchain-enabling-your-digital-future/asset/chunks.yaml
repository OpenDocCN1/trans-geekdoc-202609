- fmt: '

    # Extra Cost Due to Parallel Running of the System


    Because blockchain is in such early stages, there is a need to prove the benefits
    of new technology. The ability to compare and contrast with existing technology
    also helps with decision-making. A shift of production systems in a phased manner
    can help facilitate that. As the new blockchain-based solution runs parallel with
    existing solutions, it adds to the costs. This duality is good in the long run
    as it manages risk while building confidence in the technology. Because you are
    effectively running two systems in parallel, it does come at a higher cost in
    the short run. It creates even more reasons to have a long-term outlook for ROI.
    Once we have a winner, between the old and the new, we can start seeing the gains
    that we were targeting by using blockchain.


    Dustin Helland confirms this process “requires the new solution to match up against
    whatever the legacy solution is and prove itself worthy. In order to do that,
    it does initially require some additional investment and expense.”[45] Dustin
    Helland has been part of the leadership team driving State Farm’s blockchain strategy
    since 2016.


    State Farm was founded back in 1922. It is one of America’s major insurance companies,
    insuring more cars and homes than any other insurers in the country. They also
    provide other products to their customers, like life insurance and other financial
    services. For their blockchain use case, they chose to work on the netting of
    auto claims subrogation payments between insurers on the blockchain as one of
    the projects to pursue. USAA insurance has been their co-founder for the subrogation
    product. They shared the same vision and saw similar opportunities with a common
    thought process and approach.


    Subrogation is not a common word in everyday parlance, and I had to dig into it
    a little more to understand what it is all about. Let’s say your car gets rear-ended,
    and the other driver is at fault. You will go ahead and start insurance claims.
    That’s when the subrogation process kicks in. In the context of an insurance claim
    coming in, “subrogation” is the process through which your insurance company collects
    money from the at-fault party or their insurance company.


    The US auto insurance industry handles a large number of individual claims subrogation
    payments each day. Subrogation is a highly manual process with dependence on snail
    mail and paper checks. Using blockchain, they have built a system that can maintain
    accounting for each transaction electronically. It then calculates a net manifest
    based on all those transactions. It passes that net on to the organization’s existing
    electronic payment system to enable electronic payment. This move to a blockchain-based
    solution has reduced processing time and increased efficiency, helping State Farm
    pass on the benefits to their policyholder.


    State Farm understands that blockchain solutions will need to be run parallel
    with the existing solution to compare old and new solutions. Simultaneously, it
    does mean an increase in costs as you are effectively running two systems.


    # On the Difficulty of Quantifying Blockchain ROI


    As we discussed earlier in the chapter, blockchain in enterprises is a network
    economics reliant technology. You don’t succeed with blockchain on your own. Besides
    the need to give the network time to mature, the companies don’t know how big
    the network will grow at the start of their journey. The hope is that every stakeholder
    in the industry will join in. That may eventually happen. But, in the beginning,
    you do not know how long it will take for that end state to pan out. The success
    of the network depends on many unknown variables. In light of this situation,
    you have to make projections based on assumptions about the network size. These
    assumptions bring in uncertainty around the ROI projections.


    The ROI is challenging to quantify because blockchain is still relatively new.
    You can’t rely on many available examples for guidance. You can’t lean upon any
    real precedents. Blockchain was first introduced to the world in 2009 with Satoshi
    Nakamoto’s white paper on Bitcoin. That was just over a decade ago. Their packaging
    as blockchain has been recent, even though the various concepts that make up blockchain
    have been around for a few years. More importantly, the use of blockchain for
    solving issues faced by companies is even more recent. `Hyperledger` and `Ethereum`
    were introduced in 2015 with the added layer of smart contracts. This addition
    made blockchain more viable for companies. With such a young technology, you don’t
    have much to lean on for inspiration. There is no guidance on how to use it effectively.
    Quantification of demonstrated value is also missing.


    On the other hand, with the newness of the technology and not having a large body
    of work behind it, blockchain knowledge is scarce. It is also evolving very fast
    with new developments in this nascent space. The ever-changing landscape of blockchain
    technology makes it difficult and expensive to find people with relevant blockchain
    knowledge. The technology will mature over time, and current limitations will
    eventually be solved. Meanwhile, you should consider the evolution of this technology
    and plan for higher costs.


    Other comparable options to solve the same problems include setting up manual
    processes. The use of existing technology can help get these tasks done in a quick
    and dirty manner. The availability of these options makes it difficult for leadership
    to justify emerging technology’s business case in a shorter-term time frame. Remember,
    you can get there faster with incumbent technology, but you give up on sowing
    the seeds to set up blockchain as an enabling technology for your company and
    get its advantages. Over a longer life cycle, your cost will decrease if you bring
    automation enabled by adopting blockchain technology into the picture.


    # Incremental Value Helps with ROI Dilemma


    Collaborating with competitors is new and uncharted territory for businesses.
    You may start your journey corralling everyone around one use case. But as we
    saw in Chapter 3, with the blockchain network maturity model, as the network grows,
    new use cases will evolve based on how the group matures. In reality, there would
    be multiple use cases that the consortium can tap into. All of them necessarily
    may not be visible from the start. When you are looking at ROI, if you can prove
    that the returns on one use case show a pretty cost-benefit, you should consider
    going forward with it. Eventually, newer ones that show up over and above the
    starter use case will add to the returns part of the ROI, even though you can’t
    quantify them at this time.


    Looking for some early traction helps with the ROI situation. It helps to focus
    on how early users can get some value from their participation and investment.
    You should think of it more in terms of incremental returns to start with. Eventually,
    as the network grows, there should be an expectation of higher returns coming
    in.


    When designing your system, you look at the use cases and determine that the real
    value comes when many industry stakeholders are on the network participating in
    multilateral transactions. It would then make sense to provide that rich feature
    set at the launch. However, suppose the actual value comes after many players
    have been on-boarded. In that case, you will have a long period during which there
    isn’t much value coming from the network while you wait for everyone to show up.
    While you may have big goals after the network matures, you should balance that
    against early quick wins to encourage adoption by more participants in the long
    term.

    '
