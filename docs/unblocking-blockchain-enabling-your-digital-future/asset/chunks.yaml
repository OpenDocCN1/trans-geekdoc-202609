    As I marveled at their results and asked Shahar about the lessons he gleaned going
    through the experience, he explained, “The companies that joined forces in that
    project were very much driven by CxO-level executives to make it happen. They
    were driving the product teams and development teams. Industry adopts three horizons.
    Horizon one is our existing services. Horizon two is what we are building today,
    i.e., tomorrow’s services. And horizon three is what will happen three to four
    years from today. Horizon three is something that really needs management with
    the right mindset. With a mindset to push toward something that will only realize
    and give revenues in a few years. Maybe by the time that the respective executives
    will not even be working at the company.”


    ## Try and Choose Low-Risk Processes as the First Use Case


    “We chose a very small process. Spunta is an internal process. It doesn’t involve
    external customers. And it’s not particularly known. So it was a good, a sort
    of, natural sandbox,” explains Silvia Attanasio.[74](#nzx7zm4a.html#mvas0d8rywu)
    Silvia is the head of innovation at ABI (Italian Banking Association) to support
    innovation among the banks in the Italian Banking Association. ABI lab is a consortium
    owned by 150 banks. They work with the banks and for the banks.


    It helps lower the risk with anything new by choosing low-impact processes to
    start with so that it doesn’t ruffle any feathers even if there is an issue. In
    December 2017, ABI labs began working on a project to address the interbank reconciliations
    process (also known as `Spunta`) using blockchain technology. To understand if
    blockchain technology could help, the team visited fourteen different back offices
    in various cities in Italy. They analyzed traditional processes based on how decisions
    are made and the organizational structure of these offices. They also focused
    on the interaction of one bank to another and the resulting flow of activities.


    Spunta is this incredibly complex Italian interbank reconciliation process chosen
    as the subject of the blockchain project. This process has been in place for decades,
    based on interbank agreements beginning 1978. In Italy, these are bilateral accounts
    that are co-owned by two banks. Ownership of this account switches from one to
    the other bank every three years. When the account is `Nostro` and the bank has
    ownership of the account, they can see all the account details like balance, transfers,
    etc. But when the ownership switches to `Vostro` and the other bank has ownership,
    Bank A cannot see any details regarding the account.


    Suppose Bank A needs any information in a vostro account. In that case, they need
    to connect with the other bank using traditional communication mechanisms and
    ask for the information. Back offices of the banks run the process to clear mismatches
    in the double-entry bookkeeping and make sure that the banks at both ends of a
    transaction agree on all aspects of the transaction. It gets complex because it
    is a single account that tries to reconcile the viewpoints of counterparties on
    the same ledger. And, what happens if there is a mismatch? Resolving these mismatches
    requires a lot of time and effort.


    For ABI, the Spunta process seemed like a perfect use case for blockchain. People
    in the Spunta process were asking for improvement. There was a willingness to
    spend time modernizing Spunta and its associated agreements. It was essential
    to get the right people from the right organizations to participate. The conditions
    were right for that to happen. On the other side, the innovation team wanted to
    explore this emerging technology’s potential using a low-risk process. It was
    essential to choose a relatively small internal process that does not impact the
    customers. It was important to select a process on which the team had the authority
    to make decisions. There was no reason to include other regulatory bodies or the
    government in making any changes.


    There would be various considerations in choosing a particular use case to implement
    with blockchain. Factors to look at would include the potential business value
    opportunity presented to you with the proper use of blockchain technology. You
    would also need interest from other partners in the industry because, after all,
    you are working with WE technology. One thing to look at is the hurdles you need
    to jump through to drive the solution to completion. That impacts the pace at
    which you can move the project forward. If we use a low-risk process, we can have
    better control over the pace of the project.


    As Dustin Helland explains, “So, net subrogation as we built it includes data
    that organizations are primarily already sharing, and it also doesn’t include
    highly sensitive customer information. While we’re not necessarily avoiding those
    challenges, we just wanted to be intentional about which ones we chose to take
    on.”[75](#nzx7zm4a.html#mvas0d8rywv)


    ## Early Focus on Education


    Blockchain projects need a new way of organizational thinking because you will
    now be focusing on collaborating with your competitors. An approach leading with
    education and collaboration helps. Investing in building the community also helps
    with the whole process. For ABI, The business side did not know of blockchain
    technology. At the same time, the technical side of the house did not know of
    the Spunta process.


    The first order of business, then, was to get them together. The intent was to
    help the business understand different competencies of the technology and the
    technologists to understand the ways of the business process. To further cement
    this cross-pollination and help gain confidence in the technology and avoid any
    reluctance amongst the participants, they decided to conduct a `POC`.


    As Silvia explains, “One of the main goals of the project was to fully understand
    the technology, the potential and the way this technology could change traditional
    banking. So, we incorporate in the project also some learning phases. We’ve got
    learning sessions with the experts . . . to an audience of fifty or sixty people
    from back offices, from innovation and from IT of fourteen different banks.”[76](#nzx7zm4a.html#mvas0d8ryww)
    That investment in learning helped with increased participation from the consortium
    members.


    A blockchain project needs very different thinking, for one, because you end up
    working directly with competitors. But, internally also, many other groups need
    to get involved. Beyond the technical and business teams, to manage all the consortium-related
    aspects, teams such as legal, security, risk, compliance, public affairs, etc.,
    will also need to get involved. As Dustin Helland explained for State Farm, “The
    way that we got the support and buy-in has been through education, collaboration,
    working side by side, and consistent transparency.”[77](#nzx7zm4a.html#mvas0d8rywx)


    ## Careful Thought to Decide on the Use of Public vs. Private Blockchain


    One critical decision in our blockchain journey will be about the choice of public
    versus private blockchain—more importantly, the choice to proceed with either
    an open public or closed private network. Or maybe—a hybrid? Focus on deciding
    whether you will use a private or public blockchain network is necessary because
    tools matter. For enterprises, privacy and security are essential aspects to keep
    in mind.


    Here are a few terms to help us better frame the conversation. It is good to understand
    these as they are not accurately used in discussions.


    Public vs. Private: This is defined based on who can write data to the blockchain.
    If anyone can write to the blockchain, then it is a public blockchain. `Bitcoin`
    and `Ethereum` are good examples of a public blockchain. On the other hand, it
    is a private blockchain if the write access is controlled.

