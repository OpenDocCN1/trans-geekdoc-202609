    这些交易记录存在于各处的账本上。我们可能不称之为账本，但它们确实就是账本——记录的持续更新流。当你开灯坐在房间里时，你的公用事业公司会不断记录用电量。他们还会计算应收你的费用。对于结算，你可能会在月底收到一张账单。但关于你的用电量和欠款，系统会维持一份持续记录。你的购买记录位于某个账本上，连同你支付的交换金额。我们不断对周围发生的事情进行记录。


    记录交易情况是我们日常生活的关键——无论对个人还是公司都是如此。这些记录让我们回顾过去，并帮助我们规划未来。交易可以快速完成，但结算可能需要长得多，而且维护这些交易的记录可能既耗时又容易出错。这还增加了业务成本。


    例如，你点击“卖出”按钮，卖掉了在线经纪商账户中的股票。如果你想立即获得资金，这不会发生，因为结算过程需要几天时间。这种结算将涉及多个方，他们对同一笔交易都有自己版本的账本。这些实体中的每一个都无法看到对方的账本，必须花费精力和时间对记录进行对账。这些交易本质上是有冲突的。它们为两个参与者都提供了价值，这就是参与者同意交易的原因。但交易是在平衡状态发生的。将这种平衡倾斜向他们的一方将符合所有人的利益。这导致了一个问题：你是否可以信任对方的记录。


    社会需要信任来维持这些交易的持续。他们通过各种方法来维护这种信任。在社会层面，我们有伦理和道德的概念，鼓励诚实可靠的行为以维护个人声誉。在更正式的制度层面，社会试图通过实施管理交易发生边界和条件的规则与法律来遏制不诚实的行为。我们并不信任每个方都会按照道德准则和法律办事；因此，我们实施了各种检查和制衡措施。这些措施的形式包括审计师、第三方信誉机构、法律结构等。


    这一切结合使得 `trust`（信任）得以产生。以金融交易为例。我只需刷卡即可在无需交付任何现金的情况下在商店购买杂货。我可以进行这样的购买，是因为我和商户都信任第三方——金融系统。我愿意把钱存在银行，因为我很清楚，明天早上醒来登录账户时，可能会发现余额为零。我信任银行不会错待我，因为他们想要保护声誉并继续经营。即使银行发生违规，政府机构也制定了法律来保护我。


    区块链通过将信任转向技术，改变了对个人和机构产生信任的需求。借此，它提供了消除那些仅为在我们周围提供信任而建立的基础设施成本的可能性。在区块链上，交易对所有人都是透明的。不需要中间人进行认证，这有助于降低成本。


    今天，当两家公司共同开展业务时，他们通常会对自己的工作保留分开的记录。这些记录不时会出现差异，导致解决起来令人沮丧且耗时的分歧。区块链为共享记录集提供了一种优雅的方法。双方（或多家）公司在将数据记录到共享账本之前，都认为数据是正确的。


    一旦你拥有了这套可靠且共享的记录，你现在就可以在此基础上探索自动化业务流程。这些可靠的数据实现了更顺畅的组织间工作流。区块链允许这种底层基础设施的创建，促进了竞争者之间的协作。


    ## 合作与竞争的悖论


    多年来，随着管理理论的演变，公司调整了策略，将协作纳入以增加利润。通过竞争增加利润曾是公司的首要策略。在试图获得竞争优势的过程中，该策略扩展到包括与各种合作伙伴的协作。这种与竞争对手的合作以战略联盟的形式表现出来。


    竞争对手之间不同程度的竞争和协作行为可以同时存在。竞争对手之间的竞争行为可以从公开战争到微妙摩擦不等。组织之间的协作行为可以从完全整合到零星的协作。这种协作优势可以使公司获得比他们自己所拥有的更多的技能和资源。


    组织通常表现出这些具有矛盾元素的“同时对立面”的存在。“悖论的关键特征是相互矛盾的、甚至是互斥的元素的同时存在。”14 战略联盟中这种合作与竞争的悖论被称为“竞合”（coopetition）。竞合发生的首要前提条件是竞争公司之间利益的重叠。然后，他们会被激励一起工作，以追求创造比他们单独工作所创造更多的价值。区块链将极大增强竞合。它将增强公司间协作的可能性领域。


    将区块链看作不仅仅是新技术；它引入了一种看待世界的新方式。区块链不是纯粹的技术游戏，而是一种技术社会学创新。它帮助以我们以前从未见过的方式改变一群人的行为。它更像是一个技术社会学构架，有助于实现所有各方的共赢。它转变了心态，尝试共同做大饼，而不是像公司在市场中竞争那样将其切分。这是业务模式的一场范式转变，通过打开名为“公司”的孤岛，为客户创造更多价值。


    **那么，什么是区块链？** 它是数据库吗？账本吗？信任层吗？不可不可变的？安全的？无需信任的？防篡改的？去中间化的？区块链可以是所有这些，也可以是其中任何一个。这取决于你的选择。就像印度的盲人一样，区块链的现实取决于你问谁而不同。


    本章应该让你对区块链是什么有了一个良好的概述。现在我们准备好开始探索了。如何开启一段成功的区块链采用之旅？


