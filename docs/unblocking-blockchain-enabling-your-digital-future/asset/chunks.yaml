- fmt: "\n# My Journey with Blockchain\n\nMy journey with blockchain started in the\
    \ first quarter of 2019. As a new calendar year rolled around, we saw many articles\
    \ on various topics reviewing the last year’s happenings. These articles also\
    \ gave the authors’ views into expected progress in the coming year. One fine\
    \ morning, an article flowed through my newsfeed: “Top 5 blockchain predictions\
    \ for 2019.”[5](#wm5bet85.html#mvas0d8ryyf)\n\nAs I finished reading the piece,\
    \ I repeatedly kept going back to a thought that stuck to me. The article highlighted\
    \ the importance of non-technology issues in the success of blockchain projects.\
    \ The relevance of business participation is valid to all technical projects,\
    \ but why call it out specifically in the context of blockchain? I have always\
    \ worked in the technology space from the business side of things, and this focus\
    \ on non-technology issues caught my attention.\n\n## Discovery\n\nLazily, with\
    \ no real goal in mind, I started exploring blockchain. Then, one fine day, a\
    \ direct message popped up. It was Jonathan Blanco inviting me to attend `TF4`.\
    \ It turned out that `TF4` was one of Seattle’s premier blockchain conferences.\
    \ Jonathan didn’t have to offer me the $100 discount to attend; it was happening\
    \ in Seattle that weekend. What was there to lose?\n\nSo, there I was on the thirty-sixth\
    \ floor of `Columbia Towers`, overlooking the lovely view of the Puget Sound,\
    \ surrounded by one hundred other people, listening to speakers talk about blockchain\
    \ and cryptocurrencies. That event was my first introduction to blockchain. The\
    \ conference positioning was for people who had already been working in the blockchain\
    \ space.\n\nFor me, an absolute beginner, it was like drinking from a fire hose\
    \ about all things blockchain. The sessions revolved around the application of\
    \ the technology and were not heavily technical. My first introduction to a new\
    \ blockchain language happened here—mining, tokenization, hash rate, and private\
    \ permissioned networks, etc. And I was hooked.\n\n## The Potential of Blockchain\n\
    \nThe potential that the technology had was fascinating. The use of tokens could\
    \ democratize investments in commercial real estate, infrastructure projects,\
    \ etc. This application of blockchain could allow small investors to participate\
    \ in these large-sized investments. The possibility of using the blockchain in\
    \ voting—which could enable vote tallying to be real-time, accurate, and tamper-proof—would\
    \ be so cool. The ability to track and trace—it has such potential. \n\nIf I could\
    \ track where my donation money is going, I would be more likely to donate to\
    \ people in need. Every time a natural disaster happens, all these options show\
    \ up on Facebook and websites, asking for donations. But who knows where that\
    \ money is going? For all I know, the moment I push that button to pay, it goes\
    \ and just sits in somebody else’s bank account. It seemed like this blockchain\
    \ could provide a solution.\n\nSo many different possibilities were showing up.\
    \ At least, that was the promise. There was a hint of what might be possible.\n\
    \n## Enterprise vs. Cryptocurrency\n\nAs I was trying to learn more about blockchain,\
    \ I attended as many meetups and conferences as possible. However, much of the\
    \ conversation was about cryptocurrencies and fintech. There was not much talk\
    \ of the use of this technology in the enterprise space. This was perhaps because\
    \ there has been more money flowing into cryptocurrency companies.[6](#wm5bet85.html#mvas0d8ryyg)\
    \ The conversation follows activity, which follows the money.\n\nCommunications\
    \ coming out of enterprise customers mirror that conversation. As we can see below,\
    \ the corporate mentions of the word “blockchain” dropped.\n\n## The Hype Cycle\n\
    \nCommunications coming out of enterprise customers mirror that conversation.\
    \ As we can see below, the corporate mentions of the word “blockchain” dropped.[7](#wm5bet85.html#mvas0d8ryyg)\n\
    \n![mvas0dryzx]\n![mvas0dryzy]\n\nUntil now, it was interesting, but I could not\
    \ figure out how. The conversation follows activity, which follows the money.\n\
    \nGartner has its Hype Cycles framework to help business and technology leaders\
    \ frame emerging technologies and interpret the hype that comes with them. Is\
    \ it just hype?[8](#wm5bet85.html#mvas0d8ryyi) In our case, blockchain is currently\
    \ supposed to be in “trough of disillusionment.”\n\nPer Gartner’s description\
    \ of the trough of disillusionment, “Interest wanes as experiments and implementations\
    \ fail. Producers of the technology shake out or fail. Investments continue only\
    \ if surviving providers improve their products to the satisfaction of early adopters.”\n\
    \nIs the interest in blockchain waning?\n\n![mvas0dryyh]\n![mvas0dryzx]\n![mvas0dryzz]\n\
    \nIf you were to follow the money, it would indicate that blockchain technology\
    \ does not have enough tailwinds. Data by CB Insights seems to confirm that hypothesis.\
    \ Looking at venture capital (VC) funding trends in blockchain, the report shows\
    \ that in 2019, funding dollars fell over 30 percent, compared to the year before.[9](#wm5bet85.html#mvas0dryyj)\n\
    \n![mvas0dryry]\n![mvas0dryzy]\n\nOn the other hand, headlines are going through\
    \ my newsfeed: “Why Mastercard’s Blockchain Focuses on Practical Applications,”\
    \ “How Walmart and Others Are Riding a Blockchain Wave to Supply Chain Paradise,”\
    \ or “Figure Technologies Raises $103M to Continue Blockchain-Based Lending.”[10](#wm5bet85.html#mvas0dryyk)\
    \ There are also the big household names working on blockchain projects, such\
    \ as Starbucks, Samsung, and more.[11](#wm5bet85.html#mvas0d8ryyl) IT services\
    \ companies are putting money and resources behind advisory services to support\
    \ their clients with worldwide blockchain services: Accenture, IBM, Infosys, etc.\n"
  raw: 'My journey with blockchain started in the first quarter of 2019. As a new
    calendar year rolled around, we saw many articles on various topics reviewing
    the last year’s happenings. These articles also gave the authors’ views into expected
    progress in the coming year. One fine morning, an article flowed through my newsfeed:
    “Top 5 blockchain predictions for 2019.”[5](#wm5bet85.html#mvas0d8ryyf)


    As I finished reading the piece, I repeatedly kept going back to a thought that
    stuck to me. The article highlighted the importance of non-technology issues in
    the success of blockchain projects. The relevance of business participation is
    valid to all technical projects, but why call it out specifically in the context
    of blockchain? I have always worked in the technology space from the business
    side of things, and this focus on non-technology issues caught my attention.


    Lazily, with no real goal in mind, I started exploring blockchain. Then, one fine
    day, a direct message popped up. It was Jonathan Blanco inviting me to attend
    TF4. It turned out that TF4 was one of Seattle’s premier blockchain conferences.
    Jonathan didn’t have to offer me the $100 discount to attend; it was happening
    in Seattle that weekend. What was there to lose?


    So, there I was on the thirty-sixth floor of Columbia Towers, overlooking the
    lovely view of the Puget Sound, surrounded by one hundred other people, listening
    to speakers talk about blockchain and cryptocurrencies. That event was my first
    introduction to blockchain. The conference positioning was for people who had
    already been working in the blockchain space.


    For me, an absolute beginner, it was like drinking from a fire hose about all
    things blockchain. The sessions revolved around the application of the technology
    and were not heavily technical. My first introduction to a new blockchain language
    happened here—mining, tokenization, hash rate, and private permissioned networks,
    etc. And I was hooked. 


    The potential that the technology had was fascinating. The use of tokens could
    democratize investments in commercial real estate, infrastructure projects, etc.
    This application of blockchain could allow small investors to participate in these
    large-sized investments. The possibility of using the blockchain in voting—which
    could enable vote tallying to be real-time, accurate, and tamper-proof—would be
    so cool. The ability to track and trace—it has such potential. 


    If I could track where my donation money is going, I would be more likely to donate
    to people in need. Every time a natural disaster happens, all these options show
    up on Facebook and websites, asking for donations. But who knows where that money
    is going? For all I know, the moment I push that button to pay, it goes and just
    sits in somebody else’s bank account. It seemed like this blockchain could provide
    a solution.


    So many different possibilities were showing up. At least, that was the promise.
    There was a hint of what might be possible.


    As I was trying to learn more about blockchain, I attended as many meetups and
    conferences as possible. However, much of the conversation was about cryptocurrencies
    and fintech. There was not much talk of the use of this technology in the enterprise
    space. This was perhaps because there has been more money flowing into cryptocurrency
    companies.[6](#wm5bet85.html#mvas0d8ryyg) The conversation follows activity, which
    follows the money.


    Communications coming out of enterprise customers mirror that conversation. As
    we can see below, the corporate mentions of the word “blockchain” dropped.[7](#wm5bet85.html#mvas0d8ryyh)


    ![](mvas0d8ryzx.jpeg)


    ![](mvas0d8ryzy.jpeg)


    Until now, it was all interesting at an intellectual level, but I could not figure
    out how I might be helpful in this space. All of that changed with the talk by
    IBM’s Paige Krieger at the Hyperledger Seattle meetup. Paige’s session was when
    my fascination with blockchain found a home. 


    Her talk was all about “enterprise blockchain.” No cryptocurrencies here. And
    I just sat there and listened with all the possibilities taking form in my head.
    That session gave me my first taste of things that could create value for enterprises
    using blockchain. From there on, as I followed my curiosity, I discovered a fascinating
    new world of possibilities—a world where competitors worked together to generate
    value that was not possible before.


    As my fascination grew, I looked to answer a personal question—whether or not
    it made sense to invest time and energy in this emerging technology. I could certainly
    sense the potential, but then, there was a conflict in the narrative. Furthermore,
    the truth of the matter is that today’s business and technology leaders also face
    the same questions. 


    New technology is knocking on your door with the promise of an opportunity to
    do good for your company. You could increase revenue by unlocking new value and
    decrease costs by helping competitors turn into cheerleaders for each other. But—and
    there is that “but”—is there a business case worth pursuing? Even if the ROI is
    justified, is now the right time? 


    Suppose you act right away, and the technology does deliver what it promises.
    In that case, you can grab a competitive advantage by exploiting new opportunities
    before your competitors. But, if you are too late to the party, you are just catching
    up and trying to stay in the game. 


    What if it is just hype?


    *Unblocking Blockchain* is a journey to unravel that hype.


    Gartner has its Hype Cycles framework to help business and technology leaders
    frame emerging technologies and interpret the hype that comes with them.[8](#wm5bet85.html#mvas0d8ryyi)
    In our case, blockchain is currently supposed to be in the “trough of disillusionment.”


    Per Gartner’s description of the trough of disillusionment, “Interest wanes as
    experiments and implementations fail to deliver. Producers of the technology shake
    out or fail. Investments continue only if the surviving providers improve their
    products to the satisfaction of early adopters.” 


    Well then, is the interest in blockchain waning?


    ![](mvas0d8ryzz.jpeg)


    If you were to follow the money, it would indicate that blockchain technology’s
    interest does not have enough tailwinds. Data by CB Insights seems to confirm
    that hypothesis. Looking at venture capital (VC) funding trends in blockchain,
    the report shows that in 2019, funding dollars fell over 30 percent, compared
    to the year before.[9](#wm5bet85.html#mvas0d8ryyj)


    ![](mvas0d8ryz0.jpeg)


    On the other hand, headlines are going through my newsfeed: “Why Mastercard’s
    Blockchain Focuses on Practical Applications,” or “How Walmart and Others Are
    Riding a Blockchain Wave to Supply Chain Paradise,” or “Figure Technologies Raises
    $103M to Continue Blockchain-Based Lending.”[10](#wm5bet85.html#mvas0d8ryyk) There
    are also the big household names working on blockchain projects, such as Starbucks,
    Samsung, and more.[11](#wm5bet85.html#mvas0d8ryyl) IT services companies are putting
    money and resources behind advisory services to support their clients with worldwide
    blockchain services: Accenture, IBM, Infosys, etc.


    So, what is the truth? Is blockchain useful or not? Is it an emerging growth opportunity,
    or is it doomed to stay stuck in a trough of disillusionment, never to climb up
    the “slope of enlightenment?” Is it coming out of the trough? If not, when might
    it do so? How do we know that it is on an upward trajectory? Should business leaders
    and technology leaders invest their time and money into this new technology now?
    More importantly, where are we headed from here?'
