  trans: "\n\n既然你已经创建了产品，你需要在不被抓获的情况下将其售出。为什么不在世界上的某个偏远角落开一家在线药店呢？那里没有有效的药物监管，远离监管机构的触及？1\
    \ 随着世界应对一场导致全球数千人死亡的流行病，一个成熟且全新的机遇已经出现。随着疫苗和其他其他疗法的开始推出，人们寻找一切可能的方法来获取它们，这是合乎逻辑的。2\n\
    \n我的区块链之旅始于 2019 年第一季度。随着新一年的到来，我们看到了许多关于各种主题的文章，回顾过去年的经历。这些文章也表达了作者对来年进展的预期。在一个清朗的早晨，我的信息流中滑过一篇文章：“2019\
    \ 年区块链前 5 大预测”。5\n\n正如 FarmaTrust 的 Najib Rehman 所说：“我们可以与你合作，向你展示差异在哪里。我们想做的是与你现有的技术并行运行。然后，当你看到区块链分布式特性的真实价值时，这意味着你可以对数据进行不可篡改的信任。你就会明白，为什么在某个时刻，你可能想要关闭旧的东西并完全迁移过来……我相信，转折点即将到来。”4\n\
    \n11 \n\n# 前言\n\n### 盲人摸象 – 约翰·戈德弗里·萨克斯诗歌（1816–1887）\n\n印度有六位仁人，他们博学多才，\n他们去去看大象（尽管他们都是盲人），\n\
    每个人都想通过观察，来满足自己的想法。\n\n`First` 走向大象，不小心摔倒了，\n撞在它宽阔而结实的侧面，立刻大大大叫起来：\n“上帝保佑我！但这大象非常像一堵墙！”\n\
    \n`第二` 摸到了象牙，喊道：“噢！我们发现了什么，\n如此圆润、光滑又尖利？对我来说非常清楚，\n这头大象的奇迹，非常像一根矛！”\n\n`第三` 靠近动物，恰好抓住了\n\
    那条蠕动的象鼻子，在手中，大胆地站起来说道：\n“我明白了，”他说，“这大象非常像一条蛇！”\n\n`第四` 伸出急切的手，摸着膝盖：\n“这只奇幻兽最像什么，显而易见，”他说，\n\
    “很清楚，这大象非常像一棵树！”\n\n`第五` 碰巧摸到了耳朵，说：“即使是最盲的人，\n也能看出这最像什么；谁能否认这个事实就来吧，\n这头大象的奇迹，非常像一把扇子！”\n\
    \n`第六` 刚开始在兽身上摸索，\n就抓住了那摇晃的尾巴，那正好进入了他的视野，\n“我明白了，”他说，“这大象非常像一根绳子！”\n\n于是，这些印度人，大声且长时间地争论，\n\
    每个人都坚持自己的意见，极其固执且强硬，\n尽管每个人都有部分是对的，而所有人都是错的！\n\n# 第一章\n\n## 什么是区块链？\n\n“我一直听到关于区块链，是吗？”有一天我妻子问道。\n\
    “区块链是一个跨多个计算机的共享账本，”我回答道。它是一个不断增长的列表，不断添加新的交易。你把股票卖给另一个人：这是一次交易。你的仓库从运输公司收到货物：这也是一次交易。\n\
    \n区块链作为一种记录系统，以块的形式存储数据，只有在大多数人同意这些确实是需要存储的正确数据后，才会被添加。这是一个去中心化的系统，意味着没有中央机构。相反，账本由参与者网络维护。\n\
    \n一旦交易在账本上记录，它几乎是不可能更改的。在理论上，极少数情况下是可能的，但考虑到技术的发展水平，还没有足够的计算能力可以在不被察觉的情况下对数据进行更改。因此数据能够抵抗恶意行为者的操纵。\n\
    \n这种数据也是共同财产，因为它是由对数据感兴趣的参与者集体维护的。他们都关心数据并希望相互进行交易，尽管他们并不一定信任对方。共享的现实意味着，不需要维护我版本的真相与你版本的真相对比。\n\
    \n## 业务定义\n\n### 电梯演讲：\n\n区块链是一个跨多个计算机的共享记录系统。它几乎不可删除，存储安全且由集体维护。\n\n### 安全与加密\n\
    \n数据还使用密码加密技术进行安全存储。这种信息的存储方法类似于现在存储密码的常用方法。假设丢失了在线账户的密码。在这种情况下，管理员通常会要求你重置密码，而不是直接告诉你密码是什么。那是因为他们不知道你的密码。\n\
    \n当你尝试登录并提交密码时，明文密码会被加密，这个加密版本会与你第一次创建密码时生成的加密字符串进行比较。如果两个字符串匹配，你就能获得访问权限。即使知道它的加密形式，别人无法通过逆向工程找到实际密码。\n\
    \n同样，密码加密保护了存储在区块链上的交易数据。密码加密的使用使得限制只有授权方才能访问数据成为可能。\n\n"
- fmt: '

    Here is a visualization that might help further clarify the process. Think of
    blockchain as an ever-growing list of transactions in a shared spreadsheet. There
    was a time when people needed to collaborate on a spreadsheet; you would create
    one, complete your work, save it, and forward it to another team member so they
    could make their updates. In today’s world of shared spreadsheets, you could all
    be working on the same spreadsheet at the same time. Blockchain works similarly.
    The difference is that, on a blockchain, multiple computers store the data. If
    all participants agree that it is the correct data, data gets stored. It is also
    encrypted, and deletion is practically impossible.


    Now let’s look at the technical definition to give added color to our understanding
    of blockchain.


    ## Technical Definition


    ### Technical Elevator Pitch:


    Blockchain is a `distributed database technology` that stores data across `multiple
    nodes over a P2P network`. This database is `append-only`, `cryptographically
    secured`, and committed to using `consensus mechanisms`.


    At its core, blockchain is a distributed ledger technology. The ledger is a chronological
    record of transactions. The distributed nature of the ledger comes because multiple
    computers store it over a peer-to-peer network. A node is one of the computers
    on the network that can save the data. All nodes have the exact copy of the data,
    giving us a shared reality with the same version of the truth.


    Mainstream database technologies allow for create, read, update, and delete functions
    to be applied to stored data. Blockchain, however, is an append-only data technology.
    You are only allowed to create or read a record. No deletion or updates are permitted.
    This characteristic gives blockchain its immutable and tamper-evident characteristics.
    Suppose you need to make changes to a previous entry. In that case, you need to
    create new entries nullifying the prior transaction before adding new information.


    Before being added to the ledger, various consensus mechanisms are used to confirm
    a transaction’s validity.


    As the transactions are confirmed and added to the ledger, they are grouped in
    a block. As the new blocks keep getting added, they link to the previous block
    using cryptographic encryption. This linking of blocks of transactions creates
    a continuous chain—hence the name blockchain.


    The following picture brings it all together:


    ![](mvas0d8ryzr.jpeg)


    ## Blockchain Benefits Framework


    Blockchain has a unique value proposition to help us in real-world situations
    based on benefits derived from its various qualities. Let’s take a look at this
    benefits framework.


    ### Shared Truth:


    Since the blockchain data is shared, everyone has access to the same data. There
    is no need to maintain two different copies representing that data. Suppose two
    parties want to transact with each other based on this data. In that case, it
    eliminates the burden of verifying, reconciling, or auditing the information.
    Any associated costs for those activities also go away. Consequently, this also
    removes the added costs of maintaining intermediary services that guarantee data
    authenticity. Everyone viewing the same data reality makes this possible.


    ### Multiple Computers on a Peer-to-Peer Network:


    Having various distributed copies of the data makes the system resilient. Because
    there is no single point of failure, it protects against denial-of-service (`DoS`)
    attacks. Suppose one of the peers is inaccessible for any reason. In that case,
    you can still access the data sitting on other computers, adding to the overall
    resiliency.


    ### Immutability:


    Since, practically, no one can delete the data, we have transparency into a common
    stream of data reality. This increases trust in the data as it can be traced and
    audited for any changes. Traceability enables us to trust the data without the
    help of a verified third party or a central authority.


    ### Cryptographic Encryption:


    The use of cryptography in blockchain leads to increased data security. The use
    of digital signatures allows two entities, who do not trust each other, to participate
    in a secure exchange.


    ### Consensus:


    Consensus is the approval mechanism for all peers on the blockchain to reach a
    joint agreement on the transactions added to the blockchain. It ensures that a
    transaction is genuine and acceptable. The use of consensus allows for not needing
    a central authority to verify and validate the transactions and cuts out the middlemen
    and the associated costs.


    Overall, it’s about trust. I know peers have validated this data. I know nobody
    has tampered with it. I can also see it as it evolves. I see the data is secure.
    All of these aspects build trust in data on the blockchain.


    ## Smart Contracts


    In addition to recording transactions, meeting certain data conditions can also
    automatically execute code that implements business rules. For example, when your
    warehouse records a transaction for receipt of goods, a vendor’s payment can automatically
    be released. This code is called smart contract and makes it possible to automate
    the execution of the business workflow.


    Typically, contracts help when two people want to transact but do not necessarily
    trust each other. In the current paradigm, they trust an independent third party
    to enforce the contract’s execution. These third parties are typically large institutions
    like government bodies, banks, lawyers, and accountants. Instead, smart contracts
    build the logic for the automatic execution of those contracts onto the blockchain.
    We get a consistent and predictable output with deterministic input.


    ## Blockchain vs. DLT


    We should keep in mind that distributed ledger technology (`DLT`) is the umbrella
    term, and blockchain is one type of `DLT`. Perhaps because it is catchier, the
    word “blockchain” has seen more industry traction. Throughout our conversation
    in this book, I’ll use blockchain as the generic common noun to refer to all kinds
    of `DLT`. In the end, all `DLTs` possess similar characteristics and aim to achieve
    similar outcomes. Their methods may be different, but their results are identical.
    A few examples of these are `IOTA Tangle`, `Ripple`, and `Hedera Hashgraph`.


    ## Blockchain vs. Bitcoin


    We should also keep in mind that blockchain is not Bitcoin, and Bitcoin is not
    blockchain. I consistently notice that people often mistake blockchain for Bitcoin.
    When I gave the first two chapters of this book to my friend, Glenn—to ask for
    his feedback—he said, “Oh, I did not realize Bitcoin could do all that?” after
    reading the excerpts. This is even despite the fact that I did not mention the
    word Bitcoin once in any of those chapters.


    Blockchain is the underlying technology that enables Bitcoin. Blockchain did get
    introduced to the world as Bitcoin. Since then, Bitcoin has also been the most
    visible of blockchain use cases as a form of cryptocurrency. With the introduction
    of smart contracts, blockchain technology’s utility has moved beyond the confines
    of cryptocurrencies and into the realm of value addition in other processes.


    ## Why Should You Care?


    If you look at blockchain like any other data storage technology, why should you
    care? Isn’t it just a database? In the end, blockchain is not introducing any
    new technology. It is just a unique combination of existing technology concepts
    like ledgers, linked lists, peer-to-peer networks, encryption, and databases.
    What is the big deal?


    Businesses don’t work in isolation. They continually transact with other companies,
    governments, institutions, etc., forming business networks. Human enterprise is
    thus a series of transactions. Any object you see around you has reached you after
    changing hands multiple times across various parties. We live our lives surrounded
    by a web of transactions transferring value between parties.

