    通过基于区块链的解决方案，在点对点（P2P）过程中不再需要多份文档。一切都变成了一个账本。如果出现问题，你无需担心该记录是否可以被审计以及具有完整性。它是作为技术栈的一部分直接内置的。


    “这就是为什么我们相信区块链将改变世界。它将实现不同的业务模式。如果你能像今天发送短信或发送电子邮件一样容易地进行交易，想象一下，如果你能像那样容易进行交易，商业世界将会发生多少变化.”24
    泰国银行（SCB）之所以使用区块链，是因为他们无法以经济可行的方式使用现有的技术栈。


    SCB 于 2017 年启动该项目，并在 2018 年 3 月发布了第一版本的概念验证（`POC`）。`POC` 证明了该解决方案是有效的。他们从那里开始扩大规模，并于
    2018 年 8 月通过真实交易投入生产。从那里开始，他们花费了一年的时间规模扩大到一百个供应商。


    最初，进展较慢，因为正如许多 IT 项目一样，生产环境中的现实实施带来了自身的一系列复杂问题。各种边缘情况和异常都接踵而至，例如，有人分批发货。某些货物由于质量问题被拒绝。有时部分零件会被替换，等等。他们花费了一年的时间来识别并修复这些异常。现在，他们可以以每周约一百个供应商的速度进行扩展。越来越多的大型公司表现出加入该网络的兴趣。当你看到这种反应时，你就知道参与者看到了某些真正的价值。


    ## 对于 SCB 项目的参与者来说，这种价值是什么？


    “是生产力，”Orapong 说道。他接着补充道，“如果你观察现在的世界，你有多个参与者。你有一个大买家、多个供应商、买家的付款银行以及供应商的融资银行.”25
    在有这么多参与者参与、且没有整合的情况下，整个过程变得非常繁琐。在供应商提交发票后，可能需要两到三周时间才能完成审批。这段时间用于完成“三方对齐”，即：发票与采购订单、收货单和货运单进行匹配。发票提交后，需要持续跟进，以明确买家应付账款部门的接收、处理和操作情况。“从买家的角度来看，应付账款部门需要花费大量时间处理这些文档并在过程中回答问题。这个平台解决了所有这些问题。我们能够在发票提交的当天完成审批。”26


    银行也看到了许多益处。正如 Orapong 所确认的，“过去，如果供应商需要现金流融资，他们必须等待三周才能获得发票审批，这意味着在这三周内，银行无法提供贷款。现在，我们将这段时间缩短到了一天，这意味着银行多了三周的时间为供应商提供发票融资.”27


    由于该解决方案的透明性，银行可以从一开始就看到交易，从发布 `PO` 的开始到提交发票的结束。这种可见性的提高显著降低了他们的回收风险，使他们能够以更利率为融资定价，因为他们不需要为风险提供补偿。此外，他们还可以取消发票融资的处理费，因为他们可以自己看到交易。“这样一来，你们不再是以
    18% 的利率提供融资，现在提供的利率低于 5%——因为没有成本和风险。”28 为了强调这一点，像泰国水泥集团（Siam Cement Group）这样的早期采用者已经将流程时间缩短了
    50%。29


    ## 创造业务价值


    对于寻求新兴技术的公司来说，另一个框架是增加利润。利润来自于增加收入或降低成本。“通过这项技术我们可以做什么？通常情况下它可以做到三件事：降低成本，或者提高工作的便利性，”Tony
    解释道。他是 Optum（联合健康集团的一部分）的集成高级总监，也是区块链战略的关键贡献者。对于该项目的用例，他继续说道，“医疗保健领域存在哪些问题，如果某家公司自己解决这些问题将具有巨大的优势？而且没有任何公司可以完全解决它。基本上，你正在寻找众包解决的问题，大家都能赢。”这涉及到多个参与者的问题。


    在 2016 年，Optum 决定评估区块链技术。团队的首要任务是了解区块链基础并进行评估，以清楚它是什么、不是什么。在这些理解的基础上，下一个要回答的问题是：它将如何影响我们的业务？公司发起了全范围的用例收集以供评估。这种方法的方法有助于团队对真实的风险和真实的收益得出客观结论。一次为期两天的工作会议汇集了业务和技术领导者。


    头脑风暴的结果产生了一个数据视角的医疗保健行业大纲。白板上填满了各种类型的数据和广泛用例。考虑了医疗记录、索赔、费用和资本化模型。这些用例涵盖了联合健康参与的整个医疗保健领域。接下来是将此地图与区块链技术进行比较，考虑到技术的成熟度及其可能性和局限性。现在是时候划掉那些区块链无法解决的问题。所有被划掉的项目都对应了为什么它们不适合区块链用例。


    最后，团队确定了“提高提供者数据准确性”这一用例。提供者数据是份半公开的医生列表，包含其人口统计信息，例如医生的姓名、诊所电话、地址以及是否接收新患者等。这些数据需要为保险公司的每个网络内提供者（即支付方）保持最新更新。保险公司每年联系提供者几次，以验证信息并询问：“嘿，有什么变化吗？”对于保险公司网络中的所有医生来说，他们必须联系并确认数据。这些信息过时很快。数据必须不断更新，并为所有保险公司创造了多次重复的验证负担。


    整个医疗保健体系内的保险公司每年在维护其提供者数据记录准确性的流程上总计耗资了超过 21 亿美元。30


