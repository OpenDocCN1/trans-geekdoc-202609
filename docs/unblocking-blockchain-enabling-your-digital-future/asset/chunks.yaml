    “我进去说：‘是的，我们有了一些新东西。它非常有前景。但我们完全不知道能从中获得什么，’ . . . 我开始时给他们看了一张照片。那是一张欺骗眼睛的图片。如果你从一个角度看，它像是一只鸟；如果你从另一个角度看，它像是一只兔子。所以我我在那个时候告诉他们，我不知道我卖给你们的是一只鸟还是一只兔子。如果是鸟，它会飞起来；如果是兔子，它会挖洞，然后你们再也见不到它了。”39


    正如我们在第 2 章看到的，Orapong 深参与了苏业银行（SCB）的区块链工作。在对话开始时，Orapong 以这种方式向泰国中央银行（Siam Central
    Bank）的合作伙伴介绍了他们的区块链项目。在对对区块链项目的投资做出决策时，公司高层领导发现自己正处于同样的十字路口。即使团队已经做了尽职调查，并识别了所有项目参与者的价值，问题仍然是：这是否值得投入成本？


    投资回报率（ROI）直接衡量了特定投资相对于其成本的净收益。回报是我们预期区块链项目能提供的业务价值的量化。成本是 ROI 计算的另一个方面。然而，这种基础的
    ROI 计算忽略了时间对区块链项目投资的影响。在将区块链项目与公司领导层可以获得的新兴技术领域的其他竞争投资选择进行比较时，时间会影响决策。


    ## 时间作为一个因素：需要更多时间


    在对区块链项目做出早期决策时，时间因素至关重要。各种因素会起作用，可能导致区块链项目需要更多时间才能产生回报。区块链项目伴随着变化。人们天性地抵制变化。因此，需要长远眼光和大量的耐心，给人们时间适应新的常态。由于涉及多个利益相关者，让许多组织达成共识并以合作的新工作方式向前推进，对于区块链项目来说是困难的。达成共识作为前进的道路也需要时间上的投入。


    区块链价值的核心部分归功于网络经济学。为了利用网络效应而建立的业务通常需要多年时间才能实现盈利。“如果非要我给一条建议，那就是真正理解区块链和区块链网络为你的项目带来了什么价值，并对此非常精确。然后保持耐心。我们现在看到的网络业务、社交网络是花了多年才建立的，对吧？它们的价值真正来自于让，你知道，全球三分之二的人加入
    Facebook 或你想讨论的任何其他平台。所以基于区块链的网络价值也将是类似的，”Stephanie Hurder 说道，我们在第 2 章中遇到过她。40


    我们周围有很多种经营多年后才实现盈利的网络业务案例。Facebook 是一个例子，Twitter 也是如此。41 对于任何依赖网络效应的产或服务，创始成员赚大钱将是好几年后的事情。短期内看
    `ROI` 数值作为决定是否追求区块链项目的衡量标准是不正确的。在投资者的审查面前，科技公司的高级领导可以采取这种长远眼光吗？


    ## 投资作为一个因素：需要更多投资


    “像区块链和分布式账本之类东西——它们需要临界规模才能实现益处。让足够的人接受教育，让足够的人完成 POC（概念验证）之旅，让足够的人通过他们的投资委员会并到达最后，还有额外的资金用于商业化，这花费了更多的时间，因为你需要那种网络效应才能成功，”Andrew
    Speers 说道。42 Andrew 曾担任苏格兰皇家银行（`RBS`）的产品与创新总监。`RBS` 是一家国际银行和金融服务公司。他们与其他行业参与者合作，各种区块链倡议：首先是
    `Coadjute`，致力于简化英国房地产市场；其次是 `Marco Polo`，一个由银行、技术合作伙伴和公司组成的金融网络，致力于贸易融资的透明化；第三是
    `Contour`（原名 `Voltron`），致力于贸易金融行业，从信用证开始。由于通过在 `RBS` 参与区块链项目，Andrew 对推动区块链项目所需的努力有了深入的洞察力。


    通过与多个区块链项目合作，`RBS` 意识到许多因素会增加 `ROI` 计算中的成本。除了留时间让网络效应发挥作用，你还必须对学习技术进行早期投入。对于像
    `RBS` 这样的大型，如果任何银行的业务客户有多产品需求，他们的体验通常是非常碎片化的。这为什么不会那样呢？用户的旅程并不一定影响产品设计。在银行中，产品创建通常围绕银行内部特定专业领域的孤岛展开。在获得复杂需求的服务时，企业客户必须经过各种孤岛部门，如业务发起部门、信誉评估、外汇、贸易融资、保险、风险等。通过所有这些孤岛最终为客户创造了非常脱节的体验。


    用户体验脱节的一个原因是大型金融机构如何收购其他拥有自己系统和流程的小型公司。有时，收购方的的回可能是可能是将被收购公司作为独立组织保留，继续使用自己的系统，而这些系统是需要整合的。这种方法进一步导致了导致糟糕体验的内部碎片化。


    为了应对这些以及影响用户体验的挑战，`RBS` 很早就发现了区块链的机遇。正如 Andrew 所说：“技术——分布式账本技术现在到了一个成熟点，可以帮助人们将这些融合在一起。技术正在跟上。我们可以通过具有可识别数据的分布式架构来创建以客户为中心的体验，这些数据可以无缝地缝合到定制方案中。因此，你可以将外汇稍微连接到信誉评估，再连接到贸易融资等。一旦你的数据进入分布式机器，智能合约就可以将数据发送到它需要去的地方并自动交易，或者比现在更自动，从而改善用户体验。”43


    对于区块链，在早期 `RBS` 就让一些才华横溢的工程师团队审视了这项技术。工程师测试、玩耍并习惯了这项技术。当明显有足够的用例时，他们建立了一个以区块链为核心的卓越实践社区。


    当公司处于区块链之旅的起点时，组织对新兴技术商业化的理解是有限的。通过一个专注于区块链技术的集中职能来运行，有助于评估大量的用例列表。建立 `COE` 的投入是一项预付成本，构成了
    `ROI` 计算中的分母。正如 Andrew 确认 `RBS` 的选择一样，“任何机构都需要准备好在新事物出现时烧一点钱，去测试它，玩玩它。我们在图片中非常早期就这样做了。”44


