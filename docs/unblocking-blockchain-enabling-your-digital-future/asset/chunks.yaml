    正如我们在沃尔玛的案例（第 5 章）中所学到的，在供应链的不同部分隔离问题的根源需要很长时间。“我带了一包切片芒果进入我的员工会议。我把它放在桌子上，对团队说：‘追溯研究现在开始。计时，并告诉我这些芒果是从哪里来的，哪个农场，哪个国家。’你们知道他们完成这件事花了多久吗？他们花了整整七天！花七天时间，是因为他们必须亲自联系供应商，获取纸质记录……然后他们必须联系进口商，”弗兰克·亚纳斯（Frank
    Yiannas）说道。94 这种延迟对供应链中的生产者产生了极其不利的影响。




    当然，大型零售商确实会遭受经济损失和声誉损害，但他们也有保险来保护自己。这正是公司和供应链采用这种技术的动力和需求驱动力。假设我们能够准确定供应链中污染发生的地点。在这种情况下，你可能能够防止其他利益相关者免遭受同样严重的经济损失。基于此，可以重新调整保险产品。


    ### 食品供应链中的浪费：社会影响


    我们讨论了商业背景下食品浪费的责任方面。但区块链还可以产生社会影响。联合国食品粮农组织（FAO）声称：“世界饥饿问题正在上升；然而，估计全球生产的所有食物有三分之一流失或被浪费。”为了更清楚地说明食品损失和食品浪费，粮农组织提供了“食品损失指数”（FLI），它通过计算从供应链到零售商的损失估算值。“FLI
    的初步估计告诉我们，世界上约 14%的食物在收获后到零售水平之间（但不包括零售阶段）丢失了。”95


    同时，粮农组织还发现，“估计总共有 8.42 亿人遭受慢性饥饿，经常无法获得足够的食物来维持活跃的生活。”96 遗憾的是，由于人口迁移和其他各种问题，这些数字只会增加。我们面临着这样一个双重问题：三分之一的农产品被浪费；与此同时，地球上有许多接近十亿的人处于营养不足或营养不良状态。


    随着供应链变得日益数据驱动，你应该利用数据来解决效率低下、浪费和污染问题，并在隔离污染发生地点方面。如果一袋米被玻璃颗粒污染，或者一个苹果被李斯特氏菌污染，我们不需要对零售商说：“好的，你必须销毁每家商店每个货架上的每一个苹果。”相反，你可以准确定位发生污染的农场、包装厂或供应链中的某一点。这减少了每个人的法律责任和经济损失。


    正如弗兰克·亚纳斯继续告诉我们的那样的：“一旦我们完成了概念验证，我们就转到区块链解决方案并直接登录。通过输入批次号或……[扫描]二维码，你们认为我们回溯花了多长时间？2.2
    秒！在将食品追溯到农场的能力上，我们已经从七天缩短到了 2.2 秒。不仅如此，我们不仅能追溯到农场，而且由于我们在区块链上捕了了信息，我们在链的每个环节都拥有额外的信息和洞察。”97


    ### 区块链对供应链的独特价值主张


    由于苹果供应链中因污染导致的食品浪费，区块链在帮助解决这一问题方面具有独特的价值主张。在苹果供应链中，零售商拥有来自追踪器产生的数据。但正如包装厂教给 Penta
    的那样，供应链的每个成员只能看到向前一步和向后一步。这就是他们可见性的范围。我们正在处理的问题，如污染或不符合特定产品法规的环境，可能会发生在供应链的任何点。


    我们需要一个稳健的数据收集系统，从所有利益相关者那里收集数据。这正是现有技术无法做到的。每个利益相关者都有自己的系统。因此，信息是孤岛化的。他们并不一定相互共享信息。也许他们会与大型零售商共享，因为这是对他们的要求。


    所以归结底，问题在于信任。你拥有一个包含多个利益相关者的复杂价值链，这就是为什么区块链具有独特价值主张的原因。


