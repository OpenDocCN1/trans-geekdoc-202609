  trans: '


    这种联盟团结构通常从较少数参与者开始，这有助于更好地管理竞争者需要适应“共同共同目标工作”新范式的政治问题。区块链网络的维护者必须将技术、经济和政治视为联盟团的不同维度来处理。初始成员人数较少有助于避免政治关系变得过于复杂。如果决策速度是该联盟团成功的重要因素，那么拥有的联盟团维护者将有助于以较快的速度推进事务。如果其他联盟团伙伴对解决方案有相似的想法，将有助于更快做出决策。


    虽然较少的联盟团成员有助于更快做出决策，但仍然需要足够的数量来形成一个最小可行的生态系统。毕竟，网络效应影响着联盟团成功的概率。你无法通过规模较小的行业参与者启动一个能够提供价值的真正优秀的区块链用例，因为它可能没有足够的分量。这是一个微妙的平衡——既要保持人数少以便于管理，又要保持足够的人数以产生实质性结果并吸引其他行业参与者。


    另一方面，这种结构可能会给联盟团的新成员带来摩擦。他们可能担心初始成员会获益更多，且规则对他们不利。这可能给新入者一个犹豫的理由，从而为采纳带来阻，并阻碍联盟团的增长。


    这种联盟团的一个例子是以食品安全为中心的零售行业。沃尔玛深度参与了这项倡议。沃尔玛是最大的零售商之一，也是首批试点区块链技术的企业。沃尔玛食品安全副总裁法兰克·亚纳（Frank
    Yiannas）已经意识到区块链技术的变革可能性。正如他所解释的：“我恰深信区块链是一项新兴技术，对食品具有极大的相关性。但我必须告诉你，当我开始接触这个领域时，我是一个主要的区块链怀疑论者。但在与其合作之后，更重要的是进行试点之后，我确实变成了一个区块链的信徒。”51


    美国疾病控制与预防中心（CDC）和美国农业部（USDA）的数据记录了食品供应链污染的影响。CDC 估计，每年有六分之一的美国人因受污染的食品或饮料生病，导致三千人死亡。USDA
    估计，食品源性疾病每年造成的损失超过 156 亿美元。52


    随着技术的进步，食品供应链已经发展了很多。然而，它也面临着确保整个系统食品安全的挑战。食品污染事件对生态系统中的公司产生广泛影响，从生产者到零售商都是如此。它还会负面影响消费者的信心。消费者最终可能因为担心健康危害而停止购买某些食品产品。即使某批次出现问题，零售商也必须从货架上撤下整个货物，因为追踪和识别问题源头需要很长时间。他们倾向于在安全方面留余。


    由于各种原因，源头追溯是困难且耗时的。没有人对整个供应链中货物移动的数据拥有完全视角。通常，供应链中的每个参与者只了解他们与供应商的上游交易以及与客户的下游交易。一个完整的蓝图需要一个接一个部分地拼凑。将它们缝合在一起也不容易，因为大部分记录维护并未标准化。此外还广泛使用纸质文件，这意味着追溯必须手动进行，耗时比使用数字记录要得多。因为记录是手工维护（写在纸上）的，因此由于用户操作错误导致数据错误的概率更高。需要对这些错误进行对账以获得准确的状况。许多食品涉及来自不同国家的多个来源的混合，使追溯变得更加复杂。


    通过早期采用区块链，沃尔玛已经获得了一些早期收益。沃尔玛专注于食品安全，利用区块链技术帮助他们更好地管理供应链。他们决定针对两个用例进行试点——中国的猪肉和美国的芒果。这些试点帮助沃尔玛缩短了追踪物品源头的时间，并允许零售商通过供应链获得更佳的关联数据可用性，从而提高食品安全并减少浪费。在他们在中国猪肉供应链的区块链试点中，他们将追溯肉类来源的时间从
    26 小时缩短到了几秒钟。对于芒果的试点，正如法兰克·亚纳确认的那样：“我们尝试追溯芒果，将切片芒果追溯到源。目前的流程我们需要大约七天时间，你知道的，这几乎是行业基准。也许比在某些健康调查中发生的情况要快一点点。在引入区块链后，我们可以在
    2.2 秒内完成追溯。”53


    食品安全是一个非常适合区块链技术的领域。食品安全生态系统中的参与者有动力合作，利用区块链技术来解决问题。从本质上说，生态系统非常适合区块链能带来的价值。因为食品安全不是一个竞争性问题，整个生态系统中的参与者都有合作的动力。当食品安全问题发生时——没有人会赢。假设为了消费者安全，新鲜蔬菜发生了大肠杆菌爆发。在这种情况下，所有难以追踪的菠菜都会从货架上撤下。这种无法快速追踪源也损害了那些供应链没有携带污染产品的公司。这激励了行业参与者合作并使解决方案生效。此外，整个系统太大，任何单一参与者都无法独立解决，因此与竞争对手合作是合理的。


    ##### 中立第三方主导联盟


    一家初创公司或独立软件供应商（ISV）在一个中立第三方主导的联盟中开发区块链解决方案，以解决行业内的共同问题。这家独立公司协调联盟的运作，并管理运营和治理结构，以吸引生态系统的参与者加入网络。该中立第三方在构建解决方案方面提供领导作用，从产品的最初构想开始，到开发，最后是实施和支持。


