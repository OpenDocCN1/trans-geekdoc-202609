  trans: '


    GPTs 是具有全球影响力的强大技术。GPTs 的影响可以给现有的经济和社会结构带来变化。随着时间的推移，GPT 的效率不断提高，这会持续改进嵌入 GPT
    的下游领域。随着 GPT 变得越来越高效，下游行业的成本会降低，有助于降低价格并提供更好的产品。值得注意的是，越来越多的行业发现将 GPT 作为输入是有帮助的。


    我看到了 GPTs 与 Tony Little 描述他看待区块链的方式之间的某种相似之处：“它就像是接入了电网。我把区块链类比为一种公用事业。它不是灯泡，但它是你插入灯泡的电网。一个良好的区块链用例应该感觉就像电网一样。你正在创造一种所有人都可以接入的东西。”


    下游行业利用了 GPT 执行的一些通用功能。而区块链执行的通用功能是在不存在信任的环境中实现交易。


    从浅层上看，区块链看起来仅仅是一个共享的电子表格，多方可以在其中读取和写入交易。它们以持续流的账本格式进行操作。然而，区块链不仅仅是一个共享的电子表格，因为它在技术之上套上了一层社会经济的外壳。


    正如诺华（Novartis）的 Dan Fritz 所强调的那样：“区块链是一个社会技术构型。……这基本上意味着它是为了共同优化而设计的。换句话说，它应该是一个双赢的。它应该让所有参与其中的成员受益。……而这基本上需要不同的心态，一种不同的思考方式，即我们要‘做大蛋糕’，而不仅仅是‘分蛋糕’。”103


    将该共享电子表格转化为区块链的，是许多人可以同意记录这些交易，尽管他们并不认识也不信任对方。就此而言，他们甚至可能存在利益冲突但仍然能够进行交易。此外，没有人对这种互动进行监督或裁判。区块链让点对点市场在不需要中心权威的情况下存在。这些对等点也可以是企业，或者
    IoT 设备。


    区块链可以帮助我们达到这样一点：我们将把数字信任视为理所当然，因为它将成为我们工作方式的最低共同标准。想象一下，无处不在的数字信任将解锁所有的事情。正如 Orapong
    思考过的：“如果你能像今天发送短信或电子邮件那样容易地进行交易——想象一下，如果你能那么容易地进行交易，商业世界将会发生多少变化。”104


    区块链将成为业务功能的基础设施层。我们不再谈论区块链，而是将其视为理所当然。我们已经开始看到它渗透到经济中的各个行业。它将成为企业运作的底层管道。


    就像 GPT 一样，它可以扩散到经济中并帮助每个人做得更多。区块链可以帮助你与竞争对手和合作伙伴结合在一起，这种方式就像潮涨船高，包括你的那艘。


    ## 区块链的前行之路


    在区块链成为 GPT 之前，它从现在开始的旅程需要经住时间的考验。


    在所有新兴技术中，区块链是一种主要在跨组织部署时才能产生价值的技术。采用该技术面临许多阻力，例如缺乏区块链的教育、由于技术新颖导致的技术快速演变、标准不成熟，以及缺乏美国监管机构的支持。但是，“竞合”（coopetition）是成功的必要条件，这可能是它最大的障碍。作为一个整体，商业世界需要达到让这一理念生根并融入商业精神的程度。企业需要理解来自共享和互联经济的价值，以实现区块链的全部潜力。


    此外，正如 Alison McCauley 所说：“真正需要记住的一点是，我们正经历一个非常疯狂的炒作周期的后遗症，因此人们在进入时带有许多先入为主和情绪。很多情绪。这真的很难应对。”105


    对于所有新兴技术，你都需要对回报率（ROI）保持耐心。你不能期望事情立即发生。首先，很少有人知道该做什么以及如何最好使用它来获得快速价值。也缺乏可以依靠的最佳实践。在区块链案例中，我们必须考虑额外的因素。因为区块链项目是一项团队运动，你必须带着大家一起才能成功。这需要时间。所有人必须一起走。如果所有人必须共同前进，你就必须留出达成共识所需的时间。如果有共同目标，也需要共同决策。这需要时间。


    你还必须在非技术性事务上花费更多时间。正如 William Mougayar 说得非常到位的那：“总而言之，区块链涉及 80% 的业务流程变革和 20% 的技术实施。”106


    由于技术团队主导许多区块链项目，他们最终采取了技术优先的方法。主要重点最终变成了技术细节的实现，而不是这项事业的经济效益。


    正如 HFS 研究报告所言：“虽然大多数受访者正关注技术解决方案，但少于 45% 的受访者正在投资区块链人才、联盟、研究和知识产权。纯粹以技术为中心的区块链叙事是失败的药方——人员（利益相关者参与、变革管理、技能开发）和流程（业务案例、治理、扩展和支持支持）对于推动成功同样关重要。”107


    由于这些原因，变革管理承担了额外的维度，因为人们必须学习根本性的新工作方式。新学的行为需要一些时间才能体现。我可能在理上理解了某事，是因为变革管理的努力带我通过了培训。我也理解这里涉及的范式转变。在我们看到行为改变之前，我必须经历一个内化的过程。


    在此之前，我可能知道它，但可能仍然表现出旧的行为模式。


    正如 Lisa Butters 在与 GoDirect Trade 工作时发现的那样：“我认为透明度真的非常困难。对于习惯了过时销售方式的卖家来说，他们正在扫描文档，可能将其保存到计算机并往回电子邮件，他们并不习惯于电子商务的存在。他们不知道如何管理在线商店。这就是你在
    1995 年到 2000 年初看到的亚马逊的情况。你有很多实体店，它们真的不习惯电子商务活动。在 2010 年到来之前，他们觉得不需要参与其中，结果他们就被遗下了。”108


    讽刺的是，区块链——这项“信任”技术——在获得主流认可之前，必须赢得我们的信任。


