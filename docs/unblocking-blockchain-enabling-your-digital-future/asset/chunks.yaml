    Technologies exist today that can try and tackle this issue. But they are challenging
    to use. Because these technologies don’t provide a possibility of tackling the
    challenge in a decentralized fashion, all insurers have to collect their version
    of the truth. As an aggregate of all insurers, this becomes significantly burdensome.
    Curating their source is not only technologically burdensome, but it is also an
    organizational issue. Additionally, there is also a burden on the providers because
    they have to manage the constant stream of requests from multiple insurers asking
    for the same information.


    Optum technologies started on its blockchain journey with the goal of finding
    a few national insurers who would want to participate in an experiment. The experiment’s
    goal would be to see what benefits would be derived if they tackled some of the
    use cases with blockchain. We are talking more than just technical benefits. There
    could be economic, political, and operational benefits when everyone works together.
    Attending various blockchain health-care conferences allowed the Optum team to
    build relationships with other insurance companies like MultiCare and Humana and
    start a conversation about creating an alliance. With that, Synaptic Health Alliance
    came into existence.


    With the use of blockchain, Synaptic Health Alliance members can significantly
    lower the cost of verification. Doing it right can bring it almost down to zero.
    Insurers look at the shared version of data reality and see that the other trusted
    insurer has attested to the data. That is essentially as good as calling them
    up and asking, “Hey, did this person change their name from Dr. Jones to Dr. Smith?”
    Instead, it’s right there on the database: Insurers can simply run a query and
    grab this information, and they do not have to take the load of verifying the
    same provider data over and over again.


    In the SCB and Synaptic Health Alliance cases, we can see how the participants
    can derive value using a solution rooted in blockchain technology. But, as HFS
    research found, “Only around half of the 940 blockchain projects reported are
    the ones that make business sense and created real value for respondents.”[31](#iapjtig6.html#mvas0d8rytz)
    We have to keep in mind that blockchain is not the answer to everything, as the
    hype would lead you to believe. Indeed, there are relevant use cases among all
    the noise. Still, they have to be chosen carefully. Before starting the initiative,
    look at the strategic horizon to identify what you are trying to accomplish. Pain
    points that are targeted to be solved should be evaluated using key parameters
    before confirming that blockchain technology is a good fit. Maybe other technologies
    are more appropriate to help you get to the end that you are seeking. All in all,
    you are looking for shared pain or shared gain so that other stakeholders are
    willing to fund and help effectively govern a blockchain initiative.


    As Tony Little explains, the critical question is: “How do you create a network
    that is one, self-bootstrapping; two, rewards those who participate with quality
    data to a particular use case; and three, so there are a ton of incentives for
    them to continue participating in that manner.” Answering that question for the
    chosen use case is what gives an edge in the use of blockchain technology. Because
    of the use of crypto-economics, this works well in public blockchain networks
    like Bitcoin. In the case of enterprise blockchain, we have to be very careful
    to evaluate the blockchain network’s self-sustaining nature from an economic perspective.
    As Tony goes on to confirm, “If I participate with quality data and I am going
    to be economically rewarded by the network; that means it’s self-sustaining, and
    you can get little players to play along too. Now all of a sudden, you have network
    effects.” We have to look at some of these subtleties and evaluate why it is cheaper
    and better for a company to participate in a business network in this fashion.


    The economics are really where it gets interesting with blockchain.


    ![](mvas0d8ryzp.jpeg)


    ***


