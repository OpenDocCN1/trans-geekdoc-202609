    As Dustin Helland put it, “When you think about different types of use cases,
    and you are looking at how, quickly, can an organization begin to achieve some
    level of value, there are some use cases that you can start to achieve some level
    of value with a smaller network . . . if you have a use case that’s targeting
    business to business transaction efficiencies—while you need a larger group to
    be involved to really get significant value—you can get some value right out of
    the gates with a smaller network.”[46]


    On their part, State Farm approached the project by breaking it down into phases.
    Through each phase, they gain additional insights for ROI projections. The first
    phase was a prototype that was evaluated at the end of the phase. Phase two is
    the shadow network phase, where they implemented the system in production in parallel
    to the existing processes. This dual implementation proves the solution and validates
    the expected business process efficiencies. “So we’ve taken an iterative approach
    to both development and revisiting the actual business case ROI,” explains Dustin.[47]
    The blockchain network maturity curve (from Chapter 3) is one way to look at a
    possible progression and decide on the kinds of use cases to target as you look
    at incremental ROI.


    It would be best if you looked at blockchain technology’s benefits holistically
    over the long term. Otherwise, you will miss the intrinsic benefits that blockchain
    brings to the table to build distributed solutions with other companies, get cost
    synergy, and enable new revenue opportunities. Concluding in the words of Dustin
    Helland: “Sometimes you are willing to invest upfront for future returns, and
    time is a risk factor. But maybe there’s a bigger opportunity at the end of that,
    and you are willing to invest in it and take the risk.”[48]


