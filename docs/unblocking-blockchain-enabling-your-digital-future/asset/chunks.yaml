    As we learned with Walmart’s example (in Chapter 5), it takes a long time to isolate
    the root cause of the issue in different parts of the supply chain. “I brought
    a package of sliced mangoes into my staff meeting. I put it on the desk, and I
    said to my team, ‘The traceback study starts right now. Hit the clock and tell
    me from where did these mangoes come from, what farm, and what country.’ And you
    know how long it took them to do that? It took them almost seven days! Seven days
    to do that because they had to actually contact the supplier, get paper records.
    . . . They then had to contact the importer,” says Frank Yiannas.[94](#r5xklr8a.html#mvas0d8ryuj)
    This delay has extremely adverse effects on the producers in the supply chain.


    Large retailers, of course, suffer financial harm and reputational harm, but they
    also have insurance that protects them. It’s a motivator and a demand driver for
    companies and supply chains to adopt this kind of technology. Suppose we’re able
    to pinpoint where the contamination occurs in the supply chain. In that case,
    you might be able to isolate other stakeholders from suffering as much financial
    harm. Based on that, it could realign insurance products.


    ### Waste in Food Supply Chains: The Social Impact


    We talked about the liability side of food waste in the business context. But
    there is also the social impact that blockchain can create. The Food and Agriculture
    Organization (FAO) of the United Nations claims, “World hunger is on the rise;
    yet, an estimated one-third of all food produced globally is lost or goes to waste.”
    In order to provide more clarity on food loss and food waste, FAO provides a Food
    Loss Index (FLI), which calculates loss estimates through the supply chain up
    to the retailers. “Initial estimates of the FLI tell us that around 14 percent
    of the world’s food is lost from post-harvest up to but excluding the retail level.”[95](#r5xklr8a.html#mvas0d8ryuk)


    At the same time, FAO also finds that “a total of 842 million are estimated to
    be suffering from chronic hunger, regularly not getting enough food to conduct
    an active life.”[96](#r5xklr8a.html#mvas0d8ryul) Those numbers are unfortunately
    only going to go up because of mass migration and various other problems. We have
    this dual problem where we have a third of all produce going to waste. Meanwhile,
    you have many people on the planet, approaching a billion, who are either undernourished
    or malnourished.


    As supply chains become increasingly data-driven, you should use data to address
    inefficiency, waste, and contamination in terms of isolating where contamination
    occurs. If a bag of rice is contaminated with glass particulates, or an apple
    is contaminated with listeria, we don’t have to say to the retailer, “Okay, you
    need to destroy every apple on every shelf on every store.” You can, instead,
    pinpoint the farm or the packing house or the point in the supply chain when contamination
    occurred. That reduces the liability and the financial harm to everybody.


    As Frank Yiannas goes on to tell us, “And once we finished the proof of concept,
    we go to the blockchain solution and just log on. And by inputting a lot number
    or . . . [scanning] a QR code, how long do you think it took us to trace back?
    2.2 seconds! We’ve gone from seven days to 2.2 seconds in the ability to track
    food back to the farm. And not only that, not only do we track it back to the
    farm, but now because we’re capturing that information on the blockchain, we have
    additional information and insights at each point in the chain.”[97](#r5xklr8a.html#mvas0d8ryum)


    ### Unique Value Proposition of Blockchain for Supply Chain


    Blockchain has a unique value proposition in helping fight food waste due to contamination
    in the apple supply chain. In the apple supply chain, the retailer owns the data
    that comes off the tracker. But as the packing house taught Penta, each member
    of the supply chain can only see one step forward and one step back. That’s the
    extent of their visibility. The problems that we are dealing with, like contamination
    or environmental conditions against regulations for a specific product, can occur
    at any point in the supply chain.


    We need a robust system for data collection that collects data from all the stakeholders.
    That is what existing technology does not do. Each stakeholder owns their systems.
    And thus the information is siloed. They don’t necessarily share it with each
    other. Maybe they share it with the large retailers because it is a requirement
    set for them.


    So ultimately, the problem is trust. You have a complex value chain with multiple
    stakeholders, and this is why blockchain has a unique value proposition.

