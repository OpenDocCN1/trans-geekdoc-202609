- fmt: "\nNow that you have created the product, you’ll need to sell it without getting\
    \ caught. Why not open an online drugstore based out of some remote corner of\
    \ the world, with no effective drug regulation, away from the reach of regulators?1\
    \ A ripe, new opportunity has shown up as the world deals with a global pandemic\
    \ that has killed thousands of people worldwide. As vaccines and other cures start\
    \ rolling out, it is only logical that people will look for all possible options\
    \ to get their hands on them.2\n\nMy journey with blockchain started in the first\
    \ quarter of 2019. As a new calendar year rolled around, we saw many articles\
    \ on various topics reviewing the last year’s happenings. These articles also\
    \ gave the authors’ views into expected progress in the coming year. One fine\
    \ morning, an article flowed through my newsfeed: “Top 5 blockchain predictions\
    \ for 2019.”5\n\nAs Najib Rehman from FarmaTrust put it, “We can work with you,\
    \ and we can show you what the difference is. What we want to do is work in parallel\
    \ with your incumbent technologies. And then, as you see the real value of the\
    \ distributed nature of the blockchain, that means that you can trust the data\
    \ immutably. You can see why, then, you might want at some point, to turn off\
    \ the old stuff and move over wholly. . . . There is now going to be a tipping\
    \ point, I believe.”4\n\n11 \n\n# Preamble\n\n### Blind Men and the Elephant –\
    \ A Poem by John Godfrey Saxe (1816–1887)\n\nIt was six men of Indostan, To learning\
    \ much inclined,\nWho went to see the Elephant (though all of them were blind),\n\
    That each by observation, might satisfy his mind.\n\nThe `First` approach’d the\
    \ Elephant, and happening to fall,\nAgainst his broad and sturdy side, at once\
    \ began to bawl:\n“God bless me! but the Elephant is very like a wall!”\n\nThe\
    \ `Second`, feeling of the tusk, cried, “Ho! what have we here,\nSo very round\
    \ and smooth and sharp? to me ‘tis mighty clear,\nThis wonder of an Elephant,\
    \ is very like a spear!”\n\nThe `Third` approach’d the animal, and happening to\
    \ take,\nThe squirming trunk within his hands, thus boldly up and spake:\n“I see,”\
    \ quoth he “the Elephant, is very like a snake!”\n\nThe `Fourth` reached out an\
    \ eager hand, and felt about the knee:\n“What most this wondrous beast is like,\
    \ is mighty plain,” quoth he,\n“‘Tis clear enough the Elephant, is very like a\
    \ tree!”\n\nThe `Fifth`, who chanced to touch the ear, said, “E’en the blindest\
    \ man,\nCan tell what this resembles most; deny the fact who can,\nThis marvel\
    \ of an Elephant, is very like a fan!”\n\nThe `Sixth` no sooner had begun, about\
    \ the beast to grope,\nThen, seizing on the swinging tail, that fell within his\
    \ scope,\n“I see,” quoth he, “the Elephant, is very like a rope!”\n\nAnd so these\
    \ men of Indostan, disputed loud and long,\nEach in his own opinion, exceeding\
    \ stiff and strong,\nThough each was partly in the right, and all were in the\
    \ wrong!\n\n# Chapter 1\n\n## What Is Blockchain?\n\n“I keep hearing about blockchain,\
    \ is it?” my wife asked one day.\n“Blockchain is a ledger, shared across multiple\
    \ computers,” I replied. It is a record-growing list where new transactions are\
    \ constantly added. You sell stock to another person: That’s a transaction. Your\
    \ warehouse receives the goods from shipping company: That’s a transaction.\n\n\
    Blockchain, as a record-keeping system, stores data in the form of blocks, which\
    \ are added only after the majority agree that it is indeed the correct data to\
    \ be stored. This is a decentralized system, meaning there is no central authority.\
    \ Instead, the ledger is maintained by a network of participants.\n\nOnce a transaction\
    \ is recorded on the ledger, it is practically impossible to change. It is theoretically\
    \ possible in very few cases, but given the state of technological advancement,\
    \ there is not enough computing power to make changes to the data without being\
    \ detected. Thus, the data is resistant to manipulation by bad actors.\n\nThis\
    \ data is also common-property in that it is maintained collectively by multiple\
    \ participants interested in the data. They all care about the data and want to\
    \ transact with each other, even though they may not necessarily trust each other.\
    \ The shared reality means there is no need to maintain my version of truth versus\
    \ your version of truth.\n\n## Business Definition\n\n### Elevator Pitch:\n\n\
    Blockchain is a record-keeping system shared across multiple computers. It is\
    \ practically undeletable, stored securely, and maintained collectively.\n\n###\
    \ Security and Encryption\n\nThe data is also stored securely using cryptographic\
    \ encryption technologies. This method of storing information is similar to a\
    \ common approach to storing passwords today. Suppose you lose your password to\
    \ an online account. In that case, the administrators generally ask you to reset\
    \ your password instead of just telling you what your password is. That’s because\
    \ they don’t know your password.\n\nWhen you try to log in and submit your password,\
    \ the plain-text password gets scrambled, and this scrambled version is compared\
    \ to the scrambled text that was generated when you first created the password.\
    \ If the two strings match, you get access. Nobody can reverse engineer and find\
    \ the actual password even if they know it’s scrambled form.\n\nIn the same way,\
    \ cryptographic encryption secures the transaction data stored on the blockchain.\
    \ The use of cryptographic encryption also makes it possible to limit access to\
    \ data only to parties that have permission to do so.\n"
