    不同的供应链需要不同的解决方案，因为它们有不同的痛点。因此，在供应链中实现一种“一刀切”的解决方案是非常困难的。以咖啡为例，区块链的价值主张与新鲜农产品不同。新鲜农产品关注的是浪费和污染。咖啡作为加工产品是烘焙咖啡豆，这也是我们在商店里看到的。对于咖啡品牌而言，其价值主张是单源咖啡，人们愿意为此支付更高的费用。这涉及到产地认证、供应商认证以及可持续农业。


    实现端到端追溯的答案是无线 IoT 设备。如果你希望在生产的起始端获得可靠的数据，那么这就是答案。关于起始端的讨论可以无休止进行：是从土壤开始的，以确保土壤是有机且未受污染的？还是从产品完全成熟、你从树上采下香蕉时开始的？通常情况下，当人类提供数据时总会存在问题。坏人可能会提供虚假数据，或者人为错误可能导致数据不准确。对此，设备是答案。


    Penta 花了大量时间在商业环境中测试设备。他们得出结论：用于供应链的 IoT 设备和传感器尚未准备绪。Penta 执行了一个咖啡项目，并使用了两家不同的首选设备制造商。他们将设备放入咖啡链中以追踪咖啡，结果从同一条咖啡链中获得了不同的数据。


    这仅表明这些设备缺乏标准化。它们尚未准备好进行大规模使用。我们目前还没有生活在 5G 世界。假设你希望通过无线 IoT 通过基站将数据传输到你的区块链，这最终是你希望获取可靠数据的方式。在这种情况下，你需要基础设施的到位，而这些基础设施尚未完善。即使你使用
    NFC 芯片或 RFID，你也必须收集那些 `RFID` 设备和 `NFC` 设备，并用手机对其进行扫描。其中总会有一个人类因素是人们质疑的。如果你想要获得真正的信任和端到端的可见性，你需要在其中部署无线传感器，但我们对这些传感器还没有准备好。


    因此，下一个问题是，对于每个特定的供应链，你试图解决的关键痛点是什么？如果是咖啡，关键问题可能是产地认证和可持续农业。还有其他不需要无线 IoT 的方法可以实现这些。Penta
    与乌干达农业部合作了一项商业部署。在这里，你可以在区块链上注册农场，并进行所谓的“信任供应商认证”。假设你想将咖啡追溯到源头并验证单源。在这种情况下，你仅通过信任供应商认证即可做到。


    然而，情况变得复杂了，因为乌干达的咖啡会与来自东非其他地区的咖啡混合。这种混合发生在肯尼亚聚合期间，并作为肯尼亚咖啡出售，这对乌干达部来说也是一个问题。他们希望为在乌干达的生产创造更多价值，因为出口是他们行业的重要组成部分。因此，有无需
    IoT 设备的方法可以解决这个问题。信任供应商认证就是其中之一。


    我们反复提到的挑战之一是，区块链领域的人认为他们拥有了下一种颠覆性技术，可以改变范式。但对于不理解区块链的企业来说，存在着教育障碍。


    # 第 10 章：解除区块链的限制


    ## 新兴技术的困境


    我们反复提到的挑战之一是，区块链领域的人认为他们拥有了下一种颠覆性技术，可以改变范式。但，对于不理解区块链的企业来说，存在着教育障碍。


    “在上网二十年后，我深感困惑。并不是说我没有在互联网上度过一段愉快的时光。愿见者们看到了一个交互式图书馆和多媒体教室的未来。他们谈论电子镇会议和虚拟社区。商业和业务将从办公室和购物场转向网络和调制解调器。数字网络的自由将使政府更加民主。


    ‘胡说八道。我们的电脑专家难道完全缺乏常识吗？事实是，没有任何在线数据库可以取代你的日报，没有任何一张光盘可以取代胜任的老师，也没有任何计算机网络可以改变政府运作的方式。’”


    克里福德·斯托尔，天文学家、作家


    “我们高估了技术在短期内的影响，却低估了它的长期影响。”


