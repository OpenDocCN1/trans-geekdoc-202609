  \ “区块链上的飞机零件。”\n- Attanasio, “用于意大利的区块链。”\n- 同上。\n- Hurder, “为什么企业区块链会失败。”\n- Pawczuk\
  \ 等人, 德勤 2020 年全球区块链调查\n- 66\n- Thien-Ngern 等人，“来自泰国商业银行。”\n- 57\n- Butters., “区块链上的飞机零件。”\n\
  - Kuiper, “区块链上的供应链。”\n- 59 61 67 65 62 64\n\n\n公司通常通过与社区学习以及运行概念验证（POC）来开启它们的区块链之旅。随着他们对区块链的进一步了解，他们意识到这是一项团队运动，因此他们开始加强行业内的关系，并专注于构建业务网络，可能是以财联盟的形式）。接下来，他们将达到一个可以运行试点并实现商业化的阶段。\n\
  \n\n随着我对区块链的越发深入，我到了一个阶段，即希望定义一个金融引擎来驱动我的区块链业务。我比比加入一个智库小组（mastermind group），使其能够作为一个咨询系统和支持小组，以保持正轨。在进行几次网络搜索后，我决定联系一家将人们按批次聚集在一起并启动智库小组的公司。\n\
  \n值得赞的是，他们在组建小组方面非常严谨。他们流程的第一部分包括填写问卷，随后是面试。其中一个问题是提供一个描述我公司服务的网页链接。我提供了我的博客链接。面试开始时，那个女人试探性地问我的第一个问题是：“所以，你是做关于比特币的业务吗？”\n\
  \n当时，我觉得这很有趣，因为在我的博客上，没有一次提到过“比特币”这个词。相反，到处贴的“区块链”这个术语。博客的标题是*区块链的意识流*（The Blockchain\
  \ Stream of Consciousness）。然而，她在脑海中已经自动“注册”了比特币。\n\n随着我与越来越多的人交流，显而易见，围绕区块链技术的项目面临着认知上的阻力。\n\
  \n在普遍认知中，区块链和比特币是紧密交织的。以此类推，区块链必须面对比特币与洗钱、资助恐怖活动、暗网、丝绸之路等非法活动之间产生的负面联系。\n\n当区块链的早期爱好者开始与公司内部的人交流时，管理这种对区块链项目的关联感和认知是必要的。请准备好回答这个问题：“区块链不和比特币是一样的吗？”\n\
  \n“一个障碍是认知。当你使用‘区块链’这个词时，人们听到的是加密货币。他们听到比特币，但听不到区块链。我们只是开始称它为‘数字身份’而不是区块链，因为后者会分散人们的注意力，”道格·麦科洛（Doug\
  \ McCollough）说道。\n\n道格是俄亥俄州都柏林的首席信息官（CIO），目前正领导着该市将新兴技术整合到日常运营中。都柏林是俄亥俄州西北角一个人口约五万的小型社区。这是一个以技术为中心的城市，拥抱了利用技术来促进其经济发展利益。从那里，他们拥抱了成为智能城市领导者和创新者的理念。\n\
  \n道格对数字化变革给政府带来的影响非常清楚。他试图通过在城市运营中采用新兴技术来让城市保持领先。但没有人预料到颠覆的到来。大多数时候，主流叙事都是现状。\n\n\
  政府颠覆的一个例子是人们现在如何信任地图服务。如果地图服务说某条路是开放的，你就认为它是开放的。然而，可能有人移除了市里设置的指示牌。如果地图服务建议人们采取行动——那就是一种颠覆。\n\
  \n城市在成为智能城市的历程中不断前进，并依赖数据驱动的决策。是软件公司而非政府，引领了所有进入联网汽车的技术。政府不再是人们生活中首要的安全伙伴。\n\n\n\
  除了与比特币关联的挑战外，使用“区块链”一词也会在其他方面分散人们注意力。他们开始将项目与当下的热点联系起来，将其与追逐热潮联系在一起。对话偏离了对项目交付物价值的考量。这也开始影响这些创新项目的可用资金情况。\n\
  \n\n创建一个爱好者社区有助于定义用例。在这一方面，道格·麦科洛创立了都柏林区块链小组（Dublin blockchain group）。他希望将都柏林地区对区块链感兴趣的技术公司和个人聚集在一起，这些人可能一直在后台进行实验。通过这种努力，一些公司开始成为对区块链充满热情的群体。\n\
  \n小组的活动有助于开始构思这样一个想法：即政府如何利用区块链为公民创造价值的绝佳用例。现在，都柏林区块链小组帮助那些对区块链技术好奇并在后台进行实验的人建立社区感，并加速学习。\n\
  \n\n\n\n\n## 内部创新与社区\n\n除了公司外部的社区建设，在公司内部投资探索区块链各种用例的创新团队也将产生深远影响。将他们组织成实践社区或卓越中心。正如我们在第\
  \ 4 章中中学到的，为了应对行业挑战，苏格兰皇家银行（RBS）很早就发现了区块链的机遇。而且他们准备好在初期投入一些预算来尝试和测试区块链，这在当时是一个新兴的新事物。\n\
  \n在非常早阶段，他们就让工程团队研究这项技术并逐渐熟悉。随后情况发展到一个程度，即已经有足够的用例来证明建立一个以区块链为核心、拥有卓越中心的实践社区。\n\n\
  “对于任何处于旅程早期或开始将区块链项目商业化的组织，这将是我能给他们的首要建议。你会看到不同的技术阵营坐那里并说：‘我喜欢 iPhone；我喜欢三星。’你对区块链技术也会有同样的观点，”安德鲁·斯皮尔说道道。\n\
  \n\n在区块链之旅之初，贵公司对新技术的商业化理解非常有限。让一个专注于区块链技术的集中职能部门来运营，有助于更稳健地评估用例。这还将帮助你们在开始区块链之旅时识别出应该追求的正确用例。州州（State\
  \ Farm）从 2016 年开始关注区块链。正如达斯汀·海兰（我们在第 4 章中介绍过他）所解释的：“我们很快就能发现，比特币底层的区块链技术应用范围比比加密货币广泛得多，我们在创新领域建立了一个小组，来优先考虑并探索潜在的机会。”\n\
  \n由于你正在与竞争对手合作，因此你对区块链项目需要一种新的组织思维方式。一种以教育和协作为引领的方法会有帮助，而社区可以协助整个过程。对于州州来说，最初，团队专注于跨多个业务线的工作——例如，理赔部门、核保、金融服务等部门的领域专家——向他们介绍该技术的能力。他们还致力于识别和评估州州认为可能具有价值的任何潜在用例。\n\
  \n随后，重点转向了学习，通过将一些已识别业务机会与某些开发团队对齐，并创建了早期原型。最终，他们进入了一个基于技术进行产品交付和业务价值价值的阶段。这些努力中产出的旗舰项目是与\
  \ USAA 合作构建的自动理赔代位（Auto Claims Subrogation）。\n\n\n除了社区，还需要一个变革者，他可以是公司内最早一批宣扬新兴技术的人之一。如果他们能在组织内赢得信任并具备专业知识，将非常有帮助。他们需要是理解这项技术以及它能实现什么的的领域专家。区块链技术深入到组织的架构底层。花时间传播区块链的福音至关重要。\n\
  \n正如 PCCW 的沙哈·斯蒂夫（Shahar Steiff）向我指出的那样，让高层对项目提供支持将会有帮助。清晰愿景的沟通将产生巨大影响，这需要耐心和坚持来完成。\n\
  \n“对于大多数参与者来说，这不仅仅是技术的演变；它是公司内部的某种革命。今天的电信运营商和云提供商意识到，他们不再是在提供服务；而是在提供一种环境和体验。他们正在变成技术公司。要把一家传统的电信公司转变为技术公司并不容易。这需要完全的心态转变。这需要由管理层驱动，”沙哈解释道。\n\
  \n\nShahar Steiff 一直领导 PCCW Global 开发基于区块链的平台，以支持自动化服务生命周期。PCCW Global 是领先的通信服务提供商，参与了通信业务自动化网络（`CBAN`）。`CBAN`\
  \ 是由电信行业领导者组成的网络，围绕新兴技术进行协作，以造全球运营商生态系统。正在进行的计划之一是区块链辅助的自动结算。\n\n消费者通常将电信行业视为一个单一实体。尽管为了提供跨国服务，有多个运营商需要在幕后共同努力。数据流量在到达消费者的设备之前，必须从一个运营商的基础设施流到另一个。当你我作为用户拨打电话时，我们向电信公司支付所提供服务的费用。反之，我们的电信公司向电信供应链上的各种信息和通信技术（ICT）提供商付费。这条电信供应链最终建立了从一个国家的电话到另一个国家电话的端到端连接。ICT\
  \ 提供商完成了所有这些交易的结算。我们作为消费者，看不到幕后发生的情况。\n\n\n为了激活服务我们（消费者）的业务关系，两家 ICT 公司通常会签署一份主服务协议（`MSA`）。这些协议通常仍通过手动完成。`MSA`\
  \ 定义了他们关系的条款和条件。根据这些协议，为客户提供服务时会配置报价。在了解客户需求、设计解决方案、提交报价并确保订单后，将设置服务交付。这种交付时间可能从几秒钟到几个月不等。只有在服务交付设置完成后，数据才能开始流动以服务客户。\n\
  \n当客户开始使用服务时，所有数据使用情况会被记录，电信提供商生成发票。当运营商验证提交给他们的发票费用时，通常会发现收费错误。差异可能是由于各种原因，如时间服务计算错误或使用了错误的率。在识别出这些争议后，他们进入争议解决流程以结算金额。实际时间差异很大，但大约需要三个月才能运行。从他们提供服务到发票结算后收到付款，大约需要八周。这些延迟的时间主要是由于涉及的手工过程；它们降低了公司的利润能力并造成了负面的客户体验。\n\
  \n\n通过区块链辅助的自动结算，由于记录不匹配导致的争议被消除了。使用情况通过区块链实时测量和比较，极大地减少了差异的可能性。总之，他们可以将报价流程的时间从几天缩短到几秒钟。服务交付周期从几个月缩短到分钟。流量测量和对账从几天缩短到几秒钟。结算本身也从几周缩短到几秒钟。总体而言，他们实现了成本降低、流程加速，并能够从他们无法提供的服务中建立新的收入来源。\n\
  \n\n\n\n\n当我对他们的结果感到惊叹，并询问 Shahar 关于他在这段经历中汲取了哪些教训时，他解释道：“参与该项目的公司很大程度上是由 CxO 级高管推动其得以实现的。他们驱动着产品团队和开发团队。行业通常采用三个维度：第一维度是我们现有的服务；第二维度是我们今天正在构建的，即明天的服务；第三维度则是从现在起三到年后会发生的事情。第三个维度真的需要正确的心态来管理，即需要一种推动那些几年后才能实现并产生收入的事的心态。可能等到相关高管转型时，他们甚至已经不在公司工作了。”\n\
  \n\n“我们选择了一个非常小的流程。Spunta 是一个内部流程，它不涉及外部客户，也不特别为人所知。所以这是一个很好的、某种意义上的天然的沙盒，”Silvia\
  \ Attanasio 解释道。74Silvia 是 ABI（意大利银行协会）的创新负责人，负责支持意大利银行协会内部银行的创新。ABI lab 是由 150\
  \ 家银行拥有的财团。他们为银行工作并为银行服务。\n\n通过选择低影响的流程作为开始，有助于降低任何新事物的风险，这样即使出现问题，也不会引起任何反弹。2017\
  \ 年 12 月，ABI labs 开始开展一个利用区块链技术解决银行间对账流程（也称为 `Spunta`）的项目。为了了解区块链技术是否有所帮助，该团队访问了意大利不同城市的\
  \ 14 个不同的后台部门。他们根据这些部门的决策制定方式和组织结构对传统流程进行了分析。他们还关注了银行之间的互动以及由此产生的活动流。\n\nSpunta\
  \ 是一个极其复杂的意大利银行间对账流程，被选为区块链项目的主题。该流程已存在了几十年，基于 1978 年开始的银行间协议。在意大利，这些是两家银行共同拥有的账户。账户的所有权每三年会在一家银行切换到另一家银行。当账户为\
  \ `Nostro`（本行）且银行拥有账户所有权时，他们可以看到余额、转账等所有账户详情。但当所有权切换到 `Vostro`（他行存款）且另一家银行拥有所有权时，A\
  \ 银行无法看到任何关于账户的详情。\n\n假设 A 银行需要 `vostro` 账户中的任何信息。在这种情况下，他们需要使用传统的通信机制与另一银行联系并索信息。银行的后台运行该流程，以消除复式记账中的不匹配，并确保交易两端的银行对交易的所有方面都达成一致。这变得复杂，因为它是一个单一账户，试图在同一份账本上协调交易方的观点。而且，如果发生不匹配会怎样呢？解决这些不匹配需要大量的时间精力。\n\
  \n对于 ABI 来说，Spunta 流程似乎是区块链的完美用例。Spunta 流程中的人员一直在寻求改进。他们愿意花时间使 Spunta 及其相关协议现代化。让正确组织的正确的人参与进来至关重要。发生这种情况的条件已经成熟了。另一方面，创新团队希望通过低风险流程来探索这项新兴技术的潜力。选择一个不影响客户的相对小的内部流程至关重要。选择一个团队有权做出决策的流程也非常重要。没有理由在进行任何更改时将其他监管机构或政府包含进来。\n\
  \n在选择特定的用例用区块链实施时，会有各种考虑。需要观察的因素包括通过妥善使用区块链技术带给你的潜在业务价值机会。你还需要行业内其他伙伴的兴趣，毕竟你正在与\
  \ Web3 技术工作。一个需要关注的点是推动解决方案走向完成所需要跨越的障碍。这影响了你推进项目进展的速度。如果我们使用低风险流程，我们对项目的进度就有较好的控制。\n\
  \n正如 Dustin Helland 解释道：“所以，我们构建的净代位求偿赔付（net subrogation）包含了组织主要已经在共享的数据，它也不包含高度敏感的客户信息。虽然我们并不一定在规避这些挑战，我们只是想有针对地选择我们要承担哪些。”75\n\
  \n\n区块链项目需要一种新的组织思维，因为你现在将专注于与你的竞争对手协作。以教育和协作为领先的方法有所帮助。投资建设社区对整个过程也有帮助。对于 ABI 而言，业务端并不了解区块链技术。同时，公司的技术端并不了解\
  \ Spunta 流程。\n\n因此，首要任务是让他们聚在一起。意图是帮助业务部门理解技术的不同能力，让技术人员理解业务流程的方式。为了进一步巩固这种交叉融合，并帮助增强对技术的信心避免参与者之间的任何抵触，他们决定进行一次\
  \ `POC`。\n\n正如 Silvia 解释道：“项目的主要目标之一是充分理解这项技术、潜力以及这项技术如何改变传统银行业。因此，我们在项目中也加入了一些学习阶段。我们与专家进行了学习会议……面对来自\
  \ 14 家不同银行的后台、创新部门和 IT 部门的五十或六十名观众。”76 这种对学习的投资有助于增加财团成员的参与。\n\n区块链项目需要非常不同的思维，首先是因为你最终会与竞争对手直接合作。但在内部，许多其他小组也需要参与。除了技术和业务团队，为了管理所有与财团相关的方面，法律、安全、风险、合规、公共事务等团队也需要参与。正如\
  \ Dustin Helland 为 State Farm Explain 道，“我们获得支持和认可的方式是通过教育、协作、并肩工作以及持续的透明化。”77\n\
  \n\n我们在区块链之旅中的一个关键决策将是关于公有链与私有链的选择——更重要的是，选择进行开放的公有网络还是封闭的私有网络。或者——混合型？专注于决定你将使用私有还是公有区块链网络是必要的，因为工具至关重要。对于企业来说，隐私和安全是必须考虑的重要方面。\n\
  \n这里有一些术语帮助我们更好地构建对话。理解这些术语很好，因为它们在讨论中并没有被准确使用。\n\n公有 vs. 私有：这的定义基于谁可以向区块链写入数据。如果任何人都可以向区块链写入数据，那么它就是公有区块链。`Bitcoin`\
  \ 和 `Ethereum` 是公有区块链的良好示例。相反，如果写入权限受到控制，它就是私有区块链。\n\n\n\n\n\n这定义基于谁可以从区块链中读取数据。开放式区块链允许公众消费数据。封闭式区块链则通过权限控制访问。\n\
  \n# 许可型 vs 无许可\n\n根据普华道（aPricewaterhouseCoopers）关于企业如何管理区块链的调查，公司正在采用两种方法；40% 的公司使用许可型区块链，34%\
  \ 的使用无许可链，26% 的采用混合方法。78\n\n通过对用例进行考虑，公司将决定采取何种路径。\n\nCoadjute 最初通过参与英国土地注册局（UK\
  \ Land Registry）的采购流程开始工作。他们意识到“对于政府用例，由加密货币支持的公共平台实际上不可行的。数据需要位于英国。”79\n\n对于 `SCB`\
  \ 而言，他们需要探索的一个重大决策是：你们是要使用私有区块链网络还是公共区块链网络？决定因素是交易双方的可见性。正如 Orapong 所解释的，“在采购到付款的应用中，你通常处理的是一个闭环——有限数量的供应商和有限的买家。你甚至无法识别出是谁执行了交易。但在交易中看到信息本身就是一个风险。如果你看到了价格，即使你不知道是谁买了那个产品，但如果你看到了不同的价格并看到了一笔买入，就会产生交易问题。这就是为什么我们首先评估：我们要用公共区块链吗？我们要用私有区块链吗？最后我们决定用私有区块链。”80\n\
  \n对于 `Optum` 来说，管理技术政治和对代币化的支持是决定采用公共区块链网络的驱动因素。“小凳子有三条腿：政治、经济和技术。如果你决定建立自己的网络，你就必须同时处理这三个问题。如果你决定搭乘公共\
  \ `Ethereum` 的便车，并且你可以有一个可以在上面运行的用例，那么你实际上消除了许多关于网络实际执行的政治问题。而且已经存在网络效应。因此，将每个私有许可区块链尽可能快地转向公共许可区块链具有巨大的优势。”这就是\
  \ Tony Little 向我解释的方式。\n\n在选择技术时，将资金和时间的投入作为标准是有意义的。不同参与者对协议的资金投入，以及开发者在构建协议上的时间投入，意味着了一个稳健的生态系统。这可以帮助你将你的技术栈连接到经过验证的技术上。如果协议支持代币化，它将帮助你将数据视为资产，并可以作为驱动你们联盟的微交易的基础。否则，你将不得不使用第三方，并为联盟的经济增加交易成本。“我认为今天外面正在进行大量工作，但最终都化为乌有，因为他们没有考虑到这种多维性，”Tony\
  \ 解释道。\n\nState Farm 同样考虑了多种区块链协议。正如 Dustin Helland 所解释的，“早初我们确实查看了公共区块链的一些功能，但像大多数大型企业一样，我们很快锁定了对隐私和保护的需求。”81\n\
  \nState Farm 正在使用 `Quorum`，它允许创建一个基于 `Ethereum` 的私有许可企业区块链。这是一项最初由摩根大通发布并治理的开源技术。`Quorum`\
  \ 允许在 `Ethereum` 网络内进行许可网络和私有交易，因此他们在解决方案中未使用公共 `Ethereum` 网络。在决定特定的区块链网络时，他们考虑了几个关键因素。\n\
  \n首先，他们需要许可型区块链，因为交易隐私对他们至关重要。其次，他们考虑了评估时不同平台的成熟度。让他们对 `Ethereum` 放心的一点是它已经在公共网络中采用了相当长时间。第三，他们还听取了开发者的意见以理解开发者的观点。开发者更倾向于在什么平台上工作？开发者会考虑不同的因素，如可用文档以及个人、公司之间的贡献等。\n\
  \n一个值得注意的方面是三个领先平台的可用架构如何影响了他们的决策。对于 `Corda` 和 `Hyperledger`，架构允许存在主节点，主节点可能拥有权力和权威。而在\
  \ `Quorum` 中，每个节点具有相同的权限。当 State Farm 开始该项目时，选择 `Quorum` 提供的架构是关重要的。\n\n对于没有明确 `ROI`\
  \ 的新兴技术，资金始终是一个问题。你可能需要采取创意来让项目启动起来。都柏林市的 Doug McCollough 充分清楚公共领域资金的匮乏。创新项目并没有多少资金。公共部门的项目环境也非常规避风险。\n\
  \n公共部门并不是使用初创公司原则和敏捷开发、迭代过程等现代 IT 实践，其方法是拥有完全构型且符合预算的想法。这种方法有助于获得预算分配。之后，重点是项目的成功，而不是实验创新技术。正如\
  \ Doug 解释道，“我们没有很多资金。这些创新的项目没有资金。所以你得与人合作，建立公私合作伙伴关系，并探索一种非常低预算的实验。这就是为什么我们以一种非常有限的方式做了概念验证。”82\n\
  \n在 `Coadjute` 的案例中，这完全是一次共同的努力，所有参与者都做了贡献。同时，`Coadjute` 利用自己的资源构建了核心平台。正如 John\
  \ Reynolds 所解释的，“这确实是一种协作努力。如果任何一个组织尝试独立完成，这将是一个非常昂贵的项目。但当你把项目成本分摊到大约 40 家公司时，它是负担得起的。”83\
  \ 这形成了一种非常去中心化的资金模式，非常符合区块链的去中心化精神。\n\n## 数据标准\n数据标准将对项目如何迈向成功起到重要作用。如果存在现有的行业标准，最好采用它们而不是重新发明轮子。对于\
  \ `FVL` 领域的 Jon Kuiper 和 `Vinturas` 来说，该行业有着散落在各处的多个昂贵 `EDI` 连接的历史，这导致了交易过程中缺乏标准。\n\
  \n他们关注的是交货单（`CMR`），这是用于移交车辆的文档（例如从运输公司移交给经销商），它通常是纸质且手写的。他们依赖于经大多数欧洲国家批准并由监管机构创建的电子\
  \ `CMR` 协议。从防欺的角度来看，在区块链上提供此文档变得至关重要。\n\n\n\n\n正如 Jon Kuiper 所解释的：“我们正在为这些电子 CMR（国际货物运单）文档提供基础设施。当然，这是区块链，它是不可篡改的，是一份法律文件，我们可以将其提供给行业相关者，因为标准已经从政府和监管角度进行了定义，并将在未来几年在欧洲所有国家实施。……我们认为它非常强大，因为回到欺诈讨论，对于发货人员来说，电子\
  \ CMR 具有法律效力，而且不是基于纸质的而是电子文档，这非常重要。”84\n\n当我与 Jesús Pizarro 讨论标准问题时，他评论道：“我喜欢与 IBM\
  \ Food Trust 合作的原因是 IBM 正在使用国际标准。”Jesús 是国际援草组织（Heifer International）的金融创新副总裁。他正领导\
  \ Heifer Lab 针对农业发展和金融包容的区块链产品战略。国际援草组织是一个国际国际非政府组织，其使命是在消除世界饥饿和贫困的同时保护地球。\n\n国际援草组织正在利用区块链来加速其使命，即在照顾地球的同时结束饥饿和贫困。在他们开始使用区块链时，他们规定了自己的愿景：在农业领域建立一个区块链网络，让农民能够获得运营资金、技术支持和公平市场。他们的方法是与政府、大学和其他组织合作。\n\
  \n国际援草组织与其他伙伴合作利用区块链快速推进他们的使命。他们参与了供应链中的三个不同项目：家禽、可可和咖啡。在家禽领域，他们正在以太坊上工作。对于咖啡和可可，他们正与\
  \ IBM Food Trust 和国际开发银行（IDB）合作开展其他项目。\n\n国际援草组织希望利用区块链来提高市场透明度。在农业领域，小农户是隐形的，而消费者是盲目的。消费者不知道食物从哪里来，也不知道它是如何准备的。而我们作为消费者，当然对小农户一无所知。小农户在了解产品消费情况的可见性方面也面临同样的情况。对于国际援草组织来说，区块链提供了透明的可能性，这最终将改善市场。\n\
  \n在国际援草组织处理各种区块链项目的过程中，除其他外，他们学到的重要教训之一就是标准化过程。正如 Jesús 向我解释的：“问题之一在于，我们还需要对标准进行标准化。即使你使用\
  \ `GS1`，你会发现 `GS1` 也是非常灵活。实施标准有不同的方法。为了让区块链项目成功，我们需要使用相同的标准。我会说这是学到的最重要的教训。”\n\n\
  当然，让区块链之旅成功的因素还有很多。由于区块链的本质以及由于它正处于发展的非常早期阶段，有几点是区块链所独有的。本章帮助我们查看了其中的某些特殊之处。\n\n\
