  \ 86 89 \n\n根据 MarketsandMarkets 的研究，区块链供应链市场到 2026 年价值将达到 32 亿美元，在预测期间实现 53.2%的复合年增长率（CAGR）。92\
  \ 随着在多个全球供应链倡议中的应用，区块链技术显示出解决全球供应链管理某些问题的潜力。然而，该技术的应用成功程度参不齐。让我们来看看几个供应链场景，以及经验表明在这些情况下使用区块链解决方案。\n\
  \n## 消费者对产品透明度的需求日益增加\n\n消费者对产品的透明度要求越高。他们想知道产品是否是有机的、产自哪里以及是如何处理的。对于千禧一代和 X 世代消费者来说尤其如此，他们关注所购买食品的健康和安全。\n\
  \n“我们想知道产品是否是有机的、产自哪里以及是如何处理的，”David 说道，“对于千禧一代和 X 世代消费者来说尤其如此，他们关注所购买食品的健康和安全。”\n\
  \n区块链的使用可以提供满足这些需求所需的透明度。通过追踪从农场到餐桌的产品，公司可以验证其商品的真实性和质量。这可以建立消费者的信任并增加品牌忠诚度。93\n\
  \n## 食品供应链中的浪费：经济影响\n\n除了消费者信心外，污染还产生其他影响。污染导致的食品浪费对供应链产生了重大的经济影响。\n\n就供应链场景而言，除了面向消费者的一，公司采用区块链也有商业原因。之一是供应链发生了大量的浪费。食品浪费是一个大问题。召回是另一个问题。特别在美国，有很多召回，例如与农产品或肉类大肠杆菌爆发相关的召回。\n\
  \nPenta 与一家向许多零售商最大的苹果苹果包装厂合作了一个项目。该计划的目的是测试供应链中不同的传感器设备。在苹果产品生态系统中，所有销售都是寄售。在召回事件中，供应链上游任何环节都不会获得收入。如果这些苹果在零售店没有卖出去，那么包装厂就收不到钱，农民也收不到钱。\n\
  \n\n\n\n\n正如我们在沃尔玛的案例（第 5 章）中所学到的，在供应链的不同部分隔离问题的根源需要很长时间。“我带了一包切片芒果进入我的员工会议。我把它放在桌子上，对团队说：‘追溯研究现在开始。计时，并告诉我这些芒果是从哪里来的，哪个农场，哪个国家。’你们知道他们完成这件事花了多久吗？他们花了整整七天！花七天时间，是因为他们必须亲自联系供应商，获取纸质记录……然后他们必须联系进口商，”弗兰克·亚纳斯（Frank\
  \ Yiannas）说道。94 这种延迟对供应链中的生产者产生了极其不利的影响。\n\n\n\n当然，大型零售商确实会遭受经济损失和声誉损害，但他们也有保险来保护自己。这正是公司和供应链采用这种技术的动力和需求驱动力。假设我们能够准确定供应链中污染发生的地点。在这种情况下，你可能能够防止其他利益相关者免遭受同样严重的经济损失。基于此，可以重新调整保险产品。\n\
  \n### 食品供应链中的浪费：社会影响\n\n我们讨论了商业背景下食品浪费的责任方面。但区块链还可以产生社会影响。联合国食品粮农组织（FAO）声称：“世界饥饿问题正在上升；然而，估计全球生产的所有食物有三分之一流失或被浪费。”为了更清楚地说明食品损失和食品浪费，粮农组织提供了“食品损失指数”（FLI），它通过计算从供应链到零售商的损失估算值。“FLI\
  \ 的初步估计告诉我们，世界上约 14%的食物在收获后到零售水平之间（但不包括零售阶段）丢失了。”95\n\n同时，粮农组织还发现，“估计总共有 8.42 亿人遭受慢性饥饿，经常无法获得足够的食物来维持活跃的生活。”96\
  \ 遗憾的是，由于人口迁移和其他各种问题，这些数字只会增加。我们面临着这样一个双重问题：三分之一的农产品被浪费；与此同时，地球上有许多接近十亿的人处于营养不足或营养不良状态。\n\
  \n随着供应链变得日益数据驱动，你应该利用数据来解决效率低下、浪费和污染问题，并在隔离污染发生地点方面。如果一袋米被玻璃颗粒污染，或者一个苹果被李斯特氏菌污染，我们不需要对零售商说：“好的，你必须销毁每家商店每个货架上的每一个苹果。”相反，你可以准确定位发生污染的农场、包装厂或供应链中的某一点。这减少了每个人的法律责任和经济损失。\n\
  \n正如弗兰克·亚纳斯继续告诉我们的那样的：“一旦我们完成了概念验证，我们就转到区块链解决方案并直接登录。通过输入批次号或……[扫描]二维码，你们认为我们回溯花了多长时间？2.2\
  \ 秒！在将食品追溯到农场的能力上，我们已经从七天缩短到了 2.2 秒。不仅如此，我们不仅能追溯到农场，而且由于我们在区块链上捕了了信息，我们在链的每个环节都拥有额外的信息和洞察。”97\n\
  \n### 区块链对供应链的独特价值主张\n\n由于苹果供应链中因污染导致的食品浪费，区块链在帮助解决这一问题方面具有独特的价值主张。在苹果供应链中，零售商拥有来自追踪器产生的数据。但正如包装厂教给\
  \ Penta 的那样，供应链的每个成员只能看到向前一步和向后一步。这就是他们可见性的范围。我们正在处理的问题，如污染或不符合特定产品法规的环境，可能会发生在供应链的任何点。\n\
  \n我们需要一个稳健的数据收集系统，从所有利益相关者那里收集数据。这正是现有技术无法做到的。每个利益相关者都有自己的系统。因此，信息是孤岛化的。他们并不一定相互共享信息。也许他们会与大型零售商共享，因为这是对他们的要求。\n\
  \n所以归结底，问题在于信任。你拥有一个包含多个利益相关者的复杂价值链，这就是为什么区块链具有独特价值主张的原因。\n\n\n\n\n不同的供应链需要不同的解决方案，因为它们有不同的痛点。因此，在供应链中实现一种“一刀切”的解决方案是非常困难的。以咖啡为例，区块链的价值主张与新鲜农产品不同。新鲜农产品关注的是浪费和污染。咖啡作为加工产品是烘焙咖啡豆，这也是我们在商店里看到的。对于咖啡品牌而言，其价值主张是单源咖啡，人们愿意为此支付更高的费用。这涉及到产地认证、供应商认证以及可持续农业。\n\
  \n实现端到端追溯的答案是无线 IoT 设备。如果你希望在生产的起始端获得可靠的数据，那么这就是答案。关于起始端的讨论可以无休止进行：是从土壤开始的，以确保土壤是有机且未受污染的？还是从产品完全成熟、你从树上采下香蕉时开始的？通常情况下，当人类提供数据时总会存在问题。坏人可能会提供虚假数据，或者人为错误可能导致数据不准确。对此，设备是答案。\n\
  \nPenta 花了大量时间在商业环境中测试设备。他们得出结论：用于供应链的 IoT 设备和传感器尚未准备绪。Penta 执行了一个咖啡项目，并使用了两家不同的首选设备制造商。他们将设备放入咖啡链中以追踪咖啡，结果从同一条咖啡链中获得了不同的数据。\n\
  \n这仅表明这些设备缺乏标准化。它们尚未准备好进行大规模使用。我们目前还没有生活在 5G 世界。假设你希望通过无线 IoT 通过基站将数据传输到你的区块链，这最终是你希望获取可靠数据的方式。在这种情况下，你需要基础设施的到位，而这些基础设施尚未完善。即使你使用\
  \ NFC 芯片或 RFID，你也必须收集那些 `RFID` 设备和 `NFC` 设备，并用手机对其进行扫描。其中总会有一个人类因素是人们质疑的。如果你想要获得真正的信任和端到端的可见性，你需要在其中部署无线传感器，但我们对这些传感器还没有准备好。\n\
  \n因此，下一个问题是，对于每个特定的供应链，你试图解决的关键痛点是什么？如果是咖啡，关键问题可能是产地认证和可持续农业。还有其他不需要无线 IoT 的方法可以实现这些。Penta\
  \ 与乌干达农业部合作了一项商业部署。在这里，你可以在区块链上注册农场，并进行所谓的“信任供应商认证”。假设你想将咖啡追溯到源头并验证单源。在这种情况下，你仅通过信任供应商认证即可做到。\n\
  \n然而，情况变得复杂了，因为乌干达的咖啡会与来自东非其他地区的咖啡混合。这种混合发生在肯尼亚聚合期间，并作为肯尼亚咖啡出售，这对乌干达部来说也是一个问题。他们希望为在乌干达的生产创造更多价值，因为出口是他们行业的重要组成部分。因此，有无需\
  \ IoT 设备的方法可以解决这个问题。信任供应商认证就是其中之一。\n\n我们反复提到的挑战之一是，区块链领域的人认为他们拥有了下一种颠覆性技术，可以改变范式。但对于不理解区块链的企业来说，存在着教育障碍。\n\
  \n# 第 10 章：解除区块链的限制\n\n## 新兴技术的困境\n\n我们反复提到的挑战之一是，区块链领域的人认为他们拥有了下一种颠覆性技术，可以改变范式。但，对于不理解区块链的企业来说，存在着教育障碍。\n\
  \n“在上网二十年后，我深感困惑。并不是说我没有在互联网上度过一段愉快的时光。愿见者们看到了一个交互式图书馆和多媒体教室的未来。他们谈论电子镇会议和虚拟社区。商业和业务将从办公室和购物场转向网络和调制解调器。数字网络的自由将使政府更加民主。\n\
  \n‘胡说八道。我们的电脑专家难道完全缺乏常识吗？事实是，没有任何在线数据库可以取代你的日报，没有任何一张光盘可以取代胜任的老师，也没有任何计算机网络可以改变政府运作的方式。’”\n\
  \n克里福德·斯托尔，天文学家、作家\n\n“我们高估了技术在短期内的影响，却低估了它的长期影响。”\n\n\n\n\n新兴技术既带来了机遇也伴随着风险。因此，需要对其进行妥善管理。一方面，参与创新具有产生新价值的巨大潜力；另一方面，新颖性也伴随着自身的风险。总有一种伴随其来的鼓声，将新兴技术推崇为“下一个大热门”。决定是否对这些技术进行快速评估、投资和实施，将会对公司产生深远的影响。\n\
  \n正因如此，公司需要具备技术前瞻性，并确定在新兴技术上投入合适的时间和精力——恰好能让他们了解正在发生什么，同时又在它演变成重大产物时错失良机。\n\n那么问题变成了，我们该如何将区块链作为一种新兴技术进行评估？我们是否想在利用新发展优势的同时，不让公司暴露在新技术带来的过度风险之中？\n\
  \n## 企业级区块链采用框架\n\n当我顺着线索仔细观察了几位早期采用者的区块链之旅时，一个框架应运而生。数字领导者可以借此作为模板来指导他们的区块链战略。\n\
  \n这张图展示了该框架的描绘。\n\n![](img/mvas0d8ryzu.jpeg)\n\n### 学习\n\n当一项新兴技术展现出前景时，在投入资金之前对其进行学习至关重要。要开启区块链之旅，你首先需要花一些时间浅尝浅禁。对技术的学习应该为公司未来的投资提供参考。\n\
  \n如果你专注于汇聚对这些技术感兴趣的各方人才，这种学习将会加速。在公司内部，最佳做法是建立一个卓越中心（`CoE`）。`CoE` 有助于将公司的区块链技能和经验集中起来，并建立一个最佳实践库。`CoE`\
  \ 还可以领先执行概念验证和试点项目。在随后的阶段，它还可以作为采用流程的一部分提供培训。\n\n正如 Lisa Butters 在霍尼韦公司意识到的那样，一个中心团队也可以帮助揭示新的用例。他们可以帮助业务部门理解区块链技术如何提供帮助。正如她所解释的：“我不禁百分之百地记得我是如何与霍尼韦先进技术团队联系起来的。但我们有一小组人正在——我可以说——在尝试区块链技术。但他们并没有什么好的用例。我能够与那个小组会面，向他们介绍市场、我们面临的一些障碍、行业目前的运作方式等。这真的就是这样开始的。”[100\n\
  \n在外部，与生态系统中的社区互动是必经之路。这有助于你在生态系统内部建立关系。当投入精力培养用于联盟对话的业务网络时，这些关系将产生帮助。最好的做法是植根于社区，以学习更多知识并帮助他人。通过参加区块链特定的活动并与对技术感兴趣的人建立联系，与他们进行互动。除了尝试理解他人正在构建什么或解决什么问题之外，还要通过提供你的见解为社区做出贡献。\n\
  \nDoug McCollough 在俄亥俄州都柏林市做得很好。他解释道：“在我们考虑在这里开发解决方案之前，我们实际上创建了一个小组，称之为‘都柏林区块链小组’。这是我几年前尝试插旗的努力，当时我们说：‘我们希望地区所有的科技公司都出来坐坐。’黑客，你们知道的，那些在公司后室里真正进行实验并以某种方式保持这种秘密工作站状态的人，‘出来吧，在朋友之间，我们只是要讨论它们。’我们开了几次这样的会议，几家公司脱颖而出，对这充满了热情。”[101\n\
  \n在你学习技术的同时，完成一个概念验证（`POC`）有助于帮助你亲手实践。`POC` 将帮助看到区块链技术可能带来的收益以及随之而来的局限性。`POC` 还有助于观察哪些用例已经成熟并可以优先处理。构建\
  \ `POCs` 还能向你向领导团队展示关键发现并讨论业务案例时提供输入支持。\n\n这一学习阶段是开展进一步行动的起点。\n\n### 协作基础设施\n\n\
  在学习过程中，你会意识到区块链是一项团队运动。与他人良好相处是最佳选择。那些他人可能是你的竞争对手，这使得比公司正在评估的其他新兴技术更加困难且与不同。因此，评估市场成熟度变得至关重要。\n\
  \n行业准备好使用这项技术了吗？行业中是否有其他玩家表现出可能合作的兴趣？如果其他人没有准备好，区块链技术就无法取得太大成就。你们行业的联盟开发状态如何？是否有某个竞争对手正在领先？还是某个独立的软件供应商正在提供一种解决方案，使得与他们合作是合理的？考虑到行业格局，数据标准是否会构成障碍？\n\
  \n总而言之，你必须弄清并贡献于创建最小可行生态系统的协作基础设施，这是成功采用区块链的基础。\n\n在你学习技术的同时，你应该不断评估眼前的技术机会。一个需要关注的因素是技术本身的成熟度。它目前的局限性是什么？什么正在获得关注？解决差距有多大的动力？哪些平台正在获得动力并赢得更多市场份额？监管格局如何？\n\
  \n### 商业化\n\n随着生态系统的成熟和协作基础设施的到位，你就准备好向前了。在专注于采用和商业化之前，先通过试点来构建解决方案。\n\n试点有助于建立公司内部对技术的信心。运行试点可以向自己证明解决方案的技术可行性。它还能增强整个公司（特别是领导层）进一步追求该技术的信心。\n\
  \n当你达到投资是合理的时点时，是时候采取行动了。如果你想对解决方案的方向产生更高的影响力，请选择发起者领导的联盟。假设市场上存在多个平等的参与者。在这种情况下，与联盟合作制定出一个解决方案可能更好。\n\
  \n\n\n\nGPTs 是具有全球影响力的强大技术。GPTs 的影响可以给现有的经济和社会结构带来变化。随着时间的推移，GPT 的效率不断提高，这会持续改进嵌入\
  \ GPT 的下游领域。随着 GPT 变得越来越高效，下游行业的成本会降低，有助于降低价格并提供更好的产品。值得注意的是，越来越多的行业发现将 GPT 作为输入是有帮助的。\n\
  \n我看到了 GPTs 与 Tony Little 描述他看待区块链的方式之间的某种相似之处：“它就像是接入了电网。我把区块链类比为一种公用事业。它不是灯泡，但它是你插入灯泡的电网。一个良好的区块链用例应该感觉就像电网一样。你正在创造一种所有人都可以接入的东西。”\n\
  \n下游行业利用了 GPT 执行的一些通用功能。而区块链执行的通用功能是在不存在信任的环境中实现交易。\n\n从浅层上看，区块链看起来仅仅是一个共享的电子表格，多方可以在其中读取和写入交易。它们以持续流的账本格式进行操作。然而，区块链不仅仅是一个共享的电子表格，因为它在技术之上套上了一层社会经济的外壳。\n\
  \n正如诺华（Novartis）的 Dan Fritz 所强调的那样：“区块链是一个社会技术构型。……这基本上意味着它是为了共同优化而设计的。换句话说，它应该是一个双赢的。它应该让所有参与其中的成员受益。……而这基本上需要不同的心态，一种不同的思考方式，即我们要‘做大蛋糕’，而不仅仅是‘分蛋糕’。”103\n\
  \n将该共享电子表格转化为区块链的，是许多人可以同意记录这些交易，尽管他们并不认识也不信任对方。就此而言，他们甚至可能存在利益冲突但仍然能够进行交易。此外，没有人对这种互动进行监督或裁判。区块链让点对点市场在不需要中心权威的情况下存在。这些对等点也可以是企业，或者\
  \ IoT 设备。\n\n区块链可以帮助我们达到这样一点：我们将把数字信任视为理所当然，因为它将成为我们工作方式的最低共同标准。想象一下，无处不在的数字信任将解锁所有的事情。正如\
  \ Orapong 思考过的：“如果你能像今天发送短信或电子邮件那样容易地进行交易——想象一下，如果你能那么容易地进行交易，商业世界将会发生多少变化。”104\n\
  \n区块链将成为业务功能的基础设施层。我们不再谈论区块链，而是将其视为理所当然。我们已经开始看到它渗透到经济中的各个行业。它将成为企业运作的底层管道。\n\n\
  就像 GPT 一样，它可以扩散到经济中并帮助每个人做得更多。区块链可以帮助你与竞争对手和合作伙伴结合在一起，这种方式就像潮涨船高，包括你的那艘。\n\n## 区块链的前行之路\n\
  \n在区块链成为 GPT 之前，它从现在开始的旅程需要经住时间的考验。\n\n在所有新兴技术中，区块链是一种主要在跨组织部署时才能产生价值的技术。采用该技术面临许多阻力，例如缺乏区块链的教育、由于技术新颖导致的技术快速演变、标准不成熟，以及缺乏美国监管机构的支持。但是，“竞合”（coopetition）是成功的必要条件，这可能是它最大的障碍。作为一个整体，商业世界需要达到让这一理念生根并融入商业精神的程度。企业需要理解来自共享和互联经济的价值，以实现区块链的全部潜力。\n\
  \n此外，正如 Alison McCauley 所说：“真正需要记住的一点是，我们正经历一个非常疯狂的炒作周期的后遗症，因此人们在进入时带有许多先入为主和情绪。很多情绪。这真的很难应对。”105\n\
  \n对于所有新兴技术，你都需要对回报率（ROI）保持耐心。你不能期望事情立即发生。首先，很少有人知道该做什么以及如何最好使用它来获得快速价值。也缺乏可以依靠的最佳实践。在区块链案例中，我们必须考虑额外的因素。因为区块链项目是一项团队运动，你必须带着大家一起才能成功。这需要时间。所有人必须一起走。如果所有人必须共同前进，你就必须留出达成共识所需的时间。如果有共同目标，也需要共同决策。这需要时间。\n\
  \n你还必须在非技术性事务上花费更多时间。正如 William Mougayar 说得非常到位的那：“总而言之，区块链涉及 80% 的业务流程变革和 20% 的技术实施。”106\n\
  \n由于技术团队主导许多区块链项目，他们最终采取了技术优先的方法。主要重点最终变成了技术细节的实现，而不是这项事业的经济效益。\n\n正如 HFS 研究报告所言：“虽然大多数受访者正关注技术解决方案，但少于\
  \ 45% 的受访者正在投资区块链人才、联盟、研究和知识产权。纯粹以技术为中心的区块链叙事是失败的药方——人员（利益相关者参与、变革管理、技能开发）和流程（业务案例、治理、扩展和支持支持）对于推动成功同样关重要。”107\n\
  \n由于这些原因，变革管理承担了额外的维度，因为人们必须学习根本性的新工作方式。新学的行为需要一些时间才能体现。我可能在理上理解了某事，是因为变革管理的努力带我通过了培训。我也理解这里涉及的范式转变。在我们看到行为改变之前，我必须经历一个内化的过程。\n\
  \n在此之前，我可能知道它，但可能仍然表现出旧的行为模式。\n\n正如 Lisa Butters 在与 GoDirect Trade 工作时发现的那样：“我认为透明度真的非常困难。对于习惯了过时销售方式的卖家来说，他们正在扫描文档，可能将其保存到计算机并往回电子邮件，他们并不习惯于电子商务的存在。他们不知道如何管理在线商店。这就是你在\
  \ 1995 年到 2000 年初看到的亚马逊的情况。你有很多实体店，它们真的不习惯电子商务活动。在 2010 年到来之前，他们觉得不需要参与其中，结果他们就被遗下了。”108\n\
  \n讽刺的是，区块链——这项“信任”技术——在获得主流认可之前，必须赢得我们的信任。\n\n\n\n\n综上所述，正如我们在本书的探索中所看到的，各行业在采用区块链方面确实有足够的动力。区块链已经从概念验证（POC）迈向了商业化。正如安德鲁·斯皮尔斯（Andrew\
  \ Speers）所说：“区块链 POC 的时代已经结束了。我们已经做了两三年的这类工作。我们知道它是可行的。我们知道它的作用。现在我们没有奢侈去为了智力追求而构建东西了。它已经从一种新兴技术变成了‘技术’本身。我们正着于商业化、测试以及供客户使用。”109\n\
  \n### 开启我们的数字未来\n\n我的朋友 Venky 一直问我：“基于区块链构建的杀手级应用是什么？”我老实说，目前这个问题没有答案。我们处于这项技术的非常早期阶段，许多技术限制仍待解决。然而，真正的变革性解决方案尚未到来。随着技术的演进，区块链开始与\
  \ `IoT`、`AI`、`5G`、机器人等其他新兴技术良好协作，真正的杀手级应用也将随之而来。\n\n对于终端用户来说，区块链具有渗透我们的生活并让生活变得更好的潜力。它可以像互联网一样：在生活中无处不在，在幕后运行。我们不需要理解它是如何工作的，但仍然会不经思考地一直使用它，视其理所当然。如果我在网上买了东西，我不需要知道为了完成购买在后台发生了什么。我只需要知道我的安全没有受到威胁，并且可以轻松做到我想做的事。\n\
  \n对于公司来说，它将开启迄今未经验的领域。它将成为连接数字经济的骨干，并帮助其他新兴技术扩展它们的潜力。区块链为业务生态系统所做的，就像 `ERP` 为单一企业所做的一。正如\
  \ IBM 的布里吉德·麦德米特（Brigid McDermott）所说：“区块链具有变革交易的潜力，就像互联网变革通信一样。”110\n\n区块链尚未到位，但迹象表明它很快就会实现。当我们到达那里时，它将改变我们的社会和经济范式。\n\
  \n区块链将是我们不知道自己需要的眼镜。我们可能第一次看到信任的叶片。\n\n![](img/mvas0d8ryzv.jpeg)\n\n[www.locatesw.com](http://www.locatesw.com)\n\
