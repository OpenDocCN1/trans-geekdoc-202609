  \ 新型机器经济\n\n“HFS 研究报告告诉我们，超过 90% 的区块链项目正在织入其他技术，特别是 `IoT` 和机器学习，”我们正在开始利用 `IoT`（物联网）和\
  \ `AI`（人工智能）等技术的潜力，产生一个大于部分之和的整体。\n\n物联网（`IoT`）指的是连接到互联网的物理设备——“事物”。所有智能设备——智能灯、连接恒温器、健身记录等——旨在收集数据并与网络通信，而无需人工干预。Gartner\
  \ 公司预计，2020 年企业和汽车物联网市场将增长到 58 亿终端，比 2019 年增长 21%。到 2019 年底，预计将有 48 亿终端在使用，比 2018\
  \ 年增长了 21.5%。\n\n由于这些 IoT 设备的工作是收集数据并将其馈给网络设备和其他系统，会有大量数据被收集。IoT 设备的主要担忧之一是它们容易受到安全漏洞的影响。在智能家居和智能汽车中广泛使用\
  \ IoT 设备，这种缺乏安全性令人担忧。区块链作为 IoT 设备的数据共享机制，可以利用可用加密和技术的防篡改特性提供另一层安全性。通过与 IoT 设备结合，区块链可以以安全且可靠的方式促进数据传输。\n\
  \nIoT 设备扩展的另一个挑战是它对基础设施带来的负载。预计运行的 IoT 设备数量的巨大增长将产生大量的机器数据，这些数据将需要上传并处理。这将给目前的云基础设施带来巨大压力。相反，在边缘建立基础设施将有助于处理所有这些设备之间的相互数据共享，而无需返回云端。这种边缘基础设施有助于降低延迟并推动机器经济。\n\
  \n`AI` 的应用也变得无处不在。当你最喜欢的网站上购买东西时，你会发现它们正敏锐地预测你感兴趣的物品。然后它们会引导你查看更多建议。这就是背后的 `AI`。当你的语音助手提议通过你的声音识别你时，那是\
  \ `AI` 在发挥作用。当社交网站自动建议在照片中标记的名字时，`AI` 正在工作。\n\n\n\n\nIoT 收集所有数据，AI 则消耗这些数据以获取洞察，并对如何处理这些数据做出智能决策。今天，许多\
  \ AI 就像黑箱。在区块链骨干的支持下，AI 将获得未被篡改的洁净数据。区块链的固有属性可以帮助 AI 生成报告单，显示数据是如何被使用的。从数据摄入训练 AI\
  \ 模型的那刻起，就可以创建审计追踪。它还可以包括 AI 如何得出预测的数据溯源。这种可见性的提高将帮助用户获得保证，确保 AI 正在设计参数范围内运行，并增加对\
  \ AI 模型的信任。\n\n“数据就像原油。它是有价值的，但如果不经过炼，就无法被真正使用。它必须变成气体、塑料、化学品等，以创造出驱动盈利活动的价值实体；数据也必须必须经过分解和分析才能产生价值。”87\
  \ 将这种思路进一步推一步——如果数据是新石油，那么区块链上的这些数据更洁净，所需的处理也更少。这使得整个系统更加高效。\n\n采用区块链技术与物联网（IoT）和人工智能（AI）等其他新兴技术相结合的融合解决方案，有潜力为价值创造开启新的大门。目前，人们正尝试实现这些新兴技术的融合以及机器经济的出现。让我们来看看其中之一。\n\
  \n## 博世全球与万物经济\n\n区块链可以提供信任层，帮助物联网设备从仅仅收集和传输数据，转变为能够作为经济中独立实体和经济公民参与交易的设备。“一个物联网的经济”——这是博世工业正倾注努力的方向.$88\
  \ 万物经济是物联网的演进，它使设备能够根据自己的选择参与经济交易。\n\nRaghavendra Kulkarni 一直在博世工作，利用区块链等新兴技术孵化业务以开发新的收入来源。正如他所说，“物联网的核心在于物理世界与数字世界的连接。”89\n\
  \n联网设备使得硬件在生态中的角色商品化。设备被边缘化为数据的收集和传输仅此此。在万物经济中，设备可以作为网络中的经济参与者提供附加值。设备变成了价值链中不可或的一部分，而不再是信息的收集者和传播者，区块链正是实现这一发展的节点。\n\
  \n这种参与始于赋予这些设备自主权。博世作为一家公司，在传感器的使用上做了很多工作。他们从传感器中提取服务并将传感器信息输入软件。目前，带有这些传感器的 IoT\
  \ 设备帮助我们周围的物理世界实现自动化。但假设我们赋予这些设备自主权，即让它们能够自主决策。在这种情况下，区块链组件在实现这一目标方面起着催化剂的作用。区块链将帮助我们从智能联网设备转向经济设备。\n\
  \n这将有助于实现万物经济，即围绕其拥有商业模式的自主设备。这让“万物”在决定是否参与经济交易是否有意义时有了选择。正如 Raghavendra 所说，“物联网不仅关乎技术，更关乎数据和创造的价值。”90\n\
  \n## 数据市场案例\n\n所有的 IoT 设备为机器经济创造了无数可能。区块链可以使个人拥有其数据的不可篡改记录。想象一下，人们拥有一个数字保险库，其中包含了他们的身份以及模式：健身追踪记录的活动模式、内容提供者的媒体消费模式、汽车的驾驶行为、与医疗系统交互的医疗记录等。\n\
  \n我们可以以安全的方式成为数据的托管。然后我们可以根据意愿访问这些超粒度数据。现在，如果 Rahul 想去酒吧，所需的数据只有：Rahul 超过 21 岁吗？是或否。不需要提供显示出生日期、地址和器官状况的执照。所有这些信息与交易无关，不需要泄露。不仅是人，像\
  \ IoT 设备这样的物体也可以拥有自己的保险库。\n\n博世通过 TrueFood+ 实施了一个用于牛奶溯源的数据市场。该解决方案的一个方面涉及了牛奶生产和农户生态系统。这一概念被称为“加密奶牛”（Crypto-cow）。通过\
  \ `Crypto-cow`，农民可以在基于区块链的数据市场中记录并广告奶牛整个生命周期的不同数据点，例如产奶量、产奶预测等。\n\n所有向农民销售产品的农户生态系统参与者，如兽医、保险公司、合作社、设备制造商、种子制造商等，都是这些数据的消费者。根据数据市场中共享的信息，这些参与者可以为农民提供服务。例如，兽医可以查看产量预测，并对牛群可能需要的医疗干预或饲料变化提供建议，以影响预测。金融生态系统可以查看牛群健康、产奶预测等各种数据点。根据这些数据，他们可以提供替代金融产品。农民提供数据，反过来收到来自顾问的主动建议。\n\
  \n\n\n\n# 第 9 章：供应链中的区块链\n\n牛奶溯源涉及的第二个维度围绕牛奶分销展开：从收集点到进入零售店的过程。在这里，牛奶的状况监测是关注重点。博世（Bosch）从奶牛舍到整个分销渠道都部署了传感器，测量各种牛奶特性。博世获取传感器收集的数据并将其置于区块链账本上。将这些传感器产生的所有数据存储在区块链上，为提供了温度、湿度等各种参数的可追溯性。这些数据可以收集牛奶从奶场到送往加工的整个过程。TrueFood+\
  \ 还可以通过动态二维码，在不同的存储点对某批牛奶进行监控，直到其到达零售点。91\n\n区块链、人工智能与物联网的无缝结合将实现下一代解决方案，并为价值创造开启新大门。当我们致力于在大范围内加速这些技术时，区块链可以帮助为这些新兴技术所使用的数据提供信任——从数据到信息再到智能，这些内容由物联网生成、由区块链驱动并由人工智能分析。\n\
