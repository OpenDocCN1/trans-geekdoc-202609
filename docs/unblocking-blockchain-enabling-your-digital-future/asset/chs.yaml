  \n11 \n\n# 前言\n\n### 盲人摸象 – 约翰·戈德弗里·萨克斯诗歌（1816–1887）\n\n印度有六位仁人，他们博学多才，\n他们去去看大象（尽管他们都是盲人），\n\
  每个人都想通过观察，来满足自己的想法。\n\n`First` 走向大象，不小心摔倒了，\n撞在它宽阔而结实的侧面，立刻大大大叫起来：\n“上帝保佑我！但这大象非常像一堵墙！”\n\
  \n`第二` 摸到了象牙，喊道：“噢！我们发现了什么，\n如此圆润、光滑又尖利？对我来说非常清楚，\n这头大象的奇迹，非常像一根矛！”\n\n`第三` 靠近动物，恰好抓住了\n\
  那条蠕动的象鼻子，在手中，大胆地站起来说道：\n“我明白了，”他说，“这大象非常像一条蛇！”\n\n`第四` 伸出急切的手，摸着膝盖：\n“这只奇幻兽最像什么，显而易见，”他说，\n\
  “很清楚，这大象非常像一棵树！”\n\n`第五` 碰巧摸到了耳朵，说：“即使是最盲的人，\n也能看出这最像什么；谁能否认这个事实就来吧，\n这头大象的奇迹，非常像一把扇子！”\n\
  \n`第六` 刚开始在兽身上摸索，\n就抓住了那摇晃的尾巴，那正好进入了他的视野，\n“我明白了，”他说，“这大象非常像一根绳子！”\n\n于是，这些印度人，大声且长时间地争论，\n\
  每个人都坚持自己的意见，极其固执且强硬，\n尽管每个人都有部分是对的，而所有人都是错的！\n\n\n\n“我一直听到关于区块链，是吗？”有一天我妻子问道。\n\
  “区块链是一个跨多个计算机的共享账本，”我回答道。它是一个不断增长的列表，不断添加新的交易。你把股票卖给另一个人：这是一次交易。你的仓库从运输公司收到货物：这也是一次交易。\n\
  \n区块链作为一种记录系统，以块的形式存储数据，只有在大多数人同意这些确实是需要存储的正确数据后，才会被添加。这是一个去中心化的系统，意味着没有中央机构。相反，账本由参与者网络维护。\n\
  \n一旦交易在账本上记录，它几乎是不可能更改的。在理论上，极少数情况下是可能的，但考虑到技术的发展水平，还没有足够的计算能力可以在不被察觉的情况下对数据进行更改。因此数据能够抵抗恶意行为者的操纵。\n\
  \n这种数据也是共同财产，因为它是由对数据感兴趣的参与者集体维护的。他们都关心数据并希望相互进行交易，尽管他们并不一定信任对方。共享的现实意味着，不需要维护我版本的真相与你版本的真相对比。\n\
  \n\n\n区块链是一个跨多个计算机的共享记录系统。它几乎不可删除，存储安全且由集体维护。\n\n\n数据还使用密码加密技术进行安全存储。这种信息的存储方法类似于现在存储密码的常用方法。假设丢失了在线账户的密码。在这种情况下，管理员通常会要求你重置密码，而不是直接告诉你密码是什么。那是因为他们不知道你的密码。\n\
  \n当你尝试登录并提交密码时，明文密码会被加密，这个加密版本会与你第一次创建密码时生成的加密字符串进行比较。如果两个字符串匹配，你就能获得访问权限。即使知道它的加密形式，别人无法通过逆向工程找到实际密码。\n\
  \n同样，密码加密保护了存储在区块链上的交易数据。密码加密的使用使得限制只有授权方才能访问数据成为可能。\n\n\n\n\n\n现在让我们来看看技术定义，为我们对区块链的理解增添色彩。\n\
  \n\n\n区块链是一种`分布式数据库技术`，它在`通过 P2P 网络跨多个节点`上存储数据。该数据库是`只追加的`、`经过加密保护的`，并承诺使用`共识机制`。\n\
  \n从核心上说，区块链是一种分布式账本技术。账本是交易按时间顺序的记录。账本的分布式特性是因为有多台计算机通过点对点网络存储它。节点是网络中可以保存数据的计算机之一。所有节点都拥有数据的完全副本，为我们提供了一个具有相同真相版本的共享现实。\n\
  \n主流的数据库技术允许对存储的数据应用创建、读取、更新和删除（CRUD）功能。然而，区块链是一种只追加的数据技术。你只被允许创建或读取记录。不允许删除或更新。这一特性赋予了区块链不可篡改和易于检测破坏的特性。假设你需要对之前的条目进行更改。在这种情况下，你需要在添加新信息之前创建新条目，使之前的交易失效。\n\
  \n在被添加到账本之前，会使用各种共识机制来确认交易的有效性。\n\n随着交易被确认并添加到账本，它们被分组在一个区块中。随着新区块的不断添加，它们使用密码学加密链接到上一个区块。这种交易区块的链接创建了一个连续的链——这就是“区块链”名称的由来。\n\
  \n下面的图片将这一切整合在一起了：\n\n\n\n区块链根据其各种特性带来的收益，具有独特的价值主张，可以帮助我们在现实世界中使用。让我们来看看这个收益框架。\n\
  \n\n由于区块链数据是共享的，每个人都可以访问相同的数据。没有必要维护两个代表该数据的不同副本。假设双方想根据这些数据与彼此进行交易。在这种情况下，它消除了核实、对账或审计信息的负担。这些活动相关的任何成本也随之消失。因此，这还消除了维护保证数据真实性的中间人服务的额外成本。每个人都查看相同的数据现实使得这成为可能。\n\
  \n\n拥有数据的各种分布式副本使得系统具有韧性。因为没有单点故障，所以它可以防止拒绝服务（`DoS`）攻击。假设其中一个对等由于由于原因无法访问。在这种情况下，你仍然可以访问存储在其他计算机上的数据，增加了整体的稳健性。\n\
  \n\n由于实际上没有人可以删除数据，我们对共同的数据流现实具有透明度。这增加了对数据的信任，因为任何变化都可对其对其进行追溯和审计。可追溯性使我们能够在没有经过验证的第三方或中央机构帮助的情况下信任数据。\n\
  \n\n在区块链中使用密码学导致了数据安全性的提高。数字签名法允许两个互不信任的实体参与安全的交换。\n\n\n共识是区块链上所有对等者的认可机制，使他们对添加到区块链上的交易达成共同协议。它确保了交易是真实且可接受的。共识的使用使得不需要中央机构来验证和确认交易，并去除了中间人及相关成本。\n\
  \n总的来说，这关乎信任。我知道对等节点已经验证了这些数据。我知道没有人篡改过它。我还可以看到它的演变。我看到数据是安全的。所有这些方面都构建了对区块链上数据的信任。\n\
  \n\n除了记录交易外，满足某些数据条件还可以自动执行实现业务规则的代码。例如，当你的仓库记录了一笔收货交易时，供应商的货款可以自动释放。这种代码被称为智能合约，它使得业务工作流的自动执行成为可能。\n\
  \n\n\n我们应该记住，分布式账本技术（`DLT`）是一个术语，而区块链是 `DLT` 的一种类型。也许因为它更口口，“区块链”一词在行业中受到了更多关注。在此本书的整个对话中，我将使用“区块链”作为普通名词来指代所有类型的\
  \ `DLT`。最终，所有的 `DLTs` 都具有相似的特性，并旨在实现相似的结果。它们的方法可能不同，但结果是相同的。其中的一些例子包括 `IOTA Tangle`、`Ripple`\
  \ 和 `Hedera Hashgraph`。\n\n\n我们还应该记住，区块链不是比特币，比特币不是区块链。我经常注意到人们经常将区块链误认为是比特币。当我把这本书的前两章给我的朋友\
  \ Glenn 以征求反馈时，他在读了摘录后说：“噢，我不知道比特币可以做所有这些？” 尽管我在那些章节中没有一次没有提到过“比特币”这个词。\n\n\n\n\n\
  \n这些交易记录存在于各处的账本上。我们可能不称之为账本，但它们确实就是账本——记录的持续更新流。当你开灯坐在房间里时，你的公用事业公司会不断记录用电量。他们还会计算应收你的费用。对于结算，你可能会在月底收到一张账单。但关于你的用电量和欠款，系统会维持一份持续记录。你的购买记录位于某个账本上，连同你支付的交换金额。我们不断对周围发生的事情进行记录。\n\
  \n记录交易情况是我们日常生活的关键——无论对个人还是公司都是如此。这些记录让我们回顾过去，并帮助我们规划未来。交易可以快速完成，但结算可能需要长得多，而且维护这些交易的记录可能既耗时又容易出错。这还增加了业务成本。\n\
  \n例如，你点击“卖出”按钮，卖掉了在线经纪商账户中的股票。如果你想立即获得资金，这不会发生，因为结算过程需要几天时间。这种结算将涉及多个方，他们对同一笔交易都有自己版本的账本。这些实体中的每一个都无法看到对方的账本，必须花费精力和时间对记录进行对账。这些交易本质上是有冲突的。它们为两个参与者都提供了价值，这就是参与者同意交易的原因。但交易是在平衡状态发生的。将这种平衡倾斜向他们的一方将符合所有人的利益。这导致了一个问题：你是否可以信任对方的记录。\n\
  \n社会需要信任来维持这些交易的持续。他们通过各种方法来维护这种信任。在社会层面，我们有伦理和道德的概念，鼓励诚实可靠的行为以维护个人声誉。在更正式的制度层面，社会试图通过实施管理交易发生边界和条件的规则与法律来遏制不诚实的行为。我们并不信任每个方都会按照道德准则和法律办事；因此，我们实施了各种检查和制衡措施。这些措施的形式包括审计师、第三方信誉机构、法律结构等。\n\
  \n这一切结合使得 `trust`（信任）得以产生。以金融交易为例。我只需刷卡即可在无需交付任何现金的情况下在商店购买杂货。我可以进行这样的购买，是因为我和商户都信任第三方——金融系统。我愿意把钱存在银行，因为我很清楚，明天早上醒来登录账户时，可能会发现余额为零。我信任银行不会错待我，因为他们想要保护声誉并继续经营。即使银行发生违规，政府机构也制定了法律来保护我。\n\
  \n区块链通过将信任转向技术，改变了对个人和机构产生信任的需求。借此，它提供了消除那些仅为在我们周围提供信任而建立的基础设施成本的可能性。在区块链上，交易对所有人都是透明的。不需要中间人进行认证，这有助于降低成本。\n\
  \n今天，当两家公司共同开展业务时，他们通常会对自己的工作保留分开的记录。这些记录不时会出现差异，导致解决起来令人沮丧且耗时的分歧。区块链为共享记录集提供了一种优雅的方法。双方（或多家）公司在将数据记录到共享账本之前，都认为数据是正确的。\n\
  \n一旦你拥有了这套可靠且共享的记录，你现在就可以在此基础上探索自动化业务流程。这些可靠的数据实现了更顺畅的组织间工作流。区块链允许这种底层基础设施的创建，促进了竞争者之间的协作。\n\
  \n\n多年来，随着管理理论的演变，公司调整了策略，将协作纳入以增加利润。通过竞争增加利润曾是公司的首要策略。在试图获得竞争优势的过程中，该策略扩展到包括与各种合作伙伴的协作。这种与竞争对手的合作以战略联盟的形式表现出来。\n\
  \n竞争对手之间不同程度的竞争和协作行为可以同时存在。竞争对手之间的竞争行为可以从公开战争到微妙摩擦不等。组织之间的协作行为可以从完全整合到零星的协作。这种协作优势可以使公司获得比他们自己所拥有的更多的技能和资源。\n\
  \n组织通常表现出这些具有矛盾元素的“同时对立面”的存在。“悖论的关键特征是相互矛盾的、甚至是互斥的元素的同时存在。”14 战略联盟中这种合作与竞争的悖论被称为“竞合”（coopetition）。竞合发生的首要前提条件是竞争公司之间利益的重叠。然后，他们会被激励一起工作，以追求创造比他们单独工作所创造更多的价值。区块链将极大增强竞合。它将增强公司间协作的可能性领域。\n\
  \n将区块链看作不仅仅是新技术；它引入了一种看待世界的新方式。区块链不是纯粹的技术游戏，而是一种技术社会学创新。它帮助以我们以前从未见过的方式改变一群人的行为。它更像是一个技术社会学构架，有助于实现所有各方的共赢。它转变了心态，尝试共同做大饼，而不是像公司在市场中竞争那样将其切分。这是业务模式的一场范式转变，通过打开名为“公司”的孤岛，为客户创造更多价值。\n\
  \n**那么，什么是区块链？** 它是数据库吗？账本吗？信任层吗？不可不可变的？安全的？无需信任的？防篡改的？去中间化的？区块链可以是所有这些，也可以是其中任何一个。这取决于你的选择。就像印度的盲人一样，区块链的现实取决于你问谁而不同。\n\
  \n本章应该让你对区块链是什么有了一个良好的概述。现在我们准备好开始探索了。如何开启一段成功的区块链采用之旅？\n\n\n\n\n\nGartner 的新业务价值预测方法量化了技术创新的价值。它考虑了客户体验、新收入和成本降低等因素。根据该方法，在区块链背景下，“区块链的业务增值到\
  \ 2025 年将增长到略高于 1760 亿美元，并预计到 2030 年将超过 3.1 万亿美元。”15 我们讨论的是巨大的数字。由于对这项技术的预期，每个人都想参与其中。他们想确保自己不被抛队。尽管如此，关键问题是，你参与区块链是否出于正确的理由？\n\
  \nStephanie Hurder 是 Prysm Group 的创始人经济学家，这是一家专注于实施新兴技术的经济咨询公司，也是世界经济论坛的学术贡献者。她一直是企业区块链倡议的活跃参与者。通过与各种项目合作，她能看到一些熟悉的趋势不断出现。她解释道：“你会看到某个联盟宣布他们有了概念验证，或者他们将针对某个特定的用例进行试点。一年后，当你再回来时，发现：‘哦，我想知道那个试点怎么样了，好像再再也没有消息了，’我们只是看到这种模式不断反复出现。”16\
  \ 这些项目并没有带来结果。\n\n这种观察也可以得到数据支持。根据普华永道的一项调查，在报告区块链项目处于试点阶段的受访者中，54%的人表示努力有时或往往并不符合结果。”17\n\
  \n“我的投资者正在询问我们的区块链策略，我需要关于这个主题的一些指导，”我的朋友 Sandeep 说道。当然，他得到了他需要的帮助，但这让我产生了思考。他研究区块链技术的原因并不是他试图解决的业务问题（且区块链被确定为该问题的解决方案）。相反，他出于外部原因需要研究这项技术。\n\
  \n\n© PwC。未经 PwC 事先书面许可，不得进一步分发。PwC 指美国成员机构或其子公司或关联公司，有时也指 PwC 网络。每家成员机构都是独立的法律实体。详情请参阅\
  \ [www.pwc.com/structure](http://www.pwc.com/structure)。\n\n一方面，存在这样的潜力，但另一方面，这种潜力似乎正在萎缩。区块链可以为公司增加巨大的价值，但它们需要清楚价值驱动因素是什么以及谁获得了这些价值。许多项目对于在特定用例背景下为何使用区块链技术而非现有技术的理由并不清楚。如果项目只是追逐热点，而不将他们的努力与价值挂钩，他们就会增加再次无人问津的概率。\n\
  \n根据 Gartner 2019 年的预测，“90%的现有企业区块链平台实施将在 2021 年之前更换。”18 关键原因之一是没有将用例与区块链的业务收益联系起来。\n\
  \n\n公司看待新技术的一个视角是：这项技术会对我的业务造成什么损害？从这个视角来看完全关乎竞争优势。如果竞争对手利用这项技术来打破竞争格局，我们将处于劣势。那么问题实际上是：我们如何才能领先一步？\n\
  \n“企业战略集团 2019 年的一项研究显示，大多数领先组织已经看到了新兴技术的本质属性。82%的组织同意或强烈同意，如果没有新兴技术，他们将无法实现转型。如果他们不转型，竞争对手就会颠覆他们的业务。”19\n\
  \n保持竞争力促使泰国商业银行（SCB）关注区块链。\n\n正如 Orapong Thien-Ngern 解释道：“我们意识到，银行持续增长或恢复低股资产收益率的方法之一是从传统业务中扩展出来。我们仍然主要是一家金融机构，但我们开始以不同的方式审视金融世界。我们可以采用新技术吗？我们可以开始创造脱离传统方式的新产品和服务吗？这就是为什么我们对这种分布式账本和区块链如此感兴趣。”20\
  \ Orapong 是 Digital Ventures 的首席执行官，它是 SCB 的子公司。\n\nSCB 是泰国最古老的银行，成立于 1904 年，一直是市场表现最好的银行之一。”21\
  \ 它也是泰国按资产和利润计算最大的银行之一。为了保持竞争力，SCB 不断寻求其提供服务的创新。而新兴技术是创新的方向之一。\n\n传统银行市场的动态是这样的，每个参与者都在试图保护自己的市场份额。“例如，两年前，我们创建了我们认为领先的移动银行应用程序，以获得市场份额。我们宣布了零费用，所有手机银行交易全部免费。在半小时内，每家银行都匹配了这一报价，”Orapong\
  \ 说。22\n\n在这样竞争激环境中，获得额外的收入或利润是挑战性的，尽管你可能投入了大量资金。这种情况迫使银行从传统业务中扩展。他们寻求采用新技术以获得竞争优势的方法。他们可以在流程中创造不同于传统方式的新产品和服务吗？\n\
  \n\n\n\n\n通过基于区块链的解决方案，在点对点（P2P）过程中不再需要多份文档。一切都变成了一个账本。如果出现问题，你无需担心该记录是否可以被审计以及具有完整性。它是作为技术栈的一部分直接内置的。\n\
  \n“这就是为什么我们相信区块链将改变世界。它将实现不同的业务模式。如果你能像今天发送短信或发送电子邮件一样容易地进行交易，想象一下，如果你能像那样容易进行交易，商业世界将会发生多少变化.”24\
  \ 泰国银行（SCB）之所以使用区块链，是因为他们无法以经济可行的方式使用现有的技术栈。\n\nSCB 于 2017 年启动该项目，并在 2018 年 3 月发布了第一版本的概念验证（`POC`）。`POC`\
  \ 证明了该解决方案是有效的。他们从那里开始扩大规模，并于 2018 年 8 月通过真实交易投入生产。从那里开始，他们花费了一年的时间规模扩大到一百个供应商。\n\
  \n最初，进展较慢，因为正如许多 IT 项目一样，生产环境中的现实实施带来了自身的一系列复杂问题。各种边缘情况和异常都接踵而至，例如，有人分批发货。某些货物由于质量问题被拒绝。有时部分零件会被替换，等等。他们花费了一年的时间来识别并修复这些异常。现在，他们可以以每周约一百个供应商的速度进行扩展。越来越多的大型公司表现出加入该网络的兴趣。当你看到这种反应时，你就知道参与者看到了某些真正的价值。\n\
  \n\n“是生产力，”Orapong 说道。他接着补充道，“如果你观察现在的世界，你有多个参与者。你有一个大买家、多个供应商、买家的付款银行以及供应商的融资银行.”25\
  \ 在有这么多参与者参与、且没有整合的情况下，整个过程变得非常繁琐。在供应商提交发票后，可能需要两到三周时间才能完成审批。这段时间用于完成“三方对齐”，即：发票与采购订单、收货单和货运单进行匹配。发票提交后，需要持续跟进，以明确买家应付账款部门的接收、处理和操作情况。“从买家的角度来看，应付账款部门需要花费大量时间处理这些文档并在过程中回答问题。这个平台解决了所有这些问题。我们能够在发票提交的当天完成审批。”26\n\
  \n银行也看到了许多益处。正如 Orapong 所确认的，“过去，如果供应商需要现金流融资，他们必须等待三周才能获得发票审批，这意味着在这三周内，银行无法提供贷款。现在，我们将这段时间缩短到了一天，这意味着银行多了三周的时间为供应商提供发票融资.”27\n\
  \n由于该解决方案的透明性，银行可以从一开始就看到交易，从发布 `PO` 的开始到提交发票的结束。这种可见性的提高显著降低了他们的回收风险，使他们能够以更利率为融资定价，因为他们不需要为风险提供补偿。此外，他们还可以取消发票融资的处理费，因为他们可以自己看到交易。“这样一来，你们不再是以\
  \ 18% 的利率提供融资，现在提供的利率低于 5%——因为没有成本和风险。”28 为了强调这一点，像泰国水泥集团（Siam Cement Group）这样的早期采用者已经将流程时间缩短了\
  \ 50%。29\n\n\n对于寻求新兴技术的公司来说，另一个框架是增加利润。利润来自于增加收入或降低成本。“通过这项技术我们可以做什么？通常情况下它可以做到三件事：降低成本，或者提高工作的便利性，”Tony\
  \ 解释道。他是 Optum（联合健康集团的一部分）的集成高级总监，也是区块链战略的关键贡献者。对于该项目的用例，他继续说道，“医疗保健领域存在哪些问题，如果某家公司自己解决这些问题将具有巨大的优势？而且没有任何公司可以完全解决它。基本上，你正在寻找众包解决的问题，大家都能赢。”这涉及到多个参与者的问题。\n\
  \n在 2016 年，Optum 决定评估区块链技术。团队的首要任务是了解区块链基础并进行评估，以清楚它是什么、不是什么。在这些理解的基础上，下一个要回答的问题是：它将如何影响我们的业务？公司发起了全范围的用例收集以供评估。这种方法的方法有助于团队对真实的风险和真实的收益得出客观结论。一次为期两天的工作会议汇集了业务和技术领导者。\n\
  \n头脑风暴的结果产生了一个数据视角的医疗保健行业大纲。白板上填满了各种类型的数据和广泛用例。考虑了医疗记录、索赔、费用和资本化模型。这些用例涵盖了联合健康参与的整个医疗保健领域。接下来是将此地图与区块链技术进行比较，考虑到技术的成熟度及其可能性和局限性。现在是时候划掉那些区块链无法解决的问题。所有被划掉的项目都对应了为什么它们不适合区块链用例。\n\
  \n最后，团队确定了“提高提供者数据准确性”这一用例。提供者数据是份半公开的医生列表，包含其人口统计信息，例如医生的姓名、诊所电话、地址以及是否接收新患者等。这些数据需要为保险公司的每个网络内提供者（即支付方）保持最新更新。保险公司每年联系提供者几次，以验证信息并询问：“嘿，有什么变化吗？”对于保险公司网络中的所有医生来说，他们必须联系并确认数据。这些信息过时很快。数据必须不断更新，并为所有保险公司创造了多次重复的验证负担。\n\
  \n整个医疗保健体系内的保险公司每年在维护其提供者数据记录准确性的流程上总计耗资了超过 21 亿美元。30\n\n\n\n\n\n如今已经存在可以尝试解决这一问题的技术。但这些技术的使用具有挑战性。因为这些技术无法提供以去中心化方式应对挑战的可能性，所有的保险公司都必须收集自己版本的“真理”。作为所有保险公司的总和，这变得异常沉重。整理他们的数据源不仅在技术上是负担，在组织上也是一个问题。此外，提供者也面临着负担，因为他们必须管理来自多家保险公司索要相同信息的持续请求流。\n\
  \nOptum 技术公司在开启其区块链之旅时，目标是寻找几家愿意参与实验的国家级保险公司。该实验的目标是看看如果他们利用区块链来解决某些用例，将获得哪些收益。我们谈论的不仅仅是技术上的收益。当大家共同努力时，可能会产生经济、政治和运营方面的收益。通过参加各种区块链医疗会议，Optum\
  \ 团队能够与 MultiCare 和 Humana 等其他保险公司建立关系，并开始就建立联盟进行对话。自此，Synaptic 神经健康联盟（Synaptic\
  \ Health Alliance）应运而生。\n\n通过使用区块链，Synaptic 健康联盟的成员可以显著降低验证成本。如果操作得当，可以将其降至接近零。保险公司查看共享的数据现实版本，看到其他受信任的保险公司已对该数据进行了证实。这基本上等同于给他们打电话询问：“嘿，这个人把名字从\
  \ Jones 博士改成了 Smith 博士吗？”相反，这直接就在数据库中：保险公司只需运行查询并获取这些信息即可，而无需反复承担验证相同提供者数据的负担。\n\
  \n在 SCB（泰国商业银行）和 Synaptic 健康联盟的案例中，我们可以看到参与者如何利用根于区块链技术的解决方案来获取价值。但正如 HFS 研究发现的，“在报告的\
  \ 940 个区块链项目中，只有大约一半的项目具有业务意义并为受访者创造了真实价值。”31 我们必须记住，正如热炒让你信信的那样，区块链并非万问题的万灵药。确实，在这些噪音中存在相关的用例。尽管如此，也必须仔细选择。在启动计划之前，要审视战略愿景以确定你想要实现的目标。在确认区块链技术是否合适之前，应该使用关键参数对旨在解决的痛点进行评估。也许其他技术更适合帮助你实现所追求的目标。总而言之，你正在寻找共同的痛点或共同的收益，以便其他利益相关者愿意资助并有效治理一项区块链倡议。\n\
  \n正如 Tony Little 所解释的，关键问题在于：“你如何创建一个网络？第一，它是自启动的；第二，它奖励那些为特定用例提供高质量数据的参与者；第三，它让他们有大量的激励来继续以这种方式参与。”为所选用例回答这个问题，正是在使用区块链技术时获得竞争优势的关键。由于加密经济学（crypto-economics）的使用，这在比特币等公共区块链网络中运行良好。在企业区块链的情况下，我们必须非常仔细地从经济角度评估区块链网络的自维持性。正如\
  \ Tony 继续确认的那样：“如果我用高质量数据参与，并将获得网络的经济奖励；那意味着它是自给自足的你也可以让小玩家也参与进来。现在，突然之间，你就有了网络效应。”我们必须观察这些细微之处，并评估为什么公司以这种方式参与商业网络会更便宜、更好。\n\
  \n经济学正是区块链真正变得有趣的地方。\n\n\n***\n\n15 Gartner，“预测：区块链业务价值。”\n16 Hurder，“为什么企业区块链会失败。”\n\
  17 PwC，“让区块链业务化。”\n18 Gartner，“Gartner 预测 90%”\n20 Thien-Ngern 等，“用于采购与支付的区块链”\n\
  21 Nikkei Asia，“泰国商业银行”\n22 Thien-Ngern 等，“用于采购与支付的区块链”\n23 同上\n24 同上\n25 同上\n26\
  \ 同上\n27 同上\n28 同上\n29 R3，“用于采购与支付的区块链。”\n30 Synaptic 健康联盟，“提高提供者数据准确性。”\n31 Gupta\
  \ 等，“忽视区块链将导致后果。”\n\n\n## 核心在于经济学\n\n\n种子网站曾使用去中心化的点对点系统共享文件，但效果并不理想。“在种子系统中，任何人都可以与去中心化网络共享文件。其理念是人们会下载文件并保持种子（即为他人下载共享文件）状态。问题在于这是基于信誉制度。如果你在下载文件，人们预计你也应该进行种子。问题是，人类并不是最诚实的生物，在没有经济激励的情况下，人们没有理由继续种子一个占用电脑不必要空间的文件。”32\
  \ 但在区块链网络中，加密经济学可以提供帮助。它将密码学和经济学结合在一起。它为参与者提供了激励，让他们以自维持的方式推动网络运行。\n\n假设你正在严谨地为公司创建一个基于区块链的解决方案。在这种情况下，你这样做是因为你认为它会为所有参与者创造经济价值。其意图是为参与者节省资金和时间，或者创造增加收入的新机会。在\
  \ Synaptic 健康联盟的案例（第 2 章讨论）中，通过将各个网络参与者提供的多个数据源放入同一个数据库，他们希望获得能够节省成本的协同。作为这种经济逻辑的一部分，你必须考虑不同的利益相关者以及他们作为联盟良好经济公民加入并贡献该系统的激励。参与者可能看到他们从解决方案中获得的价值，但你如何激励他们参与并为联盟的健康做出贡献呢？\n\
  \n\n\n\n区块链可以提供一种运行模型，为参与者提供经济激励，使其成为良好的网络公民并尽其责任。在 Synaptic Health Alliance 的案例中，人们提出了数据市场学的构想。这为确定网络经济模型铺平了道路。任何想要使用数据并修改由另一支付方更新的供应商目录录的人，都需要从提交该数据的实体处购买数据。买方的支付意愿取决于该保险公司提供数据的历史准确性。网络奖励贡献准确数据的参与者。这为吸纳更多公司提供了一种方法，让他们能够以一种方式加入并使用该网络，而不是在其他人的数据上“搭便车”。否则，就没有激励去作为网络的模范公民参与其中。“如果我能重来一次，我会更强力地推动他们，帮助他们理解建立经济模型的必要性，”Tony\
  \ Little 解释道。\n## 关于关注网络经济的必要性\n\n通常情况下，人们倾向于忽视方程式中的“经济”部分，因为通常，那些站出来并主动推动技术项目的人，怎么说呢，都是技术人员。他们从创建技术解决方案的角度来考虑解决办法。在项目之初获得业务团队的支持将增加成功的机会。HFS\
  \ Research 的报告指出：“百分之七十五的受访者今天将区块链视为战略优先事项，但超过 90% 的区块链计划预算源自 IT 预算。只有 7% 的业务部门主管为区块链计划分配了预算，这让我们对他们的整体投入产生了怀疑。”33\
  \ Tony 在与 Synaptic Health Alliance 的工作中也呼应了这一观察：“如果当时有经济学家或业务人员加入并说：‘好的，我们正在创建一个市场。’那就太棒了。技术需求应该是基于市场化构想来驱动的。”这将推动关于区块链解决方案经济性的讨论。\n\
  \n假设一个区块链项目的重点更多在技术方面，而非经济激励。在这种情况下，存在错失大局的风险。“区块链支持的去中心化网络的很大力量源于，它们具有利用经济激励来吸引参与者的潜力。”34\
  \ 在业务网络价值链的每一个部分，参与者都可以从区块链项目中获得经济价值。然而，区块链网络带来的带来的所有改进，对于价值链上游的参与者来说可能并不显而易见。关注所有参与者的价值并将其重点化以获得适当的可见性是至关重要的。\n\
  在像 Vinturas 这样的供应链联盟中（这是一个整车物流（FVL）行业物流服务供应商（LSP）的联盟），参与者期望随着整个供应链更多公司加入网络并代表所有类型的利益相关者，获得更多的收益。\n\
  \n“因此，区块链技术实现了协作，并为生态系统中的所有利益相关者创造了价值……在这个世界上，我们越来越担心大型组织、巨头、中间人夺走你的数据并从中盈利。我们在\
  \ Vinturas 的立场是，如果我们在一个基于区块链的网络中共同协作，我们都将受益。”35 我们都将受益；Vinturas 的首席执行官 Jon Kuiper\
  \ 是这样解释的。这正是区块链的意义。但要让每个人都受益，你必须清楚每个人将如何受益，并建立好让大家受益的机制。\n\n\nFVL 行业涵盖了从工厂将新消费级车辆运到经销商处的所有活动。由于我们谈论的是车辆，其运输比比我们可能熟悉的日常消费包裹需要更专业的活动。需要专门的运输、能够处理这些交付的熟练司机、专门的存储、交付前检查等。由于运输和处理的性质，存在极高的损坏风险。在\
  \ FVL 行业中，由于当今供应链的全球性质，增加了复杂性。\n\n在 FVL 中，LSP 是重要的参与者，是管理车辆存储、分销和运输的实体。为了让车辆从生产设施到达经销商，设备制造商（OEM）即生产车辆的公司与各种\
  \ LSP 之间发生了多次交接。这些 LSP 和 OEM 之间没有使用标准化的数据交换。此外，所有支持交接的过程都是基于纸质的。这种情况导致了供应链的不透明。\n\
  \n经销商知道车辆何时生产，但不知道它何时到达经销商处供客户使用。这种可见性的缺失导致了交付给客户的最后一公里流程规划糟糕。习惯了在其他在线零售商那里获得更好体验的消费者，相比之下感到大失所望。\n\
  \n在这样一个充满此类低效率的情况下，LSP 降低服务价格唯一的方法就是压缩利润率。在利润率面临压力且重点都在削减成本的情况下，公司无法投资升级流程和工具。供应链控制塔是该行业的倡议之一；在这里，更显眼的玩家试图通过整合较小玩家的合同来优化经济。这种方法最终会导致过程中引入更多的结构性低效率。供应链控制塔最终作为中间人运营，为整个基础设施增加了成本。价值链中引入中间人也对物流服务供应商产生了边缘化的威胁。\n\
  \n凭借在供应链方面的丰富经验，Jon 感谢区块链技术为解决 FVL 行业挑战可能带来的价值。正如他所解释的，“许多行业一样，协作是世界上的一个新主题，特别是与区块链技术相关的。区块链是一种极好的协作技术，协作创造了额外价值。同时，公平地说，在\
  \ Vinturas 共同工作的公司在地面和操作层面是竞争对手。因此，这需要一种心态，即如果我们共同以安全公平的方式使世界数字化，我们将共同拥有的价值。”36\
  \ 与专注于削成本相比，协作使创造价值成为可能。\n\nVinturas 相信正确的技术可以帮助解决汽车供应链的低效率问题。他们建立了基于区块链的数字协作基础设施，以造整个生态系统。“我们——我所说的‘我们’指的是欧洲的一些物流服务供应商——说：‘好吧，我们需要主动创建这种数字基础设施，这种协作基础设施，让我们所有人都受益，不仅是作为物流服务供应商……还包括生态系统中的其他利益相关者，’，Jon\
  \ 解释道。”37\n\n\n\n\n与 Vinturas 一样，首先你应该决定为了正确的理由使用区块链技术，即创造价值。之后，你还必须定义如何为各种参与者产生价值。重点应该放在为整个价值链中的所有参与者提供的价值上。价值可以表现为为参与者节省的成本，也可能来自开启此前无法实现的新收入生成方式。记住，不同的利益相关者将以不同的可能方式获得价值。Vinturas\
  \ 通过考虑所有参与者（包括价值链上游的参与者，如 OEM）所需的激励，为自己的成功奠定了基础。因此，网络的业务架构从项目初期就需要被强调。\n\nVinturas\
  \ 从欧洲的三家公司开始，随着时间的推移，又增加了三位想要合作的股东。Vinturas 现在代表了欧洲新车移动市场约 25% 的份额。对于 Vinturas 而言，重点在于为\
  \ FVL 公司以及价值链中的所有其他参与者（包括 `OEMs` 和理赔处理人员）提供关键效率。集体使用一套标准化的数据集可以显示端到端供应链的状态。通过这一点，生态系统可以摆脱共同的敌人，即流程中充斥的所有文书工作。远离纸质流程将对优化成本结构产生巨大帮助。\n\
  \n\n\n通常，一个新的区块链计划将从小的一组初始创始伙伴开始。希望该联盟最终会不断扩大，并为所有参与者提供不断增长的价值。随着业务区块链网络经历其生命周期并成熟，关注不同的价值创造杠杆将有所帮助。我们可以使用区块链网络成熟度模型来帮助在网络增长期间观察这些杠杆。识别在网络生命周期的不同阶段哪种杠杆将提供更多价值是至关重要的。\n\
  \n\n当你开始时，可以先分阶段地构建网络经济，以处理双边用例。首先处理双边用例将使参与者尽早获得价值。这些用例并不一定依赖于大量参与者的采用才能提供价值；例如，使用\
  \ `smart contracts`（智能合约）来实现对仓库收到的货物进行自动支付付款的用例。在非区块链世界中，各种环境中存在的摩擦之一就是监控和执行合同有多大的挑战性。仅仅因为你与另一方有合同，并保证对方或实体会履行他们说过的要做的事情。区块链中\
  \ `smart contracts` 的承诺之一是，只要满足合同条件，合同就会自动执行。拥有 `smart contract` 通过增加双方对业务关系承诺的信誉度来增加价值。它消除了交易对手风险。\n\
  \n\n这一层价值创造指的是网络效应。当你汇集各种参与者时，网络效应就会发挥作用。由于其他人现在参与了进来，他们的价值增加了。然后，你可以扩展网络正在处理的用例。现在，随着小组的成熟和增长，你可以包含将从多边交易中获益的用例。在\
  \ `Synaptic Health Alliance` 的案例中，多个保险支付方聚集在一起共享数据集。在这里，如果有更多参与者加入数据池，网络的价值就会更高。随着小组成熟，参与者数量的增长更有可能发生。\n\
  \n\n改进的服务是通过获取他人贡献的数据、对其进行分析并提出解决方案解决方案而。在 `Siam Central Bank` 的案例中，银行可以因为风险降低而降低贷款成本。正如\
  \ `Orapong` 为 `SCB` 解释的那样，过去，由于发票审批需要三周，银行在提供融资之前必须等待很长时间。现在银行多出三周时间为供应商提供发票融资，因为发票审批时间已缩短到一天。在发展中国家，银行还面临额外风险，因为供应商可能使用同一张发票向多家银行申请发票融资。银行需要对资金进行定价以补偿这种风险。但有了这个平台，`SCB`\
  \ 是支付银行也是融资银行。银行从 `PO` 发出到货物发货并开具发票的时刻可以看到这笔交易。因此他们知道发票是真实的，没有任何催收风险：“这样，你不是以 18%\
  \ 的利率提供融资，而是以低于 5% 的利率提供。”[38 这种这种情况使他们能够基于区块链的解决方案，利用相同的数据提供改进的服务。\n\n\n接下来，看看你可以如何利用已经为某个用例启动的联盟来启动另一个用例。在考虑构建新用例时，你应该首先查看已经贡献的数据。基于此，决定下一个启动的用例。不建议从一个需要全新的数据集和新加入参与者的用例开始。尝试在上一个用例的成功基础上构建它。\n\
  \n区块链网络成熟度模型并不是说价值创造将总是线性的。取决于团队的雄心程度，你可以选择任何杠杆来处理价值创造。然而，理解你正在使用哪种杠杆并将其与网络的成熟度相匹配将增加成功的机会。\n\
  \n总而言之，区块链可以为试图用它解决共同挑战的群体带来巨大的经济价值。\n\n\n\n\n“我进去说：‘是的，我们有了一些新东西。它非常有前景。但我们完全不知道能从中获得什么，’\
  \ . . . 我开始时给他们看了一张照片。那是一张欺骗眼睛的图片。如果你从一个角度看，它像是一只鸟；如果你从另一个角度看，它像是一只兔子。所以我我在那个时候告诉他们，我不知道我卖给你们的是一只鸟还是一只兔子。如果是鸟，它会飞起来；如果是兔子，它会挖洞，然后你们再也见不到它了。”39\n\
  \n正如我们在第 2 章看到的，Orapong 深参与了苏业银行（SCB）的区块链工作。在对话开始时，Orapong 以这种方式向泰国中央银行（Siam Central\
  \ Bank）的合作伙伴介绍了他们的区块链项目。在对对区块链项目的投资做出决策时，公司高层领导发现自己正处于同样的十字路口。即使团队已经做了尽职调查，并识别了所有项目参与者的价值，问题仍然是：这是否值得投入成本？\n\
  \n投资回报率（ROI）直接衡量了特定投资相对于其成本的净收益。回报是我们预期区块链项目能提供的业务价值的量化。成本是 ROI 计算的另一个方面。然而，这种基础的\
  \ ROI 计算忽略了时间对区块链项目投资的影响。在将区块链项目与公司领导层可以获得的新兴技术领域的其他竞争投资选择进行比较时，时间会影响决策。\n\n\n在对区块链项目做出早期决策时，时间因素至关重要。各种因素会起作用，可能导致区块链项目需要更多时间才能产生回报。区块链项目伴随着变化。人们天性地抵制变化。因此，需要长远眼光和大量的耐心，给人们时间适应新的常态。由于涉及多个利益相关者，让许多组织达成共识并以合作的新工作方式向前推进，对于区块链项目来说是困难的。达成共识作为前进的道路也需要时间上的投入。\n\
  \n区块链价值的核心部分归功于网络经济学。为了利用网络效应而建立的业务通常需要多年时间才能实现盈利。“如果非要我给一条建议，那就是真正理解区块链和区块链网络为你的项目带来了什么价值，并对此非常精确。然后保持耐心。我们现在看到的网络业务、社交网络是花了多年才建立的，对吧？它们的价值真正来自于让，你知道，全球三分之二的人加入\
  \ Facebook 或你想讨论的任何其他平台。所以基于区块链的网络价值也将是类似的，”Stephanie Hurder 说道，我们在第 2 章中遇到过她。40\n\
  \n我们周围有很多种经营多年后才实现盈利的网络业务案例。Facebook 是一个例子，Twitter 也是如此。41 对于任何依赖网络效应的产或服务，创始成员赚大钱将是好几年后的事情。短期内看\
  \ `ROI` 数值作为决定是否追求区块链项目的衡量标准是不正确的。在投资者的审查面前，科技公司的高级领导可以采取这种长远眼光吗？\n\n\n“像区块链和分布式账本之类东西——它们需要临界规模才能实现益处。让足够的人接受教育，让足够的人完成\
  \ POC（概念验证）之旅，让足够的人通过他们的投资委员会并到达最后，还有额外的资金用于商业化，这花费了更多的时间，因为你需要那种网络效应才能成功，”Andrew\
  \ Speers 说道。42 Andrew 曾担任苏格兰皇家银行（`RBS`）的产品与创新总监。`RBS` 是一家国际银行和金融服务公司。他们与其他行业参与者合作，各种区块链倡议：首先是\
  \ `Coadjute`，致力于简化英国房地产市场；其次是 `Marco Polo`，一个由银行、技术合作伙伴和公司组成的金融网络，致力于贸易融资的透明化；第三是\
  \ `Contour`（原名 `Voltron`），致力于贸易金融行业，从信用证开始。由于通过在 `RBS` 参与区块链项目，Andrew 对推动区块链项目所需的努力有了深入的洞察力。\n\
  \n通过与多个区块链项目合作，`RBS` 意识到许多因素会增加 `ROI` 计算中的成本。除了留时间让网络效应发挥作用，你还必须对学习技术进行早期投入。对于像\
  \ `RBS` 这样的大型，如果任何银行的业务客户有多产品需求，他们的体验通常是非常碎片化的。这为什么不会那样呢？用户的旅程并不一定影响产品设计。在银行中，产品创建通常围绕银行内部特定专业领域的孤岛展开。在获得复杂需求的服务时，企业客户必须经过各种孤岛部门，如业务发起部门、信誉评估、外汇、贸易融资、保险、风险等。通过所有这些孤岛最终为客户创造了非常脱节的体验。\n\
  \n用户体验脱节的一个原因是大型金融机构如何收购其他拥有自己系统和流程的小型公司。有时，收购方的的回可能是可能是将被收购公司作为独立组织保留，继续使用自己的系统，而这些系统是需要整合的。这种方法进一步导致了导致糟糕体验的内部碎片化。\n\
  \n为了应对这些以及影响用户体验的挑战，`RBS` 很早就发现了区块链的机遇。正如 Andrew 所说：“技术——分布式账本技术现在到了一个成熟点，可以帮助人们将这些融合在一起。技术正在跟上。我们可以通过具有可识别数据的分布式架构来创建以客户为中心的体验，这些数据可以无缝地缝合到定制方案中。因此，你可以将外汇稍微连接到信誉评估，再连接到贸易融资等。一旦你的数据进入分布式机器，智能合约就可以将数据发送到它需要去的地方并自动交易，或者比现在更自动，从而改善用户体验。”43\n\
  \n对于区块链，在早期 `RBS` 就让一些才华横溢的工程师团队审视了这项技术。工程师测试、玩耍并习惯了这项技术。当明显有足够的用例时，他们建立了一个以区块链为核心的卓越实践社区。\n\
  \n当公司处于区块链之旅的起点时，组织对新兴技术商业化的理解是有限的。通过一个专注于区块链技术的集中职能来运行，有助于评估大量的用例列表。建立 `COE` 的投入是一项预付成本，构成了\
  \ `ROI` 计算中的分母。正如 Andrew 确认 `RBS` 的选择一样，“任何机构都需要准备好在新事物出现时烧一点钱，去测试它，玩玩它。我们在图片中非常早期就这样做了。”44\n\
  \n\n\n\n\n\n由于区块链仍处于非常早期阶段，因此需要证明新技术的益处。与现有技术进行比较和对比也有助于决策。分阶段迁移生产系统可以有助于实现这一目标。当新的区块链解决方案与现有解决方案并行运行时，它会增加成本。这种双重性从长远来看是有益的，因为它在管理风险的同时也建立了了对技术的信心。由于你实际上在并行运行两个系统，这在短期内确实会产生更高的成本。这为我们对投资回报率（ROI）保持长期展望提供了更多理由。一旦我们在新旧方案之间选出胜者，我们就可以开始看到通过区块链实现预期目标的收益。\n\
  \nDustin Helland 证实了这一过程“需要新解决方案与任何遗留解决方案进行对比，并证明自己的价值。为了做到这一点，最初确实需要一些额外的投资和支出。”[45]\
  \ Dustin Helland 自 2016 年以来一直是 State Farm（州州保险）推动区块链战略的领导团队成员。\n\n\n代位（Subrogation）在日常语言中并不是一个常用词，我不得不稍微深入研究才能理解它的含义。假设你的车被追尾了，对方司机有错。你会开始申请保险理赔。这时，代位流程就开始介入了。在收到保险理赔的背景下，“代位”是指你的保险公司从过错方或其保险公司收回资金的过程。\n\
  \n美国汽车保险行业每天处理大量的理赔代位付款。代位是一个高度人工化的过程，依赖于邮寄和纸质支票。通过区块链，他们建立了一个可以电子化维护每笔交易账目的系统。然后，它根据所有这些交易计算出一个净清单。将该净清单传递给组织现有的电子支付系统以实现电子支付。这种向基于区块链解决方案的迁移缩短了处理时间并提高了效率，帮助\
  \ State Farm 将收益传递给其保单持。\n\nState Farm 明白，区块链解决方案需要与现有解决方案并行运行，以对比新旧方案。同时，这意味着成本的增加，因为你实际上在运行两个系统。\n\
  \n\n正如我们在本章早期讨论的那样，企业中的区块链是一种依赖网络经济的技术。你无法单靠区块链获得成功。除了需要给网络时间成熟外，公司在旅程之初并不知道网络将增长多大。希望是行业中的每个利益相关者都能加入。这最终可能会发生。但在开始，你并不知道达到那个最终状态需要多久。网络的成功取决于许多未知变量。鉴于这种情况，你必须根据对网络规模的假设进行预测。这些假设为\
  \ ROI 预测带来了不确定性。\n\nROI 的量化具有挑战性，因为区块链仍然相对较。你不能依靠许多现有的案例作为指导。你无法依靠任何真实的先例。区块链在 2009\
  \ 年通过中本聪明的关于比特币的白皮书引入世界。那只是十多年前的事了。他们作为“区块链”的包装是近期的，尽管构成区块链的各种概念已经存在了几年。更重要的是，利用区块链解决公司面临的问题甚至更加近期。`Hyperledger`\
  \ 和 `Ethereum` 在 2015 年引入，并增加了智能合约层。这一增加使得区块链对公司来说更具可行性。对于如此年轻的技术，你没有太多可以借鉴的灵感。关于如何有效地使用它没有指导。也缺乏对所证明价值的量化。\n\
  \n另一方面，由于技术的新颖以及背后没有大量的工作支撑，区块链知识是稀缺的。随着这个新兴领域的新发展，它演变得非常快。区块链技术瞬息万变的格局寻找寻找相关区块链知识的人变得困难且昂贵。技术将随着时间的推移而成熟，目前的限制最终会被解决。与此同时，你应该考虑这项技术的演变，并为更高的成本做好准备。\n\
  \n解决相同问题的其他可比较方案包括建立手动流程。使用现有技术可以帮助快速且粗略地完成这些任务。这些选项的存在使得领导层很难在短期内证明新兴技术业务案例的合理性。请记住，使用现有技术可以更快达到目标，但你放弃了播种种子以将区块链建立为你公司的赋能技术并获得其优势。在更长的生命周期内，如果你将通过采用区块链技术实现的自动化纳入考虑，你的成本将会降低。\n\
  \n\n与竞争对手合作对企业来说是全新的未开发领域。你可能从聚集所有人围绕一个用例开始旅程。但正如我们在第 3 章看到的，根据区块链网络成熟模型，随着网络增长，新的用例将根据小组的成熟程度不断演变。事实上，联盟可以利用多个用例。所有用例并不一定从一开始就是可见的。当你考虑\
  \ ROI 时，如果你能证明一个用例的回报显示出很好的成本效益，你就应该考虑继续进行。最终，在启动用例之外出现的新用例将增加 ROI 的收益部分，尽管你现在无法对其进行量化。\n\
  \n寻找早期进展有助于 ROI 局面。关注早期用户如何从他们的参与和投资中获得价值是有帮助的。你应该更多地考虑增量收益。最终，随着网络增长，预计会有更高的回报出现。\n\
  \n在设计系统时，你查看用例并确定，当许多行业利益相关者参与多边交易时，提供丰富的功能集是合理的。然而，假设实际价值在许多玩家加入后才产生。在这种情况下，你将会有很长一段时间，在等待所有人加入期间，网络不会产生多少价值。虽然在网络成熟后你有宏大的目标，但你应该将其与早期的快速胜利取得平衡，以鼓励更多参与者在长期内采用。\n\
  \n\n\n\n\n正如 Dustin Helland 所说：“当你考虑不同类型的用例时，并观察一个组织能多快开始获得某种程度的价值，有些用例你可以通过较小的网络就开始获得某种程度的价值\
  \ . . . 如果你的用例针对的是企业对企业（B2B）交易效率——虽然你需要更大的群体参与才能真正获得显著价值——但你可以通过较小的网络从一开始就获得一些价值。”[46]\n\
  \nState Farm 方面，他们将项目分为几个阶段来推进。通过每个阶段，他们都为投资回报率（ROI）预测获取了额外的见解。第一阶段是原型，在阶段结束时进行评估。第二阶段是影子网络阶段，他们在生产环境中并行于现有流程实施了系统。这种双重实施证明了解决方案的可行性，并验证了预期的业务流程效率。“因此，我们在开发和重新审视实际业务案例\
  \ ROI 方面采用了迭代方法，”Dustin 解释道。[47] 区块链网络成熟曲线（见第 3 章）是观察可能进展以及在考虑增量 ROI 时决定目标用例类型的一种方法。\n\
  \n如果能从长期角度整体看待区块链技术的优势，将是最好的。否则，你将错过区块链在与其他公司共同构建分布式解决方案、获得成本协同以及开启新收入机会方面带来的内在益处。用\
  \ Dustin Helland 的话总结道：“有时你愿意为了未来的回报进行预投资，而时间是一个风险因素。但也许终点有一个更大的机会，你愿意为此投入并承担承担风险。”[48]\n\
  \n***\n\n[39] Thien-Ngern et al., “From Siam Commercial Bank.”\n[40] Hurder, “Why\
  \ Enterprise Blockchains Fail.”\n[41] Thompson, “Facebook Turns a Profit”; Kollewe,\
  \ “Twitter Makes First Quarterly Profit in Its History.”\n[42] Speers, “User Experience\
  \ on the Blockchain.”\n[43] Ibid.\n[44] Ibid.\n[45] Helland, “State Farm’s Blockchain.”\n\
  [46] Ibid.\n[47] Ibid.\n[48] Ibid.\n\n46 41 44 39 47 42 45 40\n\nThien-Ngern et\
  \ al., “From Siam Commercial Bank.”\nThompson, “Facebook Turns a Profit”; Kollewe,\
  \ “Twitter Makes First Quarterly Profit in Its History.”\nHurder, “Why Enterprise\
  \ Blockchains Fail.”\nIbid.\nSpeers, “User Experience on the Blockchain.”\nHelland,\
  \ “State Farm’s Blockchain.”\nIbid.\nIbid.\nIbid.\nIbid.\n48 43\n\n\n\n韦伯词词典（Merriam-Webster）在线版对联盟（consortium）有如下定义：“一项协议、组合或群体（如公司群体），为了承担一项超越任何单一成员资源范围的业务而形成。”我们在这里关注的一个方面是“公司群体”。[49]\
  \ 很多时候，这些公司群体将包含同一市场中的竞争参与者。我们关注的第二个方面是“超越任何单一成员的资源”。\n\n由于目前的商业世界主要并非如此运营，这种竞合（coopetition）状态可能很难建立。然而，它是值得追求的，因为公司可以获得独立时无法实现的回。在追求过程中，寻求使用区块链技术的公司以某种形式的联盟聚集，共同构建解决方案。正如德勤（Deloitte）2019\
  \ 年全球区块链调查发现的，公司考虑加入联盟有多种原因。[50]\n\n当公司开始研究并尝试区块链时，他们会进入试图如何以有组织的方式与其他参与者最好合作的阶段。正如我们在第\
  \ 2 章所看到的，Optum 技术从学习区块链技术开始。他们评估了区块链对其业务的影响，决定了要追求的用例，并开始寻求与其他感兴趣合作的保险公司建立关系。其想法是寻找几家愿意参与实验并从尝试区块链解决用例中受益的国家保险公司。\n\
  \n本章将探讨区块链联盟。\n\n参加各种区块链医疗会议让 Optum 团队与 `Humana`、`Multiplan`、`Aetna` 等其他保险公司建立了这些关系。这些努力为联盟对话铺平了道路。在高级别，联盟的创始人签署了一份谅解备录，开始使用该用例来提高提供者数据的准确性。每个实体都必须向上领导链进行谈判，`Synaptic\
  \ Health Alliance` 作为一个联盟诞生了。\n\n\n这是 `Synaptic Health Alliance` 采取的路线。然而，随着公司尝试如何与竞争对手最好合作，不同形式的联盟应运而生。观察区块链领域发展联盟趋势的一个框架是看可用于整合生态系统的领导力。联盟管理员（consortium\
  \ steward）在定义业务伙伴的工作关系方面提供领导，帮助推动区块链解决方案从概念到开发再到行业采用。构建这些联盟有两种新兴模式。第一是创始人领导的联盟，其中联盟管理员是行业生态系统中的公司之一。第二种是由独立实体作为联盟管理员提供领导力。\n\
  \n\n创始人领导的联盟通常涉及一个行业领导者在采用区块链技术方面提供早期领导。通常，创始人充当业务网络的管理员，负责提供技术和组织领导力，并带领其业务伙伴共同完成一个用例。有时，主导行业参与者会担任这一角色。其他时候，一群公司聚集在一起约定并解决共同的业务问题。尽管如此，小组中的某一个成员最终将作为网络管理员担任领导。然而，他们其中一人确实在构建联盟方面为小组提供领导力。\n\
  \n\n\n\n\n\n这种联盟团结构通常从较少数参与者开始，这有助于更好地管理竞争者需要适应“共同共同目标工作”新范式的政治问题。区块链网络的维护者必须将技术、经济和政治视为联盟团的不同维度来处理。初始成员人数较少有助于避免政治关系变得过于复杂。如果决策速度是该联盟团成功的重要因素，那么拥有的联盟团维护者将有助于以较快的速度推进事务。如果其他联盟团伙伴对解决方案有相似的想法，将有助于更快做出决策。\n\
  \n虽然较少的联盟团成员有助于更快做出决策，但仍然需要足够的数量来形成一个最小可行的生态系统。毕竟，网络效应影响着联盟团成功的概率。你无法通过规模较小的行业参与者启动一个能够提供价值的真正优秀的区块链用例，因为它可能没有足够的分量。这是一个微妙的平衡——既要保持人数少以便于管理，又要保持足够的人数以产生实质性结果并吸引其他行业参与者。\n\
  \n另一方面，这种结构可能会给联盟团的新成员带来摩擦。他们可能担心初始成员会获益更多，且规则对他们不利。这可能给新入者一个犹豫的理由，从而为采纳带来阻，并阻碍联盟团的增长。\n\
  \n这种联盟团的一个例子是以食品安全为中心的零售行业。沃尔玛深度参与了这项倡议。沃尔玛是最大的零售商之一，也是首批试点区块链技术的企业。沃尔玛食品安全副总裁法兰克·亚纳（Frank\
  \ Yiannas）已经意识到区块链技术的变革可能性。正如他所解释的：“我恰深信区块链是一项新兴技术，对食品具有极大的相关性。但我必须告诉你，当我开始接触这个领域时，我是一个主要的区块链怀疑论者。但在与其合作之后，更重要的是进行试点之后，我确实变成了一个区块链的信徒。”51\n\
  \n美国疾病控制与预防中心（CDC）和美国农业部（USDA）的数据记录了食品供应链污染的影响。CDC 估计，每年有六分之一的美国人因受污染的食品或饮料生病，导致三千人死亡。USDA\
  \ 估计，食品源性疾病每年造成的损失超过 156 亿美元。52\n\n随着技术的进步，食品供应链已经发展了很多。然而，它也面临着确保整个系统食品安全的挑战。食品污染事件对生态系统中的公司产生广泛影响，从生产者到零售商都是如此。它还会负面影响消费者的信心。消费者最终可能因为担心健康危害而停止购买某些食品产品。即使某批次出现问题，零售商也必须从货架上撤下整个货物，因为追踪和识别问题源头需要很长时间。他们倾向于在安全方面留余。\n\
  \n由于各种原因，源头追溯是困难且耗时的。没有人对整个供应链中货物移动的数据拥有完全视角。通常，供应链中的每个参与者只了解他们与供应商的上游交易以及与客户的下游交易。一个完整的蓝图需要一个接一个部分地拼凑。将它们缝合在一起也不容易，因为大部分记录维护并未标准化。此外还广泛使用纸质文件，这意味着追溯必须手动进行，耗时比使用数字记录要得多。因为记录是手工维护（写在纸上）的，因此由于用户操作错误导致数据错误的概率更高。需要对这些错误进行对账以获得准确的状况。许多食品涉及来自不同国家的多个来源的混合，使追溯变得更加复杂。\n\
  \n通过早期采用区块链，沃尔玛已经获得了一些早期收益。沃尔玛专注于食品安全，利用区块链技术帮助他们更好地管理供应链。他们决定针对两个用例进行试点——中国的猪肉和美国的芒果。这些试点帮助沃尔玛缩短了追踪物品源头的时间，并允许零售商通过供应链获得更佳的关联数据可用性，从而提高食品安全并减少浪费。在他们在中国猪肉供应链的区块链试点中，他们将追溯肉类来源的时间从\
  \ 26 小时缩短到了几秒钟。对于芒果的试点，正如法兰克·亚纳确认的那样：“我们尝试追溯芒果，将切片芒果追溯到源。目前的流程我们需要大约七天时间，你知道的，这几乎是行业基准。也许比在某些健康调查中发生的情况要快一点点。在引入区块链后，我们可以在\
  \ 2.2 秒内完成追溯。”53\n\n食品安全是一个非常适合区块链技术的领域。食品安全生态系统中的参与者有动力合作，利用区块链技术来解决问题。从本质上说，生态系统非常适合区块链能带来的价值。因为食品安全不是一个竞争性问题，整个生态系统中的参与者都有合作的动力。当食品安全问题发生时——没有人会赢。假设为了消费者安全，新鲜蔬菜发生了大肠杆菌爆发。在这种情况下，所有难以追踪的菠菜都会从货架上撤下。这种无法快速追踪源也损害了那些供应链没有携带污染产品的公司。这激励了行业参与者合作并使解决方案生效。此外，整个系统太大，任何单一参与者都无法独立解决，因此与竞争对手合作是合理的。\n\
  \n\n一家初创公司或独立软件供应商（ISV）在一个中立第三方主导的联盟中开发区块链解决方案，以解决行业内的共同问题。这家独立公司协调联盟的运作，并管理运营和治理结构，以吸引生态系统的参与者加入网络。该中立第三方在构建解决方案方面提供领导作用，从产品的最初构想开始，到开发，最后是实施和支持。\n\
  \n\n\n\n在这种场景下，由于没有一家公司主导工作，其他合作伙伴对于在某个“大哥”的施压下工作的恐惧较少。这使得招募新成员来扩大网络变得更加容易。因为这是一个中立的环境，竞争对手开始合作也相对更加直接。这种中立环境有助于减少采用过程中的任何阻力。\n\
  \n\n正如 Coadjute 首席官 Dan Salmons 向我解释的那样，“在我们看来，答案是创建一个能够提供解决方案的公司，而不是等待方案达成一致。”Coadjute\
  \ 的使命是通过整合行业内各种不同的参与者，数字化地连接英国的房产市场：房地产中介、过户律师、测量师、贷款经纪人、贷款银行等。最终目标是改善客户的购房体验。\n\
  \n“我在这里遇到了一个不知道解决方案的问题，”Dan 解释道，“我当时正在寻找；在一个非常碎片化的房地产市场中，到底如何给客户提供全面的端到端体验？”购房过程非常复杂，因为买家需要与多家企业打交道。想想你买房时需要采取的所有步骤。首先，你找到一个房地产中介并开始看房。\n\
  \n同时，你还需要弄清楚自己买得起什么样的房子。银行给你多大的贷款？你与银行合作进行审批。然后，在某个时间，你需要一名房屋检查师帮助你理解你面对的情况。你与抵押贷款经纪人合作寻找适合你的贷款。在贷款关闭前，评估师会来提供帮助。你可能并不清楚在这个漫长的过程中，每一个为你提供服务的实体具体在做什么，但会产生相关的费用。\n\
  \n你在买房过程中与之交互的每个实体都是某个垂直子行业的一部分，即房地产中介、银行、房屋检查师、抵押贷款经纪人、评估师等。“这些垂直领域中的每一个——国家机构已经在一些很棒的平台上数字化……过户业务已经数字化，如果你想做的话，法律部分在一些很棒的平台上也有数字化。经纪已经数字化。抵押贷款正在数字化。测量也正在数字化。但整体而言，当你经历这个过程时，你必须将这一切缝织在一起，”Coadjute\
  \ 创始人 John Reynolds 解释道。\n\n单个环节运作良好，但端到端的价值链是碎片化的。消费者来说，完成整个过程非常困难。买家在跨越不同垂直领域的这一过程中，必须将所有环节缝合在一起。这种情况导致了更长的购房时间，可能长达四五个月，成本增加到房产价值的\
  \ 4%。John 继续解释道：“如果我想买你的房子，而你的名字在土地登记簿上拥有这间房子，实际上我们所要做的只是把名字改成我的，并向你的账户里转一笔钱。但要做到这一点，我们需要经过像这六家公司和所有这些事情。”买房是人生中的一个转折点。但购房过程往往会带来压力和挫败感。\n\
  \n对于 Coadjute 来说，这一切始于一个研究项目。观察不同的英国政府机构，你不能期望他们关闭系统并迁移到一个单一的政府平台。他们能创建一个分布式账本来保持他们的数据库同步吗？当英国土地注册部门发布招标时，他们接受了它。他们建立了一个\
  \ POC（概念验证）来测试整个购房过程的共享账本概念——从有人开始挂牌出售直到有人搬入住。他们为价值链中的每个不同参与者创建了节点。当他们邀请公司进行测试时，收到了压倒性的响应。\n\
  \n在二十二个国家建立了五十个节点，创建了虚拟房屋并围绕它们完成了交易。POC 证明了这种解决方案在减少整个购房过程中的重复、成本和摩擦方面将发挥巨大作用。\n\
  \n但从 POC 到生产环境的跨是非常巨大的，因为这涉及到采用问题。POC 显示该解决方案在技术上是行得通的，但行业参与者愿意采用它吗？所以，下一个问题是如何成功进入生产阶段。团队意识到，行业参与者已经有了他们使用的系统，他们来说很难离开这些系统并迁移到新平台。围绕这一挑战的研究诞生了\
  \ Coadjute 将成为这个平台网络的想法。因此，他们去与不同垂直领域的领先平台供应商交流，与他们紧密合作。\n\n通过该小组，他们进入了非生产的 MVP（最小可行性产品）。他们将\
  \ Coadjute 平台连接到这些其他行业领先平台的测试环境，并将其作为移动解决方案提供。在该平台的帮助下，买家可以追踪他们的购房之旅，并在一次简单的在线行程中获得贷款并搬家。通过汇集价值链每个阶段的领先参与者，他们现在可以为消费者创造这种端到端的体验。\n\
  \n在某种程度上，治理对 Coadjute 来说并不复杂。他们的目标不是去中间化或颠覆行业，也没有威胁现有的参与者。他们是在帮助为现有参与者促进端到端的流程。房产市场中的一些参与者非常渴望看到\
  \ Coadjute 的建成。其他一些则感兴趣但又有一点矛盾。承诺的程度不相同。所涉及的公司类型也有很大差异。你既有小型软件公司，也有大公司。这种许多小型参与者的碎片化市场导致人们担心大玩家会试图接管。考虑到所有这些差异，遵循第三方模型似乎非常合适。\n\
  \n正如 Dan 解释道，“我们被市场上所有的参与者视为一个受信任的、独立的、客观第三方。Coadjute 的意思是合作，你会听到我们说我们并不颠覆市场。我们想要支持它。我们竭力成为所有参与公司的好朋友和支持者。”\n\
  \n\n\n\nMerriam-Webster 词典，词条“consortium (n.)”，访问于 2021 年 2 月 15 日。\n\nYiannas，“领先的食品安全”。\n\
  \n疾病控制与预防中心，“CDC 与食品安全”。\n\nYiannas，“领先的食品安全”。\n\n[2]Pawczuk 等人，德勤 2019 年全球区块链调查。\n\
  \n同上。\n\n53\n\nReynolds，“区块链上的房地产”。\n\n50 54 51\n\n\n“与你的竞争对手合作并不总是易的；它需要一种与你可能过去二十、三十或四十年所拥有的截然不同的心态，”Jon\
  \ Kuiper 解释道。56 区块链为安全协作提供了基础设施，让竞争对手可以共同创造价值。将竞争对手汇聚成为成功生态系统的一部分需要一种多管齐下的方法，正如我在\
  \ Lisa Butters 讨论 `GoDirect Trade` 时发现的那样。\n\nGoDirect 是一个针对二手航空领域零部件的亚马逊式市场，它将买家和卖家联系在一起并简化了他们的体验。它是财富富\
  \ 100 强公司霍尼尔（Honeywell）的一部分。在航空领域领域，霍尼尔扮演着多种角色。他们是原始设备制造商 (OEM)，制造从组件到发动机的一切产品。他们还是一家维修设施。他们还参与二手航空零部件的交易。\n\
  \n“在今天早上的电话中，我们谈到了二手航空零部件，以及为什么人们对在线进行此类交易如此迟疑。我们很多讨论了这与二手汽车行业有很多相似之处。所以，购买二手汽车——我认为其中某些观念是，为了买二手车，人们觉得迫切需要对价格进行谈判。这是他们的习惯。他们觉得如果不讨还价，就得不到最优价格。我认为这与二手航空零部件是一个非常好的类比。人们觉得，如果不在这些部件上谈出最优价格，他们就是不负责任的，”`GoDirect\
  \ Trade` 经理 Lisa Butters 解释道。57\n\n别提二手车了——我认为我们所有人在买新车时的心态都是一样的——都做好了谈判的准备。\n\n\
  根据 ICF 的数据，去年二手飞机零部件市场价值为 54 亿美元，其中 60% 与发动机相关，36% 与组件相关。预计市场规模到 2026 年将增长到 77 亿美元。58\
  \ 该行业大多数交易仍在线下进行，通过传统的途径：打电话给你认识的人或给他们发邮件。你只和你认识并信任的人合作。因此，一笔交易需要很长时间才能完成。\n\n正如《华尔街日报》的一篇文章报道的，“在区块链之前，一笔交易平均需要两次电话和四封邮件来安排，并花两天时间完成。发动机等大型部件的销售可能需要数周时间来发送报价和交换文件.”59\n\
  \n购买过程是手动操作且主要在线下进行的，主要出于两个原因：\n\n*   首先，由于市场所交易的部件性质，这些通常是高价值交易。虽然有像螺母和螺栓这样的小物品，但也有价值数百万的发动机以及其之间的任何产品。平均交易额约为\
  \ 10,000 美元。\n*   另一个原因是航空行业有极高的安全门槛。这些部件必须足够安全，才能重新安装在飞机上，从而安全地运载乘客。\n\n其他尝试缩短购买周期的参与者也遇到了一些问题。为了在过程中加强买家信任，这些参与者试图从卖家那里获得质量证明；尽管如此，他们在执行这些规定方面的意愿还不足。无法为买家提供有关购买部件质量的持续透明度，使得这些市场很容易失败。卖家对平台的采用也面临阻力。他们不习惯拥有在线商店来开展业务。毕竟，他们多年来一直通过电子邮件和电话销售。\n\
  \n当平台上线时，`GoDirect Trade` 团队知道在线交易不会一夜之间就发生。他们开始调查需要什么才能鼓励买家和卖家搬到平台并摒弃旧习惯。他们开始通过打电话和发邮件来了解市场动态。他们意识到，要让人们参与电子商务，良好的客户体验以及“三个\
  \ P”（价格、图片和纸质）仅仅是入场券。要帮助整个行业摆脱过时的纸质和离线交易，需要的远不止于此。由于交易金额巨大，人们对信任存在抵触情绪。航空行业的高标准也从质量角度为信任过程增了更多摩擦。\n\
  \n正如 Lisa 所解释的那样，“我们认为这底归结为信任。这种电子商务交易缺乏足够的信任，因为平均订单金额很高，而且从质量角度来看必须有很多内在的信任。因此，我们需要考虑其他技术，例如区块链，试图凿掉那块不信任的大石。因为这不仅关乎良好的客户体验，还要通过向消费者提供透明度将这一通道引入数字时代.”60\n\
  \n对于区块链技术尚未普及的航空行业，霍尼尔正专注于与其他参与者合作。正如 Lisa 解释道：“对于霍尼尔来说，我不会说我们正在单打独斗。如果非要说的话，我找不到哪家航空公司比热衷于与其合作——无论是小店还是大企业——来尝试区块链试点。之所以这样做是因为区块链真正是一项团队运动。如果你单打独斗，你什么也得不到。你只能得到自己的数据，没有其他益处，对吧？你还不如拥有一个数据库.”61\n\
  \n\n挑战之一是“事持问题”（Holdup）。假设你和我考虑签订一份商务合同。为了履行我承诺的一方，我必须进行一些我本不会做的投资。例如，我可能需要购买一些新软件、实施它，并调整我的业务流程使其运行。这些被称为关系特定投资。当我已经完成了关系特定投资后，事持问题就会出现。除非我们有利于你的的方式重新谈判合同，否则你可能会拒绝履行你承诺的一方。如果情况不妙，我就在关系特定投资上浪费了资源。\n\
  \n\n\n\n\n区块链环境的好处在于，在数据共享联盟中，我们拥有分布式共识。通过将节点作为验证者，所有公司都拥有自己最新的账本副本。这种设置有助于降低被扣留（hold-up）的风险。我们的目标应该是思考如何能够缓解通常与关系特定性投资涉及的某些风险。例如，当你进入数据共享联盟时，面临的一个大问题是，你担心如果想离开联盟，将无法访问自己的数据。这些数据可能存储在专有格式中，或者根本无法访问。你可能需要联盟的软件才能读取它们。如果你想离开，你将受困于某种数据格式，然后不得不付钱让人将其转换为可使用的格式。\n\
  \n正如我们所理解的，区块链技术的价值源于联盟中业务网络的稳健性。为了服务网络，联盟管家（consortium steward）可以通过缓解新成员的顾虑来提供帮助。首先，区块链是一种可以帮助制造数字信任并实现智能合约的技术。智能合约通过其自动化执行，可以提供所有方对执行协议条款的额外承诺，并减少被扣留风险。62\n\
  \n由于价值源于网络的活力，扩展网络应该是联盟治理结构中的一个活跃议题。联盟管家应该专注于尝试减少这类摩擦。让其他公司参与的一种方法是让他们的进入网络变得更容易、摩擦更小。\n\
  \n在州州保险（State Farm）的案例中，正如斯汀·赫尔兰（Dustin Helland）解释过的：“我们让其他保险公司轻松且以低入门投资参与的方法之一是通过特\
  \ Beta 测试。这涉及我们为其他保险公司提供访问节点的权限，他们可以在那里练习应用程序并与我们一起运行一些测试场景。如果他们愿意，我们还会向他们提供完整的代码副本，他们可以在那里建立自己的节点，并完成同样的测试场景。”63\n\
  \n这些行动让联盟的新成员感到受到欢迎，并让他们在一个良好的基础上开始。\n\n\n需要找到其他愿意参与实验的行业参与者。选择合适的伙伴作为起点对于该努力的最初成功至关重要。将正确的伙伴聚集在一起是联盟旅程的必要起点。在区块链技术的早期，当区块链生态系统中参与的者并不多时，情况甚至更具挑战性。\n\
  \n泰国中央银行（Siam Central Bank）在开始他们的区块链旅程时重视这一因素。正如奥拉蓬（Orapong）解释的那样，“我们在 2017 年底开始做这个。在那时，参与者并不多。所以，我们必须进行评估，因为我们正要做一些非常新且尚未稳定的事情——谁可能是最好的伙伴？谁能支持我们？”64\n\
  \nSCB 理解到他们正在尝试做的事情非常新且不稳定，因为技术本身正在演变。他们开始与泰国水泥板集团（SCG）合作，那是一家制造企业。它是泰国最大的公司之一（价值达\
  \ 150 亿美元）。\n\n“如果你能证明这项技术是有效的，那么你就知道它更高效。它确实更高效。如果你能证明这项技术是有效的，你就知道它更高效，”奥拉蓬证实道。65\n\
  \n\n区块链技术带来了……。它还允许成员拥有共同控制权。治理结构应该使得参与者能够决定。\n\n来自 ABI 的西尔维娅·阿塔纳西奥（Silvia Attanasio，我们将在下一章遇到她）解释道：“我们的使命是让大家一直工作。我们，让……到……到……到……到…………是一起工作。”66\n\
  \n这种方法可能会减慢决策速度。正如德勤（Deloitte）2020 年区块链调查发现的，许多初衷良好的联盟因为摩擦和不公而失败了。667juu22lj.html#mvasvasdryy8)\n\
  \n 货币化的时机\n\n\n保险公司的价值主张是显而易见的，因为保险公司法律上要求维护医生数据。在他们那边，他们正在寻找合作方式，使他们的提供者数据准确，并以更低的维护成本实现。然而，医生们承担着为保险公司填写文件的负担。他们的负担无疑会减少。但是，这足以让他们愿意加入网络吗？这个主张并不足够强大。\n\
  \n正如斯芬妮·赫德（Stephanie Hurder）建议的：“我认为你真的需要理解，不同类型的利益相关者获得了什么成本和收益？他们不参与的外部选择是什么？”[68\n\
  \n为了进一步完善 Synaptic Health 解决方案，如果提供者能够自助服务并贡献数据，对整个生态系统将是有益的。这里的目标是让越来越多的医生加入系统。假设初始的货币化策略要求他们付费加入以为此用例提供数据。在这种情况下，你为整个网络的采纳创造了更多摩擦。相反，通过在后续用例中对医生进行货币化可能会更好地服务网络，因为那个用例对医生来说具有更有吸引力的价值增加。\n\
  \n\n\n\n\n- [56] Kuiper, “区块链上的供应链。”\n- [57] Butters., “区块链上的飞机零件。”\n- [58] Shah.,\
  \ “霍尼韦尔引入区块链。”\n- [59] 同上。\n- [60] Butters, “区块链上的飞机零件。”\n- [61] 同上。\n- [62] Holden\
  \ 等人，“区块链能解决问题吗。”\n- [63] Helland, “State Farm  own 区块链。”\n- [64] Thien-Ngern 等人，“来自泰国商业银行。”\n\
  - [65] 同上。\n- [66] Attanasio, “用于意大利的区块链。”\n- [67] Pawczuk 等人, 德勤 2020 年全球区块链调查\n\
