- "# 解锁区块链：开启你的数字未来\n\n\n\n\n\n\n\n\n\n\n\n*献给 Anubha，她让这一切成为可能*\n\n\n\n想象一下，你想卖假药。你会如何做呢？你可以从制造看起来像品牌药的药片开始，使其具有相同的颜色、形状和标记。由于这是一场造假活动，不需要在实际药品成分上花费大量金钱。你只需要说服买家你的药片没有问题。当然，如果药物没有出现在适当的包装中，买家会认为出了问题。但这个问题很容易解决。只需将你的“品牌”药片包装在与原装匹配的盒子里即可。\n\
  \n现在你已经创建了产品，你需要在不被抓获的情况下将其卖掉。为什么不在世界的某个偏远角落开一家在线药店呢？那里没有有效的药物监管，远离监管机构的触及。随着世界应对一场在全球范围内导致数千死亡的流行病，一个成熟且全新的机会出现了。随着疫苗和其他疗法的开始推出，人们寻找所有可能的途径获取它们是合逻辑的。\n\
  \n现在，假设你的工作是阻止造假者。找到他们将是一项艰巨的任务。你会如何做呢？你可以从从各种市场购买药品样本，对其进行测试以确保它们含有正确的成分，并对不符合要求的药品进行标记。考虑到假药在\
  \ 1.2 万亿美元的市场中占据了 2,000 亿美元，你可能没有时间或资金来抓住大多数坏人。发现有害药物只是解决该问题的一步。你该如何找到它们的源头，以便从根上解决问题呢？\n\
  \n你面前将面临一项艰巨的任务。但也许有更智能的方法。如果你不需要监管所有的在线药店呢？如果你能赋能买家让他们知道自己何时成为欺诈受害者呢？如果你能给他们一个工具来监管自己的购买，并知道何时有人试图向他们卖假药呢？区块链可能为你提供答案，它让你能够确定地验证药片是谁制造的。\n\
  \nFarmaTrust 正在尝试这样做。为了应对医药供应链中的某些挑战，FarmaTrust 引入了基于区块链的解决方案。该解决方案的一个方面关注于药品追踪和数据服务。该解决方案为产品从制造商到消费者的过程提供了急需的可见性。它有助于确保数据不被篡改。\n\
  \n\n开始使用区块链而非现有技术的关键在于：由于数据未被损坏而能够对系统感到放心、多个控制器有助于检测更改数据的尝试、安全的数据存储以及使用信任数据进行自动化。结合所有这些方面使得更高效的运营、降低成本并产生新价值成为可能。\n\
  \n确实存在额外的复杂性，因为从中心化世界转向去中心化世界涉及到转变。我们太习惯于办事的中心化本质，任何不同的事情似乎都是增加了复杂性。区块链格局不断演变因为它因为它项新兴技术。关于它的速度、可扩展性、缺乏标准、不同区块链之间的互操作性以及监管不确定性都存在开放的问题。用户将需要逐渐适应这种去中心化范式的陌生感。转向信任数据的转变不会是一个轻松的过渡。\n\
  \n一旦所有参与者都感到适应，机会将会爆发。一旦他们理解没有人可以更改数据，并且数据可以以这种方式保持安全，区块链的真正潜力就会释放出来。\n\n正如 FarmaTrust\
  \ 的 Najib Rehman 所说：“我们可以与你合作，并向你展示差异。我们想做的是与你现有的技术并行工作。然后，当你看到区块链分布式特性的真实价值时，这意味着你可以信任不可篡改的数据。届时你就会明白为什么在某个时刻你可能想要关闭旧的东西并完全迁移过来。”\n\
  \n《解锁区块链》是对这一转折点的探究。\n\n\n\n\n\n\n我的区块链之旅始于 2019 年的第一季度。随着新一年的到来，我们看到了许多关于各种主题的文章，回顾过去一年的事件。这些文章也表达了作者对来年预期进展的看法。在一个清闲的早晨，一篇文章出现在我的信息流中：“2019\
  \ 年区块链五大预测”。55\n\n当我读完这篇文章时，我的脑海中反复浮现出一个念头，这个念头让我挥之不去。文章强调了非技术问题对区块链项目成功的重要性。业务参与的相关性对于所有技术项目都有效，但在区块链的语境下，为什么要特别提到这一点呢？我一直从业务角度在技术领域工作，而这种对非技术问题的关注引起了我的注意。\n\
  \n\n我漫无目的地地、没有明确目标地开始探索区块链。然后，在一个晴朗的一天，我收到了一条私信。是 Jonathan Blanco 邀请我参加 `TF4`。事实证明，`TF4`\
  \ 是西雅图顶级的区块链会议之一。Jonathan 不需要为我提供 100 美元的折扣来让我参加；会议那个周末就在西雅图举行。有什么损失的呢？\n\n于是，我站在\
  \ `Columbia Towers` 的 36 层，俯瞰着普吉特海的美丽景色，被一百多人环绕，听着演讲者谈论区块链和加密货币。那次活动是我首次接触区块链。会议的定位是针对已经在区块链领域工作的人的。\n\
  \n对于我这个完全的初学者来说，这就像是在用高水管灌输关于区块链的一切知识。课程围绕该技术的应用展开，并没有很强的技术性。我在这里第一次接触到新的区块链语言——挖矿、代币化、哈希率和私有许可网络等。我因此迷上了。\n\
  \n\n这项技术拥有的潜力令人着迷。代币的使用可以商业房地产、基础设施项目等的投资民主化。区块链的这种应用可以让小投资者参与这些大型投资。在投票中使用区块链的可能性——这可以使投票计票变得实时、准确且防篡改——将太酷了。追踪和追溯的能力——它具有如此巨大的潜力。\n\
  \n如果我能追踪我的捐款流向何处，我更有可能向需要的人捐款。每当自然灾害发生时，Facebook 和网站上都会出现这些选项，请求捐款。但谁知道那些钱去了哪里呢？据我所知，当我按下支付按钮的那一刻，钱就进去躺在某人的银行账户里了。似乎区块链可以提供一种解决方案。\n\
  \n许多不同的可能性正在出现。至少，这是它的承诺。它暗示了某种可能性的迹象。\n\n\n当我试图学习更多区块链的知识时，我尽可能参加各种聚会和会议。然而，大部分对话都是关于加密货币和金融科技的。很少谈论这项技术在企业领域的应用。这可能是因为有更多的资金流入加密货币公司。6\
  \ 对话遵循活动，而活动又遵循资金。\n\n企业客户传出的信息反映了这种对话。正如我们在下方所示，企业对“区块链”一词的提及率下降了。\n\n\n企业客户传出的信息反映了这种对话。正如我们在下方所示，企业对“区块链”一词的提及率下降了。7\n\
  \n![mvas0dryzx]\n![mvas0dryzy]\n\n直到现在，这很有趣，但我无法理解如何做到。对话遵循活动，而活动又遵循资金。\n\nGartner\
  \ 有其热周期（Hype Cycles）框架，帮助业务和技术领导者构建新兴技术并解释随而来的炒作。这仅仅是炒作吗？8 在我们这里，区块链似乎处于“幻灭期”。\n\
  \n根据 Gartner 对幻灭期的描述，“随着实验和实施的失败，兴趣减退。技术生产者被洗牌或失败。只有当供应商供应商改进其产品以满足早期采用者的时，投资才会继续。”\n\
  \n对区块链的兴趣正在消退吗？\n\n![mvas0dryyh]\n![mvas0dryzx]\n![mvas0dryzz]\n\n如果你追踪资金，它表明区块链技术没有足够的顺风。CB\
  \ Insights 的数据似乎证实了这一假设。观察区块链风险投资（VC）的趋势，报告显示 2019 年的融资资金与上年相比下降了 30% 以上。9\n\n![mvas0dryry]\n\
  ![mvas0dryzy]\n\n另一方面，头条新闻出现在我的信息流中：“为什么万事卡的区块链关注实际应用”、“沃尔玛及其他企业如何着区块链浪潮走向供应链天堂”或“Figure\
  \ Technologies 融资 103 亿美元以继续基于区块链的贷款”。10 还有大型家户品牌正致力于区块链项目，例如星巴克、三星等。11 IT 服务公司正在投入资金和资源支持咨询服务，为其客户提供全球区块链服务：埃森哲、IBM、信森等。\n\
  \n\n\n\n\n\n如果你观察那些发布的新闻稿，很难判断其中有多少是营销炒作，又有有多少是现实。所有成功的试点项目都能顺利迁移到生产环境并规模化运行吗？所有这些成功的概念验证——它们背后是否有有效的商业案例支持？还是说，它们只是为了勾选“区块链热词”这一复选框，并以此安抚投资者和股东？这种叙述中包含了许多冲突点。\n\
  \n当我作为一名年轻的商业顾问开始职业生涯时，我也面临着类似的问题。那时，企业资源计划（ERP）技术正准备通过其在不同公司部门间实现共享现实视图的承诺，来彻底改变公司。而现在，我们又在这里了，区块链也出现了，它承诺在多家通常相互竞争的公司之间实现共享的现实视图。所以，一个“ERP\
  \ 之 ERP”？也许吧。\n\n我写这本书是为了向那些提出同样问题的业务和技术领导者分享我的见解。我希望帮助他们为自己的组织指辟这些未知的区域。\n\n\n\
  成本书制定了一个框架，指导你的公司如何经历其 `blockchain` 采用历程。由于借鉴了早期采用者的真实经验，这本书揭示了帮助公司领导者处于 `blockchain`\
  \ 演变中心的实践。这些教训将帮助你通过使用 `blockchain` 创建价值来设计业务战略，并为你的业务模式可能发生的任何中断做好准备。\n\n如果你发现自己正处于这种听过\
  \ `blockchain` 但好奇它到底是什么，以及是否应该投入时间和精力的去进一步了解它的阶段，那么我邀请你与我一起开启这段旅程。我希望你能学到一些新东西——也许不是你预想中的那些，但无论如何都是新的。\n\
  \n当你阅读这本书时，你将发现 `blockchain` 作为业务新型操作系统的潜力，它提供了一个基础设施层并帮助我们安全地交换价值。通过这本书，我希望分享我对这种名为\
  \ `blockchain` 的社会技术现象的热情和兴奋。最终，我希望这本书帮助你在 `blockchain` 重塑你的竞争格局时，保持在创新的前沿。\n\n\
  我希望这本书让你对 `blockchain` 所提供的一切感到兴奋，并让你最终决定投入其中大展身手，而不仅仅是伸脚试水测试。\n\n这是一本写给想要利用 `blockchain`\
  \ 技术驱动业务价值的领导者读的书。《解锁区块链》（*Unblocking Blockchain*）将帮助公司领导者理解 `blockchain` 能为他们的业务做什么，并让他们准备好与技术同仁进行有意义的对话。这本书也将帮助技术领导者理解\
  \ `blockchain` 的可能性，同时努力为公司的技术基础提供面向未来的保障。\n\n我邀请你加入我开启这段*解锁区块链*的旅程——这是一段发现当下可能以及未来可能性的旅程。\n\
