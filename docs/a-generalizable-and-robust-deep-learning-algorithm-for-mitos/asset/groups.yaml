    to the decoder, modifying semantic segmentation masks, and adding Fourier-based
    data augmentation for diverse image generation. This experiment is also performed
    on the out-of-domain validation set from the MIDOG21 data as mentioned above.
    Detailed results are shown in Tables 4 and 5.


