    ## 4.5. 与最先进的有丝分裂检测方法比较


    为了公平地与最先进的有丝分裂检测方法进行比较，我们比较了五种已向公众发布代码的算法，包括 RetinaNet (Aubreville et al., 2021b)、DeepMitosis
    (Li et al., 2018)、MaskMitosis (Sebai et al., 2020)、SegMitos (Li et al., 2019a)
    和 DHE-Mit (Sohail et al., 2021a)。详细结果见表 3。RetinaNet 和 MaskMitosis 方法直接使用目标检测框架（如
    RetinaNet 和 Mask R-CNN）来检测有丝分裂图形。DeepMitosis 和 DHE-Mit 方法采用两阶段技术，结合目标检测器和 CNN
    分类器。SegMitos 和我们的方法采用语义分割来获得有丝分裂区域，其中 SegMitos 还添加了另一个阈值过滤机制以进一步识别目标有丝分裂区域。值得注意的是，由于
    MIDOG21 的测试集不可见，我们从训练集中划分了一个单独的验证集，将来自三个扫描仪的图像视为域外验证集。


    如表 3 所示，可以看出我们的方法实现了最佳性能，在 F1 分数方面比 DHE-Mit 高出约 +8%。将我们的端到端分割方案与 SegMitos 进行比较，我们的方法高出约
    +10%。如此大的性能提升的主要原因是之前所有方法都没有充分考虑训练数据与未见测试数据之间的域偏移。根据它们发布的代码，只有 MaskMitosis 方法应用了染色归一化策略以保证更好的泛化能力。将
    MaskMitosis 与 RetinaNet 进行比较，可以看出 MaskMitosis 方法的性能高出 +2%。这可归因于 Mask R-CNN 中多任务学习技术的贡献以及对域偏移问题的染色归一化。将两种两阶段方法（DeepMitosis
    和 DHE-Mit）进行比较，可以看出 DHE-Mit 的 F1 分数高出约 +5%。巨大的性能差异可能是由 DHE-Mit 中使用的模型集成技术造成的。


