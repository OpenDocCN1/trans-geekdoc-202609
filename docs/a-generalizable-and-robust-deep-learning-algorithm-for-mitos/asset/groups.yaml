    # ## 2.1. *Mitotic cell detection*


    With the emergence of publicly available datasets (e.g., MITOSIS14, AMIDA13, and
    TUPAC16), a series of automatic mitosis detection algorithms have emerged. Early
    algorithms typically combined handcrafted features (e.g., shape, texture, color,
    etc.) and machine learning (or simple deep learning) techniques for mitotic figure
    classification (Maroof et al., 2020; Tellez et al., 2018; Beevi et al., 2019;
    Hwang et al., 2020; Saha et al., 2018; Sigirci et al., 2021). These methods usually
    adopted some threshold constraints to find candidate mitotic cells and then applied
    a support vector machine (SVM), linear classifier, or CNN architecture on these
    selected regions for further mitosis verification. Maroof et al. (2020) applied
    threshold techniques on blue ratio images to select candidate nuclei and extracted
    nuclear features (e.g., color, morphology, and texture features). Then, SVM was
    used to classify these candidate nuclei into mitosis and non-mitosis. Tellez et
    al. (2018) found candidate mitotic cells by iteratively detecting all circular
    areas with a threshold constraint for their diameters, and then applied CNN architecture
    to further verify these candidate mitoses. Beevi et al. (2019) utilized a localized
    active contour model and krill herd algorithm to localize nuclei and then applied
    a pre-trained VGG to classify these corresponding cells into mitosis and non-mitosis.
    Hwang et al. (2020) used a fuzzy thresholding scheme to segment potential mitotic
    nuclei and a linear attention-based classifier for further mitosis identification.
    Saha et al. (2018) and Sigirci et al. (2021) incorporated handcrafted traditional
    features and high-level deep-learning-based features for mitosis detection. In
    the above-mentioned methods, their candidate mitosis detection process involves
    various thresholding techniques that may produce high false-positive and false-negative
    regions.


    The recently emerged deep learning techniques for mitosis detection can be divided
    into three categories: (1) object detection, (2) combination of object detection
    and binary classification, and (3) semantic segmentation. The first type of method
    performed end-to-end learning and directly adopted these detection results as
    the final mitotic cells, where Faster-RCNN was used as the main framework (Sebai
    et al., 2020). The second type of approach employed a two-stage strategy, where
    candidate mitotic cells were first detected and then further classified by a classification
    model. The utilized detection methods included Faster-RCNN (Li et al., 2018; Mahmood
    et al., 2020; Sohail et al., 2021a), customized region proposal network (RPN)
    (Lei et al., 2020), and patch-based classification (Nateghi et al., 2021). The
    binary classification process aims to further identify mitosis regions, where
    a ResNet50 (Li et al., 2019), a multi-branch classification (Lei et al., 2020),
    or an ensemble of two or more CNN frameworks (Mahmood et al., 2020; Tellez et
    al., 2019; Sohail et al., 2021a) were used. The last semantic segmentation method
    transformed the detection problem as a pixel-level classification one (Li et al.,
    2019a), which directly inferred the precise location of mitosis from the segmentation
    maps. However, these above-mentioned studies do not sufficiently take into account
    the differences between domains.


    # ## 2.2. *Domain shift in histopathology*


    Domain shift is defined as the data heterogeneity between the source and target
    domains (Challen et al., 2019), leading to a poor generalization of models trained
    on the source data to the unseen target data. For histopathological images, domain
    shift is mainly caused by different slide preparation processes and microscope
    scanning, and even within the same institution, appearance discrepancies could
    occur over time. Several methods have been presented to mitigate the domain shift
    problem, which can be divided into three categories: data augmentation, stain
    normalization, and domain-invariant representation.


    Data augmentation methods empower models to address various image variations by
    increasing the data diversity, which includes two techniques: rule-based transformation
    and generative adversarial networks (GAN)-based data generation. (1) For the rule-based
    transformation, the commonly used data generation methods include rotation, contrast,
    sharpness, color distortion, etc (Faryna et al., 2021). Among them, color-based
    augmentation is the main method used in histopathological images since color change
    is the main manifestation of stain variations. Some studies applied a color transformation
    to training data by adding color distortions on each RGB channel (Lafarge et al.,
    2017) or on hematoxylin, eosin, and residual channels (Tellez et al., 2018). Recently,
    Chang et al. (2021) proposed a stain mix-up augmentation method by mixing the
    stain color matrix between the source and target domains. Although the stain mix-up
    yields a more realistic stain color compared to the above-mentioned color augmentations,
    it requires access to the information of the target domain. In realistic scenes,
    the data of the target domain are often invisible and unpredictable.


    More recently, several CNN-based image transformation algorithms have emerged,
    including the neural style transfer method that aligns the mean and variance of
    content features across styles (Yamashita et al., 2021) and the vector-multiplication-based
    kernel adaptation method that aligns the distribution of convolutional kernels
    across domains (Huang et al., 2017). (2) For GAN-based data generation methods,
    CycleGAN and conditional GAN have been widely used for data augmentation (Mahmood
    et al., 2019; de Haan et al., 2021; Xue et al., 2021). The CycleGAN aims to learn
    the mapping between domains, which has been used for synthesizing training data
    for nuclear segmentation task (Mahmood et al., 2019), generating realistic samples
    for histopathological image classification (Xue et al., 2021), or transferring
    stain style between different stains (de Haan et al., 2021).


    Stain normalization has been widely used in the field of digital pathology (Chen
    et al., 2021), which aims to reduce the appearance variation (Stacke et al., 2020).
    The traditional stain normalization method requires first selecting an image as
    the reference and then matching the color spectrum of all images to that of the
    reference in color channels or staining channels (Stacke et al., 2020). However,
    manual selection of the reference image requires specialized skills. In recent
    years, GAN has eliminated the need for the reference image, which has also been
    used to unify color variations (Shaban et al., 2019; Cho et al., 2017). Shaban
    et al. (2019) employed CycleGAN to map images into different color patterns but
    preserved the same tissue structure. Cho et al. (2017) applied a conditional GAN
    to learn certain stain-style distribution of the training data.


    Several studies have been dedicated to learning domain-invariant representations,
    which can be categorized into two kinds of methods: feature alignment (Alirezazadeh
    et al., 2018) and domain adversarial learning (Lafarge et al., 2017; Zhang et
    al., 2019). To align features across different data sources, Alirezazadeh et al.
    (2018) learned a projection matrix to map feature vectors extracted from training
    and test sets to an invariant space. However, this feature mapping process relies
    on handcrafted features, which is difficult to achieve stable and robust performance.
    Domain adversarial network is a commonly used technique to learn domain-invariant
    features with an addition of a domain classifier (Lafarge et al., 2017; Zhang
    et al., 2019). Lafarge et al. (2017) developed a classification model with both
    mitosis and domain identification branches to ensure that the original domain
    cannot be recovered from the learned feature representation. Zhang et al. (2019)
    used adversarial learning to learn domain-invariant features, reducing the variations
    between domains. However, such adversarial training is computationally demanding
    and difficult to achieve stability (Chen et al., 2020).


