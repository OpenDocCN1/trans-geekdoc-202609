    found to provide higher accuracy in a pathology classification task than using
    stain normalization. The reason is that it is difficult to accurately estimate
    the stain from a single image, and traditional stain normalization methods could
    create image artifacts. When used with deep learning methods, the reduced sample
    diversity due to stain normalization may increase the risk of model overfitting,
    whereas our data augmentation method increases data variation and promotes more
    robust network training.


    ## 5. Conclusion


    In this work, we propose a mitosis detection method (FMDet) on breast histopathological
    images. To alleviate the problem of domain shift, we employ Fourier-based data
    augmentation to generate diverse domain-agnostic images. The importance of our
    data augmentation method has been verified in our ablation experiments. And then,
    we transform the detection task as a semantic segmentation one based on a fully
    convolutional network, where the coarse bounding box annotations are converted
    into fine pixel-level boundaries of mitotic nuclei. The instance-based semantic
    segmentation with precise supervision produces higher performance compared with
    the bounding-box-based segmentation. To achieve more robust feature extraction,
    we integrate a channel-wise multi-scale attention mechanism into the U-Net framework,
    which has also been verified to achieve superior performance in our ablation study.
    Our FMDet algorithm has been evaluated in the MIDOG 2021 challenge and secured
    first place. The comparison experiments with state-of-the-art mitosis detection
    methods also demonstrate the effectiveness of our solution. Further, we externally
    validate our generalization capability on four independent datasets for mitosis
    detection. The corresponding experimental results provide evidence for model generalization
    and reproducibility across multi-center cohorts. In our future work, we will attempt
    to improve the model generalizability by combining self-supervised learning on
    large-scale unlabeled data.


