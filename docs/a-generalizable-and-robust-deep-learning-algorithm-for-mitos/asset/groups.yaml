    First, there is extensive appearance variability across mitotic cells and high
    similarity between mitotic and non-mitotic cells. Mitosis (i.e., cell division)
    has a complex growth pattern that consists of four stages (prophase, metaphase,
    anaphase, and telophase), with a quite different cell morphology for each stage
    (Wilkins and Holliday, 2009). Especially in telophase, a nucleus is divided into
    two parts, but it can only be counted as one mitotic cell. In addition, some non-mitosis
    cells (e.g., apoptotic or necrotic nuclei, dense nuclei, compressed nuclei, “junk”
    particles, and other artifacts) differ little from mitotic cells (Veta et al.,
    2015), which complicates the process of mitosis counting. Second, histopathological
    images from different laboratories exhibit heterogeneous appearances due to differences
    in their slide preparation and image acquisition processes (Madabhushi and Lee,
    2016), which is known as a domain shift problem. In the slide preparation process,
    variations may be introduced by different stains, reagents, manufacturers, protocol,
    room conditions, etc. (Schönig-Markietka et al., 2021; Madabhushi and Lee, 2016).
    During slide scanning, different scanner types and parameter settings (e.g., image
    compression level, color scheme, brightness, and contrast) can also cause domain
    shifts (Schönig-Markietka et al., 2021). As highlighted by the MIDOG 2021 challenge
    (Aubreville et al., 2022), different scanners can lead to large variations in
    the image appearance of mitoses. In fact, as also pointed out in previous studies
    (Leo et al., 2016; Aubreville et al., 2020, 2022), the effect of scanner-induced
    domain shift may be stronger than that caused by differences in slide preparation.
    Fig. 1 shows some diverse breast histopathological images with mitotic cells from
    different laboratories and scanners. These serious domain variations make it very
    challenging to develop a generalizable and robust mitosis detection algorithm
    across diverse cohorts.


    ![](img/dd801f3ecf64db6a702e880d08ce4487_1_0.png)


    Fig. 1. The heterogeneous appearance caused by different scanners. These four
    examples are from breast cancer patients in the MIDOG 2021 challenge.


    There have been some studies on automatic mitosis detection, which can be divided
    into patch-classification-based (Maroof et al., 2020; Saha et al., 2018; Sigirci
    et al., 2021), object-detection-based (Sebai et al., 2020), semantic-segmentation-based
    (Li et al., 2019a), and hybrid methods (Li et al., 2018; Mahmood et al., 2020;
    Sohail et al., 2021a; Lei et al., 2020; Nateğhi et al., 2021; Tellez et al.,
    2018). Despite the promising results of these methods, there are still three aspects
    that could be further improved. First, a simple and effective feature extractor
    is required. Among these approaches, various feature extraction methods have been
    proposed to cover the complex appearance of mitotic figures, including traditional
    features (e.g., morphological, statistics, and color features) (Maroof et al.,
    2020; Saha et al., 2018; Sigirci et al., 2021) and deep-learning-based features
    (Li et al., 2019a, 2018; Sebai et al., 2020; Mahmood et al., 2020; Sohail et al.,
    2021a; Lei et al., 2020; Nateğhi et al., 2021). To further improve the robustness
    of deep features, a series of strategies have been proposed, including two-step
    learning (Li et al., 2018; Mahmood et al., 2020; Sohail et al., 2021a; Lei et
    al., 2020; Nateğhi et al., 2021) and model ensemble (Mahmood et al., 2020; Tellez
    et al., 2018; Sohail et al., 2021a). However, both two strategies greatly increase
    the complexity and the training time of the network. Second, current mitosis detection
    algorithms lack reproducibility and independent validation on multicenter cohorts.
    These methods do not sufficiently consider the domain shift that is widespread
    in the field of histopathological images (Madabhushi and Lee, 2016), which makes
    the performance of mitosis detection algorithms degrade dramatically on out-of-domain
    data, resulting in impractical clinical trials. Third, the current publicly available
    datasets used for mitosis detection are very small and have limited sample diversity.
    They are publicly available challenge datasets (e.g., AMIDA13 Veta et al., 2015,
    MITOSIS14 MITOS-ATYPIA-14, 2014, and TUPAC-auxiliary Veta et al., 2019), where
    TUPAC-auxiliary is the largest dataset with 73 WSIs.


    To address the above-mentioned problems, this work proposes a novel mitosis detection
    algorithm (called FMDet) on breast histopathological images, which is performed
    by converting the detection problem into a semantic segmentation one to capture
    more refined morphological features of cells. To generalize to unseen domain data,
    we adopt a Fourier-based data augmentation method, which exchanges low-frequency
    and high-frequency components between image pairs of two domains. To better extract
    robust feature representations, we integrate a channel-wise attention mechanism
    into the U-Net framework, which helps extract multi-scale features. Our algorithm
    is developed on much larger training data (200 WSIs with 8000 × 8000 pixels) of
    the MIDOG 2021 challenge. And then, it is evaluated by the data in unseen domains
    (e.g., the independent test data in the MIDOG 2021 challenge and four external
    datasets), which demonstrates state-of-the-art performance. Our main contributions
    are summarized as follows.


    +   1. We propose a generalizable and effective mitosis detection algorithm, which
    is one of the pioneer studies to fully consider the mismatch across domains.

    +   2. We transform the mitosis detection task into a semantic segmentation one
    to achieve precise mitotic figure identification. An attention mechanism is utilized
    to generate channel-wise multi-scale features, which helps the network to extract
    more robust features.

    +   3. To reduce the domain gaps, we adopt an unsupervised method to align the
    domain discrepancies by exchanging the low-frequency spectrum between domains.

    +   4. Our method ranked first place at the MIDOG 2021 challenge that aims to
    drive solutions regardless of different scanners. Moreover, our algorithm also
    shows a successful generalization to four unseen independent multicenter datasets.
    These results fully verify the effectiveness of our mitosis detection algorithm.


    # 2. Related works


    This section first briefly reviews recent mitosis detection methods. Then, domain
    adaptation/generalization strategies used in histopathological images are also
    reviewed since domain shift is a key factor to affect model generalization.'
