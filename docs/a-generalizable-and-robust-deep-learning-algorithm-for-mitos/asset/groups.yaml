    ## 一种可泛化且鲁棒的深度学习算法用于多中心乳腺组织病理图像中的有丝分裂检测


    Xiyue Wang a,b, Jun Zhang c, Sen Yang c, Jingxi Xiang c, Feng Luo d, Minghui Wang
    a,b, Jing Zhang a,*, Wei Yang c, Junzhou Huang c, Xiao Han c,*


    a 四川大学生物医学工程学院，成都 610065，中国

    b 四川大学计算机学院，成都 610065，中国

    c 腾讯人工智能实验室，深圳 518057，中国

    d 清华大学深圳国际研究生院，深圳 518057，中国


    ## 文章信息


    关键词:

    - 组织病理学

    - 有丝分裂检测

    - 域偏移

    - 特征提取

    - 深度学习


    ## 摘要


    组织活检中有丝分裂计数是乳腺癌患者的重要生物标志物，可支持疾病预后评估和治疗规划。开发一个鲁棒的有丝分裂细胞检测模型具有很大挑战性，由于其复杂的生长模式以及与非有丝分裂细胞的高相似性。大多数有丝分裂检测算法在图像域之间具有较差的泛化性，且在多中心环境中缺乏可重复性和验证。为克服这些问题，我们提出了一种可泛化且鲁棒的有丝分裂检测算法（称为
    FMDet），该算法在多中心乳腺组织病理图像上进行了独立测试。为了捕捉细胞更精细的形态特征，我们将目标检测任务转换为语义分割问题。有丝分裂细胞核的像素级标注是通过取经过训练的细胞核分割模型生成的掩码与
    MIDOG 2021 挑战赛提供的边界框的交集获得的。在我们的分割框架中，开发了一个鲁棒的特征提取器以捕捉有丝分裂细胞的外观变化，该提取器通过将通道级多尺度注意力机制集成到全卷积网络结构中构建而成。借助低层谱变化不影响高层语义感知的事实，我们采用基于傅里叶的数据增强方法，通过在两个域之间交换低频谱来减少域差异。我们的
    FMDet 算法已在 MIDOG 2021 挑战赛中进行了测试并排名第一。此外，我们的算法还在四个独立的有丝分裂检测数据集上进行了外部验证，与之前发表的结果相比表现出最先进的性能。这些结果表明我们的算法具有作为临床实践中辅助决策支持工具部署的潜力。我们的代码已发布在
    https://github.com/Xiyue-Wang/1st-in-MICCAI-MIDOG-2021-challenge。


    ## 1. 引言


    根据 2020 年美国癌症统计数据，乳腺癌是女性最常见的癌症之一，占女性癌症的 30%（Siegel et al., 2020）。Nottingham 分级系统被用作乳腺癌分级的临床标准，其中有丝分裂计数、核异型性和小管形成是需要考虑的三个因素（Elston
    and Ellis, 1991）。其中，有丝分裂计数是患者预后评估的关键生物标志物，因为有丝分裂密度与细胞增殖活性高度相关。在临床上，有丝分裂细胞的数量是通过在
    8–10 个显微镜高倍视野 (HPFs) 中手动计数正在进行有丝分裂的细胞核获得的（Balkenhol et al., 2019; Sohail et al.,
    2021a）。这项重复性任务对病理学家来说非常耗时且劳动密集。此外，由于有丝分裂细胞外观不均一，存在较高的观察者内和观察者间变异性（Yousif et al.,
    2021; Pan et al., 2021）。自动有丝分裂检测技术迫切需要以减轻繁琐的手动计数和观察者之间的广泛变异，帮助病理学家提供快速、准确且可重复的辅助诊断。然而，由于有丝分裂细胞特征高度多样以及域差异导致组织病理图像外观不同，自动有丝分裂检测具有很大挑战性。


    * 通讯作者。电子邮件地址：jing_zhang@scu.edu.cn (J. Zhang), haroldhan@tencent.com (X. Han)。


    首先，有丝分裂细胞之间存在广泛的外观变异性，且有丝分裂细胞与非有丝分裂细胞之间相似度很高。有丝分裂（即细胞分裂）具有复杂的生长模式，包括四个阶段（前期、中期、前期、后期和末期），每个阶段的细胞形态差异很大（Wilkins
    and Holliday, 2009）。特别是在末期，细胞核分裂为两部分，但只能计为一个有丝分裂细胞。此外，一些非有丝分裂细胞（例如凋亡或坏死细胞核、致密细胞核、受压细胞核、“垃圾”颗粒和其他伪影）与有丝分裂细胞差异很小（Veta
    et al., 2015），这使有丝分裂计数过程复杂化。其次，不同实验室的组织病理图像由于切片制备和图像采集过程的差异而表现出不均一的外观，这被称为域偏移问题。在切片制备过程中，不同的染色剂、试剂、制造商、方案、室条件等可能会引入变异（Schönig-Markietka
    et al., 2021; Madabhushi and Lee, 2016）。在切片扫描期间，不同的扫描仪类型和参数设置（例如图像压缩水平、色彩方案、亮度和对比度）也可能导致域偏移（Schönig-Markietka
    et al., 2021）。正如 MIDOG 2021 挑战赛所强调的（Aubreville et al., 2022），不同的扫描仪会导致有丝分裂图像外观出现较大差异。事实上，正如之前研究指出的那样（Leo
    et al., 2016; Aubreville et al., 2020, 2022），扫描仪引起的域偏移的影响可能比切片制备差异引起的影响更强。图 1
    显示了来自不同实验室和扫描仪的具有有丝分裂细胞的多样化乳腺组织病理图像。这些严重的域变异使得在多样化队列中开发可泛化且鲁棒的有丝分裂检测算法非常具有挑战性。


    ![](img/dd801f3ecf64db6a702e880d08ce4487_1_0.png)


    图 1. 不同扫描仪引起的不均一外观。这些四个示例来自 MIDOG 2021 挑战赛中的乳腺癌患者。


    已有一些关于自动有丝分裂检测的研究，可分为基于补丁分类（Maroof et al., 2020; Saha et al., 2018; Sigirci et
    al., 2021）、基于目标检测（Sebai et al., 2020）、基于语义分割（Li et al., 2019a）和混合方法（Li et al.,
    2018; Mahmood et al., 2020; Sohail et al., 2021a; Lei et al., 2020; Nateghi et
    al., 2021; Tellez et al., 2018）。尽管这些方法取得了令人鼓舞的结果，但仍有三个方面可以进一步改进。首先，需要一个简单有效的特征提取器。在这些方法中，提出了各种特征提取方法以覆盖有丝分裂图形的复杂外观，包括传统特征（例如形态、统计和颜色特征）（Maroof
    et al., 2020; Saha et al., 2018; Sigirci et al., 2021）和基于深度学习的特征（Li et al., 2019a,
    2018; Sebai et al., 2020; Mahmood et al., 2020; Sohail et al., 2021a; Lei et al.,
    2020; Nateghi et al., 2021）。为了进一步提高深度特征的鲁棒性，提出了一系列策略，包括两步学习（Li et al., 2018; Mahmood
    et al., 2020; Sohail et al., 2021a; Lei et al., 2020; Nateghi et al., 2021）和模型集成（Mahmood
    et al., 2020; Tellez et al., 2018; Sohail et al., 2021a）。然而，这两种策略都大大增加了网络的复杂性和训练时间。其次，当前的有丝分裂检测算法缺乏在多中心队列上的可重复性和独立验证。这些方法没有充分考虑组织病理图像领域广泛存在的域偏移（Madabhushi
    and Lee, 2016），这使得有丝分裂检测算法在域外数据上的性能急剧下降，导致临床试验不切实际。第三，目前公开可用的用于有丝分裂检测的数据集非常小且样本多样性有限。它们是公开的挑战数据集（例如
    AMIDA13 Veta et al., 2015，MITOSIS14 MITOS-ATYPIA-14, 2014，和 TUPAC-auxiliary Veta
    et al., 2019），其中 TUPAC-auxiliary 是最大的数据集，包含 73 个 WSI。


    为解决上述问题，本工作在乳腺组织病理图像上提出了一种新颖的有丝分裂检测算法（称为 FMDet），通过将检测问题转换为语义分割问题以捕捉细胞更精细的形态特征。为了泛化到未见域数据，我们采用基于傅里叶的数据增强方法，在两个域的图像对之间交换低频和高频分量。为了更好地提取鲁棒的特征表示，我们将通道级注意力机制集成到
    U-Net 框架中，有助于提取多尺度特征。我们的算法是在 MIDOG 2021 挑战赛的更大训练数据（200 个 WSI，分辨率为 8000 × 8000
    像素）上开发的。然后，它通过未见域的数据进行评估（例如 MIDOG 2021 挑战赛中的独立测试数据和四个外部数据集），表现出最先进的性能。我们的主要贡献总结如下。


    - 1. 我们提出了一种可泛化且有效有丝分裂检测算法，这是首批充分考虑跨域不匹配的研究之一。

    - 2. 我们将有丝分裂检测任务转换为语义分割任务以实现精确的有丝分裂图形识别。注意力机制被用于生成通道级多尺度特征，有助于网络提取更鲁棒的特征。

    - 3. 为了减少域差距，我们采用一种无监督方法通过在域之间交换低频谱来对齐域差异。

    - 4. 我们的方法在旨在推动无论不同扫描仪解决方案的 MIDOG 2021 挑战赛中排名第一。此外，我们的算法还显示出对四个未见的独立多中心数据集的成功泛化。这些结果充分验证了我们有丝分裂检测算法的有效性。


    ## 2. 相关工作


    本节首先简要回顾最近的有丝分裂检测方法。然后，还回顾了组织病理图像中使用的域适应/泛化策略，因为域偏移是影响模型泛化的关键因素。

