    “junk” particles) have a similar appearance to that of mitotic cells, which may
    be mistakenly detected as mitosis by our algorithm, as shown in Fig. 3(d)–(g).
    But it is able to improve the rate of missed mitosis detections, which is significantly
    important in clinical practice. (2) In some works (e.g., SegMitos and MaskMitosis
    methods (Li et al., 2019a; Sebai et al., 2020)), no domain discrepancy exists
    in their data, where the training and test images are from the same labs and scanners.
    Different from their settings, we adopt these datasets listed in Table 6 as unseen
    domains for independent algorithm validation, which can imitate the actual clinical
    scenario. (3) Some works employ complex computations to improve performance. For
    example, Mahmood et al. (2020) adopt a model ensemble to infer mitotic regions,
    which can be a valid strategy to reduce false predictions. SegMitos (Li et al.,
    2019a) requires complex post-processing to obtain accurate mitotic regions. In
    contrast, our end-to-end model does not require any post-processing step, which
    ensures a faster inference speed and more reliable predictions.


    From Table 6, it is seen that the accuracy of our method on the MITOSIS14 data
    is the lowest. There are a couple of explanations. First, the MITOSIS14 dataset
    is known to be more challenging due to high variations in tissue appearance (Mahmood
    et al., 2020; Beevi et al., 2019; Sebai et al., 2020). Second, there are annotation
    inconsistencies across different datasets, since each dataset was labeled by different
    human observers and thus subject to inter-rater variations. We note that the reported
    results of other methods on MITOSIS14 were computed using only data from one scanner
    type, but our method was tested on all MITOSIS14 data. If tested using only data
    from the same scanner (1200 images in total), the F1 score will be 0.5218 instead
    of 0.4901, which is about 5% higher than the previously best-reported result.


    # 4.8. Comparison with stain normalization methods


    In this subsection, we conduct a set of experiments to compare our strategy for
    mitigating domain shift (i.e., FFT-based data augmentation) with existing stain
    normalization methods. A stain normalization method aims to remove stain variation
    so as to get consistent color distributions for both training and testing data,
    which is often adopted as a preprocessing step in histopathological image analysis.
    The most widely used stain normalization scheme is color deconvolution, where
    separating stains from the RGB images is a key step (Tosta et al., 2019). Three
    popular stain normalization methods are compared in Table 7. The SVD-based method
    of Macenko et al. (2009) uses singular value decomposition (SVD) to obtain the
    stain vectors. The structure-preserving color normalization (SPCN) method uses
    sparse non-negative matrix factorization to separate stains (Vahadane et al.,
    2016). The whole-slide image color standardizer (WSICS) method derives the stain
    components using the image color and spatial information (Bejnordi et al., 2015).
    From Table 7, it is seen that these stain normalization methods have little performance
    gains for the mitosis detection task, while our Fourier-based data augmentation
    method offers a much larger performance improvement. These results are consistent
    with that of a previous study (Tellez et al., 2019), where data augmentation was
    found to provide higher accuracy in a pathology classification task than using
    stain normalization. The reason is that it is difficult to accurately estimate
    the stain from a single image, and traditional stain normalization methods could
    create image artifacts. When used with deep learning methods, the reduced sample
    diversity due to stain normalization may increase the risk of model overfitting,
    whereas our data augmentation method increases data variation and promotes more
    robust network training.


