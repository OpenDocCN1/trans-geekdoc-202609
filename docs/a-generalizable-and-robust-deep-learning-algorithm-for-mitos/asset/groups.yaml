    # 4.5. Comparison with state-of-the-art methods for mitosis detection


    To provide a fair comparison with state-of-the-art mitosis detection methods,
    we compare five algorithms that have released their codes to the public, including
    RetinaNet (Aubreville et al., 2021b), DeepMitosis (Li et al., 2018), MaskMitosis
    (Sebai et al., 2020), SegMitos (Li et al., 2019a), and DHE-Mit (Sohail et al.,
    2021a). Detailed results are shown in Table 3. The RetinaNet and MaskMitosis methods
    directly use object detection frameworks (e.g., RetinaNet and Mask R-CNN) to detect
    mitotic figures. The DeepMitosis and DHE-Mit methods adopt a two-stage technique
    by combining an object detector and a CNN classifier. SegMitos and our method
    adopt semantic segmentation to obtain mitotic regions, where SegMitos also adds
    another threshold filtering mechanism to further identify the target mitotic regions.
    Notably, since the test set of MIDOG21 is not visible, we divided a separate validation


    set from the training set by regarding images from each of the three scanners
    as an out-of-domain validation set.


    As shown in Table 3, it is seen that our method achieves the best performance,
    outperforming DHE-Mit by around +8% in terms of F1 score. Comparing our end-to-end
    segmentation scheme with SegMitos, our method outperforms by around +10%. The
    main reason for such a large performance improvement is that all previous methods
    have not sufficiently considered the domain shifts between the training data and
    unseen test data. According to their released codes, only the MaskMitosis method
    applies a stain normalization strategy to guarantee a better generalization capability.
    By comparing the MaskMitosis with RetinaNet, it is seen that the MaskMitosis method
    has a higher performance of +2%. This can be attributed to the contribution of
    multi-task learning techniques in Mask R-CNN and the stain normalization for the
    domain shift problem. By comparing the two two-stage methods (DeepMitosis and
    DHE-Mit), it is seen that DHE-Mit has a higher F1 score of about +5%. The huge
    performance difference may be caused by the model ensemble technique used in DHE-Mit.


    # 4.6. Ablation study


    We conduct ablation experiments to verify the effectiveness of our used strategies,
