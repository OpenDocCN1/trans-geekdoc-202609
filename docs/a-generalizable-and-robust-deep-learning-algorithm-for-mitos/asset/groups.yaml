    XR nanozoomer 2.0、第2号：Hamamatsu S360（0.5 NA）和第3号：Aperio ScanScope CS2扫描仪。子图（d）和（e）分别显示了来自AMIDA
    13和MITOSIS14的示例。子图（f）和（g）显示了TUPAC16数据集中SPEC-Alkmaar（中心2）和SPEC-Zaandam（中心3）的示例。子图（h）显示了来自MIDOG22的示例，其采集自一个新中心（FU
    Berlin）。


    准确率。在完整的TUPAC-auxiliary数据中，两阶段有丝分裂检测方法（Mahmood et al., 2020）在F1分数方面比我们低约5%，这可能是由于其未考虑域偏移问题。
    我们的方法采用基于傅里叶的数据增强来减少域差异，在所有实验中均显示出稳健的性能。 尽管有一项研究报道了在TUPAC-auxiliary数据上更高的性能（Sohail
    et al., 2021b），但同一数据集在模型训练期间被使用。


    换句话说，所报道的结果并未得到独立验证。 相比之下，我们的结果是在完全独立的测试数据上计算的，这更客观，也能更好地反映所提方法在实际应用中的泛化能力。 尽管我们的方法获得了最高的F1和召回分数，但精确度指标并不最优。
    例如，SegMitos（Li et al., 2019a）在AMIDA13上、两阶段有丝分裂检测方法（Mahmood et al., 2020）在TUPAC-auxiliary上，以及MaskMitosis（Sebai
    et al., 2020）在MITOSIS14上产生的精确度分数均高于我们的FMDet，这表明我们方法预测的结果包含更多假阳性图像。 可能的原因可总结如下。
    （1）一些非有丝分裂细胞（例如凋亡或坏死核、致密核、受压核和“垃圾”颗粒）与有丝分裂细胞外观相似，可能被我们的算法错误检测为有丝分裂，如图3（d）–（g）所示。但它能够提高漏检有丝分裂的检出率，这在临床实践中非常重要。
    （2）在一些工作中（例如SegMitos和MaskMitosis方法（Li et al., 2019a; Sebai et al., 2020）），其数据不存在域差异，训练和测试图像来自同一实验室和扫描仪。
    与其设置不同，我们采用表6中列出的这些数据集作为未见域，用于独立算法验证，这可以模拟实际临床场景。 （3）一些工作采用复杂计算来提高性能。 例如，Mahmood
    et al.（2020）采用模型集成来推断有丝分裂区域，这可以是一种减少错误预测的有效策略。 SegMitos（Li et al., 2019a）需要复杂的后处理才能获得准确的有丝分裂区域。
    相比之下，我们的端到端模型不需要任何后处理步骤，这确保了更快的推理速度和更可靠的预测。


    从表6可以看出，我们的方法在MITOSIS14数据上的准确率最低。 有几个解释。 首先，MITOSIS14数据集因组织外观的高变异性而被认为更具挑战性（Mahmood
    et al., 2020; Beevi et al., 2019; Sebai et al., 2020）。 其次，不同数据集之间存在标注不一致，因为每个数据集均由不同的人类观察者标注，因此存在观察者间变异。
    我们注意到，其他方法在MITOSIS14上的报道结果仅使用一种扫描仪类型的数据计算，而我们的方法在所有MITOSIS14数据上进行测试。 如果仅使用相同扫描仪的数据进行测试（共1200张图像），F1分数将为0.5218而不是0.4901，比之前报道的最佳结果高约5%。


    ### 4.8. 与染色归一化方法的比较


    在本小节中，我们进行了一系列实验，将我们缓解域偏移的策略（即FFT-based数据增强）与现有的染色归一化方法进行比较。 染色归一化方法旨在去除染色变异，以便为训练和测试数据获得一致的颜色分布，这通常被用作组织病理学图像分析中的预处理步骤。
    最广泛使用的染色归一化方案是颜色解卷积，其中从RGB图像中分离染色是关键步骤（Tosta et al., 2019）。 表7中比较了三种流行的染色归一化方法。
    Macenko et al.（2009）的基于SVD的方法使用奇异值分解（SVD）获得染色向量。 结构保持颜色归一化（SPCN）方法使用稀疏非负矩阵分解来分离染色（Vahadane
    et al., 2016）。 全切片图像颜色标准化器（WSICS）方法使用图像颜色和空间信息推导染色成分（Bejnordi et al., 2015）。


    表7

    在MIDOG21的域外验证集上与其他染色归一化方法的比较。 基线方法是我们结合SK-Unet（SEResNeXt50 + SK）和实例掩码的有丝分裂分割方法。
    Nor.和Aug.分别表示归一化和基于傅里叶的数据增强。


    | 方法 | F1 分数 | 召回率 | 精确率 |

    |---|---|---|---|

    | 基线 | 0.7343 | 0.8096 | 0.6719 |

    | 基线 + SVD-based Nor. | 0.7375 | 0.7946 | 0.6881 |

    | 基线 + SPCN | 0.7390 | 0.7756 | 0.7056 |

    | 基线 + WSICS | 0.7428 | 0.7938 | 0.6980 |

    | 基线 + Aug.（我们的方法） | 0.7773 | 0.8146 | 0.7440 |


    从表7可以看出，这些染色归一化方法对有丝分裂检测任务的性能提升很小，而我们的基于傅里叶的数据增强方法提供了更大的性能改进。 这些结果与之前的一项研究（Tellez
    et al., 2019）一致，其中数据增强在病理分类任务中比使用染色归一化提供了更高的准确性。 原因是很难从单张图像中准确估计染色，传统的染色归一化方法可能会产生图像伪影。
    与深度学习方法一起使用时，由于染色归一化导致样本多样性降低，可能会增加模型过拟合的风险，而我们的数据增强方法增加了数据变异，促进了更稳健的网络训练。


    ## 5. 结论


    在本工作中，我们提出了一种在乳腺组织病理学图像上的有丝分裂检测方法（FMDet）。 为缓解域偏移问题，我们采用基于傅里叶的数据增强来生成多样化的域无关图像。
    我们的数据增强方法的重要性已在消融实验中得到验证。 然后，我们基于全卷积网络将检测任务转换为语义分割任务，其中粗略的边界框标注被转换为有丝分裂细胞核的精细像素级边界。
    具有精确监督的基于实例的语义分割与基于边界框的分割相比产生了更高的性能。 为了实现更稳健的特征提取，我们将通道级多尺度注意力机制集成到U-Net框架中，这也在我们的消融研究中被验证为实现了优越的性能。
    我们的FMDet算法已在MIDOG 2021挑战赛中进行了评估并获得第一名。 与最先进的有丝分裂检测方法的比较实验也证明了解决方案的有效性。 此外，我们在四个独立的数据集上外部验证了我们的泛化能力以进行有丝分裂检测。
    相应的实验结果为模型在多中心队列中的泛化性和可重复性提供了证据。 在未来的工作中，我们将尝试通过在大规模未标记数据上结合自监督学习来提高模型的泛化能力。


