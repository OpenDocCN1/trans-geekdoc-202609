    HoVer-Net 网络以生成精确的细胞核边界。细胞核预测结果与边界框之间的交互被用作最终的分割掩码。在我们提出的有丝分裂分割框架中，使用 SE-ResNeXt50
    编码器和基于 SK 的解码器来捕获多尺度特征。


    条件（例如不同的中心、扫描仪和染色过程），其通过用参考域中的低频部分替换源域图像的低频部分来实现。该过程在图像级别进行，无需任何训练过程且可非常快速地实现。随后，这些图像被裁剪成小块以进行详细的
    有丝分裂检测过程。MIDOG 2021 挑战赛的组织者仅提供有丝分裂区域的边界框，这些边界框在像素级别上并非严格标注。为了为有丝分裂细胞核生成更准确的像素级注释，我们首先使用一个训练良好的细胞核分割网络（HoVer-Net）来获得细胞核的掩码（Graham
    et al., 2019），然后新的有丝分裂掩码通过将细胞核掩码与组织者提供的边界框相交获得。最后，生成的新的有丝分裂掩码用于开发我们的分割网络。以下我们将详细介绍我们的
    FMDet 算法。


    图像，分别。我们用参考域中的低频谱替换源域图像的低频谱，然后源域中的新频谱通过逆 FFT 变换以生成相应的新图像。生成的图像保持与原始源图像相同的标签。该方法在不改变任何图像细节或物体边界的情况下将参考域的风格转移到源域。基于傅里叶的数据增强可以被视为无需任何训练过程的图像到图像转换，其公式如下。


    假设算法开发有 *M* 个域，我们随机选择两个域分别作为源域和参考域来执行基于傅里叶的数据增强。例如，给定源域中的图像 \(I^s=\{x_i^s\}_{i=1}^{N^s}\)
    和参考域中的图像 \(I^r=\{x_i^r\}_{i=1}^{N^r}\)，其中 \(x_i\in\mathbb{R}^{H\times W\times
    3}\) 为一幅图像，\(N^s\) 和 \(N^r\) 分别表示源域和参考域中的图像数量。通过应用基于傅里叶的数据增强，生成的数据可以表示为 \(I^g=\{x_i^g\}_{i=1}^{N^g}\)。详细的计算过程将在下面展示。


    ### 3.1. 基于傅里叶的数据增强


    为了解决域偏移问题，我们提出了一种具有良好域泛化能力的基于傅里叶的有丝分裂检测方法。其动机在于低频幅度谱的变化不会影响高层语义感知（Yang and Soatto,
    2020）。我们的基于傅里叶的数据增强首先对 MIDOG 2021 挑战赛提供的所有训练数据执行快速傅里叶变换（FFT）。然后，从两个不同域中采用图像作为源域和参考域


    对于一幅图像 \(x\)，其快速 FFT 可以表示为


    \[F(x)=F(u,v)=\sum_{x=0}^{H-1}\sum_{y=0}^{W-1}x(x,y)e^{-j2\pi(ux/H+vy/W)},\quad
    j^2=-1.\tag{1}\]


    其中 \(F^A=|F(u,v)|\) 和 \(F^P=\angle F(u,v)\) 分别表示幅度谱和相位谱，其保持与图像 \(x\) 相同的大小。


    用 $\mathcal{F}^{-1}$ 表示的逆 FFT 被应用于将源图像恢复为新图像 $\mathbf{x}^s$，计算如下。


    $\mathbf{x}^s = \mathcal{F}^{-1} \big( \big[ (M_{\beta} \cdot \mathcal{F}^A (\mathbf{x}'')
    + (1 - M_{\beta}) \cdot \mathcal{F}^A (\mathbf{x}^s) ), \mathcal{F}^P (\mathbf{x}^s)
    \big] \big)$, (2)


    其中 $M_{\beta} \in \mathbb{R}^{H \times W \times 3}$ 表示用于获得低频部分的掩码，其在中心区域的值为 1，其余区域为
    0。$\beta \in (0,1)$ 用于通过以下设置控制掩码的范围。


    $M_{\beta}(h,w) = \begin{cases} 1, \text{if } (h,w) \in (-\beta H : \beta H, -\beta
    W : \beta W) \\ 0, \text{else}, \end{cases}$ (3)


    ### 3.2. 分割掩码生成


    对于有丝分裂检测任务，MIDOG 2021 挑战赛提供的标签是边界框，如图 2(b) 所示。我们将这些边界框标签转换 为用于分割这些有丝分裂细胞核的像素级注释。我们使用一个名为
    HoVer-Net 的训练良好的细胞核分割网络来获得细胞核的像素级边界，该网络在多个独立的多组织苏木精-伊红染色组织病理学图像数据集上表现出优异性能（Graham
    et al., 2019）。HoVer-Net 采用多任务学习同时实现细胞核分割和分类，这有助于更好的特征提取过程。此外，为了实现更精确的分割，它利用水平和垂直距离图来分离重叠的细胞核。由于其卓越的分割能力，我们直接推理训练好的
    HoVer-Net 进行细胞核分割，从而消除了细胞核注释的需求。如图 2(b) 所示，绿色线条包围的区域是 HoVer-Net 预测的细胞核区域。蓝色边界框是挑战赛组织者提供
    的有丝分裂细胞注释。绿色和蓝色区域的交集被作为我们有丝分裂细胞核分割的最终注释。


    ### 3.3. 基础网络架构


    我们的基础网络结构采用编码器-解码器 U-Net 框架，如图 2(a) 所示。在我们的分割网络中，使用了两个具有注意力机制的关键模块以实现更好的特征挖掘，即
    squeeze-and-excitation（SE）(Hu et al., 2018) 和 selective kernel（SK）(Li et al.,
    2019b) 模块。SE 模块将特征信息压缩为全局特征描述符，然后将其与输入描述符集成以动态建模通道级特征依赖，这使得模型能够选择性地和自适应地强调对预测结果贡献更大的特征图，类似于人类视觉感知（Li,
    2014）。SK 模块使用通道级注意力机制动态融合具有不同卷积核大小的特征图，这使得网络能够自动聚合预测任务的适当特征尺度。总体而言，这两个注意力模块有助于网络识别细胞大小、颜色、纹理、形态等存在较大变化的有丝分裂。


    编码器部分使用 SE-ResNeXt50 模型，通过聚合残差变换从多个子空间学习融合特征。它包括四个主要层，每个层通过重复一个具有 C 条路径（基数）的块构建，该块执行
    C = 32 组卷积。四个编码器层中重复块的数量分别为 3、4、6 和 3。每个块由 ResNeXt50 网络和 SE 注意力模块组合构建。对于输入特征图
    x，注意力特征可通过 $\mathbf{x}'' = \mathbf{x} + f_{SE}(\sum_{i=1}^{C} \mathcal{T}_i(\mathbf{x}))$,
    (4) $f_{SE} = f_{gp}(f_{fc}(f_{fc}(\cdot)))$, (5) 计算，其中输入特征图 x 和输出特征图 x'' 保持相同的维度。$\mathcal{T}_i$
    表示每条路径中的变换函数，


    其在每个块中保持相同的拓扑结构。例如，在第一个块中，$\mathcal{T}_i$ 表示如图 2(a) 所示的 1 × 1 卷积、3 × 3 卷积和 1 ×
    1 卷积的序列。$f_{SE}$ 表示使用的 SE 模块，其通过全局池化和密集连接操作的序列实现以捕获通道级注意力特征。


    解码器部分由五个上采样块组成，将这些特征图恢复到原始图像大小。如图 2(a) 所示，在每个上采样块中，首先执行 TransConv 以增加特征图的图像大小，然后将这些特征图与相应编码器层中的特征图连接。接下来，在每个上采样块中加入两个卷积层和一个
    SK 模块。如图 2(a) 所示，SK 模块旨在通过非线性聚合具有不同核大小的多个分支，使网络自适应地调整其感受野大小（Li et al., 2019b）。SK
    注意力特征的详细计算过程如下所示。


    给定输入特征 x''，它使用具有不同扩张值的 3 × 3 空洞卷积拆分为两个新特征 $(\mathbf{x}''_k, k = 1,2)$。然后，两个特征图相加并经过全局池化和两个全连接层以获得聚合特征
    $\mathbf{z} \in \mathbb{R}^{2C}$。然后，z 按通道方式重塑为 $\mathbf{z}'' \in \mathbb{R}^{2
    \times C}$ 以生成软注意力如下。$m_k = e^{W_k z''} / \sum_{k=1}^{2} e^{W_k z''} \quad (k
    \in \{1,2\})$, (6)


    最终特征图 $\hat{\mathbf{x}}$ 可通过整合来自两个分支的自适应特征计算得到。$\hat{\mathbf{x}} = \mathbf{x}''
    + \sum_{k=1}^{2} m_k \times \mathbf{x}''_k$, (7)


    在解码器之后，我们在五个不同分辨率级别融合多尺度特征，其通过将解码器每个块的特征（表示为 $\hat{\mathbf{x}}_0$、$\hat{\mathbf{x}}_1$、$\hat{\mathbf{x}}_2$、$\hat{\mathbf{x}}_3$
    和 $\hat{\mathbf{x}}_4$）上采样到与输入图像相同的大小，然后将这些特征连接在一起作为 $[\hat{\mathbf{x}}_0, \hat{\mathbf{x}}_1,
    \hat{\mathbf{x}}_2, \hat{\mathbf{x}}_3, \hat{\mathbf{x}}_4]$。获得的多尺度特征图经过卷积、批归一化和线性整流单元以生成最终分割图
    $out = conv([\hat{\mathbf{x}}_0, \hat{\mathbf{x}}_1, \hat{\mathbf{x}}_2, \hat{\mathbf{x}}_3,
    \hat{\mathbf{x}}_4])$。


    ### 3.4. 分割的损失函数


    我们的 FMDet 架构使用 focal loss ($L_{FL}$) 和 Dice loss ($L_{DICE}$) 的组合进行训练。Focal loss
    已成功用于解决各种分割和检测任务中的数据不平衡问题（Yang et al., 2021; Lin et al., 2017）。在这项工作中，我们使用 focal
    loss 来缓解有丝分裂细胞和非有丝分裂细胞数量之间的不平衡。Dice loss 被提出用于衡量两幅图像之间的重叠程度，已被广泛用作图像分割任务中的度量。对于单个图像，我们的损失函数
    $L_{seg}$ 计算如下。$L_{seg} = L_{FL} + L_{DICE}$, (8)


    $L_{FL} = - \sum_i [(1 - \hat{y}_i)^\gamma y_i \log \hat{y}_i + (\hat{y}_i)^\gamma
    (1 - y_i) \log (1 - \hat{y}_i)]$, (9) $L_{DICE} = - \frac{2 \sum_i y_i \hat{y}_i
    + \epsilon}{\sum_i y_i^2 + \sum_i \hat{y}_i^2}$, (10) 其中 $y_i$ 和 $\hat{y}_i$ 分别表示第
    $i$ 个像素的真实标签和预测标签。focal loss 中的 $\gamma \ge 0$ 是一个可调的聚焦参数。当 $\gamma$ 等于 0 时，focal
    loss 退化为交叉熵。Dice loss 中的 $\epsilon$ 设置为一个很小的正值以考虑训练稳定性。

