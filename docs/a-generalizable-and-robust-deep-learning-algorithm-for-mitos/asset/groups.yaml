    ### 2.1. 有丝分裂细胞检测


    随着公开数据集（如 MITOSIS14、AMIDA13 和 TUPAC16）的出现，一系列自动有丝分裂检测算法也应运而生。早期算法通常将手工设计的特征（如形状、纹理、颜色等）与机器学习（或简单深度学习）技术相结合，用于有丝分裂图像分类（Maroof
    et al., 2020; Tellez et al., 2018; Beevi et al., 2019; Hwang et al., 2020; Saha
    et al., 2018; Sigirci et al., 2021）。这些方法通常采用一些阈值约束来寻找候选有丝分裂细胞，然后在选定的区域上应用支持向量机（SVM）、线性分类器或
    CNN 架构进行进一步的有丝分裂验证。Maroof et al. (2020) 在蓝色比率图像上应用阈值技术来筛选候选细胞核，并提取核特征（如颜色、形态和纹理特征）。然后，使用
    SVM 将这些候选细胞核分类为有丝分裂和非有丝分裂。Tellez et al. (2018) 通过迭代检测所有满足直径阈值约束的圆形区域来寻找候选有丝分裂细胞，然后应用
    CNN 架构进一步验证这些候选有丝分裂。Beevi et al. (2019) 利用局部主动轮廓模型和磷虾群算法定位细胞核，然后应用预训练的 VGG 将相应的细胞分类为有丝分裂和非有丝分裂。Hwang
    et al. (2020) 使用模糊阈值方案分割潜在的有丝分裂细胞核，并使用基于线性注意力的分类器进行进一步的有丝分裂识别。Saha et al. (2018)
    和 Sigirci et al. (2021) 结合了传统手工特征与高层基于深度学习的特征进行有丝分裂检测。在上述方法中，候选有丝分裂检测过程涉及各种阈值技术，可能产生较高的假阳性和假阴性区域。


    近年来出现的用于有丝分裂检测的深度学习技术可分为三类：（1）目标检测；（2）目标检测与二分类相结合；（3）语义分割。第一类方法进行端到端学习，并直接将检测结果作为最终的有丝分裂细胞，其中
    Faster-RCNN 被用作主要框架（Sebai et al., 2020）。第二类方法采用两阶段策略，首先检测候选有丝分裂细胞，然后由分类模型进一步分类。所使用的检测方法包括
    Faster-RCNN（Li et al., 2018; Mahmood et al., 2020; Sohail et al., 2021a）、定制区域提议网络（RPN）（Lei
    et al., 2020）和基于块的分类（Nateghi et al., 2021）。二分类过程旨在进一步识别有丝分裂区域，其中使用了 ResNet50（Li
    et al., 2019）、多分支分类（Lei et al., 2020）或两个或多个 CNN 框架的集成（Mahmood et al., 2020; Tellez
    et al., 2019; Sohail et al., 2021a）。最后一种语义分割方法将检测问题转化为像素级分类问题（Li et al., 2019a），直接从分割图中推断有丝分裂的精确位置。然而，上述研究并未充分考虑域之间的差异。


    ### 2.2. 组织病理学中的域偏移


    域偏移定义为源域和目标域之间的数据异质性（Challen et al., 2019），导致在源数据上训练的模型难以泛化到未见过的目标数据。对于组织病理学图像，域偏移主要由不同的载玻片制备过程和显微镜扫描引起，即使在同一机构内，外观差异也可能随时间出现。目前已提出多种方法来缓解域偏移问题，可分为三类：数据增强、染色归一化和域不变表示。


    数据增强方法通过增加数据多样性使模型能够应对各种图像变化，包括两种技术：基于规则的变换和基于生成对抗网络（GAN）的数据生成。（1）对于基于规则的变换，常用的数据生成方法包括旋转、对比度、清晰度、颜色失真等（Faryna
    et al., 2021）。其中，基于颜色的增强是组织病理学图像中使用的主要方法，因为颜色变化是染色差异的主要表现形式。一些研究通过在每个 RGB 通道（Lafarge
    et al., 2017）或苏木精、伊红和残留通道（Tellez et al., 2018）上添加颜色失真来对训练数据进行颜色变换。最近，Chang et
    al. (2021) 提出了一种染色混合增强方法，通过混合源域和目标域之间的染色颜色矩阵来实现。尽管与上述颜色增强相比，染色混合能产生更真实的染色颜色，但它需要访问目标域的信息。在实际场景中，目标域的数据往往是不可见且不可预测的。


    最近，出现了一些基于 CNN 的图像变换算法，包括将内容特征的均值和方差跨风格对齐的神经风格迁移方法（Yamashita et al., 2021），以及基于向量乘法的核自适应方法，该方法跨域对齐卷积核的分布（Huang
    et al., 2017）。（2）对于基于 GAN 的数据生成方法，CycleGAN 和条件 GAN 已被广泛用于数据增强（Mahmood et al.,
    2019; de Haan et al., 2021; Xue et al., 2021）。CycleGAN 旨在学习域之间的映射，已被用于为细胞核分割任务合成训练数据（Mahmood
    et al., 2019）、为组织病理学图像分类生成真实样本（Xue et al., 2021），或在不同染色之间转换染色风格（de Haan et al.,
    2021）。


