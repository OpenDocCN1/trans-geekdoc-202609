    are shown in Table 4. The Bbox masks are obtained by finding the inner tangent
    circles of the bounding box annotations provided by the organizers of the MIDOG
    2021 challenge. In contrast to the coarse BBox masks, the instance masks correspond
    to detailed pixel-level annotations for mitotic nuclei, which are obtained by
    intersecting the ground truth bounding boxes and the nucleus segmentation results
    from a well-trained HoVer-Net (Graham et al., 2019). As shown in Table 4, the
    instance masks offer consistent performance gains over the Bbox masks, no matter
    which segmentation network is'
