    important in clinical practice. (2) In some works (e.g., SegMitos and MaskMitosis
    methods (Li et al., 2019a; Sebai et al., 2020)), no domain discrepancy exists
    in their data, where the training and test images are from the same labs and scanners.
    Different from their settings, we adopt these datasets listed in Table 6 as unseen
    domains for independent algorithm validation, which can imitate the actual clinical
    scenario. (3) Some works employ complex computations to improve performance. For
    example, Mahmood et al. (2020) adopt a model ensemble to infer mitotic regions,
    which can be a valid strategy to reduce false predictions. SegMitos (Li et al.,
    2019a) requires complex post-processing to obtain accurate mitotic regions. In
    contrast, our end-to-end model does not require any post-processing step, which
    ensures a faster inference speed and more reliable predictions.


