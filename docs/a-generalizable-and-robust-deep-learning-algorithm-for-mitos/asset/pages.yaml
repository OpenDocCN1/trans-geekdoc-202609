- pgno: 0
  md: '# A generalizable and robust deep learning algorithm for mitosis detection
    in multicenter breast histopathological images


    Xiyue Wang a,b, Jun Zhang c, Sen Yang c, Jingxi Xiang c, Feng Luo d, Minghui Wang
    a,b, Jing Zhang a,*, Wei Yang c, Junzhou Huang c, Xiao Han c,*


    a College of Biomedical Engineering, Sichuan University, Chengdu 610065, China

    b College of Computer Science, Sichuan University, Chengdu 610065, China

    c Tencent AI Lab, Shenzhen 518057, China

    d Shenzhen International Graduate School, Tsinghua University, Shenzhen 518057,
    China


    # ARTICLE INFO


    +   Keywords:

    +   - Histopathology

    +   - Mitosis detection

    +   - Domain shift

    +   - Feature extraction

    +   - Deep learning


    # ABSTRACT


    Mitosis counting of biopsies is an important biomarker for breast cancer patients,
    which supports disease prognostication and treatment planning. Developing a robust
    mitotic cell detection model is highly challenging due to its complex growth pattern
    and high similarities with non-mitotic cells. Most mitosis detection algorithms
    have poor generalizability across image domains and lack reproducibility and validation
    in multicenter settings. To overcome these issues, we propose a generalizable
    and robust mitosis detection algorithm (called FMDet), which is independently
    tested on multicenter breast histopathological images. To capture more refined
    morphological features of cells, we convert the object detection task as a semantic
    segmentation problem. The pixel-level annotations for mitotic nuclei are obtained
    by taking the intersection of the masks generated from a well-trained nuclear
    segmentation model and the bounding boxes provided by the MIDOG 2021 challenge.
    In our segmentation framework, a robust feature extractor is developed to capture
    the appearance variations of mitotic cells, which is constructed by integrating
    a channel-wise multi-scale attention mechanism into a fully convolutional network
    structure. Benefiting from the fact that the changes in the low-level spectrum
    do not affect the high-level semantic perception, we employ a Fourier-based data
    augmentation method to reduce domain discrepancies by exchanging the low-frequency
    spectrum between two domains. Our FMDet algorithm has been tested in the MIDOG
    2021 challenge and ranked first place. Further, our algorithm is also externally
    validated on four independent datasets for mitosis detection, which exhibits state-of-the-art
    performance in comparison with previously published results. These results demonstrate
    that our algorithm has the potential to be deployed as an assistant decision support
    tool in clinical practice. Our code has been released at https://github.com/Xiyue-Wang/1st-in-MICCAI-MIDOG-2021-challenge.


    # 1. Introduction


    According to 2020 American cancer statistics, breast cancer is one of the most
    common cancers in women, accounting for 30% of the female cancers (Siegel et al.,
    2020). Nottingham grading system is adopted as the clinical standard for breast
    cancer grading, where mitosis counting, nuclear pleomorphism, and tubule formation
    are three factors to be considered (Elston and Ellis, 1991). Among them, mitosis
    counting is a key biomarker for patient prognostication since mitotic density
    is highly correlated with cell proliferation activity. In the clinic, the number
    of mitotic cells is obtained by manually counting the nuclei undergoing mitosis
    in 8–10 microscope high power fields


    (HPFs) (Balkenhol et al., 2019; Sohail et al., 2021a). This repetitive task is
    very time-consuming and labor-intensive for pathologists. In addition, there is
    a high intra- and inter-observer variability due to the heterogeneous appearances
    of mitotic cells (Yousif et al., 2021; Pan et al., 2021). Automatic mitosis detection
    technology is urgently required to alleviate the tedious manual counting and the
    wide variability between observers, helping provide pathologists with fast, accurate,
    and reproducible aided diagnosis. Nevertheless, automatic mitosis detection is
    quite challenging due to the highly varied characteristics of mitotic cells and
    different appearances of histopathological images caused by domain discrepancies.


    * Corresponding authors. E-mail addresses: jing_zhang@scu.edu.cn (J. Zhang), haroldhan@tencent.com
    (X. Han).'
