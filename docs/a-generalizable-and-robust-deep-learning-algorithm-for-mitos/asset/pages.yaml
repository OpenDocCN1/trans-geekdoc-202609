    $M_{\beta}(h,w) = \begin{cases} 1, \text{if } (h,w) \in (-\beta H : \beta H, -\beta
    W : \beta W) \\ 0, \text{else}, \end{cases}$ (3)


    # 3.2. Segmentation mask generation


    For the mitosis detection task, the labels provided by the MIDOG 2021 challenge
    are bounding boxes, as shown in Fig. 2(b). We transform these bounding box labels
    as pixel-level annotations for segmenting these nuclei with mitosis. We use a
    well-trained nuclear segmentation network called HoVer-Net to obtain the pixel-level
    boundaries of nuclei, which has demonstrated excellent performance on multiple
    independent multi-tissue haematoxylin & eosin stained histopathological image
    datasets (Graham et al., 2019). HoVer-Net adopts multi-task learning to simultaneously
    implement nuclear segmentation and classification, which facilitates a better
    feature extraction procedure. Also, to achieve more precise segmentation, it utilizes
    horizontal and vertical distance maps to separate overlapped nuclei. Due to its
    superior segmentation capability, we directly infer the trained HoVer-Net for
    nuclear segmentation, which eliminates the requirement of nuclear annotations.
    As shown in Fig. 2(b), the regions surrounded by green lines are the predicted
    nuclear areas by HoVer-Net. The blue bounding boxes are the mitotic cell annotations
    provided by the challenge organizers. The intersections of the green and blue
    regions are taken as the final annotations for our mitotic nuclear segmentation.


    # 3.3. Basic network architecture


    Our basic network structure adopts the encoder-decoder U-Net framework, which
    is shown in Fig. 2(a). In our segmentation network, two key modules with attention
    mechanism are used for better feature mining, i.e., the squeeze-and-excitation
    (SE) (Hu et al., 2018) and selective kernel (SK) (Li et al., 2019b) modules. The
    SE module squeezes the feature information into a global feature descriptor that
    is then integrated with the input descriptor to dynamically model the channel-wise
    feature dependencies, which allows the model to selectively and adaptively emphasize
    feature maps that contribute more to the prediction results, similar to human
    visual perception (Li, 2014). The SK module uses a channel-wise attention mechanism
    to dynamically fuse feature maps with different convolution kernel sizes, which
    enables the network to automatically aggregate appropriate feature scales for
    the prediction task. Overall, both attention modules help the network to recognize
    mitoses with large variations in cell size, color, texture, morphology, etc.


    The encoder part uses a SE-ResNeXt50 model, which learns fused features from multiple
    subspaces by aggregating residual transformations. It includes four main layers
    and each layer is constructed by repeating a block with C paths (cardinalities)
    that perform C = 32 groups of convolutions. The number of repeated blocks in the
    four encoder layers is 3, 4, 6, and 3, respectively. Each block is constructed
    by combining a ResNeXt50 network and a SE attention module. For an input feature
    map x, the attention feature can be calculated by $\mathbf{x}'' = \mathbf{x} +
    f_{SE}(\sum_{i=1}^{C} \mathcal{T}_i(\mathbf{x}))$, (4) $f_{SE} = f_{gp}(f_{fc}(f_{fc}(\cdot)))$,
    (5) where the input feature map x and the output one x'' keep the same dimensions.
    $\mathcal{T}_i$ represents the transformation functions in each path,


    which keeps the same topology in each block. For example, in the first block,
    $\mathcal{T}_i$ denotes a sequential of 1 × 1 convolution, 3 × 3 convolution,
    and 1 × 1 convolution as shown in Fig. 2(a). $f_{SE}$ represents the utilized
    SE module, which is implemented by a sequence of global pooling and dense connection
    operations to capture channel-wise attention features.


    The decoder part consists of five upsampling blocks that recover these feature
    maps into the original image size. As shown in Fig. 2(a), in each upsampling block,
    TransConv is first performed to increase the image size of the feature maps, and
    then these feature maps are concatenated with those in the corresponding encoder
    layer. Next, two convolutional layers and an SK module are incorporated into each
    upsampling block. As shown in Fig. 2(a), the SK module aims to make the network
    adaptively adjust its respective field sizes by non-linearly aggregating multiple
    branches with different kernel sizes (Li et al., 2019b). The detailed computation
    process of the SK attention feature is shown as follows.


    Given an input feature x'', it is split into two new features $(\mathbf{x}''_k,
    k = 1,2)$ using 3 × 3 atrous convolution with different dilation values. Then,
    the two feature maps are summed and go through a global pooling and two fully
    connected layers to obtain an aggregated feature $\mathbf{z} \in \mathbb{R}^{2C}$.
    Then, z is reshaped as $\mathbf{z}'' \in \mathbb{R}^{2 \times C}$ in terms of
    channel-wise to generate soft attention as follows. $m_k = e^{W_k z''} / \sum_{k=1}^{2}
    e^{W_k z''} \quad (k \in \{1,2\})$, (6)


    The final feature maps $\hat{\mathbf{x}}$ can be calculated by integrating the
    adaptive features from the two branches. $\hat{\mathbf{x}} = \mathbf{x}'' + \sum_{k=1}^{2}
    m_k \times \mathbf{x}''_k$, (7)


    Following the decoder, we fuse multi-scale features at five different resolution
    levels, which is performed by upsampling the features at each block of decoder
    (denoted as $\hat{\mathbf{x}}_0$, $\hat{\mathbf{x}}_1$, $\hat{\mathbf{x}}_2$,
    $\hat{\mathbf{x}}_3$, and $\hat{\mathbf{x}}_4$) to the same size as the input
    image, and then these features are concatenated together as $[\hat{\mathbf{x}}_0,
    \hat{\mathbf{x}}_1, \hat{\mathbf{x}}_2, \hat{\mathbf{x}}_3, \hat{\mathbf{x}}_4]$.
    The obtained multi-scale feature maps pass through a convolution, batch normalization,
    and rectified linear unit to generate the final segmentation map $out = conv([\hat{\mathbf{x}}_0,
    \hat{\mathbf{x}}_1, \hat{\mathbf{x}}_2, \hat{\mathbf{x}}_3, \hat{\mathbf{x}}_4])$.


    # 3.4. Loss functions for segmentation


    Our FMDet architecture is trained with a combination of focal loss ($L_{FL}$)
    and Dice loss ($L_{DICE}$). Focal loss has been successfully used to address data
    imbalance problems in various segmentation and detection tasks (Yang et al., 2021;
    Lin et al., 2017). In this work, we use focal loss to alleviate the imbalance
    between the number of mitotic and non-mitotic cells. Dice loss has been proposed
    to measure the degree of overlap between two images, which has been widely used
    as a metric in image segmentation tasks. For an individual image, our loss function
    $L_{seg}$ is calculated as follows. $L_{seg} = L_{FL} + L_{DICE}$, (8)


    $L_{FL} = - \sum_i [(1 - \hat{y}_i)^\gamma y_i \log \hat{y}_i + (\hat{y}_i)^\gamma
    (1 - y_i) \log (1 - \hat{y}_i)]$, (9) $L_{DICE} = - \frac{2 \sum_i y_i \hat{y}_i
    + \epsilon}{\sum_i y_i^2 + \sum_i \hat{y}_i^2}$, (10) where $y_i$ and $\hat{y}_i$
    denote the ground truth and predicted label of the $i$th pixels, respectively.
    The $\gamma \ge 0$ in the focal loss is a tunable focus parameter. When $\gamma$
    is equal to 0, the focal loss degenerates to cross-entropy. The $\epsilon$ in
    Dice loss is set as a small positive value for training stability consideration.'
