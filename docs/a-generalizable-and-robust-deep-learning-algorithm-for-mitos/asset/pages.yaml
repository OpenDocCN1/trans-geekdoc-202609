    To improve the model generalization capability, we use unsupervised Fourier-based
    data augmentation to increase the diversity of the training samples by varying
    their frequency contents. The effect of the Fourier-based data augmentation method
    on the mitosis detection accuracy is summarized in Table 5. As seen from Table
