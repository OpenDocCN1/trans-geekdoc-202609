    # ### 3.1. Fourier-based data augmentation


    To address the domain shift problem, we propose a Fourier-based mitosis detection
    method with promising domain generalization capability. The motivation behind
    this is that the variations in the low-frequency amplitude spectrum do not affect
    the high-level semantic perception (Yang and Soatto, 2020). Our Fourier-based
    data augmentation first performs a fast Fourier transformation (FFT) on all the
    training data provided in the MIDOG 2021 challenge. Then, images from two different
    domains are adopted as the source and reference


    For an image \(x\), its fast FFT can be represented by


    \[F(x)=F(u,v)=\sum_{x=0}^{H-1}\sum_{y=0}^{W-1}x(x,y)e^{-j2\pi(ux/H+vy/W)},\quad
    j^2=-1.\tag{1}\]


    here \(F^A=|F(u,v)|\) and \(F^P=\angle F(u,v)\) represent the amplitude and phase
    spectrum, respectively, which keep the same size as image \(x\).'
