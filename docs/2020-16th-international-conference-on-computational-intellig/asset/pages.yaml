    Transfer learning of neural networks has developed rapidly in recent years. To
    construct deep networks with limited available data is one of the research hottest
    topics. This paper explores domain classification based on transfer learning,
    tends to solve the problems in practical applications by multiple techniques to
    achieve better performance. Negative transfer and stability are important measurements
    in transfer learning, and the worth of learning further while using deep transfer
    learning. The development of deep neural network, transfer learning has been utilized
    to solve many challenging problems.


