    In recent years, Deep Convolutional Neural Network (DCNN) rapidly develops and
    makes great progress by network models and training methods such as GoLeNet and
    other networks with accuracy over 97%, which can achieve efficient automatic learning
    and classification of images and excellent performance[4]. The self-built and
    trained DCNN models require more computing resources and resources.


    Transfer learning is the application of pre-training neural network. And sample
    transfer, transferring parameter and other methods, it can fulfill the tasks with
    a small number of new training image data set. Transfer learning can achieve better
    learning performance with small amount of data.


    This paper studied and the methods of image classification based on deep transfer
    learning. The methods of deep convolutional network and transfer learning are
    discussed in detail.


    #  I INTRODUCTION


    Convolutional neural network (CNN) is an deep learning model to solve the problem
    of image processing, computer vision (CV), natural language processing(NLP), speech
    recognition, etc. The feature extraction and selection through convolution and
    pooling operations can solve the problem of image recognition caused by image,
    rotation, or scaling[1]. Therefore, CNN shows great robustness to the diversity
    of two-dimensional images. The input of CNN can be an original image where the
    receptive field can be defined by the weight of convolutional kernel, so to collect
    data and effectively extract the precise features of the input-data and improve
    the learning performance.


    Comparing with shallow, which contains only one hidden layer, deeper greatly increases
    the number of layers in the network. When data is input into a multilayer network,
