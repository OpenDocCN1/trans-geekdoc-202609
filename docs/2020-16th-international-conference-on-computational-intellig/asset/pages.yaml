    Abstract—With the continuous development of deep learning technology, neural networks
    as convolutional neural network (CNN) have shown good performance in many fields,
    such as image processing. The relevant algorithm shows that the deeper the network,
    the more features that need to be learned in neural network, and the more computing
    resources will be consumed to reconstruct and train the network. Parameters often
    need to be trained in dataset. But in many practical applications, the effective
    sample dataset that can be collected is limited, and models often suffer from
    overfitting when applied to small datasets. Transfer learning can transfer knowledge
    between domains/tasks novel. Combining deep convolutional neural network with
    transfer learning can make deep models of high value and solve problems in new
    fields, which has considered an advantage. This paper focuses on the review of
    CNN and transfer learning, their characteristics, methods, and applications, so
    as to promote their effective use.


    **Keywords:** CNN ; Deep learning ; Transfer learning ; Image recognition


