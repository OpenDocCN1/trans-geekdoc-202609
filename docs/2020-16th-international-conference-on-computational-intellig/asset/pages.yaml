    # C. Domain Adversarial Neural Network


    The main idea of DANN is to use H-divergence to measure the distance between two
    domains and biased GANs. The architecture of DANN contains three parts, such as
    Feature Extractor, Label Predictor and Domain Classifier. In this, the feature
    extractor and classifier share the architecture of the network. The final goal
    is to maximize the classification performance. In this framework, a domain classifier
    module is added to distinguish the source/target main features which are extracted
    by the extractor. The objectives are equivalent to


    $E(\theta_f, \theta_y, \theta_d) = \sum L_y(\theta_f, \theta_y) - \lambda \sum
    L_d(\theta_f, \theta_d) \quad (6)$


    Where $l$ represents the source domain, $L_y$ represents the classification loss,
    and $L_d$ represents the classification loss of domain classifier. The optimization
    process is shown in equation (7) and (8)


    $$\theta_f, \theta_y, \theta_d = \arg \max E(\theta_f, \theta_y, \theta_d) \quad
    (7)$


    $$\theta_d = \arg \max E(\theta_f, \theta_y, \theta_d) \quad (8)$


    In order to avoid iteration, we introduces a Generator layer, which may add a
    reverse operation in the General process of domain classifier, so that the optimization
    process does not need iteration.


    # D. Domain Separation Network


    The existing transfer method relies on the learning algorithm to eliminate the
    characteristics of distribution between different domains. Bousmalis [19] and
    others search for a way to deal with the transfer problem. They divide into two
    categories, characteristics of public (shared) and characteristics of private.
    The migration of private characteristics of each domain will lead to negative
    transfer. Domain Separation Network (DSN) solves this problem.


    The work of DSN consists of two parts (1) extracting features from different domains;
    (2) using features to migrate. Based on this, the author proposes the following
    neural network, which can not only ensure the extraction of public and private
    features, but also ensure the integrity and effectiveness of them. As shown in
    Fig. 4


    For DSN to benefit, the public part must be the common feature of source domain
    and target domain.


    characters of both parts must be separated to effectively avoid the negative transfer.
    Then put forward the following loss function to restrict target encoder, source
    encoder, and the first is "difference loss", as shown in (9)


    $$\mathcal{L} = ||H(f_s) - H(f_t)|| + ||H(f_s) || H(f_t)||| \quad (9)$


    Second, in order to carry out the transfer, the following function should be adopted,
    which is intuitively recognized by improving their similarity. Then, "similar
    loss" is proposed, which contains two parts. The first part is the loss function
    as in DAN, show in equation (10), and the second is the MMD loss, as shown in
    (11)


