    #  II. DEEP CONVOLUTIONAL NEURAL NETWORK (DCNN)


    #  A. Convolutional neural network


    As forward, neural network uses convolutional layer to extract features and performs
    data mapping through nonlinear activation function. It is a deep learning framework
    with strong feature extraction capacity. The input of CNN is two-dimensional image,
    the corresponding sample features are extracted by multiple convolution and pooling.
    Then, the extracted features are expanded into a one-dimensional array and then
    fed into different layers, which are selected according to tasks requirements.
    The classification and recognition by images of convolutional neural network includes
    two processes, the forward process and the reverse process. In, the forward process
    fulfills the tasks, feature extraction and classifying tasks and'
