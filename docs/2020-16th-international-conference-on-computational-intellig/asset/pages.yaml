    $$\mathcal{L}^{DANN} = \sum |log(d_i) + (1-d_i) \log(1-d_{i})| \quad (10)$


    $$\mathcal{L}^{MMD} = \sum_{i=1}^{N_s} \sum_{j=1}^{N_s} \K(h(x_{si}), h(x_{sj}))
    + \sum_{i=1}^{N_t} \sum_{j=1}^{N_t} \K(h(x_{ti}), h(x_{tj})) - 2 \sum_{i=1}^{N_s}
    \sum_{j=1}^{N_t} \K(h(x_{si}), h(x_{tj})) \quad (11)$


    # E. Active Transfer


    Traditional methods handle the problem of transfer, while Active Transfer [ATL20]
    effectively solves the problem of negative transfer in transfer. ATL extends methods
    using projection matrix and weight coefficient vector. The objective function
    of ATL is shown in equation (12).


    $$\min_{p,a} L(p,a) = \sum_{i=1}^{s} p^{ti} \alpha_i - \sum_{j=1}^{t} p^{tj} \alpha_j
    + \lambda_1 \sum_{i,j}^{s} a_{ij} k_{ij} + \lambda_2 \sum_{i,j}^{s} a_{ij} a_{lj}
    \omega_{ij}$'
