    # IV. THE METHOD OF DEEP TRANSFER LEARNING


    On one hand, learning has strong ability in fitting, and better generalization
    performance in learning feature representation[16]. On the other hand, transfer
    learning domain-dependent features can help us to use the knowledge of deep neural
    network, and then make full use of the existing knowledge to learn the common
    characteristic representation of other fields, mainly introducing transfer learning
    (DTL), which has been developed from deep transfer since 2014. And there are many
    related works. The methods of DTL are divided into three categories: method based
    on relation, adversarial and method based on reconstruction. The following mainly
    introduces the first two


    # A. Deep Domain Confusion


    Deep Confusion(DDC) is a new architecture which introduces an adaptation layer
    and an additional domain loss, to learn a representation that is semantically
    meaningful and invariant. The structure of DDC is shown in Fig.2. In which, the
    left is a CNN for classification, and the loss is calculated through various convolutions
    and full connectivity with labeled images. Traditional picture classification
    is fitting but this would lead to a problem. In the view of the source domain,
    network without target domain data would be difficult to achieve good results
    in target areas (unlabeled images on the right of the picture). Therefore, the
    parameter domain loss needs to be added in the network to make the distance between
    domains smaller.


    The commonly used loss is MMD loss, just as equation (1):


    ```

    $mmd^2(x_s, x_t) = ||\frac{1}{\sqrt{N_s}}\sum_{i=1}^{N_s}\Phi(x_s^i) - \frac{1}{\sqrt{N_t}}\sum_{j=1}^{N_t}\Phi(x_t^j)||^2$

    ```


    Maximum Mean Deviation (MMD) is often used for two sample sets, is to determine
    whether the two samples are equally distributed. The optimization goal of DDC
    is described as equation (2):


    ```

    $loss = L(g(x_s), y) + \lambda \cdot mmd^2(g(x_s), g(x_t))$

    ```


    # B. Deep Adaptation Networks


    Deep Adaptation Networks(DAN) is an improved framework of DDC. There are two main
    improvements. The first one is to adding MMD losses in multiple layers of the
    network. The second one is to use multiple cores in MMD, show in equation (3):


    ```

    $loss = L(f(g_s), y) + \lambda \sum mmd^2(g_k(x_s), g_k(x_t))$

    ```


    Where $g_k$ represents the output of the layer. As shown in Fig.3:


    ![](img/92d7539c0c43fb30c4d7f6d50f19fc96_2_0.png)


    Fig. 2. The DDC architecture


    ![](img/92d7539c0c43fb30c4d7f6d50f19fc96_2_1.png)


    The MK-MMD[17] is added to the middle output of the connection in the layers.
    The MMD formula is $||\cdot||_H$, which represents the difference in Hilbert space,
    or adds a representing kernel function, such as Gaussian kernel function, as shown
    in equation (4):


    ```

    $\mathcal{K}(x_1, x_2) = \exp(-\frac{||x_1-x_2||^2}{\sigma^2})$

    ```


    The choice of $\sigma$ is very important. MK-MMD uses the accumulation of multiple
    kernel functions, show in equation (5):'
  - '[PAGE 3]


    $$\mathcal{K} = \sum_{k=1}^{K} \beta_k R_k + \sum_{k=1}^{K} \gamma_k S_k \quad
    (5)$


    According to DCC, with the two improvements, DAN achieves better performance.


    # C. Domain Adversarial Neural Network


    The main idea of DANN is to use H-divergence to measure the distance between two
    domains and biased GANs. The architecture of DANN contains three parts, such as
    Feature Extractor, Label Predictor and Domain Classifier. In this, the feature
    extractor and classifier share the architecture of the network. The final goal
    is to maximize the classification performance. In this framework, a domain classifier
    module is added to distinguish the source/target main features which are extracted
    by the extractor. The objectives are equivalent to


    $E(\theta_f, \theta_y, \theta_d) = \sum L_y(\theta_f, \theta_y) - \lambda \sum
    L_d(\theta_f, \theta_d) \quad (6)$


    Where $l$ represents the source domain, $L_y$ represents the classification loss,
    and $L_d$ represents the classification loss of domain classifier. The optimization
    process is shown in equation (7) and (8)


    $$\theta_f, \theta_y, \theta_d = \arg \max E(\theta_f, \theta_y, \theta_d) \quad
    (7)$


    $$\theta_d = \arg \max E(\theta_f, \theta_y, \theta_d) \quad (8)$


    In order to avoid iteration, we introduces a Generator layer, which may add a
    reverse operation in the General process of domain classifier, so that the optimization
    process does not need iteration.


    # D. Domain Separation Network


