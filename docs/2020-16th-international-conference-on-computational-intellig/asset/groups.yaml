    # 基于深度迁移学习的图像分类方法综述


    李传子（Chuanzi Li）

    河北大学

    中国石家庄

    41996246@qq.com


    冯锦宁（Jining Feng），李军洪李*，马海帆*

    河北大学

    中国石家庄

    1241069595@qq.com


    摘要—随着深度学习技术的不断发展，作为卷积神经网络（CNN）的神经网络在图像处理等许多领域展现了良好的性能。相关算法表明，网络越深，神经网络需要学习的特征就越多，重建和训练网络消耗的计算资源也越多。通常需要在数据集训练参数。但在许多实际应用中，可以收集的有效样本是有限的，模型在应用于小数据集时往往会遭受过拟合。迁移学习可以在领域/任务之间新颖地迁移知识。将深度卷积神经网络与迁移学习结合可以使深度模型具有高价值并解决新领域的问题，这被认为是优势。本文重点对CNN和迁移学习及其特点、方法和应用进行综述，促进它们的有效利用。


    **关键词：** CNN； 深度学习； 迁移学习； 图像识别


    提取数据特征的非线性函数。低层特征和高层抽象特征相结合以完成数据分类和识别任务[3]。没有人工参与特征提取过程，这避免了人工选择的主观性和任意性，使得提取的特征更具


    近年来，深度卷积神经网络（DCNN）快速发展，通过GoLeNet等网络模型和训练方法在准确率超过97%的网络上取得了巨大进展，可以实现图像的高效自动学习和分类以及卓越性能[4]。自建和训练的DCNN模型需要更多的计算资源和资源。


    迁移学习是预训练神经网络的应用。通过样本迁移、参数迁移等方法，它可以用少量的的新训练图像数据集完成任务。迁移学习可以用少量数据获得更好的学习性能。


    本文研究并探讨了基于深度迁移学习的图像分类方法。详细讨论了深度卷积网络和迁移学习的方法。


    ## I. 引言


    卷积神经网络（CNN）是一种用于解决图像处理、计算机视觉（CV）、自然语言处理（NLP）、语音识别等问题的深度学习模型。通过卷积和池化操作进行特征提取和选择，可以解决由图像、旋转或缩放引起的图像识别问题[1]。因此，CNN对二维图像的多样性表现出强大的鲁棒性。CNN的输入可以是原始图像，其感受场可以通过卷积核的权重定义，以便收集数据并有效提取输入数据的精确特征，提高学习性能。


    与仅包含一个隐藏层的浅层网络相比，深层网络大大增加了网络的层数。当数据输入到多层网络时，有必要构建复杂的


    ## II. 深度卷积神经网络（DCNN）


    ### A. 卷积神经网络


    如前所述，神经网络利用卷积层提取特征，并通过非线性激活函数执行数据映射。它是一个具有强大特征提取能力的深度学习框架。CNN的输入是二维图像，相应的样本特征通过多次卷积和池化提取。然后，将提取的特征扩展为一维数组，然后输入到根据任务要求的不同层。卷积神经网络对图像的分类和识别包括两个过程：正向过程和反向过程。在正向过程中，完成任务、特征提取和分类任务，而反向过程则是进行分类误差的反向传播和权重更新。预测值与真实值之间的损失反向传播用于更新参数，并通过正向传播和反向传播的过程进行训练。


    LeC[5]在1998年提出了用于手写识别的卷积神经网络LeNet。该网络为CNN奠定了基础并定义了CNN的结构，包括三层：卷积层、池化层和融合层。2012年，Krizhevsky[6]提出的AlexNet结构变得深得多，具有更多刺激神经元，并由于其自我发展，促进了CNN在图像识别领域的应用。基于AlexNet，Simonyan[7]在2014年提出了VGG-Net结构，这是一种层数增加且超过10层的卷积网络结构。CNN深度的增加可以产生良好的。但随着深度的增加，会产生梯度消失、梯度爆炸等更多问题。同时，Szegedy[8]等人提出了InceptionNet结构，它与VGG-Net完全不同。GoogleNet在加深网络的同时增加了信息。在相同尺寸下可以提取丰富的特征，这可以通过深度卷积来减少冗余。进行卷积聚合以提取多尺度特征并加速收敛。2015年，何[9]等人提出了具有残差学习连接的ResNet，引入了新的网络思想，并有效地解决了许多问题，如信息丢失、网络退化。DenseNet赢得了ILSVRC竞赛，前5准确率为95%，超过了以往所有的网络。2017年，Huang[10]等人提出了DenseNet，它采用了稠密连接机制。这种方法在增强特征能力的同时解决了梯度消失问题并减少了网络参数的数量。这些工作为微调提供了强有的基础。


    ### 深度卷积神经网络


    深度卷积神经网络（DCNN）是一种模拟生物神经网络的多层网络，具有输入层、卷积层、池化层、融合层和输出层。其结构是交替的。图1是DCNN的结构。对于“深度”目前还没有明确的定义——在语音识别中，超过20层的网络是常见的[11]。为了解决梯度消失问题，使用了ReLU、LReLU和Maxout等激活函数代替sigmoid，形成了现在的DCNN结构。


    ![](img/92d7539c0c43fb30c4d7f6d50f19fc6_1_0.png)


    图1 DCNN结构


    ## III. 迁移学习


    迁移学习的本质是启动人类思维的方式，从他人处进行推理，从而有助于将知识迁移到另一个相似领域A。基于迁移的机器学习算法可以用少量的训练任务数据将源域知识迁移到目标任务，并提高迁移效果。


