    reverse process is to cut the back propagating of classification error and weight
    updating. The back propagating of loss between the predicted value and the real
    value is used to update the parameters, and it is trained by the process of forward
    propagation and back propagation.


    LeC[5] proposed the convolutional neural network LeNet for handwriting recognition
    in 1998. This network lays the foundation of CNN and defines the structure of
    CNN, which includes three layers: convolutional, pooling layer and fusion layer.
    In 2012, the AlexNet structure proposed by Krizhevsky[6] became much deeper with
    stimulated neurons and more them to develop themselves to the application of CNN
    in the field of image recognition. Based on AlexNet, Simonyan[7] proposed the
    VGG-Net structure in 2014, which is a convolutional network structure with increased
    layers and more than 10 layers. The increase of depth in CNN can provide good
    effect. But with the increase of depth, there would be more problems such as gradient
    vanishing, gradient explosion and other problems, meanwhile. Szegedy[8] et al
    proposed the InceptionNet structure, which is completely different from VGG-Net.
    GoogleNet increases information while deepening network. Rich features can be
    extracted with the same size, which can be reduced by deep convolution. Convolution
    aggregation is carried out to extract multi-scale features and accelerate convergence.
    In 2015, He[9] et al proposed a ResNet with residual learning connection which
    introduces a new network idea, and it effectively solves many problems, such as
    information loss, network degradation. DenseNet won the ILSVRC competition, and
    the top5 was 95%, surpassing all previous networks. In 2017, Huang[10] et al proposed
    DenseNet, which adopts a dense connection mechanism. This method effectively solves
    the problem of gradient disappearance and reduces the number of network parameters
    while strengthening the feature power. These works provide strong foundation for
    fine-tuning.


    # Deep convolutional neural network


    Deep convolutional neural network (DCNN) is a multi-layer network that mimics
    biological neural network, and has input layer, convolutional layer, pooling layer,
    fusion layer and output layer. Its structure is alternating. Fig1 is the structure
    of DCNN. There is no explicit definition about-- four layers of network can be
    considered ''deep'' in speech recognition, with more than 20 layers of network
    are common in recognition[11]. In order to solve the problem of gradient disappearance,
    activation functions are used as ReLU, LReLU, and Maxout


    are used to replace sigmoid, thus forms the structure of DCNN nowadays.


    ![](img/92d7539c0c43fb30c4d7f6d50f19fc96_1_0.png)


    Fig. 1. DCNN structure


    # III. TRANSFER LEARNING


    The essence of transfer learning is to initiate the way of human thinking to draw
    inferences from others can one by making itself helpful to transfer knowledge
    to another similar domain A. The machine learning algorithm based on transfer
    can transfer the knowledge of source to the target task, even with little training
    tasks data, and can improve the transfer effect.


    All machine learning algorithms are with the problem of how to construct high-performance
    without overfitting when the data is insufficient or small sample. Deep neural
    network needs more training tasks and is more dependent on the sample data to
    reach the number of layers.


    There are four types of transfer learning, transfer learning on sample, transfer
    learning based on model, transfer learning based on feature, and transfer learning
    on relationship of domain. Researchers have investigated the structure of the
    neural network data in distribution, interdisciplinary, such as network structure
    for transfer and improvement of feature representation. For example, the work
    by Eric[12] et al in 2011 is helpful to clarify the representation of domain similarity.
    Long M[13] et al. successfully realized the transfer from source to target domain
    by domain adaptation and attention mechanism.


    In 2017, Jeremy[14] et al combined the deep learning model and three training
    techniques of discriminative fine-tuning, tuning learning rate and general workflow,
    which can save the learned information to a prominent extent.


    The current results about transfer learning show that such method can solve sample
    data and insufficient neural network training problem,'
