    ## IV. THE METHOD OF DEEP TRANSFER LEARNING


    On one hand, learning has strong ability in fitting, and better generalization
    performance in learning feature representation [16]. On the other hand, transfer
    learning domain-dependent features can help us to use the knowledge of deep neural
    network, and then make full use of the existing knowledge to learn the common
    characteristic representation of other fields, mainly introducing transfer learning
    (DTL), which has been developed from deep transfer since 2014. And there are many
    related works. The methods of DTL are divided into three categories: method based
    on relation, adversarial and method based on reconstruction. The following mainly
    introduces the first two.


    ## A. Deep Domain Confusion


    Deep Confusion (DDC) is a new architecture which introduces an adaptation layer
    and an additional domain loss, to learn a representation that is semantically
    meaningful and invariant. The structure of DDC is shown in Fig.2. In which, the
    left is a CNN for classification, and the loss is calculated through various convolutions
    and full connectivity with labeled images. Traditional picture classification
    is fitting but this would lead to a problem. In the view of the source domain,
    network without target domain data would be difficult to achieve good results
    in target areas (unlabeled images on the right of the picture). Therefore, the
    parameter domain loss needs to be added in the network to make the distance between
    domains smaller.


    The commonly used loss is MMD loss, just as equation (1):


    ```

    mmd^2(x_s, x_t) = ||\frac{1}{\sqrt{N_s}}\sum_{i=1}^{N_s}\Phi(x_s^i) - \frac{1}{\sqrt{N_t}}\sum_{j=1}^{N_t}\Phi(x_t^j)||^2$

    ```


    Maximum Mean Deviation (MMD) is often used for two sample sets, is to determine
    whether the two samples are equally distributed. The optimization goal of DDC
    is described as equation (2):


    ```

    loss = L(g(s), y) + \lambda \cdot mmd^2(g(s), g(t))

    ```


    ## B. Deep Adaptation Networks


    Deep Adaptation Networks (DAN) is an improved framework of DDC. There are two
    main improvements. The first one is to adding MMD losses in multiple layers of
    the network. The second one is to use multiple cores in MMD, show in equation
    (3):


    ```

    loss = L(f(s), y) + \lambda \sum mmd^2(g_k(s), g_k(t))

    ```


    Where $g_k$ represents the output of layer. As shown in Fig.3:


    ![](img/92d7539c0c4fb30c4d7f6d50f19fc96_2_0.png)


    Fig. 2. The DDC architecture


    ![](img/92d7539c0c4fb30c4d7f6d50f19fc96_2_1.png)


    The output of connection in layers. The MMD formula is $||\cdot||_H$, which represents
    the difference in Hilbert space, or adds representing kernel function, such as
    Gaussian kernel, as shown in equation (4):


    ```

    \mathcal{K}(x_1, x_2) = \exp(-\frac{||x_1-x_2||^2}{\sigma^2})

    ```


    The choice of $\sigma$ is very important. MK-MMD uses the accumulation of kernel
    functions, show in equation (5):


    $$

    \mathcal{K} = \sum_{k=1}^{K} \beta_k + \sum_{k=1}^{K} \gamma_k

    $$


    According to DCC, with the two improvements, DAN achieves better performance.


    ## C. Domain Adversarial Neural Network


    The main idea of DANN is to use H-divergence to measure the distance between two
    domains. The architecture of DANN contains three parts, such as Feature Extractor,
    Label Predictor and Domain Classifier. In this, the feature extractor and classifier
    share the architecture of the network. The final goal is to maximize the classification
    performance. In this framework, a domain classifier is added to distinguish source/target
    features which are extracted by extractor. The objectives are equivalent to


    $E(\theta_f, \theta_y, \theta_d) = \sum L_y(\theta_f, \theta_y) - \lambda \sum
    L_d(\theta_f, \theta_d) \quad (6)$


    Where $l$ represents the source domain, $L_y$ represents the classification loss,
    and $L_d$ represents the classification loss of domain classifier. The optimization
    process is shown in equation (7) and (8):


    $$

    \theta_f, \theta_y, \theta_d = \arg \max E(\theta_f, \theta_y, \theta_d) \quad
    (7)

    $$


    $$

    \theta_d = \arg \max E(\theta_f, \theta_y, \theta_d) \quad (8)

    $$


    In order to avoid iteration, we introduces Generator layer, which may add a reverse
    operation in the process of domain classifier, so that the optimization process
    does not need iteration.


    ## D. Domain Separation Network


    The existing transfer method relies on the learning algorithm to eliminate the
    characteristics of distribution between different domains. Bousmalis [19] and
    others search for a way to deal with the transfer problem. They divide into two
    categories, characteristics of public (shared) and characteristics of private.
    The migration of private characteristics of each domain will lead to negative
    transfer. Domain Separation Network (DSN) solves this problem.


    The work of DSN consists of two parts:

    (1) extracting features from different domains;

    (2) using features to migrate. Based on this, the author proposes the following
    neural network, which can not only ensure the extraction of public and private
    features, but also ensure the integrity and effectiveness of them. As shown in
    Fig. 4.


    For DSN to benefit, the public part must be the common feature of source domain
    and target domain. characters of both parts must be separated to effectively avoid
    the negative transfer. Then put forward the following loss function to restrict
    target encoder, source encoder, and the first is "difference loss", as shown in
    (9):


    $$

    \mathcal{L} = ||H(f_s) - H(f_t)|| + ||H(f_s) || H(f_t)|| \quad (9)

    $$


    Second, in order to carry out the transfer, the following function should be adopted,
    which is intuitively recognized by improving their similarity. Then, "similar
    loss" is proposed, which contains two parts. The first part is the loss function
    as in DAN, show in equation (10), and the second is the MMD loss, as shown in
    (11)


    ![](img/92d7539c0c4fb30c4d7f6d50f19fc96_3_0.png)


    $$

    \mathcal{L}^{DANN} = \sum |log(d_i) + (1-d_i) \log(1-d_{i})| \quad (10)

    $$


    $$

    \mathcal{L}^{MMD} = \sum_{i=1}^{N_s} \sum_{j=1}^{N_s} \mathcal{K}(h(x_{si}), h(x_{sj}))
    + \sum_{i=1}^{N_t} \sum_{j=1}^{N_t} \mathcal{K}(h(x_{ti}), h(x_{tj})) - 2 \sum_{i=1}^{N_s}
    \sum_{j=1}^{N_t} \mathcal{K}(h(x_{si}), h(x_{tj})) \quad (11)

    $$


    ## E. Active Transfer


    Traditional methods handle the problem of transfer, while Active Transfer [ATL]
    effectively solves the problem of negative transfer in transfer. ATL extends methods
    using projection matrix and weight vector. The objective function of ATL is shown
    in equation (12):


    $$

    \min_{p,a} L(p,a) = \sum_{i=1}^{s} p^{ti} \alpha_i - \sum_{j=1}^{t} p^{tj} \alpha_j
    + \lambda_1 \sum_{i,j}^{s} a_{ij} k_{ij} + \lambda_2 \sum_{i,j}^{s} a_{ij} \omega_{ij}

    $$


    $$

    s.t. \quad p^T p=\sum_{i=1}^a \alpha_i, \alpha_i\ge 0 \quad (12)

    $$


    Where $p$ is the projection matrix, which is used to project the data points of
    source and target domain into the common subspace, $a$ is the dimension of common
    subspace, and $\alpha$ is the weight coefficient of source domain. To avoid trivial
    solution, the orthogonal constraint is imposed on projection matrix $p$, so that
    the data points represented by $a$ are discriminative.


