- pgno: 56
  md: 'methods, the two most commonly used are SHAP and LIME. However, these methods
    usually require additional interpretation procedures other than the actual prediction
    models, and they may not be compatible with all types of ML models. To mitigate
    this drawback, explainable boosting machine (EBM) has been introduced recently
    to provide the result interpretation during the prediction process [Liu and Sun,
    2023]. All these three methods have been explained briefly in the following subsections.


    # 3.6.1 Shapley Additive Explanations (SHAP)


    SHAP is a powerful tool used for interpreting the outputs of ML models. It identifies
    which input features have the most significant impact on the model’s predictions.
    Thus, it assists in refining the models via targeted feature engineering by identifying
    which features have the highest contribution. SHAP utilizes several visualization
    techniques such as summary plot, force plot, dependence plot, and waterfall plot
    to help interpret the prediction results. For example, a maintenance engineer
    can see which sensor readings (e.g., vibration, acoustic, temperature, etc.) are
    most influential in predicting machine failure by using SHAP.


    # 3.6.2 Local Interpretable Model-Agnostic Explanations (LIME)


    LIME is an approach that aims to explain individual predictions rather than the
    overall model behavior. By focusing on local explanations for individual predictions,
    LIME provides insights into how specific input features contribute to the model’s
    output, making it easier to interpret and trust the results of the ML algorithms.
    LIME explanations can be visualized by bar chart, decision boundary, and feature
    contribution values. For example, if an ML model predicts an imminent failure,
    LIME can help explain why that specific prediction was made by considering the
    current state of various sensor readings.


    # 3.6.3 Explainable Boosting Machine (EBM)


    EBM is an interpretable ML algorithm that provides human-understandable explanations
    for predictions while maintaining high prediction accuracy. It combines the strengths
    of additive models and boosting techniques to deliver accurate predictions with
    relevant explanations for informed decision-making. For example, in manufacturing
    and energy sectors, EBM can predict equipment failures while simultaneously explaining
    the impact of various sensor readings.


