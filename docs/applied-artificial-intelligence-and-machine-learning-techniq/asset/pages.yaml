- pgno: 13
  md: '# # AI in Communication

    A Chatbot to Practice

    a Clinical Interview in

    Spanish (BOTES)


    Manuel E Cevallos, Steven L Fernandes,

    Carina Cook, Cole J Krudwig,

    and Frances M Nowlen


    # 1.1 INTRODUCTION


    Communication, a complex and multifaceted process, is the cornerstone of human
    existence and knowledge transmission. It involves exchanging information, experiences,
    emotions, and ideas; fostering mutual understanding; and incorporating cultural
    context. More than that, the thread weaves the fabric of our social bonds, connecting
    us and promoting personal growth. Communication is not just a part of human conduct;
    it is a necessity for the survival of society. Its importance is evident in both
    personal and professional domains. Effective communication is not just a skill;
    it’s a key to success in medical, business, and interpersonal relationships, motivating
    us to improve our communication skills constantly [1].


    # 1.1.1 AI IN HEALTH CARE


    The options for artificial intelligence (AI) in health care show a positive trend
    [2]. Chatbots with communication capabilities can answer emails and questions,
    help schedule, and perform other public relations functions in customer service
    related to insurance and the front desk. That interaction can also be done in
    any language. In administration, AI can help to analyze data, prepare reports,
    and summarize meetings.


    Machine learning (ML) can be used as a predictive model to analyze data, develop
    algorithms for patient triage or diagnosis (precision models), and analyze images
    for radiological image interpretation and histological image diagnostics. The
    development of surgical robots for automated procedures such as suturing is an
    example of ML’s capabilities.


    Moreover, natural language processing can interpret and classify clinical charts,
    research analysis and publications, patient interactions, and discharge form interactions.
    It can also translate prescriptions to the patient’s primary language or clarify
    concepts in the maternal language.'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# ## 1.1.2 AI IN HEALTHCARE COMMUNICATION


    AI is revolutionizing healthcare communication. The easy access, low cost, and
    substantial improvements in the last decades are causing AI to be considered as
    part of the design of the current and future healthcare system. However, four
    primary considerations need to be considered before the implementation of AI in
    health care: the integration with some existing healthcare systems, the accuracy
    and reliability of AI (it needs frequent “training” and updates), the human “touch
    factor,” and HIPPA compliance (personal data protection.) The ethical considerations
    in the AI model need to be seriously investigated and addressed before adopting
    the tool [2, 3].


    AI in healthcare communication can enhance patient care, streamline processes,
    and improve outcomes. Here is a comprehensive list of benefits:


    +   1. AI-assisted medical education: It can improve communication skills in training
    for healthcare professionals, interact with patients to discuss disease forms
    and assist them, and give personalized interactions.

    +   2. AI-virtual health assistant and AI-assisted patient monitoring: Interaction
    with the patient can help remind the patient of times for prescription and health
    tracking, interact with elderly patients, avoiding isolation and connecting directly
    with health services for scheduling or emergencies [4, 5].

    +   3. AI-enhanced telemedicine: It is an essential solution for remote patients
    or those with transport limitations, for example. It can incorporate images and
    analyze symptoms. Also, it can be vital since it can translate the language in
    real-time for patient interaction [3].

    +   4. AI-powered chatbots: A chatbot can be accessed 24/7, helping with essential
    information and offering guidance in health. It can be used as part of the triage.

    +   5. Natural language processing: It can enhance voice recognition, understanding,
    and interpretation of human language, which is a skill that complements medical
    transcription, medical coding, and chatbots.

    +   6. Sentiment analysis: It can be related to evaluating emotional voice conversations,
    which helps improve patient communication. It can also assess the characteristics
    of patient feedback and interpret anxiety and depression [6].

    +   7. AI-enhanced patient communication: It facilitates finding information on
    the web and personal health portal, delivers personal messages to healthcare providers,
    and keeps track of appointments and prescription reminders.

    +   8. Language translation: Associated with the chatbots and NLP is the strong
    bond that reduces the language barrier.


    # ## 1.1.3 THE CLINICAL OR MEDICAL INTERVIEW


    The clinical or medical interview is a systematic and standardized questionnaire
    that physicians use to collect patient data, such as chief complaints and characteristics,
    personal and familial medical history, and social components [7]. It is also when
    the physician establishes rapport with the patient by fostering trust, a central
    feature of the physician–patient relationship. This trust is built by behaviors
    in the clinical interview—an interview with clear objectives and solid'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'questions where time is respected, patients’ doubts and questions can be clarified,
    the patient is shown empathy and compassion, and a holistic perception of the
    evaluation is conducted [8–10].


    Medical students from the first year are exposed to this questionnaire to become
    familiar with the questions, the wording of questions, the sequence of questions
    grouped in blocks, pauses and reinforcement in the conversation, and other skills
    to develop rapport and facilitate an exceptional engagement with the patient.


    Individuals with limited English proficiency (LEP) face significant disparities
    in health care, such as reduced understanding of medical diagnoses, lower adherence
    to medication and lifestyle recommendations, increased medication complications,
    and decreased satisfaction with care compared to English-speaking individuals
    [11]. Multiple factors, such as migration, lack of adequate medical training,
    insufficient number of certified medical interpreters, and others, are associated
    with the health disparity [12]. For example, when the migration factor is included
    as a determinant of health, Maldonado et al. cited in their article: “Mexican
    immigrants are 18% more likely to have limited access to care, and undocumented
    immigrants are 45% more likely to be uninsured, compared to US citizens” [13].


    Providing language-concordant care, where patients and their physicians communicate
    in the same language, can help overcome these language barriers [14]. In 2023,
    Mustafa et al. highlighted six identified themes related to a language barrier
    in the doctor–patient relationship: frustration, lack of rapport, trust issues,
    patient dissatisfaction, compliance issues, and threat to patient safety [15].


    # 1.1.4 POPULATION DEMOGRAPHICS


    The Hispanic population in Phoenix, Arizona, is 2.27% higher than the U.S. national
    average [16–19]. Also, 30.6% of Phoenix residents reported speaking Spanish at
    home [20]. However, only 6% of physicians identify as Hispanic, and only 2% of
    non-Hispanic physicians speak Spanish in the United States [21]. This imbalance
    is a solid language barrier in the clinical interview process. It produces anxiety
    and frustration for students, physicians, and patients about inclusive patient
    safety (because they cannot clearly understand recommendations and prescriptions)
    [22].


    Understanding the demographics of Phoenix, Arizona, the Spanish Clinical Skills
    Club at Creighton University is a club for health students interested in learning
    and practicing medical interviews in Spanish. It has medical students of different
    years and physician assistant students and accepts all levels of Spanish-speaking
    members. Their mission is to decrease the language barrier gap.


    Generative artificial intelligence is a powerful new tool that can be adapted
    to medical education. A type of generative AI is the chatbot, a computer program
    that engages in conversation with users. For example, Baglivo et al. described
    the efficacy of an AI chatbot in answering questions related to vaccination and
    providing educational support [23]. AI chatbots can also be used to teach languages
    [24–27].


    # 1.2 PURPOSE


    We developed a chatbot in Spanish (BOTES) using generative artificial intelligence
    that plays the role of the patient so that the students can practice the interview
    in'
