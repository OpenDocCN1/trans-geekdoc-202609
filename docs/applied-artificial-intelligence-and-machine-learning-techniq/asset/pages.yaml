- pgno: 1
  md: '# Applied Artificial Intelligence and Machine Learning Techniques for Engineering
    Applications


    This book presents various machine learning applications in the field of engineering
    with a focus on deep learning-based machine learning approaches. It examines the
    relationship between three different multidisciplinary engineering branches: biomedical
    engineering, signal processing, and computer science.


    Applied Artificial Intelligence and Machine Learning Techniques for Engineering
    Applications explores recent advancements in the use of AI/ML in practical engineering
    applications by inviting top experts to share the outcomes of their most recent
    work. Among the topics explored are detection, measurement, and monitoring of
    signals (biosensors and biomedical devices) and the use of diagnostic interpretations
    of bioelectric data using signal-processing techniques. The authors also address
    several machine learning tasks, such as classification (supervised learning) and
    clustering (unsupervised learning), in the context of engineering. Finally, the
    book also describes the development of new biomaterials for use in the body.


    The book will be a great help to researchers and academics working in the fields
    of biomedical signaling and/or human-machine interface.'
  merge: -1
  img_proc: true
