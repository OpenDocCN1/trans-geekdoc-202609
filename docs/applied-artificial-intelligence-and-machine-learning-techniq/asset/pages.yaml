  md: 'involving chemical compounds and biological activities. Researchers can improve
    the reliability of their discoveries by addressing common issues, such as missing
    values, duplicate entries, and irrelevant features.


    # 8.2.1.2.1 Removing Duplicates


    Duplicates can arise from combining numerous datasets or due to repeated records
    of the same compound. Duplicate entries can misrepresent results by over-representing
    certain data points, particularly in statistical analysis or machine learning
    models. Removal of duplicates typically involves finding and deleting records
    with similar chemical identifiers, such as SMILES strings or InChI keys, which
    illustrate the molecular structure exclusively. Careful inspection confirms that
    only redundant records are removed without losing important information (Spelmen
    & Porkodi, 2018).


    # 8.2.1.2.2 Handling Missing Values


    Missing values in datasets comprising bioactivity data are quite common, normally
    due to insufficient experimental outcomes or limitations in evaluating certain
    properties for all compounds. Numerous approaches are there to handle missing
    data:


    +   - **Deletion:** Rows with missing values may be omitted if the missing data
    is minimal.

    +   - **Imputation:** If the data is large and random missingness is assumed then
    methods like mean, median, or model-based imputation can be used to approximate
    missing values.

    +   - **Advanced Techniques:** For datasets with widespread missing values, approaches
    like model-based imputations (e.g., regression or expectation-maximization algorithms)
    or k-nearest neighbors (KNN) imputation can help preserve integrity of dataset
    without presenting bias (Little & Rubin, 2019).


    # 8.2.1.2.3 Filtering Irrelevant Compounds or Features


    Not all compounds or features are pertinent to the objectives of study. Unrelated
    compounds, such as those with non-target biological activity or molecules outside
    the intended molecular weight range, can limit the quality of downstream analysis.
    Moreover, irrelevant features (e.g., variables not related to the compound’s activity
    in a particular analysis) should be filtered out to rationalize analysis and prevent
    computational inefficiencies. Feature selection algorithms, such as recursive
    feature elimination (RFE) or variance thresholding, can help recognize and retain
    only the most relevant variables (Hastie et al., 2009).


    # 8.2.1.2.4 Ensuring Data Consistency and Integrity


    Consistency across the dataset is essential, particularly in multicenter studies
    where data may have been collected or labeled differently. This step involves
    the following:


    +   - **Standardizing Units and Formats:** Standardizing chemical identifiers
    (InChI or SMILES) and converting values to a uniform scale (e.g., µM for IC50
    values).

    +   - **Verifying Compound Identity:** To confirm that each compound is labeled
    properly and can be recognized, repeatedly by cross-referencing with databases
    like ChEMBL or PubChem.'
