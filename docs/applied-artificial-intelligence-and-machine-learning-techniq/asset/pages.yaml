    # 5.3.4 FEATURE SELECTION


    Feature selection is a critical process in building effective machine learning
    models, particularly in the field of medical imaging where the datasets can contain
    a high dimensionality of features. It involves selecting a subset of relevant
    features to use in model construction, which enhances model interpretability,
    reduces overfitting, and improves prediction performance.


    # 5.3.4.1 Feature Selection Techniques


    In this study, we apply several feature selection techniques to identify the most
    informative radiomic features from the extracted data. These techniques include
    principal component analysis (PCA), mutual information (MI), and the least absolute
    shrinkage and selection operator (LASSO).


    # 5.3.4.1.1 Principal Component Analysis (PCA)


    PCA is a dimensionality-reduction method used to reduce the complexity of data
    while retaining as much variability as possible. It transforms the original variables
    into a new set of variables, which are linear combinations of the original variables
    and are orthogonal to each other.


    The transformed variables (principal components) are ordered so the first few
    retain most of the variation present in all of the original variables.


    Mathematically, PCA involves the eigen-decomposition of the covariance matrix
    of the data or the singular value decomposition (SVD) of the data matrix itself.
    Given a data matrix X with zero empirical mean (the mean of each variable has
    been shifted to zero), the PCA transformation is defined as presented in Equation
    5.12.


    $P_{GLSZM}(i, j) = \text{Number of zones of size } j \text{ for pixel intensity
    } i \quad (5.12)$'
