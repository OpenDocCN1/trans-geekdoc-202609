    # 9.2.3 Stability: Energy Function


    Sengupta et al. (2024) have explored an energy function formulation to investigate
    stability of different varieties of neural networks. We use the same formalism
    here to explore the stability of the network proposed here. The energy function
    (H) is constructed as


    \(H = \sum \int dH_i \propto \sum \int \dot{x_i} d\dot{x_i}\) \tag{9.13}


    Using Equations 9.2 and 9.7, we can write (upon substituting \(a = B + D - nD\)
    ):


    \(d\dot{x_i} = -d\dot{x_i} \left(1 + nf(x_i)\right) - (B - x_i) \frac{f(x_i)}{x_i}
    d\dot{x_i}\)

    \(= -d\dot{x_i} \left[ a \frac{f(x_i)}{x_i} + (B - x_i) \left( \frac{f(x_i)}{x_i}
    \right)^2 \right]\) \tag{9.14}


    Now using Equations 9.13 and 9.14, we can write after substituting \(B - x_i =
    a''\) at steady-state following Equation 9.9,


    \(dH_i = \dot{x_i} d\dot{x_i} = - \left[ a \frac{f(x_i)}{x_i} + a'' \left( \frac{f(x_i)}{x_i}
    \right)^2 \right] \dot{x_i}^2 dt\) \tag{9.15}


    The Lyapunov function thus constructed will be on a decreasing slope if the following
    condition holds


    \(a''(1 + n) + a(a + n) \geq 0\) \tag{9.16}


    By similarity of the form for both stability conditions we can ascertain that
    the differences between Equations 9.12 and 9.15 are due to the fact that the later
    also accounts for winner-take-all (WTA) dynamics that are excluded from the former.
    In fact, it is self-evident that if Equation 9.15 is satisfied it also ensures
    the non-divergence criterion given in Equation 9.12.


    # 9.2.4 Comparing Stability Conditions


    The non-divergence condition is given by the inequality


    \((B + D)(1 + n) + a(a + n) \geq 0\)


    where \(a = B + D - nD\) and \(n\) represents the number of neurons with positive
    activations. For the condition to be violated, the inequality must be reversed,
    i.e.,'
  merge: -1
  img_proc: true
- pgno: 141
  md: '$$(B + D)(1 + n) + a(a + n) < 0$$


    Substituting $a = B + D - nD$, the inequality becomes


    $$(B + D)(1 + n) + (B + D - nD)(B + D - nD + n) < 0$$


    This inequality provides the threshold where the network becomes unstable. If
    this inequality is violated, the network will not maintain stable activations,
    leading to divergence.


    The Lyapunov stability condition is derived from the energy function and can be
    expressed as


    $$a''(1 + n) + a(a + n) \ge 0$$


    where $a'' = B - x[n]$, and $x[n]$ is the steady-state activation of neurons with
    positive activations.


    For instability to occur, this condition is violated when


    $$a''(1 + n) + a(a + n) < 0$$


    Expanding $a'' = B - x[n]$, the inequality becomes


    $$(B - x[n])(1 + n) + (B + D - nD)(B + D - nD + n) < 0$$


    This provides the threshold where the system fails to satisfy Lyapunov stability.
    If this inequality holds, the system will become unstable and diverge from its
    equilibrium state.


    Both the non-divergence and Lyapunov stability criteria are necessary for ensuring
    the stability of the shunting network. However, the Lyapunov condition is more
    stringent, as it takes into account the network''s energy function and can fair
    under more restrictive scenarios compared to the non-divergence condition. By
    comparing these two inequalities, we can identify parameter regimes where the
    network might diverge or fail to maintain stability. In particular, certain combinations
    of $B$, $D$, and $n$ may satisfy one condition but not the other, providing insight
    into the network''s robustness under varying input conditions.


    The non-divergence condition (Equation 9.12) is more stringent and depends primarily
    on global network parameters $B$, $D$, and the number of active neurons $n$. The
    Lyapunov stability condition (Equation 9.15) introduces an additional local factor
    $a'' = B - x[n]$, which depends on the actual activation level $x[n]$ of the neurons.
    This adds more nuance and can lead to cases where the system seems stable in the
    Lyapunov sense but does not satisfy the global non-divergence condition.


    For the Lyapunov condition to be satisfied while the non-divergence condition
    is not:


    +   - **Lyapunov condition** depends on the local activation $x[n]$ and can be
    satisfied even if the network''s global inhibitory effects are significant.

    +   - **Non-divergence condition** depends on global network parameters $B$ and
    $D$ and becomes stringent with a large number of active neurons $n$.'
