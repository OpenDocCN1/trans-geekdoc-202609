    # 10.2.2.3 Tokenization


    Tokenization is one of the most important processes. When ChatGPT is provided
    with an input, these inputs are divided into smaller inputs called tokens. These
    tokens can be characters, sub-words or words of a sentence. For example, the input
    “Sky is blue” might be tokenized as ["Sky”, “is”, “blue”]. The role of tokenization
    in decoding the input is text segmentation, vocabulary creation, input encoding,
    handling out-of-vocabulary words, sequence length management and efficient computation
    as shown in Figure 10.3.


    +   - Text Segmentation: Tokenization is the process of breaking down the input
    into smaller tokens. These tokens can be characters, sub-words or words. Tokenization
    provides a structured representation of the input, enabling the model to process
    it systematically.

    +   - Vocabulary Creation: The large text data processing is not efficient. Tokenization
    creates a dictionary or vocabulary of tokens for the model. Each token is assigned
    a numerical value that is used in training and inference to process the input.
    Using numerical values instead of text-based tokens improves the computational
    efficiency of the model.

    +   - Input Encoding: After tokenization, the input text is encoded by mapping
    each token to its corresponding numerical representation from the vocabulary.
    This encoding allows the model to interpret the input as a sequence of numbers,
    which can be efficiently processed by the neural network. The encoded tokens serve
    as input to the model''s layers and operations.

    +   - Handling Out-of-Vocabulary Words: Tokenization helps deal with out-of-vocabulary
    (OOV) words, which are words not present in the model''s vocabulary. When encountering
    an OOV word, the tokenization process typically breaks it down into sub-words
    or characters that are part of the'
