- pgno: 86
  md: '# ## 5.4.2 DECISION TREES (DT)


    Decision trees classify instances by sorting them down the tree from the root
    to some leaf node, which provides the classification of the instance. Each node
    in the tree represents a feature in an instance to be classified, and each branch
    represents a value that the node can assume.


    The decision of making strategic splits at each node is based on a criterion like
    Gini impurity or entropy, calculated as shown in Equation 5.18 and 5.19.


    ```

    Entropy(S) = -\sum_{i=1}^n p_i log_2 p_i \quad (5.18)

    ```


    ```

    Gini(S) = 1 - \sum_{i=1}^n p_i^2 \quad (5.19)

    ```


    where _p<sub>i</sub>_ is the proportion of the samples that belong to class _i_
    in a given subset S.


    # ## 5.4.3 RANDOM FORESTS (RF)


    Random forests build upon decision trees through ensemble learning. It creates
    a forest of uncorrelated trees to make more robust predictions. The decision by
    the forest is made based on the majority votes from all the trees.


    Formally, given a set of _N_ training samples, RF induces a collection of _k_
    decision trees {_T_<sub>1</sub>, _T_<sub>2</sub>, ... _T<sub>k</sub>_ }, where
    each tree _T<sub>i</sub>_ is trained on a bootstrap sample drawn from the original
    training data. Each tree casts a unit vote for the most popular class at input
    _x_.


    # ## 5.4.4 K-NEAREST NEIGHBORS (K-NN)


    K-NN is a type of instance-based learning, or lazy learning, where the function
    is only approximated locally and all computation is deferred until function evaluation.
    The basic algorithm uses Euclidean distance, though other distances can be used
    based on the problem context as shown in Equation 5.20.


    ```

    d(x, x'') = \sqrt{\sum_{i=1}^n (x_i - x_i'')^2} \quad (5.20)

    ```


    where _x_ and _x_’ are two points in Euclidean n-space.


    # ## 5.4.5 ARTIFICIAL NEURAL NETWORKS (ANN)


    ANNs are inspired by biological neural networks and consist of an input layer,
    multiple hidden layers, and an output layer. Each neuron in one layer connects
    with a certain weight _w_ to neurons in the following layer. The weights are learned
    during training by minimizing a loss function, typically using backpropagation.'
