  md: '# 4.2.3 Molecular Representation


    In machine learning, fingerprints are numerical representations of molecular structures
    and properties, enabling the analysis and comparison of molecules. Structural
    fingerprints, such as MACCS and Morgan, encode molecular information into a format
    that can be processed by algorithms [12]. These fingerprints are used in various
    applications, including virtual screening to identify potential drug candidates,
    QSAR modeling to predict biological activity, molecular similarity searching,
    and clustering/classification to group molecules by similarity or activity [13].
    By leveraging fingerprints, machine learning models can efficiently process and
    analyze large molecular datasets, accelerating drug discovery and development
    [14].


    MACCS (molecular access system) encodes molecular structure and properties into
    a 166-bit binary vector. MACCS is a widely used fingerprinting method in cheminformatics
    and drug discovery. In this, four different fingerprints were chosen. Utilizing
    a hashing algorithm, MACCS captures various molecular features, including atom
    types and counts, bond types and counts, ring systems and connectivity, and functional
    groups and fragments [15].


    Morgan fingerprints, specifically Morgan 2 and Morgan 3, are circular fingerprints
    that capture molecular structure and atom neighborhoods, providing a more comprehensive
    representation of molecular topology [16].


    A substructure fingerprint is a type of molecular fingerprint that identifies
    the presence of specific substructures or functional groups within a molecule.
    This fingerprinting method breaks down a molecule into its constituent parts,
    such as rings, chains, and functional groups, and generates a binary vector indicating
    the presence or absence of each substructure [17]. Machine learning models were
    built here with these fingerprints to choose the best with the best performing
    model.


    # 4.2.4 Machine Learning Models Construction


    Machine learning models were built for each of the four fingerprints, making it
    32 models with each peptidase enzymes-ligands dataset. Eight ML algorithms were
    generated using the prepared enzymes bioclass dataset. To create ML models, Google
    Colab Notebook was used. First, the necessary Python packages were imported onto
    the workspace, including Matplotlib, RDKit, sklearn, and others. Subsequently,
    the following models were accessed to predict the status of breast cancer.


    # 4.2.4.1 Random Forest Classifier


    This is an ensemble technique for machine learning that makes multiple decision
    trees based on random subsets of data for the purpose of classifying, regressing,
    and more [18].


    # 4.2.4.1.1 Logistic Regression


    Logistic regression focuses on the relationship between a predictor variable and
    an outcome variable that would have applications in predicting binary or multi-class
    outcomes and thus is an important technique in health care and beyond [19].'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# 4.2.4.1.2 Naïve Bayes (NB)


    The simplest Bayesian network model is built on the application of the Bayes theorem
    to produce “probabilistic classifiers” or, in other words, supervised machine
    learning methods [20].


    # 4.2.4.1.3 Gradient Boosting


    This machine learning method, called gradient boosting of trees, uses pseudo-residuals
    as targets, distinguishing it from other methods of boosting. It uses functional
    space boosting to create a strong ensemble by combining many weak prediction models,
    usually simple decision trees [21].


    # 4.2.4.1.4 Extreme Gradient Boosting (XGB)


    XGB is an ensemble method that builds on gradient boosting, incrementally adding
    models while adjusting the learning rate [22].


    # 4.2.4.1.5 K-Nearest Neighbors (KNN)


    K-nearest neighbors, in simple terms, is a non-parametric, simple, machine learning
    algorithm that is applicable to both regression and classification problems [23].


    # 4.2.4.1.6 AdaBoost Classifier


    It gathers the incorrectly classified data points and gives them greater weights.
    In the ensuing iterations, there was close monitoring of higher-weighted data
    points. Until a lower error rate was achieved, this process was repeated [24].


    # 4.2.5 Feature Selection and Model Optimization


    Morgan 2 fingerprint and random forest were chosen as the best model for further
    analysis due to their superior performance. Feature selection was performed using
    random forest to reduce dimensionality and enhance model interpretability. Optuna
    was employed to optimize the hyperparameters of the RF model with 5000 steps.
    The final models were generated based on the best parameters obtained from the
    optimization process.


    # 4.2.6 Model Evaluation


    The optimized models were evaluated using metrics such as precision, accuracy,
    recall, F1 score, ROC, AUC, and MCC to assess their predictive capabilities on
    the blind dataset.


