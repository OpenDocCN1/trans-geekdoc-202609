    # FIGURE 6.2 Proposed CNN architecture.


    with various filters are used to create a set of representation maps, which are
    then subjected to a non-linearity function and batch normalization. We have incorporated
    rectified linear unit (ReLu) as non-linearity function to normalize the input
    image pixels. For subsampling and dimension reduction purposes the max-pooling
    layer is used with a filter size of 2× 2. More condensed features, which have
    considerably fewer dimensions than the previous ones, can be extracted by the
