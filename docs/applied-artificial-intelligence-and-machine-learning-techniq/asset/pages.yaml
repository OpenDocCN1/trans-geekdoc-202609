  md: '# 4 Harnessing Machine Learning for Peptidase Inhibitor Prediction in Therapeutic
    Discovery


    Aminu Jibril Sufyan, Muthu Kumar Thirunavukkarasu, Aliyu Zainulabidin Ashiru,
    and Rakesh Sengupta


    # 4.1 INTRODUCTION


    Enzymes are biological molecules, which are most commonly proteins, speeding up
    chemical reactions in living organisms. Since the processes include metabolism,
    DNA replication, and protein synthesis, they are essentially elementary to a living
    organism''s survival. Highly selective and efficient enzymes accelerate chemical
    reactions without undergoing an alteration in the process themselves [1]. This
    is why their dysregulation plays such a significant role in preventing diseases.
    As biomarkers, the enzymes can act as useful diagnostic markers for disease as
    well as disease monitoring and treatment [2]. Diseases like cancer, diabetes,
    or neurological disorders may be indicated by changes in levels or activities
    of enzymes [3]. This is due to their specificity, druggability, and biomarker
    potential, which make them attractive targets for controlling diseases. This process
    can be modulated using small molecules, antibodies, or other therapeutic agents.
    Thus, enzymes form an excellent target for the treatment of any disease [4]. A
    bioclass of enzymes comprises functional groups of enzymes that exhibit analogous
    properties, such as substrate specificity, reaction mechanisms, or biological
    processes. Understanding this bioclass may lead to the identification of potential
    therapeutic targets [5]. Specific targets in disease mechanisms have become prevalent
    with enzyme bioclasses such as peptidases. In general, the specific enzymes offer
    specific targets for therapeutic intervention [6]. Targeting these enzymes can
    lead to effective treatments of metabolic disorders and cancer as well as inflammatory
    diseases, neurological disorders, and infectious diseases [7].


    Peptidases is a key group of proteolytic enzymes, a target for treating cancer,
    cardiovascular diseases, and infectious diseases, taking part in the breakdown
    and processing of proteins. Enzymes break down proteins to regulate many cellular
    processes. Peptidase dysregulation leads to disease and can be targeted for effective
    treatments [8].'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'By understanding such functions and regulations of this enzyme, individuals
    in research may look forward to developing the appropriate disease diagnosis,
    treatment, and prevention strategy. Thus, the aforementioned highlighted importance
    of enzymes in disease control clearly points to an area where researchers should
    continue their exploration of the functions, regulations, and therapeutic potential
    as targets for intervention [9].


    It is, therefore, important to design drugs that interact with enzymes in the
    inhibition of enzyme activity associated with diseases. Such computational methods
    such as machine learning (ML) models used for predicting enzyme inhibition are
    found valuable by pharmaceutical companies and other industries [10]. Our study
    extends related models with comprehensive machine learning models, predicting
    ligand activity of the specific enzymes peptidase bioclass.


    These models enable the predictions of ligand activity on broad scales of peptidase
    enzyme bioclass that will lead to quick identification of potential inhibitors
    and accelerates drug discovery. Contrasting with the current machine learning
    models that have narrow coverage and limited accuracy and are not comprehensive
    enough, our work intends to revolutionize the prediction of enzyme inhibition
    by offering a model specifically for peptidases [11].


    This approach will enable researchers to quickly and reliably identify potential
    inhibitors for the vast variety of peptidase enzymes, thereby accelerating drug
    discovery and opening new avenues of treatment that could cure several diseases.
    This work by us will hopefully catalyze a revolution in drug discovery in general
    and human health in particular.


    # 4.2 MATERIALS AND METHODS


    # 4.2.1 DATASET RETRIEVAL


    Ligands associated with the peptidase enzyme bioclass were downloaded from the
    Therapeutic Target Database (https://db.idrblab.net/ttd/full-data-download). The
    datasets retrieved contain target information, drug information, cross-matching
    IDs between TTD drugs and public databases, synonyms of drugs and small molecules
    in TTD, and target-to-compound mappings with activity data.


    # 4.2.2 DATASET PREPARATION


    All ligands showing activity on the peptidase enzyme bioclass were prepared as
    a dataset for machine learning models creation. This bioclass contains 200 various
    peptidase enzymes, with a total number of 56,903 ligands showing activity on these
    enzymes. After duplicate removal, 31,224 unique ligands were saved. The dataset
    was constructed by means of SMILES of the ligands; they were divided into two
    categories according to their IC50 values: ligands, for which IC50 <1000 nM, were
    marked as active (1), and those with IC50 >1000 nM were marked as inactive (0).
    The quantities of the resulting active and inactive ligands amount to 14,384 and
    16,840, respectively. PubChem IDs have been used for retrieving the corresponding
    SMILES in the PubChem database.'
