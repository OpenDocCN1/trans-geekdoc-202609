  md: '# 2.3.2 MODEL TRAINING AND ARCHITECTURE


    InceptionV3, Xception, VGG19, LSTM, and ResNet50 are implemented on the data.
    This deep learning model is known for its robust performance. The training data
    for the model is 80% of the data, with the remaining data divided into validation
    and test data. The information is preprocessed, features are extracted, and the
    technique used is transfer learning model. The model is optimized with Adam optimizer
    and extracts the required features from the image. Max pulling and flattening
    layers are applied, converting the images to single dimension images. This representation
    is passed through convolution layers. The model comprises 32 layers, ultimately
    producing the final output. During the training process, the validation accuracy,
    validation loss, and model accuracy for each epoch are obtained. The model is
    trained for 100 epochs. Overfitting can occur due to large datasets or other factors.
    To address this, dropout functions are employed, which drop some layers during
    training, and L2 regularization is used to prevent overfitting. These techniques
    help to improve accuracy. Figure 2.1 shows the eight disease data groups considered.
    Figure 2.2 shows the workflow of the model architecture, and Figure 2.3 shows
    the architecture configuration of developed deep learning methodology. Figure
    2.4 gives the details of implementation of deep learning models.


    The validation data is used to assess the model, and the model''s applicability
    is assessed by the accuracy given by the graph obtained using validation data.


    An advanced deep learning set of rules is offered by the mathematical model represented
    as Equation 2.1. To address the vanishing gradient problem encountered during
    the training of very deep neurons, residual blocks are utilized, making it easier
    to examine residual functions rather than directly attempting to learn preference
    map interpolation.


    ```

    y = F(x) + W2 / sigma(W1 + b1) + b2              (2.1)

    ```


    Here''s a breakdown of the elements:


    +   • x: Input to the block.

    +   • W1 and W2: Learnable weight parameters.

    +   • b1 and b2: Bias terms.

    +   • sigma: SoftMax Activation function.

    +   • F(x): Represents the residual mapping that the block aims to learn.

    +   • H(x) = W2sigma(W1x + b1) + b2: Denotes the learned residual mapping.

    +   • y: Output of the block.


