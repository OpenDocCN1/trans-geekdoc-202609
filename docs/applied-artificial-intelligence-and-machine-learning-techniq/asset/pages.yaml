    # ## 5.4.1 SUPPORT VECTOR MACHINE (SVM)


    SVM is a powerful classifier that works by finding a hyperplane in an N-dimensional
    space that distinctly classifies the data points. For non-linearly separable data,
    SVM uses a kernel function to transform the data into a higher dimension where
    a hyperplane can be used for separation.


    Given training vectors \( x_i \in R^n \), i=1,..., 1 in two classes, and a vector
    \( y \in \{1, -1\}^l \), SVM solves the following optimization problem as shown
    in Equation 5.15.


    ```

    \( min_{w,b,\xi} \frac{1}{2} w^\top w + C \sum_{i=1}^l \xi_i \)

    ```


    subject to Equations 5.16 and 5.17.


    ```

    \( y_i \left( w^\top \phi(x_i) + b \right) \ge 1 - \xi_i \)

    ```


    ```

    \( \xi_i \ge 0 \)

    ```


    where \( \phi(x_i) \) denotes a kernel function that maps \( x_i \) into a higher-dimensional
    space, and \( C \) is the penalty parameter.'
