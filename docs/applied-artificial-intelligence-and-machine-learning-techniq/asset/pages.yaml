    delivering an F1 score of 90.42%, a precision of 89.54%, a recall of 91.33%, and
    an accuracy of 90.33%. These metrics reflect LightGBM''s capacity to achieve equilibrium
    between precision (minimizing false positives) and recall (reducing false negatives),
    which is crucial for diagnostic accuracy in a medical context. The high accuracy
    achieved by LightGBM suggests that this classifier is well-suited for this task,
    indicating its potential for broader clinical application.


    The proposed strategy for detecting early Parkinson''s disease utilizes speech
    features and transfer learning mechanisms, which have potential, but there are
