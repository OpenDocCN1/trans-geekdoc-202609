    # 3.5.4 Model Deployment in Predictive Maintenance


    Model deployment is the final step in developing a predictive maintenance system.
    The trained ML or DL model is moved from the development environment to the production
    environment to make real-time predictions. The deployed model must be capable
    of handling continuously evolving data and conditions. Proper deployment of the
    PdM model can significantly reduce downtime, improve operational efficiency, and
    lower maintenance costs. The deployment architectures can be broadly classified
    into three types, which are discussed as follows:


    +   (i) Edge Deployment: The model is deployed on local edge devices, such as
    microcontrollers and embedded systems present in the sensor nodes. The data analysis
    is done locally, largely reducing the latency, transmission power requirement,
    and bandwidth usage. However, the models must be lightweight to be successfully
    deployed on resource-constrained edge devices.


    +   (ii) Cloud Deployment: The model is deployed on a cloud server/infrastructure
    (e.g., AWS, Azure, Google Cloud, etc.), making it easily usable for large


