  md: '# 10.2.2.7 Iterative Decoding


    Being a generative AI model, ChatGPT generates responses iteratively. It begins
    from the start token and predicts the next token based on the context and previous
    tokens. It continuously iterates until it reaches the end token. When the end
    token is reached, it stops iterations, and the response is complete.


    # 10.2.2.8 Probability Distribution


    At each decoding step, the model assigns a probability distribution over the vocabulary
    for the next token. This prediction is derived from the output of the final layer
    of the transformer model. Prediction of the next token is based on probability
    distribution. For example, the model may assign a higher probability to the word
    water “carbon dioxide” when it is prompted by respiration in humans.


    # 10.2.2.9 Sampling Strategy


    ChatGPT uses greedy sampling, nucleus sampling and temperature sampling methods
    to decode during decoding. In greedy sampling, the model selects the token with
    highest probability. This strategy favors high-confidence predictions but can
    lead to repetitive or overly deterministic responses. Top-k sampling limits the
    selection of tokens to a predefined subset, where k represents a cumulative probability
    threshold. The model samples from the smallest set of tokens that together account
    for at least threshold probability. This technique introduces diversity and reduces
    the chance of repeating the same response. Temperature scaling is another strategy
    used during decoding. It introduces a temperature parameter that controls the
    randomness of the sampling process. Higher temperatures (above 1.0) encourage
    the model to explore a wider range of tokens, leading to more diverse and creative
    responses. Lower temperatures (below 1.0) make the sampling process more focused
    and deterministic, generating more conservative and precise responses. Adjusting
    the temperature can impact the balance between exploration and exploitation in
    the model''s response generation.


    # 10.2.2.10 Response Generation


    This is the final stage of the algorithm. ChatGPT generates responses based on
    probability distribution and the chosen sampling strategy. The model selects the
    next token and continues generating the response. This process repeats until an
    end token is generated or maximum response length is reached.


    # 10.2.2.10.1 Workflow of ChatGPT


    The workflow of ChatGPT can be categorized into six process, namely, user’ prompt,
    model response, user follow-up, model response, iterative conversation and interactive
    back and forth as depicted in Figure 10.4.


    # 10.2.2.11 User Prompt


    The conversation between a user and ChatGPT begins with the user’s prompt or query.
    The prompt or query is a text-based input for the model. For example, “What are
    the effects of global warming?”'
