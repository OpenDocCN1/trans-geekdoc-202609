    | Criteria | Fault Detection | Fault Prognosis |

    |---|---|---|

    | Objective | Detect faults in real-time after they occur | Estimate the time
    before a fault occurs or predict future degradation |

    | Model Type | Classification | Regression |

    | Data Type | Labeled data | Historical time-series data |

    | Time Horizon | Short-term analysis | Long-term analysis |

    | Model Complexity | Usually simpler | More complex |

    | Interpretability | Easily interpretable | Harder to interpret |

    | Decision-Making | Reactive | Proactive |

    | Algorithms Used | Decision trees, SVM, random forest, etc. | SVR, GPR, LSTM,
    etc. |

    | Evaluation Metrics | Confusion Matrix, Accuracy, F1 score, etc. | RMSE, MAE,
    AE, RUL accuracy, etc. |


    Notes: SVM: support vector machine; SVR: support vector regressor; GPR: Gaussian
