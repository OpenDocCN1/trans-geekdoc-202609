    # 1.4 RESULTS


    The participation rate in the satisfaction survey was 31% in this beta-test application.
    The overall grade was 75% satisfaction. Four characteristics of the application
    were evaluated using a scale of 1 to 5, where one was the lowest and five was
    the highest: (a) improving memorization, (b) students’ confidence, (c) reducing
    stress in the learning process, and (d) helping to practice the questions more
    frequently. The average results for each area were 5, 4.67, 4.33, and 4.67, respectively
    (Figure 1.3).


    The positive comments were the opportunity to practice conducting interviews in
    Spanish at any time, the possibility to practice medical Spanish comprehension,
    and the possibility to modify the clinical case according to the topic to evaluate
    (Figure 1.4). 100% of participants were willing to use BOTES in the future.


    We have developed a sentiment analysis system that utilizes natural language processing
    techniques to assess and visualize sentiment in textual data. The process begins
    with consolidating feedback comments associated with specific questions into a
    single list. The distilbert-base-uncased-finetuned-sst-2-english pre-trained sentiment
    analysis model from the transformer’s library evaluates these comments, generating
    sentiment labels (e.g., Positive, Negative) and sentiment scores. A sentiment
    score is a numerical value representing the confidence level of the assigned'
