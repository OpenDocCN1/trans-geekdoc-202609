  md: '# 9 Stability Analysis of Recurrent Shunting On-Center Off-Surround Neural
    Networks with Nonlinear Transfer Functions An Energy Function Approach


    Rakesh Sengupta and Usha Desai


    # 9.1 INTRODUCTION


    Previous researchers (Sengupta, Bapiiraju, and Pattanayak, 2024) developed a stability
    analysis method, which can be applied to recurrent shunting on-center off-surround
    neural networks with less than linear transfer function. This method can be used
    to analyze the stability of the network under various parameters, as demonstrated
    by Rajmakers, Van Der Maas, and Molenaar (1996) in a distance-dependent on-center
    off-surround shunting neural network. The method can also be extended to stochastic
    discrete-time recurrent neural networks with time-varying delays, as shown by
    Hou et al. (2013), and to switched neural recurrent neural networks, as demonstrated
    by Jie, Yanli, and Kai (2012). These studies collectively highlight the versatility
    and applicability of the stability analysis method in different types of neural
    networks.


    In this chapter, we present a novel application of a stability analysis method
    developed in previous work to investigate the dynamics of a recurrent shunting
    on-center off-surround neural network characterized by a less than linear transfer
    function (Grossberg, 1968). The network architecture under scrutiny exhibits dynamics
    important for understanding various cognitive processes, making it a subject of
    interest for computational neuroscience and artificial intelligence research (Sengupta,
    Surampudi, and Melcher, 2014; Verma and Sengupta, 2023). By employing our'
  merge: -1
  img_proc: true
- pgno: 137
  md: 'stability analysis method, we aim to provide insights into the behavior of
    such networks, shedding light on their stability properties and potential implications
    for information processing in biological and artificial systems. This investigation
    holds promise for elucidating fundamental principles underlying neural computation
    and may inform the design and optimization of neural-inspired algorithms for diverse
    applications ranging from pattern recognition to short-term memory (Sengupta et
    al., 2024; Vindhya et al., 2024).


    While previous studies have focused on various applications of stability analysis
    methods to different forms of recurrent neural networks (Cohen and Grossberg,
    1983), there remains a gap in the application of such methods to networks with
    sigmoid-like activation functions, particularly in the context of shunting models.
    Shunting recurrent networks, with their inherent balance between excitatory and
    inhibitory interactions, present a unique challenge for stability analysis, especially
    under complex input conditions like sequential and transient inputs. These networks
    are crucial for simulating cognitive functions such as working memory and attention,
    where dynamic responses to stimuli over time play a key role. Our work aims to
    address this gap by integrating both classical analytical stability conditions
    and Lyapunov-based approaches to provide a more robust understanding of the network’s
    stability. This is especially important in scenarios where large input sets may
    drive networks toward instability, as in the case of additive models prone to
    catastrophic inhibition. The findings from this study will contribute to a deeper
    understanding of the dynamic behavior of shunting networks and their relevance
    to modeling biological memory and cognitive systems.


    # 9.2 METHODS


    A recurrent on-center off-surround shunting neural network with N nodes can be
    described by the following dynamical equation:


    ```

    dot{x} = \frac{dx_i}{dt} = -Ax_i + (B - x_i)\left(\sum_{k=1}^N C_{ki}f(x_k) +
    I_i\right) - (D + x_i)\sum_{k \neq i}^N E_{ki}f(x_k) \quad (9.1)

    ```


    +   - x_i : Represents the membrane potential or activation level of the i -th
    neuron in the network. It is a function of time t .

    +   - A: Represents the decay rate of the membrane potential of neuron i. It influences
    how fast the membrane potential of neuron i returns to its resting state in the
    absence of external input. It is generally kept at 1 to simulate biological neurons
    (Usher and Cohen, 1999).

    +   - B: Represents the baseline or resting level of activation potential that
    neuron i tends to approach in the absence of external input.

    +   - C_{ki} : Represents the weight of the excitatory connection from neuron
    k to neuron i. It influences how much the activation level of neuron i is influenced
    by the activation levels of other neurons in the network.

    +   - f(x_k) : Represents the activation function of neuron k, which is applied
    to its membrane potential x_k . This function typically introduces nonlinearity
    into the network dynamics.'
  merge: -1
  img_proc: true
- pgno: 138
  md: '+   - \( I_i \): Represents the external input or input bias to neuron \( i
    \). It can represent sensory inputs, feedback signals, or any other external influences
    on the activation level of neuron \( i \).

    +   - \( D \): Represents the leakage or inhibition rate of neuron \( i \). It
    influences how much the activation level of neuron \( i \) is suppressed by activity.

    +   - \( E_{ki} \): Represents the weight of the inhibitory connection from neuron
    \( k \) to neuron \( i \). It influences how much the activation level of neuron
    \( i \) is suppressed by the activation levels of other neurons in the network.


    Taking the case of a fully connected network where all neurons influence each
    other with at equal distance we can simplify Equation 9.1 with \( \{ C_{ii} \}
    = 1 \), and \( \{ C_{ii} \} = 0 \), when \( i \neq j \) and \( \{ E_{ij} \} =
    1, \forall i, j \) as


    \(\frac{dx_i}{dt} = -x_i + (B - x_i)f(x_i) - (D + x_i)\sum_{k \neq i}^N f(x_k)
    + I_i \quad (9.2)\)


    In the current work we are interested in the application of the shunting network
    to biological phenomena of enumeration, thus we intend to confine the scope of
    the dynamics to positive values of activation. Moreover, we intend to compare
    the shunting version to the additive version explored in Sengupta et al. (2014).


    Thus we choose the less than linear activation function:


    \( f(x) = \left\{ \begin{array}{l} 0 \\ \frac{x}{1+x} \text{ for } x \le 0 \\
    1+x \text{ for } x > 0 \end{array} \right. \quad (9.3) \)


    # 9.2.1 STABILITY ANALYSIS: STEADY-STATE


    Considering the restrictions on the model we chose to focus on the steady-state
    activity of the network, where in absence of external input \(\frac{dx_i}{dt}
    = 0\). Given Equation 9.3, we are going to use the following identity in the next
    part of the work:


    \( f(x) - x = -xf(x) \quad (9.4) \)


    If we define total excitatory input as \( E \left( E = f(x_i) \right) \) and \(
    H \) as total inhibitory input \( \left( H = \sum_{k \neq i}^N f(x_k) \right)
    \). Now, at steady-state the activity should be independent of the permutations
    of node indices \( i \), we can denote the steady-state activity for the nodes
    as \( x[n] \) (\( n \) is the no. of nodes active at steady-state).


    \( 0 = -x[n] + (B - x[n])E - (D - x[n])H \quad (9.5) \)


    Using Equations 9.4 and 9.5, we have'
  merge: -1
  img_proc: true
- pgno: 139
  md: '```

    x[n] = \frac{BE - DH}{1 + E + H}

    ```


    Now considering that H = (n - 1)E, and E = f(x[n]) = \frac{x[n]}{1 + x[n]}, we
    can write


    ```

    x[n] = \frac{(B - (n - 1)D)f(x[n])}{1 + nf(x[n])}

    ```


    Using Equation 9.4, we can write


    ```

    (1 + n)x[n] = (B - (n - 1)D + n)f(x[n])

    ```


    Using Equation 9.3 allows us to calculate steady-state activation as


    ```

    x[n] = \frac{(B - 1 - (n - 1)D)}{1 + n}

    ```


    # 9.2.2 STABILITY ANALYSIS: NON-DIVERGENCE


    In order for stable steady-state activity, we must also have a non-divergence
    condition added to our stability analysis. If x_i and x_j are activities of i
    - th and j - th node respectively, then the non-divergence condition becomes \frac{d(\Delta
    x)}{dt} and needs to have a negative slope, where \Delta x = x_i - x_j.


    Following Equation 9.2 we have (using Equation 9.4)


    ```

    \frac{d(\Delta x)}{dt} = -\Delta x - \Delta x \sum_k^N f(x_k) + (B + D)(f(x_i)
    - f(x_j))

    = -\Delta x - (B + D)\Delta x(\frac{f(x_i)}{x_i}\frac{f(x_j)}{x_j}) - \Delta x
    \sum_k^N f(x_k)

    ```


    This can simplified using Equation 9.4. Moreover, we take advantage of the fact
    that near steady-state f(x_i) \rightarrow f(x[n]). Thus we have


    ```

    \frac{d(\Delta x)}{dt} = \Delta x | 1 - nf(x[n]) - (B + D)(\frac{f(x[n])}{x[n]})^2
    |

    ```


    With a substitution a = B + D - nD, and considering that non-divergence requires
    that the coefficient of \Delta x to be less than 0, we can write using Equations
    9.7 and 9.8 (as


    ```

    1 + nf(x[n]) = a \frac{f(x[n])}{x[n]} \text{ and } \frac{f(x[n])}{x[n]} = \frac{1
    + n}{a + n}

    ```'
