    # ## 1.3 MATERIAL AND METHODS


    The protocol had two phases: Part A was the design of the beta application of
    BOTES, a chatbot AI for clinical skills in Spanish. The objective was to build
    an application that could be loaded with a specific clinical case in Spanish,
    where the chatbot would play the role of the patient and the student would be
