    With dataset Kvasir dataset (polyp) with accuracy obtained as 98.6%. What could
    be the reason ResNet34 gives better accuracy with Kvasir-SEG than Kvasir datasets?
    The Kvasir-SEG and Kvasir datasets are both related to medical image analysis,
    specifically for gastrointestinal endoscopy. However, they serve different purposes
    and contain different types of data. Kvasir-SEG is more specialized for segmentation
    tasks, whereas the Kvasir dataset serves broader detection and classification
    needs. Kvasir-SEG is used for training and evaluating machine learning models
    for image segmentation rather than classification. It helps models learn how to
    outline the boundaries of polyps in endoscopic images. ResNet34’s skip connections
    allow it to retain both high- and low-level features, which is particularly beneficial
    for segmentation tasks where precise boundary detection is needed. This capability
    aligns well with Kvasir-SEG’s task of finding polyp edges.


    Table 2.5 gives our model performance of ResNet34 and ResNet50. Also, precision,
    recall, and F1 score have improved remarkably, indicating the enhanced robustness
    of the model. The Kvasir dataset covers a wider range of gastrointestinal diseases
    and anatomical locations, which increases the complexity of the task. The diversity
    of classes, diseases, and regions makes it harder for the model to learn all the
    variations effectively, and ResNet34 might struggle with the variability in image
    content. For classification, the model needs to learn more abstract, high-level
    features. Given the diverse nature of the Kvasir dataset, ResNet34 may not perform
    as well as a more specialized or deeper model suited for multi-class classification
    tasks in complex medical imaging datasets. Our results obtained using the ResNet34
    and ResNet50 model for Kvasir dataset show that ResNet50 performs better with
    accuracy obtained as 94.6%. ResNet50 has an upper hand. Proposed methodology for
    gastrointestinal tract diseases detection system the source code is available
    in GitHub repository [16].


    Table 2.6 shows the results obtained for the different classes of images considered
    with the proposed ResNet50 model. The accuracy surpasses the 97% mark, touching
