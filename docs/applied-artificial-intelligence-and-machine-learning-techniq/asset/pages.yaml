  md: '# 6 Enhancing Deep Learning-Based Colon Cancer Detection Using Attention Module


    Sk Mahmudul Hassan, Kumar Sekhar Roy, K Susheel Kumar, Arnab Kumar Maji, Keshab
    Nath, and Ruhul Amin Hazarika


    # 6.1 INTRODUCTION


    Colorectal cancer stands as one of the leading causes of cancer-related deaths
    worldwide, with its incidence steadily rising over recent decades. Timely detection
    and accurate diagnosis play pivotal roles in improving patient outcomes, yet existing
    screening methods often suffer from limitations in sensitivity, specificity, and
    accessibility. In this context, the integration of deep learning techniques into
    the realm of medical imaging offers promising avenues for enhancing colon cancer
    detection and diagnosis.


    According to cancer registry reports, India is witnessing a rising trend in cancer
    cases. According to a study, there will be a rise in cancer cases between 2010
    and 2020. India''s total cancer burden was predicted to increase by 31.4% between
    2015 and 2025 [1]. According to a National Cancer Institute (NIH) estimate, 1,806,950
    new cases of cancer will be identified in the United States in 2020, accounting
    for about 606,520 deaths [2]. With an annual incidence of 1.2 million cases and
    a 50% fatality rate, colorectal cancer, also known as cancer of the large intestine,
    is the third most common cancer worldwide and the fourth major cause of cancer-related
    deaths [3]. Therefore, cancer is considered a major challenge for doctors and
    researchers.


    Researchers and scientists have studied and proposed methods for early diagnosis
    of cancer. Medical imaging is a useful tool that helps in identifying cancer early
    on and is important in this process. Several computer-aided diagnosis methods
    (CADs) were put out to automatically diagnose colon cancer symptoms [4]. Machine
    learning (ML), which is a subfield of artificial intelligence widely used in medical
    fields such as brain tumor segmentation, Alzheimer''s detection, cancer detection
    and classification, etc. In the early days, traditional machine learning techniques
    were used, which were predominantly based on extraction of features. Hand-craft
    feature extraction is a complex process and has lot of weaknesses as the performance
    heavily depends'
  merge: -1
  img_proc: true
- pgno: 92
  md: 'on the features. In order to address these shortcomings, deep learning (DL),
    a type of representative learning was used, which has the ability to learn the
    features automatically and also increases the performance.


    In recent times, DL has gained much attention due to the combination of automatic
    feature learning, scalability, end-to-end learning, and the availability of frameworks
    and hardware [5]. Because deep learning algorithms can extract high-level features
    straight from raw images, they are effective in tumor segmentation and cancer
    detection and diagnosis. In this research, a convolution block attention module
    (CBAM) based CNN model is proposed for effective identification of lung and colon
    cancer. Fusion of CBAM and CNN models enhances the feature extraction by focusing
    on the relevant features and hence increases the performance of the model.


    The remaining chapter is organized as follows: Section 6.2 discusses the related
    work on the identification of lung and colon cancers using DL approaches. The
    proposed methodology is discussed in Section 6.3. Section 6.4 contains the results
    and discussion along with the dataset and the hyperparameter used in this chapter.
    Finally, the paper concludes with Section 6.5.


    # 6.2 LITERATURE SURVEY


    Numerous work has been carried out by researchers in classification of cancer
    using ML/DL, such as a hybrid feature space based colon classification (HFS-CC)
    technique used by Saima Rathore et al. [5] to identify colon cancer. Conventional
    features such as morphological, texture, scale-invariant feature transform (SIFT),
    and elliptic Fourier descriptors (EFDs) are used to extract the features, and
    a kernel SVM classifier was used for classification and achieved an accuracy rate
    of 98.07%. Mehedi Masud et al. [6] used 2D Fourier and 2D discrete wavelet features
    to identify colon and lung cancers. After extraction of features, the author used
    CNN model for classification and achieved an accuracy rate of 96.33%. Jianpeng
    Zhang et al. [7] classify medical images along with colorectal cancer images.
    In this paper, the author proposed a CDHVF algorithm that combines three pre-trained
    DL model and two hand-crafted based feature extraction techniques. A. Karthikeyan
    et al. [3] designed one CNN architecture consisting of eighteen CNN layers to
    identify the stages in colon cancer. The author fused CNN and LSTM in this work
    and achieved an accuracy rate of 91%.


    Ben Hamida et al. [8] reviewed several DL architectures such as AlexNet, VGG16,
    InceptionV3, ResNet, and DenseNet architectures to identify colon cancer and proposed
    UNet and SegNet architecture. They also used patch level image classification,
    and using SegNet they achieved an accuracy rate of 98.66%.


    Md. Alamin Talukder et al. [9] proposed a hybrid ensemble feature extraction based
    model to identify lung and colon cancers. In this paper, the authors extracted
    the features using transfer learning on five different DL architectures namely
    VGG16, VGG19, MobileNet, DenseNet169, and DenseNet201. After extraction of features
    some well-known ML classifiers such as SVM, RF, XGB, etc. are used for classification.
    Indu Chhillar et al. [10] proposed one feature engineering based ML approach to
    identify lung and colon cancers. In this paper, they extracted 52 Haralick-based
    texture features and color-based features. With a combine feature set'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'and light gradient boosting machine (LightGBM) classifier they achieved maximum
    performance accuracy. Ahmed S. Sakr et al. [11] designed several end-to-end lightweight
    DL architectures to identify colon cancer. Out of those architectures 12 layer
    CNN with dropout rate 0.5 and batch size of 8, the authors recorded the highest
    accuracy rate of 99.50%. Maha Sharkas [12] proposed one color-CADx approach to
    classify colon cancer. In this approach the author has used three DL architecture
    (AlexNet, ResNet, and DenseNet) to extract the features from the input images.
    The features are then reduced using DCT. The acquired DCT features from the DL
    models are then concatenated, and analysis of variance (ANOVA) is applied to select
    the important features, and SVM is applied to classify the images. They have recorded
    an accuracy rate of 96.80% on Kather texture 2016 image tiles dataset. Amit Seth
    et al. [13] detected lung and colon cancer using cascade CNN. In this paper, the
    authors segmented the ROI using the Swin Transformer and applied two phase CNN
    to extract both high-level and low-level features. The ATDO algorithm is used
    to optimize the network parameter and achieved an accuracy rate of 97.40%.


    # 6.3  MATERIALS AND METHODOLOGY


    # 6.3.1  CONVOLUTION BLOCK ATTENTION MODEL


    Convolutional neural networks and attention mechanisms in vision, with encouraging
    outcomes in terms of enhancing the network’s performance in the field of computer
    vision. The CNN network is aided by attention mechanisms in a variety of ways.
    CNN networks, such as VGGNet, GoogLeNet, and residual-style networks, work by
    widening and deepening the network to improve its capacity for detection, while
    the attention mechanism works to improve the network’s performance by focusing
    on important details and information about the features. Woo et al. [14] proposed
    CBAM, which uses both spatial and channel attention module. Spatial attention
    module designed to selectively focus on certain spatial regions of an image, enhancing
    the model’s capability to capture relevant features. The goal of channel-wise
    attention is to highlight more significant channels by assigning weights to each
    channel according to its relevance. The channel attention module and the spatial
    attention module are two sequential submodules of CBAM that are applicable to
    feed-forward CNN models. The block diagram of CBAM is shown in Figure 6.1.


    # 6.3.2  PROPOSED MODEL


    In this chapter, we have proposed a CNN architecture, and for better feature extraction
    we have incorporated CBAM in the CNN. The block diagram of the proposed model
    is shown in Figure 6.2. The proposed model is a 13-layer CNN architecture that
    consists of input layer, 5 convolution layers, 3 max-pooling layers, 1 global
    average pooling layer, 1 CBAM layer, a dense layer, and a SoftMax (output) layer.
    At first, the images in the dataset are resized to 224× 224 and fed into the input
    of the CNN model. The convolution and max-pooling layers are used to extract the
    basic features from the images. The convolution layer uses filter size of 3×3.
    Convolutions'
