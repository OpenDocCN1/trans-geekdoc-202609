    # 12.2 LITERATURE REVIEW


    Several researchers have undertaken analyses, reviews, and comparisons of machine
    learning algorithms for detecting cancer in different human organs. Among the
    widely studied algorithms for this purpose are the k-nearest neighbours and support
    vector machine. A study conducted by researchers at MIT, Chennai in 2009 found
    that SVMs could efficiently classify images with cancerous cells based on grey
    level information of images after enhancement, after which morphological features
    were extracted. The comparative study of nonlinear machine learning algorithms
    conducted in 2019 by a student at the University of Toledo, US, compared five
    algorithms, namely multilayer perceptron (MLP), Gaussian naïve Bayes (NB), k-nearest
    neighbors (KNN) algorithm, classification and regression trees (CART), as well
    as the support vector machines (SVM) on the Wisconsin Breast Cancer dataset. The
    research findings indicated that the multilayer perceptron exhibited superior
    accuracy and precision compared to the other algorithms studied [9]. Yet another
    comparison of six algorithms, consisting of GRU-SVM 4, MLP, linear regression,
    SoftMax regression, nearest neighbor (NN) search, and support vector machine (SVM),
    also based on Wisconsin Diagnostic Breast Cancer dataset found similar results,
    with all algorithms showing above 90% accuracy and the MLP algorithm scoring a
    99.04% accuracy rate. Studies conducted by professors at Khalifa University in
    UAE, and MIT in the United States, comparing SVMs, random forests, and Bayesian
    networks showed that SVMs had a higher accuracy among the three, but RFs had the
    highest probability of correct tumour classification. Similar tests were conducted
    on the detection of lung cancer using genetic optimisation, SVM, and KNN algorithms
    using preprocessed CT scan images as well as MRI and ultrasound images. The studies
    used pixel segmentation on the images and extracted features from them to identify
    cancerous growth. The SVM algorithm managed to significantly reduce false positives
    and classify the cancerous cells correctly by training models based on the data
    [10]. A study conducted at a university in Ethiopia employed a grid search to
    observe the optimal hyperparameter concerning the KNN for cancer detection [11].
    The research concluded that the performance of the KNN algorithm improved from
    90.1% to 94.35% depending on the hyperparameter or K value chosen for grid search.
    A similar report conducted and used the genetic algorithm to improve the classification
    performance of KNN and succeeded in reducing its computation time. Overall, SVMs
    and MLPs showed the most accurate results and successfully classified and segmented
    images with high accuracy [12–13].


