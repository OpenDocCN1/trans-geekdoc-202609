    # 11.4 EXPERIMENTAL RESULTS


    # 11.4.1 EFFECT OF DOWNSCALING THE CNN LAYERS


    CNN can be varied in three ways: width, height and depth wise (Figure 11.2). Width
    and height represent the size of layers whereas depth represents the number of
    blocks inside CNN. Inside the CNN layers we have different blocks of width × height.
    We have varied width and height from 32 × 32 to 16 ×16, thereby introducing multi-resolution
    CNN. By downscaling, the computational complexity has been reduced to a great
    extent. The 2-tier dual CNN architecture helps in feature extraction happening
    in a more detailed manner.


    In the proposed work, the width and height of CNN, 32 × 32, after convolution
    with 64 filters of 3 × 3, the total number of operations is 9.4 million operations.
    After downscaling the CNN layers by 2, the number of operations has been drastically
    reduced to 2.3 million operations from 9.4 million operations.


    We have developed a dual 16-layer network called multi-resolution dual CNN. The
