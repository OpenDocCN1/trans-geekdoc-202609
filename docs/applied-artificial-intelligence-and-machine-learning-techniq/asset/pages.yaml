    # 6.5 CONCLUSION


    This study demonstrates the effectiveness of incorporating attention modules into
    deep learning-based models for enhancing colon cancer detection from medical imaging
    data. The integration of attention modules allows the model to dynamically adapt
    its focus based on the saliency of features within the image, enabling it to prioritize
    areas with potentially malignant lesions while suppressing irrelevant background
    noise. In this chapter, we have proposed one lightweight DL model with CBAM in
    the identification of lung and colon cancers. The performance of the proposed
    CNN with CBAM model is compared with CNN architecture without self-attention model
    and several state-of-the-art DL architectures. The result shows that CNN with
    attention has the better ability to identify the images and achieves an accuracy
    rate of 98.34%. Further, the proposed model is compared with several DL models
    in terms of parameters, and it is seen that the proposed model used a few parameter
    and less model depth.


