    # 7.3.1.1 Noise Removal Using VMD


    In variational mode decomposition, IMF6 refers to the sixth intrinsic mode function
    derived from the decomposition of a noisy signal. Each IMF represents a specific
    frequency component of the original signal. Analyzing IMF6 involves examining
    its frequency content and energy to determine if it contains significant noise
    or useful information [19]. VMD parameters, such as alpha, influence the characteristics
    of IMF6 (α), which controls the smoothness of the modes and is set around 2000,
    and the number of modes k=6, which defines how many components the signal is decomposed
    into six. Based on this analysis, IMF6 may be retained or discarded in reconstructing
    the denoised signal, depending on whether it primarily represents noise or contributes
    valuable information.'
  merge: -1
  img_proc: true
- pgno: 107
  md: '# Algorithm1: VMD and mel spectrogram implementation

    Steps: Input: raw signal, IMF=6, output: denoised signal


    +   1. Input the speech signal raw_signal and its sampling frequency fs.

    +   2. Decompose the raw_signal into NumIMF as 6 Intrinsic Mode Functions (IMFs)
    using the VMD algorithm.

    +   3. Store the output IMFs in a matrix vmd_output and the residual (if any)
    in residual.

    +   4. Denoise the Signal:

    +      • Select specific IMFs (IMFs 2, 3, and 4) to reconstruct the denoised signal.

    +      • Sum these selected IMFs along the rows to form the denoised_signal.

    +   5. Plot Raw Signal vs. Denoised Signal:

    +   6. Calculate the mel spectrogram of the denoised_signal using parameters like
    Hamming window, overlap length 50%, and filter bank normalization.

    +   7. End.


    An integral part of the variational mode decomposition procedure for decomposing
    complicated signals like speech waveforms into more straightforward oscillatory
    modes is the intrinsic mode functions (IMFs). Each of the six IMFs in the provided
    code represents a distinct frequency band in the original audio source. The value
    for tolerance for convergence of the decomposition process is 1e–7. It sets a
    threshold for terminating the iterative optimization when variations fall below
    this number. Reduced tolerance values result in more accurate decompositions but
    require increased computing time. IMF 1 is good at picking up noise and high-frequency
    oscillations, which can be present in speech or background noise. IMF 2 has a
    slightly lower frequency range, making speech transitions more quickly. Mid-range
    frequencies are included in IMF 3, which frequently captures the basic phonetic
    elements; lower-frequency components, such as sustained vowel sounds, are reflected
    in IMF 4. With IMF 6 capturing the overall baseline trends, IMF 5 and IMF 6 represent
    even slower oscillations. Denoising works by re-creating the signal by adding
    IMFs 2, 3, and 4, believed to have the most important speech qualities with the
    least noise and unimportant frequency components. The denoised signal improves
    clarity by removing interference from intermodulation frequencies (IMFs) 1 and
    5, which may convey high-frequency noise and slower, less informative trends.
    It is compared to the source signal to find where the denoised signal excels.
    To better comprehend the acoustic characteristics of the speech signal following
    noise reduction, a mel spectrogram is created from the denoised signal to display
    its frequency content over time [9, 11, 19]. Figure 7.3 plots the IMF from 1 to
    6 plotted against the time axis, which enables a thorough examination of the signal''s
    underlying patterns and frequencies; each IMF represents a unique oscillatory
    mode extracted from the original signal.


    # 7.3.1.2 Mel Spectrogram from Denoised Signal


    The mel spectrogram of a signal is a frequency vs time representation that translates
    the input signal into the mel frequency scale, which aligns more closely with
    human'
