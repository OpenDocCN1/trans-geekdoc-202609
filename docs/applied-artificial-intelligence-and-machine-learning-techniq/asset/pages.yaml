- pgno: 131
  md: 'Using SHAP and LIME for model interpretation in QSAR ensures that predictions
    are transparent, enabling researchers to validate the biological plausibility
    of relationships between molecular features and bioactivity.


    # 8.2.7.2 External Validation


    External validation includes testing the model on an independent dataset that
    was not used through training. This is an important step in QSAR modeling, as
    it measures the model''s ability to simplify to new data, thus verifying its predictive
    robustness. A well-validated model with strong external performance indicates
    that the model''s learned relationships are not merely artifacts of the training
    data but are generalizable to other datasets. External validation is crucial for
    confirming that a QSAR model can reliably predict biological activity across diverse
    chemical compounds (Tropsha, 2010).


    Incorporating model interpretation methods and performing rigorous external validation
    enhances the reliability, interpretability, and applicability of QSAR models in
    drug discovery and chemical safety assessment.


    # 8.2.8 Application and Further Optimization


    In QSAR modeling, the stages of application and further optimization are indispensable
    for leveraging the model in real-world situations and continually refining its
    accuracy and reliability.


    # 8.2.8.1 Prediction


    Once the QSAR model is developed and validated, it is used to predict the biological
    activity of novel compounds. This predictive competence is the central purpose
    of QSAR modeling in drug discovery, environmental toxicity assessment, and chemical
    safety. By entering the chemical descriptors of unverified compounds, researchers
    can estimate biological responses or toxicological properties, reducing the need
    for time-consuming and expensive experimental procedures (Cherkasov et al., 2014).
    Predictions from QSAR models help in screening huge libraries of chemical structures,
    allowing researchers to put emphasis on the greatest promising candidates for
    further study and development.


    # 8.2.8.2 Iterative Refinement


    QSAR models benefit from iterative enhancement, a process that comprises updating
    the model as new data becomes obtainable. By continuously integrating new data,
    re-evaluating feature sets, and experimenting with several machine learning techniques,
    the model''s accuracy and generalizability can be enhanced over time. For example,
    integrating innovative molecular descriptors or using ensemble learning techniques
    can improve the model''s predictive performance. Frequently refining the model
    permits it to adapt to evolving chemical data and raises its robustness, making
    it a more prevailing tool for real-world applications (Fourches et al., 2010).
    Iterative modification is predominantly valuable in fields with quickly evolving
    data, like pharmacology, where new compounds are continuously synthesized and
    verified.'
