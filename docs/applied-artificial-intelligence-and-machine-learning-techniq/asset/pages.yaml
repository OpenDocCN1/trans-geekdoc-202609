    +   * **Sequence Length Management:** Tokenization assists in managing the sequence
    length, especially in models with limited memory or computational constraints.
    If the input exceeds the maximum sequence length that the model can handle, tokenization
    allows it to be divided into smaller chunks or blocks. This enables the model
    to process the input in a sliding window fashion and consider a limited context
    while generating responses.


    +   * **Efficient Computation:** By representing text as numerical tokens, tokenization
    enables efficient computations within the neural network. Vector operations can
    be performed on the token representations, leveraging hardware acceleration and
    parallel processing capabilities. This speeds up the training and inference processes,
    making it more feasible to train large-scale language models like ChatGPT.


    # 10.2.2.4 Context Window


    Handling the sequence length limitations are important. ChatGPT processes input
    text in blocks of tokens, typically 2048 at a time. This helps the model to consider
    limited context, and the prediction of response is improved.


    # 10.2.2.5 Fine Tuning


    After pre-training, the model is further fine-tuned on specific tasks using supervised
    machine learning methods. Custom datasets created by OpenAI are used for fine
    tuning. Fine tuning is important because it can be tailored for specific tasks.
    During pre-training it is trained on vast database, which helps its understanding
    of language. But fine tuning is done with narrow task specific datasets with the
    help of human reviewers which. Other advantages of fine tuning are human oversight
    and guidance, bias reduction, improving safety and responsiveness of the model.


    # 10.2.2.6 Prompt Encoding


    Prompt encoding is the process of encoding text-based tokens in numerical representations.
    As discussed in Section 10.2.2.3, this process is used to increase the efficiency
    of the model.'
