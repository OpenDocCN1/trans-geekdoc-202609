    XGBoost, and gradient boosting machine (GBM)—using features extracted from the
    VGG16 deep learning model to distinguish Parkinson''s disease patients from healthy
    individuals. Four primary measures were used to evaluate the models: mean F1 score,
    mean test accuracy, mean precision, and mean recall. LightGBM was the model that
    performed the best out of all of them, with an accuracy of 90.33% and recall and
    precision of 89.54% and 91.33%, respectively. With an F1 score of 90.42%, LightGBM
    is the most successful classifier for this job, reflecting this balance. With
