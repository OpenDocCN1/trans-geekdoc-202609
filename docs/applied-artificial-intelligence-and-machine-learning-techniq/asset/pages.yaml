  md: '# ### 12.4.4 RANDOM FOREST ALGORITHM


    This is a supervised learning technique capable of being applicable to both classification
    and regression tasks. It follows the concept of ensemble learning, which enhances
    detection accuracy by giving it access to a variety of classifier samples. It
    contains several decision trees of different subtrees of a given dataset, which
    takes the average of all the results, thus improving prediction. Instead of utilising
    a single decision tree, it incorporates multiple decision trees to enhance decision-making
    accuracy, leading to more robust outcomes. Since the feature selection is based
    on randomness, it minimises the correlation between data obtained from different
    decision trees. Using the random forest algorithm has a lot of advantages, such
    as requiring less training time than other ML algorithms, predicting highly accurate
    outputs, and working well with large datasets. Accuracy in results is not affected
    much in cases of missing data. This algorithm is used to eliminate overfitting
    and biasing and ensure overall variance for precise prediction.


    # ### 12.4.5 LOGISTIC REGRESSION


    This statistical approach employs a logistic function to represent a binary dependent
    variable. By estimating the probability of an observation belonging to a particular
    class, it transforms linear regression into a classifier. Regularisation techniques
    like Ridge and LASSO are frequently used to prevent overfitting, with L2 regularisation
    applied in classification models. The regularisation term controls the growth
    of parameters, and the hyper parameter value “lambda” is discovered over cross-validation.
    If lambda is too high, it can cause underfitting, and if it is equal to 0, it
    results in no regularisation effect. Therefore, when choosing lambda, it is essential
    to balance the bias vs variance trade-off. Input data outlining features of tumour
    cells is fed into the model and then converted into a NumPy array. The trained
    model is assessed for its accuracy score on training and test datasets. The model
    is then used to predict the malignancy of a tumour. The logistic regression model
    can provide informed clinical decisions and precise predictions.


    # ### 12.5 RESULTS AND DISCUSSION


    After applying machine learning algorithms to the WBCD dataset, a comparison study
    is conducted based on each algorithm’s accuracy, precision, recall, along with
    F-measure. Table 12.2 presents details of materials and methodology considered
    in prosed study. Accuracy is crucial to measure the correctness to foretell the
    prediction which is initially calculated by the proportion of properly classified
    samples (accurate positives and negatives) to the sum of instances. Precision
    measures the correctness of predictions by indicating the ratio of the true positives
    to the number of actual positives. Recall aims to assess how accurately the model
    can detect pertinent events. Lastly, the F-measure, a performance metric used
    to gauge model performance, merge precision, and recall yielding an assessment
    for the considered algorithms’ effectiveness. Table 12.3 gives results of performance
    measure using DT, SVM, KNN, LR, and RFA. In which LR achieves highest precision
    of 99.4% and using SVM with 98.26% of recall rate, F-measure of 98.2% and accuracy
    of 98.27%.'
