    auditory perception. The process begins with preprocessing the signal, which may
    involve normalization and framing using a window function. Next, the short-time
    Fourier transform (STFT) is applied to each frame to capture the signal''s frequency
    content over time. The resulting frequency spectrum is then transformed into the
    mel scale, a logarithmic scale that reflects how humans perceive pitch. This is
    achieved using a mel filter bank, which applies overlapping triangular filters
    spaced according to the mel scale. Logarithmic compression may be applied to the
    mel spectrogram to enhance contrast and highlight significant features. The final
    mel spectrogram is a 2D representation where the time is represented in the x-axis,
    the y-axis holds the intensity of color shows the magnitude of the frequencies
    and mel frequency bands. This representation is beneficial for audio and speech
    analysis as it captures the essential features of the signal in a manner that
    mimics human hearing [3, 9, 11].


    After decomposition, the signal undergoes denoising. This is done by reconstructing
    the signal using only the second, third, and fourth IMFs, which carry the most
    useful speech information. Summing these IMFs results in a denoised version of
    the signal, which is compared to the original via visual plots. Finally, a mel
    spectrogram is created for the denoised signal using a 256-length Hamming window,
    128-sample overlap, and bandwidth normalization. The mel spectrogram visually
    represents the signal''s frequency content over time, mapped to the mel scale,
    which aligns with human auditory perception. This approach is useful for visualizing
    speech patterns and can be applied to speech analysis and diagnosing speech-related
    disorders. Optionally, apply logarithmic compression to the mel spectrogram to
    enhance the dynamic range and highlight significant features. This involves taking
    the logarithm of the power spectrum, often with a small constant added to prevent
    taking the logarithm of zero. Finally, the mel spectrogram may be resized to meet
    specific dimensions required for input into machine learning models, such as 224x224
    pixels for compatibility with VGG16, ensuring it is properly formatted for further
    analysis or classification tasks. Figure 7.4 plots the preprocessed signals from
