  md: '# About the Editors


    Dr. Ravichander Janapati is presently working as an associate professor in the
    Department of ECE, SR University, Warangal. He is a senior member of IEEE and
    graduated in electronics and communication engineering from JNTU Hyderabad. He
    received his PhD in the adhoc wireless sensor networks field and MTech in digital
    electronics and communication systems from the Jawaharlal Nehru Technical University,
    Anantapur. His research areas are wireless sensor networks and brain computer
    interface.


    Dr. Usha Desai is presently working as a professor and dean (Research & Development)
    for S.E.A College of Engineering & Technology, Bengaluru, India. She received
    her PhD in biomedical signal processing from REVA University, Bengaluru, and MTech
    and BE from Visvesvaraya Technological University (VTU), Belagavi, Karnataka,
    India. She received the DST International Travel Grant to present her research
    paper at 39th IEEE EMBS International Annual Conference held at Jeju Island, South
    Korea. She has organized the International Conference on Innovative Research Development
    (ICIRD-2024) at Shinawatra University, Bangkok, Thailand. She served as an organizer
    and session chair at the reputed IEEE international conferences. Also, she has
    presented papers in many reputed conferences and authored more than 50 research
    publications. She has authored five books on biomedical healthcare. She has six
    patents. She is presently a senior member of IEEE and life member of ISTE.


    Dr. Steven Fernandes began his postdoctoral research at the University of Alabama-Birmingham
    after receiving his PhD in electronics and communication engineering from Karunya
    Institute of Technology and Science and his masters in microelectronics from Manipal
    Institute of Technology. There he worked on NIH-funded projects. He also conducted
    postdoctoral research at the University of Central Florida. This research included
    working on DARPA, NSF, and RBC funded projects. Steven''s current area of research
    is focused on using artificial intelligence techniques to extract useful patterns
    from big data. This includes robust computer vision applications using deep learning
    and computer-aided diagnosis using medical image processing.


    Dr. Rakesh Sengupta is a cognitive scientist specializing in vision, attention,
    and working memory. While working on his dissertation, Rakesh spent two years
    as a visiting fellow at Center for Mind/Brain Sciences (CiMeC) at the University
    of Trento, Italy. He completed his PhD from the Center for Neural and Cognitive
    Science, University of Hyderabad, in 2015. His current research involves building
    a visual working memory module for selective tuning based cognitive architecture,
    as well as building computational models of the human motor system using computational,
    theoretical, behavioral, and neuroimaging methods.'
