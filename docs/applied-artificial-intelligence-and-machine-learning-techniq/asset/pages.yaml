    # ## 6.4 RESULTS


    # ### 6.4.1 DATASET


    In this work, we have considered an open-access lung and colon cancer dataset
    called the LC25000 dataset [15]. This dataset consists of 25,000 images of lung
    and colon cancer. All the images are colored images and of size 768 × 768. The
    dataset consists of three categories of lung cancer cell images, namely lung benign
    tissue, lung adenocarcinoma, and lung squamous cell carcinoma, and two colon cancer
    cells, namely colon adenocarcinoma and colon benign tissue. In this work we have
    considered 1000 images per class. The dataset are split into 80% training and
    20% test set. Table 6.1 shows the dataset details used in this chapter. Figure
    6.3 shows some sample images from the dataset.


    # ### 6.4.2 EXPERIMENTAL SETUP


    The experiment was carried out using Google Colab pro with GPU. The experiment
    implemented in Jupyter notebook with common Python libraries as NumPy, Keras,
    Tensorflow, Matplotlib, etc. are used. The model is trained with learning rate
    0.001, the batch size is set to 32, and the training epoch is set to 50.


    Performance metrics determine the efficiency of the model. The performance metrics
    evaluated are accuracy, precision, recall, and FI score. The Equations 6.1 to
    6.4 define the expression of these matrices.


    ```

    Accuracy = \frac{TP + TN}{TP + FP + TN + FN} \tag{6.1}

