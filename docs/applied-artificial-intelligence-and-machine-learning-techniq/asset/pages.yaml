  md: '# TABLE 12.1

    KNN classification algorithm steps applied in proposed study


    # Proposed Algorithm Steps: K-Nearest Neighbours


    +   Step 1: Start

    +   Step 2:

    +   1. Determine the value of ‘K’: Choose the number of nearest neighbours (K)
    to consider._

    +   2. Calculate distances: Calculate the distance between the new data point
    and all other data points in the dataset using a chosen distance metric (e.g.,
    Euclidean distance).

    +   3. Select the K-Nearest Neighbours: Identify the ‘K’ data points that are
    closest to the new data point based on the calculated distances.

    +   4. Assign the new data point to the class that is most frequent among its
    ‘K’ nearest neighbours (majority voting).

    +   Step 3: Stop.


    KNN algorithm is a non-parameterised algorithm, it does not make assumptions based
    on existing data.


    # 12.4.3 DECISION TREE LEARNING


    This algorithm constitutes a supervised learning machine learning method suitable
    for both classification and regression tasks that constructs a tree structured
    model. It is capable of handling complex data, serving as the foundation for ensemble
    methods in machine learning. It accommodates both numerical and categorical data,
    making decisions based on features or attributes to arrive at predictions or outcomes.
    Known for their intuitive nature and interpretability, these models are highly
    favoured across diverse fields like data mining, pattern recognition, and decision
    support systems. In addition, it can be applied to cancer detection, leveraging
    their ability to make decisions based on features or attributes. They can be integrated
    into a more comprehensive approach to cancer detection and combined with other
    machine learning techniques or clinical assessments for greater accuracy. In our
    binary class classification problem, we applied the ID3 algorithm to develop a
    decision tree. The decision tree algorithm follows the algorithm here:


    +   1. Select the most informative feature among the input attributes and designate
    it as the root node of the tree.

    +   2. Divide the training dataset into smaller groups according to the values
    of the selected attribute.

    +   3. Continue through each subset iteratively, repeating steps 1 and 2 recursively
    until leaf nodes are formed at the terminal ends of each branch within the tree
    structure.


    When employing the decision tree algorithm for classification, the entire input
    training dataset serves as the starting point. The depth of the decision tree
    algorithm is crucial in classification tasks; higher depths may lead to overfitting
    issues. The size of tree corresponds to the number of nodes it contains, and each
    node plays a role in binary classification.'
