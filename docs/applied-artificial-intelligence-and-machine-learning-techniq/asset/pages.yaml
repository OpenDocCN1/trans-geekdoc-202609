    # ## 8.1 INTRODUCTION


    One of the leading challenges facing in health care today is the growing prevalence
    of many diseases, many of which have complex and multifactorial causes (Vaishya
    et al., 2024). A complex interaction of environmental, genetic, and lifestyle
    factors contributes to the advancement of conditions like cancer, neurodegenerative
    diseases, and metabolic disorders (Hotamisligil, 2006; Bray et al., 2012; Wyss-Coray,
    2016). Due to their limited effectiveness, unfavorable adverse effects, or higher
    levels of toxicity, existing therapeutic alternatives often fall short, highlighting
    the urgent need to develop new, more effective and safer medications (Vos et al.,
    2020).


    The difficulty of identifying suitable candidate molecules and the higher costs
    involved in pre-clinical and clinical trials make conventional drug discovery
    and development procedures still slow and expensive. Implementing these procedures
    in the initial stage of drug discovery can make it favorable to identify the chemical
    compounds with high standard quality pharmacological patterns, ensuring the most
    promising and optimized lead molecules for target specific interactions and exceptional
    pharmacokinetic (PK) properties. These advancements may aid in identifying compounds
    that are more effective with the least adverse effects.


    This chapter explores an essential drug discovery tool, quantitative structure-activity
    relationship (QSAR) modelling with the sophisticated applications through machine
    learning (ML) approach. The prediction of biological activity of compounds based
