  md: 'two primary methods: the first is known as feature extraction, and the second
    is known as fine tuning. As a fixed feature extractor, the feature extraction
    method uses a convolutional neural network (ConvNet) pre-trained on a big dataset,
    such as ImageNet. The weights of ConvNet that have been pre-trained are used to
    extract features for the new job; nevertheless, the weights of the network do
    not change. The fine tuning technique involves re-training some layers of the
    pre-trained ConvNet on the new dataset while preserving some layers of the ConvNet
    in a static condition. For the purpose of fine tuning, the weights of the retrained
    layers are adjusted through the process of backpropagation. This enables the model
    to adapt to the new data. Using these strategies, transfer learning makes it possible
    to effectively apply already trained models to increase performance on new tasks
    that need to be completed with limited datasets [21, 22]. VGG16, built by the
    Visual Geometry Group at Oxford, is a convolutional neural network (CNN) architecture
    that prevailed in the ILSVRC (ImageNet) competition in 2014. It is additionally
    referred to as OxfordNet. This design has 13 convolutional layers and 3 fully
    linked layers. The input dimensions are set to 224x224 RGB images by default.
    Convolutional layers utilize a fixed 3x3 filter size. VGG16 was trained on a large
    dataset (ImageNet); therefore, it has learned to recognize numerous low- and high-level
    features that are generalizable across other datasets, even though the target
    dataset (spectrogram images) differs significantly from the ImageNet data (natural
    images) [21]. In the preprocessing phase for preparing spectrogram images for
    machine learning models, several crucial steps are undertaken to ensure the data
    is suitable for model training and evaluation. First, images are loaded from the
    input set and are resized to 224 × 224, a standard dimension for many deep learning
    models such as VGG16, ensuring consistency in the input size. Normalization follows,
    where pixel values, initially ranging from 0 to 255, are scaled to a [0, 1] range
    by dividing by 255.0. This step helps the model converge faster and perform better
    by providing input data on a consistent scale. Label encoding is then applied
    to convert categorical labels, such as ''healthy'' and ''patient'', into numerical
    values using the LabelEncoder. This encoding translates categorical data into
    integers, making it compatible with machine learning algorithms that require numerical
    input. By following these preprocessing steps—loading and resizing images, normalizing
    pixel values, encoding labels, and splitting the data—the dataset is effectively
    prepared for subsequent model training and evaluation. A sequential model is built
