    # 4.3.4 Matthews Correlation Coefficient (MCC)


    MCC values were observed to be within the range of 0.32–0.69 as shown in Figure
    4.5 indicating strong correlation between predicted and actual classes. The XGB
    model achieved the highest MCC score (0.69), confirming its exceptional performance.
    Our models appear promising on predictive grounds since a higher value of MCC
    means this model is both capable of labeling instances in both classes. MCC metric
    is useful in performance estimation of the model on imbalanced datasets since
    it considers both true positives and false negatives [28].


