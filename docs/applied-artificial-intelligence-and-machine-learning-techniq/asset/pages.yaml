    # 12.4.1 SUPPORT VECTOR MACHINE (SVM)


    A support vector machine is a machine learning algorithm used to address challenges
    connected to regression and classification by using supervised max margins together
    with related learning. Often shortened to SVMs, these models find use in numerous
    fields including signal processing, picture and speech recognition, and natural
    language processing. Using a kernel approach, SVMs efficiently carry out regression
    analysis and classification. The SVM algorithm’s main objective is to identify
    the best hyperplane in any dimensional space such as 1D and 2D, which allows data
    points to be significantly divided into distinct object classes. The hyperplane
    is configured in such a way that there is as much space as feasible on either
    side of the hyperplane, while considered with the closest points of various classes.
    The number of features being focused on determines the dimension. For example,
    the hyperplane would only be a line for two features. The hyperplane would be
    a 2D plane for three features and so on. Hard margins and soft margins are the
    two types'
  merge: -1
  img_proc: true
- pgno: 183
  md: 'of margins that are used for hyperplanes. A hard margin or maximum margin hyperplane
    is a hyperplane that is nearly midway between two classes that are as far apart
    as feasible. The requirement that the data be easily distinct and linearly separable
    applies represented using Equation 12.1. For all training samples \((x_i, y_i)\),
    this can be asserted as minimizing weight \(\|w\|\) with respect to


    ```

    y_i (w^T x_i + b) \ge 1

    (12.1)

    ```


    where, \(w^T\) is the weight vector, \(x_i\) is a data point, and \(b\) is the
    bias.


    A soft margin is applied to lessen the severity of the margin requirement when
    outliers make it difficult for the data to be separated.


    This permits some misclassification, which is offset by a penalty term that represents
    the expense of permitting data points to be on the incorrect side of the boundary.
    Minimising weight as given in Equation 12.2


    ```

    \|w\| + C \sum \xi_i

    (12.2)

    ```


    where \(\xi_i\) is the degree of misclassification for each data point and \(C\)
    is the misclassification rate A parameter for regularisation margin maximisation
    and penalty for misclassification are balanced by \(C\).


    Larger values of \(C\) will cause it to act like a hard margin SVM; lesser values
    result in softer margin SVMs, which are more flexible and allow for more misclassifications.
    SVM employs a kernel trick when the data cannot be separated linearly. To make
    it easier to locate the hyperplane, it implicitly divides the initial input data
    points into high-dimensional feature spaces. It stays away from explicit mapping
    for decision boundaries or nonlinear functions. Sigmoid, linear, polynomial, and
    radial basis functions are examples of frequently used kernel functions. Computation
    is simpler when the kernel is written as a feature map which satisfies the function
    as in Equation 12.3.


    ```

    k(x, x'') = \langle \varphi(x), \varphi(x'') \rangle_V.

    (12.3)

    ```


    SVMs are widely used in many different applications, including geosounding, seismic
    liquefaction potential, general data classification, facial recognition and biometrics,
    handwriting recognition, surface texture classification, speech recognition, steganography
    detection, and the topic of this chapter, cancer detection. This is because SVMs
    can classify unknown data into distinct categories based on unique features. SVMs
    can be trained to detect and discriminate between malignant and normal cells using
