    is crucial to further enhance the roughly extracted features because the ultimate
    performance is significantly influenced by the quality of the learned features.
    For this purpose, one CBAM layer is used to highlight the important information
    and simultaneously suppress the unimportant ones. After that one global average
    pooling (GAP) layer is used, which'
