  md: '# ## 3.5.1 DATA ACQUISITION


    Data acquisition forms the foundation of the PdM strategy, as it provides the
    raw information required for effective fault diagnosis and prediction. Some of
    the common sensors used for data collection for PdM are as follows:


    +   (i) Vibration Sensors: These sensors measure the vibrations in rotating machinery.
    Abnormality in vibrations may indicate wear, misalignment, or any other faults.

    +   (ii) Acoustic Sensors: These sensors help in detecting sound waves generated
    by machines. Abnormal acoustic data can indicate a wide variety of faults, such
    as leaks, cracks, etc.

    +   (iii) Temperature Sensors: These sensors are often employed to detect overheating,
    which is a sign of mechanical or electrical issues. They are also used to maintain
    an optimum environment in critical applications such as warehouse management.

    +   (iv) Ultrasound Sensors: The ultrasound sensors capture high-frequency sounds
    to detect leaks, electrical discharges, material fatigue in structures, or bearing
    lubrication issues.

    +   (v) Flow Sensors: These sensors measure the flow rate in fluid systems to
    detect the presence of any irregularities or blockages.

    +   (vi) Proximity Sensors: These sensors can identify alignment problems by measuring
    the distance or positioning of moving parts.

    +   (vii) Current/Voltage Sensors: These sensors monitor the health of electrical
    machines to detect faults such as spikes, short circuits, etc.


    In certain industrial applications, data acquisition systems (DAQ) are utilized
    to collect sensor data and convert it into digital form for further analysis.
    They contain signal conditioners to prepare raw sensor signals for processing
    by filtering or amplification. DAQ systems also include analog-to-digital converters
    (ADC) to convert the analog sensor signals into digital data so that they can
    be analyzed by computers. The effectiveness of the different sensors heavily relies
    on how and where they are installed. Incorrect sensor mounting can lead to false
    readings, missed faults, and inaccurate diagnosis.


    # ### 3.5.1.1 Sensor Mounting


    To ensure that the collected data (e.g., vibration, temperature, sound, etc.)
    accurately reflects the true condition of the machines, proper sensor mounting
    is essential. Correct sensor positioning ensures consistent reading and helps
    minimize noise from external factors. This enables a reliable trend analysis and
    fault diagnosis scheme for critical industrial machines and systems. Some common
    sensor mounting techniques are discussed here.


    +   (i) Direct/Contact Mounting: The sensor is directly attached to the machine
    under testing, such that the sensor is in constant contact with the machinery
    and obtains real-time data. However, they are not securely fastened and'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'may cause data loss due to sensor movement. This type of mounting is often
    done for mounting vibration sensors on motor or pump casings.


    +   (ii) Magnetic Mounting: In this process, the sensors are mounted using magnets,
    enabling quick attachment and removal. This is generally used in temporary or
    portable applications. This type of mounting is also used to mount certain vibration
    sensors on electrical machines. It does not provide as firm a contact as permanent
    mounting and is not suitable for non-metallic surfaces.


    +   (iii) Stud Mounting: This is a permanent sensor mounting method in which the
    sensor is bolted or screwed into place using a threaded stud. This mounting often
    finds use in attaching vibration sensors on a rotating machine. The attachment
    is secure with minimum sensor movement, but the installation can be time-consuming
    and may require certain equipment modifications.


    +   (iv) Adhesive Mounting: It is a semi-permanent sensor installation where the
    sensors are mounted directly on the machine surface using strong industrial adhesives
    or epoxy. This type of mounting is done to attach lightweight accelerometers or
    thermometers on non-metallic surfaces. However, it is unsuitable for heavy sensors
    or high-vibration environments, which may lead to the weakening of the adhesive
    with time, affecting the reliability of the data collected.


    Figure 3.3 depicts the pictorial representation of these sensor installation techniques.
    Apart from this, the suitable method (online/offline) for data collection must
    also be determined, taking the necessity and available resources into consideration,
    as discussed in the next subsection.


    # 3.5.1.2 Online and Offline Data Collection


    Real-time health monitoring can be performed by continuous collection and analysis
    of data. For example, enterprise systems like SCADA collect and transmit process
    data. Another example includes online data collection in remote areas via IoT-enabled
    sensors, which can send data wirelessly to cloud storage. In some applications,
    data processing and analysis occur locally at the sensor node before transmission.
    This is known as edge computing, and it reduces latency, transmission power, and
    bandwidth usage.


    Apart from online data collection, health monitoring data is sometimes collected
    periodically or manually. The operators use portable sensory devices for manual
    data logging at specific intervals. Dataloggers are often utilized in areas without


    ![](img/a454246e6e2ea26f4583534f7cbdd134_49_0.png)'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'constant network connectivity to collect and store sensor data at regular intervals
    for later analysis. Before using the collected raw data for model training and
    analysis, proper cleaning and preprocessing must be done to make it suitable for
    statistical analysis, which is explained in the following subsection.


    # 3.5.1.3 Data Preprocessing


    One of the most important steps in the PdM blueprint is data preprocessing, which
    transforms raw sensor data into a clean, structured, and useful format by handling
    noise, missing values, and inconsistencies. The key steps involved in data preprocessing
    for PdM are as follows:


    +   - In PdM, sensors can fail, communication errors may occur, or data may be
    lost, resulting in missing values. Missing data can be handled by imputation,
    forward/backward fill, interpolation, or dropping the missing records.


    +   - Sensor data often contains noise, outliers, or inconsistencies that can
    affect model performance. Data cleaning using smoothing, low-pass filters, or
    statistical methods (e.g., Z-scores, interquartile range) helps remove irrelevant
    or erroneous data.


    +   - The data can be rescaled by normalization or standardization to make it
    suitable for the statistical models.


    Apart from these preprocessing steps, the PdM strategy also faces the challenge
    of data imbalance, which has been explained in detail in the next subsection.


    # 3.5.1.4 Data Imbalance Issue


    In real-life scenarios, industrial machines mostly operate in healthy conditions,
    and faulty instances are few and far between. Hence, the normal operation data
    is significantly more compared to the faulty data. This often gives rise to the
    data imbalance issue, where the trained AI models may become biased toward the
    majority class (normal operation) and fail to correctly predict rare but critical
    failure events. Thus, the trained models will be ineffective at detecting faults,
    despite having high accuracy. In order to address the data imbalance issue, the
    following methods may be applied:


    +   - Oversampling faulty class data by interpolation can help balance the dataset.
    SMOTE (synthetic minority oversampling technique) is a widely used algorithm that
    generates synthetic data samples to mitigate the imbalance issue.


    +   - Unsupervised learning algorithms (such as autoencoders) can be used for
    fault detection as they can be trained using healthy data only.


    +   - Boosting algorithms (e.g., AdaBoost, XGBoost) ensure the efficient handling
    of data imbalance problem by giving more weight to misclassified instances, particularly
    from the minority class.


    +   - Generative adversarial networks (GANs) can also be used to create realistic
    synthetic failure data based on the patterns in the original dataset, thereby
    balancing the dataset.'
  merge: -1
  img_proc: true
- pgno: 51
  md: '+   • Cross-validation with stratified sampling will ensure that the training
    and test splits are balanced and the trained model is evaluated on data from both
    healthy and faulty classes.


    After the collected data is preprocessed, it becomes suitable for further training
    and analysis. Based on the application and resource availability, the model training
    can be performed in the edge device or in the local/cloud server. The introduction
    of IoT has paved the way for wireless data communication between sensor nodes
    and servers. This has been briefly explained in the next subsection.


    # ### 3.5.1.5 Data Communication


    The data collected by sensors are transmitted wirelessly to centralized databases
    or cloud storage via IoT gateways, using different protocols as mentioned next:


    +   • Wi-Fi/Bluetooth/Zigbee for short-range wireless communication.

    +   • Cellular networks (4G/5G) for long-range wireless transmission.

    +   • LoRaWAN/NB-IoT for low-power, long-range wireless transmission. These protocols
    are best suited for industrial applications.


    # ### 3.5.2 Feature Engineering


    One of the most essential steps in predictive maintenance is feature engineering.
    It involves creating new, more relevant features from the original data to help
    the data-driven model better understand the underlying patterns, making predictions
    about machine health and failures more accurate. The common feature extraction
    techniques are as follows:


    +   (i) Time-Domain Features: These are derived directly from raw sensor signals
    over time. They are easy to compute and often provide valuable insights into machine
    health. Table 3.2 gives the mathematical formula of several time-domain features.
    Here, _x<sub>i</sub>_ denotes the sensor value at time _i_, and _N_ is the total
    number of observations in the time window.


    +   (ii) Frequency-Domain Features: In industrial systems, many faults manifest
    as changes in the frequency content of original sensor signals. In such cases,
    frequency-domain features need to be extracted by transforming raw time-series
    data into the frequency domain using techniques such as Fourier transform. The
    mathematical representation of different frequency-domain features is given in
    Table 3.3. Here, _x_(_n_) is the discrete time-domain signal, _j_ is the imaginary
    term, _N_ denotes the total number of samples, and _C_ represents the spectral
    centroid.


    +   (iii) Time-Frequency Domain Features: Time-frequency domain features combine
    both time and frequency information to capture more complex patterns in the signal.
    They are particularly useful for analyzing non-stationary signals, whose frequency
    content changes over time [Boashash, 2015]. Some common techniques for deriving
    time-frequency domain features are short-time Fourier transform (STFT), wavelet
    transform, and Hilbert-Huang transform (HHT).'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# TABLE 3.2

    # Various Time-Domain Features and Their Formula


    | Time-Domain Features | Formula |

    | :--- | :--- |

    | Mean ($\mu$) | $\mu = \frac{1}{N} \sum_{i=1}^{N} x_i$ |

    | Variance (Var) | $\text{Var} = \frac{1}{N} \sum_{i=1}^{N} (x_i - \mu)^2$ |

    | Standard Deviation ($\sigma$) | $\sigma = \sqrt{\frac{1}{N} \sum_{i=1}^{N} (x_i
    - \mu)^2}$ |

    | Root Mean Square (RMS) | $\text{RMS} = \sqrt{\frac{1}{N} \sum_{i=1}^{N} x_i^2}$
    |

    | Peak-to-Peak Amplitude (P-to-P) | P-to-P = $max(x_i) - min(x_i)$ |

    | Skewness ($S$) | $S = \frac{\frac{1}{N} \sum_{i=1}^{N} (x_i - \mu)^3}{\sigma^3}$
    |

    | Kurtosis ($K$) | $K = \frac{\frac{1}{N} \sum_{i=1}^{N} (x_i - \mu)^4}{\sigma^4}$
    |

    | Crest factor (CF) | $\text{CF} = \frac{max(x_i)}{\text{RMS}}$ |

    | Energy ($E$) | $E = \sum_{i=1}^{N} x_i^2$ |


    # TABLE 3.3

    # Various Frequency-Domain Features and Their Formula


    | Frequency-Domain Features | Formula |

    | :--- | :--- |

    | Discrete Fourier Transform/DFT ($X(f_k)$) | $X(f_k) = \sum_{n=0}^{N-1} x(n)
    e^{-j2\pi kn/N}$ |

    | Power Spectral Density (PSD) | $\text{PSD}(f_k) = \frac{|X(f_k)|^2}{N}$ |

    | Peak Frequency | Peak Frequency = $f_k$ where max $|X(f_k)|$ |

    | Spectral Bandwidth | Spectral Bandwidth = $\sqrt{\frac{\sum_{k=0}^{N-1} (f_k
    - C)^2 |X(f_k)|}{\sum_{k=0}^{N-1} |X(f_k)|}}$ |

    | Spectral Entropy | Spectral Entropy = $- \sum_{k=0}^{N-1} P(f_k) \log_2 P(f_k)$
    |'
  merge: -1
  img_proc: true
- pgno: 53
