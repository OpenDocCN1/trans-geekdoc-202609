  md: '# 11.4.3.2 DRIVE Database


    The DRIVE (digital retinal image for vessel extraction) [20] fundus image database
    is accessible to everyone. The fundus photos of this collection were taken from
    453 participants in a group diabetic retinopathy screening program, ranging in
    age from 31 to 86 year old. This database contains 40 fundus images, 20 of which
    are for training and 20 for testing.


    # 11.4.3.3 Kaggle Database


    The Kaggle database [19] contains of 3200 retinal images. These images are captured
    from three different fundus cameras.


    # 11.4.4 Training and Denoising Workflow


    In training phase, the local and global features are extracted. As the convergence
    error is large initially, iterations are performed in an optimized manner. The
    optimum value is set in the algorithm. The iterations are performed until the
    convergence error decreases and reaches the optimum value. After 100 iterations,
    a model file is generated. We use this model file during the testing phase. The
    proposed MR-DCNN is tested on 100 retinal images from STARE database [18]. CNN
    uses the test image and does classification and feature extraction here. The model
    file given to CNN during testing code has data available in enhancement, feature
    extraction, compression and reconstruction blocks. CNN converts the input data
    into similar blocks and does comparison with these blocks. If it matches, it uses
    particular filter and does denoising and gives output.


