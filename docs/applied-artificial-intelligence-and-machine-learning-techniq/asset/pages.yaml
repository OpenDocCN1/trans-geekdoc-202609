    # 4.3.2 FEATURE SELECTION AND MODEL OPTIMIZATION


    Important features were predicted according to the top-scoring random forest model.
    Recursive feature elimination (RFE) with fivefold cross-validation was applied
    to the Morgan 2 fingerprints, comprising a total of 2,047 features. RFE selected
    1,726 features and excluded the rest (Figure 4.2 and Figure 4.3). Based on those
    features, a new dataset was created that was used to optimize the eight models
    through hyperparameter tuning using Optuna, as illustrated in Table 4.5. Efficient
    algorithms from the Optuna system identified the best combination of those hyperparameters,
    including the number of decision trees, the maximum depth, and the least amount
    of samples needed to split a node. It demonstrated superior performances through
    accuracy between 0.71 to 0.8 (Table 4.5). It is important to note that random
    forest and LGB displayed maximum accuracy value of 0.85 with the optimal parameters.


