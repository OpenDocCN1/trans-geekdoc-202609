  md: '(parameters given in Table 9.1) that explored the network’s response to both
    simultaneous and sequential transient inputs (Figures 9.1, 9.2, and 9.3). The
    simulations showed that the shunting network effectively manages transient inputs
    and demonstrates dynamics similar to working memory processes, where recent inputs
    are prioritized over older ones (Figure 9.3). These findings validate the theoretical
    stability criteria and highlight the practical implications of shunting networks
    in modeling short-term memory, offering valuable insights into their robustness
    and applicability in cognitive systems.


    One significant observation is that additive recurrent networks are prone to reaching
    catastrophic inhibition levels more rapidly than shunting networks when dealing
    with a large number of inputs. In additive networks, the accumulation of inhibitory
    feedback can lead to excessive suppression of neuron activations, causing instability
    and a rapid decline in network performance (Endress and Szabó, 2017). This phenomenon,
    often referred to as catastrophic inhibition, limits the network’s ability to
    maintain stable activations over extended periods or with numerous inputs.


    ![](img/a454246e6e2ea26f4583534f7cbdd134_146_0.png)


    FIGURE 9.3 Dynamics of neuron activations with sequential input presentation.
    The plot shows the activation levels of neurons in the network over time using
    the parameters B = 2.2, D = 0.1, and eight sequential inputs. The figure illustrates
    the similarity to working memory dynamics, where recent inputs are more prominently
    remembered compared to older ones. This behavior is evident in the activation
    patterns, where neurons activated by more recent inputs maintain higher activation
    levels than those associated with earlier inputs.'
