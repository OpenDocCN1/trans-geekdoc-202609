    # FIGURE 1.5 Sentiment analysis results gathered from feedback to questions.


    # 1.5 CONCLUSION


    The chatbot in Spanish (BOTES) can facilitate the memorization and practice of
    the clinical interview in preparation for an interview with the Hispanic and Spanish-speaking,
    limited English proficient populations to address disparities caused by Spanish-to-English
    language barriers. This tool can help the student practice a clinical interview
    in Spanish, leading to a faster, more accurate interview and improving the relationship
    with a Spanish speaker in clinical settings. Also, having a routine, quick process
    to ask clinical questions will provide confidence in the interviewer, giving them
    extra time in the interview to be more compassionate and have a holistic approach
    to the patient. The flow of the questions will turn the interview into a conversational
    experience for the patient instead of just a checkbox for each question.


    It is essential to highlight that the BOTES application aims to facilitate learning
    and increase practice. It does not intend to replace the human interview.


    Limitations: The primary limitation was using Spanish speakers from different
    countries to test the model. The accents, speed of communication, and vocabulary
    used in other Hispanic countries are different, which produced some errors in
    interpreting the conversation for the bot. To avoid that substantial variable,
    it was decided to standardize the bot with Mexican Spanish, the most used language
    in U.S. classrooms.


    The next step is to adopt the feedback and upgrade the application to use it as
    a complementary tool in clinical interviews in Spanish. Since the chatbot can
    interpret different languages, the basic BOTES app can be upgraded to work in
    various languages to facilitate learning interviews in foreign languages, decreasing
    the language barrier in other cultures.'
