  md: 'are quantitative illustrations capturing various physical, chemical, and structural
    properties of molecules. These descriptors are used as inputs for machine learning
    models, facilitating predictions about toxicity, biological activity, or other
    chemical properties.


    # 8.2.2.1 Types of Molecular Descriptors


    # 8.2.2.1.1 2D Descriptors


    The 2-dimensional descriptors which represent molecular properties not considering
    3D spatial arrangements. Atom counts, molecular weight, and topological indices
    are the typical examples that review features of molecular structure, such as
    shape, size, and degree of branching.


    # 8.2.2.1.2 3D Descriptors


    Consider the 3D arrangement of atoms in a molecule, covering spatial features
    like surface area, molecular volume, and shape indices. These descriptors are
    crucial when the 3D conformation influences biological activity.


    # 8.2.2.1.3 Fingerprint-Based Descriptors


    Molecular fingerprints signify molecules as binary vectors, where each bit specifies
    the presence or absence of specific chemical fragments (e.g., substructures or
    pathways) or structural subunits. Prevalent fingerprint types comprise the Morgan
    (circular) and MACCS keys fingerprints, which are mainly suitable in similarity-based
    searches and clustering.


    # 8.2.2.2 Tools for Descriptor Calculation


    Several tools and libraries assist in the calculation of these descriptors, including
    the following:


    # 8.2.2.2.1 PaDEL


    PaDEL-Descriptor is a software tool intended for calculating a wide collection
    of fingerprints and molecular descriptors, advocating 797 descriptors (663 1D
    and 2D descriptors, and 134 3D descriptors) along with 10 types of fingerprints.
    The fingerprints and descriptors are mainly computed using the Chemistry Development
    Kit, with added features like atom-type electro topological state descriptors,
    molecular linear free energy relation descriptors, McGowan volume, ring counts,
    and substructure identifiers from Laggner, Klekota, and Roth. PaDEL-Descriptor
    has developed a flexible design that includes a library component that can easily
    be integrated into quantitative structure–activity relationship (QSAR) software,
    along with a stand-alone interface. It applies a master/worker pattern to influence
    multiple CPU cores, optimizing the rapidity of descriptor calculations. PaDEL-Descriptor
    is an open source and freely available software, which makes it stand out from
    other descriptor calculation tools, offering both command-line and graphical user
    interfaces compatible with Linux, Windows, and macOS, and it supports over 90
    molecular file formats. With its extensive descriptor library and multithreading
    capabilities, PaDEL serves as a valuable resource for chemoinformatics research.
    The software is available to download at http://padel.nus.edu.sg/software/padeldescriptor
    (Yap, 2011). It'
