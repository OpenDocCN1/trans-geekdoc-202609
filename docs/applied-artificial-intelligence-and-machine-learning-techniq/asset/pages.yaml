    exemplar-based classification method for PD detection from voice signals. Vectors
    of speech features taken from the training set are called exemplars. Regarding
    training speech exemplars, the detection challenge is the problem of obtaining
    sparse representations of test speech feature vectors. The primary benefit of
    employing the SR technique over traditional ML-based methods is that the training
    phase is not time-consuming [4]. A deep neural network (DNN) based strategy for
