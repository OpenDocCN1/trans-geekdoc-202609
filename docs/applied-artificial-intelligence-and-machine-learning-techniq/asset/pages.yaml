    # 7.3.2 TRANSFER LEARNING APPROACH


    A method used in machine learning is termed transfer learning, in which a pattern
    generated and optimized for one function is recreated as the base point for a
    subsequent task. In contrast to traditional machine learning, transfer learning
    starts with an additional task by employing a pre-trained model as a launching
    pad. The evident limitations of conventional machine learning methods and the
    increasing volume of multimodal signal data in biomedical treatments prompted
    researchers to adopt deep learning for signal processing [20]. The pre-trained
    deep transfer learning (DTL) frameworks and traditional machine learning models
    serve as an automated method for diagnosing Parkinson''s disease from voice data.
    This study aggregated the retrieved features from the deep pre-trained architectures,
    VGG16, to produce the discriminative feature vectors. Transfer learning is a widely
    used approach that uses a pre-trained model to address new tasks. A pre-trained
    model has been trained using a comprehensive benchmark dataset, such as ImageNet.
    Transfer learning primarily entails leveraging knowledge gained from solving one
    problem with a large dataset to address a related problem with a smaller or different
    dataset. The domain and task components delineate transfer learning. Two components
    make up a domain ‘a’: the first is the feature space, which is represented by
    the ‘x’, and the second is the probability distribution, which is represented
    by the fraction p(x) [21].


    ```

    d = (x, p(x)) (7.1)

    ```


    An element of the set x is denoted by the expression x = {x1, x2, x3, .....xn
    }. The predictive function ‘f(x)’ and the label space “z” are the two components
    of task ‘t’. The first component is the predictive function [21].


    ```

    t = (z, f(x)) (7.2)

    ```


    Deep learning can be difficult to handle when dealing with datasets that are either
    limited or unlabeled. This issue is mitigated by using transfer learning, which
    utilizes knowledge from a big dataset for models with a limited amount of data.
    The implementation of transfer learning can be accomplished through the use of'
  merge: -1
  img_proc: true
