  md: '# 11 Fundus Image Restoration and Enhancement Using Multi Resolution CNN Framework


    Laya Tojo, Manju Devi, and Annie Sujith


    # 11.1 INTRODUCTION


    Examination of medical images plays a major role in the identification of diseases.
    It focuses on the examination and evaluation of digital images. Various image
    processing methods and computer tools are used in the identification of diseases.
    Recent studies have shown that quick advancements in biomedical image processing
    are essential because they reduce the necessity for intrusive diagnostic procedures.
    Various techniques to detect and diagnose various diseases like heart defects,
    tumors, Alzheimer''s, cancers, bone defects, edemas, etc., are improved with the
    help of computed assisted diagnosis techniques. The observation of fundus images
    helps to analyze critical retinal diseases such as glaucoma, diabetic retinopathy,
    retinal tear, macular degeneration related with age, retinitis pigmentosa, etc.
    The images taken with the normal fundus camera are of low image quality. The images
    are mostly degraded mainly due to noise, blur, low contrast features and irregular
    illumination. Hence it is very essential that the fundus image must therefore
    be effectively removed from noise in order to apply disease detection techniques,
    as well as to detect and evaluate minute variations in the retinal vasculature.
    The increase in blood pressure and increase in blood glucose level are primary
    reasons for recognized eye diseases like glaucoma and hypertensive retinopathy.
    These diseases can develop in the next stages without major symptoms, whereas
    general symptoms include intra-retinal micro vascular abnormalities and leakages.
    In order to diagnose and treat ophthalmologic conditions including age-related
    macular degeneration (AMD) and diabetes mellitus, fundus photography is essential.
    The human eye''s refractive errors, incorrect camera calibration and high flash
    are the primary causes in the deterioration of retinal image in the quality. Retinal
    images are regarded as low light images. They do not have full illumination due
    to sensor quality and eyes range. In retinal images, low light conditions and
    noise are mainly due to poor camera focus, eye motion, iris reflection and quality
    of lens. As retina is a very sensitive'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'portion of the eye, high flash can result in migraine health issues. Hence
    enhancement and denoising of retinal images are necessary. Retinal images are
    susceptible to various blur effects due to improper image acquisition conditions
    and settings. Retinal pictures are typically used by ophthalmologists to diagnose
    specific conditions. Because of unreliable diagnosis, poor camera settings, movement
    of eye, inconsistent illumination and pupil dilation, fundus cameras usually fail
    to acquire better-quality retinal images. There are many medical image noises
    like photon noise, periodic noise, Gaussian noise, impulse, speckle noise, Gaussian
    noise etc. These noises can degrade the image quality to a great extent. We have
    taken additive white Gaussian noise (AWGN) as it is easy to model mathematically.
    In order to restore blurred retinal image and also to enhance the retinal image
    clarity, multi-resolution dual CNN algorithm is used in the work.


    # 11.2 RELATED WORK


    One well-known issue that researchers are attempting to address is denoising.
    In recent years, deep learning algorithms have substituted denoising approaches
    such as non-linear filters, chroma and luminous noise separation, linear smoothing
    filters, block matching algorithms, wavelet transform filters, random field machine
    learning algorithm and others. There have been very few works regarding the image
    denoising of medical images. Medical images are images that contain visual and
    meaningful information. But it will be corrupted with different noises like speckle
    noise, Gaussian noise, quantization noise etc. In [1] a classification of medical
    images task is performed on X-ray images using DenseNet-121 convolutional neural
    network. Fine-tuned models are more affected by denoising techniques than randomly
    initialized models. There is no significance between PSNR and SSIM. With the help
    of two datasets, the efficiency of AlexNet CNN mode is analyzed. It proved that
    group of images that noise harmoniously cover area of disease symptoms have better
    effect with respect to CNN. The multi-scale dilated convolution of CNN [2] by
    implementing dilated convolution conserves contextual information and expands
    receptive field. Residual learning helps to speed up learning procedure. The total
    variational (TV) method [3] removes the noise and preserves edges when compared
    to traditional denoising techniques like linear smoothing, median filtering, transform
    domain methods using FFT and DCT. The undesirable artifacts generated have been
    minimized using second (higher-order) regularization methods, and [4] proposes
    an effective deep convolutional neural network model for medical picture denoising
    using a limited training dataset by incorporating batch normalization and residual
    learning; training process is sped up and performance is improved. The limitation
    was artifacts resulted due to the compression of medical images.


    By adding non sparsity penalty function, the mixed noise reduction is achieved
    thereby improving better visual quality of dark images [5]. The neural network,
    which consists of convolution operation, batch normalization and ReLU layers,
    and convolution operation maps noisy image patches to clean version and thereby
    solves low light denoising problem. The low light image denoising based on Poisson
    noise model [6] preserves image details without compromising noise reduction.
    The artifacts, blurring and enhancement issues, are eliminated in the work [7]
    by utilizing'
