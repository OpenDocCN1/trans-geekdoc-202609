    # ## 2.3 METHODOLOGY


    # ### 2.3.1 DATA DESCRIPTION AND DATA PREPROCESSING


    The Kvasir v2 dataset has been downloaded from Kaggle website [15]. The images
    within the Kvasir v2 dataset have proven useful for categorical data of gastrointestinal
    diseases. It is a collection of new, high-quality endoscopic images from clinical
    environments. This dataset encompasses a diverse range of gastrointestinal pathologies,
    including benign (B) pathologies like erosions, ulcers, and polyps as well as
    malignant (M) pathologies like tumors and cancer, among others like gastritis,
    esophagitis, and Barrett''s esophagus. The samples are categorized into eight
    groups, each of which offers a variety of gastrointestinal disorders and their
    distinguishing features. Due to its rich features and various input image types
    from endoscopy and colonoscopy, the proposed dataset can be utilized for building
    and testing AI-based predictive models to improve diagnostic accuracy and classification.
    The open-access nature of the dataset is an additional incentive for choosing
    this richly equipped dataset for research. The data has been divided into 80%
    for training data and 20% for validation data. The best of modern-day machine
    learning algorithms, including CNNs and the transfer learning model ResNet50,
    have been focused on this research. In addition InceptionV3, Xception, Visual
    Geometry Group 19 (VGG19), and long short-term memory (LSTM) have been used for
    experimentation and comparison.


    Table 2.1 indicates the training and testing datasets after splitting the data.
    As the data is imbalanced, no image was selected for the training for the cancer
    type, but the model, after implementation, correctly identifies the class.


    | No. | Classes | Training Data Images | Testing Data Images |

    |---|---|---|---|

    | 1 | Normal | 993 | 86 |

    | 2 | Erosions B | 983 | 101 |

    | 3 | Polyp B | 975 | 88 |

    | 4 | Ulcer B | 997 | 107 |

    | 5 | Gastritis B/M | 1000 | 88 |

    | 6 | Hiatal Hernia B/M | 967 | 105 |

