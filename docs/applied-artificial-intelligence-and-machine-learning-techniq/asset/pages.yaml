  md: '# # 2 AI-Driven Diagnostic Assistance for the Gastrointestinal Tract Diseases


    Bhavanam Gireesh Reddy, Nilima Zade, Shubhada Deshpande, Chira Anudeep Gaud, Saswati
    Behra, and Nithesh Naik


    # ## 2.1 INTRODUCTION


    Gastrointestinal diseases pose a severe threat to people worldwide, resulting
    in millions of cases and significant economic and social costs. From simple conditions
    such as gastrointestinal infections and gastrointestinal ulcers to more complicated
    diseases like gastric cancer diseases, early signs and related symptoms may be
    overlooked, leading to delayed diagnosis and complications for patients. Preventive
    management and prompt diagnosis are recognized as major independent factors in
    the treatment of these diseases, ultimately enhancing the quality of patient care.
    The disease prognosis and prediction can be assisted through the integration of
    medical imaging and artificial intelligence (AI). The current availability of
    large quantities of clinical imaging data has enabled researchers and clinicians
    to leverage machine learning (ML) technologies to create new models capable of
    successfully predicting the existence and nature of stomach diseases. Another
    commonly applied method involves training artificial intelligence models that
    classify the endoscopic images of the gastrointestinal tract. Over 8,000 real
    clinical images have been gathered into a sizable collection known as the Kvasir
    v2 dataset. This dataset encompasses nearly all diseases that are commonly seen
    in clinical practice involving the gastrointestinal tract, maladies including
    erosions, ulcers, polyps, and malignant disease.


    The present study focuses on the opportunities and problems that come with using
    AI to assist in the diagnosis of gastrointestinal diseases using the Kvasir v2
    dataset. Techniques for model training and model evaluation processes are explored
    in the study. People may have similar symptoms for different diseases and obtain
    different diagnoses from different institutions, which is why there is frequently
    a discrepancy. The use of computer-aided diagnostics facilitates quicker and more
    deliberate decision-making for practitioners [1]. Through the application of cutting-edge
    ML algorithms, this effort seeks to close these gaps in the early identification
    and mitigation'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'of delays in gastrointestinal health disorders. The study implements CNNs and
    transfer-learning approaches for feature extraction, recognizing and categorizing
    various gastrointestinal diseases in the stomach region using endoscopic images.
    The practical values of AI models are established by highlighting their models’
    performance and demonstrating how AI can enhance patients’ survival through individualized
    treatment plans, prompt diagnosis, and intervention. This research is expected
    to improve current approaches and plans for managing gastrointestinal disorders,
    having a significant impact on public health programs worldwide.


    Detection not only contributes to enhanced timely treatment but also promotes
    the establishment of preventive measures. The lack of accuracy in the predictive
    model has been addressed through the inclusion of regularization and dropout techniques
    in the training and testing phases. These techniques aid in better determination
    of the exact disease manifested in the images. AI-driven computer-aided assistance
    results in effectively diagnosing stomach diseases, enriching the healthcare sector
    and extending the prospects of superior disease management.


    The rest of the chapter is organized as follows. Section 2.2 refers to the published
    work of renowned researchers. Section 2.3 lays down the methods and procedures
    adopted in this work. Section 2.4 discusses the results, and Section 2.5 concludes
    with future possible direction of work.


    # ## 2.2 LITERATURE REVIEW


    The authors in [2] presented a systematic review of 12 distinct models to predict
    gastric cancer. It is observed that strong discriminative models have used clinical
    findings along with microscopic images. It is recommended that independent datasets
    be utilized in conjunction with the splitting dataset technique for validation.
    Making use of The Cancer Genome Atlas referred as TCGA dataset, the authors in
    [3] presented the MultiDeepCox-SC model for detecting stomach cancer. Using the
    CPH, or Cox proportional hazards model, the MultiDeepCox-SC takes into account
    the DeepCox-SC risk score, age, and expression of 10 genes. Histopathological
    pictures were used to train the DeepCox-SC model. Then, using the Cox regression
    technique, the model''s output—the DeepCox-SC risk score—was merged with clinical
    information (age) and gene expression (10 genes). The number of samples was y,
    442 whole-slide histopathology images. The accuracy achieved is 83.3%. The training
    phase of the proposed method is based on selected patches using cellularity and
    Cell Profiler software that affect the performance. High-power microscopic images
    with more patches are needed to improve the performance. The authors [4] proposed
    the XGBoost model to predict stomach disease using individual patient data from
    25,942 and 1431 patients as a dataset for prediction. Each participant must have
    a data label (case: y = 1, control: y = 0). They identified 89 patients as part
    of the case group (y = 1) who had stomach cancer discovered within 122 months.
    The accuracy attained is 77.7%, and AOC is 89.9%. They observed that the dataset
    taken lacks in number, so to improve the accuracy, a large dataset for training
    and to predict more accurately needs to be taken. The authors in [5] presented
    a systematic analysis of 11 distinct machine learning models to predict diseases
    using public healthcare datasets. It was observed that the strongest model is
    k-nearest neighbor (KNN) and has'
