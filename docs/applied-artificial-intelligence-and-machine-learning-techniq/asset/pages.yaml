  md: 'where **W** is a matrix containing the eigenvectors of the covariance matrix
    $\mathbf{X}^T \mathbf{X}$. The columns of **W** are called the principal components
    of **X**. Typically, only the first few principal components are retained.


    # 5.3.4.1.2 Mutual Information (MI)


    MI is a measure from information theory that measures the mutual dependence between
    two variables. It quantifies the amount of information obtained about one variable
    through the other variable. For feature selection, MI can be used to rank features
    based on their relevance by measuring the amount of information shared between
    the feature and the target variable.


    Given a feature $X$ and a target variable $Y$, the mutual information $I(X; Y)$
    is defined as shown in Equation 5.13.


    \[ I(X; Y) = \sum_{y \in Y} \sum_{x \in X} p(x, y) \log \left( \frac{p(x, y)}{p(x)p(y)}
    \right) \] (5.13)


    where $p(x, y)$ is the joint probability distribution function of $X$ and $Y$,
    and $p(x)$ and $p(y)$ are the marginal probability distribution functions of $X$
    and $Y$, respectively.


    # 5.3.4.1.3 LASSO (Least Absolute Shrinkage and Selection Operator)


    LASSO is a regression analysis method that performs both variable selection and
    regularization in order to enhance the prediction accuracy and interpretability
    of the statistical model it produces. It is particularly useful when the number
    of predictors (features) is significantly greater than the number of observations.
    The LASSO formulates the optimization problem as shown in Equation 5.14.


    \[ \min_\beta \left\{ \frac{1}{2N} \| Y - X\beta \|^2 + \lambda \| \beta \|_1
    \right\} \] (5.14)


    where $\mathbf{Y}$ is the response vector, $\mathbf{X}$ is the matrix of predictors,
    $\beta$ is the vector of coefficients, $\| \beta \|_1$ is the L1-norm of the coefficient
    vector, $\lambda$ is a non-negative regularization parameter, and $N$ is the number
    of observations.


