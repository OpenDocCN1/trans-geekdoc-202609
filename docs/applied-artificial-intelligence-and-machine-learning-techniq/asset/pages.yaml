  md: '# 7 Acoustic-Based Parkinson''s Disease Diagnosis Using Transfer Learning Combining
    VGG16 with Light Gradient Boosting Machine (LGBM) Classifier


    Shibina V and Thasleema T M


    # 7.1 INTRODUCTION


    Parkinson''s disease (PD) is a chronic neurological impairment that progresses
    over time, mainly influencing motor control. The condition arises from the gradual
    destruction of dopamine-producing neurons in the substantia nigra, which is a
    region of the brain critical for mobility coordination. Patients commonly experience
    indications like tremors, slowness of movement, muscle rigidity, speech disorder,
    and balance problems. In addition to these motor symptoms, non-motor issues like
    sleep problems, cognitive decline, and mood disturbances are prevalent [1, 2].
    Speaking difficulties are frequently among the first indications of Parkinson''s
    disease. Research has indicated that 90% of PD patients have some degree of vocal
    dysfunction. PD impairs muscular function and voluntary movement; it significantly
    impacts the vocal system [3]. Speech disorders can include decreased vocal tract
    volume and tongue flexibility, decreased pitch range and intensity of speaking,
    poor speech quality, and untimely pauses. As a result, it makes sense and is a
    crucial topic to predict Parkinson''s disease via speech cues, particularly during
    its initial phases [4]. Automated speech analysis has been explored in recent
    studies to diagnose Parkinson''s disease. Deep learning (DL) and machine learning
    (ML) methods have been applied to verbal analytics to identify and monitor PD
    [5].


    PD symptoms can differ from one individual to another. Researchers have developed
    several imaging and signaling tests to detect PD. The examinations for PD are
    diffusion tensor imaging (DA Tscan) and magnetic resonance imaging (MRI) [6].
    Though biomarkers, genes, and neuroimaging have advanced, the medical detection'
  merge: -1
  img_proc: true
- pgno: 102
  md: 'of Parkinson''s disease remains difficult, especially in its initial phases
    or with unusual Parkinsonism [7]. Nevertheless, speech recording-based diagnostic
    methods have attracted considerable interest among these other approaches because
    alterations in speech or challenges with speech are one of the earliest motor
    indicators of PD, appearing up to 10 years before the disease is officially diagnosed,
    long before rigidity, gait abnormalities, and limb bradykinesia manifest [6–8].
    The voice signals piqued additional curiosity because they were non-invasive and
    inexpensive and could be used remotely by patients’ homes. Research shows that
    vocal cord injury is one of the first biomarkers of Parkinson’s disease in 90%
    of individuals. These difficulties with vocal production first manifest in Parkinson’s
    illness. Patients with Parkinson''s disease often talk with a raspier sound, less
    vibrato, and more breathiness. Dysarthria is the manifestation of voice problems
    in people with Parkinsonism. When the brain regions responsible for speech become
    inactive, a disorder known as dysarthria develops, mostly manifesting as a lack
    of control over one’s muscles. Damage to the basal ganglia causes hypokinetic
    dysarthria. Disabilities in phonation, prosody, and articulation are indications
    among the PD community. Disfluency in speech is indicated by articulatory impairment,
    and phonatory impairment is a decrease in vocal volume. Prosodic impairment is
    pausing anomalies, syllabic stress, and mono-pitch voice [6].


    Data science has been used in multiple types of studies to make progress in medical
    research for disease identification and categorization by considering different
    factors. Software platforms can deliver precise and quick diagnoses of illnesses
    in the medical field by utilizing newly developed artificial intelligence techniques.
    Thus, methods such as data mining (DM), deep learning, and machine learning are
    employed to select relevant features and cluster them for proper disease detection
    and prediction [6, 7]. The precise causes of Parkinson’s disease are not completely
    identified but are thought to entail both biological and ecological exposures
    such as chemicals or pollutants. Diagnosis is often challenging and based on clinical
    evaluations and medical history with imaging tests sometimes used to rule out
    other conditions. Although Parkinson’s disease has no approved remedy at the moment,
    there are therapies that can help lessen symptoms. These treatments include deep
    brain stimulation, dopamine agonists, and levodopa. Research currently being conducted
    attempts to understand the disease mechanisms better, identify early diagnostic
    markers, and develop innovative treatments, including advanced computational methods
    for monitoring disease progression. After Alzheimer’s disease, Parkinson’s disease
    is the second most prevalent neurological ailment and the second most common cause
    of cognitive loss [9]; it has a significant impact on patients and imposes considerable
    demands on healthcare systems globally [1, 2]. The literature outlines a broad
    range of approaches [10] applied for study of physiological signal characteristics.
    This study used the phoneme /a/ from the PC-GITA dataset to assess the transfer
    learning approach for PD diagnosis. Figure 7.1 illustrates the classification
    of diseases by applying the transfer learning mechanism where speech signals are
    turned into mel spectrograms, analyzed by VGG16 for key features, and classified
    by different models to detect disease. The further research is organized in the
    following manner. Section 7.2 summarizes the research approach utilized for this
    literature evaluation. Section 7.3 addressed the dataset and technique used in
    the current investigation. The findings of the research are discussed in Section
    7.4. In addition, Section 7.5 illustrated the study’s conclusions.'
