    # 5.3 MATERIALS AND METHODS


    This section details the materials and methodologies utilized in this study to
    enhance the detection of breast cancer using radiomics and machine learning techniques.
    We describe the dataset used, the processes of image segmentation, feature extraction,
    and the methods applied for feature selection.


    # 5.3.1 DATASET


    The primary dataset used in this research is the QIN Breast DCE-MRI dataset, which
    consists of MRI scans from 67 individuals, including 29 normal tissue cases and
    38 breast cancer cases [15]. This dataset was selected for its diversity and size,
    suitable for robust training and validation of machine learning models aimed at
    detecting breast cancer. The data is publicly available through the Cancer Imaging
    Archive, ensuring reproducibility and transparency in research [16].


    # 5.3.2 IMAGE SEGMENTATION


    Image segmentation is a crucial preprocessing step in radiomics, which involves
    dividing a digital image into multiple segments (sets of pixels, also known as
    image objects) to simplify or change the representation of an image into something
    that is more meaningful and easier to analyze [17]. In the context of breast cancer
    detection using MRI datasets, segmentation aims to accurately delineate the boundaries
    of breast tumors from the surrounding breast tissue.


    # 5.3.2.1 Segmentation Tools and Techniques


    For this study, the segmentation of MRI images was performed using the 3D Slicer
    software platform, which is widely recognized for its robustness in medical image
    analysis. Within 3D Slicer, we employed the “TotalSegmentator” tool, an AI-powered
    extension designed for high-precision automatic segmentation tasks.


    +   1. Preparation and Initialization: Initially, MRI datasets are loaded into
    the 3D Slicer environment. The images are then preprocessed to adjust contrast
    levels and remove any noise that could interfere with the segmentation process.'
