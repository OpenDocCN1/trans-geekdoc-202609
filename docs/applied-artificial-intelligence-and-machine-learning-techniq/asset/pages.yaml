    # 10.2.1 WORKFLOW AND ALGORITHM OF CHATGPT


    In ChatGPT, ’G’ represents ‘generative’, showing its capability to generate text
    based on the user’s prompt. Due to generative text formation, ChatGPT falls under
    the generative AI category. ’P’ represents ‘pre-training’, which reflects that
    ChatGPT is a pre-trained machine learning model, and ’T’ represents ‘Transformer’,
    which is the architecture of ChatGPT. In the following subsections, both the workflow
    and algorithm of ChatGPT are discussed briefly.


    # 10.2.2 ALGORITHM OF CHATGPT


    ChatGPT follows a 10-staged algorithm. The first stage is pre-training followed
    by (in sequence), transformer architecture, tokenization, context window, fine
    tuning, prompt encoding, iterative decoding, probability distribution, sampling
    strategy and response generation, which has been depicted in Figure 10.1 as a
    pictorial representation.


    # 10.2.2.1 Pre-Training


    Pre-training is the initial stage in which the model is pre-trained with a large
    corpus of datasets. The datasets are derived from books, articles and websites.
    Large'
