    # 10.2.2.2 Transformer Architecture


    Transformer architecture is a type of neural network architecture commonly used
    in machine learning, more so in natural language processing (NLP) tasks [14].
    Transformer architecture is used for self-attention mechanisms, which allows the
    model to capture dependencies between different positions within a sequence of
    data. The components of transformer architecture are encoder and decoder, self-attention,
    multi-head attention, positional encoding and feed-forward networks as shown in
    Figure 10.2.


    A tree graph of rounded rectangles with one central node and 5 child nodes Figure
    10.2 Components of transformer architecture.


    +   * The encoder processes the input sequence, while the decoder generates the
    output sequence. Both the encoder and decoder are composed of multiple layers.\n*
    Self-attention allows the model to give importance to different elements within
    a sequence while making predictions. It assigns a weight to each element based
    on its relevance to other elements in the sequence. By considering all elements
    simultaneously, the model can capture dependencies between different positions
    efficiently.\n* Multi-head attention means using the self-attention mechanism
    parallely for different inputs and layers. Each head attends to different subspaces
    of the input, allowing the model to capture different types of information simultaneously.
    This helps to improve the model’s capability to learn complex patterns.\n* Positional
    encoding is a technique being used to inject positional information into the input
    embeddings. It provides the model with a sense of relative or absolute position
    of elements within the sequence.'
