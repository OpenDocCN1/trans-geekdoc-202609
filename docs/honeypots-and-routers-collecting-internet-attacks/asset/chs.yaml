- "# 蜜罐与路由器：互联网攻击收集指南\n\n\n\n# 1 计算机网络\n\n**HABIB-UR REHMAN**\n\n计算机网络通常由三个组件组成：设备、媒介和拓扑。计算机、智能手机、笔记本电脑、路由器、交换机和中继器是计算机网络中可能存在的不同种类的设备。为了相互通信，这些设备通过媒介（无线或有线）连接在一起。通过媒介连接的设备所形成的示意图即为网络的拓扑结构。\n\
  \n在计算机网络中，通信实际上发生在设备之间。在人类对话的语境下，*communication*（通信）一词包含两人之间完整的对话。同样的规则适用于计算机网络：两个或多个设备之间的通信可能包含参与设备之间交换的多条消息。*Session*（会话）是一个更广泛使用的技术术语，用于描述设备之间交换的一系列相关消息。\n\
  \n在我们进一步深入讨论计算机网络之前，让我们回顾一下教科书中常用邮政服务的例子来解释计算机网络的工作原理。一栋房子可能有不止一位住户，他们可以是消息的发送者或接收者。所有这些住户共享同一个地址；然而，实际的发送者/接收者是通过信封上提到的姓名来识别的。邮政服务通常既不是发送者也不是接收者，但消息会经过它，并由它促成消息的传递。收件人地址用于将消息投递到目的地，发件人地址用于识别其来源。消息本身通常是以接收者可理解的方式排列的数据或信息。消息的整体组装也应让邮政服务能够理解，以便发件人和收件人的地址可区分、可识别且可定位。\n\
  \n当计算机通信时，诸如可理解、可区分或可识别等约束条件，要求对消息传递的程序和规定进行精确且全面的建立。这引入了计算机网络的第四个组件：协议。协议和标准是设备在通信过程中遵循的一组规则和程序。\n\
  \n本章分为四节，每节回顾计算机网络四个组件中的一个。\n\n## 1.1 设备\n\n设备在消息交换中通常扮演三种角色之一：它发起一条消息，或它是消息的接收者，或消息经过它传递。发起消息的设备通常称为*源端*或*源点*，而消息的接收者称为*目的端*或*汇点*。这两者合称为*端节点*或*端设备*。当两个端设备未直接连接时，消息会经过一个或多个中间设备。端设备通常是最终用户使用的计算设备，如\
  \ PC、手机和平板电脑；另一方面，中间设备通常是专用设备，其目的是促进端设备之间的传输。\n\n根据其在通信中的角色，设备必须按特定顺序执行若干步骤，以使通信成功。例如，源设备的任务仅是指定目的设备的地址，而非目的设备或中间设备的地址。开放系统互连（OSI）参考模型，通常如此称呼，是对设备在计算机网络中通信时执行的任务和职责的概念性描述。该抽象模型根据活动的相关性和依赖性，将其划分为七组，称为*层*：物理层、数据链路层、网络层、传输层、会话层、表示层和应用层（图\
  \ 1.1）。\n\n计算机通信的主要目的是服务用户并传递数据或信息。用户通过某个应用程序与计算机系统（即我们通信场景中的设备）进行交互；提供给系统或从系统接收的数据或信息通常采用用户可理解的格式。鉴于此，端设备通常执行\
  \ OSI 模型中描述的所有动作，换句话说，实现所有七层。另一方面，中间节点可能仅实现有限数量的层（或执行与较少层相关的任务），具体取决于其在通信中的角色。对计算机网络中的设备进行分类的一种方法是根据它们所属的层进行分组。¹\
  \ ![图 1.1 用于网络通信的 ISO/OSI 参考模型。](img/pg3_1.jpg)\n\n**图 1.1** 用于网络通信的 ISO/OSI 参考模型。\n\
  \n如前所述，用户主要与端设备交互，端设备是典型的计算设备。然而，通信始终涉及位于网络核心、连接两端的多个中间设备。接下来，我们提及通常参与计算机通信的四类重要中间设备。\n\
  \n### 1.1.1 调制解调器\n\n\n\n\n调制解调器的工作是将数字信号转换为模拟信号，反之亦然。当设备通过电话网络进行数字通信时，通常需要调制解调器。根据定义，调制解调器仅执行*mo*dulation（调制）和*dem*odulation（解调），这是属于\
  \ OSI 第 1 层的任务。然而，在几乎所有情况下，相应的第 2 层功能也是该设备的一部分。\n\n## 1.1.2 网桥\n\n网桥是一种在 OSI 参考模型第\
  \ 2 层运行的设备，它将两个较小的网络连接成一个，使两个网段中的设备能够相互通信。在大多数情况下，设备通过其端口单独连接到网桥。然而，当合并两个以上的较小网络时，多个网桥也可以通过相同的端口连接。网桥通常被称为*交换机*，尽管术语*交换机*具有更广泛的技术含义。网桥功能的更多细节请参见第\
  \ 1.4.1 节。\n\n## 1.1.3 路由器\n\n路由器也是将一个或多个网络合并为一个的设备；但是，它们属于 OSI 模型的第 3 层。这意味着与网桥相比，路由器执行更多且更复杂的任务。通常，与网桥不同，设备不会直接连接到路由器的端口；事实上，是网桥连接到路由器。多个路由器也可以相互连接，以合并连接到它们各自的网络。路由器的操作和特性稍后将在第\
  \ 1.4.2 节中描述。\n\n## 1.1.4 网关\n\n想象一位在中国的学生想通过邮政服务将入学申请发送给加拿大的一所大学。如果他只用中文写收件人地址会发生什么；加拿大的邮政工作人员如何投递？当遵循不同通信协议或标准的两个网络连接在一起时，需要一种网络设备来执行翻译工作，用技术术语来说是*转换*；这种设备称为*网关*。协议转换或翻译的功能可能在不同的级别或层中需要；因此，网关可以属于不同的层。例如，我们可以说调制解调器充当物理层网关设备。设计计算机网络的常见做法是在连接到单个路由器的整个网络中遵循相同的协议。因此，当两个路由器（遵循不同的协议/标准）连接在一起时，通常会产生对网关的需求。在这种情况下，网关的功能作为一个额外的软件组件在路由器内部实现，从而使路由器也能充当网关。\n\
  \n值得注意的是，在当今大多数计算机网络场景中，我们周围看到的设备有时会执行上述多种角色。一个非常常见的例子是家用路由设备，它既具有网桥的功能，也具有路由器的功能。同样，如今典型的\
  \ DSL 调制解调器结合了调制解调器、网桥、网关以及路由器的功能。\n\n## 1.2 传输介质\n\n计算机网络介质主要分为两大类：有线和无线。顾名思义，在有线介质中，消息通过连接设备的物理*线缆*传播。而在无线介质中，消息则以无线电波或红外波的形式在自由空间中传播。\n\
  \n### 1.2.1 有线网络\n\n铜线是有线计算机网络中最常用的介质形式。同轴电缆和双绞线是两种广泛使用的铜线或电缆类型。在拨号上网中，使用普通老式电话服务线将计算机连接到互联网。普通老式电话服务线也是铜线，计算机需要调制解调器才能通过这种线进行通信。第四种常见类型是光纤电缆，一种由玻璃或塑料制成的细电缆或光纤，可作为*光导管*工作。\n\
  \n**双绞线**。顾名思义，双绞线电缆由绞合在一起的细铜线制成。多对屏蔽或非屏蔽导线被捆绑在一根电缆中。由于成本较低且易于处理，双绞线电缆是计算机网络和电话网络中使用最广泛的电缆类型。根据质量、结构、用途和支持的数据速率，它有多种类型和类别。最高等级的双绞线电缆可达到\
  \ 1 Gbps 的数据速率；然而，大多数变体可在无显著信号强度损失的情况下传输高达 100 m 的信号。\n\n**同轴电缆**。同轴电缆中心有一根铜线，周围包裹一层绝缘层。在该绝缘层外，还有一层编织状的铜层和最后的外护套绝缘层。在双绞线电缆出现之前，它是常见的计算机网络电缆类型。目前，它仍常用于有线电视和有线互联网。\n\
  \n**光纤**。在光纤电缆中，信号以光束或光波的形式在玻璃或塑料光纤内传输。多根光纤通常捆绑在一根电缆中。单根光纤可承载多个光波，且每个光波可实现的数据速率远高于铜线。此外，干扰和衰减的影响非常小，使得信号能够传输更长的距离。由于其极高的数据速率和较高的成本，光纤电缆不用于互连单个计算机；而是用于汇聚网络。\n\
  \n### 1.2.2 无线网络\n\n无线网络主要分为两大类：第一类由无线电波承载数据；第二类由红外波承载数据。基于无线电的无线网络更为常见，因为红外波只能沿直线传播，无法穿透墙壁。无线介质的一个重要特征是它始终是共享的，因为信号在开放空间中传播，所有设备均可访问。\n\
  \n## 1.3 网络拓扑\n\n网络拓扑可以是物理的，也可以是逻辑的。物理拓扑描述设备如何在物理上相互链接，以及这些链路使用何种介质。另一方面，逻辑拓扑是物理拓扑的抽象视图，隐藏了不必要的细节。因此，通过过滤无关细节，一个物理拓扑可以产生多个逻辑拓扑。这两个术语之间的关系可以用建筑物的布局或规划来更好地描述。建筑物的详细规划将包含所有细节，如墙壁、门、电线、水管和下水道，就像物理拓扑包含计算机网络的所有细节一样。然而，我们也可以只有建筑物的电线布局图；这样的规划类似于计算机网络中的逻辑拓扑。计算机网络中的设备可以使用不同的方法互连；因此，可能存在不同种类的物理拓扑。\n\
  \n计算机网络覆盖的物理区域是与拓扑相关的另一个重要方面。这主要是由于不同介质类型的技术限制各异。一种对网络进行分类的经典方法是基于它们覆盖的地理区域。局域网（LAN）、城域网（MAN）和广域网（WAN）是三大主要类别。最初，LAN、MAN\
  \ 和 WAN 是根据覆盖区域来区分的；网络的管理边界以及参与网络的设备在目的方面的相关性是决定网络所属类别的一些附加因素。\n\n\n\n\n### 1.3.1\
  \ 广域网\n\n广域网是由分布在广阔区域（例如一个州、一个大陆，甚至更大）的设备组成的网络。因此，互联网通常被称为广域网；事实上，它是最大的广域网。同样，某些互联网服务提供商的全国性网络也是广域网的一个例子。\n\
  \n### 1.3.2 局域网\n\n局域网通常局限于一栋建筑或同一管理下的一组相邻建筑。局域网的地理界限并不那么精确，当局域网覆盖区域显著较大时，也会使用诸如\
  \ `campus area network`（校园区域网）之类的术语。然而，从技术上讲，当所有参与设备都使用私铺的物理拓扑互连，并在同一管理之下时，该网络被视为局域网。这一定义也引出了这样一个结论：当一个组织的业务分布在一个大都市区或广域区时，在几乎所有情况下，该组织的城域网或广域网在逻辑上（`logically`）都是铺设在其他组织（通常是该地区公共电话和数据网络的所有者）的物理网络之上的。\n\
  \n局域网和广域网使用的协议和技术也不同，这主要还是由于所用物理介质的不同衰减特性所致。\n\n## 1.4 网络协议与标准\n\n尽管设备和介质是计算机网络的物理组件，但协议对于通信的成功同样重要，因为设备需要遵循一个既定的计划。协议描述了设备在通信期间要执行的动作和遵循的准则。如前所述，OSI\
  \ 参考模型是计算机网络通信的基础文档。在大多数情况下，协议针对 OSI 模型的工作计划；然而，没有单一协议能覆盖 OSI 模型的所有七层。单个协议通常针对单个层的工作，且协议始终与相应的\
  \ OSI 层相关联。为了执行通信，设备遵循多个协议，这些协议以协作方式工作。这要求协议之间应当相互兼容。由于这一事实，协议以家族或群组的形式演进，其中一个家族包含属于不同\
  \ OSI 层且相互兼容的协议。\n\n协议和标准的类别实际上非常丰富且无穷无尽；然而，在本节中，我们将讨论范围限制在该列表中的相关项目。在计算机网络中，术语\
  \ `standard`（标准）宽泛地指代由某些既定权威或组织（如 IEEE）设计或批准、供更广泛商业用途的协议、模型、架构或其组合。\n\n## 1.4.1\
  \ IEEE 802 标准家族\n\nIEEE 802 是一组用于局域网和城域网的标准。它针对 OSI 模型前两层的通信任务。IEEE 802 局域网和城域网参考模型进一步将数据链路层划分为两个子层：介质访问控制（MAC）和逻辑链路控制，如\
  \ 图 1.2 所示。\n\nIEEE 802 局域网和城域网是基于分组的网络，消息作为数据八位字节序列传输；大多数商业可用的设备和应用程序都受这些标准支持。在该层面上，分组在技术上被称为\
  \ `frames`（帧）。MAC 子层主要负责两个设备之间的无连接帧传输，而逻辑链路控制更关注管理、安全或确认等服务（图 1.3）。\n\nIEEE 802\
  \ 标准家族针对多种类型的物理介质制定了单独的标准，如 图 1.4 所示。每个标准都是针对特定物理介质和相关 MAC 层的协议和准则的集合，例如以太网、无线局域网和宽带无线城域网。所有类型的\
  \ MAC 都通过 MAC 服务访问点向逻辑链路控制提供具有核心功能的通用服务。\n\n![Figure 1.2 IEEE 802 LAN and MAN reference\
  \ model for end stations. LLC—logical link control, MAC—medium access control, LSAP—link\
  \ service access point, MSAP—MAC service access point, And PhSAP—physical service\
  \ access point. (Data from IEEE Standard for Local and Metropolitan Area Networks:\
  \ Overview and Architecture, IEEE Std 802®-2001 [R2007].)](images/pg10_1.jpg)\n\n\
  **图 1.2** IEEE 802 终端站局域网和城域网参考模型。LLC—逻辑链路控制，MAC—介质访问控制，LSAP—链路服务访问点，MSAP—MAC 服务访问点，PhSAP—物理服务访问点。（数据来源：《IEEE\
  \ Standard for Local and Metropolitan Area Networks: Overview and Architecture》，IEEE\
  \ Std 802®-2001 [R2007]。）\n\n![Figure 1.3 IEEE 802 reference model with end-station\
  \ management and security. LMM— LAN/MAN management and SDE—secure data exchange.\
  \ (Data from IEEE Standard for Local and Metropolitan Area Networks: Overview and\
  \ Architecture, IEEE Std 802®-2001 [R2007].)](images/pg10_2.jpg)\n\n**图 1.3** 带有终端站管理和安全的\
  \ IEEE 802 参考模型。LMM—局域网/城域网管理，SDE—安全数据交换。（数据来源：《IEEE Standard for Local and Metropolitan\
  \ Area Networks: Overview and Architecture》，IEEE Std 802®-2001 [R2007]。）\n\n![Figure\
  \ 1.4 IEEE 802 standards family. (Data from IEEE Standard for Local and Metropolitan\
  \ Area Networks: Overview and Architecture, IEEE Std 802®-2001 [R2007].)](images/pg11_1.jpg)\n\
  \n**图 1.4** IEEE 802 标准家族。（数据来源：《IEEE Standard for Local and Metropolitan Area Networks:\
  \ Overview and Architecture》，IEEE Std 802®-2001 [R2007]。）\n\n最初，该标准将局域网视为一种具有共享介质、信息广播给所有站点的对等通信网络。然而，后来也纳入了用于局域网互连的网桥及相关功能。事实上，在不需要任何中间交换节点的情况下直接通信的能力，是\
  \ IEEE 对局域网和城域网定义中的第二个区别点，第一个是它们地理区域的差异。在其范围内，该标准讨论了两类局域网互连设备：用于 MAC 层互连的网桥（见 1.1\
  \ 节）以及用于物理层互连的中继器和集线器。为了理解这两类的区别，我们需要回顾术语 `access domain`（接入域）。\n\n**接入域**。局域网或城域网中一组使用单一\
  \ MAC 协议且介质在所有设备间共享的设备和介质被称为 `access domain`。在这种情况下，最多只有一个设备发送，连接到介质上的所有其他设备接收。中继器以一种方式连接两个局域网，使它们成为单个接入域，这意味着当来自任一参与局域网的一个设备发送时，所有连接的局域网上的所有其他设备都将接收。当我们有兴趣扩大局域网的范围时，中继器很有用，这可能是由于介质的技术限制，如信号衰减。当局域网中的设备使用星型布线拓扑连接时，术语\
  \ `hub`（集线器）用来指代中继器。\n\n\n\n\n\n### MAC 网桥\n\n承接我们在第 1.1 节中对网桥的早期介绍，IEEE 802 标准将网桥定义为在\
  \ MAC 层级互连两个或多个 LAN，但将它们保持为独立接入域的设备。网桥在 MAC 层运行，并对逻辑链路控制及任何其他上层保持透明。尽管设备可以与任何参与\
  \ LAN 中的任何其他设备通信，但消息通常仅在发送方所属的 LAN 和接收方所属的 LAN 中被听到，其余的 LAN 不会观察到此传输（图 1.5）。网桥会在必要时将在某个\
  \ LAN 上听到的消息中继或过滤到其他 LAN。中继和过滤基于存储在帧头中的目的地址和源地址。\n\n![Figure 1.5 Internal organization\
  \ of MAC sublayer with bridging. (Data from IEEE Standard for Local and Metropolitan\
  \ Area Networks: Overview and Architecture, IEEE Std 802®-2001 [R2007].)](images/pg12_1.jpg)\n\
  \n**图 1.5** 带网桥功能的 MAC 子层内部组织。（数据源自 *IEEE 标准：局域网和城域网概述与架构*，IEEE Std 802®-2001 [R2007]。）\n\
  \n### MAC 地址\n\n根据 IEEE 802 标准，每个设备^(²) 都使用 MAC 地址。MAC 地址用于帧头中以描述源设备和目的设备，并被网桥用来过滤和中继帧。\n\
  \n### 以太网\n\n以太网是属于 IEEE 802 系列的众多物理层 (PHY)/MAC 标准之一。它是建立有线 LAN 最广泛使用的技术。最初以 *Ethernet*\
  \ 之名发明，IEEE 正式将其批准为 *IEEE 标准 802.3*^(³)。\n\n在以太网中，设备以帧的形式发送消息，长度通常为 512 到 1518 个八位字节。帧包含若干字段，如源地址、目的地址、实际数据长度、实际数据（通常是上层数据包）和帧检验序列。详细的通用帧格式见图\
  \ 1.6。\n\n![Figure 1.6 Ethernet packet format. (Data from IEEE Standard for Ethernet,\
  \ IEEE Std 802.3-2012.)](img/pg13_1.jpg)\n\n**图 1.6** 以太网数据包格式。（数据源自 *IEEE 以太网标准*，IEEE\
  \ Std 802.3-2012。）\n\n![Figure 1.7 A bridged LAN. (Data from IEEE Standard for Local\
  \ and Metropolitan Area Networks: Overview and Architecture, IEEE Std 802®-2001\
  \ [R2007].)](images/pg14_1.jpg)\n\n**图 1.7** 一个桥接 LAN。（数据源自 *IEEE 标准：局域网和城域网概述与架构*，IEEE\
  \ Std 802®-2001 [R2007]。）\n\n### 桥接 LAN\n\n图 1.7 描述了一个典型的 IEEE 802 LAN，其中多个较小的 LAN\
  \ 通过网桥连接。正如图中所示，网桥拥有多个接口或端口，通过它们连接到多个 LAN 网段。此外，如果网桥连接两种不同类型的 IEEE PHY/MAC LAN，它可以支持多种\
  \ IEEE PHY/MAC 标准^(⁴)。\n\n如前所述，网桥通过中继和过滤的动作将 LAN 网段连成一个整体，但将它们保持为独立的接入域。除了帧的中继和过滤外，收集和更新用于中继、过滤以及管理目的的必要信息，也是网桥的职责之一。结合图\
  \ 1.7 需要考虑的一个重要方面是：当网桥连接遵循不同 LAN 标准的 LAN 网段时，要求连接特定 LAN 的网桥接口支持该 LAN 网段所使用的标准。因此，以太网网段只能连接到网桥的以太网端口，而\
  \ 802.5 网段只能通过网桥的 802.5 端口连接。\n\n## 1.4.2 互联网协议族\n\n互联网协议族是一组上层（网络层及以上）协议，其设计目标是在任意规模的网络中，为直接或间接通过其他设备连接的两台主机之间提供端到端的消息传递。由于该协议族中的两个主要协议是\
  \ TCP 和 IP，它通常被称为 *传输控制协议 (TCP)/互联网协议 (IP) 族*。该协议族是 DARPA 发起的研究计划的成果，后来有其他几位贡献者加入。\n\
  \nTCP/IP 族遵循其自身的网络模型，该模型实际上是在 OSI 参考模型之前设计的。与 OSI 模型不同，该模型只有四层，如图 1.8 所示。\n\n网络接口层实际上代表了\
  \ OSI 模型的两个下层，超出了 IP 协议族的范围，因为该协议族的设计初衷是主要支持各种底层物理网络技术。在分层的背景下，需要理解的一个重要点是：协议和标准并不严格遵循\
  \ OSI 模型的概念层边界；一个协议的职责描述往往涵盖列在多个相邻层中的职责，或者多个协议相互支持以执行某一特定层推荐的任务。图 1.9 显示了属于该协议族的若干协议及其在分层模型中的位置。\n\
  \n![Figure 1.8 OSI model versus the Internet model.](img/pg16_1.jpg)\n\n**图 1.8**\
  \ OSI 模型与互联网模型的对比。\n\n![Figure 1.9 Internet protocol family.](img/pg16_2.jpg)\n\n\
  **图 1.9** 互联网协议族。\n\n在本次回顾中，我们将再次重点关注与我们主要讨论内容相关的重要协议和问题。\n\n### 互联网协议\n\nIP...\n\
  \n### IP 寻址\n\n正如我们之前提到的，互联网模型建立在“互联网——网络的网络”这一概念之上。因此，设计者在该模型中纳入了一种寻址方案，它独立于底层技术和协议，但提供了一种以层次化方式对设备进行分组的手段；即，同一网络中的设备将被分配来自同一范围的地址以便于识别，而每个网络将使用不同范围的地址以便于区分。\n\
  \nIP 有两个版本：IPv4 和 IPv6。IPv6 的一项主要增强是将地址长度从 32 位扩展到 128 位。通常为了可读性，32 位长的 IPv4 地址写作四个十进制数的字符串，由*点*\
  \ (`.`) 分隔，每个数字代表地址中的 8 位。另一方面，128 位长的 IPv6 地址通常写作八个十六进制数的字符串，由*冒号* (`:`) 分隔，每个数字代表地址中的\
  \ 16 位。^(⁵)\n\n### 传输控制协议\n\nIP 协议族在传输层提供两种不同的选择：TCP 和用户数据报协议 (UDP)。TCP 的设计目标是在两个端设备之间提供基于连接的数据传输服务，并提供特定的服务保证，如成功交付、流量控制和拥塞控制。通常，选择\
  \ TCP 还是 UDP 由应用层根据其服务需求决定。例如，Web 浏览中使用的超文本传输协议 (HTTP) 基于 TCP。TCP 在第 1.5.2 节中进一步描述。\n\
  \n### 用户数据报协议\n\nUDP...\n\n\n\n\n# 路由器\n\n在结束对基本网络概念的回顾之前，有必要在互联网模型和 TCP/IP 协议族的视角下再次审视路由器。路由器是互联网的重要组成部分，互联网是一种基于互联网模型的广域网，因为它们是每个局域网连接到完整广域网的节点；也就是说，某个私有网络中的终端用户设备通过路由器与互联网的其余部分进行通信。这使我们得出了如图\
  \ 1.10 所述的互联网图景：一个由多个大小不一的互联网络组成的网络，每个网络通过其路由器接入互联网。因此，路由器是本地网络与互联网其余部分之间所有流量的入口/出口。这一事实给路由器带来了大量工作负载，特别是出口/入口路由器，通常称为*出口/入口路由器*，并使其在通信中的重要性成倍增加。起初，路由器的基本任务是识别通信路由并为不同的协议和技术提供互操作性。但凭借在拓扑结构中的这种战略位置，如今的路由器在流量分析和过滤方面也发挥着重要作用。\n\
  \n关于图 1.10 中描述的互联网架构，另一个重要事实是：在核心层，我们有一组设备网格，主要用于提供互联互通。这个核心实际上是由不同级别和规模的多个互联网服务提供商提供的服务基础设施。\n\
  \n![Figure 1.10 Physical model of the Internet.](img/pg19_1.jpg)\n\n**图 1.10** 互联网的物理模型。\n\
  \n## 1.5 常见网络协议\n\n在第 2 章和第 3 章中，我们将重点关注信息安全以及用于攻破信息系统安全的方法。IP 协议族是一组广泛应用于计算机网络的公共协议，也是黑客攻击的常见目标。在结束对计算机网络的回顾之前，让读者简要了解一下其中一些重要协议的技术细节将非常有用。\n\
  \n### 1.5.1 超文本传输协议\n\n`HTTP` 是一种应用层协议，用于在系统间共享超媒体消息。它是一种通用协议，不维护通信状态。它是万维网服务的核心。该协议随着时间的推移不断改进，以提供更好的功能并支持技术进步；现有三个可用版本：`HTTP/0.9`、`HTTP/1.0`\
  \ 和 `HTTP/1.1`，其中 `HTTP/1.1` 为最新版本。\n\n`HTTP` 遵循请求/响应模型，客户端通过向服务器发送请求消息来发起通信。该请求消息中包含的典型项目有：请求方法、统一资源标识符、协议版本、请求修饰符、客户端信息以及可能的主体内容。服务器用响应消息回应该请求，响应消息通常包含状态行、消息的协议版本、成功或错误代码、服务器信息、实体元信息以及可能的实体主体内容。\n\
  \n`HTTP` 通信通过 `TCP/IP` 连接执行，服务器默认在 `TCP` 端口 `80` 监听。然而，使用 `TCP` 并非强制性的，任何提供可靠交付的传输协议均可使用。在\
  \ `HTTP/1.0` 中，默认情况下，每次请求/响应交换都使用一个新的传输连接；而在 `HTTP/1.1` 中，可以将一个连接用于一次或多次请求/响应交换，通常称为*持久行为*。\n\
  \n`HTTP` 只有两种消息类型：客户端发送的请求消息和服务器发送的响应消息。这两种消息的通用格式分别显示在图 1.11 和图 1.12 中。\n\n![Figure\
  \ 1.11 HTTP request message format.](img/pg20_1.jpg)\n\n**图 1.11** HTTP 请求消息格式。\n\
  \n![Figure 1.12 HTTP response message format.](img/pg21_1.jpg)\n\n**图 1.12** HTTP\
  \ 响应消息格式。\n\n### 1.5.2 传输控制协议\n\n`TCP` 是 IP 协议族中的一项重要核心协议，设计用于传输层，旨在为分组交换计算机通信网络提供可靠的主机到主机服务。它是一种面向连接的端到端协议，支持多网络应用。`TCP`\
  \ 在运行于连接到互联计算机通信网络的主机计算机上的进程对之间，提供可靠的、有序的、经过错误检查的字节流进程间交付。`TCP` 的其他特性包括流量控制和拥塞控制，但不提供安全性或带宽保证。\n\
  \n`TCP` 是多种算法和过程的组合，可供讨论；然而，我们将在以下回顾中仅限于段结构和连接建立。\n\n#### TCP 段结构\n\n与 `HTTP` 拥有两种独立的消息类型不同，`TCP`\
  \ 段的用途是通过在段首部中选择标志位来描述的。在 RFC 793 中定义了六个基本标志位：\n\n*   `URG`：紧急指针字段有效\n*   `ACK`：确认字段有效\n\
  *   `PSH`：推送功能\n*   `RST`：重置连接\n*   `SYN`：同步序列号\n*   `FIN`：发送方无更多数据\n\n![Figure\
  \ 1.13 TCP segment format.](img/pg22_1.jpg)\n\n**图 1.13** TCP 段格式。\n\n该段（图 1.13）中的大多数字段都是自描述性且通用的。然而，序列号字段的实现依赖于主机，可能被入侵者利用。每个\
  \ `TCP` 段都由发起该段的主机分配一个序列号，以便接收主机能正确排序该主机发送的不同段并移除重复段。初始序列号的选择，即主机生成的第一个段中发送的序列号，通常取决于该主机上\
  \ `TCP` 的操作系统实现。这种现象有助于入侵者通过观察初始序列号来推断操作系统类型。\n\n#### TCP 连接建立\n\n`TCP` 使用三次握手过程在开始传输数据段之前建立连接（参见图\
  \ 3.4）。该过程由客户端主机发起，发送一个仅设置了 `SYN` 位的段，以表明建立连接的意图。如果服务器感兴趣，将回复一个同时设置了 `SYN` 和 `ACK`\
  \ 位的段，以确认收到该段并表明建立连接的意图。最后，客户端将发送一个设置了 `ACK` 位的段以确认收到。\n\n![Figure 1.14 TCP three-way\
  \ handshake connection setup.](img/pg23_1.jpg)\n\n**图 1.14** TCP 三次握手连接建立。\n\n###\
  \ 1.5.3 动态主机配置协议\n\n`DHCP`\n\n使用 `DHCP`，可以通过三种可能的方式为主机分配 IP 地址。首先，可以通过*自动分配*为主机分配一个永久\
  \ IP 地址。其次，可以为客户端分配一个为期有限的 IP 地址，称为*动态分配*。最后，在*手动分配*中，分配给客户端的 IP 地址由网络管理员选择，`DHCP`\
  \ 的工作只是传达这一分配。\n\n#### DHCP 如何分配 IP 地址\n\n在 `DHCP` 中，客户端遵循一个四步流程来自动获取 IP 地址（图 1.15）。\n\
  \n\n\n\n## 1.5.3 动态主机配置协议\n\n1.  主机通常由用户配置为使用静态 IP 地址，或通过 DHCP 获取自动分配，后者是最常用的选项。客户端通过发送\
  \ DHCP 发现消息来启动该过程。由于客户端不知道 DHCP 服务器的 IP 地址，因此该发现消息中的 IP 地址为广播地址，即 `255.255.255.255`，正是由于这一事实，此步骤被称为*发现*。DHCP\
  \ 服务器配置为监听 UDP 端口 `67`，而客户端需要选择 UDP 端口 `68` 作为源端口。DHCP 服务器可能不在与请求主机相同的子网中。在这种情况下，会在每个子网中放置\
  \ DHCP 中继代理。分配 IP 地址的请求在技术上称为 *IP 租约请求*。该请求消息中的另一个重要字段是客户端的 MAC 地址。\n\n    ![Figure\
  \ 1.15 DHCP IP address allocation process.](img/pg24_1.jpg)\n\n    **图 1.15** DHCP\
  \ IP 地址分配过程。\n\n2.  一旦服务器收到租约请求，它会向客户端发送 DHCP 提供消息。根据服务器针对客户端 MAC 地址的配置，此请求中提供的\
  \ IP 地址遵循三种方法之一进行选择。DHCP 提供消息中的重要项目包括提供的 IP 地址、子网掩码、租约期限以及服务器自身的 IP 地址。此提供消息的目标\
  \ IP 地址再次为 `255.255.255.255`，因为客户端迄今仍无 IP 地址；目标端口为前述的 UDP `68`。如果网络中有多个 DHCP 服务器，可能会有多个服务器发出提供。^(⁶)\
  \ 此处需考虑的另一个重要问题是：如果有多个客户端正在等待 IP 租约提供，当所有提供消息均为广播时，它们如何识别该提供是给谁的。\n\n3.  客户端将接受其中一个提供，并生成一条\
  \ DHCP 请求消息，以获取相应服务器提供的 IP 地址。该消息遵循与 DHCP 发现相同的传递配置，即进行广播，因为所有 DHCP 服务器都应被正式告知客户端接受了哪个服务器的提供，以便其他服务器撤回其提供。\n\
  \n4.  最后，DHCP 服务器通过发送 DHCP ACK 消息和其他必要配置来确认租约。\n\n## 1.5.4 互联网控制消息协议\n\n互联网控制消息协议\
  \ (ICMP)\n\n![Figure 1.16 ICMP packet format.](img/pg25_1.jpg)\n\n**图 1.16** ICMP\
  \ 数据包格式。\n\nICMP 消息通常在以下情况下发送：\n\n*   数据报无法到达目的地。\n*   网关的缓冲区没有足够的空间来转发数据报。\n\n\
  为了反馈或错误报告的目的，类型和代码字段组合在一起拥有一份详尽的关联状态码列表；表 1.1 描述了一些重要的组合。\n\n**表 1.1** 重要的 ICMP\
  \ 类型和代码组合\n\n| 类型 | 代码 | 说明 |\n| :--- | :--- | :--- |\n| 0—回显应答 | 0 | 回显应答（用于 ping）\
  \ |\n| 3—目的地不可达 | 0 | 目的网络不可达 |\n|  | 1 | 目的主机不可达 |\n|  | 2 | 目的协议不可达 |\n|  | 3\
  \ | 目的端口不可达 |\n|  | 4 | 需要分片，但设置了 DF 标志 |\n|  | 5 | 源路由失败 |\n|  | 6 | 目的网络未知 |\n\
  |  | 7 | 目的主机未知 |\n|  | 8 | 源主机被隔离 |\n|  | 9 | 网络被管理上禁止 |\n|  | 10 | 主机被管理上禁止 |\n\
  |  | 11 | 因 TOS 网络不可达 |\n|  | 12 | 因 TOS 主机不可达 |\n|  | 13 | 通信被管理上禁止 |\n|  | 14\
  \ | 主机优先权冲突 |\n|  | 15 | 优先权中止生效 |\n| 5—重定向消息 | 0 | 为网络重定向数据报 |\n|  | 1 | 为主机重定向数据报\
  \ |\n|  | 2 | 为 TOS 和网络重定向数据报 |\n|  | 3 | 为 TOS 和主机重定向数据报 |\n| 8—回显请求 | 0 | 回显请求（用于\
  \ ping） |\n| 11—超时 | 0 | 传输中 TTL 过期 |\n|  | 1 | 片段重组时间超时 |\n| 12—参数问题：错误的 IP 头部\
  \ | 1 | 指针指示错误 缺少必需选项 |\n|  | 2 | 错误的长度 |\n| 13—时间戳 | 0 | 时间戳 |\n| 14—时间戳应答 | 0\
  \ | 时间戳应答 |\n| 17—地址掩码请求 | 0 | 地址掩码请求 |\n| 18—地址掩码应答 | 0 | 地址掩码应答 |\n\n## 1.5.5\
  \ 地址解析协议\n\n地址解析协议 (ARP)\n\n由于 ARP 提供了网络层和数据链路层之间的联系，它本身工作在网络层之下，因此不可路由。这意味着 ARP\
  \ 数据包被直接封装在数据链路层帧中，只能在局域网内传输，而不能跨越路由器。\n\nARP 只有一种数据包格式，通过在操作字段中描述合适的值来指定不同的操作；例如，`1`\
  \ 代表 ARP 请求，`2` 代表 ARP 应答。另外两个重要字段是硬件类型和协议类型。硬件类型指定硬件标准，ARP 为不同标准提供了代码列表，例如 `0001`\
  \ 代表以太网。同样，协议类型指定网络层协议的代码，IPv4 的情况为 `0×0800`（图 1.17）。\n\n*地址解析过程*。网络层数据报被交给数据链路层进行传输，帧头中需要填写相应的硬件地址以便投递。ARP\
  \ 维护一个缓存或 ARP 表，用于存储已知的网络层地址到物理层地址的映射。如果缓存中没有网络层地址对应的物理层地址，则会在局域网中广播一个 ARP 请求数据包（MAC\
  \ 地址全为 1），其中包含缺少物理层地址的网络层地址。因为是广播，局域网上的每台主机都会收到该帧，如果被请求的主机存在，它将通过应答消息单独向请求主机回复其物理地址（图\
  \ 1.18）。请求主机将此条目存储在 ARP 缓存中以备将来使用。此外，ARP 请求消息有助于网络中的其他主机更新其 ARP 表中关于请求源的条目。\n\n\
  ![Figure 1.17 Generic ARP packet format.](img/pg28_1.jpg)\n\n**图 1.17** 通用 ARP 数据包格式。\n\
