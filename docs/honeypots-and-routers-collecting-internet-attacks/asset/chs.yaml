  \n###### 防火墙限制\n\n双蜜网配置为执行无限制出站连接，如前文 (7.2) 所述。\n\n###### 配置 Sebek 变量\n\nSebek 是一种数据捕获工具，旨在捕获攻击者在蜜罐上的活动。它包含两个组件。第一个是在蜜罐上运行的客户端；其目的是捕获攻击者的所有活动（按键、文件上传和密码），然后隐蔽地将数据发送给服务器。第二个组件是服务器，它从蜜罐收集数据。服务器通常运行在蜜墙网关上。\n\
