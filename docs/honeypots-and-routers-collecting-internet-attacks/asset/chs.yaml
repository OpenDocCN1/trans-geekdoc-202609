  \ exploits（零日漏洞利用）**, 110\n\n---\n\n1.  * 设备中上层 OSI 功能的存在要求其也应执行所有下层的任务，即它应实现到该层级的所有层。因此，如果我们说一个设备是第\
  \ 3 层设备或属于第 3 层，这意味着它实现（或执行与之相关的动作）了从第 1 层到第 3 层的所有层。↩\n\n2.  * 此处术语*device*（设备）在技术上是指*interface\
  \ of a device*（设备接口）。由于一个设备可以拥有多个网络接口，这些接口中的每一个都将拥有自己的 MAC 地址。然而，在上层，所有这些独立的数据流可能会为了单一通信目的而合并。例如，路由器通常有多个接口，转发工作是通过将数据包——在其中一个接口上接收——中继到一个合适的接口来执行的。↩\n\
  \n3.  * 以太网和 802.3 如今通常被视为同一标准。然而，它们在原始设计上存在细微的技术差异。↩\n\n4.  * 尽管图中未显示，网桥（如果需要）也支持\
  \ IEEE 无线 PHY/MAC 标准。↩\n\n5.  * 由于一个十六进制数字等于四个二进制数字，每个数字将有四个十六进制数字。↩\n\n6.  * 存在\
  \ DHCP offer（提供）不进行广播的情况，例如，当客户端已拥有 IP 地址并仅请求延长租约时。↩\n\n7.  * 在计算机安全语境下有多个方面，如硬件和软件；然而，本书的重点是利用计算机通过计算机网络进行的通信。↩\n\
  \n8.  * CIA 一词最熟悉的用法是指中央情报局；因此，在文献中一些作者也使用*AIC triad*（AIC 三要素）一词以避免混淆。↩\n\n9.  *\
