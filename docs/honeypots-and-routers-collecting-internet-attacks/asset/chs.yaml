  \ 年 12 月。\n\n# 3 入侵与漏洞\n\n**HABIB-UR REHMAN**\n\n由于大部分物理基础设施公开可访问且由用户共享，保障通信及其内容的安全是计算机网络中的一项重要关注点。这一事实使得我们在第\
  \ 2 章中描述的所有安全目标都发挥了作用。此外，我们在第 1 章中回顾了，用于在端主机之间传递消息的大多数协议都是公开的。因此，每个人都知道传输消息时将执行的动作序列，并可能利用这些知识攻击正在进行的通信。这绝不意味着计算机网络中没有任何安全可言；协议已演进以克服此类缺陷。然而，计算机网络（尤其是互联网）的服务模型是以一种无法消除所有弱点的方式开发或演进的。\n\
  \n入侵者利用系统的漏洞发起攻击；这使得系统管理员和合法用户极其有必要充分了解这些漏洞。如果设计和配置不当，网络、主机以及运行在主机上的应用程序都可能被滥用。本章旨在突出这三个层面的此类问题。我们试图编制一份已知常见攻击的综合清单。\n\
  \n## 3.1 网络与协议漏洞\n\n公开协议及其漏洞确实是计算机网络中攻击的最大来源。本节讨论超文本标记语言 (HTTP) 等协议上可能发生的常见攻击。\n\
  \n### 3.1.1 HTTP 标志抓取\n\n万维网是一项公共服务；因此，运行 Web 服务器的主机被配置为允许任何针对 80 端口（Web 服务的知名端口）的传入请求。HTTP\
  \ 是用于 Web 服务的协议，旨在用 HTTP 响应消息回复每一个 HTTP 请求消息。通常，此响应消息包含主/默认页面（多半命名为 index^(⁹) ![图\
  \ 3.1 典型 HTTP 响应消息。](img/pg46_1.jpg)\n\n**图 3.1** 典型 HTTP 响应消息。\n\n标志抓取被归类为攻击前^(¹⁰)\n\
  \n这种标志抓取攻击也适用于电子邮件消息，接收到的电子邮件的头部也包含含有重要信息的字段。然而，电子邮件场景不同于 HTTP 场景，因为只有手头有电子邮件时才能进行此类分析。\n\
  \n*SMTP 枚举*。然而，在用于将电子邮件传递到邮件服务器的 SMTP 协议中，入侵者可以通过 Telnet 提示符等接口使用 `VRFY`、`EXPN`\
  \ 和 `RCPT TO` 命令来识别哪些电子邮件地址是有效的，哪些是无效的。因此，入侵者可以建立一个有效电子邮件地址列表，稍后可用于垃圾消息发送等恶意活动。\n\
  \n### 3.1.2 HTTP 隧道\n\n隧道技术是计算机网络中的一个重要概念，即将一种协议的数据包封装在另一种协议的数据包内。当隐藏/内层数据包的协议不被底层网络支持时，通常会采用这种方法；这可能是由于管理限制、协议不兼容或设备限制。隧道技术增加了网络的效用，因为它即使在存在不兼容的情况下也能实现通信。例如，通过建立端到端的\
  \ IPv4 隧道，或根据需求建立较少跳数的隧道，可以在通过不支持 IPv6 的设备（部分或全部）连接的端主机之间共享 IPv6 数据报。隧道技术可在任何层或协议上执行。然而，HTTP\
  \ 隧道是一个主要关注点，因为 HTTP 消息极少被过滤或阻断^(¹¹)\n\nHTTP 隧道是通过使用设计为通过 HTTP 通信的软件来执行的。该软件的客户端组件安装在用户^(¹²)\n\
  \n### 3.1.3 TCP 扫描\n\n\n\n\n#### TCP 端口扫描技术\n\nTCP 是互联网上应用最广泛的传输层协议，因为它提供了大多数应用程序所需的可靠、有序的交付。然而，这是以操作复杂性和大量漏洞为代价的。在发送实际应用消息之前，TCP\
  \ 连接通过三次握手过程建立。基于 TCP 的行为，特别是在连接建立阶段，可以应用多种技术来揭示目标网络/主机的详细信息。一种常见的方法是向目标主机发送不同类型的\
  \ TCP 段，以识别目标上端口的开放/关闭状态。这种攻击方法通常被称为*端口扫描*。\n\n![Figure 3.2 HTTP tunneling process.](img/pg49_1.jpg)\n\
  \n**图 3.2** HTTP 隧道过程。\n\n#### TCP Connect/Full Open Scan（TCP 连接/全开放扫描）\n\n客户端主机尝试在某个端口上与目标主机建立一个正常的\
  \ TCP 连接。如果该端口开放了 TCP 服务，则通过执行三次握手成功建立连接；否则，将收到一个带有复位（RST）位的 TCP 段，指示该端口未开放连接（图\
  \ 3.3b）。这种扫描技术也被称为*Vanilla scan*（香草扫描）——即入侵者对所有 65,536 个端口进行全开放扫描。常规 TCP 行为（全开放扫描也遵循该行为）是在步骤\
  \ 3 中响应一个确认（ACK）段，并继续传输应用消息（图 3.3a）。\n\n#### Slow Scan（慢速扫描）\n\nVanilla scan——即基于全开放扫描方法对目标系统的所有端口进行扫描——有一个缺点：大多数主机会记录成功的\
  \ TCP 连接；因此，管理员可以通过观察日志来识别此类攻击，当他们发现不同端口上有如此多的成功连接尝试时。为了避免这个问题，一种方法是在合理的间隔后尝试下一个端口——即以降低速度进行扫描。慢速扫描是最简单的隐蔽扫描方法。\n\
  \n![Figure 3.3 (a) TCP connection handshake when target port is open. (b) TCP connection\
  \ handshake when target port is closed.](img/pg50_1.jpg)\n\n**图 3.3** (a) 目标端口开放时的\
  \ TCP 连接握手。(b) 目标端口关闭时的 TCP 连接握手。\n\n#### Half Open/SYN Scan（半开放/SYN 扫描）\n\n全开放扫描的另一个重要方面是，握手的第三步不会揭示关于端口状态的任何额外信息，这一点在图\
  \ 3.3 中可以轻松看出。因此，在同步（SYN）扫描中，如果端口开放，客户端将响应一个 TCP RST 段以立即销毁正在进行的连接请求（图 3.3a）。SYN\
  \ 扫描也被认为是隐蔽扫描方法之一，因为它试图避免被管理员察觉。\n\n#### Xmas or Xmas-Tree Scan（Xmas 或圣诞树扫描）\n\n\
  Xmas 扫描是另一种隐蔽方法，客户端向目标主机发送无效的 TCP 标志组合。如果目标系符合 RFC 793 中的 TCP 规范，它会在端口关闭时响应一个 TCP\
  \ RST 段，或在端口开放时忽略该段。这种攻击通常仅适用于 UNIX 主机；Windows 机器总是忽略此类段。Xmas 扫描有两种变体。第一种变体仅使用结束（FIN）、紧急（URG）和推送（PSH）标志——即在段中设置这三个标志。在第二种变体中，设置所有\
  \ TCP 标志（图 3.4）。\n\n#### FIN Scan（FIN 扫描）\n\nFIN 扫描是一种类似于 Xmas 扫描的方法，因为它也在接收到的段中使用意外的\
  \ TCP 标志组合。然而，在 FIN 扫描中，仅设置 FIN 标志。这样的段是意外的，因为 FIN 段通常发送用于指示关闭已建立连接的意图，而这里客户端和目标之间没有工作连接。在这种情况下，关闭的端口再次响应一个\
  \ TCP RST 段，而开放的端口忽略此类段。\n\n#### Null Scan（空扫描）\n\nNull 扫描可以被视为与 Xmas 扫描相反的方法，因为在这种情况下，发送的\
  \ TCP 段所有标志均未设置。在 TCP 中，这样的段确实是在成功建立连接后传输的正常数据段。由于目标主机与客户端没有建立连接，如果目标端口开放，它将丢弃该数据包。如果端口关闭，它将响应一个\
  \ TCP RST 段。Null 扫描的成功取决于目标主机中 TCP 协议栈的实现，通常此类段在 Microsoft 平台上会被阻止。\n\n![Figure\
  \ 3.4 TCP Xmas-tree scan process.](img/pg51_1.jpg)\n\n**图 3.4** TCP 圣诞树扫描过程。\n\n\
  #### Inverse Flag Scans（反向标志扫描）\n\nXmas-tree、FIN 和 null 扫描也被称为*反向*或*反向标志扫描*，因为在这些扫描中，目标端的关闭端口会回复一个段，而开放端口不响应。\n\
  \n#### ACK Scan（ACK 扫描）\n\n另一种通过发送意外 TCP 段来利用目标的方法是在段中设置 ACK 标志。ACK 段通常作为握手过程的第三步发送，或用于确认成功接收数据段。^(¹³)\n\
  \n#### Fragmented Scan（分片扫描）\n\n为了避免被防火墙检测到，不同 TCP 扫描中用于提高有效性的一种方法是将 TCP 头部分割成多个\
  \ Internet 协议（IP）片段——即在多个 IP 数据报中发送探测段。大多数入侵检测系统在 TCP 头部分片时无法检测到扫描。\n\n#### Idle\
  \ or Dumb Scan（空闲或哑扫描）\n\n空闲扫描是一种复杂但聪明的攻击，借助第三方主机执行，通常称为*哑*或*僵尸主机*，因为它无意中参与了攻击。该攻击利用了这样一个事实：主机生成的所有\
  \ IP 数据报都被分配一个*片段标识号*，并且每个新数据报的片段 ID 比前一个生成的数据报大 1。因此，如果主机 X 从主机 Y 接收到没有间隙的 IP 数据报片段\
  \ ID，这表明主机 Y 目前没有与任何其他主机通信。\n\n在空闲攻击中，入侵者与哑主机通信并观察 IP 片段 ID 的增量；可以使用任何反向标志扫描方法来实现此目的。选择主机作为僵尸时要考虑的重要一点是，它是一台空闲主机，目前不产生任何其他\
  \ IP 流量。因此，当反复探测时，僵尸主机发送的 IP 数据报将具有连续的片段 ID。关于这种攻击有趣的是，僵尸主机并不是入侵者的实际目标。入侵者向实际目标主机发送一个\
  \ SYN 段，但使用僵尸主机的 IP 地址——即欺骗 IP 地址。如果目标主机的端口开放，一个 SYN + ACK 段将被发送给僵尸主机，僵尸主机将回复一个\
  \ RST 段，因为它从未对该连接感兴趣。僵尸主机发送给目标主机的这个段将在入侵者通过探测僵尸主机所观察到的 IP 片段 ID 中产生一个间隙，表明目标主机的请求端口是开放的（图\
  \ 3.5）。\n\n\n\n\n\n### TCP 会话劫持\n\n会话劫持是一种攻击，入侵者通过窃取会话 ID 并冒充授权用户，恶意接管双方正在进行的通信会话。在\
  \ TCP 会话劫持中，一旦会话在两个授权用户之间成功建立，入侵者便控制该 TCP 会话。会话劫持需要获取会话 ID，这可以通过多种方法获得，例如盲目猜测、中间人方法或会话嗅探。在\
  \ TCP 会话中，正在进行的通信有三个重要参数：IP 地址、端口号和序列号。入侵者尝试通过不同机制获取这三项，一旦成功，即发起攻击。\n\n![Figure\
  \ 3.5 Idle scan process.](img/pg53_1.jpg)\n\n**图 3.5** 空闲扫描过程。\n\n### IP 欺骗\n\n\
  空闲扫描是被归类为欺骗方法的一种手段，入侵者隐藏其实际身份（如 IP 地址），或在同一次攻击中使用多个地址以避免被检测。欺骗的概念也被用于其他技术中，例如媒体访问控制\
  \ (MAC) 欺骗。\n\n### 文件传输协议反弹攻击\n\n文件传输协议 (FTP)\n\n![Figure 3.6 FTP bounce when port\
  \ on the target is closed. Note: The syntax of the PORT command is a little strange\
  \ as the address of the destination host is specified in the form of 6 comma separated\
  \ decimal numbers. The first four numbers represent the IP address and can simply\
  \ be used by replacing commas with dots. The last two numbers specify the port number\
  \ on the destination in a format quite similar to the IP addressing. The sixth number\
  \ represents the right eight bits of the port number while the fifth number represents\
  \ the left eight bits of the port number; combine they make the 16-bit port number.\
  \ Hence, the simple calculation to find the exact port number is to multiply the\
  \ fifth number with 256 and then add to the sixth number.](img/pg54_1.jpg)\n\n**图\
  \ 3.6** 目标端口关闭时的 FTP 反弹。注意：PORT 命令的语法有点奇怪，因为目标主机的地址是以 6 个逗号分隔的十进制数形式指定的。前四个数字代表\
  \ IP 地址，只需将逗号替换为点即可使用。后两个数字以与 IP 寻址非常相似的格式指定目标上的端口号。第六个数字代表端口号的右侧八位（低 8 位），而第五个数字代表端口号的左侧八位（高\
  \ 8 位）；两者结合构成 16 位端口号。因此，查找确切端口号的简单计算方法是将第五个数字乘以 256，然后加上第六个数字。\n\n![Figure 3.7\
  \ FTP bounce when port on the target is open.](img/pg54_2.jpg)\n\n**图 3.7** 目标端口开放时的\
  \ FTP 反弹。\n\n### 3.1.4 DHCP 漏洞\n\n#### DHCP 饥饿攻击\n\nDHCP\n\n#### 伪造 DHCP 服务器\n\n\
  入侵者在网络中引入一个伪造的 DHCP 服务器，使其能够响应 DHCP 发现消息。该伪造服务器也会针对发现请求生成 DHCP 提供，意图并希望某些客户端可能会选择其提供的租约。如果发生这种情况，客户端可能会因提供错误的网络配置而被拒绝服务。入侵者也可能将伪造服务器的\
  \ IP 地址（或其他某台机器的地址）作为网关地址提供给客户端，使客户端流量经过伪造服务器，从而被分析用于恶意目的，进而导致中间人攻击（图 3.8）。\n\n\
  ![Figure 3.8 Rogue DHCP server leading to the man-in-the-middle attack.](img/pg56_1.jpg)\n\
  \n**图 3.8** 伪造 DHCP 服务器导致中间人攻击。\n\n### 3.1.5 ICMP 扫描\n\nICMP 被路由器等网络设备用于执行错误消息传递。每个\
  \ ICMP 消息携带一个 8 位类型值和一个 8 位代码值，这两个字段共同关联一个状态/错误消息。例如，类型 3 代码 0 表示目标不可达，原因是目标网络不可达。ICMP\
  \ 消息被多种工具用于恶意收集目标网络和主机的信息，因为 ICMP 请求总会得到响应。示例如下：\n\n- 类型 8 消息是回显请求，如果主机可用，默认会由回显应答（类型\
  \ 0）响应。此技术用于识别网络上的活跃设备，由于其在 ping 实用程序中的用途，通常称为 **ping 扫描**。如图 3.9 所示，Ping 扫描是一种枚举技术，向广泛的\
  \ IP 地址范围发送 ping 消息以识别活跃和非活跃主机（图 3.9）。\n- 类型 13 消息请求时间戳，从而可揭示目标的时区。\n- 类型 17 消息是网络掩码请求，可揭示子网划分详情。\n\
  \n![Figure 3.9 Ping sweep process.](img/pg56_2.jpg)\n\n**图 3.9** Ping 扫描过程。\n\n\
  ICMP 扫描通常不被视为端口扫描技术，因为端口的概念在 ICMP 层面不适用；端口通常在传输层通过 TCP 可用/可寻址。它主要有助于识别网络上的存活主机，因此可归类为一种枚举方法。\n\
  \n#### UDP 扫描\n\n由于 UDP 是无连接协议，通过发送 UDP 数据段难以识别目标状态，因为无回复可能有多种原因。然而，发送到未关联任何应用程序的端口（端口关闭）的\
  \ UDP 数据段，会被目标主机以 ICMP 端口不可达消息（类型 3 代码 3）响应。因此，UDP 数据段可识别出未开放的端口。\n\n#### IP 扫描\n\
  \n向目标主机发送多个协议字段值不同的 IP 数据报。假设是对于主机不支持的协议，目标将回复 ICMP 目标协议不可达数据包（类型 3 代码 2）。这样入侵者就能识别出主机除常规\
  \ TCP 和 UDP 外，是否支持其他传输协议。\n\n### 3.1.6 地址解析协议\n\n地址解析协议 (ARP)\n\n#### ARP 扫描\n\n\
  ARP 扫描是一种用于发现局域网内活跃主机的技术。入侵者发送具有不同 IP 地址的 ARP 请求，通常是子网范围内所有可能的地址。如果目标主机存活，将回复 MAC\
  \ 地址，从而识别出所有可用主机。\n\n#### ARP 欺骗和投毒\n\nARP 没有机制让 ARP 应答的接收者验证所描述的映射是否正确。此漏洞被用于欺骗攻击，入侵者向局域网上的其他主机发送带有错误映射的\
  \ ARP 应答，或用自己的 MAC 地址回复针对其他主机的 ARP 请求。因此，由于源头处的 ARP 条目错误，本应发往实际目的地的流量会被发送给入侵者。此外，它还会投毒主机、交换机和路由器的\
  \ ARP 缓存。\n\n### 3.1.7 链路层漏洞\n\n\n\n\n\n## 3.1.7 数据包嗅探\n\nIEEE 802 系列 LAN 标准通常基于共享介质的概念开发，主机可以接收其连接链路上的所有流量，或在无线主机的接收范围内的所有流量。为了避免开销，网络接口卡会检查帧头中的源地址，如果不匹配自己的地址也不是广播地址，则停止监听。然而，IEEE\
  \ 802 网络接口卡设计有混杂模式，在此模式下网卡接收介质上的所有流量。嗅探软件可收集这些流量进行恶意分析。在无线 LAN（如 802.11）或多个主机处于单一冲突域的以太网变体中，^(¹⁴)\n\
  \n如果以太网是交换式的，即每个主机连接到独立端口，交换机根据连接主机的 MAC 地址过滤各端口流量，则无法使用混杂模式进行嗅探，因为现在每个端口都是独立的冲突域。但这不保证完全无法嗅探。ARP\
  \ 投毒或欺骗是可在交换式以太网中嗅探流量的一种方法。\n\n以太网交换机拥有 MAC 表、过滤表或内容可寻址存储器表，用于存储 MAC 地址与端口号的关联（即连接在端口\
  \ X 上的主机的 MAC 地址）。无需预配置 MAC 表；交换机设计为即插即用。初始时 MAC 表为空，当某端口收到帧时，会以该帧的源地址为该端口连接的主机，在\
  \ MAC 表中为该端口创建条目。MAC 表持续通过这种方式维护。转发帧时，交换机在 MAC 表中查找目的 MAC 地址以确定其连接的端口。若找到条目，帧仅转发到该端口；否则，除接收帧的端口外，向所有端口广播。图\
  \ 3.10 给出了该过程的分步示例。\n\n![图 3.10 (a) 以太网交换，初始 MAC 表为空。(b) 从 A 到 B 的帧，MAC 表中新建 A 的条目；因无\
  \ B 的 MAC 条目，帧将转发到所有端口（除接收端口外）。(c) 从 C 到 A 的帧，MAC 表中新建 C 的条目，仅转发到 A 所连的端口。](img/pg59_1.jpg)\n\
  \n**图 3.10** (a) 以太网交换，初始 MAC 表为空。(b) 从 A 到 B 的帧，MAC 表中新建 A 的条目；因无 B 的 MAC 条目，帧将转发到所有端口（除接收端口外）。(c)\
  \ 从 C 到 A 的帧，MAC 表中新建 C 的条目，仅转发到 A 所连的端口。\n\n由于 ARP 数据包作为以太网帧传输，交换机利用它们维护 MAC 表。在\
  \ ARP 投毒或欺骗攻击中，交换机会在其 MAC 表中插入错误映射条目，使入侵者能够嗅探发往其他主机的数据包。\n\n#### MAC Flooding\n\n\
  MAC Flooding 是另一种混淆以太网交换机、使其停止过滤帧的技术。该攻击利用交换机存储 MAC 表的内存有限这一事实。当内存不足以存储新条目时，大多数交换机配置为广播消息，以免影响\
  \ LAN 连接，称为“故障开启模式”。于是整个 LAN 变成单一冲突域，包嗅探成为可能。\n\n在 MAC Flooding 攻击中，入侵者用帧淹没交换机，每个帧都有不同的伪造\
  \ MAC 地址。交换机因此不断为这些新 MAC 地址在 MAC 表中创建新条目，最终进入故障开启模式。\n\n#### MAC Spoofing\n\nMAC\
  \ Spoofing（即使用不同于网卡烧录地址的地址）在大多数硬件上被允许。入侵者常用此法在网络上伪装成授权用户。当然，这要求入侵者先用某种技术识别网络上一些有效的\
  \ MAC 地址，以便稍后用于欺骗。\n\n### 3.1.8 DNS 漏洞\n\n域名系统（DNS）是互联网上的重要服务，DNS 服务器保存互联网域名与其关联的主机\
  \ IP 地址之间的映射。DNS 服务器以层级方式实现：顶层为一组根 DNS 服务器，第二层为顶级域服务器，第三层为权威 DNS 服务器。DNS 是公开可访问的服务，便于访问互联网及其服务。因此，DNS\
  \ 与互联网上的其他公共服务一样脆弱。\n\n#### Intranet DNS Spoofing（内网 DNS 欺骗）\n\n入侵者利用嗅探技术捕获 LAN\
  \ 上生成的 DNS 请求报文。由于 DNS 报文未加密，捕获报文后任何人都可查看请求内容。入侵者继而伪造 DNS 回复，向请求主机提供错误信息。错误的 DNS\
  \ 信息意味着请求的互联网地址会映射到错误的主机/IP，这些可能属于入侵者创建的伪造站点，用于捕获受害主机发送的报文。\n\n捕获 DNS 请求的常用方法是利用\
  \ ARP 投毒攻击网关/路由器，使其拥有无效的 DNS 服务器条目。于是路由器将所有 DNS 请求重定向给入侵者，误以为其为指定的本地 DNS 服务器。\n\n\
  #### Internet or Remote DNS Spoofing（互联网或远程 DNS 欺骗）\n\n在远程 DNS 欺骗中，入侵者的目标是互联网上可被欺骗的任意客户端。方法不同，因为不再只有一个路由器可被投毒。此类攻击借助木马修改受害者的\
  \ DNS 设置。一旦实现，受害者的所有 DNS 请求将发送到入侵者指定的伪造 DNS 服务器。后果与 Intranet DNS Spoofing 相同。\n\n\
  借助木马，入侵者还可修改受害者的代理服务器设置，使受害者发往代理服务器的所有流量转到伪造主机。\n\n#### DNS Cache Poisoning（DNS\
  \ 缓存投毒）\n\n组织网络中维护本地 DNS 服务器作为缓存，以限制外发 DNS 流量并减少延迟。这些缓存存储历史学习的 DNS 映射，对相似请求由缓存响应。入侵者可通过添加错误条目或修改现有条目来投毒此缓存。\n\
  \n## 3.2 操作系统漏洞\n\n操作系统（OS）是人类设计的软件，像协议一样可能存在可被入侵者利用的漏洞。OS 世界与网络世界截然不同，互操作性不高。因此，攻击只有针对特定\
  \ OS 的性质精心设计才有效。与网络中通过查看包内容即可轻松识别协议不同，确定 OS 类型需要更深入的分析和更激进的技术。\n\n### 3.2.1 OS Fingerprinting（操作系统指纹识别）\n\
  \n\n\n\n#### 操作系统指纹识别\n\n操作系统指纹识别或操作系统横幅抓取是一种用于识别远程主机所用操作系统的技术。可以通过多种方式执行操作系统指纹识别。\n\
  \n#### TCP/IP 实现\n\n协议（如 `TCP` 和 `IP`）中某些参数的配置取决于具体实现，遗憾的是不同的操作系统拥有其标志性的实现方式。对从目标主机接收到的数据包中这些配置进行分析，可以帮助入侵者识别该主机上运行的操作系统。在表\
  \ 3.1 中，列出了不同操作系统使用的初始 TTL 值和窗口大小。我们在第 3.1 节中讨论的扫描技术，可用于捕获目标的响应，然后对比这两个字段的值以识别操作系统类型。其他参数和标志，如\
  \ TCP 初始序列号和 IP 标识号，也可用于揭示操作系统。\n\n**表 3.1** 不同操作系统常用的 TCP/IP 参数\n\n| 操作系统 | IP\
  \ 初始 TTL | TCP 窗口大小 |\n|---|---|---|\n| Linux (内核 2.4 和 2.6) | 64 | 5840 |\n| Google\
  \ 定制 Linux | 64 | 5720 |\n| FreeBSD | 64 | 65535 |\n| Windows XP | 128 | 65535 |\n\
  | Windows 7、Vista 和 Server 2008 | 128 | 8192 |\n| Cisco 路由器 (IOS 12.4) | 255 | 4128\
  \ |\n\n此外，我们在网络扫描讨论中曾指出，当观察到异常协议操作时，`TCP` 的某些实现会以不同方式响应。例如，响应 Xmas 扫描和 Null 扫描的\
  \ `TCP RST` 段仅存在于 Berkeley Software Distribution (BSD) 实现中。同样，ICMP 回显扫描仅适用于 BSD\
  \ 实现，因为只有这些操作系统会响应发送给广播地址的 ICMP 回显请求。\n\n#### 应用层协议\n\n`HTTP`、`SMTP` 和其他应用层协议在其消息横幅中包含有关操作系统的信息，从而暴露其身份。`HTTP`\
  \ 中的 `server` 和 `user agent` 头字段是此类横幅抓取的典型例子。\n\n### 3.2.2 Windows 平台\n\n有多种协议、应用程序编程接口\
  \ (API) 和工具专门用于 Windows 平台，以恶意攻击 Windows 系统，例如网络基本输入输出系统和 PsTools。\n\n#### NetBIOS\
  \ 枚举\n\nNetBIOS 是 Windows 平台上用于访问局域网资源的 API。Windows 中提供的 `nbtstat` 命令可揭示关于局域网上远程机器和共享资源的重要信息。\n\
  \n#### PsTools\n\n此资源工具包包含多个命令行工具，有助于管理 Windows 系统。入侵者也可利用它们收集关于远程和本地系统的信息。\n\n\
  #### Microsoft 认证\n\nMicrosoft LAN Manager (LM) 和 Microsoft Windows NT LAN Manager\
  \ 是 Microsoft 产品用于执行质询/响应认证的专有协议。这些协议以哈希形式存储密码，该哈希通过一系列步骤计算得出：将 14 字符长的密码分成两半并分别处理，为每部分创建一个\
  \ 8 字节的哈希。早期版本 LM 有一个有趣的缺陷：如果密码长度小于或刚好七个字符，则哈希的第二部分始终为 `0xAAD3B435B51404EE`。这很容易向入侵者透露实际密码长度为七个字符或更少。\n\
  \n#### NTFS 数据流操纵\n\nWindows 平台上的 NTFS 文件系统在 NTFS 卷上存储的每个文件都关联有两个数据流。第一个流存储安全描述符，而第二个流存储文件内的数据。备用数据流\
  \ (ADS) 是另一种可存在于每个 NTFS 文件中的命名数据流。它是可以附加到文件但实际不在文件中的任何类型的数据。分区的主文件表维护着与文件关联的所有数据流及其物理位置的列表；ADS\
  \ 通过文件表附加到文件。\n\nADS 在 Windows 中的目的是提供一个包含文件元数据的隐藏流，例如属性、字数、作者姓名以及文件的访问和修改时间。然而，ADS\
  \ 可用于将数据分叉到现有文件中，而不改变或改变其功能、大小或在文件浏览实用程序中的显示。因此，ADS 为攻击者提供了一种在受损系统上隐藏恶意代码或程序并允许其在不被检测到的情况下执行的方法。\n\
  \n### 3.2.3 UNIX/Linux 平台\n\n#### 枚举\n\n`finger` 命令用于枚举远程机器上的用户。它提供用户主目录、登录时间、空闲时间、办公位置以及上次接收或阅读邮件的时间等信息。同样，还有其他命令，如\
  \ `rpcinfo` 和 `showmount`，可用于揭示管理信息。\n\n## 参考文献\n\n*   1. Fielding, R., Gettys,\
