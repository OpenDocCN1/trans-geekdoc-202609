  \n# 4 恶意软件\n\n**MOHSEN MOHAMED**\n\n\n\n在前几章中，我们学习了计算机网络、信息系统安全以及入侵和漏洞。这些信息很重要，因为本书的目标是为研究人员和从业者提供关于如何使用蜜罐和路由器收集互联网攻击的完整信息。为实现这一目标，研究人员应具备足够的计算机网络知识，这将帮助他们设计能够抵御攻击者的优秀网络。他们还应具备足够的信息系统安全知识，这将帮助他们了解信息安全中最重要的问题。此外，研究人员应具备足够的入侵和漏洞知识，这将帮助他们了解入侵如何利用漏洞来攻陷网络。本章讨论恶意软件；这一讨论很重要，因为我们想要收集互联网攻击（即恶意软件），所以必须详细了解恶意软件。\n\
  \n本书剩余章节将涵盖以下主题：\n\n*   **第 5 章** 讨论蜜罐；它们用于多种目的。其中一个目的是收集互联网攻击；此处将展示如何使用该工具收集互联网攻击。\n\
  *   **第 6 章** 讨论安全系统，如防火墙、防病毒软件、入侵检测和防御系统。研究人员应对这些系统有透彻的了解，这将帮助他们过滤已知攻击并保护生产网络。\n\
  *   **第 7 章** 讨论为收集零日多态蠕虫攻击而设计的真实网络。这将提供前几章共享的理论知识如何在实践中实施的详细信息。\n\n## 4.1 简介\n\n\
  恶意软件是组织 IT 基础设施安全的主要威胁，可能造成巨大的经济损失。因此，保护网络和其他 IT 资源免受此威胁至关重要。本章概述了恶意软件以及我们如何保护机器免受其侵害。\n\
  \n*malware* 一词是 *malicious software*（恶意软件）的缩写，指任何破坏计算设备正常运行、从中收集敏感信息或访问非公共领域系统的软件。术语\
  \ *malware* 的使用仅限于恶意意图，即如果软件意外或无意地影响系统，则不视为恶意软件。一个同时包含这两类软件（即故意或无意损害系统）的替代术语是 *badware*。\n\
  \n恶意软件通过多种方式实现恶意目的，例如访问未授权的数据/信息、秘密监控计算机用户的活动、破坏或损坏系统，或勒索商业交易。\n\n恶意软件通常分类如下：\n\n\
  *   广告软件\n*   勒索软件\n*   恐吓软件\n*   间谍软件\n*   特洛伊木马\n*   病毒\n*   蠕虫\n*   其他恶意程序\n\n\
  恶意软件可以是活动内容、可执行代码、脚本或其他软件形式。典型的攻击手法是将恶意软件嵌入其他看似无害的软件中。与病毒相比，特洛伊木马和蠕虫是最活跃的恶意软件形式。\n\
  \n可用于保护网络免受恶意软件侵害的软件如下：\n\n*   入侵检测和防御系统\n*   防病毒软件\n*   反恶意软件\n*   防火墙\n\n## 4.2\
  \ 计算机病毒\n\n计算机病毒是旨在影响计算机系统常规操作并从一台计算机传播到另一台计算机的小型软件或程序。\n\n计算机病毒可通过以下方式影响系统：\n\n\
  *   损坏或删除系统上存储的数据。\n*   利用电子邮件应用程序等通信手段传播到其他计算机。\n*   以导致系统无法正常运行的方式损坏硬盘；例如，如果磁盘的引导扇区被擦除，则系统无法加载操作系统。\n\
  *   损坏或删除计算机上的数据。\n*   利用电子邮件程序将自身传播到其他计算机。\n*   清除硬盘上的所有内容。\n\n计算机病毒：\n\n*   可附加在电子邮件或即时通讯消息中。\n\
  *   可伪装成有趣的图片、贺卡或音频和视频文件的附件。\n*   也可通过从互联网下载传播，并隐藏在非法软件或其他程序中。\n\n有多种方法可以保护计算机免受病毒侵害。例如，为计算机配备强大的防病毒工具及其最新更新，随时了解最新威胁，尽可能以标准用户（而非管理员）身份运行计算机，以及在浏览互联网、下载文件和打开附件时避免接触任何可疑对象。\n\
  \n## 4.3 计算机蠕虫\n\n*蠕虫* 是无需任何用户干预即可自我复制的程序；例如，通过网络发送其代码副本并确保由接收方计算机执行。受感染的计算机会进一步传播蠕虫副本，并可能在蠕虫影响下执行其他恶意活动。\n\
  \n### 4.3.1 蠕虫攻击\n\n蠕虫利用系统上软件中的低级缺陷，也称为 *漏洞*。由于软件规模大、结构复杂以及使用不安全的编程语言和框架，漏洞在当今软件中非常常见。多年来发现了多种类型的漏洞。缓冲区溢出、算术溢出、内存管理错误和格式字符串处理不当是蠕虫利用的最常见漏洞类型。为了远程感染计算机，必须强制计算机运行蠕虫代码，而漏洞使这成为可能。\n\
  \n虽然未来可能会发现新类型的漏洞，但蠕虫获取程序执行控制权的机制不太可能随时间发生重大变化。蠕虫获取远程程序执行控制权的三种常见方法是（\n### 4.3.2\
  \ 蠕虫传播\n\n一旦计算机成功被蠕虫感染，它就会利用该计算机将自身传播并繁殖到从受影响计算机可到达的其他计算机。蠕虫的传播过程及其即将产生的影响（如严重性、生存能力和持久性）在很大程度上取决于蠕虫如何选择受害者。\n\
  \n最简单经典的方法是在互联网上执行随机游走以寻找潜在受害者。然而，也出现了新颖且智能的攻击模型，可造成严重破坏。\n\n*随机扫描*。蠕虫传播自身的最简单方法是执行随机网络扫描。包含蠕虫或蠕虫代码的节点随机生成或选择一个网络地址范围进行扫描。然后它开始在该网络空间中搜索潜在受害者，如开放或不安全的端口，并攻击这些易受攻击的主机。\n\
  \n\n\n\n## 4.3.2 扫描策略\n\n#### 使用列表进行随机扫描\n为了提高攻击和传播过程的效率，蠕虫可能会使用从互联网上可获取的关于不同组织的公开数据中生成的网络地址列表/范围。以这种方式进行扫描会更加精确和有针对性。\n\
  \n#### 跳岛扫描\n在跳岛扫描中，蠕虫不会扫描所选范围内的所有地址；相反，它将范围划分为较小的块，并从每个块中随机扫描少量地址以最小化时间。当然，这种方法的准确性也会较低，因为被遗漏的主机可能存在漏洞。\n\
  \n#### 定向攻击\n这种方法包括由于特定网络或组织的重要性，或攻击者对其有特殊兴趣而将其作为目标。信息战或针对某些知名政府或非政府网络的攻击都是定向攻击的例子。\n\
  \n#### 命中列表扫描\n命中列表扫描更像是*带有列表的随机扫描*，因为在这种技术中，蠕虫预先拥有一个可能存在漏洞的节点列表，并在该范围内执行扫描。然而，一旦发现第一个受害者并成功入侵，主蠕虫节点会将剩余列表的一半分配给这个新的蠕虫节点，自己继续处理另一半。这样，每发现一个新受害者，剩余工作量就会减少。\n\
  \n### 4.3.3 蠕虫架构\n\n蠕虫软件通常具有五个主要组件来执行其操作，我们在上面已经提到过。\n\n#### 侦察\n计算机蠕虫的生命周期始于对受害者的搜寻。负责此任务的软件组件通常称为*侦察*。该组件的目标在性质上类似于第\
  \ 2.5.2 节中提到的黑客攻击的第一阶段，也称为*侦察*。\n\n#### 攻击组件\n一旦识别出易受攻击的主机，就会使用前面提到的一种或多种合适的技术对其进行攻击。此任务通常是蠕虫软件的一个单独函数或组件。\n\
  \n#### 通信组件\n蠕虫软件还具有可用的函数、操作或接口，以促进蠕虫网络不同成员之间的通信。\n\n#### 命令组件\n蠕虫节点之间执行的一组重要通信是相互发出命令，以便在接收端执行。蠕虫包含一个合适的命令列表和接口，用于执行这些命令以进行集体攻击。\n\
  \n#### 智能组件\n该组件包括用于蠕虫高效操作的算法和智能技术，例如更快的内部通信、高效扫描等。\n\n## 4.4 蠕虫示例\n\n在本节中，我们将讨论一些流行且知名的蠕虫。\n\
  \n### 4.4.1 Morris\nMorris 于 1988 年 11 月 2 日发布用于攻击互联网；作为同类中的第一个，它是一个自我复制程序。*Morris\
  \ 蠕虫*入侵了基于 Berkeley UNIX 的 VAX 和 Sun-3 计算机，并利用其资源复制攻击。在几小时内，该蠕虫蔓延至整个美国，影响了数千台计算机，并因其巨大的计算负载导致许多计算机无法使用。该蠕虫被设计为作为一个微小的进程执行以保持自身不被察觉；然而，其自我复制行为被低估了，这导致蠕虫传播到尽可能多的计算机，造成了严重破坏。受影响机器的计算性能因蠕虫进程在后台运行而开始下降，并且存在多个蠕虫实例在执行，因为同一台计算机被多次攻击。最终，由于内存和其他处理资源耗尽，系统完全失效。\n\
  \n### 4.4.2 Melissa\nMelissa 是第一个通过邮件大规模传播的蠕虫，于 1999 年 3 月 26 日首次被发现。此后，电子邮件成为传播蠕虫的流行媒介。\n\
  \nMelissa 包含一个 Microsoft Word 宏病毒，这是一种利用应用程序自身的宏编程语言（如 Microsoft Word 或 Excel）来传播自身的计算机病毒。它通过攻击\
  \ Microsoft Word 和 Outlook 以一种半主动的方式传播。每当受影响机器上的用户将 Microsoft Word 文档附加到电子邮件并使用\
  \ Microsoft Outlook 作为电子邮件客户端时，Melissa 就会自动将该邮件的副本发送给用户通讯簿中的前 50 个地址。\n\n### 4.4.3\
  \ Sadmind\nSadmind 蠕虫于 2001 年 5 月 8 日创建，利用漏洞入侵系统并篡改网页。它影响了 Microsoft Internet Information\
  \ Services (IIS) 和 Sun Solaris 系统，针对 Sadmind 所利用漏洞的补丁早已发布；因此，未打补丁的系统成为了 Sadmind\
  \ 的受害者。Sadmind 使得在易受攻击的 Solaris 系统上能以 root 权限执行任意代码，在易受攻击的 Windows 系统上能以 `IUSR_MachineName`\
  \ 账户的权限执行任意命令。\n\n### 4.4.4 Code Red 和 Code Red II\nCode Red 和 Code Red II 分别于 2001\
  \ 年 7 月 15 日和 8 月 4 日发布，利用了 Microsoft IIS 索引服务动态链接库 (DLL) 中缓冲区溢出漏洞。它们影响了启用了 IIS\
  \ 4.0 或 IIS 5.0 并安装了 Index Server 2.0 的 Microsoft Windows NT 4.0，启用了 IIS 4.0 或 IIS\
  \ 5.0 并安装了索引服务的 Windows 2000，以及其他运行 IIS 的系统。据估计，超过 250,000 台主机遭受了它们的攻击。\n\n### 4.4.5\
  \ Nimda\nNimda 或 W32/Nimda 或 Concept Virus (CV) v.5 于 2001 年 9 月 18 日在互联网上发布，用于攻击运行未打补丁版本\
  \ IIS 的 Microsoft Windows 95、98、ME、NT 和 2000 系统。当系统在 Nimda 的帮助下被入侵时，入侵者可以在本地系统安全上下文中执行任意命令。该蠕虫以触发它的用户的相同权限执行。受感染的计算机因\
  \ Nimda 执行的网络扫描和电子邮件传播而遭受拒绝服务。\n\n### 4.4.6 SQL Slammer\n*SQL Slammer* 或 *W32.Slammer*\
  \ 或 *Sapphire* 于 2003 年 1 月 25 日导致整个互联网上出现不同程度的网络性能下降。该蠕虫影响了 Microsoft SQL Server\
  \ 2000 和 Microsoft Desktop Engine (MSDE) 2000。该蠕虫利用了 Microsoft SQL Server 2000 和\
  \ MSDE 2000 解析服务中的栈缓冲区溢出漏洞，这使得入侵者能够以与 SQL 服务器相同的权限执行任意代码。受害主机开始产生大量用户数据报协议 (UDP)\
  \ 流量，导致同一网络上的其他主机或接收这些 UDP 数据包的互联网主机性能下降。\n\n### 4.4.7 Blaster\n*Blaster* 于 2003\
  \ 年 8 月 11 日发起。它影响了运行 Microsoft Windows NT 4.0、Microsoft Windows 2000、Microsoft\
  \ Windows XP 和 Microsoft Windows Server 2003 的计算机。Blaster 利用了与分布式组件对象模型相关的 Microsoft\
  \ 远程过程调用接口中的漏洞，该模型在 TCP/IP 端口 135 上监听。该接口的目的是处理客户端发送到服务器的分布式组件对象模型的对象激活请求。格式错误的消息及其不正确的处理帮助攻击者利用缓冲区溢出以系统权限执行任意代码或导致拒绝服务。\n\
  \n### 4.4.8 Sasser\n\n\n\n\n\nSasser 是一种网络蠕虫，最早于 2004 年 4 月被发现。它利用了附着在 TCP 端口 445\
  \ 上的 Windows 本地安全机构子系统服务 (LSASS) 中的缓冲区溢出漏洞。与其他蠕虫一样，该漏洞允许远程攻击者以系统权限执行任意代码。\n\n###\
  \ 4.4.9 Conficker\n\nConficker 最早于 2008 年 11 月被发现，针对 Microsoft Windows 操作系统，并利用服务器服务\
  \ (`svchost.exe`) 中的一个特定漏洞。在该漏洞中，一台已感染的计算机使用特殊的远程过程调用请求来强制触发缓冲区溢出，并在另一台计算机上执行 Shellcode。在源计算机上，蠕虫建立一个\
  \ HTTP 服务器，监听 1,024 到 10,000 之间的某个端口；目标计算机上的 Shellcode 强制其连接到此 HTTP 服务器，以下载一份以 DLL\
  \ 形式存在的蠕虫副本，随后该副本会附着到 `svchost.exe` 上。\n\n### 4.4.10 Allaple\n\nAllaple 蠕虫是一种专为\
  \ Windows 平台设计的网络蠕虫，最早于 2008 年 8 月被发现。一旦执行，Allaple 会搜索本地磁盘中的 HTML 文件并向其中注入代码，以激活其已安装的副本。Allaple\
  \ 有多个变种，其中一些通过利用常见的缓冲区溢出漏洞，或通过将自身复制到受弱密码保护的网络共享（如 `SRVSVC` (MS06-040)、`RPC-DCOM`\
  \ (MS04-012)、`PNP` (MS05-039) 和 `ASN.1` (MS04-007)）传播到其他网络计算机。\n\n## 4.5 多态蠕虫\n\n\
  多态蠕虫是一种在每次攻击中都会改变其外观或特征码的计算机蠕虫。\n\n### 4.5.1 多态蠕虫结构\n\n由于多态蠕虫在每次尝试中都会改变自身，我们将获得多个彼此在一定程度上不同的蠕虫样本。每个样本通常由以下组件组成：\n\
  \n*   **协议框架：** 蠕虫需要宿主中的漏洞来发起攻击并继续传播。该漏洞通常与特定的应用程序代码以及该代码中可由特定类型的协议请求激活的执行路径相关联。\n\
  *   **攻击字节：** 这是多态蠕虫的攻击组件，用于利用目标漏洞。\n*   **蠕虫主体：** 这些是在受影响主机上执行的蠕虫主要指令；多态蠕虫的每个实例在主体部分通常都有所不同。\n\
  *   **多态解密器：** 为了保持其多态性并使实例之间有所不同，多态蠕虫通常以加密形式保存蠕虫主体。解密器在受影响的计算机上提取这些指令，并根据解密逻辑生成不同版本的蠕虫主体。\n\
  *   **其他字节：** 这些是通常不影响蠕虫主体和攻击字节成功执行的附加指令。\n\n### 4.5.2 多态蠕虫分析\n\n从分析师的角度来看，多态蠕虫样本的二进制内容可分为三类字节：不变字节、代码字节和通配符字节。\n\
  \n*   **不变字节** 在蠕虫的每个可能实例中具有相同或固定的值。它们可能存在于上述讨论的任何蠕虫部分中，其值的改变会导致蠕虫失效。为了生成多态蠕虫的特征码，识别不变字节至关重要，因为这些字节对于蠕虫的成功运行是必要的，且存在于每个实例中。\n\
  *   **代码字节** 包含蠕虫的可执行组件，如蠕虫主体或解密例程。代码字节是蠕虫的主要多态内容；然而，代码字节的某些部分可能在各实例间是相似的。\n*  \
  \ 最后，**通配符字节** 代表蠕虫中可以取任意值的部分，这种变化对蠕虫的性能没有影响。\n\n### 4.5.3 多态蠕虫特征码生成\n\n针对多态蠕虫特征码生成的研究主要分为两个方向。基于内容的特征码生成关注不同蠕虫实例原始字节中存在的相似性。另一方面，基于行为的特征码则是通过分析蠕虫代码的语义来生成。基于内容的特征码具有优势，因为它们将蠕虫视为字节串处理，而不考虑其他因素。这也使得它们便于部署到防火墙或网络入侵检测系统中。\n\
  \n### 4.5.4 多态蠕虫技术\n\n多态蠕虫的设计采用了不同的方法和技术来实现其多态性。以下是其中一些方法的描述：\n\n*   **使用可变密钥的自我加密。**\
  \ 在此方法中，蠕虫主体使用可变加密密钥进行加密。因此，蠕虫原始字节的特征码和统计特征被完全扩散。攻击通过发送蠕虫的加密副本、解密例程和密钥到受害者主机来发起。解密例程提取原始程序，该程序一旦执行便开始攻击。该模型的有效性主要取决于解密例程，如果解密例程不经常改变，它就会充当蠕虫的特征码。\n\
  \n    因此，实现多态性的一种更复杂的方法是为每个蠕虫副本使用不同的解密例程。这要求蠕虫包含多个解密例程，并从中随机选择一个，但所有例程都与蠕虫主体一起加密。嵌入蠕虫中的解密例程数量会直接增加其长度；因此，只能添加有限数量的例程。这一限制使得在捕获足够多的蠕虫样本后，可以将所有例程组合起来作为蠕虫特征码。\n\
  \n*   **垃圾代码插入。** 在垃圾代码插入中，每个蠕虫副本都会添加一组不同的垃圾或无用指令。例如，在蠕虫主体的不同位置插入一些空操作 (`NOP`) 指令。这会使得字节序列的分析因散布在蠕虫主体各处的垃圾内容而变得更加困难。然而，`NOP`\
  \ 的频率与非恶意程序相比会有很大不同，并且可以在统计分析中轻易被揭示。基于异常的检测系统可以利用这一事实来检测蠕虫。另一种方法是使用可执行文件分析技术生成一个去除\
  \ `NOP` 后的蠕虫样本，并用此类样本进行特征码生成。\n\n*   **指令替换。** 指令替换技术用一个外观不同但功能等效的指令序列来替换原指令序列。该方法的成败取决于总共替换了多少序列，因为未改变的序列将充当特征码；而替换整个代码则是一项浩大的工程。\n\
  \n*   **代码置换。** 代码置换是一种略微修改的技术，通过引入跳转指令来改变指令的顺序。然而，过多跳转指令的后果类似于 `NOP`。\n\n*   **寄存器重分配。**\
  \ 最后，在寄存器重分配技术中，不同指令使用的 CPU 寄存器被交换，从而产生功能等效但包含大量分布在代码各处的微小变化的代码，且不像 `NOP` 或跳转那样存在统计弱点。\n\
  \n在 4.7 节 中，我们将讨论用于预防和检测互联网蠕虫的方法。\n\n## 4.6 蠕虫的预防与检测\n\n\n\n\n\n毕竟蠕虫是一种程序，它利用远程主机上运行的应用程序中的弱点，并获取对该易受攻击应用程序执行的控制权。因此，问题的根源在于该漏洞，处理该漏洞应是用于应对蠕虫的任何预防技术中的第一步。然而，大量遗留程序广泛应用于实践中，无法一夜之间通过修改或替换来消除系统漏洞。此外，还存在尚未被发现的漏洞，没人知道它们的数量。这导致我们得出结论：仅靠预防永远无法使\
  \ IT 系统安全，检测同样至关重要。\n\n蠕虫攻击可以通过两种不同的方式来预防：通过预防蠕虫利用的漏洞，或通过控制对漏洞的利用。\n\n### 4.6.1\
  \ 漏洞预防\n\n**安全编程语言与实践：**良好的编程实践，以及以安全的方式设计协议和软件，是减少漏洞、解决大多数问题的最有效途径。即使是最优秀、最谨慎的程序员，其代码中也可能存在人为错误、疏忽和错误假设。`C`\
  \ 是设计关键应用程序最常用的语言，因其相对于其他语言的若干技术优势；然而，由于其对人为错误的松散控制，它往往容易受到缓冲区溢出的攻击。因此，更安全的编程和执行环境极为重要。目前可通过以下方式获得一些帮助：\n\
  \n1.  **静态分析**工具\n2.  **运行时检查**\n3.  上述两者的结合\n4.  安全语言\n\n**安全执行环境：**安全执行环境也能确保漏洞不被利用。例如，通过使用带有断言的内存访问来维护内存完整性，将提供安全的执行。\n\
  \n### 4.6.2 利用预防\n\n不幸的是，不存在能全面消除软件漏洞的工具。此外，使用此类工具既困难，又会导致性能下降，这不符合生产环境的经济效益。因此，供应商继续销售带有漏洞的软件，让攻击者忙于制作利用代码。除此之外，还有如前所述的遗留系统正在使用中，且难以修正。因此，预防利用比预防漏洞更方便。这种预防策略有多个维度：\n\
  \n1.  **访问控制（操作系统维度）：**控制对系统资源或文件系统内容的未授权访问，并在多用户环境中安全地维护访问边界，一直被认为是操作系统（`OS`）的职责。此目的通常借助访问控制矩阵和列表来实现，它们指定每个用户与系统每个资源关系的性质。\n\
  2.  **防火墙与 IPS（网络维度）：**来自组织外部的攻击，也可通过基于某些规则和策略过滤入站流量来阻止。这通常在网络边界网关执行，也可在单个机器的网络协议栈网络层实现。例如，绝不接受来自特定\
  \ IP 地址的任何 `TCP` 连接。另一个例子是丢弃包内容与特定模式匹配的连接。基于 IP 地址的流量过滤通常由防火墙执行，防火墙维护着好坏地址列表。另一方面，基于特征的入侵防御系统用于过滤带有不需要模式的流量。还有一类紧密相关的软件称为**入侵检测系统（`IDS`）**，详见\
  \ 4.7 节。\n3.  **威慑措施（法律维度）：**已采取若干技术和法律措施，以阻止对计算机系统的攻击。法律的颁布与执行，结合在计算机上建立审计跟踪（以记录证据），也有助于保障\
  \ IT 系统安全，主要在法律严格实施的国家。\n\n## 4.7 入侵检测系统\n\n研究界已提出并构建了 `IDS`，以防御互联网蠕虫（及其他攻击）。\n\n\
  入侵检测有两种基本类型：**基于主机**和**基于网络**。**基于主机**的 `IDS` 检查作为主机的单个计算机上存储的数据，而**基于网络**的 `IDS`\
  \ 检查计算机之间交换的数据。\n\n检测入侵者有两种基本技术：**异常检测**和**误用检测**（特征检测）。**异常检测**旨在发现异常行为模式；`IDS`\
  \ 建立正常使用模式的基线，任何严重偏离基线的行为都会被标记为可能的入侵。尽管这些系统能检测先前未知的攻击，但当正常活动多样且不可预测时，它们会产生高误报率。**误用检测**，通常称为**特征检测**，利用特定的已知未授权行为模式来预测和检测后续类似尝试。这些特定模式称为**特征**。它们能检测已知蠕虫，但会对新类型失效。\n\
  \n大多数部署的蠕虫检测系统基于特征，属于误用检测类别。它们寻找已知出现在攻击流量中的特定字节序列（称为**攻击特征**）。特征由人工专家通过仔细分析捕获的攻击流量中的字节序列来手工识别。一个好的特征应是持续出现在攻击流量中，但在正常流量中很少出现的特征。\n\
  \n## 4.8 防火墙\n\n防火墙是一种旨在防止未授权访问专用网络或从专用网络访问的系统。防火墙可用硬件、软件或两者结合来实现。防火墙常用于防止未授权的互联网用户访问连接到互联网的专用网络，尤其是内联网。所有进出内联网的消息都要通过防火墙，防火墙会检查每条消息，并阻止不符合指定安全标准的消息。\n\
  \n防火墙技术有多种类型；其中一些如下：\n\n*   **包过滤器：**它检查进出网络的每个数据包，并根据用户定义的规则接受或拒绝。包过滤相当有效，且对用户透明，但难以配置。此外，它易受\
  \ IP 欺骗攻击。\n*   **应用网关：**它对特定应用程序（如 `FTP` 和 `Telnet` 服务器）应用安全机制。这非常有效，但可能造成性能下降。\n\
  *   **电路级网关：**它在建立 `TCP` 或 `UDP` 连接时应用安全机制。连接建立后，数据包可在主机间流动，无需进一步检查。\n*   **代理服务器：**它拦截进出网络的所有消息。代理服务器有效地隐藏了真实的网络地址。\n\
