  \ Honeynet 网络\n\n此处输入采用无类别域间路由（CIDR）表示法的 Honeynet 网络：\n\n*   **Honeynet 网络 CIDR：**\
  \ 192.168.52.0/24\n\n###### Honeynet 广播地址\n\n*   **广播地址：** 192.168.52.255\n\n######\
