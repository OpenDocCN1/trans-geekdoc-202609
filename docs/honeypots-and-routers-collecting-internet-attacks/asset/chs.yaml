  \n# 2 信息系统安全\n\n**HABIB-UR REHMAN**\n\n计算机网络是现代通信渠道：高效、易用，且拥有丰富的选项和变体。这种通信，无论是通过这些网络还是任何其他方式，始终由人执行且面向人；我们有许多理由保持通信的机密性。在本章中，我们将回顾通信安全的基础知识⁷。\n\
  \n在开始之前，让我们看看我们的通信模型是什么样的：\n\n*   两个或多个设备相互交换消息。\n*   消息可以是原子的，也可以是较长通信的一部分。\n*\
  \   如果同一条消息有多个接收者，该消息可以单独传输给每一个接收者，也可以作为单次广播发送。\n*   通信参与者可以在同一个本地网络中，也可以位于通过某些合适的广域网接口连接的不同局域网中。\n\
  \n由于在两个或多个设备之间交换的消息肯定是一条信息，因此为信息安全确立的原则在我们的领域完全适用。因此，信息安全基础是开始本次讨论的完美切入点。\n\n信息安全领域的研究人员和专业人士提出了几种模型，这些模型可分为两大类。第一类是实施安全信息系统所应遵循的一般性建议和指南。该组主要有以下三个示例：\n\
  \n*   经济合作与发展组织（OECD）信息系统和网络安全指南\n*   美国国家标准与技术研究院（NIST）信息技术安全工程原则\n*   信息系统审计与控制协会发布的《信息安全商业模型导论》\n\
  \n在第二类中，有描述信息的概念和技术要素，并基于这些信息基本安全特征提供建议的模型。以下是第二类中一些流行的模型：\n\n*   CIA 三要素\n*   McCumber\
  \ 立方体\n*   Parker 六要素\n*   Maconachy 等人提出的信息保障模型\n*   信息保障与安全参考模型\n\n在本章中，我们回顾了第二类，仅讨论了信息的安全要素和特征。我们的目标是快速回顾理解计算机网络通信中入侵检测和预防的重要性及实用性所需的基本安全概念。\n\
  \n## 2.1 CIA 三要素\n\nCIA 三要素是定义核心原则的信息安全最基础模型。术语 *CIA*⁸\n\n这三个属性（CIA）被认为是任何类型信息系统安全的基本要素，包括我们在计算机网络上的通信。当然，对此列表有若干补充建议，但机密性、完整性和可用性是每个扩展模型的核心。\n\
  \n### 2.1.1 机密性\n\n从非技术角度来看，机密性等同于我们在日常生活中使用的*隐私*一词，即“除非是我的个人事务，否则没人应该知道我在忙什么。”从技术上讲，机密性被定义为只有授权人员才能访问资源的特性。因此，它是将资源对未授权实体隐藏的属性。就信息安全而言，它是确保信息仅对授权人员可用的保证。这种解释可以通过以下几种方式延伸：\n\
  \n*   信息将仅以授权形式存储，无论是物理还是电子形式，且只有授权人员才能访问数据存储。\n*   信息将仅以授权格式存储。\n*   信息将仅通过授权媒介获取。\n\
  \n在使用计算机网络进行通信的情况下，机密性有两个主要方面。第一，通信存在的机密性，即只有授权人员应该知晓通信正在进行或已发生。第二，通信内容的机密性，即只有授权人员应该能够看到通信了什么或正在通信什么。\n\
  \n### 2.1.2 完整性\n\n对资源的未授权访问可能导致滥用或破坏该资源的问题。在信息安全中，完整性是指信息未以未授权方式被篡改的特性。因此，一方面，它是信息处于原始状态且未遭破坏的保证。另一方面，它也是确认任何所需的修改均已或将通过授权方法进行的肯定，例如仅由授权人员且仅使用授权手段进行。\n\
  \n未授权篡改信息并不一定总是出于恶意意图；也可能是无意或意外的。例如，由于电子故障，计算机网络上的通信可能出现错误。完整性是要求信息的准确性和一致性在各种场景下均保持完好的属性，无论是恶意还是意外、故意还是无意。\n\
  \n虽然看起来未授权篡改总伴随着未授权访问。然而，也存在在不损害机密性的情况下信息完整性受到损害的情况。一个非常简单的例子是通过计算机网络发送的消息中发生比特错误。此处消息内容未被任何未授权实体访问；然而，其内容仍被篡改了。\n\
  \n### 2.1.3 可用性\n\n资源应在授权用户需要时可用。可用性是指系统在授权用户或查看者需要时（通常是一直）向其提供信息的属性。信息的可用性间接要求：\n\
  \n*   存储数据/信息的系统应可用。\n*   用于检索数据/信息的系统应可用。\n*   用于更新数据/信息的系统应可用。\n\n\n\n\n\n###\
  \ 2.1.4 CIA 三要素与 McCumber 立方体的对比\n\nMcCumber 的信息安全模型或立方体确实具有相同的三个特征：机密性、完整性和可用性。然而，其完整模型包含三个维度，上述三个特征仅代表一个名为安全特征或目标的维度。另外两个维度是信息状态和安全防护措施。根据该模型，信息处于三种状态：存储、处理和传输。安全措施也主要分为三类：策略、教育和技术（图\
  \ 2.1）。\n\n![Figure 2.1 McCumber’s Cube of information security. (Data from McCumber,\
  \ J., Information systems security: A comprehensive model, in: Proceedings of the\
  \ 14th National Computer Security Conference, NIST, Baltimore, MD, 1991.)](img/pg35_1.jpg)\n\
  \n**图 2.1** McCumber 信息安全立方体。（数据来源：McCumber, J., Information systems security: A\
  \ comprehensive model, in: *Proceedings of the 14th National Computer Security Conference*,\
  \ NIST, Baltimore, MD, 1991。）\n\n## 2.2 Parker 六要素\n\nDonn B. Parker 提出了一个包含六个基本安全要素的模型，通常称为\
  \ *Parkerian Hexad*。除了经典 CIA 列表中的三个属性外，效用、真实性和占有是 Parker 新增的建议。他主要认为这三个 CIA 属性在定义和实践解释方面不够全面和精确，因此不足以涵盖所有可能性。因此，这三个新属性分别包含了在传统\
  \ CIA 属性解释中未被考虑的安全顾虑。\n\n### 2.2.1 占有\n\nParker 详细阐述了信息的占有或对其的控制权不同于信息的机密性，因为即使控制信息的人没有查看它，对信息的未授权占有仍然是一个安全问题。在这种情况下，信息的机密性本身并未受损，但对占有权的侵犯日后可能导致机密性问题。因此，Parker\
  \ 认为有必要将占有作为一个安全属性纳入其中，以避免信息控制权有意、无意或恶意地落入未授权实体手中的情况。计算机网络上的通信实际上是一个完美的例子，因为在大多数情况下物理网络是公开可访问的，这意味着如果不采取适当措施，任何人都可以控制正在进行的通信。\n\
  \n![Figure 2.2 Parker’s new fundamental conceptual information security model. (Data\
  \ from D. Parker, Our excessively simplistic information security model and how\
  \ to fix it, ISSA J., 8 (7): 12-21, July, 2010.)](img/pg37_1.jpg)\n\n**图 2.2** Parker\
  \ 的新基础概念信息安全模型。（数据来源：D. Parker, Our excessively simplistic information security\
  \ model and how to fix it, *ISSA J*., 8 (7): 12-21, July, 2010。）\n\n### 2.2.2 真实性\n\
  \n信息的真实性被定义为信息来源的有效性或对信息来源的确认。因此，该特征描述了信息的来源是否与接收者预期或假设的相同。Parker 解释说，真实性不同于完整性，因为后者关乎信息内容的可靠性和状况。有时，授权来源可能会生成不正确的信息或为测试目的而违背完整性的信息，从而不违背真实性。另一方面，恶意来源可能冒充他人，从而复制一份正确的信息，例如以自己的名义发布软件，但实际上是由不同实体开发的。Parker\
  \ 进一步主张，缓解这两个问题所需的措施也是不同的。\n\n### 2.2.3 效用\n\nParker 建议的最后一个增强项是效用，他将其定义为数据或信息的有用性。Parker\
  \ 认为*可用性*一词仅限于信息的可用性，这并不总能保证信息也有用。例如，如果信息以加密形式交付，但接收者丢失了解密密钥，该信息仍然是可用的，但其效用为零。\n\
  \n### 2.2.4 CIA 三要素与 Parker 六要素的对比\n\nCIA 三要素与 Parker 六要素的区别主要在于对所用术语的解释不同。毫无疑问，Parker\
  \ 提到的顾虑并非不重要或不存在；然而，专业人士随着时间的推移已将这些扩展解释融合到了三个 CIA 属性中。\n\n## 2.3 信息保障模型\n\nMaconachy\
  \ 等人提出的模型。\n\n很难确定*认证*和*不可否认性*这两个术语的起源，因为它们大致在同一时期出现在多个来源中。例如，我们在 Parker 的六要素中看到了*真实性*。Maconachy\
  \ 等人自己在。\n\n![Figure 2.3 Information assurance model. (Data from Maconachy, W. et\
  \ al., A model for information assurance: An integrated approach, in: Proceedings\
  \ of the IEEE Workshop on Information Assurance and Security, U.S. Military Academy,\
  \ New York, 2001.)](img/pg38_1.jpg)\n\n**图 2.3** 信息保障模型。（数据来源：Maconachy, W. et al.,\
  \ A model for information assurance: An integrated approach, in: *Proceedings of\
  \ the IEEE Workshop on Information Assurance and Security*, U.S. Military Academy,\
  \ New York, 2001。）\n\n### 2.3.1 认证\n\n该模型中的认证是指验证 Parker 模型中*真实性*的一项服务。因此，它是用于验证信息发起者有效性的过程或措施。该术语在该模型中仅指措施，不包含特征；然而，NIST\
  \ 在中提供的定义。\n\n### 2.3.2 不可否认性\n\n\n\n\n\nCIA 三要素以及帕克六要素中缺失的一个重要问题是：如果共享信息的双方中的一方事后否认该事件发生过，该怎么办？引入不可否认性这一安全目标就是为了解决这一顾虑。如果无法保证对交易进行必要的记录保存，以便事后任何参与者都无法否认其参与，则系统不能被视为完全安全。在信息共享场景中，对于发送方而言，确保成功交付给正确的接收方是必要的；对于接收方而言，确认来源身份至关重要；如果涉及控制机构，这两种保证都很重要。从接收方的角度来看，不可否认性并不确保发送方是信息的合法所有者；该方面由认证来涵盖。\n\
  \n### 2.3.3 不可否认性与可审计性\n\n在文献 [11, p. 2] 中，美国国家标准与技术研究院（NIST）将*可审计性*视为安全目标之一，并将其定义为“实体的行为可被唯一追溯至该实体的要求”。另一方面，不可否认性被描述为一种预防性服务，旨在实现可审计性这一目标。\n\
  \n## 2.4 信息保障与安全参考模型\n\n最后，Cherdantseva 和 Hilton 在文献 [7] 中提出了一个参考模型。\n\n### 2.4.1\
  \ 可审计性\n\n可审计性被定义为“系统对人类或机器在系统内执行的所有动作进行持续的、不可绕过的监控的能力”[7, p. 7]。因此，不同实体执行的动作将被观察和分析，以检查其是否符合规则和策略。*审计*一词通常指对事件的事后分析，文献\
  \ [7] 中未明确说明可审计性是否包含实时监控。\n\n### 2.4.2 隐私\n\n隐私是指信息所有者能够控制其信息，且信息的传播符合隐私法律和所有者的意愿。隐私有时会与机密性和完整性混淆，因为它们都包含对*他人*进行混淆/隐藏的含义。即使在某些公共信息在群体内共享的情况下，也需要机密性；公共内容同样需要完整性。另一方面，私有资源或信息极少被共享，这正是使其成为私有的属性所在。\n\
  \n## 2.5 黑客攻击基础\n\n本章迄今提出的基本概念通常被称为安全信息系统应具备的必要属性，有时也被视为为使信息系统安全而需达成的目标。这同样适用于以任何可能方式生成、处理、存储或处理信息的任何计算系统。入侵者或恶意实体企图通过破坏这些安全特性中的一项或多项，来影响系统及系统处理的信息。在结束本章之前，回顾系统如何被攻击并重温黑客攻击这门“黑暗科学”的基本概念将非常有用。\n\
  \n![图 2.4 信息保障与安全参考模型。（来源：Y. Cherdantseva, and J. Hilton, A reference model of information\
  \ assurance & security, in: Proceedings of the Eighth International Conference on\
  \ Availability, Reliability and Security (ARES), Regensburg, Germany, September\
  \ 2–6, 2013.）](img/pg41_1.jpg)\n\n**图 2.4** 信息保障与安全参考模型。（来源：Y. Cherdantseva, and\
  \ J. Hilton, A reference model of information assurance & security, in: *Proceedings\
  \ of the Eighth International Conference on Availability, Reliability and Security\
  \ (ARES)*，德国雷根斯堡，2013 年 9 月 2-6 日。）\n\n### 2.5.1 威胁\n\n信息系统主要面临三类威胁，如下所示：\n\n* \
  \  **自然威胁：** 包括地震、洪水等自然灾害，或任何其他不可控的危险。\n*   **物理威胁：** 可能因火灾、电力或水患导致损坏；这可能是故意的，也可能是无意的。\n\
  *   **人为威胁：** 内部人员或外部人员可能故意或无意地损害系统，带有恶意意图或因怨恨情绪驱使。人类可能通过以下三种方式威胁系统：\n    *   **网络威胁：**\
  \ 如前所述，计算机网络是共享信息最常用的媒介。入侵者可闯入通信信道，以多种方式破坏安全。\n    *   **主机威胁：** 处理信息的主机可能遭受直接攻击，导致其安全防线被突破。\n\
  \    *   **应用威胁：** 处理信息的应用程序如果开发不当，可能存在可被入侵者利用的漏洞。\n\n在第 3 章第 3 章中，我们列出了属于上述三类的多种攻击的综合清单，并附带其技术细节。\n\
  \n### 2.5.2 黑客攻击过程\n\n入侵者利用系统漏洞发起攻击。这些漏洞可能存在于单个应用程序中、整个主机中，或主机共享信息的网络中。发起攻击的过程通常分为以下步骤：\n\
  \n*   **侦察：** 初始阶段，入侵者收集关于系统的必要信息，并基于这些初始数据制定攻击策略。侦察可分为*主动*（入侵者与系统交互）或*被动*（通过社会工程学、垃圾箱搜寻或公开资源等间接来源收集数据）。足迹采集是一种常见的侦察技术，结合主动和被动方法收集系统数据。\n\
  *   **扫描：** 主动侦察和扫描概念并无太大区别，两者均通过交互收集关于系统及其资源的信息。尽管入侵者与系统交互，但扫描不被视为实际攻击，因为入侵者并未危害系统或信息。它更多是识别网络和主机漏洞的过程。\n\
  *   **获取访问权限：** 此阶段指入侵者尝试通过利用发现的漏洞来访问网络、主机或应用程序。\n*   **维持访问权限：** 一旦入侵者成功访问资源，便利用系统资源收集所需信息或发起进一步攻击。\n\
  *   **清除痕迹：** 最后一步是向授权用户和管理员隐藏恶意行为。通常通过销毁日志文件和归档中的证据来实现。\n\n审视上述阶段后，*攻击*一变得模糊不清。文献中有两种通用的解释。它可能指单个小规模的恶意行为，也可能指通过一系列小规模入侵实施的大规模黑客活动。因此，我们可以说扫描本身既是一种攻击，也是黑客攻击的一个阶段。\n\
  \n\n\n\n### 扫描与枚举\n\n扫描和枚举是属于黑客攻击第二阶段（即扫描阶段）的两种技术；感到困惑吗？令人惊讶的是，黑客行业为某个攻击阶段和该阶段使用的一种技术选用了同一个词，这主要是因为枚举与扫描非常相似。然而，枚举的目标是发现用户名、机器名、共享资源、服务及其他类似实体。另一方面，扫描旨在发现活跃的网络主机及这些主机上的开放端口，因此也被称为*网络扫描*。\n\
