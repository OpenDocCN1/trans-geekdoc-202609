  \n*   **管理接口 IP 地址：** 192.168.40.7\n*   **管理接口网络掩码：** 255.255.255.0\n*   **管理接口默认网关：**\
  \ 198.168.40.1\n*   **蜜墙网关 DNS 服务器 IP：** 192.168.40.2\n*   **SSH 监听端口：** 22\n* \
