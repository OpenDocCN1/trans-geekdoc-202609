  *   4. M.M.Z.E. Mohammed and A.-S. K. Pathan. Automatic Defense against Zero-day\
  \ Polymorphic Worms in Communication Networks, ISBN 9781466557277, CRC Press, Taylor\
  \ & Francis Group, Boca Raton, FL, 2013.\n\n# 5 蜜罐理论指南\n\n**MOHSEN MOHAMED**\n\n\
  ## 5.1 蜜罐概念\n\n### 5.1.1 蜜罐简介\n\n最好先定义蜜罐，然后谈谈它的历史，我们认为这是阅读和理解相关关键信息的恰当顺序。\n\n蜜罐有许多定义。\n\
  \nLance Spitzner 给出的蜜罐正式定义 [1, p. 58] 是：“蜜罐是一种安全资源，其价值在于被探测、被攻击或被入侵。”\n\n我们现在将提出一系列问题来解释蜜罐的定义。首先，为什么我们需要制作蜜罐？\n\
  \n*   我们需要蜜罐来收集关于谁在试图入侵我们系统的信息。怎么做？蜜罐拥有可以保留源和目的地痕迹的工具。\n*   蜜罐可以为我们提供关于攻击者使用了哪些工具和战术来入侵我们系统的信息。此类信息可以在蜜罐内部使用的技术中找到，例如防火墙日志、入侵检测系统\
  \ (IDS) 和系统日志。通过获取这些信息，我们可以在未来避免此类攻击。怎么做？通过改进我们的系统以防御这些已知攻击。这一点（即收集关于工具和战术的信息）被认为是蜜罐最重要的目标。因为，任何人都希望使自己的系统尽可能复杂，以便攻击者更难入侵系统。\n\
  *   通过使用蜜罐，我们可以获取零日攻击（未知攻击）。我们应该提到，大多数蜜罐用户是研究人员，因为蜜罐为他们提供了关于各种攻击及其模式的大量信息。还有其他人出于其他目标制作蜜罐，比如在公司寻找攻击的解决方案，或者仅仅作为测试，或者用于概念演示，等等。\n\
  \n关于蜜罐的一个有趣事实是，如果蜜罐没有被攻击者攻击，则没有任何价值！这是因为，为了捕获关于攻击者的信息，蜜罐必须被入侵。否则，它毫无用处，因为它无法提供所需的信息。这一点解释了为什么我们需要蜜罐。然后我们可以问另一个问题：如何应用蜜罐以使其受到攻击。\n\
  \n1.  首先，我们应该将蜜罐放置在我们的真实网络中，作为真实机器或设备中的软件。\n2.  我们应该使用防火墙、路由器或其他防御机制将蜜罐与网络中的其他机器隔离开来。为什么要在蜜罐和其他机器之间进行这种隔离？为了保护其他机器免受攻击者侵害。\n\
  3.  如果我们需要改进我们的防御系统，那么在蜜罐中，我们应该使用与我们在其他受保护机器中使用的相同的防御系统。在蜜罐中使用相同的防御系统有助于我们了解攻击者如何入侵这些防御系统，以便我们改进它们。例如，如果我们想发现零日攻击，我们应该使用更新的\
  \ IDPS、防病毒软件，并添加支持性防御机制。因为，这些防御系统可以过滤掉已知攻击，然后只有未知攻击会入侵我们的蜜罐（这是我们的预期）。因此，我们可以减轻蜜罐的繁重负载。\n\
  4.  根据需要，我们可以在蜜罐中使用薄弱的防御系统，或者根本不使用任何防御系统，如果我们想追踪攻击者并获取关于其如何造成破坏的信息。例如，如果政府想追踪谁会试图入侵他们的系统，那么他们可以使用防御薄弱或完全没有防御机制的蜜罐。因此，攻击者会被引诱并能轻松入侵政府系统。然后，政府可以追踪该攻击者。我们应该注意，在这种情况下，攻击者至少可以猜出这是一个蜜罐，因为如果在政府机构中设置了一个防御薄弱的设备，极有可能它是一个蜜罐。攻击者并不愚蠢。因此，当涉及政府机构的机器/计算机时，这种陷阱可能并不总是能引诱攻击者上钩。\n\
  5.  当我们设置蜜罐时，应该通知组织中的所有人，以免他们尝试访问它。因此，任何发出或进入蜜罐的内容都应被视为攻击。经过相当长的一段时间后，我们可以去检查蜜罐捕获了什么。此外，我们可以实时查看蜜罐中到底发生了什么。\n\
  \n从这些描述中应该可以明显看出，蜜罐与大多数安全工具不同。当今使用的大多数安全技术都是为了解决特定问题而设计的。例如，防火墙是一种通过控制流量流向来保护组织的技术。它们被用作访问控制工具。防火墙最常部署在组织的边界周围，以阻止未经授权的活动。网络\
  \ IDS 旨在通过监控系统或网络活动来检测攻击。\n\n蜜罐之所以不同，是因为它们不局限于解决单一的特定问题。相反，蜜罐是一种高度灵活的工具，可应用于各种不同的情况。这就是为什么蜜罐的定义乍看之下可能显得模糊，因为它们可以用于实现许多不同的目标，并且可以呈现多种不同的形式。例如，蜜罐可用于威慑攻击，这是与防火墙共同的目标。蜜罐也可用于检测攻击，类似于\
  \ IDS 的功能。蜜罐可用于捕获和分析自动化攻击（如蠕虫），或充当早期指示和预警传感器。蜜罐还具有分析黑帽社区活动的能力，捕获攻击者的击键或对话。如何使用蜜罐取决于你。这取决于你试图实现什么。在\
  \ 第 6 章 中，我们将更详细地介绍你可以用蜜罐实现的不同目标。然而，所有可能的表现形式都共享一个共同特征：它们的价值在于被探测、被攻击或被入侵。\n\n重要的是要注意，蜜罐不包含有价值的数据。相反，它们包含某种伪造数据。因此，蜜罐是没有生产价值的安全资源；没有人或资源应该与它们通信。因此，发送给它们的任何活动本质上都是\
  \ `suspect`（可疑的）。发送到蜜罐的任何流量极有可能是探测、扫描或攻击。蜜罐发起的任何流量意味着系统极有可能已被入侵，且攻击者正在建立出站连接。\n\n\
  \n\n\n让我们通过一个实际例子来完善对蜜罐定义的理解。假设有一栋有三个房间的房子，且该房子是攻击者的目标。房主需要知道攻击者是谁，以及他是如何攻破房屋防御系统（即门锁、钱柜和窗户防盗栏）的。房主将所有贵重物品放在前两个房间，并在第三个房间内部安装了一个隐藏摄像头，在房间前方安装了另一个隐藏摄像头以监视攻击者。第三个房间使用的其他防御系统与前两个房间相同，但第三个房间不包含任何贵重物品。在这种情况下，当攻击者闯入或来到第三个房间时，摄像头会记录攻击者的所有活动。因此，在这种情况下，第三个房间的工作方式与蜜罐相同，因为该房间给攻击者提供了自由活动的选择，但会记录其所有行动。\n\
  \n### 5.1.2 蜜罐的历史\n\n本节简要介绍蜜罐的历史。\n\n*   **1990/1991** — 首批记录蜜罐概念的公开著作：Clifford\
  \ Stoll 的《The Cuckoo’s Egg》和 Bill Cheswick 的《An Evening With Berferd》。\n*   **1997**\
  \ — Fred Cohen 的 Deception Toolkit 0.1 版本发布，这是最早可供安全社区使用的蜜罐解决方案之一。\n*   **1998**\
  \ — 开始开发 CyberCop Sting，这是最早向公众出售的商业蜜罐之一。CyberCop Sting 引入了将多个虚拟系统绑定到单个蜜罐的概念。\n\
  *   **1998** — Marty Roesch 和 General Telephone and Electric Corporation (GTE) Internetworking\
  \ 开始开发一种蜜罐解决方案，最终演变为 NetFacade。这项工作也开启了 Snort 的概念。\n*   **1998** — BackOfficer Friendly\
  \ (BOF) 发布 — 一款免费、简单易用的基于 Windows 的蜜罐。\n*   **1999** — Honeynet Project 成立并发布《Know\
  \ Your Enemy》系列论文。这项工作有助于提高认知度，并验证了蜜罐及蜜罐技术的价值。\n*   **2000/2001** — 利用蜜罐捕获和研究蠕虫活动。更多组织采用蜜罐进行攻击检测和新威胁研究。\n\
  *   **2002** — 蜜罐被用于在野外检测和捕获一种新的未知攻击，具体为 `Solaris dtspcd` 漏洞利用。\n\n#### 早期出版物\n\n\
  令人惊讶的是，1990 年之前关于蜜罐概念的资料极少，甚至没有。第一份资源是 Clifford Stoll 所著的《The Cuckoo’s Egg》。\n\n\
  在《The Cuckoo’s Egg》中，Clifford Stoll 讲述了发生在 1986 年和 1987 年跨度 10 个月内的一系列真实事件。Stoll\
  \ 是 Lawrence Berkeley Lab 的天文学家，负责管理天文学家社区使用的各种计算机系统。一个 75 美分的账目错误导致他发现了一名代号为 `Hunter`\
  \ 的攻击者已渗透进入其系统之一。Stoll 没有禁用攻击者的账户并将其拒之门外，而是决定允许攻击者留在系统中。他的动机是了解更多关于攻击者的信息并将其追踪。在随后的几个月里，他在保护攻击者以此为跳板攻击的各种政府和军事计算机的同时，试图发现攻击者的身份。Stoll\
  \ 的计算机不是蜜罐；它们是学术和研究社区使用的生产系统。然而，他利用被攻陷的系统追踪攻击者的方式，与蜜罐和蜜罐技术的概念非常相似。Stoll 的书不是技术性的；它读起来更像是一部\
  \ Tom Clancy 风格的间谍小说。使这本书在蜜罐历史上独特且重要的，是书中讨论的概念。\n\n书中最迷人的是 Stoll 在攻击者不知情的情况下获取信息的方法。例如，他在被攻陷的系统上创建了一个名为\
  \ `SDINET`（战略防御倡议网络）的虚假目录。他想创建能吸引攻击者注意的材料，随后用各种听起来有趣的文件填充该目录。目的是通过迫使攻击者浏览大量文件来浪费其时间。攻击者在系统上停留的时间越长，当局追踪攻击者的时间就越多。Stoll\
  \ 还包含了不同价值的文档。通过观察攻击者复制了哪些特定文档，他可以识别攻击者的动机。例如，Stoll 提供了看似有财务价值的文档和包含政府机密的文档。攻击者绕过了财务文档，专注于国家安全相关材料。这表明攻击者的动机不是经济利益，而是获取高度机密的文档。\n\
  \nBill Cheswick 的论文《An Evening with Berferd in Which a Cracker Is Lured, Endured,\
  \ and Studied》发布于 1990 年。这篇论文比《The Cuckoo’s Egg》更具技术性，由安全专业人员为安全社区撰写。与《The Cuckoo’s\
  \ Egg》一样，Cheswick 论文中的一切都是非虚构的。然而，与该书不同的是，Cheswick 构建了一个他希望被攻陷的系统——这应该是真正蜜罐的第一个有记录案例。在论文中，他不仅讨论了蜜罐如何构建和使用，还讲述了如何研究一名荷兰黑客攻击并攻陷各种系统的过程。\n\
  \nCheswick 最初构建了一个包含多个漏洞（包括 Sendmail）的系统，以确定存在哪些威胁以及它们如何运作。他的目标不是捕获特定的某个人，而是了解其网络和系统上发生的威胁活动。\n\
  \nCheswick 的论文不仅解释了他构建系统的不同方法（他从未称其为蜜罐），还说明了这些方法如何被使用。除了各种看似脆弱的服务外，他还创建了一个名为 `a\
  \ jail` 的受控环境，用于限制攻击者的活动。他逐步展示了入侵者（称为 `Berferd`）如何尝试渗透系统，以及 Cheswick 从攻击者那里学到了什么。我们看到了\
  \ `Berferd` 如何利用 Sendmail 漏洞渗透系统并获得控制权。Cheswick 描述了其方法的优缺点。（该论文收录在随书附带的 CD-ROM 中。）\n\
  \nStoll 的书和 Cheswick 的论文都是很好的参考文献。然而，没有任何资源详细描述如何设计和部署蜜罐。两者也都没有提供蜜罐的精确定义，或探讨蜜罐技术的价值。\n\
  \n#### 早期产品\n\n第一个公开的蜜罐解决方案称为 `deception toolkit (DTK)`。\n\n在 DTK 之后，1998 年开始开发第一个商业蜜罐产品\
  \ CyberCop Sting。该蜜罐有几个不同于 DTK 的特性。首先，它运行在 Windows NT 系统上而非 Unix。其次，它可以同时模拟不同的系统，具体包括\
  \ Cisco 路由器、Solaris 服务器和 NT 系统。\n\n\n\n因此，CyberCop Sting 能够模拟整个网络，其中每个系统都拥有专属于其所模拟操作系统（OS）的独特服务。攻击者可以扫描网络并发现各种\
  \ Cisco、Solaris 和 NT 系统。随后，攻击者可以 Telnet 到 Cisco 路由器并获得提示该系统为 Cisco 的横幅，FTP 到 Solaris\
  \ 服务器并获得提示该系统为 Solaris 的横幅，或建立 HTTP 连接到 NT 服务器。甚至连模拟的 IP 协议栈也经过修改，以复制正确的操作系统特征。这样，如果使用主动指纹识别措施（如\
  \ `Nmap` [\n\n就其时代和发展水平而言，CyberCop Sting 是一款前沿且先进的蜜罐。此外，它易于安装、配置和维护，使得广大安全社区都能使用。然而，作为一款商业产品，它从未真正普及，现已停止开发。自其退市以来，已发布了几款优秀的商业蜜罐产品，包括\
  \ NetSec 的 Specter [\n\n1998 年，Marty Roesch 在 GTE Internetworking 工作期间，开始为一位大型政府客户开发蜜罐解决方案。Roesch\
  \ 及其同事开发了一种蜜罐系统，该系统利用单台主机模拟整个 C 类网络，最多可达 254 个系统。最多可模拟七种不同类型的操作系统及多种服务。尽管最终的商业产品\
  \ NetFacade [\n\n1998 年还发布了 BOF，这是一款由 Marcus Ranum 开发、Network Flight Recorder 发布的基于\
  \ Windows 和 Unix 的蜜罐。BOF 的独特之处在于它免费、极易使用，且可在任何基于 Windows 的桌面系统上运行。你只需下载工具，在系统上安装，即刻拥有专属的个人蜜罐。尽管功能有限，BOF\
  \ 却是许多人接触蜜罐技术概念的入门之作。\n\n1999 年，蜜网项目成立 [\n\n#### 近期历史：蜜罐的实战应用\n\n2000 年和 2001 年，基于\
  \ Unix 和 Windows 的蠕虫突然激增。这些蠕虫被证明极其有效。它们在互联网上呈指数级传播的能力令互联网社区震惊。各安全组织面临的挑战之一是获取蠕虫副本进行分析并了解其工作原理。由于数据污染，从受感染的生产系统获取蠕虫副本非常困难，就像\
  \ Code Red 蠕虫 [\n\n一个例子是 [Incidents.org](http://Incidents.org) 对 Leaves 蠕虫的捕获与分析。2001\
  \ 年 6 月 19 日，检测到针对 Sub7 特洛伊木马的扫描活动突然上升。Sub7 是一种接管 Windows 系统的特洛伊木马，赋予攻击者对系统的完全远程控制权。该木马在默认端口\
  \ 27374 上监听。攻击者使用特殊的客户端软件连接到该端口来控制受感染系统。[Incidents.org](http://Incidents.org) 的一组安全专家试图查明该活动的原因。\n\
  \n2001 年 6 月 21 日，SANS 研究所的 Johannes Ullrich 部署了一个他开发的蜜罐，用于模拟感染了 Sub7 特洛伊木马的 Windows\
  \ 系统。几分钟内，该蜜罐捕获了一次攻击，使 [Incidents.org](http://Incidents.org) 团队能够对其进行分析。他们发现有一种蠕虫伪装成\
  \ Sub7 客户端，试图感染已被 Sub7 特洛伊木马感染的系统。这省去了攻击者入侵系统的麻烦，因为这些系统早已被攻击和攻破。Matt Fearnow 和 [Incidents.org](http://Incidents.org)\
  \ 团队对该蠕虫进行了全面分析，最终将其识别为 W32/Leaves 蠕虫，并将关键信息转交给国家基础设施保护中心。其他组织也开始使用蜜罐捕获蠕虫进行分析，例如\
  \ [SecurityFocus.com](http://SecurityFocus.com) 的 Ryan Russel 对 CodeRed II 蠕虫的分析。这些事件再次提高了安全社区和安全研究领域对蜜罐价值的认知。\n\
  \n涉及蜜罐技术捕获未知漏洞利用的首个记录案例发生在 2002 年 1 月 8 日。一个 Solaris 蜜罐捕获了一个 `dtspcd` 漏洞利用，这是一种此前从未见过的攻击。2001\
  \ 年 11 月 12 日，计算机应急响应小组（CERT）协调中心（一个安全研究组织）发布了关于通用桌面环境子进程控制服务的公告 [\n\n### 5.1.3\
  \ 蜜罐的类型\n\n蜜罐主要分为两类 [\n\n1.  生产蜜罐\n2.  研究蜜罐\n\n这一分类概念源自 Snort 的开发者 Marty Roesch。它是在他在\
  \ GTE Internetworking 的工作和研究过程中演变而来的。生产蜜罐用于保护组织，而研究蜜罐用于实验和研究。\n\n生产蜜罐易于使用，仅捕获有限信息，主要由公司或企业使用。组织将这些蜜罐与其他生产服务器一起放置在生产网络内，以提高其整体安全状况。它们增加了特定组织安全性的价值，并有助于降低风险。通常，生产蜜罐提供的关于攻击或攻击者的信息比研究蜜罐少。\n\
  \n正如上文所述，生产蜜罐通常比研究蜜罐更易于构建和部署，因为它们所需功能较少。生产蜜罐相对简单，一般风险较低。生产蜜罐的缺点之一是，它们通常提供的关于攻击或攻击者的信息比研究蜜罐少。我们可能了解攻击者来源系统或发起的漏洞利用，但极不可能了解他们如何相互通信或如何开发工具。\n\
  \n研究蜜罐部署起来通常非常复杂。研究蜜罐的主要目标是收集关于针对不同网络的黑帽社区动机和战术的大量信息。值得注意的是，研究蜜罐不直接为特定组织增加价值；相反，它们用于研究组织面临的威胁，并学习如何更好地防御这些威胁。研究蜜罐部署和维护复杂，捕获大量信息，主要由研究、军事或政府组织使用。\n\
  \n要获取关于攻击者的大量信息，我们需要使用研究蜜罐；别无选择。这些蜜罐为攻击者提供真实的操作系统和应用程序进行交互。这有助于我们潜在地了解攻击者是谁、他们如何通信，或如何开发或获取工具，但我们也必须提到研究蜜罐风险巨大，且需要更多时间和精力来管理。事实上，研究蜜罐可能会降低组织的安全性，因为它们需要大量资源和维护工作。\n\
  \n## 5.2 威胁类型\n\n蜜罐是一种安全解决方案。因此，最好先解释问题是什么，即攻击者。通过了解我们的威胁是谁以及他们如何运作，我们可以更容易地理解解决方案，即蜜罐的概念\
  \ [\n\n### 5.2.1 脚本小子与高级黑客攻击\n\n\n\n\n\n#### 攻击者类型\n\n攻击者主要分为两类：**脚本小子** 和 **高级黑客**。无论这些威胁来自外部（如互联网）还是内部（如不满的员工），大多数威胁都倾向于归属于这两类之一。\n\
  \n#### 脚本小子\n\n这类攻击者通常依赖脚本化攻击。有时，这些攻击者有特定要求，例如入侵具有高速互联网连接的系统，或拥有用于存储文件的大容量硬盘。但总体而言，他们只关心数量。他们技术相对不成熟，但数量庞大，代表了当今绝大多数探测、扫描和攻击的来源。\n\
  \n如果没有脚本小子，利用脚本小子攻陷设备原本是一项非常复杂的任务，可能只能由专家执行。例如，步骤如下：\n\n1.  首先，攻击者必须识别操作系统或应用程序中的漏洞。这并非易事。它需要关于操作系统如何工作的广泛知识，例如内存管理、内核机制和文件系统功能。要识别应用程序中的漏洞，攻击者必须了解应用程序如何运行以及如何与信息的输入和输出进行交互。识别漏洞可能需要数天、数周甚至数月。\n\
  2.  然而，在识别出漏洞后，攻击者必须开发工具来利用它。这需要广泛的编码技能，可能涉及多种不同的计算机编程语言。\n3.  开发出漏洞利用代码后，攻击者必须寻找脆弱的系统。通常，会使用一种扫描工具来查找可通过互联网访问的系统，利用\
  \ ICMP ping 或完整 TCP 连接等功能。这些工具用于建立可访问系统的数据库。随后，攻击者必须确定可达系统上存在什么服务——即目标上实际运行了什么。此外，攻击者还必须确定这些服务中是否有任何漏洞。\n\
  4.  下一步是针对受害者发起漏洞利用，入侵并控制系统。最后，应使用各种其他工具（通常称为 `rootkits`）来接管并维持对受损系统的控制。\n\n上述每个步骤都需要开发独特的工具，使用所有这些工具需要大量时间和资源。一旦发起攻击，这些工具通常需要手动操作，要求经验丰富的攻击者投入大量精力。\n\
  \n上述步骤过于困难，需要拥有丰富经验的高技能攻击者，这在过去并不常见。不幸的是，今天的情况截然不同。几乎不需要任何技术技能或知识，任何人都可以直接从互联网下载工具，由工具自动完成所有工作。有时，这些工具将我们刚才描述的所有活动结合成一个完全自动化的武器，只需将其指向特定系统，甚至整个网络。这就像点击按钮或按下键盘上的一个键一样简单！攻击者只需下载这些工具，按照说明操作，发起攻击，就能轻松入侵数百甚至数千个系统。这些工具在互联网上迅速传播，让成千上万的攻击者获得访问权限，他们可能只是为了好玩而进行此类活动。曾经高度复杂的开发过程现在变得极其简单！\n\
  \n攻击者可以从各种资源下载自动化工具，或与朋友交换。互联网中继聊天（IRC）和万维网使黑客能够即时在全球范围内共享新的攻击工具。然后，他们只需学习工具的命令行语法。对于不熟悉命令行语法的攻击者，已经设计了各种具有点击式操作功能的\
  \ Windows 工具。一些漏洞利用代码甚至附带编写良好的分步说明。\n\n#### 高级黑客\n\n这类攻击者专注于选定的目标，可能想要攻陷特定的高价值系统。这些人极有可能是经验丰富、知识渊博的攻击者。他们的攻击通常由经济或国家动机驱动，例如国家资助的恐怖主义。他们有特定的目标想要攻陷，并且只专注于这一个目标。虽然这类攻击者不常见且数量较少，但由于其高超的技术水平，危害性远大于脚本小子。他们不仅能渗透高度安全的系统，其行动也难以被检测和追踪。高级黑客攻击系统时制造的“噪音”极小，且擅长掩盖踪迹。即使你成功遭受了此类高技能黑客的攻击，你可能永远都不会察觉。\n\
  \n虽然脚本小子和自动化攻击代表了攻击者的最大比例，但那一小部分更危险、不想让任何人知道其存在的技术型攻击者才是高级黑客。高级黑客不发布他们的工具。他们只攻击和攻陷高价值系统（即选定的系统）。当这些攻击者成功时，他们不会向世界宣扬。相反，他们悄无声息地渗透组织，收集信息、用户账户和关键资源的访问权限。通常，组织根本不知道自己已被攻陷。高级攻击者可以在受损组织中潜伏数月甚至数年而不被发现。\n\
  \n这些攻击者对各种目标感兴趣。可能是在线银行系统，攻击者窥视包含数百万信用卡信息的数据库。可能是企业间谍案，攻击者试图渗透汽车制造商以获取未来汽车的研发设计。也可能是外国政府试图获取高度机密的政府秘密，从而危及国家安全。\n\
  \n这些人员受过高度训练且经验丰富，比脚本小子难以检测得多。即使成功渗透组织，他们也会采取高级措施确保其存在或活动不被发现。人们对这些攻击者知之甚少。与非技术型攻击者不同，高级黑客不共享相同的工具或技术。每个人倾向于开发自己的技能、方法和工具集，专门用于特定活动。因此，当发现一名高级攻击者的工具和方法时，获得的信息可能不适用于其他高级黑客。\n\
  \n我们应该提到，每台连接到互联网的计算机都面临巨大危险。这种危险可能毁掉你的一生；例如，如果攻击者利用你的硬盘存储他收集的所有被盗信用卡信息，会发生什么？如果信用卡主管部门起诉窃贼，追踪攻击者痕迹，发现信用卡信息在你的电脑里，你该怎么办？被盗信用卡金额可能巨大。在这种情况下，你如何为自己辩护？因此，每个人都应重视这一重大问题，并尽力使自己的计算机尽可能安全。\n\
  \n### 5.2.2 攻击者的动机\n\n\n\n\n#### 理解攻击者动机\n\n了解攻击者的动机将有助于我们更好地理解威胁。以下攻击将有助于理解攻击者为何会以某个系统为目标并试图将其攻破。\n\
  \n#### 拒绝服务攻击\n\n拒绝服务攻击旨在瘫痪受害者的计算机系统或网络。这通常通过向预期目标（如 Web 服务器）发送大量网络流量来实现。针对受害者的流量越多，攻击效果越显著。攻击者通常会攻破数百甚至数千个系统用于发动攻击。他们控制的计算机越多，能向目标发起的流量就越大。许多黑客使用拒绝服务攻击来瘫痪其他黑客。例如\
  \ IRC 战争，即某个个体试图利用拒绝服务攻击将另一个个体从 IRC 频道中踢出。\n\n#### 互联网机器人\n\n机器人是代表个人按预编程方式自动行动的自动化程序。它们最常用于维持对\
  \ IRC 的控制。一个人入侵的计算机越多，能启动的机器人就越多，从而能控制特定的 IRC 频道。使用大量机器人可以保护个人免受拒绝服务攻击导致的 IRC 控制权丢失。\n\
  \n#### 网络钓鱼\n\n网络钓鱼是一种通过在电子通信中伪装成可信实体，试图获取用户名、密码和信用卡详情等信息（有时间接获取金钱）的手段。声称来自热门社交网站、拍卖网站、在线支付处理商或\
  \ IT 管理员的通信常被用来诱骗毫无戒心的公众。网络钓鱼通常通过电子邮件欺骗或即时通讯实施，并经常引导用户在一个外观和感觉与合法网站几乎完全相同的假冒网站上输入详细信息。网络钓鱼是利用社会工程学技巧欺骗用户、并利用当前\
  \ Web 安全技术易用性差的典型案例。应对日益增长的网络钓鱼举报事件的尝试包括立法、用户培训、公众意识提升和技术安全措施。\n\n## 5.3 蜜罐的价值\n\
  \n从以上所有讨论中我们现在知道，蜜罐没有具体的定义。因此，蜜罐的价值取决于你的问题是什么。或者说，你为什么需要构建蜜罐？这些问题的答案将凸显蜜罐的价值。因此，蜜罐的价值基本上取决于你的目标。\n\
  \n蜜罐有优点也有缺点，这些都会影响其价值。在本节中，我们将展示它们的优缺点。此外，我们还将介绍生产蜜罐和研究蜜罐的区别及其各自的角色。\n\n### 5.3.1\
  \ 蜜罐的优势\n\n使用蜜罐有许多优势，但我们将重点关注其中几点。\n\n#### 数据价值\n\n安全社区面临的挑战之一是从数据中获取价值。组织每天收集大量数据，包括防火墙日志、系统日志和入侵检测警报。海量的信息可能令人难以应对，使得从数据中提取任何价值变得极其困难。另一方面，蜜罐收集的数据很少，但所收集的数据通常价值很高。蜜罐“无预期生产活动”的概念大幅降低了噪音水平。蜜罐每天收集的数据通常只有几兆字节（甚至更少），而不是记录数千兆字节的数据。任何被记录的数据极有可能是扫描、探测或攻击——即高价值信息。\n\
  \n蜜罐能以快速且易于理解的格式为你提供所需的精确信息。这使得分析变得更容易，反应时间也快得多。例如，蜜网项目（一个研究蜜罐的小组）平均每天收集的数据不到 1MB。尽管数据量很小，但主要包含恶意活动。这些数据可用于统计建模、趋势分析、攻击检测，甚至分析攻击者。这类似于显微镜效应。无论捕获什么数据，都会被置于显微镜下进行详细审视。\n\
  \n#### 资源\n\n大多数安全机制面临的另一个挑战是资源限制，甚至资源耗尽。资源耗尽是指安全资源因资源不堪重负而无法继续运行。例如，防火墙可能因连接表已满、资源耗尽或无法再监控连接而失效。这迫使防火墙阻止所有连接，而不仅仅是阻止未授权活动。IDS\
  \ 可能面临过多的网络活动需要监控，也许是每秒数百兆字节的数据。当这种情况发生时，IDS 传感器的缓冲区会变满，并开始丢弃数据包。其资源已耗尽，无法再有效监控网络活动，从而可能错过攻击。另一个例子是集中式日志服务器。它们可能无法收集来自远程系统的所有事件，从而可能丢弃并未能记录关键事件。\n\
  \n因为捕获和监控的活动很少，蜜罐通常没有资源耗尽的问题。作为对比，大多数 IDS 传感器难以监控具有千兆比特速度的网络。流量的速度和体量对于传感器来说太大，无法分析每个数据包。结果是流量被丢弃，潜在攻击被错过。部署在同一网络上的蜜罐不存在这个问题。它只捕获针对自身的活动，因此系统不会被流量淹没。在\
  \ IDS 传感器可能因资源耗尽而失效的地方，蜜罐不太可能出现问题。蜜罐有限资源需求的一个附带好处是，你不必在其硬件上投入大量资金。与防火墙或 IDS 传感器等许多安全机制不同，蜜罐不需要最新的尖端技术、大量内存或芯片速度，也不需要大容量硬盘。你可以使用组织里闲置的电脑或老板不想要的旧笔记本电脑。这意味着蜜罐不仅可以部署在你的千兆网络上，而且可以是一台相对便宜的电脑。\n\
  \n#### 简易性\n\n这是蜜罐最大的单一优势。无需开发花哨的算法，无需维护特征库，也无需担心规则库配置错误。你只需获取蜜罐，将其放置在组织的某处，然后坐等即可。虽然某些蜜罐（尤其是研究蜜罐）可能更复杂，但它们都基于同一个简单的前提运行：如果有人或某物连接到蜜罐，就去检查一下。正如经验丰富的安全专业人士会告诉你的，概念越简单，可靠性越高。复杂性带来配置错误、故障和失效。\n\
  \n#### 较少的误报\n\n我们之前提到，与蜜罐的任何交互都将被视为可疑。此外，当组织内所有人都被告知组织内部署了蜜罐（即某些设备充当蜜罐）时，没人会尝试访问它们。\n\
  \n#### 无需已知攻击特征\n\n与 IDS 不同，蜜罐检测可疑活动不需要已知攻击特征。蜜罐中的所有活动都将作为可疑活动存储。\n\n### 5.3.2 蜜罐的劣势\n\
  \n虽然蜜罐具有巨大优势，但也存在若干劣势。\n\n\n\n\n### 5.3.3 蜜罐在网络安全中的角色\n\n我们已经讨论了蜜罐的优缺点。因此，要了解蜜罐的最大价值所在，我们必须将其应用于安全领域。我们可以分析它们如何为安全增值并降低组织的整体风险。\n\
  \nBruce Schneier 在《秘密与谎言》（*Secrets and Lies*）一书中将安全分为三大类：\n\n#### 预防\n\n在网络安全中，预防意味着阻止坏人进入（即防止坏人进入你的网络）。蜜罐对预防略有增值。此外，我们知道攻击者可能利用蜜罐攻击你组织中的其他系统。好消息是，蜜罐可以使用许多方法来防止攻击者进入你的组织。当攻击者知道某组织部署了蜜罐时，他们会担心被发现，同时也会浪费时间和资源去攻击蜜罐。我们之前讨论的这种方法被称为欺骗预防或威慑预防。欺骗的概念是让攻击者浪费时间和资源去攻击蜜罐，而不是攻击生产系统。威慑的概念是，如果攻击者知道组织中有蜜罐，他们可能会被吓退。也许他们不想被发现，或者不想浪费他们的时间和资源。\n\
  \n我们应该提到，欺骗和威慑无法防止最常见的攻击，尤其是*机会型目标*攻击。这是因为*机会型目标*攻击者使用自动化工具入侵尽可能多的系统。这些攻击者不会花时间分析他们针对的系统。欺骗或威慑无法防止这些攻击，因为不存在可以被威慑或欺骗的有意识个体。最后，我们可以认为蜜罐无法提供真正的预防，或者只能提供有限的预防。\n\
  \n#### 检测\n\n检测意味着监控、发现并警报未授权活动的行为。在第 3 章中，我们已经解释了检测与预防的主要区别，并给出了现实生活中的例子。除了这些概念外，预防意味着阻止未授权活动进入你的组织；而在检测的情况下，未授权活动可以进入你的组织，系统会实时向管理员发送警报。因此，管理员将检查这些活动是否经过授权。如果未授权，管理员将拒绝它们或将其清除。\n\
  \n安全社区设计了多种技术来执行检测任务；其中之一是 IDS（入侵检测系统）。IDS 是一种优秀的安全解决方案，旨在检测网络或单个主机上的未授权活动。\n\n\
  在对检测进行这些描述后，一个问题浮现出来：蜜罐在检测未授权或可疑活动方面是否增值？答案是肯定的！蜜罐在检测方面增加了巨大价值，我们现在将对此进行探讨。\n\n\
  检测环境主要面临三个常见挑战，如下所示：\n\n*   误报\n*   漏报\n*   数据聚合\n\n误报是指 IDS 错误地警报可疑或恶意活动，通常是由于流量建模缺陷或指定的规则/特征/异常模型薄弱所致。漏报是指系统未能检测到攻击。第三个挑战是数据聚合，即集中收集所有用于检测的数据，然后将这些数据佐证为有价值的信息。\n\
  \n\n\n\n误报一次不是问题。问题在于系统发送过多误报（即每天数百甚至数千次）。因此，过多的误报是个大问题，因为管理员必须处理所有这些误报，以检查它们是否真的是误报。这增加了管理员的任务负担，众所周知，该角色的人员每天有太多任务要执行，包括维护\
  \ IDS。如果 IDS 产生大量误报，管理员本应将大部分时间花在该问题上，而忽略所有其他问题。常有人称 IDS 好坏取决于误报少寡，似乎不关心漏报的危险。我们的观点是，误报和漏报对组织同等重要。因为，一次成功的漏报会给组织带来大问题，如信息窃取、网络延迟和系统瘫痪。同样，误报也有大问题，会占用管理员精力并使其精疲力竭。\n\
  \n大家公认，世界上没有任何人造系统是 100% 完美的。但我们的目标是尽最大能力设计开发尽可能完美的系统。完美系统需要神一般的输入和支持，不含任何错误，这不适用于人类。因此，优秀的\
  \ IDS 也应只有少量误报和漏报。\n\n第三个挑战如前所述是数据聚合。现代技术极擅长捕获海量数据。NIDS、系统日志、应用日志——所有这些资源都善于捕获和生成\
  \ GB 级数据。挑战在于如何聚合所有这些数据，使其在检测和确认攻击时有价值。新技术不断被设计出来以汇总所有这些数据创造价值、潜在地检测攻击。同时，也在开发能生成更多新形式数据的新技术。所以问题在于技术进步太快，数据聚合解决方案跟不上数据生成的步伐。\n\
  \n要为检测创造良好环境，必须解决上述三大挑战。蜜罐能从容应对这些挑战！让我们看看如何做到：\n\n*   **误报：** 大多数蜜罐没有生产流量，也不运行任何合法生产服务。因此，几乎没有活动会产生误报。\n\
  *   **漏报：** 蜜罐解决漏报问题，因为它们不易被新漏洞利用规避或击败。而且，正如我们知道的，蜜罐内几乎没有生产活动，它们通过捕获进出系统的绝对所有内容来减少漏报。这意味着捕获的所有活动极有可能是可疑的。\n\
  *   **数据聚合：** 蜜罐通过捕获高价值数据解决此问题。它们通常每天只生成几 MB 数据，其中大部分是高价值的。此外，蜜罐能捕获零日攻击（即未知攻击），这是其他安全工具检测不到的。这使它们在网络系统中极其好用。\n\
  \n利用蜜罐进行检测的一个例子是将其部署在 DMZ（通常称为**非军事区**）内。这是一个不受信系统的网络，通常用于向互联网提供服务，如邮件或 Web 服务器。这些系统通常风险极大，因为互联网上任何人都能向它们发起连接，所以极可能被攻击并潜在妥协。检测此类活动至关重要。问题在于此类攻击难以检测，因为有太多生产活动在进行。所有这些流量会产生大量误报。管理员可能迅速忽略\
  \ DMZ 内流量生成的警报。此外，由于产生大量流量，数据聚合成为挑战。然而，我们不想错过任何攻击，特别是漏报。因此，这种实现常受欢迎。\n\n**响应**。一旦检测到攻击，我们需要响应该攻击的能力。蜜罐可在响应事件中帮助保护组织。组织当前面临的最大挑战之一是如何响应攻击。通常很少有关于攻击者、他们如何入侵或已造成多大损害的信息。在攻击情况下，关于攻击者活动的详细信息至关重要。攻击响应的主要问题是受损系统往往是运行关键服务的生产系统。因此，难以将其关闭或下线。即使系统下线，日志和数据条目太多，难以判断什么是正常日常活动，什么是攻击者活动。\n\
  \n蜜罐有助于解决这两个问题。蜜罐是优秀的事件响应工具，因为它们可快速轻松地下线进行全面取证分析，而不影响日常生产运营。此外，蜜罐捕获的唯一活动是未授权或恶意活动（如前所述）。这使被攻破的蜜罐比被攻破的生产系统更易分析，因为从蜜罐检索的任何数据极可能与攻击者相关。它们（即蜜罐）提供的宝贵礼物是快速给组织某种深度信息，使其（即组织）能有效响应攻击。通常，高交互蜜罐是响应的最佳解决方案。\n\
  \n## 5.4 基于交互级别的蜜罐类型\n\n交互级别给了我们一个衡量和比较蜜罐的尺度。蜜罐能做的越多、攻击者能对蜜罐做的越多，能获得的信息就越多。然而，同样地，攻击者能对蜜罐做的越多，攻击者能造成的潜在损害就越大。基于交互级别，蜜罐分为三类：\n\
  \n### 5.4.1 低交互蜜罐\n\n低交互蜜罐在实现上最简单，通常因其简单设计和基本功能而最易安装、配置、部署和维护。这些蜜罐仅模拟各种服务。因此，攻击者仅限于与这些预设服务交互。例如，低交互蜜罐可模拟运行多种服务（如\
  \ Telnet 和 FTP）的标准 Unix 服务器。攻击者可 Telnet 到蜜罐，获得显示操作系统的横幅，或许能得到登录提示。攻击者随后可尝试通过暴力破解或猜测密码登录。蜜罐会捕获并收集这些尝试，但我们应提到，没有真实操作系统供攻击者登录。所以，攻击者的交互仅限于登录尝试！\n\
  \n\n\n\n### 5.4.2 高交互蜜罐\n\n高交互蜜罐在实现方式和信息收集方面与低交互蜜罐截然不同。它们使用实际的操作系统而非模拟环境。由于高交互蜜罐使用实际操作系统，攻击者能获得更真实的体验，而我们能够收集到更多关于预期攻击的信息。这使得高交互蜜罐在希望捕获尚未公开的漏洞或利用代码细节的情况下非常有用。这些漏洞或利用代码仅被发现漏洞并编写利用代码的少数攻击者使用。此类利用代码被称为\
  \ `zero-day` 利用代码。快速发现并公开这些漏洞至关重要，以便系统管理员能够过滤或规避这些问题。此外，厂商也能开发并发布软件补丁来修复这些漏洞。\n\n\
  高交互蜜罐风险极高，因为攻击者可以利用这些系统危害其他系统。因此，高交互蜜罐通常部署在受控环境中，例如防火墙之后。控制攻击者的能力不仅来自蜜罐本身，还来自网络访问控制设备——在许多情况下即防火墙。防火墙允许攻击者攻陷其后的蜜罐之一，但不允许攻击者利用该蜜罐向外发起攻击。这种架构部署和维护非常复杂，特别是当你不想让攻击者意识到自己正被监控和控制时。构建具有合适规则库的防火墙需要投入大量工作。\n\
  \n正如上文所述，高交互蜜罐需要广泛的控制机制；这些机制的安装和配置可能极其困难且耗时。要实现高交互蜜罐，应结合多种不同技术，如防火墙和 IDS。所有技术都必须为高交互蜜罐进行适当的定制。维护也非常耗时，因为我们必须更新防火墙规则库和\
  \ IDS 特征库，并全天候监控蜜罐活动。由于这些复杂性，高交互蜜罐风险很高。我们允许攻击者交互越多，出错的可能性就越大。然而，一旦正确实施，高交互蜜罐能提供其他蜜罐无法提供的关于攻击者的宝贵洞察。\n\
  \n### 5.4.3 中交互蜜罐\n\n中交互蜜罐。\n\n中交互蜜罐的关键特性是应用层虚拟化。它们不旨在完全模拟一个完整的操作系统环境，也不实现应用协议的所有细节。中交互蜜罐的作用是提供足够的响应，使已知利用代码在等待特定端口时被诱骗发送其载荷。\n\
  \n一旦接收到载荷，即以某种方式提取并分析 Shellcode。随后，中交互蜜罐模拟 Shellcode 将要执行的操作以下载恶意软件。因此，蜜罐必须提供虚拟文件系统以及虚拟的标准\
  \ Windows 下载工具。蜜罐随后可从托管位置下载恶意软件，并将其本地存储或提交至其他地方进行分析。\n\n## 5.5 五款蜜罐概览\n\n本节介绍五款著名蜜罐的概况。\n\
  \n### 5.5.1 BackOfficer Friendly\n\nBOF 由 Marcus Ranum 和 Network Flight Recorder\
  \ 团队开发。BOF 通常被称为一种简单、免费的蜜罐解决方案。BOF 被视为一种低交互蜜罐，设计用于在几乎任何 Windows 系统上运行。\n\nBOF 非常简单，任何人都可将其安装在自己的系统上；此外，它易于配置，维护成本低。正因其简单，其功能也受到严重限制。它仅拥有少量服务在端口上监听，模拟能力极其有限。\n\
  \n### 5.5.2 Specter\n\nSpecter 由 NetSec 开发并销售，被视为一种商业支持的蜜罐。Specter 同样被视为像 BOF 一样的低交互蜜罐，但其功能和能力比\
  \ BOF 更强。事实上，Specter 不仅仅是模拟服务，它还能模拟不同的操作系统和漏洞。它还具备广泛的警报和日志记录功能。此外，Specter 易于部署、维护简单，风险较低，因为它仅模拟具有有限交互的服务。然而，与中、高交互蜜罐相比，其能收集的信息量有限。Specter\
  \ 主要是一种生产蜜罐。\n\n### 5.5.3 Honeyd\n\nHoneyd 被视为一种开源低交互蜜罐。Honeyd 的主要功能包括：\n\n*   检测\n\
  *   捕获\n*   警报可疑活动\n\n\n\n\n\n# Honeyd\n\nHoneyd 由 Niels Provos 于 2002 年 4 月开发。它为蜜罐引入了几个新概念。首先，它不监控单个\
  \ IP 地址的活动；相反，它监控数百万个系统的网络。当它检测到针对不存在的系统的探测时，它会动态地承担受害者的身份，然后与攻击者交互，从而成倍地增加蜜罐检测和捕获攻击的能力。它可以在应用层和\
  \ IP 协议栈层模拟数百种操作系统。作为一种开源解决方案，Honeyd 是一项免费技术，让你完全访问源代码。你可以定制自己的解决方案，或使用安全社区其他成员开发的解决方案。Honeyd\
  \ 专为 Unix 平台设计，安装和配置相对容易，主要依赖命令行界面。\n\n### 5.5.4 ManTrap\n\nManTrap 被视为一种中高交互蜜罐，是由\
  \ Recourse 公司销售的商业蜜罐。ManTrap 不像 BOF、Specter 和 Honeyd 那样模拟任何服务。相反，它获取一个操作系统并创建多达四个虚拟操作系统。这使管理员能对虚拟操作系统拥有广泛的控制和数据捕获能力。组织甚至可以安装想要测试的生产应用程序，如\
  \ DNS、Web 服务器，甚至数据库。这些虚拟操作系统与标准生产系统具有几乎完全相同的交互和功能。因此，可以从攻击者那里学到大量信息。\n\n作为商业产品，ManTrap\
  \ 部署和维护相当容易。它还能捕获大量信息。ManTrap 不仅能检测扫描和未授权连接，还能捕获未知攻击、黑客对话或新漏洞。然而，其多功能性是以增加风险为代价的。由于蜜罐为攻击者提供了一个完整的操作系统，该蜜罐可能被用来攻击其他系统并执行未授权活动。\n\
  \nManTrap 的一个局限是目前仅限于 Solaris 操作系统。在本书撰写时，其他操作系统的版本正在开发中，但尚未发布。随着技术的飞速发展，建议读者寻找最新的产品版本。ManTrap\
  \ 具有灵活性，可用作生产或研究蜜罐，尽管最常用于生产目的。\n\n### 5.5.5 Honeynets（蜜网）\n\n蜜网是高交互蜜罐。事实上，很难想象有其他蜜罐解决方案能提供比蜜网更高级别的交互。蜜网的概念很简单：构建一个标准生产系统的网络，就像我们在当今大多数组织中发现的那样。将这组系统置于某种访问控制设备（如防火墙）之后，并观察会发生什么。攻击者可以探测、攻击并利用蜜网内的任何系统，使他们拥有完整的操作系统和应用程序进行交互。没有服务被模拟，也没有创建受限环境。蜜网内的系统可以是任何东西：运行\
  \ Oracle 数据库的 Solaris 服务器、运行 IIS Web 服务器的 Windows XP 服务器、思科路由器，等等。简而言之，蜜网内的系统是真正的生产系统。\n\
  \n蜜网的复杂性不在于蜜罐本身的构建（它们可以只是默认安装），而在于构建受控网络，该网络既能控制又能捕获发生在蜜罐内外的所有活动。因此，蜜网是部署和维护最困难的蜜罐之一。这种复杂性使蜜网成为风险最高的蜜罐解决方案。蜜网最重要的优势之一是它们还能捕获几乎任何可能存在的平台上最大量的信息。蜜网主要用于研究目的。由于涉及的工作量巨大，它们作为生产蜜罐的价值很小。\n\
  \n#### 虚拟蜜网\n\n虚拟蜜网是一种允许你在单台计算机上运行所需一切的解决方案。我们使用术语“虚拟”，因为不同的操作系统*看起来*像是在各自独立的计算机上运行，而这些计算机并非真实机器。这些解决方案之所以成为可能，是因为虚拟化软件允许在同一硬件上同时运行多个操作系统。虚拟蜜网并非一种全新的技术；它们只是将蜜网技术的概念实施到单个系统中。这种实施与传统蜜网相比，具有其独特的优缺点。\n\
  \n虚拟蜜网的优势包括降低成本和更易于管理，因为所有东西都结合在一个系统中。你不需要部署许多计算机来构建完整的蜜网，只需一台计算机即可。然而，这种简单性是有代价的。首先，你受限于硬件和虚拟化软件可部署的操作系统类型。例如，大多数虚拟蜜网基于\
  \ Intel X86 芯片，因此你只能部署基于该架构的操作系统。你很可能无法在虚拟蜜网中部署 Alteon 交换机、VAX 或 Cray 计算机。其次，虚拟蜜网伴随着风险。具体来说，攻击者可能会攻破虚拟化软件并接管整个蜜网，从而控制所有系统。最后，存在指纹识别的风险。一旦坏蛋攻破了你虚拟蜜网内的系统，他们可能能够确定哪些系统运行在虚拟环境中。\n\
  \n我们将虚拟蜜网分为两类：自包含型和混合型。其中，自包含型更为常见。我们将首先定义这两种不同类型，然后介绍虚拟蜜网的不同部署方式。\n\n#### 自包含虚拟蜜网\n\
  \n自包含虚拟蜜网是将整个蜜网网络浓缩到单台计算机上。整个网络在虚拟层面上包含在单个物理系统中。蜜网网络通常由用于数据控制和数据捕获的防火墙网关以及蜜网内的蜜罐组成。这种类型的虚拟蜜网的一些优势如下：\n\
  \n*   **便携性：** 虚拟蜜网可以放在笔记本电脑上并带到任何地方。蜜网项目在 2002 年 8 月的 Blackhat Briefings 上演示了这一功能。\n\
  *   **即插即捕：** 你可以拿着这一个盒子，插入任何网络，即可准备好捕捉那些黑客。这使得部署容易得多，因为你只需物理部署和连接一台系统。\n*   **省钱省空间：**\
  \ 你只需要一台计算机，从而降低了硬件开支。它也占用空间小，只需要一个插座和一个端口！对于我们这些空间和电源非常有限的人来说，这是救星。\n\n也有一些缺点：\n\
  \n*   **单点故障：** 如果硬件出现故障，整个蜜网可能会瘫痪。\n*   **高性能计算机：** 即使自包含蜜网只需要一台计算机，它也必须是一个强大的系统。根据你的设置，你可能需要大量的内存和处理能力。\n\
  *   **安全性：** 由于所有东西可能共享同一硬件，存在攻击者访问系统其他部分的危险。这在很大程度上取决于虚拟化软件，将在 第 5.5.5 节 中讨论。\n\
  \n\n\n\n\n#### 受限软件\n\n由于所有内容都必须在一台物理机上运行，因此你能使用的软件受到限制。例如，在 Intel 芯片上运行 `Cisco\
  \ IOS` 很困难。\n\n#### 混合虚拟蜜网\n\n混合虚拟蜜网是经典蜜网与虚拟化软件的结合。数据捕获（如防火墙）和数据控制（如 IDS 传感器和日志记录）位于一个独立的、隔离的系统上。这种隔离降低了被攻陷的风险。然而，所有蜜罐都在单个物理机上虚拟运行。\n\
  \n##### 优势\n\n*   **安全：** 正如我们在自包含虚拟蜜网中所见，攻击者可能访问蜜网的其他部分（如防火墙）。使用混合虚拟蜜网，唯一的危险仅在于攻击者访问其他蜜罐。\n\
  *   **灵活：** 你可以为混合网络的数据控制和数据捕获元素使用各种软件和硬件。例如，你可以在网络上使用 `OpenSnort` 传感器，或 `Cisco\
  \ pix` 设备。你还可以运行任何类型的蜜罐，因为你只需在网络上再接入一台计算机（除了你的虚拟蜜罐主机）。\n\n##### 劣势\n\n*   **不可移植：**\
  \ 由于蜜网由多台物理机组成，移动起来更加困难。\n*   **耗时耗空间：** 由于网络中不止一台计算机，你将在电力、空间方面花费更多，可能在资金上也是如此。\n\
  \n#### 虚拟化软件\n\n混合虚拟蜜网允许你利用经典蜜网的灵活性，并通过使用虚拟化软件增加蜜罐数量。现在我们已经定义了虚拟蜜网的两大类别，让我们重点介绍一些实施虚拟蜜网的可能方法。在这里，我们概述了三种不同的技术，它们将允许你部署自己的虚拟蜜网。毫无疑问，还有其他选择，例如\
  \ `Bochs`；然而，蜜网项目已经使用并测试了这三种方法。没有哪种方案绝对优于另一种。相反，它们各有独特的优缺点；由你决定哪种方案最适合。我们现在将介绍的三个选项是\
  \ `VMware workstation`、`VMware GSX server` 和用户模式 Linux (`UML`)。\n\n#### VMware workstation\n\
  \n`VMware workstation` 是一种长期使用且成熟的虚拟化选项。它专为桌面用户设计，可在 Linux 和 Windows 平台上使用。\n\n\
  ##### 优势\n\n1.  **广泛的操作系统支持：** 你能够在虚拟环境中运行各种操作系统（称为 *Guest OSs*），包括 Linux、Solaris、Windows\
  \ 和 FreeBSD 蜜罐。\n2.  **网络选项：** Workstation 提供两种处理网络的方式。第一种是桥接模式，这对混合虚拟蜜网很有用，因为它允许蜜罐使用计算机的网卡，并表现为蜜网网络上的任何其他主机。第二种选项是仅主机模式；这适合自包含虚拟蜜网，因为你能通过防火墙更好地控制流量。\n\
  3.  **VMware workstation 为每个客户操作系统创建一个镜像：** 这些镜像只是一个文件，使其具有高度可移植性。这意味着你可以将它们传输到其他计算机。要将蜜罐恢复到原始状态，只需将备份复制到位即可。\n\
  4.  **能够挂载 VMware 虚拟磁盘镜像：** 你可以像使用 `vmware-mount.pl` 挂载驱动器一样挂载 `VMware` 镜像。\n5.\
  \  **易于使用：** `VMware workstation` 附带图形界面（Windows 和 Linux 均有），使安装、配置和运行操作系统变得非常简单。\n\
  6.  **作为商业产品：** `VMware workstation` 提供支持、升级和补丁。\n\n##### 劣势\n\n1.  **成本：** `VMware\
  \ workstation` 每个许可证售价 300 美元（价格可能随时间变化）。这对业余爱好者或失业学生来说可能有点贵。\n2.  **资源需求：** `VMware\
  \ workstation` 必须在 X 环境下运行，且每个虚拟机 (`VM`) 都需要自己的窗口。因此，除了为客户操作系统分配的内存外，还有 X 系统的开销。\n\
  3.  **客户操作系统数量有限：** 使用 `VMware` 你只能运行少量的 `VM`，约 1–4 个。这可能导致蜜网规模受限。\n4.  **闭源：**\
  \ 由于 `VMware` 是闭源的，你无法进行任何定制调整。\n5.  **指纹识别：** 可能识别出蜜罐上的 `VMware` 软件指纹，特别是如果系统上安装了\
  \ `VMware tools`。这可能向黑客暴露蜜罐身份。然而，`VMware workstation` 确实有一些选项可以增加指纹识别难度，例如设置虚拟接口\
  \ MAC 地址的能力。\n\n`VMware` 产品还有一些不错的功能，比如挂起 `VM` 的能力。你可以*暂停* `VM`，当你恢复它时，所有进程会像什么都没发生一样继续运行。`VMware`\
  \ 和其他虚拟化软件的一个有趣用途是启动 `VM` 的简易性和速度。一旦蜜网被攻陷，且我们从中学到了尽可能多的知识，我们想要重新开始。使用虚拟蜜网，我们只需复制文件或使用\
  \ `VMware workstation` 中的可撤销磁盘或非持久磁盘功能来丢弃任何更改。`VMware workstation` 的另一个功能是在宿主操作系统后面运行多个网络。因此，如果你只有一台物理机，你可以在同一台机器上同时拥有蜜网和个人电脑，而不必担心任何一方的数据污染。如果你想了解更多关于\
  \ `VMware` 及其蜜罐技术能力的信息，请查看 Kurt Seifiried 的优秀论文 *honeypotting with VMware—The Basics*\
  \ 和 Ryan Barnett 的 *Monitoring VMware honeypots*。\n\n#### VMware GSX server\n\n\
  `VMware` Ground Storm X (`GSX`) 服务器是 `VMware workstation` 的重型版本。它旨在运行多个高端服务器。正如我们将看到的，这非常适合用作蜜网。`GSX`\
  \ 服务器目前可在 Linux 和 Windows 上作为宿主操作系统运行。如果你想了解更多关于在 `GSX` 上部署虚拟蜜网的信息，请查看论文 *Know Your\
  \ Enemy: Learning with VMware*。\n\n##### 优势\n\n1.  **广泛的操作系统支持：** `GSX` 服务器支持 Windows（包括\
  \ 95、98、NT、2000、XP 和 .NET server）、各种 Linux 发行版，以及潜在的 BSD 和 Solaris（官方不支持）。\n2. \
  \ **网络：** 它包含 Workstation 的所有选项。\n3.  **无需 X 意味着更多客户操作系统：** `GSX` 服务器运行 `VMware`\
  \ 不需要 X 系统运行。这允许你同时运行更多客户操作系统。不过，如果宿主运行 Linux，它确实需要安装一些 X 库。\n4.  **Web 界面：** `GSX`\
  \ 服务器可以通过网页界面进行管理。客户操作系统可以通过网页启动、暂停、停止和创建。\n5.  **远程终端：** 这是 `GSX` 服务器最好的功能之一。通过网页和一些\
  \ `VMware` 软件，你可以远程访问客户操作系统，就像坐在控制台前一样。你能够进行远程安装和检查系统，而不会在蜜网上产生流量。\n6.  **挂载能力：**\
  \ 可以创建虚拟磁盘镜像。\n7.  **VMware GSX 服务器支持更多宿主内存（高达 8GB）：** 更多 CPU（高达 8 个），以及每个 `VM`\
  \ 更多内存（2GB），超过了 `VMware workstation`。\n8.  包含用于管理客户操作系统的 Perl API。\n\n\n\n\n\n##\
  \ 5.6 结论\n\n在结束本章之前，应当澄清的是，蜜罐并不执行与入侵检测系统（IDS）相同的功能。是的，它们有一些相似之处，但从操作角度来看，它们有相当大的差异。例如，如果我们想为网络设计一个优秀的\
  \ IDS，我们必须收集关于攻击的有价值数据，然后分析这些攻击以生成其特征码，接着必须在 IDS 中使用这些特征码。另一方面，蜜罐是收集有价值数据的好工具，但它们是为被潜在攻击者攻击而设置的。蜜罐不是用于保护系统的常规防御机制，而\
  \ IDS 是防御系统或策略的核心部分。蜜罐通常部署用于收集关于攻击者的有价值信息，这些信息可被分析并用于开发适当的对策，而 IDS 只是基于一组规则实现检测是否有任何恶意实体进入网络，然后要求将其清除。\n\
