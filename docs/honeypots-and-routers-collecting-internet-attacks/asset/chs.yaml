  # 6 安全系统\n\n**MOHSEN MOHAMED**\n\n安全系统的目标是管理并报告网络中的运营信息安全风险。\n\n本章涵盖以下安全系统：\n\n\
  *   防火墙\n*   杀毒软件\n*   入侵检测与防御系统 (IDPSs)\n\n## 6.1 防火墙\n\n防火墙是一种旨在防止未经授权访问专用网络或从专用网络发起访问的系统。防火墙可以通过硬件、软件或两者结合的方式实现。防火墙常用于防止未经授权的互联网用户访问连接到互联网的专用网络，尤其是内部网。所有进出内部网的消息都必须经过防火墙，防火墙会检查每条消息，并阻止不符合指定安全标准的消息。\n\
  \n### 6.1.1 防火墙类型\n\n防火墙可以是硬件或软件，但理想的防火墙配置将包含两者。除了限制对计算机和网络的访问外，防火墙还可用于控制对专用网络的远程访问，并通过适当的身份验证以安全的方式执行此操作。\n\
  \n**硬件防火墙**。这种类型的防火墙可以作为独立产品购买，但通常也内置于宽带路由器中，应被视为系统和网络设置的重要组成部分。大多数硬件防火墙至少有四个网络端口用于连接其他计算机，但对于大型网络，也有商业网络防火墙解决方案可用。\n\
  \n**软件防火墙**。这种类型可以安装在您的计算机上（像任何软件一样），您可以对其进行自定义；从而允许您对其功能和保护特性进行一定程度的控制。软件防火墙将保护您的计算机免受外部尝试控制或获取访问权限的侵害。\n\
  \n### 6.1.2 常见防火墙技术\n\n正如我们所知，防火墙用于保护家庭和企业网络。典型的防火墙软件或硬件设备会过滤所有从互联网传入您的网络或计算机系统的信息。有许多类型的防火墙技术可防止潜在有害信息通过。\n\
  \n*   **包过滤器 (无状态)**。如果数据包与包过滤器的规则集匹配，包过滤器将丢弃或接受该数据包。\n*   **有状态过滤器**。它维护通过它的所有连接的记录，并能确定一个数据包是新连接的开始、现有连接的一部分，还是一个无效数据包。\n\
  *   **应用层**。它的工作方式类似于代理，并且能够*理解*某些应用程序和协议。它可以检查流量内容，阻止其视为不适当的内容（即网站、病毒和漏洞）。\n\n\
  ## 6.2 杀毒软件\n\n它是一种用于预防、检测和移除恶意软件的计算机软件程序。杀毒软件最初是为检测和移除计算机病毒而开发的，因此得名。然而，随着其他类型恶意软件的激增，杀毒软件开始提供针对其他计算机威胁的防护。特别是，现代杀毒软件可以防护恶意浏览器助手对象、浏览器劫持者、勒索软件、键盘记录器、后门、Rootkit、特洛伊木马、蠕虫、恶意分层服务提供商\
  \ (LSPs)、拨号器、欺诈工具、广告软件和间谍软件。\n\n## 6.3 入侵检测与防御系统\n\n入侵检测系统 (IDS) 是一种监控网络或系统活动以发现恶意活动或策略违规的设备或软件应用程序，并向管理员生成报告。因此，IDS\
  \ 的主要功能是通过向管理员发送报告来进行检测；因此，IDS 中不包含防御任务；管理员在收到来自 IDS 的警报后可以手动进行防御。入侵防御系统 (IPS) 是一个安全设备网络，它监控网络和/或系统活动中的恶意活动，试图阻断/停止该活动，并报告该活动。因此，IPS\
  \ 的主要功能是自动防御，并向管理员报告案情。IDS 和 IPS 的结合称为 *IDPS*。现在大多数组织都使用 IDPS 产品，因为它们提供了强大的防御机制。\n\
  \n让我们给出两个现实生活中的例子，以进一步解释 IDS 和 IPS 之间的主要区别。\n\n> **示例 6.1**\n>\n> 假设我们有一栋大房子，有一名保安负责保护这栋房子免受攻击者或不受欢迎的外来者侵害。保安始终坐在房子的大门口，房子配备了一个警铃，该警铃在凌晨\
  \ 1 点激活，并持续激活至上午 8 点。如果有人试图强行或通过非法手段进入房子（即任何不通过大门——这合法入口——进入的人），警铃就会发出警报。如果警铃发出警报，保安就会去查看究竟发生了什么。事实上，如果警铃发出警报，并不总是意味着有攻击者试图闯入房子；甚至可能是房子里的成员（合法人员）！如果非法人员闯入房子而警铃未发出警报，这被视为假阴性。如果警铃误为合法人员发出警报，这被视为假阳性。从这个例子可以清楚地看出，警铃完全充当了\
  \ IDS 的角色，而保安则充当了网络管理员的角色。那么，如果 IDS 不能自动保护组织免受攻击（即仅通过发送 IDS 警报），它有什么好处呢？上述例子回答了这个问题；也就是说，没有警铃，保安就无法知道有人试图闯入房子。因此，没有\
  \ IDS 警报，网络管理员就无法知晓有攻击已被发起。我们应在此提及，某些类型的 IDS 具有有限的能力来防止攻击进入组织，但总体而言，IDS 的主要功能是检测，而非防御。\n\
  >\n> **示例 6.2**\n>\n\n\n\n> 我们发现，在某些国家，有些人会在房屋墙壁上拉一根电线，通过打开电源开关使其通电。房主会打开开关，例如从凌晨\
  \ 1 点到早上 8 点，以防止攻击者/窃贼进入房屋。这个例子类似于 IPS，因为这种方法可以防止窃贼轻易进入房屋。\n>\n> 上述两个例子的结合可以被视为\
  \ IDPS 的机制。需要注意的是，我们提出示例 6.2 只是为了说明 IPS 的主要功能构思。在现实生活中，那样的通电电线可能导致死亡，这是不可接受的。然而，电压水平可以相应设定，使其起到防止非法入侵的作用，而不会造成严重的致命伤害。当然，在现实案例中最好避免采用这种机制\
  \ [20]。\n\n### 6.3.1 简介\n\n图 6.1 一目了然地展示了本章将涵盖的内容。图中显示的数字不是章节编号，只是为了关联我们所使用的项目。可以看出，首先，我们介绍了关于\
  \ IDPS 的概况。然后，我们讨论 IDPS 检测技术：基于特征的检测、基于异常的检测和有状态协议分析。接着，我们详细说明 IDPS 组件：传感器或代理、管理服务器、数据库服务器和控制台。之后，我们讨论\
  \ IDPS 针对授权活动的安全防护能力。随后，我们讨论 IDPS 技术的类型：基于网络的 IDPS、无线 IDPS、网络行为分析 (NBA) 系统和基于主机的\
  \ IDPS。提到 IDPS 技术类型时，是指我们在哪个层面部署 IDPS 产品；例如，在房子内，我们可以把警铃装在房子墙壁上，这类似于基于网络的 IDPS；也可以把它装在任意房间里，这类似于基于主机的\
  \ IDPS。在通过一些 IDPS 产品示例结束本章之前，我们将讨论集成多种 IDPS 技术和集成不同 IDPS 产品的优势 [20]。\n\n![图 6.1\
  \ 本章内容一览。](img/pg130_1.jpg)\n\n**图 6.1** 本章内容一览。\n\nIDS 和 IPS [\n\n为了获得良好的防御性能，安全专家通常将\
  \ IDS 和 IPS 结合成一个单一系统，称为 `IDPS`。IDPS 的主要功能集中在识别可能的事件、记录有关它们的信息、尝试阻止它们，并向安全管理员报告。\n\
  \n在观测到任何事件时，IDPS 通常执行以下任务 [20]：\n\n1.  记录与观测事件相关的信息\n2.  通知安全管理员重要的观测事件\n3.  向安全管理员生成报告\n\
  \n有几种 IDPS 在记录可疑活动（或威胁）后，也可以通过尝试阻止其成功来对此做出响应。IDPS 使用多种响应技术，涉及的动作包括：停止攻击本身、改变安全环境（例如，重新配置防火墙）或改变攻击的内容。\n\
  \n组织、银行、教育机构、研究实验室、办公室，或凡是使用计算机系统进行网络和通信的地方，建议确保所有 IDPS 组件都得到适当的保护。在许多网络系统中，保护 IDPS\
  \ 组件至关重要，因为攻击者可能试图阻止 IDPS 检测攻击，或试图访问 IDPS 中的敏感信息，如主机配置和已知漏洞。IDPS 有几类组件，包括以下内容 [\n\
  \n1.  传感器或代理\n2.  管理服务器\n3.  数据库服务器\n4.  用户和管理员控制台\n5.  管理网络\n\n所有组件的操作系统和应用程序应始终保持最新，所有基于软件的\
  \ IDPS 组件应以尽可能最佳的复杂方式开发，以便减少潜在威胁，并使安全防护不易被突破。\n\n特定的重要保护措施包括：为每个 IDPS 用户和管理员创建单独的账户，限制对\
  \ IDPS 组件的网络访问，并确保 IDPS 管理通信得到适当保护，例如对其进行加密，或通过物理或逻辑上独立的网络进行传输。管理员应持续维护 IDPS 组件的安全，包括验证组件是否按预期运行、监控组件的安全问题、执行定期漏洞评估、妥善响应\
  \ IDPS 组件中的漏洞，以及测试和部署 IDPS 更新。管理员还应定期备份配置设置，并在应用更新前确保现有设置不会意外丢失。\n\n为了获得更全面、更准确的互联网蠕虫及其他攻击的检测和预防，不同类型的组织需要考虑使用不同类型的\
  \ IDPS 技术。主要有四种类型的 IDPS [\n\n1.  基于网络\n2.  无线\n3.  基于 NBA\n4.  基于主机\n\n上述每种机制都针对恶意活动提供不同类型的防御（即基于网络的机制可以检测到基于主机的机制无法或可能无法检测到的攻击）。例如，基于网络的机制可以检测网络层面的攻击，而基于主机的机制可以检测主机层面的攻击。为了获得良好有效的防御解决方案，需要结合基于网络和基于主机的\
  \ IDPS 机制。如果组织确定其无线网络需要额外监控，可以使用无线 IDPS 技术以获得良好的防御性能。\n\n如果组织希望获得针对拒绝服务 (DoS) 攻击、蠕虫和其他威胁的额外检测能力，建议使用\
  \ NBA 技术来实现该目标。计划使用多种类型的 IDPS 技术或同类 IDPS 多个产品的组织，建议了解这些 IDPS 是否应当集成。\n\nIDPS 集成有两种类型。它们如下\
  \ [\n\n1.  `直接 IDPS 集成:` 一个产品向另一个产品提供信息的过程称为 `直接 IDPS 集成`。当组织使用单一供应商的多个 IDPS 产品时，直接\
  \ IDPS 集成最为适用。例如，基于网络的 IDPS 技术可能利用基于主机的 IDPS 数据来判断攻击是否被基于网络的 IDPS 技术成功检测到，基于网络的\
  \ IDPS 技术也可向 NBA IDPS 技术提供网络流信息。这种信息共享有助于提高检测准确性、加快分析过程，并帮助根据优先级对威胁进行排序。使用完全集成解决方案的主要缺点是，故障或受损可能会对所有\
  \ IDPS 技术产生负面影响。\n\n\n\n\n\n#### 2. 间接 IDPS 集成\n\n间接 IDPS 集成是指许多 IDP 产品将其数据发送给安全信息和事件管理\
  \ (SIEM) 软件的过程。SIEM 软件的主要功能是从各种安全相关日志导入信息，并关联其中的事件。SIEM 软件通常通过安全网络通道从日志主机接收日志副本，然后将日志数据标准化为标准字段和值（称为*标准化*），并通过匹配互联网协议\
  \ (IP) 地址、时间戳、用户名和其他特征来确定相关事件。SIEM 产品可以执行以下任务：识别恶意活动，如攻击和恶意软件感染，以及系统和网络的误用和不当使用。\n\
  \nSIEM 软件可以补充 IDPS。例如，如果组织使用不同的 IDPS 技术，SIEM 软件可以关联这些不同 IDPS 技术记录的事件。SIEM 软件可以识别单个设备无法识别的事件；此外，它可以在单一位置收集与事件相关的信息，以便进行更高效的分析。然而，SIEM\
  \ 软件存在一个显著局限性：事件开始的时间与 SIEM 软件看到相应日志数据的时间之间存在延迟，因为日志数据通常以批处理模式传输以节约资源。由于 SIEM 产品仅从原始资源传输部分事件数据，资源消耗也受到限制。\n\
  \n组织应在评估 IDPS 产品前定义产品应满足的要求。为此，评估人员需要了解组织系统和网络环境的特征。然后，评估人员可以选择兼容的 IDPS，以监控系统和/或网络上的感兴趣事件。评估人员应充分说明他们希望通过使用\
  \ IDPS 实现的目标和目的，例如阻止常见攻击、识别配置错误的无线网络设备，以及检测对组织系统和网络资源的滥用。此外，评估人员应重新审视其现有的安全策略，这些策略是\
  \ IDPS 产品需要提供的许多功能的规范。评估人员还应了解组织是否受制于其他组织的监督或审查。如果是，评估人员应确定该监管机构是否要求部署 IDPS 或其他特定的系统安全资源。评估人员还应考虑资源限制。\n\
  \n此外，评估人员需要为以下方面定义专门的需求集 [20]：\n\n*   **深度安全能力**，包括用于识别可疑活动的方法\n*   **性能**，包括最大容量和性能特征\n\
  *   **管理**，包括设计和实施（如可靠性、互操作性、可扩展性和产品安全）；运行和维护（包括软件更新）；以及培训、文档和技术支持\n*   **生命周期成本**，包括初始成本和维护成本\n\
  \n当组织评估 IDPS 产品时，应考虑使用多种数据源相结合的方式来了解产品的特征和能力。常见的产品数据来源包括测试实验室或真实环境下的产品测试、供应商提供的信息、第三方产品评测，以及组织内部人员和其他可信组织人员以往的\
  \ IDPS 使用经验。接收来自其他方的数据时，组织应考虑其保真度，因为这些数据通常未附带生成方法的说明。执行深度的 IDPS 实际操作测试面临若干重大挑战，例如需要大量资源、缺乏标准测试方法和测试套件，这往往使其不可行。然而，有限的\
  \ IDPS 测试有助于评估安全需求、性能、运行和维护能力。\n\n### 6.3.2 IDPS 检测方法\n\nIDPS 技术使用多种方法来检测攻击。主要方法包括基于特征的检测、基于异常的检测和有状态协议分析。大多数\
  \ IDPS 技术结合使用多种方法以提供更准确的检测。我们将在以下章节详细介绍上述方法 [\n\n#### 基于特征的检测\n\n特征是对应已知威胁的一种模式。基于特征的检测方案监控网络中的数据包，并将其与已知恶意威胁的特征数据库进行比对。此方法的工作原理类似于大多数防病毒软件检测恶意软件的方式。此类方法的主要缺点是，在野外发现新威胁与用于检测该威胁的特征被应用到\
  \ IPS 之间，始终存在滞后时间。在此期间，IPS 将无法检测到该新威胁。\n\n基于特征的检测方法被认为是最简单的检测方法，因为它仅使用字符串比较操作，将当前活动单元（如数据包或日志条目）与特征列表进行比对。此类检测技术的另一个局限性是，它们对许多网络或应用协议知之甚少，且无法跟踪和理解复杂通信的状态。例如，基于特征的检测方法无法将请求与相应的响应配对，例如知道对\
  \ Web 服务器特定页面的请求生成了 403 响应状态码，意味着服务器拒绝接受该请求（事实上，403 错误等同于 Web 服务器给出的全盘*拒绝*——不允许进一步协商）。这些方法在处理当前请求时，也缺乏记住先前请求的能力。这一局限性使得基于特征的检测方法无法检测由多个事件组成的攻击，前提是这些事件中没有任何一个包含明确的攻击指示\
  \ [\n\n#### 基于异常的检测\n\n基于异常的检测方法监控网络流量，并将其与既定基线进行比对。基线标识该网络的*正常*状况，一般使用的带宽、使用的协议、通常相互连接的端口和设备，并在检测到异常流量（即与基线显著不同的流量）时向管理员或用户发出警报。\n\
  \n基于异常的检测方法的主要优势在于，它们能非常有效地检测先前未知的威胁。例如，假设一台计算机感染了一种新型恶意软件。该恶意软件可能会消耗计算机的处理资源、发送大量电子邮件、发起大量网络连接，并表现出与该计算机既定配置文件显著不同的其他行为。\n\
  \n初始配置文件是在一段时间内（通常为数天，有时为数周）生成的，有时称为*训练期*。基于异常的配置文件有两种类型：(\n\n\n\n\n\n##### IDPS\
  \ 检测方法与组件\n\n##### 基于异常的检测挑战\n\n将恶意活动无意中纳入配置文件是基于异常的 IDPS 产品的常见问题。（在某些情况下，管理员可以修改配置文件，以排除已知为恶意的配置文件中的活动。）要开发出良好的基于异常的检测方案，专家应深入研究网络活动（如流量速率、各协议的数据包数量、连接速率和不同\
  \ IP 地址的数量），然后将这些活动放入配置文件中。然而，构建配置文件还存在另一个关键问题，在某些情况下，要使其准确非常具有挑战性，因为计算活动可能非常复杂。例如，如果某项执行大文件传输的维护活动每月仅发生一次，则可能在训练期间未被观察到；当维护发生时，它很可能被视为与配置文件的显著偏差并触发警报（这将是误报/假阳性）！\n\
  \nIPS 的评估工具是假阴性和假阳性。当攻击或事件未被 IDS 检测到，或被分析师视为良性时，就会发生假阴性。当事件被 IDS 捕获并宣称为攻击，但实际上并非攻击或属于良性时，就会发生假阳性。基于异常的\
  \ IDPS 产品的主要缺点是，它们经常产生大量假阳性，因为良性活动可能与配置文件显著偏离，尤其是在更多样化或动态的环境中。使用基于异常的检测技术的另一个值得注意的问题是，由于事件的复杂性和可能导致警报生成的事件数量，分析师通常难以确定生成特定警报的原因，并验证该警报是否准确而非假阳性。\n\
  \n##### 有状态协议分析\n\n**有状态协议分析**。有状态协议分析方法通过将观察到的事件与*预先确定的公认良性活动定义配置文件*进行比较，来识别协议状态的偏差。与基于异常的检测（使用特定于主机或网络的配置文件）不同，该方法依赖于供商开发的通用配置文件，这些配置文件规定了特定协议应如何使用以及不应如何使用。有状态协议分析中的*有状态*意味着\
  \ IDPS 能够理解并跟踪具有状态概念的网络、传输和应用协议的状态。例如，当用户启动文件传输协议会话时，该会话最初处于未认证状态。未认证用户在此状态下应仅执行少数命令，例如查看帮助信息或提供用户名和密码。理解状态的一个重要部分是将请求与响应配对，因此当发生文件传输协议认证尝试时，IDPS\
  \ 可以通过在相应响应中查找状态码来判断其是否成功。一旦用户成功认证，会话即进入认证状态，预期用户可执行几十条命令中的任意一条。在未认证状态下执行大多数这些命令会被视为可疑，但在认证状态下执行大多数命令则被视为良性。\n\
  \n有状态协议可以识别意外的命令序列，例如重复发出同一命令，或在未先发出其依赖的命令的情况下发出某命令。此外，有状态协议分析还有另一个状态跟踪功能，即对于执行认证的协议，IDPS\
  \ 可以跟踪每个会话使用的认证器，并记录可疑活动所使用的认证器。这在调查事件时很有帮助。某些 IDPS 还可以利用认证器信息，为多类用户或特定用户定义不同的可接受活动。\n\
  \n有状态协议分析方法通过执行协议分析来检测攻击，这包括对单个命令的合理性检查，例如参数的最小和最大长度。如果某命令通常包含用户名参数，且用户名最大长度为 20\
  \ 个字符，则长度为 1000 个字符的参数即属可疑。如果该大参数包含二进制数据，则更加可疑。\n\n为检测未授权活动，有状态协议分析方法使用协议模型，这些模型通常主要基于软件供应商和标准机构（如互联网工程任务组请求意见稿）的协议标准。协议模型通常还会考虑到每种协议实现中的差异。许多标准在解释协议细节方面并不详尽完备，这导致实现之间存在差异。此外，许多供应商要么违反标准，要么添加专有功能，其中一些功能可能会取代标准中的功能。对于专有协议，通常无法获得协议的完整细节，这使得\
  \ IDPS 技术难以执行全面、准确的分析。随着协议的修订和供应商对其协议实现的更改，IDPS 协议模型需要更新以反映这些变化。\n\n有状态协议分析方法的主要缺点是，由于分析的复杂性以及对许多并发会话执行状态跟踪所涉及的开销，它们非常消耗资源。另一个缺点是，有状态协议分析方法无法检测不违反公认可接受协议行为特征的攻击，例如在短时间内执行许多良性操作以导致\
  \ DoS。还有一个问题是，IDPS 使用的协议模型可能与特定应用程序和操作系统特定版本中的协议实现方式，或客户端和服务端协议实现的交互方式相冲突。\n\n###\
  \ 6.3.3 IDPS 组件\n\n本节提及 IDPS 解决方案中的典型组件。\n\n*   **传感器或代理：** 该组件的主要功能是监控和分析活动。术语\
  \ `sensor` 通常用于监控网络的 IDPS，而术语 `agent` 通常用于仅监控单个主机的 IDPS 技术。\n*   **管理服务器：** 管理服务器是一种接收来自传感器或代理的信息并对其进行管理的设备。有些管理服务器会对接收到的信息执行分析，并能识别单个传感器或代理无法识别的事件。关联来自多个传感器或代理的事件信息（例如查找由同一\
  \ IP 地址触发的事件）称为 `correlation`。一些小型 IDPS 部署不使用任何管理服务器。在大型 IDPS 部署中，通常有多个管理服务器，有时呈分层结构。\n\
  *   **数据库服务器：** 数据库服务器是传感器、代理和管理服务器记录的事件信息的存储库。许多 IDPS 支持使用数据库服务器。\n*   **控制台：**\
  \ 控制台是为 IDPS 用户和管理员提供界面的程序。控制台软件通常安装在标准台式机或笔记本电脑上。一些控制台仅用于 IDPS 管理，例如配置传感器或代理和应用软件更新，而另一些控制台则严格用于监控和分析。一些\
  \ IDPS 控制台同时提供管理和监控功能。\n\n\n\n\nIDPS 组件可以通过常规网络或专为安全软件管理设计的独立网络（称为*管理网络*）相互连接。如果使用管理网络，则每个传感器或代理主机都有一个称为*管理接口*的额外网络接口，用于连接到管理网络，并且主机会被配置为无法在管理接口和其他网络接口之间传递任何流量。管理服务器、数据库服务器和控制台仅连接到管理网络。这种架构有效地将管理网络与生产网络隔离开来，向攻击者隐藏\
  \ IDPS，并确保 IDPS 拥有足够的带宽以在恶劣条件下运行。如果 IDPS 在没有独立管理网络的情况下部署，提高 IDPS 安全性的一种方法是在标准网络内使用虚拟局域网创建一个虚拟管理网络。使用虚拟局域网可以为\
  \ IDPS 通信提供保护，但保护程度不如独立的管理网络。\n\n### 6.3.4 IDPS 安全功能\n\nIDPS 技术提供广泛且准确的检测能力。为了提供更准确的检测，IDPS\
  \ 产品会结合使用多种检测技术。所检测的事件类型和典型检测准确性因 IDPS 技术类型的不同而差异很大。大多数 IDPS 至少需要一些调优和定制，以提高其检测准确性、易用性和有效性。调优和定制功能的示例如下：\n\
  \n*   **阈值：** 阈值是设定正常行为与异常行为界限的值。阈值通常指定一个最大可接受水平，例如 60 秒内 5 次失败的连接尝试，或文件名长度为 100\
  \ 个字符。\n*   **黑名单和白名单：** 黑名单是一组离散实体的列表，例如主机、传输控制协议 (TCP) 或用户数据报协议 (UDP) 端口号、互联网控制消息协议类型和代码、应用程序、用户名、URL、文件名或文件扩展名，这些实体先前已被认定与恶意活动相关。黑名单允许\
  \ IDPS 阻止极有可能是恶意的活动。某些 IDPS 会生成动态黑名单，用于暂时阻止最近检测到的威胁（例如来自攻击者 IP 地址的活动）。白名单是一组已知良性的离散实体的列表。白名单通常按粒度使用，例如按协议，以减少或忽略涉及已知良性活动的误报。\n\
  *   **警报设置：** 大多数 IDPS 技术允许管理员自定义每种警报类型。可对警报类型执行的操作示例包括启用或禁用它，以及设置默认优先级或严重级别。某些产品可以在攻击者在短时间内生成大量警报时抑制警报，并可能暂时忽略来自该攻击者的所有未来流量。这是为了防止\
  \ IDPS 被警报淹没。\n*   **代码查看和编辑：** 某些 IDPS 技术允许管理员查看部分或全部与检测相关的代码。这通常仅限于特征码，但某些技术允许管理员查看其他代码，例如用于执行有状态协议分析的程序。查看代码可以帮助分析师确定生成特定警报的原因，从而更好地验证警报并识别误报。编辑与检测相关的代码和编写新代码（例如新特征码）的能力对于完全定制某些类型的检测功能是必需的。\n\
  \n大多数 IDPS 提供多种防护能力以实现更准确的检测；具体能力因 IDPS 技术类型而异。IDPS 通常允许管理员为每种警报类型指定防护能力配置。这通常包括启用或禁用防护，以及指定应使用哪种类型的防护能力。某些\
  \ IDPS 技术提供信息收集能力，例如从观察到的活动中收集有关主机或网络的信息。示例包括识别主机及其使用的操作系统、应用程序，以及识别网络的总体特征。\n\n\
  ### 6.3.5 IDPS 技术类型\n\n如前所述，主要有四种类型的 IDPS 技术：\n\n*   基于网络的 IDPS\n*   无线 IDPS\n*\
  \   NBA 系统\n*   基于主机的 IDPS\n\n在本节中，我们将详细介绍这些 IDPS 技术。\n\n##### 基于网络的 IDPS\n\n基于网络的\
  \ IDPS 部署在网络内的一个或多个战略位置，以监控网络中所有设备的进出流量。基于网络的 IDPS 监控并分析特定网络段或设备的所有入站和出站流量，以识别可疑活动；然而，这样做可能会造成瓶颈，从而损害网络的整体速度。IDPS\
  \ 网络接口卡被置于混杂模式，以便它们接受所见的所有数据包，而不管其预期目的地为何。事实上，大多数 IDPS 在应用层执行分析，例如超文本传输协议、简单邮件传输协议和域名系统。它们还分析传输层（例如\
  \ TCP 和 UDP）和网络层（例如 IPv4）的活动，以识别这些层面的攻击并促进应用层分析。某些基于网络的 IDPS 还在硬件层执行有限分析，例如地址解析协议。\n\
  \n基于网络的 IDPS 传感器可以通过两种模式之一进行部署：直通模式或被动模式。\n\n*   **直通传感器** 的部署方式是使其监控的流量穿过它。某些直通传感器是混合防火墙/IDPS\
  \ 设备。部署直通传感器的主要动机是通过阻断流量来阻止攻击。\n*   **被动传感器** 的部署方式是使其监控实际流量的副本；没有流量穿过传感器。被动传感器可以通过多种方法监控流量，包括交换机端口镜像，它可以看到通过交换机的所有流量；网络分流器，它是传感器与物理网络介质（如光纤）之间的直接连接；以及\
  \ IDS 负载均衡器，它是一种聚合并将流量导向监控系统的设备。\n\n大多数要求传感器防止入侵的技术都要求传感器以直通模式部署。被动技术通常无法为传感器提供可靠的阻断流量方式。在某些情况下，被动传感器可以将数据包放入网络以尝试中断连接，但此类方法通常不如直通方法有效。\
  \ IP 地址通常不分配给传感器网络接口（用于监控流量），除非这些网络接口也用于 IDPS 管理。在未为监控接口分配 IP 地址的情况下运行传感器称为*隐身模式*。这提高了传感器的安全性，因为它隐藏了传感器并防止其他主机向它们发起连接。然而，攻击者可能能够通过分析其防护动作的特征来识别传感器的存在并确定正在使用的产品。此类分析可能包括监控受保护网络，并确定哪些扫描模式触发特定响应，以及某些数据包头字段中设置了什么值。\n\
  \n##### 基于网络的 IDPS 针对恶意活动的安全功能\n\n\n\n##### 基于网络的 IDPS\n\n基于网络的 IDPS 提供广泛且全面的检测能力。大多数\
  \ IDPS 结合使用基于特征、基于异常和有状态协议分析检测技术。这些技术通常紧密交织在一起；例如，有状态协议分析引擎可能会将活动解析为请求和响应，每个请求和响应都会被检查是否存在异常，并与已知恶意活动的特征进行比对。\n\
  \n基于网络的 IDPS 传感器常见的检测事件类型包括应用层、传输层和网络层的侦察与攻击。许多传感器还能检测意外的应用服务，例如隧道协议、后门以及运行未授权应用程序的主机。此外，某些类型的安全策略违规可通过传感器检测，这些传感器允许管理员指定不应允许的活动特征，例如\
  \ TCP 或 UDP 端口号、IP 地址和网站名称。某些传感器还能监控建立加密通信时的初始协商过程，以识别存在已知漏洞或配置错误的客户端或服务器软件。示例包括安全外壳协议、传输层安全协议和\
  \ IP 安全协议。\n\n基于网络的 IDPS 伴随着较高的误报率和漏报率。由于受监控活动的复杂性，这些比率只能在一定程度上降低。单个传感器可能监控涉及数百或数千个内部和外部主机的流量，这些主机运行着各种频繁变更的应用程序和操作系统。传感器无法理解其所见的一切。另一个影响检测准确性的常见问题是，IDPS\
  \ 通常需要大量的调优和定制，以考虑受监控环境的特性。此外，改变网络活动的安全控制（如防火墙和代理服务器）通过改变流量特征，可能给传感器带来额外的困难。\n\n\
  通常，基于网络的方案只能收集有关主机及其网络活动的有限信息。示例包括组织网络上的主机列表、这些主机使用的操作系统版本和应用程序版本，以及网络特性的一般信息（如设备间的跳数）。某些\
  \ IDPS 可利用这些信息提高检测准确性。例如，IDPS 可能允许管理员指定组织 Web 服务器、邮件服务器和其他常见主机类型使用的 IP 地址，还可指定每台主机提供的服务类型（例如每台\
  \ Web 服务器运行的 Web 服务器应用程序类型和版本）。这使 IDPS 能更好地确定警报优先级；例如，针对 Apache Web 服务器的 Apache\
  \ 攻击警报，其优先级将高于针对其他类型 Web 服务器的同类攻击。某些基于网络的 IDPS 还能导入漏洞扫描结果，并利用它们判断哪些攻击若不被阻断极可能成功。这使\
  \ IDPS 能在预防行动上做出更好的决策，并更准确地确定警报优先级。\n\n基于网络的 IDPS 传感器提供多种预防能力。被动传感器可尝试通过向两个端点发送\
  \ TCP 重置包来终止现有的 TCP 会话，使每个端点都误以为对方试图结束连接。然而，这种技术往往无法及时执行以阻止攻击，且仅适用于 TCP；其他更新的预防能力更为有效。内联传感器可执行内联防火墙功能、限制带宽使用并修改恶意内容。被动和内联传感器均可重新配置其他网络安全设备以阻断恶意活动或将其重定向至他处，某些传感器在检测到特定恶意活动时还可运行脚本或程序以触发自定义操作。\n\
  \n##### 基于网络的 IDPS 局限性\n\n尽管基于网络的 IDPS 提供广泛的检测能力，但它们确实存在一些显著局限。加密流量中的攻击无法被基于网络的\
  \ IDPS 检测到，包括虚拟专用网络连接、超文本传输安全协议和安全外壳协议会话。为确保对加密流量中的载荷进行充分分析，可部署 IDPS 在载荷加密前或解密后对其进行分析。示例包括部署基于网络的\
  \ IDPS 传感器监控解密后的流量，以及使用基于主机的 IDPS 软件监控源主机或目标主机内的活动。\n\n当网络出现高负载时，基于网络的 IDPS 可能无法执行全面分析。这会导致某些攻击未被检测到，尤其是在使用有状态协议分析方法时。对于内联\
  \ IDPS 传感器，丢包也会导致网络可用性中断，处理数据包的延迟可能造成不可接受的延迟。为避免此情况，某些内联 IDPS 传感器能识别高负载状况，并选择让特定类型的流量绕过全面分析直接通过传感器，或丢弃低优先级流量。如果传感器使用专用硬件（如高带宽网卡）或重新编译其软件组件以纳入管理员的设置和其他定制，也可能在高负载下提供更好的性能。\n\
  \nIDPS 传感器可能被各类攻击规避。攻击者可生成大量流量（如 DDoS 攻击）和其他异常活动（如异常分片的数据包）来耗尽传感器资源或导致其崩溃。另一种称为*致盲*的攻击技术，会生成可能在短时间内触发大量\
  \ IDPS 警报的流量。在许多情况下，致盲流量并非意图实际攻击任何目标。攻击者在致盲流量运行的同时单独发起*真实*攻击，企图让致盲流量导致 IDPS 以某种方式失效，或使真实攻击的警报被忽视。许多传感器能识别针对自身的常见攻击，向管理员发出警报，随后忽略其余活动。\n\
  \n#### 无线 IDPS\n\n无线 IDPS 监控无线网络流量并分析无线网络协议以识别恶意行为。然而，它无法识别无线网络流量所传输的应用层或更高层网络协议（如\
  \ TCP 和 UDP）中的可疑活动。它最常部署在组织无线网络的覆盖范围内以对其进行监控，但也可部署在可能发生未授权无线联网的位置。\n\n由于传输方式的差异，无线网络攻击有别于有线网络攻击。然而，无线\
  \ IDPS 涉及的基本组件与基于网络的 IDPS 相同：控制台、数据库服务器、管理服务器和传感器。无线 IDPS 通过采样流量来监控网络。需监控两个频段（2.4\
  \ 和 5 GHz），每个频段包含多个信道。传感器一次监控一个信道，并可根据需要切换到其他信道。\n\n我们应提到，大多数无线局域网 (WLAN) 使用电气电子工程师学会\
  \ (IEEE) 802.11 系列 WLAN 标准。\n\n*   站点，即无线终端设备（如笔记本电脑、个人数字助理）。\n*   接入点，用于在逻辑上将站点与组织的有线网络基础设施或其他网络连接起来。\n\
  \n\n\n\n##### 无线网络安全：WLAN、传感器与 IDPS\n\n##### WLAN 架构与模式\n\n某些 WLAN 还会使用无线交换机，它们充当接入点与有线网络之间的中介。基于站点和接入点的网络配置为**基础设施模式**；不使用接入点、站点直接相互连接的网络配置为**自组网模式**。几乎所有组织的\
  \ WLAN 都使用基础设施模式。WLAN 中的每个接入点都会被分配一个名称，称为 `service set identifier` (SSID)。服务集标识符允许站点将一个\
  \ WLAN 与另一个 WLAN 区分开来。\n\n##### 无线传感器类型与部署\n\n无线传感器有多种可用形式。专用传感器通常是被动的，执行无线 IDPS\
  \ 功能，但不转发从源到目的地的流量。专用传感器可设计为固定部署或移动部署，移动传感器主要用于审计和事件处理目的（例如，定位非法无线设备）。传感器软件也可与接入点和无线交换机捆绑提供。某些供应商还提供基于主机的无线\
  \ IDPS 传感器软件，可安装在站点（如笔记本电脑）上。传感器软件可检测站点范围内的站点错误配置和攻击。传感器软件还可能能够在站点上强制执行安全策略，例如限制对无线接口的访问。\n\
  \n##### 监控策略\n\n如果组织使用 WLAN，通常会部署无线传感器来监控组织 WLAN 的射频范围，这通常包括笔记本电脑和个人数字助理等移动组件。许多组织还使用传感器监控其设施中不应有\
  \ WLAN 活动的区域，以及组织 WLAN 不应使用的信道和频段，以此作为检测非法设备的一种方式。\n\n##### 无线 IDPS 安全功能\n\n无线 IDPS\
  \ 的主要优势包括在 WLAN 协议层面检测攻击、错误配置和策略违规，主要检查 IEEE 802.11 协议通信。无线 IDPS 的主要局限性在于它不检查更高层级的通信（例如\
  \ IP 地址和应用负载）。某些产品仅执行简单的基于特征的检测，而其他产品则结合使用基于特征、基于异常和有状态协议分析检测技术。\n\n无线 IDPS 传感器常见的检测事件类型主要包括：\n\
  \n*   未经授权的 WLAN 和 WLAN 设备\n*   安全防护薄弱的 WLAN 设备（例如，WLAN 设置错误配置）\n*   异常的 WLAN 使用模式（可能表明设备被攻陷或\
  \ WLAN 被未经授权使用）\n*   使用无线网络扫描器\n\n无线 IDPS 还可检测其他类型的攻击，如 DoS 状况，包括：\n\n*   逻辑攻击（例如，用大量消息使接入点过载）\n\
  *   物理攻击（例如，在 WLAN 频率上发射电磁能量，使 WLAN 无法使用）\n\n某些无线 IDPS 还能检测试图欺骗另一设备身份的 WLAN 设备。\n\
  \n###### 物理位置识别\n\n另一个显著优势是，大多数无线 IDPS 传感器可通过三角测量识别无线设备的物理位置——根据各传感器接收到的设备信号强度估算设备到多个传感器的大致距离，然后计算设备所在的物理位置（即到各传感器的估算距离）。手持式\
  \ IDPS 传感器也可用于精确定位设备位置，特别是在固定传感器不具备三角测量能力或设备正在移动的情况下。\n\n###### 防护准确性\n\n无线 IDPS\
  \ 通过提供更准确的防护，克服了其他类型 IDPS 的不足；这主要归功于其狭窄的关注焦点。基于异常的检测方法往往会产生大量误报，特别是在阈值未得到妥善维护时。虽然可能会因良性活动产生许多警报（例如另一个组织的\
  \ WLAN 在本组织 WLAN 的范围内），但这些警报并非真正的误报，因为它们准确地检测到了未知 WLAN。\n\n###### 调优与定制\n\n无线 IDPS\
  \ 技术需要一定的调优和定制以提高检测准确性。无线 IDPS 的主要工作在于指定哪些 WLAN、接入点和站点是受授权的，并将策略特征录入无线 IDPS 软件。由于无线\
  \ IDPS 仅检查无线网络协议，而不检查更高层级的协议（例如应用）；因此通常只有少数警报类型，相应地可用的定制或调优选项也不多。\n\n###### 入侵防护能力\n\
  \n无线 IDPS 传感器提供两类入侵防护能力，如下所示：\n\n*   某些传感器可通过空中终止连接，通常通过向端点发送消息，告知其解除当前会话关联，然后拒绝允许建立新连接。\n\
  *   另一种防护方法是传感器指示有线网络上的交换机，根据设备的媒体访问控制地址或交换机端口，阻断涉及特定设备的网络活动。然而，此技术仅对阻断设备在有线网络上的通信有效，对无线网络无效。\n\
  \n选择防护能力时，一个重要考量因素是防护动作对传感器监控的影响。例如，如果传感器正在发送信号以终止连接，它可能无法执行信道扫描来监控其他通信，直到完成防护动作。为缓解此问题，某些传感器配备两个无线电：一个用于监控和检测，另一个用于执行防护动作。\n\
  \n##### 无线 IDPS 局限性\n\n无线 IDPS 对未经授权的活动提供了强大的检测能力，但存在一些显著局限性。规避技术的使用被视为某些无线 IDPS\
  \ 传感器的局限性之一，特别是针对传感器信道扫描方案。例如是在当前未被监控的信道上以极短脉冲发动攻击。攻击者也可同时在两个信道上发动攻击。如果传感器检测到第一个攻击，除非它扫离第一个攻击的信道，否则无法检测到第二个攻击。\n\
  \n无线 IDPS 传感器（物理设备）本身也容易受到攻击。那些试图破坏 WLAN 的 DoS 攻击（无论逻辑还是物理）也会破坏传感器功能。此外，传感器通常特别容易受到物理攻击，因为它们通常位于走廊、会议室和其他开放区域。某些传感器具有防篡改功能，其外观设计得像火灾报警器，可降低被物理攻击的可能性。所有传感器都容易受到诸如干扰等物理攻击，这会破坏射频传输；除了在设施周围建立物理安全边界，使攻击者无法靠近到足以干扰\
  \ WLAN 的程度外，没有其他防御措施。\n\n\n\n\n\n###### 无线 IDPS 的局限性\n\n我们应该提到，无线 IDPS 无法检测针对无线网络的某些类型的攻击。攻击者可以被动监控无线流量，而这无法被无线\
  \ IDPS 检测到。如果使用了薄弱的安全方法，例如有线等效隐私，攻击者随后可以对收集到的流量进行离线处理，以找到用于保护无线流量安全的加密密钥。有了这个密钥，攻击者可以解密已经收集的流量，以及从同一\
  \ WLAN 收集的任何其他流量。由于无线 IDPS 无法检测针对无线网络的某些类型的攻击，因此它无法完全弥补使用不安全无线网络协议所带来的风险。\n\n####\
  \ NBA 系统\n\nNBA 系统检查网络流量或流量统计数据，以识别产生异常流量流的威胁，例如 DDoS 攻击、某些形式的恶意软件和策略违规。事实上，NBA\
  \ 系统曾有过许多名称，包括网络行为异常检测软件、NBA 和响应软件以及网络异常检测软件。NBA 解决方案通常包含传感器和控制台，部分产品还提供管理服务器（有时称为*分析器*）。\n\
  \n##### NBA 系统传感器\n\nNBA 系统拥有类似于基于网络的 IDPS 传感器的一些传感器，它们通过嗅探数据包来监控一个或几个网段上的网络活动。这些传感器可以是主动或被动的，其部署位置类似于基于网络的\
  \ IDS 传感器——位于网络之间的边界，使用相同的连接方式。其他 NBA 传感器不直接监控网络，而是依赖路由器和其他网络设备提供的网络流信息。流是指发生在主机之间的特定通信会话。典型的流数据包括源和目的\
  \ IP 地址、源和目的 TCP 或 UDP 端口或互联网控制消息协议类型和代码、会话中传输的数据包数量和字节数，以及会话开始和结束的时间戳。\n\n#####\
  \ NBA 系统安全功能\n\nNBA 技术可以检测多种类型的恶意活动。大多数 NBA 系统产品主要使用基于异常的检测，并结合一些有状态协议分析技术。因此，大多数\
  \ NBA 技术不提供基于特征的检测能力，除非允许管理员手动设置自定义过滤器，这些过滤器本质上是用于检测或阻止特定攻击的特征。NBA 传感器检测到的大多数授权活动类型包括基于网络的\
  \ DoS 攻击、网络扫描、蠕虫、意外应用服务的使用以及策略违规（例如，主机尝试联系另一台没有合法理由通信的主机）。NBA 传感器具备确定攻击源头的能力。例如，如果蠕虫感染了网络，NBA\
  \ 传感器可以分析蠕虫的流量，找出组织网络中最先传播蠕虫的主机。\n\n正如我们上面提到的，NBA 传感器基于异常检测，因此它们主要通过检测与正常行为的显著偏差来工作；它们在检测短时间内产生大量网络活动的攻击（例如\
  \ DDoS 攻击）和具有异常流模式的攻击（例如蠕虫在主机间传播）时最为准确。缓慢进行的攻击不太可能被 NBA 传感器准确检测到，因为在攻击活动达到与预期显著不同的程度之前，它们无法检测到许多攻击。NBA\
  \ 软件检测到攻击的时点可能因 NBA 产品的配置而有很大差异。将传感器配置为对异常活动更敏感，会在攻击发生时更快地生成警报，但也更有可能触发更多误报。反之，如果将传感器配置为对异常活动不那么敏感，误报会减少，但警报生成会变慢，导致攻击持续更长时间。环境中的良性变化也可能导致误报。例如，如果向主机添加了新服务且主机开始使用它，NBA\
  \ 传感器很可能会将其检测为异常行为。\n\nNBA 技术主要依赖于观察网络流量并建立预期流的基线和主机特征清单。NBA 产品提供对其基线的自动更新，从而加快对未授权活动的预防。管理员可能会定期调整阈值（例如，多少额外的带宽使用量应触发警报），以考虑环境的变化。\n\
  \n我们之前提到过 NBA 系统基于异常检测，但少数 NBA 产品提供有限的基于特征的检测能力。支持的特征往往非常简单，主要是在 IP、TCP、UDP 或互联网控制消息协议头部的特定字段中查找特定值。基于特征的能力对内联\
  \ NBA 传感器最有帮助，因为它们可以利用特征查找并阻止防火墙或路由器可能无法阻止的攻击。然而，即使没有特征能力，内联 NBA 传感器也可能因其流模式而能够检测并阻止攻击。\n\
  \n##### NBA 信息收集能力\n\nNBA 技术凭借广泛的信息收集能力超越了其他技术，因为大多数 NBA 产品的检测技术都需要了解组织主机的特征。此外，NBA\
  \ 传感器可以自动创建并维护在组织受监控网络上通信的主机列表。它们可以监控端口使用情况，执行被动指纹识别，并使用其他技术收集主机的详细信息。通常为每台主机收集的信息包括\
  \ IP 地址、操作系统的类型和版本、主机提供的网络服务，以及主机与其他主机通信的性质。NBA 传感器持续监控网络活动中该信息的变化。每台主机流的附加信息也会持续收集。\n\
  \n##### NBA 入侵防御能力\n\nNBA 传感器提供各种入侵防御能力，包括向端点发送 TCP 重置数据包、执行内联防火墙操作以及重新配置其他网络安全设备。大多数\
  \ NBA 系统实施有限地使用防御能力或根本不使用，这是由于误报的原因；错误地阻断单个流可能会导致网络通信中断。防御能力最常用于 NBA 传感器阻断特定已知攻击时，例如新型蠕虫。\n\
  \n\n\n\n\n##### NBA 系统局限性\n\nNBA 技术总体上对授权活动具有很强的预防能力，但也存在显著的局限性。其中最重要的局限性之一是检测攻击的延迟。基于偏离基线的异常检测方法（如带宽使用量增加或连接尝试增加）固有地存在一定的延迟。通常，NBA\
  \ 技术往往因其数据源而产生额外的延迟，特别是当它们依赖来自路由器和其他网络设备的流数据时。这些数据通常以批次形式传输到 NBA 系统，频率高达每一两分钟一次，但通常频率要低得多。因此，这种延迟被视为\
  \ NBA 技术的一个重大局限性，因为发生迅速的攻击（如恶意软件感染和 DoS 攻击）可能在已经扰乱或损坏系统后才被检测到。为了解决延迟问题，NBA 系统可以使用传感器（软件或硬件组件），它们执行自己的数据包捕获和分析，而不是依赖来自其他设备的流数据。然而，执行数据包捕获和分析比分析流数据消耗更多资源。单个传感器可以分析来自许多网络的流数据，或通常最多只能对几个网络执行直接监控（数据包捕获）。可能需要更多的传感器来执行直接监控，而不是使用流数据。\n\
  \n#### 基于主机的 IDPS\n\n基于主机的系统监控单个主机的特征以及发生在该主机内的事件，以发现可疑活动。基于主机的 IDPS 可能监控的主机特征类型示例包括：该主机的网络流量、系统日志、运行中的进程、应用程序活动、文件访问和修改，以及系统和应用程序配置更改。基于主机的\
  \ IDPS 最常部署在关键主机上，如公开访问的服务器和包含敏感信息的服务器。此外，大多数基于主机的 IDPS 在相关主机上安装了称为 `agents` 的检测软件。每个代理监控单个主机上的活动，并可能执行预防操作。一些代理监控单个特定的应用程序服务——例如，Web\
  \ 服务器程序；这些代理也称为 `application-based IDPSs`（基于应用程序的 IDPS）。\n\n基于主机的 IDPS 代理部署在关键主机上，如公开访问的服务器和包含敏感信息的服务器，尽管它们也可以部署在其他类型的主机上。一些组织主要使用代理来分析其他安全控制无法监控的活动。例如，基于网络的\
  \ IDPS 传感器无法分析加密网络通信内的活动，但安装在端点上的基于主机的 IDPS 代理可以看到未加密的活动。基于主机的 IDPS 部署的网络架构通常很简单。由于代理部署在组织网络上的现有主机上，组件通常通过这些网络进行通信，而不是使用单独的管理网络。\n\
  \n为了提供更准确的入侵预防能力，大多数 IDPS 代理会改变主机的内部架构。这通常通过 `shim`（垫片/中间层）完成，它是放置在现有代码层之间的一层代码。`shim`\
  \ 在数据通常从一段代码传递到另一段代码的点上拦截数据。然后 `shim` 可以分析数据并确定是允许还是拒绝。基于主机的 IDPS 代理可能将 `shim` 用于多种资源类型，包括网络流量、文件系统活动、系统调用、Windows\
  \ 注册表活动和常见应用程序（如电子邮件和 Web）。一些代理在不使用 `shim` 的情况下监控活动，或分析活动的痕迹，如日志条目和文件修改。虽然这些方法对主机的侵入性较小，但它们在检测攻击方面通常效果较差，且往往无法执行预防操作。\n\
  \n##### 基于主机的 IDPS 安全能力\n\n基于主机的 IDPS 对多种恶意活动提供良好的预防。基于主机的 IDPS 通常使用组合（基于特征和基于异常）机制。基于特征的机制用于识别已知攻击，而基于异常的机制用于识别先前未知的攻击。\n\
  \n基于主机的 IDPS 检测到的事件类型有很多，但这种检测基于 IDPS 使用的检测技术。一些基于主机的 IDPS 产品提供多种此类检测技术，而另一些则专注于少数或单一技术。基于主机的\
  \ IDPS 中常用的一些具体技术如下：\n\n###### 代码分析\n\n代理可能会分析执行恶意代码的尝试。一种技术是在虚拟环境或沙箱中执行代码，以分析其行为并将其与已知良性和恶意行为的配置文件进行比较。另一种技术是寻找栈和堆缓冲区溢出利用的典型特征，如特定的指令序列和尝试访问未分配给该进程的内存部分。系统调用监控是另一种常用技术；它涉及了解哪些应用程序和进程应该执行特定操作。\n\
  \n###### 网络流量分析\n\n这通常类似于基于网络的 IDPS 所做的工作。一些产品还可以分析无线流量。流量分析的另一个功能是代理可以提取由电子邮件、Web\
  \ 和点对点文件共享等应用程序发送的文件，随后可以对这些文件进行恶意软件检查。\n\n###### 网络流量过滤\n\n代理通常包含基于主机的防火墙，可限制系统上每个应用程序的入站和出站流量，防止未经授权的访问和可接受使用策略违规（例如，使用不当的外部服务）。\n\
  \n###### 文件系统监控\n\n可以使用多种不同技术来执行。文件完整性检查涉及为关键文件生成加密校验和，并将其与参考值进行比较，以识别哪些文件已被更改。文件属性检查是检查关键文件的安全属性（如所有权和权限）是否发生变化的过程。文件完整性检查和文件属性检查都是被动的，仅在攻击发生后检测到攻击。一些代理具有更主动的能力，例如监控文件访问尝试，将每次尝试与访问控制策略进行比较，并阻止违反策略的尝试。\n\
  \n###### 日志分析\n\n一些代理可以监控和分析操作系统和应用程序日志，以识别恶意活动。这些日志可能包含系统操作事件、审计记录和应用程序操作事件的信息。\n\
  \n由于基于主机的 IDPS 提供了关于主机特征和配置的广泛知识，代理通常可以确定如果不加阻止，攻击是否会成功。代理可以利用这些知识来选择预防操作并确定警报的优先级。\n\
  \n\n\n\n\n与其他 IDPS 技术一样，基于主机的 IDPS 经常会产生误报和漏报。然而，对于基于主机的 IDPS 而言，检测准确性更具挑战性，因为它们检测的是事件，却不具备事件发生时上下文环境的知识。例如，可能安装了一个新应用程序——这可能是恶意活动所为，也可能是正常主机操作的一部分。如果没有额外的上下文，无法确定该事件是良性还是恶意的。因此，建议打算使用基于主机的\
  \ IDPS 的组织，采用结合多种检测技术的基于主机的产品，这类产品比仅使用一项或少数几项技术的产品能实现更准确的检测。由于每种技术可监控主机的不同侧面，使用更多技术能让代理对事件有更完整的了解，包括额外的上下文。\n\
  \n要使基于主机的 IDPS 实现更好的防护，需要进行大量的调优和定制。例如，许多产品依赖于观察主机活动并建立预期行为的配置文件。其他产品则需要配置详细的策略，精确定义主机上每个应用程序应如何表现。随着主机环境的变化，策略需要更新，以便将这些变化纳入考量。某些产品允许在一台主机上为多个环境配置多个策略；这主要有助于在多个环境中运行的主机，例如既在组织内部又在外部位置使用的笔记本电脑。\n\
  \n基于主机的 IDPS 代理根据其使用的检测技术，提供多种入侵防护能力。例如，代码分析技术可防止恶意代码被执行，网络流量分析技术可阻止传入流量被主机处理，并防止恶意文件被放置在主机上。网络流量过滤技术可阻断不需要的通信。文件系统监控可防止文件被访问、修改、替换或删除，这能阻止恶意软件（包括特洛伊木马和\
  \ Rootkit）的安装，以及涉及不当文件访问的其他攻击。其他基于主机的 IDPS 检测技术，如日志分析、网络配置监控、文件完整性和属性检查，通常不支持防护动作，因为它们是在事件发生后才识别出事件。\n\
  \n##### 基于主机的 IDPS 局限性\n\n基于主机的 IDPS 也存在一些显著的局限性。尽管代理会针对大多数检测技术实时生成警报，但某些技术是定期用于识别已经发生的事件。此类技术可能每小时甚至每天仅应用几次，导致识别某些事件出现显著延迟。此外，许多基于主机的\
  \ IDPS 旨在定期（例如每 15-60 分钟）将其警报数据转发给管理服务器，以减少开销。这可能导致启动响应动作出现延迟，尤其会增加传播迅速的事件（如恶意软件感染）的影响。基于主机的\
  \ IDPS 会消耗受保护主机上大量的资源，特别是如果它们使用多种检测技术和 Shim（垫片/中间层）时。基于主机的 IDPS 还可能与现有的安全控制（如个人防火墙）产生冲突，特别是当这些控制也使用\
  \ Shim 来拦截主机活动时。\n\n### 6.3.6 多种 IDPS 的集成\n\n多种 IDPS 技术及不同 IDPS 产品的集成为组织提供了良好的防护机制。我们将在以下章节详细讨论集成的优势。\n\
  \n#### 多种 IDPS 技术\n\n我们之前提到过，主要有四种类型的 IDPS 技术：基于网络的、无线的、NBA 和基于主机的。这些类型各自拥有不同于其他类型的防护能力，可针对未经授权的活动。例如，某些类型能检测到其他类型无法检测到的攻击。因此，尽可能多地检测攻击将带来更好的防御。相应地，使用多种类型的\
  \ IDPS 技术能实现对恶意活动更全面、更准确的检测和防护。对于大多数环境，至少需要基于网络的和基于主机的 IDPS 相结合。如果 WLAN 安全或非法 WLAN\
  \ 检测是关注点，则可能还需要无线 IDPS。还可以部署 NBA 产品，以针对 DoS 攻击、蠕虫以及导致异常网络流的其他威胁，实现更强的检测能力。\n\n事实上，一些组织使用同一\
  \ IDPS 技术类型的多个产品，以获得对恶意活动更多的防护和检测。因为每个产品都能检测到其他产品无法检测到的攻击。因此，使用多个产品能提供更全面、更准确的防御。对于打算使用同一\
  \ IDPS 技术类型的多个产品的组织，我们建议它们为多个产品使用一台监控设备。一台监控设备便于分析师确认警报的有效性并识别误报，同时也提供了冗余。使用多台监控设备将导致难以分析的场景，并消耗时间和资源。\n\
  \n#### 不同 IDPS 产品的集成\n\n不同的 IDPS 产品完全独立运行。使用不同 IDPS 产品最重要的优势之一是，如果其中一个被攻破或失效，另一个不会受影响，这意味着仍有其他产品提供针对恶意活动的防御。然而，如果产品未集成，整个\
  \ IDPS 实施的有效性可能会受到一定限制。产品间无法共享数据，且监控和管理多套产品将需要额外的工作量。IDPS 产品可以直接或间接集成。\n\n### 6.3.7\
  \ IDPS 产品\n\n上述所有章节均关注 IDPS。上述概念的实施将产出 IDPS 产品。世界上有许多 IDPS 产品，每个产品相较于其他产品都有其优势。因此，在本节中，我们列举其中一些产品，以便研究人员了解这些产品、使用它们、修改其开源代码，并为研究启动新的\
