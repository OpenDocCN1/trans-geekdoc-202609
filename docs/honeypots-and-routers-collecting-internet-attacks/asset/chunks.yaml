    *   12. G. Stoneburner，NIST 特别出版物 800-33：信息技术安全的底层技术模型，美国国家标准与技术研究院建议，马里兰州盖茨堡，2001
    年 12 月。


    # 3 入侵与漏洞


    **HABIB-UR REHMAN**


    由于大部分物理基础设施公开可访问且由用户共享，保障通信及其内容的安全是计算机网络中的一项重要关注点。这一事实使得我们在第 2 章中描述的所有安全目标都发挥了作用。此外，我们在第
    1 章中回顾了，用于在端主机之间传递消息的大多数协议都是公开的。因此，每个人都知道传输消息时将执行的动作序列，并可能利用这些知识攻击正在进行的通信。这绝不意味着计算机网络中没有任何安全可言；协议已演进以克服此类缺陷。然而，计算机网络（尤其是互联网）的服务模型是以一种无法消除所有弱点的方式开发或演进的。


    入侵者利用系统的漏洞发起攻击；这使得系统管理员和合法用户极其有必要充分了解这些漏洞。如果设计和配置不当，网络、主机以及运行在主机上的应用程序都可能被滥用。本章旨在突出这三个层面的此类问题。我们试图编制一份已知常见攻击的综合清单。


    ## 3.1 网络与协议漏洞


    公开协议及其漏洞确实是计算机网络中攻击的最大来源。本节讨论超文本标记语言 (HTTP) 等协议上可能发生的常见攻击。


    ### 3.1.1 HTTP 标志抓取


    万维网是一项公共服务；因此，运行 Web 服务器的主机被配置为允许任何针对 80 端口（Web 服务的知名端口）的传入请求。HTTP 是用于 Web 服务的协议，旨在用
    HTTP 响应消息回复每一个 HTTP 请求消息。通常，此响应消息包含主/默认页面（多半命名为 index^(⁹) ![图 3.1 典型 HTTP 响应消息。](img/pg46_1.jpg)


    **图 3.1** 典型 HTTP 响应消息。


    标志抓取被归类为攻击前^(¹⁰)


    这种标志抓取攻击也适用于电子邮件消息，接收到的电子邮件的头部也包含含有重要信息的字段。然而，电子邮件场景不同于 HTTP 场景，因为只有手头有电子邮件时才能进行此类分析。


    *SMTP 枚举*。然而，在用于将电子邮件传递到邮件服务器的 SMTP 协议中，入侵者可以通过 Telnet 提示符等接口使用 `VRFY`、`EXPN`
    和 `RCPT TO` 命令来识别哪些电子邮件地址是有效的，哪些是无效的。因此，入侵者可以建立一个有效电子邮件地址列表，稍后可用于垃圾消息发送等恶意活动。


    ### 3.1.2 HTTP 隧道


    隧道技术是计算机网络中的一个重要概念，即将一种协议的数据包封装在另一种协议的数据包内。当隐藏/内层数据包的协议不被底层网络支持时，通常会采用这种方法；这可能是由于管理限制、协议不兼容或设备限制。隧道技术增加了网络的效用，因为它即使在存在不兼容的情况下也能实现通信。例如，通过建立端到端的
    IPv4 隧道，或根据需求建立较少跳数的隧道，可以在通过不支持 IPv6 的设备（部分或全部）连接的端主机之间共享 IPv6 数据报。隧道技术可在任何层或协议上执行。然而，HTTP
    隧道是一个主要关注点，因为 HTTP 消息极少被过滤或阻断^(¹¹)


    HTTP 隧道是通过使用设计为通过 HTTP 通信的软件来执行的。该软件的客户端组件安装在用户^(¹²)


    ### 3.1.3 TCP 扫描

