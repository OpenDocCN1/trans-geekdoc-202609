- raw: "        9.  *Similar to workstation:* The GSX server is a supported product,\
    \ including patches and upgrades.\n\n        Some disadvantages are as follows:\n\
    \n        1.  *Cost:* A GSX server license will run around $3500 (again, cost\
    \ may vary over time, please check for the latest).\n\n        2.  *Limited types\
    \ of guest OSs:* OSs like Solaris X86 and FreeBSD are not officially supported\
    \ (however, you may be able to install them). This can limit the diversity of\
    \ your honeynet.\n\n        3.  *Memory hog:* The GSX server recommends greater\
    \ than 256 MB just to run the GSX server software. GUI-based OSs, such as Windows\
    \ XP, require another 256 MB for each instance.\n\n        4.  *Closed source:*\
    \ Just like workstation.\n\n        5.  *Fingerprinting:* It may be possible to\
    \ fingerprint the VMware software on a honeypot, especially if the *VMware tools*\
    \ are installed on the systems. This could expose the honeypots to the hackers.\
    \ However, like workstation, there are configuration options that can reduce that\
    \ risk.\n\n        VMware also makes a VMware ESX server. Instead of being just\
    \ a software solution, the ESX server runs in hardware of the interface. It provides\
    \ its own VM OS monitor that takes over the host hardware. This allows more granular\
    \ control of resources allocated to VMs, such as CPU shares, network bandwidth\
    \ shares, and disk bandwidth shares and it allows those resources to be changed\
    \ dynamically. This product is even higher end than the GSX server.\n\n      \
    \  Some of its features are it can support multiple processors, more concurrent\
    \ VMs (up to 64 VMs), more host memory (up to 64 GB), and more memory per VM (up\
    \ to 3.6 GB) than the GSX server.\n\n        *User-mode Linux*. UML is a special\
    \ kernel module that allows you to run many virtual versions of Linux at the same\
    \ time. Developed by Jeff Dike, UML gives you the ability to have multiple instances\
    \ of Linux, running on the same system at the same time. It is a relatively new\
    \ tool with great amounts of potential. You can learn in detail how to deploy\
    \ your own UML honeynet from the paper *Know Your Enemy: Learning with User-Mode\
    \ Linux*. Some advantages of using UML are as follows:\n\n        1.  It is free\
    \ and open source; you have access to the source code.\n\n        2.  It has small\
    \ footprint and fewer resource requirements. UML does not need to use X. It can\
    \ also run extensive amount of systems with little memory.\n\n        3.  It has\
    \ the ability to create several virtual networks and even create virtual routers\
    \ all inside the original virtual network.\n\n        4.  It supports both bridging\
    \ and networking, similar to VMware.\n\n        5.  UML has the ability to log\
    \ keystrokes through the guest OS kernel. The keystrokes are logged right on the\
    \ host OS, so there are no issues with how to get the keystrokes off the honeypot\
    \ in a stealth way.\n\n        6.  UML comes with preconfigured downloadable file\
    \ systems, making it fast and easy to populate your honeynet with honeypots. Like\
    \ VMware, these file system images are mountable.\n\n        7.  You can access\
    \ UML consoles in a wide variety of ways, including through pseudoterminals, xterms,\
    \ and portals on the host, which you can Telnet to. And there is always screen.\
    \ Run UML inside screen, detach it, and you can log in to the host from anywhere\
    \ and attach it back.\n\n        Some disadvantages are as follows:\n\n      \
    \  1.  It currently supports only Linux VM; however, a port to Windows is under\
    \ development.\n\n        2.  As a new tool, there are some bugs, documentation,\
    \ and security issues.\n\n        3.  There is no GUI; currently, all configurations\
    \ and implementations are done at the command line.\n\n        4.  As an open\
    \ source tool, there is no official or commercial support.\n\n        5.  Similar\
    \ to VMware, it may be possible to fingerprint a UML honeynet due to the virtualization\
    \ software.\n\n        ## **5.6 Conclusion**\n\n        Before concluding this\
    \ chapter, it should be clarified that honeypots do not do the same functions\
    \ as an IDS does. Yes, they have some similarities but from the operational point\
    \ of view, they are fairly different. For example, if we would like to devise\
    \ a good IDS for a network, we must collect valuable data about attacks, then\
    \ analyze these attacks to generate signatures for them, then we have to use these\
    \ signatures in the IDS. Honeypots, on the other hand, are good tools to collect\
    \ valuable data but they are set up for being attacked by the potential attackers.\
    \ A honeypot is not a usual defense mechanism meant for protecting a system, but\
    \ an IDS is a core part of the defense system or strategy. Honeypots are often\
    \ deployed for collecting valuable information about the attackers that could\
    \ be analyzed and used for developing appropriate countermeasures, while IDS simply\
    \ implements a set of rules based on which it detects whether there is any rogue\
    \ entity that enters into the network and then it asks for purging it out.\n\n\
    \        ## References\n\n        *   [1.](#10_Chapter05.xhtml#rfn1) L. Spitzner,\
