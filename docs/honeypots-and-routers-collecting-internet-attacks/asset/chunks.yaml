    Detection and Prevention Systems (IDPS)*, National Institute of Standards and
    Technology Special Publication 800-94, 127 pages, February 2007, [csrc.nist.gov/publications/nistpubs/800-94/SP800-94.pdf](http://csrc.nist.gov/publications/nistpubs/800-94/SP800-94.pdf),
    last accessed August 11, 2012.

    *   [3](#11_Chapter06.xhtml#rfn3) A. Abduvaliyev, A.-S.K. Pathan, J. Zhou, R.
    Roman, and W.-C. Wong, *Intrusion detection and prevention in wireless sensor
    networks*, Wireless Sensor Networks: Current Status and Future Trends, Eds., Shafiullah
    Khan, Al-Sakib Khan Pathan, and Nabil Ali Alrajeh, CRC Press, Boca Raton, FL,
    2012.

    *   [4](#11_Chapter06.xhtml#rfn4) J.R. Vacca, *Managing Information Security*,
    1st edition, Syngress, Elsevier, Waltham, MA, March 29, 2010.

    *   [5](#11_Chapter06.xhtml#rfn5) K.K. Frederick, *Network Intrusion Detection
    Signatures, Part Three*, Security Focus, 2002, [http://www.symantec.com/connect/articles/network-intrusion-detection-signatures-part-three](http://www.symantec.com/connect/articles/network-intrusion-detection-signatures-part-three),
    last accessed August 11, 2012.

    *   [6](#11_Chapter06.xhtml#rfn6) R. Bace, *Intrusion Detection*, New Riders,
    Indianapolis, IN, 2000.

    *   [7](#11_Chapter06.xhtml#rfn7) K.K. Frederick, *Network Intrusion Detection
    Signatures, Part Five*, SecurityFocus, 2002, [http://www.symantec.com/connect/articles/network-intrusion-detection-signatures-part-five](http://www.symantec.com/connect/articles/network-intrusion-detection-signatures-part-five),
    last accessed August 11, 2012.

    *   [8](#11_Chapter06.xhtml#rfn8) A.-S.K. Pathan, M.M. Monowar, and Z.M. Fadlullah,
    *Building Next-Generation Converged Networks: Theory and Practice*, CRC Press,
    Boca Raton, FL, 2013.

