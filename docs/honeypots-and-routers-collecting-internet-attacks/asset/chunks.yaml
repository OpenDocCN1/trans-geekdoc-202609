    \ are only a few alert types, and consequently not many customizations or tunings\
    \ are available.\n\n        Wireless IDPS sensors provide two types of intrusion\
    \ prevention capabilities, which are as follows \\[\n\n        *   Some sensors\
    \ can terminate connections through the air, typically by sending messages to\
    \ the end points telling them to dissociate the current session and then refusing\
    \ to permit a new connection to be established.\n\n        *   Another prevention\
    \ method is for a sensor to instruct a switch on the wired network to block network\
    \ activity involving a particular device on the basis of the device’s media access\
    \ control address or switch port. However, this technique is only effective for\
    \ blocking the device’s communications on the wired network, not the wireless\
    \ network.\n\n        An important consideration when choosing prevention capabilities\
    \ is the effect that prevention actions can have on sensor monitoring. For example,\
    \ if a sensor is transmitting signals to terminate connections, it may not be\
    \ able to perform channel scanning to monitor other communications until it has\
    \ completed the prevention action. To mitigate this, some sensors have two radios:\
    \ one for monitoring and detection and another for performing prevention actions.\n\
    \n        *Wireless IDPS limitations*. The wireless IDPSs offer great detection\
    \ capabilities against authorized activities, but there are some significant limitations.\
    \ The use of evasion techniques is considered as one of the limitations of some\
    \ wireless IDPS sensors, particularly against sensor channel scanning schemes.\
    \ One example is performing attacks in very short bursts on channels that are\
    \ not currently being monitored. An attacker could also launch attacks on two\
    \ channels at the same time. If the sensor detects the first attack, it cannot\
    \ detect the second attack unless it scans away from the channel of the first\
    \ attack.\n\n        Wireless IDPS sensors (physical devices) are also vulnerable\
    \ to attack. The same DoS attacks (both logical and physical) that attempt to\
    \ disrupt WLANs can also disrupt sensor functions. Additionally, sensors are often\
    \ particularly vulnerable to physical attacks because they are usually located\
    \ in hallways, conference rooms, and other open areas. Some sensors have antitamper\
    \ features, which are designed to look like fire alarms that can reduce the possibility\
    \ of physically being attacked. All sensors are vulnerable to physical attacks\
    \ such as jamming, which disrupt radio-frequency transmissions; there is no defense\
    \ against such attacks other than to establish a physical perimeter around the\
    \ facility, so that the attackers cannot get close enough to the WLAN to jam it."
  fmt: '

    # Wireless Network Security: WLANs, Sensors, and IDPS


    ## WLAN Architecture and Modes


    Some WLANs also use wireless switches, which act as intermediaries between access
    points and the wired network. A network based on stations and access points is
    configured in **infrastructure mode**; a network that does not use an access point,
    in which stations connect directly to each other, is configured in an **ad hoc
    mode**. Nearly all organizational WLANs use infrastructure mode. Each access point
    in a WLAN has a name assigned to it called a `service set identifier` (SSID).
    The service set identifier allows stations to distinguish one WLAN from another.


    ## Wireless Sensor Types and Deployment


    Wireless sensors have several available forms. A dedicated sensor is usually passive,
    performing wireless IDPS functions but not passing traffic from source to destination.
    Dedicated sensors may be designed for fixed or mobile deployment, with mobile
    sensors used primarily for auditing and incident handling purposes (e.g., to locate
    rogue wireless devices). Sensor software is also available bundled with access
    points and wireless switches. Some vendors also have host-based wireless IDPS
    sensor software that can be installed on stations, such as laptops. The sensor
    software detects station misconfigurations and attacks within the range of the
    stations. The sensor software may also be able to enforce security policies on
    the stations, such as limiting access to wireless interfaces.


    ## Monitoring Strategies


    If an organization uses WLANs, it most often deploys wireless sensors to monitor
    the radiofrequency range of the organization''s WLANs, which often includes mobile
    components such as laptops and personal digital assistants. Many organizations
    also use sensors to monitor areas of their facilities where there should be no
    WLAN activity, as well as channels and bands that the organization''s WLANs should
    not use, as a way of detecting rogue devices.


    ## Wireless IDPS Security Capabilities


    The main advantages of wireless IDPSs include detection of attacks, misconfigurations,
    and policy violations at the WLAN protocol level, primarily examining IEEE 802.11
    protocol communication. The major limitation of a wireless IDPS is that it does
    not examine communications at higher levels (e.g., IP addresses and application
    payloads). Some products perform only simple signature-based detection, whereas
    others use a combination of signature-based, anomaly-based, and stateful protocol
    analysis detection techniques.


    Most of the types of events commonly detected by wireless IDPS sensors include:


    *   Unauthorized WLANs and WLAN devices

    *   Poorly secured WLAN devices (e.g., misconfigured WLAN settings)

    *   Unusual WLAN usage patterns (which could indicate a device compromise or unauthorized
    use of the WLAN)

    *   Use of wireless network scanners


    Other types of attacks such as DoS conditions can also be detected by wireless
    IDPSs, including:


    *   Logical attacks (e.g., overloading access points with large numbers of messages)

    *   Physical attacks (e.g., emitting electromagnetic energy on the WLAN''s frequencies
    to make the WLAN unusable)


    Some wireless IDPSs can also detect a WLAN device that attempts to spoof the identity
    of another device.


    ### Physical Location Identification


    Another significant advantage is that most wireless IDPS sensors can identify
    the physical location of a wireless device by using triangulation—estimating the
    device''s approximate distance from multiple sensors from the strength of the
    device''s signal received by each sensor, then calculating the physical location
    at which the device would be, the estimated distance from each sensor. Handheld
    IDPS sensors can also be used to pinpoint a device''s location, particularly if
    fixed sensors do not offer triangulation capabilities or if the device is moving.


    ### Prevention Accuracy


    Wireless IDPS overcome the other types of IDPS by providing more accurate prevention;
    this is largely due to its narrow focus. Anomaly-based detection methods often
    generate high false positives, especially if threshold values are not properly
    maintained. Although many alerts based on benign activities might occur, such
    as another organization''s WLAN being within the range of the organization''s
    WLANs, these alerts are not truly false positives because they are accurately
    detecting an unknown WLAN.


    ### Tuning and Customization


    Some tuning and customization are required for the wireless IDPS technologies
    to improve their detection accuracy. The main effort required in the wireless
    IDPS is in specifying which WLANs, access points, and stations are authorized,
    and in entering the policy characteristics into the wireless IDPS software. As
    wireless IDPSs only examine wireless network protocols, not the higher-level protocols
    (e.g., applications); generally, there are only a few alert types, and consequently
    not many customizations or tunings are available.


    ### Intrusion Prevention Capabilities


    Wireless IDPS sensors provide two types of intrusion prevention capabilities,
    which are as follows:


    *   Some sensors can terminate connections through the air, typically by sending
    messages to the end points telling them to dissociate the current session and
    then refusing to permit a new connection to be established.

    *   Another prevention method is for a sensor to instruct a switch on the wired
    network to block network activity involving a particular device on the basis of
    the device''s media access control address or switch port. However, this technique
    is only effective for blocking the device''s communications on the wired network,
    not the wireless network.


    An important consideration when choosing prevention capabilities is the effect
    that prevention actions can have on sensor monitoring. For example, if a sensor
    is transmitting signals to terminate connections, it may not be able to perform
    channel scanning to monitor other communications until it has completed the prevention
    action. To mitigate this, some sensors have two radios: one for monitoring and
    detection and another for performing prevention actions.


    ## Wireless IDPS Limitations


    The wireless IDPSs offer great detection capabilities against authorized activities,
    but there are some significant limitations. The use of evasion techniques is considered
    as one of the limitations of some wireless IDPS sensors, particularly against
    sensor channel scanning schemes. One example is performing attacks in very short
    bursts on channels that are not currently being monitored. An attacker could also
    launch attacks on two channels at the same time. If the sensor detects the first
    attack, it cannot detect the second attack unless it scans away from the channel
    of the first attack.


    Wireless IDPS sensors (physical devices) are also vulnerable to attack. The same
    DoS attacks (both logical and physical) that attempt to disrupt WLANs can also
    disrupt sensor functions. Additionally, sensors are often particularly vulnerable
    to physical attacks because they are usually located in hallways, conference rooms,
    and other open areas. Some sensors have antitamper features, which are designed
    to look like fire alarms that can reduce the possibility of physically being attacked.
    All sensors are vulnerable to physical attacks such as jamming, which disrupt
    radio-frequency transmissions; there is no defense against such attacks other
    than to establish a physical perimeter around the facility, so that the attackers
    cannot get close enough to the WLAN to jam it.

    '
  trans: '

    # 无线网络安全：WLAN、传感器与 IDPS


    ## WLAN 架构与模式


    某些 WLAN 还会使用无线交换机，它们充当接入点与有线网络之间的中介。基于站点和接入点的网络配置为**基础设施模式**；不使用接入点、站点直接相互连接的网络配置为**自组网模式**。几乎所有组织的
    WLAN 都使用基础设施模式。WLAN 中的每个接入点都会被分配一个名称，称为 `service set identifier` (SSID)。服务集标识符允许站点将一个
    WLAN 与另一个 WLAN 区分开来。


    ## 无线传感器类型与部署


    无线传感器有多种可用形式。专用传感器通常是被动的，执行无线 IDPS 功能，但不转发从源到目的地的流量。专用传感器可设计为固定部署或移动部署，移动传感器主要用于审计和事件处理目的（例如，定位非法无线设备）。传感器软件也可与接入点和无线交换机捆绑提供。某些供应商还提供基于主机的无线
    IDPS 传感器软件，可安装在站点（如笔记本电脑）上。传感器软件可检测站点范围内的站点错误配置和攻击。传感器软件还可能能够在站点上强制执行安全策略，例如限制对无线接口的访问。


    ## 监控策略


    如果组织使用 WLAN，通常会部署无线传感器来监控组织 WLAN 的射频范围，这通常包括笔记本电脑和个人数字助理等移动组件。许多组织还使用传感器监控其设施中不应有
    WLAN 活动的区域，以及组织 WLAN 不应使用的信道和频段，以此作为检测非法设备的一种方式。


    ## 无线 IDPS 安全功能


    无线 IDPS 的主要优势包括在 WLAN 协议层面检测攻击、错误配置和策略违规，主要检查 IEEE 802.11 协议通信。无线 IDPS 的主要局限性在于它不检查更高层级的通信（例如
    IP 地址和应用负载）。某些产品仅执行简单的基于特征的检测，而其他产品则结合使用基于特征、基于异常和有状态协议分析检测技术。


    无线 IDPS 传感器常见的检测事件类型主要包括：


    *   未经授权的 WLAN 和 WLAN 设备

    *   安全防护薄弱的 WLAN 设备（例如，WLAN 设置错误配置）

    *   异常的 WLAN 使用模式（可能表明设备被攻陷或 WLAN 被未经授权使用）

    *   使用无线网络扫描器


    无线 IDPS 还可检测其他类型的攻击，如 DoS 状况，包括：


    *   逻辑攻击（例如，用大量消息使接入点过载）

    *   物理攻击（例如，在 WLAN 频率上发射电磁能量，使 WLAN 无法使用）


    某些无线 IDPS 还能检测试图欺骗另一设备身份的 WLAN 设备。


    ### 物理位置识别


    另一个显著优势是，大多数无线 IDPS 传感器可通过三角测量识别无线设备的物理位置——根据各传感器接收到的设备信号强度估算设备到多个传感器的大致距离，然后计算设备所在的物理位置（即到各传感器的估算距离）。手持式
    IDPS 传感器也可用于精确定位设备位置，特别是在固定传感器不具备三角测量能力或设备正在移动的情况下。


    ### 防护准确性


    无线 IDPS 通过提供更准确的防护，克服了其他类型 IDPS 的不足；这主要归功于其狭窄的关注焦点。基于异常的检测方法往往会产生大量误报，特别是在阈值未得到妥善维护时。虽然可能会因良性活动产生许多警报（例如另一个组织的
    WLAN 在本组织 WLAN 的范围内），但这些警报并非真正的误报，因为它们准确地检测到了未知 WLAN。


    ### 调优与定制


    无线 IDPS 技术需要一定的调优和定制以提高检测准确性。无线 IDPS 的主要工作在于指定哪些 WLAN、接入点和站点是受授权的，并将策略特征录入无线 IDPS
    软件。由于无线 IDPS 仅检查无线网络协议，而不检查更高层级的协议（例如应用）；因此通常只有少数警报类型，相应地可用的定制或调优选项也不多。


    ### 入侵防护能力


    无线 IDPS 传感器提供两类入侵防护能力，如下所示：


    *   某些传感器可通过空中终止连接，通常通过向端点发送消息，告知其解除当前会话关联，然后拒绝允许建立新连接。

    *   另一种防护方法是传感器指示有线网络上的交换机，根据设备的媒体访问控制地址或交换机端口，阻断涉及特定设备的网络活动。然而，此技术仅对阻断设备在有线网络上的通信有效，对无线网络无效。


    选择防护能力时，一个重要考量因素是防护动作对传感器监控的影响。例如，如果传感器正在发送信号以终止连接，它可能无法执行信道扫描来监控其他通信，直到完成防护动作。为缓解此问题，某些传感器配备两个无线电：一个用于监控和检测，另一个用于执行防护动作。


    ## 无线 IDPS 局限性


    无线 IDPS 对未经授权的活动提供了强大的检测能力，但存在一些显著局限性。规避技术的使用被视为某些无线 IDPS 传感器的局限性之一，特别是针对传感器信道扫描方案。例如是在当前未被监控的信道上以极短脉冲发动攻击。攻击者也可同时在两个信道上发动攻击。如果传感器检测到第一个攻击，除非它扫离第一个攻击的信道，否则无法检测到第二个攻击。


    无线 IDPS 传感器（物理设备）本身也容易受到攻击。那些试图破坏 WLAN 的 DoS 攻击（无论逻辑还是物理）也会破坏传感器功能。此外，传感器通常特别容易受到物理攻击，因为它们通常位于走廊、会议室和其他开放区域。某些传感器具有防篡改功能，其外观设计得像火灾报警器，可降低被物理攻击的可能性。所有传感器都容易受到诸如干扰等物理攻击，这会破坏射频传输；除了在设施周围建立物理安全边界，使攻击者无法靠近到足以干扰
    WLAN 的程度外，没有其他防御措施。


    '
