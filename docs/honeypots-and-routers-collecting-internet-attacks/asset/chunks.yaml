    As new network technologies, topologies, and structures are developing, different
    kinds of attack strategies are also being devised. The hackers are not sitting
    idle and each day hundreds of experts may try to put their expertise in the negative
    ways. Hence, different kinds of detection and prevention schemes will be needed
    to deal with different network scenarios. Constant learning process and setting
    the defense strategy accordingly could ensure secure functionality of a network.


