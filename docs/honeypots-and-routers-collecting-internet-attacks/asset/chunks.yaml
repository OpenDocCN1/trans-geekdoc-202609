- raw: "        A single false positive is not a problem. The problem occurs when\
    \ a system sends too many false positives (i.e., hundreds or even thousands of\
    \ times a day). Therefore, too many false positives are a big problem, because\
    \ the administrator should take care of all these false positives to check whether\
    \ they are truly false positives or not. This adds to the burden of tasks of an\
    \ administrator as we know that a person in that role has too many tasks to perform\
    \ each day, including taking care of the IDS. If an IDS has a huge number of false\
    \ positives, an administrator is supposed to give most of his time for this issue,\
    \ and ignore all the other issues. Often, some people say that an IDS is good\
    \ if it has a few false positives and they seem not to care about the danger of\
    \ false negatives. Our view in this matter is that both false positives and false\
    \ negatives are equally crucial for an organization. Because, a successful false\
    \ negative will make a big problem in an organization such as information theft,\
    \ network delay, and system down. Again, the false positives have a great problem\
    \ that can occupy an administrator and drain him out.\n\n        It is well understood\
    \ that there is not a single man-made system in the world that is 100% perfect.\
    \ But, our goal is to design and develop any system as flawless as we can to the\
    \ best of our abilities. A perfect system needs Godly inputs and supports, which\
    \ would be free from any error, which is not applicable for human beings. Therefore,\
    \ a good IDS also should have a few false positives and false negatives.\n\n \
    \       The third challenge is data aggregation as mentioned before. Modern technology\
    \ is extremely effective at capturing extensive amounts of data. NIDS, system\
    \ logs, application logs—all of these resources are very good at capturing and\
    \ generating gigabytes of data. The challenge is how to aggregate all these data,\
    \ so that they have value in detecting and confirming an attack. New technologies\
    \ are constantly being devised to pull all these data together to create value,\
    \ to potentially detect attacks. At the same time, new technologies are being\
    \ developed that can generate more new forms of data. So, here the problem is\
    \ that the technology is advancing too rapidly, and the solutions for aggregating\
    \ data cannot keep up with the pace of data production.\n\n        To make a good\
    \ environment for detection, we must address the above three challenges. The honeypots\
    \ can address these challenges in style! Let us see how \\[\n\n        *   *False\
    \ positives:* Most honeypots have no production traffic, nor will it run any legitimate\
    \ production services. Therefore, there is little activity to generate false positives.\n\
    \n        *   *False negatives:* Honeypots address false negatives because they\
    \ are not easily evaded or defeated by new exploits. Moreover, as we know that\
    \ there is little or no production activity within the honeypots, they reduce\
    \ false negatives by capturing absolutely everything that enters and leaves the\
    \ system. This means that all the activities that are captured are most likely\
    \ the suspects.\n\n        *   *Data aggregation:* Honeypots address this issue\
    \ by capturing high value data. They usually generate only several megabytes of\
    \ data a day, most of which are of high value. Moreover, hon-eypots can capture\
    \ zero-day attacks (i.e., unknown attacks), which are not detected by other security\
    \ tools. This makes them extremely handy for use in network systems.\n\n     \
    \   One example of using a honeypot for detection would be its deployment within\
    \ a DMZ, often called the *demilitarized zone*. This is a network of untrusted\
    \ systems normally used to provide services to the Internet, such as email or\
    \ Web server. These are usually the systems at great risk, since anyone on the\
    \ Internet can initiate a connection to them, so they are highly likely to be\
    \ attacked and potentially compromised. Detection of such activity is critical.\
    \ The problem is that such attacks are difficult to detect because there are so\
    \ many production activities going on. All of this traffic can generate a significant\
    \ amount of false positives. Administrators may quickly ignore alerts generated\
    \ by traffic within the DMZ. Also, because of the large amount of traffic generated,\
    \ data aggregation becomes a challenge. However, we do not want to miss any attacks,\
    \ specifically false negatives. Hence, such implementation is often welcome.\n\
    \n        *Response*. Once an attack is detected, we need the ability to respond\
    \ to this attack. Honeypot can help protect an organization in such response event.\
    \ One of the greatest challenges that the organizations face today is how to respond\
    \ to an attack. There is often little information regarding the attacker(s), how\
    \ they got in, or how much damage they have already done. In an attack situation,\
    \ detailed information about the attacker’s activities is critical. The main problem\
    \ to attack response is that often the compromised system is a production system\
    \ and is running essential services. Hence, it is difficult to shut it down or\
    \ take it offline. Even if the system is taken offline, the logs and data entries\
    \ are so much that it can be difficult to determine what normal day-to-day activities\
    \ are and what the attacker’s activities are.\n\n        Honeypots can help address\
    \ both problems. Honeypots make an excellent incident response tool, as they can\
    \ quickly and easily be taken offline for a full forensic analysis, without impacting\
    \ day-to-day production operations. Moreover, the only activity a honeypot captures\
    \ is unauthorized or malicious activity (as already mentioned). This makes hacked\
    \ honeypots much easier to analyze than hacked production systems, as any data\
    \ we retrieve from a honeypot are most likely related to the attacker. The precious\
    \ gift they (i.e., honeypots) provide here is quickly giving organizations some\
    \ kind of in-depth information that they (i.e., organizations) need to respond\
    \ to an attack effectively. Generally, high-interaction honeypots make the best\
    \ solution for response.\n\n        ## **5.4 Honeypot Types Based on Interaction\
    \ Level**\n\n        Level of interaction gives us a scale with which we could\
    \ measure and compare honeypots. The more a honeypot can do and the more an attacker\
    \ can do to a honeypot, the greater the information that can be derived from it.\
    \ However, by the same token, the more an attacker can do to the honeypot, the\
    \ more potential damage an attacker can incur. Based on interaction levels, honeypots\
    \ fall into three categories \\[\n\n        ### *5.4.1 Low-Interaction Honeypots*\n\
    \n        Low-interaction honeypots are the simplest in terms of implementation,\
    \ typically are the easiest to install, configure, deploy, and maintain because\
    \ of their simple design and basic functionality. These honeypots merely emulate\
    \ a variety of services. Therefore, the attacker is limited to interacting with\
    \ these pre-designated services. For example, a low-interaction honeypot could\
    \ emulate a standard Unix server with several running services, such as Telnet\
    \ and FTP. An attacker could Telnet to the honeypot, get a banner that states\
    \ the OS, and perhaps obtain a login prompt. The attacker can then attempt to\
    \ log in by brute-force or by guessing the passwords. The honeypot would capture\
    \ and collect these attempts, but we should mention that there is no real OS for\
    \ the attacker to log in to. So, the attacker’s interaction is limited to login\
    \ attempts!"
  fmt: '

    误报一次不是问题。问题在于系统发送过多误报（即每天数百甚至数千次）。因此，过多的误报是个大问题，因为管理员必须处理所有这些误报，以检查它们是否真的是误报。这增加了管理员的任务负担，众所周知，该角色的人员每天有太多任务要执行，包括维护
    IDS。如果 IDS 产生大量误报，管理员本应将大部分时间花在该问题上，而忽略所有其他问题。常有人称 IDS 好坏取决于误报少寡，似乎不关心漏报的危险。我们的观点是，误报和漏报对组织同等重要。因为，一次成功的漏报会给组织带来大问题，如信息窃取、网络延迟和系统瘫痪。同样，误报也有大问题，会占用管理员精力并使其精疲力竭。


    大家公认，世界上没有任何人造系统是 100% 完美的。但我们的目标是尽最大能力设计开发尽可能完美的系统。完美系统需要神一般的输入和支持，不含任何错误，这不适用于人类。因此，优秀的
    IDS 也应只有少量误报和漏报。


    第三个挑战如前所述是数据聚合。现代技术极擅长捕获海量数据。NIDS、系统日志、应用日志——所有这些资源都善于捕获和生成 GB 级数据。挑战在于如何聚合所有这些数据，使其在检测和确认攻击时有价值。新技术不断被设计出来以汇总所有这些数据创造价值、潜在地检测攻击。同时，也在开发能生成更多新形式数据的新技术。所以问题在于技术进步太快，数据聚合解决方案跟不上数据生成的步伐。


    要为检测创造良好环境，必须解决上述三大挑战。蜜罐能从容应对这些挑战！让我们看看如何做到：


    *   **误报：** 大多数蜜罐没有生产流量，也不运行任何合法生产服务。因此，几乎没有活动会产生误报。

    *   **漏报：** 蜜罐解决漏报问题，因为它们不易被新漏洞利用规避或击败。而且，正如我们知道的，蜜罐内几乎没有生产活动，它们通过捕获进出系统的绝对所有内容来减少漏报。这意味着捕获的所有活动极有可能是可疑的。

    *   **数据聚合：** 蜜罐通过捕获高价值数据解决此问题。它们通常每天只生成几 MB 数据，其中大部分是高价值的。此外，蜜罐能捕获零日攻击（即未知攻击），这是其他安全工具检测不到的。这使它们在网络系统中极其好用。


    利用蜜罐进行检测的一个例子是将其部署在 DMZ（通常称为**非军事区**）内。这是一个不受信系统的网络，通常用于向互联网提供服务，如邮件或 Web 服务器。这些系统通常风险极大，因为互联网上任何人都能向它们发起连接，所以极可能被攻击并潜在妥协。检测此类活动至关重要。问题在于此类攻击难以检测，因为有太多生产活动在进行。所有这些流量会产生大量误报。管理员可能迅速忽略
    DMZ 内流量生成的警报。此外，由于产生大量流量，数据聚合成为挑战。然而，我们不想错过任何攻击，特别是漏报。因此，这种实现常受欢迎。


    **响应**。一旦检测到攻击，我们需要响应该攻击的能力。蜜罐可在响应事件中帮助保护组织。组织当前面临的最大挑战之一是如何响应攻击。通常很少有关于攻击者、他们如何入侵或已造成多大损害的信息。在攻击情况下，关于攻击者活动的详细信息至关重要。攻击响应的主要问题是受损系统往往是运行关键服务的生产系统。因此，难以将其关闭或下线。即使系统下线，日志和数据条目太多，难以判断什么是正常日常活动，什么是攻击者活动。


    蜜罐有助于解决这两个问题。蜜罐是优秀的事件响应工具，因为它们可快速轻松地下线进行全面取证分析，而不影响日常生产运营。此外，蜜罐捕获的唯一活动是未授权或恶意活动（如前所述）。这使被攻破的蜜罐比被攻破的生产系统更易分析，因为从蜜罐检索的任何数据极可能与攻击者相关。它们（即蜜罐）提供的宝贵礼物是快速给组织某种深度信息，使其（即组织）能有效响应攻击。通常，高交互蜜罐是响应的最佳解决方案。


    ## 5.4 基于交互级别的蜜罐类型


    交互级别给了我们一个衡量和比较蜜罐的尺度。蜜罐能做的越多、攻击者能对蜜罐做的越多，能获得的信息就越多。然而，同样地，攻击者能对蜜罐做的越多，攻击者能造成的潜在损害就越大。基于交互级别，蜜罐分为三类：


    ### 5.4.1 低交互蜜罐


    低交互蜜罐在实现上最简单，通常因其简单设计和基本功能而最易安装、配置、部署和维护。这些蜜罐仅模拟各种服务。因此，攻击者仅限于与这些预设服务交互。例如，低交互蜜罐可模拟运行多种服务（如
    Telnet 和 FTP）的标准 Unix 服务器。攻击者可 Telnet 到蜜罐，获得显示操作系统的横幅，或许能得到登录提示。攻击者随后可尝试通过暴力破解或猜测密码登录。蜜罐会捕获并收集这些尝试，但我们应提到，没有真实操作系统供攻击者登录。所以，攻击者的交互仅限于登录尝试！

    '
