    ### TCP session hijacking


    Session hijacking is an attack where an intruder maliciously takes over an ongoing
    communication session between two parties by stealing the session ID and impersonating
    as the authorized user. In a TCP session hijacking, the intruder takes control
    of the TCP session once it is successfully established between the two authorized
    users. Session hijacking requires the access to the session ID, which can be obtained
    through several approaches such as blind guessing, man-in-the-middle approach,
    or session sniffing. In a TCP session, the three important parameters of an in-progress
    communication are IP addresses, port numbers, and the sequence numbers. The intruder
    tries to access these three items through different mechanisms and once successful,
    attacks the session.


    ![Figure 3.5 Idle scan process.](images/pg53_1.jpg)


    **Figure 3.5** Idle scan process.


    ### IP spoofing


    Idle scan is one of the approaches categorized as spoofing approaches where the
    intruder hides its actual identity such as IP address or uses multiple addresses
    in the same attack to avoid being detected. The concept of spoofing is employed
    in other techniques as well such as media access control (MAC) spoofing.


    ### File transfer protocol bounce attack


    File transfer protocol (FTP)


    ![Figure 3.6 FTP bounce when port on the target is closed. Note: The syntax of
    the PORT command is a little strange as the address of the destination host is
    specified in the form of 6 comma separated decimal numbers. The first four numbers
    represent the IP address and can simply be used by replacing commas with dots.
    The last two numbers specify the port number on the destination in a format quite
    similar to the IP addressing. The sixth number represents the right eight bits
    of the port number while the fifth number represents the left eight bits of the
    port number; combine they make the 16-bit port number. Hence, the simple calculation
    to find the exact port number is to multiply the fifth number with 256 and then
    add to the sixth number.](images/pg54_1.jpg)


    **Figure 3.6** FTP bounce when port on the target is closed. Note: The syntax
    of the PORT command is a little strange as the address of the destination host
    is specified in the form of 6 comma separated decimal numbers. The first four
    numbers represent the IP address and can simply be used by replacing commas with
    dots. The last two numbers specify the port number on the destination in a format
    quite similar to the IP addressing. The sixth number represents the right eight
    bits of the port number while the fifth number represents the left eight bits
    of the port number; combine they make the 16-bit port number. Hence, the simple
    calculation to find the exact port number is to multiply the fifth number with
    256 and then add to the sixth number.


    ![Figure 3.7 FTP bounce when port on the target is open.](images/pg54_2.jpg)


    **Figure 3.7** FTP bounce when port on the target is open.


    ### 3.1.4 DHCP Vulnerabilities


    #### DHCP starvation


    DHCP


    #### Rogue DHCP server


    The intruder introduces a rogue DHCP server into the network with the ability
    to respond to the DHCP discover messages. This rogue server will also be generating
    DHCP offers in response to the discover requests with the intention and hope that
    some clients might select the leases offered by it. If that happens, client can
    be denied of service by providing wrong network configurations. It is also possible
    that the intruder provides the rogue server’s IP address (or of some other machine’s)
    to the client as the gateway address, so that the client traffic should pass through
    the rogue server and can be analyzed for malicious purposes, thus leading to a
    man-in-the-middle attack (Figure 3.8).


    ![Figure 3.8 Rogue DHCP server leading to the man-in-the-middle attack.](images/pg56_1.jpg)


    **Figure 3.8** Rogue DHCP server leading to the man-in-the-middle attack.


    ### 3.1.5 ICMP Scanning


    The ICMP is used by the network devices such as routers to perform error messaging.
    Each ICMP message carries an 8-bit type value and an 8-bit code value, and together
    the two fields have an associated status/ error message. For example, type 3 code
    0 means destination is unreachable due to destination network unreachable. ICMP
    messages are used in several tools to maliciously collect information about the
    target networks and hosts as the ICMP requests are always responded. Some of the
    examples are as follows:


    - Type 8 message is an echo request that is by default responded by an echo reply
    (Type 0) if the host is available. This technique is used to identify active devices
    on a network and is usually referred to as **ping scan**, due to its use in the
    ping utility. Ping sweep, as shown in Figure 3.9, is a enumeration technique in
    which ping messages are sent to a wide range of IP addresses to identify the active
    and non-active hosts (Figure 3.9).

    - Type 13 message requests for the timestamp and thus can reveal the time zone
    of the target.

    - Type 17 message is the network mask request and can reveal the subnetting details.


    ![Figure 3.9 Ping sweep process.](images/pg56_2.jpg)


    **Figure 3.9** Ping sweep process.


    ICMP scanning is usually not considered as a port scanning technique as the concept
    of ports is not valid at the level of ICMP; ports are available/addressable at
    the transport layer usually through TCP. It mainly helps in identifying the alive
    hosts on the network and thus can be categorized as a enumeration method.


    #### UDP scan


    Since UDP is a connectionless protocol, it is difficult to identify the status
    of the target by sending a UDP segment, as there can be multiple reasons for a
    no reply. However, a UDP segment sent to a port that is not associated with any
    application (port is closed) is responded by the target host with an ICMP Port
    Unreachable Message (Type 3 Code 3). Thus, a UDP segment will identify the ports
    that are not open.


    #### IP scan


    Several IP datagrams with varying protocol field values are transmitted to the
    target host. The assumption is that the target will reply with an ICMP destination
    protocol unreachable packet (Type 3 Code 2) for the protocols that are not supported
    by the host. This way the intruder can identify if the host is supporting any
    other transport protocols, in addition to the usual TCP and UDP.


    ### 3.1.6 Address Resolution Protocol


    The address resolution protocol (ARP)


    #### ARP scan


    ARP scan is a technique used to discover active hosts on the LAN. The intruder
    transmits ARP request with varying IP addresses, usually all the possible addresses
    in the subnet range. The target host if alive will reply with the MAC address
    and thus all the available hosts can be identified.


    #### ARP spoofing and poisoning


    ARP does not have a mechanism where the recipient of an ARP reply can authenticate
    if the described mapping is correct or not. This vulnerability is used in the
    spoofing attack, where the intruder sends ARP replies with wrong mappings to the
    other hosts on the LAN or replies to the ARP requests for the other hosts with
    its own MAC address. Thus, the traffic meant for the actual destination will instead
    be sent to the intruder due to wrong ARP entry at the source. Also, it will poison
    the ARP cache of the hosts, switches, and routers.


