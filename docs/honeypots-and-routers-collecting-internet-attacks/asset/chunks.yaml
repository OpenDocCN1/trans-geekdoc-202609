    # Scanning versus enumeration


    Scanning and enumeration are the two techniques that belong to the second phase
    of hacking, that is, scanning; confused? Surprisingly, the hacking industry has
    picked the same word for a hacking phase and a technique used in that phase, mainly
    due to the reason that again enumeration is very similar to scanning. However,
    the objective in enumeration is to discover user names, machine names, shared
    resources, services, and other similar entities. Scanning, on the other hand,
    is performed to discover active network hosts and open ports on these hosts, thus,
    referred to as *network scanning* too.


    ## References


    *   [1.](#07_Chapter02.xhtml#rfn1) Organisation for Economic Co-Operation and
    Development (OECD). OECD Guidelines for the Security of Information Systems and
    Networks: Towards a Culture of Security, Organisation for Economic Co-Operation
    and Development, Paris, France, July 25, 2002. [http://www.oecd.org/](http://www.oecd.org/)
    sti/ieconomy/15582260.pdf.

    *   [2.](#07_Chapter02.xhtml#rfn2) G. Stoneburner, C. Hayden, and A. Feringa Engineering
    Principles for Information Technology Security (A Baseline for Achieving Security),
    Revision A, Computer Security Division, Information Technology Laboratory, National
    Institute of Standards and Technology, Gaithersburg, MD, June 2004.

    *   [3.](#07_Chapter02.xhtml#rfn3) ISACA, An Introduction to the Business Model
    for Information Security, ISACA, Rolling Meadows, IL, 2009.

    *   [4.](#07_Chapter02.xhtml#rfn4) J. McCumber, Information systems security:
    A comprehensive model, in: Proceedings of the 14th National Computer Security
    Conference, NIST, Baltimore, MD, 1991.

    *   [5.](#07_Chapter02.xhtml#rfn5) D. Parker, Fighting Computer Crime, John Wiley
    & Sons, New York, 1998.

    *   [6.](#07_Chapter02.xhtml#rfn6) W. Maconachy, C. Schou, D. Ragsdale, and D.
    Welch, A model for information assurance: An integrated approach, in: Proceedings
    of the IEEE Workshop on Information Assurance and Security, U.S. Military Academy,
    New York, 2001.

    *   [7.](#07_Chapter02.xhtml#rfn7) Y. Cherdantseva, and J. Hilton, A reference
    model of information assurance & security, in: Proceedings of the Eighth International
    Conference on Availability, Reliability and Security (ARES), Regensburg, Germany,
    September 2–6, 2013.

    *   [8.](#07_Chapter02.xhtml#rfn8) J. Saltzer, and M. Schroeder, The protection
    of information in computer systems, Proceedings of the IEEE 63(9), 1278–1308,
    1975.

    *   [9.](#07_Chapter02.xhtml#rfn9) Y. Cherdantseva, and J. Hilton, Reference Model
    of Information Assurance & Security, [http://rmias.cardiff.ac.uk/](http://rmias.cardiff.ac.uk/),
    March 29, 2015.

    *   [10.](#07_Chapter02.xhtml#rfn10) D. Parker, Our excessively simplistic information
    security model and how to fix it, ISSA Journal 8(7), 12–21, July, 2010.

    *   [11.](#07_Chapter02.xhtml#rfn11) National Security Agency, National Information
    Systems Security Glossary. NSTISSI 4009, National Security Agency, Fort Meade,
    MD, September 2000.

    *   [12.](#07_Chapter02.xhtml#rfn12) G. Stoneburner, NIST Special Publication
    800-33: Underlying Technical Models for Information Technology Security, Recommendations
    of the National Institute of Standards and Technology, Gaithersburg, MD, December
    2001.


    # 3 Intrusions and Vulnerabilities


    **HABIB-UR REHMAN**


    Securing the communication and its content is an important concern in computer
    networks due to the fact that most of the physical infrastructure is publicly
    accessible and shared among the users. This fact brings all the security goals
    into play, which we have described in [Chapter 2](#07_Chapter02.xhtml). Furthermore,
    we have reviewed in [Chapter 1](#06_Chapter01.xhtml) that most of the protocols
    used to deliver messages between the end hosts are public. Thus, everyone is aware
    of the sequence of actions that will be performed while transmitting a message
    and could exploit this knowledge to attack the ongoing communication. This simply
    does not mean that nothing is secure in computer networks; protocols have evolved
    to overcome such deficiencies. However, the service model of the computer networks
    in general and the Internet in particular, is developed or evolved in such a way
    that it is impossible to eliminate all the weaknesses.


    An intruder exploits the vulnerabilities of a system to launch an attack against
    it; this makes it extremely important for the administrators and the rightful
    users of the system to be well aware of these vulnerabilities. The network, the
    hosts, and the applications running on the hosts can be misused if not properly
    designed and configured. The purpose of this chapter is to highlight such issues
    at all the three levels. We have attempted to compile a comprehensive list of
    commonly known attacks possible.


    ## 3.1 Network and Protocol Vulnerabilities


    Public protocols and their vulnerabilities are indeed the biggest source of attacks
    in computer networks. This section discusses the commonly known attacks possible
    on the protocols such as hypertext markup language (HTTP)


    ### 3.1.1 HTTP Banner Grabbing


    World Wide Web is a public service; therefore, the hosts running web servers are
    configured to allow any incoming requests to the port 80, the well-known port
    for the Web service. HTTP, the protocol used for the Web service is designed to
    reply to every HTTP request message with an HTTP response message. Usually, this
    response message contains the main/default page (mostly named as index^([⁹](#fn9))
    ![Figure 3.1 Typical HTTP response message.](images/pg46_1.jpg)


    **Figure 3.1** Typical HTTP response message.


    Banner grabbing is classified as a preattack^([^(10)](#fn10))


    Such a banner grabbing attack is applicable to the email messages as well, where
    the header of the received email also contains fields with important information.
    However, the email scenario is different from the HTTP scenario as such an analysis
    can only be performed if one has an email in hand.


    *SMTP enumeration*. However, in the SMTP, the protocol used to deliver emails
    to mail servers, an intruder can use the commands `VRFY`, `EXPN`, and `RCPT TO`
    through interfaces such as Telnet prompt to identify which email addresses are
    valid and which are not valid. Thus, the intruder can develop a list of valid
    email addresses that can later be used for malicious activities such as Spam messaging.


    ### 3.1.2 HTTP Tunneling


    Tunneling is an important concept in computer networks where the packet of one
    protocol is encapsulated inside the packet of another protocol. This approach
    is usually adopted when the protocol of the hidden/inside packet is not supported
    by the underlying network; usually, this could be due to some administrative restrictions,
    incompatible protocols, or device limitations. Tunneling increases the utility
    of the network as it makes the communication possible even if there are incompatibilities.
    For example, IPv6 datagrams can be shared between the end hosts connected through
    devices (some or all) not supporting IPv6 by establishing an IPv4 tunnel, from
    end to end or for fewer hops as per requirement. Tunneling can be performed at
    any layer or protocol. However, HTTP tunneling is a major concern as the HTTP
    messages are rarely filtered or blocked^([^(11)](#fn11))


    HTTP tunneling is performed by using software designed to communicate through
    the HTTP. The client component of the software is installed on the user^([^(12)](#fn12))


