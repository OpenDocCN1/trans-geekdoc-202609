- raw: "        The one important issue that was missing in the CIA triad as well\
    \ as in the Parker’s Hexad is, What if one of the two parties sharing the information\
    \ later denies the incident? Non-repudiation is a security objective introduced\
    \ to overcome this concern and a system cannot be completely secure if there is\
    \ no assurance that there will be necessary record keeping of a transaction, so\
    \ that later none of the participants can deny its participation. In information\
    \ sharing scenarios, for the sender, the assurance of a successful delivery to\
    \ the correct recipient is necessary; for the receiver, the identity of the source\
    \ is essential and in case there is a controlling authority involved, both the\
    \ assurances are important. From the recipient’s point of view, non-repudiation\
    \ does not ensure that sender is the rightful owner of the information; that aspect\
    \ is covered under authentication.\n\n        ### *2.3.3 Non-Repudiation versus\
    \ Accountability*\n\n        In \\[11, p. 2\\], *accountability* is considered\
    \ as one of the security goals by NIST and is defined as the “the requirement\
    \ that actions of an entity may be traced uniquely to that entity.” Non-repudiation,\
    \ on the other hand, is described as a preventive service to achieve the goal\
    \ of accountability \\[\n\n        ## **2.4 Reference Model of Information Assurance\
    \ and Security**\n\n        Finally, Cherdantseva and Hilton in \\[\n\n      \
    \  ### *2.4.1 Auditability*\n\n        Auditability is defined as “an ability\
    \ of a system to conduct persistent, non-bypassable monitoring of all actions\
    \ performed by humans or machines within the system” \\[7, p. 7\\]. Thus, the\
    \ actions performed by different entities will be observed and analyzed for their\
    \ compliance with the rules and policies. The term *auditing* usually refers to\
    \ a subsequent analysis of an event and it is not clear in \\[\n\n        ###\
    \ *2.4.2 Privacy*\n\n        Privacy is the attribute that the owner of the information\
    \ is able to control it and the spreading of the information complies with the\
    \ privacy laws and owner’s discretion. Privacy is sometimes confused with the\
    \ confidentiality and integrity, as they all have the sense of obfuscating from\
    \ *others*. Confidentiality is even required in circumstances when some public\
    \ information is shared within a group or integrity is required for public content\
    \ as well. On the other hand, a resource or information that is private is rarely\
    \ shared and indeed this is the attribute that makes it private.\n\n        ##\
    \ **2.5 Fundamentals of Hacking**\n\n        The fundamental concepts that are\
    \ presented so far in this chapter are usually referred to as the necessary attributes\
    \ that a secure information system should have or sometimes considered as the\
    \ targets to achieve in order to make an information system secure. This is equally\
    \ applicable to any computing system that generates, handles, stores, or  deals\
    \ with information in any possible way. The intruder or a malicious entity is\
    \ interested to affect the system and information handled by the system by compromising\
    \ one or more of these security characteristics. Before we conclude this chapter,\
    \ it would be very useful to review how the system can be attacked and revisit\
    \ the elementary concepts of the dark science of hacking.\n\n        ![Figure\
    \ 2.4 Reference model of information assurance and security. (From Y. Cherdantseva,\
    \ and J. Hilton, A reference model of information assurance & security, in: Proceedings\
    \ of the Eighth International Conference on Availability, Reliability and Security\
    \ (ARES), Regensburg, Germany, September 2–6, 2013.)](images/pg41_1.jpg)\n\n \
    \       **Figure 2.4** Reference model of information assurance and security.\
    \ (From Y. Cherdantseva, and J. Hilton, A reference model of information assurance\
    \ & security, in: *Proceedings of the Eighth International Conference on Availability,\
    \ Reliability and Security (ARES)*, Regensburg, Germany, September 2–6, 2013.)\n\
    \n        ### *2.5.1 Threats*\n\n        There are mainly three types of threats\
    \ to an information system, which are as follows:\n\n        *   *Natural threats:*\
    \ These include natural disasters such as earthquakes, floods, or any other uncontrollable\
    \ hazard.\n\n        *   *Physical threats:* Damages can be happen due to fire,\
    \ power, or water; this could be intentional or unintentional.\n\n        *  \
    \  *Human threats:* The insiders or outsiders can harm the system, intentionally\
    \ or unintentionally, with the malicious intent or under the influence of disgruntlement.\
    \ Humans can threaten the system in three possible ways, which are as follows:\
    \ \n\n            *   *Network threats:* As we mentioned earlier, computer networks\
    \ are the most common medium to share information. An intruder can break into\
    \ the communication channel to compromise the security in several ways.\n\n  \
    \          *   *Host threats:* The hosts dealing with the information can be directly\
    \ attacked and their security can be breached.\n\n            *   *Application\
    \ threats:* Applications processing the information if not properly developed\
    \ might have vulnerabilities that can be exploited by the intruders.\n\n     \
    \   In [Chapter 3](#08_Chapter03.xhtml), we have presented a comprehensive list\
    \ of several attacks, belonging to the above three categories, with their technical\
    \ details.\n\n        ### 2.5.2 Hacking Process\n\n        Intruders exploit the\
    \ vulnerabilities of a system to launch an attack on the system. These vulnerabilities\
    \ can be in the individual application or in the host as a whole or could be in\
    \ the network through which the hosts will share the information. The process\
    \ of launching an attack is usually divided into the following steps:\n\n    \
    \    *   *Reconnaissance:* The initial phase where intruder collects necessary\
    \ information about the system and develops the attack strategy based on this\
    \ initial data. Reconnaissance could be active where intruder interacts with the\
    \ system or could be passive where the data is collected through indirect sources\
    \ such as social engineering or dumpster diving or going through public resources.\
    \ Footprinting is a common reconnaissance technique with both active and passive\
    \ methods to gather the data on the system.\n\n        *   *Scanning:* Active\
    \ reconnaissance and scanning are not very different concepts as both collect\
    \ the information about the system and its resources through interaction. Although\
    \ the intruder interacts with the system, scanning is not considered the actual\
    \ attack on the system as the intruder does not harm the system or information.\
    \ It is rather the process of identifying the network and host vulnerabilities.\n\
    \n        *   *Gaining access:* This phase refers to the step where the intruder\
    \ attempts to access the network, or the host or the application by exploiting\
    \ the discovered vulnerabilities.\n\n        *   *Maintaining access:* Once the\
    \ intruder has successfully accessed the resource, it is the time to use the resources\
    \ of the system to collect the required information or to launch further attacks.\n\
    \n        *   *Clearing tracks:* The last act is to hide the malicious actions\
    \ from the authorized users and the administrators. Usually, this is performed\
    \ by destroying the evidence in the log files and archives.\n\n        After looking\
    \ at the above phases, the term *attack* becomes fuzzy. In the literature, there\
    \ are two interpretations in practice. It may refer to an individual malicious\
    \ action of small scale or could be a large hacking activity performed through\
    \ a series of small-scale intrusions. Thus, we can say that scanning itself is\
    \ an attack as well as a phase of a hacking attack."
  fmt: "\nThe one important issue that was missing in the CIA triad as well as in\
    \ the Parker’s Hexad is: What if one of the two parties sharing the information\
    \ later denies the incident? Non-repudiation is a security objective introduced\
    \ to overcome this concern. A system cannot be completely secure if there is no\
    \ assurance that there will be necessary record keeping of a transaction, so that\
    \ later none of the participants can deny its participation. In information sharing\
    \ scenarios, for the sender, the assurance of a successful delivery to the correct\
    \ recipient is necessary; for the receiver, the identity of the source is essential;\
    \ and in case there is a controlling authority involved, both assurances are important.\
    \ From the recipient’s point of view, non-repudiation does not ensure that the\
    \ sender is the rightful owner of the information; that aspect is covered under\
    \ authentication.\n\n### 2.3.3 Non-Repudiation versus Accountability\n\nIn [11,\
    \ p. 2], *accountability* is considered as one of the security goals by NIST and\
    \ is defined as \"the requirement that actions of an entity may be traced uniquely\
    \ to that entity.\" Non-repudiation, on the other hand, is described as a preventive\
    \ service to achieve the goal of accountability.\n\n## 2.4 Reference Model of\
    \ Information Assurance and Security\n\nFinally, Cherdantseva and Hilton in [7]\
    \ proposed a reference model.\n\n### 2.4.1 Auditability\n\nAuditability is defined\
    \ as \"an ability of a system to conduct persistent, non-bypassable monitoring\
    \ of all actions performed by humans or machines within the system\" [7, p. 7].\
    \ Thus, the actions performed by different entities will be observed and analyzed\
    \ for their compliance with the rules and policies. The term *auditing* usually\
    \ refers to a subsequent analysis of an event, and it is not clear in [7] whether\
    \ auditability includes real-time monitoring.\n\n### 2.4.2 Privacy\n\nPrivacy\
    \ is the attribute that the owner of the information is able to control it and\
    \ the spreading of the information complies with the privacy laws and owner’s\
    \ discretion. Privacy is sometimes confused with confidentiality and integrity,\
    \ as they all have the sense of obfuscating from *others*. Confidentiality is\
    \ even required in circumstances when some public information is shared within\
    \ a group, or integrity is required for public content as well. On the other hand,\
    \ a resource or information that is private is rarely shared, and indeed this\
    \ is the attribute that makes it private.\n\n## 2.5 Fundamentals of Hacking\n\n\
    The fundamental concepts presented so far in this chapter are usually referred\
    \ to as the necessary attributes that a secure information system should have,\
    \ or sometimes considered as the targets to achieve in order to make an information\
    \ system secure. This is equally applicable to any computing system that generates,\
    \ handles, stores, or deals with information in any possible way. The intruder\
    \ or a malicious entity is interested in affecting the system and information\
    \ handled by the system by compromising one or more of these security characteristics.\
    \ Before we conclude this chapter, it would be very useful to review how the system\
    \ can be attacked and revisit the elementary concepts of the dark science of hacking.\n\
    \n![Figure 2.4 Reference model of information assurance and security. (From Y.\
    \ Cherdantseva, and J. Hilton, A reference model of information assurance & security,\
    \ in: Proceedings of the Eighth International Conference on Availability, Reliability\
    \ and Security (ARES), Regensburg, Germany, September 2–6, 2013.)](images/pg41_1.jpg)\n\
    \n**Figure 2.4** Reference model of information assurance and security. (From\
    \ Y. Cherdantseva, and J. Hilton, A reference model of information assurance &\
    \ security, in: *Proceedings of the Eighth International Conference on Availability,\
    \ Reliability and Security (ARES)*, Regensburg, Germany, September 2–6, 2013.)\n\
    \n### 2.5.1 Threats\n\nThere are mainly three types of threats to an information\
    \ system, which are as follows:\n\n*   **Natural threats:** These include natural\
    \ disasters such as earthquakes, floods, or any other uncontrollable hazard.\n\
    *   **Physical threats:** Damage can happen due to fire, power, or water; this\
    \ could be intentional or unintentional.\n*   **Human threats:** Insiders or outsiders\
    \ can harm the system, intentionally or unintentionally, with malicious intent\
    \ or under the influence of disgruntlement. Humans can threaten the system in\
    \ three possible ways:\n    *   **Network threats:** As mentioned earlier, computer\
    \ networks are the most common medium to share information. An intruder can break\
    \ into the communication channel to compromise security in several ways.\n   \
    \ *   **Host threats:** The hosts dealing with the information can be directly\
    \ attacked and their security breached.\n    *   **Application threats:** Applications\
    \ processing the information, if not properly developed, might have vulnerabilities\
    \ that can be exploited by intruders.\n\nIn [Chapter 3](#08_Chapter03.xhtml),\
    \ we have presented a comprehensive list of several attacks belonging to the above\
    \ three categories, with their technical details.\n\n### 2.5.2 Hacking Process\n\
    \nIntruders exploit the vulnerabilities of a system to launch an attack. These\
    \ vulnerabilities can be in the individual application, in the host as a whole,\
    \ or in the network through which the hosts share information. The process of\
    \ launching an attack is usually divided into the following steps:\n\n*   **Reconnaissance:**\
    \ The initial phase where the intruder collects necessary information about the\
    \ system and develops the attack strategy based on this initial data. Reconnaissance\
    \ could be *active* (where the intruder interacts with the system) or *passive*\
    \ (where data is collected through indirect sources such as social engineering,\
    \ dumpster diving, or public resources). Footprinting is a common reconnaissance\
    \ technique with both active and passive methods to gather data on the system.\n\
    *   **Scanning:** Active reconnaissance and scanning are not very different concepts,\
    \ as both collect information about the system and its resources through interaction.\
    \ Although the intruder interacts with the system, scanning is not considered\
    \ the actual attack, as the intruder does not harm the system or information.\
    \ It is rather the process of identifying network and host vulnerabilities.\n\
    *   **Gaining access:** This phase refers to the step where the intruder attempts\
    \ to access the network, the host, or the application by exploiting the discovered\
    \ vulnerabilities.\n*   **Maintaining access:** Once the intruder has successfully\
    \ accessed the resource, it is time to use the system resources to collect the\
    \ required information or to launch further attacks.\n*   **Clearing tracks:**\
    \ The last act is to hide the malicious actions from authorized users and administrators.\
    \ Usually, this is performed by destroying the evidence in log files and archives.\n\
    \nAfter looking at the above phases, the term *attack* becomes fuzzy. In the literature,\
    \ there are two interpretations in practice. It may refer to an individual malicious\
    \ action of small scale or a large hacking activity performed through a series\
    \ of small-scale intrusions. Thus, we can say that scanning itself is an attack\
    \ as well as a phase of a hacking attack.\n"
  trans: "\n\nCIA 三要素以及帕克六要素中缺失的一个重要问题是：如果共享信息的双方中的一方事后否认该事件发生过，该怎么办？引入不可否认性这一安全目标就是为了解决这一顾虑。如果无法保证对交易进行必要的记录保存，以便事后任何参与者都无法否认其参与，则系统不能被视为完全安全。在信息共享场景中，对于发送方而言，确保成功交付给正确的接收方是必要的；对于接收方而言，确认来源身份至关重要；如果涉及控制机构，这两种保证都很重要。从接收方的角度来看，不可否认性并不确保发送方是信息的合法所有者；该方面由认证来涵盖。\n\
    \n### 2.3.3 不可否认性与可审计性\n\n在文献 [11, p. 2] 中，美国国家标准与技术研究院（NIST）将*可审计性*视为安全目标之一，并将其定义为“实体的行为可被唯一追溯至该实体的要求”。另一方面，不可否认性被描述为一种预防性服务，旨在实现可审计性这一目标。\n\
    \n## 2.4 信息保障与安全参考模型\n\n最后，Cherdantseva 和 Hilton 在文献 [7] 中提出了一个参考模型。\n\n### 2.4.1\
    \ 可审计性\n\n可审计性被定义为“系统对人类或机器在系统内执行的所有动作进行持续的、不可绕过的监控的能力”[7, p. 7]。因此，不同实体执行的动作将被观察和分析，以检查其是否符合规则和策略。*审计*一词通常指对事件的事后分析，文献\
    \ [7] 中未明确说明可审计性是否包含实时监控。\n\n### 2.4.2 隐私\n\n隐私是指信息所有者能够控制其信息，且信息的传播符合隐私法律和所有者的意愿。隐私有时会与机密性和完整性混淆，因为它们都包含对*他人*进行混淆/隐藏的含义。即使在某些公共信息在群体内共享的情况下，也需要机密性；公共内容同样需要完整性。另一方面，私有资源或信息极少被共享，这正是使其成为私有的属性所在。\n\
    \n## 2.5 黑客攻击基础\n\n本章迄今提出的基本概念通常被称为安全信息系统应具备的必要属性，有时也被视为为使信息系统安全而需达成的目标。这同样适用于以任何可能方式生成、处理、存储或处理信息的任何计算系统。入侵者或恶意实体企图通过破坏这些安全特性中的一项或多项，来影响系统及系统处理的信息。在结束本章之前，回顾系统如何被攻击并重温黑客攻击这门“黑暗科学”的基本概念将非常有用。\n\
    \n![图 2.4 信息保障与安全参考模型。（来源：Y. Cherdantseva, and J. Hilton, A reference model of\
    \ information assurance & security, in: Proceedings of the Eighth International\
    \ Conference on Availability, Reliability and Security (ARES), Regensburg, Germany,\
    \ September 2–6, 2013.）](img/pg41_1.jpg)\n\n**图 2.4** 信息保障与安全参考模型。（来源：Y. Cherdantseva,\
    \ and J. Hilton, A reference model of information assurance & security, in: *Proceedings\
    \ of the Eighth International Conference on Availability, Reliability and Security\
    \ (ARES)*，德国雷根斯堡，2013 年 9 月 2-6 日。）\n\n### 2.5.1 威胁\n\n信息系统主要面临三类威胁，如下所示：\n\n\
    *   **自然威胁：** 包括地震、洪水等自然灾害，或任何其他不可控的危险。\n*   **物理威胁：** 可能因火灾、电力或水患导致损坏；这可能是故意的，也可能是无意的。\n\
    *   **人为威胁：** 内部人员或外部人员可能故意或无意地损害系统，带有恶意意图或因怨恨情绪驱使。人类可能通过以下三种方式威胁系统：\n    *  \
    \ **网络威胁：** 如前所述，计算机网络是共享信息最常用的媒介。入侵者可闯入通信信道，以多种方式破坏安全。\n    *   **主机威胁：** 处理信息的主机可能遭受直接攻击，导致其安全防线被突破。\n\
    \    *   **应用威胁：** 处理信息的应用程序如果开发不当，可能存在可被入侵者利用的漏洞。\n\n在第 3 章第 3 章中，我们列出了属于上述三类的多种攻击的综合清单，并附带其技术细节。\n\
    \n### 2.5.2 黑客攻击过程\n\n入侵者利用系统漏洞发起攻击。这些漏洞可能存在于单个应用程序中、整个主机中，或主机共享信息的网络中。发起攻击的过程通常分为以下步骤：\n\
    \n*   **侦察：** 初始阶段，入侵者收集关于系统的必要信息，并基于这些初始数据制定攻击策略。侦察可分为*主动*（入侵者与系统交互）或*被动*（通过社会工程学、垃圾箱搜寻或公开资源等间接来源收集数据）。足迹采集是一种常见的侦察技术，结合主动和被动方法收集系统数据。\n\
    *   **扫描：** 主动侦察和扫描概念并无太大区别，两者均通过交互收集关于系统及其资源的信息。尽管入侵者与系统交互，但扫描不被视为实际攻击，因为入侵者并未危害系统或信息。它更多是识别网络和主机漏洞的过程。\n\
    *   **获取访问权限：** 此阶段指入侵者尝试通过利用发现的漏洞来访问网络、主机或应用程序。\n*   **维持访问权限：** 一旦入侵者成功访问资源，便利用系统资源收集所需信息或发起进一步攻击。\n\
    *   **清除痕迹：** 最后一步是向授权用户和管理员隐藏恶意行为。通常通过销毁日志文件和归档中的证据来实现。\n\n审视上述阶段后，*攻击*一变得模糊不清。文献中有两种通用的解释。它可能指单个小规模的恶意行为，也可能指通过一系列小规模入侵实施的大规模黑客活动。因此，我们可以说扫描本身既是一种攻击，也是黑客攻击的一个阶段。\n\
    \n"
