    # 2 Information System Security


    **HABIB-UR REHMAN**


    Computer networks are a modern channel of communications: efficient, easy to use,
    and with plenty of options and variations. This communication, through these networks
    or any other approach, is always performed by the people and is meant for the
    people; we have many reasons to keep the communication secret. In this chapter,
    we will review the fundamentals of the communication security[⁷](#fn7).


    Before we begin, let us see how our communication model looks like:


    *   Two or more devices are exchanging messages with each other.

    *   The messages could be either atomic or part of a longer communication.

    *   In case there are more than one recipient of the same message, this message
    can be transmitted individually to each of them or could be sent as a single broadcast.

    *   The participants of the communication can be in the same local network or
    may be in different local area networks that are connected through some suitable
    wide area network interface.


    Since the message exchanged between two or more devices is certainly a piece of
    information, the principles established for information security are completely
    valid in our domain. Thus, the information security fundamentals are the perfect
    point to start this discussion.


    The researchers and professionals in the area of information security have suggested
    several models, which can be classified into two major categories. The first category
    is of general recommendations and guidelines to be followed to implement a secure
    information system. Three major examples from this group are as follows:


    *   Organisation for Economic Co-Operation and Development (OECD) Guidelines for
    the Security of Information Systems and Networks

    *   National Institute of Standards and Technology (NIST) Engineering Principles
    for Information Technology Security

    *   An Introduction to the Business Model for Information Security by Information
    Systems Audit and Control Association


    In the second category, there are models that describe the conceptual and technical
    elements of the information and provide recommendations based on these fundamental
    security characteristics of the information. Following are some popular models
    from the second category:


    *   CIA triad

    *   McCumber’s Cube

    *   Parkerian Hexad

    *   Model for Information Assurance by Maconachy et al.

    *   Reference Model of Information Assurance and Security


    In this chapter, we have reviewed the second category and have only discussed
    the security elements and characteristics of the information. Our objective here
    is to provide a quick review of the fundamental security concepts required to
    appreciate the importance and utility of intrusion detection and prevention in
    computer network communications.


    ## 2.1 CIA Triad


    The CIA triad is the most fundamental model in information security that defines
    the core principles. The term *CIA*[⁸](#fn8)


    The three attributes (CIA) are considered the essential elements for the security
    of any kind of information system, including our communication over the computer
    networks. There are certainly several additions suggested to this list, but confidentiality,
    integrity, and availability are at the core of every extended model.


    ### 2.1.1 Confidentiality


    In non-technical sense, confidentiality is equivalent to the term *privacy* that
    we use in daily life, that is, “no one should be able to know what I am up to
    provided, that is my personal matter.” Technically, confidentiality is defined
    as the characteristic that only authorized people have access to the resource.
    Thus, it is the attribute of concealing the resources from unauthorized entities.
    In terms of information security, it is the assurance that the information would
    be available only to authorized people. This interpretation can be extended in
    several ways, which are as follows:


    *   The information will be stored in authorized form only, whether physical or
    electronic, and only authorized people will have access to the data stores.

    *   The information will be stored in authorized format only.

    *   The information will be available through authorized mediums only.


    In case of our communication using computer networks, there are two major aspects
    of confidentiality. First, the confidentiality of the existence of communication,
    that is, only those who are authorized should be aware that communication is going
    on or has happened. Second, the confidentiality of the content of the communication,
    that is, only those who are authorized should be able to see what was communicated
    or is being communicated.


    ### 2.1.2 Integrity


    The unauthorized access to a resource may lead to the problem of misusing it or
    corrupting it. In information security, integrity is the characteristic that information
    is not altered in an unauthorized manner. Thus, on one hand, it is the assurance
    that the information is in its original state without any corruption. On the other
    hand, it is also the affirmation that any modification required either has been
    made or will be made using an authorized approach such as only by authorized people
    and only using authorized means.


    It is not necessary that unauthorized alteration to the information is always
    with malicious intent; it could be unintentional or accidental. For example, the
    communication over computer networks could have errors due to electronic malfunction.
    Integrity is the attribute that requires that the accuracy and consistency of
    the information should remain intact in all sorts of scenarios, whether malicious
    or accidental, intentional, or unintentional.


    Although, it looks that unauthorized alteration always comes up with unauthorized
    access in its bag. However, there could be situations when the integrity of the
    information can be compromised without harming the confidentiality. A very simple
    example of this case is the bit error happened in a message sent over a computer
    network. Here the content of the message is not accessed by any unauthorized entity;
    however, its content is still altered.


    ### 2.1.3 Availability


    The resource should be available to the authorized users when required. Availability
    is the attribute that the system provides the information to the authorized users
    or viewers whenever they are in need of it, usually all the time. Availability
    of information indirectly requires that:


    *   The system storing the data/information should be available.

    *   The system used to retrieve the data/information should be available.

    *   The system used to update the data/information should be available.

