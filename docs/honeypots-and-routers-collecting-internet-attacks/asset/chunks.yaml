    \ This is, however, not enough because the data that are captured have to be sent\
    \ to the server, thereby exposing itself. Sebek uses a covert channel to communicate\
    \ with the server. It generates packets to be sent inside Sebek without using\
    \ the TCP/IP stack and the packets are sent directly to the driver bypassing the\
    \ raw socket interface. The packets are then invisible to the user, and Sebek\
    \ modifies the kernel to prevent the user from blocking transition of the packets.\
    \ [Figure 7.2](#12_Chapter07.xhtml#fig7_2) shows Sebek deployment.\n\n![Figure\
    \ 7.2 Sebek deployment. (Data from Know Your Enemy: Sebek—A Kernel Based Data\
    \ Capture Tool, http://old.honeynet.org/papers/sebek.pdf, 2012.)](images/pg169_1.jpg)\n\
    \n**Figure 7.2** Sebek deployment. (Data from *Know Your Enemy: Sebek—A Kernel\
    \ Based Data Capture Tool*, [http://old.honeynet.org/papers/sebek.pdf](http://old.honeynet.org/papers/sebek.pdf),\
    \ 2012.)\n\nIn the case of multiple clients, there is a risk of the clients seeing\
    \ each other’s packets. Sebek configures its own raw socket interface on the clients\
    \ to ignore all incoming Sebek packets. Only the server can receive Sebek packets.\
    \ Due to its comprehensive log capabilities, it can be used as a tool for forensics\
    \ data collection. It has a Web interface that can perform data analysis.\n\n\
    ### 7.3.3 Snort_inline\n\n`Snort_inline` is a modified version of Snort. It is\
    \ a developed Intrusion Prevention System (IPS) that uses the signatures of existing\
    \ Intrusion Detection System (IDS) to make decisions on packet that traverse `snort_inline`.\
    \ The decisions are usually drop, reject, modify, or allow.\n\n## 7.4 Double-Honeynet\
    \ System Configurations\n\nIn this section, we discuss the double-honeynet system\
    \ architecture and configuration using VMware.\n\n### 7.4.1 Implementation of\
    \ Double-Honeynet Architecture\n\n[Figure 7.3](#12_Chapter07.xhtml#fig7_3) shows\
    \ the architecture of the double-honeynet system, implemented using VMware workstation\
    \ version 7 on a personal computer with Intel Pentium 4, 3.19-GHz CPU, 8GB RAM,\
    \ and running on Windows XP 64-bit. The operating system of that personal computer\
    \ is referred to as the *host operating system* in [Figure 7.3](#12_Chapter07.xhtml#fig7_3).\
    \ The host machine was connected to our home router and it accessed the Internet\
    \ through it.\n\nWe used virtual machine to deploy the double-honeynet system\
    \ due to the lack of resources and to keep the establishment cost low. One personal\
    \ computer was used and VMware workstation was installed on it. The VMware workstation\
    \ is a software package that gives its users the opportunity to create virtual\
    \ machines that constitute virtual networks interconnected with each other. Thus,\
    \ we created the double-honeynet system as a virtual network seen from the outside\
    \ world as an independent network. Attackers could locate the honeypot and attack\
    \ it. The honeypot was transparently connected to the Internet through the honeywall,\
    \ which in turn intercepted all outbound and inbound traffic. Therefore, malicious\
    \ traffic targeting the honeypot (inbound) or malicious traffic generated by the\
    \ compromised honeypot (outbound) were available to us from the honeywall for\
    \ further analysis and investigation. As we mentioned in [Section 7.2](#12_Chapter07.xhtml#sch7_2),\
    \ Honeynet 1 and Honeynet 2 were configured to deliver unlimited outbound connections.\
    \ The *internal router* was used to protect our local network by redirecting all\
    \ outbound connections from Honeynet 1 to Honeynet 2 and vice versa.\n\n![Figure\
    \ 7.3 Double-honeynet architecture.](images/pg171_1.jpg)\n\n**Figure 7.3** Double-honeynet\
    \ architecture.\n\n### 7.4.2 Double-Honeynet Configurations\n\nOur double-honeynet\
    \ system contains six components: local router, internal router, LAN, Honeynet\
    \ 1, Honeynet 2, and signature generator. The subnet mask for each subnet (whether\
    \ local router, internal router, LAN, Honeynet 1, Honeynet 2, and signature generator)\
    \ is consequently 255.255.255.0. Sections 7.4.2.1 through 7.4.2.6 discuss the\
    \ configurations of each component.\n\n**Local router configuration**. As we mentioned\
    \ in [Section 7.2](#12_Chapter07.xhtml#sch7_2), the local router’s function is\
    \ to pass unwanted traffic to the Honeynet 1 through the internal router. For\
    \ example, if the IP address space of our LAN is 212.0.50.0/24, with one public\
    \ Web server, the server’s IP address is 212.0.50.19. If an attacker outside the\
    \ network launches a worm attack against 212.0.50.0/24, the worm scans the IP\
    \ address space of victims. It is highly probable that an unused IP address, for\
    \ example, 212.0.50.10 will be attempted before 212.0.50.19. Therefore, the local\
    \ router will redirect the packet to Honeynet 1 through the internal router. After\
    \ the worm compromises the Honeynet 1, the worm will try to make an outbound connection\
    \ to harm another network. We configured the internal router to protect the LAN\
    \ from worms’ outbound connections. The internal router intercepts all outbound\
    \ connections from Honeynet 1 and redirects them to Honeynet 2, which performs\
    \ the same task being done by the Honeynet 1, forming loop connections. Below\
    \ are the details of the local router machine properties and IP-tables configuration.\n\
    \n**Machine Properties**\n\n*   **Operating system:** Ubuntu Linux 9.10\n*   **Number\
    \ of network cards:**\n*   Three network cards (`Eth0`, `Eth1`, and `Eth2`)\n\
    \    *   `Eth0` and `Eth2` are bridged LAN port\n    *   The function of `Eth1`\
    \ is to connect the local router with Honeynet 1 through the internal router\n\
    *   **IP addresses:**\n*   `Eth1`: 192.168.50.20\n"
  trans: "\n例如在图 7.1 中，如果本地路由器怀疑数据包 1（`P[1]`）、数据包 2（`P[2]`）和数据包 3（`P[3]`）是恶意的，它会通过内部路由器将它们重定向到蜜网\
    \ 1。在这三个数据包中，`P[1]` 和 `P[2]` 发起出站连接，内部路由器将这些出站连接重定向到蜜网 2。在蜜网 2 中，`P[1]` 和 `P[2]`\
    \ 改变其载荷并分别变为 `P[1]’` 和 `P[2]’`（即 `P[1]’` 和 `P[2]’` 是 `P[1]` 和 `P[2]` 的实例）。因此，在这种情况下，`P[1]’`\
    \ 和 `P[2]’` 发起出站连接，内部路由器将这些连接重定向到蜜网 1。在蜜网 1 中，`P[1]’` 和 `P[2]’` 改变其载荷并分别变为 `P[1]”`\
    \ 和 `P[2]”`（即 `P[1]”` 和 `P[2]”` 也是 `P[1]` 和 `P[2]` 的其他实例）。现在，由于出站连接，`P[1]` 和 `P[2]`\
    \ 被判定为恶意。因此，蜜网 1 将 `P[1]`、`P[1]”`、`P[2]`、`P[2]”` 转发给签名生成器进行签名生成过程。同样，蜜网 2 将 `P[1]’`\
    \ 和 `P[2]’` 转发给签名生成器进行签名生成过程。\n\n在此场景中，`P[3]` 到达蜜网 1 时未发起任何出站连接。因此，`P[3]` 不被视为恶意。\n\
    \n## 7.3 软件\n\n下面介绍双蜜网系统中使用的软件工具。\n\n### 7.3.1 Honeywall Roo CDROM\n\nHoneywall\
    \ Roo CDROM 1.4 版从蜜网项目与研究联盟下载。它提供数据捕获、控制和分析功能。\n\n### 7.3.2 Sebek\n\nSebek 是一种数据捕获工具，主要记录击键，也记录所有其他类型的\
    \ `sys_read` 数据。\n\n捕获数据后，客户端将其发送给服务器，服务器将其保存在数据库中或仅记录日志。在蜜网的情况下，服务器通常位于蜜墙机器上，它从所有蜜罐收集数据并将其汇总以供分析。\n\
    \n为防止入侵者检测，Sebek 采用了一些混淆方法。在客户端，它对用户完全隐藏，因此也对系统上的入侵者隐藏。然而，这还不够，因为捕获的数据必须发送给服务器，从而暴露自身。Sebek\
    \ 使用隐蔽信道与服务器通信。它生成要在 Sebek 内部发送的数据包，而不使用 TCP/IP 协议栈，数据包直接发送给驱动程序，绕过原始套接字接口。这些数据包随后对用户不可见，Sebek\
    \ 修改内核以防止用户阻塞数据包的传输。 图 7.2 显示了 Sebek 部署。\n\n![图 7.2 Sebek 部署。（数据来源：*Know Your\
    \ Enemy: Sebek—A Kernel Based Data Capture Tool*，[`old.honeynet.org/papers/sebek.pdf`](http://old.honeynet.org/papers/sebek.pdf)，2012。）](images/pg169_1.jpg)\n\
    \n**图 7.2** Sebek 部署。（数据来源：*Know Your Enemy: Sebek—A Kernel Based Data Capture\
    \ Tool*，[`old.honeynet.org/papers/sebek.pdf`](http://old.honeynet.org/papers/sebek.pdf)，2012。）\n\
    \n在多客户端的情况下，存在客户端互相看到对方数据包的风险。Sebek 在客户端上配置其自己的原始套接字接口以忽略所有传入的 Sebek 数据包。只有服务器可以接收\
    \ Sebek 数据包。由于其全面的日志记录能力，它可用作取证数据收集工具。它有一个 Web 界面，可执行数据分析。\n\n### 7.3.3 Snort_inline\n\
    \n`Snort_inline` 是 Snort 的修改版。它是一种开发的入侵防御系统（IPS），利用现有入侵检测系统（IDS）的签名来对遍历 `snort_inline`\
    \ 的数据包做出决策。决策通常为丢弃、拒绝、修改或允许。\n\n## 7.4 双蜜网系统配置\n\n本节讨论使用 VMware 的双蜜网系统架构和配置。\n\
    \n### 7.4.1 双蜜网架构的实现\n\n图 7.3 显示了使用 VMware Workstation 7 版在一台配备 Intel Pentium\
    \ 4、3.19-GHz CPU、8GB 内存、运行 Windows XP 64 位的个人电脑上实现的双蜜网系统架构。该个人电脑的操作系统在图 7.3 中称为*宿主操作系统*。宿主机连接到我们的家用路由器，并通过它访问互联网。\n\
    \n由于资源不足且为保持建立成本低廉，我们使用虚拟机部署双蜜网系统。使用了一台个人电脑，并在其上安装了 VMware Workstation。VMware\
    \ Workstation 是一个软件包，让用户有机会创建虚拟机，这些虚拟机构成相互互联的虚拟网络。因此，我们创建了双蜜网系统作为一个虚拟网络，从外部世界来看是一个独立的网络。攻击者可定位蜜罐并对其发起攻击。蜜罐通过蜜墙透明地连接到互联网，蜜墙拦截所有出站和入站流量。因此，针对蜜罐的恶意流量（入站）或被攻陷蜜罐产生的恶意流量（出站）均可从蜜墙获取，以供进一步分析和调查。正如我们在第\
    \ 7.2 节中提到的，蜜网 1 和蜜网 2 配置为允许无限制的出站连接。*内部路由器*用于通过将蜜网 1 的所有出站连接重定向到蜜网 2，反之亦然，来保护我们的本地网络。\n\
    \n![图 7.3 双蜜网架构。](img/pg171_1.jpg)\n\n**图 7.3** 双蜜网架构。\n\n### 7.4.2 双蜜网配置\n\n\
    我们的双蜜网系统包含六个组件：本地路由器、内部路由器、局域网、蜜网 1、蜜网 2 和签名生成器。每个子网（无论是本地路由器、内部路由器、局域网、蜜网 1、蜜网\
    \ 2 还是签名生成器）的子网掩码因此均为 255.255.255.0。第 7.4.2.1 节至第 7.4.2.6 节讨论每个组件的配置。\n\n**本地路由器配置**。正如我们在第\
    \ 7.2 节中提到的，本地路由器的功能是通过内部路由器将不需要的流量传递给蜜网 1。例如，如果我们的局域网 IP 地址空间为 212.0.50.0/24，且有一台公共\
    \ Web 服务器，该服务器的 IP 地址为 212.0.50.19。如果网络外部的攻击者针对 212.0.50.0/24 发起蠕虫攻击，蠕虫将扫描受害者的\
    \ IP 地址空间。极有可能会先尝试未使用的 IP 地址（例如 212.0.50.10），然后才是 212.0.50.19。因此，本地路由器将通过内部路由器将数据包重定向到蜜网\
    \ 1。蠕虫攻陷蜜网 1 后，将尝试发起出站连接以危害其他网络。我们配置内部路由器以保护局域网免受蠕虫出站连接的侵害。内部路由器拦截来自蜜网 1 的所有出站连接并将其重定向到蜜网\
    \ 2，后者执行与蜜网 1 相同的任务，形成环路连接。以下是本地路由器机器属性和 IP 表配置的详细信息。\n\n**机器属性**\n\n*   **操作系统：**\
    \ Ubuntu Linux 9.10\n*   **网卡数量：**\n*   三块网卡（`Eth0`、`Eth1` 和 `Eth2`）\n    *  \
    \ `Eth0` 和 `Eth2` 为桥接局域网端口\n    *   `Eth1` 的功能是通过内部路由器将本地路由器与蜜网 1 连接\n*   **IP\
    \ 地址：**\n*   `Eth1`：192.168.50.20\n"
