    ## MAC 网桥


    承接我们在第 1.1 节中对网桥的早期介绍，IEEE 802 标准将网桥定义为在 MAC 层级互连两个或多个 LAN，但将它们保持为独立接入域的设备。网桥在
    MAC 层运行，并对逻辑链路控制及任何其他上层保持透明。尽管设备可以与任何参与 LAN 中的任何其他设备通信，但消息通常仅在发送方所属的 LAN 和接收方所属的
    LAN 中被听到，其余的 LAN 不会观察到此传输（图 1.5）。网桥会在必要时将在某个 LAN 上听到的消息中继或过滤到其他 LAN。中继和过滤基于存储在帧头中的目的地址和源地址。


    ![Figure 1.5 Internal organization of MAC sublayer with bridging. (Data from IEEE
    Standard for Local and Metropolitan Area Networks: Overview and Architecture,
    IEEE Std 802®-2001 [R2007].)](images/pg12_1.jpg)


    **图 1.5** 带网桥功能的 MAC 子层内部组织。（数据源自 *IEEE 标准：局域网和城域网概述与架构*，IEEE Std 802®-2001 [R2007]。）


    ## MAC 地址


    根据 IEEE 802 标准，每个设备^(²) 都使用 MAC 地址。MAC 地址用于帧头中以描述源设备和目的设备，并被网桥用来过滤和中继帧。


    ## 以太网


    以太网是属于 IEEE 802 系列的众多物理层 (PHY)/MAC 标准之一。它是建立有线 LAN 最广泛使用的技术。最初以 *Ethernet* 之名发明，IEEE
    正式将其批准为 *IEEE 标准 802.3*^(³)。


    在以太网中，设备以帧的形式发送消息，长度通常为 512 到 1518 个八位字节。帧包含若干字段，如源地址、目的地址、实际数据长度、实际数据（通常是上层数据包）和帧检验序列。详细的通用帧格式见图
    1.6。


    ![Figure 1.6 Ethernet packet format. (Data from IEEE Standard for Ethernet, IEEE
    Std 802.3-2012.)](img/pg13_1.jpg)


    **图 1.6** 以太网数据包格式。（数据源自 *IEEE 以太网标准*，IEEE Std 802.3-2012。）


    ![Figure 1.7 A bridged LAN. (Data from IEEE Standard for Local and Metropolitan
    Area Networks: Overview and Architecture, IEEE Std 802®-2001 [R2007].)](images/pg14_1.jpg)


    **图 1.7** 一个桥接 LAN。（数据源自 *IEEE 标准：局域网和城域网概述与架构*，IEEE Std 802®-2001 [R2007]。）


    ## 桥接 LAN


    图 1.7 描述了一个典型的 IEEE 802 LAN，其中多个较小的 LAN 通过网桥连接。正如图中所示，网桥拥有多个接口或端口，通过它们连接到多个 LAN
    网段。此外，如果网桥连接两种不同类型的 IEEE PHY/MAC LAN，它可以支持多种 IEEE PHY/MAC 标准^(⁴)。


    如前所述，网桥通过中继和过滤的动作将 LAN 网段连成一个整体，但将它们保持为独立的接入域。除了帧的中继和过滤外，收集和更新用于中继、过滤以及管理目的的必要信息，也是网桥的职责之一。结合图
    1.7 需要考虑的一个重要方面是：当网桥连接遵循不同 LAN 标准的 LAN 网段时，要求连接特定 LAN 的网桥接口支持该 LAN 网段所使用的标准。因此，以太网网段只能连接到网桥的以太网端口，而
    802.5 网段只能通过网桥的 802.5 端口连接。


    ### 1.4.2 互联网协议族


    互联网协议族是一组上层（网络层及以上）协议，其设计目标是在任意规模的网络中，为直接或间接通过其他设备连接的两台主机之间提供端到端的消息传递。由于该协议族中的两个主要协议是
    TCP 和 IP，它通常被称为 *传输控制协议 (TCP)/互联网协议 (IP) 族*。该协议族是 DARPA 发起的研究计划的成果，后来有其他几位贡献者加入。


    TCP/IP 族遵循其自身的网络模型，该模型实际上是在 OSI 参考模型之前设计的。与 OSI 模型不同，该模型只有四层，如图 1.8 所示。


    网络接口层实际上代表了 OSI 模型的两个下层，超出了 IP 协议族的范围，因为该协议族的设计初衷是主要支持各种底层物理网络技术。在分层的背景下，需要理解的一个重要点是：协议和标准并不严格遵循
    OSI 模型的概念层边界；一个协议的职责描述往往涵盖列在多个相邻层中的职责，或者多个协议相互支持以执行某一特定层推荐的任务。图 1.9 显示了属于该协议族的若干协议及其在分层模型中的位置。


    ![Figure 1.8 OSI model versus the Internet model.](img/pg16_1.jpg)


    **图 1.8** OSI 模型与互联网模型的对比。


    ![Figure 1.9 Internet protocol family.](img/pg16_2.jpg)


    **图 1.9** 互联网协议族。


    在本次回顾中，我们将再次重点关注与我们主要讨论内容相关的重要协议和问题。


    ## 互联网协议


    IP...


    ## IP 寻址


    正如我们之前提到的，互联网模型建立在“互联网——网络的网络”这一概念之上。因此，设计者在该模型中纳入了一种寻址方案，它独立于底层技术和协议，但提供了一种以层次化方式对设备进行分组的手段；即，同一网络中的设备将被分配来自同一范围的地址以便于识别，而每个网络将使用不同范围的地址以便于区分。


    IP 有两个版本：IPv4 和 IPv6。IPv6 的一项主要增强是将地址长度从 32 位扩展到 128 位。通常为了可读性，32 位长的 IPv4 地址写作四个十进制数的字符串，由*点*
    (`.`) 分隔，每个数字代表地址中的 8 位。另一方面，128 位长的 IPv6 地址通常写作八个十六进制数的字符串，由*冒号* (`:`) 分隔，每个数字代表地址中的
    16 位。^(⁵)


    ## 传输控制协议


    IP 协议族在传输层提供两种不同的选择：TCP 和用户数据报协议 (UDP)。TCP 的设计目标是在两个端设备之间提供基于连接的数据传输服务，并提供特定的服务保证，如成功交付、流量控制和拥塞控制。通常，选择
    TCP 还是 UDP 由应用层根据其服务需求决定。例如，Web 浏览中使用的超文本传输协议 (HTTP) 基于 TCP。TCP 在第 1.5.2 节中进一步描述。


    ## 用户数据报协议


