- raw: "        *Packet sniffing*. The LAN standards in the IEEE 802 family are generally\
    \ developed with the notion of shared medium where a host can receive all the\
    \ traffic on the link to which it is attached or within its reception range in\
    \ case of a wireless host. In order to avoid the overhead, the network interface\
    \ card looks at the source address in the frame header and stops listening if\
    \ it does not match with its own address or it is not the broadcast address. However,\
    \ the IEEE 802 network interface cards are designed with the possibility of a\
    \ promiscuous mode, in which the network interface card receives all the traffic\
    \ on the medium. This traffic can be collected by a sniffing software to perform\
    \ malicious analysis. In wireless LANs such as 802.11 or in the variations of\
    \ the Ethernet where more than one hosts are in the single collision domain,^([^(14)](#fn14))\n\
    \n        If an Ethernet is switched, that is, each host is connected to a separate\
    \ port, and the switch filters the traffic on each port according to the MAC address\
    \ of the host connected to that port, sniffing using the promiscuous mode is not\
    \ possible due to the fact that now each port is a separate collision domain.\
    \ However, this does not guarantee that sniffing is not possible at all. ARP poisoning\
    \ or spoofing is one approach that can be used to sniff traffic in case of a switched\
    \ Ethernet.\n\n        Ethernet switches have MAC tables or filter tables or content\
    \ addressable memory tables to store the association of a MAC address with one\
    \ of its port numbers, that is, what is the MAC address of the host connected\
    \ on port X. It is not necessary to preconfigure the MAC table; rather, switches\
    \ are designed to work in a plug-and-play fashion. In the beginning, the MAC table\
    \ is empty, but when a frame is received on some port, an entry is created in\
    \ the MAC table for that port with the source address of the frame as the host\
    \ connected on that port. The MAC table is continuously maintained using this\
    \ approach. When there is a frame to forward, the switch looks for the destination\
    \ MAC address in the MAC table to identify the port on which it is connected.\
    \ If an entry is found, the frame is exclusively forwarded on that port; otherwise,\
    \ it is broadcasted on all the ports, except on the port on which this frame is\
    \ received. [Figure 3.10](#08_Chapter03.xhtml#fig3_10) provides a step-by-step\
    \ example of this process.\n\n        ![Figure 3.10 (a) Ethernet switching, in\
    \ the beginning MAC table is empty. (b) A frame from A to B, new entry for A in\
    \ the MAC table; frame will be forwarded on all the ports (except the port on\
    \ which it is received) as there is no MAC entry for the destination B. (c) A\
    \ frame from C to A, new entry for C in the MAC table, forwarded only on the port\
    \ to which A is attached.](images/pg59_1.jpg)\n\n        **Figure 3.10** (a) Ethernet\
    \ switching, in the beginning MAC table is empty. (b) A frame from A to B, new\
    \ entry for A in the MAC table; frame will be forwarded on all the ports (except\
    \ the port on which it is received) as there is no MAC entry for the destination\
    \ B. (c) A frame from C to A, new entry for C in the MAC table, forwarded only\
    \ on the port to which A is attached.\n\n        Since the ARP packets travel\
    \ as Ethernet frames, switches use them to maintain their MAC tables. In case\
    \ of an ARP poisoning or spoofing attack, the switch will insert wrong mapping\
    \ entries in its MAC table, which will make it possible for the intruder to sniff\
    \ packets destined for other hosts.\n\n        *MAC flooding*. MAC flooding is\
    \ another technique to confuse the Ethernet switches and make them stop filtering\
    \ the frames. This attack exploits the fact that switches have a limited amount\
    \ of memory to store MAC tables. When there is not sufficient memory to store\
    \ new entries, most of the switches are configured to broadcast messages, so that\
    \ the LAN connectivity should not be affected, referred to as the *fail open mode*.\
    \ Thus, the whole LAN will become one single collision domain and packet sniffing\
    \ will be possible.\n\n        In the MAC flooding attack, the intruder floods\
    \ the switch with frames and every frame has a different fake MAC address. The\
    \ switch as a result keeps on entering new entries into its MAC table for these\
    \ new MAC addresses and eventually enters into the fail open mode.\n\n       \
    \ *MAC Spoofing*. MAC spoofing, that is, using a different address than the one\
    \ burnt in the network interface card, is permitted on most of the hardware. Intruders\
    \ use this approach quite often to present themselves on the network as authorized\
    \ users. Certainly, this attack requires that the intruder first use some technique\
    \ to identify some valid MAC addresses on the network that can be later used for\
    \ the spoofing purpose.\n\n        ### *3.1.8 DNS Vulnerabilities*\n\n       \
    \ Domain name system (DNS) is an important service on the Internet where DNS servers\
    \ keep mappings between the Internet domain names and host IP addresses associated\
    \ with those domain names. DNS servers are implemented in a hierarchical fashion\
    \ with a group of root DNS servers on the top, top-level domain servers at the\
    \ second layer, and the authoritative DNS servers at the third level. DNS is a\
    \ publicly accessible service to facilitate access to the Internet and its services.\
    \ Due to this fact, DNS is vulnerable just like the other public services on the\
    \ Internet.\n\n        *Intranet DNS spoofing*. Using the sniffing techniques,\
    \ the intruder sniffs for DNS request message generated on the LAN. Since the\
    \ DNS messages are not encrypted, anyone can look into the request content once\
    \ a message is captured. The intruder then spoofs the requesting host by generating\
    \ a DNS reply with wrong information. The wrong DNS information means the requested\
    \ Internet addresses will be mapped to wrong hosts/IPs that can belong to some\
    \ fake sites created by the intruder to capture messages sent by the attacked/victim\
    \ hosts.\n\n        A common approach to capture the DNS requests is to poison\
    \ the gateway/router using the ARP poisoning, so that it has an invalid DNS server\
    \ entry. Thus, the router will be redirecting all the DNS requests to the intruder,\
    \ assuming it as the designated local DNS server. *Internet or remote DNS spoofing*.\
    \ In remote DNS spoofing, the target of the intruder is any client on the Internet\
    \ that can be spoofed. Thus, the approach is different as now there is not one\
    \ single router to be poisoned. Such an attack is possible with the help of Trojans\
    \ that are used to change the DNS settings of the victim. Once that is achieved,\
    \ all the DNS requests of the victim will be sent to the fake DNS server assigned\
    \ by the intruder. The consequences will be the same as in the Intranet DNS spoofing.\n\
    \n        With the help of the Trojans, the intruder can also change the proxy\
    \ server settings of the victim, so that all the traffic that is sent by the victim\
    \ to the proxy server should go to the fake host.\n\n        *DNS cache poisoning*.\
    \ Local DNS servers are maintained in the organizational networks as a cache to\
    \ limit the outgoing DNS traffic and reduce the delays. These caches store the\
    \ historically learnt DNS mappings and for a similar request, a response is provided\
    \ by the cache. The intruder can poison this cache by adding wrong entries or\
    \ changing existing entries.\n\n        ## **3.2 Operating System Vulnerabilities**\n\
    \n        Operating systems (OSs) are softwares designed by humans and like protocols\
    \ may have vulnerabilities that can be exploited by the intruders. The world of\
    \ OSs is very different from the networks and the degree of interoperability is\
    \ not very common. Thus, an attack can only be effective if it is designed precisely\
    \ according to the nature of some OS. Unlike networks, where the identification\
    \ of the protocol can be easily performed by looking at the content of the packet,\
    \ determining the kind of OS requires deeper analysis and more aggressive techniques.\n\
    \n        ### *3.2.1 OS Fingerprinting*"
