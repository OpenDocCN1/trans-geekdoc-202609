    ## MAC bridges


    Following up from our earlier introduction of the bridges in [Section 1.1](#06_Chapter01.xhtml#sch1_1),
    the IEEE 802 standard refers to the bridges as devices that interconnect two or
    more LANs at the MAC layer level but keep them as separate access domains. A bridge
    operates at the MAC layer and remains transparent to the logical link control
    and any other upper layers. Although a device can communicate with any other device
    from any participating LAN, the message is heard usually only in the LAN to which
    the sender belongs and to which the receiver belongs, and the rest of the LANs
    do not observe this transmission ([Figure 1.5](#06_Chapter01.xhtml#fig1_5)). Bridges
    relay or filter the messages heard on some LAN to the other LAN(s), if necessary.
    The relaying and filtering is based on the destination address and the source
    address stored in the frame header.


    ![Figure 1.5 Internal organization of MAC sublayer with bridging. (Data from IEEE
    Standard for Local and Metropolitan Area Networks: Overview and Architecture,
    IEEE Std 802®-2001 [R2007].)](images/pg12_1.jpg)


    **Figure 1.5** Internal organization of MAC sublayer with bridging. (Data from
    *IEEE Standard for Local and Metropolitan Area Networks: Overview and Architecture*,
    IEEE Std 802®-2001 [R2007].)


    ## MAC addresses


    According to IEEE 802 standard, every device^([²](#fn2)) uses MAC addresses. MAC
    addresses are used in the frame headers to describe the source and the destination
    devices and used by bridges to filter and relay the frames.


    ## Ethernet


    Ethernet is one of the many physical (PHY)/MAC standards belonging to the IEEE
    802 family. It is the most widely used technology for establishing wired LANs.
    Originally invented with the name *Ethernet*, IEEE formally ratified it as *IEEE
    Standard 802.3*^([³](#fn3)).


    In Ethernet, devices send messages in the form of frames with the length commonly
    from 512 to 1518 octets. The frame contains several fields such as source address,
    destination address, actual data length, actual data (which is usually an upper
    layer packet), and frame check sequence. A detailed generic frame is described
    in [Figure 1.6](#06_Chapter01.xhtml#fig1_6).


    ![Figure 1.6 Ethernet packet format. (Data from IEEE Standard for Ethernet, IEEE
    Std 802.3-2012.)](images/pg13_1.jpg)


    **Figure 1.6** Ethernet packet format. (Data from *IEEE Standard for Ethernet*,
    IEEE Std 802.3-2012.)


    ![Figure 1.7 A bridged LAN. (Data from IEEE Standard for Local and Metropolitan
    Area Networks: Overview and Architecture, IEEE Std 802®-2001 [R2007].)](images/pg14_1.jpg)


    **Figure 1.7** A bridged LAN. (Data from *IEEE Standard for Local and Metropolitan
    Area Networks: Overview and Architecture*, IEEE Std 802®-2001 [R2007].)


    ## Bridging LANs


    [Figure 1.7](#06_Chapter01.xhtml#fig1_7) describes a typical IEEE 802 LAN where
    several smaller LANs are connected through bridges. As can be seen in the figure,
    bridges have multiple interfaces or ports through which they are connected to
    multiple LAN segments. Furthermore, a bridge can support more than one IEEE PHY/MAC
    standards if it is connecting two different types of IEEE PHY/MAC LANs^([⁴](#fn4)).


    As mentioned earlier, bridges join the LAN segments into one but keep them as
    separate access domains through the actions of relaying and filtering. In addition
    to the relaying and filtering of frames, collecting and updating the necessary
    information for the purpose of relaying and filtering as well as management are
    also among the duties of bridges. One important aspect to consider here, in relation
    to [Figure 1.7](#06_Chapter01.xhtml#fig1_7), is the following: when a bridge joins
    LAN segments that are following different LAN standards, it requires that the
    interface of the bridge to which a particular LAN is connected supports the standard
    being used in that LAN segment. Hence, an Ethernet segment can only be connected
    to the Ethernet port of the bridge and an 802.5 segment can only be connected
    through the 802.5 port of the bridge.


    ### 1.4.2 Internet Protocol Suite


    The Internet protocol suite is a family of upper layer (network and above) protocols
    designed with the objective to provide end-to-end delivery of messages between
    two hosts, connected directly or indirectly through some other devices, in a network
    of any size. Commonly known as *transmission control protocol (TCP)/Internet protocol
    (IP) suite* due to the two major protocols of the family, TCP and IP, this protocol
    family is an outcome of the research initiative taken by DARPA and later joined
    by several other contributors.


    The TCP/IP suite follows its own network model, which in fact is designed before
    the OSI reference model. In contrast to the OSI model, this model has four layers,
    as shown in [Figure 1.8](#06_Chapter01.xhtml#fig1_8).


    The network interface layer actually represents the two lower layers of the OSI
    model and is beyond the scope of the IP suite since this protocol family is designed
    to principally support all kinds of underlying physical network technologies.
    One important point to understand in the context of layering is that protocols
    and standards do not strictly follow the conceptual layer boundaries of the OSI
    model; the job description of a protocol often covers duties that are listed in
    more than adjacent layers or more than one protocol support each other to perform
    the tasks recommended for a certain layer. [Figure 1.9](#06_Chapter01.xhtml#fig1_9)
    displays several protocols belonging to this family and their position in the
    layered model.


    ![Figure 1.8 OSI model versus the Internet model.](images/pg16_1.jpg)


    **Figure 1.8** OSI model versus the Internet model.


    ![Figure 1.9 Internet protocol family.](images/pg16_2.jpg)


    **Figure 1.9** Internet protocol family.


    In this review, once again, we will focus on the protocols and issues that are
    important and relevant to our main discussion.


    ## Internet protocol


    The IP...


    ## IP addressing


    As we mentioned earlier, the Internet model is built on the notion of internet—a
    network of networks. Hence, the designers have incorporated to this model an addressing
    scheme that is independent of lower layer technologies and protocols, but provides
    a mean to group the devices in a hierarchical fashion; that is, the devices in
    the same network will be assigned addresses from the same range for easy identification
    and each network will use a different range of addresses for easy distinguishableness.


    The IP has two versions: IPv4 and IPv6. One major enhancement done in IPv6 is
    the extension of address size from 32 bits to 128 bits. Typically, for the readability
    purpose, a 32-bit-long IPv4 address is written as a string of four decimal numbers
    separated by a *dot* (`.`), where each number represents 8 bits in the address.
    On the other hand, 128-bit-long IPv6 addresses are usually written as a string
    of 8 hexadecimal numbers separated by a *colon* (`:`), where each number represents
    16 bits in the address.^([⁵](#fn5))


    ## Transmission control protocol


    The IP family provides two different options at the transport layer: TCP and user
    datagram protocol (UDP). TCP is designed with the objective to provide a connection-based
    data transmission service between the two end devices with certain service guarantees
    such as successful delivery, flow control, and congestion control. Generally,
    the choice of selecting TCP or UDP is made by the application layer as per its
    service requirements. For example, the hypertext transfer protocol (HTTP) used
    in web browsing is based on the TCP. TCP is further described in [Section 1.5.2](#06_Chapter01.xhtml#sch1_17).


    ## User datagram protocol


    The UDP...

