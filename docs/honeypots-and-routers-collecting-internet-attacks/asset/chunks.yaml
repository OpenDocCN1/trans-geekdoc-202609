- raw: "        Like any other IDPS technology, host-based IDPSs often cause false\
    \ positives and false negatives. However, the accuracy of detection is more challenging\
    \ for host-based IDPSs because they detect events but do not have knowledge of\
    \ the context under which the events occurred. For example, a new application\
    \ may be installed—this could be done by malicious activity or done as part of\
    \ normal host operations. The event’s benign or malicious nature cannot be determined\
    \ without additional context. Therefore, organizations that would like to use\
    \ a host-based IDPS are recommended to use a host-based product that use combinations\
    \ of several detection techniques, which achieve more accurate detection than\
    \ products that use one or a few techniques. As each technique can monitor different\
    \ aspects of a host, using more techniques allows agents to have a more complete\
    \ picture of the events, including additional context.\n\n        Considerable\
    \ tuning and customization are required to achieve better prevention by the host-based\
    \ IDPSs. For example, many rely on observing host activity and developing profiles\
    \ of expected behavior. Others need to be configured with detailed policies that\
    \ define exactly how each application on a host should behave. The policies need\
    \ to be updated as the host environment changes, so that these changes are taken\
    \ into account. Some products permit multiple policies to be configured on a host\
    \ for multiple environments; this is mostly helpful for hosts that function in\
    \ multiple environments, such as a laptop used both within an organization and\
    \ from external locations \\[\n\n        Host-based IDPS agents provide several\
    \ intrusion prevention capabilities, based on the detection techniques they use.\
    \ For example, code analysis techniques can prevent malicious code from being\
    \ executed, and network traffic analysis techniques can stop incoming traffic\
    \ from being processed by the host and can prevent malicious files from being\
    \ placed on the host. Network traffic filtering techniques can block unwanted\
    \ communications. File-system monitoring can prevent files from being accessed,\
    \ modified, replaced, or deleted, which could stop installation of malware, including\
    \ Trojan horses and rootkits, as well as other attacks involving inappropriate\
    \ file access. Other host-based IDPS detection techniques, such as log analysis,\
    \ network configuration monitoring, and file integrity, and attribute checking,\
    \ generally do not support prevention actions because they identify events after\
    \ they have occurred \\[\n\n        *Host-based IDPS limitations*. Host-based\
    \ IDPSs also have some significant limitations. Although agents generate alerts\
