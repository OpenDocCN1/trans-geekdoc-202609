- raw: "        Let us give a practical example to complete the understanding of the\
    \ definition of honeypot. Let us consider that there is a house with three rooms.\
    \ We assume that this house is targeted by the attackers. The house owner needs\
    \ to know who the attacker is and how he compromises the house defense systems\
    \ (i.e., doors locks, money storages, and window grills). The house owner has\
    \ put all his valuable things in first two rooms, and he has set inside the third\
    \ room a camera (hidden), and another camera (hidden) in the front of the room\
    \ to monitor the attacker(s). The other defense systems used for the third room\
    \ are as same as the defense systems used in the first two rooms, but the third\
    \ room does not contain any valuable thing. In this scenario, when attacker breaks\
    \ in or comes to the third room, the camera would capture all the attacker activities.\
    \ So, in this case, the third room is working as the same as a honeypot does,\
    \ because this room gives free movement option for the attacker but records all\
    \ his moves \\[\n\n        ### *5.1.2 History of Honeypots*\n\n        In this\
    \ section, we present a brief history of honeypots \\[\n\n        *   1990/1991—First\
    \ public works documenting honeypot concepts: Clifford Stoll’s *The Cuckoo’s Egg*\
    \ and Bill Cheswick’s *An Evening With Berferd*.\n\n        *   1997—Version 0.1\
    \ of Fred Cohen’s Deception Toolkit was released, one of the first honeypot solutions\
    \ available to the security community \\[\n\n        *   1998—Development began\
    \ on CyberCop Sting, one of the first commercial honeypots sold to the public.\
    \ CyberCop Sting introduces the concept of multiple, virtual systems bound to\
    \ a single honeypot.\n\n        *   1998—Marty Roesch and General Telephone and\
    \ Electric Corporation (GTE) Internetworking begin development on a honeypot solution\
    \ that eventually becomes NetFacade. This work also begins the concept of Snort\
    \ \\[\n\n        *   1998—BackOfficer Friendly (BOF) is released—a free, simple-to-use\
    \ Windows-based honeypot.\n\n        *   1999—Formation of the Honeynet Project\
    \ and publication of the *Know Your Enemy* series of papers. This work helped\
    \ to increase awareness and validated the value of honeypots and honeypot technologies\
    \ \\[\n\n        *   2000/2001—Use of honeypots to capture and study worm activity.\
    \ More organizations adopting honeypots for both detecting attacks and doing research\
    \ on new threats.\n\n        *   2002—A honeypot is used to detect and capture\
    \ in the wild, a new and unknown attack, specifically the *Solaris dtspcd* exploit.\n\
    \n        *Early publications*. Surprisingly little, if any, material can be found\
    \ before 1990 concerning honeypot concepts. The first resource was a book written\
    \ by Clifford Stoll titled *The Cuckoo’s Egg* \\[\n\n        In *The Cuckoo’s\
    \ Egg*, Clifford Stoll discusses a series of true events that occurred over a\
    \ 10-month period in 1986 and 1987. Stoll was an astronomer at Lawrence Berkeley\
    \ Lab who worked with and helped administer a variety of computer systems used\
    \ by the astronomer community. A 75-cent accounting error led him to discover\
    \ that an attacker, code named *Hunter* had infiltrated into one of his systems.\
    \ Instead of disabling the attacker’s accounts and locking him out of the system,\
    \ Stoll decided to allow the attacker to stay on his system. His motives were\
    \ to learn more about the attacker and hunt him down. Over the following months,\
    \ he attempted to discover the attacker’s identity while at the same time protecting\
    \ the various government and military computers the attacker was targeting. Stoll’s\
    \ computers were not honeypots; they were production systems used by the academic\
    \ and research communities. However, he used the compromised systems to track\
    \ the attacker in a manner very similar to the concept of honeypots and honeypot\
    \ technologies. Stoll’s book is not technical; it reads more like a Tom Clancy\
    \ spy novel. What makes the book unique and important for the history of honeypots\
    \ are the concepts Stoll discusses in it.\n\n        The most fascinating thing\
    \ in the book is Stoll’s approach to gaining information without the attacker\
    \ realizing it. For example, he creates a bogus directory on the compromised system\
    \ called SDINET, for strategic defense initiative network. He wanted to create\
    \ material that would attract the attention of the attacker. He then filled the\
    \ directory with a variety of interesting-sounding files. The goal was to waste\
    \ the attacker’s time by compelling him to look through a lot of files. The more\
    \ time he spent on the system, the more time authorities had to track down the\
    \ attacker. Stoll also included documents with different values. By observing\
    \ which particular documents the attacker copied, he could identify the attacker’s\
    \ motives. For example, Stoll provided documents that included those that appeared\
    \ to have financial value and those that had government secrets. The attacker\
    \ bypassed the financial documents and focused on materials about national security.\
    \ This indicated that the attacker’s motives were not financial gain but access\
    \ to highly secret documents \\[\n\n        Bill Cheswick’s paper *An Evening\
    \ with Berferd in Which a Cracker Is Lured, Endured, and Studied* was released\
    \ in 1990. This paper is more technical than *The Cuckoo’s Egg*. It was written\
    \ by security professionals for the security community. Like *The Cuckoo’s Egg*,\
    \ everything in Cheswick’s paper is non-fiction. However, unlike the book, Cheswick\
    \ builds a system that he wants to be compromised—which should be the first documented\
    \ case of a true honeypot. In the paper, he discusses not only how the honeypot\
    \ was built and used, but how a Dutch hacker was studied as he attacked and compromised\
    \ a variety of systems.\n\n        Cheswick initially built a system with several\
    \ vulnerabilities (including Sendmail) to determine what threats existed and how\
    \ they operated. His goal was not to capture someone specific, but rather to learn\
    \ what threatening activity was happening on his networks and systems.\n\n   \
    \     Cheswick’s paper explains not only the different methodologies he used in\
    \ building his system (he never called it a honeypot) but also how these methodologies\
    \ were used. In addition to a variety of services that appeared vulnerable, he\
    \ created a controlled environment called *a jail*, which contained the activities\
    \ of the attacker. He takes us step by step how an intruder (called Berferd) attempts\
    \ to infiltrate the system and what Cheswick was able to learn from the attacker.\
    \ We see how Berferd infiltrated a system using a Sendmail vulnerability and then\
    \ gained control of the system. Cheswick describes the advantages and disadvantages\
    \ of his approach. (This paper is on the CD-ROM that accompanies this book.)\n\
    \n        Both Stoll’s book and Cheswick’s paper are good-read documents. However,\
    \ none of the resources describes how to design and deploy honeypots in detail.\
    \ And neither provides a precise definition of honeypots or explores the value\
    \ of honeypot technologies.\n\n        *Early products*. The first public honeypot\
    \ solution, called *deception toolkit (DTK)* \\[\n\n        Following DTK, in\
    \ 1998, development began on the first commercial honeypot product, CyberCop Sting.\
    \ This honeypot had several features different from DTK. First, it ran on Windows\
    \ NT systems and not Unix. Second, it could emulate different systems at the same\
    \ time, specifically a Cisco router, a Solaris server, and an NT system."
