- raw: "        Sasser is a network worm that was first detected in April 2004. It\
    \ exploits buffer overflow vulnerability in the Windows Local Security Authority\
    \ Service Server (LSASS) attached to TCP port 445. Like other worms, the vulnerability\
    \ allows a remote attacker to execute arbitrary code with system privileges.\n\
    \n        ### *4.4.9 Conficker*\n\n        Conficker, first detected in November\
    \ 2008, targets the Microsoft Windows operating system and exploits a specific\
    \ vulnerability in the server service (svchost.exe), in which an already-infected\
    \ computer uses a special remote procedure call request to force a buffer overflow\
    \ and executes shellcode on another computer. On the source computer, the worm\
    \ establishes an HTTP server listening to a port between 1,024 and 10,000; the\
    \ shellcode on the target computer forces it to connect to this HTTP server to\
    \ download a copy of the worm in DLL form, which is then attached to svchost.exe.\n\
    \n        ### *4.4.10 Allaple*\n\n        Allaple worm is a network worm also\
    \ designed for the Windows platform and was first detected in August 2008. Once\
    \ in execution, Allaple searches local disks for HTML files and inject code into\
    \ them to activate the installed version of itself. Allaple has several variants\
    \ and some of them spread to other network computers by exploiting common buffer\
    \ overflow vulnerabilities or by copying itself to network shares protected by\
    \ weak passwords, such as SRVSVC (MS06-040), RPC- DCOM (MS04-012), PNP (MS05-039),\
    \ and ASN.1 (MS04-007).\n\n        ## **4.5 Polymorphic Worms**\n\n        A polymorphic\
    \ worm is a computer worm that changes its appearance or signature in every attack\
    \ \\[\n\n        ### *4.5.1 Polymorphic Worm Structure*\n\n        Since a polymorphic\
    \ worm changes itself in every attempt, we will have multiple samples of the worm\
    \ different from each other to some extent. Each sample typically consists of\
    \ following components:\n\n        *Protocol framework:* Worms need a vulnerability\
    \ in the host to affect it and continue their propagation. This vulnerability\
    \ is usually associated with a particular application code and an execution path\
    \ in this code that can be activated by some particular type of protocol request(s).\n\
    \n        *Exploit bytes:* This is indeed the attack component of the polymorphic\
    \ worm, and it exploits the target vulnerability.\n\n        *Worm body:* These\
    \ are the main instructions of the worm that are executed on the affected hosts;\
    \ polymorphic worms usually have some differences in the every instance of the\
    \ worm.\n\n        *Polymorphic decryptor:* In order to maintain its polymorphism\
    \ and to be different from instance to instance, polymorphic worms usually have\
    \ the worm body in encrypted form. The decryptor extracts these instructions on\
    \ the affected computer, and based on the decryption logic, a different version\
    \ of worm body is produced.\n\n        *Others bytes:* These are additional instructions\
    \ that usually do not affect the successful execution of both the worm body and\
    \ the exploit bytes.\n\n        ### *4.5.2 Polymorphic Worm Analysis*\n\n    \
    \    From an analyst’s point of view, the binary content of a polymorphic worm\
    \ sample can be classified into three kinds of bytes: invariant, code, and wildcard\
    \ \\[\n\n        *Invariant bytes* have same or fixed value in every possible\
    \ instance of the worm. They can be present in any of the worm parts discussed\
    \ above, and the change in their value will make the worm ineffective. In order\
    \ to generate signature for a polymorphic worm, it is extremely necessary to identify\
    \ the invariant bytes, as these are necessary for the success of the worm as well\
    \ as present in every instance.\n\n        *Code bytes* include executable components\
    \ of the worm such as worm body or decryption routine. Code bytes are the main\
    \ polymorphic content of the worm; however, there could be some part of code bytes\
    \ that is similar across the instances.\n\n        Finally, *wildcard bytes* represent\
    \ part of the worm that can have any value and this variation has no effect on\
    \ the performance of the worm.\n\n        ### *4.5.3 Signature Generation for\
    \ Polymorphic Worms*\n\n        The research on signature generation for polymorphic\
    \ worms is in two major directions. Content-based signature generation focuses\
    \ on the similarities present in the raw bytes of the different instances of a\
    \ worm. On the other hand, behavior-based signatures are produced by analyzing\
    \ the semantics of the worm code. Content-based signatures are advantageous, as\
    \ they treat the worms as strings of bytes and do not consider any other factor.\
    \ This also makes them convenient to be implemented into firewalls or network\
    \ intrusion detection systems.\n\n        ### *4.5.4 Polymorphic Worm Techniques*\n\
    \n        There are different approaches and techniques that are used in the design\
    \ of polymorphic worms to achieve their polymorphism. Following is the description\
    \ of some of those methods \\[\n\n        *Self-Encryption with a Variable Key*.\
    \ In this approach, the body of the worm is encrypted using a variable encryption\
    \ key. Hence, the signature and the statistical characteristics of the worm raw\
    \ bytes are completely diffused. The attack is launched by sending the encrypted\
    \ copy of the worm, the decryption routine, and the key to the victim host. The\
    \ decryption routine, extracts the original program which starts its attack once\
    \ in execution. The effectiveness of this model is primarily based on the decryption\
    \ routine that, if not changed often, would work as the work signature.\n\n  \
    \      Hence, a more sophisticated method to achieve polymorphism is to use a\
    \ different decryption routine with each copy of the worm. This requires that\
    \ several decryption routines are part of the worm, and out of them, one routine\
    \ is randomly selected, but all the routines are encrypted together with the worm\
    \ body. The number of decryption routines embedded in the worm would directly\
    \ increase its length; hence, only a limited number of routines can be added.\
    \ This limitation would make it possible to use all the routines combined as worm\
    \ signature once enough samples of the worm are captured.\n\n        In garbage-code\
    \ insertion, a different set of garbage or useless instructions are added to each\
    \ copy of the worm. For example, inserting some no operation (NOP) instructions\
    \ at different places in the worm body. This will make the analysis of byte sequence\
    \ more difficult due to the garbage content scattered every where in the worm\
    \ body. However, the frequency of NOPs would be very different when compared with\
    \ a non-malicious program, and it can be easily revealed in a statistical analysis.\
    \ Anomaly-based detection systems can use this fact to detect worms. Another approach\
    \ is to produce a sample of the worm minus NOPs by using some executable analysis\
    \ technique and use such samples for signature generation.\n\n        The instruction\
    \ substitution technique replaces an instruction sequence with an equivalent instruction\
    \ sequence but with different appearance. The success of this approach depends\
    \ on how many sequences are substituted in total, because the unchanged sequences\
    \ will work as signature; substituting the entire code, on the other hand, would\
    \ be a voluminous job.\n\n        Code transposition is a slightly modified technique\
    \ that changes the order of the instructions by introducing jump instructions.\
    \ However, the consequences of excessive number of jumps are similar to NOPs.\n\
    \n        Finally, in register reassignment technique, the CPU registers used\
    \ by different instructions are swapped, thus producing an equivalent code but\
    \ with huge number of minor changes spread all over the code and with no statistical\
    \ weakness as in NOP or jumps.\n\n        In [Section 4.7](#09_Chapter04.xhtml#sch4_26),\
    \ we will discuss the approaches that are used to prevent and detect the Internet\
    \ worms.\n\n        ## **4.6 Prevention and Detection of Worms**"
  fmt: "\nSasser is a network worm that was first detected in April 2004. It exploits\
    \ buffer overflow vulnerability in the Windows Local Security Authority Service\
    \ Server (LSASS) attached to TCP port 445. Like other worms, the vulnerability\
    \ allows a remote attacker to execute arbitrary code with system privileges.\n\
    \n### 4.4.9 Conficker\n\nConficker, first detected in November 2008, targets the\
    \ Microsoft Windows operating system and exploits a specific vulnerability in\
    \ the server service (`svchost.exe`), in which an already-infected computer uses\
    \ a special remote procedure call request to force a buffer overflow and executes\
    \ shellcode on another computer. On the source computer, the worm establishes\
    \ an HTTP server listening to a port between 1,024 and 10,000; the shellcode on\
    \ the target computer forces it to connect to this HTTP server to download a copy\
    \ of the worm in DLL form, which is then attached to `svchost.exe`.\n\n### 4.4.10\
    \ Allaple\n\nAllaple worm is a network worm also designed for the Windows platform\
    \ and was first detected in August 2008. Once in execution, Allaple searches local\
    \ disks for HTML files and inject code into them to activate the installed version\
    \ of itself. Allaple has several variants and some of them spread to other network\
    \ computers by exploiting common buffer overflow vulnerabilities or by copying\
    \ itself to network shares protected by weak passwords, such as `SRVSVC` (MS06-040),\
    \ `RPC-DCOM` (MS04-012), `PNP` (MS05-039), and `ASN.1` (MS04-007).\n\n## 4.5 Polymorphic\
    \ Worms\n\nA polymorphic worm is a computer worm that changes its appearance or\
    \ signature in every attack.\n\n### 4.5.1 Polymorphic Worm Structure\n\nSince\
    \ a polymorphic worm changes itself in every attempt, we will have multiple samples\
    \ of the worm different from each other to some extent. Each sample typically\
    \ consists of following components:\n\n*   **Protocol framework:** Worms need\
    \ a vulnerability in the host to affect it and continue their propagation. This\
    \ vulnerability is usually associated with a particular application code and an\
    \ execution path in this code that can be activated by some particular type of\
    \ protocol request(s).\n*   **Exploit bytes:** This is indeed the attack component\
    \ of the polymorphic worm, and it exploits the target vulnerability.\n*   **Worm\
    \ body:** These are the main instructions of the worm that are executed on the\
    \ affected hosts; polymorphic worms usually have some differences in the every\
    \ instance of the worm.\n*   **Polymorphic decryptor:** In order to maintain its\
    \ polymorphism and to be different from instance to instance, polymorphic worms\
    \ usually have the worm body in encrypted form. The decryptor extracts these instructions\
    \ on the affected computer, and based on the decryption logic, a different version\
    \ of worm body is produced.\n*   **Others bytes:** These are additional instructions\
    \ that usually do not affect the successful execution of both the worm body and\
    \ the exploit bytes.\n\n### 4.5.2 Polymorphic Worm Analysis\n\nFrom an analyst’s\
    \ point of view, the binary content of a polymorphic worm sample can be classified\
    \ into three kinds of bytes: invariant, code, and wildcard.\n\n*   **Invariant\
    \ bytes** have same or fixed value in every possible instance of the worm. They\
    \ can be present in any of the worm parts discussed above, and the change in their\
    \ value will make the worm ineffective. In order to generate signature for a polymorphic\
    \ worm, it is extremely necessary to identify the invariant bytes, as these are\
    \ necessary for the success of the worm as well as present in every instance.\n\
    *   **Code bytes** include executable components of the worm such as worm body\
    \ or decryption routine. Code bytes are the main polymorphic content of the worm;\
    \ however, there could be some part of code bytes that is similar across the instances.\n\
    *   Finally, **wildcard bytes** represent part of the worm that can have any value\
    \ and this variation has no effect on the performance of the worm.\n\n### 4.5.3\
    \ Signature Generation for Polymorphic Worms\n\nThe research on signature generation\
    \ for polymorphic worms is in two major directions. Content-based signature generation\
    \ focuses on the similarities present in the raw bytes of the different instances\
    \ of a worm. On the other hand, behavior-based signatures are produced by analyzing\
    \ the semantics of the worm code. Content-based signatures are advantageous, as\
    \ they treat the worms as strings of bytes and do not consider any other factor.\
    \ This also makes them convenient to be implemented into firewalls or network\
    \ intrusion detection systems.\n\n### 4.5.4 Polymorphic Worm Techniques\n\nThere\
    \ are different approaches and techniques that are used in the design of polymorphic\
    \ worms to achieve their polymorphism. Following is the description of some of\
    \ those methods:\n\n*   **Self-Encryption with a Variable Key.** In this approach,\
    \ the body of the worm is encrypted using a variable encryption key. Hence, the\
    \ signature and the statistical characteristics of the worm raw bytes are completely\
    \ diffused. The attack is launched by sending the encrypted copy of the worm,\
    \ the decryption routine, and the key to the victim host. The decryption routine,\
    \ extracts the original program which starts its attack once in execution. The\
    \ effectiveness of this model is primarily based on the decryption routine that,\
    \ if not changed often, would work as the work signature.\n\n    Hence, a more\
    \ sophisticated method to achieve polymorphism is to use a different decryption\
    \ routine with each copy of the worm. This requires that several decryption routines\
    \ are part of the worm, and out of them, one routine is randomly selected, but\
    \ all the routines are encrypted together with the worm body. The number of decryption\
    \ routines embedded in the worm would directly increase its length; hence, only\
    \ a limited number of routines can be added. This limitation would make it possible\
    \ to use all the routines combined as worm signature once enough samples of the\
    \ worm are captured.\n\n*   **Garbage-code insertion.** In garbage-code insertion,\
    \ a different set of garbage or useless instructions are added to each copy of\
    \ the worm. For example, inserting some no operation (`NOP`) instructions at different\
    \ places in the worm body. This will make the analysis of byte sequence more difficult\
    \ due to the garbage content scattered every where in the worm body. However,\
    \ the frequency of `NOP`s would be very different when compared with a non-malicious\
    \ program, and it can be easily revealed in a statistical analysis. Anomaly-based\
    \ detection systems can use this fact to detect worms. Another approach is to\
    \ produce a sample of the worm minus `NOP`s by using some executable analysis\
    \ technique and use such samples for signature generation.\n\n*   **Instruction\
    \ substitution.** The instruction substitution technique replaces an instruction\
    \ sequence with an equivalent instruction sequence but with different appearance.\
    \ The success of this approach depends on how many sequences are substituted in\
    \ total, because the unchanged sequences will work as signature; substituting\
    \ the entire code, on the other hand, would be a voluminous job.\n\n*   **Code\
    \ transposition.** Code transposition is a slightly modified technique that changes\
    \ the order of the instructions by introducing jump instructions. However, the\
    \ consequences of excessive number of jumps are similar to `NOP`s.\n\n*   **Register\
    \ reassignment.** Finally, in register reassignment technique, the CPU registers\
    \ used by different instructions are swapped, thus producing an equivalent code\
    \ but with huge number of minor changes spread all over the code and with no statistical\
    \ weakness as in `NOP` or jumps.\n\nIn [Section 4.7](#09_Chapter04.xhtml#sch4_26),\
    \ we will discuss the approaches that are used to prevent and detect the Internet\
    \ worms.\n\n## 4.6 Prevention and Detection of Worms\n"
  trans: "\n\nSasser 是一种网络蠕虫，最早于 2004 年 4 月被发现。它利用了附着在 TCP 端口 445 上的 Windows 本地安全机构子系统服务\
    \ (LSASS) 中的缓冲区溢出漏洞。与其他蠕虫一样，该漏洞允许远程攻击者以系统权限执行任意代码。\n\n### 4.4.9 Conficker\n\n\
    Conficker 最早于 2008 年 11 月被发现，针对 Microsoft Windows 操作系统，并利用服务器服务 (`svchost.exe`)\
    \ 中的一个特定漏洞。在该漏洞中，一台已感染的计算机使用特殊的远程过程调用请求来强制触发缓冲区溢出，并在另一台计算机上执行 Shellcode。在源计算机上，蠕虫建立一个\
    \ HTTP 服务器，监听 1,024 到 10,000 之间的某个端口；目标计算机上的 Shellcode 强制其连接到此 HTTP 服务器，以下载一份以\
    \ DLL 形式存在的蠕虫副本，随后该副本会附着到 `svchost.exe` 上。\n\n### 4.4.10 Allaple\n\nAllaple 蠕虫是一种专为\
    \ Windows 平台设计的网络蠕虫，最早于 2008 年 8 月被发现。一旦执行，Allaple 会搜索本地磁盘中的 HTML 文件并向其中注入代码，以激活其已安装的副本。Allaple\
    \ 有多个变种，其中一些通过利用常见的缓冲区溢出漏洞，或通过将自身复制到受弱密码保护的网络共享（如 `SRVSVC` (MS06-040)、`RPC-DCOM`\
    \ (MS04-012)、`PNP` (MS05-039) 和 `ASN.1` (MS04-007)）传播到其他网络计算机。\n\n## 4.5 多态蠕虫\n\
    \n多态蠕虫是一种在每次攻击中都会改变其外观或特征码的计算机蠕虫。\n\n### 4.5.1 多态蠕虫结构\n\n由于多态蠕虫在每次尝试中都会改变自身，我们将获得多个彼此在一定程度上不同的蠕虫样本。每个样本通常由以下组件组成：\n\
    \n*   **协议框架：** 蠕虫需要宿主中的漏洞来发起攻击并继续传播。该漏洞通常与特定的应用程序代码以及该代码中可由特定类型的协议请求激活的执行路径相关联。\n\
    *   **攻击字节：** 这是多态蠕虫的攻击组件，用于利用目标漏洞。\n*   **蠕虫主体：** 这些是在受影响主机上执行的蠕虫主要指令；多态蠕虫的每个实例在主体部分通常都有所不同。\n\
    *   **多态解密器：** 为了保持其多态性并使实例之间有所不同，多态蠕虫通常以加密形式保存蠕虫主体。解密器在受影响的计算机上提取这些指令，并根据解密逻辑生成不同版本的蠕虫主体。\n\
    *   **其他字节：** 这些是通常不影响蠕虫主体和攻击字节成功执行的附加指令。\n\n### 4.5.2 多态蠕虫分析\n\n从分析师的角度来看，多态蠕虫样本的二进制内容可分为三类字节：不变字节、代码字节和通配符字节。\n\
    \n*   **不变字节** 在蠕虫的每个可能实例中具有相同或固定的值。它们可能存在于上述讨论的任何蠕虫部分中，其值的改变会导致蠕虫失效。为了生成多态蠕虫的特征码，识别不变字节至关重要，因为这些字节对于蠕虫的成功运行是必要的，且存在于每个实例中。\n\
    *   **代码字节** 包含蠕虫的可执行组件，如蠕虫主体或解密例程。代码字节是蠕虫的主要多态内容；然而，代码字节的某些部分可能在各实例间是相似的。\n*\
    \   最后，**通配符字节** 代表蠕虫中可以取任意值的部分，这种变化对蠕虫的性能没有影响。\n\n### 4.5.3 多态蠕虫特征码生成\n\n针对多态蠕虫特征码生成的研究主要分为两个方向。基于内容的特征码生成关注不同蠕虫实例原始字节中存在的相似性。另一方面，基于行为的特征码则是通过分析蠕虫代码的语义来生成。基于内容的特征码具有优势，因为它们将蠕虫视为字节串处理，而不考虑其他因素。这也使得它们便于部署到防火墙或网络入侵检测系统中。\n\
    \n### 4.5.4 多态蠕虫技术\n\n多态蠕虫的设计采用了不同的方法和技术来实现其多态性。以下是其中一些方法的描述：\n\n*   **使用可变密钥的自我加密。**\
    \ 在此方法中，蠕虫主体使用可变加密密钥进行加密。因此，蠕虫原始字节的特征码和统计特征被完全扩散。攻击通过发送蠕虫的加密副本、解密例程和密钥到受害者主机来发起。解密例程提取原始程序，该程序一旦执行便开始攻击。该模型的有效性主要取决于解密例程，如果解密例程不经常改变，它就会充当蠕虫的特征码。\n\
    \n    因此，实现多态性的一种更复杂的方法是为每个蠕虫副本使用不同的解密例程。这要求蠕虫包含多个解密例程，并从中随机选择一个，但所有例程都与蠕虫主体一起加密。嵌入蠕虫中的解密例程数量会直接增加其长度；因此，只能添加有限数量的例程。这一限制使得在捕获足够多的蠕虫样本后，可以将所有例程组合起来作为蠕虫特征码。\n\
    \n*   **垃圾代码插入。** 在垃圾代码插入中，每个蠕虫副本都会添加一组不同的垃圾或无用指令。例如，在蠕虫主体的不同位置插入一些空操作 (`NOP`)\
    \ 指令。这会使得字节序列的分析因散布在蠕虫主体各处的垃圾内容而变得更加困难。然而，`NOP` 的频率与非恶意程序相比会有很大不同，并且可以在统计分析中轻易被揭示。基于异常的检测系统可以利用这一事实来检测蠕虫。另一种方法是使用可执行文件分析技术生成一个去除\
    \ `NOP` 后的蠕虫样本，并用此类样本进行特征码生成。\n\n*   **指令替换。** 指令替换技术用一个外观不同但功能等效的指令序列来替换原指令序列。该方法的成败取决于总共替换了多少序列，因为未改变的序列将充当特征码；而替换整个代码则是一项浩大的工程。\n\
    \n*   **代码置换。** 代码置换是一种略微修改的技术，通过引入跳转指令来改变指令的顺序。然而，过多跳转指令的后果类似于 `NOP`。\n\n*  \
    \ **寄存器重分配。** 最后，在寄存器重分配技术中，不同指令使用的 CPU 寄存器被交换，从而产生功能等效但包含大量分布在代码各处的微小变化的代码，且不像\
    \ `NOP` 或跳转那样存在统计弱点。\n\n在 4.7 节 中，我们将讨论用于预防和检测互联网蠕虫的方法。\n\n## 4.6 蠕虫的预防与检测\n\n"
