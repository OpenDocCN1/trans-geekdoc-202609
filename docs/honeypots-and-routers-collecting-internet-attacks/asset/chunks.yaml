    and Network Monitoring: A Statistical Viewpoint (Information Science and Statistics)*,
    1st edition, Springer, New York, June 26, 2001.

    *   [10](#11_Chapter06.xhtml#rfn10) M. Rash, A.D. Orebaugh, G. Clark, B. Pinkard,
    and J. Babbin, *Intrusion Prevention and Active Response: Deploying Network and
    Host IPS*, 1st edition, Syngress, Elsevier, Waltham, MA, April 26, 2005.

    *   [11](#11_Chapter06.xhtml#rfn11) S. Northcutt, L. Zeltser, S. Winters, K. Kent,
    and R.W. Ritchey, *Inside Network Perimeter Security*, 2nd edition, Sams, Sams
    Indianapolis, IN, March 14, 2005.

