    # 无线 IDPS 的局限性


    我们应该提到，无线 IDPS 无法检测针对无线网络的某些类型的攻击。攻击者可以被动监控无线流量，而这无法被无线 IDPS 检测到。如果使用了薄弱的安全方法，例如有线等效隐私，攻击者随后可以对收集到的流量进行离线处理，以找到用于保护无线流量安全的加密密钥。有了这个密钥，攻击者可以解密已经收集的流量，以及从同一
    WLAN 收集的任何其他流量。由于无线 IDPS 无法检测针对无线网络的某些类型的攻击，因此它无法完全弥补使用不安全无线网络协议所带来的风险。


    # NBA 系统


    NBA 系统检查网络流量或流量统计数据，以识别产生异常流量流的威胁，例如 DDoS 攻击、某些形式的恶意软件和策略违规。事实上，NBA 系统曾有过许多名称，包括网络行为异常检测软件、NBA
    和响应软件以及网络异常检测软件。NBA 解决方案通常包含传感器和控制台，部分产品还提供管理服务器（有时称为*分析器*）。


    ## NBA 系统传感器


    NBA 系统拥有类似于基于网络的 IDPS 传感器的一些传感器，它们通过嗅探数据包来监控一个或几个网段上的网络活动。这些传感器可以是主动或被动的，其部署位置类似于基于网络的
    IDS 传感器——位于网络之间的边界，使用相同的连接方式。其他 NBA 传感器不直接监控网络，而是依赖路由器和其他网络设备提供的网络流信息。流是指发生在主机之间的特定通信会话。典型的流数据包括源和目的
    IP 地址、源和目的 TCP 或 UDP 端口或互联网控制消息协议类型和代码、会话中传输的数据包数量和字节数，以及会话开始和结束的时间戳。


    ## NBA 系统安全功能


    NBA 技术可以检测多种类型的恶意活动。大多数 NBA 系统产品主要使用基于异常的检测，并结合一些有状态协议分析技术。因此，大多数 NBA 技术不提供基于特征的检测能力，除非允许管理员手动设置自定义过滤器，这些过滤器本质上是用于检测或阻止特定攻击的特征。NBA
    传感器检测到的大多数授权活动类型包括基于网络的 DoS 攻击、网络扫描、蠕虫、意外应用服务的使用以及策略违规（例如，主机尝试联系另一台没有合法理由通信的主机）。NBA
    传感器具备确定攻击源头的能力。例如，如果蠕虫感染了网络，NBA 传感器可以分析蠕虫的流量，找出组织网络中最先传播蠕虫的主机。


    正如我们上面提到的，NBA 传感器基于异常检测，因此它们主要通过检测与正常行为的显著偏差来工作；它们在检测短时间内产生大量网络活动的攻击（例如 DDoS 攻击）和具有异常流模式的攻击（例如蠕虫在主机间传播）时最为准确。缓慢进行的攻击不太可能被
    NBA 传感器准确检测到，因为在攻击活动达到与预期显著不同的程度之前，它们无法检测到许多攻击。NBA 软件检测到攻击的时点可能因 NBA 产品的配置而有很大差异。将传感器配置为对异常活动更敏感，会在攻击发生时更快地生成警报，但也更有可能触发更多误报。反之，如果将传感器配置为对异常活动不那么敏感，误报会减少，但警报生成会变慢，导致攻击持续更长时间。环境中的良性变化也可能导致误报。例如，如果向主机添加了新服务且主机开始使用它，NBA
    传感器很可能会将其检测为异常行为。


    NBA 技术主要依赖于观察网络流量并建立预期流的基线和主机特征清单。NBA 产品提供对其基线的自动更新，从而加快对未授权活动的预防。管理员可能会定期调整阈值（例如，多少额外的带宽使用量应触发警报），以考虑环境的变化。


    我们之前提到过 NBA 系统基于异常检测，但少数 NBA 产品提供有限的基于特征的检测能力。支持的特征往往非常简单，主要是在 IP、TCP、UDP 或互联网控制消息协议头部的特定字段中查找特定值。基于特征的能力对内联
    NBA 传感器最有帮助，因为它们可以利用特征查找并阻止防火墙或路由器可能无法阻止的攻击。然而，即使没有特征能力，内联 NBA 传感器也可能因其流模式而能够检测并阻止攻击。


    ## NBA 信息收集能力


    NBA 技术凭借广泛的信息收集能力超越了其他技术，因为大多数 NBA 产品的检测技术都需要了解组织主机的特征。此外，NBA 传感器可以自动创建并维护在组织受监控网络上通信的主机列表。它们可以监控端口使用情况，执行被动指纹识别，并使用其他技术收集主机的详细信息。通常为每台主机收集的信息包括
    IP 地址、操作系统的类型和版本、主机提供的网络服务，以及主机与其他主机通信的性质。NBA 传感器持续监控网络活动中该信息的变化。每台主机流的附加信息也会持续收集。


    ## NBA 入侵防御能力


    NBA 传感器提供各种入侵防御能力，包括向端点发送 TCP 重置数据包、执行内联防火墙操作以及重新配置其他网络安全设备。大多数 NBA 系统实施有限地使用防御能力或根本不使用，这是由于误报的原因；错误地阻断单个流可能会导致网络通信中断。防御能力最常用于
    NBA 传感器阻断特定已知攻击时，例如新型蠕虫。


    '
