- raw: "### *1.3.1 Wide Area Network*\n\nA WAN is a network that comprises devices\
    \ distributed over a vast area, for example, a state or a continent, or even bigger.\
    \ Thus, the Internet is usually referred to as a WAN; in fact, it is the largest\
    \ WAN. Similarly, the nationwide network of some Internet service provider is\
    \ also an example of WAN.\n\n### *1.3.2 Local Area Network*\n\nA LAN is usually\
    \ limited to a building or a group of adjacent buildings under one administration.\
    \ The geographical limits of LAN are not that precise and terms such as *campus\
    \ area network* are also used in situations when the area covered by a LAN is\
    \ significantly large. However, technically, a network is considered a LAN when\
    \ all the participating devices are interconnected using privately laid physical\
    \ topology and is under one administration. This definition also leads us to the\
    \ conclusion that when an organization’s business is spread over a metropolitan\
    \ area or wide area, in almost all the cases the organization’s MAN or WAN is\
    \ *logically* spread over the physical network laid by some other organization,\
    \ usually the owner of the public telephone and data networks in that area.\n\n\
    The protocols and technologies used in LANs and WANs are also different, once\
    \ again mainly due to the different attenuation features of the physical medium\
    \ used.\n\n## **1.4 Network Protocols and Standards**\n\nAlthough devices and\
    \ medium are the physical components of a computer network, the importance of\
    \ protocols is no less in the success of communication, as devices require a well-established\
    \ plan to follow. Protocols describe actions to be performed and guidelines to\
    \ be followed by the devices during communication. As mentioned earlier, the OSI\
    \ reference model is the fundamental document of communication in computer networks.\
    \ Protocols in most of the cases target the work plan of the OSI model; however,\
    \ there is no single protocol that targets all the seven layers of the OSI model.\
    \ A single protocol usually targets the job of an individual layer and protocols\
    \ are always associated with the respective OSI layer. In order to perform communication,\
    \ a device follows multiple protocols, which work in a cooperative fashion. This\
    \ necessitates that protocols should be compliant to each other. Due to this fact,\
    \ protocols evolve in the form of families or groups, where a family constitutes\
    \ of protocols belonging to different OSI layers and compliant to each other.\n\
    \nThe category of protocols and standards is in fact very rich and endless; however,\
    \ in this section, we will limit our discussion to the relevant items from this\
    \ list. The term *standard* in computer networks loosely refers to a protocol\
    \ or model or an architecture or a combination thereof that is designed or ratified\
    \ by some established authority or organization, such as IEEE, for wider commercial\
    \ use.\n\n### *1.4.1 IEEE 802 Standards Family*\n\nThe IEEE 802 is a group of\
    \ standards for LANs and MANs. It targets the communication tasks belonging to\
    \ the first two layers of the OSI model. The IEEE 802 LAN and MAN reference model\
    \ further divides the data link layer into two sub layers: medium access control\
    \ (MAC) and logical link control, as shown in [Figure 1.2](#06_Chapter01.xhtml#fig1_2)\
    \ \\[\n\nThe IEEE 802 LANs and MANs are packet-based networks where message is\
    \ transmitted as a sequence of data octets; most of the commercially available\
    \ devices and applications are supported by these standards. The packets are technically\
    \ referred to as *frames* at this level. The MAC sublayer is primarily responsible\
    \ for the connectionless frame transfer between the two devices, while logical\
    \ link control is more concerned with the services such as management, security,\
    \ or acknowledgment ([Figure 1.3](#06_Chapter01.xhtml#fig1_3)) \\[\n\nThe IEEE\
    \ 802 standards family has individual standards for several types of physical\
    \ medium, as displayed in [Figure 1.4](#06_Chapter01.xhtml#fig1_4). Each standard\
    \ is a collection of protocols and guidelines for a certain physical medium and\
    \ the relevant MAC layer, for example, Ethernet, wireless LAN, and broadband wireless\
    \ MANs. All kinds of MAC provide a common service with core features to the logical\
    \ link control through the MAC service access point \\[ ![Figure 1.2 IEEE 802\
    \ LAN and MAN reference model for end stations. LLC—logical link control, MAC—medium\
    \ access control, LSAP—link service access point, MSAP—MAC service access point,\
    \ And PhSAP—physical service access point. (Data from IEEE Standard for Local\
    \ and Metropolitan Area Networks: Overview and Architecture, IEEE Std 802®-2001\
    \ \\[R2007\\].)](images/pg10_1.jpg)\n\n**Figure 1.2** IEEE 802 LAN and MAN reference\
    \ model for end stations. LLC—logical link control, MAC—medium access control,\
    \ LSAP—link service access point, MSAP—MAC service access point, And PhSAP—physical\
    \ service access point. (Data from *IEEE Standard for Local and Metropolitan Area\
    \ Networks: Overview and Architecture*, IEEE Std 802®-2001 \\[R2007\\].)\n\n![Figure\
    \ 1.3 IEEE 802 reference model with end-station management and security. LMM—\
    \ LAN/MAN management and SDE—secure data exchange. (Data from IEEE Standard for\
    \ Local and Metropolitan Area Networks: Overview and Architecture, IEEE Std 802®-2001\
    \ \\[R2007\\].)](images/pg10_2.jpg)\n\n**Figure 1.3** IEEE 802 reference model\
    \ with end-station management and security. LMM— LAN/MAN management and SDE—secure\
    \ data exchange. (Data from *IEEE Standard for Local and Metropolitan Area Networks:\
    \ Overview and Architecture*, IEEE Std 802®-2001 \\[R2007\\].)\n\n ![Figure 1.4\
    \ IEEE 802 standards family. (Data from IEEE Standard for Local and Metropolitan\
    \ Area Networks: Overview and Architecture, IEEE Std 802®-2001 \\[R2007\\].)](images/pg11_1.jpg)\n\
    \n**Figure 1.4** IEEE 802 standards family. (Data from *IEEE Standard for Local\
    \ and Metropolitan Area Networks: Overview and Architecture*, IEEE Std 802®-2001\
    \ \\[R2007\\].)\n\nOriginally, the standard viewed LAN as a peer-to-peer communication\
    \ network with shared medium and information broadcasted to all the stations.\
    \ However, later the use of bridges for the interconnection of LANs and related\
    \ features are also included. In fact, the ability to communicate directly without\
    \ any intermediate switching node is the second distinguishing point in the IEEE\
    \ definition of LAN and MAN, after the difference in their geographical area.\
    \ Within its scope, the standard discusses two types of LAN interconnecting devices:\
    \ bridges (discussed in [Section 1.1](#06_Chapter01.xhtml#sch1_1)) for MAC layer\
    \ interconnectivity and repeaters and hubs for physical layer interconnectivity.\
    \ In order to understand the difference between the two categories, we need to\
    \ review the term *access domain* \\[\n\n*Access domain*. A group of devices and\
    \ media in a LAN or MAN where a single MAC protocol is being used and the medium\
    \ is shared among all the devices is called *access domain*. In such a situation,\
    \ at most one device transmits and all the other connected to the medium receive.\
    \ A repeater connects the two LANs in such a way that both become one single access\
    \ domain, implying when one device, from any participating LAN, transmits all\
    \ the other devices on all the connected LANs will receive. Repeaters are useful\
    \ when we are interested in increasing the range of a LAN, may be due to the technological\
    \ limitations of the media such as signal attenuation. The term *hub* is used\
    \ to refer to repeaters when the devices in a LAN are connected using star-wired\
    \ topology \\["
