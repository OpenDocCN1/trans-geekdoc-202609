    ## 3.1.7 Packet Sniffing


    IEEE 802 系列 LAN 标准通常基于共享介质的概念开发，主机可以接收其连接链路上的所有流量，或在无线主机的接收范围内的所有流量。为了避免开销，网络接口卡会检查帧头中的源地址，如果不匹配自己的地址也不是广播地址，则停止监听。然而，IEEE
    802 网络接口卡设计有混杂模式，在此模式下网卡接收介质上的所有流量。嗅探软件可收集这些流量进行恶意分析。在无线 LAN（如 802.11）或多个主机处于单一冲突域的以太网变体中，^([^(14)](#fn14))


    如果以太网是交换式的，即每个主机连接到独立端口，交换机根据连接主机的 MAC 地址过滤各端口流量，则无法使用混杂模式进行嗅探，因为现在每个端口都是独立的冲突域。但这不保证完全无法嗅探。ARP
    投毒或欺骗是可在交换式以太网中嗅探流量的一种方法。


    以太网交换机拥有 MAC 表、过滤表或内容可寻址存储器表，用于存储 MAC 地址与端口号的关联（即连接在端口 X 上的主机的 MAC 地址）。无需预配置 MAC
    表；交换机设计为即插即用。初始时 MAC 表为空，当某端口收到帧时，会以该帧的源地址为该端口连接的主机，在 MAC 表中为该端口创建条目。MAC 表持续通过这种方式维护。转发帧时，交换机在
    MAC 表中查找目的 MAC 地址以确定其连接的端口。若找到条目，帧仅转发到该端口；否则，除接收帧的端口外，向所有端口广播。[图 3.10](#08_Chapter03.xhtml#fig3_10)
    给出了该过程的分步示例。


    ![图 3.10 (a) 以太网交换，初始 MAC 表为空。(b) 从 A 到 B 的帧，MAC 表中新建 A 的条目；因无 B 的 MAC 条目，帧将转发到所有端口（除接收端口外）。(c)
    从 C 到 A 的帧，MAC 表中新建 C 的条目，仅转发到 A 所连的端口。](images/pg59_1.jpg)


    **图 3.10** (a) 以太网交换，初始 MAC 表为空。(b) 从 A 到 B 的帧，MAC 表中新建 A 的条目；因无 B 的 MAC 条目，帧将转发到所有端口（除接收端口外）。(c)
    从 C 到 A 的帧，MAC 表中新建 C 的条目，仅转发到 A 所连的端口。


    由于 ARP 数据包作为以太网帧传输，交换机利用它们维护 MAC 表。在 ARP 投毒或欺骗攻击中，交换机会在其 MAC 表中插入错误映射条目，使入侵者能够嗅探发往其他主机的数据包。


    ### MAC Flooding


    MAC Flooding 是另一种混淆以太网交换机、使其停止过滤帧的技术。该攻击利用交换机存储 MAC 表的内存有限这一事实。当内存不足以存储新条目时，大多数交换机配置为广播消息，以免影响
    LAN 连接，称为“故障开启模式”。于是整个 LAN 变成单一冲突域，包嗅探成为可能。


    在 MAC Flooding 攻击中，入侵者用帧淹没交换机，每个帧都有不同的伪造 MAC 地址。交换机因此不断为这些新 MAC 地址在 MAC 表中创建新条目，最终进入故障开启模式。


    ### MAC Spoofing


    MAC Spoofing（即使用不同于网卡烧录地址的地址）在大多数硬件上被允许。入侵者常用此法在网络上伪装成授权用户。当然，这要求入侵者先用某种技术识别网络上一些有效的
    MAC 地址，以便稍后用于欺骗。


    ## 3.1.8 DNS Vulnerabilities


    域名系统（DNS）是互联网上的重要服务，DNS 服务器保存互联网域名与其关联的主机 IP 地址之间的映射。DNS 服务器以层级方式实现：顶层为一组根 DNS
    服务器，第二层为顶级域服务器，第三层为权威 DNS 服务器。DNS 是公开可访问的服务，便于访问互联网及其服务。因此，DNS 与互联网上的其他公共服务一样脆弱。


    ### Intranet DNS Spoofing


    入侵者利用嗅探技术捕获 LAN 上生成的 DNS 请求报文。由于 DNS 报文未加密，捕获报文后任何人都可查看请求内容。入继而伪造 DNS 回复，向请求主机提供错误信息。错误的
    DNS 信息意味着请求的互联网地址会映射到错误的主机/IP，这些可能属于入侵者创建的伪造站点，用于捕获受害主机发送的报文。


    捕获 DNS 请求的常用方法是利用 ARP 投毒攻击网关/路由器，使其拥有无效的 DNS 服务器条目。于是路由器将所有 DNS 请求重定向给入侵者，误以为其为指定的本地
    DNS 服务器。


    ### Internet or Remote DNS Spoofing


    在远程 DNS 欺骗中，入侵者的目标是互联网上可被欺骗的任意客户端。方法不同，因为不再只有一个路由器可被投毒。此类攻击借助木马修改受害者的 DNS 设置。一旦实现，受害者的所有
    DNS 请求将发送到入侵者指定的伪造 DNS 服务器。后果与 Intranet DNS Spoofing 相同。


    借助木马，入侵者还可修改受害者的代理服务器设置，使受害者发往代理服务器的所有流量转到伪造主机。


    ### DNS Cache Poisoning


    组织网络中维护本地 DNS 服务器作为缓存，以限制外发 DNS 流量并减少延迟。这些缓存存储历史学习的 DNS 映射，对相似请求由缓存响应。入侵者可通过添加错误条目或修改现有条目来投毒此缓存。


    ## 3.2 Operating System Vulnerabilities


    操作系统（OS）是人类设计的软件，像协议一样可能存在可被入侵者利用的漏洞。OS 世界与网络世界截然不同，互操作性不高。因此，攻击只有针对特定 OS 的性质精心设计才有效。与网络中通过查看包内容即可轻松识别协议不同，确定
    OS 类型需要更深入的分析和更激进的技术。


    ### 3.2.1 OS Fingerprinting

