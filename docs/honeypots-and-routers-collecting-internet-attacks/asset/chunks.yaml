    # Wireless IDPS Limitations


    We should mention that the wireless IDPSs cannot detect certain types of attacks
    against wireless networks. An attacker can passively monitor wireless traffic,
    which is not detectable by wireless IDPSs. If weak security methods are used,
    for example, wired equivalent privacy, the attacker can then perform offline processing
    of the collected traffic to find the encryption key used to provide security for
    the wireless traffic. With this key, the attacker can decrypt the traffic that
    was already collected, as well as any other traffic collected from the same WLAN.
    As the wireless IDPSs cannot detect certain types of attacks against wireless
    networks, it cannot fully compensate for the use of insecure wireless networking
    protocols.


    # NBA System


    An NBA system examines network traffic or traffic statistics to identify threats
    that generate unusual traffic flows, such as DDoS attacks, certain forms of malware,
    and policy violations. In fact, NBA systems have been known by many names, including
    network behavior anomaly detection software, NBA and response software, and network
    anomaly detection software. NBA solutions usually have sensors and consoles, and
    some products also offer management servers (which are sometimes called *analyzers*).


    ## NBA System Sensors


    The NBA system has some sensors similar to network-based IDPS sensors, which sniff
    packets to monitor network activity on one or a few network segments. These sensors
    may be active or passive and are placed similarly to network-based IDS sensors—at
    the boundaries between networks, using the same connection methods. Other NBA
    sensors do not monitor the networks directly, but instead rely on network flow
    information provided by routers and other networking devices. Flow refers to a
    particular communication session occurring between hosts. Typical flow data include
    source and destination IP addresses, source and destination TCP or UDP ports or
    Internet control message protocol types and codes, the number of packets and number
    of bytes transmitted in the session, and timestamps for the start and end of the
    session.


    ## NBA System Security Capabilities


    NBA technologies can detect several types of malicious activities. Most NBA system
    products use primarily anomaly-based detection, along with some stateful protocol
    analysis techniques. Therefore, most NBA technologies offer no signature-based
    detection capability, other than allowing administrators to manually set up custom
    filters that are essentially signatures to detect or stop specific attacks. Most
    of the types of authorized activities detected by NBA sensors include network-based
    DoS attacks, network scanning, worms, the use of unexpected application services,
    and policy violations (e.g., a host attempting to contact another host with which
    it has no legitimate reason to communicate). The NBA sensors have the ability
    to determine the origin of an attack. For example, if worms infect a network,
    NBA sensors can analyze the worm''s flows and find the host on the organization''s
    network that first transmitted the worm.


    As we had mentioned above, the NBA sensors are anomaly-based detection, so they
    work primarily by detecting significant deviations from normal behavior; they
    are most accurate in detecting attacks that generate large amounts of network
    activity in a short period of time (e.g., DDoS attacks) and attacks that have
    unusual flow patterns (e.g., worms spreading among hosts). Attacks that are conducted
    slowly are less accurately detected by NBA sensors, because they cannot detect
    many attacks until they reach a point where their activity is significantly different
    from what is expected. The point during the attack at which the NBA software detects
    it may vary considerably depending on an NBA product''s configuration. Configuring
    sensors to be more sensitive to anomalous activities will cause alerts to be generated
    more quickly when attacks occur, but more false positives are also likely to be
    triggered. Conversely, if sensors are configured to be less sensitive to anomalous
    activity, there will be fewer false positives, but alerts will be generated more
    slowly, allowing attacks to occur for longer periods of time. False positives
    can also be caused by benign changes in the environment. For example, if a new
    service is added to a host and hosts start using it, an NBA sensor is likely to
    detect this as anomalous behavior.


    NBA technologies depend mainly on observing network traffic and developing baselines
    of expected flows and inventories of host characteristics. NBA products provide
    automatic update to their base line, which speed up the prevention against unauthorized
    activities. Administrators might adjust thresholds periodically (e.g., how much
    additional bandwidth usage should trigger an alert) to take into account changes
    to the environment.


    We mentioned before that the NBA system is anomaly-based, but a few NBA products
    offer limited signature-based detection capabilities. The supported signatures
    tend to be very simple, primarily looking for particular values in certain IP,
    TCP, UDP, or Internet control message protocol header fields. The signature-based
    capability is most helpful for in-line NBA sensors because they can use the signatures
    to find and block attacks that a firewall or router might not be capable of blocking.
    However, even without a signature capability, an in-line NBA sensor might be able
    to detect and block the attack because of its flow patterns.


    ## NBA Information Gathering Capabilities


    NBA technologies overcome other technologies by offering extensive information
    gathering capabilities, because knowledge of the characteristics of the organization''s
    hosts is needed for most of the NBA product''s detection techniques. Additionally,
    NBA sensors can automatically create and maintain lists of hosts communicating
    on the organization''s monitored networks. They can monitor port usage, perform
    passive fingerprinting, and use other techniques to gather detailed information
    on the hosts. Information typically collected for each host includes IP address,
    the type and version of the operating system, the network services the host provides,
    and the nature of the host''s communications with other hosts. NBA sensors constantly
    monitor network activity for changes to this information. Additional information
    on each host''s flows is also collected on an ongoing basis.


    ## NBA Intrusion Prevention Capabilities


    NBA sensors provide various intrusion prevention capabilities, including sending
    TCP reset packets to endpoints, performing in-line firewalling, and reconfiguring
    other network security devices. Most NBA system implementations use prevention
    capabilities in a limited fashion or not at all because of false positives; erroneously
    blocking a single flow could cause major disruptions in network communications.
    Prevention capabilities are most often used for NBA sensors when blocking a specific
    known attack, such as a new worm.

    '
