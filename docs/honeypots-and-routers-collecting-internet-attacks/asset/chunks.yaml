    # TCP 端口扫描技术


    TCP 是互联网上应用最广泛的传输层协议，因为它提供了大多数应用程序所需的可靠、有序的交付。然而，这是以操作复杂性和大量漏洞为代价的。在发送实际应用消息之前，TCP
    连接通过三次握手过程建立。基于 TCP 的行为，特别是在连接建立阶段，可以应用多种技术来揭示目标网络/主机的详细信息。一种常见的方法是向目标主机发送不同类型的
    TCP 段，以识别目标上端口的开放/关闭状态。这种攻击方法通常被称为*端口扫描*。


    ![Figure 3.2 HTTP tunneling process.](img/pg49_1.jpg)


    **图 3.2** HTTP 隧道过程。


    ## TCP Connect/Full Open Scan（TCP 连接/全开放扫描）


    客户端主机尝试在某个端口上与目标主机建立一个正常的 TCP 连接。如果该端口开放了 TCP 服务，则通过执行三次握手成功建立连接；否则，将收到一个带有复位（RST）位的
    TCP 段，指示该端口未开放连接（图 3.3b）。这种扫描技术也被称为*Vanilla scan*（香草扫描）——即入侵者对所有 65,536 个端口进行全开放扫描。常规
    TCP 行为（全开放扫描也遵循该行为）是在步骤 3 中响应一个确认（ACK）段，并继续传输应用消息（图 3.3a）。


    ## Slow Scan（慢速扫描）


    Vanilla scan——即基于全开放扫描方法对目标系统的所有端口进行扫描——有一个缺点：大多数主机会记录成功的 TCP 连接；因此，管理员可以通过观察日志来识别此类攻击，当他们发现不同端口上有如此多的成功连接尝试时。为了避免这个问题，一种方法是在合理的间隔后尝试下一个端口——即以降低速度进行扫描。慢速扫描是最简单的隐蔽扫描方法。


    ![Figure 3.3 (a) TCP connection handshake when target port is open. (b) TCP connection
    handshake when target port is closed.](img/pg50_1.jpg)


    **图 3.3** (a) 目标端口开放时的 TCP 连接握手。(b) 目标端口关闭时的 TCP 连接握手。


    ## Half Open/SYN Scan（半开放/SYN 扫描）


    全开放扫描的另一个重要方面是，握手的第三步不会揭示关于端口状态的任何额外信息，这一点在图 3.3 中可以轻松看出。因此，在同步（SYN）扫描中，如果端口开放，客户端将响应一个
    TCP RST 段以立即销毁正在进行的连接请求（图 3.3a）。SYN 扫描也被认为是隐蔽扫描方法之一，因为它试图避免被管理员察觉。


    ## Xmas or Xmas-Tree Scan（Xmas 或圣诞树扫描）


    Xmas 扫描是另一种隐蔽方法，客户端向目标主机发送无效的 TCP 标志组合。如果目标系符合 RFC 793 中的 TCP 规范，它会在端口关闭时响应一个
    TCP RST 段，或在端口开放时忽略该段。这种攻击通常仅适用于 UNIX 主机；Windows 机器总是忽略此类段。Xmas 扫描有两种变体。第一种变体仅使用结束（FIN）、紧急（URG）和推送（PSH）标志——即在段中设置这三个标志。在第二种变体中，设置所有
    TCP 标志（图 3.4）。


    ## FIN Scan（FIN 扫描）


    FIN 扫描是一种类似于 Xmas 扫描的方法，因为它也在接收到的段中使用意外的 TCP 标志组合。然而，在 FIN 扫描中，仅设置 FIN 标志。这样的段是意外的，因为
    FIN 段通常发送用于指示关闭已建立连接的意图，而这里客户端和目标之间没有工作连接。在这种情况下，关闭的端口再次响应一个 TCP RST 段，而开放的端口忽略此类段。


    ## Null Scan（空扫描）


    Null 扫描可以被视为与 Xmas 扫描相反的方法，因为在这种情况下，发送的 TCP 段所有标志均未设置。在 TCP 中，这样的段确实是在成功建立连接后传输的正常数据段。由于目标主机与客户端没有建立连接，如果目标端口开放，它将丢弃该数据包。如果端口关闭，它将响应一个
    TCP RST 段。Null 扫描的成功取决于目标主机中 TCP 协议栈的实现，通常此类段在 Microsoft 平台上会被阻止。


    ![Figure 3.4 TCP Xmas-tree scan process.](img/pg51_1.jpg)


    **图 3.4** TCP 圣诞树扫描过程。


    ## Inverse Flag Scans（反向标志扫描）


    Xmas-tree、FIN 和 null 扫描也被称为*反向*或*反向标志扫描*，因为在这些扫描中，目标端的关闭端口会回复一个段，而开放端口不响应。


    ## ACK Scan（ACK 扫描）


    另一种通过发送意外 TCP 段来利用目标的方法是在段中设置 ACK 标志。ACK 段通常作为握手过程的第三步发送，或用于确认成功接收数据段。^(¹³)


    ## Fragmented Scan（分片扫描）


    为了避免被防火墙检测到，不同 TCP 扫描中用于提高有效性的一种方法是将 TCP 头部分割成多个 Internet 协议（IP）片段——即在多个 IP 数据报中发送探测段。大多数入侵检测系统在
    TCP 头部分片时无法检测到扫描。


    ## Idle or Dumb Scan（空闲或哑扫描）


    空闲扫描是一种复杂但聪明的攻击，借助第三方主机执行，通常称为*哑*或*僵尸主机*，因为它无意中参与了攻击。该攻击利用了这样一个事实：主机生成的所有 IP 数据报都被分配一个*片段标识号*，并且每个新数据报的片段
    ID 比前一个生成的数据报大 1。因此，如果主机 X 从主机 Y 接收到没有间隙的 IP 数据报片段 ID，这表明主机 Y 目前没有与任何其他主机通信。


    在空闲攻击中，入侵者与哑主机通信并观察 IP 片段 ID 的增量；可以使用任何反向标志扫描方法来实现此目的。选择主机作为僵尸时要考虑的重要一点是，它是一台空闲主机，目前不产生任何其他
    IP 流量。因此，当反复探测时，僵尸主机发送的 IP 数据报将具有连续的片段 ID。关于这种攻击有趣的是，僵尸主机并不是入侵者的实际目标。入侵者向实际目标主机发送一个
    SYN 段，但使用僵尸主机的 IP 地址——即欺骗 IP 地址。如果目标主机的端口开放，一个 SYN + ACK 段将被发送给僵尸主机，僵尸主机将回复一个
    RST 段，因为它从未对该连接感兴趣。僵尸主机发送给目标主机的这个段将在入侵者通过探测僵尸主机所观察到的 IP 片段 ID 中产生一个间隙，表明目标主机的请求端口是开放的（图
    3.5）。


    '
