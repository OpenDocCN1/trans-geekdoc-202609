    \ An integrated approach, in: Proceedings of the IEEE Workshop on Information\
    \ Assurance and Security, U.S. Military Academy, New York, 2001.\n\n        *\
    \   [7.](#07_Chapter02.xhtml#rfn7) Y. Cherdantseva, and J. Hilton, A reference\
    \ model of information assurance & security, in: Proceedings of the Eighth International\
    \ Conference on Availability, Reliability and Security (ARES), Regensburg, Germany,\
    \ September 2–6, 2013.\n\n        *   [8.](#07_Chapter02.xhtml#rfn8) J. Saltzer,\
    \ and M. Schroeder, The protection of information in computer systems, Proceedings\
    \ of the IEEE 63(9), 1278–1308, 1975.\n\n        *   [9.](#07_Chapter02.xhtml#rfn9)\
    \ Y. Cherdantseva, and J. Hilton, Reference Model of Information Assurance & Security,\
    \ [http://rmias.cardiff.ac.uk/](http://rmias.cardiff.ac.uk/), March 29, 2015.\n\
    \n        *   [10.](#07_Chapter02.xhtml#rfn10) D. Parker, Our excessively simplistic\
    \ information security model and how to fix it, ISSA Journal 8(7), 12–21, July,\
    \ 2010.\n\n        *   [11.](#07_Chapter02.xhtml#rfn11) National Security Agency,\
    \ National Information Systems Security Glossary. NSTISSI 4009, National Security\
    \ Agency, Fort Meade, MD, September 2000.\n\n        *   [12.](#07_Chapter02.xhtml#rfn12)\
    \ G. Stoneburner, NIST Special Publication 800-33: Underlying Technical Models\
    \ for Information Technology Security, Recommendations of the National Institute\
    \ of Standards and Technology, Gaithersburg, MD, December 2001.\n\n        \uFEFF\
    \n\n        # 3 Intrusions and Vulnerabilities\n\n        **HABIB-UR REHMAN**\n\
    \n        Securing the communication and its content is an important concern in\
    \ computer networks due to the fact that most of the physical infrastructure is\
    \ publicly accessible and shared among the users. This fact brings all the security\
    \ goals into play, which we have described in [Chapter 2](#07_Chapter02.xhtml).\
    \ Furthermore, we have reviewed in [Chapter 1](#06_Chapter01.xhtml) that most\
    \ of the protocols used to deliver messages between the end hosts are public.\
    \ Thus, everyone is aware of the sequence of actions that will be performed while\
    \ transmitting a message and could exploit this knowledge to attack the ongoing\
    \ communication. This simply does not mean that nothing is secure in computer\
    \ networks; protocols have evolved to overcome such deficiencies. However, the\
    \ service model of the computer networks in general and the Internet in particular,\
    \ is developed or evolved in such a way that it is impossible to eliminate all\
    \ the weaknesses.\n\n        An intruder exploits the vulnerabilities of a system\
    \ to launch an attack against it; this makes it extremely important for the administrators\
    \ and the rightful users of the system to be well aware of these vulnerabilities.\
    \ The network, the hosts, and the applications running on the hosts can be misused\
    \ if not properly designed and configured. The purpose of this chapter is to highlight\
    \ such issues at all the three levels. We have attempted to compile a comprehensive\
    \ list of commonly known attacks possible.\n\n        ## **3.1 Network and Protocol\
    \ Vulnerabilities**\n\n        Public protocols and their vulnerabilities are\
    \ indeed the biggest source of attacks in computer networks. This section discusses\
    \ the commonly known attacks possible on the protocols such as hypertext markup\
    \ language (HTTP) \\[\n\n        ### *3.1.1 HTTP Banner Grabbing*\n\n        World\
    \ Wide Web is a public service; therefore, the hosts running web servers are configured\
    \ to allow any incoming requests to the port 80, the well-known port for the Web\
    \ service. HTTP, the protocol used for the Web service is designed to reply to\
    \ every HTTP request message with an HTTP response message. Usually, this response\
    \ message contains the main/default page (mostly named as index^([⁹](#fn9)) ![Figure\
    \ 3.1 Typical HTTP response message.](images/pg46_1.jpg)\n\n        **Figure 3.1**\
    \ Typical HTTP response message.\n\n        Banner grabbing is classified as a\
    \ preattack^([^(10)](#fn10))\n\n        Such a banner grabbing attack is applicable\
    \ to the email messages as well, where the header of the received email also contains\
    \ fields with important information. However, the email scenario is different\
    \ from the HTTP scenario as such an analysis can only be performed if one has\
    \ an email in hand.\n\n        *SMTP enumeration*. However, in the SMTP, the protocol\
    \ used to deliver emails to mail servers, an intruder can use the commands VRFY,\
    \ EXPN, and RCPT TO through interfaces such as Telnet prompt to identify which\
    \ email addresses are valid and which are not valid. Thus, the intruder can develop\
    \ a list of valid email addresses that can later be used for malicious activities\
    \ such as Spam messaging.\n\n        ### *3.1.2 HTTP Tunneling*\n\n        Tunneling\
    \ is an important concept in computer networks where the packet of one protocol\
    \ is encapsulated inside the packet of another protocol. This approach is usually\
    \ adopted when the protocol of the hidden/inside packet is not supported by the\
    \ underlying network; usually, this could be due to some administrative restrictions,\
    \ incompatible protocols, or device limitations. Tunneling increases the utility\
    \ of the network as it makes the communication possible even if there are incompatibilities.\
    \ For example, IPv6 datagrams can be shared between the end hosts connected through\
    \ devices (some or all) not supporting IPv6 by establishing an IPv4 tunnel, from\
    \ end to end or for fewer hops as per requirement. Tunneling can be performed\
    \ at any layer or protocol. However, HTTP tunneling is a major concern as the\
    \ HTTP messages are rarely filtered or blocked^([^(11)](#fn11))\n\n        HTTP\
    \ tunneling is performed by using software designed to communicate through the\
    \ HTTP. The client component of the software is installed on the user^([^(12)](#fn12))\n\
    \n        ### *3.1.3 TCP Scanning*"
