    ## Limited software


    Since everything has to run on one box, you are limited to the software you can
    use. For instance, it is difficult to run `Cisco IOS` on an Intel chip.


    ## Hybrid virtual honeynet


    A hybrid virtual honeynet is a combination of the classic honeynet and virtualization
    software. Data capture, such as firewalls, and data control, such as IDS sensors
    and logging, is on a separate, isolated system. This isolation reduces the risk
    of compromise. However, all the honeypots are virtually run on a single box.


    ### Advantages


    *   **Secure:** As we saw with the self-contained virtual honeynets, there is
    a danger of an attacker getting to the other parts of the honeynet (like the firewall).
    With hybrid virtual honeynets, the only danger would be that the attacker accessing
    to the other honeypots.

    *   **Flexible:** You are able to use a wide variety of software and hardware
    for the data control and data capture elements of the Hybrid network. An example
    would be that you can use the `OpenSnort` sensor on the network, or a `Cisco pix`
    appliance. You can also run any kind of honeypot you want because you can just
    drop another computer on the network (in addition to your Virtual honeypot''s
    box).


    ### Disadvantages


    *   **Not portable:** Since the honeynet network will consist of more than one
    box, it makes it more difficult to move.

    *   **Expensive in time and space:** You will have to spend more in terms of power,
    space, and possibly money since there is more than one computer in the network.


    ## Virtualization software


    Hybrid virtual honeynets can allow you to leverage the flexibility of classic
    honeynets and let you increase the amount of honeypots by using virtualization
    software. Now that we have defined the two general categories of virtual honeynets,
    let us highlight some of the possible ways to implement a virtual honeynet. Here,
    we outline three different technologies that will allow you to deploy your own.
    Undoubtedly, there are other options, such as `Bochs`; however, the Honeynet Project
    has used and tested all three methods. No one solution is better than the other.
    Instead, each of them has its own unique advantages and disadvantages; it is up
    to you to decide which solution works best. The three options we will now cover
    are `VMware workstation`, `VMware GSX server`, and user-mode Linux (`UML`).


    ## VMware workstation


    `VMware workstation` is a long used and established virtualization option. It
    is designed for the desktop user and is available for Linux and Windows platforms.


    ### Advantages


    1.  **Wide range of OS support:** You are able to run a variety of OSs within
    the virtual environment (called *Guest OSs*), including Linux, Solaris, Windows,
    and FreeBSD honeypots.

    2.  **Networking options:** Workstation provides two ways to handle networking.
    The first is bridged, which is useful for hybrid virtual honeynet networks because
    it lets a honeypot use the computer''s card and appear to be any other host on
    the honeynet network. The second option is host-only networking; this is good
    for self-contained virtual honeynets because you are able to better control traffic
    with a firewall.

    3.  **VMware workstation creates an image of each guest OS:** These images are
    simply a file, making them highly portable. This means that you can transfer them
    to other computers. To restore a honeypot to its original condition, you can just
    copy a backup into its place.

    4.  **Ability to mount VMware virtual disk images:** You are able to mount a `VMware`
    image just like you would mount a drive using `vmware-mount.pl`.

    5.  **Easy to use:** `VMware workstation` comes with a graphical interface (both
    Windows and Linux) that makes installing, configuring, and running the OSs very
    simple.

    6.  **As a commercial product:** `VMware workstation` comes with support, upgrades,
    and patches.


    ### Disadvantages


    1.  **Cost:** `VMware workstation` costs $300 per license (price may vary over
    time). This might be a bit much for the hobbyist, or the unemployed student.

    2.  **Resource requirements:** `VMware workstation` must run under an X environment,
    and each virtual machine (`VM`) will need its own window. So, on top of the memory
    you allocate for the guest OSs, you have the overhead of the X system.

    3.  **Limited amount of guest OSs:** With `VMware` you can only run a small number
    of `VM`, ~1–4. This might make for a limited honeynet.

    4.  **Closed source:** Since `VMware` is closed source, you cannot really make
    any custom adjustments.

    5.  **Fingerprinting:** It may be possible to fingerprint the `VMware` software
    on a honeypot, especially if the `VMware tools` are installed on the systems.
    This could give the honeypots away to the blackhat. However, `VMware workstation`
    does have options that can make fingerprinting more difficult, such as the ability
    to set the MAC address for virtual interfaces.


    `VMware` products also have some nice features, like the ability to suspend a
    `VM`. You are able to *pause* the `VM`, and when you take it out of suspension,
    all the processes go on like nothing happened. An interesting use of `VMware`,
    and other virtualization software too, is the ease and speed of bringing up `VMs`.
    Once a honeynet is compromised, and we learned as much as we can from it, we want
    to start over. With a virtual honeynet, all we have to do is copy files or use
    the undoable disk or non-persistent disk feature in `VMware workstation` to discard
    any changes made. Another feature of `VMware workstation` is the ability to run
    several networks behind the host OS. Therefore, if you only have one box, you
    can have your honeynet and personal computers all on the one box without worrying
    about data pollution on either side. If you would like to learn more about `VMware`
    and its capabilities for honeypot technology, check out Kurt Seifiried''s excellent
    paper *honeypotting with VMware—The Basics* and Ryan Barnett''s *Monitoring VMware
    honeypots*.


    ## VMware GSX server


    The `VMware` ground storm X (`GSX`) server is a heavy-duty version of `VMware
    workstation`. It is meant for running many higher end servers. As we will see,
    this is perfect for use as a honeynet. The `GSX` server currently runs on Linux
    and Windows as a host OS. If you would like to learn more about deploying virtual
    honeynets on `GSX`, check out the paper *Know Your Enemy: Learning with VMware*.


    ### Advantages


    1.  **Wide range of OS support:** The `GSX` server supports Windows (including
    95, 98, NT, 2000, XP, and .NET server), various Linux distributions, and potentially
    BSD and Solaris (not officially supported).

    2.  **Networking:** It includes all of the options that a workstation has.

    3.  **No X means more guest OSs:** The `GSX` server does not need X running in
    order to have `VMware` running. This allows you to run many more guest OSs at
    the same time. However, it does require that some of the X libraries be installed
    if the host is running Linux.

    4.  **Web interface:** The `GSX` server can be managed through a web page interface.
    Guest OSs can be started, paused, stopped, and created via the web page.

    5.  **Remote terminal:** This is one of the best features of the `GSX` server.
    Through the web page and with some `VMware` software, you can remotely access
    the guest OSs as if you were sitting at the console. You are able to do things
    like remote installs and checking out the system without generating traffic on
    the honeynet.

    6.  **Ability to mount:** Virtual disk images can be created.

    7.  **VMware GSX server supports more host memory (up to 8GB):** More CPUs (up
    to 8), and more memory per `VM` (2GB) than `VMware workstation`.

    8.  Includes a Perl API to manage guest OSs.

    '
