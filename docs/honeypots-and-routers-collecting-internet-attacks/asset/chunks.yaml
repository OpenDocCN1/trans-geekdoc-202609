    ### 近期历史：蜜罐的实战应用


    2000 年和 2001 年，基于 Unix 和 Windows 的蠕虫突然激增。这些蠕虫被证明极其有效。它们在互联网上呈指数级传播的能力令互联网社区震惊。各安全组织面临的挑战之一是获取蠕虫副本进行分析并了解其工作原理。由于数据污染，从受感染的生产系统获取蠕虫副本非常困难，就像
