  trans: "\n\n## 1.5.3 动态主机配置协议\n\n1.  主机通常由用户配置为使用静态 IP 地址，或通过 DHCP 获取自动分配，后者是最常用的选项。客户端通过发送\
    \ DHCP 发现消息来启动该过程。由于客户端不知道 DHCP 服务器的 IP 地址，因此该发现消息中的 IP 地址为广播地址，即 `255.255.255.255`，正是由于这一事实，此步骤被称为*发现*。DHCP\
    \ 服务器配置为监听 UDP 端口 `67`，而客户端需要选择 UDP 端口 `68` 作为源端口。DHCP 服务器可能不在与请求主机相同的子网中。在这种情况下，会在每个子网中放置\
    \ DHCP 中继代理。分配 IP 地址的请求在技术上称为 *IP 租约请求*。该请求消息中的另一个重要字段是客户端的 MAC 地址。\n\n    ![Figure\
    \ 1.15 DHCP IP address allocation process.](img/pg24_1.jpg)\n\n    **图 1.15**\
    \ DHCP IP 地址分配过程。\n\n2.  一旦服务器收到租约请求，它会向客户端发送 DHCP 提供消息。根据服务器针对客户端 MAC 地址的配置，此请求中提供的\
    \ IP 地址遵循三种方法之一进行选择。DHCP 提供消息中的重要项目包括提供的 IP 地址、子网掩码、租约期限以及服务器自身的 IP 地址。此提供消息的目标\
    \ IP 地址再次为 `255.255.255.255`，因为客户端迄今仍无 IP 地址；目标端口为前述的 UDP `68`。如果网络中有多个 DHCP 服务器，可能会有多个服务器发出提供。^(⁶)\
    \ 此处需考虑的另一个重要问题是：如果有多个客户端正在等待 IP 租约提供，当所有提供消息均为广播时，它们如何识别该提供是给谁的。\n\n3.  客户端将接受其中一个提供，并生成一条\
    \ DHCP 请求消息，以获取相应服务器提供的 IP 地址。该消息遵循与 DHCP 发现相同的传递配置，即进行广播，因为所有 DHCP 服务器都应被正式告知客户端接受了哪个服务器的提供，以便其他服务器撤回其提供。\n\
    \n4.  最后，DHCP 服务器通过发送 DHCP ACK 消息和其他必要配置来确认租约。\n\n## 1.5.4 互联网控制消息协议\n\n互联网控制消息协议\
    \ (ICMP)\n\n![Figure 1.16 ICMP packet format.](img/pg25_1.jpg)\n\n**图 1.16** ICMP\
    \ 数据包格式。\n\nICMP 消息通常在以下情况下发送：\n\n*   数据报无法到达目的地。\n*   网关的缓冲区没有足够的空间来转发数据报。\n\n\
    为了反馈或错误报告的目的，类型和代码字段组合在一起拥有一份详尽的关联状态码列表；表 1.1 描述了一些重要的组合。\n\n**表 1.1** 重要的 ICMP\
    \ 类型和代码组合\n\n| 类型 | 代码 | 说明 |\n| :--- | :--- | :--- |\n| 0—回显应答 | 0 | 回显应答（用于\
    \ ping） |\n| 3—目的地不可达 | 0 | 目的网络不可达 |\n|  | 1 | 目的主机不可达 |\n|  | 2 | 目的协议不可达 |\n\
    |  | 3 | 目的端口不可达 |\n|  | 4 | 需要分片，但设置了 DF 标志 |\n|  | 5 | 源路由失败 |\n|  | 6 | 目的网络未知\
    \ |\n|  | 7 | 目的主机未知 |\n|  | 8 | 源主机被隔离 |\n|  | 9 | 网络被管理上禁止 |\n|  | 10 | 主机被管理上禁止\
    \ |\n|  | 11 | 因 TOS 网络不可达 |\n|  | 12 | 因 TOS 主机不可达 |\n|  | 13 | 通信被管理上禁止 |\n\
    |  | 14 | 主机优先权冲突 |\n|  | 15 | 优先权中止生效 |\n| 5—重定向消息 | 0 | 为网络重定向数据报 |\n|  | 1\
    \ | 为主机重定向数据报 |\n|  | 2 | 为 TOS 和网络重定向数据报 |\n|  | 3 | 为 TOS 和主机重定向数据报 |\n| 8—回显请求\
    \ | 0 | 回显请求（用于 ping） |\n| 11—超时 | 0 | 传输中 TTL 过期 |\n|  | 1 | 片段重组时间超时 |\n| 12—参数问题：错误的\
    \ IP 头部 | 1 | 指针指示错误 缺少必需选项 |\n|  | 2 | 错误的长度 |\n| 13—时间戳 | 0 | 时间戳 |\n| 14—时间戳应答\
    \ | 0 | 时间戳应答 |\n| 17—地址掩码请求 | 0 | 地址掩码请求 |\n| 18—地址掩码应答 | 0 | 地址掩码应答 |\n\n##\
    \ 1.5.5 地址解析协议\n\n地址解析协议 (ARP)\n\n由于 ARP 提供了网络层和数据链路层之间的联系，它本身工作在网络层之下，因此不可路由。这意味着\
    \ ARP 数据包被直接封装在数据链路层帧中，只能在局域网内传输，而不能跨越路由器。\n\nARP 只有一种数据包格式，通过在操作字段中描述合适的值来指定不同的操作；例如，`1`\
    \ 代表 ARP 请求，`2` 代表 ARP 应答。另外两个重要字段是硬件类型和协议类型。硬件类型指定硬件标准，ARP 为不同标准提供了代码列表，例如 `0001`\
    \ 代表以太网。同样，协议类型指定网络层协议的代码，IPv4 的情况为 `0×0800`（图 1.17）。\n\n*地址解析过程*。网络层数据报被交给数据链路层进行传输，帧头中需要填写相应的硬件地址以便投递。ARP\
    \ 维护一个缓存或 ARP 表，用于存储已知的网络层地址到物理层地址的映射。如果缓存中没有网络层地址对应的物理层地址，则会在局域网中广播一个 ARP 请求数据包（MAC\
    \ 地址全为 1），其中包含缺少物理层地址的网络层地址。因为是广播，局域网上的每台主机都会收到该帧，如果被请求的主机存在，它将通过应答消息单独向请求主机回复其物理地址（图\
    \ 1.18）。请求主机将此条目存储在 ARP 缓存中以备将来使用。此外，ARP 请求消息有助于网络中的其他主机更新其 ARP 表中关于请求源的条目。\n\n\
    ![Figure 1.17 Generic ARP packet format.](img/pg28_1.jpg)\n\n**图 1.17** 通用 ARP\
    \ 数据包格式。\n\n![Figure 1.18 ARP address resolution process.](img/pg28_2.jpg)\n\n\
    **图 1.18** ARP 地址解析过程。\n\n## 参考文献\n\n*   1. IEEE Standard for Local and Metropolitan\
    \ Area Networks: Overview and Architecture, IEEE Std 802®-2001 (R2007), <https://standards.ieee.org/about/get/802/802.html>。\n\
    *   2. IEEE Standard for Ethernet, IEEE Std 802.3-2012, <https://standards.ieee.org/about/get/802/802.3.html>。\n\
    *   3. IEEE Standard for Local and Metropolitan Area Networks: Media Access Control\
    \ (MAC) Bridges, IEEE Std 802.1D-2004 (R2007), <https://standards.ieee.org/about/get/802/802.1.html>。\n\
    *   4. Postel, J., Internet Protocol, STD 5, RFC 791, DOI 10.17487/RFC0791, September\
    \ 1981, <http://www.rfc-editor.org/info/rfc791>。\n*   5. Fielding, R., Gettys,\
    \ J., Mogul, J., Frystyk, H., Masinter, L., Leach, P., and T. Berners-Lee, Hypertext\
    \ Transfer Protocol -- HTTP/1.1, RFC 2616, DOI 10.17487/RFC2616, June 1999, <http://www.rfc-editor.org/info/rfc2616>。\n\
    \n"
