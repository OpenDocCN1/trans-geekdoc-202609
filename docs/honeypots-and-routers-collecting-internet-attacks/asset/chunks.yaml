    ### TCP 会话劫持


    会话劫持是一种攻击，入侵者通过窃取会话 ID 并冒充授权用户，恶意接管双方正在进行的通信会话。在 TCP 会话劫持中，一旦会话在两个授权用户之间成功建立，入侵者便控制该
    TCP 会话。会话劫持需要获取会话 ID，这可以通过多种方法获得，例如盲目猜测、中间人方法或会话嗅探。在 TCP 会话中，正在进行的通信有三个重要参数：IP
    地址、端口号和序列号。入侵者尝试通过不同机制获取这三项，一旦成功，即发起攻击。


    ![Figure 3.5 Idle scan process.](img/pg53_1.jpg)


    **图 3.5** 空闲扫描过程。


    ### IP 欺骗


    空闲扫描是被归类为欺骗方法的一种手段，入侵者隐藏其实际身份（如 IP 地址），或在同一次攻击中使用多个地址以避免被检测。欺骗的概念也被用于其他技术中，例如媒体访问控制
    (MAC) 欺骗。


    ### 文件传输协议反弹攻击


    文件传输协议 (FTP)


    ![Figure 3.6 FTP bounce when port on the target is closed. Note: The syntax of
    the PORT command is a little strange as the address of the destination host is
    specified in the form of 6 comma separated decimal numbers. The first four numbers
    represent the IP address and can simply be used by replacing commas with dots.
    The last two numbers specify the port number on the destination in a format quite
    similar to the IP addressing. The sixth number represents the right eight bits
    of the port number while the fifth number represents the left eight bits of the
    port number; combine they make the 16-bit port number. Hence, the simple calculation
    to find the exact port number is to multiply the fifth number with 256 and then
    add to the sixth number.](img/pg54_1.jpg)


    **图 3.6** 目标端口关闭时的 FTP 反弹。注意：PORT 命令的语法有点奇怪，因为目标主机的地址是以 6 个逗号分隔的十进制数形式指定的。前四个数字代表
    IP 地址，只需将逗号替换为点即可使用。后两个数字以与 IP 寻址非常相似的格式指定目标上的端口号。第六个数字代表端口号的右侧八位（低 8 位），而第五个数字代表端口号的左侧八位（高
    8 位）；两者结合构成 16 位端口号。因此，查找确切端口号的简单计算方法是将第五个数字乘以 256，然后加上第六个数字。


    ![Figure 3.7 FTP bounce when port on the target is open.](img/pg54_2.jpg)


    **图 3.7** 目标端口开放时的 FTP 反弹。


    ### 3.1.4 DHCP 漏洞


    #### DHCP 饥饿攻击


    DHCP


    #### 伪造 DHCP 服务器


    入侵者在网络中引入一个伪造的 DHCP 服务器，使其能够响应 DHCP 发现消息。该伪造服务器也会针对发现请求生成 DHCP 提供，意图并希望某些客户端可能会选择其提供的租约。如果发生这种情况，客户端可能会因提供错误的网络配置而被拒绝服务。入侵者也可能将伪造服务器的
    IP 地址（或其他某台机器的地址）作为网关地址提供给客户端，使客户端流量经过伪造服务器，从而被分析用于恶意目的，进而导致中间人攻击（图 3.8）。


    ![Figure 3.8 Rogue DHCP server leading to the man-in-the-middle attack.](img/pg56_1.jpg)


    **图 3.8** 伪造 DHCP 服务器导致中间人攻击。


    ### 3.1.5 ICMP 扫描


    ICMP 被路由器等网络设备用于执行错误消息传递。每个 ICMP 消息携带一个 8 位类型值和一个 8 位代码值，这两个字段共同关联一个状态/错误消息。例如，类型
    3 代码 0 表示目标不可达，原因是目标网络不可达。ICMP 消息被多种工具用于恶意收集目标网络和主机的信息，因为 ICMP 请求总会得到响应。示例如下：


    - 类型 8 消息是回显请求，如果主机可用，默认会由回显应答（类型 0）响应。此技术用于识别网络上的活跃设备，由于其在 ping 实用程序中的用途，通常称为
    **ping 扫描**。如图 3.9 所示，Ping 扫描是一种枚举技术，向广泛的 IP 地址范围发送 ping 消息以识别活跃和非活跃主机（图 3.9）。

    - 类型 13 消息请求时间戳，从而可揭示目标的时区。

    - 类型 17 消息是网络掩码请求，可揭示子网划分详情。


    ![Figure 3.9 Ping sweep process.](img/pg56_2.jpg)


    **图 3.9** Ping 扫描过程。


    ICMP 扫描通常不被视为端口扫描技术，因为端口的概念在 ICMP 层面不适用；端口通常在传输层通过 TCP 可用/可寻址。它主要有助于识别网络上的存活主机，因此可归类为一种枚举方法。


    #### UDP 扫描


    由于 UDP 是无连接协议，通过发送 UDP 数据段难以识别目标状态，因为无回复可能有多种原因。然而，发送到未关联任何应用程序的端口（端口关闭）的 UDP
    数据段，会被目标主机以 ICMP 端口不可达消息（类型 3 代码 3）响应。因此，UDP 数据段可识别出未开放的端口。


    #### IP 扫描


    向目标主机发送多个协议字段值不同的 IP 数据报。假设是对于主机不支持的协议，目标将回复 ICMP 目标协议不可达数据包（类型 3 代码 2）。这样入侵者就能识别出主机除常规
    TCP 和 UDP 外，是否支持其他传输协议。


    ### 3.1.6 地址解析协议


    地址解析协议 (ARP)


    #### ARP 扫描


    ARP 扫描是一种用于发现局域网内活跃主机的技术。入侵者发送具有不同 IP 地址的 ARP 请求，通常是子网范围内所有可能的地址。如果目标主机存活，将回复
    MAC 地址，从而识别出所有可用主机。


    #### ARP 欺骗和投毒


    ARP 没有机制让 ARP 应答的接收者验证所描述的映射是否正确。此漏洞被用于欺骗攻击，入侵者向局域网上的其他主机发送带有错误映射的 ARP 应答，或用自己的
    MAC 地址回复针对其他主机的 ARP 请求。因此，由于源头处的 ARP 条目错误，本应发往实际目的地的流量会被发送给入侵者。此外，它还会投毒主机、交换机和路由器的
    ARP 缓存。


    ### 3.1.7 链路层漏洞


    '
