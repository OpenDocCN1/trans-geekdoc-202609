    # TCP Port Scanning Techniques


    TCP is the most widely used transport layer protocol on the Internet as it provides
    reliable and in-order delivery, required by most applications. However, this comes
    at the cost of operational complexity and a huge list of vulnerabilities. A TCP
    connection is established through a three-way handshake process before sending
    actual application messages. Based on the behavior of TCP, particularly during
    the connection establishment phase, several techniques can be applied to reveal
    details of the target network/hosts. One common approach is to send different
    types of TCP segments to the target host to identify the open/close status of
    ports on the target. This attacking approach is usually referred to as *port scanning*.


    ![Figure 3.2 HTTP tunneling process.](images/pg49_1.jpg)


    **Figure 3.2** HTTP tunneling process.


    ## TCP Connect/Full Open Scan


    The client host attempts to establish a proper TCP connection with the target
    host on a certain port. If the port is open for TCP services, the connection will
    be successfully established by performing the three-way handshake; otherwise,
    a TCP segment with the reset (RST) bit will be received indicating that the port
    is not open for connections (Figure 3.3b). This scan technique is also referred
    to as *Vanilla scan*—that is, when the intruder scans all 65,536 ports for Full
    Open scan. The regular TCP behavior, also followed in Full Open scan, is to respond
    with an acknowledgement (ACK) segment in step 3 and proceed with transmitting
    application messages (Figure 3.3a).


    ## Slow Scan


    Vanilla scan—that is, a scan of all the ports of a target system based on the
    Full Open scan approach—has a drawback: most hosts log successful TCP connections;
    thus, an administrator can identify such an attack by observing the logs when
    they find so many successful connection attempts on different ports. In order
    to avoid this problem, one approach is to attempt the next port after a reasonable
    interval—that is, perform the scan at a slow pace. Slow scan is the simplest stealth
    scan approach.


    ![Figure 3.3 (a) TCP connection handshake when target port is open. (b) TCP connection
    handshake when target port is closed.](images/pg50_1.jpg)


    **Figure 3.3** (a) TCP connection handshake when target port is open. (b) TCP
    connection handshake when target port is closed.


    ## Half Open/SYN Scan


    Another important aspect of the Full Open scan that can be easily followed in
    [Figure 3.3](#08_Chapter03.xhtml#fig3_3) is that the third step of the handshake
    does not reveal any additional information on the port status. Hence, in synchronize
    (SYN) scan, if the port is open, the client responds with a TCP RST segment to
    immediately destroy the ongoing connection request (Figure 3.3a). The SYN scan
    is also considered one of the stealth scan approaches as it tries to avoid being
    noticed by administrators.


    ## Xmas or Xmas-Tree Scan


    Xmas scan is another stealthy approach in which the client sends an invalid combination
    of TCP flags to the target host. If the target system is compliant with the TCP
    specifications as in RFC 793, it responds with a TCP RST segment in case of a
    closed port, or ignores the segment if the port is open. This attack usually works
    with UNIX hosts only; Windows machines always ignore such segments. There are
    two variations of the Xmas scan. The first variation uses only finish (FIN), urgent
    (URG), and push (PSH) flags—that is, sets these three flags in the segment. In
    the second variation, all the TCP flags are set ([Figure 3.4](#08_Chapter03.xhtml#fig3_4)).


    ## FIN Scan


    FIN scan is an approach similar to the Xmas scan as it also uses an unexpected
    combination of TCP flags in the received segment. However, in FIN scan, only the
    FIN flag is set. Such a segment is unexpected because a FIN segment is usually
    sent to indicate the intention to close an established connection, while here
    there is no working connection between the client and the target. A closed port
    in such a case again responds with a TCP RST segment, while an open port ignores
    such segments.


    ## Null Scan


    Null scan can be considered an approach opposite to the Xmas scan as in this case,
    the TCP segment sent has all flags unset. Such a segment in TCP is indeed a normal
    data segment transmitted after successful connection establishment. Since the
    target host has no established connection with the client, it will discard the
    packet if the target port is open. In case the port is closed, it will respond
    with a TCP RST segment. The success of the null scan depends on the implementation
    of the TCP stack in the target host and usually such segments are blocked on Microsoft
    platforms.


    ![Figure 3.4 TCP Xmas-tree scan process.](images/pg51_1.jpg)


    **Figure 3.4** TCP Xmas-tree scan process.


    ## Inverse Flag Scans


    Xmas-tree, FIN, and null scans are also called *inverse* or *inverse flag scans*
    as in the case of these scans, a closed port at the target replies with a segment
    while an open port does not respond.


    ## ACK Scan


    Another approach to exploit the target by sending an unexpected TCP segment is
    to set the ACK flag in the segment. An ACK segment is usually sent as the third
    step in the handshake process or to confirm the successful receipt of a data segment.^([^(13)](#fn13))


    ## Fragmented Scan


    In order to avoid being detected by firewalls, one approach used in different
    TCP scans to increase effectiveness is to divide the TCP header into multiple
    Internet Protocol (IP) fragments—that is, send the probe segment in multiple IP
    datagrams. Most intrusion detection systems are unable to detect a scan when the
    TCP header is fragmented.


    ## Idle or Dumb Scan


    Idle scan is a complex but smart attack, performed with the help of a third host
    usually referred to as a *dumb* or *zombie host*, due to its unintentional participation
    in the attack. The attack exploits the fact that all IP datagrams generated by
    a host are assigned a *fragment identification number* and every new datagram
    has a fragment ID one more than the previously generated datagram. Hence, if host
    X is receiving from host Y IP datagrams with no gaps, this indicates that host
    Y is not communicating with any other host at the moment.


    The intruder in case of an idle attack communicates with the dumb host and observes
    the increment in the IP fragment IDs; any inverse flag scan approach can be used
    for this purpose. The important point to consider while selecting a host as a
    zombie is that it is an idle host not generating any other IP traffic at the moment.
    Thus, when probed repeatedly, the IP datagrams sent by the zombie host will have
    continuous fragment IDs. The interesting fact regarding this attack is that the
    zombie host is not the actual target of the intruder. The intruder sends a SYN
    segment to the actual target host but with the IP address of the zombie host—that
    is, spoofs the IP address. If the port is open at the target host, a SYN + ACK
    segment will be sent to the zombie host to which the zombie will reply with an
    RST segment, as it was never interested in the connection. This segment sent by
    the zombie to the target host will produce a gap in the IP fragment IDs that the
    intruder is observing through its probing of the zombie, indicating that the requested
    port at the target host is open ([Figure 3.5](#08_Chapter03.xhtml#fig3_5)).

