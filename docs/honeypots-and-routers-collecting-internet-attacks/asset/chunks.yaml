    Like any other IDPS technology, host-based IDPSs often cause false positives and
    false negatives. However, the accuracy of detection is more challenging for host-based
    IDPSs because they detect events but do not have knowledge of the context under
    which the events occurred. For example, a new application may be installed—this
    could be done by malicious activity or done as part of normal host operations.
    The event’s benign or malicious nature cannot be determined without additional
    context. Therefore, organizations that would like to use a host-based IDPS are
    recommended to use a host-based product that use combinations of several detection
    techniques, which achieve more accurate detection than products that use one or
    a few techniques. As each technique can monitor different aspects of a host, using
    more techniques allows agents to have a more complete picture of the events, including
    additional context.


    Considerable tuning and customization are required to achieve better prevention
    by the host-based IDPSs. For example, many rely on observing host activity and
    developing profiles of expected behavior. Others need to be configured with detailed
    policies that define exactly how each application on a host should behave. The
    policies need to be updated as the host environment changes, so that these changes
    are taken into account. Some products permit multiple policies to be configured
    on a host for multiple environments; this is mostly helpful for hosts that function
    in multiple environments, such as a laptop used both within an organization and
    from external locations.


    Host-based IDPS agents provide several intrusion prevention capabilities, based
    on the detection techniques they use. For example, code analysis techniques can
    prevent malicious code from being executed, and network traffic analysis techniques
    can stop incoming traffic from being processed by the host and can prevent malicious
    files from being placed on the host. Network traffic filtering techniques can
    block unwanted communications. File-system monitoring can prevent files from being
    accessed, modified, replaced, or deleted, which could stop installation of malware,
    including Trojan horses and rootkits, as well as other attacks involving inappropriate
    file access. Other host-based IDPS detection techniques, such as log analysis,
    network configuration monitoring, and file integrity, and attribute checking,
    generally do not support prevention actions because they identify events after
    they have occurred.


    ### Host-based IDPS limitations


    Host-based IDPSs also have some significant limitations. Although agents generate
    alerts on a real-time basis for most detection techniques, some techniques are
    used periodically to identify events that have already had happened. Such techniques
    might only be applied hourly or even just a few times a day, causing significant
    delay in identifying certain events. Additionally, many host-based IDPSs are intended
    to forward their alert data to the management servers on a periodic basis, such
    as every 15–60 min, to reduce overhead. This can cause delays in initiating response
    actions, which especially increases the impact of incidents that spread quickly,
    such as malware infestations. Host-based IDPSs can consume considerable amount
    of resources on the hosts that they protect, particularly if they use several
    detection techniques and shims. Host-based IDPSs can also cause conflicts with
    existing security controls, such as personal firewalls, particularly if those
    controls also use shims to intercept host activity.


    ### 6.3.6 Integration of Multiple IDPS


    Integration of multiple IDPS technologies and that of different IDPS products
    offer good prevention mechanism for organizations. We discuss the advantages of
    integration in detail in the following sections.


    #### Multiple IDPS technologies


    We had mentioned earlier that there are four primary types of IDPS technologies:
    network-based, wireless, NBA, and host-based. Each of these types has different
    prevention capabilities from other types from unauthorized activities. For example,
    some of these types can detect attack that other cannot. Therefore, detecting
    as many attacks as possible will result in a better defense. Accordingly, using
    multiple types of IDPS technologies can achieve more comprehensive and accurate
    detection and prevention of malicious activity. For most of the environments,
    a combination of network-based and host-based IDPSs are needed at a minimum. Wireless
    IDPSs may also be needed if WLAN security or rogue WLAN detection is a concern.
    NBA products can also be deployed to achieve stronger detection capabilities for
    DoS attacks, worms, and other threats that cause anomalous network flows.


    In fact, some organizations use multiple products of the same IDPS technology
    type to get more prevention and detection against malicious activities. Because,
    each product can detect attacks that another product cannot. Therefore, using
    multiple products can offer more comprehensive and accurate defense. For the organizations
    that would like to use multiple products of the same IDPS technology type, we
    recommend them to use one monitoring device for multiple products. One monitoring
    device makes it easier for analysts to confirm the validity of alerts and identify
    false positives, and also provides redundancy. Using many monitoring devices will
    result in a difficult analysis scenario, and will also consume time and resources.


    #### Integration of different IDPS products


    Different IDPS products function completely independently of each other. One of
    the most important advantages of using different IDPS products is that if one
    of them is compromised or fails, the other will not be affected, which means that
    there are other products still giving defense against malicious activity. However,
    if the products are not integrated, the effectiveness of the entire IDPS implementation
    may be somewhat limited. Data cannot be shared by the products, and extra effort
    will be needed to monitor and manage multiple sets of products. IDPS products
    can be directly or indirectly integrated.


    ### 6.3.7 IDPS Products


    All sections above are concerned about the IDPS. Implementation of the above concept
    will result in IDPS products. There are many IDPS products in the world and each
    of them has relative advantages over others. Therefore, in this section, we mention
    some of these products, so that the researchers can know these products, use them,
    modify the open source of them, and also start a new IPDS product for research.


