    # Understanding Attacker Motivation


    Understanding the motivation of the attackers will help us to understand threats
    better. The following attacks will help for understanding why an attacker would
    target and attempt to compromise a system.


    ## Denial of Service Attack


    Denial of service attacks are those designed to take out the computer systems
    or networks of a victim. This is commonly done by flooding the intended target
    (such as a Web server) with a barrage of network traffic. The more traffic that
    is thrown at a victim, the more effective the attack is. Attackers will often
    compromise hundreds, if not thousands, of systems to be used for attacks. The
    more computers they own, the more traffic they can launch at a target. Many blackhats
    use denial of service attacks to take out other blackhats. One example is IRC
    wars, where one individual attempts to knock out another individual from an IRC
    channel, using denial of service attacks.


    ## Internet Bots


    Robots (BOTs) are automated robots that act on behalf of an individual in a preprogrammed
    fashion. They are most commonly used to maintain control of IRC. The more computers
    one hacks into, the more BOTs one can launch, and the more one can control specific
    IRC channels. Using many BOTs protects individuals from losing control of an IRC
    from denial of service attacks.


    ## Phishing


    Phishing is a way of attempting to acquire information (and sometimes, indirectly,
    money) such as usernames, passwords, and credit card details by masquerading as
    a trustworthy entity in an electronic communication. Communications purporting
    to be from popular social websites, auction sites, online payment processors,
    or IT administrators is commonly used to lure the unsuspecting public. Phishing
    is typically carried out by email spoofing or instant messaging, and it often
    directs users to enter details at a fake website whose look and feel are almost
    identical to the legitimate one. Phishing is an example of social engineering
    techniques used to deceive users, and exploit the poor usability of current web
    security technologies. Attempts to deal with the growing number of reported phishing
    incidents include legislation, user training, public awareness, and technical
    security measures.


    ## 5.3 Value of Honeypots


    We know now from all the above discussions that there is no specific definition
    of what a honeypot is. Therefore, the value of a honeypot depends on what your
    problem is. Or, why you need to build honeypots? The answer to these questions
    will highlight the value of honeypots. Therefore, the value of honeypots basically
    depends on your goals.


    There are advantages and disadvantages of the honeypots, which affect their value.
    In this section, we show the advantages and disadvantages of them. Moreover, we
    will present the differences between production and research honeypots and their
    respective roles.


    ### 5.3.1 Advantages of Honeypots


    There are many advantages of using honeypots, but we will focus on some of them.


    #### Data Value


    One of the challenges the security community faces is gaining value from data.
    Organizations collect vast amounts of data every day, including firewall logs,
    system logs, and intrusion detection alerts. The sheer amount of information can
    be overwhelming, making it extremely difficult to derive any value from the data.
    Honeypots, on the other hand, collect very little data, but what they do collect
    is normally of high value. The honeypot concept of no expected production activity
    dramatically reduces the noise level. Instead of logging gigabytes of data every
    day, most honeypots collect several megabytes of data per day, if even that much.
    Any data that is logged is most likely a scan, probe, or attack—information of
    high value.


    Honeypots can give you the precise information you need in a quick and easy-to-understand
    format. This makes analysis much easier and reaction time much quicker. For example,
    the Honeynet Project, a group researching honeypots, collects on average less
    then 1MB of data per day. Even though this is a very small amount of data, it
    contains primarily malicious activities. These data can then be used for statistical
    modeling, trend analysis, detecting attacks, or even analyzing attackers. This
    is similar to a microscope effect. Whatever data you capture is placed under a
    microscope for detailed scrutiny.


    #### Resources


    Another challenge most security mechanisms face is resource limitations, or even
    resource exhaustion. Resource exhaustion is when a security resource can no longer
    continue to function because its resources are overwhelmed. For example, a firewall
    may fail because its connections table is full, it has run out of resources, or
    it can no longer monitor connections. This forces the firewall to block all connections
    instead of just blocking unauthorized activity. An IDS may have too much network
    activity to monitor, perhaps hundreds of megabytes of data per second. When this
    happens, the IDS sensor''s buffers become full, and it begins dropping packets.
    Its resources have been exhausted, and it can no longer effectively monitor network
    activity, potentially missing attacks. Another example is centralized log servers.
    They may not be able to collect all the events from remote systems, potentially
    dropping and failing to log critical events.


    Because they capture and monitor little activity, honeypots typically do not have
    problems of resource exhaustion. As a point of contrast, most IDS sensors have
    difficulty monitoring networks that have gigabits speed. The speed and volume
    of the traffic are simply too great for the sensor to analyze every packet. As
    a result, traffic is dropped and potential attacks are missed. A honeypot deployed
    on the same network does not share this problem. It only captures activities directed
    at itself, so the system is not overwhelmed by the traffic. Where the IDS sensor
    may fail because of resource exhaustion, the honeypot is not likely to have a
    problem. A side benefit of the limited resource requirements of a honeypot is
    that you do not have to invest a great deal of money in hardware for it. Honeypots,
    in contrast to many security mechanisms such as firewalls or IDS sensors, do not
    require the latest cutting-edge technology, vast amounts of RAM or chip speed,
    or large disk drives. You can use leftover computers found in your organization
    or that old laptop your boss no longer wants. This means that not only can a honeypot
    be deployed on your gigabit network but also it can be a relatively cheap computer.


    #### Simplicity


    It is the biggest single advantage of honeypots. There are no fancy algorithms
    to develop, no signature databases to maintain, and no rulebases to misconfigure.
    You just take the honeypot, drop it somewhere in your organization, and sit back
    and wait. While some honeypots, especially research honeypots, can be more complex,
    they all operate on the same simple premise: if somebody or someone connects to
    the honeypot, check it out. As experienced security professionals will tell you,
    the simpler the concept, the more reliable it is. With complexity come misconfigurations,
    breakdowns, and failures.


    #### Fewer False Positives


    We mentioned earlier that any interaction with the honeypots will be considered
    as suspicious. Moreover, when all people in an organization are informed that
    there is a honeypot set up in the organization (i.e., some devices are acting
    as honeypots), nobody will try to access them.


    #### No Known Attack Signatures Required


    Unlike IDS, honeypots do not require known attack signatures to detect suspicious
    activities. All activities in honeypots will be stored as suspicious.


    ### 5.3.2 Disadvantages of Honeypots


    While it is true that the honeypots have great advantages, they also have several
    disadvantages.

    '
  trans: '

    # 理解攻击者动机


    了解攻击者的动机将有助于我们更好地理解威胁。以下攻击将有助于理解攻击者为何会以某个系统为目标并试图将其攻破。


    ## 拒绝服务攻击


    拒绝服务攻击旨在瘫痪受害者的计算机系统或网络。这通常通过向预期目标（如 Web 服务器）发送大量网络流量来实现。针对受害者的流量越多，攻击效果越显著。攻击者通常会攻破数百甚至数千个系统用于发动攻击。他们控制的计算机越多，能向目标发起的流量就越大。许多黑客使用拒绝服务攻击来瘫痪其他黑客。例如
    IRC 战争，即某个个体试图利用拒绝服务攻击将另一个个体从 IRC 频道中踢出。


    ## 互联网机器人


    机器人是代表个人按预编程方式自动行动的自动化程序。它们最常用于维持对 IRC 的控制。一个人入侵的计算机越多，能启动的机器人就越多，从而能控制特定的 IRC
    频道。使用大量机器人可以保护个人免受拒绝服务攻击导致的 IRC 控制权丢失。


    ## 网络钓鱼


    网络钓鱼是一种通过在电子通信中伪装成可信实体，试图获取用户名、密码和信用卡详情等信息（有时间接获取金钱）的手段。声称来自热门社交网站、拍卖网站、在线支付处理商或
    IT 管理员的通信常被用来诱骗毫无戒心的公众。网络钓鱼通常通过电子邮件欺骗或即时通讯实施，并经常引导用户在一个外观和感觉与合法网站几乎完全相同的假冒网站上输入详细信息。网络钓鱼是利用社会工程学技巧欺骗用户、并利用当前
    Web 安全技术易用性差的典型案例。应对日益增长的网络钓鱼举报事件的尝试包括立法、用户培训、公众意识提升和技术安全措施。


    ## 5.3 蜜罐的价值


    从以上所有讨论中我们现在知道，蜜罐没有具体的定义。因此，蜜罐的价值取决于你的问题是什么。或者说，你为什么需要构建蜜罐？这些问题的答案将凸显蜜罐的价值。因此，蜜罐的价值基本上取决于你的目标。


    蜜罐有优点也有缺点，这些都会影响其价值。在本节中，我们将展示它们的优缺点。此外，我们还将介绍生产蜜罐和研究蜜罐的区别及其各自的角色。


    ### 5.3.1 蜜罐的优势


    使用蜜罐有许多优势，但我们将重点关注其中几点。


    #### 数据价值


    安全社区面临的挑战之一是从数据中获取价值。组织每天收集大量数据，包括防火墙日志、系统日志和入侵检测警报。海量的信息可能令人难以应对，使得从数据中提取任何价值变得极其困难。另一方面，蜜罐收集的数据很少，但所收集的数据通常价值很高。蜜罐“无预期生产活动”的概念大幅降低了噪音水平。蜜罐每天收集的数据通常只有几兆字节（甚至更少），而不是记录数千兆字节的数据。任何被记录的数据极有可能是扫描、探测或攻击——即高价值信息。


    蜜罐能以快速且易于理解的格式为你提供所需的精确信息。这使得分析变得更容易，反应时间也快得多。例如，蜜网项目（一个研究蜜罐的小组）平均每天收集的数据不到 1MB。尽管数据量很小，但主要包含恶意活动。这些数据可用于统计建模、趋势分析、攻击检测，甚至分析攻击者。这类似于显微镜效应。无论捕获什么数据，都会被置于显微镜下进行详细审视。


    #### 资源


    大多数安全机制面临的另一个挑战是资源限制，甚至资源耗尽。资源耗尽是指安全资源因资源不堪重负而无法继续运行。例如，防火墙可能因连接表已满、资源耗尽或无法再监控连接而失效。这迫使防火墙阻止所有连接，而不仅仅是阻止未授权活动。IDS
    可能面临过多的网络活动需要监控，也许是每秒数百兆字节的数据。当这种情况发生时，IDS 传感器的缓冲区会变满，并开始丢弃数据包。其资源已耗尽，无法再有效监控网络活动，从而可能错过攻击。另一个例子是集中式日志服务器。它们可能无法收集来自远程系统的所有事件，从而可能丢弃并未能记录关键事件。


    因为捕获和监控的活动很少，蜜罐通常没有资源耗尽的问题。作为对比，大多数 IDS 传感器难以监控具有千兆比特速度的网络。流量的速度和体量对于传感器来说太大，无法分析每个数据包。结果是流量被丢弃，潜在攻击被错过。部署在同一网络上的蜜罐不存在这个问题。它只捕获针对自身的活动，因此系统不会被流量淹没。在
    IDS 传感器可能因资源耗尽而失效的地方，蜜罐不太可能出现问题。蜜罐有限资源需求的一个附带好处是，你不必在其硬件上投入大量资金。与防火墙或 IDS 传感器等许多安全机制不同，蜜罐不需要最新的尖端技术、大量内存或芯片速度，也不需要大容量硬盘。你可以使用组织里闲置的电脑或老板不想要的旧笔记本电脑。这意味着蜜罐不仅可以部署在你的千兆网络上，而且可以是一台相对便宜的电脑。


    #### 简易性


    这是蜜罐最大的单一优势。无需开发花哨的算法，无需维护特征库，也无需担心规则库配置错误。你只需获取蜜罐，将其放置在组织的某处，然后坐等即可。虽然某些蜜罐（尤其是研究蜜罐）可能更复杂，但它们都基于同一个简单的前提运行：如果有人或某物连接到蜜罐，就去检查一下。正如经验丰富的安全专业人士会告诉你的，概念越简单，可靠性越高。复杂性带来配置错误、故障和失效。


    #### 较少的误报


    我们之前提到，与蜜罐的任何交互都将被视为可疑。此外，当组织内所有人都被告知组织内部署了蜜罐（即某些设备充当蜜罐）时，没人会尝试访问它们。


    #### 无需已知攻击特征


    与 IDS 不同，蜜罐检测可疑活动不需要已知攻击特征。蜜罐中的所有活动都将作为可疑活动存储。


    ### 5.3.2 蜜罐的劣势


    虽然蜜罐具有巨大优势，但也存在若干劣势。

    '
