    \ router and could get a banner saying the system was Cisco, FTP to the Solaris\
    \ server and get a banner saying the system was Solaris, or make an HTTP connection\
    \ to the NT server. Even the emulated IP stacks were modified to replicate the\
    \ proper OS. This way if active fingerprinting measures were used, such as Nmap\
    \ \\[\n\n        For its time and development, CyberCop Sting was a cutting-edge\
    \ and advanced honeypot. Also, it was easy to install, configure, and maintain,\
    \ making it accessible to a large part of the security community. However, as\
    \ a commercial product, it never really took off and has now been discontinued.\
    \ Since its demise, several excellent commercial honeypot products have been released,\
    \ including NetSec’s Specter \\[\n\n        In 1998, Marty Roesch, while working\
    \ at GTE Internetworking, began working on a honeypot solution for a large government\
    \ client. Roesch and his colleagues developed a honeypot system that would simulate\
    \ an entire class C network, up to 254 systems, using a single host to create\
    \ the entire network. Up to seven different types of OSs could be emulated with\
    \ a variety of services. Although the resulting commercial product, NetFacade\
    \ \\[\n\n        The year 1998 also saw the release of BOF, a Windows-and Unix-based\
    \ honeypot developed by Marcus Ranum and released by Network Flight Recorder.\
    \ What made BOF unique is that it was free, extremely easy to use, and could run\
    \ on any Windows-based desktop system. All you had to do was download the tool,\
    \ install it on your system, and you instantly have your own personal honeypot.\
    \ Though limited in its capabilities, BOF was many people’s first introduction\
    \ to the concepts of honeypot technologies.\n\n        In 1999, the Honeynet Project\
    \ was formed \\[\n\n        *Recent history: Honeypots in action*. During 2000\
    \ and 2001, there was a sudden growth in both Unix- and Windows-based worms. These\
    \ worms proved to be extremely effective. Their ability to exponentially spread\
    \ across the Internet astounded the Internet community. One of the challenges\
    \ that various security organizations faced was obtaining a copy of the worm for\
    \ analysis and understanding how it worked. Obtaining copies of the worm from\
    \ compromised production systems was difficult because of data pollution or, as\
    \ in the case of the Code Red worm \\[\n\n        One example was the capture\
    \ and analysis of the Leaves worm by [Incidents.org](http://Incidents.org). On\
    \ June 19, 2001, a sudden rise of scans for the Sub7 Trojan was detected. Sub7\
    \ was a Trojan that took over Windows systems, giving an attacker total remote\
    \ control of the system. The Trojan listened on the default port 27374. The attacker\
    \ controlled the compromised system by connecting to this port with special client\
    \ software. A team of security experts from [Incidents.org](http://Incidents.org)\
    \ attempted to find the reason for the activity.\n\n        On June 21, Johannes\
    \ Ullrich of the SANS Institute deployed a honeypot he had developed to emulate\
    \ a Windows system infected with the Sub7 Trojan. Within minutes, this honeypot\
    \ captured an attack, giving the [Incidents.org](http://Incidents.org) team the\
    \ ability to analyze it. They discovered that a worm was pretending to be a Sub7\
    \ client and attempting to infect systems already infected by the Sub7 Trojan.\
    \ This saved the attacker from the trouble of hacking into systems, since the\
    \ systems were already attacked and compromised. Matt Fearnow and the [Incidents.org](http://Incidents.org)\
    \ team were able to do a full analysis of the worm, which was eventually identified\
    \ as the W32/Leaves worm, and forwarded the critical information to the National\
    \ Infrastructure Protection Center. Other organizations also began using honeypots\
    \ for capturing worms for analysis, such as Ryan Russel at [SecurityFocus.com](http://SecurityFocus.com)\
    \ for analysis of the CodeRed II worm. These incidents again helped develop awareness\
    \ of the value of honeypots within the security community and security research.\n\
    \n        The first recorded instance involving honeypot technologies in capturing\
    \ an unknown exploit occurred on January 8, 2002. A Solaris honeypot captured\
    \ a *dtspcd* exploit, an attack never seen before. On November 12, 2001, the Computer\
    \ Emergency Response Team (CERT) Coordination Center, a security research organization,\
    \ released an advisory for the Common Desktop Environment Subprocess Control Service\
    \ \\[\n\n        ### *5.1.3 Types of Honeypots*\n\n        There are mainly two\
    \ types of honeypots \\[\n\n        1.  Production honeypots\n\n        2.  Research\
    \ honeypots\n\n        The concept of these types comes from Marty Roesch, developer\
    \ of Snort. It evolved during his work and research at GTE Internetworking. Production\
    \ honeypots protect an organization, while research honeypots are used for experimentation\
    \ and research.\n\n        Production honeypots are easy to use, capture only\
    \ limited information, and are used primarily by companies or corporations. These\
    \ honeypots are placed inside the production network with other production servers\
    \ by an organization to improve their overall state of security. They add value\
    \ to the security of a specific organization and help mitigate risk. Normally,\
    \ production honeypots give less information about the attacks or attackers than\
    \ research honeypots do.\n\n        As we mentioned above, production honeypots\
    \ usually are easier to build and deploy than research honeypots because they\
    \ require less functionality. Production honeypots are relatively simple and generally\
    \ have less risk. One of the disadvantages of the production honeypots is that\
    \ they generally give us less information about the attacks or the attackers than\
    \ research honeypots do. We may learn about which systems the attackers are coming\
    \ from or what exploits they launch, but we will most likely not learn how they\
    \ communicate among each other or how they develop their tools.\n\n        Research\
    \ honeypots are often very complex to deploy. The main goals of the research honeypots\
    \ are to gather extensive information about the motives and tactics of the Blackhat\
    \ community targeting different networks. It should be mentioned that research\
    \ honeypots do not add direct value to a specific organization; instead, they\
    \ are used to research the threats that the organizations face and to learn how\
    \ to better protect against those threats. Research honeypots are complex to deploy\
    \ and maintain, capture extensive information, and are used primarily by research,\
    \ military, or government organizations.\n\n        To get extensive information\
    \ about the attackers, we need to use research honeypots; there is no other alternative.\
    \ These honeypots give attackers real OSs and applications to interact. This help\
    \ us to potentially learn who the attackers are, how they communicate, or how\
    \ they develop or acquire their tools, but we should mention that the research\
    \ honeypots have great risks as well, and require more time and effort to administer.\
    \ In fact, research honeypots could potentially reduce the security of an organization,\
    \ since they require extensive resources and maintenance efforts.\n\n        ##\
    \ **5.2 Types of Threats**\n\n        A honeypot is a kind of security solution.\
    \ Therefore, it is better to explain what the problem is, that is the attacker.\
    \ By understanding who our threat is and how he operates, we can easily understand\
    \ the solution better, which is the concept of honeypot \\[\n\n        ### *5.2.1\
    \ Script Kiddies and Advanced Blackhat Attacks*"
