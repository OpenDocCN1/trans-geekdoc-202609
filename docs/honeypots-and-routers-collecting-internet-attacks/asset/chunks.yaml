- raw: "        There are two types of attackers: script kiddies and advanced blackhat.\
    \ It does not matter if these threats are coming from the outside, such as the\
    \ Internet, or from the inside, such as a disgruntled employee. Most threats tend\
    \ to fall into one of these two categories.\n\n        *Script kiddies*. These\
    \ types of attackers usually depend on scripted attacks. Sometimes, these attackers\
    \ have certain requirements, such as hacking systems with a fast connection to\
    \ the Internet or a large hard drive for storing files. In general, however, all\
    \ they care about are numbers. They tend to be less sophisticated, but they are\
    \ far more numerous, representing the vast majority of probes, scans, and attacks\
    \ you see today.\n\n        To compromise a device using script kiddies is very\
    \ simple, and the attacker only needs to follow a number of steps to reach its\
    \ intended goal. Without script kiddies, the task is much more complicated and\
    \ may only be performed by experts. For example, steps would be as follows:\n\n\
    \        *   First, an attacker has to identify a vulnerability within an OS or\
    \ application. This is not an easy task. It requires extensive knowledge of how\
    \ OSs work, such as memory management, kernel mechanisms, and file systems’ functionality.\
    \ To identify vulnerabilities in an application, an attacker would have to learn\
    \ how an application is operated and interacted with both the input and output\
    \ of information. It could take days, weeks, or even months to identify vulnerabilities.\n\
    \n        *   However, after a vulnerability is identified, an attacker would\
    \ have to develop a tool to exploit it. This requires extensive coding skills,\
    \ potentially in several different computer programming languages.\n\n       \
    \ *   • After the exploit is developed, the attacker has to find vulnerable systems.\
    \ Often, one scanning tool is used to find systems that are accessible on the\
    \ Internet, using such functionality as an ICMP ping or a full TCP connection.\
    \ These tools are used to develop a database of systems that are accessible. Then\
    \ the attacker has to determine what services existed on the reachable systems—that\
    \ is, what was actually running on the targets. Furthermore, the attacker has\
    \ to determine if any of these services were vulnerable.\n\n        *   The next\
    \ step would be launching the exploit against the victim, hacking into and gaining\
    \ control of the system. Finally, various other tools (often called *rootkits)*\
    \ should be used to take over and maintain control of a compromised system.\n\n\
    \        Each of these steps just described requires the development of a unique\
    \ tool, and using all those tools takes a lot of time and resources. Once the\
    \ attack is launched, the tools are often manually operated, requiring a great\
    \ deal of work from an experienced attacker.\n\n        The above-mentioned steps\
    \ are too difficult and require very skilled attackers with plenty of experience,\
    \ which was not a common case. Unfortunately, today the story is too different.\
    \ With almost no technical skills or knowledge, anyone can simply download tools\
    \ from the Internet that can do all the works for them. Sometimes, these tools\
    \ combine all of the activities that we have just described, into a fully automated\
    \ weapon that only needs to be pointed at certain systems, or even at an entire\
    \ network. This is as simple as just clicking a button or pressing a key on the\
    \ keyboard! An attacker simply downloads these tools, follows the instructions,\
    \ launches the attacks, and happily hacks his way into hundreds or even thousands\
    \ of systems. These tools are rapidly spreading across the Internet, giving access\
    \ to thousands of attackers, who may do such tasks just for fun. What used to\
    \ be a highly complex development process is now extremely simple!\n\n       \
    \ Attackers can download the automated tools from a variety of resources or exchange\
    \ them with their friends. Internet relay chat (IRC) and the World Wide Web enabled\
    \ blackhats to instantly share new attack tools around the world. Then, they simply\
    \ learn the command-line syntax for the tool. For attackers, who are unfamiliar\
    \ with command-line syntax, a variety of tools have been designed for Windows\
    \ with point-and-click capabilities. Some of the exploits even come with well-written,\
    \ step-by-step instructions.\n\n        *Advanced blackhat*. This type of attacker\
    \ focuses on targets of choice, may want to compromise a specific system or systems\
    \ of high value. These individuals are most likely highly experienced and knowledgeable\
    \ attackers. Their attack is usually financially or nationally motivated, such\
    \ as state-sponsored terrorism. They have a specific target they want to compromise,\
    \ and they focus only on that one. Though less common and fewer in number, these\
    \ attackers are far more dangerous due to their advanced skill level. Not only\
    \ can they penetrate highly secured systems, their actions are difficult to detect\
    \ and trace. Advanced blackhats make little *noise* when attacking systems, and\
    \ they excel at covering their tracks. Even if you have been successfully attacked\
    \ by such a skilled blackhat, you may never even be aware of it.\n\n        While\
    \ script kiddies and automated attacks represent the largest percentage of attackers,\
    \ the smaller, more dangerous percentage of attackers are the skilled ones that\
    \ do not want anyone to know about their existence. These advanced blackhats do\
    \ not release their tools. They only attack and compromise systems of high value\
    \ (i.e., systems of choice). When these attackers are successful, they do not\
    \ tell the world about it. Instead, they silently infiltrate organizations, collecting\
    \ information, users’ accounts, and access to critical resources. Often, organizations\
    \ have no idea that they have been compromised. Advanced attackers can spend months,\
    \ even years, within a compromised organization without anyone finding out.\n\n\
    \        These attackers are interested in a variety of targets. It could be an\
    \ online banking system, where the attacker is after the database containing millions\
    \ of credit card information. It could be a case of corporate espionage, where\
    \ the attacker is attempting to infiltrate a car manufacturer and obtain research\
    \ designs of future cars. Or it can be as sinister as a foreign government attempting\
    \ to access highly confidential government secrets, potentially compromising the\
    \ security of a country.\n\n        These individuals are highly trained and experienced\
    \ and they are far more difficult to detect than script kiddies. Even after they\
    \ have successfully penetrated an organization, they will take advanced steps\
    \ to ensure that their presence or activity cannot be detected. Very little is\
    \ known about these attackers. Unlike unskilled attackers, advanced blackhats\
    \ do not share the same tools or techniques. Each one tends to develop his own\
    \ skills, methods, and tool sets specialized for specific activities. As such,\
    \ when the tools and methods of one advanced attacker are discovered, the information\
    \ gained may not apply to other advanced blackhats.\n\n        We should mention\
    \ that every computer connected to the Internet is exposed to a great danger.\
    \ This danger may cost you all your life; for example, what would happen if an\
    \ attacker uses your hard drive to store all of the stolen credit card information\
    \ that he has collected? If the competent authorities for credit cards prosecute\
    \ thieves, track the attacker traces, and find that the credit card information\
    \ is in your computer, what will you do? It may happen that the amount of money\
    \ that was stolen from the credit cards is too much. In such an embarrassing case,\
    \ how can you deny the charge against you? Therefore, everyone should take care\
    \ about this great issue and try to make his computer as much secure as possible.\n\
    \n        ### *5.2.2 Attackers’ Motivations*"
