    # 7 Collecting Zero-Day polymorphic worms using Double-Honeynet


    **MOHSEN MOHAMED**


    We have learnt in [Chapters 5](#10_Chapter05.xhtml) and [6](#11_Chapter06.xhtml)
    that we need mainly two steps to generate signatures for zero-day polymorphic
    worms, which are as follows:


    *   First, we should collect zero-day polymorphic worm samples. To do this, we
    have to propose any new sample collection method.

    *   After collecting the samples, we should develop new algorithms to generate
    signatures for the collected samples.


    This chapter will present with examples how the collection process and generation
    of signatures can be performed. The zero-day polymorphic worm collection method
    described here (i.e., double-honeynet system) and developed signature generation
    algorithms: substring extraction algorithm, modified Knuth–Morris–Pratt algorithm,
    and modified principal component analysis algorithm (MPCA) are worked out by Mohammed
    et al. in the works like [2](#11_Chapter06.xhtml#rfn2), [3](#11_Chapter06.xhtml#rfn3),
    [4](#11_Chapter06.xhtml#rfn4), [5](#11_Chapter06.xhtml#rfn5), [6](#11_Chapter06.xhtml#rfn6),
    [7](#11_Chapter06.xhtml#rfn7), [8](#11_Chapter06.xhtml#rfn8), [9](#11_Chapter06.xhtml#rfn9),
    [10](#11_Chapter06.xhtml#rfn10), [11](#11_Chapter06.xhtml#rfn11), [12](#11_Chapter06.xhtml#rfn12).


    This chapter contains two parts. The first part discusses the design of double-honeynet
    system in detail, while the second part discusses the following:


    *   Information about the software used to implement the double-honeynet system

    *   Double-honeynet system configurations using VMware


    ## 7.1 Motivation of Double-Honeynet System


    Unknown Internet worms pose a major threat to the Internet infrastructure security,
    and their destruction causes loss of millions of dollars. Security experts manually
    generate the intrusion detection system signatures by studying the network traces
    after a new worm has been released. Unfortunately, this job takes a lot of time.
    We propose a double-honeynet system that could automatically detect unknown worms
    without any human intervention. In our system, interaction between the two honeynets
    works by forming a loop, which allows us to collect all instances of polymorphic
    worm, which enables the system to produce accurate worm signatures. The double-honeynet
    system is a hybrid system with both network- and host-based mechanisms. This allows
    us to collect instances of polymorphic worm at the network level and at the host
    level, which reduces the false positives and false negatives dramatically [12](#11_Chapter06.xhtml#rfn12).


    ## 7.2 Double-Honeynet Architecture


    The purpose of double-honeynet system is to detect unknown (i.e., previously unreported)
    worms automatically. A key contribution of this system is the ability of distinguishing
    worm activities from normal activities without any involvement of experts in the
    field.


    [Figure 7.1](#12_Chapter07.xhtml#fig7_1) shows the main components of the double-honeynet
    system. First, the incoming traffic goes through the local router, which samples
    the unwanted inbound connections and redirects the samples’ connections to Honeynet
    1. As the redirected packets pass through the local router, packet capture library
    is used to capture the packets and then to analyze their payloads to contribute
    to the signature generation process.


    ![Figure 7.1 Double-honeynet system.](images/pg167_1.jpg)


    **Figure 7.1** Double-honeynet system.


    The local router is configured with publicly accessible addresses, which represent
    wanted services. Connections made to other addresses are considered unwanted and
    redirected to Honeynet 1 through the internal router. Once Honeynet 1 is compromised,
    the worm will attempt to make outbound connections to attack another network.
    The internal router is implemented to separate the double-honeynet from the local
    area network (LAN). This router intercepts all outbound connections from Honeynet
    1 and redirects those to Honeynet 2, which does the same task forming a loop.
    The looping mechanism allows us to capture different instances of the polymorphic
    worm as it mutates on each loop iteration.


    We stop the loop after a considerable amount of time in order to collect polymorphic
    worms. More details about how much time is taken to collect such types of attacks
    are presented in [Section 7.4](#12_Chapter07.xhtml#sch7_7).


    Only those packets that make outbound connections are considered as polymorphic
    worms, and hence the double-honeynet system forwards only the packets that make
    outbound connections. This policy is in place due to the fact that benign users
    do not try to make outbound connections if they are faced with nonexisting addresses.
    In fact, our system collects other malicious activities, which do not intend to
    propagate themselves but to attack targeted machines only. Such malicious attack
    is out of our work scope.


    When enough instances of worm payloads are collected by Honeynet 1 and Honeynet
    2, they are forwarded to the signature generator component, which generates signatures
    automatically using specific algorithms.


    ## References


