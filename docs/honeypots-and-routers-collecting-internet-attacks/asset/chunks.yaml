- raw: 'The job of a modem is to convert digital signals to analog signals and vice
    versa. Modems are generally required when devices perform digital communication
    over the telephone network. By definition, a modem performs *mo*dulation and *dem*odulation
    only, a task that belongs to OSI layer 1. However, in almost all the cases, the
    functionality of the appropriate layer 2 is part of the device.


    ### *1.1.2 Bridge*


    A bridge is a device that operates at layer 2 of the OSI reference model and connects
    two smaller networks together into one, so that the devices in the two segments
    can communicate with each other. The devices are connected to the bridge through
    its ports individually in most of the cases. However, multiple bridges can also
    be joined through the same ports when more than two smaller networks are combined.
    Bridges are commonly referred to as *switches*, although, the term *switch* has
    broader technical meanings. Further details of the functionality of the bridges
    are mentioned in [Section 1.4.1](#06_Chapter01.xhtml#sch1_13).


    ### *1.1.3 Router*


    Routers are also devices that combine one or more networks into one; however,
    they belong to layer 3 of the OSI model. This implies that routers perform more
    and complicated tasks as compared to bridges. Typically, unlike bridges, the devices
    are not directly connected to the ports of the router; it is in fact the bridges
    that are connected to the routers. Multiple routers can also be connected to each
    other to combine the networks attached to each of them. The operations and characteristics
    of the routers are also described later in [Section 1.4.2](#06_Chapter01.xhtml#sch1_14).


    ### *1.1.4 Gateway*


    Imagine a student in China who wants to send his admission request to a university
    in Canada by postal service. What happens if he writes the recipient address only
    in the Chinese language; how would the postal staff in Canada deliver it? When
    two networks following different communication protocols or standards are joined
    together, a network device is required to perform the job of translation or, in
    technical terms, *conversion;* such a device is called *gateway*. The functionality
    of the protocol conversion or translation can be required at different levels
    or layers; hence, gateways can belong to different layers. For example, we can
    say that a modem works as a physical layer gateway device. The common practice
    while designing a computer network is to follow the same protocol in the entire
    network attached to a single router. Hence, the need of a gateway usually arises
    when two routers (following different protocols/standards) are connected together.
    In such a situation, the functionality of the gateway is implemented as an additional
    software component inside the router, resulting in a router working as a gateway
    too.


    It is important to mention here that in most of the present-day computer networking
    scenarios, the devices that we see around us sometimes perform more than one of
    the above-mentioned roles. A very common example is the home routing device, which
    has the functionality of a bridge as well as a router. Similarly, the typical
    DSL modems available these days combine the functionality of a modem, bridge,
    gateway, as well as router.


    ## **1.2 Medium**


    The computer network medium is of two major types: wire and wireless. As the name
    suggests, in the wired medium the message propagates in a physical *wire* used
    to connect the devices. In a wireless medium, on the other hand, the message propagates
    in free space in the form of radio or infrared waves.


    ### *1.2.1 Wired Networks*


    Copper wire is the most common form of medium used in the wired computer networks.
    Coaxial and twisted pair cables are the two widely used copper wire or cable types.
    In dial-up Internet access, plain old telephone service lines are used to connect
    a computer to the Internet. The plain old telephone service lines are also copper
    wires and a computer requires a modem to communicate over this kind of wire. The
    fourth common type is the fiber optic cable, a thin cable or fiber of glass or
    plastic that works as a *pipe of light*.


    *Twisted pair*. As the name suggests, a twisted pair cable is made of thin copper
    wires twisted together. Multiple pairs of wires, shielded or unshielded, are bundled
    together in a cable. Twisted pair cable is the most widely used cable type for
    computer networks and telephone networks due to its lower cost and easy handling.
    It has several types and categories, based on quality, construction, purpose,
    and data rate supported. The highest-grade twisted pair cables can achieve data
    rates up to 1 Gbps; however, most of the variations can carry signals up to 100
    m without significant strength loss.


    *Coaxial*. The coaxial cable has a copper wire in the center with a layer of insulation
    around it. Around this insulation layer, there is another layer of copper in the
    form of a gauze and a final outer insulation jacket. It was a common type of computer
    networking cable before the introduction of twisted pair cables. Still, it is
    commonly used for cable TV and cable Internet.


    *Fiber optic*. In fiber optic cable, the signal is transmitted in the form of
    a light beam or wave inside the glass or plastic fiber. Multiple fibers are bundled
    together usually in a cable. A single fiber can carry multiple light waves, and
    it is possible to achieve very high data rates from each wave as compared to the
    copper wires. Furthermore, the effect of interference and attenuation is very
    low, which makes it possible to transmit the signal over longer distances. Due
    to its very high data rates and higher cost, fiber optic cable is not used to
    interconnect individual computers; rather it is used to combine networks.


    ### *1.2.2 Wireless Networks*


    Wireless networks are of two major categories: in the first, radio waves carry
    the data; in the second infrared waves carry the data. The radio-based wireless
    networks are more common since the infrared waves can only travel in a straight
    line and cannot penetrate through walls. One important characteristic of the wireless
    medium is that it is always shared because the signal travels in open space, which
    is accessible to all.


    ## **1.3 Network Topology**


    Network topology could be either physical or logical. A physical topology describes
    how the devices are physically linked with each other and what kind of medium
    is used for those links. The logical topology, on the other hand, is an abstract
    view of the physical topology with unnecessary details hidden. Thus, a physical
    topology can have multiple logical topologies produced after filtering the irrelevant
    details. The relationship between the two terms can be better described with the
    example of a layout or plan for a building. A detailed plan of a building will
    have all the details such as walls, doors, electric wiring, water lines, and sewer
    lines, just the way a physical topology has all the details of the computer network.
    However, we can also have a layout of electric wiring only for a building; such
    a plan is analogous to the logical topology in computer networks. Devices in a
    computer can be interconnected using different approaches; hence, it is possible
    to have different kinds of physical topologies.


    The area physically covered by a computer network is another important aspect
    with respect to the topology. Primarily, it is due to the varying technical limitations
    of different media types. A classical approach to classify the networks is based
    on the geographical area covered by them. Local area network (LAN), metropolitan
    area network (MAN), and wide area network ( WAN) are the three main categories.
    In the beginning, LANs, MANs, and WANs were distinguished based on the area covered;
    the administrative boundaries of a network and the relevance in the purpose of
    the devices participating in the network are some of the additional factors that
    contribute to decide the category to which a network belongs.'
