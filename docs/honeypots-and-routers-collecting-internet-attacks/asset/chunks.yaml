- raw: "        *   [16.](#10_Chapter05.xhtml#rfn16) K.Y. Tan, Phishing and Spamming\
    \ via IM (SPIM), [http://isc.sans.org/](http://isc.sans.org/) diary.php?storyid=1905,\
    \ last accessed August 11, 2012.\n\n        *   [17.](#10_Chapter05.xhtml#rfn17)\
    \ B. Schneier, Secrets and Lies: Digital Security in a Networked World, 1st edition,\
    \ Wiley, New York, August 14, 2000.\n\n        *   [18.](#10_Chapter05.xhtml#rfn18)\
    \ D.N. Pasman, Catching hackers using a virtual honeynet: A case study, Proceedings\
    \ of the 6th Twente Student Conference on IT, University of Twente, Enschede,\
    \ the Netherlands, February 2, 2007.\n\n        *   [19.](#10_Chapter05.xhtml#rfn19)\
    \ G. Wicherski, Medium Interaction honeypots, April 2006, [http://citeseerx](http://citeseerx).\
    \ [ist.psu.edu/viewdoc/summary?doi=](http://ist.psu.edu/viewdoc/summary?doi=)\
    \ 10.1.1.133.9431, last accessed August 11, 2012.\n\n        *   [20.](#10_Chapter05.xhtml#rfn20)\
    \ M.M.Z.E. Mohammed and A.-S. K. Pathan, Automatic Defense against Zero-day Polymorphic\
    \ Worms in Communication Networks, ISBN 9781466557277, CRC Press, Taylor & Francis\
    \ Group, Boca Raton, FL, 2013.\n\n        \uFEFF\n\n        # 6 security systems\n\
    \n        **MOHSEN MOHAMED**\n\n        The objective of security systems is to\
    \ manage and report operational information security risk in the networks.\n\n\
    \        This chapter covers the following security systems:\n\n        *   Firewall\n\
    \n        *   Antivirus\n\n        *   Intrusion detection and prevention systems\
    \ (IDPSs)\n\n        ## **6.1 Firewall**\n\n        A firewall is a system designed\
    \ to prevent unauthorized access to or from a private network. Firewalls can be\
    \ implemented in both hardware and software, or a combination of both. Firewalls\
    \ are frequently used to prevent unauthorized Internet users from accessing private\
    \ networks connected to the Internet, especially intranets. All messages entering\
    \ or leaving the intranet pass through the firewall, which examines each message\
    \ and blocks those that do not meet the specified security criteria \\[\n\n  \
    \      ### *6.1.1 Types of Firewalls*\n\n        Firewalls can be either hardware\
    \ or software but the ideal firewall configuration \\[20\\] will consist of both.\
    \ In addition to limiting access to your computer and network, a firewall is also\
    \ useful for controlling remote access to a private network and perform it in\
    \ a secure manner through appropriate authentication.\n\n        *Hardware firewalls*.\
    \ This type of firewall can be purchased as a stand-alone product but are also\
    \ typically found in broadband routers, and should be considered as an important\
    \ part of your system and network setup. Most hardware firewalls will have a minimum\
    \ of four network ports to connect other computers, but for larger networks, business\
    \ networking firewall solutions are available.\n\n        *Software firewalls*.\
    \ This type can be installed on your computer (like any software) and you can\
    \ customize it; allowing you some control over its function and protection features.\
    \ A software firewall will protect your computer from outside attempts to control\
    \ or gain access to your computer.\n\n        ### *6.1.2 Common Firewall Techniques*\n\
    \n        As we know that firewalls are used to protect both home and corporate\
    \ networks. A typical firewall software or hardware device filters all information\
    \ coming through the Internet to your network or computer system. There are many\
    \ types of firewall techniques that will prevent potentially harmful information\
    \ from getting through \\[\n\n        *Packet filters (Stateless)*. If a packet\
    \ matches the packet filter’s set of rules, the packet filter will drop or accept\
    \ it.\n\n        *Stateful filters*. It maintains records of all connections passing\
    \ through it and can determine if a packet is either the start of a new connection,\
    \ a part of an existing connection, or is an invalid packet.\n\n        *Application\
    \ layer*. It works like a proxy and it can *understand* certain applications and\
    \ protocols. It may inspect the contents of the traffic, blocking what it views\
    \ as inappropriate content (i.e., websites, viruses, and vulnerabilities).\n\n\
    \        ## **6.2 Antivirus**\n\n        It is a computer software program that\
    \ is used to prevent, detect, and remove malicious software. Antivirus software\
    \ was originally developed to detect and remove computer viruses, hence the name.\
    \ However, with the proliferation of other kinds of malware, antivirus software\
    \ has started to provide protection from other computer threats. In particular,\
    \ modern antivirus software can protect from malicious browser helper objects,\
    \ browser hijackers, ransomware, keyloggers, backdoors, rootkits, Trojan horses,\
    \ worms, malicious layered service providers (LSPs), dialers, fraudtools, adware,\
    \ and spyware \\[\n\n        ## **6.3 Intrusion Detection and Prevention Systems**\n\
    \n        An intrusion detection system (IDS) is a device or software application\
    \ that monitors network or system activities for malicious activities or policy\
    \ violations and produces reports to the administrators. So, the main function\
    \ of IDS is detection by sending report to the administrators; therefore, there\
    \ is no prevention task in the IDS; the prevention can be done manually by the\
    \ administrators after receiving the alert from the IDS. An intrusion prevention\
    \ system (IPS) is a network of security appliances that monitors network and/or\
    \ system activities for malicious activity attempting to block/stop activity,\
    \ and report activity. So, the main function of IPS is automatic prevention and\
    \ also sending report to the administrators about the case. A combination of the\
    \ IDS and IPS is called *IDPS*. Most of the organizations now use IDPS products\
    \ because they offer great defense mechanisms \\[\n\n        Let us give two real-life\
    \ examples to explain more about the main difference between the IDS and IPS.\n\
    \n        > **Example 6.1**\n\n        > \n\n        > Let us consider, we have\
    \ a big house, and there is a security guard to protect this house from the attackers\
    \ or unwanted outsiders. The security guard is always sitting at the main entrance\
    \ of the house, and the house is equipped with a warning bell, which gets activated\
    \ at 1 a.m. and remains active till 8 a.m. The warning bell sends alert if anyone\
    \ tries to enter the house forcefully or by illegitimate means (i.e., anyone not\
    \ coming through the main entrance, which is the legal way). If the warning bell\
    \ sends an alert, the security guard would go to see what exactly has happened.\
    \ In fact, if the warning bell sends an alert, that may not always mean that there\
    \ is an attacker trying to break in the house; it may even be someone among the\
    \ members of the house (legitimate one)! If an illegal person penetrates the house\
    \ and the warning bell does not send an alert, this is considered as a false negative.\
    \ If the warning bell sends an alert for a legal person (by mistake), this is\
    \ considered as a false positive. From this example, it is clear that the warning\
    \ bell acts as an IDS exactly and the security guard is working as the network\
    \ administrator. So, what are the benefits of an IDS, if it does not protect organizations\
