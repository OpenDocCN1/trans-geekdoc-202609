    # 操作系统指纹识别


    操作系统指纹识别或操作系统横幅抓取是一种用于识别远程主机所用操作系统的技术。可以通过多种方式执行操作系统指纹识别。


    ## TCP/IP 实现


    协议（如 `TCP` 和 `IP`）中某些参数的配置取决于具体实现，遗憾的是不同的操作系统拥有其标志性的实现方式。对从目标主机接收到的数据包中这些配置进行分析，可以帮助入侵者识别该主机上运行的操作系统。在表
    3.1 中，列出了不同操作系统使用的初始 TTL 值和窗口大小。我们在第 3.1 节中讨论的扫描技术，可用于捕获目标的响应，然后对比这两个字段的值以识别操作系统类型。其他参数和标志，如
    TCP 初始序列号和 IP 标识号，也可用于揭示操作系统。


    **表 3.1** 不同操作系统常用的 TCP/IP 参数


    | 操作系统 | IP 初始 TTL | TCP 窗口大小 |

    |---|---|---|

    | Linux (内核 2.4 和 2.6) | 64 | 5840 |

    | Google 定制 Linux | 64 | 5720 |

    | FreeBSD | 64 | 65535 |

    | Windows XP | 128 | 65535 |

    | Windows 7、Vista 和 Server 2008 | 128 | 8192 |

    | Cisco 路由器 (IOS 12.4) | 255 | 4128 |


    此外，我们在网络扫描讨论中曾指出，当观察到异常协议操作时，`TCP` 的某些实现会以不同方式响应。例如，响应 Xmas 扫描和 Null 扫描的 `TCP
    RST` 段仅存在于 Berkeley Software Distribution (BSD) 实现中。同样，ICMP 回显扫描仅适用于 BSD 实现，因为只有这些操作系统会响应发送给广播地址的
    ICMP 回显请求。


    ## 应用层协议


    `HTTP`、`SMTP` 和其他应用层协议在其消息横幅中包含有关操作系统的信息，从而暴露其身份。`HTTP` 中的 `server` 和 `user agent`
    头字段是此类横幅抓取的典型例子。


    ## 3.2.2 Windows 平台


    有多种协议、应用程序编程接口 (API) 和工具专门用于 Windows 平台，以恶意攻击 Windows 系统，例如网络基本输入输出系统和 PsTools。


    ### NetBIOS 枚举


    NetBIOS 是 Windows 平台上用于访问局域网资源的 API。Windows 中提供的 `nbtstat` 命令可揭示关于局域网上远程机器和共享资源的重要信息。


    ### PsTools


    此资源工具包包含多个命令行工具，有助于管理 Windows 系统。入侵者也可利用它们收集关于远程和本地系统的信息。


    ### Microsoft 认证


    Microsoft LAN Manager (LM) 和 Microsoft Windows NT LAN Manager 是 Microsoft 产品用于执行质询/响应认证的专有协议。这些协议以哈希形式存储密码，该哈希通过一系列步骤计算得出：将
    14 字符长的密码分成两半并分别处理，为每部分创建一个 8 字节的哈希。早期版本 LM 有一个有趣的缺陷：如果密码长度小于或刚好七个字符，则哈希的第二部分始终为
    `0xAAD3B435B51404EE`。这很容易向入侵者透露实际密码长度为七个字符或更少。


    ### NTFS 数据流操纵


    Windows 平台上的 NTFS 文件系统在 NTFS 卷上存储的每个文件都关联有两个数据流。第一个流存储安全描述符，而第二个流存储文件内的数据。备用数据流
    (ADS) 是另一种可存在于每个 NTFS 文件中的命名数据流。它是可以附加到文件但实际不在文件中的任何类型的数据。分区的主文件表维护着与文件关联的所有数据流及其物理位置的列表；ADS
    通过文件表附加到文件。


    ADS 在 Windows 中的目的是提供一个包含文件元数据的隐藏流，例如属性、字数、作者姓名以及文件的访问和修改时间。然而，ADS 可用于将数据分叉到现有文件中，而不改变或改变其功能、大小或在文件浏览实用程序中的显示。因此，ADS
    为攻击者提供了一种在受损系统上隐藏恶意代码或程序并允许其在不被检测到的情况下执行的方法。


    ## 3.2.3 UNIX/Linux 平台


    ### 枚举


    `finger` 命令用于枚举远程机器上的用户。它提供用户主目录、登录时间、空闲时间、办公位置以及上次接收或阅读邮件的时间等信息。同样，还有其他命令，如 `rpcinfo`
    和 `showmount`，可用于揭示管理信息。


    ## 参考文献


    *   1. Fielding, R., Gettys, J., Mogul, J., Frystyk, H., Masinter, L., Leach,
    P., and T. Berners-Lee, "Hypertext Transfer Protocol – HTTP/1.1", RFC 2616, DOI
    10.17487/RFC2616, June 1999, [`www.rfc-editor.org/`](http://www.rfc-editor.org/)
