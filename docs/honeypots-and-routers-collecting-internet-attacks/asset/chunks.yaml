- raw: "        For example in [Figure 7.1](#12_Chapter07.xhtml#fig7_1), if the local\
    \ router suspects some packet 1 (P[1]), packet 2 (P[2]), and packet 3 (P[3]) to\
    \ be malicious, it redirects them to the Honeynet 1 through the internal router.\
    \ Among these three packets, P[1] and P[2] make outbound connections and internal\
    \ router redirects these outbound connections to Honeynet 2. In Honeynet 2, P[1]\
    \ and P[2] change their payloads and become P[1]’ and P[2]’, respectively (i.e.,\
    \ P[1]’ and P[2]’ are the instances of P[1] and P[2]). Therefore, in this case,\
    \ P[1]’ and P[2]’\n\n        make outbound connections and the internal router\
    \ redirects these connections to Honeynet 1. In Honeynet 1, P[1]’ and P[2]’ change\
    \ their payloads and become *P[1]”* and P[2]”, respectively (i.e., *P[1]”* and\
    \ P[2]” are also other instances of P[1] and P[2]). Now, P[1] and P[2] are found\
    \ malicious because of the outbound connections. Therefore, Honeynet 1 forwards\
    \ P[1], P[1]”, P[2], P[2]” to the signature generator for signature generation\
    \ process. Similarly, Honeynet 2 forwards *P[1]’* and *P[2]’* to the signature\
    \ generator for signature generation process.\n\n        In this scenario, P[3]\
    \ does not make any outbound connection when it gets to Honeynet 1. Therefore,\
    \ P[3] is not considered malicious \\[\n\n        ## **7.3 Software**\n\n    \
    \    The software tools used in the double-honeynet system are introduced below\
    \ \\[\n\n        ### *7.3.1 Honeywall Roo CDROM*\n\n        The Honeywall Roo\
    \ CDROM version 1.4 is downloaded from the Honeynet Project and Research Alliance.\
    \ It provides data capture, control, and analysis capabilities \\[\n\n       \
    \ ### *7.3.2 Sebek*\n\n        Sebek is a data capture tool, which mainly records\
    \ keystrokes, and also all other types of sys\\_read data \\[\n\n        After\
    \ capturing the data, the client sends it to the server, which saves it in a database\
    \ or simply logs the records. The server is normally on the honeywall machine\
    \ in the case of a honeynet, and it collects data from all the honeypots and puts\
    \ it all together for analysis.\n\n        To prevent detection by intruders,\
    \ Sebek employs some obfuscation methods. On the client side, it is completely\
    \ hidden from the user, and therefore, from an intruder on the system as well.\
    \ This is, however, not enough because the data that are captured have to be sent\
    \ to the server, thereby exposing itself. Sebek uses a covert channel to communicate\
    \ with the server. It generates packets to be sent inside Sebek without using\
    \ the TCP/IP stack and the packets are sent directly to the driver bypassing the\
    \ raw socket interface. The packets are then invisible to the user, and Sebek\
    \ modifies the kernel to prevent the user from blocking transition of the packets.\
    \ [Figure 7.2](#12_Chapter07.xhtml#fig7_2) shows Sebek deployment.\n\n       \
    \ ![Figure 7.2 Sebek deployment. (Data from Know Your Enemy: Sebek—A Kernel Based\
    \ Data Capture Tool, http://old.honeynet.org/papers/sebek.pdf, 2012.)](images/pg169_1.jpg)\n\
    \n        **Figure 7.2** Sebek deployment. (Data from *Know Your Enemy: Sebek—A\
    \ Kernel Based Data Capture Tool*, [http://old.honeynet.org/papers/sebek.pdf](http://old.honeynet.org/papers/sebek.pdf),\
    \ 2012.)\n\n        In the case of multiple clients, there is a risk of the clients\
    \ seeing each other’s packets. Sebek configures its own raw socket interface on\
    \ the clients to ignore all incoming Sebek packets. Only the server can receive\
    \ Sebek packets. Due to its comprehensive log capabilities, it can be used as\
    \ a tool for forensics data collection. It has a Web interface that can perform\
    \ data analysis.\n\n        ### *7.3.3 Snort\\_inline*\n\n        Snort\\_inline\
    \ is a modified version of Snort. It is a developed Intrusion Prevention System\
    \ (IPS) that uses the signatures of existing Intrusion Detection System (IDS)\
    \ to make decisions on packet that traverse snort\\_ inline. The decisions are\
    \ usually drop, reject, modify, or allow \\[\n\n        ## **7.4 Double-Honeynet\
    \ System Configurations**\n\n        In this section, we discuss the double-honeynet\
    \ system architecture and configuration using VMware \\[\n\n        ### *7.4.1\
    \ Implementation of Double-Honeynet Architecture*\n\n        [Figure 7.3](#12_Chapter07.xhtml#fig7_3)\
    \ shows the architecture of the double-honeynet system, implemented using VMware\
    \ workstation version 7 on a personal computer with Intel Pentium 4, 3.19-GHz\
    \ CPU, 8GB RAM, and running on Windows XP 64-bit. The operating system of that\
    \ personal computer is referred to as the *host operating system* in [Figure 7.3](#12_Chapter07.xhtml#fig7_3).\
    \ The host machine was connected to our home router and it accessed the Internet\
    \ through it.\n\n        We used virtual machine to deploy the double-honeynet\
    \ system due to the lack of resources and to keep the establishment cost low.\
    \ One personal computer was used and VMware workstation was installed on it. The\
    \ VMware workstation is a software package that gives its users the opportunity\
    \ to create virtual machines that constitute virtual networks interconnected with\
    \ each other. Thus, we created the double-honeynet system as a virtual network\
    \ seen from the outside world as an independent network. Attackers could locate\
    \ the honeypot and attack it. The honeypot was transparently connected to the\
    \ Internet through the honeywall, which in turn intercepted all outbound and inbound\
    \ traffic. Therefore, malicious traffic targeting the honeypot (inbound) or malicious\
    \ traffic generated by the compromised honeypot (outbound) were available to us\
    \ from the honeywall for further analysis and investigation. As we mentioned in\
    \ [Section 7.2](#12_Chapter07.xhtml#sch7_2), Honeynet 1 and Honeynet 2 were configured\
    \ to deliver unlimited outbound connections. The *internal router* was used to\
    \ protect our local network by redirecting all outbound connections from Honeynet\
    \ 1 to Honeynet 2 and vice versa.\n\n        ![Figure 7.3 Double-honeynet architecture.](images/pg171_1.jpg)\n\
    \n        **Figure 7.3** Double-honeynet architecture.\n\n        ### *7.4.2 Double-Honeynet\
    \ Configurations*\n\n        Our double-honeynet system contains six components:\
    \ local router, internal router, LAN, Honeynet 1, Honeynet 2, and signature generator.\
    \ The subnet mask for each subnet (whether local router, internal router, LAN,\
    \ Honeynet 1, Honeynet 2, and signature generator) is consequently 255.255.255.0.\
    \ Sections 7.4.2.1 through 7.4.2.6 discuss the configurations of each component.\n\
    \n        *Local router configuration*. As we mentioned in [Section 7.2](#12_Chapter07.xhtml#sch7_2),\
    \ the local router’s function is to pass unwanted traffic to the Honeynet 1 through\
    \ the internal router. For example, if the IP address space of our LAN is 212.0.50.0/24,\
    \ with one public Web server, the server’s IP address is 212.0.50.19. If an attacker\
    \ outside the network launches a worm attack against 212.0.50.0/24, the worm scans\
    \ the IP address space of victims. It is highly probable that an unused IP address,\
    \ for example, 212.0.50.10 will be attempted before 212.0.50.19. Therefore, the\
    \ local router will redirect the packet to Honeynet 1 through the internal router.\
    \ After the worm compromises the Honeynet 1, the worm will try to make an outbound\
    \ connection to harm another network. We configured the internal router to protect\
    \ the LAN from worms’ outbound connections. The internal router intercepts all\
    \ outbound connections from Honeynet 1 and redirects them to Honeynet 2, which\
    \ performs the same task being done by the Honeynet 1, forming loop connections.\
    \ Below are the details of the local router machine properties and IP-tables configuration.\n\
    \n        *Machine Properties*\n\n        *   *Operating system:* Ubuntu Linux\
    \ 9.10\n\n        *   *Number of network cards:*\n\n        *   Three network\
    \ cards (Eth0, Eth1, and Eth2) \n\n            *   Eth0 and Eth2 are bridged LAN\
    \ port\n\n            *   The function of Eth1 is to connect the local router\
    \ with Honeynet 1 through the internal router\n\n        *   *IP addresses:*\n\
    \n        *   Eth1: 192.168.50.20"
