    # Routers


    Before we finish our review of the basic networking concepts, it is important
    to have another look at the routers under the light of the Internet model and
    the TCP/IP suite. Routers are an important component of the Internet, a WAN based
    on the Internet model, as they are the point through which each LAN is connected
    to the complete WAN; that is, the end user devices in some private network communicate
    with the rest of the Internet through the routers. This leads us to the picture
    of the Internet as a network of several interconnected networks, of varying sizes,
    with each network tapping into the Internet with its router, as described in [Figure
    1.10](#06_Chapter01.xhtml#fig1_10). Thus, the router is the entry/exit point of
    all the traffic between the local network and the rest of the Internet. This fact
    places plenty of workload on the routers, particularly the exit/entry routers,
    usually referred to as *egress/ingress routers*, and makes their importance in
    the communication manifold. In the beginning, the basic tasks of the routers were
    to identify the communication routes and to provide the interoperability for different
    protocols and technologies. But with such a strategic location in the topology,
    routers these days also play a significant role in traffic analysis and filtration.


    Another important fact regarding the Internet architecture described in [Figure
    1.10](#06_Chapter01.xhtml#fig1_10) is that in the core we have a mesh of devices
    mainly to provide interconnectivity. This core is actually the service infrastructure
    provided by several Internet service providers of different level and scale.


    ![Figure 1.10 Physical model of the Internet.](images/pg19_1.jpg)


    **Figure 1.10** Physical model of the Internet.


    ## 1.5 Common Network Protocols


    In [Chapters 2](#07_Chapter02.xhtml) and [3](#08_Chapter03.xhtml), we will focus
    on the information security and the approaches that are used to breach the security
    of an information system. The IP suite is a public group of protocols widely practiced
    in the computer networks and very often the target of hacking attacks. Before
    we conclude our review of the computer networks, it will be very useful for the
    reader to have a brief technical review of some of these important protocols.


    ### 1.5.1 Hypertext Transfer Protocol


    The `HTTP` is an application layer protocol to share hypermedia messages among
    systems. It is a generic protocol that does not maintain state of the communication.
    It is the spirit of the World Wide Web service. The protocol has been improved
    over time to provide better features and support technological advancements; the
    three available versions are `HTTP/0.9`, `HTTP/1.0`, and `HTTP/1.1`, `HTTP/1.1`
    being the latest.


    The `HTTP` follows a request/response model where client initiates the communication
    by sending a request message to the server. The typical items included in this
    request message are request method, uniform resource identifier, protocol version,
    request modifiers, client information, and possible body content. The server responds
    to this request with a response message, which usually contains a status line,
    message''s protocol version, a success or error code, server information, entity
    meta-information, and possible entity-body content.


    `HTTP` communication is performed over `TCP/IP` connections with servers listening
    by default at `TCP` port `80`. However, use of `TCP` is not compulsory and any
    transport protocol that provides reliable delivery can be used. In `HTTP/1.0`,
    by default, a new transport connection is used for each request/response exchange,
    while in `HTTP/1.1`, it is possible to use a connection for one or more request/response
    exchanges, usually referred to as *persistent behavior*.


    `HTTP` has only two types of messages: request message sent by the client and
    response message sent by the server. The generic format of the two messages is
    displayed in [Figures 1.11](#06_Chapter01.xhtml#fig1_11) and [1.12](#06_Chapter01.xhtml#fig1_12).


    ![Figure 1.11 HTTP request message format.](images/pg20_1.jpg)


    **Figure 1.11** HTTP request message format.


    ![Figure 1.12 HTTP response message format.](images/pg21_1.jpg)


    **Figure 1.12** HTTP response message format.


    ### 1.5.2 Transmission Control Protocol


    The `TCP` is an important core protocol from the IP suite designed to work at
    the transport layer and provide a reliable host-to-host service in packet-switched
    computer communication networks. It is a connection-oriented end-to-end protocol
    and supports multinetwork applications. The `TCP` provides reliable, ordered,
    and error-checked interprocess delivery of stream of octets between pairs of processes
    running in host computers attached to interconnected computer communication networks.
    Other features of the `TCP` include flow control and congestion control, but no
    security or bandwidth guarantees.


    `TCP` is a combination of several algorithms and procedures that can be discussed;
    however, we will limit the review to the segment structure and the connection
    establishment in the following review.


    #### TCP Segment Structure


    Unlike `HTTP`, where we have two separate message types, the purpose of a `TCP`
    segment is described through the selection of flags in the segment header. There
    are six basic flags that are defined in request for comments (RFC) 793:


    *   `URG`: Urgent pointer field significant

    *   `ACK`: Acknowledgment field significant

    *   `PSH`: Push function

    *   `RST`: Reset the connection

    *   `SYN`: Synchronize sequence numbers

    *   `FIN`: No more data from sender


    ![Figure 1.13 TCP segment format.](images/pg22_1.jpg)


    **Figure 1.13** TCP segment format.


    Most of the fields in this segment ([Figure 1.13](#06_Chapter01.xhtml#fig1_13))
    are self-descriptive and generic in nature. However, the implementation of the
    sequence number field is host dependent and can be exploited by the intruders.
    Every `TCP` segment is assigned a sequence number by the host originating this
    segment, so that the different segments sent by this host can be properly ordered
    by the recipient host and the duplicates can be removed. The selection of initial
    sequence number, that is, the number sent in the first segment generated by a
    host is usually dependent on the operating system implementation of `TCP` at that
    host. This phenomenon helps the intruders to understand the type of OS by observing
    the initial sequence number.


    #### TCP Connection Setup


    `TCP` uses a three-way handshake process to establish a connection before starting
    to transmit the data segments (see [Figure 3.4](#08_Chapter03.xhtml#fig3_4)).
    The process is initiated by the client host by sending a segment with only the
    `SYN` bit set to indicate the intention to establish a connection. The server,
    if interested, replies with a segment where both `SYN` and `ACK` bits are set
    to acknowledge the receipt of the segment as well as the intention to establish
    the connection. Finally, the client will acknowledge the receipt by sending a
    segment with `ACK` bit set.


    ![Figure 1.14 TCP three-way handshake connection setup.](images/pg23_1.jpg)


    **Figure 1.14** TCP three-way handshake connection setup.


    ### 1.5.3 Dynamic Host Configuration Protocol


    The `DHCP`


    Using `DHCP` an IP address can be allocated to a host in three possible ways.
    First, *automatic allocation* is possible to assign a permanent IP address to
    a host. Second, an IP address can be assigned to a client for a limited period
    of time, referred to as *dynamic allocation*. Finally, in *manual allocation*,
    the IP address assigned to the client is selected by the network administrator,
    and `DHCP`''s job is to simply convey this assignment.


    #### How DHCP Assigns an IP Address


    In `DHCP`, a client follows a four-step process to automatically acquire the IP
    address ([Figure 1.15](#06_Chapter01.xhtml#fig1_15)).

