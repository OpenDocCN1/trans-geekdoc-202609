    \n## Z\n\n*   **Zero-day attacks**, [84](#10_Chapter05.xhtml#page_84), [107](#10_Chapter05.xhtml#page_107)\n\
    *   **Zero-day exploits**, [110](#10_Chapter05.xhtml#page_110)\n\n---\n\n1.  [*](#06_Chapter01.xhtml#RFN-1)\
    \ The presence of the functionality of an upper OSI layer in a device requires\
    \ that it should perform the tasks of all the lower layers as well, that is, it\
    \ should implement all the layers up to that level. Hence, if we say a device\
    \ is a layer 3 device or belongs to layer 3, this means that it implements (or\
    \ performs the actions associated with) all the layers from layer 1 to layer 3.[↩](#fnref1)\n\
    \n2.  [*](#06_Chapter01.xhtml#RFN-2) The term *device* here technically means\
    \ *interface of a device*. Since a device can have more than one network interfaces,\
    \ each of these interfaces will have its own MAC address. However, it is possible\
    \ that at the upper layers, all these separate data streams are combined for one\
    \ single communication purpose. For example, routers usually have multiple interfaces\
    \ and the job of forwarding is performed by relaying a packet—received on one\
    \ of the interfaces—to a suitable interface.[↩](#fnref2)\n\n3.  [*](#06_Chapter01.xhtml#RFN-4)\
    \ The Ethernet and 802.3 are generally considered the same standard these days.\
    \ However, they have minor technical differences in their original design.[↩](#fnref3)\n\
    \n4.  [*](#06_Chapter01.xhtml#RFN-5) Although not displayed in the figure, bridges,\
    \ if required, also support IEEE wireless PHY/MAC standards.[↩](#fnref4)\n\n5.\
    \  [*](#06_Chapter01.xhtml#RFN-7) Since one hexadecimal digit is equal to four\
    \ binary digits, each number will have four hexadecimal digits.[↩](#fnref5)\n\n\
    6.  [*](#06_Chapter01.xhtml#RFN-9) There are some cases when the DHCP offer is\
    \ not broadcast, for example, when the client already has an IP address and is\
    \ just requesting an extension in the lease.[↩](#fnref6)\n\n7.  [*](#07_Chapter02.xhtml#RFN-1)\
    \ There are several aspects of security in the context of computers such as hardware\
    \ and software; however, the focus of this book is on the communication performed\
    \ using computers over the computer networks.[↩](#fnref7)\n\n8.  [*](#07_Chapter02.xhtml#RFN-2)\
    \ The most familiar use of the term CIA is for Central Intelligence Agency; hence,\
    \ in the literature some authors have also used the term *AIC triad* to avoid\
    \ the confusion.[↩](#fnref8)\n\n9.  [*](#08_Chapter03.xhtml#RFN-1) In hacking,\
    \ reconnaissance techniques are further classified into groups such as Foot printing,\
    \ enumeration, or scanning. The banner grabbing attack, as described in the text,\
    \ cannot be precisely placed into any of these subclasses as it achieves multiple\
    \ purposes.[↩](#fnref9)\n\n10.  [*](#08_Chapter03.xhtml#RFN-1) In hacking, reconnaissance\
