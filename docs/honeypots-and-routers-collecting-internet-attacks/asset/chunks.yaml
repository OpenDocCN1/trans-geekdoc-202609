  trans: "\n\n## Honeywall 配置\n\n### 网络接口\n*   **Eth1**: `192.168.59.20`\n*   **Eth2**:\
    \ `192.168.40.8`\n\n### 蜜网公网 IP 地址\n在下文中，我们输入蜜罐的外部 IP 地址。这些 IP 地址属于攻击者：\n\n**IP\
    \ 地址**: `192.168.59.22`; `192.168.59.23`\n\n### 蜜网网络\n此处，我们以 CIDR 表示法输入蜜网网络：\n\
    \n**蜜网网络 CIDR**: `192.168.59.0/24`\n\n### 蜜网广播地址\n`192.168.59.255`\n\n### 管理接口\n\
    第三个接口将用于远程管理。该接口帮助我们通过 SSH 和 Walleye Web 界面远程管理 Honeywall。我们使用 Eth2 作为管理接口。\n\n\
    *   **管理接口的 IP 地址**: `192.168.40.8`\n*   **管理接口的网络掩码**: `255.255.255.0`\n*   **管理接口的默认网关**:\
    \ `198.168.40.1`\n*   **Honeywall 网关的 DNS 服务器 IP**: `192.168.40.2`\n*   **SSH\
    \ 监听端口**: `22`\n*   **允许访问管理接口的 TCP 端口空格分隔列表**: `22 443`\n*   **允许访问管理接口的 IP 地址空格分隔列表**:\
    \ `192.168.40.0/24`\n\n### 防火墙限制\n双重蜜网配置为执行无限制的出站连接，如上文 (7.2) 所述。\n\n### 配置 Sebek\
    \ 变量\n*   **Sebek 数据包的目标 IP 地址**: `192.68.59.20`\n*   **Sebek 数据包的目标 UDP 端口**:\
    \ `1101`\n\n### 蜜罐配置\n以下是蜜罐机器属性的详细信息：\n\n#### 蜜罐 1\n**机器属性**\n*   **操作系统**: Windows\
    \ XP\n*   **网卡数量**: 我们使用一张网卡：Eth0\n*   **IP 地址**: `192.168.59.22`\n\n#### 蜜罐 2\n\
    **机器属性**\n*   **操作系统**: Ubuntu Linux 9.10\n*   **网卡数量**: 我们使用一张网卡：Eth0\n*   **IP\
    \ 地址**: `192.168.59.23`\n\n## 签名生成器配置\n签名生成器的功能是为多态蠕虫样本生成签名。\n\n### 机器属性\n*  \
    \ **操作系统**: Ubuntu Linux 9.10\n*   **网卡数量**: 一张网卡：Eth0\n*   **IP 地址**: Eth0: `192.168.55.22`\n\
    \n## 7.5 摘要\n本章讨论了两部分内容。第一部分，我们给出了双重蜜网系统的完整细节。第二部分，我们简要介绍了用于实现双重蜜网系统的软件，以及使用 VMware\
    \ 进行的双重蜜网配置。\n\n## 参考文献\n*   **[1]** M.M.Z.E. Mohammed, H.A. Chan, N. Ventura,\
    \ M. Hashim, and I. Amin, \"A modified Knuth-Morris-Pratt algorithm for zero-day\
    \ polymorphic worms detection,\" *Proceedings of the International Conference\
    \ on Security & Management*, 2 Vols, CSREA Press, Las Vegas, NV, pp. 652–657,\
    \ July 13–16, 2009.\n*   **[2]** M.M.Z.E. Mohammed, and H.A. Chan, \"Honeycyber:\
    \ Automated signature generation for zero-day polymorphic worms,\" *Proceedings\
    \ of the IEEE Military Communications Conference*, San Diego, CA, pp. 1–6, November\
    \ 17–19, 2008.\n*   **[3]** M.Z.E.M. Mohssen, H.A. Chan, N. Ventura, M. Hashim,\
    \ and I. Amin, \"Accurate signature generation for polymorphic worms using principal\
    \ component analysis,\" *Proceedings of the IEEE GLOBECOM Workshop on Web and\
    \ Pervasive Security*, Miami, FL, pp. 1555–1560, December 6–10, 2010.\n*   **[4]**\
    \ Know Your Enemy: Honeywall CDROM Roo, <https://projects.honeynet.org/honeywall/>,\
    \ last accessed August 18, 2012.\n*   **[5]** The Honeynet Project. Roo CDROM\
    \ User's Manual, <http://old.honeynet.org/tools/cdrom/roo/manual/index.html>,\
    \ last accessed August 18, 2012.\n*   **[6]** Know Your Enemy: Sebek—A Kernel\
    \ Based Data Capture Tool, <http://old.honeynet.org/papers/sebek.pdf>, last accessed\
    \ August 18, 2012.\n*   **[7]** Snort—The de facto standard for intrusion detection/prevention,\
    \ <http://www.snort.org>, last accessed August 18, 2012.\n*   **[8]** M.M.Z.E.\
    \ Mohammed and A.-S. K. Pathan. *Automatic Defense against Zero-day Polymorphic\
    \ Worms in Communication Networks*, ISBN 9781466557277, CRC Press, Taylor & Francis\
    \ Group, Boca Raton, FL, 2013.\n\n# 索引\n**注意:** 定位符后跟 `f` 和 `t` 表示文中的图和表。\n\n\
