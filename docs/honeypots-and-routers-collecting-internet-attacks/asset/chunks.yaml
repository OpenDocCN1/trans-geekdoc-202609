    # 扫描与枚举


    扫描和枚举是属于黑客攻击第二阶段（即扫描阶段）的两种技术；感到困惑吗？令人惊讶的是，黑客行业为某个攻击阶段和该阶段使用的一种技术选用了同一个词，这主要是因为枚举与扫描非常相似。然而，枚举的目标是发现用户名、机器名、共享资源、服务及其他类似实体。另一方面，扫描旨在发现活跃的网络主机及这些主机上的开放端口，因此也被称为*网络扫描*。


    ## 参考文献


    *   1. 经济合作与发展组织 (OECD)。OECD 信息系统与网络安全准则：迈向安全文化，经济合作与发展组织，法国巴黎，2002 年 7 月 25 日。
    [`www.oecd.org/`](http://www.oecd.org/) sti/ieconomy/15582260.pdf。

    *   2. G. Stoneburner, C. Hayden, and A. Feringa 信息技术安全工程原则（实现安全的基准），修订版 A，计算机安全分部，信息技术实验室，美国国家标准与技术研究院，马里兰州盖茨堡，2004
    年 6 月。

    *   3. ISACA，信息安全业务模型简介，ISACA，伊利诺伊州罗林梅多斯，2009 年。

    *   4. J. McCumber，信息系统安全：一个综合模载，载于：第 14 届全国计算机安全会议论文集，NIST，马里兰州巴尔的摩，1991 年。

    *   5. D. Parker，《计算机犯罪对策》，John Wiley & Sons，纽约，1998 年。

    *   6. W. Maconachy, C. Schou, D. Ragsdale, and D. Welch，信息保障模型：一种综合方法，载于：IEEE
    信息保障与安全研讨会论文集，美国军事学院，纽约，2001 年。

    *   7. Y. Cherdantseva, and J. Hilton，信息保障与安全参考模型，载于：第八届可用性、可靠性与安全国际会议 (ARES)
    论文集，德国雷根斯堡，9 月 2-6 日，2013 年。

    *   8. J. Saltzer, and M. Schroeder，计算机系统中的信息保护，IEEE 会刊 63(9)，1278–1308，1975 年。

    *   9. Y. Cherdantseva, and J. Hilton，信息保障与安全参考模型，[`rmias.cardiff.ac.uk/`](http://rmias.cardiff.ac.uk/)，2015
    年 3 月 29 日。

    *   10. D. Parker，我们过于简化的信息安全模型及其修正方法，ISSA Journal 8(7)，12–21，2010 年 7 月。

