- raw: "        IDPS components can be connected with each other through regular networks\
    \ or a separate network designed for security software management known as a *management\
    \ network*. If a management network is used, each sensor or agent host has an\
    \ additional network interface known as a *management interface* that connects\
    \ to the management network, and the hosts are configured, so that they cannot\
    \ pass any traffic between management interfaces and other network interfaces.\
    \ The management servers, database servers, and consoles are attached to the management\
    \ network only. This architecture effectively isolates the management network\
    \ from the production networks, concealing the IDPS from attackers and ensuring\
