    MAC 地址，以便稍后用于欺骗。


    ## 3.1.8 DNS 漏洞


    域名系统（DNS）是互联网上的重要服务，DNS 服务器保存互联网域名与其关联的主机 IP 地址之间的映射。DNS 服务器以层级方式实现：顶层为一组根 DNS
    服务器，第二层为顶级域服务器，第三层为权威 DNS 服务器。DNS 是公开可访问的服务，便于访问互联网及其服务。因此，DNS 与互联网上的其他公共服务一样脆弱。


    ### Intranet DNS Spoofing（内网 DNS 欺骗）


    入侵者利用嗅探技术捕获 LAN 上生成的 DNS 请求报文。由于 DNS 报文未加密，捕获报文后任何人都可查看请求内容。入侵者继而伪造 DNS 回复，向请求主机提供错误信息。错误的
    DNS 信息意味着请求的互联网地址会映射到错误的主机/IP，这些可能属于入侵者创建的伪造站点，用于捕获受害主机发送的报文。


    捕获 DNS 请求的常用方法是利用 ARP 投毒攻击网关/路由器，使其拥有无效的 DNS 服务器条目。于是路由器将所有 DNS 请求重定向给入侵者，误以为其为指定的本地
    DNS 服务器。


    ### Internet or Remote DNS Spoofing（互联网或远程 DNS 欺骗）


    在远程 DNS 欺骗中，入侵者的目标是互联网上可被欺骗的任意客户端。方法不同，因为不再只有一个路由器可被投毒。此类攻击借助木马修改受害者的 DNS 设置。一旦实现，受害者的所有
    DNS 请求将发送到入侵者指定的伪造 DNS 服务器。后果与 Intranet DNS Spoofing 相同。


    借助木马，入侵者还可修改受害者的代理服务器设置，使受害者发往代理服务器的所有流量转到伪造主机。


    ### DNS Cache Poisoning（DNS 缓存投毒）


    组织网络中维护本地 DNS 服务器作为缓存，以限制外发 DNS 流量并减少延迟。这些缓存存储历史学习的 DNS 映射，对相似请求由缓存响应。入侵者可通过添加错误条目或修改现有条目来投毒此缓存。


    ## 3.2 操作系统漏洞


    操作系统（OS）是人类设计的软件，像协议一样可能存在可被入侵者利用的漏洞。OS 世界与网络世界截然不同，互操作性不高。因此，攻击只有针对特定 OS 的性质精心设计才有效。与网络中通过查看包内容即可轻松识别协议不同，确定
    OS 类型需要更深入的分析和更激进的技术。


    ### 3.2.1 OS Fingerprinting（操作系统指纹识别）


