- raw: "        In fact, the main function of the low-interaction honeypots is detection,\
    \ specifically of unauthorized scans or unauthorized connection attempts. As we\
    \ mentioned above, low-interaction honeypots offer a limited functionality, most\
    \ of this can be emulated by a program. The program is simply installed on a host\
    \ system and configured to offer whatever services the admin wants, and the honeypot\
    \ is ready. This makes both deployment and maintenance of the honeypot easy. All\
    \ that the administrator has to do is to maintain patch levels of the program\
    \ and monitor any alerting mechanisms.\n\n        Low-interaction honeypots have\
    \ the lowest risk, because there are no real OSs for the attacker to interact\
    \ with (i.e., all of the services are emulated not real). So, these honeypots\
    \ cannot be used to harm or monitor other systems. Low-interaction honeypots log\
    \ only limited information and are designed to capture known activities. An attacker\
    \ can detect a low-interaction honeypot by executing a command that the emulation\
    \ does not support.\n\n        One of the advantages of this approach is that\
    \ the activities of the attacker are naturally *sand-boxed* within the boundaries\
    \ of the software running on a host OS. The honeypot can pretend to be, for example,\
    \ a Solaris server, with TCP/IP stack characteristics of a Solaris system emulated\
    \ to fool OS fingerprinting and services that one would expect to see on such\
    \ a server running Solaris. However, because these services are incompletely implemented,\
    \ exploits written to compromise a Solaris server will at best result in a simulated\
    \ compromise of the honeypot. That is, if the exploit is known and handled by\
    \ the honeypot, the actual host OS is not compromised. At the worst case, the\
    \ exploit will fail, because the exploit is unknown, or the vulnerability is not\
    \ implemented in the honeypot.\n\n        Another advantage of the low-interaction\
    \ honeypot is that the attacker is also restricted from attacking other hosts\
    \ from the honeypot system. This is again because the compromise of the server\
    \ is emulated.\n\n        Using low-interaction honeypots has also some disadvantages,\
    \ which come from the advantages! By definition, no low-interaction emulation\
    \ of an OS and its services will be complete. The responses an attacker would\
    \ expect for known vulnerabilities and exploits are emulated, so a low-interaction\
    \ honeypot will not respond accurately to exploits we have not included in the\
    \ emulated responses. The so-called zero-day exploits would fall into this category.\
    \ These exploits are kept private by the attackers and it is therefore, difficult\
    \ to prepare your honeypot for these kinds of exploits \\[\n\n        ### *5.4.2\
    \ High-Interaction Honeypots*\n\n        The high-interaction honeypots are so\
    \ different from low-interaction honeypots in terms of implementation and collecting\
    \ information. They utilize actual OSs rather than emulations. As actual OSs are\
    \ used in the high-interaction honeypots, the attacker gets a more realistic experience,\
    \ and we can be able to gather more information about intended attacks. This makes\
    \ high-interaction honeypots very useful in situations where one wishes to capture\
    \ details of vulnerabilities or exploits that are not yet known to the public.\
    \ These vulnerabilities or exploits are being used only by a small number of attackers\
    \ who discovered the vulnerability and wrote an exploit for it. Such exploits\
    \ are known as *zero-day* exploits. It is very important to find and publicize\
    \ these vulnerabilities quickly, so that system administrators can filter or work\
    \ around these problems. Also vendors can develop and release software patches\
    \ to fix these vulnerabilities \\[\n\n        The high-interaction honeypots are\
    \ very dangerous, because the attackers can use these systems to harm other systems.\
    \ So, most often high-interaction honeypots are placed within a controlled environment,\
    \ such as behind a firewall. The ability to control the attacker comes not from\
    \ the honeypot itself but also from the network access control device—in many\
    \ cases, the firewall. The firewall allows the attacker to compromise one of the\
    \ honeypots sitting behind the firewall, but it does not let the attacker use\
    \ the honeypot to launch attacks back out. Such architecture is very complex to\
    \ deploy and maintain, especially if you do not want the attacker to realize that\
    \ he is being monitored and controlled. A great deal of work goes into building\
    \ a firewall with proper rule bases.\n\n        As we have mentioned above, the\
    \ high-interaction honeypots need extensive control mechanisms; these can be extremely\
    \ difficult and time consuming to install and configure. To implement high-interaction\
    \ honeypots, a variety of different technologies should be combined, such as firewall\
    \ and IDSs. All of the technologies have to be properly customized for the high-interaction\
    \ honeypot. Maintenance is also time-consuming, because we must update firewall\
    \ rule bases and IDS signature databases and monitor the honeypot activity around\
    \ the clock. Because of these complexities, the high-interaction honeypots have\
    \ high risk. The more interaction we allow the attacker, the more that can go\
    \ wrong. However, once implemented correctly, a high-interaction honeypot can\
    \ give valuable insights about attackers that no other honeypot can.\n\n     \
    \   ### *5.4.3 Medium Interaction Honeypots*\n\n        Medium interaction honeypots\
    \ \\[\n\n        The key feature of medium interaction honeypots is application\
    \ layer virtualization. They do not aim at fully simulating a full operational\
    \ system environment, nor do they implement all details of an application protocol.\
    \ What the medium interaction honeypots do is to provide sufficient responses\
    \ that known exploits wait on certain ports that will trick them into sending\
    \ their payloads.\n\n        Once the payload has been received, the shellcode\
    \ is extracted and analyzed somehow. The medium interaction honeypot then emulates\
    \ the actions the shellcode would perform to download the malware. Therefore,\
    \ the honeypot has to provide some virtual file system as well as virtual standard\
    \ Windows download utilities. The honeypot can then download the malware from\
    \ the serving location and store it locally or submit it somewhere else for analysis.\n\
    \n        ## **5.5 Overview of Five Honeypots**\n\n        In this section, we\
    \ present an overview of five notable honeypots \\[\n\n        ### *5.5.1 BackOfficer\
    \ Friendly*\n\n        BOF was developed by Marcus Ranum and the folks at Network\
    \ Flight Recorder. The BOF is commonly called as a simple, free honeypot solution.\
    \ BOF is considered a low-interaction honeypot designed to run on almost any Windows\
    \ system.\n\n        BOF is very simple, so anyone can install it on their system;\
    \ also, it is easy to configure and requires low maintenance. Because of the fact\
    \ that it is simple, its capabilities are also severely limited. It has a small\
    \ set of services that simply listen on ports, with notably limited emulation\
    \ capabilities.\n\n        ### *5.5.2 Specter*\n\n        Specter is developed\
    \ and sold by NetSec, and it is considered as a commercially supported honeypot.\
    \ Specter is also considered as a low-interaction honeypot like BOF, but it has\
    \ more functionality and capabilities than BOF. In fact, Specter is not just the\
    \ emulated services, but it has the ability to emulate different OSs and vulnerabilities.\
    \ It also has extensive alerting and logging capabilities. Moreover, Specter is\
    \ easy to deploy, simple to maintain, and is less risky as it only emulates services\
    \ with limited interaction. However, compared to medium and high-interaction honeypots,\
    \ it is limited in the amount of information that it can gather. Specter is primarily\
    \ a production honeypot.\n\n        ### *5.5.3 Honeyd*\n\n        Honeyd is considered\
    \ as an open source low-interaction honeypot. The main functions of Honeyd are\
    \ to\n\n        *   Detect\n\n        *   Capture\n\n        *   Alert suspicious\
    \ activity"
  fmt: '

    ## 5.4.2 High-Interaction Honeypots


    The high-interaction honeypots are so different from low-interaction honeypots
    in terms of implementation and collecting information. They utilize actual OSs
    rather than emulations. As actual OSs are used in the high-interaction honeypots,
    the attacker gets a more realistic experience, and we can be able to gather more
    information about intended attacks. This makes high-interaction honeypots very
    useful in situations where one wishes to capture details of vulnerabilities or
    exploits that are not yet known to the public. These vulnerabilities or exploits
    are being used only by a small number of attackers who discovered the vulnerability
    and wrote an exploit for it. Such exploits are known as `zero-day` exploits. It
    is very important to find and publicize these vulnerabilities quickly, so that
    system administrators can filter or work around these problems. Also vendors can
    develop and release software patches to fix these vulnerabilities.


    The high-interaction honeypots are very dangerous, because the attackers can use
    these systems to harm other systems. So, most often high-interaction honeypots
    are placed within a controlled environment, such as behind a firewall. The ability
    to control the attacker comes not from the honeypot itself but also from the network
    access control device—in many cases, the firewall. The firewall allows the attacker
    to compromise one of the honeypots sitting behind the firewall, but it does not
    let the attacker use the honeypot to launch attacks back out. Such architecture
    is very complex to deploy and maintain, especially if you do not want the attacker
    to realize that he is being monitored and controlled. A great deal of work goes
    into building a firewall with proper rule bases.


    As we have mentioned above, the high-interaction honeypots need extensive control
    mechanisms; these can be extremely difficult and time consuming to install and
    configure. To implement high-interaction honeypots, a variety of different technologies
    should be combined, such as firewall and IDSs. All of the technologies have to
    be properly customized for the high-interaction honeypot. Maintenance is also
    time-consuming, because we must update firewall rule bases and IDS signature databases
    and monitor the honeypot activity around the clock. Because of these complexities,
    the high-interaction honeypots have high risk. The more interaction we allow the
    attacker, the more that can go wrong. However, once implemented correctly, a high-interaction
    honeypot can give valuable insights about attackers that no other honeypot can.


    ## 5.4.3 Medium Interaction Honeypots


    Medium interaction honeypots.


    The key feature of medium interaction honeypots is application layer virtualization.
    They do not aim at fully simulating a full operational system environment, nor
    do they implement all details of an application protocol. What the medium interaction
    honeypots do is to provide sufficient responses that known exploits wait on certain
    ports that will trick them into sending their payloads.


    Once the payload has been received, the shellcode is extracted and analyzed somehow.
    The medium interaction honeypot then emulates the actions the shellcode would
    perform to download the malware. Therefore, the honeypot has to provide some virtual
    file system as well as virtual standard Windows download utilities. The honeypot
    can then download the malware from the serving location and store it locally or
    submit it somewhere else for analysis.


    ## 5.5 Overview of Five Honeypots


    In this section, we present an overview of five notable honeypots.


    ### 5.5.1 BackOfficer Friendly


    BOF was developed by Marcus Ranum and the folks at Network Flight Recorder. The
    BOF is commonly called as a simple, free honeypot solution. BOF is considered
    a low-interaction honeypot designed to run on almost any Windows system.


    BOF is very simple, so anyone can install it on their system; also, it is easy
    to configure and requires low maintenance. Because of the fact that it is simple,
    its capabilities are also severely limited. It has a small set of services that
    simply listen on ports, with notably limited emulation capabilities.


    ### 5.5.2 Specter


    Specter is developed and sold by NetSec, and it is considered as a commercially
    supported honeypot. Specter is also considered as a low-interaction honeypot like
    BOF, but it has more functionality and capabilities than BOF. In fact, Specter
    is not just the emulated services, but it has the ability to emulate different
    OSs and vulnerabilities. It also has extensive alerting and logging capabilities.
    Moreover, Specter is easy to deploy, simple to maintain, and is less risky as
    it only emulates services with limited interaction. However, compared to medium
    and high-interaction honeypots, it is limited in the amount of information that
    it can gather. Specter is primarily a production honeypot.


    ### 5.5.3 Honeyd


    Honeyd is considered as an open source low-interaction honeypot. The main functions
    of Honeyd are to:


    *   Detect

    *   Capture

    *   Alert suspicious activity

    '
