    ## 4.3.2 Scanning Strategies


    ### Random scanning using lists

    In order to improve the efficiency of the attack and propagation process, worms
    may use lists/ranges of network addresses produced from the public data available
    on the Internet about different organizations. The scanning in this way would
    be more precise and directed.


    ### Island hopping

    In island hopping, the worm does not scan all the addresses from the selected
    range; rather, it divides the range into smaller blocks and randomly scans few
    addresses from each block to minimize the time. Certainly, the accuracy of this
    approach would also be less, as the missed hosts could be vulnerable.


    ### Directed attack

    This approach includes targeting a specific network or organization due to its
    significance or the attackers having special interest in it. Information warfare
    or attacks on some popular governmental or non-governmental networks are examples
    of directed attack.


    ### Hit-list scanning

    Hit-list scanning is more like *random scanning with the list*, as the worm has
    a list of possibly vulnerable nodes beforehand in this technique, and scanning
    is performed in that range. However, as soon as the first victim is found and
    successfully compromised, the main worm node assigns the half of the remaining
    list to this new worm node and itself continues with the other half. This way
    the remaining workload is reduced every time a new victim is found.


    ## 4.3.3 Worm Architecture


    Worm software generally has five primary components to perform its operations,
    which we have mentioned above.


    ### Reconnaissance

    The life cycle of a computer worm starts with the hunt for victims. The component
    of the software responsible for this task is usually named *reconnaissance*. The
    objective of this component is similar in nature to the first phase of hacking
    mentioned in [Section 2.5.2](#07_Chapter02.xhtml#sch2_18a), also called *reconnaissance*.


    ### Attack components

    Once a vulnerable host is identified, it is attacked using one or more suitable
    techniques, mentioned earlier. This task is usually a separate function or component
    of the worm software.


    ### Communication components

    Worm software also has the functions, operations, or interfaces available to facilitate
    communication between different members of the worm network.


    ### Command components

    One important set of communication performed among the worm nodes is to issue
    commands to each other to get them executed at the recipient. The worm contains
    a suitable list of commands and interface to execute these commands for the collective
    attack.


    ### Intelligence components

    This component includes algorithms and intelligent techniques for efficient operation
    of the worm such as faster intercommunication, efficient scanning, and so on.


    ## 4.4 Worm Examples


    In this section, we discuss some popular and well-known worms.


    ### 4.4.1 Morris

    Morris was released to attack the Internet on November 2, 1988; it is, being first
    of its kind, a self-replicating program. *Morris worm* invaded VAX and Sun-3 computers
    based on Berkeley UNIX and used their resources to replicate the attack. Within
    hours, the worm spread across the United States, affecting thousands of computers
    and making many of them unusable due to its heavy computing load. The worm was
    designed to execute as a tiny process to keep itself unnoticeable; however, its
    self-replicating behavior was underestimated and that caused serious damage by
    spreading the worm to as many computers as possible. The computing performance
    of the affected machines started degrading due to the worm process running in
    secret, and there were multiple instances of the worm in execution, as the same
    computer was attacked more than once. Eventually, because of the exhaustion of
    memory and other processing resources, the systems failed completely.


    ### 4.4.2 Melissa

    Melissa was the first major worm spread through mail and was first recognized
    on March 26, 1999. Later, email became the popular medium to spread worms.


    Melissa contained a Microsoft Word macro virus, a type of computer viruses that
    use an application’s own macro programming language to distribute themselves such
    as Microsoft Word or Excel. It spread in a semi-active manner by attacking Microsoft
    Word and Outlook. Whenever a user on the affected machine attached a Microsoft
    Word document to an email and used Microsoft Outlook as the email client, the
    copy of the email is automatically sent by the Melissa to the first 50 addresses
    in the user’s address book.


    ### 4.4.3 Sadmind

    Sadmind worm created on May 8, 2001 used vulnerabilities to compromise systems
    and to deface Web pages. It affected the Microsoft Internet Information Services
    (IIS) and Sun Solaris systems, and a patch had already been released to remove
    the vulnerabilities targeted by Sadmind; hence, the unpatched systems become victim
    to the Sadmind. Sadmind made it possible to execute arbitrary code with root privileges
    on vulnerable Solaris systems and arbitrary commands with the privileges of the
    `IUSR_MachineName` account on vulnerable Windows systems.


    ### 4.4.4 Code Red and Code Red II

    Code Red and Code Red II, released in 2001 on July 15 and August 4 respectively,
    exploited the vulnerability of buffer overflow bugs in Microsoft IIS Indexing
    Service dynamic link library (DLL). They affected Microsoft Windows NT 4.0, with
    IIS 4.0 or IIS 5.0 enabled and Index Server 2.0 installed, Windows 2000, with
    IIS 4.0 or IIS 5.0 enabled and indexing services installed, and other systems
    running IIS. It is estimated that more than 250,000 hosts suffered from their
    attacks.


    ### 4.4.5 Nimda

    Nimda or W32/Nimda or Concept Virus (CV) v.5 was released on the Internet on September
    18, 2001 to attack systems running Microsoft Windows 95, 98, ME, NT, and 2000
    with unpatched versions of IIS. When a system is compromised with the help of
    Nimda, intruders can execute arbitrary commands within the local system security
    context. The worm executes with the same privileges as the user who triggered
    it. The infected computers suffered from denial of service due to network scanning
    and email propagation performed by Nimda.


    ### 4.4.6 SQL Slammer

    *SQL Slammer* or *W32.Slammer* or *Sapphire* caused varied levels of network performance
    degradation across the Internet on January 25, 2003. This worm affected Microsoft
    SQL Server 2000 and Microsoft Desktop Engine (MSDE) 2000. The worm exploited the
    vulnerability of stack buffer overflow in the resolution service of Microsoft
    SQL Server 2000 and MSDE 2000, which enables an intruder to execute arbitrary
    code with the same privileges as the SQL server. The victim host starts generating
    high volume of user datagram protocol (UDP) traffic that results in performance
    degradation of the other hosts on the same network or the hosts on the Internet
    receiving these UDP packets.


    ### 4.4.7 Blaster

    *Blaster* was launched on August 11, 2003. It affected computers running Microsoft
    Windows NT 4.0, Microsoft Windows 2000, Microsoft Windows XP, and Microsoft Windows
    Server 2003. Blaster exploited vulnerability in the Microsoft remote procedure
    call interface related to a distributed component object model listening on TCP/IP
    port 135. The purpose of this interface was to handle the distributed component
    object model’s object activation requests that were sent by client machines to
    the server. Malformed messages and their incorrect handling helped an attacker
    to use buffer overflow to execute arbitrary code with system privileges or cause
    denial of service.


    ### 4.4.8 Sasser

