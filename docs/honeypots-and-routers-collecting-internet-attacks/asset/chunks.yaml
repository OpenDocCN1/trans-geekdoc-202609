    ### 5.3.3 Roles of Honeypots in Network Security


    We have discussed the advantages and disadvantages of the honeypots. So, to see
    what the greatest value of the honeypots could be, we must apply them to security.
    We may analyze how they add value to security and reduce an organization’s overall
    risk.


    Security is broken into three categories by Bruce Schneier in *Secrets and Lies*:


    #### Prevention


    In network security, prevention means keeping the bad guy out (i.e., preventing
    the bad guy from entering your network). Honeypots add a little value to prevention.
    Moreover, we know that honeypots can be used by the attackers to attack other
    systems in your organizations. The good news is that there are many methods that
    can be used by the honeypots to prevent the attackers from entering your organization.
    When attackers know that an organization has applied honeypots, they will worry
    about being detected and also they will waste time and resources attacking the
    honeypots. This method that we discussed earlier is known as prevention by deception
    or deterrence. The deception concept is to make attackers waste time and resources
    attacking honeypots, as opposed to attacking production systems. The deterrence
    concept is that if attackers know there are honeypots in an organization, they
    may be scared off. Perhaps they will not want to be detected or they will not
    want to waste their time or resources.


    We should mention that deception and deterrence fail to prevent the most common
    of the attacks, especially *targets-of-opportunity*. This is because *targets-of-opportunity*
    attackers use automated tools to compromise as many systems as possible. These
    attackers do not spend time analyzing the systems they target. Deception or deterrence
    will not prevent these attacks because there is no conscious individual to deter
    or deceive. Finally, we can say that there is no real prevention by honeypots
    or a limited prevention can be provided by them.


    #### Detection


    Detection means the act of monitoring, detecting, and alerting unauthorized activity.
    In Chapter 3, we have explained what the main difference between the detection
    and prevention is, and we also gave real-life examples. In addition to those concepts,
    prevention means to prevent unauthorized activities from entering your organization;
    but in case of detection, unauthorized activities can enter your organization
    and the system sends alert in real-time to the administrators. Consequently, the
    administrators will check whether these activities are authorized or not. If they
    are unauthorized, then the administrators will deny them or purge them out.


    The security community has designed several technologies for doing detection tasks;
    one of them is an IDS, for example. IDS is a great security solution that is designed
    to detect unauthorized activities in the network or on individual machines.


    After these descriptions about detection, one question comes forward: Do honeypots
    add value in detecting unauthorized or suspicious activity? The answer is Yes!
    Honeypots add a great value in detection, which we will explore now.


    There are mainly three common challenges of detection environment, which are as
    follows:


    *   False positives

    *   False negatives

    *   Data aggregation


    False positives happen when the IDS falsely alerts suspicious or malicious activity,
    typically because of flawed traffic modeling or weak rules/signatures/anomalies
    specified. False negatives are when system fails to detect an attack. The third
    challenge is data aggregation, centrally collecting all the data used for detection,
    and then corroborating that data into valuable information.

    '
