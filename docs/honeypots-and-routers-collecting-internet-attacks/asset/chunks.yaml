    ## 4.3.2 扫描策略


    ### 使用列表进行随机扫描

    为了提高攻击和传播过程的效率，蠕虫可能会使用从互联网上可获取的关于不同组织的公开数据中生成的网络地址列表/范围。以这种方式进行扫描会更加精确和有针对性。


    ### 跳岛扫描

    在跳岛扫描中，蠕虫不会扫描所选范围内的所有地址；相反，它将范围划分为较小的块，并从每个块中随机扫描少量地址以最小化时间。当然，这种方法的准确性也会较低，因为被遗漏的主机可能存在漏洞。


    ### 定向攻击

    这种方法包括由于特定网络或组织的重要性，或攻击者对其有特殊兴趣而将其作为目标。信息战或针对某些知名政府或非政府网络的攻击都是定向攻击的例子。


    ### 命中列表扫描

    命中列表扫描更像是*带有列表的随机扫描*，因为在这种技术中，蠕虫预先拥有一个可能存在漏洞的节点列表，并在该范围内执行扫描。然而，一旦发现第一个受害者并成功入侵，主蠕虫节点会将剩余列表的一半分配给这个新的蠕虫节点，自己继续处理另一半。这样，每发现一个新受害者，剩余工作量就会减少。


    ## 4.3.3 蠕虫架构


    蠕虫软件通常具有五个主要组件来执行其操作，我们在上面已经提到过。


    ### 侦察

    计算机蠕虫的生命周期始于对受害者的搜寻。负责此任务的软件组件通常称为*侦察*。该组件的目标在性质上类似于第 2.5.2 节中提到的黑客攻击的第一阶段，也称为*侦察*。


    ### 攻击组件

    一旦识别出易受攻击的主机，就会使用前面提到的一种或多种合适的技术对其进行攻击。此任务通常是蠕虫软件的一个单独函数或组件。


    ### 通信组件

    蠕虫软件还具有可用的函数、操作或接口，以促进蠕虫网络不同成员之间的通信。


    ### 命令组件

    蠕虫节点之间执行的一组重要通信是相互发出命令，以便在接收端执行。蠕虫包含一个合适的命令列表和接口，用于执行这些命令以进行集体攻击。


    ### 智能组件

    该组件包括用于蠕虫高效操作的算法和智能技术，例如更快的内部通信、高效扫描等。


    ## 4.4 蠕虫示例


    在本节中，我们将讨论一些流行且知名的蠕虫。


    ### 4.4.1 Morris

    Morris 于 1988 年 11 月 2 日发布用于攻击互联网；作为同类中的第一个，它是一个自我复制程序。*Morris 蠕虫*入侵了基于 Berkeley
    UNIX 的 VAX 和 Sun-3 计算机，并利用其资源复制攻击。在几小时内，该蠕虫蔓延至整个美国，影响了数千台计算机，并因其巨大的计算负载导致许多计算机无法使用。该蠕虫被设计为作为一个微小的进程执行以保持自身不被察觉；然而，其自我复制行为被低估了，这导致蠕虫传播到尽可能多的计算机，造成了严重破坏。受影响机器的计算性能因蠕虫进程在后台运行而开始下降，并且存在多个蠕虫实例在执行，因为同一台计算机被多次攻击。最终，由于内存和其他处理资源耗尽，系统完全失效。


    ### 4.4.2 Melissa

    Melissa 是第一个通过邮件大规模传播的蠕虫，于 1999 年 3 月 26 日首次被发现。此后，电子邮件成为传播蠕虫的流行媒介。


    Melissa 包含一个 Microsoft Word 宏病毒，这是一种利用应用程序自身的宏编程语言（如 Microsoft Word 或 Excel）来传播自身的计算机病毒。它通过攻击
    Microsoft Word 和 Outlook 以一种半主动的方式传播。每当受影响机器上的用户将 Microsoft Word 文档附加到电子邮件并使用
    Microsoft Outlook 作为电子邮件客户端时，Melissa 就会自动将该邮件的副本发送给用户通讯簿中的前 50 个地址。


    ### 4.4.3 Sadmind

    Sadmind 蠕虫于 2001 年 5 月 8 日创建，利用漏洞入侵系统并篡改网页。它影响了 Microsoft Internet Information
    Services (IIS) 和 Sun Solaris 系统，针对 Sadmind 所利用漏洞的补丁早已发布；因此，未打补丁的系统成为了 Sadmind
    的受害者。Sadmind 使得在易受攻击的 Solaris 系统上能以 root 权限执行任意代码，在易受攻击的 Windows 系统上能以 `IUSR_MachineName`
    账户的权限执行任意命令。


    ### 4.4.4 Code Red 和 Code Red II

    Code Red 和 Code Red II 分别于 2001 年 7 月 15 日和 8 月 4 日发布，利用了 Microsoft IIS 索引服务动态链接库
    (DLL) 中缓冲区溢出漏洞。它们影响了启用了 IIS 4.0 或 IIS 5.0 并安装了 Index Server 2.0 的 Microsoft Windows
    NT 4.0，启用了 IIS 4.0 或 IIS 5.0 并安装了索引服务的 Windows 2000，以及其他运行 IIS 的系统。据估计，超过 250,000
    台主机遭受了它们的攻击。


    ### 4.4.5 Nimda

    Nimda 或 W32/Nimda 或 Concept Virus (CV) v.5 于 2001 年 9 月 18 日在互联网上发布，用于攻击运行未打补丁版本
    IIS 的 Microsoft Windows 95、98、ME、NT 和 2000 系统。当系统在 Nimda 的帮助下被入侵时，入侵者可以在本地系统安全上下文中执行任意命令。该蠕虫以触发它的用户的相同权限执行。受感染的计算机因
    Nimda 执行的网络扫描和电子邮件传播而遭受拒绝服务。


    ### 4.4.6 SQL Slammer

    *SQL Slammer* 或 *W32.Slammer* 或 *Sapphire* 于 2003 年 1 月 25 日导致整个互联网上出现不同程度的网络性能下降。该蠕虫影响了
    Microsoft SQL Server 2000 和 Microsoft Desktop Engine (MSDE) 2000。该蠕虫利用了 Microsoft
    SQL Server 2000 和 MSDE 2000 解析服务中的栈缓冲区溢出漏洞，这使得入侵者能够以与 SQL 服务器相同的权限执行任意代码。受害主机开始产生大量用户数据报协议
    (UDP) 流量，导致同一网络上的其他主机或接收这些 UDP 数据包的互联网主机性能下降。


    ### 4.4.7 Blaster

    *Blaster* 于 2003 年 8 月 11 日发起。它影响了运行 Microsoft Windows NT 4.0、Microsoft Windows
    2000、Microsoft Windows XP 和 Microsoft Windows Server 2003 的计算机。Blaster 利用了与分布式组件对象模型相关的
    Microsoft 远程过程调用接口中的漏洞，该模型在 TCP/IP 端口 135 上监听。该接口的目的是处理客户端发送到服务器的分布式组件对象模型的对象激活请求。格式错误的消息及其不正确的处理帮助攻击者利用缓冲区溢出以系统权限执行任意代码或导致拒绝服务。


    ### 4.4.8 Sasser


