    # 1 Computer Networks


    **HABIB-UR REHMAN**


    A computer network typically comprises three components: devices, medium, and
    topology. Computers, smartphones, laptops, routers, switches, and repeaters are
    the different kinds of devices that may exist in a computer network. In order
    to communicate with each other, these devices are connected by a medium, either
    wireless or wired. The resulting schematic of the devices linked through the medium
    is the topology of the network.


    In a computer network, communication actually happens among devices. In the context
    of human conversations, the term *communication* encompasses a complete dialog
    between two persons. The same rule applies to computer networks: communication
    among two or more devices may consist of more than one message exchanged among
    the participating devices. *Session* is a more widely used technical term to describe
    a series of correlated messages exchanged among devices.


    Before we move further into our discussion of computer networks, let us recall
    the example of postal service commonly described in the textbooks to explain how
    a computer network functions. A house may have more than one resident, who can
    be a sender or receiver of messages. All these residents share the same address;
    however, the actual sender/recipient is identified by the name mentioned on the
    envelope. The postal service is usually neither the sender nor the recipient but
    the messages pass through it, and it facilitates the transmission of messages.
    The recipient address is used to deliver the message to its destination and the
    source address is used to identify its originator. The message itself is usually
    some data or information arranged in a comprehensible way for the recipient. The
    overall assembly of the message should also be comprehensible for the postal service,
    so that the sender and recipient addresses are distinguishable, identifiable,
    and locatable.


    When computers communicate, constraints such as being comprehensible, distinguishable,
    or identifiable require precise and comprehensive establishment of the procedures
    and regulations for the delivery of message(s). This brings the fourth component
    of computer networks into the picture: the protocol. Protocols and standards are
    the set of rules and procedures followed by the devices during communication.


    This chapter is divided into four sections, each reviewing one of the four components
    of the computer network.


    ## 1.1 Devices


    A device typically plays one of the three roles in a message exchange: it originates
    a message, or it is the recipient of the message, or the message passes through
    it. The device initiating a message is usually called *source* or *origin*, while
    the recipient(s) of a message is (are) called *destination(s)* or *sink(s)*. Together
    the two are called *end nodes* or *end devices*. When the two end devices are
    not connected directly, the message passes through one or more intermediate devices.
    The end devices are generally the computing devices used by the end users such
    as PCs, phones, and tablets (tabs); on the other hand, the intermediate devices
    are usually special-purpose devices with the objective of facilitating the transmission
    between the end devices.


    Based on its role in the communication, a device has to perform several steps
    in a particular order to make the communication successful. For example, the job
    of the source device is to specify the address of only the destination device
    and not that of the destination or intermediate devices. The open systems interconnection
    (OSI) reference model, as it is usually called, is a conceptual description of
    the tasks and duties performed by devices while communicating in a computer network.
    This abstract model divides the activities, based on their relevance and dependency,
    into seven groups referred to as *layers:* physical, data link, network, transport,
    session, presentation, and application (Figure 1.1).


    The primary purpose of a computer communication is to facilitate the users and
    deliver the data or information. The user interacts with the computer system,
    the device of our communication scenario, through some application; the data or
    information provided to the system or received from the system is usually in a
    user comprehensible format. Due to this fact, the end devices generally perform
    all the actions described in the OSI model, or in other words, implement all the
    seven layers. The intermediate nodes, on the other hand, might be implementing
    a limited number of layers (or performing tasks related to fewer layers) according
    to their role in the communication. One way to categorize the devices in a computer
    network is to group them according to the layer they belong to.¹ ![Figure 1.1
    ISO/OSI reference model for network communication.](images/pg3_1.jpg)


    **Figure 1.1** ISO/OSI reference model for network communication.


    As mentioned earlier, the user mostly interacts with the end devices, which are
    typical computing devices. However, the communication always involves multiple
    intermediate devices sitting in the core of the network joining the two ends.
    Next, we mention the four important categories of intermediate devices commonly
    participating in a computer communication.


    ### 1.1.1 Modem

