- raw: "        *NBA system limitations*. NBA technologies overall have great prevention\
    \ capabilities against authorized activities, but also have significant limitations.\
    \ One of the most important limitations is the delay in detecting attacks. Some\
    \ delay is inherent in anomaly detection methods that are based on deviations\
    \ from a baseline, such as increased bandwidth usage or additional connection\
    \ attempts. Generally, NBA technologies often have additional delay caused by\
    \ their data sources, especially when they rely on flow data from routers and\
    \ other network devices. These data are often transferred to the NBA system in\
    \ batches, as frequently as every minute or two, often much less frequently. Therefore,\
    \ this delay is considered as a significant limitation of the NBA technologies,\
    \ because attacks that occur quickly, such as malware infestations and DoS attacks,\
    \ may not be detected until they have already disrupted or damaged systems. To\
    \ solve the delay problem, the NBA system can use sensors (software or hardware\
    \ component) that do their own packet captures and analysis instead of relying\
    \ on flow data from other devices. However, performing packet captures and analysis\
    \ is much more resource-intensive than analyzing flow data. A single sensor can\
    \ analyze flow data from many networks or perform direct monitoring (packet captures)\
    \ itself generally for a few networks at the most. More sensors may be needed\
    \ to do direct monitoring instead of using flow data \\[\n\n        *Host-based\
    \ IDPS*. Host-based systems monitor the characteristics of a single host and the\
    \ events occurring within that host for suspicious activity. Examples of the types\
    \ of host characteristics that a host-based IDPS might monitor are network traffic\
    \ for that host, system logs, running processes, application activity, file access\
    \ and modification, and system and application configuration changes. Host-based\
    \ IDPSs are most commonly deployed on critical hosts such as publicly accessible\
    \ servers and servers containing sensitive information. Additionally, most host-based\
    \ IDPSs have detection software known as *agents* installed on the hosts of interest.\
    \ Each agent monitors activity on a single host and may perform prevention actions.\
    \ Some agents monitor a single specific application service—for example, a Web\
    \ server program; these agents are also known as *application-based IDPSs*.\n\n\
    \        Host-based IDPS agents are deployed to critical hosts, such as publicly\
    \ accessible servers and servers containing sensitive information, although they\
    \ can be deployed to other types of hosts as well. Some organizations use agents\
    \ mainly to analyze activity that cannot be monitored by other security controls.\
    \ For example, network-based IDPS sensors cannot analyze the activity within encrypted\
    \ network communications, but host-based IDPS agents installed on endpoints can\
    \ see the unencrypted activity. The network architecture for host-based IDPS deployments\
    \ is typically simple. Since the agents are deployed on existing hosts on the\
    \ organization’s networks, the components usually communicate over those networks\
    \ instead of using a separate management network.\n\n        To provide more accurate\
    \ intrusion prevention capabilities, most IDPS agents alter the internal architecture\
    \ of hosts. This is typically done through a shim, which is a layer of code placed\
    \ between existing layers of code. A shim intercepts data at a point where that\
    \ would normally be passed from one piece of code to another. The shim can then\
    \ analyze the data and determine whether or not that should be allowed or denied.\
    \ Host-based IDPS agents may use shims for several types of resources, including\
    \ network traffic, file-system activity, system calls, Windows registry activity,\
    \ and common applications (e.g., email and Web). Some agents monitor activity\
    \ without using shims or they analyze artifacts of activity, such as log entries\
    \ and file modifications. Although these methods are less intrusive to the host,\
    \ these methods are also generally less effective at detecting attacks and often\
    \ cannot perform prevention actions.\n\n        *Host-based IDPS security capabilities*.\
    \ Host-based IDPSs offer good prevention against several types of malicious activities.\
    \ A combination (signature-based and anomaly-based) is often used by the host-based\
    \ IDPSs. The signature-based mechanism is used to identify known attacks, whereas\
    \ the anomaly-based mechanism is used to identify previously unknown attacks.\n\
    \n        There are many types of events detected by host-based IDPSs, but this\
    \ detection is based on the detection techniques that the IDPSs use. Some host-based\
    \ IDPS products offer several of these detection techniques, while others focus\
    \ on a few or one. Some specific techniques that are commonly used in host-based\
    \ IDPSs are as follows \\[\n\n        *   *Code analysis:* Agents might analyze\
    \ attempts to execute malicious code. One technique is executing code in a virtual\
    \ environment or sandbox to analyze its behavior and compare it to profiles of\
    \ known good and bad behavior. Another technique is looking for the typical characteristics\
    \ of stack and heap buffer overflow exploits, such as certain sequences of instructions\
    \ and attempts to access portions of memory not allocated to the process. System\
    \ call monitoring is another common technique; it involves knowing which applications\
    \ and processes should be performing certain actions.\n\n        *   *Network\
    \ traffic analysis:* This is often similar to what a network-based IDPS does.\
    \ Some products can also analyze wireless traffic. Another capability of traffic\
    \ analysis is that the agent can extract files sent by applications such as email,\
    \ Web, and peer-to-peer file sharing, which can then be checked for malware.\n\
    \n        *   *Network traffic filtering:* Agents often include a host-based firewall\
    \ that can restrict incoming and outgoing traffic for each application on the\
    \ system, preventing unauthorized access and acceptable use policy violations\
    \ (e.g., use of inappropriate external services).\n\n        *   – *File-system\
    \ monitoring:* They can be performed using several different techniques. File\
    \ integrity checking involves generating cryptographic checksums for critical\
    \ files and comparing them to reference values to identify which files have been\
    \ changed. File attribute checking is the process of checking critical files’\
    \ security attributes, such as ownership and permissions, for changes. Both file\
    \ integrity and file attribute checking are reactive, detecting attacks only after\
    \ they have occurred. Some agents have more proactive capabilities, such as monitoring\
    \ file access attempts, comparing each attempt to an access control policy, and\
    \ preventing attempts that violate policy.\n\n        *   *Log analysis:* Some\
    \ agents can monitor and analyze operating system and application logs to identify\
    \ malicious activity. These logs may contain information on system operational\
    \ events, audit records, and application operational events.\n\n        As the\
    \ host-based IDPSs provide extensive knowledge of hosts’ characteristics and configurations,\
    \ an agent can often determine whether an attack would succeed if not stopped.\
    \ Agents can use this knowledge to select preventive actions and to prioritize\
    \ alerts."
