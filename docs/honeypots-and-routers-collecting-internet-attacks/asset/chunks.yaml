    ## 2. Indirect IDPS Integration


    Indirect IDPS integration is the process when many IDP products send their data
    to security information and event management (SIEM) software. The main function
    of the SIEM software is to import information from various security-related logs
    and correlate events among them. The SIEM software commonly receives copies of
    the logs from the logging hosts over security network channels, then it normalizes
    the log data into standard fields and value (known as *normalization*), and then
    determines related events by matching Internet protocol (IP) addresses, timestamps,
    usernames, and other characteristics. SIEM products can do the following tasks:
    identify malicious activity such as attacks and malware infections, as well as
    misuse and inappropriate usage of systems and networks.


    SIEM software can complement IDPSs. For example, if an organization uses different
    IDPS technologies, the SIEM software can correlate events logged for these different
    IDPS technologies. The SIEM software can identify incidents that a single device
    cannot; also, it can collect information related to an event in a single place
    to make more efficient analysis. However, there is a significant limitation in
    the SIEM software: a delay between the time when an event begins and the time
    SIEM software sees the corresponding log data, since log data are often transferred
    in batch mode to conserve resources. Resource consumption is also limited by SIEM
    products transferring only some event data from the original resources.


    Organizations should define the requirements that the products should meet before
    evaluating IDPS products. To do this task, evaluators need to understand the characteristics
    of the organization’s system and network environments. Then, evaluators can select
    a compatible IDPS that can monitor the events of interest on the systems and/or
    networks. Evaluators should explain well the goals and objectives they wish to
    achieve by using an IDPS, such as stopping common attacks, identifying misconfigured
    wireless network devices, and detecting misuse of the organization’s system and
    network resources. In addition, evaluators should reconsider their existing security
    policies, which serve as a specification for many of the features that the IDPS
    products need to provide. Evaluators should also understand whether or not the
    organization is subject to oversight or review by another organization. If so,
    the evaluators should determine if that oversight authority requires IDPSs or
    other specific system security resources. Resource constraints should also be
    taken into account by evaluators.


    Moreover, the evaluators need to define specialized sets of requirements for the
    following [20]:


    *   Security capabilities in depth, including the methodologies that they use
    to identify suspicious activity

    *   Performance, including maximum capacity and performance features

    *   Management, including design and implementation (e.g., reliability, interoperability,
    scalability, and product security); operation and maintenance (including software
    updates); and training, documentation, and technical support

    *   Life cycle costs, both initial and maintenance costs


    When an organization evaluates IDPS products, it should consider using a combination
    of several sources of data on the products’ characteristics and capabilities.
    Common product data sources include test lab or real-world product testing, vendor-provided
    information, third-party product reviews, and previous IDPS experience from individuals
    within the organization and trusted individuals at other organizations. When data
    are received from other parties, the organization should consider the fidelity,
    because those are often presented without an explanation of how those were generated.
    There are several significant challenges in performing in-depth hands-on IDPS
    testing, such as the need of considerable amount of resources and lack of a standard
    test methodology and test suites, which often make it infeasible. However, limited
    IDPS testing is helpful for evaluating security requirements, performance, operation,
    and maintenance capabilities.


    ### 6.3.2 IDPS Detection Methods


    IDPS technologies use many methods to detect attacks. The primary methods are
    signature-based, anomaly-based, and stateful protocol analysis. Most IDPS technologies
    use more than one method to provide more accurate detection. We present more details
    about the mentioned methods in the following sections [


    #### Signature-based Detection


    A signature is a pattern that corresponds to a known threat. A signature-based
    detection scheme monitors packets in the network and compares them against a database
    of signatures from known malicious threats. This method works similar to the way
    most antivirus software detect malware. The main disadvantage of this kind of
    method is that there would always be a lag between a new threat being discovered
    in the wild and the signature for detecting that threat being applied to an IPS.
    During that lag time, the IPS would be unable to detect the new threat.


    The signature-based detection method is considered as the simplest detection method
    because it just compares the current unit of activity, such as a packet or a log
    entry, to a list of signatures using string comparison operations. Another limitation
    that these kinds of detection technologies have is their little understanding
    of many network or application protocols and they cannot track and understand
    the state of complex communications. For example, signature-based detection methods
    cannot pair a request with the corresponding response, such as knowing that a
    request to a Web server for a particular page generated a response status code
    of 403 means that the server refused to accept the request (in fact, 403 error
    is equivalent to a blanket *NO* by the Web server—with no further discussion allowed).
    These methods also lack the ability to remember previous requests when processing
    the current request. This limitation prevents signature-based detection methods
    from detecting attacks that comprise multiple events if none of the events contains
    a clear indication of an attack [


    #### Anomaly-based Detection


    An anomaly-based detection method monitors network traffic and compares it against
    an established baseline. The baseline identifies what is *normal* for that network,
    what sort of bandwidth is generally used, what protocols are used, what ports
    and devices generally connect to each other, and alert the administrator or user
    when traffic is detected, which is anomalous, or significantly different than
    the baseline.


    The major advantage of anomaly-based detection methods is that they can be very
    effective at detecting previously unknown threats. For example, suppose that a
    computer becomes infected with a new type of malware. The malware could consume
    the computer’s processing resources, send large number of emails, initiate large
