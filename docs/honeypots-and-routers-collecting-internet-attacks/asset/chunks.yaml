    September 1981, [`www.rfc-editor.org/info/`](http://www.rfc-editor.org/info/)
    rfc793.

    *   3. Postel, J., User Datagram Protocol, STD 6, RFC 768, DOI 10.17487/RFC0768,
    August 1980, [`www.rfc-editor.org/info/rfc768`](http://www.rfc-editor.org/info/rfc768).

    *   4. Postel, J., Internet Control Message Protocol, STD 5, RFC 792, DOI 10.17487/RFC0792,
    September 1981, [`www.rfc-editor.org/info/`](http://www.rfc-editor.org/info/)
    rfc792.

    *   5. Klensin, J., Ed., Simple Mail Transfer Protocol, RFC 2821, DOI 10.17487/RFC2821,
    April 2001, [`www.rfc-editor.org/info/`](http://www.rfc-editor.org/info/) rfc2821.

    *   6. Bhushan, A., File Transfer Protocol, RFC 114, DOI 10.17487/RFC0114, April
    1971, [`www.rfc-editor.org/info/rfc114`](http://www.rfc-editor.org/info/rfc114).

    *   7. Droms, R., Dynamic Host Configuration Protocol, RFC 2131, DOI 10.17487/RFC2131,
    March 1997, [`www.rfc-editor.org/info/`](http://www.rfc-editor.org/info/) rfc2131.

    *   8. Plummer, D., Ethernet Address Resolution Protocol: Or Converting Network
    Protocol Addresses to 48.bit Ethernet Address for Transmission on Ethernet Hardware,
    STD 37, RFC 826, DOI 10.17487/RFC0826, November 1982, [`www.rfc-editor.org/info/rfc826`](http://www.rfc-editor.org/info/rfc826).


    # 4 恶意软件


    **MOHSEN MOHAMED**

