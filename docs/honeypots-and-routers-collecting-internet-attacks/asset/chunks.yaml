    ## 2.1.4 CIA Triad versus McCumber’s Cube


    McCumber’s information security model or Cube has indeed the same three characteristics:
    confidentiality, integrity, and availability. However, his complete model has
    three dimensions where the above three characteristics represent only one dimension
    named as security characteristics or goals. The other two dimensions are information
    states and security safeguards or measures. The information is in three states
    as per the model: storage, processing, and transmission. The security measures
    are also of three main types: policy, education, and technology (Figure 2.1).


    ![Figure 2.1 McCumber’s Cube of information security. (Data from McCumber, J.,
    Information systems security: A comprehensive model, in: Proceedings of the 14th
    National Computer Security Conference, NIST, Baltimore, MD, 1991.)](images/pg35_1.jpg)


    **Figure 2.1** McCumber’s Cube of information security. (Data from McCumber, J.,
    Information systems security: A comprehensive model, in: *Proceedings of the 14th
    National Computer Security Conference*, NIST, Baltimore, MD, 1991.)


    ## 2.2 Parkerian Hexad


    Donn B. Parker suggested a model with six fundamental security elements, usually
    referred to as *Parkerian Hexad*. In addition to the three attributes from the
    classical list of CIA, utility, authenticity, and possession are the new recommendations
    from Parker. He primarily feels that the three CIA attributes are not comprehensive
    and precise in terms of their definition and in-practice interpretations and thus,
    are inadequate to accommodate all the possibilities. Each of the three new attributes,
    hence, incorporate the security concerns not considered under the traditional
    interpretations of one of the CIA attributes.


    ### 2.2.1 Possession


    Parker elaborates that the possession of the information or having control over
    it is different than the confidentiality of the information because the unauthorized
    possession of the information can still be a security concern even if the person
    having control over it does not look into it. The confidentiality of the information
    in such a case itself is not harmed, but the violation of possession may lead
    to a confidentiality problem later. Hence, Parker believes that the inclusion
    of possession as a security attribute is necessary to avoid situations where the
    control over information can come into the hands of unauthorized entities intentionally,
    accidentally, or maliciously. The communication over computer networks is in fact
    a perfect example here because in most of the cases the physical network is publically
    accessible, implying that anyone can have the control over the on-going communication
    if proper measures are not adopted.


    ![Figure 2.2 Parker’s new fundamental conceptual information security model. (Data
    from D. Parker, Our excessively simplistic information security model and how
    to fix it, ISSA J., 8 (7): 12-21, July, 2010.)](images/pg37_1.jpg)


    **Figure 2.2** Parker’s new fundamental conceptual information security model.
    (Data from D. Parker, Our excessively simplistic information security model and
    how to fix it, *ISSA J*., 8 (7): 12-21, July, 2010.)


    ### 2.2.2 Authenticity


    Authenticity of the information is defined as the validity of the source of the
    information or confirmation about the origin of the information. Thus, this characteristic
    describes whether the source of the information is the same as the recipient is
    expecting or assuming. Parker explains that authenticity is different from integrity,
    as the latter is about the soundness and condition of the information content.
    At times, an authorized source can generate incorrect information or the information
    that violates integrity for testing purposes, thus not violating the authenticity.
    On the other hand, a malicious source can pretend to be someone else, and thus
    reproduce a correct piece of information such as software with its own name but
    actually developed by a different entity. Parker further advocates that the measures
    required to mitigate the two issues are also different.


    ### 2.2.3 Utility


    The final enhancement suggested by Parker is the utility, which he defines as
    the usefulness of data or information. Parker believes that the term *availability*
    is limited to the usability of the information, which not always guarantees that
    the information will be useful as well. For example, if the information is delivered
    in the encrypted form but the recipient has lost the decryption key, the information
    is still available but its utility is zero.


    ### 2.2.4 CIA Triad versus Parkerian Hexad


    The difference between the CIA triad and the Parkerian Hexad is primarily a difference
    of interpretations of the terms used. There is no doubt that the concerns mentioned
    by Parker are of less importance or do not exist; however, professionals over
    time have merged these extended interpretations into the three CIA attributes.


