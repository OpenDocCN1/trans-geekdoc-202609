- raw: "1.  Hosts are usually configured by the user to use a static IP address or\
    \ acquire an automatic assignment through the DHCP, the latter being the most\
    \ common option. The client initiates the process by sending a DHCP discover message.\
    \ Since the client is unaware of the IP address of the DHCP server(s), the IP\
    \ address in this discover message is broadcast, that is, 255.255.255.255, the\
    \ fact due to which this step is named as *discover*. DHCP servers are configured\
    \ to listen at UDP port 67, while the client is required to select UDP port 68\
    \ as the source port. It might be possible that the DHCP server is not in the\
    \ same subnet as the requesting host. In such a case, DHCP relay agents are placed\
    \ in each subnet. The request to allocate an IP address is technically referred\
    \ to as an *IP lease request*. Another important field in this request message\
    \ is the client's MAC address.\n\n    ![Figure 1.15 DHCP IP address allocation\
    \ process.](images/pg24_1.jpg)\n\n    **Figure 1.15** DHCP IP address allocation\
    \ process.\n\n2.  Once the server receives the lease request, it sends a DHCP\
    \ offer message to the client. The IP address offered in this request is selected\
    \ following one of the three methods as per the server configuration for the client's\
    \ MAC address. The important items in the DHCP offer message are the offered IP\
    \ address, subnet mask, lease duration, and the server's own IP address. The destination\
    \ IP address for this offer message is once again 255.255.255.255 the client so\
    \ far has no IP address; the destination port is UDP 68 as mentioned earlier.\
    \ In case there are more than one DHCP servers in the network, offers can be made\
    \ by more than one servers. Another important issue to consider here is: if there\
    \ are more than one clients waiting for the IP lease offer, how they identify\
    \ that the offer is for whom when all the offer messages are broadcast.^([⁶](#fn6))\n\
    \n3.  Client will accept one of the offers and will generate a DHCP request message\
    \ to acquire the IP address offered by the respective server. This message follows\
    \ the same delivery configuration as the DHCP discover, that is, broadcasted due\
    \ to the fact that all the DHCP servers should be duly informed that whose offer\
    \ is accepted by the client and the others can withdraw their offers.\n\n4.  Finally,\
    \ the DHCP server confirms the lease by sending a DHCP ACK message and other necessary\
    \ configurations.\n\n### *1.5.4 Internet Control Message Protocol*\n\nThe Internet\
    \ control message protocol (ICMP) \\[ ![Figure 1.16 ICMP packet format.](images/pg25_1.jpg)\n\
    \n**Figure 1.16** ICMP packet format.\n\nICMP messages are usually sent in the\
    \ following situations:\n\n*   A datagram cannot reach the destination.\n\n* \
    \  The gateway does not have enough space in the buffer to forward a datagram.\n\
    \nFor the purpose of feedback or error reporting, the type and the code fields\
    \ combined have an extensive list of associated status codes; some important combinations\
    \ are described in Table 1.1 \\[\n\n**Table 1.1** Important ICMP Type and Code\
    \ Combinations\n\n| TYPE || CODE || DESCRIPTION |\n\n| 0—Echo reply || 0 || Echo\
    \ reply (used to ping) |\n\n| 3—Destination unreachable || 0 || Destination network\
    \ unreachable |\n\n|  || 1 || Destination host unreachable |\n\n|  || 2 || Destination\
    \ protocol unreachable |\n\n|  || 3 || Destination port unreachable |\n\n|  ||\
    \ 4 || Fragmentation required, and DF flag set |\n\n|  || 5 || Source route failed\
    \ |\n\n|  || 6 || Destination network unknown |\n\n|  || 7 || Destination host\
    \ unknown |\n\n|  || 8 || Source host isolated |\n\n|  || 9 || Network administratively\
    \ prohibited |\n\n|  || 10 || Host administratively prohibited |\n\n|  || 11 ||\
    \ Network unreachable for TOS |\n\n|  || 12 || Host unreachable for TOS |\n\n\
    |  || 13 || Communication administratively prohibited |\n\n|  || 14 || Host precedence\
    \ violation |\n\n|  || 15 || Precedence cutoff in effect |\n\n| 5—Redirect message\
    \ || 0 || Redirect datagram for the network |\n\n|  || 1 || Redirect datagram\
    \ for the host |\n\n|  || 2 || Redirect datagram for the TOS and network |\n\n\
    |  || 3 || Redirect datagram for the TOS and host |\n\n| 8—Echo request || 0 ||\
    \ Echo request (used to ping) |\n\n| 11—Time exceeded || 0 || TTL expired in transit\
    \ |\n\n|  || 1 || Fragment reassembly time exceeded |\n\n| 12—Parameter problem:\
    \ bad IP header || 1 || Pointer indicates the error Missing a required option\
    \ |\n\n|  || 2 || Bad length |\n\n| 13—Timestamp || 0 || Timestamp |\n\n| 14—Timestamp\
    \ reply || 0 || Timestamp reply |\n\n| 17—Address mask request || 0 || Address\
    \ mask request |\n\n| 18—Address mask reply || 0 || Address mask reply |\n\n###\
    \ *1.5.5 Address Resolution Protocol*\n\nThe address resolution protocol (ARP)\
    \ \\[\n\nSince ARP provides the link between the network layer and the data link\
    \ layer, it itself works below the network layer and thus is not routable. This\
    \ implies that the ARP packets are encapsulated directly inside the data link\
    \ layer frames and can only travel within a LAN, but not beyond the router.\n\n\
    ARP has a single packet format in which different operations are specified by\
    \ describing the suitable value in the operation field; for example, 1 is for\
    \ the ARP request and 2 is for the ARP reply. The other two important fields are\
    \ hardware type and protocol type. Hardware type specifies the hardware standard\
    \ and ARP has a code list for different standards such as 0001 for Ethernet. Similarly,\
    \ protocol type specifies the code of the network layer protocol, 0×0800 in case\
    \ of IPv4 ([Figure 1.17](#06_Chapter01.xhtml#fig1_17)).\n\n*Address resolution\
    \ process*. The network layer datagram is handed over to the data link layer for\
    \ transmission and the equivalent hardware address is required to mention in the\
    \ frame header for delivery. ARP maintains a cache or ARP table, where it stores\
    \ the known network layer address to physical layer address mappings. In case\
    \ the physical layer address for the network layer address is not present in the\
    \ cache, an ARP request packet is broadcasted (MAC address with all ones) in the\
    \ LAN including the network layer address for which the physical layer address\
    \ is missing. Since it is a broadcast, every host on the LAN receives this frame\
    \ and if the requested host is present, it will individually reply to the requesting\
    \ host with its physical address through the reply message ([Figure 1.18](#06_Chapter01.xhtml#fig1_18)).\
    \ The requesting host stores this entry in the ARP cache for future use. Additionally,\
    \ the ARP request message helps the other hosts in the network to update the ARP\
    \ entry for the source of the request.\n\n![Figure 1.17 Generic ARP packet format.](images/pg28_1.jpg)\n\
    \n**Figure 1.17** Generic ARP packet format.\n\n![Figure 1.18 ARP address resolution\
    \ process.](images/pg28_2.jpg)\n\n**Figure 1.18** ARP address resolution process.\n\
