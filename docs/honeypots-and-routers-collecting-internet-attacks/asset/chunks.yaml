  fmt: "\n# 网络配置详解\n\n## 本地路由器配置\n\n在进行 IP-tables 设置之前，我们在本地路由器中启用了 IP 转发。\n\n编辑 `/etc/sysctl.conf`\
    \ 文件如下：\n\n```text\nnet.ipv4.ip_forward = 1\n```\n\n### IP-tables 配置\n\n使用 IP-tables\
    \ 进行内核网络地址转换器的设置如下：\n\n**不转换发往真实公共服务器的数据包：**\n\n```bash\n# iptables -t nat -A\
    \ PREROUTING -m physdev --physdev-in eth0 -d 212.0.50.19 -j RETURN\n```\n\n**将发往公共\
    \ LAN 的所有其他数据包转换至内部路由器：**\n\n```bash\n# iptables -t nat -A PREROUTING -m physdev\
    \ --physdev-in eth0 -d 212.0.50.0/24 -j DNAT --to 192.168.50.22\n```\n\n## 内部路由器配置\n\
    \n正如 [第 7.2 节](#12_Chapter07.xhtml#sch7_2) 所述，内部路由器的功能是保护 LAN 免受蠕虫出站连接的侵害，并将 Honeynet\
    \ 1 的出站连接重定向到 Honeynet 2，反之亦然。以下将详细探讨内部路由器的机器属性和 IP-tables 配置。\n\n### 机器属性\n\n\
    *   **操作系统：** Ubuntu Linux 9.10\n*   **网卡数量：** 四张网卡（`Eth0`、`Eth1`、`Eth2` 和 `Eth3`）\n\
    \    *   `Eth0`：连接内部路由器至 Honeynet 1 客户端\n    *   `Eth1`：连接内部路由器与本地路由器\n    * \
    \  `Eth2`：连接内部路由器至 Honeynet 2 客户端\n    *   `Eth3`：连接内部路由器与签名生成器\n*   **IP 地址：**\n\
    \    *   `Eth0`：192.168.51.20\n    *   `Eth1`：192.168.50.22\n    *   `Eth2`：192.168.58.20\n\
    \    *   `Eth3`：192.168.55.20\n\n在设置 IP-tables 规则之前，我们在内部路由器中启用 IP 转发：\n\n编辑 `/etc/sysctl.conf`\
    \ 文件如下：\n\n```text\nnet.ipv4.ip_forward = 1\n```\n\n### IP-tables 配置\n\n使用 IP-tables\
    \ 进行内核网络地址转换器的设置如下：\n\n*   **转换来自 `Eth1` 进入 Honeynet 1 的数据包：**\n    ```bash\n\
    \    # iptables -t nat -A PREROUTING -i eth1 -j DNAT --to 192.168.51.22\n    ```\n\
    *   **来自 Honeynet 1，不转换发往签名生成器的数据包：**\n    ```bash\n    # iptables -t nat -A PREROUTING\
    \ -i eth0 -s 192.168.51.22 -d 192.168.55.22 -j RETURN\n    ```\n*   **来自 Honeynet\
    \ 1，转换所有其他数据包至 Honeynet 2：**\n    ```bash\n    # iptables -t nat -A PREROUTING\
    \ -i eth0 -j DNAT --to 192.168.58.22\n    ```\n*   **来自 Honeynet 2，不转换发往签名生成器的数据包：**\n\
    \    ```bash\n    # iptables -t nat -A PREROUTING -i eth0 -s 192.168.58.22 -d\
    \ 192.168.55.22 -j RETURN\n    ```\n*   **来自 Honeynet 2，转换所有其他数据包至 Honeynet 1：**\n\
    \    ```bash\n    # iptables -t nat -A PREROUTING -i eth0 -j DNAT --to 192.168.51.22\n\
    \    ```\n\n## LAN 配置\n\n正如第 7.4.2.1 小节所述，我们的 LAN 中有一台公共 Web 服务器，其 IP 地址为：212.0.50.19。\n\
    \n以下是公共 Web 服务器的机器属性详情。\n\n### 机器属性\n\n*   **操作系统：** Ubuntu Linux 9.10\n*   **网卡数量：**\
    \ 一张网卡：`Eth0`\n*   **IP 地址：** `Eth0`：212.0.50.19\n\n## Honeynet 1 配置\n\n如 [图 7.3](#12_Chapter07.xhtml#fig7_3)\
    \ 所示，Honeynet 1 包含蜜墙和两个蜜罐。Honeynet 1 的主要功能是捕获多态蠕虫实例。以下是蜜墙机器属性和配置的详细信息。\n\n###\
    \ 机器属性\n\n*   **网卡数量：** 三张网卡（`Eth0`、`Eth1` 和 `Eth2`）\n    *   `Eth0`：连接 Honeynet\
    \ 1 与 Honeynet 2（通过内部路由器）\n    *   `Eth1`：连接 Honeynet 1 与其客户端（蜜罐）\n    *   `Eth2`：用于管理接口\n\
    *   **IP 地址：**\n    *   `Eth0`：192.168.51.22\n    *   `Eth1`：192.168.52.20\n \
    \   *   `Eth2`：192.168.40.7\n\n### 蜜墙配置\n\n#### Honeynet 公共 IP 地址\n\n此处输入蜜罐的外部\
    \ IP 地址。这些 IP 地址即为攻击者地址：\n\n*   **IP 地址：** 192.168.52.22；192.168.52.23\n\n####\
    \ Honeynet 网络\n\n此处输入采用无类别域间路由（CIDR）表示法的 Honeynet 网络：\n\n*   **Honeynet 网络 CIDR：**\
    \ 192.168.52.0/24\n\n#### Honeynet 广播地址\n\n*   **广播地址：** 192.168.52.255\n\n####\
    \ 管理接口\n\n第三个接口将用于远程管理。该接口帮助我们通过安全外壳（SSH）和 Walleye Web 接口远程管理蜜墙。我们使用 `Eth2` 作为管理接口。\n\
    \n*   **管理接口 IP 地址：** 192.168.40.7\n*   **管理接口网络掩码：** 255.255.255.0\n*   **管理接口默认网关：**\
    \ 198.168.40.1\n*   **蜜墙网关 DNS 服务器 IP：** 192.168.40.2\n*   **SSH 监听端口：** 22\n\
    *   **允许访问管理接口的 TCP 端口空格分隔列表：** 22 443\n*   **允许访问管理接口的 IP 地址空格分隔列表：** 192.168.40.0/24\n\
    \n#### 防火墙限制\n\n双蜜网配置为执行无限制出站连接，如前文 (7.2) 所述。\n\n#### 配置 Sebek 变量\n\nSebek 是一种数据捕获工具，旨在捕获攻击者在蜜罐上的活动。它包含两个组件。第一个是在蜜罐上运行的客户端；其目的是捕获攻击者的所有活动（按键、文件上传和密码），然后隐蔽地将数据发送给服务器。第二个组件是服务器，它从蜜罐收集数据。服务器通常运行在蜜墙网关上。\n\
    \n*   **Sebek 数据包目标 IP 地址：** 192.268.52.20\n*   **Sebek 数据包目标 UDP 端口：** 1101\n\
    \n#### 蜜罐配置\n\n以下是蜜罐机器属性和配置的详细信息：\n\n##### 蜜罐 1\n\n*   **机器属性：**\n    *   **操作系统：**\
    \ Windows XP\n    *   **网卡数量：** 仅使用一张网卡：`Eth0`\n    *   **IP 地址：** `Eth0`：192.168.52.22\n\
    \n##### 蜜罐 2\n\n*   **机器属性：**\n    *   **操作系统：** Ubuntu Linux 9.10\n    *   **网卡数量：**\
    \ 使用一张网卡：`Eth0`\n    *   **IP 地址：** `Eth0`：192.168.52.23\n\n## Honeynet 2 配置\n\
    \nHoneynet 2 包含蜜墙和两个蜜罐。Honeynet 2 的功能是捕获多态蠕虫实例。以下是蜜墙机器属性和配置的详细信息：\n\n### 机器属性\n\
    \n*   **网卡数量：** 三张网卡（`Eth0`、`Eth1` 和 `Eth2`）\n    *   `Eth0`：连接 Honeynet 2 与 Honeynet\
    \ 2（通过内部路由器）\n    *   `Eth1`：连接 Honeynet 2 与其客户端（蜜罐）\n    *   `Eth2`：用于管理接口\n\
    *   **IP 地址：**\n    *   `Eth0`：192.168.58.22\n"
