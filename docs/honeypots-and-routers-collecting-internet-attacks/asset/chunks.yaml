- raw: "        A worm is after all a program that exploits weakness in an application\
    \ running on a remote host and gets the control over the execution of this vulnerable\
    \ application. Therefore, the root of the problem lies within this vulnerability\
    \ and to deal with it should be the first step in any prevention technique used\
    \ to handle the worm. However, there is a large number of legacy programs in wide\
    \ practice that cannot be modified or replaced overnight to eliminate the system\
    \ vulnerabilities. Furthermore, there are vulnerabilities that are not discovered\
    \ yet, and no one knows their amount. This leads us to the conclusion that prevention\
    \ alone would never make the IT systems secure and detection is also equally essential\
    \ \\[\n\n        Worm attacks can be prevented in two different ways: by preventing\
    \ the vulnerability exploited by the worm or by controlling the exploitation of\
    \ the vulnerability \\[\n\n        ### *4.6.1 Prevention of Vulnerabilities*\n\
    \n        *Secure programming languages and practices:* Good programming practices\
    \ and designing protocols and software in secure manner is the most effective\
    \ way to reduce vulnerabilities and can resolve majority of the issues. Human\
    \ errors, carelessness, and flawed assumptions are possible in the code of best\
    \ and most careful programmers. C is the most commonly used language to design\
    \ critical applications due to its several technical advantages over the other\
    \ languages; however, because of its loose control over human errors, it is often\
    \ vulnerable to buffer overflows. Thus, more secure programming and execution\
    \ environments are extremely essential. Some help is available at the moment through\
    \ the following \\[\n\n        1.  *Static analysis* tools\n\n        2.  *Run-time\
    \ checking*\n\n        3.  A combination of both of the above\n\n        4.  Safe\
    \ languages\n\n        *Secure execution environments:* A secure execution environment\
    \ can also ensure that no vulnerabilities will be exploited. For example, maintaining\
    \ the memory integrity by using memory accesses with assertions will provide secure\
    \ execution.\n\n        ### *4.6.2 Prevention of Exploits*\n\n        Unfortunately,\
    \ there is no tool that comprehensively eliminates vulnerabilities of a software.\
    \ Furthermore, the use of such tools is difficult and cost in terms of performance\
    \ degradation that does not suits the economics of the production environment.\
    \ Therefore, vendors keep on selling software with vulnerabilities to keep the\
    \ attackers busy in making exploits. On top of that there are legacy system, as\
    \ we mentioned earlier, that are in practice and difficult to be corrected. Preventing\
    \ exploits is thus more convenient than preventing vulnerabilities. There are\
    \ multiple dimensions of this prevention strategy \\[\n\n        1.  *Access control\
    \ (OS dimension):* It has always been considered the job of the operating system\
    \ (OS) to control unauthorized access to system resources or contents of the file\
    \ system and securely maintain access boundaries in multiuser environments. This\
    \ purpose is usually achieved with the help of access control matrix and list\
    \ that specify the nature of the relationship of each user with every resource\
    \ of the system.\n\n        2.  *Firewalls and IPS (network dimension):* The attacks\
    \ from the out of the organization can also be deterred by filtering the incoming\
    \ traffic based on some rules and policies. Usually performed at the border gateways\
    \ of networks, it can also be implemented at the network layer of the network\
    \ protocol stack on individual machines. For example, never accept any TCP connection\
    \ from a particular IP address. Another example is to drop connections with packet\
    \ contents matching to a certain pattern. Filtering of traffic based on IP addresses\
    \ is usually performed by firewalls that maintain a list of good and bad addresses.\
    \ On the other hand, intrusion prevention systems based on signatures are used\
    \ to filter traffic with unwanted patterns. There is another class of closely\
    \ related software called *intrusion detection systems (IDSs)*, described in [Section\
    \ 4.7](#09_Chapter04.xhtml#sch4_26).\n\n        3.  *Deterrents (legal dimension):*\
    \ Several technical and legal measures have been taken to stop the attacks on\
    \ the computer systems. Enactment and enforcement of laws in combination with\
    \ building up of audit trails on computers (to record evidence) is also helping\
    \ in securing the IT systems primarily in countries with strict implementation\
    \ of laws.\n\n        ## **4.7 Intrusion Detection Systems**\n\n        The research\
    \ community has proposed and built IDSs to defend against Internet worms (and\
    \ other attacks) \\[\n\n        There are two basic types of intrusion detection:\
    \ *host-based* and *network-based. Host-based* IDSs examine data held on individual\
    \ computers that serve as hosts, while *network-based* IDSs examine data exchanged\
    \ between computers.\n\n        There are two basic techniques used to detect\
    \ intruders: *anomaly detection* and *misuse detection* (signature detection).\
    \ *Anomaly detection* is designed to uncover abnormal patterns of behavior; the\
    \ IDS establishes a baseline of normal usage patterns, and anything that widely\
    \ deviates from it gets flagged as a possible intrusion. Although these systems\
    \ can detect previously unknown attacks, they have high false positives when the\
    \ normal activities are diverse and unpredictable. *Misuse detection*, which is\
    \ commonly called s*ignature detection*, uses specifically known patterns of unauthorized\
    \ behavior to predict and detect subsequent similar attempts. These specific patterns\
    \ are called *signatures*. They can detect the known worms but will fail on the\
    \ new types.\n\n        Most deployed worm-detection systems are signature-based,\
    \ which belongs to the misuse detection category. They look for specific byte\
    \ sequences (called *attack signatures)* that are known to appear in the attack\
    \ traffic. The signatures are manually identified by human experts through careful\
    \ analysis of the byte sequence from captured attack traffic. A good signature\
    \ should be one that consistently shows up in attack traffic but rarely appears\
    \ in normal traffic.\n\n        ## **4.8 Firewalls**\n\n        A firewall is\
    \ a system designed to prevent unauthorized access to or from a private network.\
    \ Firewalls can be implemented in both hardware and software, or a combination\
    \ of both. Firewalls are frequently used to prevent unauthorized Internet users\
    \ from accessing private networks connected to the Internet, especially intranets.\
    \ All messages entering or leaving the intranet pass through the firewall, which\
    \ examines each message and blocks those that do not meet the specified security\
    \ criteria \\[\n\n        There are several types of firewall techniques; some\
    \ of them are as follows:\n\n        *   *Packet filter:* It looks at each packet\
    \ entering or leaving the network and accepts or rejects it based on user-defined\
    \ rules. Packet filtering is fairly effective and transparent to users, but it\
    \ is difficult to configure. In addition, it is susceptible to IP spoofing.\n\n\
    \        *   *Application gateway:* It applies security mechanisms to specific\
    \ applications, such as FTP and Telnet servers. This is very effective, but can\
    \ impose performance degradation.\n\n        *   *Circuit-level gateway:* It applies\
    \ security mechanisms when a TCP or a UDP connection is established. Once the\
    \ connection has been made, packets can flow between the hosts without further\
    \ checking.\n\n        *   *Proxy server:* It intercepts all messages entering\
    \ and leaving the network. The proxy server effectively hides the true network\
    \ addresses.\n\n        ## References\n\n        *   [1.](#09_Chapter04.xhtml#rfn1)\
    \ M.M.Z.E. Mohammed, and A.-S.K. Pathan. Automatic Defense against Zero-Day Polymorphic\
    \ Worms in Communication Networks, CRC Press, Boca Raton, FL, 2013.\n\n      \
    \  *   [2.](#09_Chapter04.xhtml#rfn2) M. Erbschloe, Trojans, Worms, and Spyware:\
    \ A Computer Security Professional’s Guide to Malicious Code, Elsevier, Burlington,\
    \ MA, 2005."
  fmt: '

    蠕虫毕竟是一种程序，它利用远程主机上运行的应用程序中的弱点，并获取对该易受攻击应用程序执行的控制权。因此，问题的根源在于该漏洞，处理该漏洞应是用于应对蠕虫的任何预防技术中的第一步。然而，大量遗留程序广泛应用于实践中，无法一夜之间通过修改或替换来消除系统漏洞。此外，还存在尚未被发现的漏洞，没人知道它们的数量。这导致我们得出结论：仅靠预防永远无法使
    IT 系统安全，检测同样至关重要。


    蠕虫攻击可以通过两种不同的方式来预防：通过预防蠕虫利用的漏洞，或通过控制对漏洞的利用。


    ### 4.6.1 漏洞预防


    **安全编程语言与实践：**良好的编程实践，以及以安全的方式设计协议和软件，是减少漏洞、解决大多数问题的最有效途径。即使是最优秀、最谨慎的程序员，其代码中也可能存在人为错误、疏忽和错误假设。`C`
    是设计关键应用程序最常用的语言，因其相对于其他语言的若干技术优势；然而，由于其对人为错误的松散控制，它往往容易受到缓冲区溢出的攻击。因此，更安全的编程和执行环境极为重要。目前可通过以下方式获得一些帮助：


    1.  **静态分析**工具

    2.  **运行时检查**

    3.  上述两者的结合

    4.  安全语言


    **安全执行环境：**安全执行环境也能确保漏洞不被利用。例如，通过使用带有断言的内存访问来维护内存完整性，将提供安全的执行。


    ### 4.6.2 利用预防


    不幸的是，不存在能全面消除软件漏洞的工具。此外，使用此类工具既困难，又会导致性能下降，这不符合生产环境的经济效益。因此，供应商继续销售带有漏洞的软件，让攻击者忙于制作利用代码。除此之外，还有如前所述的遗留系统正在使用中，且难以修正。因此，预防利用比预防漏洞更方便。这种预防策略有多个维度：


    1.  **访问控制（操作系统维度）：**控制对系统资源或文件系统内容的未授权访问，并在多用户环境中安全地维护访问边界，一直被认为是操作系统（`OS`）的职责。此目的通常借助访问控制矩阵和列表来实现，它们指定每个用户与系统每个资源关系的性质。

    2.  **防火墙与 IPS（网络维度）：**来自组织外部的攻击，也可通过基于某些规则和策略过滤入站流量来阻止。这通常在网络边界网关执行，也可在单个机器的网络协议栈网络层实现。例如，绝不接受来自特定
    IP 地址的任何 `TCP` 连接。另一个例子是丢弃包内容与特定模式匹配的连接。基于 IP 地址的流量过滤通常由防火墙执行，防火墙维护着好坏地址列表。另一方面，基于特征的入侵防御系统用于过滤带有不需要模式的流量。还有一类紧密相关的软件称为**入侵检测系统（`IDS`）**，详见
    [4.7 节](#09_Chapter04.xhtml#sch4_26)。

    3.  **威慑措施（法律维度）：**已采取若干技术和法律措施，以阻止对计算机系统的攻击。法律的颁布与执行，结合在计算机上建立审计跟踪（以记录证据），也有助于保障
    IT 系统安全，主要在法律严格实施的国家。


    ## 4.7 入侵检测系统


    研究界已提出并构建了 `IDS`，以防御互联网蠕虫（及其他攻击）。


    入侵检测有两种基本类型：**基于主机**和**基于网络**。**基于主机**的 `IDS` 检查作为主机的单个计算机上存储的数据，而**基于网络**的 `IDS`
    检查计算机之间交换的数据。


    检测入侵者有两种基本技术：**异常检测**和**误用检测**（特征检测）。**异常检测**旨在发现异常行为模式；`IDS` 建立正常使用模式的基线，任何严重偏离基线的行为都会被标记为可能的入侵。尽管这些系统能检测先前未知的攻击，但当正常活动多样且不可预测时，它们会产生高误报率。**误用检测**，通常称为**特征检测**，利用特定的已知未授权行为模式来预测和检测后续类似尝试。这些特定模式称为**特征**。它们能检测已知蠕虫，但会对新类型失效。


    大多数部署的蠕虫检测系统基于特征，属于误用检测类别。它们寻找已知出现在攻击流量中的特定字节序列（称为**攻击特征**）。特征由人工专家通过仔细分析捕获的攻击流量中的字节序列来手工识别。一个好的特征应是持续出现在攻击流量中，但在正常流量中很少出现的特征。


    ## 4.8 防火墙


    防火墙是一种旨在防止未授权访问专用网络或从专用网络访问的系统。防火墙可用硬件、软件或两者结合来实现。防火墙常用于防止未授权的互联网用户访问连接到互联网的专用网络，尤其是内联网。所有进出内联网的消息都要通过防火墙，防火墙会检查每条消息，并阻止不符合指定安全标准的消息。


    防火墙技术有多种类型；其中一些如下：


    *   **包过滤器：**它检查进出网络的每个数据包，并根据用户定义的规则接受或拒绝。包过滤相当有效，且对用户透明，但难以配置。此外，它易受 IP 欺骗攻击。

    *   **应用网关：**它对特定应用程序（如 `FTP` 和 `Telnet` 服务器）应用安全机制。这非常有效，但可能造成性能下降。

    *   **电路级网关：**它在建立 `TCP` 或 `UDP` 连接时应用安全机制。连接建立后，数据包可在主机间流动，无需进一步检查。

    *   **代理服务器：**它拦截进出网络的所有消息。代理服务器有效地隐藏了真实的网络地址。


    ## 参考文献


    *   [1.](#09_Chapter04.xhtml#rfn1) M.M.Z.E. Mohammed, and A.-S.K. Pathan. Automatic
    Defense against Zero-Day Polymorphic Worms in Communication Networks, CRC Press,
    Boca Raton, FL, 2013.

    *   [2.](#09_Chapter04.xhtml#rfn2) M. Erbschloe, Trojans, Worms, and Spyware:
    A Computer Security Professional’s Guide to Malicious Code, Elsevier, Burlington,
    MA, 2005.

    '
