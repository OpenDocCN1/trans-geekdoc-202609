    调制解调器的工作是将数字信号转换为模拟信号，反之亦然。当设备通过电话网络进行数字通信时，通常需要调制解调器。根据定义，调制解调器仅执行*mo*dulation（调制）和*dem*odulation（解调），这是属于
    OSI 第 1 层的任务。然而，在几乎所有情况下，相应的第 2 层功能也是该设备的一部分。


    ## 1.1.2 网桥


    网桥是一种在 OSI 参考模型第 2 层运行的设备，它将两个较小的网络连接成一个，使两个网段中的设备能够相互通信。在大多数情况下，设备通过其端口单独连接到网桥。然而，当合并两个以上的较小网络时，多个网桥也可以通过相同的端口连接。网桥通常被称为*交换机*，尽管术语*交换机*具有更广泛的技术含义。网桥功能的更多细节请参见第
    1.4.1 节。


    ## 1.1.3 路由器


    路由器也是将一个或多个网络合并为一个的设备；但是，它们属于 OSI 模型的第 3 层。这意味着与网桥相比，路由器执行更多且更复杂的任务。通常，与网桥不同，设备不会直接连接到路由器的端口；事实上，是网桥连接到路由器。多个路由器也可以相互连接，以合并连接到它们各自的网络。路由器的操作和特性稍后将在第
