    # IDPS Detection Methods and Components


    ## Anomaly-Based Detection Challenges


    Inadvertently including malicious activity as part of a profile is a common problem
    with anomaly-based IDPS products. (In some cases, administrators can modify the
    profile to exclude activity in the profile that is known to be malicious.) To
    develop a good anomaly-based detection scheme, experts should study network activities
    well (such as the traffic rate, the number of packets for each protocol, the rate
    of connections, and the number of different IP addresses), then put these activities
    in a profile. However, there is another critical problem associated with building
    profiles for which it can be very challenging in some cases to make them accurate,
    because computing activities can be very complex. For example, if a particular
    maintenance activity that performs large file transfers occurs only once a month,
    it might not be observed during the training period; when the maintenance occurs,
    it is likely to be considered as a significant deviation from the profile and
    triggers an alert (which would be a false detection/false positive)!


    An IPS''s evaluation tools are false negatives and false positives. A false negative
    occurs when an attack or an event is either not detected by the IDS or is considered
    benign by the analyst. A false positive occurs when an event is picked up by the
    IDS and declared as an attack but actually it is not or it is benign. The main
    disadvantage of the anomaly-based IDPS products is that they often produce many
    false positives because of benign activity that deviates significantly from profiles,
    especially in more diverse or dynamic environments. Another noteworthy problem
    with the use of anomaly-based detection techniques is that it is often difficult
    for analysts to determine why a particular alert was generated and to validate
    that an alert is accurate and not a false positive, because of the complexity
    of events and number of events that may have caused the alert to be generated.


    ## Stateful Protocol Analysis


    **Stateful protocol analysis**. Stateful protocol analysis method identifies deviations
    of protocol states by comparing observed events with *predetermined profiles of
    generally accepted definitions of benign activity*. This method, unlike anomaly-based
    detection (which uses host or network-specific profiles), relies on vendor-developed
    universal profiles that specify how particular protocols should and should not
    be used. The *stateful* in stateful protocol analysis means that the IDPS is capable
    of understanding and tracking the state of network, transport, and application
    protocols that have a notion of state. For example, when a user starts a file
    transfer protocol session, the session is initially in the unauthenticated state.
    Unauthenticated users should only perform a few commands in this state, such as
    viewing help information or providing usernames and passwords. An important part
    of understanding state is pairing requests with responses, so when a file transfer
    protocol authentication attempt occurs, the IDPS can determine if it was successful
    by finding the status code in the corresponding response. Once the user has authenticated
    successfully, the session is in the authenticated state, and users are expected
    to perform any of several dozen commands. Performing most of these commands while
    in the unauthenticated state would be considered suspicious, but in the authenticated
    state, performing most of them is considered benign.


    Unexpected sequences of commands can be identified by the stateful protocol, such
    as issuing the same command repeatedly or issuing a command without first issuing
    a command upon which it is dependent. In addition, there is another state-tracking
    feature of stateful protocol analysis, that is, for protocols that perform authentication;
    the IDPS can keep track of the authenticator used for each session, and record
    the authenticator used for suspicious activity. This is helpful when investigating
    an incident. Some IDPSs can also use the authenticator information to define acceptable
    activity differently for multiple classes of users or specific users.


    Stateful protocol analysis methods perform protocol analysis to detect attacks,
    which includes reasonableness checks for individual commands, such as minimum
    and maximum lengths for arguments. If a command typically has a username argument,
    and usernames have a maximum length of 20 characters, then an argument with a
    length of 1000 characters is suspicious. If the large argument contains binary
    data, then it is even more suspicious.


    To detect unauthorized activities, stateful protocol analysis methods use protocol
    models, which are typically based primarily on protocol standards from software
    vendors and standards bodies (e.g., Internet Engineering Task Force Request for
    Comments). The protocol models also typically take into account variances in each
    protocol''s implementation. Many standards are not exhaustively complete in explaining
    the details of the protocol, which causes variations among implementations. Also,
    many vendors either violate standards or add proprietary features, some of which
    may replace features from the standards. For proprietary protocols, complete details
    about the protocols are often not available, making it difficult for IDPS technologies
    to perform comprehensive, accurate analysis. As protocols are revised and vendors
    alter their protocol implementations, IDPS protocol models need to be updated
    to reflect those changes.


    The main disadvantage of the stateful protocol analysis methods is that they are
    very resource-intensive because of the complexity of the analysis and the overhead
    involved in performing state tracking for many simultaneous sessions. Another
    disadvantage is that the stateful protocol analysis methods cannot detect attacks
    that do not violate the characteristics of generally acceptable protocol behavior,
    such as performing many benign actions in a short period of time to cause a DoS.
    Yet another problem is that the protocol model used by an IDPS might conflict
    with the way the protocol is implemented in particular versions of specific applications
    and operating systems, or how differently client and server implementations of
    the protocol interact.


    ## 6.3.3 IDPS Components


    In this section, we mention typical components in an IDPS solution.


    *   **Sensor or agent:** The main function of this component is to monitor and
    analyze activity. The term `sensor` is typically used for IDPSs that monitor networks,
    and the term `agent` is typically used for IDPS technologies that monitor only
    a single host.

    *   **Management server:** A management server is a device that receives information
    from sensors or agents and manages it. There are some management servers that
    perform analysis on the information received and can identify incidents that the
    individual sensor or agent cannot. Matching event information from multiple sensors
    or agents, such as finding events triggered by the same IP address is known as
    `correlation`. Some small IDPS deployments do not use any management servers.
    In larger IDPS deployments, there are often multiple management servers, sometimes
    in tiers.

    *   **Database server:** A database server is a repository for event information
    recorded by sensors, agents, and management servers. Many IDPSs support the use
    of database servers.

    *   **Console:** A console is a program that provides an interface for the IDPS
    users and administrators. Console software is typically installed on standard
    desktop or laptop computers. Some consoles are used for IDPS administration only,
    such as configuring sensors or agents and applying software updates, whereas other
    consoles are used strictly for monitoring and analysis. Some IDPS consoles provide
    both administration and monitoring capabilities.

