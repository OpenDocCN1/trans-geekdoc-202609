- raw: "        In the previous chapters, we learned about computer networks, information\
    \ system security, and intrusions and vulnerabilities. This information is important\
    \ because the objective of this book is to give researchers and practitioners\
    \ complete information about how to use honeypots and routers to collect Internet\
    \ attacks. To meet this objective, researchers should have enough information\
    \ about computer networks, which will help them to design a good network against\
    \ the attackers. They should also have enough information about information system\
    \ security, which will help them to know the most important issues in information\
    \ security. Also, researchers should have sufficient information about intrusions\
    \ and vulnerabilities, which will help them to know how the intrusions can exploit\
    \ the vulnerabilities to compromise networks. This chapter discusses about malware;\
    \ this discussion is important because we would like to collect Internet attacks\
    \ (i.e., malware), so we must know the malware in detail.\n\n        The remaining\
    \ chapters of this book will cover the following topics:\n\n        [Chapter 5](#10_Chapter05.xhtml)\
    \ discusses honeypots; they are used for many objectives. One of the objectives\
    \ is to collect Internet attacks; here, we will show how to use this tool to collect\
    \ Internet attacks.\n\n        [Chapter 6](#11_Chapter06.xhtml) discusses security\
    \ systems such as firewall, antivirus, and intrusion detection and prevention\
    \ systems. The researchers should have a thorough knowledge of these systems,\
    \ which will help them to filter the known attacks and to protect the production\
    \ networks.\n\n        [Chapter 7](#12_Chapter07.xhtml) discusses real designed\
    \ network to collect attacks of zero-day polymorphic worms. This will provide\
    \ details on how the theoretical knowledge shared in earlier chapters can be practically\
    \ implemented.\n\n        ## **4.1 Introduction**\n\n        Malware is a major\
    \ threat to the security of IT infrastructure of an organization and could cause\
    \ huge financial loss. Thus, the protection of network and other IT resources\
    \ from this threat is of extreme importance. This chapter provides an overview\
    \ about malware and how we can protect our machines against them \\[\n\n     \
    \   The word *malware* is short for malicious software, and it refers to any software\
    \ that disrupts the normal operation of a computing device or collects sensitive\
    \ information from it or gains access to systems that are not in public domain.\
    \ The use of the term *malware* is limited to the bad intent, that is, if a software\
    \ affects a system accidentally or unintentionally, then it would not be considered\
    \ as malware. An alternate term that includes both kind of software, that is,\
    \ harming the system intentionally or unintentionally is *badware*.\n\n      \
    \  Malware is used to achieve malicious objectives in several ways such as to\
    \ access unauthorized data/information, secretly monitor the activities of the\
    \ users of a computer, harm or sabotage the system, or extort business transactions\
    \ \\[\n\n        Malware are generally categorized as follows:\n\n        *  \
    \ Adware\n\n        *   Ransomware\n\n        *   Scareware\n\n        *   Spyware\n\
    \n        *   Trojan horses\n\n        *   Viruses\n\n        *   Worms\n\n  \
    \      *   Other malicious programs\n\n        Malware can be in the form of active\
    \ content, executable code, scripts, or other software. The usual approach of\
    \ attack is to embed the malware in some other non malicious-looking software.\
    \ Trojans and worms are the most active forms of malware as compared to viruses.\n\
    \n        The following are the software that can be used to protect networks\
    \ against malware \\[\n\n        *   Intrusion detection and prevention systems\n\
    \n        *   Antivirus\n\n        *   Antimalware\n\n        *   Firewalls\n\n\
    \        ## **4.2 Computer Viruses**\n\n        Computer viruses are small software\
    \ or programs designed to affect the routine operation of a computer system as\
    \ well as to spread from one computer to the other \\[\n\n        A computer virus\
    \ can affect the system in following ways \\[\n\n        *   Corrupt or delete\
    \ the data stored on the system.\n\n        *   Use one of the communication means\
    \ such as email applications to spread to the other computers.\n\n        *  \
    \ Corrupt the hard disk in a way that the system cannot operate normally; for\
    \ example, if the boot sector of the disk is erased then the system cannot load\
    \ the operating system.\n\n        *   Corrupt or delete data on your computer.\n\
    \n        *   Use your email program to spread itself to other computers.\n\n\
    \        *   Erase everything on your hard disk.\n\n        Computer viruses \\\
    [\n\n        *   They can be attached to the email messages or instant messaging\
    \ messages.\n\n        *   They can be disguised as attachments of funny images,\
    \ greeting cards, or audio and video files.\n\n        *   They also spread through\
    \ downloads from the Internet and can be hidden in illicit software or other programs.\n\
    \n        There are several approaches to protect your computer from viruses.\
    \ For example, keeping your computer equipped with the strong antivirus tools\
    \ and their latest updates, staying informed about recent threats, running your\
    \ computer as often as possible as a standard user (not as administrator), and\
    \ restraining yourself from any suspicious object when you surf the Internet,\
    \ download files, and open attachments.\n\n        ## **4.3 Computer Worms**\n\
    \n        *Worms* are programs that can replicate itself without requiring any\
    \ user intervention; for example, by sending copies of their code over the network\
    \ and ensuring that it will be executed by the recipient computers. An infected\
    \ computer spreads further copies of the worm and may perform other malicious\
    \ activities under the effect of the worm \\[\n\n        ### *4.3.1 Worm Attack*\n\
    \n        Worms exploit low-level defects in the software present on a system,\
    \ also referred to as *vulnerabilities*. Vulnerabilities are quite common in software\
    \ these days due to their large size, complex structure, and use of unsafe programming\
    \ languages and frameworks. Several types of vulnerabilities have been discovered\
    \ over the years. Buffer overflows, arithmetic overflows, memory management errors,\
    \ and incorrect handling of format strings are the most common types of vulnerabilities\
    \ exploited by worms. In order to infect a computer remotely, it is necessary\
    \ to coerce the computer into running the worm code, and the vulnerabilities make\
    \ it possible \\[\n\n        While new types of vulnerabilities can be possibly\
    \ discovered in the future, the mechanisms employed by the worms to gain control\
    \ of a program’s execution are less likely to change significantly over time.\
    \ The three common approaches used by worms to gain control of the execution of\
    \ a remote program are (\n\n        ### *4.3.2 Spread of Worms*\n\n        Once\
    \ a computer is successfully infected by a worm, it exploits that computer to\
    \ spread and propagate itself to the other computers that are reachable from the\
    \ affected computer. The propagation process of the worm and the forthcoming affects\
    \ such as its severity, survivability, and persistence are largely dependant on\
    \ how the worm selects its victims.\n\n        The trivial and classic approach\
    \ is to perform a random walk on the Internet to look for possible victims. However,\
    \ novel and intelligent attack models have also been emerged that produce severe\
    \ damages \\[\n\n        *Random scanning*. The simplest approach used by worms\
    \ to spread themselves is to perform random network scanning. The node that contains\
    \ the worm or worm code randomly generates or selects a network address range\
    \ to scan. It then begins to search for potential victims in that network space\
    \ such as open or unsecured ports and attacks these vulnerable hosts."
  fmt: '

    在前几章中，我们学习了计算机网络、信息系统安全以及入侵和漏洞。这些信息很重要，因为本书的目标是为研究人员和从业者提供关于如何使用蜜罐和路由器收集互联网攻击的完整信息。为实现这一目标，研究人员应具备足够的计算机网络知识，这将帮助他们设计能够抵御攻击者的优秀网络。他们还应具备足够的信息系统安全知识，这将帮助他们了解信息安全中最重要的问题。此外，研究人员应具备足够的入侵和漏洞知识，这将帮助他们了解入侵如何利用漏洞来攻陷网络。本章讨论恶意软件；这一讨论很重要，因为我们想要收集互联网攻击（即恶意软件），所以必须详细了解恶意软件。


    本书剩余章节将涵盖以下主题：


    *   **第 5 章** 讨论蜜罐；它们用于多种目的。其中一个目的是收集互联网攻击；此处将展示如何使用该工具收集互联网攻击。

    *   **第 6 章** 讨论安全系统，如防火墙、防病毒软件、入侵检测和防御系统。研究人员应对这些系统有透彻的了解，这将帮助他们过滤已知攻击并保护生产网络。

    *   **第 7 章** 讨论为收集零日多态蠕虫攻击而设计的真实网络。这将提供前几章共享的理论知识如何在实践中实施的详细信息。


    ## 4.1 简介


    恶意软件是组织 IT 基础设施安全的主要威胁，可能造成巨大的经济损失。因此，保护网络和其他 IT 资源免受此威胁至关重要。本章概述了恶意软件以及我们如何保护机器免受其侵害。


    *malware* 一词是 *malicious software*（恶意软件）的缩写，指任何破坏计算设备正常运行、从中收集敏感信息或访问非公共领域系统的软件。术语
    *malware* 的使用仅限于恶意意图，即如果软件意外或无意地影响系统，则不视为恶意软件。一个同时包含这两类软件（即故意或无意损害系统）的替代术语是 *badware*。


    恶意软件通过多种方式实现恶意目的，例如访问未授权的数据/信息、秘密监控计算机用户的活动、破坏或损坏系统，或勒索商业交易。


    恶意软件通常分类如下：


    *   广告软件

    *   勒索软件

    *   恐吓软件

    *   间谍软件

    *   特洛伊木马

    *   病毒

    *   蠕虫

    *   其他恶意程序


    恶意软件可以是活动内容、可执行代码、脚本或其他软件形式。典型的攻击手法是将恶意软件嵌入其他看似无害的软件中。与病毒相比，特洛伊木马和蠕虫是最活跃的恶意软件形式。


    可用于保护网络免受恶意软件侵害的软件如下：


    *   入侵检测和防御系统

    *   防病毒软件

    *   反恶意软件

    *   防火墙


    ## 4.2 计算机病毒


    计算机病毒是旨在影响计算机系统常规操作并从一台计算机传播到另一台计算机的小型软件或程序。


    计算机病毒可通过以下方式影响系统：


    *   损坏或删除系统上存储的数据。

    *   利用电子邮件应用程序等通信手段传播到其他计算机。

    *   以导致系统无法正常运行的方式损坏硬盘；例如，如果磁盘的引导扇区被擦除，则系统无法加载操作系统。

    *   损坏或删除计算机上的数据。

    *   利用电子邮件程序将自身传播到其他计算机。

    *   清除硬盘上的所有内容。


    计算机病毒：


    *   可附加在电子邮件或即时通讯消息中。

    *   可伪装成有趣的图片、贺卡或音频和视频文件的附件。

    *   也可通过从互联网下载传播，并隐藏在非法软件或其他程序中。


    有多种方法可以保护计算机免受病毒侵害。例如，为计算机配备强大的防病毒工具及其最新更新，随时了解最新威胁，尽可能以标准用户（而非管理员）身份运行计算机，以及在浏览互联网、下载文件和打开附件时避免接触任何可疑对象。


    ## 4.3 计算机蠕虫


    *蠕虫* 是无需任何用户干预即可自我复制的程序；例如，通过网络发送其代码副本并确保由接收方计算机执行。受感染的计算机会进一步传播蠕虫副本，并可能在蠕虫影响下执行其他恶意活动。


    ### 4.3.1 蠕虫攻击


    蠕虫利用系统上软件中的低级缺陷，也称为 *漏洞*。由于软件规模大、结构复杂以及使用不安全的编程语言和框架，漏洞在当今软件中非常常见。多年来发现了多种类型的漏洞。缓冲区溢出、算术溢出、内存管理错误和格式字符串处理不当是蠕虫利用的最常见漏洞类型。为了远程感染计算机，必须强制计算机运行蠕虫代码，而漏洞使这成为可能。


    虽然未来可能会发现新类型的漏洞，但蠕虫获取程序执行控制权的机制不太可能随时间发生重大变化。蠕虫获取远程程序执行控制权的三种常见方法是（


    ### 4.3.2 蠕虫传播


    一旦计算机成功被蠕虫感染，它就会利用该计算机将自身传播并繁殖到从受影响计算机可到达的其他计算机。蠕虫的传播过程及其即将产生的影响（如严重性、生存能力和持久性）在很大程度上取决于蠕虫如何选择受害者。


    最简单经典的方法是在互联网上执行随机游走以寻找潜在受害者。然而，也出现了新颖且智能的攻击模型，可造成严重破坏。


    *随机扫描*。蠕虫传播自身的最简单方法是执行随机网络扫描。包含蠕虫或蠕虫代码的节点随机生成或选择一个网络地址范围进行扫描。然后它开始在该网络空间中搜索潜在受害者，如开放或不安全的端口，并攻击这些易受攻击的主机。

