- raw: "        11.  [\\*](#08_Chapter03.xhtml#RFN-2) It is not that HTTP messages\
    \ are never restricted. However, the usual scenario of restriction for HTTP traffic\
    \ is to restrict HTTP requests for some known uniform resource locators (URL),\
    \ which is not the case here.[↩](#fnref11)\n\n        12.  [†](#08_Chapter03.xhtml#RFN-3)\
    \ We have intentionally avoided the use of the word *attacker* here as not all\
    \ the uses of HTTP tunneling are unanimously considered malicious.[↩](#fnref12)\n\
    \n        13.  [\\*](#08_Chapter03.xhtml#RFN-4) An ACK flag is usually set in\
    \ all the segments after the first two steps of the handshake process due to the\
    \ fact that they are all acknowledgments.[↩](#fnref13)\n\n        14.  [\\*](#08_Chapter03.xhtml#RFN-5)\
    \ Two or more hosts are considered to be in the same collision domain if their\
    \ frames can collide with each other when transmitted at the same time.[↩](#fnref14)"
  fmt: '

    11.  [\*](#08_Chapter03.xhtml#RFN-2) It is not that HTTP messages are never restricted.
    However, the usual scenario of restriction for HTTP traffic is to restrict HTTP
    requests for some known uniform resource locators (URL), which is not the case
    here.[↩](#fnref11)


    12.  [†](#08_Chapter03.xhtml#RFN-3) We have intentionally avoided the use of the
    word *attacker* here as not all the uses of HTTP tunneling are unanimously considered
    malicious.[↩](#fnref12)


    13.  [\*](#08_Chapter03.xhtml#RFN-4) An `ACK` flag is usually set in all the segments
    after the first two steps of the handshake process due to the fact that they are
    all acknowledgments.[↩](#fnref13)


    14.  [\*](#08_Chapter03.xhtml#RFN-5) Two or more hosts are considered to be in
    the same collision domain if their frames can collide with each other when transmitted
    at the same time.[↩](#fnref14)

    '
  trans: '

    11.  \* 并非 HTTP 报文从不受限。然而，限制 HTTP 流量的通常场景是限制针对某些已知统一资源定位符（URL）的 HTTP 请求，而此处并非这种情况。↩


    12.  † 我们此处刻意避免使用 *攻击者* 一词，因为并非所有 HTTP 隧道的用途都被一致认为是恶意的。↩


    13.  \* `ACK` 标志通常会在握手过程的前两个步骤之后的所有段中被置位，因为它们都是确认段。↩


    14.  \* 如果两个或多个主机的帧在同时传输时可能发生碰撞，则认为它们处于同一冲突域中。↩

    '
