  fmt: "\n## Honeywall Configuration\n\n### Network Interfaces\n*   **Eth1**: `192.168.59.20`\n\
    *   **Eth2**: `192.168.40.8`\n\n### Honeynet Public IP Addresses\nIn the following,\
    \ we type the external IP addresses for the honeypots. These IP addresses are\
    \ the attackers:\n\n**IP addresses**: `192.168.59.22`; `192.168.59.23`\n\n###\
    \ Honeynet Network\nHere, we type the honeynet network in CIDR notation:\n\n**Honeynet\
    \ network CIDR**: `192.168.59.0/24`\n\n### Broadcast Address of the Honeynet\n\
    `192.168.59.255`\n\n### Management Interface\nThe third interface will be used\
    \ for remote management. This interface helps us to remotely manage the honeywall\
    \ through SSH and Walleye Web interface. We use Eth2 for the management interface.\n\
    \n*   **IP address of the management interface**: `192.168.40.8`\n*   **Network\
    \ mask of the management interface**: `255.255.255.0`\n*   **Default gateway for\
    \ the management interface**: `198.168.40.1`\n*   **DNS server IP for honeywall\
    \ gateway**: `192.168.40.2`\n*   **SSH listening port**: `22`\n*   **Space delimited\
    \ list of TCP ports allowed into the management interface**: `22 443`\n*   **Space\
    \ delimited list of IP addresses that can access the management interface**: `192.168.40.0/24`\n\
    \n### Firewall Restrictions\nThe double-honeynet configured to perform unlimited\
    \ outbound connections as mentioned in (7.2) above.\n\n### Configure Sebek Variables\n\
    *   **Destination IP address of the Sebek packets**: `192.68.59.20`\n*   **Destination\
    \ UDP port of the Sebek packets**: `1101`\n\n### Honeypots Configuration\nThe\
    \ following are the details of the honeypots machines properties:\n\n#### Honeypot\
    \ 1\n**Machine Properties**\n*   **Operating system**: Windows XP\n*   **Number\
    \ of network cards**: We use one network card: Eth0\n*   **IP address**: `192.168.59.22`\n\
    \n#### Honeypot 2\n**Machine Properties**\n*   **Operating system**: Ubuntu Linux\
    \ 9.10\n*   **Number of network cards**: We use one network card: Eth0\n*   **IP\
    \ address**: `192.168.59.23`\n\n## Signature Generator Configuration\nThe function\
    \ of the signature generator is to generate signatures for polymorphic worms samples.\n\
    \n### Machine Properties\n*   **Operating system**: Ubuntu Linux 9.10\n*   **Number\
    \ of network cards**: One network card: Eth0\n*   **IP address**: Eth0: `192.168.55.22`\n\
    \n## 7.5 Summary\nThis chapter discussed two parts. In the first part, we gave\
    \ full details of the double-honeynet system. In the second part, we gave a brief\
    \ introduction about the software used to implement the double-honeynet system\
    \ and double-honeynet configurations using VMware.\n\n## References\n*   **[1]**\
