    computer systems are used for networking and communications, it is recommended
    to ensure that all IDPS components are appropriately secured. Securing IDPS components
    is a critical matter in many networking system because the attackers may attempt
    to avoid the IDPSs from detecting attacks or can try to gain access to sensitive
    information in the IDPSs, such as host configurations and known vulnerabilities.
    The IDPSs have several types of components, including the following [


    1.  Sensors or agents

    2.  Management servers

    3.  Database servers

    4.  User and administrator consoles

    5.  Management networks


    All components'' operating systems and applications should be always kept updated,
    and all software-based IDPS components should be developed in the best intricate
    way possible, so that potential threats are diminished and the security protections
    may not be breached easily.


    Specific protective actions of particular importance include creating separate
    accounts for each IDPS user and administrator, restricting network access to IDPS
    components, and ensuring that IDPS management communications are protected appropriately,
    such as encrypting them or transmitting them over a physically or logically separate
    network. Administrators should maintain the security of the IDPS components on
    a continuous basis, including verifying that the components are functioning as
    desired, monitoring the components for security issues, performing regular vulnerability
    assessments, responding appropriately to vulnerabilities in the IDPS components,
    and testing and deploying IDPS updates. Administrators should also back up configuration
    settings periodically and ensure before applying updates that the existing settings
    are not inadvertently lost.


    To obtain more comprehensive and accurate detection and prevention of Internet
    worm and other attacks, different types of organizations need to consider using
    different types of IDPS technologies. There are four primary types of IDPS [


    1.  Network-based

    2.  Wireless

    3.  NBA-based

    4.  Host-based


    Each of the above-mentioned mechanisms provides a different type of defense against
    malicious activities (i.e., the network-based mechanism can detect attacks that
    the host-based mechanism cannot or may not detect). For example, the network-based
    mechanism can detect attacks on the network level, whereas the host-based can
    detect attacks at the host level. To obtain a good and effective defense solution,
    a combination of network-based and host-based IDPS mechanisms is needed. If the
    organization determines that its wireless networks need additional monitoring,
    it can use the wireless IDPS technologies to obtain a good defense performance.


    If organizations desire additional detection capabilities for denial of service
    (DoS) attacks, worms, and other threats, it is recommended to use the NBA technologies
    to achieve that goal. The organizations that plan to use multiple types of IDPS
    technologies or multiple products of the same type of IDPS are recommended to
    be aware of whether or not the IDPSs should be integrated.


    There are two types of IDPS integrations. They are as follows [


    1.  `Direct IDPS integration:` The process of a product feeding information to
    another product is called `direct IDPS integration`. Direct IDPS integration is
    most suitable when an organization uses multiple IDPS products from a single vendor.
    For example, a network-based IDPS technology perhaps uses host-based IDPS data
    to determine whether an attack is detected successfully by the network-based IDPS
    technology, and a network-based IDPS technology could give network flow information
    to an NBA IDPS technology. The feeding information helps in improving detection
    accuracy, speed up the analysis process, and help in ordering of threats according
    to their priorities. The main drawback of using a fully integrated solution is
    that a failure or compromise could affect all the IDPS technologies negatively.

