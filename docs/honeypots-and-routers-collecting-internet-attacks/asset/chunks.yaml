- raw: "        *Scanning versus enumeration*. Scanning and enumeration are the two\
    \ techniques that belong to the second phase of hacking, that is, scanning; confused?\
    \ Surprisingly, the hacking industry has picked the same word for a hacking phase\
    \ and a technique used in that phase, mainly due to the reason that again enumeration\
    \ is very similar to scanning. However, the objective in enumeration is to discover\
    \ user names, machine names, shared resources, services, and other similar entities.\
    \ Scanning, on the other hand, is performed to discover active network hosts and\
    \ open ports on these hosts, thus, referred to as *network scanning* too.\n\n\
