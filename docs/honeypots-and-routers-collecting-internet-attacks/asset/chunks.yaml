    IDPS components can be connected with each other through regular networks or a
    separate network designed for security software management known as a *management
    network*. If a management network is used, each sensor or agent host has an additional
    network interface known as a *management interface* that connects to the management
    network, and the hosts are configured so that they cannot pass any traffic between
    management interfaces and other network interfaces. The management servers, database
    servers, and consoles are attached to the management network only. This architecture
    effectively isolates the management network from the production networks, concealing
    the IDPS from attackers and ensuring that the IDPS has adequate bandwidth to function
    under adverse conditions. If an IDPS is deployed without a separate management
    network, a way of improving IDPS security is to create a virtual management network
    using a virtual local area network within the standard networks. Using a virtual
    local area network provides protection for IDPS communications, but not as much
    protection as a separate management network.


    ## 6.3.4 IDPS Security Capabilities


    IDPS technologies offer extensive and accurate detection capabilities. To provide
    more accurate detection, IDPS products use a combination of detection techniques.
    The types of events detected and the typical accuracy of detection vary greatly
    depending on the type of IDPS technology. Most IDPSs require at least some tuning
    and customization to improve their detection accuracy, usability, and effectiveness.
    Examples of tuning and customization capabilities are as follows:


    *   **Thresholds:** A threshold is a value that sets the limit between normal
    and abnormal behavior. Thresholds usually specify a maximum acceptable level,
    such as five failed connection attempts in 60 s, or 100 characters for a filename
    length.

    *   **Blacklists and whitelists:** A blacklist is a list of discrete entities,
    such as hosts, transmission control protocol (TCP) or user datagram protocol (UDP)
    port numbers, Internet control message protocol types and codes, applications,
    usernames, URLs, filenames, or file extensions, that have been previously determined
    to be associated with malicious activity. Blacklists allow IDPSs to block activity
    that is highly likely to be malicious. Some IDPSs generate dynamic blacklists
    that are used to temporarily block recently detected threats (e.g., activity from
    an attacker''s IP address). A whitelist is a list of discrete entities that are
    known to be benign. Whitelists are typically used on a granular basis, such as
    protocol by protocol, to reduce or ignore false positives involving known benign
    activity.

    *   **Alert settings:** Most IDPS technologies allow administrators to customize
    each alert type. Examples of actions that can be performed on an alert type include
    toggling it on or off and setting a default priority or severity level. Some products
    can suppress alerts if an attacker generates many alerts in a short period of
    time, and may also temporarily ignore all future traffic from the attacker. This
    is to prevent the IDPS from being overwhelmed by alerts.

    *   **Code viewing and editing:** Some IDPS technologies permit administrators
    to see some or all of the detection-related code. This is usually limited to signatures,
    but some technologies allow administrators to see additional code, such as programs
    used to perform stateful protocol analysis. Viewing the code can help analysts
    determine why particular alerts were generated, so they can better validate alerts
    and identify false positives. The ability to edit detection-related code and write
    new code (e.g., new signatures) is necessary to fully customize certain types
    of detection capabilities.


    Most IDPSs offer multiple prevention capabilities to provide more accurate detection;
    the specific capabilities vary by IDPS technology type. IDPSs usually allow administrators
    to specify the prevention capability configuration for each type of alert. This
    usually includes enabling or disabling prevention, as well as specifying which
    type of prevention capability should be used. Some IDPS technologies offer information
    gathering capabilities such as collecting information on hosts or networks from
    observed activity. Examples include identifying hosts and the operating systems,
    applications that they use, and identifying general characteristics of the network.


    ## 6.3.5 Types of IDPS Technologies


    As we mentioned earlier, there are mainly four types of IDPS technologies:


    *   Network-based IDPS

    *   Wireless IDPS

    *   NBA system

    *   Host-based IDPS


    In this section, we present details about these IDPS technologies.


    ### Network-based IDPS


    Network-based IDPSs are placed at a strategic point or points within the network
    to monitor traffic to and from all devices in the network. A network-based IDPS
    monitors and analyzes all inbound and outbound traffic for particular network
    segments or devices to identify suspicious activity; however, doing so might create
    a bottleneck that would impair the overall speed of the network. The IDPS network
    interface cards are placed into promiscuous mode, so that they accept all packets
    that they see, regardless of their intended destinations. In fact, most of the
    IDPSs perform their analysis at the application layer, for example, hypertext
    transfer protocol, simple mail transfer protocol, and domain name system. They
    also analyze activity at the transport (e.g., TCP and UDP) and network (e.g.,
    IPv4) layers to identify attacks at those layers and facilitate application layer
    analysis. Some network-based IDPSs also perform limited analysis at the hardware
    layer, for example, address resolution protocol.


    Network-based IDPS sensors can be deployed in one of two modes: in-line or passive.


    *   **An in-line sensor** is deployed so that the traffic it monitors passes through
    it. Some in-line sensors are hybrid firewall/IDPS devices. The primary motivation
    for deploying sensors in-line is to stop attacks by blocking traffic.

    *   **A passive sensor** is deployed so that it monitors a copy of the actual
    traffic; no traffic passes through the sensor. Passive sensors can monitor traffic
    through various methods, including a switch spanning port, which can see all traffic
    going through the switch; a network tap, which is a direct connection between
    a sensor and the physical network medium itself, such as a fiber optic cable;
    and an IDS load balancer, which is a device that aggregates and directs traffic
    to monitoring systems.


    Most techniques having a sensor that prevent intrusions require that the sensor
    be deployed in in-line mode. Passive techniques typically provide no reliable
    way for a sensor to block traffic. In some cases, a passive sensor can place packets
    onto a network to attempt to disrupt a connection, but such methods are generally
    less effective than in-line methods. IP addresses are normally not assigned to
    the sensor network interfaces (which are used to monitor traffic), except for
    network interfaces that are also used for IDPS management. Operating of a sensor
    without IP addresses assigned to its monitoring interfaces is known as *stealth
    mode*. It improves the security of the sensors because it conceals them and prevents
    other hosts from initiating connections to them. However, attackers may be able
    to identify the existence of a sensor and determine which product is in use by
    analyzing the characteristics of its prevention actions. Such analysis might include
    monitoring protected networks and determining which scan patterns trigger particular
    responses and what values are set in certain packet header fields.


    ### Network-based IDPS security capabilities against malicious activity

