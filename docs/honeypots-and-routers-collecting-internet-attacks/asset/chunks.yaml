    IDS 和 IPS [


    为了获得良好的防御性能，安全专家通常将 IDS 和 IPS 结合成一个单一系统，称为 `IDPS`。IDPS 的主要功能集中在识别可能的事件、记录有关它们的信息、尝试阻止它们，并向安全管理员报告。


    在观测到任何事件时，IDPS 通常执行以下任务 [20]：


    1.  记录与观测事件相关的信息

    2.  通知安全管理员重要的观测事件

    3.  向安全管理员生成报告


    有几种 IDPS 在记录可疑活动（或威胁）后，也可以通过尝试阻止其成功来对此做出响应。IDPS 使用多种响应技术，涉及的动作包括：停止攻击本身、改变安全环境（例如，重新配置防火墙）或改变攻击的内容。


    组织、银行、教育机构、研究实验室、办公室，或凡是使用计算机系统进行网络和通信的地方，建议确保所有 IDPS 组件都得到适当的保护。在许多网络系统中，保护 IDPS
    组件至关重要，因为攻击者可能试图阻止 IDPS 检测攻击，或试图访问 IDPS 中的敏感信息，如主机配置和已知漏洞。IDPS 有几类组件，包括以下内容 [


    1.  传感器或代理

    2.  管理服务器

    3.  数据库服务器

    4.  用户和管理员控制台

    5.  管理网络


    所有组件的操作系统和应用程序应始终保持最新，所有基于软件的 IDPS 组件应以尽可能最佳的复杂方式开发，以便减少潜在威胁，并使安全防护不易被突破。


    特定的重要保护措施包括：为每个 IDPS 用户和管理员创建单独的账户，限制对 IDPS 组件的网络访问，并确保 IDPS 管理通信得到适当保护，例如对其进行加密，或通过物理或逻辑上独立的网络进行传输。管理员应持续维护
    IDPS 组件的安全，包括验证组件是否按预期运行、监控组件的安全问题、执行定期漏洞评估、妥善响应 IDPS 组件中的漏洞，以及测试和部署 IDPS 更新。管理员还应定期备份配置设置，并在应用更新前确保现有设置不会意外丢失。


    为了获得更全面、更准确的互联网蠕虫及其他攻击的检测和预防，不同类型的组织需要考虑使用不同类型的 IDPS 技术。主要有四种类型的 IDPS [


    1.  基于网络

    2.  无线

    3.  基于 NBA

    4.  基于主机


    上述每种机制都针对恶意活动提供不同类型的防御（即基于网络的机制可以检测到基于主机的机制无法或可能无法检测到的攻击）。例如，基于网络的机制可以检测网络层面的攻击，而基于主机的机制可以检测主机层面的攻击。为了获得良好有效的防御解决方案，需要结合基于网络和基于主机的
    IDPS 机制。如果组织确定其无线网络需要额外监控，可以使用无线 IDPS 技术以获得良好的防御性能。


    如果组织希望获得针对拒绝服务 (DoS) 攻击、蠕虫和其他威胁的额外检测能力，建议使用 NBA 技术来实现该目标。计划使用多种类型的 IDPS 技术或同类
    IDPS 多个产品的组织，建议了解这些 IDPS 是否应当集成。


    IDPS 集成有两种类型。它们如下 [


    1.  `直接 IDPS 集成:` 一个产品向另一个产品提供信息的过程称为 `直接 IDPS 集成`。当组织使用单一供应商的多个 IDPS 产品时，直接 IDPS
    集成最为适用。例如，基于网络的 IDPS 技术可能利用基于主机的 IDPS 数据来判断攻击是否被基于网络的 IDPS 技术成功检测到，基于网络的 IDPS
    技术也可向 NBA IDPS 技术提供网络流信息。这种信息共享有助于提高检测准确性、加快分析过程，并帮助根据优先级对威胁进行排序。使用完全集成解决方案的主要缺点是，故障或受损可能会对所有
    IDPS 技术产生负面影响。


