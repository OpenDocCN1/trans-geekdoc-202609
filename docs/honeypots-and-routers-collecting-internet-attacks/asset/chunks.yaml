- raw: "        Network-based IDPSs provide extensive and broad detection capabilities.\
    \ Most IDPSs use a combination of signature-based, anomaly-based, and stateful\
    \ protocol analysis detection techniques. These techniques are usually tightly\
    \ interwoven; for example, a stateful protocol analysis engine might parse activity\
    \ into requests and responses, each of which is examined for anomalies and compared\
    \ against signatures of known bad activity.\n\n        Most types of events commonly\
    \ detected by network-based IDPS sensors include application, transport, and network\
    \ layer reconnaissance and attacks. Many sensors can also detect unexpected application\
    \ services, such as tunneled protocols, backdoors, and hosts running unauthorized\
    \ applications. Also, some types of security policy violations can be detected\
    \ by sensors that allow administrators to specify the characteristics of activity\
    \ that should not be permitted, such as TCP or UDP port numbers, IP addresses,\
    \ and website names. Some sensors can also monitor the initial negotiation conducted\
    \ when establishing encrypted communications to identify client or server software\
    \ that has known vulnerabilities or is misconfigured. Examples include secure\
    \ shell, transport layer security, and IP security.\n\n        Network-based IDPSs\
    \ are associated with high rates of false positives and false negatives. These\
    \ rates can only be reduced to some extent because of the complexity of the activities\
    \ being monitored. A single sensor may monitor traffic involving hundreds or thousands\
    \ of internal and external hosts, which run a wide variety of frequently changing\
    \ applications and operating systems. A sensor cannot understand everything it\
    \ sees. Another common problem with detection accuracy is that the IDPS typically\
    \ requires considerable tuning and customization to take into account the characteristics\
    \ of the monitored environment. Also, security controls that alter network activity,\
    \ such as firewalls and proxy servers, could cause additional difficulties for\
    \ sensors by changing the characteristics of traffic.\n\n        Usually, network-based\
    \ schemes can collect limited information on hosts and their network activity.\
    \ Examples of these are a list of hosts on the organization’s network, the operating\
    \ system versions and application versions used by these hosts, and general information\
    \ about network characteristics, such as the number of hops between devices. This\
    \ information can be used by some IDPSs to improve detection accuracy. For example,\
    \ an IDPS might allow administrators to specify the IP addresses used by the organization’s\
    \ Web servers, mail servers, and other common types of hosts, and also specify\
    \ the types of services provided by each host (e.g., the Web server application\
    \ type and version run by each Web server).This allows the IDPS to better prioritize\
    \ alerts; for example, an alert for an Apache attack directed at an Apache Web\
    \ server would have a higher priority than the same attack directed at a different\
    \ type of Web server. Some network-based IDPSs can also import the results of\
    \ vulnerability scans and use them to determine which attacks would likely be\
    \ successful, if not blocked. This allows the IDPS to make better decisions on\
    \ prevention actions and prioritize alerts more accurately.\n\n        Network-based\
    \ IDPS sensors offer many prevention capabilities. A passive sensor can attempt\
    \ to end an existing TCP session by sending TCP reset packets to both end points,\
    \ to make it appear to each end point that the other is trying to end the connection.\
    \ However, this technique often cannot be performed in time to stop an attack\
    \ and can only be used for TCP; other, newer prevention capabilities are more\
    \ effective. In-line sensors can perform in-line firewalling, throttle bandwidth\
    \ usage, and alter malicious contents. Both passive and in-line sensors can reconfigure\
    \ other network security devices to block malicious activity or route it elsewhere,\
    \ and some sensors can run a script or program when certain malicious activity\
    \ is detected to trigger custom actions.\n\n        *Network-based IDPS limitations*.\
    \ Although network-based IDPSs provide extensive detection capabilities, they\
    \ do have some significant limitations. Attacks within encrypted traffic would\
    \ not be detected by the network-based IDPSs, including virtual private network\
    \ connections, hypertext transfer protocol over secure sockets layer, and secure\
    \ shell sessions. To ensure that sufficient analysis is performed on payloads\
    \ within encrypted traffic, IDPSs can be deployed to analyze the payloads before\
    \ they are encrypted or after they have been decrypted. Examples include placing\
    \ network-based IDPS sensors to monitor decrypted traffic and using host-based\
    \ IDPS software to monitor activity within the source or destination host.\n\n\
    \        When a high load appears in a network, the network-based IDPSs may be\
    \ unable to perform full analysis. This leads to some attacks to go undetected,\
    \ especially if stateful protocol analysis methods are in use. For in-line IDPS\
    \ sensors, dropping packets also causes disruptions in network availability, and\
    \ delays in processing packets could cause unacceptable latency. To avoid this,\
    \ some inline IDPS sensors can recognize high load conditions and either pass\
    \ certain types of traffic through the sensor without performing full analysis\
    \ or drop low-priority traffic. Sensors may also provide better performance under\
    \ high loads if they use specialized hardware (e.g., high-bandwidth network cards)\
    \ or recompile components of their software to incorporate settings and other\
    \ customizations made by administrators.\n\n        IDPS sensors can be avoided\
    \ by various types of attacks. Attackers can generate large volumes of traffic,\
    \ such as DDoS attacks, and other anomalous activity (e.g., unusually fragmented\
    \ packets) to exhaust a sensor’s resources or cause it to crash. Another attack\
    \ technique, known as *blinding*, generates traffic that is likely to trigger\
    \ many IDPS alerts quickly. In many cases, the blinding traffic is not intended\
    \ to actually attack any target. An attacker runs the *real* attack separately\
    \ at the same time as the blinding traffic, hoping that the blinding traffic will\
    \ either cause the IDPS to fail in some way or cause the alerts for the real attack\
    \ to go unnoticed. Many sensors can recognize common attacks against them, alert\
    \ administrators to the attack, and then ignore the rest of the activities.\n\n\
    \        *Wireless IDPS*. A wireless IDPS monitors wireless network traffic and\
    \ analyzes wireless networking protocols to identify malicious behavior. However,\
    \ it cannot identify suspicious activity in the application or higher-layer network\
    \ protocols (e.g., TCP and UDP) that the wireless network traffic is transferring.\
    \ It is most commonly deployed within the range of an organization’s wireless\
    \ network to monitor it, but it can also be deployed to locations where unauthorized\
    \ wireless networking could be occurring.\n\n        Because of the transmission\
    \ methods, wireless network attacks differ from those on wired networks. However,\
    \ the basic components involved in a wireless IDPS are the same as the network-based\
    \ IDPS: consoles, database servers, management servers, and sensors. A wireless\
    \ IDPS monitors the network by sampling the traffic. There are two frequency bands\
    \ to monitor (2.4 and 5 GHz), and each band includes many channels. A sensor is\
    \ used to monitor a channel at a time and it can switch to other channels as needed.\n\
    \n        We should mention that most of the wireless local area networks (WLANs)\
    \ use the Institute of Electrical and Electronics Engineers (IEEE) 802.11 family\
    \ of WLAN standards \\[\n\n        *   A station, which is a wireless end-point\
    \ device (e.g., laptop computer, personal digital assistant).\n\n        *   An\
    \ access point, which logically connects stations with an organization’s wired\
    \ network infrastructure or other network."
  fmt: '

    # Network-based IDPSs


    Network-based IDPSs provide extensive and broad detection capabilities. Most IDPSs
    use a combination of signature-based, anomaly-based, and stateful protocol analysis
    detection techniques. These techniques are usually tightly interwoven; for example,
    a stateful protocol analysis engine might parse activity into requests and responses,
    each of which is examined for anomalies and compared against signatures of known
    bad activity.


    Most types of events commonly detected by network-based IDPS sensors include application,
    transport, and network layer reconnaissance and attacks. Many sensors can also
    detect unexpected application services, such as tunneled protocols, backdoors,
    and hosts running unauthorized applications. Also, some types of security policy
    violations can be detected by sensors that allow administrators to specify the
    characteristics of activity that should not be permitted, such as TCP or UDP port
    numbers, IP addresses, and website names. Some sensors can also monitor the initial
    negotiation conducted when establishing encrypted communications to identify client
    or server software that has known vulnerabilities or is misconfigured. Examples
    include secure shell, transport layer security, and IP security.


    Network-based IDPSs are associated with high rates of false positives and false
    negatives. These rates can only be reduced to some extent because of the complexity
    of the activities being monitored. A single sensor may monitor traffic involving
    hundreds or thousands of internal and external hosts, which run a wide variety
    of frequently changing applications and operating systems. A sensor cannot understand
    everything it sees. Another common problem with detection accuracy is that the
    IDPS typically requires considerable tuning and customization to take into account
    the characteristics of the monitored environment. Also, security controls that
    alter network activity, such as firewalls and proxy servers, could cause additional
    difficulties for sensors by changing the characteristics of traffic.


    Usually, network-based schemes can collect limited information on hosts and their
    network activity. Examples of these are a list of hosts on the organization’s
    network, the operating system versions and application versions used by these
    hosts, and general information about network characteristics, such as the number
    of hops between devices. This information can be used by some IDPSs to improve
    detection accuracy. For example, an IDPS might allow administrators to specify
    the IP addresses used by the organization’s Web servers, mail servers, and other
    common types of hosts, and also specify the types of services provided by each
    host (e.g., the Web server application type and version run by each Web server).
    This allows the IDPS to better prioritize alerts; for example, an alert for an
    Apache attack directed at an Apache Web server would have a higher priority than
    the same attack directed at a different type of Web server. Some network-based
    IDPSs can also import the results of vulnerability scans and use them to determine
    which attacks would likely be successful, if not blocked. This allows the IDPS
    to make better decisions on prevention actions and prioritize alerts more accurately.


    Network-based IDPS sensors offer many prevention capabilities. A passive sensor
    can attempt to end an existing TCP session by sending TCP reset packets to both
    end points, to make it appear to each end point that the other is trying to end
    the connection. However, this technique often cannot be performed in time to stop
    an attack and can only be used for TCP; other, newer prevention capabilities are
    more effective. In-line sensors can perform in-line firewalling, throttle bandwidth
    usage, and alter malicious contents. Both passive and in-line sensors can reconfigure
    other network security devices to block malicious activity or route it elsewhere,
    and some sensors can run a script or program when certain malicious activity is
    detected to trigger custom actions.


    ## Network-based IDPS limitations


    Although network-based IDPSs provide extensive detection capabilities, they do
    have some significant limitations. Attacks within encrypted traffic would not
    be detected by the network-based IDPSs, including virtual private network connections,
    hypertext transfer protocol over secure sockets layer, and secure shell sessions.
    To ensure that sufficient analysis is performed on payloads within encrypted traffic,
    IDPSs can be deployed to analyze the payloads before they are encrypted or after
    they have been decrypted. Examples include placing network-based IDPS sensors
    to monitor decrypted traffic and using host-based IDPS software to monitor activity
    within the source or destination host.


    When a high load appears in a network, the network-based IDPSs may be unable to
    perform full analysis. This leads to some attacks to go undetected, especially
    if stateful protocol analysis methods are in use. For in-line IDPS sensors, dropping
    packets also causes disruptions in network availability, and delays in processing
    packets could cause unacceptable latency. To avoid this, some inline IDPS sensors
    can recognize high load conditions and either pass certain types of traffic through
    the sensor without performing full analysis or drop low-priority traffic. Sensors
    may also provide better performance under high loads if they use specialized hardware
    (e.g., high-bandwidth network cards) or recompile components of their software
    to incorporate settings and other customizations made by administrators.


    IDPS sensors can be avoided by various types of attacks. Attackers can generate
    large volumes of traffic, such as DDoS attacks, and other anomalous activity (e.g.,
    unusually fragmented packets) to exhaust a sensor’s resources or cause it to crash.
    Another attack technique, known as *blinding*, generates traffic that is likely
    to trigger many IDPS alerts quickly. In many cases, the blinding traffic is not
    intended to actually attack any target. An attacker runs the *real* attack separately
    at the same time as the blinding traffic, hoping that the blinding traffic will
    either cause the IDPS to fail in some way or cause the alerts for the real attack
    to go unnoticed. Many sensors can recognize common attacks against them, alert
    administrators to the attack, and then ignore the rest of the activities.


    ## Wireless IDPS


    A wireless IDPS monitors wireless network traffic and analyzes wireless networking
    protocols to identify malicious behavior. However, it cannot identify suspicious
    activity in the application or higher-layer network protocols (e.g., TCP and UDP)
    that the wireless network traffic is transferring. It is most commonly deployed
    within the range of an organization’s wireless network to monitor it, but it can
    also be deployed to locations where unauthorized wireless networking could be
    occurring.


    Because of the transmission methods, wireless network attacks differ from those
    on wired networks. However, the basic components involved in a wireless IDPS are
    the same as the network-based IDPS: consoles, database servers, management servers,
    and sensors. A wireless IDPS monitors the network by sampling the traffic. There
    are two frequency bands to monitor (2.4 and 5 GHz), and each band includes many
    channels. A sensor is used to monitor a channel at a time and it can switch to
    other channels as needed.


    We should mention that most of the wireless local area networks (WLANs) use the
    Institute of Electrical and Electronics Engineers (IEEE) 802.11 family of WLAN
    standards.


    *   A station, which is a wireless end-point device (e.g., laptop computer, personal
    digital assistant).

    *   An access point, which logically connects stations with an organization’s
    wired network infrastructure or other network.

    '
  trans: '

    # 基于网络的 IDPS


    基于网络的 IDPS 提供广泛且全面的检测能力。大多数 IDPS 结合使用基于特征、基于异常和有状态协议分析检测技术。这些技术通常紧密交织在一起；例如，有状态协议分析引擎可能会将活动解析为请求和响应，每个请求和响应都会被检查是否存在异常，并与已知恶意活动的特征进行比对。


    基于网络的 IDPS 传感器常见的检测事件类型包括应用层、传输层和网络层的侦察与攻击。许多传感器还能检测意外的应用服务，例如隧道协议、后门以及运行未授权应用程序的主机。此外，某些类型的安全策略违规可通过传感器检测，这些传感器允许管理员指定不应允许的活动特征，例如
    TCP 或 UDP 端口号、IP 地址和网站名称。某些传感器还能监控建立加密通信时的初始协商过程，以识别存在已知漏洞或配置错误的客户端或服务器软件。示例包括安全外壳协议、传输层安全协议和
    IP 安全协议。


    基于网络的 IDPS 伴随着较高的误报率和漏报率。由于受监控活动的复杂性，这些比率只能在一定程度上降低。单个传感器可能监控涉及数百或数千个内部和外部主机的流量，这些主机运行着各种频繁变更的应用程序和操作系统。传感器无法理解其所见的一切。另一个影响检测准确性的常见问题是，IDPS
    通常需要大量的调优和定制，以考虑受监控环境的特性。此外，改变网络活动的安全控制（如防火墙和代理服务器）通过改变流量特征，可能给传感器带来额外的困难。


    通常，基于网络的方案只能收集有关主机及其网络活动的有限信息。示例包括组织网络上的主机列表、这些主机使用的操作系统版本和应用程序版本，以及网络特性的一般信息（如设备间的跳数）。某些
    IDPS 可利用这些信息提高检测准确性。例如，IDPS 可能允许管理员指定组织 Web 服务器、邮件服务器和其他常见主机类型使用的 IP 地址，还可指定每台主机提供的服务类型（例如每台
    Web 服务器运行的 Web 服务器应用程序类型和版本）。这使 IDPS 能更好地确定警报优先级；例如，针对 Apache Web 服务器的 Apache
    攻击警报，其优先级将高于针对其他类型 Web 服务器的同类攻击。某些基于网络的 IDPS 还能导入漏洞扫描结果，并利用它们判断哪些攻击若不被阻断极可能成功。这使
    IDPS 能在预防行动上做出更好的决策，并更准确地确定警报优先级。


    基于网络的 IDPS 传感器提供多种预防能力。被动传感器可尝试通过向两个端点发送 TCP 重置包来终止现有的 TCP 会话，使每个端点都误以为对方试图结束连接。然而，这种技术往往无法及时执行以阻止攻击，且仅适用于
    TCP；其他更新的预防能力更为有效。内联传感器可执行内联防火墙功能、限制带宽使用并修改恶意内容。被动和内联传感器均可重新配置其他网络安全设备以阻断恶意活动或将其重定向至他处，某些传感器在检测到特定恶意活动时还可运行脚本或程序以触发自定义操作。


    ## 基于网络的 IDPS 局限性


    尽管基于网络的 IDPS 提供广泛的检测能力，但它们确实存在一些显著局限。加密流量中的攻击无法被基于网络的 IDPS 检测到，包括虚拟专用网络连接、超文本传输安全协议和安全外壳协议会话。为确保对加密流量中的载荷进行充分分析，可部署
    IDPS 在载荷加密前或解密后对其进行分析。示例包括部署基于网络的 IDPS 传感器监控解密后的流量，以及使用基于主机的 IDPS 软件监控源主机或目标主机内的活动。


    当网络出现高负载时，基于网络的 IDPS 可能无法执行全面分析。这会导致某些攻击未被检测到，尤其是在使用有状态协议分析方法时。对于内联 IDPS 传感器，丢包也会导致网络可用性中断，处理数据包的延迟可能造成不可接受的延迟。为避免此情况，某些内联
    IDPS 传感器能识别高负载状况，并选择让特定类型的流量绕过全面分析直接通过传感器，或丢弃低优先级流量。如果传感器使用专用硬件（如高带宽网卡）或重新编译其软件组件以纳入管理员的设置和其他定制，也可能在高负载下提供更好的性能。


    IDPS 传感器可能被各类攻击规避。攻击者可生成大量流量（如 DDoS 攻击）和其他异常活动（如异常分片的数据包）来耗尽传感器资源或导致其崩溃。另一种称为*致盲*的攻击技术，会生成可能在短时间内触发大量
    IDPS 警报的流量。在许多情况下，致盲流量并非意图实际攻击任何目标。攻击者在致盲流量运行的同时单独发起*真实*攻击，企图让致盲流量导致 IDPS 以某种方式失效，或使真实攻击的警报被忽视。许多传感器能识别针对自身的常见攻击，向管理员发出警报，随后忽略其余活动。


    ## 无线 IDPS


    无线 IDPS 监控无线网络流量并分析无线网络协议以识别恶意行为。然而，它无法识别无线网络流量所传输的应用层或更高层网络协议（如 TCP 和 UDP）中的可疑活动。它最常部署在组织无线网络的覆盖范围内以对其进行监控，但也可部署在可能发生未授权无线联网的位置。


    由于传输方式的差异，无线网络攻击有别于有线网络攻击。然而，无线 IDPS 涉及的基本组件与基于网络的 IDPS 相同：控制台、数据库服务器、管理服务器和传感器。无线
    IDPS 通过采样流量来监控网络。需监控两个频段（2.4 和 5 GHz），每个频段包含多个信道。传感器一次监控一个信道，并可根据需要切换到其他信道。


    我们应提到，大多数无线局域网 (WLAN) 使用电气电子工程师学会 (IEEE) 802.11 系列 WLAN 标准。


    *   站点，即无线终端设备（如笔记本电脑、个人数字助理）。

    *   接入点，用于在逻辑上将站点与组织的有线网络基础设施或其他网络连接起来。


    '
