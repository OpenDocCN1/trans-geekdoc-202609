- raw: "        *   *Only monitor interactions made directly with the honeypot:* This\
    \ is considered as the greatest disadvantage of honeypots. They only see what\
    \ activity is directed against them. If an attacker breaks into your network and\
    \ attacks a variety of systems, your honeypot will be unaware of the activity\
    \ unless it is attacked directly. If the attacker has identified your honeypot\
    \ for what it is, he can avoid that system and infiltrate your organization, with\
    \ the honeypot never knowing something bad had happened! As noted earlier, honeypots\
    \ have a microscope effect on the value of the data you collect, enabling you\
    \ to focus closely on data of known value. However, like a microscope, the honeypot’s\
    \ very limited field of view can exclude events happening all around it.\n\n \
    \       *   *Risk:* honeypots can be used by expert attackers to attack other\
    \ systems. Therefore, they can be even great threats for your network.\n\n   \
    \     *   *Fingerprinting:* Another disadvantage found, especially in many commercial\
    \ versions, is fingerprinting. Fingerprinting is when an attacker can identify\
    \ the true identity of a honeypot because it has certain expected characteristics\
    \ or behaviors. For example, a honeypot may emulate a Web server. Whenever an\
    \ attacker connects to this specific type of honeypot, the Web server responds\
    \ by sending a common error message using standard hypertext markup language (HTML).\
    \ This is the exact response we would expect from any Web server. However, if\
    \ the honeypot has a weakness in it and misspells one of the HTML commands, such\
    \ as spelling the word *length* as *legnht*, then this misspelling becomes a fingerprint\
    \ for the honeypot. This is because any attacker can quickly identify such types\
    \ of mistakes in the Web server emulation. Also, an incorrectly implemented honeypot\
    \ can identify itself. For example, a honeypot may be designed to emulate an NT\
    \ IIS Web server, but it also has certain characteristics that identify it as\
    \ a Unix Solaris server. These contradictory identities can act as a signature\
    \ for a honeypot.\n\n        If a blackhat identifies an organization using a\
    \ honeypot on its internal networks, he could spoof the identity of other production\
    \ systems and attack the honeypot. The honeypot would detect these spoofed attacks,\
    \ and falsely alert administrators that a production system is attacking it, sending\
    \ the organization on a wild goose chase. Meanwhile, in the midst of all the confusions,\
    \ an attacker could focus on real attacks.\n\n        Fingerprinting is an even\
    \ greater risk for research honeypots. A system designed to gain intelligence\
    \ can be devastated if detected. An attacker can feed bad information to a research\
    \ honeypot as opposed to avoiding detection. This bad information would then lead\
    \ the security community to make incorrect conclusions about the blackhat community.\n\
    \n        Though these disadvantages seem to be diminishing the value of honeypots,\
    \ some organizations might want to use them positively to scare away or confuse\
    \ attackers. Once a honeypot is attacked, it can identify itself and then warn\
    \ the attacker in hopes of scaring him off. However, in most situations, organizations\
    \ do not want their honeypots to be detected.\n\n        ### *5.3.3 Roles of Honeypots\
    \ in Network Security*\n\n        We have discussed the advantages and disadvantages\
    \ of the honeypots. So, to see what the greatest value of the honeypots could\
    \ be, we must apply them to security. We may analyze how they add value to security\
    \ and reduce an organization’s overall risk.\n\n        The security is broken\
    \ into three categories by Bruce Schneier in *Secrets and Lies* \\[\n\n      \
    \  *Prevention*. In network security, prevention means keeping the bad guy out\
    \ (i.e., preventing the bad guy from entering your network). Honeypots add a little\
    \ value to prevention. Moreover, we know that honeypots can be used by the attackers\
    \ to attack other systems in your organizations. The good news is that there are\
    \ many methods that can be used by the honeypots to prevent the attackers from\
    \ entering your organization. When attackers know that an organization has applied\
    \ honeypots, they will worry about being detected and also they will waste time\
    \ and resources attacking the honeypots. This method that we discussed earlier\
    \ is known as prevention by deception or deterrence. The deception concept is\
    \ to make attackers waste time and resources attacking honeypots, as opposed to\
    \ attacking production systems. The deterrence concept is that if attackers know\
    \ there are honeypots in an organization, they may be scared off. Perhaps they\
    \ will not want to be detected or they will not want to waste their time or resources.\n\
    \n        We should mention that deception and deterrence fail to prevent the\
    \ most common of the attacks, especially targets-of-opportunity. This is because,\
    \ *targets-of-opportunity* attackers use automated tools to compromise as many\
    \ systems as possible. These attackers do not spend time analyzing the systems\
    \ they target. Deception or deterrence will not prevent these attacks because\
    \ there is no conscious individual to deter or deceive. Finally, we can say that\
    \ there is no real prevention by honeypots or a limited prevention can be provided\
    \ by them.\n\n        *Detection*. Detection means the act of monitoring, detecting,\
    \ and alerting unauthorized activity. In Chapter 3, we have explained what the\
    \ main difference between the detection and prevention is, and we also gave real-life\
    \ examples. In addition to those concepts, prevention means to prevent unauthorized\
    \ activities from entering your organization; but in case of detection, unauthorized\
    \ activities can enter your organization and the system sends alert in real-time\
    \ to the administrators. Consequently, the administrators will check whether these\
    \ activities are authorized or not. If they are unauthorized, then the administrators\
    \ will deny them or purge them out.\n\n        The security community has designed\
    \ several technologies for doing detection tasks; one of them is an IDS, for example.\
    \ IDS is a great security solution that is designed to detect unauthorized activities\
    \ in the network or on individual machines.\n\n        After these descriptions\
    \ about detection, one question comes forward, that is, Do honeypots add value\
    \ in detecting unauthorized or suspicious activity? The answer is Yes! honeypots\
    \ add a great value in detection, which we will explore now.\n\n        There\
    \ are mainly three common challenges of detection environment, which are as follows:\n\
    \n        *   False positives\n\n        *   False negatives\n\n        *   Data\
    \ aggregation\n\n        False positives happen when the IDS falsely alert suspicious\
    \ or malicious activity, typically because of flawed traffic modeling or weak\
    \ rules/signatures/anomalies specified. False negatives are when system fails\
    \ to detect an attack. The third challenge is data aggregation, centrally collecting\
    \ all the data used for detection, and then corroborating that data into valuable\
    \ information."
