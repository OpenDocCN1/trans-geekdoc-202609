- raw: "        Honeyd was developed by Niels Provos in April 2002. It introduces\
    \ several new concepts for honeypots. First, it does not monitor a single IP address\
    \ for activity; instead, it monitors networks of millions of systems. When it\
    \ detects probes against a system that does not exist, it dynamically assumes\
    \ the identity of the victim and then interacts with the attacker, exponentially\
    \ increasing the ability of the honeypots to detect and capture attacks. It can\
    \ emulate hundreds of OSs, at both the application and IP stack levels. As an\
    \ open source solution, Honeyd is a free technology, giving you full access to\
    \ the source code. You can customize your own solutions or use those developed\
    \ by other members of the security community. Designed for the Unix platform,\
    \ Honeyd is relatively easy to install and configure, relying primarily on a command-line\
    \ interface.\n\n        ### *5.5.4 ManTrap*\n\n        ManTrap is considered as\
    \ a medium- to high-interaction honeypot, and it is a commercial honeypot sold\
    \ by Recourse. ManTrap does not emulate any services such as BOF, Specter, and\
    \ Honeyd. Instead, it takes an OS and creates up to four virtual OSs. This gives\
    \ the administrator extensive control and data-capturing capabilities over the\
    \ virtual OSs. Organizations can even install production applications that they\
    \ want to test, such as DNS, Web servers, or even a database. These virtual OSs\
    \ have almost the exact same interaction and functionality as standard production\
    \ systems. Thus, a great deal can be learnt from the attacker.\n\n        ManTrap\
    \ is fairly easy to deploy and maintain as a commercial product. It can also capture\
    \ an incredible amount of information. Not only does ManTrap detect scans and\
    \ unauthorized connections but also it can capture unknown attacks, blackhat conversations,\
    \ or new vulnerabilities. However, its versatility comes at the cost of increased\
    \ risk. As the honeypot has a full OS for the attacker to work with, the honeypot\
    \ can be used to attack other systems and execute unauthorized activity.\n\n \
    \       One limitation of ManTrap is that it is currently limited to the Solaris\
    \ OS. At the time of writing this book, versions for other OSs are under development,\
    \ but they have not yet been released. As technology moves forward at great speed,\
    \ the readers are suggested to seek for the latest product version. ManTrap has\
    \ the flexibility to be used as either a production or research honeypot, although\
    \ it is most commonly used for production purposes.\n\n        ### *5.5.5 Honeynets*\n\
    \n        Honeynets are high-interaction honeypots. In fact, it is difficult to\
    \ envisage any other honeypot solution that can offer a greater level of interaction\
    \ than honeynets do. The concept of a honeynet is simple: building a network of\
    \ standard production systems, just as we would find in most organizations today.\
    \ Putting this network of systems behind some type of access control device (such\
    \ as a firewall) and watching what happens. Attackers can probe, attack, and exploit\
    \ any system within the honeynet, giving them full OSs and applications to interact\
    \ with. No services are emulated, and no caged environments are created. The systems\
    \ within a honeynet can be anything: a Solaris server running an Oracle database,\
    \ a Windows XP server running an IIS Web server, a Cisco router, and so on. In\
    \ short, the systems within a honeynet are true production systems \\[\n\n   \
    \     The complexity of a honeynet is not in the building of the honeypots themselves\
    \ (they can easily be nothing more than default installations), but rather in\
    \ building the controlled network that both controls and captures all the activities\
    \ that are happening to and from the honeypots. As such, honeynets are some of\
    \ the most difficult honeypots to both deploy and maintain. This complexity makes\
    \ honeynet as the highest-risk honeypot solution. One of the most important advantages\
    \ of honeynets is that they can also capture the greatest level of information\
    \ on almost any platform that may exist. Honeynets are primarily used for research\
    \ purpose. Because of the incredible amount of works involved, they have little\
    \ value as production honeypots.\n\n        *Virtual honeynets*. Virtual honeynet\
    \ is a solution that allows you to run everything you need on a single computer.\
    \ We use the term *virtual*, because different OSs have the *appearance* to be\
    \ running on their own independent computers, which are not real machines. These\
    \ solutions are possible because of virtualization software that allows running\
    \ multiple OSs at the same time, on the same hardware. Virtual honeynets are not\
