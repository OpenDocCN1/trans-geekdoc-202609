    # NBA System Limitations


    NBA technologies overall have great prevention capabilities against authorized
    activities, but also have significant limitations. One of the most important limitations
    is the delay in detecting attacks. Some delay is inherent in anomaly detection
    methods that are based on deviations from a baseline, such as increased bandwidth
    usage or additional connection attempts. Generally, NBA technologies often have
    additional delay caused by their data sources, especially when they rely on flow
    data from routers and other network devices. These data are often transferred
    to the NBA system in batches, as frequently as every minute or two, often much
    less frequently. Therefore, this delay is considered as a significant limitation
    of the NBA technologies, because attacks that occur quickly, such as malware infestations
    and DoS attacks, may not be detected until they have already disrupted or damaged
    systems. To solve the delay problem, the NBA system can use sensors (software
    or hardware component) that do their own packet captures and analysis instead
    of relying on flow data from other devices. However, performing packet captures
    and analysis is much more resource-intensive than analyzing flow data. A single
    sensor can analyze flow data from many networks or perform direct monitoring (packet
    captures) itself generally for a few networks at the most. More sensors may be
    needed to do direct monitoring instead of using flow data.


    # Host-based IDPS


    Host-based systems monitor the characteristics of a single host and the events
    occurring within that host for suspicious activity. Examples of the types of host
    characteristics that a host-based IDPS might monitor are network traffic for that
    host, system logs, running processes, application activity, file access and modification,
    and system and application configuration changes. Host-based IDPSs are most commonly
    deployed on critical hosts such as publicly accessible servers and servers containing
    sensitive information. Additionally, most host-based IDPSs have detection software
    known as `agents` installed on the hosts of interest. Each agent monitors activity
    on a single host and may perform prevention actions. Some agents monitor a single
    specific application service—for example, a Web server program; these agents are
    also known as `application-based IDPSs`.


    Host-based IDPS agents are deployed to critical hosts, such as publicly accessible
    servers and servers containing sensitive information, although they can be deployed
    to other types of hosts as well. Some organizations use agents mainly to analyze
    activity that cannot be monitored by other security controls. For example, network-based
    IDPS sensors cannot analyze the activity within encrypted network communications,
    but host-based IDPS agents installed on endpoints can see the unencrypted activity.
    The network architecture for host-based IDPS deployments is typically simple.
    Since the agents are deployed on existing hosts on the organization’s networks,
    the components usually communicate over those networks instead of using a separate
    management network.


    To provide more accurate intrusion prevention capabilities, most IDPS agents alter
    the internal architecture of hosts. This is typically done through a `shim`, which
    is a layer of code placed between existing layers of code. A `shim` intercepts
    data at a point where that would normally be passed from one piece of code to
    another. The `shim` can then analyze the data and determine whether or not that
    should be allowed or denied. Host-based IDPS agents may use `shims` for several
    types of resources, including network traffic, file-system activity, system calls,
    Windows registry activity, and common applications (e.g., email and Web). Some
    agents monitor activity without using `shims` or they analyze artifacts of activity,
    such as log entries and file modifications. Although these methods are less intrusive
    to the host, these methods are also generally less effective at detecting attacks
    and often cannot perform prevention actions.


    # Host-based IDPS Security Capabilities


    Host-based IDPSs offer good prevention against several types of malicious activities.
    A combination (signature-based and anomaly-based) is often used by the host-based
    IDPSs. The signature-based mechanism is used to identify known attacks, whereas
    the anomaly-based mechanism is used to identify previously unknown attacks.


    There are many types of events detected by host-based IDPSs, but this detection
    is based on the detection techniques that the IDPSs use. Some host-based IDPS
    products offer several of these detection techniques, while others focus on a
    few or one. Some specific techniques that are commonly used in host-based IDPSs
    are as follows:


    ## Code Analysis


    Agents might analyze attempts to execute malicious code. One technique is executing
    code in a virtual environment or sandbox to analyze its behavior and compare it
    to profiles of known good and bad behavior. Another technique is looking for the
    typical characteristics of stack and heap buffer overflow exploits, such as certain
    sequences of instructions and attempts to access portions of memory not allocated
    to the process. System call monitoring is another common technique; it involves
    knowing which applications and processes should be performing certain actions.


    ## Network Traffic Analysis


    This is often similar to what a network-based IDPS does. Some products can also
    analyze wireless traffic. Another capability of traffic analysis is that the agent
    can extract files sent by applications such as email, Web, and peer-to-peer file
    sharing, which can then be checked for malware.


    ## Network Traffic Filtering


    Agents often include a host-based firewall that can restrict incoming and outgoing
    traffic for each application on the system, preventing unauthorized access and
    acceptable use policy violations (e.g., use of inappropriate external services).


    ## File-system Monitoring


    They can be performed using several different techniques. File integrity checking
    involves generating cryptographic checksums for critical files and comparing them
    to reference values to identify which files have been changed. File attribute
    checking is the process of checking critical files’ security attributes, such
    as ownership and permissions, for changes. Both file integrity and file attribute
    checking are reactive, detecting attacks only after they have occurred. Some agents
    have more proactive capabilities, such as monitoring file access attempts, comparing
    each attempt to an access control policy, and preventing attempts that violate
    policy.


    ## Log Analysis


    Some agents can monitor and analyze operating system and application logs to identify
    malicious activity. These logs may contain information on system operational events,
    audit records, and application operational events.


    As the host-based IDPSs provide extensive knowledge of hosts’ characteristics
    and configurations, an agent can often determine whether an attack would succeed
    if not stopped. Agents can use this knowledge to select preventive actions and
    to prioritize alerts.

    '
  trans: '


    # NBA 系统局限性


    NBA 技术总体上对授权活动具有很强的预防能力，但也存在显著的局限性。其中最重要的局限性之一是检测攻击的延迟。基于偏离基线的异常检测方法（如带宽使用量增加或连接尝试增加）固有地存在一定的延迟。通常，NBA
    技术往往因其数据源而产生额外的延迟，特别是当它们依赖来自路由器和其他网络设备的流数据时。这些数据通常以批次形式传输到 NBA 系统，频率高达每一两分钟一次，但通常频率要低得多。因此，这种延迟被视为
    NBA 技术的一个重大局限性，因为发生迅速的攻击（如恶意软件感染和 DoS 攻击）可能在已经扰乱或损坏系统后才被检测到。为了解决延迟问题，NBA 系统可以使用传感器（软件或硬件组件），它们执行自己的数据包捕获和分析，而不是依赖来自其他设备的流数据。然而，执行数据包捕获和分析比分析流数据消耗更多资源。单个传感器可以分析来自许多网络的流数据，或通常最多只能对几个网络执行直接监控（数据包捕获）。可能需要更多的传感器来执行直接监控，而不是使用流数据。


    # 基于主机的 IDPS


    基于主机的系统监控单个主机的特征以及发生在该主机内的事件，以发现可疑活动。基于主机的 IDPS 可能监控的主机特征类型示例包括：该主机的网络流量、系统日志、运行中的进程、应用程序活动、文件访问和修改，以及系统和应用程序配置更改。基于主机的
    IDPS 最常部署在关键主机上，如公开访问的服务器和包含敏感信息的服务器。此外，大多数基于主机的 IDPS 在相关主机上安装了称为 `agents` 的检测软件。每个代理监控单个主机上的活动，并可能执行预防操作。一些代理监控单个特定的应用程序服务——例如，Web
    服务器程序；这些代理也称为 `application-based IDPSs`（基于应用程序的 IDPS）。


    基于主机的 IDPS 代理部署在关键主机上，如公开访问的服务器和包含敏感信息的服务器，尽管它们也可以部署在其他类型的主机上。一些组织主要使用代理来分析其他安全控制无法监控的活动。例如，基于网络的
    IDPS 传感器无法分析加密网络通信内的活动，但安装在端点上的基于主机的 IDPS 代理可以看到未加密的活动。基于主机的 IDPS 部署的网络架构通常很简单。由于代理部署在组织网络上的现有主机上，组件通常通过这些网络进行通信，而不是使用单独的管理网络。


    为了提供更准确的入侵预防能力，大多数 IDPS 代理会改变主机的内部架构。这通常通过 `shim`（垫片/中间层）完成，它是放置在现有代码层之间的一层代码。`shim`
    在数据通常从一段代码传递到另一段代码的点上拦截数据。然后 `shim` 可以分析数据并确定是允许还是拒绝。基于主机的 IDPS 代理可能将 `shim` 用于多种资源类型，包括网络流量、文件系统活动、系统调用、Windows
    注册表活动和常见应用程序（如电子邮件和 Web）。一些代理在不使用 `shim` 的情况下监控活动，或分析活动的痕迹，如日志条目和文件修改。虽然这些方法对主机的侵入性较小，但它们在检测攻击方面通常效果较差，且往往无法执行预防操作。


    # 基于主机的 IDPS 安全能力


    基于主机的 IDPS 对多种恶意活动提供良好的预防。基于主机的 IDPS 通常使用组合（基于特征和基于异常）机制。基于特征的机制用于识别已知攻击，而基于异常的机制用于识别先前未知的攻击。


    基于主机的 IDPS 检测到的事件类型有很多，但这种检测基于 IDPS 使用的检测技术。一些基于主机的 IDPS 产品提供多种此类检测技术，而另一些则专注于少数或单一技术。基于主机的
    IDPS 中常用的一些具体技术如下：


    ## 代码分析


    代理可能会分析执行恶意代码的尝试。一种技术是在虚拟环境或沙箱中执行代码，以分析其行为并将其与已知良性和恶意行为的配置文件进行比较。另一种技术是寻找栈和堆缓冲区溢出利用的典型特征，如特定的指令序列和尝试访问未分配给该进程的内存部分。系统调用监控是另一种常用技术；它涉及了解哪些应用程序和进程应该执行特定操作。


    ## 网络流量分析


    这通常类似于基于网络的 IDPS 所做的工作。一些产品还可以分析无线流量。流量分析的另一个功能是代理可以提取由电子邮件、Web 和点对点文件共享等应用程序发送的文件，随后可以对这些文件进行恶意软件检查。


    ## 网络流量过滤


    代理通常包含基于主机的防火墙，可限制系统上每个应用程序的入站和出站流量，防止未经授权的访问和可接受使用策略违规（例如，使用不当的外部服务）。


    ## 文件系统监控


    可以使用多种不同技术来执行。文件完整性检查涉及为关键文件生成加密校验和，并将其与参考值进行比较，以识别哪些文件已被更改。文件属性检查是检查关键文件的安全属性（如所有权和权限）是否发生变化的过程。文件完整性检查和文件属性检查都是被动的，仅在攻击发生后检测到攻击。一些代理具有更主动的能力，例如监控文件访问尝试，将每次尝试与访问控制策略进行比较，并阻止违反策略的尝试。


    ## 日志分析


    一些代理可以监控和分析操作系统和应用程序日志，以识别恶意活动。这些日志可能包含系统操作事件、审计记录和应用程序操作事件的信息。


    由于基于主机的 IDPS 提供了关于主机特征和配置的广泛知识，代理通常可以确定如果不加阻止，攻击是否会成功。代理可以利用这些知识来选择预防操作并确定警报的优先级。


    '
