    # Honeyd


    Honeyd was developed by Niels Provos in April 2002. It introduces several new
    concepts for honeypots. First, it does not monitor a single IP address for activity;
    instead, it monitors networks of millions of systems. When it detects probes against
    a system that does not exist, it dynamically assumes the identity of the victim
    and then interacts with the attacker, exponentially increasing the ability of
    the honeypots to detect and capture attacks. It can emulate hundreds of OSs, at
    both the application and IP stack levels. As an open source solution, Honeyd is
    a free technology, giving you full access to the source code. You can customize
    your own solutions or use those developed by other members of the security community.
    Designed for the Unix platform, Honeyd is relatively easy to install and configure,
    relying primarily on a command-line interface.


    ## 5.5.4 ManTrap


    ManTrap is considered as a medium- to high-interaction honeypot, and it is a commercial
    honeypot sold by Recourse. ManTrap does not emulate any services such as BOF,
    Specter, and Honeyd. Instead, it takes an OS and creates up to four virtual OSs.
    This gives the administrator extensive control and data-capturing capabilities
    over the virtual OSs. Organizations can even install production applications that
    they want to test, such as DNS, Web servers, or even a database. These virtual
    OSs have almost the exact same interaction and functionality as standard production
    systems. Thus, a great deal can be learnt from the attacker.


    ManTrap is fairly easy to deploy and maintain as a commercial product. It can
    also capture an incredible amount of information. Not only does ManTrap detect
    scans and unauthorized connections but also it can capture unknown attacks, blackhat
    conversations, or new vulnerabilities. However, its versatility comes at the cost
    of increased risk. As the honeypot has a full OS for the attacker to work with,
    the honeypot can be used to attack other systems and execute unauthorized activity.


    One limitation of ManTrap is that it is currently limited to the Solaris OS. At
    the time of writing this book, versions for other OSs are under development, but
    they have not yet been released. As technology moves forward at great speed, the
    readers are suggested to seek for the latest product version. ManTrap has the
    flexibility to be used as either a production or research honeypot, although it
    is most commonly used for production purposes.


    ## 5.5.5 Honeynets


    Honeynets are high-interaction honeypots. In fact, it is difficult to envisage
    any other honeypot solution that can offer a greater level of interaction than
    honeynets do. The concept of a honeynet is simple: building a network of standard
    production systems, just as we would find in most organizations today. Putting
    this network of systems behind some type of access control device (such as a firewall)
    and watching what happens. Attackers can probe, attack, and exploit any system
    within the honeynet, giving them full OSs and applications to interact with. No
    services are emulated, and no caged environments are created. The systems within
    a honeynet can be anything: a Solaris server running an Oracle database, a Windows
    XP server running an IIS Web server, a Cisco router, and so on. In short, the
    systems within a honeynet are true production systems.


    The complexity of a honeynet is not in the building of the honeypots themselves
    (they can easily be nothing more than default installations), but rather in building
    the controlled network that both controls and captures all the activities that
    are happening to and from the honeypots. As such, honeynets are some of the most
    difficult honeypots to both deploy and maintain. This complexity makes honeynet
    as the highest-risk honeypot solution. One of the most important advantages of
    honeynets is that they can also capture the greatest level of information on almost
    any platform that may exist. Honeynets are primarily used for research purpose.
    Because of the incredible amount of works involved, they have little value as
    production honeypots.


    ### Virtual honeynets


    Virtual honeynet is a solution that allows you to run everything you need on a
    single computer. We use the term *virtual*, because different OSs have the *appearance*
    to be running on their own independent computers, which are not real machines.
    These solutions are possible because of virtualization software that allows running
    multiple OSs at the same time, on the same hardware. Virtual honeynets are not
    a radically new technology; they simply take the concept of honeynet technologies
    and implement them into a single system. This implementation has its unique advantages
    and disadvantages over traditional honeynets.


    The advantages of virtual honeynet include reduced cost and easier management,
    as everything is combined into a single system. Instead of taking many computers
    to deploy, with a full honeynet, you can do it with only one computer. However,
    this simplicity comes at a cost. First, you are restricted to choose what types
    of OSs you can deploy by the hardware and virtualization software. For example,
    most virtual honeynets are based on the Intel X86 chip, so you are restricted
    to OSs based on that architecture. You most likely cannot deploy an Alteon switch,
    VAX, or Cray computer within a Virtual honeynet. Second, virtual honeynets come
    with a risk. Specifically, an attacker may be able to compromise the virtualization
    software and take over the entire honeynet, giving them control over all the systems.
    Finally, there is the risk of fingerprinting. Once the bad guys have hacked the
    systems within your virtual honeynet, they may be able to determine what systems
    are running in a virtual environment.


    We have broken virtual honeynets into two categories: self-contained and hybrid.
    Of the two, self-contained is the more common. We will first define these two
    different types, and then cover the different ways that virtual honeynets can
    be deployed.


    ### Self-contained virtual honeynets


    A self-contained virtual honeynet is an entire honeynet network condensed onto
    a single computer. The entire network is virtually contained on a single, physical
    system. A honeynet network typically consists of a firewall gateway for data control
    and data capture, and the honeypots within the honeynet. Some advantages of this
    type of Virtual honeynet(s) are as follows:


    *   **Portable:** Virtual honeynets can be placed on a laptop and taken anywhere.
    The Honeynet Project demonstrated this functionality at the Blackhat Briefings
    in August, 2002.

    *   **Plug and catch:** You can take the one box and just plug it in to any network
    and can be ready to catch those blackhats. This makes deployment much easier,
    as you are physically deploying and connecting only one system.

    *   **Cheap in money and space:** You only need one computer, so it cuts down
    on your hardware expenses. It also has a small footprint and only takes one outlet
    and one port! For those of us with very limited space and power, this is a life
    saver.


    There are some disadvantages as well:


    *   **Single point of failure:** If something goes wrong with the hardware, the
    entire honeynet could be out of commission.

    *   **High-quality computer:** Even though a self-contained honeynet only requires
    one computer, it will have to be a powerful system. Depending on your setup, you
    may need a great deal of memory and processing power.

    *   **Security:** Since everything might be sharing the same hardware, there is
    a danger of an attacker getting at other parts of the system. Much of this depends
    on the virtualization software, which will be discussed in [Section 5.5.5](#10_Chapter05.xhtml#sch5_20).

    '
