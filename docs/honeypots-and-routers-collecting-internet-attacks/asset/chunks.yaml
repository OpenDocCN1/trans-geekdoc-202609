    \ uses multiple IDPS products from a single vendor. For example, a network-based\
    \ IDPS technology perhaps uses host-based IDPS data to determine whether an attack\
    \ is detected successfully by the network-based IDPS technology, and a network-based\
    \ IDPS technology could give network flow information to an NBA IDPS technology.\
    \ The feeding information helps in improving detection accuracy, speed up the\
    \ analysis process, and help in ordering of threats according to their priorities.\
    \ The main drawback of using a fully integrated solution is that a failure or\
    \ compromise could affect all the IDPS technologies negatively."
