    ## 5.6 Conclusion


    Before concluding this chapter, it should be clarified that honeypots do not do
    the same functions as an IDS does. Yes, they have some similarities but from the
    operational point of view, they are fairly different. For example, if we would
    like to devise a good IDS for a network, we must collect valuable data about attacks,
    then analyze these attacks to generate signatures for them, then we have to use
    these signatures in the IDS. Honeypots, on the other hand, are good tools to collect
    valuable data but they are set up for being attacked by the potential attackers.
    A honeypot is not a usual defense mechanism meant for protecting a system, but
    an IDS is a core part of the defense system or strategy. Honeypots are often deployed
    for collecting valuable information about the attackers that could be analyzed
    and used for developing appropriate countermeasures, while IDS simply implements
    a set of rules based on which it detects whether there is any rogue entity that
    enters into the network and then it asks for purging it out.


