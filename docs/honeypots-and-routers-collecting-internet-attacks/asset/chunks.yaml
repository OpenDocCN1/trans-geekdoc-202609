- raw: "        *Random scanning using lists*. In order to improve the efficiency\
    \ of the attack and propagation process, worms may use lists/ ranges of network\
    \ addresses produced from the public data available on the Internet about different\
    \ organizations. The scanning in this way would be more precise and directed.\n\
    \n        *Island hopping*. In island hopping, the worm does not scan all the\
    \ addresses from the selected range; rather, it divides the range into smaller\
    \ blocks and randomly scans few addresses from each block to minimize the time.\
    \ Certainly, the accuracy of this approach would also be less, as the missed hosts\
    \ could be vulnerable.\n\n        *Directed attack*. This approach includes targeting\
    \ a specific network or organization due to its significance or the attackers\
    \ having special interest in it. Information warfare or attacks on some popular\
    \ governmental or non governmental networks are examples of directed attack.\n\
    \n        *Hit-list scanning*. Hit-list scanning is more like *random scanning\
    \ with the list*, as the worm has a list of possibly vulnerable nodes before hand\
    \ in this technique, and scanning is performed in that range. However, as soon\
    \ as the first victim is found and successfully compromised, the main worm node\
    \ assigns the half of the remaining list to this new worm node and itself continues\
    \ with the other half. This way the remaining workload is reduced every time a\
    \ new victim is found.\n\n        ### *4.3.3 Worm Architecture*\n\n        Worm\
    \ software generally has five primary components to perform its operations, which\
