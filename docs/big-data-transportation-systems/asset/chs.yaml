  \ 年 4 月 18 日，记者刘燕。\n\n^(3) [东方网](http://dongfang.com) 于 2016 年 7 月 15 日报道。\n\n^(4)\
  \ *潍坊晚报* 于 2016 年 1 月 7 日报道。\n\n## 第 7 章\n\n## 大数据交通与物流\n\n作为贸易大国，中国物流应用日益频繁，积极推动了中国经济的增长与发展。作为战略性产业，物流备受各界广泛关注，大数据交通的到来可为物流信息提供丰富有效的实践信息。为使物流行业获得更好发展，研究物流与大数据交通关系的建立与构建至关重要。\n\
  \n#### 7.1 大数据交通与运输组织\n\n物流运输组织包含一系列运输活动，如运输调查预测、运输方案编制、运输车辆船舶调配、客货运站组织、运输车辆调度与路线优化、运输过程跟踪定位监控、多式联运协调等。\n\
  \n信息化运输组织离不开大数据交通技术的应用，其渗透到包括电子技术、网络技术、通信技术应用在内的运输生产各个环节，并呈现不同形式的软硬件。\n\n2017 年\
  \ 12 月，央视一套（CCTV1）聚焦报道了京东无人机送货，这促使许多人更加关注新型运输组织体系。\n\n\n\n\n\nCurrently, JD.com\
  \ has built the world's first drone operation and dispatch center. Through big data\
  \ technology, the coordinate position and flight parameters of each drone can be\
  \ clearly viewed on the monitoring screen. By monitoring routes and order data,\
  \ staff can ensure that goods arrive at their destinations according to the system-set\
  \ routes.\n\nWith the support of big data-enabled drone transportation services,\
  \ the delivery of daily necessities, which originally took two to three hours, now\
  \ takes only about 20 minutes.\n\nThe application of big data transportation technology\
  \ can comprehensively improve logistics efficiency by optimizing transport organization,\
  \ help enterprises solve problems, and expand room for promotion.\n\nSpecifically,\
  \ the impact of big data transportation technology on transport organization is\
  \ reflected in the following aspects:\n\n##### 7.1.1 Transport Environment Prediction\n\
  \nIn the past, logistics enterprises were accustomed to predicting the transport\
  \ environment based on past experience, questionnaire surveys, or preliminary contacts—for\
  \ example, finding cargo sources, designing optimal routes, and understanding traffic\
  \ changes. However, in actual operations, by the time survey results were compiled,\
  \ the transport environment had likely already changed.\n\nIn contrast, big data\
  \ can help logistics enterprises comprehensively and accurately depict the transport\
  \ environment and reflect environmental changes based on real and effective data,\
  \ thereby forecasting various stages of product transportation, enabling transport\
  \ organizers to formulate transport plans rationally.\n\n##### 7.1.2 Transport Node\
  \ Location Selection\n\nThe issue of transport node location selection in transport\
  \ organization requires logistics enterprises to minimize distribution costs while\
  \ fully considering their own business characteristics, commodity attributes, and\
  \ road conditions. This problem can be solved using the classification tree method\
  \ in big data technology.\n\n##### 7.1.3 Transport Route Optimization\n\nIn transport\
  \ organization, logistics enterprises can utilize big data to analyze commodity\
  \ specifications and characteristics as well as customers' differentiated needs\
  \ in terms of timeliness and cost. Then, with the aid of the fastest response mechanism,\
  \ they can accurately reflect various factors affecting transport schemes—such as\
  \ which transport scheme to choose, which cost model to adopt, and which transport\
  \ route to select—thereby planning the most reasonable transport routes.\n\nAt the\
  \ same time, enterprises can quickly analyze route and road conditions through real-time\
  \ data received during the distribution process, provide early warnings for situations\
  \ that may affect routes, accurately analyze transport process information, and\
  \ make transport distribution management more intelligent.\n\n##### 7.1.4 Cargo\
  \ Position Optimization\n\nReasonable arrangement of cargo positions is of great\
  \ significance for improving the efficiency of transport route management. For transport\
  \ lines with large cargo volumes and high delivery frequencies, cargo position optimization\
  \ can directly bring improvements in operational efficiency and economic benefits.\n\
  \nIn fact, which commodities can be placed in combination to increase sorting rates,\
  \ and which commodities have short storage cycles and high transport requirements,\
  \ can all be derived through big data association pattern analysis of the data correlation\
  \ relationships of commodities during the transportation process, thereby planning\
  \ transport cargo positions more rationally.\n\nThe most essential difference between\
  \ modern logistics and traditional logistics lies in transport organization. Modern\
  \ logistics is inseparable from the support of information technologies such as\
  \ big data, which is reflected in the systematization, informatization, networking,\
  \ and intelligence of transport organization.\n\nCurrently, limited by factors such\
  \ as insufficient computer application penetration, weak awareness of big data application,\
  \ and uneven employee quality, Chinese logistics enterprises have not yet fully\
  \ integrated transport organization with functions such as packaging, warehousing,\
  \ circulation processing, distribution, and information processing. Therefore, attaching\
  \ importance to the role of big data in transport organization and using it to optimize\
  \ logistics management decisions is of great significance.\n\n#### 7.2 Big Data\
  \ Transportation and Rural Logistics\n\nCompared with urban logistics, rural logistics\
  \ involves more transport links. Rural logistics is usually implemented in three\
  \ steps: warehouse sorting, regional transportation, and last-mile delivery. In\
  \ fact, in the vast majority of rural areas, apart from last-mile delivery, other\
  \ logistics links are similar to urban delivery. Last-mile delivery has become the\
  \ most critical link determining logistics efficiency.\n\nAt the end of May 2016,\
  \ at the 3rd China County-level E-commerce Summit, Xiong Jian, head of Cainiao Network's\
  \ rural logistics, stated that Cainiao Network is using data systems to integrate\
  \ the transport capacity of express logistics enterprises nationwide, building a\
  \ denser and deeper delivery network in rural areas. Through the rural terminal\
  \ logistics network, over 30% of rural parcels can achieve same-day delivery from\
  \ county to village, and nearly 70% can achieve next-morning delivery to the village.\
  \ Cainiao Network has built a terminal network covering over 320 counties and nearly\
  \ 16,000 rural service stations nationwide.\n\nGiven issues in rural logistics such\
  \ as unclear recipient addresses, route planning detached from reality, and excessive\
  \ contingent factors, misdelivery and repeated delivery occur frequently, leading\
  \ to increased delivery costs and decreased recipient satisfaction. Regarding the\
  \ \"last-mile\" delivery dilemma in rural e-commerce logistics, although many logistics\
  \ enterprises have attempted various special delivery models, they have failed to\
  \ effectively improve efficiency.\n\nIn view of this, it is necessary to introduce\
  \ big data transportation technology to accurately analyze the regional distribution\
  \ status of rural logistics and the living conditions of recipients, propose targeted\
  \ solutions, and effectively solve rural logistics problems.\n\n##### 7.2.1 Transport\
  \ Service Innovation\n\nThe collection, collation, analysis, and application of\
  \ big data can effectively integrate rural logistics social transport capacity,\
  \ improve efficiency, and reduce costs. The key to integrating rural logistics resources\
  \ lies in establishing a dedicated logistics information platform, which can be\
  \ implemented through the following two models.\n\nLeading enterprises take the\
  \ lead in building a dedicated rural logistics information platform and are responsible\
  \ for its operation. When other logistics enterprises or individuals access and\
  \ apply it, their various business and shipping data will be recorded. Through massive\
  \ data analysis, consumption habits, credit records, address accuracy, and path\
  \ reliability in rural areas will be recorded and presented, providing a strong\
  \ basis for subsequent customer screening.\n\n\n\n\n###### 应建设特种运输能力生态系统\n\n通过为农村货运车辆安装\
  \ GPS 设备，物流企业可掌握数千辆车的数据。尽管这些车辆在功能和车型上各异，但它们可构成农村物流运力的基础。此外，大型物流企业还可建立私有信息平台，掌握并整合自身信息，从而提供个性化、专业化的物流信息服务。当上述平台相互连接时，即可形成覆盖某一区域农村市场的物流运力体系。例如，面对农村市场，若企业自有运力不足，可从社会运力中获取；同理，社会运力也可根据自身特点主动为有需求的企业服务。特别是在大数据技术的作用下，车货源信息能够保证及时可靠，有利于农村市场货运交易的“最后一公里”。\n\
  \n##### 7.2.2 解决“最后一公里”运输能力不足的问题\n\n利用大数据可解决农村物流配送“最后一公里”运力不足的问题。物流企业可面向公众及农村工人、学生、基层政府工作人员或长途货运司机、出租车司机等，通过移动应用开发开放式信息系统，承接物流配送任务。这样，企业即可获得“临时运力”并对其进行有效管理，从而减轻自有运力的压力。\n\
  \n这种基于大数据的众包模式，特别适合在人口众多的农村地区和山区推广。当然，面对如此大量的移动物流运输资源管理，必须具备大数据技术的海量数据处理能力才能完成。\n\
  \n##### 7.2.3 加快农村物流信息网络建设\n\n大数据技术在农村物流领域的应用，离不开强有力的农村物流信息网络。这项任务无法由单一企业完成，必须由相关政府部门统筹、逐步推进。\n\
  \n一方面，需建立健全农产品信息中心，建立反应灵敏的农产品信息网络，确保大数据能及时被发现和传输。特别是在全农村信息网络仍在建设中的情况下，必须进一步完善农产品大数据采集的基础设施。\n\
  \n另一方面，需培养农村物流专业人才。通过企业、政府部门、科研机构的合作，利用多种教育资源，通过不同形式和层次的培训，提高物流服务和管理人员的质量意识与行业意识，运用信息技术全面提升农村大数据信息服务水平，以满足农村物流服务的人才需求。\n\
  \n#### 7.3 大数据运输与城市配送\n\n目前，中国城市物流缺乏整体系统规划，城市物流配送路线混乱。此外，城市限行、交通拥堵及客户需求多样化，导致当前城市物流效率相对较低。庆幸的是，随着互联网和信息技术的飞速发展，大数据运输将能够改变传统城市物流行业。\n\
  \n12 月 16 日上午，义乌市首个公共物流信息平台“墩达配送”正式投入运营。墩达配送是由义乌市墩达供应链管理有限公司自主研发的城市公共物流信息平台。该平台支持在线下单、在线接单、在线结算、在线查询等功能，实现了从发货到签收全过程的信息化管理。它对配送车辆实施统一调度，运行轨迹清晰，充分保障了货物配送的时效性和安全性。同时合理整合社会车辆，实现共享配送，提高了车辆利用率和实际载货率。^(1)\n\
  \n城市物流缺乏整体规划，会导致不同企业物流设施重复投资和巨大浪费，制约资源的有效利用与整合。同时，各物流企业基于自身利益，自行规划物流中心和配送路线，不共享物流数据，致使无法在宏观运输层面形成最优配送体系。此外，移动互联网的发展也使城市物流客户需求趋向定制化。许多客户希望能从多方面、多角度随时掌握物流信息并全程掌控。\n\
  \n针对这些情况，应从以下视角运用大数据技术予以解决。\n\n##### 7.3.1 政府牵头建立城市物流资源共享平台\n\n在主管政府部门领导下，建设城市物流资源共享平台。政府应对本地物流资源进行有效配置，并在城市配送过程中实施监控。这样不仅能实现本地经济增长，还能充分利用物流配送中获得的大数据，实现城市物流乃至更多行业的统筹规划与管理。当然，对政府而言，直接寻求城市物流企业合作，并完成物流大数据的提取、采集与管理，是一个颇具挑战的目标。\n\
  \n##### 7.3.2 行业联盟建设共享平台\n\n在政府主导下，可建立涉及物流公司和企业的城市物流配送行业联盟。因为物流行业企业掌握城市物流的一手信息，行业联盟建设信息资源共享平台，可解决物流大数据的来源问题。同时，行业联盟将所有数据和信息存储在同一数据库中，便于物流节点间即时共享和信息交换，避免交通拥堵、物流运作混乱、客户满意度低等问题。\n\
  \n##### 7.3.3 重视城市物流仓储平台建设\n\n为建设城市配送资源共享平台，需利用大数据支撑城市物流仓储平台。城市物流仓储平台是影响城市配送效率的重要因素，其基础包括仓储中心、调度中心、结算中心等。通过该平台，对所有人力资源、物力资源、物品流向、配送速度、配送成本等所有配送渠道进行综合分析，从而计算最佳选址和配送方案，优化资源配置（见图\
  \ 7.1）。\n\n\n\n\n一句话总结，解决城市配送问题的最佳途径是：以政府部门牵头、物流企业参与、专业公司提供技术的大数据交通技术为核心，构建城市配送信息共享平台。\n\
  \n![image](img/fig7.1.jpg)\n\nFigure 7.1 Logistics truck.\n\n#### 7.4 大数据交通与快递物流\n\
  \n目前，快递物流已渗透至人们生活的每一个角落。毫不夸张地说，快递服务的质量往往直接影响我们的生活体验。面对电商行业的持续升级，快递物流企业也需主动转型升级，利用大数据技术从同质化竞争转向多元化竞争。\n\
  \n2017 年 5 月 31 日，顺丰与阿里旗下菜鸟网络的互联网纷争公开化。菜鸟发布声明称收到顺丰关于暂停丰巢数据接口的通知。随后，顺丰先后关闭了菜鸟丰巢自提柜的数据接口及淘宝平台全链路的回传物流信息。6\
  \ 月 1 日，阿里巴巴宣布建议商家暂停使用顺丰发货。\n\n然而，顺丰发布的声明截然不同。顺丰称：5 月菜鸟因数据安全原因停止与丰巢合作，并于 6 月 1 日\
  \ 0:00 下线丰巢接口信息，随后阿里巴巴集团平台将顺丰从物流选项中移除。\n\n电商与快递巨头为何因数据产生冲突？事实上，商业矛盾的爆发反映出：在大数据交通时代，中国快递物流企业极有可能凭借数据资源价值，完成行业内外的整合与推广。\n\
  \n事实上，尽管中国快递服务企业的业务量快速增长，但看似良好的局势下暗藏危机。由于竞争模式从规模战转向价格战，叠加人工成本高企，快递业务毛利率开始大幅下滑；同时还面临京东、苏宁等电商跨界企业的竞争。因此，快递企业必须尽快利用大数据资源配置，扩大竞争优势，提升市场影响力。\n\
  \n##### 7.4.1 快递物流中电子面单的应用\n\n电子面单是一种高效、环保的信息面单。区别于传统快递的三联单、四联单，电子面单由计算机打印，带有二维码标识，背胶设计便于粘贴和撕毁。\n\
  \n有了电子面单，快递系统可在海量包裹中轻松识别、处理和派送单个包裹。通过电子面单支撑的数据流，企业自有电子面单系统可自动连通寄件人、快递企业、收件人、干线与支线的所有数据信息。依托海量大数据连接，企业可优化快递环节。\n\
  \n目前，主流国内快递企业均已基本完成电子面单普及，表明大数据技术已成为快递物流企业的标配。\n\n##### 7.4.2 大数据路由分拣的应用\n\n大数据路由分拣技术通过海量地址大数据分析与互联网地图空间定位技术相结合，可直接完成包裹与网点的精准匹配。目前该技术应用准确率超\
  \ 98%，随各快递物流企业大数据沉淀加深，准确率将快速逼近 100%。\n\n引入该技术前，全国海量包裹须先集中至企业分拨中心，按发货地址分类，再分发至下一级网点。此过程需要大量分拣员流水线作业，他们需肉眼识别包裹地址，凭记忆判断下一站网点。采用大数据路由分拣技术后，分拣速度可降至\
  \ 1-2 秒/单，仓储分拣效率大幅提升。\n\n目前，大数据路由计算可确保下单生成后快速推送至派送网点。该技术普及有助于快递企业预测网点派送量。\n\n此外，依托大数据路由计算生成的四级地址库，快递企业可第一时间将消费者收货地址匹配至结构化的乡镇街道。借助这些结构化地址信息，快递企业能精准定位收派地址，为快递员提供更精准的派送与路线规划。\n\
  \n##### 7.4.3 意外情况管理的大数据技术\n\n快递企业运营压力主要源于意外情况。其中最棘手的包括：无法正常派送的异常包裹，以及派送压力激增的高峰期。\n\
  \n超时异常包裹指超过 48 小时未送达的快递包裹。通过大数据技术，可有效筛选这些包裹及订单数据，帮助快递物流企业及时掌握超时异常包裹数量及最严重网点；通过订单数据及时洞察原因，从而针对性改进。\n\
  \n包裹量激增通常集中于节假日、双十一、双十二等电商消费高峰期。通过物流预警系统，利用大数据提前预测包裹量，指导电商商家备仓发货，助力快递企业调配有限运力资源。\n\
  \n除上述应用外，快递大数据技术还能助力电商企业管控网购末端环节。通过对物流订单流转数据的全程监控，电商平台管理者可获取数据，识别“刷单”、“买好评”等虚假订单，实现对商家的有效管理。\n\
  \n目前，大数据已广泛应用于快递业务。未来，随着大数据交通环境日趋成熟，该技术将更全面渗透至快递业务各环节，成为快递物流行业的重要组成部分。\n\n#### 7.5\
  \ 大数据交通与冷链物流\n\n随着物流行业持续发展、科技不断进步及制冷技术飞速增长，以冻结技术为基础、制冷技术为手段的冷链物流日益受到市场重视。因物质生活持续丰富、消费者对食品安全关注度提升，冷链物流广泛应用于农产品、肉类等产品的配送。\n\
  \n\n\n\n\n##### Integration of China's Cold Chain Logistics and Big Data Technology\n\
  \nOn the other hand, China's current cold chain logistics system is not yet fully\
  \ mature. During the logistics distribution process, the problems of high loss rates\
  \ and low circulation rates have not been completely resolved. How to apply big\
  \ data technology to cold chain logistics, achieve the integrated development of\
  \ cold chain logistics, and thereby grow and strengthen the cold chain logistics\
  \ industry has become an urgent task.\n\nOn September 10, 2016, the China Cold Chain\
  \ Logistics Intelligent Cloud Platform was officially launched in Zhenjiang, marking\
  \ the official market operation of the country's first intelligent cloud platform\
  \ for cold chain logistics based on big data and IoT technologies, integrating functions\
  \ such as online display and transaction, cold chain logistics orders, and cold\
  \ chain warehousing.\n\nThis intelligent cloud platform enables intelligent monitoring\
  \ of cold chain logistics, online order matching, and online order transactions.\
  \ The platform effectively integrates upstream and downstream industry information\
  \ to achieve full-process monitoring of cold chain transportation. The Zhejiang\
  \ Data Monitoring Center can monitor temperature, humidity, GPS positioning, and\
  \ other information of cold chain transportation 24 hours a day. Once an abnormality\
  \ occurs during transportation, an alarm is received immediately and manual intervention\
  \ is carried out at the first opportunity, greatly improving the safety of cold\
  \ chain transportation.^(2)\n\nCurrently, many small and medium-sized cold chain\
  \ logistics enterprises operate independently, with relatively scattered business\
  \ models, poor product and logistics information flow, and numerous obstacles in\
  \ information transmission. Compared with developed countries, China's level of\
  \ big data technology application in the field of cold chain logistics is relatively\
  \ low and still in its infancy.\n\nSpecifically, the lack of a data collection system\
  \ is a serious problem in the application of big data technology in cold chain logistics.\
  \ In addition, the market and government departments collect data on cold chain\
  \ transportation of agricultural products relatively independently, relying heavily\
  \ on traditional manual operations and lacking automatic collection means and methods,\
  \ resulting in data that is not sufficiently accurate, objective, or timely.\n\n\
  Therefore, it is necessary to promote the combination of big data transportation\
  \ technology and the cold chain logistics industry, so that logistics enterprises,\
  \ cold chain product suppliers, consumers, and government regulatory departments\
  \ can view transportation information, product information, consumer information,\
  \ and weather information through big data.\n\nThe specific methods are as follows:\n\
  \n###### (1) Establishing a Cold Chain Product Traceability System Using Big Data\
  \ Technology\n\nProducts transported via cold chain are mostly agricultural products\
  \ in a broad sense, including fresh products, fruits and vegetables, crops, etc.\
  \ It is necessary for the cold chain industry to establish a big data platform for\
  \ information traceability, use IoT technology to collect data sources, and establish\
  \ an intelligent traceability system. This can form a complete intelligent information\
  \ traceability network, ensuring the quality and safety of cold chain products during\
  \ transportation.\n\nFor example, cold chain products should be equipped with location\
  \ data, manufacturer data, production cycle data, distribution data, etc. In this\
  \ way, big data can be used to manage the entire circulation process of cold chain\
  \ products.\n\n###### (2) Comprehensively Coordinating Cold Chain Logistics Transportation\
  \ Using Big Data Technology\n\nCurrently, many regions have adopted monitoring technologies\
  \ such as IoT, GPS, and intelligent on-board terminals, and through the movement\
  \ and processing of big data, have comprehensively improved cold chain logistics\
  \ efficiency.\n\nFor example, establishing a vehicle identity authentication system\
  \ can reduce the operational risks of cold chain distribution centers and third-party\
  \ logistics companies. Another example is achieving full-process visual monitoring\
  \ of cold chain distribution vehicles—from vehicle operating speed, product status,\
  \ to driving routes and driver status—realizing full-process visual monitoring,\
  \ thereby achieving reasonable vehicle scheduling, management, and supervision.\n\
  \nMore importantly, the cold chain logistics transportation system can monitor vehicles\
  \ in real-time via GPS to ensure the ability to check whether the vehicle is smoking\
  \ and whether the temperature and humidity meet product storage and transportation\
  \ requirements. Through the intelligent on-board system, technical parameters of\
  \ refrigerated trucks (such as documents, drawings) can also be transmitted to the\
  \ enterprise monitoring center in real-time. Both product consumers and enterprises\
  \ can view relevant parameters via the Internet.\n\n###### (3) Ensuring Timely and\
  \ Accurate Adjustment of Back-end Operational Strategies\n\nThe timely introduction\
  \ of big data ensures that cold chain logistics enterprises can obtain integrated\
  \ real-time data at any time when researching strategies, and obtain accurate and\
  \ fast query results through the query and processing of unstructured data.\n\n\
  At the same time, in the cold chain logistics industry, the most important characteristic\
  \ is the guarantee of timeliness. Due to the particularity of cold chain logistics\
  \ distribution products, such as uneven supply sources, typical seasonality of various\
  \ products, and bumper and lean production cycles, the costs and risks of cold chain\
  \ logistics enterprises have increased significantly. Using big data technology,\
  \ the operational strategies of cold chain logistics enterprises can be adjusted\
  \ through existing data distribution patterns, providing support from both internal\
  \ and external aspects. In addition, enterprises can obtain the most needed data\
  \ in a timely manner to formulate precise deployment plans, including obtaining\
  \ maintenance costs, failure frequencies, operational routes, etc.\n\nThe integration\
  \ of existing cold chain logistics enterprises with cloud computing, big data, mobile\
  \ Internet, and other technologies has become an inevitable trend. It can be assured\
  \ that the application of big data technology in cold chain logistics has unlimited\
  \ development potential. Big data transportation services and cold chain logistics\
  \ will jointly usher in broad development prospects.\n\n#### 7.6 Big Data Transportation\
  \ and Multimodal Transport\n\nMultimodal transport refers to a logistics transportation\
  \ process completed by the connection and transshipment of two or more modes of\
  \ transport. With the development of the national economy, vigorously developing\
  \ multimodal transport is a key task for comprehensive transportation development\
  \ during the \"13th Five-Year Plan\" period. Strategically, it is an important focus\
  \ for China to promote supply-side structural reform in transportation; from an\
  \ enterprise perspective, it is an effective way to reduce logistics costs.\n\n\
  In the process of strategic innovation in multimodal transport development, various\
  \ regions have currently shown an important leap toward big data transportation.\n\
  \nOn May 19, 2017, the Zhengzhou Airport International Logistics Multimodal Transport\
  \ Data Trading Service Platform was officially launched. The launch of this platform\
  \ realized information sharing between domestic highway, railway, seaport, and other\
  \ transport modes and the full-process transportation chain of international aviation\
  \ and overseas land transport, guaranteeing the formation of information linkage\
  \ in areas such as Zhengzhou Airport, the Pilot Free Trade Zone, and bonded parks.\n\
  \n\n\n\n就政府而言，郑州市相关部门表示将提供一站式信息服务，实现物流企业信息服务“只进一扇门”。此外，他们将依托龙头骨干企业，建设涉及多式联运企业的互联网数据交互平台，以持续释放大数据资源红利。\n\
  \n在多式联运过程中，建设大数据平台相当于为多式联运所有参与者植入“中枢神经”。在已建成应用的多式联运综合信息平台上，大数据运输技术建立了订单信息平台、箱管理信息系统和公路物流系统等分支系统，可实现对车辆、集装箱、货物的全程信息监控。\n\
  \n##### 7.6.1 铁路供应链中大数据的应用空间\n\n铁路货运在多式联运中发挥着重要作用。大数据技术对铁路供应链转型的支撑也需要拓展更多空间。事实上，互联网、大数据、云计算等科技手段能让铁路货运凭借其原有优势，寻找新的改进机遇。\n\
  \n目前，铁路货运在多式联运中仅扮演承运人的角色，其揽货优势在于运费低廉和距离终端客户较远。铁路货运利用其他物流运输渠道的能力不足，无法与公路、水路、航空运输资源顺畅共享数据。\n\
  \n因此，铁路货运必须善用大数据优势，通过有效推广集装箱多式联运构建自身独特的数据资产。然后，根据多式联运运营模式，实现上下游物流企业的数据共享与融合，完成跨界融合。最终，可实现大数据资源的有效变现。\n\
  \n##### 7.6.2 多式联运路线的优化与调度\n\n在多式联运的物流配送过程中，企业最关心的是产品质量和运输速度。为保证产品质量并降低运输成本，企业必须持续优化和调度路线。\n\
  \n通过多式联运车辆内部的感应系统，在装卸产品时，车载系统可将产品上传感器的数据信息上传至服务器。服务器接收数据后，可实时分析车辆和产品信息，并根据实际运力、客户偏好和配送路线数据进行动态计算，从而获得最新最优路线。随着数据的沉淀和技术的进步，可结合\
  \ GPS 定位系统与路况情况进行实时更新。\n\n从宏观角度看，远程控制系统也可通过大数据分析，在多式联运过程中获取剩余配送时间，以便及时通知客户提货。因多式联运是一个连续过程，环节断裂易导致整个系统失效。因此，必须利用大数据实现从生产厂家到客户的整体联动，将破损率降至最低，将等待时间减至最小，节约物流企业成本，提高配送效率。\n\
  \n##### 7.6.3 大数据推动集装箱多式联运的改进\n\n标准化集装箱是多式联运的基本单位和运作基础。然而，在我国公路运输和铁路运输中，集装箱利用率相当低，制约了多式联运的发展。\n\
  \n针对集装箱多式联运的现有困境，集装箱单元细分将能采用尺寸更小、适合小型配送车辆的运输标准。相应的管理也必须利用大数据提高效率。在集装箱多式联运新模式下，大数据、传感器、云计算等技术手段可实时采集、获取和分析海量信息，并通过各类通信终端平台实现新型集装箱内的配置平衡。这样可大幅降低设备建设和运营的高昂成本，提高多式联运业务占比。\n\
  \n通过大数据技术的应用，多式联运流程可持续优化。未来，将能实现多式联运箱管理参与方（如货代、报关企业、铁路、港口、监管场站等）关键数据信息的同平台互联互通，从而实现全流程电子化作业和全环节实时跟踪，提升整体物流效率。\n\
  \n#### 7.7 大数据运输与跨境物流\n\n在全球化背景下，跨境电商蓬勃发展。然而，由于跨境物流存在海关监管等环节，加之各国政策、法律环境、商业环境、文化环境、支付方式、税收政策和汇率制度不同，跨境物流的复杂性显著增加。\n\
  \n鉴于此，跨境物流引入大数据运输系统的关键性已迫在眉睫。\n\n2017 年 12 月 20 日，“共享仓”跨境生态服务平台正式上线。该平台可为跨境物流海外仓出口提供专属服务。在跨境物流通关服务领域，利用大数据、云服务、互联网等新服务技术，挖掘海外物流仓储等闲置资源，创造跨境物流共享经济模式。\n\
  \n通过“共享仓”服务，外贸企业可实现跨境物流上下游企业间的数据互联与共享交互，从而解决中国跨境出口企业面临的物流瓶颈。\n\n事实上，跨境物流的运输流和信息流已实现实时联网。跨境物流模式具有自身特点，因此数据碎片化现象始终存在。此外，跨境物流的个性化需求日益增长。快速、高效、安全、个性化的跨境物流解决方案离不开大数据、物联网和云计算的结合。\n\
  \n以下是跨境物流未来可通过大数据技术获得的推广方向：\n\n\n\n\n##### Cross-border Logistics Big Data Application\
  \ Strategies\n\n###### (1) Establish a Unified Cross-border Logistics Big Data Platform\n\
  Currently, there is an urgent need to form a unified cross-border logistics big\
  \ data platform. Led by government departments, this platform develops and integrates\
  \ enterprise resources to form fourth-party logistics services, thereby building\
  \ smart cross-border logistics. This is an important way to solve the problem.\n\
  \nFor example, on December 26, 2017, at the China-Myanmar Border Economic and Trade\
  \ Fair, the construction of the Southeast Asia Smart Logistics Big Data Center was\
  \ officially launched, reflecting the future development direction.\n\nOn the new\
  \ cross-border logistics big data platform, a full-service chain should serve as\
  \ the platform to integrate various resources, thereby providing cross-border logistics\
  \ data information and value-added data service chain solutions.\n\n###### (2) Establish\
  \ a Cross-border Logistics Big Data Information Center\nCurrently, China is conducting\
  \ economic and trade exchanges with surrounding countries and regions. In this process,\
  \ the production, warehousing, and transportation of goods generate massive amounts\
  \ of data. Among them, the variety of data types, uncertainty in management between\
  \ data and models, diversity of logistics objects, and the advancement of data collection,\
  \ analysis, and processing tools are all characteristics that traditional technologies\
  \ cannot fully cope with. Therefore, establishing a cross-border logistics big data\
  \ information center requires focusing on the collection, cleaning, integration,\
  \ screening, and updating of data from all periods and links of logistics cooperation\
  \ among various countries and regions. Then, data mining technology is used to mine\
  \ the potential information in the data to realize data value-added. Finally, results\
  \ are presented in a visual manner to achieve precise guidance for improving cross-border\
  \ logistics service quality.\n\n###### (3) Build a Big Data Transnational Logistics\
  \ System\nThe construction of a cross-border big data information center is the\
  \ first step to realize a big data transnational logistics system. An intelligent\
  \ logistics system based on big data technology can enable the mutual integration\
  \ of online information and offline logistics, achieving coordinated development.\n\
  \nFirst, the accuracy of logistics information identification in the cross-border\
  \ logistics process should be improved through digital and visualization technologies\
  \ in big data.\n\nSecond, big data should be used to define the logistics resources\
  \ that need to be configured according to the expected logistics needs and conditions\
  \ of the service objects, thereby planning more efficient one-stop cross-border\
  \ logistics solutions.\n\nThird, big data technology, `GPS` systems, and Geographic\
  \ Information Systems (`GIS`) should be effectively combined to accurately obtain\
  \ real-time information on the location of goods during the logistics process. Furthermore,\
  \ `RFID` technology should be used to collect the status of goods at different time\
  \ points and locations in real-time. The aforementioned data and information are\
  \ shared synchronously with customers to facilitate the adjustment and optimization\
  \ of real-time logistics plans.\n\nIt is worth noting that cross-border logistics\
  \ carries certain risks. For cross-border enterprises using self-operated logistics,\
  \ products may become unsalable and pile up after entering the local market. In\
  \ this case, the cost of shipping products back to the home country is huge, leaving\
  \ only destruction as an option. However, with the help of big data analysis, enterprises\
  \ can effectively integrate big data, analyze global commodity demand and freight\
  \ information, and judge product market placement through data analysis results.\
  \ For example, big data technology can analyze regional product preferences by integrating\
  \ customer click, browsing, preference, review, and purchase data, thereby guiding\
  \ logistics operations.\n\n###### (4) Improve Overseas Warehouse Utilization Rate\n\
  Warehousing management and utilization efficiency are important factors affecting\
  \ logistics service levels. Many cross-border logistics enterprises are in a passive\
  \ position in overseas warehouse utilization due to a lack of data support. In fact,\
  \ the decision basis for setting up overseas warehouses depends on big data analysis.\
  \ Enterprises must conduct systematic analysis based on data such as their own business\
  \ scale, economic conditions of the trading country, and logistics orders, and judge\
  \ whether to lease or self-build overseas warehouses through direct results. Then,\
  \ based on data such as the economic conditions of the trading country, the number\
  \ of consumers, and the maturity of the transportation network, the optimal site\
  \ is selected.\n\nIn terms of intelligent management of overseas warehouses, big\
  \ data technology can integrate the scattered and extensive data resources of overseas\
  \ warehouses through data mining and analysis, constructing a logistics model of\
  \ unified collaborative management by the Internet and big data technology. Through\
  \ data analysis, integrated classification of goods in overseas warehouses is realized,\
  \ achieving integration of goods from warehousing, sorting, distribution to information\
  \ inquiry.\n\nThe application of big data transportation technology provides a new\
  \ service model for cross-border logistics. With the help of such services, cross-border\
  \ logistics can transform from traditional logistics to modern logistics and ecological\
  \ logistics, changing past empirical thinking, establishing data thinking, and enhancing\
  \ core competitiveness.\n\n#### 7.8 Big Data Transportation and Air Logistics\n\n\
  Air logistics refers to the efficient and effective circulation and storage of goods\
  \ from the supply place to the receiving place by air transport as the main mode\
  \ of transport to meet customer needs. The advantage of air logistics lies in its\
  \ multi-functional, integrated comprehensive services. The application of this logistics\
  \ mode can organically combine resources such as transportation, warehousing, loading/unloading,\
  \ processing, sorting, distribution, and information, thereby forming a complete\
  \ logistics supply chain.\n\nTherefore, domestic air logistics freight volume has\
  \ grown at an average annual rate of `26.8%`, and China has become the region with\
  \ the greatest potential for air logistics development globally. This situation\
  \ also provides broader space for the combination of air logistics and big data\
  \ transportation technology.\n\nAt 1:00 AM on January 1, 2017, Yuan Shunzhou, General\
  \ Manager of Shanghai International Airport Co., Ltd., announced that the \"Pudong\
  \ Punctual\" Airport Collaborative Decision Making System (`A-CDM`), jointly developed\
  \ by Shanghai Pudong International Airport and `VariFlight`, was officially launched.\n\
  \nWith the launch of this system, Pudong Airport operations officially entered the\
  \ era of \"Smart Operations,\" marking the application of big data in the production\
  \ field during the construction of a smart airport at Shanghai Pudong International\
  \ Airport, realizing the automation, visualization, and intelligence of operational\
  \ data.\n\nOver the years, different enterprises, airports, and airlines have accumulated\
  \ a large amount of logistics data. However, because many valuable data have not\
  \ been fully utilized, most of these data systems can only perform simple accounting\
  \ management and lack decision-making management functions. With the intensification\
  \ of market competition in the logistics industry, it is necessary to use big data\
  \ technology to conduct decision-making analysis on air logistics data, which is\
  \ conducive to improving cargo sources and enhancing economic benefits.\n\n\n\n\n\
  \n##### 大数据与航空物流行业的结合\n\n大数据与航空物流行业的结合主要体现在以下几个方面：\n\n###### 1. 有效管理预订服务项目\n\n客户对航空物流的期望首先基于能否尽快找到他们想要的承运人信息。航空物流企业可以通过移动网站、移动应用程序和社交媒体上的行为数据，以及这些数据的关联分析，为其自身服务创建个性化的产品和价格。\n\
  \n通过对预订服务项目的有效管理，航空物流公司可以确保客户快速获取所需信息，同时也能在发布信息后大大增加被预订的可能性。\n\n###### 2. 提升物流服务能力\n\
  \n事实上，航空物流也是大数据最早的参与者之一，在收集数据方面几乎没有困难。但在实践层面，它们必须有选择地抓取有用数据并将其转化为有用信息。\n\n例如，航空物流企业利用大数据了解客户需求，使客户能够根据自身需要选择货运出发地、目的地、价格、时间或担保优先级等条件，随后系统自动推荐最优的多式联运方案。这样，时间、路线、位置、历史支撑和销售价格就能清晰地显示在客户使用的终端上。\n\
  \n###### 3. 变革航运公司管理\n\n航空物流企业的运营与一般物流企业相同。因此，航空物流企业大数据挖掘与利用的目标需要聚焦于提高收入水平、降低成本和提升客户满意度。\n\
  \n例如，航空物流的收益管理是物流企业定价优化信息系统的核心，必须通过海量数据进行优化。同时，以大数据和云计算作为收益管理系统的辅助运营，是未来的必然趋势，以确保收益管理系统的作用得到显著提升。\n\
  \n从长远来看，在收集和预测天气信息、调度信息以及安全管理方面，航空物流企业的管理也离不开大数据和云计算提供的信息。正是依托这些信息做出的精准预算，才能保障企业业务的顺利运行。\n\
  \n可以说，在航空物流管理中，每个系统都需要海量数据支撑。各系统接入大数据运输系统后，其性能都将在不同程度上得到提升。未来，航空物流企业将在现有数据处理系统基础上整合建立大规模数据库，处理海量数据信息，提高运营效率，赢得更多客户。\n\
  \n#### 7.9 大数据运输与无车承运人\n\n无车承运人是全球物流行业最新兴起的分支。无车承运人无需拥有车辆即可承运货物。此类企业主要通过互联网等技术构建物流信息平台，对车辆、场站、货源等物流资源进行集约化整合和科学化调度。随着互联网的高效利用，无车承运人企业将成为中国产业发展的新趋势。\n\
  \n7 月 20 日，云南首家无车承运人平台——云南智慧运输正式上线。同日，云南物流联盟大数据交易中心同步启动。\n\n该平台是移动互联、大数据技术与货运物流行业深度融合的创新商业模式。在智能报价和智能调度方面，平台帮助货主更容易找到高性价比的承运商，而货运代理公司获得更稳定的组织货源。实际承运企业或货车司机在找货源、收运费、提高货运车辆利用率方面更有保障。\n\
  \n此外，线上平台还具备司机定位实时跟踪功能，这不仅为物流公司提供了全程运输轨迹的可视化数据，还提高了物流效率。^(3)\n\n无车承运人企业不仅促进了社会分工协作，有效提升了社会物流综合效益，还客观上推动了中国物流行业整体向智能化、服务化、协同化产业转型升级。在这一过程中，大数据运输系统自然发挥着重要作用。\n\
  \n##### 7.9.1 由大数据建立并保障的风控体系\n\n为了实现无车承运人行业的快速发展，除了政府和企业自身的监管运营外，还应努力规避风险、保障交易安全。因此，必须依托大数据信息技术来开发、建立并保障风控管理体系的有效运行。\n\
  \n借助大数据技术，无车承运人平台可以建立全程三方风控体系。事前，平台应建立严格的资质审核和身份认证机制，每位货主和承运商需预先缴纳保证金并录入数据库。事中，无车承运人平台扮演监管角色，让大数据技术负责全程运输过程中的过程管理监督、呼叫调度、跟踪监控、风险评估和大额货款结算。事后监管中，无车承运人平台还需与保险公司对接数据，创建相应的担保沟通机制。\n\
  \n##### 7.9.2 提升用户体验与粘性\n\n作为一种新型物流，无车承运人必须有效提升用户体验，才能获得市场份额的持续增长。因此，应充分利用大数据技术，使平台能够收集和处理具有多边性强特点的海量动态车源货源信息。在此基础上，还可结合某区域的天气、温度、社会状况等数据，通过平台上的复杂核心算法与定量信息相结合，获取该区域未来的需求数据趋势。\n\
  \n此外，平台还可通过大数据分析货主的历史发货时间、发货路线、类型、批次和用车情况，有效掌握货主的发货规律与需求，向货主推送货源预测和空车信息。\n\n相应地，平台也可分析承运商的历史发车频次、行驶路线、货物类型和批次，从而掌握承运商的偏好和流向，向承运商推送货源预测和推荐。\n\
  \n\n\n\n在此类数据分析下，无车承运企业将能极大地改变货主和承运商的物流体验。一方面，货主能获得快速、安全、低价的运力；另一方面，承运商可根据自身业务需求和路线偏好提前规划发车和路线，减少因中间环节造成的停留时间和绕行，并节省司机成本。\n\
  \n##### 7.9.3 对接公共平台 保障运输质量\n\n全国公路货运车辆公共监管与服务平台、公路货运车辆公共平台，是目前世界上最大的车联网，也是货运车辆数据采集、信息交换、第三方监管的产业公益平台。无车承运企业可对接该公共平台获取数据服务，以保障运输质量。\n\
  \n物流企业无车承运自主监控运输过程，是无车承运企业业务链条中的重要一环。通过大数据平台，企业可利用车辆实时位置接口、轨迹接口、进出场接口等硬件设置对接交通运输部公路运输车辆公共平台，及时发现运输过程中可能出现的问题。例如，车辆里程利用率、运输效率、成本控制等重要问题，应在第一时间主动规避。\n\
  \n在运力补充方面，承运企业也可通过向公路运输车辆公共平台提供车辆需求，挖掘入网车辆，通过车辆位置、轨迹分析、车辆画像、安全驾驶指数等数据指标及大数据核心算法，获取附近的优质车源。\n\
  \n未来，无车承运物流企业可利用大数据技术，进一步深化资源整合，获取全方位技术支撑与流程服务，从而在市场竞争中取得实质性进展，为中国物流业发挥积极作用与价值。\n\
  \n#### 7.10 大数据运输与物流成本\n\n同任何商业活动一样，物流也需要花费必要成本，包括企业在包装、搬运、装卸、运输、仓储、流通加工等一系列活动中所指出的人力、物力、财力资源。\n\
  \n事实上，物流成本的核算相对复杂。这是因为许多物流成本是隐性的。如何计算物流成本取决于核算范围和方法。要有效管理、控制甚至降低物流成本，企业必须运用大数据运输的视野和方法。\n\
  \n在 2017 年 12 月 11 日举办的新一代全球物流峰会上，京东物流 CEO 王振辉表示，通过运用大数据技术，京东打造了覆盖仓储、分拣、运输、配送、客服全供应链的无人智能物流体系。2012\
  \ 年，京东库存周转天数超过 30 天。到 2017 年，尽管京东日均订单量增长了 8 倍，库存周转天数仍维持在这个数字上，远低于行业平均水平。通过这种智能物流体系，京东将把农村物流成本降低\
  \ 50%–70%。\n\n王振辉表示，随着大数据、云计算、人工智能在物流领域的应用，也将带来物流成本的进一步降低，从而实现企业运营效率的显著提升。\n\n事实上，物流成本不仅是企业需要面对和解决的问题，也是政府和社会应当关注的领域。贫困偏远地区之所以欠发达甚至落后，在于其承担的物流价格远高于一线城市和重点城市。如果有效降低物流成本、减低物流价格，将直接带来更多就业机会和商机，从而带动这些地区脱贫致富、发展经济。\n\
  \n那么，如何利用大数据运输有效克服自然地理条件障碍，进一步降低物流成本？\n\n##### 7.10.1 规划层面的有效成本节约\n\n我们以家庭物流和超市配送为例。长期以来，这类\
  \ 30 公斤以内的城市配送主要依靠人工规划和执行。许多企业一直选择人工排班，包括核算需要多少车、路线、人力、工时。即使是经验丰富的调度员，也不一定能保证制定出的物流方案完美无缺。结果导致车辆满载率不稳定，资源浪费时有发生。\n\
  \n基于大数据，智能调度平台可依据优化算法进行精准计算。在最短时间内形成科学的调度方案，为不同配送场景生成不同的配送方案。\n\n显然，这种方案形成模式不仅节省了人工调度时间，还保障了配送过程的科学性，避免了浪费。\n\
  \n##### 7.10.2 制造企业物流成本核算方法的优化\n\n物流成本管理不仅涉及物流企业，也涉及作为客户的制造企业。对后者而言，其传统核算体系难以存储、转换、处理大量物流成本相关信息，尤其是一些隐性成本，更容易造成成本流失。\n\
  \n在基于大数据技术的云核算平台上，通过云技术构建的制造企业物流成本管理模式，能有效采集、处理、分析制造企业交易活动中产生的物流信息，解决数据挖掘需求并处理这些物流成本相关数据形成结果，为统计核算提供数据支撑。\n\
  \n##### 7.10.3 挖掘配送客户潜在需求 实现战略延伸\n\n大数据技术的战略意义在于对掌握信息的专业化处理和价值挖掘。在物流大数据技术应用中，我们可以发掘客户的潜在需求，如预测产品销售类型和数量，分析市场中长期发展。\n\
  \n随着大数据在物流行业应用的逐步深入，物流行业未来获得和使用的数据来源不仅局限于狭义的物流行业内部，还包括大量外部信息。通过这些数据的共享，物流企业将能为每一位客户寻求定制化服务。通过这种变革，我们可以在宏观层面降低共性物流成本。\n\
  \n\n\n# 大数据交通与交通规划\n\n当前，物流成本是全社会关注的问题。只有充分发挥大数据交通技术的神奇作用并分析问题，才能不断突破原有的技术和管理障碍。事实上，这已成为一个利国利民的重要课题，值得每一位物流从业者和每一家物流企业投入。\n\
  \n[1] 《义乌商报》2017 年 12 月 17 日报道，记者吴凤宇。\n\n[2] [光明网](http://guangming.com)2016 年 9\
  \ 月 12 日报道。\n\n[3] [云南网](http://yunnan.com)2017 年 7 月 20 日报道，记者赵刚。\n\n#### 8.1 大数据交通与路线规划\n\
  \n城市发展速度加快。如何利用大数据规划公共交通路线，是解决城市交通拥堵、提高交通效率的重要手段。借助大数据的云计算能力，路线规划更加合理精准，从而有效提升公共交通服务。\n\
  \n##### 8.1.1 传统路线规划存在的问题\n\n对于城市交通而言，路线规划是基础。只有建立完善的路线规划方案，才能为后续的网络线路详细规划、道路规划、枢纽规划等奠定基础。路线是交通的大背景。大背景规划清晰完善，小分支的网络线路、节点与枢纽才能呈现多点分散、合理交叉的目的。\n\
  \n2008 年后，中国汽车保有量急剧增加，给城市交通带来巨大挑战，而大多数城市在规划以往交通路线时往往未能预见这一点。因此，中国大多数城市交通存在以下问题：\n\
  \n1. **网络不合理。** 大多数城市的交通路线存在许多卡点、堵点，出口不畅。东西向、南北向贯通问题日益严重。特别是一、二线城市，许多公交线路需要穿越市中心和居住区，加剧了道路交通矛盾。以往的路线规划已无法满足当前需求。\n\
  \n2. **道路功能混乱。** 在同一条道路上，功能定位往往非常混乱，包括商铺、医院、学校、商场、写字楼和酒店，导致交通干扰问题非常严重。与欧美国家大多数道路功能定位非常清晰相比，虽然车辆数量也很大，但拥堵问题不如中国严重。道路无法发挥作用，路线规划存在明显漏洞，是影响交通质量的重要原因。\n\
  \n传统交通路线规划出现此类问题的原因在于，以往的方法基于“四阶段”法。“四阶段”法诞生于 20 世纪 60 年代。它基于大规模的城市居民出行调查，通常每 5-10\
  \ 年进行一次，抽样率低，往往在 2%至 5%之间。由于周期长、抽样率低，精度有限，交通预测存在明显问题。\n\n在汽车未普及的时代，这种规划方法的漏洞不会暴露。然而，随着汽车时代的到来，“四阶段”规划方法的问题日益凸显，最终导致城市频繁出现交通问题。\n\
  \n##### 8.1.2 大数据交通规划的新模式\n\n大数据技术的持续发展为城市交通路线规划带来了新变化。通过车载数据设备、智能手机设备和智能监控设备的使用，所有数据不再孤立，开始有效整合。因此，居民出行的大样本甚至全样本数据得以有效采集，可对城市交通发展趋势做出实际判断。\n\
  \n大数据的特点在于通过计算机数据库方法进行数据统计，在效率和准确性上远超人工统计方法，从而实现持续观测和分析的目的。传统交通规划的数据分析模式是“开环”，影响最终调查数据的因素过多；而大数据将形成“闭环效应”，所有信息将在数据库中进行统计分析，因此数据更准确，可促进城市交通可持续发展。\n\
  \n面向交通规划的大数据，是通过更丰富的采集手段实时捕捉城市交通系统运行状态，从而为交通规划、诊断和区域协同控制提供有效数据量。\n\n1. **车联网技术。**\
  \ 车联网技术实现了车车、车路之间的信息采集，极大提高了道路利用的效率和安全性。\n\n2. **数据分析。** 除了实时监控，借助智能手机等设备，大数据技术将对出行者的行为习惯和交通需求进行持续数据分析，从而获取不同人群的交通需求，有助于制定针对性的交通需求管理政策，对道路进行针对性调整，促进道路交通资源的有效利用。\n\
  \n3. **社交平台数据统计。** 社交平台数据统计也能为交通规划提供支撑。社交平台包括微信、微博、QQ、贴吧等，是目前公众常用的平台。通过相关交通评价，规划部门可了解公众对交通政策措施的态度，从而制定相应规定，减少交通政策措施的不利影响。\n\
  \n##### 8.1.3 自贡大数据“交通大脑”建设\n\n大数据对路线规划的重要性日益凸显。因此，许多城市也在积极探索。例如，自贡的“交通大脑”就是大数据的柔性应用。\n\
  \n2017 年 12 月 25 日，《华西都市报》报道：\n\n> “2017 年，四川自贡投资 5000 余万元，全面升级自贡‘智慧交通’系统建设。自贡升级了交通信号控制系统，发布交通诱导系统，建设交通数据采集系统，解决了现有交通信号控制、交通流采集、交通诱导功能落后、数量不足、多头建设、缺乏维护等问题。同时，自贡整合各类路网交通资源，建设城市‘交通大脑’，挖掘海量交通数据，解构城市交通运行规律与特征，实现城市交通精准化、科学化、常态化管理，努力让群众出行更安全、便捷、高效”。\n\
  \n\n\n通过自贡大数据交通路线规划，我们可以看到大数据的应用不再局限于特定接收端，能够跨越行政区划限制，使全市交通规划呈现统一联动的局面，各部门能够有效协同（见图\
  \ 8.1）。\n\n通过整合不同区域、领域的“数据仓库”，发挥公共交通信息集成利用模式的作用，从而更全面地了解城市路网。同时，结合气象、城建、保险等部门的综合数据以及公交\
  \ IC 卡数据，能够有效获取城市交通分布，使路线规划更加精准有效。\n\n![Figure 8.1 2017 Zigong Dinosaur International\
  \ Marathon Traffic Organization and Security Command and Dispatch](img/fig8.1.jpg)\n\
  \n**Figure 8.1** 2017 年自贡恐龙国际马拉松交通组织安保指挥调度。\n\n*来源*：自贡交警。\n\n#### 8.2 大数据交通与网络线路规划\n\
  \n网络线路规划直接决定城市交通的拥堵状况。由于过去交通规划模式存在明显漏洞，城市网络线路规划不合理，死胡同过多、路口不平衡，城市拥堵问题日益严重。大多数城市面临网络线路拥堵问题，通常采取拓宽道路、增加里程的方法。虽然这些方法短期内能缓解问题，但长期来看无法有效解决城市拥堵。同时，投入过多的人力、物力、财力资源，引发民众不满。有些城市一年内对同一街道反复拆修，不仅未能有效实现网络线路规划目的，反而加剧了网络拥堵。\n\
  \n因此，必须引入大数据技术，以有效提升网络线路规划能力，进一步增强城市交通承载能力。\n\n##### 8.2.1 大数据技术对网络线路规划的意义\n\n网络线路规划对城市路线更为详细，不仅涉及交通部门，还涉及城管、城建等部门。大数据技术的应用在于对各部门数据进行有效统计和细化，形成完善的交通预测模型，有效模拟未来交通运行状态。特别是针对网络线路，是否会发生频繁车辆碰撞、周边是否有学校等，都将进行有效统计和预测，从而为网络线路规划提供指导和建议。\n\
  \n(1) **关注全量数据**。对网络线路规划而言，全量数据的采集与分析是关键。单一绝对数值并不重要，只有结合周边数据点，网络线路设计才更有效。例如，某网络线路上有小学时，可快速有效采集该校区网络线路车辆数据，有效分析周边网络线路，在避开交通对学校影响的同时，利用周边网络线路分流，实现交通资源互补。\n\
  \n(2) **接纳混合数据**。大数据的特点是能采集海量数据以制定规律和未来趋势，这是传统数据统计模式无法比拟的。传统模式往往耗资巨大且依赖经验，但数据只能聚焦某个细节，如火车站前的车辆数据。数据过于单一，会给网络线路规划带来“欺骗性”，导致问题无法真正有效解决。\n\
  \n大数据可以接纳混合数据，包括基础车辆信息、天气、季节及周边具体环境。例如，某网络线路上有大型展馆，会有规律性车辆激增，网络线路设计将相应调整。只有从宏观角度接纳海量混合数据，才能在微观层面获得精准度，这是网络线路规划的关键。网络线路属于微观领域，更应重视宏观数据采集，结合多条网络线路周边信息，才能使规划合理。\n\
  \n##### 8.2.2 网络线路规划的完整性\n\n网络线路规划注重完整性，可有效融合不同属性街道的数据，通过大数据应用提升网络线路应用效率，实现与公共交通无缝衔接的整体运行，有效减少城市交通混乱和拥堵。\n\
  \n例如，针对公共交通网络调整，交通规划部门可利用大数据对周边居住社区、轨道交通干线、场馆设施进行有效统计，调整公交线路，体现“一路一线、便捷换乘”目的。这种网络线路规划可实现乘客进入网络线路后快速换乘到达任意地点，逐步将以往单一线路调整模式转变为区域整体调整新模式。大数据对网络线路规划的意义在于从整体出发，形成整体联动模式。\n\
  \n目前，上海的网络线路规划在中国最为成熟。借助大数据技术，上海公共交通显著改善。特别是网络线路规划采用分层模式，使公共交通成为解决城市交通的主体。\n\n“公交大都市”是上海未来交通导向。通过应用大数据信息技术，上海为网络线路设定拥堵等级，并采取相应管理模式。借助互联网实时信息发布，公共交通部门能第一时间获取相关数据。根据实际情况，公共交通部门将采取限制高速公路外地牌照、尽量限制高频拥堵区域道路外地牌照的模式，提高公共交通利用率。上海将进一步扩大运力。2015\
  \ 年，上海新建公交专用道 140 公里，原有 161.8 公里公交专用道基于大数据使用情况重新评估调整。\n\n\n\n\n上海网络线路规划的亮点在于“最后一公里”。几乎所有社区和街道都被纳入其中，居民可快速进入公交站点。在桃浦地区，通过大数据分析发现交通流量过大，因此开展了“微循环试点”。选用长度小于\
  \ 7 米的公交车，可直接驶入大型社区，有效避免了这些路段的拥堵。同时，进一步完善了轨道站点、医院、学校、社区服务中心的出租车接驳点和共享单车停放点，并合理规划了半径服务和网络线路。\n\
  \n将网络线路规划模式从过去的单一模式升级为整体模式，并以大数据形式融合网络线路，是解决城市交通问题的关键。我们应研究该区域网络线路的特征，哪些街道交通流量过大，哪些街道适合应急分流，使整个区域的交通运行有序。\n\
  \n#### 8.3 大数据交通与道路规划\n\n道路规划涉及交通规划的细节。线路规划和网络线路规划从宏观视角出发，通过捕获大流量大数据探索区域规划特征；而规划道路时，应聚焦细节以解决道路实际问题。\n\
  \n##### 8.3.1 传统道路规划的弊端\n\n传统道路规划往往由设计部门凭借经验和现状进行快速判断决策。通常设计院有一位资深设计师担任负责人，因此容易出现个人意志和团队意志主导操作的问题。甚至有较小的设计单位盲目行事，采用“复制手段”进行道路规划，导致问题更加严重，完全不符合当前“互联网+”大数据应用的需求。\n\
  \n一个简单的例子最能说明问题：\n\n> **某城市北部建有一工业园。每天早上，车辆明显向城市北部流动，同时下班时从城市北部返回的车辆显著增加。这是许多城市的“潮汐效应”。如果沿用过去道路狭窄、潮汐车道不足、红绿灯无法根据高峰时段智能调整的设计，迟早会造成严重拥堵，给交通管理者带来巨大麻烦。**\n\
  \n因此，在道路规划中，有必要通过大数据开展前期研究，例如利用电子警察和视频检测器收集的过车信息和交通流数据，找出该路段的规律，使道路规划更加合理。\n\n无论是交通车辆统计还是道路周边环境，传统规划都存在弊端。道路规划还需包含道路空间和景观设计。建筑、绿化、地面铺装、街道设施、户外广告、景观节点、停车场、照明及人类活动，均属于道路周边环境。过去这些信息的收集常采用人工观测，导致数据采集有限、数据结构简单、深度不足，无法为道路规划和改造提供有效数据支撑。\n\
  \n##### 8.3.2 大数据带来的道路规划新思路\n\n与传统道路规划模式相比，大数据技术的应用主要从以下视角改变道路规划思维：\n\n(1) **网络数据。**\
  \ 网络数据包括居民广泛使用的热点和 WiFi 数据，将记录用户的视频网站、物联网、微博、博客、播客或论坛等数据。这些数据可通过大数据平台有效展示热点图，分析人流量最大的地点。因此，在设置公交站点和出租车站点时，可有效精准定位，最大化资源利用。\n\
  \n(2) **传感器数据。** 新型交通传感器可有效感知道路环境并持续将数据回传平台。新型传感器可安装于街道建筑、街道家具、街道绿化、街道广告牌上，能快速捕捉道路变化并提供实时数据。因此，有了这些数据，红绿灯设置和立交桥规划便有了有效的数据参考。\n\
  \n##### 8.3.3 大数据给道路规划带来的便利\n\n借助大数据，可有效科学地改善道路规划，并带来最直观的视觉体验，使道路规划更便捷。同时，公众也可参与其中，进一步提升道路设计的实用性和交通便利性。\n\
  \n(1) **设计前期。** 在道路设计前期，主动引入大数据可让公众了解相关信息，从被动接收者转变为信息提供者。传统道路设计由设计师主导，公众参与度极低；而通过大数据平台，设计部门可通过官网和本地媒体公开信息，公众可为设计提供建议。例如，通过\
  \ APP 提供信息，公众可登录并根据智能手机中的大数据采集上传信息，为设计提供参考。借助大数据，设计师可有效筛选有意义和无意义的信息，最终影响道路建设成果。\n\
  \n同时，由于大数据的快速交换，电力、水利、燃气管线信息也将纳入大数据信息，使设计师能将这些内容纳入考量，避免因铺设管线导致道路反复拆修，有效避免道路拥堵问题。\n\
  \n(2) **设计后期。** 在道路设计后期，大数据也能发挥作用。大数据可直观、易懂地呈现道路建设成果，公众可及时反馈。例如，通过微信和微博发布可视化道路设计系统，向公众讲解相关功能特点供查询和发表意见。大数据将对这些信息进行有效统计分类，供设计师进一步参考，最终开发出兼顾交通需求和公众需求的道路设计。\n\
  \n\n\n\n\n###### 3. 智慧街道建设的支撑保障\n\n未来，智慧街道将成为所有城市的主流。智慧街道的特点是通过物联网智能感知设备集成云计算、移动互联网等技术，使道路不再是简单的道路，而是一条具备管理服务和智能服务的新型街道。同时有效缓解交通压力；道路的属性边界将得到有效拓展，实现主动、智能、贴心的服务。例如，当我们准备停车时，显示屏会立即显示停车场的位置和车位数量。这种智能化运作将极大地提高交通效率、缓解交通压力，而大数据是这些智能生活的核心基础。因此，大数据在道路规划中的应用将更加深入，充分实现城市智能化的目的。\n\
  \n#### 8.4 大数据交通与站点规划\n\n站点包括城市及其周边地区的各类公共交通上下客点，如公交站、出租车停靠点和路边停车场。将大数据引入站点规划，可有效完成交通资源配置，实现站点间资源利用，并减少交通部门的运营人力。根据大数据，将在地面主干道优化中发挥非常积极的作用，构建地面公共交通网络和多磨石（注：原文\
  \ \"multiple grindstones\" 疑为笔误，或指多磨合点/换乘节点）的客流组织方案。\n\n##### 8.4.1 大数据在主动停车系统中的应用\n\
  \n停车问题已成为城市普遍的交通问题，不仅影响出行时间，还因车辆无法快速找到车位而影响交通效率。因此，停车问题是站点规划中的关键问题。\n\n随着大数据的应用，停车系统将得到有效改善。其中，主动停车系统受到越来越多的关注。\n\
  \n所谓主动停车系统，是指大数据能快速捕获周边停车场信息并推送相关内容给用户。例如，当电子车牌具备 GPS 定位功能时，停车诱导系统将快速将车辆位置与附近停车场信息进行比对，并为车辆推送路线以预测到达停车场的时间。这样，车主可提前选择停车场或预订车位，实现快速停车的目的。\n\
  \n目前，辽宁沈阳已开始在这方面探索。在一定规模的停车场内，沈阳已开始实施停车诱导系统，在停车场设置 GIS 技术，并接入城市停车信息管理平台。此外，系统与移动终端集成，车主可快速查询数据、获取停车引导并缴纳停车费。通过大数据与云平台的结合，沈阳停车场纳入统一管理系统，解决了停车难问题。\n\
  \n同时，主动停车系统还可根据停车位置判断是否存在违规停车问题。一旦发生违规，相关信息将立即推送给车主，提示车主及时驶离。若驾驶员未在规定时间内离开当前区域，信息将发送给相关交警部门进一步处理。这样可有效避免因违规停车造成的拥堵，并有效利用周边停车场资源。\n\
  \n##### 8.4.2 大数据在公交站中的应用\n\n大数据应用于公交站，最基本的功能是信息预测与发布。目前，在呼和浩特、嘉兴等城市，已开展“智慧公交站台”建设。该平台的特点不仅能有效分类统计各公交信息，还集成了\
  \ GPS/北斗定位系统、3G/4G 通信技术、GIS 技术等。乘客到达智慧公交站时，可快速连接 WiFi 查询车辆运行信息和站点信息，如车辆到站前的站数和预计到达时间。有了这些精准数据，乘客可根据实际情况灵活调整，从而有效缓解公交站秩序，减少聚集人员和出租车，最终避免公交站周边的拥堵和交通压力。\n\
  \n“站点分流”只是大数据用于公交站的基础应用。它还能为公交站建设提供更丰富的数据和更精准的建议。目前，大多数城市正处于新城建设过程中。借助大数据，交通部门可有效采集各道路的人群信息。人口数据最集中的地方，公共交通需求最大。借助大数据，公交站建设将更加合理，既能满足大多数人的需求，又能避开拥堵路段。\n\
  \n##### 8.4.3 定制公交：大数据公共交通系统的应用\n\n与公交站应用相比，大数据对站点规划有了全新的尝试，彻底颠覆了传统公交站模式，即定制公交。\n\
  \n定制公交是中国近年来兴起的一种新型公共交通模式，主要服务于同一区域、同一出行时间和需求的人群。定制公交的特点是一人一座、定时快达，且行驶在专用公交线路上，因此时间成本更易控制。乘客通过专用手机\
  \ APP 填写出行信息后，信息可发送至公交集团进行分析，在定制公交平台招募乘客，最终按约定时间和目的地开行定制公交。\n\n这一系列举措离不开大数据的应用。大数据将组织乘客信息采集、定制线路发布和乘客反馈信息，为有共同目标的特定人群服务，在减少私家车使用的同时，有效优化路面、便利性和经济性。\n\
  \n目前，北京、成都、青岛、天津、大连等城市已开通“定制公交”服务，有效缓解了高峰期交通压力。因无需换乘，城市道路资源得到有效利用。北京公交集团统计显示，北京每天新增\
  \ 150–200 单，出勤率可达 90% 以上。特别是对于上班族集中的居住区，定制公交更受欢迎，有效提高了道路效率。这种站点优化可有效减少公交停靠站数，从而保证路面通畅和最小拥堵。\n\
  \n#### 8.5 大数据交通与枢纽规划\n\n\n\n\nTransportation hubs are crucial to transportation.\
  \ They connect different parts of a city and transfers between cities, serving as\
  \ the main arteries of urban transport, directly relating to the achievement of\
  \ speed and efficiency goals.\n\nCurrently, hub planning in many regions of China\
  \ faces serious problems. For example, Beijing's Xizhimen is located at the node\
  \ of the Northwest Second Ring Road and is a core of urban transportation. However,\
  \ because the Xizhimen Hub was built early, the design of the interchange, subway,\
  \ light rail, and bus stations is chaotic, road network connections are inconvenient,\
  \ and there are issues of chaos and congestion. The Xizhimen Hub is one of the most\
  \ severely congested road sections in Beijing and has failed to effectively fulfill\
  \ its hub function. Similar problems are reflected in many cities; therefore, re-planning\
  \ hubs with the aid of big data has become the current direction of development.\n\
  \n##### 8.5.1 Exploration of Big Data in Hub Planning\n\nGenerally speaking, transportation\
  \ hubs often bear tremendous traffic pressure including buses, subways, light rail,\
  \ roads, and even railways and airports. Therefore, in the preliminary survey of\
  \ hub planning, big data will aggregate this information, querying administrative\
  \ division functions, analyzing economic indicators along the line, the carrying\
  \ capacity of buses and subways, and the consumption potential of business districts.\n\
  \nIn the exploration phase, the purpose of big data is to continuously analyze data\
  \ to identify the characteristics of transportation hubs. For example, for buses\
  \ and subways, data can be effectively collected based on entry/exit station and\
  \ passenger boarding counts. The longer the exploration time, the more accurate\
  \ the samples, which is beneficial for future targeted construction. This is a pattern\
  \ that random sampling cannot obtain.\n\nThrough the use of big data, it can effectively\
  \ coordinate with transportation hub information, optimize the collaborative operational\
  \ capabilities of various departments, and make targeted adjustments according to\
  \ the principles of rapid response, flexible handling, and negotiated cooperation.\n\
  \nThe significance of big data transportation hubs lies in constructing multi-platform,\
  \ multi-channel travel modes. For example, the Guizhou High-tech Zone Big Data Intelligent\
  \ Transportation Hub Project includes the Huancheng Railway Baiyun Station, a light\
  \ rail transfer station, bus stations, and social parking lots, forming a variety\
  \ of comprehensive transportation platforms. This will have a positive impact on\
  \ surrounding traffic; all traffic scheduling is completed by the platform, solving\
  \ the situation of \"each fighting their own battle\" and effectively resolving\
  \ traffic problems.\n\nAt the same time, such transportation hubs often possess\
  \ landmark characteristics—solving traffic problems means an \"agglomeration effect\"\
  \ will rapidly emerge, forming a comprehensive platform and new urban complex projects\
  \ integrating commerce, hotels, shopping, and talent apartments. The application\
  \ of big data will continue to radiate outward from the transportation field, having\
  \ profound significance for the local economy and culture.\n\n##### 8.5.2 Intercity\
  \ Transportation Hubs\n\nWith the continuous development of urbanization, connections\
  \ between cities are becoming increasingly frequent. Transportation hubs are no\
  \ longer confined to the interior of cities, presenting a \"dual-city interaction\"\
  \ trend. Compared with urban transportation hub planning, intercity hubs require\
  \ the application of big data even more to achieve the goal of \"working in Beijing\
  \ during the day, living in Tianjin at night.\"\n\nTaking the \"Guangfo\" (Guangzhou-Foshan)\
  \ Transportation Hub as an example, one can see the role of big data planning in\
  \ intercity transportation hubs. Not only do Guangzhou and Foshan rely on big data\
  \ applications, but the Pearl River Delta has also formed a relatively complete\
  \ hub system, ensuring more convenient connections between cities.\n\n###### (1)\
  \ Subway Planning\n\nSubways feature speed, efficiency, and punctuality. Therefore,\
  \ in the construction of dual-city hubs, both Guangzhou and Foshan, through big\
  \ data analysis, regard the subway as the most important mode of transportation,\
  \ effectively connecting the core business districts and schools of the two places.\
  \ For example, Phase 1 and the West Extension of Guangzhou Metro Line 7 have a total\
  \ length of about 32 kilometers with 16 stations (10 in Guangzhou, 6 in Foshan),\
  \ connecting important areas such as University Town, Guangzhou South Station, Shunde\
  \ North Area, and Foshan New City.\n\nThis construction is precisely based on big\
  \ data analysis. Most of Guangzhou's rail lines are located in business districts\
  \ with commercial areas and office buildings, while Foshan consists mostly of residential\
  \ areas, meeting the demand for \"working in Guangzhou, living in Foshan.\" Compared\
  \ with other modes of transportation, the subway plays the most important role,\
  \ thereby effectively reflecting the hub function.\n\n###### (2) Bus Planning\n\n\
  In addition to the subway, the bus network is also a key hub between the two cities.\
  \ As of 2016, 67 cross-city bus routes had been opened between Guangzhou and Foshan,\
  \ achieving coverage of the Guangfo cross-city bus network and forming a new transportation\
  \ pattern of \"taking the Guangfo metro line as the backbone, Guangfo cross-city\
  \ buses as the main body, and other modes (such as taxis) as supplements.\" Thanks\
  \ to the effective application of big data, these routes can access roads with the\
  \ highest passenger flow demand, strengthening the connection between the two cities.\n\
  \nThe function of the Guangfo Transportation Hub has not only greatly alleviated\
  \ traffic inconvenience between the two cities but also effectively promoted the\
  \ flow of people, logistics, information, and capital. Data shows that by the end\
  \ of 2015, the cumulative passenger volume of the Guangfo Metro reached 240 million\
  \ trips, exceeding 10 times the total population of the two cities, and the exchange\
  \ of talent, information, and finance between the two cities has rapidly increased.\
  \ \"One industry thrives, a hundred industries flourish; traffic flows, a hundred\
  \ industries flourish.\" Huang Zhihao, Secretary of the Nanhai District Committee\
  \ of Foshan, commented on the Guangfo Transportation Hub in this way. Creating greater\
  \ economic significance on the basis of guaranteeing transportation has strong reference\
  \ significance for other city clusters.\n\nIn the future, transportation hubs will\
  \ not be limited to expressways and subways but will also include high-speed rail,\
  \ intercity railways, and aviation, forming a more three-dimensional hub model.\
  \ Therefore, hub construction should take the lead in introducing big data technology,\
  \ coordinate relevant data from various departments, carry out precise analysis,\
  \ enable each mode of transportation to play to its strengths, and truly reflect\
  \ the hub function. Just like the Beijing Xizhimen Transportation Hub, which actively\
  \ introduced big data technology in its new renovation to solve problems such as\
  \ dead-end roads, bottleneck roads, and interchange signage, striving to effectively\
  \ resolve the past chaotic situation at Xizhimen.\n\n#### 8.6 Big Data Transportation\
  \ and Capacity Planning\n\n\n\n交通运力与公众出行需求息息相关。运力规划是一项极具科学性的工作，尤其是大数据的应用，如哪些区域最需要公共交通车辆、哪些区域因车辆短缺导致等待时间过长、哪些道路运力饱和等，都需要通过数据来完成。没有大数据，运力规划只能停留在纸上谈兵。\n\
  \n目前，我国许多城市存在运力规划不完善的问题，导致民众频繁通过论坛、民生网站等渠道投诉。本应增开的线路迟迟不投入运营，乘坐公交和出租车难成为常态。一旦这些区域进入高峰期，便人满为患，不仅对道路安全构成巨大威胁，也造成公共交通资源的浪费。\n\
  \n事实上，许多城市运力不足并非真正缺乏公共车辆，而是运力未被最大化利用。洛杉矶研究院的分析发现，仅凭 16%–54% 的车辆就能实现更高水平的运输。当前，城市运力不足的症结不在于增加公共车辆，而在于通过捕获大数据优化运力，这是提升城市交通运力的关键。\n\
  \n例如，我国多地开展的“智能公交”，便是借助大数据对运力进行优化调度。依托定位技术和 GIS 技术，公交企业能有效掌握车辆运营情况，包括站点停靠时间、车上乘客数、站台候车乘客数、全市公交候车热力图等。通过这些数据，公交企业可及时调度车辆，使闲置运力的公交车迅速投入运力饱和路段，优化资源配置，有效缓解交通拥堵。因此，这种“智能公交调度中心”必将进一步普及，逐步渗透至三四线城市，甚至农村城际道路。\n\
  \n##### 8.6.1 综合利用大数据优化交通运力\n\n交通运力不仅包括公交，还涵盖地铁、轻轨、出租车，以及公交、出租车的空载率等。许多城市存在这样一种现象：某些时段公交、地铁、出租车的空载率过高，这也是运力配置不当、交通资源浪费的表现。\n\
  \n一旦接入大数据，此类问题将迎刃而解。例如，为避免高铁和飞机延误，多数乘客往往提前数小时赶往车站。因公交和出租车往往无法准时到达，路途耗时甚至超过高铁和飞机行程。应用大数据技术后，出租车公司可及时获取高铁运输部门和机场部门推送的信息内容，掌握乘客出行时间。随后，出租车公司可与交通信息平台交互，分析乘客出行的交通信息，并进行预测性接送。这样，乘客可通过手机\
  \ GPS 定位获取附近出租车信息，司机可规划最优路线抵达车站。这不仅节省了乘客时间，也提高了出租车的利用效率。\n\n该模式已在滴滴出行等平台得到良好应用，成为大多数人的首选。未来，基于大数据的运营优化将进一步深化，例如纳入公交系统，灵活判断路况，将闲置车辆调度至重点路段，提升运营运力，降低成本。通过传感器及时将路况信息告知驾驶员，数据可被有效采集利用，交通运行将更加合理。在不增加机动车数量的前提下升级运力规划，是未来城市交通发展的核心。\n\
  \n事实上，大数据对运力的优化推广不仅在城市地区，也在广阔农村地区开展。浙江余姚进行了有效尝试。2012 年，余姚开展城乡客运一体化改革并重新规划公交线路，但也暴露出许多问题。例如，部分公交线路日均载客率不足\
  \ 50%，甚至出现 612 路公交客流量为零的问题。\n\n2016 年，为解决公交运力明显漏洞，余姚交通部门借助大数据调整公交运力，对全市 105 条公交线路实际运营情况进行深度调研。经大数据分析建议，余姚公交运力得到重新校准。原\
  \ 632 路公交配备两辆运营车辆、10 个班次，调整为一辆并优化发车时间。结果显示，原载客率不足 30% 的 632 路公交未影响居民出行，却显著提升了运力。针对山区，余姚将发车时间和频次集中在早晚高峰，方便山区农民出行。通过此类调整，余姚公交公司一年节省运营成本超\
  \ 100 万元，运力却显著提升。每辆公交车都有自己的“作息安排”研究报告。\n\n因此，大数据可在运力规划中广泛应用。持续推进的智能公交变革，本质上是运力规划的调整与优化。利用\
  \ IC 卡开展大数据移动分析，根据不同路段、不同时段调整运力，将使城市交通运行更顺畅，降低运营成本，助力城市环境建设。\n\n#### 8.7 大数据交通与应急规划\n\
  \n2003 年，南京一市民上班前打开“智慧出行南京”APP，收到推送消息：其日常必经道路发生事故，建议绕行。凭借此预警，该市民选择新路线准时抵达单位。\n\n\
  此类场景并非科幻，而是现实。借助大数据，可及时识别突发事件并给出相应路线建议，这成为大数据交通应用的另一关键方向。\n\n任何国家都不可避免地会发生事故或其他突发事件。如何建立完善的应急规划方案，是考核公共交通管理的重要指标之一。过去，应急规划往往具有临时性、突发性特点，难以有效传达给公众，易引发摩擦矛盾，导致公众不理解治理举措。然而，在互联网时代，借助快速大数据，应急规划应更加成熟、前瞻和可传播，这是未来交通部门的责任。\n\
  \n##### 8.7.1 交通应急体系建设\n\n\n\n###### 大数据时代的应急体系建设与重大活动交通保障\n\n在大数据时代，应急体系的建立不再局限于公共交通部门，而应以交通部门为核心，同时通过网络系统与消防部门、公安部门、电力部门建立无缝连接，使大数据发挥实效，有效整合各类信息，实现应急数据的快速研发与发布。\n\
  \n应急指挥服务平台的建设已成为大数据应急规划的关键。该平台将发挥三大重要作用：事前监督预测、事中应急响应调度、事后总结归档。\n\n####### 1. 事前监督预测\n\
  交通指挥中心通过系统对各路段进行实时巡检，对拥堵路段加强自主监控，及时处理发现的隐患。数据平台将与其他部门共享数据，如某路段的房屋装修、消防演练等。预报信息将通过平台提前发送给公众，提醒公众绕行。\n\
  \n####### 2. 事中应急响应调度\n发生交通事故时，交通应急平台将立即启动应急预案，及时将事故现场情况传输至交通指挥中心，同时信息也可第一时间传输至医院和公安部门，做好应急救治和避免拥堵工作。\n\
  \n####### 3. 事后总结归档\n应急平台可有效记录各部门间的通联信息并保存图片。事故处理后，可对数据进行分类汇总，为今后处理类似事件提供依据。\n\n\
  上述所有工作都需要大数据支撑，包括城市路况判断、信息查询、各部门信息传输等。只有这样，大数据才能发挥作用，高效及时地处理事件，保障道路畅通。否则，事故发生时，若交通部门接收不到信息或医疗机构接收不到救治呼叫，势必会造成进一步的交通混乱，严重影响出行。\n\
  \n##### 8.7.2 大数据智能设备的应用\n\n应急规划的建立离不开各类设备的支撑。特别是大数据智能设备的应用，将从科技层面有效提升应急能力，改变应急规划的科学性。例如，传感器技术、通信技术和\
  \ GIS 技术的应用，将使数据采集过程更快，形成“采集、分析、建议同步”的效果。\n\n智能信号灯是典型应用。智能信号灯将自动捕捉路况调整周期，出现问题及时变换信号，现场拍摄抓拍，制定公交优先方案，缓解应急时刻的交通问题。\n\
  \n与传统信号灯相比，智能信号灯配备了车辆检测板，可有效采集周边车辆的流量、占有率、速度、排队长度等数据。一旦发生紧急情况，将根据交通流实际情况进行调整。这样，即使在紧急情况下，其他车辆也可按信号灯指示正常行驶，有序通行，保持道路畅通。\n\
  \n##### 8.7.3 应急机制运行模式\n\n针对交通应急，大数据必须是实时的，才能有效解决问题。因此，大数据平台必须稳定。一旦某街道发生事故，能有效处理信息，保证交通不拥堵。\n\
  \n同时，大数据智能设备的安装应在公共交通车辆中尽可能普及。特别是公交车，应制定全面升级计划，在一段时间内完成设备安装调试，真正实现数据采集。否则，数据无法形成一致性和连续性，不利于后续工作。虽然大数据智能设备会产生一定的财政支出，后期维护也需要消耗一定的人力财力，但从长远来看，其经济效益和社会影响无疑是巨大的。\n\
  \n特别是在预测方面，大数据应急系统应发挥重要作用。例如，针对大型活动和专项服务任务，大数据应第一时间采集周边信息，对可能拥堵路段提前发布预警，提醒市民绕行，对周边酒店入住、餐饮预订等信息进行有效统计，找出可能拥堵的时段，预估人流量，制定针对性方案。同时，还需与其他部门协作，做好应急保障物资准备，统一联动，真正发挥大数据预测作用，提前为可能发生的应急事件做好准备。\n\
  \n# 第九章 大数据交通与重大活动\n\n从奥运会到 G20 峰会，近年来中国举办的世界级重大活动越来越多，这对交通应急响应和指挥提出了更高要求。随着大数据的参与，重大活动的交通规划有章可循。即使发生紧急情况，大数据也能帮助交通管理者提前预测、合理化解。\n\
  \n#### 9.1 大数据交通与北京奥运会\n\n2008 年，奥运圣火来到北京，这是北京最重要的全球性盛会。备受全世界关注的 2008 年北京奥运会，在奥运期间接待了\
  \ 652 万境内外游客和 38.2 万入境游客，这无疑是对北京交通的巨大考验，也是首都形象的全面展示。\n\n那么，大数据交通是如何服务 2008 年北京奥运会的？有哪些成就值得未来大型活动借鉴参考？\n\
  \n##### 9.1.1 大数据设备应用\n\n针对奥运会，出租车是最重要的交通工具。北京奥运会大数据在出租车上的应用，也是中国首次全面尝试。2008 年前，北京五环路以内基本所有快速路均已完成\
  \ RBMS 流量计安装，可有效采集快速路路况。\n\n最大亮点来自出租车。2008 年奥运会开始时，北京所有出租车均已安装 GPS。交通管理部门可有效定位每辆出租车，及时追踪，高效解决问题。\n\
  \n此外，奥运企业中也已开始运行电子收费模式。北京奥组委与北京交通部门、中国移动、中国联通、中国电信的深度大数据合作，可有效识别车牌，快速解决交通事故，并及时存储备份这些数据。\n\
  \n\n\n\n\n##### 9.1.2 大数据交通的提前应对\n\n事实上，北京早已启动了大数据交通的应用。正是因为前期进行了大量测试，大数据才能在奥运会期间发挥有效作用。\n\
  \n(1) **智能公交。** 奥运会开始前，亿华录集团和北京公交集团承担了国家科技研究计划“奥运公交智能运行调度系统”，该系统已在奥运会前正式投入运行。\n\n\
  (2) **监控系统。** 北京奥运会期间，互联网大数据应用主要集中在电视监控、交通信号控制等模式。北京奥运会开始前，北京交通部门已制定完整方案并实施智能调度。奥运交通指挥中心、羊山桥交通服务指挥中心及\
  \ 38 个场馆群交通指挥岗组成了完整的数据监控网络，实时监控路面交通，从而实现交通有序、并行、和谐运行。\n\n(3) **高清数字检测系统。** 奥运会正式开始前，奥运核心区安装了高清数字监控系统。该系统可对车辆进行全方位检测，在核心区实现视频监控、车辆识别、违法检测、流量统计等多种功能。该系统的使用可有效保障奥运核心区交通有序发展，这也是中国首次采用单一综合检测设备，比传统多设备组合更集成、统计更完整。\n\
  \n##### 9.1.3 大数据系统的应用\n\n除了大数据硬件和大数据提前应对外，大数据的系统建设保障了奥运会的顺利进行。其中，以下内容构成了北京奥运会大数据交通系统：\n\
  \n(1) **移动处置方案。** 为服务北京奥运会，北京交通部门制定了完整的移动处置方案。一旦发生交通问题，大数据平台将尽快启动，配备卫星通信、无线传输、图像采集等大数据系统的指挥车辆将尽快赶赴现场。到达现场后，指挥车辆将立即通过信号系统向周边路口发送数据。2008\
  \ 年微信、微博尚未诞生，北京交通部门通过情报板提示驾驶员绕行。虽然手段相对落后，但有效缓解了事发地点的交通拥堵。\n\n(2) **监控系统方案。** 北京奥运会伊始，所有高速公路、主干道、奥运专线均安装了数万个检测线圈。这是城市交通管理的神经末梢，可不间断工作\
  \ 24 小时分析道路交通流数据。同时，它们可自动检测车辆。一旦发现车辆违反“单双号限行”限制，可第一时间拍照记录并上传数据平台，有效保障市民遵纪守法、交通顺畅运行。\n\
  \n(3) **公交优先控制系统。** 针对出行，北京建议市民首选公交系统，因此北京交通部门也优化了公交服务。北京共安装了 126 个具备优先控制功能的信号灯。当公交车通过这些路口时，信号灯将检测公交车并将相关信息传输给计算机。计算机根据路口实际情况调整交通流、缩短放行信号时间或延长绿灯时间，从而有效压缩公交车在路口的延误时间，避免道路延误问题。\n\
  \n(4) **数字化交通执法系统。** 为应对北京交通违法行为，过去在道路上安装了 1100 套连接互联网的电子警察，可自动检测闯红灯、超速等九类交通违法行为。这些信息将尽快上传数据库并快速比对，及时锁定违法者。同时，流动巡逻车也配备相关设备，可实现无线传输，有效查获套牌车。从识别到系统终端报警，每小时可监测\
  \ 2200 辆车，耗时不足一秒，实现真正的高速高效。\n\n\n\n\n\n#### 9.2 大数据交通与上海世博会\n\n2010 年，上海世博会是北京奥运会后中国举办的另一项重大活动，同样吸引了全世界的关注。与北京奥运会相比，世博会的影响范围更广，不再局限于体育领域，涵盖了世界上大多数国家的文化，因此参观人数更多。据数据显示，共有\
  \ 46 个国家和国际组织参加了上海世博会，接待游客 7308.4 万人次，日均 39.7 万人次，创造了世博会历史纪录。\n\n与 2008 年北京奥运会相比，大数据经历了两年的发展，其技术能力更加成熟。因此，上海世博会进一步改进了大数据的应用，特别是在预测等方面。大数据发挥了关键作用，为世博会期间更好地服务交通奠定了基础。\n\
  \n##### 9.2.1 大数据预测\n\n在上海世博会正式开幕前，上海交通大数据已正式开始运行。通过与票务平台、酒店、餐饮等机构的合作，逐步掌握了上海世博会期间的相关数据。上海大多数商业机构均接入了大数据系统，数据能够在最早时间进行统计。\n\
  \n同时，汽车 4S 店的销售数据也纳入了大数据系统，完善了相关信息。借助这一大数据模型，上海交通部门对世博会期间的交通进行了预测：2010 年，上海交通量将达到\
  \ 5000 万人次/天，汽车保有量将达到 160 万辆。在高峰期，8 号线、6 号线等轨道交通线路将面临巨大挑战，特别是在世博会期间，9 月至 10 月的交通压力将进一步增加。\n\
  \n通过大数据，上海交通部门对世博会期间的交通运行情况有了初步判断。因此，根据数据，相关部门制定了以下交通建议：\n\n1. **倡导乘坐公交出行。** 为应对道路交通压力，世博会开幕前，上海持续呼吁鼓励游客当时使用公共交通，特别是公交车。交通部门希望超过\
  \ 90%的游客能通过轨道和地面公交参观。\n\n2. **均衡入园。** 借助大数据分析，我们可以看到世博会客流在周末和节假日达到最大。由于这些时段酒店预订率高，我们提前制定了“均衡入园”策略，将客流从高峰日引导至平日，并制定了详细方案。鼓励游客从高峰时段向平峰时段出行，从浦西向浦东入园，以缓解交通压力，让全球游客真切感受上海世博会的魅力。\n\
  \n3. **适当的管理措施。** 为减少世博会交通与日常交通的相互影响，上海交通部门还发布了其他管控政策，包括车辆使用管理和施工区域管理，以避免交通压力失控。\n\
  \n正是通过大数据的应用，上海交通部门发现了可能出现的问题，并制定了这三项交通管理方案。这三项方案确立了世博会交通管理的基调，并通过大数据进一步优化，使工作更加精细。\n\
  \n##### 9.2.2 大数据智能系统的利用\n\n为更好地服务世博会，上海交通管理部门基于大数据建立了智能交通综合信息平台和世博园区交通信息分平台，提供智能化服务。世博会大数据平台的特点是数据处理能力强，不仅供内部使用，也面向所有游客。当大数据监测到前方道路明显拥堵等交通问题时，会立即向世博交通向导、世博交通网站、交通服务热线、广播电视台、可变信息标志、手机车载导航终端发送相关信息，持续提醒游客并提供换乘方案查询等服务。同时，该系统还与一线交通指挥员关联。交通指挥员也能随时随地获取园区交通信息，以便尽快开展交通疏导工作。与北京奥运会相比，世博会大数据平台有了显著提升。大众可通过互联网快速查询相关信息，而无需等待信息标志的提示。\n\
  \n围绕大数据平台，上海世博会将大数据智能交通推向了极致。这类应用有四大亮点，为未来大型活动提供了极好的参考。\n\n\n\n\n###### Comprehensive\
  \ Transportation Information Service System\n\nThe Shanghai World Expo launched\
  \ a Comprehensive Transportation Information Service System. The system serves the\
  \ vast number of visitors, covering integrated information on all modes of transportation.\
  \ It highly centralizes information, allowing all traffic information to be queried\
  \ through a single platform, avoiding the past problem of repeated queries, and\
  \ greatly improving the efficiency of visitor travel and road traffic. In particular,\
  \ the \"One Network, One Hotline\" service model enables visitors to obtain comprehensive\
  \ traffic information with one click. Visitors can access Shanghai's traffic information\
  \ through multiple Expo transportation websites, mobile communication services,\
  \ the Expo hotline, dedicated traffic radio channels, etc. This not only brings\
  \ convenience to visitors but also to frontline traffic commanders. They can quickly\
  \ understand relevant road section information, thereby enabling precise traffic\
  \ dispatching.\n\n###### Electronic Toll Collection System\n\nIn Shanghai, most\
  \ road sections are toll roads. In the past, manual toll collection was inefficient\
  \ and prone to causing traffic queues, directly affecting road passage. Before the\
  \ Expo, all these sections were upgraded to Electronic Toll Collection (ETC) systems,\
  \ which are more flexible and diverse. It not only enables fast electronic toll\
  \ collection but can also combine various preferential schemes, making it deeply\
  \ popular among car owners. With the help of the ETC system, traffic resources are\
  \ effectively balanced, and vehicle speeds have increased significantly. At the\
  \ same time, the costs of traffic operating companies have been reduced, thereby\
  \ providing better services.\n\n###### Traffic Monitoring System\n\nSimilar to the\
  \ Beijing Olympics, the Shanghai World Expo also launched a Big Data Traffic Monitoring\
  \ System. After two years of technical improvements, the Expo's Big Data Traffic\
  \ Monitoring System became more mature. For the first time, it established a Video\
  \ Image Monitoring System, monitoring traffic flow at intersections, surrounding\
  \ traffic flow, passenger flow, traffic security, and other aspects. All monitoring\
  \ data is sent to the monitoring center as quickly as possible, covering all of\
  \ Shanghai. Simultaneously, the monitoring system can issue emergency telephone\
  \ alarms and dynamically release early warnings, providing better guidance for vehicles\
  \ on the road. Vehicles can learn about sudden traffic incidents ahead in advance,\
  \ thereby detouring to avoid obvious congestion.\n\n###### Decision Support System\n\
  \nDuring the Expo, the Shanghai Transportation Department launched an innovative\
  \ \"Traffic Decision Support System,\" relying on big data to solve problems of\
  \ flow detection, guidance, and decision-making. The traditional manual mode has\
  \ been completely eliminated, with all relevant work completed within the system.\
  \ The system can build models to quickly find solutions, with efficiency far higher\
  \ than the traditional manual mode. Because the system contains tens of thousands\
  \ of traffic data models, it can handle almost all sudden traffic events and make\
  \ accurate, scientific planning recommendations.\n\nThese four major systems constitute\
  \ the foundation of the Shanghai World Expo's Big Data Traffic. The spatial scope\
  \ of the four systems includes the Expo Park, surrounding traffic control zones,\
  \ Expo expressways, comprehensive transportation transfer hubs, rail transit networks,\
  \ Expo dedicated bus channels, Expo Park waterway channels, and other directly related\
  \ areas. In addition, these big data technologies have broken through geographical\
  \ restrictions, serving not only the Shanghai area but also radiating the Yangtze\
  \ River Delta region, covering all spaces related to the Expo. Therefore, despite\
  \ the record-high number of visitors to the Shanghai World Expo, orderly traffic\
  \ operation showed no obvious omissions, providing a strong guarantee for the hosting\
  \ of the Expo.\n\nWith the closing of the Shanghai World Expo, these big data platform\
  \ systems continue to serve Shanghai and develop further. License plate recognition\
  \ data, land use remote sensing image data, mobile communication data, etc., have\
  \ now been fully implemented and applied in Shanghai. It can be seen that big data\
  \ applications can guarantee major events, serve urban construction more extensively,\
  \ and form a broader Big Data Traffic System, ensuring the coordinated advancement\
  \ of urban traffic.\n\n#### 9.3 Big Data Traffic and the Hangzhou G20 Summit\n\n\
  From September 4 to 5, 2016, the G20 Summit was held in Hangzhou, China. Compared\
  \ to the Olympics and the World Expo, the G20 Summit is an international economic\
  \ cooperation forum where the heads of state of 20 major countries gathered in Hangzhou.\
  \ It carries greater political and economic significance and is another important\
  \ demonstration of China's comprehensive national strength and economic power. As\
  \ an important barometer of national economic development, traffic also became a\
  \ focus of world attention.\n\nIn 2016, internet development entered a new stage,\
  \ different from 2008 and 2010. The concept of big data had been widely applied\
  \ in the commercial field, and an increasing number of professional big data service\
  \ companies emerged. Therefore, compared to the Beijing Olympics and the Shanghai\
  \ World Expo, the Big Data Traffic for the G20 Summit was more mature, presenting\
  \ characteristics of refinement and differentiation. Whether it was the Transportation\
  \ Department, the Traffic Police Department, or even the Zhejiang Provincial Government,\
  \ all listed Big Data Traffic as a top priority.\n\n##### 9.3.1 Government-Level\
  \ Attention to Big Data Traffic\n\nIn May 2016, on the eve of the Hangzhou G20 Summit,\
  \ Zhejiang Provincial Governor Li Qiang inspected the preparatory work for the G20\
  \ Summit, placing special emphasis on traffic issues. He pointed out that the construction\
  \ of an interconnected modern comprehensive transportation system should be accelerated\
  \ to support Hangzhou's future development. This provided clear guidance at the\
  \ government level for Big Data Traffic, facilitating the rapid establishment of\
  \ big data platforms.\n\nSubsequently, Li Qiang made a special inspection of Big\
  \ Data Traffic, particularly the Hangzhou G20 Summit Traffic Security Comprehensive\
  \ Information Command Center. The center has fully realized big data access, integration\
  \ of major transportation modes, and real-time monitoring and dispatching of full-domain\
  \ traffic. Information on expressways, railways, civil aviation, etc., has also\
  \ been incorporated into the platform. This platform is the core of guaranteeing\
  \ G20 Summit traffic and played an important role in information collection and\
  \ transmission.\n\n##### 9.3.2 Big Data Support for Road Traffic\n\nIn the Big Data\
  \ Traffic application for the Hangzhou G20 Summit, professional big data companies\
  \ were introduced, among which \"Dameng Data\" (Dameng Data) participated in the\
  \ work of the Traffic Police Detachment. Dameng Data provided the Hangzhou Traffic\
  \ Police Detachment with a comprehensive Traffic Big Data Platform, capable of real-time\
  \ analysis of traffic dynamics and information assessment. It can quickly formulate\
  \ traffic measures based on regional traffic characteristics, greatly guaranteeing\
  \ the smoothness and safety of Hangzhou's traffic.\n\n\n\n\n\n##### 9.3.3 大数据精准预测\n\
  \n随着第三方大数据公司的迅速崛起，凭借更专业的运营，为 G20 峰会服务提供更精准的预测成为可能。其中，滴滴出行发布的一系列数据，不仅为杭州交通管理部门提供了极为有效的数据参考，也让市民直接了解\
  \ G20 期间可能出现的交通问题，从而提前规划路线，避免交通突发状况。\n\n2016 年 7 月 27 日，滴滴出行发布《智能出行大数据报告：杭州》，明确指出预计\
  \ G20 期间杭州总出行量将下降 22%，平均车速将提升 45%，峰会期间杭州市民出行需求将较周末增长 80%。此外，得益于近年来杭州基础设施建设的快速推进，杭州工作日早晚高峰在一定程度上得到了缓解。\n\
  \n在该报告中，滴滴甚至对车速进行了精准的大数据预测：由于限行措施，杭州交通将更加顺畅，平均车速将从峰会前的 24.9 公里/小时变为 36.2 公里/小时，提升\
  \ 45%。由于杭州大部分市民享受“峰会专属七天假”，大数据也开始进行垂直约束分析，向杭州市民推荐“周边游”。这样一来，杭州交通能进一步得到保障。据此大数据，周边省市旅游局也为杭州制定了各类旅游优惠活动以吸引杭州市民。\n\
  \n这种借助大数据的精准预测，不仅针对 G20 峰会开幕前，还延伸至 G20 峰会闭幕后。杭州市旅委市场推广处处长蒋军表示：“据大数据判断，G20 峰会后杭州将迎来旅游高峰，这从相关酒店餐饮行业的大数据统计中可见一斑。”随着\
  \ G20 峰会的召开，杭州新增了许多景点，且 G20 闭幕恰逢中秋、国庆假期。因此，针对 G20 后的交通，杭州再次进行了针对性的战略调整，以迎接大量游客。数据显示，9\
  \ 月 10 日至 11 日周末以杭州为目的地的周边游客订单量同比增长超一倍，乘坐高铁和长途大巴的游客比例分别位居第二、第三位，这与大数据结论一致。得益于大数据的支撑，杭州交通在\
  \ G20 峰会前、中、后期始终保持良好状态，过去“大型活动结束后混乱”的局面未再出现。\n\n##### 9.3.4 智能大数据生根发芽\n\n随着大数据技术的井喷式发展，杭州\
  \ G20 峰会期间，智能大数据的应用更加广泛，越来越多的大数据技术和智能产品企业加入其中，进一步保障了杭州 G20 峰会的顺利召开。\n\n###### (1)\
  \ 海信智能公交系统的应用\n\nG20 峰会前，杭州与海信签署协议，对杭州全市公交车进行智能化升级。海信改造了杭州 4700 辆公交车，并在全国首创“回场预测”功能。该功能的特点在于将各车辆数据、路况判断与各车辆回场时间精准预测有效结合。这样，公交公司可有效调整线路，如增减班次、调整发车时间。该系统大幅降低了人工调度成本，使公交系统自动发车率达到\
  \ 90%，打破了行业原有纪录。\n\n同时，智能公交系统还推出了公交 App，让市民足不出户即可进行出行规划，获取到站预测、到站铃声提醒等服务，极大提升了公交出行的便利性。\n\
  \n###### (2) 交通社区的建立\n\n社区文化是近年来备受关注的互联网新名词。借助大数据，不同人群将被聚集在一起，使信息传播更高效、精准。在杭州 G20\
  \ 峰会期间，这种“交通社区”实现了有效尝试。峰会期间，交通局开展“微信微博、一端一线、一网一室、两群”活动。通过杭州交通微博、微信、App 客户端、12328\
  \ 热线、杭州交通信息网、新闻直播间、微信群、QQ 群八大社区平台，持续向公众发布客流预测、交通气象、场馆售票等各类交通信息。因此，市民和外地游客能第一时间获取相关信息，提前安排出行，避免因信息疏忽导致频繁出行，影响城市正常交通秩序。\n\
  \n###### (3) “互联网+交通”的应用\n\n手机的快速普及、4G 网络的持续提速和 WiFi 便利性的增加，使大数据应用更加深入人心。“互联网+交通”模式已成主流。该模式在\
  \ G20 峰会期间得到广泛应用。乘客出行时，无论公交、地铁还是共享单车，均可通过手机扫码，无需额外办理公交卡，即可实现“一机在手，畅行天下”。便捷的购票支付方式极大优化了交通出行，杭州交通效率显著提升，路面拥堵情况显著减少。\n\
  \n\n\n\nFrom the Beijing Olympics to the Shanghai World Expo, and then to the Hangzhou\
  \ G20 Summit, we can see that the application of big data in the transportation\
  \ field has become increasingly extensive, while also increasingly permeating the\
  \ lives of the public. Every citizen has become an important component of big data\
  \ transportation. Only by forming such a situation can urban transportation be further\
  \ improved, the role of big data become increasingly prominent, forming a \"boundary\
  \ effect,\" breaking through the single transportation field, achieving cross-border\
  \ cooperation with tourism, economy, and culture, and providing more obvious assistance\
  \ to urban construction.\n\n#### 9.4 Big Data Transportation and the \"Belt and\
  \ Road\" International Forum\n\nFrom May 14 to 15, 2017, the Belt and Road Forum\
  \ for International Cooperation was held in Beijing. This was a major diplomatic\
  \ event hosted by China, with significant significance for promoting international\
  \ and regional cooperation. As the initiator and organizer of the \"Belt and Road\"\
  \ Forum, China had to ensure the smooth convening of the forum. At the same time,\
  \ this was the most important international event since the Beijing Olympics.\n\n\
  The forum also attracted numerous heads of state, government officials, and institutional\
  \ representatives from countries around the world, as well as 29 foreign heads of\
  \ state and government leaders, and 3 heads of important international organizations\
  \ (UN Secretary-General, President of the International Committee of the Red Cross)\
  \ attending the summit. Approximately 1,500 representatives from various sectors\
  \ from over 130 countries attended the forum as official delegates. More than 4,000\
  \ journalists from around the world registered to cover the forum. The high specifications\
  \ and far-reaching influence of the forum are evident.\n\nFor this important international\
  \ forum, Beijing transportation faced challenges again after the 2008 Olympics.\
  \ What role did big data transportation play for the \"Belt and Road\"?\n\nIn recent\
  \ years, with the continuous development of big data technology, Beijing transportation\
  \ has formed a relatively complete big data transportation model. Therefore, for\
  \ the \"Belt and Road\" International Forum, these new technologies were widely\
  \ applied. These technologies not only served the \"Belt and Road\" International\
  \ Forum but also established a complete big data transportation network for Beijing.\
  \ While ensuring the smooth convening of the international forum, they also brought\
  \ tangible convenience to Beijing citizens, greatly improving Beijing's traffic\
  \ conditions.\n\n##### 9.4.1 Traffic Restriction Measures Under Big Data\n\nImplementing\
  \ traffic control and restrictions for major conferences is an international convention,\
  \ and the \"Belt and Road\" International Forum was no exception. In the past, traffic\
  \ restrictions were often based on empirical judgment, with lagging enforcement,\
  \ causing great inconvenience to the public's normal travel. However, for the \"\
  Belt and Road\" International Forum, Beijing transportation departments used big\
  \ data to conduct long-term information collection on key road sections. With the\
  \ help of big data channels such as intelligent traffic lights and road monitoring\
  \ equipment, relevant information was released in early May 2017, allowing the public\
  \ to prepare in advance.\n\nAt the same time, restricted routes were optimized based\
  \ on big data judgment. Instead of blocking most roads as in the past, only roads\
  \ affecting the forum were restricted. This not only ensured the smooth progress\
  \ of the forum but also guaranteed that the public's daily life and work were unaffected.\
  \ Meanwhile, due to the proactive application of big data, the Beijing traffic management\
  \ department also issued relevant detour suggestions, further ensuring residents'\
  \ normal travel.\n\n(1) **Traffic control measures were implemented on roads surrounding\
  \ the Yanqi Lake International Convention Center in Huairou District.** From 0:00\
  \ on May 7 to the end of the event on May 15, from the intersection of Fanqi Road\
  \ and Huidu Road in Huairou District (exclusive) via Fanqi Road, Yanqi Lake West\
  \ Road to Baiyashanzhuang Bridge (exclusive), Yanqi Lake Road, Yanqi Lake South\
  \ Road, vehicles other than those holding \"Summit\" special permits were prohibited\
  \ from passing. Social vehicles and buses must detour via Yanqi Lake North Road;\
  \ parking of motor vehicles is prohibited along the detour route.\n\nFrom 0:00 on\
  \ May 15 to the end of the event, from the east entrance of Yanqi Lake North Road\
  \ via Yanqi Lake North Road to Shentangyu Road, vehicles other than those holding\
  \ \"Summit\" special permits were prohibited from passing. Social vehicles and buses\
  \ must detour via Jingjia Road.\n\n(2) **Traffic control measures were implemented\
  \ on roads surrounding the China National Convention Center in Chaoyang District.**\
  \ From 0:00 on May 10 to the end of the event on May 15, within the enclosed area\
  \ formed by Beichen East Bridge via North 4th Ring Road, Beichen West Road, Datun\
  \ North Road, Beichen East Road to Beichen East Bridge (excluding the aforementioned\
  \ roads), vehicles other than those holding \"Summit\" special permits were prohibited\
  \ from passing. Social vehicles and buses could detour via Datun North Road, Datun\
  \ Road Underpass, Huizhong Road Underpass, Beichen West Road, Beichen East Road.\n\
  \nFrom 6:00 on May 14 to the end of the event, vehicles other than those holding\
  \ \"Summit\" special permits were prohibited from passing on Beichen East Road,\
  \ Beichen West Road, Kehui South Road, Datun North Road, Datun Road Underpass, Huizhong\
  \ Road Underpass, Minzu Yuan Road. Social vehicles and buses must detour via Anli\
  \ Road, Jingzang Expressway, North 5th Ring Road, North 4th Ring Road.\n\nUsing\
  \ big data for traffic restrictions is an important attempt by Beijing since the\
  \ Olympics. Solving traffic problems based on data rather than experience is more\
  \ effective, and this is the main direction for traffic control during major events\
  \ in the future. While ensuring the normal operation of urban traffic, it can also\
  \ show the world leaders a new look of Beijing, Beijing's development, and even\
  \ the fact that China will become more mature.\n\n##### 9.4.2 Application of Beijing\
  \ Intelligent Transportation\n\nWhile implementing traffic restrictions with big\
  \ data, a large number of new big data transportation applications emerged. Beijing\
  \ transportation optimized from details, demonstrating new characteristics of Beijing\
  \ transportation during the \"Belt and Road\" International Forum.\n\n(1) **Handling\
  \ traffic services via mobile phone.** In 2017, Beijing mobile big data transportation\
  \ applications were fully rolled out. Citizens could not only swipe bus cards and\
  \ subway cards via mobile phones but also intelligently pay fees, query road conditions,\
  \ and bus arrival information through mobile apps. At the same time, software such\
  \ as \"Beijing Traffic APP\" and \"Customized Bus APP\" have connected road traffic\
  \ and aviation channels; traffic information is available at the click of a button,\
  \ greatly enhancing the convenience of transportation operations.\n\n\n\n\n######\
  \ (2) TOCC 系统的持续改进\n\n2011 年，北京市交通运行监测调度中心正式启用，简称 **TOCC 系统**。到 2017 年，该系统已处于成熟运行阶段，在城市交通规划中发挥了积极作用。截至\
  \ 2017 年 12 月，TOCC 系统已汇聚 6000 余个静态和动态数据点及 6 万路视频，数据存储量达 20T。可以说，大数据和云计算提供了强有力的保障。未来，交通管理将不断从这些数据中检索信息，建立交通仿真系统，从可预测性和主动性出发，对交通状况做出更多判断，并将决策发送给相关部门以便快速处理。\n\
  \n###### (3) 智能预测系统\n\n智能预测系统是北京交通的重要探索。该系统广泛应用于北京市所有快速路和主干道。它全天候采集道路车流量，并通过大数据分析，以直观的图形模式直接展示路况状态。一旦超过历史正常值，系统将发出预警，为基层交通管理部门的下一步决策提供有效参考。同时，通过视频图像识别技术和交通事故自动检测，可快速处理交通事故，保障道路畅通。\n\
  \n作为中国的首都，北京是中国新形象的重要展示窗口，也承载着一系列重要国际会议。因此，随着北京大数据交通的不断完善，其成果也将辐射至周边省市，从而改善中国整体的交通面貌。可以预见，未来北京将拥有更大的大数据交通提升空间，以保障这座国际化大都市的有效运行。\n\
  \n### 第 10 章：大数据交通与交通管理\n\n交通管理是交通领域的重大课题，有交通自然就需要交通管理。它涉及交通过程的各个方面，包括主要交通设施和交通信息的管理，以及技术变革、管理模式和组织模式的管理。全方位的管理需要强大的实时响应和分析能力，而大数据恰好符合这些要求。\n\
  \n#### 10.1 大数据交通的状态诊断\n\n大数据对交通状态的诊断，依赖于各类信息的采集，进而进行多维数据分析，最终借助历史档案、当前路况等形成完整数据。与大数据发展早期相比，当时的状态诊断内容过于模糊、难以理解。如今，大数据诊断将形成完整的报告，并以图表等直观形式展示，可有效应用。因此，越来越多的城市整合交通大数据，有效构建完整的大数据诊断系统，提升运行能力。\n\
  \n以南京为例。早在 2012 年，南京就已启动交通大数据信息化建设。当时的核心项目是“两卡一中心”，即市民卡、车辆卡和政府云计算中心。随着大数据从 2013\
  \ 年起持续升级，这些核心项目整合为“两网一平台”，即 LTE 政务专网、物联网和市民综合服务平台，有效提升了大数据的状态诊断能力，并实现了各类信息的有效互通。\n\
  \n特别是面向公众和服务平台，该平台不仅向公共交通部门提供相关数据和建议，还面向市民开放。通过实时路况，市民可获取各站点和路段的具体信息，提前获得最佳路线建议，保障道路交通畅通。这种状态诊断是未来交通管理的发展趋势，不仅能使数据更精准，还能有效降低交通监管和运营成本。\n\
  \n在技术手段方面，大数据交通是如何开展这些状态诊断的？\n\n##### 10.1.1 信息采集模块的运行\n\n要进行状态诊断，首先必须开展数据采集，这是大数据运行的基础。目前有两种信息采集模式：静态模式和动态模式。\n\
  \n在大多数城市，静态信息采集已投入使用。该方法的特点是当车辆通过固定在道路上的视频监控设备或感应线圈时，快速捕获相应数据，从而实现车辆信息采集。例如，安装在北京快速路和主干道上的数千个信息采集器就属于静态采集设备。此类设备价格低廉、固定安装维护简单，但其劣势在于灵活性有限。一旦车辆规避监控范围，就会导致数据采集失败。因此，静态信息采集设备的数量往往较多。\n\
  \n与静态信息采集的劣势相比，动态信息采集设备更具灵活性。例如，安装在执法车辆和监管车辆上的采集设备，通过磁频、光电、重量传感器等方式采集数据，可有效采集车辆实时运行速度。数据处于流动状态中，因此对拥堵的预测更加精准。\n\
  \n精准的数据是交通管理的前提，也是大数据做出精准判断的基础。因此，应形成“静态+动态”的组合模式，以保证数据采样的准确性。\n\n智能公交是“静态+动态”信息采集组合模式的典型代表。新型智能公交系统可在行驶过程中持续采集周边车辆行驶状况，快速判断前方路况。同时，也可对公交站点和交通路口进行完整的静态数据采集，为下一步交通管理提供数据支撑。因此，推广使用智能公交不仅是为了低碳生活，也是为了城市道路优化。\n\
  \n##### 10.1.2 大数据分析模块的应用\n\n大数据信息采集完成后，相关信息将进入大数据平台进行下一步分析。目前，第三方大数据公司发展迅速，不同品牌的大数据交通产品分析模式各异。但其共性是：将不同渠道的信息有效汇总，建立交通信息数据模型。随后，这些数据形成图像视频，通过大数据平台分类的深度分析，获取有价值的信息数据。\n\
  \n大数据平台越完善，该分析的准确性越高。即使部分数据模糊，大数据平台也会通过历史档案、自带数据库等方式进行有效的数学建模，以提升数据分析水平。\n\n\n\n\
  \nCurrently, most third-party big data enterprises serving the transportation sector\
  \ have established complete analysis modules. Internet giants such as Baidu and\
  \ Alibaba are also continuously advancing into related fields, creating a flourishing\
  \ landscape. Local transportation departments should preferably choose to cooperate\
  \ with enterprises possessing rich market experience. The first reason is to safeguard\
  \ the security of the big data platform; the second is to leverage complete databases\
  \ to manage regional transportation. For example, as of 2014, the Alibaba big data\
  \ brand had stored 100 PB of data content, equivalent to 40,000 Seattle Central\
  \ Libraries and 58 billion books. Particularly for new district transportation development,\
  \ utilizing data files from other regions can supplement data for the area, providing\
  \ more rational suggestions for road and network planning.\n\n##### 10.1.3 Application\
  \ of Traffic Data Processing Modules\n\nAfter data collection and analysis are completed,\
  \ the next step is the final step—processing. Processing directly relates to the\
  \ status diagnosis of big data transportation, thereby enabling targeted traffic\
  \ adjustments. Generally, traffic data processing modules process distributed data\
  \ and make final decisions. For instance, when significant congestion occurs at\
  \ an intersection, data will be rapidly analyzed, followed by a decision: optimize\
  \ signal light duration, prioritize north-south bound vehicles, and have east-west\
  \ bound vehicles wait appropriately.\n\nTraffic data processing is not only about\
  \ adjusting traffic management details but also about accumulating data and predicting\
  \ conditions in other surrounding areas. Through the analysis of abnormal traffic\
  \ behaviors and comparison with relevant data in the database, transportation departments\
  \ can grasp road conditions over a period of time, thereby formulating more scientific\
  \ plans. These data may seem chaotic, but through the optimization of big data classification,\
  \ they can be directly applied to work.\n\nUltimately, for the purpose of traffic\
  \ status diagnosis, big data needs to go through three stages: information collection,\
  \ information analysis, and information processing, to build a sound transportation\
  \ network. With the continuous upgrading of big data technology, more transportation-related\
  \ content will be incorporated, such as flights, high-speed rail, urban construction,\
  \ and urban maintenance. The richer the data, the more accurate the status diagnosis.\
  \ The future development of big data transportation lies herein. By fully utilizing\
  \ big data technology, an efficient and safe traffic management model will be realized.\n\
  \n#### 10.2 Information Analysis of Big Data Transportation\n\nWith the rapid development\
  \ of urbanization in China, most cities and even rural areas face severe traffic\
  \ congestion. Traffic congestion not only causes road crowding but also leads to\
  \ serious waste of transportation resources and even affects economic development.\
  \ Taking the United States as an example, each car-owning household loses $1,700\
  \ annually due to traffic congestion. China is in a period of rapid growth in vehicle\
  \ ownership. In addition, urban and rural reconstruction also results in economic\
  \ waste due to poor traffic flow.\n\nTherefore, the focus of big data transportation\
  \ application lies in solving problems of poor traffic flow, congestion, and road\
  \ optimization. Congestion causes vary across different regions; big data must be\
  \ used to analyze information. Only by identifying the root cause of the problem\
  \ can the right remedy be applied.\n\n##### 10.2.1 Defects of Traditional Information\
  \ Analysis\n\nThere are many reasons for road congestion: some are due to excessive\
  \ traffic volume exceeding road carrying capacity; some due to imperfect infrastructure\
  \ preventing normal traffic flow; some due to a lack of surrounding parking lots\
  \ leading to arbitrary parking by car owners; and some due to urban construction\
  \ development and increased road-occupying construction causing congestion.\n\n\
  Of course, congestion in many areas is the result of a combination of the above\
  \ factors. The aforementioned reasons interact with each other. Therefore, single\
  \ information analysis struggles to formulate effective solutions. However, traditional\
  \ traffic information analysis, due to lagging technical capabilities, results in\
  \ obvious loopholes in information analysis.\n\n(1) **Data is not comprehensive\
  \ enough.** Traffic monitoring systems in most cities often only cover main arterial\
  \ roads, neglecting data monitoring of branch roads and intersections. The received\
  \ information cannot comprehensively reflect traffic conditions, making it difficult\
  \ to formulate effective strategies.\n\n(2) **Insufficient random sampling.** Traditional\
  \ traffic information analysis usually relies on random sampling. However, due to\
  \ the requirement for massive human and financial resources, samples are insufficient,\
  \ randomness is high, and data lacks representativeness; analysis naturally has\
  \ problems.\n\n(3) **Regional restrictions.** In the past, there was little information\
  \ flow between departments, imposing restrictions on traffic data collection. For\
  \ example, urban building reconstruction falls under the responsibility of the Ministry\
  \ of Housing and Urban-Rural Development (MOHURD), and transportation departments\
  \ cannot obtain relevant data, making it difficult to conduct traffic diversion\
  \ and leading to congestion in surrounding areas. Without information sources, correct\
  \ analysis and prediction are difficult.\n\n##### 10.2.2 Information Analysis and\
  \ Promotion of Big Data Models\n\nThe combination of transportation and big data\
  \ can solve the shortcomings of traditional information analysis. Because under\
  \ the big data model, information analysis will exhibit the following characteristics:\n\
  \n(1) **Full data monitoring.** Big data identifies intelligent devices distributed\
  \ in every corner of the city and collects information uniformly, paying attention\
  \ to all traffic data rather than random sampling.\n\n(2) **Data enrichment.** During\
  \ the information analysis process, big data is not limited to single data sources.\
  \ Simultaneously, due to large storage capacity, data analysis is richer. The combination\
  \ of static and dynamic data makes information analysis more accurate and valuable.\n\
  \n(3) **Real-time information analysis.** A characteristic of big data is that data\
  \ can enter the database immediately, allowing for dynamic real-time analysis and\
  \ avoiding data lag. This enables grasping traffic operation status in a short time,\
  \ thereby formulating effective traffic solutions.\n\n(4) **Microscopic data collection.**\
  \ Although big data focuses on the whole, data collection originates from the microscopic\
  \ level, making analysis more targeted. For example, when analyzing bus information,\
  \ starting from each passenger's bus IC card, combined with mobile phone GPS data.\
  \ Data is precise down to every individual and every time node.\n\n##### 10.2.3\
  \ Analysis and Application of Guiyang Big Data Traffic Information\n\nWith the increasingly\
  \ perfect construction of intelligent transportation systems in various cities,\
  \ big data traffic information analysis is deepening today. Microwaves, loop detectors,\
  \ GPS, license plates, bus IC cards, mobile phone Apps, etc., all constitute effective\
  \ data sources. With the help of these data and information, transportation departments\
  \ can effectively grasp traffic information, subway and bus information, and quickly\
  \ formulate adjustment plans.\n\n\n\n\n###### 大数据分析重塑贵阳城市交通\n\n正是通过此类大数据信息分析，贵阳市对城市交通进行了彻底变革。贵阳位于山区；与平原城市相比，其基础交通建设相对落后。尽管近年来建设力度加大，但随着人口、机动车和房地产的快速发展，交通拥堵、停车难等问题日益凸显。\n\
  \n为解决这些问题，2014 年，贵阳交通部门引入了大型数据库软件，如 `MySQL` 数据库，并开始对 269 个交通监测点的大数据进行筛选。结果，这一大数据应用取得了显著成效。2014\
  \ 年 9 月 1 日至 13 日，大数据累积了 1.54 亿条原始数据。通过大数据库的筛选，贵阳的交通特征被迅速发现。\n\n例如，根据“黄金路与枣山路交叉口”的大数据调查发现，该路段每天早上\
  \ 6:00 交通流量显著增加，在 8:00–9:00 达到高峰，期间近 8000 辆车通过。从 10:00 到 19:00，一直处于高峰的交通流量略有减弱。22:00\
  \ 又出现一个小高峰。\n\n过去，仅靠基层工作人员的调查无法实现此类数据分析。但凭借大数据强大的计算能力，数百台监测设备协同工作，很快便找到了贵阳各路口的交通数据。有了这些数据，城市交通的变革便能精准有效。\n\
  \n经过数天的大数据分析，贵阳交通部门发现了一些问题。例如，私家车保有量过高，占比超过 70%，这意味着贵阳公共交通存在明显短板。未来，公共交通的发展必将成为重点，以有效缓解交通拥堵问题。特别是对一环路及一环路内路段的监测发现，此处路口是拥堵的主要地点，也是未来解决问题的主要方向。同时，与其他城市相比，贵阳并非仅有早高峰拥堵的简单城市。贵阳的拥堵全天候且延续至午夜前，因此照搬其他城市经验并不奏效（见图\
  \ 10.1）。\n\n![图 10.1 贵阳智能交通系统](img/fig10.1.jpg)\n\n**图 10.1** 贵阳智能交通系统。\n\n*来源*：贵阳网。\n\
  \n有了此类数据分析，贵阳的城市交通变革必须有的放矢，而非盲目增加公交车或拓宽道路。\n\n这种大数据分析模式可在各城市有效推广，为交通提供最直接的数据。例如，公交卡可积累海量乘客出行数据，通过数据分析可找出乘客主要流向和集中站点，从而建立公共交通模型，有效制定应对方案，科学配置运力。\n\
  \n#### 10.3 大数据交通的技术变革\n\n大数据与交通的结合并非一成不变。随着大数据技术的持续进步，交通管理技术也在不断变革中，以适应时代发展。因此，对于基层交通部门而言，有必要持续升级大数据技术、采购新型大数据检测设备，以使工作持续改进、始终符合时代发展要求。\n\
  \n##### 10.3.1 硬件设备升级\n\n早期的大数据检测往往只是给传统交通设备加装视频拍摄功能和数据回传功能。但随着技术的持续创新，硬件设备有了显著提升。特别是这些硬件设备的应用，为大数据检测提供了更丰富的手段。\n\
  \n(1) **物联网传感器**。与传统传感器相比，物联网传感器的信息采集内容大幅提升。交通管理部门在路面嵌入物联网传感器，可在移动设备上实时观测车辆通行量和客流信息，并监管车辆尾气排放。物联网传感器可实现多车辆数据同步采集，效率更高。这为指挥交通管理系统奠定了基础，并能更高效地采集数据。\n\
  \n(2) **卫星地图应用**。过去，卫星地图数据不向公众开放，多属军事用途。但随着大数据在商业和民用领域的广泛应用，卫星地图也可有效用于交通管理。因此，交通管理部门应尽快接入卫星地图，通过卫星实时捕捉路况制定相应策略，以开展交通规划和道路规划。\n\
  \n(3) **智能手机应用**。对公众而言，大力倡导智能手机的大数据应用也能有效解决交通问题。智能手机已普及应用。它们可轻松与交通管理部门的相关平台链接互动，如\
  \ `WeChat`、`Weibo` 及相关 `APPs`。同时，`GPS` 定位和 `北斗` 定位系统的应用，使地图供应商能在自身大数据应用中发挥良好作用，首时间为乘客和车主推送路况拥堵及出行趋势。这些信息可优化路网。\n\
  \n基于这三大技术变革，智能红绿灯、大数据售票平台等技术已趋成熟。企业和政府部门均开始利用这些技术变革红利转型交通行业。主动将先进技术引入交通系统，将为交通管理带来新局面。\n\
  \n##### 10.3.2 新大数据技术变革\n\n大数据技术仍在更新，为交通管理带来新变化。例如，当前主流智能大数据交通技术主要使用路口监测设备和电子警察。实现车辆抓拍、车牌识别等工作仍属传统技术范畴。虽能快速分析车辆，但难以深度挖掘。传统算法使大数据交通遭遇瓶颈。\n\
  \n新大数据技术呈现出此类特征：通过拍摄照片，可检测年检次数、年检标志形状、车窗是否悬挂危险物品、驾驶员是否有违规行为。例如，北京图存科技院所研发的智能交通识别算法可实现上述目标，助交警部门快速获取路况信息。一旦发现问题，数据将尽快存储，为公安后续办案提供有力证据，督促驾驶员规范自身行为，进一步保障交通安全。\n\
  \n\n\n\n\n##### 10.3.3 深圳：大数据交通应用的先行者与领跑者\n\n深圳，作为中国最年轻、最具活力和创新精神的城市，也是中国首个尝试大数据智能化的城市。依托大量新兴\
  \ IT 企业，深圳在大数据交通技术方面的变革一直走在全国前列。与北京、上海、广州相比，深圳的交通状况也是最好的。因此，深圳模式值得全国其他城市借鉴学习。\n\n\
  早在 2000 年，深圳就已建立智能交通指挥中心。依托智能信号灯、闭路电视、智能交通违章管理系统，深圳的交通管理实现了信息化、监控化和指挥化，能够有效管理城市交通。\n\
  \n随后，大数据技术在深圳交通领域持续应用。2007 年 8 月，深圳八家企业成立了深圳市智能交通安全协会，构建了一个更高效、更智能的交流与发展平台。深圳投资\
  \ 10 亿元的“智能交通 1+6”项目，使大数据技术实现了全新升级。\n\n“智能交通 1+6”项目中的“1”是指“一个资源共享平台”，该平台涵盖交通信息、交警、城建等部门，所有信息均实现了有效交换。“6”是指平台下的六大服务系统：交通监控信息、交通管理信息、道路交通管制信息、公众出行信息、交通指挥应急信息、交通管理与决策信息。正是凭借“1+6”体系，深圳大数据交通实现了全面升级，有效服务于城市交通。\n\
  \n为更好地利用大数据，深圳持续加快智能综合交通运行指挥中心建设，并根据实际情况开展分中心建设，汇聚更多公共交通海量数据。对中国绝大多数城市而言，深圳模式是最佳参照，通过不断升级大数据交通技术，以应对日益增长的汽车保有量和城市人口。科技服务于人，科技的每一次进步都可能给以往的工作带来巨大改善。\n\
  \n#### 10.4 大数据交通的组织模式\n\n大数据交通的应用不仅不能仅依赖交通部门的单打独斗，还必须结合多部门协同开展，并积极引入第三方大数据企业的先进技术，以形成完善的组织模式。组织模式决定了大数据的体制与框架。组织越成熟，数据获取越充分。否则，一旦形成“信息孤岛”，数据必然失真，无法有效服务于交通管理。\n\
  \n##### 10.4.1 大数据模式改变“信息孤岛”效应\n\n“信息孤岛”效应是指信息来源狭窄，往往仅限于个人和小群体，缺乏参考价值，难以在更广范围内应用。传统交通组织模式仅依赖交通部门的人力资源，数据统计非常有限，带有浓厚的个人主观色彩。往往由负责调研的人决定最终数据，因此过去许多城市的交通规划不尽如人意。如今，随着车辆激增，拥堵和事故频发。\n\
  \n大数据的组织模式旨在打破“信息孤岛”效应。以汽车传感器为例，当车辆通过某个路口时，监测设备将快速捕获数据，相关数据将被迅速收集。在此过程中，不仅需要交通部门安装相应设备，还需要车辆监管机构配合监督车辆安装。同时，城建部门在相关设施建设过程中，将为交通部门预留相关接口，使大数据真正发挥有效作用。因此，可建立完善的公共交通云，所有组织均可有效接入，实现数据流通，使数据统计更有效，从而满足交通管理需求。\n\
  \n##### 10.4.2 大数据三级管理组织架构\n\n大数据的组织模式不仅体现在不同部门间的信息传递，还体现在不同部门的不同组织架构上，形成“三层结构”。其中，通信服务商是完成最终数据采集的支撑。\n\
  \n\n\n\n\n###### 三层结构\n\n####### (1) 信息层\n\n三层结构的第一层是信息层，其功能是信息收集。这需要交通部门、卫星数据部门和通信服务提供商之间的合作，通过卫星和手机终端快速收集数据，然后通过网络传输到交通服务器。\n\
  \n随后，相关技术人员通过各种算法对车辆或个人的具体位置和路线进行数据调查，并存储管理在云服务平台中，而居民可以通过手机等移动终端 APP 查看相关信息，享受大数据交通带来的便利。\n\
  \n####### (2) 网络通信层\n\n第二层是网络通信层。该组织系统的工作是有效组织数据，并通过 WLAN、4G 等方式将数据传输到云服务平台。为此，第三方大数据公司必须发挥积极作用，确保服务器的有效运行，避免信息遗漏、丢失等问题。\n\
  \n####### (3) 云服务层\n\n第三层是云服务层。该层的主要工作是对数据进行编码转换、挖掘信息、预测拥堵。这需要专业人员利用大数据平台确保信息筛选的准确性和有效性。特别是对于市中心、商业区等人口密集路段，该层工作更繁忙，提供完美的路径优化、实时公交查询等服务，因此需要多部门合作有效解决问题。\n\
  \n##### 10.4.3 大数据交通组织体系\n\n随着大数据技术的不断升级，大数据交通已形成完整的产业链，包括数据采集、集成、分析、挖掘、展示和服务。未来，大多数城市将根据这五个方面建立详细的组织架构，以更好地开展大数据交通工作。这些组织不仅由交通管理部门组成，还包括第三方大数据企业。\n\
  \n###### (1) 数据采集\n\n城市大数据交通应用通常依赖感应线圈和微波雷达，它们构成了城市交通监测的主体，主要由交通管理部门安装和监控。然而，这些采集设备难以覆盖全市路网，因此需要第三方检测公司介入。大多数此类公司拥有自己完善的设备，会对员工进行专业培训，在新技术应用上更娴熟。因此，数据采集可部分外包，形成“交通管理部门\
  \ + 第三方大数据企业”联合运营模式，以提高信息采集的普适性和专业性。\n\n###### (2) 数据获取\n\n过去，国内城市交通数据常由市政、交通、城建、规划、交警等多个部门掌握。大数据交通的应用将有效统一这些信息，汇聚整合至交通管理部门，实现数据采集存储的标准化。各地建立的交通信息中心是典型的“中心化大数据”组织。只有统一数据管理，才能从不同视角发现和解决问题。目前，交通管理部门汇聚的多为公交、地铁等公共交通信息。未来，出租车、共享汽车、共享单车信息也将有效纳入，数据将更丰富。因此，加强与这些商业公司合作、尽快统一数据信息，是大数据交通发展趋势的任务。\n\
  \n###### (3) 数据分析\n\n对于大数据分析，多采用与第三方合作模式。相比交通部门，第三方公司在数据分析上往往具有强势优势，无论平台设备还是人才储备，远超政府部门。例如上海美汇公司、上海电科院是国内优秀的数据分析公司。交通部门可将自身需求告知这些公司，它们将即时处理相关大数据，如出行信息、交通决策信息等。例如，出租车\
  \ GPS 数据分析就是第三方公司的专长。\n\n###### (4) 数据思维\n\n纯粹的绑定分析只是大数据的初级应用。让数据产生分析、形成更好的交通管理形态，是大数据交通的发展目标。因此，交通部门必须与第三方公司、高效企业开展深度合作，通过专利和论文让大数据发挥更大作用。例如，同济大学参与深圳城市交通仿真系统，极大提升了大数据平台规划水平，为城市交通改善做出巨大贡献。\n\
  \n###### (5) 信息服务\n\n信息服务直接面向终端用户，将大数据处理后的信息直接推送给居民。在此过程中，交通部门应与第三方信息服务部门合作，使信息传播更广泛、准确。例如，交通部门通过\
  \ APP 发布完整交通信息，校园 APP 发布校园周边具体措施，车主 APP 推送具体绕行方案，从而形成完整的信息发布体系。\n\n可见，大数据交通组织模式不再局限于交通管理部门，而是呈现“多点合作、全方位发展”局面。只有形成这种组织模式，大数据才能真正完成从理论到实践、从信息采集、分析到发布的全过程实践。\n\
  \n#### 10.5 大数据交通管理模式\n\n大数据交通管理模式种类繁多，但其本质相同：即通过持续捕获数据、整合多种数据，最终找到有价值的数据应用。不同处理方式仅在实践手段上有差异。特别是第三方企业创建的大数据平台，其本质相似。因此，在大数据应用中，只要找到管理模式的共同点，就能迅速打开局面，精准服务交通领域。\n\
  \n##### 10.5.1 通用大数据管理模式\n\n一般来说，以下类型的大数据管理模式是目前最常见的管理模式：\n\n###### (1) 空间状态分析\n\
  \n借助安装在街道上的各种大数据设备，大数据分析空间状态，发现交通流分布特征和变化趋势，监测路况以生成拥堵指数，并通过调整交通信号灯进行交通管理。该模式是应用于日常交通管理的常规管理模式。\n\
  \n\n\n\n\n##### 10.5.2 Upgrading the Big Data Traffic Management Model\n\nFive basic\
  \ management models constitute the foundation of big data traffic management. On\
  \ this basis, big data traffic management is upgraded to enable big data to play\
  \ a more effective role. Targeting China's current traffic conditions, the upgrade\
  \ direction of big data traffic management should focus on the following points:\n\
  \n(1) **Cross-regional management systems**. Traffic departments in various regions\
  \ possess a certain degree of administrative autonomy, leading to poor information\
  \ flow between regions. This problem is particularly prominent between provinces\
  \ and cities. Therefore, big data traffic should break such information barriers\
  \ and achieve resource sharing to optimize traffic conditions from a macro perspective.\n\
  \n(2) **Fully leveraging aggregation advantages**. Because traffic departments at\
  \ all levels implement an administrative regional autonomy model, and different\
  \ traffic themes are managed by different departments, data is often overly dispersed,\
  \ making it difficult to improve efficiency. The introduction of big data management\
  \ models aims to break information barriers between departments, such as data from\
  \ bus companies, subway companies, taxi companies, and bike-sharing companies, so\
  \ that stations can learn from each other during establishment, thereby improving\
  \ efficiency. This is not only an optimization of traffic management but also an\
  \ optimization of cooperation models between different departments, thereby effectively\
  \ improving administrative efficiency.\n\n(3) **Optimizing resource allocation**.\
  \ Insufficient resource allocation is a shortcoming of traditional traffic management\
  \ systems. Some departments have sufficient staffing and complete monitoring equipment,\
  \ even with idle resources; while other departments, due to a lack of manpower and\
  \ financial resources, cannot effectively carry out traffic management work and\
  \ fully utilize resources. With the help of big data aggregation, resources can\
  \ be effectively centralized to compensate for uneven distribution.\n\nIt can be\
  \ seen that the upgrade of the big data management model lies in \"resource sharing\
  \ and departmental collaboration.\" Only by establishing a sound management system\
  \ and carrying out comprehensive organizational optimization can big data further\
  \ play its role and improve traffic management efficiency.\n\n##### 10.5.3 The Hangzhou\
  \ Model: Comprehensive Utilization of Big Data\n\nCurrently, the big data traffic\
  \ management model in Hangzhou, Zhejiang Province, has gradually become clear, forming\
  \ a new \"One Center, Three Systems\" management model, which effectively integrates\
  \ the city's traffic departments. \"One Center, Three Systems\" refers to the Traffic\
  \ Command Center, the Traffic Management Information System, the Traffic Control\
  \ System, and the Traffic Engineering Information System.\n\nThis management model\
  \ enables traffic management departments in various urban districts to collaborate\
  \ effectively, with the Traffic Police Detachment becoming the main force of ground\
  \ traffic services. Based on platform information, a graded early warning and intervention\
  \ mechanism is implemented on main roads and intersections. At the same time, the\
  \ digital service rooms of traffic police squadrons carry out online patrol duties.\
  \ Through big data applications, traffic problems are detected at computer terminals,\
  \ effectively expanding the coverage of road management. When problems erupt in\
  \ a concentrated manner, joint operations are launched immediately, with the traffic\
  \ police detachment, urban management, urban construction, and other departments\
  \ responding quickly to solve road traffic problems, greatly alleviating traffic\
  \ congestion and ensuring road traffic safety and smooth flow.\n\nThe Hangzhou big\
  \ data traffic management model also actively introduces third-party enterprise\
  \ forces. Data from Didi, Baidu Maps, etc., are also imported into the Hangzhou\
  \ Big Data Traffic Platform and released by the Hangzhou Traffic Police Department.\
  \ For example, with the help of third-party enterprise big data statistics, the\
  \ Hangzhou Traffic Management Department found that as of the end of February 2017,\
  \ the number of female drivers in Hangzhou reached 1.3964 million, accounting for\
  \ 36.3% of the total number of motor vehicle drivers, which can provide data support\
  \ for the formulation of traffic regulations. Parking lot construction, drainage\
  \ planning, and route planning can take the female group into consideration, making\
  \ them more in line with Hangzhou's traffic characteristics.\n\nIn December 2017,\
  \ another major big data traffic event occurred in Hangzhou. On December 2, 23 big\
  \ data enterprises established the Zhejiang Traffic Big Data Maker Space, featuring\
  \ \"Internet + Traffic,\" to serve traffic in Hangzhou and even the whole of Zhejiang\
  \ Province. Among them were not only institutions such as the Zhejiang Provincial\
  \ Traffic Information Center, the Zhejiang Provincial Highway Bureau Settlement\
  \ Center, the Zhejiang Provincial Tourism Information Center, and the Zhejiang Expressway\
  \ Information Engineering Technology Co., Ltd., but also Baidu, Huawei, Alibaba\
  \ Cloud, Prologis, Beijing E-Hualu, Wangshen, and the three major operators, jointly\
  \ constructing a complete new big data management model. In the future, the big\
  \ data management model will inevitably present a collaborative posture of \"departmental\
  \ institutions + third-party enterprises,\" effectively integrating forces from\
  \ all parties to find the key to urban traffic development.\n\n#### 10.6 Big Data\
  \ Traffic Credit Model\n\nThe operation of traffic big data also requires credit\
  \ support. This is because, whether it is data collection, screening, analysis,\
  \ or release, the grassroots masses are often at the receiving end. If information\
  \ frequently deviates, it will inevitably lead to public distrust of big data traffic,\
  \ affecting the operation of big data.\n\n\n\n\n那么，我们应该从什么角度来解决大数据交通的信任问题？\n\n#####\
  \ 10.6.1 多渠道与专业发布\n\n发布大数据时，交通部门除自身平台外，还应与其他渠道合作，特别是官方平台和认证平台，如本地交通广播电台、电视台、车载终端、车辆滚动显示屏、可变情报板和交通警示标志。大数据应及时与这些渠道对接，第一时间发布信息，让公众第一时间了解相关动态。\n\
  \n此外，在公共场所，交通部门还应与区域微信公众平台和微博建立合作关系，向运营商提供相关信息并通过其平台发布数据。必须选择认证平台合作，以确保信息真实有效地推送给公众，提升数据发布的公信力。一旦缺乏与这些渠道的合作，必然导致虚假信息和谣言信息迅速传播，大数据的价值无法体现，进而影响交通管理部门的公信力。\n\
  \n##### 10.6.2 通俗易懂与专业解读\n\n对于大数据交通信息，因涉及专业性，许多内容必须再加工，以便公众轻松理解。但“通俗易懂”不代表“不专业”，否则易引起公众对大数据信息的误解和不信任。\n\
  \n因此，在让大数据通俗易懂的过程中，交通部门还应从专业角度进行解读，让公众了解大数据运行机制并心服口服。例如，发布数据时应强调交通流分析、超时预测和时段识别，公众可通过历史对比看清问题。同时，结合静态照片和动态视频分析路况，让用户感受到有价值的信息，也能看到大数据如何挖掘信息、分析信息、决策，从而大幅提升大数据的信用价值。\n\
  \n一旦建立对大数据的信任，公众将主动参与信息采集。例如，大多数移动 APP 具有定位功能。当公众意识到定位能有效进行数据传输并进一步优化交通路线时，也会主动上传地理位置、开启监控功能，从而推动大数据采集更加完善。\n\
  \n##### 10.6.3 联合公安部门打击谣言\n\n交通关乎公众基本生活，是关注焦点，也是谣言高发区。若交通管理部门不处理这些谣言，易导致虚假信息扩散，严重影响正常交通信息发布，引发对大数据交通管理的质疑。因此，交通部门应主动配合公安部门打击交通谣言，避免虚假信息进一步扩散。\n\
  \n例如，2014 年 7 月，广东省肇庆市广宁县突然传出消息：前一天在广宁县南街镇路段发生重大交通事故，致 4 人死亡，并附 3 张图片。该消息在当地迅速传播，大量网友转发，当地群众质疑交警工作。随后当地交警部门迅速介入，查明这是一起网络谣言。犯罪嫌疑人为出风头，在其\
  \ QQ 空间发布虚假信息。交警部门与公安部门迅速联动，依法拘留嫌疑人，最终辟谣，交警部门形象得以恢复。\n\n对此类事件，交通部门必须严肃对待数据，否则易使公众对交通部门产生负面印象。一旦发生，即便发布准确的大数据信息，也难获公众信任，大数据交通管理的意义将不复存在。\n\
  \n## 第 11 章\n\n## 大数据交通的未来发展\n\n大数据交通发展多年，逐渐成熟，但也面临诸多挑战。且随行业细分，为未来更好服务公众，交通大数据需持续改进技术、持续融合多层级内容与技术，使未来大数据交通更智能、更人性化。\n\
  \n#### 11.1 大数据交通行业的个性化服务\n\n虽中国大数据交通行业因涉及基本民生起步较晚，但在大商业公司快速布局下，行业呈现快速发展势头。过去中国大数据交通需依赖美国等发达国家技术，现已成为行业领跑者，各类新技术、新概念层出不穷。展望行业发展，未来大数据交通行业将进一步渗透至个性化服务，甚至形成“一个人的交通大数据”模式，实现“定制专属服务”。\n\
  \n以下部分个性化服务已进入研发阶段，部分仍处于立项阶段，它们勾勒出大数据交通行业未来的发展方向。\n\n##### 11.1.1 智能车路协同技术\n\n目前中国汽车市场已开始尝试“智能系统”。比亚迪、长安等一系列自主品牌在新车型上尝试车路协同技术。例如，MG\
  \ 汽车引入的“斑马技术”集成多种导航模式，可实时显示当前路况拥堵情况，有效辅助驾驶员重新规划路线、优化路网资源。这是典型的“车路协同”尝试。\n\n但虽有厂商开始尝试，大规模应用尚未全面铺开。特别是高速行驶过程中，远距离环境感知尚不成熟。同时，车路协同标准规范体系未建立，导致技术混乱、系统上线后用户体验不佳。\n\
  \n预计未来几年，“智能车路协同技术”将迎来井喷期，甚至成为汽车标配之一。该技术可有效结合驾驶员，捕捉个人驾驶习惯，结合大数据定制优化驾驶模式和路线规划。\n\n\
  ##### 11.1.2 自动驾驶技术\n\n\n\nAutonomous driving technology is the most watched new\
  \ transportation revolution in recent years. Currently, most automotive enterprises\
  \ worldwide have begun R&D on autonomous driving technology, and China's Baidu has\
  \ successfully launched its own autonomous vehicles, marking a critical step forward\
  \ for autonomous driving.\n\nCompared with traditional driving modes, autonomous\
  \ driving technology relies entirely on big data operations. It is a high-end artificial\
  \ intelligence capable of real-time road condition judgment based on massive map\
  \ data. Compared to manual driving, autonomous driving technology will play an ultimate\
  \ role in routing, driving modes, and emergency avoidance, maximizing the benefits\
  \ of big data. Therefore, future autonomous driving technology will gradually replace\
  \ traditional driving modes, and big data will become the primary \"natural person\"\
  \ of autonomous driving.\n\n##### 11.1.3 Connected Vehicles (Internet of Vehicles)\n\
  \nCompared with vehicle-road coordination technology and autonomous driving technology,\
  \ connected vehicles have seen widespread application. The characteristic of connected\
  \ vehicles is implanting internet capabilities into traditional driving modes, such\
  \ as real-time voice broadcasting of road conditions, voice association between\
  \ mobile phones and vehicles in critical road conditions, rapid payment upon entering\
  \ highways, and intelligent parking payment. Many brand vehicles have integrated\
  \ mobile payment, which is an effective attempt at internet technology.\n\nFor example,\
  \ vehicle health checks are an effective application of big data via the internet.\
  \ Through big data, connected vehicles collect usage data from all users, analyze\
  \ vehicle pros and cons, maintenance cycles, and tire pressure, and send this information\
  \ to owners via onboard screens or mobile Apps. Thus, owners will fully understand\
  \ vehicle conditions and perform timely maintenance, avoiding sudden vehicle breakdowns\
  \ on the road. When vehicles are in healthy condition, traffic accidents will also\
  \ be significantly reduced.\n\n##### 11.1.4 Rapid Promotion of ETC Technology\n\n\
  Currently, ETC technology has been actively and effectively promoted in many provinces.\
  \ It is also a manifestation of personalized services in the big data transportation\
  \ industry. ETC, or Electronic Toll Collection System, is currently the most advanced\
  \ toll collection method in the world. After a vehicle installs an ETC card, it\
  \ can utilize microwave dedicated short-range communication between microwave antennas\
  \ at ETC lanes before highway toll stations, and use computer networking technology\
  \ for backend settlement processing with banks. Vehicles can complete payment without\
  \ waiting, greatly alleviating the queuing and payment problem at highway entrances/exits.\n\
  \nUndoubtedly, ETC technology can be used for traffic optimization, applicable not\
  \ only at highway toll stations but also in scenarios suitable for payment. In the\
  \ future, ETC will further play the role of \"traffic resource optimization,\" deeply\
  \ integrating with bus cards and electronic traffic management cards to achieve\
  \ the goal of \"three cards in one.\" This will further form the \"Transportation\
  \ + Big Data\" model. One card can meet multiple needs such as driving, riding,\
  \ and payment, greatly improving traffic efficiency and alleviating traffic congestion\
  \ and resource waste issues.\n\n##### 11.1.5 Deep Integration with Individuals\n\
  \nSo-called personalized services must be combined with individuals to highlight\
  \ \"non-mass-market\" characteristics, thereby conforming to the definition of personalization.\
  \ The exploration of personalized services in the big data transportation industry\
  \ must be precise down to the individual. With the accumulation of big data, we\
  \ can analyze travelers' daily travel habits, shopping habits, and living habits\
  \ to make precise suggestions and judgments. Even big data can provide unique travel\
  \ modes by analyzing travelers' personalities, physical conditions, and environments.\
  \ For example, for the elderly, big data will quickly push \"sleeper\" travel plans\
  \ based on their physical conditions and living habits; for young people keen on\
  \ exploration, big data will push \"flight + car rental\" combinations. Such personalized\
  \ services can not only provide unique experiences for travelers but also efficiently\
  \ utilize travel time, optimize various transportation modes, and achieve effective\
  \ utilization of traffic resources.\n\n##### 11.1.6 Ride-Hailing \"Going Rural\"\
  \n\nCompared with cities, rural areas have fewer traffic problems, but with the\
  \ continuous development of urbanization, rural traffic issues are becoming increasingly\
  \ prominent. In cities, ride-hailing has become mainstream. It can effectively optimize\
  \ traffic resources, allowing empty-running vehicles to quickly find passengers\
  \ through big data information transmission. The traffic optimization effect is\
  \ very significant. In the future, this taxi model will gradually extend to rural\
  \ areas.\n\nFor example, Guizhou Province has begun trials. Guizhou launched the\
  \ \"Tongcuncun App\" for rural areas, allowing villagers to call nearby taxis and\
  \ buses through it. Simultaneously, the App displays detailed departure times, stops,\
  \ and seat information, and villagers can purchase tickets directly through the\
  \ system. This \"Tongcuncun\" rural version of the ride-hailing model has attracted\
  \ widespread attention from the capital market, and the big data transportation\
  \ industry has begun to penetrate rural areas.\n\nIn addition to the above, the\
  \ big data transportation industry will further solve travel traffic problems from\
  \ a content perspective, such as precise recommendation pushes for personal car\
  \ purchases. As the big data transportation industry becomes increasingly personalized,\
  \ resources can effectively complement each other, road conditions can be effectively\
  \ optimized, thereby creating a new transportation operation system.\n\n#### 11.2\
  \ Expansion Trends of the Big Data Transportation Industry\n\nToday, big data transportation\
  \ has formed a complete industrial system, presenting scaled characteristics in\
  \ theoretical research, product production, and platform services. With the further\
  \ growth of vehicle ownership and rapid urbanization development, the big data transportation\
  \ industry will further expand, gradually penetrating into every detail of life.\
  \ What new industrial upgrade model will big data transportation present in the\
  \ future?\n\n##### 11.2.1 Cross-Border Integration Becomes the General Trend\n\n\
  Residents' travel is highly dependent on taxis. However, the number of taxis in\
  \ most cities is limited, making it difficult to balance supply and demand. Especially\
  \ during peak hours, taxis are nowhere to be found, and even some areas see taxis\
  \ privately raising prices during peak hours. This not only leads to poor user experience\
  \ but also seriously interferes with normal traffic development.\n\nThrough big\
  \ data analysis, we can see a phenomenon in the transportation field: the automobile\
  \ is the entrance to service. If the automobile problem is not solved, the traffic\
  \ problem cannot be solved.\n\n\n\n因此，未来交通运输业将以“汽车”为突破口，通过大数据的链接形成跨界产业发展模式。汽车不仅是简单的出行工具，更是生活服务的入口。例如，汽车可以收集餐饮、住房、出行、购物和娱乐等方面的数据，以了解用户的生活特征。当乘客步入出租车时，大数据系统将迅速进行数据分析，并通过汽车推送乘客信息，从而满足“衣食住行”服务需求。所有场景相互关联，而汽车是关联的出口，大数据将整合万物。\n\
  \n可以预见，大数据交通运输业将继续渗透到娱乐、餐饮和生活服务领域，完成跨界融合，并使汽车的定义产生新的变化。\n\n##### 11.2.2 共享文化的进一步发展\n\
  \n自 2016 年以来，共享文化受到越来越多的关注，其中最受瞩目的是“共享交通”——从最初的共享单车到如今的共享汽车，资本和大众的关注焦点都投射在交通领域。无论是共享单车还是共享汽车，它们只有一个共同目的，即满足居民出行便利和优化社会资源。一辆车可供多人轮流使用，从而最大化交通资源的利用率，这是对低碳生活和城市交通改善的积极探索。\n\
  \n共享交通文化的深化表明，该行业仍有更大的机会待挖掘。国家信息中心也对共享汽车做出过预测：每辆共享汽车可减少 13 辆私家车的购买行为。统计显示，目前私家车日均使用约\
  \ 1.5 小时，停放在车位上的时间长达 20–23 小时。分时租赁可使一辆汽车在路上行驶 6–9 小时，极大地提高了停车效率。这是对城市交通最积极的改善。当共享文化被更多人接受时，交通效率将显著提高，违规占道问题也将在很大程度上得到解决。因此，北京、上海、广州、深圳等一线城市以及其他二线城市的交通主管部门均对这种新出行模式持鼓励态度。\n\
  \n无论是共享单车还是共享汽车，它们都是绿色出行的代表。共享汽车的主流车型为新能源电动汽车，能有效减少空气污染和机动车数量，是传统交通的重要补充。在解决出行问题的同时，还能缓解拥堵的路面交通。当大多数人选择共享汽车并放弃购车时，城市交通将明显改善。\n\
  \n同时，与私家车相比，共享单车和共享汽车在大数据应用方面更为活跃。只有引入大数据技术，用户才能快速找到车辆使用。在应用过程中，大数据持续运行，记录用户的行驶轨迹、行驶频次和行驶时长，进一步丰富大数据库。这些数据可被交通主管部门有效利用，为交通管理提供第一手参考数据。\n\
  \n因此，尽管共享经济目前“如火如荼”，各企业竞相争夺市场，但其市场潜力决定了这里还有更多机会待发掘。这是大数据交通运输业拓展的关键方向之一。\n\n#####\
  \ 11.2.3 大数据智能导航产业的新机遇\n\n导航也是大数据交通运输业的重要组成部分。导航的作用毋庸置疑，它能为车主提供最直接的交通信息服务，优化道路行驶，有效降低交通事故概率，缓解交通压力。\n\
  \n新型智能大数据导航系统不仅能提供地图服务，还能有效打击各类交通违法行为。例如，它能实时告知车主车辆是否超速；当前区域是否可停车；前方存在何种交通事故，预计等待时长多少。目前，许多车辆已安装此类智能导航设备，在道路交通优化中发挥了显著作用。\n\
  \n未来，大数据智能导航的功能将进一步拓展，实现个性化服务。\n\n(1) **对接交通主管部门大数据。** 导航系统将接入交通主管部门的大数据平台。一旦发现即将超速，将立即发出预警提示。同时，交通主管部门可直接向智能导航终端推送信息，为车主提供有效建议。\n\
  \n(2) **更先进的语音识别技术。** 当前大多数导航系统的语音识别效果较差，导致车主需停车输入，严重影响道路通行效率。未来，智能导航系统将大幅提升语音识别能力，甚至能有效识别地方口音，使车主能快速语音输入，从而缩短路边停车时间，避免因停车输入导致的交通拥堵。\n\
  \n在智能导航产业有效拓宽的同时，中国也从政策层面进一步支持大数据智能导航产业。2013 年，国务院办公厅发布《国家卫星导航产业中长期发展规划》，提出“到 2020\
  \ 年，我国卫星导航产业规模将超过 4000 亿元，北斗及其兼容产品将广泛应用于国民经济重要行业和重点领域，并逐步普及到大众消费市场，对国内卫星导航应用市场贡献率达\
  \ 60%，对重要应用领域贡献率达 80% 以上，在国际市场上具有强大竞争力”。这意味着随着卫星技术的不断升级，导航作为衍生产业，必将进入更加蓬勃的发展阶段。预计到\
  \ 2020 年，中国卫星导航产品和服务市场规模有望达到 4000 亿元，这是大数据交通运输业的拓展趋势。\n\n##### 11.2.4 大数据行车记录仪的应用\n\
  \n行车记录仪也是未来需要爆发式发展的产业领域之一。传统行车记录仪只能实现视频拍摄功能，而大数据行车记录仪将直接连接云数据库，使实时拍摄的数据价值得以有效利用。\n\
  \n\n\n例如，当一座城市中成千上万甚至数十万辆汽车配备此类记录仪时，采集到的信息将立即被大型数据库接收，该数据库将根据大数据库的实时图景快速分析城市道路的运行状况。这些数据将形成有效信息，同时发送给所有其他车主，甚至自动设置导航目的地和行驶路线，以预测下一时段的路况信息。这些信息完全是实时采集和分析的，因此具有极大的实用价值。因此，大数据行车记录仪不仅将为道路交通带来有效帮助，还将形成巨大的商业收入。\n\
  \n此外，围绕大数据产生的智能轮胎属于大数据交通产业的一部分。这些产业目前呈现出非常扩张的趋势，将给交通发展带来新的变化。\n\n#### 11.3 大数据交通产业的投融资\n\
  \n行业的持续发展必将形成大规模投融资。大数据交通产业亦是如此，正处于风口阶段，必将引发另一轮投融资热潮。近年来，一系列关于大数据交通产业的新闻无不反映出这一点。\n\
  \n##### 11.3.1 中交兴路与 Inrix 的战略合作\n\n2015 年 2 月，大数据领域爆出一条重磅新闻：`China TransInfo Technology\
  \ Corporation`（中交兴路信息科技集团股份有限公司）与 Inrix 签署战略合作协议，标志着中国大数据交通发展进入新阶段。\n\n为什么中交兴路选择\
  \ Inrix 进行战略合作？\n\n这取决于 Inrix 的技术实力。Inrix 由微软前员工 Brian 和 Chapman 于 2004 年创立。Inrix\
  \ 是一个交通智能平台，致力于将智能数据和先进分析方法带给全球交通难题。截至 2012 年 12 月，其已为 32 个国家的企业提供服务。Inrix 的合作伙伴包括奥迪、德国汽车、荷兰汽车协会、宝马、微软、福特和丰田，均为全球顶尖的大数据交通运营品牌。\n\
  \n凭借与一系列世界顶级汽车品牌建立的合作模式，Inrix 拥有 1 亿辆汽车和设备采集大数据资源，包括出租车、运输车辆、卡车等。借助这些数据，Inrix 建立了完整的大数据信息库，不仅能提供交通路线引导和路况提醒，还能预测全球路况。动态数据帮助\
  \ Inrix 为客户提供一系列服务，甚至包括如何为司机节省燃油时间等细节。\n\n正是基于这种实力，中交兴路选择与 Inrix 战略合作。借助 Inrix 的大数据库能力，中交兴路可快速挖掘国内市场大数据并精准服务交通；借助中交兴路，Inrix\
  \ 也能快速进入中国市场，享受中国交通快速增长带来的红利。\n\n战略合作后，中交兴路在河南洛阳开展了快速业务探索、交通规划设计，并向十余个其他城市拓展业务。除传统道路设计、航空、水运和城际外，道路均纳入其中，实现了交通大数据变现路径、找车位、服务运营等领域的资源积累。\n\
  \n这一事件拉开了大数据交通产业投融资热潮的序幕。越来越多企业看到大数据交通产业潜力巨大、变现渠道丰富，如城市道路设计规划、PPP 模式电子站牌、O2O 变现、电信运营商增值服务等。这些服务可实现数亿利润，深受资本机构青睐。\n\
  \n##### 11.3.2 初创企业融资概率大增\n\n随着大数据交通产业发展潜力无限，拥有强大技术实力的初创企业融资机会也大幅增加。例如，2017 年 7\
  \ 月，杭州元跳科技有限公司成功融资，为企业注入新活力。\n\n与中交兴路相比，元跳科技无疑是大数据交通产业的“后浪”。然而，公司在中科院院士指导下，于 2013\
  \ 年凭借卓越实力创立。拥有由“千人计划”专家、浙江大学教授和博士组成的高端技术团队，因此具备强大创新能力。短短几年，在大数据交通领域取得辉煌成就。其产品包括一体化交通态势分析仪和报警仪，产品体系覆盖“大数据+交通管理”和“大数据+交通”两大方向，并基于大数据分析推出了拥堵治理专项项目。资本机构看中该企业潜力，英华资本与\
  \ SVB Capital China（硅谷银行中国）联合投资，成功完成 5000 万元人民币 A 轮融资，用于引进高端人才和建设“大数据+智能交通”产品体系。\n\
  \n同样，2017 年 6 月，另一家初创企业也成功融资。6 月 20 日，九曲数据完成上海怡森投资的 225 万元天使轮融资。该企业同样基于大数据交通产业，专注于大数据实时管控系统\
  \ SVDM，为客户提供数据可视化和 AI 技术等大数据产品。九曲数据的合作对象是交通管理局。该系统可采集车型、排量、上牌时间等静态数据，结合硬件采集的驾驶行为、位置等信息，融合天气、路况等动态数据，分析每辆车的固定运行路线，从而获得事故分析指标并实时显示在交通管理指挥中心大屏上。这是交通大数据的一次积极尝试。\n\
  \n两家初创企业接连顺利融资，表明大数据交通产业关注度持续升温。若能拿出优秀的大数据交通方案，直接解决交通现存问题，此类初创企业必将备受资本市场青睐。随着初创企业融资成功，大数据交通产业创新将进一步增强。可预见，未来几年中国交通大数据将呈现爆发式发展趋势。\n\
  \n##### 11.3.3 大数据交通产业投资激增\n\n在初创公司持续赢得资本市场青睐的同时，大公司也开始在大数据交通产业领域发力。其中不乏百度、阿里巴巴等互联网巨头。\n\
  \n\n\n\n###### Layout of Baidu, Alibaba, and Tencent in the Big Data Transportation\
  \ Sector\n\nBaidu is undoubtedly the strongest. Baidu Maps and Baidu's driverless\
  \ cars are Baidu Group's direct initiatives to enter the big data transportation\
  \ industry. Subsequently, a series of investments and acquisitions have also been\
  \ advancing rapidly. In November 2017, Baidu announced a strategic investment in\
  \ Shouqi Yueche (Shouqi Limousine & Chauffeur). Baidu Capital, NIO Capital, and\
  \ Silk Road Huachuang led the investment, completing a total financing of 700 million\
  \ RMB. Baidu expressed its attention to the big data transportation industry with\
  \ concrete actions and continues to cultivate this field deeply.\n\nAlibaba's pace\
  \ is also very firm. In October 2017, Alibaba Cloud cooperated with Shanghai Metro\
  \ to develop technologies such as voice ticket purchasing and facial recognition\
  \ entry, and announced its entry into the big data intelligent transportation field.\
  \ Prior to this, Alibaba had accumulated rich experience in the big data transportation\
  \ industry through a series of investments and acquisitions. In 2013, Alibaba showed\
  \ strong interest in the taxi sector, investing successively in the real-time bus\
  \ service provider \"Chelaile\" (Bus Coming) and the commuter shuttle \"Jiewo Yunbanche\"\
  \ (Pick Me Up Cloud Shuttle). At the same time, YITONG Technology and AutoNavi (Gaode\
  \ Map) are also Alibaba's investment brands.\n\nAlibaba's big data technology is\
  \ the leading technology among domestic tech companies. The Alibaba Cloud system\
  \ has established cooperation with numerous commercial institutions, therefore possessing\
  \ extremely high proficiency in the application of transportation big data.\n\n\
  Tencent also has a rapid layout in the big data transportation industry. In December\
  \ 2017, China Marine Information Electronics (Zhonghai Technology) announced cooperation\
  \ with Tencent, whereby Tencent entered the big data intelligent transportation\
  \ market. Tencent values Zhonghai Technology's experience in the transportation\
  \ industry. Relying on Zhejiang University, Zhonghai Technology engages in urban\
  \ rail transit system construction and integrated ticketing system construction,\
  \ having carried out business in subway projects in cities such as Shenyang, Xi'an,\
  \ and Zhengzhou, and successively innovated and developed rail transit driverless\
  \ signaling systems and intelligent train related products. It can be seen that\
  \ Tencent has also been coveting the big data transportation industry for a long\
  \ time.\n\nWhether startups or Internet giants, the participation of an increasing\
  \ number of enterprises in the big data transportation industry means that the industry's\
  \ outbreak period is approaching. Transportation concerns people's livelihood and\
  \ reflects the development vitality and potential of a city; therefore, we have\
  \ reason to believe that the future development of the big data transportation industry\
  \ will become increasingly mature and lead world trends.\n\n#### 11.4 Policy Guidance\
  \ for the Big Data Transportation Industry\n\nThe development of big data transportation\
  \ in the commercial field is in full swing, and the national policy level also pays\
  \ high attention to it, continuously introducing policies to guide and encourage\
  \ industry development.\n\n##### 11.4.1 Clear Support in the \"13th Five-Year Plan\"\
  \n\nIn the \"13th Five-Year Plan\", the goal of building a modern comprehensive\
  \ transportation system and achieving networked and intelligent development prospects\
  \ was clearly proposed. The Outline of the Plan pointed out: \"We must build a comprehensive\
  \ transportation network and realize the integrated connection of transportation\
  \ hubs. We must gradually optimize the spatial layout of comprehensive transportation\
  \ hubs and improve the construction of the three-level comprehensive transportation\
  \ hub system at the national, regional, and local levels.\" To achieve this goal,\
  \ it is necessary to actively access the big data system, form a data system model,\
  \ and effectively connect all links in the transportation field. This Plan Outline\
  \ will further stimulate industry vitality and lay the foundation for future industry\
  \ trends.\n\n##### 11.4.2 The State Council's Guiding Opinions on Actively Promoting\
  \ the \"Internet Plus\" Action\n\nIn 2015, the State Council issued the *Guiding\
  \ Opinions on Actively Promoting the \"Internet Plus\" Action*, making explicit\
  \ elaboration on the application of big data in the transportation field. The Guiding\
  \ Opinions pointed out:\n\n(1) **Innovative Development, Support and Leadership**.\
  \ Fully utilize information technologies such as the Internet, big data, and cloud\
  \ computing to optimize transportation organization models, provide diversified\
  \ products, and better meet diversified needs. Take intelligent transportation development\
  \ as the guide to enhance industry innovation capabilities and cultivate new forms\
  \ and models of business development.\n\n(2) **Market Operation, Quality Improvement\
  \ and Efficiency Enhancement**. Fully exert the initiative of traditional transportation\
  \ enterprises and Internet enterprises, and encourage all-round cooperation in forms\
  \ such as capital operation, technical cooperation, and management cooperation.\
  \ Fully exert technical and market advantages, focus on customers, and improve the\
  \ overall operational efficiency and service quality of the comprehensive transportation\
  \ system.\n\nBy 2018, implement the \"Internet Plus\" Convenient Travel Key Demonstration\
  \ Projects, basically realize the public's access to dynamic road traffic information\
  \ via mobile Internet terminals, and complete the one-stop passenger transport service\
  \ covering navigation, ticket purchasing, and payment, enhancing user travel experience.\
  \ Basically realize the interconnection and interoperability of \"Transportation\
  \ One Card\" in key urban agglomerations and \"Unified Network Management\" of key\
  \ operating vehicles (ships). Promote the accelerated integration of online and\
  \ offline enterprises, and take the lead in realizing \"Single Order System\" (through\
  \ billing) throughout the process in national trunk logistics channels. Realize\
  \ the interconnection and interoperability of transportation infrastructure, vehicles,\
  \ and operation information, making system operation safer and more efficient.\n\
  \nThe focus lies in improving traffic capacity, alleviating traffic congestion,\
  \ reducing emissions, and increasing the national expressway ETC lane coverage rate.\
  \ Improve the convenience of ETC system installation and payment, and increase user\
  \ development volume. Focus on improving the utilization rate of various operating\
  \ vehicles such as roads, vehicles, and taxis, striving to achieve a public bus\
  \ ETC utilization rate of over 50% within three years. Study and promote standard\
  \ box truck ETC. Improve the service level of customer service outlets and provincial\
  \ online settlement centers, and build an efficient settlement system. Promote the\
  \ deep integration of the ETC system with the Internet, and realize the wide application\
  \ of the ETC system in transportation fields such as expressways, urban public transportation,\
  \ taxis, parking, road passenger transport, and railway passenger transport.\n\n\
  \n\n\n各交通运输企业与互联网企业应充分发挥各自优势，鼓励线上线下资源融合，为公众提供多元化、高品质的服务。应挖掘并满足乘客潜在需求，依托线下资源拓展线上业务，延伸服务链条，创新商业模式。应充分发挥互联网个性化需求、及时响应、高效组织等特性，积极整合线下资源，通过定制客运、网约出租车、分时租赁等方式，在城市交通、道路客运、货运、停车、车辆维修等领域发展“互联网+”交通新业态，逐步实现规模化、网络化、品牌化发展，促进大众创业万众创新。鼓励交通运输企业与互联网企业开展战略合作，实现信息资源、资金、技术、业务的深度融合，并与上下游产业链相结合。\n\
  \n##### 11.4.3 交通运输部通知\n\n2015 年 6 月，交通运输部发布《交通运输部办公厅关于进一步加快城市公共交通智能化应用示范工程建设的通知》，进一步推动大数据智能交通发展，并提出明确要求：\n\
  \n为保障城市公共交通智能化应用示范工程有序建设，分类型、分步骤、分阶段推进不同类型城市建设。\n\n(1) 2015 年底前，完成首批 10 个试点城市示范工程主体建设。已申报首批示范工程建设的济南、郑州、大连、哈尔滨、深圳、南京、西安、长沙等省级交通主管部门及北京、重庆市交通主管部门，应以城市为主体，进一步加快示范工程建设进度，于\
  \ 2015 年底前完成示范工程主体建设，包括公共交通数据资源中心、企业运营智能调度平台、行业监管平台、乘客出行信息服务平台，同时确保示范工程建设符合相关标准规范。\n\
  \n(2) 2016 年底前，完成第二批 27 个试点城市示范工程主体建设。已申报第二批示范工程建设的太原、石家庄、青岛、武汉、株洲、贵阳、苏州、乌鲁木齐、杭州、保定、银川、兰州、昆明、宁波、合肥、南昌、新乡、广州、沈阳、西宁、柳州、福州、海口、呼和浩特、长春等省级交通主管部门及上海、天津市交通主管部门，应以城市为主体，加快示范工程开工建设，于\
  \ 2016 年底前完成示范工程主体建设。对未完成示范工程前期工作的试点城市，应加快完成项目可行性研究报告、资金申请报告、初步设计的编制审批工作，并按《交通运输部办公厅关于规范行业信息化建设项目前期工作管理的通知》（交办科技〔2014〕41\
  \ 号）及相关文件要求及时报送交通运输部。\n\n(3) 2017 年 6 月底前，完成 37 个示范城市示范工程建设。\n\n##### 11.4.4 智能交通发展实施方案\n\
  \n2016 年，国家发展改革委、交通运输部印发《关于推进“互联网+”便捷交通促进智能交通发展的实施方案》：\n\n(1) 充分认识推进“互联网+”便捷交通、促进智能交通发展的重要性。以旅客便捷出行、货物高效运输为导向，全面推进交通运输与互联网更宽领域、更深层次融合，为我国交通运输现代化发展提供有力支撑。\n\
  \n(2) 认真组织实施方案落实。各地各部门要加强组织领导，明确责任分工，结合实际主动作为，积极推进重点示范项目实施，抓好任务落实。\n\n(3) 加大资金投入力度。充分发挥政府投资的示范引导作用，充分吸引社会资本参与智能交通建设运营。营造开放包容的发展环境。完善法律法规，鼓励新业态新模式标准化。\n\
  \n(4) 发展改革委、交通运输部统筹组织实施相关工作，加强协调指导，开展重点示范项目督促推进和效果评估，及时总结推广经验。\n\n## 第 12 章\n\n\
  ## 无人驾驶：席卷全球的交通革命\n\n无人驾驶掀起席卷全球的交通革命，开启智能交通新纪元。自动驾驶是交通运输发展的主流趋势，长远来看将颠覆并重塑交通生态。无人驾驶出租车与共享出行、无人驾驶卡车车队将成为常态。城市轨道交通也将实现自动化与无人化。道路将变得更加安全高效。\n\
  \n#### 12.1 无人驾驶技术的起源、发展与应用\n\n##### 12.1.1 无人驾驶开启智能交通新纪元\n\n在蓬勃发展的科技推动下，无人驾驶技术在社会研究中的作用日益重要。基于环境感知技术，无人驾驶汽车可感知车辆周围环境并处理环境信息。无人驾驶技术利用计算机信息技术控制调整车辆速度与行驶方向，保障汽车在道路上正常行驶并到达预定目的地。\n\
  \n\n\n在无人驾驶汽车的开发过程中，精准信息技术已应用于汽车，以发展人车交互，提高了效率并降低了操作复杂性。无人驾驶技术不仅能提高汽车运行效率，还能避免交通事故，为不会开车的人群提供出行服务。\n\
  \n###### 12.1.1.1 无人驾驶技术发展概况\n\n从长远来看，自动驾驶是汽车发展的主流趋势，无人驾驶是自动驾驶的一种表现形式，也是智能交通的重要组成部分。广义上讲，无人驾驶汽车可被视为计算机技术、网络通信技术和智能控制技术在互联网背景下的集成应用。无人驾驶汽车是一种可移动的特种智能机器人，因此该领域许多专家也称其为带自动车轮的移动机器人。\n\
  \n无人驾驶汽车可利用车载传感器实现对周围环境的自动感知，掌握实时路况信息，并通过以智能驾驶装置为核心的智能计算机系统，在无需任何人工干预的情况下将汽车驶往目的地。行驶过程中，无人驾驶汽车可利用配备安全控制功能的系统处理各种突发状况，保障行驶安全。\n\
  \n###### 12.1.1.2 无人驾驶技术应用方向\n\n(1) **高速公路环境下的无人驾驶系统**：高速公路路标标识清晰，此结构化环境下使用的无人驾驶系统需承担跟踪路面标识和自动识别车辆的功能。针对这一更标准化环境下的高速自动驾驶，无人驾驶系统力求实现全自动驾驶级别。这些应用难以推广至其他环境，但若能实现全自动驾驶，便能充分体现无人驾驶应用的价值，因为高速公路驾驶极其危险且枯燥。\n\
  \n(2) **城市环境下的无人驾驶系统**：与高速公路驾驶相比，城市无人驾驶因对车速要求较低且相对更安全，发展前景广阔。目前可分担城市大容量公共交通压力，缓解城市交通紧张状况。具体应用场景包括机场、工业园区、公园、校园或其他公共场所。\n\
  \n(3) **特殊环境下的无人驾驶系统**：部分国家无人驾驶技术较为先进，致力于在军事及其他特殊环境中应用无人技术。这些领域的无人驾驶技术与高速公路及城市环境应用有共性，但在技术性能相关性上存在差异。\n\
  \n###### 12.1.1.3 无人驾驶技术发展瓶颈\n\n无人驾驶汽车多处于实验测试阶段，投入真实复杂交通环境尚有漫漫长途，发展面临诸多瓶颈：法律法规、技术局限、数据泄露、伦理道德等。近期内，无人驾驶汽车不太可能像人类一样思考和决策，保障车辆及车内乘客安全是首要任务。在有人驾驶情况下，若自身生命未受威胁，大多数驾驶员会牺牲自身利益保护他人生命。\n\
  \n例如，前方行人闯红灯，左侧同向来车，右侧有路障，许多驾驶员宁愿撞向右侧路障（虽需花钱修车），也不愿危及闯红灯行人性命。而自动驾驶汽车会判断前方阻力最小，从而直接撞向行人。因此，无人驾驶技术发展之路并不平坦，不仅需要政府、高校、科研机构深度布局，还需广大创业者和企业在市场强大力量推动下积极参与，加速其发展进程，使颠覆性的无人驾驶技术和智能交通真正造福亿万人。\n\
  \n###### 12.1.1.4 无人驾驶技术未来展望\n\n汽车诞生后，汽车工业进步对社会发展做出了积极贡献。依托先进技术手段，无人驾驶有效提高了驾驶安全性和准确性，降低了汽车驾驶交通事故几率。随技术进一步发展成熟，无人驾驶在乘用车和商用车中的应用范围将持续拓宽，在全球范围内掀起革命性浪潮。\n\
  \n中国庞大的人口为汽车工业发展奠定了坚实市场基础，在全球汽车发展中占据重要地位。近年来，国内汽车工业聚焦打造自主品牌产品，为新汽车技术应用创造良机，有利于拓展该新技术在国内汽车领域的应用范围。智能驾驶或将带动整个汽车领域发展，推动商用车进步。从乘用车角度分析，采用智能驾驶技术的商用车可服务于人们日常生活工作，节省更多时间和精力，从而提升生活质量。\n\
  \n例如，若高速公路上的商用车实现无人驾驶，将给驾驶员更多时间与他人交流当前位置和预计到达时间。若物流行业采用无人驾驶，将提高物流中心配送效率，加速整个系统运转。对商用车而言，无人驾驶技术应用可有效为驾驶员提供更多休息时间，避免疲劳驾驶，降低交通事故几率，保障人民生命财产安全。\n\
  \n##### 12.1.2 无人驾驶技术发展的四个阶段\n\n针对汽车主动安全技术的爆发式增长，美国国家公路交通安全管理局（`NHTSA`）于 2013 年发布了汽车自动化五级标准，将车辆自动驾驶功能分为五级：`Level\
  \ 0` 至 `Level 4`。\n\n###### 12.1.2.1 Level 0：无自动化\n\n\n\n\n####### 自动驾驶分级与无人驾驶技术演进路径\n\
  \n## 12.1.2 自动驾驶分级标准\n\n###### 12.1.2.1 Level 0：无自动化\n\nLevel 0 意味着汽车没有任何自动驾驶功能，驾驶员完全控制汽车的所有功能。驾驶汽车时，驾驶员负责汽车的启动、制动和操作，并观察周围路况。只要由人类控制汽车，无论汽车配备了何种驾驶辅助技术，均归类为\
  \ Level 0。因此，尽管普通汽车配备了前向碰撞预警、车道偏离预警、自动雨刮控制和自动大灯控制等功能，但只能由人类控制驾驶，仍归类为 Level 0。\n\n\
  ### 12.1.2.2 Level 1：单一功能自动化\n\nLevel 1 意味着驾驶员负责驾驶安全，但可放弃部分控制权交给系统。此阶段已实现部分功能自动化，如常见的自适应巡航控制、紧急制动辅助、车道保持等。Level\
  \ 1 仅具备单一功能，驾驶员驾驶时仍控制汽车，汽车不能完全自主行驶。\n\n### 12.1.2.3 Level 2：部分自动化\n\nLevel 2 下，汽车可与驾驶员共享控制权。在特定预定义环境中，驾驶员无需控制汽车，汽车可自动工作，但驾驶员始终处于待命状态，负责驾驶安全，随时准备接管车辆。此阶段部分自动化的关键不在于拥有两个以上功能，而在于驾驶员不再是主要操作者。例如，ACC\
  \ 与 LKS 组合形成的跟踪功能，以及特斯拉发明的自动辅助驾驶功能，均属于 Level 2 功能。\n\n### 12.1.2.4 Level 3：有条件自动化\n\
  \n此阶段汽车可在有限情境下自动控制，如在高速公路或车流稀少道路上行驶。遇紧急情况时，驾驶员有足够时间接管车辆以确保安全驾驶。此阶段驾驶员在最大程度上得到解放，驾驶时不再负责驾驶安全，无需持续监控路况。\n\
  \n### 12.1.2.5 Level 4：高度自动化（无人驾驶）\n\n此阶段汽车可在无人协助下，通过预先输入出发和到达信息自主抵达目的地。汽车全程负责驾驶安全，对驾驶员依赖极低，车辆可无乘客行驶。\n\
  \n除 NHTSA 外，美国汽车工程师学会（SAE）也对自动驾驶分级，将自动驾驶技术分为 0 到 5 共六级。其中 Level 0 至 Level 3 与 NHTSA\
  \ 分类一致，分别强调无自动化、驾驶辅助、部分自动化和有条件自动化。针对完全自动化，SAE 进行了细分，进一步强调了对道路和环境驾驶的要求。\n\n根据 SAE\
  \ 关于自动驾驶 Level 4 的规定，汽车仅能在封闭园区、固定行驶路线等特定路况下实现自动化。而 Level 5 则允许在多种环境下自动驾驶，并能对复杂的车辆、行人和路况做出有效响应。\n\
  \n总的来说，不同级别的驾驶功能相应递增。高级驾驶辅助系统（ADAS）属于最高级别的驾驶辅助系统，归属于 Level 0 至 Level 2（见表 12.1）。\n\
  \n其中，Level 0 自动驾驶仅具备传感器检测和决策预警功能；若配备夜视系统，则能检测前方行人、识别交通标志、车辆偏离车道时发出预警等。\n\n**表 12.1\
  \ 从 L0 到 L5 自动驾驶功能递增**\n\n![image](img/tab12.1.jpg)\n\n- Level 1 自动驾驶具备单一控制功能，如主动紧急制动、自适应巡航控制等。\n\
  - Level 2 自动驾驶可执行多重控制功能，如配置 AEB 和 LKA。\n- Level 3 自动驾驶可在特定条件下执行，超出限定条件需将控制权交还人类驾驶员。\n\
  - SAE 定义的 Level 4 允许在特定条件下无人驾驶，如固定路线无人驾驶。\n- SAE 定义的 Level 5 指完全无人驾驶，为最高级别及自动驾驶最终形态，允许在任意场景下无人驾驶。\n\
  \n与半自动化相比，完全自动化无人驾驶汽车更安全，因前者易受人为失误影响，而后者不受其影响。例如，弗吉尼亚理工交通研究所（VTTI）调查显示，Level 3 自动驾驶汽车驾驶员响应车辆接管请求需\
  \ 17 秒，若车速 65 mph，这 17 秒内车辆将行驶 1,621 英尺（约 494 米）。\n\n从发现路面物体到踩下刹车，人类驾驶员需 1.2 秒，远长于车载计算机的\
  \ 0.2 秒。虽仅差 1 秒，但若车速 120 km/h，1.2 秒内车辆行驶 40 米，而 0.2 秒仅 6.7 米。紧急情况下，这 1 秒差距可能关乎乘客生死。因此，对整个汽车行业而言，无人驾驶是自动驾驶的终极目标。\n\
  \n## 12.1.3 无人驾驶技术演进路径\n\n无人驾驶技术是基于传统汽车制造技术的综合技术，融合了智能化、自动化、电动化、网联化等技术。无人驾驶汽车，又称“自动驾驶车辆”或“轮式移动机器人”，通过车载传感器系统感知周边路况环境，对行驶路线进行合理规划，控制车辆驶向预定目的地。无人驾驶汽车是自动控制、人工智能、模式识别、视觉计算等多项技术发展的产物，也是计算机科学、模式识别、智能控制技术发展到一定阶段的产物，现被视为衡量一国科研实力和经济发展水平的重要指标，未来可广泛应用于国防、国民经济等领域。\n\
  \n中国人口众多，交通问题严峻。若无人驾驶技术全面推广，将尽快解决城市交通拥堵、环境问题和城市发展难题，有效提升工业制造水平，改善民生。随着无人驾驶技术逐渐成熟，交通管理部门须做好准备，推动无人驾驶技术融入智能交通，实现全面发展。\n\
  \n\n\n\nIn recent years, domestic and foreign high-tech enterprises and traditional\
  \ automobile manufacturers have actively deployed in the field of autonomous driving,\
  \ giving rise to numerous products, many of which have passed road tests, with some\
  \ test mileages reaching hundreds of thousands of kilometers, laying a solid foundation\
  \ for the commercial mass production of autonomous vehicles. It is said that intelligent\
  \ connected vehicles will become the industry with the greatest potential in the\
  \ future. Analysis of plans released by major automakers and internet companies\
  \ shows that the first year of commercialization of autonomous vehicles is approaching,\
  \ followed by a stage of explosive growth.\n\nOverall, there are two development\
  \ paths for autonomous vehicles: one is ADAS (Advanced Driver Assistance Systems),\
  \ and the other is Artificial Intelligence. The highest forms of ADAS and Artificial\
  \ Intelligence converge on the same goal, both pointing to fully autonomous driving,\
  \ that is, fully autonomous driving is the result of the development of automation\
  \ and intelligence to the highest stage.\n\nIn the future, the automotive industry\
  \ will inevitably continue to evolve in the direction of intelligent vehicles, ultimately\
  \ achieving autonomous driving. Autonomous vehicles bear the mission of reducing\
  \ traffic accidents, alleviating congestion, and reducing environmental pollution,\
  \ but also face challenges such as safe driving, cognitive popularization, and legal\
  \ ethics. Experts predict that autonomous driving will become a reality, and the\
  \ market size will reach 87 billion US dollars by 2030. At that time, what kind\
  \ of application value will autonomous driving technology achieve?\n\nThe ultimate\
  \ goal of intelligent vehicles is to achieve autonomous driving. The application\
  \ of autonomous driving technology can meet three major potential needs: the perception,\
  \ connectivity, and personalization of automobiles. The popularization of autonomous\
  \ driving technology requires the construction of an intelligent vehicle standard\
  \ system and an intelligent transportation system, ultimately achieving car sharing,\
  \ alleviating congestion, reducing pollution, and thoroughly releasing the productivity\
  \ of humans and vehicles.\n\n## 12.1.3.1 Application of Autonomous Driving Technology\n\
  \nThe application of autonomous driving technology needs to respond to three major\
  \ potential needs:\n1. **Perception Needs** (Mapping the physical world to the digital\
  \ world): Achieving understanding between humans and devices through structured\
  \ data, covering three dimensions: human perception of vehicle, vehicle perception\
  \ of human, and vehicle perception of environment.\n2. **Connectivity Needs**: Realizing\
  \ interconnection of heterogeneous devices such as smartphones, smart wearables,\
  \ and intelligent vehicles.\n3. **Personalization Needs**: Future vehicles will\
  \ evolve into intelligent robots, not only responding to commands but also anticipating\
  \ needs and recommending lifestyle services.\n\n## 12.1.3.2 Promotion of Autonomous\
  \ Driving Technology\n\nThe key to promotion lies in:\n- Improving intelligent vehicle\
  \ standards, regulations, and intelligent transportation systems\n- Strengthening\
  \ industrial collaboration among information, electronics, transportation, and internet\
  \ sectors\n- Coordinating technology trends, software/hardware interfaces, data\
  \ protocols, platform security, and international standards to build a Chinese-characteristic\
  \ standard system\n- Accelerating pilot demonstrations, building intelligent road\
  \ networks, issuing regulations, and clarifying liability attribution for autonomous\
  \ driving accidents\n\n## 12.1.3.3 Mission of Autonomous Driving Technology\n\n\
  Supported by autonomous driving technology, shared cars will combine the functions\
  \ of public transportation and services. With popularization, the demand for private\
  \ car purchases will decline, congestion and parking difficulties will be alleviated,\
  \ and greenhouse gas emissions will be significantly reduced. Combined with the\
  \ timeliness, safety, and precision of shared cars, autonomous driving technology\
  \ not only reduces accident rates but also allows unlicensed individuals, carless\
  \ individuals, the elderly, and the disabled to enjoy the pleasure of travel, comprehensively\
  \ releasing human time and productivity.\n\n## 12.1.4 Autonomous Driving Disrupts\
  \ and Reshapes the Transportation Ecology\n\nEcology refers to the conditions for\
  \ biological survival and their interrelationships; transportation ecology refers\
  \ to the internal associations of elements such as vehicles and roads and their\
  \ associations with the external environment. Currently, China's transportation\
  \ ecology faces stubborn problems such as frequent accidents, urban congestion,\
  \ and air pollution, and autonomous driving technology brings new ideas and solutions.\n\
  \nPredictions show that autonomous vehicles will fully enter the market in 2021,\
  \ reshaping the industrial landscape and promoting the transformation and upgrading\
  \ of the automotive industry. Data from the World Economic Forum indicates that\
  \ the digital transformation of the automotive industry will create over 67 billion\
  \ US dollars in value, with social benefits reaching 3.1 trillion US dollars, covering\
  \ autonomous vehicle optimization, passenger connectivity, and whole-ecology enhancement.\n\
  \nIn the coming decades, the market potential for semi-automated and fully automated\
  \ vehicles is huge. It is estimated that by 2035, China's automated driving vehicles\
  \ will reach 8.6 million, including 3.4 million fully automated and 5.2 million\
  \ semi-automated vehicles.\n\nIndustry authorities predict that the annual revenue\
  \ of China's automobile sales, public transport, taxis, and related services is\
  \ about 1.5 trillion US dollars. Boston Consulting predicts that it will take 15-20\
  \ years for autonomous vehicles to account for 25% of the global vehicle market;\
  \ if they go on the market in 2021, the target will be reached by 2035-2040.\n\n\
  \n\n\n# 12.1.4 无人驾驶汽车对汽车工业的影响\n\n正是由于无人驾驶汽车产生了前所未有的影响，它们正在引起汽车工业的巨大变革。相关研究表明，随着无人驾驶汽车的出现，高速公路安全将大幅提升，空气污染和交通拥堵将得到有效缓解。\n\
  \n## 12.1.4.1 提升高速公路安全\n\n如今，高速公路事故是困扰世界的一个主要问题。据统计，在美国，每年约有 35,000 人死于车祸；在中国，每年约有\
  \ 260,000 人死于车祸；在日本，每年约有 4,000 人死于高速公路事故。根据世界卫生组织的数据，全球每年因高速公路事故死亡的人数高达 124 万。\n\
  \n据统计，因致命车祸造成的年损失高达 2600 亿美元，因车祸受伤造成的损失高达 3560 亿美元，因高速公路事故造成的年损失约为 6250 亿美元。根据兰德公司的一项调查，在导致致命交通事故的各种因素中，酒驾占比\
  \ 39%。在这方面，无人驾驶汽车的广泛应用将有效扭转这一局面，减少甚至避免车祸伤亡。此外，根据交通部门发布的数据，中国所有交通事故中 60% 是由行人、自行车、电动自行车与汽车、卡车之间的碰撞引起的。人为错误导致了美国约\
  \ 94% 的机动车事故。\n\n美国公路安全保险协会的研究表明，随着自动安全装置（碰撞制动系统、碰撞预警系统、车道偏离预警、盲点检测等）的安装，汽车在高速公路上行驶将更安全，高速公路事故死亡人数可减少\
  \ 31%——即每年可防止约 11,000 人死于交通事故。\n\n## 12.1.4.2 缓解交通拥堵\n\n交通拥堵是大城市的一种“流行病”。在美国，每位司机每年因交通拥堵被困在路上的时间约为\
  \ 40 小时，交通拥堵的成本约为 1210 亿美元。在莫斯科和里约热内卢等大城市，因交通拥堵浪费的时间甚至更甚，每位司机每年在交通拥堵中浪费的时间超过 100\
  \ 小时。在中国，汽车保有量超过 100 万辆的城市约有 35 个，超过 200 万辆的城市有 10 个；大城市城区约 75% 的道路处于拥堵状态。私家车数量现已达到\
  \ 1.26 亿辆，比上一年增长 15%。\n\n唐纳德·舒普的研究发现，大城市城区 30% 的交通拥堵是由司机来回绕行寻找停车位引起的。这正是导致交通拥堵和空气污染的因素，因为\
  \ 30% 的二氧化碳排放来自汽车，而二氧化碳被认为是导致气候变化的元凶。此外，据估计，23%–45% 的交通拥堵发生在路口。由于红绿灯和停车标志是固定的，时间间隔是预先设定的，它们无法顾及各个方向的交通流量，难以真正发挥调节交通流的作用。\n\
  \n随着无人驾驶汽车在交通流中所占比例的增加，车载传感器将与智能交通系统相结合，以优化路口的交通流量。红绿灯的时间间隔将根据各方向的交通流量自动调整，从而提高路口车辆通行效率，为解决交通拥堵问题提供有效方案。\n\
  \n## 12.1.4.3 减少空气污染\n\n汽车是空气污染的一个非常重要的来源。根据兰德公司的研究（James M. Anderson, Nidhi Kalra,\
  \ Karlyn D. Stanley, Paul Sorensen, Constantine Samaras, Tobi A. Oluwatola 等人著 [www.rand.org/t/RR443-2](http://www.rand.org/t/RR443-2)），与人工驾驶相比，无人驾驶技术通过更平稳的加速和减速，可将燃油效率提高\
  \ 4% 至 10%。据调查，工业区的雾霾与汽车数量密切相关，一些研究证明，被迫在红灯或交通拥堵中停车的汽车排放的尾气比正常行驶时高出 40%。无人驾驶汽车数量的增加可以在很大程度上缓解空气污染。\n\
  \n无人驾驶汽车共享系统可能有助于实现节能。德克萨斯大学奥斯汀分校的研究人员对一氧化碳、二氧化硫、氮氧化物、挥发性有机化合物、细颗粒物和温室气体进行了研究，发现无人驾驶汽车共享系统可以节能并减少多种污染物的排放。\n\
  \nUber 发现，洛杉矶 30% 的乘客和旧金山 50% 的乘客选择拼车。全球约有 20% 的乘客选择拼车。无论是无人驾驶汽车还是传统汽车，选择拼车的乘客越多，环境效益越好，交通拥堵缓解得越多。因为拼车改变了“一车一人”的出行模式，空气质量得到了有效改善。\n\
  \n#### 12.2 全球分布：争夺无人驾驶制高点\n\n##### 12.2.1 全球无人驾驶产业竞争格局\n\n无人驾驶汽车是一种智能汽车，也称为轮式移动机器人，它主要依靠车内的智能驾驶员使无人驾驶成为现实。\n\
  \n简单来说，无人驾驶汽车在高精度地图的基础上，辅以车载感知设备采集的数据，借助智能算法成功识别、决策操作以控制车辆，从而实现了车辆的自动驾驶。从无人驾驶汽车的工作原理可以看出，无人驾驶技术是人工智能、车辆制动、环境识别等各领域技术成果的集成，为汽车、智能芯片、传感器和地图导航市场带来了新的发展机遇。\n\
  \n###### 12.2.1.1 从加利福尼亚州道路测试资质看无人驾驶产业\n\n目前，加利福尼亚州是全球首个通过无人驾驶立法的地区，也是全球无人驾驶汽车的首选测试场地。负责监管美国汽车安全的美国国家公路交通安全管理总局总部设在加利福尼亚州。因其开放性、权威性和包容性，加利福尼亚州已成为全球无人驾驶汽车的领先测试场地。\n\
  \n加利福尼亚州机动车管理局（DMV）向无人驾驶汽车公司颁发加利福尼亚州无人驾驶道路测试许可，允许其在特定公共道路上测试无人驾驶汽车。2014 年 9 月，DMV\
  \ 颁发了首批无人驾驶道路测试许可（见图 12.1）。迄今为止，全球已有 45 家公司获得无人驾驶道路测试许可，这些公司涵盖了传统车企、零部件供应商、科技巨头和初创企业等多元化企业群体。\n\
  \n![image](img/fig12.1.jpg)\n\n\n\n\n\n####### 图 12.1 加利福尼亚州无人驾驶路测许可发放数量加速增长。\n\n\
  全球无人驾驶产业正以日益加快的速度增长。2014 年，有 7 家公司获得加利福尼亚州无人驾驶路测许可；2015 年为 4 家；2016 年为 9 家；2017\
  \ 年激增至 25 家。仅 2017 年一年获许可的公司数量占总数的一半以上，显示出爆发式增长趋势。这一现象表明，无人驾驶产业正以日益加快的速度增长，全球主要企业纷纷聚焦无人驾驶汽车研究，该领域竞争日益激烈。\n\
  \n随着智能网联汽车技术路线图的发布，无人驾驶汽车的核心技术将进一步明确。依托智能网联路线图，无人驾驶所需的核心技术将进一步清晰化，整个产业将向网联化及其他无人驾驶核心技术迈进。\n\
  \n前瞻产业研究院发布的*《中国无人驾驶行业发展前景与投资战略规划分析报告》*显示，到 2025 年，无人驾驶市场规模将达到 2000 亿美元至 1.9 万亿美元。到\
  \ 2035 年，全球无人驾驶汽车销量将达 1180 万辆。2025 年至 2035 年间，无人驾驶汽车复合年增长率将达 48.35%，届时中国在全球无人驾驶汽车市场中的份额将达到\
  \ 24%。\n\n###### 12.2.1.2 全球自动驾驶渗透率将快速提升，市场空间或超千亿美元\n\nSAE 将自动驾驶分为六个等级：L0 级为完全人工驾驶，L5\
  \ 级为完全无人驾驶，中间等级为不同程度的人工驾驶与自动驾驶结合。目前，L1 级和 L2 级自动驾驶技术已相对成熟，L3 级自动驾驶技术将实现量产，而 L5 级完全无人驾驶还需十年以上才能实现产业化。预计在不久的将来，全球自动驾驶渗透率将快速提升。据预测，到\
  \ 2020 年，L1 级和 L2 级自动驾驶渗透率将达到 40%；到 2025 年，预计 20% 以上的量产车将实现不同等级的自动驾驶；到 2040 年，所有新生产汽车都将配备自动驾驶功能，其中\
  \ L4 级和 L5 级自动驾驶汽车渗透率将达 50%，相应市场规模将超过千亿美元（见图 12.2）。\n\n![image](img/fig12.2.jpg)\n\
  \n图 12.2 不同等级无人驾驶汽车渗透率。\n\n表 12.2 加利福尼亚州路测许可发放时间表\n\n| 发放时间 | 公司 |\n| --- | ---\
  \ |\n| 2014 | 大众、梅赛德斯-奔驰、Google Waymo、Delphi、特斯拉、博世、日产 |\n| 2015 | 通用、宝马、本田、福特 |\n\
  | 2016 | Zoox、Drive.ai、Faraday Future、百度、Wheelgo、Valeo、蔚来、Telenav、Nvidia |\n| 2017\
  \ | AutoX、斯巴鲁、Udacity、Navya、Renovo、Uber、PlusAI、Nuro、CarOne、苹果、Bauer、小马智行、图森未来、竞驰、上汽、Almotive、Nullmax、三星、Voyage、大陆集团、CYNGN、Roadster、长安、Lyft\
  \ |\n\n###### 12.2.1.3 初创企业是全球无人驾驶产业推动多产业融合的重要力量\n\n截至 2017 年底，已有 45 家公司获得加利福尼亚州无人驾驶许可，其中\
  \ 11 家为传统汽车制造商，如大众、通用、长安等；6 家为汽车零部件供应商，包括 Delphi、Valeo、大陆集团、博世等；7 家为科技巨头，如苹果、特斯拉、NVIDIA\
  \ 等；21 家为初创企业，如 Zoox、Drive.ai、Celeste、小马智行等（见表 12.2），初创企业占比 47%，接近半数，成为全球无人驾驶产业的重要参与者（见图\
  \ 12.3）。\n\n![image](img/fig12.3.jpg)\n\n图 12.3 初创企业占比最大。\n\n由此可以判断，未来汽车技术或将朝着机械、电子、通信与人工智能深度融合的方向发展。传统车企、名校及科技巨头将催生更多初创团队，凭借其跨界背景有望实现快速发展。\n\
  \n###### 12.2.1.4 初创企业高速发展重塑无人驾驶产业竞争格局\n\n2014 年和 2015 年，无初创企业获得加利福尼亚州无人驾驶牌照；2016\
  \ 年，5 家初创企业获牌，占总数 56%；2017 年，16 家初创企业获牌，占总数 64%，显示出该领域快速发展趋势。初创企业因刚进入行业、包袱轻，有望实现跨越式增长。因此可以判断，初创企业最有可能凭借其优势，在无人驾驶汽车制造与运营、系统解决方案、关键零部件等领域占据重要位置。\n\
  \n##### 12.2.2 全球无人驾驶技术发展现状\n\n交通技术的持续发展给人们出行带来极大便利，汽车更新迭代速度日益加快。除了要求强劲动力、个性化设计、良好人车交互体验外，还在环保、安全、智能等方面提出更高要求。在此背景下，无人驾驶技术应用前景广阔，是汽车产业主流趋势。\n\
  \n###### 12.2.2.1 国外无人驾驶技术发展\n\n西方发达国家对无人驾驶汽车的研究始于 20 世纪 70 年代，在可行性与实用性方面取得重大突破。至\
  \ 20 世纪 80 年代末至 90 年代初，因预期目标过于复杂、技术条件不成熟，许多国家脱离无人驾驶汽车研究项目，转向高速公路民用车辆辅助驾驶项目。这一时期的无人驾驶汽车属于半自动驾驶车辆，与真正的无人驾驶汽车尚有较大差距。\n\
  \n直到 1999 年，美国卡内基梅隆大学研发的无人驾驶汽车成功横跨美国东西部部分路段。在 5000 公里洲际公路上，车辆以 50-60 公里/小时速度自主行驶了\
  \ 96% 以上里程，标志着无人驾驶汽车项目取得成功。\n\n2000 年，丰田汽车公司开发出无人驾驶巴士，并构建了由道路引导、防追尾、车队行驶、运营管理等组成的自动驾驶系统。2007\
  \ 年，德国推出无人驾驶汽车 Lux，该车由普通汽车改装而成，采用激光传感器技术、智能计算机和全球定位装置。无人驾驶 Lux 能应对复杂路况，在城市高速公路系统中自动行驶。\n\
  \n\n\n\n\n####### 无人驾驶技术的发展与商业应用前景\n\n## 12.2.2 无人驾驶技术的发展历程\n\n2010 年，柏林自由大学 Rogas\
  \ 教授领导的团队改装了一辆大众 Passat，开发出一辆无人驾驶汽车，能够准确识别道路上的其他人员和车辆，甚至在隧道中也能实现。该无人驾驶汽车利用摄像头、激光扫描仪、热传感器、卫星导航等技术和设备，可根据红绿灯调整汽车的行驶状态。\n\
  \n为了采用更科学合理的驾驶策略以应对路况，无人驾驶汽车通常需要在车载计算机中构建 3D 图像。无人驾驶汽车可通过对路况、车辆位置等数据的分析，为汽车制定科学合理的行驶路线，为乘客或控制者提供预计到达时间。\n\
  \n2010 年，伦敦希思罗机场启用了名为 Uterra 的无人驾驶汽车，该车由布里斯托大学与交通系统领域的多家先进公司联合开发，但需在专用道路上行驶。\n\n\
  法国 INRIA 公司开发的无人驾驶汽车 Saikabo 相对成熟，应用了先进的 GPS 全球定位技术，并配备触摸屏，乘客或控制者可通过触摸屏规划行驶路线。同时，双目摄像头能准确识别路标，在物联网和移动互联网的帮助下实现车车、车路、车人互动，促进交通信息自由流动共享，缓解交通拥堵，提升交通网络通行能力。\n\
  \n### 12.2.2.2 中国无人驾驶技术的发展\n\n中国国防科技大学（NUDT）于 1989 年研制出第一辆智能汽车；1992 年研制出第一辆真正的无人驾驶汽车，中国无人驾驶汽车技术的研发正式启动并进入探索阶段。\n\
  \n由上海交通大学牵头的城市无人驾驶汽车项目“Cyber C3”智能汽车，主要在非主干城市道路等非结构化道路上行驶（路型和环境背景复杂、车道线和道路边界不清晰），平均时速低于\
  \ 10 km/h，具备自动定位、导航、驾驶、避障和交互能力。\n\n西安交通大学郑南宁教授团队于 2001 年底启动无人驾驶智能汽车项目，2002 年推出“无人驾驶汽车思源\
  \ 1 号”，2005 年思源 1 号成功完成校园路况环境测试，随后项目组尝试让思源 1 号智能汽车走出校园。随之制定了“新丝绸之路挑战计划”，让思源 1 号从西安自动行驶至敦煌，但实际测试中发现思源\
  \ 1 号难以适应真实交通环境。经过十余年研究，思源 1 号逐步实现重大突破：可从特定路段行驶至复杂路况、从直线行驶实现转弯和超车，车速从 10–15 km/h\
  \ 提升至 70–80 km/h。\n\n2011 年，一汽红旗 HQ3 无人驾驶汽车完成 286 km 路测；2015 年，百度无人驾驶汽车完成北京开放高速公路自动驾驶测试；2016\
  \ 年，长安无人驾驶汽车完成 2000 km 超长距离无人驾驶测试，均标志着中国无人驾驶技术日趋成熟。\n\n在无人驾驶技术快速发展过程中涌现出许多新技术。据汤森路透知识产权与技术报告，2010\
  \ 年至 2015 年出现 22,000 项与无人驾驶技术相关的专利，许多技术已投入使用。特别是在深度学习算法和云服务技术的支持下，无人驾驶技术发展日益加速。\n\
  \n## 12.2.3 无人驾驶商业应用的全球前景\n\n无人驾驶汽车初期制造成本较高，因需安装雷达、摄像头和人工智能系统，价格自然昂贵，普通消费者难以承担。因此，首批使用无人驾驶汽车的将是部分特种行业和特殊群体，如快递行业、工业企业、出租车、老年或残疾人服务等。\n\
  \n### 12.2.3.1 公共交通\n\n未来公共交通行业将大规模采用无人驾驶汽车。据德克萨斯大学奥斯汀分校关于共享无人驾驶汽车（SAV）的研究，一辆共享\
  \ SAV 可替代 11 辆传统汽车，并使运营里程至少增加 10%。这意味着随着共享 SAV 的普及，交通拥堵可得到有效缓解，环境恶化可得到有效控制，凭借使用便利性，共享\
  \ SAV 将成为人们首选的出行方式。\n\n为推广无人驾驶汽车，一些城市规划为无人驾驶汽车指定专用街区，实现有人驾驶车辆与无人驾驶车辆分时或分道行驶，由无人驾驶出租车和共享\
  \ SAV 承担为用户提供所有交通服务的责任。为给无人驾驶汽车创造良好运行环境，城市规划部门将实施区域优化。\n\n### 12.2.3.2 快递车辆与工业应用\n\
  \n无人驾驶汽车也将在快递行业的排队卡车领域得到广泛应用。随着互联网电商的快速发展，快递公司迅速涌现。网购消费者总希望在最短时间内收到货物，特别是生鲜水果等食品，希望快递公司能在几小时内送货上门。据商务部数据，2018\
  \ 年上半年中国电商行业销售额达 4.08 万亿元，快递包裹总量已超 2015 年全年业务量，众多电商企业承诺当日达，进一步推动了电动汽车和卡车配送的发展。\n\
  \n电动汽车和卡车数量的增加在一定程度上加剧了交通事故。据调查，在美国，卡车行驶里程占机动车总行驶里程的 5.6%，但卡车引发的交通死亡人数占交通事故死亡总数的\
  \ 9.5%。一般来说，大型卡车生产成本超过 15 万美元，若加装摄像头和传感器成本更高。相比之下，小型汽车固有生产成本较低。因此，受成本制约，早期难以大规模采用无人驾驶卡车。\n\
  \n### 12.2.3.3 老年人与残疾人\n\n目前，无人驾驶汽车已大规模应用于老年人和残疾人两大群体。因身体机能限制，老年人和残疾人面临出行不便问题，无人驾驶汽车的使用可帮助这两类人群解决出行难题。\n\
  \n\n\n\n预计到 2050 年，美国老年人口将超过 8000 万，占总人口的 20% 以上，其中三分之一将面临出行问题，中国情况类似。到 2050 年，中国老年人口预计将占总人口的\
  \ 33%。在日本，预计到 2060 年，老年人占总人口的比例将达到 40%。同时，残障人士群体规模庞大。例如，美国约有 5300 万残疾人，占成年人口的 22%。约\
  \ 13% 的美国成年人有行动障碍，4.6% 有视力障碍。\n\n这些残障人士和老年人为无人驾驶汽车的推广提供了广阔的市场，这两个群体都寻求独立，希望能自由出行。正是无人驾驶汽车能够精准满足他们的需求，让他们独立生活，保持积极乐观的生活态度。\n\
  \n## 12.2.4 世界领先企业的无人驾驶汽车研发\n\n近年来，互联网、人工智能等技术的发展为无人驾驶汽车的发展奠定了技术基础，世界领先的互联网公司和汽车巨头凭借在无人驾驶领域积累的技术优势，为无人驾驶汽车的发展建立了一定的竞争壁垒。\n\
  \n### 12.2.4.1 特斯拉计划实现全无人驾驶\n\n电动汽车制造商特斯拉在驾驶辅助技术和无人驾驶技术领域处于领先地位，其 CEO 埃隆·马斯克认为完全无人驾驶技术大有可为，完全无人驾驶可在\
  \ 2 到 3 年内实现，而监管审批还需要 1 到 5 年。2015 年 10 月，特斯拉在 Model S 上安装了 Autopilot 软件，使车辆能够自动转向、变道和停车，但特斯拉在\
  \ 2016 年夏季因 Autopilot 发生的首起交通死亡事故受到批评，尽管在 Autopilot 本身未发现安全缺陷。\n\n事故发生后，特斯拉与 Mobileye\
  \ 断绝关系，并开始致力于加强对雷达和摄像头系统开发的控制。特斯拉向公众承诺提供半无人驾驶和全无人驾驶服务。其 Model 3 已收到 40 万订单。特斯拉还拒绝了与\
  \ Uber 合作开发无人驾驶汽车。\n\n自 2016 年 10 月起，特斯拉生产的所有汽车都配备了新的传感器和计算机软件包 Autopilot Hardware\
  \ 2，当软件成熟时将使汽车实现全无人驾驶。该系统用 Nvidia 的 DrivePX2 取代了 Mobileye 的 EyeQ3，用户需付费激活才能享受全无人驾驶功能。根据用户反馈，Autopilot\
  \ 2.0 软件初期应用效果不佳，但系统此后已更新改进。\n\n特斯拉延续了以往的作风，承诺公众在 2017 年底前交付无人驾驶功能并发布该功能。公司改变了以往的数据收集策略，利用客户的车载摄像头收集视频信息以创建新系统。特斯拉无人驾驶用户协议还规定，想要从共享车辆中获益的客户只能在特斯拉网络上交易。此外，特斯拉收购了\
  \ SolarCity，以创建完整的可持续交通生态系统。\n\n### 12.2.4.2 沃尔沃计划 2021 年实现自动驾驶\n\n在自动驾驶乘用车领域，沃尔沃取得了巨大进展。沃尔沃在安全技术创新领域享有盛誉，将与自动驾驶汽车相关的技术称为“智能安全”，希望利用这些功能将沃尔沃汽车致命事故发生率降至零。早在\
  \ 2017 年，沃尔沃成功向瑞典的 100 位客户提供了配备自动驾驶功能的 XC90 SUV，尽管在自动驾驶区域、时间和条件方面存在诸多限制。\n\n沃尔沃承诺，如果车辆在自动驾驶模式下发生事故，将承担全部责任，并宣布将自动驾驶计划扩展至美国和中国。沃尔沃与宝马等竞争对手保持同步，并设定\
  \ 2021 年为全面部署自动驾驶汽车的最后期限。\n\n在跟上竞争对手的同时，沃尔沃也在积极寻找合作伙伴，与瑞典的 Autoliv 合作组建自动驾驶合资企业\
  \ Zenuity，计划率先商业化驾驶辅助系统，并于 2019 年向其他汽车制造商提供。\n\n### 12.2.4.3 百度计划分拆自动驾驶汽车业务实现量产\n\
  \n从 2015 年起，百度开展了无人驾驶技术的公开测试。2016 年 11 月，百度邀请公众乘坐电动自制无人驾驶汽车体验无人驾驶技术测试，为期一周。同时，百度还获得了加利福尼亚州无人驾驶汽车自主测试许可。2016\
  \ 年 6 月，百度宣布希望在五年内实现自动驾驶汽车量产，为此在硅谷设立了 AI 研究实验室。2018 年 9 月，百度启动无人驾驶出行基金项目，总项目价值 15\
  \ 亿美元。百度总部计划小批量生产无人驾驶汽车，并计划于 2021 年大规模量产无人驾驶汽车。\n\n### 12.2.4.4 奥迪成立自动驾驶子公司\n\n\
  奥迪基于 A7 和 RS7 车型发布了多款自动驾驶汽车原型，部分车辆已开始面向消费者测试。2016 年 7 月底，奥迪成立了自己的子公司 SDS，专门开发无人驾驶技术，借此加入无人驾驶领域竞争。2017\
  \ 年 4 月，奥迪聘请特斯拉前自动导航项目负责人担任 Autopilot 部门 CTO，凸显了奥迪进军无人驾驶领域的决心。\n\n根据奥迪的发展规划，A8 旗舰轿车上的自动驾驶技术将实现商业化。L3\
  \ 级自动驾驶功能被定义为“特定条件下的自动驾驶”，商业应用需经监管部门批准。作为大众的豪华品牌，奥迪进军自动驾驶领域意义重大。\n\n奥迪、戴姆勒和宝马合作组建财团，斥资\
  \ 31 亿美元收购了诺基亚 HERE Maps 的精准定位资产。近年来，HERE 正加速推进车辆传感器数据收集和传输的标准化计划。\n\n### 12.2.4.5\
  \ 微软寻求与车企合作\n\n微软也参与了自动驾驶汽车研究，初期策略是合作。例如，2015 年 11 月，微软达成协议，利用其 HoloLens 技术与沃尔沃合作开发自动驾驶汽车。\n\
  \n\n\n2016 年 3 月，微软宣布扩大与丰田为期五年的合作伙伴关系，为丰田在机器人、自动驾驶、人工智能及其他领域的研究提供强有力支持。到 2016 年\
  \ 6 月，微软的战略仍是为合作伙伴公司提供技术支持，尚未推出自己的研发战略。微软自身的 Azure 云业务因其汽车客户业务而实现了快速增长。据相关报道，微软还参与了此前由宝马、戴姆勒和大众掌握的\
  \ HERE 高精地图服务，并持有一定股份。\n\n## 12.2.4.6 丰田的“守护天使”\n\n2014 年，丰田发布声明称出于安全原因不会开发无人驾驶汽车，此后这一立场已逆转。2015\
  \ 年，丰田宣布投资 10 亿美元用于无人驾驶汽车的开发，并成立了丰田研究院（TRI）研究无人驾驶技术，聘请了斯坦福大学和麻省理工学院的教授及研究人员，并邀请无人驾驶汽车公司\
  \ Jaybridge Robotics 加入。2016 年 4 月，丰田宣布与密歇根大学合作共同开发无人驾驶汽车，这是与丰田合作的第三所大学。\n\n丰田计划将无人驾驶汽车的研发任务分配给这三所大学，其中密歇根大学负责全无人驾驶汽车的研发，斯坦福大学负责部分无人驾驶汽车的研发，麻省理工学院负责机器学习算法研究。2016\
  \ 年 8 月，丰田增加了对各大学的投资，向密歇根大学投资 2200 万美元，以推动机器人和无人驾驶技术的研究。\n\n丰田计划于 2021 年让 AI 汽车上路行驶。TRI\
  \ 首席执行官吉尔·普拉特大力支持“守护天使”系统，该系统仅在人类驾驶员即将遇到危险或发生错误操作时介入工作，并将监控和干预驾驶员的行为。目前，TRI 正在研发第二个系统“Chauffeur”（司机），旨在实现\
  \ L4 和 L5 级无人驾驶，该系统将在“守护天使”之后部署应用。2017 年 3 月，该研究院向公众展示了更新后的自动驾驶开发平台。\n\n#### 12.3\
  \ 技术路线：无人驾驶行业的关键技术\n\n##### 12.3.1 无人驾驶技术的关键组件\n\n近年来，高校、研究机构和科技公司积极探索无人驾驶领域，创建了众多无人驾驶汽车项目，无人驾驶汽车市场已进入爆发式增长阶段。根据前瞻产业研究院发布的《无人驾驶汽车行业发展前景及投资战略规划分析报告》，2016\
  \ 年全球无人驾驶汽车市场规模为 40 亿美元；2018 年全球无人驾驶汽车市场规模为 48.2 亿美元；预计到 2021 年，全球无人驾驶汽车市场规模将达到\
  \ 70.3 亿美元。为推动无人驾驶行业快速发展，各国均聚焦于其他相关技术的研究。\n\n无人驾驶技术是一个庞大而复杂的系统，实现了多领域、多学科的有机融合，主要包括以下内容。\n\
  \n###### 12.3.1.1 汽车的系统架构\n\n汽车的系统架构为汽车系统构建了骨架，并定义了无人驾驶车辆系统硬件和软件组织的原则、集成方法及支持流程。\n\
  \n###### 12.3.1.2 外部环境的感知与识别\n\n人工智能系统是一个数据驱动系统，无人驾驶车辆系统也不例外。无人驾驶车辆感知环境、掌握实时路况信息的核心手段，基于车载传感器的外部环境感知与识别技术。在外部环境感知与识别技术的支持下，无人驾驶汽车可让车载智能系统实时获取道路上物体（如行人、车辆、障碍物等）的相对位置、距离、速度等信息，为汽车的决策与指令执行提供必要支撑。\n\
  \n###### 12.3.1.3 定位导航系统\n\n在无人驾驶汽车的行驶过程中，定位导航系统将提供车辆位置、速度、方向等多种信息，是无人驾驶汽车的基础软件。经过多年发展，定位导航技术体系不断完善，涌现出卫星导航技术、道路地图定位技术、视觉定位技术、推算定位技术、地图匹配技术、惯性导航技术等多种定位导航技术。实际上，在真实场景中会同时应用两种或两种以上的定位导航技术，以提高导航的精度和效率。\n\
  \n###### 12.3.1.4 路径规划技术\n\n无人驾驶领域的路径规划技术，是指无人驾驶汽车的智能系统通过分析路况、速度、行驶距离、信号灯数量等数据，在既定起点和终点之间设计一条安全高效的行驶路线，这需要应用统计学、大数据、云计算等技术。\n\
  \n在路径分析方面，驾驶员驾驶汽车时可结合实时路况灵活决策，但在无人驾驶状态下，智能控制系统需利用高精度三维路况模型，高效计算车辆与周围事物的相对位置、距离、速度等信息，从而实现安全驾驶。\n\
  \n路况思维模型需实时调整，这一过程涉及海量数据，必须借助 GPU 或分布式神经网络算法高效处理。值得注意的是，为实时更新高精度三维路网地图，需实现区域内自动驾驶车辆智能系统间的数据共享。为获取更丰富多样的路况信息，自动驾驶车辆需安装激光测距雷达、惯性雷达及各类传感器等软硬件设备。\n\
  \n在路径规划方面，路径规划不仅需要高精度三维路网地图，还高度依赖高精度定位技术。无人驾驶汽车必须能实时感知和识别自身位置，执行智能系统设定的最优路线方案，遵守交通秩序，及时避障，并坚持以人员安全为第一要务，安全高效地完成驾驶任务。\n\
  \n路线规划功能主要包含三点：\n\n(1) 统筹整体环境规划车道，在出发点与目的地之间设计最优路线，同时兼顾乘客的个性化需求。\n\n\n\n(2) 通过整合车道信息，并利用导航、传感器、智能算法及其他手段和工具，选择最优行驶车道。\n\
  \n(3) 通过理解车道信息，充分利用深度学习算法，分析车道对速度、转向等方面的具体要求，形成相应条件，使智能系统在控制车辆行驶时能做出更科学、更合理的决策。\n\
  \n###### 12.3.1.5 车辆控制技术\n\n在获取环境信息的前提下，车辆控制技术应利用自动转向控制系统使汽车保持平稳的运动状态；在具体的道路行驶中，车辆控制技术不仅能控制汽车的行驶速度和距离，还能使汽车完成超车、变道等驾驶操作。为实现这些多样化功能，需在无人驾驶汽车中安装控制与操作系统，如卫星导航系统、自适应巡航控制系统、紧急制动系统、车道偏离系统、自动泊车系统等。\n\
  \n(1) **紧急制动与卫星导航系统**：遇有紧急情况时，制动系统将立即响应并启动，以确保无人驾驶汽车处于人的有效监控之下。\n\n(2) **自适应巡航控制系统**：该系统旨在确保无人驾驶汽车与前车保持安全距离，使车辆能在道路上安全行驶。\n\
  \n(3) **车道偏离检测系统**：该系统旨在确保汽车能遵循路标和语音引导行驶。当车辆检测到偏离车道的迹象时，将迅速进行方向调整，避免车辆走错路线。\n\n\
  (4) **自动泊车系统**：该系统旨在确保无人驾驶汽车能自动停靠在正确位置，并能安全驶出。\n\n这些技术相互作用，将确保无人驾驶车辆能有目的、有方向地安全作业。上述技术看似相互孤立，实则可系统地归纳为三个层级：感知层、决策层和执行层。其中，外部环境的感知与识别归属感知层，定位导航系统与路径规划归属决策层，车辆控制技术归属执行层。除这些核心技术外，无人驾驶还涉及许多其他技术，详述如下。\n\
  \n##### 12.3.2 感知层：采集环境与驾驶信息\n\n无人驾驶汽车充分利用雷达、传感器、卫星导航系统、人工智能计算模块等软硬件设施的协同作用，使汽车能在无人干预的情况下自主行驶。无人驾驶汽车将配备大量车载传感器，这相当于给汽车装上了无数只眼睛，因此无人驾驶汽车比普通汽车安全可靠得多。\n\
  \n在无人驾驶过程中，最重要的是基于环境感知实现无人驾驶操作，该技术在无人驾驶技术中起着基础支撑作用。除进行环境感知外，该技术还涉及车辆控制技术的应用，即无人驾驶的发展必须依赖环境感知和车辆控制技术的支撑。\n\
  \n在一个相对成熟的无人驾驶系统中，信息采集网络收集汽车周围环境的信息，随后智能算法制定行驶计划，再由智能车辆行驶控制器驱动汽车抵达目的地。\n\n感知层是无人驾驶汽车获取外部信息的重要通道。目前，无人驾驶汽车感知外部环境的智能传感器系统主要包含三个组件：视觉传感器、激光雷达和毫米波雷达。通过视觉传感器导航也称为视觉导航。车辆将利用摄像头获取道路周围环境的局部图像，并运用图像识别等技术，实现车辆定位和周围环境检测。\n\
  \n激光雷达使无人驾驶汽车能实时监测动态障碍物，具有抗光干扰能力强、检测精度高的特点，可为动态障碍物监测和运动状态评估提供有力支持。激光雷达能获取线数、精度、点密度、扫描频率、探测距离、水平和垂直视场角等诸多环境参数，提供位置、距离等基本信息，以及目标物体密度的反馈，从而让算法推导出其反射率，有助于深入分析。\n\
  \n毫米波雷达频率范围在 30 至 300 GHz 之间，属于低频段或厘米波段，能够实现全天候成像。高频段充分利用了红外波的高分辨率优势。毫米波雷达与激光雷达遵循相同的检测原理，均利用物体对雷达波的反射来获取目标物体数据，但毫米波雷达技术更成熟。在穿透力和成本方面具有一定优势，但缺点也较为突出，例如频段对探测距离影响过大，难以感知行人，无法实现精细目标识别。\n\
  \n无人驾驶汽车探索项目的主流趋势是通过集成使用多种智能感知系统，提升汽车感知自身运行状态和周围环境的能力。总体而言，无人驾驶过程包含两个步骤：第一步是利用雷达等技术获取环境信息；第二步是基于对环境的判断，控制汽车的制动和转向系统，确保汽车能在道路上安全、平稳地运行。通过结合这两个模块并发挥其协同优势，可完成无人驾驶的全过程。\n\
  \n汽车可利用环境感知技术采集其当前位置、道路、周围车辆及障碍物等信息，并将这些信息发送给车载中央计算机，以便掌握路况，辅助汽车设定和调整行驶路线，最终抵达预定目标。换言之，汽车可通过环境感知技术获取自身位置和周围物体信息，判断这些物体的属性及其与自身的距离，从宏观层面掌握当前环境信息。\n\
  \n\n\n\n##### 12.3.3 决策层：路径规划与实时导航\n\n目前阶段，环境感知主要采用的技术包括视觉感知、激光感知和微波感知。借助这些技术，车载传感器、车载通信系统和雷达系统可以采集环境信息，利用信息技术呈现二维或三维图像，并将获取的信息发送至信息处理终端，由技术人员处理三维图像以感知和判断汽车的实时环境。此外，不同汽车之间还可以互联，采集不同车辆的实时环境和行驶信息。远程通信技术和李永乐无线网络技术在无人驾驶领域的应用，有效提升了汽车的环境感知能力，推动了无人驾驶的整体发展。\n\
  \n无人驾驶汽车决策层的主要功能是规划行驶路线并提供实时导航服务。这两项功能的实现需要使用高精度地图，也称为“高精度数字地图”。高精度地图与普通地图的区别在于前者更精准、信息量更大，且专供无人驾驶汽车使用。\n\
  \n无人驾驶汽车无法使用普通地图的原因在于，普通地图标注的信息简单，用两条平行线代表道路，用交叉口代表十字路口。人类可以凭借认知能力根据这些简单信息做出判断，但无人驾驶汽车难以以此方式运作。因此，高精度数字地图是三维的，涵盖丰富信息，包括车道线和周边设施的坐标位置，精度极高，可达厘米级。\n\
  \n与普通电子地图相比，高精度地图的另一特殊功能是其采集路面激光雷达反射强度的能力。对人类驾驶员而言，此功能毫无意义，但对自动驾驶车辆却极其宝贵。路面激光雷达反射强度是一种变化缓慢且微小的路面特征，可为利用光学雷达对无人车辆进行定位提供依据。通过将光学雷达扫描获得的信息与高精度地图上已有的信息进行比对，无人驾驶系统便能精准锁定车辆当前位置。\n\
  \n无人驾驶决策系统运行需要两个条件：独立智能车辆和智能交通系统，如 `V2V`。`V2X` 是除高精度地图外另一种可实现路径规划的技术，它基于 `V2I`。`V2X`\
  \ 使车辆能与周围环境连接，形成覆盖车车通信系统、车路通信系统和车人通信系统的物联网。\n\n如果车辆在行驶中能“获取”信号灯信息，而非仅“看见”信号灯信息，则可完全避免闯红灯。此处“获取”是指：当传感器尚未“看见”信号灯时（如距离信号灯\
  \ 100 米处），信号灯主动将当前信号状态、变化时长等信息发送给车辆，提醒其减速、加速或刹车，从而避免闯红灯。此外，若无人驾驶车辆在行驶中能“获取”周围车辆的行驶意图（如停车、变道、转弯等），将有效避免交通事故。\n\
  \n在高精度数字地图和 `V2X` 通信网络的支持下，自动驾驶系统可利用搜索算法精准评估各种驾驶行为的代价，从而规划最优行驶路径。\n\n##### 12.3.4\
  \ 智能交通执行层：对汽车运行的精准控制\n\n在整个控制系统中，执行层位于底层，其主要功能是执行制动、转向、加速等操作。系统采用“线控装置”控制方向盘和油门，并配置由多处理器组成的子系统，对自动驾驶汽车的整个机械系统进行稳准控制。\n\
  \n汽车驾驶控制器是实现车辆控制和自动驾驶的核心模块，包含两类功能：一方面，它将结合自动驾驶汽车的动力学性能和车内传感器性能来调整车辆行驶参数，以安全、高效、低能耗完成驾驶任务；另一方面，汽车将能像拥有多年经验的驾驶员一样思考和决策，这基于无人驾驶汽车的动力学性能和传感器识别性能。汽车还可能综合考量安全、经济、舒适、伦理等诸多因素，根据实时路况调整驾驶状态，这将同时为乘客带来良好的出行体验，并维持车辆与其他车辆、行人之间的和谐。\n\
  \n对车辆的精准控制是自动驾驶的关键，车辆控制的基本原则是保障人车安全，这显然需要先进制动系统的有力支撑。当汽车遭遇事故时，制动系统能在智能驾驶控制器的指挥下实施精准、实时的制动，以避免或减轻事故的负面影响。有了强有力的制动系统，智能汽车还需要更智能的控制算法，这是赋予制动系统更强控制力、精度和鲁棒性的主要手段。\n\
  \n目前阶段，几乎所有自动驾驶汽车项目都可能利用机器学习等技术，让汽车学习并模拟人类驾驶经验，再结合智能系统实时分析控制车辆。然而，若无人驾驶汽车具备应对紧急情况的能力，将有效管控风险。应对紧急情况的智能系统不会像普通人那样普遍感到紧张、恐慌；无人驾驶汽车在决策上理性果断，其前提是强大的“智能大脑”。\n\
  \n安全是无人驾驶汽车的首要考量。在人工驾驶状态下，驾驶员的驾驶技术、心理素质、应急处理能力、操作习惯等存在差异。遇到紧急情况时，驾驶员可采取差异化应对措施，但无人驾驶汽车无情感，安全保障应为第一优先级。其次应考虑用车体验。目前市场上的智能汽车主要为提供驾驶辅助服务的半自动化汽车，因此保障乘客在无人驾驶汽车中的舒适体验是未来的重要课题。\n\
  \n\n\n\n\n###### Application of Autonomous Driving Technology in Intelligent Transportation\
  \ and Its Impact on Urban Traffic Flow\n\nIn the future, mature artificial intelligence\
  \ will be able to analyze the surrounding environment and make decisions like a\
  \ human. When analyzing driving strategies in specific scenarios, it does not need\
  \ to re-analyze every time; instead, it can utilize the strategies previously processed\
  \ by the vehicle for that scenario to control the car, or imitate the behavior of\
  \ the vehicle ahead. This will have a disruptive impact on the automotive industry,\
  \ and human life will also undergo significant changes.\n\nTheoretically, autonomous\
  \ vehicles will possess the \"driving\" capability through the integration of perception,\
  \ decision-making, and execution systems. As Hod Lipson and Melba Kurman, authors\
  \ of *Driverless: Intelligent Cars and the Road Ahead*, stated: \"Although the technology\
  \ is almost ready, the social environment for deploying this unique technology may\
  \ not be prepared yet. For example, laws and regulations governing driverless vehicles\
  \ are not yet in place. However, based on the advantages of driverless cars in terms\
  \ of efficiency and safety, driverless cars are destined to increase, and the era\
  \ of driverless cars will eventually arrive. We believe the development trend of\
  \ 'driverless cars' is unstoppable.\"\n\n##### 12.3.5 Application of Autonomous\
  \ Driving in the Field of Intelligent Transportation\n\nAutonomous driving technology\
  \ includes human-machine interaction technology, intelligent control systems, anti-lock\
  \ braking systems, traction or stability control systems, etc. The following is\
  \ a detailed analysis of the application of these technologies in the field of intelligent\
  \ transportation:\n\n###### (1) Human-Machine Interaction Technology Ensuring Driving\
  \ Safety\nIntelligent transportation systems take human safety as the top priority.\
  \ Vehicles and humans need to interact with each other to comprehensively guarantee\
  \ human safety, which requires the use of human-machine interaction technology.\
  \ Human-machine interaction involves not only the interaction between in-vehicle\
  \ occupants and the car but also the interaction between external pedestrians and\
  \ the car. Currently, research on human-machine interaction technology in the field\
  \ of autonomous driving focuses more on the interaction between the vehicle and\
  \ external pedestrians. By establishing a communication mechanism that enables efficient\
  \ and convenient interaction between the car and people, efficient vehicle-road\
  \ coordination can be achieved. In the long run, future autonomous vehicles will\
  \ imitate human behavior patterns when making intelligent decisions.\n\nEfficient\
  \ and convenient human-machine interaction can bring users a better travel experience\
  \ and has a very positive impact on enhancing the market promotion capability of\
  \ autonomous vehicles. Without human-machine interaction, it is difficult for the\
  \ car to fully understand human needs. Autonomous vehicles will analyze massive\
  \ amounts of data in real-time for route planning, lane changing, obstacle avoidance,\
  \ parking, etc.\n\n###### (2) Intelligent Control Systems Enhancing Travel Experience\n\
  The intelligent decision-making of a vehicle is an important indicator for measuring\
  \ the performance of an autonomous car. Data obtained through sensors and other\
  \ devices will be processed by processors, applying data models and intelligent\
  \ algorithms to achieve optimal decisions. Of course, such intelligent algorithms\
  \ should possess self-learning and self-improvement capabilities to meet the actual\
  \ needs of autonomous vehicles in various driving scenarios. Automated control is\
  \ the executor of decision commands, enabling the car to perform a series of behavioral\
  \ actions, such as acceleration/deceleration, steering, obstacle avoidance, etc.,\
  \ which directly affects the human travel experience.\n\nIn many traffic accidents,\
  \ those caused by human factors account for a considerable proportion. This is because\
  \ humans feel fatigue and psychological fluctuations when stimulated by sound, images,\
  \ or other external factors, leading to human errors that threaten personal and\
  \ property safety. The intelligent control system based on autonomous driving technology\
  \ can remain objective and calm for long periods without fatigue, effectively reducing\
  \ human-caused traffic accidents.\n\n###### (3) Anti-lock Braking System Reducing\
  \ Traffic Accidents\nThe Anti-lock Braking System (`ABS`) is one of the most widely\
  \ used and relatively mature autonomous driving systems. Vehicles not equipped with\
  \ `ABS` may experience tire lock-up during emergency braking, causing the vehicle\
  \ to skid. Experienced drivers can avoid lock-up by pumping the brakes repeatedly,\
  \ but most drivers are easily distracted within a few seconds, or even mistake the\
  \ accelerator for the brake. Once equipped with `ABS`, the system can monitor tire\
  \ status in real-time before the tires are about to lock up and take effective measures\
  \ when an accident occurs, reducing the likelihood of traffic accidents.\n\n######\
  \ (4) Traction or Stability Control Systems Supporting Autonomous Vehicle Movement\n\
  The traction or stability control system is also a widely used technology in autonomous\
  \ driving systems. Compared with `ABS`, this system is more complex. It can monitor\
  \ road conditions, vehicle speed, driving direction, operating status of key components,\
  \ and other information in real-time. Once it detects that the vehicle may lose\
  \ control or roll over, it takes effective measures in a timely manner to ensure\
  \ driving safety. In true autonomous driving, the car can efficiently and safely\
  \ independently complete tasks assigned by passengers or the controller.\n\n######\
  \ (5) Interaction of Various Systems Truly Realizing Autonomous Driving\nThe traffic\
  \ information collection system, information processing and analysis system, and\
  \ information dissemination system are intelligent transportation systems closely\
  \ related to autonomous driving technology. Among them:\n- The traffic information\
  \ collection system is built based on multiple systems such as the Global Positioning\
  \ System (`GPS`) technology and infrared radar detection systems;\n- The information\
  \ processing and analysis system is usually applied in `GIS` application systems,\
  \ expert systems, etc.;\n- The information dissemination system highly relies on\
  \ media technologies such as mobile internet and mobile phone terminals.\n\nDeveloped\
  \ countries such as the United States and Japan, leveraging their leading advantages\
  \ in computer control, network technology, positioning and navigation, artificial\
  \ intelligence, and other fields, took the lead in creating intelligent transportation\
  \ systems with unmanned systems at the core. A large number of autonomous driving\
  \ vehicle projects have emerged, and the costs in exploration and practice are relatively\
  \ low.\n\n##### 12.3.6 Impact of Autonomous Vehicles on Urban Traffic Flow\n\nIn\
  \ recent years, with the increase in urban population and the number of private\
  \ cars, the problem of urban traffic congestion has become increasingly serious.\
  \ To better plan the urban road network and make the scale and form of urban road\
  \ construction more reasonable, people have begun to analyze urban traffic efficiency\
  \ and its influencing factors. There are various factors affecting traffic flow.\
  \ What role do autonomous vehicles play among these factors?\n\n\n\n\nAutonomous\
  \ vehicles are equipped with onboard sensors to collect environmental data around\
  \ the vehicle. Onboard sensors mainly consist of cameras, Global Positioning Systems\
  \ (GPS), LiDAR, and other components. Meanwhile, the intelligent processing module\
  \ in autonomous vehicles can effectively control operating parameters such as steering\
  \ and speed parameters to ensure safe driving.\n\nSpecifically, the intelligent\
  \ processing module consists of a decision-making module, a control module, and\
  \ other parts. It can acquire various types of data, including video image data\
  \ collected by cameras, point cloud data collected by LiDAR, position data collected\
  \ by GPS, steering or speed data output by the decision-making module, and execution\
  \ result data output by the control module. The intelligent processing module is\
  \ used to control the operation of the autonomous vehicle.\n\nIn many regions, traffic\
  \ capacity is very limited due to factors such as the number of lanes. The realization\
  \ of autonomous driving by autonomous vehicles can shorten vehicle following distances,\
  \ ensure driving safety, reduce traffic accidents, improve road capacity, and enhance\
  \ network capacity.\n\n###### 12.3.6.1 Analysis of Influencing Factors\n\nThere\
  \ are many factors affecting highway capacity. Three factors are selected for analysis:\
  \ the number of routes, the proportion of autonomous vehicles among all traveling\
  \ vehicles, and the peak hour capacity of the road, to obtain their corresponding\
  \ relationships.\n\nAutonomous vehicles do not require drivers; if a road emergency\
  \ occurs, the vehicle reaction time approaches zero. According to data, the average\
  \ speed of autonomous vehicles is far faster than that of human drivers. Therefore,\
  \ the higher the proportion of autonomous vehicles in the traffic flow, the stronger\
  \ the road capacity. In addition, the more routes a road has, the greater its capacity.\
  \ Besides these two major factors, the presence of intersections also significantly\
  \ affects road capacity; the more intersections, the worse the road capacity.\n\n\
  Traffic flow is affected not only by road capacity but also by other factors such\
  \ as geographical location, network density, road service level, regional vehicle\
  \ ownership, and travel time. These five factors will be analyzed in detail. The\
  \ more prosperous the area where the road is located, the higher the network density,\
  \ the higher the road service level, the greater the regional vehicle ownership,\
  \ and the larger the traffic flow during peak travel periods.\n\n###### 12.3.6.2\
  \ Analysis of the Effects of Introducing Autonomous Vehicles on Different Roads\n\
  \nRegions with different network densities have different approaches to introducing\
  \ autonomous vehicles. First, road capacity is affected by multiple factors. If\
  \ road conditions do not fundamentally change, road capacity will be significantly\
  \ affected as more and more autonomous vehicles hit the road. To gain a deeper understanding\
  \ of this impact, relevant institutions have conducted research with the following\
  \ results.\n\nFirst, on free-flowing roads, when the proportion of autonomous vehicles\
  \ is below 54%, the growth rate of road capacity will continuously slow down as\
  \ the proportion continues to increase; when the proportion exceeds 54%, the growth\
  \ rate of road capacity will accelerate as the proportion continues to increase.\
  \ However, considering the manufacturing cost of autonomous vehicles, such roads\
  \ are not suitable for large-scale deployment of autonomous vehicles.\n\nSecond,\
  \ on generally smooth roads, the impact of autonomous vehicles on road capacity\
  \ is greatest when the proportion reaches 40%. As the proportion continues to increase,\
  \ this impact gradually weakens. Therefore, autonomous vehicles can be introduced\
  \ on such roads to alleviate traffic pressure.\n\nFinally, on roads prone to severe\
  \ congestion, road capacity is strongest when the proportion of autonomous vehicles\
  \ reaches 45%. As the proportion continues to increase, road capacity actually decreases.\
  \ The reason for this phenomenon is that the maximum road capacity limits traffic\
  \ flow growth. For such road sections, traffic authorities can set up dedicated\
  \ lanes for autonomous vehicles to alleviate traffic pressure.\n\nComparing congested\
  \ road sections with actual maps reveals that the city center has the largest traffic\
  \ flow, especially at intersections of arterial roads and surrounding dense roads.\
  \ Therefore, opening dedicated lanes for autonomous vehicles in this area can solve\
  \ traffic congestion problems.\n\n#### 12.4 Intelligent Traffic Management Model\
  \ Based on Autonomous Driving\n\n##### 12.4.1 Deep Integration of Free Travel and\
  \ Sharing Modes\n\nFor autonomous vehicles to replace human-driven vehicles, it\
  \ is necessary not only to break down barriers between technologies such as the\
  \ Internet of Things, big data, cloud computing, sensors, and artificial intelligence,\
  \ but also to achieve breakthroughs in management aspects such as urban planning\
  \ adjustments, traffic rule improvements, and regulatory system construction. From\
  \ the development practices of multiple industries, technology and management complement\
  \ each other; only with their coordinated development can autonomous vehicles be\
  \ widely promoted and popularized on a large scale.\n\nTherefore, when exploring\
  \ traffic management models matching autonomous vehicles, one cannot wait until\
  \ autonomous driving technology is fully mature before exploring. Lagging planning,\
  \ construction, and regulation will impose numerous restrictions on technological\
  \ development. For example, setting high thresholds for autonomous vehicles to operate\
  \ on roads will prevent them from conducting road tests, posing a major obstacle\
  \ to the development of autonomous driving technology.\n\nMany countries worldwide\
  \ have now realized the important value of intelligent traffic management models.\
  \ For instance, in August 2014, the Singapore government established the Committee\
  \ on Autonomous Road Transport for Singapore (CARTS) to provide guidance and assistance\
  \ for the development of autonomous vehicles in four dimensions: freight transport,\
  \ fixed routes, point-to-point transport, and public facility operations.\n\n(1)\
  \ **Freight Transport**: Completing cargo transportation and delivery through automated\
  \ truck platoons.\n\n(2) **Fixed Routes**: Providing transport services on intercity\
  \ and intra-city public transit routes.\n\n(3) **Point-to-Point Transport**: Meeting\
  \ point-to-point and short-distance travel needs through shared vehicles.\n\n(4)\
  \ **Public Facility Operations**: Providing public services such as plant irrigation,\
  \ garbage collection, and road sweeping.\n\nIn December 2017, the Beijing Municipal\
  \ Commission of Transport, jointly with the Beijing Municipal Public Security Bureau\
  \ Traffic Management Bureau and the Beijing Municipal Economy and Information Technology\
  \ Bureau, issued two guiding documents: the \"Guiding Opinions on Accelerating the\
  \ Road Testing of Autonomous Vehicles in Beijing\" and the \"Implementation Rules\
  \ for the Management of Road Testing of Autonomous Vehicles in Beijing.\" This will\
  \ undoubtedly have a very positive impact on the further development of autonomous\
  \ vehicle technology and management models.\n\n\n\n\n###### Analysis of Intelligent\
  \ Traffic Management Modes and Travel Modes\n\nThe establishment of intelligent\
  \ traffic management modes should be based on people's travel patterns and must\
  \ highlight their humanized and intelligent considerations. From the perspective\
  \ of the number of travel users, people's travel patterns can be divided into two\
  \ main categories.\n\n####### 1. Free Travel\nIn the free travel mode, individual\
  \ travelers have complete independent control and usage rights over the travel tool,\
  \ can freely allocate its internal space and facilities, and can meet people's personalized\
  \ travel needs.\n\n####### 2. Shared Travel\nIn the shared travel mode, two or more\
  \ travelers jointly use one travel tool, influencing each other. The allocation\
  \ of internal space and facilities is subject to certain constraints, and it also\
  \ involves certain privacy protection issues. Strictly speaking, only individual\
  \ self-driving travel counts as free travel.\n\n####### 3. Special Case: Taking\
  \ a Taxi\nThere is a common special case between free travel and shared travel.\
  \ When a person takes a taxi alone, the taxi driver, like the taxi itself, belongs\
  \ to the service provider, not a sharer. The taxi driver is an independent individual\
  \ with independent consciousness; the passenger cannot ignore their existence, so\
  \ the passenger's freedom is restricted. If encountering an unethical taxi driver,\
  \ the passenger's personal and property safety may be threatened.\n\n####### 4.\
  \ Advantage Comparison\n- The advantages of **free travel** are mainly reflected\
  \ in convenience, safety, and comfort;\n- The advantages of **shared travel** lie\
  \ mainly in low cost and being green and environmentally friendly, which can effectively\
  \ reduce the total number of urban cars, alleviate traffic congestion and parking\
  \ difficulties, and improve resource utilization efficiency.\n\nUnder specific economic\
  \ conditions, most people tend to choose free travel, and the awareness of sharing\
  \ needs to be improved.\n\n####### 5. Classification by Travel Tool Ownership\n\
  From the perspective of travel tool ownership, people's travel modes can be further\
  \ divided into two categories: **private car travel** and **public travel**. When\
  \ the ownership of the vehicle used does not belong to the user themselves, it is\
  \ regarded as a public travel mode, for example: taxis, ride-hailing cars, buses,\
  \ subways, commuter buses, vans, as well as using family or friends' private cars.\n\
  \nPublic travel in a manned driving state, as well as travel shared by two or more\
  \ people in a private car, do not belong to free travel. With the mature development\
  \ of autonomous driving technology, taking a driverless taxi will be similar to\
  \ self-driving travel, thereby becoming true free travel.\n\nIn other words, **driverless\
  \ taxis** will achieve the deep integration of free travel and public travel, allowing\
  \ people to enjoy the convenience, comfort, and safety advantages of free travel\
  \ while also gaining the low-cost and green advantages of public travel. Considering\
  \ that driverless cars are expensive and have limited users in the early stages\
  \ of development, and that driverless taxis can reduce labor costs, it is only natural\
  \ that they take the lead in large-scale market application.\n\n##### 12.4.2 Driverless\
  \ Taxis and Free Travel Modes\n\nIn August 2016, Singapore taxi startup `nuTonomy`\
  \ launched a driverless taxi trial operation in Singapore. Eligible passengers could\
  \ hail the service via smartphones. The trial phase deployed 6 driverless taxis,\
  \ with 12 passengers gaining experience qualifications. The operation scope was\
  \ limited to a 2.5-square-mile commercial and residential area, and passengers were\
  \ required to board and alight at designated locations. According to `nuTonomy`'s\
  \ plan, as more driverless cars are put into use, the total number of cars in Singapore\
  \ will be reduced from 900,000 to 300,000 in the future. In October 2017, `Delphi\
  \ Pike Electric` announced the completion of the full acquisition of `nuTonomy`\
  \ for $450 million.\n\nFor countries like Singapore with small land areas and developed\
  \ economies, the difficulty of promoting driverless taxis is relatively small. Their\
  \ application will bring many conveniences to people's travel and have a positive\
  \ impact on alleviating traffic congestion. It is worth noting that public transportation\
  \ is a core component of Singapore's transportation system. The application of driverless\
  \ taxis is not intended to completely replace traditional taxis, but to further\
  \ improve them. Singapore's released future transportation development plan expects\
  \ that by 2025, public transportation will undertake up to 75% of travel services\
  \ during peak hours in Singapore.\n\nCompanies like `Uber` are testing driverless\
  \ cars not only in Singapore but also in multiple cities such as California, Michigan,\
  \ and Pittsburgh, attempting to launch driverless taxi services. Especially for\
  \ ride-hailing companies like `Uber`, after applying driverless taxis, the platform\
  \ can customize and design perfect travel solutions for people's daily travel. Through\
  \ intelligent systems, people's travel demands can be effectively predicted, realizing\
  \ efficient scheduling of vehicle resources; more importantly, combined with big\
  \ data and cloud computing technologies, targeted adjustments can be made to the\
  \ allocation of transportation resources in different regions to better meet peak\
  \ travel demands and reduce empty running rates.\n\nThe algorithm competition hosted\
  \ by the DiDi Research Institute in collaboration with `Uda Xue Cheng` and `Zhihu`\
  \ had the slogan: \"The dream of changing the world can come true. Your algorithm\
  \ will be used in the real travel world. Perhaps one day you can say, 'In this city,\
  \ my algorithm governs which car you choose to take'.\" If driverless taxis can\
  \ be widely promoted and popularized, people will no longer need to purchase, repair,\
  \ or regularly maintain private cars, thereby eliminating various problems such\
  \ as parking difficulties, car insurance, congestion, breakdowns, and en-route accidents,\
  \ which highly aligns with people's yearning for a better life.\n\nChildren, the\
  \ elderly, people with disabilities, and those without driver's licenses can also\
  \ enjoy travel freedom through driverless taxis. This will significantly reduce\
  \ the number of private cars, contributing to environmental protection, reducing\
  \ traffic accidents, and improving travel efficiency and experience.\n\nScientific\
  \ research has found that if driverless taxis are promoted as the mainstream mode\
  \ of urban motorized travel and the number of private cars is strictly limited,\
  \ the total number of urban vehicles will be reduced by nearly 50%, parking land\
  \ area will be reduced by 40%, and the accident rate will be reduced by about 90%.\
  \ If driverless cars are upgraded to electric and other new energy models, vehicle\
  \ exhaust emissions will be reduced by about 80%. At that time, cities will have\
  \ more space to improve residents' quality of life, such as building more parks,\
  \ football fields, and other public leisure facilities; bicycle lanes can also be\
  \ widened.\n\nTo solve the air pollution problem in the city center, Oslo, Norway,\
  \ will achieve \"zero private cars\" before 2019; Madrid, Spain, announced that\
  \ by 2020, vehicles will be prohibited from entering an approximately 2-square-kilometer\
  \ city center area. Of course, to meet people's personalized travel needs, private\
  \ cars will not disappear for a considerable period of time, but experiencing the\
  \ freedom of driving a private car does not necessarily require purchasing one.\
  \ In the future, some service providers offering long-term leasing of driverless\
  \ cars may emerge.\n\n\n\n\nAutonomous taxis help the public enjoy high-quality\
  \ shared mobility services at lower costs. In Asian markets (such as China, India,\
  \ and Singapore), ride-pooling is popular among large populations, which is closely\
  \ related to the level of economic development to a certain extent. In economically\
  \ developed European countries (such as the UK, France, Germany, and other European\
  \ markets), people's acceptance of ride-pooling is relatively lower. However, there\
  \ are differences in acceptance across age groups. In a survey on willingness to\
  \ ride-pool in European markets, 45% of respondents under 30 expressed willingness\
  \ to share a taxi, while only 22% of those aged 50 and above were willing to accept\
  \ taxi ride-pooling.\n\nThe cost of autonomous taxis has a huge impact on large-scale\
  \ ride-pooling: when the fare is $20, only 11% of respondents are willing to ride-pool;\
  \ when the cost drops 50% to $10, the proportion willing to ride-pool rises to 37%;\
  \ when the cost further drops 75% to $5, the proportion rises to 52%. In addition,\
  \ many respondents actively inquired whether the vehicle is equipped with glass\
  \ partitions, cameras, and other personal safety features, stating that they would\
  \ be more willing to ride-pool in autonomous taxis if these are handled properly.\n\
  \nThe reason for using small vehicles like taxis instead of large buses is that\
  \ smaller, more dispersed vehicles have a positive impact on meeting personalized\
  \ travel needs, improving road traffic efficiency, epidemic prevention and control,\
  \ and anti-terrorism security.\n\nSome argue that bus environments may promote interpersonal\
  \ interaction, but the fact is that, except for a few situations such as business\
  \ meetings or traveling with relatives and friends, people travel more for self-entertainment\
  \ and relaxation, rather than chatting with strangers with whom they have no connection.\
  \ Therefore, large bus scenarios not only fail to promote interpersonal interaction\
  \ but instead impair the travel experience.\n\nIn the future, as urban development\
  \ levels continue to rise and autonomous driving travel costs decrease, more and\
  \ more people will choose to ride-pool or ride alone in small autonomous vehicles.\n\
  \n##### 12.4.3 Intelligent Traffic Management Based on Vehicle-Road Integration\n\
  \nExploring intelligent traffic management models from the perspective of travel\
  \ modes will align with the people-centered development philosophy. However, to\
  \ establish a sound intelligent traffic management model, considering consumers\
  \ alone is far from enough; it is also necessary to coordinate government departments,\
  \ manufacturers, dealers, operators, and other entities. From the R&D and design\
  \ of autonomous vehicles to their deployment and operation, it is inherently a huge\
  \ and complex systems engineering project that requires collaborative interaction\
  \ among all parties.\n\nCommunication and interaction between V2V (vehicle-to-vehicle),\
  \ V2I (vehicle-to-infrastructure), and V2P (vehicle-to-pedestrian) require unified\
  \ industry standards. At the same time, relying solely on a single Internet mobility\
  \ platform or automaker is far from sufficient to tap into the deep potential value\
  \ of big transportation data; this requires the sharing and deep cooperation of\
  \ enterprise resources. In addition, the definition of responsibilities for vehicle\
  \ quality, traffic accidents, etc., remains unclear, and a widely advocated view\
  \ proposes that automakers should bear responsibility for the entire process of\
  \ autonomous vehicle manufacturing and road operation.\n\nUnder this model, automakers\
  \ will be responsible for vehicle R&D, production, configuration, as well as road\
  \ construction and management, ultimately establishing an intelligent transportation\
  \ industry model featuring vehicle-road integration and integrated operation, providing\
  \ strong support for urban traffic development.\n\nRegarding the R&D and production\
  \ of autonomous vehicles, it is necessary to actively extend upstream and downstream\
  \ along the industrial chain, which helps enhance the industrial chain's value creation\
  \ capability and reduce costs and risks. Baidu leverages its resource integration\
  \ advantages to deeply cooperate with government departments, parts manufacturers,\
  \ mobility service providers, whole vehicle manufacturers, and industry associations\
  \ to build and improve the \"Smart Mobility\" ecosystem, allowing the public to\
  \ enjoy more convenient and efficient transportation services.\n\nIn August 2016,\
  \ Velodyne, a Silicon Valley technology company in California, USA, announced that\
  \ its LiDAR subsidiary, Velodyne LiDAR, received investments from Baidu and Ford,\
  \ with a total investment of $150 million. The capital injection significantly reduced\
  \ the price of LiDAR products. Benefiting from Velodyne LiDAR's strong supply capacity,\
  \ the supply price of its 64-channel LiDAR dropped from the previous 700,000 yuan\
  \ to 500,000 yuan. A Velodyne LiDAR spokesperson stated that when 64-channel LiDAR\
  \ orders reach the million level, the cost will drop to $500.\n\nIn other words,\
  \ price is expected to no longer be the main obstacle restricting LiDAR sales, and\
  \ the commercialization process of autonomous driving technology will be further\
  \ accelerated. Currently, many traditional automakers are investing in autonomous\
  \ driving startups to seize the initiative. To ensure the safety of autonomous vehicles\
  \ and improve regulatory capabilities, the service supply and operation management\
  \ of autonomous vehicles in a certain region will be handled by a single enterprise\
  \ in the future. At that time, the target customers contested by autonomous vehicle\
  \ companies will no longer be individual consumers, but cities, regions, or even\
  \ countries. From the perspective of industrial competition, this helps reduce internal\
  \ friction within the industry and form a competition pattern dominated by external\
  \ competition and region-based industrial competition.\n\nAutonomous driving tools\
  \ such as autonomous taxis are just one of many travel modes; people can also choose\
  \ bicycles, e-bikes, buses, subways, and other methods. The large-scale popularization\
  \ of mobile Internet and mobile smart terminals means that cities and regions with\
  \ more diverse services and more complete infrastructure will attract more talent.\n\
  \nFrom a technical perspective, it is feasible to improve autonomous driving safety\
  \ to a level suitable for large-scale application, but after reaching a certain\
  \ level, raising safety from 80% to 99% is already difficult, and raising it from\
  \ 99% to 99.99% is even more difficult. The analytical capabilities of big data\
  \ technology and the computing power of cloud computing technology can indeed surpass\
  \ humans, but new problems keep emerging. Properly solving these problems requires\
  \ comprehensive consideration of factors such as emotion, morality, ethics, and\
  \ law; solutions cannot be designed from a technical perspective alone.\n\nIn the\
  \ long run, after autonomous driving enters the commercialization stage, for a considerable\
  \ period of time, we cannot entrust safety entirely to autonomous vehicles and systems,\
  \ but should combine them with more reliable and safer auxiliary measures such as\
  \ classified and zoned driving.\n\n###### 12.4.3.1 Vehicle Classification and Dedicated\
  \ Use\n\n\n\nThe classification of autonomous vehicles will be based on the demand\
  \ characteristics of actual scenarios, enabling differentiated design and operational\
  \ management for autonomous vehicles. From different perspectives, autonomous vehicles\
  \ can be categorized as follows:\n\n(1) From the perspective of driving range, they\
  \ can be divided into short-distance vehicles operating at low speeds within cities\
  \ and long-distance vehicles operating at high speeds between cities.\n\n(2) From\
  \ the perspective of the transport object, they can be divided into passenger cars\
  \ serving people and trucks serving freight.\n\n(3) From the perspective of passenger\
  \ capacity, they can be divided into single-occupant, dual-occupant, and multi-occupant\
  \ vehicles.\n\n(4) From the perspective of user type, they can be divided into police\
  \ cars, commercial vehicles, business vehicles, and private/family cars.\n\n(5)\
  \ From the perspective of special scenarios, they can be divided into emergency\
  \ vehicles, fire trucks, energy replenishment vehicles, and engineering rescue vehicles.\n\
  \nApplying classification by vehicle type holds significant value in reducing resource\
  \ waste, controlling costs, and improving service quality. For example, short-distance\
  \ vehicles operating at low speeds within cities only need to update local maps\
  \ in real-time to retain more detailed local traffic information, reduce total data\
  \ volume, and improve vehicle system speed; indoor short-distance vehicles and inter-city\
  \ vehicles can adopt differentiated design solutions for tires, lighting, body materials,\
  \ sensors, etc., to reduce resource waste and improve resource utilization.\n\n\
  After delineating vehicle operational areas, the vehicle fleet size within the area\
  \ will be effectively controlled, thereby improving traffic operational efficiency\
  \ and quality, and reducing congestion and accidents. With the popularization of\
  \ mobile payment and toll policy reforms, toll stations will cease to exist in the\
  \ future, replaced by transfer stations providing passenger and cargo transfer services\
  \ for users.\n\nIn the future, passengers or luggage can complete transfers without\
  \ getting off the vehicle. For example, when a high-speed train arrives at a station,\
  \ passengers can board and alight without the train stopping; when autonomous vehicle\
  \ passengers encounter impassable roads ahead due to accidents or congestion, passengers\
  \ in oncoming vehicles do not need to return the same way but can continue to reach\
  \ their destinations via transfer.\n\n###### 12.4.3.2 Lane-Separated Driving\n\n\
  Lane-separated driving will designate dedicated lanes for different vehicles such\
  \ as pedestrians, bicycles, electric vehicles, private cars, and buses, with each\
  \ traveling in its own lane and controlling its driving route. Currently, expressways\
  \ and rail transit have basically achieved lane-separated driving. In the early\
  \ application stage of autonomous vehicles, dedicated lanes need to be set up to\
  \ improve safety and reduce the negative impact of accidents.\n\nWhen traffic lights\
  \ at intersections are eliminated in the future, the separation of humans and vehicles\
  \ into different lanes will become an inevitable choice: ordinary people find it\
  \ difficult to judge the path of autonomous vehicles, and vehicle systems also find\
  \ it difficult to find fixed patterns in large amounts of disordered flow. Although\
  \ pedestrians can interact with autonomous vehicles after the popularization of\
  \ IoT technology, passengers in the vehicle may be unwilling to compromise, triggering\
  \ conflicts; lane separation can effectively solve this problem.\n\nIn addition,\
  \ when autonomous vehicles and human-driven vehicles share the road, the unified\
  \ scheduling intelligent traffic center system lacks binding force over human-driven\
  \ vehicles, making instructions difficult to execute effectively and leading to\
  \ frequent conflicts, which is by no means the desired outcome.\n\n#### 12.5 Key\
  \ Factors for Autonomous Driving from Concept to Practice\n\n##### 12.5.1 Safety:\
  \ The Inevitable Destination of Autonomous Driving Development\n\nThe pursuit of\
  \ safety has driven the rapid growth in demand for autonomous vehicles. According\
  \ to WHO data, more than 1.2 million people die globally each year due to road traffic\
  \ accidents. Human error accounts for 93% of accidents in China, with an average\
  \ of 500 deaths per day. With the advent of autonomous vehicles, the traditional\
  \ \"human-vehicle-road\" ternary control will shift to \"vehicle-road\" binary control,\
  \ the out-of-control driver is eliminated, achieving \"zero violations,\" and the\
  \ efficiency and safety of the traffic system are greatly improved, with accident\
  \ rates significantly reduced. Research shows that rear-end collisions decrease\
  \ by 40% after equipping automatic braking systems; if all motor vehicles are equipped,\
  \ 700,000 accidents can be reduced annually.\n\nSafety is the prerequisite for autonomous\
  \ driving development. Because the technology is still in the trial-and-error improvement\
  \ stage, safety and reliability have not yet gained widespread public recognition.\
  \ For example, the UK requires on-road autonomous vehicles to have a human monitor\
  \ who can switch to manual driving mode at any time; Germany plans to issue automated\
  \ driving regulations requiring steering wheels and the installation of aviation-style\
  \ black box devices for accident liability determination.\n\nA Volvo survey shows\
  \ that over half of consumers support retaining steering wheels in autonomous vehicles,\
  \ and 80% believe accident liability should be borne by the manufacturer (due to\
  \ autonomous driving system failures). In reality, when users distrust the autonomous\
  \ driving system in emergencies and wrestle for control, it easily leads to severe\
  \ consequences: during autonomous driving, the driver relaxes and does not pay attention\
  \ to road conditions, and misjudgment in sudden situations easily leads to danger.\n\
  \n\n\n\n###### Safety and Development of Autonomous Vehicles\n\nWhen the driver\
  \ and the vehicle vie for control (traffic accidents), traffic authorities struggle\
  \ to determine liability. If drivers are required to stay alert and be ready to\
  \ switch to manual mode while the vehicle is in motion, one might as well adopt\
  \ manual driving directly. This \"human or vehicle\" design renders autonomous driving\
  \ meaningless, increases the driver's psychological burden, and dashes the desire\
  \ for free and comfortable driving.\n\nEssentially, the \"human or vehicle\" design\
  \ is an irresponsible manifestation regarding autonomous driving safety. If there\
  \ is a \"fallback\" of manual driving, relevant personnel will not focus on autonomous\
  \ driving safety issues; unified standards for the design and manufacture of autonomous\
  \ vehicles cannot be established in the short term, and user safety cannot be effectively\
  \ guaranteed.\n\nOn May 7, 2016, a Tesla with the `Autopilot` driver-assistance\
  \ system engaged collided with a white tractor-trailer; the `Autopilot` roof was\
  \ completely destroyed, and the driver was killed instantly. Tesla explained: the\
  \ white truck was not recognized against the bright sky background, and from the\
  \ `Autopilot`'s perspective, the side of the trailer appeared suspended in mid-air,\
  \ causing the system to misjudge and fail to activate automatic emergency braking,\
  \ resulting in the collision. Furthermore, because the impact occurred at the `Autopilot`'s\
  \ windshield area, the crash safety system failed, leading to the driver's instant\
  \ death.\n\nThe accident caused a sensation, as Tesla had claimed a fatal accident\
  \ occurs every 94 million miles in the US, while the `Autopilot` system had logged\
  \ 130 million miles. Tesla emphasized that autonomous driving technology is continuously\
  \ evolving and that `Autopilot` is not perfect. Who exactly should be held responsible?\
  \ Some blame Tesla, some blame the negligent driver, and others blame the sensor\
  \ supplier `Mobileye`. This perception of autonomous vehicle accidents recalls the\
  \ \"War of Currents\" between Tesla and Edison.\n\nIn 1880, Tesla invented the world's\
  \ first AC generator, while Edison invented the electric chair to publicize the\
  \ dangers of AC power. After fierce competition, Tesla's AC system prevailed, making\
  \ outstanding contributions to the development of human civilization. All new things\
  \ have both pros and cons; there are no absolute advantages or disadvantages. Facing\
  \ the new phenomenon of autonomous vehicles, we should grasp the development trend\
  \ and not completely deny it due to a single accident.\n\n####### How to Solve Autonomous\
  \ Vehicle Safety Issues?\n\nTo reduce traffic accidents during autonomous vehicle\
  \ operation, manufacturers should establish a strict system of regular factory maintenance\
  \ for vehicles and an emergency response service system for operation. They should\
  \ focus on establishing a \"dual-system\" control mode to address the risk of vehicle\
  \ network compromise (e.g., hacking, virus damage). In the \"dual-system,\" the\
  \ primary system refers to the networked open system, and the backup system refers\
  \ to an independent closed-loop system. Once the driver detects that the primary\
  \ system has been compromised, they can immediately switch to the backup system\
  \ to ensure normal vehicle operation and safe passenger evacuation, followed by\
  \ repair.\n\nIf the primary system is damaged but the driver fails to notice (e.g.,\
  \ code tampering causes the vehicle to hit an obstacle instead of avoiding it),\
  \ the driver may not have time to switch systems, leading to an accident. Therefore,\
  \ manufacturers must install protective software on autonomous vehicles to enable\
  \ automatic fault detection and virus scanning/removal, and they must assume responsibility\
  \ for accidents caused by insufficient protection, preventing manufacturers from\
  \ shirking responsibility and harming user rights. Additionally, manufacturers should\
  \ ensure that internal and external vehicle interfaces are difficult to disassemble\
  \ and tamper with, preventing human sabotage and effectively enhancing safety performance.\n\
  \nFurthermore, if traffic authorities mandate that autonomous vehicles must be switchable\
  \ to manual mode at any time, bus and taxi companies—which are the most suitable\
  \ candidates for introducing autonomous vehicles—will completely lose the \"labor-free\"\
  \ advantage. The reason is: without full-time drivers, companies would first have\
  \ to verify users' licenses, alcohol consumption, drug use, etc.; the process becomes\
  \ not simpler but more complicated, and the original convenience of autonomous vehicles\
  \ risks becoming an illusion.\n\nIn summary, traffic authorities should not enact\
  \ regulations requiring \"autonomous vehicles to be switchable to manual mode at\
  \ any time\"; otherwise, it will lead to vague industry standards, unclear responsibilities,\
  \ and a chaotic, awkward situation. If manual assistance is accepted to avoid accidents,\
  \ autonomous driving has a major loophole. To achieve the ultimate goal of autonomous\
  \ driving development, traffic management departments must reform the existing traffic\
  \ system, clarifying the responsibilities of autonomous vehicle manufacturers, system\
  \ software providers, bus operating companies, and insurance companies, so that\
  \ users can ride with peace of mind. Recently, the US federal government and some\
  \ states have affirmed the legality of autonomous driving; the NHTSA determined\
  \ that `Google`'s autonomous vehicle is controlled by the automated driving system,\
  \ not manually by the owner. That is, the old rule of \"must be equipped with a\
  \ steering wheel and brakes\" no longer applies.\n\nIn the future, autonomous vehicles\
  \ will no longer be equipped with steering wheels, pedals, instrument clusters,\
  \ control levers, rearview mirrors, and other devices. Instead, they will feature\
  \ panoramic windows, 3D screens, spacious open cabins, mobile communication and\
  \ office equipment, etc. At that time, the car will no longer be a \"connector\"\
  \ of life but an extension of living space; people's time and energy will be completely\
  \ liberated to engage in more meaningful and valuable affairs.\n\n##### 12.5.2 Practice:\
  \ Autonomous Driving Practice\n\n\n\n\n\n###### 未来无人驾驶汽车的发展愿景\n\n随着用户对无人驾驶汽车需求的爆发式增长，无人驾驶汽车将迅速走进人们的生活，成为日常生活空间的重要组成部分，并将成为最重要的交通工具。届时，纯电动无人驾驶汽车的功能将日益完善。无人驾驶汽车不仅将在道路上行驶，还将直接驶入办公楼、住宅楼，甚至进入房间，成为用户的办公室、休息室、会议室，并可能演变为功能齐全的“房车”。\n\
  \n此外，办公区和居住区也可能进化为巨大的“房车”。无人驾驶汽车将像包裹一样层层嵌套，小车嵌入中车，中车嵌入大车，从而产生无限变化。当然，纯电动无人驾驶汽车也可停放在室外，利用太阳能充电，同时在行驶之外继续为用户提供服务。\n\
  \n新概念汽车将借鉴碰碰车的理念，车身采用柔性环保材料，具有强韧性，以减少摩擦和碰撞，并缓冲因摩擦、碰撞及意外冲击造成的损伤。传统金属车身虽然坚固美观，但在环保节能、防腐蚀、隔音、安全性及实用性方面表现不佳。采用新型柔性材料制造车身，可赋予车身多样化变化，从而衍生出陆地、水上、空中行驶的伸缩车、变形车、两栖车等多种车型。\n\
  \n此外，使用柔性材料制造车身，使车身的存储、组装和运输更加便捷，加上纯无人驾驶电动汽车结构相对简单，将使汽车制造变得更容易，成本大幅下降。可以预见，在不久的将来，世界各地的道路上将出现外观和尺寸各异的无人驾驶电动汽车。凭借宽敞的车厢、丰富完善的功能、亲近自然、价格更低、灵活性更强及抗灾能力等优势，无人驾驶汽车将可与传统住房媲美，甚至更受欢迎。\n\
  \n再者，无人驾驶汽车也呼唤能源补给的便利性。例如，纯无人驾驶电动汽车可在无人控制的情况下提前寻找充电桩完成充电，或利用空闲时间充电，乘客可利用充电时间处理其他事务，因此即使纯无人驾驶电动汽车目前无法快速充电，也无需担心用户浪费时间。在无人驾驶汽车加注燃料的情况下，车辆将在无乘客在场的情况下自动驶往加油站加油，也可降低安全风险。此外，在无人驾驶环境下，充电站的建设数量可减少，从而降低基础设施建设和维护成本。\n\
  \n在续航里程方面，虽然纯无人驾驶电动汽车的续航里程不如燃油车，但因其具备更高的能源安全性和更好的运行能力，可在行驶过程中完成移动充电，这就像飞机空中加油一样。需要移动充电的纯无人驾驶电动汽车可对接专用充电服务车，或对接同行的其他纯无人驾驶电动汽车。\n\
  \n无人驾驶汽车的充电方式可以是直接更换电池，也可以采用车对车对接。无论采用何种充电方式，给无人驾驶汽车充电都比给有人驾驶汽车充电简单得多。主要是私家车在途中进行移动充电，而公交车和出租车可根据行驶里程和电量，安排乘客在合适的时候换乘其他车辆继续行程。\n\
  \n##### 12.5.3 体验：满足用户的生活与娱乐需求\n\n###### 12.5.3.1 外观造型、空间布局与基础功能的优化\n\n在无人驾驶条件下，驾驶员的身体姿态可以更加放松，不仅限于坐姿，还可以是躺姿、站姿等。为了响应驾驶员的需求，车厢必须升高加大，座椅需可收纳伸缩，既可作为驾驶员半躺的座椅，也可拉平成供驾驶员躺卧的床铺，甚至可折叠收起以允许驾驶员自由站立。升高加宽的车门可采用“走入式”设计，比传统轿车的“坐入式”设计方便得多。此外，车内可放置小型折叠桌，打造简易办公空间。\n\
  \n无人驾驶汽车制造商可根据用户需求设计多种车型，如单人、双人、多人车型，以节约能源、降低出行成本。事实上，单人无人驾驶汽车必将深受上班族欢迎。单人无人驾驶汽车可设计为单排宽轮车，外观类似带篷的大型摩托车，不仅节省空间、驾驶更灵活，还能节能环保。多人无人驾驶汽车可进一步细分为可共享空间的巴士、中巴及具有空间隐私性的舱体车，将进一步提升行车安全性。由于无人驾驶汽车按统一标准设计，可像列车一样组装连接成内部空间相通的大型车辆。若有更多物品需要运输，可调动其他无人驾驶车辆通过组合连接来扩展车内空间。\n\
  \n此外，无人驾驶汽车还可根据行驶环境和任务划分为短途车和长途车。短途无人驾驶汽车主要在城市内行驶，速度不宜过快、功能不宜过复杂，但应具备强大的综合感知能力。长途车主要行驶在城际高速公路上，因此速度可设计得较高、功能适当丰富，综合感知能力可适当减弱。这种车辆分工可节约资源、降低成本。\n\
  \n###### 12.5.3.2 基于车联网提供通信办公与生活娱乐服务\n\n在无人驾驶环境下，驾驶员无需自行驾驶，可将出行时间用于其他事情。据美国交通部估算，每人每天通勤约\
  \ 52 分钟。在无人驾驶汽车中，人们可更高效地利用这段时间。如果无人驾驶汽车车厢足够大、行程时间足够长，并配备必要的信息技术设备，无人驾驶汽车可创造舒适的办公空间，使移动办公和移动生活成为现实，真正实现“车即服务”和“车即生活”的理念。\n\
  \n\n\n\n\nAutonomous vehicles also involve user privacy, and for civil servants,\
  \ they may even involve national security. Autonomous vehicles can adopt non-real-name\
  \ payment methods to protect privacy and national security. At the same time, users\
  \ can disable phone location services, use mobile internet without real-name authentication,\
  \ or even disconnect from the network during the ride. With these measures in place,\
  \ even if the vehicle remains under the monitoring of the Internet of Vehicles (IoV),\
  \ there is no real-name correspondence between the vehicle and the user; therefore,\
  \ user privacy can be greatly guaranteed. In addition, users can manually turn off\
  \ in-car cameras and directional devices during the trip to prevent privacy leaks.\n\
  \nOf course, users taking these measures will block safety monitoring; once an accident\
  \ occurs, it will hinder traffic police from handling it quickly. An autonomous\
  \ vehicle that goes offline becomes a veritable \"unlicensed taxi\" (black car),\
  \ unable to receive instructions from the command center or feed back driving intentions\
  \ to it. The command center can only monitor it through roadside surveillance and\
  \ information provided by surrounding vehicles. To ensure vehicle safety, the command\
  \ center and management departments must retain certain monitoring permissions for\
  \ public transport modes such as buses and taxis, and utilize automatic detection\
  \ technology to promptly detect dangerous goods and lost items, ensuring passenger\
  \ safety and facilitating the retrieval of lost property.\n\n#### 12.6 Application\
  \ of Autonomous Driving Technology in Urban Rail Transit\n\n##### 12.6.1 Overview\
  \ of Metro Automation Technology Application at Home and Abroad\n\nWith the continuous\
  \ improvement of China's economic development level, the construction of rail transit\
  \ systems in various regions has accelerated. Through the active efforts of universities,\
  \ research institutes, enterprises, and other parties, a large number of new urban\
  \ rail transit technologies have emerged, especially the application of fully autonomous\
  \ driverless technology in the field of urban rail transit, which has important\
  \ practical significance for improving the quality and efficiency of urban rail\
  \ transit systems, perfecting the urban rail transit network, and docking with the\
  \ rail transit system standards of a transportation powerhouse.\n\n###### 12.6.1.1\
  \ Advantages of Autonomous Driving Technology\n\n(1) Fully autonomous driverless\
  \ metros can automatically wake up, sleep, clean, park, run, open/close doors, and\
  \ repair faults. Different operating modes such as normal operation, degraded operation,\
  \ and interrupted operation can be set to meet personalized needs in different scenarios,\
  \ improving operational safety and riding experience.\n\n(2) Driverless trains start\
  \ and stop more smoothly, providing passengers with a high-quality travel experience\
  \ at higher speeds and reducing travel costs.\n\n(3) Fully autonomous driverless\
  \ metros have a higher degree of automation, which can significantly reduce labor\
  \ and material costs. Although the construction cost of such metros may be higher,\
  \ their positive role in improving metro operational efficiency and quality and\
  \ reducing operational costs is obvious.\n\n###### 12.6.1.2 Overview of Autonomous\
  \ Driving Technology Application in Urban Rail Transit Abroad\n\n(1) **Paris Metro\
  \ Line 1**: This line opened in July 1900 and is the busiest and oldest east-west\
  \ line in the region, with a total length of 17 km covering 25 stations. The line\
  \ passes famous landmarks such as the Arc de Triomphe, the Louvre, Place Charles\
  \ de Gaulle, and the Champs-Élysées. In 2011, the line applied driverless trains\
  \ based on the Trainguard MT safety control system.\n\n(2) **Barcelona Metro Line\
  \ 9, Spain**: This line has a total length of 41.4 km, achieving real-time data\
  \ transmission via spread spectrum radio, with trains automatically driven by a\
  \ fully automatic driverless system.\n\n(3) **HSST-100 Maglev System in Aichi Prefecture,\
  \ Nagoya, Japan**: An HSST-100 maglev system was built with a total line length\
  \ of 8.9 km covering 9 platforms, adopting the ATO (Automatic Train Operation) driverless\
  \ mode.\n\n###### 12.6.1.3 Overview of Autonomous Driving Technology Application\
  \ in China\n\nChina already has a considerable number of metro lines that fully\
  \ apply automated driverless technology.\n\n(1) **Beijing Rail Transit Airport Line**:\
  \ It employs fully autonomous driverless trains, which can optimize and adjust train\
  \ operation strategies and headways based on passenger flow. It is also equipped\
  \ with a relatively complete operation assistance system, enabling real-time train\
  \ positioning, automatic train turnback, shortened headways, and increased passenger\
  \ capacity.\n\n(2) **Shanghai Metro Line 10**: China's first line to apply driverless\
  \ technology, it achieves more precise acceleration and deceleration control, eliminates\
  \ the need for driver scheduling plans, and trains perform extensive self-checks\
  \ daily after startup, featuring higher safety and reliability.\n\n(3) **Beijing\
  \ Rail Transit Yanfang Line**: China's first fully autonomous metro line developed\
  \ independently, and the second line to apply driverless technology after Shanghai\
  \ Metro Line 10. Phase 1 opened at the end of 2017, and Phase 2 was expected to\
  \ open in 2020. The trains run smoothly and efficiently, providing passengers with\
  \ a high-quality riding experience, and reducing energy consumption by 10%~15% compared\
  \ to conventional trains.\n\nBenefiting from the fact that urban rail transit operates\
  \ on dedicated tracks with less interference from pedestrians and other vehicles,\
  \ the application of driverless technology has brought great convenience. The R&D\
  \ of driverless technology will not only promote the continuous improvement of urban\
  \ rail transit but also provide valuable reference experience for the large-scale\
  \ application of driverless technology in the transportation field, ushering in\
  \ a new era of unmanned transport for human society.\n\n##### 12.6.2 Functional\
  \ Characteristics of Unmanned Urban Rail Transit Systems\n\nIn recent years, the\
  \ development of urban rail transit has accelerated, and supporting technologies\
  \ have been updated rapidly. Many first-tier cities with large populations face\
  \ tremendous passenger flow pressure and can only shorten the construction cycles\
  \ of new lines, increase the number of busy lines and service frequencies, which\
  \ inevitably requires hiring more attendants and drivers, undoubtedly incurring\
  \ higher costs.\n\nMoreover, increasing train frequency increases manual labor intensity;\
  \ maintaining high-intensity physical labor for long periods easily leads to safety\
  \ accidents due to fatigue. In view of this, the urban rail transit industry is\
  \ increasingly introducing driverless technology.\n\nIn summary, the functional\
  \ characteristics of the urban rail transit unmanned driving system are mainly reflected\
  \ in the following aspects:\n\n\n\n\n\n###### 自动化控制在列车运行中的体现\n\n(1) 列车运行的自动化控制具体体现在列车启动、列车对正、障碍识别、列车与屏蔽门监控、编组调整等多个工作流程中。列车运行可实现智能化操作，取代传统人工操作，实现运行的机电一体化。\n\
  \n(2) 可提高列车运行的效率与舒适度，同时节约能源。通过以计划时刻表为参考，合理控制列车运行间隔和运行时间，实现节能目标；通过计算机有效控制牵引制动冲击率，仅在必要时进行加减速。基于历史客流时空分布分析、实时断面客流变化、大客流预警信息，结合原计划调整开行方案，保持列车运行间隔的合理性，必要时立即疏散乘客。\n\
  \n(3) 车辆、通信、信号系统运行可相互配合，在各部分形成相对完善的子系统，充分发挥综合监控系统（`ISCS`）的作用。加强不同子系统间的联系，在列车救援、设备故障排查等工作中发挥不同功能。`COCC`\
  \ 结合 `ISCS`，共同实现自动化网络运营，整体提升运营效率。\n\n(4) 列车处于正常运行状态时，开放人机监控界面及相应接口，向运营人员、乘客、维修部门发送相关信息，方便需求方查询使用；若发生异常，自动启动安全预案并预警，自动化或配合技术人员明确影响程度、查找问题根因，开放接口服务便于维修人员介入。\n\
  \n##### 12.6.3 城市轨道交通无人驾驶的要求\n\n(1) **列控系统要求高安全性**。作为无人驾驶系统的重要组成部分，控制系统负责广泛的安全控制，协调多种功能配合有人驾驶系统。需在实施安全分析基础上解决相关问题，提升整体运营安全性。例如，线路设计阶段需确保运行环境不受外部干扰，后续开发中需持续完善安全体系，通过传感器及时感知安全风险。\n\
  \n(2) 由于无人系统人员参与有限，仅具备充足的安全性、可维护性、可靠性和可用性，才能维持正常运营。设备故障或紧急情况时，需利用远程监控系统及时有效响应；无人系统还应具备场景分析和及时发布应急预案的能力。异常情况下，预案制定应综合考虑乘客不同需求，将保障乘客人身安全作为首要任务。\n\
  \n(3) **`CBTC`（Communication-Based Train Control，通信列车控制）移动闭塞系统**广泛应用于无人驾驶系统，关键在于利用完善的网络维持系统正常运行。若在运营过程中要发挥不同系统间的协同效应，完善网络系统的价值将更加凸显。\n\
  \n(4) 无人驾驶系统颠覆了传统人工管理模式，要求城市轨道交通部门改变现有建设方法、调整组织架构，积极借鉴国内外成功项目经验，结合中国城市特定特殊场景制定更合理规划方案，全方位推动无人驾驶系统发展完善，提升相关部门管理能力。\n\
  \n(5) 无人驾驶系统建设可从多方面推动城市轨道交通系统发展，提升自动化智能化水平。除以自动化运行替代司机操作外，其价值还体现在主导层面，应敢于突破传统观念束缚，主动创新。后续发展将聚焦利用大数据和人工智能技术，针对客流、运营、故障处理、灾害管理等问题响应，优化运营策略，为乘客及运营参与者提供优质服务。\n\
  \n##### 12.6.4 城市轨道交通无人驾驶应用难点\n\n(1) **在线测试与监控**：监控车辆运行状态仅是在线监控工作的一部分，还包括自动预约系统、信号系统、乘客信息系统、火灾报警系统等多个系统。系统故障时应及时响应并作出相应处置。障碍物检测是无人驾驶系统不可忽视的关键环节，除检测外还需采取适当处置措施。目前行业常用接触式检测，缺乏有效非接触式障碍物检测。检测到障碍物即通过紧急制动响应，难以提升无人驾驶效率。同时需重点关注烟火检测、反恐防暴监控、异物入侵监控及其处置方法，降低无人驾驶车辆运行阻力。\n\
  \n(2) **车辆自动联挂**：列车运行遇紧急情况导致锚定时，需启动应急救援。救援过程中，故障列车需与救援车辆连接，自动联挂可解决此问题。但要在救援现场快速完成故障列车与救援车辆的一次性自动联挂，必须提升相关技术水平。当前自动联挂存在诸多限制，仅同向行驶且车门处于关闭锁定状态的通讯列车才能实现自动联挂。未来应更多关注提升故障列车救援效率，减少自动联挂限制。\n\
  \n\n\n\n\n###### (3) 运营中的紧急事故处理\n\n如果运营中发生紧急情况，尤其是列车发生不可预见的情况，可能会引发严重危机。例如，当一名乘客在处于运营区间、且列车处于无人全自动运行模式（无后续维护人员）的列车上按下紧急制动按钮时，可能会发生严重危机。针对这类情况，运营管理者需要制定针对性的解决方案。车站内时有乘客违反地铁运营规则的情况发生，例如乘客强行闯入月台屏蔽门，或列车关门时车门被夹住，这将导致列车异常运行。所有这些紧急情况都应由车站工作人员处理，这要求他们能够预判风险并做出高效决断。\n\
  \n目前，无人驾驶领域仍存在许多亟待攻克的技术难题，如构建更完善的信号系统。中国一线城市的地铁承载着巨大的客流压力，包括高发车频次和严苛的安全要求，但地铁系统的功能将在技术水平不断提升的基础上逐步完善，无人驾驶技术面临的困难也将逐步被克服。随着运营系统开发的日臻完善，越来越多的城市轨道交通将引入无人驾驶技术，这将推动地铁运营实现跨越式发展。\n\
  \n##### 12.6.5 基于无人驾驶的城市轨道交通解决方案\n\n城市轨道交通作为城市交通建设的重要组成部分，是城市居民日常出行的主流工具，对其出行体验具有至关重要的影响。近年来，城市轨道交通技术迎来了快速发展期，涌现出大量无人驾驶技术应用，这为控制列车运营成本和提升出行服务质量提供了新思路，是交通领域的一个主要热点方向。因此，分析无人驾驶技术在城市轨道交通中的应用以寻找有效解决方案，将推动该技术在城市中的普及，对无人驾驶技术在轨道交通领域的大规模应用产生积极影响。\n\
  \n###### 12.6.5.1 设施设备保障\n\n**列车功能保障**：运营中的无人驾驶列车无需人工介入，因为列车不仅具备自动运行功能，还能自检故障。当列车某部位存在潜在安全隐患或故障时，列车必须能够查明问题根源，提供有效解决方案，及时采取有效措施防止事态恶化，从而确保列车稳定安全运行。\n\
  \n列车必须能够自动执行后退定位。当无人驾驶列车越过停车位置时，执行上下客操作极易引发安全事故。因此，必须确保无人驾驶列车能执行后退定位，以保障乘客上下车安全。\n\
  \n列车还必须具备自动检测和处理障碍物的功能。当无人驾驶列车运行中遇到障碍物且未及时采取有效措施时，可能引发重大交通事故。因此，无人驾驶列车必须能够自动检测并有效处理障碍物，以确保运营安全。\n\
  \n列车还必须具备视频监控功能。在视频监控系统的支持下，列车运行控制中心可实时掌握列车内外状况，以便在列车运行出现问题时，控制中心能及时有效地调整，防止交通事故发生。\n\
  \n**信号**：信号是影响无人驾驶列车运行的重要因素。只有信号系统稳定运行，列车才能完成加速、减速、转弯、停车、开关门等动作。信号系统出现问题时，可能发生夹乘客、列车脱轨等安全事故。因此，信号系统的自动检测与维护显得尤为关键。\n\
  \n**疏散平台**：列车运行中发生事故时，处理难度可能更大，因为工作人员无法到达现场有效处置。为减轻事故负面影响，必须在隧道内设置疏散平台，以便事故发生时将乘客转移至安全区域。\n\
  \n无人驾驶技术本身对配套软硬件设施有着高度依赖。当配套软硬件设施出现问题且控制中心无法有效解决时，必须人工制定解决方案。因此，列车运营部门必须对列车配套设施设备进行实时巡检，全方位保障无人驾驶列车运营的可靠性。\n\
  \n###### 12.6.5.2 创新管理模式\n\n某些情况下，控制中心的远程控制无法有效解决问题，运营中出现故障时必须由工作人员进入车内处置。人工处置也需要一定时间，乘务人员无法像传统有人驾驶列车那样及时处理问题。因此，必须创新管理模式，以提高无人驾驶列车的问题处理速度。\n\
  \n无人驾驶列车中不存在司机角色，传统有人驾驶模式下司机的职能将转移至调度部门，这要求后者更加精细化，即无人驾驶列车的调度部门应具备较强的沟通协调能力和专业驾驶技能等，以便实时监控列车客流，即时响应乘客反馈，在最短时间内为乘客提供有效解决方案。\n\
  \n此外，应建立更完善的维修调度体系，以解决更复杂的无人列车运营问题，使得在发生信号系统故障、列车轨道损坏等复杂问题时，能快速解决。为此，维修调度、行车调度、客运调度需保持高效协同，这要求将三者同时整合进控制中心调度系统。\n\
  \n###### 12.6.5.3 人员素质\n\n无人驾驶技术在城市轨道交通领域的应用高度依赖专业人才。虽然列车内可能不再有工作人员，但这并不意味着无人驾驶列车不再需要人力支持。相反，对相关工作人员的综合素质和技能提出了更高要求。\n\
  \n\n\n\n\n####### 无人驾驶技术在轨道交通中的应用前景与挑战\n\n######## 控制中心与车站的新要求\n\n######### (1)\
  \ 控制中心\n例如，当列车发生故障时，更有可能由控制中心远程控制处理，而以前可能仅由司机简单处理。现在由于无人驾驶列车上没有乘务人员，列车调度员不仅应具备调度技能，还应具备列车事故处理技能，如安抚乘客、分析和解决列车故障等。当然，为了使列车调度员具备这些技能，他们需要接受专业培训。\n\
  \n######### (2) 车站\n随着无人驾驶技术在城市轨道交通中的应用，车站需要配备更多、专业程度更高、服务水平更高的人员，以便有效应对列车可能发生的各类事故。\n\
  \n###### 12.6.5.4 乘客配合\n\n乘客在列车运行时需要做好配合无人驾驶列车的工作。一方面，应减少人为对列车运行的干扰。如果乘客对列车运行的部分干扰未能及时制止，由于列车上没有乘务人员，将对列车运行产生巨大负面影响。在这种情况下，除了对干扰列车运行的行为进行严厉惩罚外，还需要乘客主动配合。另一方面，乘客可在救援中提供协助。列车事故发生后，专业人员赶到事故现场需要一定时间，可能会错过最佳救援时机。如果乘客能按照事故处理要求自发妥善处理事故，将有效降低事故危害。\n\
  \n无人驾驶技术应用于轨道交通运输的前景值得我们高度期待。政府部门需要采取平衡方法，抓住关键点，在鼓励创新、为企业家和企业提供更优越营商环境的同时，引导无人驾驶技术安全、规范地应用和发展，以确保无人驾驶技术在中国快速稳定发展。\n\
