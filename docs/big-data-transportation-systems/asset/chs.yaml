- "## 大数据交通系统\n\n\n\n# Preface\n\nOn May 10, 2017, my student Dr. Zhao Guanghui and\
  \ I discussed issues related to the development of intelligent transportation at\
  \ AIMS in Hangzhou. Subsequently, he planned to write a book on transportation big\
  \ data. I told him that the University of Michigan has a world-leading intelligent\
  \ transportation laboratory. They spent years trying to optimize a few traffic lights\
  \ next to the University of Michigan. Afterwards, they came to a large city in China\
  \ and began managing traffic lights using big data, conducting transportation big\
  \ data experiments. With the help of traditional cameras and induction loops, traffic\
  \ lights were switched manually every 90 seconds. By analyzing congestion data sent\
  \ to the monitoring center, AI was used to adjust the traffic lights. Two months\
  \ later, peak-hour congestion in the city was alleviated by 20%. In the future,\
  \ more cities around the world will optimize traffic lights through big data, which\
  \ will help maximize the utilization of limited road resources and save a tremendous\
  \ amount of time and transportation resources. Furthermore, China has 150 million\
  \ to 200 million private cars. These vehicles sit idle in parking lots approximately\
  \ 95% of the time each day. They occupy vast amounts of space, waste resources,\
  \ and cause congestion. With the help of big data, these idle resources can be mobilized\
  \ to serve people in need of rides. What a tremendous contribution this practice\
  \ will make!\n\nAfter reading this manuscript co-authored by Dr. Zhao Guanghui and\
  \ Professor Zhu Gusheng, I am deeply convinced that big data technology has driven\
  \ the development of transportation in China. The examples covered in the book include\
  \ the collection of transportation big data sources, the application of transportation\
  \ big data platforms, pain points, cases, and business models in transportation\
  \ logistics, public transportation, and traffic safety, operational experience,\
  \ as well as the current status, strategies, and actions of transportation big data\
  \ in other countries. Dr. Zhao proposes that transportation big data has changed\
  \ the travel mode of Chinese society, shifting from the past \"finding a car\" to\
  \ the current \"dispatching a car to find a person.\" By analyzing data from rainy\
  \ days, sunny days, peak hours, off-peak hours, weekdays, and holidays, it is possible\
  \ to predict future travel conditions and passenger flow at specific locations under\
  \ these circumstances. The accuracy rate has now reached 85%–90%. Decisions can\
  \ be made 15 minutes in advance to dispatch vehicles to designated locations. With\
  \ 15-minute advance dispatching, route planning, and positioning, ride-hailing services\
  \ have brought tremendous convenience to people, which was previously unimaginable.\
  \ Now people have taken it for granted.\n\nThe effort to match passengers and vehicles\
  \ is not the only application. Thanks to big data, the effort to match people and\
  \ goods has also undergone tremendous changes. At 24:00 on November 11, 2017, Tmall's\
  \ single-day sales reached 168.2 billion yuan. Of this, online shopping contributed\
  \ 90%, with buyers and sellers covering 222 countries and regions. Before \"Double\
  \ 11,\" sellers used big data to predict that express parcel volume would grow by\
  \ more than 30% compared to 2016. Big data predicted that parcel volume on \"Double\
  \ 11\" would reach 1.4 billion, with over 1.7 million couriers participating in\
  \ logistics. By enhancing collaboration and data sharing to improve logistics services,\
  \ electronic waybills covered over 80% of the entire industry. This was the first\
  \ time big data prediction covered more than half of the industry's express parcels,\
  \ improving efficiency through the connection of big data and social collaboration.\
  \ Based on the upgrade of the logistics early warning radar, the big data platform\
  \ has been comprehensively upgraded from time-period prediction to real-time prediction,\
  \ covering over 50% of China's express parcels. Algorithm optimization has enabled\
  \ the application of more dimensions of big data. As a result, real-time prediction\
  \ of daily parcel delivery volume has become possible, with an accuracy rate exceeding\
  \ 90%. This data can help express partners deploy capacity, and enterprises can\
  \ prepare capacity in advance based on predicted data. Consequently, efforts increased\
  \ by 4,000 temporary workers and 5,240 trucks, and aircraft lease tonnage was increased\
  \ in advance. \"Big data order routing\" can automatically calculate delivery routes\
  \ based on waybill information and assign parcels to the outlets nearest to buyers.\
  \ Over 50% of parcels reach buyers faster through big data order routing. Sellers\
  \ use big data to predict best-selling products and manage inventory in warehouses\
  \ nationwide, bringing parcels as close to buyers as possible. By using big data\
  \ to predict parcel volume, goods can be delivered to buyers earlier. The model\
  \ has shifted from \"buyers waiting for parcels\" to \"parcels finding buyers.\"\
  \n\n\n\n\n# *大数据交通系统*\n\n*大数据交通系统*为我们观察和利用大数据带来了全新的视角，这得益于赵光辉博士从密歇根大学归来后的辛勤耕耘，以及朱古生教授对中国交通事业的持续关注。我曾为他们合著的《“互联网+”交通》一书作序。本书《大数据交通系统》描绘了交通发展的新阶段。在中国建设交通强国的战略背景下，这种前瞻性研究、学者与交通一线工作者的互动，以及学者为世界交通发展做出的贡献，显得愈发必要。每个人都应有其人生目的，因为你的存在会影响社会和身边的人。无论扮演何种角色，每个人都能为世界带来改变。我希望赵博士继续努力、勤奋工作，把握世界重大技术变革，顺应世界潮流，以其国际视野、博大胸怀和非凡智慧，为交通强国梦提供更多研究成果，为读者奉献更多著作。\n\
  \n我相信，凭借中国交通领域人才的智慧和世界各地人才的贡献，中国的交通大数据未来必将更加先进。中国将更接近建设世界交通强国的目标，凭借大数据推动中国交通发展的前景也将更加光明。\n\
  \n倪军\n\n*美国密歇根大学*\n\n2017 年 12 月 12 日\n\n### 前言\n\n大数据是一个备受全球瞩目的热门领域，因为它将深刻改变人们的工作和生活方式。其巨大的应用潜力已在许多领域得到充分体现。通过应用大数据技术，菜鸟物流建立了由“天网+地网+人网”支撑的中国智慧物流骨干网；[toutiao.com](http://toutiao.com)积极构建具有个性化设计、覆盖面广、投入产出比高的智能推荐算法；亚马逊专注于开发智能化、互联网化、自动化的智慧供应链管理系统。大数据在交通领域的应用也备受期待。交通大数据是指采集具有大规模、多源、多类型、结构复杂、价值密度低等特征的数据。通过运用大数据技术和分析方法挖掘其关联性和共性规律，可以为相关部门的管理决策提供有力的数据支撑，加速智能交通和智慧城市的成功实施。\n\
  \n虽然中国交通事业起步不长，但凭借后发优势取得了显著进步。作为一个幅员辽阔、地形气候条件复杂、地理差异巨大的国家，中国经过多年的实践，在基础设施项目的研究、设计、试验、建设、养护和管理方面积累了丰富经验。我们攻克了在高原冻土、膨胀土和沙漠修建公路和铁路的世界性难题，高铁已成为“中国制造”的新名片并走向世界。然而，作为支撑国民经济发展的基础性、先导性、服务性产业，交通运输业是一个庞大而复杂的系统。要赶上日本、欧洲、美国等交通强国，绝非易事。发展交通运输业，光靠投入资金远远不够。我们不仅需要提供充足的人才、资金和技术，还需要在顶层设计上制定科学合理的战略规划、有效的实施方案和全面的长效保障机制。\n\
  \n毫无疑问，中国各级政府高度重视交通运输业的发展。在他们的努力下，公路和铁路里程快速增长；公共交通体系和地铁建设有序推进；在地方政府的支持和引导下，网约车、共享单车等“互联网+交通”新模式也蓬勃发展。然而，总体而言，中国交通运输业仍处于发展的初级阶段。区域发展不平衡、产业互联互通缺乏、信息技术滞后，导致了交通拥堵、交通事故频发、运输效率低、成本高等诸多问题。这些问题给人们的工作生活带来不便，也制约了中国经济平稳健康增长。交通大数据的出现，为解决上述问题提供了有效途径。\n\
  \n美国、英国等发达国家对大数据在交通领域的应用进行了深入研究和实践，在缓解交通拥堵、恶劣天气应急响应、路况分析预测等方面取得了良好成效。中国各级政府正努力追赶，在北京、上海、杭州等地积极探索应用，为全国树立了良好榜样。事实上，中国在推进交通大数据进程中投入了大量资源。但由于缺乏总体战略规划，重复建设、资源利用率低等问题尤为突出。同时，大数据人才极其匮乏。即使在发达国家，此类人才也是稀缺资源，因此大数据理论与应用研究仍相当有限。中国既懂大数据技术和分析方法又懂交通的复合型人才更是凤毛麟角。\n\
  \n\n\n\n#### 此外，信息孤岛问题尤为严重\n\n高效且具成本效益地收集、分析和应用来自多源的海量交通数据，是推进交通大数据落地实施的基础和前提，但中国不同地区、层级、部门间的信息系统尚未实现无缝对接，阻碍了交通数据的流通与共享。因此，打破不同地区、层级、部门间的信息孤岛，已成为中国交通大数据发展的一项重要任务。\n\
  \n本书对交通大数据兴起的宏观背景、发展现状、痛点、重点、战略规划及实施方案进行了系统深入的分析，提出了一条具有中国特色的交通大数据发展路径。本书对中国交通大数据发展历程的系统梳理令人印象深刻。特别是在总结美国、英国等交通强国交通大数据案例的同时，本书还详细分析了北京、上海、贵州、云南在这一领域的探索与实践。它为决策者、管理者、各级政府、技术服务商及设备制造商提供了宝贵经验。交通大数据的发展不仅将加速大数据、云计算、传感器、人工智能等新一代信息技术在交通领域的深度应用，更重要的是，它将为交通行业带来新的思维方式和发展理念。\n\
  \n与欧美相比，中国在交通大数据软硬件如技术、设备、信息系统等方面仍有差距，但若借鉴其经验，我们可以追赶上来。然而，若在思维方式和发展理念上落后，我们将永远沦为模仿者和追随者，交通强国梦将永远无法实现。因此，未来中国应抓住交通大数据带来的重要机遇，创新思维方式和发展理念，引进先进技术、设备和管理模式，通过发展交通大数据实现赶超，从而将自己从交通大国转变为交通强国。\n\
  \n赵光辉是倪军教授的学生。作为交通部认定的科技青年人才，他严谨精准地钻研大数据，善于创新探索。我很高兴为他的著作《大数据交通系统》作序。2014 年，我率团赴美国密歇根大学\
  \ M. Wu 制造研究中心考察美国制造业。当时倪军教授恰好在国内。赵博士在研讨会上告诉我们，他曾在交通部工作，来密歇根大学研究大数据制造和交通大数据。那是一次收获颇丰的访问。四年过去了，我仍清晰地记得在密歇根大学校园与赵博士合影的情景。过去四年里，他撰写了一系列交通大数据著作，其中一些已在海外出版。他始终孜孜不倦、勤奋耕耘，青年学者可向他学习。\n\
  \n郑庆华\n\n*中国，清华园*\n\n2018 年 4 月 13 日\n\n### 前言\n\n在当今信息急剧膨胀的世界里，数据已成为人类社会发展的宝贵资源。互联网时代以电子商务、电子办公、电子政务等形式，将人类数据通信推向了\
  \ PB 级，在我们生活的大多数场景中，大数据已成为描述海量非结构化和半结构化数据的一种方式和代名词。\n\n特别是与我们生活息息相关的交通领域，大数据的价值和作用日益凸显。交通领域蕴藏的海量数据和信息，若不加以妥善挖掘和利用，宝贵资源只会白白浪费。而且，智能化、个性化、自助化的交通目标将沦为空谈。\n\
  \n从某种意义上说，大数据交通即智能交通和自助交通。在大数据的支撑下，交通将更加合理、更加高效。\n\n自 2005 年智能交通领域快速发展以来，大数据备受政府重视，成为“保安全、增效率、改环境、节能源”的目标。交通领域许多技术已处于国际领先水平。随着大数据的日益普及，大数据交通与智能交通渗透得越来越广泛。相关产品和服务也在不断走进人们的生活。\n\
  \n例如，共享单车、滴滴打车、拼车、自助游、高德地图、智慧物流等，都是在大数据支撑下展现出旺盛生命力的智能产品和服务，使交通变得更加高效和环保。\n\n大数据交通的发展不仅受到中国的高度重视，也是全球的重要课题。然而，起步较早的日本、美国和欧洲拥有各自独特的技术和经验。这些技术和经验值得我们研究借鉴，以更好地发展我国的大数据交通。我们或许不能仅靠采纳他人的良策来解决自身缺陷，但有可能将其转化为己用。在大数据交通的发展与研究中，我们必须向他人学习，善于应用，盲目模仿永远无法自立。\n\
  \n全书将讨论与研究分为上、下两篇进行阐述，先认知后实践的编排顺序也符合读者的认知习惯。本书引用了大量国内外案例，包括相关政府行动案例以及企业探索案例，力求呈现大数据交通发展现状与未来的全景图。\n\
  \n大数据交通的发展并非一帆风顺。虽然取得了诸多成果，但仍存在各种问题。例如，中国大数据交通发展相对混乱，缺乏统一布局。行政区域划分较为碎片化，缺乏统一标准，这不利于大数据交通的未来发展，无标准的数据无法整体利用。若未来共享交通数据，协调格式和标准极可能耗时耗力。\n\
  \n此外，因中国大数据交通起步较晚，在交通数据共享层面，缺乏大型平台实现数据资源的开放共享。与国外相比，这些方面还有很长的路要走。若缺乏前瞻性规划与研究，未来可能会出现各种障碍。\n\
  \n\n\n\n\n总体而言，中国大数据交通的发展取得了巨大成功，未来前景极为广阔。在坚持国情发展的基础上，我们应更多地借鉴国外经验，超前谋划，发挥先发优势。准确把握大数据在智能交通领域的优势，对于提高交通效率、解决交通拥堵、保障交通安全、减少环境污染，以及在新的高度和起点上改善中国交通状况，具有极其重要的作用。\n\
  \n展望未来，我们期待更加便捷、轻松的出行方式。无论是政府还是企业，都能在大数据交通和智能交通领域探索出更好的模式，从而实现交通顺畅、环境友好、出行便捷的美好未来。\n\
  \n本书仓促成书，难免疏漏，恳请广大读者热心指正！\n\n### 作者简介\n\n![image](img/aut1.jpg) **赵光辉**（1976—），武汉大学研究员、教授、法学学士。曾获中南财经政法大学行政管理硕士、华中农业大学经济学硕士、武汉理工大学管理科学与工程博士，并在武汉大学、中国社会科学院完成博士后研究。曾任美国密歇根大学工程学院高级访问学者、贵州财经大学教授、交通运输部管理干部学院现代交通发展研究中心创始主任及交通运输部西部人才培训办公室主任、北京交管智库信息技术研究院首席研究员、武汉大学产学研问题研究中心研究员、中国科学技术大学\
  \ MPA 导师；获评交通运输部“交通青年科技人才”、交通运输部科技优秀管理者、交通运输部名师专家组专家；担任全国交通运输厅局长培训班授课教师、贵州省智库核心专家、广西壮族自治区核心专家、广西壮族自治区钦州市交通运输局副局长、广西交通运输厅交通强厅特聘专家。主持国家社科基金项目及交通运输部业务司委托研究项目，参与中国博士后科学基金项目、中国博士后特别资助项目及\
  \ 30 余项国家教育科学规划项目。在各类核心学术期刊发表学术论文 100 余篇，出版专著 20 余部。\n\n![image](img/aut2.jpg) **朱古生**，教授，《曲靖师范学院学报》编辑部主任；国家社科规划办通讯评审专家；云南省重点学科“应用经济学”学科带头人；云南省哲学社会科学重点研究基地首席专家；曲靖市委联系专家；曲靖市政府重大行政决策咨询论证专家；上海师范大学、云南农业大学硕士生导师。长期从事珠江上游经济文化研究，参与国家社科规划项目、教育部人文社科项目研究，主持省级哲学社会科学规划项目、省社科重点研究基地项目、校省合作项目、省教育厅科研基金项目等多项课题，荣获省级有突出贡献优秀专业技术人才、“地方高校学报优秀编辑”等荣誉称号，享受市级优秀骨干教师政府特殊津贴。\n\
  \n# 简介\n\n本书旨在作为一本关于交通大数据的科普读物。首先向读者概括介绍交通大数据，随后从全球视角阐述各国交通大数据的发展情况，包括战略、现状、行动、优势等，最后解释相关概念与技术基础，阐述交通大数据创新的广阔前景。在阐释概念之后，从实践角度探讨如何利用交通大数据。首先探讨大数据的来源（这是基础），并分析互联网企业入口之争的目的，继而探讨交通大数据平台的应用。最后，详细阐述交通行业中物流、公共交通、交通事故等领域的大数据痛点、应用案例、商业模式及运营经验。\n\
  \n本书定位为大数据交通科学的大众读物。\n\n其旨在让读者对大数据交通建立直观的场景感知。从全球视角介绍各国大数据交通的发展，包括战略、现状、行动、优势等，阐明相关概念与技术基础，并从创新视角补充大数据交通创新的广阔前景。这有助于我们建立对大数据交通的基本认知。\n\
  \n在建立大数据交通认知的基础上，我们应从实践角度考虑如何应用。大数据的来源是大数据交通应用的基础。同时也分析了互联网企业争夺入口的目的。在探讨数据之后，将研究大数据交通平台的应用。书中还详细描述了交通行业中涉及痛点、应用案例、商业模式、运营经验、物流、公共交通和交通事故等大数据具体领域。还可增加不同层级的更多交通平台，如县级、三四线城市级，使不同岗位的人员都能有自己的参考和启发案例。\n\
  \n## 第一部分：认知：理解大数据\n\n第一部分涵盖对大数据交通的理解，包括大数据交通的各种应用场景、国外大数据发展现状、大数据交通概念的阐明、安全问题以及创新的本质。\n\
  \n### 第一章：什么是大数据交通？\n\n所谓大数据交通，是指通过互联网技术和大数据技术，利用数据处理工具对交通行业产生和沉淀的数据进行处理、分析和运营，从而产出更有效、便捷、高价值的交通、优化和治理方案，给人们出行带来便利，提高交通效率，节约能源资源，减少污染排放，并优化产业结构。\n\
  \n#### 1.1 大数据交通与互联网+\n\n##### 1.1.1 大数据来势汹汹\n\n随着工业社会向信息社会迈进，人类所有成果均以二进制信息的形式存储和传输，信息被转化为数字形式。有学者将人类社会的信息化进程划分为三个时代，即计算机时代、互联网时代和大数据时代。^(1)\
  \ 随着信息技术革命的兴起，互联网、移动互联网、社交网络、物联网、车联网、智能手机、平板电脑等信息技术的完善与普及，人类产生的数据呈指数级增长。\n\nMBA\
  \ 在线网站发布的信息图表显示，每天发送 2940 亿封电子邮件，在线发布 200 万篇博客，上传 2.5 亿张照片到 Facebook，上传 864 万小时视频到\
  \ YouTube，在流媒体音乐网站 Pandora 上播放 1.87 亿小时音乐会。^(2) 根据 IBM 的分析，人类文明获得的所有数据中，90%是在过去两年内产生的。到\
  \ 2020 年，全球产生的数据规模将达到当时的 44 倍。\n\n根据国际数据公司（IDC）的一份研究报告，在未来十年，全球大数据将增长 50 倍，到 2020\
  \ 年，世界将达到 35 泽比特（约 3.5 × 10 位）的数据信息量。涌现的数据类型繁多，数据在通信网络中快速传输，待开发的数据数量不断增加。人类社会正式步入大数据时代。\n\
  \n\n\n\n\n##### 1.1.2 大数据交通完美契合\n\n随着大数据技术的逐步完善，各行业对大数据的融合与应用日益深入。如今，从国家政策到商业营销，大数据无处不在，其价值日益凸显。交通作为数据天然沉淀的领域，与大数据紧密相连。无论是手机地图还是政府交通管理平台，大数据都发挥着至关重要的作用。\n\
  \n随着互联网与产业的持续融合、升级与发展，交通行业与各行业数据的关联日益紧密，海量信息为大数据交通的发展带来了机遇与挑战。抓住信息化与数字化的浪潮，是实现交通行业转型、优化与发展的关键。\n\
  \n大数据交通收集大数据集，并利用数据处理工具对其进行处理、分析与运营。作为天然的大数据应用行业，交通行业拥有海量数据源和多种多样的数据类型，各地区经济发展不平衡导致行业管理系统的数据收集与整合困难、数据处理低效甚至无效，以及数据快速增长带来的成本增加。挑战与机遇并存，但大数据交通行业顺应经济社会发展，为人们出行带来便利，提高交通效率，节约能源资源，减少污染排放，并优化产业结构。\n\
  \n大数据与交通的深度融合，与中国汽车工业的智能化发展密切相关。2017 年 9 月 9 日，工业和信息化部报告称，《智能网联汽车道路测试适应性验证管理规范（试行）》初稿已完成并正在修订中。作为全球最大的汽车市场，中国的互联网智能化发展迅速，如比亚迪、猎豹、东风启辰等无一例外，其中“智能互联”是重点。新的车载互联系统、语音控制等方面改善了人机交互；驾驶中可随时唤醒导航，实现语音导航、电话通话等功能，所有这些都需要大数据技术的支持。提高汽车技术含量还能有效实时监控路况信息，因此大数据与交通管理的结合不仅局限于行业高端应用，更与普通民众息息相关。\n\
  \n与此同时，中国汽车保有量的增加和高速公路的快速建设，也提升了大数据的应用价值。到 2016 年底，中国大陆高速公路总里程达 13.1 万公里，居世界第一位。汽车出行在各种交通方式中排名第一，同比增长\
  \ 17.6%。机动车保有量超过 3 亿辆，今年上半年增长率为 3.18%。因此，从行业到社会，将大数据与交通管理相结合显得愈发必要。\n\n##### 1.1.3\
  \ “互联网+”交通正当其时\n\n2015 年 3 月 5 日，李克强总理在《政府工作报告》中首次提出“互联网+”行动计划（图 1.1）。互联网与传统产业的融合发展将彻底改造传统产业，催生新业态。互联网与交通的碰撞，也形成了“线上资源合理配置、线下高效优质运行”的新格局。在国家政策驱动下，“互联网+交通”模式迎来快速发展。\n\
  \n![image](img/fig1.1.jpg)\n\n**图 1.1** 第十二届全国人民代表大会第三次会议在北京人民大会堂开幕。李克强总理作政府工作报告。\n\
  \n*来源*：中华人民共和国中央人民政府。\n\n如今，“互联网+交通”模式日趋完善。例如，铁路部门推出了网上订票方式，让消费者足不出户即可通过电脑、手机利用互联网购买火车票，免去了过去排长队购票的麻烦。民航部门较早实现了网上订票。在数据积累的基础上，经大数据分析后，消费者可使用手机\
  \ APP 实现购票、值机、航班动态查询等功能。大力推广高速公路 ETC 网络建设是公路领域推进联网的举措。此外，人们越来越离不开导航系统和打车软件。\n\n\
  大数据交通的发展和“互联网+交通”模式，已逐渐成为人们生活中习以为常的内容。\n\n#### 1.2 大数据交通与智能交通\n\n##### 1.2.1 什么是智能交通\n\
  \n智能交通的概念提出很早。早在 1990 年，日本的井口弥一首次提出了智能交通系统（简称 ITS）的概念。但当时 ITS 并未引起广泛关注。直到 1994 年，美国将其交通研究组织“智能车辆公路协会”（IVHS）更名为“ITS\
  \ America”，ITS 的概念才受到重视。\n\n多年来，随着互联网技术、大数据技术、云计算、区块链等技术的发展，智能化趋势日益明显，智能化在交通领域的占比持续上升。美国、欧洲、中国等世界主要经济体日益重视智能交通，并投入大量人力物力推动其发展。\n\
  \n迄今为止，尚无智能交通的权威定义，各研究者对此有各自的理解。但我们可以借助首届 ITS 世界大会主席给出的智能交通定义来理解这一概念。\n\n**智能交通系统是在比较完善的路基设施基础上，将先进的信息技术、通信技术、控制技术、传感技术和系统综合技术有效地集成应用于地面交通系统中，从而建立一个实时、准确、高效、大范围发挥作用的地面交通系统。**\n\
  \n一般来说，智能交通系统由七大组成部分构成，即：先进交通信息系统（ATIS）、先进交通管理系统（ATMS）、先进公共交通系统（APTS）、先进车辆控制系统（AVCS）、货运管理系统、电子收费系统（ETC）和紧急医疗系统（EMS）。这七大组成部分共同构成立体的智能交通系统，影响着人们生活的方方面面。\n\
  \n\n\n\n###### 对于中央新批准的雄安新区，政府主导以智能公共交通为主要出行方式进行建设。\n\n据“雄安发布”微信公众号 2017 年 10 月\
  \ 14 日报道，雄安新区与百度集团举行了对接会。双方就大数据、人工智能、云计算等潜在合作领域进行了对接。\n\n河北省委常委、副省长，雄安新区党工委书记、管委会主任陈刚表示，雄安新区是一座白纸上建设的新城，要把这张蓝图画好，需在信息技术与智慧城市发展融合上实现突破。\n\
  \n未来，雄安新区将实施以智能公共交通和无人驾驶私家车个性化驾驶行为为基础的出行方式，这将构成雄安新区未来的路网结构和空间配置模式。雄安新区未来规划建设的核心理念之一是把城市还给人民，从按汽车尺度设计城市和道路的传统方式，转变为按人的尺度设计，从而把城市还给人民，把道路和空间还给人民。百度集团在智慧城市建设、大数据、自动驾驶等方面具有领先优势。欢迎百度筹备在雄安新区建设开放型、国际化的国家级人工智能实验室和高端应用研究机构，特别是建设无人驾驶高新技术产业示范区。\n\
  \n百度集团总裁兼首席运营官陆奇表示，百度集团希望在智慧城市规划设计、信息基础设施建设、智能产业试点示范等领域深化与雄安新区的合作。^(3)\n\n从雄安新区的建设可以看出，在传统交通系统中，由于技术等因素，人、车、路无法统一、协调、融合，整个交通系统的效率和安全无法得到保障。在智能交通系统中，我们运用信息技术、数据通信传输技术、电子传感技术、卫星导航定位技术、电子控制技术、计算机处理技术和交通工程技术，这些技术能够实现集成与融合。传统交通系统的短板与难点被逐一攻克，人、车、路的协同更加紧密。交通效率得到提升，交通安全得到保障，交通环境大幅改善，能源效率大幅提高。\n\
  \n##### 1.2.2 智能交通中的大数据\n\n智能交通之所以区别于传统交通，在于其“智能性”。先进的信息技术、数据通信传输技术、电子传感技术、控制技术、计算机技术以及大数据技术，保障了交通系统在指挥调度中能发挥更强大的作用，能比传统交通系统更主动地预测风险、防范各类突发事件。\n\
  \n大数据技术为此价值提供了有力支撑。\n\n随着社会经济的快速发展，全球交通将面临越来越复杂的局面。随着机动车增加，城市化发展导致交通路网系统失衡，传统交通信息系统已无法满足当前交通形势。例如，在北京、上海、深圳等一线城市，交通拥堵已成为全城治理的难题。\n\
  \n然而，通过汇聚各类分散的交通数据形成“数据池”，并利用大数据技术处理数据，我们可以分析出一些交通趋势、需求、难点等。再通过精细的数据处理和图像处理，形成交通建议和决策。例如，某些人对某路段有特定的信息需求，虽然需求人数和占比似乎很小，但通过大数据技术处理和汇聚其他类似需求，可以形成特定的个性化服务。在此基础上，交通管理系统将更加智能。\n\
  \n大数据让交通管理更智能，体现在以下几个方面。\n\n第一，跨行政区域的数据将被整合，交通管理将突破以往行政区划的限制，建立全局“一盘棋”管理意识。这将有助于政府部门更有效地开展交通设施建设，更合理地进行交通路线规划。\n\
  \n第二，大数据技术能合理配置交通信息资源，提高信息利用效率。目前我国交通部门职责存在重叠，部分职责界定不清。利用大数据技术，可合理配置人力物力资源，协助相关部门做出更合理的总体规划，使交通信息利用率更高，交通管理更智能。\n\
  \n第三，大数据技术改变了以往的交通管理思维模式。在传统交通管理思维中，遇到拥堵就采取拓宽道路、增加里程的措施来提高通行能力。事实上，这种管理往往目光短浅。土地资源是不可再生资源，拓宽道路只会浪费更多土地。而且，在交通高峰期，拓宽道路也无法解决所有问题。通过大数据技术的分析整合，我们可以清晰掌握拥堵的时段、地点、原因，从而因地制宜、合理疏导治理，减少对土地、空间等资源的依赖，实现交通设施与系统的良性循环。\n\
  \n我们可以通过观察长沙智能交通建设来理解大数据在智能交通中的价值。\n\n目前，长沙在交通信息化方面主要建设了“两个平台、六大系统、五个应用软件”。2016\
  \ 年 3 月，智能交通三期建设启动，由青岛海信网络科技股份有限公司承建，并与百度、高德等互联网公司签订了数据交换协议，以科技手段助推交通管理。\n\n目前，长沙所有交警业务均可通过手机\
  \ APP 办理，包括车价、违章扣分查询等。下一步，可通过手机 APP 查询周边停车场信息及停车容量。\n\n\n\n###### 智能交通管理平台与系统\n\n\
  智能交通管理的两大平台是指挥调度平台和视频网络共享平台。六大系统包括高清电子警察系统、高清电视监控系统、智能交通信号控制系统、交通流采集系统、网络安全与存储系统，以及二三级分控中心改造。五大应用软件系统实现了道路交通\
  \ PBE 的实时采集、处理与分析；智能交通的价值将不再存在。\n\n第三，数据可以广泛共享。交通行业的信息资源复杂且宝贵。不仅政府部门对其有巨大需求，相关企业也有强烈需求。这些数据和信息的采集需要由政府部门和企业共同完成，其目的也需要共享。否则，将产生单一的信息孤岛，无法实现信息资源的统一调配和使用。\n\
  \n第四，智能交通必须高度稳定。特别是对于交通指挥和诱导，如果无法实现高稳定性，就无法保证交通的高安全、高效率和高准确性。可能会发生城市交通拥堵，导致资源浪费和环境污染。\n\
  \n#### 1.3 大数据交通与云计算\n\n众所周知，大数据在应用层面具有集成优势和组合效率。在大数据技术的支持下，任何领域的信息资源都可以改变信息分散、内容单一、混乱孤立的局面。\n\
  \n然而，为了存储、分析和共享海量数据，我们必须拥有云计算技术提供的强大平台。云计算技术能快速计算大量数据，用户可以方便地使用数据。它甚至能让用户体验每秒 10\
  \ 万亿次的计算能力。凭借如此强大的算力，云计算可以模拟核爆炸、预测气候变化和市场趋势。用户通过电脑、笔记本、手机等方式接入云计算平台，可根据自身需求进行计算。\n\
  \n对于交通领域，大数据和云计算技术有助于建立综合立体的交通信息系统。交通系统中的任意节点都能高效计算信息并调用数据。所有交通参与者将被纳入系统，发挥交通的整体功能。例如，在基础设施建设、交通信息发布、交通企业增值服务和交通指挥方面，大数据和云计算可提供决策支持和仿真，效率极高。\n\
  \n此外，云计算技术具有通用性、高可扩展性、按需服务、极低成本等特点，是大数据交通发展的必然需求。在云计算的支持下，大数据交通在建设过程中的发展速度和质量将更快、更高。\n\
  \n作为中国大数据建设基地，贵州省在大数据交通与云计算探索方面也处于前沿。由此也可见云计算在大数据交通发展中的巨大价值。\n\n……我愿借此宝贵机会，与大家分享贵州交警利用大数据和云计算技术在道路交通安全领域的实践与探索。\n\
  \n去年此时，李克强总理在国务院常务会议上提出支持云计算关键技术研发和重大项目建设。今天，贵州交警已建成全国最大的政府私有云平台。去年此时，国务院利用大数据发展面向市场的个人征信业务，加快征信体系建设。去年此时，贵州高速公路重特大交通事故频发。今年，全省\
  \ 5000 公里高速公路事故数同比下降 11 起，死亡人数同比减少 47 人，创贵州高速公路通车以来事故预防最好纪录。\n\n去年此时，贵州农村道路交通安全监管工作也深受“有机制不落实、有机构无人员、有措施无手段、有责任无追究”问题困扰。今年，贵州交警在省、市、县、乡、村、组六级建立了强化农村道路交通安全的数据笼子和安全监管云平台。\n\
  \n所有变革源于贵州交警云的建设，以及云计算平台建成后从云到端对智能交通的支撑。依托大数据和云计算技术，以现代治理理念和现代信息技术，贵州“互联网+”道路交通管理模式逐步形成。在大数据、云计算、互联网+成为网络热词之时，贵州交警走出了如何训练云平台的迷茫。\n\
  \n我们的经验是：不迷信云服务，因为云服务并非全能。没有业务应用标准建设，没有严谨的数据框架设计，仅将杂乱无章的数据简单聚合上云，也会制造危险的数据服务。\n\n\
  我们的具体做法是在公安部和公安云计算建设指导中心的指导下，以贵州公安信息化建设存在的问题为导向，以贵州交警主营业务为重点，指导公安云平台功能需求。与公安部交通管理研究所建立战略合作，吸收阿里巴巴成熟云计算技术，采用华为硬件，租用中国电信机房和设备，按照“业务应用+数据框架”序列建设了\
  \ 618 台服务器、46 台网络交换机、12 PB 存储容量。该云平台兼容各类传统数据类型，使用廉价 X6 服务器作为视频图片存储单元，可存储 75 张高清图片，拥有\
  \ 10000 核算力、每秒 20000 张图片处理能力、分布式数据库、大数据在线离线计算等各类云服务，破解了制约贵州交警信息化建设的“无法存储、无法运行、不好利用、无法共享”四大难题。\n\
  \n\n\n云计算平台建成后，我们的实践应用可概括为两句话。第一，依托大数据资源池，实现跨界融合与数据共享。云平台建设使我们实现了大数据资源池化，为信息资源服务提供了数据基础，为跨区域、跨行业、跨部门、跨警种的信息资源共享和大数据应用提供了坚实的服务保障。公安信息资源内部共享，为立体化社会治安防控体系建设奠定了坚实基础。信息资源对外与社会各界共享。各行业、各部门数据在大数据资源池中解构、交叉、融合，经汇聚、清洗、整理，形成标准化数据资源目录，汇聚成海量数据，逐步形成良好的大数据生态系统。\n\
  \n第二，依托云平台支撑，实现责任共担与安全共治。针对重点车辆、高速公路、农村公路管理难题，我们依托云计算和云平台开发了三大监管云平台，解决了管理难题。针对危化品运输车辆缺乏重点管理手段的问题，我们建设了贵州省道路交通安全综合监管云平台，依托各类金融关系型数据库等云计算技术，实现对车辆动态违法的精准预警和动态干预，做到监控无死角。\n\
  \n平台上线以来，全省各级监管部门登录使用平台 18.9 万次，企业用户登录使用 57 万次。交警、交通、安监、企业实现了信息实时共享，解决了安全监管信息不对称问题，明确了各部门安全监管责任和企业管理责任。\n\
  \n结合重点从业人员信用制度，我们全省核查了 600 多万名驾驶员，实现了对重点从业人员的精准管控，发挥了前所未有的管理效能。现在大屏幕显示的是今年全省企业劝退重点从业人员、交警终身禁驾重点从业人员等相关数据，针对高速公路依靠传统警力运行机制无法达到管理效果的问题。\n\
  \n我们建设了智能综合监管云平台，依托关联数据库运行，利用视频图像大数据分析技术管控采集重点车辆，对两站超速等重点违法实施精准预警，实施违法数据信息“四推送”、动态干预“五步走”，精准管控重点车辆。今年前三季度，推送违法车辆信息\
  \ 34 万余条，通过路网发现前端采集、动态跟踪、安全劝导、现场处罚“五步走”，执法站和服务区现场查处交通违法 37.4 万余起。\n\n针对农村公路长期占道、管理力量严重不足的问题，我们自主研发了农村公路交通安全综合监管云平台，将监管触角延伸至占全省公路总里程\
  \ 95.5%的农村公路。该平台采集农村人、车、路、气候等重点时段道路交通安全数据，利用大数据群体分析技术对各乡镇驾驶人车辆异常情况进行预警，跟踪排查隐患路段，将婚丧嫁娶、民俗活动、民族节日等预警信息自动推送至五级责任人，将监管责任落实到人。通过评议指挥、事前预警、事中监管、事后问责，真正落实了党政各级属地管理责任，实现了责任共担、安全共治的目标。\n\
  \n贵州交警云建设应用一年来，虽成绩不大，但找准了路子、开了好头、迈出了好步子。随着大数据、云计算、物联网等新技术的快速发展，智能交通的蓬勃发展给传统交通理论和实践带来了巨大冲击。下一步，贵州交警将深入学习外省公安交管先进经验，吸收本论坛智能交通研究成果，在公安部交管局领导和无锡研究院大力支持下，继续拓展大数据应用，探索利用云计算技术实现道路交通安全监管精准治理和个性化管理方案，力争实现道路交通安全监管问题的精准监管和靶向治理，进一步推出一批改革性成果，提升交通安全和交通管理水平，打造平安交通、和谐交通、便捷交通，为服务道路交通管理、公共安全和经济社会发展作出更大贡献。^(4)\n\
  \n#### 1.4 大数据交通与人工智能\n\n近年来人工智能非常火热。无论是自动驾驶技术还是电子警察，都离不开人工智能。一般来说，人工智能借助互联网、大数据、云计算、机器人技术等手段，对人类智能进行模拟、延伸和拓展。借助人工智能技术，人类希望机器能完成只有人类才能完成的工作。事实上，人工智能技术近年来发展迅猛。在某些领域，人工智能已超越部分人类能力，如\
  \ AlphaGo 战胜人类棋手柯洁。\n\n人工智能在交通领域的应用更为广泛和深入。\n\n在 2017 年 3 月 23 日闭幕的第六届中国智能交通系统市场研讨会上，多位业内专家表示，国内智慧城市建设仍停留在传统纵向应用阶段，缺乏深度应用。通过“人工智能+大数据+交通”，城市智能交通系统为智慧城市建设发展提供了能够自我调节的“外脑”。\n\
  \n\n\n\n###### “大城市病”如交通拥堵已被诟病许久\n\n如何解决交通拥堵问题已成为城市管理决策者的重要议题。业内人士认为，如何通过信号控制提高路口通行效率是解决问题的关键，这也是智慧城市建设与发展中最基础的关键环节。\n\
  \n近期，基于智慧城市建设中人工智能的数据挖掘与深度学习，海信向外界展示了其在交通领域早期布局的突破性应用方案。据称，海信研发的“数据魔方”可在 30 秒内完成\
  \ 10 亿量级交通大数据的可视化分析，并基于深度学习实现交通预测。\n\n“依托海量交通数据，我们分析交通运行的规律性与相似性，构建智能学习模型，通过机器学习预测车流量、拥堵等交通参数。”海信城市交通信控专家马晓龙表示，通过对路网车流的实时监测分析，根据动态交通数据自动切换、配置信号灯时长，最直观的变化是红绿灯时间不再固定，甚至全程绿灯不停车。\n\
  \n据了解，上述理想的交通状态已成现实。在海信的自适应信号控制系统中，按推荐车速行驶可实现“一路绿灯”。数据显示，在山东青岛，智能交通系统建设完成后，高峰时段时长减少\
  \ 1.48 小时，平均车速比提升 9.71%，为车辆节省出行时间 107,938,000 小时。^(5)\n\n上述应用仅是中国人工智能交通应用的一个缩影。中国各大城市正不断探索应用人工智能提升交通效率，使城市交通更加顺畅。此外，中国已出台多项政策法规鼓励人工智能与大数据交通发展。未来，中国的大数据交通与人工智能交通将焕然一新。\n\
  \n当然，从全球视角看，世界主要经济体都在发展人工智能。美国已将“智慧地球”构想上升为国家战略。日本和韩国通过人工智能与大数据技术切入国民生活生产的各个领域，不断提高人民生活水平。欧盟也在持续聚焦环境、交通、医疗、智能建筑等领域的智慧城市建设，这些领域的发展比中国更早、更深。\n\
  \n尽管人工智能处于发展阶段，但其前景十分广阔。交通领域每时每刻都在产生海量数据，这些数据经人工智能分析学习后，将为交通参与者描绘出更清晰的图景。对于政府交通部门、铁路、航空公司及旅游机构而言，可精准锁定客户群体，提供更个性化的服务。\n\
  \n^(1)徐吉华、冯勤俭、陈振儒：《智慧政府：大数据治理时代的来临》，中信出版社，2014 年版，第 11 页。\n\n^(2)同上书，第 13 页。\n\n\
  ^(3)来源于微信公众号“雄安发布”。\n\n^(4)内容引用自贵州省公安厅交通管理局局长王建武在“2015 年第十届中国智能交通系统市场研讨会”上的主题报告《大数据与云计算技术在贵州公安交管工作中的实践与应用》，有删改。\n\
  \n^(5)内容引用自光明网《人工智能+交通大数据 智慧城市建设有了“外脑”》。\n\n# 第 2 章\n\n# 大数据交通：走近生活\n\n许多人觉得大数据交通离生活很远，但事实是，它无处不在。日常出行信息预报、共享单车、地铁公交调度，都与大数据交通紧密相关。它深刻影响着我们的生活，极大地改变了我们的出行行为与习惯。\n\
  \n#### 2.1 大数据交通的自助出行\n\n随着汽车普及率提高、出行方式多元化以及智能交通发展，人们的出行方式日益个性化。无论是通勤还是假期出游，自助出行越来越受消费者青睐。人们的自主意识与自助意识日益增强，出行途中不再需要工作人员全程指引，仅凭手机\
  \ APP 即可完成全程查询。\n\n观察当前市场，人们自助出行的方式涵盖多种交通工具，包括自行车、汽车、火车、高铁、飞机等。\n\n##### 2.1.1 自行车自助出行\n\
  \n自助自行车，即公共自行车，原本是政府部门为改善城市交通、缓解拥堵、减少污染而提供的自行车租赁服务。在政府设立的公共自行车租赁点，市民可刷卡或手机解锁使用。但因押金缴纳不便、需归还至固定站点、车型陈旧等原因，政府主导的租赁体验并不理想。\n\
  \n近年来，随着共享单车兴起，自助骑行出行愈发普及。从用户注册、缴纳押金、用车、还车，全流程由用户自主完成。共享单车运营团队仅负责交通信息数据处理、车辆调度与维护。\n\
  \n例如，大众熟知的摩拜、ofo 等共享单车，是人们自助出行的最佳方式。用户可随时随地取还车。在“地铁站到公司”、“公交站到家”等短途场景中，共享单车价值巨大。特别是在公交线网密集、交通拥堵的一线城市，共享单车在短途出行中发挥重要作用，提供了更快捷、经济、直达的出行方式。尽管共享单车在一定程度上与公交、出租车短途运输形成竞争，但也在一定程度上缓解了拥堵、减少了污染，可作为城市公共交通“最后一公里”接驳的有益补充。\n\
  \n\n\n\n此外，根据第一财经商业数据中心（CBNData）发布的最新《2017 年中国共享出行行业大数据观察》，在自助出行方面，共享单车等出行方式正在颠覆和创新交通模式。随着共享单车行业的快速发展，共享单车已成为中国使用最广泛、最频繁的出行方式。到\
  \ 2018 年，中国共享单车市场规模将达到 100 亿。\n\nCBNData 基于 ofo 共享单车平台的数据分析指出，共享单车解决了近 80%用户“两公里内出行难”的需求。它发挥了短途出行和短途接驳的作用，极大地提高了出行效率，有效补充了中长途出行，是消费者短途出行和短途接驳的最佳选择。\n\
  \n基于 ofo 平台的数据分析，CBNData 称共享单车是消费者短途出行和短途接驳的最佳选择。例如，36.2%的 ofo 用户骑行距离在 500-1000\
  \ 米，26.4%的 ofo 用户骑行距离在 1-2 公里范围内。\n\n在上海，近 20%的 ofo 用户每天在地铁站一公里范围内出行。共享单车解决了近 80%用户“两公里内出行难”的需求，发挥了短途出行和短途接驳的作用，并有效补充了中长途出行。^(1)\n\
  \n##### 2.1.2 其他自助出行\n\n在自助出行的其他方面，高铁和飞机在一定程度上已实现了自助出行，这为消费者提供了诸多便利，缓解了城市交通压力，并优化了交通状况。\n\
  \n例如，在代驾方面，传统模式是客户下单，平台通过信息匹配将订单派发给司机。在此过程中，客户没有太多自主选择权，大部分流程由平台完成。\n\n但现在代驾模式已发生改变，自助和自主权已转移给客户。客户可利用智能手机中的地图软件寻找代驾服务。通过基于位置的服务（LBS），他们可以选择离自己最近的代驾司机、信誉良好的司机，并根据其他需求筛选司机。这一过程由客户自主完成。地图软件提供相应的信息服务，但自主权掌握在客户手中。\n\
  \n据高德地图相关人士透露，虽然代驾服务看似简单，但涉及车主及其他车辆的人身财产安全，因此代驾司机的资质审核极为严格。代驾司机必须品行端正、驾驶技术娴熟。如果客户想要自主出行，安全方面必须得到保障。\n\
  \n在高德地图 APP 的“附近”功能中，设有寻找代驾司机的选项。高德利用地图和手机定位，为用户精准推荐合适的五位代驾司机。界面会显示每位司机距离客户的距离，以便客户选择时知晓，避免等待过久。此外，这些代驾司机的信息包括照片、驾龄、籍贯、代驾单量、评分星级等。客户自主选择时可了解其相关信息，从而更好地安排出行。\n\
  \n再如，在公共交通领域，尤其是地铁，自助出行的程度越来越高，特别是随着智能手机的普及，手机自助充值、刷卡、乘车已成为完全自助的过程。南京地铁推广的手机蓝牙进闸机功能，是这一趋势的有力佐证。\n\
  \n###### 亮点 1：手机进站快捷方便，或将告别“排队”\n\n手机一刷，乘客即可进出站。开启“蓝牙”启用“过闸”功能，与地铁“闸机”交互，乘客无需购票，避免了忘带市民卡、坐公交无零钱的尴尬。如今无需排队购票，只需用手机蓝牙进闸，十分便捷。\n\
  \n###### 亮点 2：一键充值，随时随地充值\n\n南宁轨道交通 APP 的“充值”功能可帮助乘客随时随地充值，支持设定金额或自行输入（范围 2-500\
  \ 元）。“充值”功能接入了银联卡、支付宝、微信三种在线充值方式。\n\n进入 APP 的“账单”功能，用户还可实时查询账户余额、每笔消费明细、充值记录、半年内消费统计等信息。乘客坐地铁还剩多少钱，手机一查便知。\n\
  \n###### 亮点 3：地铁信息可查，“管家”护航出行\n\n南宁轨道交通 APP 保存了购票和充值的入口，乘客可随时享受优质乘车服务。“时刻表”可查询往返时间及列车首末班车时间。“票价查询”可根据始发站和终点站提供路线并了解票价。“站点信息”可查询站点信息、出入口及周边信息。南宁轨道交通\
  \ APP 是乘客身边的贴心出行管家。\n\n###### 亮点 4：到站信息早知道，约会不迟到\n\n乘客在 APP 首页向左滑动“小闹钟”，可查看“到站提醒”功能，用于定位附近车站并查看最近一班列车的到达时间。乘客可利用此功能在日常出行中更精准地定位自己与地铁站的距离。即使不在站内，也能查看最近两班列车的到达时间，帮助乘客根据实际情况调整行程，约会定不会迟到。\n\
  \n###### 亮点 5：多功能合一，没有比 APP 更懂你的\n\n“发现”功能还可自动为您推荐地铁站附近的热门商家，列出地铁周边的餐饮和活动。在“附近商家”中，可选择切换至其他站点查询。乘客的出行生活得到丰富，带动地铁周边商圈，“发现”手机上的智慧生活更精彩。^(2)\n\
  \n有了如此便捷的公共交通，出行者不再需要排队买票，也不必因忘带公交卡而焦虑。有了手机，所有出行行为均可完成，且可通过手机轻松查找出行轨迹，这对地铁运营方和出行者而言是双赢局面。\n\
  \n![image](img/fig2.1.jpg)\n\n图 2.1 乘客使用蓝牙传感器通过地铁闸机。\n\n*来源*：*中国日报*。\n\n\n\n\n####\
  \ 2.2 大数据交通之高铁出行\n\n随着中国高铁网络的密集分布，中国人选择高铁出行的频率越来越高。根据中国铁路总公司的相关数据统计，自 2008 年京津城际铁路运营以来，至\
  \ 2017 年 9 月 30 日，中国高铁动车组已累计输送旅客超过 70 亿人次，年均增长率超过 35%。要知道，根据不完全统计，世界总人口也不超过 73 亿人。如果按中国高铁每年输送旅客\
  \ 20 亿人次计算，到 2018 年，累计输送旅客人数必将超过世界总人口数。\n\n中国高铁建设速度之快令人瞩目。仅 2012 年至 2017 年短短五年间，京广、沪昆、哈大、贵广、兰新（乌鲁木齐）、海南环岛等一批重点高铁项目相继建成通车，“四纵四横”高铁网基本形成。从北方小城到南方海滨三亚，从西部新疆到东部沿海，高铁如同人体动脉般连接起祖国大地。据统计，中国高铁与其他铁路共同构建了\
  \ 4 万公里以上的快速客运网络，基本覆盖了全国省会城市和人口 50 万以上的城市。长三角、珠三角、环渤海等城市群通过高铁联系更加紧密，东、中、西、东北四大板块实现了高铁互联互通。\n\
  \n高铁如此便捷高效，人们的出行自然更加智能。但庞大的高铁网络需要大数据技术进行统一管控。一旦某个节点出现故障，都可能影响后续列车运行。往年常有高铁调度问题导致后续列车晚点的新闻，但现在此类报道已很少见。因为中国交通网络系统日益完善，大数据技术愈发强大，能够保障高效复杂的高铁网络运行。\n\
  \n我们可以从同程旅行和中国交通报联合发布的《2018 年春运大数据报告》中窥见一斑。\n\n2018 年春运预计铁路发送旅客 3.93 亿人次，同比增长 10%，远高于公路运输的\
  \ 1.1%。随着人们消费观念的转变和民航运力的增加，春运期间选择民航出行的消费者越来越多，2018 年预计发送旅客 6700 万人次，同比增长 14%，增幅在三大运输方式中居首位。^(3)\n\
  \n铁路发送旅客人数同比增长 10%，这与高铁线路的逐步投入使用密不可分。目前，中国拥有 2700 多列动车组，日开行列车 4500 列以上，居世界首位，累计发送旅客超\
  \ 60 亿人次。以京沪高铁为例，运营六年来已安全输送旅客 6.72 亿人次。\n\n高铁出行是重要的交通方式，其在大数据中的应用与实践主要体现在以下几个方面。\n\
  \n##### 2.2.1 智能化\n\n无论是购买高铁票还是乘坐高铁检票，高铁网络都变得越来越智能。例如，北京西站已开通人脸识别系统；旅客刷身份证进站，再通过人脸识别系统检票进闸。检票仅需\
  \ 1-2 秒即可完成。这些过去需要人工完成的任务，如今让出行效率大幅提升。\n\n##### 2.2.2 自助服务\n\n自助服务背后实则是智能化的体现。旅客可根据出发地、换乘点、出发时间等信息，通过自有\
  \ APP 自主查询订票，不仅提高了效率，还节省了人力物力。高铁还开通了订餐、订票等功能，让旅客在出行过程中更加便捷、绿色。\n\n##### 2.2.3 低成本\n\
  \n虽然高铁票价远高于普速列车，但从社会整体经济价值和时间价值来看，高铁节省了出行时间，提高了单位时间经济价值，降低了消费者的出行成本，如下新闻所述。\n\n\
  高铁发展也带动了大城市周边地区的经济商贸活跃。在金融行业工作的陈先生，在候车大厅用两部手机和一台笔记本电脑处理邮件。因工作原因，他每周需多次往返北京和天津武清。北京至武清约\
  \ 90 公里，自驾无堵车也需 1 个多小时，而高铁仅需 24 分钟。“高铁省时省力。开车很麻烦，尤其是在北京，一开车就可能堵车。坐高铁没堵车风险，不用耽误工作。开车成本太高，其实油费加过桥费远超高铁票价。我来回才花\
  \ 70 多元，开车成本肯定比这高。”^(4)\n\n##### 2.2.4 安全性\n\n在准点率和乘客人身安全方面，高铁出行比航空和公路出行具有更明显的优势。\n\
  \n中国拥有世界上总里程最长的高铁和公众出行频率最高的高铁。高铁出行将持续改变人们的出行方式，进一步提高交通效率，便利生活，减少环境污染（见图 2.2）。所有这些都与交通大数据网络密切相关。可以说，高铁网络就是一个数据网络。在海量数据的支撑下，高铁才能做到极致便捷、高效、安全。\n\
  \n\n\n\n\n![image](img/fig2.2.jpg)\n\n图 2.2 高铁站。\n\n*来源*：*人民网*。\n\n#### 2.3 大数据交通中的公路出行\n\
  \n公路出行是中国民众最重要的出行方式之一。公路出行主要集中在短途出行上。当出行距离小于 200 公里时，人们倾向于选择公路出行。根据同程旅游和中国交通报发布的《2018\
  \ 春运交通大数据报告》，200 公里以内和 800 公里以上的出行距离占比最高，分别为 33.5% 和 30.1%，这意味着公路出行的作用和价值巨大。\n\n\
  在日常生活中，若从出行工具来看，公路出行一般有汽车、公交车、摩托车等几种；从出行方式来看，方式丰富多样，如自驾、拼车、租车、乘公交、打的、打滴滴等；从出行场景来看，包括城市道路出行、高速公路出行、国道、省道、县道出行等。\n\
  \n无论哪种公路出行，都可谓是交通管理中的重中之重。在交通管理中，公路出行数据也是最复杂、最分散的，但同时也具有最大的分析和研究价值。\n\n##### 2.3.1\
  \ 大数据背景下的公路出行\n\n近年来，中国公路建设里程不断增加，路网养护和管理的挑战日益凸显。高速公路上的收费、监控、通信等领域的工作智能化程度不高，需要投入大量人力物力，增加了高速公路管理成本。\n\
  \n目前，许多高速路段的路况信息仍严重依赖人工上报或显示屏播报。结果导致路况信息无法实时反馈，增加了民众出行的盲目性和不确定性。特别是在大雾、冰雪等恶劣天气下，如果公路管理部门不能及时发布信息，不能通过数据监控和指挥各路段路况，可能会造成重大安全隐患。\n\
  \n我们可以简单地将高速公路大数据管理划分为安全管理、路政管理和服务管理。\n\n在安全管理方面，高速公路拥有大量分散的交通数据、先进的电子传感技术、视频监控设备、近场通信设备等。如果善加利用，这些设备和数据可以帮助管理部门建立一个大规模、全方位、实时、高效的安全管理系统。通过大数据分析和程序开发，该系统可监控车流量、天气状况、路况、车辆事故等信息，并可通过车联网、交通广播、微信等渠道，将易发事故路段信息推送给公众。\n\
  \n当然，百度地图、高德地图等地图软件现已接入政府部门的先进交通信息系统（ATIS），也可通过地图软件实时推送。2017 年，北京高速公路路政系统首次尝试高速公路机器人巡逻。此类尝试将成为未来的一大趋势。\n\
  \n在隧道等特殊区域，例如，利用大数据通过专用交通区域控制器适时调节隧道内的灯光。如果隧道外阳光强烈，隧道入口处灯光会更亮，随后逐渐恢复正常，让驾驶员自然适应隧道环境。当人们在高速公路上遇到事故时，可通过路边的可视电话求助，并与专业人员进行视频通话，极大地提高了救援效率。\n\
  \n在路政管理方面，借助大数据，高速公路路政管理部门可减少人力物力投入，提高管理效率。例如，管理部门将高速公路两侧及中央隔离带上的所有波形板、百米桩、公里桩、电子信息板、摄像头等纳入统一管理系统，一旦相关设备损坏或丢失，系统可精准定位、快速更换和更新。对于高速公路建筑物、立交桥和地下通道，也可通过数据形式进行管理和监控，以更合理地维护和保护高速公路资产。\n\
  \n大数据的价值在服务管理中体现得更为明显，如高速公路收费和服务区管理。对于收费站，每辆车通过时都会留下视频和单据，这些原始资源是极其重要的数据资源。基于这些数据，经过数据处理、分析和挖掘，可形成一系列高效、高价值的数据资产。例如，若发生交通事故逃逸，收费站的大数据资料极具价值，可协助警方侦查并锁定相关人员。遇超速行驶，管理系统可借助大数据在收费站主动拦截相关车辆，保障交通安全。\n\
  \n对于服务区，车辆停留时长、停靠车次等数据对管理部门的安全监管极具价值，也是服务区相关经营企业进行商业决策的宝贵资源。哪个服务区在哪个时段对某项服务需求大、哪个区域偏好某类商品或服务，均可通过大数据分析获得。一方面，这将减少服务企业的库存浪费，在节假日等特殊时段更好地服务旅客；另一方面，将为旅客提供个性化服务，提升便利性。\n\
  \n未来，随着新能源汽车的普及，充电桩等充电设备服务将成为重要服务内容。根据大数据分析，服务区可提前规划电动汽车的充电设备和服务设施。\n\n##### 2.3.2\
  \ 大数据背景下的城市道路出行\n\n城市出行比公路出行更复杂，需要更多交通管理系统配合。除车辆自身控制系统和车联网外，管理主导的系统在城市交通中是重要参与者。\n\
  \n(1) **交通信息系统。** 该系统基于完善的信息网络，交通参与者通过道路上、车辆上、换乘站、停车场和气象中心配备的传感器和传输设备，向交通信息中心提供实时本地交通信息。^(5)\n\
  \n接收到反馈后，系统能利用大数据技术快速处理，并将处理后的数据方案实时推送给交通参与者。根据这些方案，出行者可清晰了解周边道路交通信息、公共交通信息、换乘信息、交通气象信息和停车信息，从而自主选择出行方式、出行路线等。\n\
  \n\n\n\n\n#### 2.3 大数据交通中的公路出行\n\n###### (2) 交通管理信息\n该系统主要供交通管理者用于监控实时路况、交通事故、天气状况及交通环境。结合车辆检测技术和大数据处理技术，它能准确判断某一时刻当前及未来的交通状况。有了这些准确判断，交通控制变得容易得多，例如交通信号控制、诱导信息发布、道路管制、事故处理和救援。\n\
  \n###### (3) 公共交通系统\n公共交通是城市的主动脉。无论是公交车还是地铁，都必须安全、快捷、准点、顺畅。通过安装在公共交通工具和场所上的闭路电视等设备，可实时监控交通状况，并通过多个平台推送车辆路线、站点等实时信息。正是有了这个系统，城市公共交通才能更顺畅地运行；否则，城市交通将变得混乱无序，浪费物力和时间，并污染环境（见图\
  \ 2.3）。\n\n###### (4) 车辆控制系统\n车辆控制系统旨在帮助驾驶员更高效、更安全地控制和驾驶车辆。在紧急情况下，驾驶员可获得预警、辅助和指挥。我们生活中安装在公交车上的许多控制系统都属于该系统的一部分。\n\
  \n###### (5) 电子收费系统\n该系统的代表性产品是 ETC，这是世界上最先进的公路桥梁收费方式。当车辆通过高速公路收费站时，设备可快速通信并扣款。ETC\
  \ 涉及高速公路联网系统、银行收费系统和短波通信。这些系统交互产生的数据是宝贵的数据资源。此外，目前流行的城市智能停车电子收费系统也属于此类。值得一提的是，支付宝的免停车缴费模式未来有望彻底颠覆停车缴费习惯。\n\
  \n![image](img/fig2.3.jpg)\n\n**图 2.3** 手机扫码支付。\n\n###### (6) 应急救援系统\n应急救援系统通常与交通信息系统和交通管理系统紧密集成。发生交通事故时，这两个系统提供及时反馈。经数据分析后，应急救援系统可为旅客快速提供紧急救治、拖车、现场救援、事故车辆故障排查等服务。\n\
  \n公路出行是旅客最频繁、联系最紧密的出行方式，因此管理过程中涉及的领域和维度也极为广泛。正因如此，公路出行数据也是最复杂、最分散的。\n\n#### 2.4\
  \ 大数据交通中的民航出行\n\n在同程旅行和中国交通报发布的《2018 年春运大数据报告》中，我们可以清晰地看到，随着消费升级和出行方式改变，民航出行已逐渐成为大众的常态选择。\n\
  \n对于 2018 年春运，铁路预计发送旅客 3.93 亿人次，同比增长 10%，远高于公路运输的 1.1%。随着人们消费观念的转变和民航运力的增加，越来越多的消费者在春运期间选择民航出行，预计\
  \ 2018 年发送旅客 6700 万人次，同比增长 14%——增幅在三大运输领域中最大。^(6)\n\n对于民航出行，除了机票全程网上订购外，旅客选座、安检、行李托运也已全面实现数字化和智能化。对于民航企业而言，利用大数据不仅能进一步提升服务水平、降低运营成本，还能保障安全和实现良好的机场管理。\n\
  \n##### 2.4.1 民航大数据是宝藏\n\n在民航数据中，个人信息占据极大数据量。这些信息包括预订信息、支付记录、航班流程、高频航线、购买偏好、受让人关系、关联效应等。与公路出行的分散数据相比，民航数据更集中，基本存储在航空公司的售票值机系统、航空邮件订座离港系统、机场安检系统等处。这些信息经整合优化后，可精准描绘客户画像。从预订流程开始到行程结束，可通过大数据轻松推导出客户的消费习惯和行为特征，航空公司据此实现个性化服务已不再困难。\n\
  \n此外，民航公司还可基于这些信息拓展服务项目。例如，许多航空公司可与其他公司合作——从里程兑换机票到兑换商品，从配合地空联运到与航空合作伙伴共享资源，再到跨境消费积分——所有这些都有助于航空公司开拓市场、寻求差异化竞争，不仅盘活自身资产，还能提升效益（见图\
  \ 2.4）。\n\n##### 2.4.2 民航高度自助服务\n\n自助出行已在交通诸多领域发展，但相对而言，在民航领域，除安检外，其他环节也实现了高度自助，具体如下。\n\
  \n###### (1) 自助出行\n从订票开始——旅客在手机上订票，并在前往机场途中通过手机 APP 查看路况、航班状态和机场动态。\n\n![image](img/fig2.4.jpg)\n\
  \n**图 2.4** 实时交通监控系统。\n\n###### (2) 自助值机\n抵达机场后，旅客首先办理值机。无需排长队等候，可自行办理。例如在浦东机场，国内航空公司自助值机设备数量实现突破。过去国内航空公司统一提供的值机设备不足\
  \ 30 台，现已达 100 台。此外，各航空公司有各自的企业文化和色彩特征，浦东机场也配合各大航空公司自助值机提供了一些特色个性化服务——色彩更丰富、效率更高。^(7)\n\
  \n###### (3) 自助行李托运\n在传统行李托运中，无论是起飞前还是降落后，旅客都不知行李状态。随着大数据普及，航空公司可告知旅客行李信息，如是否已打包、离港转盘处于何位置。旅客信息明了，无需再麻烦工作人员，极大提高了航空公司效率。\n\
  \n\n\n\n\n##### 2.4.3 民航大数据可提升服务质量\n\n过去，旅客的出行信息、满意度和需求并未真正与民航服务融合，既无法在同一层面对接，也无法在数据分析后形成合理的解决方案。如今，民航大数据能够彻底改善服务质量。\n\
  \n例如，航旅纵横软件是中国最权威、功能最强大的民航信息服务产品，可为用户提供全方位的民航出行信息服务，并通过手机解决民航出行问题。其特点是数据权威、信息及时、功能完备、覆盖全面，包含全球近\
  \ 70 万班次的实时航班信息，可根据用户信息从年度飞行记录中自动导入，同时软件能清晰掌握航班延误原因及前一趟航班的执行情况。此外，该软件还可用于实现手机值机、机票查询、验票、票款余额显示、航班动态、机场信息及登机口查询、地图导航和寻找同行人等功能。^[9]\n\
  \n大数据技术在航空领域的持续成熟，将在航空信息服务和航空运行效率方面产生巨大价值。\n\n##### 2.4.4 民航大数据提升航空安全指数\n\n尽管近年来选择民航出行的人数增加，但许多旅客尚未养成相应的习惯，暴露了中国旅客在国内外的不文明乘机行为。这些不文明行为有时会危及其他旅客的安全。通过大数据管控，可消除这些安全隐患。\n\
  \n例如，2015 年，民航局与国家旅游局达成共识，共同加强文明旅游，遏制不文明出行行为，维护航空运输和旅游秩序。当发生不文明出行行为时，国家旅游局将共享相关信息给民航局，民航局将依法处理，甚至将相关人员列入“黑名单”。若旅客在飞行途中扰乱航空秩序或危及他人安全，航空公司将处理该情况并共享相关信息给国家旅游局，以维护文明出行环境。\n\
  \n此外，例如，飞机自身的航班大数据也将传递给航空公司的飞机维修人员，作为相关评估数据，帮助他们及时消除潜在安全隐患，保障飞行安全。\n\n#### 2.5 大数据交通的货运运输\n\
  \n与客运相比，货运物流运输和周转也是大数据交通和智能交通的重要组成部分。而且，随着车联网和物联网的完善，货运数据正变得更具价值。\n\n从货运方式来看，目前较重要的运输方式有铁路运输、公路运输、水路运输和民航运输。这些货运方式产生的数据各异，但关键信息具有共同价值。\n\
  \n根据交通运输部 2017 年 4 月发布的《2016 年交通运输行业发展统计公报》，2016 年全社会完成货运量 431.34 亿吨。其中，全国铁路货运量\
  \ 33.32 亿吨，全国公路货运量 334.13 亿吨，全国水路货运量 63.82 亿吨（不含港口数据），民航货运量 666.9 万吨（含国际航运数据）。\n\
  \n综合对比来看，货运出行侧重于公路运输的灵活性、便利性和网点密集性。在城市智能交通的建设和运营过程中，公路运输更为重要。在运输过程中，视频监控、交警、路况信息、管控信息、运营信息、GPS\
  \ 定位信息和 RFID 识别信息产生的日数据量可达 PB 级，且呈指数级增长。如何明智地利用这些数据，是大数据交通货运运输的核心。\n\n##### 2.5.1\
  \ 如何提前预测货运运输\n\n对货车司机而言，每趟运输满载返程是最划算的方式。但在许多情况下，为运输货物，总会出现单程无货驾驶的情况，这不仅造成资源浪费，还降低了货车司机利润并增加了货运成本。若将所有需求信息与货运数据匹配，并实现提前预测，货车司机便可合理安排自身货运路线，确保满载运输。\n\
  \n此外，货运运输过程中也存在信息不对称。货主找不到合适车辆运输，货运车辆找不到货源。在大数据的整合与调度下，此类情况可彻底改变。\n\n例如，市场上的“管车宝”平台致力于通过大数据解决此类问题。通过大数据整合，可调度全国数百万货运车辆，实现车辆资源的聚合与优化。运输过程中，可全程查询车辆定位，亦可核验驾驶员证件，货运运输更有保障。\n\
  \n##### 2.5.2 实施货运运输计划与错峰运输\n\n\n\n\n货运运输在时间上具有明显的周期性和集中性特征。据一些数据机构统计，货运量一般从周一开始增加，周三达到高峰，随后下降直到周末。将时间延伸到整个月，也具有此类特征。若遇重大节假日或重大活动，货运需求极其集中。根据货运过程中的数据沉淀，大数据技术可轻松制定货运计划。信息提供给货主和司机后，可引导货运参与者提前规划、错峰运输，减轻全国交通压力。\n\
  \n##### 2.5.3 货运数据可更好地服务货运参与者\n\n据统计，一般而言，大货车每小时可行驶 50 公里（含装卸），而大多数货运司机每天上午 7:00\
  \ 开始工作，上午 11:00 为送货时间，凌晨 2:00 为高峰时段，因为大货车受城市交通管理法规限制。^[10] 这些数据的研究与整合能清晰描述货运参与者的各个环节与细节。政府管理部门和相关企业在提供服务时将更有针对性，提升服务质量，改善运输效率。\n\
  \n^[1] 内容引用自《中国共享出行报告：共享单车成短途出行最佳选择》，[xinhua.com](http://xinhua.com)。\n\n^[2] 内容引用自微信公众号“南宁轨道交通”（NanningRT）：“告别排队：南宁地铁开启‘手机蓝牙’进闸机时代”，内容有删改。\n\
  \n^[3] 内容引用自“2018 春运大数据报告：春运出行更理性，智慧出行服务潜在需求巨大”，[china.com](http://china.com)。\n\
  \n^[4] 内容引用自滕云、苏姣、陈燕：“中国人总结高铁三大特点：便捷、高效、安全”，[peoplerail.com](http://peoplerail.com)。\n\
  \n^[5] 内容引用自夏欢 主编，《以数据为中心的智慧城市行业解决方案汇编》。武汉：中国地质大学出版社，2016 年，第 114 页。\n\n^[6] 内容引用自“2018\
  \ 春运大数据报告：春运出行更理性，智慧出行服务潜在需求巨大”，[china.com](http://china.com)。\n\n^[7] 内容引用自“中国第二繁忙机场如何构建全流程自助出行”，[carnoc.com](http://carnoc.com)。\n\
  \n^[8] *Ibid*。\n\n^[9] 内容引用自民航大学计算机科学与技术学院副院长丁健的“大数据：待挖掘的民航金矿”，内容有删改。\n\n^[10] 内容引用自张帆、黄俊、苏子博、田晨、徐承宗的《大数据时代的智慧交通（长途货运篇）》，内容有删改。\n\
  \n## 第 3 章\n\n## 大数据交通战略蓝图\n\n放眼世界，许多国家都高度重视大数据交通发展，尤其是欧美、日本、韩国。其大数据交通技术日新月异。中国在发展过程中，只有不断借鉴先进经验、引进先进技术，才能更快更好地发展交通网络，提高出行效率，减少交通污染（见图\
  \ 3.1）。\n\n![image](img/fig3.1.jpg)\n\n图 3.1 实时交通监控。\n\n#### 3.1 美国的大数据交通\n\n美国大数据交通起步较早，其技术成熟度和丰富经验远超其他国家和地区。作为全球大数据应用的发源地和全球大数据发展中心，加之美国政府对大数据应用的政策支持，以及美国完备的综合交通网络，美国大数据交通发展引领全球。\n\
  \n从发展逻辑看，美国坚持政府引导规范、市场主导发展的理念。美国政府出台了一系列大数据研发和应用政策，如 2016 年 5 月发布《联邦大数据研发战略计划》。这些政策从政府框架层面为企业开发大数据应用设定了规范。有了相关规范，企业只需在框架内推动大数据进行产业融合。作为重要应用领域，大数据交通必将得到政府和市场的大力发展。\n\
  \n在政策支持和相关技术基础的推动下，美国大数据交通发展呈现出一些鲜明特点。\n\n##### 3.1.1 多年的技术积累与创新\n\n在大数据交通领域，美国多年的技术积累带来了两方面发展。一是交通网络的积累与完善。美国拥有密集的交通网络、成熟的基础设施以及交通领域的治理经验，这是大数据交通的基础。美国自\
  \ 20 世纪 90 年代起实施建设信息高速公路计划，至今网络基础设施已完善并作为战略资产受到保护。早在 2007 年，沃尔玛就建成了存储容量超 4PB 的超级数据中心。^[1]\n\
  \n二是大数据技术的技术积累与创新沉淀。作为世界大数据中心，美国在各领域大数据技术融合应用方面历史悠久。此外，多年来美国政府和企业致力于逐步完善大数据领域相关规范法规。在数据应用、征信、隐私等领域，已建立较成熟的法律框架和伦理规范。例如\
  \ 2010 年，美国国会通过更新法案，进一步提高数据收集和报告的进度与频率，使国家层面的数据收集汇聚系统更完善。\n\n##### 3.1.2 极度开放的数据\n\
  \n对于交通过程产生的大数据，政府需要用于交通管理和环境优化，更重要的是企业也需要这些数据参与交通过程的各个环节，以更好地制定企业发展战略、优化客户服务、开发公共服务软件等。\n\
  \n\n\n\n###### 美国长期以来一直在实施开放政府，其中包括开放数据。\n\n美国最重要的开放数据平台是 `Data.gov`，该平台于 2009 年上线，是美国对“开放政府”承诺的关键部分。到\
  \ 2012 年 11 月，`Data.gov` 已开放 388,529 份原始和地理数据，涵盖农业、气象、金融、就业、人口统计、教育、医疗、交通和能源等约 50\
  \ 个类别。根据原始数据、地理数据和数据工具这三大类别划分，数据内容涵盖“从家庭和企业能源消费趋势分析到实时全球地震通知，甚至包括根据好奇号火星探测器传回的数据查询火星天气”等。为方便公众使用和分析，`Data.gov`\
  \ 平台还融入了数据分级评分、高级搜索、用户交流以及与社交网站互动等新功能。例如，`Data.gov` 上提供的白宫访客搜索工具，不仅可以搜索访客信息，还能将白宫访客与\
  \ Twitter 等社交网站链接起来，进一步提高了访客信息的透明度。^(2)\n\n通过向公众开放交通领域的信息，企业家和相关企业可以利用数据发掘商机，为公众提供更有价值的公共服务，从而让人们的生活更轻松、快捷。\n\
  \n##### 3.1.3 众多创新要素与完整产业链\n\n交通领域与民生息息相关，对其自身产业有着强劲需求。此外，美国作为人均汽车保有量世界第一的国家，对车辆和交通的需求远超其他国家。正是由于这一市场，美国涌现出大量大数据交通领域的初创企业，为美国大数据交通的发展提供了持续的创新动力。特别是\
  \ `Google` 等巨头公司在大数据交通领域深耕细作，无人驾驶等新技术的研发与应用即建立在此基础之上。这些新技术进一步催生了公众出行需求，推动企业、学校和科研机构投入其中，从而形成了完整的产业链。\n\
  \n美国大数据交通领域有许多成功案例。让我们看一个美国空军利用大数据调度车辆的案例。\n\n美国空军机队支持美国空军在天空、太空和虚拟空间执行飞行和战斗任务。在全球众多任务中，需要配备各类车辆车队，包括巴士、特种车辆和军用车辆，以完成复杂任务。\n\
  \n作为美国联邦政府第四大车队，资产超过 70 亿美元，该车队驻扎在美国及世界各地的基地。\n\n美国空军在国内外的基地宛如“自给自足”的城市，需要各种车辆，从轿车到除雪车、消防车、加油车等。目前已授权使用\
  \ 500 多种类型的车辆。\n\n美国空军机队由美国空军要素车辆与装备管理支援办公室管辖，该办公室制定车辆法规、补贴、维护计划、优先采购计划、预算等，总部设在弗吉尼亚州兰利。\n\
  \n该机构提供集中式车辆管理，保障 11 个主要作战司令部、 307 个基地，雇佣 6,100 名机械师，年度采购计划预算达 3 亿美元。作为管理机构，它提议通过持续严格的流程再造，以最高效的方式保障行动。\n\
  \n其车队管理涵盖法规、预算、资产管理、维修保养、能源管理和法规制定等各个方面。\n\n自 2001 年以来，美国空军一直在扩展其企业级数据仓库，主要使用 `Teradata\
  \ Dynamic Enterprise Data Warehouse Platform 6690`，现已扩展至六个节点，存储量达 95.8 TB。还协助部署了\
  \ `Informatics Power Center` 及 `Business Objects` 的相关产品。\n\n从美国空军的数据分析演进过程来看，2007\
  \ 年前侧重于分析师视角，最初版本仅关注单一飞机及其维护流程。2007 年至 2013 年，实现了从企业视角到企业互操作性的快速演进。2009 年，通过支持增加资产查询视图，解决方案扩展至车辆、装备和军需物资；2013\
  \ 年，进一步扩展了库存跟踪、供应和运输环节等额外流程管理。\n\n其中，车辆视图应用的核心组件分为两部分。第一是规划组件，包括授权与验证、预算规划和优先采购模型。第二是运营组件，包括主管视图、快速查询、保有成本、高性能和事务请求工具。\n\
  \n在授权与验证方面，美国空军基地的每一个标识都经过验证，如车辆类型、使用机构和使用代码，每项需求将在 3 年内反复核实。为确定需求而创建问题和法规的工作流也非常繁琐。同时也会为每个基地生成调查问卷，要求管理人员快速回答调查问题。这些调查结果将作为规则处理引擎，为车辆需求计算提供洞察。\n\
  \n针对上述情况，美国空军进行了管理变革，例如通过计算和对比当前库存中需要授权的车辆。针对空军要素车辆与装备管理支援办公室的不同用户，分别采取行动进行申请的批准或撤销。\n\
  \n在变更后的汇总分析报告中可以看到，统计涵盖授权数量的增减、自动与手动授权的不同数量等。最终结果显示，该绩效和方法带来了显著的效率提升和成本节约。统计数据表明，美国空军在过去\
  \ 3 年中通过授权与验证累计节省了 3.09 亿美元！\n\n在优先采购模型中，它为美国空军车辆部署了替换策略算法，以高效规划来年的车辆采购，例如计算每辆车的预计生命周期、确定每辆车的更换优先级、为不同车型分配资金以平衡车队、模拟假设场景下的资金调整、分析车队分配指标，并生成下一财年的车辆采购清单。\n\
  \n\n\n在具体计算中，车辆的生命周期是指当维护和运营成本大于折旧价值时，认定车辆已达到其使用寿命终点。每种车型的现有资产按优先顺序进行替换。资金按车型确定，每种车型在同一类别内获得均等的资金分配，以帮助实现车队的平衡分布。车辆的替换资格在于用户在特定时期（通常为\
  \ 3 年）内计算车辆的生命周期终点，且没有车辆分配来替换它。随后进行采购数量计算，具体车辆的替换基于优先级分配。它还允许用户创建假设场景，以查看预算调整对模型结果的影响，例如预算增加和预算减少。良好的车辆分配指标不在于在车辆寿命终点时进行替换，而在于采用结构化、逻辑化的方法来衡量未来影响。\n\
  \n最终结果显示，在模型的第一年及车辆寿命终点结构中，空军车辆的采购需求减少了 150 万美元。\n\n例如，车队利用 Teradata 地理空间功能来计算基地之间的距离。\n\
  \nTeradata 的地理空间解决方案通过将地理空间信息集成到企业级数据仓库中，并利用 Teradata 强大的数据库内分析能力，提供快速、准确的地理空间数据处理分析。同时，数据仓库中地理空间数据与其他业务数据的集成为用户带来了新的数据分析功能。\n\
  \n因此，美国空军车队被《Government Fleet Magazine》评为“百佳车队”，于 2014 年获得“绿色车队”荣誉，并在过去 24 个月内*获得*9\
  \ 项 A4/7 年度及季度奖项、3 项 A4L 奖项以及“联邦车队总监 Top 15”奖项。^(3)\n\n美国大数据交通的发展已逐步完善，不仅涉及政府机构，还涉及市场企业，实现相互融合与开放。未来，这必将是大数据交通快速发展的黄金时期。\n\
  \n#### 3.2 欧洲的大数据交通\n\n在大数据交通的发展中，除了美国的领先地位，欧洲作为一个拥有高度发达交通网络的地区，在大数据交通方面也拥有丰富经验和自己独特的发展网络。此外，欧盟（EU）将欧洲国家聚集在一起，使城市交通的先进发展经验得以共享，各国的大数据交通技术得以传播。\n\
  \n西班牙城市巴塞罗那是西班牙首屈一指的智慧城市。其在大数据交通和智能交通方面的发展极具代表性。\n\n在智能交通方面，巴塞罗那市民出行时可随时查询共享单车的可用性，正如中国民众出行时可查询共享单车分布一样。除了推广共享单车，巴塞罗那还推广免费充电站，全市拥有\
  \ 300 多个为电动交通工具提供服务的免费充电站。\n\n为方便市民乘坐公共交通出行，巴塞罗那升级了城市的公交站点，使其成为智能候车亭。智能候车亭极其智能化，体现在以下方面：\n\
  \n(1) 智能触控系统：智能候车亭配备智能触控设备，乘客候车时可查看相关交通信息，并利用近场通信技术和快速响应“QR”码下载多种与交通、出行、娱乐相关的应用程序。\n\
  \n(2) Wi-Fi：提供充足的 Wi-Fi 连接，以及为智能手机充电的充电接口。\n\n(3) 智能广告屏：智能屏可根据候车乘客的性别、年龄等特征推送并展示不同广告。\n\
  \n除了智能候车大厅，巴塞罗那市政府还推出了智能快速支付系统，让市民出行时可在线支付停车费。市民只需注册相关账户并自助填写相关信息。停车结束后，系统可自动扣费。在此基础上，市政府大力投资在车位安装大量传感器，以实时获取车位信息。基于大数据算法，政府交通管理平台可实时向市民推送停车信息，帮助他们快速停车，减少交通污染和资源浪费。\n\
  \n此外，还有智能红绿灯。巴塞罗那市政府为盲人提供可随身携带的小型智能遥控设备。当盲人过马路时，红绿灯变绿，设备会发出声音提醒，告知其安全过马路的时机。此外，智能红绿灯还可用于应急通行。例如，发生火灾或交通事故时，应急车辆通过智能红绿灯时，信号灯可转为绿灯，让应急车辆快速通过。这样，应急车辆可一路畅通无阻地到达目的地。\n\
  \n这种智能交通极大地方便了城市居民出行。盲目出行减少，不仅节省了人们的时间，还减少了污染。\n\n同样，作为欧盟主要成员国，德国在大数据交通方面的举措也极具代表性。基于欧盟完善的空间地理基础信息框架以及德国现有传统信息产业体系的优势，德国的数字城市建设（如大数据交通）已推向很高的发展水平。\n\
  \n例如，德国城市部署了大量传感器，可将交通、天气和行人流动数据传输至数据中心。数据中心将相关信息通知市政府和道路管理局，相关政府部门据此设置路灯等交通设施，使路灯亮度可根据实际需求自动调节。\n\
  \n此外，在德国建设大数据交通和智慧城市的早期阶段，信息基础设施建设是重中之重。其中最重要的是基础地理空间信息建设，它是自然、社会、经济、人文和环境信息的载体，也是大数据交通和智慧城市的基础。据相关资料，德国各州法律要求所有信息系统必须使用各州测绘部门提供的基础地形图（官方版本）。地形图的坐标系在全德统一，地形地理信息的采集存储标准以及交通网络信息的采集存储标准也全德统一。\n\
  \n\n\n\n# 欧洲与日本的大数据交通\n\n为了便于数据的管理、共享及利用，德国通过协调工作委员会的磋商，采用了统一的数据交换格式。来自各方的数据可通过标准数据交换软件进行交换，转化为所有群体和行业均可自由使用的数据格式。如此一来，大数据的共享与利用变得非常便捷，避免了在数据资源的采集、存储和使用过程中出现重复建设和浪费。\n\
  \n我们可以看到，欧洲在大数据建设方面拥有自身独特的优势，可归纳如下。\n\n##### 3.2.1 大数据交通发展更人性化、更惠民\n\n无论是英国、法国、德国还是西班牙，欧洲各国在大数据交通建设中始终将人民的出行需求作为主要目标。此外，政府在相关基础设施建设上投入巨资，这不仅方便了民众，也便利了欧洲企业。政府与企业合作建设了大量大数据交通基础设施，为大数据交通的发展提供了良好条件。\n\
  \n包括中国在内的许多国家和地区，在大数据交通建设过程中，标准化工作做得不够。各地区、各行政区划往往自行制定标准，导致交通大数据的采集、存储和使用碎片化，无法形成统一调用。即便国家通过行政手段统一调用，也常因数据格式问题造成资源的显著浪费。特别是一些新兴国家，正处于大数据交通建设的起步阶段，若标准化工作不到位，可能导致大量资源浪费和重复建设。\n\
  \n##### 3.2.2 财政投入加大\n\n大数据交通建设往往需要政府统筹指导，统一制定相关政策和规范。若任由地方行政单位或企业自行发展，往往会形成信息孤岛，导致政府或企业即便拥有海量数据资源，也无法与其他数据资源融合，最终造成浪费。若政府在建设初期大力统一投入，本可有效避免这一问题。\n\
  \n##### 3.2.3 大数据交通建设聚焦公共交通\n\n无论人们的出行需求多么多样，总体而言，公共交通是大多数民众所需。特别是在智慧城市建设中，公共交通最为重要。公共交通大数据建设不仅需要政府大力投入，还需要政府和企业对公众进行教育，使公众也能主动参与智慧城市建设。\n\
  \n作为大数据交通和智慧城市的引领者，欧洲的建设经验和成果值得我们深入研究。借此，中国的大数据交通建设能更具特色和智能化。\n\n#### 3.3 日本的大数据交通\n\
  \n我们前文已提到，早在 1990 年，日本的井口正一便首次提出了智能交通系统（`ITS` 简称）的概念。尽管该概念后来由美国人推广，但日本在智能交通和大数据交通建设上从未落后。在亚洲国家中，日本的大数据交通建设走在前列，值得借鉴。\n\
  \n2013 年，日本政府发布了《创建世界最先进 IT 国家宣言》。该文件全面阐述了日本 2013–2020 期间的国家战略，重点在于开放公共数据和大数据的发展，并强调“大数据的应用对于增强日本竞争力不可或缺”。此类政府文件反映了日本政府在大数据建设及大数据交通应用上的投入与决心。有了政府的支持与监管，大数据交通的发展自然会更加蓬勃。\n\
  \n日本的大数据交通建设在预防交通事故、保障交通安全方面表现极为优异。\n\n20 世纪 90 年代，日本开始推动数据交通和车联网建设。自 1995 年以来，得益于政府的数据交通建设，日本交通死亡人数持续下降。到\
  \ 2013 年，日本交通事故死亡人数已降至 4,373 人，事故死亡率已极低。\n\n在日本，车联网安全服务大体分为两类：危险信息提供和事故紧急救援。危险信息提供是指通过车车信息交换（称为\
  \ `V2X`）和移动互联网，将易发事故的危险信息、天气状况等交通信息发送给车辆用户。这些数据通过大数据挖掘和分析产生，能精准反映交通隐患，提醒车辆用户注意。危险信息提供的主要目的当然是预防，让交通参与者具备防范意识，采取预防措施。\n\
  \n事故紧急救援则相反，侧重于时间和效率的保障，使交通事故发生后能以最高效率实施救援，从而降低死亡率。例如丰田 T-Connect 的紧急救援，事故发生时，车辆用户可通过\
  \ `HelpNet` 一键联系后台人员，结合 `GPS` 信息，救援人员和警察将迅速抵达事故现场。事故严重时，车联网可直接联系后台，无需任何人按按钮。该系统能最大程度保护交通参与者，减少损失。\n\
  \n众所周知，车联网产业链可分为车企、`TSP`、车载终端供应商、网络运营商等环节，其功能无非是安全、驾驶、娱乐和服务。在任何一个环节，都会产生海量数据，这些数据可能为政府管理所需，也可能为相关企业所需。本田汽车的\
  \ `Internavi` 可基于日本的 `VICS`（道路交通信息通信系统）信息、本田内部存储的 `FCD`（浮动车数据）及交通拥堵统计，计算拥堵路段。这些路况信息正是政府所需，结合自身交通系统，可分析拥堵成因并改善交通状况。通过共享本田车联网信息，政府可减少部分重复建设和支出。对本田而言，拥有这些数据在为用户提供信息服务时，能精准引导用户避开拥堵路段，更快抵达目的地。如今许多地图导航软件和车企正合作共享信息、提升服务效率，这也能减少燃油消耗和环境污染。\n\
  \n\n\n\n根据研究，本田的 Internavi 环保路线服务是基于通过本田内部存储的 FCD 计算每条路线的油耗，然后在设定的目的地进行累积，从而推荐一条油耗最低的环保路线。例如，从横滨市到东京都府中市，环保路线耗时多\
  \ 5 分钟，但可减少 0.8 升油耗和 17.8% 的 CO[2] 排放。除此之外，车联网的 B2C 应用还包括车载远程控制、保养提醒和智能泊车。^(4)\n\
  \n此外，日本的车联网还结合外部数据使用。例如，日本的 VICS 实时信息主要由高速公路和干线公路的路侧设备推送，但存在没有路侧设备的路段，因此系统只能依赖地图上的静态信息来判断路况。接入本田的\
  \ FCD 后，可实时采集路况信息。Internavi 与本田 FCD 的结合，使得车辆即使在没有路侧设备的道路上行驶，也能接收来自 Internavi 信息中心推送的交通信息。高速公路和干线公路也能达到同样的效果，极大地扩展了智能交通的道路覆盖范围。\n\
  \n日本的智能交通与大数据交通建设结合了美国和欧洲的优势，形成了具有自身特色的大数据交通，如下所示。\n\n##### 3.3.1 政府主导、统一规范\n\n\
  日本政府在大数据交通建设中一直扮演着积极的推动者和资金投入者的角色。正是由于对基础设施的投资以及统一的规范和框架，日本的大数据交通和车联网发展迅猛，尤其是车联网的发展，具有自身的特色。\n\
  \n##### 3.3.2 车企电子化程度高\n\n作为大数据交通的重要参与者，车企在市场上与美国和欧洲竞争，为了进一步强化竞争优势，不断提升自身的电子化水平。丰田、本田、日产等汽车巨头自\
  \ 20 世纪 80 年代起便积极与电子厂商合作，共同开发车身电子控制、车载电子信息等设备，提高了日本汽车的电子化水平。这种做法无形中为大数据交通的发展奠定了基础。有了电子设备，数据信息的采集和存储变得更加容易，在大数据交通建设中，投资可减少、工期可缩短。\n\
  \n##### 3.3.3 市场化程度高\n\n在大数据交通的发展中，有些国家和地区的政府发挥了更大作用，而有些国家和地区的企业参与度更高。在日本的大数据交通发展中，汽车工业巨头与电子巨头合作，促进了数据的即时传输以及数据资源的实时调取和推送。\n\
  \n值得注意的是，自 2007 年起，日本强制所有生产的汽车引入 OBD2 系统。该系统可自动检测灯光、发动机、热交换器等设备的故障问题。还能监测排气传感器、胎压、电动汽车电池状态，并读取车速、油耗、里程等车辆数据。用户在手机上下载相应的\
  \ APP，即可实时获取车辆信息等资讯。如果政府和企业整合这些信息，就能提供更好的服务。例如，根据 FCD 的位置信息，新开通的道路会自动绘制在地图上；根据急刹车统计识别事故多发区，并通过语音提醒用户。通过将本田的\
  \ Internavi 信息中心与日本气象学会的数据库联动，并将 FCD 与实时天气信息关联，本田为用户提供的服务将更加精准和个性化。\n\n车企在车联网和大数据交通的建设过程中发挥着重要作用。政府有很多不做的事，车企为应对竞争，无意中做了政府不做的事。\n\
  \n##### 3.3.4 信息共享充分\n\n日本的企业和政府在交通数据的共享和利用方面做得更好。企业可与政府共享各类数据资源，政府也可基于其采集存储的数据资源为企业提供更好的服务，使企业降低数据使用成本，在面对国际竞争时更具竞争力。\n\
  \n总之，日本的大数据交通发展起步早、发展好。随着云服务、人工智能等技术的发展，日本车企在这些领域可利用的数据资源将更加丰富。对于拥有巨大交通资源的政府而言，更合理、充分地与企业共享资源将是双赢之举。\n\
  \n#### 3.4 中国的大数据交通\n\n中国大数据交通的发展正处于快速增长期或起步阶段。虽然中国的交通网络近年来取得了巨大发展，出现了交通信息获取、存储和使用的平台，政府也投入巨资，但仍存在许多不足。\n\
  \n中国大数据交通发展的优势极其明显，可从以下几个方面看出。\n\n##### 3.4.1 发展迅速\n\n中国经济发展的速度有目共睹。进入 21 世纪以来，随着网络的普及，中国的大数据交通开始迅速扩张。交通设施、路线等基础设施的增长是基础，而数据资源的高度集中生成是重中之重，数据资源量也在急剧扩大。据相关统计，中国大数据交通的数据量每\
  \ 2 年翻一番，这是一个非常惊人的数据增量。在交通过程中，随着卡口、电子警察、摄像头、传感器等设备数量的增加，以及互联网数据传输速度的提升，中国大数据交通领域未来将迎来爆发式发展。\n\
  \n例如，中国大数据中心贵阳于 2016 年启动了交通大数据中心建设。\n\n\n\n\n###### 交通大数据中心建设与发展现状\n\n## 3.4.1 交通大数据中心建设规划\n\
  \n交通大数据中心一期工程将整合市交通委内部数据，包括低碳数据中心、数据机房、公交数据、甲醇车数据、水上搜救等六类数据的整合。二期将整合横向协同数据，包括省交通厅数据、住建数据、气象数据、交管数据、城管数据、停车数据、铁路数据、民航数据。三期将向市政府汇报协调中石化、中石油数据，如智能网联汽车信令数据、移动运营商手机信令数据、新能源汽车数据，实现交通要素“一网通办”。\n\
  \n交通大数据中心建成后，将实现公共交通、综合调度、拥堵指数、车辆需求、建设规划的可视化和综合分析。利用大数据技术对城市客运特征进行定量分析，挖掘城市交通需求热点、分布规律、特征变化等。在交通拥堵、资源配置、执法薄弱等领域形成自处理的预警、预知、预测，构建指导科学决策、智能调度的智慧交通新管理模式。\n\
  \n未来，贵阳将依托市交通委总指挥、协调、协同调度机制，纵向打通省、市、县交通数据服务资源，横向整合水、陆、空、港公共服务信息，形成调度、投诉、监管“三个一指挥”。\n\
  \n贵阳将整合全国交通投诉服务热线 12328 和市长热线 12345，形成融合客运枢纽、公交服务、出租车投诉、执法管理以及城市公共交通拥堵预警预测、交通服务事件监管等对外公共服务职能。完成与公安交管执法力量的综合协调和打非联合执法。协同民航、铁路，形成联程运输、换乘服务等方面的数据融合，推进贵阳综合交通枢纽“零换乘”。\n\
  \n## 3.4.2 数据类型多样，数据资源丰富\n\n我国交通情况较为复杂，涵盖公路、铁路、水运等多种运输方式，将产生海量数据资源。以公路为例，城市道路、高速公路、乡镇道路等路段生成大量数据资源。主要资源类型包括：\n\
  \n- 传感器数据（位置、温度、压力、图像、速度、RFID 等信息）\n- 系统数据（日志、设备记录、MIBs 等）\n- 服务数据（收费信息、互联网服务等信息）\n\
  - 应用数据（厂商、能源、交通、性能、兼容性等信息）\n\n因此，我国交通数据类型繁多，体量巨大。未来，随着人口从农村向城市迁移，交通领域将出现更多视频监控、卡口报警、路况信息、管控信息、运营信息、GPS\
  \ 定位信息、RFID 识别信息等数据。这些数据量大且珍贵。\n\n多元化数据可为政府部门和企业提供相应支撑。例如，可深度挖掘交通大数据，公安部门可推出车辆轨迹、道路交通、案件聚类等大数据模型。基于大数据模型，可推出车牌识别、车身颜色识别、车型识别、车标识别、年款识别等通用功能，以及遮阳板检测、安全带检测、接打电话检测、驾驶员人脸识别等分析功能，可用于智能跟车分析、轨迹碰撞、人脸比对、舆情分析等。此类数据资源挖掘有助于政府部门逐步解决行业深层次问题。\n\
  \n此外，政府部门可利用交通大数据管理系统获取路况天气、施工情况、事故情况数据，结合大数据分析，还可为驾驶员和交通管理部门提供天气、路况、事故多发点位、停车场等信息。相关服务企业可根据车辆目的地、驾驶习惯、路况推荐驾驶路线。\n\
  \n## 3.4.3 后发优势明显\n\n美国、欧洲、日本的交通大数据技术和经验积累多年，我国具有在先进基础上发展的后发优势。一方面，政府和企业可借鉴既有建设经验和技术，快速转化和应用交通大数据；另一方面，可在此基础上创新和本地化。例如，中国高铁作为“四大新发明”之一，就是在消化吸收引进基础上形成的拥有自主知识产权的高铁产品。\n\
  \n然而，与其他国家和地区交通大数据发展相比，我国交通大数据发展仍存在诸多问题，需政府和企业共同面对和解决。\n\n## 3.4.4 统筹规划不足\n\n我国国情特殊，各省市自治区发展条件不同，导致交通大数据建设过程中目前地方色彩过重。各行政区域独立发展，未形成全国一盘棋局面。因此，在交通数据资源采集标准、存储标准、使用规范、共享原则等方面缺乏国家统一规划。交通大数据发展早期可能气象万千、快速推进，但随着全国联网交通网络形成，跨区域交通联系日益紧密，之前缺乏统一规划将导致发展瓶颈，易形成信息孤岛。\n\
  \n## 3.4.5 政府职能分割导致闭环管理缺失\n\n涉及交通的行政单位众多，如公安部、交通部、住建部等。这些部门在交通管理过程中沟通不畅、各自为政，形成各部门各有要求、各有标准的管理混乱局面。\n\
  \n\n\n\n如果我们能借鉴欧洲和日本大数据交通发展的经验，统筹协调政府部门、科研机构、企业及其他相关主体，划分各自的职责范围，并进行统一规划，就能各尽所能、专注擅长。例如，政府部门专注于规划、部门协调、政策研究、技术开发、标准化、市场秩序维护、质量监管、信息服务等。企业则可集中精力开发多种让交通参与者尽可能便捷的公共服务产品。\n\
  \n### 3.4.6 财政投入应当均衡\n\n政府将在建设大数据交通的过程中持续投入。然而，各地区发展水平不同，导致政府在资金投入上无意识地侧重某些地区或某些方面。这种财政投入虽利于部分地区，却会导致我国无法形成统一且有价值的大数据交通网络。此外，财政投入的不均衡可能导致大数据交通领域的某些技术严重滞后于其他技术，最终被他人掌控。\n\
  \n### 3.4.7 数据资源共享不足\n\n随着政策的变化，公安部、交通运输部、住房和城乡建设部等相关部委的数据资源正在逐步开放。然而，企业获取这些资源仍然困难。中国尚未形成统一的数据共享平台，也缺乏相关的数据资源安全保护，导致政府部门和企业都面临数据安全缺失的问题。尽管如此，政府部门和企业在共享数据资源方面仍十分谨慎。然而，如果无法实现信息共享，就会形成信息孤岛，即便数据资源丰富，其价值也无法体现。在这方面，我们应多借鉴日本的经验，政府和企业应紧密合作。\n\
  \n### 3.4.8 行业人才匮乏\n\n大数据交通发展迅速，但相关人才培养滞后。交通大数据分析和关键技术人才短缺，特别是交通领域的关键技术人才；若不能自主培养，将长期受制于人，制约大数据交通的发展。这些维度需要政府统筹规划和协调。\n\
  \n^1 内容引用自中国电子科技研究院梁志浩《美国大数据治理对我国的启示》。\n\n^2 内容引用自[cnii.com](http://cnii.com)《美国大数据研发重点领域七大战略》，有删减和修改。\n\
  \n^3 内容引用自界面新闻：《解密美空军如何用大数据管理全球机队》，有删减和修改。\n\n^4 内容引用自《物联网汽车带来的新机遇，从日本经验说起》，有删减和修改。\n\
  \n^5 内容引用自 jt-w12345《贵阳成立交通大数据中心》，有删减和修改。\n\n## 第 4 章\n\n## 大数据交通：八大创新模式\n\n大数据交通已在全球逐步普及，这一过程中涌现出许多具有代表性的案例。这些创新案例，无论成败，都值得政府决策者和企业家借鉴学习。\n\
  \n#### 4.1 大数据交通特征之一：共享经济\n\n虽然共享经济模式在国外起步较早，但其发展速度和创新模式在进入中国后才得到显著提升。通过移动互联网和大数据，共享经济能合理再配置资源，提高资源利用率，降低拥有成本。同时也减少了浪费，对提升全社会经济效益有明显效果。\n\
  \n共享经济具有以下几个特征：\n\n(a) 资源要素配置快速高效。\n\n(b) 所有权发生变化，所有权与使用权分离。\n\n(c) 所有资源配置均基于共享平台的数据挖掘。\n\
  \n(d) 人人皆可成为共享经济的参与者。\n\n(e) 用户体验至关重要，参与者行为数据呈现在平台上，参与者行为受评价机制约束。\n\n(f) 文化属性发生改变，个人拥有不代表一切，只有个人使用时才能体现真实价值。\n\
  \n从这些特征不难看出，共享经济的核心价值无论在哪个领域，始终是资源配置和用户体验，这都需要大数据来实现。在交通领域，共享经济模式下的创业案例众多，其核心要素仍是资源配置和用户体验。\n\
  \n据《欧洲时报》2017 年 1 月 18 日报道，设计并运营巴黎自助电动汽车租赁系统（AUTOLIB'）的 Bolloré集团提交财务文件称，AUTOLIB'亏损\
  \ 1.79 亿欧元。\n\n巴黎电动汽车租赁系统于 2011 年 10 月启用，采用 Bolloré集团设计运营的 Bluecar 电动汽车。如今，巴黎都市区及巴黎郊区均设有电动汽车租赁站点。该服务广受欢迎，目前拥有\
  \ 13 万用户。系统启动时，Bolloré集团称用户达到 10 万即可实现盈利。\n\n然而，Bolloré集团声称 AUTOLIB'支出远超预期，长期亏损，成为无底洞。据《勒卡纳尔·昂舍内报》披露，Bolloré集团提交给巴黎市政府的财务文件显示，AUTOLIB'亏损\
  \ 1.79 亿欧元。^1\n\n对于 Autolib'而言，它拥有巴黎市政府的大力支持。采用了自助租赁系统，其核心要素是对大数据进行分析挖掘，让市民出行尽可能便捷，提高资源配置效率。然而，因运营公司的问题，最终以失败告终。\n\
  \n\n\n\n##### Case Study of China's Shared Bicycle Success\n\nIn contrast, shared\
  \ bicycles in China have been far more successful. Represented by Mobike and OFO,\
  \ domestic shared bicycles were once China's dockless shared bicycle travel platforms.\
  \ They created the \"dockless bike-sharing\" model, dedicated to solving urban travel\
  \ problems. Users only need to scan the QR code on the bike body via the WeChat\
  \ official account or App, or directly enter the corresponding license plate number\
  \ to obtain the unlock password, to unlock and ride, available for pick-up and use\
  \ anytime, anywhere, or share their own bicycles to the OFO sharing platform to\
  \ obtain lifetime free usage rights for all OFO yellow bikes, exchanging one for\
  \ N. Since going online in June 2015, OFO has deployed 10 million shared bicycles,\
  \ providing over 4 billion rides for more than 200 million users in over 250 cities\
  \ across 20 countries worldwide. From October to November 2018, OFO was listed in\
  \ multiple enforcement cases by courts including the Beijing No.1 Intermediate People's\
  \ Court and the Beijing Haidian District People's Court, involving enforcement targets\
  \ exceeding the limit of 53.6 million yuan. Currently, the OFO shared bicycle brand\
  \ has exited the Chinese market. OFO developed rapidly; within just over a year\
  \ since the birth of shared bicycles, the active user base reached as high as 70\
  \ million, with relatively high user stickiness. Particularly in short-distance\
  \ travel demand, the usage frequency of shared bicycles is very high.\n\n##### Technical\
  \ Implementation and Big Data Application of Shared Bicycles\n\nBy combining user\
  \ location information with bicycle location information, shared bicycles can reasonably\
  \ schedule bicycle distribution locations, allowing users to quickly find bicycles.\
  \ When a user scans the code to unlock a bicycle with a smartphone, the smart lock\
  \ authenticates the user information, and then unlocks via the signal connection\
  \ between the smart lock and the bicycle operation backend. Data such as user riding\
  \ trajectories, trips, and time during the entire riding process can be viewed in\
  \ the shared bicycle backend. These backend big data are not only used by bicycle\
  \ operating companies for scheduling bicycles to meet user needs but also for precision\
  \ marketing.\n\nAccording to the \"2017 Shared Bicycle and Urban Development White\
  \ Paper\" released by Mobike, the cumulative riding mileage of shared bicycles in\
  \ China exceeded 2.5 billion kilometers, equivalent to approximately 3,300 round\
  \ trips from the Earth to the Moon. Riding has replaced private car travel to a\
  \ certain extent, bringing considerable \"green effects.\" The birth of shared bicycles\
  \ has doubled cycling travel volume. In cities, shared bicycles have become a good\
  \ alternative to public transport (buses, subways) and private cars. To a certain\
  \ extent, the use of shared bicycles has reduced dependence on private cars; after\
  \ the emergence of shared bicycles, the proportion of private car travel decreased\
  \ by about 3.2%.\n\nShared bicycles are only a microcosm of the sharing economy\
  \ in the transportation field. With the emergence of shared cars, shared motorcycles,\
  \ and shared buses, these sharing modes affect big data transportation in the following\
  \ ways:\n\n(a) **Revitalizing existing transportation resources and improving resource\
  \ utilization rates.** For example, shared cars like Baojia Car Rental revitalize\
  \ private cars and improve the resource utilization rate of the whole society (see\
  \ Figure 4.1).\n\n(b) **Improving travel efficiency.** For example, shared bicycles\
  \ solve the \"last kilometer of travel\" problem, changing the previous situation\
  \ of illegal taxis in short-distance travel, allowing everyone to travel freely,\
  \ thereby alleviating traffic congestion.\n\n(c) **Data analysis makes transportation\
  \ smarter and more targeted.** Under the sharing economy, users have a strong purpose\
  \ in using transportation tools, coupled with precise solutions from big data mining,\
  \ eliminating the blindness of past travel and alleviating traffic congestion.\n\
  \n(d) **The sharing economy model makes urban transportation smarter and more environmentally\
  \ friendly.**\n\n![Figure 4.1 Electric cars charging at the roadside](img/fig4.1.jpg)\n\
  \n**Figure 4.1 Electric cars charging at the roadside**\n\n*Source*: [www.DIEV.com](http://www.DIEV.com).\n\
  \n#### 4.2 Big Data Transportation Feature Two: Full Utilization of Resources\n\n\
  The high empty-seat rate of cars in transportation has always been a headache for\
  \ traffic managers. A five-seat car, when fully occupied with five people sharing\
  \ one car, is unobjectionable. If five people each drive a car, four extra cars\
  \ will be added to the road, which will inevitably aggravate congestion, and exhaust\
  \ emissions will increase pollution.\n\nThe model of five people sharing one car\
  \ is the hitchhiking (shunfengche) or carpooling (pinche) model. Didi Chuxing has\
  \ long provided hitchhiking and carpooling services. When passengers choose carpooling,\
  \ one Didi driver can pick up and drop off multiple passengers to different destinations\
  \ simultaneously, thereby reducing the number of vehicles used for travel while\
  \ ensuring normal passenger travel, significantly alleviating congestion.\n\nAccording\
  \ to statistics, during the 2017 Spring Festival travel rush, Didi Hitchhiking transported\
  \ 4.2 million passenger trips. Converted based on existing railway capacity, this\
  \ was equivalent to adding 1,909 conventional slow trains or 5,874 8-car EMU trains,\
  \ which was 4 times the number of passengers transported by trains during the same\
  \ period last year. A total of 2.8 million car owners participated in empty seat\
  \ sharing. Even on New Year's Eve (22:00 on Jan 27 to 6:00 the next day), 70,000\
  \ people still embarked on their journey home for reunion. During the Spring Festival\
  \ travel rush (Jan 28 - Feb 1), cross-city hitchhiking was mainly for short-distance\
  \ home returns, visiting relatives, and short-distance tours around surrounding\
  \ cities. ^(2)\n\nFrom the perspective of passenger structure, people from Wenzhou\
  \ prefer to travel alone, with 66.3% of Wenzhou people returning alone via hitchhiking;\
  \ people from Guangzhou prefer to travel in groups, with 52.11% of Guangzhou people\
  \ choosing to return via group hitchhiking.\n\nUnder the carpooling and hitchhiking\
  \ models, idle resources are utilized to the maximum extent, becoming an effective\
  \ way to relieve traffic pressure. Most importantly, the government and enterprises\
  \ have obtained real first-hand data on people's travel through hitchhiking and\
  \ carpooling. The government formulates congestion relief plans and decisions based\
  \ on this, and enterprise services are more precise.\n\nIn addition to carpooling\
  \ for small cars, other modes of transportation have also attempted carpooling.\
  \ For example, in October 2017, the Xi'an Railway Bureau launched train carpooling\
  \ through crowdfunding. Passengers participating in the crowdfunding boarded the\
  \ train on time at the agreed time, and the train adjusted its original departure\
  \ time to a time convenient for passengers, avoiding the embarrassment of passengers\
  \ having no cars or buses after arriving at their destination late at night. This\
  \ is another form of carpooling, presented in a crowdsourcing manner. If it develops\
  \ maturely, multiple special trains can be customized through carpooling to avoid\
  \ empty runs (see Figure 4.2).\n\nOf course, large buses like Dudu Bus also have\
  \ carpooling and hitchhiking models. Regardless of the model, the data precipitated\
  \ by the platform is the most real and valuable. It is precisely with the support\
  \ of these data that big data transportation becomes more efficient and intelligent.\n\
  \n#### 4.3 Big Data Transportation Feature Three: Precise Demand\n\n\n\n\n\n#####\
  \ Precise Matching of Needs and Services: Big Data Applications in Transportation\n\
  \nPrecise matching of needs and precise provision of services are important characteristics\
  \ of big data. In the transportation sector, to achieve precision, both service\
  \ providers and service recipients must possess precise data, so that needs and\
  \ services can be perfectly matched. When data is sufficiently large and rich, quantified\
  \ needs naturally emerge. At this point, providing precise needs-based services\
  \ is no longer difficult.\n\n![image](img/fig4.2.jpg)\n\n**Figure 4.2 Highway at\
  \ night.**\n\nAs China's big data center, Guizhou is in a leading position in precise\
  \ big data services in the transportation field.\n\n###### \"Data Cage\" Big Data\
  \ Fusion Platform Enables Full-Process Supervision\n\nSince the launch of the \"\
  Data Cage\" big data fusion platform, the Guiyang Municipal Transportation Administration\
  \ Bureau has gradually achieved real-time monitoring and full-process supervision\
  \ of administrative power operation platforms such as administrative law enforcement,\
  \ administrative approval, and public services.\n\n###### Customized Bus: Filling\
  \ Public Transport Blind Spots\n\nResidential areas, industrial parks, schools,\
  \ and other public transport service blind spots with populations exceeding 30,000\
  \ are the key service areas for \"Customized Bus\". Customized Bus recruits and\
  \ reserves passengers for relatively concentrated areas, implementing point-to-point,\
  \ fixed-passenger, fixed-seat customized services.\n\nGuizhou Qianxi Green Taxi\
  \ Service Co., Ltd. is the first enterprise in China to obtain a Network Ride-Hailing\
  \ Taxi Operation Permit, marking the legal operation of China's first customized\
  \ taxi service brand and opening a new chapter in Guiyang's urban traffic data.\n\
  \nQianxi Company adopts a \"dedicated car, dedicated driver\" B2C operation model,\
  \ providing every passenger with a safe, comfortable, and convenient travel experience.\n\
  \n####### Passenger Perspective: From Anxiety to Composure\n\nAt 5:00 PM, Chen Daiyu\
  \ (Editor's note: referred to as Chen Deyu later in the text, suspected to be the\
  \ same person), who works near Lewan International, takes the bus home. \"Everyone\
  \ has a seat, closes their eyes for a rest, and arrives home quickly,\" Chen Daiyu\
  \ said with a smile. But before July last year, Chen Daiyu's mood was far from relaxed\
  \ when taking the bus home after work. \"Waiting for the bus was very troublesome\
  \ back then because the time was uncertain. Missing a bus wasted a lot of time.\
  \ Taking a taxi here wasn't easy either, and it was expensive, so I was very anxious\
  \ whenever I took the bus home after work.\"\n\n**In July last year (2015), Guiyang\
  \ launched its first \"Customized Bus\" route from the Provincial Museum on Beijing\
  \ Road to Wudang Lewan International. Many office workers like Chen Daiyu who needed\
  \ to commute between the two places felt greatly relieved. \"Since the Customized\
  \ Bus opened, buses depart at fixed points and times, going directly from home to\
  \ work in one stop, saving time and improving work and life quality.\"** Subsequently,\
  \ Guiyang Public Transport (Group) Co., Ltd. successively opened 4 more \"Customized\
  \ Bus\" routes, including from the Provincial Government to Science City, and from\
  \ the Municipal Administrative Center to the Memorial Tower.\n\nIn addition, ordinary\
  \ citizens also began to enjoy the convenience of \"Customized Bus\". In 2015, students\
  \ in Guiyang University Town also started taking \"Customized Bus\" on weekends\
  \ and holidays.\n\nIn April 2016, the first \"Customized Bus\" route in University\
  \ Town opened, and hundreds of students safely and quickly reached Jinyang Bus Station\
  \ and Guiyang Railway Station via \"Customized Bus\". \"Taking the 'Customized Bus'\
  \ means we don't have to worry about squeezing onto the bus and missing the train\
  \ home,\" university student Xiao Li said.\n\n\"'Customized Public Transport' is\
  \ one of our 'Customized Bus' projects and also the earliest pilot project. Judging\
  \ from current citizen feedback, acceptance is quite high, accumulating experience\
  \ for our next step of promoting 'Customized Bus' citywide,\" said Liu Xianglong,\
  \ Deputy Director of the Passenger Transport Division of Guiyang Municipal Road\
  \ Transport Administration Bureau.\n\n###### Customized Bus Network Service Platform:\
  \ Big Data-Driven Smart Scheduling\n\nLiu Xianglong introduced that Customized Bus\
  \ is an important component of public transport. Based on the civilian use of transportation\
  \ big data, the Municipal Transportation Bureau built the Customized Bus Network\
  \ Service Platform. The platform's operation supervision and application services\
  \ are incorporated into the overall management of the Guiyang Low-Carbon Traffic\
  \ Information Command Center. The data center relies on the construction of the\
  \ Guiyang Municipal Data Resource Center, and relevant data is connected to the\
  \ Guiyang Municipal Government Data Exchange and Sharing Platform.\n\nThrough the\
  \ Internet and backend data processing and analysis, the platform provides basic\
  \ functions such as market research, demand analysis, route pushing, price calculation,\
  \ shift booking, online payment, publicity announcements, passenger interaction,\
  \ vehicle management, group booking, and campus services for Customized Bus.\n\n\
  The Customized Bus Network Service Platform of the Guiyang Municipal Transportation\
  \ Bureau has been under construction since last year and is now basically completed,\
  \ soon to be put into use. \"Residential areas, industrial parks, schools, and other\
  \ public transport service blind spots with populations exceeding 30,000 are the\
  \ key service areas for 'Customized Bus'. In addition, 'Customized Bus' can also\
  \ make up for insufficient public transport capacity and meet the public's personalized\
  \ travel needs.\"\n\nThe platform calculates optimal routes based on big data and\
  \ users' personalized needs, shortening average travel time compared to traditional\
  \ public transport. By providing services that are \"not crowded, not expensive,\
  \ and fast,\" it solves three major pain points and has become an effective means\
  \ to alleviate peak-hour traffic congestion and improve travel experience.\n\n######\
  \ \"Self-Processing\" Data Push Enhances Law Enforcement Precision\n\n\"Self-processing\"\
  \ data push enhances the precision of law enforcement.\n\nOn May 18, Xia Xungui,\
  \ a special administrator for the driver training industry of the Audit Detachment\
  \ No. 2 of the Guiyang Municipal Transportation Administration Bureau, continuously\
  \ received warning signals from the \"Data Cage\" on his mobile phone APP. \"The\
  \ reason is that a coach vehicle from a driving school in Yunyan District has exceeded\
  \ the 'electronic fence' range for three days.\" Xia Xungui told reporters that\
  \ at the end of 2015, the Guiyang Municipal Transportation Administration Bureau\
  \ launched a new driver training timing system, which became one of the six sub-modules\
  \ of the bureau's big data fusion platform for performance and efficiency. One of\
  \ the important functions of this system is to monitor coach vehicle training grounds,\
  \ forming an \"electronic fence,\" and tracking the driving status of coach vehicles\
  \ through a positioning system.\n\n\"In the past, we simply couldn't supervise thousands\
  \ of coach vehicles across the city. Now with the big data fusion platform, real-time\
  \ management of coach vehicles via big data is very convenient and effective. The\
  \ platform detects abnormalities and automatically processes and proactively warns,\"\
  \ Xia Xungui said.\n\nOn May 19, Xia Xungui went to this driving school to verify\
  \ the operation of the coach vehicle warned by the platform. \"This makes our law\
  \ enforcement more precise and effective,\" Xia Xungui said.\n\nIn addition to alarms\
  \ for coach vehicles exceeding electronic fences, the Guiyang Municipal Transportation\
  \ Administration Bureau's big data fusion platform can also initiate self-processing\
  \ warnings for various abnormal data such as vehicle operating permit expiration\
  \ and rating assessment expiration. \"Each type of abnormal data has different judgment\
  \ standards. Abnormal data found must be processed in a timely manner. If not processed\
  \ within the specified time, it will be reported to the supervising leader.\"\n\n\
  \n\n\n\n# 大数据融合平台与交通特征\n\n大数据融合平台还将整合相关数据，全面监控各部门的工作流程。一旦出现异常数据和违规流程操作，平台将发出警报。工作人员应在三天内进行自查。如果三天内对情况没有合理解释，平台将自动将异常情况推送给分管领导。如果在一定时期内类似异常频繁发生，局纪检监察部门将介入调查。\n\
  \n贵阳市道路运输管理局局长任进表示，该局将继续按照“信息化、数据化、自流转、一体化”方向推进数据笼应用的深度和广度，根据市委、市政府工作要求建立健全监督考核机制，推动工作取得实效。^(3)\n\
  \n在大数据交通中，精准需求匹配包含多个方面。例如，通过大数据提前预测用户需求以制定相应策略、开发新产品，并引导用户需求的凸显与满足，这很常见。又如，通过对现有大数据的分析预测，可优化交通流程中的某些环节，精准发现不必要和浪费的资源。还如，可通过大数据精准发现交通过程中的危险，并精准向交通参与者推送信息以避免不必要损失（参见图\
  \ 4.3）。\n\n总之，精准挖掘和满足需求是大数据时代最明显的特征之一。在大数据交通过程中，精准需求匹配将产生大量创业机会，使未来交通更加智能。\n\n![image](img/fig4.3.jpg)\n\
  \n图 4.3 码头起重机卸货。\n\n#### 4.4 大数据交通特征四：实时掌控\n\n随着城市交通的逐步完善，以及移动互联网、大数据等技术的进步，人们越来越希望能实时掌握交通信息以自由选择，从而以最合理、最有效的方式完成出行行为。\n\
  \n过去，无法获知实时路况信息。即使前方拥堵，驾驶员也无从得知。只有陷入拥堵路段时，才会想到其他道路是否通畅。这种盲目出行模式往往浪费驾驶员时间和交通资源，导致环境污染。\n\
  \n在中国和企业大力建设智慧交通大数据平台的支持下，人们在出行过程中实时掌握交通信息的愿望已成现实。\n\n智能交通大数据可视化平台可支持集成视频监控系统、智能卡口系统、交通流检测系统、信号控制系统等交通业务系统，实现视频监控、智能卡口分析、交通运行监测、交通信号监控等功能，帮助管理者实时了解路网运行状态和变化规律，为交通管理决策、交通规划设计提供科学数据支撑，实现道路交通状态远程实时监控。同时也实现了日常服务值勤的可视化管理，帮助管理者实时掌握服务人员部署和动态，便于及时调度，支持服务岗位分配、服务监管、服务考核等功能（参见图\
  \ 4.4）。\n\n通过视频监控系统、检测系统和移动终端，实现了交通基础设施的信息化管理，帮助管理者全面感知和监控基础设施状态，为交通基础设施安全管理和养护管理提供支撑，提升交通运行管理水平和服务保障能力。\n\
  \n同时，还可对历史交通流、交通违法、交通事故等数据进行分析、汇总、融合和专题分析，实现交通态势研判，达到科学精细化管理目的，为交通管理部门在交通组织、警力部署、设备布局等方面的优化提供决策依据。^(4)\n\
  \n![image](img/fig4.4.jpg)\n\n图 4.4 广州交警智慧交通指挥中心。\n\n总体而言，实时掌握交通信息体现在以下方面。\n\n(1)\
  \ **实时掌握道路交通状况。** 许多驾驶过程中的首要需求是清晰掌握前方道路交通状况。无论是拥堵、交通事故、道路养护还是自然灾害；相关信息提供给驾驶员后，驾驶员将根据经验和地图软件推荐选择自己的路线。\n\
  \n(2) **全时段实时掌握公共交通。** 全社会发展步伐日益加快，人们对时间精准度要求越来越高。选择公共交通时，精准知晓公交、地铁等交通工具的运行时刻表至关重要。\n\
  \n(3) **实时掌握交通安全。** 最明显的表现是亲友出行时，无论乘火车还是坐飞机，人们都想实时了解亲友的出行情况。如果亲友能实时知晓火车和飞机的运行状态，也会少担心许多。例如，“航班管家”APP\
  \ 中提供实时航班信息，如航班起飞、空中飞行状态、降落等信息一目了然。\n\n(4) 政府部门可实时掌控路况以采取更好措施疏导交通，如交通信号灯控制和临时交通管制。\n\
  \n(5) 企业可实时掌控交通信息为公众提供更好服务。例如百度地图、高德地图等地图软件，在为出行者提供导航服务时，必须实时掌握路况，否则可能误导出行者（参见图\
  \ 4.5）。\n\n#### 4.5 大数据交通特征五：高效便捷\n\n大数据交通优势明显：它助力交通管理者高效管理交通领域全要素，也助力交通参与者便捷接入交通设施。目前，政府和企业正致力于相关大数据交通平台建设。这些平台在保障交通高效运行的同时，为公众增添了诸多便利。\n\
  \n![image](img/fig4.5.jpg)\n\n图 4.5 大数据可视化决策平台。\n\n*来源*：数字海尔。\n\n例如，2017 年北京国际城市轨道交通展览会展出的“轨道交通大数据专家系统”，是大数据交通高效便捷特征的一个缩影。\n\
  \n\n\n\n\n##### 系统架构与专家知识库\n\n该系统基于烽火 FitData 大数据平台构建，利用大数据分析和车辆健康模型对车辆设备运行健康进行评估、智能故障诊断和运营风险预警，实现车辆设备的智能运维。它能有效提升轨道交通运营企业的机车及设备健康运行管理水平，为机车及相关设备的安全运行提供专家级智能运维服务。\n\
  \n专家知识库是轨道交通大数据专家系统的特性之一。\n\n1. **故障分析**：基于现有故障数据，通过大数据分析展示不同故障的对比数量，并计算其故障关联性。\n\
  2. **故障结构树**：针对不同故障采用不同的故障结构树，便于故障分析和定位。专家系统支持利用实战经验数据和机器学习技术不断修改故障树结构，对节点中的事件进行增、删、改，持续完善故障树。\n\
  \n通过使用该系统，可有效提高设备运行可靠性，提升运维效率并降低运维成本。根据运维数据的聚类分析，为车辆设备制造商提供设计制造改进建议。^(5)\n\n此类大数据交通平台和系统，除了为轨道交通运营商提供相应的信息、解决方案和改进建议外，更重要的是保障轨道交通正常运行，确保人民群众准时、准确出行。否则，在北京、上海、广州等一线城市，一旦轨道交通瘫痪，将影响海量出行者的正常工作生活；出行者工作生活受影响，将损害全社会的经济发展。因此，大数据交通的效率关乎国家和民生的方方面面。\n\
  \n#### 4.6 大数据特征六：智能化\n\n大数据交通与智能化紧密相连。当大数据交通变得更高效、便捷、自助、自由时，人们的出行将更加智能。\n\n*  \
  \ **早高峰出行**：早晨醒来，手机或车联网会推送上班路线的实时路况，您可根据实际情况提前出发或选择绕行。\n*   **拥堵应对**：遇到交通拥堵时，路侧检测设备可检测报警，交通管理部门基于数据分析选择最优方案，确保拥堵快速缓解。\n\
  *   **事故救援**：发生交通事故时，车联网系统可自动呼叫救援，保障出行者安全。\n\n所谓智能化，即通过大数据分析挖掘，使交通参与各环节及信息传递实现自主自助，交通管理者能及时响应，所有交通行为按既定规则有序运行。效率大幅提升，安全指数大幅增强，大数据交通在发展过程中完美解决了这些问题。\n\
  \n**案例**：为及时准确获取交通数据、构建交通数据处理模型，为未来智能交通建设奠基，济南市政府利用大数据技术实时管控全市 4,764 条车道、196 个路口信号灯，实现区域自适应信号控制。一旦发生道路拥堵，将自动报警并自动检测交通流量。\n\
  \n##### (1) 依托“警务云”实时管控 4,764 条车道\n\n秉持“动态防御、精准指挥、融合运行、整体防控”理念，依托警务云大数据处理技术，构建由\
  \ 1,758 个点位组成的四道防线，对 4,764 条车道实施实时管控。采用实时数据分析模式和分布式存储架构，实现全市任意卡口交通数据的实时处理、车辆运行轨迹实时显示、历史交通数据精准查询比对、GIS\
  \ 地图行驶轨迹回放、跨平台各警种资源互联互通，实战成效显著。\n\n此外，济南还开发了公交优先信号控制系统、占用黄网格线抓拍、不礼让行人抓拍等交通管理应用系统。市区建成\
  \ 22 个优先信号控制点，安装 255 套公交车载抓拍和路段违法抓拍设备，年均抓拍违法占用公交专用道超 15 万起；安装 39 套黄网格线占用抓拍设备和 5\
  \ 套不礼让行人抓拍设备，抓拍占用黄网格线违法 7,574 起、不礼让行人 24,136 起。违法占用公交道、非机动车道及抢道现象显著减少，礼让斑马线文明驾驶行为逐渐增多，公交与慢行交通空间得到有效保障。\n\
  \n##### (2) 拥堵预控：拥堵自动报警\n\n济南积极推进智能视频监控系统建设，改造提升 612 路模拟视频，新增道路拥堵自动报警、交通流量自动检测等异常事件自动报警功能。同时，深化高清数字视频监控集成应用，建设\
  \ 481 个高清视频监控点位和 368 个多功能电子哨位，大幅提升图像质量，实现各类动态、静态交通违法自动采集，支持二次图像识别技术应用拓展，形成全市高低点位监控有机结合，为日常交通管理和应急现场处置提供实时视频信号支撑。\n\
  \n另一方面，济南深化信号控制系统升级改造工程，建设便捷高效的精准交通信号控制系统和区域自适应控制系统，更新老旧设备，升级现有交通信号系统，真正实现信号配时随交通流变化同步调整，建立完善以指挥中心为核心的各级信号远程控制系统，实现精准、可靠、便捷的信号协调控制，减少行车停车延误，提高通行效率。\n\
  \n\n\n\n\n###### (3) 济南交警官方账号上线三大模块八大功能\n\n在“互联网+”模式下，智能交通离不开面向民生、拓展交通管理服务的价值导向。“互联网+”的最终效果是深入千家万户，消除过去限制创新的环节，连接孤立的创新，让信息服务大众。\n\
  \n以移动互联网技术为载体，济南公安建设了济南交警公共服务平台，覆盖 APP、微信、微博等多个信息渠道，直达群众手机开展交通管理业务和各类出行相关服务，全民参与共同提升城市生活品质，被列为市委、市政府今年\
  \ 18 件“为民办实事”之一。\n\n微信服务号上线了快速处理事故、交通管理业务、账号绑定认证三大模块八大功能，为群众提供快速处理事故、车辆抓拍查询、驾驶证查询等服务，累计关注\
  \ 11.5 万，认证驾驶员 3.1 万，绑定车辆 2.1 万。公共服务 APP 分两期建设，目前 APP 正在内测。一期上线个人中心、交通管理业务、资讯中心等多个模块，为群众提供通知推送、路况出行、交管资讯、业务查办、周边服务、意见建议等\
  \ 20 余项功能。二期在一期基础上将实现 50 余项功能，拓展便民利民服务领域。^(6)\n\n通过这一系列举措，济南让城市交通更加智能化，其中大数据发挥了重要作用。未来，随着交通数据的积累，交通环节中的任何不完美之处都能通过数据体现出来。大数据能提供解决方案，这将有助于交通变得越来越智能。\n\
  \n^(1) 内容引自周文怡，《AUTOLIB 亏损近 2 亿 巴黎政府拒买单》，《欧洲时报》（中文版）。内容有删改。\n\n^(2) 内容引自滴滴顺风车大数据，《看到渤海早报上这个数字吓一跳》。内容有删改。\n\
  \n^(3) 内容引自“[`www.gog.cn/Guizhou-Daily`](http://www.gog.cn/Guizhou-Daily)”：大数据+交通管理\
  \ 提升效率 精准便民。内容有删改。\n\n^(4) 内容引自数字海南（微信），《智慧交通大数据可视化 让城市运营车辆被监测被管控》。\n\n^(5) 内容引自轨道交通世界，《大数据和人工智能让轨道交通运维更高效便捷》。内容有删改。\n\
  \n^(6) 内容引自中国安防展览网，《大数据之下 济南智慧交通更便民 济南受益良多》。内容有删改。\n\n## 第二部分：应用篇 大数据交通的实战落地\n\n\
  本书第二部分探讨大数据交通的实施，即将通过大型企业在大数据交通领域的竞争、大数据助力公共交通规划、大数据交通与物流、大数据交通的未来等案例，阐述如何在各个领域导入和应用大数据交通。\n\
  \n### 第 5 章：大数据交通的入口\n\n近年来，“入口”成为一个热门词汇，有人认为找到入口就找到了出路。更诱人的是说，得入口者得天下。对于大数据交通而言，所谓入口是最基础的价值点。通过对入口的科学创建、管理和运营，可以将大数据交通平台上的价值点相互连接，衍生出数据价值链，从而更好地提升大数据交通系统的效率。\n\
  \n#### 5.1 交通一卡通\n\n2015 年 11 月，“十三五”规划提出推进交通低碳发展，优先发展公共交通。一些城市引入了智能公共交通系统，其中公共交通\
  \ IC 卡收费系统（`T-union`）是系统中应用最广泛的子系统。\n\n广东省发行的 `T-union`（岭南通）总量已达 4600 万张，覆盖公交、地铁、出租车等公共交通领域。在地域范围上，已实现广州、深圳、东莞、佛山、肇庆、江门、汕尾等\
  \ 21 个城市互联互通，并与香港八达通、澳门澳门通完美对接。`岭南通` 统一规划采集全省数据，最大日数据量超 1200 万条，每条数据至少包含 20 个属性。包括持卡人交易时间、地点、交易类型、交易频次、发卡数据、客服数据、充值消费数据、终端记录数据、公交站点信息、线路信息等。^(1)\n\
  \n目前，公共交通部门发行的 `T-union` 广泛应用，每天产生大量刷卡交易。交通部门可精准采集其记录的出行信息。因此，`T-union` 系统的应用领域不断扩大，承载了海量交通数据，自然构成了大数据交通系统的重要入口。\n\
  \n##### 5.1.1 T-union 数据入口的准确性\n\n`T-union` 系统的成熟和普及保证了数据来源的准确性。在北京，交通管理机构设立了专门管理系统，可精准统计地铁日客流量，或提取某群体的出行路线。此外，每天使用\
  \ `T-union` 乘坐公交的人员流量也能精准统计。即使部分市民选择用现金乘坐公交或地铁，统计部门也可按比例推算每日人数。\n\n从长远来看，城市居民一日出行通常具有回归特征。具体表现为从居住地出发最终回到居住地，使得公交站点呈现特殊的对称效应。与其他数据源相比，公交\
  \ `T-union` 记录的居民多日出行数据，虽偶有变动，但长期来看基本稳定，这也保证了公交 `T-union` 采集的数据能准确判断乘客的出行目的地。\n\n\
  \n\n\n\n这种精准的采集效果，在数据后续分析中无需对乘客的下一站点进行大量分析判断，从而有效降低了复杂度，并提高了效率和精度。\n\n##### 5.1.2\
  \ 交通一卡通入口的科学性\n\n城市公共交通基础数据可分为静态数据和动态数据。动态数据主要随时间实时更新，包括线路客流、站点客流、交通流、车辆实时速度等数据。静态数据是指在一定时期内不会改变或无需实时更新的数据，如公交站点位置数据、各公交线路经过的站点信息、站间距、换乘站点位置信息等。\n\
  \n通过同时采集和提供静态与动态数据，交通一卡通保证了所获数据的科学性和全面性，为进一步的数据存储和分析奠定了良好基础。\n\n##### 5.1.3 交通一卡通数据的广泛应用\n\
  \n在广泛运营平台和海量数据的支撑下，交通一卡通数据的采集与应用呈现多元化发展态势。客流信息和运营信息的获取与分析正变得更加及时、准确和广泛。\n\n例如，得益于交通一卡通系统的广泛覆盖和数据的强即时性，其数据成果可被广泛应用。通过采集相关数据属性，公共交通部门可计算可按时段、路段、研究对象划分的出行参数，并加以应用甚至创建公共交通模型。\n\
  \n此外，利用交通一卡通采集的数据，公共交通管理部门可采取针对性措施，提前针对不同情况制定应对预案。例如，运力的科学调配、各类交通问题的及时处理以及决策针对性的提升，均为典型的大数据应用。\n\
  \n##### 5.1.4 交通一卡通数据采集的未来发展\n\n利用交通一卡通信息采集和挖掘数据，具有数据量大、处理简易、实时性强等优势，可为大数据交通系统建设节省大量成本。同时，交通一卡通的数据采集在未来发展方面仍有相当大的空间。\n\
  \n目前，手机 NFC 近场支付功能尚未在中国消费群体中普及。相应地，交通一卡通的数据采集未与移动支付相结合。随着科技发展，一旦 NFC 支付功能普及，交通一卡通的数据采集能力和效果将与移动支付系统的数据采集共同提升。届时，交通一卡通将成为更重要的数据入口，为交通管理部门更精准地输出城市居民出行规模、相关信息等数据（见图\
  \ 5.1）。\n\n进一步地，目前全国公交一卡通未像银行卡那样实行联网系统；许多城市票价仅与路程长短相关，部分城市公共交通仍存在很大不确定性。因此，随着未来城市发展新要素的加入，进一步完善交通一卡通系统性能，如改进公交\
  \ IC 卡数据库的解构、建立公共交通数据仓库、整合公共交通基础信息、IC 卡信息和公共交通企业运营管理信息，实现信息融合，可使其在大数据时代数据入口的实现中发挥重要作用。\n\
  \n![图 5.1 AI 软件栈与生态](img/fig5.1.jpg)\n\n#### 5.2 GPS 与北斗系统\n\n美国 GPS 卫星定位系统由美国国防部于\
  \ 1973 年设计开发，1993 年建成。其空间部分由 24 颗工作卫星组成。这些卫星的分布设计使得世界上任何地点、任何时间均可观测到 4 颗以上卫星。接收机位置可通过定位信息的解算来确定。\n\
  \n1994 年，中国开始建设“北斗一代”卫星导航定位系统。预计到 2020 年，将建成由 30 颗以上卫星组成、能够覆盖全球的“北斗二代”卫星导航定位系统。其建设目标是为中国及周边地区的军民用户提供陆、海、空导航定位服务。\n\
  \n目前，GPS 和北斗系统均具备车辆跟踪、紧急救助、信息查询、行程规划等功能。此外，为利用大数据分析交通态势，GPS 和北斗系统采集的实时信息被用于融合其他交通数据、形成数据源，这也使这两个系统成为重要且优质的数据入口。\n\
  \n2016 年，武汉市交通管理局交通数据工作室基于互联网建成大数据交通诱导系统。在该工作室大屏幕的实时数据源接入栏目中，已实现 2.6 亿条 GPS 数据接入。通过这些数据，可展示城市道路从\
  \ 0:00 到 24:00 的热力状况。它不仅能实时反映当前拥堵位置，还能预测一小时内的拥堵路段。\n\n在使用 GPS 数据源之前，一旦道路拥堵，只能通过群众报警和警方视频巡查确认后，在现场处置。目前，基于\
  \ GPS 的大数据管理系统遇拥堵可即时预警。通过对全市道路 GPS 数据的分析，交通管理系统能更好地指挥调度决策，提前人工干预，有效缓解拥堵。\n\n同样，北斗卫星定位系统也为大数据交通提供了主动且充足的数据源。\n\
  \n2017 年 4 月，上海浦东所有公交车均装配了北斗卫星定位芯片，每 10 秒向后台调度系统发送一次信号。与 GPS 相比，北斗卫星定位芯片采用“短报文”技术，可在通信环境差的情况下传输数据。利用实时数据，公共交通管理部门构建了智能集群调度系统。凭借这一强大的后台支持，通过安装在公交站杆上的接收机，可在站牌上实时形成车辆运行轨迹，从而为乘客提供到站预报。\n\
  \n无论是 GPS 还是北斗系统，两者均具备定位精准、终端便捷、安装快速、数据提取方便等特点。因此，GPS 和北斗系统可随时记录城市交通和人群移动的动态变化，为城市数据交通管理研究提供大量重要数据信息。与问卷调查、计程仪等传统方法相比，数据信息更丰富、准确，且可直接使用。\n\
  \n##### 5.2.1 出租车车载系统的数据应用\n\n\n\n\n###### 出租车是城市交通中不可或缺的一部分，其速度和交通密度在很大程度上能反映道路交通状况。因此，车载\
  \ GPS 和北斗系统反映的出租车轨迹数据可用于分析城市交通拥堵的变化。例如，建立交通流密度模型并利用大量出租车轨迹数据库，自动确定各路段的通行能力，从而估算路段平均车速，预测交通状况和潜在拥堵。\n\
  \n由于城市交通流的变化通常遵循特定模式，出租车司机通常会选择相对固定的路线。通过利用 GPS 和北斗系统挖掘出租车的长期运行数据，不仅可以自动识别正常轨迹，还能及时发现和处理异常轨迹及事故，如交通事故和主干道封闭。\n\
  \n##### 5.2.2 城市交通的运行、管理与保障\n\n通过对车载 GPS 和北斗提供的数据进行进一步的统计分析，可以获得不同的指标和数据，如行驶里程、载客历程、时空率和分布的时空特征。这些信息不仅可用于出租车和公交车的日常管理，也可供公共交通管理部门使用，作为出租车或公交车决策的依据。\n\
  \n进一步思考，如果挖掘上述车载设备积累的数据，可以进一步发现数据中隐含的规律，从而为城市交通规划和管理提供指导和决策依据，优化城市交通。\n\n#### 5.3\
  \ 智能手机移动数据应用\n\n近年来，智能手机的使用越来越普及。同时，智能手机配备的 GPS 或北斗系统也可作为目标点的交通检测器，采集固定点的实时数据，用于预测交通流速度。\n\
  \n传统的交通流数据采集依赖地感线圈获取数据，但地感线圈覆盖面小、成本高、普及率低。相比之下，交通管理部门可与无线运营商合作，获取通话数据、短信数据、手机在基站间的切换数据、手机所在基站的位置数据，以及手机信息量的变化，并利用手机定位系统及时获取路段交通数据。\n\
  \n通过手机采集路况信息后，交通管理部门相关机构可通过训练统计模型，估算和预测相应的交通状况（包括行程时间和拥堵情况），从而为手机持有者甚至所有行驶车辆提供便捷的出行规划服务。\n\
  \n此外，手机 GPS 或北斗系统采集的交通数据能展示具体的出行模式。出行模式是描述人们交通行为的重要属性。一般来说，出行模式包括驾车、骑行、公交、地铁和步行。引入出行模式概念后，GPS\
  \ 或北斗系统的数据可进一步划分为不同的出行模式，然后根据挖掘结果进行合理的管理或提出建议。\n\n通过任何提供 GPS 或北斗功能的设备，都可采集海量交通数据。但在大多数情况下，交通管理部门无法直接使用这些数据。这是因为相关数据量非常大，且单个\
  \ GPS 或北斗系统点对整个城市交通管理应用意义不大。未来，相关研究和管理机构必须从 GPS 和北斗系统数据中挖掘频繁循环模式，并通过分析循环模式，找出城市不同区域、社区居民以及不同道路上的出行和生活规律。同时，循环模式也可视为交通运动轨迹的压缩。GPS\
  \ 和北斗系统的数据可循环化，从而节省存储和处理空间。\n\n## 5.3 车联网\n\n车联网的概念是在中国基于物联网提出的。2009 年 9 月，第四届全国\
  \ GPS 运营商大会在深圳召开，“车联网”一词首次出现。同年 11 月，在上海举行的第四届 RFID 技术发展国际研讨会上，“车联网”的定义正式形成。\n\n\
  车联网是指装载在车辆上的电子标签。通过射频等识别技术，将车辆的所有属性信息、静态和动态信息提取出来，并在信息网络平台上得到有效利用。根据不同的功能需求，车联网将能够支持所有车辆的运行状态，实现有效监管和提供综合服务。\n\
  \n当然，上述定义主要是从信息技术角度作出的。随着技术和社会的发展，车联网的作用无法在其中得到充分体现。从本质上讲，车联网的意义和价值在于收集和处理城市交通网络中每辆车的数据和信息、数据共享、车、路、网的共同连接，从而建立一个独立于视觉、天气条件和人工操作的交通管理系统。\n\
  \n以下是利用车联网获取和应用数据的典型案例：\n\n车载自动诊断系统（OBD）最早在美国用于检测不同类型的车辆尾气排放。通过该接口，我们可以读取车辆运行的各种数据，包括发动机数据、驾驶行为和燃油消耗数据、车辆安全数据等。\n\
  \n在中国，一家初创公司推出了可插入车辆 OBD 接口的小型硬件。该硬件通过蓝牙将车内有用数据传输到手机，再通过移动互联网传输到大数据平台。通过这一渠道，可提取和传输车辆数据，记录油耗、驾驶行为和轨迹，从而提醒车辆安全信息。\n\
  \n事实上，车联网的数据来源广泛，包括车内通信、车路通信、车车通信、车与外界通信、车与人通信。如果我们全面细致地收集和挖掘这些数据，就能实现“人、车、路、环”四者和谐统一的程度。\n\
  \n### 5.3.1 车辆与路侧设施的数据交换\n\n\n\n通过车联网的构建，数据交换兼容了传统车辆与交通信号（如标志、行车线、限速、红绿灯等）之间的数据传输。随后，通过获取联网车辆的查询信息和导航请求，将所需数据返回给相关联网车辆。在这个闭环系统中，接入车联网的车辆可通过车载无线数据传输模块获取交通信号系统的数字化信息，并在车内直接显示，同时将该信息与车载驾驶系统连接，作为驾驶员的参考信号。\n\
  \n### 5.3.2 车辆互联互动数据\n\n通过在车辆中安装各无线数据传输模块，不同车辆可同时发送传统交通指示信息和数字化信息。这样，相关车辆之间可形成数据同步，不同车辆的数字信号可同时在车内获取并显示，且信息可与车载驾驶系统连接互动，成为车辆安全行驶的基础。\n\
  \n### 5.3.3 车辆与交通管理部门的数据交换\n\n车联网系统分为三部分：车载终端、云计算处理平台和数据分析平台。根据交通管理行业需求，车联网可对车辆数据进行有效监控和管理。\n\
  \n在实际交通中，具体车辆运行往往涉及多种数据，如开关量、传感器模拟量和 CAN 信号数据。驾驶员在操作车辆时产生的车辆数据将回传至后台数据库形成海量数据，云计算平台将实现对海量数据的“过滤筛选”，随后数据分析平台以报表形式处理数据，以便管理人员直接查看。\n\
  \n### 5.3.4 车联网数据集成服务\n\n通过车联网获取实时数据，可建立准确高效的综合交通管理控制系统，有效连接“人、车、路、环境”。此外，根据不同功能需求，交通管理部门将对所有车辆运行状态进行有效的数字化监管，并提供综合服务。\n\
  \n例如，可利用碰撞预警、电子路标、红绿灯预警、车辆在线诊断、路面湿滑检测等数据服务，为驾驶员提供即时预警，提高行车安全；通过拥堵检测、路径规划、道路收费等，提高居民出行效率。\n\
  \n随着大数据交通管理的发展，车联网作为数据入口将创造新的管理模式。现阶段，必须引导交通管理部门在车企、IT 企业和消费者之间建立有效的协调机制和完整的产业链，并形成行业相关技术标准，以推动车联网产业发展。\n\
  \n### 5.4 路网监控\n\n路网监控（全称高速公路网监控系统）以高速公路网监控中心为指挥中枢，负责协调全路网的交通监控与控制，并对全路网交通监控系统进行统一协调、指挥、调度、数据收集分析和统计报表。通过路网监控系统的科学应用，交通管理部门可及时获取各类数据，并对路况信息和道路服务水平进行统计分析。\n\
  \n2017 年春节期间，全国路网实时路况和趋势判断在央视新闻直播间、中国交通广播、交通运输部、微信公众号等各类媒体持续滚动播报。这份春节期间全国路网运行分析研判报告，强化了路网运行的实时检测、应急响应和信息发布，体现了路网监控系统的重要作用。\n\
  \n2016 年，交通运输部路网中心加强与不同社会资源的合作，联合交通运输部规划研究院、交通运输部公路科学研究院、中国公共交通信息科技股份有限公司、中国科学院、高德地图等单位，先后开发了公路路况运行信息管理业务系统（GIS-T\
  \ 综合业务系统）、全国高速公路网实时路况系统、全国高速公路拥堵流量趋势系统、京沪高速公路综合路况业务系统，并于 2017 年春节期间投入试运行。\n\n1 月\
  \ 28 日，通过全国高速公路网实时路况系统，路网监控值班人员发现京昆高速公路四川境内雅安至西昌段多个路段出现拥堵，拥堵长度达数十公里，车速低于 20 公里/小时。值班人员及时联系四川省交通运输厅核实了解情况。查明原因后，当地路政人员和高速交警采取远程计数、定点分流、多渠道信息发布等方式加强疏导。至\
  \ 1 月 31 日下午，雅安至西昌段拥堵得到缓解。\n\n通过路网监控系统的应用，可及时准确收集道路交通各类数据信息，计算分析数据信息以科学决策，再通过优化控制快速落实管理意图。此外，路网监控系统还可通过收集路面数据信息支持有效信息发布，为驾驶员提供综合信息服务，进而引导驾驶员正确行车，力求维持城市交通动态平衡。\n\
  \n路网交通监控系统主要通过以下方式实现交通数据的采集与应用：\n\n**(1) 交通流检测系统：** 许多城市已开发并使用交通流检测系统，特别是针对城市交通状况和混合交通流特性。此类系统采用相应的智能数字图像信息处理技术，具有技术先进、性能稳定、不损坏路面、适应性强、安装操作方便等诸多特点。\n\
  \n\n\n实时响应软件用于交通流检测系统。该系统在待检测车道顶部设置车辆图像信息采集摄像头。视频触发识别软件用于分析摄像头回传的数字视频信号，以判断是否有车辆通过。当车辆进入检测区域时，交通流检测模块立即启动，系统将为每一辆通过的车辆自动加一计数。\n\
  \n在极短的时间内，交通流检测系统即可完成交通流检测、排队长度、等待时间、车道占有率、路况信息分析及检索数据处理。这些实时数据可与数据库中的交通流参数进行比对，判断路况拥堵情况，并进行远程数据发布、更新、查询等处理。\n\
  \n此外，系统还可按日期统计通过车辆，包括交通流量、等待时间、车道占有率等数据。数据结果可输出并以表格、直方图、图表等形式打印，及时传输至交通管理中心。管理部门可根据数据采取相应措施疏导交通，以满足城市交通智能化管理与监控的要求。\n\
  \n##### (2) 路况检测系统\n\n该系统主要用于采集路面原始数据，主要依赖车辆检测器、检测线圈、各类通信设备等。这些设备设置在城市道路的关键位置，并安装摄像头和视频设备，以获取道路运行的实际数据。\n\
  \n此外，还可通过路边紧急电话获取道路上的紧急信号。通过完善的气象信息采集系统，可检测地面湿度、温度、能见度、风向、风速、雨雪天气等不同气象数据，为合理分配道路运行保障能力提供前提条件。同时，上述数据也可通过电视墙、计算机和互联网以集中或单独的方式显示，为车主驾驶和交通管理提供参考。\n\
  \n进一步而言，为更好地实现路网监控的数据采集功能，必须保证外场监控的数据采集能力，即避免监控盲区。目前，外场监控分为自动模式和人工模式两种。分别采集道路环境数据、交通数据、气象数据和异常数据。\n\
  \n### 5.4.1 路网监控的技术优势\n\n在数据源接入方面，路网监控具有其独特优势。首先，路网监控可实现多参数、大范围检测。一方面，网络监控可从视频信号中快速提取大面积区域的多种交通参数，并提取其他方法难以检测的参数。另一方面，路网监控系统可利用一路视频信号同时覆盖\
  \ 4–6 条车道，实现大面积交通流检测。\n\n其次，路网监控可实现多阶段检测，即既能检测路口的交通需求及相关变量，也能检测信号控制方案实施的具体数据，从而完成自动信号控制全过程效果的反馈。\n\
  \n在安装使用方面，路网监控系统可在不破坏路面、不干扰正常交通的情况下完成检测器的复位。与车载终端相比，使用方法更简便。更为重要的是，在该系统基础上可开发出更多实用的数据采集方法。\n\
  \n总之，完善的路网交通监控系统是大数据交通系统成熟的数据入口，其正确使用可提高道路交通管理效率，充分发挥道路使用价值，保障交通管理及交通系统平稳运行。\n\n\
  ### 5.5 电子导航地图\n\n如果说大数据交通管理系统正在改变每个人的出行和生活方式，电子导航在大数据交通系统中发挥着重要作用，直接关系到大数据交通系统的成败。\n\
  \n近年来，由于我国导航定位服务产业规模持续扩大，电子导航地图产业发展迅速。2010 年，我国电子导航地图市场规模约为 11.28 亿元，同比增长 35.17%；2015\
  \ 年，我国电子导航地图市场规模攀升至 36.91 亿元。其中，车载电子导航地图产业规模持续扩大并保持高增长率。2015 年，车载电子导航地图市场规模达到 20.57\
  \ 亿元，年增长率 17.61%。\n\n2016 年，武汉大量出租车配备了新型车载电子导航地图系统。使用电子导航地图时，司机和乘客只需在系统中设置起点和终点，即可自由选择行驶路线。对于交通管理部门而言，电子导航系统具有强大的数据采集能力，配备信息屏、服务评价器、监控设备和智能顶灯，确保全市所有出租车信息同步。管理部门可通过\
  \ GPS 定位、运营、服务评价、费用、行业资质等信息，对出租车和司机进行智能化网络管理，大幅提高效率。^(2)\n\n从本质上讲，电子导航地图是一种基于计算机系统的空间数据系统，具有数据内容丰富多样、数据关系复杂、信息共享等特征。同时，电子导航地图本身也是一种地理数据系统，具备地理数据系统的大部分功能。因此，电子导航地图可通过互联网在计算机屏幕上显示数字信号（包括数字地图、遥感数字图像和采集的数字数据）和模拟信号。\n\
  \n事实上，得益于数字测绘技术的可视化功能、数据查询分析功能、多媒体技术和虚拟现实技术的结合，电子导航地图自问世以来便赢得了交通管理部门的广泛关注。随着 GPS\
  \ 导航、北斗导航等应用的普及，电子导航地图不断为大数据交通管理系统提供数据信息。\n\n电子导航地图需要采集大量数据，必须通过多种综合途径获取，以确保信息全面、实时、可靠。获取数据信息的主要途径如下：\n\
  \n##### (1) 直接数据获取与共享\n\n对于大部分基础地理信息，国家、大多数地区和城市都建立了自己的基础地理数据信息系统。例如，中国已建立了 1:10000\
  \ 和 1:2500 比例尺的基础地理数据库，大多数地区和城市已建立了 1:500 和 1:200 比例尺的基础地理信息数据库。\n\n\n\n这些基础数据系统作为交通信息的重要载体，发挥了重要作用。对于这些现有的数据信息，可直接作为电子导航地图的数据源；经整理后，可直接录入交通管理部门的电子地图数据库。\n\
  \n同时，交通管理部门也可将其他系统的数据共享至电子导航系统中。例如，交通信号控制系统、公交调度动态变更表、车辆收费系统等包含大量交通地图专用数据。若能整合这些资源，在保证数据准确性和全面性的前提下，将更好地完成交通地图数据采集工作。\n\
  \n##### (2) 利用 GPS 和北斗系统进行数据采集\n\n通过电子导航地图、GPS 与北斗系统的结合，可精准采集点要素的空间数据信息，如车辆位置、交通事故位置等。\n\
  \n由于 GPS 和北斗系统能提供全球覆盖、全天候免费的高精度导航定位服务，车载接收机可将系统获取的信息与电子导航地图进行匹配。这样，行驶在交通道路上车辆的具体位置数据即可上报给交通管理部门。\n\
  \n##### (3) 与 GIS 智能交通监管系统进行数据共享\n\n通过将电子导航地图与 GIS 智能交通监管系统连接，可直接帮助交通监管机构在图上实现以下数据操作：\n\
  \n(a) 电子导航地图的无级放大与缩小；\n(b) 电子导航地图的平移与切换；\n(c) 显示模式可选；\n(d) 数十个图层的任意调用；\n(e) 图形编辑；\n\
  (f) 各类信息查询（地理目标、车辆信息等）。\n\n例如，2009 年西安市交通指挥中心的 GIS 系统集成了电子导航地图系统，从而拥有地图漫游、地图缩放、地图内场站设施查询、“鹰眼”快速定位等众多地图数据操作功能（见图\
  \ 5.2）。\n\n![image](img/fig5.2.jpg)\n\n图 5.2 出租车车内监控图像。\n\n*来源*：武汉交通网。\n\n通过地图数据的利用，系统可在\
  \ GIS 地图显示屏上显示视频设备、信号机、诱导屏、车载 GPS 监控终端设备、电子警察等动静态设备的动静态数据；只需点击地图，即可集成详细交通动态并即时显示在计算机屏幕上。\n\
  \n电子导航地图是大数据交通管理的重要入口。交通管理部门必须全方位协调企业、社会、研究者与用户，形成合力，确保电子导航地图在未来充分发挥数据采集与挖掘的价值。\n\
  \n# 5.6 ETC\n\n近年来，电子不停车收费（ETC）技术日趋成熟，大规模产业化应用全面展开。2007 年 5 月 1 日，智能交通系统 ETC 国家标准正式颁布实施，ETC\
  \ 系统建设与推广在全国范围内再次铺开。2009 年 5 月，北京 ERC 电子不停车收费系统开始运行。\n\n在日常收费过程中，ETC 系统记录车辆通行的原始数据，其中蕴含大量交通流信息。因此，ETC\
  \ 系统具备为大数据交通系统提供统计数据和信息服务的功能。\n\n在北京工作多年的刘二伟，年初摇中了车牌。听朋友说装 ETC 回河南老家走高速很方便，于是买新车时就装了\
  \ ETC。\n\n近日，刘二伟一家自驾回老家。刘二伟说：“从北京到洛阳，经过了四五个收费站，一次都没排队。跟人工收费站长龙相比，咱们这简直是‘插上翅膀’啊。”\n\
  \n据交通运输部数据，中国像刘二伟这样安装 ETC 的用户已达 5000 万。5000 万意味着什么？截至 2016 年底，中国汽车保有量达 1.94 亿辆，私家车保有量达\
  \ 1.46 亿辆，意味着平均每 4 辆车中就有 1 辆安装了 ETC。\n\n截至今年 4 月底，全国高速公路 ETC 用户已覆盖 29 个省份，主线收费站\
  \ ETC 车道覆盖率超 98%，日均通行量占高速公路交通总量的 30% 以上。^(3)\n\n目前，国外 ETC 系统相对完善，但中国在系统普及率、收费信息采集与服务方面仍存在巨大差距。在普及率低、采集手段少的条件下，如何利用\
  \ ETC 收费数据构建高速公路交通运行数据入口，具有重要的研究意义和实践价值。\n\n## 5.6.1 高效采集车辆通行信息\n\n通过 ETC 系统，可高效获取车主个人信息、卡内余额以及车速、时间、路径等数据信息。在数据采集方面，ETC\
  \ 远优于摄像监控、车牌识别、地感线圈等传统车辆信息采集方式，所采集的交通信息更全面、准确。\n\n此外，在海关、港口、景区出入口等重点区域，使用 ETC 的车辆可不停车直行通行，为管理部门提供基础数据。对于数据准确性和质量要求较高的路段，通过分析车辆日常进出记录，也可借助数据排查是否存在异常交通运行状况。\n\
  \n## 5.6.2 为主管部门提供分析报告\n\n高速公路 ETC 系统可记录车主信息和收费金额，城市 ETC 系统可记录车主日常行驶时间。充分利用这些数据，可最大化\
  \ ETC 的价值。\n\n事实上，目前无论是高速公路 ETC 网络还是城市单一 ETC，在数据采集与分析方面均已有成熟技术应用。日常 ETC 收费数据将存入基础数据库，交通管理部门可随时检索查询并形成分析报告。\n\
  \n## 5.6.3 精准获取路段行程数据\n\n路段行程信息是指车辆在某路段的实际整体运行状态，包含行程时间、行驶速度等。这些数据对评价道路交通通行状况、分析车辆延误原因至关重要。特别是在高速公路大数据管理中，路段行程数据是最有效、最有意义的信息。然而，传统固定检测法只能获取某断面的交通流信息，无法精准提供路段整体行程数据。\n\
  \n\n\n###### 利用 ETC 系统进行交通数据分析\n\n利用 ETC 系统，我们可以规范车辆在入口与出口之间进出的时间数据，计算时间差，从而获取行程时间数据。通过查询道路行程，可以获得行驶速度和平均行驶速度数据。\n\
  \n利用这些数据，我们可以了解高速公路路况演变的特征，并有针对性地制定高速公路大数据交通管理政策。\n\n当然，在实际应用中，由于走 ETC 模式的高速公路车辆数量仅占高速公路总流量的一部分。因此，可以通过比例观测间接计算总流量。\n\
  \n## 5.6.4 尝试利用收费调节缓解交通拥堵\n\n2017 年，第二代 ETC 系统将开始进入实际应用。不同于第一代 ETC 系统，第二代系统具有更快的路车信息交互速度和更全面的数据采集能力。第一代系统每次数据采集仅\
  \ 100–200 字节左右，但升级为第二代后，数据量将激增，通信速度将达到数 K/s。\n\n利用该系统，除了常规的不停车收费功能外，数据采集还可用于支持通过收费手段调节城市拥堵。\n\
  \n例如，在高峰时段，当数据显示交通流接近饱和时，城市交通管理部门可下达指令提高通行费；当交通流被低估时，车辆可免费通行。\n\n利用 ETC 系统采集数据并构建大数据交通管理系统，仍需进一步探索和尝试。从交通管理部门内部结构的调整优化，到数据采集和使用渠道的优化，应当实现统一。只有实现统一使用和监管，ETC\
  \ 系统才能在更大范围内发挥更大作用。\n\n^[1] 引自于于红玲、梁亮、吴嘉茵《城市 T-Union 大数据应用系统建设》。内容有删改。\n\n^[2] 内容引自\
  \ 2016 年 1 月 22 日《长江日报》，记者付莎、通讯员柯璇。\n\n^[3] 由《经济日报》于 2017 年 5 月 24 日刊登，记者齐辉。\n\n\
  ### 第 6 章：大数据交通平台\n\n大数据交通系统的建设与发展离不开多平台对大数据的应用。从过去的单一管理模块，到即将到来的智慧交通平台，再到全面融入智慧城市综合管理系统……这都离不开大数据交通的连接与共享，以及对不同来源交通数据特征的理解与应用。\n\
  \n#### 6.1 高速公路管理平台\n\n目前，在高速公路交通管理中，大数据应用管理平台建设正在如火如荼地进行。通过整合高速公路相关部门现有的业务系统数据资源，我们可以建设网络化数据库，构建数据交换平台，建立数据丰富、技术先进、使用便捷的大数据应用管理平台。从而推动城域高速公路数据资源的统一处理、交换与共享，为全路网提供全方位的数据交换共享保障，为管理者和公众带来多元化的数据服务与支持。\n\
  \n2017 年 12 月 20 日，江西省首条智慧高速公路——宁都至定南高速公路建成试运营。沿线设有交通管控站，可实时监控交通流量。监控系统设置在重点路段的隧道和长陡坡，可精准监控安全运行状况。此外，该高速公路还应用了北斗卫星技术，集成了手机报警定位和路况预测功能，实现交通事故快速处置。\n\
  \n作为江西省首条智慧旅游公路，省道及焦万公路路面改造项目近期已完成。该公路配备了车辆弯道监测预警、路面结冰预警和自动融冰功能。^[1]\n\n随着高速公路建设的快速发展和路网规模的不断扩大，有必要进一步打破高速公路管理的壁垒。管理组织应站在全路网的视角，重视数据资源的利用，建设数据丰富、技术先进、使用便捷的数据管理平台，推动高速公路数据资源的统一处理、交换与共享。\n\
  \n##### 6.1.1 高速公路大数据管理需求定义\n\n只有需求明确，才能有明确的目标。建设高速公路大数据管理平台，其需求点主要集中在以下几个方面：\n\n\
  1. **信息共享目的。** 梳理高速公路交通信息中的基础性、通用性数据，形成统一共享标准，以支撑不同业务应用。\n2. **信息汇总目的。** 汇总高速公路交通管理中产生的业务数据，实现管理组织上下级业务管理的公开化、科学化。\n\
  3. **信息挖掘目的。** 利用大数据管理平台发现不同信息数据间的管理关联，从而实现数据的深度利用，提升管理系统的功能与效能。\n\n##### 6.1.2\
  \ 平台总体框架设计\n\n高速公路管理平台由四个部分组成：\n\n1. **基础设施层，包含两部分。** 一是支撑必要的基础设施，二是整合基础设施。包括可纳入管理平台的路段分中心设备、业务接口设备，以及连接设备的光纤或网络。\n\
  2. **数据资源层。** 该层利用云计算技术整合分布式物理资源，形成统一数据资源。通过分布式数据库，实现硬件资源与数据资源的整合。\n\n   该层数据资源分为三类：基础数据、业务数据和视频数据。前两类存储于数据库中，视频数据以文件形式存储。\n\
  3. **支撑平台层。** 该层覆盖支撑底层资源和上层应用的软件模块，包括应用管理平台软件、分发管理软件和业务流程软件。此外，还包括相关系统环境软件。\n4.\
  \ **应用层。** 该层面向最终用户，主要基于支撑平台层应用于具体管理业务。\n\n##### 6.1.3 系统数据流设计\n\n\n\n###### 高速公路管理平台数据流与事故检测平台\n\
  \n在整个高速公路管理平台中，系统数据流分为四个层级：数据源、数据处理、数据应用和数据呈现。经过这些层级后，一方面可以实现数字化信息资源的集成，形成一系列基础库和业务库；另一方面，对这些数据库进行分析挖掘，形成综合应用，并以不同方式呈现给用户。\n\
  \n##### 6.1.4 数据接口系统设计\n\n高速公路管理平台作为不同数据信息的集中展示平台，其核心作用需要通过接口系统来体现。接口系统应保证本平台与其他业务系统的顺畅连接，包括路政管理系统、收费系统、呼叫中心系统、ETC\
  \ 系统、设备检测系统、交通调度站交通检测系统、视频监控系统等。\n\n具体接口功能模块如下：\n\n1.  **组网数据外部接口** 主要方便第三方平台检索高速公路大数据管理平台的基础数据。\n\
  2.  **路政系统接口模块** 可通过区域高速公路综合路政管理平台获取区域高速公路的事故信息、施工信息和隐患信息。\n3.  **收费系统接口模块** 可获取总流量、ETC\
  \ 流量、客货分类、历年总流量等数据信息。\n4.  **设备监控系统接口模块** 主要从设备监控系统获取收费系统设备和交通调度站设备的工作状态。\n5.  **视频监控系统接口模块**\
  \ 主要获取全区域高速公路的监控视频。\n6.  **气象系统接口模块** 用于接收区域气象数据和信息。\n\n当然，高速公路数据管理平台仍存在许多问题。例如，系统建设各自为政，形成信息孤岛，信息资源不共享，旅行者无法获取交通信息等。无论是在数据采集还是数据分析应用方面，其数据处理和应用能力都有待提高。\n\
  \n有理由相信，在不久的将来，在多部门、多企业的共同努力下，跨部门协作、跨系统集成的局面将更加显著。随着高速公路管理平台运行质量的提升，大数据交通管理将为公众创造良好的出行体验。\n\
  \n#### 6.2 事故检测平台\n\n交通事故每天都在发生，这不仅威胁旅行者的生命财产安全，还会导致交通拥堵和路况恶化，进而引发更多交通事故。\n\n因此，有必要加强城市交通事故检测平台建设，它不仅能及时处理交通事故，还能更好地利用大数据技术，减少损失，避免拥堵，保障城市交通网络的顺畅运行。\n\
  \n杭州新城隧道建立了完善的事故检测平台系统。隧道内每 100 米设置一个监控摄像头，可实现全过程无缝监控。这些视频监控系统基于事故检测平台系统的扩展应用。因此，现场无需增加设备，只需从交通管理控制室\
  \ CCTV 监控系统的分配器引出一路视频信号，接入事故检测器。\n\n经事故检测器处理后，平台可及时向中央计算机系统提供相应的交通检测数据和事故报警信号。因此，平台可自动检测车辆停驶、交通拥堵、车辆逆行、超速、抛洒物、交通事故等各类交通事故事件。此外，平台还能在短时间内检测火灾和延误，为交通管理中心监控人员提供准确信息，以便采取有效措施处置紧急情况，避免更大损失。\n\
  \n交通事故检测平台是指利用多种设备协同运作收集高速公路上的事件数据。一旦发现数据信息，即意味着事故发生，平台将自动报警并确定事故地点。\n\n##### 6.2.1\
  \ 事故检测平台设计\n\n一个完整的自动交通事故检测平台应包含硬件和软件。硬件包括交通流检测器、通信设施和用于数据处理的中央计算机；软件包括数据采集、处理和事故检测的数据算法。\n\
  \n##### 6.2.2 事故检测平台运行模式\n\n目前，事故检测平台较为有效的运行模式如下：\n\n1.  **发现突变数据信息。** 发生交通事故后，平台获取的交通数据会出现突变，主要体现在交通流量、占有率和车速上。\n\
  \n    例如，因交通事故发生，可能导致道路通行能力急剧下降，形成交通瓶颈。通过实时检测路段交通流量的急剧减少，可计算出交通事故位置。\n\n    事故发生后，导致车辆缓行，使检测器占有率突然升高。此外，交通事故引发拥堵，导致相邻检测器检测到的车速突然降低。通过获取和分析上述数据，可判断路段异常交通状况，从而测算交通事故。\n\
  \n2.  **发现数据偏离正常值。** 检测平台获取的数据信息与该地点、该时段以往的历史信息偏差较大，也说明该时段、该地点路段发生了交通事故。\n\n   \
  \ 例如，检测器检测到的交通流量数据远小于历史平均值，说明检测器上游或下游可能发生交通事故。检测器检测到的占有率远大于以往历史数据，说明检测器下游发生交通事故。检测器检测到的车速远小于历史数据，说明检测器下游可能发生交通事故。\n\
  \n突变数据检测和数据偏离正常值检测是交通事故检测平台的重要运行模式。在平台实际运行中，仅凭一两种数据变化无法确定交通事故，需要结合不同种类的数据变化进行综合判断。\n\
  \n##### 6.2.3 交通事故定位\n\n仅凭路段检测器提供的数据无法确定交通事故位置。综合数据信息后，检测系统只能判断交通事故发生在某路段的上游或下游，但无法确定距离该路段的具体距离。\n\
  \n\n\n\n因此，事故监测平台需要整合高速公路相邻路段检测器获取的数据，以确定交通事故的具体位置。\n\n事实上，交通事故发生后，上游检测器和下游检测器采集的数据是不同的。利用这一特征，检测平台可按如下方式确定交通事故路段的位置：\n\
  \n(1) **上游检测器的数据。** 当交通事故发生时，事故发生地点路段的通行能力突然下降，形成交通瓶颈，这将导致事故发生地点上游出现交通拥堵。因此，检测器检测到的交通数据将呈现以下特征：车速降低、占有率增加、交通流量减少。通过利用这三个数据特征，交通事故监测平台可以判断交通事故位置位于该监测路段的下游。\n\
  \n(2) **下游检测器。** 当交通事故发生时，下游检测器检测到的交通数字信息变化与上游检测器检测到的不同。一般来说，下游检测器检测到的交通流数字信息变化具有以下三个特征：车速增加、占有率降低、交通流量减少。\n\
  \n车速的增加是由于检测器上游路段发生交通事故后，该路段通行能力下降，导致下游交通密度减少。因此，车速自然会显著增加。当车速增加时，下游检测路段获得的份额数或事故发生车道上的份额数将显著减少。同样，下游检测路段获得的交通流数据也将显著减少。\n\
  \n总之，通过充分利用数据功能，采集和检测交通数据信息，我们可以诊断道路交通状况，及时发现交通事故的时间和地点。\n\n#### 6.3 客流检测平台\n\n\
  交通运行的客流数据是交通规划、设计和运营管理的重要数据基础。利用客流检测平台对城市交通运行客流数据进行科学统计分析，可为交通运行评价提供依据，协助和支持管理部门及运营单位制定相应方案，同时也为公共交通规划设计提供数据支撑。\n\
  \n2017 年 4 月，重庆市交通行政执法总队发布消息，重庆首套综合交通执法闭环管理系统在重庆北站正式上线运行。该系统不仅能实时监测通过车辆数量，还能反映北站的运力需求。\n\
  \n系统新增的四个鹰眼全景摄像头可实现北广场地面监测 90%的覆盖。50 余个监控摄像头分别安装在北站一楼、旅客出口等处，以实现北站地下区域监测的全覆盖。通过监控视频，可了解现场实时情况。\n\
  \n该系统可实时反映通过车辆数量。鹰眼监控将清晰发现人群主要聚集地，特别是在春节、国庆等节假日客流高峰期。它能实时反映北站的运力需求，以便及时调配运力，保障旅客疏散。^(2)\n\
  \n客流监测平台的运行结果是交通运行和客流数据分析的重要依据。根据旅客和车辆进出某一区域的位置和时间数据，可分析客流的时空规律，反映实际客流需求。\n\n此外，交通运营管理者还需依靠客流监测平台，了解、分析和控制异常条件下交通客流的动态态势，例如特殊天气条件、节假日以及演唱会、体育赛事等大型活动下的客流变化规律。\n\
  \n让我们以地铁客流检测平台为例，演示其大数据的应用。\n\n##### 6.3.1 客流检测平台设计\n\n客流检测平台的功能是监测当前客流数量，获取准确的客流数据并进行分析，以实现对客流的动态和网络化管理控制，进而实现对客流的综合控制。只有当客流检测平台能够全面、科学地采集和利用大数据时，才能帮助交通管理部门人性化地疏导客流，从而有效应对大客流高峰，提高运营效率。\n\
  \n一个成熟的客流检测平台由四部分组成：\n\n(1) **客流监测模块。** 该模块实时获取各区域的客流数量和流向，将客流动态监测与各种监测技术相结合，以最大程度提高客流数据采集的准确性。\n\
  \n(2) **控制决策模型。** 根据客流检测模块获取的数据，生成不同的控制决策方案。该模型的建立取决于以最大化运营效率和乘客安全为目标的客流控制指标。\n\n\
  (3) **仿真模块。** 根据客流实时数据，计算客流疏散所需时间，以检验决策方案的有效性。经过多次仿真，获得最优决策方案并存储在检测平台中。\n\n(4) **辅助决策显示与信息发布软件模块。**\
  \ 向管理控制人员展示平台检测形成的结果和控制决策方案，并通过不同方式引导客流。\n\n##### 6.3.2 关键节点客流监测\n\n在地铁站等大型客运站，旅客的流动过程和路线被称为“流线”。以入口为例，从入口、安检设备到直接进站（或购买临时单程票），再到楼梯、扶梯和地铁车辆，均为典型的进站流线。出站客流则相反。\n\
  \n通过监测各节点、获取并分析数据，平台可计算车站内客流的动态分布。\n\n具体可划分为三个区域：非付费区、付费区和站台区域。在区域连接的关键节点，平台采用适应该位置客流特征的监测手段采集数据。\n\
  \n\n\n\n#### 6.4 交通执法平台\n\n近年来，随着信息技术的飞速发展，不同执法部门建立了各自的执法平台。然而，由于我国城市交通管理体制的行业分割以及部门职能重叠，这些执法平台仍存在相对的局限性。结合大数据交通管理模式的建设，统一交通执法平台刻不容缓。\n\
  \n事实上，在交通执法过程中，也需要与公安、交警等部门的信息实现互联互通。其中，交通、路政、运政执法需要辨别管理对象提供信息的真伪，这需要与公安、交警等部门的执法数据进行核查。同样，公安交警部门也拥有大量的交通视频信息。如果能有效接入统一执法平台，这些视频信息也可作为交通、路政、运政执法工作的有力佐证。\n\
  \n2016 年 4 月，上海市静安分局率先试点应用交通违法监测智能识别设备，形成了“系统智能采集、人工筛选甄别”相结合的交通违法查处新模式。随后，通过全市 16\
  \ 个区县的共同努力，该技术在上海推广应用。\n\n该系统主要由前端采集设备、后端识别、数据传输交换和数据接口四部分组件，集成了道路前端电子警察、公安卡口、高清探头等采集的图像监控信息。该平台利用大数据分析技术，对高清监控设备采集的交通违法视频数据进行智能识别分析，并按技术标准生成车辆违法数据。最后，经公安交警部门审核后对违法车辆进行处理，实现了交通违法的实时发现、实时预警处置。^(3)\n\
  \n在交通执法平台上，大数据技术的有效应用能及时发现执法对象的违法行为及地点，从而增强执法工作的针对性，提高执法效率。同时，执法人员的执法行为也能及时统计，减少随意执法行为，综合分析各项执法指标，提高执法工作的科学决策水平。\n\
  \n##### 6.4.1 交通执法平台数据云中心\n\n要建设交通执法平台，必须建立数据云中心。利用云中心技术整合路政、运政、出租汽车等交通行业的基础数据信息，包括人员信息、车辆信息、户籍信息等。此外，还包括执法业务系统信息、公路路口、客运站周边、货源集散地、检查站等重点区域的视频信息。同时，整合公安交警的相关视频信息和车辆信息，建设交通运输执法大数据云中心。\n\
  \n在云中心中，可充分利用大数据技术的海量存储、快速计算等特性，实现交通运输执法信息资源的互换、全共享和挖掘分析，以支撑不同的应用系统。\n\n##### 6.4.2\
  \ 交通综合执法协同系统\n\n在该平台上，集成了路政、运政、出租汽车、养护、驾培等审批执法业务系统，整合了交通运输管理、路政、出租汽车、养护、驾培等执法信息。通过各执法部门基础数据信息的共享与联通，实现了各部门执法办案的协同。\n\
  \n此外，平台还可利用大数据技术，对与交通运输执法案件相关的重点区域监控视频及车辆基础信息进行深度挖掘分析。例如，通过分析案件的区域分布、增长情况、高发地点、涉案车辆来源等违法行为，可获取数据背后的分布规律。通过监控区域视频，可获取更多高频、有规律的车辆数据，为执法人员精准执法提供支撑。通过分析某段时间内多次违法的车辆数据，应建立重点监管的执法制度。\n\
  \n##### 6.4.3 交通执法信息服务系统\n\n该系统可通过网站、大屏、微博、微信公众号、手机 APP 等多种手段进行宣传，公开交通执法案件相关信息。利用该系统，不同部门可查询案件信息和执法人员，也可实现公众网上投诉举报不规范执法行为，从而提高交通执法的信息公开透明度（参见图\
  \ 6.1）。\n\n\n\n\n\n###### 智能交通监控系统\n\n此外，通过该系统，我们可以主动推送和交换违法数据信息，并与出租车、公共交通及其他企业管理者共享，从而实现执法与企业管理的协同。\n\
  \n无论是交警、路政、运管还是出租车企业，在交通执法过程中，都需要与其他部门的数据进行交互。因此，利用大数据技术建立统一、全面的交通执法平台并整合业务数据刻不容缓。\n\
  \n![image](img/fig6.1.jpg)\n\n**图 6.1** 智能交通监控系统。\n\n*来源*：安全网，上海首个智能交通监控系统。\n\n\
  #### 6.5 物流信息平台\n\n随着移动互联网技术的不断完善和大数据时代的来临，社会生活和消费模式发生了巨大变化。利用现代大数据交通管理技术可以降低企业运营成本，提高企业生产运营效率。因此，物流信息平台必须与大数据信息技术有效结合，使物流管理的创新能力上升到一个更高的阶段。\n\
  \n京东商城自主研发的“青龙”大数据物流运营平台，前端可收集客户信息，后端对接公司物流部门及第三方物流公司。“青龙”平台利用深度神经网络、地图区域划分等大数据技术实现了自动分拣系统，以确保客户以最快速度收到货物。\n\
  \n阿里巴巴集团的菜鸟驿站也建立了类似的物流信息平台。在该平台上，通过运用大数据技术进行深入调研和规划，确定驿站的具体位置和数量。\n\n使用类似的大数据物流信息平台，既能保障物流服务提供商和用户的经济效益，也能让客户寄收货物更加便捷。\n\
  \n##### 6.5.1 利用大数据提升物流信息平台运营功能\n\n通过运用大数据技术，物流信息平台的管理控制系统发生了巨大变化。其中，最突出的创新是预警功能。\n\
  \n在物流运作过程中，物料的接收、存储、运输、配送、维护和管理都离不开物流信息的收集与处理。平台上运用大数据技术，能有效提高市场需求预测的准确性，还能对产品库存状态和运输状况进行预警。\n\
  \n例如，若某产品在仓库存放超过一段时间，大数据技术便能发挥作用，在物流信息平台上发出预警信号。这样，相关岗位员工便能及时处理。\n\n此外，引入大数据技术还能帮助企业和交通管理部门共享数据，实时关注运输车辆的运输状态。例如，一旦车辆遭遇交通事故或部件损坏，能及时发现，从而及时消除潜在安全隐患。\n\
  \n因此，利用大数据技术提升物流信息平台运营功能，能有效提高物流运作效率，改善物流带来的经济效益。\n\n##### 6.5.2 强化大数据信息利用能力\n\n\
  在大数据融合过程中，物流信息平台需要发掘和收集与物流业务相关的数据。包括客户对产品订单数量、产品库存、最佳运输路线、包装、配送等相关数据信息。\n\n其中，这些大数据信息的收集是实现物流信息平台高效运行的前提，数据信息必须科学、及时、完整。同时，大数据时代的数据不仅海量，而且不断变化。因此，物流信息平台不仅要通过增加传统信息存储设备数量，还要依靠网络存储系统、虚拟存储技术和虚拟数据存储系统来增加信息存储空间。\n\
  \n在计算和分析过程中，物流信息平台应利用一体机数据库、数据集市等商业大数据分析工具来实现。这样，数据和信息就能得到科学的处理和分析，确保其可作为可用的数据和信息资源。\n\
  \n##### 6.5.3 提高物流信息平台安全等级\n\n我们必须注意到，物流行业是黑客重点关注的行业之一，数据信息泄露显然会给物流企业和客户带来损失风险。因此，在大数据交通环境下，物流信息平台必须重视以下方面的数据信息保护：\n\
  \n1. 大数据信息的集中存储必然会增加被盗风险；\n2. 由于大数据海量存储的特性，内部必然存在大量无效数据，这可能导致产生恶意错误信息的风险；\n3. 大数据物流信息平台的数据信息来源广泛，因此有必要扩大安全防护范围。\n\
  \n针对上述问题，物流信息平台可提升安全防护体系技术，实现数据信息的有效筛选、分散存储和分类管理，更好地保障物流信息平台安全。\n\n在大数据交通环境下，物流信息平台的建立与建设还需进一步研究分析。我们不仅要充分找到大数据技术与传统物流管理的结合点，还要解决同类运营技能不完善、大数据利用不广泛、安全防护体系不健全等问题。\n\
  \n有理由相信，当物流信息平台充分利用大数据技术时，物流行业管理水平将实现新的飞跃。\n\n#### 6.6 应急指挥平台\n\n大数据交通时代的到来，给政府应急管理带来了多重意义。一方面，在交通应急指挥中，管理部门必须在平台上从不同来源的数据中去伪存真，并从多角度验证数据的全面性和可信度，这导致应急指挥平台收集和处理大数据的复杂性。另一方面，大数据的应用也为应急指挥平台的管理带来了良好前景。\n\
  \n\n\n\n\n##### 潍坊交通应急指挥中心\n\n2016 年 1 月 6 日，潍坊交通应急指挥中心正式投入使用。该应急指挥系统不仅实现了全市重点交通场所的视频整合，还整合了出租车信息调度管理系统和道路运输车辆动态管理系统，并实现了与公安机关的互联互通。该平台可用于监督车站安检是否正常，以及市民在出租车遗失物品寻找时是否需要调取车辆轨迹。^(4)\n\
  \n在应急指挥平台上，主管部门可通过卫星、传感器、视频监控、移动通信、射频识别设备、社交媒体等持续接收交通相关数据。通过这些数据的摄入、分析、分发和功能应用，可将其转化为有意义且有价值的危机管理信息。\n\
  \n因此，在危机情况下，交通主管部门可对大数据进行适当的管理、建模、共享和转换，从而以传统情况下难以想象的方式做出应急决策。\n\n##### 6.6.1 应急平台的大数据共享\n\
  \n在大数据时代，大数据信息的集成与共享已成为应急平台系统建设最基本的要求。管理部门应主动求变，打破原有的数据分离与封锁，实现信息公开。在此基础上，基于大数据技术的应急平台系统建设可提高不同政府机构和部门的效率。\n\
  \n至于应急平台系统建设，技术体系可基于大数据技术构建，包括有线通信、无线通信、移动指挥通信、移动互联网技术和大数据应用软件，这些技术具有有线通信调度、无线通信指挥、移动应急指挥和远程会商等不同功能。通过政府内网、外网和互联网，我们可以建设统一的交通突发公共事件应急管理信息平台。这样，交通管理部门联同公安、水务、地铁、电力、供热、燃气供应等企事业单位，可获取全面的城市运行监测数据，为科学的应急指挥决策提供重要支撑。\n\
  \n##### 6.6.2 云应急系统\n\n在大数据时代，云计算技术是不可或缺的 IT 基础设施。应急平台应基于云计算技术建立云应急系统，为应急部门提供智能化应急服务。\n\
  \n具体到交通应急信息平台，云应急系统应能采集现场感知数据、历史数据和实时交通应急的决策支持模型。这些数据通过标准化接口无缝集成，实现快速全面的挖掘提取，并在云应急平台上实现信息与数据的综合集成。根据不同的应急需求和各部门的服务性质，形成应急指挥协同网络。\n\
  \n##### 6.6.3 移动监测与应急响应的应用\n\n遇有自然灾害、交通事故或当地监测设备难以工作时，交通监测中心可依托应急指挥平台，快速了解现场情况，进行客观分析和抢险救治。\n\
  \n依托大数据技术，移动监测与应急响应的具体方案如下：\n\n(1) 移动平台快速机动至现场开展工作。包括开通卫星信道、将视频电话系统与远程应急指挥中心连接、实时将现场信息回传至检测中心。\n\
  \n(2) 利用网站、微博、微信、短信等互联网渠道及载体，及时发布应急路况、天气预警提醒和绕行建议。\n\n(3) 根据移动平台人员汇报，应急指挥平台人员调取事故周边可用监测设备，密切关注周边交通流变化，发现或接到相关异常情况后立即上报上级监管部门。\n\
  \n(4) 应急指挥平台人员接收各类现场数据后，应及时收集整理，研判未来发展趋势。通过数据共享，协调路政、交警、收费部门等相关部门，开展救援或交通疏导，做好流量平衡控制，以便在第一时间遏制所有潜在灾害事件。\n\
  \n应急指挥平台在改善大数据交通监管手段、提高应急响应效率、强化交通管理调度和促进各部门联动方面发挥着不可替代的作用。强化大数据运行，可提升应急指挥平台工作水平，进而提高交通管理部门的运行管理水平。\n\
