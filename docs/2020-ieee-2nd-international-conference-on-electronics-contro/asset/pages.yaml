    # II. COOPERATIVE SPECTRUM SENSING


    CR is a communication system in which multiple channels are used simultaneously,
    and can not come from one channel at a time, due to its ability to perform SU
    using different detection techniques, which guarantee an acceptable probability
    of interference with PU, due to SU. Cooperative Sensing (CSS) is proposed in the
    literature to solve the problem of hidden terminals in CR networks to reduce uncertainty,
    fading, and shadowing [13][13][14]. The detection by a single user can be merged
    with all CSS results to achieve one objective [15] by utilizing the spatial diversity
    of secondary users [16][17]CSS observations from several SUs to determine the
    presence or absence of frequency bands with minimized detection, and can give
    better performance than that by a single CR user.


