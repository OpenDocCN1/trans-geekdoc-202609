    +   - K-means


    K-means is the most common algorithm used in unsupervised ML to partition data
    into groups, which represents the clusters defined by the center. The first step
    in the k-means algorithm is to define K. The algorithm begins by selecting k clusters
    from the data set to set as the initial centers for the clusters. The clusters
    are also called centers. Then, the remaining objects are assigned to its current
    center, which is defined by the Euclidean distance between the object and center.
    After the allocation, the algorithm calculates the new value for each cluster.
    Now that the centers have been recalculated, the process is repeated until convergence.
    All objects are assigned with updated cluster means. For cluster assignment and
    clustering update are repeated until the groups are formed or as shown in the
    previous method.


    The clustering algorithm aims to minimize the squared distance of all the points
    from their centroids over all the clusters:


