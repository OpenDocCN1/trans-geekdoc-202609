    **Abstract—** Cognitive is an intelligent communication system learning from environment.
    It allows to reuse radio resources available by users Secondary Users without
    causing harmful interference with licensed users. Spectrum Sensing is important
    in Cognitive Radio technology. The application of Machine Learning for Spectrum
    Sensing is well documented in the literature. In this paper, we present an overview
    of Machine Learning techniques for Cooperative Spectrum Sensing using three (Naive
    Bayes, SVM and Multilayer Perceptron) with cooperative Sensing techniques (Maximum
    Ratio Combining and AWGN) on Rayleigh fading fading channel. The performance evaluated
    using ROC curve, demonstrates that MRC is the optimum technique for Machine Learning
    technique on Rayleigh.


    attractive in communication networks [1]. To reach the reaches of CR, it must
    go through three stages: the first consists of Spectrum Sensing (SS) that is the
    most important step in initiating CR. It consists of detecting the unused spectrum
    (or white spaces) to share without any interference with PUs. Spectrum Management
    is the function that allows US to decide, which frequency band meets its requirements
    through analysis, and Spectrum Mobility is a CR user changes its operating frequency
    by using the spectrum dynamically [9].


    **Keywords—** Learning, SVM, K-means, Naive Bayes, Cooperative Spectrum Sensing.


    Recently the CR has drawn wide attention in various applications such as Wireless
    Network and Internet of Things (IoT), as it can provide wideband services and
    stable operation in dynamic spectrum scenarios. The next generation of communication
    systems requires high data rates and low latency. From this perspective, CR need
    to find wide frequency bands of the spectrum to find the best available channels.


    # I. INTRODUCTION


    With the advent of Fifth Generation of Wireless Communications (5G), data transmission
    and communication devices are increasingly growing with number of mobile users.
    Frequency Communications (FC) face is the scarcity of spectral spectrum [1]. In
    addition, there are frequency bands underutilized. Cognitive Radio (CR) technology
    allows important role in meeting the increasing demand for wireless communication
    services. By utilizing the radio resources, CR radio systems can dynamically exploit
    the available channel and change the transmission parameters. The central idea
    of Cognitive Radio is to sense spectrum by unlicensed users (Secondary Users,
    US) to use the spectrum of licensed users (Primary User, PU) without advent to
    the deployment, but if they cannot interfere with PU communication and without
    degrading Quality of Service (QoS) [2]. The concept of Cognitive Radio was introduced
    in 1999 by Joseph Milda [3]. Milda works proposed to use the reconfiguration possibilities
    provided, by the software to transform static radio equipment into dynamic radio
    equipment capable of adapting its parameters such as modulation, transmission
    power and frequency of the bands [4]. Cognitive Radio technology draws the attention
    of the communications community and continues to be fruitful


    In this paper, we focus on CR and the many techniques used for SS in literature.
    The novel senses detects a status of PU, or free. It is called matching Feature
    detection [6], Energy Detection [7] and Cyclostationary Feature Detection [8].
    Energy Detection is a simple method as it does not require prior knowledge of
    the PU signal. The basic idea is to calculate the received signal, then compare
    it with a threshold. However, it is not robust to various factors coming from
    the signal and some noise [9]. Cyclostationary Feature Detection based on cyclestationary
    characteristics due to the periodicity of the signal and statistical measurement
    such as the average of the received signal over time and the autocorrelation function
    to distinguish between the signal and the noise signal [10]. Matching filters
    require perfect knowledge of the PU signal; bandwidth, order of pulse, carrier
    frequency, and phase shift to identify the identity of the PU signal [11]. The
    next generation of communication systems requires high data rates and In this
    regard CR SU must detect wide frequency bands of the radio spectrum to find the
    best available channels. SS is one of the challenges that face in designing next
    generation communication scenarios. Several techniques exists in the literature
    to perform wide spectrum sensing.'
