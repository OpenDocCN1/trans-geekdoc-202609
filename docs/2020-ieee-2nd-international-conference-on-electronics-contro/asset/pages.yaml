    # C. Cooperative spectrum sensing techniques


    +   Maximum Ratio Combining


    We assume a centralized CR network and one PU. The SU generate a local sensing
    energy x_{q,m}, in sensing time slot q, with received samples:


    ```

    x_{q,m} = \sum_{m=1}^M w_{m}|Y_{m}(n)|^2 (5)

    ```


    The Maximum Ratio technique estimates the channel by combining the weighted energy
    levels obtained at each SU and communicated with the FC.


    ```

    \hat{H} = \begin{cases} 1, & \sum_{m=1}^M w_{m}x_{q,m} \geq \lambda \ 0, & \text{otherwise}
    \end{cases} (6)

    ```


    Where w_{m} = \frac{\gamma_{m}}{\sum \gamma_{m}} is the SNR on the mth SU and
    \lambda is a constant used to reflect the desired false alarm probability of the
    estimator.


    +   AND rule


