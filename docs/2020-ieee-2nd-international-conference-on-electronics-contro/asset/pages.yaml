    Y^1), \dots, (X^Q, Y^Q)\}$, where $Y$ is label of energy vector $X^q$, representing
    channel availability.


    +   - Probability vector


    If the number of SUs is small, the distribution of $X_{q,m}$ can be approximated
    by a Gaussian distribution with mean $E(X_{q,m})$ and variance $\sigma^2_{q,m}$,
    then $X^q$ follows a Gaussian distribution with mean $\mu_q$ and covariance $\Sigma_q$
    [22]:


    ```

    $\mu_q = (E[X_{q,1}], E[X_{q,2}], \dots, E[X_{q,M}])$, $\Sigma_q = \text{diag}(\sigma^2_{q,1},
    \sigma^2_{q,2}, \dots, \sigma^2_{q,M})$ (11)

    ```


    Each $X^q$ are considered to be independent of each other and $Y$ is diagonal.
    The probability density function (PDF) of the energy vector $X^q$:


    ```

    $f(Y^q|X^q, \Sigma_q) = \frac{1}{\sqrt{(2\pi)^M|\Sigma_q|}} \exp(-\frac{1}{2}(Y^q-\mu_q)^T\Sigma_q^{-1}(Y^q-\mu_q))$

    ```


