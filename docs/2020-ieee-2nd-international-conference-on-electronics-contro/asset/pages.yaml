    # III. MACHINE LEARNING FOR SS


    # A. Motivation of ML techniques for SS


    SS provides knowledge of spectrum capacity, and by this knowledge, the CR should
    make intelligent decisions about actions relating to transmission and reception,
    and constantly improve these decisions by taking advantage of past experiences.
    Here, ML methods can be used for SS.


    $X^q = (X_{q,1}, X_{q,2}, \dots, X_{q,M})$ (9)

