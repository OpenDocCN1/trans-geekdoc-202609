    # V. CONCLUSION


    In this paper, we presented an overview of Machine Learning techniques for Cooperative
    Spectrum Sensing, and some studies that applied in this context. In addition,
    we compared ML techniques, SYM with Linear and Gaussian kernels, a feed-forward
    Neural Network with traditional techniques. AND rule and MRC for case of AWGN
    channel and for Rayleigh channel, channel status ensured revealed on ROC curve.
    We concluded that all ML models performed closely to the MRC under AWGN channels.
    Under Rayleigh fading channel, all ML techniques, outperformed the variation in
    SNR levels of secondary users during their sensing period and SYM with Gaussian
    kernel is the optimum ML technique.


