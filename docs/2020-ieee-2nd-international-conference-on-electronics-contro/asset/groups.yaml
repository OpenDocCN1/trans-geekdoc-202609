    图 6 CNN 架构 [4]。\n\n![](img/047efcf749577c595cbb945f3d5fdd9f_5_1.png)\n\n在文献 [44]\
    \ 中提出了基于 CNN 的协作感知，它提高了感知性能并降低了复杂度。作者发现，当样本数较少时，该方法的检测是准确的。文献 [44] CNN 用于低信号模式下的\
    \ PU 感知，模型通过平稳特征进行训练。\n\n- 循环神经网络。循环神经网络（RNN）是一种常用于信号识别和自然语言处理的人工神经网络。RNN 设计用于识别数据特征并预测序列中的下一项。长短期记忆（LSTM）块是\
    \ RNN 结构的一部分。RNN 设计用于某些类型的人工记忆，可以帮助人工智能。在文献 [47] 中，循环 CNN 用于提高 CSS 的分类性能。该方法用于减少进入\
    \ LSTM 层的数据。\n\n![](img/047efcf749577c595cbb945f3d5fdd9f_5_2.png)\n(a)。\n\n# IV.\
    \ 结果与讨论\n\n该应用关注在蒙特卡洛方法下 AWGN 和瑞利衰落信道下的集中化 CSS。\n\n# B. 瑞利信道下的 CSS 性能\n\n另一方面，考虑到瑞利衰落，机器学习技术能够获得比\
    \ MRC 更好的性能，如图8所示。图9显示了上述每种机器学习技术取决于训练数据大小的检测概率变化，我们清楚地看到检测概率在500之后开始提高。\n\n#\
    \ V. 结论\n\n在本文中，我们介绍了协作频谱感知的机器学习技术概述以及在该背景下应用的一些研究。此外，我们对比了 AWGN 信道和瑞利信道下具有线性和高斯核的\
    \ SYM 与传统技术的前馈神经网络，通道状态在 ROC 曲线上显示。我们得出结论：在 AWGN 信道下，所有机器学习模型的性能与 MRC 接近。在瑞利衰落信道下，所有机器学习技术都优于辅助用户在感知期间的\
    \ SNR 水平变化，高斯核 SYM 是优的机器学习技术。\n\n![](img/047efcf749577c595cbb945f3d5fdd9f_6_0.png)\n\
    (a)\n\n![](img/047efcf749577c595cbb945f3d5fdd9f_6_1.png)\n(b)\n\n# \n\n- [1] Shekhar\
    \ Gupta M., Kumar K., Cognitive无线网络频谱感知进展：调查、分类和融合问题。Journal of Network and Computer\
    \ Applications 143 (2017) 47-76.\n- [2] D. T, A. Benjamin, Darley W., 认知无线网络兴趣感知共享/分配综述。Internet\
    \ of Electronic Informatics, 2019; doi:10.1016/j.futureie.2019.02223\n"
