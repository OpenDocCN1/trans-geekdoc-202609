    **摘要—** 认知无线电是一种从环境中学习的智能通信系统。它允许辅助用户（Secondary Users）复用可用无线资源，而不会对授权用户（Licensed
    Users）造成有害干扰。频谱感知在认知无线电技术中至关重要。机器学习应用于频谱感知的文献已有大量记载。在本文中，我们介绍了三种机器学习技术（朴素贝叶斯、SVM
    和多层感知器）结合协作感知技术（最大比合并和加加斯白噪声）在瑞利衰落道上协作频谱感知的概述。使用 ROC 曲线评估的性能表明，MRC 是瑞利衰落道上机器学习的最优技术。


    认知无线电在通信网络中极具吸引力 [1]。要实现认知无线电的功能，必须经过三个阶段：第一阶段是频谱感知（SS），这是启动认知无线电最重要的步骤。它包括检测未使用的频谱（或白空间）以便在不与主用户（PU）产生干扰的情况下进行共享。频谱管理允许辅助用户通过分析决定哪些频段满足其需求，频谱移动允许认知无线电用户通过动态使用频谱来其工作频率
    [9]。


    **关键词—** 学习、SVM、K-means、朴素贝叶斯、协作频谱感知。


    最近，认知无线电在无线网络和物联网（IoT）等各种应用中受到了广泛关注，因为它能够在动态频谱场景中提供宽带服务和稳定运行。下一代通信系统需要高数据速率和低延迟。从这个角度来看，认知无线电需要寻找宽频频谱以找到最佳可用通道。


    # I. 引言


    随着第五代无线通信（5G）的到来，随着移动用户的数量增加，数据传输和通信设备正日益增长。频率通信（FC）面临频谱资源的稀缺问题 [1]。此外，还有一些频段未被充分利用。认知无线电（CR）技术在满足无线通信服务日益增长的需求方面发挥着重要作用。通过利用无线资源，认知无线电系统可以动态利用可用通道并改变传输参数。认知无线电的核心思想是由无授权用户（辅助用户，US）感知频谱，以使用授权用户（主用户，PU）的频谱，而不对部署产生不利影响，前提是它们不能干扰
    PU 通信且不降低服务质量（QoS）[2]。认知无线电的概念由 Joseph Mitola 在 1999 年提出 [3]。Mitilden 提出的工作建议使用软件提供的重构可能性，将静态无线电设备转换为动态无线电设备，该设备能够自适应其参数（如调制、传输功率和频段频率）[4]。认知无线电技术引起了通信界的关注，并持续取得丰硕成果。


    在本文中，我们关注认知无线电以及文献中用于频谱感知的许多技术。新型感知检测 PU 的状态（是否存在空闲）。这被称为匹配特征检测 [6]、能量检测 [7] 和循环平稳性特征检测
    [8]。能量检测是一种简单的方法，因为它不需要 PU 信号的先验知识。基本思想是计算接收信号，然后将其与阈值进行比较。然而，它对来自信号和噪声的各种因素并不鲁棒
    [9]。基于循环平稳性的特征检测利用信号周期性的循环平稳特性以及统计测量（如接收信号的时间平均值和自相关函数）来区分信号和噪声信号 [10]。匹配滤波器需要完美了解
    PU 信号；带宽、脉冲顺序、载波频率和相位偏移，以识别 PU 信号的身份 [11]。下一代通信系统需要高数据速率，在这方面，CR SU 必须检测宽频频谱以找到最佳可用通道。频谱感知是设计下一代通信场景面临的挑战之一。文献中存在多种执行宽谱感知的技术。


    在 [], 作者将宽带感知技术分为两类：奈奎斯特宽带感知和亚感知，并比较了每类的优缺点。


    机器学习（ML）由于能够应用复杂的数学计算来在学习和决策中分析、解释模型和数据结构，其兴趣日益增加并应用于许多领域。在认知无线电网络中，已经发表了关于用于频谱感知的机器学习的相关研究。通过将过程公式化为监督或无监督分类器来检测频率可用性，必须在每个频率的两种状态（空闲或繁忙）之间选择。然后提取数据（如能量统计向量或概率向量），以构建输入以训练分类器并确定认知无线电的可用性。


    本文的其余部分组织如下：第二节描述了协作感知的系统模型和结构。第三节讨论了用于频谱感知的机器学习技术，第四节为仿真和结果，第五节总结全文。


    # II. 协作频谱感知


    认知无线电是一种同时使用多个通道的通信系统，不能一次来自单一通道，因为它能够使用不同的检测技术执行 SU，这保证了与 PU 干扰的概率在接受范围内。协作感知（CSS）被用于解决认知无线电网络中的隐藏终端问题，减少不确定性、衰落和阴影
    [13][13]。


    ## B. 系统模型和结构


    第 m 个 SU 的主信号本地模型可以描述为统计模型：


    $H_0 : Y_{m}(n) = h_{m}(n) + n_{m}(n) \quad$ (PU 不存在)


    $H_1 : Y_{m}(n) = h_{m}(n) + n_{m}(n) \quad$ (PU 存在)


    $H_0, H_1$ 表示 PU 的不存在和存在。对于 $Y_{m}(m=1,2)$，$n_{m}(n)$ 是均值为 0、方差为 $\sigma^2$ 的高斯白噪声，表示
    SU，$h$ 代表感知增益，表示检测时间。


    $P_{fa} = p(H_d|H_0) \quad$ (虚报概率) (3)


    $P_d = p(H_d|H_1) \quad$ (检测概率) (4)


    ## C. 协作感知技术


    ### 最大比合并


    我们假设一个中心化的认知无线电网络和一个 PU。SU 在感知时隙 q 中产生本地感知能量 $x_{q,m}$，接收样本为：


    $x_{q,m} = \sum_{m=1}^M w_{m}|Y_{m}(n)|^2 \quad (5)$


    最大比技术通过合并在每个 SU 获取并与融合中心（FC）通信的加权能量级来估计通道。


    $\hat{H} = \begin{cases} 1, & \sum_{m=1}^M w_{m}x_{q,m} \geq \lambda \\ 0, & \text{否则}
    \end{cases} \quad (6)$


    其中 $w_{m} = \frac{\gamma_{m}}{\sum \gamma_{m}}$ 是第 m 个 SU 的 SNR，$\lambda$ 是反映估计器期望虚报概率的常数。


    ### 与门规则


    ![](img/047efcf749577c595cbb945f3d5fdd9f_1_0.png)


    ## A. 协作感知架构


    协作感知架构分为两种方法：中心化方法和分布式方法。


    - 中心化方法：每个 SU 自行检测并发送到中心实体或融合中心（FC），FC 所有 SU 的检测结果。FC 本地感知报告分为软软 [48] 和硬合并 [19]。


