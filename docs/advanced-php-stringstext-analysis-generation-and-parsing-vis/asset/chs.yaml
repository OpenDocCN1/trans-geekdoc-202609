  \  \\╕┘  \\ ╙╦ ⁿ:`` ─\n 'r⌐⌐ L `\"                ,g▓▓█▓\n```\n\n\n\n\n假设我们必须开发一种紧凑的两个组间发送消息的方法，既能减少发送的数据总量，又不会丢失任何信息。假设我们只需要关注单词，而不关注数字或特殊字符。我们可以分析双方之前的通信内容，找到频繁出现的词汇和短语，并将它们表示为数字或符号。当我们想要发送新消息时，会将这些词汇和短语替换为相应的数字或符号。当消息接收者读取消息时，他们会查阅数字符号表并反转该过程以获取原始消息。我们开发出了一种编码方案：一种表示和解释数据的方法。\n\
  \n当我们回顾计算机系统中文本数据和字符编码的历史时，ASCII 这个名字很快出现了。它是“美国信息交换标准代码”（American Standard Code\
  \ for Information Interchange）的缩写，其根源是贝尔实验室开发的电报码。\n\n在计算早期，每家公司或组织生产计算机系统时都会经历同样的练习，创建一种存储文本的唯一方法：创建一个唯一的字符编码系统。这些系统很少具有兼容性，在当时美国标准协会的支持和指导下，许多团体在\
  \ 20 世纪 90 年代中期开始工作，以产生一种标准的文本编码方式。\n\n这项工作的大部分直到 1968 年 3 月 11 日才被广泛采用，当时美国总统利林登·B·约翰逊强制要求\
  \ ASCII 成为美国联邦标准。除了将 ASCII 提升为联邦标准外，总统还规定从 1969 年 7 月 1 日起美国政府购买的所有计算机和相关设备必须兼容\
  \ ASCII。从这些标准开发的早期阶段（尽管在随后的几年里对其进行了多次修订）快进到 1981 年，当时 IBM 使用它对他们的第一台个人电脑进行文本编码。\n\
  \n我们将跳过很多更多历史和细微差别，但我们有足够的背景来继续。现在让我们努力理解，这一切与我们在尝试计算一段繁体中文文本字符数时，`strlen` 函数产生错误结果有什么关系。首先要知道的事实是，ASCII\
  \ 最初被设计为 7 位标准，为 128 个字符提供了编码。这种方法的好处是，每个字符都可以通过计算机中的单个字节（byte）轻松表示。换句话说，每个字符都映射到\
  \ 0 到 255 之间的整数，这是我们用单个字节可以表示的最大值。\n\n如果我们使用以下代码将英文字符串转换为字节数组：\n\n图 1.5\n\n```\n\
  1 <?php\n2 \n3 $bytes = unpack('C*', 'Hello wilderness');\n```\n\n我们将得到下面的整数数组：\n\
  \n图 1.6 \n\n```\n 1 array:16 [\n 2      1 => 72\n 3      2 => 101\n 4      3 =>\
  \ 108\n 5      4 => 108\n 6      5 => 111\n 7      6 => 32\n 8      7 => 119\n 9\
  \      8 => 105\n10      9 => 108\n11     10 => 100\n12     11 => 101\n13     12\
  \ => 114\n14     13 => 110\n15     14 => 101\n16     15 => 115\n17     16 => 115\n\
  18 ]\n```\n\n如果我们查找这些值的 ASCII 表，我们就会发现这些数字对应于原始字符串中的每个字符。现在让我们来看看以下操作的结果：\n\n图 1.7\n\
  \n```\n1 <?php\n2 \n3 $bytes = unpack('C*', '你好野');\n```\n\n产生结果：\n\n图 1.8\n\n```\n\
  \ 1 array:12 [\n 2      1 => 228\n 3      2 => 189\n 4      3 => 160\n 5      4\
  \ => 229\n 6      5 => 165\n 7      6 => 189\n 8      7 => 232\n 9      8 => 141\n\
  10      9 => 146\n11     10 => 233\n12     11 => 135\n13     12 => 142\n14 ]\n```\n\
  \n如果你注意到了，我们的繁体中文字符串是一个包含十二个不同值的字节数组，这引出了我们的下一部分内容：`strlen` 函数计算的是字节数。\n\n对于 ASCII\
  \ 中的英文字符，计算字节数等同于计算字符数：所有英文字符都可以由单个字节表示。那么这对于繁体中文文本又是是如何工作的呢？让我们从分解每个字符开始，检查字节数组产生了什么：\n\
  \n图 1.9\n\n```\n1 // unpack('C*', '你');\n2 array:3 [\n3     1 => 228\n4     2 =>\
  \ 189\n5     3 => 160\n6 ]\n7 \n8 // unpack('C*', '好');\n9 array:3 [\n10     1 =>\
  \ 229\n11     2 => 165\n12     3 => 189\n13 ]\n14 \n15 // unpack('C*', '荒');\n16\
  \ array:3 [\n17     1 => 232\n18     2 => 141\n19     3 => 146\n20 ]\n21 \n22 //\
  \ unpack('C*', '野');\n23 array:3 [\n24     1 => 233\n25     2 => 135\n26     3 =>\
  \ 142\n27 ]\n```\n\n正如你所看到的，每个字符都由多个字节组成，这就是为什么在 PHP 多字节字符串函数中会有“multibyte”（多字节）这个名称。多字节字符串函数之一是\
  \ `mb_strlen` 函数，它是 `strlen` 函数的多字节版本。在我们的繁体中文文本上使用此函数返回值四，这与我们视觉看到的一致：\n\n图 1.10\n\
  \n```\n1 <?php\n2 \n3 // Returns 4\n4 mb_strlen('你好荒野');\n```\n\n## 1.2 Unicode\
  \ 和 UTF-8\n\n在上一节中，我们查看了导致 `strlen` 函数产生奇怪结果的底层字节。我们还讨论了一些关于通用字符编码的历史，但仍有一个问题我们没有回答：当我们将字符串转换为字节数组时，使用的是什么字符编码？当我们查看这些字节数组时，我们可以看到这些字符的表示。然而，如果不知道字符编码，所有这些值都是没有的，因为我们不知道如何解释它们。我们在这里能出的简短答案是：“嗯，它是\
  \ Unicode”，但这只能带我们走远。\n\nUnicode 和 ASCII 一样，是一种字符集，提供了字符到整数的映射（Unicode 将这些关联称为代码点/code\
  \ points）。然而，与 ASCII 不同的是， Unicode 没有规定这些值如何被存储或传输（记住，在 ASCII 中，字符被映射并持久化为单个字节）。\n\
  \n让我们再次看看我们的繁体中文文本，但使用 Unicode 代码点：\n\n表 1.1 Unicode 代码点示例\n\n| 字符 | 代码点 | 属性 |\n\
  | --- | --- | --- |\n| 你 | U+4F60 | CJK Unified Ideograph-4F60 |\n| 好 | U+597D |\
  \ CJK Unified Ideograph-597D |\n| 荒 | U+8352 | CJK Unified Ideograph-8352 |\n| 野\
  \ | U+91CE | CJK Unified Ideograph-91CE |\n\n我们可以通过参考代码点来识别 Unicode 集中的这四个字符。\n\n\
  \n\n\n作为开发者，我们最常在 Web 应用程序、网站或其他连接互联网的应用程序环境中遇到 UTF-8。通过 UTF-8，我们可以使用一个、二、三个或四个\
  \ 8 位字节来对 Unicode 进行编码。\n\n为了探索这一点，让我们用“你”这个字来玩玩。首先，我们将取码点的十六进制部分，并使用 PHP 的 `hexdec`\
  \ 函数将其转换为十进制数字：\n\n图 1.12 \n\n```\n1 <?php\n2 \n3 // Returns 20320\nhexdec('4F60');\n\
  ```\n\n将十六进制部分转换为十进制得到结果 20320。如果我们查 1 字符“你”的 HTML 编码，会发现它是：\n\n```图 1.13 \n\n```\n\
  1 &#20320;\n```\n\n注意看这个字符的 HTML 版本和十进制版本几乎是一样的吗？非常有趣！我们现在将更进一步，尝试将我们的十进制数字转换为二进制，并最终得到我们在上一个节中看到的相同整数数组。\n\
  \n我们将使用 PHP 的 `decbin` 函数开始这个过程，将我们的十进制数字转换为二进制。这样做返回的二进制值为 `100111101100000`：\n\
  \n图 1.14 \n\n```\n1 <?php\n2 \n3 // Returns \"100111101100000\":\ndecbin(20320);\n\
  ```\n\n为了使用 UTF-8 编码此值，我们必须查看数值编码的规则。\n\n我们将查看的规则参考自 `RFC 3629`，该规范提供了数字范围及其 8 位字节（或称为字节\
  \ octet）的序列“模板”。\n\nOctet（字节）是那种初看可能令人敬畏的词之一：它感觉很复杂且高级。实际上，它通常指的是一组八个东西。在我们这里，它指的是一个恰好是\
  \ 8 位的字节：八个 1 或 0。大多数现代开发者只遇到过 8 位长度的字节，但在历史上并非一直如此。我们不需要追溯得远于关于 ASCII 的讨论，ASCII\
  \ 将字符存储在 7 位字节中。\n\n使用 UTF-8，我们将在字节序列中编码字符：即由一个、二、三个或四个字节组成的系列。要用 UTF-8 编码字符，我们需要知道它的数值或\
  \ Unicode 码点。该数字在字节中的大小将决定我们使用哪种 UTF-8 字节序列。下表列出了数值范围和要使用的字节模板：\n\n表 1.2 UTF-8 字节序列范围\n\
  \n| 十进制范围 | 十六进制范围 | 字节序列 |\n| --- | --- | --- |\n| 0 - 127 | 0000 0000 - 0000 007F\
  \ | 0xxxxxxx |\n| --- | --- | --- |\n| 128 - 2,047 | 0000 0080 - 0000 07FF | 110xxxxx\
  \ 10xxxxxx |\n| 2,048 - 65,535 | 0000 0800 - 0000 FFFF | 110xxxx 10xxxxxx |\n| 65,536\
  \ - 1,114,111 | 0001 0000 - 0010 FFFF | 1111xxx 10xxxxxx 10xxxxxx |\n\n我们将使用十进制值进行比较，但大多数实现会使用十六进制值。之前我们发现“你”字符的十进制值为\
  \ 20320。查看我们的表格，可以看到我们需要使用以下字节模板：\n\n图 1.15 \n\n```\n1 1110xxxx 10xxxxxx\n```\n\n\
  现在有了模板，我们还需要字符的二进制数据。之前得到的 `100111101100000` 正是我们这一步需要的。我们需要将模板中的 `x` 替换为二进制数据。我们从模板的右侧开始，用二进制数据替换最后一位。之后，继续向左移动直到数据用完。完成后，我们将得到如下结果：\n\
  \n图 1.16 \n\n```\n1 1110x100 10111000\n```\n\n如你所见，结果中还剩下一个 `x`。每当我们有剩余占位符时，只需将其替换为\
  \ 0，即可得到图 1.17 中我们替换序列中的位：\n\n图 1.17 \n\n```\n1 11100100 10111000\n```\n\n![Figure\
  \ 1.18 UTF-8 Values](img/diagram-16623048.png)\n\n图 1.18 UTF-8 值\n\n如果我们查询“你”的 UTF-8\
  \ 二进制值，会发现它与产生的值相匹配。在本章开头，我们查看如何使用 `unpack` 函数获取字符的组成值。复习一下，该函数处理“你”的结果：\n\n图 1.19\
  \ \n\n```\n1 // unpack('C*', '你');\n2 array: [\n3     1 => 228\n4     2 => 189\n\
  5     3 => 160\n6 ]\n```\n\n现在我们可以使用 PHP 的 `decbin` 函数将我们手动得到的二进制值转换为十进制值：\n\n图\
  \ 1.20 \n\n```\n1 <?php\n2 \n3 // Returns 228\ndecbin('11100100');\n4 \n5 // Returns\
  \ 189\ndecbin('10111101');\n6 \n7 // Returns 160\ndecbin('1010000');\n```\n\n###\
  \ 1.3 实现大写和小写函数\n\n如前所述，UTF-8 的优势之一是保留了 ASCII 值及其相对位置。我们可以通过重新实现大写和小写函数来更深入地探索字符串。为了保持简单，我们将只关注\
  \ ASCII 字符范围。\n\n表 1.3 ASCII 字母字符\n\n| ASCII 码 | 符号 | ASCII 码 | 符号 |\n| --- | ---\
  \ | --- | --- |\n| 65 | A | 97 | a |\n| 66 | B | 98 | b |\n| 67 | C | 99 | c |\n\
  | 68 | D | 100 | d |\n| 69 | E | 101 | e |\n| 70 | F | 102 | f |\n| 71 | G | 103\
  \ | g |\n| 72 | H | 104 | h |\n| 73 | I | 105 | i |\n| … | … | … | … |\n| 87 | W\
  \ | 119 | w |\n| 88 | X | 120 | x |\n| 89 | Y | 121 | y |\n| 90 | Z | 122 | z |\n\
  \n从表中，我们可以注意到 ASCII 字符一个有趣的模式：所有小写字符的十进制值都比其大写变体大 32。这种 ASCII 码分布意味着如果我们如果我们将所有大写字母转换为小写，我们需要在其值上加上\
  \ 32。\n\n图 1.21 uppercaseString 实现 \n\n```\n1 <?php\n2 \n3 function uppercaseString($input)\
  \ {\n4     $newString = '';\n5 \n6     for ($i = 0; $i < strlen($input); $i++) {\n\
  7       $firstByte = ord($input[$i]);\n8 \n9       if ($firstByte >= 97 && $firstByte\
  \ <= 122) {\n10         $newString .= chr($firstByte - 32);\n11      } else {\n\
  12         $newString .= chr($firstByte);\n13      }\n14     }\n15 \n16     return\
  \ $newString;\n17 }\n```\n\n图 1.22 lowercaseString 实现 \n\n```\n1 <?php\n2 \n3 function\
  \ lowercaseString($input) {\n4     $newString = '';\n5 \n6     for ($i = 0; $i <\
  \ strlen($input); $i++) {\n7       $firstByte = ord($input[$i]);\n8 \n9       if\
  \ ($firstByte >= 65 && $firstByte <= 90) {\n10         $newString .= chr($firstByte\
  \ + 32);\n11      } else {\n12         $newString .= chr($firstByte);\n13      }\n\
  14     }\n15 \n16     return $newString;\n17 }\n```\n\n我们的两个函数可以这样使用：\n\n图 1.23\
  \ \n\n```\n1 <?php\n2 \n3 // Returns \"HELLO, WORLD!\"\nuppercaseString('hello,\
  \ world!');\n5 \n6 // Returns \"hello, there!\"\nlowercaseString('HELLO, there!');\n\
  ```\n\n\n\n\n\n```php\n<?php\nfunction swapCase($input) {  \n    $newString = '';\n\
  \n    for ($i = 0; $i < strlen($input); $i++) {\n      $firstByte = ord($input[$i]);\n\
  \n      if ($firstByte >= 65 && $firstByte <= 90 ||\n          $firstByte >= 97\
  \ && $firstByte <= 122) {\n        $newString .= chr($firstByte ^ 32);\n      }\
  \ else {\n        $newString .= chr($firstByte);\n      }\n    }\n\n    return $newString;\n\
  }\n```\n\n我们的 `swapCase` 函数在给定示例输入的情况下将返回以下结果：\n\n图 1.25 \n\n```php\n<?php\n// Returns\
  \ \"hElLo, WoRlD!\"\nswapCase('HeLlO, wOrLd!');\n\n// Returns \"hellO, wOrld!\"\n\
  swapCase('HELLo, WoRLD!');\n```\n\n我们的简单实现也使用循环来遍历字符串的字符。由于 ASCII 是每个字符一个字节，这是完全没有问题的。然而，正如你可能猜到的那样，一旦我们进入多字节字符领域，情况就会变得更具挑战性。\n\
  \n### 1.4 遍历多字节字符串\n\n在上一节中，我们实现了几个通过遍历字符串字符来工作的字符串函数。在处理 ASCII 时，将每个字节视为单个字符是可以的，但一旦我们需要处理多字节字符，事情就会变得复杂一些。例如，如果我们尝试使用以下代码来遍历“這可以”：\n\
  \n图 1.26 \n\n```php\n<?php\n$string = '這可以';\n\n$output = '';\n\nfor ($i = 0; $i\
  \ < strlen($string); $i++) {\n    $output .= $i . ': '. $string[$i];\n}\n```\n\n\
  我们的输出字符串将是损坏的：\n\n图 1.27 \n\n```\n0: Ú1: Ç2: Ö3: Õ4: Å5: »6: õ7: ╗8: Ñ\n```\n\n\
  我们可以尝试通过将 `strlen` 调用替换为 `mb_strlen` 来修复这个问题：\n\n图 1.28 \n\n```php\n<?php\n$string\
  \ = '這可以';\n\n$output = '';\n\n$i = 0; $i < mb_strlen($string); $i++) {\n    $output\
  \ .= $i . ': '. $string[$i];\n}\n```\n\n然而，这一次我们将会收到以下输出，它看起来也不正确：\n\n图 1.29 \n\n\
  ```\n0: é1: €2: ™\n```\n\n解决此问题的快速方法是使用 `mb_str_split` 函数将我们的输入字符串拆分为字符数组并对数组进行遍历：\n\
  \n图 1.30 \n\n```php\n<?php\n$output = '';\n\n$chars = mb_str_split($string);\n\n\
  for ($i = 0; $i < count($chars); $i++) {\n    $output .= $i . ': '. $chars[$i];\n\
  }\n```\n\n产生的结果如下：\n\n图 1.31 \n\n```\n0: 這 1: 可 2: 以\n```\n\n然而，随着输入规模的增大，这种方法会导致大量的内存消耗。根据用例的不同，这可能是可以接受的。其他应用程序（例如在每次请求时解析任意用户输入的程序）可能无法承受如此高的内存消耗，特别是当解析函数在多个并发请求中被多次调用时。\n\
  \n在直接深入遍历多字节字符串之前，我们将先做一个一个小跳转，看看如果我们自己为 UTF-8 字符串实现 `mb_strlen` 函数会是什么样。\n\n在关于\
  \ Unicode 和 UTF-8 的讨论中，我们看到一张表格，列出了不同的值范围及其用于编码 UTF-8 字符串的字节序列。在实现各种函数时，我们还遇到了 `ord`\
  \ 函数，它返回字符串的第一个字节作为 0 到 255 之间的值。这两条信息在我们实现长度函数时将变得非常有用。\n\n作为实现长度函数的第一步，让我们再次查看\
  \ UTF-8 字节序列表，但这次让我们弄清楚第一个字节的最大可能是多少：\n\n表 1.4 UTF-8 字节序列第一个字节最大值\n\n| 序列 | 最大 (二进制)\
  \ | 最大 (十进制) | 字节长度 |\n| --- | --- | --- | --- |\n| 0xxxxxxx | 01111111 | 127 |\
  \ 1 |\n| 110xxxxx 10xxxxxx | 11011111 | 223 | 2 |\n| 1110xxxx 10xxxxxx 10xxxxxx\
  \ | 11101111 | 239 | 3 |\n| 11110xxx 10xxxxxx 10xxxxxx 10xxxxxx | 11110111 | 247\
  \ | 4 |\n\n我们知道可以使用 `strlen` 来获取字节数。例如，对“A”执行 `ord` 将返回 65，这意味着它落在范围内。考虑到所有信息，我们可以这样实现我们的长度函数：\n\
  \n```php\n<?php\nfunction utf8_strlen($input) {\n  $charCount = 0;\n\n  for ($i\
  \ = 0; $i < strlen($input); $i++) {\n    $byte = ord($input[$i]);\n\n    if ($byte\
  \ <= 127) {\n      $charCount++;\n    } else if ($byte <= 223) {\n      $charCount\
  \ += 2;\n    } else if ($byte <= 239) {\n      $charCount += 3;\n    } else {\n\
  \      $charCount += 4;\n    }\n  }\n\n  return $charCount;\n}\n```\n\n我们可以将 `utf8_strlen`\
  \ 的输出与 `strlen` 进行比较：\n\n```php\n<?php\necho utf8_strlen('A'); // Returns 1\necho\
  \ utf8_strlen('€'); // Returns 2\necho utf8_strlen('中'); // Returns 3\necho utf8_strlen('�');\
  \ // Returns 4\n```\n\n我们注意到 `strlen` 返回的是字节数，而 `utf8_strlen` 返回的是字符数。为了获取字符数，我们需要使用以下方法遍历字符串：\n\
  \n```php\n<?php\n$iterator = '這可以-this is!';\n\nforeach ($iterator as $char) {\n\
  \    echo $char.\"\\n\";\n}\n```\n\n完成完成后，上述代码将产生以下结果：\n\n图 1.35 \n\n```\n這\n可\n\
  以\n-\nt\nh\ni\ns\ni\ns\nf\ni\nn\ne\n!\n```\n\n我们将使用到目前为止讨论的所有技术，显著区别在于各种接口的实现细节。我们将从以下类开始：\n\
  \n```php\n<?php\nuse Iterator;\n\nclass Utf8StringIterator implements Iterator {\n\
  \    protected $string = '';\n    protected $position = 0;\n\n    public function\
  \ __construct(string $string) {\n        $this->string = $string;\n    }\n\n   \
  \ public function current() {\n    }\n\n    public function next() {\n    }\n\n\
  \    public function key() {\n    }\n\n    public function valid() {\n    }\n\n\
  \    public function rewind() {\n    }\n\n    public function __toString() {\n \
  \       return $this->string;\n    }\n}\n```\n\n在我们的实现中，我们需要跟踪字符串中的当前位置。记住，我们要适应多字节字符串，因此索引\
  \ 1 可能对应于字符串的第四个字节。我们将将其内部存储为 `$position`。\n\n\n\n\n\n```php\n<?php\nuse Iterator;\n\
  \nclass Utf8StringIterator implements Iterator\n{\n    protected $string = '';\n\
  \    protected $position = 0;\n\n    public function __construct(string $string)\n\
  \    {\n        $this->string = $string;\n    }\n\n    public function current()\n\
  \    {\n    }\n\n    public function next()\n    {\n    }\n\n    public function\
  \ key()\n    {\n        return $this->position;\n    }\n\n    public function valid()\n\
  \    {\n        return isset($this->string[$this->position]);\n    }\n\n    public\
  \ function rewind()\n    {\n        $this->position = 0;\n    }\n\n    public function\
  \ __toString()\n    {\n        return $this->string;\n    }\n}\n```\n\nPHP 使用 `key`\
  \ 方法来获取循环中当前元素的数组键。对于我们的用途来说，这将是字符在原始字符串中出现的位置。我们还将使用内部位置来帮助实现 `valid` 方法。\n\nPHP\
  \ 使用 `valid` 方法来在每次迭代后（通过调用 `next`）或在重置迭代时（通过调用 `rewind`）确定循环中的当前位置是否有效。如果原始字符串在对应位置存在字节，我们认为该位置是有效的。\n\
  \n我们现在将实现字符串迭代器的核心部分：`current` 和 `next` 方法。\n\n#### 图 1.38\n\n```php\n<?php\nuse\
  \ Iterator;\n\nclass Utf8StringIterator implements Iterator\n{\n    protected $string\
  \ = '';\n    protected $position = 0;\n    protected $lastSize = 1;\n\n    public\
  \ function __construct(string $string)\n    {\n        $this->string = $string;\n\
  \    }\n\n    public function current()\n    {\n        $firstByte = ord($this->string[$this->position]);\n\
  \n        $this->lastSize = match(true) {\n            $firstByte <= 127 => 1,\n\
  \            $firstByte <= 223 => 2,\n            $firstByte <= 239 => 3,\n    \
  \        default => 4\n        };\n\n        return substr(\n            $this->string,\n\
  \            $this->position,\n            $this->lastSize\n        );\n    }\n\n\
  \    public function next()\n    {\n        $this->position += $this->lastSize;\n\
  \    }\n\n    public function key()\n    {\n        return $this->position;\n  \
  \  }\n\n    public function valid()\n    {\n        return isset($this->string[$this->position]);\n\
  \    }\n\n    public function rewind()\n    {\n        $this->position = 0;\n  \
  \  }\n\n    public function __toString()\n    {\n        return $this->string;\n\
  \    }\n}\n```\n\n`current` 方法的实现看起来与我们在上一节做的字符计数函数非常相似。我们正在检查任何给定位置上第一个字节的大小，并用它来确定该位置字符所占的字节数。我们将字符的大小存储在内部变量\
  \ `$lastSize` 中，我们可以在下一次实现中使用它：返回字符串中*下一个*字符的位置。\n\n`current` 方法的返回值返回的是我们原始字符串的*子字符串*。该子字符串从迭代器的当前位置开始，并一直持续到当前字符包含的字节数结束。你可能会奇怪，为什么我们使用\
  \ `substr` 方法而不是 `mb_substr`。\n\n我们使用 `substr` 而不是 `mb_substr`，是因为我们自己管理每个字符的字节数，不需要依赖内置函数的功能，因为那会导致进一步的问题。\n\
  \n此时，我们可以使用该类来遍历 UTF-8 字符串的所有字符。我们的下一个改进是让我们的字符串迭代器支持 PHP 的 `count` 函数。为了做到这一点，我们需要实现\
  \ `Countable` 接口。\n\n`Countable` 接口定义了一个单一的 `count` 方法，它应该返回要计数的对象的大小。对于我们的用例，这将是字符串的长度。我们不需要对这种实现进行任何复杂的处理，可以使用带有\
  \ UTF-8 参数的 `mb_strlen` 函数来预计算长度：\n\n#### 图 1.39\n\n```php\n<?php\nuse Countable;\n\
  use Iterator;\n\nclass Utf8StringIterator implements\n    Countable,\n    Iterator\n\
  {\n    protected $string = '';\n    protected $position = 0;\n    protected $lastSize\
  \ = 1;\n    protected $length = 0;\n\n    public function __construct(string $string)\n\
  \    {\n        $this->string = $string;\n        $this->length = mb_strlen($string,\
  \ 'UTF-8');\n    }\n\n    public function count()\n    {\n        return $this->length;\n\
  \    }\n\n    // ...\n}\n```\n\n有了此更改，我们可以通过以下方式获取字符串中字符的数量：\n\n#### 图 1.40\n\n\
  ```php\n<?php\n$iterator = new Utf8StringIterator('這可以-this is fine!');\n\n// 返回\
  \ 17\n$length = count($iterator);\n```\n\n### 1.5 访问 UTF-8 字符串中的单个字符\n\n我们现在有了一个完整的类，它可以遍历\
  \ UTF-8 字符串并在使用 PHP 的 `count` 函数时返回正确的字符数量。目前，如果我们尝试执行以下操作将会收到错误：\n\n#### 图 1.41\n\
  \n```php\n<?php\n$iterator = new Utf8StringIterator('這可以-this is fine!');\n\n$iterator[0];\n\
  $iterator[1];\n$iterator[2] = 'A';\n```\n\n能够使用 PHP 的数组访问语法在任意位置访问、设置或删除字符将是非常好的。我们可以通过实现另一个\
  \ PHP 接口来实现这一点：`ArrayAccess` 接口。\n\n为了实现此接口，我们可以添加以下内容。这些添加涉及许多操作，但我们将在本节的剩余部分中涵盖所有关键部分：\n\
  \n#### 图 1.42\n\n\n\n\n\n```php\n<?php\nnamespace App;\n\nuse ArrayAccess;\nuse\
  \ Countable;\nuse Iterator;\n\nclass Utf8StringIterator implements\n    ArrayAccess,\n\
  \    Countable,\n    Iterator\n{\n    protected $string = '';\n    protected $position\
  \ = 0;\n    protected $lastSize = 1;\n    protected $length = 0;\n    protected\
  \ $stringIndex = null;\n\n    public function __construct(string $string)\n    {\n\
  \        $this->string = $string;\n        $this->length = mb_strlen($string, 'UTF-8');\n\
  \    }\n\n    // ...\n\n    public function lastCharSize()\n    {\n        return\
  \ $this->lastSize;\n    }\n\n    private function buildStringIndex()\n    {\n  \
  \      if ($this->stringIndex !== null) {\n            return;\n        }\n\n  \
  \      $this->stringIndex = [];\n        $string = new Utf8StringIterator($this->string);\n\
  \n        $charIndex = 0;\n\n        foreach ($string as $char) {\n            $this->stringIndex[$charIndex]\
  \ = $string->lastCharSize();\n            $charIndex += 1;\n        }\n\n      \
  \  unset($string);\n    }\n\n    public function offsetExists(mixed $offset)\n \
  \   {\n        $this->buildStringIndex();\n\n        return array_key_exists(\n\
  \            $offset,\n            $this->stringIndex\n        );\n    }\n\n   \
  \ public function offsetGet(mixed $offset)\n    {\n        $this->buildStringIndex();\n\
  \n        return substr(\n            $this->string,\n            $this->getPosition($offset),\n\
  \            $this->stringIndex[$offset]\n        );\n    }\n\n    protected function\
  \ getPosition($offset)\n    {\n        $position = 0;\n\n        for ($i = 0; $i\
  \ < $offset; $i++) {\n            $position += $this->stringIndex[$i];\n       \
  \ }\n\n        return $position;\n    }\n\n    public function getPositionFromCharIndex($charIndex)\n\
  \    {\n        $this->buildStringIndex();\n        return $this->getPosition($charIndex);\n\
  \    }\n\n    public function offsetSet(mixed $offset, mixed $value)\n    {\n  \
  \      $this->buildStringIndex();\n        $this->string = substr_replace(\n   \
  \         $this->string,\n            $value,\n            $this->getPosition($offset),\n\
  \            $this->stringIndex[$offset]\n        );\n        $this->stringIndex\
  \ = null;\n        $this->buildStringIndex();\n        $this->updateMetaData();\n\
  \    }\n\n    public function offsetUnset(mixed $offset)\n    {\n        $this->buildStringIndex();\n\
  \        $this->string = substr_replace(\n            $this->string,\n         \
  \   '',\n            $this->getPosition($offset),\n            $this->stringIndex[$offset]\n\
  \        );\n        unset($this->stringIndex[$offset]);\n        $this->updateMetaData();\n\
  \    }\n\n    protected function updateMetaData()\n    {\n        $this->stringIndex\
  \ = array_values($this->stringIndex);\n        $this->length = mb_strlen($this->string);\n\
  \    }\n}\n```\n\n该实现中最令人兴奋的部分是字符串索引（string index）。字符串索引将存储每个字符及其所需字节数的内部映射表。我们通过迭代字符串中的所有字符并使用该迭代器的新实例来构建此映射表。你会注意到，我们还创建了一个辅助方法：`lastCharSize`。`lastCharSize`\
  \ 方法将返回最后一个字符的字节总数，我们可以利用该结果来填充索引。另一个在该实现中被频繁使用的新方法是 `getPosition`。`getPosition`\
  \ 接收一个从零开始的字符位置，并返回它在原始字符串中出现的位置。我们通过计算索引中目标偏移量之前的字节数来实现这一点。我们还添加了一个公共方法 `getPositionCharIndex`，它的功能与此相同，但会先检查字符串索引的状态。\n\
  \n当我们编写像下面这样的代码时，PHP 在内部会调用带有所需偏移量的 `offsetGet` 方法：\n\n图 1.43\n```php\n<?php\n$iterator\
  \ = new Utf8StringIterator('這可以-this is fine!');\n$firstChar = $iterator[0];\n$secondChar\
  \ = $iterator[1];\n$thirdChar = $iterator[2];\n```\n\n在任何一个 `ArrayAccess` 方法中，我们执行的第一件事都是调用\
  \ `buildStringIndex` 方法，如果索引不存在，该方法将创建索引。为了根据索引返回单个字符，我们对内部字符串调用 `substr`，并传入提供的偏移量位置以及该位置字符的长度。\n\
  \n同样，当我们执行以下操作时，PHP 将调用我们的 `offsetSet` 方法：\n\n图 1.44\n```php\n<?php\n$iterator =\
  \ new Utf8StringIterator('這可以-this is fine!');\n$iterator[0] = 'A';\n$iterator[1]\
  \ = 'B';\n$iterator[2] = 'C';\n// 返回 \"ABC-this is fine!\"\n$value = (string) $iterator;\n\
  ```\n\n当我们更改字符串内部的字符时，会调用 `substr_replace` 方法来替换该位置的所有原始字符。之后，我们必须重置字符串索引并重建一些元数据。\n\
  \n在重建字符串的元数据时，我们在内部字符串索引上调用 `array_values` 函数，这将从零开始重新编号并更新我们内部存储的长度。我们对 `offsetUnset`\
  \ 方法的实现几乎相同，不同之处在于我们不是接受用户的值，而是将原始字符替换为空字符串。\n\n我们 `offsetSet` 实现的一个副作用是，现在我们可以执行以下操作来替换特定位置的子串：\n\
  \n图 1.45\n```php\n<?php\n$iterator = new Utf8StringIterator('這可以-this is fine!');\n\
  $iterator[1] = '-hello world-';\n// 返回 \"這-hello world-以-this is fine!\"\n$value\
  \ = (string) $iterator;\n```\n\n### 1.6 管理字符编码\n\n在第 1 章中，我们对 ASCII 和 UTF-8 进行了大量的讨论。这些都是字符编码的示例，但还有更多。在本段落开头发生的情况是乱码（mojibake）的一个示例——即使用与写入时不同的字符编码处理文本的结果。这里的具体例子是\
  \ UTF-8 编码的内容被解释为使用 UTF-16 BE 编码的字节序列。虽然这个特定的例子是有意为之且无害的，但意外发生这种情况可能会对应用程序数据流、用户体验以及破坏布局等产生影响。\n\
  \n\n\n\n\n既然我们已经处理了 PHP 在应用程序与数据库交互时默认使用的字符编码问题，我们应该确保它使用的字符编码与你的应用程序相匹配。假设你遇到过这样的问题：从数据库中提取并由应用程序处理的数据看起来是乱码或损坏，但在任一系统内独立运行时运行都是正常的。在这种情况下，两者可能都配置为使用不同的字符集或编码。\n\
  \nLaravel 的默认数据库配置很可能已将数据库连接配置为使用 UTF-8。尽管如此，你可以通过查看 `config/database.php` 文件中的以下配置选项来双检：\n\
  \n### 表 1.5 数据库字符集\n\n| 数据库系统 | 配置选项 | UTF-8 值 |\n| --- | --- | --- |\n| MySQL |\
  \ `charset` | utf8mb4 |\n| MySQL | `collation` | utf8mb4_unicode_ci |\n| PostgreSQL\
  \ | `charset` | utf8 |\n| SQL Server | `charset` | utf8 |\n\n表 1.6 提供了一份资源列表，用于查询\
  \ PHP、MySQL、PostgreSQL 和 SQL Server 所支持的字符集和编码：\n\n### 表 1.6 软件编码参考\n\n| 软件 | 编码参考链接\
  \ |\n| --- | --- |\n| PHP | https://www.php.net/manual/en/mbstring.encodings.php\
  \ |\n| PostgreSQL | https://www.postgresql.org/docs/9.3/multibyte.html |\n| MySQL\
  \ | https://dev.mysql.com/doc/refman/8.0/en/charset-charsets.html |\n| SQL Server\
  \ 16 | https://docs.microsoft.com/en-us/sql/relational-databases/collations/collation-and-unicode-support?view=sql-server-ver16\
  \ |\n\n在内部系统交互时使用一致的字符集和编码是一个很好的开始，但大多数应用程序偶尔会与第三方数据交互。无论是来自外部 API、用户上传的文件还是相关内容，我们都需要意识到不同的编码可能会溜入我们的应用程序。幸运的是，我们有多种方法来分析、检测和转换外部数据的字符编码。\n\
  \n我们可以使用 PHP 的 `mb_detect_encoding` 函数来尝试确定提供数据的字符编码。该函数会尝试检测值的字符编码，但如果失败则可能返回 `false`。我们可以像这样使用该函数，尝试将我们的输入数据转换为应用程序支持的编码：\n\
  \n图 1.47\n\n```php\n<?php\n$encoding = mb_detect_encoding(\n    $value,\n    ['UTF-8',\
  \ 'ASCII', 'ISO-8859-1'],\n    true\n);\n```\n\n你可能会注意到，我们在第二个参数中提供了一个不同的字符编码列表，并将布尔值\
  \ `true` 作为第三个参数。\n\n第二个参数包含一个字符编码列表，它指指定了 `mb_detect_encoding` 函数尝试按顺序检测的编码列表。当输入值包含完全落在\
  \ ASCII 范围内的字符时，这非常有用。如果不指定任何顺序，`mb_detect_encoding` 函数可能会返回“ASCII”，这在技术上是正确的，但在\
  \ UTF-8 中，低位范围对应于 ASCII 范围，因此将其报告为 UTF-8 可能会更有益。通过按此顺序指定我们的字符编码，我们可以消除这种差异。字符编码顺序可以通过配置\
  \ `mbstring.detect_order` 值来指定。无论你选择哪种方法来控制编码，都应该按照与你的应用程序相关且你的系统可以管理的最具体的顺序列出编码。\n\
  \n第三个参数对应于 `mb_detect_encoding` 函数的 `strict` 参数。该值默认设置为 `false`，这会导致当输入不严格遵守标准时，`mb_detect_encoding`\
  \ 返回与输入值最匹配的编码，这可能导致意外的结果。一个典型的例子是接受经过 UTF-8 或 ISO-8859-1 编码的输入，其中某些用 ISO8859-1\
  \ 编码的字符串被检测为 UTF-8，并导致难以诊断的问题，即某种“海森堡虫”（Heisenbug）。我们可以通过指定期望的顺序并在严格模式下使用 `mb_detect_encoding`\
  \ 来避免许多潜在问题。综上所述，我们可以创建一个简单的辅助函数，尝试归一化应用程序接收到的数据：\n\n图 1.48\n\n```php\n<?php\nuse\
  \ ArgumentException;\n\nfunction convertToUtf8($value) {\n    if ($value === null)\
  \ {\n        return $value;\n    }\n    $encoding = mb_detect_encoding(\n      \
  \  $value,\n        ['UTF-8', 'ASCII', 'ISO-8859-1'],\n        true\n    );\n  \
  \  if ($encoding === false) {\n        // 处理编码问题\n        // 任何符合你应用程序的\n      \
  \  // 方式\n        throw new ArgumentException(\n            'Input could not be\
  \ converted to UTF-8'\n        );\n    }\n    if ($encoding === 'UTF-8') {\n   \
  \     return $value;\n    }\n    $result = mb_convert_encoding(\n        $value,\n\
  \        'UTF-8',\n        $encoding\n    );\n    if ($result === false) {\n   \
  \     // 处理编码问题\n        // 任何符合你应用程序的\n        // 方式\n        throw new ArgumentException(\n\
  \            'Input could not be converted to UTF-8'\n        );\n    }\n    return\
  \ $result;\n}\n```\n\n我们目前的函数实现对于跨编码的字符串输入效果良好，但在遇到带有字节标记（BOM）的数据时会失败。位于文本开头的 BOM\
  \ 字符可以我们很多关于文本的信息。例如，它可以告诉我们：\n\n1. 文本极可能是 Unicode\n2. 使用的 Unicode 编码\n3. 字节序（端序），当使用\
  \ 16 位和 32 位字符编码时\n\n如果你曾使用 `json_encode` 函数，并在显示结果时注意到一个带有问号的奇怪三角形，那么输入函数可能包含 BOM\
  \ 字符。这些字符的存在在将 UTF-8 字符串传递到处理 的过程中特别有问题，因为 BOM 序列是由非 ASCII 字节组成的。\n\n如果你记得，`mb_detect_encoding`\
  \ 函数无法很好处理 UTF-16 BE/LE 等编码。我们可以通过查找它们的 BOM 字符序列来检测这些编码。表 1.7 显示了字节序列及其对应的 Unicode\
  \ 编码：\n\n### 表 1.7 Unicode BOM 序列\n\n| 编码 | 序列 |\n| --- | --- |\n| UTF-8 | EF BB\
  \ BF |\n| UTF-32 BE | 00 00 FE |\n| UTF-32 LE | FF FE 00 |\n| UTF-16 BE | FE FF\
  \ |\n| UTF-16 LE | FF FE |\n\n利用此，我们可以构造一个函数，根据这些字节在数据开头出现来确定字符串的编码：\n\n图 1.49 检测各种\
  \ UTF-8 编码\n\n```php\n<?php\nfunction detectEncodingFromBom($value) {\n    if (str_starts_with($value,\
  \ \"\\xEF\\xBB\\xBF\")) {\n        return ['UTF-8', substr($value, 3)];\n    } else\
  \ if (str_starts_with($value, \"\\x00\\x00\\xFE\")) {\n        return ['UTF-32BE',\
  \ substr($value, 3)];\n    } else if (str_starts_with($value, \"\\xFF\\xFE\\x00\"\
  )) {\n        return ['UTF-32LE', substr($value, 3)];\n    } else if (str_starts_with($value,\
  \ \"\\xFE\\xFF\")) {\n        return ['UTF-16BE', substr($value, 2)];\n    } else\
  \ if (str_starts_with($value, \"\\xFF\\xFE\")) {\n        return ['UTF-16LE', substr($value,\
  \ 2)];\n    }\n    return null;\n}\n```\n\n\n\n\n该函数实现中的一个有趣选择是，如果无法检测到 Unicode\
  \ BOM 字符序列，它将返回 `null`。如果它可以检测到 BOM 序列，它将返回一个数组，其中包含字符编码以及移除 BOM 序列后的输入值副本。我们现在可以重构\
  \ `convertToUtf8` 函数来利用这个新函数：\n\n图 1.50 将字符串转换为 UTF-8\n\n```php\n 1 <?php\n 2 \n\
  3 function convertToUtf8($value) {\n 4     if ($value === null) { return $value;\
  \ }\n 5 \n6     $unicodeEncoding = detectEncodingFromBom($value);\n 7 \n8     $encoding\
  \ = false;\n9\n10     if ($unicodeEncoding != null) {\n11         // 返回不带 BOM 的\
  \ UTF-8 字符串。\n12         if ($unicodeEncoding[0] == 'UTF-8') {\n13             return\
  \ $unicodeEncoding[1];\n14         }\n15 \n16         $encoding = $unicodeEncoding[0];\n\
  17         $value = $unicodeEncoding[1];\n18     } else {\n19         $encoding\
  \ = mb_detect_encoding(\n20             $value,\n21             ['UTF-8', 'ASCII',\
  \ 'ISO-8859-1'],\n22             true\n23         );\n24     }\n25 \n26     if ($encoding\
  \ === false) {\n27         // 以符合你应用程序的\n28         // 方式处理编码\n29         // 问题。\n\
  30         throw new InvalidArgumentException(\n31             'Input could not\
  \ be converted to UTF-8'\n32         );\n33     }\n34 \n35     if ($encoding ===\
  \ 'UTF-8') {\n36         return $value;\n37     }\n38 \n39     $result = mb_convert_encoding(\n\
  40         $value,\n41         'UTF-8',\n42         $encoding\n43     );\n44 \n\
  45     if ($result === false) {\n46         // 以符合你应用程序的\n47         // 方式处理编码\n\
  48         // 问题。\n49         throw new InvalidArgumentException(\n50          \
  \   'Input could not be converted to UTF-8'\n51         );\n52     }\n53 \n54  \
  \   return $result;\n55 }\n```\n\n经过这些更改后，我们的 `convertToUtf8` 函数现在能够将各种 Unicode\
  \ 字符串转换为 UTF-8，并且能够扩展以检测多种其他字符编码。\n\n## 1.7 PHP 字符串的类型\n\n到目前为止我们涵盖了很多内容，但还没有花太多时间研究如何在\
  \ PHP 中创建字符串。PHP 提供了四种定义字符串的不同方式：\n\n* 单引号字符串\n* 双引号字符串\n* Nowdoc 字符串\n* Heredoc\
  \ 字符串\n\n我们发现最常见的字符串语法之一是单引号语法。使用这种语法，我们用单引号将字符串的内容括起来：\n\n图 1.51 \n\n```php\n1\
  \ <?php\n2 \n3 // 输出一个单引号字符串。\n4 echo 'A single quote string.';\n```\n\n单引号语法的处是，所有的转义序列（转义单引号或反斜杠之外）都将作为字面字符串内容输出：\n\
  \n图 1.52 \n\n```php\n1 <?php\n2 \n3 // 输出 \\tA single quote string ' \\ \" \\n\n\
  4 echo '\\tA single quote string \\' \\\\ \" \\n';\n```\n\n双引号语法类似，但它提供了许多我们可以使用的转义序列来输出特殊字符，并允许在字符串中嵌入变量。我们已经见过其中一种转义序列了：Unicode\
  \ 代码点转义序列。下表列出了不同的 PHP 字符串转义序列：\n\n表 1.8 字符串转义序列\n\n| 序列 | 描述 | 示例字符串 |\n| --- |\
  \ --- | --- |\n| `\\n` | 换行符 | |\n| `\\r` | 回车 | |\n| `\\t` | 水平制表 | |\n| `\\v`\
  \ | 垂直制表 | |\n| `\\e` | 转义符 | |\n| `\\f` | 换页 | |\n| `\\\\` | 反斜杠 | `”\\\\\\\\mnt\\\
  \\\\\\c”` |\n| `$` | 美元符号 | `”\\\\$app”` |\n| `\"` | 双引号 | `”\\\\“Whoever is happy…\\\
  \\”` |\n| `[0-7]{1,3}` | 进制序列 | `“\\\\064\\\\062”` |\n| `\\x[0-9A-Fa-f]{1,2}` |\
  \ 十进制序列 | `“\\\\x2E\\\\x35\\\\x37\\\\x37\\\\x32\\\\x31”` |\n| `\\u{[0-9A-Fa-f]+}`\
  \ | Unicode 代码点 (UTF-8 输出) | `“Hi, Jesse! \\\\u{1f440}”` |\n\n在处理双引号字符串时，我们可以在其中嵌入变量、访问数组元素并在对象上调用方法。以下示例演示了这些从动态输入构建字符串的技术：\n\
  \n图 1.53 \n\n```php\n 1 <?php\n 2 \n3 // 简单的变量扩展。\n4 $name = 'Jean';\n5 \n6 // 输出\
  \ \"Hello $name\"\n7 echo \"Hello $name\";\n```\n\n## 1.8 反引号与模板字符串\n\nPHP 开发者经常在前端语言（如\
  \ JavaScript）和我们的后端语言之间往回。在 JavaScript 等语言中使用时，使用反引号（```）字符构造模板字符串是常见的：\n\n图 1.62\
  \ \n\n```javascript\n`Hello, ${name}.`\n```\n\n必须注意的是，要在 PHP 中实现相同的功能，我们应该使用 heredoc\
  \ 语法或双引号字符串：\n\n图 1.63 \n\n```php\n1 <?php\n2 \n3 $string = <<<STRING\n4 Hello,\
  \ {$name}.\n5 STRING;\n6 \n7 $string = \"Hello, {$name}.\";\n```\n\n\n\n\n\nPHP\
  \ 中的反引号（backtick）字符是一个语言层面的运算符，它会将字符串的内容作为 shell 命令执行。基于此，以下代码是等价的：\n\n图 1.64 \n\
  \n```php\n1 <?php\n2 \n3 `Hello, {$name}.`;\n4 \n5 shell_exec(\"Hello, {$name}.\"\
  );\n```\n\n在构建模板字符串时，永远不要使用反引号字符串，结果可能是灾难性的。\n\n## 1.9 Laravel 字符串助手方法\n\n我们在这一章中经历了怎样的冒险啊！在本书接下来的内容中，我们将介绍\
  \ Laravel 的字符串助手方法，并通过实际示例来学习它们。每隔一段时间，我们会回顾本章讨论的概念和技术。尽管如此，知道在使用 Laravel 字符串助手方法时，管理多字节字符串的复杂细节已经为我们抽象好了，这确实令人欣慰。\n\
  \nLaravel 框架提供了大量的字符串助手方法来辅助应用程序开发。PHP 的较新版本在内置字符串函数与 Laravel 框架提供的方法之间有了许多重叠。然而，Laravel\
  \ 提供的助手方法仍然是有益的，因为它们有助于规范参数顺序，并在安全的情况下尽力确保其多字节处理的安全（multi-byte safe）。\n\n在接下来的几个章节中，我们将介绍这些助手方法中最有趣的部分，可以将它们分为以下几大类：\n\
  \n*   **格式化 (Formatting)**：这些助手方法通过调整大小写、组合等来帮助转换输入字符串。\n*   **逻辑 (Logical)**：这些助手方法提供了一些工具或功能，使得它们在条件语句或逻辑语句中使用时非常有益。\n\
  *   **构建 (Construction)**：这些助手方法提供的功能可以帮助你从其他字符串构建新字符串。\n*   **提取 (Extraction)**：这些助手方法帮助你从现有字符串中提取部分内容以便进一步处理。\n\
  \n虽然我们可以将大多数助手方法归入上述四类之一，但其他方法并不完全契合任何特定类别，或者最好在各自的专用章节或段落中讨论。\n\n## 2 流式字符串 (Fluent\
  \ Strings)\n\n在本书中，我们会看到对 `Stringable` 对象或流式字符串（fluent strings）的引用。流式字符串是对 Laravel\
  \ 字符串助手方法的面向对象的封装，它提供了一个方便且自然的 API 来处理这些方法，并带有了一些额外功能。\n\n当我们看到“fluent”（流式）这个词时，特别是在\
  \ Laravel 及其生态系统包的语文中，它通常指的是一个允许你在同一个对象实例或相同类型的新实例上连续链式调用方法的对象。日常案例包括查询构造器（query\
  \ builders）、请求构造器（request builders）等。\n\n为了对比流式字符串 API 与标准的基于方法调用的方法，我们可以查看下面的图\
  \ 2.1：\n\n图 2.1 基于类 vs 流式字符串助手\n\n```php\n 1 <?php\n 2 \n3 use Illuminate\\Support\\\
  Str;\n4 \n5 $string = 'This is an input string.';\n6 \n7 // 直接使用字符串助手。\n8 $value\
  \ = Str::lower($string);\n9 $value = Str::limit($value, 10);\n10 \n11 // 使用流式字符串。\n\
  12 $value = (string) str($string)->lower()->limit(10);\n```\n\n从图 2.1 可以看出，使用流式字符串时，我们不需要持续引用\
  \ `Str` 类，可以根据上一个方法调的结果继续调用方法。在这个示例中，我们还看到了 `str` 函数（全小写），我们可以用它在任何地方创建流式字符串对象的实例。\n\
  \n我们还可以使用 `Str` 类上的 `of` 方法来创建这些流式字符串对象：\n\n图 2.2 \n\n```php\n1 <?php\n2 \n3 use\
  \ Illuminate\\Support\\Str;\n4 \n5 $string = 'This is an input string.';\n6 \n7\
  \ $value = (string) Str::of($string)->lower()->limit(10);\n```\n\n流式字符串的一个显著方面是它们能够将动态属性访问代理（proxy）到方法上。流式字符串的一个显著方面是它们能够将动态属性访问代理到方法上。流式字符串的一个显著方面是它们能够将动态属性访问代理到方法上。流式字符串的一个显著方面是它们能够将动态属性访问代理到方法上。流式字符串的一个显著方面是它们能够将动态属性访问代理到方法上。\n\
  \n流式字符串的一个显著方面是它们能够将动态属性访问代理到方法上。流式字符串的一个显著方面是它们能够将动态属性访问代理到方法上。流式字符串的一个显著方面是它们能够将动态属性访问代理到方法上。流式字符串的一个显著方面是它们能够将动态属性访问代理到方法上。流式字符串的一个显著方面是它们能够将动态属性访问代理到方法上。\n\
  \n（注：由于原文文本存在大量重复和乱码，上述翻译已基于上下文逻辑进行了修复性处理。）\n\n\n\n\n我们的新实现使用了 `whenIsUuid` 方法并提供了两个回调函数作为其参数。`whenIsUuid`\
  \ 方法将执行第一个回调函数，如果输入字符串匹配 UUID 预期的格式，则将使用它的返回值。如果输入字符串不是有效的 UUID，则调用第二个回调函数并使用其返回值；在我们的案例中，我们生成了一个新的\
  \ UUID。\n\n我们能够将条件语句压缩为一行，但随着条件大小和复杂性的增加，这很容易损害我们代码的可读性。\n\n`Table 2.1` 列出了可用的条件流式方法：\n\
  \nTable 2.1 条件流式方法\n\n| 方法 | 描述 |\n| --- | --- |\n| `whenContains($needles, $callback,\
  \ $default = null)` | 检查字符串是否包含提供的子字符串之一 |\n| `whenContainsAll(array $needles, $callback,\
  \ $default = null)` | 检查字符串是否包含所有提供的子字符串。 |\n| `whenEmpty($callback, $default =\
  \ null)` | 检查字符串是否为空（严格比较）。 |\n| `whenNotEmpty($callback, $default = null)` | 检查字符串是否为空（严格比较）。\
  \ |\n| `whenEndsWith($needles, $callback, $default = null)` | 检查字符串是否以另一个子字符串结尾。\
  \ |\n| `whenExactly($value, $callback, $default = null)` | 检查字符串是否与另一个字符串完全相等（严格比较）。\
  \ |\n| `whenIs($pattern, $callback, $default = null)` | 检查字符串是否匹配提供的正则表达式。 |\n|\
  \ `whenIsAscii($callback, $default = null)` | 检查字符串是否只包含 ASCII 字符。 |\n| `whenIsUuid($callback,\
  \ $default = null)` | 检查字符串是否为有效的 UUID。 |\n| `whenStartsWith($needles, $callback,\
  \ $default = null)` | 检查字符串是否以另一个子字符串开头。 |\n| `whenTest($pattern, $callback, $default\
  \ = null)` | 检查字符串是否匹配提供的正则表达式，并执行回调。 |\n| `when($value, callable $callback = null,\
  \ callable $default = null)` | 对字符串执行用户定义的测试。 |\n| `unless($value, callable $callback\
  \ = null, callable $default = null)` | 对字符串执行用户定义的测试，如果测试失败则执行回调。 |\n\n## 3. 格式化辅助方法\n\
