  \    }\n 43           ]\n 44         }\n 45         2 => Step {\n 46           start:\
  \ 128\n 47           comments: []\n 48           keyword: \"then\"\n 49        \
  \   text: \"I should have <left> cucumbers\"\n 50           data: []\n 51      \
