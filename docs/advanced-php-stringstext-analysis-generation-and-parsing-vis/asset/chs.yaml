  \    $content = str($line)->ltrim;\n\n        return $content->startsWith($this->stepKeywords)\
  \ ||\n            $content->startsWith($this->gherkinKeywords) ||\n            $content->startsWith('@');\n\
  \    }\n\n    /**\n     * 解析自由格式的 Gherkin 描述。\n     *\n     * @param TextIndentation[]\
  \ $lines 需要解析的行。\n     * @return string\n     */\n    protected function parseDescription(array\
  \ $lines): string\n    {\n        if (count($lines) == 0) { return ''; }\n     \
  \   $description = [];\n\n        for ($i = 0; $i < count($lines); $i++) {\n   \
  \         $cur = $lines[$i];\n\n            // 当我们遇到以关键字开头的行时，\n            // 我们将停止寻找自由格式的描述文本。\n\
  \            if (str($cur->line)->trim->length == 0||\n                $this->startsWithKeyword($cur->line))\
  \ {\n                break;\n            }\n\n            if ($cur->indentCount\
  \ > 0) {\n                $description[] = (string) str($cur->line)->ltrim;\n  \
  \              continue;\n            }\n\n            break;\n        }\n\n   \
  \     return (string) str(implode(' ', $description))\n            ->squish();\n\
  \    }\n\n    /**\n     * 解析各种块的名称，例如 Feature 名称。\n     *\n     * @param TextIndentation\
  \ $line 需要解析的行。\n     * @param string $keyword 原始关键字。\n     * @return string\n \
  \    */\n    protected function parseName(\n        TextIndentation $line,\n   \
  \     string $keyword\n    ): string\n    {\n        return (string) str($line->line)\n\
  \            ->trim->substr(strlen($this->gherkinKeywords[$keyword]))\n        \
  \    ->trim;\n    }\n\n    /**\n     * 从提供的行中检索所有 Gherkin 注释。\n     *\n     * @param\
  \ TextIndentation[] $lines 需要解析的行。\n     * @return Comment[]\n     */\n    protected\
  \ function parseComments(array $lines): array\n    {\n        $comments = [];\n\n\
  \        foreach ($lines as $line) {\n            if (str($line->line)->trim->startsWith('#'))\
  \ {\n                $comments[] = $this->parseComment($line);\n            }\n\
  \        }\n\n        return $comments;\n    }\n\n    /**\n     * 解析单个 Gherkin 注释。\n\
  \     *\n     * @param TextIndentation $line 需要解析的行。\n     * @return Comment\n \
  \    */\n    protected function parseComment(TextIndentation $line): Comment\n \
  \   {\n        $comment = new Comment();\n        $comment->start = $this->lineToPosition($line);\n\
  \        $comment->text = (string) str($line->line)->substr(1)->trim;\n\n      \
  \  return $comment;\n    }\n\n    /**\n     * 获取提供的行的位置。\n     *\n     * @param\
  \ TextIndentation $line 行。\n     * @return int\n     */\n    protected function\
  \ lineToPosition(TextIndentation $line): int\n    {\n        return $this->locator->getCharPositionFromLineColumn(\n\
  \            $line->lineNumber, $line->leadingWhitespace + 1\n        );\n    }\n\
  }\n```\n\n\n\n\n## 附录 F：单文件组件解析器实现\n\n以下代码示例是第 15 章中开发的单文件组件解析器的完整实现。\n\n图 24.1\
  \ \n\n```php\n<?php\n\nclass ParseResult\n{\n    public string $content = '';\n\
  \    public string $type = '';\n    public int $startOffset = 0;\n    public int\
  \ $endOffset = 0;\n}\n\nclass SingleFileComponentParser\n{\n    /**\n     * Parses\
  \ the provided text into individual components.\n     *\n     * @param string $value\
  \ The text to parse.\n     * @param array $parts The parts to parse.\n     * @return\
  \ array\n     * @throws Exception\n     */\n    public function parse(\n       \
  \ string $value,\n        array $parts = ['style', 'template', 'script']):\n   \
  \ {\n        $results = [];\n\n        $positionLocator = new CharacterPosition($value);\n\
  \n        $pattern = collect($parts)\n            ->map(fn($x) => preg_quote($x))->implode('|');\n\
  \n        preg_match_all(\n            '/^[\\/]?('.$pattern.*>/m',\n           \
  \ $value,\n            $matches,\n            PREG_OFFSET_CAPTURE\n        );\n\n\
  \        $tagNames = $matches[1];\n        $sourceTags = $matches[0];\n\n      \
  \  for ($i = 0; $i < count($tagNames); $i++) {\n            $tag = $tagNames[$i];\n\
  \n            $next = $i + 1;\n\n            if (! isset($sourceTags[$next])) {\n\
  \                $location = $positionLocator\n                    ->getCharPosition($sourceTags[$i][1]);\n\
  \n                throw new Exception(\"Missing closing tag for '{$tag[0]}' at line\
  \ {$location->line} column {$location->column}\");\n            }\n\n          \
  \  $nextTag = $sourceTags[$next];\n            $expected = '</'.$tag[0].'>';\n\n\
  \            if ($nextTag[0] != $expected) {\n                $location = $positionLocator\n\
  \                    ->getCharPosition($sourceTags[$i][1]);\n\n                throw\
  \ new Exception(\"Invalid closing tag {$nextTag[0]}' for '{$tag[0]}' at line {$location->line}\
  \ column {$location->column}\");\n            }\n\n            $sourceTag = $sourceTags[$i][0];\n\
  \n            $start = $sourceTags[$i][1] + str($sourceTag)->length;\n         \
  \   $end = $nextTag[1];\n\n            $parseResult = new ParseResult();\n     \
  \       $parseResult->type = $sourceTag;\n            $parseResult->startOffset\
  \ = $start;\n            $parseResult->endOffset = $end;\n            $parseResult->content\
  \ = str($value)\n                ->substr($start, $end - $start)->toString();\n\n\
  \            $results[] = $parseResult;\n\n            $i += 1;\n        }\n\n \
  \       return $results;\n    }\n}\n```\n\n\n\n\n```php\n<?php\n\nclass CursorResult\n\
  {\n    public int $startPosition = 0;\n    public int $endPosition = 0;\n    public\
  \ int $length = 0;\n    public string $value = '';\n    public string $content =\
  \ '';\n}\n\nabstract class AbstractStringCursor\n{\n    /**\n     * 正在迭代的字符串。\n\
  \     *\n     * @var Utf8StringIterator\n     */\n    protected Utf8StringIterator\
  \ $iterator;\n\n    /**\n     * 表示光标是否应该将迭代器重置为\n     * 调用 traverse() 时的所在位置。\n\
  \     *\n     * @var bool\n     */\n    private bool $shouldReset = false;\n\n \
  \   /**\n     * 将光标向前移动的字符数。\n     *\n     * @var int|null\n     */\n    private\
  \ ?int $advanceCount = null;\n\n    /**\n     * 创建光标时迭代器\n     * 所在的的字符。\n     *\n\
  \     * @var string\n     */\n    protected string $initialCharacter;\n\n    /**\n\
  \     * 当前字符串缓冲区的内容。\n     *\n     * @var string\n     */\n    protected string\
  \ $buffer = '';\n\n    /**\n     * 光标的当前位置。\n     *\n     * @var int\n     */\n\
  \    protected int $position = 0;\n\n    /**\n     * 光标的相对索引。\n     *\n     * @var\
  \ int\n     */\n    protected int $index = 0;\n\n    public function __construct(Utf8StringIterator\
  \ $iterator)\n    {\n        $this->iterator = $iterator;\n    }\n\n    /**\n  \
  \   * 返回内部的 Ut8StringIterator 实例。\n     *\n     * @return Utf8StringIterator\n \
  \    */\n    public function iterator(): Utf8StringIterator\n    {\n        return\
  \ $this->iterator;\n    }\n\n    /**\n     * 设置光标向前移动的字符数。\n     *\n     * @param\
  \ int $count 需要前进的字符数。\n     * @return $this\n     */\n    public function advance(int\
  \ $count): AbstractStringCursor\n    {\n        $this->advanceCount = $count;\n\n\
  \        return $this;\n    }\n\n    /**\n     * 跳过指定数量的字符\n     * 而不将它们添加到字符串缓冲区中。\n\
  \     *\n     * @param int $count 需要跳过的字符数。\n     * @return $this\n     */\n   \
  \ public function skip(int $count): AbstractStringCursor\n    {\n        $this->position\
  \ += $count;\n        $this->index += $count;\n\n        for ($i = 0; $i < $count;\
  \ $i++) {\n            $this->iterator->next();\n        }\n\n        return $this;\n\
  \    }\n\n    public function continue(): bool\n    {\n        return true;\n  \
  \  }\n\n    public function break(): bool\n    {\n        return false;\n    }\n\
  \n    /**\n     *将内容追加到字符串缓冲区。\n     *\n     * @param string $content 要追加的内容。\n\
  \     * @return $this\n     */\n    public function append(string $content): AbstractStringCursor\n\
  \    {\n        $this->buffer .= $content;\n\n        return $this;\n    }\n\n \
  \   /**\n     * 从字符串缓冲区移除最后一个字符。\n     *\n     * @return $this\n     */\n    public\
  \ function popBuffer(): AbstractStringCursor\n    {\n        $this->buffer = str($this->buffer)->substr(0,\
  \ -1);\n\n        return $this;\n    }\n\n    /**\n     * 重置字符串缓冲区。\n     *\n  \
  \   * @return $this\n     */\n    public function clearBuffer(): AbstractStringCursor\n\
  \    {\n        $this->buffer = '';\n\n        return $this;\n    }\n\n    /**\n\
  \     * 重置字符串缓冲区并返回其内容。\n     *\n     * @return string\n     */\n    public function\
  \ flushBuffer(): string\n    {\n        $contents = $this->buffer;\n        $this->buffer\
  \ = '';\n\n        return $contents;\n    }\n\n    /**\n     * 表示未处理处理。\n     *\n\
  \     * @return bool\n     */\n    public function didNotProcess(): bool\n    {\n\
  \        $this->shouldReset = true;\n        return false;\n    }\n\n    /**\n \
  \    * 表示光标是否完成了遍历。\n     *\n     * @return bool\n     */\n    public function didProcess():\
  \ bool\n    {\n        return $this->shouldReset;\n    }\n\n    /**\n     * 将光标的结果添加到字符串缓冲区。\n\
  \     *\n     * @param AbstractStringCursor $cursor\n     * @return string\n   \
  \  */\n    public function bufferCursor(AbstractStringCursor $cursor): string\n\
  \    {\n        $result = $cursor;\n        $this->popBuffer();\n        $bufferContents\
  \ = $this->flushBuffer();\n        return $contents;\n    }\n\n    /**\n     * 遍历字符串并返回结果。\n\
  \     *\n     * @return CursorResult\n     */\n    public function traverse(): CursorResult\n\
  \    {\n        $result = new CursorResult();\n\n        $lastSize = $this->iterator->lastSize();\n\
  \        $startPosition = $this->iterator->key();\n\n        $this->initialCharacter\
  \ = $this->iterator->current();\n\n        $this->shouldReset = false;\n       \
  \ $this->advanceCount = null;\n        $this->buffer = '';\n        $this->index\
  \ = 0;\n        $this->position = $startPosition;\n\n        for ($this->position\
  \ = $startPosition; $this->position < count($this->iterator); $this->position++)\
  \ {\n            $current = $this->iterator[$this->position];\n            $next\
  \ = null;\n            $prev = null;\n\n            if ($this->position > 0) {\n\
  \                $prev = $this->iterator[$this->position - 1];\n            }\n\n\
  \            if ($this->position + 1 < count($this->iterator)) {\n             \
  \   $next = $this->iterator[$this->position + 1];\n            }\n\n           \
  \ $this->buffer .= $current;\n\n            if ($this->accept($current, $prev, $next)\
  \ === false) {\n                // 如果需要，将迭代器回溯到调用\n                // traverse 时的位置。\n\
  \                if ($this->shouldReset) {\n                    $this->iterator->setIteratorPosition(\n\
  \                        $startPosition,\n                        $lastSize\n  \
  \                  );\n                }\n\n                $result->endPosition\
  \ = $this->iterator->key();\n                $result->value = $this->buffer;\n \
  \               $result->length = str($this->buffer)->length();\n              \
  \  $result->content = str($this->buffer)->\n                    substr(1, -1)->toString();\n\
  \                break;\n            }\n\n            if ($this->advanceCount !=\
  \ null) {\n                for ($j = 0; $j < $this->advanceCount; $j++) {\n    \
  \                $this->iterator->next();\n                    $cur = $this->iterator->current();\n\
  \                    $this->buffer .= $cur;\n                }\n\n             \
  \   $this->position += $this->advanceCount;\n                $this->index += $this->advanceCount;\n\
  \                $this->advanceCount = null;\n                continue;\n      \
  \      }\n\n            // 将迭代器向前移动当前字符的大小。\n            // 这是因为我们希望在光标完成后，\n  \
  \          // 迭代器位于相同的位置，以便光标之外的\n            // 迭代从之后继续。\n            $this->iterator->next();\n\
  \n            $this->index += 1;\n        }\n\n        return $result;\n    }\n\
  }\n```\n\n\n\n\n## 附录 H：字符串光标\n\n本附录包含了在本书编写过程中开发的许多光标实现。关于光标的更多信息，请参阅第 15 章。\n\n\
  `ClosureStringCursor` 接受任意函数，这些函数将在输入字符串的每个位置被调用：\n\n图 26.1 `ClosureStringCursor`\
  \ 实现\n\n```php\n 1 <?php\n 2 \n 3 class ClosureStringCursor extends AbstractStringCursor\n\
  \ 4 {\n 5     protected ?Closure $callback;\n 6 \n 7     public function traverseUsing(Closure\
  \ $callback): CursorResult\n 8     {\n 9         $this->callback = $callback;\n\
  10 \n11         return $this->traverse();\n12     }\n13 \n14     public function\
  \ accept(\n15         string $current,\n16         ?string $prev = null,\n17   \
  \      ?string $next = null): ?bool\n18     {\n19         if ($this->callback ==\
  \ null) {\n20             return false;\n21         }\n22 \n23         return $this->callback->call($this,\
  \ $current, $prev, $next);\n24     }\n 25 }\n```\n\n`SqlStringsCursor` 能够从输入文本中提取\
  \ SQL 风格的单引号字符串：\n\n图 26.2 `SqlStringsCursor` 实现\n\n```php\n 1 <?php\n 2 \n 3 class\
  \ SqlStringsCursor extends AbstractStringCursor\n 4 {\n 5     public function accept(\n\
  \ 6         string $current,\n 7         ?string $prev = null,\n 8         ?string\
  \ $next = null): ?bool\n 9     {\n10         if ($this->index > 0 && $current ==\
  \ \"'\") {\n11             if ($next == \"'\") {\n12                 return $this->advance(1)->continue();\n\
  13             }\n14 \n15             return $this->skip(1)->break();\n16      \
  \   }\n17 \n18         return $this->continue();\n19     }\n20 }\n```\n\n`StringsCursor`\
  \ 能够从输入文本中提取 PHP 风格的单引号或双引号字符串，同时考虑反斜杠转义序列：\n\n图 26.3 `StringsCursor` 实现\n\n```php\n\
