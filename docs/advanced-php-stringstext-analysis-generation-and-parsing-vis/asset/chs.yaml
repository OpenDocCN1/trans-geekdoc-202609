  \n图 17.5 \n\n```\n 1 <!DOCTYPE html>\n 2 <html>\n 3     <body>\n 4         <p class=\"\
  location\">A non-profile location.</p>\n 5         <div class=\"profiles\">\n 6\
  \             <div class=\"profile\">\n 7                 <h3 class=\"name\">Alice</h3>\n\
  \ 8                 <p class=\"location\">US</p>\n 9             </div>\n10    \
  \         <div class=\"profile\">\n11                 <h3 class=\"name\">Bob</h3>\n\
  12                 <p class=\"location\">CA</p>\n13             </div>\n14     \
  \        <div class=\"profile\">\n15                 <h3 class=\"name\">Charlie</h3>\n\
  16                 <p class=\"location\">UK</p>\n17             </div>\n18     \
  \        <div class=\"profile\">\n19                 <h3 class=\"name\">Daniel</h3>\n\
  20                 <p class=\"location\">MX</p>\n21             </div>\n22     \
  \    </div>\n23     </body>\n```\n\n我们的 `locations` 数组现在将包含以下结果：\n\n图 17.6 \n\n\
  ```\n1 array:5 [\n2   0 => \"A non-profile location.\"\n3   1 => \"US\"\n4   2 =>\
  \ \"CA\"\n5   3 => \"UK\"\n6   4 => \"MX\"\n7 ]\n```\n\nSymfony 的 `DomCrawler` 包还可以修改现有\
  \ HTML 的属性。例如，我们可以将其为动态输出添加 Tailwind CSS 类，例如来自内容管理系统的输出：\n\n图 17.10 \n\n```\n1\
  \ <?php\n 2 \n3 use Symfony\\Component\\DomCrawler\\Crawler;\n 4 \n5 $html = <<<'HTML'\n\
