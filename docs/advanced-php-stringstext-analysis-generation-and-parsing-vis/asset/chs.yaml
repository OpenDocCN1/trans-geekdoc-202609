  \ 附录 I：Blade Directive Validator 实现\n\n以下代码示例是第 16 章开发的 Blade 指令验证器的完整实现：\n\n图 27.1\
  \ BladeDirectiveValidator 实现\n\n\n\n\n```php\n<?php\n\nabstract class BladeStructure\n\
  {\n    public int $startPosition = 0;\n    public int $endPosition = 0;\n    public\
  \ int $length = 0;\n    public int $line = 0;\n\n    public function getEndOffset()\n\
  \    {\n        return $this->endPosition;\n    }\n}\n\nclass ParsedDirective extends\
  \ BladeStructure\n{\n    public ?ParsedArguments $args = null;\n    public string\
  \ $directiveName = '';\n\n    public function getEndOffset()\n    {\n        if\
  \ ($this->args != null && $this->args->endPosition > 0) {\n            return $this->args->endPosition;\n\
