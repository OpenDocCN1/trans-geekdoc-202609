  \ Laravel 8, 9\n *\n * @return string\n */\npublic static function title(\n    string\
  \ $value\n);\n```\n\n`title`辅助方法将重新格式化字符串使其看起来像传统的打印标题。此方法可能会影响输入字符串中每个字符的大小。\n\n\
  以下所有示例将返回结果 `This Is A Title`：\n\n**图 3.33**\n\n```php\n<?php\n\nuse Illuminate\\\
