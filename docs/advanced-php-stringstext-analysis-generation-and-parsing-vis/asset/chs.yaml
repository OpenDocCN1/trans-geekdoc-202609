  #### 锚点\n\n#### 转义序列\n\n#### 字符类\n\n#### 子模式、捕获组和非捕获组\n\n#### 字符和模式的重复\n\n#### 确保匹配不以特定模式开头或结束\n\
  \n\n\n\n\n\n\n\n\n\n\n## 指南\n\n### 1. 开始阅读\n\n## 引言\n\n我们将涵盖许多主题，从处理 `UTF-8` 到各种\
  \ `PHP` 字符串。本书的安排使得每一章都建立在上一章的基础上。如果你发现某些主题具有挑战性，可能希望返回前面的部分。\n\n下面列出的主题并不包含每章的全部内容，但旨在提供每章所提供内容的概述。\n\
  \n### 1. 什么是字符串\n\n本章涵盖了 `PHP` 字符串以及遍历多字节字符串的技巧。\n\n### 2. 流式字符串\n\n本章介绍了 Laravel\
  \ 的流式辅助类，该类在本书中被广泛使用。\n\n## 3. 格式化辅助方法\n\n本章涵盖了通常用于格式化或转换现有字符串的 Laravel 辅助方法。示例包括标题大写化（title\
  \ casing）和将标题转换为别名（slug）。\n\n## 4. 逻辑辅助方法\n\n逻辑辅助方法有助于对字符串做出决策。主题包括判断输入字符串是否包含一个或多个字符串，以及检查文本是否以特定值开头或结束。\n\
  \n### 5. 构建辅助方法\n\n构建辅助方法允许我们从现有输入生成新字符串，或构造伪随机字符串。主题包括使用各种技术替换子串，以及确保输入始终以给定的字符序列结束。\n\
  \n## 6. 提取辅助方法\n\n提取辅助方法是一组实用方法，允许我们使用各种技术检索现有字符串的部分。示例包括将输入转换为单词列表以及检索搜索字符串之间的内容。\n\
  \n### 7. 字符串填充\n\n本章深入讨论了字符串填充（padding）的概念。主题包括简单的字符串填充、用于数字格式化的高级方法等。\n\n### 8.\
  \ 字符串翻译；单数和复数词形式\n\n本章讨论了 Laravel 提供的各种功能，帮助处理、管理和操作翻译字符串。\n\n### 9. 使用 Macros 和\
  \ Mixins 扩展 Laravel 字符串\n\n本章概述了如何扩展 Laravel 的字符串辅助类和流式字符串类。扩展 Laravel 辅助方法在本书中非常频繁。\n\
  \n### 10. 行与单词\n\n本章侧重于从输入文本中提取行和列信息，以及提取和分析单词的各种技巧。\n\n### 11. 更多行与单词\n\n本章继续讨论围绕行和单词的内容，并提供了从任意位置检索相邻单词和字符的技巧。其他主题包括估计阅读时间以及从输入文本生成首字母词。\n\
  \n### 12. 应用技巧：编写一个 Gherkin 解析器\n\n这个深度章节利用了之前章节讨论的技巧，从头到尾构建一个 Gherkin 解析器。\n\n\
  ## 13. 马尔可夫链与文本生成\n\n本章探索了使用马尔可夫链生成随机文本。讨论包括创建训练方法以及实现加权选择算法以帮助生成文本。\n\n## 14. 固定宽度数据解析\n\
  \n本章讨论了解析金融机构导出文件中常见的固定宽度数据的各种技巧。\n\n\n\n\n\n## 第 15 章：字符串分割\n\n本章的讨论围绕如何使用复杂的规则和要求分割复杂的输入文本的高级技术和方法。讨论的最后介绍了构建一个通用的、可重用的光标系统，以使从字符串中提取信息变得更加。\n\
  \n## 第 16 章：应用技术：Blade 指令验证器\n\n本章将应用书中涵盖的大多数技术来实现一个简单的 Blade 指令解析器和验证系统。验证逻辑包括检测指令是否缺少必要的参数、间距是否一致，以及错误的换行符是否会引起编译器错误。\n\
  \n## 第 17 章：HTML 操作\n\n本章探索了如何使用 Symfony 框架组件读取和操作 HTML 文档的技术。还研究了解析和分析语义上无效的 HTML\
  \ 文档的方法，例如包含嵌入模板语言的文档。\n\n## 第 18 章：正则表达式\n\n本章的讨论重点是处理各种代码库时遇到的最常见的正则表达式特征。主题包括\
  \ Laravel 的模式匹配方法、负向后行言（negative look-behinds）以及正则表达式语言入门。\n\n### PHP 版本\n\n在本书中，我们将通过许多代码示例探索许多不同的概念和想法。编写过程中使用了\
  \ `PHP 8`，但代码示例可以适配于任何现代 PHP 版本。\n\n由于决定使用 `PHP 8`，没有考虑使用 `PHP` 的函数重载特性来重载标准字符串函数，因为该功能在\
  \ `PHP` 版本 `8.0.0` 中已被移除。\n\n### Laravel 版本\n\n在编写贯穿本书的示例时，使用了最新的 `Laravel` 版本——`9.26.1`。由于\
  \ `Laravel` 框架更新频率频繁，在各个章节中涵盖的新添加辅助方法可能会存在延迟的情况。\n\n尽管我们在代码示例和练习中假设使用最新版本的 `Laravel`，但方法签名将列出\
  \ `Laravel 8` 和 `Laravel 9` 之间的任何差异，以帮助升级过程。\n\n当我们在书中引入新的辅助方法时，我们将展示该方法签名的概述。在典型的\
  \ PHP 源代码中通常看到方法描述的地方，我们将看到哪些版本的 `Laravel` 框架支持该辅助方法。\n\n例如，`lcfirst` 辅助方法是在 `Laravel\
  \ 9` 中引入的，并将具有以下方法签名：\n\n```\n 1 <?php\n 2 \n 3 /**\n   * Version: Laravel 9\n 5\
  \  *\n 6  * @return string\n 7  */\n 8 public static function lcfirst(\n 9     string\
  \ $string\n10 );\n```\n\n相比之下，`lower` 辅助方法出现在 `Laravel` 版本 `8` 和 `9` 中，两个版本的方法签名没有区别：\n\
  \n```\n 1 <?php\n 2 \n 3 /**\n 4  * Versions: Laravel 8, 9\n 5  *\n 6  * @return\
  \ string\n 7  */\n 8 public static function lower(\n 9     string $value\n10 );\n\
  ```\n\n如果一个辅助方法同时于 `Laravel 8` 和 `9` 中，但两个版本之间的签名不同，方法签名将列出两者，以便我们更容易看到差异。其中一个例子是\
  \ `wordCount` 方法签名：\n\n```\n 1 <?php\n 2 \n 3 // Version: Laravel 8\n 4 public static\
  \ function wordCount(\n 5     string $string\n 6 );\n 7 \n 8 // Version: Laravel\
  \ 9\n 9 public static function wordCount(\n10          string $string,\n11     string|null\
  \ $characters = null\n12 );\n```\n\n### 本书中使用的符号\n\n在整书中，我们会遇到少量图标。这些图标会提示额外信息和潜在的陷阱，或者引导您查看其他节省时间的资源。\n\
