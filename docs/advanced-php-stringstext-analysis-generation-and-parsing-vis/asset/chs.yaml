  \n### 11.5 实现 IndentationManager 类\n\n我们将继续在这一节介绍的许多缩进辅助方法的基础上，创建一个新的 `IndentationManager`\
  \ 类。该类能够根据行的相对缩进将行分组在一起。为了帮助理清我们将要构建的内容，让我们复用以下文本：\n\n图 11.32 \n\n```\n1 L01\n2\
  \     L02\n3         L03\n4         L04\n5     L05\n```\n\n通过我们即将共同构建的类，我们能够获取第一行的以下直接祖先，因为它们比第一行多缩进了一层：\n\
  \n- L02\n- L05\n\n此外，我们还可以获取第一行下的第二到五行的所有行，因为它们的缩进级别都嵌套在第一行之下。\n\n在开始实现之前，我们需要在现有的\
  \ `TextIndentation` 类中添加几个新属性。这些新属性将用于存储哪些行是任何给定行的直接祖先，以及任何给定行之下的所有行：\n\n图 11.33\
  \ \n\n```php\n 1 <?php\n 2 \n 3 class TextIndentation\n 4 {\n 5     public function\
  \ __construct(\n 6         public string $line,\n 7         public int $lineNumber,\n\
  \ 8         public int $leadingWhitespace,\n 9         public int $indentCount,\n\
  10     ) {}\n11 \n12     /**\n13      * @var TextIndentation[]\n14      */\n15 \
  \    public $nestedLines = [];\n16 \n17     /**\n18      * @var TextIndentation[]\n\
  19      */\n20     public $allNestedLines = [];\n21 }\n```\n\n我们将使用以下 shell（骨架）来实现我们的\
  \ `IndentationManager`，我们将实现每个空方法并在过程中讨论更改：\n\n图 11.34 IndentationManager 类概览 \n\
  \n```php\n 1 <?php\n 2 \n3 use Illuminate\\Support\\Str;\n 4 \n5 class IndentationManager\n\
  \ 6 {\n 7     /**\n 8      * @var TextIndentation[]\n 9      */\n10     protected\
  \ $lines;\n11 \n12     /**\n13      * @var int\n14      */\n15     protected $numberOfLines;\n\
  16 \n17     public function __construct(string $value, $tabSize = 4)\n18     {\n\
  19         $this->lines = Str::indentation($value, $tabSize);\n20         $this->numberOfLines\
  \ = count($this->lines);\n21         $this->groupIndentation();\n22     }\n23 \n\
  24     public function getLines()\n25     {\n26         return $this->lines;\n27\
  \     }\n28 \n29     private function groupIndentation()\n30     {\n31     }\n32\
  \ \n33     protected function nestLines($start)\n34 }\n```\n\n我们的构造函数一开始做了几件事。第一件事是使用现有方法计算输入文本的所有相对缩进和空格。之后，我们将行数存储在一个内部变量中。最后，我们调用一个尚未实现的内部方法\
  \ `groupIndentation`。\n\n让我们看看 `groupIndentation` 方法的实现：\n\n图 11.35 实现 groupIndentation\
  \ 方法\n\n```php\n 1 <?php\n 2 \n3 class IndentationManager\n 4 {\n 5 \n6     // ...\n\
  \ 7 \n8     private function groupIndentation()\n 9     {\n10         if ($this->numberOfLines\
  \ == 0) {\n11             return;\n12         }\n13 \n14         for ($i = 0; $i\
  \ < $this->numberOfLines; $i++) {\n15             if (str($this->lines[$i]->line)->trim->length\
  \ == 0) {\n16                 continue;\n17             }\n18 \n19             $this->nestLines($i);\n\
  20         }\n21     }\n```\n\n我们做的第一件事是检查行数是否为零；如果是，我们返回方法，因为没有需要处理的内容。如果有需要处理的行，下一步遍历每一行并调用另一个方法\
  \ `nestLines`。只有当行的修剪后长度非零时，我们才调用这个内部方法，因为空行会增加分析噪音并使问题复杂化。\n\n我们的下一步是实现 `nestLines`\
  \ 方法，它将执行输入文本行的实际嵌套，并且是最中最复杂的方法：\n\n图 11.36 实现 nestLines 方法\n\n```php\n 1 <?php\n\
  \ 2 \n3 class IndentationManager\n 4 {\n 5 \n6     // ...\n 7 \n8     protected\
  \ function nestLines($start)\n 9     {\n10         $line = $this->lines[$start];\n\
  11 \n12         if ($start + 1 >= $this->numberOfLines) {\n13             return;\n\
  14         }\n15 \n16         $nestedLines = [];\n17 \n18         for ($i = $start\
  \ + 1; $i < $this->numberOfLines; $i++) {\n19             $current = $this->lines[$i];\n\
  20 \n21             if ($current->indentCount <= $line->indentCount &&\n22     \
  \            str($current->line)->trim->length > 0) {\n23                 break;\n\
  24             }\n25 \n26             $nestedLines[] = $current;\n27         }\n\
  28 \n29         if (count($nestedLines) == 0) {\n30             return;\n31    \
  \     }\n32 \n33         $firstIndent = $nestedLines[0]->indentCount;\n34 \n35 \
  \        // Find 第一个非零缩进，如果有的话\n36         if ($firstIndent == 0) {\n37        \
  \     for ($i = 1; $i < count($nestedLines); $i++) {\n38                 if ($nestedLines[$i]->indentCount\
  \ > 0) {\n39                     $firstIndent = $nestedLines[$i]->indentCount;\n\
  40                     break;\n41                 }\n42             }\n43      \
  \   }\n44 \n45         $line->allNestedLines = $nestedLines;\n46 \n47         $line->nestedLines\
  \ = collect($nestedLines)\n48             ->filter(function ($line) use ($firstIndent)\
  \ {\n49             return $line->indentCount == $firstIndent;\n50         })->values()->all();\n\
  51     }\n52 \n53     // ...\n54 }\n```\n\n我们的 `nestLines` 方法接受要嵌套的行的索引作为唯一参数；我们做的第一件事是检查当前行之后是否有更多行。如果没有，我们直接从方法返回。\n\
  \n在第 18 到第 27 行之间，我们开始遍历当前行之后的所有行。我们正在收集所有出现在当前行之后且缩进深度`大于`当前行的行。这是通过在第一次遇到缩进级别等于或小于当前行的时跳出循环来实现的。\n\
  \n第 29-31 行检查是否找到了需要嵌套的行。如果没有，我们提前返回方法。\n\n在第 33 到 43 行之间，我们正在寻找之前收集的行中的第一个最小缩进。我们检查解析出的第一个缩进是否为零，如果是，将其替换为非零值。\n\
  \n我们在最后一步（第 47-50 行）使用获取的相对缩进级别来填充内部属性 `nestedLines`，仅包含直接嵌套在目标行下的行。这与第 45 行形成对比，在第\
  \ 45 行中，我们为内部属性 `allNestedLines` 所有发现的行，无论它们的相对深度如何。\n\n这内容很多，但我们还是完成了。现在我们可以这样使用我们的类：\n\
  \n图 11.37 \n\n```php\n 1 <?php\n 2 \n3 $text = <<<TEXT\n4 L01\n5     L02\n6    \
  \     L03\n7         L04\n8     L05\n9 TEXT;\n10\n11 \n12 $indentation = new IndentationManager($text);\n\
  13 \n14 $lines = $indentation->getLines();\n15 $firstLine = $lines[0];\n```\n\n\n\
  \n\n这将产生类似于以下输出的结果（为了格式化，已移除了大多数嵌套属性）：\n\n图 11.38 `IndentationManager` 示例输出\n\n\
  ```\n 1 TextIndentation {\n 2   line: \"L01\",\n 3   lineNumber: 1,\n 4   leadingWhitespace:\
  \ 0,\n 5   indentCount: 0,\n 6   nestedLines: [\n 7     TextIndentation {\n 8  \
  \     line: \"    L02\",\n 9       lineNumber: 2,\n10       leadingWhitespace: 4,\n\
  11       indentCount: 1,\n12       nestedLines: [\n13         TextIndentation {\n\
  14           line: \"        L03\",\n15           lineNumber: 3,\n16           leadingWhitespace:\
  \ 8,\n17           indentCount: 2,\n18         },\n19         TextIndentation {\n\
  20           line: \"        L04\",\n21           lineNumber: 4,\n22           leadingWhitespace:\
  \ 8,\n23           indentCount: 2,\n24         },\n25       ],\n26       allNestedLines:\
  \ [ /* L03, L04 */ ],\n27     },\n 28     TextIndentation {\n29       line: \" \
  \   L05\",\n30       lineNumber: 5,\n31       leadingWhitespace: 4,\n32       indentCount:\
  \ 1,\n33     },\n34   ],\n35   allNestedLines: [ /* L02, L03, L04, L05 */ ],\n36\
  \ }\n```\n\n## 12. 应用技术：编写 Gherkin 解析器\n\n在为一个简单语言解析器编写示例概念时，我在 `Laravel News` 上读到了这名为《Laravel\
  \ 中的行为驱动开发》的文章。在这篇文章中，多次提到了一种名为 `Gherkin` 的测试语言。\n\n`Gherkin` 是一种基于缩进的语言，允许开发人员以类似于自然语言（如英语或法语）的方式编写软件测试。我们不会解释如何使用\
  \ `Gherkin` 来运行测试，而是探索该语言的结构，并用 `PHP` 编写一个处理它的解析器。\n\n虽然我们不想深入讨论用 `Gherkin` 编写的测试最终是如何使用的，但在开始编写解析器之前，我们需要查看大量的语言示例以了解我们正在处理的内容。让我们来看来自\
  \ `Gherkin Reference` 的以下代码示例：\n\n图 12.1 `Gherkin` 特性\n\n```\n 1 Feature: Guess\
  \ the word\n 2 \n 3   # 第一个示例有两个步骤\n 4   Scenario: Maker starts a game\n 5     When\
  \ the Maker starts a game\n 6     Then the Maker waits for a Breaker to join\n 7\
  \ \n 8   # 第二个示例有三个步骤\n 9   Scenario: Breaker joins a game\n10     Given the Maker\
  \ has started a game with the word \"silky\"\n11     When the Breaker joins the\
  \ Maker's game\n12     Then the Breaker must guess the word\n```\n\n这将产生类似于以下输出的结果（为了格式化，已移除了大多数嵌套属性）：\n\
  \n图 11.38 `IndentationManager` 示例输出\n\n```\n 1 TextIndentation {\n 2   line: \"\
  L01\",\n 3   lineNumber: 1,\n 4   leadingWhitespace: 0,\n 5   indentCount: 0,\n\
  \ 6   nestedLines: [\n 7     TextIndentation {\n 8       line: \"    L02\",\n 9\
  \       lineNumber: 2,\n10       leadingWhitespace: 4,\n11       indentCount: 1,\n\
  12       nestedLines: [\n13         TextIndentation {\n14           line: \"   \
  \     L03\",\n15           lineNumber: 3,\n16           leadingWhitespace: 8,\n\
  17           indentCount: 2,\n18         },\n19         TextIndentation {\n20  \
  \         line: \"        L04\",\n21           lineNumber: 4,\n22       leadingWhitespace:\
  \ 8,\n23           indentCount: 2,\n24         },\n25       ],\n26       allNestedLines:\
  \ [ /* L03, L04 */ ],\n27     },\n 28     TextIndentation {\n29       line: \" \
  \   L05\",\n30       lineNumber: 5,\n31       leadingWhitespace: 4,\n32       indentCount:\
  \ 1,\n33     },\n34   ],\n35   allNestedLines: [ /* L02, L03, L04, L05 */ ],\n36\
  \ }\n```\n\n\n\n\nFeature（特性）是一个系列场景或示例的列表。每个场景或示例由一系列步骤组成。每个场景或示例可能关联一个数据表格，该表格本身包含一个行列表，而每行又包含一个单元格列表。\n\
  \n列表嵌套列表，再嵌套。\n\n### 12.1 建模 Gherkin\n\n每当我开始一个重大的解析或静态分析项目时，我喜欢先思考我希望在项目结束时使用的数据模型。我发现这有助于在最后产生`valuable`的实例，并允许我在思考最终结果时，不被实现解析器本身时总是出现的那些细微细节和问题所分心。当过多的解析器实现细节渗透到最终数据模型中时，生成的最终结果通常会让人觉得处理非常困难且不友好。\n\
  \n如果你在项目中采用这种方法，你可能会在实现解析器的过程中发现数据模型中的缺陷和问题。你可能会发现对象之间的关系方式可以改进，或者表示特定数据的方式也可能发生变化。当这种情况发生时，你不应该感到气馁。在我写这一节时，我已经预先体验了创建数据模型、实现解析器并在自己的实现中发现这类问题的过程。你在完成这些项目时会发现问题；不要感到气馁。\n\
  \n回顾我们对 Gherkin 语言的简短介绍，我们知道在大多数情况下，所有行都会以关键字开头，注释可以出现在文档的任何位置。此外，我们理解每个结构都出现在文档中的特定位置。例如，对于人类来说，用行和列来考虑这些更容易。但从软件的角度来看，处理结构在文档中出现的起始偏移量（offset）要容易得多。回想在第\
  \ 10 章中，我们实现了 `CharacterPositionLocator` 类，它可以将相对位置转换为行号和列号。这在我们的解析器实现中将非常有用。\n\n\
  记住这些信息，我们可以说我们解析的几乎所有内容都包含以下信息：\n\n* 结构在文档中的起始位置，\n* 结构周围出现的任何注释，\n* 标识特性类型的关键字\n\
  \n我们可以使用 PHP 中的以下两个类来表示这些信息。需要注意的是，我们的 `Comment` 类也扩展了我们的 `Block` 类，这使其能够继承我们通用块类的所有属性：\n\
  \n图 12.4 Gherkin 块与注释模型\n\n```\n 1 <?php\n 2 \n3 class Block\n4 {\n5     /**\n6\
  \      * 块的起始偏移量。\n7      *\n8      * @var int\n9      */\n10     public int $start;\n\
  11 \n12     /**\n13      * 块下方所有注释的列表。\n14      *\n15      * @var Comment[]\n16\
  \      */\n17     public array $comments = [];\n18 \n19     /**\n20      * 块的规范化\
  \ Gherkin 关键字。\n21      *\n22      * @var string\n23      */\n24     public string\
  \ $keyword = '';\n25 }\n26 \n27 /**\n28  * 表示 Gherkin 注释。\n29  *\n30  * @see https://cucumber.io/docs/gherkin/reference\n\
  31  */\n32 class Comment extends Block\n33 {\n34     /**\n35      * 注释的文本。\n36 \
  \     *\n37      * @var string\n38      */\n39     public string $text;\n40 }\n\
  ```\n\n我们将继续数据建模过程，并刻意遵循一个可能被认为是典型的顺序。例如，我们不会先对特性或场景进行建模，因为它们依赖于我们尚未建模的其他结构。可以独立考虑的结构列表有：\n\
  \n* 场景标签（Scenario Tags）\n* 步骤参数（Step Parameters）\n* 文档字符串（Doc Strings）\n* 数据表格（Data\
  \ Tables）\n\n一旦我们有了这些，就可以开始通过它们组合更大的结构。此外，利用这种方法将允许我们简要讨论在本章开头没有涵盖的每个 Gherkin 特性。首先让我们解决最具有挑战性的结构：数据表格。我希望你从先处理最复杂的结构中获得的收获一点是：尽管它看起来很有挑战性，但我们即使是最复杂的结构也可以拆解为基础块。\n\
  \n开始，我们需要查看 Gherkin 数据表格。在`图 12.5` 中，我们可以看到 Gherkin 数据表格看起来非常像 Markdown 表格：\n\n\
  图 12.5 Gherkin 数据表格示例\n\n```\n1 Feature: Feature Name\n2 \n3   Scenario: Scenario\
  \ Name\n4     Given the following users exist:\n5       | name   | email       \
  \       |\n6       | User1  | user1@example.org  |\n7       | User2  | user2@example.org\
  \  |\n8       | User3  | user3@example.org  |\n```\n\n每个数据表格行都以管道符（pipe）开头和结束，我们可以在稍后实现解析器时利用这一点作为我们的优势。目前，我们只关心此对象的实际结构。我们可以将数据表格拆分为以下组件：\n\
  \n* 数据表格（Data Table）：一个包含行的对象\n* 行（Row）：一个包含单元格的对象\n* 单元格（Cell）：一个包含单个值的实体\n\n我们可以使用`图\
  \ 12.6`中的类集合来表示数据表格：\n\n图 12.6 Gherkin 数据表格模型\n\n```\n 1 <?php\n 2 \n3 class DataBlock\n\
  4 {\n5     /**\n6      * 块的起始偏移量。\n7      *\n8      * @var int\n9      */\n10  \
  \   public int $start;\n11 \n12     /**\n13      * 块的结束偏移量。\n14      *\n15     \
  \ * @var int\n16      */\n17     public int $end;\n18 }\n19 \n20 /**\n21  * 表示 Gherkin\
  \ DataTable。\n22  *\n23  * 用于提供步骤定义的值列表。\n24  *\n25  * @see https://cucumber.io/docs/gherkin/reference/#data-tables\n\
  26  */\n27 class DataTable extends DataBlock\n28 {\n29     /**\n30      * @var TableRow[]\n\
  31      */\n32     public array $rows = [];\n33 }\n34 \n35 /**\n36  * 表示 DataTable\
  \ 中的单行。\n37  */\n38 class TableRow extends Block\n39 {\n40     /**\n41      * @var\
  \ TableCell[]\n42      */\n43     public array $cells = [];\n44 }\n45 \n46 /**\n\
  47  * 存储 TableRow 中的单个单元格值。\n48  */\n49 class TableCell extends Block\n50 {\n51\
  \     public function __construct(public string $value)\n52     { }\n53 }\n```\n\
  \n你会注意到我们还定义了一个新的基类：`DataBlock`。我们将此基类用于数据表格和文档字符串，因为这些结构可以跨多行。我们没有将其用于其他结构（如特性或场景），因为大多数子组件位于文档的单行内。\n\
  \n现在让我们两个两个字符串的示例，并接下来为它们创建模型。在 Gherkin 中，我们通过在独立行上连续的双引号或连续的反引号包围文档字符串的内容来声明文档字符串：\n\
  \n图 12.7 \n\n```\n1 Feature: Feature Name\n2 \n3   Scenario: Doc String Example\
  \ One\n4     Given a blog post named \"Random\" with Markdown body\n5       \"\"\
  \"\n6       Some Title, Eh?\n7       ===============\n8       Here is the first\
  \ paragraph of my blog post. Lorem ipsum dolor\n9       consectetur adipiscing elit.\n\
  10       \"\"\"\n11 \n12   Scenario: Doc String Example Twoc\n13     Given a blog\
  \ post named \"Random\" with Markdown body\n14       '''\n15       Some Title, Eh?\n\
  16       ===============\n17       Here is the first paragraph of my blog post.\
  \ Lorem ipsum dolor\n18       consectetur adipiscing elit.\n19       '''\n```\n\n\
  与我们的数据表格一样，文档字符串从某个位置开始并可以跨多行。对于任何处理我们解析器返回的模型的人来说有两个信息可能有用：\n\n* 内容（Content）：文档字符串的实际内容\n\
  \n\n\n\n\n*   `Delimiter`: 文字符串（doc string）是否使用双引号或反引号创建\n\n我们可以对其进行如下建模：\n\n图 12.8\
  \ Gherkin DocString 模型 \n\n```php\n 1 <?php\n 2 \n 3 /**\n 4  * 表示 Gherkin DocString\n\
  \ 5  *\n 6  * 可以以 \"\"\" 或 ``` 开头\n\n 7  *\n 8  * @see https://cucumber.io/docs/gherkin/reference/#doc-strings\n\
  \n 9  */\n10 class DocString extends DataBlock\n11 {\n12     public string $content\
  \ = '';\n13     public string $delimiter = '';\n14 }\n```\n\n下一个要建模结构是是与场景（scenarios）关联的标签（tags）。**图\
  \ 12.9** 展示了标签可能出现在 Gherkin 文档中：\n\n图 12.9 Gherkin 标签示例 \n\n```\n1 Feature: Feature\
  \ Name\n2 \n3   @tagOne @tagTwo @tagThree\n4   Scenario: Doc String Example One\n\
  5     Given a blog post named \"Random\" with Markdown body\n```\n\n我们实际上只需要跟踪标签的内容，可以使用以下\
  \ PHP 类来实现：\n\n图 12.10 建模 Gherkin 标签 \n\n```php\n 1 <?php\n 2 \n 3 /**\n4  * 表示\
  \ Gherkin 场景标签（Scenario Tag）\n 5  *\n 6  * 场景标签定义为 @tag @tag2 等。\n 7  */\n8 class\
  \ Tag extends Block\n9 {\n10     /**\n11      * 标签的名称。\n12      *\n13      * @var\
  \ string\n14      */\n15     public string $name;\n16 }\n```\n\nGherkin 步骤参数（step\
  \ parameters）的建模方式将与标签类似，但它们作为步骤文本的一部分出现在文档中：\n\n图 12.11 Gherkin 步骤参数示例 \n\n```\n\
  1 Feature: Feature Name\n2 \n3   Scenario Outline: eating\n4     Given there are\
  \ <start> cucumbers\n5     When I eat <eat> cucumbers\n6     Then I should have\
  \ <left> cucumbers\n```\n\n我们的步骤参数模型将与标签模型相似：\n\n图 12.12 建模 Gherkin 步骤参数 \n\n```php\n\
  \ 1 <?php\n 2 \n 3 /**\n4  * 表示 Gherkin 步骤参数。\n 5  *\n 6  * 步骤参数定义为 <param> <param2>\
  \ 等。\n 7  *\n 8  * @see https://cucumber.io/docs/gherkin/reference/#step-parameters\n\
  \ 9  */\n10 class Parameter extends Block\n11 {\n12     /**\n13      * 参数的名称。\n\
  14      *\n15      * @var string\n16      */\n17     public string $name;\n18 }\n\
  ```\n\n下一个要添加到我们模型中的 Gherkin 结构将是单个步骤（individual steps）。从我们目前所，，我们知道步骤可以包含以下信息：\n\
  \n*   `Text`：步骤的实际文本\n*   `Data Table`：该步骤的额外数据列表\n*   `Doc String`：添加到步骤参数列表末尾的多行字符串\n\
  *   `Parameters`：在步骤文本中使用角括号定义的参数列表\n\n幸运的是，我们已经建模了所有可能出现在步骤中的额外信息，现在可以创建我们的第一个由其他实体组成的模型对象了：\n\
  \n图 12.13 建模 Gherkin 步骤 \n\n```php\n 1 <?php\n 2 \n 3 /**\n4  * 表示 Gherkin 场景步骤（Scenario\
  \ Step）\n 5  *\n 6  * @see https://cucumber.io/docs/gherkin/reference/#steps\n 7\
  \  */\n8 class Step extends Block\n9 {\n10     /**\n11      * 步骤的指令或文本。\n12    \
  \  *\n13      * @var string\n14      */\n15     public string $text;\n16 \n17  \
  \   /**\n18      * 步骤的数据块列表。\n19      *\n20      * 可能包含 DocString 或 DataTable。\n\
  21      *\n22      * @var DataBlock[]\n23      */\n24     public array $data = [];\n\
  25 \n26     /**\n27      * 步骤的参数列表。\n28      *\n29      * @var Parameter[]\n30 \
  \     */\n31     public array $parameters = [];\n32 }\n```\n\n注意我们的 `$data` 数组是如何类型提示为直接使用通用的\
  \ `DataBlock` 类，而不是 `DataTable` 或 `DocString` 类。这为存储两种数据类型提供了一个地方；任何使用我们模型的人都可以检查。\n\
  \n下一个要建模的 Gherkin 结构是示例表格（Examples）。它们出现在场景大纲（scenario outline）中，并为场景提供数据：\n\n图\
  \ 12.14 Gherkin 场景大纲\n\n```\n1   Given there are <start> cucumbers\n3   When I eat\
  \ <eat> cucumbers\n4   Then I should have <left> cucumbers\n```\n\n建模这种结构非常简单，我们只需要一个\
  \ `DataTable` 实例。图 12.15 建模 Gherkin \n\n```php\n 1 <?php\n 2 \n 3 /**\n4  * 表示示例表格（Examples）\n\
  \ 5  *\n6  */\n7 Examples extends Block\n8 {\n9     /**\n10      * 数据表。\n11    \
  \  *\n12      * @var DataTable\n13      */\n14     public DataTable $table;\n15\
  \ }\n```\n\n图 12.16 Gherkin 场景 \n\n```\n1 Feature: Feature Name\n2\n```\n\n你可以看到，新的\
  \ PHP 类开始包含更多内容。图 12.17 建模 Gherkin \n\n```php\n 1 <?php\n 2 \n 3 /**\n4  * 表示场景（Scenario）\n\
  \ 5  *\n 6  * @see https://cucumber.io/docs/gherkin/reference/\n 7  */\n8 class\
  \ Scenario extends Block\n9 {\n10     /**\n11      * 步骤的指令或文本。\n12      *\n13  \
  \    * @var string\n14      */\n15     public string $text;\n16 \n17     /**\n18\
  \      * 步骤的数据块列表。\n19      *\n20      * @var DataBlock[]\n21      */\n22     public\
  \ array $data = [];\n23 \n24     /**\n25      * 步骤的参数列表。\n26      *\n27      * @var\
  \ Parameter[]\n28      */\n29     public array $parameters = [];\n30 \n31     /**\n\
  32      * 场景的标签。\n33      *\n34      * @var Tag[]\n35      */\n36     public array\
  \ $tags = [];\n37 }\n```\n\nGherkin 包含几个与场景非常相似的结构。这些结构包括：\n\n*   `Background`：用于\
  \ feature 中所有场景的通用步骤。\n*   `Scenario Outline`：用于使用不同的值运行相同的 Gherkin 测试场景。\n*   `Rule`：将\
  \ feature 中的场景分组。概念上与标签类似，但代表的是业务规则而不是组织场景的方式。\n\n**图 12.18** 包含一个 Gherkin 背景示例：\n\
  \n```\n1 Feature: Multiple site support\n2   Only blog owners can post to a blog,\
  \ except administrators,\n3   who can post to all blogs.\n4 \n5   Background:\n\
  6     Given a global administrator named \"Greg\"\n7     And a blog named \"Greg's\
  \ anti-tax rants\"\n8     And a customer named \"Dr. Bill\"\n9     And a blog named\
  \ \"Expensive Therapy\" owned by \"Dr. Bill\"\n```\n\n**图 12.19** 展示了一个 Gherkin\
  \ 场景大纲示例：\n\n```\n1 Feature: Feature Name\n2 \n3   Scenario Outline: eating\n4 \
  \    Given there are <start> cucumbers\n5     When I eat <eat> cucumbers\n6    \
  \ Then I should have <left> cucumbers\n7 \n8     Examples:\n9         | start |\
  \ eat | left |\n10         | 12 | 5 | 7 |\n11         | 20 | 5 | 15 |\n```\n\n由于这两个块类型包含的信息与场景大部分相同，我们可以简单地扩展我们的\
  \ Scenario 类：\n\n图 12.20 建模 Gherkin 场景大纲和背景 \n\n```php\n 1 <?php\n 2 \n 3 /**\n\
  4  * 表示 Gherkin 场景大纲（Scenario Outline）\n 5  *\n 6  * @see https://cucumber.io/docs/gherkin/reference/#scenario-outline\n\
  \ 7  */\n8 class ScenarioOutline extends Scenario\n{}\n```\n\n\n\n\n```php\nclass\
  \ ScenarioOutline extends Scenario\n{\n\n}\n\n/**\n * 代表一个 Gherkin 背景（Background）\n\
  \ *\n * @see https://cucumber.io/docs/gherkin/reference/#background\n */\nclass\
  \ Background extends Scenario\n{\n\n}\n```\n\n我们可以为数据模型生成一个高层的可视化图，帮助我们理解所有部分是如何结合在一起的：\n\
  \n![](img/gherkin_relationships.png)\n\n通过创建我们想要解析的所有 Gherkin 结构及其关系的表示形式，我们实际上是生成了一个抽象语法树（AST）的定义。我们输入的\
  \ Gherkin 程序通过我们的解析器，将转换为表示我们功能测试套件的节点树。我没有在这一节的开头使用“抽象语法树”这个词，是因为有时用听起来很困难的名字来描述事物，可能会在认知上让事情变得比必要的复杂。\n\
  \n数据模型就绪后，我们就可以开始编写 Gherkin 解析器的实现。\n\n### 12.2 Gherkin 词法分析器（Lexer）\n\n在解析文本时，词法分析器（Lexer）是一个有趣的话题，因为它经常与解析器（Parser）本身混淆。如果我们看图\
  \ 12.21 中的 Gherkin 示例，我们可以看到有很多单独的字符和单词，甚至可能很难弄清楚该从哪里开始解析它：\n\n图 12.21 一个 Gherkin\
  \ 程序示例\n\n```\n 1 Feature: Overdue tasks\n2   Let users know when tasks are overdue,\
  \ even when using other\n3   features of the app\n4\n5\nRule: Users are notified\
  \ about overdue tasks on first use of the day\n6     Background:\n7       Given\
  \ I have overdue tasks\n8\n9     Example: First use of the day\n10       Given I\
  \ last used the app yesterday\n11       When I use the app\n12       Then I am notified\
  \ about overdue tasks\n```\n\n从解析器的角度来看，直接处理单个字符或整个单词可能是复杂的。如果我们能够在更高层次的结构上工作，将会有用得多。这就是词法分析器的用武之地。\n\
  \n由于 Gherkin 是一种基于缩进的语言，如果我们能够对整个行进行操作，实现解析的效率将大大提高。此外，如果我们已经知道了行的相对缩进和行之间的关系，将进一步加速解析器的开发。这与其他语言不同，在其他语言中，将词法分析和解析阶段合并为一个步骤是有意义的。\n\
  \n如果你记得，在第 11 章结束时，我们了一个 `IndentationManager` 类，它能够将一段文本拆分为 `TextIndentation` 对象列表，并存储了相对缩进信息。我们实际上可以将其作为\
  \ Gherkin 解析器的词法分析器！\n\n为了说明这一点，请看图 12.22，我们将一个简单的 Gherkin 程序传递给 `IndentationManager`\
  \ 实例：\n\n图 12.22\n\n```\n 1 <?php\n2\n3 $text = <<<GHERKIN\n4 Feature: Feature Name\n\
  5\n6   Scenario Outline: eating\n7     Given there are\n8 GHERKIN;\n9\n10\n11 $indentation\
  \ = new IndentationManager($text);\n12 $lines = $indentation->getLines();\n```\n\
  \n如果我们检查结果，将会发现一些类似于图 12.23 的内容：\n\n```\n 1 array:\n2 0 => TextIndentation\n3  \
  \   line: \"Feature Name\"\n4     lineNumber: 1\n5     leadingWhitespace: 0\n6 \
  \    indentCount: 0\n7     nestedLines: array:\n8       0 => TextIndentation\n9\
  \         line: \"Scenario Outline: eating\"\n10        lineNumber: 3\n11      \
  \  leadingWhitespace: 2\n12        indentCount: 1\n13        nestedLines: array:\n\
  14          0 => TextIndentation\n15            line: \"Given there are\"\n16  \
  \          lineNumber: 4\n17            leadingWhitespace: 4\n18            indentCount:\
  \ 2\n19            nestedLines: []\n20          }\n21        ]\n22        nestedLines:\
  \ array[\n23          // Line 3\n24        ]\n25     ]\n26     nestedLines: array[\n\
  27       // Line 1\n28       // Line 2\n29       // Line 3\n30     ]\n```\n\n通过查看\
  \ `IndentationManager` 的结果，我们已经通过 `TextIndentation` 实例表示了大部分结构。文档中的每一行都由一个 `TextIndentation`\
  \ 实例表示。\n\n### 12.3 实现 Gherkin 解析器\n\n我们现有的 `IndentationManager` 类对实现解析器有很大帮助，但我们仍然有很多工作要做。我们应该首先处理\
  \ Gherkin 关键字的复杂性。在本章开头，我们简要提到过 Gherkin 可以本地化。我们可以从它们的文档中找到以下示例：\n\n图 12.24\n\n\
  ```\n1 Funksjonalitet: Gjett et ord\n2\n3   Eksempel: Ordmaker starter spill\n4\
  \     Når Ordmaker starter spill\n5     Gitt at ord \"bløtt\"\n6     Når starter\
  \ spill på 5 bokstaver\n```\n\n这对于致力于实现解析器的我们来说，提出了一个特别有趣的挑战：在寻找不同的 Gherkin 功能时，我们不能直接依赖关键字。相反，我们必须依赖于关键字到解析器可以使用的已知集合的内部映射。有时，确定应该从哪里开始解析器可能是挑战性的，但这里似乎是一个很好的起点。\n\
  \n让我们来看图 12.25，在图中我们开始解析器的实现：\n\n图 12.25 定义我们的 Gherkin 关键字\n\n```php\n 1 <?php\n\
  2\n3 class GherkinParser\n4 {\n5\n6     /**\n7      * @var CharacterPositionLocator\n\
  8      */\n9     protected CharacterPositionLocator $locator;\n10\n11     /**\n\
  12      * 用于启动新代码块的关键字列表\n13      *\n14      * @var string[]\n15      */\n16   \
  \  protected array $gherkinKeywords = [\n17         'feature' => 'Feature:',\n18\
  \         'rule' => 'Rule:',\n19         'background' => 'Background:',\n20    \
  \     'scenario' => 'Scenario:',\n21         'scenario_outline' => 'Scenario Outline:',\n\
  22         'scenario_template' => 'Scenario Template:',\n23         'example' =>\
  \ 'Example:',\n24         'examples' => 'Examples:',\n25         'scenarios' =>\
  \ 'Scenarios:',\n26     ];\n27\n28     /**\n29      * 用于启动新步骤的关键字列表\n30      *\n\
  31      * @var string[]\n32      */\n33     protected array $stepKeywords = [\n\
  34         'given' => 'Given ',\n35         'when' => 'When ',\n36         'then'\
  \ => 'Then ',\n37         'and' => 'And ',\n38         'but' => 'But ',\n39    \
  \     '*' => '* ',\n40     ];\n41 }\n```\n\n\n\n\n\n在第 16 到第 26 行之间，我们正在一组内部关键字与我们之前讨论的不同结构元素类型之间创建映射关系。同样，在第\
  \ 33 到第 40 行之间，我们正一组内部关键字映射到可能指示 Gherkin 步骤开始的各种关键字。\n\n我们的下一步将是编写 `parse` 方法的初始版本。使用我们解析器的开发者可以调用\
  \ `parse` 将他们的 Gherkin 程序转换为我们之前定义的数据模型。目前，我们的 `parse` 方法只负责执行清理工作，并为我们使用设置额外的内部变量。\n\
  \n图 12.26 `parse` 方法的骨架\n\n```php\n 1 <?php\n 2 \n3 use Illuminate\\Support\\Str;\n\
  \ 4 \n5 class GherkinParser\n 6 {\n 7 \n 8     // ...\n 9\n10     /**\n11      *\
  \ 解析提供的 Gherkin 文本。\n12      *\n13      * @param string $value 要解析的字符串。\n14    \
  \  * @param int $tabSize 制表符大小。\n15      * @return Feature|null\n16      */\n17\
  \     public function parse(string $value, int $tabSize = 2): ?Feature\n18     {\n\
  19         $value = Str::normalizeEol($value);\n20         $this->locator = new\
  \ CharacterPositionLocator($value);\n 21 \n22         $indentationManager = new\
  \ IndentationManager($value, $tabSize);\n 23         $lines = $indentationManager->getLines();\n\
  \ 24 \n25         return null;\n26     }\n 27 \n28     // ...\n29 }\n```\n\n在第 17\
  \ 行，我们调用了在之前的章节中创建的 `normalizeEol` 辅助方法。这样做是为了我们在处理输入文本时可以假设有一种一致的行结束样式。之后，我们创建了同样创建过的\
  \ `CharacterPositionLocator` 类的新实例；我们将在共同实现的第一个辅助方法中使用它。\n\n第 20-21 行创建了一个新的 `IndentationManager`\
  \ 实例并获取带有缩进信息的字符串。这将是我们稍后启动主解析序列的地方，但我们还没有完全准备好。\n\n如果你还记得，在我们围绕 Gherkin 词器的讨论中，我们谈过如何使用缩进管理器为我们的解析器提供信息。此外，当我们对\
  \ Gherkin 结构进行建模时，我们想要在创建的所有对象中存储的数据之一就是它们在文档中的位置。\n\n我们在本节中实现的解析方法几乎总是会收到来自缩进管理器的\
  \ `TextIndentation` 实例。我们可以利用该实例提供的信息以及我们在**图 12.26** 中创建的本地 `CharacterPositionLocator`\
  \ 实例来实现一个辅助的 `lineToPosition` 方法：\n\n图 12.27\n\n```php\n 1 <?php\n 2 \n3 use Illuminate\\\
  Support\\Str;\n 4 \n5 class GherkinParser\n 6 {\n 7 \n 8     // ...\n 9\n10    \
  \ /**\n11      * 返回提供行的位置。\n12      *\n13      * @param TextIndentation $line 行。\n\
  14      * @return int\n15      */\n16     protected function lineToPosition(TextIndentation\
  \ $line): int\n17     {\n18         return $this->locator->getCharPositionFromLineColumn(\n\
  19             $line->lineNumber, $line->leadingWhitespace + 1\n20         );\n\
  21     }\n 22 \n 23     // ...\n24 }\n```\n\n我们在整个解析器的实现过程中将频繁使用此方法。如你所见，它只是要求我们的位置定位器根据行号返回提供的文本缩进行的偏移量。我们使用前导空白字符的总量作为列号。\n\
  \n你可能注意到我们在前导空白值上加了 1。我们这样做是因为如果一行*没有*前导空白，其值值为 0，这对于我们的定位器类来说不是一个有效的从 1 开始的列位置。\n\
  \n### 解析 Gherkin 注释\n\n为了逐步实现更细致的解析方法，让我们从我们可以解析的较简单结构之一开始：Gherkin 注释。**图 12.28**\
  \ 提了一个 Gherkin 注释的示例：\n\n图 12.28 Gherkin 注释示例\n\n```\n1 # I am a comment.\n```\n\
  \n记住，我们解析的是位置管理器的结果，而不是直接解析文本。之前的注释将产生以下文本缩进对象：\n\n图 12.29\n\n```php\n 1 TextIndentation\
  \ {\n 2   line: \"# I am a comment.\"\n 3   lineNumber: 1\n 4   leadingWhitespace:\
  \ 0\n 5   indentCount: 0\n 6   nestedLines: array:1 [\n 7     0 => TextIndentation\
  \ {\n 8       line: \"\"\n 9       lineNumber: 2\n10       leadingWhitespace: 0\n\
  11       indentCount: 0\n12       nestedLines: []\n13       allNestedLines: []\n\
  14     }\n15   ]\n16 }\n```\n\n我们想要解析的信息包含在 `line` 属性中，但如果没有前导空白，将会更有用。根据之前关于字符串方法的讨论，我们知道可以通过构造从第一个字符开始的子字符串然后对结果进行修剪来实现：\n\
  \n图 12.30 解析 Gherkin 注释\n\n```php\n 1 <?php\n 2 \n3 use Illuminate\\Support\\Str;\n\
  \ 4 \n5 class GherkinParser\n 6 {\n 7 \n 8     // ...\n 9\n10     /**\n11      *\
  \ 解析单个 Gherkin 注释。\n12      *\n13      * @param TextIndentation $line 要解析的行。\n14\
  \      * @return Comment\n15      */\n16     protected function parseComment(TextIndentation\
  \ $line): Comment\n17     {\n18         $comment = new Comment();\n19         $comment->start\
  \ = $this->lineToPosition($line);\n20         $comment->text = (string) str($line->line)->substr(1)->trim();\n\
  \ 21 \n22         return $comment;\n23     }\n 24 \n25     // ...\n26 }\n```\n\n\
  我们的方法将我们的示例行解析为以下 `Comment` 数据对象：\n\n图 12.31\n\n```php\n1 Comment {\n2   start:\
  \ 1\n3   comments: []\n4   keyword: \"\"\n5   text: \"I am a comment.\"\n6\n```\n\
  \n解析器产生了预期的结果，但它目前并没有很有帮助，因为它期望一个数组。让我们考虑包含多个注释的以下示例：\n\n图 12.32 Gherkin 注释\n\n\
  ```\n1 # I am a comment.\n2 # I am another comment.\n3 # Yet another comment.\n\
  ```\n\n我们知道缩进管理器将返回一个对象数组，我们可以利用这一点检测注释并将其通过我们的方法：\n\n图 12.33 解析 Gherkin 注释\n\n\
  ```php\n 1 <?php\n 2 \n3 use Illuminate\\Support\\Str;\n 4 \n5 class GherkinParser\n\
  \ 6 {\n 7 \n 8     // ...\n 9\n10     /**\n11      * 从提供的行中检索所有 Gherkin 注释。\n12\
  \      *\n13      * @param TextIndentation[] $lines 要解析的行。\n14      * @return Comment[]\n\
  15      */\n16     protected function parseComments(array $lines): array\n17   \
  \  {\n18         $comments = [];\n19 \n20         foreach ($lines as $line) {\n\
  21             if (str($line->line)->trim()->startsWith('#')) {\n22            \
  \     $comments[] = $this->parseComment($line);\n23             }\n24         }\n\
  25 \n26         return $comments;\n27     }\n 28 \n 29     // ...\n30 }\n```\n\n\
  我们正在看到一些复杂的情况，但情况仍然相对简单。我们的 `parseComments` 方法正在遍历所有的行并检查它们是否以 `#` 字符开头。如果是，我们将该行传递到刚刚开发的\
  \ `parseComment` 方法。\n\n在我们的多个注释列表上执行此方法将产生以下 `Comment` 数据对象列表：\n\n图 12.34\n\n```php\n\
  1 array:3 [\n2   0 => Comment {\n3     start: 0\n4     comments: []\n5     keyword:\
  \ \"\"\n6     text: \"I am a comment.\"\n7   }\n8   1 => Comment {\n9     start:\
  \ 19\n10     comments: []\n11     keyword: \"\"\n12     text: \"I am another comment.\"\
  \n13   }\n14   2 => Comment {\n15     start: 44\n16     comments: []\n17     keyword:\
  \ \"\"\n18     text: \"Yet another comment.\"\n19   }\n20 ]\n```\n\n\n\n\n\n我们现在有两种方法可以用于从缩进行列表中解析注释。我们目前不关心这些行来自何处，将在后续章节中讨论这一点。不过，我们可以为自己感到高兴了，因为我们正式开始实现解析器了！\n\
  \n### 解析名称\n\n许多 Gherkin 结构（如特性 features 和场景 scenarios）都包含一个名称。本节我们将重点关注特性，但我们开发的方法将适用于所有带有名称的\
  \ Gherkin 结构。让我们考虑以下示例行：\n\n图 12.35 Gherkin Feature 示例\n\n```\n1 Feature: The feature\
  \ name\n```\n\n我们想要从行中提取的文本是“The feature name”。如果我们去掉开头的“Feature: ”部分，就可以简单地实现。我们的名称解析方法可以这样实现：\n\
  \n图 12.36 解析 Gherkin Feature 名称\n\n```\n 1 <?php\n\n 2 \n\n 3 use Illuminate\\Support\\\
  Str;\n\n 4 \n\n 5 class GherkinParser\n\n 6 {\n\n 7 \n\n 8     // ...\n\n 9 \n\n\
  10     /**\n11      * 解析各种块的名称，例如 Feature 名称。\n12      *\n13      * @param TextIndentation\
  \ $line 要解析的行。\n14      * @param string $keyword 原始关键字。\n15      * @return string\n\
  16      */\n17     protected function parseName(\n18         TextIndentation $line,\n\
  19         string $keyword\n20     ): string\n21     {\n22         return (string)\
  \ str($line->line)\n23             ->trim->substr(strlen($this->gherkinKeywords[$keyword]))\n\
  24             ->trim;\n25     }\n26 \n27     // ...\n\n28 }\n```\n\n在内部，我们的方法将使用标准的关键字名称进行调用，例如\
  \ feature、scenario 或 rule。我们查找关键字的本地化版本，并使用其长度生成子字符串，在此过程中对所有结果进行修剪。\n\n我们的解析方法将从\
  \ 12.35 的示例输入中返回“The feature name”，这正是我们稍后解析器中需要的。\n\n### 解析步骤文本\n\n每个 Gherkin 步骤都以步骤关键字开头，后跟着一些文本：\n\
  \n图 12.37 Gherkin Step 示例\n\n```\n1 When the Maker starts a game\n```\n\n我们解析此内容的策略将与解析特性名称的过程非常相似。我们可以使用以下\
  \ PHP 方法来实现：\n\n图 12.38 \n\n```\n 1 <?php\n\n 2 \n\n 3 use Illuminate\\Support\\\
  Str;\n\n 4 \n\n 5 class GherkinParser\n\n 6 {\n\n 7 \n\n 8     // ...\n\n 9 \n\n\
  10     /**\n11      * 返回 Gherkin 步骤的指令文本。\n12      *\n13      * @param TextIndentation\
  \ $stepLine 要解析的行。\n14      * @param string $keyword 原始关键字。\n15      * @return string\n\
  16      */\n17     protected function parseStepText(\n18         TextIndentation\
  \ $stepLine,\n19         string $keyword): string\n20     {\n21         $content\
  \ = (string) str($stepLine->line)->ltrim;\n22 \n23         $stepText = str($content)->after($keyword);\n\
  24 \n25         return (string) str($stepText)->trim;\n26     }\n27 \n28     //\
  \ ...\n\n29 }\n```\n\n对于任何行，我们还需要一个方法能够告诉我们该行上使用了哪个步骤关键字：\n\n图 12.39 解析 Gherkin\
  \ Step 关键字\n\n```\n 1 <?php\n\n 2 \n\n 3 use Illuminate\\Support\\Str;\n\n 4 \n\n\
  \ 5 class GherkinParser\n\n 6 {\n\n 7 \n\n 8     // ...\n\n 9 \n\n10     /**\n11\
  \      * 返回 Gherkin 步骤的关键字。\n12      *\n13      * @param TextIndentation $stepLine\
  \ 要解析的行。\n14      * @return array\n15      * @throws Exception\n16      */\n17 \
  \    protected function parseStepKeyword(\n18         TextIndentation $stepLine\n\
  19     ): array\n20     {\n21         $content = (string) str($stepLine->line)->ltrim;\n\
  22 \n23         foreach ($this->stepKeywords as $name => $keyword) {\n24       \
  \      if (str($content)->startsWith($keyword)) {\n25                 return [$name,\
  \ $keyword];\n26             }\n27         }\n28 \n29         throw new \\Exception('Invalid\
  \ step keyword');\n30     }\n31 \n32     // ...\n\n33 }\n```\n\n你会注意到我们的 `parseStepKeyword`\
  \ 同时返回了内部和本地化的关键字版本。我们稍后会将此本地化版本提供给 `parseStepText` 方法。\n\n### 解析自由格式 Gherkin 描述\n\
  \nGherkin 支持自由描述的概念，这些描述可以添加到特性、场景、背景、场景大纲和规则中。这些描述在它们所属的 Gherkin 结构下方缩进，与其他任何内容一样，只要行不以任何\
  \ Gherkin 关键字开头，就可以包含任何内容。图 12.40 提供了一个示例：\n\n图 12.40 Gherkin Description\n\n```\n\
  1   Feature: The feature name\n2\n3   Line one.\n4     Line two.\n5        Line\
  \ three.\n```\n\n解析自由描述的基本过程将是遍历行并检查它们是否以任何 Gherkin 关键字开头。执行此操作的 PHP 方法可能像图 12.41\
  \ 所示：\n\n```\n 1 <?php\n\n 2 \n\n 3 use Illuminate\\Support\\Str;\n\n 4 \n\n 5 class\
  \ GherkinParser\n\n 6 {\n\n 7 \n\n 8     // ...\n\n 9 \n\n10     /**\n11      *\
  \ 测试行是否以任何 Gherkin 关键字开头。\n12      *\n13      * @param string $line 要测试的行。\n14 \
  \     * @return bool\n15      */\n16     protected function startsWithKeyword(string\
  \ $line)\n17     {\n18         $content = str($line)->ltrim;\n19 \n20         return\
  \ $content->startsWith($this->stepKeywords) ||\n21                $content->startsWith($this->gherkinKeywords)\
  \ ||\n22                $content->startsWith('@');\n23     }\n24 \n25     /**\n\
  26      * 解析自由格式 Gherkin 描述。\n27      *\n28      * @param TextIndentation[] $lines\
  \ 要解析的行。\n29      * @return string\n30      */\n31     protected function parseDescription(array\
  \ $lines): string\n32     {\n33         if (count($lines) == 0) { return ''; }\n\
  34         $description = [];\n35 \n36         for ($i = 0; $i < count($lines);\
  \ $i++) {\n37             $cur = $lines[$i];\n38 \n39             // 当我们遇到以关键字开头的行时，\n\
  40             // 停止寻找自由格式\n41             // 描述\n42             if (str($cur->line)->trim->length\
  \ == 0  ||\n43                 $this->startsWithKeyword($cur->line)) {\n44     \
  \            break;\n45             }\n46 \n47             if ($cur->indentCount\
  \ > 0) {\n48                 $description[] = (string) str($cur->line)->ltrim;\n\
  49                 continue;\n50             }\n51 \n52             break;\n53 \
  \        }\n54 \n55         return (string) str(implode(' ', $description))\n56\
  \             ->squish();\n57     }\n58 \n59     // ...\n\n60 }\n```\n\n\n\n\n\n\
  ```\n致:\n\n图 12.43 \n\n```\n\n1 第一行。第二行。第三行。\n\n## 解析场景标签（Parsing Scenario Tags）\n\
  \n正如我们在章节开头看到的，Gherkin 支持为场景（scenarios）添加各种标签（tags）。`Figure 12.44` 展示了如何为场景添加标签以对其进行组织：\n\
  \n图 12.44 Gherkin 场景标签示例 \n\n```\n1 Feature: Feature Name\n\n2 \n\n3   @tagOne @tagTwo\
  \ @tagThree\n\n4   Scenario: Doc String Example One\n\n5     Given a blog post named\
  \ \"Random\" with Markdown body\n```\n\n我们将这些行转换为 `Tag` 对象列表的策略将相对简单。基本过程是根据 `@`\
  \ 符号将输入字符串拆分为数组。一旦获取了标签列表，我们就可以过滤掉空字符串并创建 `Tag` 实例：\n\n图 12.45 解析 Gherkin 场景标签 \n\
  \n```\n 1 <?php\n\n 2 \n\n 3 use Illuminate\\Support\\Str;\n\n 4 \n\n 5 class GherkinParser\n\
  \n 6 {\n\n 7 \n\n 8     // ...\n\n 9 \n\n10     /**\n11      * 解析场景标签。\n12     \
  \ *\n13      * @param TextIndentation $tagLine 标签行。\n14      * @return array\n15\
  \      */\n16     protected function parseTags(TextIndentation $tagLine): array\n\
  17     {\n18         $tags = [];\n\n19 \n\n20         $tagLineContent = str($tagLine->line)->ltrim;\n\
  \n21 \n\n22         // 根据 \"@\" 字符将字符串拆分为数组。\n23         // 字符串 \"@tag1 @tag2\"\
  \ 将\n24         // 变成 [\"tag1\", \"tag2\"].\n25         $tagNames = $tagLineContent->split('/@/');\n\
  \n26 \n\n27         foreach ($tagNames as $tagName) {\n28             if (empty($tagName))\
  \ {\n29                 continue;\n30             }\n\n31 \n\n32             $tag\
  \ = new Tag();\n33             $tag->name = (string) str($tagName)->trim;\n34  \
  \           $tag->start = $this->lineToPosition($tagLine);\n\n35 \n\n36        \
  \     $tags[] = $tag;\n37         }\n\n38 \n\n39         return $tags;\n40     }\n\
  \n41 \n\n42     // ...\n43 }\n```\n\n如果我们回看 `Figure 12.44`，将会注意到一个需要克服的挑战。包含我们标签的行将出现在包含场景关键字（scenario\
  \ keyword）的行之前。我们可以通过跟踪已经过的行并“记住”我们遇到过包含标签的行来解决这个问题。对于我们的实现来说，这似乎过于复杂，另一种替代技术是在遇到场景时查看上一行。\n\
  \n当我们遇到一行包含场景关键字的行时，我们将回溯到上一行，检查它是否以 `@` 符号开头。如果是，我们将使用 `parseTags` 方法解析上一行。向后查找的方法是：\n\
  \n图 12.46 向后扫描以定位场景标签 \n\n```\n 1 <?php\n\n 2 \n\n 3 use Illuminate\\Support\\Str;\n\
  \n 4 \n\n 5 class GherkinParser\n\n 6 {\n\n 7 \n\n 8     // ...\n\n 9 \n\n10   \
  \  /**\n11      * 反向搜索行列表以寻找\n12      * 以标签关键字 (@) 开头的行。\n13      *\n14      * 如果当前行的\n\
  15      * 前的一行不是标签行，则\n16      * 此方法将停止搜索。\n17      *\n18      * @param TextIndentation[]\
  \ $lines 需要搜索的行。\n19      * @param int $i 当前行索引。\n20      * @return TextIndentation|null\n\
  21      */\n22     protected function getTagsLine(\n23         array $lines,\n24\
  \         int $i): ?TextIndentation\n25     {\n26         $tagLine = null;\n\n27\
  \ \n28         if ($i > 0) {\n29             $prev = $lines[$i - 1];\n30       \
  \      $prevContent = str($prev->line)->ltrim;\n\n31 \n\n32             if ($prevContent->startsWith('@'))\
  \ {\n33                 $tagLine =  $prev;\n34             }\n35         }\n\n36\
  \ \n\n37         return $tagLine;\n38     }\n\n39 \n\n40     // ...\n41 }\n```\n\
  \n我们一直在开发几个辅助方法来帮助实现解析器，但还没有着手实现解析器的核心部分。我们会及时处理的，因为在解析我们的大型结构（如特性和场景）之前，我们有许多 Gherkin\
  \ 特性需要解析。\n\n## 解析步骤参数（Parsing Step Parameters）\n\n在本节中，我们将致力于实现解析步骤参数的方法。如果你还记得章节开头的内容，步骤参数是在步骤（step）的文本中使用括号定义的。\n\
  \n图 12.47 Gherkin 示例 \n\n```\n1 Feature: Feature Name\n\n2 \n\n3   Scenario: Outline\n\
  4     Given there are cucumbers\n5     When I eat\n6     Then I should have\n```\n\
  \n我们的过程是使用正则表达式和 PHP 的 `preg_match_all` 从文本中提取这些内容。一旦获取了所有匹配项，我们将遍历它们并创建 `Parameter`\
  \ 实例：\n\n图 12.48 解析步骤参数 \n\n```\n 1 <?php\n\n 2 \n\n 3 use Illuminate\\Support\\\
  Str;\n\n 4 \n\n 5 class GherkinParser\n\n 6 {\n\n 7 \n\n 8     // ...\n\n 9 \n\n\
  10     /**\n11      * 从行中解析步骤参数。\n12      *\n13      * @param TextIndentation $stepLine\
  \ 需要解析的行。\n14      * @return array\n15      */\n16     protected function parseStepParameters(\n\
  17         TextIndentation $stepLine\n18     ): array\n19     {\n20         // 匹配行中的所有项。\n\
  21         // 例如，如果行是：\n22         // Then I should have\n23         preg_match_all(\n\
  24             '([^>]+>/u',\n25             $stepLine->line,\n26             $matches,\n\
  27             PREG_OFFSET_CAPTURE)\n28         ;\n29 \n30         // 遍历所有匹配项并\n\
  31         // 创建 Parameter 实例。\n32         return collect($matches[1])\n33     \
  \        ->map(function ($match) use ($stepLine) {\n34                 $parameter\
  \ = new Parameter();\n35 \n36                 // 添加参数的位置。\n37                 $parameter->start\
  \ = $this->lineToPosition($stepLine) + $match[1];\n38 \n39                 $parameter->name\
  \ = $match[0];\n40 \n41                 return $parameter;\n42             })->all();\n\
  43     }\n\n44 \n\n45     // ...\n46 }\n```\n\n我们使用 Laravel 的集合功能来遍历匹配而不是普通的 `foreach`\
  \ 循环。\n\n## 解析文档字符串（Parsing Doc Strings）\n\n我们将解析更复杂的结构，从 Gherkin 的文档字符串开始。让我们再次熟悉文档字符串语法：\n\
  \n图 12.49 Gherkin 文档字符串\n\n```\n1 Feature: Feature Name\n\n2 \n\n3   Scenario: Doc\
  \ String Example One\n4     Given a blog post named \"Random\" with Markdown body\n\
  5       \"\"\"\n6       Some Title, Eh?\n7       ===============\n8       Here is\
  \ the first paragraph of my blog post. Lorem ipsum dolor\n9       consectetur adipiscing\
  \ elit.\n10       \"\"\"\n```\n\n解析文档字符串的策略与我们的自由形式描述类似。基本方法是扫描每一行并检查它是否以指示文档字符串开始的两种序列之一开头：\n\
  \n*   三个双引号，或\n*   三个反引号\n\n我们还需要记住看到的是哪种序列，因为我们需要在再次看到它时停止解析文档字符串。解析文档字符串的实现如下：\n\
  \n图 12.50 解析 Gherkin 文档字符串 \n\n```\n 1 <?php\n\n 2 \n\n 3 use Illuminate\\Support\\\
  Str;\n\n 4 \n\n 5 class GherkinParser\n\n 6 {\n\n 7 \n\n 8     // ...\n\n 9 \n\n\
  10     /**\n11      * 解析一个 Ghrekin DocString。\n12      *\n13      * @param TextIndentation\
  \ $docStringLine 需要解析的行。\n14      * @param TextIndentation[] $lines 需要解析的行。\n15\
  \      * @return DocString\n16      */\n```\n\n\n\n\n\n```php\nprotected function\
  \ parseDocString(\n    TextIndentation $docStringLine,\n    array $lines\n): DocString\n\
  {\n    $docString = new DocString();\n\n    $docString->start = $this->lineToPosition($docStringLine);\n\
  \    $content = (string) str($docStringLine->line)->ltrim;\n\n    if (str($content)->startsWith('\"\
  \"\"')) {\n        $docString->delimiter = '\"\"\"';\n    } else {\n        $docString->delimiter\
  \ = '```';\n    }\n\n    $contentLines = [];\n\n    foreach ($lines as $line) {\n\
  \        if ($line->lineNumber <= $docStringLine->lineNumber) {\n            continue;\n\
  \        }\n\n        $trimmedLine = str($line->line)->ltrim;\n\n        if ($trimmedLine->startsWith($docString->delimiter)\
  \ &&\n            $line->leadingWhitespace ==\n                $docStringLine->leadingWhitespace)\
  \ {\n\n            $docString->end = $this->lineToPosition($line);\n           \
  \ break;\n        }\n\n        $contentLines[] = $line->line;\n    }\n\n    // Remove\
  \ the leading whitespace from each line.\n    $docString->content = collect($contentLines)\n\
  \        ->map(function ($line) use ($docStringLine) {\n\n        return (string)\
  \ str($line)->substr(\n            $docStringLine->leadingWhitespace\n        );\n\
  \n    })->implode(\"\\n\");\n\n    return $docString;\n}\n\n// ...\n```\n\n我们正在“记住”之前在第\
  \ 27 行到第 31 行之间遇到的分隔符，并将其存储在我们在第 22 行创建的新 `DocString` 实例中。\n\n当初始的文档字符串序列被发现时，我们的文档字符串解析方法最终将接收到属于文档的所有行。因此，我们需要检查正在迭代的行是否在启动文档字符串解析方法的的行之前。我们在第\
  \ 36 行到第 38 行之间执行了这一操作。\n\n我们在第 42 行到第 47 行之间实现了一个相当有趣的检查。让我们考虑下面的示例输入，以解释这个检查是为了防止什么情况：\n\
  \n图 12.51 \n\n```\n 1 Feature: Feature Name\n 2 \n 3   Scenario: Doc String Example\
  \ One\n 4     Given a blog post named \"Random\" with Markdown body\n 5       \"\
  \"\"\n 6       Some Title, Eh?\n 7       ===============\n 8       Here is the first\
  \ paragraph of my blog post. Lorem ipsum dolor\n 9       consectetur adipiscing\
  \ elit.\n10         \"\"\"\n11       \"\"\"\n```\n\n在图 12.51 的第 10 行，我们可以看到文档字符串分隔符出现了，但它的缩进比第\
  \ 5 行发现的原始分隔符要深。我们在第 42 行到第 47 行之间的检查考虑了这种情况。\n\n在返回 `DocString` 实例之前，我们做的最后操作之一是移除所有内容行的相对领先空白，然后用换行符将它们连接。这发生在第\
  \ 54 行到第 61 行之间。移除相对领先空白的效果是将以下这组行转换为：\n\n图 12.52 \n\n```\n1       Line One\n2 \
  \      ============\n3       Line Two\n4          Line Three\n5              Line\
  \ Four\n6 \n7       Line Five\n```\n\n变为：\n\n图 12.53 \n\n```\n1 Line One\n2 ============\n\
  3 Line Two\n4     Line Three\n5         Line Four\n6 \n7 Line Five\n```\n\n注意图 12.53\
  \ 中第 4 行和第 5 行的相对缩进是如何被保留的。\n\n### 解析 Gherkin 数据表\n\n现在我们将开始解析 Gherkin 数据表，这将是我们解析过的结构最复杂的类型，而且在某些方面，它是所有\
  \ Gherkin 元素中最难解析的。Gherkin 数据表看起来类似于 Markdown 表格，每行都以垂直线符开头和结束，每列之间也通过垂直线符分隔：\n\n\
  图 12.54 Gherkin 数据表示例 \n\n```\n 1 Feature: Feature Name\n 2 \n 3   Scenario Outline:\
  \ eating\n 4     Given there are <start> cucumbers\n 5     When I eat <eat> cucumbers\n\
  \ 6     Then I should have <left> cucumbers\n 7 \n 8     Examples:\n 9         |\
  \ start | eat | left |\n10         |    12 |   5 |    7 |\n11         |    20 |\
  \   5 |   15 |\n```\n\n就像文档字符串和自由格式描述一样，我们想要收集属于数据表的所有行。对于数据表，这将是所有以“|”符号开头的行。一旦获取了数据表的单行，我们就可以将每行解析为\
  \ `TableCell` 对象列表，然后将这些对象存储在 `TableRow` 对象中。\n\n如果我们观察单行：\n\n图 12.55 \n\n```\n\
  1 |    12 |   5 |    7 |\n```\n\n我们可以看到我们需要提取三个不同的值：\n\n- 12\n- 5\n- 7\n\n基本过程是在垂直线符处分割我们的行，但前提是其前面没有反斜杠字符。这是因为\
  \ Gherkin 在定义单元值时允许以下转义序列：\n\n表 12.3 Gherkin 数据表单元转义序列\n\n| 转义序列 | 说明 |\n|---|---|\n\
  | `\\|` | 转义垂直线符。 |\n| `\\n` | 在单元内容中产生换行符。 |\n| `\\\\` | 转义反斜杠，在单元内容中产生单个反斜杠。 |\n\
  \n就像步骤参数一样，我们可以通过一个简单的正则表达式来实现。下面的实现看起来可能很多，但每个单独的方法都在处理其各自独立的步骤：\n\n图 12.56 解析\
  \ Gherkin 数据表 \n\n\n\n\n\n```php\n<?php\n\nuse Illuminate\\Support\\Str;\n\nclass\
  \ GherkinParser\n{\n    // ...\n\n    /**\n     * 解析 Gherkin 数据表格。\n     *\n   \
  \  * @param TextIndentation $tableLine 需要解析的行。\n     * @param TextIndentation[]\
  \ $lines 所有嵌套的行。\n     * @return DataTable\n     */\n    protected function parseTable(\n\
  \        TextIndentation $tableLine,\n        array $lines\n    ): DataTable\n \
  \   {\n        $table = new DataTable();\n\n        $table->start = $this->lineToPosition($tableLine);\n\
  \        $table->rows = $this->parseTableRows($lines);\n\n        return $table;\n\
  \    }\n\n    /**\n     * 解析提供的行并返回 TableRow 数组。\n     *\n     * @param TextIndentation[]\
  \ $lines 需要解析的行。\n     * @return TableRow[]\n     */\n    protected function parseTableRows(array\
  \ $lines): array\n    {\n        $rows = [];\n\n        for ($i = 0; $i < count($lines);\
  \ $i++) {\n            $cur = $lines[$i];\n\n            $content = (string) str($cur->line)->ltrim;\n\
  \n            // 如果当前行以垂直管道\n            // (| (|)开头，我们将将其解析为表格行。\n            if\
  \ (str($content)->startsWith('|')) {\n                $rows[] = $this->parseTableRow($cur);\n\
  \            }\n        }\n\n        return $rows;\n    }\n\n    /**\n     * 将单行解析为\
  \ Gherkin DataRow。\n     *\n     * @param TextIndentation $tableRowLine 需要解析的行。\n\
  \     * @return TableRow\n     */\n    protected function parseTableRow(\n     \
  \   TextIndentation $tableRowLine\n    ): TableRow\n    {\n        $row = new TableRow();\n\
  \n        $row->start = $this->lineToPosition($tableRowLine);\n        $row->cells\
  \ = $this->parseTableCells($tableRowLine);\n\n        return $row;\n    }\n\n  \
  \  /**\n     * 将单行解析为 Gherkin TableCell 数组。\n     *\n     * @param TextIndentation\
  \ $tableRowLine 需要解析的行。\n     * @return TableCell[]\n     */\n    protected function\
  \ parseTableCells(\n        TextIndentation $tableRowLine\n    ): array\n    {\n\
  \        $cells = [];\n\n        $content = (string) str($tableRowLine->line)->ltrim;\n\
  \n        // 根据管道字符 (|) 将字符串分割为数组。\n        // 例如，如果行是：\"| foo | bar |\"，它将\n  \
  \      // 返回 [\"\", \" foo \", \" bar \", \"\"]。我们还使用了\n        // 负向后回顾断言以确保我们不会\n\
  \        // 转义的管道进行分割。例如，如果行是：\n        // \"| foo \\| bar |\"，它将返回 [\"\", \" foo\
  \ \\| bar \",\"]\n        $content = preg_split('/(?<!)\\|/u', $content);\n\n  \
  \      // 移除开头和结尾留下的空格。\n        // 我们不能移除所有空格，\n        // 因为某些单元可能是空的。\n     \
  \   array_shift($content);\n        array_pop($content);\n        $content = collect($content)->map(function\
  \ ($value) {\n            return (string) $value\n                ->replace('\\\
  |', '|') // 替换转义的管道\n                ->replace('\\n', \"\\n\") // 替换换行\n       \
  \         ->replace('\\\\', '\\\\') // 替换反斜杠\n                ->trim;\n        })->all();\n\
  \n        // 为每个单元值创建一个 TableCell。\n        foreach ($content as $cell) {\n    \
  \        $cells[] = new TableCell($cell);\n        }\n\n        return $cells;\n\
  \    }\n    // ...\n}\n```\n\n在第 17 行定义的 `parseTable` 方法会在我们发现以管道字符开头的字符串时被调用。该方法反过来会调用我们的\
  \ `parseTableRows` 方法，该方法负责找到每一个以管道开头的行。记住，我们的解析器将接收来自 `IndentationManager` 的结果，这允许我们直接获取任何行下方的行。我们利用这一事实，避免在所有采用此策略的方法中扫描整个文档。每当我们发现一个有效行时，就会调用\
  \ `parseTableRows`，它会创建我们的 `TableRow` 实例，然后调用 `parseTableCells` 方法，大部分工作都在那里完成。\n\
  \n在第 93 行，我们使用正则表达式将行的内容分割为数组。这个过程导致生成的值数组的第一个和最后一个元素是空字符串，即初始管道字符所在的位置。我们在第 98\
  \ 行和第 99 行移除了这些空字符串。数据表格解析方法的其余部分相对简单：它将遍历所有值并应用所有转义序列的规则。\n\n一旦我们获得了所有单元格的最终内容，就会为它们创建新的\
  \ `TableCell` 实例并返回结果。\n\n由于解析 Gherkin 数据表格具有相对复杂性，查看图 12.54 中提供的示例输入所生成的输出可能会大有益：\n\
  \n图 12.54 从解析 Gherkin 数据表格生成的类\n\n```\nDataTable {\n  start: 190\n  rows: array:3\
  \ [\n    0 => TableRow {\n      start: 190\n      comments: []\n      keyword: \"\
  \"\n      cells: array:3 [\n        0 => TableCell {\n          comments: []\n \
  \         keyword: \"\"\n          value: \"start\"\n        }\n        1 => TableCell\
  \ {\n          comments: []\n          keyword: \"\"\n          value: \"eat\"\n\
  \        }\n        2 => TableCell {\n          comments: []\n          keyword:\
  \ \"\"\n          value: \"left\"\n        }\n      ]\n    }\n    1 => TableRow\
  \ {\n      start: 222\n      comments: []\n      keyword: \"\"\n      cells: array:3\
  \ [\n        0 => TableCell {\n          comments: []\n          keyword: \"\"\n\
  \          value: \"12\"\n        }\n        1 => TableCell {\n          comments:\
  \ []\n          keyword: \"\"\n          value: \"5\"\n        }\n        2 => TableCell\
  \ {\n          comments: []\n          keyword: \"\"\n          value: \"7\"\n \
  \       }\n      ]\n    }\n    2 => TableRow {\n      start: 254\n      comments:\
  \ []\n      keyword: \"\"\n      cells: array:3 [\n        0 => TableCell {\n  \
  \        comments: []\n          keyword: \"\"\n          value: \"20\"\n      \
  \  }\n        1 => TableCell {\n          comments: []\n          keyword: \"\"\n\
  \          value: \"5\"\n        }\n        2 => TableCell {\n          comments:\
  \ []\n          keyword: \"\"\n          value: \"15\"\n        }\n      ]\n   \
  \ }\n  ]\n}\n```\n\n#### 解析 Scenario Examples\n\n我们几乎准备好解析一些较大的 Gherkin 结构，但首先只需要处理一些较小的结构。在这一部分中，我们将处理解析\
  \ scenario outline 下的“Examples”或“Scenarios” 块：\n\n图 12.58 Gherkin Examples/Scenarios\
  \ 示例\n\n```\nScenario Outline: eating\n  Given there are <start> cucumbers\n  When\
  \ I eat <eat> cucumbers\n  Then I should have <left> cucumbers\n\n  Examples:\n\
  \    | start | eat | left |\n    | 12 | 5 | 7 |\n    | 20 | 5 | 15 |\n```\n\n现在，假设我们已经处于处理\
  \ scenario outline 的解析方法内部，并且已经可以访问图 12.58 中的缩进行 2-6。从同一个示例图中可以看出，第 6 行以关键字“Examples:”\
  \ 开头。我们将查找这个关键词以及它的别名“Scenarios:”，然后开始解析位于其下方的所有行。在我们的特定示例中，这些将是第 7-9 行。\n\n图 12.59\
  \ 检测 Examples 和 Scenarios 结构\n\n\n\n\n\n```php\n 1 <?php\n 2 \n 3 use Illuminate\\\
  Support\\Str;\n 4 \n5 class GherkinParser\n 6 {\n 7 \n 8     // ...\n 9 \n10   \
  \  /**\n11      * 解析 Gherkin Examples 块列表。\n12      *\n13      * @param TextIndentation[]\
  \ $lines 需要解析的行。\n14      * @return array\n15      */\n16     protected function\
  \ parseExamples(array $lines): array\n17     {\n18         $examples = [];\n19 \n\
  20         for ($i = 0; $i < count($lines); $i++) {\n21             $cur = $lines[$i];\n\
  22 \n23             $content = (string) str($cur->line)->ltrim;\n24 \n25       \
  \      // 检查当前行是否以 Examples 或\n26             // Scenarios 关键字开头。对于英文，这会\n27   \
  \          // 检查 \"Examples:\" 或 \"Scenarios:\"。\n28             if (str($content)->startsWith(\n\
  29                 $this->gherkinKeywords['examples'],\n30                 $this->gherkinKeywords['scenarios']\n\
  31             )) {\n32                 $examples[] = $this->parseExample($cur);\n\
  33             }\n34         }\n35 \n36         return $examples;\n37     }\n38\
  \ \n39     // ...\n40 }\n```\n\n在**图 12.59** 中，我们添加了 `parseExamples` 方法，它将访问 Scenario\
  \ Outline（场景大纲）下的每一行（即**图 12.58** 中的第 2-6 行）。在第 28 行和第 31 行之间，我们正在检查当前行是否以指示场景大纲示例块开始的两个关键字之一开头，如果匹配，我们就会对当前行调用\
  \ `parseExample` 方法。我们必须不断提醒自己，这些方法将在 `TextIndentation` 对象的实例上工作。因此，在第 32 行，当我们将当前行传递给\
  \ `parseExample` 时，它将收到来自**图 12.58** 的第 6 行的内容，以及嵌套在其下方的第 7-9 行。现在来看 `parseExample`\
  \ 方法：\n\n图 12.60 解析 Gherkin Examples 块 \n\n```php\n 1 <?php\n 2 \n 3 use Illuminate\\\
  Support\\Str;\n 4 \n5 class GherkinParser\n 6 {\n 7 \n 8     // ...\n 9 \n10   \
  \  /**\n11      * 解析一个 Gherkin Example。\n12      *\n13      * @param TextIndentation\
  \ $exampleLine 需要解析的行。\n14      * @return Examples\n15      */\n16     protected\
  \ function parseExample(\n17         TextIndentation $exampleLine\n18     ): Examples\n\
  19     {\n20         $example = new Examples();\n21 \n22         $example->comments\
  \ = $this->parseComments(\n23             $exampleLine->nestedLines\n24        \
  \ );\n25 \n26         $example->keyword = 'examples';\n27         $example->start\
  \ = $this->lineToPosition($exampleLine);\n28 \n29         if (count($exampleLine->nestedLines)\
  \ > 0) {\n30             $tableLine = $exampleLine->nestedLines[0];\n31 \n32   \
  \          // 请求表格解析器处理内容。\n33             $example->table = $this->parseTable(\n\
  34                 $tableLine,\n35                 $exampleLine->nestedLines\n36\
  \             );\n37         }\n38 \n39         return $example;\n40     }\n41 \n\
  42     // ...\n43 }\n```\n\n随着解析器的编写继续，我们将看到一个类似的趋势开始显现：我们拆分行/单词的工作越来越少，正如在**图 12.60**中所示。在第\
  \ 29 行和第 37 行之间，我们正在执行检查，看传入的行下方是否有任何嵌套行。如果是，我们获取第一行并暂时假设它是一个表格，然后调用我们之前开发的现有的 `parseTable`\
  \ 方法。\n\n### 解析步骤\n\n步骤（Steps）是在定义 Gherkin 测试时提供单个操作项的内容。**图 12.61** 快速概述了它们在语境中的样子：\n\
  \n图 12.61 Gherkin Steps 示例 \n\n```\n1 Scenario: eat 5 out of 12\n2   Given there\
  \ are 12 cucumbers\n3   When I eat 5 cucumbers\n4   Then I should have 7 cucumbers\n\
  ```\n\n和我们目前为止做的的大多数事情一样，我们将遍历感兴趣的每一行，并检查它们是否以任何步骤关键字开头。如果是，我们将该行解析为一个单独的 `Step`\
  \ 数据对象。\n\n你可能还记得，我们在本章中已经开发了几个与步骤相关的解析方法。例如，我们已经开发了一个方法来解析步骤的文本、关键字和参数。我们现在将使用所有这些方法来汇编我们的第一个大型\
  \ Gherkin 语言构造结构：\n\n图 12.62 解析 Gherkin Steps \n\n```php\n  1 <?php\n  2 \n  3 use\
  \ Illuminate\\Support\\Str;\n  4 \n5 class GherkinParser\n  6 {\n  7 \n  8     //\
  \ ...\n 9\n10     /**\n11      * 解析 Steps 列表。\n12      *\n13      * @param TextIndentation[]\
  \ $lines 需要解析的行。\n14      * @return Step[]\n15      * @throws Exception\n16    \
  \  */\n17     protected function parseSteps(array $lines): array\n18     {\n19 \
  \        $steps = [];\n20 \n21         for ($i = 0; $i < count($lines); $i++) {\n\
  22             $cur = $lines[$i];\n23 \n24             $content = (string) str($cur->line)->ltrim;\n\
  25 \n26             // 检查当前行是否以 Step\n27             // 关键字开头。对于英文，这会检查\n28    \
  \         // \"Given\", \"When\", \"Then\", \"And\", 或 \"But\"。\n29            \
  \ if (str($content)->startsWith(\n30                 $this->stepKeywords)) {\n31\
  \                 $steps[] = $this->parseStep($cur);\n32             }\n33     \
  \    }\n34 \n35         return $steps;\n36     }\n37 \n38     /**\n39      * 解析单个\
  \ Step。\n40      *\n41      * @param TextIndentation $stepLine 需要解析的行。\n42     \
  \ * @return Step\n43      * @throws Exception\n44      */\n45     protected function\
  \ parseStep(TextIndentation $stepLine): Step\n46     {\n47         $step = new Step();\n\
  48 \n49         $step->comments = $this->parseComments(\n50             $stepLine->nestedLines\n\
  51         );\n52 \n53         // 从行提取关键字。\n54         * 这返回一个包含归一化关键字（第一个元素）\n\
  55         // 和本地化关键字（第二个元素）的数组。例如，\n56         // [\"given\", \"Given\"]。\n57 \
  \        $sourceKeyword = $this->parseKeyword($stepLine);\n58 \n59         $step->keyword\
  \ = $sourceKeyword[0];\n60 \n61         $step->text = $this->parseText(\n62    \
  \         $stepLine, $sourceKeyword[1])\n63         );\n64 \n65         $step->start\
  \ = $this->lineToPosition($stepLine);\n66 \n67         $step->data = $this->parseStepData($stepLine);\n\
  68 \n69         $step->parameters = $this->parseStepParameters($stepLine);\n70 \n\
  71         return $step;\n72     }\n73 \n74     /**\n75      * 解析行并返回包含 DataTable\n\
  76      * 或 DocString 的数组。\n77      *\n78      * @param TextIndentation $stepLine\
  \ 需要解析的行。\n79      * @return DataTable[]|DocString[]\n80      */\n81     protected\
  \ function parseStepData(TextIndentation $stepLine): array\n82     {\n83       \
  \  $data = [];\n84 \n85         for ($i = 0; $i < count($stepLine->nestedLines);\
  \ $i++) {\n86             $cur = $stepLine->nestedLines[$i];\n87 \n88          \
  \   $content = (string) str($cur->line)->ltrim;\n89 \n90             // Doc strings\
  \ 可以以 \"\"\" 或 ``` 开头。\n91             // 我们将检查两者。\n92             if (str($content)->startsWith(['\"\
  \"\"', '```'])) {\n94                 $data[] = $this->parseDocString(\n95     \
  \                $cur,\n96                     $stepLine->allNestedLines\n97   \
  \              );\n98             } elseif (str($content)->startsWith('|')) {\n\
  100                // 如果当前行以竖线 | 开头，\n101                //我们将请求表格解析器处理\n102   \
  \             // 内容。\n103                $data[] = $this->parseTable(\n104     \
  \               $cur,\n105                    $stepLine->nestedLines\n106      \
  \          );\n107             }\n108         }\n109 \n110         return $data;\n\
  111     }\n112 }\n```\n\n\n\n\n\n`parseSteps` 方法遍历其提供的每一行，在第 29-32 行之间，我们检查当前行是否以任何一个步骤关键词开头。如果是，我们会在第\
  \ 31 行调用我们的 `parseStep` 方法来对步骤进行实际解析。\n\n`parseStep` 方法是我们完成的早期几个方法之一，它调用了许多我们已经开发的辅助解析方法。例如，它在第\
  \ 57 行调用了 `parseStepKeyword` 来解析内部内部和本地化的关键词。在第 61 行和 63 行之间，我们使用 `parseStepText`\
  \ 方法从步骤行中提取文本，而第 66 行和 67 行则解析额外信息，例如任何附加的数据表、文档字符串或参数。\n\n## 解析单个场景（Scenario）和背景（Background）\n\
  \n现在我们将开始解析单个 Gherkin 场景（Scenario）和背景（Background）结构。我们将共同完成，因为 Gherkin 的背景与场景相似。如果查看\
  \ `图 12.63`，我们可以看到它们在结构上是完全相同的：\n\n图 12.63 Gherkin 背景与场景示例 \n\n```\n 1 Feature:\
  \ Multiple site support\n 2   只有博客所有者可以发布博客，管理员除外，\n 3   管理员可以发布所有博客。\n 4 \n 5 \
  \  Background:\n 6     有一个名为 \"Greg\" 的全局管理员\n 7     以及一个名为 \"Greg's anti-tax rants\"\
  \ 的博客\n 8     以及一个名为 \"Dr. Bill\" 的客户\n 9     以及一个由 \"Dr. Bill\" 拥有的名为 \"Expensive\
  \ Therapy\" 的博客\n10 \n11   Scenario: Dr. Bill posts to own blog\n12     以 Dr. Bill\
  \ 的身份登录\n13     当我尝试发布到 \"Expensive Therapy\"\n```\n\n然而，请记住在数据建模过程中，我们创建了两个不同的\
  \ PHP 类来表示这些结构。由于这些功能非常相似，我们实际上可以利用场景解析器来实现我们的背景解析器。\n\n图 12.64 解析单个 Gherkin 场景\
  \ \n\n```\n 1 <?php\n 2 \n3 use Illuminate\\Support\\Str;\n 4 \n5 class GherkinParser\n\
  6 {\n 7 \n 8     // ...\n 9\n10     /**\n11      * 解析一个 Gherkin 场景。\n12      *\n\
  13      * @param TextIndentation $scenarioLine 需要解析的行。\n14      * @param TextIndentation|null\
  \ $tagLine 标签行。\n15      * @return Scenario\n16      * @throws Exception\n17   \
  \   */\n18     protected function parseScenario(\n19         TextIndentation $scenarioLine,\n\
  20         TextIndentation $tagLine = null): Scenario\n21     {\n22         $scenario\
  \ = new Scenario();\n23 \n24         $scenario->comments = $this->parseComments(\n\
  25             $scenarioLine->nestedLines\n26         );\n27 \n28         $scenario->description\
  \ = $this->parseDescription(\n29             $scenarioLine->allNestedLines\n30 \
  \        );\n31 \n32         $scenario->keyword = 'scenario';\n33 \n34         $scenario->name\
  \ = (string) str($this->parseName(\n35             $scenarioLine,\n36          \
  \   'scenario')\n37         )->ltrim;\n38 \n39         $scenario->steps = $this->parseSteps(\n\
  40             $scenarioLine->nestedLines\n41         );\n42 \n43         $scenario->start\
  \ = $this->lineToPosition(\n44             $scenarioLine\n45         );\n46 \n47\
  \         $scenario->examples = $this->parseExamples(\n48             $scenarioLine->nestedLines\n\
  49         );\n50 \n51         if ($tagLine) {\n52             $scenario->tags =\
  \ $this->parseTags($tagLine);\n53         }\n54 \n55         return $scenario;\n\
  56     }\n57 \n58     // ...\n59 \n60 }\n```\n\n`图 12.64` 中 `parseScenario` 方法实现的有趣之处在于，它并没有做任何“新”的操作。它只是获取了提供的所有行（在此情况下，它将接收来自\
  \ `图 12.63` 的第 11-13 行），并调用现有方法来组合我们最终的 Scenario 对象。现在让我们来看 `图 12.65`，它解析 Gherkin\
  \ 背景：\n\n图 12.65 解析 Gherkin 背景 \n\n```\n 1 <?php\n 2 \n3 use Illuminate\\Support\\\
  Str;\n 4 \n5 class GherkinParser\n6 {\n 7 \n 8     // ...\n 9\n10     /**\n11  \
  \    * 解析一个 Gherkin 背景。\n12      *\n13      * @param TextIndentation[] $lines 待解析的行。\n\
  14      * @return Background|null\n15      * @throws Exception\n16      */\n17 \
  \    protected function parseBackground(array $lines): ?Background\n18     {\n19\
  \         for ($i = 0; $i < count($lines); $i++) {\n20             $cur = $lines[$i];\n\
  21 \n22             $content = (string) str($cur)->ltrim;\n23 \n24             //\
  \ 测试当前行是否以 Background\n25             // 关键词开头。对于英语，这检查 \"Background:\"。\n26   \
  \          if (str($content)->startsWith(\n27                     $this->gherkinKeywords['background']))\
  \ {\n28                 $scenario = $this->parseScenario($cur);\n29 \n30       \
  \          $background = new Background();\n31                 $background->steps\
  \ = $scenario->steps;\n32                 $background->start = $scenario->start;\n\
  33                 $background->keyword = 'background';\n34 \n35               \
  \  return $background;\n36             }\n37         }\n38 \n39         return null;\n\
  40     }\n41 \n42     // ...\n43 \n44 }\n```\n\n在深入研究 `图 12.65` 中 `parseBackground`\
  \ 方法的之前，了解它如何与 `图 12.63` 中的输入相关将非常有帮助。`parseBackground` 方法将在 feature 或 rule 级别被调用，以定位可能存在的背景对象。在\
  \ `图 12.63` 中，由于我们的缩进管理器根据相对缩进对行进行分组，`parseBackground` 方法将接收第 2、5 和 11 行。我们的实现将遍历所有这些行，并检查第\
  \ 26 和 27 行的当前行是否以背景关键词开头。\n\n一旦我们的方法发现了应该解析为 Gherkin 背景的行，我们会在第 28 行调用我们的 `parseScenario`\
  \ 方法。我们这样做是因为这两个构造非常相似。最后，在第 30 到 33 行之间，我们创建了最终 Background 对象的新实例，并将 `parseScenario`\
  \ 方法的结果赋值给这个新对象。\n\n## 场景大纲（Scenario Outlines）和模板（Templates）\n\n我们已经接近终点了，下一步是处理解析场景大纲和模板。`图\
  \ 12.66` 为我们正在处理的内容提供了快速回顾：\n\n图 12.66 Gherkin 场景大纲与模板示例 \n\n```\n1 Scenario Outline:\
  \ eating\n2   Given 有 <start> 根黄瓜\n3   When 我吃 <eat> 根黄瓜\n4   Then 我应该剩下 <left>\
  \ 根黄瓜\n5 \n6   Examples:\n7     | start | eat | left |\n8     |    12 |   5 |  \
  \  7 |\n9     |    20 |   5 |   15 |\n```\n\n从 `图 12.66` 我们可以看到场景大纲在结构上与我们的场景非常相似，但它通过“Examples:”关键词还附加了一个数据表。幸运的是，我们已经拥有了所有的辅助方法来帮助我们将\
  \ `图 12.66` 解析为 ScenarioOutline 对象：\n\n图 12.67 解析 Gherkin 场景模板 \n\n\n\n\n\n```php\n\
  <?php \n\nuse Illuminate\\Support\\Str;\n\nclass GherkinParser\n{\n\n    // ...\n\
  \n    /**\n     * Parses a Gherkin Scenario Outline.\n     *\n     * @param TextIndentation\
  \ $scenarioLine The line to parse.\n     * @param TextIndentation|null $tagLine\
  \ The tag line.\n     * @return ScenarioOutline\n     * @throws Exception\n    \
  \ */\n    protected function parseScenarioOutline(\n        TextIndentation $scenarioLine,\n\
  \        TextIndentation $tagLine = null\n    ): ScenarioOutline\n    {\n      \
  \  $scenario = new ScenarioOutline();\n\n        $scenario->comments = $this->parseComments(\n\
  \            $scenarioLine->nestedLines\n        );\n\n        $scenario->start\
  \ = $this->lineToPosition($scenarioLine);\n\n        $scenario->keyword = 'scenario_outline';\n\
  \n        $scenario->name = $this->parseName(\n            $scenarioLine,\n    \
  \        'scenario_outline'\n        );\n\n        $scenario->steps = $this->parseSteps(\n\
  \            $scenarioLine->nestedLines\n        );\n\n        $scenario->examples\
  \ = $this->parseExamples(\n            $scenarioLine->nestedLines\n        );\n\n\
  \        if ($tagLine) {\n            $scenario->tags = $this->parseTags($tagLine);\n\
  \        }\n\n        return $scenario;\n    }\n\n    // ...\n\n}\n```\n\n对于`图 12.67`\
  \ 中的 `parseScenarioOutline` 方法，没什么好说的，因为它与我们之前处理过的最后几个方法非常相似。它接收包含正确关键字的行的缩进对象，并管理对其他解析器方法的调用以构建最终结果。需要注意的是的一点是，它接受一个可选的\
  \ `$tagLine` 参数，我们将在下一节解析场景列表时查看它。\n\n### 解析多个场景\n\n在`图 12.68` 中，我们可以看到该图表包含了多个场景。我们要解析的场景开始于第\
  \ 4 行和第 9 行。我们的解析器方法将接收第 1 行之后出现的所有行，因此我们能够利用现有的策略，即对这些行进行循环遍历，并检查它们是否以我们的场景关键字开头。\n\
  \n图 12.68 多个 Gherkin 场景示例 \n\n```\nFeature: Guess the word\n\n  # The first example\
  \ has two steps\n  Scenario: Maker starts a game\n    When the Maker starts a game\n\
  \    Then the Maker waits for a Breaker to join\n\n  # The second example has three\
  \ steps\n  Scenario: Breaker joins a game\n    Given the Maker has started a game\
  \ with the word \"silky\"\n    When the Breaker joins the Maker's game\n    Then\
  \ the Breaker must guess a word with 5 characters\n```\n\n我们将继续沿用长期 true 策略：检查行是否以相应的关键字开头，然后调用相应的内部解析方法。我们还将在该方法中处理场景模板和大纲：\n\
  \n图 12.69 解析 Gherkin 场景 \n\n```php\n<?php \n\nuse Illuminate\\Support\\Str;\n\n\
  class GherkinParser\n{\n\n    // ...\n\n    /**\n     * Parses a list of Gherkin\
  \ Scenarios.\n     *\n     * @param TextIndentation[] $lines The lines to parse.\n\
  \     * @return array\n     * @throws Exception\n     */\n    protected function\
  \ parseScenarios(array $lines): array\n    {\n        $scenarios = [];\n\n     \
  \   for ($i = 0; $i < count($lines); $i++) {\n            $cur = $lines[$i];\n\n\
  \            $content = str($cur->line)->ltrim;\n\n            // Test if the current\
  \ line starts with the Scenario\n            // keyword. For English, this checks\
  \ for \"Scenario:\".\n            // The Examples keyword will also be parsed as\
  \ a\n            // scenario. For English, this checks for \"Examples:\".\n    \
  \        if ($content->startsWith([\n                $this->gherkinKeywords['scenario'],\n\
  \                $this->gherkinKeywords['example']\n            ])) {\n        \
  \        $scenarios[] = $this->parseScenario(\n                    $cur, $this->getTagsLine($lines,\
  \ $i)\n                );\n\n            } elseif ($content->startsWith(\n     \
  \               $this->gherkinKeywords['scenario_outline'],\n                  \
  \  $this->gherkinKeywords['scenario_template']\n            )) {\n\n           \
  \     // Parses Scenario Outline if the current line\n                // begins\
  \ with the scenario_outline or the\n                // scenario_template keyword.\
  \ For English,\n                // this is \"Scenario Outline:\" or \"Scenario Template:\"\
  .\n                $scenarios[] = $this->parseScenarioOutline(\n               \
  \     $cur, $this->getTagsLine($lines, $i)\n                );\n            }\n\
  \        }\n\n        return $scenarios;\n    }\n\n    // ...\n\n}\n```\n\n### 解析单个规则和多个规则\n\
  \n如果我们查看`图 12.70`，我们可以看到一个从第 3 行开始的 Gherkin 规则，该规则有多个开始于第 5 行和第 12 行的示例。\n\n图 12.70\
  \ Gherkin 示例 \n\n```\nFeature: Highlander\n  Rule: There can be only One\n    Example:\
  \ Only One -- More than alive\n      Given there are ninjas\n      When ninjas meet,\
  \ they fight\n      Then one dies (but not me)\n      And there is one ninja less\
  \ alive\n    Example: Only One -- alive\n      Given there is only ninja\n```\n\n\
  我们解析这些内容的过程与我们目前为止进行的所有嵌套解析相同。`图 12.71` 包含了我们的 `parseRule` 方法，该方法负责解析单个规则。如果我们回到`图\
  \ 12.70`，`parseRule` 方法将分别接收第 5 行和第 12 行的缩进行。\n\n图 12.71 解析单个 Gherkin 规则 \n\n```php\n\
  <?php \n\nuse Illuminate\\Support\\Str;\n\nclass GherkinParser\n{\n\n    // ...\n\
  \n    /**\n     * Parses a Gherkin Rule.\n     *\n     * @param TextIndentation\
  \ $ruleLine The line to parse.\n     * @return Rule\n     * @throws Exception\n\
  \     */\n    protected function parseRule(TextIndentation $ruleLine): Rule\n  \
  \  {\n        $rule = new Rule();\n\n        $rule->comments = $this->parseComments($ruleLine->nestedLines);\n\
  \        $rule->start = $this->lineToPosition($ruleLine);\n        $rule->keyword\
  \ = 'rule';\n        $rule->name = $this->parseName($ruleLine, 'rule');\n\n    \
  \    $rule->description = $this->parseDescription(\n            $ruleLine->allNestedLines\n\
  \        );\n\n        $rule->background = $this->parseBackground(\n           \
  \ $ruleLine->nestedLines\n        );\n\n        $rule->scenarios = $this->parseScenarios(\n\
  \            $ruleLine->nestedLines\n        );\n\n        return $rule;\n    }\n\
  \n    // ...\n\n}\n```\n\n与我们在 feature 中解析多个场景的方式类似，我们可以创建第二个解析方法，它将接收`图 12.70`\
  \ 中从第 1 行开始的 feature。这个新方法将遍历其所有的直接子行，并检查规则关键字。如果找到，它将调用我们的 `parseRule` 来处理单个规则的解析：\n\
  \n图 12.72 解析多个 Gherkin 规则 \n\n\n\n\n```php\n<?php\n\nuse Illuminate\\Support\\Str;\n\
  \nclass GherkinParser\n{\n    // ...\n\n    /**\n     * 解析一组 Gherkin 规则 (Rules)。\n\
  \     *\n     * @param TextIndentation[] $lines 需要解析的行。\n     * @return array\n\
  \     * @throws Exception\n     */\n    protected function parseRules(array $lines):\
  \ array\n    {\n        $rules = [];\n\n        for ($i = 0; $i < count($lines);\
  \ $i++) {\n            $cur = $lines[$i];\n\n            $content = (string) str($cur->line)->ltrim;\n\
  \n            // 测试当前行是否以 Rule 关键字开头。\n            // 对于英文，这会检查是否存在 \"Rule:\"。\n\
  \            if (str($content)->startsWith(\n                $this->gherkinKeywords['rule']))\
  \ {\n                $rules[] = $this->parseRule($cur);\n            }\n       \
  \ }\n\n        return $rules;\n    }\n\n    // ...\n}\n```\n\n### 解析特性\n\n我们目前所做的所有工作都是为了实现最终的结构：特性（feature）。在我们目前实现的所有解析方法中，我们的策略始终是遍历最终来自特性行的行。我们将在本节继续这种做法。为了快速回顾我们需要做的工作，让我们快速查看`图\
  \ 12.73`：\n\n图 12.73 Gherkin 特性示例 \n\n```\nFeature: Guess the word\n\n  # 第一个示例有两个步骤\n\
  \  Scenario: Maker starts a game\n    When the Maker starts a game\n    Then the\
  \ Maker waits for a Breaker to join\n```\n\n每个 Gherkin 文件最多只有一个特性（feature），它们出现在缩进最少的一行上。我们可以利用这一事实遍历每一行，并找到包含我们特性关键字的那一行。一旦找到了这个关键字，我们就可以获取该行并使用`图\
  \ 12.74` 中的 `parseFeature` 方法对其进行解析：\n\n图 12.74 解析 Gherkin 特性 \n\n```php\n<?php\n\
  \nuse Illuminate\\Support\\Str;\n\nclass GherkinParser\n{\n    // ...\n\n    /**\n\
  \     * 解析一个特性 (feature)。\n     *\n     * @param TextIndentation $featureLine 需要解析的行。\n\
  \     * @param TextIndentation[] $lines 需要解析的行。\n     * @return Feature\n     *\
  \ @throws Exception\n     */\n    protected function parseFeature(\n        TextIndentation\
  \ $featureLine,\n        array $lines): Feature\n    {\n        $feature = new Feature();\n\
  \n        $feature->comments = $this->parseComments($lines);\n        $feature->start\
  \ = $this->lineTo($featureLine);\n        $feature->keyword = 'feature';\n\n   \
  \     $feature->name = $this->parseName($featureLine);\n        $feature->background\
  \ = $this->parseBackground($lines);\n        $feature->scenarios = $this->parseScenarios($lines);\n\
  \        $feature->rules = $this->parseRules($lines);\n\n        return $feature;\n\
  \    }\n\n    // ...\n}\n```\n\n由于 Gherkin 特性包含了我们已经写过的所有结构，因此我们还没有像处理其他结构那样调用过它。对\
  \ `parseFeature` 方法的调用实际上发生在我们在整个过程开始时定义的 `parse` 方法中。`图 12.75` 包含了我们对 `parse` 方法的修改：\n\
  \n```php\n<?php\n\nuse Illuminate\\Support\\Str;\n\nclass GherkinParser\n{\n   \
  \ // ...\n\n    /**\n     * 解析 Gherkin 文本。\n     *\n     * @param string $value\
  \ 需要解析的字符串。\n     * @param int $tabSize 制表符大小。\n     * @return Feature|null\n  \
  \   * @throws Exception\n     */\n    public function parse(string $value, int $tabSize\
  \ = 2)\n    {\n        $value = Str::normalizeEol($value);\n        $this->locator\
  \ = new CharacterPosition($value);\n\n        $indentationManager = new IndentationManager($value,\
  \ $tabSize);\n        $lines = $indentationManager->getLines();\n\n        // 定位特性的起始位置。\n\
  \        for ($i = 0; $i < count($lines); $i++) {\n            $cur = $lines[$i];\n\
  \n            $content = (string) str($cur->line)->ltrim;\n\n            if (str($content)->startsWith(\n\
  \                    $this->gherkinKeywords['feature'])) {\n                return\
  \ $this->parseFeature($cur, $cur->nestedLines);\n            }\n        }\n\n  \
  \      return null;\n    }\n\n    // ...\n}\n```\n\n随着此更改，我们实现 Gherkin 解析器的第一次尝试已经完成。走到这一点是一段历程，但我们现在可以这样调用我们的解析器了：\n\
  \n```php\n<?php\n\n$gherkin = <<<GHERKIN\nFeature: Feature name\n\n  Scenario Outline:\
  \ eating\n    Given there are <start> cucumbers\n    When I eat <eat> cucumbers\n\
  \    Then I should have <left> cucumbers\n\n    Examples:\n        | start | eat\
  \ | left |\n        |    12 |   5 |    7 |\nGHERKIN;\n\n$parser = new GherkinParser();\n\
  \n$parser->parse($gherkin, 2);\n```\n\n为了产生以下最终结果：\n\n图 12.77 \n\n\n\n\n\n```\n\
