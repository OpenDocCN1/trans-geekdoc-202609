  ```\n\n### 3.6 反转字符串的字符\n\n图 3.13 reverse 方法签名 \n\n```php\n 1 <?php\n 2 \n 3 /**\n\
  4  * Versions: Laravel 8, 9\n 5  *\n6  * @return string\n 7  */\n 8 public static\
  \ function reverse(\n 9     string $value\n10 );\n```\n\n`reverse` 辅助方法生成一个所有字符顺序都反转的新字符串。\n\
  \n以下示例展示了如何对简单输入使用 `reverse` 辅助方法：\n\n图 3.14\n\n```php\n1 <?php\n2 \n3 use Illuminate\\\
  Support\\Str;\n4 \n5 // Returns \"!gnirts a ma I\"\n6 Str::reverse('I am a string!');\n\
  ```\n\n如果你需要处理反转后的字符，手动分割输入字符串、反转该数组，然后直接处理结果数组会高效得多。通过这种方式调用 `split` 将限制 `mb_str_split`\
  \ 调用的次数，对于大量的输入文本，这可能会变得非常消耗资源：\n\n图 3.15\n\n```php\n1 <?php\n2 \n3 // The following\
  \ returns a\n4 // collection of characters.\n5 str('I am a string!')\n6     ->split(1)\n\
  7     ->reverse();\n```\n\n回文是指任何正反读相同的单词或短语。我们可以利用 `reverse` 辅助方法编写一个异常高效的辅助方法来检查一个单词是否为回文：\n\
  \n图 3.16\n\n```php\n 1 <?php\n 2 \n 3 $words = [\n 4     'wow',\n 5     'tuesday',\n\
  \ 6     'noon',\n 7     'racecar',\n 8     ];\n 9 \n10 Str::macro('isPalindrome',\
  \ function ($word) {\n11     return $word == static::reverse($word);\n12 });\n13\
  \ \n14 collect($words)->map(function ($word) {\n15     return $word.': '. (Str::isPalindrome($word)\
  \ ? 'Yes' : 'No');\n16 })->all();\n```\n\n上述示例将产生以下结果：\n\n图 3.17\n\n```json\n1 [\n\
  2     \"wow: Yes\",\n3     \"tuesday: No\",\n4     \"noon: Yes\",\n5     \"racecar:\
  \ Yes\",\n6 ]\n```\n\n### 3.7 从标题创建 URL\n\n图 3.18 slug 方法签名 \n\n```php\n 1 <?php\n\
  \ 2 \n 3 /**\n4  * Versions: Laravel 8, 9\n 5  *\n 6  * @return string\n 7  */\n\
  \ 8 public static function slug(\n 9          string $title,\n10          string\
  \ $separator = '-',\n11     string|null $language = 'en'\n12 );\n```\n\n我们可以使用 `slug`\
  \ 辅助方法将提供的值格式化为 URL。此方法在从动态输入（如标题）构建 URL 时非常有用。\n\n内部，`slug` 辅助方法将执行以下步骤来生成最终字符串：\n\
  \n1. 将 UTF-8 字符串转换为 ASCII 等效值；你可以提供可选语言来影响此步骤。\n2. 将空格、连字符和下划线转换为指定的分隔符。\n3. 将所有的“@”字符替换为“at”。\n\
  4. 移除所有非指定的、字母和数字。\n\n以下示例使用集合来观察 `slug` 辅助方法的行为：\n\n图 3.19\n\n```php\n1 <?php\n\
  2 \n3 use Illuminate\\Support\\Str;\n4 \n5 $titles = [\n6     'Generating CSS',\n\
  7     'Working with Dynamic',\n8     'Conditional Parameters',\n9     'some/path/value---with_characters',\n\
  10     'Panic@thedisco'\n11 ];\n12 \n13 collect($titles)->map(function ($title)\
  \ {\n14     return Str::slug($title);\n15 })->all();\n```\n\n上一个示例将产生类似的输出：\n\n\
  图 3.20\n\n```json\n1 [\n2     \"generating-dynamic-css\",\n3     \"working-with-dynamic-variables\"\
  ,\n4     \"conditional-parameters\",\n5     \"somepathvalue-with-characters\",\n\
  6     \"panic-at-the-disco\",\n7 ]\n```\n\n链式字符串也可以使用 `slug` 辅助方法：\n\n图 3.21\n\n\
  ```php\n1 <?php\n 2 \n3 // Returns \"an-existing-title\"\n4 (string) str('An-Existing_Title!')\n\
  5     ->slug('-');\n```\n\n### 3.8 使用 snake 格式化字符串\n\n图 3.22 snake 方法签名 \n\n```php\n\
