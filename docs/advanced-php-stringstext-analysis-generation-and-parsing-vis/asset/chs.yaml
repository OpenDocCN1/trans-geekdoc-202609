  \ `substr` 方法来移除结果字符串的开头和结尾：\n\nFigure 17.12 \n\n```\n1 <?php\n2 \n3 $output = str($crawler->html())\n\
  4             ->substr(6)\n5             ->substr(0, -7)\n6             ->toString();\n\
  ```\n\n通过在**图 17.12**中的更改，我们的输出现在正如我们预期的那样：\n\nFigure 17.13 \n\n```\n 1 <article\
  \ class=\"prose lg:prose-xl\">\n 2     <h1>Title</h1>\n 3 \n 4     <p>Paragraph\
  \ one.</p>\n 5     <p>Paragraph two.</p>\n 6 </article>\n 7 \n 8 <article class=\"\
  prose lg:prose-xl\">\n 9     <h1>Title Two</h1>\n10 \n11     <p>Paragraph one.</p>\n\
  12     <p>Paragraph two.</p>\n13 </article>\n```\n\n### 17.1 反转双编码的 HTML 实体\n\n\
  HTML 实体的双编码是我们必须处理的一个常见问题。这通常是由于前端编辑器在无意中编码了特殊字符导致的。然后在信息显示在我们的网站之前，第二个进程又执行了 HTML\
  \ 编码步骤。最终结果的示例可以在**图 17.14** 中找到：\n\nFigure 17.14 \n\n```\n1 <p>&amp;copy; Author\
  \ Name</p>\n```\n\n在**图 17.14**中，我们有一个双编码的版权符号字符。该过程的第一步产生了：\n\nFigure 17.15 \n\n\
  ```\n1 <p>&copy; Author Name</p>\n```\n\n当第二次编码过程发生时，它对上一次操作的“`&`”字符进行了编码，从而产生了**图\
  \ 17.14**中的输出。如果我们查看编码错误的输出，可以发现所有不希望的编码总是以“`&`”字符序列开头。我们可以利用这一事实构造一个较小的辅助方法，来帮助我们反转这种无意的双编码：\n\
  \nFigure 17.16 reverseHtmlEncoding 辅助方法实现 \n\n```\n 1 <?php\n 2 \n3 use Illuminate\\\
  Support\\Str;\n 4 use Illuminate\\Support\\Stringable;\n 5 \n6 Str::macro('reverseHtmlEncoding',\
  \ function ($value) {\n 7     $reversed = (string) str($value)->replace('&amp;',\
  \ '&');\n 8 \n9     return preg_replace_callback('/&(?!&)[^#A-z]/', function ($matches)\\\
  \n10  {\n11         return '&amp;'.substr($matches[0], 1);\n12     }, $reversed);\n\
  13 });\n 14 \n15 Stringable::macro('reverseHtmlEncoding', function () {\n16    \
  \ return new static(Str::reverseHtmlEncoding($this->value));\n17 });\n```\n\n我们可以这样使用新的新辅助方法来反转双编码的\
  \ HTML 实体：\n\nFigure 17.17 \n\n```\n1 <?php\n2 \n3 use Illuminate\\Support\\Str;\n\
  \ 4 \n5 // 返回 \"&copy; Author Name\"\n6 Str::reverseHtmlEncoding(\"&amp;copy; Author\
  \ Name\");\n```\n\n我们的方法通过首先将所有的“`&`”实例替换为单个的“`&`”字符。这解决了我们撤销双编码 HTML 实体的即时问题，但做法过于激进，会撤销编码。例如，如果我们有一个已经编码过一次的字符串，它就会损坏。然而，在大多数情况下，这种简单的方法就足够了。\n\
  \n### 17.2 使用嵌入语言\n\nHTML 实体的双编码是我们必须处理的一个常见问题。这通常是由于前端编辑器在无意中编码了特殊字符导致的。然后在信息显示在我们的网站之前，第二个进程又执行了\
  \ HTML 编码步骤。……（后续文本遵循类似的逻辑）\n\n我们的方法通过首先将所有的“`&`”实例替换为单个的“`&`”字符。这解决了我们撤销双编码 HTML\
  \ 实体的即时问题，但做法过于激进，会撤销编码。例如，如果我们有一个已经编码过一次的字符串，它就会损坏。然而，在大多数情况下，这种简单的方法就足够了。\n\n\n\
  \n\n\n# 图 17.21 片段解析器数据流\n\n我们将像以前多次那样开始实现我们的片段解析器：通过定义数据模型。此外，我们将创建一个基础解析器实现，在本章后面将用它来解析\
  \ HTML 片段和参数。我们可以在**图 17.22** 中看到这些内容：\n\n## 图 17.22 开始我们的 HTML 片段解析器\n\n```php\n\
  \ 1 <?php\n 2 \n3 enum AttributeType\n4 {\n5     case Attribute;\n6     case Parameter;\n\
  7 }\n8 \n9 class Fragment\n10 {\n11     public $startPosition = 0;\n12     public\
  \ $endPosition = 0;\n13     public $content = '';\n14 \n15     public function contains(int\
  \ $position)\n16     {\n17         return $position >= $this->startPosition &&\n\
  18             $position <= $this->endPosition;\n19     }\n20 }\n21 \n22 class FragmentAttribute\
  \ extends Fragment\n23 {\n24     public $name = '';\n25     public $value = '';\n\
  26     public $type = AttributeType::Attribute;\n27 }\n28 \n29 class HtmlFragment\
  \ extends Fragment\n30 {\n31     public $isClosingTag = false;\n32     public $isSelfClosing\
  \ = false;\n33     public $documentContent = '';\n34     public $innerContent =\
  \ null;\n35     public $name = null;\n36     public $tagName = '';\n37 \n38    \
  \ /**\n39      * @var FragmentAttribute[]\n40      */\n41     public $attributes\
  \ = [];\n42 }\n43 \n44 abstract class BaseFragmentParser\n45 {\n46     protected\
  \ $string;\n47     protected $buffer = '';\n48     protected $position = 0;\n49\
  \     protected $current = null;\n50     protected $next = null;\n51     protected\
  \ $prev = null;\n52 \n53     protected function checkCurrentOffsets($offset)\n54\
  \     {\n55         $this->position = $offset;\n56         $this->current = $this->string[$offset]\
  \ ?? null;\n57         $this->next = $this->string[$offset + 1] ?? null;\n58   \
  \      $this->prev = $this->string[$offset - 1] ?? null;\n59     }\n60 \n61    \
  \ protected function resetState()\n62     {\n63         $this->position = 0;\n64\
  \         $this->buffer = '';\n65         $this->next = null;\n66         $this->prev\
  \ = null;\n67         $this->current = null;\n68     }\n69 \n70     protected function\
  \ isStartOfString()\n71     {\n72         return $this->current == '\"' || $this->current\
  \ == \"'\";\n73     }\n74 \n75     protected function scanToEndOfString($start)\n\
  76     {\n77         $stringStyle = $this->current;\n78         $this->buffer .=\
  \ $this->current;\n79         $returnedOn = $start;\n80 \n81         for ($i = $start\
  \ + 1; $i < count($this->string); $i++) {\n82             $this->checkCurrentOffsets($i);\n\
  83 \n84             $this->buffer .= $this->current;\n85             if ($this->current\
  \ == $stringStyle) {\n86                 $returnedOn = $i;\n87                 break;\n\
  88             }\n89         }\n90 \n91         return $returnedOn;\n92\n```\n\n\
  在 `17.22` 中，我们定义了一个基础 `Fragment` 类，它包含少量信息，例如原始文档的内容以及起始和结束位置。此外，在第 15-19 行中，我们定义了一个辅助方法，可以用于判断任意位置是否落在片段内。在章节末尾实现我们的片段时，我们将广泛使用该方法。\n\
  \n`HtmlFragment` 和 `FragmentAttribute` 类扩展了我们的基础片段，但为每个用例添加了额外信息。例如，`FragmentAttribute`\
  \ 定义了一个 `$type` 属性，它将指示任何给定的片段看起来是 HTML 参数还是属性。然而，`HtmlFragment` 包含更多信息。\n\n`HtmlFragment`\
  \ 定义在第 29 到 42 行之间。`$isClosingTag` 属性将决定解析出的片段是否为闭合标签，而 `$isSelfClosing` 将指示解析出的片段是否为自闭标签。第\
  \ 41 行的 `$attributes` 数组将包含 `FragmentAttribute` 类的实例。然而，更有趣的属性是与内容和标签名相关的。\n\n`$tagName`\
  \ 属性仅包含从文档解析出的标签名；在大多数情况下，这将是文档中第一个空格之前的内容。`$documentContent` 将包含产生 HTML 片段的解析文本；它不包含被忽略的内容。同样，`$innerContent`\
  \ 属性将包含出现在由于我们的范围限制而被跳过的标签名之后的所有片段内容。第 35 行的 `$name` 最终将成为 `Fragment` 的实例，允许我们更轻松地检测任意位置是否落在\
  \ HTML 元素的名称范围内。\n\n我们的基础片段解析器定义在第 44 到 93 行之间，它设置了几个实用方法，我们可以用它们来管理解析器的当前状态，并检测和移动字符串。这些技术与我们在第\
  \ 16 章中开发的相似。在深入研究我们的实现之前，我们首先探索我们的片段解析器究竟将使用什么来确定片段边界。\n\n查看 `17.23`，我们可以看到一个 Vue.js\
  \ 开发者熟悉的简单 HTML 文档。它包含一个无序列表、一些条件逻辑和一个 Vue 循环：\n\n## 17.23\n\n```html\n1 <ul v-if=\"\
  items.length > 0 && items.length < 10\">\n2     <li v-for=\"item in items\">\n3\
  \         {{ item.text }}\n4     </li>\n5 </ul>\n```\n\n在第一行，我们的无序列表包含一个包含某些问题字符的条件。例如，它包含了\
  \ `items.length > 0` 条件，这可能被错误地解释为 HTML 标签的结束。此外，它还有 `items.length < 10`，这也可以很容易被解释为新\
  \ HTML 标签的开始。我们将考虑这些细微情况，因为我们可以跳过元素内的字符串。\n\n更复杂的边缘情况可以在 `17.24` 中找到：\n\n## 17.24\n\
  \n```html\n1 <span>Is 5 < 3? No, but 3 < 5!</span>\n```\n\n在 `17.24` 中，我们有一个 HTML\
  \ 标签，其内容内包含了小于和大于号字符。理想情况下，输入文档包含适用于这两种情况的 HTML 实体，但遗憾的是大多数情况下并非如此。这些处理起来比较复杂，因为我们没有可以跳过的简单字符串。然而，我们可以做的是，每当我们解析\
  \ HTML 片段并遇到大于号的新实例或输入文档的结尾时，放弃解析当前的 HTML 片段。在 `17.24` 中，我们可以看到这种逻辑在遇到内容中的 `< 5`\
  \ 时，会放弃将 `< 3` 解析为 HTML 元素。同样，它在遇到 `</span>` 元素的起始小于字符时，会放弃解析文档的 `< 5` 部分。\n\n我们需要考虑的另一个类似的边缘情况是\
  \ script 标签，它在许多场景下可能包含问题字符，例如在 `17.25` 中：\n\n## 17.25\n\n```html\n1 <ul v-if=\"\
  items.length > 0 && items.length < 10\">\n2     <li v-for=\"item in items\">\n3\
  \         {{ item.text }}\n4     </li>\n5 </ul>\n6 \n7 \n8 <script>\n9     if (total\
  \ < accountBalance) {\n10         // Process transaction.\n11     }\n12 </script>\n\
  ```\n\n我们处理 JavaScript 内容的策略是检测何时进入了 script 标签，并跳过文档直到遇到闭合 script 标签。如果我们的 JavaScript\
  \ 包含包含“</script>”内容的字符串字面量，这种方法并不是万无一的，但我们将接受这种局限性，以大幅简化我们解析器的实现。\n\n\n\n\n\n```\n\
  1 <{{ $element }} class=\"bg-white\">\n2 \n3 </{{ $element }}>\n```\n\n为了演示我们的概念有多么灵活，我们将使用一个简单的正则表达式来查找我们想要忽略的区域。在图\
  \ 17.27 中，我们使用正则表达式查找文档中匹配以下所有区域：\n\n图 17.27\n\n```php\n1 <?php\n2 \n3 $blade =\
  \ <<<'BLADE'\n4 <{{ $element }} class=\"bg-white\">\n5 \n6 </{{ $element }}>\n7\
  \ BLADE;\n8 \n9 preg_match_all('/{{.*?}}/i', $blade, $echos, PREG_OFFSET_CAPTURE);\n\
  ```\n\n这将产生以下匹配数组：\n\n图 17.28\n\n```\n 1 array:1 [\n 2   0 => array:2 [\n 3    \
  \ 0 => array:2 [\n 4       0 => \"{{ $element }}\"\n 5       1 => 1\n 6     ]\n\
  \ 7     1 => array:2 [\n 8       0 => \"{{ $element }}\"\n 9       1 => 37\n10 \
  \    ]\n11   ]\n12 ]\n```\n\n观察图 17.28，我们可以看到我们的正则表达式返回了起始偏移量（offset）以及匹配的内容。我们可以利用这两条信息构建一个数组，包含片段解析器（fragments\
  \ parser）最终应该忽略的起始和结束偏移量，如下所示：\n\n图 17.29\n\n```php\n1 <?php\n2 \n3 $ignore = [];\n\
  4 \n5 foreach ($echos[0] as $match) {\n6     $start = $match[1];\n7     $end   =\
  \ $start + str($match[0])->length() - 1;\n8     $ignore[$start] = $end;\n9 }\n```\n\
  \n我们通过将内容的长度加上起始偏移量减 1 来计算结束偏移量。在这里减 1 是为了考虑到我们的内容包含了起始偏移量捕获的初始字符。在执行图 17.29 中的代码后，我们的\
  \ `$ignore` 数组将包含以下值：\n\n图 17.30\n\n```\n1 array:2 [\n2   1 => 14\n3   37 => 50\n\
  4 ]\n```\n\n### 17.3 解析碎片化的 HTML 文档\n\n我们有了足够的背景信息来查看 `FragmentsDocumentParser`\
  \ 的实现了：\n\n图 17.31 FragmentsDocumentParser 实现\n\n\n\n\n```php\n<?php\n\nclass FragmentsDocumentParser\
  \ extends BaseFragmentParser\n{\n    private $fragments = [];\n\n    protected $ignoreRanges\
  \ = [];\n\n    private $isParsingScript = false;\n\n    public function setIgnoreRanges($ignoreRanges)\n\
  \    {\n        $this->ignoreRanges = $ignoreRanges;\n    }\n\n    private function\
  \ parseFragment($index)\n    {\n        $this->buffer = '';\n        $brokeEarly\
  \ = false;\n\n        for ($i = $index; $i < count($this->string); $i++) {\n   \
  \         if (array_key_exists($i, $this->ignoreRanges)) {\n                $jumpIndex\
  \ = $this->ignoreRanges[$i];\n                $this->buffer .= str(' ')->repeat($jumpIndex\
  \ - $i + 1);\n                $i = $jumpIndex;\n                continue;\n    \
  \        }\n            $this->checkCurrentOffsets($i);\n\n            if (($i !=\
  \ $index && $this->current == '<') ||\n                ($this->current != '>' &&\
  \ $this->next == null)) {\n                $brokeEarly = true;\n               \
  \ break;\n            }\n\n            if ($this->isStartOfString()) {\n       \
  \         $i = $this->scanToEndOfString($i);\n                continue;\n      \
  \      }\n\n            if ($this->current == '>') {\n                $this->buffer\
  \ .= $this->current;\n                break;\n            }\n\n            $this->buffer\
  \ .= $this->current;\n        }\n\n        if ($brokeEarly) {\n            $this->buffer\
  \ = '';\n            return;\n        }\n\n        $fragment = new HtmlFragment();\n\
  \        $fragment->startPosition = $index;\n        $fragment->endPosition = $this->position;\n\
  \        $fragment->content = $this->buffer;\n        $fragment->isSelfClosing =\
  \ str($this->buffer)->endsWith('/>');\n        $fragment->isClosingTag = str($this->buffer)->startsWith('</');\n\
  \n        $documentContentStartOffset = 1;\n        $documentContentEndOffset =\
  \ -1;\n\n        if ($fragment->isClosingTag) {\n            $documentContentStartOffset\
  \ = 2;\n        }\n\n        if ($fragment->isSelfClosing) {\n            $documentContentEndOffset\
  \ = -2;\n        }\n\n        $fragment->documentContent =\n            str($this->buffer)->substr(\n\
  \                $documentContentStartOffset,\n                $documentContentEndOffset\n\
  \            );\n\n        // Retrieve all content before the first space.\n   \
  \     $tagName = str($fragment->documentContent)->before(' ');\n        $fragment->tagName\
  \ = (string) $tagName->trim();\n\n        // Check if the tag name was an ignored\
  \ region.\n        // If so, we can grab that content substring.\n        if (array_key_exists(\n\
  \            $fragment->startPosition + $documentContentStartOffset,\n         \
  \   $this->ignoreRanges\n        )) {\n            $tagNameStart =\n           \
  \     $fragment->startPosition + $documentContentStartOffset;\n\n            $tagNameEnd\
  \ = $this->ignoreRanges[$tagNameStart];\n            $nameLength = $tagNameEnd -\
  \ $tagNameStart + 1;\n            $fragment->tagName = str($this->string)\n    \
  \            ->substr($tagNameStart, $nameLength)->value();\n        }\n\n     \
  \   // Create a Fragment representing the name.\n        if (str($fragment->tagName)->trim()->length\
  \ > 0) {\n            $fragment->name = new Fragment();\n            $fragment->name->content\
  \ = $fragment->tagName;\n            $fragment->name->startPosition =\n        \
  \        $fragment->startPosition + $documentContentStartOffset;\n\n           \
  \ $fragment->name->endPosition =\n                $fragment->name->startPosition\
  \ +\n                str($fragment->tagName)->length() - 1;\n        }\n\n     \
  \   // Calculate the start of the inner content.\n        // This will be the first\
  \ space after the tag name.\n        $innerContentStart = strpos($fragment->documentContent,\
  \ ' ');\n        if ($innerContentStart !== false) {\n            $innerContentFragment\
  \ = new Fragment();\n            $innerContentFragment->content = str($fragment->documentContent)\n\
  \                ->substr($innerContentStart)\n                ->trim();\n\n   \
  \         // Calculate the start and end positions of the inner content\n      \
  \      // relative to the document.\n            $innerContentFragment->startPosition\
  \ = mb_strpos(\n                $fragment->buffer,\n                $innerContentFragment->content\n\
  \            );\n            if ($fragment->isClosingTag) {\n                $innerContentFragment->startPosition\
  \ += 1;\n            }\n\n            $innerContentFragment->endPosition =\n   \
  \             $innerContentFragment->startPosition +\n                str($innerContentFragment->content)->length();\n\
  \        }\n        if (\n            $fragment->isClosingTag && !$fragment->isSelfClosing\
  \ &&\n            str($fragment->tagName)->lower() == 'script'\n        ) {\n  \
  \          $this->isParsingScript = true;\n        }\n\n        $this->fragments[]\
  \ = $fragment;\n    }\n\n    /**\n     * @return array\n     */\n    private function\
  \ buildFragmentIndex()\n    {\n        preg_match_all('/</', $this->string, $matches,\
  \ PREG_OFFSET_CAPTURE);\n        $fragmentStarts = [];\n\n        foreach ($matches[0]\
  \ as $match) {\n            $index = $match[1];\n            $isValid = true;\n\n\
  \            foreach ($this->ignoreRanges as $rangeStart => $rangeEnd) {\n     \
  \           if ($index >= $rangeStart && $index <= $rangeEnd) {\n              \
  \      $isValid = false;\n                    break;\n                }\n      \
  \      }\n\n            if ($isValid) {\n                $fragmentStarts[] = $index;\n\
  \            }\n        }\n\n        return $fragmentStarts;\n    }\n\n    public\
  \ function getFragments()\n    {\n        return $this->fragments;\n    }\n\n  \
  \  public function parse($value)\n    {\n        $this->isParsingScript = false;\n\
  \        $this->string = new Utf8StringIterator(\n            Str::normalizeEol($value,\
  \ \"\\n\")\n        );\n\n        $fragmentStartIndexes = $this->buildFragmentIndex();\n\
  \        $fragmentCount = count($fragmentStartIndexes);\n\n        for ($i = 0;\
  \ $i < $fragmentCount; $i++) {\n            $this->parseFragment($fragmentStartIndexes[$i]);\n\
  \            $this->resetState();\n\n            if ($this->isParsingScript) {\n\
  \                for ($j = $i + 1; $j < $fragmentCount; $j++) {\n              \
  \      $start = $fragmentStartIndexes[$j];\n                    $check = str($this->string)\n\
  \                        ->substr($start, 8)\n                        ->lower();\n\
  \n                    if ($check == '</script') {\n                        $this->isParsingScript\
  \ = false;\n                        $i = $j - 1;\n                        break;\n\
  \                    }\n                }\n            }\n        }\n\n        return\
  \ $this->fragments;\n    }\n}\n```\n\n\n\n\n## 实现细节\n\n图 `17.31` 包含许多组成部分，但主要与我们在之前章节中看到的过的技术和方法相同。因此，我们将讨论实现中更令人感兴趣的。我们将检查的第一个方面是内部如何管理忽略范围（ignore\
  \ ranges）。我们定义在第 11 到 14 行之间的 `setIgnoreRanges` 方法设置了我们内部的待忽略范围列表。这些范围被使用在第 153\
  \ 到 177 行之间的 `buildFragmentIndex` 方法中。该方法负责使用我们的正则表达式来确定源文档所有潜在 HTML 标签的起始偏移量。我们在第\
  \ 160 到 174 行之间遍历这些偏移量，以构建一个我们应该在输入文档中开始解析的所有偏移量的新列表。在第 164 到 169 行之间，我们将正则表达式获取的所有偏移量与我们应该忽略的范围列表进行比较。如果正则表达式捕获的起始偏移量包含在某个忽略范围内，我们不会将其添加到最终的片段起始位置列表中。\n\
  \n最终的片段起始位置列表用于定义在第 184 到 215 行之间的 `parse` 方法中。我们方法的前几行用于管理某些内部状态并设置我们内部的 `Utf8StringIterator`\
  \ 实例。我们的内部字符串迭代器包含了字符串迭代器的归一化内容。对文档中的换行符进行归一化很重要，因为这将极大简化解析输入字符串时相对偏移量的管理。\n\n我们在第\
  \ 194 到 212 行之间遍历潜在 HTML 片段起始偏移量列表。在此循环中，我们调用 `parseFragment` 方法，如果它能够成功解析 HTML\
  \ 元素，它将一个一个新的 `HtmlFragment` 实例添加到内部片段列表中。\n\n### parseFragment 逻辑\n\n我们的 `parseFragment`\
  \ 方法将包含一些逻辑来检查它刚刚生成的 HTML 元素是否为 `<script>` 标签。如果是，它将设置内部的 `isParsingScript` 标志。如果该标志被设置为\
  \ true，我们的 `parse` 方法将向前扫描潜在的起始位置并获取该位置的子字符串。如果返回的子字符串匹配 `</script>`，我们将将其作为脚本标签的结束位置，并将循环的当前位置设置为该位置。此逻辑发生在第\
  \ 198 到 211 行之间。\n\n我们下一个感兴趣点是定义在第 16 到 148 行之间的 `parseFragment` 方法。该方法是我们在书中到为止遇到的最显著的示例之一。然而，我们方法的大部分实现只是为了填充解析出的\
  \ HTML 元素的细节，例如它是否为闭合标签、自闭标签等。实际解析发生在第 21 到 49 行之间。\n\n### 处理忽略范围\n\n我们在第 22 到 29\
  \ 行之间看到了待忽略范围列表的第二个使用处。如果解析器的当前位置与这些范围之一对齐，我们用空格填充我们的内部缓冲区，以匹配我们将跳过的范围的长度。我们在此处将这些空空格添加到缓冲区中，以便在后续阶段解析\
  \ HTML 属性和参数时更加简单。我们可能想要这样做的示例可以在图 `17.32` 中找到，那里有一个嵌入的 Antlers 标签，该标签包含了可能被误认为是普通\
  \ HTML 参数的参数：\n\n图 `17.32`\n\n```\n1 <div 2 {{ dynamic }}\n3 </div>\n```\n\n一旦我们确定自己不在任何一个范围之内，我们就继续该过程。\n\
  \n\n\n\n\n在 `Figure 17.34` 中，我们可以看到片段解析器返回了两个 HTML 元素。列表中的第二个片段对应于 `Figure 17.33`\
  \ 中的“div”标签。然而，列表中的第一个元素更有趣。如果我们查看第一个返回片段的 `tagName` 值，可以看到它被设置为 `{{ $dynamic }}`，该值是从原始源文档中提取的。发生这种情况的原因是，该元素的内容起始位置与我们早些在解析过程中跳过的某个范围对齐了。能够为我们解析出动态\
  \ HTML 的名称，有助于在其他其他过程（例如静态分析器或代码格式化解决方案）中使用结果时简化决策过程。\n\n### 17.4 解析 HTML 属性和参数\n\
  \n解析我们片段的参数和属性将与提取 HTML 片段本身类似。我们不再检查大于号 `>` 和小于号 `<` 之类的字符，而是将使用空格的存在来确定属性和参数的边界。由于参数值可能包含有效的空格，我们在解析参数时将使用相同的技术来跳过字符串，以便让解析器跳过这些问题区域。我们的这种实现可以在\
  \ `Figure 17.35` 中找到：\n\n图 17.35 FragmentAttributeParser 实现 \n\n```\n 1 <?php\n\
  \ 2 \n 3 class FragmentAttributeParser extends BaseFragmentParser\n 4 {\n 5    \
  \ public function parse($fragment)\n 6     {\n 7         $this->resetState();\n\
  \ 8         $this->string = new Utf8StringIterator(\n 9             $fragment->innerContent->content\n\
  10         );\n11 \n12         $tempAttributes = [];\n13         $attributes = [];\n\
  14 \n15         for ($i = 0; $i < count($this->string); $i++) {\n 16           \
  \  $this->checkCurrentOffsets($i);\n 17 \n18             if (ctype_space($this->current))\
  \ {\n 19                 $this->buffer = '';\n 20                 continue;\n 21\
  \             }\n 22 \n23             if ($this->isStartOfString()) {\n 24     \
  \            $i = $this->scanToEndOfString($i);\n 25                 $this->checkCurrentOffsets($i);\n\
  \ 26             } else {\n 27                 $this->buffer .= $this->current;\n\
  \ 28             }\n 29 \n30             if ($this->next == null || ctype_space($this->next))\
  \ {\n 31                 $tempAttributes[] = [\n 32                     $this->buffer,\
  \ $i\n 33                 ];\n 34 \n 35                 $this->buffer = '';\n 36\
  \                 continue;\n 37             }\n 38         }\n 39 \n40        \
  \ foreach ($tempAttributes as $tempAttribute) {\n 41             $attribute = new\
  \ FragmentAttribute();\n 42 \n 43             $attribute->content = $tempAttribute[0];\n\
  \ 44 \n 45             // Calculate the attribute's start and end\n 46         \
  \    // positions relative to the original doc.\n 47             $attribute->endPosition\
  \ = $tempAttribute[1] +\n 48                 $fragment->innerContent->startPosition;\n\
  \ 49             $attribute->startPosition = $attribute->endPosition -\n 50    \
  \             str($attribute->content)->length() + 1;\n 51 \n 52             //\
  \ Extract name/values, if present.\n 53             $parts = str($attribute->content)->explode('=',\
  \ 2);\n 54 \n 55             if ($parts->count() == 2) {\n 56                 $attribute->type\
  \ = AttributeType::Parameter;\n 57                 $attribute->name = $parts->first();\n\
  \ 58                 $attribute->value = $parts->last();\n 59             } else\
  \ {\n 60                 $attribute->name = $attribute->content;\n 61          \
  \       $attribute->type = AttributeType::Attribute;\n 62             }\n 63 \n\
  \ 64             $attributes[] = $attribute;\n 65         }\n 66 \n 67         return\
  \ $attributes;\n 68     }\n 69 }\n```\n\n与我们的片段解析器一样，`Figure 17.35` 中的大部分操作与我们之前看到的相似。主要的区别在于第\
  \ 18 行和第 21 行之间，如果当前字符是空格，我们会清除内部缓冲区的内容并移动到字符串内的下一个位置。这将确保我们解析的属性和参数在两侧都不会有多余的空格，并提供了一种确定边界的简单方法。在第\
  \ 30 行和第 36 行之间，我们创建了一个临时属性列表。\n\n我们的临时属性列表包含了当时的缓冲区内容以及 HTML 片段属性或参数*结束*的位置。我们属性解析器的其余部分通过遍历这些临时属性来生成最终列表。\n\
  \n在第 40 行和第 65 行之间，我们遍历属性列表。我们的第一步是在第 43 行设置属性的内容。由于我们的属性解析器从片段内容创建一个新的 `Utf8StringIterator`，这意味着所有的临时偏移量将从零开始，相对于该内容。为了考虑到这一点，我们在第\
  \ 47 行和第 48 行将片段内容的起始位置加上结束位置。为了确定起始位置，我们可以从结束位置中减去属性内容的长度；这发生在第 49 行和第 50 行。\n\n\
  为了区分 HTML 参数和属性，我们在第 53 行使用 `=` 字符拆分字符串。如果生成的 `$parts` 数组包含两个元素，我们就假设解析的是 HTML 参数而不是属性。\n\
  \n我们可以更新 `FragmentsDocumentParser` 以利用 `FragmentAttributeParser` 来解析每个片段的属性：\n\n\
  图 17.36 \n\n```\n 1 <?php\n 2 \n 3 class FragmentsDocumentParser extends BaseFragmentParser\n\
  \ 4 {\n 5     protected $attributeParser;\n 6 \n 7     public function __construct()\n\
  \ 8     {\n 9         $this->attributeParser = new FragmentAttributeParser();\n\
  10     }\n 11 \n12     private function parseAttributes($fragment)\n 13     {\n\
  \ 14         if ($fragment->innerContent == null ||\n 15             str($fragment->innerContent->content)->length()\
  \ == 0) {\n 16             return;\n 17         }\n 18 \n 19         $fragment->attributes\
  \ = $this->attributeParser\n 20             ->parse($fragment);\n 21     }\n 22\
  \ \n 23     private function parseFragment($index)\n 24     {\n 25         // ...\n\
  \ 26 \n 27         $this->parseAttributes($fragment);\n 28 \n 29         if (!$fragment->isClosingTag\
  \ && !$fragment->isSelfClosing &&\n 30             str($fragment->tagName)->lower()\
  \ == 'script'\n 31         ) {\n 32             $this->isParsingScript = true;\n\
  \ 33         }\n 34 \n 35             $this->fragments[] = $fragment;\n 36     }\n\
  \ 37 }\n```\n\n`Figure 17.36` 中的变化相对较小。我们在内部有一个 `FragmentAttributeParser` 实例，并在新建的\
  \ `parseAttributes` 方法中使用它。该方法将接收一个 `HtmlFragment` 实例并检查它是否包含任何内部内容。如果我们的片段确实包含内部内容，我们就会使用属性解析器从片段中提取所有可以的信息。使用我们更新后的解析器处理以下输入：\n\
  \n图 17.37 \n\n\n\n\n\n```php\n 1 <?php\n 2 \n 3 $blade = <<<'BLADE'\n 4 <{{ $dynamic\
  \ }} parameter=\"value\" readonly />\n 5 BLADE;\n 6 \n 7 preg_match_all('/{{.*?}}/i',\
  \ $blade, $echos, PREG_OFFSET_CAPTURE);\n 8 \n 9 $ignore = [];\n10 \n11 foreach\
  \ ($echos[0] as $match) {\n 12     $start = $match[1];\n 13     $end   = $start\
  \ + str($match[0])->length() - 1;\n 14     $ignore[$start] = $end;\n 15 }\n16 \n\
  17 $fragmentsParser = new FragmentsDocumentParser();\n 18 $fragmentsParser->setIgnoreRanges($ignore);\n\
  19 \n20 $fragments = $fragmentsParser->parse($blade);\n```\n\n现在将产生以下 HTML 片段列表：\n\
  \n图 17.38\n\n```php\n 1 array:1 [\n 2   0 => HtmlFragment {\n 3     startPosition:\
  \ 0\n 4     endPosition: 44\n 5     content: \"<               parameter=\"value\"\
  \ readonly />\"\n 6     isClosingTag: false\n 7     isSelfClosing: true\n 8    \
  \ documentContent: \"               parameter=\"value\" readonly \"\n 9     innerContent:\
  \ Fragment {\n10       startPosition: 16\n11       endPosition: 42\n12       content:\
  \ \"parameter=\"value\" readonly\"\n13     }\n14     name: Fragment {\n15      \
  \ startPosition: 1\n16       endPosition: 14\n17       content: \"{{ $dynamic }}\"\
  \n18     }\n19     tagName: \"{{ $dynamic }}\"\n20     attributes: array:2 [\n21\
  \       0 => FragmentAttribute {\n22         startPosition: 16\n23         endPosition:\
  \ 32\n24         content: \"parameter=\"value\"\"\n25         name: \"parameter\"\
  \n26         value: \"\"value\"\"\n27         type: AttributeType {\n28        \
  \   name: \"Parameter\"\n29         }\n30       }\n31       1 => FragmentAttribute\
  \ {\n32         startPosition: 34\n33         endPosition: 41\n34         content:\
  \ \"readonly\"\n35         name: \"readonly\"\n36         value: \"\"\n37      \
  \   type: AttributeType {\n38           name: \"Attribute\"\n39         }\n40  \
  \     }\n41     ]\n42   }\n43 ]\n```\n\n我们的解析器现在返回了一个 HTML 片段列表及其相关的参数和属性。我们现在可以使用这些信息来开发一个用于分析输入文档的系统。\n\
  \n### 17.5 分析碎片化的 HTML 文档\n\n在**图 17.38**中，我们可以看到片段解析器提供了关于源文档的海量信息。重要的是，我们的结果通过跳过其他解析器的处理结果，避开了输入文档中可能存在问题的区域。我们可以将所有这些信息整合在一起，开始对这些被跳过的区域在文档中的*出现位置*提出一些有趣的问题。\n\
  \n例如，如果我们想编写一个代码格式化器来格式化我们的嵌入语言和 HTML 结构，我们可能想知道我们的嵌入语言是否出现在 HTML 参数内或作为动态 HTML\
  \ 标签名的一部分。**图 17.39**包含了分析器的实现，它能够解析源文档中任意位置的上下文：\n\n图 17.39 FragmentsPositionAnalyzer\
  \ 实现\n\n```php\n 1 <?php\n 2 \n 3 enum FragmentPosition\n4 {\n 5     case InsideFragment;\n\
  \ 6     case InsideAttribute;\n 7     case InsideParameter;\n 8     case InsideFragmentName;\n\
  \ 9     case StartOfFragment;\n10     case EndOfFragment;\n11     case Unknown;\n\
  12 }\n 13 \n14 class FragmentsPositionAnalyzer\n15 {\n116     /**\n17      * 待分析的片段。\n\
  18      *\n19      * @var HtmlFragment[]\n20      */\n21     protected $fragments\
  \ = [];\n22 \n23     /**\n24      * 设置待分析的 HTML 片段。\n25      *\n26      * @param\
  \ HtmlFragment[] $fragments\n27      * @return void\n28      */\n29     public function\
  \ setFragments($fragments)\n30     {\n31         $this->fragments = $fragments;\n\
  32     }\n33 \n34     /**\n35      * 获取所提供位置的上下文位置。\n36      *\n37      * @param\
  \ int $position\n38      * @return FragmentPosition\n39      */\n40     public function\
  \ getContext($position)\n41     {\n42         $loc = FragmentPosition::Unknown;\n\
  44 \n45         foreach ($this->fragments as $fragment) {\n 46             if ($fragment->contains($position))\
  \ {\n 47                 $loc = FragmentPosition::InsideFragment;\n48 \n49     \
  \            // 检查该位置是否在构成\n50                 // 标签起始的字符内。\n51                \
  \ if ($position == $fragment->startPosition ||\n52                     ($fragment->isClosingTag\
  \ &&\n53                         $position == $fragment->startPosition + 1)) {\n\
  54                     $loc = FragmentPosition::StartOfFragment;\n55           \
  \      }\n56 \n57                 // 检查该位置是否在构成\n58                 // 标签结束的字符内。\n\
  59                 if ($position == $fragment->endPosition ||\n60              \
  \       ($fragment->isSelfClosing &&\n61                         $position == $fragment->endPosition\
  \ - 1)) {\n62                     $loc = FragmentPosition::EndOfFragment;\n63  \
  \               }\n64 \n65 \n66                 // 检查该位置是否在名称内。\n67            \
  \     if ($fragment->name != null &&\n68                     $fragment->name->contains($position))\
  \ {\n69                     $loc = FragmentPosition::InsideFragmentName;\n70   \
  \              }\n71 \n72 \n73                 // 检查该位置是否在属性内。\n74             \
  \    foreach ($fragment->attributes as $attr) {\n75                     if ($attr->contains($position))\
  \ {\n76                         $loc = FragmentPosition::InsideAttribute;\n77 \n\
  78                         if ($attr->type == AttributeType::Parameter) {\n79  \
  \                           $loc = FragmentPosition::InsideParameter;\n80      \
  \                   }\n81 \n82                         break;\n83              \
  \   }\n84 \n85                 break;\n86             }\n87         }\n88 \n89 \
  \        return $loc;\n90     }\n91 }\n```\n\n在第 3 行到第 12 行之间，我们定义了一个枚举，包含了分析器能够解析的所有可能位置。这些每个位置都告诉我们该功能在原始文档中的出现情况：\n\
  \n- `InsideFragment`：此上下文对应于片段内部，但不是元素名称，且该位置不存在于参数或属性中。\n- `InsideAttribute`：请求的位置出现在片段属性内。\n\
  - `InsideParameter`：与 `InsideAttribute` 值类似，但表示出现在 HTML 参数内的位置。\n- `InsideFragmentName`：请求的位置出现在片段名称内。\n\
  - `StartOfFragment`：请求的位置对应关联元素的 `<` 字符，或结束标签的 `</` 序列。\n- `EndOfFragment`：请求对应关联元素的\
  \ `>` 字符，或自闭标签的 `/>` 序列。\n- `Unknown`：请求的位置无法在任何片段、属性或参数中定位。此结果有助于判断请求的位置是否出现在 HTML\
  \ 片段之间。\n\n我们现在可以将解析器和分析器结合起来，感受它们是如何相互作用的：\n\n图 17.40\n\n\n\n\n\n```php\n 1 <?php\n\
  \ 2 \n 3 $blade = <<<'BLADE'\n 4 <{{ $dynamic }} parameter=\"value\" readonly>\n\
  \ 5     Content\n 6 </{{ $dynamic }}>\n 7 BLADE;\n 8 \n 9 preg_match_all('/{{.*?}}/i',\
  \ $blade, $echos, PREG_OFFSET_CAPTURE);\n10 \n11 $ignore = [];\n12 \n13 foreach\
  \ ($echos[0] as $match) {\n14     $start = $match[1];\n15     $end   = $start +\
  \ str($match[0])->length() - 1;\n16     $ignore[$start] = $end;\n17 }\n18 \n19 $fragmentsParser\
  \ = new FragmentsDocumentParser();\n20 $fragmentsParser->setIgnoreRanges($ignore);\n\
  21 $fragments = $fragmentsParser->parse($blade);\n22 \n23 $analyzer = new FragmentsPositionAnalyzer();\n\
  24 $analyzer->setFragments($fragments);\n25 \n26 // Returns \"StartOfFragment\"\n\
  27 $analyzer->getContext(0);\n28 \n29 // Returns \"InsideFragmentName\"\n30 $analyzer->getContext(2);\n\
  31 \n32 // Returns \"InsideParameter\"\n33 $analyzer->getContext(19);\n34 \n35 //\
  \ Returns \"InsideAttribute\"\n36 $analyzer->getContext(38);\n37 \n38 // Returns\
  \ \"Unknown\"\n39 $analyzer->getContext(50);\n40 \n41 // Returns \"EndOfFragment\"\
  \n42 $analyzer->getContext(72);\n```\n\n## 18. 正则表达式\n\n正则表达式是那些经常让人感到晦涩、畏畏或难以理解的话题之一；这些描述很大程度上可以归于阅读非平凡正则表达式的困难。然而，尽管如此，它们仍然是一种简单且强大的表达搜索模式的，，可以应用于文本。在整本书中，我们使用了多种正则表达式以各种方式实现我们的目标。例如，我们经常使用正则表达式来快速扫描文本输入，以定位特定模式的所有实例，并删除子字符串等。然而，我们还没有花时间回溯并探索正则表达式本身。\n\
  \n在开始讨论正则表达式之前，让我们考虑`图 18.1` 中的示例：\n\n图 18.1 \n\n```php\n1 <?php\n2 \n3 $url = 'blog/2022-10-12/title';\n\
  4 \n5 if (preg_match('/^blog\\/.*\\z/u', $url) === 1) {\n6     // URL 以 \"blog/\"\
  \ 开头\n7 } else {\n8     // URL 不以 \"blog/\" 开头\n9 }\n```\n\n在`图 18.1` 中，我们正在使用一个简单的正则表达式来判断输入字符串是否以\
  \ `blog/` 开头。我们为执行此比较而使用的样板代码代码量可以通过使用 Laravel 的字符串辅助方法之一来减少：`is` 辅助方法。\n\n图 18.2\
  \ 是 `is 方法签名` \n\n```php\n 1 <?php\n 2 \n 3 /**\n4  * 适用于 Laravel 8, 9\n5  *\n6\
  \  * @return bool\n7  */\n8 public static function is(\n9     string|array $pattern,\n\
  10     string       $value\n11 );\n```\n\n我们可以使用 `is` 辅助方法来重写`图 18.1` 中的示例，如下：\n\
  \n图 18.3 \n\n```php\n1 <?php\n2 \n3 use Illuminate\\Support\\Str;\n4 \n5 if (Str::is('blog/*',\
  \ $url)) {\n6     // URL 以 \"blog/\" 开头\n7 } else {\n8     // URL 不以 \"blog/\" 开头\n\
  9 }\n```\n\n当我们比较 `图 18.1` 和 `图 18.3` 之间的逻辑时，快速扫描 `图 18.3` 并理解条件背后的意图要容易得多。但需要注意的一点是，Laravel\
  \ 的 `is` 辅助方法会将所有的星号字符 `*` 替换为 `.*` 序列。如果这种行为对于你的特定用例不合适，你将需要恢复使用 `is`。（注：原文此处有某些重复/乱码部分，我将保持核心逻辑）。\n\
  \n### 18.1 正则表达式语法\n\n正则表达式的主要批评之一是它们难以理解，这主要是由于语法密度太大。在本章的剩余部分中，我们将查看 PHP 正则引擎提供的一些功能。\n\
  \n我们将共同查看的第一个概念是分隔符（delimiter）。在 PHP 中编写正则表达式时，我们必须始终以分隔符开始和结束我们的模式。分隔符可以是任何除反斜杠和空白以外的非字母数字字符。我们经常遇到的分隔符是正斜杠\
  \ `/`。在`图 18.10` 中，我们可以看到一个使用正斜杠作为分隔符的模式。\n\n图 18.10 \n\n```php\n1 <?php\n2 \n3\
  \ \n4 $text = 'Hello, world. Hello, there! Howdy, there!';\n5 \n6 \n7 // 返回 [\"\
  Hello, world\", \"Hello, there\"]\n8 str($text)->matchAll(\n9     '/Hello, [A-z]*\\\
  b/'\n10 )->all();\n```\n\n如果我们要在模式中使用分隔符字符，我们需要使用反斜杠对其进行转义：\n\n图 18.11 \n\n```php\n\
  1 <?php\n2 \n3 $text = '/mnt/c/Windows/System32';\n4 \n5 // 返回 [\"Windows/System32\"\
  ]\n6 str($text)->matchAll(\n7     '/mnt\\/c\\/([A-z0-9\\/]*)/'\n8 )->all();\n```\n\
  \n如果分隔符字符在模式中出现多次，建议选择不同的分隔符以减少反斜杠的数量，提高可读性：\n\n图 18.12 \n\n```php\n1 <?php\n2 \n\
  3 $text = '/mnt/c/Windows/System32';\n4 \n5 // 返回 [\"Windows/System32\"]\n6 str($text)->matchAll(\n\
  7     '#mnt/c/([A-z0-9/]*)#'\n8 )->all();\n```\n\n#### 元字符\n\n元字符在定义正则表达式模式时具有特殊含义。例如，我们可以使用元字符来匹配单词边界或创建字符类。`表\
  \ 18.1` 包含了支持的元字符：\n\n| 字符 || 描述 ||   |\n| --- | --- | --- |\n| \\\\ || 转义字符 ||\
  \   |\n\n\n\n\n\n| `^` | 匹配输入文本的开头（在多行模式下为行首） |\n| `$` | 匹配输入文本的末尾（在多行模式下为行尾） |\n\
  | `.` | 匹配任意字符，换行符除外。 |\n| `\\[ \\]` | 定义字符类。 |\n| `|` | 分支起始。 |\n| `( )` | 定义子模式。\
  \ |\n| `?` | 0 次或 1 次限定；使贪婪量化变为懒惰 |\n| `\\*` | 0 次或多次限定。 |\n| `+` | 1 次或多次限定。 |\n\
  | `{ }` | 定义数量范围。 |\n\n**表 18.2** 包含了在字符类（方括号）内部可用的元字符：\n\n### 表 18.2 字符类元字符\n\n\
  | 字符 | 描述 |\n| --- | --- |\n| `\\\\` | 通用转义字符 |\n| `^` | 当作为类内的第一个字符出现时，对该字符类进行取反。\
  \ |\n| `\\-` | 表示字符范围。 |\n\n#### 锚点\n\n锚点（Anchors）是一种特殊的元字符，允许我们指定匹配在输入文档的*什么位置*开始或结束。我们在书中最常用的锚点是\
  \ `^` 和 `$` 锚点。`^` 锚点匹配输入文本的开头，而 `$` 锚点将匹配固定在输入文本的末尾。\n\n这两个锚点的行为取决于正则表达式是否启用了多行模式。例如，让我们看看图\
  \ 18.13，它使用这些锚点来断言我们的匹配从文档开始并到输入文本结束结束：\n\n图 18.13 \n\n```\n 1 <?php\n 2 \n 3 $text\
  \ = <<<'TEXT'\n 4 one\n 5 two\n 6 TEXT;\n 7 \n 8 $pattern = '/^[a-z\\s]*?$/';\n\
  \ 9 \n10 preg_match_all($pattern, $text, $matches, PREG_OFFSET_CAPTURE);\n```\n\n\
  执行图 18.13 中的代码后，我们将收到包含以下匹配项的数组：\n\n图 18.14 \n\n```\n 1 array:1 [\n 2   0 => array:1\
  \ [\n 3     0 => array:2 [\n 4       0 => \"\"\"\n 5         one\\n\n 6        \
  \ two\n 7         \"\"\"\n 8       1 => 0\n 9     ]\n10   ]\n11 ]\n```\n\n我们从图 18.14\
  \ 的示例输出可以看出，我们的模式匹配了整个输入文本。然而，如果我们更新正则表达式以使用多行模式：\n\n图 18.15 \n\n```\n 1 <?php\n\
  \ 2 \n 3 $text = <<<'TEXT'\n 4 one\n 5 two\n 6 TEXT;\n 7 \n 8 $pattern = '/^[a-z\\\
  s]*?$/m';\n 9 \n10 preg_match_all($pattern, $text, $matches, PREG_OFFSET_CAPTURE);\n\
  ```\n\n现在，我们的模式将匹配每一行的内容：\n\n图 18.16 \n\n```\n 1 array:1 [\n 2   0 => array:2 [\n\
  \ 3     0 => array:2 [\n 4       0 => \"one\"\n 5       1 => 0\n 6     ]\n 7   \
  \  1 => array:2 [\n 8       0 => \"two\"\n 9       1 => 4\n10     ]\n11   ]\n12\
  \ ]\n```\n\n在多行模式下，我们可能希望匹配输入文本的开头和结尾，而不是单行。可以使用 `\\A` 和 `\\z` 转义序列来实现：\n\n图 18.17\
  \ \n\n```\n 1 <?php\n 2 \n 3 $text = <<<'TEXT'\n 4 one\n 5 two\n 6 TEXT;\n 7 \n\
  \ 8 $pattern = '/\\A[a-z\\s]*?\\z/m';\n 9 \n10 preg_match_all($pattern, $text, $matches,\
  \ PREG_OFFSET_CAPTURE)\n```\n\n我们在图 18.17 中更新的正则表达式现在产生与图 18.13 中模式相同的输出，无论是否启用了多行模式。\n\
  \n#### 转义序列\n\n类似于 PHP 字符串支持转义序列的方式，我们可以在正则表达式模式中使用不同的转义序列。我们已经看到了一些转义序列示例，例如用于断言匹配位于输入文档的开头或末尾。表\
  \ 18.3 列出了最常用的转义序列：\n\n### 表 18.3 常用正则表达式转义序列\n\n| 序列 | 描述 |\n| --- | --- |\n| `\\\
  n` | 匹配换行符。 |\n| `\\r` | 匹配回车符。 |\n| `R` | 匹配换行符（`\\n`, `\\r` 和 `\\r\\n`）。 |\n|\
  \ `\\t` | 匹配制表符。 |\n| `\\d` | 匹配任意数字。 |\n| `D` | 匹配除数字以外的任意字符。 |\n| `\\s` | 匹配空白字符。\
  \ |\n| `S` | 匹配非空白字符。 |\n| `\\w` | 匹配任意单词字符（取决于语言环境）。 |\n| `W` | 匹配任意非单词字符（取决于语言环境）。\
  \ |\n| `\\b` | 匹配单词边界。 |\n| `\\B` | 匹配非单词边界。 |\n| `\\A` | 匹配字符串的开头。 |\n| `\\z` |\
  \ 匹配字符串的结尾。 |\n\n#### 字符类\n\n字符类允许我们指定任何位置允许的字符。例如，如果我们使用 `[^abc]`，`^` 当作为类内的第一个字符出现时对该字符类进行取反。`\\\
  -` 表示字符范围。\n\n我们也可以在定义字符类时指定字符范围。这有助于避免编写所有可能的字符组合。例如，我们可以使用像 `[a-z]` 这样的范围。\n\n\
  \n\n\n\n\n```\n 1 array:3 [\n 2   0 => array:2 [\n 3     0 => \"Mr. Darcy\"\n 4\
  \     1 => \"Mrs. Bennet\"\n 5   ]\n 6   1 => array:2 [\n 7     0 => \"\"\n 8  \
  \   1 => \"s\"\n 9   ]\n10   2 => array:2 [\n11     0 => \"Darcy\"\n12     1 =>\
  \ \"Bennet\"\n13   ]\n14 ]\n```\n\n我们在**图 18.26** 中的结果包含一个带有三个嵌套数组的数组。第一个嵌套数组包含每个匹配项的完整文本，第二个包含我们在“Mr,”\
  \ 之后可选的“s”的匹配文本，最后一个则包含了人的姓名。\n\n然而，我们包含以下项目的第二个数组显得特别有趣：\n\n图 18.27 \n\n```\n1\
  \ 1 => array:2 [\n2   0 => \"\"\n3   1 => \"s\"\n4 ]\n```\n\n我们可以看到第一个项目包含一个空字符串，对应于头衔“Mr.”，第二个元素是字母“s”，对应于“Mrs.”。假设我们确实想在结果中包含这两个项目。我们可以通过以\
  \ `?:` 序列开头分组将我们的组转换为*非捕获*组来实现：\n\n图 18.28 \n\n```\n 1 <?php\n 2 \n3 $text = <<<'TEXT'\n\
  \ 4 Mr. Darcy\n 5 Mrs. Bennet\n 6 TEXT;\n 7 \n 8 $pattern = '/Mr(?:s)*\\. ([A-z]*)\\\
  b/';\n 9 \n10 preg_match_all($pattern, $text, $matches);\n```\n\n我们在**图 18.28**\
  \ 中的正则表达式现在将返回以下结果：\n\n图 18.29 \n\n```\n 1 array:2 [\n 2   0 => array:2 [\n 3  \
  \   0 => \"Mr. Darcy\"\n 4     1 => \"Mrs. Bennet\"\n 5   ]\n 6   1 => array:2 [\n\
  \ 7     0 => \"Darcy\"\n 8     1 => \"Bennet\"\n 9   ]\n10 ]\n```\n\n我们还可以在定义模式时使用组来有效地执行“或”匹配。我们可以像这样重写正则表达式，以显式允许允许“Mr”或“Mrs”：\n\
  \n图 18.30 \n\n```\n 1 <?php\n 2 \n3 $text = <<<'TEXT'\n 4 Mr. Darcy\n 5 Mrs. Bennet\n\
  \ 6 TEXT;\n 7 \n 8 $pattern = '/(?:Mr|Mrs)\\. ([A-z]*)\\b/';\n 9 \n10 preg_match_all($pattern,\
  \ $text, $matches);\n```\n\n### 重复字符和模式\n\n我们可以使用量符和范围来指定字符或整个子模式可以重复零或多次。到目前为止，最常见的是\
  \ `*` 量符，它指定一个字符可以重复零或多次。我们经常看到它与 `.` 元字符结合，该字符匹配任何字符（换行符除外）。我们可以将这些组合来匹配大括号之间的所有文本：\n\
  \n图 18.31\n\n```\n 1 <?php\n 2 \n3 $text = <<<'TEXT'\n 4 {{one }}\n 5 {{two }}\n\
  \ 6 {{three }}\n 7 TEXT;\n 8 \n 9 $pattern = '/{{.*}}/';\n 10 \nmatch11 preg__all($,,,\
  \ $matches);\n```\n\n一旦执行，**图 18.31** 将返回以下匹配项：\n\n图 18.32\n\n```\n 1 array:1 [\n\
  \ 2   0 => array:2 [\n 3     0 => \"{{one }} {{two }} {{\n }}\"\n 4     1 => 0\n\
  \ 5\n\n\n\n```\n\n我们可以在**图 18.32** 的输出中看到，我们的模式是“懒惰的”，它将一直持续到最后一组大括号。我们可以通过像向模式中添加\
  \ `?` 量符让我们的正则表达式变为“贪婪”并让它尽早停止：\n\n图 18.33\n\n```\n 1 <?php\n 2 \n3 $text = <<<'TEXT'\n\
  \ 4 {{one }}\n 5 {{two }}\n 6 {{three }}\n 7 TEXT;\n 8 \n 9 $pattern = '/{{.*?}}/';\n\
  \ 10 \n11 preg_match_all($pattern, $text, $matches);\n```\n\n通过我们的更改，**图 18.33**\
  \ 现在返回以下匹配项：\n\n图 18.34\n\n```\n 1 array:1 [\n 2   0 => array:3 [\n 3     0 => \"\
  {{one }}\"\n 4       1 => 0\n 5     ]\n 6     1 => array:2 [\n 7       0 => \"{{two\
  \ }}\"\n 8       1 => 1\n 9     ]\n10     2 => array:2 [\n11       0 => \"{{three\
  \ }}\"\n12       1 => 2\n13     ]\n14   ]\n15 ]\n```\n\n`+` 量符可以用于匹配一次或多次字符或模式。例如，在**图\
  \ 18.35** 中，我们可以测试字符串是否包含至少一个数字：\n\n图 18.35\n\n```\n 1 <?php\n 2 \n 3 // Returns\
  \ 1\n 4 preg_match('/\\d+/', '123');\n 5 \n 6 // Returns 0\n 7 preg_match('/\\d+/',\
  \ 'abc');\n```\n（注：原文此处缺失了图 18.35 的具体代码块，此处根据上下文补全了翻译逻辑）\n\n我们可以将模式与之前的锚点结合，以确保字符串仅包含数字：\n\
  \n图 18.36\n\n```\n 1 <?php\n 2 \n 3 // Returns 1\n 4 preg_match('/^\\d+/', '123');\n\
  \ 5 \n 6 // Returns 0\n 7 preg_match('/^\\d+/', 'abc23');\n```\n\n我们可以通过在大括号中定义范围，来指定字符或模式可以重复特定次数或在最小值和最大值之间重复。**图\
  \ 18.37** 定义了一个匹配三到五个数字字符的模式：\n\n图 18.37 \n\n```\n 1 <?php\n 2 \n 3 // Returns 1\n\
  \ 4 preg_match('/^\\d{3,5}$', '123');\n 5 \n 6 // Returns 0\n 7 preg_match('/^\\\
  d{3,5}$', '12356');\n```\n\n此外，通过消除大括号中的第二个值，我们可以指定字符或模式重复的固定次数。**图 18.38** 定义了一个仅匹配三个数字字符串的模式：\n\
  \n图 18.38 \n\n```\n 1 <?php\n 2 \n 3 // Returns 1\n 4 preg_match('/^\\d{3}$', '123');\n\
  \ 5 \n 6 // Returns 0\n 7 preg_match('/^\\d{3}$', '1234');\n```\n\n#### 确保匹配不以特定模式开头或结束\n\
  \n在第 16 章中，我们开发了 Blade 指令验证系统。为了帮助查找 Blade 指令，我们使用了以下正则表达式：\n\n图 18.39 \n\n```\n\
  /(?<!@)@(?!@)(can|cannot|canany)/\n```\n\n**图 18.39** 中的模式包含了两种常用的正则表达式技术：否定后视断言和否定先行断言。\n\
  \n我们可以通过以 `<?!` 序列开头我们的分组来定义否定后视。当其存在时，正则表达式引擎将匹配后续内容，只要其不是以否定后视组内的字符开头的。\n\n**图\
  \ 18.39** 中的否定后视断言是 `(?<!@)`，它可以解释为“前面不是 @ 字符”。\n\n否定先行断言是否定后视的反面，它将确保我们的模式后面没有特定的模式。\n\
  \n## 附录 A：UTF-8 字符串迭代器实现\n\n以下代码示例是第 1 章概述的 UTF-8 字符串迭代器的完整实现。`setIteratorPosition`\
  \ 方法是在第 15 章引入的。\n\n图 19.1 UTF-8 字符串迭代器实现 \n\n\n\n\n\n```php\n<?php\n\nuse ArrayAccess;\n\
  use Countable;\nuse Iterator;\n\nclass Utf8StringIterator implements ArrayAccess,\
  \ Countable, Iterator\n{\n    protected $string = '';\n    protected $position =\
  \ 0;\n    protected $lastSize = 1;\n    protected $length = 0;\n    protected $stringIndex\
  \ = null;\n\n    public function __construct(string $string)\n    {\n        $this->string\
  \ = $string;\n        $this->length = mb_strlen($string, 'UTF-8');\n    }\n\n  \
  \  public function setIteratorPosition(\n        int $position,\n        int $lastSize):\
  \ void\n    {\n        $this->position = $position;\n        $this->lastSize = $lastSize;\n\
  \    }\n\n    public function count(): int\n    {\n        return $this->length;\n\
  \    }\n\n    public function current(): mixed\n    {\n        $firstByte = ord($this->string[$this->position]);\n\
  \n        $this->lastSize = match(true) {\n            $firstByte <= 127 => 1,\n\
  \            $firstByte <= 223 => 2,\n            $firstByte <= 239 => 3,\n    \
  \        default => 4\n        };\n\n        return substr(\n            $this->string,\n\
  \            $this->position,\n            $this->lastSize\n        );\n    }\n\n\
  \    public function next(): void\n    {\n        $this->position += $this->lastSize;\n\
  \    }\n\n    public function key(): mixed\n    {\n        return $this->position;\n\
  \    }\n\n    public function valid(): bool\n    {\n        return isset($this->string[$this->position]);\n\
  \    }\n\n    public function rewind(): void\n    {\n        $this->position = 0;\n\
  \    }\n\n    public function lastCharSize(): int\n    {\n        return $this->lastSize;\n\
  \    }\n\n    private function buildStringIndex(): void\n    {\n        if ($this->stringIndex\
  \ !== null) {\n            return;\n        }\n\n        $this->stringIndex = [];\n\
  \        $string = new Utf8StringIterator($this->string);\n        $charIndex =\
  \ 0;\n        foreach ($string as $char) {\n            $this->stringIndex[$charIndex]\
  \ = $string->lastCharSize();\n            $charIndex += 1;\n        }\n        unset($string);\n\
  \    }\n\n    public function offsetExists(mixed $offset): bool\n    {\n       \
  \ $this->buildStringIndex();\n        return array_key_exists(\n            $offset,\n\
  \            $this->stringIndex\n        );\n    }\n\n    public function offsetGet(mixed\
  \ $offset): mixed\n    {\n        $this->buildStringIndex();\n        return substr(\n\
  \            $this->string,\n            $this->getPosition($offset),\n        \
  \    $this->stringIndex[$offset]\n        );\n    }\n\n    protected function getPosition($offset):\
  \ int\n    {\n        $position = 0;\n        for ($i = 0; $i < $offset; $i++) {\n\
  \            $position += $this->stringIndex[$i];\n        }\n        return $position;\n\
  \    }\n\n    public function getPositionFromIndex($charIndex): int\n    {\n   \
  \     $this->buildStringIndex();\n        return $this->getPosition($charIndex);\n\
  \    }\n\n    public function offsetSet(mixed $offset, mixed $value): void\n   \
  \ {\n        $this->buildStringIndex();\n        $this->string = substr_replace(\n\
  \            $this->string,\n            $value,\n            $this->getPosition($offset),\n\
  \            $this->stringIndex[$offset]\n        );\n        $this->stringIndex\
  \ = null;\n        $this->buildStringIndex();\n        $this->updateStringMetaData();\n\
  \    }\n\n    public function offsetUnset(mixed $offset): void\n    {\n        $this->buildStringIndex();\n\
  \        $this->string = substr_replace(\n            $this->string,\n         \
  \   '',\n            $this->getPosition($offset),\n            $this->stringIndex[$offset]\n\
  \        );\n        unset($this->stringIndex[$offset]);\n        $this->updateStringMetaData();\n\
  \    }\n\n    protected function updateStringMetaData(): void\n    {\n        $this->stringIndex\
  \ = array_values($this->stringIndex);\n        $this->length = mb_strlen($this->string);\n\
  \    }\n\n    public function __toString(): string\n    {\n        return $this->string;\n\
  \    }\n}\n```\n\n## 附录 B：CharacterPositionLocator 实现\n\n以下代码示例是第 10 章中开发的字符位置定位器的完整实现。\n\
  \n图 20.1 CharacterPositionLocator 实现\n\n\n\n\n\n```php\nclass Position\n{\n    public\
  \ $position = null;\n    public $column = null;\n    public $line = null;\n}\n\n\
  class CharacterPositionLocator\n{\n    protected $string = '';\n    protected $length\
  \ = 0;\n    protected $newLineIndex = [];\n\n    public function __construct(string\
  \ $string)\n    {\n        $this->string = $string;\n        $this->length = mb_strlen($string,\
  \ 'UTF-8');\n        $this->buildNewLineIndex();\n    }\n\n    protected function\
  \ buildNewLineIndex(): void\n    {\n        preg_match_all(\n            \"/\\r\\\
  n|\\n|\\r/u\",\n            $this->string,\n            $matches,\n            PREG_OFFSET_CAPTURE\n\
  \        );\n        \n        $this->newLineIndex = collect($matches[0])\n    \
  \        ->map(function ($match) {\n                // Return an array containing\
  \ the start\n                // and end position of the sequence.\n            \
  \    return [\n                    $match[1],\n                    $match[1] + strlen($match[0])\
  \ - 1\n                ];\n            })->all();\n    }\n\n    public function\
  \ getLineNumber($position): ?int\n    {\n        return $this->getCharPosition($position)?->line;\n\
  \    }\n\n    public function getColumnNumber($position): ?int\n    {\n        return\
  \ $this->getCharPosition($position)?->column;\n    }\n\n    public function isNewLine($position):\
  \ bool\n    {\n        if ($position > $this->length || $position < 0) {\n     \
  \       return false;\n        }\n\n        for ($i = 0; $i < count($this->newLineIndex);\
  \ $i++) {\n            $nlStart = $this->newLineIndex[$i][0];\n            $nlEnd\
  \ = $this->newLineIndex[$i][1];\n\n            if ($position >= $nlStart && $position\
  \ <= $nlEnd) {\n                return true;\n            }\n        }\n\n     \
  \   return false;\n    }\n\n    public function getCharPositionFromLine($line, $column):\
  \ ?int\n    {\n        if ($line < 1 || $column < 1) {\n            return null;\n\
  \        }\n        $position = null;\n        for ($i = 0; $i < count($this->newLineIndex);\
  \ $i++) {\n            if ($i + 1 != $line) {\n                continue;\n     \
  \       }\n\n            if ($i == 0) {\n                $position = $column - 1;\n\
  \                break;\n            }\n\n            $index = $this->newLineIndex[$i\
  \ - 1];\n            $position = $index[1] + $column;\n\n            // Ensure the\
  \ position is inside current line.\n            $nextLineStart = $this->newLineIndex[$i];\n\
  \n            if ($position >= $nextLineStart[0]) {\n                return null;\n\
  \            }\n\n            break;\n        }\n\n        if ($position === null)\
  \ {\n            $lastIndex =\n                $this->newLineIndex[count($this->newLineIndex)\
  \ - 1];\n\n            $position = $lastIndex[1] + $column;\n        }\n\n     \
  \   if ($position >= $this->length || $position < 0) {\n            return null;\n\
  \        }\n\n        return $position;\n    }\n\n    public function getCharPosition($position):\
  \ ?Position\n    {\n        if ($position > $this->length || $position < 0) {\n\
  \            return null;\n        }\n\n        $lastOffset = null;\n        $column\
  \ = null;\n        $line = null;\n\n        for ($i = 0; $i < count($this->newLineIndex);\
  \ $i++) {\n            $offset = $this->newLineIndex[$i][1];\n\n            if ($i\
  \ == 0 && $position < $offset) {\n                $line = 1;\n                $column\
  \ = $position + 1;\n                break;\n            }\n\n            if ($offset\
  \ > $position) {\n                $line = $i + 1;\n                $column = $position\
  \ - $lastOffset;\n                break;\n            }\n\n            $lastOffset\
  \ = $offset;\n        }\n\n        if ($column == null) {\n            $line = $i\
  \ + 1;\n            $column = $position - $lastOffset;\n        }\n\n        $charPosition\
  \ = new Position();\n        $charPosition->position = $position;\n        $charPosition->column\
  \ = $column;\n        $charPosition->line = $line;\n\n        return $charPosition;\n\
  \    }\n}\n```\n\n## 附录 C：IndentationManager\n\n以下是第 11 章开发的 `IndentationManager`\
