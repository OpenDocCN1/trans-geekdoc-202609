  \  * @return string\n 7  */\n 8 public static function squish(\n 9     string $value\n\
  10 );\n```\n\n`squish` 辅助方法是我最喜欢的方法之一。使用它，可以将连续的空白合并为一个空格。\n\n我从 [`stillat.com/blog/2021/02/15/implementing-a-customer-dsl-parser-in-php.`](https://stillat.com/blog/2021/02/15/implementing-a-customer-dsl-parser-in-php.)\
  \ 获取了以下示例内容。使用 `squish` 辅助方法，我们可以移除所有的额外空格和换行符，并将它们替换为单个空格：\n\n图 3.25\n\n```php\n\
  1 <?php\n 2 \n3 use Illuminate\\Support\\Str;\n4 \n5 $content = <<<CONTENT\n6  \
  \   By convention, we will say that a single quote is proceeded\n7 \tby a backslash\
  \ (\\) character within a string, only the single\n8 \tquote will become part of\
  \ the string's value.  \n9 \n10     When a backslash is used as a way to indicate\
  \ special output\n11 \twithin a string, we will refer to it as the escape character.\
  \ \n12 \n13 \n14     When a valid character follows the escape character, such as\n\
  15 \ta single quote, we will refer to both the backslash and\n16 \tthat next character\
  \ as an escape sequence.   \n17 \n18     \n19 CONTENT;\n20 \n21 Str::squish($content);\n\
  ```\n\n`squish` 方法在上一个示例中将返回以下结果（为了格式插入了换行符）：\n\n图 3.26\n\n```text\nBy convention,\
  \ we will say that a single quote is proceeded\nby a backslash (\\) character within\
  \ a string, only the single\nquote will become part of the string's value. When\
  \ a backslash\nis used as a way to indicate special output within a string, we\n\
  will refer to it as the escape character. When a valid character\nfollows the escape\
  \ character, such as a single quote, we will refer\nto both the backslash and that\
  \ next character as an escape sequence.\n```\n\n你可能会注意到 `squish` 辅助方法修剪了结果字符串开头和结尾的空白。\n\
  \n`squish` 辅助方法也适用于链式字符串：\n\n图 3.27\n\n```php\n1 <?php\n2 \n3 str($content)\n4 \
  \    ->squish()\n5     ->toString();\n```\n\n### 3.10 使用 StudlyCasing 格式化字符串\n\n\
  图 3.28 studly 方法签名 \n\n\n\n\n\n```php\n<?php\n\n/**\n * Versions: Laravel 8, 9\n\
  \ *\n * @return string\n */\npublic static function studly(\n    string $value\n\
  );\n```\n\nStudly caps（大驼峰命名）是一种根据特定模式使用大字母格式化文本的方法。`studly`辅助方法会移除以下单词分隔符并将找到的每个单词的首字母大写（同时不影响任何其他字符的大小）：\n\
  \n- 任意数量的空格\n- 下划线 (`_`)\n- 连字符 (`-`)\n\n以下以下所有示例将返回结果 `MyWords`：\n\n**图 3.30**\n\
  \n```php\n<?php\n\nuse Illuminate\\Support\\Str;\n\nStr::studly('my words');\nStr::studly('my\
  \   words');\nStr::studly('   my-words');\n\n(string) str(' my-words_')\n    ->studly();\n\
  ```\n\n由于 `studly` 方法不会影响第一个字母之后任何字母的大小，我们可能会得到某些用户意想不到的输出：\n\n**图 3.31**\n\n```php\n\
  <?php\n\n// Returns: \"MyWORDS\"\n(string) str('my-WORDS')->studly();\n\n// Returns:\
  \ \"MYWORDS\"\n(string) str('MY_WORDS')->studly();\n```\n\n### 3.11 使用标题大小写（Title\
