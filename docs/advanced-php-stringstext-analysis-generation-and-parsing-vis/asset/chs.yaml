  \ 集合的 `map` 方法。我们在 `图 17.8` 中的示例将返回包含 `location` 类的内部文本：\n\n图 17.8 \n\n```\n1 <?php\n\
  2 \n3 use Symfony\\Component\\DomCrawler\\Crawler;\n 4 \n5 $html = <<<'HTML'\n 6\
