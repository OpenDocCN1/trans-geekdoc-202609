  \n图 26.7 `PairedBracketCursor` 实现\n\n```php\n 1 <?php\n 2 \n 3 class PairedBracketCursor\
  \ extends AbstractStringCursor\n 4 {\n 5     private string $closingBracket = '';\n\
  \ 6     private string $openingBracket = '';\n 7     private int $pairCount = 0;\n\
  \ 8 \n 9     public function __construct(\n10         StringIterator $iterator,\n\
  11         string $openingBracket,\n12         string $closingBracket)\n13     {\n\
  14         parent::__construct($iterator);\n15         $this->openingBracket = $openingBracket;\n\
  16         $this->closingBracket = $closingBracket;\n17     }\n18 \n19     public\
  \ function accept(\n20         string $current,\n21         ?string $prev = null,\n\
  22         ?string $next = null): ?bool\n23     {\n24         if ($current == '\"\
  ' || $current == \"'\") {\n25             return $this->accept($this->bufferCursorResult(\n\
  26                 StringsCursor($this->iterator))\n27             )->continue());\n\
  28         }\n29 \n30         if ($this->index == 0 || $current == $this->openingBracket)\
  \ {\n31             $this->pairCount++;\n32             return $this->continue();\n\
  33         }\n34 \n35         if ($current == $this->closingBracket) {\n36     \
  \        $this->pairCount--;\n37             if ($this->pairCount == 0) {\n38  \
  \               return $this->break();\n39             }\n40         }\n41 \n42\
  \         return $this->continue();\n43     }\n44 }\n```\n\n`CommaSplitter` 可根据逗号分割复杂的字符串，同时考虑成对的括号和嵌套字符串：\n\
  \n图 26.8 `CommaSplitter` 实现\n\n```php\n 1 <?php\n 2 \n 3 class CommaSplitter extends\
  \ AbstractStringCursor\n 4 {\n 5     protected string $current = '';\n 6     protected\
  \ ?string $prev = null;\n 7     protected ?string $next = null;\n 8     protected\
  \ array $strings = [];\n 9 \n10     protected function nextIsNull(): bool\n11  \
  \   {\n12         return $this->next == null ||\n13             $this->iterator->count()\
  \ - 1;\n14     }\n15 \n16     public function continue(): bool\n17     {\n18   \
  \      if ($this->nextIsNull()) {\n19             $this->strings[] = $this->flushBuffer();\n\
  20             return false;\n21         }\n22 \n23         return true;\n24   \
  \  }\n25 \n26     public function accept(\n27         string $current,\n28     \
  \    ?string $prev = null,\n29         ?string $next = null): ?bool\n30     {\n\
  31         $this->current = $current;\n32         $this->prev = $prev;\n33     \
  \    $this->next = $next;\n34 \n35         if ($current == '(') {\n36          \
  \   return $this->append($this->bufferCursorResult(\n37                 PairedBracketCursor(\n\
  38                     $this->iterator, '(', ')'\n39                 )\n40     \
  \        ))->continue();\n41         }\n42 \n43         if ($current == '\"' ||\
  \ $current == \"'\") {\n44             return $this->append($this->bufferCursorResult(\n\
  45                 StringsCursor($this->iterator)\n46             ))->continue();\n\
  47         }\n48 \n49         if ($current == ',') {\n50             $this->strings[]\
  \ = $this->popBuffer()->flushBuffer();\n51         }\n52 \n53         return $this->continue();\n\
  54     }\n55 \n56     public function getStrings(): array\n57     {\n58        \
  \ return $this->strings;\n59     }\n60 }\n```\n\n`NonWhitespaceCursor` 在第 16 章中开发，用于遍历字符串到下一个非空白字符：\n\
