  \ 118     }\n 119   ]\n 120   rules: []\n 121 }\n```\n\n### 12.4 为 Gherkin 解析器添加本地化支持\n\
  \nGherkin 语言最有趣的方面之一是该语言本身支持本地化，而我们目前的解析器无法很好地处理这一点。考虑图 12.78，这是一段用挪威语编写的示例特性测试：\n\
  \n图 12.78 本地化的 Gherkin 示例\n\n```\n 1 Funksjonalitet: Gjett et ord\n 2 \n 3   Eksempel:\
  \ Ordmaker starter et spill\n 4     Når Ordmaker starter et spill\n 5     Så må\
  \ Ordmaker vente på at Gjetter blir med\n 6 \n 7   Eksempel: Gjetter blir med\n\
  \ 8     Gitt at Ordmaker har startet et spill med ordet \"bløtt\"\n 9     Når Gjetter\
  \ blir med på Ordmakers spill\n10     Så må Gjetter gjette et ord på 5 bokstaver\n\
  ```\n\n如果我们现在尝试解析这段内容，我们的解析器将简单返回 `null`。在本节中的任务是更新现有的解析器实现以处理不同的本地化。目前，我们的解析器包含一个硬编码的内部关键字映射列表，我们可以在图\
  \ 12.79 中看到。\n\n图 12.79 \n\n```\n 1 <?php\n 2 \n 3 use Illuminate\\Support\\Str;\n\
  \ 4 \n 5 class GherkinParser\n 6 {\n 7 \n 8     /**\n 9      * @var CharacterPositionLocator\n\
  \ 10      */\n 11     protected CharacterPositionLocator $locator;\n 12 \n 13  \
  \   /**\n 14      * 用于启动新块的关键字列表。\n 15      *\n 16      * @var string[]\n 17   \
  \   */\n 18     protected array $gherkinKeywords = [\n 19         'feature' => 'Feature:',\n\
  \ 20         // ...\n 21     ];\n 22 \n 23     /**\n 24      * 用于启动新步骤的关键字列表。\n\
  \ 25      *\n 26      * @var string[]\n 27      */\n 28     protected array $stepKeywords\
  \ = [\n 29         'given' => 'Given ',\n 30         // ...\n 31     ];\n 32 \n\
  \ 33     // ...\n 34 \n 35 }\n```\n\n我们可以将此更新为使用内部本地化映射（mapping），然后提供一个 `setLocale`\
  \ 方法：\n\n图 12.80 支持多语言环境\n\n\n\n\n\n```php\n<?php\n\nuse Illuminate\\Support\\Str;\n\
  \nclass GherkinParser\n{\n    /**\n     * @var CharacterPositionLocator\n     */\n\
  \    protected CharacterPositionLocator $locator;\n\n    /**\n     * The list of\
  \ keywords that can be used to start a new block.\n     *\n     * @var string[]\n\
  \     */\n    protected array $gherkinKeywords = [\n        'feature' => 'Feature:',\n\
  \        'rule' => 'Rule:',\n        'background' => 'Background:',\n        'scenario'\
  \ => 'Scenario:',\n        'scenario_outline' => 'Scenario Outline:',\n        'scenario_template'\
  \ => 'Scenario Template:',\n        'example' => 'Example:',\n        'examples'\
  \ => 'Examples:',\n        'scenarios' => 'Scenarios:',\n    ];\n\n    /**\n   \
  \  * The list of keywords that can be used to start a new step.\n     *\n     *\
  \ @var string[]\n     */\n    protected array $stepKeywords = [\n        'given'\
  \ => 'Given ',\n        'when' => 'When ',\n        'then' => 'Then ',\n       \
  \ 'and' => 'And ',\n        'but' => 'But ',\n        '*' => '* ',\n    ];\n\n \
  \   protected array $locales = [\n        'en' => [\n            'keywords' => [\n\
  \                'feature' => 'Feature:',\n                'rule' => 'Rule:',\n\
  \                'background' => 'Background:',\n                'scenario' => 'Scenario:',\n\
  \                'scenario_outline' => 'Scenario Outline:',\n                'scenario_template'\
  \ => 'Scenario Template:',\n                'example' => 'Example:',\n         \
  \       'examples' => 'Examples:',\n                'scenarios' => 'Scenarios:',\n\
  \            ],\n            'stepKeywords' => [\n                'given' => 'Given\
  \ ',\n                'when' => 'When ',\n                'then' => 'Then ',\n \
  \               'and' => 'And ',\n                'but' => 'But ',\n           \
  \ ],\n        ],\n        'no' => [\n            'keywords' => [\n             \
  \   'feature' => 'Funksjonalitet:',\n                'rule' => 'Regel:',\n     \
  \           'background' => 'Bakgrunn:',\n                'scenario' => 'Scenario:',\n\
  \                'scenario_outline' => 'Abstrakt Scenario:',\n                'scenario_template'\
  \ => 'Scenariomal:',\n                'example' => 'Eksempel:',\n              \
  \  'examples' => 'Eksempler:',\n                'scenarios' => 'Scenarier:',\n \
  \           ],\n            'stepKeywords' => [\n                'given' => 'Gitt\
  \ ',\n                'when' => 'Når ',\n                'then' => 'Så ',\n    \
  \            'and' => 'Og ',\n            ],\n        ],\n    ];\n\n    /**\n  \
  \   * Sets the parser locale.\n     * \n     * @param string $locale The locale.\n\
  \     * @return void\n     */\n    public function setLocale(string $locale = 'en')\n\
  \    {\n        $this->gherkinKeywords = $this->locales[$locale]['keywords'];\n\
  \        $this->stepKeywords = $this->locales[$locale]['stepKeywords'];\n      \
  \  $this->stepKeywords['*'] = '* ';\n    }\n\n    // ...\n}\n```\n\n我们解析器的用户现在必须记住在解析之前调用\
  \ `setLocale` 方法。我们可以通过向 `parse` 方法添加一个 `$locale` 参数并在内部调用 `setLocale` 方法来解决这个问题：\n\
  \n图 12.81\n\n```php\n<?php\n\nuse Illuminate\\Support\\Str;\n\nclass GherkinParser\n\
  {\n    // ...\n\n    /**\n     * 解析提供的 Gherkin 文本。\n     *\n     * @param string\
  \ $value The string to parse.\n     * @param int $tabSize The tab size.\n     *\
  \ @param string $locale The locale.\n     * @return Feature|null\n     * @throws\
  \ Exception\n     */\n    public function parse(\n        string $value,\n     \
  \   int $tabSize = 2,\n        string $locale = 'en'\n    ): ?Feature\n    {\n \
  \       $this->setLocale($locale);\n        // ...\n    }\n\n    // ...\n}\n```\n\
  \n完成重构后，我们现在可以更改解析器的语言，以解析 `图 12.78` 中的挪威语 Gherkin 示例了：\n\n图 12.82\n\n```php\n<?php\n\
  $parser = new GherkinParser();\n$parser->parse($text, 2, 'no');\n```\n\n产生以下结果：\n\
  \n图 12.83\n\n```text\nFeature {\n  start: 0,\n  comments: [],\n  keyword: \"feature\"\
  ,\n  name: \"Gjett et ord\",\n  description: \"\",\n  background: null,\n  scenarios:\
  \ array: [\n    0 => Scenario {\n      start: 34,\n      comments: [],\n      keyword:\
  \ \"scenario\",\n      description: \"\",\n      name: \"Ordmaker starter spill\"\
  ,\n      steps: array: [\n        0 => Step {\n          start: 75,\n          comments:\
  \ [],\n          keyword: \"when\",\n          text: \"Ordmaker starter spill\"\
  ,\n          data: [],\n          parameters: []\n        }\n        // ...\n  \
  \    ],\n      examples: [],\n      // ...\n    }\n  ]\n}\n```\n\n还值得注意的是，Gherkin\
  \ 支持通过指定语言头在测试用例内部指定语言。语言头出现在第一行，并实现为一种特殊的注释：\n\n图 12.84 Gherkin 语言头\n\n```text\n\
  # language: no\nFunksjonalitet: Gjett et ord\nEksempel: Ordmaker starter spill\n\
  Når Ordmaker starter spill\nSå må\n```\n\n我们可以通过在 `parse` 方法中检查第一行的这种特殊头来支持它：\n\n\
  图 12.85 为 Gherkin 添加语言头支持\n\n```php\n<?php\n\nuse Illuminate\\Support\\Str;\n\n\
  class GherkinParser\n{\n    // ...\n\n    public function parse(\n        string\
  \ $value,\n        int $tabSize = 2,\n        string $locale = 'en'\n    ): ?Feature\n\
  \    {\n        $this->setLocale($locale);\n        // ...\n    }\n\n    // ...\n\
  }\n```\n\n### 12.5 基于缩进的解析器的其他应用\n\n在本章中，我们一直非常关注 Gherkin，因为它对于构建解析器来说是一种简单的语言。这一过程通过我们的\
  \ `IndentationManager` 类变得更加容易。在这个简短的章节中，我想花一点时间快速探索其他可能从此类技术中获益的语言。\n\n在考虑什么语言值得简要探索时，我没有比\
  \ Python 更好的选择了。让我们快速看看 `图 12.86` 中的 Python 代码：\n\n图 12.86 Python 示例程序\n\n```python\n\
  def hello():\n  name = str(input(\"Enter your name: \"))\n  if name:\n    print\
  \ (\"Hello \" + str(name))\n  else:\n    print(\"Hello World\") \n  return\n\nhello()\n\
  ```\n\n第 1 行定义了一个函数，其体体跨了第 2 到 7 行。需要注意的是，函数体相对于其定义行进行了缩进。我们现在使用我们的 `IndentationManager`\
  \ 处理这段示例 Python 代码，看看会得到什么：\n\n图 12.87\n\n\n\n\n\n```php\n 1 <?php\n 2 \n 3 $text\
  \ = <<<PYTHON\n 4 def hello():\n 5   name = str(input(\"Enter your name: \"))\n\
  \ 6   if name:\n 7     print (\"Hello \" + str(name))\n 8   else:\n 9     print(\"\
  Hello World\") \n10   return \n11   \n12 hello()\n13 \n14 PYTHON;\n15 \n16 $indentation\
  \ = new IndentationManager($text, 2);\n17 $lines = $indentation->getLines();\n```\n\
  \n前几行的结果如下：\n\n图 12.88 \n\n```\n 1 array:10 [\n 2   0 => TextIndentation {\n 3 \
  \    line: \"def hello():\"\n 4     lineNumber: 1\n 5     nestedLines: array:5 [\n\
  \ 6       0 => TextIndentation {\n 7         line: \"  name = str(input(\"Enter\
  \ your name: \"))\"\n 8         lineNumber: 2\n 9       }\n10       1 => TextIndentation\
  \ {\n 11         line: \"  if name:\"\n 12         lineNumber: 3\n 13         nestedLines:\
  \ array:1 [\n 14           0 => TextIndentation {\n 15             line: \"    print\
  \ (\"Hello \" + str(name))\"\n 16             lineNumber: 4\n 17           }\n 18\
  \         ]\n 19       }\n 20       2 => TextIndentation {\n 21         line: \"\
  \  else:\"\n 22         lineNumber: 5\n 23         nestedLines: array:1 [\n 24 \
  \          0 => TextIndentation {\n 25             line: \"    print(\"Hello World\"\
  ) \"\n 26             lineNumber: 6\n 27           }\n 28         ]\n 29   // ...\n\
  30 ]\n```\n\n虽然我们在书中不会探索创建一个 Python 解析器，但了解像 `IndentationManager` 这样的简单概念如何应用于许多用例是有帮助的。\n\
  \n## 13. 马尔可夫链与文本生成\n\n涉及到自动化文本生成时，更容易上手的技术之一是马尔可夫链。马尔可夫链是一个数学概念，帮助我们模拟随机系统，其中系统内部事件的序列具有概率性。具体来说，马尔可夫链的有趣之处在于，对于系统中的任何给定事件，一系列事件中下一个事件的发生概率仅取决于当前事件的状态。\n\
  \n一次性接受这么多信息非常困难。在之前的章节中，我们实现了一些辅助方法，用于将一段输入文本拆分为单词列表，并检索术语在文本中出现的频率或次数。让我们看看**图\
  \ 13.1**中的文本：\n\n图 13.1 示例文本 \n\n```\n1 The eldest cat, the youngest cat, and their\
  \ group of cat friends went\n2 down the alley to fetch the runaway ball.\n```\n\n\
  如果我们统计文本中的单词数量（非唯一），我们可以看到有 21 个单词；此外，如果我们使用之前开发的 `wordFrequency` 辅助方法来获取按单词出现频率排序的词频：\n\
  \n图 13.2 \n\n```php\n1 <?php\n 2 \n3 $text = <<<TEXT\n4 The eldest cat, the youngest\
  \ cat, and their group of cat friends went\n5 down the alley to fetch the runaway\
  \ ball.\n6 TEXT;\n7 \n8 str($text)->wordFrequency\n9     ->sortByDesc(fn($x) =>\
  \ $x);\n```\n\n我们将得到**表 13.1**中的结果：\n\n表 13.1 示例词频\n\n| 单词 | 出现次数 | 百比 |\n| ---\
  \ | --- | --- |\n| the | 4 | 19.05% |\n| --- | --- | --- |\n| cat | 3 | 14.29% |\n\
  | eldest | 1 | 4.76% |\n| youngest | 1 | 4.76% |\n| and | 1 | 4.76% |\n| their |\
  \ 1 | 4.76% |\n| group | 1 | 4.76% |\n| of | 1 | 4.76% |\n| friends | 1 | 4.76%\
  \ |\n| went | 1 | 4.76% |\n| down | 1 | 4.76% |\n| alley | 1 | 4.76% |\n| to | 1\
  \ | 4.76% |\n| fetch | 1 | 4.76% |\n| runaway | 1 | 4.76% |\n| ball | 1 | 4.76%\
  \ |\n\n**表 13.1**中的结果并不令人意外：单词“the”出现频率最高，其次是“cat”，之后情况迅速减少，其余所有单词在原始文本中仅出现了一次。这本身就是一个奇奇的信息，但让我们看看紧跟在单词“the”之后的单词的频率：\n\
  \n表 13.2 “the” 之后的单词频率\n\n| 单词 | 出现次数 | 百比 |\n| --- | --- | --- |\n| alley | 1 |\
  \ 25% |\n| --- | --- | --- |\n| eldest | 1 | 25% |\n| runaway | 1 | 25% |\n| youngest\
  \ | 1 | 25% |\n\n\n\n\n\n```php\n 1 <?php\n 2 \n 3 class MarkovGenerator\n 4 {\n\
  \ 5     protected $dictionary = [];\n 6 \n 7     public function loadText($text)\n\
  \ 8     {\n 9         $words = str($text)->lower->wordSplit->all();\n10 \n11   \
  \      for ($i = 0; $i < count($words); $i++) {\n12             $word = $words[$i];\n\
  13             $nextWord = $words[$i + 1] ?? null;\n14 \n15             if (! isset($this->dictionary[$word][$nextWord]))\
  \ {\n16                 $this->dictionary[$word][$nextWord] = 1;\n17           \
  \  } else {\n18                 $this->dictionary[$word][$nextWord]++;\n19     \
  \        }\n20         }\n21     }\n 22 }\n```\n\n在第 9 行，我们将输入文本的小写版本分成单词列表。使用小写是为了消除“The”和“the”等单词之间的差异。第\
  \ 11-20 行是事情变得有趣的地方。\n\n第 12 行和第 13 行负责从提取的单词列表中检索当前单词，以及该列表中紧随其后的单词。如果当前单词之后没有单词出现，我们将其默认设为\
  \ `null`。第 15-19 行使用检索到的两个单词，并将它们存储在类的内部字典中；如果我们是第一次看到某个单词序列，我们将计数设为 1。每当我们遇到相同的单词序列时，都会在第\
  \ 18 行增加其计数。\n\n现在我们可以开始在图 13.6 中实现算法的核心部分了：\n\n### 图 13.6 生成文本\n\n```php\n 1 <?php\n\
  \ 2 \n 3 class MarkovGenerator\n 4 {\n 5     // ...\n 6 \n 7     public function\
  \ generateText($seed = null, $length = 100)\n 8     {\n 9         if ($seed == null)\
  \ {\n10             $seed = array_rand($this->dictionary);\n11         }\n12 \n\
  13         // 将输出设置为初始种子单词。\n14         $output = $seed;\n15 \n16         for ($i\
  \ = 0; $i < $length; $i++) {\n17             // 如果单词不在我们的字典\n18             // 中，则停止生成。\n\
  19             if (! array_key_exists($seed, $this->dictionary)) {\n20         \
  \        break;\n21             }\n22 \n23             $nextWord = array_rand($this->dictionary[$seed]);\n\
  24 \n25             if ($nextWord == null) {\n26                 break;\n27    \
  \         }\n28 \n29             $output .= ' ' . $nextWord;\n30 \n31          \
  \   // 重置种子以继续我们的生成。\n32             $seed = $nextWord;\n33         }\n34 \n35 \
  \        return $output;\n36     }\n37 \n38     // ...\n39 }\n```\n\n我们的新方法接受两个参数：可选的\
  \ `$seed` 和长度 `$length`。种子单词将是我们之前讨论的单词选择过程的起点。我们的长度用于在文本生成过程意外进入无限循环的极少数情况下限制迭代次数。如果没有提供种子单词，我们将在第\
  \ 9-11 行之间检索一个存在于我们字典中的随机单词。\n\n为了处理序列终止的情况，我们在第 19-21 行检查提供的单词是否存在于我们的字典中。如果单词不在我们的字典中，我们将跳出循环。同样，在第\
  \ 25-27 行，如果我们检索到的下一个单词是 `null`，也会跳出循环。单词选择发生在第 23 行，但目前只是完全随机返回下一个单词。\n\n本章剩余部分将处理命令行工具中的文本。在表\
  \ 13.4 中，我们可以看到 Laravel 文档中“console”之后单词的频率：\n\n### 表 13.4 console 的单词频率\n\n| 单词\
  \ | 出现次数 | 百比 |\n| :--- | :--- | :--- |\n| command | 14 | 35% |\n| commands | 11\
  \ | 27.5% |\n| kernel | 4 | 10% |\n| events | 3 | 7.5% |\n| php | 2 | 5% |\n| introduction\
  \ | 2 | 2.5% |\n| based | 2 | 2.5% |\n| this | 2 | 2.5% |\n| you | 2 | 2.5% |\n\
  | as | 2 | 2.5% |\n| helpers | 2 | 2.5% |\n\n使用以下方式调用我们的生成器：\n\n### 图 13.7\n\n```php\n\
  \ 1 <?php\n 2 \n3 $generator = new MarkovGenerator();\n 4 \n5 // Laravel 文档的内容。\n\
  6 $laravelDocs = '...';\n 7 \n8 $generator->generateText('console', 5);\n```\n\n\
  可能会产生类似的输出：\n\n### 图 13.8\n\n```\n1 console registering\n2 console the lets\n3 console\
  \ configuration calling\n```\n\n我们的输出是随机的，但感觉有点不对；太随机了。我们可以在图 13.9 中看到这种行为，这是随机生成\
  \ 10,000 次的结果：\n\n![图 13.9 随机选择](img/randomized.png)\n\n### 图 13.9 随机选择\n\n在图 13.9\
  \ 的左侧，我们从生成 1 开始移动到右侧的 10,000。每一行代表该单词被选择了多少次；每个单词的标签并不重要，因为我们可以看到每个单词都是等概率选择的。如果我们想保留后续单词的概率，这种行为并不是我们想要的。\n\
  \n### 权重选择\n\n我们可以通过更新选择下一个单词的过程来改进文本生成器的行为。目前，我们的算法只是随机选择单词。这与我们想要的相反：随机选择单词但保留单词序列的相对概率。实现这一点的更改可以在图\
  \ 13.10 中找到：\n\n### 图 13.10 权重选择\n\n```php\n 1 <?php\n 2 \n3 class MarkovGenerator\n\
  \ 4 {\n 5     protected $dictionary = [];\n 6     protected $totals = [];\n 7 \n\
  \ 8     public function loadText($text)\n 9     {\n10         // ...\n11 \n12  \
  \       foreach ($this->dictionary as $sequence => $values) {\n13             $this->totals[$sequence]\
  \ = array_sum($values);\n14         }\n 15     }\n 16 \n17     protected function\
  \ getWord($seed)\n 18     {\n19         $rand = rand(1, $this->totals[$seed]);\n\
  20 \n21         foreach ($this->dictionary[$seed] as $word => $count) {\n22    \
  \         $rand -= $count;\n23 \n24             if ($rand <= 0) {\n25          \
  \       return $word;\n26             }\n 27         }\n 28 \n29         return\
  \ null;\n 30     }\n 31 \n32     public function generateText($seed = null, $length\
  \ = 100)\n 33     {\n34         if ($seed == null) {\n35             $seed = array_rand($this->dictionary);\n\
  36         }\n 37 \n38         // 将输出设置为初始种子单词。\n39         $output = $seed;\n40\
  \ \n41         for ($i = 0; $i < $length; $i++) {\n42             // 如果单词不在我们的字典\n\
  43             // 中，则停止生成。\n44             if (! array_key_exists($seed, $this->dictionary))\
  \ {\n45                 break;\n46             }\n47 \n48             $nextWord\
  \ = array_rand($this->dictionary[$seed]);\n49             $nextWord = $this->getWord($seed);\n\
  50 \n51             if ($nextWord == null) {\n52                 break;\n53    \
  \         }\n54 \n55             $output .= ' ' . $nextWord;\n56 \n57          \
  \   // 重置种子以继续我们的生成。\n58             $seed = $nextWord;\n59         }\n60 \n61 \
  \        return $output;\n62     }\n 63 }\n```\n\n假设当我们想要检索“console”之后的下一个单词时，第\
  \ 19 行选中的随机数是 16。我们可以查看表 13.5 来了解我们的 `$rand` 变量在每次迭代后的变化：\n\n### 表 13.5 权重选择迭代\n\
  \n\n\n\n\n| 迭代 | 单词 | 出现次数 | rand 值 |\n| --- | --- | --- | --- |\n| 1 | introudction\
  \ | 1 | 15 |\n| 2 | commands | 11 | 4 |\n| 3 | command | 14 | -10 |\n\n在三次迭代之后，我们的\
  \ `getWord` 方法将返回单词“command”。我们从**表 13.5**中看到，一个单词在我们目标单词之后出现的频率越高，它减少我们 `$rand`\
  \ 变量的速度就越快，使其更有可能被选中。\n\n现在让我们像以前一样重新分析生成器的行为，并将其行为与**图 13.9**中的选择频率进行比较。在**图 13.11**\
  \ 中，我们可以看到我们新的随机选择过程现在倾向于高频率的单词，但仍然允许低频率的单词被选中：\n\n![图 13.11 加权单词选择](img/weighted_selection.png)\n\
  \n图 13.11 加权单词选择\n\n查看**图 13.12**，我们可以看到我们的加权随机选择过程检索到的单词频率与其在源文本中出现的频率相似。\n\n![图\
  \ 13.12 生成单词频率与源单词频率的对比](img/word_distribution.png)\n\n图 13.12 生成单词频率与源单词频率的对比\n\
  \n### 13.3 改进我们的文本生成器\n\n如果我们重复早的实验，并使用改进后的单词选择生成一些随机文本，可能会得到类似下面的结果：\n\n图 13.13\n\
  \n```\n1 console command you need to select\n2 console kernel class you may wish\n\
  3 console commands provide any changes to\n```\n\n我们生成的文本开始*感觉*更好了，但我们仍然可以进行改进。我们可以做到此点的一种方法是在构建字典时使用多一个单词。如果我们考虑这个想法，它它是合理的。\n\
  \n我们的文本生成算法根据后续单词在原始文本中出现的频率来生成后续单词。推测，这篇原始文本是由人类编写的，因此是他们最终决定了这些单词的频率。如果我们增加在预测文本时重用的单词数量，那么会有更多的人类影响体现在生成的文本中。然而，这在某种程度上是有效的。\n\
  \n如果我们重用原始文本中太多的单词，生成的文本将变得越来越不原始，看起来就像是从原始文本中复制/粘贴的片段。\n\n我们可以更新现有的实现以支持多单词序列，如下：\n\
  \n图 13.14 在我们的文本生成器中支持多单词序列\n\n```\n 1 <?php\n 2 \n3 class MarkovGenerator\n4 {\n\
  \ 5     protected $dictionary = [];\n 6     protected $totals = [];\n 7     protected\
  \ $sequenceLength;\n 8 \n 9     public function __construct($sequenceLength = 1)\n\
  10     {\n11         $this->sequenceLength = $sequenceLength;\n12 \n13         if\
  \ ($this->sequenceLength <= 0) {\n14             $this->sequenceLength = 1;\n15\
  \         }\n16     }\n17 \n18     public function loadText($text)\n19     {\n20\
  \         $words = str($text)->lower()->wordSplit();\n21 \n22         for ($i =\
  \ 0; $i < count($words); $i++) {\n23             $word = $words[$i];\n24       \
  \      $nextWord = $words[$i + 1] ?? null;\n25             $word = implode(\n26\
  \                 ' ',\n27                 array_slice($words, $i, $this->sequenceLength)\n\
  28             );\n29 \n30             $nextWord = $words[$i + $this->sequenceLength]\
  \ ?? null;\n32 \n33             if (!isset($this->dictionary[$word][$nextWord]))\
  \ {\n34                 $this->dictionary[$word][$nextWord] = 1;\n35           \
  \  } else {\n36                 $this->dictionary[$word][$nextWord]++;\n37     \
  \        }\n38         }\n39 \n40         foreach ($this->dictionary as $sequence\
  \ => $values) {\n41             $this->totals[$sequence] = array_sum($values);\n\
  42         }\n43     }\n44     // ...\n45 \n46     public function generateText($seed\
  \ = null, $length = 100)\n47     {\n48         if ($seed == null) {\n49        \
  \     $seed = array_rand($this->dictionary);\n50         }\n51 \n52         // Set\
  \ the output to the initial seed.\n53         $output = $seed;\n54 \n55        \
  \ // We need to break our seed into\n56         // own list of words so that we\
  \ can\n57         // retrieve the last word later\n58         // to build up seeds.\n\
  59         $words = str($seed)->wordSplit()->all();\n60 \n61         for ($i = 0;\
  \ $i < $length; $i++) {\n62             // Stop generating if the word\n63     \
  \        // not exist inside our dictionary.\n64             if (!array_key_exists($seed,\
  \ $this->dictionary)) {\n65                 break;\n66             }\n67 \n68  \
  \           $nextWord = $this->getWord($seed);\n69 \n70             if ($nextWord\
  \ == null) {\n71                 break;\n72             }\n73             $output\
  \ .= ' ' . $nextWord;\n74 \n75             // Remove the first word from our list.\n\
  76             $words = array_slice($words, 1);\n77 \n78             // Add the\
  \ new word to the list.\n79             $words[] = $nextWord;\n80 \n81         \
  \    // Reset the seed to continue generation.\n82             $seed = implode('\
  \ ', $words);\n83         }\n84         return $output;\n85     }\n86 }\n```\n\n\
  \n\n本章将探索使用固定宽度数据方案格式化数据的技术和方法。固定宽数据格式是在开发典型的 Web 应用时并不经常遇到的开发项目之一，但当它们出现时，可能会让一些开发者完全措手不及。这并不是因为处理这些格式本身很棘手，而是因为它们与典型的日常任务非常不同。\n\
  \n要从绝对的角度来讨论这个话题，或者为读取和写入固定宽数据提供有意义的通用解决方案将具有挑战性。数据在以固定宽格式存储时的编码方式在很大程度上取决于用于存储的应用程序以及使用的架构（schema）或数据定义等。然而，我们可以一起观察一些技术，以理解如何处理这类数据。\n\
  \n让我们考虑 `Table 14.1`，它包含了一些示例发票数据：\n\n表 14.1 示例发票\n\n| 发票号 || 总额 || 数量 | 产品 ID |\n\
  | --- | --- | --- | --- |\n| 1 || 12.00 || 5 || 1 |\n| --- | --- | --- | --- |\n\
  | 2 || 32.32 || 1 || 2 |\n| 3 || 16 || 10 || 3 |\n| 4 || 622 || 4 || 4 |\n| 5 ||\
  \ 77 || 1 || 5 |\n\n我们的表包含了一些示例发票数据。从左到右，我们有发票号、发票收取的货币总额、购买的产品数量，最后是产品标识符。我们对这些数据并不了解多少，例如实际的数据类型。对于我们的示例发票，我们将假设除总额外，所有值都是整数；我们的总额是一个小数。\n\
  \n现在让我们假设我们收到了以下文本文件：\n\n图 14.1 固定宽数据示例\n\n```\n1          1        12         5\
  \         1\n2          2     32.32         1         2\n3          3        16\
  \        10         3\n4          4       622         4         4\n5          5\
  \        77         1         5\n```\n\n当我们将 `Figure 14.1` 与 `Table 14.1` 进行时，可以快速看到数据是如何关联的。每个表行都表示为文本文件中的单行，每个“单元格”都存储在十个字符内。我们的第一个任务是根据以下\
  \ PHP 数组生成我们的文本文件：\n\n图 14.2 发票数据数组\n\n```\n 1 <?php\n 2 \n 3 $invoices = [\n 4\
  \     [\n 5         'number'   => 1,\n 6         'total'    => 12.0,\n 7       \
  \  'quantity' => 5,\n 8         'pid'      => 1,\n 9     ],\n10     [\n11      \
  \   'number'   => 2,\n12         'total'    => 32.32,\n13         'quantity' =>\
  \ 1,\n14         'pid'      => 2,\n15     ],\n16     [\n17         'number'   =>\
  \ 3,\n18         'total'    => 16.0,\n19         'quantity' => 10,\n20         'pid'\
  \      => 3,\n21     ],\n22     [\n23         'number'   => 4,\n24         'total'\
  \    => 622.0,\n25         'quantity' => 4,\n26         'pid'      => 4,\n27   \
  \  ],\n28     [\n29         'number'   => 5,\n30         'total'    => 77.0,\n31\
  \         'quantity' => 1,\n32         'pid'      => 5,\n33     ],\n34 ];\n```\n\
  \n让我们思考如何将我们的数组转换为我们在 `Figure 14.1` 中看到的格式。在这一点上，很容易把事情复杂化。我们已经通过 Laravel 辅助方法遇到了执行任务所需的工具：\n\
  \n图 14.3 将我们的发票转换为文本文件\n\n```\n1 <?php\n2 \n3 $textData = collect($invoices)->map(function\
  \ ($invoice) {\n4     return str('')\n5         ->append(str($invoice['number'])->padLeft(10))\n\
  6         ->append(str($invoice['total'])->padLeft(10))\n7         ->append(str($invoice['quantity'])->padLeft(10))\n\
  8         ->append(str($invoice['pid'])->padLeft(10));\n9 })->join(\"\\n\");\n```\n\
  \n在第 3 行，我们使用 `invoices` 数组创建一个 Laravel 集合实例以利用它的所有功能。特别是，我们正在利用它的 `map` 方法，该方法可以转换我们发票数组的每个元素。在\
  \ `map` 方法体内部，我们将每张发票转换为字符串，最后在第 9 行，我们使用换行符连接所有元素。\n\n在第 4 到第 8 行之间，我们将每个发票转换为我们的文本格式。在第\
  \ 4 行，我们初始化一个空字符串对象进行链式调用。后续行在使用 `padLeft` 方法将值填充到十个字符后，将其附加到空字符串中。\n\n现在我们已经有了通过字符串连接的记录，可以开始对其提出一些有趣的问题。第一个问题可能是，考虑到我们对文本的了解，是否有方法可以在不将其转换回数组的情况下计算记录数？\n\
  \n在 `Figure 14.3` 中，当我们发票转换为字符串时，我们使用换行符连接所有记录。我们可以利用这一事实并计算文本中出现的换行符数量来获取记录数：\n\
  \n图 14.4 计算记录数\n\n```\n1 <?php\n2 \n3 // 计算字符串中的记录数。\n4 \n5 // 返回 4\nstr($textData)->substrCount(\"\
  \\n\");\n```\n\n你可能已经注意到换行符的数量比总记录数少一。这是因为我们的文档没有以换行符结尾；我们可以通过给换行符计数加 1 来获取最终记录数：\n\
  \n图 14.5 考虑末尾换行符\n\n```\n1 <?php\n2 \n3 // 计算字符串中的记录数。\n4 \n5 // 返回 5\nstr($textData)->substrCount(\"\
  \\n\") + 1;\n```\n\n等等，我注意到图 14.5 的源文本有一个微小差异（逻辑上说是加 1，但提示中的代码片段是不完整的）。我已经修正了逻辑以匹配描述：`str($textData)->substrCount(\"\
  \\n\") + 1`。\n\n实际上，查看提供的文本：\n`str($textData)->substrCount(\"\\n\");` 是那里，但文本说：“我们可以通过给换行符计数加\
  \ 1 来获取最终记录数”。我将遵循提供的文本结构，但确保格式是整洁的。\n\n让我们重新检查：“图 14.5 考虑末尾换行符”。\n\n让我重新检查：“现在我们已经有了通过字符串连接的记录，我们无法使用计数换行符的技术来确定记录数。然而，我们知道每条记录单独占用多少字符，即四十个字符。”\n\
  \n让我们完善：“为了讨论起见，让我们重构现有的转换方法，使用空字符串而不是换行符连接我们的记录：\n\n图 14.6\n\n```\n1 <?php\n2 \n\
  3 $textData = collect($invoices)->map(function ($invoice) {\n4     return str('')\n\
  5         ->append(str($invoice['number'])->padLeft(10))\n6         ->append(str($invoice['total'])->padLeft(10))\n\
  7         ->append(str($invoice['quantity'])->padLeft(10))\n8         ->append(str($invoice['pid'])->padLeft(10));\n\
  9 })->join('');\n```\n\n这将产生类似于下面的文本。换行符是为了格式添加的，但字符串中并不：\n\n图 14.7 用空字符串连接的记录\n\
  \n```\n11        12         5         1         2     32.32         1         2\n\
  2 3        16        10         3         4       622         4         4\n3 5 \
  \       77         1         5\n```\n\n现在我们已经有了通过字符串连接的记录，我们无法使用计数换行符的技术来确定记录数。然而，我们知道每条记录单独占用多少字符，即四十个字符。此外，我们可以快速确定输出字符串的长度。我们可以用这两个值相除来获取文本中的总记录数：\n\
  \n图 14.8 获取不带换行符的记录数\n\n```\n1 <?php\n2 \n3 // 计算字符串中的记录数。\n4 \n5 // 返回 5\nstr($textData)->length()\
  \ / 40;\n```\n\n我们的下一个任务是将字符串转换回发票数组。我们将处理 `Figure 14.7` 中的文本输出，那里每条记录是用空字符串连接的。\n\
  \n如果我们处理用换行符连接的版本，我们可以通过换行符分割输入字符串来获取每条记录的文本内容。由于我们没有换行符，我们的任务将稍微具有挑战性，但并非不可能。\n\
  \n图 14.9 将字符串拆分为数组\n\n\n\n\n```php\n 1 <?php\n 2 \n 3 $data = str($textData);\n\
  \ 4 $dataLength = $data->length();\n 5 \n 6 $processedLength = 0;\n 7 \n 8 $records\
  \ = [];\n 9 \n10 while ($processedLength < $dataLength) {\n11     $records[] = (string)\
  \ $data->substr($processedLength, 40);\n12     $processedLength += 40;\n13 }\n```\n\
  \n在**图 14.9** 中，我们从较大的数据字符串中提取代表每个记录的字符串。在第 3 行，我们将数据字符串转换为流式字符串实例，以便访问许多辅助方法。在第\
  \ 4 行，我们获取数据字符串的总长度；在我们的示例中，这仍然是 200 个字符。\n\n在第 6 行，我们定义了一个变量 `$processedLength`，用它来跟踪在数据字符串中已处理的字符数。我们在第\
  \ 10 行和第 13 行之间使用它。\n\n在第 11 行，我们从较大的数据字符串中提取子字符串，并将每个字符串添加到 `records` 数组中。让我们详细讨论这种特定策略实际上是如何工作的。\n\
  \n我们知道每个记录包含四十个字符。在第一次迭代中，我们的处理长度的值为零。当我们在此时调用 `substr` 方法时，它将从数据字符串中提取前四十个字符。然后我们在第\
  \ 12 行增加 `$processedLength` 变量的值。\n\n在第二次迭代中，我们的 `substring` 将从第 40 个字符开始，并获取接下来的四十个字符。这个过程将重复进行，直到我们耗尽字符串。代码执行后，我们的\
  \ `records` 数组将包含以下数据：\n\n图 14.10 \n\n```\n1 array:5 [\n2   0 => \"         1  \
  \      12         5         1\"\n3   1 => \"         2     32.32         1     \
  \    2\"\n4   2 => \"         3        16        10         3\"\n5   3 => \"   \
  \      4       622         4         4\"\n6   4 => \"         5        77      \
  \   1         5\"\n7 ]\n```\n\n我们正接近目标。然而，我们现在处于与之前相同的境地，但这次是针对数据集中的每个记录。幸运的是，可以使用相同的提取子字符串的过程将数据转换为单独字段：\n\
  \n图 14.11 从字符串记录中提取列值 \n\n```php\n 1 <?php\n 2 \n 3 $data = str($textData);\n 4\
  \ $dataLength = $data->length();\n 5 \n 6 $processedLength = 0;\n 7 \n 8 $records\
  \ = [];\n 9 \n10 while ($processedLength < $dataLength) {\n11     $record = $data->substr($processedLength,\
  \ 40);\n12 \n13     // 将我们的字符串转换为发票记录。\n14     $records[] = [\n15         'number'\
  \ => intval((string) $record->substr(0, 10)),\n16         'total' => floatval((string)\
  \ $record->substr(10, 10)),\n17         'quantity' => intval((string) $record->substr(20,\
  \ 10)),\n19         'pid' => intval((string) $record->substr(30, 10)),\n19     ];\n\
  20 \n21     $processedLength += 40;\n22 }\n```\n\n我们正接近目标。然而，我们现在处于与之前相同的境地，但这次是针对数据集中的每个记录。幸运的是，可以使用相同的提取子字符串的过程将数据转换为单独字段：\n\
  \n在**图 14.11** 中，我们的方法与之前所做的相似，但看起来略有不同。主要区别在于，我们不需要跟踪每个记录已处理的字符数，因为在处理单个记录的语境下，我们确切地知道每个值出现的位置。在第\
  \ 14 行和第 19 行之间，我们提取不同的子字符串，并调用 PHP 的 `intval` 或 `floatval` 函数将字符串转换为适当的数据类型。一旦完成此过程，我们生成的\
  \ `records` 数组将与我们在本章开始时使用的 `invoices` 数组匹配。\n\n由于我们知道每个记录的长度恰好为四十个字符，在不处理整个数据字符串的情况下检索单个记录是非常轻而易举的。要做到这一点，我们根据想要检索的记录号计算每个单独记录的起始偏移量。\n\
  \n例如，如果我们想要 1 号记录，我们将从偏移量 0 开始；如果我们想要检索 2 号记录，我们将从偏移量 40 开始，依此类推。将其封装到自己的函数中相对简单，事实上，这将使我们之前的实现更易推理。**图\
  \ 14.12** 中的实现将使用零索引，这有助于简化计算：\n\n图 14.12 检索单个发票\n\n```php\n 1 <?php\n 2 \n3 function\
  \ getInvoice($data, $recordNumber) {\n4     // 防止在数据开始之前读取。\n5     if ($recordNumber\
  \ < 0) { return null; }\n6     \n7     $strData = str($data);\n8     \n9     $startIndex\
  \ = $recordNumber * 40;\n10     // 防止在数据结束之后读取。\n11     if ($startIndex >= $strData->length())\
  \ { return null; }\n12     \n13     $record = $strData->substr($startIndex, 40);\n\
  14     \n15     return [\n16         'number' => intval((string) $record->substr(0,\
  \ 10)),\n17         'total' => floatval((string) $record->substr(10, 10)),\n18 \
  \        'quantity' => intval((string) $record->substr(20, 10)),\n19         'pid'\
  \ => intval((string) $record->substr(30, 10)),\n20     ];\n21 }\n```\n\n\n\n\n\n\
  ```\n1 1     12.00         5         1         2     32.32         1         2\n\
  2 3     16.00        10         3         4    622.00         4         4\n3 5 \
  \    77.00         1         5\n```\n\n如果我们仔细观察**图 14.17**中的输出数据，我们可以发现我们获得了一个令人兴奋的机会。由于我们已经决定所有的货币值将始终存储为最多两位精度，因此存储实际的小数点分隔符就变得多余了。如果我们将其移除，我们的存储字段将能够包含之前被分隔符字符占据的数字。我们也可以通过略微修改现有的实现，让\
  \ `PHP` 知道我们不需要任何分隔符字符。我们通过通过对小数点分隔符和千分位分隔符参数提供空字符串来实现这一点：\n\n图 14.18 移除小数点分隔符 \n\
  \n```\n 1 <?php\n 2 \n 3 $textData = collect($invoices)->map(function ($invoice)\
  \ {\n 4     $totalFormatted = number_format($invoice['total'], 2);\n 5     $totalFormatted\
  \ = number_format($invoice['total'], 2, '', '');\n 6 \n 7     return str('')\n 8\
  \         ->append(str($invoice['number'])->padLeft(10))\n 9         ->append(str($totalFormatted)->padLeft(10))\n\
  10         ->append(str($invoice['quantity'])->padLeft(10))\n11         ->append(str($invoice['pid'])->padLeft(10));\n\
  12 })->join('');\n```\n\n使用**图 14.18**中的修改对数据进行编码，我们的输出现在将变为：\n\n图 14.19 \n\n```\n\
  1          1      1200         5         1         2      3232         1\n2 2  \
  \       3      1600        10         3         4     62200         4\n3 4     \
  \    5      7700         1         5\n```\n\n我们在**图 14.19**中生成的数据字符串长度与之前相同，因此我们的总记录计算将仍然是正确的。然而，当我们尝试检索每张发票的货币总额时，我们的更改将带来一个新问题。具体来说，挑战在于每个总额现在看起来都类似于：\n\
  \n图 14.20 \n\n```\n1 3232\n```\n\n解决此问题实际上有几种不同的方法。如果我们仔细观察这些新数字，可以发现通过移除小数点，我们实际上所做的仅仅是将原始总额乘以\
  \ 100。我们可以做出此假设，因为我们知道发票总额将始终以恰好的 2 位精度存储。更具体地说，我们可以说我们实际存储的是一个十进制数的系数，其指数为 -2：\n\
  \n![32.32 = \\underbrace{3232}\\_{\\\\text{significand}} x {\\\\underbrace{10}\\\
  _{\\\\text{base}}}^{\\\\overbrace{-2}^{exponent}}](img/leanpub_equation_0.png)\n\
  \n我们可以更新现有的 `getInvoice` 函数来实现这一点：\n\n图 14.21\n\n```\n 1 <?php\n 2 \n 3 function\
  \ getInvoice($data, $recordNumber) {\n 4     // 防止在数据开始之前尝试读取。\n 5     if ($recordNumber\
  \ < 0) { return null; }\n 6 \n 7     $strData = str($data);\n 8 \n 9     $startIndex\
  \ = $recordNumber * 40;\n 10     \n 11     // 防止读取超过数据范围。\n 12     if ($startIndex\
  \ >= $strData->length()) { return null; }\n 13 \n 14     $record = $strData->substr($startIndex,\
  \ 40);\n 15 \n 16     return [\n 17         'number' => intval((string) $record->substr(0,\
  \ 10)),\n 18         'total' => intval((string) $record->substr(10, 10)) / 100,\n\
  \ 19         'quantity' => intval((string) $record->substr(20, 10)),\n 20      \
  \   'pid' => intval((string) $record->substr(30, 10)),\n 21     ];\n 22 }\n```\n\
  \n现在，我们的发票将带有正确的总额进行检索。\n\n解决此问题的另一种方法是通过提取其组成部分然后重新组合它们来重建原始字符串。我们可以在示例中这样做，即提取两个子字符串：第一个将是从开始到最后两个字符之前的所有内容，第二个子字符串将包含最后两个字符。\n\
  \n一旦我们有了这些部分，就可以通过在它们中使用小数点分隔符并将它们全部连接，然后使用 PHP 的 `floatval` 函数：\n\n图 14.22 使用子字符串和拼接解析总额\n\
  \n```\n 1 <?php\n 2 \n 3 function getInvoice($data, $recordNumber) {\n 4     //\
  \ 防止在数据开始之前尝试读取。\n 5     if ($recordNumber < 0) { return null; }\n 6 \n 7     $strData\
  \ = str($data);\n 8 \n 9     $startIndex = $recordNumber * 40;\n 10     \n 11  \
  \   // 防止读取超过数据范围。\n 12     if ($startIndex >= $strData->length()) { return null;\
  \ }\n 13 \n 14     $record = $strData->substr($startIndex, 40);\n 15     \n 16 \
  \    $total = $record->substr(10, 10);\n 17     \n 18     $integer = $total->substr(0,\
  \ 8);\n 19     $fraction = $total->substr(8);\n 20     \n 21     $parsedTotal =\
  \ floatval($integer . '.'$fraction);\n 22     return [\n 23         'number' =>\
  \ intval((string) $record->substr(0, 10)),\n 24         'total' => $parsedTotal,\n\
  \ 25         'quantity' => intval((string) $record->substr(20, 10)),\n 26      \
  \   'pid' => intval((string) $record->substr(30, 10)),\n 27     ];\n 28 }\n```\n\
  \n关于字符串拼接，我们可以通过巧妙地使用 `substrReplace` 方法进一步简化。我们可以通过指定替换长度为零在任意位置插入新字符串。对于我们的用例，我们可以通过指定偏移量\
  \ 8 和长度 0 来插入小数点分隔符：\n\n图 14.23 \n\n```\n 1 <?php\n 2 \n 3 function getInvoice($data,\
  \ $recordNumber) {\n 4     // 防止在数据开始之前尝试读取。\n 5     if ($recordNumber < 0) { return\
  \ null; }\n 6 \n 7     $strData = str($data);\n 8 \n 9     $startIndex = $recordNumber\
  \ * 40;\n 10     \n 11     // 防止读取超过数据范围。\n 12     if ($startIndex >= $strData->length())\
  \ { return null; }\n 13     \n 14     $record = $strData->substr($startIndex, 40);\n\
  \ 15     \n 16     $total = $record->substr(10, 10);\n 17     \n 18     return [\n\
  \ 19         'number' => intval((string) $record->substr(0, 10)),\n 20         'total'\
  \ => floatval(\n 21             (string) $total->substrReplace('.', 8, 0)\n 22 \
  \        ),\n  23         'quantity' => intval((string) $record->substr(20, 10)),\n\
  \ 24         'pid' => intval((string) $record->substr(30, 10)),\n 25     ];\n 26\
  \ }\n```\n\n在整个节中，我们非常关注整数和十进制。然而，看到几乎所有数据类型在与其存储格式之间进行转换是普遍的。特别是，这种方法经常用于日期；在处理固定宽度数据格式时，您应该始终查找有关数据如何格式化以及应采取哪些步骤进行检索文档。\n\
  \n### 14.2 更新单个记录的值\n\n在上一节中，我们使用 `substrReplace` 方法在数字字符串中插入小数点分隔符。我们可以进一步利用此方法来实际更新单个记录的值。例如，假设有以下数据字符串：\n\
  \n图 14.24 \n\n```\n1          1      1200         5         1         2      3232\
  \         1\n2 2         3      1600        10         3         4     62200   \
  \      4\n3 4         5      7700         1         5\n```\n\n图 14.25 更新一组记录中的单个字段\
  \ \n\n\n\n\n\n```php\n <?php\n \nfunction updateData($data, $recordNumber, $fieldNumber,\
  \ $newData) {\n    // 计算记录的起始偏移量。\n    $startIndex = $recordNumber * 40;\n\n   \
  \ // 计算目标字段的相对偏移量。\n    $fieldIndex = $fieldNumber * 10;\n\n    // 两个偏移量获取数据的起始索引。\n\
  \    $dataOffset = $startIndex + $fieldIndex;\n\n    // 用新数据替换现有数据。\n    return\
  \ (string) str($data)\n        ->substrReplace($newData, $dataOffset, 10);\n}\n\
  ```\n\n现在我们可以使用 `updateData` 函数来更新第三条记录的标识符：\n\n图 14.26 \n\n```php\n <?php\n \n\
  \ $newData = updateData(\n    $textData, // 原始数据字符串。\n    2, // 记录从 0 开始的索引。\n \
  \   3, // 字段从 0 开始的索引。\n    str(3)->padLeft(10) // 要存储的新数据。\n );\n```\n\n这将产生新的数据字符串：\n\
  \n图 14.27 \n\n```\n 1          1      1200         5         1         2      3232\
  \         1\n2 2         3      1600        10         3         4     62200   \
  \      4\n3 4         5      7700         1         5\n```\n\n我们计算任意记录字段偏移量的方法被泛化了，因为我们知道数据集中的每个字段都有一致的宽度。如果字段宽度是可变的，我们的方法将是取目标字段之前出现的所有字段宽度之和。\n\
  \n### 14.3 管理文本截断的技术\n\n文本截断是处理固定宽度数据格式时最具挑战性的方面之一。因为根据定义，我们的存储格式是固定长度，因此我们尝试存储的任何超过给定字段大小的文本都无法容纳。某些系统会在这种情况即将发生时提供警告，甚至触发致命错误以防止数据截断。\n\
  \n让我们看看 `Table 14.2`，它包含我们正努力存储在限制数据格式中的示例数据：\n\n表 14.2 示例文本数据\n\n| 记录编号 || 文本值\
  \ |\n| --- | --- |\n| 1 || Lorem ipsum dolor sit amet |\n| --- | --- |\n| 2 || Nam\
  \ finibus nulla non bibendum bibendum |\n| 3 || Ut sed ante euismod, vulputate justo\
  \ sit amet |\n\n我们将用以下 PHP 数组来表示它：\n\n图 14.28 \n\n```php\n <?php\n \n $data = [\n\
  \    [\n        'record_no' => 1,\n        'text' => 'Lorem ipsum dolor sit amet',\n\
  \    ],\n    [\n        'record_no' => 2,\n        'text' => 'Nam finibus nulla\
  \ non bibendum bibendum',\n    ],\n    [\n        'record_no' => 3,\n        'text'\
  \ => 'Ut sed ante euismod, vulputate justo sit amet',\n    ]\n];\n```\n\n正如我们之前做的那样，我们将努力将数据数组存储在固定宽度数据格式中。我们假设记录编号将使用三个字符存储，而文本数据将使用最多十个字符存储：\n\
  \n图 14.29 在数据截断时抛出异常 \n\n```php\n <?php\n \n $dataString = collect($data)->map(function\
  \ ($record) {\n    $textValue = str($record['text']);\n\n    if ($textValue->length()\
  \ > 10) {\n        throw new Exception('Text value would be truncated.');\n    }\n\
  \n    return str('')\n        ->append(str($record['record_no'])->padLeft(3))\n\
  \        ->append($textValue->padRight(10));\n })->join('');\n```\n\n我们在 `Figure\
  \ 14.29` 中的代码目前每当我们尝试存储超过十个字符的数据时都会抛出异常。此检查发生在第 6 行和第 8 行之间。我们可以问自己，即使数据超过了单条记录的长度，我们如何持久化数据？\n\
  \n我经常遇到的一种方法是简单的追加额外的数据记录，以继续被截断的每个字段的数据。某些实现可能会添加不同的字段，例如序列号，或者作为识别完全不同记录类型的方法，以帮助跟踪哪些额外记录属于在一起。我们将为创建的每个用于存储被截断文本的后续记录简单地重用记录编号。\n\
  \n这种方法的实现可以在 `Figure 14.30` 中找到：\n\n图 14.30 防止数据截断 \n\n```php\n <?php\n \n $dataString\
  \ = collect($data)->map(function ($record) {\n    $recordNumber = str($record['record_no'])->padLeft(3);\n\
  \    $textValue = $record['text'];\n    $textValues = mb_str_split($textValue, 10);\n\
  \n    return collect($textValues)->map(function ($textValue) use ($recordNumber)\
  \ {\n        return $recordNumber->append($textValue->padRight(10));\n    })->join('');\n\
  });\n```\n（注：图 14.30 提供的源文本是碎片化/不完整的；已根据周围文本的上下文进行了重构，以保持有效的结构。）*\n\n\n\n\n我们在第\
  \ 3 行再次使用了 `mb_str_split` 函数。然而，这次我们使用它来将较大的数据字符串拆成一个包含长度为 13 的子字符串的数组。我们可以在不拆分整个字符串的情况下做到这一点，这对于大量的输入文本是有益的，但考虑到我们最终仍然需要获取所有记录，目前这样做也并无大碍。\n\
  \n在第 6 行到第 13 行之间，我们正在获取由数据字符串表示的每个记录的整数记录号和中间文本值。在这个阶段，我们的数据看起来将类似于下面的示例数组：\n\n\
  图 14.34 \n\n```\n 1 array:12 [\n 2   0 => array:2 [\n 3     \"record_no\" => 1\n\
  \ 4     \"text\" => \"Lorem ipsu\"\n 5   ]\n 6   1 => array:2 [\n 7     \"record_no\"\
  \ => 1\n 8     \"text\" => \"m dolor si\"\n 9   ]\n10   2 => array:2 [\n11     \"\
  record_no\" => 1\n12     \"text\" => \"t amet    \"\n13   ]\n14   // ...\n15 ]\n\
  ```\n\n然后，我们在第 14 行根据记录号对所有中间记录进行分组，随后我们在另一个 `map` 方法调用内部处理这些记录。\n\n在第 16 行，我们移除了中间记录的最后一个条目。这样做是因为我们想要修剪该记录末尾的空格，因为每个文本值都填充到了\
  \ 10 个字符。我们不希望移除其他任何记录的末尾空格，因为那些空格可能是导致原始值超过我们字段大小的数据的一部分。\n\n在移除最后一个条目后，我们合并了第\
  \ 22 行到第 24 行的所有其他文本值；最后，在第 27 行，我们追加了最后一行经过修剪的值。\n\n一旦我们的实现执行完毕，我们将收回原始的数据数组：\n\
  \n图 14.35 \n\n```\n 1 array:3 [\n 2   1 => array:2 [\n 3     \"record_no\" => 1\n\
  \ 4     \"text\" => \"Lorem ipsum dolor sit amet\"\n 5   ]\n 6   2 => array:2 [\n\
  \ 7     \"record_no\" => 2\n 8     \"text\" => \"Nam finibus nulla non bibendum\
  \ bibendum\"\n 9   ]\n10   3 => array:2 [\n11     \"record_no\" => 3\n12     \"\
  text\" => \"Ut sed ante euismod, vulputate justo sit amet\"\n13   ]\n14 ]\n```\n\
  \n## 15. 字符串拆分\n\n接收输入字符串并按照一组规则规则将其转换为数据数组，是开发几乎任何类型应用程序的一项常见任务。Laravel 和 PHP 提供了许多不同的辅助方法和函数来帮助实现这一点，其中我们已经见过了一些，例如\
  \ PHP 的 `mb_str_split` 函数。\n\n执行此操作最常见的任务之一是将逗号分隔的字符串拆分为字符串数组。在**图 15.1** 中，我们可以看到一个简单的\
  \ PHP 程序，它根据逗号字符分离某些输入文本：\n\n图 15.1 \n\n```\n1 <?php\n2 \n3 function splitString($value)\
  \ {\n4     return str($value)->explode(',')\n5         ->map(fn($x) => ltrim($x))\n\
  6         ->all();\n7 }\n8 \n9 splitString('hello, world');\n```\n\n它产生了以下字符串列表：\n\
  \n图 15.2 \n\n```\n1 array:2 [\n2   0 => \"hello\"\n3   1 => \"world\"\n4 ]\n```\n\
  \n这个特定的示例在推理和实现上相对相对简单，但如果我们的应用程序需求发生了变化，我们需要拆分以下字符串：\n\n图 15.3 \n\n```\n1 hello,\
  \ \"Hello, world\", '\"hello \", world!', world\n```\n\n将其拆分为这个数组？\n\n图 15.4 \n\n\
  ```\n1 array:4 [\n2   0 => \"hello\"\n3   1 => \"Hello, world\"\n4   2 => \"\"hello\
  \ \", world!\"\n5   3 => \"world\"\n6 ]\n```\n\n像这样对需求的微小变化可能会显著增加我们问题的复杂度，而且我们可能并不清楚应该从哪里开始解决它。我们将在本章讨论这些问题；我们将从更直接的技术开始，并随着进展逐渐增加问题的难度。\n\
  \n## 15.1 基础字符串拆分\n\n在本章的引言中，我们看到了拆分字符串的最基本的方法之一：使用 `explode` 辅助方法。与我们之前章节讨论的内容相比，关于这个特定方法没有太多补充的。尽管如此，我们仍然可以探索一些有趣的用例并解决一个常见的误解。\n\
  \n我们知道可以使用以下方法按单个字符进行拆分：\n\n图 15.5 \n\n```\n1 <?php\n2 \n3 // Returns [\"one\",\
  \ \"two\", \"three\"]\n4 str('one, two, three')->explode(',')\n5     ->map(fn($x)\
  \ => ltrim($x))\n6     ->all();\n```\n\n但在多年来与人们讨论的过程中，一个困惑点是如何根据根据较大的“块”来拆分字符串。我认为这是由于几乎总是遇到这些用于单字符分离字符串的方法导致的，但需要注意的重要点是，`explode`\
  \ 可以根据任何子字符串拆分字符串。例如，让我们根据 `OR` 拆分以下字符串：\n\n图 15.6 \n\n```\n1 <?php\n2 \n3 str('this\
  \ OR that OR some thing or another')->explode('OR')\n4     ->map(fn($x) => ltrim($x))\n\
  5     ->all();\n```\n\n结果：\n\n图 15.7 \n\n```\n1 array:3 [\n2   0 => \"this\"\n3\
  \   1 => \"that\"\n4   2 => \"some thing or another\"\n5 ]\n```\n\n如果我们紧密比较**图 15.6**\
  \ 中的输入和**图 15.7** 中的输出，我们会注意到 `explode` 是区分大小写的。`explode` 方法接受第二个参数：对生成的子字符串数量的限制。默认情况下，这配置为不限制子字符串的数量，但我们可以更改此。为了演示其用法，让我们看看**图\
  \ 15.8**，我们现在限制了生成的子字符串数量：\n\n图 15.8 \n\n```\n1 <?php\n2 \n3 dd(str('this OR OR\
  \ OR thing or another')->explode('OR', 2)\n4     ->map(fn($x) => ltrim($x))\n5 \
  \    ->all());\n```\n\n这产生了图 15.9 中的数组：\n\n图 15.9 \n\n```\n1 array:2 [\n2   0 =>\
  \ \"this\"\n3   1 => \"that OR some thing or another\"\n4 ]\n```\n\n我们的输出无疑很有趣，但不总是清楚我们可以如何利用它。让我们考虑下面的\
  \ PHPDoc 注释，它记录了 `whenEndsWith` 方法（参数名后的内容是为了讨论添加的）：\n\n图 15.10 \n\n```\n1 /**\n\
  2  * 如果字符串以指定的子字符串结束，则执行指定的回调。\n3  *\n4  * @param  string|string[] $needles 针。\n\
  5  * @param  callable $callback 回调。\n6  * @param  callable|null $default 默认值，如果有。\n\
  7  * @return static\n8  */\n```\n\n假设我们想写一个简单的解析器来分析我们的 PHP 注释。在此我们将几个假设。第一个假设是注释的第一行和最后一行永远不包含实际内容，并将作为注释的开始和结束。第二个假设是每个包含内容的行在星号后总是正好有一个空格。最后，我们的最后一个假设是在类型定义中\
  \ param 或 return 关键字之后没有空格。有了这些假设，我们可以开始实现一个朴素的 PHP 注释解析器。\n\n就像我们实现 Gherkin 解析器一样，我们将从创建数据模型来表示我们解析后的注释开始。我们的解析器将非常简单，我们只致力于将注释拆分为标签列表和所有不属于标签的内容。我们将标签定义为以\
  \ `@` 字符开头的行。用于封装这种结构的 PHP 类可以在图 15.11 中找到：\n\n\n\n\n\n```php\n<?php\nclass PhpComment\n\
  {\n    /**\n     * 注释的内容。\n     *\n     * @var string\n     */\n    public string\
  \ $content = '';\n\n    /**\n     * 注释的标签。\n     *\n     * @var TagLine[]\n    \
  \ */\n    public array $tags = [];\n}\n\nclass TagLine\n{\n    /**\n     * 标签的名称。\n\
  \     *\n     * @var string\n     */\n    public string $tag = '';\n\n    /**\n\
  \     * 标签的各个部分。\n     *\n     * @var string[]\n     */\n    public array $parts\
  \ = [];\n}\n```\n\n`Figure 15.12` 包含了我们简易 PHP 解析器的实现。它之所以是简易实现，是因为它没有设置为处理更复杂的注释，例如那些在参数类型定义中包含空格的注释。\n\
  \n图 15.12 简易 PHP 注释解析器实现 \n\n```php\n<?php\nclass NaiveCommentParser\n{\n    /**\n\
  \     * 将提供的文本解析为 PhpComment 对象。\n     *\n     * @param string $comment 需要解析的文本。\n\
  \     * @return PhpComment\n     */\n    public function parse(string $comment):\
  \ PhpComment\n    {\n        $phpComment = new PhpComment();\n\n        $lines =\
  \ str($comment)->lineSplit->all();\n\n        // 移除第一行和最后行。\n        array_shift($lines);\n\
  \        array_pop($lines);\n\n        $lines = collect($lines)->map(function ($line)\
  \ {\n            // 移除开头的空格和星号。\n            return (string) str($line)->ltrim->substr(1)->ltrim;\n\
  \        })->reject(function ($line) {\n            // 移除空行。\n            return\
  \ str($line)->trim->length == 0;\n        })->values()->all();\n\n        $contentLines\
  \ = [];\n        $keywordLines = [];\n\n        for ($i = 0; $i < count($lines);\
  \ $i++) {\n            $line = $lines[$i];\n\n            if (Str::startsWith($line,\
  \ '@')) {\n                $keywordLines = array_slice($lines, $i);\n          \
  \      break;\n            }\n\n            $contentLines[] = $line;\n        }\n\
  \n        $phpComment->content = implode(\"\\n\", $contentLines);\n\n        $phpComment->tags\
  \ = collect($keywordLines)\n            ->map(function ($line) {\n             \
  \   $parts = str($line)->explode(' ', 6);\n                $tagLine = new TagLine();\n\
  \n                $tagLine->tag = $parts[0];\n                $tagLine->parts =\
  \ collect($parts)->skip(1)\n                    ->reject(function ($part) {\n  \
  \                      return str($part)->trim->length == 0;\n                 \
  \   })->all();\n\n                return $tagLine;\n            })->all();\n\n \
  \       return $phpComment;\n    }\n}\n```\n\n现在我们可以像这样使用我们的注释解析器了：\n\n图 15.13 \n\
  \n```php\n<?php\n$comment = <<<'COMMENT'\n/**\n * 如果字符串以给定的子字符串结束，则执行给回调。\n * @param\
  \ string[] $needles 针。\n * @param callable $callback 回调函数。\n * @param callable|null\
  \ $default 默认值，如果有。\n * @return static\n */\nCOMMENT;\n\n$parser = new NaiveCommentParser();\n\
  $parsedComment = $parser->parse($comment);\n```\n\n为了产生以下内容：\n\n图 15.14 \n\n```php\n\
  PhpComment {\n    content: \"如果字符串以给定的子字符串结束，则执行给回调。\",\n    tags: [\n        TagLine\
  \ {\n            tag: \"@param\",\n            parts: [\"string[]\", \"needles\"\
  ]\n        },\n        TagLine {\n            tag: \"@param\",\n            parts:\
  \ [\"callable\", \"callback\"]\n        },\n        TagLine {\n            tag:\
  \ \"@param\",\n            parts: [\"callable|null\", \"default\", \"如果有。\"]\n \
  \       },\n        TagLine {\n            tag: \"@return\",\n            parts:\
  \ [\"static\"]\n        }\n    ]\n}\n```\n\n\n\n\n虽然这些信息很有用，但 `split` 方法更令人兴奋的地方在于它与\
  \ `explode` 方法的不同之处。`split` 方法可以使用正则表达式来拆分我们的输入字符串。\n\n#### 图 15.20 链式 split 方法签名\
  \ \n\n```\n 1 <?php\n 2 \n3 use Illuminate\\Support\\Collection;\n 4 \n5 /**\n6\
  \  * Versions: Laravel 8, 9\n7  *\n8  * @return Collection\n9  */\n10 public function\
  \ split(\n11     string|int $pattern,\n12            int $limit = -1,\n13      \
  \      int $flags = 0\n14 );\n```\n\n在**图 15.20**中，我们可以看到 `split` 方法接受最多三个参数。如果我们不在第一个参数中提供整数，该方法将在内部调用\
  \ PHP 的 `preg_split` 函数。\n\n在整本书中，我们遇到过与**图 15.21** 类似的代码：\n\n#### 图 15.21 使用现有的辅助函数移除空行\n\
  \n```\n1 <?php\n2 \n3 str($text)->lineSplit->reject(function ($line) {\n4     return\
  \ str($line)->trim->length == 0;\n5 })->values()->all();\n```\n\n这段代码的意图是将输入文本拆分为单行的数组，然后移除所有空行。我们可以很快地使用\
  \ `split` 方法和 `PREG_SPLIT_NO_EMPTY` 标志来为我们消除空行：\n\n#### 图 15.22 使用 split 移除空行\n\n\
  ```\n1 <?php\n2 \n3 str($text)\n4     ->split(\"/(\\r\\n|\\n|\\r)/\", -1, PREG_SPLIT_NO_EMPTY)\n\
  5     ->all();\n```\n\n如果我们比较**图 15.21**和**图 15.22**的输出，将会发现它们返回了相同的数组：\n\n####\
  \ 图 15.23 移除空行的示例输出 \n\n```\n1 array:4 [\n2   0 => \"line one\"\n3   1 => \"line\
  \ two\"\n4   2 => \"line three\"\n5   3 => \"line four\"\n6 ]\n```\n\n### 15.3 从文档中提取\
  \ YAML Frontmatter\n\n在处理文本格式（如 Markdown）时，遇到 YAML frontmatter（YAML 元数据头部）的概念非常普遍。这些\
  \ frontmatter 文档是标准 Markdown 或类似文件的一个部分，在文件顶部嵌入了一个 YAML 文档。这通常像**图 15.24**中的示例所示：\n\
  \n#### 图 15.24 \n\n```\n1 ---\n2 title: An Unassuming Title\n3 ---\n4 \n5 This is\
  \ the content.\n6 ---\n7 This is more content.\n```\n\n从**图 15.24**中，我们可以注意到，YAML\
  \ frontmatter 通常通过包含“—”的行与文档的其他部分隔离开。将输入字符串拆分为其 YAML 元数据和内容是简单的。然而，它也足够简单，让我们可以使用它来讨论一些其他有趣的字符串拆分技术。\n\
  \n我们将查看的将字符串拆分为元数据和内容的第一个技术是我最喜欢的技巧之一，即使用正则表达式：\n\n#### 图 15.25 \n\n```\n 1 <?php\n\
  \ 2 \n3 $content = <<<CONTENT\n 4 ---\n5 title: An Unassuming Title\n6 ---\n 7 \n\
  8 This is the content.\n9 ---\n10 This is more content.\n11 CONTENT;\n12 \n13 str($content)->split(\n\
  14     \"/^---(\\r\\n|\\n\\r)/m\", 2, PREG_SPLIT_NO_EMPTY\n15 )->all();\n```\n\n\
  执行时，**图 15.25**将产生以下输出数组：\n\n#### 图 15.26 \n\n```\n 1 array:2 [\n 2   0 => \"title:\
  \ An Unassuming Title\\n\"\n 3   1 => \"\"\"\n 4     \\n\n 5     ---\\n\n 6    \
  \ The content!\\n\n 7     \\n\n 8     this \n9     \"\"\"\n10 ]\n```\n\n从这里开始，如有，我们可以对子字符串进行进一步处理。在**图\
  \ 15.25**中，我们在调用 `split` 方法时提供了 2 的限制。我们这样做是为了确保内容字符串也不会在第 6 行出现的“—”处被拆分。此外，我们的正则表达式使用了“^”锚点，它告诉引擎从行的开头开始匹配；为了使之生效，我们还必须提供多行（或“m”）修饰符。\n\
  \n另一种使用正则表达式的方法是使用带有 `PREG_OFFSET_CAPTURE` 标志的 PHP `preg_match_all` 函数：\n\n####\
  \ 图 15.27 \n\n```\n 1 <?php\n2 $content = <<<CONTENT\n3 ---\n4 title: An Unassuming\
  \ Title\n5 ---\n 6 \n7 This is the content.\n8 ---\n9 This is more content.\n10\
  \ CONTENT;\n11 \n12 preg_match_all(\n13     \"/^---(\\r\\n|\\n\\r)/m\",\n14    \
  \ $content,\n15     $matches,\n16     PREG_OFFSET_CAPTURE\n17 );\n```\n\n#### 图\
  \ 15.28 \n\n```\n1 array:2 [\n2   0 => \"title: An Unassuming Title\\n\"\n3   1\
  \ => \"\"\"\n4     \\n\n5     ---\\n\n6     The content!\\n\n7     \\n\n8     this\
  \ \n9     \"\"\"\n10 ]\n```\n\n### 15.4 解析单文件组件\n\n在本节中，我们将通过另一个利用正则表达式从输入字符串中提取信息的示例。我们将构建一个简单的解析器来拆分单文件组件，类似于\
  \ Vue.js 等前端工具使用的组件。**图 15.30** 包含了示例文档：\n\n```\n1 <style>\n2     .hero {\n3 \n\
  4     }\n5 </style>\n6 \n7 <template>\n8     <div class=\"hero\">\n9 \n10     </div>\n\
  11 </template>\n12 \n13 <script>\n14     var heroElements = document.getElementsByClassName('hero');\n\
  15 </script>\n```\n\n\n\n\n\n```\n 1 array:2 [\n 2   0 => array:2 [\n 3     0 =>\
  \ array:2 [\n 4       0 => \"<style>\"\n 5       1 => 2\n 6     ]\n 7     1 => array:2\
  \ [\n 8       0 => \"</style>\"\n 9       1 => 33\n10     ]\n 11   ]\n 12   1 =>\
  \ array:2 [\n 13     0 => array:2 [\n 14       0 => \"style\"\n 15       1 => 3\n\
  \ 16     ]\n 17     1 => array:2 [\n 18       0 => \"style\"\n 19       1 => 35\n\
  20     ]\n 21   ]\n```\n\n我们的 `$matches` 结果包含两个数组，第一个数组包含了我们匹配的完整文本，第二个数组包含了匹配到的单个标签的位置和文本。如果你注意到，第二个数组包含了标签名称，但缺少判断该标签是否为闭合标签的信息。我们的第一个数组确实收集了这些信息，但它包含了角括号，我们将避免将其剥离。在最终实现中，我们将同时使用这两个数组来获取我们想要的信息，并在我们发现意外情况时帮助生成错误消息。\n\
  \n目前，我们在**图 15.32** 中的两个子数组之间有一一对应的关系。也就是说，第一个数组的第一个元素“<style>”对应第二个数组的第一个元素“style”。在稍后遍历第二个数组时，我们可以利用这一点；如果我们正处于第二个数组中的第一个“style”，我们期望在第一个数组的第二个元素中看到它的闭合对标签，依此类推。每每当这种情况不成立时，我们就可以确定已经遇到了错误条件。作为这方面的例子，让我们考虑**图\
  \ 15.33**：\n\n图 15.33 \n\n```\n 1 <?php\n 2 \n 3 $code = <<<CODE\n 4 \n 5 <style>\n\
  \ 6     .hero {\n 7 \n 8     }\n 9 <template>\n10 CODE;\n11 \n12 preg_match_all(\n\
  13   '/^<[\\/]?(style|template|script).*>/m',\n14   $code,\n15   $matches,\n16 \
  \  PREG_OFFSET_CAPTURE\n17 );\n```\n\n它产生了以下输出：\n\n图 15.34 \n\n```\n 1 array:2 [\n\
  \ 2   0 => array:2 [\n 3     0 => array:2 [\n 4       0 => \"<style>\"\n 5     \
  \  1 => 2\n 6     ]\n 7     1 => array:2 [\n 8       0 => \"<template>\"\n 9   \
  \    1 => 33\n10     ]\n 11   ]\n 12   1 => array:2 [\n 13     0 => array:2 [\n\
  \ 14       0 => \"style\"\n 15       1 => 3\n 16     ]\n 17     1 => array:2 [\n\
  \ 18       0 => \"template\"\n 19       1 => 34\n20     ]\n 21   ]\n 22 ]\n```\n\
  \n当我们查看**图 15.34** 时，我们可以看到如果我们目前正在分析第二个数组的第一个元素，第一个数组的第二个元素现在包含了“<template>”，而不是我们预期的看到的“</style>”。这些就是我们将寻找以生成错误消息的。\n\
  \n现在我们将处理我们的单文件组件解析器。**图 15.35** 包含了我们实现的开头：\n\n图 15.35 \n\n```\n 1 <?php\n 2 \n\
  \ 3 class ParseResult\n 4 {\n 5     public $content = '';\n 6     public $type =\
  \ '';\n 7     public $startOffset = 0;\n 8     public $endOffset = 0;\n 9 }\n10\
  \ \n11 class SingleFileComponentParser\n12 {\n13 \n14     /**\n15      * 将提供的文本解析为各个组件。\n\
  16      *\n17      * @param string $value 要解析的文本。\n18      * @param array $parts\
  \ 要解析的各个。\n19      * @return array\n20      * @throws Exception\n21      */\n22\
  \     public function parse(\n23         $value,\n24         $parts = ['style',\
  \ 'template', 'script'])\n25     {\n26         // 我们稍后将用此检索行和\n27         // 列号，如果我们遇到错误的话。\n\
  28         $positionLocator = new CharacterPositionLocator($value);\n29 \n30   \
  \      // 构建一个动态正则，以匹配\n32         // 提供的任何部分。\n33         $pattern = collect($parts)\n\
  34             ->map(fn($x) => preg_quote($x))->implode('|');\n35 \n36         preg_match_all(\n\
  37             '/^<\\/.>/m',\n38             $value, $matches, PREG_OFFSET_CAPTURE\n\
  39         );\n40  \t$tagNames = $matches[1];\n41         $sourceTags = $matches[0];\n\
  42 \n43         // ...\n44         return $results;\n45     }\n46 ```\n\n在第 3-9\
  \ 行，我们定义了该类，单文件组件将被解析到其中。我们在 `$content` 中存储标签之间的内容，在 `$type` 中存储标签类型，以及以及的起始和结束偏移量。在第\
  \ 28 行，我们创建了 `CharacterPositionLocator` 的实例，我们在第 10 章开发的它。我们稍后将在遇到错误时使用它来检索行和列号。在第\
  \ 32 和 33 行，通过 `$parts` 参数构造正则表达式。我们随后在第 35-38 行使用这些结果来匹配部分。在第 40 和 41 行，`sourceTags`\
  \ 数组包含了角括号，而 `$tagNames` 数组只包含标签名称。\n\n15.36 \n\n```\n 1 <?php\n 2 \n 3 // ...\n\
  \ 4 \n 5 class SingleFileComponentParser\n 6 {\n 7\n 8     public function parse(\n\
  \ 9         $value,\n10         $parts = ['style', 'template', 'script'])\n11  \
  \   {\n12 \n13         // ...\n14 \n15         for ($i = 0; $i < count($tagNames);\
  \ $i++) {\n16             $tag = $tagNames[$i];\n17 \n18             $next = $i\
  \ + 1;\n19 \n20             if (! isset($sourceTags[$next])) {\n21             \
  \    $location = $positionLocator\n22                     ->getCharPosition($sourceTags[$i][1]);\n\
  23 \n24                 throw new Exception(\"Missing closing tag for\".\n25   \
  \                '{$tag[0]}' at line {$location->line} \"\n26                  \
  \ \"column {$location->column}\");\n27             }\n28 \n29             // ...\n\
  30         }\n31 \n32         return $results;\n33     }\n34 }\n```\n\n在**15.36**\
  \ 中，我们开始进入实际解析阶段。在第 16 行，我们引入了一个循环，遍历早早存储的所有标签名称。在第 18 行，我们计算后续标签的索引。在第 20 到 27\
  \ 行之间，我们检查是否存在匹配项；如果没有，我们就抛出一个异常。为了看到这种效果，如果我们使用以下输入调用 `parse`：\n\n15.37 \n\n```\n\
  \ 1 <?php\n 2 \n 3 $code = <<<CODE\n 4\n 5 <style>\n 6     .hero {\n 7 \n 8    \
  \ }\n 9 <template>\n10 CODE;\n11\n12 $parser = new SingleFileComponentParser();\n\
  13 $parser->parse($code);\n```\n\n我们将看到以下错误消息：\n\n15.38 \n\n```\n1 Missing closing\
  \ tag for 'style' at line 2 column 1\n```\n\n现在我们将处理**15.39** 中的第二种错误情况：当我们遇到意外的闭合标签时。\n\
  \n15.39 \n\n```\n 1 <?php\n 2 \n 3 // ...\n 4 \n 5 class SingleFileComponentParser\n\
  \ 6 {\n 7\n 8     public function parse(\n 9         $value,\n10         $parts\
  \ = ['style', 'template', 'script'])\n11     {\n12 \n13         // ...\n14 \n15\
  \         for ($i = 0; $i < count($tagNames); $i++) {\n16 \n17             // ...\n\
  18 \n19             $nextTag = $sourceTags[$next];\n20             $expected = '</'.$tag[0].'>';\n\
  21 \n22             if ($nextTag[0] != $expected) {\n23                 $location\
  \ = $positionLocator\n24                     ->getCharPosition($sourceTags[$i][1]);\n\
  25 \n26                 throw new Exception(\"Invalid closing tag \" .\n27     \
  \              \"{$nextTag[0]}' for '{$tag[0]}' at \".\n28                   \"\
  line {$location->line} column {$location->column}\");\n29             }\n30 \n31\
  \             // ...\n32         }\n33 \n34         return $results;\n35     }\n\
  36 }\n```\n\n\n\n\n\n```php\n 1 <?php\n 2 \n 3 $code = <<<CODE\n 4 \n 5 <style>\n\
  \ 6     .hero {\n 7 \n 8     }\n 9 </script>\n10 CODE;\n11 \n12 $parser = new SingleFileComponentParser();\n\
  13 $parser->parse($code);\n```\n\n抛出了此错误信息：\n\n图 15.41\n\n```\n1 Invalid closing\
  \ tag </script>' for 'style' at line 2 column 1\n```\n\n我们现在可以完成简单的单文件组件解析器了：\n\n\
  图 15.42\n\n```php\n 1 <?php\n 2 \n 3 // ...\n 4 \n 5 class SingleFileComponentParser\n\
  6 {\n 7 \n 8     public function parse(\n 9         $value,\n10         $parts =\
  \ ['style', 'template', 'script'])\n11     {\n12 \n13         // ...\n14 \n15  \
  \       for ($i = 0; $i < count($tagNames); $i++) {\n16 \n17             // ...\n\
  18 \n19             $sourceTag = $sourceTags[$i][0];\n20 \n21             $start\
  \ = $sourceTags[$i][1] + str($sourceTag)->length;\n22             $end = $nextTag[1];\n\
  23 \n24             $parseResult = new ParseResult();\n25             $parseResult->type\
  \ = $sourceTag;\n26             $parseResult->startOffset = $start;\n27        \
  \     $parseResult->endOffset = $end;\n28             $parseResult->content = str($value)\n\
  29                 ->substr($start, $end - $start)->toString();\n30 \n31       \
  \      $results[] = $parseResult;\n32 \n33             $i += 1;\n34         }\n\
  35 \n36         return $results;\n37     }\n38 }\n```\n\n第 19-22 行涉及计算我们正在解析的当前部分的起始和结束偏移量。我们的正则表达式匹配将返回匹配`beginning`\
  \ 处的偏移量，因此我们在第 21 行将带有尖括号的原始匹配长度添加到此值，以获得紧跟在标签之后的位置。当前部分的结束将是下一个标签的起始位置，我们在第 22\
  \ 行设置了它。\n\n第 24-31 行显而易见，作用是创建 `ParseResult` 的新实例并设置我们想要存储的所有值。\n\n然而，第 33 行有点奇怪。如果我们仔细思考这种方法，我们正在遍历所有的匹配项。我们将循环索引额外增加了\
  \ 1，以跳过我们刚刚分析并创建该部分的闭合标签。\n\n对整个输入调用我们的解析器：\n\n图 15.43\n\n```php\n 1 <?php\n 2 \n\
  \ 3 $code = <<<CODE\n 4 <style>\n 5     .hero {\n 6 \n 7     }\n 8 </style>\n 9\
  \ \n10 <template>\n11     <div class=\"hero\">\n12 \n13     </div>\n14 </template>\n\
  15 \n16 <script>\n17     var heroElements = document.getElementsByClassName('hero');\n\
  18 </script>\n19 CODE;\n20 \n21 $parser = new SingleFileComponentParser();\n22 $parser->parse($code);\n\
  ```\n\n产生以下结果，其中包含了我们拆出的所有不同部分：\n\n图 15.44\n\n```\n 1 [\n 2   ParseResult {\n 3\
  \     content: \"\"\"\n 4       \n 5           .hero {\n 6       \n 7          \
  \ }\n 8       \"\"\",\n 9     type: \"<style>\",\n10     startOffset: 7,\n11   \
  \  endOffset: 31,\n12   },\n13   ParseResult {\n14     content: \"\"\"\n15     \
  \  \n16           <div class=\"hero\">\n17       \n18           </div>\n19     \
  \  \"\"\",\n20     type: \"<template>\",\n21     startOffset: 53,\n22     endOffset:\
  \ 93,\n23   },\n24   ParseResult {\n25     content: \"\"\"\n26       \n27      \
  \     var heroElements = document.getElementsByClassName('hero');\n28       \"\"\
  \",\n29     type: \"<script>\",\n30     startOffset: 116,\n31     endOffset: 183,\n\
  32   },\n33 ]\n```\n\n### 15.5 使用分隔符分割包含子字符串的输入\n\n假设我们想根据 `,` 字符将以下字符串拆分为数组：\n\n\
  图 15.45\n\n```\n1 one, two, three\n```\n\n我们可以像这样使用 `explode` 辅助方法轻松地实现这一点：\n\n\
  图 15.46\n\n```php\n 1 <?php\n 2 \n 3 str('one, two, three')\n 4     ->explode(',')->all();\n\
  ```\n\n产生如下数组：\n\n图 15.47\n\n```\n1 array:3 [\n2   0 => \"one\"\n3   1 => \" two\"\
  \n4   2 => \" three\"\n5 ]\n```\n\n**图 15.47** 中的结果是我们根据示例输入预期的，但假设我们想将以下字符串：\n\n\
  图 15.48\n\n```\n1 one, two, three\",\n```\n\n拆分为此数组：\n\n图 15.49\n\n```\n1 array:3\
  \ [\n2   0 => \"one\"\n3   1 => \" two\"\n4   2 => \" three\"\n5 ]\n```\n\n在该字符串上使用\
  \ `explode` 方法产生的结果，并不是我们想要的：\n\n图 15.50\n\n```\n1 array:5 [\n2   0 => \"one\"\n\
  3   1 => \"two\"\n4   2 => \"three\",\n5   4 => \"five\"\n```\n\n如果我们仔细分析**图 15.48**\
  \ 中的字符串，就会明白 `explode` 方法不知道字符串的存在。我们需要考虑字符串内部的字符串。实现可以在**图 15.51**中找到：\n\n```php\n\
  \ 1 <?php\n 2 \n 3 $iterator = new Utf8Iterator(\n 4     'one, two, \"three\", four,\
  \ five'\n 5 );\n 6 \n 7 $results = [];\n 8 $buffer = '';\n 9 $isParsingString =\
  \ false;\n10 $stringTerminator = '';\n11 \n12 for ($i = 0; $i < count($iterator);\
  \ $i++) {\n13     $cur = $iterator[$i];\n14     $prev = null;\n15     $next = null;\n\
  16 \n17     if ($i > 0) {\n18         $prev = $iterator[$i - 1];\n19     }\n20 \n\
  21     if ($i + 1 < count($iterator)) {\n22         $next = $iterator[$i + 1];\n\
  23     }\n24 \n25     if (!$isParsingString && ($cur == '\"' || $cur == \"'\"))\n\
  26         && $prev != '\\\\') {\n27         $stringTerminator = $cur;\n28 29$isParsingString\
  \ = true;\n30         $buffer .= $cur;\n31         continue;\n32     }\n33 \n34\
  \     if ($isParsingString && $cur == $stringTerminator)\n35         && $prev !=\
  \ '\\\\') {\n36         $isParsingString = false;\n37         $buffer .= $cur;\n\
  38         continue;\n39     }\n40 \n41     if (($cur == ',' && !$isParsingString)\
  \ || $next == null) {\n42         if ($next == null) {\n43             $buffer .=\
  \ $cur;\n44         }\n45         $results[] = $buffer;\n46         $buffer = '';\n\
  47         continue;\n48     }\n49 \n50     $buffer .= $cur;\n51 }\n52 \n53 return\
  \ $results;\n```\n\n\n\n\n我们将快速跳转到第 51 行，该行将当前字符添加到我们的缓冲区字符串中。当没有发生任何特殊情况时就会到达此行；即：我们没有处理字符串的开头或结尾，也没有遇到我们的分隔符。需要注意的是，这个缓冲区将继续增长，直到我们遇到分隔符或字符串的末尾。\n\
  \n我们在第 42 行到第 49 行之间执行实际的字符串拆分。我们检查当前字符是否为 `“` 且我们没有在解析字符串，或者下一个字符是否为 `null`（这表示输入文本的结束）。如果下一个字符为\
  \ `null`，我们必须在继续执行之前，在第 44 行将其添加到当前缓冲区中。如果我们在此处没有添加当前字符，我们的输出将始终比预期结果少一个字符。第 46\
  \ 行和第 47 行将缓冲区的内容添加到 `$results` 数组中，重置缓冲区内容，然后继续迭代输入文本的剩余部分。\n\n我们的字符串检测逻辑发生在第 27\
  \ 行到第 33 行之间。如果当前字符是单引号或双引号，且上一个字符不是反斜杠（这表示是转义字符串），并且我们没有在解析字符串，我们就知道我们刚刚遇到了一个新字符串的开头。然后我们设置将要解析的字符串类型，指示我们正在解析字符串，并将双引号或单引号添加到缓冲区。\n\
  \n每当我们当前正在解析字符串时，如果我们遇到与*开始*字符串时相同的字符串终止符，且其前面没有反斜杠字符，我们就知道我们正在离开字符串。我们处理此问题的逻辑可以在第\
  \ 42 行到 49 行中找到。\n\n### 15.6 实现字符串光标系统\n\n虽然我们在**图 15.51**中的实现是有效的，并且可以扩展到处理更复杂的场景，但每次在想管理嵌套字符串时都编写此类实现将变得极其繁琐。我们将在在本节的剩余部分开发一种可重用的方法来封装这种逻辑。\n\
  \n我们构建的内容的核心概念是“光标（cursor）”。我们的光标将沿着字符串移动并“看到”当前字符以及前一个和一个字符。它们可以接受新字符并继续处理，也可以在任何想要停止处理更多文本时拒绝它。\n\
  \n我们的光标将与 `Utf8StringIterator` 协同工作。当光标移动到下一个字符时，主迭代器也将向前移动一位。这种行为允许我们在正常迭代字符串时使用光标，本质上跳过字符串的某些部分；一旦光标完成工作，我们就可以检索它的结果，我们的循环将从光标停止的地方继续。\n\
  \n这包含的内容确实非常多，所以让我们看看如何使用我们的光标主意来实现字符串拆分：\n\n图 15.52 使用光标拆分字符串\n\n```\n 1 <?php\n\
  \ 2 \n 3 $iterator = new Utf8StringIterator(\n 4     'one, two, \"three, four, five\"\
  , six, seven'\n 5 );\n 6 $cursor = new ClosureStringCursor($iterator);\n 7 $strings\
  \ = [];\n 8 \n 9 $cursor->traverseUsing(function ($cur, $prev, $next) use (&$strings)\
  \ {\n10     if ($cur == '\"') {\n11         $strings[] = $this->bufferCursorResult(\n\
  12             new StringsCursor($this->iterator())\n13         );\n14 \n15    \
  \     return;\n16     }\n17 \n18     if ($cur == ',') {\n19         return $this->clearBuffer()->continue();\n\
  20     }\n21 \n22     if ($next == ',' || $next == null) {\n23         $strings[]\
  \ = $this->flushBuffer();\n24     }\n25 });\n```\n\n当我们在**图 15.52**中的示例代码执行执行后，我们的\
  \ `$strings` 数组将包含我们在**图 15.49**中看到的五个元素。**图 15.52** 实际上有两个光标在协同工作。\n\n第一个光标是 `ClosureStringCursor`，它取代了传统的循环。`ClosureStringCursor`\
  \ 接受任何任意函数，该函数将在字符串的每个位置执行，直到它拒绝输入。光标可以在任何时候通过返回 `false` 来拒绝输入；如果函数返回 `void` 或 `true`，光标将在内部继续迭代字符串。\n\
  \n在内部，每个光标都维护一个字符串缓冲区，因此我们不需要自己管理它们。在第 18 行到第 20 行之间，我们检查当前字符是否为逗号；如果是，我们就清除光标的内部缓冲区并继续处理输入文本。清除内部缓冲区将将其内容重置为空字符串，我们每次遇到分隔符时都希望这样做，以便它不会出现在最终输出中。我们还链式了\
  \ `continue` 方法，它只需返回 `true`，以便我们的光标继续处理字符串。\n\n我们还在第 22 行到第 24 行看到一个类似的检查，它检查*下一个*字符是否为逗号或\
  \ `null`（这表示字符串的结束）。我们没有清除缓冲区，而是看到了一个新方法 `flushBuffer`，将其输出添加到 `$strings` 数组中。当我们刷新缓冲区时，光标将清除其内部缓冲区的内容并将其返回给我们。这非常有用，因为它帮助我们极大地简化了实现。\n\
  \n然而，你可能会注意到，我们这些新版本的检查并不包含避免处理字符串内部逗号的所有逻辑。这正是我们的光标主意开始变得有趣的地方。\n\n在第 10 行，我们检查当前字符是否为双引号。如果是，我们看到了对名为\
  \ `bufferResult` 方法奇奇调用。该方法接受*另一个*光标来开始处理我们的文本；在我们的示例中，它是 `StringsCursor`，包含了我们所有的逻辑。\n\
  \n为了帮助可视化光标移动其他光标（或主 `Utf8StringIterator`）的行为，让我们考虑**图 15.53**中的示例代码：\n\n图 15.53\
  \ 使用光标跳过字符串部分\n\n```\n 1 <?php\n 2 \n 3 $iterator = new Utf8StringIterator(\n 4\
  \     'one, two, \"three, four, five\", six, seven'\n 5 );\n 6 \n 7 foreach ($iterator\
  \ as $char) {\n 8     if ($char == '\"') {\n 9         echo (new StringsCursor($iterator))->traverse()->value,\
  \ \"\\n\";\n10         continue;\n11     }\n12 \n13     echo $char, \"\\n\";\n14\
  \ }\n```\n\n这产生了以下输出：\n\n**图 15.54**\n\n```\n 1 o\n 2 n\n 3 e\n 4 ,\n 5  \n6 t\n\
  \ 7 w\n 8 o\n 9 ,\n10  \n11 \"three, four, five\"\n12 ,\n13  \n14 s\n15 i\n16 x\n\
  17 ,\n18  \n19 s\n20 e\n21 v\n22 e\n23 n\n```\n\n我们在**图 15.54**的输出中可以看到一种有趣的行为。我们的主循环遍历输入文本的每个字符并将其输出到新行。然而，如果我们查看**图\
  \ 15.54**中的第 11 行，我们可以看到整个嵌套字符串单独占一行，与所有其他内容隔离开。这是因为我们的 `StringsCursor` 能够为我们提取嵌套字符串，并推进迭代器，使其能够继续处理字符串的其余部分，而不必担心光标处理的区域。\n\
  \n我们有了足够的背景信息来开始构建光标实现；它将是一个抽象实现，允许在其基础上构建其他光标实现。首先，我们将定义最终的返回类型、抽象类以及光标实现必须提供的抽象方法：\n\
  \n图 15.55 开始我们的抽象 StringCursor 实现\n\n\n\n\n```php\nphp\nclass CursorResult\n{\n\
  \    public $startPosition = 0;\n    public $endPosition = 0;\n    public $length\
  \ = 0;\n    public $value = '';\n    public $content = '';\n}\n\nabstract class\
  \ AbstractStringCursor\n{\n    /**\n     * 正在被迭代的字符串。\n     *\n     * @var Utf8StringIterator\n\
  \     */\n    protected $iterator;\n\n    // ...\n\n    public function __construct(Utf8StringIterator\
  \ $iterator)\n    {\n        $this->iterator = $iterator;\n    }\n\n    public function\
  \ iterator()\n    {\n        return $this->iterator;\n    }\n\n    // ...\n\n  \
  \  abstract public function accept(\n        $current,\n        $prev = null,\n\
  \        $next = null);\n\n    // ...\n}\n```\n\n在第 3 行到第 10 行之间，我们正在定义游标将返回的数据类型。我们的\
  \ `CursorResult` 将跟踪起始和结束位置、最终结果的长度，以及两个字符串值：`value` 和 `content`。并不是所有这些信息在每情况下都有用，但它们通常是需要的，因此我们将它们作为预期结果的一部分包含。让我们快速查看图\
  \ 15.56：\n\n图 15.56\n\n```php\nphp\n$iterator = new Utf8StringIterator(\n    'one,\
  \ two, \"three, four, five\", six, seven'\n);\n\nforeach ($iterator as $char) {\n\
  \    if ($char == '\"') {\n        $result = new StringsCursor($iterator))->traverse();\n\
  \        continue;\n    }\n}\n```\n\n当我们的代码执行时，`$result` 变量将包含以下对象：\n\n图 15.57 CursorResult\
  \ 输出示例\n\n```\nCursorResult {\n  startPosition: 10\n  endPosition: 28\n  length:\
  \ 19\n  value: \"\"three, four, five\"\"\n  content: \"three, four, five\"\n}\n\
  ```\n\n我们的游标跟踪起始和结束位置以及最终结果的长度。令人兴奋的部分是 `content` 值。它与另一个值相同，但已经为我们去除了第一个和最后一个字符。我们很有可能想要处理游标获取的内部内容，让游标为我们移除这些字符仅仅是一种便利。\n\
  \n除了定义 `CursorResult` 数据类型外，我们还开始了 `AbstractStringCursor` 的实现。目前，它只定义了一个构造函数，接受一个\
  \ `Utf8StringIterator` 实例及其相关的成员和访问器方法，以及我们抽象的 `accept` 方法。\n\n我们的抽象方法看起来应该很熟悉：它的签名包含了我们在此之前为止一直使用的三个值，用于在逐个字符迭代时对我们的文本输入做出决策。我们的抽象游标将在字符串的每个位置调用此方法，并使用其返回值来决定是否应该继续。我们现在开始编写\
  \ `traverse` 方法。\n\n图 15.58 开始实现我们的 traverse 方法\n\n```php\nphp\nabstract class AbstractStringCursor\n\
  {\n\n    // ...\n\n    protected $initialCharacter;\n\n    protected $position =\
  \ 0;\n\n    protected $index = 0;\n\n    public function traverse()\n    {\n   \
  \     $result = new CursorResult();\n\n        $lastSize = $this->iterator->lastCharSize();\n\
  \        $startPosition = $this->iterator->key();\n\n        $this->position = $startPosition;\n\
  \n        $result->startPosition = $startPosition;\n\n        $this->initialCharacter\
  \ = $this->iterator->current();\n\n        // ...\n\n        return $result;\n \
  \   }\n\n    // ...\n}\n```\n\n我们 `traverse` 方法的实现始于图 15.58。我们定义了一些额外的内部属性，将用于在游标遍历字符串时帮助维护状态。为了方便见，我们跟踪了初始字符，允许我们轻松地将后续字符与其进行比较，而无需在需要此信息的每个游标实现中重复计算。\n\
  \n`$position` 和 `$index` 值将包含类似的信息，但有不同的用途。`$position` 将跟踪较大字符串中的当前字符位置，而 `$index`\
  \ 将跟踪游标的相对位置。例如，我们在图 15.57 中的输出是从较大输入中的位置 10 开始的。然而，此时的 `$index` 应该是 0。这是因为 `$index`\
  \ 统计的是游标已经看到的字符数。\n\n第 16 行和第 29 行分别创建了 `CursorResult` 实例并返回它。我们第一段有趣的代码开始出现在第 18\
  \ 行和第 19 行。\n\n我们正在存储迭代器最后一个字符中出现的字节数以及它在输入文本中的位置。我们将在以后实现放弃游标处理的方法时使用这些信息。由于我们的游标在每次看到新字符时都会推进迭代器，如果我们需要在不执行任何实际处理的情况下提前退出游标，我们需要将其恢复到原始位置。\n\
  \n现在我们需要迭代输入文本的字符，并在每个位置调用 `accept` 方法。这涉及到我们在每个位置获取当前、下一个和上一个字符，我们已经见过几次了：\n\n\
  图 15.59 在游标内遍历输入文本\n\n```php\nphp\nabstract class AbstractStringCursor\n{\n\n  \
  \  // ...\n\n    protected $buffer = '';\n\n    public function traverse()\n   \
  \ {\n        $result = new CursorResult();\n\n        $lastSize = $this->iterator->lastCharSize();\n\
  \        $startPosition = $this->iterator->key();\n\n        $this->position = $startPosition;\n\
  \n        $result->startPosition = $startPosition;\n\n        $this->initialCharacter\
  \ = $this->iterator->current();\n\n        for ($this->position = $startPosition;\n\
  \             $this->position < count($this->iterator);\n             $this->position++)\
  \ {\n            $current = $this->iterator[$this->position];\n            $next\
  \ = null;\n            $prev = null;\n\n            if ($this->position > 0) {\n\
  \                $prev = $this->iterator[$this->position - 1];\n            }\n\n\
  \            if ($this->position + 1 < count($this->iterator)) {\n             \
  \   $next = $this->iterator[$this->position + 1];\n            }\n\n           \
  \ $this->buffer .= $current;\n\n            if ($this->accept($current, $prev, $next)\
  \ === false) {\n                $result->endPosition = $this->iterator->key();\n\
  \                $result->value = $this->buffer;\n                $result->length\
  \ = str($this->buffer)->length();\n                $result->content = str($this->buffer)->substr(1,\
  \ -1)->toString();\n                break;\n            }\n\n            $this->iterator->next();\n\
  \            $this->index += 1;\n        }\n\n        return $result;\n    }\n\n\
  \    // ...\n}\n```\n\n\n\n\n我们现在将为我们的 `AbstractStringCursor` 添加一些额外功能和实用方法。第一个功能将为光标提供一种方式，指示它没有处理任何内容，并将迭代器返回到原始位置。在抽象光标中实现此功能之前，我们需要在早在第\
  \ 1 章中开发的 `Utf8StringIterator` 中添加一个新方法：\n\n### 图 15.60 在 `Utf8StringIterator` 中添加\
  \ `setIteratorPosition` 方法\n\n```php\n 1 <?php\n 2 \n 3 class Utf8StringIterator\
  \ implements\n 4     ArrayAccess,\n 5     Countable,\n 6     Iterator\n 7 {\n 8\
  \     // ...\n 9 \n10     public function setIteratorPosition(\n11         $position,\n\
  12         $lastSize)\n13     {\n14         $this->position = $position;\n15   \
  \      $this->lastSize = $lastSize;\n16     }\n17 \n18     // ...\n19 \n20 }\n```\n\
  \n我们新定义的 `setIteratorPosition` 方法非常直观，提供了一种快速设置迭代器内部位置和最后一个字节大小的方法。我们可以用此将迭代器移动到我们想要的任何位置，而无需通过重置（rewinding）并“追赶”到目标位置。注意的是，我们必须提供最后一个字节大小和位置，以考虑到多字节字符序列。我们现在可以使用这个新方法在抽象字符串光标中实现我们的“放弃”功能：\n\
  \n### 图 15.61 实现光标放弃（Cursor Abandonment）\n\n```php\n 1 <?php\n 2 \n 3 abstract class\
  \ AbstractStringCursor\n 4 {\n 5 \n 6     // ...\n 7 \n 8     private $shouldReset\
  \ = false;\n 9 \n10     public function didNotProcess()\n11     {\n12         $this->shouldReset\
  \ = true;\n13 \n14         return false;\n15     }\n16 \n17     public function\
  \ traverse()\n18     {\n19         $result = new CursorResult();\n20 \n21      \
  \   $lastSize = $this->iterator->lastCharSize();\n22         $startPosition = $this->iterator->key();\n\
  23 \n24         $this->shouldReset = false;\n25 \n26         $this->position = $startPosition;\n\
  27 \n28         $result->startPosition = $startPosition;\n29 \n30         $this->initialCharacter\
  \ = $this->iterator->current();\n31 \n32         for ($this->position = $startPosition;\n\
  33              $this->position < count($this->iterator);\n34              $this->position++)\
  \ {\n35             $current = $this->iterator[$this->position];\n36           \
  \  $next = null;\n37             $prev = null;\n38 \n39             if ($this->position\
  \ > 0) {\n40                 $prev = $this->iterator[$this->position - 1];\n41 \
  \            }\n42 \n43             if ($this->position + 1 < count($this->iterator))\
  \ {\n44                 $next = $this->iterator[$this->position + 1];\n45      \
  \       }\n46 \n47             $this->buffer .= $current;\n48 \n49             if\
  \ ($this->accept($current, $prev, $next) === false) {\n50                 if ($this->shouldReset)\
  \ {\n51                     $this->iterator->setIteratorPosition(\n52          \
  \               $startPosition,\n53                         $lastSize\n54      \
  \               );\n55                 }\n56 \n57                 $result->endPosition\
  \ = $this->iterator->key();\n58                 $result->value = $this->buffer;\n\
  59                 $result->length = str($this->buffer)->length();\n60         \
  \        $result->content = str($this->buffer)->\n61                 substr(1, -1)->toString();\n\
  62                 break;\n63             }\n64 \n65             $this->iterator->next();\n\
  66 \n67             $this->index += 1;\n68         }\n69 \n70         return $result;\n\
  71     }\n72 \n73     // ...\n74 }\n```\n\n对于这个功能能让我们实现的操作来说，我们的修改少得惊人。如果光标调用了 `didNotProcess`\
  \ 方法，我们会设置一个内部标记，指示我们应该重置迭代器。这发生在第 50 到第 55 行之间，使用了我们新的 `setIteratorPosition` 方法。\n\
  \n放弃光标处理的想法可能显得有些晦涩。为了帮助理解这个功能，让我们来看**图 15.62**，它使用了这一功能：\n\n### 图 15.62\n\n```php\n\
  \ 1 <?php\n 2 \n 3 $iterator = new Utf8StringIterator(\n 4     'one, two, \"three,\
  \ four, five\"'\n 5 );\n 6 \n 7 $closeCursor = new ClosureStringCursor($iterator);\n\
  \ 8 \n 9 foreach ($iterator as $char) {\n10     echo \"Iterator char: \", $char,\
  \ \"\\n\";\n11     if ($char == '\"') {\n12         $closeCursor->traverseUsing(function\
  \ ($current) {\n13             echo \"    Cursor char: \", $current, \"\\n\";\n\
  14 \n15             if ($current == 'r') {\n16                 return $this->didNotProcess();\n\
  17             }\n18         });\n19     }\n20 }\n```\n\n我们的示例将遍历字符串中的字符，并在新行打印每个字符。如果我们的循环遇到了双引号，我们便会使用光标来继续遍历我们的字符串。\n\
  \n在光标内部，我们打印遇到的每个字符。然而，如果我们遇到了字符“r”，我们就会返回 `didNotProcess` 方法的结果。这样做会导致我们的光标停止处理，并将外层循环返回到它的原始位置，产生**图\
  \ 15.63** 所示的输出：\n\n### 图 15.63\n\n```text\n 1 Iterator char: o\n 2 Iterator char:\
  \ n\n 3 Iterator char: e\n 4 Iterator char: ,\n 5 Iterator char:  \n 6 Iterator\
  \ char: t\n 7 Iterator char: w\n 8 Iterator char: o\n 9 Iterator char: ,\n10 Iterator\
  \ char:  \n11 Iterator char: \"\n12     Cursor char: \"\n13     Cursor char: t\n\
  14     Cursor char: h\n15     Cursor char: r\n16 Iterator char: t\n17 Iterator char:\
  \ h\n18 Iterator char: r\n19 Iterator char: e\n20 Iterator char: e\n21 // ...\n\
  ```\n\n我们可以从**图 15.63** 中看到，我们的光标遇到了所有字符，从双引号一直到小写的“r”。然而，由于我们调用了 `didNotProcess`\
  \ 方法，我们的外层循环返回到了光标创建时的位置，并处理了相同的字符。\n\n我们将实现的下一个功能将允许我们任意移动光标通过指定数量的字符并跳过任意数量的字符。这两个功能听起来相似，实现方式也相似。这两个之间的关键区别在于，移动光标仍然会将过的每个字符追加到我们的内部缓冲区中，而跳过字符则*不会*将字符追加到缓冲区。\n\
  \n### 图 15.64 实现字符跳过方法\n\n\n\n\n\n```php\n<?php\n\nabstract class AbstractStringCursor\n\
  {\n    // ...\n\n    private $advanceCount = null;\n\n    public function advance($count)\n\
  \    {\n        $this->advanceCount = $count;\n\n        return $this;\n    }\n\n\
  \    public function skip($count)\n    {\n        $this->position += $count;\n \
  \       $this->index += $count;\n\n        for ($i = 0; $i < $count; $i++) {\n \
  \           $this->iterator->next();\n        }\n\n        return $this;\n    }\n\
  \n    public function traverse()\n    {\n        $result = new CursorResult();\n\
  \n        $lastSize = $this->iterator->lastCharSize();\n        $startPosition =\
  \ $this->iterator->key();\n\n        $this->shouldReset = false;\n        $this->advanceCount\
  \ = null;\n\n        $this->position = $startPosition;\n\n        $result->startPosition\
  \ = $startPosition;\n\n        $this->initialCharacter = $this->iterator->current();\n\
  \n        for ($this->position = $startPosition;\n             $this->position <\
  \ count($this->iterator);\n             $this->position++) {\n            $current\
  \ = $this->iterator[$this->position];\n            $next = null;\n            $prev\
  \ = null;\n\n            if ($this->position > 0) {\n                $prev = $this->iterator[$this->position\
  \ - 1];\n            }\n\n            if ($this->position + 1 < count($this->iterator))\
  \ {\n                $next = $this->iterator[$this->position + 1];\n           \
  \ }\n\n            $this->buffer .= $current;\n\n            if ($this->accept($current,\
  \ $prev, $next) === false) {\n                if ($this->shouldReset) {\n      \
  \              $this->iterator->setIteratorPosition(\n                        $startPosition,\n\
  \                        $lastSize\n                    );\n                }\n\n\
  \                $result->endPosition = $this->iterator->key();\n              \
  \  $result->value = $this->buffer;\n                $result->length = str($this->buffer)->length();\n\
  \                $result->content = str($this->buffer)->\n                substr(1,\
  \ -1)->toString();\n                break;\n            }\n\n            if ($this->advanceCount\
  \ != null) {\n                for ($j = 0; $j < $this->advanceCount; $j++) {\n \
  \                   $this->iterator->next();\n                    $cur = $this->iterator->current();\n\
  \                    $this->buffer .= $cur;\n                }\n\n             \
  \   $this->position  += $this->advanceCount;\n                $this->index += $this->advanceCount;\n\
  \                $this->advanceCount = null;\n\n                continue;\n    \
  \        }\n\n            $this->iterator->next();\n\n            $this->index +=\
  \ 1;\n        }\n\n        return $result;\n    }\n\n    // ...\n}\n```\n\n\n\n\n\
  ```php\n 1 <?php\n 2 \n 3 $iterator = new Utf8StringIterator(\n 4     'one, two,\
  \ \"three\"'\n 5 );\n 6 \n 7 $closeCursor = new ClosureStringCursor($iterator);\n\
  \ 8 \n 9 foreach ($iterator as $char) {\n10     if ($char == '\"') {\n11       \
  \  $result = $closeCursor->traverseUsing(function ($current) {\n12             if\
  \ ($current == '\"' && $this->index > 0) {\n13                 return false;\n14\
  \             }\n15         });\n16     }\n17 }\n```\n\n然而，如果你遇到这段代码并不完全清楚正在发生什么，起初可能会有些困惑。我们可以将其重构，以使用我们的\
  \ `break()` 方法，它更接近后台正在发生的迭代过程：\n\n图 15.71\n\n```php\n 1 <?php\n 2 \n 3 $iterator\
  \ = new Utf8StringIterator(\n 4     'one, two, \"three\"'\n 5 );\n 6 \n 7 $closeCursor\
  \ = new ClosureStringCursor($iterator);\n 8 \n 9 foreach ($iterator as $char) {\n\
  10     if ($char == '\"') {\n11         $result = $closeCursor->traverseUsing(function\
  \ ($current) {\n12             if ($current == '\"' && $this->index > 0) {\n13 \
  \                return false;\n14                 return $this->break();\n15  \
  \           }\n16         });\n17     }\n18 }\n```\n\n我们现在处理最后一个工具方法，我认为它是最有用的。这个工具方法允许我们将另一个游标的内容注入到当前游标的缓冲区中。这是一个有益的行为；如果你记得，每个游标都会将当前迭代与其他所有内容隔离开。这种行为允许我们创建高度可重用的游标实现并对其进行嵌套。\n\
  \n图 15.72 实现 `bufferCursorResult` 工具方法\n\n```php\n 1 <?php\n 2 \n 3 abstract class\
  \ AbstractStringCursor\n 4 {\n 5 \n 6     // ...\n 7 \n 8     public function bufferCursorResult(\n\
  \ 9         AbstractStringCursor $cursor)\n10     {\n11         $result = $cursor->traverse();\n\
  12         $this->popBuffer();\n13         $this->append($result->value);\n 14 \n\
  15         $bufferContents = $this->flushBuffer();\n16         $this->position +=\
  \ $result->length - 1;\n 17 \n18         return $bufferContents;\n19     }\n 20\
  \ \n21     // ...\n22 }\n```\n\n我们的新 `bufferCursorResult` 方法主要是我们提供的一种避免执行添加另一个游标内容所需的所有单独操作的方法。我们在第\
  \ 11 行做的第一件事是获取我们感兴趣的游标的结果。\n\n然后，在第 12 行，我们使用 `popBuffer()` 方法移除当前缓冲区的最后一个字符。记住，游标始终包含它们开始时的那个字符，这对应于“父级”游标的最后一个字符。\n\
  \n这种行为允许我们创建高度可重用的游标实现并对其进行嵌套。\n\n（注：原文中存在大量重复段落，此处已根据逻辑去重并完成翻译）\n\n### 15.73 重置游标\n\
  \n```php\n 1 <?php\n 2 \n 3 abstract class AbstractStringCursor\n 4 {\n 5 \n 6 \
  \    // ...\n 7 \n 8     public function bufferCursorResult(\n 9         AbstractStringCursor\
  \ $cursor)\n10     {\n11         $result = $cursor->traverse();\n12         $this->popBuffer();\n\
  13         $this->append($result->value);\n 14 \n15         $bufferContents = $this->flushBuffer();\n\
  16         $this->position += $result->length - 1;\n 17 \n18         return $bufferContents;\n\
  19     }\n 20 \n21     // ...\n22 }\n```\n\n### 15.74 实现 `StringsCursor`\n\n###\
  \ 15.8 实现 `StringsCursor`\n\n### 15.7 实现 `ClosureStringCursor`\n\n\n\n\n\n```\n\
  \ 1 [\n 2   [\n 3     0 => 394,\n 4     1 => \"<?php\\n\",\n 5     2 => 1,\n 6 \
  \    \"name\" => \"T_OPEN_TAG\",\n 7   ],\n 8   [\n 9     0 => 317,\n10     1 =>\
  \ \"$value\",\n11     2 => 2,\n12     \"name\" => \"T_VARIABLE\",\n13   ],\n 14\
  \   [\n 15     0 => 397,\n16     1 => \" \",\n17     2 => 2,\n18     \"name\" =>\
  \ \"T_WHITESPACE\",\n19   ],\n 20   =\",\n 21   [\n 22     0 => 397,\n 23     1\
  \ => \" \",\n 24     2 => 2,\n 25     \"name\" => \"T_WHITESPACE\",\n 26   ],\n\
  \ 27   [\n 28     0 => 311,\n 29     1 => \"5\",\n 30     2 => 2,\n 31     \"name\"\
  \ => \"T_LNUMBER\",\n 32   ],\n 33   [\n 34     0 => 397,\n 35     1 => \" \",\n\
  \ 36     2 => 2,\n 37     \"name\" => \"T_WHITESPACE\",\n 38   ],\n 39   \"+\",\n\
  \ 40   [\n 41     0 => 397,\n 42     1 => \" \",\n 43     2 => 2,\n 44     \"name\"\
  \ => \"T_WHITESPACE\",\n 45   ],\n 46   \"(\",\n 47   [\n 48     0 => 311,\n 49\
  \     1 => \"532_323\",\n 50     2 => 2,\n 51     \"name\" => \"T_LNUMBER\",\n 52\
  \   ],\n 53   \")\",\n 54   [\n 55     0 => 397,\n 56     1 => \" \",\n 57     2\
  \ => 2,\n 58     \"name\" => \"T_WHITESPACE\",\n 59   ],\n 60   \"-\",\n 61   [\n\
  \ 62     0 => 397,\n 63     1 => \" \",\n 64     2 => 2,\n 65     \"name\" => \"\
  T_WHITESPACE\",\n 66   ],\n 67   [\n 68     0 => 317,\n 69     1 => \"$total\",\n\
  \ 70     2 => 2,\n 71     \"name\" => \"T_VARIABLE\",\n 72   ],\n 73   \";\",\n\
  \ 74 ]\n```\n\n我们生成的数组中的每个元素都对应输入文本的某些。例如，第二个元素对应于第 2 行的 `$value` 变量。在我们所有嵌套数组中，第一个值包含令牌标识符（token\
  \ identifier），第二个值包含匹配的内容，第三个值包含令牌所在的行号。我们还可以看到，像 `+` 和 `=` 这样的值被直接添加到我们的输出数组中，而不包含任何额外信息。\n\
  \n我们将尝试使用我们的光标（cursor）概念来实现一个返回相同数组的函数。需要注意的是，我们并不会编写一个完整的 PHP 词法器（lexer），只需实现能够匹配**图\
  \ 15.77** 中输出的内容即可。我们将进行的第一个光标实现是 `VariableCursor`，我们将用它来迭代遍历 PHP 变量：\n\n图 15.78\
  \ VariableCursor 实现 \n\n```\n 1 <?php\n 2 \n 3 class VariableCursor extends AbstractStringCursor\n\
  \ 4 {\n 5 \n 6     protected function isValidChar($char)\n 7     {\n 8         return\
  \ ctype_alnum($char) || $char == '_';\n 9     }\n10 \n11     public function accept($current,\
  \ $prev = null, $next = null)\n 12     {\n 13         if (! $this->isValidChar($next))\
  \ {\n 14             return $this->break();\n 15         }\n 16 \n 17         return\
  \ $this->continue();\n 18     }\n 19 }\n```\n\n由于我们的光标总是*从*一个有效字符开始，我们可以通过检查光标可用的*下一个*字符是否有效来轻松检测\
  \ PHP 变量的结束。我们的实现允许字母数字以及下划线字符。\n\n我们的下一个光标是 `NumberCursor`，它将遍历 PHP 数值值：\n\n图 15.79\
  \ NumberCursor 实现 \n\n```\n 1 <?php\n 2 \n 3 class NumberCursor extends  AbstractStringCursor\n\
  \ 4 {\n 5     protected function isValidChar($char)\n 6     {\n 7         if ($char\
  \ == '.' || $char == '_') {\n 8             return true;\n 9         }\n10     \
  \    if (! ctype_digit($char) || ctype_punct($char)) {\n 11             return false;\n\
  \ 12         }\n 13 \n 14         return true;\n 15     }\n 16 \n 17     public\
  \ function accept($current, $prev = null, $next = null)\n 18     {\n 19        \
  \ return $this->isValidChar($next);\n 20 }\n```\n\n在迭代输入文本之前，最后一个实现的光标将是 `OpenTagCursor`：\n\
  \n图 15.80 OpenTagCursor 实现\n\n```\n 1 <?php\n 2\n 3 class OpenTagCursor extends\
  \ AbstractStringCursor\n 4 {\n 5     public function accept($current, $prev = null,\
  \ $next = null)\n 6     {\n 7         if (str($this->buffer)->startsWith('<?php'))\
  \ {\n 8             if (! ctype_space($next)) {\n 9                 return $this->break();\n\
  \ 10             }\n 11         }\n 12 \n 13         return $this->continue();\n\
  \ 14     }\n```\n\n如果我们花时间看一下**图 15.80**，可以看到第 7 行正在检查当前缓冲区是否以 `<?php` 开始。由于每个光标都有自己的缓冲区，我们可以检查它来判断是否已经移动过了标签。如果我们已经移动过标签且下一个字符不是空格，则在第\
  \ 9 行返回 `false`。这样做是为了获得与 PHP 的 `token_get_all` 函数相同的标签输出。\n\n使用这些简单的光标实现，我们可以轻松地编写一个循环，产生与**图\
  \ 15.77** 相同的输出：\n\n图 15.81 简单词法器\n\n```\n 1 <?php\n 2\n 3 $code = <<PHP'\n 4 <?php\n\
  \ 5 $value = 5 + (532_323) - $total;\n 6 PHP;\n 7 \n 8 $string         = new UtfStringIterator($code);\n\
  \ 9 $locator        = new CharacterPosition($code);\n 10 $variableCursor = new VariableCursor($string);\n\
  \ 11 $numberCursor   = new NumberCursor($string);\n 12 \n 13 $tokens = [];\n 14\
  \ $symbols = ['=', ')', ';'];\n 15 \n 16 function makeTokenArray($locator, $result,\
  \ $tokenType) {\n 17     return [\n 18         $tokenType,\n 19         $result->value,\n\
  \ 20         $locator->getLineNumber($result->startPosition),\n 21         token_name($tokenType)\n\
  \ 22     ];\n 23 }\n 24 foreach ($string as $char) {\n 25     if ($char == '<' &&\
  \ str($string)->substr($string->key(), 5)) {\n 26         $result = (new OpenTagCursor($string))->traverse();\n\
  \ 27 \n 28         $tokens[] = makeTokenArray(\n 29             $locator,\n 30 \
  \            $result,\n 31             T_OPEN_TAG\n 32         );\n 33         continue;\n\
  \ 34     }\n 35 \n 36     if (in_array($char, $symbols)) {\n 37         $tokens[]\
  \ = $char;\n 38         continue;\n 39     }\n 40 \n 41     if (ctype_space($char))\
  \ {\n 42         $tokens[] = [\n 43             T_WHITESPACE,\n 44             $char,\n\
  \ 45             $locator->getLineNumber($string->key()),\n 46             token_name(T_WHITESPACE)\n\
  \ 47         ];\n 48 \n 49         continue;\n 50     }\n 51 \n 52     if (ctype_digit($char))\
  \ {\n 53         $result = $numberCursor->traverse();\n 54 \n 55         $tokens[]\
  \ = makeTokenArray(\n 56             $locator,\n 57             $result,\n 58  \
  \           T_LNUMBER\n 59         );\n 60 \n 61         continue;\n 62     }\n\
  \ 63 \n 64     if ($char == '$') {\n 65         $result = $variableCursor->traverse();\n\
  \ 66 \n 67         $tokens[] = makeTokenArray(\n 68             $locator,\n 69 \
  \            $result,\n 70             T_VARIABLE\n 71         );\n 72         continue;\n\
  \ 73     }\n 74 }\n```\n\n我们实现的大部分内容应该让人很熟悉，因为我们使用了相同的模式：检查当前字符看起来像我们感兴趣的内容。如果是，我们就调用相应的光标并将其结果添加到我们的\
  \ `$tokens` 数组中。\n\n我们的 `makeTokenArray` 辅助函数存在是为了让我们轻松创建与**图 15.77** 输出匹配的数组，但它对我们的实现并不是严格必要的。\n\
  \n**图 15.81** 中的新技术是第 26 行正在发生的操作。当当前字符为 `<` 时，我们从迭代器的当前位置从输入获取一个子字符串。我们的子字符串包含五个字符，如果\
  \ PHP 标签存在，它将覆盖整个标签。这就是我们的实现如何区分 `<` 是标签的一部分而不是小于运算符的方法。还有其他方法可以实现这一点，但这种方法适用于我们的简单实现。\n\
  \n如果我们运行代码并比较我们简单词法器实现的结果，我们会发现它确实与**图 15.77**中的结果匹配。如果有足够的时间和耐心，我们可以继续使用这种方法最终编写出整个\
  \ PHP 词法器。\n\n### 15.10 处理 SQL 风格字符串\n\n考虑**图 15.82** 中的示例 SQL 查询。假设我们要提取它内部所有的字符串。这些值从文本中提取要稍微困难一些，因为它们主要使用两个字符串分隔符字符作为转义序列。\n\
  \n图 15.82 示例 SQL 查询 \n\n\n\n\n\n```\n1 SELECT * FROM companies WHERE name = 'Jim''s\
  \ Tackle Shop'\n2 OR name = 'Bob''s Burger'\n```\n\n我们也可以使用我们的游标（cursor）概念来解决这个问题，这将涉及使用我们的一些实用方法。基本过程与处理\
  \ PHP 风格的双引号或单引号字符串类似，但我们需要检查*下一个*字符是否为单引号，而不是上一个字符。这种实现可以在**图 15.83**中找到：\n\n###\
  \ 图 15.83 SqlStringsCursor 实现\n\n```php\n 1 <?php\n 2 \n3 class SqlStringsCursor\
  \ extends AbstractStringCursor\n4 {\n 5     public function accept($current, $prev\
  \ = null, $next = null)\n6     {\n 7         if ($this->index > 0 && $current ==\
  \ \"'\") {\n8             if ($next == \"'\") {\n9                 return $this->advance(1)->continue();\n\
  10             }\n11 \n12             return $this->skip(1)->break();\n13      \
  \   }\n14 \n15         return $this->continue();\n16     }\n17 }\n```\n\n在第 8 行和第\
  \ 10 行之间，我们检查输入文本中的下一个字符是否为单引号字符串，这表示我们正在开始一个 SQL 风格的字符串转义序列。然后调用 `advance` 方法并继续处理输入文本。记住\
  \ `advance` 方法将移动指定数量的字符并将字符添加到游标的内部缓冲区。\n\n当我们将游标停在第 12 行时，我们会跳过当前字符，这样它就不会重复并退出游标。\n\
  \n我们可以这样使用我们新定义的游标：\n\n### 图 15.84 \n\n```php\n 1 <?php\n 2 \n3 $sql = <<<'SQL'\n\
  4 SELECT * FROM companies WHERE name = 'Jim''s Tackle Shop'\n5 OR name = 'Bob''s\
  \ Burger'a\n6 SQL;\n7 \n8 $string = new Utf8StringIterator($sql);\n9 $sqlStringCursor\
  \ = new SqlStringsCursor($string);\n10 \n11 \n12 $strings = [];\n13 \n14 foreach\
  \ ($string as $char) {\n15     if ($char == \"'\") {\n16         $result = $sqlStringCursor->traverse();\n\
  17 \n18         $strings[] = $result->value;\n19         continue;\n20     }\n21\
  \ }\n```\n\n在**图 15.84** 执行后，我们的 `$strings` 数组将包含以下值：\n\n### 图 15.85 \n\n```text\n\
  1 array:2 [\n2   0 => \"'Jim''s Tackle Shop'\"\n3   1 => \"'Bob''s Burger'\"\n4\
  \ ]\n```\n\n虽然我们的结果已经相当令人印象深刻了，但我们可以更进一步来探索一些额外的用例。到目前为止，我们总是提取游标结果或将其收集在列表中以便进一步检查。然而，我们也可以使用游标有效所在替换输入文本中的值，并简单地忽略它们的结果：\n\
  \n### 图 15.86 \n\n```php\n 1 <?php\n 2 \n3 $sql = <<<'SQL'\n4 SELECT * FROM companies\
  \ WHERE name = 'Jim''s Tackle Shop'\n5 OR name = 'Bob''s Burger'\n6 SQL;\n7 \n8\
  \ $string = new Utf8StringIterator($sql);\n9 $sqlStringCursor = new SqlStringsCursor($string);\n\
  10 \n11 \n12 $newString = '';\n13 \n14 foreach ($string as $char) {\n15     if ($char\
  \ == \"'\") {\n16         $result = $sqlStringCursor->traverse();\n17     \n18 \
  \        $newString .= '?';\n19         continue;\n20     }\n21 \n22     $newString\
  \ .= $char;\n23 }\n```\n\n现在我们的结果将是，所有的 SQL 字符串都被替换为“?”字符：\n\n### 图 15.87 \n\n```text\n\
  1 SELECT * FROM companies WHERE name = ?\n2 OR name = ?\n```\n\n### 15.11 分割包含成对括号的字符串\n\
  \n假设我们有**图 15.88**中提供的输入文本：\n\n### 图 15.88 \n\n```text\n1 ($one, $two, ($string\
  \ .\")\" )), $three, hello,\n2 \"(this\", \"that )\", $end($one, ($two))\n```\n\n\
  并想将其分割为**图 15.89**中的字符串数组：\n\n### 图 15.89 \n\n```text\n 1 array:6 [\n2   0 => \"\
  ($one, $two, ($string .\")\" ))\"\n3   1 => \" $three\"\n4   2 => \" hello\"\n5\
  \   3 => \"\"\"\n6     \n7     \"(this\"\n8     \"\"\"\n9   4 => \" \"that )\"\"\
  \n10   5 => \" $end($one, ($two))\"\n11 ]\n```\n\n然而，如果整个输入文本像**图 15.90**一样被圆括号环围：\n\
  \n### 图 15.90 \n\n```text\n1 (($one, $two, ($string .\")\" )), $three, hello,\n\
  2 \"(this\", \"that )\", $end($one, ($two)))\n```\n\n我们希望产生一个包含 `图 15.90` 结果的数组：\n\
  \n### 15.91\n\n```text\n1 array:\n2   0 => \"($one, $two, ($string .\")\" ))\"\n\
  3   1 => \" $three\"\n4   2 => \" hello\"\n5   3 => \"\"\"\n6     \n7     \"(this\"\
  \n8     \"\"\"\n9   4 => \" \"that )\"\"\n10   5 => \" $end($one, ($two))\"\n11\
  \ ]\n```\n\n### 15.92 PairedBracketCursor\n\n```php\n 1 <?php\n 2 \n3 class PairedBracketCursor\
  \ extends AbstractStringCursor\n4 {\n 5     private $closingBracket = '';\n6   \
  \  private $openingBracket = '';\n7     private $pairCount = 0;\n8 \n9     public\
  \ function __construct(\n10         $iterator,\n11         $openingBracket,\n12\
  \         $closingBracket\n13     )\n14     {\n15         parent::__construct($iterator);\n\
  16         $this->openingBracket = $openingBracket;\n17         $this->closingBracket\
  \ = $closingBracket;\n18     }\n19 \n20 \n21     public function accept($current,\
  \ $prev = null, $next = null)\n22     {\n22         if ($current == '\"' || $current\
  \ == \"'\") {\n24             $this->bufferCursorResult(\n25                 new\
  \ StringsCursor($this->iterator)\n26             );\n27 \n28             return\
  \ $this->continue();\n29         }\n30 \n31         if ($this->index == 0 || $current\
  \ == $this->openingBracket) {\n32             $this->pairCount += 1;\n33       \
  \      \n34             return $this->continue();\n35         }\n36 \n37       \
  \  if ($current == $this->closingBracket) {\n38             $this->pairCount -=\
  \ 1;\n39 \n40             if ($this->pairCount == 0) {\n41                 return\
  \ $this->break();\n42             }\n43         }\n44 \n45         return $this->continue();\n\
  46     }\n47 }\n```\n\n### 图 15.93 \n\n```php\n 1 <?php\n 2 \n3 $input = <<<'INPUT'\n\
  4 ($one, $two, ($string . \")\" )), \"(this)\", (that)\n5 INPUT;\n6 \n7 $string\
  \ = new Utf8StringIterator($input);\n8 $cursor = new ClosureStringCursor($string);\n\
  9 \n10 $pairs = [];\n11 \n12 $cursor->traverseUsing(function ($cur, $prev, $next)\
  \ use (&$pairs) {\n13     if ($cur == '(') {\n14         $this->flushBuffer();\n\
  15         $result = $this->bufferCursorResult(\n16             new PairedBracketCursor(\n\
  17                 $this->iterator(), '(', ')'\n18             )\n19         );\n\
  20 \n21         $pairs[] = $result;\n22     }\n23 });\n```\n\n我们的示例生成了以下输出：\n\n\
  ### 图 15.94 \n\n\n\n\n\n```\n1 array:3 [\n2   0 => \"($one, $two, ($string . \"\
  )\" ))\"\n3   1 => \"(this)\"\n4   2 => \"(that)\"\n ]\n```\n\n需要注意的一点（我们可以在 `Figure\
  \ 15.93` 的第 17 行看到）是在创建光标（cursor）时需要提供起始和结束括号的样式。这允许我们将新创建的光标重用于角括号、方括号或任何其他的字符组合（只要它们不是同一个字符）。\n\
  \n到本章为止，我们一直以内联方式使用光标，而没有用它们创建过任何更实质的内容。为了实现我们能够识别成对括号的字符串分割器，除了子字符串外，我们会将此逻辑封装到自己的类中，这将使其在未来处理起来更加方便：\n\
  \n### 图 15.95 CommaStringSplitter 实现\n\n```php\n 1 <?php\n 2 \n3 class CommaStringSplitter\
  \ extends AbstractStringCursor\n4 {\n 5     protected $current = '';\n 6     protected\
  \ $prev = null;\n 7     protected $next = null;\n 8     protected $strings = [];\n\
  \ 9\n10     protected function nextIsNull()\n11     {\n 12         return $this->next\
  \ == null ||\n13             $this->iterator->key() == $this->iterator->count()\
  \ - 1;\n14     }\n15 \n16     public function continue()\n17     {\n 18        \
  \ if ($this->nextIsNull()) {\n19             $this->strings[] = $this->flushBuffer();\n\
  20             return false;\n21         }\n22 \n23         return true;\n24   \
  \  }\n25 \n26     public function accept($current, $prev = null, $next = null)\n\
  27     {\n 28         $this->current = $current;\n29         $this->prev = $prev;\n\
  30         $this->next = $next;\n31 \n32         if ($current == '(') {\n33    \
  \         return $this->append($this->bufferCursorResult(\n34                 new\
  \ PairedBracketCursor(\n35                     $this->iterator, '(', ')'\n36   \
  \              )\n37             ))->continue();\n38         }\n39 \n40        \
  \ if ($current == '\"' || $current == \"'\") {\n41             return $this->append($this->bufferCursorResult(\n\
  42                 new StringsCursor($this->iterator)\n43             ))->continue();\n\
  44         }\n45 \n46         if ($current == ',') {\n47             $this->strings[]\
  \ = $this->popBuffer()->flushBuffer();\n48         }\n49 \n50         return $this->continue();\n\
  51     }\n52 \n53     public function getStrings()\n54     {\n55         return\
  \ $this->strings;\n56     }\n57 }\n```\n\n我们在 `Figure 15.95` 中的实现与我们之前看到的类似，但发生了一些值得注意且令人兴奋的事情。在这个例子中，我们做的第一个不同点是重写了\
  \ `continue` 方法。\n\n重写 `continue` 方法允许我们将决定是否分割字符串的逻辑移动到一个中心位置。这防止了我们将其包含在每个光标的末尾，否则很快很快很快就会变得难以推理。我们还看到在该方法内部调用了一个新的\
  \ `nextIsNull` 方法。\n\n由于我们的光标会推进主 `Utf8Iterator`，在嵌套光标结束后，我们可能正处于字符串的末尾。我们可以通过检查迭代器的\
  \ key 是否小于输入的长度来考虑这种情况，我们在第 13 行就是执行了这一点。\n\n我们现在可以这样使用我们新的 `CommaStringSplitter`\
  \ 实现：\n\n### 图 15.96\n\n```php\n 1 <?php\n 2 \n3 $input = <<<'INPUT'\n4 ($one, $two,\
  \ ($string .\") )), $three, $four,\n5 \"(five\", \"six )\", seven($one, ($two)),\
  \ eight,\n6 nine($ten, $eleven)\n7 INPUT;\n 8 \n9 $string = new Utf8Iterator($input);\n\
  10 $stringSplitter = new CommaStringSplitter($string);\n11 \n12 $stringSplitter->traverse();\n\
  13 \n14 $strings = $stringSplitter->getStrings();\n```\n\n以产生以下结果：\n\n### 图 15.97\n\
  \n```\n1 array:8 [\n2   0 => \"($one, $two, ($string .\") ))\"\n3   1 => \"three\"\
  \n4   2 => \"four\"\n5   3 => \"\"\"\n6     \\r\\n\n7     \"(five\"\n8     \"\"\"\
  \n9   4 => \"six )\"\n10   5 => \"seven($one, ($two))\"\n11   6 => \"eight\"\n12\
  \   7 => \"\"\"\n13     \\r\\n\n14     nine($ten, $eleven)\n15     \"\"\"\n16 ]\n\
  ```\n\n## 16. 应用技术：一个 Blade 验证器\n\n在整个章节中，我们将应用书中目前讨论过的许多概念和技术来开发一个 Blade 验证系统。我们的验证器将只关注指令（directives）及其参数，这些限制将允许我们采取一些捷径，并极大地简化我们的验证器。与其在首先深入研究验证器，不如让我们花些时间探索我们想要检测的一些情况。\n\
  \n我们将检测的主要问题组与指令参数有关。第一个是指令缺少必要的参数组，以及在不应该有参数组的地方出现了参数组。一个例子在 `Figure 16.1` 中，其中\
  \ `@foreach` 指令缺少了它所有的参数组，而 `@endforeach` 指令在不需要的地方有一个参数组：\n\n### 图 16.1\n\n```\n\
  1 @foreach\n2\n3 @endforeach ($users as $user)\n```\n\n我们将检测的下一种类型的问题是参数组在指令名称的下一行开始，这会导致模板编译时产生无效的\
  \ PHP 代码：\n\n### 图 16.2\n\n```\n1 @if\n2     (5 > 3)\n3 \n4 @endif\n```\n\n第三，我们还将提供强制指令名称大小写的方法，以及指令与其参数组之间的空格：\n\
  \n### 图 16.3\n\n```\n1 @FOREACH     ($users as $user)\n2 \n3\n4 @ENDFACH\n```\n\n\
  承认，最后一组要验证的项目并不一定会产生编译器错误，但它们将为我们的验证器提供一些趣味机会。\n\n我们现在需要开始思考解析什么。虽然我们的最终目标是验证 Blade\
  \ 指令，但在开始编写解析器之前，我们需要考虑几个潜在问题。例如，`Figure 16.4` 提供了一个示例 Blade 模板，它混合了原始 PHP 块、Blade\
  \ 注释、某些原始（verbatim）块以及 PHP 代码：\n\n### 图 16.4 Blade 复杂度示例\n\n```\n1 @foreach\n2\n\
  3 @endforeach\n4\n5     {{-- @foreach --}}\n6 \n7 <?php echo 'some php @code'; ?>\n\
  8 \n9 @php\n10 $total = $quantity * $unitCost;\n11 @endphp\n12 \n13 @verbatim\n\
  14 \n15     @foreach\n16 \n17     @endforeach\n18 \n19     {{-- @foreach --}}\n\
  20 \n21     <?php echo 'some php @code'; ?>\n22 \n23 @endverbatim\n24 \n25 @CAN\n\
  26 \n27 @endCan\n```\n\n这些结构对于任何想要解析 Blade 模板并理解每个结构与其他之间关系的 Blade 解析器来说，都会增加巨大的复杂度。如果我们编写一个\
  \ Blade 代码格式化器，我们需要管理这些复杂性。幸运的是，我们决定只解析和验证指令，因此我们可以简单地移除 Blade 注释、verbatim 和原始 PHP\
  \ 块。\n\n如果我们查看 Blade 编译器的源代码，我们会发现它内部按照 verbatim 块、PHP 块和注释的顺序进行处理。对于 verbatim 和\
  \ PHP 块，它会将它们替换为一个内部标识符，而注释被简单地替换为空字符串。我们可以实验一下从我们的模板中移除所有这些结构需要什么。\n\n### 图 16.5\
  \ 从文本中移除 Blade 结构\n\n\n\n\n\n```php\n<?php\n\n$blade = <<<'BLADE'\n\n@foreach\n\n\
  @endforeach\n\n    {{-- @foreach --}}\n\n<?php echo 'some php @code'; ?>\n\n@php\n\
  $total = $quantity * $unitCost;\n@endphp\n\n@verbatim\n\n    @foreach\n\n    @endforeach\n\
  \n    {{-- @foreach --}}\n\n    <?php echo 'some php @code'; ?>\n\n@endverbatim\n\
  \n@CAN\n\n@endCan\nBLADE;\n\n//移除任何 Verbatim 块的内容。\n$blade = preg_replace_callback(\n\
  \    '/(?<!@)@verbatim(.*?)@endverbatim/s',\n    function ($matches) {\n       \
  \ return '';\n    }, $blade\n);\n\n//移除任何 PHP 块的内容。\n$blade = preg_replace_callback(\n\
  \    '/(?<!@)@php(.*?)@endphp/s',\n    function ($matches) {\n        return '';\n\
  \    }, $blade\n);\n\n//移除任何 Blade 注释的内容。\n$blade = preg_replace_callback(\n   \
  \ '/{{--(.*?)--}}/s',\n    function ($matches) {\n        return '';\n    }, $blade\n\
  );\n```\n\n\n\n\n\n`prepareInput` 方法将接收一个输入模板字符串，并确保所有换行符一致，同时移除我们不感兴趣的 Blade 特性。该方法最终由\
  \ `parse` 方法调用，而该方法目前大部分是空的。\n\n在真正开始处理验证器的解析器之前，我们需要解决的下一个挑战是如何处理嵌入在模板中的 PHP。如果我们查看**图\
  \ 16.10**，我们可以看到一个 HTML 段落标签，其内容中嵌入了 PHP：\n\n图 16.10 \n\n```\n1 <p>\n2     Hello,\n\
  3     <?php ?>\n4     there!\n5 </p>\n```\n\n我们的目标是移除段落中间出现的那个 `<?php ?>`。我们可以手动这样做，但要确保每次都正确并非易事。\n\
  \n在上一章中，我们简要实验了 PHP 的 `token_get_all` 函数，该函数将返回 PHP 词法器对输入字符串的处理结果。让我们花一点在**图 16.11**\
  \ 的示例输入上调用此函数：\n\n图 16.11 \n\n```\n1 <?php\n2 \n3 $value = <<<'VALUE'\n4 <p>\n5\
  \     Hello,\n6     <?php ?>\n7     there!\n8 </p>\n9 VALUE;\n```\n\n并查看其在**图 16.12**中的输出：\n\
  \n图 16.12 \n\n```\n 1 array:4 [\n 2   0 => array:3 [\n 3     0 => 318\n 4     1\
  \ => \"\"\"\n 5       <p>\\n\n 6           Hello,\\n\n 7           \n 8       \"\
  \"\"\n 9     2 => 1\n10   ]\n11   1 => array:3 [\n12     0 => 394\n13     1 => \"\
  <?php \"\n14     2 => 3\n15   ]\n16   2 => array:3 [\n17     0 => 396\n18     1\
  \ => \"?>\\n\"\n19     2 => 3\n20   ]\n21   3 => array:3 [\n22     0 => 318\n23\
  \     1 => \"\"\"\n24           there!\\n\n25       </p>\n26       \"\"\"\n27  \
  \   2 => 4\n28   ]\n29 ]\n```\n\n查看**图 16.12**，我们可以看到 `token_get_all` 函数为我们的输入文本返回了四个元素。第二个和第三个对应于\
  \ PHP 的开始和结束标签，但第一个和最后一个对应我们的非 PHP 代码。\n\n回想上一章，我们知道对于 PHP 词法器返回的每个数组元素，第一个元素标识词法器检测到的项目类型，第三个元素告诉我们它出现的行号。在我们的实例中，我们对所有标记类型为\
  \ 318 的元素感兴趣，这对应于 `T_INLINE_HTML` 标记类型。通过使用 `token_get_all` 函数的结果，我们可以过滤出内联 HTML\
  \ 标记并有效地跳过所有嵌入的 PHP 代码，处理这些代码可能会变得复杂。然而，这带来一个我们需要注意的小问题。\n\n查看**图 16.12** 中的内联 HTML\
  \ 标记，我们可以看到每个元素都包含了我们想要解析指令的内容。尽管如此，单靠每个元素的内容只能提供文档的局部概述。由于这个问题，我们现在面临与之前相同的问题：我们的行号是错误的。我们可以尝试合并所有内联\
  \ HTML 元素并填充间隙，类似于我们之前做的那样。然而，这次我们可以采取不同的方法。\n\n因为 PHP 词法器为它返回的每个元素都提供了准确的行号，我们可以使用该值来偏移稍后获取的任何行号。例如，如果我们在第三个元素的第\
  \ 1 行，我们可以取该标记的行号减 1，然后加回我们的相对行号，得到最终结果 4，这就是原始文档中正确的行号。你可能注意到，词法器的结果不包含列数。\n\n\
  如果我们愿意，可以遍历所有返回的标记类型的内容，并计算每个标记的列位置。然而，由于大多数 Blade 指令会单独占据一行，对于我们的用用例来说，仅使用行号是可以接受的。\n\
  \n### 16.2 解析 Blade 指令\n\n我们的下一个任务是设置环境，以提取输入文本中出现的任何 Blade 指令的信息。在上一章中，我们探索了使用正则表达式来帮助构建索引，以指示我们应该从文档的何处开始寻找可解析的项目。我们对\
  \ Blade 指令执行同样的操作，因为这将帮助我们避免转义的 Blade 指令，以及看起来像指令但应该忽略的内容（例如 CSS 媒体查询）。\n\n为了做到这一点，我们需要一个核心指令名称列表，以及一种提供自定义指令列表的方法，这些列表可以在运行时通过从运行应用程序上下文中的\
  \ Blade 编译器中检索它们来填充。一旦我们有了这些项，就可以构造一个与**图 16.13**相似的动态正则表达式：\n\n图 16.13 \n\n```\n\
  1 /(?<!@)@(?!@)(can|cannot|canany)/i\n```\n\n**图 16.13** 中的正则表达式以一个看起来模糊的模式开头。尽管如此，只要\
  \ `@` 字符后面没有跟着另一个 `@` 字符，它就能匹配成功。我们必须考虑这两种情况，以避免匹配转义指令中的第一个 `@`。\n\n图 16.14 \n\n\
  ```\n1 <?php\n2 \n3 // ...\nclass BladeValidator\n5 {\n6 \n7     protected $coreDirectives\
  \ = [\n8         'can', 'cannot', 'canany',\n9\n10        // ...\n11\n12\n13 \n\
  14     ];\n15 \n16     protected $customDirectives = [];\n17 \n18     public function\
  \ setDirectives(array $directives)\n19     {\n20         $this->customDirectives\
  \ = $directives;\n21     }\n22 \n23     public function getDirectiveNames()\n24\
  \     {\n25         return array_merge(\n26             $this->coreDirectives,\n\
  27             $this->customDirectives\n28         );\n29     }\n30 \n31 (注：此处代码块的剩余部分已截断或重复，但逻辑遵循上述内容)\n\
  ```\n\n\n\n\n在`图 16.14` 中，我们添加了大量的代码，其中大部分内容与定义核心 Blade 指令列表以及设置自定义指令有关。然而，我们在第\
  \ 57 行到第 75 行之间添加的内容更具趣味。\n\n在第 57 行到第 60 行之间，我们使用 Laravel 集合（collections）从 PHP\
  \ 的 `token_get_all` 函数的返回结果中提取所有的 `T_INLINE_HTML` 标记，这允许我们获取文档中所有非 PHP 代码的内容。\n\n\
  在第 62-65 行，我们利用核心 Blade 指令列表和自定义 Blade 指令列表创建了动态正则表达式。从这里开始，我们开始遍历第 67 行到第 75 行之间的每个\
  \ HTML 区域。\n\n我们在循环中执行的第一件事是使用正则表达式获取当前区域内所有匹配项及其偏移量（offsets）。在目前这种实现阶段，如果我们像这样调用解析器：\n\
  \n图 16.15 \n\n```\n 1 <?php\n 2 \n 3 $blade = <<<'BLADE'\n 4 @@foreach ($users as\
  \ $user)\n 5 \n 6 @@endforeach\n 7 \n 8 @foreach ($users as $user)\n 9 \n10 \n11\
  \ @endforeach\n12 BLADE;\n13 \n 14 $validator = new BladeDirectiveValidator();\n\
  \ 15 $validator->parse($blade);\n```\n\n我们的 `$directiveIndex` 变量将包含以下匹配项数组：\n\n\
  图 16.16 \n\n```\n 1 array:2 [\n 2   0 => array:2 [\n 3     0 => \"@for\"\n 4   \
  \  1 => 43\n 5   ]\n 6   1 => array:2 [\n 7     0 => \"@endfor\"\n 8     1 => 72\n\
  \ 9   ]\n10 ]\n```\n\n我们可以看到，我们的正则表达式跳过了前两个指令，因为它们通过使用两个“@”字符进行了转义。从这里开始，我们将访问正则表达式捕获的每个指令偏移量，并使用之前见过的技术来处理我们的指令。\n\
  \n图 16.17 解析 Blade 指令 \n\n```\n  1 <?php\n  2 \n  3 // ...\n  4 \n  5 class BladeDirectiveCursor\
  \ extends AbstractStringCursor\n  6 {\n  7     public function accept(string $current,\n\
  \  8                            ?string $prev = null,\n  9                     \
  \       ?string $next = null): ?bool\n 10     {\n 11         if ($next == null ||\
  \ ctype_space($next)) {\n 12             return $this->break();\n 13         }\n\
  \ 14 \n 15         if (ctype_punct($next) && $next != '_' && $next != '-') {\n 16\
  \             return $this->break();\n 17         }\n 18 \n 19         return $this->continue();\n\
  \ 20     }\n 21 }\n 22 \n 23 class BladeDirectiveValidator\n 24     \n\n 25    \
  \ // ...\n 26     protected $directiveCursor;\n 27     protected $hasAdvancedIterator\
  \ = false;\n 28     protected $locator;\n 29     protected $structures = [];\n 30\
  \     protected $lineOffset = 0;\n 31     \n 32     private function advance($targetOffset)\n\
  \ 33     {\n 34         $targetOffset -= 1;\n 35         if ($targetOffset <= 0)\
  \ { $targetOffset = 0; }\n 36         \n 37         $byteSize = $this->string->index()[$targetOffset];\n\
  \ 38         \n 39         if (!$this->hasAdvancedIterator &&\n 40             $this->string->key()\
  \ != $targetOffset) {\n 41             $this->hasAdvancedIterator = true;\n 42 \
  \            $this->string->setIteratorPosition(\n 43                 $targetOffset,\n\
  \ 44                 $byteSize\n 45             );\n 46         } else {\n 47  \
  \           $this->hasAdvancedIterator = true;\n 48         }\n 49     }\n 50  \
  \   \n 51     protected function fillStructure(CursorResult $result,\n 52      \
  \        BladeStructure $structure)\n 53     {\n 54         $structure->startPosition\
  \ = $result->startPosition;\n 55         $structure->endPosition = $result->endPosition;\n\
  \ 56         $structure->length = $result->length;\n 57         \n 58         $location\
  \ = $this->locator->getCharPosition(\n 59             $result->startPosition\n 60\
  \         );\n 61         \n 62         if ($location) {\n 63             $structure->line\
  \ = $location->line + $this->lineOffset;\n 64         }\n 65         \n 66     \
  \    return $structure;\n 67     }\n 68     \n 69     protected function parseDirective($offset)\n\
  \ 70     {\n 71         $directive = null;\n 72         \n 73         $this->hasAdvancedIterator\
  \ = false;\n 74         \n 75         foreach ($this->string as $char) {\n 76  \
  \           if (!$this->hasAdvancedIterator) {\n 77                 $this->advance($offset);\n\
  \ 78                 continue;\n 79             }\n 80             \n 81       \
  \      $result = $this->cursor->traverse();\n 82             \n 83             $directive\
  \ = new ParsedDirective();\n 84             $this->fillStructure($result, $directive);\n\
  \ 85             \n 86             if (str($result->value)->startsWith('@')) {\n\
  \ 87                 $directive->directiveName = str($result->value)\n 88      \
  \                                       ->substr(1)\n 89                       \
  \                      ->toString();\n 90             } else {\n 91            \
  \     $directive->directiveName = $result->value;\n 92             }\n 93      \
  \       break;\n 94         }\n 95         \n 96         return $directive;\n 97\
  \     }\n 98     \n 99     public function parse($value)\n 100     {\n 101     \
  \    $value = $this->prepareInput($value);\n 102         \n 103         $htmlRegions\
  \ = collect(token_get_all($value))\n 104             ->filter(function ($token)\
  \ {\n 105                 return is_array($token) && $token[0] == T_INLINE_HTML;\n\
  \ 106             })->all();\n 107         \n 108         $this->structures = [];\n\
  \ 109         \n 110         $pattern = collect($this->getDirectiveNames())\n 111\
  \             ->map(function ($name) {\n 112                 return preg_quote($name);\n\
  \ 113             })->implode('|');\n 114         \n 115         foreach ($htmlRegions\
  \ as $region) {\n 116             $this->lineOffset = $region[2] - 1;\n 117    \
  \         $this->string = new Utf8StringIterator($region[1]);\n 118            \
  \ $this->locator = new CharacterPositionLocator($region[1]);\n 119             $this->directiveCursor\
  \ = new BladeDirectiveCursor(\n 120                 $this->string\n 121        \
  \     );\n 122             \n 123             preg_match_all(\n 124            \
  \     '/(?<!@)@(?!@)('.pattern.')/i',\n 125                 $region[1],\n 126  \
  \               $matches,\n 127                 PREG_OFFSET_CAPTURE\n 128      \
  \       );\n 129             \n 130             $directiveIndex = $matches[0];\n\
  \ 131             \n 132             for ($i = 0; $i < count($directiveIndex); $i++)\
  \ {\n 133                 $directive = $this->parseDirective(\n 134            \
  \         $directiveIndex[$i][1]\n 135                 );\n 136             \n 137\
  \                 if ($directive != null) {\n 138                     $this->structures[]\
  \ = $directive;\n 139                 }\n 140             }\n 141         }\n 142\
  \     }\n 143 }\n```\n\n\n\n\n这种行为通常是需要的，但由于我们正在使用正则表达式来获取每个指令的偏移量（offset），我们需要能够从字符串中的任意位置开始我们的\
  \ `foreach` 循环。我们通过使用 `$hasAdvancedIterator` 标记来检查是否已将迭代器移动到正确的位置，来实现这一点。如果还没有，我们就调用带有所需偏移量的内部\
  \ `advance` 方法，然后继续循环的下一次迭代，此时它将位于正确的位置。\n\n查看我们定义在第 32 行到第 49 行之间的 `advance` 方法，我们发现了一些有趣的地方。首先，我们在第\
  \ 34 行计算了目标偏移量，它比正则表达式的偏移量少 1。这是因为正则表达式将返回“@”字符的位置。我们想要的是紧接在该位置之前的偏移量，这样当我们开始循环遍历字符串时，将从“@”字符开始（请记住，在移动迭代器之后，我们使用使用\
  \ `continue` 关键字来跳过它）。在第 35 行，检查新的目标偏移量是否小于零。如果是，我们将目标偏移量重置为 0，以处理文档以 Blade 指令开头的情况。一旦有了目标偏移量，我们就获取字符串在该位置的字节数。如果迭代器的当前位置与我们的目标偏移量不匹配，我们在第\
  \ 42 行到第 45 行之间手动设置它。现在我们有了一种在 `Utf8StringIterator` 循环的上下文中跳转字符串的方法，我们可以引入在第 15\
  \ 章中处理过的光标（cursor）概念。\n\n我们引入的第一个新光标是 `BladeDirectiveCursor`，定义在第 5 行到第 21 行之间，它将寻找当前\
  \ Blade 指令的结束。我们在第 81 行调用此光标的 `traverse` 方法，它将收集我们指令的细节并将字符串的迭代器移动过指令名称。\n\n一旦完成这些操作，我们在第\
  \ 83 行创建了 `ParsedDirective` 类的新实例。我们在第 84 行使用 `fillStructureDetails` 方法来填充信息，例如指令的起始和结束偏移量以及其行号。这种实现方式是为了让我们以后在解析指令参数时可以重用这些逻辑。在\
  \ `parseDirective` 方法返回指令之前，我们做的最后件事是使用 `substr` 辅助方法设置指令名称。\n\n当我们在第 85 行到第 91\
  \ 行确定指令名称时，我们会检查当前值是否以“@”字符开头。如果不是，则说明文档是以 Blade 指令开头的。在这种情况下，我们不使用 `substr` 辅助方法。\n\
  \n如果我们像这样调用验证器的 `parse` 方法：\n\n图 16.18 \n\n```\n 1 <?php\n 2 \n 3 $blade = <<<'BLADE'\n\
  \ 4 @@foreach ($users as $user)\n 5 \n 6 @@endforeach\n 7 \n 8 @foreach ($users\
  \ as $user)\n 9 \n10 \n11 @endforeach\n12 BLADE;\n 13 \n 14 $validator = new BladeDirectiveValidator();\n\
  \ 15 $validator->parse($blade);\n```\n\n我们将得到以下结构列表：\n\n图 16.19 \n\n```\n 1 array:2\
  \ [\n 2   0 => ParsedDirective {\n 3     startPosition: 43\n 4     endPosition:\
  \ 50\n 5     length: 8\n 6     line: 5\n 7     args: null\n 8     directiveName:\
  \ \"foreach\"\n 9   }\n10   1 => ParsedDirective {\n 11     startPosition: 72\n\
  \ 12     endPosition: 82\n 13     length: 11\n 14     line: 8\n 15     args: null\n\
  \ 16     directiveName: \"foreach\"\n 17   }\n```\n\n我们已经开始了某些工作，接下来只需要处理参数。\n\n\
  ### 16.3 解析参数\n\n解析 Blade 参数与解析指令本身非常相似。不同之处在于我们需要一种简单的方法来查看下一个非空白字符。我们可以使用光标来实现这一点；它会在遇到非空白字符时停止。一旦我们定位到非空白字符，就可以检查它是否为\
  \ `(`。如果是，我们可以使用现有的 `pairedBracketCursor` 扫描到指令的结束：\n\n16.20 解析参数\n\n```\n  1 <?php\n\
  \  2 \n  3 ...\n  4 \n  5 NonWhitespaceCursor\n  6 {\n  7     public accept(string\
  \ $current,\n  8                            ?string $next = null):bool\n9     {\n\
  10         if (ctype_space($current)) {\n11             return false;\n12      \
  \   }\n13 \n14         return true;\n15     }\n16 }\n17 \n18 BladeDirectiveValidator\
  \ {\n19     ...\n20     protected $nonWhitespaceCursor;\n21     protected $pairedBracketCursor;\n\
  22 \n23     protected function parseArgs($offset)\n24     {\n25         $args =\
  \ null;\n26 \n27         $this->hasAdvancedIterator = false;\n28 \n29         foreach\
  \ ($this->string as $char) {\n30             if (!$this->hasAdvancedIterator) {\n\
  31                 $this->advance($offset);\n32                 continue;\n33  \
  \           }\n34 \n35             // Get the argument\n36             $result =\
  \ $this->pairedBracketCursor->traverse();\n37             $args = new ParsedArguments();\n\
  38             $this->fillStructureDetails($result, $args);\n39             $args->content\
  \ = $result->content;\n40             $args->value = $result->value;\n41 \n42  \
  \       break;\n43         }\n44 \n45         return $args;\n46     }\n47 \n48 \
  \    protected function parseDirective($offset)\n49     {\n50         $directive\
  \ = null;\n51 \n52         $this->hasAdvancedIterator = false;\n53 \n54        \
  \ foreach ($this->string as $char) {\n55             if (!$this->hasAdvancedIterator)\
  \ {\n56                 $this->advance($offset);\n57                 continue;\n\
  58             }\n59 \n60             $result = $this->directiveCursor->traverse();\n\
  61             $directive = new ParsedDirective();\n62             $this->fillStructureDetails($result,\
  \ $directive);\n63 \n64             if (str($result->value)->startsWith('@')) {\n\
  65                 $directive->directiveName = str($result->value)\n66         \
  \                                    ->substr(1)\n67                           \
  \                      ->toString();\n68             } else {\n69              \
  \   $directive->directiveName = $result->value;\n70             }\n71 \n72     \
  \        if ($directive->endPosition + 1 < count($this->string)) {\n73         \
  \        $this->string->setIteratorPosition(\n74                     $directive->endPosition\
  \ + 1,\n75                     $this->string->index()[$directive->endPosition +\
  \ 1]\n76                 );\n77 \n78                 $nextNonWhitespace = $this->nonWhitespaceCursor\n\
  79                     ->traverse();\n80 \n81                 if (str($nextNonWhitespace->value)->endsWith('('))\
  \ {\n82                     $directive->args = $this->parseArgs(\n83           \
  \              $nextNonWhitespace->endPosition\n84                     );\n85  \
  \               }\n86             }\n87 \n88             break;\n89         }\n\
  90 \n91         return $directive;\n92     }\n93 \n94     public function parse($value)\n\
  95     {\n96         // ...\n97 \n98         foreach ($htmlRegions as $region) {\n\
  99             $this->lineOffset = $region[2] - 1;\n100             $this->string\
  \ = new Utf8StringIterator($region[1]);\n101             $this->locator = new CharacterPositionLocator($region[1]);\n\
  102             $this->directiveCursor = new BladeDirectiveCursor(\n103        \
  \         $this->string\n104             );\n105 \n106             $this->pairedBracketCursor\
  \ = new PairedBracketCursor(\n107                 $this->string,\n108          \
  \       '(', ')'\n109             );\n110 \n111             $this->nonWhitespaceCursor\
  \ = new NonWhitespaceCursor(\n112                 $this->string\n113           \
  \  );\n114         }\n115 \n116         return $this->structures;\n117     }\n118\
  \ }\n```\n\n\n\n\n\n**图 16.20** 中的新增内容将与用于解析指令本身时添加的内容非常相似。我们新的 `NonWhitespaceCursor`\
  \ 定义在第 5-17 行，它每当遇到非空白字符时就会中断。我们在第 107 行到 114 行之间初始化了这个新光标以及我们的 `PairedBracketCursor`。最重大的更改发生在\
  \ `parseDirective` 方法中，位于第 68 到 82 行之间。\n\n在第 74 行到 77 行之间，我们调整了字符串迭代器的位置，使其越过指令名称的末尾。这将有助于确保我们的非空白光标不会在指令名称本身过早中断。\n\
  \n一旦我们让迭代器移动过指令名称，我们就会在 `NonWhitespaceCursor` 上调用 `traverse` 方法。当 `NonWhitespaceCursor`\
  \ 完成遍历且其值以 `“(` 字符结尾时，我们接着调用 `parseArgs`，并使用 `“(` 字符相对于 `NonWhitespaceCursor` 的偏移量。\n\
  \n我们的 `parseArgs` 方法与 `parseDirective` 方法非常相似，它简单地扫描到参数组的末尾。在我们的示例输入上如下所示调用验证器的\
  \ `parse` 方法：\n\n图 16.21 \n\n```\n 1 <?php\n 2 \n 3 $blade = <<<'BLADE'\n 4 @foreach\
  \ ($invoices as $invoice)\n 5 \n 6     <?php echo $invoice->number; ?>\n 7 \n 8\
  \ @endforeach\n 9 BLADE;\n10 \n11 $validator = new BladeDirectiveValidator();\n\
  12 $validator->parse($blade);\n```\n\n现在产生了以下输出：\n\n图 16.22 \n\n```\n 1 array:2\
  \ [\n 2   0 => ParsedDirective {\n 3     startPosition: 1\n 4     endPosition: 7\n\
  \ 5     length: 7\n 6     line: 1\n 7     args: ParsedArguments {\n 8       startPosition:\
  \ 9\n 9       endPosition: 31\n10       length: 23\n11       line: 1\n12       value:\
  \ \"($invoices as $invoice)\"\n13       content: \"$invoices as $invoice\"\n14 \
  \    }\n15     directiveName: \"foreach\"\n16   }\n 17   1 => ParsedDirective {\n\
  \ 18     startPosition: 1\n 19     endPosition: 11\n 20     length: 11\n 21    \
  \ line: 5\n 22     args: null\n 23     directiveName: \"endforeach\"\n 24   }\n\
  \ 25 ]\n```\n\n我们在**图 16.22** 中的示例现在包含了指令参数的内容，我们可以开始编写验证逻辑了。\n\n 16.4 验证 Blade\
  \ 指令\n\n在最后一个节中，我们将努力实现一个 Blade 指令验证系统。我们的验证系统将允许开发者指定任意回调函数，这些函数将用于判断指令是否有效。我们还将在内部使用此系统来支持默认验证器。如果我们的验证函数返回字符串，则表示存在问题；返回空内容则意味着指令通过了该特定的验证规则。\n\
  \n开始之前，我们将添加 `$validators` 数组和 `addValidator` 方法：\n\n图 16.23 开始验证器的实现 \n\n```\n\
  \ 1 <?php\n 2 \n 3 // ...\n 4 \n 5 class BladeDirectiveValidator\n 6 {\n 7     //\
  \ ...\n 8     protected $validators = [];\n 9     \n10     // ...\n11 \n12     public\
  \ function addValidator($directive, $validator)\n13     {\n14         $directive\
  \ = str($directive)->lower->toString();\n15 \n16         if (! array_key_exists($directive,\
  \ $this->validators)) {\n17             $this->validators[$directive] = [];\n18\
  \         }\n19 \n20         $this->validators[$directive][] = $validator;\n21 \
  \    }\n 22 }\n```\n\n现在我们已经有了添加添加验证器的方法，可以添加 `validate` 方法，该方法将解析我们的模板并在提供的模板中的所有指令上调用我们的验证器：\n\
  \n图 16.24 添加我们的 Validate 方法 \n\n```\n 1 <?php\n 2 \n 3 // ...\n 4 \n 5 class BladeDirectiveValidator\n\
  \ 6 {\n 7     // ...\n 8 \n 9     public function validate($value)\n10     {\n11\
  \         $structures = $this->parse($value);\n12 \n13         foreach ($structures\
  \ as $structure) {\n14             if (! $structure instanceof ParsedDirective)\
  \ {\n15                 continue;\n16             }\n17 \n18             $directive\
  \ = str($structure->directiveName)\n19                 ->lower->toString();\n20\
  \ \n21             if (! array_key_exists($directive, $this->validators)) {\n22\
  \                 continue;\n23             }\n24 \n25             foreach ($this->validators[$directive]\
  \ as $validator) {\n26                 $result = $validator($structure);\n27 \n\
  28                 if (is_string($result)) {\n29                     throw new Exception(\n\
  30                         $result . ' on line ' .\n31                         $structure->line\n\
  32                     );\n33                 }\n34             }\n35         }\n\
  36     }\n``` `validate` 方法中做的第一件事是解析输入。然后，我们遍历解析期间发现的所有指令。如果指令存在验证器，则调用我们的验证器。让我们现在创建一个示例验证器来验证\
  \ `“if`：\n\n图 16.25 \n\n```\n 1 <?php\n 2 \n 3 $blade = <<<'BLADE'\n 4 @foreach\
  \ ($invoices as $invoice)\n 5 \n 6     <?php echo $invoice->number; ?>\n 7 \n 8\
  \ @endforeach\n 9 BLADE;\n10 \n11 $validator = new BladeDirectiveValidator();\n\
  12 $validator->parse($blade);\n```\n\n执行时，**图 16.25** 中的示例代码将抛出一个异常，消息如下：\n\n图 16.26\
  \ \n\n```\n1 if not have condition on line 2\n```\n\n我们可以改进图 16.25 中的示例使其更好用。此外，我们还可以支持相反的验证规则：确保指令*不*有参数组：\n\
  \n图 16.27 \n\n```\n 1 <?php\n 2 \n 3 // ...\n 4 \n 5 class BladeDirectiveValidator\n\
  \ 6 {\n 7     // ...\n 8 \n 9     public function shouldHaveArgs($directives)\n\
  10     {\n11         if (! is_array($directives)) {\n12             $directives\
  \ = [$directives];\n13         }\n14 \n15         foreach ($directives as $directive)\
  \ {\n16             $this->addValidator($directive, function ($structure)\n17  \
  \           use ($directive) {\n18                 if ($structure->args == null\
  \ ||\n19                     $structure->args->content == '') {\n20            \
  \         return '@' . $directive .\n21                         ' is missing argument\
  \ group';\n22                 }\n23 \n24                 return true;\n25      \
  \       });\n26         }\n27 \n28         return $this;\n29     }\n30 \n31    \
  \ public function shouldNotHaveArgs($directives)\n32     {\n33         if (! is_array($directives))\
  \ {\n34             $directives = [$directives];\n35         }\n36 \n37        \
  \ foreach ($directives as $directive) {\n38             $this->addValidator($directive,\
  \ function ($structure)\n39             use ($directive) {\n40                 if\
  \ ($structure->args != null) {\n41                     return 'Unexpected argument\
  \ group for @' .\n42                         $directive.' directive';\n43      \
  \           }\n44 \n45                 return true;\n46             });\n47    \
  \     }\n48 \n49         return $this;\n50     }\n51 }\n```\n\n我们可以像下面这样使用我们新的验证助手来获得相同的结果：\n\
  \n图 16.28 \n\n```\n 1 <?php\n 2 \n 3 $blade = <<<'BLADE'\n 4 \n 5 @if (true)\n 6\
  \ \n 7 @endif ()\n 8 BLADE;\n 9 \n10 $validator = new BladeDirectiveValidator();\n\
  11 $validator->shouldHaveArgs('if')\n12     ->shouldNotHaveArgs('endif');\n```\n\
  \n我们在**图 16.28** 中的示例现在现在会抛出一个异常，消息如下：\n\n图 16.29 \n\n```\n1 Unexpected argument\
  \ group for @endif directive on line 4\n```\n\n\n\n\n在处理大型软件应用或与足够大的团队协作时，一个常见的需求是确保编写代码时大小写的一致。我们可以扩展验证系统，以便在处理\
  \ Blade 指令时强制执行一致的大小写。\n\n图 16.30 验证指令名称大小写 \n\n```\n 1 <?php\n 2 \n 3 // ...\n\
  \ 4 \n 5 class BladeDirectiveValidator\n 6 {\n 7     // ...\n 8 \n 9     public\
  \ function mustMatchCase($directives)\n10     {\n11         if (! is_array($directives))\
  \ {\n12             $directives = [$directives];\n13         }\n14 \n15        \
  \ foreach ($directives as $directive) {\n16             $this->addValidator($directive,\
  \ function ($structure)\n17             use ($directive) {\n18                 if\
  \ ($structure->directiveName != $directive) {\n19                     return 'Directive\
  \ @'.$structure->directiveName .\n20                         ' does not match case\
  \ of @' . $directive;\n21                 }\n22 \n23                 return true;\n\
  24             });\n25         }\n26 \n27         return $this;\n28     }\n29 \n\
  30     public function validateCoreDirectiveCasing()\n31     {\n32         $this->mustMatchCase($this->coreDirectives);\n\
  33 \n34         return $this;\n35     }\n36 }\n```\n\n在**图 16.30** 中，我们添加了一个新的 `mustMatchCase`\
  \ 验证方法。源文档中的指令名称与传递给此方法的大小写不匹配，将抛出一个验证异常。此外，我们添加了 `validateCoreDirectiveCasing`\
  \ 方法，它将为所有核心 Blade 指令添加类似的验证方法。\n\n使用我们的新方法如下：\n\n图 16.31 \n\n```\n 1 <?php\n 2\
  \ \n 3 $blade = <<<'BLADE'\n 4 \n 5 @if (true)\n 6     @customDirective\n 7 @endIf\n\
  \ 8 BLADE;\n 9 \n10 $validator = new BladeDirectiveValidator();\n11 $validator->setCustomDirectives([\n\
  12     'customDirective'\n13 ]);\n14 \n15 $validator->validateCoreDirectiveCasing()\n\
  16     ->mustMatchCase('customDIRECTIVE');\n17 \n18 $validator->validate($blade);\n\
  ```\n\n将生成以下验证异常：\n\n图 16.32 \n\n```\n1 Directive @customDirective does not match\
  \ case\n2 of @customDIRECTIVE on line 3\n```\n\n### 16.6 强制执行指令名称后的空格\n\n与确保 Blade\
  \ 指令名称的大小写一致类似，确保指令名称与其参数组之间有统一的间距也是一种合理的需求。例如，**图 16.33** 包含了许多不同间距的指令，还有一个指令参数出现在单独一行的示例：\n\
  \n图 16.33 \n\n```\n1 @if   (true)\n2 \n3     @if \n4             (5 < 3)\n5    \
  \ @endif\n6 @endif\n```\n\n我们可以实现验证方法来兼顾这两种情况，如下所示：\n\n图 16.34\n\n```\n 1 <?php\n\
  \ 2 \n 3 // ...\n 4 \n 5 class BladeDirectiveValidator\n 6 {\n 7     // ...\n 8\
  \     protected $argGroupSpacing = null;\n 9 \n10     public function validate($value)\n\
  11     {\n12         $structures = $this->parse($value);\n13 \n14         foreach\
  \ ($structures as $structure) {\n15             if (!structure instanceof ParsedDirective)\
  \ {\n16                 continue;\n17             }\n18 \n19             $directive\
  \ = str($structure->directiveName)\n20                 ->toString();\n21 \n22  \
  \           if ($structure->args != null) {\n23                 $this->validateArgumentSameLine($structure);\n\
  24 \n25                 if ($this->argGroupSpacing != null) {\n26              \
  \       $spacing = $structure->args->startPosition -\n27                       \
  \  $structure->endPosition - 1;\n28 \n29                     if ($spacing != $this->argGroupSpacing)\
  \ {\n30                         throw new Exception(\n31                       \
  \      'Improper spacing between @' .\n32                             $structure->directiveName\
  \ .\n33                             ' and its arguments. Expected ' .\n34      \
  \                       $this->argGroupSpacing . ' spaces, got ' .\n35         \
  \                    $spacing . ' on line ' . $structure->line\n36             \
  \            );\n37                     }\n38                 }\n39            \
  \ }\n40             // ...\n41         }\n42     }\n43 \n44     protected function\
  \ validateArgumentSameLine(\n45         ParsedDirective $structure\n46     )\n47\
  \         if ($structure->line != $structure->args->line) {\n48             throw\
  \ new Exception(\n49                 'Start of argument group for @' .\n50     \
  \            $structure->directiveName .\n51                 ' must be on the same\
  \ line on ' .\n52                 $structure->line\n53             );\n54      \
  \   }\n55     }\n56 \n57     public function requireArgGroupSpacing($spacing)\n\
  58     {\n59         $this->argGroupSpacing = $spacing;\n60         return $this;\n\
  61 }\n```\n\n我们的更改在**图 16.34** 中添加了几个方法和一个私有属性：`argGroupSpacing`。`validate` 方法在第\
  \ 22 行会检查指令是否有参数组，是否在同一行。如果我们的内部 `$argGroupSpacing` 值不为 `null`，我们会计算指令结束到参数组开始之间的空格数。`requireArgumentSameLine`\
  \ 方法在第 26 行检查该值是否等于我们预期的数量。\n\n图 16.35 \n\n```\n 1 <?php\n 2 \n 3 $blade = <<<'BLADE'\n\
  \ 4 @if   (true)\n 5 \n 6     @if\n 7             (5 < 3)\n 8     @endif\n 9 @endif\n\
  \ 10 BLADE;\n11 \n12 $validator = new BladeDirectiveValidator();\n13 $validator->requireArgGroupSpacing(1);\n\
  14 $validator->validate($blade);\n```\n\n图 16.35 中的代码示例将抛出以下异常：\n\n图 16.36 \n\n\
  ```\n1 Improper spacing between @if and its arguments. Expected 1 spaces, got 2\n\
  ```\n\n修正间距问题后重新运行我们的示例：\n\n图 16.37 \n\n```\n 1 <?php\n 2 \n 3 $blade = <<<'BLADE'\n\
  \ 4 @if (true)\n 5 \n 6     @if\n 7             (5 < 3)\n 8     @endif\n 9 @endif\n\
  \ 10 BLADE;\n11 \n12 $validator = new BladeDirectiveValidator();\n13 $validator->requireArgGroupSpacing(1);\n\
  14 $validator->validate($blade);\n```\n\n现在将产生以下验证异常，提醒我们参数组出现在与指令不同的行：\n\n图 16.38\
  \ \n\n```\n1 Start of argument group for @if directive must be on the same line\
  \ on 3\n```\n\n### 17. 处理 HTML\n\n广而言之，多年来收到的与 HTML 处理的相关问题分为三类：生成新的 HTML、处理现有的\
  \ HTML 以及分析嵌入了其他语言的 HTML 类文档。第一类是我们所有人非常熟悉的，因为大多数 PHP 的输出都是 HTML 字符串，无论是完全通过 PHP\
  \ 生成的，还是通过其他专门的模板引擎（如 Blade）生成的。然而，后两类情况变得特别有趣且微妙。\n\n处理现有 HTML 的示例可能是向特定元素添加 CSS\
  \ 类。这里的需求通常是使用 CSS 选择器表示目标 HTML 元素，我们将在本章稍后介绍。另一个例子是反转输出中 HTML 实体的双编码，这在内容管理系统生成的多个层\
  \ HTML 输出中经常意外发生。\n\n第三类——分析嵌入了其他语言的 HTML 文档——是三类中最感兴趣的。这一类的复杂性在于，嵌入的语言通常会使整个文档变成无效的\
  \ HTML。让我们考虑图 17.1，它是 Statamic（一个基于 Laravel 的内容管理系统）的模板语言 Antlers 的片段：\n\n```\n\
  1 <{{ as or 'a' }} class=\"list of CSS classes\">\n2     Element content.\n3 </{{\
  \ as or 'a' }}>\n```\n\n\n\n`图 17.1` 中发生的事情的具体语义并不重要，由于我们有一些嵌入代码，这些代码会动态生成 HTML\
  \ 元素的名称。这些场景对我们进行视觉分析相对简单，但当尝试使用现有的第三方库分析 HTML 文档结构时，会增加巨大的复杂性，因为这些库可能无法优雅地处理任意的嵌入语言。这并不一定是这些库的问题，它们的目标是分析\
  \ HTML，而不是 HTML 可能动态构建的无限其他方式。我们将在本章节末尾讨论管理这些场景的技术。\n\n在整个章节中，我们将通过各种示例来遍历、操作和修改现有的\
  \ HTML 文档。我们将使用 Symfony 发布的几个包：`symfony/dom-crawler` 和 `symfony/css-selector` 包。Symfony\
  \ 的 `DomCrawler` 包让遍历 HTML 和 XML 文档变得更加简单，而 `CssSelector` 则允许我们使用 CSS 选择器从结构化文档中检索节点。\n\
  \n要开始使用 DOM Crawler 包，我们可以在提供 HTML 或 XML 文档作为第一个参数的同时，创建一个新的 `Crawler` 实例：\n\n图\
  \ 17.2 创建新的 Crawler 实例\n\n```\n 1 <?php\n 2 \n3 use Symfony\\Component\\DomCrawler\\\
  Crawler;\n 4 \n5 $html = <<<'HTML'\n 6 <!DOCTYPE html>\n 7 <html>\n 8     <body>\n\
  \ 9         <div class=\"profiles\">\n10             <div class=\"profile\">\n11\
  \                 <h3 class=\"name\">Alice</h3>\n12                 <p class=\"\
  location\">US</p>\n13             <//div>\n14             <div class=\"profile\"\
  >\n15                 <h3 class=\"name\">Bob</h3>\n16                 <p class=\"\
  location\">CA</p>\n17             </div>\n18             <div class=\"profile\"\
  >\n19                 <h3 class=\"name\">Charlie</h3>\n20                 <p class=\"\
  location\">UK</p>\n21             </div>\n22             <div class=\"profile\"\
  >\n23                 <h3 class=\"name\">Daniel</h3>\n24                 <p class=\"\
  location\">MX</p>\n25             </div>\n26         </div>\n27     </body>\n28\
  \ </html>\n29 HTML;\n30 \n31 $crawler = new Crawler($html);\n```\n\n现在我们有了一个爬虫实例，可以使用它的公共\
  \ API 更直接地与文档交互，而不是直接与底层的 `DOMDocument`、`DOMNodeList` 和 `DOMNode` 实例操作。例如，我们可以使用\
  \ `filter` 方法定位所有包含 `location` 类的元素，然后对返回的节点列表上使用 `each` 方法。\n\n`each` 方法允许我们指定一个回调函数，该函数将接收匹配我们选择器的每个元素。`each`\
  \ 方法将使用我们回调函数的返回值作为其结果，类似于 Laravel 集合的 `map` 方法。我们在 `图 17.3` 中的示例将返回包含 `location`\
  \ 类的元素的内部文本：\n\n图 17.3 \n\n```\n1 <?php\n2 \n3 $locations = $crawler->filter('.location')\n\
  4     ->each(fn($l) => $l->innerText());\n```\n\n`图 17.3` 将产生以下结果：\n\n图 17.4 \n\n\
  ```\n1 array:4 [\n2   0 => \"US\"\n3   1 => \"CA\"\n4   2 => \"UK\"\n5   3 => \"\
  MX\"\n6 ]\n```\n\n我们在 `图 17.3` 中的示例对于它匹配的元素并没有特别具体。例如，如果我们的输入文档包含以下文本：\n\n图 17.5\
  \ \n\n```\n 1 <!DOCTYPE html>\n 2 <html>\n 3     <body>\n 4         <p class=\"\
