  \n(string) str('ThIs iS a TiTlE')\n    ->title();\n```\n\n### 3.12 将字符串的首字符转换为大写\n\
  \n**图 3.34 ucfirst 方法方法签名**\n\n```php\n<?php\n\n/**\n * Versions: Laravel 8, 9\n\
  \ *\n * @return string\n */\npublic static function ucfirst(\n    string $string\n\
  );\n```\n\n`ucfirst`辅助方法用于将字符串的第一个字符转换为大写，它只定义了一个参数（`$string`），该参数的首字符将被转换为大写。此辅助方法与\
  \ PHP 的 `ucfirst` 函数不同，因为 Laravel 辅助方法通过使用 PHP 的多字节字符串 API 重新实现了 `ucfirst` 函数来处理多字节字符串。该方法内部使用\
  \ UTF-8 字符编码。\n\n以下所有示例将返回结果 `Conditional parameters`：\n\n**图 3.35**\n\n```php\n\
  <?php\n\nuse Illuminate\\Support\\Str;\n\nStr::ucfirst('conditional parameters');\n\
  Str::ucfirst('Conditional parameters');\n\n(string) str('conditional parameters')\n\
  \    ->ucfirst();\n```\n\n### 3.13 生成字符串的大写变体\n\n**图 3.36 upper 方法方法签名**\n\n```php\n\
  <?php\n\n/**\n * Versions: Laravel 8, 9\n *\n * @return string\n */\npublic static\
  \ function upper(\n    string $value\n);\n```\n\n`upper`辅助方法是 `lower`方法的相反方法；`upper`方法返回大写的变体。在执行不变的字符串比较或修改显示给终端用户的内容，或者当您只需要确保字符串为大写时，此方法非常有用。\n\
  \n以下两个代码示例都将返回值 `ALL UPPER CASED`：\n\n**图 3.37**\n\n```php\n<?php\n\nuse Illuminate\\\
  Support\\Str;\n\nStr::upper('all upper cased');\n\n(string) str('all upper cased')\n\
  \    ->upper();\n```\n\n### 3.14 统计字符串中的单词数\n\n**图 3.38 wordCount 方法方法签名**\n\n```php\n\
  <?php\n\n// Version: Laravel 8\npublic static function wordCount(\n    string $string\n\
  );\n\n// Version: Laravel 9\npublic static function wordCount(\n    string $string,\n\
  \    string|null $characters = null\n);\n```\n\n`wordCount`辅助方法用于计算提供字符串中的单词数。在内部，该辅助方法调用\
  \ PHP 内置的 `str_word_count` 函数。\n\nLaravel 提供了 `wordCount` 方法来确定字符串的单词数。从 Laravel\
  \ 9 开始，它接受一个可选的 `$characters` 参数来定义单词边界。\n\n#### 逻辑辅助方法概述\n\n| 方法 | 描述 |\n| :---\
  \ | :--- |\n| `contains` | 检查字符串是否包含一个或多个子字符串。 |\n| `containsAll` | 检查字符串是否包含所有提供的子字符串。\
  \ |\n| `endsWith` | 检查字符串是否以提供的子字符串结尾。 |\n| `startsWith` | 检查字符串是否以提供的子字符串开头。 |\n\
  | `isAscii` | 检查字符串是否仅包含 ASCII 字符。 |\n\n### 4.1 检查字符串是否包含子字符串\n\n`contains`辅助方法用于检查字符串（`$haystack`）是否包含一个或多个子字符串（`$needles`）。如果\
  \ `haystack` 包含任何 `needles`，则返回 true。否则，返回 false。\n\n`haystack` 和 `needles` 的大小写至关重要，大小写不同的相似字符串将无法匹配。从\
  \ Laravel 9 开始，`contains`搜索可以设置为忽略大小写。\n\n以下示例演示了 `contains`辅助方法的主要用法：\n\n**图 4.2**\n\
  \n```php\n<?php\n\nuse Illuminate\\Support\\Str;\n\n$searchStrings = [\n    'hello',\
  \ 'wilderness', 'WORLD'\n];\n\n// Returns \"true\"\nStr::contains('Hello, wilderness',\
  \ $searchStrings);\n\n// Returns \"false\"\nStr::contains('HELLO, WILDERNESS', $searchStrings);\n\
  \n// 禁用大小写敏感。\n// Returns \"true\"\nStr::contains(\n    'HELLO, WORLD',\n    $searchStrings,\n\
  \    true\n);\n```\n\n`contains`方法也适用于流式字符串，但它没有提供禁用大小写敏感的方法：\n\n**图 4.3**\n\n```php\n\
  <?php\n\n// Returns \"true\"\nstr('HELLO, WORLD')->contains($searchStrings);\n```\n\
  \n### 4.2 检查字符串是否包含多个子字符串\n\n**图 4.4 containsAll 方法方法签名**\n\n```php\n<?php\n\n/**\n\
  \ * Version: Laravel 8\n *\n * @return bool\n */\npublic static function containsAll(\n\
  \    string $haystack,\n    string[] $needles\n);\n\n/**\n * Version: Laravel 9\n\
  \ *\n * @return bool\n */\npublic static function containsAll(\n    string $haystack,\n\
  \    string[] $needles,\n    bool $ignoreCase = false\n);\n```\n\n\n\n\n\n`containsAll`\
  \ 辅助方法用于检查字符串（`$haystack`）是否包含所有提供的子字符串（“needles”）。只有当所有子字符串都存在于搜索字符串中时，该方法才返回 true。\n\
  \n`haystack` 和 `needles` 的大小写至关重要，相似但大小写不同的字符串将无法匹配。从 Laravel 9 开始，`contains` 搜索可以设置为不区分大小写。\n\
  \n以下示例演示了如何使用 `containsAll` 方法检查字符串是否包含所有搜索字符串：\n\n图 4.5 \n\n```php\n 1 <?php\n\
  \ 2 \n3 use Illuminate\\Support\\Str;\n 4 \n5 $fruits = [\n 6     'apple',\n 7 \
  \    'banana',\n 8     'cherry',\n 9 ];\n10 \n11 // Returns \"false\"\n12 Str::containsAll(\n\
  13     'The fruits are: apple, and cherry.',\n14     $fruits\n15 );\n16 \n17 //\
  \ Returns \"true\"\n18 Str::containsAll(\n19     'The fruits are: apple, banana,\
  \ and cherry.',\n20     $fruits\n21 );\n22 \n23 // Disables the case-sensitive search.\n\
  24 // Returns \"true\"\n25 Str::containsAll(\n26     'The fruits are: APPLE, BANANA,\
  \ and CHERRY.',\n27     $fruits,\n28     true\n29 );\n```\n\n我们也可以在流式字符串实例（fluent\
  \ string instances）上使用 `containsAll` 方法，但其实现没有提供禁用大小写敏感搜索的方法：\n\n图 4.6 \n\n```php\n\
  1 <?php\n2 \n3 // Returns \"true\"\n4 str('The fruits are: apple, banana, and cherry.')\n\
  5     ->containsAll($fruits);\n```\n\n### 4.3 检查字符串是否以另一个字符串结尾\n\n图 4.7 `endsWith`\
  \ 方法签名 \n\n```php\n 1 <?php\n 2 \n3 /**\n 4  * Versions: Laravel 8, 9\n 5  *\n6\
  \  * @return bool\n 7  */\n  public static function endsWith(\n 9              string\
  \ $haystack,\n10     string|string[] $needles\n11 );\n```\n\n`endsWith` 辅助方法检查给定的字符串（`$haystack`）是否以提供的任何一个字符串（`$needles`）结尾。`haystack`\
  \ 是任何可以转换为字符串的值。\n\n可以提供单个字符串作为 `needle`，以检查 `haystack` 是否以该单个针结尾。要检查字符串是否以任意数量的针结尾，则将\
  \ `needles` 作为字符串数组提供。\n\n以下示例演示了 `endsWith` 辅助方法的本质用法：\n\n图 4.8 \n\n```php\n 1\
  \ <?php\n 2 \n3 use Illuminate\\Support\\Str;\n 4 \n5 $punctuation = [\n 6     '.',\
  \ '!', '?'\n 7 ];\n 8 \n9 // Returns \"true\"\n10 Str::endsWith(\n11     'A simple\
  \ sentence.',\n12     '.'\n13 );\n14 \n15 // Returns \"true\"\n16 Str::endsWith(\n\
  17     'A simple sentence.',\n18     $punctuation\n19 );\n```\n\n我们也可以在流式字符串实例上使用\
  \ `endsWith` 方法：\n\n图 4.9 \n\n```php\n1 <?php\n2 \n3 // Returns \"false\"\n4 str('Case\
  \ matters')->endsWith('S');\n5 \n6 // Returns \"true\"\n7 str('Another string!')\n\
  8     ->endsWith($punctuation);\n```\n\n### 4.4 检查字符串是否以另一个字符串开头\n\n图 4.10 `startsWith`\
  \ 方法签名\n\n```php\n 1 <?php\n 2 \n3 /**\n 4  * Versions: Laravel 8, 9\n 5  *\n6 \
  \ * @return bool\n 7  */\n 8 public static function startsWith(\n 9            \
  \  string $haystack,\n10     string|string[] $needles\n11 );\n```\n\n`startsWith`\
  \ 辅助方法检查给定的字符串（`$haystack`）是否以提供的任何一个字符串（`$needles`）开头。`haystack` 是任何可以转换为字符串的值。该辅助方法是\
  \ `endsWith` 辅助方法的逻辑相反操作。\n\n可以提供单个字符串作为 `needle`，以检查 `haystack` 是否以该单个针开头。要检查字符串是否以任意数量的针开头，则将\
  \ `needles` 作为字符串数组提供。\n\n图 4.11 \n\n```php\n 1 <?php\n 2 \n3 use Illuminate\\Support\\\
  Str;\n 4 \n5 $schemes = [\n 6     'http://',\n 7     'https://'\n 9 ];\n10 \n11\
  \ // Returns \"true\"\n12 Str::startsWith('https://still.com/', $schemes);\n13 \n\
  14 // Case matters.\n15 // Returns \"false\"\n16 str('Just a sentence')\n17    \
  \ ->startsWith('j');\n```\n\n### 4.5 检查字符串是否仅包含 ASCII 字符\n\n图 4.12 `isAscii` 方法签名\n\
  \n```php\n 1 <?php\n 2 \n3 /**\n 4  * Versions: Laravel 8, 9\n 5  *\n6  * @return\
  \ bool\n 7  */\n 8 public static function isAscii(\n 9     string $value\n10 );\n\
  ```\n\n你可以使用 `isAscii` 辅助方法检查提供的字符串是否仅包含 ASCII 字符。该方法的结果对于有条件地将非 ASCII 字符转译为相应的\
  \ ASCII 等效字符很有用。\n\n`isAscii` 辅助方法的某些用例可能包括\n\n*   向支持 ASCII 编码的遗留软件系统或硬件系统验证输入\n\
  *   如果输入不是 ASCII，则条件地修改运行时行为\n\n以下示例演示了如何使用 `isAscii` 方法：\n\n图 4.13 \n\n```php\n\
  \ 1 <?php\n 2 \n3 use Illuminate\\Support\\Str;\n 4 \n5 // Returns \"true\"\n6 Str::isAscii('Hello');\n\
  \ 7 \n8 // Returns \"false\"\n9 str('你好')->isAscii();\n```\n\n此方法可以与 `transliterate`\
  \ 辅助方法结合使用有趣的结果。作为回顾，你可以使用 `transliterate` 方法将非 ASCII 字符转换为最接近的 ASCII 等效字符：\n\n\
  图 4.14 \n\n```php\n 1 <?php\n 2 \n3 // Returns \"Ni Hao\"\n4 Str::transliterate('你好');\n\
  ```\n\n我们可以结合这两个方法，创建一个根据输入是否为 ASCII 生成不同 slug 的函数：\n\n图 4.15 \n\n```php\n 1 <?php\n\
  \ 2 \n3 function makeSlug($title)\n 4 {\n 5     if (!Str::isAscii($title)) {\n 6\
  \       $title = Str::transliterate($title);\n 7     }\n 8 \n9     return Str::slug($title);\n\
  10 }\n11 \n12 // Returns \"hello-world\"\n13 makeSlug('Hello World');\n14 \n15 //\
  \ Returns \"ni-hao\"\n16 makeSlug('你好');\n```\n\n流式字符串还提供了 `whenIsAscii` 方法。该方法接受两个回调函数：当流式字符串的值为\
  \ ASCII 时调用第一个，当其不是 ASCII 时调用第二个。我们可以使用此方法重写我们的 slug 生成函数：\n\n图 4.16 \n\n```php\n\
  \ 1 <?php\n 2 \n3 function makeSlug($title)\n 4 {\n 5     return str($title)->whenIsAscii(\n\
  \ 6       fn($title) => $title->slug(),\n 7       fn($title) => str(Str::transliterate($title))->slug()\n\
  \ 8     )->toString();\n 9 }\n```\n\n## 5. 构造方法\n\n构造方法有助于以某种方式从现有字符串生成新字符串。例如，可以使用构造方法替换字符串、根据大小写分割字符串甚至限制字符串长度。\n\
  \n表 5.1 提供了在本章中遇到的各种构造方法的概述：\n\n表 5.1 构造方法\n\n| 方法 | 描述 |\n| --- | --- |\n| `ascii`\
  \ | 将 UTF-8 字符转换为最接近的 ASCII 等效字符。 |\n| `excerpt` | 生成文本摘要。 |\n| `finish` | 确保字符串以指定的子字符串结尾。\
  \ |\n| `start` | 确保字符串以指定的子字符串开头。 |\n| `length` | 返回字符串的长度。 |\n| `limit` | 如果超过指定的字符限制则截断字符串。\
  \ |\n| `mask` | 隐藏现有字符串的部分。 |\n| `random` | 生成指定长度的伪随机字符串。 |\n| `remove` | 移除现有字符串的部分。\
  \ |\n| `repeat` | 按指定的次数重复给定的字符串。 |\n| `replace` | 替换现有字符串中的一个多个子字符串。 |\n| `replaceArray`\
  \ | 顺序替换现有字符串中的子字符串，常见的用例是替换参数化 SQL 语句中的参数。 |\n| `replaceFirst` | 替换提供字符串中第一个出现的子字符串。\
  \ |\n| `replaceLast` | 替换提供字符串中最后一个出现的字符串。 |\n| `swap` | 使用键值对作为替换源来替换提供字符串中的子字符串。\
  \ |\n| `ucsplit` | 根据大写字母将字符串分割为字符串数组。 |\n\n### 5.1 转译字符为 ASCII\n\n图 5.1 `ascii`\
  \ 方法签名\n\n\n\n\n\n```php\n/**\n * Versions: Laravel 8, 9\n *\n * @return string\n\
  \ */\npublic static function ascii(\n    string $value,\n    string $language =\
  \ 'en'\n);\n```\n\n`ascii` 辅助方法用于将 [UTF-8](https://en.wikipedia.org/wiki/UTF-8)\
  \ 字符转换为其最接近的 [ASCII](https://en.wikipedia.org/wiki/ASCII) 等效字符。\n\n当与需要 `ASCII`\
  \ 的其他软件平台进行通信，或者需要遵守协议（如 `HTTP`）关于标头或某些值的格式或编码的要求时，此方法非常有用。\n\n#### 语言代码\n\n`ascii`\
  \ 方法可以接受以下语言代码作为语言参数（$language`）：\n\n| 语言 | 参数值 |\n| --- | --- |\n| 阿姆哈语 | `am`\
  \ |\n| 阿拉语 | `ar` |\n| 亚美尼亚语 | `hy` |\n| 阿塞拜疆语 | `az` |\n| 白俄罗斯语 | `bg` |\n| 孟加拉语\
  \ | `bn` |\n| 保加利亚语 | `bg` |\n| 中文 | `zh` |\n| 罗罗地亚语 | `hr` |\n| 捷克语 | `cs` |\n\
  | 丹语 | `da` |\n| 荷兰语 | `nl` |\n| 英语 | `en` |\n| 国际语 | `eo` |\n| 爱沙尼亚语 | `et` |\n\
  | 额外拉丁字符 | `latin` |\n| 额外微软 Word 字符 | `msword` |\n| 额外空白字符 | ` ` (单个空格) |\n| 芬兰语\
  \ | `fi` |\n| 奥地利法语 | `fr_at` |\n| 法语 | `fr` |\n| 瑞士法语 | `fr_ch` |\n| 格鲁吉亚语 | `ka`\
  \ |\n| 奥地利德语 | `de_at` |\n| 德语 | `de` |\n| 瑞士德语 | `de_ch` |\n| 希腊语混合英语 | `el__greeklish`\
  \ |\n| 希腊语 | `el` |\n| 印地语 | `hi` |\n| 匈牙语 | `hu` |\n| 意大利语 | `it` |\n| 日语 | `ja`\
  \ |\n| 哈萨克斯克语 | `kk` |\n| 柯尔吉斯语 | `ky` |\n| 韩语 | `ko` |\n| 拉脱维亚语 | `lv` |\n| 立陶尼亚语\
  \ | `lt` |\n| 马其顿语 | `mk` |\n| 蒙古语 | `mn` |\n| 缅甸语 | `my` |\n| 挪威语 | `no` |\n| 奥里亚语\
  \ | `or` |\n| 普什吾语 | `ps` |\n| 波斯语 | `fa` |\n| 波兰语 | `pl` |\n| 葡萄语 | `pt` |\n| 罗马尼亚语\
  \ | `ro` |\n| 俄罗斯 GOST 2000 B | `ru__gost2000_b` |\n| 俄罗斯语 | `ru` |\n| 2013 年俄罗斯护照\
  \ | `ru__passport2013` |\n| 塞尔维亚西里尔字母 | `sr__cyr` |\n| 塞尔维亚语 | `sr` |\n| 塞尔维亚拉丁字母\
  \ | `sr__lat` |\n| 斯洛伐克语 | `sk` |\n| 瑞典语 | `sv` |\n| 泰语 | `th` |\n| 土耳其语 | `tr`\
  \ |\n| 土库曼语 | `tk` |\n| 乌语 | `uk` |\n| 乌兹别克语 | `uz` |\n| 越南语 | `vi` |\n\n以下示例使用了\
  \ `ascii` 辅助方法将某些字符转换为其最接近英语对应项：\n\n```php\nuse Illuminate\\Support\\Str;\n\n//\
  \ 返回 \"ASz\"\nStr::ascii('Àž');\n```\n\n`ascii` 方法也适用于流式字符串：\n\n```php\n// 返回 \"\
  ASz\" (string 类型)\nstr('Àž')->ascii();\n```\n\n### 5.2 生成摘要\n\n#### excerpt 方法签名\n\
  \n```php\n/**\n * Version: Laravel 9\n * @return string|null\n */\npublic static\
  \ function excerpt(\n    string $text,\n    int $length = 40,\n    string $connector\
  \ = '...',\n    bool $collapse = true\n);\n```\n\n`excerpt` 方法用于从文本中截取摘要。你可以通过 `$length`\
  \ 参数指定截取的最大字符长度，通过 `$connector` 参数指定摘要末尾的连接符。如果 `$collapse` 设置为 `true`（默认值），方法会在单词边界截断，以确保单词的完整性。\n\
  \n示例：\n\n```php\n$text = 'The quick brown fox jumps over the lazy dog';\n\nStr::excerpt($text,\
  \ 20); // 返回 \"The quick brown fox...\"\n\nStr::excerpt($text, 20, '...', false);\
  \ // 返回 \"The quick brown fo...\"\n```\n\n\n\n\n\n```php\n<?php\n\n/**\n * Versions:\
  \ Laravel 8, 9\n *\n * @return string\n */\npublic static function limit(\n    string\
  \ $value,\n    int $limit = 100,\n    string $end = '...'\n);\n```\n\n你可以使用 `limit`\
  \ 辅助方法在提供的值超过某些限制时对其截断。默认限制为 100 个字符，但你可以通过提供 `$limit` 参数的值来更改它。\n\n如果字符串超过了配置的限制，会在最终字符串后附加一个\
  \ `end` 字符串（默认为 `...`）。如果原始字符串没有超过限制，将返回原始字符串。\n\n以下示例将利用 [`stillat.com/blog/2021/12/12/creating-a-content-reaction-system-with-statamic-3-and-antlers:`](https://stillat.com/blog/2021/12/12/creating-a-content-reaction-system-with-statamic-3-and-antlers:)\
  \ 中的内容。\n\n图 5.19\n\n```php\n<?php\n\n$text = <<<TEXT\nTaking a look at the current\
  \ state of our Antlers partial, we can see\na lot of duplicate code starting to\
  \ emerge. This problem will only\nget worse over time since we will be referencing\
  \ those field names\nin a few places: once to create the buttons to submit a reaction,\n\
  and again to indicate what kinds of reactions have already been left.\nTEXT;\n```\n\
  \n使用该方法的默认值，下面的代码示例：\n\n图 5.20\n\n```php\n<?php\n\nuse Illuminate\\Support\\Str;\n\
  \nStr::limit($text);\n```\n\n将产生此结果：\n\n图 5.21\n\n```\nTaking a look at the current\
  \ state of our Antlers partial, we can see\na lot of duplicate code starti...\n\
  ```\n\n我们可以通过修改 `limit` 和 `end` 参数的默认值来控制 `limit` 方法的输出：\n\n图 5.22\n\n```php\n<?php\n\
  \nuse Illuminate\\Support\\Str;\n\n// Returns \"Taking a l...\"\nStr::limit($text,\
  \ 10);\n\n// 以下两个示例都返回：\n// \"Taking a l... [Read More]\"\nStr::limit($text, 10,\
  \ '... [Read More]');\n\nstr($text)\n    ->limit(10, '... [Read More]')\n    ->toString();\n\
  ```\n\n### 5.6 遮蔽字符串部分\n\n图 5.23 mask 方法方法签名\n\n```php\n<?php\n\n/**\n * Versions:\
  \ Laravel 8, 9\n *\n * @return string\n */\npublic static function mask(\n    string\
  \ $string,\n    string $character,\n    int $index,\n    int|null $length = null,\n\
  \    string $encoding = 'UTF-8'\n);\n```\n\n`mask` 辅助方法是一个简单而实用的字符串操作。我们可以使用此方法来隐藏或遮蔽现有字符串的部分。该方法最常见的应用之一仅存储和显示信用卡号的最后四位：\n\
  \n图 5.24\n\n```php\n<?php\n\nuse Illuminate\\Support\\Str;\n\n// Returns \"************4242\"\
  \nStr::mask(\n    '42424242424242',\n    '*',\n    0,\n    -4\n);\n```\n\n在上一个示例中，我们使用了几个参数。我们通过为\
  \ `index` 参数提供 `0` 来指示遮蔽应从第一个字符开始。`length` 参数的 `-4` 将导致我们的遮蔽持续到最后四个字符，留下其余部分不被遮蔽。\n\
  \n另一个使用这些参数的示例，让我们遮蔽同一个示例信用卡除第一个字符和最后四个字符以外的所有内容：\n\n图 5.25\n\n```php\n<?php\n\n\
  use Illuminate\\Support\\Str;\n\n// Returns \"************4242\"\nStr::mask(\n \
  \   '42424242424242',\n    '*',\n    1,\n    -4\n);\n```\n\n或者，我们可以使用正长度来达到相同的效果：\n\
  \n图 5.26\n\n```php\n<?php\n\n// Returns \"************4242\"\nstr('42424242424242')\n\
  \    ->mask('*', 1)\n    ->toString();\n```\n\n#### 你可能不会存储信用卡号\n\n到为止，我们一直使用示例信用卡号来实验\
  \ `mask` 辅助方法。我选择信用卡号是因为它们很容易直观地观察 `mask` 辅助方法的行为。尽管如此，我应该指出，如果可能，你不应该存储信用卡或类似的信息。对于这类信息，对你和你的用户来说，尽可能少地保留信息（例如信用卡号的最后四位），并使用其他辅助方法来生成预期的表示：\n\
  \n图 5.27\n\n```php\n<?php\n\nuse Illuminate\\Support\\Str;\n\n// Returns \"************4242\"\
  \nStr::padLeft(42424242424242, 16, '*');\n```\n\n处理完这些之后，`mask` 辅助方法在哪些用例下有用？\n\n\
  我想到的第一个用例是当你的应用程序存储敏感数据时，例如第三方 API 密钥。在这些情况下，显示掩后的 API 密钥通常是理想的，可以帮助用户管理关联的凭据。在这些情况下，显示掩后的\
  \ API 密钥通常是必要的，有助于用户管理关联的凭据。### 5.7 生成随机字符串\n\n图 5.28 random 方法签名\n\n```php\n<?php\n\
  \n/**\n * Versions: Laravel 8, 9\n *\n * @return string\n */\npublic static function\
  \ random(\n    int $length = 16\n);\n```\n\n你可以使用 `random` 辅助方法生成任意长度的随机字符串（默认情况下，该方法将使用\
  \ PHP 的 `random_bytes` 函数生成加密安全的伪随机字节）。\n\n以下两个示例都会生成 16 字符的随机字符串：\n\n图 5.29\n\n\
  ```php\n<?php\n\nuse Illuminate\\Support\\Str;\n\nStr::random(16);\nStr::random();\n\
  ```\n\n你可以通过提供自定义长度来修改随机字符串的长度：\n\n图 5.30\n\n```php\n<?php\n\nuse Illuminate\\Support\\\
  Str;\n\nStr::random(32);\n```\n\n### 5.8 从字符串中删除子串或字符\n\n图 5.31 remove 方法签名\n\n\
  ```php\n<?php\n\n/**\n * Versions: Laravel 8, 9\n *\n * @return string\n */\npublic\
  \ static function remove(\n    string|array $search,\n    string $subject\n);\n\
  ```\n\n`remove` 辅助方法简单而强大，你可以使用它从任何给定字符串中删除一个或多个值。默认情况下，删除是区分大小写的，但你可以通过为第三参数提供\
  \ `false` 值来更改这种行为。\n\n你可以通过为第一个参数提供单个字符串从主体中删除单个字符串，或通过提供字符串数组删除多个字符串。\n\n`remove`\
  \ 辅助方法的示例用例包括：\n\n*   从输入中移除路径遍历字符串\n*   简单的词汇过滤\n*   移除特殊字符\n\n下面的示例将从输入字符串移除任何指定的特殊字符：\n\
  \n图 5.32\n\n```php\n<?php\n\nuse Illuminate\\Support\\Str;\n\n$specialCharacters\
  \ = [\n    '!', '@', '#', '$', '%', '^',\n    '&', '*', '(', ')', '-', '?'\n];\n\
  \n// Returns \"Hello\"\nStr::remove(\n    $specialCharacters,\n    'Hello!?!',\n\
  );\n```\n\n链式字符串也提供了 `remove` 方法：\n\n图 5.33\n\n```php\n<?php\n\n// 执行区分大小写的删除。\n\
  // Returns \"Hello, world!\"\n(string) str('Hello, world!')\n    ->remove(', WORLD');\n\
  \n// 执行不区分大小写的删除。\n// Returns \"Hello!\"\n(string) str('Hello, world!')\n    ->remove(',\
  \ WORLD', false);\n```\n\n### 5.9 重复字符串和字符\n\n图 5.34 repeat 方法签名\n\n\n\n\n\n```php\n\
  <?php\n\n/**\n * Versions: Laravel 8, 9\n *\n * @return string\n */\npublic static\
  \ function repeat(\n    string $string,\n    int $times\n);\n```\n\n你可以使用 `repeat`\
  \ 辅助方法将输入字符串重复指定的次数。例如，以下代码示例将返回值“**********”：\n\n图 5.35 \n\n```php\n<?php\n\nuse\
  \ Illuminate\\Support\\Str;\n\nStr::repeat('*', 10);\n\n(string) str('*')\n    ->repeat(10);\n\
  ```\n\n下面是一个更复杂的示例，它使用 `repeat` 辅助方法递归地漂亮化打印目录列表：\n\n图 5.36 \n\n```php\n<?php\n\n\
  use Illuminate\\Support\\Str;\n\nfunction printDirectory($directory, $depth = 1)\n\
  {\n    $ouptut = '';\n    $ignoreFiles = ['.', '..'];\n\n    if ($depth == 1) {\n\
  \        $ouptut = '/' . basename($directory);\n    } else {\n        $ouptut =\
  \ Str::repeat(' ', $depth) . '/' . basename($directory);\n    }\n\n    $ouptut .=\
  \ collect(scandir($directory))\n        ->filter(function ($file) use ($ignoreFiles)\
  \ {\n            return !in_array($file, $ignoreFiles);\n        })->join(function\
  \ ($item) use ($directory, $depth) {\n            $fullPath = $directory . '/' .\
  \ $item;\n\n            if (is_dir($fullPath)) {\n                return \"\\n\"\
  \ . printDirectory($fullPath, $depth + 1);\n            } else {\n             \
  \   return \"\\n\" . Str::repeat(' ', $depth) . ' - ' . $item;\n            }\n\
  \        });\n\n    return $ouptut;\n}\n```\n\n`printDirectory` 函数从目录中检索所有文件和文件夹，并使用\
  \ `repeat` 辅助方法在文件或目录名称之前添加空格。当我们递归调用该函数时，每次都会增加 `depth`，从而在最终输出中使嵌套列表缩进。\n\n例如，如果我们在一个全新的\
  \ Laravel 安装的资源路径上调用此函数：\n\n图 5.37 \n\n```php\n<?php\n\necho printDirectory(resource_path());\n\
  ```\n\n输出将是：\n\n图 5.38 \n\n```text\n/resources\n  /css\n   - app.css\n  /js\n  \
  \  - app.js\n    - bootstrap.js\n  /views\n    - welcome.blade.php\n```\n\n对于 public\
  \ 目录：\n\n图 5.39 \n\n```text\n/public\n  - .htaccess\n  - favicon.ico\n  - index.php\n\
  \  - robots.txt\n```\n\n### 5.10 替换子字符串\n\n图 5.40 `replace` 方法签名\n\n```php\n<?php\n\
  \n/**\n * Versions: Laravel 8, 9\n *\n * @return string\n */\npublic static function\
  \ replace(\n    string[] $search,\n    string[] $replace,\n    string[] $subject\n\
  );\n```\n\n`replace` 辅助方法可以在现有字符串中查找并替换字符串。你还可以使用此方法替换单个值中的多个字符串，或在许多值中跨值替换多个字符串。\n\
  \n`replace` 辅助方法适用于（但不限于）：\n- 规范化文件分隔符\n- 将换行符替换为 HTML 元素\n- 动态修改 PHP 字符串\n\n以下示例演示了使用\
  \ `replace` 辅助方法对单个字符串进行简单替换：\n\n图 5.41 \n\n```php\n<?php\n\nuse Illuminate\\Support\\\
  Str;\n\n// 返回 \"working_dynamic_variables\"\nStr::replace(\n    '-',\n    '_',\n\
  \    'working-dynamic-variables'\n);\n```\n\n流式链字符串（Fluent strings）也提供了 `replace`\
  \ 方法。以下示例产生与之前的代码相同的结果：\n\n图 5.42 \n\n```php\n<?php\n\n// 返回 \"working_dynamic_variables\"\
  \nstr('working-dynamic-variables')\n    ->replace('-', '_')\n    ->toString();\n\
  ```\n\n我们可以搜索多个字符串并将所有出现的地方替换为单个值。以下示例使用了此技术来规范路径中的目录分隔符。此示例的准确输出取决于运行代码的系统；在我的系统上，它返回\
  \ `/some/path/`：\n\n图 5.43 \n\n```php\n<?php\n\nuse Illuminate\\Support\\Str;\n\n\
  Str::replace(\n    ['\\\\ '/'],\n    DIRECTORY_SEPARATOR,\n    '/some/path/'\n);\n\
  ```\n\n我们也可以为 `search` 和 `replace` 参数提供数组。数组的值将配对并用于执行替换。这样做可以减少对 `replace` 方法的重复调用。例如，考虑以下对\
  \ `replace` 方法的调用：\n\n图 5.44 \n\n```php\n<?php\n\nuse Illuminate\\Support\\Str;\n\
  \n$text = <<<TEXT\nHello, there,\nPlease email@example.org\nThanks!\nTEXT;\n\n$result\
  \ = Str::replace(\n    '@',\n    '[at]',\n    $text\n);\n\n$result = Str::replace(\n\
  \    \"\\n\",\n    '<br />',\n    $result\n);\n```\n\n我们可以将这些调用重构为如下的单次调用：\n\n图\
  \ 5.45 \n\n```php\n<?php\n\nuse Illuminate\\Support\\Str;\n\nStr::replace(\n   \
  \ ['@', \"\\n\"],\n    ['[at]', '<br />'],\n    $text\n);\n```\n\n我们还可以提供数组作为 `search`\
  \ 和 `replace` 参数。最后，我们还可以提供字符串数组作为值来替换：\n\n图 5.46 \n\n```php\n<?php\n\nuse Illuminate\\\
  Support\\Str;\n\n$addresses = [\n    'address1@example.org',\n    'address2@example.org',\n\
  \    'address3@example.org',\n];\n\nStr::replace(\n    '@',\n    '[at]',\n    $addresses\n\
  );\n```\n\n这将返回以下值：\n\n图 5.47 \n\n```text\n[\n    \"address1[at]example.org\",\n\
  \    \"address2[at]example.org\",\n    \"address3[at]example.org\"\n]\n```\n\n###\
  \ 5.11 顺序替换字符串中的字符串\n\n图 5.48 `replaceArray` 方法签名\n\n```php\n<?php\n\n/**\n * Versions:\
  \ Laravel 8, 9\n *\n * @return string\n */\npublic static function replaceArray(\n\
  \    string $search,\n    array<int, string> $replace,\n    string $subject\n);\n\
  ```\n\n应用程序可以使用 `replaceArray` 辅助方法从数组顺序替换字符串。该辅助方法通常用于构造 SQL 查询，但也可以用于任何情况，包括创建\
  \ URL 或作为用户模板字符串的简单方法。\n\n传递给 `replaceArray` 辅助方法的第一个参数将是方法要在目标字符串中替换的值（`subject`）。第二个参数将是包含用于替换占位符值的数组。`search`\
  \ 字符串的第一次出现由 `replace` 数组的第一个元素替换，数组的第二个元素将替换第二个出现处，依此类推。\n\n以下示例演示了 `replaceArray`\
  \ 方法的行为：\n\n图 5.49 \n\n```php\n<?php\n\nuse Illuminate\\Support\\Str;\n\n// 返回 \"\
  1 2 3\"\nStr::replaceArray(\n    '?',\n    [1, 2, 3],\n    '? ? ?'\n);\n```\n\n\
  你也可以在流式字符串实例上使用 `replaceArray` 方法：\n\n图 5.50 \n\n```php\n<?php\n\n// 返回 \"1 2 3\"\
  \nstr('? ? ?')\n    ->replaceArray(\n      '?', [1, 2, 3]\n    )\n    ->toString();\n\
  ```\n\n如果 `search` 字符串的出现次数多于替换值，`replaceArray` 辅助方法不会替换剩余的搜索字符串：\n\n图 5.51 \n\n\
  ```php\n<?php\n\n// 返回 \"1 2 ?\"\nstr('? ? ?')\n    ->replaceArray(\n      '?',\
  \ [1, 2]\n    )\n    ->toString();\n```\n\n同样，如果*没有*替换值，则 `search` 字符串的所有出现处都不会被替换：\n\
  \n图 5.52 \n\n```php\n<?php\n\n// 返回 \"? ? ?\"\nstr('? ? ?')\n    ->replaceArray(\n\
  \      '?', []\n    )\n    ->toString();\n```\n\n### 5.12 替换第一个出现的子字符串或字符\n\n图 5.53\
  \ `replaceFirst` 方法签名 \n\n\n\n\n\n```php\n<?php\n\n/**\n * Versions: Laravel 8,\
  \ 9\n *\n * @return string\n */\npublic static function replaceFirst(\n    string\
  \ $search,\n    string $replace,\n    string $subject\n);\n```\n\n你可以使用 `replaceFirst`\
  \ 辅助方法将字符串中首次出现的某个替换为另一个值。此方法在许多情况下都非常有用，包括但不限于：\n\n*   在简单模版中替换内容\n*   动态修改 URL\
  \ 协议（schemes）\n*   修改文件系统路径\n\n以下示例使用了 `replaceFirst` 辅助方法将 URL `https://stillat.com/`\
  \ 转换为不带协议的 URL：\n\n图 5.54\n\n```php\n<?php\n\nuse Illuminate\\Support\\Str;\n\n\
  // 返回 \"//stillat.com/\"\nStr::replaceFirst(\n    'https:', '',\n    'https://stillat.com/'\n\
  );\n```\n\n之前的示例也可以使用流式字符串（fluent strings）这样写：\n\n图 5.55\n\n```php\n<?php\n\nstr('https://stillat.com/')\n\
  \    ->replaceFirst('https:', '')\n    ->toString();\n```\n\n以下简单示例利用 `replaceFirst`\
  \ 方法将路径从存储路径转换为公共路径。注意 `replaceFirst` 辅助方法仅替换了 `storage/` 搜索字符串的第一个实例：\n\n图 5.56\n\
  \n```php\n<?php\n\n// 返回 \"public/users/storage/profile/\"\nstr('storage/users/storage/profile/')\n\
  \    ->replaceFirst('storage/', 'public/')\n    ->toString();\n```\n\n### 5.13 替换子字符串或字符的最后一次出现\n\
  \n图 5.57 replaceLast 方法签名\n\n```php\n<?php\n\n/**\n * Versions: Laravel 8, 9\n *\n\
  \ * @return string\n */\npublic static function replaceLast(\n    string $search,\n\
  \    string $replace,\n    string $subject\n);\n```\n\n`replaceLast` 辅助方法是 `replaceFirst`\
  \ 的相反操作。你可以用它查找某些搜索字符串的最后一次出现并将其替换为另一个值。你可以此此方法许多用途，包括但不限于：\n\n*   动态替换文件扩展名\n*\
  \   修改货币格式\n*   让错误信息更加友好\n*   修改 PHP 命名空间字符串\n\n以下示例利用 `replaceLast` 替换单个路径内的文件扩展名：\n\
  \n图 5.58\n\n```php\n<?php\n\nuse Illuminate\\Support\\Str;\n\n// 返回 \"some/video/path.png\"\
  \nStr::replaceLast(\n    '.mp4',\n    '.png',\n    'some/video/path.mp4'\n);\n```\n\
  \n流式字符串实例也提供了 `replaceLast` 方法。以下示例产生相同的输出：\n\n图 5.59\n\n```php\n<?php\n\n// 返回\
  \ \"some/video/path.png\"\nstr('some/video/path.mp4')\n    ->replaceLast('.mp4',\
  \ '.png')\n    ->toString();\n```\n\n如果我们想对 URL 数组执行同样的操作，可以使用集合（collection）来更改所有的值：\n\
  \n图 5.60\n\n```php\n<?php\n\nuse Illuminate\\Support\\Str;\n\n$videos = [\n    'course/episode_1.mp4',\n\
  \    'course/episode_2.mp4',\n    'course/episode_3.mp4',\n];\n\ncollect($videos)->map(function\
  \ ($url) {\n    return Str::replaceLast(\n        '.mp4',\n        '.png',\n   \
  \     $url\n    );\n})->all();\n```\n\n这将返回一个包含以下内容的数组：\n\n图 5.61\n\n```php\n[\n\
  \    \"course/episode_1.png\",\n    \"course/episode_2.png\",\n    \"course/episode_3.png\"\
  ,\n]\n```\n\n### 5.14 确保字符串以特定的前缀开头\n\n图 5.62 start 签名\n\n```php\n<?php\n\n/**\n\
  \ * Versions: Laravel 8, 9\n *\n * @return string\n */\npublic static function start(\n\
  \    string $value,\n    string $prefix\n);\n```\n\n`start` 辅助方法是 `finish` 方法的相反操作。它确保提供的\
  \ `value` 始终以 `prefix` 开头。在从相对路径生成绝对 URL 时，此方法非常有帮助，例如确保博客文章的 slug 始终以父级 slug 开头、构建动态类名等。\n\
  \n以下简单示例将使用类名集合，并确保所有提供的类名都以 `Illuminate\\Support\\` 命名空间开头：\n\n图 5.63\n\n```php\n\
  <?php\n\n$classes = [\n    'Illuminate\\Support\\Str',\n    'Arr',\n    'Carbon',\n\
  ];\n\ncollect($classes)->map(function ($class) {\n    return Str::start($class,\
  \ 'Illuminate\\Support\\\\');\n})->all();\n```\n\n之前的代码示例将产生以下结果：\n\n图 5.64\n\n\
  ```php\n[\n    \"Illuminate\\Support\\Str\",\n    \"Illuminate\\Support\\Arr\",\n\
  \    \"Illuminate\\Support\\Carbon\",\n]\n```\n\n以下示例将创建一个名为 `BlogPost` 的简单 PHP\
  \ 类。该博客文章类将包含 `title`、`url` 以及一个可选的父级博客文章。该类还定义了一个 `getUrl` 方法，用于为博客文章实例生成 URL。如果博客文章有父级，`getUrl`\
  \ 方法将执行一个有趣的操作。\n\n当博客文章没有父级时，我们将确保所有生成的 URL 都以 `/` 开头。然而，当存在父博客文章时，我们会调用父文章的 `getUrl`\
  \ 方法并将该值作为当前博客文章的前缀。\n\n图 5.65\n\n```php\n<?php\n\nclass BlogPost\n{\n    public\
  \ function __construct(\n        public string $title,\n        public string $url,\n\
  \        public ?BlogPost $parent = null\n    ) { }\n\n    public function getUrl()\n\
  \    {\n        return Str::start(\n            $this->url,\n            $this->parent?->getUrl()\
  \ ?? '/'\n        );\n    }\n}\n```\n\n现在有了 `BlogPost` 类，让我们创建一些实例并观察 `getUrl` 方法的行为：\n\
  \n图 5.66\n\n```php\n<?php\n\n// 创建一些博客文章。\n$postOne = new BlogPost('The First',\
  \ 'the-first');\n\n$postTwo = new BlogPost('The Second', 'the-second');\n\n$postThree\
  \ = new BlogPost('The Third', 'the-third', $postOne);\n\n$postFour = new BlogPost('The\
  \ Fourth', 'the-fourth', $postThree);\n\n// 使用集合获取所有博客文章的 URL。\ncollect([\n    $postOne,\n\
  \    $postTwo,\n    $postThree,\n    $postFour\n])->map(function (BlogPost $post)\
  \ {\n    return $post->getUrl();\n})->all();\n```\n\n上述代码示例将产生以下输出：\n\n图 5.67\n\n\
  ```php\n[\n    \"/the-first\",\n    \"/the-second\",\n    \"/the-first/the-third\"\
  ,\n    \"/the-first/the-third/the-fourth\",\n]\n```\n\n从输出的最后两个示例可以看出，可以使用 `start`\
  \ 辅助方法快速生成递归/层级 URL。\n\n### 5.15 在字符串内替换键值对的字符串\n\n图 5.68 swap 签名\n\n```php\n<?php\n\
  \n/**\n * Versions: Laravel 8, 9\n *\n * @return string\n */\npublic static function\
  \ swap(\n    array $map,\n    string $subject\n);\n```\n\n`swap` 辅助方法是替换现有字符串中值的另一种方式。`swap`\
  \ 方法接收键值对的字符串替换数组作为第一个参数，并将要替换值的字符串作为第二个参数。`swap` 方法的行为与你可能遇到的其他字符串替换方法非常不同。\n\n\
  为了突出行为差异，我们将创建一个简单的回复邮件模板函数。我们首先使用 `replace` 辅助方法来实现此函数。我们将在所有后续示例中使用以下邮件模板：\n\n\
  图 5.69\n\n```php\n<?php\n\n$emailTemplate = <<<TEMPLATE\nHello [name],\n\n感谢您的联系！我们正在处理您的请求；\n\
  在此期间，您可能发现以下资源对有帮助：\n[resources]\n\n诚挚地，\n[sender]\nTEMPLATE;\n```\n\n\n\n\n我们的邮件模板函数将接受模板、接收者姓名、指向附加资源的链接以及发送者名称。我们该函数的第一个版本可能如下所示：\n\
  \n图 5.70\n\n```php\n 1 <?php\n 2 \n3 use Illuminate\\Support\\Str;\n 4 \n5 function\
  \ renderEmailTemplate($template, $name, $resources, $sender) {\n 6     return Str::replace(\n\
  7         [ '[name]', '[resources]', '[sender]', ],\n8         [ $name, $resources,\
  \ $sender, ],\n9         $template\n10     );\n11 }\n```\n\n我们可以通过以下代码测试我们函数的输出：\n\
  \n图 5.71 \n\n```php\n1 <?php\n2 \n3 renderEmailTemplate(\n4     $emailTemplate,\n\
  5     'Alice',\n6     'https://stillat.com/blog',\n7     'Core Team'\n8 );\n```\n\
  \n我们将得到以下返回值：\n\n图 5.72 \n\n```php\n1 Hello Alice,\n2 \n3 Thank you for reaching\
  \ out! We are working to process your request;\n4 in the meantime, you may find\
  \ the following resources helpful:\n5 https://stillat.com/blog\n6 \n7 Sincerely,\n\
  8 Core Team\n```\n\n这种方法的问题在于，如果我们的输入中包含了模板的占位符，传统的字符串替换方法将会替换它们，因为 `replace` 辅助方法会遍历替换列表。接接的示例调用了\
  \ `renderEmailTemplate` 函数，但在名称中使用了模板的占位符之一：\n\n图 5.73 \n\n```php\n1 <?php\n2 \n\
  3 renderEmailTemplate(\n4     $emailTemplate,\n5     '[resources] Director',\n6\
  \     'https://stillat.com/blog',\n7     'Core Team'\n8 );\n```\n\n这产生了以下结果：\n\n\
  图 5.74 \n\n```php\n1 Hello https://stillat.com/blog Director,\n2 \n3 Thank you for\
  \ reaching out! We are working to process your request;\n4 in the meantime, you\
  \ may find the following resources helpful:\n5 https://stillat.com/blog\n6 \n7 Sincerely,\n\
  8 Core Team\n```\n\n虽然这看起来可能无害，但根据模板系统的实现，这种行为可能会导致难以诊断的 bug 或异常，甚至可能被用于获取敏感信息。\n\
  \n为了规避这种行为，我们可以使用 `swap` 辅助方法重新实现我们的邮件模板函数。`swap` 辅助方法将像以前一样替换我们的模板占位符，但重要的是——它*不会*替换插入文本中的值值。\n\
  \n图 5.75 \n\n```php\n 1 <?php\n 2 \n3 use Illuminate\\Support\\Str;\n 4 \n5 function\
  \ renderEmailTemplate($template, $name, $resources, $sender) {\n 6     return Str::swap(\n\
  \ 7         [\n8             '[name]' => $name,\n9             '[resources]' =>\
  \ $resources,\n10             '[sender]' => $sender,\n11         ],\n12        \
  \ $template\n13     );\n14 }\n```\n\n使用我们重构后的函数，我们可以再次使用问题输入进行调用。但改用 `swap` 辅助方法后，我们现在得到了预期的输出：\n\
  \n图 5.76\n\n```text\n1 Hello [resources] Director,\n2 \n3 Thank you for reaching\
  \ out! We are working to process your request;\n4 in the meantime, you may find\
  \ the following resources helpful:\n5 https://stillat.com/blog\n6 \n7 Sincerely,\n\
  8 Core Team\n```\n\n`swap` 方法也可用于链式字符串实例；我们可以按如下方式重写上一个示例：\n\n图 5.77 \n\n```php\n\
  1 <?php\n2 \n3 function renderEmailTemplate($template, $name, $resources, $sender)\
  \ {\n4     return str($template)->swap([\n5         '[name]' => $name,\n6      \
  \   '[resources]' => $resources,\n7         '[sender]' => $sender,\n8     ])->toString();\n\
  9 }\n```\n\n当 `swap` 辅助方法处理替换时，它会根据键的长度处理替换映射，从最长的开始。由于这种原因，以下方法调用是等价的：\n\n图 5.78\
  \ \n\n```php\n1 <?php\n2 \n3 use Illuminate\\Support\\Str;\n 4 \n5 Str::swap([\n\
  6         '[name]' => $name,\n7         '[sender]' => $sender,\n8         '[resources]'\
  \ => $resources,\n9     ],\n10     $template\n11 );\n12 13 Str::swap([\n14     \
  \    '[resources]' => $resources,\n15         '[sender]' => $sender,\n16       \
  \  '[name]' => $name,\n17     ],\n18     $template\n19 );\n```\n\n（注：由于原文在图 5.78\
  \ 之后的内容在提供的输入中缺失，译文也至此结束。）\n\n\n\n\n`afterLast` 辅助方法与 `after` 辅助方法类似，它们都可以用于检索字符串中某个字符或子字符串（即\
  \ `$search` 字符串）之后的部分。`afterLast` 辅助方法的区别在于，它将返回字符串中出现在提供的搜索字符串*最后*出现位置之后的部分。\n\n\
  `afterLast` 辅助方法可以通过指定将 `/` 为搜索字符串来检索文件路径的最后部分：\n\nFigure 6.5 \n\n```php\n1 <?php\n\
  2 \n3 use Illuminate\\Support\\Str;\n4 \n5 \n6 // Returns \"name'\n7 Str::afterLast('var/path/directory/name',\
  \ '/');\n```\n\n我们也可以在流式字符串实例上使用 `afterLast` 方法：\n\nFigure 6.6 \n\n```php\n1 <?php\n\
  2 \n3 // Returns \"name\"\n4 (string) str('var/path/directory/name')\n5     ->afterLast('/');\n\
  6 \n7 // Returns \"Third\"\n8 (string) str('First, Second, Third')\n9     ->afterLast(',')->trim();\n\
  ```\n\n### 6.3 返回另一个字符串或字符之前的字符串部分\n\nFigure 6.7 before Method Signature \n\n```php\n\
  \ 1 <?php\n 2 \n3 /**\n4  * Versions: Laravel 8, 9\n5  *\n6  * @return string\n\
  7  */\n8 public static function before(\n 9     string $subject,\n10     string\
  \ $search\n11 );\n```\n\n`before` 辅助方法可返回字符串中首次出现搜索字符串或单个字符之前的部分。\n\n此方法可以帮助解析 URL\
  \ 查询字符串，或者快速查找出现在某个字符之前的子字符串。该方法是 `after` 辅助方法的逻辑反向操作。\n\n以下示例使用 `before` 方法返回字符串中在第一个\
  \ `?` 字符出现之前的内容：\n\nFigure 6.8 \n\n```php\n1 <?php\n2 \n3 use Illuminate\\Support\\\
  Str;\n4 \n5 // Returns \"https://stillat.com\"\n6 Str::before('https://stillat.com?ref=newsletter',\
  \ '?');\n```\n\n我们也可以在流式字符串实例上调用 `before` 方法：\n\nFigure 6.9 \n\n```php\n1 <?php\n\
  2 \n3 // Returns \"https://stillat.com\"\n4 (string) str('https://stillat.com?ref=newsletter')\n\
  5     ->before('?');\n6 \n7 // Returns \"Stop\"\n8 (string) str('Stop. Hammer time.')\n\
  9     ->before('.');\n```\n\n### 6.4 检索子字符串或字符最后出现之前的所有内容\n\nFigure 6.10 beforeLast\
  \ Method Signature \n\n```php\n 1 <?php\n 2 \n3 /**\n4  * Versions: Laravel 8, 9\n\
  5  *\n6  * @return string\n7  */\n8 public static function beforeLast(\n 9     string\
  \ $subject,\n10     string $search\n11 );\n```\n\n`beforeLast` 辅助方法将返回字符串中出现在给定搜索字符串*最后*出现位置之前的所有内容。将此行为与\
  \ `before` 辅助函数对比，后者将返回搜索字符串*首次*出现之前的所有内容。\n\n以下示例利用 `beforeLast` 辅助方法返回提供的路径中出现在最后一个目录分隔符字符之前的所有内容：\n\
  \nFigure 6.11 \n\n```php\n1 <?php\n2 \n3 use Illuminate\\Support\\Str;\n4 \n5 //\
  \ Returns \"/some/path\"\n6 Str::beforeLast('/some/path/', '/');\n```\n\n作为流式字符串辅助方法的一个示例，以下示例将返回\
  \ PHP 类的命名空间：\n\nFigure 6.12 \n\n```php\n1 <?php\n2 \n3 // Returns \"Illuminate\\\
  Support\"\n4 (string) str('Illuminate\\Support\\Str')->beforeLast('\\\\');\n```\n\
  \n### 6.5 检索两个搜索字符串之间的内容\n\nFigure 6.13 between Method Signature \n\n```php\n 1\
  \ <?php\n 2 \n3 /**\n4  * Versions: Laravel 8, 9\n5  *\n6  * @return string\n7 \
  \ */\n8 public static function between(\n 9     string $subject,\n10     string\
  \ $from,\n11     string $to\n12 );\n```\n\n`between` 辅助方法很有意思，因为它允许你检索字符串中两个其他搜索字符串*之间*（“from”和“to”搜索字符串）的部分。\n\
  \n以下示例使用 `between` 方法返回位于已知根目录和最后一个目录分隔符之间的目录部分：\n\nFigure 6.14 \n\n```php\n1 <?php\n\
  2 \n3 use Illuminate\\Support\\Str;\n4 \n5 // Returns \"some/nested/directory\"\n\
  6 Str::between('/root/path/some/nested/directory/',\n7 \t'/root/path/', '/');\n\
  ```\n\n为了演示此辅助方法的流式字符串版本，并展示它在广泛情况下的作用（而不仅仅是枯燥的文件系统路径），以下代码将返回王子在公主吻他后变成了什么：\n\n\
  Figure 6.15 \n\n```php\n1 <?php\n2 \n3 // Returns \"prince\"\n4 (string) str(\"\
  The princess kissed the frog\n5               and it turned into a\n6     ->between('');\n\
  ```\n\n### 6.6 检索两个搜索字符串之间的最小内容\n\nFigure 6.16 betweenFirst Signature \n\n```php\n\
  \ 1 <?php\n 2 \n3 /**\n4  * Versions: Laravel 8, 9\n5  *\n6  * @return string\n\
  7  */\n8 public static function between(\n 9     string $subject,\n10     string\
  \ $from,\n11     string $to\n12 );\n```\n\n`betweenFirst` 辅助方法将返回两个搜索字符串（即 `$from`\
  \ 和 `$to` 参数）之间的最小内容。\n\n以下示例使用 `betweenFirst` 方法返回路径中出现在已知根目录之前的字符串：\n\nFigure\
  \ 6.17 \n\n```php\n1 <?php\n2 \n3 use Illuminate\\Support\\Str;\n4 \n5 // Returns\
  \ \"/some/path\"\n6 Str::betweenFirst('/root/path/some/path/', '/root/path/');\n\
  ```\n\n我们也可以在流式字符串实例上调用 `betweenFirst` 方法：\n\nFigure 6.18 \n\n```php\n1 <?php\n\
  2 \n3 // Returns \"some\"\n4 (string) str('/root/path/some/path/')\n5     ->between('/');\n\
  ```\n\n### 6.7 限制字符串中的单词数\n\nFigure 6.19 words Signature \n\n```php\n 1 <?php\n\
  \ 2 \n3 /**\n4  * Versions: Laravel 8, 9\n5  *\n6  * @return string\n7  */\n8 public\
  \ static function words(\n 9     string $value,\n10        int $words = 100,\n11\
  \     string $end = '')\n12 );\n```\n\n`words` 辅助方法与 `limit` 方法类似，但它不是限制字符，而是限制返回的单词数。\n\
  \n以下示例演示了 `words` 方法的用法：\n\nFigure 6.20 \n\n```php\n1 <?php\n2 \n3 use Illuminate\\\
  Support\\Str;\n4 \n5 // Returns \"Hello...\"\n6 Str::words('Hello there!', 2);\n\
  7 \n8 // Returns \"Hello [More]\"\n9 Str::words('Hello there!', 2, ' [More]');\n\
  ```\n\n我们在流式字符串上使用 `words` 方法：\n\nFigure 6.21 \n\n```php\n1 <?php\n2 \n3 // Returns\
  \ \"Hello...\"\n4 (string) str('Hello there!')\n5     ->words(2);\n```\n\n### 6.8\
  \ 获取字符串的片段\n\nFigure 6.22 substr Signature \n\n```php\n 1 <?php\n 2 \n3 /**\n4 \
  \ * Versions: Laravel 8, 9\n5  *\n6  * @return string\n7  */\n8 public static function\
  \ substr(\n 9       string $string,\n10          int $start,\n11     int|null $length\
  \ = null\n12 );\n```\n\n你可以使用 `substr` 辅助方法获取现有字符串的片段。该辅助方法定义了一个起始参数和一个可选长度参数。\n\
  \n如果起始值为正，方法将返回从原始字符串该位置开始的文本。如果没有提供长度或长度大于剩余文本，`substr` 方法将返回起始位置的所有文本。\n\n当起始值为负数时，将从输入字符串*末尾*返回相应数量的字符。\n\
  \n以下示例演示了 `substr` 辅助方法的的基本用法：\n\nFigure 6.23 \n\n```php\n1 <?php\n2 \n3 use Illuminate\\\
  Support\\Str;\n4 \n5 $testString = '0123456789';\n6 \n7 // Returns \"56789\"\n8\
  \ Str::substr($testString, 5);\n9 \n10 // Returns \"6789\"\n11 Str::substr($testString,\
  \ 6);\n12 \n13 // Returns \"67\"\n14 Str::substr($testString, 6, 2);\n```\n\n`substr`\
  \ 方法也可以在流式字符串上调用。在以下示例中，`substr` 方法用于检索字符串的最后两个字符：\n\nFigure 6.24 \n\n```php\n1\
  \ <?php\n2 \n3 // Returns \"89\"\n4 (string) str('0123456789')\n5     ->substr(-2);\n\
  ```\n\n\n\n\n在这个示例中，它被用于获取倒数第二个字符：\n\n图 6.25 \n\n```\n1 <?php\n2 \n3 // 返回 \"8\"\
  \n4 (string) str('0123456789')\n5     ->substr(-2, 1);\n```\n\n获取另一个值的子字符串的一个日常用例，是简化用户界面中复杂/伪随机信息的显示。其中一个例子是大多数开发者都熟悉的，即缩短\
  \ git 提交哈希（commit hashes）。以下示例获取了 git 提交哈希的第一部分并显示给终端用户，类似于 GitHub 用户界面显示缩短的提交哈希的方式：\n\
  \n图 6.26 \n\n```\n1 <?php\n2 \n3 // 返回 \"3b649c0\"\n4 str('3b649c0e4aad6127f647cc0f3c1a037399b06461')\n\
  5     ->substr(0, 7)\n6     ->toString();\n```\n\n### 6.9 统计搜索字符串出现的次数\n\n图 6.27\
  \ `substrCount` 方法签名 \n\n```\n 1 <?php\n 2 \n 3 /**\n4  * 版本: Laravel 8, 9\n5  *\n\
  6  * @return int\n7  */\n8 public static function substrCount(\n 9       string\
  \ $haystack,\n10       string $needle,\n11          int $offset = 0,\n12     int|null\
  \ $length = null\n13 );\n```\n\n你可以使用 `substrCount` 辅助方法来统计特定字符串在某个值中出现的次数。应用程序可以使用此方法执行以下任何任务（但不限于这些任务）：\n\
  \n* 确定 IP 地址是 v4 地址还是 v6 地址。\n* 验证用户输入。\n* 检查域名是否包含至少特定数量的部分。\n* 确定文件是否包含特定内容或 PHP\
  \ 标签。\n\n以下示例通过检测 `:` 字符的存在，来检查提供的字符串是否为 IP v4 或 v6 地址：\n\n图 6.28 \n\n```\n 1 <?php\n\
  \ 2 \n 3 use Illuminate\\Support\\Str;\n 4 \n 5 function isIpv6($address) {\n 6\
  \     return Str::substrCount($address, ':') > 0;\n 7 }\n 8 \n 9 \n10 // 返回 \"true\"\
  \n11 isIpv6('0:0:0:0:0:0:0:1');\n12 \n13 // 返回 \"false\"\n14 isIpv6('127.0.0.1');\n\
  ```\n\n`substrCount` 辅助方法定义了几个你可以用于修改其行为的参数。以下示例使用了 `offset` 参数，它指定了从字符串的哪个点开始计算子字符串。此示例统计了已知\
  \ PHP 根命名空间之后出现的 `\\` 字符的数量，以确定嵌套命名空间的数量：\n\n图 6.29 \n\n```\n 1 <?php\n 2 \n 3 use\
  \ Illuminate\\Support\\Str;\n 4 \n 6 // 返回 \"2\"\n 7 Str::substrCount(\n 8     'Illuminate\\\
  Database\\Console\\Migrations',\n 9     '\\\\',\n10     Str::length('Illuminate\\\
  Database')\n10 );\n```\n\n我们也可以使用流式字符串（fluent strings）重写之前的示例：\n\n图 6.30 \n\n```\n\
  1 <?php\n2 \n3 str('Illuminate\\Database\\Console\\Migrations')\n4     ->substrCount(\n\
  5       '\\\\', str('Illuminate\\Database')->length());\n```\n\n我们还可以指定负数的起始偏移量（offset），使搜索从字符串的末尾开始。以下示例还使用了\
  \ `length` 参数，以确保方法只查看单个字符：\n\n图 6.31 \n\n```\n 1 <?php\n 2 \n 3 use Illuminate\\\
  Support\\Str;\n 4 \n 6 // 返回 \"1\"\n 7 Str::substrCount(\n 8     'some/path.png',\n\
  \ 9     '.', // 要统计的字符。\n10     -4,  // 从末尾开始数 4 个字符。\n11      1   // 只搜索一个字符。\n\
  12 );\n```\n\n### 6.10 在现有字符串的部分替换字符串\n\n图 6.32 `substrReplace` 方法签名 \n\n```\n 1\
  \ <?php\n 2 \n 3 /**\n4  * 版本: Laravel 8, 9\n5  *\n6  * @return string|array\n7\
  \  */\n8 public static function substrReplace(\n 9       string|array $string,\n\
  10       string|array $replace,\n11          array|int $offset = 0,\n12     array|int|null\
  \ $length = null\n13 );\n```\n\n`substrReplace` 辅助方法是一个很有意思。在高级别，可以使用它来替换现有字符串的部分。这个解释可能有点困惑，所以我们可以将其认为它能够执行以下操作（以及更多）：\n\
  \n* 在特定位置向当前字符串插入文本\n* 在现有字符串的特定位置替换文本\n* 在执行字符串替换时跳过字符串的某些\n\n在以下示例中，我们将使用 `substrReplace`\
  \ 辅助方法通过提供 `-1` 作为参数来替换字符串的最后一个字符。当我们的 `offset` 为负数时，会导致 `substrReplace` 方法从字符串的末尾开始：\n\
  \n图 6.33 \n\n```\n 1 <?php\n 2 \n 3 use Illuminate\\Support\\Str;\n 4 \n 5 // 返回\
  \ \"world.\"\n6 Str::substrReplace(\n      'Hello, world!',\n 8     '.',\n 9   \
  \  -1\n10 );\n```\n\n以下示例使用了 `offset` 和 `length` 参数来控制 `substrReplace` 方法的行为：\n\n\
  图 6.34 \n\n```\n 1 <?php\n 2 \n 3 use Illuminate\\Support\\Str;\n 4 \n 5 // 返回 \"\
  Hello_world!\"\n6 Str::substrReplace(\n 7     'Hello, world!',\n 8     '_',\n 9\
  \     5,\n10    2\n11 );\n```\n\n找到从索引 5 开始长度为 2 的子字符串；这定位了 `, ` 序列。将 `, ` 序列替换为\
  \ `_`。流式字符串也提供了 `substrReplace` 方法。我们可以这样使用流式字符串重写之前的示例：\n\n```\n1 <?php\n2 \n3\
  \ // 返回 \"Hello_world!\"\n4 str('Hello, world!')\n5     ->substrReplace('_', 5,\
  \ 2)\n6     ->toString();\n\n开发者似乎通精通为微小任务过度设计自动化解决方案。为了保持这种传统，假设由于某种原因，我们有很多类似于下面的\
  \ BASIC 程序：\n\n图 6.36 \n\n```\n1 <?php\n2 \n3 $basicProgram = <<<PROGRAM\n4 05 LET\
  \ NUMBERONE = 10\n5 10 LET NUMBERTWO = 20\n6 15 LET RESULT = NUMBERONE + NUMBERTWO\n\
  7 20 PRINT RESULT\n8 PROGRAM;\n```\n\n现在，我们需要一个简单的任务来过度设计一个解决方案。假设我们需要对所有的 BASIC\
  \ 程序执行以下操作：\n\n* 将所有的数字 `10` 替换为 `30.`\n* 将所有的数字 `20` 替换为 `50`\n* 不要行号标签中替换这些数字。\n\
  \n为了执行这些操作，我们可以使用典型的字符串替换方法，但 BASIC 程序每行开行的行号会带来问题。为了克服这些挑战，我们可以执行几个任务来完成替换操作：\n\
  \n1. 规范化程序的换行符，以适应不同的换行样式\n2. 将我们的程序字符串分割为代表程序每一行的数组\n3. 遍历程序的每一行，并在行号之后的行文本上执行我们的替换（我们假设行号始终是前三个字符）\n\
  4. 将程序的行重新组合成单个字符串\n\n我们可以利用几个 Laravel 辅助方法和 PHP 函数来创建实现：\n\n图 6.37 \n\n\n\n\n\n\
  ```php\n 1 <?php\n 2 \n 3 // 标准化我们输入程序的行结束符。\n 4 $normalized = preg_replace(\"/\\\
  r\\n|\\r|\\n/\", \"\\n\", $basicProgram);\n 5 \n 6 // 将程序转换为单行的数组。\n 7 $lines =\
  \ explode(\"\\n\", $normalized);\n 8 \n 9 collect($lines)->map(function ($line)\
  \ {\n10     return str($line)\n11       // 使用 substrReplace 方法\n12       // 替换行中第三个字符\n\
  13       // 之后的内容。\n14       ->substrReplace(\n15           // 获取第三个字符之后的所有内容\n\
  16           // 并替换行中的数字。\n17           str($line)->substr(3)\n18 \t  >\t\t->replace(['10',\
  \ '20'], ['30', '50']),\n19           // 在行号之后执行替换。\n20           3\n21        \
  \ );\n22 })->join(\"\\n\");\n```\n\n产生如下结果：\n\n图 6.38 \n\n```\n1 05 LET NUMBERONE\
  \ = 30\n2 10 LET NUMBERTWO = 50\n3 15 LET RESULT = NUMBERONE + NUMBERTWO\n4 20 PRINT\
  \ RESULT\n```\n\n## 7. 字符串填充 (Padding Strings)\n\n字符串填充是一种常用技术，通常用于在视觉上帮助格式化显示或对齐信息。字符串填充的一个日常用例是在数字前后添加尾零或前导零，但这并不是我们通过字符串填充能做的全部。\n\
  \nLaravel 提供了几个字符串填充辅助方法：\n\n* `padLeft`: 在字符串的开头（或左侧）添加填充字符。\n\n* `padRight`: 在字符串的末尾（或右侧）添加填充字符。\n\
  \n* `padBoth`: 尝试在字符串的两侧添加相同数量的填充字符，直到达到长度限制。\n\n### 7.1 填充字符串的开头\n\n图 7.1 `padLeft`\
  \ 方法签名 \n\n```php\n 1 <?php \n 2 \n 3 /**\n4  * 版本: Laravel 8, 9\n 5  *\n6  * @return\
  \ string\n7  */\n 8 public static function padLeft(\n 9     string $value,\n10 \
  \       int $length,\n11     string $pad = ' '\n12 );\n```\n\n我们可以使用 `padLeft` 辅助方法根据指定的填充字符将字符串的开头填充到特定数量的字符。下面的示例演示了\
  \ `padLeft` 辅助方法的简单用法，通常用于为发票号（或类似的数字）添加前导零：\n\n图 7.2 \n\n```php\n1 <?php\n2 \n\
  3 use Illuminate\\Support\\Str;\n4 \n5 // 返回 \"00001\"\n6 Str::padLeft(1, 5, '0');\n\
  ```\n\n需要注意的是的是，如果字符串的长度超过了指定的字符数，填充辅助方法不会对其进行截断或限制长度：\n\n图 7.3 \n\n```php\n1 <?php\n\
  2 \n3 use Illuminate\\Support\\Str;\n4 \n5 // 返回 \"123456\"\n6 Str::padLeft(123456,\
  \ 5, '0');\n```\n\n我们可以利用流式字符串（fluent strings）的条件功能，根据长度优雅地限制字符串的长度或对其进行填充：\n\n\
  图 7.4 \n\n```php\n1 <?php\n2 \n3 function printInvoiceNumber($number) {\n4     return\
  \ str($number)->when(\n5         fn($s) => $s->length() > 5,\n6         fn($s) =>\
  \ $s->substr(-4)->prepend('x'),\n7         fn($s) => $s->padLeft(5, '0')\n8    \
  \ )->toString();\n9 }\n```\n\n在之前的函数实现中，我们在流式实例上使用了 `when` 方法。我们向该方法提供了三个回调函数：\n\
  \n* 第一个回调函数包含我们的条件逻辑，并返回一个布尔值。\n\n* 第二个回调函数包含当条件逻辑返回 true 时执行的逻辑。在这种情况下，如果长度超过五个字符，我们返回字符串的最后四个字符，并在新字符串的开头添加“x”。\n\
  \n* 第三个回调函数在条件回调返回 false 时调用。在我们的示例中，它将输入字符串通过前导零填充为五个字符。\n\n我们可以用不同的输入调用我们的新函数并观察其行为：\n\
  \n图 7.5 \n\n```php\n1 <?php\n2 \n3 // 返回 \"x5467\"\n4 printInvoiceNumber(12345467);\n\
  5 \n6 // 返回 \"00003\"\n7 printInvoiceNumber(3);\n```\n\n### 7.2 填充字符串的末尾\n\n图 7.6\
  \ `padRight` 方法签名 \n\n```php\n 1 <?php\n 2 \n 3 /**\n4  * 版本: Laravel 8, 9\n 5 \
  \ *\n6  * @return string\n7  */\n 8 public static function padRight(\n 9     string\
  \ $value,\n10        int $length,\n11     string $pad = ' '\n12 );\n```\n\n我们可以使用\
  \ `padRight` 辅助方法在字符串的末尾添加填充字符，直到达到特定长度。这种方法在确保值占据固定空间方面非常有益。例如，接下来的示例将确保字符串至少占用十五字符：\n\
  \n图 7.7 \n\n```php\n1 <?php\n2 \n3 use Illuminate\\Support\\Str;\n4 \n5 // 返回 \"\
  Desk           \"\n6 Str::padRight('Desk', 15);\n7 \n8 // 返回 \"Lamp           \"\
  \n9 Str::padRight('Lamp', 15);\n10 \n11 // 返回 \"Office Printer \"\n12 Str::padRight('Office\
  \ Printer', 15);\n```\n\n许多开发者可能会尝试使用 `padRight` 方法为数字添加尾零，并尝试填充字符串的左侧。然而，接下来的示例将确保字符串至少占用十五字符：\n\
  \n图 7.8 \n\n```php\n1 <?php\n2 \n3 function printInvoiceNumber($float) {\n4    \
  \ $suffix = '00';\n5 \n6     if (Str::contains($float, '.')) {\n7         // 获取小数点之后的所有数字\n\
  8         $end = Str::afterLast($float, '.');\n9         // 将数字保留两位小数。\n10     \
  \    $end = round($end, 2);\n11         // 为我们的数字填充尾零。\n12         $suffix = Str::padRight($end,\
  \ 2, '0');\n13     }\n14 \n15     // 获取小数点之前的所有数字\n16     // 并拼接我们包含后缀的新字符串\n17\
  \     $number = Str::beforeLast($float, '.').'.$suffix;\n18 \n19     // 我们增加了一个字符以处理\n\
  20     // 小数分隔符。\n21     return Str::padLeft(\n22         $number,\n23         $length\
  \ + 1, '0'\n24     );\n25 }\n```\n\n这样调用函数可以得到预期的结果：\n\n图 7.9 \n\n```php\n1 <?php\n\
  2 \n3 // 返回 \"003.90\"\n4 printInvoiceNumber(3.9, 5);\n```\n\n现在我们可能会问：如何重构使其简化？Laravel\
  \ 框架及其辅助方法的用处在于，我们本质上仍然在使用 PHP。我们可以使用 PHP 的 `number_format` 函数大幅简化我们的函数。\n\n下面的代码示例用更少的代码实现了我们的函数以产生相同的输出。我们向\
  \ `number_format` 函数传递一个空字符串来有效地禁用千位分隔符。\n\n图 7.10 \n\n```php\n 1 <?php\n 2 \n3\
  \ use Illuminate\\Support\\Str;\n4 \n5 function padNumber($float, $length) {\n6\
  \     return Str::padLeft(\n7         number_format($float, 2, '.', ''),\n8    \
  \     // 我们增加了一个字符以处理\n9         // 小数分隔符。\n10         $length + 1, '0'\n11    \
  \ );\n12 }\n13 \n14 // 返回 \"003.90\"\n15 padNumber(3.9, 5);\n```\n\n\n\n\n在本节中，我们将介绍\
  \ `padBoth` 辅助方法，该方法可以在字符串的两端添加填充字符，直到达到指定的长度。以下示例演示了 `padBoth` 辅助方法的基本用法：\n\n图\
  \ 7.12\n\n```php\n1 <?php\n2 \n3 use Illuminate\\Support\\Str;\n4 \n5 // Returns\
  \ \"     Hello     \"\n6 Str::padBoth('Hello', 15);\n7 \n8 // Returns \"*****World*****\"\
  \n9 Str::padBoth('World', 15, '*');\n```\n\n我们可以使用 `padBoth` 辅助方法来产生一些令人兴奋的结果。在第一个示例中，我们将创建一个函数，用它来帮助打印如下所示的标题：\n\
  \n图 7.13\n\n```text\n1 ################################\n2 #######  A Fancy Title\
  \  ########\n3 ################################\n```\n\n查看示例输出，我们函数的行为将相对简单：\n\n\
  - 在标题的开头和结尾添加带有分隔符字符的行。\n- 在第二行上将我们的标题居中，并由分隔符字符包围。\n\n我们将使用 Laravel 的流式字符串类（fluent\
  \ string class）来实现我们的函数。你可能已经注意到，我们正在使用标准的字符串拼接在修剪后的标题开头结尾添加两个空格。我们可以使用 `prepend`\
  \ 和 `append` 辅助方法或 `padBoth` 辅助方法来实现。然而，在这种情况下，直接进行拼接在快速浏览示例代码时更容易理解：\n\n图 7.14\n\
  \n```php\n 1 <?php\n 2 \n3 \n4 function printHeader($title) {\n 5     $divider =\
  \ str('#')->repeat(32);\n6 \n7     return str($divider)->newLine()\n8         ->append(\n\
  9           str('  ' . str($title)->trim() . '  ')->padBoth(32, '#')\n10       \
  \  )->newLine()->append($divider)\n11         ->toString();\n12 }\n```\n\n我们现在可以调用函数来生成块状居中的标题了：\n\
  \n图 7.15\n\n```php\n1 <?phpf\n2 \n3 printHeader('Hello, world!');\n```\n\n它返回以下结果：\n\
  \n图 7.16\n\n```text\n1 ################################\n2 #######  Hello, world!\
  \  ########\n3 ################################\n```\n\n## 8. 字符串翻译；单数和复数形式\n\n\
  在本章中，我们将介绍 Laravel 提供的辅助字符串翻译的各种方法和函数。我们不会关注这些字符串翻译文件存储在何或框架如何加载它们，而是关注如何使用它们、它们的细微差别以及这些方法支持的语法。\n\
  \n翻译辅助函数与我们之前看到的函数不同之处在于，它们不存在于 `Illuminate\\Support\\Str` 类中，而是全局定义的，并最终调用 `Illuminate\\\
  Translation\\Translator` 实例上的方法。**表 8.1** 列出了可用的全局翻译辅助函数：\n\n表 8.1 翻译辅助函数\n\n| 函数\
  \ | 描述 |\n| --- | --- |\n| `trans` | 翻译提供的字符串。 |\n| `__` (双下划线) | 翻译提供的字符串。`trans`\
  \ 的别名。 |\n| `trans_choice` | 根据计数翻译提供的字符串。 |\n\n我们可以使用 `trans` 和 `__` 辅助函数来翻译简单的消息，可以带有可选的替换数组或在特定的语言区域（locale）内进行。这两个函数在图\
  \ 8.1 中共享同一个函数签名。\n\n图 8.1 `trans` 和 `__` 函数签名\n\n```php\n1 <?php\n2 \n3 use Illuminate\\\
  Translation\\Translator;\n4 \n5 /**\n6* Versions: Laravel 8,\n7*\n8* @return Translator|string|array\n\
  9 */\n10 function trans(\n11   string|null $key = null,\n12   array $replace = [],\n\
  13   string|null $locale = null\n14 );\n```\n\n如果不传递参数或为 key 传递空值，`trans` 和 `__`\
  \ 函数将返回 `Illuminate\\Translation\\Translator` 实例。`trans_choice` 辅助函数类似，但它接受一个项目计数以选择要使用的翻译字符串：\n\
  \n图 8.2\n\n```php\n1 <?php\n2 \n3 /**\n4* Versions: Laravel 8,\n5*\n6* @return string\n\
  7 */\n8 function trans_choice(\n9              string|null $key = null,\n10    \
  \ Countable|int|array $number,\n11                    array $replace = [],\n12 \
  \             string|null $locale = null\n13 );\n```\n\n本章其余部分假设有以下翻译：\n\n图 8.3\
  \ `/lang/en/plural.php`\n\n```php\n1 <?php\n2 \n3 return [\n4 \n5     'welcome'\
  \ => 'Hello, :name',\n6     'welcome_upper' => 'Hello, :NAME',\n7     'welcome_ucfirst'\
  \ => 'Hello, :Name',\n8 \n9     'ranges' =>\n10          '{0}No items\n11      \
  \    |[1,3]Between one and three\n12          |[4,6]Between four and six\n13   \
  \       |[7,*] ];\n```\n\n### 8.1 使用替换\n\n在 **图 8.3** 中，我们定义了以下翻译键，每个键都可以接受变量 `name`：\n\
  \n- `welcome`\n- `welcome_upper`\n- `welcome_ucfirst`\n\n如果在 `welcome` key 上调用 `trans`\
  \ 方法而不提供任何替换变量，我们将获得整个翻译消息作为返回值：\n\n图 8.4\n\n```php\n1 <?php\n2 \n3 // Returns \"\
  Hello, :name\"\n4 trans('plural.welcome');\n5 \n6 // Returns \"Hello, :name\"\n\
  7 trans('plural.welcome', []);\n```\n\n然而，我们可以提供一个替换数组，Laravel 在生成最终字符串时会使用它：\n\n\
  图 8.5\n\n```php\n1 <?php\n2 \n3 // Returns \"Hello, world\"\n4 trans('plural.welcome',\
  \ [\n5     'name' => 'world'\n6 ]);\n```\n\n`welcome_upper` 和 `welcome_ucfirst`\
  \ 翻译键特别有趣。我们在翻译消息使用了 `:NAME` 和 `:Name` 而不是典型的变量占位符。当我们这样做时，Laravel 在进行替换时会对变量应用相同的大小写：\n\
  \n图 8.6\n\n```php\n1 <?php\n2 \n3 // Returns \"Hello, woRlD\"\n4 trans('plural.welcome',\
  \ [\n5     'name' => 'woRlD'\n6 ]);\n7 \n8 // Returns \"Hello, WORLD\"\n9 trans('plural.welcome_upper',\
  \ [\n10     'name' => 'woRlD'\n11 ]);\n12 \n13 // Returns \"Hello, WoRlD\"\n14 trans('plural.welcome_ucfirst',\
  \ [\n15     'name' => 'woRlD'\n16 ]);\n```\n\n### 8.2 管理项目范围\n\n处理项目集合是 Laravel\
  \ 翻译系统中令人兴奋的部分。我们可以定义根据集合中的项目数量动态变化的翻译消息。我们通过管道字符 (`|`) 分隔翻译消息的每个部分来实现这一点。\n\n例如，在\
  \ **图 8.3** 中，我们定义了 `ranges` 翻译键，它包含了以下翻译消息：\n\n图 8.7\n\n```text\n1 {0}No items\n\
  2 [1,3]Between one and three\n3 [4,6]Between four and six\n4 [7,*]Seven and beyond!\n\
  ```\n\n第一个翻译消息以序列 `{0}` 开始，表示当我们的集合不包含项目时（计数为零）应该使用该消息：\n\n图 8.8\n\n```php\n1 <?php\n\
  2 \n3 // Returns \"No items\"\n4 trans_choice('plural.ranges', collect());\n5 \n\
  6 // Returns \"No items\"\n7 trans_choice('plural.ranges', []);\n8 \n9 // Returns\
  \ \"No items\"\n10 trans_choice('plural.ranges', 0);\n```\n\n随后的翻译消息使用方括号中类似的数字序列。这些序列允许我们定义项目计数范围，翻译器将根据范围选择正确的消息。\n\
  \n以下示例将使用 PHP 的 `range` 函数生成具有所需数量项目的数组：\n\n图 8.9\n\n```php\n1 <?php\n2 \n3 // Returns\
  \ \"Between one and three\"\n4 trans_choice('plural.ranges', range(1, 3));\n5 \n\
  6 // Returns \"Between four and six\"\n7 trans_choice('plural.ranges', range(1,\
  \ 6));\n8 \n9 // Returns \"Seven and beyond!\"\n10 trans_choice('plural.ranges',\
  \ range(1, 42));\n```\n\n我们为最后一个翻译消息使用了序列 `[7,*]`，这告诉 Laravel 翻译器该消息从七个项目开始适用，直到任何数量的项目。如果我们想为一组特定的数字使用特定的翻译消息，可以通过在花括号之间提供用逗号分隔的值列表来实现：\n\
  \n图 8.10\n\n\n\n\n\n```\n1 {0}匹配零项。\n2 |{1,2,3} 匹配一个、两个或三个项。\n```\n\n同样，我们也可以匹配负数范围。例如，`图\
  \ 8.11` 中的模式提供了几个可以匹配的范围：特定的整数集合、包含正无穷大的范围，以及一个包含负无穷大的范围：\n\n图 8.11 \n\n```\n1 {0}\
  \ 匹配零项。\n2 |{1,2,3} 匹配一个、两个或三个项。\n3 |{4} 匹配恰好四项。\n4 |[5-10] 匹配五到十项之间。\n5 |[11,*]\
  \ 匹配十一项或更多项。\n6 |[*,-1] 匹配所有负数计数。\n```\n\n### 8.3 单数和复数单词形式\n\n除了字符串翻译辅助方法和支持功能外，Laravel\
  \ 还提供了简单的方法将单词转换为单数或复数形式。默认情况下，此功能适用于英语单词，但我们可以将其启用挪威语标准语（Bokmål）、法语、葡萄牙语、西班牙语和土耳语。\n\
  \n我们用于与复数功能交互的三个方法是 `plural`、`pluralStudly` 和 `singular`。我们将从 `singular` 辅助方法开始讨论。\n\
  \n图 8.12 singular 方法签名 \n\n```\n1 <?php\n2 \n3 /**\n4  * 版本: Laravel 8, 9\n5  *\n\
  6  * @return string\n7  */\n8 public static function singular(string $value);\n\
  ```\n\n`图 8.13` 展示了 `singular` 辅助方法的用法。值得注意的一点是，Doctrine 的单词变形实现可以处理边缘情况，例如英语单词“moose”。\n\
  \n图 8.13 \n\n```\n1 <?php\n2 \n3 use Illuminate\\Support\\Str;\n4 \n5 // 返回 \"moose\"\
  \n6 Str::singular('moose');\n7 \n8 // 返回 \"mouse\"\n9 (string) str('mice')->singular;\n\
  ```\n\n我们还可以使用 `singular` 方法将驼峰命名（studly-cased）的单词转换为单数形式。下面的代码示例将单词 `theMice` 拆分为\
  \ `the` 和 `Mice`，将 `Mice` 转换为单数形式，然后将它们组合成最终结果：\n\n图 8.14 \n\n```\n1 <?php\n2 \n\
  3 use Illuminate\\Support\\Str;\n4 \n5 // 返回 \"theMouse\"\n6 Str::singular('theMice');\n\
  ```\n\n`plural` 和 `pluralStudly` 方法与 `singular` 方法类似，但它们接受项目计数，我们可以以此影响最终的单词形式。我们还可以提供计数\
  \ 1 来有效返回单数单词形式，从而消除了对这种情况进行显式检查的需要。\n\n图 8.15 plural and pluralStudly 方法签名 \n\n\
  ```\n 1 <?php\n 2 \n 3 /**\n4  * 版本: Laravel 8, 9\n5  *\n6  * @return string\n7\
  \  */\n8 public static function plural(\n 9                   string $value,\n10\
  \     int|array|Countable $count = 2\n11 );\n13 /**\n14  * 版本: Laravel 8, 9\n15\
  \  *\n16  * @return string\n17  */\n18 public static function pluralStudly(\n19\
  \                   string $value,\n20     int|array|Countable $count = 2\n21 );\n\
  ```\n\n`图 8.16` 提供了如何利用 `plural` 方法的示例：\n\n图 8.16 \n\n```\n1 <?php\n2 \n3 use Illuminate\\\
  Support\\Str;\n4 \n5 // 返回 \"mice\"\n6 Str::plural('mouse', 0);\n7 \n8 // 返回 \"\
  mouse\"\n9 Str::plural('mouse', 1);\n10 \n11 // 返回 \"mouse\"\n12 (string) str('mouse')->plural;\n\
  ```\n\n就像我们将驼峰命名的单词转换为单数形式一样，我们可以使用 `pluralStudly` 方法将单数驼峰命名的单词转换为复数形式：\n\n图 8.17\
  \ \n\n```\n1 <?php\n2 \n3 use Illuminate\\Support\\Str;\n4 \n5 // 返回 \"theMices\"\
  \n6 Str::pluralStudly('theMice', 0);\n7 \n8 // 返回 \"theMice\"\n9 Str::pluralStudly('theMice',\
  \ 1);\n10 \n11 // 返回 \"theMices\"\n12 (string) str('theMice')->pluralStudly(0);\n\
  13 \n14 // 返回 \"theMices\"\n15 Str::pluralStudly('theMice', 3);\n```\n\n在 `图 8.17`\
  \ 中，我们可以看到在对已经是复数形式的单词“Mice”进行复数化的一些有趣的行为。变形系统返回了“Mice”，这可能不被认为是正确的。如果应用程序对大小写敏感，检查变形器的输出可能会是有益的；然而，对于内部命名，只要结果是一致的，这就不应该是一个问题。\n\
  \n## 9 使用 Macros 和 Mixins 扩展字符串\n\nLaravel 提供了两种主要方式为 `Str` 辅助类和链式字符串（fluent strings）添加额外功能：mixins\
  \ 和 macros（宏）。Macros 允许我们添加新的辅助方法，而 mixins 则将允许我们将不同类的方法注入到其中任一类中。\n\n\n\n\n```php\n\
  <?php\n// \n\nuse Illuminate\\Support\\Stringable;\n\nclass StringHelperMethods\
  \ {\n    public function splitLine() {\n        return function () {\n         \
  \ return $this->explode(\"\\n\");\n        };\n    }\n}\n\nStringable::mixin(new\
  \ StringHelperMethods());\n\nstr($stringInput)->splitLine;\n```\n\n在**图 9.7**和**图\
  \ 9.8**中，我们传递了 mixin 类的实例。如果尝试尝试只传递类名，例如 `StringHelperMethods::class`，我们将收到一个“TypeError:\
  \ ReflectionMethod::invoke()”错误。\n\n## 10. 行与词\n\n在本章中，我们将探索行（lines）和词（words）的概念。这两个术语都无处不在：我们随处都能看到它们，但可能并没有对它们想太多。我们将从行开始。。\n\
  \n在第 9 章中，我们组合了一个快速的示例宏，它可以将语料库拆分为一个单行的数组：\n\n图 10.1 \n\n```php\n<?php\n// \n\n\
  use Illuminate\\Support\\Str;\n\nStr::macro('lineSplit', function ($value) {\n \
  \   return explode(\"\\n\", $value);\n});\n```\n\n当我们在那一章执行此操作时，我们注意到这种实现存在一些问题。也就是说，它没有处理我们经常遇到的行结束符类型。我们目前的行分割实现只考虑了“\\\
  n”（换行符）字符，这对于文本输入或来自 UNIX 或现代 macOS 系统的文档非常好用。然而，还有其他类型。\n\n例如，旧的 macOS 系统会使用“\\\
  r”（回车符），而 Windows 系统则使用“\\r\\n”序列（回车符后跟一个换行符）。这些字符本身就很有意思。大多数开发者都与完全数字化的系统打过交道，可能不知道这些字符中的每一个都有历史上的用途和意义。\n\
  \n在第 1 章中，我们讨论了 ASCII、Unicode 和字符编码。字符集的有趣之处之一在于，它们通常被细分为两组：控制字符和打印字符。各种换行符都属于控制字符这一组。控制字符会导致物理系统执行某些操作：它们控制着系统。让我们花点时间思考打字机。\n\
  \n当我们在打字机上输入字符时，一个锤子划过空气，击中墨条，并将符号盖在我们的页面上。每当这种情况发生时，字架（在我们打字时推进页面并上下移动页面的装置）就会向左稍微移动一点。如果我们这样做足够多次，字架最终将移动到左侧极限，无法进一步向前移动；通常会伴随着一声悦耳的铃声。要开始新的一行，我们按下回车键，这会导致持有纸张的轮略微旋转。字架回到原始位置，允许我们从新行的开头开始打字。\n\
  \n按下回车键会触发两个动作：纸张通过滚轮，，字架回到起始位置。\n\n现在我们已经对常见的各种不同行结束符有了一些背景了解，我们可以问自己另一个问题：是否还有其他我们需要注意的字符？事实上，长久以来使用过许多不同的控制字符，它们会导致插入新行或指示某些垂直间距。**表\
  \ 10.1**提供了我们应该注意的可能的换行符序列列表：\n\n表 10.1 可能的换行符\n\n| 字符序列 || 正则表达式模式 || Unicode 代码点\
  \ |\n| --- | --- | --- |\n| 换行符 (LF) || /\\\\n/ || U+000A |\n| --- | --- | --- |\n\
  | 回车符 (CR) || /\\\\r/ || U+000D |\n| CR+LF || /\\\\r\\\\n/ |   |\n| LF+CR || /\\\
  \\n\\\\r/ |   |\n| 换页符 (FF) || /\\\\x{000C}/ || U+000C |\n| 下行 (NEL) || /\\\\x{0085}/\
  \ || U+0085 |\n| 行分隔符 (LS) || /\\\\x{2028}/ || U+2028 |\n| 段分隔符 (PS) || /\\\\x{2029}/\
  \ || U+2029 |\n| 垂直制表符 (VT) || /\\\\x{000B}/ || U+000B |\n\n**表 10.1**中的每个不同字符都有其用途。例如，垂直制表符指示打印机或显示器在保留水平间距的同时移动一行。然而，对于我们的目的，我们将只关注换行符和回车符。\n\
  \n使用**表 10.1**中的正则表达式模式，我们可以构建一个可以在 PHP 的 `preg_split` 函数中使用的模式。我们的正则表达式将接受回车符后跟换行符序列，或者换行符或回车符：\n\
  \n图 10.2 匹配行结束符的正则模式 \n\n```\n(\\r\\n|\\n|\\r)\n```\n\n我们现在可以更新在上章中创建的宏了：\n\n图 10.3\
  \ \n\n```php\n<?php\n// \n\nuse Illuminate\\Support\\Str;\n\nStr::macro('lineSplit',\
  \ function ($value) {\n    return preg_split(\"/(\\r\\n|\\n|\\r)/u\", $value);\n\
  });\n```\n\n在此此更改之后，我们的 `lineSplit` 方法现在能够处理最常见的字符。我们还有机会创建另一个辅助方法：来规范文本中出现的行结束符：\n\
  \n图 10.4 \n\n```php\n<?php\n// \n\nuse Illuminate\\Support\\Str;\n\nStr::macro('lineol',\
  \ function ($value, $to = PHP_EOL) {\n    return preg_replace(\"/(\\r\\n|\\n|\\\
  r)/u\", $to, $value);\n});\n```\n\n我们可以使用 `normalizeol` 方法配合 `$to` 参数，例如：\n\n图 10.5\
  \ \n\n```php\n<?php\n// \n\nuse Illuminate\\Support\\Str;\n\n$string = \"line one\\\
  nline two\\rline three\";\n```\n\n还有一个链式方法：\n\n图 10.6 \n\n```php\n<?php\n// \n\n\
  use Illuminate\\Support\\Stringable;\n\nStringable::macro('normalizeol', function\
  \ ($to = PHP_EOL) {\n    return new static(\n        preg_replace(\"/(\\r\\n|\\\
  n|\\r)/u\", $to, $this->value)\n    );\n});\n\nStringable::macro('lineSplit', function\
  \ () {\n    return collect($this->explode(\"\\n\"));\n});\n```\n\n使用我们的链式 `lineSplit`\
  \ 方法如：\n\n图 10.7 \n\n```php\n<?php\n// \n\nstr(\"line one\\nline two\\rline three\"\
  )\n    ->lineSplit;\n```\n\n将返回一个包含以下内容的：\n\n图 10.8 \n\n```\n[\n    \"line one\"\
  ,\n    \"line two\",\n    \"line three\"\n]\n```\n\n### 10.1 位置、行与列\n\n在多年来，我处理过许多涉及行、位置和列的文本项目。例如，当我们在文本编辑器中查看光标位置时，通常看到行和列（例如：第\
  \ 7 行第 62 列）。根据第 1 章的讨论，我们知道字符串在内存中表示为连续的字节数组。问题变成了：我们是否在一维字节数组上应用二维概念？\n\n解包以下值：\n\
  \n图 10.9 \n\n```php\n<?php\n// \n\n$text = \"one\\ntwo\\nthree four\\nfive\";\n\n\
  unpack('C*', $text);\n```\n\n返回以下十进制形式的字节列表：\n\n图 10.10 \n\n```\narray:23 [\n  1\
  \ => 111\n  2 => 110\n  3 => 101\n  4 => 10\n  5 => 116\n  6 => 119\n  7 => 111\n\
  \  8 => 10\n  9 => 116\n  10 => 104\n  11 => 114\n  12 => 101\n  13 => 101\n  14\
  \ => 32\n  15 => 102\n  16 => 111\n  17 => 117\n  18 => 114\n  19 => 10\n  20 =>\
  \ 102\n  21 => 105\n  22 => 118\n  23 => 101\n]\n```\n\n\n\n\n\n查看`Figure 10.10`\
  \ 中的结果，我们可以获得一些关于如何将任意字符串位置转换为行和列号的线索。例如，我们知道十进制 `10` 对应换行符。要从字符串中的某个位置获取当前行号，我们可以计算该字符在当前位置之前出现的次数。下面的代码示例演示了将任何字符串位置转换为行号的一种方法：\n\
  \n图 10.11 \n\n```\n 1 <?php\n 2 \n 3 $text = \"one\\ntwo\\nthree four\\nfive\";\n\
  \ 4 \n 5 function getLineNumber($value, $position) {\n 6     return mb_substr_count(\n\
  \ 7         mb_substr($value, 0, $position),\n 8         \"\\n\"\n 9     ) + 1;\n\
  10 }\n11 \n12 // 获取第一个 \"o\" 的行号。\n13 // 返回 1\n14 getLineNumber($text, 0);\n15 \n\
  16 // 获取第一个 \"t\" 的行号。\n17 // 返回 2\n18 getLineNumber($text, 4);\n```\n\n这种初始实现通过使用目标位置并从原始字符串中提取子字符串来实现。然后，我们计算结果字符串中出现的换行符数量。行计数是从零开始的，因此我们加\
  \ 1 以得到符合人类习惯的行号。这种技术在较小的字符串上效果良好，但在巨大的字符串上创建子字符串时可能会消耗大量内存。我们稍后会探索解决此的方法。\n\n我们可以采用类似的策略来确定字符串中任意位置的列号。基本技术是获取紧邻目标位置之前的换行符的位置。一旦我们有了这两个位置，列号就是这两个位置之间的差值。\n\
  \n图 10.12 \n\n```\n 1 <?php\n 2 \n 3 $text = \"one\\ntwo\\nthree four\\nfive\";\n\
  \ 4 \n 5 function getColumnNumber($value, $position) {\n 6     $lastNlPosition =\
  \ mb_strrpos(\n 7         mb_substr($value, 0, $position),\n 8         \"\\n\"\n\
  \ 9     );\n10 \n11 \n12     if ($lastNlPosition === false) {\n13         return\
  \ $position + 1;\n14     }\n15 \n16     return $position - $lastNlPosition;\n17\
  \ }\n18 \n19 // 返回 1\n20 getColumnNumber($text, 0);\n21 \n22 // 返回 3\n23 getColumnNumber($text,\
  \ 2);\n24 \n25 // 返回 1\n26 getColumnNumber($text, 8);\n27 \n28 // 返回 8\n29 getColumnNumber($text,\
  \ 15);\n```\n\n使用第 1 章中开发的字符串迭代器，我们可以构建一个循环来帮助更好地可视化这两个函数的输出。下面的代码示例：\n\n图 10.13\
  \ \n\n```\n 1 <?php\n 2 \n 3 $text = \"one\\ntwo\\nthree four\\nfive\";\n 4 \n 5\
  \ $string = new Utf8StringIterator($text);\n 6 \n 7 for ($i = 0; $i < count($string);\
  \ $i++) {\n 8     if ($string[$i] == \"\\n\") { echo \"\\n\"; }\n 9 \n10     $line\
  \ = getLineNumber($text, $i);\n11     $col = getColumnNumber($text, $i);\n12 \n\
  13     echo \"Char: {$string[$i]} Ln: {$line} Col: {$col}\\n\";\n14 }\n```\n\n产生如下输出：\n\
  \n图 10.14 \n\n```\n 1 Char: o Ln: 1 Col: 1\n 2 Char: n Ln: 1 Col: 2\n 3 Char: e\
  \ Ln: 1 Col: 3\n 4 \n 5 Char: t Ln: 2 Col: 1\n 6 Char: w Ln: 2 Col: 2\n 7 Char:\
  \ o Ln: 2 Col: 3\n 8 \n 9 Char: t Ln: 3 Col: 1\n10 Char: h Ln: 3 Col: 2\n11 Char:\
  \ r Ln: 3 Col: 3\n12 Char: e Ln: 3 Col: 4\n13 Char: e Ln: 3 Col: 5\n14 Char: f Ln:\
  \ 3 Col: 6\n15 Char: o Ln: 3 Col: 7\n16 Char: u Ln: 3 Col: 8\n17 Char: r Ln: 3 Col:\
  \ 9\n18 Char: f Ln: 3 Col: 10\n19 \n20 Char: i Ln: 4 Col: 1\n21 Char: v Ln: 4 Col:\
  \ 2\n22 Char: e Ln: 4 Col: 3\n```\n\n对于一次性使用，我们可以将这两个函数封装成一组辅助方法：\n\n图 10.15 行号和列号实现\n\
  \n```\n 1 <?php\n 2 \n 3 use Illuminate\\Support\\Str;\n 4 use Illuminate\\Support\\\
  Stringable;\n 5 \n 6 Str::macro('lineNumber', function ($value, $position) {\n 7\
  \     return mb_substr_count(\n 8             str($value, 0, $position), \"\\n\"\
  \n 9         ) + 1;\n10 });\n11 \n12 Stringable::macro('lineNumber', function ($position)\
  \ {\n13     return Str::lineNumber($this->value, $position);\n14 });\n15 \n16 Str::macro('columnNumber',\
  \ function ($value, $position) {\n17     $lastNlPosition = mb_strrpos(\n18     \
  \    str($value, 0, $position), \"\\n\"\n19     );\n20 \n21 \n22     if ($lastNlPosition\
  \ === false) {\n23         return $position + 1;\n24     }\n25 \n26     return $position\
  \ - $lastNlPosition;\n27 });\n28 \n29 Stringable::macro('columnNumber', function\
  \ ($position) {\n30     return Str::columnNumber($this->value, $position);\n31 });\n\
  ```\n\n我们提到，如果需要频繁检索行和列，这些辅助方法可能不是最优，因为会创建大量的子字符串。为了改进现有实现，我们可以为文本中的所有行尾创建一个索引，就像我们在第\
  \ 1 章实现 UTF-8 字符串迭代器时那样。\n\n我们的实现将使用单个 `\\n` 换行符。如果输入使用不同的行尾样式，可以使用已经开发的 `normalizeEol`\
  \ 辅助方法。使用带有 `PREG_OFFSET_CAPTURE` 标志的 PHP `preg_match_all` 函数：\n\n图 10.16 \n\n```\n\
  \ 1 <?php\n 2 \n 3 $text = \"one\\ntwo\\nthree four\\nfive\";\n 4 \n 5 preg_match_all(\"\
  /\\n/u\", $text, $matches, PREG_OFFSET_CAPTURE);\n```\n\n将产生如下的换行符位置数组：\n\n图 10.17\
  \ \n\n```\n 1 array:1 [\n 2     0 => array:3 [\n 3       0 => array:2 [\n 4    \
  \     0 => \"\\n\"\n 5         1 => 3\n 6       ]\n 7       1 => array:2 [\n 8 \
  \        0 => \"\\n\"\n 9         1 => 7\n10       ]\n11       2 => array:2 [\n\
  12         0 => \"\\n\"\n13         1 => 18\n14       ]\n15     ]\n16 ]\n```\n\n\
  我们的下一个任务是将 `matches` 数组转换为仅包含换行符偏移量的简单数组。我们可以使用 Laravel 集合来实现：\n\n图 10.18 \n\n```\n\
  \ 1 <?php\n 2 \n 3 // ...\n 4 \n5 $index = collect($matches[0])->map(function ($match)\
  \ {\n6     return $match[1];\n7 })->all();\n```\n\n产生如下数组：\n\n图 10.19 \n\n```\n\
  \ 1 array:3 [\n2     0 => 3\n3     1 => 7\n4     2 => 18\n5\n```\n\n现在，要从索引中获取任意位置的行号，我们可以遍历索引并将位置与索引中的位置进行比较。假设索引中的当前位置大于目标位置。在这种情况下，我们感兴趣的行号偏移是索引中的上一个偏移，并返回计数器的当前值（使行号从\
  \ 1 开始）：\n\n图 10.20 \n\n```\n 1 <?php\n 2 \n3 function getLineNumber($position,\
  \ $index) {\n4     for ($i = 0; $i < count($index); $i++) {\n5         $offset =\
  \ $index[$i];\n6 \n7         if ($i == 0 && $position < $offset) {\n8          \
  \   return 1;\n9         }\n10 \n11         if ($offset > $position) {\n12     \
  \        return $i + 1;\n13         }\n14     }\n15 \n16     return $i + 1;\n17\
  \ }\n```\n\n对新的 `getColumnNumber` 实现进行类似的操作。与行号函数相比，此实现的区别在于我们需要跟踪偏移的值。在计算行号时，循环的计数变量就足够获取我们需要的信息。但对于列，我们需要知道字符串中行尾的位置，以便计算差值：\n\
  \n图 10.21 \n\n```\n 1 <?php\n 2 \n3 function getColumnNumber($position, $index)\
  \ {    \n4     $lastOffset = null;\n 5 \n6     for ($i = 0; $i < count($index);\
  \ $i++) {\n7         $offset = $index[$i];\n 8 \n9         if ($i == 0 && $position\
  \ < $offset) {\n10             return $position + 1;\n11         }\n12 \n13    \
  \     if ($offset > $position) {\n14             return $position - $lastOffset;\n\
  15         }\n16 \n17         $lastOffset = $offset;\n18     }\n19 \n20     return\
  \ $position - $lastOffset;\n21 }\n```\n\n\n\n\n\n我们的两个函数非常有帮助，但如果我们每次想用它们时都手动初始化索引并传递它，就会变得非常繁琐。为了解决这个问题，我们可以创建一个新的工具类来提供帮助。由于命名是非常困难的，我们将它命名为\
  \ `CharacterPositionLocator`：\n\n图 10.22\n\n```php\n 1 <?php\n 2 \n 3 class CharacterPositionLocator\n\
  \ 4 {\n 5     protected $string = '';\n 6     protected $newLineIndex = [];\n 7\
  \ \n 8     public function __construct(string $string)\n 9     {\n10         $this->string\
  \ = $string;\n11         $this->buildNewLineIndex();\n12     }\n13 \n14     protected\
  \ function buildNewLineIndex()\n15     {\n16         preg_match_all(\n17       \
  \    \"/\\n/u\",\n18           $this->string,\n19           $matches,\n20      \
  \     PREG_OFFSET_CAPTURE\n21         );\n22 \n23         $this->newLineIndex =\
  \ collect($matches[0])\n24           ->map(function ($match) {\n25             return\
  \ $match[1];\n26         })->all();\n27     }\n28 \n29     public function getLineNumber($position)\n\
  30     {\n31         for ($i = 0; $i < count($this->newLineIndex); $i++) {\n32 \
  \            $offset = $this->newLineIndex[$i];\n33 \n34             if ($i == 0\
  \ && $position < $offset) {\n35                 return 1;\n36             }\n37\
  \ \n38             if ($offset > $position) {\n39                 return $i + 1;\n\
  40             }\n41         }\n42 \n43         return $i + 1;\n44     }\n45 \n\
  46     public function getColumnNumber($position)\n47     {\n48         $lastOffset\
  \ = null;\n49 \n50         for ($i = 0; $i < count($this->newLineIndex); $i++) {\n\
  51             $offset = $this->newLineIndex[$i];\n52 \n53             if ($i ==\
  \ 0 && $position < $offset) {\n54                 return $position + 1;\n55    \
  \         }\n56 \n57             if ($offset > $position) {\n58                \
  \ return $position - $lastOffset;\n59             }\n60 \n61             $lastOffset\
  \ = $offset;\n62         }\n63 \n64         return $position - $lastOffset;\n65\
  \     }\n66 }\n```\n\n我们现在有了一个能够从任意位置获取行号和列号的工具类，但我们还有另一个重构的机会。当我们想要获取行号时，可能也需要列号，我们可以通过稍微修改\
  \ `getColumnNumber` 方法的细节，来同时获取这两项信息。在进行这些重构时，我们可以花时间防止传入负数或超过字符串长度的位置：\n\n图 10.23\n\
  \n```php\n 1 <?php\n 2 \n 3 class Position\n 4 {\n 5     public $position = null;\n\
  \ 6     public $column = null;\n 7     public $line = null;\n 8 }\n 9 \n10 class\
  \ CharacterPositionLocator\n11 {\n12     protected $string = '';\n13     protected\
  \ $length = 0;\n14     protected $newLineIndex = [];\n15 \n16     public function\
  \ __construct(string $string)\n17     {\n18         $this->string = $string;\n19\
  \         $this->length = mb_strlen($string, 'UTF-8');\n20         $this->buildNewLineIndex();\n\
  21     }\n22 \n23     protected function buildNewLineIndex()\n24     {\n25     \
  \    preg_match_all(\n26           \"/\\n/u\",\n27           $this->string,\n28\
  \           $matches,\n29           PREG_OFFSET_CAPTURE\n30         );\n31 \n32\
  \         $this->newLineIndex = collect($matches[0])\n33           ->map(function\
  \ ($match) {\n34             return $match[1];\n35         })->all();\n36     }\n\
  37 \n38     public function getLineNumber($position)\n39     {\n40         return\
  \ $this->getCharPosition($position)?->line;\n41     }\n42 \n43     public function\
  \ getColumnNumber($position)\n44     {\n45         return $this->getCharPosition($position)?->column;\n\
  46     }\n47 \n48     public function getCharPosition($position)\n49     {\n50 \
  \        if ($position > $this->length || $position < 0) {\n51             return\
  \ null;\n52         }\n53 \n54         $lastOffset = null;\n55         $column =\
  \ null;\n56         $line = null;\n57 \n58         for ($i = 0; $i < count($this->newLineIndex);\
  \ $i++) {\n59             $offset = $this->newLineIndex[$i];\n60 \n61          \
  \   if ($i == 0 && $position < $offset) {\n62                 return $position +\
  \ 1;\n63             }\n64 \n65             if ($offset > $position) {\n66     \
  \            return $position - $lastOffset;\n67             }\n68 \n69        \
  \     $lastOffset = $offset;\n70         }\n71 \n72         return $position - $lastOffset;\n\
  73     }\n74 }\n```\n\n作为重构工作的一部分，我们定义了一个新的 `Position` 类来存储我们的行号和列号；它还存储了我们的位置。为了不破坏现有\
  \ `getLineNumber` 和 `getColumnNumber` 方法的兼容性并减少重复代码量，我们现在内部调用新方法并返回相应的属性。我们可以像这样使用我们的新类来还原图\
  \ 10.14 的输出：\n\n图 10.24\n\n```php\n 1 <?php\n 2 \n 3 $text = \"one\\ntwo\\nthree\
  \ four\\nfive\";\n 4 \n 5 $string = new Utf8StringIterator($text);\n 6 $locator\
  \ = new CharacterPositionLocator($text);\n 7 \n 8 for ($i = 0; $i < count($string);\
  \ $i++) {\n 9     if ($string[$i] == \"\\n\") { echo \"\\n\"; continue; }\n10 \n\
  11     $pos = $locator->getCharPosition($i);\n12 \n13     echo \"Char: {$string[$i]}\
  \ Ln: {$pos->line} Col: {$pos->column}\\n\";\n14 }\n```\n\n下一个显而易的问题是，我们可以反过来做吗？我们能否提供行号和列号，并返回该位置在字符串中的索引？到目前，我们的实现假设文本中的换行符始终是\
  \ \"\\n\" 序列，但它可能是任何我们感兴趣支持的换行样式。也许我们还会看到类似下面的输入文本，可能是某些自动化过程不当合并文档的结果：\n\n图 10.25\n\
  \n```php\n1 <?php\n2 \n3 $text = \"one\\r\\ntwo\\nthree\\r\\nfour\\nfive\";\n```\n\
  \n我们可以通过更改索引正则表达式以适应多种换行样式来实现支持。多种换行样式的一个副作用是，我们还需要存储换行序列包含多少个字符。如果不这样做，我们将无法轻松处理位于换行序列内部的位置参数。此外，假设一段文本中可能存在多种类型的换行序列。在这种情况下，我们还可以添加一种方法来检查给定位置是否属于换行序列。在解决从已知行号和列号检索位置之前，我们将先实现这些更改：\n\
  \n图 10.26\n\n\n\n\n\n```php\n<?php\nclass Position\n{\n    public $position = null;\n\
  \    public $column = null;\n    public $line = null;\n}\n\nclass CharacterPositionLocator\n\
  {\n    protected $string = '';\n    protected $length = 0;\n    protected $newLineIndex\
  \ = [];\n\n    public function __construct(string $string)\n    {\n        $this->string\
  \ = $string;\n        $this->length = mb_strlen($string, 'UTF-8')\n        $this->buildNewLineIndex();\n\
  \    }\n\n    protected function buildNewLineIndex()\n    {\n        preg_match_all(\n\
  \          \"/\\n/u\",\n          \"/\\r\\n|\\n|\\r/u\",\n          $this->string,\n\
  \          $matches,\n          PREG_OFFSET_CAPTURE\n        );\n\n        $this->newLineIndex\
  \ = collect($matches[0])\n          ->map(function ($match) {\n            return\
  \ $match[1];\n            // Return an array containing the start\n            //\
  \ and end position of the sequence.\n            return [$match[1], $match[1] +\
  \ strlen($match[0]) - 1];\n          })->all();\n    }\n\n    public function getLineNumber($position)\n\
  \    {\n        return $this->getCharPosition($position)?->line;\n    }\n\n    public\
  \ function getColumnNumber($position)\n    {\n        return $this->getCharPosition($position)?->column;\n\
  \    }\n\n    public function isNewLine($position): bool\n    {\n        if ($position\
  \ > $this->length || $position < 0) {\n            return false;\n        }\n\n\
  \        for ($i = 0; $i < count($this->newLineIndex); $i++) {\n            $nlStart\
  \ = $this->newLineIndex[$i][0];\n            $nlEnd = $this->newLineIndex[$i][1];\n\
  \n            if ($position >= $nlStart && $position <= $nlEnd) {\n            \
  \    return true;\n            }\n        }\n\n        return false;\n    }\n\n\
  \    public function getCharPosition($position)\n    {\n        if ($position >\
  \ $this->length || $position < 0) {\n            return null;\n        }\n\n   \
  \     $lastOffset = null;\n        $column = null;\n        $line = null;\n\n  \
  \      for ($i = 0; $i < count($this->newLineIndex); $i++) {\n            $offset\
  \ = $this->newLineIndex[$i];\n            $offset = $this->newLineIndex[$i][1];\n\
  \n            if ($i == 0 && $position < $offset) {\n                $line = 1;\n\
  \                $column = $position + 1;\n                break;\n            }\n\
  \n            if ($offset > $position) {\n                $line = $i + 1;\n    \
  \            $column = $position - $lastOffset;\n                break;\n      \
  \      }\n\n            $lastOffset = $offset;\n        }\n\n        if ($column\
  \ === null) {\n            $line = $i + 1;\n            $column = $position - $lastOffset;\n\
  \        }\n\n        $charPosition = new Position();\n        $charPosition->position\
  \ = $position;\n        $charPosition->column = $column;\n        $charPosition->line\
  \ = $line;\n\n        return $charPosition;\n    }\n}\n```\n\n我们可以利用熟悉的技巧来实现根据行号和列号获取字符位置的方法。我们将遍历换行索引的每个元素，并检查该行是否匹配目标行。如果匹配，我们将列号添加到上一个换行符结束的位置：\n\
  \n```php\n<?php\nclass CharacterPositionLocator\n{\n    // ...\n    public function\
  \ getCharPositionFromLineColumn($line, $column)\n    {\n        $position = null;\n\
  \        for ($i = 0; $i < count($this->newLineIndex); $i++) {\n            if ($i\
  \ + 1 != $line) {\n                continue;\n            }\n\n            if ($i\
  \ == 0) {\n                return $column - 1;\n            }\n\n            $index\
  \ = $this->newLineIndex[$i - 1];\n\n            $position = $index[1] + $column;\n\
  \        }\n\n        if ($position === null) {\n            $lastIndex =\n    \
  \          $this->newLineIndex[count($this->newLineIndex) - 1];\n\n            $position\
  \ = $lastIndex[1] + $column;\n        }\n\n        return $position;\n    }\n\n\
  \    // ...\n}\n```\n\n现在我们可以使用该方法来获取位于第 5 行第 3 列的字符位置：\n\n```php\n<?php\n$text\
  \ = \"one\\r\\ntwo\\nthree\\r\\nfour\\nfive\";\n\n$locator = new CharacterPositionLocator($text);\n\
  \n// 返回 23\n$locator->getCharPositionFromLineColumn(5, 3);\n```\n\n\n\n\n\n```\n\
  \ 1 Pos:  0 -  0 Char: o Ln: 1 Col: 1\n 2 Pos:  1 -  1 Char: n Ln: 1 Col: 2\n 3\
  \ Pos:  2 -  2 Char: e Ln: 1 Col: 3\n 4 Pos:  5 -  5 Char: t Ln: 2 Col: 1\n 5 Pos:\
  \  6 -  6 Char: w Ln: 2 Col: 2\n 6 Pos:  7 -  7 Char: o Ln: 2 Col: 3\n 7 Pos:  9\
  \ -  9 Char: t Ln: 3 Col: 1\n 8 Pos: 10 - 10 Char: h Ln: 3 Col: 2\n 9 Pos: 11 -\
  \ 11 Char: r Ln: 3 Col: 3\n10 Pos: 12 - 12 Char: e Ln: 3 Col: 4\n11 Pos: 13 - 13\
  \ Char: e Ln: 3 Col: 5\n12 Pos: 16 - 16 Char: f Ln: 4 Col: 1\n13 Pos: 17 - 17 Char:\
  \ o Ln: 4 Col: 2\n14 Pos: 18 - 18 Char: u Ln: 4 Col: 3\n15 Pos: 19 - 19 Char: r\
  \ Ln: 4 Col: 4\n16 Pos: 21 - 21 Char: f Ln: 5 Col: 1\n17 Pos: 22 - 22 Char: i Ln:\
  \ 5 Col: 2\n18 Pos: 23 - 23 Char: v Ln: 5 Col: 3\n19 Pos: 24 - 24 Char: e Ln: 5\
  \ Col: 4\n```\n\n### 10.2 将字符串拆分为单词\n\n我们现在可以将任意字符串拆分为行数组，这引导我们进入下一个逻辑步骤：将字符串拆分为单词列表。单词的概念和精确定义很容易让我们误入方向并进入另一个单独的话题。考虑到这一点，我们将空格或我们定义的其他任意字符（我们稍后会讨论）作为单词的分隔符。我们将创建的第一种方法是\
  \ Laravel 的 `words` 方法的适配。这种方法将产生一个字符串列表，与 `words` 辅助方法内部操作的对象匹配。\n\n为了实现这一点，我们可以使用下面的正则表达式，它将匹配任意数量的空白字符并将字符串拆分为单词数组：\n\
  \n图 10.32 \n\n```\n1 /\\s+/u\n```\n\n**图 10.32** 中的正则表达式将匹配任意数量的空白字符。我们现在可以使用 `preg_split`\
  \ 将它将字符串拆分为单词数组：\n\n图 10.33 \n\n```\n 1 <?php\n 2 \n3 use Illuminate\\Support\\\
  Str;\n4 use Illuminate\\Support\\Stringable;\n 5 \n6 Str::macro('wordSplit', function\
  \ ($value) {\n 7     return preg_split(\"/\\s+/u\", $value);\n 8 });\n 9 \n10 Stringable::macro('wordSplit',\
  \ function () {\n11     return collect(preg_split(\"/\\s+/u\", $this->value));\n\
  12 });\n```\n\n在 `Str` 类上像这样调用我们新的 `wordSplit` 方法：\n\n图 10.34 \n\n```\n1 <?php\n\
  2 \n3 use Illuminate\\Support\\Str;\n4 \n5 Str::wordSplit(\"A simple string made\
  \ up of words.\");\n```\n\n将返回以下结果：\n\n图 10.35 \n\n```\n1 [\n2     \"A\",\n3   \
  \  \"simple\",\n4     \"string\",\n5     \"made\",\n6     \"up\",\n7     \"of\"\
  ,\n8     \"words.\",\n9 ]\n```\n\n使用我们的流式宏将返回一个带有相同单词列表的 `Collection` 实例。你可能已经注意到，**图\
  \ 10.35** 中结果的最后一个元素包含一个末尾的句号（“.”）。\n\n我们可以通过将宏实现修改为如下形式来解决这个问题：\n\n图 10.36 \n\n\
  ```\n 1 <?php\n 2 \n3 use Illuminate\\Support\\Str;\n4 use Illuminate\\Support\\\
  Stringable;\n 5 \n6 Str::macro('wordSplit', function ($value) {\n 7     return preg_split(\"\
  /\\s+/u\", $value);\n 8 });\n 9 \n10 Stringable::macro('wordSplit', function ()\
  \ {\n11     return collect(preg_split(\"/\\s+/u\", $this->value));\n12 });\n```\n\
  \n**图 10.36** 中的正则表达式略有不同，它匹配单词边界，而不仅仅是空白字符。我们将 `-1` 作为 `preg_split` 的参数以限制空字符串的数量。在以下输入上调用我们修改后的方法：\n\
  \n图 10.37 \n\n```\n 1 <?php\n 2 \n3 use Illuminate\\Support\\Str;\n4 use Illuminate\\\
  Support\\Stringable;\n 5 \n6 Str::macro('wordSplit', function ($value) {\n 7   \
  \  return preg_split(\"/\\s+/u\", $value, -1, PREG_SPLIT_NO_EMPTY);\n 8 });\n 9\
  \ \n10 Stringable::macro('wordSplit', function () {\n11     return collect(preg_split(\"\
  /\\s+/u\", $this->value, -1, PREG_SPLIT_NO_EMPTY));\n12 });\n```\n\n产生以下结果：\n\n\
  图 10.38 \n\n```\n 1 [\n2     \"A\",\n3     \"simple\",\n4     \"string\",\n5   \
  \  \"made\",\n6     \"up\",\n7     \"of\",\n8     \"words.\",\n9 ]\n```\n\n虽然 PHP\
  \ 已经提供了 `count`，但我们也可以这样在我们的 `wordSplit` 方法上使用它：\n\n图 10.39 \n\n```\n 1 <?php\n\
  \ 2 \n3 use Illuminate\\Support\\Str;\n4 \n5 $string = 'A simple string made up\
  \ of words.';\n6 \n7 count(Str::wordSplit($string));\n```\n\n**图 10.39** 中的示例似乎运行得正常，因为祸首是“The”和“the”之间的大小写不同。我们可以通过将所有内容转换为小写来解决这个问题。\n\
  \n图 10.40 \n\n```\n 1 <?php\n 2 \n3 use Illuminate\\Support\\Str;\n4 \n5 $string\
  \ = 'A simple string made up of words.';\n6 \n7 count(Str::wordSplit(strtolower($string)));\n\
  ```\n\n如果我们想统计每个单词出现的次数呢？实现这一点的一种方法是 Laravel 的 `Collection` 类。\n\n让我们思考我们正在做什么。我们实际上是对每个小写变体进行分组并计算组内的数量。我们可以使用\
  \ Collections 很好地表达这一点：\n\n图 10.41 \n\n```\n 1 <?php\n 2 \n3 use Illuminate\\Support\\\
  Str;\n4 \n5 $string = 'A simple string made up of words.';\n6 \n7 collect(array_map('strtolower',\
  \ Str::wordSplit($string)))\n8     ->groupBy(fn($x) => $x)\n9     ->map(fn($g) =>\
  \ count($g))\n10     ->all();\n```\n\n**图 10.41** 中的代码将产生以下结果：\n\n图 10.42 \n\n```\n\
  \ 1 array:8 [\n2     \"the\"   => 2\n3     \"quick\" => 1\n4     \"brown\" => 1\n\
  5     \"fox\"   => 1\n6     \"jumps\" => 1\n7     \"over\"  => 1\n8     \"lazy\"\
  \  => 1\n9     \"dog\"   => 1\n10 ]\n```\n\n在此时，我们已经创建了许多新的辅助方法来将字符串拆分为单词、统计唯一单词的数量以及统计每个单词出现的次数。然而，在这些方法中存在两个单词拆分的概念：检索*所有*单词和仅检索*唯一*单词。这两种技术的大部分代码是共享的，但我们没有方法获取仅唯一的单词列表。通过向我们现有的\
  \ `wordSplit` 辅助方法添加 `$unique` 参数，我们可以解决后者问题并进行一些代码清理：\n\n图 10.43 \n\n\n\n\n\n```php\n\
  <?php\n\nuse Illuminate\\Support\\Str;\nuse Illuminate\\Support\\Stringable;\n\n\
  Str::macro('wordSplit', function ($value, $unique = false) {\n    if ($unique) {\n\
  \        return array_unique(\n            array_map('mb_strtolower', Str::wordSplit($value))\n\
  \        );\n    }\n\n    return preg_split(\"/\\W+/u\", $value, -1, PREG_SPLIT_NO_EMPTY);\n\
  });\n\nStringable::macro('wordSplit', function ($unique = false) {\n    return collect(Str::wordSplit($this->value,\
  \ $unique));\n});\n\nStr::macro('uniqueWordCount', function ($value) {\n    return\
  \ count(Str::wordSplit($value, true));\n});\n\nStringable::macro('uniqueWordCount',\
  \ function () {\n    return Str::uniqueWordCount($this->value);\n});\n```\n\n完成这些重构后，我们现在可以定义新的\
  \ `wordFrequency` 辅助方法，用以返回文本中每个单词出现的次数：\n\n图 10.46\n\n```php\n<?php\n\nuse Illuminate\\\
  Support\\Str;\nuse Illuminate\\Support\\Stringable;\n\nStr::macro('wordFrequency',\
  \ function ($value) {\n    return collect(array_map('mb_strtolower', Str::wordSplit($value)))\n\
  \        ->groupBy(fn($x) => $x)\n        ->map(fn($g) => count($g))\n        ->all();\n\
  });\n\nStringable::macro('wordFrequency', function () {\n    return collect(Str::wordFrequency($this->value));\n\
  });\n```\n\n### 10.4 查找高频和重复单词\n\n在上一节中，我们开发了几个与单词相关的辅助方法，其中包含了 `wordFrequency`\
  \ 方法，它返回单词在文本中出现的次数。我们可以使用这个现有的辅助方法来实现两个新方法。\n\n第一个方法是查找文本中出现频率最高的前 n 个单词，另一个方法是查找在文本中重复出现的单词。这两个方法的实现都将比较简单。\n\
  \n我们将实现的第一个方法是 `commonWords` 方法，它将返回一个数量限制（由 `$count` 参数决定）的单词数组。我们并不关心单词在文本中出现的具体次数，只需要最常用的单词排在前面即可：\n\
  \n图 10.47\n\n```php\n<?php\n\nuse Illuminate\\Support\\Str;\nuse Illuminate\\Support\\\
  Stringable;\n\nStr::macro('commonWords', function ($value, $count = 10) {\n    return\
  \ collect(Str::wordFrequency($value))\n        ->sortDesc()\n        ->take($count)\n\
  \        ->keys()\n        ->all();\n});\n\nStringable::macro('commonWords', function\
  \ ($count = 10) {\n    return collect(Str::commonWords($this->value, $count));\n\
  });\n```\n\n对以下输入使用我们的方法：\n\n图 10.48\n\n```php\n<?php\n\nuse Illuminate\\Support\\\
  Str;\n\n$string = 'the the of hello world';\n\nStr::commonWords($string, 2);\n```\n\
  \n将产生以下单词列表：\n\n图 10.49\n\n```php\narray:\n    0 => \"the\",\n    1 => \"of\"\n\
  ```\n\n`repeatedWords` 方法将类似类似，但在这种实现中，我们希望确保数组返回的单词在输入中至少出现过：\n\n图 10.50\n\n```php\n\
  <?php\n\nuse Illuminate\\Support\\Str;\nuse Illuminate\\Support\\Stringable;\n\n\
  Str::macro('repeatedWords', function ($value, $count = 10) {\n    return collect(Str::wordFrequency($value))\n\
  \        ->filter(fn($x) => $x > 1)\n        ->sortDesc()\n        ->take($count)\n\
  \        ->keys()\n        ->all();\n});\n\nStringable::macro('repeatedWords', function\
  \ ($count = 10) {\n    return collect(Str::repeatedWords($this->value));\n});\n\
  ```\n\n像这样调用 `repeatedWords`：\n\n图 10.51\n\n```php\n<?php\n\nuse Illuminate\\Support\\\
  Str;\n\nStr::repeatedWords($string);\n```\n\n返回：\n\n图 10.52\n\n```php\narray:\n\
  \    0 => \"the\",\n    1 => \"of\"\n```\n\n### 10.5 停用词\n\n到为止，我们已经开发了提取单词、统计频率等几个辅助方法。在进行文本分析或挖掘时，一个常见问题是自然语言中的单词。考虑以下示例文本：\n\
  \n> The group of otherwise ordinary but eccentric teenagers ran towards the barn\
  \ under destress, with nothing but a crumpled newspaper for covering, before the\
  \ storm.\n\n虽然我们可以快速处理这段文本，但它包含了许多将句子连接在一起的单词或短语。在该文本上使用我们的 `commonWords` 方法会产生以下列表：\n\
  \n图 10.53\n\n```php\narray:\n    0 => \"the\",\n    1 => \"but\",\n    2 => \"group\"\
  ,\n    3 => \"of\",\n    4 => \"otherwise\",\n    5 => \"ordinary\",\n    6 => \"\
  eccentric\",\n    7 => \"teenagers\",\n    8 => \"ran\",\n    9 => \"towards\",\n\
  \    10 => \"barn\",\n    11 => \"under\",\n    12 => \"destress\",\n    13 => \"\
  with\",\n    14 => \"nothing\",\n    15 => \"a\",\n    16 => \"crumpled\",\n   \
  \ 17 => \"newspaper\",\n    18 => \"for\",\n    19 => \"covering\",\n    20 => \"\
  before\",\n    21 => \"storm\",\n    22 => \"hit\"\n```\n\n在生成的单词列表中，介词、连词和限定词占据了高频词。我们可以通过使用停用词（stop\
  \ words）来缓解这个问题。\n\n停用词是在我们进一步处理之前应该从文本中移除的列表。在我们的情况下，我们将使用简单的停用词列表。尽管如此停用“单词”可以是任何有助于我们想要分析的文本的内容：单词、短语或它们的组合。停用词列表有很多，但为了我们的目的，我们将使用以下列表来清理文本：\n\
  \n图 10.54\n\n```\nthe\nof\nbut\nunder\nwith\na\nfor\nbefore\n```\n\n我们的下一步是从文本中移除所有出现在停用词列表中的单词。假设我们想更正式地描述这个问题。我们可以说有一组单词\
  \ A 和另一个 B，我们想要创建一个包含 A 中不在 B 中的单词的新集合 C。\n\n我们可以使用 Laravel 的集合功能和 `diff` 方法轻松地实现这一点。`diff`\
  \ 方法允许我们过滤集合，并返回那些不在我们提供的任何列表中的项。图 10.55 中的代码：\n\n图 10.55\n\n```php\n<?php\n\nuse\
  \ Illuminate\\Support\\Str;\n\n$text = <<<EOT\nThe group of otherwise ordinary but\
  \ eccentric teenagers\nran towards the barn under destress, with nothing but a\n\
  crumpled newspaper for covering, before the storm hit\nfully.\nEOT;\n\n$words =\
  \ str($text)->wordSplit(true)->diff([\n    'the',\n    'of',\n    'but',\n    'under',\n\
  \    'with',\n    'a',\n    'for',\n    'before'\n]);\n```\n\n将产生以下单词列表：\n\n图 10.56\n\
  \n```\ngroup\notherwise\nordinary\neccentric\nteenagers\nran\ntowards\nbarn\ndestress\n\
  nothing\ncrumpled\nnewspaper\ncovering\nstorm\nhit\nfully\n```\n\n\n\n\n\n```php\n\
  <?php\n<?php \n\nuse Illuminate\\Support\\Str;\nuse Illuminate\\Support\\Stringable;\n\
  \nStr::macro('wordSplit', function ($value,\n                                  \
  \ $unique = false,\n                                   $stopWords = []) {\n    if\
  \ ($unique) {\n        return array_unique(array_map(\n            'mb_strtolower',\n\
  \            Str::wordSplit($value, false, $stopWords)\n        ));\n    }\n\n \
  \   return collect(preg_split(\n        \"/\\W+/u\", $value, -1,\n        PREG_SPLIT_NO_EMPTY\n\
  \    ))->diff($stopWords)->all();\n });\n\nStringable::macro('wordSplit', function\
  \ ($unique = false,\n                                          $stopWords = [])\
  \ {\n    return collect(Str::wordSplit($this->value, $unique, $stopWords));\n });\n\
  \nStr::macro('uniqueWordCount', function ($value,\n                            \
  \             $stopWords = []) {\n    return count(Str::wordSplit($value, true,\
  \ $stopWords));\n });\n\nStringable::macro('uniqueWordCount', function () {\n  \
  \  return count(Str::wordSplit($this->value, true));\n });\n\nStr::macro('wordFrequency',\
  \ function ($value,\n                                       $stopWords = []) {\n\
  \    return collect(array_map('mb_strtolower', Str::wordSplit($value)))\n      \
  \  ->diff($stopWords)\n        ->groupBy(fn($x) => $x)\n        ->map(fn($g) =>\
  \ count($g))\n        ->all();\n });\n\nStringable::macro('wordFrequency', function\
  \ ($stopWords = []) {\n   return collect(Str::wordFrequency($this->value));\n });\n\
  \nStr::macro('commonWords', function ($value,\n                                \
  \     $count = 10,\n                                     $stopWords = []) {\n  \
  \  return collect(Str::wordFrequency($value))\n        ->diff($stopWords)\n    \
  \    ->sortDesc()\n        ->take($count)\n        ->keys()\n        ->all();\n\
  \ });\n\nStringable::macro('commonWords', function ($count = 10) {\n    return collect(Str::commonWords($this->value,\
  \ $count));\n });\n\nStr::macro('repeatedWords', function ($value,\n           \
  \                            $count = 10,\n                                    \
  \   $stopWords = []) {\n    return collect(Str::wordFrequency($value))\n       \
  \ ->diff($stopWords)\n        ->filter(fn($x) => $x > 1)\n        ->sortDesc()\n\
  \        ->take($count)\n        ->keys()\n        ->all();\n });\n\nStringable::macro('repeatedWords',\
  \ function ($count = 10) {\n    return collect(Str::repeatedWords($this->value,\
  \ $count));\n });\n```\n\n我们现在可以使用现有的 `wordFrequency` 辅助方法来获取所有感兴趣的单词及其出现次数：\n\n\
  图 10.58 \n\n```php\n<?php\n<?php \n\nuse Illuminate\\Support\\Str;\n\nStr::wordFrequency($text,\
  \ [\n    'the',\n    'of',\n    'but',\n    'under',\n    'with',\n    'a',\n  \
  \  'for',\n    'before'\n ]);\n```\n\n### 10.6 构建首字母缩写和缩词\n\n使用单词辅助方法可以做的一件有趣的事是创建一个新方法，帮助从单词字符串中构建首字母缩写或缩词。例如，我们可能想将名字“Jane\
  \ Doe”缩短为“JD”甚至“J.D.”。我们已经有方法使用 `wordSplit` 从字符串中获取单词列表。我们的基本流程将是遍历字符串中的每个单词，提取每个单词的第一个字符，然后将它们拼接起来。\n\
  \n利用现有的辅助方法和 Laravel 集合，这个简单的实现可以像**图 10.59** 所示：\n\n图 10.59 \n\n```php\n<?php\n\
  <?php \n\nuse Illuminate\\Support\\Str;\n\n// 返回 \"JD\"\ncollect(Str::wordSplit('Jane\
  \ Doe'))\n    ->map(fn($w) => mb_substr($w, 0, 1))\n    ->join('');\n```\n\n**图\
  \ 10.59** 中的实现适用于我们的简单文本输入，但如果我们只想包含首字母大写的单词呢？要做到这一点，我们可以获取每个单词的第一个字符，并检查它是否已经大写，如果是，我们就使用它。我们将在一个\
  \ `initials` 宏方法中开始实现这些额外功能：\n\n图 10.60 \n\n```php\n<?php\n<?php \n\nuse Illuminate\\\
  Support\\Str;\n\nStr::macro('isCapitalized', function ($value) {\n    if (empty($value))\
  \ {\n        return false;\n    }\n    $firstChar = mb_substr($value, 0, 1);\n \
  \   return mb_toupper($firstChar) === $firstChar && mb_strtolower($firstChar) !==\
  \ $firstChar;\n });\n\nmacro('initials', function ($value, $ucOnly = true) {\n \
  \   return collect(Str::wordSplit($value))\n        ->filter(function ($word) {\n\
  \            if ($ucOnly && !$Str::isCapitalized($word)) {\n                return\
  \ false;\n            }\n            return true;\n        })\n        ->map(fn($word)\
  \ => mb_substr($word, 0, 1))\n        ->join('');\n });\n```\n\n我们向 `Str` 类添加了 `isCapitalized`\
  \ 和 `initials` 宏。`isCapitalized` 方法检查字符串的第一个字符是否大写。`initials` 方法将字符串拆分为单词，根据 `$ucOnly`\
  \ 标志对其进行过滤，提取每个单词的第一个字符，并将它们连接起来形成首字母缩写。\n\n### 10.7 计算阅读时间\n\n使用单词辅助方法可以做的一件有趣的事是为文本计算估算的阅读时间。从实现的角度来看，这相对直接：我们需要知道文本中的单词数，并有一个人们平均阅读速度的值。\n\
  \n研究分析估计，根据体裁，平均每分钟阅读量在 238 到 260 个单词之间。这个估计是通过观察成年人默读英语得出的。对于我们的用例，非虚构将使用每分钟 238\
  \ 个单词的较低值。\n\n我们实现此功能的第一个版本可能像**图 10.62**所示：\n\n```php\n<?php\n<?php \n\nuse Illuminate\\\
  Support\\Str;\n\nStr::macro('readingTime', function ($value, $wpm = 238) {\n   \
  \ return ceil(Str::wordCount($value) / $wpm);\n });\n```\n\n我们的实现使用 `wordCount`\
  \ 辅助方法获取值中的单词数，并将其除以每分钟单词数。我们还对结果使用 PHP 的 `ceil` 函数进行向上取整到最接近的分钟。\n\n我们可以这样使用新的\
  \ `readingTime` 辅助方法来获取包含 1000 个单词字符串的近似阅读时间：\n\n图 10.63 \n\n```php\n<?php\n<?php\
  \ \n\nuse Illuminate\\Support\\Str;\n\n// 返回 5.0\nStr::readingTime(\n    Str::repeat('word\
  \ ', 1000)\n );\n```\n\n我们的方法返回大约五分钟的值。下一个问题可能是，如果我们有一段极长的文本呢？例如，使用我们默认的每分钟单词数，包含\
  \ 65535 个单词的文本将返回 275 分钟的估计阅读时间。大多数人对较小的时间单位很熟悉，可能很难精确理解 275 分钟到底有多长。更好的用户体验可能是将较大的时间框架拆分为更小的单位，例如小时和分钟。\n\
  \n\n\n\n我们可以尝试自己实现它，但 Laravel 的依赖项之一是 `Carbon` 日期/时间库。幸运的是，我们有一个 `CarbonInterval`\
  \ 类，它允许我们将以秒为单位的时间间隔转换为更易于理解的格式。\n\n以下是对我们实现的的重构，以返回一个新的 `CarbonInterval` 实例，该实例提供了许多实用的方法（注意，我们将之前的计算乘以\
  \ 60，以便将分钟数转换为秒）：\n\n图 10.64 \n\n```php\n 1 <?php\n 2 \n3 use Illuminate\\Support\\\
  Str;\n 4 use Illuminate\\Support\\Stringable;\n 5 use Carbon\\CarbonInterval;\n\
  \ 6 \n7 Str::macro('readingTime', function ($value, $wpm = 238) {\n 8     return\
  \ CarbonInterval::seconds(\n 9         ceil(Str::wordCount($value) / $wpm) * 60\n\
  10     )->cascade();\n11 });\n12 \n13 Stringable::macro('readingTime', function\
  \ ($wpm = 238) {\n14     return Str::readingTime($this->value, $wpm);\n15 });\n\
  ```\n\n`CarbonInterval` 类上的 `cascade` 方法调用将我们的秒数拆分为更小的单位。使用我们在图 10.64 中更新的辅助方法，我们现在可以链式调用\
  \ `forHumans` 方法来输出格式化良好的结果：\n\n图 10.65 \n\n```php\n1 <?php\n2 \n3 // Returns \"\
  4 hours 36 minutes\"\n4 str('word ')\n5     ->repeat(65535)\n6     ->readingTime->forHumans();\n\
  ```\n\n在这一章中我们涵盖了大量内容，但在处理行和单词方面还有很多工作要做了。你可能会问：“我们接下来该去哪里？”——我们进入第十一章。\n\n## 11.\
  \ 更多的行和单词\n\n我们将继续关于行和单词的讨论。我们的大部分工作和生活都围绕着使用这两个构要素呈现的信息展开，因此我们对它们多停留一会儿是有意义的。在第\
  \ 10 章中，我们创建了几个辅助方法，使能够执行各种与单词和行相关的任务，例如：\n\n*   解析任意位置的行号和列号，\n*   统计单词出现的次数，\n\
  *   将字符串拆分为单词\n\n我们将直接进入主题，编写一组新的单词相关辅助方法，旨在帮助获取位于字符串中任意位置单词的信息。\n\n### 11.1 在任意位置定位单词\n\
  \n考虑简单的短语“Hello, world.”。假设我们需要获取位于位置 9 的单词，它对应于单词“world”中的字母“r”。选择这个位置是因为它从一开始就提出了一个令人兴奋的挑战：在单词右侧，我们对单词边界有多种选择，而且右侧既有单词边界，又是字符串的末尾。\n\
  \n在处理这类问题时，人们往往想将字符串拆分为单词数组，然后计算遇到的每个单词的字符数，直到进入目标位置的范围。虽然这种方法可行，但它通常会忽略空格或标点符号字符等因素。我在处理这类问题时喜欢使用的技术是从字符串中请求的位置开始，向后遍历直到遇到单词边界，然后向后执行同样的操作。该技术的基本实可以在现在图\
  \ 11.1 中：\n\n图 11.1 \n\n```php\n1 <?php\n 2 \n3 use Illuminate\\Support\\Str;\n\
  \ 4 \n5 function getWordAtPosition($value, $position) {\n 6     if ($position <\
  \ 0) { return null; }\n 7 \n8     $string = new Utf8StringIterator($value);\n 9\
  \ \n10     if ($position > count($string)) { return null; }\n11 \n12     $leadingChars\
  \ = '';\n13     $trailingChars = '';\n14 \n15     for ($i = $position; $i >= 0;\
  \ $i--) {\n16         $char = $string[$i];\n17 \n18         if (ctype_space($char)\
  \ || ctype_punct($char)) {\n19             break;\n20         }\n21         $leadingChars\
  \ .= $char;\n22     }\n23     if ($position + 1 < count($string)) {\n24        \
  \ for ($i = $position + 1; $i < count($string); $i++) {\n25             $char =\
  \ $string[$i];\n26 \n27             if (ctype_space($char) || ctype_punct($char))\
  \ {\n28                 break;\n29             }\n30 \n31             $trailingChars\
  \ .= $char;\n32         }\n33     }\n34 \n35     return Str::reverse($leadingChars).$trailingChars;\n\
  36 }\n```\n\n我们在 `getWordAtPosition` 中看到了两个 PHP 函数：`ctype_space` 和 `ctype_punct`。这些实用的函数检查字符串是否由空格或标点组成。第一个循环从请求的位置开始向后遍历字符串，直到遇到字符，此时循环停止。由于我们是反向遍历，获取的字符将与输入中出现的顺序反反。我们在函数结束时通过反转字符来处理。第二个循环与第一个非常相似，不同在于我们从请求位置之后开始，因为请求的位置已经是字符串的一部分。我们继续遍历字符串直到遇到空格或标点字符。函数的最后一步是连接这些字符。\n\
  \n我们现在可以使用该方法获取字符串中任意位置的单词，如下：\n\n图 11.2 \n\n```php\n1 <?php\n2 \n3 $text = 'Hello,\
  \ world';\n4 \n5 // Returns \"world\"\n6 getWordAtPosition($text, 9);\n7 \n8 //\
  \ Returns \"world\"\n9 getWordAtPosition($text, 10);\n10 \n11 // Returns \"Hello\"\
  \n12 getWordAtPosition($text, 2);\n```\n\n我们当前的实现在提供单词内部的位置时表现正常，但当我们提供对应空格或标点的位置时会返回意外之外的结果。例如，如果我们对位置\
  \ 6 调用函数（这对应于“Hello,”和“world”之间的空格），它目前会返回“world。”我们可以通过在遍历字符串之前检查位置处的字符来解决这个问题，如下：\n\
  \n图 11.3 \n\n```php\n1 <?php\n2 \n3 use Illuminate\\Support\\Str;\n 4 \n5 function\
  \ getWordAtPosition($value, $position) {\n6     if ($position < 0) { return null;\
  \ }\n 7 \n8     $string = new Utf8StringIterator($value);\n 9 \n10     if ($position\
  \ > count($string)) { return null; }\n11 \n12     $posChar = $string[$position];\n\
  13 \n14     if (ctype_space($posChar) || ctype_punct($posChar)) {\n15         return\
  \ null;\n16     }\n17 \n18     $leadingChars = '';\n19     $trailingChars = '';\n\
  20 \n21     for ($i = $position; $i >= 0; $i--) {\n22         $char = $string[$i];\n\
  23 \n24         if (ctype_space($char) || ctype_punct($char)) {\n25            \
  \ break;\n26         }\n27 \n28         $leadingChars .= $char;\n29     }\n30 \n\
  31     if ($position + 1 < count($string)) {\n32         for ($i = $position + 1;\
  \ $i < count($string); $i++) {\n33             $char = $string[$i];\n34 \n35   \
  \          if (ctype_space($char) || ctype_punct($char)) {\n36                 break;\n\
  37             }\n38 \n39             $trailingChars .= $char;\n40         }\n41\
  \     }\n42 \n43     return Str::reverse($leadingChars).$trailingChars;\n44 }\n\
  ```\n\n现在，对位置 6 调用我们重构后的函数将返回 `null`，这与请求不在字符串边界内的单词的行为是一致的。\n\n终点已在眼底，但在继续之前，我们还有最后一件事需要处理。如果我们使用当前的实现尝试获取一个连字符单词，它目前会返回恰好位于请求位置的单词。我们可以通过添加第三个可选参数来解决这个问题，该参数接收一个我们*不应该*断开的字符数组。\n\
  \n\n\n\n```php\n<?php\n\nuse Illuminate\\Support\\Str;\n\nfunction getWordAtPosition(\n\
  \    $value,\n    $position,\n    $chars = ['-']\n    ) {\n\n    if ($position <\
  \ 0) { return null; }\n\n    $string = new Utf8StringIterator($value);\n\n    if\
  \ ($position > count($string)) { return null; }\n\n    $posChar = $string[$position];\n\
  \n    if (ctype_space($posChar) || ctype_punct($posChar)) {\n        return null;\n\
  \    }\n    if (! in_array($posChar, $chars) &&\n        (ctype_space($posChar)\
  \ || ctype_punct($posChar))) {\n        return null;\n    }\n\n    $leadingChars\
  \ = '';\n    $trailingChars = '';\n\n    for ($i = $position; $i >= 0; $i--) {\n\
  \        $char = $string[$i];\n\n        if (in_array($char, $chars)) {\n      \
  \      $leadingChars .= $char;\n            continue;\n        }\n\n        if (ctype_space($char)\
  \ || ctype_punct($char)) {\n            break;\n        }\n\n        $leadingChars\
  \ .= $char;\n    }\n\n    if ($position + 1 < count($string)) {\n        for ($i\
  \ = $position + 1; $i < count($string); $i++) {\n            $char = $string[$i];\n\
  \n            if (in_array($char, $chars)) {\n                $trailingChars .=\
  \ $char;\n                continue;\n            }\n\n            if (ctype_space($char)\
  \ || ctype_punct($char)) {\n                break;\n            }\n\n          \
  \  $trailingChars .= $char;\n        }\n    }\n\n    return Str::reverse($leadingChars).$trailingChars;\n\
  }\n```\n\n我们对图 11.4 的重构现在使我们能够在下面的示例中获取连字符单词“hello-world”：\n\n图 11.5 \n\n```php\n\
  <?php\n\n// Returns \"hello-world\"\ngetWordAtPosition(\"hello-world\", 5);\n\n\
  // Returns \"hello-world\"\ngetWordAtPosition(\"hello-world\", 5, ['-']);\n\n//\
  \ Returns null\ngetWordAtPosition(\"hello-world\", 5, []);\n```\n\n我们的最后一步是将此函数封装成一组\
  \ Laravel 字符串辅助方法方法：\n\n图 11.6 `wordAt` 辅助方法实现\n\n```php\n<?php\n\nuse Illuminate\\\
  Support\\Str;\nuse Illuminate\\Support\\Stringable;\n\nStr::macro('wordAt', function\
  \ ($value, $position, $chars = ['-']) {\n    if ($position < 0) { return null; }\n\
  \n    $string = new Utf8StringIterator($value);\n\n    if ($position > count($string))\
  \ { return null; }\n\n    $posChar = $string[$position];\n\n    if (! in_array($posChar,\
  \ $chars) &&\n        (ctype_space($posChar) || ctype_punct($posChar))) {\n    \
  \    return null;\n    }\n\n    $leadingChars = '';\n    $trailingChars = '';\n\n\
  \    for ($i = $position; $i >= 0; $i--) {\n        $char = $string[$i];\n\n   \
  \     if (in_array($char, $chars)) {\n            $leadingChars .= $char;\n    \
  \        continue;\n        }\n\n        if (ctype_space($char) || ctype_punct($char))\
  \ {\n            break;\n        }\n\n        $leadingChars .= $char;\n    }\n\n\
  \    if ($position + 1 < count($string)) {\n        for ($i = $position + 1; $i\
  \ < count($string); $i++) {\n            $char = $string[$i];\n\n            if\
  \ (in_array($char, $chars)) {\n                $trailingChars .= $char;\n      \
  \          continue;\n            }\n\n            if (ctype_space($char) || ctype_punct($char))\
  \ {\n                break;\n            }\n\n            $trailingChars .= $char;\n\
  \        }\n    }\n\n    return Str::reverse($leadingChars).$trailingChars;\n});\n\
  \nStringable::macro('wordAt', function ($position, $chars = ['-']) {\n    return\
  \ static (\n        Str::wordAt($this->value, $chars)\n    );\n});\n```\n\n### 11.2\
  \ 定位相邻单词和字符\n\n我们将共同查看下一个任务是从任意位置获取相邻的单词。例如，给定句子“The quick brown fox jumped over\
  \ the lazy dog”，如果我们提供位置 6，我们可能想要获取左侧的单词“The”和右侧的单词“brown”。有几种方法可以实现这一点。第一种想法可能是更新我们之前的\
  \ `wordAt` 实现并跳过字符，直到到达一个单词边界。\n\n等待看到单词边界的方法虽然有效，但它涉及跟踪额外的状态，这可能会很快变得复杂。一个更优雅的解决方案可能是获取相邻非单词边界字符的位置，然后将该位置传递给我们现有的\
  \ `wordAt` 辅助方法。作为开始，我们将开始获取目标位置左侧下一个非单词边界字符的位置。这个实现读起来很熟悉，因为它是我们 `wordAt` 辅助方法的精简版本，但只关注向后扫描输入字符串。图\
  \ 11.7 提供了获取所需位置之前的单词结束位置的实现：\n\n图 11.7 \n\n```php\n<?php\n\nfunction getNextWordPositionLeft(\n\
  \    $value,\n    $position,\n    $chars = ['-']\n) {\n    if ($position < 0) {\
  \ return null; }\n\n    $string = new Utf8StringIterator($value);\n\n    if ($position\
  \ > count($string)) { return null; }\n\n    $exitedInitialWord = false;\n\n    for\
  \ ($i = $position; $i >= 0; $i--) {\n        $char = $string[$i];\n\n        if\
  \ (in_array($char, $chars)) {\n            if ($exitedInitialWord) {\n         \
  \       return $string->getPositionFromCharIndex($i);\n            }\n\n       \
  \     continue;\n        }\n\n        if (ctype_space($char) || ctype_punct($char))\
  \ {\n            $exitedInitialWord = true;\n            continue;\n        }\n\n\
  \        if ($exitedInitialWord) {\n            return $string->getPositionFromCharIndex($i);\n\
  \        }\n    }\n\n    return null;\n}\n```\n\n在我们的示例上调用此函数返回值 2，这对应于“The”单词中的字母“e”：\n\
  \n图 11.8 \n\n```php\n<?php\n\n$text = 'The quick brown fox jumped over the lazy\
  \ dog';\n\n// Returns 2\ngetNextWordPositionLeft($text, 6);\n```\n\n目前还没有返回实际的单词，但我们可以在此函数的结果上再次调用\
  \ `wordAt` 来返回整个单词：\n\n图 11.9 \n\n```php\n<?php\n\nuse Illuminate\\Support\\Str;\n\
  \n$text = 'The quick brown fox jumped over the lazy dog';\n\n// Returns \"The\"\n\
  Str::wordAt(\n    $text,\n    getNextWordPositionLeft($text, 6)\n);\n```\n\n实现获取右侧单词的函数也相对简单：\n\
  \n图 11.10 \n\n```php\n<?php\n\nfunction getNextWordPositionRight(\n    $value,\n\
  \    $position,\n    $chars = ['-']\n) {\n    if ($position < 0) { return null;\
  \ }\n\n    $string = new Utf8StringIterator($value);\n\n    if ($position > count($string))\
  \ { return null; }\n\n    $exitedInitialWord = false;\n\n    for ($i = $position;\
  \ $i < count($string); $i++) {\n        $char = $string[$i];\n\n        if (in_array($char,\
  \ $chars)) {\n            if ($exitedInitialWord) {\n                return $string->getPositionFromCharIndex($i);\n\
  \            }\n\n            continue;\n        }\n\n        if (ctype_space($char)\
  \ || ctype_punct($char)) {\n            $exitedInitialWord = true;\n           \
  \ continue;\n        }\n\n        if ($exitedInitialWord) {\n            return\
  \ $string->getPositionFromCharIndex($i);\n        }\n    }\n\n    return null;\n\
  }\n```\n\n通过结合使用我们所有的新函数，只需向我们的各种函数提供位置 6，就可以获取单词“The”、“quick”和“brown”：\n\n图 11.11\
  \ \n\n\n\n\n\n```\n 1 <?php\n 2 \n 3 use Illuminate\\Support\\Str;\n 4 \n 5 $text\
  \ = 'The quick brown fox jumped over the lazy dog';\n 6 \n 7 // Returns \"The\"\n\
  \ 8 Str::wordAt(\n 9     $text,\n10     getNextWordPositionLeft($text, 6)\n11 );\n\
  12 \n13 // Returns \"quick\"\n14 Str::wordAt($text, 6);\n15 \n16 // Returns \"brown\"\
  \n17 Str::wordAt(\n18     $text,\n19     getNextWordPositionRight($text, 6)\n20\
  \ );\n```\n\n我们可以将这些函数封装成一组新的辅助方法，使它们更易于使用：\n\n图 11.12 获取左侧和右侧单词\n\n```\n  1 <?php\n\
  \  2 \n  3 use Illuminate\\Support\\Str;\n  4 use Illuminate\\Support\\Stringable;\n\
