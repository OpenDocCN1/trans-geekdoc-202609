- pgno: 73
  md: '# I.7.4. A Dictionary Attack on Passwords


    If you carefully considered the previous task and accomplished it, you will have
    discovered that guessing even the shortest password takes considerable time. However,
    users rarely make a meaningless password. The password typically is a word, sometimes
    padded by several digits. This provides rich possibilities for dictionary attacks.
    A well-chosen dictionary allows someone to discover passwords in a reasonable
    amount of time. Guess the passwords with the hash codes shown in List-7.1 using
    the standard dictionary of the Linux operating system. This dictionary can be
    found in the /usr/share/dict/linux.words file.


    ![](img/a893312ec68b8170fe567f785e95c06e_73_0.png)


    NOTE If you run scripts under Windows, you can find the dictionary in the /scripts/7.4/linux.words
    file on the accompanying CD-ROM.


    # I.7.5. Password Generator


    The two preceding tasks clearly demonstrate that short and meaningful passwords
    can be guessed quickly and easily. The way out of this situation is the restriction
    on the password length. Registration system might require users to supply passwords
    no shorter than six characters, containing both letters and digits. However, the
    most efficient protection is automatic generation of longer and highly-protected
    passwords. Develop a small Web application for generating such passwords (Fig.
    I.7.5).


    ```

    http://localhost/1.php - Microsoft Internet Explorer

    File Edit View Favorites Tools Help

    Search Favorites Media

    Address http://localhost/1.php Go Links

    Generate

    xZp$17ig

    Done Local intranet

    ```


    Fig. I.7.5. Automatically generating passwords of the specified length'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# Chapter I.7: Authorization and Authentication 61


    # I.7.6. Protecting Text Files from Being Viewed in a Browser


    Even if you use complex and long passwords subject to irreversible encryption,
    storing information in text file available for viewing through a browser is a
    potential security hole. The intruder can study the text file structure, understand
    the internal organization of your site, and use unprotected and unencrypted information
    in his or her purposes. For example, it is possible to use email addresses to
    organize lists. Using the .htaccess configuration file, protect all text files
    stored in a specific directory from being viewed in the browser window (Fig. I.7.6).


    ![](img/a893312ec68b8170fe567f785e95c06e_74_0.png)


    Fig. I.7.6. Preventing access to text files in the browser


