  md: "# II.4.8. Sorting\n\nThe results of an SQL query request are sorted in ascending\
    \ order using the ORDER BY statement followed by the name of the column, by which\
    \ the sorting is be carried out. Specifying the optional DESC keyword will cause\
    \ the results to be sorted in descending order. Thus, solving the problem comes\
    \ down to constructing an SQL query with the column name, by which to sort the\
    \ results added after the ORDER BY statement dynamically. This query may be the\
    \ following:\n\n```\nSELECT * FROM products\nORDER BY $order $desc\n```\n\nHere,\
    \ the $order variable holds the name of the column, by which the result should\
    \ be sorted. Depending on the sorting order, the value of the $desc variable is\
    \ either blank or set to DESC.\n\n# ### II.4.26. Sorting\n\n```\n<php\n// Checking\
    \ the parameters passed to the script\n$order = \"name\";\nif($_GET['order'] ==\
    \ 'name') $order = \"name\";\nif($_GET['order'] == 'price') $order = \"price\"\
    ;\nif($_GET['order'] == 'grade') $order = \"grade\";\nif($_GET['order'] == 'count')\
    \ Sorder = \"count\";\nif($_GET['add'] == 'desc')\n{\n    $desc = \"DESC\";\n\
    \    $add = \"\"\n}\nelse\n{\n    $desc = \"\"\n    $add = \"desc\";\n}\n// Connecting\
    \ to the database\nrequire_once(\"config.php\");\n\n// Displaying a spare parts\
    \ list\n$query = \"SELECT * FROM products\n```"
