    \ The script displays a list of the mail relays and their priorities.\n\n# II.11.10.\
    \ Obtaining a list of mail relays\n\n```\n<?php\n// An email address\n$email =\
    \ \"mail@yandex.ru\";\n// Breaking the address into a two-element array:\n// the\
    \ mailbox name and the server name\n$arr = explode(\"@\", $email);\n// Placing\
    \ the mail server name into the $host variable\n$host = $arr[1];\n// Determining\
    \ the mail relays of the $host server and\n// displaying them, indicating the\
    \ priorities\ngetmxrr($host, $mxostsarr, $weight);\necho\necho \"Email on the\
    \ server $email is posted by the following hosts: <br>\";\nfor ($i = 0; $i < count($mxostsarr);\
    \ $i++) {\n    echo (\"$mxostsarr[$i] = $weight[$i]<br>\");\n}\n?>\n```\n\nThe\
    \ list of the server's mail relays is obtained using the getmxrr() function. Its\
    \ general syntax is the:\n\n```\nstring getmxrr(string hostname, array mxhost,\
    \ {}, array weight);\n```\n\nThe function accepts the host name in the given domain\
    \ as a parameter and fills the mxhost array with the names of the mail relays\
    \ of this domain. If the optional weight array argument is specified, the function\
    \ fills it with preferences for each corresponding relay. The list of mail relays\
    \ used, for example, by the Yandex SMTP server for posting messages returned by\
    \ the script in Listing II.11.10 will be the following:\n\n```\nmx2.yandex.ru\
    \ = 10\nmx1.yandex.ru = 0\n```"
