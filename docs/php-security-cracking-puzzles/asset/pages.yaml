  md: '# 288 Part II: Solutions


    in the URL must be set to 1 (i.e., http://www.mysite.ru/1.php?total=1), the password
    field must be left blank, and any registered name must be entered into the name
    field (Fig. II.7.12). The password field must be left empty to keep triggering
    the if(empty($_POST[''name'']) && empty($_POST[''password''])) check, whose execution
    will rewrite the $total variable.


    ![](img/a893312ec68b8170fe567f785e95c06e_301_0.png)


    The vulnerability in this example is easy to see. In real-life registration systems,
    the code is much crafter and vulnerabilities are less obvious.


    ![](img/a893312ec68b8170fe567f785e95c06e_301_1.png)


    Fig. II.7.12. Bypassing session-based authorization


    Verifying the complete set of parameters is passed using the GET method is not
    the best solution, because the total parameter can also be passed using the POST
    method or even in a cookie. An effective solution would be to set the value of
    the register_globals variable in the php.ini configuration file or in the .htaccess
    file to Off(register_globals off and php_flag register_globals off, respectively).


    However, these configuration files are not always accessible to site owners on
    rented servers; therefore, the most appropriate solution is to correct the code
    itself. This can be done by getting rid of the $total variable, as shown in Listing
    II.7.17.'
