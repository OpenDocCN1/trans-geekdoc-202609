    \ Whois server\n// responsible for the $first_dom domain\nfor($i = 0; $i < count($servers);\
    \ $i++) {\n    if($servers[$i][0] == $first_dom)\n    {\n        // Remembering\
    \ the server's name\n        $whois = $servers[$i][1];\n        // Remembering\
    \ the no-such-domain-name phrase\n        $not_found_string = $servers[$i][2];\n\
