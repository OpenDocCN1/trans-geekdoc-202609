    \ echo \"<tr><td>Anonymous</td></tr>\";\n    else echo \"<tr><td>\" . $auth['user']\
    \ .\"</td></tr>\";\n}\necho \"</table>\";\n}\n?>\n```\n\nThe loop forms the table\
    \ with the names of the site's visitors. If the user name is unknown (e.g., the\
    \ user hasn't been authorized), then it is necessary to display the `Anonymous`\
    \ name.\n\n# II.5.2. Custom Sessions Mechanism\n\nThe custom sessions mechanism\
    \ can be implemented by registering handlers using the `session_set_save_handler()`\
    \ function, which has the following syntax:\n\n```\nsession_set_save_handler(open,\
    \ close, read, write, destroy, gc);\n```\n\nThe function accepts six string arguments,\
    \ which are the names of handler functions. These names have the following meanings:\n\
    \n+   - open The method that executes at session initialization in the client\
    \ code by applying the `session_start()` function. The code for establishing the\
    \ database connection must be placed here."
