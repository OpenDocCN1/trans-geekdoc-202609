  md: '# II.4.5. User Deletion and SQL Injections


    The vulnerability in this problem is similar to the vulnerability in the previous
    one: User-supplied data are not sanitized when used in SQL requests. However,
    the UNION construction cannot be used to exploit this vulnerability, because it
    only works with SELECT queries. Here, changing the logic of the WHERE construction
    will do the trick. An SQL query to delete a user looks as shown in Listing II.4.17.


    Listing II.4.17. An SQL query to delete a user


    ```

    DELETE FROM userslist

    WHERE pass = ''password'' AND

    name = ''name''

    ```


    The injection query can be passed using the password or user name by replacing
    the chosen parameter''s value with the string '' OR 1 = ''1''.


    Listing II.4.18. The injection query


    ```

    DELETE FROM userslist

    WHERE pass = ''password'' AND

    name = '''' OR 1 = ''1''

    ```


    The WHERE condition doctored in this way always returns true, deleting all records
    from the userslist (Fig. II.4.11).


    ![](img/a893312ec68b8170fe567f785e95c06e_215_0.png)'
  merge: -1
  img_proc: true
- pgno: 216
  md: '# Chapter II.4: MySQL and SQL Injections 203


    ![](img/a893312ec68b8170fe567f785e95c06e_216_0.png)


    Fig. II.4.11. The results of the modified WHERE construction


    As in the previous problem, this trick will not work if the magic quote modes
    is enabled on the server.


    To delete all users from the database, the malefactor doesn''t even have to know
    any passwords. You could try to protect against this attack by using the LIMIT
    statement to limit to one the number of records that can be deleted at a time
    (Listing II.4.19).


    # Listing II.4.19. Limiting the number of deletions


    ```

    DELETE FROM userslist

    WHERE pass = ''password'' AND

    name = ''name''

    LIMIT 1

    ```


    However, this protection can be easily circumvented by simply calling the script
    until all records are deleted. And the malefactor doesn''t have to do this manually,
    because the process can easily be automated. Moreover, there is at least one more'
