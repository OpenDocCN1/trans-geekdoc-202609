  md: '# Chapter II.7: Authorization and Authentication 265


    encoded string. The most common hashing algorithm is MD5, which is implemented
    using the same-name-function, as follows:


    ```

    string md5(string str [, bool raw_output])

    ```


    The function takes the str string that must be encrypted and returns its unique
    128-bit hash code. If the value of the optional argument raw_output is true, a
    binary 16-character string is returned. The probability of two strings producing
    the same code approaches zero.


    The analogous function md5_file() is often used to create a unique hash code for
    a file sent over a network. After downloading a file, its integrity can be verified
    by calculating its MD5 hash code and comparing it against the hash code provided
    by the developer. This procedure makes it possible to ensure that files transferred
    over a network are not corrupted. Also, it can be used to prevent the alteration
    of files and is often employed to protect large software distributions.


