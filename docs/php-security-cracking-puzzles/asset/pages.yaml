  img_proc: true
- pgno: 308
  md: "# Chapter II.8: Using Information from Other Sites 295\n\nHowever, it has been\
    \ available only as of PHP 4.3.0. For earlier PHP versions, the script shown in\
    \ Listing II.8.2 has to be used.\n\n# Listing II.8.2. Downloading HTML pages (versions\
    \ before PHP 4.3.0)\n\n```\n<?php\n// Obtaining the remote page handle\n$fd =\
    \ fopen(\"http://www.php.net/\", \"r\");\nif (!$fd) exit(\"Cannot find the requested\
    \ page!\");\n$content = \"\";\n// Reading the contents of the file into the $content\
    \ variable\nwhile (!feof($fd)) {\n    $content .= fgets($fd, 1024);\n}\n// Closing\
    \ the file\nclose($fd);\n\n// Saving the contents of the page in a file\n$fd =\
    \ fopen(\"url.txt\", \"w\");\nfwrite($fd, $content);\nclose($fd);\n?>\n```\n\n\
    In this case, the fgets() function loads the page by extracting the data from\
    \ the line by line. The function's second parameter specifies the maximum number\
    \ of bytes the function can read at. As a rule, the string length does not exceed\
    \ 1,024 characters, so this parameter may be left as is. The script downloads\
    \ files slower than the file_get_contents() function does; whereas the function\
    \ executes binary code created in C. This approach, however, is more suitable\
    \ for downloading large files. The maximum amount of memory that a script may\
    \ consume is limited by the memory_limit directive in the php.ini file. This directive\
    \ is usually set to 8 MB or 16 MB. This amount of memory is what a PHP script\
    \ and all variables and arrays it may consume. Thus, if a 10-MB file is read completely\
    \ into a variable, it will not be possible to perform even a replacement with\
