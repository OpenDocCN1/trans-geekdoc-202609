    # II.7.9. Session-Based Authorization


    If the number of records in the database meeting the login and password criteria
    is greater than zero, the user is allowed to enter the system: The login and password
    are stored in a session. The bug in the registration system is that the number
    of records is stored in the temporary variable $total, which is not initialized.
    If the register_globals directive in the php.ini configuration file is set to
    On, it is possible to pass a value directly to the variable using the POST or
    GET method. This means that all that must be done to enter the system is the value
    of the total parameter'
