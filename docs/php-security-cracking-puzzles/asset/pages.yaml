    \ .$count[$file].\" time(s).<br>\";\n}\\ ?>\n```\n\nThe names of the downloaded\
    \ files are stored in the $file name array; when a new archive for downloading\
    \ is added, it is automatically registered in the system. The advance registration\
    \ is necessary for several reasons. First, when a file name is passed in the down\
