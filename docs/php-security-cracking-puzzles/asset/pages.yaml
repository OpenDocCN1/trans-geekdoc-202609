  md: "# Part II: Solutions\n\nworry about protecting it, sooner or later it will\
    \ be broken into, even if for practice by some beginner hacker.\n\nUsing the browser\
    \ to carry out this sort of break-in is quite interesting, but many users do not\
    \ have the necessary cookie-editing tools within easy reach. In such a case, sockets\
    \ can be used to edit cookies by sending the following counterfeit HTTP header\
    \ to the server:\n\nCookie: user = user_name;\n\nHere, user name is the value\
    \ that the user cookie will receive. Cookie values must be passed through the\
    \ urlencode() function to strip them of any national and special characters, which\
    \ are not allowed in HTTP headers. A script implementing the SQL injection using\
    \ an HTTP header is shown in Listing II.7.14.\n\n# Listing II.7.14. Counterfeiting\
    \ a cookie using an HTTP header\n\n```\n<?php\n$hostname = \"localhost\";\n$path\
