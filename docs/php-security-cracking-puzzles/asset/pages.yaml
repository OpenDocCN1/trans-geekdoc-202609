  md: 'The next line in the file is found using the regular expression #([\d]+) ([\^\n]+)
    (\n|\s*$))#U. The first parenthesized expression corresponds to the number; the
    second parenthesized expression corresponds to any sequence of characters except
    the newline character (\n). The last parenthesized expression corresponds to the
    newline character or the end-of-line character ($). The search for the end-of-line
    character is necessary to properly identify the last line, which does not end
    in a new line character.


    The results of using the script in Listing II.3.26 are shown in Listing II.3.27.
