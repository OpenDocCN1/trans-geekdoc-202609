  md: '# Chapter II.12: The Whois Service 353


    By the time this book is published, the mysql3.com domain name may be registered.


    Unfortunately, the reply format is not standardized, and different Whois servers
    give a different answer for an unregistered domain name. Consequently, answers
    from each Whois server must be processed individually. This task can be implemented
    with the help of the script shown in Listing II.12.8.


    The complete source code for the script can be found on the accompanying CD-ROM.


    # Listing II.12.8. A universal script for verifying domain names


    ```

