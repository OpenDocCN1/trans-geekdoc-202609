  md: '# Chapter II.11: Electronic Mail


    ![](img/a893312ec68b8170fe567f785e95c06e_344_0.png)


    # II.11.1. Sending Email from a Site


    Mail in PHP is sent using the `mail()` function, whose general format is the following:


    ```

    mail(string to, string subject, string body [,string headers], [,string parameters])

    ```


    The function accepts the following parameters:


    +   - to — The recipient''s email address

    - subject — The subject of the message

    - message — The message text

    - headers — Additional headers

    - parameters — Additional parameters


    If the fourth parameter, `headers`, is not specified, no additional mail headers
    are attached to the message. However, the message format often needs to be changed
    from plain text to HTML text, or to have a certain character set specified. The
    message format and character set are specified with the help of the `Content-Type`
    and `charset` mail headers, respectively, as follows:


    ```

    Content-Type: text/html; charset = ASCII\r\n

    ```'
