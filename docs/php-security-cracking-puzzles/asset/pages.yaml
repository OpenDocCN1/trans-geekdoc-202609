- pgno: 334
  md: '# # Chapter II.10: Hypertext Transfer Protocol


    ![](img/a893312ec68b8170fe567f785e95c06e_334_0.png)


    # ## II.10.1. Downloading a Page


    A connection to the remote server is opened using the `fsockopen()` function,
    whose general format is the following:


    ```

    resource fsockopen (string target, int port [, int errno [, string errstr [, float
    timeout]]])

    ```


    The function accepts five parameters, the first two of which are mandatory. These
    are the host address, `target`, and the port number, `port`. The function returns
    a file pointer if there is a successful connection attempt, and otherwise returns
    false. If the optional `errno` and `errstr` parameters are passed to the function,
    the error code and a text description, respectively, are placed into them. The
    fifth parameter, also optional, specifies the timeout (in seconds) for establishing
    a connection.


    Listing II.10.1 shows an example of using the `fsockopen()` function in a script
    to download the home page of the `http://www.php.net` site.'
  merge: -1
  img_proc: true
- pgno: 335
  md: "# Listing II.10.1. Using the fsockopen() function\n\n```\n<?php\nfunction get_content($hostname,\
    \ $path) \n{\n    $line = \"\";\n    // Establishing a connection with the host\n\
    \    // whose name was passed in the $hostname variable\n    $fp = fsockopen($hostname,\
    \ 80, $errno, $errstr, 30);\n    // Verifying the connection\n    if (!$fp) echo\
    \ \"$errstr ($errno)<br />\\n\";\n    else\n    {\n        // Constructing an\
    \ HTTP request to\n        // send to the server\n        $headers = \"GET $path\
    \ HTTP/1.1\\r\\n\";\n        $headers .= \"Host: $hostname\\r\\n\";\n        $headers\
    \ .= \"Connection: Close\\r\\n\";\n        // Sending the HTTP request to the\
    \ server\n        fwrite($fp, $headers);\n        // Receiving a reply from the\
    \ server\n        while (!feof($fp))\n        {\n            $line = fgets($fp,\
    \ 1024);\n        }\n        fclose($fp);\n    }\n    return $line;\n}\n$hostname\
    \ = \"www.php.net\";\n$path = \"/\";\n// Setting a longer script execution time\n\
    // The page will not be displayed until\n// all of it has been loaded.\nset_time_limit(180);\n\
    // Calling the custom function\necho get_content($hostname, $path);\n?>\n```"
