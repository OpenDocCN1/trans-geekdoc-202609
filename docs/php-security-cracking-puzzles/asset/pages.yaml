    # ## II.13.1. The Ping Utility


    You should remember that unlike its Windows counterpart, UNIX ping utility keeps
    executing until you terminate it by pressing the <Ctrl>+<C> combination. Because
    it is rather difficult to imitate this action from a Web application, the execution
    can be terminated with the help of the -c switch, which specifies the number of
    echo requests to send. To check, IP address 192.168.200.3, the ping command is
    executed as follows:


    ```

    ping 192.168.200.3 -c 4

    ```


    All that remains is to create an HTML form that specifies the IP address to check
    and the number of echo requests to send. A script that solves this problem is
    shown in Listing II.13.1.


