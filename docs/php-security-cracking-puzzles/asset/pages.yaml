    \ a calendar as a two-dimensional array. The script to be developed must contain\
    \ three blocks:\n\n+   - The first week\n- Subsequent weeks\n- The calendar output\n\
    \nThe script that implements the output of the calendar for the current month\
    \ in the American format is shown in Listing II.1.19.\n\n![](img/a893312ec68b8170fe567f785e95c06e_126_0.png)\n\
    \nIt is necessary to recall that the week starts from Sunday, in contrast to the\
    \ Russian format, in which it starts from Monday. Therefore, when computing the\
    \ week number, the value of the $dayofweek variable must be shifted.\n\n# Listing\
    \ II.1.19. The calendar for the current month in the U.S. format\n\n```\n<?php\n\
    // Computing the number of days in the current month\n$dayofmonth = date('t');\n\
    // Counter for the days of month\n$day_count = 1;\n\n///////////////////////////////////////////////////////\\\
