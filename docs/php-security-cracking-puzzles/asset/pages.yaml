- pgno: 403
  md: '# # PHP SECURITY & CRACKING


    # # PUZZLES


    Concentrating on the problem of breaking and protecting Web applications written
    in PHP, this book also considers related Web programming topics such as client
    technologies (HTML, cookies, JavaScript), application protocols (HTTP, SMTP),
    SQL query language, and the breaking and protecting of the Apache Web server.
    Because these techniques can only be achieved by practical work, the book is divided
    into two parts: one covering the problems (puzzles) and one devoted to solving
    them. Evaluating the main drawback for many Web programmers who try to protect
    their applications from being hacked that they think differently than hackers,
    this book allows the reader to get into a hacker''s shoes and understand the techniques
    they use.


    Solutions for Web apps


