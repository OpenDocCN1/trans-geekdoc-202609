  md: '# II.5.3. Protecting HTML Forms Using Sessions


    If the document is in use, it is possible to deny access to a second user trying
    to access it, thus ensuring data consistency and integrity. In other words, there
    are lots of application areas for the custom sessions mechanism.


    HTML forms often must be protected when it is necessary to secure the service
    on your site against access from the third-party servers. To achieve this, it
    is necessary to relate the HTML form to the session. Having obtained the SID using
    the session_id() function in the index.php file, it is necessary to place it into
    the hidden field of the form that requires protection (Listing II.5.9).


    Listing II.5.9. Corrected variant of the index.php file


    ```

    <?php

    // Initiating the session

    session_start();

    ?>

    <table>

    <form action=2.php method=post>

    <input type=hidden name=session_id value=''<?php session_id(); ?>''>

    <tr>

    <td>Name:</td>

    <td><input type=text name=name></td>

    </tr>

    <tr>

    <td>Password:</td>

    <td><input type=password name=pass></td>

    </tr>

    <tr>

    <td>&nbsp;</td>

    <td><input type=submit value=''Enter''></td>

    </tr>

    </form>

    </table>

    ```


    After that, the HTML form handler checks whether the SID value obtained from the
    HTML form matches the current SID value. If these values do not match,'
