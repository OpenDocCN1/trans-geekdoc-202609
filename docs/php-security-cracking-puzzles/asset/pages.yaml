    # II.7.7. Cookie-Based Authorization


    The problem with the authorization script is that authorization occurs only once;
    only the cookie with the user''s name is checked in all subsequent pages. This
    makes it easy to fake the cookie, which can be done using a browser (e.g., Opera,
    which has a cookie-editing feature) or programmatically. Registering in the system
    as a user (let it barton) and going through the authorization procedure installs
    a cookie on the client machine (Fig. II.7.7).


    ![](img/a893312ec68b8170fe567f785e95c06e_292_0.png)


    Fig. II.7.7. Entering the system


    Afterward, the cookie''s name can be changed in Opera browser to any name registered
    in the system (Fig. II.7.8).


    There are lots of programs and browsers with cookie-editing capabilities. Internet
    Explorer, however, is not one of them.


    > NOTE


    This makes the data belonging to the user whose name is in the doctored cookie
    (yandex, in this case) accessible to the perpetrator (Fig. II.7.9).


    In addition making the other user''s privileges accessible to the perpetrator,
    the counterfeit cookie makes it easy to learn this user''s password, because an
    SQL query for selecting the user''s personal data does not check the user name
    sent through a cookie. Recall the structure of the userslist table, shown in List-II.7.12.'
