    > The following three executable modules are located in the PHP root directory:
    php.exe, php-cgi.exe, and php-win.exe. The php-cgi.exe file is used for working
    with a Web server, and it processes requests to PHP scripts when PHP is installed
    as a CGI binary and not as a module. The php.exe file is used for processing scripts
    in the console. When it run, the console window opens, in which all script output
