    # II.10.3. Determining the Remote File Size


    This problem can be solved using the script shown in Listing II.10.6. The script
    employs the custom get_content() function defined in Listing II.10.4, which returns
    the number of bytes in the file in the HTTP Content-Length header.


    +   Listing II.10.6. A script for determining the remote file size


    ```

    <php

    $hostname = "www.softtime.ru";

    $path = "/files/configs.zip";

    // Calling the custom function

    $out = get_content($hostname, $path);

    // Joining the array elements into a string

    $lines = implode(" ", $out);

    // Determining the number of bytes in the downloaded

    // file with the help of a regular expression

