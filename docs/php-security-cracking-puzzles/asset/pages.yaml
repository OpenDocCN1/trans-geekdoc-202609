  md: "# II.4.13. Downloading Data from a Database Dump\n\nAs with MP3 files, if the\
    \ echo $file['content'] statement is followed by any output to the browser window,\
    \ including spaces or line feeds after the ?>?> tag, the image file will be corrupted.\n\
    \nTo execute multiple SQL queries from the database dump, the contents of the\
    \ catalog.sql file are read and broken into individual queries using the #;\\\
    s]*\\r\\n#is regular expression (Listing II.4.39). In a properly performed MySQL\
    \ database dump, each query is terminated with a semicolon.\n\n+   Listing II.4.39.\
    \ Downloading data from a database dump\n\n```\n<php\n// Connecting to the database\n\
    include \"config.php\";\n// The name of the file with the SQL instructions\n$filename\
    \ = \"catalog.sql\";\n// Opening the instruction file\n// and reading it into\
    \ a buffer\n$fp = fopen($filename, \"r\");\n$contents = fread($fp, filesize($filename));\n\
    fclose($fp);\n// Breaking the file's contents\n// at the semicolon boundaries\n\
    $quer = preg_split(\"#;\\\\s]*\\r\\n#is\", $contents);\n// Executing the SQL queries\n\
    foreach($quer as $query) {\n    if(!$mysql_query($query)) exit(mysql_error());\n\
    }\n?>\n```"
