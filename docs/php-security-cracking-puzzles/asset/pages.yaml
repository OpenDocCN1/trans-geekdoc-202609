  md: '# Chapter II.5: Sessions and Cookies 233


    +   - close — The method that terminates operations. The code that terminates
    the database connection will be placed here.


    +   - read — The method that retrieves the data for the current session from the
    database.


    +   - write — The method that inserts a new record into the database table, provided
    that this is the first attempt at accessing the session that updates the record
    corresponding to the string.


    +   - destroy — The method that obliterates the session. The code placed here
    will obliterate the record corresponding to the specified current session.


    +   - gc — The method that collects the garbage. It removes old records that have
    lost their importance.


    The data will be stored in the session table, which has the following fields:


    +   - id_session — Primary key of the table with the AUTO_INCREMENT attribute


    +   - session — Unique session identifier


    +   - putdate — Date, on which the session was last accessed


    +   - value — Session value (array packed using the serialize() function)


    The CREATE TABLE operator that re-creates the session table is shown in Listing
    II.5.4.


