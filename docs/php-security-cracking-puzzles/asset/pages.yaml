- pgno: 72
  md: '# Chapter I.7: Authorization and Authentication 59


    ![](img/a893312ec68b8170fe567f785e95c06e_72_0.png)


    Therefore, it is necessary to protect the passwords. Even if the intruder gains
    access to the text.txt file, it would be impossible to use this information (I.
    7.4).


    # I.7.3. Guessing a Password


    In the previous section, you were shown how to protect data using irreversible
    encryption. However, this doesn''t make an attack on passwords impossible. After
    all, a password can be guessed. Listing I.7.1 contains four passwords encrypted
    using the MD5 algorithm. Decrypt these passwords using a brute-force attack.


    > These passwords can be found in electronic form in the /scripts/7/password file
    on the accompanying CD-ROM.


    # Listing I.7.1. Encrypted passwords


    ```

    ee11cbb19052e4b07aac0c60ca060232ee

    dd97813dd40be87559aaefed642c3fbb

    8dbc672497bdc46f88e864bb1121232c

    3e10f8c80924d3a0f94c18e7addb866

    ```


    > The passwords in Listing I.7.1 include only lowercase Latin characters, and
    the password length does not exceed four characters.'
