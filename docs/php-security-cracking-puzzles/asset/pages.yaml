- pgno: 327
  md: 'The values of the variables $ftp_server, $ftp_user, and $ftp_password are set
    to the address of the FTP server, user name, and password, respectively.


    For further FTP work, the code in Listing II.9.1 may be placed into a separate
    file named, for example, config.php. The file is then included in scripts with
    the help of the include instruction. Thus, you avoid writing out the connection
    code in each script.


    The FTP server can work under different operating systems, each of which has its
    own operating specifications. Therefore, for further work, the operating system
    has to be determined. This can be done using the $ftp_stype() function (Listing
    II.9.2), whose general syntax is the following:


    The only parameter that the $ftp_stype() function accepts is the link identifier
    returned by the $ftp_connect() function. The function returns the type of the
    operating system running the server, for example, UNIX for a UNIX-like system
    or Windows_NT for a Windows system.


    # Listing II.9.2. Determining the operating system


    ```

    <php

    // Opening a connection to the FTP server

    require_once("config.php");

    // Determining and displaying the operating system

    echo $ftp_stype($link);

    ?>

    ```


    # II.9.2. Listing FTP Server Files


    A list of the files and subdirectories in the current directory can be obtained
    with the help of the $ftp_rawlist() function (Listing II.9.3). Its general syntax
    is the following:


    ```

    array $ftp_rawlist(resource link, string directory)

    ```


    The function accepts a link identifier as the first parameter and the path to
    the directory as the second parameter. It returns an array of strings, each of
    which contains information about a subdirectory or a file.'
