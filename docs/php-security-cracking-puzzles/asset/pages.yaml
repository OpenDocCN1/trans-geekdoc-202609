    # ## II.7.8. Protecting User Names


    Assume that user names are stored in a field named name in a table named authors.
    The task is to check whether a name is already used or is similar to already-registered
    user names. This problem can be solved using the script shown in Listing II.7.16.


    Listing II.7.16. Protecting user names against forgery


    ```

    <?php

    // Establishing whether a new name is created for nefarious purposes.

    // The following situations must be prevented:

    // 1. A name identical to an already-registered name is being entered.

    // 2. There is an existing Russian name in which one or more

    // letters are replaced with English look-alikes.

    // 3. There is an existing English name in which one or more

    // letters are replaced with Russian look-alikes.

    // An array of Russian letters

    rus = array("A", "a", "B", "b", "E", "e", "K", "k", "M", "m", "H", "h", "O", "o",
    "P", "p", "c", "x");

    // An array of English letters

    eng = array("A", "a", "B", "E", "e", "K", "k", "M", "m", "H", "h", "O", "o", "P",
    "p", "c", "x");

    // Replacing Russian letters with English ones

    eng_author = str_replace($rus, $eng, $author);

    // Replacing English letters with Russian ones

    rus_author = str_replace($eng, $rus, $author);

    ```'
