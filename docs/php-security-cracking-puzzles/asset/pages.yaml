    ![](img/a893312ec68b8170fe567f785e95c06e_325_0.png)


    # ## II.9.1. Determining the Operating System


    A connection with an FTP server is established using the `ftp_connect` function.
    Its general syntax is the following:


    ```

    resource ftp_connect (string host [, int port [, int timeout]]])

    ```


    The function accepts the FTP server''s address as the `host` parameter. The optional
    `port` parameter is used to specify the port number for the connection. By default,
    port 21 is used to open a connection. The optional `timeout` parameter specifies
    the time in seconds, during which the function will wait for the server to respond.
    If this parameter is not specified, the default timeout value is 90 seconds.


    If a connection attempt fails, the function returns `false`. With a successful
    connection, the function returns a link identifier to be used for further operations
    with the FTP server.


    After a connection to the FTP server is opened, the user is registered with the
    help of the `ftp_login()` function. Its general syntax is the following:


    ```

    bool ftp_login (resource link, string username, string password)

    ```'
  merge: -1
  img_proc: true
- pgno: 326
  md: '# Chapter II.9: File Transfer Protocol 313


    The function accepts the following three parameters: the link identifier returned
    by the ftp_connect() function, the user name, and the password. The function returns
    true for a successful login and false for an unsuccessful one.

    An FTP connection is closed using the ftp_close function, whose general syntax
    is the following:


    ```

    void ftp_close(resource link)

    ```


    The function accepts the link identifier of an open FTP connection as the only
    parameter. Listing II.9.1 shows a script for opening an FTP connection to a remote
    server.


    ![](img/a893312ec68b8170fe567f785e95c06e_326_0.png)


    When accessing an anonymous FTP server, the user name can be given as anonymous
    and an email address can be used as the password.


    # Listing II.9.1. Connecting to an FTP server


    ```

    <?php

    // The FTP server''s address

    $ftp_server = "ftp.server.ru";

    // The user name

    $ftp_user = "user";

    // The password

    $ftp_password = "password";

    // Setting the script''s timeout to 120 seconds

    set_time_limit(120);

    // Attempting to connect to the FTP server

    $link = ftp_connect($ftp_server);

    if (!$link) echo("Failure to open a connection to $ftp_server FTP server");

    // Registering on the server

    $login = ftp_login($link, $ftp_user, $ftp_password);

    if (!$login) echo("Failure logging onto the server.

    Please check the login data.");


    ?>

    ```'
