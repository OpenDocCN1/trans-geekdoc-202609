    # II.2.5. Verifying the Email Address Format


    Assume the format of the address should be something@server.com. Moreover, the
    address consists of two parts delimited by the @ character; these are the user
    name and the domain name. The user name can contain uppercase and lowercase letters,
    digits, underscores, periods, and hyphens. To check the separator between the
    user name and the domain name, the @ character must be added to the regular expression.
    Like the user name, the domain name can use uppercase and lowercase letters, digits,
    underscores, periods, and hyphens. Consequently, the following regular expression
    for verifying that the user name and the domain name of an email address are in
    the appropriate format can be constructed:


    ```

    [0-9a-z_]+@[0-9a-z_^\.]+

    ```'
