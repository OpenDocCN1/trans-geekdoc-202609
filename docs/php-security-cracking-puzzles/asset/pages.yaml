- pgno: 204
  md: '# Chapter II.4: MySQL and SQL Injections


    ![](img/a893312ec68b8170fe567f785e95c06e_204_0.png)


    Fig. II.4.1. Passing arbitrary text in a query string


    Code %20 denotes a space. It is not necessary to remember the codes for all prohibited
    characters, because a URL string can be cleaned up by processing its text with
    the urlencode() function.


    The UNION statement, available as of MySQL 4.0, can be used to combine two queries
    of the same format (Listing II.4.3).


    # Listing II.4.3. Using the UNION statement


    ```

    SELECT * FROM userslist WHERE id_user = 1

    UNION

    SELECT * FROM userslist WHERE id_user = 2

    ```


    The SQL injection code is set in bold. The table produced by this query will contain
    records from both the first and the second queries. A URL query in this case may
    look as follows:


    ```

    user.php?7id_user=1%20UNION%20SELECT%20*

    %20FROM%20users%20WHERE%20id_user%20=%202

    ```


    Nevertheless, it displays information about the user associated with primary key
    1 in the browser window (Fig. II.4.2).


    The query from Listing II.4.3 returns two records: one for the user with primary
    key 1 and the other for the user with primary key 2 (Listing II.4.4).


    # Listing II.4.4. Records returned by the query from Listing II.4.3


    ```

    1, ''cheops'', *****, ''cheops@mail.com'', ''http://www.softtime.ru''

    2, ''barton'', *****, ''barton@mail.com'', ''''

    ```'
  merge: -1
  img_proc: true
- pgno: 205
  md: '# Part II: Solutions


    ![](img/a893312ec68b8170fe567f785e95c06e_205_0.png)


    Fig. II.4.2. Displaying information about the user with key 1


    However, the first result is displayed because the mysql_fetch_array() called
    only once; accordingly, all subsequent requests are ignored. The primary task
    faced by the attacker is to display in the browser window the results of the second
    query from the UNION construction, because the first query cannot be changed.
    This task can be solved in two ways. The first is to form a condition for the
    first query that can never be true. This can be done by setting id user to a negative
    value. Because the primary key can only have positive values, this move guarantees
    that the first request will return no records.


    # Listing II.4.5. Suppressing the results of the first query


    ```

    SELECT * FROM userslist WHERE id_user = -1

    UNION

    SELECT * FROM userslist WHERE id_user = 2

    ```


    A query for the SQL injection shown in Listing II.4.5 may look as follows:

    user.php?id_user=-1%20UNION%20SELECT%20*%20FROM%20userslist%20WHERE%20id%20user%20%202


    This injection executes the second SELECT query from the UNION construction, outputting
    information about the user with primary key 2 (Fig. II.4.3).


    Under certain circumstances, the described technique cannot be used to pass control
    to the SELECT query. Therefore, the ORDER BY construction is used to sort the
    results returned by the two queries so that the result of the injection is placed
    in the first position. In the given example, the results can be sorted in descending
    order by the id_user parameter. The operation is performed by placing the ORDER
    BY id_user DESC construction after the UNION construction (Listing II.4.6).


    *'
  merge: -1
  img_proc: true
