  md: '# II.4.7. Alphabetic Navigation


    The alphabetization problem can be solved by extracting the first letters of the
    spare parts'' names from the products table and grouping them using the GROUP
    construction. Listing II.4.23 shows a query that does this.


    Listing II.4.23. A query to extract the first letters of spare parts'' names


    ```

    SELECT SUBSTRING(name, 1, 1) AS letter

    FROM products

    GROUP BY letter

    ORDER BY letter

    ```


