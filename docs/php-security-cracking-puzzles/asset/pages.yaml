  md: "# Chapter II.5: Sessions and Cookies 231\n\n```\nVALUES('$id_session', NOW(),\
    \ '$_SESSION[user]');\nif(!mysql_query($query)) {\n  echo $query.\"<br>\";\n \
    \ echo \"<p>Error when adding new user</p>\";\n  exit();\n}\n// Assume that users\
    \ who didn't access the resource\n// within the last 20 minutes have left and\
    \ remove\n// their id_session values from the database.\n$query = \"DELETE FROM\
    \ session\\nWHERE putdatate < NOW() - INTERVAL '20' MINUTE\";\nmysql_query($query);\n\
    ?>\n```\n\nIn the beginning of the script, the current session_id is obtained\
    \ using the session_id() function. If such identifier is missing from the session\
    \ table, then a new record is added to the database, which is equivalent to the\
    \ arrival of the new visitor. The SID is present in the session table, this visitor\
    \ has already entered and it is necessary to update the time of visit and the\
    \ user name in case the visitor has been authorized under another name or has\
    \ carried out the authorization. At the end of the script, all records, for which\
    \ more than 20 minutes have elapsed since the last update of the visit time, are\
    \ deleted from the database. Thus, the script registers visitors' departure.\n\
    \nIn chat applications, it is common practice to inform other visitors that a\
    \ specific user has left the resource. For this purpose, it is necessary to select\
    \ all records, for which more than 20 minutes have elapsed since the last update\
    \ and output a message to visitors with the corresponding names have left the\
    \ chat.\n\nThe script given previously in Listing II.5 must be included in all\
    \ frequently-visited pages of a site using the include instruction. This should\
    \ be done to reliably trace the presence of visitors on the site.\n\nAfter you\
    \ organize the dynamic update of the session table, it won't be difficult to output\
    \ the list of currently active visitors, as shown in Listing II.5.3."
