  md: '# # Chapter I.12: The Whois Service


    ![](img/a893312ec68b8170fe567f785e95c06e_97_0.png)


    Whois is an official service providing public information about currently-registered
    domain names, domain name system (DNS) servers supporting IP addresses, and owners
    of IP addresses. The geographical location of a given IP address can also be established
    with the help of the service. Different Whois services are responsible for different
    coverage zones. Thus, the main Whois service is the American Registry for Internet
    Numbers (ARIN) (http://whois.arin.net), and the Réseaux IP Européens (RIPE) Center
    (http://www.ripe.net) is responsible for the European Internet coverage zone.


    > NOTE All examples from this chapter can be found in the /scripts/12 directory
    on the accompanying CD-ROM.


