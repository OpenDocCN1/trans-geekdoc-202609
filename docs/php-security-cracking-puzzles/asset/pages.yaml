- pgno: 18
  md: '# Chapter 1.1: Strings


    ![](img/a893312ec68b8170fe567f785e95c06e_18_0.png)


    Strings are the mainstay for any type of programming. Mastering strings allows
    programmers to create short and efficient programs. Various studies have shown
    that the concentration of errors in programs depends not on the programming language
    but only on the qualification level of the programmer. The shorter the program
    is, the fewer errors and vulnerabilities it has. Solid knowledge of specific string
    features will allow you to expertly determine, which code sections are problematic
    in terms of possible bugs and vulnerabilities. This chapter considers several
    puzzles and problems; solving them will allow you to improve your knowledge of
    PHP string functions and your string-manipulation skills.


    NOTE All examples from this chapter can be found in the /scripts/1 directory on
    the accompanying CD-ROM.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# I.1.1. Listing Files in a Directory


    Develop a script to count the number of files in a directory and determine their
    names. The script must not use directory functions. PHP uses several types of
    quotation marks, each of which is characterized by specific properties. Use them
    while developing the script.


    # I.1.2. Right Alignment


    Assume that you have a list of files stored in an array, as shown in Listing I.1.1.
    File names are of different lengths, and it is necessary to align them along the
    right boundary as shown in I.1.1. Solve this problem without using the align-attribute
    or cascading style sheets (CSSs). Only the <pre> and </pre> tags are allowed.


    ![](img/a893312ec68b8170fe567f785e95c06e_19_0.png)


    Listing I.1.1. The $filename array containing file names of different lengths


    ```

    <<?php

    $filename = array("all.php", "auth.php",

    "auth.txt", "base.txt",

    ```'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# Chapter I.1.1: Strings


    ```

    "chat.html", "config.php",

    "count.txt", "count_new.txt",

    "counter.dat", "counter.php",

    "create.php", "dat.db";

    ```


    The 1.php file containing the array of file names can be found in the /scripts/1/1.2
    directory on the accompanying CD-ROM.


    # I.1.3. Alignment by the Left and Right Boundaries


    Divide the $filename array (see Listing I.1.1) into two parts and output it in
