    # ## II.12.3. Following Up with the Referral Server


    The main Whois service has no information about the requested IP address, it provides,
    in the ReferralServer field, a link to the regional Whois service responsible
    for the given range of IP addresses. Therefore, the process of accessing the Whois
    service should be implemented as a separate function named, for example,whois().
    The function accepts two parameters: the address of the Whois service and the
    target IP address. If the returned report contains a link to a referral service,
    the whois() function is called recursively. A corresponding script is shown in
    Listing II.12.3.


    +   II.12.3. Recursively calling the referral server


    ```

