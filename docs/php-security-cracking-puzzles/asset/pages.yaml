- pgno: 69
  md: '# # Chapter 1.7: Authorization and Authentication


    ![](img/a893312ec68b8170fe567f785e95c06e_69_0.png)


    Authorization and authentication play an important role when building Web applications.
    This is because every site, for which it is necessary to distinguish among users,
    must authorize visitors using passwords. IP addresses are not constant, and lots
    of users can connect to the Internet using the same IP address. Thus, to distinguish
    among visitors, it is necessary to resort to user authorization. The value of
    the user account access in some chat room or forum is not equivalent to that of
    the user account providing access to a private panel in an e-shop or to that of
    the user account providing access to some FTP site. As a rule, user authorization
    is carried out somewhere in the protected area of the site, where HTTP traffic
    is transmitted over the secure sockets layer (SSL) protocol, ensuring HTTP data
    encryption and eliminating eavesdropping on passwords (recall that in HTTP passwords
    are not encrypted). Whether or not SSL is used, careless implementation of the
    authorization code might result in cracking.


    > > All examples from this chapter can be found in the /scripts/7 directory on
    the accompanying CD-ROM.'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# Chapter I.7: Authorization and Authentication 57


    Authentication is the procedure that verifies user identity; in other words, this
    procedure checks whether the user is actually the one he or she claims to be.
    The authorization procedure checks whether a specific user has the right to carry
    out a specific action. If a Web application doesn''t implement a multilevel access
    control system, these concepts match. Thus, further on in this chapter only the
    authorization term will be used.


    ![](img/a893312ec68b8170fe567f785e95c06e_70_0.png)


    # I.7.1. File-Based Authorization


    The problem described in Section 1.3.20 required you to create a user registration
    system, in which data would be stored in a file in the following format:


    ```

    User name:password:email::url

    ```


    User name, password, email address, and home page address are separated by the
    sequence of two colons (:). Using a custom script or a ready-to-use script from
    the answer to the problem in Section 1.3.20 (contained in the /scripts/3/3.20
    directory on the CD supplied with this book), develop the authorization system
    (Fig.7.1).


    ![](img/a893312ec68b8170fe567f785e95c06e_70_1.png)


    Fig. I.7.1. HTML form for the authorization system'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# 58 Part I: Puzzles


    ![](img/a893312ec68b8170fe567f785e95c06e_71_0.png)


    Fig. I.7.2. Editing user data


    If the login and password supplied by the user are present in the text.txt file,
    the script must allow the user to edit the email address and home page address
    (URL), as well as to reset the password (Fig. I.7.2).


    # I.7.2. Password Encryption


    In Sections I.3.20 and I.7.1, you had to create an authorization system on the
    basis of text files. However, in this case the intruder can specify the path to
    the text file and thus obtain access to the passwords of all registered users
    (Fig. I.7.3).


    ![](img/a893312ec68b8170fe567f785e95c06e_71_1.png)


    Fig. I.7.3. Everyone can obtain access to the password information'
