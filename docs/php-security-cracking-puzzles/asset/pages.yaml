  md: "# # Chapter II.5: Sessions and Cookies\n\n![](img/a893312ec68b8170fe567f785e95c06e_242_0.png)\n\
    \n# ## II.5.1. Online Users\n\nHTTP doesn't allow users to establish sessions;\
    \ consequently, it doesn't allow you to trace the time interval, during which\
    \ a specific visitor worked with a Web resource. The only thing that could be\
    \ traced is the time, during which the client accessed the server resources. After\
    \ this, the visitor can spend several hours reading the loaded page — the Web\
    \ server won't be able to determine when the visitor stopped working with loaded\
    \ resources. Therefore, a visitor is considered to leave a specific Web resource\
    \ if 20 minutes have elapsed since the visitor last loaded a page.\n\nTo register\
    \ the times of visitors' access to resource pages, it is necessary to create a\
    \ session table in the MySQL database that would store user names and when they\
    \ last accessed resource pages (Listing II.5.1).\n\nListing II.5.1. The session\
    \ table\n\n```\nCREATE TABLE session (\n  id_session tinytext NOT NULL,\n  putdate\
    \ datetime NOT NULL default '0000-00-00 00:00:00',\n  user tinytext NOT NULL\n\
    ) TYPE = MyISAM;\n```"
