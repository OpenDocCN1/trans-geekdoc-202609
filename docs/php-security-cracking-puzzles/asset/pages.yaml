    # ## II.8.1. Downloading HTML Pages


    A page from a remote host can be downloaded using the standard file-handling functions
    by simply passing the network path as the file name to these functions.


    Listing II.8.1. Downloading HTML pages (PHP 4.3.0 and later versions)


    ```

    php

    // Downloading a page from the remote host

    $content = file_get_contents("http://www.php.net/");

    // Saving the contents of the page in a file

    $fd = fopen("url.txt", "w");

    fwrite($fd, $content);

    close($fd);

    ?

    ```


    Executing the Listing II.8.1 script saves the contents of the index page of the
    url.txt file. The http://www.php.net site in the url file_get_contents() function
    is quite convenient and returns the contents of a local or remote file as a string.'
