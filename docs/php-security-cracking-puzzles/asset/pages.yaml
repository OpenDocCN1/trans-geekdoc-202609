  md: '# # Chapter II.6: User Agents and Referrers


    ![](img/a893312ec68b8170fe567f785e95c06e_262_0.png)


    # ## II.6.1. Tracing Jumps from External Sites


    Jumps by users from external sites are registered by the referrer, access to which
    can be obtained using the $ _SERVER[''HTTP_REFERER''] superglobal array element.
    For example, if the 1.php page contains a link to the 2.php page, <a href=2.php>Link</a>,
    then it is possible to place the code in in Listing II.6.1 into the 2.php file.


    Listing II.6.1. Output the $ _SERVER[''HTTP_REFERER''] content


    ```

    <?php

    echo "You have navigated to the current page from ".$ _SERVER[''HTTP_REFERER''];";

    ?>

    ```


    You''ll obtain the result shown in Fig. II.6.1.

    Now it only remains to create a script that would place the addresses of pages,
    from which the user was redirected to the current one into the referer table.'
