  md: "# 118 Part II: Solutions\n\nTo prevent unclosed tags from being interpreted,\
    \ it is necessary to use a more complicated method of text processing. For example,\
    \ consider the script shown in Listing II.1.25.\n\n# Listing II.1.25. The script\
    \ that processes only closed tags\n\n```\n<?php\n// The source string\n$text =\
    \ 'This is [b]bold[/b] text';\n// The resulting string\n$result = \"\"\n// Auxiliary\
    \ variables\n$lastocc = 0;\n$sndocc = 1;\nwhile($sndocc) {\n// Start of the bold\
    \ fragment\n$fstocc = strpos($text, \"[b]\", $lastocc);\n// Termination of the\
    \ bold fragment\n$sndocc += strpos($text, \"[/b]\", $fstocc);\nif(($fstocc >=\
    \ 0 && $sndocc > 0 && $lastocc > 0) ||\n    ($fstocc == 0 && $sndocc > 0 && $lastocc\
    \ == 0)) {\n// Placing the fragment preceding the [b] tag into the $result string\n\
    $result .= substr($text, $lastocc, $fstocc - $lastocc);\n// Bold fragment\n$result\
    \ .= \"<b>\".substr($text,\n$fstocc - 3,\n$sndocc - $fstocc - 3).\"[/b>\";\n$lastocc\
    \ = $sndocc + 4;\n} else {\n// Processing the remainder of the string\n$result\
    \ .= substr($text, $lastocc, strlen($text) - $lastocc);\n// Exiting the loop\n\
    break;\n}\necho $result;\n?>\n```"
