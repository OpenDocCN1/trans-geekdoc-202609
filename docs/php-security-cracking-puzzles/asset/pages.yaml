- pgno: 256
  md: '# II.5.6. Bypassing an HTML Form Protected by Sessions


    To obtain the cookie and send it to the server, it is necessary to use sockets.

    The session cookie is set by the following `Set-Cookie` HTTP header:


    ```

    PHPSESSID = d8a29ca8e9eae318ac19e8d48831dea

    expires = Fri, 28 Oct 2005 20:04:05 GMT; path=/

    ```


    Here, PHPSESSID is the name of the session cookie for storing the unique SID,
    expires stands for the term of the cookie validity, and path is the cookie directory.
    When accessing using cookies, it is enough to wait for the string that has the
    data format and retrieve the SID using a regular expression: `Set-Cookie: PHPSESSID=([\d\w]+);
    i`. After receiving the SID, it is possible to access the form handler of the
    handler.php file using the `POST` method.


    ![](img/a893312ec68b8170fe567f785e95c06e_256_0.png)


    NOTE

    Working with the `POST` method through sockets is covered in more detail in Chapter
    II.10.


    The `POST` method sends the data in the area that follows the headers, whereas
    the `GET` method sends data in the query string. Several variables are passed
    as using the `POST` method as they would be using the `GET` method: The `name-value`
    pairs pairs are combined using the ampersand (`&`) character. Because the HTML
    form takes the `name=admin, pass=admin, and session_id` parameters with the value
    obtained through the sockets during the first access, the data string might appear
    as follows:


    ```

    name = admin &pass = admin&session_id =

    d8a29ca8e9eae318ac19e8d48831dea&r\n\r

    ```


    The last ampersand is added to prevent the terminating line feed characters from
    falling into the `session_id` value. When sending data using the `POST` method,
    it is necessary to send the Content-Length HTTP header that specifies the number
    of bytes in the HTTP Content-type header; `application/x-www-form-urlencoded`
    specifies the data transmission. The script emulating cookie support might appear
    as shown in Listing II.5.13.'
  merge: -1
  img_proc: true
