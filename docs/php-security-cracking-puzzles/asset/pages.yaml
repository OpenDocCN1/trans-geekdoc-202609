    # II.15.3. Emulating the Tar Utility\n\nThe easiest way to imitate the UNIX Tar\
    \ utility is to create an associative array with the file names used as the keys\
    \ and the contents of the files as the values of the array's elements. The array\
    \ is then packed into a string using the serialize() function, which is saved\
    \ as a file. Thus, a functional equivalent of the Tar utility is obtained. Listing\
    \ II.15.3 shows a function implementing it.\n\n+   II.15.3. Joining files into\
    \ a tarball\n\n```\n<?php\n//////////////////////////////////////////////////////\n\
    // A recursive function to descend the directory tree\n//////////////////////////////////////////////////////\n\
    function scan_dir($dirname)\n{\n    // Opening the current directory\n    opendir($dirname);\n\
    \    // Reading the current directory in a loop\n    while (($file = readdir($dir))\
    \ != false) {\n        // Checking whether the $file variable\n        // equals\
    \ the current or \".\" or the upper-level directory\n        if ($file != \".\"\
    \ && $file != \"..\") {\n            // If the current item is a file,\n     \
    \       // placing it in the $arr array\n            $arr[$dirname.\"/\"$file]\
    \ = file_get_contents($dirname.\"/\"$file);\n        }\n    }\n    // Closing\
    \ the directory\n    closedir($dir);\n    return $arr;\n}\n\n```"
