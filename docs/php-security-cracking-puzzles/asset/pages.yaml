    \ downloading. For convenience, the $count array is converted into a byte-stream\
    \ representation string using the serialize() function and back into the value\
    \ using the unserialize() function.\n\n>  is is to to remember that all headers\
    \ can only be sent before the main content is sent. Sending them in a different\
    \ order is impossible; the PHP interpreter will issue the following warning message:\
    \ \"Warning: Cannot modify header information— already sent by.\" This is because\
    \ HTTP sends headers first and sends the contents of the document. Thus, any initial\
    \ output into the browser window is interpreted as headers with the document body\
    \ expected to. If it is impossible to avoid sending the contents before the buffers,\
    \ output control functions should be used to place the output into a buffer and\
    \ then send it to the browser window at the end of the script's execution.\n\n\
    When the script is run for the first time, the filecount.txt file does not exist.\
