    \ set of parentheses, and so on. The format of the returned $matches array is\
    \ controlled by the optional flag argument. When this parameter is set to PREG_OFFSET_CAPTURE,\
    \ for each found match the function returns an array containing the matched string\
    \ in the 0th element and its offset into the 1st string. The search is conducted\
    \ from the beginning of the string, from left to right. An alternative starting\
    \ position for the search can be specified using the optional offset parameter.\
    \ The preg_match() function returns 0 when no matches are found and 1 when a match\
    \ is found.\n\nThe technique used in the previous section will not extract the\
    \ page title because it may contain angle brackets. Therefore, the <title> and\
    \ </title> tags must be used, with the “greediness” controlled by the U modifier.\
    \ By default, regular expressions are “greedy”; that is, they return the longest\
    \ match from all found matches. The U modifier inverts the “greediness,” with\
    \ the shortest match of all choices returned.\n\n# Listing II.2.4. Extracting\
    \ the HTML page title\n\n```\n<?php\n// Extracting the contents of the index.html\
    \ file\n$content = file_get_contents(\"index.html\");\n\n// The regular expression\n\
    $pattern = \"<title>(.*)</title>|si\";\n\n// Extracting the title of the HTML\
    \ page\nif (preg_match($pattern, $content, $out)) {\n    echo $out[1];\n}\n?>\n\
    ```\n\nThe greediness of regular expressions can also be used using the * sequence;\
    \ that is, the regular expression from Listing II.2.4 can be rewritten as <title>(.*)</title>|si.\
