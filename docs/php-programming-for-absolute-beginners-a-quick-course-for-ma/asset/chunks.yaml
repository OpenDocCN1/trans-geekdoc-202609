  fmt: "\n# Chapter 7: Loops\n\nA block of code is executed multiple times using the\
    \ concept of loops. Four types of loops are supported by php, which include `for`,\
    \ `while`, `foreach`, and `do...while`. This chapter will discuss each of these\
    \ and introduce you to loops statements like `break` and `continue`.\n\n## for\n\
    \nThe `for` statement is typically used in programming scenarios where a block\
    \ of code needs to be repeatedly executed until a condition is true and the loop\
    \ involves a variable, which is initialized and updated as part of the for statement.\
    \ The syntax for this looping construct is:\n\n```php\nfor (initialization; condition;\
    \ expression) {\n    // block of code\n}\n```\nThe `initialization` initializes\
    \ the looping variable by declaring it and giving it an initial value. The `condition`\
    \ is the expression that needs to yield true for the loop to execute. If the `condition`\
    \ is found FALSE, the loop is terminated. The third part of the looping statement\
    \ includes the expression that updates the looping variable. The looping variable\
    \ is typically declared as `$i`. Sample implementation of this programming construct\
    \ is given below for your reference.\n\n```html\n<body>\n<?php\n$x = 0;\n$y =\
    \ 0;\nfor ($i = 0; $i < 3; $i++) {\n    $x += 1;\n    $y += 2;\n}\necho (\"the\
    \ values of x and y are x = $x and y = $y\");\n?>\n</body>\n```\n![](src24J.jpg\n\
    \n## while\n\nThe `while` statement is typically used in programming scenarios\
    \ where a block of code needs to be repeatedly executed until a condition is true.\
    \ The syntax for this looping construct is:\n\n```php\nwhile (condition) {\n \
    \   // block of code\n}\n```\nThe `condition` is the expression that needs to\
    \ yield true for the loop to execute. If the `condition` is found FALSE, the loop\
    \ is terminated. Sample implementation of this programming construct is given\
    \ below for your reference.\n\n```html\n<body>\n<?php\n$x = 0;\n$y = 0;\n$i =\
    \ 0;\nwhile ($i < 3) {\n    $x += 1;\n    $y += 2;\n    $i++;\n}\necho (\"While\
    \ Loop: the values of x and y are x = $x and y = $y\");\n?>\n</body>\n```\n![](src24K.jpg\n\
    \n## do...while\n\nThe `do...while` statement is typically used in programming\
    \ scenarios where a block of code needs to be repeatedly executed until a condition\
    \ is true; however, the one point that sets the `do...while` and `while` loops\
    \ apart is the fact that the condition is tested after one iteration for the former.\
    \ On the other hand, in case of `while` loop, the condition is tested before performing\
    \ the first iteration. Therefore, the `do...while` loop is executed at least once.\
    \ The syntax for this looping construct is:\n\n```php\ndo {\n    // block of code\n\
    } while (condition);\n```\nThe `condition` is the expression that needs to yield\
    \ true for the loop to execute. If the `condition` is found FALSE, the loop is\
    \ terminated. Sample implementation of this looping construct is given below for\
    \ your reference.\n\n```html\n<body>\n<?php\n$x = 0;\n$y = 0;\n$i = 0;\ndo {\n\
    \    $x += 1;\n    $y += 2;\n    $i++;\n} while ($i < 3);\necho (\"do...While\
    \ Loop: the values of x and y are x = $x and y = $y\");\n?>\n</body>\n```\n![](src24M.jpg\n\
    \n## foreach\n\nIn order to loop through array, the `foreach` statement is used.\
    \ Every pass or iteration of the loop takes the current value of the array and\
    \ increments the pointer to the next element. Therefore, in the next pass, the\
    \ next element will be processed. The syntax for this loop is:\n\n```php\nforeach\
    \ (array as value) {\n    // Code to be executed\n}\n```\nSample implementation\
    \ of this construct is given below for your reference.\n\n```html\n<body>\n<?php\n\
    $x_array = array(9, 8, 7, 6);\nforeach ($x_array as $value) {\n    echo \"Value\
    \ of the element: $value <br>\";\n}\n?>\n</body>\n```\n![](src24N.jpg\n\n## break\n\
    \nIn order to terminate loops prematurely, the `break` keyword may be used. It\
    \ is placed inside the loop block and is usually used as a conditional loop manipulation\
    \ statement. In other words, if an `if` block is implemented and the condition\
    \ inside the `if` statement is true, the loop breaks, else the loop continues\
    \ to function as normal. Once the `break` statement is encountered, the first\
    \ statement that appears after the loop block is executed. Sample implementation\
    \ is given below.\n\n```html\n<body>\n<?php\n$i = 0;\nwhile ($i < 5) {\n    $i++;\n\
    \    if ($i == 2) break;\n}\necho (\"Loop stopped at i = $i \");\n?>\n</body>\n\
    ```\n![](src24P.jpg\n\n## continue\n\nIn order to halt the execution of present\
    \ loop and take the execution to the next iteration, the `continue` keyword may\
    \ be used. It is placed inside the loop block and is usually used as a conditional\
    \ manipulation statement. In other words, if an `if` block is implemented and\
    \ the condition inside the `if` statement is true, the present iteration halts,\
    \ else the loop continues to function as normal. Once the `continue` statement\
    \ is encountered, the control is shifted to the loop statement. Sample implementation\
    \ is given below.\n\n```html\n<body>\n<?php\n$i = 0;\nwhile ($i < 5) {\n    $i++;\n\
    \    if ($i == 2) continue;\n    echo (\"Loop executed for i = $i <br />\");\n\
    }\n?>\n</body>\n```\n![](src24R.jpg\n\n# Chapter 8: Arrays\n\nOne of the most\
    \ useful data structures supported by php is arrays. An array is a collection\
    \ of data elements that are of the same type. For instance, if you wish to store\
    \ 20 integers, it can be stored in an array of 20 elements. You can also look\
    \ at arrays as a collection of variables of the same type; each of which is capable\
    \ of storing data. Php supports three types of arrays, which include numeric arrays,\
    \ multi-dimensional arrays and associative arrays. The individual elements of\
    \ the array can be accessed using the index or position of the element in the\
    \ array. The three types of arrays differ in manner their elements are accessed.\n\
    \n## numeric\n\nNumeric arrays have numeric indices that are incremented in a\
    \ linear fashion. For instance, the first element of the array has the default\
    \ index of 0. For all elements succeeding this data value, the index is incremented\
    \ by 1. On the other hand, associative arrays have strings as index. The array\
    \ is composed in a key-value fashion and the keys are stored as index while the\
    \ values are accessed using the keys. Therefore, the storage of elements and their\
    \ accessibility depends upon the association between the key and value. Lastly,\
    \ an array can be composed of elements each of which is an array itself. Such\
    \ an array is 2-dimensional. Corresponding, the dimensionality of an array can\
    \ be increased depending on the programming requirement. Arrays that have multiple\
    \ dimensions are called multi-dimensional arrays. Moreover, the elements of such\
    \ arrays are accessed using multiple indices.\n\n## numeric Array\n\nNumeric arrays\
    \ can store any type of data like strings, numbers and objects. however, the only\
    \ thing worth remembering is that the array’s indices are numeric. Moreover, the\
    \ default index of the first element of the array is zero. The function used to\
    \ create arrays is `array()`. Sample code to demonstrate the functionality of\
    \ numeric arrays is given below for your reference.\n\n```html\n<body>\n<?php\n\
    ```"
  trans: "\n\n# 第 7 章：循环\n\n通过循环的概念，代码块可以多次执行。php 支持四种循环，包括 `for`、`while`、`foreach`\
    \ 和 `do...while`。本章将讨论这些中的每一个，并向你介绍 `break` 和 `continue` 等循环语句。\n\n## for\n\n\
    `for` 语句通常用于需要重复执行一段代码块直到条件为真，且循环涉及一个变量的编程场景，该变量作为 `for` 语句的一部分进行初始化和更新。这种循环构造的语法如下：\n\
    \n```php\nfor (initialization; condition; expression) {\n    // 代码块\n}\n```\n\
    `initialization` 通过声明变量并赋给其初始值来初始化循环变量。`condition` 是循环执行前需要返回真（true）的表达式。如果发现\
    \ `condition` 为假（FALSE），则循环终止。循环语句的第三部分包含更新循环变量的表达式。循环变量通常声明为 `$i`。下面给出了该编程构造的示例实现供你参考。\n\
    \n```html\n<body>\n<?php\n$x = 0;\n$y = 0;\nfor ($i = 0; $i < 3; $i++) {\n   \
    \ $x += 1;\n    $y += 2;\n}\necho (\"the values of x and y are x = $x and y =\
    \ $y\");\n?>\n</body>\n```\n![](img/src24J.jpg\n\n## while\n\n`while` 语句通常用于需要重复执行一段代码块直到条件为真的编程场景。这种循环构造的语法如下：\n\
    \n```php\nwhile (condition) {\n    // 代码块\n}\n```\n`condition` 是循环执行前需要返回真（true）的表达式。如果发现\
    \ `condition` 为假（FALSE），则循环终止。下面给出了该编程构造的示例实现供你参考。\n\n```html\n<body>\n<?php\n\
    $x = 0;\n$y = 0;\n$i = 0;\nwhile ($i < 3) {\n    $x += 1;\n    $y += 2;\n    $i++;\n\
    }\necho (\"While Loop: the values of x and y are x = $x and y = $y\");\n?>\n</body>\n\
    ```\n![](img/ 代码块\n} while (condition);\n```\n`condition` 是循环执行前需要返回真（true）的表达式。如果发现\
    \ `condition` 为假（FALSE），则循环终止。下面给出了该循环构造的示例实现供你参考。\n\n```html\n<body>\n<?php\n\
    $x = 0$\n$y = 0$i =i =;\ndo {\n    $x += 1;\n    $y += 2;\n    $i++;\n} while\
    \ ($i < 3);\necho (\"do...While Loop: the values of x and y are x = $x and y =\
    \ $y\");\n?>\n</body>\n```\n![](img/src24M.jpg\n\n## foreach\n\n为了遍历数组，使用了 `foreach`\
    \ 语句。循环的每次通过或迭代都会获取数组的当前值，并将指针移动到下一个元素。因此，在下一次通过中，将处理下一个元素。该循环的语法为：\n\n```php\n\
    foreach (array as value) {\n    // 要执行的代码\n}\n```\n下面给出了该构造的示例实现供你参考。\n\n```html\n\
    <body>\n<?php\n$x_array = array(9, 8, 7, 6);\nforeach ($x_array as $value) {\n\
    \    echo \"Value of the element: $value <br>\";\n}\n?>\n</body>\n```\n![](img/src24N.jpg\n\
    \n## break\n\n为了提前终止循环，可以使用 `break` 关键字。它被放置在循环块内部，通常用作条件循环操作语句。换句话说，如果实现了 `if`\
    \ 块且 `if` 语句内部的条件为真，则循环中断；否则循环继续正常运行。一旦遇到 `break` 语句，将执行其后出现的第一个语句。下面给出了示例实现供你参考。\n\
    \n```html\n<body>\n<?php\n$x = 0;\n$y = 0;\n$i = 0;\nwhile ($i < 3) {\n    $i++;\n\
    \    if ($i == 2) break;\n}\necho (\"Loop stopped at i = $i\");\n?>\n</body>\n\
    ```\n\n## continue\n\n为了停止循环的执行并跳转到下一次迭代，可以使用 `continue` 关键字。它被放置在循环块内部，通常用作条件操作语句。换句话说，如果实现了\
    \ `if` 块且 `if` 语句内部的条件为真，则循环停止；否则循环正常运行。一旦遇到 `continue` 语句，将跳转到循环语句。下面给出了示例实现。\n\
    \n```html\n<body>\n<?php\n$i = 0;\nwhile ($i < 5) {\n    $i++;\n    if ($i ==\
    \ 2) continue;\n    echo (\"Loop executed for i = $i <br />\");\n}\n?>\n</body>\n\
    ```\n\n# 第 8 章：数组\n\nphp 支持的最用数据结构之一是数组。数组是相同类型元素的集合。例如，如果你想存储 20 个整数，可以将它们存储在一个包含\
    \ 20 个元素的数组中。你也可以将数组视为相同类型变量的集合；每个变量都可以存储数据。Php 支持三种数组，包括数值数组、多维数组和关联数组。数组的元素可以通过索引或在数组中的位置来访问。这三种数组在访问方式上有所不同。\n\
    \n## numeric\n\n数组具有递增的数值索引。例如，数组的第一个元素的默认索引为 0。对于随后的所有数据值，索引增加 1。另一方面，关联数组使用字符串作为索引。数组以键值对的形式组成，键作为索引存储，值通过键访问。因此，元素的存储和访问取决于键与值之间的关联。最后，一个数组可以由元素组成，每个元素本身也是数组。这种数组是二维的。相应地，数组的维度可以根据编程需求增加。具有多个维度的数组被称为多维数组。此外，此类数组元素可以通过多个索引访问。\n\
