    \ strlen(\"I possible.\"); ?>\n```\nThe result of execution of this sample code\
    \ is illustrated in the image below. ![](rsrc24W.jpg)\n\n### Finding Character\
    \ or String in String\n\nPhp provides a function `strpos()` to search for a character\
    \ or string within string. If the string or character is not present, FALSE is\
