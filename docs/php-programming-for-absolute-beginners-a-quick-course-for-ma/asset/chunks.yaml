    \n```html\n<html>\n<head>\n    <title>Implementing Functions with Parameters</title>\n\
    </head>\n<body>\n<?php \nfunction demofunction($num_1, $num_2) { \n    $result\
    \ = $num_1 + $num_2; \n    echo \"Result of addition : $result\"; \n} \ndemofunction(5,\
    \ 6); \n?> \n</body></html>\n```\n\nThe execution of this function shall give\
    \ the following output – ![](rsrc24Z.jpg). As the passed arguments act like local\
    \ variables to the function, a local copy of the variable is made for the function.\
    \ The values of the variables, if edited inside the function, are available in\
    \ their edited versions only inside the function. In case you want the variables\
    \ to reflect the changes even outside the function, the parameters need to be\
    \ passed by reference to the function. Sample code to demonstrate how parameters\
    \ can be passed by reference to a function is provided below.\n\n```html\n<html>\n\
    <head>\n    <title>Passing Arguments to Function by Reference</title>\n</head>\n\
    <body>\n<?php \nfunction demofunc1($num) { \n    $num += 1; \n} \nfunction demofunc2(&$num)\
    \ { \n    $num += 5; \n} \n$orig_num = 10; \ndemofunc1($orig_num); \nEcho \"base\
    \ Value is $orig_num<br />\"; \ndemofunc2($orig_num); \nEcho \"base Value is $orig_num<br\
    \ />\"; \n?> \n</body></html>\n```\n\nOnce executed, the following result shall\
    \ appear on the screen. ![](rsrc250.jpg)\n\n### Returning Values from Functions\n\
    \nThe `return` statement is used to return control from the function to the calling\
    \ function. Moreover, it is also used to return values from the function. The\
    \ syntax of using this statement is the keyword `return` followed by the value\
    \ or variable whose value needs to be returned. Php allows returning arrays if\
    \ there is requirement to return more one value. Sample code to demonstrate returning\
    \ of this statement is given below –\n\n```html\n<html>\n<head>\n    <title>Returning\
    \ values from functions</title>\n</head>\n<body>\n<?php \nfunction demo($num_1,\
    \ $num_2) { \n    $result = $num_1 + $num_2; \n    return $result; \n} \n$value\
    \ = demo(4, 7); \nEcho \"Value returned : $value\"; \n?> \n</body></html>\n```\n\
    \nAfter the execution of this code, the following result shall appear – ![](rsrc251.jpg)\n\
    \n### Default Values\n\nIn order to make the system self-sufficient and not respond\
    \ to issues like lesser parameters than expected, you can set default values for\
    \ parameters. Therefore, if a calling function doesn’t provide value for a parameter,\
    \ it automatically assumes a default value. This concept can be implemented in\
    \ the following –\n\n```html\n<html>\n<head>\n    <title>Setting default Values\
    \ for Parameters</title>\n</head>\n<body>\n<?php \nfunction demo($para_val = null)\
    \ { \n    print $para_val; \n} \ndemo (\"test call!\"); \ndemo (); \n?> \n</body></html>\n\
    ```\n\nOnce executed, you can expect the following result – ![](rsrc252.jpg)\n\
    \nPhp allows programmers to assign names of functions to variables. These names\
