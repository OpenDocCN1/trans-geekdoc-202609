    ## Chapter 1: overview

    The first version of php was a small open source project that was initiated by
    Erasmus Lerdorf. This version of php was released in the year 1994 and it was
    after this release that php really picked up as a language of choice for programmers
    all over the world. It is this growing popularity of the language that has converted
    this small project into a project of world-wide recognition. Before moving any
    further, let us look at a few facts about php. Firstly, php is a recursive acronym
    that stands for php: hypertext Preprocessor. Basically, it is a scripting language
    for server-side programming. The scripts are embedded into html code and can be
    used to manage databases, dynamic content and session tracking. One of the most
    popular applications of php is in the development of e-commerce websites. The
    fact that php allows management of databases is one of the key features of this
    programming language. To support this, php allows seamless integration with many
    databases like `microsoft SQL Server`, `Informix`, `Sybase`, `oracle`, `mysql`
    and `postgresql`. Performance-wise, php is literally zippy in execution. This
    is all the more true for scripts that are compiled in the form of `Apache module`
    on Unix side. Upon starting, the `mysql Server` can execute the most complex queries
    in record-setting time. Multi-tier development, which is the need of programming,
    has been made possible by php. Php supports distributed objects (cor) and java.
    Besides this, it also supports a variety of protocols like `ldap`, `IMAP` and
    `pop3`. Lastly, php is one of the most forgiving languages you will ever use and
    shares similarities with the c language as far as syntax is concerned.


    ### Characteristics and Uses

    Some of the key uses of php include:

    - Supports easy handling of forms, allowing data gathering, saving data on file,
    sending data via email, and returning data to the user.

    - Supports execution of system functions like opening, creating, deleting and
    writing to files on the system.

    - Supports database operations like adding, modifying and deleting elements inside
    the database via php.

    - Allows access and setting of cookies.

    - Allows placing restrictions on some pages that can be set by the programmer
    as inaccessible for the user.

    - Allows data encryption.


    ### First Program

    To start with, let us look at the simplest php script and try to understand how
    the same is working. This script prints the string ‘hello World!’ on the screen.
    As we have already mentioned, php scripts are embedded inside html. What this
    means is php statements are written inside normal html code. Sample code is given
    below for your reference.


    ```html

    <html>

    <head>

    <title>hello World!</title>

    </head>

    <body>

    <?php echo "hello, World..";?>

    </body>

    </html>

    ```

    Upon execution, this code yields the following result.

