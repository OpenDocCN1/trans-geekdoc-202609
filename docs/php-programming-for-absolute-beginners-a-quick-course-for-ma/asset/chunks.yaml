  fmt: "\n## File Operations\n\nIn case the file does not exist, the system tries\
    \ to create a file.\n\nIf the requested file is successfully opened, the file\
    \ pointer for the file is returned. On the other hand, if the opening operation\
    \ fails, `FALSE` is returned to the calling function. As a rule, be sure to close\
    \ any file you open. The function used for this purpose is `fclose()`, which is\
    \ discussed below.\n\nOnce a file is opened, one of the operations you will perform\
    \ is reading. This is typically using `fread()` which requires two arguments:\
    \ file pointer and length. If the size of the file is unknown, you can use `filesize()`\
    \ to determine the size and only requires the file as argument.\n\nIn order to\
    \ read a file, the steps you will need to follow include\n- Opening the file using\
    \ `fopen()`\n- Determining the size of the file using `filesize()`\n- Reading\
    \ the contents of the file using `fread()`\n- Closing the file using `fclose()`\n\
    \nSample code for demonstrating the different steps involved in the process is\
    \ provided below for your reference.\n\n```html\n<html>\n<head>\n<title>demo for\
    \ reading a file</title>\n</head>\n<body>\n<?php\n$file = \"tmp.txt\";\n$file1\
    \ = fopen($file, \"r\");\nif ($file1 == false) {\n    echo \"cannot open file\"\
    ;\n}\n$file_size = filesize($file);\n$file_text = fread($file1, $file_size);\n\
    fclose($file1);\necho \"Size of File : $file_size bytes\";\necho \"<pre>$file_text</pre>\"\
    ;\n?>\n</body>\n</html>\n```\n\nYou can run this code to see the output it generates.\
    \ If the file is not present, the program shall give an error message else it\
    \ shall provide the desired output.\n\nThe other function that you can expect\
    \ to perform with files is writing. It is possible to overwrite or append the\
    \ file using `fwrite()`, which requires two arguments: file pointer and the string\
    \ that needs to be written. Besides this, this function also expects a third argument,\
    \ which is the length of data to be written. Typically, if you provide this argument,\
    \ writing to the file will stop as soon as the number of bytes specified in data\
    \ is reached.\n\n## Chapter 12: Web Concepts\n\nWith the rising popularity of\
    \ Internet, there has an increasing need for dynamic content and webpages that\
    \ can react to user input, randomly generated and dynamically adapt to different\
    \ browsers. Redirect of client browser is also an important concept in this regard\
    \ that has been dealt with in this chapter. Identification of browser and platform\n\
    \nWhen the php environment is setup, php creates some useful environment variables.\
    \ You can view these variables in the `phpinfo.php` file. The `user_agent` variable\
    \ contains information about the platform and operating system being used. You\
    \ can access the value of the environment variable using `getenv()`. The information\
    \ provided by this environment variable is used to create browser-friendly content.\
    \ The sample code below helps you to identify the platform and operating system\
    \ of the client.\n\n```html\n<html>\n<body>\n<?php\nfunction demoBrowser() {\n\
    \    $user_agent = $_SERVER['HTTP_USER_AGENT'];\n    $browser_name = 'Unknown';\n\
    \    $user_platform = 'Unknown';\n    $user_version = \"\";\n    /*code for determining\
    \ platform*/\n    if (preg_match('/linux/i', $user_agent)) {\n        $user_platform\
    \ = 'linux';\n    } elseif (preg_match('/macintosh|mac os x/i', $user_agent))\
    \ {\n        $user_platform = 'mac';\n    } elseif (preg_match('/windows|win32/i',\
    \ $user_agent)) {\n        $user_platform = 'windows';\n    }\n    /*code for\
    \ determining user name*/\n    if(preg_match('/MSIE/i',$user_agent) && !preg_match('/opera/i',$user_agent))\
    \ {\n        $browser_name = 'Internet Explorer';\n        $ub = \"MSIE\";\n \
    \   } elseif (preg_match('/Firefox/i',$user_agent)) {\n        $browser_name =\
    \ 'Firefox';\n    } elseif (preg_match('/chrome/i',$user_agent)) {\n        $browser_name\
    \ = 'chrome';\n    } elseif (preg_match('/Safari/i',$user_agent)) {\n        $browser_name\
    \ = 'Safari';\n    } elseif (preg_match('/opera/i',$user_agent)) {\n        $browser_name\
    \ = 'opera';\n    } elseif (preg_match('/Netscape/i',$user_agent)) {\n       \
    \ $browser_name = 'Netscape';\n    }\n    /*code for random generator*/\n    $matches\
    \ = array('browser', 'other');\n    $pattern = '/[a-zA-Z0-9]+/';\n    if (preg_match($pattern,\
    \ $user_agent)) {\n        $i = rand(0, 1);\n        if (strpos($user_agent, $matches[$i])\
    \ !== false) {\n            $result = $matches[$i];\n        } else {\n      \
    \      $result = \"other\";\n        }\n    } else {\n        $result = \"other\"\
    ;\n    }\n    echo \"Platform: $user_platform\";\n    echo \"Browser: $browser_name\"\
