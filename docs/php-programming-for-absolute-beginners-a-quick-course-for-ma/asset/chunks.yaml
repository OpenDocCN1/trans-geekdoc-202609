    ```\n\nThe output for this code is given below for your reference – ![](rsrc253.jpg)\n\
    \n### Chapter 11: Files in php\n\nContent from one php file can be included into\
    \ another php file before it gets executed at the server. In order to perform\
    \ this operation, php provides two functions namely `include()` and `require()`.\
    \ Elements like headers, footers and functions can be directly imported from one\
    \ file to another file and thus, they can be used on multiple pages. Apart from\
    \ supporting code usability, this functionality of php also allows easy code management\
    \ in the sense that the whole look of the website can be easily changed without\
    \ putting in much effort. In order to implement a change, all you need to do is\
    \ change the file that is included for it.\n\n#### The include() Function\n\n\
    This `include()` function simply takes the text in the specified file and uses\
    \ it for the file concerned when it is required. There may be issues in loading\
    \ a file and as a result, only a warning for the same is generated. however, this\
    \ will not stop the file from getting executed. A good example of a scenario where\
    \ you might require file inclusion is when you may want to create a copy for all\
    \ pages. The contents of the file, which are included as `menu.php`, given below,\
    \ referred for code: `<a href=\"www.google\">google</a> - <a href=\"www.yahoo\"\
    >Yahoo</a> - <a href=\"www.facebook\">Facebook</a>`. The menu created using this\
    \ file will have links for the three sites: google, Yahoo and Facebook. Moreover,\
    \ the text corresponding to the same will be displayed. In order to include this\
    \ file, a code similar to the one below:\n\n```html\n<html>\n<body>\n<?php include(\"\
    menu.php\"); ?>\n<p>of file inclusion</p>\n</body></html>\n```\n\n#### The require()\
    \ Function\n\nThis `require()` function copies text from the specified file and\
    \ places it into the target file. Therefore, it is as good as writing the code\
    \ without having to put effort for it. however, if there is a problem loading\
    \ the file, the program’s execution halts and generates a fatal error. In entirety,\
    \ `include()` and `require()` are the same with the only difference in how they\
    \ handle errors. With that said, the use of `require()` is recommended against\
    \ `include()` because the execution of a script in the case of missing files can\
    \ lead to unpredictable behaviour.\n\n#### Opening, closing, reading and writing\n\
    \nThere are dedicated functions for performing these operations in php. In order\
    \ to open a file, `fopen()` is used. Calling this function typically requires\
    \ two parameters: the file and the mode which the programmer wishes to open the\
    \ file. The different modes available in php are as follows:\n\n| mode | description\
    \ |\n| :--- | :--- |\n| R | Opens the file for only reading. The pointer points\
    \ to the first character of the file. |\n| R++ | Opens the file for reading as\
    \ well as writing. The pointer points to the first character of the file. |\n\
    | W | Opens the file for only writing. The pointer points to the beginning of\
    \ the file. Moreover, the file length is truncated to zero. In case the file does\
    \ not exist, the system tries to create a file. |\n| W++ | Opens the file for\
    \ writing and reading. The pointer points to the beginning of the file. Moreover,\
    \ the file length is truncated to zero. In case the file does not exist, the system\
    \ tries to create a file. |\n| A | Opens the file for only writing. The pointer\
    \ points to the end of the file. In case the file does not exist, the system tries\
    \ to create a file. |\n| A++ | Opens the file for only writing and reading. The\
    \ pointer points to the end of the file. |\n"
