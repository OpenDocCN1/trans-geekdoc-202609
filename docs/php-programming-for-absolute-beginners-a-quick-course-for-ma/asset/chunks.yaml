  fmt: "\n```php\n} Echo \"Welcoᴍe \". $_post['name']. \"<br />\"; echo \"You are\
    \ \". $_post['age']. \" years old.\"; exit(); } ?> \n<html>\n<body>\n  <form action=\"\
    <?php $_php_SELF ?>\" method=\"post\"> \n    name: <input type=\"text\" name=\"\
    name\" /> Age: <input type=\"text\" name=\"age\" /> <input type=\"submit\" />\
    \ \n  </form>\n</body>\n</html>\n```\n\nThe form created using this script will\
    \ have a submit button. Upon clicking the button, the default php variable named\
    \ `$_php_SELF` will be called. The code also makes use of methods `post` and `get`.\
    \ We shall talk about these in detail in the next chapter.\n\n## Browser Redirect\n\
    \nRaw http headers are provided by the `header()` function to the browser. This\
    \ function can also be used to redirect the browser to another location. In order\
    \ to avoid loading of the different elements of the page before redirection occurs,\
    \ the redirection code must be placed at the top of the page.\n\nThe Location:\
    \ header, which is the argument to the `header()`, is set to specify the target.\
    \ The use of `exit()` after this function is recommended to avoid any further\
    \ parsing of code. Sample code for redirection is provided below for your reference.\n\
    \n```php\n<?php \nIf($_post[\"location\"]) { \n  $location = $_post[\"location\"\
    ]; \n  header( \"Location:$location\" ); \n  Exit(); \n} ?> \n<html>\n<body>\n\
    \  <p>choose the site you wish to visit :</p> \n  <form action=\"<?php $_SERVER['php_SELF']\
    \ ?>\" method=\"post\"> \n    <select name=\"location\">\n      <option value=\"\
    http://www.google.com\"> google.com</option> \n      <option value=\"http://www.yahoo.com\"\
    > Yahoo.com</option> \n    </select> \n    <input type=\"submit\" /> \n  </form>\
    \ \n</body>\n</html> \n```\n\n## Chapter 13: get and post methods\n\nThe client\
    \ browser uses two methods to send information from the client to the web server.\
    \ These methods are `get` and `post`. however, before sending the information,\
    \ the browser first encodes the information using the coding scheme called URL\
    \ encoding. In this coding scheme, key-value pairs, which are here name-value\
    \ pairs, are combined together in such a way that different name-value pairs are\
    \ separated by `&` (ampersand). Any whitespaces are replaced by the plus sign\
    \ (`+`) and non-alphanumeric characters are replaced with their hexadecimal values.\
    \ Once the encoding process is over, the data is sent to the web server.\n\n###\
    \ The get method\n\nWhen the get method is used for sending information to the\
    \ web server, it send the same along with the page URL. The URL is appended by\
    \ the encoded information and the question mark sign (`?`) Separates the former\
    \ from the latter. Some of the key things to note about the use of this method\
    \ include:\n\n- Since this method appends the page URL, the sent information will\
    \ also appear in logs of the server.\n- The maximum number of characters that\
    \ can be sent using the `get` method is 1024 characters.\n- There is an inherent\
    \ issue of compromised confidentiality with this method. Therefore, its use must\
    \ be avoided when you are sending passwords or critical information to the web\
    \ server.\n- Another inherent limitation of the `get` method is that documents\
    \ and images cannot be sent to the server using this method.\n- Besides the above\
    \ mentioned, it is also possible to access the data sent using this method by\
    \ retrieving the `QUERY_STRING` variable. Therefore, data is not safe.\n\nIt is\
    \ possible to access all the sent using this method by accessing `$_get`, which\
    \ associative array provided by php for this purpose.\n\n```php\n<?php\nIf($_get[\"\
    name\"] || $_get[\"age\"]) { \n  Echo \"Welcome \".$_get['name'].\"<br />\"; \n\
    \  Echo \"You are \".$_get['age'].\" years old.\"; \n  Exit(); \n} ?> \n<html>\n\
    <body>\n  <form action=\"<?php $_php_SELF ?>\" method=\"get\"> \n    name: <input\
    \ type=\"text\" name=\"name\" /> Age: <input type=\"text\" name=\"age\" /> <input\
    \ type=\"submit\" /> \n  </form>\n</body>\n</html>\n```\n\n### The post method\n\
    \nAn alternative to the get method is `post` method. This method makes use of\
    \ http headers to transfer information from the client to the server. The encoded\
    \ information is put into header. Some of the things that you must know about\
    \ the use of this method for transfer has:\n\n- Unlike get method, there is no\
    \ limitation on the number of characters that can be sent using this method.\n\
    - It is possible to send binary as well as ascii data using this method.\n\nAs\
    \ far as the security of data is concerned, data security totally lies in hands\
    \ of the http protocol. You can ensure higher security of data by using https.\
    \ All data using the post method can be accessed using the `$_post` associative\
    \ array.\n\n```php\n<?php\nIf($_post[\"name\"] || $_post[\"age\"]) { \n  If (preg_match(\"\
    /^[A-Za-z-]/\",$_post['name'])) { \n    die (\"name is invalid!\"); \n  } \n \
    \ Echo \"Welcome \".$post['name'].\"<br />\"; \n  Echo \"You are \".$post['age'].\"\
    \ years old.\"; \n  Exit(); \n} ?> \n<html>\n<body>\n  <form action=\"<?php $_php_SELF\
    \ ?>\" method=\"post\"> \n    name: <input type=\"text\" name=\"name\" /> Age:\
    \ <input type=\"text\" name=\"age\" /> <input type=\"submit\" /> \n  </form>\n\
    </body>\n</html>\n```\n\n### The $_request Variable\n\nThe contents of `$_get`\
    \ and `$_post` are available in `$_request`. Besides this, `$_request` also contains\
    \ data associated with `$_cookie`. The form data sent to the web server using\
    \ both methods namely `get` and `post` can be accessed by accessing this variable.\
    \ here `$_php_SELF` variable contains the name of self script in which it is being\
    \ called.\n\n## Conclusion\n\nNow that we have reached the end of this book on\
    \ php programming, we hope that this book has helped you gain expertise in the\
    \ fundamentals of this programming language. You can take this journey of learning\
    \ forward by moving to the advanced concepts of php. Learning is a lifelong process\
    \ and as you practice programming in php, you will know more about the programming\
    \ language and what it offers to the developers. Moreover, the functionality of\
    \ what has been taught in this book will only find ground you implement the given\
    \ concepts. Moving forward, we recommend you to run the sample codes given in\
    \ this book and edit or improve them according to you understanding. This will\
    \ give you a good hang of the php ecosystem. Besides this, the world of php is\
    \ too wide and huge to be covered in a simple book. You will learn as you practice.\
    \ We hope you enjoyed reading this book and any feedback is most welcome.\n"
  trans: "\n\n```php\n} Echo \"Welcoᴍe \". $_post['name']. \"<br />\"; echo \"You\
    \ are \". $_post['age']. \" years old.\"; exit(); } ?> \n<html>\n<body>\n  <form\
    \ action=\"<?php $_php_SELF ?>\" method=\"post\"> \n    name: <input type=\"text\"\
    \ name=\"name\" /> Age: <input type=\"text\" name=\"age\" /> <input type=\"submit\"\
    \ /> \n  </form>\n</body>\n</html>\n```\n\n使用此脚本创建的表单将包含一个提交按钮。点击该按钮时，将会调用名为 `$_php_SELF`\
    \ 的默认 php 变量。该代码还使用了 `post` 和 `get` 方法。我们将在下一章中详细讨论这些方法。\n\n## 浏览器重定向 (Browser\
    \ Redirect)\n\n通过 `header()` 函数向浏览器提供原始的 HTTP 头部。该函数也可用于将浏览器重定向到另一个位置。为了避免在重定向发生之前加载页面不同元素，重定向代码必须放在页面顶部。\n\
    \n`Location:` 是 `header()` 函数的参数，用于指定目标。建议在该函数调用后使用 `exit()` 以避免对代码进行任何进一步解析。下面提供了重定向示例代码供你参考。\n\
    \n```php\n<?php \nIf($_post[\"location\"]) { \n  $location = $_post[\"location\"\
    ]; \n  header( \"Location:$location\" ); \n  Exit(); \n} ?> \n<html>\n<body>\n\
    \  <p>选择您想要访问的网站：</p> \n  <form action=\"<?php $_SERVER['php_SELF'] ?>\" method=\"\
    post\"> \n    <select name=\"location\">\n      <option value=\"http://www.google.com\"\
    > google.com</option> \n      <option value=\"http://www.yahoo.com\"> Yahoo.com</option>\
    \ \n    </select> \n    <input type=\"submit\" /> \n  </form> \n</body>\n</html>\
    \ \n```\n\n## 第 13 章：get 和 post 方法 (get and post methods)\n\n客户端浏览器使用两种方法从客户端向信息到\
    \ Web 服务器。这些方法是 `get` 和 `post`。然而，在发送信息之前，浏览器首先使用称为 URL 编码的编码方案对信息进行编码。在这种编码方案中，键值对（此处为名称值对）被组合在一起，不同的键值对通过\
    \ `&`（和符号）分隔开。任何空格都会被替换为加号（`+`），非字母数字字符被替换为它们的十六进制值。编码过程完成后，数据将发送到 Web 服务器。\n\n\
    ### get 方法 (The get method)\n\n当使用 get 方法向 Web 服务器发送信息时，它会将信息连同页面 URL 一起发送。URL\
    \ 后面附加编码后的信息，并用问号（`?`）将两者分开。使用此方法时需要注意的一些关键点包括：\n\n-   由于该方法附加了页面 URL，发送的信息也将出现在服务器的日志中。\n\
    -   使用 `get` 方法可以发送的最大字符数是 1024 个字符。\n-   该方法存在机密性损害的固有问题。因此，在向 Web 服务器发送密码或关键信息时，必须避免使用它。\n\
    -   `get` 方法的另一个固有限制是无法使用此方法向服务器发送文档和图像。\n-   除了上述，还可以通过获取 `QUERY_STRING` 变量来访问使用此方法发送的数据。因此，数据是不安全的。\n\
    \n可以通过访问 `$_get`（php 为此目的提供的关联数组）来访问所有通过此方法发送的数据。\n\n```php\n<?php\nIf($_get[\"\
    name\"] || $_get[\"age\"]) { \n  Echo \"Welcome \".$_get['name'].\"<br />\"; \n\
    \  Echo \"You are \".$_get['age'].\" years old.\"; \n  Exit(); \n} ?> \n<html>\n\
    <body>\n  <form action=\"<?php $_php_SELF ?>\" method=\"get\"> \n    name: <input\
    \ type=\"text\" name=\"name\" /> Age: <input type=\"text\" name=\"age\" /> <input\
    \ type=\"submit\" /> \n  </form>\n</body>\n</html>\n```\n\n### post 方法 (The post\
    \ method)\n\nget 方法的替代方案是 `post` 方法。该方法利用 HTTP 头部将信息从客户端传输到服务器。编码后的信息被放入请求体中。关于使用此方法进行传输时，你必须了解的一些要点包括：\n\
    \n-   与 get 方法不同，使用此方法发送信息的字符数量没有限制。\n-   可以使用此方法发送二进制数据以及 ASCII 数据。\n\n就数据安全性而言，数据安全完全取决于\
    \ HTTP 协议。通过使用 https，你可以确保更高的数据安全性。使用 post 方法的所有数据都可以通过 `$_post` 关联数组进行访问。\n\n\
    ```php\n<?php\nIf($_post[\"name\"] || $_post[\"age\"]) { \n  If (preg_match(\"\
    /^[A-Za-z-]/\",post['name'])) { \n    die (\"名称无效!\"); \n  } \n  Echo \"Welcome\
    \ \".$post['name'].\"<br />\"; \n  Echo \"You are \".$post['age'].\" years old.\"\
    ; \n  Exit(); \n} ?> \n<html>\n<body>\n  <form action=\"<?php $_php_SELF ?>\"\
    \ method=\"post\"> \n    name: <input type=\"text\" name=\"name\" /> Age: <input\
    \ type=\"text\" name=\"age\" /> <input type=\"submit\" /> \n  </form>\n</body>\n\
    </html>\n```\n\n### $_request 变量\n\n`$_get` 和 `$_post` 的内容可以通过 `$_request` 获取。此外，`$_request`\
    \ 还包含与 `$_cookie` 相关的数据。使用 `get` 和 `post` 两种方法向 Web 服务器发送的表单数据都可以通过访问该变量来获取。此处\
    \ `$_php_SELF` 变量包含调用它的自身的脚本名称。\n\n## 总结 (Conclusion)\n\n现在我们已经到达这本关于 PHP 编程书籍的末尾，我们希望这本书帮助你掌握了这门编程语言的基础知识。你可以通过学习\
    \ PHP 的高级概念来继续你的学习之旅。学习是一个终身过程，随着你练习 PHP 编程，你将了解更多这门语言以及它为开发者提供的功能。此外，书中教授的功能只有在你实现所给出的概念时才能发挥作用。展望未来，我们建议你运行书中提供的示例代码，并根据你的理解对其进行编辑或改进。这将让你对\
    \ PHP 生态系统有良好的掌握。\n\n"
