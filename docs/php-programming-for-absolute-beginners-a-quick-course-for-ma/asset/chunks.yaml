    ## 引言

    PHP（超文本处理处理器）是一种编程语言，其设计目的是为了创建动态内容。此外，PHP 能够与数据库交互。作为一种脚本语言，PHP 被广泛用于 Web 开发。通过
    PHP，你可以轻松实现各种功能。学习 PHP 并不需要预先具备任何编程知识。考虑到 PHP 的特性，它能够帮助你快速掌握相关的编程技巧。PHP 是一个强大的工具，能够让你深入理解相关的知识点。


    ## 第 1 章：概述

    PHP 的第一个版本于 1994 年由 Rasmus Lerdorf 发行。在深入学习之前，让我们先了解关于 PHP 的一些知识。首先，PHP 是“超文本处理处理器”（Hypertext
    Preprocessor）的缩写。基本上，它是一种用于服务器端的脚本语言，可以嵌入在 HTML 代码中。事实上，PHP 的出现极大地推动了 Web 应用的发展。PHP
    允许与各种数据库交互，这是其核心优势之一。通过 PHP，你可以构建复杂的网站功能。由于其语法简单易懂，它非常适合初学者。


    ### 第一个程序

    首先，让我们来看最简单的 PHP 脚本，并尝试理解它是如何工作的。这个脚本会在屏幕上打印“hello World!”字符串。正如前面提到的，PHP 脚本是嵌入在
    HTML 代码中的。以下是供参考的示例代码：


    ```html

    <html>

    <head>

    <title>hello World!</title>

    </head>

    <body>

    <?php echo "hello, World..";?>

    </body>

    </html>

    ```


