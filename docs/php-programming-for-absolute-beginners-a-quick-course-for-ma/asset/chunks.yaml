    # Chapter 4: constants


    An identifier or name used to refer to a simple value is called ‘constant’. It
    is important to note that the value of a constant cannot be change during the
    course of the program. Therefore, a constant holds the value that it does, throughout!
    As a convention, a constant is declared in capitals. however, they are case-sensitive,
    by default. The naming convention used for naming a constant is the same as that
    for a variable. The name can be any combination of characters including underscore
    (`_`) except for special characters. Moreover, the name of the constant cannot
    start with a numeric character. As mentioned previously, the value of a constant
    remains ‘constant’. Therefore, once you have defined a constant, you cannot change
    its value or un-define it for that sake. In order to define a constant, the function
    `define()` needs to be used. Retrieval of the constant’s value just requires mentioning
    its name. The difference between using a variable and constant is that the name
    of a variable is preceded by `$` while the constant’s name is written just as
    it is. Alternatively, the use of the function `constant()` can also be used to
    retrieve the value of a constant.


    ### Constant Function


    This function is used to retrieve the value of a constant. The calling of this
    function returns the constant’s value. This function is generally used for constants
    whose name is not mentioned and it is stored in a variable is is the return value
    for a function. Sample implementation of this concept is given below:


    ```php

    <?php

    define("MINIMUM_SIZE", 25);

    echo MAXIMUM_SIZE;

    echo constant("MINIMUM_SIZE");

    ?>

    ```


    It is important to mention here that constants can only hold scalar data like
    integer, float, boolean and string.


    ### Difference between constants and variables


    With the mentioning of constants, its comparison with variables is obvious. Some
    of the key differences are as follows:


    - The dollar sign (`$`) is the first difference between constants and variables.
    Variables have to be preceded by a dollar while constants are specified without
    it.

    - Variables are assigned values using the simple assignment; however, constants
    cannot be defined in this manner. Constants can only be defined using the `define()`
    function.

    - Variables can be assigned, reassigned and undefined; however, constants cannot
    be modified in any way during the course of the program. The variable scoping
    rules do not apply to constants. They can be accessed and defined anywhere.


    ### Magical constants


    There are some predefined constants supported by php. Any script that runs on
    php can access these constants. Some constants in php change on the basis of where
    they are used. These are case-sensitive. Some of the php constants which defined
    as ‘magical’ are as follows:


    | magical constant | Description |

    | :--- | :--- |

    | `__FUNCTION__` | Of the function as it was declared. The name is case-sensitive.
    |

    | `__CLASS__` | This constant returns the name of the class concerned in a case-sensitive
    manner and exactly in the manner that it was declared. |

    | `__METHOD__` | This constant returns the name of the method concerned in a case-sensitive
    manner and exactly in the manner that it was declared. |


    ---


    # Chapter 5: operators


    Whenever an operation needs to be performed, it needs to have operands (s) and
    an operator that operates on the operands (s). The most common example of this
    concept is addition. When you add two numbers, say 2 and 3, the numbers are operands
    and `+` is the addition operator that works on the numbers. Addition is just one
    of the operations that we perform. There are dedicated operators for all other
    operations that you will need to perform for your basic programming tasks. Operators
    are divided into five categories, which include conditional operators, logical
    operators, arithmetic operators, assignment operators and comparison operators.
    Each of these categories has been described below.


    ### Arithmetic operators


    All mathematical operations are performed using operators that fall under the
    category of arithmetic operators. List of supported operators have given below:


    - Addition (`+`): This operator performs addition between two numbers. If `a`
    and `b` are two variables holding 5 and 6 respectively. Then, `c = a+b`, will
    yield `c = 11`.

    - Multiplication (`*`): This operator performs multiplication between two numbers.
    If `a` and `b` are two variables holding 5 and 6 respectively. Then, `c = a*b`,
    will yield `c = 30`.

    - Subtraction (`-`): This operator performs subtraction between two numbers. If
    `a` and `b` are two variables holding 5 and 6 respectively. Then, `c = a-b`, will
    yield `c = -1`.

    - Division (`/`): This operator performs division between two numbers. If `a`
    and `b` are two variables holding 10 and 5 respectively. Then, `c = a/b`, will
    yield `c = 2`.

    - Modulus (`%`): This operator returns the remainder left after dividing the two.
    If `a` and `b` are two variables holding 10 and 5 respectively. Then, `c = a%b`,
    will yield `c = 0`.

    - Increment (`++`): This operator adds 1 to the value of the variable. If `a`
    is a variable holding 1, `a++` will yield 2.

    - Decrement (`--`): This operator reduces 1 from the value of the variable. If
    `a` is a variable holding 1, `a--` will yield 0.


    ### Comparison operators


    All operations involving comparison are performed using comparison operators.
    List of the operators supported by this language is given below:


    - Not equal (`!=`): This operator is applied to two operands. It checks equality
    between two operands. If they are equal, it returns `false` else it returns `true`.

    - Equal to (`==`): This operator is applied to two operands. It checks equality
    between two operands. If they are equal, it returns `true` else it returns `false`.

    - Greater than (`>`): This operator is applied to two operands. It checks equality
    between two operands. If the first operand is greater than the second operand,
    it returns `true` else it returns `false`.

    - Less than (`<`): This operator is applied to two operands. It checks equality
    between two operands. If the first operand is less than the second operand, it
    returns `true` else it returns `false`.

    - Greater than or equal (`>=`): This operator is applied to two operands. It checks
    equality between two operands. If the first operand is greater than or equal to
    the second operand, it returns `true` else it returns `false`.

    - Less than or equal (`<=`): This operator is applied to two operands. It checks
    equality between two operands. If the first operand is less than or equal to the
    second operand, it returns `true` else it returns `false`.

    '
