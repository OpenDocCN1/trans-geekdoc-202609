    # 第 4 章：常量


    用于引用简单值的一个标识符或名称称为“常量”。需要注意的是，常量的值在程序运行过程中不能改变。因此，常量在整个过程中始终保持其原有值！按照惯例，常量使用大写字母声明。然而，默认情况下，它们是区分大小写的。常量的命名规范与变量相同。名称可以是任何字符的组合，包括下划线
    (`_`)，特殊字符字符。此外，常量名称不能以数字开头。如前所述，常量的值始终是“常量”的。因此，一旦你定义了一个常量，就无法更改它的值也无法为了这个目的取消定义。为了定义常量，需要使用
    `define()` 函数。获取常量的值只需提及其名称。使用变量和常量的区别在于，变量名前面有 `$` 符号，而常量名直接写即可。或者，也可以使用 `constant()`
    函数来获取常量的值。


    ### 常量函数


    此函数用于获取常量的值。调用此函数会返回常量的值。此函数通常用于未提及名称且存储在变量中的常量，或者作为函数的返回值。该概念的示例实现如下：


    ```php

    <?php

    define("MINIMUM_SIZE", 25);

    echo MAXIMUM_SIZE;

    echo constant("MINIMUM_SIZE");

    ?>

    ```


    这里需要提到的是，常量只能持有标量数据，如整数、浮点数、布尔和字符串。


    ### 常量与变量的区别


    提到常量，与变量进行比较是显而易见的。一些主要区别如下：


    - 美元符号 (`$`) 是常量和变量之间的第一个区别。变量必须以美元符号开头，而常量在指定时不需要。

    - 变量使用简单赋值进行赋值；然而，常量不能通过这种方式定义。常量只能使用 `define()` 函数定义。

    - 变量可以赋值、重新赋值和取消定义；但常量在程序运行过程中不能以任何方式修改。变量的作用域规则不适用于常量。它们可以在任何地方访问和定义。


    ### 魔术常量


    php 支持一些预定义的常量。任何运行在 php 上的脚本都可以访问这些常量。php 中的某些常量会根据它们使用的位置而改变。这些常量是区分大小写的。一些定义为“魔术”的
    php 常量如下：


    | 魔术常量 | 描述 |

    | :--- | :--- |

    | `__FUNCTION__` | 声明时的函数名称。名称区分大小写。 |

    | `__CLASS__` | 此常量以区分大小写的方式返回相关的类名，且与声明的方式完全一致。 |

    | `__METHOD__` | 此常量以区分大小写的方式返回相关的方法名称，且与声明的方式完全一致。 |


    ---


    # 第 5 章：运算符


    每当需要执行某些操作时，就需要操作数（s）和一个作用于操作数（s）的运算符。该概念最常见的例子是加法。当你将两个数字（例如 2 和 3）相加时，数字操作数，`+`
    是作用于数字的加法运算符。加法只是我们执行的操作之一。对于你基础编程任务需要执行的所有其他操作，都有专门运算符。运算符分为五类，包括条件运算符、逻辑运算符、算术运算符、赋值运算符和比较运算符。下面对这些类别分别进行了描述。


    ### 算术运算符


    所有的数学操作都是使用属于算术运算符类的运算符执行的。支持的运算符列表所示：


    - 加法 (`+`)：此运算符执行两个数字之间的加法。如果 `a` 和 `b` 是两个分别持有 5 和 6 的变量，那么 `c = a+b` 将产生 `c
    = 11`。

    - 乘法 (`*`)：此运算符执行两个数字之间的乘法。如果 `a` 和 `b` 是两个分别持有 5 和 6 的变量，那么 `c = a*b` 将产生 `c
    = 30`。

    - 减法 (`-`)：此运算符执行两个数字之间的减法。如果 `a` 和 `b` 是两个分别持有 5 和 6 的变量，那么 `c = a-b` 将产生 `c
    = -1`。

    - 除法 (`/`)：此运算符执行两个数字之间的除法。如果 `a` 和 `b` 是两个分别持有 10 和 5 的变量，那么 `c = a/b` 将产生 `c
    = 2`。

    - 取模 (`%`)：此运算符返回两个数相除后的余数。如果 `a` 和 `b` 是两个分别持有 10 和 5 的变量，那么 `c = a%b` 将产生 `c
    = 0`。

    - 递增 (`++`)：此运算符将变量的值加 1。如果 `a` 是一个持有 1 的变量，`a++` 将产生 2。

    - 递减 (`--`)：此运算符从变量的值中减 1。如果 `a` 是一个持有 1 的变量，`a--` 将产生 0。


    ### 比较运算符


    所有涉及比较的操作都是使用比较运算符执行的。该语言支持的运算符所示：


    - 不等于 (`!=`)：此运算符作用于两个操作数。检查两个操作数之间的相等性。如果相等，返回 `false`，否则返回 `true`。

    - 等于 (`==`)：此运算符作用于两个操作数。检查两个操作数之间的相等性。如果相等，返回 `true`，否则返回 `false`。

    - 大于 (`>`)：此运算符作用于两个操作数。检查两个操作数之间的相等性。如果第一个操作数大于第二个操作数，返回 `true`，否则返回 `false`。

    - 小于 (`<`)：此运算符作用于两个操作数。检查两个操作数之间的相等性。如果第一个操作数小于第二个操作数，返回 `true`，否则返回 `false`。

    - 大于或等于 (`>=`)：此运算符作用于两个操作数。检查两个操作数之间的相等性。如果第一个操作数大于或等于第二个操作数，返回 `true`，否则返回 `false`。

    - 小于或等于 (`<=`)：此运算符作用于两个操作数。检查两个操作数之间的相等性。如果第一个操作数小于或等于第二个操作数，返回 `true`，否则返回 `false`。


    '
