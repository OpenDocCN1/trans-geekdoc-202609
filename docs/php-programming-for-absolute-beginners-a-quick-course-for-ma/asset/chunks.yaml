    \ froᴍ the ɴaᴍe that this forᴍat is the shortest way to tell the php parser that\
    \ you are eᴍʙeddiɴg php code. however, iɴ order to eɴsure that php recogɴizes\
    \ your tags, you ɴeed to do the followiɴg – While ʙuildiɴg php, use the coɴfiguratioɴ\
    \ optioɴ, --eɴaʙle-short-tags. ![](rsrc246.jpg)Opeɴ the php.iɴi file aɴd check\
    \ if the short\\_opeɴ\\_tag settiɴg is set to ‘oɴ’. Siɴce, the saᴍe syɴtax is\
    \ used for XᴍL tags, you ᴍust switch this optioɴ to ‘off’ for eɴaʙliɴg XᴍL parsiɴg.\
    \ ![](rsrc244.jpg)ASP-style tags These tags use the saᴍe tags as that used ʙy\
    \ Active Server Pages for deliɴeatiɴg code ʙlocks. You will have to check the\
    \ php.iɴi file to see if these tags are eɴaʙled for your php coɴfiguratioɴ. Iɴ\
    \ order to use these tags, you ᴍust follow the giveɴ syɴtax – \n\n<%…%> htᴍl Script\
    \ tags The htᴍl script tags caɴ ʙe used iɴ the followiɴg ᴍaɴɴer – <script laɴguage\
    \ = \"php\">...</script> Coᴍᴍeɴts iɴ php Coᴍᴍeɴts are text or liɴes that are igɴored\
    \ ʙy the parser. These liɴes of text are typically used to iᴍprove the readaʙility\
    \ aɴd uɴderstaɴdaʙility of code. however, they do ɴot coɴtriʙute, iɴ aɴy way,\
    \ towards chaɴgiɴg the output. Php supports siɴgle-liɴe as well as ᴍulti-liɴe\
    \ coᴍᴍeɴts. Siɴgle – liɴe coᴍᴍeɴts caɴ ʙe ᴍade ʙy precediɴg the liɴe with # or\
    \ //. The preseɴce of these characters tell the parser that the text followiɴg\
    \ this character coᴍʙiɴatioɴ aɴd uɴtil a ɴewliɴe character is eɴcouɴtered, is\
    \ a coᴍᴍeɴt. Exaᴍple of siɴgle liɴe coᴍᴍeɴts caɴ ʙe fouɴd ʙelow. <? # this is\
    \ a coᴍᴍeɴt, aɴd # this is the secoɴd liɴe of the coᴍᴍeɴt // this is a coᴍᴍeɴt\
    \ too. Each style coᴍᴍeɴts oɴly priɴt \"Aɴ exaᴍple with siɴgle liɴe coᴍᴍeɴts\"\
    ; ?> ᴍulti – liɴe coᴍᴍeɴts are coᴍᴍeɴts that spaɴ across ᴍultiple liɴes. Iɴ other\
    \ words, the terᴍiɴatioɴ of a ᴍulti-liɴe coᴍᴍeɴt is ɴot assuᴍed oɴ the preseɴce\
    \ of a ɴewliɴe character. These coᴍᴍeɴts ʙegiɴ with the character coᴍʙiɴatioɴ\
    \ ‘/\\*’ aɴd eɴd with ‘\\*/’. Aɴy text writteɴ ʙetweeɴ these two character coᴍʙiɴatioɴs\
    \ is referred to as a ‘ᴍulti-liɴe coᴍᴍeɴt’. Exaᴍple of a ᴍulti-liɴe coᴍᴍeɴt is\
    \ giveɴ ʙelow – <? /\\* this is a coᴍᴍeɴt with ᴍultiliɴe ᴍohtashiᴍ Purpose: ᴍultiliɴe\
    \ coᴍᴍeɴts deᴍo priɴt \"Aɴ exaᴍple with ᴍulti liɴe coᴍᴍeɴts\"; ?> Author : ᴍohaᴍᴍad\
    \ Suʙᴊect: php​ \\*/ It is iᴍportaɴt to ᴍeɴtioɴ here that php is iɴseɴtive to\
    \ whitespaces. Iɴ other words, ɴo ᴍatter how ᴍaɴy whitespace characters you use,\
    \ iɴ aɴ isolated ᴍaɴɴer or together, the systeᴍ will ᴊust igɴore it. Typically,\
    \ whitespace characters iɴclude taʙs, spaces, ɴewliɴes aɴd carriage returɴs of\
    \ aɴy kiɴd. ʙesides this, php is case-seɴsitive. Iɴ other words, variaʙles xz\
    \ aɴd Xz are two differeɴt ideɴtifiers for the php systeᴍ. Lastly, all php expressioɴs\
    \ ᴍust ʙe terᴍiɴated with a seᴍicoloɴ (;). The preseɴce of seᴍicoloɴ is aɴ iɴdicatioɴ\
    \ to \n\nThe systeᴍ that the expressioɴ has terᴍiɴated aɴd ɴow, it caɴ expect\
    \ to receive a ɴew php expressioɴ. diggiɴg deeper iɴto the coɴcept of expressioɴs,\
    \ they are ɴothiɴg ʙut a coᴍʙiɴatioɴ of tokeɴs that caɴɴot ʙe further ʙrokeɴ iɴto\
    \ suʙ-eɴtities. These tokeɴs are striɴgs, ɴuᴍʙers, coɴstaɴts aɴd variaʙles. Iɴ\
    \ additioɴ to these, keywords are also tokeɴs. A collectioɴ of stateᴍeɴts that\
    \ does a specific fuɴctioɴ is called a ʙlock aɴd is deᴍarkated with the help of\
    \ ʙraces. The saᴍple code showɴ ʙelow deᴍoɴstrates all the coɴcepts ᴍeɴtioɴed\
    \ iɴ the text. If (2==2) Priɴt(\"Equality prevails<ʙr>\"); If (2 == 2) { Priɴt(\"\
    Re- Aɴalysis\"); Priɴt(\" coᴍpleted.<ʙr>\"); } Executiɴg a php Script You caɴ\
    \ execute a php script froᴍ the coᴍᴍaɴd proᴍpt. Assuᴍiɴg that you have placed\
    \ your code iɴ a php file ɴaᴍed test.php. The code preseɴt iɴ the file is as follows\
    \ – <?Php​ echo \"hello php..\"; ?> Iɴ order to ruɴ the script, you ɴeed to give\
    \ the followiɴg coᴍᴍaɴd froᴍ the proᴍpt. $php test.php The executioɴ of this coᴍᴍaɴd\
    \ will priɴt the text hello php.. Oɴ the screeɴ. "
  fmt: "\n![](rsrc245.jpg)As you can see in the sample code, the web browser does\
    \ not output the php code as it is. Instead, it processes the code and what we\
    \ get on the browser of the client screen is pure html output. Php code can be\
    \ integrated with html using one of the three ways illustrated below –\n\n- `<?php\
    \ php code goes here ?>`\n- `<?php <?​ Php code goes here ?>`\n- `<script language\
    \ = \"php\"> php code goes here </script>`\n\nUsing one of the formats shown above,\
    \ you can put php code in html. This tells the parser that the text present in\
    \ this format is php script, which needs to be executed. The most common tag used\
    \ for php integration with html is `<?php ... ?>`.\n\n## Environmental Setup\n\
    Evidently, php runs with html in the web browser and to test php code, you will\
    \ need to set up a local system. In order to run php scripts as part of your html\
    \ in the web pages, you require three components to be installed on your local\
    \ system. These components include –\n\n### Web Server\nYou can use any web server\
    \ and rest assured that php will work with it. Therefore, if you are working on\
    \ a Windows system, you can safely work with the microsoft’s Internet Information\
    \ Server (`IIS`). With that said, the Apache remains the most popular server for\
    \ php because of its open source nature.\n\n### Database\nLikewise, php can be\
    \ used with any database solution, which includes popular databases like Sybase\
    \ and oracle. however, the solution that is most commonly used is `mysql`.\n\n\
    ### Php Parser\nThe system cannot read and understand the php instructions provided\
    \ by you until you have a php parser installed on your machine, which reads php\
    \ states and generate html output that is sent to the Web Browser.\n\n### Installing\
    \ Parser for php\nTo start with, the first thing that you must do is open the\
    \ browser and type the following address in the browser’s address box: `http://127.0.0.1/info.php`.\
    \ If the browser opens a valid webpage with php-related information, it can be\
    \ assumed that the Web server and php are properly installed on the system. On\
    \ the other hand, if this is not the case, then you will have to install Apache\
    \ and php for your system. You can simply google for Apache and php installation\
    \ on the platform that you are using. This shall give you a set of instructions,\
    \ which you can follow step by step.\n\n## Chapter 2: Syntax\nNow that we have\
    \ already written our first php program, let us take this knowledge forward to\
    \ write more programs in this programming language. however, in order to graduate\
    \ to more complex programs, you need to learn the syntax that this programming\
    \ language uses.\n\n### Escaping to php\nFirstly, we need to understand that php\
    \ code is written as part of html or is embedded into html. Therefore, there has\
    \ to be a way which the php parsing differentiates between html and php. The mechanism\
    \ used for this purpose is referred as ‘escaping to php’. This can be done in\
    \ four ways, which are as follows –\n\n#### Canonical php tags\nThe most universally\
    \ accepted and effective tag style for php is `<?php ... ?>`. The use of this\
    \ tag style ensures your tags will be correctly interpreted by most systems.\n\
    \n#### Short-open (sg-style) tags\nThe sg tags look similar to the format below.\
    \ It is evident that this format is the shortest way to tell the php parser that\
    \ you are embedding code. however, in order to ensure php recognizes your tags,\
    \ you need to do the following:\n\n- While building php, use the configuration\
    \ option `short_open_tag`.\n- Open the `php.ini` file and check if `short_open_tag`\
    \ is set to ‘on’.\n- Since the same syntax is used for XML tags, you must switch\
    \ this option to ‘off’ for XML parsing.\n\n#### ASP-style tags\nThese tags use\
    \ the same as used by Active Server Pages for defining code blocks. You will have\
    \ to check `php.ini` to see if these tags are enabled for your php configuration.\
    \ In order to use these tags, you must follow the syntax – `<%...%>`\n\n#### Script\
    \ tags\nThe html script tags can be used in the following manner – `<script language=\"\
    php\">...</script>`\n\n### Comments in php\nComments are text or lines that are\
    \ ignored by the parser. These lines of text are typically used to improve the\
    \ readability and understandability of code. however, they do not contribute,\
    \ in any way, towards changing the output. Php supports single-line as well as\
    \ multi-line comments.\n\n#### Single-line comments\nSingle line comments can\
    \ be made by preceding the line with `#` or `//`. The presence of these characters\
    \ tells the parser that the text following this character and until a newline\
    \ character is encountered, is a comment. Example of single-line comments can\
    \ be found below:\n\n```php\n<?php\n# this is a comment, and # this is the second\
    \ line of the comment\n// this is a comment too.\nEach style comments only print\
    \ \"An example with single line comments\";\n?>\n```\n\n#### Multi-line comments\n\
    Multi-line comments are comments that span across multiple lines. In other words,\
    \ the termination of a multi-line comment is not assumed on the presence of a\
    \ newline character. These comments begin with the character `/*` and end with\
    \ `*/`. Any text written between these two character combinations is referred\
    \ to as a ‘multi-line comment’. Example of a multi-line comment is given below:\n\
    \n```php\n<?php\n /* this is a comment with multiline mohtashi\nPurpose: multiline\
    \ comments demo print \"An example with multi line comments\";\nAuthor : mohammad\n\
    Subject: php */\n?>\n```\n\nIt is important to mention here that php is insensitive\
    \ to whitespaces. In other words, no matter how many whitespace characters you\
    \ use, in an isolated manner or together, the system will just ignore it. Typically,\
    \ whitespace characters include tabs, spaces, newlines and carriage returns of\
    \ any kind. Besides this, php is case-sensitive. In other words, variables `xz`\
    \ and `Xz` are two different identifiers for the php system. Lastly, all php expressions\
    \ must be terminated with a semicolon `;`. The presence of semicolon is an indication\
    \ to the system that the expression has terminated and now, it can expect a new\
    \ expression. digging deeper into the concept of expressions, they are nothing\
    \ but a combination of tokens that cannot be further broken into entities. These\
    \ tokens are strings, numbers, constants and variables. In addition to these,\
    \ keywords are also tokens. A collection of statements that does a specific function\
    \ is called a block and is demarcated with the help of braces. The sample code\
    \ below demonstrates all the concepts mentioned in the text.\n\n```php\n<?php\n\
    if (2==2) print(\"Equality prevails<br>\");\nif (2 == 2) {\n    print(\"Re- Analysis\"\
    );\n    print(\"completed.<br>\");\n}\n?>\n```\n"
  trans: "\n\n![](img/rsrc245.jpg)如示例代码所示，网络浏览器不会原样输出 php 代码。相反，它会处理这些代码，我们在客户端浏览器屏幕上看到的是纯\
    \ html 输出。Php 代码可以通过下面所示的三种方式之一与 html 集成——\n\n- `<?php php 代码写在此处 ?>`\n- `<?php\
    \ <?​ Php 代码写在此处 ?>`\n- `<script language = \"php\"> php 代码写在此处 </script>`\n\n\
    使用上述所示的格式之一，你可以将 php 代码放入 html 中。这告诉解析器存在于这种格式中的文本是 php 脚本，需要执行。用于 php 与 html\
    \ 集成的最常用的标签是 `<?php ... ?>`。\n\n## 环境搭建\n显而易见，php 在网络浏览器中配合 html 一起运行，为了测试 php\
    \ 代码，你需要搭建一个本地系统。为了在网页中作为 html 的一部分运行 php 脚本，你需要在本地系统中安装三个组件。这些组件包括——\n\n### Web\
    \ 服务器\n你可以使用任何 Web 服务器，并放心 php 可以在其上工作。因此，如果你在 Windows 系统上工作，可以安全地使用微软的 Internet\
    \ 信息服务 (`IIS`)。尽管如此，由于其开源特性，Apache 仍然是 php 最受欢迎的服务器。\n\n### 数据库\n同样，php 可以与任何数据库解决方案配合，包括\
    \ Sybase 和 oracle 等流行数据库。然而，最常用的解决方案是 `mysql`。\n\n### Php 解析器\n在你的机器上安装 php 解析器之前，系统无法读取和理解你提供的\
    \ php 指令，该解析器会读取 php 状态并生成发送到网络浏览器的 html 输出。\n\n### 安装 php 的解析器\n首先，你必须做的第一件事是打开浏览器，并在地址栏中输入以下地址：`http://127.0.0.1/info.php`。如果浏览器打开了一个包含\
    \ php 相关信息的有效网页，可以假设 Web 服务器和 php 已正确安装在系统上。反之，如果情况并非如此，你必须为你的系统安装 Apache 和 php。你可以简单地在\
    \ true 正在使用的平台上谷歌搜索 Apache 和 php 的安装。这将为你提供一组指令，你可以按照这些步骤逐步操作。\n\n## 第 2 章：语法\n\
    现在我们已经写了第一个 php 程序，让我们带着这些知识继续学习，用这种编程语言编写更多程序。然而，为了过渡到更复杂的程序，你需要学习这种编程语言所使用的语法。\n\
    \n#### 转义 php (Escaping to php)\n首先，我们需要理解 php 代码是作为 html 的一部分编写或嵌入 html 的。因此，必须有一种方式让\
    \ php 解析区分 html 和 php。用于此目的的机制被称为“转义 php”。这可以通过四种方式实现，具体如下——\n\n#### 标准 php 标签\n\
    php 最为普遍接受且有效的标签样式是 `<?php ... ?>`。使用这种标签样式可以确保你的标签被大多数系统正确解释。\n\n#### 短开标签 (sg-style\
    \ tags)\nsg 标签类似于下面的格式。显而易见，这种格式是告诉 php 解析器你正在嵌入代码的最短方式。然而，为了确保 php 识别你的标签，你需要以下操作：\n\
    \n- 在编译 php 时，使用配置选项 `short_open_tag`。\n- 打开 `php.ini` 文件并检查 `short_open_tag`\
    \ 是否设置为‘on’。\n- 由于 XML 标签也使用相同的语法，你在解析 XML 时必须将此选项切换为‘off’。\n\n#### ASP 样式标签\n\
    这些标签使用的与 Active Server Pages 定义代码块的方法相同。你必须检查 `php.ini` 以查看这些标签是否在你的 php 配置中启用。为了使用这些标签，你必须遵循语法——`<%...%>`\n\
    \n#### Script 标签\nhtml script 标签可以按以下方式使用——`<script language=\"php\">...</script>`\n\
    \n#### php 中的注释\n注释是解析器忽略的文本或行。这些文本行通常用于提高代码的可读性和理解性。然而，它们对改变输出没有任何形式的贡献。Php 支持单行注释以及多行注释。\n\
    \n#### 单行注释\n通过在行前加上 `#` 或 `//` 可以创建单行注释。这些字符的存在告诉解析器，从该字符之后到遇到换行符之前的文本都是注释。单行注释的示例见下文：\n\
    \n```php\n<?php\n# 这是一个注释，并且 # 这是是注释的第二行\n// 这也是一个注释。\nEach style comments only\
    \ print \"An example with single line comments\";\n?>\n```\n\n#### 多行注释\n多行注释是跨越多行的注释。换句话说，多行注释的结束并不假设于换行符的存在。这些注释以字符\
    \ `/*` 开始，以 `*/` 结束。在这两个字符组合之间编写的任何文本都被称为“多行注释”。多行注释的示例所示：\n\n```php\n<?php\n\
    \ /* 这是一个带有多行说明的注释 \nPurpose: multiline comments demo print \"An example with\
    \ multi line comments\";\nAuthor : mohammad\nSubject: php */\n?>\n```\n\n这里需要说明的是，php\
    \ 对空格不敏感。换句话说，无论你使用多少个空白字符，无论是单独使用还是在一起，系统都会忽略它。通常，空白字符包括各种制表符、空格、换行和回车。此外，php\
    \ 是大小敏感的。换句话说，变量 `xz` 和 `Xz` 对于 php 系统来说是两个不同的标识符。最后，所有的 php 表达式必须以分号 `;` 结束。分号的存在指示系统表达式已经结束，现在它可以期待一个新表达式了。深入研究表达式的概念，它们只是无法进一步拆分为实体的标记（tokens）的组合。这些标记是字符串、数字、常量和变量。除了这些，关键字也是标记。一组执行特定函数的语句集合被称为块（block），并借助大括号进行标记。下面的示例代码演示了文中提到的所有概念。\n\
    \n```php\n<?php\nif (2==2) print(\"Equality prevails<br>\");\nif (2 == 2) {\n\
    \    print(\"Re- Analysis\");\n    print(\"completed.<br>\");\n}\n?>\n```\n\n"
