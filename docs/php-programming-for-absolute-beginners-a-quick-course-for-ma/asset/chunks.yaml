    # Chapter 3: Variables


    In order to store information, we need to create variables that can hold this
    information and be used for referencing the same. Some of the most important things
    to understand about using variables in this programming language are as follows
    – As a rule, all variable names must be preceded by a dollar sign ($) for it to
    be considered valid by the system. ![](rsrc247.jpg)


    The most recent assignment statement related to the variable determines its current
    value. ![](rsrc247.jpg) In order to assign values to variables, the equal to operator
    (`=`) must be used. This operator must have the variable on the left hand side
    and the value or the expression that computes the value on the right hand side
    of the operator. ![](rsrc244.jpg)


    It is a good programming practice to declare variables before using them; however,
    if you do not do so, `php` will still allow you to go ahead and use the variable.
    ![](rsrc244.jpg) Php` does not assign any intrinsic type to a variable. Therefore,
    you can use a variable to store any kind of information, be it a number or a string.
    No such type needs to be assigned to a variable in advance. ![](rsrc244.jpg)


    If you use a variable without assigning a value to it, the variable will hold
    a default value. ![](rsrc242.jpg) Whenever necessary, type of a variable is automatically
    converted from one to the other. ![](rsrc248.jpg) Variables in `php` are similar
    to those in Perl. ![](rsrc244.jpg) `Php` supports eight data types when it comes
    to information storing in variables. These data types are as follows –


    ### Booleans

    This data type can only hold two types of values, which include `true` and `FALSE`.
    There are situations that demand expressions to be evaluated as boolean giving
    the result of `true` or `FALSE`. While performing such evaluations, the following
    rules must be kept in mind –


    - If the expression evaluates to a number, which is zero, then the value of the
    expression is `FALSE`. Any other number is considered non-zero and is evaluated
    as `true`. ![](rsrc244.jpg)

    - If the expression evaluates to a string, then the boolean value of the expression
    is `true` if it evaluates to a valid string. On the other hand, if the string
    is empty, then the expression is evaluated to `FALSE`. ![](rsrc247.jpg)

    - Any expression that evaluates to the value `null` has an equivalent boolean
    value of `FALSE`. ![](rsrc244.jpg)

    - If an expression evaluates to an array, then the boolean value of the expression
    is `true` if the array has elements. On the other hand, if the value of the expression
    is an array with no elements, its boolean value is `FALSE`.

    - Considering the case of objects, if any of the member variables of the objects
    have a value assigned to it, then the object evaluates to boolean `true`, else
    it is evaluated as `FALSE`. ![](rsrc242.jpg)

    - Any resource that is valid for the `php` system is evaluated as `true`. ![](rsrc248.jpg)
    The use of doubles as booleans must be avoided. ![](rsrc244.jpg)


    ### Integers

    All the whole numbers are included in integers. For example, any number like `675`
    or `54` is an integer. The syntax or `php` expression for assigning a value to
    an integer is given below – `$int_variable = 45`; It is important to note that
    the largest integer that can be held by system is `2,147,483,647`.


    ### Doubles

    All floating point numbers are actually just whole numbers followed by decimal
    point and fractional part fall under this data type.


    ### Strings

    Any notation of characters is referred to as string. All string operations are
    supported in `php`.


    ### Null

    This data type can store only one value and is usually used for initializing variable.
    The value it stores is `null`. Although conventionally capital letters are used
    for writing null, it can also be written as ‘null’ and the system will recognize
    it as the same. Therefore, the following statement is valid – `$var1 = null;`.
    There are two important things to note about null:

    - Firstly, `null` always evaluates to `FALSE` when boolean determined.

    - Secondly, if `null` is tested against `isset()`, it always evaluates to `FALSE`.


    ### Arrays

    A collection of data of the same type can also be called array. In fact, arrays
    can also be visualized as a number of variables of the same type, which are distinguished
    by the index at which they are present.


    ### Objects

    Programmers define classes or templates, when instantiated create objects. A class
    is typically composed of data values and functions. An object of that class can
    access all the functions of the class and possesses a set of data variables of
    itself, in accordance with the data defined for the class.


    ### Resources

    There may be some programming scenarios that require you to refer to resources
    that are not available within `php`. An example of such programming scenario is
    database connection. In order to hold such references, special variables are required,
    which are called resources. The difference between single strings and double strings
    is that the former are treated literally while the latter can replace the value
    of variables. Besides this, specially interpreting character sequences are also
    represented as double strings. As far as the limitation on string length is concerned,
    `` does not impose any such limits. Therefore, as long as the memory allows, you
    can create effectively long strings. double strings are processed by the system
    in one of the following ways – Whenever a variable name is encountered, which
    is identified by the appearance of `$` as the first character in the name, the
    string representation of the variable is automatically put into its place. ![](rsrc244.jpg)


    Special characters begin with a backslash (`\`) and they are accordingly interpreted
    as a special character with a specific purpose. ![](rsrc244.jpg) The common replacements
    for escape sequences are as follows –


    | Escape Sequence |

    | --- |

    | `\\` |

    | `\"` |

    | `\$` |

    | `\t` |

    | `\r` |

    | `\n` |


    ### Scope of Variables

    The scope of a variable determines its accessibility in the program in terms of
    the elements that are allowed to access the variable and those that cannot. There
    are four types of scope in `php` which include local, global, static variables
    and function parameters.

    - Variables that are only available within the block of code to which they belong
    are referred to as local variables.

    - On the other hand, variables that are globally available and accessible for
    all are called global variables.

    - Function parameters are parameters supplied to a function and act as local variables
    for the function.

    - Static variables are a special type of variables that maintain their value and
    exist between function calls. Therefore, if you are using a static variables and
    use it in a function that is called thrice, the value of static variable will
    be assumed as the value assigned to it by the last function call.


    ### Giving names to Variables

    There are specific rules that need to be followed while naming a variable. These
    rules include –

    - The name of a variable can only begin with underscore (`_`) or alphabets.

    - The use of numbers as the first character in the name of a variable is not allowed.
    ![](rsrc242.jpg)

    - The use of special characters like `%`, `+` and `-`, in addition to others,
    is also not allowed. In other words, apart from underscore, you cannot use any
    other special character. ![](rsrc244.jpg)

    - Lastly, there is no limit on the size of a variable.

    '
