    # 第 3 章：变量


    为了存储信息，我们需要创建可以包含这些信息并用于引用相同信息的变量。在使用这一编程语言的变量时，需要理解的一些重要点如下——按照规定，所有变量名必须以美元符号
    ($) 开头，才能被系统视为有效![](img/rsrc247.jpg)


    与变量相关的最近一次赋值语句决定了它的当前值![](img/rsrc247.jpg)。为了给变量赋值，必须使用等号运算符 (`=`)。该运算符的符号左侧必须是变量，右侧必须是值或计算该值的表达式![](img/rsrc244.jpg)


    在使用变量之前先声明变量是一个良好的编程习惯；但是，即使你不这样做，`php` 仍然允许你继续使用该变量![](img/rsrc244.jpg)。`Php`
    不为变量分配任何内在类型。因此，你可以使用变量来存储任何类型的信息，无论是数字还是字符串。不需要提前为变量分配此类类型![](img/rsrc244.jpg)


    如果你使用一个变量而不给它赋值，则该变量将持有一个默认值![](img/rsrc242.jpg)。必要时，变量的类型会自动在不同类型之间转换![](img/rsrc248.jpg)。`php`
    中的变量与 Perl 中的变量相似![](img/rsrc244.jpg)。`Php` 在变量存储信息方面支持八种数据类型。这些数据类型如下——


    ### 布尔值

    这种数据类型只能包含两种值，包括 `true` 和 `FALSE`。在某些情况下需要将表达式评估为布尔值，给出 `true` 或 `FALSE` 的结果。在执行此类评估时，必须记住以下规则——


    - 如果表达式评估为数字零，则表达式的值为 `FALSE`。任何其他数字都被视为非零并被评估为 `true`![](img/rsrc244.jpg)

    - 如果表达式评估为字符串，那么如果其评估结果为有效字符串，则表达式的布尔值为 `true`。相反，如果字符串为空，则表达式被评估为 `FALSE`![](img/rsrc247.jpg)

    - 任何评估结果为 `null` 的表达式其等效布尔值均为 `FALSE`![](img/rsrc244.jpg)

    - 如果表达式评估为数组，如果数组有元素，则表达式的布尔值为 `true`。相反，如果表达式的值是一个没有元素的数组，其布尔值为 `FALSE`。

    - 考虑到对象的情况，如果对象的任何成员变量都被分配了值，则对象被评估为布尔值 `true`，否则被评估为 `FALSE`![](img/rsrc242.jpg)

    - 任何对 `php` 系统有效的资源都会被评估为 `true`![](img/rsrc248.jpg)。必须避免将双精度浮用作布尔值![](img/rsrc244.jpg)


    ### 整数

    整数包含所有的全数字。例如，任何如 `675` 或 `54` 的数字都是整数。`php` 为整数赋值的语法或表达式如下——`$int_variable =
    45`；要注意，系统可以包含的最大整数是 `2,147,483,647`。


    ### 双精度浮点数

    所有浮点数实际上都是整数后面跟着小数点和小数部分，它们都属于这种数据类型。


    ### 字符串

    任何字符的表示法称为字符串。`php` 支持所有字符串操作。


    ### 空

    这种数据类型只能存储一个值，通常用于初始化变量。它存储的值是 `null`。尽管习惯上使用大写字母写 null，但它也可以写为‘null’，系统将其识别为相同。因此，以下语句是有效的——`$var1
    = null;`。关于 null 有两个重要的注意事项：

    - 第一，`null` 在确定布尔值时始终评估为 `FALSE`。

    - 第二，如果用 `isset()` 测试 `null`，它始终评估为 `FALSE`。


    ### 数组

    相同类型的数据集合也可以称为数组。事实上，数组也可以被视为若干个相同类型的变量，通过它们所在的索引来区分开。


    ### 对象

    程序员定义类或模板，在实例化时创建对象。一个类通常由数据值和函数组成。该类的对象可以访问该类的所有函数，并根据类定义的数据拥有一组自己的数据变量。


    ### 资源

    可能存在某些编程场景需要你引用 `php` 内部不可用的资源。此类编程场景的一个示例是数据库连接。为了持有此类引用，需要特殊的变量，这些被称为资源。单引号字符串和双引号字符串的区别在于前者被字面处理，而后者可以替换变量的值。此外，特殊解释的字符序列也表示为双引号字符串。至于字符串长度的限制，双引号并不实施任何此类限制。因此，只要内存允许，你就可以创建很长的字符串。双引号字符串由系统按以下方式之一处理——每当遇到变量名（通过名称中第一个字符为
    `$` 来识别），变量的字符串表示会自动放在该位置![](img/rsrc244.jpg)


    特殊字符以反斜杠 (`\`) 开头，并相应地解释为具有特定目的的特殊字符![](img/rsrc244.jpg)。转义序列的常见替换如下——


    | 转义序列 |

    | --- |

    | `\\` |

    | `\"` |

    | `\$` |

    | `\t` |

    | `\r` |

    | `\n` |


    ### 变量的作用域

    变量的作用域决定其在程序中的访问范围，即哪些元素允许访问变量，哪些不能。`php` 中有四种作用域，包括局部、全局、静态变量和函数参数。

    - 在所属代码块内有效的变量称为局部变量。

    - 另一方面，全局可用且所有人都可以访问的变量称为全局变量。

    - 函数参数是提供函数的参数，并充当函数的局部变量。

    - 静态变量是一种特殊的变量，它们在函数调用之间保持其值并存在。因此，如果你在使用静态变量并在被调用三次的函数中使用它，那么静态变量的值将被假设为最后一次函数调用赋值的值。


    ### 变量命名

    在为变量命名时需要遵循特定的规则。这些规则包括——

    - 变量名只能以下划线 (`_`) 或字母开头。

    - 不允许使用数字作为变量名的开头字符![](img/rsrc242.jpg)

    - 不允许使用如 `%`、`+` 和 `-` 等特殊字符。换句话说，除了下划线外，你不能使用任何其他特殊字符![](img/rsrc244.jpg)

    - 最后，变量的大小没有限制。


    '
