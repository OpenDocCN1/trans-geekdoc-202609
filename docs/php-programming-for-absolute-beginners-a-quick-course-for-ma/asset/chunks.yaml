    ## Introduction

    Php or php hypertext Preprocessor is a programming language, which was designed
    with the objective to allow creation of dynamic content. Moreover, php also enables
    this dynamic content to interact with databases. As a result, the most intuitive
    application of php is for development of web-based software applications. This
    book is an introductory tutorial to help you learn php from scratch and build
    the right foundation for advanced lessons in this programming language. Although,
    this tutorial does not require the reader to have any prior knowledge of php or
    any other programming language, basic knowledge about programming concepts is
    recommended. Besides this, considering the fact that php allows interaction with
    databases, you can expect to encounter databases once in a while. Therefore, some
    background knowledge and understanding of databases and SQL will also be of immense
    help. This book includes several sample codes, which have been provided to give
    you the real-world programming experience. go ahead and execute these codes for
    a better learning experience. besides this, you may also try variations of code
