    \ hidden variables | 11.4.4 |\n| MVN with missing data | 11.6.1 |\n| HMMs | 17.5.2\
    \ |\n| Shrinkage estimates of Gaussian means | Exercise 11.13 |\n\n**Table 11.2:**\
    \ Some models discussed in this book for which EM can be easily applied to find\
    \ the ML/MAP parameter estimate.\n\n### 11.4.2 Basic idea\n\nIn summary, the EM\
    \ algorithm’s pseudo code is as follows:\n\nEM exploits the fact that if the data\
    \ were fully observed, then the ML/MAP estimate would be easy to compute. In particular,\
    \ each iteration of the EM algorithm consists of two processes: The **E-step**,\
    \ and the **M-step**.\n\n*   In the **E-step**, the missing data are inferred\
    \ given the observed data and current estimate of the model parameters. This is\
    \ achieved using the conditional expectation, explaining the choice of terminology.\n\
    *   In the **M-step**, the likelihood function is maximized under the assumption\
    \ that the missing data are known. The missing data inferred from the E-step are\
    \ used in lieu of the actual missing data.\n\nLet `xi` be the visible or observed\
    \ variables in case `i`, and let `zi` be the hidden or missing variables. The\
    \ goal is to maximize the log likelihood of the observed data:\n\n```\nℓ(θ) =\
    \ log p(D|θ) = ∑_{i=1}^N log p(xi|θ) = ∑_{i=1}^N log ∑_{zi} p(xi, zi|θ)   (11.11)\n\
    ```\n\nUnfortunately this is hard to optimize, since the log cannot be pushed\
    \ inside the sum.\n\nEM gets around this problem as follows. Define the **complete\
    \ data log likelihood** to be:\n\n```\nℓc(θ) = ∑_{i=1}^N log p(xi, zi|θ)   (11.12)\n\
    ```\n\nThis cannot be computed, since `zi` is unknown. So let us define the **expected\
    \ complete data log likelihood** as follows:\n\n```\nQ(θ, θ^{t-1}) ≜ E_{z|D,θ^{t-1}}\
    \ [ℓc(θ)] = E[ℓc(θ)|D, θ^{t-1}]   (11.13)\n```\n\nwhere `t` is the current iteration\
    \ number. `Q` is called the **auxiliary function** (see Section 11.4.9 for derivation).\
    \ The expectation is taken wrt the old parameters, `θ^{t-1}`, and the observed\
    \ data `D`. The goal of the **E-step** is to compute `Q(θ, θ^{t-1})`, or rather,\
    \ the parameters inside of it which the MLE (or MAP) depends on; these are known\
    \ as the **expected sufficient statistics** or **ESS**. In the **M-step**, we\
    \ optimize the `Q` function wrt `θ`:\n\n```\nθ^t = arg max_θ Q(θ, θ^{t-1})   (11.14)\n\
    ```\n"
  trans: "\n# LVM 的最简单形式\n\nLVM 的最简单形式是当 `zi ∈ {1, · · · , K}` 时，表示离散潜在状态。我们将对此使用离散先验，`p(zi)\
    \ = Cat(π)`。对于似然，我们使用 `p(xi|zi = k) = pk(xi)`，其中 `pk` 是观测值的第 k 个基础分布；这可以是任何类型。整体模型被称为**混合模型**，因为我们将\
    \ K 个基础分布混合在一起，如下所示：\n\n```\np(xi|θ) = ∑_{k=1}^K π_k pk(xi|θ)   (11.1)\n```\n\n\
    根据似然 `p(xi|zi)` 和先验 `p(zi)` 的形式，我们可以生成各种不同的模型，如表 11.1 所总结的。\n\n| p(xi|zi) | p(zi)\
    \ | 名称 | 章节 |\n| :--- | :--- | :--- | :--- |\n| 乘积高斯 | 离散 | 高斯混合模型 | 11.2.1 |\n\
    | 乘积离散 | 离散 | 多项式混合模型 | 11.2.2 |\n| 乘积高斯 | 乘积高斯 | 因子分析 / 概率 PCA | 12.1.5 |\n|\
    \ 乘积拉普拉斯 | 乘积高斯 | 概率 ICA / 稀疏编码 | 12.6 |\n| 乘积高斯 | 多项式 | PCA | 27.2.3 |\n| 狄利克雷\
    \ | 离散 | 潜在狄利克雷分配 | 27.3 |\n| 乘积噪声 OR | 乘积伯努利 | BN20 / QMR | 10.2.3 |\n| 乘积伯努利\
    \ | 乘积伯努利 | Sigmoid 信念网络 | 27.7 |\n\n**表 11.1：** 一些流行的有向潜在变量模型总结。此处 **Prod** 表示乘积，因此似然中的\
    \ **Prod. Discrete** 表示形式为 `∏_j Cat(xij|zi)` 的分解分布，而 **Prod. Gaussian** 表示形式为\
    \ `∏_j N(xij|zi)` 的分解分布。\n\n## 11.2.1 高斯混合模型\n\n```\npk(xi|θ) = N(xi|µk, Σ)  \
    \ (11.2)\n```\n\n## 11.2.2 多努利混合模型\n\n```\npk(xi|θ) = ∏_{j=1}^D Ber(xij|µjk) =\
    \ ∏_{j=1}^D µjk^{xij} (1 − µjk)^{1−xij}   (11.3)\n```\n\n其中 `µjk` 是第 `j` 位在簇 `k`\
    \ 中开启的概率。潜在变量不必具有任何含义；我们可能只是引入潜在变量以使模型更强大。例如，可以证明混合分布的均值和协方差由以下公式给出：\n\n```\n\
    E[x] = ∑_{k=1}^K π_k µk   (11.4)\nCov[x] = ∑_{k=1}^K π_k (Σ + µk µk^T) − E[x]E[x]^T\
    \   (11.5)\n```\n\n其中 `Σ = diag(µjk(1 − µjk))`。因此，尽管分量分布是分解的，但联合分布不是。因此，混合分布可以捕捉变量之间的相关性，这与单一的伯努利乘积模型不同。\n\
    \n## 11.2.3 使用混合模型进行聚类\n\n混合模型有两个主要应用：**黑盒密度模型**（见第 14.7.3 节 TODO）和**聚类**（见第 25\
    \ 章 TODO）。\n\n### 软聚类\n\n```\nrik ≜ p(zi = k|xi, θ) = p(zi = k, xi|θ) / p(xi|θ)\n\
    \    = p(zi = k|θ) p(xi|zi = k, θ) / ∑_{k'=1}^K p(zi = k'|θ) p(xi|zi = k', θ)\
    \   (11.6)\n```\n\n其中 `rik` 称为簇 `k` 对点 `i` 的**责任度**。\n\n### 硬聚类\n\n```\nzi* ≜\
    \ arg max_k rik = arg max_k p(zi = k|xi, θ)   (11.7)\n```\n\n生成式分类器和混合模型的区别仅出现在训练阶段：在混合模型情况下，我们从不观测\
    \ `zi`，而使用生成式分类器时，我们会观测 `yi`（其扮演 `zi` 的角色）。\n\n## 11.2.4 专家混合模型\n\n```\np(yi|xi,\
    \ zi = k, θ) = N(yi|w_k^T xi, σ_k²)   (11.8)\np(zi|xi, θ) = Cat(zi|S(V^T xi))\
    \   (11.9)\n```\n\n有向图模型见 Figure 11.3(a)。\n\n该模型称为**专家混合模型**或 **MoE**（Jordan and\
    \ Jacobs 1994）。其思想是每个子模型被视为输入空间某个区域的专家。函数 `p(zi|xi, θ)` 称为**门控函数**，根据输入值决定使用哪个专家。例如，Figure\
    \ 11.2(b) 展示了三个专家如何划分一维输入空间，Figure 11.2(a) 展示了每个专家单独的预测（在本例中，专家只是线性回归模型），而 Figure\
    \ 11.2(c) 展示了使用以下公式获得的模型总体预测：\n\n```\np(yi|xi, θ) = ∑_{k=1}^K p(zi = k|xi, θ)\
    \ p(yi|xi, zi = k, θ)   (11.10)\n```\n\n我们将在第 11.4.3 节 TODO 中讨论如何拟合该模型。\n\n##\
    \ 11.3 混合模型的参数估计\n\n### 11.3.1 不可识别性\n\n### 11.3.2 计算 MAP 估计是非凸的\n\n## 11.4 EM\
    \ 算法\n\n### 11.4.1 简介\n\n对于机器学习和统计学中的许多模型，如果我们观测到所有相关随机变量的值，即拥有**完全数据**，则计算 ML\
    \ 或 MAP 参数估计很容易。然而，如果我们有缺失数据和/或潜在变量，则计算 ML/MAP 估计变得困难。一种方法是使用通用的基于梯度的优化器来寻找 `NLL(θ)`\
    \ 的局部最小值。然而，我们通常必须强制执行约束，例如协方差矩阵必须是正定的、混合权重必须求和为 1 等，这可能比较棘手。在这种情况下，使用一种称为**期望最大化**的算法通常简单得多（但并不总是更快），简称\
    \ **EM**（Dempster et al. 1977; Meng and van Dyk 1997; McLachlan and Krishnan 1997）。这是一种在存在缺失或隐藏数据时计算\
    \ ML 或 MAP 估计的高效迭代算法，通常在每一步都有闭式更新。此外，该算法会自动强制执行所需的约束。有关本书中 EM 应用的总结，请参见表 11.2。\n\
    \n| 模型 | 章节 |\n| :--- | :--- |\n| 高斯混合模型 | 11.4.2 |\n| 专家混合模型 | 11.4.3 |\n| 因子分析\
    \ | 12.1.5 |\n| Student T 分布 | 11.4.5 |\n| Probit 回归 | 11.4.6 |\n| 含隐变量的 DGM |\
    \ 11.4.4 |\n| 含缺失数据的 MVN | 11.6.1 |\n| HMMs | 17.5.2 |\n| 高斯均值的收缩估计 | 练习 11.13\
    \ |\n\n**表 11.2：** 本书中讨论的一些模型，EM 算法可轻松应用于这些模型以寻找 ML/MAP 参数估计。\n\n### 11.4.2 基本思想\n\
    \n总之，EM 算法的伪代码如下：\n\nEM 算法利用了这样一个事实：如果数据被完全观测，则 ML/MAP 估计很容易计算。特别是，EM 算法的每次迭代包含两个过程：**E\
    \ 步**和**M 步**。\n\n*   在 **E 步** 中，给定观测数据和当前的模型参数估计，推断缺失数据。这是通过条件期望实现的，这解释了术语的由来。\n\
    *   在 **M 步** 中，假设缺失数据已知，最大化似然函数。从 E 步推断出的缺失数据被用来代替实际的缺失数据。\n\n令 `xi` 为情况 `i`\
    \ 中的可见或观测变量，令 `zi` 为隐藏或缺失变量。目标是最大化观测数据的对数似然：\n\n```\nℓ(θ) = log p(D|θ) = ∑_{i=1}^N\
    \ log p(xi|θ) = ∑_{i=1}^N log ∑_{zi} p(xi, zi|θ)   (11.11)\n```\n\n不幸的是，这很难优化，因为对数不能推入求和内部。\n\
    \nEM 通过以下方式解决此问题。定义**完全数据对数似然**为：\n\n```\nℓc(θ) = ∑_{i=1}^N log p(xi, zi|θ)  \
    \ (11.12)\n```\n\n这无法计算，因为 `zi` 未知。因此让我们定义**期望完全数据对数似然**如下：\n\n```\nQ(θ, θ^{t-1})\
    \ ≜ E_{z|D,θ^{t-1}} [ℓc(θ)] = E[ℓc(θ)|D, θ^{t-1}]   (11.13)\n```\n\n其中 `t` 是当前迭代次数。`Q`\
    \ 称为**辅助函数**（推导见第 11.4.9 节）。期望是针对旧参数 `θ^{t-1}` 和观测数据 `D` 计算的。**E 步**的目标是计算 `Q(θ,\
    \ θ^{t-1})`，或者更确切地说，计算 MLE（或 MAP）所依赖的其中的参数；这些被称为**期望充分统计量**或 **ESS**。在 **M 步**\
    \ 中，我们针对 `θ` 优化 `Q` 函数：\n\n```\nθ^t = arg max_θ Q(θ, θ^{t-1})   (11.14)\n```\n"
