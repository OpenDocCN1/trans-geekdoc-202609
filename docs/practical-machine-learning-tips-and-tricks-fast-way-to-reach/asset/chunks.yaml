    \ |\n| RVM | 非凸 | EB | 是 | 是 | | 14.3.2 |\n| SVM | 凸 | CV | 是 | 否 | 间接否 | 14.5\
    \ |\n| GP | 不适用 | EB | 否 | 是 | 否 | 15 |\n\n**表 14.1：** 不同基于核的分类器的比较。EB = 经验贝叶斯，CV\
    \ = 交叉验证。详见正文。\n\n## 14.7 用于构建生成模型的核\n\n我们已经提到了几种基于核的分类和回归技术，它们总结在表 14.1 中。（GP\
    \ 代表 **高斯过程**，我们将在第 15 章讨论 TODO。）各列的含义如下：\n\n*   **优化 w：** 一个关键问题是目标函数 `J(w) =\
    \ −log p(D|w) − log p(w)` 是否为凸函数。L2VM、L1VM 和 SVM 具有凸目标。RVM 没有。GP 是贝叶斯方法，不执行参数估计。\n\
    *   **优化核：** 所有方法都要求调整核参数，如 RBF 核的带宽以及正则化程度。对于基于高斯的方法，包括 L2VM、RVM 和 GP，我们可以使用高效的基于梯度的优化器来最大化边际似然。对于\
    \ SVM 和 L1VM，我们必须使用交叉验证，这更慢（见第 14.5.3 节）。\n*   **稀疏性：** L1VM、RVM 和 SVM 是稀疏核方法，因为它们仅使用训练样本的一个子集。GP\
    \ 和 L2VM 不是稀疏的：它们使用所有训练样本。稀疏性的主要优势是测试时的预测通常更快。此外，有时可以获得更高的精度。\n*   **概率输出：** 除\
    \ SVM 外，所有方法都产生形式为 `p(y|x)` 的概率输出。SVM 产生一个置信度值，可以转换为概率，但这类概率通常校准不良（见第 14.5.2.3\
    \ 节 TODO）。\n*   **多分类：** 除 SVM 外，所有方法都通过使用多努利输出而非伯努利输出，自然地适用于多分类设置。SVM 可以扩展为多分类分类器，但这种方法存在各种困难，如第\
