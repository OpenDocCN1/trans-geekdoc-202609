    ## 2.2.2 Multivariate random variables\n\n### 2.2.2.1 Joint CDF\n\nWe signify\
    \ joint CDF by `F(x,y) ≜ P(X≤ x ∩ Y≤ y) = P(X≤ x, Y≤ y)`.\n\n```\np(u,v)\nF(x,y)\
    \ ≜ P(X≤ x, Y≤ y) = ∑_{u≤x,v≤y} p(u,v)  (discrete)\nF(x,y) ≜ P(X≤ x, Y≤ y) = ∫_{-∞}^{x}\
    \ ∫_{-∞}^{y} f(u,v) du dv  (continuous)\n```\n\n### 2.2.2.2 Marginal distribution\n\
    \n**Marginal CDF**:\n```\nF_X(x) ≜ F(x, +∞) = P(X = x_i) = ∑_j P(X = x_i, Y =\
    \ y_j)  (discrete)\nF_X(x) ≜ ∫_{-∞}^{x} f_X(u) du = ∫_{-∞}^{x} ∫_{-∞}^{+∞} f(u,v)\
    \ dv du  (continuous)\n```\n\n```\nF_Y(y) ≜ F(+∞, y) = P(Y = y_j) = ∑_i P(X =\
