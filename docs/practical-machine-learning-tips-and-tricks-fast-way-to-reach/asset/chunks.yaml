    \ 的标准，我们需要残差向量与 `X` 的每个片段正交，因此 `x̃ⱼ(y - ŷ) = 0`，其中 `j = 1 : D`。因此\n\n```\nxⱼ(y\
    \ - ŷ) = 0\nXᵀ(y - Xw) = 0\nw = (XᵀX)⁻¹Xᵀy\n```\n\nML 估计的一个问题是它可能导致过拟合。在本节中，我们讨论一种通过使用带有高斯先验的\
    \ MAP 估计来改善此问题的方法。\n\n### 7.4.1 基本思想\n\n我们可以通过使用零均值高斯先验来敦促参数变小，从而产生更平滑的曲线：\n\n\
    ```\np(w) = ∏ N(wⱼ | 0, τ²)\n      j\n```\n\n其中 `1/τ²` 控制先验的强度。相应的 MAP 估计问题变为\n\
    \n```\narg max ∑ log N(yᵢ | w₀ + wᵀxᵢ, σ²) + ∑ log N(wⱼ | 0, τ²)\n      w i=1\
    \       j=1\n```\n\n在拥有大量数据的领域，简单的方法也能效果很好 (Halevy et al. 2009)。然而，仍然有理由研究更复杂的学习策略，因为总会存在我们只有少量数据的问题。例如，即使在网络搜索这样数据丰富的领域，当我们需要开始个性化结果时，对于任意给定用户可用的数据量相对于问题的复杂性再次变得很小。\n\
    \n这是一个基本练习，可以证明这等价于最小化以下目标\n\n```\nJ(w) = (1/Nσ²) ∑ (yᵢ - (w₀ + wᵀxᵢ))² + λ ||w||²,\
    \ λ ≜ 1/τ²\n        i=1\n```\n\n这里第一项当然是 MSE/NLL，第二项 `λ ≥ 0` 是一个复杂度惩罚。相应的解由下式给出\n\
    \n```\nŵ_ridge = (λI_D + XᵀX)⁻¹Xᵀy\n```\n\n此方法称为岭回归，或惩罚最小二乘法。通常，给模型参数添加高斯先验以敦促它们变小被称为\
    \ `ℓ₂` 正则化或权重衰减。请注意，偏移项 `w₀` 未被正则化，因为这只影响函数的高度，而不影响其复杂度。我们将在本书中考虑各种先验。每一种都对应一种不同形式的正则化。此策略广泛用于防止过拟合。\n\
    \n### 7.4.2 数值稳定计算\n\n```\nŵ_ridge = V (ZᵀZ + λI_N)⁻¹Zᵀy\n```\n\n### 7.4.3 与 PCA\
    \ 的联系\n\n### 7.4.4 大数据的正则化影响\n\n正则化是避免过拟合最常用的方法。然而，另一种有效的方法（并非总是可用）是使用大量数据。很自然地可以看出，我们拥有的训练数据越多，就越能更好地学习。\n\
    \n# 第 8 章 逻辑回归\n\n## 8.1 表示\n\n逻辑回归可以是二项的或多项的。二项逻辑回归模型具有以下结构\n\n```\np(y | x,\
    \ w) = Ber(y | sigm(wᵀx))\n```\n\n其中 `w` 和 `x` 是扩展向量，即 `w = (b, w₁, w₂, · · ·\
    \ , w_D)`，`x = (1, x₁, x₂, · · · , x_D)`。\n\n```\ng(w) = dJ/dw = ∑ [π(xᵢ) - yᵢ]xᵢ\
    \ = Xᵀ(π - y)\n       i=1\n\nH(w) = d²g/dwᵀ = d(π - y)ᵀXᵀ/dw\n     = XᵀSX, S ≜\
    \ diag(π(xᵢ)(1 - π(xᵢ))xᵢ)\n```\n\n## 8.2 优化\n\n### 8.2.1 MLE\n\n```\n{ N\nℓ(w)\
    \ = log ∏ [π(xᵢ)]ʸⁱ [1 - π(xᵢ)]¹⁻ʸⁱ\n     i=1\n```\n\n其中 `π(x) ≜ P(y = 1 | x,\
    \ w)`。\n\n```\nN\n= ∑ [yᵢ log π(xᵢ) + (1 - yᵢ) log(1 - π(xᵢ))]\ni=1\n\nN\n= ∑\
    \ [yᵢ log (π(xᵢ)/(1 - π(xᵢ)))] + ∑ log(1 - π(xᵢ))\ni=1   i=1\n\nN\n= ∑ [yᵢ(w·xᵢ)\
    \ - log(1 + exp(w·xᵢ))]\ni=1\n```\n\n```\nJ(w) ≜ NLL(w) = -ℓ(w)\nN\n= -∑ [yᵢ(w·xᵢ)\
    \ - log(1 + exp(w·xᵢ))]\ni=1\n```\n\nEquation 8.2 也称为交叉熵误差函数 (见 Equation 2.53)。\n\
    \n与线性回归不同，我们现在无法再以闭式写出 MLE。相反，我们需要使用优化算法来计算它，见 Appendix A。为此，我们需要求导梯度和 Hessian\
    \ 矩阵。\n\n对于逻辑回归的情况，可以证明其梯度和 Hessian 由以下公式给出\n\n### 8.2.1.1 迭代重加权最小二乘法 (IRLS)\n\
    \n### 8.2.2 MAP\n\n正如我们倾向于岭回归而非线性回归一样，我们也应该倾向于逻辑回归的 MAP 估计而非计算 MLE。我们可以使用 `ℓ₂`\
    \ 正则化，就像岭回归一样。我们注意到新的目标函数、梯度和 Hessian 具有以下形式：\n\n```\nJ'(w) ≜ NLL(w) + λwᵀw\n\
    g'(w) = g(w) + λw\nH'(w) = H(w) + λI\n```\n\n将这些调整后的条件传递给任何基于梯度的优化器是一件简单的事情。\n\
    \n## 8.3 多项逻辑回归\n\n### 8.3.1 表示\n\n多项逻辑回归模型也称为最大熵分类器，具有以下形式\n\n```\np(y = c |\
    \ x, W) = exp(w_cᵀx) / ∑ exp(w_cᵀx)\n                   C\n                  c=1\n\
    ```\n\n令 `yᵢ = (I(yᵢ = 1), I(yᵢ = 1), · · · , I(yᵢ = C))`，`µᵢ = (p(y = 1 | xᵢ,\
    \ W), p(y = 2 | xᵢ, W), · · · , p(y = C | xᵢ, W))`，则对数似然函数可以写为\n\n```\nℓ(W) =\
    \ log ∏ ∏ µᵢcʸⁱᶜ\n       N C\n      i=1 c=1\n\n= ∑ ∑ yᵢc w_cᵀxᵢ - log ∑ exp(w_cᵀxᵢ)\n\
    \  i=1 c=1   C\n           c=1\n```\n\n定义真正的目标函数为 NLL\n\n```\nJ(W) ≜ NLL(W) =\
    \ -ℓ(W)\n```\n\n定义 `A ⊗ B` 为矩阵 `A` 和 `B` 的 Kronecker 积。如果 `A` 是 `m×n` 矩阵，`B` 是\
    \ `p×q` 矩阵，则 `A ⊗ B` 是 `mp×nq` 分块矩阵\n\n```\n⎡ a₁₁B  ···  a₁ₙB ⎤\n⎢ ...    ...\
    \  ... ⎥\n⎣ aₘ₁B  ···  aₘₙB ⎦\n```\n\n梯度和 Hessian 由下式给出\n\n```\ng(W) = ∑ (µᵢ -\
    \ yᵢ) ⊗ xᵢ\n       i=1\n\nH(W) = ∑ (diag(µᵢ) - µᵢµᵢᵀ) ⊗ (xᵢxᵢᵀ)\n       i=1\n\
    ```\n\n其中 `yᵢ = (I(yᵢ = 1), I(yᵢ = 1), · · · , I(yᵢ = C-1))` 和 `µᵢ = (p(y = 1\
    \ | xᵢ, W), p(y = 2 | xᵢ, W), · · · , p(y = C-1 | xᵢ, W))` 是长度为 `C-1` 的列向量。将它们传递给任何基于梯度的优化器。\n\
    \n### 8.3.2 MLE\n\n### 8.3.3 MAP\n\n新的目标函数\n\n```\nJ'(W) = NLL(w) - log p(W)\n\
    ```\n\n其中 `p(W) ≜ ∏ N(w_c | 0, V₀)`\n                  C\n                 c=1\n\
    \n```\n= J(W) + 1/2 ∑ w_cᵀ V₀⁻¹ w_c\n         C\n        c=1\n```\n\n其梯度和 Hessian\
    \ 由下式给出\n\n```\ng'(w) = g(W) + V₀⁻¹ ∑ w_c\n                   C\n            \
    \      c=1\n\nH'(w) = H(w) + I_C ⊗ V₀⁻¹\n```\n\n这可以传递给任何基于梯度的优化代理以找到 MAP 估计。然而请注意，Hessian\
    \ 的大小为 `((CD)(CD))`，其行和列比二元情况多 `C` 倍，因此有限内存 BFGS 比牛顿法更合适。\n\n## 8.4 贝叶斯逻辑回归\n\n\
    通常希望计算参数的完整后验 `p(w | D)`，用于逻辑回归模型。这对于任何我们需要将置信区间与预测相关联的情况都很有用 (例如，这在解决相关刑事问题时是必不可少的，见\
