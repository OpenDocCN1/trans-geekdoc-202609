    t=2

    ```


    ### 10.1.3 Graphical models


    A graphical model (GM) is a way to represent a joint distribution by making CI
    assumptions. In particular, the nodes in the graph represent random variables,
    and the (lack of) edges represent CI assumptions. There are several kinds of graphical
    model, depending on whether the graph is directed, undirected, or some combination
    of directed and undirected. In this chapter, we just study directed graphs. We
    consider undirected graphs in Chapter 19.


