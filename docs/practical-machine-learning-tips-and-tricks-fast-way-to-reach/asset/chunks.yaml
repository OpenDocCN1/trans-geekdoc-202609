    \ the left hand side is a matrix, we intend to stack the `x_i` along the columns,\
    \ making a matrix.\n\n| Symbol | Meaning |\n| :--- | :--- |\n| `X ≻ 0` | `X` is\
    \ a positive definite matrix |\n| `tr(X)` | Trace of a matrix |\n| `det(X)` |\
    \ Determinant of matrix `X` |\n| `\\|X\\|` | Determinant of matrix `X` |\n| `X⁻¹`\
    \ | Inverse of a matrix |\n| `X†` | Pseudo-inverse of a matrix |\n| `Xᵀ` | Transpose\
    \ of a matrix |\n| `xᵀ` | Transpose of a vector |\n| `diag(x)` | Diagonal matrix\
