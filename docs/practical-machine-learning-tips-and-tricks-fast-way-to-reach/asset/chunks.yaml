    \ | W µx + µy, Σy + W Σx W^T)\n```\n\n关于证明，请参见第 4.4.3 节 TODO。\n\n## 4.5 离题：Wishart\
    \ 分布 *\n\n## 4.6 推断 MVN 的参数\n\n### 4.6.1 µ 的后验分布\n\n### 4.6.2 Σ 的后验分布 *\n\n###\
    \ 4.6.3 µ 和 Σ 的联合后验分布 *\n\n### 4.6.4 未知精度下的传感器融合 *\n\n# 第 5 章 贝叶斯统计\n\n## 5.1\
    \ 介绍\n\n## 5.2 后验分布的总结\n\n### 5.2.1.1 无不确定性度量\n\n使用后验分布来总结我们对一组未知变量的所有了解，是贝叶斯统计的核心。在本章中，我们将更详细地讨论这种统计方法。\n\
    \nMAP 估计最明显的缺点，实际上任何点估计（如后验均值或中位数）的缺点，都是它不提供任何不确定性度量。在许多应用中，知道可以在多大程度上信任给定的估计至关重要。我们可以从后验中获得此类确定性度量，正如我们在第\
    \ 5.2.2 节讨论的那样。后验 `p(θ | D)` 总结了我们对未知量 `θ` 的所有了解。在本节中，我们讨论可以从概率分布（如后验）中得出的一些基本量。这些汇总统计量通常比完整的联合分布更易于理解和可视化。\n\
    \n"
