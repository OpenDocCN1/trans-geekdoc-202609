    # EM Algorithm and Latent Variable Models


    ## 11.4 EM Algorithm


    The EM algorithm can be interpreted as F function''s maximization-maximization
    algorithm:


    ```

    { z } EM algorithm can be interpreted as F function''s = arg max ∑P(z|D,θ−1)log[P(D,z|θ)]
    maximization-maximization algorithm, based on this in = θ z{

    arg max Ez|D,θt−1 log[P(D,z|θ)]} terpretation there are many variations and generalization,(11.32)
    e.g., generalized EM Algorithm(GEM).θ≜

    arg maxQ(θ,θt−1) (11.33)

    θ

    ```


    ### 11.4.11.1 F Function''s Maximization-Maximization Algorithm


    **Definition 11.1.** Given the probability distribution of the hidden variable
    Z is `˜(Z)`, define F function as the following:


    ```

    ˜ ˜ F(P,θ) = E ˜[logP(X,Z|θ)] + H(P) (11.34)

    ```


    Where `H(P) = −E ˜[log ˜P(Z)]`, which is `˜P(Z)`''s entropy.


    Assume `θt−1` is the estimation of `θ` in the (t−1)-th iteration, `˜t−1` is the
    estimation of `˜P` in the (t−1)-th iteration. Then in the t-th iteration two steps
    are:

    1. For fixed `θt−1`, find `˜t` that maximizes `F(˜P, θt−1)`;

    2. For fixed `˜t`, find `θt` that maximizes `F(˜Pt, θ)`.


    **Lemma 11.1.** For a fixed `θ`, there is only one distribution `˜Pθ` which maximizes
    `F(˜P, θ)`:


    ```

    ˜Pθ(Z) = P(Z|X,θ) (11.35)

    ```


    **Proof.** Given a fixed `θ`, we can get `˜θ` which maximizes `F(˜P, θ)`. We construct
    the Lagrangian:


    ```

    ˜ log ˜Pθ(Z)

    L(˜P, θ) = E ˜[logP(X,Z|θ)] − E ˜[P] + λ(1 − ∑P(Z))

    Z

    ```


    Take partial derivative with respect to `˜Pθ(Z)` then we get:


    ```

    ∂L/∂˜Pθ(Z) = logP(X,Z|θ) − log ˜Pθ(Z) − 1 − λ

    ```


