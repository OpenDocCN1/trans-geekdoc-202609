  fmt: "\n# EM Algorithm\n\nTo perform MAP estimation, we modify the M-step as follows:\n\
    \n**Input**: observed data `D = {x1, x2, ..., xN}`, joint distribution `P(x, z\
    \ | θ)`\n\n**Output**: model's parameters `θ`\n\n```text\n// 1. identify hidden\
    \ variables z, write out the log likelihood function ℓ(x, z | θ)\nθ(0) = ... //\
    \ initialize\n\nwhile (!convergency) do\n    // 2. E-step: plug in P(x, z | θ),\
    \ derive the formula of Q(θ, θ^(t-1))\n    Q(θ, θ^(t-1)) = E[ℓc(θ) | D, θ^(t-1)]\n\
    \n    // 3. M-step: find θ that maximizes the value of Q(θ, θ^(t-1))\n    θ^t\
    \ = arg max Q(θ, θ^(t-1))\n          θ\nend\n```\n\n**Algorithm 3**: EM algorithm\n\
    \nBelow we explain how to perform the E and M steps for several simple models,\
    \ that should make things clearer.\n\n## 11.4.3 EM for GMMs\n\n### 11.4.3.1 Auxiliary\
    \ function\n\n```math\nQ(θ, θ^(t-1)) = E_{z|D, θ^(t-1)}[ℓc(θ)]\n             =\
    \ E_{z|D, θ^(t-1)}[∑_{i=1}^N log p(x_i, z_i | θ)]\n             = E_{z|D, θ^(t-1)}[∑_{i=1}^N\
    \ log ∏_{k=1}^K (π_k p(x_i | θ_k))^{I(z_i=k)}]\n             = ∑_{i=1}^N ∑_{k=1}^K\
    \ E[I(z_i = k)] log[π_k p(x_i | θ_k)]\n             = ∑_{i=1}^N ∑_{k=1}^K p(z_i\
    \ = k | x_i, θ^(t-1)) log[π_k p(x_i | θ_k)]\n             = ∑_{i=1}^N ∑_{k=1}^K\
    \ r_{ik} log π_k + ∑_{i=1}^N ∑_{k=1}^K r_{ik} log p(x_i | θ_k)  (11.16)\n```\n\
    \nwhere `r_{ik} ≜ E[I(z_i = k)] = p(z_i = k | x_i, θ^(t-1))` is the responsibility\
    \ that cluster `k` takes for data point `i`. This is computed in the E-step, described\
    \ below.\n\n```math\nθ^t = arg max Q(θ, θ^(t-1)) + log p(θ)  (11.15)\n      θ\n\
    ```\n\n### 11.4.3.2 E-step\n\nThe E step remains unchanged. The E-step has the\
    \ following simple form, which is the same for any mixture model:\n\n```math\n\
    r_{ik} = p(z_i = k | x_i, θ^(t-1)) = \\frac{p(z_i = k, x_i | θ^(t-1))}{p(x_i |\
    \ θ^(t-1))}  (11.17)\n       = \\frac{π_k p(x_i | θ_k^(t-1))}{∑_{k'=1}^K π_{k'}\
    \ p(x_i | θ_{k'}^(t-1))}\n```\n\n### 11.4.3.3 M-step\n\nIn the M-step, we optimize\
    \ `Q` wrt `π` and `θ_k`. For `π`, grouping together only the terms that depend\
    \ on `π`, we find that we need to maximize `∑_{i=1}^N ∑_{k=1}^K r_{ik} log π_k`.\
    \ However, there is an additional constraint `∑_{k=1}^K π_k = 1`, since they represent\
    \ the probabilities `π_k = P(z_i = k)`. To deal with the constraint we construct\
    \ the Lagrangian:\n\n```math\nL(π) = ∑_{i=1}^N ∑_{k=1}^K r_{ik} log π_k + β(∑_{k=1}^K\
    \ π_k - 1)\n```\n\nwhere `β` is the Lagrange multiplier. Taking derivatives, we\
    \ find:\n\n```math\nπ_k = \\frac{∑_{i=1}^N r_{ik}}{N}  (11.18)\n```\n\nThis is\
    \ the same for any mixture model, whereas `θ_k` depends on the form of `p(x |\
    \ θ_k)`.\n\nFor `θ_k`, plug in the pdf to Equation 11.16:\n\n```math\nQ(θ, θ^(t-1))\
    \ = ∑_{i=1}^N ∑_{k=1}^K r_{ik} log π_k - \\frac{1}{2} ∑_{i=1}^N ∑_{k=1}^K r_{ik}\
    \ [log |Σ_k| + (x_i - μ_k)^T Σ_k^{-1} (x_i - μ_k)]\n```\n\nTake partial derivatives\
    \ of `Q` wrt `μ_k`, `Σ_k` and let them equal to 0, we can get:\n\n```math\n\\\
    frac{∂Q}{∂μ_k} = -\\frac{1}{2} ∑_{i=1}^N r_{ik} [(Σ_k^{-1} + Σ_k^{-T})(x_i - μ_k)]\n\
    \               = -[Σ_k^{-1}(x_i - μ_k)] ∑_{i=1}^N r_{ik} = 0\n⇒ μ_k = \\frac{∑_{i=1}^N\
    \ r_{ik} x_i}{∑_{i=1}^N r_{ik}}  (11.19)\n```\n\n```math\n\\frac{∂Q}{∂Σ_k} = -\\\
    frac{1}{2} ∑_{i=1}^N r_{ik} [\\frac{1}{Σ_k} - \\frac{1}{Σ_k^2} (x_i - μ_k)(x_i\
    \ - μ_k)^T] = 0\n⇒ Σ_k = \\frac{∑_{i=1}^N r_{ik} (x_i - μ_k)(x_i - μ_k)^T}{∑_{i=1}^N\
    \ r_{ik}}  (11.20)\n```\n\n```math\n= \\frac{∑_{i=1}^N r_{ik} x_i x_i^T}{∑_{i=1}^N\
    \ r_{ik}} - μ_k μ_k^T  (11.21)\n```\n\n### 11.4.3.4 Algorithm pseudo code\n\n\
    **Input**: observed data `D = {x1, x2, ..., xN}`, GMM\n\n**Output**: GMM's parameters\
    \ `π, μ, Σ`\n\n```text\n// 1. initialize\nπ^(0) = ...\nμ^(0) = ...\nΣ^(0) = ...\n\
    t = 0\n\nwhile (!convergency) do\n    // 2. E-step\n    r̂_{ik} = \\frac{π_k p(x_i\
    \ | θ_k^(t-1))}{∑_{k'=1}^K π_{k'} p(x_i | μ_{k'}^(t-1), Σ_{k'}^(t-1))}\n\n   \
    \ // 3. M-step\n    π̂_k = \\frac{∑_{i=1}^N r̂_{ik}}{N}\n    μ̂_k = \\frac{∑_{i=1}^N\
    \ r̂_{ik} x_i}{∑_{i=1}^N r̂_{ik}}\n    Σ̂_k = \\frac{∑_{i=1}^N r̂_{ik} (x_i -\
    \ μ̂_k)(x_i - μ̂_k)^T}{∑_{i=1}^N r̂_{ik}}\n    t++\nend\n```\n\n**Algorithm 4**:\
    \ EM algorithm for GMM\n\n### 11.4.3.5 MAP estimation\n\nAs usual, the MLE may\
    \ overfit. The overfitting problem is particularly severe in the case of GMMs.\
    \ An easy solution to this is to perform MAP estimation. The new auxiliary function\
    \ is the expected complete data log-likelihood plus the log prior:\n\n```math\n\
    Q(θ, θ^(t-1)) = ∑_{i=1}^N ∑_{k=1}^K r_{ik} log π_k + ∑_{i=1}^N ∑_{k=1}^K r_{ik}\
    \ log p(x_i | θ_k)\n              + log p(π) + ∑_{k=1}^K log p(θ_k)\n```\n\nIt\
    \ is natural to use conjugate priors.\n\n```math\np(π) = Dir(π | α)\np(μ_k, Σ_k)\
    \ = NIW(μ_k, Σ_k | m_0, κ_0, ν_0, S_0)\n```\n\nFrom Equation 3.28 and Section\
    \ 4.6.3, the MAP estimate is given by:\n\n```math\nπ_k = \\frac{∑_{i=1}^N r_{ik}\
    \ + α_k - 1}{N + ∑_{k=1}^K α_k - K}  (11.23)\nμ_k = \\frac{∑_{i=1}^N r_{ik} x_i\
    \ + κ_0 m_0}{∑_{i=1}^N r_{ik} + κ_0}  (11.24)\nΣ_k = \\frac{\\bar{S}_0 + S_k +\
    \ \\frac{κ_0 r_k}{κ_0 + r_k} (\\bar{x}_k - m_0)(\\bar{x}_k - m_0)^T}{ν_0 + r_k\
    \ + D + 2}  (11.25)\n```\n\nwhere `r_k ≜ ∑_{i=1}^N r_{ik}`, `\\bar{x}_k ≜ \\frac{∑_{i=1}^N\
    \ r_{ik} x_i}{r_k}`, `\\bar{S}_k ≜ \\frac{∑_{i=1}^N r_{ik} (x_i - \\bar{x}_k)(x_i\
    \ - \\bar{x}_k)^T}{r_k}`.\n\n## 11.4.4 EM for K-means\n\n### 11.4.4.1 Representation\n\
    \n```math\ny_j = k \\text{ if } \\| x_j - μ_k \\|_2^2 \\text{ is minimal}  (11.26)\n\
    ```\n\nwhere `μ_k` is the centroid of cluster `k`.\n\n### 11.4.4.2 Evaluation\n\
    \n```math\n\\arg \\min_{μ} ∑_{j=1}^N ∑_{k=1}^K γ_{jk} \\| x_j - μ_k \\|_2^2  (11.27)\n\
    ```\n\nThe hidden variable is `γ_{jk}`, which's meaning is:\n\n```math\nγ_{jk}\
    \ = \\begin{cases}\n1, & \\text{if } \\| x_j - μ_k \\|_2^2 \\text{ is minimal\
    \ for } μ_k \\\\\n0, & \\text{otherwise}\n\\end{cases}\n```\n\n### 11.4.4.3 Optimization\n\
    \n**E-Step**:\n\n```math\nγ_{jk}^{(i+1)} = \\begin{cases}\n1, & \\text{if } \\\
    | x_j - μ_k^{(i)} \\|_2^2 \\text{ is minimal for } μ_k^{(i)} \\\\\n0, & \\text{otherwise}\n\
    \\end{cases}\n```\n\n**M-Step**:\n\n```math\nμ_k^{(i+1)} = \\frac{∑_{j=1}^N γ_{jk}^{(i+1)}\
    \ x_j}{∑_{j=1}^N γ_{jk}^{(i+1)}}  (11.28)\n```\n\n### 11.4.4.4 Tricks\n\n**Choosing\
    \ the initial centroids (seeds)**\n\n1. **K-means++**. The intuition that spreading\
    \ out the `k` initial cluster centers is a good thing is behind this approach:\
    \ the first cluster center is chosen uniformly at random from the data points\
    \ that are being clustered, after which each subsequent cluster center is chosen\
    \ from the remaining data points with probability proportional to its squared\
    \ distance from the point's closest existing cluster center. The exact algorithm\
    \ is as follows:\n   a. Choose one center uniformly at random from among the data\
    \ points.\n   b. For each data point `x`, compute `D(x)`, the distance between\
    \ `x` and the nearest center that has already been chosen.\n   c. Choose one new\
    \ data point at random as a new center, using a weighted probability distribution\
    \ where a point `x` is chosen with probability proportional to `D(x)^2`.\n   d.\
    \ Repeat Steps 2 and 3 until `k` centers have been chosen.\n   e. Now that the\
    \ initial centers have been chosen, proceed using standard k-means clustering.\n\
    \n2. TODO\n\n## 11.4.5 EM for mixture of experts\n\nTODO\n\n## 11.4.6 EM for DGMs\
    \ with hidden variables\n\n## 11.4.7 EM for the Student distribution\n\n## 11.4.8\
    \ EM for probit regression\n\n## 11.4.9 Derivation of the Q function (Jensen's\
    \ inequality)\n\nLet `f` be a convex function (see Section A.1) defined on a convex\
    \ set `S`. If `x_1, x_2, ..., x_n ∈ S` and `λ_1, λ_2, ..., λ_n ≥ 0` with `∑_{i=1}^n\
    \ λ_i = 1`, then:\n\n```math\nf(∑_{i=1}^n λ_i x_i) ≤ ∑_{i=1}^n λ_i f(x_i)  (11.29)\n\
    ```\n\n**Proposition 11.1**.\n\n```math\nlog(∑_{i=1}^n λ_i x_i) ≥ ∑_{i=1}^n λ_i\
    \ log(x_i)  (11.30)\n```\n\nNow let's prove why the Q function should look like\
    \ Equation 11.13:\n\n```math\nℓ(θ) = log P(D | θ)\n     = log ∑_z P(D, z | θ)\n\
    \     = log ∑_z P(D | z, θ) P(z | θ)\n     = log ∑_z \\frac{P(z | D, θ^(t-1))\
    \ P(D | z, θ) P(z | θ)}{P(z | D, θ^(t-1))}\n     = log ∑_z P(z | D, θ^(t-1)) \\\
    frac{P(D | z, θ) P(z | θ)}{P(z | D, θ^(t-1)) P(D | θ^(t-1))} P(D | θ^(t-1))\n\
    \     ≥ ∑_z P(z | D, θ^(t-1)) log \\frac{P(D | z, θ) P(z | θ)}{P(z | D, θ^(t-1))\
    \ P(D | θ^(t-1))}\n     = ∑_z P(z | D, θ^(t-1)) log \\frac{P(D | z, θ) P(z | θ)}{P(z\
    \ | D, θ^(t-1))} - log P(D | θ^(t-1))\n```\n\n![Figure 11.4: Graphical interpretation\
    \ of a single iteration of the EM algorithm: The function B(θ, θ^(t-1)) is bounded\
    \ above by the log likelihood function ℓ(θ). The functions are equal at θ = θ^(t-1).\
    \ The EM algorithm chooses θ^t as the value of θ for which B(θ, θ^(t-1)) is a\
    \ maximum. Since ℓ(θ) ≥ B(θ, θ^(t-1)), increasing B(θ, θ^(t-1)) ensures that the\
    \ value of the log likelihood function ℓ(θ) is increased at each step.](image_rsrc1RT.jpg)\n\
    \n```math\nB(θ, θ^(t-1)) ≜ ∑_z P(z | D, θ^(t-1)) log \\frac{P(D | z, θ) P(z |\
    \ θ)}{P(z | D, θ^(t-1)) P(D | θ^(t-1))}\n```\n\nSince the expected complete data\
    \ log likelihood `Q` is derived from `B(θ, θ^(t-1))` by dropping terms which are\
    \ constant w.r.t. `θ`, so it is also a lower bound to a lower bound of `ℓ(θ)`.\n\
    \n```math\nθ^t = \\arg \\max_θ B(θ, θ^(t-1))\n    = \\arg \\max_θ [ℓ(θ^(t-1))\
    \ + ∑_z P(z | D, θ^(t-1)) log \\frac{P(D | z, θ) P(z | θ)}{P(z | D, θ^(t-1)) P(D\
    \ | θ^(t-1))}]\n    = \\arg \\max_θ ∑_z P(z | D, θ^(t-1)) log [P(D | z, θ) P(z\
    \ | θ)]\n```\n\n## 11.4.10 Convergence of the EM Algorithm\n\n### 11.4.10.1 Expected\
    \ complete data log likelihood is a lower bound\n\nNote that `ℓ(θ) ≥ B(θ, θ^(t-1))`,\
    \ and `ℓ(θ^(t-1)) = B(θ^(t-1), θ^(t-1))`, which means `B(θ, θ^(t-1))` is a lower\
    \ bound of `ℓ(θ)`. If we maximize `B(θ, θ^(t-1))`, then `ℓ(θ)` gets maximized.\n\
    \n### 11.4.10.2 EM monotonically increases the observed data log likelihood\n\n\
    Now drop terms which are constant w.r.t. `θ`:\n\n```math\nθ^t = \\arg \\max_θ\
    \ ∑_z P(z | D, θ^(t-1)) log [P(D | z, θ) P(z | θ)]\n```\n\n## 11.4.11 Generalization\
    \ of EM Algorithm\n"
  trans: "\n# EM 算法\n\n为了执行 MAP 估计，我们按如下方式修改 M 步：\n\n**输入**：观测数据 `D = {x1, x2, ...,\
    \ xN}`，联合分布 `P(x, z | θ)`\n\n**输出**：模型参数 `θ`\n\n```text\n// 1. 确定隐变量 z，写出对数似然函数\
    \ ℓ(x, z | θ)\nθ(0) = ... // 初始化\n\nwhile (!convergency) do\n    // 2. E 步：代入\
    \ P(x, z | θ)，推导 Q(θ, θ^(t-1)) 的公式\n    Q(θ, θ^(t-1)) = E[ℓc(θ) | D, θ^(t-1)]\n\
    \n    // 3. M 步：寻找使 Q(θ, θ^(t-1)) 取得最大值的 θ\n    θ^t = arg max Q(θ, θ^(t-1))\n\
    \          θ\nend\n```\n\n**算法 3**：EM 算法\n\n下面我们将解释如何针对几个简单模型执行 E 步和 M 步，这应该能让事情更清晰。\n\
    \n## 11.4.3 高斯混合模型的 EM 算法\n\n### 11.4.3.1 辅助函数\n\n```math\nQ(θ, θ^(t-1)) = E_{z|D,\
    \ θ^(t-1)}[ℓc(θ)]\n             = E_{z|D, θ^(t-1)}[∑_{i=1}^N log p(x_i, z_i |\
    \ θ)]\n             = E_{z|D, θ^(t-1)}[∑_{i=1}^N log ∏_{k=1}^K (π_k p(x_i | θ_k))^{I(z_i=k)}]\n\
    \             = ∑_{i=1}^N ∑_{k=1}^K E[I(z_i = k)] log[π_k p(x_i | θ_k)]\n    \
    \         = ∑_{i=1}^N ∑_{k=1}^K p(z_i = k | x_i, θ^(t-1)) log[π_k p(x_i | θ_k)]\n\
    \             = ∑_{i=1}^N ∑_{k=1}^K r_{ik} log π_k + ∑_{i=1}^N ∑_{k=1}^K r_{ik}\
    \ log p(x_i | θ_k)  (11.16)\n```\n\n其中 `r_{ik} ≜ E[I(z_i = k)] = p(z_i = k | x_i,\
    \ θ^(t-1))` 是簇 `k` 对数据点 `i` 承担的**责任度**。这在下面描述的 E 步中计算。\n\n```math\nθ^t = arg max\
    \ Q(θ, θ^(t-1)) + log p(θ)  (11.15)\n      θ\n```\n\n### 11.4.3.2 E 步\n\nE 步保持不变。E\
    \ 步具有以下简单形式，对于任何混合模型都相同：\n\n```math\nr_{ik} = p(z_i = k | x_i, θ^(t-1)) = \\frac{p(z_i\
    \ = k, x_i | θ^(t-1))}{p(x_i | θ^(t-1))}  (11.17)\n       = \\frac{π_k p(x_i |\
    \ θ_k^(t-1))}{∑_{k'=1}^K π_{k'} p(x_i | θ_{k'}^(t-1))}\n```\n\n### 11.4.3.3 M\
    \ 步\n\n在 M 步中，我们针对 `π` 和 `θ_k` 优化 `Q`。对于 `π`，将仅依赖于 `π` 的项归类在一起，我们发现需要最大化 `∑_{i=1}^N\
    \ ∑_{k=1}^K r_{ik} log π_k`。然而，存在一个额外约束 `∑_{k=1}^K π_k = 1`，因为它们代表概率 `π_k = P(z_i\
    \ = k)`。为了处理该约束，我们构建拉格朗日函数：\n\n```math\nL(π) = ∑_{i=1}^N ∑_{k=1}^K r_{ik} log\
    \ π_k + β(∑_{k=1}^K π_k - 1)\n```\n\n其中 `β` 是拉格朗日乘子。求导后，我们得到：\n\n```math\nπ_k\
    \ = \\frac{∑_{i=1}^N r_{ik}}{N}  (11.18)\n```\n\n这对任何混合模型都适用，而 `θ_k` 则取决于 `p(x\
    \ | θ_k)` 的形式。\n\n对于 `θ_k`，将概率密度函数代入公式 11.16：\n\n```math\nQ(θ, θ^(t-1)) = ∑_{i=1}^N\
    \ ∑_{k=1}^K r_{ik} log π_k - \\frac{1}{2} ∑_{i=1}^N ∑_{k=1}^K r_{ik} [log |Σ_k|\
    \ + (x_i - μ_k)^T Σ_k^{-1} (x_i - μ_k)]\n```\n\n对 `Q` 分别求 `μ_k`、`Σ_k` 的偏导数并令其等于\
    \ 0，可得：\n\n```math\n\\frac{∂Q}{∂μ_k} = -\\frac{1}{2} ∑_{i=1}^N r_{ik} [(Σ_k^{-1}\
