    \ | 分类 | 生成 | 参数 | 第 10.2.1 节 |\n| 线性回归 | 回归 | 判别 | 参数 | 第 1.4.5, 7.3, 7.6 节 |\n\
    | 逻辑回归 | 分类 | 判别 | 参数 | 第 1.4.6, 8.2.1.1, 8.4.3, 21.8.1.1 节 |\n| 稀疏线性/逻辑回归 | 两者\
    \ | 判别 | 参数 | 第 13 章 |\n| 专家混合模型 | 两者 | 判别 | 参数 | 第 11.2.4 节 |\n| 多层感知机 (MLP)/神经网络\
    \ | 两者 | 判别 | 参数 | 第 16 章 |\n| 条件随机场 (CRF) | 分类 | 判别 | 参数 | 第 19.6 节 |\n| K 近邻分类器\
    \ | 分类 | 两者 | 非参数 | 第 14.7.3 节 |\n| (无限) 混合判别分析 | 两者 | 生成 | 非参数 | 第 16.2 节 |\n\
    | 分类与回归树 (CART) | 两者 | 判别 | 非参数 | 第 16.4 节 |\n| 提升模型 | 两者 | 判别 | 非参数 | 第 14.3.2\
    \ 节 |\n| 稀疏核化线性/逻辑回归 (SKLR) | 两者 | 判别 | 非参数 | 第 14.3.2 节 |\n| 相关向量机 (RVM) | 两者\
    \ | 判别 | 非参数 | 第 14.5 节 |\n| 支持向量机 (SVM) | 两者 | 判别 | 非参数 | 第 15 章 |\n| 高斯过程 (GP)\
    \ | 两者 | 判别 | 非参数 | 第 15.4.6 节 |\n| 平滑样条 | 回归 | 判别 | 非参数 | 第 15.4.6 节 |\n\n*列：模型名称；适用于分类、回归或两者；生成式或判别式；参数化或非参数化；本书讨论该模型的章节列表。另请参阅\
    \ [PMTK Tutorial](http://pmtk3.googlecode.com/svn/trunk/docs/tutorial/html/tutSupervised.html)\
    \ 了解这些模型的 PMTK 对应实现。*\n\n## 8.6.2 处理缺失数据\n\n有时部分输入源（`x` 的部分）未被观测到；这可能是由于传感器故障，或调查中未能完成某一部分等原因造成。这被称为缺失数据问题。以原则性方式处理缺失数据的能力可能是生成式模型最大的优势。\n\
    \n为了形式化我们的假设，我们可以关联一个二元响应变量 `ri ∈ {0,1}`，指示每个值 `xi` 是否被观测到。联合模型具有以下结构：\n\n`p(xi,\
    \ ri | θ, ϕ) = p(ri | xi, ϕ) p(xi | θ)`\n\n其中 `ϕ` 是控制事物是否被观测到的参数。\n\n*   **MCAR\
    \ (完全随机缺失)：** 如果我们假设 `p(ri | xi, ϕ) = p(ri | ϕ)`，我们称数据为完全随机缺失。\n*   **MAR (随机缺失)：**\
    \ 如果我们接受 `p(ri | xi, ϕ) = p(ri | xo, ϕ)`，其中 `xo` 是 `xi` 的观测部分，我们称数据为随机缺失。\n\n\
    任何生成式概率模型（例如 HMM、玻尔兹曼机、贝叶斯网络等）都可以通过将其用作类条件密度来转化为分类器。\n\n"
