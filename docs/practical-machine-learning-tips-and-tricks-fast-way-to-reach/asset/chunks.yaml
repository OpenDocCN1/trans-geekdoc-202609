    \ | K | n | `x ∈ {0,1,...,n}^K, ∑_{k=1}^K x_k = n` |\n\n**Table 2.2: Summary of\
    \ Bernoulli, binomial, multinoulli and multinomial distributions.**\n\n| Name\
