    \n```\nmean = μ, mode = μ, Cov = ν/(ν-2) Σ\n```\n\n## 2.5.4 狄利克雷分布\n\nBeta 分布的多元推广是狄利克雷分布，其支撑集是概率单纯形，定义为：\n\
