    \ f(u,v) du dv  (continuous)\n```\n\n**Marginal PMF and PDF**:\n```\nP(X = x_i)\
    \ = ∑_{j=1}^{+∞} P(X = x_i, Y = y_j)  (discrete)\nf_X(x) = ∫_{-∞}^{+∞} f(x,y)\
    \ dy  (continuous)\n```\n\n```\nP(Y = y_j) = ∑_{i=1}^{+∞} P(X = x_i, Y = y_j)\
    \  (discrete)\nf_Y(y) = ∫_{-∞}^{+∞} f(x,y) dx  (continuous)\n```\n\n### 2.2.2.3\
    \ Conditional distribution\n\n**Conditional PMF**:\n```\np(X = x_i | Y = y_j)\
    \ = p(X = x_i, Y = y_j) / p(Y = y_j)  if p(Y) > 0  (2.9)\n```\nThe pmf `p(X|Y)`\
    \ is called contingent likelihood.\n\n**Conditional PDF**:\n```\nf_{X|Y}(x|y)\
    \ = f(x,y) / f_Y(y)  (2.10)\n```\n\n### 2.2.3 Bayes rule\n\n```\np(Y = y | X =\
    \ x) = p(X = x, Y = y) / p(X = x)\np(X = x | Y = y) p(Y = y) / ∑_{y'} p(X = x\
    \ | Y = y') p(Y = y')  (2.11)\n```\n\n### 2.2.4 Independence and conditional independence\n\
    \nWe say `X` and `Y` are unequivocally autonomous or hardly free, signified `X\
    \ ⊥ Y`, in the event that we can address the joint as the result of the two marginals,\
    \ i.e.,\n```\nP(X,Y) = P(X)P(Y)  (2.12)\n```\n\nWe say `X` and `Y` are restrictively\
    \ independent (CI) given `Z` in case the contingent joint can be composed as a\
    \ result of contingent marginals:\n```\nX ⊥ Y | Z = P(X,Y|Z) = P(X|Z)P(Y|Z)  (2.13)\n\
    ```\n\n### 2.2.5 Quantiles\n\nSince the cdf `F` is a monotonically expanding capacity,\
    \ it has a converse; let us indicate this by `F^{-1}`. If `F` is the cdf of `X`,\
    \ then `F^{-1}(α)` is the value of `x_α` such that `P(X ≤ x_α) = α`; this is called\
    \ the `α`-quantile of `F`. The worth `F^{-1}(0.5)` is the median of the circulation,\
