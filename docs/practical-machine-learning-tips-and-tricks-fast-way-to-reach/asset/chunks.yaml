    我们将公式 14.19 称为核化特征向量。注意在这种方法中，核不必是 Mercer 核。我们可以通过定义 $p(y|x,\theta) = \text{Ber}(y|w^T
    \phi(x))$ 将核化特征向量用于逻辑回归。这提供了一种定义非线性决策边界的简单方法。例如，见图 14.1。我们也可以通过定义 $p(y|x,\theta)
    = \mathcal{N}(y|w^T \phi(x), \sigma^2)$ 在线性回归模型中使用核化特征向量。


