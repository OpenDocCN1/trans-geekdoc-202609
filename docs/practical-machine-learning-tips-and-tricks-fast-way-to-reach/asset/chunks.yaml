  trans: "\n\n# 3.2.2 先验\n\n先验是由人类而非机器选择的，因此它是抽象的。先验的主观性是有争议的。例如，一个年轻人和一位数学相关的教师将会得出不同的结论。由于概率项严重依赖于\
    \ `N`，而先验保持稳定，随着我们获得越来越多的数据，MAP 估计将趋向于最大似然估计或 MLE：\n\n```\nhMLE ≜ arg max_h p(D|h)\
    \ = arg max_h log p(D|h)  (3.6)\n```\n\n换句话说，假设我们有足够的数据，我们会看到数据压倒了先验。\n\n14 http://en.wikipedia.org/wiki/Occam%27s_razor\n\
    \n# 3.2.4 后验预测分布\n\n后验预测分布的概念通常用于贝叶斯设定中，它利用给定观测数据的参数的整个后验分布，产生一个区间上的概率分布，而不仅仅是一个点估计。\n\
    \n```\np(x̃|D) = E_{h|D}[p(x̃|h)] = ∑_h p(x̃|h)p(h|D)  (3.7)\n       = ∫ p(x̃|h)p(h|D)dh\n\
    ```\n\n这仅仅是每个单独假设预测的加权平均，被称为贝叶斯模型平均。\n\n```\np(θ|Da,Db) = p(θ,Db|Da) / p(Da) ∝\
    \ p(θ,Db|Da)\n           = p(Db,θ|Da)\n           = p(Db|θ)p(θ|Da)\n         \
    \  = Bin(Nb1|θ, Nb1+Nb0) Beta(θ|Na1+a, Na0+b)\n           = Beta(θ|Na1+Nb1+a,\
    \ Na0+Nb0+b)  (3.10 and 2.19 combined)\n```\n\n这使得贝叶斯推断特别适合在线学习，稍后我们将看到。\n\n#\
    \ 3.3 Beta-二项模型\n\n## 3.3.1 似然\n\n给定 `X ~ Bin(θ)`，`D` 的概率由下式给出\n\n```\np(D|θ)\
    \ = Bin(N1|N,θ)  (3.8)\n```\n\n如果我们使用均匀先验，那么 MAP 估计将简化为 MLE：\n\n```\nθ_MAP ∝ θ_MLE\
    \ = N1/N  (3.13)\n```\n\n## 3.3.2 先验\n\n```\nBeta(θ|a,b) ∝ θ^{a-1}(1-θ)^{b-1}\
    \  (3.9)\n```\n\n先验的参数被称为超参数。\n\n我们现在将展示后验均值是先验均值和 MLE 的凸组合，这体现了后验是在我们先前所信和数据告诉我们的之间进行折衷。\n\
    \n## 3.3.3 后验\n\n```\np(θ|D) ∝ Bin(N1|N1+N0,θ) Beta(θ|a,b)\n       = Beta(θ|N1+a,\
    \ N0+b)  (3.10)\n```\n\n请注意，依次更新后验等同于一次性批量更新。为了说明这一点，假设我们有两个数据集 `Da` 和 `Db`，其充分统计量分别为\
    \ `Na1, Na0` 和 `Nb1, Nb0`。令 `N1 = Na1+Nb1` 和 `N0 = Na0+Nb0` 为合并数据集的充分统计量。在批量模式下我们有\n\
    \n### 3.3.3.1 后验均值和众数\n\n根据表 2.7，后验均值由下式给出\n\n```\nθ̄ = (a+N1) / (a+b+N)  (3.11)\n\
    ```\n\n众数由下式给出\n\n```\nθ̂_MODE = (a+N1-1) / (a+b+N-2)  (3.12)\n```\n\n### 3.3.3.2\
    \ 后验波动\n\n均值和众数是点估计，但了解我们能在多大程度上信任它们是有帮助的。后验的方差是衡量这一点的一种方法。\n\nBeta 后验的方差由下式给出\n\
