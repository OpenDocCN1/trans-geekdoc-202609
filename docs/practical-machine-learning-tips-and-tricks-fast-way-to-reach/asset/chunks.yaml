    ### 10.1.2 Conditional independence


    `X` and `Y` are conditionally independent given `Z`, denoted `X ⊥ Y|Z`, iff the
    conditional joint can be written as a product of conditional marginals, i.e.


    ```

    X ⊥ Y|Z ⇐⇒ p(X,Y|Z) = p(X|Z)p(Y|Z) (10.2)

    ```


    A directed graphical model or DGM is a GM whose graph is a DAG. These are more
    commonly known as Bayesian networks. However, there is nothing inherently Bayesian
    about Bayesian networks: they are just a way of defining probability distributions.
    These models are also called belief networks. The term belief here refers to subjective
    probability. Once again, there is nothing inherently subjective about the kinds
    of probability distributions represented by DGMs.


    #### Ordered Markov property


    ```

    xs ⊥ xpred(s) | xpa(s) (10.5)

    ```


    where `pa(s)` are the parents of nodes, and `pred(s)` are the predecessors of
    nodes in the DAG.


