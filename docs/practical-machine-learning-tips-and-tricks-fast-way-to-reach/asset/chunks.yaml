    \ 时熵最大；在这种情况下，`H(X) = log2 K`。相反，熵最小（为零）的分布是将所有质量集中在一个状态上的任意 Delta 函数。这种分布没有不确定性。\n\
    \n可以证明（Cover and Thomas 2006），交叉熵是指当我们使用模型 `q` 来构建码本时，对来自分布 `p` 的源进行编码所需的平均比特数。因此，普通熵\
    \ `H(p) = H(p,p)`（定义见 §2.8.1 节）是在我们使用真实模型时的平均比特数，所以 KL 散度就是这两者之间的差异。换句话说，KL 散度是由于我们使用分布\
    \ `q` 而非真实分布 `p` 来编码数据而导致的额外平均比特数。额外比特数这一理解应能说明 `KL(p||q) ≥ 0`，且仅当 `q = p` 时 KL\
    \ 散度等于零。\n\n我们现在给出这一重要结果的证明。\n\n**定理 2.1.（数据差异/不等式）** `KL(p||q) ≥ 0`，当且仅当 `p =\
