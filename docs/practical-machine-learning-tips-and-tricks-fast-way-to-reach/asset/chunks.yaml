  fmt: "\n# 因子分析\n\n## 12.1 因子分析模型\n\n我们看到因子分析（FA）使用低秩分解来近似可见向量的协方差矩阵：\n\n$$p(z_i)\
    \ = \\mathcal{N}(z_i | 0, I) \\tag{12.4}$$\n$$p(x_i | z_i, \\theta) = \\mathcal{N}(x_i\
    \ | W z_i + \\mu, \\Psi) \\tag{12.5}$$\n$$C = \\text{cov}[x] = W W^T + \\Psi \\\
    tag{12.6}$$\n\n如果观测值也是连续的，即 $x_i \\in \\mathbb{R}^D$，我们可以对似然使用高斯分布。就像在线性回归中一样，我们假设均值是（隐藏）输入的线性函数，从而得到：\n\
    \n$$p(z_i) = \\mathcal{N}(z_i | \\mu_0, \\Sigma_0) \\tag{12.1}$$\n$$p(x_i | z_i,\
    \ \\theta) = \\mathcal{N}(x_i | W z_i + \\mu, \\Psi) \\tag{12.2}$$\n\n这仅使用 $O(LD)$\
    \ 个参数，这在具有 $O(D^2)$ 个参数的全协方差高斯分布和具有 $O(D)$ 个参数的对角协方差之间提供了灵活的折中。注意，如果我们不限制 $\\\
    Psi$ 为对角矩阵，我们可以将 $\\Psi$ 简单地设为全协方差矩阵；然后我们可以设置 $W = 0$，在这种情况下不需要潜在因子。\n\n其中 $W$\
    \ 是一个 $D \\times L$ 矩阵，称为**因子载荷矩阵**，$\\Psi$ 是一个 $D \\times D$ 协方差矩阵。我们取 $\\Psi$\
    \ 为对角矩阵，因为模型的全部意义在于强制 $z_i$ 来解释相关性，而不是将其内置到观测值的协方差中。这个整体模型称为**因子分析**（FA）。$\\Psi\
    \ = \\sigma^2 I$ 的特殊情况称为**概率主成分分析**（PPCA）。这个名称的原因稍后将变得明显。\n\n### 12.1.1 FA 是多元正态分布的低秩参数化\n\
    \nFA 可以被认为是一种使用少量参数在 $x$ 上指定联合密度模型的方法。要理解这一点，请注意根据公式 4.39，诱导的边缘分布 $p(x_i | \\\
    theta)$ 是高斯分布：\n\n$$p(x_i | \\theta) = \\int \\mathcal{N}(x_i | W z_i + \\mu,\
    \ \\Psi) \\mathcal{N}(z_i | \\mu_0, \\Sigma_0) dz_i = \\mathcal{N}(x_i | W \\\
    mu_0 + \\mu, \\Psi + W \\Sigma_0 W^T) \\tag{12.3}$$\n\n### 12.1.2 潜在因子的推断\n\n\
    $$p(z_i | x_i, \\theta) = \\mathcal{N}(z_i | \\mu_i, \\Sigma_i) \\tag{12.7}$$\n\
    $$\\Sigma_i = (\\Sigma_0^{-1} + W^T \\Psi^{-1} W)^{-1} \\tag{12.8}$$\n$$= (I +\
    \ W^T \\Psi^{-1} W)^{-1} \\tag{12.9}$$\n$$\\mu_i = \\Sigma_i [W^T \\Psi^{-1} (x_i\
    \ - \\mu) + \\Sigma_0^{-1} \\mu_0] \\tag{12.10}$$\n$$= \\Sigma_i W^T \\Psi^{-1}\
    \ (x_i - \\mu) \\tag{12.11}$$\n\n注意在 FA 模型中，$\\Sigma_i$ 实际上与 $i$ 无关，因此我们可以用 $\\\
    Sigma$ 表示它。计算此矩阵需要 $O(L^3 + L^2 D)$ 时间，计算每个 $\\mu_i = \\mathbb{E}[z_i | x_i, \\\
    theta]$ 需要 $O(L^2 + LD)$ 时间。$\\mu_i$ 有时被称为**潜在得分**或**潜在因子**。\n\n### 12.1.3 不可识别性\n\
    \n就像混合模型一样，FA 也是不可识别的。要理解这一点，假设 $R$ 是一个任意的正交旋转矩阵，满足 $R R^T = I$。让我们定义 $\\tilde{W}\
    \ = W R$，那么这个修改后矩阵的似然函数与未修改矩阵的相同，因为 $\\tilde{W} \\tilde{W}^T + \\Psi = W R R^T\
    \ W^T + \\Psi = W W^T + \\Psi$。从几何上讲，用正交矩阵乘以 $W$ 就像在生成 $x$ 之前旋转 $z$。为了确保唯一解，我们需要移除\
    \ $L(L-1)/2$ 个自由度，因为这是 $L \\times L$ 正交矩阵的数量。\n\n总的来说，FA 模型有 $D + LD - L(L-1)/2$\
    \ 个自由参数（不包括均值），其中第一项来自 $\\Psi$。显然我们要求这小于或等于 $D(D+1)/2$，这是无约束（但对称）协方差矩阵中的参数数量。这给出了\
    \ $L$ 的上界：\n\n$$L_{\\text{max}} = D + 0.5(1 - \\sqrt{1 + 8D}) \\tag{12.12}$$\n\
    \n例如，$D = 6$ 意味着 $L \\le 3$。但我们通常从不选择这个上界，因为它会导致过拟合（参见第 12.3 节关于如何选择 $L$ 的讨论）。不幸的是，即使我们设置\
    \ $L < L_{\\text{max}}$，我们仍然无法唯一识别参数，因为旋转模糊性仍然存在。不可识别性不影响模型的预测性能。然而，它确实影响载荷矩阵，从而影响潜在因子的解释。由于因子分析常用于发掘数据中的结构，因此需要解决这个问题。以下是一些常用的解决方案：\n\
    \n*   **强制 $W$ 为正交规范化** 解决识别性问题最清晰的方法可能是强制 $W$ 为正交规范化，并按相应潜在因子方差的降序排列列。这是 PCA\
    \ 采用的方法，我们将在第 12.2 节讨论。结果不一定更具可解释性，但至少是唯一的。\n*   **强制 $W$ 为下三角矩阵** 实现识别性的一种方法，在贝叶斯社区很流行（例如\
    \ Lopes and West 2004），是确保第一个可见特征仅由第一个潜在因子生成，第二个可见特征仅由前两个潜在因子生成，依此类推。例如，如果 $L\
    \ = 3$ 且 $D = 4$，对应的因子载荷矩阵由下式给出：\n    $$W = \\begin{pmatrix} w_{11} & 0 & 0 \\\
    \\ w_{21} & w_{22} & 0 \\\\ w_{31} & w_{32} & w_{33} \\\\ w_{41} & w_{42} & w_{43}\
    \ \\end{pmatrix}$$\n    我们还要求 $w_{jj} > 0$ 对于 $j = 1:L$ 成立。这个受约束矩阵中的参数总数是 $D +\
    \ DL - L(L-1)/2$，等于可唯一识别参数的数量。这种方法的缺点是前 $L$ 个可见变量（称为**奠基变量**）影响潜在因子的解释，因此必须仔细选择。\n\
    *   **权重上的稀疏性促进先验** 我们可以不预先指定 $W$ 中哪些条目为零，而是使用 $\\ell_1$ 正则化 (Zou et al. 2006)、ARD\
    \ (Bishop 1999; Archambeau and Bach 2008) 或尖峰-平板先验 (Rattray et al. 2009) 来鼓励条目为零。这称为**稀疏因子分析**。这不一定确保唯一的\
    \ MAP 估计，但确实鼓励可解释的解。见第 13.8 节 TODO。\n*   **选择一个启发性的枢轴网格** 有一系列启发式技术试图找到旋转矩阵 $R$，可用于修改\
    \ $W$（以及随后的潜在变量）以尝试提高可解释性，通常通过鼓励它们（近似）稀疏。一种著名的策略称为 **varimax** (Kaiser 1958)。\n\
    *   **对潜在因子使用非高斯先验** 在第 12.6 节中，我们将讨论如何用非高斯分布替换 $p(z_i)$ 可以使我们有时唯一地识别 $W$ 以及潜在变量。这种方法称为\
    \ **ICA**。\n\n### 12.1.4 因子分析器混合模型\n\nFA 模型假设数据存在于低维线性流形上。实际上，大多数数据最好用某种形式的低维弯曲流形来建模。我们可以用分段线性流形来近似弯曲流形。这提出了以下模型：设第\
    \ $k$ 个维度为 $L_k$ 的线性子空间由 $W_k$ 表示，对于 $k = 1:K$。\n\n假设我们有一个潜在指示器 $q_i \\in \\{1,\
    \ \\dots, K\\}$ 指示我们应该使用哪个子空间来生成数据。然后我们从高斯先验中采样 $z_i$ 并将其通过 $W_k$ 矩阵（其中 $k = q_i$），并添加噪声。更准确地说，模型如下：\n\
    \n$$p(q_i | \\theta) = \\text{Cat}(q_i | \\pi) \\tag{12.13}$$\n$$p(z_i | \\theta)\
    \ = \\mathcal{N}(z_i | 0, I) \\tag{12.14}$$\n$$p(x_i | q_i = k, z_i, \\theta)\
    \ = \\mathcal{N}(x_i | W_k z_i + \\mu_k, \\Psi) \\tag{12.15}$$\n\n这被称为**因子分析器混合模型**（MFA）(Hinton\
    \ et al. 1997)。\n\n另一种思考这个模型的方式是作为高斯混合模型的低秩版本。具体来说，该模型需要 $O(KLD)$ 个参数，而不是全协方差高斯混合模型所需的\
    \ $O(KD^2)$ 个参数。这可以减少过拟合。事实上，MFA 是高维实值数据的一个很好的通用密度模型。\n"
